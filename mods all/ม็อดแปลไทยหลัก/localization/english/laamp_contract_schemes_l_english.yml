 laamp_base_contract_schemes.1301.desc.intro.farmlands: "พื้นที่เกษตรกรรมอันเขียวชอุ่มของ [current_county.GetBaseNameNoTier]"
 laamp_base_contract_schemes.1301.desc.intro.hills: "เนินเขาขรุขระของ [current_county.GetBaseNameNoTier]"
