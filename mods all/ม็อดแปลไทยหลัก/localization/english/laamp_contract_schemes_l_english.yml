 laamp_base_contract_schemes.2542.t.crit_win: "$laamp_base_contract_schemes.2011.t$: ความสำเร็จพิเศษ"
 laamp_base_contract_schemes.2542.t.win: "$laamp_base_contract_schemes.2011.t$: สำเร็จ!"
 laamp_base_contract_schemes.2542.t.fail: "$laamp_base_contract_schemes.2011.t$: ล้มเหลว!"
 laamp_base_contract_schemes.2542.t.crit_fail: "$laamp_base_contract_schemes.2011.t$: ความล้มเหลวพิเศษ"
 laamp_base_contract_schemes.2542.desc.intro: "ผู้แทนของ [employer.GetTitledFirstName] พบเราใน [location.GetBaseNameNoTier] เมื่อเราเสร็จสิ้น รับมัดบันทึกที่รวบรวมมาอย่างหนาของเราไปด้วยความสนใจ\n\n"
 laamp_base_contract_schemes.2542.desc.method.own_skill.honest.win: ""งานยอดเยี่ยม [ROOT.Char.GetTitledFirstNameNoTooltip]! แม้จะมองเพียงผิวเผินก็แสดงให้เห็นถึงความใส่ใจและความใส่ใจในรายละเอียดอย่างยิ่ง — [employer.GetTitleAsNameNoTooltip] จะปลาบปลื้มอย่างยิ่ง!" ข้าก้มศีรษะลงเล็กน้อยอย่างสง่างามต่อคำชม และคนรับใช้ก็ทำท่าให้รางวัลของเราถูกนำออกมา"
 laamp_base_contract_schemes.2542.desc.method.quartermasters_stressed_and_wreckt.win: ""ไม่ว่าท่านจะให้ใครทำงานนี้ให้ท่าน [ROOT.Char.GetTitledFirstNameNoTooltip] พวกเขาก็ทำงานได้ #EMP ยอดเยี่ยม#! อย่างยิ่ง" คนรับใช้ผิวปาก " [employer.GetTitleAsNameNoTooltip] จะปลาบปลื้มอย่างยิ่ง" เบื้องหลังข้า [officer.GetTitledFirstName] ถูขมับของ [officer.GetHerHis] เห็นได้ชัดว่าเหนื่อยล้าจากแรงงานของ [officer.GetHerHis] แม้ว่ารางวัลของเราจะถูกนำมาให้"
 laamp_base_contract_schemes.2542.desc.method.quartermasters_skill_sans_stress.win: ""ไม่ว่าท่านจะให้ใครทำงานนี้ให้ท่าน [ROOT.Char.GetTitledFirstNameNoTooltip] พวกเขาก็ทำงานได้ #EMP ยอดเยี่ยม#! อย่างยิ่ง" คนรับใช้ผิวปาก " [employer.GetTitleAsNameNoTooltip] จะพอใจอย่างยิ่ง" ที่ไหล่ของข้า [officer.GetTitledFirstName] ยืนตัวตรงขึ้นเล็กน้อย เปี่ยมไปด้วยความภาคภูมิใจเงียบ ๆ ขณะที่รางวัลของเราถูกนำออกมาให้เรา"
 laamp_base_contract_schemes.2542.desc.method.combi_own_skill_and_quartermasters.win: ""ท่านทั้งสองช่างเป็นคนรับใช้ที่ขยันขันแข็งเสียนี่กระไร!" คนรับใช้หัวเราะเยาะใส่ [officer.GetTitledFirstName] และตัวข้า "บันทึกเหล่านี้ละเอียดถี่ถ้วนเพียงพอสำหรับ [employer.GetTitleAsNamePossessiveNoTooltip] แม้ แต่ลายมือของท่านก็ยอดเยี่ยม ข้าจะนำค่าจ้างที่สมควรได้รับของท่านมาให้โดยเร็ว""
 laamp_base_contract_schemes.2542.desc.method.own_skill.dishonest.win: ""โดย [employer.GetFaith.KnowledgeGodName] ช่างเป็นขุมทรัพย์ข้อมูลอะไร เช่นนี้ที่ท่านค้นพบ! และ #EMP มากมาย#! เหลือเกินที่คาดไม่ถึงโดยสิ้นเชิง... หากข้าไม่ได้อ่านมันด้วยตาของข้าเองสองข้าง ข้าแทบจะไม่เชื่อเลย [employer.GetTitleAsNameNoTooltip] จะพอใจกับความพยายามของท่านอย่างยิ่ง!""
 laamp_base_contract_schemes.2542.desc.method.own_skill.guessed.win: ""ให้ตายสิ ให้ตายสิ หากบันทึกเหล่านี้ของท่าน #EMP ใกล้เคียง#! กับความถูกต้อง งั้นดูเหมือนว่าความรู้ของเราเกี่ยวกับดินแดนของ [employer.GetTitleAsNamePossessiveNoTooltip] นั้นขาดหายไปอย่างน่าเศร้าจนเราอาจจะต้องสั่งให้มีการสำรวจสำมะโนประชากรที่ละเอียดกว่านี้ทันที งานเยี่ยมยอด!""
 laamp_base_contract_schemes.2542.desc.method.combi_own_skill_dishonest_and_guessed.win: ""โอ้ นี่เป็นข้อเท็จจริงที่ #EMP น่าทึ่ง#! ทีเดียวที่ท่านรวบรวมมา... ข้าต้องสารภาพว่าข้าไม่รู้เรื่องอะไรเกี่ยวกับเรื่องนี้มากนัก ดูเหมือนว่าดินแดนของ [employer.GetTitleAsNamePossessiveNoTooltip] จะมีความหลากหลายมากกว่าที่เราคิดไว้มาก ถึงกระนั้น ก็เป็นงานที่ดีที่ท่านทำ [employer.GetTitleAsNameNoTierNoTooltip] จะพอใจ!""
 laamp_base_contract_schemes.2542.desc.method.mixed.win: ""อืม เอ่อ ข้าเห็นว่า... บันทึก... ของท่านดูเหมือนจะเป็นระเบียบเรียบร้อย พวกมันค่อนข้างผสมปนเป — ท่านทำสิ่งเหล่านี้ได้อย่างไรกันแน่? หรือ อืม ช่างมันเถอะข้าเดา [employer.GetTitleAsNameNoTooltip] จะมีความสุขและนั่นคือทั้งหมดที่สำคัญ""
 laamp_base_contract_schemes.2542.desc.method.own_skill.honest.loss: ""อืม ข้าเห็นว่าท่าน #EMP พยายาม#! อย่างน้อย แต่มีข้อผิดพลาดที่เห็นได้ชัดมากเกินไปในสิ่งเหล่านี้แม้จะมองเพียงผิวเผินก็ไม่สามารถใช้งานได้โดย [employer.GetTitleAsName] ข้าขออภัย แต่ท่านจะไม่ได้รับอะไรเลยสำหรับงานที่เลินเล่อ เช่นนี้ ไม่ว่าท่านจะทุ่มเทความพยายามไปมากเพียงใดก็ตาม""
 laamp_base_contract_schemes.2542.desc.method.quartermasters_stressed_and_wreckt.loss: ""ข้า... ไม่แน่ใจว่าท่านให้ใครจดตามคำบอกหรือดำเนินการสอบถามของท่าน แต่ข้าต้องถามว่า: พวกเขาสืบสายเลือดกันเองหรือเป็นเพียงคนโง่เขลา?"\n\nที่ไหนสักแห่งข้างหลังข้า [officer.GetTitledFirstName] ก็ร้องไห้ออกมา"
 laamp_base_contract_schemes.2542.desc.method.quartermasters_skill_sans_stress.loss: ""ดูสิ ข้าเห็นว่าท่านพยายามแล้ว แต่ใครก็ตามที่ท่านจ่ายเงินให้จดบันทึกเหล่านี้ให้ท่าน... ท่านจ่ายเงินให้พวกเขามากเกินไป"\n\nที่ไหล่ของข้า [officer.GetTitledFirstName] เยาะเย้ยเสียงดัง"
 laamp_base_contract_schemes.2542.desc.method.combi_own_skill_and_quartermasters.loss: "เจ้าหน้าที่ผู้นั้นมองดูบันทึกที่ข้าและ [officer.GetTitledFirstName] รวบรวมมาอย่างยากลำบากด้วยความกังขา [dummy_gender.GetSheHe] พลิกดูทีละหน้าด้วยความเย้ยหยันที่เพิ่มมากขึ้นเรื่อยๆ ก่อนที่สุดท้ายจะโยน [ROOT.Char.Custom('GetWritingMaterial')] ราคาแพงลงบนพื้นอย่างจงใจ แล้วจากไปโดยไม่เอ่ยวาจาใด"
 laamp_base_contract_schemes.2542.desc.method.own_skill.dishonest.loss: "หลังจากตรวจสอบชั่วครู่ [dummy_gender.GetSheHe] ก็เงยหน้าขึ้น: "ท่านคิดว่าพวกเราเป็น #EMP คนโง่#! ใน [employer.GetCapitalLocation.GetTitle.GetNameNoTier] หรือ? คนโง่ที่ท่านสามารถโกหกได้ง่าย ๆ และเราจะไม่สังเกตเห็นอะไรเลย ไม่ว่าการปลอมแปลงของท่านจะโง่เขลาเพียงใดก็ตาม? ท่านจะไม่ได้รับค่าจ้างสำหรับกลฉ้อฉลนี้!""
 laamp_base_contract_schemes.2542.desc.method.own_skill.guessed.loss: ""อะไรกันนี่... ท่าน... ท่าน #EMP ชัดเจน#! อย่างยิ่งว่าเพิ่ง แต่งเรื่องไร้สาระขึ้นมา อะไรดลใจให้ท่านคิดว่าท่านจะสามารถรอดพ้นจากการรีดไถเงินสำหรับสิ่งนี้ได้ ไอ้บ้า[ROOT.Char.GetWomanMan]?"\n\n[dummy_gender.GetWomanMan] ของ [employer.GetTitleAsNamePossessiveNoTooltip] จากไปก่อนที่เราจะสามารถเริ่มประท้วงความบริสุทธิ์ของเราได้"
 laamp_base_contract_schemes.2542.desc.method.combi_own_skill_dishonest_and_guessed.loss: "ใช้เวลาไม่นานที่ [dummy_gender.GetHerHim] จะสังเกตเห็น... #EMP การแก้ปัญหา#! ที่มีหัวการค้าของเราต่อสถานการณ์ที่พยายาม หลังจากดุด่าสั้น ๆ สำหรับความกล้าบ้าบิ่นของเรา [dummy_gender.GetWomanMan] ของ [employer.GetTitleAsNamePossessiveNoTooltip] ก็เดินจากไป"
 laamp_base_contract_schemes.2542.desc.method.mixed.loss: ""ดูสิ ข้าจะพูดตามตรง นี่คือ... ความยุ่งเหยิง ข้าไม่สามารถเข้าใจได้เลยว่าท่าน #EMP พยายาม#! ทำอะไรที่นี่ และข้าคิดว่าเราทั้งคู่รู้ดีว่าท่านไม่สมควรได้รับเหรียญเดียวสำหรับอะไรก็ตาม" [dummy_gender.GetSheHe] ทำท่าปฏิเสธ "#EMP นี่#! คือ.""
 laamp_base_contract_schemes.2542.desc.outro.win: "\n\n[ROOT.Char.GetPrimaryTitle.GetDefinitiveName] ได้รับส่วนที่ครบกำหนดของพวกเขา: หีบใบใหญ่ที่เต็มไปด้วยเหรียญเงินสำหรับความพยายามของเรา"
 laamp_base_contract_schemes.2542.desc.outro.loss: "\n\nวันนี้ [ROOT.Char.GetPrimaryTitle.GetDefinitiveName] กลับไปมือเปล่า"
 laamp_base_contract_schemes.2542.a.crit_win: "ชัยชนะอันยิ่งใหญ่!"
 laamp_base_contract_schemes.2542.a.win: "เป็นงานที่ดีที่เราทำ"
 laamp_base_contract_schemes.2542.a.fail: "บาห์ ปล่อยให้คนอกตัญญูเหล่านี้ไปเถอะ"
 laamp_base_contract_schemes.2542.a.crit_fail: "แท้จริงแล้ว นี่เป็นการเสียเวลาของเรา"

 laamp_base_contract_schemes.2661.t: "$laamp_base_contract_schemes.2031.t$: สถานที่สำคัญในท้องถิ่น"
 laamp_base_contract_schemes.2661.desc: "ข้อพิพาทใน [employer.GetPrimaryTitle.GetBaseNameNoTier] เกิดจากคดีทางกฎหมายเล็กน้อยในท้องถิ่น: นายจ้างของเราตัดสินอย่างโง่เขลาให้สถานที่สำคัญทางธรรมชาติแห่งหนึ่งมีเขตแดนแตกต่างไปจากเดิมเล็กน้อย\n\nทันใดนั้น คดีหลายสิบคดีก็ถูกฟ้องร้องโดยเจ้าของที่ดินรายย่อยและชาวนาผู้มีสิทธิพิเศษ ซึ่งทุกคนมีความคับข้องใจบางอย่างที่เกิดขึ้นจากการเปลี่ยนแปลงคำจำกัดความ"
 laamp_base_contract_schemes.2661.desc.outro: "\n\n[employer.GetTitledFirstName|U] พยายามอย่างยิ่งที่จะแจ้งให้เราทราบว่าเหรียญของเราขึ้นอยู่กับการ ทำให้สถานการณ์นี้สงบลงอย่างรวดเร็วและเงียบเชียบ"
 laamp_base_contract_schemes.2661.a: "นี่ดูเหมือนจะเป็นปัญหาที่ง่ายพอ..."
 laamp_base_contract_schemes.2661.b: "ข้าคิดว่าข้าสามารถแก้ไขปัญหานี้ได้..."
 laamp_base_contract_schemes.2661.b.tt.success: "ท่านหาทางประนีประนอมที่เหมาะสมได้"
 laamp_base_contract_schemes.2661.b.tt.failure: "การเจรจาล้มเหลว"
 laamp_base_contract_schemes.2661.c: "ข้าสงสัยว่าความแม่นยำมีความสำคัญน้อยกว่าความชัดเจนที่นี่"
 laamp_base_contract_schemes.2661.d.sacrifice_exists: "[sacrifice.GetFirstNameNoTooltip|U] จะอยู่เพื่อแก้ไขข้อพิพาทนี้"
 laamp_base_contract_schemes.2661.d.sacrifice_unexists: "อนิจจา ข้าไม่มีคนรับใช้ที่มีทักษะเพียงพอที่จะทิ้งไว้กับท่าน"
 laamp_base_contract_schemes.2661.d.no_valid_char: "ท่านขาด [follower|E] ที่พร้อมใช้งาน ซึ่งมี [intrigue|E] อย่างน้อย [EmptyScope.ScriptValue('laamp_base_contract_schemes_2661_other_skill_threshold_value')|0] เพื่อมอบหมายชั่วคราวให้กับ [court|E] ของ [employer.GetFirstNamePossessive]"
 laamp_base_contract_schemes.2661.d.tt.courtier_stays_here: "[sacrifice.GetFirstName|U] จะถูกยืมตัวไปยัง [court|E] ของ [employer.GetTitledFirstNamePossessive] — [sacrifice.GetSheHe] จะกลับมาหาท่านหลังจากผ่านไป [EmptyScope.ScriptValue('laamp_base_contract_schemes_2661_sacrifice_loan_length_min_value')|0] ถึง [EmptyScope.ScriptValue('laamp_base_contract_schemes_2661_sacrifice_loan_length_max_value')|0] ปี"
 laamp_base_contract_schemes.2661.e.officer_exists: "[officer.GetTitledFirstNameNoTooltip|U] นี่ดูเหมือนจะเป็นพื้นที่ของท่าน?"
 laamp_base_contract_schemes.2661.e.officer_unexists: "หืมม ข้าขาดนายทหารที่เหมาะสมที่จะมอบหมายให้"
 laamp_base_contract_schemes.2661.f: "โอกาสสำหรับการโต้วาทีอันรู้แจ้ง ท่านว่า!"
 laamp_base_contract_schemes.2661.g: "ข้าสามารถแก้ไขอะไรก็ได้หากข้าตั้งใจ!"

 laamp_base_contract_schemes.2662.t: "$laamp_base_contract_schemes.2031.t$: สำเร็จ!"
 laamp_base_contract_schemes.2662.desc.resolution_type.stewardship: "ผู้คนดี ๆ แห่ง [employer.GetPrimaryTitle.GetBaseNameNoTier] มีประเด็นมากมาย บางประเด็นก็สมเหตุสมผล บางประเด็นก็ไม่ แต่ #EMP ไม่มี#! ประเด็นใดที่สอดคล้องกัน\n\nใช้เวลาไม่นานที่ข้าจะเอาชนะข้อโต้แย้งของพวกเขา แสดงให้เห็นทีละคนว่าเป็นการเสแสร้ง โง่เขลา หรือทั้งสองอย่าง\n\nด้วยการทำงานเพียงไม่กี่ชั่วโมง ข้าก็สามารถพลิกสถานการณ์ให้นายจ้างของเราได้ จนกระทั่งคำตัดสินใหม่ของ [employer.GetHerHis] ดูเหมือน — สร้างความตกตะลึงและความรำคาญให้กับราษฎรของ [employer.GetHerHis] อย่างมาก — สอดคล้องกับประเพณีโดยสิ้นเชิง"
 laamp_base_contract_schemes.2662.desc.resolution_type.secondary_skill: "การใช้คำพูดที่สร้างสรรค์เล็กน้อยก็เพียงพอที่จะหว่านเมล็ดพันธุ์แห่งความสงสัยในหมู่ประชาชนที่โกรธแค้นแห่ง [employer.GetPrimaryTitle.GetBaseNameNoTier]\n\nเสนอว่าสิ่งนี้ถูกพูดแทนสิ่งนั้น วลีหนึ่งมีความหมายอีกอย่างจริง ๆ ทำให้คนหนึ่งหรือสองคนขัดแย้งกัน และ #EMP แล้วไงล่ะ#!: ทุกคนไม่แน่ใจเกินไปว่าใครถูกและอะไรคือความจริงที่จะต่อต้านอย่างมีความหมายได้\n\nเรื่องนี้ไม่ได้ถูกแก้ไขโดยเฉพาะ แต่ประเด็นนี้ถูกเจือจางลงเพียงพอแล้วที่ความโกรธของพวกเขาจะลดลงและการคัดค้านของพวกเขาจะสลายไป"
 laamp_base_contract_schemes.2662.desc.resolution_type.left_sacrifice: "ทิ้ง [sacrifice.GetTitledFirstName] ไว้ให้ทำงานของ [sacrifice.GetHerHis] กับคนท้องถิ่นที่โกรธแค้น [employer.GetTitledFirstName] และข้าก็ออกไปเดินเล่น\n\nเสียงตะโกนและเสียงร้องไห้แห่งความไม่เป็นธรรมค่อย ๆ จางหายไปในเบื้องหลัง และขณะที่เราเข้าใกล้ระเบียงเล็ก ๆ เพื่อรับอากาศยามเย็น [employer.GetFirstNameNoTooltip] ก็ยิ้มเป็นครั้งแรกนับตั้งแต่เรามาถึง\n\n"ใจดีมากที่ท่านให้ยืมวาทกรที่มีทักษะ เช่นนี้แก่เรา [ROOT.Char.GetFirstNameNoTooltip] ใจดีมากจริง ๆ ข้าจะดูแลให้การเดินทางกลับของ [sacrifice.GetHerHis] รวดเร็วและปลอดภัย ค่าจ้างของท่านรอท่านอยู่ที่ประตู""
 laamp_base_contract_schemes.2662.desc.resolution_type.officer: "ในฐานะนายพรานโดยกำเนิด การประเมินตำแหน่งของสถานที่สำคัญของ [officer.GetTitledFirstNamePossessive] นั้นรวดเร็ว แม่นยำ และไม่อาจโต้แย้งได้\n\nนั่นไม่ได้หยุดยั้งพลเมืองแห่ง [employer.GetPrimaryTitle.GetBaseNameNoTier] จากการพยายาม แน่นอน แต่ [officer.GetFirstNameNoTooltip] มีคำตอบสำหรับ แต่ละคนทีละคน ทำลายข้อโต้แย้งของพวกเขาขณะที่พวกเขามาหา [officer.GetHerHim]\n\nเป็นเวลาบ่ายแก่ ๆ เมื่อพวกเขาเสร็จสิ้น แต่ฝูงชนของผู้ที่อยากจะเป็นผู้ฟ้องร้องก็สลายไปในที่สุด"
 laamp_base_contract_schemes.2662.desc.resolution_type.camp_purpose: "ผู้คนดี ๆ แห่ง [employer.GetPrimaryTitle.GetBaseNameNoTier] อาจเป็นผู้สนับสนุนที่กระตือรือร้นสำหรับตนเอง แต่พวกเขาไม่ได้คำนึงถึงความโกรธแค้นทางวิชาการเต็มรูปแบบของ [ROOT.Char.GetPrimaryTitle.GetDefinitiveName]\n\nการสนทนาของเราใช้เวลาส่วนใหญ่ของวัน สิ่งที่ข้าพบว่าน่าตื่นเต้น แต่ ซึ่งพวกเขาดูเหมือนจะถอยห่างมากขึ้นเรื่อย ๆ เมื่อชั่วโมงผ่านไป\n\nเราไม่ได้ข้อสรุปที่แท้จริงจริง ๆ แต่ในที่สุดคนท้องถิ่นก็ยอมแพ้ คำถามถูกตอบด้วยคำถาม ทุกหัวข้อถูกทบทวนหลายครั้ง ประเด็นวกวนไปมาไม่รู้จบ..."
 laamp_base_contract_schemes.2662.desc.resolution_type.stress: "ความดื้อรั้นอย่างเลือดตาแทบกระเด็นอาจไม่ใช่วิธีที่มีประสิทธิภาพในการแก้ปัญหาทุกปัญหา แน่นอนว่าข้ารู้สึกถึงผลกระทบของการตะโกนอย่างเข้มงวดกับคนท้องถิ่นที่โกรธแค้นจำนวนมาก แต่มันได้ผล\n\nหลังจากตะโกนและข่มขู่เพียงไม่กี่ชั่วโมง ผู้คนใน [employer.GetPrimaryTitle.GetBaseNameNoTier] ในที่สุดก็ยอมถอยอย่างอาย ๆ\n\nอย่างที่ข้ารู้ว่าพวกเขาจะทำ หากข้าแสดงเจตจำนงของข้า"
 laamp_base_contract_schemes.2662.desc.outro: "\n\n[employer.GetTitledFirstName] ดูเหมือนจะพอใจที่เรื่องทั้งหมดจบลง"
 laamp_base_contract_schemes.2662.a: "$game_concept_contact_list_contact$ ที่มีความสุขอีกคน"

 laamp_base_contract_schemes.2663.t: "$laamp_base_contract_schemes.2031.t$: ล้มเหลว!"
 laamp_base_contract_schemes.2663.desc.stewardship: "ดูเหมือนว่าทักษะการบริหารของข้าจะ... ไม่ #EMP ถึง#! ที่ข้าจินตนาการไว้\n\nข้าคิดว่าความคิดเห็นที่มีข้อมูลจาก [ROOT.Char.GetWomanMan] ผู้มีสถานะจะเป็นประโยชน์ในการ ทำให้สิ่งต่าง ๆ ชัดเจนขึ้น แต่ความพยายามของข้าในการชี้แจงขอบเขตของสถานที่สำคัญกลับสร้างมาตรฐาน #EMP ที่สาม#! ขึ้นมาเพื่อโต้แย้งสองมาตรฐานแรก ส่งผลให้ผู้ทำสงครามต่าง ๆ เข้าสู่ความบ้าคลั่งของการโต้เถียง"
 laamp_base_contract_schemes.2663.desc.officer: "แม้จะมีความพยายามอย่างดีที่สุดของ [officer.GetTitledFirstNamePossessive] แต่ผู้คนใน [employer.GetPrimaryTitle.GetBaseNameNoTier] ก็อยู่ในความโกลาหล\n\nดูเหมือนว่าความพยายามของนายพรานของข้าในการชี้แจงขอบเขตของสถานที่สำคัญจะ ส่งผลให้เกิดชุดคำจำกัดความ #EMP ที่สาม#! ขึ้นมาเพื่อโต้แย้งสองชุดแรกเท่านั้น"
 laamp_base_contract_schemes.2663.desc.outro: "\n\nจากนั้น ดูเหมือนว่าความแค้นเก่าแก่ทุกเรื่องใน [employer.GetPrimaryTitle.GetDeJureLiege.GetBaseNameNoTier] กำลังถูกขุดคุ้ยขึ้นมาขณะที่เลือดที่ไม่ดีและข้อเรียกร้องที่น่าสงสัยหมุนวนไปทั่วคนท้องถิ่น โดย [employer.GetPrimaryTitle.GetDeJureLiege.GetTierAsNameNoTooltip] ทั้งหมดขู่ว่าจะเดือดพล่าน เพราะมัน\n\nด้วยความโกรธ [employer.GetTitledFirstName] ขับไล่เราออกจากชุมชน ไม่ได้เหรียญเดียวสำหรับความลำบากของเรา"
 laamp_base_contract_schemes.2663.a: "เราทำดีที่สุดแล้ว..."

 laamp_base_contract_schemes.2666.t: "$laamp_base_contract_schemes.2031.t$: ภาษีซ้ำซ้อน"
 laamp_base_contract_schemes.2666.desc: "[employer.GetPrimaryTitle.GetBaseNameNoTier] อยู่ในความโกลาหลนานก่อนที่เราจะมาถึง — เห็นได้ชัดว่าความผิดพลาดหลายปีในส่วนของนายจ้างของเราและพวกพ้องของ [employer.GetHerHis] ได้นำไปสู่ที่ดินและธุรกิจในท้องถิ่นจำนวนมากถูกเก็บภาษี #EMP สองครั้งหรือมากกว่า#! เพียง แต่โดยผู้เก็บภาษีที่แตกต่างกัน ซึ่งมีหน้าที่แตกต่างกัน\n\nหลังจากพึมพำและพยายามแก้ไขอย่างสุภาพมามาก ในที่สุดสิ่งต่าง ๆ ก็ขู่ว่าจะเดือดพล่านกลายเป็นสิ่งที่นองเลือดมากขึ้น"
 laamp_base_contract_schemes.2666.desc.outro: "$laamp_base_contract_schemes.2661.desc.outro$"
