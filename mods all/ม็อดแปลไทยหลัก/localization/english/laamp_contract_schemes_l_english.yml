 laamp_base_contract_schemes.2321.t: "$laamp_base_contract_schemes.2004.t$: การประกาศ"
 laamp_base_contract_schemes.2321.desc.intro: "เรารวมตัวกันในห้องของ [person_a.GetTitledFirstNamePossessive] สถานที่ที่เหมาะสมอย่างยิ่งที่จะประกาศคำตัดสินของข้า ด้วยคำพูดของ [employer.GetTitleAsNamePossessive] หนุนหลังข้า สิ่งนี้จะมีผลผูกพัน ไม่ทางใดก็ทางหนึ่ง\n\n[person_b.GetFirstName], [person_c.GetFirstName], และ [person_d.GetFirstName] ต่างรอคอยการประกาศชะตากรรมของพวกเขาด้วยลมหายใจที่กลั้นไว้ ขณะที่ [person_a.GetFirstNameNoTooltip] ดูประหม่าเป็นครั้งแรกนับตั้งแต่ข้ามาถึง\n\nสัญชาตญาณของข้าบอกข้าว่า"
 laamp_base_contract_schemes.2321.desc.tax_status.has_cash: "พวกเขาสามารถจ่ายได้ พวกเขาแค่ไม่ต้องการจ่าย"
 laamp_base_contract_schemes.2321.desc.tax_status.partial_cash: "พวกเขาน่าจะสามารถจ่ายได้อย่างน้อยบางส่วน"
 laamp_base_contract_schemes.2321.desc.tax_status.no_cash: "พวกเขาขาดแคลนเหรียญที่จะจ่ายอย่างแท้จริง"
 laamp_base_contract_schemes.2321.desc.clues_gathered.four: "และการสืบสวนของข้าแสดงให้เห็นว่าเป็นความจริงโดยสิ้นเชิง"
 laamp_base_contract_schemes.2321.desc.clues_gathered.two_to_three: "และการสืบสวนของข้าส่วนใหญ่ได้พิสูจน์แล้วว่าเป็น เช่นนั้น"
 laamp_base_contract_schemes.2321.desc.clues_gathered.one_or_less: "แต่ข้าขาดหลักฐานที่จะพิสูจน์มัน"
 laamp_base_contract_schemes.2321.tt.clue_total.exceptional_achievable: "เมื่อรวบรวมหลักฐานที่เป็นไปได้ทั้งหมดแล้ว การสืบสวนของท่านละเอียดถี่ถ้วนเพียงพอที่จะบังคับให้เกิด $label_success_critical$ หากท่านบังคับให้พวกเขาจ่าย"
 laamp_base_contract_schemes.2321.tt.clue_total.normal_achievable: "ด้วยหลักฐานที่รวบรวมได้เพียงพอ การสืบสวนของท่านน่าจะสรุปได้ด้วย $label_success_standard$ หากท่านบังคับให้พวกเขาจ่ายเต็มจำนวน"
 laamp_base_contract_schemes.2321.tt.clue_total.failure_possible: "เนื่องจากท่านได้รวบรวมหลักฐานไม่เพียงพอ การสืบสวนที่ไม่สมบูรณ์ของท่านอาจนำไปสู่การต่อต้านจากคนท้องถิ่นหากท่านบังคับให้พวกเขาจ่ายเต็มจำนวน"
 laamp_base_contract_schemes.2321.a: "ท่านจะจ่ายเต็มจำนวน"
 laamp_base_contract_schemes.2321.a.tt: "ท่านตัดสินเข้าข้าง [employer.GetTitledFirstName] ต่อต้าน [person_a.GetTitledFirstName]"
 laamp_base_contract_schemes.2321.a.tt.success_standard: "หากท่านรวบรวมหลักฐานได้เพียงพอ"
 laamp_base_contract_schemes.2321.a.tt.success_qualified: "หากท่านขาดหลักฐาน แต่คนท้องถิ่นยอมถอย"
 laamp_base_contract_schemes.2321.a.tt.failure_standard: "หากท่านขาดหลักฐาน และคนท้องถิ่นลุกฮือขึ้น"
 laamp_base_contract_schemes.2321.b: "ท่านจะจ่าย — ครึ่งหนึ่ง"
 laamp_base_contract_schemes.2321.b.tt: "ท่านตัดสินเข้าข้าง [employer.GetTitledFirstName] แต่ก็ลดภาระภาษีให้ [person_a.GetTitledFirstName] อย่างไรก็ตาม"
 laamp_base_contract_schemes.2321.c: "เห็นได้ชัดว่า [destination_1.GetBaseNameNoTierNoTooltip] ไม่สามารถจ่ายสิ่งนี้ได้อย่างแท้จริง"
 laamp_base_contract_schemes.2321.c.tt: "ท่านตัดสินเข้าข้าง [person_a.GetTitledFirstName] ต่อต้าน [employer.GetTitledFirstName]"

 laamp_base_contract_schemes.2322.t.success_critical: "$laamp_base_contract_schemes.2004.t$: จ่ายเต็มจำนวน"
 laamp_base_contract_schemes.2322.t.success_standard: "$laamp_base_contract_schemes.2004.t$: จ่ายแล้ว"
 laamp_base_contract_schemes.2322.t.success_qualified_insufficient_evidence: "$laamp_base_contract_schemes.2004.t$: จ่ายอย่างขมขื่น"
 laamp_base_contract_schemes.2322.t.violence: "$laamp_base_contract_schemes.2004.t$: ความรุนแรงปะทุขึ้น"
 laamp_base_contract_schemes.2322.desc.violence: "ความเงียบเข้าปกคลุมห้อง\n\nความเงียบที่ตึงเครียดและน่าอึดอัด ขณะที่ชาวบ้านมองหน้ากัน ความไม่พอใจ ทำให้ปากของพวกเขาบิดเบี้ยวเกือบจะเป็นเสียงคำราม\n\nด้วยเสียงไม้เสียดสีกับหินอย่างกะทันหัน [aggressor.GetTitledFirstName] ผลักเก้าอี้ของ [aggressor.GetHerHis] ไปข้างหลัง: "หากเจ้าหมายจะตัดสินความอย่างเลวร้าย เช่นนี้ เจ้าปีศาจ จงเตรียมรับความยุติธรรมของเรา!"\n\nไม่กี่นาทีต่อมากลายเป็นภาพเบลอเมื่อผู้ติดตามของข้าสองคนบุกเข้ามาในห้อง ตามด้วยทหารของ [person_a.GetTitledFirstNamePossessive] อีกจำนวนหนึ่ง มีการชักดาบ ตะโกนข่มขู่ และเมืองก็เข้าสู่การจลาจลเต็มรูปแบบอย่างรวดเร็ว"
 laamp_base_contract_schemes.2322.desc.success_critical: "ด้วยการสืบสวนของข้าที่ละเอียดถี่ถ้วนอย่างปฏิเสธไม่ได้ ทั้ง [person_a.GetTitledFirstName] และลูกน้องคนใดของ [person_a.GetHerHis] ก็ไม่สามารถโต้แย้งผลของมันได้\n\nแม้ว่าผลลัพธ์เหล่านั้นจะ #EMP เข้าข้าง#! สิ่งที่ [employer.GetTitledFirstName] จะพบว่าสะดวกพอที่จะให้โบนัสก็ตาม"
 laamp_base_contract_schemes.2322.desc.success_standard: "ข้ามีหลักฐานเพียงพอที่จะสนับสนุนกรณีที่น่าเชื่อถือว่าคนท้องถิ่น #EMP สามารถ#! จ่ายบิลล่าสุดของพวกเขาได้ และขณะที่ข้าแจกแจงมัน เสียงถอนหายใจที่พ่ายแพ้และเหนื่อยหน่ายโลกจากรอบด้านบอกข้าว่า [person_a.GetTitleAsNameNoTooltip] และเพื่อนร่วมงานของ [person_a.GetHerHis] รู้ดี\n\n"หยุด หยุด ได้โปรด" [person_a.GetFirstName] โบกมืออย่างยอมจำนน "ท่านได้ชี้แจงประเด็นของท่านอย่างชัดเจนเพียงพอแล้ว เราจะจ่ายส่วนที่ครบกำหนดของ [employer.GetTitleAsName] ให้ [employer.GetHerHis]""
 laamp_base_contract_schemes.2322.desc.success_qualified_insufficient_evidence: "ชั่วขณะหนึ่งที่ตึงเครียด ดูเหมือนว่า [person_a.GetFirstNameNoTooltip] และลูกน้องของ [person_a.GetHerHis] ตั้งใจที่จะประท้วงการประกาศของข้า — ด้วยกำลังหากจำเป็น — แต่เมื่อไม่มีใครเป็นผู้นำ ช่วงเวลานั้นก็ผ่านไป\n\n"ดี... มาก... ท่านอาจจะแจ้งให้ [employer.GetTitleAsName] ทราบว่า #EMP 'ภาษี'#! ของ [employer.GetHerHis] จะถูกจ่าย เราจะไม่ต่อต้านอีกต่อไป หวังว่าท่านจะไม่ได้อยู่ที่นี่เพื่อดูผลกระทบต่อเราในปีหน้า""
 laamp_base_contract_schemes.2322.desc.tax_status.has_cash: "ไม่ว่าพวกเขาจะพูดอะไร [destination_1.GetBaseNameNoTier] แน่นอนว่ามีทรัพย์สินเหลือเฟือ ไม่ว่าผู้มีอิทธิพลของมันจะปฏิเสธ อย่างไรก็ตาม"
 laamp_base_contract_schemes.2322.desc.tax_status.partial_cash: "ช่วงเวลาจะยากลำบากสำหรับพวกเขาสักพัก แต่พวกเขาเป็นชาวเมือง พวกเขาจะหาทาง ทำให้มันสำเร็จได้"
 laamp_base_contract_schemes.2322.desc.tax_status.no_cash: "แน่นอนว่า เมืองจะได้รับความเดือดร้อนจากสิ่งนี้ อาจจะค่อนข้างหนักหน่วง แต่แล้ว นั่นคือชีวิต"
 laamp_base_contract_schemes.2322.a: "[employer.GetTitledFirstNameNoTooltip] จะปลาบปลื้มอย่างยิ่ง!"
 laamp_base_contract_schemes.2322.b: "ข้าได้ปฏิบัติหน้าที่ของข้าอย่างดีแล้ว"
 laamp_base_contract_schemes.2322.c: "อืม นั่นง่ายพอสมควร"
 laamp_base_contract_schemes.2322.d: "เจ้าพวกโง่เขลา จับอาวุธ!"
 laamp_base_contract_schemes.2322.d.tt.need_troops: "ท่านต้องการทหารอย่างน้อย #V 500#! นายที่พร้อมใช้งานเพื่อปราบปรามการจลาจล"
 laamp_base_contract_schemes.2322.d.tt.success: "กองทหารของท่านในเมืองปราบปรามการจลาจล"
 laamp_base_contract_schemes.2322.d.tt.failure: "การสังหารหมู่เกิดขึ้นตามมา"
 laamp_base_contract_schemes.2322.e: "หนี!"

 laamp_base_contract_schemes.2323.t: "$laamp_base_contract_schemes.2004.t$: จ่ายบางส่วน"
 laamp_base_contract_schemes.2323.desc: "คนท้องถิ่นไม่พอใจกับการตัดสินใจของข้าทั้งหมด นั่นชัดเจนเพียงพอจากเสียงพึมพำอย่างกะทันหันของพวกเขา — แต่ข้าสงสัยว่า [employer.GetTitledFirstName] มีแนวโน้มที่จะดีใจมากเกินไป เช่นกัน\n\nถึงกระนั้น การประนีประนอมมักเกี่ยวข้องกับการ ทำให้ใครบางคน (บางครั้งทุกคน) ไม่มีความสุข และ [person_a.GetTitledFirstName] และพรรคพวกของ [person_a.GetHerHis] รู้ว่านี่เป็นการแก้ปัญหาที่ดีที่สุดที่พวกเขามีแนวโน้มที่จะได้รับ\n\n"ข้า... คิดว่าคงแค่นั้นแล้ว ขอบคุณสำหรับเวลาของท่าน [ROOT.Char.GetTitledFirstNameNoTooltip]" [person_a.GetFirstNameNoTooltip] พึมพำ\n\nมือของ [person_a.GetHerHis|U] ยื่นออกมาเพื่อจับมือของข้า"
 laamp_base_contract_schemes.2323.a: "เป็นการสรุปที่ยุติธรรม ข้าคิดว่า"
 laamp_base_contract_schemes.2323.b: "แตะมือข้าแล้วเสียมือเจ้าไป ไอ้ไพร่"
 laamp_base_contract_schemes.2323.a.tt.success: "[person_a.GetFirstNameNoTooltip] รับมันได้ดี"
 laamp_base_contract_schemes.2323.a.tt.failure: "[person_a.GetFirstNameNoTooltip] ขาดความกตัญญู"
 laamp_base_contract_schemes.2323.a.tt.failure.filler: "ท่านไม่ได้รับรางวัลเพิ่มเติมใด ๆ"

 laamp_base_contract_schemes.2324.t: "$laamp_base_contract_schemes.2004.t$: เป็นโมฆะและถือเป็นโมฆะ"
 laamp_base_contract_schemes.2324.desc: "เสียงเชียร์ดังกระหึ่มจาก [person_a.GetTitledFirstName] คนประจบประแจงของ [person_a.GetHerHis] และแม้กระทั่งคนรับใช้ที่เห็นได้ชัดว่ากำลังแอบฟังอยู่ที่รูกุญแจขณะที่ข้าบอกพวกเขาว่าพวกเขาได้รับการยกเว้นจากการจ่ายเงิน\n\n[employer.GetTitledFirstName|U] ไม่น่าจะเป็นแฟนคลับแน่นอน ซึ่งหมายความว่าข้าคงจะไม่ได้เห็นเหรียญสำหรับทั้งหมดนี้ — แต่ราคาแบบไหนที่ท่านสามารถกำหนดให้กับความชื่นชมได้ อย่างไรก็ตาม?"
 laamp_base_contract_schemes.2324.desc.second_option: "\n\nค่ำคืนอันเป็นกันเองตามมา จนกระทั่ง [person_a.GetFirstNameNoTooltip] สามารถดึงข้าไปคุยส่วนตัวได้\n\n"ท่านทำถูกต้องแล้วสำหรับเรา [ROOT.Char.GetTitledFirstNameNoTooltip] อย่างที่ข้ารู้ว่าท่านจะทำ ข้าเคารพสิ่งนั้นในตัวผู้นำ หากท่านต้องการ ข้ามีความสัมพันธ์ที่อื่นที่ข้าสามารถใช้เพื่อ... #EMP เสริมสร้าง#! ชื่อเสียงที่ดีของท่านใน [claim_duchy.GetDefinitiveName] ได้?""
 laamp_base_contract_schemes.2324.a: "ข้าหวังว่าท่านจะจำสิ่งนี้ไว้ [person_a.GetFirstNameNoTooltip]"
 laamp_base_contract_schemes.2324.b: "ขอให้ประชาชนยิ้มให้กับชื่อของข้า!"

 laamp_base_contract_schemes.2331.t: "$laamp_base_contract_schemes.2004.t$: ผู้นำที่คู่ควร"
 laamp_base_contract_schemes.2331.desc: ""[ROOT.Char.GetTitledFirstNameNoTooltip]?"\n\nข้าเงยหน้าขึ้นจากมื้อค่ำเพื่อพบว่ายามสองคนของข้าได้พา... [hopeful.GetWomanMan] ชาว [hopeful.GetCulture.GetName] ที่ค่อนข้างคุ้นเคยมาให้ข้า? ข้ารู้จัก [hopeful.GetHerHim] จากที่ไหน...\n\n"ข้าคือ [hopeful.GetTitledFirstName] [ROOT.Char.Custom('MistressMaster')] ท่านได้ตัดสินเรื่องในบ้านเกิดของข้า [destination_1.GetBaseNameNoTier] เมื่อหลายปีก่อน และข้าคิดว่าท่านทำ เช่นนั้นด้วยศักดิ์ศรีและความสุขุม"\n\n"ถึงกระนั้น ธุรกิจของข้าก็ล้มละลายไปนานแล้ว และข้าพบว่าตัวเองกำลังมองหางานอื่น ข้าคิดว่าท่านอาจจะ... มีงานให้ข้า...""
 laamp_base_contract_schemes.2331.a: "ข้ายอมรับ หาเต็นท์ให้ [hopeful.GetHerHim]!"
 laamp_base_contract_schemes.2331.b: "เจ้าคงจะเสียเกลือเปล่า"

 laamp_base_contract_schemes.2332.t: "$laamp_base_contract_schemes.2004.t$: เลือดและศพ"
 laamp_base_contract_schemes.2332.desc.quelled: "แม้จะมีเจตนาร้ายของ [person_a.GetTitledFirstName] และลูกน้องของ [person_a.GetHerHis] และทหารอาสาสมัครที่ได้รับค่าจ้าง กองทหารของข้าจาก [ROOT.Char.GetPrimaryTitle.GetDefinitiveName] ก็เก่งกาจกว่ากลุ่มชนชั้นต่ำชาว [destination_1.GetAdjective] ที่ติดอาวุธไม่ดีกลุ่มใด ๆ\n\nในเวลาอันสั้น การจลาจลก็ถูกปราบปราม มีผู้เสียชีวิตแน่นอน และแม้กระทั่งการปล้นสะดมเล็กน้อย แต่พวกเขานำสิ่งนี้มาสู่ตัวเองเมื่อพวกเขาชักดาบต่อสู้กับข้า ศพของ [aggressor.GetTitledFirstName|U] แสดงให้เห็น เช่นนั้น\n\nเมื่อสถานการณ์ตอนนี้ #EMP ควบคุม#! ได้มากขึ้นเล็กน้อย ข้าจึงเสนอแนะอย่างหนักแน่นต่อ [person_a.GetFirstNameNoTooltip] ให้จ่าย ภาษีของ [person_a.GetHerHis|U]\n\n#BOL เดี๋ยวนี้#!."
 laamp_base_contract_schemes.2332.desc.massacre: "สิ่งที่ตามมาคือการสังหารหมู่ไม่น้อยไปกว่านั้น\n\nผู้คนของ [destination_1.GetBaseNameNoTierPossessive] ดื้อรั้นและโกรธแค้น แต่ก็ไม่สามารถต่อกรกับนักฆ่าพเนจรแห่ง [ROOT.Char.GetPrimaryTitle.GetDefinitiveName] ได้เมื่อเลือดของพวกเขาขึ้น\n\nในเวลาอันสั้น การปล้นก็เริ่มขึ้น เสียงกรีดร้องแทงทะลุท้องฟ้ายามค่ำคืน ศพเริ่มกองพะเนิน และ [person_a.GetTitledFirstName], [person_b.GetTitledFirstName], [person_c.GetTitledFirstName], และ [person_d.GetTitledFirstName] ต่างถูกสังหารในการต่อสู้\n\nนี่ไม่ใช่สิ่งที่ [employer.GetTitledFirstName] สั่ง และข้าสงสัยว่า [employer.GetSheHe] ตั้งใจจะจ่ายเงินสำหรับมัน"
 laamp_base_contract_schemes.2332.a: "บางครั้งความจำเป็นก็ต้องมาก่อน"
 laamp_base_contract_schemes.2332.b: "นี่... นี่มันเกินควบคุมไปแล้ว"
 laamp_base_contract_schemes.2332.c: "#EMP เอ๊ะ#!."
 laamp_base_contract_schemes.2332.d: "นอกเหนือจากค่าจ้าง ช่างเป็นการสิ้นสุดการดำเนินการที่ยอดเยี่ยมอะไร เช่นนี้!"

 laamp_base_contract_schemes.2541.t: "$laamp_base_contract_schemes.2011.t$: [location.GetBaseNameNoTierNoTooltip]"
 laamp_base_contract_schemes.2541.desc.fluff_type.boredom: "ผู้คนที่นี่ดูเหมือนจะไม่สนใจในภารกิจของเรา ไม่ว่ามันจะมาจาก [employer.GetTitleAsNameNoTooltip] ของพวกเขาก็ตาม โดยชื่อและตราประทับของ [employer.GetFirstNamePossessive] แทบจะไม่กระตุ้นพวกเขาให้เกินกว่าขั้นต่ำที่กฎหมายและความเหมาะสมกำหนดไว้\n\nเป็นสถานที่ที่เชื่องช้าและน่าหงุดหงิดในการจดบันทึก แต่ความมุ่งมั่นเรียกร้องความอดทน และเรา #EMP มุ่งมั่น#! ที่จะหารายได้จากเงินของเรา"
 laamp_base_contract_schemes.2541.desc.fluff_type.paranoia: "ผู้คนใน [location.GetNameNoTier] ตอบสนองต่อการมาถึงของเราด้วยความเป็นปรปักษ์ที่แทบจะไม่ถูกควบคุม\n\nเห็นได้ชัดว่าพวกเขาถือว่าการปรับปรุงบันทึกของ [employer.GetTitledFirstNamePossessive] เป็นสัญญาณ #EMP แน่ชัด#! ของสิ่งที่ไม่ดีบางอย่างที่กำลังจะเกิดขึ้น ไม่ว่าจะเป็นความขัดแย้งหรือภาษีรายหัว และคำถามของเรามักถูกปฏิเสธ\n\nถึงกระนั้น เราก็มีงานที่ต้องทำและไม่มีชาวนาปากหวานคนใดที่จะเข้ามาขวางระหว่างเรากับวันจ่ายเงินของเรา"
 laamp_base_contract_schemes.2541.desc.fluff_type.happiness: "ที่ [location.GetNameNoTier] ชาวเมืองทักทายเราด้วยเสียงเชียร์ ตะกร้าอาหาร และความรื่นเริงทั้งหมดของครอบครัวที่ต้อนรับญาติกลับมาจากสงครามอันห่างไกล\n\nดูเหมือนว่า ในดินแดนเหล่านี้ ชื่อของ [employer.GetTitledFirstName] เป็นตำนานในหมู่ราษฎรของ [employer.GetHerHis] มากพอที่ข้อความใด ๆ จาก [employer.GetTitleAsNameNoTooltip] อันเป็นที่รักของพวกเขาจะเป็นเหตุผลให้เฉลิมฉลอง\n\nไม่ต้องสงสัยเลยว่า พวกเขากระตือรือร้นที่จะให้ความช่วยเหลือและสนับสนุนภารกิจของเราเท่าที่พวกเขาจะทำได้"
 laamp_base_contract_schemes.2541.desc.fluff_type.disgust: "ดูเหมือนว่า [location.GetNameNoTier] จะไม่ใจดีต่อคนรับใช้ของ [employer.GetTitledFirstName]\n\nการมาถึงของเราถูกตอบโต้ด้วยการเยาะเย้ยอย่างเปิดเผย คำถามของเราถูกปัดป้องหรือเยาะเย้ยอย่างเปิดเผย แม้ว่าคนท้องถิ่นอาจจะน่าหงุดหงิด แต่ถ้าเราไม่สามารถ ทำให้พวกเขาเชื่อฟังได้ เราก็กำลังเสี่ยงกับเหรียญอันมีค่า และนั่นไม่อาจยอมรับได้"
 laamp_base_contract_schemes.2541.desc.fluff_type.admiration: "ประชากรของ [location.GetBaseNameNoTierPossessive|U] ดูเหมือนจะเชื่องพอ\n\nไม่มีความกังวลเกี่ยวกับภาษีที่กำลังจะมาถึงหรือสงครามครั้งใหม่ที่นี่ มีเพียงผู้คนที่ดำเนินชีวิตต่อไปและยอมรับชะตากรรมของตน เมื่อผู้แทนของเจ้าเหนือหัวของพวกเขามาเยือน พวกเขาก็ให้ความสนใจตามสมควรแก่ [ROOT.Char.GetHerHim]\n\nตราประทับของ [employer.GetTitledFirstNamePossessive] ช่วยให้เราผ่านอุปสรรคเล็กน้อยในท้องถิ่นส่วนใหญ่ได้ แต่ผู้คนก็พอใจเพียงพอที่เราแทบไม่จำเป็นต้องใช้มัน"
 laamp_base_contract_schemes.2541.desc.fluff_type.worry: "ไม่ว่าด้วยเหตุผลใดก็ตาม [location.GetNameNoTier] คิดว่ามีเหตุผลที่ดีที่จะสงสัยในเจตนาของ [employer.GetTitledFirstName] — อย่างน้อยก็เพียงพอที่จะ ทำให้พวกเขาให้ความร่วมมือกับเราเพียง #EMP อย่างไม่เต็มใจ#! เท่านั้น\n\nน่าเบื่อ แต่ก็พอทำงานได้ อย่างน้อย มันก็แค่หมายความว่าการลากข้อมูลเกี่ยวกับทุกครัวเรือนออกมาจากผู้อยู่อาศัยเป็นงานที่น่าเบื่อหน่าย หากไม่ใช่งานที่ไม่พึงประสงค์อย่างแข็งขัน"
 laamp_base_contract_schemes.2541.a: "เอาล่ะ มา ทำให้เสร็จกันเถอะ"
