 laamp_base_contract_schemes.1301.desc.intro.desert: "ทะเลทรายอันร้อนระอุของ [current_county.GetBaseNameNoTier]"
 laamp_base_contract_schemes.1301.desc.intro.desert_mountains: "ภูเขาแห้งแล้งที่ไม่น่าให้อภัยของ [current_county.GetBaseNameNoTier]"
 laamp_base_contract_schemes.1301.desc.intro.oasis: "โอเอซิสอันเขียวชอุ่มที่ [current_county.GetBaseNameNoTier]"
 laamp_base_contract_schemes.1301.desc.intro.jungle: "ป่าทึบของ [current_county.GetBaseNameNoTier]"
 laamp_base_contract_schemes.1301.desc.intro.forest: "ป่ามืดครึ้มของ [current_county.GetBaseNameNoTier]"
 laamp_base_contract_schemes.1301.desc.intro.taiga: "ป่าสนอันกว้างใหญ่ของ [current_county.GetBaseNameNoTier]"
 laamp_base_contract_schemes.1301.desc.intro.wetlands: "บึงที่ส่งกลิ่นเหม็นของ [current_county.GetBaseNameNoTier]"
 laamp_base_contract_schemes.1301.desc.intro.steppe: "ทุ่งหญ้าสเตปป์อันไม่มีที่สิ้นสุดของ [current_county.GetBaseNameNoTier]"
 laamp_base_contract_schemes.1301.desc.intro.floodplains: "ที่ราบน้ำท่วมถึงอันชื้นแฉะของ [current_county.GetBaseNameNoTier]"
 laamp_base_contract_schemes.1301.desc.intro.drylands: "พื้นที่แห้งแล้งที่เต็มไปด้วยฝุ่นของ [current_county.GetBaseNameNoTier]"
 laamp_base_contract_schemes.1301.desc.intro.postamble: "[ROOT.Char.GetPrimaryTitle.GetDefinitiveName] กระจายกำลังเข้าหาและรอบ ๆ กลุ่มคนชั่วของ [recidivist.GetHerHis] เอง พวกเราทุกคนตึงเครียดและพร้อมสำหรับการนองเลือด"
 laamp_base_contract_schemes.1301.desc.encounters.first.relation.good: ""[ROOT.Char.GetFirstNameNoTooltip] [recidivist.Custom2('RelationToMeShort',ROOT.Char)] ของข้า" [recidivist.GetFirstNameNoTooltip] เปิดฉาก ทำลายความเงียบ "ข้า... ไม่ได้คาดหวังท่าน ในบรรดาผู้คนทั้งหมดที่จะมาตามล่าข้า คนที่รักใคร่กัน เช่นนี้...""
 laamp_base_contract_schemes.1301.desc.encounters.first.relation.bad: ""อาาา [ROOT.Char.GetFirstNameNoTooltip] คนโง่สมองขี้เลื่อยคนไหนอีกเล่าที่จะกระตือรือร้นไล่ตามข้า เช่นนี้?" [recidivist.GetFirstNameNoTooltip] เปิดฉาก เดินก้าวไปข้างหน้า "พูดตามตรง ข้าโล่งใจ การฆ่า [ROOT.Char.GetWomenMen] ส่วนใหญ่น่าเบื่อ แต่การควักไส้เจ้าจะเป็น #EMP ความสุข#! อย่างยิ่ง""
 laamp_base_contract_schemes.1301.desc.encounters.first.family: ""[ROOT.Char.GetFirstNameNoTooltip] [recidivist.Custom2('RelationToMeShort',ROOT.Char)] ของข้า เลือดเนื้อเชื้อไขของข้าเอง — ทำไมท่านถึงไล่ตามข้ามาที่นี่? หวังว่าจะแก้แค้นการดูหมิ่นที่ข้าได้ทำต่อชื่อเสียงตระกูล [ROOT.Char.GetHouse.GetName] หรือ?""
 laamp_base_contract_schemes.1301.desc.encounters.first.general_reaction.angry: ""เจ้าหมาน้อยขี้ขลาดตาขาว โง่เขลา!" [recidivist.GetFirstNameNoTooltip] เห่า "ออกมาทำตามความประสงค์ของ [employer.GetTitledFirstNamePossessive] ใช่ไหม? มาสิ หมาล่าเนื้อ เผชิญหน้าข้าและพิสูจน์ตัวเองว่าไม่ได้เป็นอะไรมากไปกว่าหมาน้อยเห่าหอน!""
 laamp_base_contract_schemes.1301.desc.encounters.first.general_reaction.haughty: ""มาเถิด มาดูกัน — อา #EMP นั่น [ROOT.Char.GetSheHe] อยู่นั่น#!," [recidivist.GetFirstNameNoTooltip] ตะโกนก้องขณะที่ [recidivist.GetSheHe] ใช้ข้อศอกดันทางของ [recidivist.GetHerHis] ไปยังด้านหน้าของฝูงชน "[ROOT.Char.GetLadyLord] น้อยผู้หลงทางที่คิดว่า [ROOT.Char.GetSheHe] จะปราบข้าได้! เอาล่ะ มาเถิด [ROOT.Char.GetFirstNameNoTooltip]! ข้าอยู่นี่แล้ว!""
 laamp_base_contract_schemes.1301.desc.encounters.first.general_reaction.doleful: ""หากเพียง แต่เราไม่ได้พบกันภายใต้สถานการณ์ที่ไม่เป็นมงคล เช่นนี้ [ROOT.Char.GetFirstNameNoTooltip] เพราะข้าไม่มีเรื่องบาดหมางกับท่าน" [recidivist.GetFirstNameNoTooltip] แสดงความเห็น "อนิจจา ข้าเกรงว่าท่านตั้งใจที่จะปฏิบัติตามหน้าที่ของท่านจนถึงที่สุด""
 laamp_base_contract_schemes.1301.desc.encounters.first.general_reaction.merry: ""ฮ่า!" [recidivist.GetFirstNameNoTooltip] หัวเราะ "นี่คือทั้งหมดที่ท่านนำมาหรือ? ยอดเยี่ยม #EMP ยอดเยี่ยม#! กีฬาดี ๆ ในที่สุด! และท่านก็มาด้วยตนเองด้วย — ข้าจะสนุกกับการ ทำให้ท่านลงไปกองกับพื้น [ROOT.Char.GetFirstNameNoTooltip]""
 laamp_base_contract_schemes.1301.desc.encounters.first.general_reaction.taciturn: ""อืมม" [recidivist.GetFirstNameNoTooltip] พึมพำ ลูบคางของ [recidivist.GetHerHis] "ข้า... คาดหวังมากกว่านี้ ถ้าข้าพูดตามตรง เห็นได้ชัดว่างบประมาณของ [employer.GetTitleAsNamePossessive] ผู้ดีงามกำลังประสบปัญหา งั้น เราจะเริ่มกันเลยไหม?""
 laamp_base_contract_schemes.1301.desc.encounters.second: ""กลับมาอีกแล้วเร็วจัง [ROOT.Char.GetFirstNameNoTooltip]? หลังจากครั้งล่าสุดข้าคิดว่าท่านได้เรียนรู้บทเรียนแล้ว แต่ดูเหมือนว่าเราจะต้องสอนท่านด้วยวิธีที่ยากลำบาก""
 laamp_base_contract_schemes.1301.desc.encounters.third: ""ให้ตายเถอะ ความดื้อรั้นอันน่ารังเกียจของท่าน [ROOT.Char.GetFirstNameNoTooltip] ท่านจะไม่หยุดไล่ล่าเราเลยหรือ? ไปทำงานอื่นที่อื่นเถิด เพราะท่านจะไม่ได้เงินจากเลือดของเรา!""
 laamp_base_contract_schemes.1301.desc.outro.1: "ช่วงเวลานั้นแขวนอยู่บนเส้นด้าย หากข้าไม่ลงมือ คนอื่นจะทำ และทุกอย่างจะหลุดพ้นจากการควบคุมของข้าไปอย่างสิ้นเชิง"
 laamp_base_contract_schemes.1301.desc.outro.2: "กลุ่มของ [recidivist.GetFirstNamePossessiveNoTooltip] เสียเปรียบด้านจำนวนอย่างชัดเจน แต่พวกเขาก็ดูแน่วแน่ — เต็มใจที่จะปกป้องผู้นำของพวกเขา หรือตายในความพยายาม"
 laamp_base_contract_schemes.1301.desc.outro.3: "ความเงียบสงัดอันน่าสะพรึงกลัวเข้าครอบงำกองกำลังที่รวมตัวกันของเรา ไม่มีใครกล้าพอที่จะทำลายความเงียบ เพราะกลัวสิ่งที่อาจตามมา"
 laamp_base_contract_schemes.1301.desc.outro.4: "ทั้งสองฝ่ายต่างรอคอยด้วยลมหายใจที่กลั้นไว้ ไม่แน่ใจว่าข้าจะพูดอะไรต่อไปและหวังลม ๆ แล้ง ๆ ว่ามันอาจจะเป็นอย่างอื่นนอกเหนือจากคำสั่งให้ฆ่า"
 laamp_base_contract_schemes.1301.desc.outro.5: "[recidivist.GetFirstNameNoTooltip] ไม่สามารถชนะที่นี่ได้ และ [recidivist.GetSheHe] รู้ดี อย่างน้อยก็ไม่เปิดเผย แต่ถ้าพวกเขาสามารถวิ่งหนีพ้นมือข้าไปได้..."
