 laamp_extra_contract_schemes.0001.desc_culture: "ข้าบรรลุองค์ประชุมกับเพื่อนร่วมชาติของเรา พวกเราชาว [ROOT.Char.GetPrimaryTitle.GetName] เหมาะสมที่สุดที่จะช่วยเหลือชาว [task_contract_employer.GetCulture.GetCollectiveNoun] โดยการเข้าร่วมใน [scheme.GetName]\n\n"
 laamp_extra_contract_schemes.0001.desc_faith: "ข้าบรรลุองค์ประชุมกับเพื่อนร่วมชาติของเรา พวกเราชาว [ROOT.Char.GetPrimaryTitle.GetBaseName] เหมาะสมที่สุดที่จะช่วยเหลือชาว [task_contract_employer.GetFaith.GetAdherentNamePlural] โดยการเข้าร่วมใน [scheme.GetName]\n\n"
 laamp_extra_contract_schemes.0001.desc_diplomacy: "[task_contract_employer.GetTitledFirstName] เริ่มจัดการไต่สวนหลายครั้ง: ในกระบวนการนี้ ทักษะวาทศิลป์ของข้าจะถูกทดสอบ การเจรจาต่อรองที่ดีกับผู้แทนของ [task_contract_target.GetTitledFirstNamePossessive] อาจ ทำให้เจ้านายของข้าได้รับสิทธิพิเศษของพวกเขา"
 laamp_extra_contract_schemes.0001.desc_martial: "[task_contract_target.GetTitledFirstName] ดูเหมือนจะเป็น [task_contract_target.GetWomanMan] ที่มีเหตุผลเพียงพอ เมื่อผู้ติดตามที่แข็งกร้าวของข้าเริ่มทำร้ายเจ้าหน้าที่ท้องถิ่นของ [task_contract_target.GetHerHis] [task_contract_target.GetSheHe] จะโกรธหรือไม่? เมื่อเราเริ่มนำกลุ่มชาวนาไปโห่ร้องและเผา [task_contract_target.GetSheHe] จะต่อสู้กลับหรือไม่? ไม่เลย ยอมรับเงื่อนไขของ [task_contract_employer.GetTitledFirstNamePossessive] ดีกว่า..."
 laamp_extra_contract_schemes.0001.desc_intrigue: "[task_contract_target.GetTitledFirstName] ไม่สามารถต้านทานความสุขของโลกนี้ได้อย่างแน่นอน และไม่หยิ่งผยองและทรงพลังจน [task_contract_target.GetSheHe] จะไม่อับอายที่จะให้ความผิดพลาดของ [task_contract_target.GetHerHis] ถูกเปิดเผย... การแบล็กเมล์ที่เลือกสรรอาจช่วยรักษาอนาคตของผู้คนของ [task_contract_target.GetTitledFirstNamePossessive] ได้"
 laamp_extra_contract_schemes.0001.desc_learning: "เช่นเดียวกับระบบกฎหมายทั้งหมด ประมวลกฎหมายของ [task_contract_target.GetPrimaryTitle.GetBaseNameNoTier] ต้องมีกฎและข้อยกเว้นที่คลุมเครือบางอย่าง ซึ่งหนึ่งในนั้นอาจถูกสร้างขึ้นเพื่อรองรับผู้คนของ [task_contract_employer.GetTitledFirstNamePossessive] ข้าเพียงแค่ต้องหาสิ่งที่พวกเขาสามารถใช้ได้"
