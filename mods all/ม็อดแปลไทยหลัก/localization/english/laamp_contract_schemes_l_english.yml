 laamp_base_contract_schemes.1302.t: "$laamp_base_contract_schemes.1004.t$: สำเร็จ!"
 laamp_base_contract_schemes.1302.desc.intro: "ข้าโยนศีรษะที่ถูกตัดขาดของ [recidivist.GetFirstNameNicknamedPossessive] ให้กับสายลับของ [employer.GetTitledFirstNamePossessive] เนื้อสีม่วงแดงตกลงข้าง ๆ พวกเขาอย่างเปียกชื้น\n\n"
 laamp_base_contract_schemes.1302.desc.method.prowess_sce: ""ท่านฆ่า [recidivist.GetHerHim] ในการประลองตัวต่อตัว? โอ้ ช่าง #EMP ดุร้าย#! เสียนี่กระไร","
 laamp_base_contract_schemes.1302.desc.method.prowess_non_sce: ""เป็นการเคลื่อนไหวที่สุขุมยิ่งนักที่ให้องครักษ์ของพระองค์สับ [recidivist.GetHerHim] [ROOT.Char.Custom('FormOfAddressForLiege')] — ผู้ใดจะรู้ว่าอาจเกิดสิ่งใดขึ้นหาก [recidivist.GetSheHe] เข้าใกล้กว่านี้?""
 laamp_base_contract_schemes.1302.desc.method.martial: ""ช่างเป็นการจัดการที่เชี่ยวชาญนักที่สังหารไอ้สารเลวผู้นี้ได้โดยไม่สูญเสียมากนัก [ROOT.Char.Custom('FormOfAddressForLiege')] — ข้าไม่แน่ใจว่าจะมีสักกี่คนที่คิดการนี้ได้","
 laamp_base_contract_schemes.1302.desc.method.meat: ""เป็นการฉลาดมากที่ปล่อยให้กองทหารของท่านจัดการกับเดนคนนี้ [ROOT.Char.GetLadyLord] — [recidivist.GetSheHe] เจ้าเล่ห์เกินกว่าจะได้รับโอกาสหลบหนีใด ๆ","
 laamp_base_contract_schemes.1302.desc.outro: "คนรับใช้ของ [employer.GetTitleAsNamePossessiveNoTooltip] กล่าว พลางส่งมอบค่าจ้างของเราอย่างระมัดระวังในเวลาเดียวกัน\n\nคำพูดมีความสำคัญเพียงเล็กน้อย แต่น้ำหนักอันโอชะของกระเป๋าอ้วนและสินค้าเงินของมันช่วยให้การล่าเล็ก ๆ น้อย ๆ ของเราคุ้มค่าอย่างยิ่ง"
 laamp_base_contract_schemes.1302.a: "เป็นงานที่ทำได้ดี"
 laamp_base_contract_schemes.1302.a.tt: "$laamp_base_contract_schemes.0000.f.contract_concluded$"

 laamp_base_contract_schemes.1303.t: "$laamp_base_contract_schemes.1004.t$: ล้มเหลว!"
 laamp_base_contract_schemes.1303.desc.intro: "ด้วยเหตุนั้น [recidivist.GetFirstNameNicknamed] ก็สามารถสลัดการไล่ตามของเราได้ในที่สุด"
 laamp_base_contract_schemes.1303.desc.method.prowess_non_sce: "แม้ว่าทหารยามของข้าจะพยายามอย่างดีที่สุดที่จะจับกุม [recidivist.GetHerHim]"
 laamp_base_contract_schemes.1303.desc.method.martial: "ฝ่าการซุ่มโจมตีออกมาได้อย่างหมดจดและหลบหนีไปด้วยความรวดเร็ว"
 laamp_base_contract_schemes.1303.desc.method.diplo_bandit: "หลบหนีอย่างเงียบ ๆ ภายใต้ข้ออ้างที่จะพิจารณาเข้าร่วมกับคณะของ [recidivist.GetHerHis] ด้วย [ROOT.Char.Custom('GetLaampDescribeTypeSelfPlural')] ของเราเอง"
 laamp_base_contract_schemes.1303.desc.method.diplo_non_bandit: "หลบหนีไปภายใต้หน้ากากของการแสร้งทำเป็นครุ่นคิดเกี่ยวกับข้อเสนออันเอื้อเฟื้อของข้า"
 laamp_base_contract_schemes.1303.desc.outro: "สายลับของ [employer.GetTitledFirstNamePossessive] ผิดหวังเมื่อพวกเขาตามทันข้า แต่ก็ไม่น่าแปลกใจนัก แม้จะเข้าใจพวกเขา แต่เมื่อไม่มีศีรษะที่จะส่งมอบให้ [employer.Custom('MistressMaster')] ของพวกเขา พวกเขาก็ไม่มีเจตนาที่จะให้ค่าจ้างแก่เรา"
 laamp_base_contract_schemes.1303.a: "ให้ตายเถอะ ไอ้เนื้องอก [recidivist.GetWomanMan] นั่น!"
 laamp_base_contract_schemes.1303.a.tt: "$laamp_base_contract_schemes.0000.f.contract_concluded$"

 laamp_base_contract_schemes.1304.t: "$laamp_base_contract_schemes.1004.t$: ความล้มเหลวพิเศษ!"
 laamp_base_contract_schemes.1304.desc: "[recidivist.GetFirstNameNicknamed] ตอบสนอง... อย่างน่าประหลาดใจต่อข้อเสนอของข้า และหลังจากที่เราได้พูดคุยกัน ข้าก็สามารถโน้มน้าว [recidivist.GetHerHim] ได้ว่าไม่เพียง แต่ข้าจริงใจเท่านั้น แต่ข้ายังสามารถเสนออนาคตที่ดีกว่าและสดใสกว่าสำหรับทั้ง [recidivist.GetHerHim] และคณะทั้งหมดของ [recidivist.GetHerHis] ได้\n\nดังนั้น พวกเขาทั้งหมดจึงได้เข้าร่วมกับ [ROOT.Char.GetPrimaryTitle.GetDefinitiveName|l]\n\nแน่นอนว่า [employer.GetTitledFirstName] อาจไม่ให้อภัยข้าที่ทรยศต่อความไว้วางใจของ [employer.GetHerHis] แต่ท้ายที่สุดแล้ว ข้าก็ได้แก้ไขปัญหาในแบบของข้าเอง มิใช่หรือ?"
 laamp_base_contract_schemes.1304.a: "[employer.GetFirstNameNoTooltip] จะไปตายที่ไหนก็ช่างเถอะสำหรับข้า"
 laamp_base_contract_schemes.1304.a.tt: "$laamp_base_contract_schemes.0000.f.contract_concluded$"

 laamp_base_contract_schemes.1782.t: "$laamp_base_contract_schemes.1041.t$: [victim.GetTitledFirstNameNoTooltip]"
 laamp_base_contract_schemes.1782.desc.intro.1: "เช้านี้ เราเห็นขบวนคนอยู่ไกล ๆ —"
 laamp_base_contract_schemes.1782.desc.intro.2: "หลายชั่วโมงก่อนพระอาทิตย์ตก เราบังเอิญเจอกลุ่มนักเดินทาง —"
 laamp_base_contract_schemes.1782.desc.intro.3: "ประมาณเที่ยงวัน เราตามทันกองคาราวานที่เราติดตามมาหลายวัน —"
 laamp_base_contract_schemes.1782.desc.intro.4: "ไม่นานหลังรุ่งสาง กลุ่มนักเดินทางเล็ก ๆ ก็ปรากฏขึ้นที่ขอบฟ้า —"
 laamp_base_contract_schemes.1782.desc.intro.5: "ก่อนแสงสุดท้ายจะหมดไป เราเริ่มเข้าใกล้ส่วนท้ายของขบวนยาว —"
 laamp_base_contract_schemes.1782.desc.connection.negative: "ดูเหมือนว่าพวกเขาจะนำโดย [victim.GetTitledFirstName] [victim.Custom2('RelationToMeShort',ROOT.Char)] ของข้า"
 laamp_base_contract_schemes.1782.desc.connection.positive: "ผู้นำพวกเขาคือ [victim.GetTitledFirstName] [victim.Custom2('RelationToMeShort',ROOT.Char)] ของข้า ซึ่งข้าไม่เต็มใจที่จะทำร้าย"
 laamp_base_contract_schemes.1782.desc.connection.family_or_consort: "ดูเหมือนว่าพวกเขาจะนำโดยไม่ใช่ใครอื่นนอกจาก [victim.GetTitledFirstName] [victim.Custom2('RelationToMeShort',ROOT.Char)] ของข้า!"
 laamp_base_contract_schemes.1782.desc.connection.none: "ด้านหน้าของพวกเขาคือ [victim.GetTitledFirstName] อย่างน้อยก็ตามที่สายลับของข้าบอก นำส่วนที่เหลือไปตามทางที่คดเคี้ยวของพวกเขา"
 laamp_base_contract_schemes.1782.desc.victim_type.pool: "จากรูปลักษณ์ของพวกเขา กลุ่มนี้ไม่ได้เป็นอะไรมากไปกว่านักพเนจรที่เดินทางไปเรื่อย ๆ ทรัพย์สินเดียวที่พวกเขามีคือสิ่งที่พวกเขาสามารถแบกได้และสิ่งที่ชื่อเสียงที่ดีของพวกเขาอาจสามารถหามาได้เป็นของขวัญ"
 laamp_base_contract_schemes.1782.desc.victim_type.baron: "ด้วย [victim.GetTitleAsNameNoTooltip] เป็นผู้นำ กลุ่มนี้มีทรัพย์สิน #EMP บางส่วน#! อย่างเห็นได้ชัด แต่ก็ไม่ได้ร่ำรวยล้นฟ้าด้วยเหรียญ ถึงกระนั้น ก็เป็นเหยื่อที่คุ้มค่า หากเราต้องการ เช่นนั้น"
 laamp_base_contract_schemes.1782.desc.victim_type.travelling_ruler: "นำโดย [victim.GetTitleAsNameNoTooltip] ผู้สูงศักดิ์ที่เดินทางนอก [victim.Custom('FortifiedBuilding')] ของ [victim.GetHerHis] แม้ว่าจะโชคดีที่มีทหารยามน้อยกว่าที่คาดไว้สำหรับผู้มีสถานะ เช่น [victim.GetFirstNamePossessiveNoTooltip] กลุ่มนี้ #EMP ไม่ต้องสงสัย#! เลยว่ามีทรัพย์สินมากมายให้ยึดครอง"
 laamp_base_contract_schemes.1782.desc.victim_type.travelling_nobody: "ขาดเครื่องประดับอันหรูหราของการปกครองหรือความกร้านที่ผ่านสภาพอากาศของนักเดินทางพเนจรที่แท้จริง กลุ่มนี้ดูเหมือนจะ... ไม่เหมาะกับการเดินทาง ใครจะเดาได้ว่าพวกเขามีเหรียญเท่าไหร่ให้เอาไป"
 laamp_base_contract_schemes.1782.desc.victim_type.laamp: "เห็นได้ชัดเจนว่า เช่นเดียวกับเรา นี่คือคณะนักผจญภัยที่เคลื่อนที่ไปมาเพื่อหาที่พักใหม่สำหรับค่ำคืน พวกเขาอาจจะร่ำรวยกว่ากษัตริย์หรือยากจนกว่าชาวนา ซึ่งเป็นสภาวะที่เราเองรู้จักดีเกินไป"
 laamp_base_contract_schemes.1782.desc.victim_type.fallback: "แม้ว่า[victim.GetWomanMan]ผู้นำของพวกมันจะสวมเสื้อผ้าที่ประณีตกว่าคนอื่น ๆ ในกลุ่มของ[victim.GetHerHis] แต่ก็เห็นได้ชัดว่าท้ายที่สุดแล้ว [victim.GetSheHe]ก็เป็นเพียงคนไร้ตัวตน เหรียญใด ๆ ก็ตามที่[victim.GetSheHe]มีติดตัว[victim.GetHerHim]นั้น น่าจะเป็นเงินทั้งหมดที่[victim.GetSheHe]มีในโลกนี้แล้ว"
 laamp_base_contract_schemes.1782.desc.outro: "[ROOT.Char.GetPrimaryTitle.GetDefinitiveName] เพียงรอสัญญาณของข้าเพื่อโจมตี"
 laamp_base_contract_schemes.1782.tt.victim_escapes: "[victim.GetTitledFirstNameNoTooltip] หลบหนีไปท่ามกลางความโกลาหล"
 laamp_base_contract_schemes.1782.a: "บุกโจมตีเจ้าพวกโง่เหล่านี้!"
 laamp_base_contract_schemes.1782.a.tt.success: "ท่าน ทำให้ขบวนแตกกระจายและปล้นสัมภาระของพวกเขา"
 laamp_base_contract_schemes.1782.a.tt.failure: "$laamp_base_contract_schemes.1782.c.tt.failure$"
 laamp_base_contract_schemes.1782.b: "ล้อมพวกเขาไว้แล้วมาดูกันว่าพวกเขาจะจ่ายเท่าไหร่"
 laamp_base_contract_schemes.1782.b.tt.success: "เมื่อถูกชิงไหวชิงพริบ พวกเขาก็ยอมจำนน"
 laamp_base_contract_schemes.1782.b.tt.failure: "$laamp_base_contract_schemes.1782.c.tt.failure$"
 laamp_base_contract_schemes.1782.c: "หยุด — เราจะโจมตีหลังค่ำ..."
 laamp_base_contract_schemes.1782.c.tt.easier_against_most_but_less_rewards: "#TUT โดยทั่วไปแล้วง่ายกว่า แต่ให้ [gold|E] น้อยลง#!"
 laamp_base_contract_schemes.1782.c.tt.success: "การซุ่มโจมตีที่ประสบความสำเร็จ"
 laamp_base_contract_schemes.1782.c.tt.failure: "กองทหารของท่านไร้ประสิทธิภาพ"
 laamp_base_contract_schemes.1782.d: "ปล่อยคนเหล่านี้ไป"
 laamp_base_contract_schemes.1782.d.tt: "ท่านสละโอกาสที่จะบรรเทาทุกข์ [victim.GetTitledFirstName] จากทรัพย์สินของ [victim.GetHerHis]"

 laamp_base_contract_schemes.1783.t: "$laamp_base_contract_schemes.1041.t$: สำเร็จ!"
 laamp_base_contract_schemes.1783.desc: "ใครว่าการเดินทางนั้นโหดร้าย ยากลำบาก และอันตราย?\n\nจากมุมมองของ [ROOT.Char.GetPrimaryTitle.GetDefinitiveNamePossessive|l] ดูเหมือนจะเป็นความพยายามที่ค่อนข้างง่ายและให้ผลกำไรพอสมควร ด้วยกระเป๋าข้างอานของเราที่หนักอึ้งด้วยเหรียญ เรายินดี — หากน่าสงสัย — ที่จะมาถึง [destination_2.GetBaseNameNoTier] ด้วยจิตวิญญาณที่สูงส่งและกระเป๋าที่อ้วนพี\n\nขอเพียงแค่หวังว่าเหยื่อของเราคนใดคนหนึ่งจะไม่ตามทันเราก่อนที่เราจะจากไป"
 laamp_base_contract_schemes.1783.a: "ถนนหนทางเป็นบ่อเกิดแห่งความมั่งคั่งทั้งปวงอย่างแท้จริง..."

 laamp_base_contract_schemes.1784.t: "$laamp_base_contract_schemes.1041.t$: ล้มเหลว!"
 laamp_base_contract_schemes.1784.desc: "อนิจจา บางครั้ง [ROOT.Char.GetFaith.FateGodName] ก็ยิ้มให้กับ [ROOT.Char.GetWomanMan] และบางครั้ง [ROOT.Char.GetFaith.FateGodSheHe] ก็ไม่\n\nวันนี้ ดูเหมือนว่าเรายังทำไม่เพียงพอที่จะได้รับความโปรดปรานจากโชคชะตา เพราะ [ROOT.Char.GetPrimaryTitle.GetDefinitiveName] ไม่ได้รับเหรียญแวววาวแม้ แต่เหรียญเดียวนับตั้งแต่เริ่มความพยายามทั้งหมดนี้\n\nเมื่อถนนของเราสิ้นสุดลง ดูเหมือนว่าเราต้องยอมรับความล้มเหลวของเราและก้าวต่อไป"
 laamp_base_contract_schemes.1784.a: "ตอนนั้นมันดูง่ายมาก..."

