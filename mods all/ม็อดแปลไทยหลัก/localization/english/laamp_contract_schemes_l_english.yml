 laamp_base_contract_schemes.2312.t.ignored: "$laamp_base_contract_schemes.2004.t$: ภารกิจถูกเพิกเฉย"
 laamp_base_contract_schemes.2312.desc.method.stewardship: "พวกเราพิจารณาบันทึกของ[char_current.GetTitledFirstNamePossessive], ใบเสร็จ, และพยานใด ๆ ก็ตามที่[char_current.GetSheHe]สามารถรวบรวมมาได้ในเวลาอันสั้นเกี่ยวกับธุรกรรมของ[char_current.GetHerHis]อย่างละเอียดถี่ถ้วนเป็นเวลานาน"
 laamp_base_contract_schemes.2312.desc.method.diplomacy: "การสนทนาของเรากินเวลานานกว่าหนึ่งชั่วโมง ทบทวนรายละเอียดเล็กน้อยที่ห่างไกลที่สุดของการติดต่อของ [char_current.GetTitledFirstNamePossessive] ใน [destination_1.GetBaseNameNoTier] ซ้ำแล้วซ้ำเล่า สถานที่ที่เกิดขึ้น บุคคลที่เกี่ยวข้อง จำนวนเงินที่ได้รับ และอื่น ๆ"
 laamp_base_contract_schemes.2312.desc.method.intrigue: "ข้านำการสนทนาไปตามเส้นทางปกติทั้งหมด ตรวจสอบให้แน่ใจว่าเว้นช่วงและทิ้งแนวคิดที่ค้างคาไว้เพียงพอที่จะให้ [char_current.GetTitledFirstName] มีโอกาสพลาดพลั้งได้มากมาย"
 laamp_base_contract_schemes.2312.desc.method.learning: "เราพูดคุยกันนานจน #EMP รู้สึก#! เหมือนเป็นส่วนที่ดีกว่าของวัน อภิปรายทุกแง่มุมที่คิดได้ของธุรกิจของ [char_current.GetTitledFirstNamePossessive] ใน [destination_1.GetBaseNameNoTier] ไม่มีก้อนหินใดที่ไม่ถูกพลิก ไม่มีคำถามใดที่ไม่ถูกถาม"
 laamp_base_contract_schemes.2312.desc.method.quartermaster: "ด้วย [quartermaster.GetFirstName] เป็นผู้นำการสัมภาษณ์ [char_current.GetTitledFirstName] นั่งลงเพื่อตอบคำถามที่ดูเหมือนไม่มีที่สิ้นสุด ในตอนแรกอย่างอดทน จากนั้นก็น้อยลงเรื่อย ๆ เมื่อเวลาผ่านไป"
 laamp_base_contract_schemes.2312.desc.method.thief.gold: "แน่นอนว่า [char_current.GetTitledFirstName] คร่ำครวญและฟูมฟายเกี่ยวกับเงินที่หายไปของ [char_current.GetHerHis] แต่เมื่อผู้ติดตามของข้ารักษาความปลอดภัยไว้ได้ ก็ไม่มีอะไรมากที่ [char_current.GetSheHe] สามารถทำได้"
 laamp_base_contract_schemes.2312.desc.method.thief.courtier_opinion: "[char_current.GetTitledFirstName|U] พิสูจน์แล้วว่าไม่พอใจนักกับการ #EMP ได้มา#! ของข้า แต่นั่นเป็นปัญหาของ [char_current.GetHerHis]: ผู้ติดตามที่กตัญญูของข้าไม่ต้องสงสัยเลยว่าจะไม่คืนของฟุ่มเฟือยใหม่ของพวกเขาโดยง่าย"
 laamp_base_contract_schemes.2312.desc.method.thief.piety: "[char_current.GetTitledFirstName|U] สามารถคร่ำครวญและพูดพล่ามได้ตามที่ [char_current.GetSheHe] ต้องการเกี่ยวกับคำสาปของ [char_current.GetFaith.FateGodName] ต่อโจรและอื่น ๆ แต่ข้าคิดว่าข้ารู้ว่าใครในพวกเราศักดิ์สิทธิ์กว่าตอนนี้"
 laamp_base_contract_schemes.2312.desc.method.thief.provisions: "[char_current.GetTitledFirstName|U] ตวาดใส่เรา โยนคำดูถูกสองสามคำ แต่ท้ายที่สุดก็พิสูจน์แล้วว่าฉลาดพอที่จะไม่ขวางทางระหว่างคณะ [ROOT.Char.Custom('GetLaampDescribeTypeSelfPlural')] ที่หิวโหยกับอาหารที่เพิ่งได้มาใหม่ของพวกเขา"
 laamp_base_contract_schemes.2312.desc.result.outro.all_done: "และด้วยเหตุนั้น เราก็ได้ติดตามทุกเบาะแสที่เรามี เหลือเพียงสิ่งเดียวที่ต้องทำ"
 laamp_base_contract_schemes.2312.desc.result.success: "ไม่ต้องใช้ความพยายามมากนักในการล้วงเอาความจริงออกมาจาก [char_current.GetHerHim] — สิ่งที่ [char_current.GetSheHe] ดูเหมือนจะประหลาดใจอย่างยิ่ง"
 laamp_base_contract_schemes.2312.desc.result.failure: "แม้จะพยายามอย่างดีที่สุดแล้ว แต่ [char_current.GetSheHe] ดูเหมือนจะไร้ที่ติติงโดยสิ้นเชิง — ท่าทีที่ [char_current.GetSheHe] พอใจเกินไป"
 laamp_base_contract_schemes.2312.desc.result.ignored: "นกในมือมีค่ากว่านกสองตัวในพุ่มไม้ และผลกำไรที่น่าจะได้มาอย่างไม่ถูกต้องของ [char_current.GetWomanMan] ผู้นี้นั่งอยู่ในมือของข้าอย่างสบาย ๆ — แม้ว่าการนำพวกมันไปจะตัดความสามารถของเราในการสืบสวน [char_current.GetHerHim] ก็ตาม"
 laamp_base_contract_schemes.2312.desc.result.outro.success: "ขอให้โชคของเรายังคงอยู่สำหรับคนต่อไป"
 laamp_base_contract_schemes.2312.desc.result.outro.failure: "หวังว่าเราจะทำได้ดีกว่านี้กับคนต่อไป"
 laamp_base_contract_schemes.2312.desc.result.outro.ignored: "ขอให้คนต่อไปให้ผลกำไร เช่นกัน"
 laamp_base_contract_schemes.2312.a: "[person_a.GetFirstNameNoTooltip] คนต่อไป"
 laamp_base_contract_schemes.2312.b: "ต่อไปยังทรัพย์สินของ [person_b.GetFirstNamePossessiveNoTooltip]"
 laamp_base_contract_schemes.2312.c: "ยังมี [person_c.GetFirstNameNoTooltip] อยู่..."
 laamp_base_contract_schemes.2312.d: "เราจะมาดูกันว่า [person_d.GetFirstNameNoTooltip] ซ่อนอะไรไว้หรือไม่"
 laamp_base_contract_schemes.2312.e: "ข้าได้ตัดสินใจแล้ว"
