 laamp_base_contract_schemes.0541.t: "ผู้มีฝีมือ"
 laamp_base_contract_schemes.0541.desc: "การสร้างความประทับใจให้ [target.GetTitledFirstName] บางครั้งรู้สึกเหมือนเป็นงานตลอดทั้งฤดูกาล\n\nแม้ว่าจะแทบจะไม่ใช่ขุนนางที่ยิ่งใหญ่ที่สุดในโลก แต่ [target.GetSheHe] ก็มีแนวคิดที่ #EMP แปลกประหลาด#! มากเกี่ยวกับมาตรฐานที่ผู้อื่นควรยึดถือ\n\nในสถานการณ์ เช่นนี้ สิ่งที่ปลอดภัยที่สุดที่ควรทำคืออาจจะกลับไปใช้สิ่งที่ข้าถนัดที่สุด เลือกสิ่งที่ข้าทำได้ดีและปล่อยให้ทักษะของข้าเปล่งประกาย\n\nถึงกระนั้น สำหรับคนที่ไม่แน่นอนบ่อยครั้ง เช่น [target.GetFirstNameNoTooltip] ข้าก็อาจจะลองเอาชนะในสิ่งที่คิดว่าเป็นขอบเขตความรับผิดชอบของข้าน้อยลง"
