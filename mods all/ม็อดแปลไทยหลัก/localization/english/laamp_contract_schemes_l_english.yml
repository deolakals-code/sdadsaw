 laamp_base_contract_schemes.2671.f: "ท่านจะบอกว่ากำแพง... #EMP อ่อนแอที่สุด#! ที่ไหน..."
 laamp_base_contract_schemes.2671.g: "$laamp_base_contract_schemes.2661.g$"
 laamp_base_2071_success_employer_modifier: "กำแพงเสริมความแข็งแกร่ง"
 laamp_base_2071_success_employer_modifier_desc: "ชุมชนที่สำคัญที่นี่เพิ่งใช้เวลาในการเสริมความแข็งแกร่งให้กับกำแพงของตนเมื่อเร็ว ๆ นี้"
 laamp_base_2071_failure_employer_modifier: "งานซ่อมแซมที่ผิดพลาด"
 laamp_base_2071_failure_employer_modifier_desc: "กำแพงของชุมชนสำคัญในเคาน์ตีนี้ได้พังทลายลง และที่เลวร้ายกว่านั้นคือได้รับความเสียหายระหว่างการพยายามซ่อมแซม"

 laamp_base_contract_schemes.2672.t: "$laamp_base_contract_schemes.2031.t$: สำเร็จ!"
 laamp_base_contract_schemes.2672.desc.resolution_type.stewardship: "การยกเว้นเล็กน้อยสองสามอย่าง การอนุญาตสำหรับสิ่งนี้หรือสิ่งนั้น ตราประทับของ [employer.GetTitleAsNamePossessiveNoTooltip] สำหรับโครงการบางอย่าง และทันใดนั้นทุกคนก็ #EMP เห็นด้วย#! มากขึ้นกับหน้าที่เพิ่มเติมเล็กน้อยเพื่อจ่ายค่ากำแพง\n\nไม่ต้องสนใจว่าการสับเปลี่ยนภาษีและภาระของพวกเขาหมายความว่าพวกเขากำลังจ่ายเงินจำนวนเท่าเดิมที่ถูกขอในตอนแรก ไม่เลย สำหรับตอนนี้สิ่งสำคัญที่สุดคือผู้คนดี ๆ แห่ง [employer.GetPrimaryTitle.GetBaseNameNoTier] รู้สึกว่าพวกเขาเล่นเกมได้ดี"
 laamp_base_contract_schemes.2672.desc.resolution_type.secondary_skill: "อับอายและถูกกระตุ้นให้ลงมือทำตามตัวอย่างของข้า — และด้วยความช่วยเหลือของผู้ติดตามสองสามคนจาก [ROOT.Char.GetPrimaryTitle.GetDefinitiveName] — ผู้คนดี ๆ แห่ง [ROOT.Char.GetPrimaryTitle.GetBaseNameNoTier] และข้าก็เริ่มทำงานซ่อมแซมแนวป้องกันของพวกเขา\n\nโชคดีที่ กำแพงดูแย่กว่าที่เป็นจริงอย่างมาก ความคืบหน้าที่ดีอย่างมีนัยสำคัญเกิดขึ้น และด้วยค่าใช้จ่ายเพียงแรงงานสองสามวันที่ชดเชยได้อย่างง่ายดายด้วยค่าธรรมเนียมเล็กน้อย"
 laamp_base_contract_schemes.2672.desc.resolution_type.left_sacrifice: "ดูเหมือนจะเหนื่อยล้าแล้ว [sacrifice.GetTitledFirstName] กำลังพยายามชี้นำผู้คนขี้เถียงแห่ง [employer.GetPrimaryTitle.GetBaseNameNoTier] เมื่อ [employer.GetTitledFirstName] และข้าออกจากห้อง\n\n"อย่ากังวลไปเลย [ROOT.Char.GetTitledFirstNameNoTooltip] เราจะดูแล [sacrifice.GetWomanMan] ของท่านอย่างดีและส่ง [sacrifice.GetHerHim] กลับมาในสภาพสมบูรณ์"\n\nอา มันคือการวางหินสองสามก้อนซ้อนกัน มันจะยากได้อย่างไร? ด้วยความขอบคุณ ข้ารับค่าจ้างและเคลื่อนตัวออกไป"
 laamp_base_contract_schemes.2672.desc.resolution_type.officer: "ตำแหน่งของ [officer.GetTiledFirstNamePossessive|U] ในฐานะ $head_porter_camp_officer$ ของข้า"
 laamp_base_contract_schemes.2672.desc.resolution_type.camp_purpose: "เมือง [employer.GetPrimaryTitle.GetBaseNameNoTier] ลุกเป็นไฟ\n\nอืม ส่วนใหญ่ ไม่ใช่ส่วนที่ผู้ติดตามของข้ากำลังลากกลับไปยังค่ายของ [ROOT.Char.GetPrimaryTitle.GetDefinitiveName] ไม่เลย พวกนั้นจะยังคง #EMP ปลอดภัย#! ในการดูแลของข้า\n\nเป็นการมีเกียรติหรือไม่ที่ข้าปล้นชุมชนที่มาขอความช่วยเหลือจากข้าเพียง เพราะข้าทำได้? บางทีอาจจะไม่\n\nแต่แล้ว คนโง่เขลายิ่งกว่าที่เสนอค่าจ้าง เช่นนั้นให้กับคนที่ไม่รู้จักเลยแม้ แต่น้อย..."
 laamp_base_contract_schemes.2672.desc.resolution_type.stress: "การข่มขู่ผู้คนใน [employer.GetPrimaryTitle.GetBaseNameNoTier] ให้เชื่อฟังต้องอาศัยการผสมผสานอย่างหนักของการตะโกน การเกลี้ยกล่อม และการ ทำให้รู้สึกผิด\n\nมันเป็นงานที่น่าเบื่อหน่ายและเหนื่อยล้า ซึ่งส่งผลต่อจิตใจ แต่ทีละคน ผู้มีอิทธิพลในท้องถิ่นก็ยอมทำตามและตกลงอย่างขมขื่นที่จะจ่ายส่วนแบ่งที่ยุติธรรมของพวกเขา บางทีอาจจะไม่ใช่การแก้ไขที่สง่างาม แต่ถ้ามันได้ผล มันก็ได้ผล"
 laamp_base_contract_schemes.2672.desc.outro: "\n\n[employer.GetTitledFirstName] พอใจเพียงพอกับวิธีแก้ปัญหาของเรา ยินดีมอบเหรียญของ [employer.GetHerHis]"
 laamp_base_contract_schemes.2672.a: "$laamp_base_contract_schemes.2662.a$"
 laamp_base_contract_schemes.2672.a.city_sacked: "ผู้ซื้อพึงระวัง"
 
 laamp_base_contract_schemes.2673.t: "$laamp_base_contract_schemes.2031.t$: ล้มเหลว!"
 laamp_base_contract_schemes.2673.desc.stewardship: "แผนของข้าดูเหมือนจะสมเหตุสมผลเพียงพอสำหรับข้า โดยแบ่งค่าใช้จ่ายอย่างเท่าเทียมกันระหว่างคนท้องถิ่นก่อน จากนั้นปรับเล็กน้อยตามความมั่งคั่งและรายได้ แต่ผู้มีอิทธิพลตอบสนองด้วยความตกใจและความสยดสยอง\n\nอย่างใดอย่างหนึ่ง ทุกคนเชื่อมั่นว่าพวกเขากำลังจ่ายเงินมากเกินไป แม้กระทั่งสำหรับผลประโยชน์ส่วนรวมนี้ ไม่ว่าความมั่งคั่งหรือสถานะของพวกเขาจะเป็น อย่างไรก็ตาม"
 laamp_base_contract_schemes.2673.desc.officer: "บางที [officer.GetTitledFirstName] อาจจะไม่ใช่ $head_porter_camp_officer$ ที่ยอดเยี่ยมเท่าที่ข้าจินตนาการไว้\n\nไม่ถึงครึ่งชั่วโมงในแผนการที่เสนอของ [officer.GetHerHis] สำหรับการสร้างกำแพงใหม่ และผู้คนใน [employer.GetPrimaryTitle.GetBaseNameNoTier] ก็กำลังขัดคอกัน ตะโกน กรีดร้อง เตะ กัด อย่าง #EMP สิ้นหวัง#! โดยสิ้นเชิงที่จะหลีกเลี่ยงภารกิจที่อยู่ตรงหน้า"
 laamp_base_contract_schemes.2673.desc.outro: "\n\n[employer.GetTitledFirstName] ที่ทุกข์ใจอย่างยิ่งจะไม่แม้ แต่จะพูดกับข้าหลังจากการทำงานที่ผิดพลาดนี้\n\nเราถูกขับไล่ออกจากเมือง ไม่ได้เหรียญเดียวสำหรับความลำบากของเรา"
 laamp_base_contract_schemes.2673.a: "$laamp_base_contract_schemes.2663.a$"

 laamp_base_contract_schemes.2676.t: "$laamp_base_contract_schemes.2031.t$: ทุ่งหญ้าเลี้ยงสัตว์อันเป็นที่โปรดปราน"
 laamp_base_contract_schemes.2676.desc: "ถนนของ [employer.GetPrimaryTitle.GetBaseNameNoTierPossessive] ถูกครอบงำด้วยไข้แห่งข่าวลือและเรื่องอื้อฉาว — เรื่องที่ซับซ้อนเกี่ยวกับการ แต่งงาน การสืบทอดมรดก และข้อตกลงทางธุรกิจที่ผิดพลาดได้ ทำให้พื้นที่ที่ดีที่สุดในท้องถิ่นส่วนใหญ่สำหรับเลี้ยงม้าตกไปอยู่ในมือของคนโง่เขลาบางคนที่ไม่มียศศักดิ์และไม่มีทักษะ\n\nดังนั้น ผู้มีอิทธิพลในท้องถิ่นจึงขู่ว่าจะฉีกเนื้อกันเองเกี่ยวกับวิธี (และใครควร) แบ่งที่ดิน"
 laamp_base_contract_schemes.2676.desc.outro: "$laamp_base_contract_schemes.2661.desc.outro$"
 laamp_base_contract_schemes.2676.a: "$laamp_base_contract_schemes.2661.a$"
 laamp_base_contract_schemes.2676.b: "$laamp_base_contract_schemes.2661.b$"
 laamp_base_contract_schemes.2676.b.tt.success: "$laamp_base_contract_schemes.2661.b.tt.success$"
 laamp_base_contract_schemes.2676.b.tt.failure: "$laamp_base_contract_schemes.2661.b.tt.failure$"
 laamp_base_contract_schemes.2676.c: "ทุ่งหญ้าเลี้ยงสัตว์เหรอ? นี่ฟังดูเหมือนขอบเขตความรับผิดชอบของข้า"
 laamp_base_contract_schemes.2676.d.sacrifice_exists: "$laamp_base_contract_schemes.2661.d.sacrifice_exists$"
 laamp_base_contract_schemes.2676.d.sacrifice_unexists: "$laamp_base_contract_schemes.2661.d.sacrifice_unexists$"
 laamp_base_contract_schemes.2676.d.no_valid_char: "ท่านขาด [follower|E] ที่พร้อมใช้งาน ซึ่งมี [martial|E] อย่างน้อย [EmptyScope.ScriptValue('laamp_base_contract_schemes_2661_other_skill_threshold_value')|0] เพื่อมอบหมายชั่วคราวให้กับ [court|E] ของ [employer.GetFirstNamePossessive]"
 laamp_base_contract_schemes.2676.d.tt.courtier_stays_here: "$laamp_base_contract_schemes.2661.d.tt.courtier_stays_here$"
 laamp_base_contract_schemes.2676.e.officer_exists: "$laamp_base_contract_schemes.2661.e.officer_exists$"
 laamp_base_contract_schemes.2676.e.officer_unexists: "$laamp_base_contract_schemes.2661.e.officer_unexists$"
 laamp_base_contract_schemes.2676.f: "ใช่แล้ว เรารู้เรื่องเกี่ยวกับม้าอยู่บ้าง"
 laamp_base_contract_schemes.2676.g: "$laamp_base_contract_schemes.2661.g$"
 laamp_base_2076_success_employer_modifier: "ม้าชั้นดี"
 laamp_base_2076_success_employer_modifier_desc: "ม้าในเคาน์ตีนี้เป็นที่อิจฉาของแผ่นดิน"
 laamp_base_2076_failure_employer_modifier: "ม้าผอมโซ"
 laamp_base_2076_failure_employer_modifier_desc: "เคาน์ตีนี้ ไม่ว่าด้วยเหตุผลใดก็ตาม ผลิตม้าที่แย่อย่างฉาวโฉ่ทุกชนิด"

 laamp_base_contract_schemes.2677.t: "$laamp_base_contract_schemes.2031.t$: สำเร็จ!"
 laamp_base_contract_schemes.2677.desc.resolution_type.stewardship: "อีกครั้งที่ทักษะครอบครัวอันภาคภูมิใจของตระกูล [ROOT.Char.GetHouse.GetName] ชนะ!\n\nแม้จะวางท่า แต่ผู้มีอิทธิพล แต่ละคนก็เพียงแค่ต้องการส่วนแบ่งของตน และภายในบ่ายวันนั้น ข้าก็สามารถร่างการแบ่งที่ดินที่ยุติธรรมพอที่พวกเขาจะผิดหวังเพียง #EMP เล็กน้อย#! เท่านั้น\n\nแม้ แต่เจ้าของที่โง่เขลาก็จะได้รับค่าชดเชยบางส่วน ทำให้การทะเลาะวิวาทลดลงสู่ระดับที่จัดการได้"
 laamp_base_contract_schemes.2677.desc.resolution_type.secondary_skill: "ข้ามีประสบการณ์เพียงพอในเรื่องของสงครามที่จะรู้ว่าที่ดินที่ดีที่สุดไม่ได้เลี้ยงม้าที่ดีที่สุดเสมอไป และม้าที่ดีที่สุดก็ไม่ต้องการที่ดินที่ดีที่สุด\n\nอย่างใจเย็น ระมัดระวัง และดูถูก #EMP เล็กน้อย#! ข้าอธิบายข้อผิดพลาดในความคิดของพวกเขาให้ผู้มีอิทธิพลแห่ง [employer.GetPrimaryTitle.GetBaseNameNoTierPossessive] ฟัง พวกเขา... ไม่เต็มใจที่จะฟังในตอนแรก — ที่ดินก็ยังคงเป็นที่ดินหลังจากทั้งหมด — แต่ข้อโต้แย้งที่ดีมักจะชนะในที่สุด"
 laamp_base_contract_schemes.2677.desc.resolution_type.left_sacrifice: "[employer.GetTitledFirstName|U] และข้าทิ้ง [sacrifice.GetTitledFirstName] ไว้ให้กับการดูแลอย่างอ่อนโยนของผู้มีอิทธิพลในท้องถิ่น แม้ขณะที่เราเดินจากไป เสียงตะโกนก็เริ่มขึ้น — เพิ่มระดับเสียงเร็วกว่าที่เราจะหนีทัน\n\n"ไม่ใช่สิ่งที่ข้าคาดหวังไว้เป็นทางออก" [employer.GetFirstNameNoTooltip] พยักหน้าอย่างครุ่นคิด "แต่ข้าแทบจะไม่สามารถตำหนิความละเอียดถี่ถ้วนของท่านได้ ท่านแน่ใจหรือไม่ว่า [sacrifice.GetSheHe] จะสบายดีที่นี่?"\n\nข้าเลิกคิ้ว\n\n"อา แน่นอน ข้ากำลังพูดอะไรอยู่" [employer.GetTitleAsNameNoTooltip] พูดพล่าม "ข้าจะพูดให้ตัวเองกลับไปสู่ความยุ่งเหยิงเดิมในอัตรานี้ นี่ ค่าจ้างของท่านสำหรับการให้ยืม [sacrifice.GetWomanMan] ที่มีทักษะ เช่นนี้แก่เรา""
 laamp_base_contract_schemes.2677.desc.resolution_type.officer: "ความเชี่ยวชาญเกี่ยวกับม้าของ [officer.GetTitledFirstNamePossessive|U] มีประโยชน์อย่างยิ่งสำหรับเราในวันนี้\n\nเมื่อปล่อยให้เผชิญหน้ากับคนท้องถิ่นและบอกให้พูดคุยเกี่ยวกับหนึ่งในความหลงใหลอันยิ่งใหญ่ของ [officer.GetHerHis] [officer.GetWomanMan] ก็สามารถค่อย ๆ เอาชนะพวกเขาด้วยความอับอายเกี่ยวกับวิธีที่พวกเขาดูแลม้าและสัตว์ใช้งานของตน โดยลงรายละเอียดอย่างละเอียดถี่ถ้วนเกี่ยวกับวิธีการเลี้ยงสัตว์ที่ดีขึ้นและมีสุขภาพดีขึ้นโดยไม่ต้องทะเลาะวิวาทกันเรื่องทุ่งหญ้าที่ดีที่สุด\n\nในตอนท้าย พวกเขาพยักหน้าตามทุกจังหวะและคำวิจารณ์เฉพาะกลุ่มอย่างน่าละอาย การโต้เถียงทั้งหมดถูกลืมไป"
 laamp_base_contract_schemes.2677.desc.resolution_type.camp_purpose: "แน่นอนว่า ในสายงานของ [ROOT.Char.GetPrimaryTitle.GetDefinitiveNamePossessive] ท่านเรียนรู้สิ่งหนึ่งหรือสองอย่างเกี่ยวกับทุ่งหญ้าเลี้ยงสัตว์ที่ดี\n\nด้วยความชำนาญที่ฝึกฝนมาอย่างดี เกือบจะง่ายดาย เราสามารถปัดเป่าความกังวลของคนท้องถิ่นและแบ่งที่ดินอย่างยุติธรรมและดีได้\n\nการเตือนอย่างไม่เป็นทางการเกี่ยวกับกลุ่มทหารรับจ้างที่ตั้งค่ายอยู่ใกล้ ๆ ซึ่งรับจ้างโดยเมือง[employer.Custom('MistressMaster')] ของพวกเขาก็ไม่เสียหาย เช่นกัน"
 laamp_base_contract_schemes.2677.desc.resolution_type.stress: "ด้วยจิตใจที่ยุติธรรม การทำงานหนัก และความทรหดอดทนทั้งหมดที่ [ROOT.Char.GetWomanMan] แห่งตระกูล [ROOT.Char.GetHouse.GetName] สามารถรวบรวมได้ ทุกสิ่งก็เป็นไปได้\n\nใช้เวลาหลายชั่วโมงในการอภิปรายอย่างหนักหน่วงเพื่อบรรลุข้อตกลงที่ยุติธรรมในการแบ่งที่ดิน ยุติธรรมสำหรับทุกคนยกเว้นคนโง่ที่สูญเสีย จริง ๆ แล้ว แต่คนโง่ก็ได้รับค่าชดเชยมากกว่าที่พวกเขาจะได้รับหากข้าไม่ได้อยู่ที่นี่เพื่อเจรจา\n\nสิ่งสำคัญคือผู้มีอิทธิพลพอใจเพียงพอ — หรืออย่างน้อยก็แค่พึมพำเล็กน้อย — กับข้อเสนอแนะของข้า"
 laamp_base_contract_schemes.2677.desc.outro: "\n\n[employer.GetTitledFirstName|U] ดูเหมือนจะพอใจกับการแก้ปัญหาของเรามากกว่า และยินดีมอบเหรียญของ [employer.GetHerHis]"
 laamp_base_contract_schemes.2677.a: "$laamp_base_contract_schemes.2662.a$"
 
 laamp_base_contract_schemes.2678.t: "$laamp_base_contract_schemes.2031.t$: ล้มเหลว!"
 laamp_base_contract_schemes.2678.desc.stewardship: "หลังจากเจรจาต่อรองหลายชั่วโมง ดูเหมือนว่าเราจะห่างไกลจากข้อตกลงมากกว่าตอนที่เราเริ่มต้น\n\nผู้มีอิทธิพลรายย่อยที่หิวอำนาจทุกคนใน [employer.GetPrimaryTitle.GetBaseNameNoTier] ต้องการส่วนแบ่ง #EMP ของพวกเขา#! จากผืนดินที่มีมูลค่าสูงกว่าค่าเฉลี่ยเล็กน้อย และเต็มใจที่จะกรีดร้องจนบ้านพัง เพื่อให้ได้มันมา\n\n"
 laamp_base_contract_schemes.2678.desc.officer: "ข้าคิดว่า [officer.GetTitledFirstName] ควรจะ #EMP เก่ง#! ในเรื่องดังกล่าว\n\nอนิจจา ไม่ว่า [officer.GetSheHe] จะรู้มากเกินไปและผู้คนใน [employer.GetPrimaryTitle.GetBaseNameNoTier] จะสนใจน้อยเกินไป หรือ [officer.GetFirstNameNoTooltip] จะรู้น้อยเกินไปและคนท้องถิ่นจะสนใจมากเกินไป\n\nการโต้เถียง ข้อกล่าวหา และการทุบโต๊ะอย่างโกรธเกรี้ยวจึงตามมา"
 laamp_base_contract_schemes.2678.desc.outro: "ในตอนเย็น [employer.GetTitledFirstName] ที่ทุกข์ใจอย่างยิ่งก็ขับไล่เราออกไปอย่างหยาบคาย หงุดหงิดอย่างยิ่งกับความล้มเหลวของเรา\n\nดูเหมือนว่าจะไม่มีค่าจ้างสำหรับเราในวันนี้"
 laamp_base_contract_schemes.2678.a: "$laamp_base_contract_schemes.2663.a$"

 # Something something "everyone's favourite part of the video"...
 laamp_base_contract_schemes.2681.t: "$laamp_base_contract_schemes.2031.t$: ลายเส้นบนแผนที่"
 laamp_base_contract_schemes.2681.desc: "การมาถึงของพวกเราใน [employer.GetPrimaryTitle.GetBaseNameNoTier] มิได้รับการต้อนรับอย่างเอิกเกริกนัก — ราษฎรในท้องถิ่นกำลังประสบวิกฤตเกี่ยวกับแผนที่โบราณบางชิ้นหรืออะไรทำนองนั้นที่ถูกขุดพบ และ #EMP อย่างสิ้นเชิง#! วาดแนวเขตแดนใหม่ระหว่างนิคมบริวารสองแห่งของนคร\n\nหากมิได้รับการแก้ไขในเร็ววัน สถานการณ์ที่ดีที่สุดคือการเก็บภาษีหยุดชะงัก ส่วนสถานการณ์เลวร้ายที่สุดอาจเป็นสงครามย่อยในท้องถิ่น$laamp_base_contract_schemes.2661.desc.outro$"
 laamp_base_contract_schemes.2681.a: "$laamp_base_contract_schemes.2661.a$"
 laamp_base_contract_schemes.2681.b: "$laamp_base_contract_schemes.2661.b$"
 laamp_base_contract_schemes.2681.b.tt.success: "$laamp_base_contract_schemes.2661.b.tt.success$"
 laamp_base_contract_schemes.2681.b.tt.failure: "$laamp_base_contract_schemes.2661.b.tt.failure$"
 laamp_base_contract_schemes.2681.c: "โปรดให้ข้าได้พิจารณาแผนที่ของท่านเถิด"
 laamp_base_contract_schemes.2681.d.sacrifice_exists: "$laamp_base_contract_schemes.2661.d.sacrifice_exists$"
 laamp_base_contract_schemes.2681.d.sacrifice_unexists: "$laamp_base_contract_schemes.2661.d.sacrifice_unexists$"
 laamp_base_contract_schemes.2681.d.no_valid_char: "ท่านขาด [follower|E] ที่ว่างอยู่ ซึ่งมี [learning|E] อย่างน้อย [EmptyScope.ScriptValue('laamp_base_contract_schemes_2661_other_skill_threshold_value')|0] เพื่อมอบหมายให้ประจำการชั่วคราว ณ [court|E] ของ [employer.GetFirstNamePossessive]"
 laamp_base_contract_schemes.2681.d.tt.courtier_stays_here: "$laamp_base_contract_schemes.2661.d.tt.courtier_stays_here$"
 laamp_base_contract_schemes.2681.e.officer_exists: "$laamp_base_contract_schemes.2661.e.officer_exists$"
 laamp_base_contract_schemes.2681.e.officer_unexists: "$laamp_base_contract_schemes.2661.e.officer_unexists$"
 laamp_base_contract_schemes.2681.f: "เพียงแค่ #EMP แผนที่?#! นี่คือทั้งหมดที่ท่านมีหรือ?"
 laamp_base_contract_schemes.2681.g: "$laamp_base_contract_schemes.2661.g$"

 laamp_base_contract_schemes.2682.t: "$laamp_base_contract_schemes.2031.t$: สำเร็จ!"
 laamp_base_contract_schemes.2682.desc.resolution_type.stewardship: "โชคดีนัก ที่ข้ามี [ROOT.Char.Custom('SenseObserve_SenseEye')] อันเฉียบแหลมในการสังเกตรายละเอียด และใช้เวลาไม่นานนักในการชี้ให้เห็นถึงข้อพิรุธหลายประการว่าแผนที่เป็นการปลอมแปลงอย่างเห็นได้ชัด"
 laamp_base_contract_schemes.2682.desc.resolution_type.secondary_skill: "แผนที่ดูเหมือนของแท้อยู่พอควร — หากท่านเป็น #EMP คนเขลา#!! ทว่า ข้าคือ [ROOT.Char.GetWomanMan] ผู้เปี่ยมภูมิปัญญา และการแสดงให้เห็นถึงที่มาอันมีข้อบกพร่องของมันเป็นเรื่องง่ายดายดุจการสวมเสื้อคลุม"
 laamp_base_contract_schemes.2682.desc.resolution_type.left_sacrifice: "ขณะที่ [sacrifice.GetTitledFirstName] นั่งลงอย่างอ่อนล้าเพื่อเข้าสู่กระบวนการอัน #EMP ยาวนาน#! อย่างยิ่งในการรับฟังทุกฝ่ายในข้อถกเถียงนี้ก่อนจะค้นพบความจริงบางประการ [employer.GetTitledFirstName] ก็ดึงข้าไปด้านข้าง\n\n"ทำได้ดีมาก [ROOT.Char.GetTitledFirstNameNoTooltip] ไม่น่าเชื่อว่าท่านจะมี [sacrifice.GetWomanMan] ผู้ทรงภูมิปัญญา เช่นนี้พร้อมให้ยืมแก่นครอันต่ำต้อยของข้า!"\n\nณ เบื้องหลัง [sacrifice.GetFirstNameNoTooltip] ทำให้เสียงแหลมที่ร้องตะโกนเกี่ยวกับสิทธิ์โดยกำเนิดเงียบลง\n\n"ข้ามิสงสัยเลยว่าเราจะแก้ไขปัญหานี้ได้ ในที่สุดแล้ว ค่าจ้างของท่านรออยู่ด้านนอกแล้ว""
 laamp_base_contract_schemes.2682.desc.resolution_type.officer: "ทักษะวาทศิลป์ของ [officer.GetTitledFirstNamePossessive|U] ยอดเยี่ยมถึงขั้นที่ [officer.GetSheHe] สามารถปลุกปั่นชาวบ้านได้ #EMP เพียงพอ#! เกี่ยวกับความเป็นไปได้ที่แผนที่นั้นจะเป็นของจริง [officer.GetSheHe|U] ชี้นำพวกเขาไปยังหัวข้อหนึ่งแล้วไปยังอีกหัวข้อหนึ่ง จนกระทั่งคนส่วนใหญ่ในห้องประณามว่ามันเป็นการปลอมแปลงอย่างชัดแจ้งพร้อมอธิบายเหตุผล"
 laamp_base_contract_schemes.2682.desc.resolution_type.camp_purpose: "ข้า... อาจจะทำเกินไปบ้างในการอธิบายความสัมพันธ์ระหว่างเศษกระดาษหนังอันบอบบางกับสิทธิ์โดยสายเลือดที่แท้จริงต่อสิ่งสำคัญ เช่นผืนดิน\n\nหลังจากชั่วโมงแรกผ่านไป ชาวบ้านเพียงจ้องมองกลับมาที่ข้าอย่างเหม่อลอย ใบหน้าประดุจสวมหน้ากากแห่งความอัปยศ ความสับสน และความพิศวงยินดีเป็นครั้งคราว\n\nเรื่องหยุมหยิมเกี่ยวกับเอกสาร 'โบราณ' ของพวกเขาถูกปล่อยให้ผ่านเลยไป และความเงียบอันน่าอึดอัดเข้าปกคลุมห้อง\n\n[employer.GetTitledFirstName|U] ผายมือเชิญข้าออกไปอย่างเงียบๆ และดูเหมือนจะพอใจพอสมควร พลางมอบเหรียญตราของเราให้"
 laamp_base_contract_schemes.2682.desc.resolution_type.stress: "หลังจากการถกเถียง กล่าวหา และข่มขู่เป็นครั้งคราว นานหลายชั่วโมง ในที่สุดข้าก็ระบุตัวชี้วัดสำคัญหลายประการได้ว่าแผนที่น่าจะเป็นของปลอม — ดังนั้นจึงไร้ค่า"
 laamp_base_contract_schemes.2682.desc.outro: "\n\nโอ้ แน่นอน ตอนแรกก็มีคนโต้เถียงบ้าง แต่เมื่อหลักฐานยังคงเพิ่มพูนขึ้นเรื่อยๆ ในที่สุดผู้สมรู้ร่วมคิดคนหนึ่งก็ #EMP สติแตก#! ภายใต้แรงกดดันและชี้ตัวคหบดีท้องถิ่นว่าเป็นผู้กระทำผิด\n\nหลังจากการจับกุมอย่างง่ายดาย [employer.GetPrimaryTitle.GetBaseNameNoTier] ก็มีเรื่องใหม่ให้ซุบซิบนินทา ขณะที่นิคมบริวารถูกบังคับให้ล่าถอยจากการจ้องจะทำร้ายกัน\n\nเมื่อความตึงเครียดคลี่คลายลงและสิ่งต่างๆ กำลังกลับคืนสู่สภาวะปกติ [employer.GetTitledFirstName] ก็มอบเหรียญตราของเราให้ด้วยความขอบคุณ"
 laamp_base_contract_schemes.2682.a: "$laamp_base_contract_schemes.2662.a$"
 
 laamp_base_contract_schemes.2683.t: "$laamp_base_contract_schemes.2031.t$: ล้มเหลว!"
 laamp_base_contract_schemes.2683.desc.stewardship: "ข้าเชื่อว่าการตั้งคำถามถึงความน่าเชื่อถือของแผนที่นั้นเป็นทางที่ถูกต้อง อนิจจา การกระทำ เช่นนั้นกลับก่อปัญหามากขึ้น: ด้วยองค์ประกอบของอุบายที่เพิ่มเข้ามานี้ ผู้คนใน [employer.GetPrimaryTitle.GetBaseNameNoTier] เองก็เริ่มเข้าข้างฝ่ายต่างๆ ในข้อพิพาท ซึ่งเดิมทีเป็นเรื่องในวงแคบ\n\nบางทีครึ่งหนึ่งเชื่อว่าข้อโต้แย้งของข้าน่าเชื่อถือ บ่งชี้ว่า #EMP ใครบางคน#! มีความผิดฐานเล่นไม่ซื่ออย่างร้ายแรง ส่วนอีกครึ่งหนึ่งเห็นว่าประเด็นของข้าเป็นเรื่องเหลวไหลสิ้นดี เมื่อถึงค่ำคืน ทั้งเมืองก็ลุกขึ้นต่อต้านกันเอง"
 laamp_base_contract_schemes.2683.desc.officer: "ข้าหวังว่าลิ้นเงินลิ้นทองของ [officer.GetTitledFirstNamePossessive] จะเพียงพอที่จะกล่อมให้ชาวบ้านมีอารมณ์เย็นลง ซึ่งเหตุผลอาจจะมีชัยได้ง่ายขึ้นบ้าง\n\nแต่ ทว่า ผู้คนใน [employer.GetPrimaryTitle.GetBaseNameNoTier] กลับแตกแยกกันจากการพยายามคลี่คลายสถานการณ์ของ [officer.GetHerHis] แม้ แต่คหบดีผู้มั่งคั่งในเมืองเองก็ยังเข้าข้างฝ่ายต่างๆ ในการทะเลาะวิวาทของเมืองบริวาร"
 laamp_base_contract_schemes.2683.desc.outro: "\n\nแผนที่ถูกลืมไปอย่างแน่นอน แต่ผู้คนกลับโต้เถียงกัน #EMP มากขึ้น#! แทนที่จะน้อยลง\n\n[employer.GetTitledFirstName] แจ้งแก่เราอย่างเย็นชาว่าค่าจ้างของเราจะไม่ได้รับ"
 laamp_base_contract_schemes.2683.a: "$laamp_base_contract_schemes.2663.a$"

 laamp_base_contract_schemes.2781.t: "$laamp_base_contract_schemes.2044.t$: [ROOT.Char.GetCurrentLocation.GetTitle.GetBaseNameNoTierNoTooltip]"
 laamp_base_contract_schemes.2781.desc.surroundings.alley_day: "ใช้เวลาเดินเตร็ดเตร่ไปตามถนนหนทางในนิคม — แน่นอนว่าต้องทำท่าทางยุ่งวุ่นวายและหงุดหงิดอย่างคนสำคัญไปด้วย — เป็นเวลาสักพักกว่าเราจะพบกับ [local_char.GetWomanMan] ท้องถิ่นผู้โชคร้ายที่ได้รับเลือกให้จัดการเรื่องเครื่องบรรณาการ"
 laamp_base_contract_schemes.2781.desc.surroundings.alley_night: "เป็นเวลาดึกแล้วกว่าเราจะมาถึงนิคม แต่ข้าไม่อยากอยู่ที่นี่นานเกินความจำเป็น เราพบ [local_char.GetWomanMan] ท้องถิ่นผู้อาภัพที่ได้รับเลือกให้จัดการเรื่องเครื่องบรรณาการ ขณะที่ [local_char.GetSheHe] กำลังจะปิดร้านในคืนนั้นพอดี"
 laamp_base_contract_schemes.2781.desc.surroundings.tavern: "บางทีก็ไม่น่าแปลกใจนัก เราพบ [local_char.GetWomanMan] ท้องถิ่นผู้โชคร้ายที่ได้รับเลือกให้จัดการเรื่องเครื่องบรรณาการในโรงเตี๊ยม กำลังดื่มดับความเศร้าของ [local_char.GetHerHis] ล่วงหน้าก่อนการมาถึงของเรา"
 laamp_base_contract_schemes.2781.desc.surroundings.docks: "ทำท่าทางวางมาดเป็นทางการที่สุดเท่าที่จะทำได้ เราเดินไปยังท่าเรือ ตามคาด เราสามารถพบ [local_char.GetWomanMan] ท้องถิ่นผู้โชคร้ายที่ได้รับเลือกให้จัดการเรื่องเครื่องบรรณาการได้ที่นั่น กำลังตะคอกใส่กะลาสีและสั่งการเรื่องสินค้าในวันนั้น"
 laamp_base_contract_schemes.2781.desc.surroundings.condemned_village: "ด้วยโรคระบาดที่ทำลายล้างพื้นที่ นิคมอยู่ในสภาพย่ำแย่อย่างน้อยที่สุด ใช้ผ้าปิดปากของเราไว้เพื่อกันไอพิษ ในที่สุดเราก็พบดวงวิญญาณผู้น่าสงสารที่ได้รับเลือกให้จัดการเรื่องเครื่องบรรณาการจนได้"
 laamp_base_contract_schemes.2781.desc.local_mood.disapproval: ""หึ," [local_char.GetSheHe] คำราม, "คงคิดว่าตัวเองฉลาดนักสินะ ที่มาก่อนเวลา เช่นนี้ เอาเถอะ พวกเราไม่ประทับใจหรอก และเราจะไม่จ่ายค่าธรรมเนียมใดๆ ที่ ทำให้ท่านล่าช้า""
 laamp_base_contract_schemes.2781.desc.local_mood.anger: ""ช่างไร้ยางอายนัก!" [local_char.GetSheHe] ตะคอก, "มาก่อนเวลาเยี่ยงนี้! เราจ่ายส่วยของเรา เหมือนเมืองอื่นๆ แต่เรามีสิทธิ์ที่จะได้รับการแจ้งล่วงหน้าตามสมควร ก่อนที่ท่านจะมาสูบเลือดสูบเนื้อจากหยาดเหงื่อของเรา""
 laamp_base_contract_schemes.2781.desc.local_mood.admiration: ""อ้า! ท่านคงเป็น [ROOT.Char.GetWomanMan] ของ [task_contract.GetEmployer.GetTitleAsNamePossessiveNoTooltip]", [local_char.GetSheHe] กล่าวอย่างอ่อนแรง, "ข้าดูออกด้วยท่าทีอันซื่อตรงของท่าน! ท่านมาถึง #EMP เร็ว#! กว่าที่เราคาดไว้เล็กน้อย แต่ไม่เป็นไร เราเตรียมพร้อมแล้ว""
 laamp_base_contract_schemes.2781.desc.local_mood.dismissal: ""โอ้ ท่านมาถึงเร็วนักหรือ?" [local_char.GetSheHe] พูดเนิบนาบ, "เอาเถิด ตามข้ามา เราได้เตรียม... #EMP เครื่องบรรณาการ#! ของท่านไว้แล้ว ตามคำสั่ง แต่ไม่ให้เกินแม้ แต่เพนนีเดียว""
 laamp_base_contract_schemes.2781.desc.local_mood.thinking: ""ท่านคือ... [ROOT.Char.GetWomanMan] ของ [task_contract.GetEmployer.GetTitleAsNamePossessiveNoTooltip] รึ? เร็วนัก?" [local_char.GetSheHe] สอบถาม, "ข้าไม่คิดว่าเราคาดว่าท่านจะมาถึงในอีกอย่างน้อยหนึ่งเดือน... ถึงกระนั้น ข้าคาดว่าท่านดูน่าเชื่อถือ...""
 laamp_base_contract_schemes.2781.desc.outro: "\n\nคนเขลาผู้หลงเชื่อง่ายอีกหนึ่งคน กั้นระหว่างเรากับวันรับค่าจ้าง"
 laamp_base_contract_schemes.2781.a: "หลอกล่อ [local_char.GetHerHim] ด้วยตัวเลข"
 laamp_base_contract_schemes.2781.stewardship.tt.success: "แน่นอน แน่นอน ทุกอย่างเรียบร้อยดี"
 laamp_base_contract_schemes.2781.stewardship.tt.failure: "ท่านพูดเรื่องบ้าอะไรกัน?"
 laamp_base_contract_schemes.2781.b: "ข้าขอมอบตราประทับของ '[task_contract.GetEmployer.GetTitledFirstNamePossessiveNoTooltip]'"
 laamp_base_contract_schemes.2781.intrigue.tt.success: "ดูเหมือนของแท้อยู่พอควร"
 laamp_base_contract_schemes.2781.intrigue.tt.failure: "นี่มันของปลอมชัดๆ!"
 laamp_base_contract_schemes.2781.c.bard_exists: "[bard.GetTitledFirstNameNoTooltip] ใช้ลิ้นเงินลิ้นทองของเจ้า!"
 laamp_base_contract_schemes.2781.c.bard_dnae_exist: "หากเพียง แต่เรามีคนเจ้าเล่ห์ลิ้นทอง..."
 laamp_base_contract_schemes.2781.d: "ผ่านการเผชิญหน้านี้ไปให้เร็วที่สุด"
 laamp_base_contract_schemes.2781.tt.boost_difficulty.stewardship: "ความท้าทายด้าน [stewardship|E] ครั้งต่อไปของท่านจะยากยิ่งขึ้นไปอีก"
 laamp_base_contract_schemes.2781.tt.boost_difficulty.intrigue: "ความท้าทายด้าน [intrigue|E] ครั้งต่อไปของท่านจะยากยิ่งขึ้นไปอีก"
 laamp_base_contract_schemes.2781.tt.boost_difficulty.bard: "ความท้าทายด้านความถนัดครั้งต่อไปของ [bard.GetFirstNamePossessive] จะยากยิ่งขึ้นไปอีก"
 laamp_base_contract_schemes.2781.tt.boost_difficulty.stress: "ตัวเลือกนี้จะใช้ [stress|E] มากยิ่งขึ้นในครั้งต่อไป"
 laamp_base_contract_schemes.2781.tt.progress_towards_success: "#P +1#! คะแนนสู่ความสำเร็จในการทำ [task_contract|E] ให้ลุล่วง"
 laamp_base_contract_schemes.2781.tt.current_total.sub_t1: "#TUT ท่านมีคะแนน [task_contract.MakeScope.Var('wins_tally').GetValue] จาก [task_contract.MakeScope.Var('win_t1_threshold').GetValue] เพื่อไปสู่ $label_success_qualified$#!"
 laamp_base_contract_schemes.2781.tt.current_total.sub_t2: "#TUT ท่านมีคะแนน [task_contract.MakeScope.Var('wins_tally').GetValue] จาก [task_contract.MakeScope.Var('win_t2_threshold').GetValue] เพื่อไปสู่ $label_success_standard$ #WEAK (ขณะนี้ท่านได้รับ $label_success_qualified$ แล้ว)#!#!"
 laamp_base_contract_schemes.2781.tt.current_total.sub_t3: "#TUT ท่านมีคะแนน [task_contract.MakeScope.Var('wins_tally').GetValue] จาก [task_contract.MakeScope.Var('win_t3_threshold').GetValue] เพื่อไปสู่ $label_success_critical$ #WEAK (ขณะนี้ท่านได้รับ ความสำเร็จ แล้ว)#!#!"
 laamp_base_contract_schemes.2781.tt.progress_towards_failure: "#N +1#! คะแนนสู่ความล้มเหลวใน [task_contract|E]"
 laamp_base_contract_schemes.2781.tt.contract_failed: "#N สัญญาล้มเหลว#!"

 laamp_base_contract_schemes.2782.t: "$laamp_base_contract_schemes.2044.t$: สำเร็จ!"
 laamp_base_contract_schemes.2782.desc.success_critical: "ฮ่า! ช่างเป็นการผจญภัยอันยิ่งใหญ่เสียนี่กระไร — [task_contract.GetEmployer.GetTitleAsNameNoTooltip] ผู้โลภเขลา [ROOT.Char.GetWomanMan] ผู้องอาจสง่างามพร้อมสายตาเฉียบคมมองเห็นโอกาส และผู้เสียภาษีที่หลงเชื่อง่ายหลายสิบคนที่คงหวังว่าตนน่าจะเรียนหนังสือมาดีกว่านี้สักหน่อย\n\nเมื่อหีบสมบัติของค่ายเต็มล้น เราครุ่นคิดถึงงานต่อไปของเรา"
 laamp_base_contract_schemes.2782.desc.success_standard: "บัดนี้ เราทำได้ #EMP ดีมาก#! ทีเดียวจากการบุกเข้าไปในโลกแห่งการบริหารจัดการเล็กๆ น้อยๆ ของเรา\n\nเหรียญตราของ [task_contract.GetEmployer.GetTitledFirstNamePossessive] มากพออยู่ในเกวียนเก็บภาษีปลอมๆ ของเรา ( ซึ่งประดับด้วยตราอาร์มที่วาดอย่างหยาบๆ ทั้งสองข้าง) เพื่อสนองความกระหายทองคำของ [ROOT.Char.GetWomenMen] ส่วนใหญ่\n\nถึงกระนั้น... ข้าก็อดสงสัยมิได้ว่าจะมีเลือดอีกสักเล็กน้อยที่เราจะรีดเค้นออกมาจากหินก้อนนี้ได้หรือไม่..."
 laamp_base_contract_schemes.2782.desc.success_qualified: "เราได้ของมาพอสมควร แต่ยังมีเหรียญตราอีกมากที่ยังรีดไถได้จากเหล่าข้าแผ่นดินผู้เขลาของ [task_contract.GetEmployer.GetTitledFirstNamePossessive]\n\nหากเราออกเดินทางตอนนี้ เราน่าจะนำหน้าคนเก็บค่าผ่านทางที่เดินต้วมเตี้ยมตามหลังเรามาได้ไกล — แต่ ทว่า หากเราถูกจับได้ เราจะถูกบังคับให้หนีเอาตัวรอดและสูญเสียทุกสิ่งไป"
 laamp_base_contract_schemes.2782.desc.nothing_yet: "เอาล่ะ เราเริ่มต้นได้ดี แต่นี่เป็นเพียงเงินเล็กน้อยเมื่อเทียบกับสิ่งที่เราหวังจะได้รับ\n\nหากเราปรารถนาจะเอาส่วนแบ่งที่ไม่เป็นธรรมของเราอย่างแท้จริงจากทรัพย์สมบัติของ [task_contract.GetEmployer.GetTitledFirstNamePossessive] เราต้องมุ่งหน้าต่อไปและโน้มน้าวข้าแผ่นดินของ [task_contract.GetEmployer.GetHerHis] ให้เชื่อใน... หนังสือรับรอง ของเราให้มากขึ้น"
 laamp_base_contract_schemes.2782.a: "ใครว่า [ROOT.Char.Custom('GetLaampDescribeTypeSelfArticle')] [ROOT.Char.Custom('GetLaampDescribeTypeSelf')] ต้องมีที่ดินเพื่อหาเงินตราเล่า!"
 laamp_base_contract_schemes.2782.b: "ไม่กล้า ก็ไม่มีเกียรติ ไม่มีทอง! ไปต่อ!"
 laamp_base_contract_schemes.2782.b.tt.travel_onwards: "ท่านพยายามต่อไป เพื่อให้ได้ผลลัพธ์ที่ดีขึ้นสำหรับ [task_contract|E] ของท่าน"
 laamp_base_contract_schemes.2782.c: "เรามาเล่นอย่างปลอดภัยและพอแค่นี้เถิด"
 laamp_base_contract_schemes.2782.d: "เอาล่ะ นี่คือสิ่งที่ดีที่สุดที่เราทำได้ในตอนนี้"
 laamp_base_contract_schemes.2782.d.tt: "@alert_icon! #alert_trial ตัวเลือกนี้ถูกบังคับเนื่องจากท่านได้บรรลุผลลัพธ์ที่ดีที่สุดเท่าที่จะทำได้สำหรับจำนวนความล้มเหลวที่ท่านสะสมมา#!"

 laamp_base_contract_schemes.2783.t: "$laamp_base_contract_schemes.2044.t$: ล้มเหลว!"
 laamp_base_contract_schemes.2783.desc.lost: "ให้ตายสิ ประชากรทั้งหมดของ [ROOT.Char.GetCurrentLocation.GetTitle.GetBaseNameNoTier]! ความหวาดระแวงอันไร้เหตุผลและความไร้เมตตาต่อคนแปลกหน้าของพวกเขาได้ทำลายทุกสิ่งลง\n\nข้าเพียงต้องการเงินตราเพิ่มอีก #EMP เล็กน้อย#! แต่คนเขลาเหล่านั้นกลับสงสัย จากนั้นก็ตื่นตระหนก แล้วจึงยึดเกวียนของเราท่ามกลางฝูงชาวเมืองที่โกรธแค้น\n\nข้าเหลือ แต่ตัวเปล่า ไม่มีอะไรเลย"
 laamp_base_contract_schemes.2783.desc.losing: "นั่นมันเกือบไปแล้ว — บางทีอาจจะเกือบเกินไป\n\nข้าไม่รู้เลยว่าผู้คนใน [ROOT.Char.GetCurrentLocation.GetTitle.GetBaseNameNoTier] ช่างไม่ไว้วางใจผู้อื่นถึงเพียงนี้ ข้าไม่แน่ใจด้วยซ้ำว่าคำพูดใดกระตุ้นความสงสัยของพวกเขา แต่พวกเขาเริ่มตั้งคำถาม และไม่นานข้าก็หมดคำตอบ\n\nถึงกระนั้น อย่างน้อยเราก็สามารถหลีกเลี่ยงการจับกุมได้พร้อมกับของที่ปล้นมาได้ในปัจจุบัน แม้ว่าเราจะไม่ได้อะไรเพิ่มจากพวกเขาก็ตาม"
 laamp_base_contract_schemes.2783.a: "แต่แผนของข้าสมบูรณ์แบบแล้ว!"
 laamp_base_contract_schemes.2783.b: "มันเป็นเพียงความพ่ายแพ้เล็กน้อยเท่านั้น ไปต่อ!"
 laamp_base_contract_schemes.2783.b.tt.travel_onwards: "$laamp_base_contract_schemes.2782.b.tt.travel_onwards$"
 laamp_base_contract_schemes.2783.c: "มีเงินแล้วรอด ดีกว่ามีทองแล้วตาย"
 laamp_base_contract_schemes.2783.d: "เอาเป็นว่า... พอแค่นี้เถอะ..."
 laamp_base_contract_schemes.2783.d.tt: "$laamp_base_contract_schemes.2782.d.tt$"

 laamp_base_contract_schemes.3301.t: "$laamp_base_contract_schemes.3004.t$: [current_barony.GetNameNoTierNoTooltip]"
 laamp_base_contract_schemes.3301.desc.scandal_affair: "บางทีเราอาจไม่สามารถเข้าสู่ราชสำนักของ [current_char.GetTitledFirstNamePossessive] ได้โดยไม่เป็นที่สังเกต แต่ดูเหมือนว่าเราแทบไม่จำเป็นต้องทำ เช่นนั้น: ชาวบ้านกำลังพากันซุบซิบเรื่องชู้สาว\n\nไม่ใช่คนใหญ่คนโต #EMP นัก#! แต่เรื่องชู้สาวที่ไม่คาดคิดก็ช่วยเพิ่มรสชาติให้กับชีวิตประจำวันที่น่าเบื่อหน่ายใน [current_barony.GetNameNoTier]\n\nโชคดีสำหรับเรา ด้วยมีคนช่างพูดมากมาย จึงน่าจะง่ายพอควรที่จะล้วงข้อมูลจากคนรับใช้และข้าราชสำนักชั้นผู้น้อยเพื่อหาเศษเสี้ยวของข่าวลือที่เป็นประโยชน์"
 laamp_base_contract_schemes.3301.desc.scandal_torture: "แม้จะไม่ได้เข้าถึงราชสำนักของ [current_char.GetTitledFirstNamePossessive] โดยตรง ความโกลาหลภายในก็เป็นที่กล่าวขานไปทั่ว [current_barony.GetNameNoTier]\n\nดูเหมือนว่าคหบดีท้องถิ่นผู้หนึ่ง ที่ต้องการทวงหนี้หรือแก้แค้นการดูหมิ่นบางอย่าง ได้ทำการทรมานคู่แข่งของตนเกินควร และทิ้งไว้เพียงร่างที่แหลกสลายราวกับเปลือกไม้\n\n[current_char.GetTitleAsNameNoTooltip] ถูกเรียกให้เข้ามาแทรกแซงและลงโทษ แต่ดูเหมือนจะลังเลด้วยเหตุผลบางประการ\n\nโชคร้ายสำหรับเหยื่อ แต่เป็นบรรยากาศที่ #EMP เหมาะเจาะยิ่ง#! สำหรับการถามคำถามลามกโดยไม่เป็นที่สงสัย"
 laamp_base_contract_schemes.3301.desc.scandal_manslaughter: "มีเลือดนองท้องถนนใน [current_barony.GetNameNoTier] และ แม้ว่า [current_char.GetTitledFirstName] จะไม่ได้ชักดาบออกมาเอง แต่คำพูดของ [current_char.GetHerHis] ก็เป็นตัวจุดชนวน\n\nกฎหมายท้องถิ่นฉบับหนึ่ง ที่บังคับใช้ตามข้อกำหนดที่ชัดเจนของ [current_char.GetTitleAsNameNoTooltip] ได้พิสูจน์แล้วว่าไม่เป็นที่นิยมอย่างน่าสะพรึงกลัว เจ้าพนักงานผู้ต่ำต้อยคนหนึ่งที่พยายามบังคับใช้กฎหมายนั้น ซึ่งปกติเป็นที่ชื่นชอบพอสมควรด้วยความเป็นธรรมและความสุขุม ถูกสังหารเมื่อไม่ถึงสองวันก่อนในอาชญากรรมอันน่าเศร้าที่เกิดจากอารมณ์ชั่ววูบ\n\nด้วยคำพูดเผ็ดร้อนและการกล่าวโทษที่แพร่สะพัด ความลับน่าจะล้วงออกมาจากชาวบ้านได้ไม่ยากนัก"
 laamp_base_contract_schemes.3301.desc.scandal_loan: "เสียงพึมพำต่ำๆ และเสียงคร่ำครวญดูเหมือนจะดังไปทั่ว [current_barony.GetNameNoTier] เสียงพูดคุยอย่างรำคาญใจของผู้ที่ได้รับผลกระทบจากเรื่องอื้อฉาวเล็กน้อย\n\nดูเหมือนว่าเจ้าหนี้ท้องถิ่นกำลังเรียกเก็บหนี้ต่างๆ ทั่วเมือง ทำให้ชาวบ้านไม่พอใจยิ่งกว่าภาษีที่ไม่คาดคิด ที่แย่กว่านั้นคือ การกระทำนี้ได้รับความเห็นชอบอย่างเงียบๆ จาก [current_char.GetTitledFirstName] — ซึ่งสำหรับหลายคน ถือเป็นการทรยศที่ไม่อาจให้อภัยได้\n\nไม่ใช่บรรยากาศที่ดีที่สุดที่จะไปถามคำถามเจาะจง แต่ก็ไม่ใช่บรรยากาศที่แย่ที่สุดสำหรับการหาคนรับใช้ที่ขมขื่นและปากสว่าง"
 laamp_base_contract_schemes.3301.desc.scandal_bribery: "เรื่องทั้งหมดที่พูดคุยกันใน [current_barony.GetNameNoTier] คือเรื่องเจ้าหน้าที่บางคนในสังกัดของ [current_char.GetTitledFirstNamePossessive] ถูกจับได้ว่ารับสินบนที่ขัดแย้งกันในจำนวนมหาศาล #EMP อย่างแท้จริง#! \n\nการทุจริตเล็กๆ น้อยๆ ที่นั่นที่นี่ไม่ใช่เรื่องผิดปกติ สำหรับข้าราชการพลเรือนหลายคน มันเป็นส่วนหนึ่งของเงินเดือนที่คาดหวังได้ แต่สิ่งเหล่านี้ก็มีขีดจำกัด\n\nที่นี่ ขีดจำกัดเหล่านั้นถูกยืดออกไปจนเกินจุดแตกหัก\n\nข่าวร้ายสำหรับ [current_char.GetTitleAsNameNoTooltip] ข่าวดีเยี่ยมสำหรับผู้ที่สนใจชาวบ้านที่ไม่พอใจและมีเรื่องราวจะเล่า"
 laamp_base_contract_schemes.3301.desc.rumblings_war: "ท้องถนนใน [current_barony.GetNameNoTier] คึกคักไปด้วยเสียงกระซิบเรื่องสงครามและเลือด โดยชาวบ้านจำนวนมาก #EMP เชื่อมั่น#! อย่างยิ่งว่า [current_char.GetTitledFirstName] วางแผนที่จะก่อสงคราม — ในไม่ช้า\n\nแน่นอนว่าสงครามไม่ใช่เรื่องที่เกิดขึ้นได้ยาก ซึ่ง ทำให้พวกช่างนินทาและพวกปล่อยข่าวลือปลุกปั่นความกลัวได้ง่ายขึ้นเมื่อมีเรื่องอื่นไม่มากนักที่จะเติมเต็มยามเย็นอันยาวนาน\n\nจริงหรือไม่ก็ตาม มัน ทำให้มีผู้คนช่างพูดคุยมากมาย ซึ่ง #EMP กระตือรือร้น#! อย่างยิ่งที่จะแบ่งปันความคิดเห็นของตนและสิ่งที่พวกเขาได้ยินมากับคนแปลกหน้าที่มีความคิดริเริ่ม"
 laamp_base_contract_schemes.3301.desc.rumblings_murder: "แม้ว่าจะไม่มีใครสามารถพูดได้อย่างแน่นอน คำที่ติดปากทุกคนที่นี่ใน [current_barony.GetNameNoTier] คือ #EMP ฆาตกรรม#! \n\nบางคนบอกว่าเป็น [current_char.GetTitledFirstName] [current_char.GetHerselfHimself] ความอดทนที่หมดไป ทำให้ [current_char.GetHerHim] กระหายจุดจบก่อนวัยอันควรของคนโง่ที่น่าสงสารบางคน คนอื่น ๆ บอกว่าแผนการที่ลือกันนั้น แท้จริงแล้ว #EMP ต่อต้าน#! [current_char.GetTitleAsNameNoTooltip] หรือเป็นเพียงการประลองทางการเมืองของข้าราชสำนักที่โหดเหี้ยมกว่าบางคนของ [current_char.GetHerHis] ต่อกัน\n\nไม่ว่าความจริงจะเป็นอย่างไร ทุกคนต่างก็เป็นนักนินทาตัวยงในตอนนี้\n\nสะดวกดีแท้"
 laamp_base_contract_schemes.3301.desc.rumblings_affair: "ข่าวลือแพร่กระจายในหมู่สามัญชนเร็วยิ่งกว่าไฟลามทุ่งในเมืองเก่า และไม่มีข่าวลือใดแพร่กระจายเร็วกว่าข่าวลือที่ว่า [current_char.GetLadyLord|U] แห่ง [current_barony.GetNameNoTier] สงสัยเรื่องการคบชู้\n\nแน่นอนว่าไม่มีใครกล้าพูดเรื่องที่โจ่งแจ้ง เช่นนี้อย่างเปิดเผยทั้งหมด — แต่หลังประตูปิด หลังจากดื่มไวน์ไปหนึ่งหรือสองถ้วย และเมื่อมีบุคคลลึกลับปรากฏตัวในราชสำนัก...\n\nผู้คนระมัดระวังตัว แต่ความกระหายเรื่องอื้อฉาวของพวกเขาก็ยัง ทำให้พวกเขาอ่อนแอต่อการซักถามเชิงกลยุทธ์เล็กน้อย"
 laamp_base_contract_schemes.3301.desc.mundane_feast: "ความตื่นเต้นทั้งหมดใน [current_barony.GetNameNoTier] ในปัจจุบัน มุ่งไปที่งานเลี้ยงเล็กๆ ที่กำลังจะมาถึง ซึ่ง [current_char.GetTitledFirstName] ตั้งใจจะจัดขึ้น\n\nน่าเศร้าที่ดูเหมือนว่างานนี้จะยิ่งใหญ่ #EMP พอดี#! จนสามารถดึงดูดจินตนาการของนักปล่อยข่าวลือราคาถูกทุกคน พวกช่างนินทา และเด็กข้างถนนที่ชอบแอบฟังทั่วเมือง\n\nการพูดคุยทั้งหมดมุ่งเน้นไปที่ว่าใครน่าจะได้รับเชิญและใครไม่ อาหารอะไรจะถูกเสิร์ฟ ความบันเทิงอะไรที่ [current_char.GetTitleAsNameNoTooltip] จะจัดแสดง... ไม่ใช่สภาพแวดล้อมที่ดีที่สุดสำหรับการสืบหาข้อมูลเชิง #EMP กลยุทธ์#! ที่มากขึ้นนัก"
 laamp_base_contract_schemes.3301.desc.mundane_nothing: "น่าเศร้าที่ปัจจุบันมีเรื่องราวสำคัญพูดคุยกันน้อยมากใน [current_barony.GetNameNoTier]\n\nโอ้ มีเรื่องดราม่าหยุมหยิมตามปกติในหมู่สามัญชน แต่ไม่มีอะไรที่ลามกหรือน่าสนใจเป็นพิเศษ — ซึ่งเป็นปัญหา เพราะมัน ทำให้คนแปลกหน้าที่ปรากฏตัวและถามคำถามกลายเป็นเรื่องผิดปกติ\n\nถึงกระนั้น เราต้องรวบรวมข้อมูลเท่าที่เราจะหาได้จากเมืองที่น่าเบื่อหน่ายแห่งนี้"
 laamp_base_contract_schemes.3301.tt.plus_one_success: "#P +1#! ข่าวกรองที่รวบรวมได้"
 laamp_base_contract_schemes.3301.a: "ข้าจะลองเงี่ยหูฟังดู..."
 laamp_base_contract_schemes.3301.a.tt.success: "ข้อมูลเล็กน้อยที่เป็นประโยชน์หลายอย่าง"
 laamp_base_contract_schemes.3301.a.tt.failure: "[intrigue_duellist.GetFirstNameNoTooltip] ขัดขวางท่าน"
 laamp_base_contract_schemes.3301.b: "ถึงเวลาใช้เสน่ห์ของข้าแล้ว!"
 laamp_base_contract_schemes.3301.b.tt.success: "คำพูดที่พวกเขาไม่ควรแบ่งปัน"
 laamp_base_contract_schemes.3301.b.tt.failure: "[diplomacy_duellist.GetFirstNameNoTooltip] ทำให้ราชสำนักเงียบกริบ"
 laamp_base_contract_schemes.3301.c: "สอบปากคำใครก็ได้ที่เราทำได้ แล้วไปกันเถอะ"
 laamp_base_contract_schemes.3301.d: "อย่าไปยุ่งกับ [current_char.GetFirstNameNoTooltip] เลย"
 laamp_base_contract_schemes.3301.d.tt.skip_the_attempt: "ท่าน #N ไม่ได้#! รวบรวมข่าวกรองใดๆ ที่นี่"

 laamp_base_contract_schemes.3302.t: "$laamp_base_contract_schemes.3004.t$: สำเร็จ!"
 laamp_base_contract_schemes.3302.desc.intro: "สายลับของ [employer.GetTitledFirstNamePossessive] พบกับเราใน [current_barony.GetNameNoTier] กระตือรือร้นที่จะนำรายงานของเราไปให้ [employer.GetLadyLord] ของพวกเขา\n\n"
 laamp_base_contract_schemes.3302.desc.win.critical: "และเราก็มีรายงานที่ #EMP ยอดเยี่ยม#! เตรียมพร้อม รายการโดยละเอียดของทุกข้อตกลง ข่าวลือ และความลับที่รั่วไหลจาก [destination_1.GetNameNoTier] ไปจนถึง [destination_2.GetNameNoTier] — มากเกินพอที่จะ ทำให้นายกองสืบของ [employer.GetFirstNamePossessiveNoTooltip] ยุ่งอยู่กับเบาะแสและอุบายต่างๆ ไปอีกหลายเดือน\n\nด้วยความขอบคุณในการลงแรงของเรา,"
 laamp_base_contract_schemes.3302.desc.win.standard: "โชคดีที่เราได้รวบรวมข้อมูลเชิงลึกเพียงพอที่จะดึงดูดใจพวกเขา อาจจะไม่ใช่ทุกสิ่งที่เราจะทำได้ แต่ก็เพียงพอที่จะสร้างงานมากมายให้กับนายกองสืบของ [employer.GetFirstNamePossessiveNoTooltip] และ ทำให้ผู้ติดต่อของเราพึมพำอย่างพึงพอใจ\n\nด้วยความขอบคุณในการลงแรงของเรา,"
 laamp_base_contract_schemes.3302.desc.win.qualified: "มัน... ไม่มากนัก ด้วยข่าวลือและคำบอกเล่าที่เรารวบรวมมานั้นเบาบางนัก จึงมีข้อมูลค่อนข้างน้อยที่นายกองสืบของ [employer.GetFirstNamePossessiveNoTooltip] จะนำไปใช้ได้ น้อย แต่ก็ไม่ถึงกับ #EMP ไม่มีอะไรเลย.#!\n\nหลังจากการสนทนาสั้นๆ พลางบ่นพึมพำ,"
 laamp_base_contract_schemes.3302.desc.outro: "สายลับของ [employer.GetTitleAsNamePossessiveNoTooltip] ก็นำค่าจ้างตามที่ตกลงกันมามอบให้\n\nอย่างลับๆ แน่นอน"
 laamp_base_contract_schemes.3302.a: "ช่างเป็นรางวัลมากมายสำหรับเสียงกระซิบเพียงไม่กี่คำ!"
 
 laamp_base_contract_schemes.3303.t: "$laamp_base_contract_schemes.3004.t$: ล้มเหลว!"
 laamp_base_contract_schemes.3303.desc: "สายลับของ [employer.GetTitledFirstNamePossessive] พบกับเราใน [current_barony.GetNameNoTier] แต่เพียงครู่เดียว — ทันทีที่ข้อแก้ตัวของเราเกี่ยวกับการขาดข้อมูลที่น่าเชื่อถือโดยสิ้นเชิงเริ่มหลั่งไหลออกมา สายลับก็ตระหนักว่าเราล้มเหลว\n\nเราถูกบอกอย่างรวดเร็วว่าอย่าเสียเวลาของ [employer.GetTitleAsNamePossessiveNoTooltip] กับการเล่นตลกของเรา และอย่าขอความช่วยเหลือจาก [employer.GetHerHis] ในอนาคต ก่อนที่พวกเขาจะหายตัวไปอย่างรวดเร็ว\n\nบางทีการจารกรรมอาจไม่ใช่เกมที่เหมาะสำหรับ [ROOT.Char.Custom('GetLaampDescribeTypeSelfPlural')] เช่นเรา..."
 laamp_base_contract_schemes.3303.a: "[employer.GetSheHe|U] ผู้ค้าข่าวลือย่อมมีสินค้าที่ด้อยคุณภาพ"
 
 laamp_base_contract_schemes.3661.t: "$laamp_base_contract_schemes.3031.t$: [destination_1.GetBaseNameNoTierNoTooltip]"
 laamp_base_contract_schemes.3661.desc.intro: "[destination_1.GetBaseNameNoTier] ดูเป็นสถานอันน่ารื่นรมย์ — น่าเสียดายที่ต้องมาเยือนด้วยเหตุอันไม่น่าอภิรมย์ เช่นนี้\n\nใกล้ค่ำแล้ว ข้ากับผู้ติดตามกลุ่มเล็กๆ ซุ่มรออยู่ในเงามืดไม่ไกลจากเป้าหมายของเรานัก:"
 laamp_base_contract_schemes.3661.desc.business.fallback: "โรงช่างเล็กๆ แต่รุ่งเรือง มีป้ายทาสีใหม่แขวนอยู่ด้านนอกเพื่อบ่งบอกถึงผู้อุปถัมภ์"
 laamp_base_contract_schemes.3661.desc.business.inn_exterior: "โรงเตี๊ยมริมทาง นอกเมืองออกไป เห็นได้ชัดว่าเป็นที่โปรดปรานของคนท้องถิ่น สำหรับตอนนี้"
 laamp_base_contract_schemes.3661.desc.business.relaxing_room: "บ้านในเมืองของผู้มี อันจะกิน บางทีอาจเป็นที่พำนักแห่งที่สองของขุนนางชายหรือหญิง"
 laamp_base_contract_schemes.3661.desc.business.winery: "โรงบ่มไวน์ที่มีของเต็มเปี่ยม อัดแน่นด้วยถังไวน์ชั้นเลิศเรียงราย ถังเหล่านั้น ไวน์รสหวาน คือสิ่งที่เรามาเพื่อทำลาย"
 laamp_base_contract_schemes.3661.desc.business.tavern: "โรงเหล้าอันพลุกพล่าน เนืองแน่นไปด้วยนักพนันหัวเราะร่า โรงเหล้าที่ต้องมอดไหม้"
 laamp_base_contract_schemes.3661.desc.business.docks: "โรงเก็บของไม้ขนาดใหญ่ข้างท่าเรือ เต็มไปด้วยเชื้อไฟอย่างแท้จริง"
 laamp_base_contract_schemes.3661.desc.business.kennels: "คอกสุนัขเหม็นคลุ้ง เต็มไปด้วยสุนัขล่าเนื้อเห่าหอน"
 laamp_base_contract_schemes.3661.desc.business.shrine: "[target.GetFaith.HouseOfWorship] ริมทางอันสมถะแด่ศรัทธา [target.GetFaith.GetAdjective] เห็นได้ชัดว่าเพิ่งสร้างขึ้นด้วยความรักเมื่อไม่นานมานี้"
 laamp_base_contract_schemes.3661.desc.business.mews: "โรงเลี้ยงเหยี่ยวอันรุ่งเรือง นกล่าเหยื่อจำนวนมากถูกเก็บไว้อย่างปลอดภัยสำหรับยามเย็นแล้ว"
 laamp_base_contract_schemes.3661.desc.business.bridge: "สะพานเก็บค่าผ่านทาง หอคอยหินทอดมองไปไกลรอบแม่น้ำที่ขนาบข้าง"
 laamp_base_contract_schemes.3661.desc.business.market: "จัตุรัสตลาดเล็กๆ ล้อมรอบด้วยหมู่บ้านเรือนที่แออัด"
 laamp_base_contract_schemes.3661.desc.outro: "\n\n[employer.GetTitledFirstName] ไม่เห็นควรที่จะอธิบายว่าเหยื่อของ[employer.GetHerHis] คือ [target.GetTitledFirstName] เป็นเจ้าของสถานที่ มีผลประโยชน์ที่นั่น หรือเพียงแค่ผูกพันกับมัน\n\nอีกไม่นาน เรื่องนี้ก็ไม่สำคัญอีกต่อไป"
 laamp_base_contract_schemes.3661.tt.duel_success: "ภารกิจสำเร็จ"
 laamp_base_contract_schemes.3661.tt.duel_failure: "สัญญาผิดพลาด"
 laamp_base_contract_schemes.3661.tt.stealth_maintained_no_gallowsbait: "#TUT วิธีนี้จะ #P รักษาความลับของท่าน#! ลด [GetTrait('gallowsbait').GetName( GetNullCharacter )]#!"
 laamp_base_contract_schemes.3661.tt.stealth_foregone_extra_gallowsbait: "#TUT วิธีนี้จะ #N เปิดเผยตัวตนของท่าน#! เพิ่ม [GetTrait('gallowsbait').GetName( GetNullCharacter )] ที่ได้รับ — แต่ #P โดยรวมแล้วง่ายกว่า#!#!"
 laamp_base_contract_schemes.3661.a: "เงียบไว้: เราจะไปทันทีที่ไฟติด"
 laamp_base_contract_schemes.3661.b: "จับคู่ตามปกติ ทุกคน คุมทางออกไว้ ตั้งสติให้มั่น"
 laamp_base_contract_schemes.3661.c: "สองคนด้านหลัง สี่คน แต่ละข้าง เคลื่อนพล"
 laamp_base_contract_schemes.3661.d: "เตรียมขวานให้พร้อม แล้วไป #EMP ลุยเลือด#! กัน!"
 laamp_base_contract_schemes.3661.e: "หวังว่าทุกคนพร้อมแล้ว #EMP โจมตี!#!"
 laamp_base_contract_schemes.3661.f: "[officer.GetFirstNameNoTooltip] มียาพิษหรือไม่?"
 laamp_base_contract_schemes.3661.g: "[officer.GetFirstNameNoTooltip] คิดว่าเจ้าจะเข้าไปโดยไม่ถูกพบเห็นได้หรือไม่?"
 laamp_base_contract_schemes.3661.h: "[officer.GetFirstNameNoTooltip] คิดว่าเจ้าจะยิงธนูไฟไปตรงนั้นได้หรือไม่?"
 laamp_base_contract_schemes.3661.i.steal_dogs: "[officer.GetFirstNameNoTooltip] นำสุนัขเหล่านั้นมาให้ข้า!"
 laamp_base_contract_schemes.3661.i.dog_on_birds: "[officer.GetFirstNameNoTooltip] ปล่อยสุนัขล่าเนื้อของเจ้าจัดการพวกมัน"
 laamp_base_contract_schemes.3661.i.poison_barrels: "[officer.GetFirstNameNoTooltip] เจ้ามีสิ่งใดที่จะ... #EMP ปนเปื้อน#! ถังเหล่านั้นหรือไม่?"
 laamp_base_contract_schemes.3661.j: "[officer.GetFirstNameNoTooltip] ที่ใดจะไหม้ไฟง่ายที่สุด?"
 laamp_base_contract_schemes.3661.k: "[officer.GetFirstNameNoTooltip] นำกลุ่มของเจ้าเข้าจากอีกด้าน"
 laamp_base_contract_schemes.3661.l: "[officer.GetFirstNameNoTooltip] เตรียมกองกำลังของเจ้าให้พร้อม"
 laamp_base_contract_schemes.3661.m: "[officer.GetFirstNameNoTooltip] เจ้าไปอีกทาง — เราจะปล้นสะดมทีหลัง"
 laamp_base_contract_schemes.3661.n: "[officer.GetFirstNameNoTooltip] คิดว่าเราจะวางยาพิษทั้งหมดได้หรือไม่?"
 laamp_base_contract_schemes.3661.o: "หากเพียงข้ามีขุนนางที่เหมาะสมสำหรับงานนี้..."
 laamp_base_contract_schemes.3661.o.lacking_officers.forager_kenneler_cook: "ท่านไม่มีทั้ง [GetCourtPositionType('chief_forager_camp_officer').GetName()], [GetCourtPositionType('kennelperson_camp_officer').GetName()], หรือ [GetCourtPositionType('camp_cook_camp_officer').GetName()]"
 laamp_base_contract_schemes.3661.o.lacking_officers.thief_huntsman_engineer: "ท่านไม่มีทั้ง [GetCourtPositionType('master_thief_camp_officer').GetName()], [GetCourtPositionType('huntperson_camp_officer').GetName()], หรือ [GetCourtPositionType('chief_engineer_camp_officer').GetName()]"
 laamp_base_contract_schemes.3661.o.lacking_officers.moa_mos_man_haggler: "ท่านไม่มีทั้ง [GetCourtPositionType('master_of_arms_camp_officer').GetName()], [GetCourtPositionType('master_of_spoils_camp_officer').GetName()], หรือ [GetCourtPositionType('person_haggler_camp_officer').GetName()]"
 laamp_base_contract_schemes.3661.p: "ข้า... ไม่คิดว่าข้าอยากทำสิ่งนี้..."
 laamp_base_3661_stole_dogs_modifier: "สุดยอดสายพันธุ์"
 laamp_base_3661_stole_dogs_modifier_desc: "ตัวละครนี้มีสุนัขล่าเนื้อชั้นดีมากมาย #EMP มากมาย#! เหลือเกินให้ใช้สอย"

 laamp_base_contract_schemes.3662.t: "$laamp_base_contract_schemes.3031.t$: สำเร็จ!"
 laamp_base_contract_schemes.3662.desc.intro: "แผนการที่ดีนำมา ซึ่งชัยชนะอันรวดเร็ว และ"
 laamp_base_contract_schemes.3662.desc.business.fallback: "ซากไหม้เกรียมของโรงช่างเล็กๆ ที่พังทลายลงเป็นเครื่องยืนยันถึงสิ่งนั้น"
 laamp_base_contract_schemes.3662.desc.business.inn_exterior: "ซากโรงเตี๊ยมที่ถูกเผาจนวอดวายเป็นพยานถึงข้อเท็จจริงนั้น"
 laamp_base_contract_schemes.3662.desc.business.relaxing_room: "ซากปรักหักพังที่คุกรุ่นของบ้านในเมืองเป็นเพียงเครื่องแสดงความจริงของภาษิตเก่านั้น"
 laamp_base_contract_schemes.3662.desc.business.winery: "โรงบ่มไวน์ที่ถูกทำลายเป็นหลักฐานอันเพียงพอสำหรับสิ่งนั้น"
 laamp_base_contract_schemes.3662.desc.business.tavern: "ซากไหม้เกรียมของโรงเหล้าเป็นข้อพิสูจน์ง่ายๆ ของสิ่งนั้น"
 laamp_base_contract_schemes.3662.desc.business.docks: "ด้านหน้าของโรงเก็บของที่ยังคงลุกไหม้ ค่อยๆ ถล่มลงไปในน้ำเบื้องหน้า เป็นเพียงเครื่องแสดงให้เห็น"
 laamp_base_contract_schemes.3662.desc.business.kennels: "ความเงียบสงัดโดยสมบูรณ์ของคอกสุนัขเดิมเป็นเพียงการยืนยันถึงสิ่งนั้น"
 laamp_base_contract_schemes.3662.desc.business.shrine: "[target.GetFaith.HouseOfWorship] ที่ถูกลบหลู่ ซึ่งเผาไหม้อย่างเชื่องช้าอยู่ริมถนนเป็นหลักฐานอันเพียงพอสำหรับสิ่งนั้น"
 laamp_base_contract_schemes.3662.desc.business.mews: "โรงเลี้ยงเหยี่ยวที่เงียบสงัดในบัดนี้เป็นพยานเงียบงันถึงสิ่งนั้น"
 laamp_base_contract_schemes.3662.desc.business.bridge: "หอคอยที่ลุกไหม้ของสะพานเก็บค่าผ่านทางพิสูจน์สิ่งนั้นอย่างไม่อาจปฏิเสธได้"
 laamp_base_contract_schemes.3662.desc.business.market: "การสังหารหมู่ที่เงียบงันในตลาดแสดงให้เห็นสิ่งนั้นอย่างไม่อาจโต้แย้งได้"
 laamp_base_contract_schemes.3662.desc.method.intrigue: "ด้วยความเร็วและความลับ — ไม่ต้องพูดถึงการขาดคู่ต่อสู้ที่มีสติ — ข้าและผู้ติดตามได้จุดไฟหลายจุดอย่างรวดเร็วและถอยกลับอย่างว่องไว เปลวเพลิงทำงานของมัน และเราเพียงต้องกลับมาในตอนเช้าเพื่อตรวจสอบผลลัพธ์\n\nจากที่เห็น,"
 laamp_base_contract_schemes.3662.desc.method.martial: "ต้องใจแข็งพอที่จะสังหารอย่างเลือดเย็น แต่คำสัญญาเรื่องเงิน ทำให้หลายสิ่งทนได้ หลังจากเราจัดการข้างในเรียบร้อย เรากองศพ จุดไฟ และหนีหายไปในยามค่ำคืน\n\nไม่มีพยานคนใดกล้าพอที่จะเข้ามาแทรกแซง และ"
 laamp_base_contract_schemes.3662.desc.method.prowess: "นำการต่อสู้ด้วยตนเอง ข้าและผู้ติดตามจัดการพวกโชคร้ายที่อยู่ข้างในอย่างรวดเร็ว ฟันพวกมันลงโดยไม่คิดหรือปรานี เราทิ้งศพไว้ที่นั่น โยนคบเพลิงไปยังจุดที่น่าจะติดไฟที่สุดและกองวัตถุไวไฟทับเปลวไฟที่เกิดขึ้น\n\nงานสกปรก แต่ได้ผล\n\n"
 laamp_base_contract_schemes.3662.desc.method.forager: "เมื่อเข้าไปข้างใน [officer.GetTitledFirstName] ใช้เวลาไม่นานในการทำงานอันสกปรกของ[officer.GetHerHis] — ยาพิษเล็กน้อยก็ส่งผลได้มาก และดูเหมือนว่า [officer.GetSheHe] จะนำมาไม่น้อยเลยทีเดียว ข้าควรจะกังวลเรื่องนั้น แต่ก็เป็นปัญหาสำหรับวันอื่น\n\nหาก [target.GetTitledFirstName] หวังว่าจะได้อะไรจากที่นี่ [target.GetSheHe] ก็จะต้องประหลาดใจอย่างโชคร้าย แม้ว่า"
 laamp_base_contract_schemes.3662.desc.method.thief: "ด้วยความว่องไวดุจแมว [officer.GetTitledFirstName] แทรกตัว[officer.GetHerHis]เข้าไปทางบานหน้าต่างคู่หนึ่งที่หลวมอยู่ชั้นบน ครู่หนึ่ง ทุกอย่างภายในเงียบสงัด — จนกระทั่งประตูเปิดออกให้พวกเรา และ[officer.GetFirstNameNoTooltip]ก็ปรากฏตัวออกมา ในมือกำมีดเปื้อนเลือดเล่มหนึ่ง ดูเหมือนว่า[officer.GetSheHe]ไม่ได้ประสบปัญหา #EMP มาก#!นักภายในอาคาร\n\nการวางเพลิงหลังจากนั้นเป็นเรื่องง่ายดาย หมายความว่า"
 laamp_base_contract_schemes.3662.desc.method.huntperson: "เป้าหมายของ [officer.GetTitledFirstNamePossessive] แม่นยำและลูกธนูของ[officer.GetHerHis] ปักแน่นเข้ากับคานไม้แห้งแตกสูงขึ้นไปบนขื่อไกลจากที่ใดๆ ที่จะดับได้ง่าย เราเฝ้ารออย่างเงียบๆ และเฝ้ามอง ปล่อยให้เปลวไฟค่อยๆ ลุกไหม้ จนกระทั่งกลิ่นควันเริ่มคละคลุ้งเข้าจมูกของเรา\n\nดีพอที่จะจากไป โดยมั่นใจว่า"
 laamp_base_contract_schemes.3662.desc.method.kenneler.poison_barrels: "[officer.GetTitledFirstName] ดูเหมือนจะไม่มีปัญหาในการ #EMP ทำให้เปรอะเปื้อน#! ถังไวน์ชั้นเลิศทีละถัง ในขณะที่พวกเราที่เหลือคอยเฝ้าระวังหรือขนย้ายสิ่งของตามคำสั่งของ[officer.GetHerHis] ในที่สุด งานก็... รื่นเริงอย่างแท้จริง โดยผู้ติดตามของข้าหลายคนช่วยตัวเองด้วยไวน์จากถังหนึ่งก่อนที่เราจะทำลายมัน ก็ไม่เสียหายอะไร\n\nแน่นอนว่า ตอนแรกเรื่องนี้อาจยังไม่ชัดเจนนัก — ดังนั้นเราจึงทิ้งถ้วยใหม่ไว้พร้อมกับสิ่งประหลาดใจเล็กน้อยลอยอยู่ข้างในและร่องรอยกลับไปยังแหล่งที่มาของมัน\n\n"
 laamp_base_contract_schemes.3662.desc.method.kenneler.steal_dogs: "[officer.GetTitledFirstName] เล็ดลอดเข้าไปในคอกสุนัข และทุกอย่างยังคง... เงียบสงัดไม่มากก็น้อย สิบนาทีต่อมา ขณะที่เราเริ่มหมดหวังและวางแผนจะเผาสถานที่ทิ้งอยู่แล้ว [officer.GetWomanMan] ก็ปรากฏตัวอีกครั้งพร้อมกับสุนัขล่าเนื้อ #EMP หลายสิบ#! ตัวที่ถูกจับไว้แน่นด้วยสายจูงหลายเส้น\n\nการที่ [officer.GetSheHe] สามารถเกลี้ยกล่อมให้สัตว์เหล่านี้เงียบเป็นส่วนใหญ่ หอบและครางราวกับว่านี่เป็นเกมที่ยิ่งใหญ่ เป็นเรื่องน่าอัศจรรย์ พวกเรา แต่ละคนคว้าสายจูงให้ได้มากที่สุดและหนีหายไปในยามค่ำคืน —"
 laamp_base_contract_schemes.3662.desc.method.kenneler.dog_on_birds: "วิธีการของ [officer.GetTitledFirstNamePossessive] นั้นเสียงดัง แต่ได้ผล [officer.GetSheHe] หายเข้าไปในโรงเลี้ยงเหยี่ยวพร้อมกับสุนัขล่าเนื้อหลายตัวที่คำรามและแยกเขี้ยว สักครู่ โลกก็เต็มไปด้วยเสียงเห่า กัด และฉีกกระชาก นกล่าเหยื่อตายเป็นฝูงอยู่ข้าง ในขณะที่โชคดีไม่กี่ตัวหนีออกไปทางประตูที่เปิดอยู่\n\nเมื่อ $kennelperson_camp_officer$ ของข้าปรากฏตัวออกมา เราก็เกือบจะพร้อมทิ้ง [officer.GetHerHim] ไว้เบื้องหลัง โดยมีชาวบ้านที่ตื่นตัวกำลังมุ่งหน้ามาหาเรา #EMP อย่างดี#! ธนูที่ยิงอย่างแม่นยำไม่กี่ดอกก็ขับไล่พวกเขาไป และเราก็หนีหายไปในความมืด\n\n"
 laamp_base_contract_schemes.3662.desc.method.engineer: "[officer.GetTitledFirstName] ชี้จุดอ่อนสำคัญหลายแห่งในโครงสร้างอย่างรวดเร็ว สั่งให้เราวางยางสนและคบเพลิงใน แต่ละจุดที่[officer.GetHerHis] เลือก อาคารลุกเป็นไฟภายในไม่กี่นาที และเราก็หนีก่อนที่เสียงกรีดร้องแรกจะดังออกมาจากข้างใน\n\n"
 laamp_base_contract_schemes.3662.desc.method.haggler: "ระหว่างการจู่โจมอย่างกะทันหันจากทั้งทหารของข้าและกลุ่มของ [officer.GetTitledFirstNamePossessive] โดย แต่ละฝ่ายโจมตีจากคนละด้าน ผู้ป้องกันที่ประหลาดใจไม่มีทางสู้ เราเพียงแค่ฟันฝ่าพวกเขาตั้งแต่ต้นจนจบ โค่นล้มทีละคนเหมือนข้าวโพดสุกงอม แล้วจึงเผาสถานประกอบการเล็กๆ ของพวกเขาหลังจากนั้น\n\n"
 laamp_base_contract_schemes.3662.desc.method.armsman: "$laamp_base_contract_schemes.3662.desc.method.haggler$"
 laamp_base_contract_schemes.3662.desc.method.spoiler: "$laamp_base_contract_schemes.3662.desc.method.haggler$"
 laamp_base_contract_schemes.3662.desc.method.cook: "$laamp_base_contract_schemes.3662.desc.method.forager$"
 laamp_base_contract_schemes.3662.desc.outro: "[employer.GetTitledFirstName] จะยินดีมอบค่าจ้างให้เราอย่างไม่ต้องสงสัย"
 laamp_base_contract_schemes.3662.a: "ชัยชนะอันคู่ควรย่อมสมกับถุงเงินตุง!"
 laamp_base_contract_schemes.3662.b: "ฮ่า ให้พวกเขารู้ไปเลยว่าเป็นฝีมือข้า!"

 laamp_base_contract_schemes.3663.t: "$laamp_base_contract_schemes.3031.t$: ล้มเหลว!"
 laamp_base_contract_schemes.3663.desc.intro: "ว่ากันว่าไม่มีแผนใดรอดพ้นจากการเผชิญหน้ากับศัตรู แผนของเราก็ เช่นกัน: สำหรับตอนนี้,"
 laamp_base_contract_schemes.3663.desc.business.fallback: "โรงช่างเล็กๆ ยังคงตั้งอยู่"
 laamp_base_contract_schemes.3663.desc.business.inn_exterior: "โรงเตี๊ยมยังคงสภาพสมบูรณ์เป็นส่วนใหญ่"
 laamp_base_contract_schemes.3663.desc.business.relaxing_room: "บ้านในเมืองยังคงตั้งตระหง่านไม่เสียหาย"
 laamp_base_contract_schemes.3663.desc.business.winery: "สต็อกของโรงบ่มไวน์ยังคงไม่เปรอะเปื้อน"
 laamp_base_contract_schemes.3663.desc.business.tavern: "โรงเหล้ายังคงค้าขายดี"
 laamp_base_contract_schemes.3663.desc.business.docks: "โรงเก็บของริมท่าเรือยังคงไม่ถูกเผา"
 laamp_base_contract_schemes.3663.desc.business.kennels: "คอกสุนัขยังคงเต็มไปด้วยเสียงเห่าหอนของสุนัข เช่นเคย"
 laamp_base_contract_schemes.3663.desc.business.shrine: "[target.GetFaith.HouseOfWorship] เล็กๆ ยังคงตั้งอยู่อย่างสงบเสงี่ยมริมถนน"
 laamp_base_contract_schemes.3663.desc.business.mews: "อากาศยังคงก้องไปด้วยเสียงร้องแหลมและเสียงกรีดร้องของเหยี่ยวในโรงเลี้ยง"
 laamp_base_contract_schemes.3663.desc.business.bridge: "สะพานเก็บค่าผ่านทางยังคงเก็บเกี่ยวเหรียญของนักเดินทางอย่างต่อเนื่อง"
 laamp_base_contract_schemes.3663.desc.business.market: "ตลาดยังคงดำเนินกิจการอย่างคึกคักและมีชีวิตชีวา"
 laamp_base_contract_schemes.3663.desc.method.intrigue: "ความพยายามของเราที่จะจุดไฟอย่างเงียบๆ ดึงดูดกลุ่มคนพาลขี้เมาที่เดินผ่านไป ความกล้าบ้าบิ่นที่ถูกกระตุ้นด้วยไวน์ และความเชื่อมั่น — อย่างไม่ยุติธรรมและไร้หลักฐาน — ว่าเรากำลังวางแผนก่ออาชญากรรมบางอย่าง พวกขี้เกียจขี้เมาเข้าจู่โจมด้วยความโกรธเกรี้ยวและส่งเสียงดังจนพวกโง่เง่าดึงดูดความช่วยเหลือมา ทำให้ข้าและผู้ติดตามต้องหนีไปอย่างรวดเร็ว\n\n"
 laamp_base_contract_schemes.3663.desc.method.martial: "ตั้งสติให้มั่น ข้าบอกผู้ติดตามของข้า เมื่อประกายอาวุธของเรา ทำให้เราถูกพบเห็นเร็วกว่าที่คาด มันไม่ควรจะเป็นปัญหา เสียงร้องเตือนดังขึ้น และชาวบ้านติดอาวุธเฉพาะกิจหลากหลายประเภทก็ปรากฏตัวขึ้นเพื่อเผชิญหน้ากับเราในไม่ช้า\n\nจำนวนคนสำคัญ แต่การเตรียมพร้อมก็สำคัญ เช่นกัน — หรือควรจะเป็น เช่นนั้น เมื่อข้ารู้ว่ามีเพียงครึ่งหนึ่งของกลุ่มข้าที่ยังอยู่กับข้า ข้าจึงถูกบังคับให้ส่งสัญญาณถอย"
 laamp_base_contract_schemes.3663.desc.method.prowess: "แม้จะพยายามทำลายสถานที่ เราก็ไม่สามารถผ่านประตูเข้าไปได้โดยไม่ส่งเสียงดังอึกทึก เมื่อเราเข้าไปได้ เสียงตะโกนและเสียงร้องเตือนก็ดังขึ้นจากบริเวณใกล้เคียง — เมื่อพิจารณาจากจำนวนคนน้อยนิดของเรา เราจึงเลือกที่จะหนีแทนที่จะอยู่และถูกแขวนคอในฐานะโจร\n\n"
 #
 laamp_base_contract_schemes.3663.desc.method.forager: "[officer.GetTitledFirstName] ไม่ได้ใช้เวลาอยู่ในสถานที่นั้นนานนัก [officer.GetSheHe] เพียงแค่วางยาพิษของ[officer.GetHerHis] อย่างใจกว้างในพื้นที่สำคัญแล้วจากไป เรามั่นใจในความสำเร็จจึงจากมา เพียงเพื่อกลับไปยังที่เกิดเหตุในตอนเช้าเพื่อตรวจสอบผลงานของเรา\n\nน่าเสียดาย แม้การบุกรุกจะถูกสังเกตเห็น [officer.GetFirstNameNoTooltip] #EMP ดูเหมือนว่า#! จะใช้สมุนไพรผิดชนิด! ตอนนี้พวกเขาระวังตัวมากขึ้นโดยเปล่าประโยชน์"
 laamp_base_contract_schemes.3663.desc.method.thief: "การเข้าไปในสถานที่นั้นไม่ใช่ปัญหาสำหรับ [officer.GetTitledFirstName] — แต่การทำ เช่นนั้นโดยไม่ถูกพบเห็นกลับเป็นปัญหามากกว่าเล็กน้อย เพียงครู่เดียวหลังจาก[officer.GetHerHis] เข้าไป เสียงร้องเตือนก็ดังขึ้นจากข้างใน ตามด้วยเสียงการต่อสู้\n\nไม่นาน ประตูก็พังเปิดออกและ [officer.GetFirstNameNoTooltip] ก็กลิ้งออกมา ดึง [officer.GetWomanMan] ขึ้นด้วยมือข้างเดียว เราหนีก่อนที่ความโกลาหลและเสียงร้องที่ดังขึ้นว่า #EMP หยุด! ขโมย#! จะนำความช่วยเหลือมา"
 laamp_base_contract_schemes.3663.desc.method.huntperson: "ไม่เพียง แต่ลูกธนูของ [officer.GetTitledFirstNamePossessive] จะพลาดเป้าหมาย สิ่งที่น่าสาปแช่งนั้นกลับกระทบบานหน้าต่างที่ปิดอยู่และกระดอนออกมาพร้อมเสียง #EMP ตุ้บ#! หนักๆ วินาทีต่อมา บานเกล็ดไม้ก็ถูกเปิดออกและใบหน้าง่วงงุนก็ชะโงกออกมาอย่างไม่แน่ใจจากความมืดสลัว\n\nภาพของเราในชุดสีทึม [officer.GetFirstNameNoTooltip] ยังคงกำคันธนูของ[officer.GetHerHis] ไว้แน่น พร้อมกับลูกธนูที่ตกอยู่ที่เท้าของเรากำลังมอดดับลงอย่างแผ่วเบา ทำให้เห็นได้ชัดเจนว่าเรากำลังทำสิ่งไม่ดี เมื่อเสียงเตือนดังขึ้น เราก็หนี —"
 laamp_base_contract_schemes.3663.desc.method.kenneler.poison_barrels: "[officer.GetTitledFirstName] มีงานง่ายๆ — เราพา [officer.GetHerHim] เข้าไปข้างใน [officer.GetSheHe] #EMP ทำให้#! ถังเสียหาย เราจากไปพร้อมกับของมีค่าเล็กน้อยสองสามชิ้น เพื่อให้ดูเหมือนเป็นการลักขโมยทั่วไป\n\nน่าเสียดาย เจ้าโง่นั่นทำถังแรกคว่ำสนิทขณะพยายามเปิดมัน ทำให้มันแตกและกระแทกพื้นเสียงดัง เสียงร้องเตือนจากบริเวณใกล้เคียงส่งสัญญาณว่าแผนของเราแตกแล้ว และเราก็หนีไป"
 laamp_base_contract_schemes.3663.desc.method.kenneler.steal_dogs: "ชั่วครู่หลังจาก [officer.GetTitledFirstName] เข้าไปในคอกสุนัข เสียงเห่าหอนข้างในก็เงียบลง จากนั้นก็มี... เสียงพูดอู้อี้? เสียงคำราม — หลายเสียง — เสียงขู่ เสียงแยกเขี้ยว และเสียงความโกลาหล!\n\n[officer.GetFirstNameNoTooltip] วิ่งออกมาจากอาคารเล็กๆ โดยมีสุนัขล่าเนื้อตัวใหญ่สองตัวแยกเขี้ยวไล่ตาม และเสียงร้องเตือนจากบริเวณใกล้เคียงบ่งชี้ว่าเสียงเตือนของสุนัขได้ยินแล้ว เช่นเดียวกับ [officer.GetFirstNameNoTooltip] เราหนี แต่"
 laamp_base_contract_schemes.3663.desc.method.kenneler.dog_on_birds: "โอ้ แน่นอน [officer.GetTitledFirstName] เข้าไปในสถานที่นั้นได้ — สุนัขล่าเนื้อสองตัวที่ถูกล่ามไว้ใน แต่ละมือดิ้นรนที่จะถูกปล่อย — แต่เจ้าพวกหมาบ้าน่าสาปแช่งเริ่มเห่าเสียงดังลั่นทันทีที่เห็นนก เมื่อเสียงเห่าหอนของสุนัขดังมาจากภายในโรงเลี้ยงเหยี่ยวอันมีค่า เสียงตะโกนก็ดังขึ้นใกล้ๆ และชัดเจนว่าเราต้องหนี\n\n"
 laamp_base_contract_schemes.3663.desc.method.engineer: "[officer.GetTitledFirstName] ใช้เวลาลังเลอยู่นาน พยายามคิดว่าจุดที่ดีที่สุดในการเริ่มจุดไฟคือที่ใด #EMP กันแน่#! จนมีคนสังเกตเห็นเราเตร็ดเตร่อยู่! ทันทีที่เราถูกพบเห็น ข้ารู้ว่ามันจบแล้ว เสียงตะโกนสับสนหนึ่งปลุกอีกเสียง และในไม่ช้าการหลบหนีก็กลายเป็นทางเลือกเดียวของเรา\n\n"
 laamp_base_contract_schemes.3663.desc.method.haggler: "กลุ่มของข้าและของ [officer.GetTitledFirstNamePossessive] เข้ามาจากทิศทางตรงกันข้าม แต่ดูเหมือนว่าเราอาจจะ... ประเมินความมุ่งมั่นของชาวบ้านต่ำไป การโจมตีของเราถูกพบเห็น และแทนที่จะตื่นตระหนก ผู้ป้องกันกลับหยิบอาวุธเฉพาะกิจอะไรก็ตามที่อยู่ในมือและพุ่งเข้าใส่เรา เต็มไปด้วยความขุ่นเคืองอันชอบธรรมและร้องตะโกน #EMP โจร!#! สุดเสียง\n\nห่างไกลจากการสังหารหมู่ จำนวนที่เหนือกว่าของพวกเขาคุกคามที่จะครอบงำเรา และเราถูกบังคับให้หนี —"
 laamp_base_contract_schemes.3663.desc.method.armsman: "$laamp_base_contract_schemes.3663.desc.method.haggler$"
 laamp_base_contract_schemes.3663.desc.method.spoiler: "$laamp_base_contract_schemes.3663.desc.method.haggler$"
 laamp_base_contract_schemes.3663.desc.method.cook: "$laamp_base_contract_schemes.3663.desc.method.forager$"
 laamp_base_contract_schemes.3663.desc.outro: "[employer.GetTitledFirstName] จะไม่จ่ายเงินแม้ แต่เหรียญเดียวสำหรับความผิดพลาดนี้"
 laamp_base_contract_schemes.3663.a: "เราควรจะไป..."
 laamp_base_contract_schemes.3663.b: "บาห์ ให้ [target.GetFirstNameNoTooltip] รู้ไปเลยว่าเป็นฝีมือข้า!"

 laamp_base_contract_schemes.3781.t: "$laamp_base_contract_schemes.3041.t$: อีกเพียงเล็กน้อย"
 laamp_base_contract_schemes.3781.desc.intro.yes: "เราได้เติมกระเป๋าของเราด้วยเหรียญเงินที่ขโมยมาจากคลังสมบัติของ [employer.GetTitledFirstNamePossessive] แล้ว แต่ยังมีของมีค่าอีกมากมายให้ค้นหาใน [employer.Custom('FortifiedBuilding')] ของ[employer.GetHerHis]: เชิงเทียนทองคำ พรมแขวนผนังอันวิจิตร เสื้อผ้าลินินเนื้อดีที่สุด คัมภีร์ศักดิ์สิทธิ์ และอื่นๆ อีกมากมาย\n\nเครื่องประดับตก แต่งมากมายทั้งหมดที่ [employer.GetTitleAsNameNoTooltip] ผู้ดีน่าจะมองข้ามไป แต่สำหรับ [ROOT.Char.Custom('GetLaampDescribeTypeSelf')] ผู้ต่ำต้อยแล้ว หมายถึง #EMP ผลกำไร#!.\n\nสิ่งที่เราต้องทำคือรื้อค้นบ้านเรือนของ [employer.GetWomanMan] ก่อนที่เราจะถูกค้นพบและหนีหายไปในยามค่ำคืน"
 laamp_base_contract_schemes.3781.desc.ending: "และนั่น... คือทั้งหมด?\n\nสาบานต่อ [ROOT.Char.GetFaith.WealthGodName] เราได้เอา #EMP ทุกสิ่ง#! ที่ปล้นได้ภายใน [employer.Custom('FortifiedBuilding')] ของ [employer.GetTitledFirstNamePossessive] ไปจริงๆ แบ่งใส่กระสอบนั้นกระสอบนี้และมัดรวมกันอย่างหยาบๆ เพื่อให้เกิดเสียงน้อยที่สุด เก็บไว้เพียงวัตถุโบราณที่ล้ำค่าที่สุดเท่านั้น\n\n[employer.GetTitleAsNameNoTooltip] จะต้องเผชิญกับเช้าที่ #EMP ย่ำแย่#! มากเมื่อ [employer.GetSheHe] ตื่นขึ้น\n\nไม่มีอะไรเหลือให้ทำแล้วนอกจากจากไป"
 laamp_base_contract_schemes.3781.desc.success.method.intrigue: "เชือดคอยามที่ตื่นสาย ข้ารับร่างและวางลงบนพื้นอย่างนุ่มนวลและเงียบเชียบ — ก่อนจะเตะให้กลิ้งเข้าไปในเงามืดที่สุดที่ข้าหาได้\n\nเช็ดเลือดออกจากดาบ ข้ารื้อค้นที่พักของเจ้าโง่น่าสงสาร งานปักหรูหราตรงนี้ เงินเล็กน้อยตรงนั้น รวมๆ กันแล้วก็ไม่น้อย ความตายเพื่อเหตุผลอันดี\n\nหากผู้ป้องกันที่เหลือโชคดี พวกเขาจะอยู่ในสภาพแวดล้อมที่ไม่เป็นมงคลน้อยกว่านี้ เพราะข้าสงสัยว่า"
 laamp_base_contract_schemes.3781.desc.success.method.prowess: "ข้าต้องพยายามสองสามครั้งเพื่อทั้งพังประตูให้เพียงพอ #EMP และ#! ทำ เช่นนั้นโดยไม่ส่งเสียงดังเกินไป แต่ในที่สุดข้าก็ทำได้ ผลักประตูออกจากบานพับที่ผุกร่อนเผยให้เห็นห้องขนาดกะทัดรัดที่ใช้สำหรับ... เก็บของจิปาถะเป็นส่วนใหญ่\n\nอืม ไม่เหมาะเท่าไหร่ แต่ในเมื่อข้าเข้ามาแล้ว ข้าก็ค้นดูอยู่ดีและพบของพอให้ขโมยได้คุ้มค่ากับเวลาของข้าในที่สุด\n\nถึงกระนั้น,"
 laamp_base_contract_schemes.3781.desc.success.method.martial: "ยามผู้โชคร้ายของ [employer.GetTitledFirstNamePossessive] ถูกสังหารอย่างรวดเร็วและเงียบเชียบ มีเพียงเสียงครืดคราดก่อนตายที่ #EMP น้อยที่สุด#! ซอกหลืบที่สะดวกกลายเป็นที่พักศพก่อนการฝังที่กำลังจะมาถึง และเราก็เป็นอิสระที่จะปล้นสถานที่ต่อไปจนเกลี้ยง\n\nแน่นอน การเก็บศพไว้ที่นั่นหมายความว่าเราถูกบังคับให้เอาของตก แต่งและเครื่องเรือนหรูหราออกจากซอกนั้น แต่นั่นเป็นเพียงมารยาท\n\nเคลื่อนต่อไป เป็นที่ชัดเจนว่า"
 laamp_base_contract_schemes.3781.desc.success.method.stewardship: "ภายใต้แรงกดที่พอเหมาะ บานพับของกล่องนิรภัยก็หลุดออกและของมีค่าข้างในก็พรั่งพรูออกมาพร้อมเสียงดัง\n\nชั่วขณะหนึ่ง ข้าแข็งทื่อ รอว่าเสียงนั้นจะดึงดูดใครหรือไม่ และ... ไม่มีอะไรเกิดขึ้น ข้าหัวเราะเบาๆ ก้มลงเก็บรางวัล จิกเหรียญ แต่ละเหรียญเหมือนแม่ไก่จิกเมล็ดข้าว\n\nพอใจที่ได้เงินส่วนใหญ่แล้ว ข้าหันความสนใจออกไปข้างนอก —"
 laamp_base_contract_schemes.3781.desc.success.method.agent_intrigue: "[old_rollee.GetTitledFirstName] พบของมากมาย ตามที่ปรากฏ กระซิบรายการสิ่งของที่ [old_rollee.GetSheHe] ขโมยมาอย่างเร่งรีบด้วยความยินดีในความเร่งรีบของ [old_rollee.GetHerHis] ที่จะบุกเข้าไปในสถานที่นั้น\n\nเป็นรายการที่ดี ของมากมายสำหรับของที่ปล้นมา และอะดรีนาลีนจากการขโมยน่าจะช่วยให้เราผ่านพ้นค่ำคืนไปได้ ข้าหยิบผ้าม่านแขวนผนังราคาแพงอย่างใจเย็นและพับเก็บไว้ในกระสอบของข้าเอง คงไม่ดีแน่ถ้าปล่อยให้ผู้ติดตามของข้าทำผลงานได้ดีกว่าข้า #EMP มากเกินไป#! ท้ายที่สุดแล้ว\n\nบางที"
 laamp_base_contract_schemes.3781.desc.success.method.agent_prowess: "การผลักอย่างแรง ทำให้ [old_rollee.GetTitledFirstName] พังประตูห้องนิรภัยหลุดออกจากบานพับอย่างสิ้นเชิง จากนั้นเรารีบไปรับมันไว้ก่อนที่มันจะล้มลงและส่งเสียงดังกว่านี้ แต่เราก็ทำได้\n\nของที่ปล้นมาข้างในคุ้มค่ากับความเสี่ยง — ขุมทรัพย์เหรียญและเครื่องบรรณาการจากประชากรที่รักใคร่ของ [employer.GetTitleAsNamePossessive] ผู้ดี ดูเหมือนจะเป็น เช่นนั้น ตอนนี้ส่งต่อมาถึงเราอย่างเรียบร้อย ต้องขอบคุณความพยายามของ [old_rollee.GetFirstNamePossessiveNoTooltip]\n\nทั้งหมดนี้และอื่นๆ เป็นของเรา และ"
 laamp_base_contract_schemes.3781.desc.success.method.master_thief: "[old_rollee.GetTitledFirstName] ไม่พูดอะไร [old_rollee.GetSheHe] เพียงแค่ยิ้มและชู [old_rollee.Custom('Hand_ArticleTwo')] [old_rollee.Custom('HandHands')] ที่ประดับประดาไปด้วยแหวนใหม่แวววาว อาจจะสามหรือสี่วงต่อ_นิ้ว\n\nพอใจ ข้าพยักหน้าและโบกมือให้ $master_thief_camp_officer$ ของข้าไปทำการลักเล็กขโมยน้อยต่อที่อื่น [old_rollee.GetSheHe|U] ควรถอดมันออก ข้านึกไม่ออกว่ามันจะช่วยความคล่องแคล่วของ[old_rollee.GetHerHis] ได้อย่างไร แต่ข้าจะไม่หยุดเพื่อเทศนาตอนนี้\n\nไม่ใช่เมื่อ"
 laamp_base_contract_schemes.3781.desc.success.method.mos: "ยิ้มกริ่ม [old_rollee.GetTitledFirstName] เปิดกระสอบทอหยาบๆ ของ[old_rollee.GetHerHis] เผยให้เห็น #EMP กอง#! เหรียญจำนวนมาก ที่ถูกห่อเก็บเสียงอย่างหยาบๆ ด้วยหมอนอิงราคาแพง\n\n$master_of_spoils_camp_officer$ ของข้าแตะ [old_rollee.Custom('ActionTaps_ForeheadNose')] ของ[old_rollee.GetHerHis] อย่างรู้ทัน: "กุญแจสำคัญไม่ใช่การมองเห็นของปล้นที่ชัดเจน แต่เป็นการมองเห็นสถานที่ที่ชัดเจนสำหรับ #EMP ซ่อน#! ของ"\n\nจริงแท้ และ"
 laamp_base_contract_schemes.3781.desc.success.method.stress: "ตั้งสมาธิ ตั้งสมาธิ #EMP ตั้งสมาธิ#! ข้าต้องตั้งสมาธิ\n\nหากเราถูกจับที่นี่ ข้าจะต้องถูกแขวนคอก่อนใคร — และที่แย่กว่านั้นคือ นานที่สุด ไม่มีที่ว่างสำหรับความผิดพลาด ไม่ว่าจะตามตัวอักษรหรือในเชิงเปรียบเทียบ เราต้องรวดเร็ว รอบคอบ และไร้ความปรานีขณะเคลื่อนที่จากห้องหนึ่งไปอีกห้องหนึ่ง จากอาคารหนึ่งไปอีกอาคารหนึ่ง เอาทุกสิ่งที่มีค่าแม้เพียงเล็กน้อย\n\nถึงกระนั้น เสียงเรียกร้องอันเย้ายวนของเหรียญที่มากขึ้นก็ยังคงล่อลวงเราต่อไปเรื่อยๆ ท้ายที่สุดแล้ว,"
 laamp_base_contract_schemes.3781.desc.failure.method.intrigue: "การเตรียมมีดไว้พิสูจน์แล้วว่าเป็นความรอบคอบที่ยอดเยี่ยม เนื่องจากเราพบยามเจ้าปัญหาจำนวนมากเกินไปกระจายอยู่ทั่วสถานที่ระหว่างการบุกของเรา\n\nบางคนอยู่ที่นี่ตลอดเวลา คนอื่นๆ ถูกดึงดูดโดยเสียงดังจากการบุกเข้าครั้งแรกของเรา แต่ไม่ว่าทางใด การปรากฏตัวของพวกเขาเป็นตัวบ่งชี้ว่าเราเริ่มเป็นที่สังเกตแล้ว เป็นที่สังเกตมากเกินไป\n\nส่ายหัว ข้ากลับมามุ่งเน้นสิ่งที่สำคัญสำหรับตอนนี้:"
 laamp_base_contract_schemes.3781.desc.failure.method.prowess: "แม้จะพยายามอย่างสุดความสามารถที่จะพังเข้าไปในสิ่งที่ #EMP ดูเหมือน#! ว่าอาจเป็นห้องเก็บของบางประเภท ประตูบ้านั่นก็ไม่ยอมเปิด\n\nการทุบอย่างแรงที่สุดเท่าที่เรากล้าลองให้ผลเพียงเสียงไม้เอี๊ยดอ๊าดทื่อๆ และเสียงพึมพำของใครบางคนที่นอนหลับอยู่ใกล้ๆ พลิกตัว เพราะเสียงดัง\n\nอะไรก็ตามที่อยู่ในนั้นไม่คุ้มกับความเสี่ยง แต่"
 laamp_base_contract_schemes.3781.desc.failure.method.martial: "หน่วยลาดตระเวนล้มลง — และที่สำคัญกว่านั้น พวกเขาล้มลง #EMP อย่างเงียบเชียบ#!.\n\nเพียง แต่... ดูเหมือนจะไม่เงียบพอ การดิ้นรนอย่างบ้าคลั่งและเสียงครืดคราดเปียกชื้นของข้ารับใช้ที่กำลังจะตายอาจดังมาก และ แม้ว่าดูเหมือนจะไม่มีใครได้ยินเราในครั้งนี้ แน่นอนว่าเราจะไม่โชคดี เช่นนั้นในครั้งต่อไป\n\nถึงกระนั้น ความโลภก็เรียกร้องให้เราก้าวต่อไป ดูเหมือนว่า"
 laamp_base_contract_schemes.3781.desc.failure.method.stewardship: "อะไรก็ตามที่อยู่ในกลไกบ้านี่มันหนัก — หนักเกินกว่าจะเคลื่อนย้ายด้วยมือ — และกุญแจก็ใช้งานได้ดี #EMP อย่างน่าหงุดหงิด#!.\n\nการสะเดาะกุญแจเข้าไปอาจใช้เวลาหลายชั่วโมง และการพยายามงัดเพียงครั้งเดียวก็ ทำให้เกิดเสียงโลหะ #EMP ดังแคร๊ง#! จนน่าแปลกใจที่เราไม่ถูกจับได้ทันที เสียงดังครั้งต่อไปที่เราทำจะเป็นครั้งสุดท้ายของเราอย่างแน่นอน\n\nแม้ว่าเราจะล้มเหลวที่นี่,"
 laamp_base_contract_schemes.3781.desc.failure.method.agent_intrigue: "ปรากฏว่า [old_rollee.GetTitledFirstName] ไม่เพียง แต่ไม่พบสิ่งใดให้เราเลย — [old_rollee.GetSheHe]ยังไปปลุกกลุ่มทหารยามให้ตื่นจากวงพนันลูกเต๋าเสียอีก\n\nข้าตบหูของ[old_rollee.GetHerHis]เจ้าคนโง่นั่น พลางพึมพำสั่งให้ระมัดระวัง #EMP มากขึ้น#! ในคราวหน้า มิฉะนั้น[old_rollee.GetSheHe]จะนำพาความพิโรธทั้งปวงของ [employer.GetPrimaryTitle.GetBaseNameNoTier] มาสู่พวกเรา\n\nจะล้มเหลวหรือไม่ก็ตาม,"
 laamp_base_contract_schemes.3781.desc.failure.method.agent_prowess: "แม้จะใช้กำลังทั้งหมดของ[old_rollee.GetHerHis] [old_rollee.GetTitledFirstName] ก็ดูเหมือนจะไม่สามารถพังประตูที่กั้นเราออกจากห้องที่เต็มไปด้วยเครื่องประดับราคาแพงได้\n\nด้วยความหงุดหงิด ข้าส่งสัญญาณให้ปล่อยมันไป มีของที่หยิบฉวยได้ง่ายกว่าที่อื่น ข้ามั่นใจ และยิ่งเราโกรธกับปัญหานี้หรือปัญหานั้นมากเท่าไหร่ เราก็ยิ่งเสี่ยงที่จะทำผิดพลาดมากขึ้นเท่านั้น\n\nเราเสียงดังเกินไปแล้วกับเรื่องนี้ — โดยเฉพาะอย่างยิ่งเมื่อ "
 laamp_base_contract_schemes.3781.desc.failure.method.master_thief: "[old_rollee.GetTitledFirstName] สามารถสำรวจพื้นที่กว้างขวางอย่างน่าประหลาดใจของ [employer.Custom('FortifiedBuilding')] ได้อย่างรวดเร็วและเงียบเชียบ — น่าเสียดาย ตามคำบอกเล่าของ[old_rollee.GetHerHim] มีของที่ขโมยได้น้อยมากที่จะไม่เสี่ยงต่อการส่งสัญญาณเตือน\n\nที่แย่กว่านั้น สีหน้าสำนึกผิดของ[old_rollee.GetHerHis] บ่งบอกว่า [old_rollee.GetSheHe] #EMP อาจจะ#! เสี่ยงทำ เช่นนั้นไปแล้วโดยที่ข้าไม่รู้ เราจะต้องระมัดระวังตัว\n\nจะล้มเหลวหรือไม่ก็ตาม ความล้มเหลวของ [old_rollee.GetFirstNamePossessiveNoTooltip],"
 laamp_base_contract_schemes.3781.desc.failure.method.mos: "เห็นได้ชัดว่าปันส่วนเกลือของ [old_rollee.GetTitledFirstNamePossessive] กำลังจะถูกตัด เพราะ [old_rollee.GetWomanMan] กลับมาในอีกไม่กี่นาทีต่อมา มือเปล่าสนิท\n\nข้าคงคิดว่า $master_of_spoils_camp_officer$ ของข้าจะสามารถปล้นสะดมได้มากกว่านี้เล็กน้อยด้วยตัว[old_rollee.GetHerselfHimself] เอง แต่กลับกลายเป็นว่าข้าถูกบังคับให้ฟังด้วยความสยดสยองที่เพิ่มขึ้นเมื่อเจ้าโง่เล่าว่าเกือบจะเดินไปชนหน่วยลาดตระเวน\n\nความผิดพลาด เช่นนั้นอีกครั้งจะ ทำให้เราทุกคนถูกแขวนคอ ถึงกระนั้น,"
 laamp_base_contract_schemes.3781.desc.cta: "ยังมีของมีค่าให้ปล้นสะดมอยู่ตามโถงทางเดิน..."
 laamp_base_contract_schemes.3781.tt.haul_details: "#TUT [gold_i][varcheck.MakeScope.Var('haul_actual').GetValue|P0] [gold|E] จากที่เป็นไปได้ [gold_i][varcheck.MakeScope.Var('haul_possible').GetValue|V0] ในของที่ปล้นมาปัจจุบัน#!"
 laamp_base_contract_schemes.3781.tt.fouls_remaining: "#TUT [varcheck.MakeScope.Var('heist_failures').GetValue] จาก 2 ครั้งที่ทำพลาดก่อนท่านจะถูกจับ#!"
 laamp_base_contract_schemes.3781.tt.increment_haul: "เพิ่ม [gold_i][varcheck.MakeScope.Var('haul_increment').GetValue|P0] ให้กับของที่ปล้นมา"
