 laamp_base_contract_schemes.3781.a: "หมอบต่ำ #EMP เตรียมมีด#!."
 laamp_base_contract_schemes.3781.b: "ประตูนั้นดูสำคัญ พังมันซะ!"
 laamp_base_contract_schemes.3781.c: "หน่วยลาดตระเวนกำลังมา — จัดการพวกเขาจากทั้งสองด้าน"
 laamp_base_contract_schemes.3781.d: "ข้าเห็นกล่องนิรภัย..."
