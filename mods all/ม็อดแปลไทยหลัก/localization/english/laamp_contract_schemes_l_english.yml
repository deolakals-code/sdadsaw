 laamp_extra_contract_schemes.0022.a: "ข้าจะเก็บภาระผูกพันนี้ไว้กับตัวเอง"
 laamp_extra_contract_schemes.0022.b: "เหยื่อล่อชั้นดีสำหรับ [councillor_liege.GetTitleAsNameNoTooltip]"
 laamp_extra_contract_schemes.0022.c: "ข้าจะไม่ลดตัวลงต่ำขนาดนั้น"
 laamp_extra_contract_schemes.0023.t: "$ep3_contract_event.0100.t$"
 laamp_extra_contract_schemes.0023.desc: ""เจ้าเหนือหัวของข้าพอใจกับข้อมูลเชิงลึกที่ท่านรวบรวมมาได้ ท่านพบอะไรนะ? [secrets_found_value] ความลับ? ไม่ใช่เรื่องเล็กน้อยเลย..." [task_contract_councillor.GetName] เอนตัวเข้ามาในแสง เผยให้เห็นว่า [task_contract_councillor.GetSheHe] อยู่กับข้าในกระโจมของข้าอย่างใดอย่างหนึ่ง\n\n"ท่านมาที่นี่โดยไม่มีใครสังเกตได้อย่างไร?" ข้าถามอย่างสับสน แต่ก่อนที่ข้าจะสามารถเรียกยามของข้าได้ — ก็ไม่มีใครอยู่ที่นั่นอีกต่อไป เหลือเพียงถุงเหรียญขนาดใหญ่ทิ้งไว้"
 laamp_extra_contract_schemes.0023.a: "ข้าจะรับทองคำไปง่าย ๆ พยายามอย่าคิดถึงเรื่องนี้"
 laamp_extra_contract_schemes.0024.t: "$ep3_contract_event.0100.t$"
 laamp_extra_contract_schemes.0024.desc: ""ข้ารอรายงานของท่านอยู่ แต่ไม่มีอะไรมาเลย ข้ากังวล... บางทีท่านอาจลืมข้อตกลงของเราไปแล้ว?" [task_contract_councillor.GetName] ดูถูกข้า — ขณะที่ข้าเข้าใกล้ห้องส้วม! ช่างกล้า! [task_contract_councillor.GetSheHe] มาที่นี่โดยไม่มีใครสังเกตได้อย่างไร?\n\n"ข้าให้สายลับของข้าอยู่ทุกมุมใน [task_contract_target.GetCapitalLocation.GetName] แต่ก็ไร้ผล" ข้าอธิบาย "ไม่ว่าข้าราชบริพารของ [task_contract_target.GetTitledFirstNamePossessive] จะภักดี หรือเพียงแค่ไม่มีอะไรที่ควรค่าแก่การเป็นข่าวลือ"\n\n"ข้อแก้ตัวที่น่ารำคาญ... ข้าคิดว่าท่านน่าจะทำได้ดีกว่านี้ อย่างน้อยก็คำโกหกที่น่ารักกว่านี้หน่อย พิจารณาข้อตกลงของเราว่าสิ้นสุดลงแล้ว" สั่นศีรษะของ [task_contract_target.GetHerHis] [task_contract_councillor.GetFirstNameNoTooltip] หายไปอย่างรวดเร็วเท่าที่ [task_contract_councillor.GetSheHe] มา"
 laamp_extra_contract_schemes.0024.a: "เสียเวลาเปล่าจริง ๆ!"
 laamp_extra_contract_schemes.0030.t: "$ep3_contract_event.0080.t$"
 laamp_extra_contract_schemes.0030.desc: "ข่าวการอ้างสิทธิ์ที่ข้าเพิ่งสร้างขึ้นใหม่ไปถึง [task_contract_councillor.GetName] อย่างรวดเร็ว\n\n"ยินดีด้วย! เป็นงานที่ทำได้ดี" [task_contract_councillor.GetSheHe|U] กล่าว ราวกับตบหลัง [task_contract_councillor.GetHerselfHimself]\n\n"[task_contract_councillor_liege.GetTitledFirstName] จะพอใจอย่างยิ่ง และแน่ใจว่าจะให้รางวัลท่านอย่างเพียงพอ ข้าจะนำเอกสารอันมีค่าของเราไปจากที่นี่... หากท่านเพียงแค่ส่งมันให้ข้า?" [task_contract_councillor.GetFirstNameNoTooltip] เริ่มกระวนกระวายอย่างรวดเร็ว "มาเถอะ! ส่งมันมาให้ข้า!" [task_contract_councillor.GetSheHe] กล่าว พลางดีดนิ้วของ [task_contract_councillor.GetHerHis]"
 laamp_extra_contract_schemes.0030.a: "ข้าจะเก็บสำเนาไว้กับตัวเอง"
 laamp_extra_contract_schemes.0030.b: "[target.GetNameNoTooltip] จะอยู่ในมือที่ดีกว่า!"
 laamp_extra_contract_schemes.0030.c: "ข้าไม่ไว้ใจท่านอีกต่อไป..."

 laamp_prison_break_scheme: "แหกคุก"
 laamp_prison_break_scheme_action: "ช่วยเหลือจากคุกของ"
 laamp_prison_break_scheme_desc: "วางแผนและดำเนินการปล้น [spouse|E], [family|E], [best_friend|E] หรือ [soulmate|E] ของ [contractor|E] จาก [prison|E]"
 laamp_prison_break_scheme_desc_general: "$laamp_prison_break_scheme_desc$"
 laamp_prison_break_scheme_desc_success: "$laamp_contract_scheme_desc_success_boilerplate$"
 laamp_extra_contract_schemes.0011.t: "$ep3_contract_event.0030.t$"
 laamp_extra_contract_schemes.0011.desc: "[task_contract_employer.GetTitledFirstName] ฉลาดที่หันมาหาข้า [ROOT.Char.GetLiege.Custom('KnightCultureNoTooltip')|l] อิสระที่มีอะไรจะเสียน้อย สำหรับการเสี่ยงภัยบ้าบิ่น เช่นนี้... มีวิธีที่จะเล็ดลอดผ่านกำแพงของ [task_contract_target.GetCapitalLocation.GetName] แต่ไม่มีวิธีใดที่ปราศจากความเสี่ยงอย่างใหญ่หลวง ด้วยข้ออ้างอันชาญฉลาดบางอย่าง ข้าจะต้อง ทำให้สายตาที่เป็นมิตรไปถึงห้องขังของ [task_contract_object.GetTitledFirstNamePossessive] ให้ได้...\n\n[task_contract_employer.Custom2('HerHisCharacterIntroduction', task_contract_object)|U] จะดึงดูดความสนใจแม้จะมีการเกี่ยวข้องเพียงเล็กน้อยก็ตาม ไม่เลย อิสรภาพของ [task_contract_object.GetWomanMan] ขึ้นอยู่กับ [ROOT.Char.GetPrimaryTitle.GetBaseName] แต่เพียงผู้เดียว"
 laamp_extra_contract_schemes.0011.a: "$laamp_base_contract_schemes.0000.generic_option.success_chance$"
 laamp_extra_contract_schemes.0011.b: "$laamp_base_contract_schemes.0000.generic_option.speed$"
 laamp_extra_contract_schemes.0011.c: "$laamp_base_contract_schemes.0000.generic_option.progress$"
 laamp_extra_contract_schemes.0011.d: "$laamp_base_contract_schemes.0000.generic_option.nothing$"
 laamp_extra_contract_schemes.0011.d.tt: "$laamp_base_contract_schemes.0000.d.no_starting_bonus$"
 laamp_extra_contract_schemes.0012.t: "สำเร็จ: แผนการ $laamp_prison_break_contract_contract$"
 laamp_extra_contract_schemes.0012.desc_thief: "$laamp_extra_contract_schemes.0013.desc_intro$ [agent_thief.GetFirstName] ผู้ชาญฉลาดสะเดาะกุญแจที่ขังเราจาก [task_contract_object.GetTitledFirstName] อย่างรวดเร็ว"
 laamp_extra_contract_schemes.0012.desc_no_thief: "$laamp_extra_contract_schemes.0013.desc_intro$ นิ้วของข้าชุ่มไปด้วยเหงื่อจากความประหม่า แต่กุญแจผีของข้าก็ยังคลิกเข้าที่"
 laamp_extra_contract_schemes.0012.desc_lookout: "[agent_lookout.GetFirstName] ผู้ระแวดระวังส่งสัญญาณว่าเราปลอดภัยแล้ว"
 laamp_extra_contract_schemes.0012.desc_no_lookout: "จากนั้นข้ามองหายามอย่างตื่นตระหนก ดูเหมือนว่าเราจะไปได้อย่างปลอดภัย"
 laamp_extra_contract_schemes.0012.desc: "ข้าจุ๊ปาก [task_contract_object.GetFirstNameNoTooltip] นำทาง [task_contract_object.GetHerHim] ออกไปในเงามืด"
 laamp_extra_contract_schemes.0012.desc_infiltrator: "กลับผ่านทางเข้าของข้า — หน้าต่างที่ [agent_infiltrator.GetFirstName] เปิดทิ้งไว้ — เราไป"
 laamp_extra_contract_schemes.0012.desc_no_infiltrator: "กลับผ่านทางเข้าของข้า — โถงทางเดินที่ดูเหมือนไม่มีการป้องกัน — เราไป"
 laamp_extra_contract_schemes.0012.desc_free: "เราแอบไปที่ม้าของเรา กระโดดขึ้นอาน และควบม้าอย่างแรง\n\n"ท่านช่วยชีวิตข้าไว้อย่างแท้จริง!" [task_contract_object.GetNameNoTooltip] กล่าว เมื่อเราชะลอความเร็วลงในที่สุด "และนี่ช่างน่าตื่นเต้นเสียนี่กระไร!""
 laamp_extra_contract_schemes.0012.a: ""ข้าชอบทัศนคตินั้น... เข้าร่วมกับเราสิ!""
 laamp_extra_contract_schemes.0012.b: ""[task_contract_employer.GetTitledFirstNameNoTooltip] รอคอยท่านอย่างใจจดใจจ่อ""
 laamp_extra_contract_schemes.0013.t: "ล้มเหลว: แผนการ $laamp_prison_break_contract_contract$"
 laamp_extra_contract_schemes.0013.desc_intro: "ในยามดึกสงัด ข้าลอบเข้าไปในที่ที่ [task_contract_object.GetTitledFirstName] ถูกคุมขังอยู่"
 laamp_extra_contract_schemes.0013.desc_no_thief: "$laamp_extra_contract_schemes.0013.desc_intro$ ชั่วระยะเวลาหนึ่ง ข้าคลำหากุญแจที่ประตูด้วยกุญแจผี บางทีขโมยอาจจะสะเดาะได้ แต่ข้าทำไม่ได้ เมื่อเหลือทางเลือกน้อย ข้าจึงเตะประตูเสียงดัง และเสียงก็ดังขึ้นใกล้ ๆ — พัศดี!\n\n"ขออภัย แต่ข้าต้องไปแล้ว [task_contract_object.GetLadyLord] ของข้า นี่มัน... เกินกำลังข้าไปหน่อย" ข้ากระซิบ เป็นการอำลา\n\n"#EMP บาห์!#! ขอบคุณที่ไม่ทำอะไรเลย!" เสียงตอบกลับ ซึ่งแน่นอนว่าเป็นของ [task_contract_object.GetFirstNamePossessiveNoTooltip]\n\n"หือ? ใครอยู่ที่นั่น?" ยามพูดเสียงดัง โชคดีที่... ข้าซ่อนตัวอย่างดีขณะที่ข้าเล็ดลอดหายไปในความมืด"
 laamp_extra_contract_schemes.0013.desc_no_lookout: "$laamp_extra_contract_schemes.0012.desc_no_thief$ แต่ บนเนื้อไม้ มีแสงตะเกียงริบหรี่ — ยามอยู่ใกล้! ข้าปรารถนาอย่างยิ่งที่จะมีตาอยู่ข้างหลัง! ข้าคว้าตัว [task_contract_object.GetFirstNameNoTooltip] เพื่อวิ่งหนีอย่างบ้าคลั่ง\n\n"ใครอยู่ที่นั่น?" พัศดีตะโกน "#EMP สัญญาณเตือน! สัญญาณเตือน!#!\n\nผู้ไล่ตามติดอาวุธรีบเข้ามาโจมตีเราอย่างรวดเร็ว และในช่วงเวลาที่เลวร้ายที่สุด [task_contract_object.GetFirstNameNoTooltip] ก็สะดุดและล้มลงกับพื้น ในทันใดนั้น [task_contract_object.GetSheHe] ก็ถูกรุมทับ เมื่อเหลือทางเลือกน้อย ข้าจึงหนีไปตามลำพัง"
 laamp_extra_contract_schemes.0013.desc_no_infiltrator: "$laamp_extra_contract_schemes.0012.desc_no_thief$ $laamp_extra_contract_schemes.0012.desc$ กลับไปยังทางเข้าของข้า — โถงทางเดินที่ดูเหมือนไม่มีการป้องกัน — เราไป แต่ประตูของมันตอนนี้ถูกปิดกั้นแล้ว!\n\nขณะที่ข้าพยายามงัดมันเปิด ยามก็ปรากฏตัวขึ้นข้างหลังเรา!\n\n"ข้าจะรั้งเขาไว้!" [task_contract_object.GetFirstNameNoTooltip] ตะโกน "หนีไป!"\n\nเมื่อมีเสียงอื่น ๆ ดังขึ้นใกล้ ๆ ข้าจึงเลือกทางเลือกเดียวที่เป็นไปได้ — ข้าหนี หากจะมีใครต้องตายเพื่อ [task_contract_object.GetWomanMan]... ไม่ควรจะเป็น [task_contract_employer.GetTitledFirstName] หรอกหรือ...?"
 laamp_extra_contract_schemes.0013.desc: "$laamp_extra_contract_schemes.0012.desc_no_thief$ $laamp_extra_contract_schemes.0012.desc$ $laamp_extra_contract_schemes.0012.desc_no_infiltrator$\n\nแต่ยามของ [task_contract_object.GetHerHis] ก็วางกับดักของพวกเขา: #EMP พวกเขารู้ว่าการช่วยเหลือจะมาถึง!#!\n\n"โดย [task_contract_object.GetFaith.HighGodName]! ข้ารู้อยู่แล้วว่ามันง่ายเกินไป!" [task_contract_object.GetFirstNameNoTooltip] ร้องออกมา "หนีไป [ROOT.Char.GetLiege.Custom('KnightCultureNoTooltip')|l] ผู้กล้าหาญ!"\n\nยามกรูกันเข้ามาหาเรา และไม่มีเวลา ไม่มีหวังที่จะชนะ — ดังนั้นข้าจึงวิ่ง! ด้วยปาฏิหาริย์บางอย่าง ข้าสลัดผู้ไล่ตามของข้าและไปถึงกำแพงด้านนอกได้อย่างปลอดภัย... แต่ [task_contract_object.GetFirstNameNoTooltip] ไม่เคยไปถึง"
 laamp_extra_contract_schemes.0013.a: "[task_contract_object.GetSheHe|U] จะต้องถูกเฝ้าดูอย่างต่อเนื่องแน่นอน..."

 #################################################
 # Contract Employer Consequence Loc

 # (all the assorted guff that employers get in the contract rewards)

 laamp_base_0001_success_employer_modifier: "ข้าราชบริพารได้รับความบันเทิง"
 laamp_base_0001_success_employer_modifier_desc: "ราชสำนักของตัวละครนี้กำลังฮือฮาด้วยเรื่องเล่าเกินจริงเกี่ยวกับดินแดนต่างประเทศและชีวิตที่แปลกใหม่บนท้องถนน"
 laamp_base_0001_failure_employer_modifier: "ผู้ติดตามที่น่าเบื่อหน่าย"
 laamp_base_0001_failure_employer_modifier_desc: "นักพเนจรที่น่าเบื่อหน่ายและคนโกงที่ไม่ซื่อสัตย์แห่กันมาที่ราชสำนักของตัวละครนี้ ทำให้เป็นสถานที่ที่น่าเบื่อหน่ายในการอยู่อาศัย"

 laamp_base_0011.tt.success_standard.employer_reward.remove_potential_rivals: "กำจัด [rivals|E] ที่อาจเป็นไปได้ [THIS.Char.MakeScope.ScriptValue('laamp_base_0011_num_removable_potential_rivals_value')] คน"

 laamp_base_0031_success_employer_modifier: "ผู้ไกล่เกลี่ยผู้เชี่ยวชาญ"
 laamp_base_0031_success_employer_modifier_desc: "ตัวละครนี้นำความสามารถที่โดดเด่นเข้ามาเพื่อแก้ไขความขัดแย้งในอาณาจักรของตน"
 laamp_base_0031_failure_employer_modifier: "สละความรับผิดชอบ"
 laamp_base_0031_failure_employer_modifier_desc: "ตัวละครนี้พยายามหาแพะรับบาปเพื่อรับความโกรธแค้นของราษฎรของตน แต่กลับ ทำให้ทุกอย่างแย่ลงเท่านั้น"

 laamp_base_0041_success_employer_modifier: "เชื่อง่าย"
 laamp_base_0041_success_employer_modifier_desc: "แม้จะพยายามอย่างดีที่สุดแล้ว แต่ตัวละครนี้ก็เชื่อในสิ่งที่พวกเขาบอกมากเกินไปเล็กน้อย"
 laamp_base_0041_failure_employer_modifier: "ระแวดระวังต่อคนโกหก"
 laamp_base_0041_failure_employer_modifier_desc: "ตัวละครนี้รู้ว่าไม่มีใครมาที่ราชสำนัก เว้นแต่พวกเขาต้องการบางสิ่ง และปฏิบัติตนตามนั้น"

 laamp_base_1001_success_employer_modifier: "อาชญากรถูกจับกุม"
 laamp_base_1001_success_employer_modifier_desc: "เคาน์ตีนี้ปราศจากองค์ประกอบที่กระทำผิดซ้ำอย่างแน่นอน — สำหรับตอนนี้"

 laamp_base_1021_success_employer_modifier: "กองทหารฝึกฝนมาอย่างดี"
 laamp_base_1021_success_employer_modifier_desc: "ครูฝึกผู้เชี่ยวชาญได้หล่อหลอมทหารในครัวเรือนของตัวละครนี้ให้กลายเป็นเครื่องจักรที่ทำงานอย่างราบรื่น"
 laamp_base_1021_failure_employer_modifier: "ฝูงชนสกปรก"
 laamp_base_1021_failure_employer_modifier_desc: "#EMP กองทหาร?#! ครัวเรือนของตัวละครนี้ดูเหมือนนักเลงขี้เมาข้างถนนมากกว่านักรบ"

 laamp_base_1031_success_employer_modifier: "ดินแดนสงบสุข"
 laamp_base_1031_success_employer_modifier_desc: "ปัจจุบันเคาน์ตีนี้กำลังเพลิดเพลินกับช่วงเวลาแห่งความสงบสุขโดยเปรียบเทียบ"
 laamp_base_1031_failure_employer_modifier: "ดินแดนในความโกลาหล"
 laamp_base_1031_failure_employer_modifier_desc: "การโต้เถียงและการปะทะกันเล็กน้อยเป็นลักษณะประจำของชีวิตที่นี่ และผู้อยู่อาศัยรู้ว่าควรโทษใคร"

 laamp_base_1041_success_employer_modifier: "นักเดินทางถูกดักปล้น"
 laamp_base_1041_success_employer_modifier_desc: "ไม่ว่าจะเป็นพนักงานเก็บภาษี ผู้แสวงบุญ หรือพ่อค้า ถนนในเคาน์ตีนี้ไม่ปลอดภัยสำหรับใครเลย"
 laamp_base_1041_failure_employer_modifier: "ถนนปลอดภัย"
 laamp_base_1041_failure_employer_modifier_desc: "แม้จะมีความพยายามอย่างดีที่สุดของอาชญากรอาชีพบางคน เส้นทางในเคาน์ตีนี้ยังคงได้รับการคุ้มกันอย่างดี"

 laamp_base_2021_failure_employer_modifier: "การก่อสร้างที่ผิดพลาด"
 laamp_base_2021_failure_employer_modifier_desc: "โครงสร้างพื้นฐานของเคาน์ตีนี้อยู่ในความโกลาหลอย่างสิ้นเชิง ทำให้การก่อสร้างมีค่าใช้จ่ายสูงมาก"

 laamp_base_2031_success_employer_modifier: "สงบเรียบร้อย"
 laamp_base_2031_success_employer_modifier_desc: "แม้จะมีปัญหาต่อเนื่องเกี่ยวกับเขตแดนภายในที่แน่นอน แต่ผู้อยู่อาศัยในเคาน์ตีนี้ก็พึงพอใจในปัจจุบัน"
 laamp_base_2031_failure_employer_modifier: "จุดเดือด"
 laamp_base_2031_failure_employer_modifier_desc: "ความตึงเครียดที่นี่ทวีความรุนแรงขึ้นมากจนผู้คนใช้เวลาโต้เถียงกันมากกว่าทำงาน"

 laamp_base_2041_success_employer_modifier: "ผู้แทนปลอม"
 laamp_base_2041_success_employer_modifier_desc: "เป็นที่ทราบกันดีว่าพนักงานเก็บภาษีของตัวละครนี้เคยถูกปลอมตัวมาก่อน ทำให้งานของพวกเขายุ่งยากซับซ้อนไม่รู้จบ"
 laamp_base_2041_failure_employer_modifier: "เจ้าหน้าที่ที่เชื่อถือได้"
 laamp_base_2041_failure_employer_modifier_desc: "ราษฎรของตัวละครนี้รู้ว่า หากไม่มีตราประทับที่เหมาะสม ก็ไม่มีใครที่อ้างตำแหน่งจะมีตำแหน่งนั้นจริง ๆ"

 laamp_base_3001_success_employer_modifier: "ข่าวกรองที่แข็งแกร่ง"
 laamp_base_3001_success_employer_modifier_desc: "ตัวละครนี้ได้รับรายงานโดยละเอียดเกี่ยวกับเหตุการณ์ที่เกิดขึ้นในอาณาจักรอื่น ๆ"

 laamp_base_3041_success_employer_modifier: "ท้องพระคลังถูกปล้น"
 laamp_base_3041_success_employer_modifier_desc: "เสียงกระซิบตามลมกล่าวว่าตัวละครนี้ไม่สามารถแม้ แต่จะรักษาเหรียญของตนให้ปลอดภัยได้"
 laamp_base_3041_failure_employer_modifier: "ทรัพย์สมบัติได้รับการปกป้อง"
 laamp_base_3041_failure_employer_modifier_desc: "ตัวละครนี้ได้ขับไล่ความพยายามที่จะยึดเงินที่สะสมไว้ของตน"

 laamp_base_4001_success_employer_modifier: "เอกสารเป็นระเบียบ"
 laamp_base_4001_success_employer_modifier_desc: "กระดาษอาจมีราคาแพง แต่งานเอกสารยังคงจำเป็น และตัวละครนี้มีเป็นรีม ๆ"
 laamp_base_4001_failure_employer_modifier: "บันทึกสับสน"
 laamp_base_4001_failure_employer_modifier_desc: "คนโง่เขลาไร้ความสามารถบางคนได้เข้ามายุ่งเกี่ยวกับหอจดหมายเหตุของตัวละครนี้ ทำให้การบริหารงานของพวกเขายุ่งยากซับซ้อน"

 laamp_base_4021_success_employer_modifier: "ข้อความตามสมัยนิยม"
 laamp_base_4021_success_employer_modifier_desc: "เรื่องเล็กน้อยที่เพ้อฝัน ซึ่งได้รับมอบหมายจากตัวละครนี้กำลังเป็นที่นิยมอย่างมากในราชสำนักในปัจจุบัน"
 laamp_base_4021_failure_employer_modifier: "ผู้อุปถัมภ์ที่ไม่ทันสมัย"
 laamp_base_4021_failure_employer_modifier_desc: "ตัวละครนี้เป็นที่รู้จักกันดีว่าทุ่มเงินไปกับเรื่องไร้สาระที่สับสนที่สุด"

 laamp_base_4041_success_employer_modifier: "สิ่งศักดิ์สิทธิ์ปลอม"
 laamp_base_4041_success_employer_modifier_desc: "ตั้งแต่เครื่องรางไปจนถึงวัตถุมงคล เป็นที่ทราบกันดีว่าหากท่านต้องการสิ่งศักดิ์สิทธิ์เล็กน้อย ท่านสามารถซื้อมันได้ในอาณาจักรของตัวละครนี้"
 laamp_base_4041_failure_employer_modifier: "มาตรฐานสิ่งศักดิ์สิทธิ์"
 laamp_base_4041_failure_employer_modifier_desc: "ตัวละครนี้เป็นที่รู้จักกันดีว่ามีจุดยืนที่แข็งกร้าวต่อวัตถุมงคลปลอม"

 laamp_base_5001_success_employer_modifier: "สัตว์ร้ายถูกกำจัด"
 laamp_base_5001_success_employer_modifier_desc: "ประชากรสัตว์ในเคาน์ตีนี้อยู่ภายใต้การควบคุมอย่างละเอียดถี่ถ้วน"
 laamp_base_5001_failure_employer_modifier: "ป่าเถื่อนวิ่งอย่างอิสระ"
 laamp_base_5001_failure_employer_modifier_desc: "สัตว์ร้ายที่นี่ขยายพันธุ์อย่างอิสระเกินไปและท่องไปอย่างดุร้ายเกินไป เป็นอันตรายต่อชีวิตและแขนขา"

 laamp_base_5011_success_employer_modifier: "พ่อค้ามั่นใจ"
 laamp_base_5011_success_employer_modifier_desc: "ชนชั้นพ่อค้าที่นี่รู้ว่าทรัพย์สินของพวกเขาปลอดภัยจากอันตราย"
 laamp_base_5011_failure_employer_modifier: "มอดไหม้เป็นควัน"
 laamp_base_5011_failure_employer_modifier_desc: "การลงทุนที่นี่มีความเสี่ยงสูงที่จะกลายเป็นเถ้าถ่าน"

 laamp_base_5021_success_employer_modifier: "ได้รับการคุ้มกันอย่างดี"
 laamp_base_5021_success_employer_modifier_desc: "ตัวละครนี้ได้รับการรักษาความปลอดภัยอย่างดีจากภัยคุกคามทุกชนิด"
 laamp_base_5021_failure_employer_modifier: "การหลบหนีอย่างหวุดหวิด"
 laamp_base_5021_failure_employer_modifier_desc: "การเผชิญหน้ากับความตายครั้งล่าสุดของตัวละครนี้ #EMP ใกล้เข้ามา#! และครั้งต่อไปมีแนวโน้มที่จะใกล้เข้ามามากยิ่งขึ้น"

 laamp_base_5031_success_employer_modifier: "ปศุสัตว์หายไป"
 laamp_base_5031_success_employer_modifier_desc: "ผู้ปกครองของเคาน์ตีนี้ไม่สามารถแม้ แต่จะรับประกันความปลอดภัยของฝูงสัตว์ของตนได้"
 laamp_base_5031_failure_employer_modifier: "ฝูงสัตว์ได้รับการคุ้มครอง"
 laamp_base_5031_failure_employer_modifier_desc: "ปศุสัตว์ที่นี่ได้รับการรักษาความปลอดภัยจากแม้ แต่อาชญากรที่มีหัวการค้าที่สุด"

 laamp_base_5041_success_employer_modifier: "หายไปเล็กน้อยจากด้านบน"
 laamp_base_5041_success_employer_modifier_desc: "สัตว์ในเคาน์ตีนี้... น้อยกว่าที่คาดไว้ ด้วยเหตุผลบางอย่าง"
 laamp_base_5041_failure_employer_modifier: "ป่าได้รับการคุ้มครอง"
 laamp_base_5041_failure_employer_modifier_desc: "พรานเถื่อนจะถูกแขวนคอ"

 #################################################
 # On-Going Diplo Scheme Events

 laamp_base_contract_schemes.0301.t: "เรื่องราวและเกียรติยศ"
 laamp_base_contract_schemes.0301.desc: "มื้อค่ำที่ราชสำนักของ [target.GetTitledFirstNamePossessive] เป็นเวลาที่เหมาะอย่างยิ่งที่จะสร้างความประทับใจให้ข้าราชบริพารของ [target.GetHerHis] ด้วยการผจญภัยอันห้าวหาญของข้า\n\nยิ่งพวกเขาพอใจมากเท่าไหร่ กระเป๋าเงินของข้าก็ยิ่งมีแนวโน้มที่จะอ้วนขึ้นเท่านั้น\n\nแน่นอนว่า สิ่งนี้ต้องการเรื่องราวการผจญภัยอันยิ่งใหญ่ที่เต็มไปด้วยวีรกรรมและความชั่วร้าย — อย่างถูกต้องหรืออื่นใด — มากกว่าไหวพริบอันละเอียดอ่อน"
 laamp_base_contract_schemes.0301.a: "ข้าคิดว่าข้ารู้จักเรื่องราว เช่นนั้นสองสามเรื่อง..."
 laamp_base_contract_schemes.0301.a.tt.success: "การกระทำของท่านมีเสน่ห์"
 laamp_base_contract_schemes.0301.a.tt.failure: "คำพูดของท่านฟังดูกลวงเปล่า"
 laamp_base_contract_schemes.0301.b: "ชื่อเสียงของข้าไม่ได้บ่งบอกด้วยตัวมันเองหรือ?"
 laamp_base_contract_schemes.0301.b.f: "โอกาสของสิ่งนี้ถูกควบคุมโดย [prestige_level|E] ของท่าน"
 laamp_base_contract_schemes.0301.b.tt.success: "ใช่แล้ว"
 laamp_base_contract_schemes.0301.b.tt.failure: "หาไม่"
 laamp_base_contract_schemes.0301.c: "เรื่องราวทั้งหมดย่อมเติบโตในการเล่าขาน!"
 laamp_base_contract_schemes.0301.c.tt.success: "เรื่องเล่าเกินจริงคือเรื่องเล่าที่ดีที่สุด"
 laamp_base_contract_schemes.0301.c.tt.failure: "การหลอกลวงที่เห็นได้ชัด"
 laamp_base_contract_schemes.0301.d: "กินอาหารฟรีแล้วปล่อยมันไว้แค่นั้น"
 laamp_base_contract_schemes.0301.e: "เติมกระเป๋าของท่านด้วยขนมปังม้วนฟรี"
 laamp_base_contract_schemes_0301_doubtful_stories_modifier: "เรื่องราวที่น่าสงสัย"
 laamp_base_contract_schemes_0301_doubtful_stories_modifier_desc: "มีบางอย่างไม่ถูกต้องนักกับสิ่งที่พวกเขาพูด"

 laamp_base_contract_schemes.0311.t: "ชายฝั่งอันไกลโพ้นและดินแดนห่างไกล"

 laamp_base_contract_schemes.0311.desc.only_exotic_culture: "สำหรับชาว [target.GetCulture.GetCollectiveNoun] เช่น [target.GetTitledFirstName] [ROOT.Char.GetWomanMan] ชาว [exotic_culture.GetName] ผู้หยิ่งผยอง เช่นข้าถือเป็นสิ่งแปลกประหลาดต่างถิ่นที่น่าสงสัย บางทีอาจถึงขั้นเป็นของหายาก: ใครจะรู้ว่าเมื่อไหร่พวกเขาจะได้มีโอกาสพูดคุยกับคน เช่นข้าและฟังเรื่องราวเกี่ยวกับบ้านเกิดอันห่างไกลของข้าอีกครั้ง?"
 laamp_base_contract_schemes.0311.desc.only_exotic_faith: "คำสอนของ [exotic_faith.HighGodName] — โดยเฉพาะอย่างยิ่งในรูปแบบ [exotic_faith.GetAdjective] ที่เหมาะสม — ขาดหายไปอย่างน่าเป็นห่วงในดินแดนของ [target.GetTitledFirstNamePossessive]\n\nเป็นสถานการณ์ที่น่าเศร้า แต่เป็นสถานการณ์ที่ #EMP ทำให้#! นิสัยและพิธีกรรมของข้ามีความแปลกใหม่ต่างแดนบางอย่าง ซึ่ง ทำให้หลายคนในราชสำนักหลงใหล"
 laamp_base_contract_schemes.0311.desc.both_exotic: "ด้วยความเป็นทั้งชาว [exotic_culture.GetName] และผู้นับถือ [exotic_faith.GetAdherentName] วิถีชีวิตต่างแดนของข้าจึงน่าหลงใหลอย่างไม่รู้จบสำหรับข้าราชบริพารของ [target.GetTitledFirstNamePossessive]\n\nหลายคนไม่เคยเห็นคน เช่นข้ามาก่อน บางทีพวกเขาอาจจะไม่ได้เห็นอีกเลยหลังจากที่เราจากไป แม้ว่าข้าจะไม่สามารถบอกได้ว่าประวัติศาสตร์จะเป็นอย่างไรต่อไป"
 laamp_base_contract_schemes.0311.desc.outro: "\n\nพวกเขาไม่ได้... #EMP สุภาพ#! นักในความคิดเห็นของพวกเขา แต่นั่นยิ่ง ทำให้พวกเขาง่ายต่อการยั่วยุและสร้างความบันเทิง"
 laamp_base_contract_schemes.0311.a: "ให้ข้าเล่าให้ท่านฟังเกี่ยวกับการใช้ชีวิตแบบชาว [exotic_culture.GetNameNoTooltip]!"
 laamp_base_contract_schemes.0311.a.tt.success: "เรื่องเล่าที่น่าหลงใหล"
 laamp_base_contract_schemes.0311.a.tt.success.cultural_acceptance: "เรื่องเล่าของนักผจญภัยเกี่ยวกับความมหัศจรรย์ต่างแดน"
 laamp_base_contract_schemes.0311.a.tt.failure: "คำพูดที่น่าสะพรึงกลัว"
 laamp_base_contract_schemes.0311.a.tt.failure.cultural_acceptance: "เรื่องเล่าของคนแปลกหน้าเกี่ยวกับความป่าเถื่อนในแดนไกล"
 laamp_base_contract_schemes.0311.b: "อาาา [exotic_faith.GetNameNoTooltip] เป็นสิ่งที่ลึกลับ..."
 laamp_base_contract_schemes.0311.b.tt.success: "ความแปลกใหม่ที่เย้ายวนใจ"
 laamp_base_contract_schemes.0311.b.tt.failure: "ความเสื่อมทรามที่สับสน"
 laamp_base_contract_schemes.0311.c: "ข้าจะวาด... #EMP ภาพ#! ให้ท่านดู..."
 laamp_base_contract_schemes.0311.c.tt.success: "คำโกหกที่หอมหวาน"
 laamp_base_contract_schemes.0311.c.tt.failure: "คำโกหกที่ชัดเจนที่สุด"
 laamp_base_contract_schemes.0311.d: "เกรงว่าท่านคงไม่เข้าใจความแตกต่างเล็กน้อยเหล่านั้น"
 laamp_base_contract_schemes_0311_likes_other_faiths_modifier: "ชื่นชอบความเชื่อที่ผิดพลาด"
 laamp_base_contract_schemes_0311_likes_other_faiths_modifier_desc: "ตัวละครนี้ได้รับโอกาสให้ชื่นชมความสุขเรียบง่ายของผู้ที่ท้าทายทางเทววิทยา"
 laamp_base_contract_schemes_0311_hates_other_faiths_modifier: "เกลียดชังความเชื่อต่างแดน"
 laamp_base_contract_schemes_0311_hates_other_faiths_modifier_desc: "ตัวละครนี้ไม่เข้าใจเลยว่าทำไมผู้คนจำนวนมากถึงผิดพลาดได้อย่างมาก เช่นนี้"

 laamp_base_contract_schemes.0321.t: "อาสาสมัคร"
 laamp_base_contract_schemes.0321.desc.intro: "ระหว่างการพักอยู่ที่ราชสำนักของ [target.GetTitledFirstNamePossessive] เราได้พยายามอย่างดีที่สุดเพื่อตอบสนองความต้องการของเราในการให้ความบันเทิงและครอบครองบริวารของ [target.GetHerHis]\n\n"
 laamp_base_contract_schemes.0321.desc.three_courtiers: "ดูเหมือนว่าเราอาจจะทำงานของเราได้ดี #EMP เกินไป#! เล็กน้อย เนื่องจากข้าราชบริพารหลายคนของ [target.GetHerHis] ได้เข้ามาหาข้าเป็นการส่วนตัว ขอเข้าร่วมค่ายพักแรมของเรา!\n\n[courtier_1.GetFirstName] กระตือรือร้นที่สุด แต่ [courtier_2.GetFirstName] และ [courtier_3.GetFirstName] ก็ไม่ได้ตามหลัง [courtier_1.GetHerHim] มากนัก\n\nไม่ต้องสงสัยเลยว่า [target.GetTitledFirstNameNoTooltip] คงไม่อนุญาตให้ทั้งสามคนจากไปกับเรา แต่บางทีเราอาจจะรับไปสักคนได้"
 laamp_base_contract_schemes.0321.desc.two_courtiers: "ดูเหมือนว่าเราอาจจะทำงานของเราได้ดี #EMP เกินไป#! เล็กน้อย เนื่องจากข้าราชบริพารสองคนของ [target.GetHerHis] ได้เข้ามาหาข้าเป็นการส่วนตัว ขอเข้าร่วมค่ายพักแรมของเรา!\n\n[courtier_1.GetFirstName] กระตือรือร้นที่สุด แต่ [courtier_2.GetFirstName] ก็ไม่ได้ตามหลัง [courtier_1.GetHerHim] มากนัก\n\nไม่ต้องสงสัยเลยว่า [target.GetTitledFirstNameNoTooltip] คงไม่อนุญาตให้ทั้งสองคนจากไปกับเรา แต่บางทีเราอาจจะรับไปสักคนได้"
 laamp_base_contract_schemes.0321.desc.one_courtier: "ดูเหมือนว่าเราได้ทำงานของเราเป็นที่น่าพอใจ เนื่องจาก [courtier_1.GetFirstName] ข้าราชบริพารของ [target.GetHerHis] ได้เข้ามาหาข้าเป็นการส่วนตัวและขอเข้าร่วมค่ายพักแรมของเรา\n\n[target.GetTitledFirstNameNoTooltip] คงจะไม่ขัดเคืองเราสำหรับบริวารเพียงคนเดียวของ [target.GetHerHis] หากข้าอนุญาตให้ [courtier_1.GetFirstNameNoTooltip] ลงชื่อเข้าร่วม"
 laamp_base_contract_schemes.0321.a: "เราจะรับเจ้า [courtier_1.GetFirstNameNoTooltip]"
 laamp_base_contract_schemes.0321.b: "บางที [courtier_2.GetFirstNameNoTooltip] อาจจะสนใจ..."
 laamp_base_contract_schemes.0321.c: "[courtier_3.GetFirstName] น่าจะมีประโยชน์"
 laamp_base_contract_schemes.0321.d: "#EMP เจ้า#!? เจ้าล้อเล่นแน่ ๆ!"
 laamp_base_contract_schemes.0321.e: "อนิจจา คณะของเราเต็มแล้ว"

 laamp_base_contract_schemes.0331.t: "สิ่งใดขับเคลื่อนเราไปข้างหน้า"
 laamp_base_contract_schemes.0331.desc: ""ข้าสงสัยมาตลอด ที่รัก [ROOT.Char.GetFirstNameNoTooltip]" [target.GetTitledFirstName] พูดเสียงยานคางในมื้อค่ำที่เกียจคร้านมื้อหนึ่ง "ท่านเล่าเรื่องราวชีวิตและการกระทำของท่าน แต่ท่านอาศัยอยู่ใต้ชายคากระโจมที่เต็มไปด้วยโคลน แทบจะไม่ได้รับการปกป้องจากฝนที่ตกหนักและแสงแดดที่แผดเผา"\n\nข้าพยักหน้า ไม่มีประโยชน์ที่จะปฏิเสธ\n\n"ด้วยความสะดวกสบายพื้นฐานของชีวิตมากมายที่ถูกปฏิเสธจากท่าน สิ่งใดเล่าที่กระตุ้นให้ท่านตื่นขึ้นในตอนเช้า? ทำไมต้องเดินหน้าต่อไปเมื่อวันรุ่งขึ้นท่านก็แค่ต้องทำทั้งหมดอีกครั้ง?""
