 laamp_base_contract_schemes.5661.i: "จะต้องไม่มี #EMP ความผิดพลาด#! ใดๆ จากพวกเจ้า #EMP คนใด#! ทั้งสิ้น"

 laamp_base_contract_schemes.5662.t: "$laamp_base_contract_schemes.5034.t$: สำเร็จ!"
 laamp_base_contract_schemes.5662.desc: "แม้จะมีความพยายามอย่างสุดความสามารถจากสมุนมากมายของ [employer.GetTitledFirstNamePossessive] [ROOT.Char.GetPrimaryTitle.GetDefinitiveName|l] ก็ได้ทวงคืนฝูงสัตว์จำนวนมหาศาลอย่างแท้จริงจากเงื้อมมืออันน่าอดสูของ[employer.GetHerHis]\n\nบางทีพวกมันอาจไม่ใช่ของเราโดยธรรมชาติ แต่นั่นสำคัญอะไรกับเรา? ด้วยดาบและขวาน เราได้เอาสิ่งที่เราต้องการ และใครก็ตามที่ต่อต้านเราก็นอนตายอยู่ในทุ่งหญ้าของพวกเขา\n\nขอให้ร่างของพวกเขาเป็นอาหารอันโอชะสำหรับอีกา"
 laamp_base_contract_schemes.5662.a: "คืนนี้เรากินอย่างราชา!"

 laamp_base_contract_schemes.5663.t: "$laamp_base_contract_schemes.5034.t$: ล้มเหลว!"
 laamp_base_contract_schemes.5663.desc: "แม้ว่าเราจะพยายามอย่างสุดความสามารถ กองทหารของ [employer.GetTitledFirstNamePossessive] ดูเหมือนจะขัดขวางเราทุกฝีก้าว คำเตือนถูกส่งไปยังหมู่บ้านห่างไกล ฝูงสัตว์มากมายถูกย้ายไปที่อื่น ยามใหม่และหอสังเกตการณ์ที่สร้างขึ้นใหม่ในทุกจุดที่เราหยุด...\n\nวันนี้ ชัยชนะเป็นของ [employer.GetTitleAsNameNoTooltip]"
 laamp_base_contract_schemes.5663.a: "บาห์ เจ้าโง่แก่ชราภาพ..."

 laamp_base_contract_schemes.5901.t: "$laamp_base_contract_schemes.5051.t$: [victim.GetTitledFirstNameNoTooltip]"
 laamp_base_contract_schemes.5901.desc.intro.1: "เมื่องานยามเย็นเกือบเสร็จสิ้น สายลับของข้าและข้าครุ่นคิดว่าจะกลับบ้านเร็วหน่อยหรือไม่ — บทสนทนาที่ถูกตัดสินให้เราโดยการมาถึงของเหยื่อที่ดูมีแวว..."
 laamp_base_contract_schemes.5901.desc.intro.2: "เมื่อยามบ่ายคล้อยเข้าสู่ยามเย็น ข้ากลั้นหาว อาชญากรรมอาจให้ผลตอบแทนดี แต่ส่วนใหญ่เกี่ยวข้องกับการ #EMP รอคอย#! — แต่เดี๋ยวก่อนสิ [victim.GetWomanMan] คนนี้ดูมีแวว..."
 laamp_base_contract_schemes.5901.desc.intro.3: "การปล้นที่ได้ผลคละเคล้ากันรบกวนงานของเราในวันนี้ โดยได้กระเป๋าเงินมามากมาย แต่มีเพียงไม่กี่ใบที่ #EMP ตุง#! เป็นพิเศษ แต่จากลักษณะของ [victim.GetWomanMan] คนนี้ นั่นอาจกำลังจะเปลี่ยนไป..."
 laamp_base_contract_schemes.5901.desc.intro.4: "งานในวันนี้ได้กำไรค่อนข้างดีแล้ว โดยมีพลเมืองดีหลายคนบริจาคเงินของพวกเขาให้กับ #EMP จุดประสงค์#! ของเราอย่างกรุณา [victim.GetWomanMan] คนนี้อาจเป็นคนที่รวยที่สุด..."
 laamp_base_contract_schemes.5901.desc.intro.5: "หลังจากวันที่ส่วนใหญ่ไร้ผล โดยแทบไม่มีชาวนาที่ร่ำรวยแม้ แต่คนเดียวผ่านพื้นที่ปล้นของเรา ในที่สุดเราก็โชคดีเล็กน้อยกับ [victim.GetWomanMan] ที่มีฐานะชัดเจน"
 laamp_base_contract_schemes.5901.desc.victim_type.good_relation: "นั่น... [victim.Custom2('RelationToMeShort',ROOT.Char)] ของข้า [victim.GetTitledFirstName]? [victim.GetSheHe] กำลังคิดอะไรอยู่ เดินเตร่ไปตามถนนอันตรายเหล่านี้โดยไม่มีผู้คุ้มกัน! แน่นอนว่า [victim.GetSheHe] มีแนวโน้มที่จะถูกปล้น [victim.GetSheHe] ช่างประมาทเลินเล่อ เช่นนี้ได้อย่างไร?"
 laamp_base_contract_schemes.5901.desc.victim_type.bad_relation: "แหม แหม แหม หากไม่ใช่ [victim.Custom2('RelationToMeShort',ROOT.Char)] เก่าแก่ของข้า [victim.GetTitledFirstName] และไม่มีผู้คุ้มกันด้วย ช่าง... #EMP โชคดี#! เสียจริง"
 laamp_base_contract_schemes.5901.desc.victim_type.consort: "นั่น [victim.GetFirstName] #EMP [victim.Custom2('RelationToMeShort',ROOT.Char)]#! ของข้า!! แม้ว่าตอนนี้เราจะแยกกันแล้ว แน่นอนว่าข้าไม่สามารถทำสิ่งนี้กับ [victim.GetHerHim] กับคนที่ข้ารักในนามได้หรือ?"
 laamp_base_contract_schemes.5901.desc.victim_type.family: "เป็นไปไม่ได้... [victim.GetFirstName|U] [victim.Custom2('RelationToMeShort',ROOT.Char)] ของข้า ไม่มีผู้คุ้มกัน เกือบจะกระโดดโลดเต้นเข้าสู่อันตรายอย่างร่าเริง ตามใจชอบ ความเขลาของ[victim.GetHerHis|U] ทำให้ชื่อเสียงของตระกูล [ROOT.Char.GetHouse.GetName] มัวหมอง"
 laamp_base_contract_schemes.5901.desc.victim_type.courtier: "อืม นั่น #EMP ดูเหมือน#! จะเป็น [victim.GetTitledFirstName] — ข้าราชสำนักของ [target.GetTitledFirstName] สำหรับประโยชน์ทั้งหมดที่สิ่งนั้นทำเพื่อ [victim.GetHerHim] ที่นี่และเดี๋ยวนี้ โดยไม่รู้ตัวว่าถูกล้อมรอบโดย [ROOT.Char.GetPrimaryTitle.GetDefinitiveName]"
 laamp_base_contract_schemes.5901.desc.victim_type.baron: "นั่น... ใช่ [victim.GetFirstName] [victim.GetTitleAsNameNoTooltip] แห่ง [victim.GetPrimaryTitle.GetBaseNameNoTier]! [victim.GetSheHe|U] ต้องมาเยือนเมืองหลวงด้วยธุรกิจส่วนตัว ส่วนตัวมาก ที่จะเดินทางโดยไม่มีผู้คุ้มกันและใช้ทางลัดที่ #EMP เสื่อมเสีย#! เช่นนี้"
 laamp_base_contract_schemes.5901.desc.victim_type.baron_courtier: "ข้าบอกไม่ได้ว่าข้ารู้จัก [victim.GetHerHim] แต่จากเครื่อง แต่งกายของ[victim.GetHerHis] [victim.GetSheHe] ดูเหมือนจะร่ำรวย แต่ไม่สำคัญ บางทีอาจเป็นข้าราชสำนักของผู้ปกครองท้องถิ่นเล็กๆ บางคน"
 laamp_base_contract_schemes.5901.desc.victim_type.traveller: "เครื่อง แต่งกายและท่าทีที่ไม่แน่นอนของ[victim.GetHerHis] บ่งบอกว่า[victim.GetHerHim] เป็นชาวต่างชาติอย่างชัดเจน อย่างน้อยก็สำหรับเมืองนี้ น่าจะเป็นผู้มาเยือนระยะสั้น หรือนักเดินทางที่เพิ่งผ่านไป"
 laamp_base_contract_schemes.5901.desc.victim_type.fallback: "ข้ารู้จัก [victim.GetHerHim] ในนาม [victim.GetFirstName] ผู้มีอิทธิพลท้องถิ่นที่มีทรัพย์สินเล็กน้อยและเป็นเหยื่อที่เหมาะสม #EMP อย่างยิ่ง#! หากไม่ใช่คนที่รวยที่สุดที่มีอยู่"
 laamp_base_contract_schemes.5901.desc.outro.1: "สายลับของข้าเริ่มปรากฏตัวจากที่ซ่อนของพวกเขา กระวนกระวายใจที่จะกระโจนเข้าใส่เหยื่อรายใหม่นี้"
 laamp_base_contract_schemes.5901.desc.outro.2: "เงาขยับเบาๆ ร่างในชุดคลุมภายใต้คำสั่งของข้าเตรียมพร้อมที่จะพุ่งไปข้างหน้าทุกวินาที"
 laamp_base_contract_schemes.5901.desc.outro.3: "แม้จะแทบมองไม่เห็น ข้าได้ยินเสียงกริชที่ทาน้ำมันอย่างดีถูกชักออกมาทั่วตรอกเล็กๆ"
 laamp_base_contract_schemes.5901.desc.outro.4: "ด้วยหน้ากากที่ปกปิดใบหน้าส่วนใหญ่ เหลือเพียงดวงตาที่มองเห็นได้ สายลับของข้ามองมาที่ข้าเพื่อรอสัญญาณเริ่มต้น"
 laamp_base_contract_schemes.5901.desc.outro.5: "สิ่งที่ข้าต้องทำคือออกคำสั่ง แล้วเจ้าโง่น่าสงสารจะได้เรียนรู้ความหมายของความเสียใจ"
 laamp_base_contract_schemes.5901.tt.muggings_tally_and_max: "#TUT ท่านได้รับการปล้นพิเศษ [scheme.MakeScope.Var('special_muggings_tally').GetValue|0] ครั้ง จากที่เป็นไปได้ [scheme.MakeScope.Var('special_muggings_max').GetValue|0] ครั้ง#!"
 laamp_base_contract_schemes.5901.tt.victim_escapes: "[victim.GetTitledFirstName] หลบหนีไป"
 laamp_base_contract_schemes.5901.a: "เตรียมมีด ทำสิ่งนี้อย่างเงียบเชียบ แต่ชัดเจน"
 laamp_base_contract_schemes.5901.a.tt.success: "ท่านข่มขู่ [victim.GetFirstNameNoTooltip]"
