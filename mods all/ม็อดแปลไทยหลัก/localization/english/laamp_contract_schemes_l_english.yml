 #laamp_base_5021_contract_scheme_desc_general: "$laamp_base_5021_contract_scheme_desc$"
 #laamp_base_5021_contract_scheme_desc_success: "$laamp_contract_scheme_desc_success_boilerplate$"
 #laamp_base_5021_desc_title: "Upstanding sword-hands,"
 #laamp_base_5021_desc: "You are called on for personal guard duty at short notice. You would stand at the shoulder of the [TaskContract.GetEmployer.GetTitleAsNameNoTooltip] of [TaskContract.GetEmployer.GetPrimaryTitle.GetNameNoTier]."

 laamp_base_5031_contract_scheme: "ปล้นปศุสัตว์"
 laamp_base_5031_contract_scheme_action: "ปล้นปศุสัตว์จาก"
 laamp_base_5031_contract_scheme_desc: "ฝูงม้า วัว หรือแม้กระทั่งแพะหรือแกะ: สัตว์ที่ถูกขโมยนั้นทำกำไรได้อย่างเหลือเชื่อสำหรับผู้ที่กล้าพอที่จะเอามันไป และเมื่อ [contractors|E] บางคน ทำให้มันง่ายเสียเหลือเกิน...$laamp_contract_scheme_desc_general_boilerplate$"
 laamp_base_5031_contract_scheme_desc_general: "$laamp_base_5031_contract_scheme_desc$"
 laamp_base_5031_contract_scheme_desc_success: "$laamp_contract_scheme_desc_success_boilerplate$"
 laamp_base_5031_desc_title: "ราษฎรแห่ง [TaskContract.GetEmployer.GetPrimaryTitle.GetNameNoTier],"
 laamp_base_5031_desc: "[TaskContract.GetEmployer.GetTitleAsNameNoTooltip] ของท่านขอย้ำเตือนท่านอีกครั้งว่า การขโมยปศุสัตว์ #EMP จะ#! ถูกลงโทษอย่างรุนแรง ไม่ว่าจำนวนหรือเหตุผลจะเป็น เช่นไร ท่านได้รับการเตือนแล้ว"

 #laamp_base_5041_contract_scheme: "Poach Lands"
 #laamp_base_5041_contract_scheme_action: "Poach from"
 #laamp_base_5041_contract_scheme_desc: "If a [contractor_possessive|E] lands are so abundant that the trimmings from their venison can supply a camp for months, what's so wrong with a few quiet hunts?$laamp_contract_scheme_desc_general_boilerplate$"
 #laamp_base_5041_contract_scheme_desc_general: "$laamp_base_5041_contract_scheme_desc$"
 #laamp_base_5041_contract_scheme_desc_success: "$laamp_contract_scheme_desc_success_boilerplate$"
 #laamp_base_5041_desc_title: "Reprobates, bandits, and thieves,"
 #laamp_base_5041_desc: "The just [TaskContract.GetEmployer.GetTitleAsNameNoTooltip] of [TaskContract.GetEmployer.GetPrimaryTitle.GetNameNoTier] reminds all vagabonds that poaching [TaskContract.GetEmployer.GetCapitalLocation.GetTitle.GetTierAsNameNoTooltip|l] land is strictly forbidden — and punishable by death."

 laamp_base_5051_contract_scheme: "จี้ปล้นพลเมืองผู้มั่งคั่ง"
 laamp_base_5051_contract_scheme_action: "ล่าเหยื่อในหมู่พลเมืองของ"
 laamp_base_5051_contract_scheme_desc: "[contractors|E] ที่มีเมืองหลวงที่มั่งคั่งเป็นพิเศษย่อมสร้าง [courtiers|E] ที่มั่งคั่ง การทุบตีในตรอกซอยช่วยให้ [adventurers|E] สามารถถ่ายโอนความมั่งคั่งนั้นไปยังที่อื่นได้$laamp_contract_scheme_desc_general_boilerplate$"
 laamp_base_5051_contract_scheme_desc_general: "$laamp_base_5051_contract_scheme_desc$"
 laamp_base_5051_contract_scheme_desc_success: "$laamp_contract_scheme_desc_success_boilerplate$"
 laamp_base_5051_desc_title: "พลเมืองดีแห่ง [TaskContract.GetEmployer.GetCapitalLocation.GetTitle.GetBaseNameNoTier],"
 laamp_base_5051_desc: "โปรดระวังว่าเรากำลังประสบ #EMP ภัยพิบัติ#! จากการลักเล็กขโมยน้อย จงพกกระบองที่แข็งแรงติดตัวไปด้วยเมื่อท่านเดินตามถนน และอยู่ แต่ในบ้านหลังมืดค่ำ — [TaskContract.GetEmployer.GetTitleAsName] จะจัดการกับคนชั่วเหล่านี้"

#################################################
 # Base Justicar Scheme Loc

 laamp_base_6001_contract_scheme: "พิทักษ์ผู้บริสุทธิ์"
 laamp_base_6001_contract_scheme_action: "พิทักษ์ราษฎรของ"
 laamp_base_6001_contract_scheme_desc: "ท้องถนนเต็มไปด้วยภยันตราย โจร สัตว์ร้าย และสภาพอากาศเลวร้ายได้ส่งผลกระทบต่อราษฎรของ [contractor_possessive|E] และพวกเขากำลังวิงวอนขอความช่วยเหลือ$laamp_contract_scheme_desc_general_boilerplate$"
 laamp_base_6001_contract_scheme_desc_general: "$laamp_base_6001_contract_scheme_desc$"
 laamp_base_6001_contract_scheme_desc_success: "$laamp_contract_scheme_desc_success_boilerplate$"
 laamp_base_6001_desc_title: "จงพิทักษ์ผู้อ่อนแอ!"
 laamp_base_6001_desc: "ผู้คนทำงานหนักแห่ง [TaskContract.GetEmployer.GetPrimaryTitle.GetNameNoTier] กำลังต้องการความช่วยเหลือ [TaskContract.GetEmployer.GetTitleAsNameNoTooltip] เสนอรางวัลอย่างงามแก่นักผจญภัยผู้มีใจเอื้อเฟื้อ"

 laamp_base_contract_schemes.6001.t: "$laamp_base_6001_contract_scheme$"
 laamp_base_contract_schemes.6001.desc: ""สัตว์ร้าย พวกอันธพาล และคนพาล!"\n\nเพียงแค่ความคิดก็ดูเหมือนจะเพียงพอที่จะรบกวนท่าทีของ [employer.GetTitledFirstNamePossessive]\n\n"สามัญชนแห่ง [employer.GetPrimaryTitle.GetTierAsNameNoTooltip|l] กระสับกระส่ายเสียจนข้าเกรงว่าพวกเขาอาจจับอาวุธขึ้นมาเมื่อใดก็ได้ บรรดาผู้ที่มีครอบครัวเล็ก ๆ ได้ตำหนิเจ้าหน้าที่ของข้า ถามว่าเหตุใดเราจึงไม่ปกป้องพวกเขา""
 laamp_base_contract_schemes.6001.a: "เราต้องรับประกันความปลอดภัยของพวกเขา!"
 laamp_base_contract_schemes.6001.b: "ไม่มีเวลาให้เสียเปล่า"
 laamp_base_contract_schemes.6001.c: "ไม่มีเหตุผลที่จะประนีประนอม"
 
 laamp_base_contract_schemes.6002.t: "$laamp_base_6001_contract_scheme$: สำเร็จ!"
 laamp_base_contract_schemes.6002.desc: "สาม... สี่... และนั่นตัวที่ห้าของ [ROOT.Char.MakeScope.Var('animal_type').GetFlagName] เช้านี้ ข้าวางซากศพลงในเกวียน ทันเวลาพอดีที่ [employer.GetTitledFirstName] จะมาถึงพร้อมกับคนรับใช้บางส่วนของ [employer.GetHerHis]\n\n"ช่างเป็นงานที่ยอดเยี่ยมกระไร!" [employer.GetSheHe] กล่าวชม "ไม่มีวัวควายถูกฆ่าอีกแล้ว ไม่มีเด็กหายอีกต่อไป นี่ รับค่าตอบแทนของท่านไป และหากชาวบ้านร้องเรียนอีกครั้ง ข้าจะรู้ว่าต้องเรียกหาใคร""
 laamp_base_contract_schemes.6002.a: "$laamp_base_contract_schemes.0000.generic_option.proceed.neutral$"
 
 laamp_base_contract_schemes.6003.t: "$laamp_base_6001_contract_scheme$: ล้มเหลว!"
 laamp_base_contract_schemes.6003.desc: ""พอแล้ว!" [employer.GetTitledFirstName] ร้องออกมา สั่นศีรษะของ [employer.GetHerHis] "ข้าไม่เคยเห็นการแสดงกำลังอันน่าสมเพช เช่นนี้เลย นับตั้งแต่เราฝึกเด็กรับใช้ด้วยดาบไม้"\n\n"ผู้คนของข้าทนทุกข์ ไม่ได้รับการปกป้อง ท่านคิดว่าพวกเขาจะจ่ายภาษี เช่นนั้นหรือ?" [employer.GetSheHe] ถามอย่างเย้ยหยัน\n\n"ท่าน ทำให้ข้าเสียทองไปมากพอแล้ว อย่ามา ทำให้ข้าเสียเวลาอีกเลย""
 laamp_base_contract_schemes.6003.a: "$laamp_base_contract_schemes.0000.generic_option.proceed.negative.light$"
 
 laamp_base_6011_contract: "$laamp_base_6011_contract_scheme$"
 laamp_base_6011_contract_scheme: "ช่วยเหลือราษฎรงามผู้หนึ่ง"
 laamp_base_6011_contract_scheme_action: "ช่วยเหลือราษฎรงามของ"
 laamp_base_6011_contract_scheme_desc: "ป่าดงพงไพรไร้ความปรานี จงค้นหาและช่วยเหลือราษฎรผู้อ่อนแอของ [contractor_possessive|E]$laamp_contract_scheme_desc_general_boilerplate$"
 laamp_base_6011_contract_scheme_desc_general: "$laamp_base_6011_contract_scheme_desc$"
 laamp_base_6011_contract_scheme_desc_success: "$laamp_contract_scheme_desc_success_boilerplate$"
 
 laamp_base_6011_desc_title: "[TaskContract.GetEmployer.Custom('KnightCulturePluralNoTooltip')|U] ผู้มีคุณธรรมที่แท้จริง!"
 laamp_base_6011_desc: "นางข้าหลวง/ข้าราชบริพาร ที่งามที่สุดคนหนึ่งของ [TaskContract.GetEmployer.GetTitledFirstNamePossessiveNoTooltip] ยังไม่กลับมาจากการบุกเข้าไปในป่าแห่ง [TaskContract.GetEmployer.GetPrimaryTitle.GetNameNoTier] ราชสำนักของ [TaskContract.GetEmployer.GetTitleAsNamePossessiveNoTooltip] ยินดีมอบรางวัลให้"
 laamp_base_6011_request: "[task_contract|E] นี้ต้องการให้ท่านทำ [scheme|E] ประเภท [GetScheme('laamp_base_6011_contract_scheme').GetTypeName] ให้สำเร็จ"

 laamp_base_contract_schemes.6011.t: "$laamp_base_6011_contract_scheme$"
 laamp_base_contract_schemes.6011.desc: "[employer.GetTitledFirstName] ผู้เหนื่อยล้าเข้าใกล้ค่ายพร้อมกับ [dummy_gender_soldier.GetWomenMen] ของ [employer.GetHerHis] ม้าหยุดอยู่หน้ากระโจมของข้า ขณะที่ข้าลุกขึ้นทักทายพวกเขา\n\n"...เจ้า [dummy_gender.GetWomanMan] บ้าเอ๊ย" ข้าได้ยิน [employer.GetTitleAsNameNoTooltip|l] พึมพำ\n\n"ข้าขอสวัสดีท่านยามเช้า [ROOT.Char.GetFirstNameNoTooltip]" [employer.GetSheHe] กล่าว พลางเช็ดเหงื่อจากหน้าผากของ [employer.GetHerHis] "ดูเหมือนว่า [dummy_gender.GetWomanMan] ที่ #EMP งดงามที่สุด#! คนหนึ่งได้หายตัวไปในป่า และข้าราชบริพารของข้าจะไม่หยุดคร่ำครวญจนกว่าข้าจะนำ [dummy_gender.GetHerHim] กลับมา""
 laamp_base_contract_schemes.6011.a: "[dummy_gender.GetWomanMan] งามหรือ? ข้าจะไปช่วย!"
 laamp_base_contract_schemes.6011.b: "เราต้องเร่งมือ!"
 laamp_base_contract_schemes.6011.c: "แนวทางที่สมดุลคือสิ่งที่ดีที่สุด"
 
 laamp_base_contract_schemes.6012.t: "$laamp_base_6011_contract_scheme$: สำเร็จ!"
 laamp_base_contract_schemes.6012.desc: ""ถอยไป!" เสียงกรีดร้องแหลมสูงดังลอดผ่านพงไม้หนาทึบ และข้าก็ติดตามไป\n\nที่กลางทุ่งโล่งนั้น [beautiful_peasant.GetWomenMen] ผู้เลอโฉมที่สุดคนหนึ่งเท่าที่ข้าเคยพบเห็นยืนอยู่ [beautiful_peasant.GetSheHe|U] ถือไม้ดั่งหอก พยายามรักษาระยะห่างของ[beautiful_peasant.GetHerHis]จาก [ROOT.Char.MakeScope.Var('animal_type').GetFlagName] อันดุร้าย\n\nเพียงตวัดดาบอย่างรวดเร็ว ข้าก็ฟันเข้าที่ร่างของสัตว์ร้าย และมันก็พ่นโลหิตสาดกระเซ็น ย้อมผืนหญ้าจนแดงฉานขณะที่มันล้มลง\n\n""[ROOT.Char.Custom('FormOfAddressForLiege')|U]!" [beautiful_peasant.GetWomanMan] ผู้นั้นร่ำไห้ พลางทรุดเข่าของ[beautiful_peasant.GetHerHis]ลง""
 laamp_base_contract_schemes.6012.a: "$laamp_base_contract_schemes.0000.generic_option.proceed.neutral$"
 laamp_base_contract_schemes.6012.b: ""เรามิต้อง #EMP จำต้อง#! จากกันไป""
 laamp_base_contract_schemes.6012.b.tt.success: "[beautiful_peasant.GetShortUIName] รู้สึกเป็นเกียรติ"
 laamp_base_contract_schemes.6012.b.tt.failure: "[beautiful_peasant.GetShortUIName] รู้สึกถูกดูหมิ่น"
 laamp_base_6012_success_employer_modifier: "ผู้บริสุทธิ์ได้รับการช่วยเหลือ"
 laamp_base_6012_success_employer_modifier_desc: "ตัวละครนี้ได้จ่ายเงินให้นักผจญภัยผู้กล้าหาญเพื่อช่วยเหลือราษฎรที่งามกว่าคนหนึ่งของตนจากสัตว์ร้าย"
 
 laamp_base_contract_schemes.6013.t: "$laamp_base_6011_contract_scheme$: ล้มเหลว!"
 laamp_base_contract_schemes.6013.desc: ""ท่านช่วยอธิบายได้ไหมว่านี่คืออะไร?" [employer.GetTitledFirstName] บุกเข้ามาในกระโจมของข้า โยนผ้าเช็ดหน้าที่เปื้อนเลือดสีแดงลงบนโต๊ะของข้า\n\n"ยามพบมันขณะลาดตระเวนในป่า และมันมีตราสัญลักษณ์ที่ข้าคิดว่าท่านคงคุ้นเคย" [employer.GetSheHe|U] ถูคิ้วของ [employer.GetHerHis] "ตอนนี้ข้าต้องรับมือกับข้าราชบริพารที่กระสับกระส่าย และเจ้าหน้าที่ที่ใจสลาย อย่าหวังว่าจะได้รับค่าตอบแทนเต็มจำนวน""
 laamp_base_contract_schemes.6013.a: "$laamp_base_contract_schemes.0000.generic_option.proceed.negative.light$"
 
 laamp_base_6021_contract: "$laamp_base_6021_contract_scheme$"
 laamp_base_6021_contract_scheme: "ร่วมแสดงในบทละคร"
 laamp_base_6021_contract_scheme_action: "ร่วมแสดงในบทละครของ"
 laamp_base_6021_contract_scheme_desc: "ผู้คนกระตือรือร้นที่จะได้พบกับอัศวิน #EMP ตัวจริง#! [contractor|E] กำลังต้องการวีรบุรุษตัวจริง$laamp_contract_scheme_desc_general_boilerplate$"
 laamp_base_6021_contract_scheme_desc_general: "$laamp_base_6021_contract_scheme_desc$"
 laamp_base_6021_contract_scheme_desc_success: "$laamp_contract_scheme_desc_success_boilerplate$"
 laamp_base_6021_request: "[task_contract|E] นี้ต้องการให้ท่านทำ [scheme|E] ประเภท [GetScheme('laamp_base_6021_contract_scheme').GetTypeName] ให้สำเร็จ"
 
 laamp_base_6021_desc_title: "กำลังตามหาวีรบุรุษ,"
 laamp_base_6021_desc: "ผู้คนแห่ง [TaskContract.GetEmployer.GetPrimaryTitle.GetNameNoTier] กำลังจัดการแสดงละครที่เลียนแบบนิทานวีรบุรุษเก่าแก่ [TaskContract.GetEmployer.GetTitledFirstNameNoTooltip] กำลังสิ้นหวังที่จะหาอัศวินผู้กล้าหาญที่จะตอบสนองความต้องการของพวกเขา"
 laamp_base_contract_schemes.6021.t: "$laamp_base_6021_contract_scheme$"
 laamp_base_contract_schemes.6021.desc.intro: "จัตุรัสตลาดแห่ง [ROOT.Char.GetCurrentLocation.GetName] คึกคักกว่าที่เคย มีคณะนักร้องกำลังเตรียมการ\n\n"ดาบ #EMP ไม้#! เหรอ?" เด็กคนหนึ่งเอนตัวข้ามเวที ทำหน้าเบ้ด้วยความรังเกียจ\n\n"
 laamp_base_contract_schemes.6021.desc.employer_child: ""[employer_child.GetFirstName] พอแล้ว" [employer.GetTitledFirstName] กระตุ้นให้ [employer_child.GetHerHim] กลับไปอยู่ข้าง [employer.GetHerHis] "ข้าบอกแล้วว่าจะหาวีรบุรุษตัวจริงมาให้สำหรับการแสดง และ... ดูสิว่าใครเพิ่งมาถึง" [employer.GetFirstNameNoTooltip] มองตรงมาที่ข้า"
 laamp_base_contract_schemes.6021.desc.random_child: "ชาวบ้านที่ตื่นตัวรีบเข้าร่วมกับ [dummy_gender.GetHerHim]: "นี่คือสิ่งที่ดีที่สุดที่ท่าน [employer.GetLadyLord]ship ของเรามีให้หรือ?"\n\nแต่เสียงพึมพำก็เงียบลงทันทีที่ [employer.GetTitledFirstName] เข้ามาในจัตุรัส หยุดม้าของ [employer.GetHerHis] ตรงหน้าข้า:"
 laamp_base_contract_schemes.6021.desc.outro: ""เป็นลาภลอยง่าย ๆ ใช่ไหมล่ะ? ท่านเพียงแค่ต้องสร้างความประทับใจให้ชาวบ้านเหล่านี้""
 laamp_base_contract_schemes.6021.a: "ทำให้มันเป็นลาภลอยที่ #EMP ง่ายที่สุด#! กันเถอะ"
 laamp_base_contract_schemes.6021.b: "ยิ่งเร็วยิ่งดี"
 laamp_base_contract_schemes.6021.c: "นี่น่าจะสนุก..."
 
 laamp_base_contract_schemes.6022_6023.common_desc: ""...และแล้ว [ROOT.Char.GetSheHe] ก็สังหาร [ROOT.Char.MakeScope.Var('animal_type').GetFlagName] ที่ดุร้าย!" เสียงกลองดังกระหึ่มขึ้นขณะที่ข้าเดินผ่านเวที พยายามนึกถึงบทละครทุกเรื่องที่ข้าเคยดูมา ด้วยอาวุธที่ชูขึ้นเหนือศีรษะ ข้าโจมตีหุ่นเชิดสีสันสดใส\n\n"
 
 laamp_base_contract_schemes.6022.t: "$laamp_base_6021_contract_scheme$: สำเร็จ!"
 laamp_base_contract_schemes.6022.desc: "$laamp_base_contract_schemes.6022_6023.common_desc$หัวหุ่นกลิ้งตกเวทีและผู้ชมก็โห่ร้องเสียงดังลั่น นั่งอยู่บนเวทีที่ยกสูง [employer.GetTitledFirstName] พยักหน้า"
 laamp_base_contract_schemes.6022.a: "$laamp_base_contract_schemes.0000.generic_option.proceed.neutral$"
 laamp_base_6021_success_employer_modifier: "บทละครวีรกรรมอัศวิน"
 laamp_base_6021_success_employer_modifier_desc: "ตัวละครนี้ได้อุปถัมภ์นักผจญภัยพเนจรให้ร่วมแสดงในบทละครและสนองความต้องการของฝูงชน"
 
 laamp_base_contract_schemes.6023.t: "$laamp_base_6021_contract_scheme$: ล้มเหลว!"
 laamp_base_contract_schemes.6023.desc: "$laamp_base_contract_schemes.6022_6023.common_desc$ข้าพลาดการโจมตีและดาบของข้าติดอยู่ในเนื้อไม้ ผู้ชมหัวเราะลั่น แต่ไม่นานความผิดหวังก็เข้ามาแทนที่\n\nข้าเหลือบมองไปยังเวทีที่ยกสูง และพบ [employer.GetTitledFirstName] กำลังสั่นศีรษะของ [employer.GetHerHis]"
 laamp_base_contract_schemes.6023.a: "$laamp_base_contract_schemes.0000.generic_option.proceed.negative.light$"
 
 laamp_base_6031_contract: "$laamp_base_6031_contract_scheme$"
 laamp_base_6031_contract_scheme: "กระทำการท้าประลอง ณ จุดสำคัญ"
 laamp_base_6031_contract_scheme_action: "กระทำการท้าประลอง ณ จุดสำคัญให้แก่"
 laamp_base_6031_contract_scheme_desc: "ต้องการนักผจญภัยผู้กล้าหาญเพื่อป้องกันทางผ่านสะพาน [contractor|E] เสนอรางวัลอย่างงาม$laamp_contract_scheme_desc_general_boilerplate$"
 laamp_base_6031_contract_scheme_desc_general: "$laamp_base_6031_contract_scheme_desc$"
 laamp_base_6031_contract_scheme_desc_success: "$laamp_contract_scheme_desc_success_boilerplate$"
 laamp_base_6031_request: "[task_contract|E] นี้ต้องการให้ท่านทำ [scheme|E] ประเภท [GetScheme('laamp_base_6031_contract_scheme').GetTypeName] ให้สำเร็จ"
 
 laamp_base_6031_desc_title: "หากท่านเป็นผู้แข็งแกร่ง: จงฟัง!"
 laamp_base_6031_desc: "สะพานแห่ง [TaskContract.GetEmployer.GetPrimaryTitle.GetNameNoTier] ยังคงไร้การป้องกัน จำเป็นต้องแสดงแสนยานุภาพเพื่อขับไล่โจรออกไป [TaskContract.GetEmployer.GetTitledFirstNameNoTooltip] จะให้รางวัลแก่ผู้ใดก็ตามที่ ทำให้พวกมันเปลี่ยนใจ"
 laamp_base_contract_schemes.6031.t: "$laamp_base_6031_contract_scheme$"
 laamp_base_contract_schemes.6031.desc: "[employer.GetTitledFirstName] [ROOT.Char.Custom2('QuirkPresentPosOrNeg', SCOPE.sC('employer'))] ขณะที่[employer.GetSheHe]หาทางของ[employer.GetHerHis]เดินผ่านค่ายพัก\n\n\"ช่างเป็นเช้าที่วิเศษนัก\" [employer.GetSheHe] เริ่มกล่าว \"เป็นโอกาสอันดีที่จะแสดงให้เหล่าอันธพาลเหล่านั้นเห็นคุณค่าของ $knight_culture_player_no_tooltip$ ที่แท้จริง เจ้าเห็นหรือไม่ มีสะพานทอดตรงไปยัง [ROOT.Char.GetCurrentLocation.GetName] พวกเหล่าร้าย คนโฉดเขลา และคนโง่งมทุกประเภทมักจะสุมหัวกันอยู่ที่นั่น\"\n\n\"ควรมีใครสักคนจัดการเรื่องนั้นเสีย\""
 laamp_base_contract_schemes.6031.a: "ข้าจะหักทวนสามร้อยเล่ม!"
 laamp_base_contract_schemes.6031.b: "คงใช้เวลาสองสามวัน"
 laamp_base_contract_schemes.6031.c: "มุ่งสู่สะพาน!"
 
 laamp_base_contract_schemes.6032.t: "$laamp_base_6031_contract_scheme$: สำเร็จ!"
 laamp_base_contract_schemes.6032.desc: "หอบหายใจ ข้าตบหลังม้าของข้าเบา ๆ ใจเย็น ๆ ตอนนี้ มันจบแล้ว\n\nการเฝ้าสะพานนี้กลายเป็นภารกิจเดียวของข้าตลอดสองสัปดาห์ที่ผ่านมา ชุดเกราะส่องประกายใต้แสงจันทร์ กองทวนหักที่ถูกดันไปไว้ข้างหนึ่งเป็นเครื่องพิสูจน์ถึงผลงานของข้า\n\n"[ROOT.Char.GetFirstNameNoTooltip]" [employer.GetTitledFirstName] ทักทายข้า พลางส่ง [dummy_soldier.GetWomenMen] บางส่วนของ [employer.GetHerHis] ไปเก็บของริบ "ช่างเป็นภาพที่น่าดูเสียนี่กระไร""
 laamp_base_contract_schemes.6032.a: "$laamp_base_contract_schemes.0000.generic_option.proceed.neutral$"
 
 laamp_base_contract_schemes.6033.t: "$laamp_base_6031_contract_scheme$: ล้มเหลว!"
 laamp_base_contract_schemes.6033.desc: "#EMP "อ๊ากกกกก!"#!\n\nข้าล้มลงคุกเข่า เลือดไหลลงมาตามข้อศอก\n\n"ปล่อย [ROOT.Char.GetHerHim] ไว้ตรงนั้น" ข้าได้ยินโจรคนหนึ่งพึมพำก่อนที่พวกเขาจะจากไป "ไม่มีประโยชน์ที่จะสู้กับ #EMP $knight_culture_player_no_tooltip$#! หรอก เดี๋ยวก็มีคนมาเก็บ [ROOT.Char.GetHerHim] ไปเอง"\n\nศีรษะของข้า... ทุกอย่างค่อย ๆ เลือนหายไป"
 laamp_base_contract_schemes.6033.a: "$laamp_base_contract_schemes.0000.generic_option.proceed.negative.light$"

 #################################################
 # Base Diplo Scheme Events

 laamp_base_contract_schemes.0001.t: "การสร้างความบันเทิงแก่ราชสำนักของ [employer.GetTitledFirstNamePossessiveNoTooltip]"
 laamp_base_contract_schemes.0001.desc: "ไม่ใช่เรื่องแปลกที่ผู้ปกครองผู้ตั้งหลักปักฐาน เช่น [employer.GetFirstName] จะเป็นเจ้าภาพต้อนรับนักเดินทางผู้มีชื่อเสียง เช่นข้า — เพื่อแลกกับของกำนัลเล็กน้อยและที่พักอันเหมาะสม [ROOT.Char.Custom('GetLaampDescribeTypeSelfPlural')] เฉก เช่นเราก็มอบความบันเทิง ข้อมูลข่าวสาร และสิ่งเบี่ยงเบนความสนใจที่เหมาะสมแก่ข้าราชบริพารจำนวนมากของ [employer.GetHerHis]\n\nแน่นอน นั่น #EMP ต่อเมื่อ#! [ROOT.Char.Custom('GetCourtierTypePlural')|l] ของข้าและตัวข้าสามารถหาเลี้ยงชีพได้ด้วยเรื่องเล่าของเรา"
 laamp_base_contract_schemes.0001.a: "$laamp_base_contract_schemes.0000.generic_option.success_chance$"
 laamp_base_contract_schemes.0001.b: "$laamp_base_contract_schemes.0000.generic_option.speed$"
 laamp_base_contract_schemes.0001.c: "$laamp_base_contract_schemes.0000.generic_option.progress$"
 laamp_base_contract_schemes.0001.d: "$laamp_base_contract_schemes.0000.generic_option.nothing$"
 laamp_base_contract_schemes.0001.d.tt: "$laamp_base_contract_schemes.0000.d.no_starting_bonus$"

 laamp_base_contract_schemes.0002.t: "$laamp_base_contract_schemes.0001.t$: สำเร็จ!"
 laamp_base_contract_schemes.0002.desc: "ข้าราชบริพารของ [employer.GetFirstNamePossessive] แทบจะหลงใหลคณะของข้าและตัวข้าในช่วงหลายเดือนที่ผ่านมา\n\nวันแล้ววันเล่า คืนแล้วคืนเล่า เราได้เติมเต็มศีรษะของพวกเขาด้วยเรื่องราวอันน่าอัศจรรย์และเติมเต็มท้องของเราด้วยอาหารเลิศรส ทำให้ [employer.GetTitleAsNameNoTooltip] ผู้ดีงามพึงพอใจกับการแสดงของเรายิ่งนัก\n\nกระนั้น ทุกสิ่งที่ดีงามย่อมมีวันสิ้นสุด และเป็นการดีที่สุดที่เราจะจากไป ในขณะที่ยังเป็นที่ชื่นชม"
 laamp_base_contract_schemes.0002.a: "$laamp_base_contract_schemes.0000.generic_option.proceed.neutral$"

 laamp_base_contract_schemes.0003.t: "$laamp_base_contract_schemes.0001.t$: ล้มเหลว!"
 laamp_base_contract_schemes.0003.desc: "เจ้าพวกเดรัจฉานโง่เขลาเหล่านี้! พวกมันเชิญเรามาที่นี่ ไม่ได้จัดหาอะไรให้เลยนอกจาก #EMP อาหารเดน#! สำหรับมื้ออาหาร ที่นอนทำจากฟางที่เก่าคร่ำคร่าตั้งแต่สมัยปู่ย่าตายาย/[ROOT.Char.GetMotherFather] ของข้ายังเยาว์วัย และคอยจิกกัดเรื่องเล่าริมทางของเราทุกเรื่อง\n\nการต้อนรับขับสู้ที่แสดงออกมา... ก็ แค่ก การต้อนรับขับสู้อะไรกัน?\n\nทั้งหมดนี้สูญเปล่า [employer.GetTitledFirstName] โกรธจัด และเห็นได้ชัดว่าสิ่งเดียวที่ ทำให้เรายังไม่อยู่ในคุกใต้ดินคือความรู้สึกที่ว่ามันคงจะลำบากเกินกว่าจะคุ้มค่า\n\nเวลาของเราใน [employer.GetCapitalLocation.GetTitle.GetNameNoTier] สิ้นสุดลงแล้ว"
 laamp_base_contract_schemes.0003.a: "$laamp_base_contract_schemes.0000.generic_option.proceed.negative.light$"

 laamp_base_contract_schemes.0011.t: "การปรับปรุงชื่อเสียงของ [employer.GetTitleAsNamePossessiveNoTooltip]"
 laamp_base_contract_schemes.0011.desc: "ไม่ใช่ความลับที่ชื่อเสียงของ [employer.GetTitledFirstNamePossessive] ไม่ได้ดีเท่าที่ควรจะเป็น เจ้าประเทศราชที่ไม่พอใจ เสียงพึมพำน่ากังวลเกี่ยวกับพฤติกรรมเยี่ยงทรราช การขาดแคลนเกียรติภูมิที่จับต้องไม่ได้ — ล้วนเป็นสัญญาณที่ชี้ให้เห็นถึงการกุมอำนาจที่สั่นคลอนกว่าที่ [employer.Custom('LadiesLords')] ส่วนใหญ่ต้องการ\n\nการจ่ายเงินให้ใครสักคนเพื่อแก้ไขความเข้าใจผิดดังกล่าวย่อมไม่ถูกแน่นอน อย่างน้อยก็หากข้ามีสิทธิ์ออกความเห็น"
 laamp_base_contract_schemes.0011.a: "$laamp_base_contract_schemes.0000.generic_option.success_chance$"
 laamp_base_contract_schemes.0011.b: "$laamp_base_contract_schemes.0000.generic_option.speed$"
 laamp_base_contract_schemes.0011.c: "$laamp_base_contract_schemes.0000.generic_option.progress$"
 laamp_base_contract_schemes.0011.d: "$laamp_base_contract_schemes.0000.generic_option.nothing$"
 laamp_base_contract_schemes.0011.d.tt: "$laamp_base_contract_schemes.0000.d.no_starting_bonus$"

 laamp_base_contract_schemes.0012.t: "$laamp_base_contract_schemes.0011.t$: สำเร็จ!"
 laamp_base_contract_schemes.0012.desc: "น่าประหลาดใจที่คำพูดเล็ก ๆ น้อย ๆ ในมุมเงียบ ๆ เพียงไม่กี่คำสามารถเปลี่ยนแปลงสถานการณ์ได้มากเพียงใด เสียงกระซิบที่นี่ ความคิดเห็นที่นั่น การปกป้องการกระทำในมื้อค่ำ...\n\nแน่นอนว่ามันคงไม่มีความหมายเกือบเท่ากันหากมาจากผู้มีอำนาจในที่ดิน มีอำนาจมากเกินไป มีเดิมพันสูงเกินไป เสี่ยงต่อความไม่จริงใจมากเกินไป — แต่ [ROOT.Char.Custom('GetLaampDescribeTypeSelf')] ผู้ต่ำต้อย ที่แวะพักที่ราชสำนักชั่วครู่ขณะที่ [ROOT.Char.GetSheHe] และคณะของ [ROOT.Char.GetHerHis] เดินทางไปทั่วโลก อืม\n\nตอนนี้นั่นเป็นเกมที่แตกต่างไปโดยสิ้นเชิง\n\nมิต้องสงสัย [employer.GetTitledFirstName] พอใจกับความพยายามของเรายิ่งนัก และเราต้องเดินทางต่อไป"
 laamp_base_contract_schemes.0012.a: "$laamp_base_contract_schemes.0000.generic_option.proceed.neutral$"

 laamp_base_contract_schemes.0013.t: "$laamp_base_contract_schemes.0011.t$: ล้มเหลว!"
 laamp_base_contract_schemes.0013.desc: "ข้าควรจะทำสำเร็จได้อย่างไร #EMP กัน#!? [ROOT.Char.Custom('GetLaampDescribeTypeSelf')] พเนจรที่ไม่มีอิทธิพลต่อผู้คนหรือขุนนาง\n\nมันเป็นภารกิจที่ไร้สาระที่มอบหมายให้ข้า แต่ [employer.GetTitledFirstName] ดูเหมือนจะมุ่งมั่นที่จะให้ #EMP ข้า#! รับผิดชอบต่อความล้มเหลวที่ผู้คนของ [employer.GetHerHis] โยนความผิดให้ [employer.GetHerHim] สำหรับการดูหมิ่นที่จินตนาการขึ้นและการใช้อำนาจในทางที่ผิดตามทฤษฎี\n\n[employer.GetCapitalLocation.GetTitle.GetNameNoTier] ไม่ใช่สถานที่ปลอดภัยสำหรับคณะของข้าอีกต่อไป"
 laamp_base_contract_schemes.0013.a: "$laamp_base_contract_schemes.0000.generic_option.proceed.negative.light$"

 laamp_base_contract_schemes.0021.t: "การผูกมิตรกับผู้สูงศักดิ์"
 laamp_base_contract_schemes.0021.desc: "[employer.GetTitledFirstName] เป็น [employer.GetWomanMan] ที่โดดเดี่ยวในตำแหน่งที่มีอำนาจ ทำให้เป็นเรื่องยากอย่างยิ่งยวดสำหรับ [employer.GetHerHim] ที่จะพบปะผู้คนที่ไม่ #EMP ต้องการ#! อะไรจาก [employer.GetHerHim]\n\nมิตรภาพของข้าควรจะแตกต่างออกไป เป็นโอกาสที่จะสร้างความสัมพันธ์ที่แท้จริง แน่นอนว่ามันไม่ใช่ — ข้าต้องการมากเท่าหรือมากกว่าผู้ติดตามคนอื่น ๆ — แต่มันเป็นจินตนาการที่ดีที่จะเชื่อไปชั่วขณะ\n\n[ROOT.Char.Custom('GetCourtierTypePlural')|l] ของข้าและตัวข้าจะจากไปก่อนที่ [employer.GetSheHe] จะสงสัยอะไร"
 laamp_base_contract_schemes.0021.a: "$laamp_base_contract_schemes.0000.generic_option.success_chance$"
 laamp_base_contract_schemes.0021.b: "$laamp_base_contract_schemes.0000.generic_option.speed$"
 laamp_base_contract_schemes.0021.c: "$laamp_base_contract_schemes.0000.generic_option.progress$"
 laamp_base_contract_schemes.0021.d: "$laamp_base_contract_schemes.0000.generic_option.nothing$"
 laamp_base_contract_schemes.0021.d.tt: "$laamp_base_contract_schemes.0000.d.no_starting_bonus$"

 laamp_base_contract_schemes.0022.t: "$laamp_base_contract_schemes.0021.t$: สำเร็จ!"
 laamp_base_contract_schemes.0022.desc: "โดยธรรมชาติแล้ว [employer.GetTitledFirstName] ตกหลุมเสน่ห์ของข้า หลงใหลในบทเพลงแห่งพงไพรและชีวิตอันโรแมนติกของ [ROOT.Char.Custom('GetLaampDescribeTypeSelf')] พเนจร เช่นเดียวกับที่ข้ารู้อยู่แล้วว่า [employer.GetSheHe] จะเป็น\n\nในที่สุดเราก็เตรียมตัวจากไป [employer.GetFirstNameNoTooltip] เศร้าใจที่เห็นเราจากไป แต่ก็ดีใจสำหรับการพักผ่อนเล็กน้อยที่มิตรภาพของเรามอบให้ [employer.GetHerHim]\n\nแน่นอนว่าไม่ใช่เรื่องฝ่ายเดียว ข้าได้รับค่าตอบแทนอันมั่งคั่งเป็นของขวัญและเสบียงสำหรับคณะ มากเกินพอที่จะชดเชยเวลาที่เราใช้ไปกับการโอ้เอ้ที่นี่"
 laamp_base_contract_schemes.0022.a: "$laamp_base_contract_schemes.0000.generic_option.proceed.neutral$"

 laamp_base_contract_schemes.0023.t: "$laamp_base_contract_schemes.0021.t$: ล้มเหลว!"
 laamp_base_contract_schemes.0023.desc: "บางที... บางที [employer.GetTitledFirstName] อาจไม่ได้อ้างว้างถึงเพียงนั้นกระมัง? แน่ล่ะ [employer.GetSheHe] ดูไม่ต้องการสหาย เช่น #EMP ข้า#! ผู้เป็น " [ROOT.Char.Custom('GetLaampDescribeTypeInsult')] โสโครกเหม็นคลุ้ง ผู้มีรูปร่าง [ROOT.Char.Custom2('InsultAdjective', SCOPE.sC('employer'))] เยี่ยงอาชญากร"\n\nช่างกล้านัก เชิญข้ามาอยู่ด้วยแล้วกลับปฏิบัติต่อข้า... เยี่ยง #EMP นี้#! กล่าวได้ว่าช่างไร้มารยาท และไม่คู่ควรกับ [employer.GetWomanMan] ที่อ้างตนว่าสูงศักดิ์เลยแม้ แต่น้อย\n\nมิต้องสงสัยเลยว่า ข้าจะไม่ได้รับค่าจ้าง และคณะของข้ากับข้ามีเวลาจนถึงค่ำเพื่อออกจาก [employer.GetCapitalLocation.GetTitle.GetNameNoTier]"
 laamp_base_contract_schemes.0023.a: "$laamp_base_contract_schemes.0000.generic_option.proceed.negative.light$"

 laamp_base_contract_schemes.0031.t: "ผู้เป็นกลาง"
 laamp_base_contract_schemes.0031.desc: "การทะเลาะวิวาทไม่รู้จบของชาวบ้านผู้น้อยเป็นหนึ่งในไม่กี่ประสบการณ์ที่ทั้งผู้ปกครองโลกและ [ROOT.Char.Custom('GetLaampDescribeTypeSelfPlural')] เช่นข้ามีร่วมกัน\n\nมันมากพอที่จะ ทำให้ [employer.GetWomanMan] บ้าคลั่ง หรืออย่างน้อยก็ ทำให้ [employer.GetHerHim] หงุดหงิดจน [employer.GetSheHe] หันไปหาคนนอกเพื่อขอความช่วยเหลือ — ซึ่งเป็นสิ่งที่ [employer.GetTitledFirstName] ได้ทำลงไปแล้ว\n\nหาก [ROOT.Char.Custom('GetCourtierTypePlural')|l] ของข้าและตัวข้าสามารถ ทำให้ราษฎรที่โกรธแค้นยิ่งกว่าบางคนของ [employer.GetHerHis] สงบลงได้ เราจะได้รับค่าตอบแทนอย่างงาม"
 laamp_base_contract_schemes.0031.a: "$laamp_base_contract_schemes.0000.generic_option.success_chance$"
 laamp_base_contract_schemes.0031.b: "$laamp_base_contract_schemes.0000.generic_option.speed$"
 laamp_base_contract_schemes.0031.c: "$laamp_base_contract_schemes.0000.generic_option.progress$"
 laamp_base_contract_schemes.0031.d: "$laamp_base_contract_schemes.0000.generic_option.nothing$"
 laamp_base_contract_schemes.0031.d.tt: "$laamp_base_contract_schemes.0000.d.no_starting_bonus$"

 laamp_base_contract_schemes.0032.t: "$laamp_base_contract_schemes.0031.t$: สำเร็จ!"
 laamp_base_contract_schemes.0032.desc: "ปัญหาท้องถิ่นคือปัญหาเล็กน้อย ไม่ใช่สำหรับผู้ที่เกี่ยวข้องแน่นอน แต่สำหรับคนนอกที่ไม่มีส่วนได้ส่วนเสียในการทะเลาะวิวาทที่ไม่สิ้นสุดของพวกเขา โดยทั่วไปแล้วสามารถแก้ไขได้อย่างยอดเยี่ยม\n\nข้าไม่สามารถพูดได้ว่าข้า ทำให้ #EMP ทุกคน#! พอใจ แต่นั่นไม่ใช่งานของข้า แค่ ทำให้พวกเขาสงบลงพอที่จะ ทำให้ [employer.GetTitledFirstName] มีความสุข และ [employer.GetSheHe] ก็มีความสุข — มากพอที่จะเปิดกระเป๋าเงินของ [employer.GetHerHis] ไม่ว่า อย่างไรก็ตาม\n\nเป็นงานที่ทำได้ดี"
 laamp_base_contract_schemes.0032.a: "$laamp_base_contract_schemes.0000.generic_option.proceed.neutral$"

 laamp_base_contract_schemes.0033.t: "$laamp_base_contract_schemes.0031.t$: ล้มเหลว!"
 laamp_base_contract_schemes.0033.desc: "เจ้าพวกนรกโง่เขลาเหล่านี้ช่างเป็นไปไม่ได้โดยสิ้นเชิง!\n\nไม่มี [ROOT.Char.GetWomanMan] คนใดที่ยังมีชีวิตอยู่สามารถแก้ไขรายการปัญหา ความบาดหมาง และข้อพิพาทเรื่องเขตแดนที่ไม่สิ้นสุดของพวกเขาได้ ข้าคือ [ROOT.Char.Custom('GetLaampDescribeTypeSelfArticle')] [ROOT.Char.Custom('GetLaampDescribeTypeSelf')] ให้ตายสิ ไม่ใช่ข้าราชการชั้นผู้น้อยบางคน แน่นอนว่า [employer.GetTitledFirstName] ไม่สนใจชะตากรรมของข้ามากนัก เท่าที่ [employer.GetSheHe] กังวล นี่เป็นเพียงความล้มเหลวของทักษะและไม่มีอะไรอื่น\n\n"บางทีถ้าท่านมีความสามารถมากกว่านี้ ท่านคงจะได้รับค่าจ้าง แต่ท่านไม่มี ดังนั้นท่านจึงไม่ได้รับ ตอนนี้ออกไป""
 laamp_base_contract_schemes.0033.a: "$laamp_base_contract_schemes.0000.generic_option.proceed.negative.light$"

 laamp_base_contract_schemes.0034.t: "$laamp_base_contract_schemes.0031.t$: การออกเดินทาง"
 laamp_base_contract_schemes.0034.desc: "ด้วยหนังสือมอบอำนาจของ [employer.GetTitledFirstNamePossessive] ในมือ เราจึงออกเดินทาง\n\nการเดินทางจะพาเราไปยัง [destination_3.GetNameNoTier] จากนั้นต่อไปยัง [destination_2.GetNameNoTier] ก่อนจะกลับมายัง [destination_1.GetNameNoTier] ในที่สุด\n\nคำถามเดียวที่เหลืออยู่คือ เราต้องการเดินทางแบบเบา ๆ หรือเดินทางเต็มรูปแบบ"
 laamp_base_contract_schemes.0034.tt.explanation: "#TUT เพื่อทำ [task_contract|E] ให้สำเร็จ:\n$EFFECT_LIST_BULLET$ผ่านบททดสอบ [skill|E] ณ จุดหมายปลายทางแต่ละแห่ง\n$EFFECT_LIST_BULLET$ท่านต้องชนะบททดสอบสองครั้งเพื่อผลลัพธ์ $label_success_standard$\n$EFFECT_LIST_BULLET$หากท่านชนะบททดสอบทั้งสามครั้ง ท่านจะได้รับผลลัพธ์ $label_success_critical$\n$EFFECT_LIST_BULLET$@warning_icon! #N การล้มเหลวในบททดสอบ ณ จุดใดจุดหนึ่ง จะทำให้ $game_concept_task_contract$ ล้มเหลว#!\n$EFFECT_LIST_BULLET$@alert_icon! #alert_trial ท่านสามารถทดสอบแต่ละ [skill|E] ได้เพียงครั้งเดียวต่อ [task_contract|E]#!"
 laamp_base_contract_schemes.0034.tt.destination_list: "ท่านจะเริ่ม [traveling|E] ไปยัง [destination_3.GetNameNoTier] ทันที จากนั้นไปยัง [destination_2.GetNameNoTier] แล้วไปยัง [destination_1.GetNameNoTier]"
 laamp_base_contract_schemes.0034.a: "$travel.stationary_domicile.option.t$"
 laamp_base_contract_schemes.0034.b: "$travel.mobile_domicile.option.t$"

 laamp_base_contract_schemes.0041.t: "เชื่อใจข้า"
 laamp_base_contract_schemes.0041.desc: "[employer.GetFirstName] ผู้น่าสงสารและเชื่อง่าง่าย: [employer.GetSheHe] อาจเป็น [employer.GetTitleAsNameNoTooltip] แต่ [employer.GetSheHe] ไม่ได้ฉลาดไปกว่านักเลงขี้เมาในโรงเตี๊ยมห่างไกลโดยเฉลี่ย เพียงแค่ร่ำรวยกว่าเท่านั้น\n\nคำเชิญเปิดสำหรับนักเดินทางผู้มีชื่อเสียงให้มาพักกับครัวเรือนของ [employer.GetHerHis] ชั่วระยะเวลาหนึ่งเป็นโอกาสทั้งหมดที่ [ROOT.Char.Custom('GetCourtierTypePlural')|l] ของข้าและตัวข้าต้องการ และก่อนที่ [employer.GetSheHe] จะรู้ตัว ทรัพย์สมบัติของ [employer.GetTitleAsNamePossessiveNoTooltip] ผู้ดีงามก็จะอยู่ในกระเป๋าของข้า และเราก็จะจากไป"
 laamp_base_contract_schemes.0041.a: "$laamp_base_contract_schemes.0000.generic_option.success_chance$"
 laamp_base_contract_schemes.0041.b: "$laamp_base_contract_schemes.0000.generic_option.speed$"
 laamp_base_contract_schemes.0041.c: "$laamp_base_contract_schemes.0000.generic_option.progress$"
 laamp_base_contract_schemes.0041.d: "$laamp_base_contract_schemes.0000.generic_option.nothing$"
 laamp_base_contract_schemes.0041.d.tt: "$laamp_base_contract_schemes.0000.d.no_starting_bonus$"

 laamp_base_contract_schemes.0042.t: "$laamp_base_contract_schemes.0041.t$: สำเร็จ!"
 laamp_base_contract_schemes.0042.desc: "ช่างเป็นของขวัญที่น่ารักอะไร เช่นนี้ที่ [employer.GetTitledFirstName] มอบให้ เมื่อ [employer.GetSheHe] อารมณ์ดี! เป็นผลตอบแทนที่คุ้มค่ามากสำหรับเวลาของข้า แม้ว่าน่าเศร้าที่ #EMP บางที#! อาจไม่คุ้มค่าสำหรับ [employer.GetHerHis]\n\nอ่า ช่างเถอะ ช่วยไม่ได้ คนโง่กับเงินของ [employer.GetHerHis] และอะไรทำนองนั้น\n\nแน่นอนว่า [employer.GetSheHe] จะรู้ตัวในไม่ช้า หรือใครบางคนจะสามารถอธิบายสิ่งที่เกิดขึ้นกับ [employer.GetTitleAsNameNoTooltip|l] ผู้ดีงามได้ในที่สุด แต่มันไม่สำคัญ เราได้ส่วนของเราแล้วและจะจากไปก่อนรุ่งสาง"
 laamp_base_contract_schemes.0042.a: "$laamp_base_contract_schemes.0000.generic_option.proceed.neutral$"

 laamp_base_contract_schemes.0043.t: "$laamp_base_contract_schemes.0041.t$: ล้มเหลว!"
 laamp_base_contract_schemes.0043.desc: "[employer.GetTitledFirstName] ไม่ได้เชื่องช้าอย่างที่ [employer.GetSheHe] ดูเป็น! ข้าไม่รู้ว่าอะไร ทำให้ความลับแตก — การเหลือบมองผิดที่ วลีที่น่าสงสัย การยิ้มเยาะผิดเวลา — แต่ [employer.GetSheHe] รู้ทันเราแล้ว\n\nจะไม่มีเหรียญใด ๆ จาก [employer.GetWomanMan] ผู้นี้ และไม่มีที่พักอีกต่อไป\n\nไม่เหมือน [employer.GetFirstNameNoTooltip] ข้าไม่ใช่คนโง่ และข้าสามารถเห็นได้เมื่อลมเปลี่ยนทิศต้านข้า; [ROOT.Char.Custom('GetCourtierTypePlural')|l] ของข้าและตัวข้าจะรีบหนีออกจาก [employer.GetCapitalLocation.GetTitle.GetNameNoTier] ภายในหนึ่งชั่วโมง"
 laamp_base_contract_schemes.0043.a: "$laamp_base_contract_schemes.0000.generic_option.proceed.negative.light$"

 #################################################
 # Base Martial Scheme Events

 laamp_base_contract_schemes.1001.t: "การล่าอาชญากร"
 laamp_base_contract_schemes.1001.desc: "\"ไอ้พวก...\" [employer.GetTitledFirstName] ย่นจมูกของ[employer.GetHerHis]อย่างรังเกียจ \"#EMP ผู้ไม่พอใจ#! เหล่านี้คอยก่อกวนที่ดินส่วนตัวของข้า พวกมันเผา สังหาร และลักขโมยโดยแทบไม่ต้องรับโทษ หลบหนีไปได้ก่อนที่คนของข้าจะจับพวกมันใส่ตรวนอันเป็นสิ่งที่พวกมัน #EMP สมควร#! ได้รับอย่างยิ่ง\"\n\nข้าพยักหน้า พวกโจรคงจะหลักแหลมพอตัวถึงได้มีค่าหัวส่วนตัว เช่นนี้\n\n\"นำตัวไอ้เดนมนุษย์นั่นมาให้ข้าก่อนที่ทรัพย์สินของข้าอีกแห่งจะมอดไหม้เป็นจุณ แล้วเจ้าจะได้รับค่าจ้าง\""
 laamp_base_contract_schemes.1001.a: "$laamp_base_contract_schemes.0000.generic_option.success_chance$"
 laamp_base_contract_schemes.1001.b: "$laamp_base_contract_schemes.0000.generic_option.speed$"
 laamp_base_contract_schemes.1001.c: "$laamp_base_contract_schemes.0000.generic_option.progress$"
 laamp_base_contract_schemes.1001.d: "$laamp_base_contract_schemes.0000.generic_option.nothing$"
 laamp_base_contract_schemes.1001.d.tt: "$laamp_base_contract_schemes.0000.d.no_starting_bonus$"

 laamp_base_contract_schemes.1002.t: "$laamp_base_contract_schemes.1001.t$: สำเร็จ!"
 laamp_base_contract_schemes.1002.desc: ""ดี #EMP มาก#!," [employer.GetFirstName] หัวเราะเบา ๆ ควงมีดในมือของ [employer.GetHerHis] อย่างเกียจคร้าน "งานยอดเยี่ยม [ROOT.Char.GetFirstNameNoTooltip] เจ้าและคณะของเจ้าคุ้มค่าทุกเหรียญในกระเป๋านั้น"\n\nร่างบอบช้ำของโจรที่ถูกจับได้นั่งอยู่ในกรงด้านหลัง [employer.GetTitleAsNameNoTooltip] ผู้ดูคลุ้มคลั่งเล็กน้อย มันคงจะน่าตื่นเต้นที่ได้เผาทรัพย์สินของ [employer.GetWomanMan] และขโมยความมั่งคั่งของ [employer.GetHerHis] เมื่อพวกเขายังมีอิสระ หยอกล้อผู้มีอำนาจ เช่นนี้ แต่ทุกสิ่งที่ดีงามย่อมมีวันสิ้นสุด\n\nข้าขอตัวลา โดยมีเงินอยู่ในมือ โจรผู้โชคร้ายเหล่านี้กำลังจะได้รับค่าจ้างที่แท้จริงของบาป"
 laamp_base_contract_schemes.1002.a: "ฟังดูเหมือน [employer.GetTitleAsNameNoTooltip] ผู้ดีงามกำลังได้รับความคุ้มค่าจากเงินของ [employer.GetHerHis]"

 laamp_base_contract_schemes.1003.t: "$laamp_base_contract_schemes.1001.t$: ล้มเหลว!"
 laamp_base_contract_schemes.1003.desc: ""#EMP เจ้าก็ล้มเหลวด้วยเหรอ?!#!" [employer.GetFirstName] ตะโกน เดือดดาลด้วยความหงุดหงิด "ไม่มีใครกำจัดโจรชั่วช้าเหล่านี้ให้ข้าได้เลยหรือ? ข้าต้องทำสิ่งนี้ด้วยตนเองหรือ [employer.GetTitleAsNameNoTooltip] ต้อง ทำให้ [employer.Custom('HandHands')] ของ [employer.GetHerHis] เปื้อนเลือดของคนนอกกฎหมายบางคนหรือ?"\n\nข้าเม้มริมฝีปากให้ดีที่สุด ตระหนักอย่างยิ่งว่าการตำหนิด้วยวาจาอาจไม่ทำกำไร แต่อย่างน้อยก็ไม่ได้จบลงด้วยการที่ข้าอยู่ในคุกใต้ดิน บางทีนะ\n\n"แล้วไง? เจ้ารออะไรอยู่? ออกไปให้พ้นสายตาข้า ไอ้ [ROOT.Char.Custom('GetLaampDescribeTypeInsult')]! ข้าจะหาคน #EMP อื่น#! มาจัดการปัญหาของข้า คนที่ #EMP มีความสามารถ#!""
 laamp_base_contract_schemes.1003.a: "$laamp_base_contract_schemes.0000.generic_option.proceed.negative.light$"

 laamp_base_contract_schemes.1004.t: "นำศีรษะของ [recidivist.GetHerHis|U] มาให้ข้า"
 laamp_base_contract_schemes.1004.desc: "\"ไอ้พวก...\" [employer.GetTitledFirstName] ย่นจมูกของ[employer.GetHerHis]อย่างรังเกียจ \"#EMP ผู้ไม่พอใจ#! เหล่านี้คอยก่อกวนที่ดินส่วนตัวของข้า พวกมันเผา สังหาร และลักขโมยโดยแทบไม่ต้องรับโทษ หลบหนีไปได้ก่อนที่คนของข้าจะจับพวกมันใส่ตรวนอันเป็นสิ่งที่พวกมัน #EMP สมควร#! ได้รับอย่างยิ่ง\"\n\nข้าพยักหน้า พวกโจรคงจะหลักแหลมพอตัวถึงได้มีค่าหัวส่วนตัว เช่นนี้\n\n\"หัวหน้าของพวกมันคือ [recidivist.GetFirstNameNicknamed] — เอาหัวของ[recidivist.GetHerHis]มาให้ข้าก่อนที่[recidivist.GetSheHe]จะหนีรอดไปได้ตลอดกาล แล้วเจ้าจะได้รับค่าจ้าง\""
 laamp_base_contract_schemes.1004.tt.destination_list: "ท่านจะเริ่มเดินทางไปยัง [destination_1.GetBaseNameNoTier] ทันที จากนั้นไปยัง [destination_2.GetBaseNameNoTier] แล้วไปยัง [destination_3.GetBaseNameNoTier]"
 laamp_base_contract_schemes.1004.tt.explanation: "#TUT เพื่อทำ [task_contract|E] ให้สำเร็จ:\n$EFFECT_LIST_BULLET$สะสมคะแนนชัยชนะ #P 2#! แต้ม ต่อสู้กับ [recidivist.GetFirstName]\n$EFFECT_LIST_BULLET$คะแนนชัยชนะสามารถรับได้ครั้งละ 1-2 แต้ม โดยวิธีใดวิธีหนึ่ง —\n$TAB$$EFFECT_LIST_BULLET$การ [single_combat_duel|E]\n$TAB$$EFFECT_LIST_BULLET$บททดสอบ [prowess|E] (หากท่านไม่สามารถประลองด้วยตนเองได้)\n$TAB$$EFFECT_LIST_BULLET$บททดสอบ [martial|E]\n$TAB$$EFFECT_LIST_BULLET$เสี่ยง [men_at_arms|E] ของท่าน ( ซึ่งท่านต้องมีอย่างน้อย [EmptyScope.ScriptValue('laamp_base_contract_schemes_1301_min_troops_value')|0] และไม่มีใครถูกเกณฑ์ทหารอยู่ มิฉะนั้นจะไม่มีสิทธิ์เลือกตัวเลือกนี้)\n$EFFECT_LIST_BULLET$ท่านได้รับโอกาส #P 3 ครั้ง#! ในการสังหารเป้าหมายของท่าน หลังจากนั้นพวกเขาจะหลบหนีไปและท่านจะได้รับผลลัพธ์ $label_failure_standard$#!"
 laamp_base_contract_schemes.1004.a: "$travel.stationary_domicile.option.t$"
 laamp_base_contract_schemes.1004.b: "$travel.mobile_domicile.option.t$"

 laamp_base_contract_schemes.1011.t: "ทหารรับจ้าง"
 laamp_base_contract_schemes.1011.desc: ""ความต้องการของข้านั้นเรียบง่าย" [employer.GetFirstName] อธิบาย "มีหนามบางอย่างในกุหลาบแห่ง [employer.GetCapitalLocation.GetTitle.GetNameNoTier] และข้าอยากให้เจ้ากำจัดตัวละครที่... น่ารำคาญเหล่านี้ ข้าไม่อาจถูกเห็นว่ากำจัดพวกเขาโดยตรง ดังนั้นเจ้าจะต้องจัดการกับพวกเขาแทนข้า"\n\nข้าใช้นิ้วหัวแม่มือปาดคอเป็นเชิงถาม\n\n"ไม่ ไม่" นายจ้างของข้าชี้แจง "ไม่มีการนองเลือดร้ายแรง แค่ ทำให้พวกเขาเงียบโดยไม่ฆ่าพวกเขา จนกว่าพวกเขาจะเข้าใจว่าการไม่เคารพ [employer.GetTitleAsNameNoTooltip] เป็นอย่างไร"\n\nดูเหมือนจะง่ายพอ"
 laamp_base_contract_schemes.1011.a: "$laamp_base_contract_schemes.0000.generic_option.success_chance$"
 laamp_base_contract_schemes.1011.b: "$laamp_base_contract_schemes.0000.generic_option.speed$"
 laamp_base_contract_schemes.1011.c: "$laamp_base_contract_schemes.0000.generic_option.progress$"
 laamp_base_contract_schemes.1011.d: "$laamp_base_contract_schemes.0000.generic_option.nothing$"
 laamp_base_contract_schemes.1011.d.tt: "$laamp_base_contract_schemes.0000.d.no_starting_bonus$"

 laamp_base_contract_schemes.1012.t: "$laamp_base_contract_schemes.1011.t$: สำเร็จ!"
 laamp_base_contract_schemes.1012.desc: ""งานยอดเยี่ยม [ROOT.Char.GetFirstNameNoTooltip]! สวนแห่ง [employer.GetCapitalLocation.GetTitle.GetNameNoTier] เงียบสงบอย่างสวยงาม และข้าสามารถพักผ่อนได้ง่ายขึ้นเล็กน้อยในเวลากลางคืน"\n\n[employer.GetSheHe|U] โยนถุงเงินให้ข้า\n\n"โปรดอยู่กับเราในครั้งต่อไปที่ท่านผ่านเข้ามาในพื้นที่นี้! ข้าแน่ใจว่าเราสามารถหาที่พักที่เหมาะสมได้ — ไม่ต้องพูดถึง #EMP การจ้างงาน#! ที่เหมาะสม — สำหรับ [ROOT.Char.Custom('GetLaampDescribeTypeSelf')] [ROOT.Char.Custom2('GetYoungOld',employer)] ที่มีหัวการค้า เช่นนี้""
 laamp_base_contract_schemes.1012.a: "$laamp_base_contract_schemes.0000.generic_option.proceed.neutral$"

 laamp_base_contract_schemes.1013.t: "$laamp_base_contract_schemes.1011.t$: ล้มเหลว!"
 laamp_base_contract_schemes.1013.desc: "\"เจ้ามีงานเดียวเท่านั้น [ROOT.Char.GetFirstNameNoTooltip]\" [employer.GetFirstNameNoTooltip] ถอนหายใจ \"ปิดปากพวกปากมากนั่นเสีย ทำให้พวกมันเงียบไปสักสองสามเดือน แล้วค่อยกลับมารับเงินของเจ้า\"\n\n[ROOT.Char.Custom('MaskFace')] ของข้ายังคงสงบนิ่ง แม้อาจจะน่าขุ่นเคืองใจ แต่ก็เป็นการดีที่สุดที่จะปล่อยให้ [employer.GetTitleAsNameNoTooltip] ระบายความคับข้องใจของ[employer.GetHerHis]ด้วยวาจา ดีกว่าที่[employer.GetSheHe]จะหันไปใช้กำลังอาวุธ\n\n\"บางทีข้าอาจโง่เขลาที่คาดหวังสิ่งที่ดีกว่านี้จาก [ROOT.Char.Custom('GetLaampDescribeTypeInsult')] เช่นเจ้า คงช่วยไม่ได้กระมัง\"\n\nมีความเงียบงันชั่วครู่... ขณะที่ข้ารอว่า [employer.GetWomanMan] ผู้นั้นจะมีสิ่งใดจะกล่าวอีกหรือไม่\n\n\"เจ้าไปได้แล้ว #EMP บัดนี้#! หากเจ้าประสงค์\""
 laamp_base_contract_schemes.1013.a: "$laamp_base_contract_schemes.0000.generic_option.proceed.negative.light$"

 laamp_base_contract_schemes.1021.t: "ครูฝึก[ROOT.Char.Custom('MistressMaster')]"
 laamp_base_contract_schemes.1021.desc: "กองทหารส่วนตัวของ [employer.GetFirstNamePossessive] เป็นกลุ่มที่น่าเกรงขามอยู่แล้ว แต่น้อยครั้งนักที่ [employer.GetTitleAsNameNoTooltip] จะพอใจกับแค่ #EMP น่าเกรงขาม#! กระดูกสันหลังของ [employer.GetPrimaryTitle.GetDefinitiveName] ก็คือ เช่นเดียวกับอาณาจักรส่วนใหญ่ ทหารของมันนั่นเอง\n\nการตรวจสอบยุทโธปกรณ์และสัมภาษณ์นักรบที่เก่งที่สุดของพวกเขานั้นให้ความกระจ่าง อย่างน้อยก็เพียงพอที่จะรู้ว่ามีงานที่ต้องทำที่นี่"
 laamp_base_contract_schemes.1021.a: "$laamp_base_contract_schemes.0000.generic_option.success_chance$"
 laamp_base_contract_schemes.1021.b: "$laamp_base_contract_schemes.0000.generic_option.speed$"
 laamp_base_contract_schemes.1021.c: "$laamp_base_contract_schemes.0000.generic_option.progress$"
 laamp_base_contract_schemes.1021.d: "$laamp_base_contract_schemes.0000.generic_option.nothing$"
 laamp_base_contract_schemes.1021.d.tt: "$laamp_base_contract_schemes.0000.d.no_starting_bonus$"

 laamp_base_contract_schemes.1022.t: "$laamp_base_contract_schemes.1021.t$: สำเร็จ!"
 laamp_base_contract_schemes.1022.desc: "การตรวจแถวทหารของ [employer.GetTitledFirstNamePossessive] ทำให้ข้ารู้สึกอบอุ่นใจด้วยความพึงพอใจส่วนตัว ใช่ พวกเขาเป็นนักรบก่อนที่ข้าจะมาถึงพวกเขา แต่ด้วยการฝึกฝนของข้า พวกเขาได้รับการยกระดับเป็นวีรบุรุษอย่างแน่นอน\n\nนายจ้างของข้าดูเหมือนจะพอใจอย่างแน่นอน ขณะที่ [employer.GetSheHe] ตบหลังข้าพร้อมกับหัวเราะอย่างจริงใจ\n\n"งานดีมาก [ROOT.Char.Custom('GetLaampDescribeTypeSelf')] ผู้สูงศักดิ์! ท่านเอาเหล็กดิบมาและมอบเหล็กกล้าคืนให้ข้า ค่าจ้างของท่านรออยู่ที่ประตู""
 laamp_base_contract_schemes.1022.a: "$laamp_base_contract_schemes.0000.generic_option.proceed.neutral$"

 laamp_base_contract_schemes.1023.t: "$laamp_base_contract_schemes.1021.t$: ล้มเหลว!"
 laamp_base_contract_schemes.1023.desc: "ข้าแทบจะไม่สามารถถูกตำหนิสำหรับ... สำหรับ #EMP คนนอกกฎหมาย#! เหล่านี้และความวุ่นวายของพวกเขาได้!\n\nพวกเขาเป็นกองทหารของ [employer.GetTitledFirstNamePossessive] แต่ทันทีที่ผู้จ่ายเงินเดือน[employer.Custom('MistressMaster')] ของพวกเขาพ้นสายตาไป ลักษณะของระเบียบวินัยทั้งหมดก็พังทลายลง และพวกเขาก็กลายเป็นฝูงตั๊กแตนที่ส่งเสียงดังและปล้นสะดม ซึ่งกินอาหารทุกชิ้นและเครื่องดื่มทุกหยดที่อยู่ในระยะคว้าถึง\n\nแน่นอนว่าผู้บังคับบัญชาของพวกเขาโทษว่าเป็นความผิดของข้าทั้งหมด วิธีการแปลก ๆ ของข้า วิธีการทำสงครามแบบต่างชาติของข้า มัน ทำให้จิตใจที่เรียบง่ายของบริวารในสังกัดของพวกเขาสับสน\n\nข้าได้ประท้วงความบริสุทธิ์ของข้าอย่างสุดความสามารถ แต่ [employer.GetFirstNameNoTooltip] ไม่ต้องการฟัง จะไม่มีค่าจ้างสำหรับเรื่องทั้งหมดนี้"
 laamp_base_contract_schemes.1023.a: "$laamp_base_contract_schemes.0000.generic_option.proceed.negative.light$"

 laamp_base_contract_schemes.1031.t: "หน้าที่ทหารรักษาการณ์"
 laamp_base_contract_schemes.1031.desc: "มัน... แทบจะไม่ใช่งานที่น่าตื่นเต้นที่สุด การจัดหาดาบเสริมสองสามเล่มสำหรับที่ดินของ [employer.GetTitledFirstNamePossessive] แต่อย่างน้อยมันก็มั่นคง\n\nนอกจากนี้ ในเรื่องของอาวุธ งานที่ #EMP น่าตื่นเต้น#! ไม่ใช่ตัวเลือกที่ดีที่สุดเสมอไป ในสนามรบ ทหารรับจ้างที่ใช้แล้วทิ้งมักจะเป็นคนแรกที่เข้าสู่การต่อสู้ แต่หลังกำแพงล่ะ? อืม ยากที่จะ ทำให้เป็นเหยื่อของนักสู้ที่แข็งแกร่งได้\n\n"... แน่นอนว่าไม่ได้คาดหวังปัญหาที่ร้ายแรงอะไร แต่ถึงกระนั้นท่านก็อยู่ที่นี่เพื่อเป็นการป้องกันไว้ก่อน ทั้งหมดนี้ชัดเจนหรือไม่?" [employer.GetTitleAsNameNoTooltip] พูดจบ ข้าพยักหน้า กลับมาสู่การสนทนาด้วยความตกใจ"
 laamp_base_contract_schemes.1031.a: "$laamp_base_contract_schemes.0000.generic_option.success_chance$"
 laamp_base_contract_schemes.1031.b: "$laamp_base_contract_schemes.0000.generic_option.speed$"
 laamp_base_contract_schemes.1031.c: "$laamp_base_contract_schemes.0000.generic_option.progress$"
 laamp_base_contract_schemes.1031.d: "$laamp_base_contract_schemes.0000.generic_option.nothing$"
 laamp_base_contract_schemes.1031.d.tt: "$laamp_base_contract_schemes.0000.d.no_starting_bonus$"

 laamp_base_contract_schemes.1032.t: "$laamp_base_contract_schemes.1031.t$: สำเร็จ!"
 laamp_base_contract_schemes.1032.desc: ""งานยอดเยี่ยม [ROOT.Char.GetFirstNameNoTooltip]!" [employer.GetFirstName] ร้องออกมา "สายลับของข้ารายงานว่าการป้องกันที่มั่นคงของท่านสำหรับที่มั่นนี้ได้ขับไล่ผู้บุกรุกที่ข้าหวาดกลัวออกไป"\n\n[employer.GetTitleAsNameNoTooltip] ตบหลังข้า\n\n"เดาว่าพวกเขาไม่ชอบที่จะต่อกรกับนักรบที่แข็งแกร่ง เช่นท่าน ใช่ไหม? การบริการของท่านเป็นที่ชื่นชม และค่าจ้างของท่านกำลังมา"\n\nข้าพยักหน้าด้วยความขอบคุณ ดีใจสำหรับการพักผ่อนที่ยาวนาน แต่ก็ดีใจที่มันจบลง"
 laamp_base_contract_schemes.1032.a: "$laamp_base_contract_schemes.0000.generic_option.proceed.neutral$"

 laamp_base_contract_schemes.1033.t: "$laamp_base_contract_schemes.1031.t$: ล้มเหลว!"
 laamp_base_contract_schemes.1033.desc: ""เจ้าแค่ต้องเฝ้าสถานที่นี้ ไอ้ [ROOT.Char.Custom('GetLaampDescribeTypeInsult')] โง่เง่า! ดูมันสิ ควันลอยออกมาจากหน้าต่างทุกบาน มัน #EMP ดูเหมือน#! ถูกเฝ้าอยู่หรือไง?" [employer.GetTitledFirstName] คำราม\n\nข้า... ข้าไม่รู้ว่าเกิดอะไรขึ้น เราอยู่ที่นี่ เราปฏิบัติหน้าที่ เราตื่นตัว... หรือเปล่า? ผู้บุกรุกแอบข้ามกำแพงหรือผ่านประตูเข้ามาหรือ? ถึงกระนั้น การจุดไฟที่พวกเขาทำได้ มันน่าอับอาย\n\n[employer.GetTitleAsNameNoTooltip] ผู้โกรธเกรี้ยวดูเหมือนจะไม่สนใจข้อแก้ตัวหรือการประท้วงใด ๆ ของข้า เราถูกผลักไสออกจากลานอย่างไม่สมเกียรติ ความหวังทั้งหมดที่จะได้รับค่าจ้างดับมอดไปนานแล้ว"
 laamp_base_contract_schemes.1033.a: "$laamp_base_contract_schemes.0000.generic_option.proceed.negative.light$"

 laamp_base_contract_schemes.1041.t: "การล่าเหยื่อในหมู่นักเดินทาง"
 laamp_base_contract_schemes.1041.desc: "[employer.GetFirstName|U] ต้องเป็น [employer.GetTitleAsNameNoTooltip] ที่ประมาทเลินเล่ออย่างแท้จริง ลองจินตนาการถึงการประกาศขอความช่วยเหลือ เช่นนั้นดูสิ?\n\n[employer.GetHerHis|U] เสียหาย เราได้กำไร คณะของข้าและตัวข้าได้เริ่มลาดตระเวนตามถนนสายรองที่พลุกพล่านที่สุดเพื่อเริ่มวางกำลังซุ่มโจมตีแล้ว เราจะปล้นพ่อค้าเหล่านี้จนหมดตัวและกลับสู่เส้นทางอย่างรวดเร็วเท่าที่เรามา\n\nข้าแทบจะได้กลิ่นเหรียญแล้ว"
 laamp_base_contract_schemes.1041.a: "$laamp_base_contract_schemes.0000.generic_option.success_chance$"
 laamp_base_contract_schemes.1041.b: "$laamp_base_contract_schemes.0000.generic_option.speed$"
 laamp_base_contract_schemes.1041.c: "$laamp_base_contract_schemes.0000.generic_option.progress$"
 laamp_base_contract_schemes.1041.d: "$laamp_base_contract_schemes.0000.generic_option.nothing$"
 laamp_base_contract_schemes.1041.d.tt: "$laamp_base_contract_schemes.0000.d.no_starting_bonus$"

 laamp_base_contract_schemes.1042.t: "$laamp_base_contract_schemes.1041.t$: สำเร็จ!"
 laamp_base_contract_schemes.1042.desc: "เป็นไปตามแผน — [employer.GetTitledFirstName] ไม่สามารถปกป้องพ่อค้าของ [employer.GetHerHis] หรือทรัพย์สินของพวกเขาได้\n\nทุกเหรียญที่เรายึดมาได้ ทำให้คณะของเรากล้าหาญขึ้น และกองคาราวานของ [employer.GetHerHis] ก็กระวนกระวายมากขึ้น เราได้กินทองคำของแผ่นดินจนอิ่มหนำสำราญมากพอที่เราจะเห็นพวกเขาชะลอตัวลงอย่างเห็นได้ชัด พยายามหาเส้นทางอื่นหรือค้าขายที่อื่นไปเลย\n\nน่าเศร้าที่สิ่งนี้ส่งสัญญาณถึงการสิ้นสุดกิจกรรมของเราที่นี่ เป็นเรื่องสำคัญที่จะต้องออกไป ในขณะที่สถานการณ์ยังดีอยู่ และ [employer.GetTitleAsName] ยังคงพยายามจับเราอยู่"
 laamp_base_contract_schemes.1042.a: "$laamp_base_contract_schemes.0000.generic_option.proceed.neutral$"

 laamp_base_contract_schemes.1043.t: "$laamp_base_contract_schemes.1041.t$: ล้มเหลว!"
 laamp_base_contract_schemes.1043.desc: "[employer.GetTitledFirstName] ดูเหมือนจะควบคุมถนนหนทางในดินแดนเหล่านี้ได้ #EMP แน่นหนา#! กว่าที่เราคิดไว้มาก\n\nคณะของข้าและตัวข้าได้พยายามซุ่มโจมตีครั้งแล้วครั้งเล่า ซุ่มรอครั้งแล้วครั้งเล่า แต่กองคาราวานไม่มาเลย หรือไม่ก็มีการคุ้มกันอย่างแน่นหนาจนเป็นเป้าหมายที่ไร้ค่า\n\nการต่อสู้เพียงไม่กี่ครั้งที่เรา #EMP ได้#! เลือกนั้นนองเลือดและไม่ได้กำไรโดยสิ้นเชิง\n\nยิ่งเราออกจากดินแดนอันเลวร้ายนี้เร็วเท่าไหร่ก็ยิ่งดี — สิ่งที่ [employer.GetFirstNameNoTooltip] ดูเหมือนจะเห็นด้วยอย่างสุดใจ"
 laamp_base_contract_schemes.1043.a: "$laamp_base_contract_schemes.0000.generic_option.proceed.negative.light$"

 laamp_base_contract_schemes.1044.t: "$laamp_base_contract_schemes.1041.t$"
 laamp_base_contract_schemes.1044.desc: "[employer.GetFirstName|U] ต้องเป็น [employer.GetTitleAsNameNoTooltip] ที่ประมาทเลินเล่ออย่างแท้จริง ลองจินตนาการถึงการประกาศขอความช่วยเหลือ เช่นนั้นและ #EMP ไม่#! คาดหวังว่าจะดึงดูดปัญหาเข้ามาเพิ่มดูสิ?\n\n[employer.GetHerHis|U] เสียหาย เราได้กำไร คณะของข้าและตัวข้าได้เริ่มลาดตระเวนตามถนนสายรองที่พลุกพล่านที่สุดเพื่อเริ่มวางกำลังซุ่มโจมตีแล้ว — ดูเหมือนว่าเส้นทางที่เป็นธรรมชาติที่สุดในการก่อกวนคือถนนสาย [destination_1.GetBaseNameNoTier]-[destination_2.GetBaseNameNoTier]\n\nเราจะปล้นพ่อค้าและนักเดินทางเหล่านี้จนหมดตัวและหนีหายไปในยามค่ำคืนอย่างรวดเร็วเท่าที่เรามา\n\nข้าแทบจะได้กลิ่นเหรียญแล้ว"
 laamp_base_contract_schemes.1044.a: "$travel.stationary_domicile.option.t$"
 laamp_base_contract_schemes.1044.b: "$travel.mobile_domicile.option.t$"
 laamp_base_contract_schemes.1044.tt.destination_list: "ท่านจะเริ่มเดินทางไปยัง [destination_1.GetBaseNameNoTier] ทันที จากนั้นต่อไปยัง [destination_2.GetBaseNameNoTier]"
 laamp_base_contract_schemes.1044.tt.explanation: "#TUT เพื่อทำ [task_contract|E] ให้สำเร็จ:\n$EFFECT_LIST_BULLET$เดินทางไปยังจุดหมายปลายทางสุดท้าย\n$EFFECT_LIST_BULLET$ระหว่างทาง ผ่านบททดสอบ [skill|E] ประเภท [prowess|E], [martial|E], หรือ [intrigue|E] ต่อสู้กับนักเดินทางคนอื่น ๆ\n$EFFECT_LIST_BULLET$รับ [gold|E] จำนวนเท่าใดก็ได้เพื่อผลลัพธ์ $label_success_standard$#!"
 laamp_base_contract_schemes.1044.tt.number_of_encounters: "#TUT ท่านจะมีเหยื่อที่อาจเป็นไปได้ [task_contract.MakeScope.Var('encounters_max').GetValue|0] ราย#!"
 laamp_base_contract_schemes.1044.tt.path_warning: "#TUT แม้ว่าการยืดเส้นทางการเดินทางของท่านจะไม่ทำให้มีเหยื่อที่อาจเป็นไปได้มากขึ้น แต่การทำให้สั้นลงอาจลดจำนวนที่ท่านได้รับ#!"

#################################################
 # Base Stewardship Scheme Events
 laamp_base_contract_schemes.2001.t: "ภาษี ทศางค์ และค่าผ่านทาง"
 laamp_base_contract_schemes.2001.desc: ""... และ แน่นอน ภาษีที่ดินเพิ่มเติม ทั้งหมดนี้ชัดเจนหรือไม่?" [employer.GetTitledFirstName] พูดเสียงยานคาง มันเป็นรายการยาวเหยียดของค่าธรรมเนียมที่ค้างชำระ อากร และภาษีอื่น ๆ ที่หลากหลาย แต่การจัดเก็บฟังดูง่ายพอ\n\n"ดี #EMP มาก#!! ตอนนี้ ข้ากำลังเสี่ยงที่ไว้ใจท่านแทนพนักงานเก็บภาษีปกติของข้า แต่ข้าหวังว่าท่านจะสามารถแสดงให้พวกขี้เกียจเหล่านั้นเห็นว่าต้องทำอย่างไร และ ทำให้ราษฎรของข้ากลับมายำเกรง [employer.GetFaith.WealthGodName] อีกครั้ง ทำงานของท่านอย่างซื่อสัตย์ รวดเร็ว และดี แล้วท่านจะได้รับค่าตอบแทนมากกว่าที่ควร"\n\nชั่ววินาทีหนึ่ง ดูเหมือนว่าอาจมีคำแนะนำเพิ่มเติม แต่ [employer.GetFirstNameNoTooltip] โบกมือให้ข้าออกจากห้องทำงาน"
 laamp_base_contract_schemes.2001.a: "$laamp_base_contract_schemes.0000.generic_option.success_chance$"
 laamp_base_contract_schemes.2001.b: "$laamp_base_contract_schemes.0000.generic_option.speed$"
 laamp_base_contract_schemes.2001.c: "$laamp_base_contract_schemes.0000.generic_option.progress$"
 laamp_base_contract_schemes.2001.d: "$laamp_base_contract_schemes.0000.generic_option.nothing$"
 laamp_base_contract_schemes.2001.d.tt: "$laamp_base_contract_schemes.0000.d.no_starting_bonus$"

 laamp_base_contract_schemes.2002.t: "$laamp_base_contract_schemes.2001.t$: สำเร็จ!"
 laamp_base_contract_schemes.2002.desc: ""งานเยี่ยมยอด [ROOT.Char.GetFirstNameNoTooltip]!" [employer.GetFirstName] ร้องออกมา ผิวปากเบา ๆ กับ [employer.GetHerselfHimself] ขณะที่คณะของข้านำถุงภาษีที่ค้างชำระมานานเข้ามาถุงแล้วถุงเล่า\n\n"เหรียญและสินค้าเป็นเลิศแน่นอน แต่นี่ควรจะสอนให้พนักงานเก็บภาษีของข้า #EMP เห็นคุณค่า#! ของงานของพวกเขาในอนาคต"\n\nข้าพยักหน้า พอใจในความรู้ที่ว่าความกตัญญูของ [employer.GetTitleAsNamePossessiveNoTooltip] หมายความว่าค่าจ้างของเราจะมาถึงโดยเร็ว ข้ามีความสุขเกินกว่าจะยอมรับถุงหนักอึ้งที่โยนมาให้ข้าในอีกครู่ต่อมา"
 laamp_base_contract_schemes.2002.a: "$laamp_base_contract_schemes.0000.generic_option.proceed.neutral$"

 laamp_base_contract_schemes.2003.t: "$laamp_base_contract_schemes.2001.t$: ล้มเหลว!"
 laamp_base_contract_schemes.2003.desc: ""ไอ้โง่! นี่น้อยกว่าครึ่งหนึ่งของที่เจ้า #EMP ควรจะ#! เก็บมาได้!" [employer.GetTitledFirstName] คำรามลั่น\n\n"ถ้าข้าไม่ได้ให้ค้นค่ายพักแรมอันน่าสมเพชของเจ้าจากบนลงล่าง ข้าคงคิดว่าเจ้ากำลังขโมยจากข้า แต่มันชัดเจนว่านี่เป็นเพียงความไร้ความสามารถ" [employer.GetSheHe] แทบจะไม่หยุดหายใจ "ตอนนี้ [employer.Custom('Saying_1p_SightAway')] ก่อนที่ข้าจะเสียเหรียญเล็กน้อยที่เจ้าเก็บมาได้จริง ๆ ไปกับตะแลงแกงที่โทรมที่สุดของ [employer.GetPrimaryTitle.GetDefinitiveNamePossessiveNoTooltip|l]!"\n\nคำพูดที่เกรี้ยวกราด ทำให้ขนของข้าลุกชัน กระดูกขากรรไกรของข้าคลิกอยู่ในเบ้าขณะที่ข้าพยายามระงับความโกรธที่ก่อตัวขึ้น\n\nตอนนี้ไม่ใช่เวลาที่จะต่อสู้ ไม่ใช่เมื่อข้ายังสามารถจากไปพร้อมกับศีรษะของข้าได้"
 laamp_base_contract_schemes.2003.a: "$laamp_base_contract_schemes.0000.generic_option.proceed.negative.light$"

 laamp_base_contract_schemes.2004.t: "มอบให้แก่ [employer.GetFirstNameNoTooltip]"
 laamp_base_contract_schemes.2004.desc: "ผู้แทนของ [employer.GetTitledFirstNamePossessive] รวดเร็วและตรงประเด็น: เมือง [destination_1.GetBaseNameNoTier] ดูเหมือนจะล้มเหลวในการจ่ายภาษีเพิ่มเติมที่กำหนดโดย [employer.GetTitleAsNameNoTooltip] ผู้ดีงาม\n\nชาวเมืองได้ต่อต้านข้อเรียกร้องเพิ่มเติม แต่ยังไม่ #EMP ถึงกับ#! เดินขบวนก่อกบฏอย่างเปิดเผย [employer.GetFirstNameNoTooltip] ต้องการส่วนของ [employer.GetHerHis] แต่ระมัดระวังเกี่ยวกับค่าใช้จ่ายที่อาจเกิดขึ้นจากการกบฏอย่างเต็มรูปแบบ\n\nบุคคลที่สามที่เป็นกลางเป็นเรื่องสมมติที่สะดวกสำหรับการข่มขู่ผู้นำของชุมชนที่ดื้อรั้น [person_a.GetTitledFirstName] ให้ยอมจำนน\n\nทั้งหมดที่รออยู่คือการเดินทางไปยัง [destination_1.GetBaseNameNoTierNoTooltip]"
 laamp_base_contract_schemes.2004.a: "$travel.stationary_domicile.option.t$"
 laamp_base_contract_schemes.2004.b: "$travel.mobile_domicile.option.t$"
 laamp_base_contract_schemes.2004.tt.destination_list: "ท่านจะเริ่มเดินทางไปยัง [destination_1.GetBaseNameNoTier] ทันที"
 laamp_base_contract_schemes.2004.tt.explanation: "#TUT เพื่อทำ [task_contract|E] ให้สำเร็จ:\n$EFFECT_LIST_BULLET$ผ่านบททดสอบ 4 ครั้งเพื่อค้นหาหลักฐาน:\n$TAB$$EFFECT_LIST_BULLET$หลักฐาน 2 ชิ้น รับประกันผลลัพธ์ $label_success_standard$\n$TAB$$EFFECT_LIST_BULLET$หลักฐาน 4 ชิ้น ให้ผลลัพธ์ $label_success_critical$\n$TAB$$EFFECT_LIST_BULLET$หลักฐาน 1 ชิ้น อาจนำไปสู่ผลลัพธ์ $label_success_standard$, $label_success_qualified$, หรือ $label_failure_standard$\n$EFFECT_LIST_BULLET$บททดสอบอาจเป็นอย่างใดอย่างหนึ่ง:\n$TAB$$EFFECT_LIST_BULLET$การทดสอบ [stewardship|E]\n$TAB$$EFFECT_LIST_BULLET$การทดสอบ [aptitude|E] ของ [officer|E] ตำแหน่ง [GetCourtPositionType('quartermaster_camp_officer').GetName()]\n$TAB$$EFFECT_LIST_BULLET$การทดสอบหนึ่งใน [diplomacy|E], [intrigue|E], และ [learning|E]#!"

 laamp_base_contract_schemes.2011.t: "การบันทึก"
 laamp_base_contract_schemes.2011.desc: "บางทีอาจจะผิดธรรมเนียมไปบ้างที่จ้าง [ROOT.Char.Custom('GetLaampDescribeTypeSelfArticle')] [ROOT.Char.Custom('GetLaampDescribeTypeSelf')] และคณะของ [ROOT.Char.GetHerHis] มาทำการสำรวจสำมะโนประชากร แต่บางครั้งความจำเป็นก็ต้องมาก่อนดังที่ [ROOT.Char.GetFaith.random_EvilGodNames] ชักนำ ข้าเดา และข้าแทบจะไม่สามารถบ่นเกี่ยวกับการได้รับงานได้\n\nเหรียญก็ใช้จ่ายได้ดี เช่นกัน และไม่ว่าเหตุผลใดที่ [employer.GetTitledFirstName] มีในการไม่ไว้วางใจเสมียนของ [employer.GetHerHis] เห็นได้ชัดว่าไม่ได้ขยายมาถึงเรา ดังนั้นมันควรจะเป็นงานที่ดีและง่าย\n\nใช่ไหม?"
 laamp_base_contract_schemes.2011.a: "$laamp_base_contract_schemes.0000.generic_option.success_chance$"
 laamp_base_contract_schemes.2011.b: "$laamp_base_contract_schemes.0000.generic_option.speed$"
 laamp_base_contract_schemes.2011.c: "$laamp_base_contract_schemes.0000.generic_option.progress$"
 laamp_base_contract_schemes.2011.d: "$laamp_base_contract_schemes.0000.generic_option.nothing$"
 laamp_base_contract_schemes.2011.d.tt: "$laamp_base_contract_schemes.0000.d.no_starting_bonus$"

 laamp_base_contract_schemes.2012.t: "$laamp_base_contract_schemes.2011.t$: สำเร็จ!"
 laamp_base_contract_schemes.2012.desc: "การสำรวจสำมะโนประชากรไม่ได้ปราศจากความตื่นเต้น: มีชาวนาพยายามซ่อนปศุสัตว์และพืชผลที่เก็บไว้ พ่อค้าปลอมแปลงผลกำไร แม้ แต่ขุนนางผู้น้อยที่ดินแดนของพวกเขาดูเหมือนจะเล็กลงและยากจนลงยิ่งใกล้เข้าไปขณะจดบันทึก\n\nโชคดีที่ เราไม่พบสิ่งใดที่ตราประทับของ [employer.GetTitledFirstNamePossessive] และไหวพริบของเราเองไม่สามารถผ่านไปได้อย่างง่ายดายนัก\n\nผลลัพธ์อาจไม่ละเอียดถี่ถ้วน แต่ก็จะใช้การได้ดีไปอีกหลายปี และนั่นคือทั้งหมดที่สัญญากำหนดไว้\n\nถึงเวลารับค่าจ้างแล้ว"
 laamp_base_contract_schemes.2012.a: "$laamp_base_contract_schemes.0000.generic_option.proceed.neutral$"

 laamp_base_contract_schemes.2013.t: "$laamp_base_contract_schemes.2011.t$: ล้มเหลว!"
 laamp_base_contract_schemes.2013.desc: "แน่นอนว่ามันไม่ใช่งานง่าย\n\nถ้ามันง่าย [employer.GetTitledFirstName] คงจะปล่อยให้เจ้าหน้าที่ปกติของ [employer.GetHerHis] จัดการ: แต่คณะของข้าและตัวข้ากลับต้องใช้เวลาอันมีค่าบนโลกนี้ไปเท่าไหร่ก็ไม่รู้ [ROOT.Char.GetFaith.HealthGodName]-เท่านั้นที่รู้ ในการรับมือกับ #EMP พวกไพร่ดื้อด้าน หัวทึบ งี่เง่าเหลือทน#! ที่ปัญญาอันไร้ขีดจำกัดของ [ROOT.Char.GetFaith.CreatorName] เคยสร้างขึ้นมา\n\nดินแดนนี้และผู้คนของมันต้องสืบสายเลือดกันเองจนถึงที่สุดอย่างแน่นอน เพราะไม่มีอะไรนอกจากนั้นที่จะสามารถสร้างคนโง่เขลา เช่นนี้ได้\n\nน่าเศร้าที่ผลการสำรวจสำมะโนประชากรที่ได้มานั้นไม่น่าเชื่อถือเลยแม้ แต่น้อย และค่าจ้างของเราจะไม่มาถึง"
 laamp_base_contract_schemes.2013.a: "$laamp_base_contract_schemes.0000.generic_option.proceed.negative.light$"

 laamp_base_contract_schemes.2021.t: "สถาปัตยกรรมสมัครเล่น"
 laamp_base_contract_schemes.2021.desc: "แผนการก่อสร้างของ [employer.GetTitledFirstNamePossessive] ... บางทีอาจจะขาดการไตร่ตรองไปบ้าง อย่างน้อย นั่นคือสิ่งที่คณะของข้าและตัวข้าเห็น ไม่น่าแปลกใจเลยที่ช่างเขียนแบบของ [employer.GetHerHis] ประสบปัญหา\n\nถึงกระนั้น นั่นไม่ควรเป็นปัญหาสำหรับเรา เรารู้ว่า [employer.GetSheHe] พยายามสร้างอะไร เราแค่ต้องหาวิธีที่จะ #EMP ทำ#! มันจริง ๆ และเราเป็นกึ่งมืออาชีพที่มีทักษะ\n\nอย่างน้อยก็ประเภทหนึ่ง"
 laamp_base_contract_schemes.2021.a: "$laamp_base_contract_schemes.0000.generic_option.success_chance$"
 laamp_base_contract_schemes.2021.b: "$laamp_base_contract_schemes.0000.generic_option.speed$"
 laamp_base_contract_schemes.2021.c: "$laamp_base_contract_schemes.0000.generic_option.progress$"
 laamp_base_contract_schemes.2021.d: "$laamp_base_contract_schemes.0000.generic_option.nothing$"
 laamp_base_contract_schemes.2021.d.tt: "$laamp_base_contract_schemes.0000.d.no_starting_bonus$"

 laamp_base_contract_schemes.2022.t: "$laamp_base_contract_schemes.2021.t$: สำเร็จ!"
 laamp_base_contract_schemes.2022.desc: "เช่นเคย คณะของข้าและตัวข้าเป็นแบบอย่างของประสิทธิภาพ การก่อสร้างรวดเร็ว ผลลัพธ์แข็งแรงและน่าจดจำ และ แม้ว่า [employer.GetTitledFirstName] จะต้องสานต่องานที่ดีของเราต่อไป เราก็ได้มอบทุกสิ่งที่ [employer.GetHerHim] ต้องการเพื่อทำ เช่นนั้นให้ [employer.GetSheHe] แล้ว\n\nด้วยภาระค่าจ้างที่สมควรได้รับ เราเตรียมพร้อมที่จะจากไป"
 laamp_base_contract_schemes.2022.a: "$laamp_base_contract_schemes.0000.generic_option.proceed.neutral$"

 laamp_base_contract_schemes.2023.t: "$laamp_base_contract_schemes.2021.t$: ล้มเหลว!"
 laamp_base_contract_schemes.2023.desc: "มีอาคารที่ตก แต่งอย่างสวยงามบางแห่งใน [employer.GetCapitalLocation.GetCounty.GetTitle.GetBaseNameNoTier]\n\nเพียง แต่ไม่ใช่ของเรา\n\nเมื่อพิจารณาถึงการเอียง วัสดุที่ไม่ได้มาตรฐาน ไม้ที่ยื่นออกมา — ไม่ต้องพูดถึงไฟไหม้ทั้งสองครั้งระหว่างการก่อสร้าง — เราโชคดีที่ไม่ต้องเผชิญข้อหาทางอาญา\n\nถึงกระนั้น นั่นอาจเปลี่ยนแปลงไปพร้อมกับความต้องการของ [employer.GetTitledFirstNamePossessive] ได้ตลอดเวลา ซึ่งหมายความว่าเราควรจะจากไปดีกว่า"
 laamp_base_contract_schemes.2023.a: "$laamp_base_contract_schemes.0000.generic_option.proceed.negative.light$"

 laamp_base_contract_schemes.2031.t: "การชี้ขาด"
 laamp_base_contract_schemes.2031.desc: "ทางตันทางการเมืองเป็นปรากฏการณ์ที่น่าสนใจ: พรรคการเมืองท้องถิ่นที่ทรงอำนาจสองหรือสามพรรคภายใน [employer.GetCapitalLocation.GetCounty.GetTitle.GetBaseNameNoTier] กำลังโต้เถียงกันอย่างแข็งขัน แต่ไม่สามารถหรือไม่เต็มใจที่จะก้าวหน้าไปด้วยความประสงค์ของตนเอง\n\nข้อพิพาทของพวกเขาเกี่ยวกับตำแหน่งที่แน่นอนของเขตแดนภายในบางแห่งต้องการใครสักคนที่ไม่มีอคติเพื่อรับฟังข้อเท็จจริงและสำรวจที่ดิน หากคำตอบของเราน่าพอใจเพียงพอ เราจะได้รับค่าตอบแทนอย่างงาม"
 laamp_base_contract_schemes.2031.a: "$laamp_base_contract_schemes.0000.generic_option.success_chance$"
 laamp_base_contract_schemes.2031.b: "$laamp_base_contract_schemes.0000.generic_option.speed$"
 laamp_base_contract_schemes.2031.c: "$laamp_base_contract_schemes.0000.generic_option.progress$"
 laamp_base_contract_schemes.2031.d: "$laamp_base_contract_schemes.0000.generic_option.nothing$"
 laamp_base_contract_schemes.2031.d.tt: "$laamp_base_contract_schemes.0000.d.no_starting_bonus$"

 laamp_base_contract_schemes.2032.t: "$laamp_base_contract_schemes.2031.t$: สำเร็จ!"
 laamp_base_contract_schemes.2032.desc: "เราได้แก้ไขข้อพิพาทเรื่องเขตแดนใน [employer.GetCapitalLocation.GetCounty.GetTitle.GetBaseNameNoTier] อย่างแท้จริงหรือไม่?\n\nบางทีอาจจะไม่ แต่คำตัดสินที่เราได้มา #EMP ได้#! ทำให้เสียงบ่นของพวกเขาลดลงสู่ระดับที่ยอมรับได้ จากมุมมองของ [employer.GetTitledFirstNamePossessive] นั่นคือทั้งหมดที่เราถูกจ้างมาทำจริง ๆ และ ดังนั้นงานของเราจึงเสร็จสิ้นอย่างถูกต้อง\n\nค่าจ้างมาถึงทันที"
 laamp_base_contract_schemes.2032.a: "$laamp_base_contract_schemes.0000.generic_option.proceed.neutral$"

 laamp_base_contract_schemes.2033.t: "$laamp_base_contract_schemes.2031.t$: ล้มเหลว!"
 laamp_base_contract_schemes.2033.desc: "การตะโกน การกรีดร้อง ข้อกล่าวหาเรื่องการติดสินบนและการสมคบคิด... การพยายามจัดการให้ข้อพิพาทเรื่องเขตแดนใน [employer.GetCapitalLocation.GetCounty.GetTitle.GetBaseNameNoTier] จบลงอย่างสันติเป็น #EMP ประสบการณ์#! อย่างแท้จริง\n\nมิต้องสงสัย เราจะไม่ได้รับค่าจ้างสำหรับครั้งนี้ แต่อย่างน้อยเราก็ไม่ถูกปรับ\n\nอย่างน้อยก็ถ้าเราเคลื่อนไหวอย่างรวดเร็ว"
 laamp_base_contract_schemes.2033.a: "$laamp_base_contract_schemes.0000.generic_option.proceed.negative.light$"

 laamp_base_contract_schemes.2041.t: "ภาษีพิเศษ"
 laamp_base_contract_schemes.2041.desc: "ข้าแน่ใจว่าผู้คนดี ๆ ในดินแดนของ [employer.GetTitledFirstNamePossessive] คุ้นเคยดีกับ [employer.GetHerHim] ที่เรียกเก็บค่าผ่านทางและทศางค์จากพวกเขาโดยแจ้งให้ทราบล่วงหน้าเพียงเล็กน้อย ดังนั้นค่าธรรมเนียมเล็กน้อยอีกหนึ่งอย่าง — และมีการเตือนล่วงหน้าจาก [employer.GetTitleAsNameNoTooltip] เสียด้วย — ไม่ควรจะ ทำให้ต้องเลิกคิ้วเลยแม้ แต่น้อย\n\nเราเตรียมตราประทับปลอมของตำแหน่งและทบทวนเรื่องราวของเราอีกครั้ง พร้อมที่จะบุกไปยังชุมชนแรกด้วยหีบสมบัติที่อ้ากว้างรออยู่\n\nสิ่งนี้ควรจะทำกำไรได้ #EMP งาม#! ทีเดียว"
 laamp_base_contract_schemes.2041.a: "$laamp_base_contract_schemes.0000.generic_option.success_chance$"
 laamp_base_contract_schemes.2041.b: "$laamp_base_contract_schemes.0000.generic_option.speed$"
 laamp_base_contract_schemes.2041.c: "$laamp_base_contract_schemes.0000.generic_option.progress$"
 laamp_base_contract_schemes.2041.d: "$laamp_base_contract_schemes.0000.generic_option.nothing$"
 laamp_base_contract_schemes.2041.d.tt: "$laamp_base_contract_schemes.0000.d.no_starting_bonus$"

 laamp_base_contract_schemes.2042.t: "$laamp_base_contract_schemes.2041.t$: สำเร็จ!"
 laamp_base_contract_schemes.2042.desc: "เป็นการง่ายอย่างน่ารำคาญที่จะแยกผู้คนออกจากทรัพย์สมบัติของพวกเขาเมื่อพวกเขาคิดว่าท่านมีสิทธิ์ที่จะทำ เช่นนั้น และได้รับการสนับสนุนจาก [employer.GetTitleAsNameNoTooltip] ของพวกเขาด้วย บางคนสงสัยในตอนแรก แต่ท่าทีที่เข้มงวดเพียงพอและการขู่คลุมเครือถึงผู้มีอำนาจสูงกว่าก็ ทำให้ แต่ละคนยอมจำนนเมื่อเวลาผ่านไป\n\nข่าวการหลบหนีของเราจะแพร่ออกไปอย่างไม่ต้องสงสัย — สิ่งสำคัญคือเราไม่ถูกค้นพบ ในขณะที่มัน #EMP กำลังเกิดขึ้น#! \n\nในระหว่างนี้ เราไม่ควรโอ้เอ้ มันคงน่าเสียดายหาก [employer.GetFirstName] รู้ว่า [employer.GetSheHe] มี "ภาษี" อย่างเป็นทางการบางอย่างอยู่นอกท้องพระคลัง"
 laamp_base_contract_schemes.2042.a: "$laamp_base_contract_schemes.0000.generic_option.proceed.neutral$"

 laamp_base_contract_schemes.2043.t: "$laamp_base_contract_schemes.2041.t$: ล้มเหลว!"
 laamp_base_contract_schemes.2043.desc: "บางที... บางทีอาจมีเหตุผลที่ผู้คนไม่ลองทำสิ่งนี้บ่อยขึ้น\n\nครั้งแล้วครั้งเล่าที่ชาวบ้านขับไล่เราออกจากพื้นที่ ประณามเราว่าเป็นคนแปลกหน้าและชาวต่างชาติ เรียกร้องหลักฐานยืนยันตัวตนเพิ่มเติม ปฏิเสธที่จะเชื่อว่า [employer.GetTitleAsNameNoTooltip] ของพวกเขาจะเรียกเก็บภาษีเพิ่มเติมโดยไม่มีการเตือนหรือประกาศ\n\nจะเป็นการดีที่สุดถ้าเราจากไป แม้ว่าจะไม่มีกำไรที่แท้จริง ก่อนที่ [employer.GetFirstName] จะได้ยินสิ่งที่เกิดขึ้นที่นี่"
 laamp_base_contract_schemes.2043.a: "$laamp_base_contract_schemes.0000.generic_option.proceed.negative.light$"

 laamp_base_contract_schemes.2044.t: "$laamp_base_contract_schemes.2041.t$"
 laamp_base_contract_schemes.2044.desc: "$laamp_base_contract_schemes.2041.desc$"
 laamp_base_contract_schemes.2044.tt.destination_list.6_destinations: "ท่านจะเริ่ม [traveling|E] ไปยัง [destination_1.GetNameNoTier] ทันที จากนั้นไปยัง [destination_2.GetNameNoTier], [destination_3.GetNameNoTier], [destination_4.GetNameNoTier], [destination_5.GetNameNoTier], และสุดท้าย [destination_6.GetNameNoTier]"
 laamp_base_contract_schemes.2044.tt.destination_list.5_destinations: "ท่านจะเริ่ม [traveling|E] ไปยัง [destination_1.GetNameNoTier] ทันที จากนั้นไปยัง [destination_2.GetNameNoTier], [destination_3.GetNameNoTier], [destination_4.GetNameNoTier], และสุดท้าย [destination_5.GetNameNoTier]"
 laamp_base_contract_schemes.2044.tt.destination_list.4_destinations: "ท่านจะเริ่ม [traveling|E] ไปยัง [destination_1.GetNameNoTier] ทันที จากนั้นไปยัง [destination_2.GetNameNoTier], [destination_3.GetNameNoTier], และสุดท้าย [destination_4.GetNameNoTier]"
 laamp_base_contract_schemes.2044.tt.destination_list.3_destinations: "ท่านจะเริ่ม [traveling|E] ไปยัง [destination_1.GetNameNoTier] ทันที จากนั้นไปยัง [destination_2.GetNameNoTier], และสุดท้าย [destination_3.GetNameNoTier]"
 laamp_base_contract_schemes.2044.tt.explanation: "#TUT เพื่อทำให้ [task_contract|E] สำเร็จ:\n$EFFECT_LIST_BULLET$ทำความท้าทาย [stewardship|E], [intrigue|E], หรือ [GetCourtPositionType('master_bard_camp_officer').GetName()] [aptitude|E] ให้สำเร็จในแต่ละจุดหมายปลายทาง\n$EFFECT_LIST_BULLET$ชนะหนึ่งในสามของความท้าทายของท่านสำหรับ $label_success_qualified$\n$EFFECT_LIST_BULLET$ชนะสองในสามของความท้าทายของท่านสำหรับความสำเร็จธรรมดา\n$EFFECT_LIST_BULLET$ชนะความท้าทายทั้งหมดของท่านสำหรับ $label_success_critical$\n$EFFECT_LIST_BULLET$@warning_icon! #N การล้มเหลว #BOL สอง#! หรือมากกว่านั้นในความท้าทายใดๆ จะ ทำให้ $game_concept_task_contract$ ล้มเหลว#!\n$EFFECT_LIST_BULLET$@alert_icon! #alert_trial ความท้าทายที่สำเร็จแต่ละครั้งจะเพิ่มความยากของการทดสอบครั้งต่อไปเล็กน้อย — มากขึ้นสำหรับ [skill|E] หรือ $game_concept_aptitude$ ที่ทดสอบ#!#!"
 laamp_base_contract_schemes.2044.a: "$travel.stationary_domicile.option.t$"
 laamp_base_contract_schemes.2044.b: "$travel.mobile_domicile.option.t$"

 #################################################
 # Base Intrigue Scheme Events

 laamp_base_contract_schemes.3001.t: "การลาดตระเวนเชิงรุก"
 laamp_base_contract_schemes.3001.desc: "การเรียกร้องรายงานที่มีการศึกษาเกี่ยวกับเหตุการณ์ที่เกิดขึ้นรอบเมืองหลวงของ [employer.GetTitledFirstNamePossessive] ดึงดูดนักต้มตุ๋นทุกประเภท กระตือรือร้นที่จะหารายได้ง่าย ๆ สำหรับข่าวลือที่แข็งทื่อหรือการกุเรื่องที่เห็นได้ชัด\n\nโชคดีสำหรับ [employer.GetHerHim] คณะของข้าและตัวข้าไม่ใช่คนโง่เขลาธรรมดาที่แห่กันไปที่ห้องโถงของ [employer.GetHerHis] และสามารถแลกเปลี่ยนเรื่องราวที่ #EMP น่าสนใจ#! มากกว่าเกี่ยวกับดินแดนเพื่อนบ้านได้ — แม้ว่าพวกมันจะมีประโยชน์เพียงใดนั้นขึ้นอยู่กับ [employer.GetTitleAsNameNoTooltip] ผู้ดีงาม..."
 laamp_base_contract_schemes.3001.a: "$laamp_base_contract_schemes.0000.generic_option.success_chance$"
 laamp_base_contract_schemes.3001.b: "$laamp_base_contract_schemes.0000.generic_option.speed$"
 laamp_base_contract_schemes.3001.c: "$laamp_base_contract_schemes.0000.generic_option.progress$"
 laamp_base_contract_schemes.3001.d: "$laamp_base_contract_schemes.0000.generic_option.nothing$"
 laamp_base_contract_schemes.3001.d.tt: "$laamp_base_contract_schemes.0000.d.no_starting_bonus$"

 laamp_base_contract_schemes.3002.t: "$laamp_base_contract_schemes.3001.t$: สำเร็จ!"
 laamp_base_contract_schemes.3002.desc: "สายตาและหูที่เฉียบคมจะค้นพบหลายสิ่งหลายอย่างขณะที่กลุ่มเดินทาง โดยต้องใช้ความพยายามเพิ่มเติมเพียงเล็กน้อยนอกเหนือจากความเต็มใจที่จะสังเกตและความทรงจำในรายละเอียด\n\nหลักการง่าย ๆ แต่ผู้ที่บุ่มบ่ามและหุนหันพลันแล่นมักล้มเหลวได้ง่าย ตามที่คาดไว้ รายงาน #EMP ของเรา#! พิสูจน์แล้วว่าให้ข้อมูลเพียงพอที่จะ ทำให้เราไม่เพียง แต่ได้รับค่าจ้าง แต่ยังได้รับการต้อนรับที่ขยายเวลาออกไปเล็กน้อย\n\nสร้างความขุ่นเคืองใจให้กับผู้ที่อยากจะเป็นสายลับที่เหลืออยู่เป็นอย่างมาก"
 laamp_base_contract_schemes.3002.a: "$laamp_base_contract_schemes.0000.generic_option.proceed.neutral$"

 laamp_base_contract_schemes.3003.t: "$laamp_base_contract_schemes.3001.t$: ล้มเหลว!"
 laamp_base_contract_schemes.3003.desc: "เมื่อเราเข้าสู่ [employer.GetCapitalLocation.GetTitle.GetBaseNameNoTier] ข้ามั่นใจว่าเรื่องราวของเราเป็นเรื่องจริง มีรายละเอียด เป็นบันทึกที่เป็นประโยชน์... หรือไม่? เรา... เรามั่นใจมาก\n\nแต่การพักอยู่กับ [employer.GetTitledFirstName] ของเรา แม้จะเริ่มต้นอย่างเป็นมิตรเพียงพอ แต่ก็กลายเป็นปัญหาอย่างรวดเร็ว สายลับที่ส่งไปตามเบาะแสที่เราให้ไว้กลับมาอย่างขมขื่นหรือไม่กลับมาเลย ส่งผลให้เกิดข้อกล่าวหาเรื่องการก่อวินาศกรรมโดยเจตนาและความมุ่งร้าย การโต้เถียงที่ยืดเยื้อและดังลั่น\n\nพอจะกล่าวได้ว่า นี่ไม่ใช่สถานที่ปลอดภัยสำหรับเราอีกต่อไป"
 laamp_base_contract_schemes.3003.a: "$laamp_base_contract_schemes.0000.generic_option.proceed.negative.light$"

 laamp_base_contract_schemes.3004.t: "$laamp_base_contract_schemes.3001.t$"
 laamp_base_contract_schemes.3004.desc: "$laamp_base_contract_schemes.3001.desc$\n\nแต่ก่อนอื่น เราจะต้องไปเยือนสถานที่สองสามแห่งที่ [employer.GetFirstNameNoTooltip] สนใจที่จะรู้เพิ่มเติมอย่างรอบคอบ"
 laamp_base_contract_schemes.3004.tt.destination_list: "ท่านจะเริ่ม [traveling|E] ไปยัง [destination_1.GetNameNoTier] ทันที จากนั้นไปยัง [destination_2.GetNameNoTier] แล้วไปยัง [destination_3.GetNameNoTier]"
 laamp_base_contract_schemes.3004.tt.explanation: "#TUT เพื่อทำ [task_contract|E] ให้สำเร็จ:\n$EFFECT_LIST_BULLET$ผ่านบททดสอบ [intrigue|E] หรือ [diplomacy|E] ณ จุดหมายปลายทางแต่ละแห่ง\n$TAB$$EFFECT_LIST_BULLET$ท่านจะถูกท้าทายโดยผู้ที่เก่งกว่าระหว่าง [ruler|E] ในท้องถิ่นหรือ [spymaster|E] ของพวกเขา\n$EFFECT_LIST_BULLET$อีกทางหนึ่ง ท่านสามารถรับประกันความสำเร็จได้โดยการเผา [prestige|E] และเสีย [opinion|E] กับพวกเขา\n$TAB$$EFFECT_LIST_BULLET$ค่าใช้จ่าย [prestige|E] เพิ่มขึ้นตามสัดส่วนของ [title_tier|E] ของ [ruler|E]\n$EFFECT_LIST_BULLET$การไม่สำเร็จเลยส่งผลให้เกิด $label_failure_standard$\n$EFFECT_LIST_BULLET$การสำเร็จหนึ่งครั้งส่งผลให้เกิด $label_success_qualified$\n$EFFECT_LIST_BULLET$การสำเร็จสองครั้งส่งผลให้เกิด $label_success_standard$\n$EFFECT_LIST_BULLET$การสำเร็จสามครั้งส่งผลให้เกิด $label_success_critical$#!"
 laamp_base_contract_schemes.3004.a: "$travel.stationary_domicile.option.t$"
 laamp_base_contract_schemes.3004.b: "$travel.mobile_domicile.option.t$"

 laamp_base_contract_schemes.3011.t: "การแก้ปมปัญหา"
 laamp_base_contract_schemes.3011.desc: ""ข้าไม่ต้องการให้มันช้า แค่ส่ง [target.GetTitledFirstName] ไปสู่อ้อมกอดของ [employer.GetFaith.DeathDeityNamePossessive] เพื่อที่ข้าจะได้เลิกคิดถึง [target.GetHerHim] เราเข้าใจตรงกันหรือไม่?" [employer.GetTitledFirstName] คำราม\n\nข้าพยักหน้า มีหลายอย่างที่ไม่ได้พูดออกมา — ทำไม [employer.GetSheHe] ถึงต้องการให้ [target.GetWomanMan] ผู้นี้ตาย อะไรที่พันธนาการมือของ [employer.GetHerHis] จากวิธีการทั่วไป — แต่ไม่มีเรื่องใดเป็นธุระของข้า\n\nหนึ่งชีวิตที่สั้นลงและถึงวันจ่ายเงิน"
 laamp_base_contract_schemes.3011.a: "$laamp_base_contract_schemes.0000.generic_option.success_chance$"
 laamp_base_contract_schemes.3011.b: "$laamp_base_contract_schemes.0000.generic_option.speed$"
 laamp_base_contract_schemes.3011.c: "$laamp_base_contract_schemes.0000.generic_option.secrecy$"
 laamp_base_contract_schemes.3011.d: "$laamp_base_contract_schemes.0000.generic_option.nothing$"
 laamp_base_contract_schemes.3011.d.tt: "$laamp_base_contract_schemes.0000.d.no_starting_bonus$"

 laamp_base_contract_schemes.3012.t: "$laamp_base_contract_schemes.3011.t$: สำเร็จ!"
 laamp_base_contract_schemes.3012.desc: ""ใบเสร็จของท่าน [employer.GetTitleAsNameNoTooltip]" ข้าพูด พลางทิ้งถุงเปียกชื้นลงบนพื้นของ [employer.GetFirstNameNicknamedPossessive] ผ้าที่ชุ่มน้ำเอียงไปด้านข้าง เผยให้เห็นกระจุกผมยาวตรงของ [target.GetTitledFirstNamePossessive]\n\n"เจ้าเอาคำว่า 'นำศีรษะของ [target.GetHerHis] มาให้ข้า' ตามตัวอักษรเกินไปหน่อย" [employer.GetSheHe] คำราม "คงเป็นนรกที่ต้องหนีออกมาพร้อมกับมัน ถึงกระนั้น ก็เป็นงานที่ทำได้ดี ค่าจ้างของเจ้าอยู่กับคนรับใช้ข้างนอก"\n\nข้าก้มศีรษะลงด้วยความเคารพและจากไป"
 laamp_base_contract_schemes.3012.a: "$laamp_base_contract_schemes.0000.generic_option.proceed.neutral$"

 laamp_base_contract_schemes.3013.t: "$laamp_base_contract_schemes.3011.t$: ล้มเหลว!"
 laamp_base_contract_schemes.3013.desc: ""ตอนนี้ [target.GetTitledFirstName] รู้แล้วว่ามีคนตามล่าศีรษะของ [target.GetHerHis] เหรอ? เจ้าโง่!" [employer.GetTitledFirstName] คำราม "ทำไมข้าถึง #EMP เชื่อใจ#! เจ้า? หึ!"\n\nข้าสั่นไหล่ อ้าปากเพื่ออธิบาย... ข้อผิดพลาดที่ ทำให้เหยื่อของเราหนีพ้นชะตากรรมไปได้ แต่ [employer.GetFirstNamePossessiveNoTooltip] ยื่นมือออกมาชี้ไปที่ลานด้านนอก\n\n"เจ้าจะไม่ได้รับค่าจ้างสำหรับงานที่ยังไม่เสร็จ ออกไปจาก [employer.Custom('FortifiedBuilding')] ของข้า ก่อนที่ข้าจะระบายความผิดหวังใส่ #EMP เจ้า#!""
 laamp_base_contract_schemes.3013.a: "$laamp_base_contract_schemes.0000.generic_option.proceed.negative.light$"

 laamp_base_contract_schemes.3021.t: "การได้มา ซึ่งศัตรู"
 laamp_base_contract_schemes.3021.desc: "คำแนะนำจาก [employer.GetTitledFirstName] ชัดเจน: หาเวลาที่ [target.GetTitledFirstName] อ่อนแอ กำจัดยามใด ๆ ที่ [target.GetSheHe] อาจมี และนำ [target.GetHerHim] กลับมายัง [employer.GetCapitalLocation.GetTitle.GetBaseNameNoTier] ทั้งเป็นและถูกล่ามโซ่\n\nง่ายพอ [employer.GetTitleAsNameNoTooltip] ผู้ดีงามไม่ได้ลงรายละเอียดมากนักว่า #EMP ทำไม#! [employer.GetSheHe] ถึงต้องการให้ [target.GetWomanMan] คนนี้ถูกลักพาตัวโดยอันธพาลลับ ๆ แต่ไม่ใช่หน้าที่ของเราที่จะถามจริง ๆ"
 laamp_base_contract_schemes.3021.a: "$laamp_base_contract_schemes.0000.generic_option.success_chance$"
 laamp_base_contract_schemes.3021.b: "$laamp_base_contract_schemes.0000.generic_option.speed$"
 laamp_base_contract_schemes.3021.c: "$laamp_base_contract_schemes.0000.generic_option.secrecy$"
 laamp_base_contract_schemes.3021.d: "$laamp_base_contract_schemes.0000.generic_option.nothing$"
 laamp_base_contract_schemes.3021.d.tt: "$laamp_base_contract_schemes.0000.d.no_starting_bonus$"

 laamp_base_contract_schemes.3022.t: "$laamp_base_contract_schemes.3021.t$: สำเร็จ!"
 laamp_base_contract_schemes.3022.desc: ""[employer.GetTitledFirstName]" [target.GetTitledFirstName] ถ่มน้ำลาย ขณะที่ข้าดึงถุงออกจากศีรษะของ [target.GetHerHis] "ข้าน่าจะรู้ว่าเป็น #EMP เจ้า#!."\n\n[employer.GetFirstNameNoTooltip] [employer.Custom('Saying_3p_SmilesSeems')] และทำท่าให้นักโทษคุกเข่าลง โดยไม่รอช้า ข้าเตะ [target.GetHerHim] ที่หลังส่วนล่าง ส่ง [target.GetWomanMan] ล้มลงกับพื้น\n\n"งานยอดเยี่ยม [ROOT.Char.GetFirstNameNoTooltip]" นายจ้างของข้าร้องออกมาขณะที่ [employer.GetSheHe] โยนกระเป๋าหนักให้ข้า "คุ้มค่าทุกเหรียญ""
 laamp_base_contract_schemes.3022.a: "$laamp_base_contract_schemes.0000.generic_option.proceed.neutral$"

 laamp_base_contract_schemes.3023.t: "$laamp_base_contract_schemes.3021.t$: ล้มเหลว!"
 laamp_base_contract_schemes.3023.desc: ""ข้าเห็นว่าไม่มี [target.GetFirstName] อยู่เลย [ROOT.Char.GetFirstNameNoTooltip]" [employer.GetTitledFirstName] พูดเหน็บแนม พลางชี้ไปรอบ ๆ ห้องทำงานของ [employer.GetHerHis] "เรามีสัญญาว่าเจ้าจะนำคนโง่มาให้ข้า แต่ข้าไม่เห็นคนโง่ที่ข้าขอ ใช่ไหม?"\n\nข้ากัดฟันและส่ายหน้า\n\n"เจ้าโชคดีที่ข้ามุ่งเน้นไปที่เหยื่อรายอื่น [ROOT.Char.Custom('GetLaampDescribeTypeInsult')] ตอนนี้ไปเสีย ก่อนที่เจ้าจะผลาญความปรารถนาดีของข้าไปมากกว่านี้""
 laamp_base_contract_schemes.3023.a: "ออกจากห้องทำงานไป"

 laamp_base_contract_schemes.3031.t: "คำพูดเผ็ดร้อน"
 laamp_base_contract_schemes.3031.desc: "การสนทนากับ [employer.GetTitledFirstName] นั้น... กระจ่างแจ้งยิ่งนัก [employer.GetSheHe|U] ดูเหมือนจะเดือดดาลด้วยโทสะจากการดูหมิ่นเล็กน้อยบางอย่างจาก [target.GetFirstNameNoTooltip] ไม่ว่าจะจริงหรือคิดไปเองก็ตาม และกระตือรือร้นที่จะนำ [target.GetWomanMan] ไปไว้ในที่ของ[target.GetHerHis] แต่ก็ยังไม่พร้อมที่จะให้มีการนองเลือดมากเกินไป\n\nแผนการของ [employer.GetTitleAsNamePossessiveNoTooltip] คือให้พวกเราวางเพลิงทรัพย์สินเล็กน้อยบางอย่างที่เป็นของ [target.GetFirstNameNoTooltip] การทำตามคำขอนี้จะจุดชนวนความตึงเครียดอย่างไม่ต้องสงสัย แต่งานก็คืองาน"
 laamp_base_contract_schemes.3031.a: "$laamp_base_contract_schemes.0000.generic_option.success_chance$"
 laamp_base_contract_schemes.3031.b: "$laamp_base_contract_schemes.0000.generic_option.speed$"
 laamp_base_contract_schemes.3031.c: "$laamp_base_contract_schemes.0000.generic_option.progress$"
 laamp_base_contract_schemes.3031.d: "$laamp_base_contract_schemes.0000.generic_option.nothing$"
 laamp_base_contract_schemes.3031.d.tt: "$laamp_base_contract_schemes.0000.d.no_starting_bonus$"

 laamp_base_contract_schemes.3032.t: "$laamp_base_contract_schemes.3031.t$: สำเร็จ!"
 laamp_base_contract_schemes.3032.desc: "คณะของข้าและตัวข้ามีความสุขเกินกว่าจะรายงานการลอบวางเพลิงที่ประสบความสำเร็จของเราต่อ [employer.GetTitledFirstName] ซึ่ง [employer.Custom('PartAglow_EyesFaceBody')] ขณะที่ [employer.GetSheHe] ฟังเรื่องราวการลอบเร้นและไฟของเรา\n\n"#EMP ดี#! ดี! งานยอดเยี่ยม [ROOT.Char.GetFirstName]" [employer.GetTitleAsNameNoTooltip] หัวเราะเบา ๆ "[target.GetFirstName] จะรู้สึกถึงสิ่งนี้ไปอีกนาน"\n\nด้วยท่าทาง คนรับใช้ก็เข้ามา ถือค่าจ้างของเราเป็นเงิน"
 laamp_base_contract_schemes.3032.a: "$laamp_base_contract_schemes.0000.generic_option.proceed.neutral$"

 laamp_base_contract_schemes.3033.t: "$laamp_base_contract_schemes.3031.t$: ล้มเหลว!"
 laamp_base_contract_schemes.3033.desc: "ความพยายามในการลอบวางเพลิงของเราในไม่ช้าก็กลายเป็นการนองเลือดที่ตื่นตระหนก: คนรับใช้จับเราได้และส่งเสียงเตือนก่อนที่เราจะสามารถแทงไอ้สารเลวนั่นได้\n\nในการต่อสู้ที่ตามมา แม้ว่าเราจะทาดาบของเราด้วยเลือดของพวกเขามากกว่าที่พวกเขาทาด้วยเลือดของเรา แต่เปลวไฟเล็ก ๆ ที่ริบหรี่เพียงดวงเดียวที่เราจุดขึ้นก็ดับลง\n\n[employer.GetTitledFirstName] ปฏิเสธที่จะพบเรา เพื่อที่เราจะได้อธิบาย ยุ่งเกินกว่าจะลงโทษเรา แต่ก็ไม่มีโอกาสได้รับค่าจ้าง เช่นกัน"
 laamp_base_contract_schemes.3033.a: "$laamp_base_contract_schemes.0000.generic_option.proceed.negative.light$"

 laamp_base_contract_schemes.3034.t: "$laamp_base_contract_schemes.3031.t$"
 laamp_base_contract_schemes.3034.desc: "จดหมายจาก [employer.GetTitledFirstName] นั้น... กระจ่างแจ้งยิ่งนัก [employer.GetSheHe|U] ดูเหมือนจะเดือดดาลด้วยโทสะจากการดูหมิ่นเล็กน้อยบางอย่างจาก [target.GetFirstNameNoTooltip] ไม่ว่าจะจริงหรือคิดไปเองก็ตาม และกระตือรือร้นที่จะนำ [target.GetWomanMan] ไปไว้ในที่ของ[target.GetHerHis] แต่ก็ยังไม่พร้อมที่จะให้มีการนองเลือดมากเกินไป\n\nแผนการของ [employer.GetTitleAsNamePossessiveNoTooltip] คือให้พวกเราวางเพลิงทรัพย์สินเล็กน้อยบางอย่างที่ [target.GetFirstNameNoTooltip] เกี่ยวข้องด้วย หรือ มิฉะนั้นก็ลดทอนมันลงด้วยวิธีใดก็ตามที่เห็นสมควร\n\nการทำตามคำขอนี้จะจุดชนวนความตึงเครียดอย่างไม่ต้องสงสัย แต่งานก็คืองาน"
 laamp_base_contract_schemes.3034.tt.destination_list: "ท่านจะเริ่ม [traveling|E] ไปยัง [destination_1.GetNameNoTier] ทันที"
 laamp_base_contract_schemes.3034.tt.explanation: "#TUT เพื่อทำ [task_contract|E] ให้สำเร็จ:\n$EFFECT_LIST_BULLET$ผ่านบททดสอบ [intrigue|E], [martial|E] หรือ [prowess|E], หรือ [aptitude|E] ของ [officer|E] ประเภทต่าง ๆ ณ จุดหมายปลายทาง\n$EFFECT_LIST_BULLET$[intrigue|E] มีให้เลือกเสมอ\n$EFFECT_LIST_BULLET$ท่านจะสามารถทดสอบ [martial|E] หรือ [prowess|E] ได้หรือไม่ ขึ้นอยู่กับเป้าหมาย\n$EFFECT_LIST_BULLET$[officer|E] ที่เก่งที่สุดของท่านที่ถูกต้องตามเงื่อนไขก็จะพร้อมใช้งาน ขึ้นอยู่กับเป้าหมาย\n$EFFECT_LIST_BULLET$ท่านจะสามารถถอนตัวได้โดยได้รับผลเพียง $label_failure_qualified$ เมื่อท่านมาถึง หากท่านคิดว่าบททดสอบยากเกินไป#!"
 laamp_base_contract_schemes.3034.a: "$travel.stationary_domicile.option.t$"
 laamp_base_contract_schemes.3034.b: "$travel.mobile_domicile.option.t$"

 laamp_base_contract_schemes.3041.t: "การลักทรัพย์เล็กน้อย"
 laamp_base_contract_schemes.3041.desc: "การลาดตระเวนเบื้องต้นรอบ ๆ [employer.GetCapitalLocation.GetTitle.GetBaseNameNoTier] บ่งชี้ว่าเรา #EMP อาจจะ#! สามารถทำสิ่งนี้ได้สำเร็จ: ไม่ใช่ที่เดียวที่ [employer.GetTitledFirstName] เก็บเหรียญของ [employer.GetHerHis] ไว้ แต่ที่ดินของ [employer.GetHerHis] ที่นี่มี #EMP จำนวนมาก#! อย่างแน่นอน และยามดูเหมือนจะไม่คาดคิดถึงการสู้รบ\n\nกล่าวอีกนัยหนึ่งคือ เสี่ยง แต่ทำได้\n\nสิ่งที่เราต้องการคือแผนการอันแยบยล..."
 laamp_base_contract_schemes.3041.a: "$laamp_base_contract_schemes.0000.generic_option.success_chance$"
 laamp_base_contract_schemes.3041.b: "$laamp_base_contract_schemes.0000.generic_option.speed$"
 laamp_base_contract_schemes.3041.c: "$laamp_base_contract_schemes.0000.generic_option.progress$"
 laamp_base_contract_schemes.3041.d: "$laamp_base_contract_schemes.0000.generic_option.nothing$"
 laamp_base_contract_schemes.3041.d.tt: "$laamp_base_contract_schemes.0000.d.no_starting_bonus$"

 laamp_base_contract_schemes.3042.t: "$laamp_base_contract_schemes.3041.t$: สำเร็จ!"
 laamp_base_contract_schemes.3042.desc: "สะเดาะกลอนอย่างเงียบเชียบตรงนี้ แทงยามอย่างสุขุมตรงนั้น และทันใดนั้น... ทรัพย์สมบัติแห่ง [employer.GetPrimaryTitle.GetNameNoTier] ก็ปรากฏต่อหน้าเรา\n\nถุงของเราเต็มอย่างรวดเร็วที่สุดเท่าที่จะทำได้ และเราก็จากไป ช่างหัวผลที่จะตามมา\n\nก็แค่... หวังว่าเราจะไม่โดนแขวนคอ"
 laamp_base_contract_schemes.3042.a: "[employer.GetTitledFirstNameNoTooltip] ช่างเป็นคนเซ่อเสียจริง!"
 laamp_base_contract_schemes.3042.b: "เจ้ารู้ไหม... ยังมีอีกมากที่นั่น..."
 laamp_base_contract_schemes.3042.b.tt.possible_haul: "[employer.GetTitledFirstName] มีของที่ปล้นได้เหลืออยู่ถึง [gold_i][varcheck.MakeScope.Var('haul_possible').GetValue|P0] ทั้ง [gold|E] และเครื่องประดับ ซึ่งสามารถขโมยเพิ่มได้ทีละ [gold_i][varcheck.MakeScope.Var('haul_increment').GetValue|P0]"
 laamp_base_contract_schemes.3042.b.tt.explanation: "#TUT เมื่อกลับไป ท่านจะ:\n$EFFECT_LIST_BULLET$สามารถทดสอบ [intrigue|E] ของท่านเพื่อขโมยเพิ่มได้เสมอ\n$EFFECT_LIST_BULLET$ทดสอบหนึ่งในข้อต่อไปนี้แบบสุ่ม:\n$TAB$$EFFECT_LIST_BULLET$[martial|E], [prowess|E], หรือ [stewardship|E]\n$TAB$$EFFECT_LIST_BULLET$[prowess|E] หรือ [intrigue|E] ของ [agents|E] คนใดคนหนึ่งของท่าน\n$TAB$$EFFECT_LIST_BULLET$ความถนัดของ [GetCourtPositionType('master_thief_camp_officer').GetName()] หรือ [GetCourtPositionType('master_of_spoils_camp_officer').GetName()] ของท่าน\n$EFFECT_LIST_BULLET$รับ [stress|E] เพื่อผ่านการทดสอบโดยอัตโนมัติ\n$EFFECT_LIST_BULLET$หลบหนีไปพร้อมกับรายได้ของท่าน\n$EFFECT_LIST_BULLET$หากท่านล้มเหลวสองครั้ง ท่านจะถูกจำคุกและรายได้ของท่านจะถูกริบ#!\n$EFFECT_LIST_BULLET$ท่านได้รับประสบการณ์ [GetTrait('gallowsbait').GetName( GetNullCharacter )] เพิ่มเติมตามสัดส่วนของจำนวนที่ท่านขโมย"
 laamp_base_contract_schemes.3042.b.tt.current_earnings: "#TUT รายได้ของท่านจากสัญญาได้รับการรักษาความปลอดภัยแล้วและจะยังคงเป็นของท่านไม่ว่าอย่างไรก็ตาม#!"
 laamp_base_contract_schemes.3042.b.tt.you_go_back_for_more: "ย้อนกลับเข้าไปใน [employer.Custom('ResidenceBuilding')|l] พร้อมที่จะปล้น!"

 laamp_base_contract_schemes.3043.t: "$laamp_base_contract_schemes.3041.t$: ล้มเหลว!"
 laamp_base_contract_schemes.3043.desc: "ให้ตายเถอะ!\n\nท้องพระคลังของ [employer.GetFirstNamePossessiveNoTooltip|U] มียามมากกว่าที่เราคิด อยู่ในเส้นทางลาดตระเวนที่แตกต่างจากที่เราคาดไว้ — แม้ แต่ดวงจันทร์เองก็ทรยศเราด้วยคืนที่สว่างไสว...\n\nการแทรกซึมของเรากลายเป็นการนองเลือดที่โกลาหลไม่นานหลังจากที่เราปีนกำแพงด้านนอก เราไม่มีเงินจะแสดง มีเพียงบริวารที่ไล่ตามอย่างร้อนรนและบาดแผลที่แสบร้อนเพื่อตอบแทนความพยายามของเรา"
 laamp_base_contract_schemes.3043.a: "$laamp_base_contract_schemes.0000.generic_option.proceed.negative.light$"

 #################################################
 # Base Learning Scheme Events

 laamp_base_contract_schemes.4001.t: "ปากกาขนนกรับจ้าง"
 laamp_base_contract_schemes.4001.desc: ""แน่นอน หากมันไม่ #EMP มาก#! เกินไปสำหรับท่าน" [employer.GetTitledFirstName] ยิ้ม พลางวางมัด [ROOT.Char.Custom('GetWritingMaterial')] ที่รวมไว้บนโต๊ะ "แค่เหล่านั้น"\n\nสักพัก [employer.GetSheHe] ก็เพิ่มม้วน [ROOT.Char.Custom('GetWritingMaterial')] อีกสองม้วน และ [ROOT.Char.Custom('GetWritingMaterial')] อีกตั้งหนึ่ง และหนังสือเล่มเล็กอีกเล่ม\n\nข้าเลิกคิ้ว และ [employer.GetTitleAsNameNoTooltip] ก็ดึงหนังสือเล่มที่หนักกว่าเล็กน้อยออกจากลิ้นชัก วางมันไว้บนสุดของกอง\n\n""เอ่อ ก็แค่ #EMP เหล่านั้น#!""
 laamp_base_contract_schemes.4001.a: "$laamp_base_contract_schemes.0000.generic_option.success_chance$"
 laamp_base_contract_schemes.4001.b: "$laamp_base_contract_schemes.0000.generic_option.speed$"
 laamp_base_contract_schemes.4001.c: "$laamp_base_contract_schemes.0000.generic_option.progress$"
 laamp_base_contract_schemes.4001.d: "$laamp_base_contract_schemes.0000.generic_option.nothing$"
 laamp_base_contract_schemes.4001.d.tt: "$laamp_base_contract_schemes.0000.d.no_starting_bonus$"

 laamp_base_contract_schemes.4002.t: "$laamp_base_contract_schemes.4001.t$: สำเร็จ!"
 laamp_base_contract_schemes.4002.desc: "ข้ากลับไปยังห้องโถงของ [employer.GetTitledFirstNamePossessive] ด้วยอารมณ์ดี นิ้วเปื้อนหมึกและตาแดงก่ำจากการอดนอน แต่งานของข้าเสร็จแล้ว\n\nหนึ่งในคณะของข้านำกองงานที่เสร็จสมบูรณ์ตามหลังข้ามา เดินโซเซภายใต้น้ำหนักของกองที่สุมกันระเกะระกะ\n\n"เสร็จแล้วหรือ? ข้าว่าข้าน่าจะให้งานท่านเพิ่มอีกหน่อยนะ" [employer.GetTitleAsNameNoTooltip] พูดติดตลก ก่อนจะโบกมือให้เราออกไป "อย่าทิ้งไว้ในนี้ คนรับใช้ของข้าจะหาคนมาอ่านผลงานการรู้หนังสือของท่าน และดูแลเรื่องค่าจ้างของท่านเอง""
 laamp_base_contract_schemes.4002.a: "$laamp_base_contract_schemes.0000.generic_option.proceed.neutral$"

 laamp_base_contract_schemes.4003.t: "$laamp_base_contract_schemes.4001.t$: ล้มเหลว!"
 laamp_base_contract_schemes.4003.desc: ""นั่งลง" [employer.GetTitledFirstName] ผู้หงุดหงิดสั่ง พลางชูกระดาษหนังที่เปื้อนหมึก ซึ่งเต็มไปด้วยลายเส้นขยุกขยิกอ่านไม่ออก "เจ้ารู้หรือไม่ว่านี่เขียนว่าอะไร?"\n\nข้าส่ายหน้า\n\n"ข้าก็ไม่รู้เหมือนกัน เพราะ #EMP นี่หาใช่ตัวอักษรไม่#! คณะคนชั่วของเจ้าได้คัดลอกไปนานเท่าไหร่ก็ไม่รู้ [employer.GetFaith.KnowledgeGodName]-เท่านั้นที่รู้ และ #EMP นี่#! คือทั้งหมดที่พวกเจ้ามีมาแสดงให้เห็นรึ? ข้าไม่จ่ายเงินสำหรับหมึกที่หกเลอะเทอะโดยประมาท เอา 'สำเนา' ของเจ้าไปแล้วออกไป!""
 laamp_base_contract_schemes.4003.a: "$laamp_base_contract_schemes.0000.generic_option.proceed.negative.light$"

 laamp_base_contract_schemes.4011.t: "การแก้ไขปัญหาเทววิทยา"
 laamp_base_contract_schemes.4011.desc: ""... และนั่นคือสาระสำคัญของเรื่อง" [employer.GetTitledFirstName] พูดจบ "ท่านมีอะไรจะเสริมหรือไม่ [chaplain.GetTitledFirstName]?"\n\n[chaplain.GetCouncilTitle] สั่นศีรษะของ [chaplain.GetHerHis] "ท่านสรุปได้ดีแล้ว [employer.GetLadyLord] — หากหน้าที่ของข้ามิได้เรียกหาข้าไปที่อื่นแล้วไซร้ ข้ายินดีที่จะเป็นผู้ชี้ขาด แต่..."\n\n[employer.GetTitleAsNameNoTooltip] ยกมือขึ้น เพื่อให้ [chaplain.GetHerHim] หยุด "อย่ากังวลไปเลย ข้ามั่นใจว่า [ROOT.Char.GetFirstName] จะรับมือกับ [employer.GetFaith.PriestNeuterPlural] ที่ชอบโต้เถียงของเราได้ดีพอ""
 laamp_base_contract_schemes.4011.a: "พวกเขาจะเลวร้ายได้อย่างไรกัน?"
 laamp_base_contract_schemes.4011.b: "$laamp_base_contract_schemes.0000.generic_option.speed$"
 laamp_base_contract_schemes.4011.c: "$laamp_base_contract_schemes.0000.generic_option.progress$"
 laamp_base_contract_schemes.4011.d: "$laamp_base_contract_schemes.0000.generic_option.nothing$"
 laamp_base_contract_schemes.4011.d.tt: "$laamp_base_contract_schemes.0000.d.no_starting_bonus$"

 laamp_base_contract_schemes.4012.t: "$laamp_base_contract_schemes.4011.t$: สำเร็จ!"
 laamp_base_contract_schemes.4012.desc: "การโต้วาทีกลับกลายเป็นเรื่องง่ายที่จะแก้ไขอย่างน่าประหลาดใจในท้ายที่สุด: ทั้งสองฝ่ายต่างยุ่งอยู่กับการสาดโคลนใส่กันจนแม้ แต่การเรียกร้องอย่างคลุมเครือถึงจิตวิญญาณแห่งความสามัคคีของ [ROOT.Char.GetFaith.GetReligion.GetName] ก็เอาชนะใจคนกลางที่ไม่พอใจได้\n\n[employer.GetFaith.PriestNeuterPlural] ที่เป็นหัวใจของการสนทนายังคงคุกรุ่นใส่กัน แต่ด้วยคนอื่น ๆ ที่ยังคงเกี่ยวข้องน้อยลง ความเสี่ยงที่จะลุกลามไปสู่สิ่งที่เลวร้ายกว่านั้นจึงมีน้อย\n\n[employer.GetTitledFirstName] ดูมีความสุข ไม่ว่า อย่างไรก็ตาม"
 laamp_base_contract_schemes.4012.a: "$laamp_base_contract_schemes.0000.generic_option.proceed.neutral$"

 laamp_base_contract_schemes.4013.t: "$laamp_base_contract_schemes.4011.t$: ล้มเหลว!"
 laamp_base_contract_schemes.4013.desc: "นั่น... เป็นการนองเลือดที่มากกว่าการโต้วาทีด้วยวาจาควรจะมีมาก\n\nการสนทนาบานปลายไปสู่การตะโกน การตะโกนไปสู่ความคลั่งไคล้ ความคลั่งไคล้ไปสู่การดูหมิ่น และจากนั้นก็เป็นเพียงเรื่องของเวลาก่อนที่ใครสักคนจะชกต่อย แม้กระทั่งตอนนี้ ความล้มเหลวก็ยังคงหมุนวนจนควบคุมไม่ได้อยู่เบื้องหลังเรา\n\nพอจะกล่าวได้ว่า เราจะไม่ได้รับค่าจ้างใด ๆ สำหรับครั้งนี้"
 laamp_base_contract_schemes.4013.a: "$laamp_base_contract_schemes.0000.generic_option.proceed.negative.light$"

 laamp_base_contract_schemes.4021.t: "ผลผลิตทางปัญญา"
 laamp_base_contract_schemes.4021.desc: "การสนทนาของข้ากับ [employer.GetTitledFirstName] พิสูจน์แล้วว่า... ให้ความกระจ่าง\n\nดูเหมือนว่าสิ่งที่ [employer.GetSheHe] ต้องการคือจุลสารที่มีไหวพริบเกี่ยวกับคติพจน์และภูมิปัญญาดั้งเดิมของ [ROOT.Char.GetCulture.GetName] สิ่งที่จะ ทำให้ [employer.GetHerHim] ดูเหมือนเป็นผู้อุปถัมภ์ศิลปะอย่างแท้จริง\n\nสิ่งนี้จะยากได้อย่างไร?"
 laamp_base_contract_schemes.4021.a: "$laamp_base_contract_schemes.0000.generic_option.success_chance$"
 laamp_base_contract_schemes.4021.b: "$laamp_base_contract_schemes.0000.generic_option.speed$"
 laamp_base_contract_schemes.4021.c: "$laamp_base_contract_schemes.0000.generic_option.progress$"
 laamp_base_contract_schemes.4021.d: "$laamp_base_contract_schemes.0000.generic_option.nothing$"
 laamp_base_contract_schemes.4021.d.tt: "$laamp_base_contract_schemes.0000.d.no_starting_bonus$"

 laamp_base_contract_schemes.4022.t: "$laamp_base_contract_schemes.4021.t$: สำเร็จ!"
 laamp_base_contract_schemes.4022.desc: "อีกราชสำนักหนึ่ง อีกผู้อุปถัมภ์ที่มีความสุขอีกคน!\n\nจุลสาร "ว่าด้วยเล่ห์เหลี่ยมและความลึกลับมากมายของชาว [ROOT.Char.GetCulture.GetName]" นั้นกระชับอย่างมีศิลปะ แต่ #EMP ก็#! มีไหวพริบเพียงพอที่จะ ทำให้ราชสำนักฮือฮาด้วยแก่นเรื่องตามจารีตและความคิดที่เป็นเหตุเป็นผล\n\nไม่น่าจะคงอยู่นาน ไม่ต้องพูดถึงการได้รับสำเนาจำนวนมาก แต่มัน ทำให้เราได้รับค่าจ้างสำหรับตอนนี้และนั่นก็เพียงพอแล้ว"
 laamp_base_contract_schemes.4022.a: "$laamp_base_contract_schemes.0000.generic_option.proceed.neutral$"

 laamp_base_contract_schemes.4023.t: "$laamp_base_contract_schemes.4021.t$: ล้มเหลว!"
 laamp_base_contract_schemes.4023.desc: ""เรื่องไร้สาระ! นี่มัน #EMP เรื่องไร้สาระ#! อะไรกันที่เจ้าสร้างขึ้นมา [ROOT.Char.GetFirstName]?" [employer.GetTitledFirstName] ร้องออกมา พลิกดูหน้ากระดาษที่คณะของข้าและตัวข้าเตรียมไว้ "'คุณค่าที่แท้จริงของหัวใจมนุษย์นั้นไม่ยิ่งใหญ่ไปกว่าหยาดเหงื่อจากหน้าผากของเขา'? นั่นมัน #EMP หมายความว่าอะไร#!?!?!"\n\nข้าอ้าปากเพื่อตอบ เพื่ออธิบายคติพจน์ แต่ [employer.GetTitleAsNameNoTooltip] ผู้รังเกียจก็โยนต้นฉบับใส่ข้าและโบกมือให้ข้าออกไป\n\nดูเหมือนว่าข้าจะพูดมากพอแล้ว"
 laamp_base_contract_schemes.4023.a: "$laamp_base_contract_schemes.0000.generic_option.proceed.negative.light$"

 laamp_base_contract_schemes.4031.t: "การขอทาน"
 laamp_base_contract_schemes.4031.desc: "การพูดคุยเพื่อเข้าเฝ้า [employer.GetTitledFirstName] โชคดีที่พิสูจน์แล้วว่าง่ายอย่างน่าประหลาดใจ เพียงแค่ คำบอกใบ้ แห่งความลึกลับที่น่าดึงดูดเกี่ยวกับจุดประสงค์ของเราเพื่อหล่อลื่นวงล้อ\n\nเมื่อได้รับอนุญาตให้เข้าเฝ้า จุดประสงค์ของเราก็ชัดเจนขึ้นอย่างรวดเร็ว ในฐานะ [ROOT.Char.Custom('GetLaampDescribeTypeSelfPlural')] ผู้คงแก่เรียน เราพึ่งพาความเอื้อเฟื้อของผู้ปกครอง #EMP ผู้รู้แจ้ง#! เพื่อทำงานที่ดีของเราต่อไป และ ดังนั้น [employer.GetTitleAsNameNoTooltip] จึงตกลงอย่างไม่เต็มใจที่จะให้เราพักอยู่ชั่วระยะเวลาหนึ่ง — แต่เท่านั้น!\n\n... สำหรับตอนนี้"
 laamp_base_contract_schemes.4031.a: "$laamp_base_contract_schemes.0000.generic_option.success_chance$"
 laamp_base_contract_schemes.4031.b: "$laamp_base_contract_schemes.0000.generic_option.speed$"
 laamp_base_contract_schemes.4031.c: "$laamp_base_contract_schemes.0000.generic_option.progress$"
 laamp_base_contract_schemes.4031.d: "$laamp_base_contract_schemes.0000.generic_option.nothing$"
 laamp_base_contract_schemes.4031.d.tt: "$laamp_base_contract_schemes.0000.d.no_starting_bonus$"

 laamp_base_contract_schemes.4032.t: "$laamp_base_contract_schemes.4031.t$: สำเร็จ!"
 laamp_base_contract_schemes.4032.desc: "การพักอยู่กับ [employer.GetTitledFirstName] ของเรานั้นให้ผลกำไรอย่างยิ่งในท้ายที่สุด: เสน่ห์ที่ยั่งยืนและกลอุบายทางวิชาการค่อย ๆ ลดความสงสัยของ [employer.GetTitleAsNamePossessive] ลง กล่อม [employer.GetHerHim] ให้อยู่ในสภาวะของความสนใจที่ถูกชักจูง จากนั้นของขวัญแห่งการอุปถัมภ์ก็เริ่มไหลมาเทมาอย่างแท้จริง\n\nเป็นความพยายามที่อุดมสมบูรณ์อย่างแน่นอน แต่ความปรารถนาดีนี้จะไม่คงอยู่ตลอดไป ดังนั้นโดยธรรมชาติแล้วเราจะจากไปก่อนที่จะอยู่เกินความต้อนรับ\n\n[employer.GetCapitalLocation.GetTitle.GetName] ได้เมตตาต่อหีบสมบัติของเราอย่างยิ่ง"
 laamp_base_contract_schemes.4032.a: "$laamp_base_contract_schemes.0000.generic_option.proceed.neutral$"

 laamp_base_contract_schemes.4033.t: "$laamp_base_contract_schemes.4031.t$: ล้มเหลว!"
 laamp_base_contract_schemes.4033.desc: "ตลอดการพักอยู่ของเรา ท่าทีของ [employer.GetTitledFirstNamePossessive] ที่มีต่อเรามี แต่จะแย่ลง — ไม่ได้ช่วยอะไรเลยจากความพยายามของเราที่จะหลอกล่อของขวัญและคำสัญญาจาก [employer.GetHerHim] ในโอกาสเพียงเล็กน้อย\n\nทุกวันที่ผ่านไป ความขุ่นเคืองของ [employer.GetTitleAsNamePossessiveNoTooltip] ก็เพิ่มมากขึ้น เมื่อการคำนวณผิดพลาดของข้าปรากฏชัดเจนขึ้น ข้อหาคนจรจัดที่หลีกเลี่ยงไม่ได้ ซึ่งรอเราอยู่หากเรายังคงโอ้เอ้อยู่ที่นี่ก็ เช่นกัน"
 laamp_base_contract_schemes.4033.a: "$laamp_base_contract_schemes.0000.generic_option.proceed.negative.light$"

 laamp_base_contract_schemes.4041.t: "ทุกเครื่องประดับคือสมบัติ"
 laamp_base_contract_schemes.4041.desc: "\"และชิ้นนี้เล่า\" [employer.GetTitledFirstName] กล่าว พลางพิจารณาก้อนหินแกะสลักเล็ก ๆ สีเขียวอมฟ้า \"ดีสำหรับโรคเกาต์รึ? เจ้ามีของหลากหลายทีเดียว [ROOT.Char.GetFirstName]\"\n\n\"หากท่าน[employer.GetLadyLord]ของข้าประสงค์ ข้าสามารถให้คนไปนำของแปลก ๆ ของเราบางชิ้นมาจากสัมภาระได้หรือไม่ขอรับ?\" ถ้อยคำหลั่งไหลออกจากปากข้าอย่างราบรื่นและมั่นใจ \"ดังที่ท่านเห็น เรามีทรัพย์สินมากมายที่จะเสนอให้แก่ตัวท่านและราชสำนักของท่าน\"\n\n[employer.GetTitleAsName] พยักหน้า แสดงความยินยอมของ[employer.GetHerHis]ให้พวกเราพักอยู่ชั่วระยะเวลาหนึ่ง"
 laamp_base_contract_schemes.4041.a: "$laamp_base_contract_schemes.0000.generic_option.success_chance$"
 laamp_base_contract_schemes.4041.b: "$laamp_base_contract_schemes.0000.generic_option.speed$"
 laamp_base_contract_schemes.4041.c: "$laamp_base_contract_schemes.0000.generic_option.progress$"
 laamp_base_contract_schemes.4041.d: "$laamp_base_contract_schemes.0000.generic_option.nothing$"
 laamp_base_contract_schemes.4041.d.tt: "$laamp_base_contract_schemes.0000.d.no_starting_bonus$"

 laamp_base_contract_schemes.4042.t: "$laamp_base_contract_schemes.4041.t$: สำเร็จ!"
 laamp_base_contract_schemes.4042.desc: "เวลาของเราใน [employer.GetCapitalLocation.GetTitle.GetName] นั้นให้ผลกำไรอย่างมหาศาล! การค้าขายด้วยตราประทับการอนุมัติโดยปริยายของ [employer.GetTitledFirstNamePossessive] ช่วยเพิ่มความชอบธรรมให้กับสินค้าของเรา ซึ่งการพูดเร็วทั้งหมดในโลกก็ไม่สามารถทำได้\n\nเครื่องราง ยา ของจุกจิก และของเล่น — ข้าราชบริพารและแขกซื้อทั้งหมด ไม่มีการถามคำถาม\n\nยังไม่ใช่ อย่างน้อยก็ตอนนี้ เราจะจากไปนานแล้วเมื่อความกังวลของพวกเขาเริ่มเข้ามา"
 laamp_base_contract_schemes.4042.a: "$laamp_base_contract_schemes.0000.generic_option.proceed.neutral$"

 laamp_base_contract_schemes.4043.t: "$laamp_base_contract_schemes.4041.t$: ล้มเหลว!"
 laamp_base_contract_schemes.4043.desc: "ข้าราชบริพารของ [employer.GetTitledFirstNamePossessive] ฉลาดกว่าที่พวกเขาดูเป็น... ทีละคน คำโกหกเล็ก ๆ น้อย ๆ ของเราถูกสงสัยก่อนแล้วจึงถูกเปิดโปง ค่อย ๆ ทำลายชื่อเสียงของเราในฐานะผู้ขายยาแก้สารพัดโรคที่แปลกใหม่\n\nที่เลวร้ายกว่านั้น ความหลอกลวงที่ชัดเจนของเรา ทำให้ [employer.GetTitleAsNameNoTooltip] ดูแย่: ไม่ว่า [employer.GetSheHe] จะอนุญาตเราหรือถูกเราหลอก และทั้งสองอย่างไม่ได้ ทำให้เราเป็นที่รักของระบอบการปกครอง\n\nไม่ว่า อย่างไรก็ตาม เป็นการดีที่สุดที่เราจะจากไป — แม้ว่าจะไม่มีกำไร — ก่อนที่ความโกรธเกรี้ยวของ [employer.GetFirstNamePossessiveNoTooltip] จะปะทุกลายเป็นความรุนแรงทางกายภาพ"
 laamp_base_contract_schemes.4043.a: "$laamp_base_contract_schemes.0000.generic_option.proceed.negative.light$"

 #################################################
 # Base Prowess Scheme Events

 laamp_base_contract_schemes.5001.t: "[employer.Custom('GetOutOfControlAnimalTypePlural')|U] สู่การเชือด"
 laamp_base_contract_schemes.5001.desc: "หนังสือจาก [employer.GetTitledFirstName] นั้นเรียบง่าย: ตัดหัว [employer.Custom('GetOutOfControlAnimalTypePlural')] ให้มากที่สุดเท่าที่เราจะทำได้ และหากจำนวนของเราพิสูจน์ได้ว่าน่าประทับใจ ก็จะได้รับสิทธิ์ในการล่าสัตว์ในดินแดนของ [employer.GetHerHis] ชั่วระยะเวลาหนึ่ง\n\nดินแดนทั้งหมดที่จะย่องตาม... นั่นหมายถึงเนื้อที่จะหมักเกลือ หนังที่จะฟอก เขาและกีบที่จะตัด ขุมทรัพย์รอบด้าน\n\nเป็นการเผชิญหน้าที่น่าตื่นเต้นและให้ผลกำไร กล่าวโดยรวม"
 laamp_base_contract_schemes.5001.a: "$laamp_base_contract_schemes.0000.generic_option.success_chance$"
 laamp_base_contract_schemes.5001.b: "$laamp_base_contract_schemes.0000.generic_option.speed$"
 laamp_base_contract_schemes.5001.c: "$laamp_base_contract_schemes.0000.generic_option.progress$"
 laamp_base_contract_schemes.5001.d: "$laamp_base_contract_schemes.0000.generic_option.nothing$"
 laamp_base_contract_schemes.5001.d.tt: "$laamp_base_contract_schemes.0000.d.no_starting_bonus$"

 laamp_base_contract_schemes.5002.t: "$laamp_base_contract_schemes.5001.t$: สำเร็จ!"
 laamp_base_contract_schemes.5002.desc: "คณะของข้าและตัวข้าได้ห่มคลุมตนเองด้วยเกียรติยศจากการล่าครั้งนี้: [employer.Custom('GetOutOfControlAnimalTypePlural')] จำนวนมากนอนตายด้วยน้ำมือของเรา ทำให้เราเป็นที่นิยมของชาวนาและ [employer.GetTitledFirstName] เหมือนกัน และผลผลิตที่เราเก็บเกี่ยวได้จากป่าก็อุดมสมบูรณ์อย่างแท้จริง\n\nสัมภาระของเราเต็มไปด้วยขนสัตว์และอาหาร เราได้ทำมากเกินพอที่จะเติมเต็มลูกธนูที่หายไปและหอกที่แตกหักของเรา"
 laamp_base_contract_schemes.5002.a: "$laamp_base_contract_schemes.0000.generic_option.proceed.neutral$"

 laamp_base_contract_schemes.5003.t: "$laamp_base_contract_schemes.5001.t$: ล้มเหลว!"
 laamp_base_contract_schemes.5003.desc: "[employer.Custom('GetOutOfControlAnimalTypePlural')] ไอ้ #EMP [employer.Custom('GetOutOfControlAnimalTypePlural')]!#! คืนแล้วคืนเล่า เราได้ยินเสียงคำรามของพวกมัน และคืนแล้วคืนเล่า กลุ่มล่าสัตว์ของเรากลับมาโดยขาดคนไปสองสามคน\n\nไม่ว่าเราจะฆ่าสัตว์ร้ายที่เปื้อนเลือดไปกี่ตัว ก็ดูเหมือนจะมีสัตว์ร้ายต้องสาปสามครั้งเหล่านี้เพิ่มขึ้นเสมอ ไม่น่าแปลกใจเลยที่ [employer.GetTitledFirstName] ไม่สามารถรับมือกับพวกมันได้\n\nเห็นได้ชัดว่าเราต้องตัดขาดทุน และทิ้งสัญญาอันเลวร้ายนี้ก่อนที่ป่าจะกลืนกินเราทั้งหมด"
 laamp_base_contract_schemes.5003.a: "ปล่อยให้กองทหารของ [employer.GetFirstNamePossessiveNoTooltip] ถูกฉีกเป็นชิ้น ๆ แทน!"

 laamp_base_contract_schemes.5011.t: "ยามรักษาการณ์"
 laamp_base_contract_schemes.5011.desc: "ไม่ว่าการโจมตีที่ [employer.GetTitledFirstName] คาดการณ์ต่อทรัพย์สินของพ่อค้ารายนี้จะเป็นจริงหรือจินตนาการ การปฏิบัติหน้าที่ยามนอกนั้นก็น่าเบื่อหน่าย แม้ว่าส่วนใหญ่จะจัดการโดยคณะก็ตาม\n\nถึงกระนั้น เราก็ได้รับค่าจ้าง เพื่อให้ตื่นตัวและมองเห็นได้ เป็นการแสดงแสนยานุภาพและการป้องกันจากผู้พิทักษ์แห่งดินแดน\n\nแม้ว่ามันจะหมายถึงการยืนอยู่ท่ามกลางสภาพอากาศทุกรูปแบบก็ตาม"
 laamp_base_contract_schemes.5011.a: "$laamp_base_contract_schemes.0000.generic_option.success_chance$"
 laamp_base_contract_schemes.5011.b: "$laamp_base_contract_schemes.0000.generic_option.speed$"
 laamp_base_contract_schemes.5011.c: "$laamp_base_contract_schemes.0000.generic_option.progress$"
 laamp_base_contract_schemes.5011.d: "$laamp_base_contract_schemes.0000.generic_option.nothing$"
 laamp_base_contract_schemes.5011.d.tt: "$laamp_base_contract_schemes.0000.d.no_starting_bonus$"

 laamp_base_contract_schemes.5012.t: "$laamp_base_contract_schemes.5011.t$: สำเร็จ!"
 laamp_base_contract_schemes.5012.desc: "#EMP การโจมตี#! เกือบจะรู้สึกว่าเป็นคำที่ยิ่งใหญ่เกินไปสำหรับอันธพาลสกปรกสองสามคนที่รีบเร่งเข้ามาในเวลาพลบค่ำในระลอกที่วางแผนมาไม่ดี แน่นอนเมื่อมันจบลงในเวลาไม่กี่นาที เหมือนการปะทะกันหรือการทะเลาะวิวาทในตรอกซอยมากกว่า\n\nถึงกระนั้น [employer.GetTitledFirstName] ดูเหมือนจะพอใจ\n\nอำนาจของ [employer.GetHerHis|U] ยังคงเด็ดขาด และนั่นคือทั้งหมดที่สำคัญ — ซึ่งหมายความว่าเราจะได้รับค่าจ้างอย่างดี"
 laamp_base_contract_schemes.5012.a: "$laamp_base_contract_schemes.0000.generic_option.proceed.neutral$"

 laamp_base_contract_schemes.5013.t: "$laamp_base_contract_schemes.5011.t$: ล้มเหลว!"
 laamp_base_contract_schemes.5013.desc: ""เราจ่ายเงินให้ท่านเพื่อเฝ้าสถานที่ และตอนนี้มันเหลือ แต่เถ้าถ่านและเลือดแห้งกรัง [ROOT.Char.GetFirstName]!" [employer.GetTitledFirstName] เห่า "ท่านถูกกลุ่มโจรชั้นต่ำจู่โจมโดยไม่รู้ตัวได้อย่างไร? ท่านมีงาน #EMP เดียว#! ที่ต้องทำ!"\n\nข้าอ้าปากเพื่อตอบ แต่ [employer.GetTitleAsNameNoTooltip] ตัดบทข้า\n\n"เงียบ ข้าไม่ต้องการข้อแก้ตัวของท่าน แค่ออกไป""
 laamp_base_contract_schemes.5013.a: "$laamp_base_contract_schemes.0000.generic_option.proceed.negative.light$"

 laamp_base_contract_schemes.5021.t: "พี่เลี้ยงของ [employer.GetTitleAsNamePossessiveNoTooltip]"
 laamp_base_contract_schemes.5021.desc: ""ดังนั้น ท่านคงเห็นแล้วว่าทำไมข้าถึงต้องการ... สายตาพิเศษสองสามคู่กระจายอยู่รอบ ๆ [employer.GetCapitalLocation.GetTitle.GetBaseNameNoTier]" [employer.GetTitledFirstName] กล่าว "ท่านจะให้การรักษาความปลอดภัยเพิ่มเติมอีกชั้นหนึ่ง เพื่อว่าหากมีบางสิ่งหลุดรอดผ่านบริวารปกติของข้าไปได้ — หรือบริวารเหล่านั้นลังเลในความภักดีของพวกเขา — ข้าก็ยังมีเหล็กกล้าที่ดีคอยคุ้มกันหลังข้าอยู่"\n\nข้าพยักหน้า เป็นสถานการณ์ที่ย่ำแย่ เมื่อท่านไม่สามารถไว้วางใจยามของท่านได้ แต่อย่างน้อยก็ดีสำหรับธุรกิจ\n\n"ยอดเยี่ยม งั้นท่านจะเริ่มทันที""
 laamp_base_contract_schemes.5021.a: "$laamp_base_contract_schemes.0000.generic_option.success_chance$"
 laamp_base_contract_schemes.5021.b: "$laamp_base_contract_schemes.0000.generic_option.speed$"
 laamp_base_contract_schemes.5021.c: "$laamp_base_contract_schemes.0000.generic_option.progress$"
 laamp_base_contract_schemes.5021.d: "$laamp_base_contract_schemes.0000.generic_option.nothing$"
 laamp_base_contract_schemes.5021.d.tt: "$laamp_base_contract_schemes.0000.d.no_starting_bonus$"

 laamp_base_contract_schemes.5022.t: "$laamp_base_contract_schemes.5021.t$: สำเร็จ!"
 laamp_base_contract_schemes.5022.desc: ""งานยอดเยี่ยม [ROOT.Char.GetFirstName] อย่างแท้จริง" [employer.GetTitledFirstName] ร้องออกมา "สุนัขทุกตัวถูกกำจัดด้วยความสง่างามและประสิทธิภาพ! ไม่แม้ แต่เส้นผมบนตัวข้าจะได้รับอันตรายจากพวกทรยศ"\n\n"ความสง่างามอาจจะเกินจริงไปหน่อย [employer.GetLadyLord] ของข้า" ข้าตั้งข้อสังเกต คนรับใช้ด้านหลังเรากำลังขัดถูเลือดเหนียว ๆ ออกจากปูนผนังอย่างขะมักเขม้น\n\n"บาห์ ให้ไส้ของพวกมันอยู่บนพรมดีกว่าของข้า ค่าจ้างของท่านจะถูกส่งมอบโดยเร็วที่สุด""
 laamp_base_contract_schemes.5022.a: "$laamp_base_contract_schemes.0000.generic_option.proceed.neutral$"

 laamp_base_contract_schemes.5023.t: "$laamp_base_contract_schemes.5021.t$: ล้มเหลว!"
 laamp_base_contract_schemes.5023.desc: "ทันทีที่มือสังหารผ่านเราไปได้ ข้ารู้ว่าเราต้องหนี และหนีให้เร็ว\n\nเราไม่สามารถตามพวกเขาทันเวลาที่จะสร้างความแตกต่างได้ และ แม้ว่าบริวารของ [employer.GetTitledFirstNamePossessive] อาจจะช่วย [employer.GetHerHim] ได้ หรืออาจจะไม่ อย่างไรก็ตาม.... จะต้องมีคนถูกแขวนคอ เพราะเรื่องนี้\n\nยิ่งเราโอ้เอ้อยู่ที่นี่นานเท่าไหร่ โอกาสที่คน ๆ นั้นจะเป็นข้าก็ยิ่งมากขึ้นเท่านั้น"
 laamp_base_contract_schemes.5023.a: "$laamp_base_contract_schemes.0000.generic_option.proceed.negative.light$"

 laamp_base_contract_schemes.5031.t: "นักปล้นปศุสัตว์"
 laamp_base_contract_schemes.5031.desc: "มีศิลปะในการขโมยสัตว์เป็นจำนวนมาก: ท่านต้องรู้ว่าท่านจะนำพวกมันไปที่ไหน ท่านไม่สามารถทำอย่างแนบเนียนได้ แต่ท่าน #EMP ต้อง#! ดูเหมือนว่าท่านเป็นพวกเดียวกัน และเมื่อท่านพบกับการต่อต้าน ความโหดร้ายจะต้องรวดเร็ว\n\nมิฉะนั้น ความเสี่ยงที่ฝูงสัตว์จะแตกตื่นหรือแม้กระทั่งสูญเสียการควบคุมฝูงสัตว์จะ ทำให้ความพยายามทั้งหมดตกอยู่ในอันตราย และเมื่อสิ่งต่าง ๆ ผิดพลาด กำไรจะจมลงเร็วกว่าเรือที่ถูกพายุซัด\n\nหวังว่า [employer.GetTitledFirstName] จะไม่ได้เฝ้าปศุสัตว์ของ [employer.GetHerHis] อย่างดี"
 laamp_base_contract_schemes.5031.a: "$laamp_base_contract_schemes.0000.generic_option.success_chance$"
 laamp_base_contract_schemes.5031.b: "$laamp_base_contract_schemes.0000.generic_option.speed$"
 laamp_base_contract_schemes.5031.c: "$laamp_base_contract_schemes.0000.generic_option.progress$"
 laamp_base_contract_schemes.5031.d: "$laamp_base_contract_schemes.0000.generic_option.nothing$"
 laamp_base_contract_schemes.5031.d.tt: "$laamp_base_contract_schemes.0000.d.no_starting_bonus$"

 laamp_base_contract_schemes.5032.t: "$laamp_base_contract_schemes.5031.t$: สำเร็จ!"
 laamp_base_contract_schemes.5032.desc: "ปฏิบัติการอันสวยงาม! หลังจากการเตรียมการอย่างมาก — วางแผนเส้นทาง จัดหาผู้ซื้อ และลาดตระเวนทุ่งหญ้า — นักปล้นปศุสัตว์ของเราเปิดฉากการบุกโจมตียามค่ำคืนอย่างต่อเนื่อง ขับไล่ฝูงสัตว์จำนวนมากออกไปตลอดช่วงสัปดาห์\n\n[employer.GetTitledFirstName] มิต้องกังวล สัตว์ร้ายของ [employer.GetHerHis] กำลังจะไปสู่บ้านที่ดีกว่าอย่างแน่นอน เจ้าของใหม่ของพวกมันมีกระเป๋าที่ลึกและทัศนคติที่ #EMP เอื้อเฟื้อ#! อย่างยิ่ง หลังจากทั้งหมด"
 laamp_base_contract_schemes.5032.a: "$laamp_base_contract_schemes.0000.generic_option.proceed.neutral$"

 laamp_base_contract_schemes.5033.t: "$laamp_base_contract_schemes.5031.t$: ล้มเหลว!"
 laamp_base_contract_schemes.5033.desc: "มัน... มันดูเหมือนจะไปได้สวยมาก\n\nเรารู้เส้นทาง เราวางแผนการโจมตีของเราแล้ว แต่ไม่ว่ากลิ่นเลือดจะ ทำให้สัตว์ตกใจ หรือเสียง หรือการเปลี่ยนแปลงกิจวัตร...\n\nคณะและข้าถูกบังคับให้แยกย้ายกันไป สุนัขล่าเนื้อของ [employer.GetTitledFirstNamePossessive] ไล่ตามติด และมีวัวควายที่ขโมยมาได้เพียงน้อยนิดที่จะแสดงให้เห็น"
 laamp_base_contract_schemes.5033.a: "$laamp_base_contract_schemes.0000.generic_option.proceed.negative.light$"

 laamp_base_contract_schemes.5034.t: "การปล้นปศุสัตว์"
 laamp_base_contract_schemes.5034.desc: "$laamp_base_contract_schemes.5031.desc$"
 laamp_base_contract_schemes.5034.a: "$travel.stationary_domicile.option.t$"
 laamp_base_contract_schemes.5034.b: "$travel.mobile_domicile.option.t$"
 laamp_base_contract_schemes.5034.tt.destination_list.5: "ท่านจะเริ่ม [traveling|E] ไปยัง [destination_1.GetNameNoTier] ทันที จากนั้นไปยัง [destination_2.GetNameNoTier], [destination_3.GetNameNoTier], [destination_4.GetNameNoTier], และสุดท้าย [destination_5.GetNameNoTier]"
 laamp_base_contract_schemes.5034.tt.destination_list.4: "ท่านจะเริ่ม [traveling|E] ไปยัง [destination_1.GetNameNoTier] ทันที จากนั้นไปยัง [destination_2.GetNameNoTier], [destination_3.GetNameNoTier], และสุดท้าย [destination_4.GetNameNoTier]"
 laamp_base_contract_schemes.5034.tt.destination_list.3: "ท่านจะเริ่ม [traveling|E] ไปยัง [destination_1.GetNameNoTier] ทันที จากนั้นไปยัง [destination_2.GetNameNoTier], และสุดท้าย [destination_3.GetNameNoTier]"
 laamp_base_contract_schemes.5034.tt.destination_list.2: "ท่านจะเริ่ม [traveling|E] ไปยัง [destination_1.GetNameNoTier] ทันที จากนั้นไปยัง [destination_2.GetNameNoTier]"
 laamp_base_contract_schemes.5034.tt.explanation: "#TUT เพื่อทำ [task_contract|E] ให้สำเร็จ:\n$EFFECT_LIST_BULLET$ผ่านบททดสอบ [prowess|E], [martial|E] หรือ [stewardship|E] ณ จุดหมายปลายทางแต่ละแห่ง\n$EFFECT_LIST_BULLET$หากท่านมี ท่านจะสามารถทดสอบความถนัดของ [officers|E] ที่เก่งที่สุดของท่านในตำแหน่ง [GetCourtPositionType('head_groom_camp_officer').GetName()], [GetCourtPositionType('huntperson_camp_officer').GetName()], [GetCourtPositionType('kennelperson_camp_officer').GetName()], หรือ [GetCourtPositionType('master_of_spoils_camp_officer').GetName()] แทนได้\n$EFFECT_LIST_BULLET$เพื่อให้สำเร็จ —\n$TAB$$EFFECT_LIST_BULLET$ชนะทุกบททดสอบเพื่อผลลัพธ์ $label_success_critical$\n$TAB$$EFFECT_LIST_BULLET$ชนะมากกว่าครึ่งหนึ่งของบททดสอบเพื่อผลลัพธ์ $label_success_standard$\n$TAB$$EFFECT_LIST_BULLET$ชนะอย่างน้อยหนึ่งบททดสอบเพื่อผลลัพธ์ $label_success_qualified$\n$TAB$$EFFECT_LIST_BULLET$แพ้ทุกบททดสอบเพื่อผลลัพธ์ $label_failure_standard$#!"

 laamp_base_contract_schemes.5041.t: "พรานเถื่อน"
 laamp_base_contract_schemes.5041.desc: "ดูเหมือนว่าดินแดนของ [employer.GetTitledFirstNamePossessive] จะเต็มไปด้วยสัตว์ป่าจำนวนมาก มากพอที่ [employer.GetSheHe] จะมีปัญหาบางอย่างกับพรานเถื่อนอยู่แล้ว\n\nอืม เมื่อพิจารณาถึงคณะ [ROOT.Char.Custom('GetLaampDescribeTypeSelfPlural')] ที่ร่าเริงของข้า มันคงจะหยาบคายที่จะปล่อยให้ [employer.GetTitleAsNameNoTooltip] ผู้ดีงามต้องแบกรับภาระ เช่นนั้น เราจะต้องช่วยโดยการเด็ดนกอ้วน ๆ เพียง #EMP สองสาม#! ตัว บางทีอาจจะถลกหนังสัตว์เพียง #EMP สองสาม#! ตัว..."
 laamp_base_contract_schemes.5041.a: "$laamp_base_contract_schemes.0000.generic_option.success_chance$"
 laamp_base_contract_schemes.5041.b: "$laamp_base_contract_schemes.0000.generic_option.speed$"
 laamp_base_contract_schemes.5041.c: "$laamp_base_contract_schemes.0000.generic_option.progress$"
 laamp_base_contract_schemes.5041.d: "$laamp_base_contract_schemes.0000.generic_option.nothing$"
 laamp_base_contract_schemes.5041.d.tt: "$laamp_base_contract_schemes.0000.d.no_starting_bonus$"

 laamp_base_contract_schemes.5042.t: "$laamp_base_contract_schemes.5041.t$: สำเร็จ!"
 laamp_base_contract_schemes.5042.desc: "อาาา การล่าที่น่าตื่นเต้นใน [employer.GetCapitalLocation.GetCounty.GetTitle.GetBaseNameNoTier]! ปล่อยให้บริวารของ [employer.GetTitledFirstNamePossessive] เรียกเราว่าพรานเถื่อน พวกเขามีเนื้อกวางมากกว่าที่พวกเขารู้ว่าจะทำอย่างไร และ [ROOT.Char.GetFaith.WealthGodName] รังเกียจความสิ้นเปลือง\n\nเราจากที่นี่ไปอย่างอ้วนพีและมีความสุข ท้องของเราเต็มและข้อมือของเราไม่ถูกใส่กุญแจมือ"
 laamp_base_contract_schemes.5042.a: "$laamp_base_contract_schemes.0000.generic_option.proceed.neutral$"

 laamp_base_contract_schemes.5043.t: "$laamp_base_contract_schemes.5041.t$: ล้มเหลว!"
 laamp_base_contract_schemes.5043.desc: "ให้ตายเถอะ ไอ้หมาพันธุ์ผสมของ [employer.GetTitledFirstName]!\n\nพวกมันไม่ #EMP ต้องการ#! สัตว์จำนวนมากขนาดนั้น แต่การไล่ตามอย่างไม่ลดละของพวกมันก็ทำลายการล่าครั้งแล้วครั้งเล่า และที่น่าอัปยศยิ่งกว่านั้นคือ จับคณะของข้าหลายคนใส่ตรวน\n\nข้ารู้ว่าเมื่อใดควรตัดขาดทุน ยิ่งเราอยู่ที่นี่นานเท่าไหร่ โอกาสที่ #EMP เรา#! จะกลายเป็นเหยื่อก็ยิ่งมากขึ้นเท่านั้น ไม่ใช่นกบ้า ๆ นั่น"
 laamp_base_contract_schemes.5043.a: "$laamp_base_contract_schemes.0000.generic_option.proceed.negative.light$"

 laamp_base_contract_schemes.5051.t: "การปล้นในตรอกซอย"
 laamp_base_contract_schemes.5051.desc: "ประกาศที่ [employer.GetTitledFirstName] แขวนไว้นั้นเป็นจริงยิ่งกว่าที่คาดไว้: [employer.GetCapitalLocation.GetTitle.GetBaseNameNoTier] ดูเหมือนจะกำลังประสบกับอาชญากรรมเล็กน้อยจำนวนมาก\n\nแม้กระทั่งเพียงแค่เดินทางเข้ามาในเมือง เราก็สามารถนับการล้วงกระเป๋าได้หนึ่งโหลและการปล้น ซึ่งหน้าหนึ่งครั้ง ซึ่งเป็นงานที่มากเกินไปสำหรับเจ้าของบ้านที่ถูกรุมเร้าของ [employer.GetTitleAsNameNoTooltip] ที่จะรับมือได้\n\nเป็นสภาพแวดล้อมที่สมบูรณ์แบบอย่างยิ่งสำหรับ [ROOT.Char.Custom('GetLaampDescribeTypeSelfPlural')] ที่มีหัวการค้า เช่นเราที่จะหา #EMP เหรียญ#! เล็กน้อย"
 laamp_base_contract_schemes.5051.a: "$laamp_base_contract_schemes.0000.generic_option.success_chance$"
 laamp_base_contract_schemes.5051.b: "$laamp_base_contract_schemes.0000.generic_option.speed$"
 laamp_base_contract_schemes.5051.c: "$laamp_base_contract_schemes.0000.generic_option.secrecy$"
 laamp_base_contract_schemes.5051.d: "$laamp_base_contract_schemes.0000.generic_option.nothing$"

 laamp_base_contract_schemes.5052.t: "$laamp_base_contract_schemes.5051.t$: สำเร็จ!"
 laamp_base_contract_schemes.5052.desc: "ต้องขอบคุณความไร้ความสามารถโดยสิ้นเชิงของ [employer.GetTitledFirstNamePossessive] ในการบังคับใช้ระเบียบบนถนนในเมืองหลวงของ [employer.GetHerHis] เอง [ROOT.Char.GetPrimaryTitle.GetDefinitiveName|l] จึงสามารถรีดไถพลเมืองโดยรวมของ [employer.GetCapitalLocation.GetTitle.GetBaseNameNoTier] ได้ทุกอย่างที่พวกเขามี\n\nอาจจะไม่ใช่วิธีหาเลี้ยงชีพที่มีเกียรติ แต่ให้ผลกำไรหรือไม่? อย่างยิ่ง\n\nถึงกระนั้น บทเรียนแรกที่อาชญากรผู้ทะเยอทะยานทุกคนเรียนรู้คือเมื่อใดควรเลิก เมื่อเราได้เหรียญของเราแล้ว ก็ถึงเวลาที่เราต้องจากไป — ก่อนที่ [employer.GetTitleAsNameNoTooltip] จะรู้เรื่องและตามหาเรา"
 laamp_base_contract_schemes.5052.a: "$laamp_base_contract_schemes.0000.generic_option.proceed.neutral$"

 laamp_base_contract_schemes.5053.t: "$laamp_base_contract_schemes.5051.t$: ล้มเหลว!"
 laamp_base_contract_schemes.5053.desc: "แม้ว่าเราจะมีความตั้งใจที่ดีที่สุด แต่ดูเหมือนว่า [employer.GetTitledFirstName] จะแก้ไขปัญหาของ [employer.GetHerHis] กับอาชญากรรายย่อยได้เร็วกว่าที่ [ROOT.Char.GetPrimaryTitle.GetDefinitiveName|l] จะใช้ประโยชน์จากพวกเขาได้\n\nเมื่อยามของ [employer.GetTitleAsNamePossessiveNoTooltip] หลั่งไหลเข้ามาท่วมถนนและหน้าต่างแห่งโอกาสของเราลดน้อยลงแม้จะมีกำไรต่าง ๆ นานาจนถึงตอนนี้ ข้าก็ถูกบังคับให้ลอบพาตัวเองและคณะของข้ากลับออกจาก [employer.GetCapitalLocation.GetTitle.GetBaseNameNoTier] ก่อนที่กฎหมายจะตามทันเรา\n\nดูเหมือนว่าเราจะไม่พบของปล้นเพิ่มเติมที่นี่"
 laamp_base_contract_schemes.5053.a: "บาห์ เราจะพบของปล้นที่ร่ำรวยกว่าที่อื่น"

