 laamp_base_contract_schemes.2667.t: "$laamp_base_contract_schemes.2031.t$: สำเร็จ!"
 laamp_base_contract_schemes.2667.desc.resolution_type.stewardship: "การเก็บภาษีคือการบัญชี และการบัญชีเป็นรูปแบบศิลปะที่ไม่ค่อยมีใครเห็นคุณค่าในทุกวันนี้\n\nด้วยรายการหน้าที่ในท้องถิ่นที่ให้มา ใช้เวลาส่วนใหญ่ของวันเพื่อตรวจสอบทุกเหตุการณ์ที่ #EMP ถูกกล่าวหา#! ว่ามีการเก็บภาษีเกินและแสดงให้เห็นว่านี่เป็นเพียงหน้าที่ที่ไม่ได้ชำระที่อื่น ผู้คนใน [employer.GetPrimaryTitle.GetBaseNameNoTier] พึมพำ แน่นอน แต่ส่วนใหญ่ก็ยอมทำตามในที่สุด\n\nสำหรับคนส่วนน้อยที่สามารถรวบรวมข้อแก้ต่างที่สำคัญได้ การยกเว้นภาษีของปีหน้าเป็นครั้งคราวก็ซื้อความเงียบที่สมรู้ร่วมคิดของพวกเขาได้ — แม้จะมีเสียงบ่นพึมพำจาก [employer.GetTitledFirstName]"
 laamp_base_contract_schemes.2667.desc.resolution_type.secondary_skill: "ผู้คนใน [employer.GetPrimaryTitle.GetBaseNameNoTier] เห็นได้ชัดว่าถือว่าตนเองซับซ้อน แต่พวกเขาไม่ได้คำนึงถึงลิ้นของ [ROOT.Char.GetWomanMan] ตระกูล [ROOT.Char.GetHouse.GetName]\n\nอย่างชำนาญ ข้าผูกมัดข้อคัดค้านเล็กน้อยของพวกเขาให้เป็นปม หว่านเมล็ดพันธุ์แห่งความสงสัยท่ามกลางพวกเขา เตือนพวกเขาถึงงานที่ดีทั้งหมดที่ [employer.GetTitledFirstName] ทำเพื่อรักษาความปลอดภัยให้พวกเขาขณะที่ #EMP เตือน#! พวกเขาอย่างละเอียดอ่อนว่าใครมีการผูกขาดกำลังในท้องถิ่น\n\nท้ายที่สุดแล้ว บางทีข้าอาจจะทาสีลิลลี่เล็กน้อย แต่... เมื่อท่านกำลังสนุก..."
 laamp_base_contract_schemes.2667.desc.resolution_type.left_sacrifice: "ดูเหมือนจะท้อแท้เล็กน้อยกับโอกาสที่จะถูกทิ้งไว้ข้างหลัง [sacrifice.GetTitledFirstName] อย่างไรก็ตามก็เริ่มที่จะรับฟังข้อคัดค้านนับพันและหนึ่งข้อของผู้คนใน [employer.GetPrimaryTitle.GetBaseNameNoTier]\n\n[employer.GetTitledFirstName|U] เดินพาข้าออกไปอย่างขอบคุณ ทิ้งให้ผู้ที่ด้อยกว่าเราทำงานหนักต่อไป\n\n"ใจดีมากที่ท่านทิ้งคนรับใช้ที่มีแนวโน้มดี เช่นนี้ไว้ให้เรา — ข้ารับรองกับท่านว่า [sacrifice.GetSheHe] จะได้รับการดูแลอย่างดีระหว่างการพักอยู่ของ [sacrifice.GetHerHis]! ตอนนี้ ข้าเชื่อว่ามีเรื่องค่าจ้างของท่าน...""
 laamp_base_contract_schemes.2667.desc.resolution_type.officer: "โชคดีที่ทักษะการจัดการของนายทหารพลาธิการ [officer.GetFirstNamePossessive] พิสูจน์แล้วว่าเพียงพอที่จะชนะในวันนี้\n\nใช้เวลาหลายชั่วโมงในการโต้วาทีอย่างหนักและการตรวจสอบด้วยวาจา แต่ [officer.GetSheHe] ก็สามารถหาหนี้เก่า ค่าธรรมเนียมที่ค้างชำระ บุญคุณที่ยังไม่ได้เรียกคืน และสิ่งที่คล้ายกันได้มากพอที่จะ ทำให้ดูเหมือนว่าค่าธรรมเนียมเพิ่มเติมส่วนใหญ่ถูกติดป้ายกำกับผิดพลาดเท่านั้น\n\nมันไม่ได้แก้ไขนิสัยที่ไม่ดีของ [employer.GetTitledFirstNamePossessive] ในการเก็บภาษีเกินในระยะยาว แต่มันเพียงพอที่จะ ทำให้นายจ้างของเราพอใจสำหรับตอนนี้"
 laamp_base_contract_schemes.2667.desc.resolution_type.camp_purpose: "[ROOT.Char.GetPrimaryTitle.GetDefinitiveName|U] มีประสบการณ์ในด้านการทำแผนที่ และระหว่างเรื่องราวที่ แต่งขึ้นครึ่ง ๆ กลาง ๆ กับการประกาศอย่างกล้าหาญเกี่ยวกับวิธี #EMP ใหม่#! ในการทำสิ่งต่าง ๆ พวกเขาก็ยอมจำนนต่อเราโดยสิ้นเชิง\n\nผู้คนดี ๆ แห่ง [employer.GetPrimaryTitle.GetBaseNameNoTier] โล่งใจมากกับโอกาสที่จะยุติการเก็บภาษีซ้ำซ้อนจนดูเหมือนว่าพวกเขาเต็มใจที่จะเพิกเฉยต่อค่าธรรมเนียมเพิ่มเติมที่เรียกเก็บไปแล้ว — สิ่งที่ข้า ทำให้ชัดเจนอย่างหนักแน่นต่อ [employer.GetTitledFirstName] ว่าเป็นชัยชนะที่ [employer.GetSheHe] ควรจะรับไปง่าย ๆ"
 laamp_base_contract_schemes.2667.desc.resolution_type.stress: "การพูดคุยกับผู้มีอิทธิพลรายย่อยแห่ง [employer.GetPrimaryTitle.GetBaseNameNoTier] นั้นเหนื่อยล้าอย่างยิ่ง\n\nเหนื่อยล้า แต่ก็ไม่เป็นไปไม่ได้ และด้วยความทรหดและความมุ่งมั่น ในที่สุดข้าก็สามารถพูดคุยกับ #EMP ส่วนใหญ่#! ของพวกเขาได้ มันไม่ใช่ทางออกถาวร แต่การข่มขู่คนส่วนใหญ่ให้เงียบดูเหมือนจะเพียงพอที่จะ ทำให้ [employer.GetTitledFirstName] พอใจ และท้ายที่สุดแล้ว นั่นคือทั้งหมดที่เรามาที่นี่จริง ๆ"
 laamp_base_contract_schemes.2667.desc.outro: "\n\nเราออกจากเมืองในวันนั้น กระเป๋าอ้วนพีด้วยเหรียญสดใหม่"
 laamp_base_contract_schemes.2667.a: "$laamp_base_contract_schemes.2662.a$"
 
 laamp_base_contract_schemes.2668.t: "$laamp_base_contract_schemes.2031.t$: ล้มเหลว!"
 laamp_base_contract_schemes.2668.desc.stewardship: "ดูเหมือนว่ามันไม่ใช่ปัญหาที่ง่ายพอ\n\nความพยายามของข้าในการแก้ไขสถานการณ์ ทำให้คนท้องถิ่นสงบลงและสัญญาว่าจะแก้ไขบางอย่าง ถูกบ่อนทำลายทันทีโดยการปฏิเสธการกระทำผิดอย่างแข็งกร้าวของ [employer.GetTitledFirstNamePossessive]\n\nจากนั้น สถานการณ์ก็หมุนวนอย่างรวดเร็วจนเกินการควบคุมของข้า โดยทุกฝ่ายต่างกรีดร้องใส่กันและเมืองก็ใกล้จะถึงขีดสุดของความโกลาหลโดยสิ้นเชิง"
 laamp_base_contract_schemes.2668.desc.officer: "วิธีการของนายทหารพลาธิการ [officer.GetFirstNamePossessive] พิสูจน์แล้วว่า... ไม่เพียงพอ\n\nความพยายามของ [officer.GetSheHe|U] ในการทำบัญชีภาษีอย่างครบถ้วนและตรงไปตรงมา — ที่จ่ายแล้ว ยังไม่ได้จ่าย และจ่ายเกิน — ถูกขัดจังหวะทุกขั้นตอนโดย [employer.GetTitledFirstName] ที่โกรธเกรี้ยวและพลเมืองที่หงุดหงิดและทุกข์ใจของเมือง\n\nไม่นาน ทุกอย่างก็กลายเป็นการทะเลาะวิวาทกันอีกครั้ง ลักษณะของการควบคุมทั้งหมดหายไป"
 laamp_base_contract_schemes.2668.desc.outro: "\n\nเราถูกบังคับให้ออกจาก [employer.GetPrimaryTitle.GetBaseNameNoTier] มือเปล่า"
 laamp_base_contract_schemes.2668.a: "$laamp_base_contract_schemes.2663.a$"

 laamp_base_contract_schemes.2671.t: "$laamp_base_contract_schemes.2031.t$: กำแพงที่พังทลาย"
 laamp_base_contract_schemes.2671.desc: "ปัญหาพื้นฐานใน [employer.GetPrimaryTitle.GetBaseNameNoTier] นั้นชัดเจนมากแม้จะมองจากนอกประตูที่ผุพัง — กำแพงของมันอยู่ในสภาพที่แย่มาก\n\nปัญหาหลักดูเหมือนจะไม่ใช่การตระหนักถึงสิ่งนี้ แต่เป็นการคิดออกว่าใครที่นี่จะ #EMP จ่ายเงิน#! เพื่อบูรณะพวกมันจริง ๆ ข้อเสนอที่มีค่าใช้จ่ายสูงที่ทุกคนเห็นพ้องกันว่าจำเป็น และยังเป็นปัญหาของ #EMP คนอื่น#! อีกด้วย"
 laamp_base_contract_schemes.2671.desc.outro: "$laamp_base_contract_schemes.2661.desc.outro$"
