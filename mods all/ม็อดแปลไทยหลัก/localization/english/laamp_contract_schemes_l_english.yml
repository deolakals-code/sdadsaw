 # Base Diplo Scheme Loc

 laamp_base_0001_contract_scheme: "สร้างความบันเทิงแก่ราชสำนัก"
 laamp_base_0001_contract_scheme_action: "สร้างความบันเทิงแก่ราชสำนักของ"
 laamp_base_0001_contract_scheme_desc: "ใน [scheme|E] นี้ [court|E] ของ [contractor_possessive|E] กำลังขาดเรื่องซุบซิบนินทา และด้วยเหตุนั้นจึงเกิดความกระสับกระส่าย เพื่อนำข่าวสารสดใหม่เข้ามา พวกเขาจึงเสนอของกำนัลและที่พักแก่เหล่านักพเนจรผู้มีชื่อเสียงพอควรที่ผ่านทางมา เพื่อชักชวนให้พวกเขาพำนักอยู่ด้วยชั่วระยะเวลาหนึ่ง$laamp_contract_scheme_desc_general_boilerplate$"
 laamp_base_0001_contract_scheme_desc_general: "$laamp_base_0001_contract_scheme_desc$"
 laamp_base_0001_contract_scheme_desc_success: "$laamp_contract_scheme_desc_success_boilerplate$"
 laamp_base_0001_desc_title: "ต้องการนักพูดที่น่าสนใจ!"
 laamp_base_0001_desc: "จงกล่าวถึงเรื่องราว [TaskContract.GetEmployer.GetTopLiege.GetPrimaryTitle.GetAdjectiveNoTooltip] และกิจการทางโลก แล้วจักได้รับรางวัล! ทุกท่านผู้มีเรื่องเล่าขาน เชิญมารับการต้อนรับอย่างอบอุ่นจาก [TaskContract.GetEmployer.GetTitleAsNameNoTooltip] แห่ง [TaskContract.GetEmployer.GetPrimaryTitle.GetNameNoTier] ด้วยไมตรีจิต"

 laamp_base_0011_contract_scheme: "ปรับปรุงชื่อเสียงผู้ปกครอง"
 laamp_base_0011_contract_scheme_action: "ปรับปรุงชื่อเสียงของ"
 laamp_base_0011_contract_scheme_desc: "[contractor|E] ผู้หนึ่งพบว่าสถานะของตนกำลังบกพร่อง: ไม่ว่าชื่อเสียงจะมัวหมอง [vassals|E] จำนวนมากเกลียดชัง หรือเพียงแค่ขาด [prestige|E] เพื่อสร้างความชอบธรรมให้แก่สิ่งที่ตนต้องการ สิ่งที่พวกเขาต้องการคือบุคคลที่สามที่เป็น "กลาง" เพื่อช่วย... #EMP ส่งเสริม#! ชื่อเสียงของพวกเขา$laamp_contract_scheme_desc_general_boilerplate$"
 laamp_base_0011_contract_scheme_desc_general: "$laamp_base_0011_contract_scheme_desc$"
 laamp_base_0011_contract_scheme_desc_success: "$laamp_contract_scheme_desc_success_boilerplate$"
 laamp_base_0011_desc_title: "ต้องการทูตผู้มีวาทศิลป์,"
 laamp_base_0011_desc: "ถึงเหล่าสหายผู้ทรงเกียรติและน่าเชื่อถือทั้งหลาย: อาจมีการจ้างงานที่ดีในการรับใช้ [TaskContract.GetEmployer.GetTitleAsNameNoTooltip] แห่ง [TaskContract.GetEmployer.GetPrimaryTitle.GetNameNoTier] รับเฉพาะผู้สนใจอย่างจริงจังเท่านั้น"

 laamp_base_0021_contract_scheme: "สร้างสัมพันธ์ใกล้ชิดกับผู้ปกครอง"
 laamp_base_0021_contract_scheme_action: "สร้างสัมพันธ์ใกล้ชิดกับ"
 laamp_base_0021_contract_scheme_desc: "เมื่อ [contractor|E] ผู้หนึ่งโหยหาความสนใจอย่างชัดเจน พวกเขาย่อมเปิดช่องให้แก่ผู้ฉวยโอกาส ผู้ฉวยโอกาสที่สามารถกินขนมปังของพวกเขา ดูดเหล้าองุ่นในห้องเก็บของพวกเขา เรียกเก็บ "เงินกู้" สองสามครั้ง และจากไปก่อนที่เสียงร้องโวยวายของพนักงานบัญชีจะดังขึ้น$laamp_contract_scheme_desc_general_boilerplate$"
 laamp_base_0021_contract_scheme_desc_general: "$laamp_base_0021_contract_scheme_desc$"
 laamp_base_0021_contract_scheme_desc_success: "$laamp_contract_scheme_desc_success_boilerplate$"
 laamp_base_0021_desc_title: "ต้องการชาวต่างชาติผู้สร้างความบันเทิง,"
 laamp_base_0021_desc: "ให้เป็นที่ทราบกันว่า [TaskContract.GetEmployer.GetTitleAsNameNoTooltip] ผู้มีใจบุญสุนทานแห่ง [TaskContract.GetEmployer.GetPrimaryTitle.GetNameNoTier] ขอมอบการต้อนรับอันเอื้อเฟื้อของ [TaskContract.GetEmployer.GetHerHis] แก่นักเดินทางผู้เจนโลกและคู่ควร"

 laamp_base_0031_contract_scheme: "ไกล่เกลี่ยในนาม"
 laamp_base_0031_contract_scheme_action: "ไกล่เกลี่ยให้แก่"
 laamp_base_0031_contract_scheme_desc: "เมื่อการกล่าวโทษตอบโต้กันอย่างขมขื่นในท้องถิ่นถูกส่งผ่านดินแดนของ [contractor] และตัวพวกเขาเองถูกมองว่าไร้ความสามารถหรือลำเอียงเกินกว่าจะแก้ไขข้อพิพาทได้ พวกเขาอาจเสนอบทบาทผู้ไกล่เกลี่ยที่เป็นกลางให้แก่นักพเนจรที่เหมาะสม$laamp_contract_scheme_desc_general_boilerplate$"
 laamp_base_0031_contract_scheme_desc_general: "$laamp_base_0031_contract_scheme_desc$"
 laamp_base_0031_contract_scheme_desc_success: "$laamp_contract_scheme_desc_success_boilerplate$"
 laamp_base_0031_desc_title: "ต้องการนักพเนจรผู้เกิดในตระกูลดี,"
 laamp_base_0031_desc: "[TaskContract.GetEmployer.GetTitleAsNameNoTooltip] แห่ง [TaskContract.GetEmployer.GetPrimaryTitle.GetNameNoTier] กำลังเสาะหาอนุญาโตตุลาการที่ไม่ลำเอียง เพื่อตัดสินข้อพิพาทเล็กน้อยในท้องถิ่นอย่างยุติธรรม มีรางวัลพิเศษสำหรับการแก้ไขปัญหาอย่างสมบูรณ์"

 laamp_base_0041_contract_scheme: "ผู้หลอกลวงด้วยเล่ห์"
 laamp_base_0041_contract_scheme_action: "ฉ้อโกง"
 laamp_base_0041_contract_scheme_desc: "คนโง่กับทรัพย์สมบัติของพวกเขาย่อมแยกจากกันได้ง่าย ไม่มี [contractor|E] คนใดที่จะ #EMP ร้องขอ#! สิ่งนี้อย่างเป็นทางการ — ไม่เลย พวกเขาทำผิดพลาดที่ไปสนทนากับนักต้มตุ๋น เพียงเพื่อจะค้นพบหลังจากสัญญาเสร็จสิ้นว่าพวกเขาถูกหลอกลวง (หรือแม้กระทั่งถูกปล้น) และนักพเนจรผู้หลอกลวงก็ได้จากไปแล้ว$laamp_contract_scheme_desc_general_boilerplate$"
 laamp_base_0041_contract_scheme_desc_general: "$laamp_base_0041_contract_scheme_desc$"
 laamp_base_0041_contract_scheme_desc_success: "$laamp_contract_scheme_desc_success_boilerplate$"
 laamp_base_0041_desc_title: "ต้องการบุคคลที่น่าทึ่ง,"
 laamp_base_0041_desc: "[TaskContract.GetEmployer.GetTitledFirstNameNoTooltip] ผู้เฉลียวฉลาด มีปัญญา และมีวิจารณญาณแห่ง [TaskContract.GetEmployer.GetPrimaryTitle.GetNameNoTier] ปรารถนาความบันเทิงสำหรับฤดูกาลหนึ่ง มีที่พักให้ #EMP อย่างจำกัด#! #EMP หาก#! ท่านได้มาตรฐานอันพิถีพิถันของ [TaskContract.GetEmployer.GetHerHis]"

 #################################################
 # Base Martial Scheme Loc

 laamp_base_1001_contract_scheme: "ล่าอาชญากร"
 laamp_base_1001_contract_scheme_action: "ล่าอาชญากรให้แก่"
 laamp_base_1001_contract_scheme_desc: "กลุ่มผู้ละเมิดกฎหมายที่มีหัวการค้าสามารถสร้างความเสียหายอย่างมากต่อทรัพย์สิน [prestige|E] และแม้กระทั่ง [legitimacy|E] ได้เมื่อเวลาผ่านไป กลุ่มเหล่านี้ใหญ่พอที่จะน่ากังวล แต่ก็เล็กพอที่จะจับได้ยาก ผู้เย้ยกฎหมาย เช่นนี้จึงเหมาะอย่างยิ่งที่จะเป็นเป้าหมายของ [contract_scheme_contract|E]$laamp_contract_scheme_desc_general_boilerplate$"
 laamp_base_1001_contract_scheme_desc_general: "$laamp_base_1001_contract_scheme_desc$"
 laamp_base_1001_contract_scheme_desc_success: "$laamp_contract_scheme_desc_success_boilerplate$"
 laamp_base_1001_desc_title: "นักเดินทางใกล้ [TaskContract.GetEmployer.GetPrimaryTitle.GetNameNoTier],"
 laamp_base_1001_desc: "จงระวังคนนอกกฎหมายและคนชั่วร้ายที่วนเวียนอยู่ตามถนนสายรอง!\n\nหากแขนดาบของท่านแข็งแกร่งและสายตาของท่านแม่นยำ [TaskContract.GetEmployer.GetTitledFirstName] สัญญาว่าจะให้รางวัลอย่างงามเพื่อแลกกับศีรษะของอันธพาลคนหนึ่ง"

 laamp_base_1011_contract_scheme: "ทหารรับจ้าง"
 laamp_base_1011_contract_scheme_action: "ใช้กำลังให้แก่"
 laamp_base_1011_contract_scheme_desc: "เมื่อ [contractor|E] ต้องการกำลังเสริมเล็กน้อยที่ใช้ได้อย่างเงียบเชียบในเวลาอันสั้น นักดาบรับจ้างสามารถให้ความลับได้มากกว่าบริวารทั่วไป$laamp_contract_scheme_desc_general_boilerplate$"
 laamp_base_1011_contract_scheme_desc_general: "$laamp_base_1011_contract_scheme_desc$"
 laamp_base_1011_contract_scheme_desc_success: "$laamp_contract_scheme_desc_success_boilerplate$"
 laamp_base_1011_desc_title: "นักดาบรับจ้างผู้มีชื่อเสียงดี,"
 laamp_base_1011_desc: "[TaskContract.GetEmployer.GetTitleAsNameNoTooltip] แห่ง [TaskContract.GetEmployer.GetPrimaryTitle.GetNameNoTier] กำลังเร่งเสาะหานักดาบรับจ้างที่รักษาความลับได้ดี สำหรับงานระยะสั้น มีรางวัลงามให้สำหรับงานที่รวดเร็วและเรียบร้อย"

 #laamp_base_1021_contract_scheme: "Drill Troops"
 #laamp_base_1021_contract_scheme_action: "Drill Troops for"
 #laamp_base_1021_contract_scheme_desc: "Though [men_at_arms|E] are professional soldiers and train regularly, [adventurers|E] have ample and varied practical experience to provide for [contractors|E] wishing to supplement their troops' instruction.$laamp_contract_scheme_desc_general_boilerplate$"
 #laamp_base_1021_contract_scheme_desc_general: "$laamp_base_1021_contract_scheme_desc$"
 #laamp_base_1021_contract_scheme_desc_success: "$laamp_contract_scheme_desc_success_boilerplate$"
 #laamp_base_1021_desc_title: "Sell-swords of good repute,"
 #laamp_base_1021_desc: "All veterans and [TaskContract.GetEmployer.Custom('MountedWarriorTermPlural')]: [TaskContract.GetEmployer.GetTitleAsNameNoTooltip] of [TaskContract.GetEmployer.GetPrimaryTitle.GetNameNoTierPossessive] seeks captains and drillmasters for [TaskContract.GetEmployer.GetHerHis] garrison. Rations and payment provided."

 #laamp_base_1031_contract_scheme: "Garrison Duty"
 #laamp_base_1031_contract_scheme_action: "Stand Guard for"
 #laamp_base_1031_contract_scheme_desc: "Not every [contractor|E] has the spare hands to secure everything under their purvey. Whether they lack willing swords altogether or they just need added short-term muscle, many put out temporary garrisons for tender.$laamp_contract_scheme_desc_general_boilerplate$"
 #laamp_base_1031_contract_scheme_desc_general: "$laamp_base_1031_contract_scheme_desc$"
 #laamp_base_1031_contract_scheme_desc_success: "$laamp_contract_scheme_desc_success_boilerplate$"
 #laamp_base_1031_desc_title: "Able-bodied wanderers of clear eye,"
 #laamp_base_1031_desc: "The [TaskContract.GetEmployer.GetTitleAsNameNoTooltip] of [TaskContract.GetEmployer.GetPrimaryTitle.GetNameNoTier] seeks dependable fighters to supplement a [TaskContract.GetEmployer.GetCapitalLocation.GetHolding.GetType.GetName|l] garrison for coming season."

 laamp_base_1041_contract_scheme: "ซุ่มโจมตีนักเดินทาง"
 laamp_base_1041_contract_scheme_action: "ซุ่มโจมตีในดินแดนของ"
 laamp_base_1041_contract_scheme_desc: "ดินแดนของ [contractors_possessive|E] บางแห่งช่างอันตรายเสียนี่กระไร! พวกเขาประกาศขอความช่วยเหลือ แต่กลับกลายเป็นว่า [adventurer|E] ผู้มีหัวการค้าบางคนปรากฏตัวขึ้นและเริ่มดักปล้นพ่อค้าอ้วนพีและกองคาราวานที่มีค่าทุกรายที่พวกเขาพบเจอ$laamp_contract_scheme_desc_general_boilerplate$"
 laamp_base_1041_contract_scheme_desc_general: "$laamp_base_1041_contract_scheme_desc$"
 laamp_base_1041_contract_scheme_desc_success: "$laamp_contract_scheme_desc_success_boilerplate$"
 laamp_base_1041_desc_title: "นักดาบรับจ้างที่ไว้ใจได้,"
 laamp_base_1041_desc: "[TaskContract.GetEmployer.GetPrimaryTitle.GetNameNoTier|U] กำลังประสบปัญหาจากโจร คนนอกกฎหมาย และนักพเนจรทุกประเภท กำลังเสาะหานักสู้ผู้เชี่ยวชาญ #EMP อย่างเร่งด่วน#! โปรดติดต่อโดยตรงกับ [TaskContract.GetEmployer.GetTitleAsNameNoTooltip] แห่ง [TaskContract.GetEmployer.GetPrimaryTitle.GetNameNoTier]"
 laamp_base_1041.tt.gold_rewards_depend_on_travellers: "#alert_trial [gold|E] ที่ท่านอาจได้รับขึ้นอยู่กับนักเดินทางที่ท่านพบและปล้นบนเส้นทางโดยสิ้นเชิง — ท่านอาจพบ [dukes|E] ที่ร่ำรวยมหาศาล หรือ [courtiers|E] ยากจนที่กำลังแสวงบุญ"
 laamp_base_1041.tt.haul_actual: "ท่านได้รับทั้งหมด [gold_i][task_contract.MakeScope.Var('haul_actual').GetValue|P0]"

