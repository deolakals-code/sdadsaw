 laamp_base_2001_contract_scheme: "เก็บภาษี"
 laamp_base_2001_contract_scheme_action: "เก็บภาษีให้แก่"
 laamp_base_2001_contract_scheme_desc: "ภาษีคือเส้นเลือดหล่อเลี้ยง [realm|E] ใด ๆ ก็ตาม เมื่อการส่งมอบล่าช้าลง [contractors|E] อาจประกาศหาผู้เก็บภาษีที่ #EMP เข้มงวด#! ยิ่งกว่าเดิม$laamp_contract_scheme_desc_general_boilerplate$"
 laamp_base_2001_contract_scheme_desc_general: "$laamp_base_2001_contract_scheme_desc$"
 laamp_base_2001_contract_scheme_desc_success: "$laamp_contract_scheme_desc_success_boilerplate$"
 laamp_base_2001_desc_title: "นักพเนจรผู้มีมารยาทดีและเกิดในตระกูลดี,"
 laamp_base_2001_desc: "กำลังเสาะหาบุคคลผู้แน่วแน่สำหรับงานสุจริตในการเก็บส่วย [TaskContract.GetEmployer.GetPrimaryTitle.GetTierAsNameNoTooltip|l] ในนามของ [TaskContract.GetEmployer.GetTitleAsNameNoTooltip] แห่ง [TaskContract.GetEmployer.GetPrimaryTitle.GetNameNoTier] จำเป็นต้องมีทักษะในการรับมือกับคนชั้นต่ำที่ดื้อรั้น"

 laamp_base_2011_contract_scheme: "สำรวจสำมะโนประชากร"
 laamp_base_2011_contract_scheme_action: "สำรวจสำมะโนประชากรให้แก่"
 laamp_base_2011_contract_scheme_desc: "เป็นการยากที่จะปกครอง [realm|E] เมื่อท่านไม่รู้ด้วยซ้ำว่ามีใครอยู่ #EMP ใน#! นั้น [contractors|E] ที่มีปัญหานี้มักหันไปหาบุคคลที่สามที่เป็นกลางเพื่อทำบัญชีรายชื่อราษฎรของตน และที่สำคัญที่สุดคือทรัพย์สินของราษฎรเหล่านั้น$laamp_contract_scheme_desc_general_boilerplate$"
 laamp_base_2011_contract_scheme_desc_general: "$laamp_base_2011_contract_scheme_desc$"
 laamp_base_2011_contract_scheme_desc_success: "$laamp_contract_scheme_desc_success_boilerplate$"
 laamp_base_2011_desc_title: "ถึงนักสำรวจและเจ้าพนักงาน:"
 laamp_base_2011_desc: "บันทึกของ [TaskContract.GetEmployer.GetTitleAsNameNoTooltip] แห่ง [TaskContract.GetEmployer.GetPrimaryTitle.GetNameNoTierPossessive] แสดงให้เห็นช่องว่างสำคัญ ต้องการนักเดินทางผู้รู้หนังสือ มีสติปัญญาดี และร่างกายแข็งแรงเพื่อทำการสำรวจสำมะโนประชากร และจะได้รับค่าตอบแทนจากรายได้ของการสำรวจนั้น"

 laamp_base_2021_contract_scheme: "ก่อสร้างอาคาร"
 laamp_base_2021_contract_scheme_action: "ก่อสร้างอาคารให้แก่"
 laamp_base_2021_contract_scheme_desc: "[contractors|E] หลายคนพบว่าความทะเยอทะยานด้านสถาปัตยกรรมของตนมีมากกว่าทักษะ — การจ้างงานก่อสร้างจึงเป็นวิธีง่าย ๆ ในการชดเชย... การกระทำที่เกินตัว เช่นนั้น$laamp_contract_scheme_desc_general_boilerplate$"
 laamp_base_2021_contract_scheme_desc_general: "$laamp_base_2021_contract_scheme_desc$"
 laamp_base_2021_contract_scheme_desc_success: "$laamp_contract_scheme_desc_success_boilerplate$"
 laamp_base_2021_desc_title: "ต้องการผู้ควบคุมงานสายตาเฉียบแหลมและจิตใจมั่นคง,"
 laamp_base_2021_desc: "[TaskContract.GetEmployer.GetTitleAsNameNoTooltip] แห่ง [TaskContract.GetEmployer.GetPrimaryTitle.GetNameNoTier] ต้องการผู้มีความสามารถและช่างฝีมือเพื่อควบคุมโครงการก่อสร้าง จะจัดหาวัสดุและค่าตอบแทนที่ยุติธรรมให้"

 laamp_base_2031_contract_scheme: "ยุติข้อพิพาทเรื่องเขตแดน"
 laamp_base_2031_contract_scheme_action: "ชี้ขาดเขตแดนให้แก่"
 laamp_base_2031_contract_scheme_desc: "เขตแดนคืออำนาจ ซึ่งมัก ทำให้เกิดการโต้แย้ง — เมื่อข้อพิพาทเล็กน้อยระหว่างบุคคลสำคัญบานปลายจนควบคุมไม่ได้ บ่อยครั้งที่ [contractors|E] จะจ้างบุคคลที่สามที่เป็นกลางเพื่อตรวจสอบข้อเท็จจริงจะมีประสิทธิภาพมากกว่า$laamp_contract_scheme_desc_general_boilerplate$"
 laamp_base_2031_contract_scheme_desc_general: "$laamp_base_2031_contract_scheme_desc$"
 laamp_base_2031_contract_scheme_desc_success: "$laamp_contract_scheme_desc_success_boilerplate$"
 laamp_base_2031_desc_title: "นักพเนจรผู้เกิดในตระกูลดี,"
 laamp_base_2031_desc: "[TaskContract.GetEmployer.GetTitleAsNameNoTooltip] แห่ง [TaskContract.GetEmployer.GetPrimaryTitle.GetNameNoTier] กำลังเสาะหาอนุญาโตตุลาการผู้มีประสบการณ์เพื่อยุติข้อพิพาทเรื่องเขตแดน การศึกษาด้านกฎหมาย [TaskContract.GetEmployer.GetTopLiege.GetPrimaryTitle.GetAdjectiveNoTooltip] จะ... มีประโยชน์ แต่แม้ความช่วยเหลือที่น่าพอใจก็จะได้รับค่าตอบแทน"

 laamp_base_2041_contract_scheme: "ปลอมตัวเป็นพนักงานเก็บภาษี"
 laamp_base_2041_contract_scheme_action: "ขโมยภาษีจาก"
 laamp_base_2041_contract_scheme_desc: "ภาษีเป็นทุนให้แก่ผู้ปกครองของ [realm|E] ใด ๆ — แต่พวกเขา #EMP จำเป็น#! ต้องได้รับมันหรือ? เมื่อคนโกงที่มั่นใจในตนเองปรากฏตัวพร้อมตราประทับที่ดูเหมือนเป็นทางการและทหารรับจ้างที่จ้างมา นั่น #EMP แตกต่าง#! จากเจ้าหน้าที่ที่เหมาะสมจริงหรือ?$laamp_contract_scheme_desc_general_boilerplate$"
 laamp_base_2041_contract_scheme_desc_general: "$laamp_base_2041_contract_scheme_desc$"
 laamp_base_2041_contract_scheme_desc_success: "$laamp_contract_scheme_desc_success_boilerplate$"
 laamp_base_2041_desc_title: "ถึงราษฎรทั้งปวงแห่ง [TaskContract.GetEmployer.GetPrimaryTitle.GetNameNoTier]"
 laamp_base_2041_desc: "[TaskContract.GetEmployer.GetTitledFirstNameNoTooltip] ขอย้ำเตือนทุกท่านอย่างหนักแน่นถึงการเก็บส่วยที่ใกล้เข้ามา — จงชำระโดยพลันทันทีที่พนักงานเก็บภาษีของท่านมาถึง การขาดส่งใด ๆ ทั้งสิ้นจะถูกลงโทษอย่างรุนแรง"

 #################################################
 # Base Intrigue Scheme Loc

 laamp_base_3001_contract_scheme: "งานจารกรรมเฉพาะหน้า"
 laamp_base_3001_contract_scheme_action: "รายงานต่อ"
 laamp_base_3001_contract_scheme_desc: "รายงานสดใหม่เกี่ยวกับเหตุการณ์ล่าสุดที่อยู่ห่างไกลจากเมืองหลวงของพวกเขานับเป็นโยชน์ มักมีค่าอย่างยิ่งสำหรับ [contractors|E]: มากพอที่จะคุ้มค่ากับการซื้อมันมาจากนักพเนจรผู้มีทักษะ$laamp_contract_scheme_desc_general_boilerplate$"
 laamp_base_3001_contract_scheme_desc_general: "$laamp_base_3001_contract_scheme_desc$"
 laamp_base_3001_contract_scheme_desc_success: "$laamp_contract_scheme_desc_success_boilerplate$"
 laamp_base_3001_desc_title: "ผู้ลอบฟังที่ไว้ใจได้และชาวต่างชาติผู้มีหัวการค้า,"
 laamp_base_3001_desc: "[TaskContract.GetEmployer.GetTitleAsNameNoTooltip] แห่ง [TaskContract.GetEmployer.GetPrimaryTitle.GetNameNoTier] ปรารถนาให้เป็นที่ทราบกันว่า [TaskContract.GetEmployer.GetSheHe] กำลังเชื้อเชิญการเปิดเผยข้อมูลที่เป็นประโยชน์จากทั่วทั้ง [TaskContract.GetEmployer.GetTopLiege.GetPrimaryTitle.GetTierAsNameNoTooltip] และไกลออกไป"

 laamp_base_3011_contract_scheme: "สังหารศัตรู"
 laamp_base_3011_contract_scheme_action: "สังหาร"
 laamp_base_3011_contract_scheme_desc: "มีบางครั้งที่ [contractor|E] ต้องการให้ใครบางคนตาย แต่ไม่ต้องการเสี่ยงวางแผนเองหรือกำลังยุ่งอยู่กับเรื่องอื่น โชคดีที่การฆาตกรรมสามารถจ้างวานคนประเภทที่เหมาะสมได้อย่างง่ายดาย$laamp_contract_scheme_desc_general_boilerplate$"
 laamp_base_3011_contract_scheme_desc_general: "$laamp_base_3011_contract_scheme_desc$"
 laamp_base_3011_contract_scheme_desc_success: "$laamp_contract_scheme_desc_success_boilerplate$"
 laamp_base_3011_desc_title: "นักดาบรับจ้างผู้ซื่อสัตย์และมีเจตจำนงแน่วแน่,"
 laamp_base_3011_desc: "[TaskContract.GetEmployer.GetTitleAsNameNoTooltip] แห่ง [TaskContract.GetEmployer.GetPrimaryTitle.GetNameNoTier] เสนอรางวัลมากมายให้แก่ผู้มีคุณธรรมไร้ที่ติและมีประสบการณ์ที่พิสูจน์แล้วสำหรับงานที่ละเอียดอ่อนและต้องการความสามารถสูง"

 laamp_base_3021_contract_scheme: "ลักพาตัวศัตรู"
 laamp_base_3021_contract_scheme_action: "ลักพาตัว"
 laamp_base_3021_contract_scheme_desc: "คุกสามารถเป็นประสบการณ์ที่ ทำให้ผู้ไม่พอใจและคู่แข่งได้สติและรับรู้ข้อมูลมากขึ้น เช่นเดียวกับที่เป็นประโยชน์หรือน่าพอใจสำหรับผู้คุมของพวกเขา มากพอที่จะ ทำให้คุ้มค่ากับความเสี่ยงในการจ่ายเงินให้บุคคลที่สามเพื่อจัดการเยี่ยมเยียน อย่างน้อยก็ เช่นนั้น$laamp_contract_scheme_desc_general_boilerplate$"
 laamp_base_3021_contract_scheme_desc_general: "$laamp_base_3021_contract_scheme_desc$"
 laamp_base_3021_contract_scheme_desc_success: "$laamp_contract_scheme_desc_success_boilerplate$"
 laamp_base_3021_desc_title: "นักจับกุมสัตว์ร้ายที่สร้างปัญหาผู้เด็ดเดี่ยว,"
 laamp_base_3021_desc: "[TaskContract.GetEmployer.GetTitleAsNameNoTooltip] แห่ง [TaskContract.GetEmployer.GetPrimaryTitle.GetNameNoTier] กำลังเสาะหานายพรานผู้มีทักษะและรักษาความลับได้ดี เพื่อจับเหยื่อที่ไม่ธรรมดา และนำกลับมาทั้งเป็น มีค่าจ้างอย่างงามรออยู่"

 laamp_base_3031_contract_scheme: "เผาทรัพย์สิน"
 laamp_base_3031_contract_scheme_action: "ลอบวางเพลิงให้แก่"
 laamp_base_3031_contract_scheme_desc: "สิ่งที่ยอดเยี่ยมเกี่ยวกับอาคารที่ไม่มีคนดูแลคือ ด้วยความพยายามที่เพียงพอ พวกมัน #EMP ย่อม#! ไหม้ไฟได้เสมอ เป็นเครื่องมือที่ยอดเยี่ยมสำหรับ [contractors|E] ที่ต้องการส่งสาร แต่เพียงต้องการจุดไฟแล้วลืมไปเสีย$laamp_contract_scheme_desc_general_boilerplate$"
 laamp_base_3031_contract_scheme_desc_general: "$laamp_base_3031_contract_scheme_desc$"
 laamp_base_3031_contract_scheme_desc_success: "$laamp_contract_scheme_desc_success_boilerplate$"
 laamp_base_3031_desc_title: "คนจรผู้ขยันหมั่นเพียรและมีลักษณะเหมาะสม,"
 laamp_base_3031_desc: "มีค่าจ้างอย่างงามสำหรับงานกำจัดพื้นที่อย่างเร่งด่วน การรักษาความลับเป็นสิ่งจำเป็น เร่งไปยัง [TaskContract.GetEmployer.Custom('ResidenceBuilding')|l] ของ [TaskContract.GetEmployer.GetTitleAsNamePossessiveNoTooltip] [TaskContract.GetEmployer.GetPrimaryTitle.GetAdjectiveNoTooltip]"

 laamp_base_3041_contract_scheme: "ปล้นท้องพระคลัง"
 laamp_base_3041_contract_scheme_action: "ย่องเบาเข้าท้องพระคลังของ"
 laamp_base_3041_contract_scheme_desc: "[contractors|E] บางคนเป็นเพียงคนโง่ที่ส่งสัญญาณถึงความมั่งคั่งที่ล้นเหลือของตน — ความมั่งคั่งที่ง่ายต่อการได้มาโดยตรงมากกว่าผ่าน #EMP งาน#! ราคาถูกบางอย่าง$laamp_contract_scheme_desc_general_boilerplate$"
 laamp_base_3041_contract_scheme_desc_general: "$laamp_base_3041_contract_scheme_desc$"
 laamp_base_3041_contract_scheme_desc_success: "$laamp_contract_scheme_desc_success_boilerplate$"
 laamp_base_3041_desc_title: "ถึงนักเดินทางทั้งปวงภายใน และราษฎรแห่ง [TaskContract.GetEmployer.GetPrimaryTitle.GetNameNoTier]"
 laamp_base_3041_desc: "[TaskContract.GetEmployer.GetTitledFirstNameNoTooltip] ขอเตือน #EMP ทุกคน#! ถึงบทลงโทษสำหรับการลักทรัพย์หรือสมคบคิดเพื่อลักทรัพย์ และเงินรางวัลสำหรับผู้ต้องสงสัยในความผิดดังกล่าว มีเพียง #EMP ข้า#! เท่านั้นที่สามารถเข้าถึงท้องพระคลังได้"
 laamp_base_3041.tt.chance_for_more: "หากท่านปรารถนา ท่านอาจพยายาม #P ขโมย [gold|E] ให้มากขึ้นอีก#!"

 #################################################
 # Base Learning Scheme Loc

 laamp_base_4001_contract_scheme: "คัดลอกตำรา"
 laamp_base_4001_contract_scheme_action: "เป็นอาลักษณ์ให้แก่"
 laamp_base_4001_contract_scheme_desc: "ศิลปะการคัดลอกและแปลเอกสารโบราณอาจเป็นงานที่ไม่ค่อยมีใครเห็นคุณค่า แม้ แต่ใน [realms|E] ที่มีการศึกษาดี งานที่อาจมีอยู่ก็มักจะเกินจำนวนอาลักษณ์ที่มีคุณสมบัติเหมาะสม ดังนั้น นักพเนจรผู้มีการศึกษาจึงมอบโอกาสทองให้แก่ [task_contracts|E] ในการคัดลอกคำขอพิเศษ$laamp_contract_scheme_desc_general_boilerplate$"
 laamp_base_4001_contract_scheme_desc_general: "$laamp_base_4001_contract_scheme_desc$"
 laamp_base_4001_contract_scheme_desc_success: "$laamp_contract_scheme_desc_success_boilerplate$"
 laamp_base_4001_desc_title: "ท่านผู้ประสงค์จะรักษาความรู้"
 laamp_base_4001_desc: "ต้องการอาลักษณ์ผู้รู้หนังสืออย่างดีสำหรับการคัดลอกตำรา [TaskContract.GetEmployer.GetCulture.GetNameNoTooltip] [TaskContract.GetEmployer.GetTitleAsNameNoTooltip] แห่ง [TaskContract.GetEmployer.GetPrimaryTitle.GetNameNoTier] สัญญาว่าจะจ่ายค่าตอบแทนที่ยุติธรรมสำหรับงานที่เสร็จทันเวลา"

 laamp_base_4011_contract_scheme: "ยุติข้อพิพาททางเทววิทยา"
 laamp_base_4011_contract_scheme_action: "ชี้ขาดเทววิทยาให้แก่"
 laamp_base_4011_contract_scheme_desc: "ข้อพิพาทเกี่ยวกับหลักคำสอนอาจมีความเฉพาะเจาะจงอย่างยิ่ง ลงลึกถึงการตีความคำ ๆ เดียวอย่างแม่นยำ และคลุมเครืออย่างน่าประหลาด เช่น การโต้เถียงถึงความเข้ากันไม่ได้ของประเพณีโบราณที่ทับซ้อนกัน เมื่อข้อพิพาทอันศักดิ์สิทธิ์ เช่นนี้เริ่มลุกลาม [contractors|E] หลายคนจึงนิยมส่งบุคคลที่สามเข้ามาไกล่เกลี่ยแทนตน$laamp_contract_scheme_desc_general_boilerplate$"
 laamp_base_4011_contract_scheme_desc_general: "$laamp_base_4011_contract_scheme_desc$"
 laamp_base_4011_contract_scheme_desc_success: "$laamp_contract_scheme_desc_success_boilerplate$"
 laamp_base_4011_desc_title: "ศิษย์ผู้ภักดีแห่ง [TaskContract.GetEmployer.GetFaith.KnowledgeGodName],"
 laamp_base_4011_desc: "นักเทววิทยาผู้คงแก่เรียนจะได้รับรางวัลอย่างงามสำหรับการยุติข้อพิพาททางศาสนาในท้องถิ่นเกี่ยวกับหลักความเชื่อ [TaskContract.GetEmployer.GetFaith.GetAdjective]\n\nโปรดติดต่อ [TaskContract.GetEmployer.GetTitleAsNameNoTooltip] แห่ง [TaskContract.GetEmployer.GetPrimaryTitle.GetNameNoTier] แต่เฉพาะหากท่านเป็นนักปราชญ์ผู้ทรงภูมิเท่านั้น"

 laamp_base_4021_contract_scheme: "สร้างสรรค์ผลงานทางปัญญา"
 laamp_base_4021_contract_scheme_action: "เป็นนักปราชญ์ให้แก่"
 laamp_base_4021_contract_scheme_desc: "นักพเนจรผู้คงแก่เรียนนำมา ซึ่งความรู้สึกลึกลับบางอย่าง บ่อยครั้งถึงกับมีความแปลกใหม่เล็กน้อย — [contractors|E] ที่มีไหวพริบมักพยายามจับภาพปัญญาอันลอยเลื่อนเหล่านั้นไว้โดยการจ้างให้เขียนหนังสือเล่มเล็ก ๆ เกี่ยวกับคติพจน์และนิทานสอนใจ$laamp_contract_scheme_desc_general_boilerplate$"
 laamp_base_4021_contract_scheme_desc_general: "$laamp_base_4021_contract_scheme_desc$"
 laamp_base_4021_contract_scheme_desc_success: "$laamp_contract_scheme_desc_success_boilerplate$"
 laamp_base_4021_desc_title: "นักปราชญ์ผู้คงแก่เรียนแห่งอักษรอันงดงาม,"
 laamp_base_4021_desc: "นักเขียนจากทั่วทุกสารทิศโปรดมุ่งไปยัง [TaskContract.GetEmployer.Custom('ResidenceBuilding')|l] ของ [TaskContract.GetEmployer.GetTitleAsNameNoTooltip] แห่ง [TaskContract.GetEmployer.GetPrimaryTitle.GetNameNoTierPossessive] เพื่องานเขียนที่ให้ผลตอบแทนดี"

 laamp_base_4031_contract_scheme: "ขอรับบริจาค"
 laamp_base_4031_contract_scheme_action: "วิงวอนขอจาก"
 laamp_base_4031_contract_scheme_desc: "การมอบของขวัญและเงินตราแก่นักปราชญ์ที่ผ่านทางมา ทำให้ [contractors|E] ดูมีน้ำใจและคงแก่เรียน — แม้ว่านักปราชญ์ผู้นั้นจะให้ #EMP การกระตุ้น#! เล็กน้อยก่อนก็ตาม$laamp_contract_scheme_desc_general_boilerplate$"
 laamp_base_4031_contract_scheme_desc_general: "$laamp_base_4031_contract_scheme_desc$"
 laamp_base_4031_contract_scheme_desc_success: "$laamp_contract_scheme_desc_success_boilerplate$"
 laamp_base_4031_desc_title: "ผู้ทรงศีลอันชอบธรรมและขอทานผู้น่าสงสาร,"
 laamp_base_4031_desc: "ให้เป็นที่ทราบกันในหมู่ท่าน: [TaskContract.GetEmployer.GetTitleAsNameNoTooltip] แห่ง [TaskContract.GetEmployer.GetPrimaryTitle.GetNameNoTier] ขอมอบการอุปถัมภ์ตามหลัก [TaskContract.GetEmployer.GetFaith.GetAdjectiveNoTooltip] แก่ผู้ที่เคร่งศาสนา มีวัฒนธรรม หรือคงแก่เรียนเพียงพอที่จะสมควรได้รับ สอบถามได้ที่ [TaskContract.GetEmployer.Custom('ResidenceBuilding')|l]"

 laamp_base_4041_contract_scheme: "เร่ขายเครื่องราง"
 laamp_base_4041_contract_scheme_action: "เร่ขายของจุกจิกให้แก่"
 laamp_base_4041_contract_scheme_desc: "ใครเล่าจะบอกได้ว่าสิ่งใดคือเวทมนตร์ สิ่งใดคือศักดิ์สิทธิ์ และสิ่งใดคือของแปลก? หาก [contractor|E] โง่พอที่จะเชื่อ และ #EMP จ่ายเงิน#! ซื้อมัน นั่นก็เพียงพอแล้ว กระมัง$laamp_contract_scheme_desc_general_boilerplate$"
 laamp_base_4041_contract_scheme_desc_general: "$laamp_base_4041_contract_scheme_desc$"
 laamp_base_4041_contract_scheme_desc_success: "$laamp_contract_scheme_desc_success_boilerplate$"
 laamp_base_4041_desc_title: "สหาย [TaskContract.GetEmployer.GetWomenMen] ผู้รู้!"
 laamp_base_4041_desc: "ท่านมีสายตาที่มองเห็นคุณค่าที่แท้จริงของของหายากตามหลัก [TaskContract.GetEmployer.GetFaith.GetAdjectiveNoTooltip] หรือไม่? [TaskContract.GetEmployer.GetTitleAsNameNoTooltip] แห่ง [TaskContract.GetEmployer.GetPrimaryTitle.GetNameNoTier] เสนอค่าตอบแทนที่ยุติธรรม — #EMP หาก#! สินค้าเป็นของแท้"

