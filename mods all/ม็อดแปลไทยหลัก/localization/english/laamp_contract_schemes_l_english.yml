 laamp_base_contract_schemes.5901.c.tt.success: "[rollee.GetFirstNameNoTooltip] มีชัย"
 laamp_base_contract_schemes.5901.c.tt.failure: "สายลับของท่าน ทำให้ท่านผิดหวัง"
