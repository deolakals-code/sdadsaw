 laamp_base_contract_schemes.0551.t: "ผู้ยิ่งใหญ่และผู้ดีงาม"
 laamp_base_contract_schemes.0551.desc: "มีผู้ที่มีอิทธิพลมากกว่าผู้อื่นในราชสำนักเสมอ และห้องโถงของ [target.GetTitledFirstNamePossessive] ก็ไม่แตกต่างกัน\n\nบางคนเดินผ่านโถงทางเดินอย่างสง่าผ่าเผย บางคนหลีกทางอย่างรีบร้อน\n\nหากข้าต้องการสร้างความประทับใจจริง ๆ การได้ผู้มีอิทธิพลทางสังคมในท้องถิ่นคนหนึ่งมาอยู่ข้างข้าก็คงไม่เสียหาย แต่จะเลือกใครดี..."
