 laamp_base_contract_schemes.2014.tt.explanation: "#TUT เพื่อทำให้ [task_contract|E] สำเร็จ:\n$EFFECT_LIST_BULLET$ทำความท้าทาย [stewardship|E], [intrigue|E], หรือ [GetCourtPositionType('quartermaster_camp_officer').GetName()] [aptitude|E] ให้สำเร็จในแต่ละจุดหมายปลายทาง\n$EFFECT_LIST_BULLET$ชนะทุกความท้าทายสำหรับ $label_success_critical$\n$EFFECT_LIST_BULLET$หากท่านทดสอบเฉพาะ [stewardship|E] หรือ [GetCourtPositionType('quartermaster_camp_officer').GetName()] ของท่าน ท่านอาจล้มเหลวได้ถึงสองครั้งและยังคงได้รับ $label_success_standard$ — ตราบใดที่ท่านยังคงชนะอย่างน้อยครึ่งหนึ่งของความท้าทาย\n$EFFECT_LIST_BULLET$หากท่านรับความท้าทาย [intrigue|E] หรือเพียงแค่สร้างผลลัพธ์อย่างเกียจคร้าน ท่านอาจล้มเหลวได้เพียงครั้งเดียวและยังคงได้รับ $label_success_standard$ — นอกจากนี้ หากท่านล้มเหลว จะเป็น $label_failure_critical$#!"
