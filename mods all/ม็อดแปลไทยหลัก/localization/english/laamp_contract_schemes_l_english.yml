 laamp_base_contract_schemes.2014.desc: "$laamp_base_contract_schemes.2011.desc$"
 laamp_base_contract_schemes.2014.tt.destination_list.03_destinations: "ท่านจะเริ่ม [traveling|E] ทันที ไปยัง [destination_1.GetNameNoTier], จากนั้นไปยัง [destination_2.GetNameNoTier], แล้วไปยัง [destination_3.GetNameNoTier]"
 laamp_base_contract_schemes.2014.tt.destination_list.04_destinations: "ท่านจะเริ่ม [traveling|E] ทันที ไปยัง [destination_1.GetNameNoTier], จากนั้นไปยัง [destination_2.GetNameNoTier], [destination_3.GetNameNoTier], และสุดท้าย [destination_4.GetNameNoTier]"
 laamp_base_contract_schemes.2014.tt.destination_list.05_destinations: "ท่านจะเริ่ม [traveling|E] ทันที ไปยัง [destination_1.GetNameNoTier], จากนั้นไปยัง [destination_2.GetNameNoTier], [destination_3.GetNameNoTier], [destination_4.GetNameNoTier], และสุดท้าย [destination_5.GetNameNoTier]"
 laamp_base_contract_schemes.2014.tt.destination_list.06_destinations: "ท่านจะเริ่ม [traveling|E] ทันที ตามลำดับ ไปยัง:\n$EFFECT_LIST_BULLET$[destination_1.GetNameNoTier] #WEAK ([destination_1.GetDeJureLiege.GetName])#!\n$EFFECT_LIST_BULLET$[destination_2.GetNameNoTier] #WEAK ([destination_2.GetDeJureLiege.GetName])#!\n$EFFECT_LIST_BULLET$[destination_3.GetNameNoTier] #WEAK ([destination_3.GetDeJureLiege.GetName])#!\n$EFFECT_LIST_BULLET$[destination_4.GetNameNoTier] #WEAK ([destination_4.GetDeJureLiege.GetName])#!\n$EFFECT_LIST_BULLET$[destination_5.GetNameNoTier] #WEAK ([destination_5.GetDeJureLiege.GetName])#!\n$EFFECT_LIST_BULLET$[destination_6.GetNameNoTier] #WEAK ([destination_6.GetDeJureLiege.GetName])#!"
