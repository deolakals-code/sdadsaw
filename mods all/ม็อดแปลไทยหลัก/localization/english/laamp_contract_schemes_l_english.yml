 laamp_base_contract_schemes.0571.t: "จ่ายล่วงหน้า"
 laamp_base_contract_schemes.0571.desc: "ไม่มีการรับประกันว่า [target.GetTitledFirstName] จะให้ของขวัญที่ข้าปรารถนาแก่ข้าในท้ายที่สุด ไม่ว่าข้าจะประจบประแจงแทบเท้าของ [target.GetHerHis] ดีเพียงใดก็ตาม\n\nเห็นได้ชัดว่าข้าต้องลงมือ ใช้แรงกดดันทั้งหมดที่ข้าสามารถทำได้เพื่อขอเงินกู้ล่วงหน้า จากนั้น หาก [target.GetSheHe] โปรดปรานข้าเพิ่มเติม ข้าก็หัวเราะได้ และหากไม่ ความพยายามของข้าก็ได้รับการชดเชยล่วงหน้าแล้ว"
