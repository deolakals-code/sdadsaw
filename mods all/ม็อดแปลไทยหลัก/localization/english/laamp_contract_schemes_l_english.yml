 laamp_base_contract_schemes.5901.b: "สะกดรอยตาม [victim.GetHerHim] และกรีดกระเป๋าเงินของ[victim.GetHerHis] อย่างเงียบๆ"
 laamp_base_contract_schemes.5901.b.tt.success: "[victim.GetSheHe|U] ไม่รู้ตัวเลย"
 laamp_base_contract_schemes.5901.b.tt.failure: "[victim.GetFirstNameNoTooltip] สังเกตเห็นท่านและวิ่งหนีไป"
