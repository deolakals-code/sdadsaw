 laamp_extra_contract_schemes.0002.t_diplomacy: "สำเร็จ: แผนการ $protect_minority_vassal_contract_diplomacy_scheme$"
 laamp_extra_contract_schemes.0002.t_martial: "สำเร็จ: แผนการ $protect_minority_vassal_contract_martial_scheme$"
 laamp_extra_contract_schemes.0002.t_intrigue: "สำเร็จ: แผนการ $protect_minority_vassal_contract_intrigue_scheme$"
 laamp_extra_contract_schemes.0002.t_learning: "สำเร็จ: แผนการ $protect_minority_vassal_contract_learning_scheme$"
 laamp_extra_contract_schemes.0002.desc_diplomacy: "เข้าไปในห้องโถงของ [task_contract_target.GetName] ข้าโต้แย้งสาเหตุของ [task_contract_employer.GetTitledFirstName] ด้วยข่าวดีที่จะรายงาน ด้วยเสียงเชียร์ที่ยังคงดังก้องอยู่ในหูของข้า ข้ากลับไปหานายจ้างของข้า \n\n"'เรื่องเล็กน้อย แก้ไขได้ง่าย' [task_contract_target.GetSheHe] เรียกมันว่าอย่างนั้น!" [task_contract_employer.GetSheHe] ยิ้มกว้าง "ท่านได้สนับสนุน 'เรื่องเล็กน้อย' แห่งอิสรภาพของผู้คนของข้าอย่างไร! การคุ้มครองของเราจะถูกประกาศอย่างเป็นทางการในไม่ช้า และข้าแทบจะไม่สามารถพอใจไปได้มากกว่านี้""
 laamp_extra_contract_schemes.0002.desc_martial: "ตามที่คาดไว้ ผู้ติดตามที่แข็งกร้าวของข้าหว่านความกลัวในอาณาจักรของ [task_contract_target.GetTitledFirstNamePossessive] บังคับให้ [task_contract_target.GetHerHim] ต้องมาที่โต๊ะเจรจาในที่สุด — และจากตำแหน่งที่อ่อนแอ\n\n"ท่านได้สร้างความหายนะที่ผู้กดขี่แห่ง [task_contract_employer.GetPrimaryTitle.GetNameNoTier] จะจดจำไปอีกนาน!" [task_contract_employer.GetTitledFirstNameNoTooltip] ชื่นชม "ควรจะเป็น #EMP พวกเขา#! ที่อ้อนวอนขอสิทธิ์ในการคุ้มครอง! แต่ไม่ว่า อย่างไรก็ตาม: ภาระผูกพันใหม่ของเจ้าเหนือหัวของข้าจะถูกนำมาใช้ในไม่ช้า ชัยชนะอันยิ่งใหญ่!""
 laamp_extra_contract_schemes.0002.desc_intrigue: "[task_contract_target.GetName] เป็น [task_contract_target.GetWomanMan] ที่ค่อนข้างซับซ้อน — ศีลธรรมของ [task_contract_target.GetHerHis] ไม่ใช่สติปัญญาของ [task_contract_target.GetHerHis]! ข้าได้รวบรวมข่าวลือที่เป็นพิษอย่างแท้จริงจำนวนมาก คำพูดที่วางแผนไว้อย่างรอบคอบสองสามคำ และ [task_contract_target.GetTitleAsNameNoTooltip] จะตระหนักถึงศักดิ์ศรีทั้งหมดที่ [task_contract_target.GetHerHe] จะสูญเสียไปโดยการต่อต้าน [task_contract_employer.GetTitledFirstName]\n\n"ราชสำนักของเจ้าเหนือหัวของข้าสามารถกลายเป็นรังอสรพิษที่ชั่วร้ายได้อย่างง่ายดายเพียงใด!" [task_contract_employer.GetTitledFirstName] ร้องออกมา "ข้าจะเมตตา และให้โอกาสเขาในการให้สิทธิ์แก่ประชาชนของข้า... ก่อนที่ข้าจะส่งกิจการของ [task_contract_employer.GetHerHis] ให้หมุนวนจนควบคุมไม่ได้""
 laamp_extra_contract_schemes.0002.desc_learning: "ข้าพิจารณาทุกสิ่งที่ข้าสามารถหาได้เกี่ยวกับกฎหมาย [task_contract_target.GetPrimaryTitle.GetAdjectiveNoTooltip]: หลักธรรมนูญ [task_contract_target.GetFaith.GetName] หลักการ [task_contract_target.GetCulture.GetName]... โอ้ ใช่ ข้าได้รวบรวมคลังแสงของแบบอย่างและความแตกต่างที่ค่อนข้างมาก\n\n"อธิบายอีกครั้ง..." [task_contract_employer.GetTitledFirstName] ขอร้อง "ข้าต้องอ้างถึง [task_contract_target.GetFaith.WarGodName] เมื่อข้ายกประเด็นเรื่องเกียรติยศที่ละเมิดไม่ได้ ใช่หรือไม่? อา ไม่สำคัญ — กรณีของเราแข็งแกร่งกว่าที่เคย! ความยินยอมของ [task_contract_target.GetTitledFirstNamePossessive] เป็นเพียงพิธีการเท่านั้น""
 laamp_extra_contract_schemes.0002.a: "ผู้คนแห่ง [task_contract_employer.GetCapitalLocation.GetNameNoTooltip] สามารถชื่นชมยินดีได้!"
 laamp_extra_contract_schemes.0003.t_diplomacy: "ล้มเหลว: แผนการ $protect_minority_vassal_contract_diplomacy_scheme$"
 laamp_extra_contract_schemes.0003.t_martial: "ล้มเหลว: แผนการ $protect_minority_vassal_contract_martial_scheme$"
 laamp_extra_contract_schemes.0003.t_intrigue: "ล้มเหลว: แผนการ $protect_minority_vassal_contract_intrigue_scheme$"
 laamp_extra_contract_schemes.0003.t_learning: "ล้มเหลว: แผนการ $protect_minority_vassal_contract_learning_scheme$"
 laamp_extra_contract_schemes.0003.desc_diplomacy: "ผู้แทนของ [task_contract_target.GetNamePossessive] ไม่ให้อะไรข้าเลย ไม่มีความผ่อนผันหรือความเห็นใจใด ๆ ทั้งสิ้น ไม่ว่าคำพูดของข้าจะเป็นอย่างไร ผู้แทน [task_contract_target.GetPrimaryTitle.GetAdjective] ก็เพียงแค่หัวเราะเยาะใส่หน้าข้า\n\n"ข้าได้ยินมาว่าเจ้าเหนือหัวของข้า #EMP พอใจอย่างยิ่ง#! กับการรบเร้าของเจ้า!" [task_contract_employer.GetTitledFirstNameNoTooltip] ตะโกน "หัวใจที่อ่อนนุ่มของเจ้า — และผู้คนที่น่าสงสารของข้า — ถูกเยาะเย้ยไปทั่ว [task_contract_employerr.GetPrimaryTitle.GetNameNoTierNoTooltip]! กลอุบายของเจ้ามันชัดเจน... และตอนนี้ #EMP เรา#! ต้องรับผลที่ตามมา"
 laamp_extra_contract_schemes.0003.desc_martial: "ขณะที่ผู้ติดตามของข้าอาละวาดใน [task_contract_target.GetPrimaryTitle.GetName] [task_contract_target.GetName] ก็ไม่หวั่นไหว การคุกคามผู้คนของ [task_contract_target.GetHerHis] ทั้งหมดได้รับการตอบแทนในทำนองเดียวกันต่อ [task_contract_employer.GetTitledFirstNamePossessive]\n\n"เราพอแล้ว!" นายจ้างของข้ากล่าว "ช่วงเวลาอันเลวร้ายเหล่านี้จะทำลายเรา! ส่งอันธพาลของเจ้ากลับไป หรือ [task_contract_employer.Custom('KnightCulturePluralNoTooltip')|l] ของข้าและของเจ้าเหนือหัวของข้าจะร่วมมือกันต่อต้านเจ้า!""
 laamp_extra_contract_schemes.0003.desc_intrigue: "[task_contract_target.GetName] กลายเป็น [task_contract_target.GetWomanMan] ที่ฉลาดและรอบคอบมาก เมื่อล้มเหลวในการหาสิ่งสกปรกที่เป็นรูปธรรม ข้าได้พยายามปล่อยข่าวลือในราชสำนักของ [task_contract_target.GetHerHis] แต่ทั้งหมดถูกโต้แย้งและบดขยี้ทันที\n\n"สายลับของเจ้าพูดพล่ามเหมือนเด็ก!" นายจ้างของข้าดูถูก "เจ้าบอกว่ากลอุบายของเจ้าจะปกป้องผู้คนของข้า แต่เจ้ากลับห่อหุ้มเราด้วยเงาและเสียงกระซิบ — ที่สลายไปเมื่อพูดออกมาดัง ๆ! กลอุบายนี้ไร้ประโยชน์เสมอมา...""
 laamp_extra_contract_schemes.0003.desc_learning: "ข้าพิจารณาทุกสิ่งที่ข้าสามารถหาได้เกี่ยวกับกฎหมาย [task_contract_target.GetPrimaryTitle.GetAdjectiveNoTooltip]: หลักธรรมนูญ [task_contract_target.GetFaith.GetName] หลักการ [task_contract_target.GetCulture.GetName]... ข้ารวบรวมข้อโต้แย้งที่อ่อนแอได้บางส่วน แต่ศัพท์เฉพาะทางที่สร้างสรรค์ของข้าทำได้เพียงเล็กน้อยในการสร้างความประทับใจให้ [task_contract_employer.GetName]\n\n"#EMP นี่#! คือสิ่งที่เจ้าคิดขึ้นมาได้รึ? เจ้าคิดว่าผู้คนของข้าควรได้รับการปฏิบัติทางกฎหมายเหมือน #EMP เด็ก#! ภายใน [task_contract_target.GetPrimaryTitle.GetName]?!?" [task_contract_employer.GetTitleAsNameNoTooltip] ร้องออกมา "กลอุบายเล็กน้อยที่น่าอัปยศ และเป็นกลอุบายที่ [task_contract_target.GetTitledFirstName] จะมองทะลุได้อย่างง่ายดาย! ไม่ — เราหมดหวังแล้ว""
 laamp_extra_contract_schemes.0003.a: "ข้าไม่ได้ ทำให้สถานการณ์ดีขึ้นสำหรับ [task_contract_employer.GetTitledFirstNameNoTooltip] เลย..."

