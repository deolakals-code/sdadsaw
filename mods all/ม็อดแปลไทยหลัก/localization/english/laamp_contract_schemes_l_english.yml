 laamp_base_contract_schemes.2301.t: "$laamp_base_contract_schemes.2004.t$: ประตูเมือง"
 laamp_base_contract_schemes.2301.desc.intro: ""[ROOT.Char.GetTitledFirstNameNoTooltip] ยินดีต้อนรับ!" [person_a.GetTitledFirstName] ร้องออกมาขณะที่คณะของข้าและตัวข้าเข้าสู่เมืองของ [person_a.GetHerHis]"
 laamp_base_contract_schemes.2301.desc.intro.has_quartermaster: "[quartermaster.GetFirstName] [GetCourtPositionType('quartermaster_camp_officer').GetName()] ของข้ากระโดดตามหลังข้ามา ตื่นตัวและพร้อมที่จะช่วยเหลือ"
 laamp_base_contract_schemes.2301.desc.midtro: "\n\nในเวลาอันสั้น ข้าก็ได้รับการแนะนำให้รู้จักกับผู้มีอิทธิพลคนอื่น ๆ ของเมือง — [person_b.GetFirstName], [person_c.GetFirstName], และ [person_d.GetFirstName]\n\n"เรา #EMP แน่ใจ#! ว่าท่านจะเห็นด้วยกับเรา""
 laamp_base_contract_schemes.2301.desc.liar.honest_or_good: "เมื่อเรากล่าวว่าเราไม่สามารถจ่ายค่าธรรมเนียมเพิ่มเติมที่ [person_a.GetLadyLord] [person_a.GetTitledFirstName] ของเราจะเรียกเก็บได้" [person_a.GetFirstNameNoTooltip] พูดเสียงยานคาง\n\nการส่งมอบของ [person_a.GetHerHis|U] ราบรื่นและสม่ำเสมอ เป็นคำพูดของ [person_a.GetWomanMan] ที่ซื่อสัตย์หรือคนโกหกที่เก่งกาจมาก"
 laamp_base_contract_schemes.2301.desc.liar.not_lying: "เมื่อเราประท้วงภาษีที่ไม่เป็นธรรมนี้ เราเป็นเพียงชาวเมืองธรรมดา และเราได้มอบทุกสิ่งที่เราสามารถให้ได้แก่ [employer.GetTitledFirstName] ไปนานแล้ว"\n\nอาจจะจริง อาจจะไม่ เราจะได้เห็นในไม่ช้า"
 laamp_base_contract_schemes.2301.desc.liar.poor_liar_lying: "เ-เมื่อเรากล่าวว่าเราไม่ส-สามารถ และ #EMP จะไม่#! ซ่อนสิ่งใดจาก [employer.GetTitledFirstName]!" [person_a.GetFirstNameNoTooltip] พูดพล่าม"
 laamp_base_contract_schemes.2301.desc.liar.other_liars_lying: "$laamp_base_contract_schemes.2301.desc.liar.not_lying$"
 laamp_base_contract_schemes.2301.a: "ข้าจะเริ่มกับเจ้า [person_a.GetFirstNameNoTooltip]"
 laamp_base_contract_schemes.2301.a.tt: "ท่านตรวจสอบทรัพย์สินของ [person_a.GetFirstNamePossessive] ทันที"
 laamp_base_contract_schemes.2301.b: "บางทีอาจจะเริ่มจากธุรกิจของ [person_b.GetFirstNamePossessiveNoTooltip]?"
 laamp_base_contract_schemes.2301.b.tt: "ท่านตรวจสอบทรัพย์สินของ [person_b.GetFirstNamePossessive] ทันที"
 laamp_base_contract_schemes.2301.c: "เราจะตรวจสอบ [person_c.GetFirstNameNoTooltip] ก่อน"
 laamp_base_contract_schemes.2301.c.tt: "ท่านตรวจสอบทรัพย์สินของ [person_c.GetFirstNamePossessive] ทันที"
 laamp_base_contract_schemes.2301.d: "[person_d.GetFirstNameNoTooltip] โปรดนำทาง"
 laamp_base_contract_schemes.2301.d.tt: "ท่านตรวจสอบทรัพย์สินของ [person_d.GetFirstNamePossessive] ทันที"

 laamp_base_contract_schemes.2311.t: "$laamp_base_contract_schemes.2004.t$: [char_current.GetFirstNameNoTooltip]"
 laamp_base_contract_schemes.2311.desc.business.council_chamber: "ที่พักของ [char_current.GetFirstNamePossessive] ในฐานะ [char_current.GetTitleAsNameNoTooltip] ของเมืองนั้นกว้างขวางอย่างน่าประหลาดใจ [char_current.GetSheHe|U] นำข้าไปยังห้องที่เห็นได้ชัดว่าใช้สำหรับการประชุมของผู้ที่สำคัญที่สุดของชุมชน ให้ข้านั่งที่หัวโต๊ะ"
 laamp_base_contract_schemes.2311.desc.business.armory: "[char_current.GetFirstName] นำเราไปยังแหล่งความมั่งคั่งของ [char_current.GetHerHis]: คลังอาวุธที่มีของครบครัน — พร้อมโรงตีเหล็กติดอยู่ — ซึ่งจัดหาอาวุธและเครื่องกระสุนให้แก่กองทหารอาสาสมัครและกองคาราวานที่ผ่านไปมา"
 laamp_base_contract_schemes.2311.desc.business.temple: "[char_current.GetFirstName] ดูเหมือนจะสร้างความมั่งคั่งส่วนใหญ่ของ [char_current.GetHerHis] จากการให้เช่าหอพักสำหรับผู้มาเยือนศาลเจ้าในท้องถิ่นและดำเนินงานการกุศลเล็ก ๆ — โดยหักเพียงเศษเสี้ยวไว้สำหรับ [char_current.GetHerselfHimself] แน่นอน"
 laamp_base_contract_schemes.2311.desc.business.dungeon: "ดูเหมือนว่า [char_current.GetFirstName] จะควบคุมคุกเล็ก ๆ สร้างความมั่งคั่งของ [char_current.GetHerHis] โดยการคุมขังลูกหนี้ คนจรจัด และอาชญากรในนามของผู้อื่น เงินจำนวนมากจากค่าธรรมเนียมและค่าปรับจากผู้ถูกคุมขังช่วยเสริมการดำเนินงาน"
 laamp_base_contract_schemes.2311.desc.business.docks: "เงินของ [char_current.GetFirstNamePossessive] เห็นได้ชัดว่ามาจากท่าเรือของเมือง ที่ ซึ่ง [char_current.GetSheHe] มีสำนักงานเล็ก ๆ ที่ตก แต่งอย่างดีมองเห็นท่าเรือที่พลุกพล่านที่สุด บานหน้าต่างกว้างคู่หนึ่งช่วยให้ [char_current.GetHerHim] สามารถเอนตัวออกไปตะโกนใส่คนขนของที่เกียจคร้านเป็นระยะ ๆ ได้"
 laamp_base_contract_schemes.2311.desc.business.study: "ชุมชนนักวิชาการใน [destination_1.GetBaseNameNoTier] มีขนาดเล็ก แต่ก็เหนียวแน่น อาลักษณ์ในท้องถิ่นส่วนใหญ่ดูเหมือนจะทำงานให้กับ [char_current.GetFirstName] ในลักษณะใดลักษณะหนึ่ง ซึ่งดำเนินธุรกิจอย่างเป็นระเบียบด้วยการผูกขาดการเขียนจดหมายในเมืองเกือบทั้งหมดของ [char_current.GetHerHis]"
 laamp_base_contract_schemes.2311.desc.business.physicians_study: "ธุรกิจของ [char_current.GetFirstNamePossessive] ดูเหมือนจะผูกพันอย่างมากกับยา การรักษา และการจัดหาหมอตำแยที่ดี เป็นอาชีพที่ไม่ธรรมดาสำหรับผู้มีอิทธิพล แต่แน่นอนว่าเป็นอาชีพที่มีความต้องการมากมาย"
 laamp_base_contract_schemes.2311.desc.business.tavern: "เช่นเดียวกับคนอื่น ๆ อีกมากมาย รายได้ของ [char_current.GetFirstNamePossessive] มาโดยตรงจากมือที่กระหายของกรรมกรผู้ต่ำต้อยแห่ง [destination_1.GetBaseNameNoTierPossessive] อาหารที่ดีสำหรับนักเดินทาง ดนตรีสำหรับคนท้องถิ่น และบรรยากาศที่เป็นกันเอง ทำให้เป็นสถานประกอบการที่ทำกำไรได้"
 laamp_base_contract_schemes.2311.desc.business.bp1_kitchen_western: "ธุรกิจของ [char_current.GetFirstNamePossessive] หมุนรอบการจัดเก็บและจัดหาอาหาร ทั้งอาหารแปลกใหม่และอาหารจำนวนมาก สามัญชนได้รับธัญพืชราคาถูกในยามจำเป็น ชนชั้นสูงในท้องถิ่นมีคนที่จะไปหาสำหรับอาหารตามสมัยนิยมจากเมืองหลวงที่ห่างไกล"
 laamp_base_contract_schemes.2311.desc.business.market: "[char_current.GetFirstName] บริหารจัตุรัสตลาดหลักของ [destination_1.GetBaseNameNoTierPossessive] ซึ่งเป็นกิจการที่เรียบง่าย แต่ให้ผลกำไร [char_current.GetSheHe|U] จัดการพื้นที่แผงลอย เรียกเก็บค่าธรรมเนียม เก็บภาษีสำหรับ [person_a.GetTitleAsNameNoTooltip] และเครื่องประดับอื่น ๆ ที่คาดหวังทั้งหมด"
 laamp_base_contract_schemes.2311.desc.business.bath_house: "จุดแห่งความหรูหรา [char_current.GetFirstName] บริหารโรงอาบน้ำที่เจริญรุ่งเรืองภายในกำแพงของ [destination_1.GetBaseNameNoTierPossessive] ไม่มีคนโง่คนใดที่ยังมีชีวิตอยู่ที่จะไม่ชื่นชมการอาบน้ำที่ดี ชำระล้างฝุ่นและสิ่งสกปรกของโลกสมัยใหม่ออกไป และเหรียญสองสามเหรียญสำหรับสิทธิพิเศษนั้นคุ้มค่ากับราคา"
 laamp_base_contract_schemes.2311.desc.personality.mayor: ""ท่าน [ROOT.Char.GetTitleAsNameNoTooltip] ผู้ทรงเกียรติ ท่านต้องเห็นอย่างแน่นอนว่าความโลภของ [employer.GetTitleAsNamePossessive] นั้น... ผิดที่ผิดทาง [employer.GetSheHe|U] ได้มอบอำนาจของ [employer.GetHerHis] ให้แก่ท่าน ช่วยเราในเรื่องนี้ แล้วเราจะดูแลให้โลกได้รับรู้ถึงความเอื้อเฟื้อของท่าน""
 laamp_base_contract_schemes.2311.desc.personality.ai_honor: ""อย่างที่ท่านเห็น ทรัพย์สินของข้าประสบความสำเร็จ แต่ก็ไม่ได้กว้างขวางนัก เราทำงานที่ดีและซื่อสัตย์ที่นี่ แต่เราไม่สามารถจ่ายค่าธรรมเนียมที่สูงชัน เช่นนี้สำหรับส่วนที่ครบกำหนดของ [employer.GetTitleAsNamePossessive] ได้""
 laamp_base_contract_schemes.2311.desc.personality.ai_zeal: ""เราทำงานของ [char_current.GetFaith.HealthGodNamePossessive] ที่นี่ [ROOT.Char.GetTitledFirstNameNoTooltip] และไม่มีข้อผิดพลาด ทศางค์อีกครั้งจะ ทำให้เราพิการ นั่นควรจะชัดเจนเพียงพอ""
 laamp_base_contract_schemes.2311.desc.personality.ai_greed: ""ข้าได้ส่วนแบ่งยุติธรรมของข้าหรือไม่? ใช่ แน่นอน แต่นั่นแหละ มันคือส่วน #EMP ของข้า#! ข้าจ่ายภาษีที่ข้ามีภาระผูกพัน แต่ นี่ไม่ใช่ภาษีที่เหมาะสม มันเป็นเพียงความเพ้อฝันไร้จุดหมายจาก [employer.GetTitleAsName] และเราทุกคนรู้ดี""
 laamp_base_contract_schemes.2311.desc.personality.ai_compassion: ""ท่านดูเหมือนเป็น [ROOT.Char.GetWomanMan] ที่มีเหตุผล [ROOT.Char.GetTitledFirstNameNoTooltip] โปรดเข้าใจว่าเรากำลังทำดีที่สุดที่นี่ แต่เราอยู่ห่างจากปัญหาเพียงปีที่เลวร้ายปีเดียวเสมอ แม้กระทั่งความอดอยาก""
 laamp_base_contract_schemes.2311.desc.personality.ai_boldness: ""ข้าถือว่าตัวเองเป็น [char_current.GetWomanMan] ที่ตรงไปตรงมา ข้าพูดอย่างตรงไปตรงมาและข้าหวังว่าคนอื่น ๆ จะพูดอย่างตรงไปตรงมากับข้า #EMP ภาษี#! ของ [employer.GetTitleAsNamePossessive] นั้นไม่ยุติธรรมและเราไม่สามารถจ่ายได้ นั่นคือทั้งหมดที่มี""
 laamp_base_contract_schemes.2311.desc.personality.ai_rationality: ""ข้ารู้ ข้ารู้ ดูเหมือนว่าเรากำลังทำได้ดีสำหรับตัวเราเอง แต่นี่แทบจะไม่ใช่ #EMP หน้าที่#! เพิ่มเติมแรกที่ [employer.GetTitleAsName] ได้มอบหมายให้เราในปีนี้ และข้าสงสัยว่า จะเป็นครั้งสุดท้าย ท่านต้องเข้าใจความไม่เต็มใจของเรา""
 laamp_base_contract_schemes.2311.desc.personality.ai_vengefulness: ""ข้าชอบเล่นอย่างยุติธรรม [ROOT.Char.GetTitledFirstNameNoTooltip] ทั้งในธุรกิจ กับผู้ที่ด้อยกว่าข้า และกับผู้ที่เหนือกว่าข้า แต่ความยุติธรรมจะรับประกันได้ก็ต่อเมื่อทุกคนเป็นส่วนหนึ่งของมัน มิฉะนั้น อืม นั่นคือวิธีที่คน #EMP บางคน#! มีเลือดที่ไม่ดี""
 laamp_base_contract_schemes.2311.desc.personality.ai_energy: ""ข้าเป็น [char_current.GetWomanMan] ที่ยุ่ง ท่านเป็น [ROOT.Char.GetWomanMan] ที่ยุ่ง ดังนั้นข้าจะพูดตรง ๆ หากเรามีเงิน เรายินดีที่จะจ่าย แต่เราไม่มี ดังนั้นเราจะไม่จ่าย นั่นเพียงพอแล้ว ใช่ไหม?""
 laamp_base_contract_schemes.2311.desc.personality.ai_sociability: ""ดูสิ มาทิ้งเรื่องน่าเกลียดทั้งหมดนี้ไว้ข้างหลังแล้วมาดื่มกัน ทำไมไม่พักสักครู่! เราไม่ค่อยมีแขกที่น่าสนใจ เช่นนี้ในเมืองเล็ก ๆ ของเรา ข้ามั่นใจว่าท่านคงไม่ต้องเติมถ้วยของท่านเองเป็นเวลาอย่างน้อยหนึ่งสัปดาห์""
 laamp_base_contract_schemes.2311.desc.personality.ai_personality_fallback: ""งั้น... เราจะทำสิ่งนี้อย่างไร? ข้าไม่ได้จดบันทึกทุกอย่าง ท่านรู้ไหม นั่นจะมีค่าใช้จ่ายสูงมาก ส่วนใหญ่เป็นการจับมือ สัญญาที่เก็บไว้ที่อื่น ท่านรู้ประเภทนั้น...""
 laamp_base_contract_schemes.2311.desc.loot.gold: "ขณะที่ [char_current.GetSheHe] พูด จิตใจของข้าก็หวนคิดถึงหีบใบใหญ่ที่ดูเหมือนจะเป็นเงินที่เราเดินผ่านเข้ามา..."
 laamp_base_contract_schemes.2311.desc.loot.courtier_opinion: "[char_current.GetSheHe|U] พูดคุยขณะที่เราเดิน และข้าอดไม่ได้ที่จะสังเกตเห็นเราเดินผ่านห้องเก็บของที่เต็มไปด้วยของฟุ่มเฟือย..."
 laamp_base_contract_schemes.2311.desc.loot.piety: "[char_current.GetSheHe|U] พูดพล่ามต่อไป แต่ข้าอดไม่ได้ที่จะสังเกตเห็นเราเดินผ่านซุ้มที่เต็มไปด้วยสิ่งของมีค่าทางศรัทธา..."
 laamp_base_contract_schemes.2311.desc.loot.provisions: "[char_current.GetSheHe|U] ยังคงพูดคุยต่อไป แต่ข้าดูเหมือนจะลืมครัวที่มีของครบครันที่เราเดินผ่านเพื่อมาที่นี่ไม่ได้..."
