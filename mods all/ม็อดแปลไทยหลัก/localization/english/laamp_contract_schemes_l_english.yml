 laamp_base_contract_schemes.3782.t: "$laamp_base_contract_schemes.3041.t$: สำเร็จ!"
 laamp_base_contract_schemes.3782.desc.intro: "ดุจเงาในยามค่ำคืน เราจากไปแล้ว\n\nเสียงร้องเตือนและความโกรธเกรี้ยวแรกเป็นเพียงเสียงสะท้อนอันห่างไกลเมื่อมาถึงหูของเรา เสียงทื่อๆ ของผลที่ตามมาอันไกลโพ้น"
 laamp_base_contract_schemes.3782.desc.haul_amount.grabbed_everything: "ตัดกับของที่ขโมยมา #EMP จำนวนมหาศาล#! ที่เราพบวางอยู่บนตักของเราอย่างน่าสมเพช ขุมทรัพย์ที่แท้จริงของถ้วยรางวัลที่ขายได้และโลหะมีค่า"
 laamp_base_contract_schemes.3782.desc.haul_amount.grabbed_most: "ถูกมองข้ามไปอย่างง่ายดายขณะที่เราสำรวจของที่ปล้นมาอันรุ่งโรจน์ของเรา ความมั่งคั่งที่รวบรวมมาจาก [employer.GetPrimaryTitle.GetBaseNameNoTier] ถูกปล้นไปจากโถงของ [employer.GetLadyLord] และมัดรวมกันอย่างไม่เป็นระเบียบที่เท้าของเรา"
 laamp_base_contract_schemes.3782.desc.haul_amount.grabbed_lots: "ไม่น่าสนใจนักเมื่อเราพบความมั่งคั่งมากมาย เช่นนี้อยู่บนตักของเราทันที แน่นอนว่า [employer.GetTitledFirstName] ต้องมีของมีค่าให้ปล้นสะดมเพิ่มเติมอีก แต่การโลภเกินไปเป็นความผิดพลาดแรก — และมักจะเป็นครั้งสุดท้าย — ของหัวขโมยมือสมัครเล่น\n\nน้ำหนักอันน่าพึงพอใจของรายได้ของเรานั้นมากพอที่จะถ่วงเราลงขณะที่เราเดินทางกลับบ้านอย่างร่าเริง"
 laamp_base_contract_schemes.3782.desc.haul_amount.grabbed_nothing: "ดังก้องอยู่ในหูของเราขณะที่เราเดินทางกลับไปยังจุดนัดพบด้วยเหงื่อที่ชุ่มโชก\n\nแม้ข้าจะประกาศอย่างยิ่งใหญ่ว่าจะได้รับเหรียญพิเศษ แต่เราก็ออกมาจากโถงของ [employer.GetTitledFirstNamePossessive] โดยไม่มีแม้ แต่ทองแดงเดียวเพื่อแสดงให้เห็นถึงความเสี่ยงที่เพิ่มขึ้น\n\nคืนนี้ ดูเหมือนว่าเราจะต้องพอใจกับของที่ปล้นมาในตอนแรก"
 laamp_base_contract_schemes.3782.desc.haul_amount.grabbed_some: "เตือนเราว่าบางทีรายได้พิเศษของเราอาจมาพร้อมกับต้นทุนที่สูงขึ้น\n\nถึงกระนั้น สิ่งที่ทำไปแล้วก็ทำไปแล้ว และเรามีของที่ปล้นมาเล็กน้อยที่น่านับถือ ทั้งเงิน ทอง และอัญมณี เพื่อแสดงให้เห็นถึงความพยายามของเรา น่าจะขายได้ราคาดีพอสมควร สรุปแล้ว"
 laamp_base_contract_schemes.3782.desc.outro: "\n\nไม่เลวสำหรับงานคืนเดียว"
 laamp_base_contract_schemes.3782.a: "เหะ ตอนนี้ไปขายของที่ปล้นมานี่กัน..."

 laamp_base_contract_schemes.3783.t: "$laamp_base_contract_schemes.3041.t$: ล้มเหลว!"
 laamp_base_contract_schemes.3783.desc.intro: "โลกยามค่ำคืนมีชีวิตชีวาขึ้นด้วยเสียงตะโกน เสียงกรีดร้อง และเสียงโห่ร้อง ใครเป็นผู้ส่งสัญญาณเตือนเราจะไม่มีวันรู้ แต่เมื่อถูกปลุกแล้ว ผู้ป้องกันของ [employer.GetTitledFirstNamePossessive] ก็มีจำนวนมากเกินไปสำหรับเรา\n\n"
 laamp_base_contract_schemes.3783.desc.haul_amount.grabbed_everything: "เรามีทุกอย่าง — #EMP ทุกอย่าง#! — ที่มีค่าใดๆ ใน [employer.Custom('FortifiedBuilding')] บ้าๆ นี่ ทั้งจานเงินทุกใบ เหรียญทองทุกเหรียญ หนังสือปิดทองทุกเล่ม และตอนนี้มันหายไปหมดแล้ว ทั้งหมด... หายไป..."
 laamp_base_contract_schemes.3783.desc.haul_amount.grabbed_most: "เงินมากมาย ของที่ปล้นมา #EMP มากมาย#! หายไป เรามีความมั่งคั่งที่รวบรวมมาจาก [employer.GetPrimaryTitle.GetBaseNameNoTier] อยู่ในมือของเรา และเราปล่อยให้มันทั้งหมด... หลุดลอยไป..."
 laamp_base_contract_schemes.3783.desc.haul_amount.grabbed_lots: "เราได้รวบรวมของที่ปล้นมาจำนวนมากพอสมควรเมื่อถึงเวลาที่พวกเขาจับเราได้ น่าเสียดายจริงๆ... เงินทั้งหมดนั้นน่าจะขายได้ดีเป็นพิเศษในเมืองถัดไปสักเมืองหรือสองเมือง..."
 laamp_base_contract_schemes.3783.desc.haul_amount.grabbed_nothing: "เรายังไม่ได้เอาอะไรไปเลยด้วยซ้ำ"
 laamp_base_contract_schemes.3783.desc.haul_amount.grabbed_some: "เรายังไม่ได้เอาไปมากนัก แต่แน่นอนว่ามีเจ้าของเพียงไม่กี่คนที่คำนึงถึง #EMP จำนวน#! เมื่อเผชิญหน้ากับหัวขโมย — โดยทั่วไปแล้วพวกเขาเพียงแค่สงสัยว่าจะตัดมือซ้าย มือขวา หรือทั้งสองข้าง"
 laamp_base_contract_schemes.3783.desc.outro: "\n\nเราถูกลากไปอย่างไม่สมเกียรติ ตามเสียงกรีดร้องด้วยความโกรธเกรี้ยวของ [employer.GetTitleAsNameNoTooltip] ตรงไปยังคุกใต้ดิน"
 laamp_base_contract_schemes.3783.tt.haul_lost: "ของที่ปล้นมาพิเศษทั้งหมดของท่านสูญหาย ถูกส่งคืนให้ [employer.GetTitledFirstName]"
 laamp_base_contract_schemes.3783.a: "สาปแช่งกำแพงนรกนี่!"
 laamp_base_contract_schemes.3783.a.tt.a_cold_cell_awaits: "ห้องขังอันหนาวเหน็บรออยู่..."

 laamp_base_contract_schemes.5661.t: "$laamp_base_contract_schemes.5034.t$: [ROOT.Char.GetCurrentLocation.GetNameNoTooltip]"
 laamp_base_contract_schemes.5661.desc.intro.constantinople: "เราพบว่าตนเองอยู่นอกกำแพงอันยิ่งใหญ่ของ [ROOT.Char.GetCurrentLocation.GetName] อันน่าเคารพ,"
 laamp_base_contract_schemes.5661.desc.intro.plains: "การบุกปล้นยามค่ำคืนของเรานำพาเราลึกเข้าไปในทุ่งราบของ [ROOT.Char.GetCurrentLocation.GetName],"
 laamp_base_contract_schemes.5661.desc.intro.farmlands: "กองกำลังของข้าและข้าเดินทางฝ่าพื้นที่เกษตรกรรมอันหนาแน่นของ [ROOT.Char.GetCurrentLocation.GetName],"
 laamp_base_contract_schemes.5661.desc.intro.hills: "กองกำลังของข้าแทรกตัวผ่านเนินเขาของ [ROOT.Char.GetCurrentLocation.GetName] อย่างง่ายดาย,"
 laamp_base_contract_schemes.5661.desc.intro.mountains: "เย็นนี้เราปีนป่ายเนินลาดต่ำและตีนเขาระหว่างภูเขาของ [ROOT.Char.GetCurrentLocation.GetName],"
 laamp_base_contract_schemes.5661.desc.intro.desert: "เช้านี้เราออกตีฝ่าเข้าไปในทะเลทรายของ [ROOT.Char.GetCurrentLocation.GetName],"
 laamp_base_contract_schemes.5661.desc.intro.desert_mountains: "ด้วยความมุ่งมั่นที่จะหา #EMP บางสิ่ง#! ให้เจอ พลปล้นของข้าและข้าสำรวจภูเขาอันแห้งแล้งของ [ROOT.Char.GetCurrentLocation.GetName],"
 laamp_base_contract_schemes.5661.desc.intro.oasis: "ภายใต้แสงอาทิตย์ยามรุ่งอรุณอันเจิดจ้า กองทหารของข้ากระจายกำลังออกไปในโอเอซิสอันเขียวขจีของ [ROOT.Char.GetCurrentLocation.GetName],"
 laamp_base_contract_schemes.5661.desc.intro.jungle: "ภายใต้ร่มเงาของต้นไม้ เราออกปฏิบัติการเข้าไปในป่าทึบของ [ROOT.Char.GetCurrentLocation.GetName],"
 laamp_base_contract_schemes.5661.desc.intro.forest: "ภายใต้ร่มไม้ที่อุดมสมบูรณ์ของ [ROOT.Char.GetCurrentLocation.GetName] เราออกเดินทางไปข้างหน้า,"
 laamp_base_contract_schemes.5661.desc.intro.taiga: "ระหว่างต้นสนที่ขรุขระของ [ROOT.Char.GetCurrentLocation.GetName] กองกำลังของข้ากระจายกำลังออกไป,"
 laamp_base_contract_schemes.5661.desc.intro.wetlands: "ในช่วงเที่ยงวัน ทหารที่สายตาดีที่สุดของเราเข้าสู่พื้นที่ชุ่มน้ำของ [ROOT.Char.GetCurrentLocation.GetName],"
 laamp_base_contract_schemes.5661.desc.intro.steppe: "เช่นเดียวกับหลายวันที่ผ่านมา กองทหารของข้าเคลื่อนพลไปทั่วทุ่งหญ้าสเตปป์อันไร้ขอบเขตของ [ROOT.Char.GetCurrentLocation.GetName],"
 laamp_base_contract_schemes.5661.desc.intro.floodplains: "ด้วยทางเลือกอื่นเพียงน้อยนิด กลุ่มของข้าถูกบีบให้เข้าไปในที่ราบน้ำท่วมถึงอันอบอ้าวของ [ROOT.Char.GetCurrentLocation.GetName],"
 laamp_base_contract_schemes.5661.desc.intro.drylands: "เตะฝุ่นฟุ้งกระจายไม่สิ้นสุด กองกำลังของข้าและข้ากระจายกำลังไปทั่วพื้นที่แห้งแล้งของ [ROOT.Char.GetCurrentLocation.GetName],"
 laamp_base_contract_schemes.5661.desc.intro.postamble: "เพื่อค้นหาฝูง [ROOT.Char.Custom('RegionalFarmAnimalPlural')] ที่อ่อนแอเพื่อต้อนกลับไปยังค่ายพักแรมเคลื่อนที่ของเรา"
 laamp_base_contract_schemes.5661.desc.opportunity.01: "เป้าหมายที่เป็นไปได้หลายรายสะดุดตาข้าในระหว่างการบุกเข้าไปในภูมิภาคเมื่อเร็วๆ นี้ แต่จนถึงขณะนี้เราเพียงแค่ทำการลาดตระเวนเบาๆ เท่านั้น"
 laamp_base_contract_schemes.5661.desc.opportunity.02: "จนถึงขณะนี้ ของที่ปล้นได้ที่นี่ค่อนข้างเบาบาง โดยมีการต่อต้านที่รุนแรงเกินกว่าจะรวบรวมสัตว์ที่ถูกขโมยมาจำนวนมากได้ ในที่สุด เราก็ได้พบกับฟาร์มที่ป้องกันหละหลวมพร้อมฝูงสัตว์มากมายในครอบครอง"
 laamp_base_contract_schemes.5661.desc.opportunity.03: "แม้ว่าพื้นที่นี้ดูเหมือนจะทารุณกรรมได้ง่ายกว่าที่อื่น แต่เราก็งดเว้นจากการทำ เช่นนั้น — รอจนกว่าจะพบเป้าหมายที่สมบูรณ์แบบก่อนที่จะปลดปล่อยความโหดร้ายที่สุดของเรา คืนนี้ ด้วยการค้นพบที่ดินอันอุดมสมบูรณ์ที่เต็มไปด้วยวัวอ้วนพี เราได้พบเป้าหมายของเราแล้ว"
 laamp_base_contract_schemes.5661.desc.opportunity.04: "แม้ว่าจะมีที่ดินขนาดใหญ่เพียงไม่กี่แห่งที่นี่ แต่ฟาร์มขนาดเล็กในพื้นที่ดูเหมือนจะเจริญรุ่งเรืองพอสมควร การรื้อค้นพวกมันจะต้องใช้ความพยายามมากขึ้น แต่ผลตอบแทนสุดท้ายก็ยังควรค่าแก่ความเหนื่อยยาก"
 laamp_base_contract_schemes.5661.desc.opportunity.05: "ชาวบ้าน — อย่างน้อยก็พวกที่กล้าแสดงตัวต่อหน้าเรา — อ้างว่ายากจน แต่ข้าก็คงทำ เช่นนั้นหากตกอยู่ในสถานการณ์เดียวกับพวกเขาหาก [ROOT.Char.GetPrimaryTitle.GetDefinitiveName|l] มาเคาะประตูบ้านข้า ดูเหมือนว่าพวกเขามีฝูงสัตว์เพียงพอสำหรับความต้องการของเรา อย่างน้อยก็ เช่นนั้น"
 laamp_base_contract_schemes.5661.desc.opportunity.06: "ไม่มีที่ว่างสำหรับความสงสาร ไม่มีพื้นที่ที่จะยอมรับความเสียหายที่เรากำลังทำต่อชาวนาผู้ต่ำต้อยเหล่านี้ สัตว์ของพวกเขาจะตกเป็นของเรา หรือเราจะสังหารพวกเขาด้วยดาบ — มันก็มีอยู่แค่นั้น"
 laamp_base_contract_schemes.5661.desc.outro: "\n\nบัดนี้ถึงเวลาแห่งความรุนแรงแล้ว"
 laamp_base_contract_schemes.5661.tt.encounter_tally: "#TUT นี่คือการเผชิญหน้าครั้งที่ [task_contract.MakeScope.Var('encounter_tally').GetValue|0] จาก [task_contract.MakeScope.Var('encounter_max').GetValue|0]#!"
 laamp_base_contract_schemes.5661.tt.current_successes: "#TUT ปัจจุบันท่านมีการปล้นปศุสัตว์สำเร็จ [task_contract.MakeScope.Var('wins_tally').GetValue|0] ครั้ง#!"
