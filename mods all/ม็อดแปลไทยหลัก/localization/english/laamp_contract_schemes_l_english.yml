 laamp_base_contract_schemes.1301.t: "$laamp_base_contract_schemes.1004.t$"
 laamp_base_contract_schemes.1301.desc.intro.preamble.first: "เราพบ [recidivist.GetFirstNameNicknamed] ครั้งแรกใน"
 laamp_base_contract_schemes.1301.desc.intro.preamble: "เราตามทัน [recidivist.GetFirstNameNicknamed] ใน"
