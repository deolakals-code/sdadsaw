 laamp_base_contract_schemes.0561.t: "ข้อต่อที่อ่อนแอที่สุด"
 # ... obligatory "you are $laamp_base_contract_schemes.0561.t$, goodbye".
 laamp_base_contract_schemes.0561.desc: "[insider.GetTitledFirstName] เห็นได้ชัดว่าเป็นหนึ่งในคนใกล้ชิดและเป็นที่รักที่สุดของ [target.GetTitledFirstNamePossessive] มีอันดับสูงในลำดับชั้นทางสังคมและมีอิทธิพล #EMP มากมาย#! เหนือ [target.GetTitleAsNameNoTooltip] ผู้ดีงาม\n\nการให้ [insider.GetWomanMan] กล่าวสรรเสริญข้า ไม่ว่าด้วยเหตุผลใดก็ตาม คงจะช่วยเรื่องของข้าได้อย่างแน่นอน"
