 laamp_base_contract_schemes.2311.e.gold: "เหรียญนั้น — ข้ากำลังยึดมันด้วย #EMP ข้อสงสัย#!."
 laamp_base_contract_schemes.2311.e.courtier_opinion: "เครื่องประดับเหล่านั้น — ข้ากำลังนำพวกมันไป #EMP ตรวจสอบ#!."
 laamp_base_contract_schemes.2311.e.piety: "เครื่องรางเหล่านั้น — ข้ากำลัง #EMP ยึด#! พวกมัน"
 laamp_base_contract_schemes.2311.e.provisions: "เสบียงเหล่านั้น — ข้ากำลังนำพวกมันไปเป็นหลักประกัน"
