 laamp_base_contract_schemes.0661.t.preface: "ผู้ไกล่เกลี่ยรับจ้าง"
 laamp_base_contract_schemes.0661.t: "$laamp_base_contract_schemes.0661.t.preface$: หน้าที่ที่ไม่เท่าเทียม"
 laamp_base_contract_schemes.0661.desc: "ปัญหาในพื้นที่นี้ดูเหมือนจะง่ายพอ — ชาวบ้านฝ่ายหนึ่งของข้อพิพาทอ้างว่าพวกเขาต้องส่ง [dummy_soldier.GetWomenMen] มากเกินไปสำหรับราชการทหาร ในขณะที่อีกฝ่ายกล่าวตรงกันข้าม\n\nการได้รับรายละเอียดเพิ่มเติมจากพวกเขานอกเหนือจากนั้นย่อมเสื่อมลงสู่การกรีดร้องและคราดที่ยกขึ้นอย่างหลีกเลี่ยงไม่ได้ ทั้งสองฝ่ายดูเหมือนจะเต็มใจที่จะฆ่ากันเองมากกว่าเพื่อโต้แย้งว่าใครต้องมีส่วนร่วมในการป้องกันร่วมกันของพวกเขามากกว่ากัน"
 laamp_base_contract_schemes.0661.a: "มาพูดคุยเกี่ยวกับเรื่องนี้กันเถอะ"
 laamp_base_contract_schemes.0661.b: "การส่งกำลังบำรุงเหรอ? ดูเหมือนจะแก้ไขได้"
 laamp_base_contract_schemes.0661.c: "อืมมม ม้วนบันทึกกล่าวว่าอย่างไร..."

 laamp_base_contract_schemes.0662.t: "$laamp_base_contract_schemes.0661.t.preface$: ผู้กล่าวหาและผู้ถูกกล่าวหา"
 laamp_base_contract_schemes.0662.desc: "เห็นได้ชัดว่าข้อพิพาทใน [location.GetName] เกี่ยวข้องกับกลุ่มอาชญากรรายย่อยในท้องถิ่นบางกลุ่มที่ซ่อนตัวอยู่ในป่า\n\nชาวเมืองแบ่งออกเป็นประมาณหนึ่งโหลกลุ่มที่เป็นปฏิปักษ์กัน แต่ละกลุ่ม #EMP เชื่อมั่น#! ว่าหนึ่งหรือมากกว่ากลุ่มอื่น ๆ กำลังสมรู้ร่วมคิดกับผู้ปล้นสะดมอย่างลับ ๆ โดยให้ความช่วยเหลือและสนับสนุนแก่พวกเขา\n\nไม่มีใครเต็มใจที่จะทำงานร่วมกันในประเด็นนี้"
 laamp_base_contract_schemes.0662.a: "ทั้งหมดนี้ดูเหมือนจะเป็นแค่ข่าวลือที่น่ารังเกียจ..."
 laamp_base_contract_schemes.0662.b: "โจรหรือ? ปัญหาที่แก้ไขได้ง่าย!"
 laamp_base_contract_schemes.0662.c: "ข้ามั่นใจว่าข้าสามารถตรวจจับคนโกหกที่นี่ได้"
 laamp_base_contract_schemes.0662.d: "ข้ากล้าพูดได้เลยว่าข้าสามารถจัดการกับปัญหาของท่านได้"

 laamp_base_contract_schemes.0663.t: "$laamp_base_contract_schemes.0661.t.preface$: สิ่งศักดิ์สิทธิ์"
 laamp_base_contract_schemes.0663.desc: "จากสิ่งที่ข้าสามารถรวบรวมได้ ผู้คนใน [location.GetName] ใกล้จะฆ่ากันตาย #EMP ขนาดนี้#! เกี่ยวกับข้อพิพาททางเทววิทยาที่เล็กน้อยเสียจนพวกเขาพยายามอธิบายความเกี่ยวข้องให้คนนอกฟัง\n\nไม่มีอะไร ทำให้ผู้คนโกรธเคืองได้เท่ากับเรื่องของศรัทธา ไม่ว่าจะดีหรือร้าย แต่ข้าต้องการให้พวกเขาหยุด หายใจ และใจเย็นลง โดยเฉพาะอย่างยิ่งโดยไม่มีการนองเลือด"
 laamp_base_contract_schemes.0663.a: "สงบสติอารมณ์และระลึกถึงคำสาบานของเราเถอะ ใช่ไหม?"
 laamp_base_contract_schemes.0663.b: "ฟังดูเหมือนการจลาจลสำหรับข้า เราสามารถ #EMP แก้ไข#! สิ่งนั้นได้"
 laamp_base_contract_schemes.0663.c: "ให้ข้าอธิบายบางสิ่งให้พวกท่านทุกคนฟัง..."

 laamp_base_contract_schemes.0664.t: "$laamp_base_contract_schemes.0661.t.preface$: การล้างแค้นในท้องถิ่น"
 laamp_base_contract_schemes.0664.desc: "ใน [location.GetName] ผู้คนได้เลือกที่จะเดินบนเส้นทางแห่งความกระหายเลือดและการแก้แค้น\n\nข้าไม่แน่ใจว่าอะไรเป็นสาเหตุให้เกิดวงจรเริ่มต้น — ทุกฝ่ายกล่าวหาทุกฝ่ายอื่น ๆ ว่ามีการฆาตกรรม #EMP ต่าง ๆ#! การลักทรัพย์ และการลอบวางเพลิงเป็นครั้งคราว — แต่ตอนนี้ไม่มีอะไรเหลือแล้วนอกจากเลือดที่ไม่ดีที่รอให้หลั่งออกมา\n\nไม่ใช่สิ่งที่ดีที่สุดสำหรับรายได้ภาษีท้องถิ่น"
 laamp_base_contract_schemes.0664.a: "ทุกคน! ท่านเป็นเพื่อนบ้านกัน จงมีอารยธรรม!"
 laamp_base_contract_schemes.0664.b: "หากท่านไม่สงบสติอารมณ์ ท่านก็จะถูก ทำให้สงบลงด้วยกำลัง"
 laamp_base_contract_schemes.0664.c: "ท่านจะจับมือกัน หรือท่านจะเสียมือไป จงเลือก"

 laamp_base_contract_schemes.0665.t: "$laamp_base_contract_schemes.0661.t.preface$: การจัดการค่าผ่านทาง"
 laamp_base_contract_schemes.0665.desc: "ดูเหมือนว่าคนโง่เขลาบางคนเพิ่งจะดักปล้นเจ้าหน้าที่ท้องถิ่นที่สำคัญหลายคนเมื่อเร็ว ๆ นี้ ไม่มีใครได้รับบาดเจ็บสาหัส แต่คนโง่คนนั้นวิ่งหนีไปพลางกรีดร้องเรื่องภาษีก่อนที่พวกเขาจะถูกจับกุมได้\n\nไม่ต้องสงสัยเลยว่าความคับข้องใจเล็กน้อยทุกอย่างที่คิดได้ #EMP ทันที#! ก็ผุดขึ้นมาพร้อมกับการมาถึงของข้า ขณะที่ชาวบ้านหันมาต่อสู้กันเองในความพยายามอย่างบ้าคลั่งที่จะหลีกเลี่ยงการลงโทษโดยรวม\n\nถึงกระนั้น คนโง่ที่กล้าหาญคนหนึ่งอย่างน้อยก็ฉลาดพอที่จะแนะนำว่านี่อาจเป็นผลมาจากการขึ้นภาษีเมื่อเร็ว ๆ นี้"
 laamp_base_contract_schemes.0665.a: "สิ่งนี้หยุด #EMP เดี๋ยวนี้#! — ข้าเป็นที่เข้าใจหรือไม่?"
 laamp_base_contract_schemes.0665.b: "บางทีภาระอาจจะลดลงเล็กน้อย..."
 laamp_base_contract_schemes.0665.c: "ท่านจะบอกข้าว่าใครทำมัน ด้วยความเต็มใจหรือ มิฉะนั้น"

 laamp_base_contract_schemes.0666.t: "$laamp_base_contract_schemes.0661.t.preface$: ปัญหาหนี้สิน"
 laamp_base_contract_schemes.0666.desc: "สิ่งที่สำคัญที่สุดที่ชุมชนใด ๆ สามารถมีส่วนร่วมได้ เท่าที่เจ้านายของพวกเขามีแนวโน้มที่จะกังวล คือภาษีปกติของมัน\n\nน่ากังวลแล้วที่ผู้คนใน [location.GetName] ล้มเหลวในการจ่ายภาษีของพวกเขา อย่างน้อยก็ไม่ครบถ้วน\n\nโอ้ พวกเขามีข้อแก้ตัวและเหตุผลทุกประเภ ทว่าทำไมสิ่งนี้อาจเกิดขึ้น แต่ส่วนใหญ่มันเป็นเพียงการสมรู้ร่วมคิดของชุมชนที่ใหญ่ที่สุดเพื่อรังแกเมืองที่ร่ำรวยและกำลังเติบโต"
 laamp_base_contract_schemes.0666.a: "ข้ามั่นใจว่าทั้งหมดนี้เป็นเพียงความเข้าใจผิด"
 laamp_base_contract_schemes.0666.b: "อา ข้าคิดว่าข้าเห็นปัญหาแล้ว..."
 laamp_base_contract_schemes.0666.c: "ตัวเลขเหล่านี้ดูเหมือนจะไม่ลงตัว?"

 laamp_base_contract_schemes.0667.t: "$laamp_base_contract_schemes.0661.t.preface$: ใต้บังคับบัญชา"
 laamp_base_contract_schemes.0667.desc: "การนองเลือดจำนวนหนึ่งได้รับอนุญาตในชุมชนใด ๆ ก่อนที่อำนาจที่สูงกว่าจะเข้ามาเกี่ยวข้อง การฆาตกรรมเล็กน้อย การเป็นโจรเบา ๆ บางทีสัตว์เลี้ยงที่มีค่าของคู่แข่งอาจถูกฆ่าอย่างไม่ยุติธรรมในตอนกลางคืน — หากภาษีไหลเข้ามา ความยุติธรรมในท้องถิ่นมักจะสามารถจัดการกับสิ่งดังกล่าวได้\n\nสิทธิพิเศษนั้นจะหยุดขยายออกไปทันทีเมื่อคนโง่บางคนตัดสินใจที่จะนำเจ้าหน้าที่ภายนอกเข้ามาเกี่ยวข้องกับความคับข้องใจเล็กน้อยของพวกเขา\n\nคนโง่แห่ง [location.GetName] ได้ทำผิดพลาดนี้ โดยอ้างว่าพนักงานเก็บภาษีท้องถิ่นได้รับค่าจ้างจากศัตรูสาบานของใครบางคน ความจริงของเรื่องนี้ไม่สำคัญ แต่การบังคับใช้กฎหมายนั้นสำคัญ"
 laamp_base_contract_schemes.0667.a: "ท่าน #EMP จะ#! ปล่อยให้เจ้าหน้าที่อยู่นอกเรื่องนี้"
 laamp_base_contract_schemes.0667.b: "ท่านมีความคิดหรือไม่ว่าค่าปรับจะเป็นเท่าไหร่ในครั้งต่อไป?"
 laamp_base_contract_schemes.0667.c: "ท่านหยุดโดยสมัครใจ มิฉะนั้นข้า #EMP บังคับ#! ท่าน"

 laamp_base_contract_schemes.0668.t: "$laamp_base_contract_schemes.0661.t.preface$: ผู้พลีชีพของทุกคน"
 laamp_base_contract_schemes.0668.desc: "การตายของบุคคลสำคัญในท้องถิ่นที่เคารพนับถือ ฤาษีผู้เคร่งศาสนาบางคนหรืออื่น ๆ ได้ก่อให้เกิดการคร่ำครวญและการขบเขี้ยวเคี้ยวฟันอย่างมากใน [location.GetName] จนถึงจุดที่ ทำให้การบริหารงานประจำวันหยุดชะงักโดยสิ้นเชิง\n\nความตกตะลึงเกิดจากการไม่มีศพ แม้ว่าพยานหลายคนอ้างว่าได้เห็นลมหายใจสุดท้ายของผู้สันโดษ แต่ศพก็หายไป\n\nบุคคลสำคัญในท้องถิ่นหลายคนกำลังกล่าวหากันว่าขโมยมันไป คนอื่น ๆ อ้างว่านี่เป็นสัญญาณจากสวรรค์ และผู้ที่มองโลกในแง่ร้ายที่สุดไม่เชื่อเรื่องนี้เลย"
 laamp_base_contract_schemes.0668.a: "ชาว [ROOT.Char.GetCurrentLocation.GetCounty.GetFaith.GetAdherentNameNoTooltip] ที่แท้จริงเป็นที่รักของทุกคน!"
 laamp_base_contract_schemes.0668.b: "ตายแล้ว? หรือทิ้งไว้เพื่อหลอกลวงที่อื่น?"
 laamp_base_contract_schemes.0668.c: "การทะเลาะวิวาทของท่านไม่เคร่งศาสนา"

 laamp_base_contract_schemes.0669.t: "$laamp_base_contract_schemes.0661.t.preface$: อยู่ภายใต้การควบคุม"
 laamp_base_contract_schemes.0669.desc: "ผู้คนใน [location.GetName] อ้างว่าไม่มีปัญหา ไม่รู้ว่าทำไมภาษีของพวกเขาถึงล่าช้า หรือใครยื่นเรื่องร้องเรียนกับผู้ปกครองของพวกเขา\n\nต้องเป็นคนโง่เท่านั้นที่จะไม่สังเกตเห็นความกลัวในดวงตาหรือเหงื่อบนหน้าผากของพวกเขา ผู้คนเหล่านี้กำลังถูกใครบางคนบีบบังคับ และเงียบปาก เพราะกลัวการตอบโต้"
 laamp_base_contract_schemes.0669.a: "อย่ากลัวคนนอกกฎหมายมากกว่ากฎหมาย"
 laamp_base_contract_schemes.0669.b: "ข้าสามารถแสดงให้ท่านเห็นความหมายของความกลัวได้!"
 laamp_base_contract_schemes.0669.c: "บอกข้ามาว่าพวกมันซ่อนตัวอยู่ที่ไหน แล้วข้าจะแก้ไขมันเอง"

 laamp_base_contract_schemes.0670.t: "$laamp_base_contract_schemes.0661.t.preface$: วิกฤตแห่งจิตวิญญาณ"
 laamp_base_contract_schemes.0670.desc: "ใน [location.GetName] ทุกคนพูดถึงสิ่งเดียวและสิ่งเดียวเท่านั้น: บทบัญญัติท้องถิ่นที่แปลกประหลาดของ [ROOT.Char.GetCurrentLocation.GetCounty.GetFaith.GetName] ที่ดูเหมือนจะเกิดขึ้นจากการโต้วาทีทางเทววิทยาแบบดั้งเดิม\n\nนี่คงจะเป็นเรื่องที่ดี — หากแห้งแล้ง — สำหรับคนชั้นต่ำที่เคร่งศาสนาที่จะเข้ามาเกี่ยวข้อง แต่คนโง่ดูเหมือนจะติดอยู่กับจิตวิญญาณของการโต้วาทีมากเกินไป\n\nด้วยคำดูถูกที่ปลิวว่อนหนาขึ้นและเร็วขึ้นทุกวันที่ผ่านไป มันเป็นเพียงเรื่องของเวลาก่อนที่ทฤษฎีที่เต็มไปด้วยฝุ่นของพวกเขาจะนำไปสู่มีดตามท้องถนน"
 laamp_base_contract_schemes.0670.a: "ได้โปรด พวกเราไม่ใช่เพื่อนกันหรือ?"
 laamp_base_contract_schemes.0670.b: "ให้ข้าอธิบาย..."
 laamp_base_contract_schemes.0670.c: "หยุด. พูด. เรื่องไร้สาระ"

 laamp_base_contract_schemes.0671.t: "$laamp_base_contract_schemes.0661.t.preface$: งานที่เกือบเสร็จ"
 laamp_base_contract_schemes.0671.desc: "ตอนนี้เราทำงานมากพอที่จะได้รับค่าจ้างส่วนใหญ่ที่ [employer.GetTitledFirstName] สัญญาไว้กับเราแล้ว\n\nหากเราสามารถแก้ไขปัญหาสุดท้ายได้ เราก็จะได้รับโบนัสของเรา แต่ถ้าเรา ทำให้สถานการณ์แย่ลงเท่านั้น อืม... ค่าจ้าง #EMP ทั้งหมด#! ของเราก็จะหายไป\n\nเราควรส่งข่าวหรือไม่?"
 laamp_base_contract_schemes.0671.a: "ดีพอก็คือดีพอแล้ว!"
 laamp_base_contract_schemes.0671.a.tt: "ท่านส่งสัญญาเพื่อรับรางวัลปกติ"
 laamp_base_contract_schemes.0671.b: "งานจะเสร็จก็ต่อเมื่อมัน #EMP เสร็จ#! แล้ว"
 laamp_base_contract_schemes.0671.b.tt: "ท่านเสี่ยงกับความท้าทายสุดท้าย หวังว่าจะได้รับโบนัสเต็มจำนวน — #X ท่านจะไม่ได้รับอะไรเลยหากท่านล้มเหลว#!"

 laamp_base_contract_schemes.0781.t: "สิ่งล่อใจจากกระเป๋าเงิน"
 laamp_base_contract_schemes.0781.desc: "ข้าเข้าใจดีว่า — ในระยะยาว — มีเงินให้หาได้มากขึ้นเมื่อท่านหลอกลวงมันมาจากมือที่เต็มใจ มากกว่าที่จะเอามันมาจากมือที่ประมาท ข้ารู้สิ่งนั้น ข้าเข้าใจมัน\n\nถึงกระนั้น ขณะที่ข้าเดินเตร่ในราชสำนักของ [target.GetTitledFirstNamePossessive] มองดูความมั่งคั่งที่ [target.GetSheHe] เก็บไว้อย่างไม่ใส่ใจ ไม่ต้องพูดถึงการรักษาความปลอดภัยที่ไม่ดี ข้าก็อดสงสัยไม่ได้ว่าเราไม่สามารถจุ่มมือลงไปในวิธีการหารายได้ทางเลือก #EMP เพียงเล็กน้อย#! ได้หรือไม่"
 laamp_base_contract_schemes.0781.a: "ไม่ต้องสงสัยเลยว่าเราสามารถบีบคั้นเอาเงินกู้ล่วงหน้ามาได้..."
 laamp_base_contract_schemes.0781.a.tt.success: "ท่านพูดคุยกับ [target.GetFirstNameNoTooltip] จนได้ของขวัญอย่างงาม"
 laamp_base_contract_schemes.0781.a.tt.failure: "เล่ห์เหลี่ยมของท่านใช้ไม่ได้ผล"
 laamp_base_contract_schemes.0781.b: "[target.GetSheHe|U] ไม่สามารถเฝ้า #EMP ทุกอย่าง#! ได้"
 laamp_base_contract_schemes.0781.b.tt.success: "นิ้วมือเหนียว กระเป๋าอ้วน"
 laamp_base_contract_schemes.0781.b.tt.failure: "เกือบถูกจับได้"
 laamp_base_contract_schemes.0781.c: "ป้ายความผิดการขโมยที่โจ่งแจ้งให้ [stooge.GetFirstNameNoTooltip]"
 laamp_base_contract_schemes.0781.c.tt.success: "อาชญากรรมที่สมบูรณ์แบบ"
 laamp_base_contract_schemes.0781.c.tt.failure: "การปลอมแปลงที่เห็นได้ชัด"
 laamp_base_contract_schemes.0781.d: "แน่นอนว่ากำแพงปีนข้ามได้ง่าย?"
 laamp_base_contract_schemes.0781.d.tt.success: "ท่านกลับมาหลังค่ำ"
 laamp_base_contract_schemes.0781.d.tt.failure: "ยามขับไล่ท่านออกไป"
 laamp_base_contract_schemes.0781.e: "มารักษาความซื่อสัตย์นี้ไว้ (ค่อนข้างจะ) เถอะ"

 laamp_base_contract_schemes.0791.t: "ศิลปะแห่งการมอบหมายงาน"
 laamp_base_contract_schemes.0791.desc: "[target.GetTitledFirstName] มีราชสำนักของ [target.GetHerHis] และข้าก็มีของข้า\n\nความแตกต่างคือ ในขณะที่บริวารของ [target.GetFirstNamePossessiveNoTooltip] พอใจที่จะอยู่ด้วยความเอื้อเฟื้อของ [target.GetHerHis] ผู้ติดตาม #EMP ของข้า#! มุ่งมั่นที่จะช่วยข้าช่วยตัวเองให้ได้ความมั่งคั่งแบบเดียวกันนั้นเล็กน้อย\n\nข้าใช้เวลาทำงานเพื่อวันจ่ายเงินในที่สุดของเรา และพวกเขา ในทางกลับกัน สามารถปล้น [target.GetFirstNameNoTooltip] จนหมดตัวได้ ในขณะที่ [target.GetSheHe] กำลังหมกมุ่น เป็นเรื่องดีเสมอที่รู้ว่าท่านมีคนที่ท่านสามารถพึ่งพาได้"
 laamp_base_contract_schemes.0791.tt.success: "นายทหารของท่านชนะ"
 laamp_base_contract_schemes.0791.tt.failure: "นายทหารของท่าน ทำให้ท่านล้มเหลว"
 laamp_base_contract_schemes.0791.a: "อยู่กับข้า [second.GetFirstNameNoTooltip] ทำให้ [target.GetHerHim] ยุ่งเข้าไว้"
 laamp_base_contract_schemes.0791.b: "ไปยังโกดัง [quartermaster.GetFirstNameNoTooltip]"
 laamp_base_contract_schemes.0791.c: "[armourer.GetFirstNameNoTooltip] น่าจะเข้าไปในคลังอาวุธได้!"
 laamp_base_contract_schemes.0791.d: "[chief_forager.GetFirstNameNoTooltip] ไปที่สวนของพวกเขา"
 laamp_base_contract_schemes.0791.e: "[master_thief.GetFirstNameNoTooltip] รู้ #EMP ว่า#! ต้องทำอะไร"
 laamp_base_contract_schemes.0791.f: "[head_groom.GetFirstNameNoTooltip] ไปยังคอกม้า"
 laamp_base_contract_schemes.0791.g: "[huntperson.GetFirstNameNoTooltip] สามารถบุกโจมตีกระท่อมล่าสัตว์ของพวกเขาได้"
 laamp_base_contract_schemes.0791.h: "[witness.GetFirstNameNoTooltip] สามารถเผยแพร่ชื่อเสียงที่ดีของข้าได้ ในขณะที่ข้า..."
 laamp_base_contract_schemes.0791.i: "[camp_cook.GetFirstNameNoTooltip] ห้องเก็บเสบียง #EMP ไป#!."
 laamp_base_contract_schemes.0791.j: "[master_bard.GetFirstNameNoTooltip] เป็นสิ่งเบี่ยงเบนความสนใจที่มีความสามารถ"
 laamp_base_contract_schemes.0791.k: "ตราบใดที่ [stooge.GetFirstNameNoTooltip] รับผิดชอบ..."
 laamp_base_contract_schemes.0791.l: "[master_of_spoils.GetFirstNameNoTooltip] ปล้นทุกอย่างที่ไม่ได้ตอกตะปูไว้"
 laamp_base_contract_schemes.0791.m: "เสี่ยงเกินไป เราไม่ควรทำดีกว่า"
 laamp_base_contract_schemes_0791_suspicious_officers_modifier: "นายทหารที่น่าสงสัย"
 laamp_base_contract_schemes_0791_suspicious_officers_modifier_desc: "ผู้ติดตามที่แปลกประหลาดและบุคคลเบื้องหลังที่ดูมีลับลมคมในไม่ค่อยให้ความน่าเชื่อถือ"
 laamp_base_contract_schemes_0791_plentiful_horses_modifier: "ม้ามากมาย"
 laamp_base_contract_schemes_0791_plentiful_horses_modifier_desc: "โอ้ ช่างเป็นจำนวนม้าส่วนเกินที่มากอย่างน่าประหลาดใจ!"

 laamp_base_contract_schemes.0801.t: "การประจบประแจงเพื่อผลกำไร"
 laamp_base_contract_schemes.0801.desc: "เป้าหมายสุดท้ายของเราคือการปล้น [target.GetTitledFirstName] ให้ได้ทรัพย์สินมากที่สุดเท่าที่เราจะหลอกลวง [target.GetHerHim] ให้มอบให้เราได้ แต่จนกว่าจะถึงตอนนั้น ยิ่ง [target.GetSheHe] คิดถึงเราดีเท่าไหร่ โอกาสสุดท้ายของเราก็จะยิ่งมากขึ้นเท่านั้น\n\nสิ่งนี้ไม่ต้องการอะไรที่ #EMP โจ่งแจ้ง#! เกินไป คำชมที่จริงใจบางคำ เสียงหัวเราะที่เหมาะสม การอ้าปากค้างด้วยความตกใจเป็นครั้งคราว เพียงพอที่จะ ทำให้ [target.GetFirstNameNoTooltip] รู้สึกมีอำนาจเมื่ออยู่รอบ ๆ เรา"
 laamp_base_contract_schemes.0801.a: "เราสามารถทำอะไรได้อีกมากหาก [target.GetSheHe] ชอบเรา"
 laamp_base_contract_schemes.0801.a.tt.success: "ท่านประจบประแจงตัวเอง"
 laamp_base_contract_schemes.0801.a.tt.failure: "ท่านต้องจากไป"
 laamp_base_contract_schemes.0801.b: "ทุนทางสังคมเล็กน้อยคงไม่เสียหาย..."
 laamp_base_contract_schemes.0801.c: "[bard.GetFirstNameNoTooltip] สามารถจัดการเรื่องนี้ได้!"
 laamp_base_contract_schemes.0801.c.tt.success: "[bard.GetFirstNameNoTooltip] สร้างเสน่ห์ให้ [target.GetFirstName]"
 laamp_base_contract_schemes.0801.c.tt.failure: "นักต้มตุ๋นที่น่ารำคาญ"
 laamp_base_contract_schemes.0801.d: "นี่ต่ำกว่าศักดิ์ศรีของข้า"
 laamp_base_contract_schemes_0801_target_good_graces_modifier: "ความโปรดปราน"
 laamp_base_contract_schemes_0801_target_good_graces_modifier_desc: "เมื่อคนที่เหมาะสมชอบท่าน คนอื่น ๆ ก็มีความสำคัญน้อยลง"
 laamp_base_contract_schemes_0801_target_irritated_modifier: "ความรำคาญ"
 laamp_base_contract_schemes_0801_target_irritated_modifier_desc: "บางคนเหมือนแมลงวัน คอยบินวนเวียนอยู่เสมอ"

 laamp_base_contract_schemes.0811.t: "งานเสริม"
 laamp_base_contract_schemes.0811.desc: "ดูเหมือนว่า [agent.GetFirstName] กำลังทำงานเพื่อสิ่ง #EMP อื่น#! นอกเหนือจากเป้าหมายของเรากับ [target.GetTitledFirstName]\n\n[agent.GetSheHe|U] ใช้เวลาของ [agent.GetHerHis] ที่ราชสำนักเพื่อวางรากฐานสำหรับการหลอกลวงเงินจำนวนพอสมควรจาก [target.GetFirstNameNoTooltip] — สิ่งที่ [agent.GetSheHe] ละเลยที่จะบอกข้าก่อนที่ข้าจะได้ยิน [agent.GetHerHim] โอ้อวดเกี่ยวกับเรื่องนี้กับคนงานในค่ายคนหนึ่ง"
 laamp_base_contract_schemes.0811.a: "ช่างมีหัวการค้าเสียนี่กระไร! แน่นอน เราจะแบ่งกำไรของเจ้า"
 laamp_base_contract_schemes.0811.a.tt.success: "ท่านทั้งสองได้เหรียญเล็กน้อย"
 laamp_base_contract_schemes.0811.a.tt.failure: "นักต้มตุ๋นที่สิ้นหวัง"
 laamp_base_contract_schemes.0811.b: "ทำต่อไป ทำต่อไป"
 laamp_base_contract_schemes.0811.c.tt.success: "[agent.GetFirstNameNoTooltip] ได้เหรียญเล็กน้อย"
 laamp_base_contract_schemes.0811.c.tt.failure: "การฉ้อโกงที่สิ้นหวัง"
 laamp_base_contract_schemes.0811.c: "หยุดเดี๋ยวนี้นะเจ้าโง่! เจ้าเสี่ยงต่องานของข้า!"

