 feudal_elective_succession_law:0 "การเลือกตั้งแบบฟิวดัล"
 princely_elective_succession_law:0 "การเลือกตั้งแบบเจ้าชาย"
 feudal_elective_succession_law_effects:1 "[ruler|E]และ[vassals|E]โดยตรงที่เป็น[de_jure|E]ทั้งหมดที่มี[ranks|E]ต่ำกว่า[title|E]หนึ่งหรือสองระดับสามารถเสนอชื่อ[title_heir|E]จากในหมู่พวกเขาและ[close_family|E]ของผู้ปกครองได้"
 princely_elective_succession_law_effects:1 "จักรพรรดิและเจ้าชายผู้มีสิทธิ์เลือกตั้งทั้งเจ็ดสามารถเสนอชื่อ[title_heir|E]จากในหมู่พวกเขา บุตรและพี่น้องที่[legitimate|E]ใดๆ ของ[ruler|E] รวมถึง[vassal|E]ที่เป็น[de_jure|E]รายใหญ่อื่นๆ ของจักรวรรดิ หาก[title|E]ของผู้มีสิทธิ์เลือกตั้งทางประวัติศาสตร์ถูกถือครองโดยผู้ไม่เชื่อหรือไม่มีอยู่จริง [vassal|E]ที่เป็น[de_jure|E]รายอื่นจะเข้ามาแทนที่ [succession_law|E]นี้ให้ความสำคัญอย่างยิ่งต่อ[faith|E]และ[piety|E]\n\nบรรดาศักดิ์ผู้มีสิทธิ์เลือกตั้งสำหรับอาณาจักรนี้คือเคาน์ตีโคโลญ ไมนทซ์ และเทรียร์ และดัชชีโบฮีเมีย ฟรังโกเนียตะวันออก ออสท์ฟาเลิน และออสท์มาร์ค"
 gaelic_elective_succession_law:0 "การเลือกตั้งแบบทานิสทรี"
 gaelic_elective_succession_law_effects:2 "[ruler|E] และ [vassals|E] ทั้งหมดที่อยู่เหนือ [rank|E] ของ [baron|E] และต่ำกว่า [title|E] หนึ่งหรือสองระดับ สามารถเสนอชื่อ [title_heir|E] — ทานิสต์ — จากบรรดาสมาชิกใน [dynasty|E] ของผู้ปกครองได้ ข้าหลวงมักจะนิยมญาติห่างๆ ที่มีอายุมากกว่า [close_family|E]"
 saxon_elective_succession_law:1 "การเลือกตั้งแบบแซกซอน"
 saxon_elective_succession_law_subname:0 "วิเทนาเกมอท"
 saxon_elective_succession_law_effects:1 "[ruler|E]และข้าในบังคับโดยตรงที่เป็นผู้ใหญ่และ[de_jure|E]ทั้งหมดที่มี[ranks|E]ต่ำกว่า[title|E]หนึ่งหรือสองระดับสามารถเสนอชื่อ[title_heir|E]จาก[powerful_vassal|E]ที่ทรงอำนาจที่สุดในหมู่พวกเขา บุตรที่[legitimate|E]ของผู้ปกครอง และ[claimant|E]ที่ถูกต้องตามกฎหมายอื่นๆ"
 scandinavian_elective_succession_law:1 "การเลือกตั้งแบบสแกนดิเนเวีย"
 scandinavian_elective_succession_law_subname:0 "ทิง"
 scandinavian_elective_succession_law_effects:2 "[ruler|E]และ[vassals|E]ที่เป็น[de_jure|E]ทั้งหมด (ยกเว้นบารอน) สามารถเสนอชื่อ[title_heir|E]จากในหมู่[extended_family|E]ของผู้ปกครองและ[claimants|E]ที่มีอยู่ [voting_power|E]ใน[succession_law|E]นี้ได้รับอิทธิพลจาก[county_development|E]รวมของ[domain|E]ของ[elector|E]และ[county_opinion|E]ของ[capital|E]"

 feudal_elective_candidates:0 "ครอบครัวใกล้ชิด ผู้มีสิทธิ์เรียกร้อง และผู้มีสิทธิ์เลือกตั้ง"
 feudal_elective_candidates_tooltip:1 "เพื่อให้เป็นผู้สมัครที่ถูกต้องตามกฎหมายภายใต้การเลือกตั้งแบบฟิวดัล ตัวละครต้องมีคุณสมบัติข้อใดข้อหนึ่งดังต่อไปนี้:\n$EFFECT_LIST_BULLET$เป็นสมาชิก[close_family|E]ที่ถูกต้องตามกฎหมายของผู้ปกครองปัจจุบัน ซึ่งไม่ได้อยู่ในลำดับการสืบทอดเทวาธิปไตยหรือสาธารณรัฐ บุตรของผู้สมัครไม่สามารถได้รับการเสนอชื่อได้\n$EFFECT_LIST_BULLET$เป็น[claimant|E]ต่อบรรดาศักดิ์ ซึ่งไม่ได้อยู่ในลำดับการสืบทอดเทวาธิปไตยหรือสาธารณรัฐ\n$EFFECT_LIST_BULLET$เป็น[elector|E]แบบฟิวดัลที่ถูกต้องตามกฎหมายต่อบรรดาศักดิ์"
 feudal_elective_electors:0 "ผู้ปกครองและข้าในบังคับ"
 feudal_elective_electors_tooltip:0 "เพื่อให้เป็น[elector|E]ที่ถูกต้องตามกฎหมายภายใต้การเลือกตั้งแบบฟิวดัล ข้าในบังคับต้องมีคุณสมบัติทั้งหมดดังต่อไปนี้:\n$EFFECT_LIST_BULLET$เป็นข้าในบังคับ[de_jure|E]ของบรรดาศักดิ์\n$EFFECT_LIST_BULLET$เป็นข้าในบังคับโดยตรงของบรรดาศักดิ์\n$EFFECT_LIST_BULLET$มียศต่ำกว่าบรรดาศักดิ์เพียงหนึ่งหรือสอง[ranks|E]เท่านั้น"

