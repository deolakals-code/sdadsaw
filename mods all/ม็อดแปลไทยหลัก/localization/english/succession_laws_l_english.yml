 meritocratic_regency_succession_law_effects: "ภายใต้ $meritocratic_regency_succession_law$, [title|E] และ [holdings|E] ที่เกี่ยวข้องจะถูกสืบทอดโดยผู้สมัครที่มีคะแนนสูงสุด กลุ่มผู้สมัคร รวมถึง [noble_families|E] ในอาณาจักร, [governors|E], และสมาชิกครอบครัวของพวกเขา"
