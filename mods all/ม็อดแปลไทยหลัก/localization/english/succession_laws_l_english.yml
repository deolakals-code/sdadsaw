 succession_order_laws:0 "[succession_laws|E]"
 succession_order_laws_singular:0 "[succession_law|E]"
 partition_succession_law:1 "การแบ่งส่วน"
 partition_succession_law_subname:0 "บุตรทุกคนสืบทอดเท่าเทียมกัน"
 partition_succession_law_effects:1 "\n#V ภายใต้[succession]แบบ$partition_succession_law$ [titles]ของท่านจะถูกแบ่งเท่าๆ กันระหว่างบุตรของท่าน#!\n\n#weak $partition_base_desc$#!"
 partition_base_desc:2 "#weak เมื่อมีการสืบทอด [titles|E]ทั้งหมดที่[ruler|E]ผู้ล่วงลับถือครองจะถูกแบ่งสรรในหมู่[eligible_children|E]ของพวกเขา โดย[player_heir|E]จะได้รับ[primary_title|E], [realm_capital|E] และ[titles]ใดๆ ที่เป็น[de_jure|E]โดยตรงที่เกี่ยวข้องเสมอ\n\nบุตรที่อายุน้อยกว่าจะได้รับบรรดาศักดิ์โดยเริ่มจากบรรดาศักดิ์ที่มี[rank|E]เดียวกับบรรดาศักดิ์หลัก หากไม่มี จะได้รับบรรดาศักดิ์ที่ต่ำกว่า ทายาทผู้เล่นของท่านไม่สามารถได้รับบรรดาศักดิ์ที่พวกเขาไม่มีสิทธิ์สืบทอดล่วงหน้าได้\n#!"
 high_partition_succession_law:1 "การแบ่งส่วนสูง"
 high_partition_succession_law_subname:0 "บุตรทุกคนสืบทอด"
 high_partition_succession_law_effects:2 "\n#V ภายใต้[succession]แบบ$high_partition_succession_law$ ส่วนแบ่งหลักของ[titles]จะตกเป็นของ[player_heir]ของท่าน – ส่วนที่เหลือจะถูกแบ่งระหว่างบุตรของท่าน#!\n\n#weak $partition_base_desc$\nทายาทผู้เล่นจะ#emp สืบทอด#!อย่างน้อยครึ่งหนึ่งของบรรดาศักดิ์ของผู้ปกครองผู้ล่วงลับเสมอ\n#!"
 confederate_partition_succession_law:1 "การแบ่งส่วนสมาพันธรัฐ"
 confederate_partition_succession_law_subname:0 "บุตรทุกคนสืบทอดเท่าเทียมกัน"
 confederate_partition_succession_law_effects:2 "\n#V ภายใต้$confederate_partition_succession_law$ [titles]ของท่านจะถูกแบ่งเท่าๆ กันระหว่างบุตรของท่าน [titles]ใหม่อาจถูกสร้างขึ้นสำหรับ[realm_heirs]ที่อายุน้อยกว่า#!\n\n#weak $partition_base_desc$\nบุตรที่อายุน้อยกว่าจะมีการสร้างบรรดาศักดิ์ให้ หากมีที่ดินเพียงพอ\n\n#!#X ผู้ปกครองชนเผ่าถูกจำกัดให้ใช้การสืบทอดประเภทนี้#!\n"
 single_heir_succession_law:4 "สิทธิบุตรหัวปี"
 single_heir_succession_law_subname:0 "บุตรคนโตสุดสืบทอด"
 single_heir_succession_law_effects:1 "\n#V ภายใต้[succession]แบบ$single_heir_succession_law$ บุตรคนโตสุดของท่านจะสืบทอด[titles]ทั้งหมดของท่าน#!\n\n#weak เมื่อมีการสืบทอด [titles|e]ทั้งหมดของผู้ปกครองผู้ล่วงลับจะถูกมอบให้กับ[player_heir|E] ซึ่งเป็น[eligible_child|E]คนโตสุดของพวกเขา บุตรที่อายุน้อยกว่าจะไม่ได้รับสิ่งใด\n#!"
 single_heir_succession_law_youngest:4 "สิทธิบุตรคนสุดท้อง"
 single_heir_succession_law_youngest_subname:0 "บุตรคนเล็กสุดสืบทอด"
 single_heir_succession_law_youngest_effects:1 "\n#V ภายใต้[succession]แบบ$single_heir_succession_law_youngest$ บุตรคนเล็กสุดของท่านจะสืบทอด[titles]ทั้งหมดของท่าน#!\n\n#weak เมื่อมีการสืบทอด [titles|e]ทั้งหมดของผู้ปกครองผู้ล่วงลับจะถูกมอบให้กับ[player_heir|E] ซึ่งเป็น[eligible_child|E]คนเล็กสุดของพวกเขา บุตรที่อายุมากกว่าจะไม่ได้รับสิ่งใด\n#!"
 single_heir_dynasty_house:1 "อาวุโสประจำตระกูล"
 single_heir_dynasty_house_subname:0 "สมาชิก[house]ที่อาวุโสสุดสืบทอด"
 single_heir_dynasty_house_effects:1 "\n#V ภายใต้[succession]แบบ$single_heir_dynasty_house$ สมาชิกที่อาวุโสสุดใน[house]ของท่านจะสืบทอดบรรดาศักดิ์ทั้งหมดของท่าน#!\n\n#weak เมื่อมีการสืบทอด [titles|e]ทั้งหมดของผู้ปกครองผู้ล่วงลับจะถูกมอบให้กับสมาชิกที่มีสิทธิ์และอาวุโสสุดใน[house|E]ของพวกเขา บุตรของท่านจะไม่ได้รับสิ่งใด เว้นแต่หนึ่งในนั้นจะเป็นสมาชิกตระกูลที่อาวุโสสุด\n#!"
