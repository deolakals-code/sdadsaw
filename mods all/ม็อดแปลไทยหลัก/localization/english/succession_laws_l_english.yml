#MPO
 single_heir_succession_kurultai_law: "คุรุลไท"
 single_heir_succession_kurultai_subname: "บุตรคนโตสืบทอด"
 single_heir_succession_kurultai_law_effects: "ภายใต้การสืบทอดแบบคุรุลไท [council|E] มีบทบาทสำคัญในการตัดสินว่าผู้ใดจักเป็นผู้สืบทอดคนต่อไป หากมีเสียงที่ไม่เห็นพ้องในหมู่ [kurultai|E] ก็จักนำไปสู่การสืบทอดอันวุ่นวาย\n\nภายใต้การสืบทอดอันวุ่นวาย ลำดับการสืบทอดจักไม่ชัดเจน และ [heir|E] จักประสบกับผลกระทบทางลบบางประการในช่วงเริ่มต้นการปกครองของตน\n\nหากสมาชิกคุรุลไททั้งหมดเห็นพ้องต้องกัน อาณาจักรจักประสบกับการสืบทอดอันมั่นคง ซึ่ง [heir|E] จักขึ้นครองบัลลังก์พร้อมด้วยการสนับสนุนจากเหล่าผู้หนุนหลังที่ทรงอิทธิพลที่สุดของตน"

 law_of_the_land_succession_law: "การสืบทอดตามกฎหมายแห่งดินแดน"
 law_of_the_land_succession_law_subname: "ประเภท [holding_type] กำหนดผู้สืบทอด"
 law_of_the_land_succession_law_effects: "[county|E] นี้ต้องการการปกครอง [government|E] แบบเฉพาะเพื่อการสืบทอด โดยขึ้นอยู่กับประเภท [holding_type|E] ของ [barony|E] เมืองหลวง บรรดาศักดิ์จักถูกมอบให้แก่ตัวละครใน [line_of_succession|E] ของ [realm|E] ที่มีคุณสมบัติตรงตามเงื่อนไขนี้\n\nหากไม่มีผู้ใดมีคุณสมบัติตามข้อกำหนด บุคคลท้องถิ่นจักสืบทอด [title|E] และกลายเป็น [independent|E]"
 succession_law_changed: "กฎหมายการสืบทอดบรรดาศักดิ์เปลี่ยนแปลงแล้ว"

 confederation_elective_succession_law: "การเลือกตั้งแบบสมาพันธรัฐ"
 confederation_elective_succession_law_subname: "เหล่า [vassals] กุมอำนาจที่แท้จริง"
 confederation_elective_candidates: "ครอบครัวใกล้ชิด, เหล่าหลาน และเหล่าข้าหลวง"
 confederation_elective_candidates_tooltip: "เพื่อให้เป็นผู้มีสิทธิ์ได้รับการเสนอชื่อที่ถูกต้องภายใต้การเลือกตั้งแบบฟิวดัล (Feudal Elective), ตัวละครต้องมีคุณสมบัติตรงตามเงื่อนไขข้อใดข้อหนึ่งต่อไปนี้:\n$EFFECT_LIST_BULLET$เป็นสมาชิก [close_family|E] โดยชอบธรรมของผู้ปกครองปัจจุบัน\n$EFFECT_LIST_BULLET$เป็น [vassal|E]"
 confederation_elective_succession_law_effects: "ผู้ปกครอง [ruler|E] และ [vassals|E] โดยตรงทั้งหมดสามารถเสนอชื่อ [title_heir|E] จากในหมู่พวกตนและสมาชิก [close_family|E] ของผู้ปกครองได้ น้ำหนักเสียง [voting_strength|E] ส่วนใหญ่กำหนดโดย [prestige_level|E], [piety_level|E], และจำนวนของ [vassals|E] ระดับ [count|E]-[title_tier|E]"
 confederation_elective_electors: "$feudal_elective_electors$"
 confederation_elective_electors_tooltip: "เพื่อให้เป็น [elector|E] ที่ถูกต้องภายใต้การเลือกตั้งแบบสมาพันธรัฐ, ข้าหลวงต้องมีคุณสมบัติตรงตามเงื่อนไขทั้งหมดต่อไปนี้:\n$EFFECT_LIST_BULLET$มียศ [rank|E] ระดับ [count|E] หรือสูงกว่า\n$EFFECT_LIST_BULLET$เป็น [vassal|E] โดยตรงของเจ้าของ [title|E]\n$EFFECT_LIST_BULLET$มีการปกครอง [government|E] แบบชนเผ่าหรือชนเผ่าเร่ร่อน\n$EFFECT_LIST_BULLET$ไม่มีลักษณะนิสัย [trait|E] [GetTrait('incapable').GetName( GetNullCharacter )]\n$EFFECT_LIST_BULLET$มิได้กำลังทำ [war|E] กับผู้ถือครอง [title|E]"


