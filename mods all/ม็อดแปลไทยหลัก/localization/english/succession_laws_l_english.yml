 male_only_law_effects:0 "$EFFECT_LIST_BULLET$สตรีถูกตัดสิทธิ์จากการสืบทอด\n$EFFECT_LIST_BULLET$สตรีไม่สามารถสืบทอด[claims|E]ได้\n$EFFECT_LIST_BULLET$[rulers|E]ชายสามารถมี[concubines|E]หรือ[spouses|E]หลายคนได้หาก[faith|E]ของพวกเขามี[doctrine|E][GetFaithDoctrine('doctrine_concubines').GetBaseName]หรือ[GetFaithDoctrine('doctrine_polygamy').GetBaseName]"
 male_preference_law_effects:0 "$EFFECT_LIST_BULLET$บุรุษมีสิทธิ์เหนือกว่าสตรีในการสืบทอด\n$EFFECT_LIST_BULLET$[rulers|E]ชายสามารถมี[concubines|E]หรือ[spouses|E]หลายคนได้หาก[faith|E]ของพวกเขามี[doctrine|E][GetFaithDoctrine('doctrine_concubines').GetBaseName]หรือ[GetFaithDoctrine('doctrine_polygamy').GetBaseName]"
 equal_law_effects:3 "$EFFECT_LIST_BULLET$บุรุษและสตรีเท่าเทียมกันในการสืบทอด\n$EFFECT_LIST_BULLET$[rulers|E]ทุกคนสามารถมี[concubines|E]หรือ[spouses|E]หลายคนได้หาก[faith|E]ของพวกเขามี[doctrine|E][GetFaithDoctrine('doctrine_concubines').GetBaseName]หรือ[GetFaithDoctrine('doctrine_polygamy').GetBaseName]"
 female_preference_law_effects:2 "$EFFECT_LIST_BULLET$สตรีมีสิทธิ์เหนือกว่าบุรุษในการสืบทอด\n$EFFECT_LIST_BULLET$[rulers|E]หญิงสามารถมี[concubines|E]หรือ[spouses|E]หลายคนได้หาก[faith|E]ของพวกเขามี[doctrine|E][GetFaithDoctrine('doctrine_concubines').GetBaseName]หรือ[GetFaithDoctrine('doctrine_polygamy').GetBaseName]"
 female_only_law_effects:2 "$EFFECT_LIST_BULLET$บุรุษถูกตัดสิทธิ์จากการสืบทอด\n$EFFECT_LIST_BULLET$บุรุษไม่สามารถสืบทอด[claims|E]ได้\n$EFFECT_LIST_BULLET$[rulers|E]หญิงสามารถมี[concubines|E]หรือ[spouses|E]หลายคนได้หาก[faith|E]ของพวกเขามี[doctrine|E][GetFaithDoctrine('doctrine_concubines').GetBaseName]หรือ[GetFaithDoctrine('doctrine_polygamy').GetBaseName]"
