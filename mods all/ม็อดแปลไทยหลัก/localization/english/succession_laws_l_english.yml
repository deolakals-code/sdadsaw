 celestial_grand_marshal_appointment_succession_law_effects: "\n[succession|E] อิงตาม [merit_level|E] และ [merit_pools|E]\n\n#high ประเภทหนึ่งของ [appointment_succession_law|E] ที่ใช้โดย [minister_grand_marshal|E] เท่านั้น ซึ่งเป็นตำแหน่งที่สงวนไว้สำหรับผู้บัญชาการที่มี [merit_levels|E] สูงสุด ภายใต้ $celestial_grand_marshal_appointment_succession_law$ [title|E] จะถูกสืบทอดโดยผู้สมัครที่มี [candidate_score|E] สูงสุด คะแนนส่วนใหญ่ได้รับผลกระทบจาก [martial_skill|E] การได้รับ [commander_traits|E] หรือการใช้ [influence|E]#!"

 meritocratic_appointment_succession_law: "การสืบทอดโดยการ แต่งตั้งตามคุณธรรม"
 meritocratic_appointment_succession_law_subname: "$celestial_appointment_succession_law_subname$"
 meritocratic_appointment_succession_law_effects: "\n#high ประเภทหนึ่งของ [appointment_succession_law|E] ภายใต้ $meritocratic_appointment_succession_law$ [title|E] และ [holdings|E] ที่เกี่ยวข้องจะถูกสืบทอดโดยผู้สมัครที่มี [candidate_score|E] สูงสุด [adult|E] ใด ๆ ใน [realm|E] อาจมุ่งมั่นเพื่อให้ได้มาซึ่ง [governorship|E] ผ่านวิธีการต่าง ๆ เช่น การมี [merit_level|E] ที่สำคัญ หรือการใช้ [influence|E]#!\n\n"
 meritocratic_military_appointment_succession_law: "การสืบทอดผู้บัญชาการตามคุณธรรม"
 meritocratic_military_appointment_succession_law_subname: "$celestial_military_appointment_succession_law_subname$"
 meritocratic_military_appointment_succession_law_effects: "\n#high ประเภทหนึ่งของ [appointment_succession_law|E] ภายใต้ $meritocratic_military_appointment_succession_law$ [title|E] และ [holdings|E] ที่เกี่ยวข้องจะถูกสืบทอดโดยผู้สมัครที่มี [candidate_score|E] สูงสุด [adult|E] ใด ๆ ใน [realm|E] อาจมุ่งมั่นเพื่อให้ได้มาซึ่ง [governorship|E] ทางทหาร โดยการมี [martial_skill|E] ที่ดี, การได้รับ [commander_traits|E] หรือการใช้ [influence|E]#!\n\n"

