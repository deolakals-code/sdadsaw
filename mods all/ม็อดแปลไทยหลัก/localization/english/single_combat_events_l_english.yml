 single_combat.result.tt.temporary_modifiers_removed:0 "[character_modifiers|E] ชั่วคราวทั้งหมดในการต่อสู้ถูกนำออกไปแล้ว"
 single_combat.result.tt.practice_no_wounds:0 "เนื่องจากการประลองนี้เป็นการยั้งมือ ท่านทั้งสองจึงมิได้รับบาดเจ็บ"

 ##################################################
 # Status Update Fragments
 ## Own Duel Success Fragments
 single_combat.0001.desc.injury_check.personal.very_unlikely:0 "\n\nท่วงท่าข้าเป็นเลิศ แทบไม่มีช่องโหว่ให้พลาดพลั้ง,"
 single_combat.0001.desc.injury_check.personal.unlikely:0 "\n\nท่วงท่าข้าดี มีข้อผิดพลาดเพียงเล็กน้อย,"
 single_combat.0001.desc.injury_check.personal.moderate:0 "\n\nท่วงท่าข้าพอใช้ได้ มีบางจังหวะที่บกพร่อง,"
 single_combat.0001.desc.injury_check.personal.likely:0 "\n\nท่วงท่าข้าเสื่อมลงอย่างรวดเร็ว เผยช่องว่างมากมายให้ฉวยโอกาสได้,"
 single_combat.0001.desc.injury_check.personal.very_likely:0 "\n\nท่วงท่าข้าไม่เหลือแล้ว การเคลื่อนไหวเสี่ยงครั้งต่อไปอาจหมายถึงความพ่ายแพ้,"

 ## Opponent Duel Success Fragments
 single_combat.0001.desc.injury_check.opponent.very_unlikely:0 "และท่ายืนของ [my_foe.GetFirstNamePossessiveNoTooltip] นั้นน่าทึ่งยิ่งนัก"
 single_combat.0001.desc.injury_check.opponent.unlikely:0 "และท่ายืนของ [my_foe.GetFirstNamePossessiveNoTooltip] นั้นน่าเกรงขาม"
 single_combat.0001.desc.injury_check.opponent.moderate:0 "และท่ายืนของ [my_foe.GetFirstNamePossessiveNoTooltip] นั้นพอใช้ได้"
 single_combat.0001.desc.injury_check.opponent.likely:0 "และท่ายืนของ [my_foe.GetFirstNamePossessiveNoTooltip] นั้นกำลังล้มเหลว"
 single_combat.0001.desc.injury_check.opponent.very_likely:0 "และท่ายืนของ [my_foe.GetFirstNamePossessiveNoTooltip] นั้นย่ำแย่สิ้นดี"

 ## Duel Success Each-Way Fragments
 single_combat.0001.desc.success_check.almost_impossible:0 "\n\nข้ายังมิอาจเปิดช่องการป้องกันของคู่ต่อสู้ได้เลย และยังมองไม่เห็นหนทางสู่ชัยชนะ"
 single_combat.0001.desc.success_check.very_unlikely:0 "\n\nการป้องกันของคู่ต่อสู้ข้านั้นแข็งแกร่ง และข้ารู้สึกห่างไกลจากชัยชนะยิ่งนัก"
 single_combat.0001.desc.success_check.unlikely:0 "\n\nคู่ต่อสู้ของข้ายังคงปัดป้องการโจมตีของข้าได้ดี แต่ดูเหมือน [my_foe.GetSheHe] ใกล้จะพลาดท่าแล้ว"
 single_combat.0001.desc.success_check.moderate:0 "\n\nเราสองฝ่ายต่างสูสีกัน ชัยชนะแขวนอยู่บนเส้นด้าย"
 single_combat.0001.desc.success_check.likely:0 "\n\nข้า ทำให้คู่ต่อสู้เสียหลักได้แล้ว แต่ยังคงต้องตอกย้ำชัยชนะให้มั่นคง"
 single_combat.0001.desc.success_check.very_likely:0 "\n\nคู่ต่อสู้ของข้ากำลังโซเซ เพราะข้า ชัยชนะอยู่ใกล้จนแทบสัมผัสได้"
 single_combat.0001.desc.success_check.almost_certain:0 "\n\nข้าคงอยู่ห่างจากชัยชนะเพียงแค่การโจมตีเข้าเป้าอีกครั้งเดียวเท่านั้น"

