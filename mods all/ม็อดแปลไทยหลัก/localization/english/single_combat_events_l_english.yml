 # Combat Descs
 ## Own Combat Move Feedback
 single_combat.0001.desc.my_feedback.wait_and_hope.will_die:0 "ข้าตัวแข็งทื่อ ข้าอาจตายที่นี่ได้ หากข้าไม่ทำอะไรสักอย่าง ข้า #EMP ต้อง#! ตายแน่ ข้าขยับตัวไม่ได้ สั่นเทาขณะภาวนาให้ [my_foe.GetFirstNameNoTooltip] สะดุดล้มเพื่อเปิดช่องให้ข้า"
 single_combat.0001.desc.my_feedback.wait_and_hope.will_live:0 "ข้ารอคอยเวลา ข้าอาจไม่ใช่นักสู้ที่เก่งที่สุด แต่บางที หากปล่อยให้ [my_foe.GetFirstNameNoTooltip] มีเวลามากพอ [my_foe.GetHerselfHimself] อาจจะพลาดท่าเอง"
 single_combat.0001.desc.my_feedback.unsure_attack:0 "ข้าลอง [myself.Custom('SignatureWeaponAttemptedLightPlural')] อย่างขอไปทีสองสามครั้ง โดยมุ่งเน้นไปที่การพยายามไม่ทำ [myself.Custom('signature_weapon')] หลุดมือ แต่ไม่มีครั้งใดเข้าใกล้ศัตรูเลย"
 single_combat.0001.desc.my_feedback.enthusiastic_onslaught:0 "ข้ามี [myself.Custom('SignatureWeaponArticle')] [myself.Custom('signature_weapon')] ข้ามีศัตรู และข้ามุ่งมั่นที่จะแนะนำทั้งสองให้รู้จักกันไม่ว่าจะด้วยวิธีใดก็ตาม การเหวี่ยงอย่างบ้าคลั่ง การตบด้วยหลังมือ การฟาดอย่างสะเปะสะปะด้วย [myself.Custom('SignatureWeaponEndType')] ของอาวุธข้า ทำทุกอย่างเพื่อทุบตีศัตรู"
 single_combat.0001.desc.my_feedback.hail_mary:0 "[myself.Custom('SignatureWeaponFlourishPresentParticiple')|U] [myself.Custom('signature_weapon')] ของข้าอย่างบ้าคลั่ง ข้าพุ่งตรงเข้าใส่ [my_foe.GetFirstNameNoTooltip] หากข้าต้องตาย ข้าจะ ทำให้มันเป็นการต่อสู้ที่ยากลำบาก และ [my_foe.GetFirstNameNoTooltip] ก็ถูกผลักถอยหลังด้วยความมุ่งมั่นสิ้นหวังของข้า"
 single_combat.0001.desc.my_feedback.pocket_sand:0 "คว้า [sc_defender.Custom('GritType')] กำมือหนึ่ง ข้าโยนมันตรงไปที่ [my_foe.Custom('MaskFace')] ของ [my_foe.GetFirstNamePossessiveNoTooltip] ส่งผลให้ [my_foe.GetHerHim] สำลักถอยหลังไป"
 single_combat.0001.desc.my_feedback.nut_em:0 "ปัด [my_foe.Custom('signature_weapon')] ของ [my_foe.GetFirstNamePossessiveNoTooltip] ไปด้านข้างในช่วงเวลาสำคัญ ข้าก้าวเข้าประชิดในวงป้องกันของ [my_foe.GetHerHis] และกระแทกกะโหลกของข้าลงบน [my_foe.GetHersHis] ด้วยเสียงดังกร๊อบน่าสะอิดสะเอียน"
 single_combat.0001.desc.my_feedback.guard:0 "ด้วยการเหวี่ยง [myself.Custom('signature_weapon')] อย่างคล่องแคล่ว ข้าปัดป้องการโจมตีหลายครั้งที่พยายามเข้ามา ทำให้ [my_foe.GetFirstNameNoTooltip] อยู่ห่างในระยะแขนเอื้อม"
 single_combat.0001.desc.my_feedback.probing_attack:0 "เลือกจังหวะอย่างระมัดระวัง ข้าโจมตีอย่างรวดเร็วหลายครั้ง ผลัก [my_foe.GetFirstNameNoTooltip] ไปทางนั้นทีทางนี้ที ค่อยๆ ขยายช่องการป้องกันของ [my_foe.GetHerHis] ให้กว้างขึ้น"
 single_combat.0001.desc.my_feedback.onslaught:0 "[myself.Custom('signature_weapon')|U] ในมือ ข้าระดม [myself.Custom('SignatureWeaponAttemptedLightPlural')] ใส่ [my_foe.GetFirstNameNoTooltip] ไม่ปล่อยให้ [my_foe.GetHerHim] มีช่องว่างระหว่างการโจมตี"
 single_combat.0001.desc.my_feedback.surprise_attack:0 "มองเห็นจุดอ่อน ข้าพุ่งเข้าใส่ [my_foe.GetFirstNameNoTooltip] [myself.Custom('SignatureWeaponActionPresentParticiple')] [myself.Custom('signature_weapon')] ของข้า และผลัก [my_foe.GetHerHim] ถอยหลังไปด้วย [my_foe.Custom('SignatureWeaponAttemptedHeavy')] ครั้งเดียว"
 single_combat.0001.desc.my_feedback.taunt:1 ""ยิ่งไปกว่านั้น" ข้าตะโกน "เจ้าคือ [my_foe.Custom2('InsultAdjectiveArticle', ROOT.Char)] [my_foe.Custom2('InsultNoun', ROOT.Char)] [my_foe.Custom2('InsultAdjective', ROOT.Char)] ผู้ ซึ่งมี [my_foe.Custom2('PointOfRidicule', ROOT.Char)] เป็นที่น่าขบขันไปทั่วทั้งแผ่นดิน!"."
 single_combat.0001.desc.my_feedback.put_the_boot_in:0 "ด้วย [myself.Custom('SignatureWeaponAttemptedHeavy')] จาก [myself.Custom('signature_weapon')] ของข้า ข้าส่ง [my_foe.GetFirstNameNoTooltip] โซเซถอยหลังไป จากนั้นจึงก้าวตามเข้าไปและเตะเข้าที่หน้าอกของ [my_foe.GetHerHim] ตรงๆ"
 single_combat.0001.desc.my_feedback.strict_guard:0 "[myself.Custom('signature_weapon')] ของข้าคือผู้พิทักษ์ที่ดีกว่าโล่ใดๆ ปัดป้อง โต้กลับ และป้องกันทุกการเคลื่อนไหวของ [my_foe.GetFirstNamePossessiveNoTooltip] ไม่ว่า [my_foe.GetSheHe] จะเคลื่อน [my_foe.Custom('signature_weapon')] ของ [my_foe.GetHerHis] ไปที่ใด [myself.Custom('signature_weapon')] ของข้าก็อยู่ที่นั่น รออยู่แล้ว"
 single_combat.0001.desc.my_feedback.confident_attack:0 "[myself.Custom('signature_weapon')] ของข้าไหลลื่นรอบตัว [my_foe.GetFirstNameNoTooltip] ดุจสายน้ำ การโจมตี แต่ละครั้งเชื่อมต่อกันอย่างลื่นไหล เป็นชุดการโจมตีที่จับเวลาได้อย่างสมบูรณ์แบบ"
 single_combat.0001.desc.my_feedback.expert_onslaught:0 "ข้ากระโจนเข้าปฏิบัติการ ระดม [myself.Custom('SignatureWeaponAttemptedLightPlural')] ถาโถมเข้าใส่การป้องกันของ [my_foe.GetFirstNamePossessiveNoTooltip] อย่างหนักหน่วง ทำให้ [my_foe.GetHerHim] อ่อนกำลังลงด้วยการโจมตีที่จับเวลาอย่างเชี่ยวชาญ แต่ละครั้ง"
 single_combat.0001.desc.my_feedback.attempt_disarm:0 "[myself.Custom('SignatureWeaponAttemptedHeavy')] อันมหาศาลครั้งหนึ่งจาก [myself.Custom('signature_weapon')] ของข้าเกือบจะกระชาก [my_foe.Custom('signature_weapon')] ของ [my_foe.GetFirstNamePossessiveNoTooltip] ให้หลุดจากมือ [my_foe.GetHerHim] ได้ แต่ [my_foe.GetSheHe] #EMP ก็#! สามารถฟื้นตัวกลับมาได้ทัน"
 single_combat.0001.desc.my_feedback.lightning_assault:0 "ทุ่มกำลังทั้งหมดลงในการโจมตีครั้งแรก ข้ากระโจนเข้าใส่ [my_foe.GetFirstNameNoTooltip] ทันที [myself.Custom('SignatureWeaponActionPresentParticiple')] [myself.Custom('signature_weapon')] ของข้าสูงขึ้นเป็น [myself.Custom('SignatureWeaponAttemptedHeavy')] ที่ ส่งผลให้ [my_foe.GetHerHim] โซเซ"
 single_combat.0001.desc.my_feedback.tire_opponent:0 "ครั้งแล้วครั้งเล่า ข้าถอยหลัง หลบหลีก และเคลื่อนไหวไปมา รักษาระยะห่างที่ยั่วยวนใจให้อยู่ในระยะเป้าหมายเสมอ: ในไม่ช้า [my_foe.GetFirstNamePossessiveNoTooltip] ก็เริ่มแสดงอาการเหนื่อยล้า"
 #^possessive used here in lieu of a contracted "it's".
 single_combat.0001.desc.my_feedback.reason_you_suck_speech:0 "บางคนอาจเรียกข้าว่าบ้าที่วิจารณ์ทุกแง่มุมในชีวิตของ [my_foe.GetFirstNamePossessiveNoTooltip] อย่างละเอียดขณะที่ [my_foe.GetSheHe] โจมตีข้า พวกเขาไม่รู้ถึง #EMP ความพึงพอใจ#! ของการมีผู้ฟังที่จำยอม"
 single_combat.0001.desc.my_feedback.technique_from_legend:0 "ข้าพยายามอย่างสุดความสามารถที่จะระลึกถึงตำนานในชั่วขณะนั้น และพยายาม [myself.Custom('SignatureWeaponAction')] [myself.Custom('signature_weapon')] ของข้าดั่งวีรบุรุษในอดีต มันเพียงพอที่จะโจมตีอย่างหนักหน่วงใส่ศัตรูที่ประหลาดใจของข้า"
 single_combat.0001.desc.my_feedback.like_a_viper:0 "ด้วยกำลังทั้งหมด ข้าพุ่งผ่านแนวป้องกันของ [my_foe.GetFirstNamePossessiveNoTooltip] และโจมตีอย่างแรงกล้าด้วย [myself.Custom('signature_weapon')] ของข้า โดยมุ่งหมายที่จะ [myself.Custom2('SignatureWeaponKillTypeThirdPersonFutureGendered',SCOPE.sC('my_foe'))] เพียงเส้นยาแดงผ่าแปดเท่านั้นที่หยุดข้าจากการคว้าชัยชนะอันเปื้อนเลือด"
 single_combat.0001.desc.my_feedback.pocket_silver:0 "คว้าถุงเงินหนักจากเอว ข้าโยนมันใส่ [my_foe.GetFirstNameNoTooltip] มันกระแทก [my_foe.GetHerHim] เข้าที่ [my_foe.Custom('MaskFace')] อย่างจัง ทำให้ข้ามีช่องว่างสั้นๆ สำหรับ [myself.Custom('SignatureWeaponAttemptedLight')] ด้วย [myself.Custom('signature_weapon')] ของข้า"
 single_combat.0001.desc.my_feedback.martial_voice:0 "การบัญชาการฝูงชนในสนามรบคือการฝึกฝนการตะโกนและข่มขู่ และข้าสาธิตสิ่งนี้ให้ [my_foe.GetFirstNameNoTooltip] เห็นโดยการตะโกนถ้อยคำหยาบคายสุดเสียงอันดังของข้า"
 single_combat.0001.desc.my_feedback.mocking_boast:0 "วาจาของข้าบาดลึกเข้าไปในอัตตาของ [my_foe.GetFirstNamePossessiveNoTooltip] #EMP ทุกคน#! รู้ถึงชื่อเสียง เกียรติภูมิของข้า และชื่อเสียงของ [my_foe.GetHerHis] นั้น #EMP เทียบไม่ได้#! เลย"
 single_combat.0001.desc.my_feedback.is_that_a_crocodile:0 "ด้วยเสียงคำราม สัตว์ร้ายพุ่งพรวดออกมาจากน้ำ พุ่งเข้าใส่เราทั้งคู่ ข้ากระโดดถอยหลัง ปล่อยให้ [my_foe.GetFirstNameNoTooltip] [myself.Custom('SignatureWeaponFlourishPresentParticiple')] ใส่ด้วย [my_foe.Custom('signature_weapon')] ของ [my_foe.GetHerHis] ด้วยความตื่นตระหนก เมื่อถึงเวลาที่จระเข้ล่าถอย ข้าก็เข้าประชิดด้านหลังของ [my_foe.GetHerHis] แล้ว"
 single_combat.0001.desc.my_feedback.desert_warrior:0 "ท่ามกลางความร้อนระอุ เช่นนี้ ต้องเป็น [myself.GetWomanMan] ที่ทรหดจึงจะต่อสู้ได้ [my_foe.GetFirstNameNoTooltip] #EMP เหงื่อไหลไคลย้อย#! และการหายใจของ [my_foe.GetHerHis] ก็ขาดห้วงอย่างสิ้นเชิง; การ ทำให้ [my_foe.GetHerHim] หมดแรงด้วย [myself.Custom('SignatureWeaponAttemptedLightPlural')] เป็นครั้งคราวนั้นง่ายดุจพลิกฝ่ามือ"
 single_combat.0001.desc.my_feedback.jungle_stalker:0 "พงหญ้าอันหนาทึบของป่า ทำให้การเคลื่อนไหวช้าลงอย่างดีที่สุด และเป็นไปไม่ได้ในสถานการณ์ที่เลวร้ายที่สุด และเงามืดก็อยู่ห่างเพียงแค่การขยับเท้าอย่างรวดเร็วเท่านั้น ในขณะที่ [my_foe.GetFirstNameNoTooltip] ต้องดิ้นรน ข้ากลับเก่งกาจ หายตัวไปเพียงเพื่อปรากฏตัวอีกครั้งพร้อมกับ [myself.Custom('SignatureWeaponAttemptedHeavy')]"
 single_combat.0001.desc.my_feedback.open_terrain_expert:0 "ด้วยพื้นที่ต่อสู้ที่กว้างขวางสุดลูกหูลูกตา ข้าวิ่งวนรอบตัว [my_foe.GetFirstNameNoTooltip] อย่างสบายๆ ยอมเสียพื้นที่ไร้ค่าไปกับการโจมตีทุกครั้งที่ [my_foe.GetSheHe] ทำ และถอยกลับอย่างง่ายดายหลังจากการโจมตีทุกครั้งของข้า"
 single_combat.0001.desc.my_feedback.rough_terrain_expert.rocky:0 "ภูมิประเทศหินขรุขระที่เราต่อสู้กันอยู่นี้อันตราย พวกเราคนใดคนหนึ่งอาจสะดุดล้มตายได้ และการผลักอย่างรุนแรงที่นี่ก็อันตรายพอๆ กับปลายดาบ ข้ามีความสุขอย่างยิ่งที่ได้สาธิตสิ่งนี้ให้ [my_foe.GetFirstNameNoTooltip] เห็นครั้งแล้วครั้งเล่า"
 single_combat.0001.desc.my_feedback.rough_terrain_expert.boggy:0 "หนองบึงนั้นขึ้นชื่อเรื่องความอันตรายในยามปกติอยู่แล้ว และที่นี่ก็ไม่มีข้อยกเว้น แม้ว่าข้าจะยังไม่สามารถผลัก [my_foe.GetFirstNameNoTooltip] ลงไปในน้ำกร่อยได้ แต่ [my_foe.GetSheHe] ก็เกือบจะพลาดท่า #EMP อย่างมาก#! แล้ว"
 single_combat.0001.desc.my_feedback.forest_fighter:0 "ป่าไม้มอบโอกาสมากมายให้ได้เปรียบ ข้าหลบถอยหลัง วางดงหนามกั้นระหว่างข้ากับ [my_foe.GetFirstNameNoTooltip] จากนั้นจึงย้อนกลับไปโจมตี [my_foe.GetHerHim] อย่างรุนแรงด้วย [myself.Custom('SignatureWeaponAttemptedLight')]"
 single_combat.0001.desc.my_feedback.raaargh:0 "น้ำลายกระเซ็น [myself.Custom('signature_weapon')] [myself.Custom('SignatureWeaponFlourishPresentParticiple')] อย่างบ้าคลั่ง ข้าพุ่งเข้าใส่ศัตรู หมอกสีแดงฉีกกระชากผ่านความคิดข้า และทุกสิ่งคือความโกรธเกรี้ยว โลหิต และความสุขจากการปลดปล่อยอันแสนหวาน"
 single_combat.0001.desc.my_feedback.hard_grit:0 "ด้วยความชำนาญที่ฝึกฝนมา ข้าหลบการโจมตีจาก [my_foe.GetFirstNameNoTooltip] ก้าวเข้าหาการโจมตีนั้นและยก [myself.Custom('signature_weapon')] ของข้าขึ้นสำหรับ [myself.Custom('SignatureWeaponAttemptedHeavy')] ก่อนที่จะกระโดดกลับไปยังระยะปลอดภัย"
 single_combat.0001.desc.my_feedback.feint_and_stab:0 "[myself.Custom('signature_weapon')] ของข้าทำ [myself.Custom('SignatureWeaponAttemptedLight')] ไปทางหนึ่ง เพียง เพื่อให้ข้าชักกริชเล่มใหม่ออกมาด้วยมืออีกข้างและพุ่งเข้าใส่ [my_foe.GetFirstNameNoTooltip] ขณะที่ [my_foe.GetSheHe] พยายามปัดป้อง"
 single_combat.0001.desc.my_feedback.butchery:0 "ข้านับไม่ถ้วนแล้วว่าข้า [myself.Custom('SignatureWeaponKillTypePastParticiple')] คนไปกี่คนด้วย [myself.Custom('signature_weapon')] ของข้า บางที [my_foe.GetFirstName] อาจเป็นรายต่อไป หรืออาจจะไม่ แต่การระดมโจมตีอย่างป่าเถื่อนของข้าคง ทำให้ [my_foe.GetHerHim] กังวลเกี่ยวกับเรื่องนี้"
 single_combat.0001.desc.my_feedback.stoic_veteran:0 "กองทหารวารังเจียนไม่ส่งเสริมความหย่อนยาน ต้องใช้สายตาที่ระแวดระวังและแขนที่มั่นคงจึงจะเก่งกาจในฐานะองครักษ์ของจักรพรรดิ และด้วยการโจมตีทุกครั้ง ข้าแสดงให้ [my_foe.GetFirstNameNoTooltip] เห็นว่านักรบขวานรบอย่างไร"
 single_combat.0001.desc.my_feedback.blade_dance:0 "ในการรบ ข้าคือศิลปิน การโจมตีทุกครั้งคือฝีแปรง ศัตรูที่ล้มลงหรือเลือดที่พุ่งกระฉูดคือสีที่สาดกระเซ็น ขณะที่ข้าควง [myself.Custom('signature_weapon')] ของข้า สลับสับเปลี่ยนระหว่างการควงและการโจมตีอย่างลื่นไหล ข้าวาดภาพความเจ็บปวดทรมานให้ศัตรู"
 single_combat.0001.desc.my_feedback.wrath_of_highgod:0 "[myself.GetFaith.HighGodName] ทรงปรีชา และความพิโรธของ [myself.GetFaith.HighGodHerHis|U] อยู่ข้าง #EMP ข้า#! ข้าตะโกนแสดงความภักดีต่อสวรรค์ เพื่อให้ [my_foe.GetFirstNameNoTooltip] อาจสั่นสะท้านด้วยความกลัวต่อหน้าศรัทธาของข้า"
 single_combat.0001.desc.my_feedback.hurt_me_better:0 "ไม่มีสิ่งใดกระตุ้นเลือดลมได้เท่าความเจ็บปวดอันแสนหวาน และไม่มีใครเข้าใจความเจ็บปวดได้ดีเท่าข้า ด้วยพลังจากบาดแผล ข้าพุ่งเข้าใส่ [my_foe.GetFirstNameNoTooltip] ปลดปล่อยการโจมตีอย่างป่าเถื่อนเป็นระลอกด้วย [myself.Custom('SignatureWeaponAttemptedLightPlural')] จาก [myself.Custom('signature_weapon')] ของข้า"
 single_combat.0001.desc.my_feedback.special_fallback:0 "เห็นช่องโอกาส ข้าเตะอย่างแรงเข้าที่หน้าแข้งของ [my_foe.GetFirstNamePossessiveNoTooltip] แทบ ทำให้ [my_foe.GetHerHim] เดินกะเผลก"
 single_combat.0001.desc.my_feedback.something_to_hide:0 "ชั่วขณะหนึ่ง [my_foe.GetFirstNameNoTooltip] นิ่งไป จากนั้น ดูเหมือนมีบางอย่างผุดขึ้นในหัวของ [my_foe.GetHerHis] และร่างของ [my_foe.GetHerHis] ก็อ่อนลงอย่างเห็นได้ชัดด้วยน้ำหนักของการระลึกถึงบุญคุณที่ข้ามีเหนือ [my_foe.GetHerHim]"

 ## Opponent Combat Move Feedback
 single_combat.0001.desc.opponent_response.wait_and_hope:1 "[my_foe.GetFirstNameNoTooltip] ยืนนิ่งไม่ไหวติง ดูเหมือนหวังว่าข้าจะโยน [myself.Custom('signature_weapon')] ทิ้งไปเสียเฉยๆ"
 single_combat.0001.desc.opponent_response.unsure_attack:0 "[my_foe.GetFirstNameNoTooltip] พยายาม [myself.Custom('SignatureWeaponAttemptedLight')] ใส่ข้าอย่างลังเล แต่การโจมตีนั้นถูกปัดออกไปอย่างง่ายดาย"
 single_combat.0001.desc.opponent_response.enthusiastic_onslaught.banned_house:0 ""#EMP [my_foe.GetFullNameNoTooltip]!#!" $single_combat.0001.desc.opponent_response.enthusiastic_onslaught.epilogue$"
 single_combat.0001.desc.opponent_response.enthusiastic_onslaught.own_house:0 ""เจ้าคือความอัปยศของตระกูล [my_foe.GetHouse.GetNameNoTooltip]!" $single_combat.0001.desc.opponent_response.enthusiastic_onslaught.epilogue$"
 single_combat.0001.desc.opponent_response.enthusiastic_onslaught.motto:0 ""#EMP [my_foe.GetHouse.GetMotto]#! ไอ้สารเลว!" $single_combat.0001.desc.opponent_response.enthusiastic_onslaught.epilogue$"
 single_combat.0001.desc.opponent_response.enthusiastic_onslaught.epilogue:0 "คู่ต่อสู้ของข้ากรีดร้อง [my_foe.Custom('SignatureWeaponFlourishPresentParticiple')] [my_foe.Custom('signature_weapon')] ของ [my_foe.GetHerHis] อย่างบ้าคลั่ง ใส่ รอบๆ และใกล้ตัวข้า"
 single_combat.0001.desc.opponent_response.hail_mary: "ด้วยตระหนักดีว่า[my_foe.GetSheHe]เสียเปรียบอย่างสิ้นเชิง [my_foe.GetFirstNameNoTooltip] จึงพุ่งตัว[my_foe.GetHerselfHimself]เข้าใส่ข้าทั้งตัว ผลักดันข้าถอยหลังไปด้วยความสิ้นหวังทั้งหมดของผู้ที่ถึงคราวอับจน"
 single_combat.0001.desc.opponent_response.pocket_sand:0 "ชั่วขณะหนึ่งเรากำลังต่อสู้กัน ถัดมาก็มีเสียงร้องว่า "#EMP ฮึ่ย่ะ!#!" [myself.Custom('EyeEyes')] ของข้าแสบ ทัศนวิสัยพร่ามัว และปากข้าได้รสชาติของ [sc_defender.Custom('GritType')] ที่ถูกขว้างมา"
 single_combat.0001.desc.opponent_response.nut_em:0 "เห็นโอกาส [my_foe.GetFirstNameNoTooltip] พุ่งไปข้างหน้าและโขกศีรษะใส่ข้าอย่างแรงที่ [myself.Custom('MaskFace')] ข้าโซเซถอยหลัง เสียหลัก"
 single_combat.0001.desc.opponent_response.guard:0 "[my_foe.GetFirstNameNoTooltip] ตั้งท่าป้องกัน ทำสุดความสามารถของ [my_foe.GetHerHis] เพื่อปัดป้องข้า [my_foe.Custom('EyeEyes')] ของ [my_foe.GetWomanMan] จับจ้องทุกการเคลื่อนไหวของข้า"
 single_combat.0001.desc.opponent_response.probing_attack:0 "การโต้กลับของ [my_foe.GetFirstNamePossessiveNoTooltip] ถูกคำนวณมาอย่างดี รอจังหวะที่แม่นยำที่สุดเพื่อตอบโต้ด้วย [my_foe.Custom('SignatureWeaponAttemptedLightPlural')] หลายครั้งจาก [my_foe.Custom('signature_weapon')] ของ [my_foe.GetHerHis]"
 single_combat.0001.desc.opponent_response.onslaught:0 "[my_foe.GetFirstNameNoTooltip] บิดคอ [my_foe.GetHerHis] จากนั้นก็เริ่มระดมโจมตีใส่การป้องกันของข้า เป็นการวิ่งมาราธอนของ [my_foe.Custom('SignatureWeaponAttemptedHeavyPlural')] ที่เกือบจะทำลายข้าด้วยความดุร้ายอันไม่หยุดยั้ง"
 single_combat.0001.desc.opponent_response.surprise_attack:0 "[my_foe.GetFirstNameNoTooltip] เปลี่ยนทิศทางกะทันหัน โถมตัว [my_foe.GetHerselfHimself] ไปด้านข้างและเข้าสู่ [my_foe.Custom('SignatureWeaponAttemptedHeavy')] ที่ข้าหลบได้ฉิวเฉียด"
 single_combat.0001.desc.opponent_response.taunt:0 "[my_foe.GetFirstNameNoTooltip] ดูเหมือนจะดูถูกการต่อสู้ที่แท้จริง เลือกที่จะแสดงความคิดเห็นส่วนตัวที่ทำร้ายจิตใจเกี่ยวกับตัวข้า ครอบครัวของข้า และวิธีที่ข้ากินหน่อไม้ฝรั่ง"
 single_combat.0001.desc.opponent_response.put_the_boot_in:0 "[my_foe.GetFirstNameNoTooltip] พุ่งไปข้างหน้า บังคับให้ข้าถอยหลังด้วย [my_foe.Custom('SignatureWeaponAttemptedLight')] ก่อนที่จะเตะสูงขึ้นมาที่หน้าอกข้า ข้าเกือบล้ม"
 single_combat.0001.desc.opponent_response.strict_guard:0 "[my_foe.GetFirstNameNoTooltip] เปลี่ยนไปใช้ท่าตั้งรับ [my_foe.Custom('signature_weapon')] ของ [my_foe.GetHerHis] สร้างกำแพงการปัดป้องที่สมบูรณ์แบบ ซึ่งแทบจะเจาะไม่เข้า กั้นระหว่างข้ากับ [my_foe.GetHerHim]"
 single_combat.0001.desc.opponent_response.confident_attack:0 "[my_foe.GetFirstNameNoTooltip] ตอบโต้ด้วยชุด [my_foe.Custom('SignatureWeaponAttemptedLightPlural')] และ [my_foe.Custom('SignatureWeaponAttemptedHeavyPlural')] ที่ไหลลื่น การโจมตี แต่ละครั้งบังคับให้ข้าถอยหลังไปอีกเล็กน้อย"
 single_combat.0001.desc.opponent_response.expert_onslaught:0 "[my_foe.GetFirstNameNoTooltip] โต้กลับด้วยการระดม [my_foe.Custom('SignatureWeaponAttemptedLightPlural')] อย่างดุเดือด เกือบจะ [my_foe.Custom('SignatureWeaponKillTypeFirstPersonPresentParticiple')] ซ้ำๆ"
 single_combat.0001.desc.opponent_response.attempt_disarm:0 "ด้วยความเร็วที่น่าประหลาดใจ [my_foe.GetFirstNameNoTooltip] ปลดปล่อย [my_foe.Custom('SignatureWeaponAttemptedHeavy')] จาก [my_foe.Custom('signature_weapon')] ของ [my_foe.GetHerHis] เกือบจะ ทำให้ [myself.Custom('signature_weapon')] ของข้าหลุดมือ"
 single_combat.0001.desc.opponent_response.lightning_assault:0 "[my_foe.GetFirstNameNoTooltip] ไม่เสียเวลา เผชิญหน้าข้าด้วยชุด [my_foe.Custom('SignatureWeaponAttemptedHeavyPlural')] อันเข้มข้นที่บังคับให้ข้าถอยหลังทีละก้าว"
 single_combat.0001.desc.opponent_response.tire_opponent:0 "[my_foe.GetFirstNameNoTooltip] ถอยห่างจากการโจมตีทุกครั้งของข้า ปล่อยให้ข้าโจมตีโดยไม่โดนโจมตีอย่างจังอีก ไม่นานนักข้าก็รู้สึกว่าตัวเองเริ่มเหนื่อย"
 single_combat.0001.desc.opponent_response.reason_you_suck_speech:0 "ในความพยายามที่จะ ทำให้ข้าอับอาย [my_foe.GetFirstNameNoTooltip] เพียงแค่ถอยห่างออกไปทุกครั้งที่ข้าเข้าใกล้ ดูถูกข้าอย่างละเอียดลึกซึ้ง #EMP รู้ดี#! ว่าข้าไม่สามารถเพิกเฉย [my_foe.GetHerHim] ได้"
 single_combat.0001.desc.opponent_response.technique_from_legend:0 "[my_foe.GetFirstNameNoTooltip] [my_foe.Custom('SignatureWeaponActionThirdPerson')] [my_foe.Custom('signature_weapon')] ของ [my_foe.GetHerHis] ในลักษณะที่คุ้นเคยอย่างประหลาด จากนั้นจึงดำเนินการ [my_foe.Custom('SignatureWeaponAttemptedHeavy')] ที่เกือบจะสมบูรณ์แบบ ซึ่งข้าสาบานได้ว่าเคยเห็นมาก่อน"
 single_combat.0001.desc.opponent_response.like_a_viper:0 "ก่อนที่ข้าจะรู้ตัว [my_foe.GetFirstNameNoTooltip] ก็เข้ามา #EMP อยู่ใน#! วงป้องกันของข้าได้อย่างไรไม่ทราบ [my_foe.Custom('signature_weapon')] ของ [my_foe.GetHerHis] พุ่งเข้าหาหัวใจข้า ข้าหลบถอยหลังได้เพียงเส้นยาแดงผ่าแปดเท่านั้น"
 single_combat.0001.desc.opponent_response.pocket_silver:0 "ทันใดนั้น [my_foe.GetFirstNameNoTooltip] ก็ขว้างถุงเงินหนักใส่ [myself.Custom('MaskFace')] ของข้า ซึ่งกระแทกเข้ากับเสียง #EMP ดังกร๊อบ#! เมื่อข้าฟื้นตัว [my_foe.GetSheHe] ก็กดดันข้าด้วยความได้เปรียบของ [my_foe.GetHerHis]"
 single_combat.0001.desc.opponent_response.martial_voice:0 "[my_foe.Custom('signature_weapon')] ของ [my_foe.GetFirstNamePossessiveNoTooltip] เคลื่อนเข้าสู่ตำแหน่งป้องกันอย่างเชื่องช้า และ [my_foe.GetSheHe] ก็เริ่มตะโกนด่าข้า น้ำเสียงของ [my_foe.GetHerHis] เป็นน้ำเสียงที่ใช้กับทาสรับใช้ที่ทำตัวไม่ดี ไม่ใช่ [myself.GetTitleAsNameNoTooltip]"
 single_combat.0001.desc.opponent_response.mocking_boast:0 "[my_foe.GetFirstNameNoTooltip] ถอยห่างจากข้า สร้างความเงียบสงบชั่วครู่ ความสงบชั่วคราวนั้นเต็มไปด้วยคำโอ้อวดถึงชื่อเสียงของ [my_foe.GetHerHis] และการโจมตีคุณค่าของข้า มากพอที่จะ ทำให้ข้าโกรธ"
 single_combat.0001.desc.opponent_response.is_that_a_crocodile:0 "เสียงขู่ฟ่อของสัตว์เลื้อยคลานที่ไม่คาดคิดเผยให้เห็นจระเข้ที่กำลังโกรธ ซึ่งเพิ่งโผล่ออกมาจากทางน้ำใกล้เคียง และข้าต้องใช้ [my_foe.Custom('SignatureWeaponAttemptedHeavyPlural')] หลายครั้งจึงจะปัดป้องมันได้"
 single_combat.0001.desc.opponent_response.desert_warrior:0 "ในขณะที่ข้าเหนื่อยล้าจากการต่อสู้ในความร้อนนี้ [my_foe.GetFirstNameNoTooltip] ดูเหมือนจะยังคงสดชื่นและคล่องแคล่ว พอใจที่จะเสนอเพียง [my_foe.Custom('SignatureWeaponAttemptedLight')] เป็นครั้งคราว"
 single_combat.0001.desc.opponent_response.jungle_stalker:0 "[my_foe.GetFirstNameNoTooltip] พิสูจน์ตัวเองว่าเป็นศัตรูที่ลื่นไหล หลบหลีกจากการโจมตีของข้าและเคลื่อนที่ผ่านพงหญ้าหนาทึบได้อย่างง่ายดาย ซึ่งข้าทำไม่ได้เลย"
 single_combat.0001.desc.opponent_response.open_terrain_expert:0 "[my_foe.GetFirstNameNoTooltip] ใช้ประโยชน์จากสภาพแวดล้อมที่เปิดโล่งได้อย่างยอดเยี่ยม โจมตีด้วย [my_foe.Custom('SignatureWeaponAttemptedLightPlural')] ก่อนที่จะถอยกลับไปยังพื้นที่กว้างขวาง"
 single_combat.0001.desc.opponent_response.rough_terrain_expert.rocky:0 "ด้วยความเชี่ยวชาญในการต่อสู้บนทางลาดชันที่เป็นหิน [my_foe.GetFirstNameNoTooltip] ไม่เสียเวลาในการยึดพื้นที่สูง ความได้เปรียบดังกล่าว ทำให้ [my_foe.GetSheHe] #EMP เกือบจะ#! ตัดแขนขาข้าไปหลายส่วน"
 single_combat.0001.desc.opponent_response.rough_terrain_expert.boggy:0 "คุ้นเคยกับการต่อสู้ในพื้นที่ชุ่มน้ำที่เป็นหนองบึงเหล่านี้มากกว่าข้า [my_foe.GetFirstNameNoTooltip] พยายามครั้งแล้วครั้งเล่าที่จะผลักข้าลงไปในน้ำกร่อย เกือบจะสำเร็จ"
 single_combat.0001.desc.opponent_response.forest_fighter:0 "[my_foe.GetWomanMan] ป่าไม้ผู้ชำนาญ [my_foe.GetFirstNameNoTooltip] ดูเหมือนจะผ่านพุ่มหนามและพุ่มไม้ไปได้โดยไม่มีปัญหา ปล่อยให้ข้าต้องฝ่าฟันอันตรายตามหลัง [my_foe.GetHerHim] ไป"
 single_combat.0001.desc.opponent_response.raaargh: "[my_foe.GetFirstNameNoTooltip] ดูเหมือนจะสั่นเทาอยู่ครู่หนึ่ง จากนั้น[my_foe.GetSheHe]ก็ระเบิดความเดือดดาลออกมา กรีดร้องเสียงดังจนแผ่นดินสะเทือน และพุ่งตัว[my_foe.GetHerselfHimself]เข้าใส่ข้าด้วยความ #EMP ป่าเถื่อน#! อันหาได้ยาก"
 single_combat.0001.desc.opponent_response.hard_grit:0 "[my_foe.GetFirstNameNoTooltip] เป็นนักสู้ที่มีความสามารถน่ากังวล ครั้งแล้วครั้งเล่าที่ [my_foe.GetSheHe] หลบหลีกหรือปัดป้องแม้ แต่การโจมตีที่หนักหน่วง จากนั้นก็หันกลับมาเล่นงานข้า"
 single_combat.0001.desc.opponent_response.feint_and_stab:0 "[my_foe.GetFirstNameNoTooltip] พยายามหลอกล่อไปทางซ้ายด้วย [my_foe.Custom('signature_weapon')] ของ [my_foe.GetHerHis] เพียงเพื่อจะแทงเข้าที่หัวใจข้าด้วยกริชที่ซ่อนอยู่ในมืออีกข้างของ [my_foe.GetHerHis]"
 single_combat.0001.desc.opponent_response.butchery:0 "รอยยิ้มอันโหดร้ายแผ่กว้างบนริมฝีปากของ [my_foe.GetFirstNamePossessiveNoTooltip] และก่อนที่ข้าจะปรับการป้องกัน ข้าก็เกือบจะทรุดลงภายใต้การระดม [my_foe.Custom('SignatureWeaponAttemptedLightPlural')] อย่างป่าเถื่อน"
 single_combat.0001.desc.opponent_response.stoic_veteran:0 "ช่วงเวลาของ [my_foe.GetFirstNamePossessiveNoTooltip] ในกองทหารวารังเจียน ทำให้ [my_foe.GetHerHim] สงบนิ่ง โหดร้าย และอันตรายด้วย [my_foe.Custom('SignatureWeaponArticle')] [my_foe.Custom('signature_weapon')] โจมตีด้วย [my_foe.Custom('SignatureWeaponAttemptedHeavy')] ครั้งแล้วครั้งเล่าเข้าที่ลำตัวข้า"
 single_combat.0001.desc.opponent_response.blade_dance:0 "[my_foe.GetFirstNameNoTooltip] มีชื่อเสียงในด้านความสามารถของ [my_foe.GetHerHis] ด้วย [my_foe.Custom('SignatureWeaponArticle')] [my_foe.Custom('signature_weapon')] และ [my_foe.GetSheHe] ก็ย้ำเตือนข้าถึงเรื่องนี้ด้วยสายโซ่ [my_foe.Custom('SignatureWeaponAttemptedLightPlural')] ที่ไหลลื่นอย่างสมบูรณ์แบบ สลับด้วย [my_foe.Custom('SignatureWeaponAttemptedHeavy')] ที่น่าสะพรึงกลัวเป็นครั้งคราว"
 single_combat.0001.desc.opponent_response.wrath_of_highgod:0 ""เพื่อ [my_foe.GetFaith.HighGodNameAlternate] และ [my_foe.GetFaith.WarGodName] จงทนทุกข์ทรมานเถิด ไอ้คนนอกรีต!" [my_foe.GetFirstNameNoTooltip] กรีดร้อง [my_foe.Custom('SignatureWeaponActionPresentParticiple')] [my_foe.Custom('signature_weapon')] ของ [my_foe.GetHerHis] ขึ้นสู่สวรรค์"
 single_combat.0001.desc.opponent_response.hurt_me_better:0 "เลือดหยดหนึ่งไหลลงมาจากหนังศีรษะของ [my_foe.GetFirstNamePossessiveNoTooltip]; เมื่อมันมาถึงริมฝีปากบนของ [my_foe.GetHerHis] [my_foe.GetSheHe] ก็เลียมันออกไป ยิ้มอย่างปีศาจ"
 single_combat.0001.desc.opponent_response.special_fallback:0 "โดยไม่คาดคิด [my_foe.GetFirstNameNoTooltip] เตะเข้าที่หน้าแข้งข้าอย่างรุนแรง ทำให้ข้าเดินกะเผลกชั่วขณะ"
 single_combat.0001.desc.opponent_response.something_to_hide:0 ""เจ้าลืม #EMP หนี้บุญคุณ#! ที่มีต่อข้าแล้วรึ [myself.GetFirstNameNoTooltip]?" [my_foe.GetFirstNameNoTooltip] ยิ้ม เมื่อข้ารู้ว่า [my_foe.GetSheHe] กำลังพูดถึงอะไร ไหล่ของข้าก็ตก"

 ##################################################
 # Outcome Event: Loser
 ## Defender Lost, Own Combat Move Feedback
 single_combat.0031.desc.sc_defender.wait_and_hope:0 "การรอให้คู่ต่อสู้เคลื่อนไหวก่อนไม่เป็นผลดีต่อข้าเลย เป็นเพียงการมอบความได้เปรียบให้ [sc_victor.GetHerHim]"
 single_combat.0031.desc.sc_defender.unsure_attack:0 "การโจมตีอันอ่อนแอของข้าไร้ผลโดยสิ้นเชิง"
 single_combat.0031.desc.sc_defender.enthusiastic_onslaught:0 "การ [sc_loser.Custom('SignatureWeaponFlourishPresentParticiple')] อย่างบ้าคลั่งของข้านั้นไร้ค่า ไม่ได้ทำอะไรเลยนอกจาก ทำให้ข้าเหนื่อย"
 single_combat.0031.desc.sc_defender.hail_mary:0 "การโจมตีสุดตัวอันสิ้นหวังของข้าไม่เป็นผล"
 single_combat.0031.desc.sc_defender.pocket_sand:0 "คู่ต่อสู้ของข้าหลบ [sc_defender.Custom('GritType')] ที่ข้าขว้างไปได้อย่างง่ายดาย"
 single_combat.0031.desc.sc_defender.nut_em:0 "การพยายามโขกศีรษะที่ไม่สำเร็จของข้ากลับเปิดช่องว่างใหญ่ให้คู่ต่อสู้"
 single_combat.0031.desc.sc_defender.guard:0 "คู่ต่อสู้ของข้าฝ่าแนวป้องกันของ [sc_victor.GetHerHis] เข้ามาได้"
 single_combat.0031.desc.sc_defender.probing_attack:0 "คู่ต่อสู้ของข้าปัดป้องการโจมตีตามจังหวะของข้าได้"
 single_combat.0031.desc.sc_defender.onslaught:0 "[sc_loser.Custom('SignatureWeaponAttemptedHeavyPlural')] ของข้าทำอะไรไม่ค่อยได้"
 single_combat.0031.desc.sc_defender.surprise_attack:0 "คู่ต่อสู้ของข้ามองการจู่โจมไม่ให้ตั้งตัวของข้าออก"
 single_combat.0031.desc.sc_defender.taunt:0 "การยั่วยุของข้าไร้ผล"
 single_combat.0031.desc.sc_defender.put_the_boot_in:0 "[sc_loser.Custom('SignatureWeaponAttemptedHeavy')] เริ่มต้นของข้าโดนเป้า แต่การเตะของข้า ทำให้เสียหลัก"
 single_combat.0031.desc.sc_defender.strict_guard:0 "แม้ข้าจะพยายามอย่างสุดความสามารถ คู่ต่อสู้ก็ทำลายแนวป้องกันของข้าได้"
 single_combat.0031.desc.sc_defender.confident_attack:0 "คู่ต่อสู้ของข้าสามารถปัดป้องการโจมตีของข้าได้อย่างหนักหน่วง"
 single_combat.0031.desc.sc_defender.expert_onslaught:0 "แม้ แต่ [sc_loser.Custom('SignatureWeaponAttemptedHeavyPlural')] ที่ดีที่สุดของข้าก็ดูเหมือนจะไม่มีผล"
 single_combat.0031.desc.sc_defender.attempt_disarm:0 "ความพยายามปลดอาวุธของข้าเกือบ ทำให้ [sc_loser.Custom('signature_weapon')] #EMP ของข้า#! หลุดมือ"
 ### No need for a lightning_assault, as you can't end the duel in the first round.
 single_combat.0031.desc.sc_defender.tire_opponent:0 "ความพยายามล่อคู่ต่อสู้ของข้าล้มเหลว เนื่องจาก [sc_victor.GetSheHe] ไม่สนใจการหลบหลีกเชิงละครของข้า"
 single_combat.0031.desc.sc_defender.reason_you_suck_speech:0 "คู่ต่อสู้ของข้ากัดฟันและเมินเฉยต่อคำพูดของ [sc_victor.GetHerHis]"
 single_combat.0031.desc.sc_defender.technique_from_legend:0 "ในความเป็นจริง การกระทำในตำนานนั้นยาก และข้าก็ล้มเหลวในการทำอะไรเป็นชิ้นเป็นอัน"
 single_combat.0031.desc.sc_defender.like_a_viper:0 "ข้าพุ่งเข้าใส่สิ่งที่ข้าคิดว่าเป็นช่องว่าง เพียงเพื่อพบว่าตัวเองฟาดใส่อากาศธาตุ"
 single_combat.0031.desc.sc_defender.pocket_silver:0 "คู่ต่อสู้ของข้าหลบถุงเงินที่ข้าขว้างไปได้อย่างง่ายดาย ไม่สะทกสะท้าน"
 single_combat.0031.desc.sc_defender.martial_voice:0 "ความพยายามข่มขู่คู่ต่อสู้ของข้าล้มเหลวทันที"
 single_combat.0031.desc.sc_defender.mocking_boast:0 "คำโอ้อวดของข้าไร้ผล คู่ต่อสู้ไม่สนใจการหยอกล้อของข้าเลย"
 single_combat.0031.desc.sc_defender.is_that_a_crocodile:0 "จระเข้หยุดกลางคันระหว่างการพุ่งเข้าใส่ พิจารณาการโจมตีของมันใหม่"
 single_combat.0031.desc.sc_defender.desert_warrior:0 "แม้ [sc_victor.GetSheHe] จะเหงื่อออก แต่คู่ต่อสู้ของข้าดูเหมือนจะไม่เหน็ดเหนื่อย"
 single_combat.0031.desc.sc_defender.jungle_stalker:0 "ปกติแล้วป่าเป็นสถานที่ที่ต่อสู้ได้ยาก แต่คู่ต่อสู้ของข้าก็ยังคงสู้ต่อไป"
 single_combat.0031.desc.sc_defender.open_terrain_expert:0 "แม้จะมีพื้นที่กว้างขวางเท่าที่ข้าต้องการ คู่ต่อสู้ของข้าก็พิสูจน์ให้เห็นว่าไร้ความปรานี"
 single_combat.0031.desc.sc_defender.rough_terrain_expert:0 "แม้ว่าสถานที่จะไม่น่าอภิรมย์ คู่ต่อสู้ของข้าก็ยังคงตามทันการโจมตีของข้า"
 single_combat.0031.desc.sc_defender.forest_fighter:0 "ไม่ใช่ทุกคนที่จะต่อสู้ได้ดีในป่า แต่คู่ต่อสู้ของข้าก็ยังคงตามทัน ตอบโต้การโจมตีทุกครั้ง"
 single_combat.0031.desc.sc_defender.raaargh:0 "ช่วงเวลาสงบในความบ้าคลั่งของข้า ทำให้ข้าเกือบอยู่ในสภาพไม่รู้สึกตัว; คู่ต่อสู้ของข้าไม่ได้รับบาดเจ็บ แต่ข้ารู้สึกอ่อนล้า"
 single_combat.0031.desc.sc_defender.hard_grit:0 "แม้จะมีประสบการณ์ทั้งหมด คู่ต่อสู้ของข้าก็ขัดขวางการโจมตี แต่ละครั้งของข้าได้"
 single_combat.0031.desc.sc_defender.feint_and_stab:0 "คู่ต่อสู้ของข้ามองการหลอกล่อของข้าออก ทำให้การแทงตามมาไร้ประโยชน์"
 single_combat.0031.desc.sc_defender.butchery:0 "ข้าอาจเป็นนักฆ่าที่ชำนาญ แต่มันก็ไม่เป็นผลดีต่อข้าที่นี่"
 single_combat.0031.desc.sc_defender.stoic_veteran:0 "ไม่ว่าข้าจะเรียนรู้อะไรมาในมิคลาการ์ด มันก็ไม่เพียงพอ คู่ต่อสู้ปัดป้องข้าซ้ำแล้วซ้ำเล่า"
 single_combat.0031.desc.sc_defender.blade_dance:0 "ความพยายามในการควงดาบของข้าพิสูจน์ว่าผิดพลาด คู่ต่อสู้โต้กลับ แต่ละครั้ง"
 single_combat.0031.desc.sc_defender.wrath_of_highgod:0 "คำสวดภาวนาที่ข้าตะโกนออกไปมี แต่จะเปิดโอกาสให้คู่ต่อสู้เท่านั้น"
 single_combat.0031.desc.sc_defender.hurt_me_better:0 "ความเจ็บปวดมักเป็นพันธมิตรของข้า แต่วันนี้ มันทอดทิ้งข้าไป"
 single_combat.0031.desc.sc_defender.special_fallback:0 "คู่ต่อสู้ของข้าไม่มีปัญหาในการก้าวหลบการเตะของข้า"
 single_combat.0031.desc.sc_defender.something_to_hide:0 "คู่ต่อสู้ของข้าไม่ได้ยินหรือไม่สนใจคำขู่โดยนัยของข้า"

