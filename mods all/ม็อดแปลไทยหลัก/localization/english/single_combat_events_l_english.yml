 single_combat.0031.desc.opponent_response.butchery:0 "[sc_victor.GetFirstNameNoTooltip] ไม่เสียเวลาในการระดม [sc_victor.Custom('SignatureWeaponAttemptedLightPlural')] ใส่ข้า แต่ละครั้งคำนวณมาอย่างดีเพื่อมอบความเจ็บปวดทรมานสูงสุด\n\n"
