 single_combat.0001.enthusiastic_onslaught.motto:0 "#EMP [myself.GetHouse.GetMotto]#! ไอ้สารเลว!"
 single_combat.0001.hail_mary:0 "การต่อสู้กับผู้เก่งกาจ เช่นนี้หมายความว่าข้าไม่มีอะไรจะเสียแล้ว!"
 single_combat.0001.pocket_sand:0 "ลองเจอ #EMP [sc_defender.Custom('GritType')]#! ใน [my_foe.Custom('EyeEyes')] ของเจ้าดูเป็นไร? #EMP ฮึ่ย่ะ!#!"
 single_combat.0001.nut_em:0 "มาดูกันว่าเจ้าจะชอบการถูกโขกกะโหลกหรือไม่!"
 single_combat.0001.guard:0 "เจ้าไม่มีทางทำลายการป้องกันของข้าได้ [my_foe.GetFirstNameNoTooltip]!"
 single_combat.0001.probing_attack:0 "เจ้าต้องลดการป้องกันลงในที่สุด ไอ้ขี้ขลาด!"
 single_combat.0001.onslaught:0 "ลิ้มรสความพิโรธของ [myself.GetFaith.WarGodName]!"
 single_combat.0001.surprise_attack:0 "[my_foe.GetSheHe|U] ไม่มีทางเห็นการโจมตีนี้!"
 single_combat.0001.taunt:0 "เจ้า [my_foe.Custom2('InsultNoun', ROOT.Char)] งี่เง่า ทำได้ดีกว่านี้มิใช่หรือ?"
 single_combat.0001.put_the_boot_in:0 "ฟาดด้วย [myself.Custom('signature_weapon')] ของข้า แล้วเตะเข้าที่ท้อง!"
 single_combat.0001.strict_guard:0 "[my_foe.GetWomenMen] ที่เก่งกว่าเจ้าก็ตายมานักต่อนักแล้วที่พยายามทำลายการป้องกันข้า!"
 single_combat.0001.confident_attack:0 "ข้าจะแสดงให้เจ้าเห็นว่า #EMP ข้า#! [myself.Custom('SignatureWeaponAction')] [myself.Custom('SignatureWeaponArticle')] [myself.Custom('signature_weapon')] อย่างไร!"
 single_combat.0001.expert_onslaught:0 "ฟาด! #EMP ปัดป้อง!#! #BER โต้กลับ!#!"
 single_combat.0001.attempt_disarm:0 "มาดูกันว่าเจ้าจะทำอย่างไรหากไม่มี [my_foe.Custom('signature_weapon')]!"
 single_combat.0001.lightning_assault:0 "จู่โจมก่อน จู่โจมแรง! #EMP เตรียมพร้อม!#!"
 single_combat.0001.tire_opponent:0 "นั่นคือทั้งหมดที่เจ้ามีรึ? เจ้าทำอะไรข้าไม่ได้ด้วยซ้ำ!"
 single_combat.0001.reason_you_suck_speech:0 "เจ้ารู้หรือไม่ว่าปัญหาของเจ้าคืออะไร [my_foe.GetFirstNameNoTooltip]? ไม่รึ? ถ้า เช่นนั้น..."
 single_combat.0001.technique_from_legend:0 "มันต้องได้ผลเหมือนในตำนานสินะ ใช่หรือไม่?"
 single_combat.0001.like_a_viper:0 "ช่องว่าง! รับคมดาบข้า, เจ้า [my_foe.Custom2('InsultNoun', ROOT.Char)]!"
 single_combat.0001.pocket_silver:0 "ลิ้มรสโลหะเงินซะ, เจ้า [my_foe.Custom2('InsultNoun', ROOT.Char)]!"
 single_combat.0001.martial_voice:0 "#EMP ไอ้หนอนไช!#! เจ้าคิดว่าจะยืนหยัดต่อกร #EMP ข้า#! ได้รึ?"
 single_combat.0001.mocking_boast:0 "#EMP เจ้า#! คิดว่าจะเอาชนะคนมีชื่อเสียงอย่าง #EMP ข้า#! ได้รึ?"
 single_combat.0001.is_that_a_crocodile:0 "น-นั่นมัน #EMP จระเข้#! หรือ!?"
 single_combat.0001.desert_warrior:0 "ความร้อนเล่นงานเจ้ารึ [my_foe.GetFirstNameNoTooltip]? ไอ้คนอ่อนแอ!"
 single_combat.0001.jungle_stalker:0 "ข้าเป็นหนึ่งเดียวกับเงาแห่งพงไพร!"
 single_combat.0001.open_terrain_expert:0 "มีพื้นที่ให้เคลื่อนไหวมาก เช่นนี้ เจ้าตายแน่ [my_foe.GetFirstNameNoTooltip]!"
 single_combat.0001.rough_terrain_expert:0 "เนินเขา หนองบึง ภูเขา ทั้งหมดนี้คืออาณาเขต #EMP ของข้า#! ทั้งสิ้น!"
 single_combat.0001.forest_fighter:0 "นี่คือป่า #EMP ของข้า#! [my_foe.GetFirstNameNoTooltip]!"
 single_combat.0001.raaargh:0 "#BER กรรรซ์!#!"
 single_combat.0001.hard_grit:0 "ให้ข้าแสดงให้เจ้าเห็นว่า #EMP มืออาชีพ#! เขาต่อสู้กันอย่างไร!"
 single_combat.0001.feint_and_stab:1 "#EMP เจ้าโง่!#! รับนี่ไป!"
 single_combat.0001.butchery:0 "ข้าว่าข้าต้อง ทำให้เจ้าเป็น #EMP เยี่ยงอย่าง#! เสียแล้ว..."
