 ## Combat Move Option Copy
 single_combat.0001.wait_and_hope:0 "บางทีหากข้ารอ [my_foe.GetSheHe] อาจสะดุด [my_foe.Custom('signature_weapon')] ของ [my_foe.GetHerHis] ก็เป็นได้?"
