 ##################################################
 # Misc Loc
 ## Titles
 single_combat.0000.t:0 "การประลองยุทธ์:"
 single_combat.0001.t:0 "$single_combat.0000.t$ [sc_attacker.GetTitledFirstNameNoTooltip]"
 single_combat.0011.t:0 "$single_combat.0000.t$ [sc_defender.GetTitledFirstNameNoTooltip]"
 single_combat.0031.t:0 "$single_combat.0000.t$ พ่ายแพ้!"
 single_combat.0041.t:0 "$single_combat.0000.t$ มีชัย!"

 ## Intro Spiels
 single_combat.0001.desc.sc_defender.intro:1 "[sc_attacker.GetTitledFirstName] และข้าต่างย่างเท้าคุมเชิง ซึ่งกันและกัน ต่างฝ่ายต่างประเมินทางเลือก [sc_attacker.GetSheHe|U] [sc_attacker.Custom('SignatureWeaponActionThirdPerson')] [sc_attacker.Custom('SignatureWeaponNameOrType')] อันน่าเกรงขาม ขณะที่ข้ากุม [sc_defender.Custom('SignatureWeaponNameOrType')] ของตนไว้แน่น อาวุธอันร้ายกาจให้ความรู้สึกเย็นและหนักแน่นในอุ้งมือข้า\n\n"
 single_combat.0001.desc.capstone.intro.first_blood:0 "แม้นการประลองนี้จะสิ้นสุดเมื่อหลั่งโลหิตแรก แต่ก็หาได้คลายความประหม่าของข้าไม่"
 single_combat.0001.desc.capstone.intro.deadly:0 "มีเพียงผู้เดียวที่จะเดินจากไปจากที่นี่ในวันนี้ และข้าตั้งใจให้เป็นข้าเอง"
 single_combat.0001.desc.sc_attacker.intro:1 "ชั่วครู่หนึ่ง [sc_defender.GetTitledFirstName] และข้าย่างก้าวเป็นครึ่งวงกลมอย่างเชื่องช้า ต่างฝ่ายต่างมองหาช่องโหว่ ข้า [sc_attacker.Custom('SignatureWeaponAction')] [sc_attacker.Custom('SignatureWeaponNameOrType')] ของข้า เตรียมพร้อมป้องกันตัว ขณะที่ [sc_defender.GetSheHe] กำ [sc_defender.Custom('SignatureWeaponNameOrType')] ของ [sc_defender.GetHerHis] ไว้ในมืออย่างมั่นคง"
 single_combat.0001.desc.sc_attacker.intro.epilogue:1 "\n\nเพียงชั่วพริบตา การประลองของเราก็เริ่มขึ้น\n\n"
