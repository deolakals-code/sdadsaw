 # Outcome Event: Victor
 ## Defender Won, Own Combat Move Feedback
 single_combat.0041.desc.sc_defender.wait_and_hope:0 "การรอให้คู่ต่อสู้เคลื่อนไหวก่อนกลับกลายเป็นผลดีอย่างน่าประหลาดใจ"
 single_combat.0041.desc.sc_defender.unsure_attack:0 "การโจมตีอันเบาบางข้าพิสูจน์แล้วว่าไม่จำเป็นในท้ายที่สุด"
 single_combat.0041.desc.sc_defender.enthusiastic_onslaught:0 "การ [sc_victor.Custom('SignatureWeaponFlourishPresentParticiple')] อย่างแรงกล้าข้าดูเหมือนจะได้ผล"
 single_combat.0041.desc.sc_defender.hail_mary:0 "เห็นได้ชัดว่า การโจมตีสุดตัวข้าก็เพียงพอแล้ว"
 single_combat.0041.desc.sc_defender.pocket_sand:0 "การขว้าง [sc_defender.Custom('GritType')] กลับกลายเป็นการเบี่ยงเบนความสนใจที่เพียงพอ"
 single_combat.0041.desc.sc_defender.nut_em:0 "การโขกศีรษะใส่คู่ต่อสู้ข้าดูเหมือนจะ ทำให้ [sc_loser.GetHerHim] เสียหลัก"
 single_combat.0041.desc.sc_defender.guard:0 "การป้องกันข้ายืนหยัดอย่างแน่วแน่ ปกป้องข้าให้ปลอดภัยจากคู่ต่อสู้"
 single_combat.0041.desc.sc_defender.probing_attack:0 "การโจมตีหยั่งเชิงข้าเปิดจุดอ่อนหลายจุด"
 single_combat.0041.desc.sc_defender.onslaught:0 "การระดม [sc_victor.Custom('SignatureWeaponAttemptedLightPlural')] ข้าพิสูจน์ว่าได้ผล"
 single_combat.0041.desc.sc_defender.surprise_attack:0 "ในการรบ ความประหลาดใจมักนำมา ซึ่งชัยชนะ และนั่นก็เป็นจริงที่นี่"
 single_combat.0041.desc.sc_defender.taunt:0 "ดูเหมือนว่าการยั่วยุข้าจะส่งผลต่อคู่ต่อสู้ข้ามากกว่า"
 single_combat.0041.desc.sc_defender.put_the_boot_in:0 "การกระทืบซ้ำนั้นต่ำทราม แต่มันก็ได้ผล"
 single_combat.0041.desc.sc_defender.strict_guard:0 "ไม่มีสิ่งใดทำลายการป้องกันข้าได้มาก่อน และไม่มีสิ่งใดทำลายมันได้ในวันนี้"
 single_combat.0041.desc.sc_defender.confident_attack:0 "ความมั่นใจนำมา ซึ่งความสามารถ ดังที่พวกเขากล่าว และการโจมตีข้าก็พิสูจน์ เช่นนั้น"
 single_combat.0041.desc.sc_defender.expert_onslaught:0 "[sc_loser.GetWomenMen] น้อยคนนักที่จะทนทานต่อการระดม [sc_victor.Custom('SignatureWeaponAttemptedHeavyPlural')] ข้าได้ และคู่ต่อสู้ข้าก็ไม่ใช่ข้อยกเว้น"
 single_combat.0041.desc.sc_defender.attempt_disarm:0 "ข้าหวังว่าจะ ทำให้คู่ต่อสู้เสียหลัก แต่ความพยายามปลดอาวุธข้ากลับได้ผลดียิ่งกว่านั้นมาก"
 ### No need for a lightning_assault, as you can't end the duel in the first round.
 single_combat.0041.desc.sc_defender.tire_opponent:0 "การล่อให้คู่ต่อสู้ของข้า ทำให้ [sc_loser.GetHerselfHimself] หมดแรงดูเหมือนจะได้ผลดี"
 single_combat.0041.desc.sc_defender.reason_you_suck_speech:0 "ขนคอคู่ต่อสู้ข้าดูเหมือนจะลุกชัน เพราะคำพูดข้ามากกว่า [sc_victor.Custom('signature_weapon')] ข้าเสียอีก"
 single_combat.0041.desc.sc_defender.technique_from_legend:0 "การเอาชนะคู่ต่อสู้ข้านั้นง่ายดุจการเล่าเรื่องซ้ำ"
 single_combat.0041.desc.sc_defender.like_a_viper:0 "ข้าพุ่งเข้าใส่หัวใจคู่ต่อสู้ เกือบจะจบสิ่งนี้ด้วยการโจมตีเพียงครั้งเดียว"
 single_combat.0041.desc.sc_defender.pocket_silver:0 "การให้เงินจำนวนมากเข้าที่ [sc_loser.Custom('MaskFace')] ดูเหมือนจะได้ผลอย่างน่าอัศจรรย์"
 single_combat.0041.desc.sc_defender.martial_voice:0 "คู่ต่อสู้ข้า #EMP ตกตะลึงอย่างแท้จริง#! ด้วยคำหยาบคายที่ข้ากรีดร้องออกไป"
 single_combat.0041.desc.sc_defender.mocking_boast:0 "คู่ต่อสู้ของข้ากัดฟัน[sc_loser.GetHerHis] #EMP แน่น#! เมื่อได้ฟังคำพูดของข้า"
 single_combat.0041.desc.sc_defender.is_that_a_crocodile:0 "คู่ต่อสู้ข้าแทบจะไม่สามารถปัดป้องผู้โจมตีสัตว์เลื้อยคลานของ [sc_loser.GetHerHis] ได้"
 single_combat.0041.desc.sc_defender.desert_warrior:0 "ความร้อนดูเหมือนจะส่งผลกระทบอย่างหนักต่อคู่ต่อสู้ข้า"
 single_combat.0041.desc.sc_defender.jungle_stalker:0 "ป่าขัดขวางคู่ต่อสู้ข้าครั้งแล้วครั้งเล่า"
 single_combat.0041.desc.sc_defender.open_terrain_expert:0 "พื้นที่กว้างขวางที่เราต่อสู้กัน ทำให้ข้าควบคุมการประลองได้อย่างง่ายดาย"
 single_combat.0041.desc.sc_defender.rough_terrain_expert:0 "ภูมิประเทศที่ขรุขระนี้พิสูจน์ว่าเป็นปัญหาสำหรับคู่ต่อสู้ข้าในการต่อสู้"
 single_combat.0041.desc.sc_defender.forest_fighter:0 "ป่า ทำให้คู่ต่อสู้ข้าช้าลงอย่างดี"
 single_combat.0041.desc.sc_defender.raaargh:0 "น้อยคนนักที่จะยืนหยัดต่อหน้าความบ้าคลั่งของข้าได้ และคู่ต่อสู้ข้าก็ไม่ใช่ข้อยกเว้น"
 single_combat.0041.desc.sc_defender.hard_grit:0 "ประสบการณ์ที่ได้มาอย่างยากลำบากให้ผลตอบแทนเมื่อใช้อย่างชาญฉลาด และข้าก็ใช้มันอย่างชาญฉลาดจริงๆ"
 single_combat.0041.desc.sc_defender.feint_and_stab:0 "แม้พวกเขาจะดึงกลับทันเวลา การแทงด้วยมืออีกข้างข้าเกือบจะจบสิ่งนี้"
 single_combat.0041.desc.sc_defender.butchery:0 "การโจมตีอันไร้ความปรานีข้าสร้างความเสียหายอันน่าสะพรึงกลัว"
 single_combat.0041.desc.sc_defender.stoic_veteran:0 "กององครักษ์ไม่แตกสลาย ไม่ใช่ที่นี่ ไม่ใช่ตลอดไป"
 single_combat.0041.desc.sc_defender.blade_dance:0 "ข้าต่อสู้ดุจสายน้ำไหล: ยืดหยุ่น แต่หลีกเลี่ยงไม่ได้"
 single_combat.0041.desc.sc_defender.wrath_of_highgod:0 "เห็นได้ชัดว่า [sc_victor.GetFaith.HighGodName] ทรงเมตตาข้า"
 single_combat.0041.desc.sc_defender.hurt_me_better:0 "ความเจ็บปวดคือพันธมิตรที่ดีที่สุดในการต่อสู้ และมันอยู่ข้าง #EMP ข้า#! "
 single_combat.0041.desc.sc_defender.special_fallback:0 "คู่ต่อสู้น้อยคนนักที่จะคาดคิดถึงการเตะหน้าแข้งทางยุทธวิธี"
 single_combat.0041.desc.sc_defender.something_to_hide:0 "คู่ต่อสู้ข้าดูหวาดกลัวอย่างยิ่งต่อการพูดเป็นนัยข้า"

 ## Defender Won, Opponent Finishing Move Feedback
 single_combat.0041.desc.opponent_response.wait_and_hope:0 "เมื่อ [sc_loser.GetFirstNameNoTooltip] เพียงแค่แข็งทื่ออยู่กับที่ ข้าก็เกือบจะตกตะลึงไปด้วย! แต่ถ้า [sc_loser.GetSheHe] จะไม่สู้ นั่นก็หยุดข้าไม่ได้ และข้าก็พุ่งไปข้างหน้าด้วย [sc_victor.Custom('SignatureWeaponAttemptedHeavy')]\n\n"
 single_combat.0041.desc.opponent_response.unsure_attack:0 "[sc_loser.GetFirstNameNoTooltip] ลอง [sc_loser.Custom('SignatureWeaponAttemptedLightPlural')] อย่างขอไปทีสองสามครั้ง แต่ไม่มีอะไรที่ข้าหลบหลีกไม่ได้ง่ายๆ\n\n"
 single_combat.0041.desc.opponent_response.enthusiastic_onslaught:0 "[sc_loser.GetFirstNameNoTooltip] พุ่งเข้าใส่ข้า กรีดร้องไม่เป็นภาษาและ [sc_loser.Custom('SignatureWeaponFlourishPresentParticiple')] [sc_loser.Custom('signature_weapon')] ของ [sc_loser.GetHerHis] ด้วยความกระตือรือร้นทั้งหมดของมือสมัครเล่นที่สิ้นหวัง\n\n"
 single_combat.0041.desc.opponent_response.hail_mary:0 "[sc_loser.GetFirstNameNoTooltip] ทุ่ม [sc_loser.GetHerselfHimself] เข้าสู่การโจมตีแบบหมดหน้าตัก [sc_loser.Custom('signature_weapon')] ออก พร้อมที่จะชนะหรือตายด้วยการระดม [sc_loser.Custom('SignatureWeaponAttemptedHeavyPlural')]\n\nโชคไม่ดีสำหรับ [sc_loser.GetHerHim],"
 single_combat.0041.desc.opponent_response.pocket_sand:0 "[sc_loser.GetFirstNameNoTooltip] ย่อตัวลงเพื่อคว้า [sc_defender.Custom('GritType')] กำมือหนึ่งจากพื้น แต่เมื่อ [sc_loser.GetSheHe] พยายามขว้างมันใส่ข้า ลมกระโชกก็พัดมันกลับเข้า [sc_loser.Custom('MaskFace')] ของ [sc_loser.GetHerHis] อย่างจัง\n\n"
 single_combat.0041.desc.opponent_response.nut_em:0 "อย่างห้าวหาญ [sc_loser.GetFirstNameNoTooltip] พุ่งเข้าใส่ข้า [sc_loser.Custom('signature_weapon')] ห้อยต่อง แต่ง เห็นได้ชัดว่าพยายามจะโขกกะโหลกข้าอย่างแรง\n\n"
 single_combat.0041.desc.opponent_response.guard:0 "[sc_loser.GetFirstNameNoTooltip] รักษาการป้องกันที่ดี แต่ไม่ใช่สิ่งที่เจาะไม่เข้า ต้องใช้ความพยายาม แต่ในที่สุดข้าก็สามารถ"
 single_combat.0041.desc.opponent_response.probing_attack:0 "[sc_loser.GetFirstNameNoTooltip] พยายามยันข้าไว้ด้วย [sc_loser.Custom('SignatureWeaponAttemptedLightPlural')] อย่างระมัดระวัง ฉลาดอยู่ครู่หนึ่ง แต่โง่เขลาในระยะยาว เพราะมัน ทำให้ข้าควบคุมจังหวะการประลองของเราได้\n\nในที่สุด ข้าก็สามารถปัดป้องครั้งหนึ่งได้แรงพอที่จะ"
 single_combat.0041.desc.opponent_response.onslaught:0 "[sc_loser.GetFirstNameNoTooltip] โจมตีอย่างหนัก ระดม [sc_loser.Custom('SignatureWeaponAttemptedHeavyPlural')] ใส่ข้า ทำให้การปัดป้อง แต่ละครั้งเป็นฝันร้าย\n\nเพียงแค่การก้าวไปด้านข้างอย่างโชคดีกลางพริบตาเท่านั้นที่ข้าหลุดพ้นจากการระดมโจมตีได้,"
 single_combat.0041.desc.opponent_response.surprise_attack:0 "[sc_loser.GetFirstNameNoTooltip] พยายามเปลี่ยนวิถีการเหวี่ยงครั้งต่อไปของ[sc_loser.GetHerHis]กลางคัน หวังจะจู่โจมข้าโดยไม่ให้ตั้งตัวอย่างชัดเจน แต่ข้าสามารถปัดป้องได้อย่างมั่นคงจน[sc_loser.GetHerHim]เซถลาไป"
 single_combat.0041.desc.opponent_response.taunt:0 "[sc_loser.GetFirstNameNoTooltip] ดึงกลับ รอยยิ้มอันโหดร้ายกำลังจะเริ่มก่อตัวขึ้นบนใบหน้าของ [sc_loser.GetHerHis] อย่างไม่ต้องสงสัย ไม่ว่า [sc_loser.GetSheHe] จะมีคำเยาะเย้ยเล็กๆ น้อยๆ อะไรจะพูด ข้าก็ไม่อยากฟัง และข้าก็เริ่ม [sc_victor.Custom('SignatureWeaponAttemptedHeavy')] เกือบจะตามสัญชาตญาณ\n\n"
 single_combat.0041.desc.opponent_response.put_the_boot_in.peg_leg:0 "[sc_loser.GetFirstNameNoTooltip] โจมตีข้าด้วย [sc_loser.Custom('SignatureWeaponAttemptedHeavy')] ที่รุนแรงอย่างเหลือเชื่อ ตามด้วยการโจมตีที่ประสบความสำเร็จโดยพยายามเตะข้าด้วยขาปลอมของ [sc_loser.GetHerHis]\n\nโดยไม่คิด ข้าฟาด [sc_victor.Custom('SignatureWeaponEndType')] ของ [sc_victor.Custom('signature_weapon')] ข้าลงอย่างแรงจนขาปลอมหลุดออกมาและคู่ต่อสู้ข้าล้มลงกับพื้น"
 single_combat.0041.desc.opponent_response.put_the_boot_in.fallback:0 "[sc_loser.GetFirstNameNoTooltip] โจมตีข้าด้วย [sc_loser.Custom('SignatureWeaponAttemptedHeavy')] ที่รุนแรงอย่างเหลือเชื่อ ตามด้วยการโจมตีที่ประสบความสำเร็จโดยพยายามเตะข้า ข้าหลบไปด้านข้าง ฟาด [sc_victor.Custom('SignatureWeaponAttemptedLight')] เข้าที่หลังของ [sc_loser.GetHerHis] ขณะ [sc_loser.GetSheHe] ผ่านไป และคู่ต่อสู้ข้าก็ล้มลงกับพื้น\n\n"
 single_combat.0041.desc.opponent_response.strict_guard:0 "ไม่ว่า [sc_loser.GetFirstNameNoTooltip] จะเป็นอะไรก็ตาม [sc_loser.GetSheHe] ก็เก่งกาจในการรักษาการป้องกันของ [sc_loser.GetHerHis] อย่างเหลือเชื่อ มันเป็นโชคมากกว่าทักษะเมื่อข้าสามารถทำได้ในที่สุด"
 single_combat.0041.desc.opponent_response.confident_attack:0 "[sc_loser.GetFirstNameNoTooltip] เป็นผู้ใช้ [sc_loser.Custom('signature_weapon')] ที่มีทักษะ แต่นักรบทุกคนต้องเสี่ยงเพื่อชัยชนะ และมันอยู่กลาง [sc_loser.Custom('SignatureWeaponAttemptedLight')] ที่เสี่ยงเป็นพิเศษครั้งหนึ่งที่ข้า"
 single_combat.0041.desc.opponent_response.expert_onslaught:0 "[sc_loser.GetFirstNameNoTooltip] ต่อสู้ราวกับ [sc_loser.GetWomanMan] ที่ถูกสิง ปลดปล่อยพายุ [sc_loser.Custom('SignatureWeaponAttemptedHeavyPlural')] ที่ไม่สิ้นสุด ซึ่งผลักข้าถอยหลังแล้วถอยหลังเล่า\n\nจนกระทั่ง [sc_loser.GetSheHe] ใช้เวลาสักครู่เพื่อลิงโลดในชัยชนะที่ใกล้เข้ามาของ [sc_loser.GetHerHis] เท่านั้นที่"
 single_combat.0041.desc.opponent_response.attempt_disarm:0 "[sc_loser.GetFirstNameNoTooltip] พุ่งเข้าหาข้า [sc_loser.Custom('SignatureWeaponAttemptedHeavy')] อันทรงพลังเพียงครั้งเดียวเกือบจะกระชาก [sc_victor.Custom('signature_weapon')] ออกจากมือข้า แต่ข้ายืนหยัดมั่นคงและเอนตัวเข้าหาการโจมตี\n\nเห็นได้ชัดว่าข้าจับอาวุธของ [sc_loser.GetHerHis] ผิดมุม เพราะ"
 ### No need for a lightning_assault, as you can't end the duel in the first round.
 single_combat.0041.desc.opponent_response.tire_opponent:0 "[sc_loser.GetFirstNameNoTooltip] หลอกล่อไปข้างหน้าซ้ำๆ ดูเหมือนจะเปิดโอกาสให้ข้าโจมตี เพียงเพื่อจะพุ่งหนีไป ด้วยความรู้สึกถึงโอกาส ข้ากดดันมากขึ้นและแรงขึ้นด้วย [sc_victor.Custom('SignatureWeaponAttemptedLight')] แต่ละครั้ง ในที่สุดก็จับ [sc_loser.GetHerHim] ได้หลายครั้ง\n\n"
 single_combat.0041.desc.opponent_response.reason_you_suck_speech:0 "ทุกคนรู้ว่า [sc_loser.GetFirstNameNoTooltip] เป็นนักพูด และเป็นที่ชัดเจนจากท่าทางของ [sc_loser.GetHerHis] ว่า [sc_loser.GetSheHe] กำลังจะใช้โอกาสนี้เพื่อเริ่มบรรยาย เอาล่ะ ถึงเวลาแสดงให้ [sc_loser.GetHerHim] เห็นว่าลิ้นเงินทำอะไรได้บ้างเมื่อเจอกับ [sc_victor.Custom('signature_weapon')] เหล็กกล้า\n\n"
 single_combat.0041.desc.opponent_response.technique_from_legend:0 "[sc_loser.GetFirstNameNoTooltip] ตั้งท่าอย่างงุ่มง่ามและน่าทึ่ง"
 single_combat.0041.desc.opponent_response.like_a_viper:0 "เคลื่อนไหวเร็วเสียจนข้าแทบไม่ทันรับรู้แผนของ [sc_loser.GetHerHis] [sc_loser.GetFirstNameNoTooltip] ก็พุ่งเข้า #EMP ใน#! วงป้องกันข้า [sc_loser.Custom('signature_weapon')] พุ่งตรงมาที่หัวใจข้า ข้าแทบไม่มีเวลาตอบโต้ก่อนความตายอันแน่นอน\n\n"
 single_combat.0041.desc.opponent_response.pocket_silver:0 "[sc_loser.GetFirstNameNoTooltip] คว้าบางสิ่งจากรอบเอวของ [sc_loser.GetHerHis] และขว้างมันใส่ข้า ก่อนที่ข้าจะทันประมวลผลว่ามันคืออะไร ข้าก็ทำลายมันตามสัญชาตญาณด้วย [sc_victor.Custom('SignatureWeaponAttemptedHeavy')] ทำให้เหรียญเงินหนักๆ จำนวนมากตกลงมาใส่ศัตรูข้า\n\nเมื่อคู่ต่อสู้ข้าตาบอดชั่วขณะ,"
 single_combat.0041.desc.opponent_response.martial_voice:0 "[sc_loser.GetFirstNameNoTooltip] ไม่ว่าจะด้วยความโกรธหรือความเย่อหยิ่ง ก็เริ่มด่าทอข้า ประณามข้าราวกับว่าข้าเป็นชาวบ้านที่สกปรก ขนคอข้าเริ่มลุกชัน แต่ข้ายับยั้งตัวเองไว้ จนกระทั่ง [sc_loser.GetSheHe] หยุดพักเพื่อหายใจลึกๆ\n\n"
 single_combat.0041.desc.opponent_response.mocking_boast:0 "[sc_loser.GetFirstNameNoTooltip] รักษาระยะห่างของ [sc_loser.GetHerHis] ถอยห่างจากการโจมตีทุกครั้งข้า แทนที่จะเป็น เช่นนั้น [sc_loser.GetSheHe] เพียงแค่พูดจาเสียดสีครั้งแล้วครั้งเล่าเกี่ยวกับชื่อเสียงทางโลกข้าจนความอดทนข้าขาดสะบั้น\n\n"เจ้ารู้หรือไม่ว่าวิธีที่ดีในการสร้างชื่อเสียงคืออะไร?" ข้าถาม แต่ไม่มีการตอบสนอง "การฆ่าคนมีชื่อเสียง"\n\nความตกตะลึงชั่วขณะของ [sc_loser.GetFirstNamePossessiveNoTooltip] คือทั้งหมดที่ข้าต้องการเพื่อ"
 single_combat.0041.desc.opponent_response.is_that_a_crocodile:0 "โดยไม่มีการเตือน [sc_loser.GetFirstNameNoTooltip] เริ่มถอยหลังอย่างเร่งรีบ ดูเหมือนว่า [sc_loser.GetSheHe] เห็นผี ด้วยความสงสัยว่าเป็นกลอุบาย ข้าจึงกดดันโอกาสต่อไปโดยไม่สะทกสะท้าน"
 single_combat.0041.desc.opponent_response.desert_warrior:0 "ความร้อนนี้ ความร้อนที่ #EMP ดูดพลัง#! #EMP ทำให้สูญเปล่า#! นี้! มันกำลังฆ่าข้าอย่างช้าๆ แต่ข้ายืนหยัดต่อไปด้วยพลังใจล้วนๆ [sc_loser.GetFirstNameNoTooltip] ดูเหมือนจะไม่ได้รับผลกระทบ แต่ถึงกระนั้นก็ตกตะลึงในความดื้อรั้นข้ามากขึ้นเรื่อยๆ\n\nเมื่อการป้องกันของ [sc_loser.GetHerHis] หย่อนลงเพียงเล็กน้อย,"
 single_combat.0041.desc.opponent_response.jungle_stalker:0 "แม้ว่าป่าจะเป็นสถานที่ต่อสู้ที่ยุ่งเหยิงเพียงใด [sc_loser.GetFirstNameNoTooltip] ก็ ทำให้มันดู #EMP ง่ายดาย#! อย่างน้อยก็ จนกระทั่ง [sc_loser.GetSheHe] ทำให้เท้าของ[sc_loser.GetHerHis]ไปติดเข้ากับเถาวัลย์\n\n""
 single_combat.0041.desc.opponent_response.open_terrain_expert:0 "[sc_loser.GetFirstNameNoTooltip] ต่อสู้ได้ดีที่สุดในที่โล่ง และ [sc_loser.GetSheHe] ก็รู้ดี ยอมเสียพื้นที่ทุกครั้งที่มันเหมาะกับ [sc_loser.GetHerHim] มัน ทำให้เป็นการต่อสู้ที่น่าหงุดหงิด จนกระทั่งข้าเห็นก้อนหินขนาดใหญ่และดูแหลมคมอยู่ใกล้ๆ ที่ความสูง #EMP ประมาณ#! หน้าแข้งพอดี\n\nอย่างอดทน ข้าต้อนศัตรูข้าไปยังอันตรายเล็กน้อยนั้น พึ่งพาการเปลี่ยนตำแหน่งอย่างเย่อหยิ่งของ [sc_loser.GetHerHis]"
 single_combat.0041.desc.opponent_response.rough_terrain_expert.rocky:0 "[sc_loser.GetFirstNameNoTooltip] เป็นทหารผ่านศึกการต่อสู้บนทางลาดชัน ชำนาญในการต่อสู้บนเนินเขาและภูเขา และ [sc_loser.GetSheHe] ก็แสดงให้เห็นอย่างชัดเจน ครั้งแล้วครั้งเล่าที่ข้าต้องรัดเข็มขัดป้องกันการผลักอย่างแรงที่ออกแบบมาเพื่อส่งข้ากลิ้งลงไป,\n\n"
 single_combat.0041.desc.opponent_response.rough_terrain_expert.boggy:0 "ในหนองบึง [sc_loser.GetFirstNameNoTooltip] ต่อสู้ราวกับ [sc_victor.GetFaith.DevilName] [sc_victor.GetFaith.DevilHerselfHimself] และผลักข้าลงไปในน้ำเหม็นของพื้นที่ซ้ำแล้วซ้ำเล่า โชคดีสำหรับข้า ไม่มีสระใดที่ลึกเป็นพิเศษ\n\nมันเกือบจะน่าขัน แล้วที่น้ำหนองแรกที่ [sc_loser.GetSheHe] เสี่ยงก้าวลงไปกลับท่วมขาของ [sc_loser.GetHerHis] ถึงเข่า\n\n"
 single_combat.0041.desc.opponent_response.forest_fighter:0 "แม้ว่า [sc_loser.GetFirstNameNoTooltip] จะมีชื่อเสียงว่าเป็น [sc_loser.GetWomanMan] ป่าไม้ที่เชี่ยวชาญ แต่ไม่ใช่ทุกป่าที่จะให้ประโยชน์มากนัก\n\nพื้นที่ป่าปัจจุบันที่เราอยู่ดูเหมือนจะงดงามอย่างแท้จริง และการมองหาวิธีใช้ประโยชน์จากประสบการณ์ของ [sc_loser.GetHerHis] ก็เป็นการเบี่ยงเบนความสนใจอย่างมากสำหรับ [sc_loser.GetFirstNameNoTooltip]"
 single_combat.0041.desc.opponent_response.raaargh: "[sc_loser.GetFirstNameNoTooltip] สั่นเทา หยุดนิ่งอยู่กับที่เป็นเวลาไม่กี่วินาทีอันตึงเครียด ก่อนจะ #EMP ระเบิด#! ความโกรธออกมา\n\nความกลัวต่อความปลอดภัยของ[sc_loser.GetHerHis]มลายหายสิ้น นักรบบ้าคลั่งผู้นั้นพุ่งตัว[sc_loser.GetHerselfHimself]เข้าใส่ข้า เป็นวงหมุนของ[sc_loser.Custom('SignatureWeaponAttemptedHeavyPlural')]ที่ไม่อาจควบคุม หมัด เท้า และการกัดฟันกรอด\n\n"
 single_combat.0041.desc.opponent_response.hard_grit:0 "[sc_loser.GetFirstNameNoTooltip] ต่อสู้ได้ดี ไม่ให้ความปรานีและไม่ยอมให้เกิดข้อผิดพลาด ทุกช่องว่างถูกฉวยโอกาส ทุกจุดอ่อนต้องชดใช้ด้วยความเจ็บปวดและความพยายาม\n\nเพียงแค่เล่นอย่างระมัดระวัง สู้กับ [sc_loser.GetHerHim] แบบตาต่อตาฟันต่อฟันเท่านั้น ข้าจึงจะตามทัน รอ จนกระทั่ง #EMP [sc_loser.GetSheHe]#! ทำพลาดก่อนที่ข้าจะ"
 single_combat.0041.desc.opponent_response.feint_and_stab:0 "[sc_loser.GetFirstNameNoTooltip] โยน [sc_loser.Custom('SignatureWeaponAttemptedLight')] ใส่ข้าด้วย [sc_loser.Custom('signature_weapon')] ของ [sc_loser.GetHerHis] แต่มันดูเหมือนจะไม่มีสมาธิ\n\nไม่ต้องใช้ความพยายามมากนักที่จะปัดอาวุธออกจากมือคู่ต่อสู้ข้า และเมื่อนั้นเองที่ข้าเห็นแสงแวววาวของกริชในมืออีกข้างของ [sc_loser.GetHerHis]"
 single_combat.0041.desc.opponent_response.butchery:1 "แม้จะมีชื่อเสียงน่าสะพรึงกลัวของ [sc_loser.GetFirstNamePossessiveNoTooltip] [sc_loser.Custom('SignatureWeaponAttemptedHeavyPlural')] อันดุร้ายของ [sc_loser.GetHerHis] ดูเหมือนจะ... สะเปะสะปะ หากไม่มีคำที่ดีกว่านี้ มันถูกปัดป้องได้ง่าย และแม้การโจมตี แต่ละครั้งจะแสบเหมือน [sc_victor.GetFaith.NegativeAfterLife] การมีอาวุธอยู่ในมือ ทำให้นักปล้นที่น่ากลัวสามารถจัดการได้มากขึ้น\n\n"
 single_combat.0041.desc.opponent_response.stoic_veteran:0 "[sc_loser.GetFirstNameNoTooltip] ใช้ [sc_loser.Custom('signature_weapon')] ของ [sc_loser.GetHerHis] ด้วยความสามารถทั้งหมดตามแบบฉบับของวารังเจียน ฟันข้าด้วยการโจมตีที่ยาวและสม่ำเสมอด้วยอาวุธของ [sc_loser.GetHerHis] มันยาก แต่ไม่มีอะไรที่ข้าปัดป้องได้ไม่ดีพอ\n\n"
 single_combat.0041.desc.opponent_response.blade_dance:0 "[sc_loser.GetFirstNameNoTooltip] อาจมีชื่อเสียงด้านทักษะของ [sc_loser.GetHerHis] ด้วย [sc_loser.Custom('SignatureWeaponArticle')] [sc_loser.Custom('signature_weapon')] แต่ [sc_loser.GetSheHe] ก็ประทับใจในความเก่งกาจของตัวเองมากเกินไปอย่างเห็นได้ชัด\n\n[sc_victor.Custom('SignatureWeaponAttemptedLight')] ที่ฉวยโอกาสครั้งหนึ่งเข้าที่มือข้างที่ถือ [sc_loser.Custom('signature_weapon')] ของ [sc_loser.GetHerHis] ในภายหลัง และท่าทางของ [sc_loser.GetHerHis] ก็แตกสลาย,"
 single_combat.0041.desc.opponent_response.wrath_of_highgod:0 "คำรามความภักดีของ [sc_loser.GetHerHis] ต่อ [sc_loser.GetFaith.HighGodName] [sc_loser.GetFirstNameNoTooltip] ปล่อยให้ความสนใจของ [sc_loser.GetHerHis] เบี่ยงเบนไปจากการประลองของเราโดยสิ้นเชิง\n\nด้วยการยักไหล่อย่างรวดเร็วเพื่อรับทราบความเย่อหยิ่งอันไร้สาระของศัตรูข้า ข้าก้าวไปข้างหน้าและ"
 single_combat.0041.desc.opponent_response.hurt_me_better:0 "เพียง [sc_victor.GetFaith.HealthGodName] เท่านั้นที่รู้แน่ชัดว่า [sc_loser.GetFirstNameNoTooltip] กำลังทำหน้าอย่างไรในตอนนี้ กลัว? เจ็บปวด? ใคร่? สับสน? ข้าคงไม่มีวันรู้\n\nไม่ว่ามันจะเป็นอะไร มันก็แปรเปลี่ยนเป็นชุด [sc_loser.Custom('SignatureWeaponAttemptedLightPlural')] ที่อ่อนแอและไม่เป็นอันตราย,"
 single_combat.0041.desc.opponent_response.special_fallback:0 "จากที่ไหนไม่ทราบ [sc_loser.GetFirstNameNoTooltip] พุ่งไปข้างหน้า เล็งเตะอย่างรุนแรงตรงไปยังตำแหน่งที่หน้าแข้งข้า #EMP เคยอยู่#! เมื่อครู่หนึ่ง ประหลาดใจกับการเปลี่ยนแปลงที่ไม่คาดคิดข้า ศัตรูข้าลอยผ่านข้าไป เสียสมดุลอย่างสิ้นเชิง\n\n"
 single_combat.0041.desc.opponent_response.something_to_hide:0 "[sc_loser.GetFirstNameNoTooltip] อยู่กลางความพยายามที่น่าสมเพชและอ้อมค้อมที่จะ ทำให้ข้าไม่สงบ เต็มไปด้วยเสียงที่น่าขนลุกและคำขู่ที่สวยหรู เมื่อข้าหมดความอดทนและฟาด [sc_loser.GetHerHim] เข้าที่กรามด้วย [sc_victor.Custom('SignatureWeaponEndType')] ของ [sc_victor.Custom('signature_weapon')] ข้า\n\n[sc_loser.GetSheHe|U] โซเซถอยหลังทันที,"

 ## Defender Won, Opponent Finishing Move Injury
 single_combat.0041.desc.opponent_response.wait_and_hope.injury:0 "ไม่มีการปัดป้องใดๆ มาพบข้า ไม่มีการหลบหลีกใดๆ หลบเลี่ยงข้า และข้าต้องดึงตัวเองกลับในวินาทีสุดท้ายเพื่อหลีกเลี่ยง [sc_victor.Custom2('SignatureWeaponKillTypeHeadThirdPersonPresentGendered',SCOPE.sC('sc_loser'))]\n\nแทนที่จะเป็น เช่นนั้น ข้าเพียงแค่วาง [sc_victor.Custom('signature_weapon')] ข้าพิงไว้ อีกครั้ง [sc_loser.GetFirstNameNoTooltip] แข็งทื่อ แต่เป็นที่ชัดเจนว่าข้าชนะแล้ว"
 single_combat.0041.desc.opponent_response.unsure_attack.injury:0 "เสี่ยงกับความขี้ขลาดของ [sc_loser.GetFirstNamePossessiveNoTooltip] ข้าพุ่งไปข้างหน้าด้วย [sc_victor.Custom('SignatureWeaponAttemptedHeavy')] ที่ ทำให้ [sc_loser.GetHerHim] เสียสมดุลอย่างสิ้นเชิง ไม่หยุดหายใจ ข้าเตะ [sc_loser.GetHerHim] อย่างแรงเข้าที่เข่า และ [sc_loser.GetFirstNameNoTooltip] ก็ล้มลงพร้อมเสียง #EMP ดังตุ้บ#! อย่างหนัก\n\nนี่ ทำให้ข้ามีเวลาเหลือเฟือที่จะจัดตำแหน่งตัวเองสำหรับการสังหารอันน่าสยดสยอง [sc_loser.GetSheHe|U] ยอมแพ้ภายในไม่กี่วินาที"
 single_combat.0041.desc.opponent_response.enthusiastic_onslaught.injury:0 "เลือกจังหวะเหมาะ ข้าสามารถฟาดเข้าที่ขมับของ [sc_loser.GetHerHis] อย่างแรงได้ด้วย [sc_victor.Custom('SignatureWeaponEndType')] ของ [sc_victor.Custom('signature_weapon')] ข้า และ [sc_loser.GetSheHe] ก็ล้มลงเหมือนแกะที่ถูกตีหัว\n\nข้าใช้เวลาสักครู่เพื่อซึมซับภาพอันน่าสมเพชของ [sc_loser.GetWomanMan] ที่คร่ำครวญอยู่ใน [sc_defender.Custom('GroundType')] ต่อหน้าข้า จากนั้นจึงเตรียมพร้อมสำหรับการสังหาร\n\n[sc_loser.GetFirstNameNoTooltip] เปล่งเสียงยอมแพ้ออกมาโดยเหลือเวลาอีกไม่กี่วินาที"
 single_combat.0041.desc.opponent_response.hail_mary.injury:0 "ความสิ้นหวังและความไร้ความสามารถเป็นเพื่อนร่วมเตียงที่น่าอึดอัด การโจมตีของ [sc_loser.GetHerHis|U] ส่วนใหญ่พลาดเป้า และส่วนที่ไม่พลาดก็ถูกปัดป้องได้ง่าย หรือกระเด็นออกจาก [sc_victor.Custom('signature_weapon')] ของข้า ทำให้ [sc_loser.GetFirstNameNoTooltip] เสียหลักอย่างรวดเร็ว\n\nเมื่อ [sc_loser.GetSheHe] เผลอตบ [sc_loser.Custom('MaskFace')] ของ [sc_loser.GetHerselfHimself] ด้วยมือที่แกว่งไปมาของ [sc_loser.GetHerHis] เอง ข้าจึงสงสารและปัดอาวุธออกจากมือ [sc_loser.GetHerHis]\n\nการยอมจำนนเกิดขึ้นอย่างรวดเร็ว"
 single_combat.0041.desc.opponent_response.pocket_sand.injury:0 "[sc_loser.GetSheHe|U] ยุ่งอยู่กับการสำลักเกินกว่าจะสังเกตเห็นหรือหลีกเลี่ยง [sc_victor.Custom('SignatureWeaponEndType')] ของ [sc_victor.Custom('signature_weapon')] ข้าขณะข้าฟาดมันเข้าที่คอของ [sc_loser.GetHerHis] และล้มลงไปใน [sc_defender.Custom('GroundType')] ทันที\n\nข้าปล่อยให้อาวุธข้าวางอยู่บนท้องของ [sc_loser.GetFirstNamePossessiveNoTooltip] อย่างนุ่มนวล รออย่างอดทนให้ [sc_loser.GetHerHim] สังเกตเห็นและยอมแพ้ ใช้เวลาไม่นาน"
 single_combat.0041.desc.opponent_response.nut_em.injury:0 "โดยไม่คิดซ้ำสอง ข้ากระแทกเข่าเข้าที่ท้องของ [sc_loser.GetHerHis] และเจ้าโง่ก็ทรุดลง\n\nต้องให้เครดิต [sc_loser.GetHerHis] [sc_loser.GetFirstNameNoTooltip] ลงพื้นได้ดีเท่าที่คาดไว้ และกำลังตะเกียกตะกายลุกขึ้นยืนเมื่อข้าเหวี่ยงตัวตามหลัง [sc_loser.GetHerHim] ไป\n\nการเตะอย่างรุนแรงสองสามครั้งและ [sc_victor.Custom('signature_weapon')] ข้ากดลงที่กระดูกสันหลังของ [sc_loser.GetHerHis] ก็โน้มน้าวให้ [sc_loser.GetHerHim] อยู่นิ่งๆ และยอมแพ้"
 single_combat.0041.desc.opponent_response.guard.injury:0 "เปิดช่องว่างขนาดพอเหมาะในการป้องกันของ [sc_loser.GetHerHis]\n\nจากนั้น มันก็เป็นเพียงการระดม [sc_victor.Custom('SignatureWeaponAttemptedLightPlural')] เล็กน้อยก่อนที่ข้าจะสามารถปัด [sc_loser.Custom('signature_weapon')] ออกจากมือของ [sc_loser.GetHerHis] ได้\n\nข้าเตรียมพร้อมสำหรับการสังหาร แต่ [sc_loser.GetFirstNameNoTooltip] ยอมแพ้ก่อนที่จะจำเป็น"
 single_combat.0041.desc.opponent_response.probing_attack.injury:0 "ฉีก [sc_loser.Custom('signature_weapon')] ออกจากมือของ [sc_loser.GetHerHis] อาวุธลอยไปในอากาศอย่างสวยงาม เหลือเพียงข้า [sc_loser.GetFirstNameNoTooltip] และ #EMP [sc_victor.Custom('signature_weapon')]#! ของข้า\n\nการยอมแพ้มาทันทีที่ข้าขยับแขน"
 single_combat.0041.desc.opponent_response.onslaught.injury:0 "ปล่อยให้ [sc_loser.Custom('signature_weapon')] ของศัตรูข้าฟันอากาศที่ไร้แรงเสียดทาน ข้าเตะเข้าที่หลังเข่าของ [sc_loser.GetFirstNamePossessiveNoTooltip] และผลัก ต่อยเข้าที่กรามของ [sc_loser.GetHerHim] อย่างจังเมื่อ [sc_loser.GetSheHe] เหวี่ยงตัวกลับมาเผชิญหน้าข้าอย่างไม่ระมัดระวัง\n\nเมื่อ [sc_loser.GetFirstNameNoTooltip] โซเซ สิ่งที่ต้องทำคือ [sc_loser.Custom('SignatureWeaponAttemptedHeavy')] เพื่อส่งอาวุธของ [sc_loser.GetHerHis] ลอยไป ข้าให้เวลา [sc_loser.GetWomanMan] สองสามวินาทีเพื่อรวบรวมสติ [sc_loser.GetHerselfHimself] ก่อนที่ [sc_loser.GetSheHe] จะยอมแพ้"
 single_combat.0041.desc.opponent_response.surprise_attack.injury:0 "แทนที่จะตามด้วยการโต้กลับ ข้ากระแทกเข่าเข้าที่ท้องของ [sc_loser.GetFirstNamePossessiveNoTooltip] ทำให้ [sc_loser.GetHerHim] งอตัวลงขณะที่อากาศถูกบังคับออกจากปอดของ [sc_loser.GetHerHis]\n\nนี่ ทำให้ข้าเห็นหลังศีรษะศัตรูข้า และข้าก็เชื่อมโยงการโจมตีท้องเข้ากับการศอกอย่างรุนแรงที่หลังศีรษะ\n\n[sc_loser.GetFirstNameNoTooltip] ทรุดลงไปใน [sc_defender.Custom('GroundType')] ข้าเกือบจะประหลาดใจที่ [sc_loser.GetSheHe] สามารถเปล่งเสียงยอมแพ้ออกมาได้โดยไม่อาเจียน"
 single_combat.0041.desc.opponent_response.taunt.injury:0 "มันได้ผลพอๆ กับที่มันจำเป็น ทิ้งให้คู่ต่อสู้ข้ามึนงงอยู่บนพื้น\n\nการยอมแพ้ที่มึนงงเล็กน้อยตามมาในไม่ช้า"
 single_combat.0041.desc.opponent_response.put_the_boot_in.injury:0 "\n\n[sc_loser.GetWomanMan] พยายามโซเซลุกขึ้น แต่การโจมตีอย่างรวดเร็วจาก [sc_victor.Custom('signature_weapon')] ข้ากด [sc_loser.GetHerHim] ลง ข้าเปล่งเสียงเยาะเย้ยออกมาให้ [sc_loser.GetHerHim] รู้ว่าเวลาของ [sc_loser.GetHerHis] หมดลงแล้ว และได้รับการยอมแพ้ที่อู้อี้เป็นการตอบแทน"
 single_combat.0041.desc.opponent_response.strict_guard.injury:0 "ทะลวงผ่านด้วย [sc_victor.Custom('SignatureWeaponAttemptedLight')] กด [sc_victor.Custom('SignatureWeaponTipType')] ของ [sc_victor.Custom('signature_weapon')] ข้าขึ้นมาที่คอของ [sc_loser.GetHerHis]\n\nเราทั้งคู่แข็งทื่ออยู่นานเกินไปขณะที่ [sc_loser.GetFirstNameNoTooltip] ประเมินทางเลือกของ [sc_loser.GetHerHis] ต้องใช้สายตาเบิกกว้างและการกระตุกกะทันหันเพื่อบังคับให้ยอมแพ้จาก [sc_loser.GetWomanMan] ที่ดื้อรั้น"
 single_combat.0041.desc.opponent_response.confident_attack.injury:0 "สามารถปัดป้องได้อย่างแรงพอที่จะผลักอาวุธของ [sc_loser.GetHerHis] เองกลับไปที่ [sc_loser.GetHerHim]\n\nเพื่อที่จะหลบ [sc_loser.Custom('signature_weapon')] ของ [sc_loser.GetHerHis] เอง [sc_loser.GetFirstNameNoTooltip] ต้องวาง [sc_loser.GetHerselfHimself] ไว้ในเส้นทางของ [sc_victor.Custom('signature_weapon')] ข้าเอง มันแทบจะไม่ใช่การโจมตีที่ถึงแก่ชีวิต แต่ถึงกระนั้นมันก็ ทำให้ [sc_loser.GetHerHim] ล้มลง\n\nเมื่ออาวุธของ [sc_loser.GetHerHis] หายไปในการล้ม [sc_loser.GetFirstNameNoTooltip] ก็ไม่มีทางเลือกอื่นนอกจากยอมแพ้"
 single_combat.0041.desc.opponent_response.expert_onslaught.injury:0 "ข้าสามารถโจมตีเข้าที่ขมับของ [sc_loser.GetHerHis] อย่างสิ้นหวังด้วย [sc_victor.Custom('SignatureWeaponEndType')] ของ [sc_victor.Custom('signature_weapon')] ข้า\n\n[sc_loser.GetFirstNameNoTooltip] โซเซถอยหลัง ตาบอดชั่วขณะ เปิดโอกาสให้ข้าปัด [sc_loser.Custom('signature_weapon')] ของ [sc_loser.GetHerHis] ออกไปด้วย [sc_victor.Custom('SignatureWeaponAttemptedHeavy')]\n\nเมื่อไม่มีอาวุธเหลือ คู่ต่อสู้ข้าก็ตกอยู่ในความเมตตาข้า และ [sc_loser.GetSheHe] ก็รู้ดี การยอมแพ้อันขมขื่นเป็นของข้าในชั่วขณะ"
 single_combat.0041.desc.opponent_response.attempt_disarm.injury:0 "มันใช้แรงบิดเพียงเล็กน้อยจากข้าเพื่อส่ง [sc_loser.Custom('signature_weapon')] ของ [sc_loser.GetHerHis] ลอยไปเหมือนลูกศรขนาดใหญ่ที่น่าขัน\n\nการยอมแพ้ที่น่าอับอายมาทันทีที่ [sc_loser.GetFirstNameNoTooltip] ประมวลผลสิ่งที่เพิ่งเกิดขึ้น"
 ### No need for a lightning_assault, as you can't end the duel in the first round.
 single_combat.0041.desc.opponent_response.tire_opponent.injury:0 "เสียสมดุล [sc_loser.GetFirstNameNoTooltip] สะดุดและหมุนคว้างลงไปใน [sc_defender.Custom('GroundType')]\n\nอยู่เหนือคู่ต่อสู้ข้า ข้าปล่อยการระดม [sc_victor.Custom('SignatureWeaponAttemptedLightPlural')] [sc_victor.Custom('signature_weapon')]\n\nคู่ต่อสู้ข้ายังคงแน่วแน่ในตอนแรก เพียงยอมแพ้เมื่อเป็นที่ชัดเจนว่าข้ากำลังจะ [sc_victor.Custom2('SignatureWeaponKillTypeGroinThirdPersonFutureGendered',SCOPE.sC('sc_loser'))]"
 single_combat.0041.desc.opponent_response.reason_you_suck_speech.injury:0 "ก้าวไปข้างหน้า ข้าทุบเข้าที่คอของ [sc_loser.GetHerHim] ด้วย [sc_victor.Custom('SignatureWeaponEndType')] ของอาวุธข้า [sc_loser.GetFirstNameNoTooltip] เริ่มสำลักทันที พยายามบังคับอากาศผ่านหลอดลมที่เพิ่งถูกปิดด้วยมือ\n\nหลังจากนั้น มันง่ายพอที่จะง้างสำหรับการโจมตีที่เห็นได้ชัดว่าจะ [sc_victor.Custom2('SignatureWeaponKillTypeThirdPersonFutureGendered',SCOPE.sC('sc_loser'))] และบังคับให้ยอมแพ้"
 single_combat.0041.desc.opponent_response.technique_from_legend.injury:0 "ชั่วขณะหนึ่ง ข้ายืนสับสน ไม่แน่ใจว่าเกิดอะไรขึ้น จนกระทั่งข้าได้ยินเสียงดังแคร๊งข้างหลังข้าและคิดออก\n\n[sc_loser.GetFirstNameNoTooltip] เปลี่ยนท่าทางอย่างน่าทึ่ง และ #EMP อย่างมาก#! สะเปะสะปะ จน [sc_loser.GetSheHe] ทำ #EMP เสีย#! [sc_loser.Custom('signature_weapon')] ของ [sc_loser.GetHerHis] ไปในกระบวนการ\n\nแทบไม่สามารถกลั้นเสียงหัวเราะดังลั่นข้าได้ ข้าเพียงแค่แกว่งอาวุธตัวเองเล็กน้อยเพื่อกระตุ้นให้ยอมแพ้"
 single_combat.0041.desc.opponent_response.like_a_viper.injury:0 "กระทำตามสัญชาตญาณ ข้าเอนตัวเข้าหาการโจมตีด้วยกำลังทั้งหมดข้า เพียง #EMP แทบจะ#! จัดการเบี่ยงเบนการโจมตีให้เฉี่ยวไหล่ข้าไป และตามด้วยเข่าอย่างรวดเร็วเข้าที่ท้อง\n\n[sc_loser.GetFirstNameNoTooltip] ทรุดลง ลมหายใจข้าออกมาสั้นๆ หอบๆ สมองยังคงประมวลผลการเฉียดตายตามตัวอักษรข้า แต่ข้ายังคงสามารถกด [sc_victor.Custom('signature_weapon')] ข้าลงที่คอหอยของ [sc_loser.GetHerHis] ก่อนที่ [sc_loser.GetSheHe] จะฟื้นตัวได้\n\nการประลองนี้เป็นของข้า"
 single_combat.0041.desc.opponent_response.pocket_silver.injury:0 "ข้าพุ่งเข้าโจมตีทันที ปลดปล่อย [sc_victor.Custom('SignatureWeaponAttemptedHeavy')] ที่กระชาก [sc_loser.Custom('signature_weapon')] ออกจากมือของ [sc_loser.GetHerHis]\n\n[sc_loser.GetFirstNameNoTooltip] ยืนตกตะลึง เบาๆ [sc_loser.GetSheHe] บ้วนเหรียญเงินเหรียญเดียวออกมา และส่งการยอมแพ้"
 single_combat.0041.desc.opponent_response.martial_voice.injury: "เมื่อนั้น และเมื่อนั้นเท่านั้น ข้าจึงพุ่งไปข้างหน้าด้วย [sc_victor.Custom('SignatureWeaponAttemptedHeavy')] ที่ฟาด[sc_loser.GetHerHim]จนล้มลงบนก้นของ[sc_loser.GetHerHis]\n\nแม้จะมึนงง [sc_loser.GetFirstNameNoTooltip] ก็ดูเหมือนจะเต็มใจสู้ต่อในตอนแรก ทว่าเมื่อเป็นที่ชัดเจนว่าข้ากำลังจะ [sc_victor.Custom2('SignatureWeaponKillTypeHeadThirdPersonFutureGendered',SCOPE.sC('sc_loser'))], [sc_loser.GetSheHe]ก็ยอมจำนน"
 single_combat.0041.desc.opponent_response.mocking_boast.injury:0 "โจมตีด้วย [sc_victor.Custom('SignatureWeaponAttemptedLight')] ตรงเข้าที่หน้าอกของ [sc_loser.GetHerHis]\n\nเมื่อลมถูกกระแทกออกจาก [sc_loser.GetHerHim] [sc_loser.GetFirstNameNoTooltip] ก็ไม่สามารถต่อสู้ได้มากนักเมื่อข้าปัด [sc_loser.Custom('signature_weapon')] ของ [sc_loser.GetHerHis] ออกไปด้วยการโจมตีครั้งต่อไปข้า\n\nการยอมแพ้ที่ตามมานั้นมีทั้งความนอบน้อมและความขมขื่นเท่าๆ กัน"
 ### No need for an is_that_a_crocodile, as it's never just an injury.
 single_combat.0041.desc.opponent_response.desert_warrior.injury:0 "ข้าปล่อยการระดม [sc_victor.Custom('SignatureWeaponAttemptedLightPlural')] ทำให้คู่ต่อสู้ข้าประหลาดใจมากจน [sc_loser.GetSheHe] สะดุดหน้าคว่ำลงไปใน [sc_defender.Custom('GroundType')]\n\nปัก [sc_victor.Custom('signature_weapon')] ข้าลงที่คอของ [sc_loser.GetHerHis] ทำให้ข้าได้รับการยอมแพ้ที่อู้อี้ค่อนข้างเร็ว"
 single_combat.0041.desc.opponent_response.jungle_stalker.injury:0 "ฉวยโอกาส ข้าส่ง [sc_loser.Custom('signature_weapon')] ของศัตรูให้กลิ้งหายไปในพงหญ้าด้วย [sc_victor.Custom('SignatureWeaponAttemptedLight')] ที่เสี่ยงอันตราย จากนั้นจึงเหวี่ยงตัวเข้าตำแหน่งเพื่อ [sc_victor.Custom2('SignatureWeaponKillTypeThirdPersonFutureGendered',SCOPE.sC('sc_loser'))]\n\n[sc_loser.GetFirstNameNoTooltip] ยอมจำนนทันที"
 single_combat.0041.desc.opponent_response.open_terrain_expert.injury:0 "[sc_loser.GetSheHe|U] ไม่สงสัยอะไรเลย และสะดุดตรงตามที่ข้าหวังไว้\n\n[sc_victor.Custom('SignatureWeaponAttemptedLight')] ที่วางไว้อย่างระมัดระวังเปลี่ยนการสะดุดเป็นการล้มอย่างเต็มที่ [sc_loser.Custom('signature_weapon')] ของ [sc_loser.GetHerHis] ลอยออกไปขณะ [sc_loser.GetSheHe] ล้ม\n\nรองเท้าบู๊ตข้าเหยียบที่คอของ [sc_loser.GetHerHis] เปลี่ยนการล้มเป็นการยอมแพ้"
 single_combat.0041.desc.opponent_response.rough_terrain_expert.injury.rocky:0 "แต่ข้าก็เกือบจะยืนหยัดอยู่ได้\n\nเมื่อโอกาสมาถึงสำหรับการโต้กลับ ข้าก็คว้ามันไว้ ผลัก [sc_loser.GetFirstNameNoTooltip] ขึ้นเนินด้วย [sc_victor.Custom('SignatureWeaponAttemptedLight')]\n\nมันไม่มากนัก สำหรับการล้ม แต่ [sc_loser.GetSheHe] ก็คว่ำหน้าพอที่ข้าจะ [sc_victor.Custom2('SignatureWeaponKillTypeThirdPersonFutureGendered',SCOPE.sC('sc_loser'))] ได้ง่ายๆ\n\nข้าได้รับการยอมแพ้"
 single_combat.0041.desc.opponent_response.rough_terrain_expert.injury.boggy:0 "โชคดีที่ ทั้งการเบี่ยงเบนความสนใจและสถานการณ์ ทำให้การปลดอาวุธ [sc_loser.GetHerHim] ง่ายเกือบจะน่าขัน โดยเฉพาะอย่างยิ่งเมื่อเทียบกับการต่อสู้ระยะประชิดก่อนหน้านี้\n\nการยอมแพ้ไม่เคยหอมหวานเท่านี้มาก่อน"
 single_combat.0041.desc.opponent_response.forest_fighter.injury:0 "ใช้เวลาพิเศษที่สำคัญในการเล็ง ข้าปลดปล่อย [sc_victor.Custom('SignatureWeaponAttemptedHeavy')] ที่เกือบจะ ทำให้คู่ต่อสู้ข้าหมดสติ\n\nล้มลงกับพื้น มันง่ายพอที่จะเตะ [sc_loser.Custom('signature_weapon')] ของ [sc_loser.GetHerHis] เข้าไปในพุ่มไม้ ความเข้าใจเริ่มกลับคืนสู่ [my_foe.Custom('EyeEyes')] ของ [sc_loser.GetFirstNamePossessiveNoTooltip] ทันทีหลังจากข้ากด [sc_victor.Custom('SignatureWeaponTipType')] [sc_victor.Custom('SignatureWeaponTipAdjective')] ของอาวุธข้าลงที่เส้นเลือดใหญ่ของ [sc_loser.GetHerHis] และการยอมแพ้ก็มาอย่างรวดเร็ว"
 single_combat.0041.desc.opponent_response.raaargh.injury:0 "แม้ [sc_loser.GetHerHis] จะโกรธเกรี้ยว [sc_loser.GetSheHe] ก็ไม่ได้ #EMP ยาก#! ขนาดนั้นที่จะหลบ: ความโกรธที่มากเกินไปก็สร้างการขาดความคล่องแคล่ว เช่นกัน และการถอยห่างก็เป็นทางเลือกในการประลอง ซึ่งไม่ใช่ในการต่อสู้ระยะประชิดที่วุ่นวาย\n\nเมื่อ [sc_loser.GetFirstNameNoTooltip] โผล่ออกมาจากภวังค์ มันเกือบจะเป็นจุดจบที่ไม่น่าตื่นเต้น ที่ไหนสักแห่งในความโกรธของ [sc_loser.GetHerHis] [sc_loser.GetSheHe] ดูเหมือนจะทำ [sc_loser.Custom('SignatureWeaponTipType')] ของ [sc_loser.GetHerHis] [sc_loser.Custom('SignatureWeaponBreaksVerbPastTense2')] เสียแล้ว การยอมแพ้ถูกเปล่งออกมาผ่านฟันที่กัดแน่น"
 single_combat.0041.desc.opponent_response.hard_grit.injury:0 "กดดันการโจมตี\n\nมันเป็นการต่อสู้แห่งเจตจำนงและรายละเอียดเล็กน้อยที่เหน็ดเหนื่อยและอ่อนล้า แต่ในที่สุดข้าก็สามารถ ทำให้ [sc_loser.Custom('ShieldPersonFemaleMale')] ล้มลงกับพื้นและปลดอาวุธ [sc_loser.GetHerHim] ได้ในคราวเดียวกัน\n\nการยอมแพ้นั้นไม่เต็มใจ แต่ให้ความเคารพ"
 single_combat.0041.desc.opponent_response.feint_and_stab.injury:0 "คิดอย่างรวดเร็ว ข้าฟาด [sc_victor.Custom('SignatureWeaponEndType')] ของ [sc_victor.Custom('signature_weapon')] ข้าเข้าที่มืออีกข้างของ [sc_victor.GetHerHis] ในจังหวะเหวี่ยงกลับ ส่งใบมีดที่ซ่อนอยู่ลอยออกไป\n\nไม่ต้องการเสี่ยงกับกลอุบายอีก ข้าเคลื่อนตัวไปที่ [sc_victor.Custom2('SignatureWeaponKillTypeGroinThirdPersonFutureGendered',SCOPE.sC('sc_loser'))] [sc_loser.GetFirstNameNoTooltip] หลีกเลี่ยงความตายอันยุ่งเหยิงได้อย่างหวุดหวิดด้วยการยอมแพ้ที่เร็วที่สุดครั้งหนึ่งที่ข้าเคยเห็น"
 single_combat.0041.desc.opponent_response.butchery.injury:0 "กลาง [sc_loser.Custom('SignatureWeaponAttemptedHeavy')] ที่โอ้อวดเป็นพิเศษครั้งหนึ่ง ข้าก้าวเข้าไปในวงป้องกันของ [sc_loser.GetFirstNamePossessiveNoTooltip] ได้อย่างง่ายดายและฉีก [sc_loser.Custom('signature_weapon')] ออกจากมือของ [sc_loser.GetHerHis] ด้วย [sc_victor.Custom('SignatureWeaponAttemptedLight')] เพียงครั้งเดียว\n\n[sc_loser.GetSheHe|U] พยายามอย่างสิ้นหวังที่จะรักษาออร่าที่น่าเกรงขามไว้ แต่มันก็ไร้ผลเมื่อข้ายังมี [sc_victor.Custom('signature_weapon')] ข้าอยู่\n\nเมื่อ [sc_loser.GetSheHe] ยอมแพ้ ข้าก็ไม่อายที่จะพบว่ามัน #EMP น่าพอใจ#! อย่างเหลือเชื่อ"
 single_combat.0041.desc.opponent_response.stoic_veteran.injury:0 "การประลองของเรากลายเป็นการแข่งขันความอดทน แต่ละฝ่ายต่างต้องการให้อีกฝ่ายแตกหักก่อน โชคดีสำหรับข้า [sc_loser.GetFirstNameNoTooltip] พลาดท่าก่อนข้า เปิดโอกาสให้ [sc_loser.GetHerselfHimself] โดนโต้กลับ ซึ่งส่ง [sc_loser.Custom('signature_weapon')] ของ [sc_loser.GetHerHis] ลื่นไถลออกไป\n\nสงบนิ่งแม้ในความพ่ายแพ้ กล้ามเนื้อของ [sc_loser.GetHerHis] ผ่อนคลายและ [sc_loser.GetSheHe] ก็ยอมแพ้ทันที"
 single_combat.0041.desc.opponent_response.blade_dance.injury:0 "อาวุธของ [sc_loser.GetHerHis] โค้งออกไปไกลเกินเอื้อม\n\nไม่ว่าจะเป็นจ้าวแห่ง [sc_loser.Custom('signature_weapon')] หรือไม่ ความตื่นตระหนกก็ยังแผ่กระจายไปทั่วใบหน้าของ [sc_loser.GetFirstNamePossessiveNoTooltip] เมื่อ [sc_loser.GetSheHe] ตระหนักว่า [sc_loser.GetSheHe] ไม่มีอาวุธ\n\nให้เวลาคู่ต่อสู้ข้าเล็กน้อยเพื่อประมวลผลสิ่งที่เพิ่งเกิดขึ้น ข้าเพียงแค่โพสท่าอย่างอวดดีกับ [sc_victor.Custom('signature_weapon')] ข้า การยอมแพ้ที่ตามมาถูกเปล่งออกมาด้วยความไม่เชื่ออย่างแท้จริง"
 single_combat.0041.desc.opponent_response.wrath_of_highgod.injury:0 "เตะเข้าที่เป้าของ [sc_loser.GetHerHim] อย่างจัง\n\nคำสวดภาวนาที่ตะโกนของ [sc_loser.GetFirstNamePossessiveNoTooltip] กลายเป็นเสียงร้องแหลม และ [sc_loser.GetSheHe] ก็ทรุดลงไปกองกับพื้นพร้อมแขนขาที่สะบัดไปมา กอง [sc_loser.GetWomanMan] ที่โกรธเกรี้ยวครึ่งหนึ่งส่งเสียงฟ่อ ครึ่งหนึ่งกรีดร้องตำหนิสำหรับการดูหมิ่นข้า แต่ข้าเพียงแค่วาง [sc_victor.Custom('signature_weapon')] ข้าลงข้าง [sc_loser.Custom('MaskFace')] ของ [sc_loser.GetHerHis] และรอให้ [sc_loser.GetFaith.HighGodName] ลงโทษข้า\n\nความยุติธรรมจากสวรรค์ไม่เคยมาถึง แต่การยอมแพ้อย่างโกรธเกรี้ยวมาถึงอย่างแน่นอน"
 single_combat.0041.desc.opponent_response.hurt_me_better.injury:0 "และข้าเกือบจะรู้สึกสงสารขณะปัด [sc_loser.Custom('signature_weapon')] ออกจากมือของ [sc_loser.GetHerHis]\n\nต้องใช้การกระตุ้นพอสมควร เพื่อให้ [sc_loser.GetFirstNameNoTooltip] มีสมาธิพอสำหรับการยอมแพ้อย่างเป็นทางการ แต่เราก็ทำได้"
 single_combat.0041.desc.opponent_response.special_fallback.injury:0 "เห็นจุดที่ดีที่จะจบการประลอง ข้ากระทืบเข้าที่กองที่ล้มลงนั้น เตะอย่างบ้าคลั่ง จนกระทั่งข้าได้ยินเสียงยอมแพ้ที่ขาดห้วง"
 single_combat.0041.desc.opponent_response.something_to_hide.injury:0 "ทรุดลงกับพื้นอย่างมึนงง อาเจียนตลอดเวลา\n\nข้าเตะ [sc_loser.Custom('signature_weapon')] ออกจากมือของ [sc_loser.GetHerHis] และ [sc_loser.GetSheHe] ก็เปล่งเสียงยอมแพ้ออกมา #EMP ทันที#! "

 ## Defender Lost, Opponent Finishing Move Fatality
 single_combat.0041.desc.opponent_response.wait_and_hope.fatality:1 "การโจมตีโดนคอคู่ต่อสู้ข้า ฉีกเป็นแผลเหวอะหวะเปื้อนเลือดช้ำในคอหอยของ [sc_loser.GetHerHis] เลือดสีแดงสดเริ่มไหลทะลักออกจากบาดแผล ใบหน้าของ [sc_loser.GetFirstNamePossessiveNoTooltip] ก้มลงมองด้วยความสยดสยองขณะที่ชีวิตของ [sc_loser.GetHerHis] ไหลออกจากคอและลงมาที่หน้าอกของ [sc_loser.GetHerHis]\n\n[sc_loser.GetFirstNameNoTooltip] ทรุดลงคุกเข่า ไม่นานนัก [sc_loser.GetSheHe] ก็แน่นิ่งไป"
 single_combat.0041.desc.opponent_response.unsure_attack.fatality:0 "เนื่องจาก [sc_loser.GetSheHe] ดูเหมือนจะยังคงพยายามคิดอยู่ ข้าจึงเสี่ยงพุ่งเข้าใส่อย่างรวดเร็ว [sc_victor.Custom('SignatureWeaponAttemptedLight')] โดนจุดอ่อนในหน้าอกของ [sc_loser.GetHerHis] [sc_victor.Custom2('SignatureWeaponKillTypeTorso2ThirdPersonPresentParticipleGendered',SCOPE.sC('sc_loser'))] ในแนวทแยงและทะลุเข้าไปลึกในช่องอกของ [sc_loser.GetWomanMan]\n\n[sc_loser.GetFirstNameNoTooltip] แข็งทื่อทันที การเคลื่อนไหวทั้งหมดหายไปในความโกลาหลของความทรมานที่ต้องกำลังกัดกิน [sc_loser.GetHerHim]\n\nเมื่อข้าดึง [sc_victor.Custom('signature_weapon')] ข้าหลุดออกมา [sc_loser.GetSheHe] ก็จากไปแล้ว และศพของ [sc_loser.GetHerHis] ก็ล้มลงไปใน [sc_defender.Custom('GroundType')] อย่างงุ่มง่าม"
 single_combat.0041.desc.opponent_response.enthusiastic_onslaught.fatality:0 "ข้าเผชิญหน้ากับการพุ่งเข้าใส่ด้วย [sc_victor.Custom('SignatureWeaponAttemptedLight')] ที่คำนวณมาอย่างดี ซึ่งโดนหน้าอกคู่ต่อสู้ข้า [sc_victor.Custom2('SignatureWeaponKillTypeTorsoThirdPersonPresentParticipleGendered',SCOPE.sC('sc_loser'))] ก่อนที่จะฉีกออกไปพร้อมกับเศษกระดูกและริ้วเนื้อที่เปื้อนเลือด\n\n[sc_loser.GetFirstNameNoTooltip] หมุนตัว ส่วนใหญ่เกิดจากแรงเหวี่ยงมากกว่าสิ่งอื่นใด หมุนลงไปกองพันกัน ความตกตะลึงยังคงปะปนกับความเจ็บปวดในการกระตุกอย่างสิ้นหวังของ [sc_loser.GetHerHis] การเคลื่อนไหวที่กระตุก แต่ละครั้งครึ่งหนึ่งไขว่คว้าหาทางออก ขณะที่หัวใจของ [sc_loser.GetHerHis] เต้นเป็นครั้งสุดท้าย"
 single_combat.0041.desc.opponent_response.hail_mary.fatality:0 "ข้าไม่เสี่ยง หมุนตัวหลบการโจมตีครั้งแรกและเหวี่ยง [sc_victor.Custom('signature_weapon')] ข้ากลับไปเพื่อ [sc_victor.Custom2('SignatureWeaponKillTypeRearTorsoThirdPersonFutureGendered',SCOPE.sC('sc_loser'))] ด้วย [sc_victor.Custom('SignatureWeaponAttemptedHeavy')]\n\nอัมพาตเกิดขึ้นทันที คู่ต่อสู้ข้าล้มลงไปใน [sc_defender.Custom('GroundType')] ขณะที่ขาของ [sc_loser.GetHerHis] สูญเสียการทำงาน ข้าเตะ [sc_loser.GetHerHim] ให้นอนหงาย พยักหน้าให้ [sc_loser.GetWomanMan] เป็นครั้งสุดท้ายเพื่อเป็นการยอมรับก่อนที่จะ [sc_victor.Custom2('SignatureWeaponKillTypeThirdPersonPresentParticipleGendered',SCOPE.sC('sc_loser'))]"
 single_combat.0041.desc.opponent_response.pocket_sand.fatality:0 "ไม่ปล่อยให้โอกาสหลุดลอย ข้าฟาด [sc_victor.Custom('signature_weapon')] ข้าเข้าที่หน้าอกของ [sc_loser.GetHerHis] [sc_victor.Custom2('SignatureWeaponKillTypeTorsoThirdPersonPresentParticipleGendered',SCOPE.sC('sc_loser'))] ในการเคลื่อนไหวอย่างรวดเร็วครั้งเดียว\n\nคู่ต่อสู้ข้าโซเซถอยหลัง เลือดพุ่งกระเซ็นออกมาจากลำตัวที่พังยับเยินของ [sc_loser.GetHerHis] อย่างผิดปกติ\n\nข้ากระชากอาวุธออกจากร่างของ [sc_loser.GetFirstNamePossessiveNoTooltip] สำหรับการปลิดชีพ: [sc_loser.GetSheHe] ตายแล้ว ไม่จำเป็นต้องยืดเยื้อ"
 single_combat.0041.desc.opponent_response.nut_em.fatality:0 "กล้าหาญ แต่ [sc_victor.GetFaith.WarGodName] ให้รางวัลแก่ความระมัดระวัง ข้ายก [sc_victor.Custom('signature_weapon')] ข้าขึ้นสำหรับ [sc_victor.Custom('SignatureWeaponAttemptedLight')] ที่ [sc_victor.Custom2('SignatureWeaponKillTypeHead2ThirdPersonActiveGendered',SCOPE.sC('sc_loser'))]\n\n#EMP การระเบิด#! ของเลือดที่ตามมาถูกตอบรับด้วยเสียงกรีดร้องครึ่งหนึ่ง เสียงครืดคราดครึ่งหนึ่งที่น่าฝันร้ายจาก [sc_loser.GetFirstNameNoTooltip] ผู้ ซึ่งยังคงโซเซไปข้างหน้า\n\nขณะที่ [sc_loser.Custom('signature_weapon')] ของ [sc_loser.GetHerHis] อยู่ในมือ ข้าไม่สามารถเสี่ยงเข้าไปสังหารเพื่อความเมตตาได้ แทนที่จะเป็น เช่นนั้น [sc_loser.GetFirstNameNoTooltip] และข้าเพียงแค่จ้องหน้ากัน จนกระทั่งกระแสเลือดที่ไหลทะลักพรากแสงสว่างไปจาก [my_foe.Custom('EyeEyes')] ของ [sc_loser.GetHerHis]"
 single_combat.0041.desc.opponent_response.guard.fatality:0 "โจมตีด้วย [sc_victor.Custom('SignatureWeaponAttemptedHeavy')] ที่ฉีกเข้าที่ต้นขาด้านในของ [sc_loser.GetHerHis] ฉีกผ่านหลอดเลือดแดง\n\nด้วยพลังจากอะดรีนาลีน [sc_loser.GetFirstNameNoTooltip] ต่อสู้ต่อไปเป็นเวลายี่สิบถึงสามสิบวินาทีก่อนที่การเสียเลือดจะเริ่มส่งผล\n\n[sc_loser.GetSheHe|U] ไม่เห็นสิ่งที่เกิดขึ้นในตอนแรก และมองลงไปพบว่า [sc_loser.GetHerselfHimself] เปียกโชกไปด้วยเลือดของ [sc_loser.GetHerHis] เองมากขึ้นเรื่อยๆ ความไม่เชื่อเปิดทางให้ความง่วง และคู่ต่อสู้ข้าก็ล้มลงกับพื้นอย่างไม่สง่างาม การปลิดชีพ [sc_loser.GetHerHim] นั้นรวดเร็วและไม่เจ็บปวด"
 single_combat.0041.desc.opponent_response.probing_attack.fatality:0 "[sc_loser.Custom('signature_weapon')] ของ [sc_loser.GetHerHis] [sc_loser.Custom('SignatureWeaponBreaksVerbPastTense')]\n\nจากนั้น มันก็เป็นเพียงการระดม [sc_loser.Custom('SignatureWeaponAttemptedLightPlural')] จนกระทั่งข้าสามารถ [sc_victor.Custom2('SignatureWeaponKillTypeThirdPersonFutureGendered',SCOPE.sC('sc_loser'))]\n\nมันไม่ใช่ความตายที่รวดเร็ว"
 single_combat.0041.desc.opponent_response.onslaught.fatality:0 "ตามด้วย [sc_loser.Custom('SignatureWeaponAttemptedHeavy')] เข้าที่หลังเข่าของ [sc_loser.GetHerHis] ซึ่ง ทำให้ [sc_loser.GetHerHim] ล้มลงกับพื้นตามสัญชาตญาณ\n\nการเคลื่อนเท้าอย่างชาญฉลาด ทำให้ข้าอยู่ข้างหลังคู่ต่อสู้ข้าขณะที่ [sc_loser.GetSheHe] โซเซลุกขึ้นยืน และด้วยการโจมตีที่วางไว้อย่างดี ข้าก็ [sc_victor.Custom2('SignatureWeaponKillTypeRearHeadThirdPersonPresentGendered',SCOPE.sC('sc_loser'))]\n\n[sc_loser.GetFirstNameNoTooltip] ตายทันที"
 single_combat.0041.desc.opponent_response.surprise_attack.fatality:0 "\n\nการโต้กลับข้าฉีก [sc_loser.Custom('signature_weapon')] ออกจากมือของ [sc_loser.GetHerHis] และ [sc_loser.GetFirstNameNoTooltip] ก็แข็งทื่อด้วยความตื่นตระหนก\n\nนั่นผนึกชะตากรรมของ [sc_loser.GetWomanMan] ขณะที่ข้า [sc_victor.Custom('SignatureWeaponWoundVerb5')] [sc_loser.Custom('signature_weapon')] ข้าเข้าที่ไหล่ของ [sc_loser.GetHerHis] บางสิ่งที่สำคัญฉีกขาด และ [sc_loser.GetFirstNameNoTooltip] ก็อ่อนปวกเปียกในทันที\n\n[sc_loser.GetSheHe|U] ตายก่อนที่ [sc_loser.GetSheHe] จะกระแทก [sc_defender.Custom('GroundType')]"
 single_combat.0041.desc.opponent_response.taunt.fatality:0 "มันโดนเข้าที่ลำตัวเขา แรงกว่าที่ข้าคาดไว้ และข้าก็อาบไปด้วยฝนของเครื่องในและซี่โครงที่แตกละเอียด\n\n[sc_loser.GetFirstNameNoTooltip] ไม่เคยไปถึงการเยาะเย้ยได้เลย [sc_loser.GetSheHe|U] เพียงแค่เปลี่ยนน้ำหนักและโซเซไปสองสามก้าว จนกระทั่งล้มลงตาย"
 single_combat.0041.desc.opponent_response.put_the_boot_in.fatality:0 "อยู่ในการโจมตี ข้า [sc_victor.Custom2('SignatureWeaponKillTypeTorso2ThirdPersonSimplePresentGendered',SCOPE.sC('sc_loser'))] ด้วยการโจมตีอย่างมั่นคงด้วย [sc_victor.Custom('signature_weapon')] ข้า\n\n[sc_loser.GetFirstNameNoTooltip] อาเจียนเลือดและกรดในกระเพาะออกมาทันที สำลักและไอเป็นครั้งสุดท้ายขณะที่ส่วนผสมนั้นตกลงมาใส่ [sc_loser.GetHerHim] ไหลกลับเข้าไปในปากและรูจมูกของ [sc_loser.GetHerHis] ไม่นานนักการสำลักก็หยุดลง"
 single_combat.0041.desc.opponent_response.strict_guard.fatality:0 "ลอบ [sc_victor.Custom('SignatureWeaponAttemptedLight')] ผ่านกำแพงการปัดป้อง\n\nการโจมตีครั้งเดียวกลับกลายเป็นทั้งหมดที่จำเป็น [sc_victor.Custom('signature_weapon')] ข้า [sc_victor.Custom2('SignatureWeaponKillTypeHead2ThirdPersonPresentParticipleGendered',SCOPE.sC('sc_loser'))]\n\n[sc_loser.GetFirstNameNoTooltip] ดูเหมือนจะไม่สามารถประมวลผลเลือดที่สูบฉีดออกจากเส้นเลือดใหญ่ที่ฉีกขาดของ [sc_loser.GetHerHis] ได้ จน [sc_loser.GetSheHe] ยังคงปัดป้องการโจมตีครั้งต่อไปข้าตามสัญชาตญาณ\n\nข้ามีเวลาพอที่จะตกตะลึงในความ #EMP ดื้อรั้น#! อันแท้จริงก่อนที่แสงสว่างจะดับไปจาก [my_foe.Custom('EyeEyes')] ของ [sc_loser.GetHerHis] ตลอดกาล"
 single_combat.0041.desc.opponent_response.confident_attack.fatality:0 "โดนโจมตีอย่างแรงเข้าที่ท้องของ [sc_loser.GetHerHis]\n\nการโจมตีฉีกผ่านผิวหนัง ไขมัน และกล้ามเนื้อ ทำให้ไส้ที่เหมือนเชือกทะลักลงไปใน [sc_defender.Custom('GroundType')] ที่เปียกโชกด้วยเลือด และ [sc_loser.GetFirstNameNoTooltip] ก็ลื่นและสะดุดถอยหลังพร้อมเสียงกรีดร้อง\n\nข้าก้าวไปข้างหน้า [sc_victor.Custom('signature_weapon')] ยกขึ้นเพื่อยุติชะตากรรมศัตรูข้า"
 single_combat.0041.desc.opponent_response.expert_onslaught.fatality:0 "ข้าสามารถทำการปัดป้องที่มั่นคงอย่างน่าประหลาดใจ การปิดกั้นเบี่ยงเบน [sc_loser.Custom('signature_weapon')] ของ [sc_loser.GetHerHis] กลับเข้าที่ [sc_loser.Custom('MaskFace')] ของ [sc_loser.GetHerHis] [sc_loser.Custom('SignatureWeaponWoundVerb6PresentParticiple')] ลงไปถึงกระดูก\n\nข้าไม่เสียเวลา กวาดเท้าของ [sc_loser.GetFirstNamePossessiveNoTooltip] ออกด้วยขาที่เกี่ยวและเหวี่ยงตรงเข้า [sc_victor.Custom2('SignatureWeaponKillTypeGroinThirdPersonPresentParticipleGendered',SCOPE.sC('sc_loser'))], [sc_victor.Custom2('SignatureWeaponKillTypeGroinThirdPersonPresentParticipleGendered_Aftermath',SCOPE.sC('sc_loser'))]\n\nเสียงกรีดร้องของ [sc_loser.GetWomanMan] ใช้เวลานานเกินไปเล็กน้อยกว่าจะจางหายไป"
 single_combat.0041.desc.opponent_response.attempt_disarm.fatality:0 "[sc_loser.Custom('SignatureWeaponBreaksThirdPersonSingularPresent')]\n\nอาวุธของ [sc_loser.GetHerHis|U] ไร้ประโยชน์ [sc_loser.GetFirstNameNoTooltip] ก็ถูก [sc_victor.Custom('SignatureWeaponKillTypePastTense')] ได้ง่ายๆ"
 ### No need for a lightning_assault, as you can't end the duel in the first round.
 single_combat.0041.desc.opponent_response.tire_opponent.fatality:0 "เมื่อ [sc_loser.GetFirstNameNoTooltip] ดูไม่มั่นคง ข้าก็ปล่อย [sc_victor.Custom('SignatureWeaponAttemptedHeavy')] ที่ ทำให้ [sc_loser.GetHerHim] ล้มลงอย่างสิ้นเชิง\n\nต้องให้เครดิต [sc_loser.GetHerHis] [sc_loser.GetSheHe] ปัดป้องการโจมตีครั้งต่อไปได้ ครั้งถัดจากนั้น [sc_victor.Custom2('SignatureWeaponKillTypeHead2ThirdPersonActiveGendered',SCOPE.sC('sc_loser'))]: เสียงกรีดร้องที่ขาดห้วงก็เปลี่ยนเป็นความสงบนิ่งอย่างรวดเร็ว"
 single_combat.0041.desc.opponent_response.reason_you_suck_speech.fatality:0 "ก้าวไปข้างหน้า ข้าเหวี่ยง [sc_victor.Custom('SignatureWeaponAttemptedHeavy')] ซึ่ง [sc_victor.Custom2('SignatureWeaponKillTypeHead2ThirdPersonActiveGendered',SCOPE.sC('sc_loser'))]\n\n[sc_loser.GetFirstNameNoTooltip] กระเด็นถอยหลัง โลหิตพุ่งออกจากลำคอที่แหลกเหลวของ[sc_loser.GetHerHis] ชั่วขณะหนึ่ง ดูเหมือนว่า[sc_loser.GetSheHe]อาจจะตั้งตัว[sc_loser.GetHerselfHimself]ได้ หรืออาจจะสู้ต่อไปได้ด้วยซ้ำ\n\nแล้ว[sc_loser.GetSheHe]ก็ทรุดลง"
 single_combat.0041.desc.opponent_response.technique_from_legend.fatality: "\n\nข้าไม่แน่ใจนักว่า #EMP เหตุใด#! [sc_loser.GetSheHe]จึงยืน เช่นนั้น แต่ข้าตอบแทนความประหลาดนั้นด้วยการ ทำให้สะดุดอย่างรวดเร็ว ตามด้วย[sc_victor.Custom('signature_weapon')]ของข้า [sc_victor.Custom2('SignatureWeaponKillTypeRearTorsoThirdPersonPresentParticipleGendered',SCOPE.sC('sc_loser'))]\n\nไม่มีเพลงดาบชั้นครูหรือกับดักซ่อนเร้นใด ๆ ปรากฏขึ้น ข้าจึงคาดว่าท่าทางประหลาดนั้นก็แค่... ประหลาด\n\nด้วยการยักไหล่ ข้าเตะ [sc_loser.GetFirstNameNoTooltip] ให้หงายหลังของ[sc_loser.GetHerHis]เพื่อเผด็จศึก"
 single_combat.0041.desc.opponent_response.like_a_viper.fatality: "รวดเร็วดุจสายฟ้า ข้าตวัด[sc_victor.Custom('signature_weapon')]ของข้ากลับและพุ่งตรงไปยัง [sc_loser.GetFirstNameNoTooltip] อาวุธนั้น [sc_victor.Custom2('SignatureWeaponKillTypeTorsoThirdPersonActiveGendered',SCOPE.sC('sc_loser'))] ในคราเดียว ฟาด[sc_loser.GetHerHim]กระเด็นไปยัง [sc_defender.Custom('GroundType')]\n\nคู่ต่อสู้ของข้าดิ้นรนในตอนแรก พยายามลุกขึ้น เคลื่อนไหว ต่อต้าน [sc_loser.GetSheHe|U] ทำได้เพียงแค่กลิ้งตัวหงายหลังของ[sc_loser.GetHerHis]ก่อนที่การเสียเลือดจะเอาชนะ[sc_loser.GetHerHim]"
 single_combat.0041.desc.opponent_response.pocket_silver.fatality:0 "ข้าดำเนินการอย่างรวดเร็ว ผลัก [sc_loser.GetHerHim] ลงกับพื้น\n\nก่อนที่ [sc_loser.GetSheHe] จะฟื้นตัวได้ ข้ารวบรวมกำลังใจสำหรับความโหดร้ายและเริ่ม [sc_victor.Custom2('SignatureWeaponKillTypeGroinThirdPersonPresentParticipleGendered',SCOPE.sC('sc_loser'))]\n\nเสียงกรีดร้องเงียบหายไปนานก่อนที่ [sc_loser.GetFirstNameNoTooltip] จะตาย"
 single_combat.0041.desc.opponent_response.martial_voice.fatality:0 "จากนั้น ข้าก็เพียงแค่ก้าวไปข้างหน้าและ [sc_victor.Custom('SignatureWeaponWoundVerb4')] ลำคอของ [sc_loser.GetHerHis] ด้วยการฟาดเพียงครั้งเดียวจาก [sc_victor.Custom('signature_weapon')] ของข้า\n\n[sc_loser.GetFirstNameNoTooltip] ดูเหมือน... สับสน หวาดกลัว โกรธแค้น เป็นการยากที่จะแสดงอารมณ์เดียวเมื่อคอของท่านเป็นซากปรักหักพังที่เต็มไปด้วยเลือด\n\nข้าเพียงเฝ้ามอง [sc_loser.GetHerHim] ขณะที่เขาค่อยๆ สำลักเลือดของ [sc_loser.GetHerHis] เอง"
 single_combat.0041.desc.opponent_response.mocking_boast.fatality:0 "หลอกล่อ ให้[sc_loser.GetHerHim]หันหลัง[sc_loser.GetHerHis]ให้ข้า จากนั้น [sc_victor.Custom2('SignatureWeaponKillTypeRearTorsoThirdPersonFutureGendered',SCOPE.sC('sc_loser'))]\n\nศัตรูของข้าล้มลงทันที และความตกใจก็คร่าชีวิต[sc_loser.GetHerHim]ในไม่ช้าหลังจากนั้น"
 single_combat.0041.desc.opponent_response.is_that_a_crocodile.fatality:0 "\n\n[sc_victor.Custom('SignatureWeaponAttemptedHeavy')] ข้าลอยตรงผ่านการป้องกันของ [sc_loser.GetFirstNamePossessiveNoTooltip] และเข้าที่หน้าอกส่วนบนของ [sc_loser.GetHerHis] ระหว่างแรง โอกาส และสมาธิที่แตกสลายของคู่ต่อสู้ข้า การโจมตีนั้น #EMP ร้ายแรง#! ส่งเลือดและกระดูกลอยไปทุกที่\n\n[sc_loser.GetFirstNameNoTooltip] ทรุดลงหงายหลัง ชักกระตุก กระตุก เป็นซากปรักหักพังของ [sc_loser.GetWomanMan] มันนานเกินไปมากก่อนที่ [sc_loser.GetSheHe] จะตายจริงๆ"
 single_combat.0041.desc.opponent_response.desert_warrior.fatality:0 "ข้าพุ่งเข้าสู่ [sc_victor.Custom('SignatureWeaponAttemptedHeavy')] ที่ ทำให้ [sc_loser.GetHerHim] ล้มลงตรงๆ การโจมตีตามมา [sc_victor.Custom('SignatureWeaponWoundVerb5ThirdPersonPresent')] เข้าที่คอของ [sc_loser.GetHerHis] อย่างยุ่งเหยิง\n\nแทบจะไม่ใช่ความตายที่น่าพอใจหรือสง่างาม แต่อย่างน้อยมันก็รวดเร็ว"
 single_combat.0041.desc.opponent_response.jungle_stalker.fatality:0 "การเบี่ยงเบนความสนใจคือเวลาทั้งหมดที่ข้าต้องการเพื่อโยน [sc_victor.Custom('SignatureWeaponAttemptedHeavy')] ตรงเข้าที่ท้องที่ไร้การป้องกันของ [sc_loser.GetHerHis] ส่ง [sc_loser.GetHerHim] กรีดร้องลงกับพื้น\n\nการต่อสู้ที่ตามมานั้นสั้น แต่เปื้อนเลือด อย่างน้อยก็สำหรับ [sc_loser.GetFirstNameNoTooltip]"
 single_combat.0041.desc.opponent_response.open_terrain_expert.fatality:0 "เมื่อ [sc_loser.GetSheHe] สะดุด [sc_loser.GetSheHe] ก็สะดุดอย่างแรง และข้าก็ถึงตัว [sc_loser.GetHerHim] ในทันที\n\nการเตะอย่างรวดเร็วเข้าที่เป้า ทำให้ [sc_loser.GetFirstNameNoTooltip] นอนอยู่กับพื้นนานพอที่ข้าจะ [sc_victor.Custom2('SignatureWeaponKillTypeTorso2ThirdPersonSimplePresentGendered',SCOPE.sC('sc_loser'))] ด้วย [sc_victor.Custom('signature_weapon')] ข้า\n\n[sc_loser.GetSheHe|U] ดิ้นรนอยู่ครู่หนึ่ง แต่ในที่สุดก็นอนลงและปล่อยให้ความตายพราก [sc_loser.GetHerHim] ไป"
 single_combat.0041.desc.opponent_response.rough_terrain_expert.fatality.rocky:0 "แต่ข้าก็ยังยืนหยัดอยู่ได้\n\nเมื่อ [sc_loser.GetFirstNameNoTooltip] ไม่สังเกตเห็นหน้าผาเล็กๆ ข้างหลัง [sc_loser.GetHerHis] ข้าก็ลองผลักโต้กลับ และนักสู้เนินเขาผู้ช่ำชองก็ล้มหงายหลังอย่างแรง\n\nข้าได้ยินเสียงแตกและเสียงกรีดร้องขณะที่ [sc_loser.GetSheHe] ตกลงไปขอบหน้าผา และรีบลงไปเอง พบว่า [sc_loser.GetHerHim] ถูกเสียบครึ่งตัวด้วยกระดูกต้นขาที่แตกละเอียดของ [sc_loser.GetHerHis] เอง การสังหารเพื่อความเมตตาใช้เวลาไม่นาน"
 single_combat.0041.desc.opponent_response.rough_terrain_expert.fatality.boggy:0 "ข้าวนเวียน มองหาจุดที่ดีที่จะโจมตี [sc_loser.GetFirstNameNoTooltip] สามารถตะเกียกตะกายหลุดออกมาได้ เพียงเพื่อจะพุ่งหน้าคว่ำลงไปในอีกสระที่ลึกกว่า และข้าก็เห็นโอกาสข้า: การโจมตีอย่างรวดเร็วครั้งเดียวเพื่อ [sc_victor.Custom2('SignatureWeaponKillTypeRearTorsoThirdPersonFutureGendered',SCOPE.sC('sc_loser'))]\n\nอัมพาตเกิดขึ้นทันที [sc_loser.GetFirstNameNoTooltip] ลื่นลงไปลึกขึ้นในหนองน้ำเหม็นเน่า ใช้เวลาพอสมควรก่อนที่ฟองอากาศจะหยุด"
 single_combat.0041.desc.opponent_response.forest_fighter.fatality:0 "\n\nข้าพุ่งเข้าใส่ [sc_loser.GetHerHim] ด้วยการระดม [sc_victor.Custom('SignatureWeaponAttemptedLightPlural')] ในตอนแรก ดูเหมือนว่าคู่ต่อสู้ข้าจะปัดป้องข้าได้ดี จนกระทั่ง [sc_loser.GetSheHe] เริ่มช้าลง เลือดไหลทะลักออกมาจาก... ที่ไหนสักแห่ง ข้าคงจะกรีดโดนหลอดเลือดแดงเข้าแล้ว\n\nภายในหนึ่งนาที [sc_loser.GetFirstNameNoTooltip] ก็หมดสติไป ข้าจัดการ [sc_loser.GetHerHim] อย่างรวดเร็ว"
 single_combat.0041.desc.opponent_response.raaargh.fatality:0 "ข้ารักษาระยะห่าง พุ่งไปข้างหน้าเพียงเมื่อ [sc_loser.GetFirstNameNoTooltip] ถึงจุดสูงสุดเพื่อเฉือนชิ้นเนื้อออกไป และเราก็เต้นรำ เช่นนี้อยู่ครู่หนึ่ง\n\nอย่างไรก็ตาม ในที่สุด ความบ้าคลั่งของ [sc_loser.GetHerHis] ก็สงบลง และ [sc_loser.GetWomanMan] ไม่ใช่นักรบคลั่ง ก็โอนเอนอยู่หน้าข้า จำนวนและความรุนแรงของบาดแผลของ [sc_loser.GetHerHis] ก็ถาโถมใส่ [sc_loser.GetHerHim] ทีละแผล จนกระทั่ง..."
 single_combat.0041.desc.opponent_response.hard_grit.fatality:0 "ลอบ [sc_victor.Custom('SignatureWeaponAttemptedLight')] เข้าไป ซึ่งฝังตัวเองอยู่ในท้องของ [sc_victor.GetHerHis]\n\nความตายอันเจ็บปวด [sc_loser.GetFirstNameNoTooltip] ยอมรับมันอย่างสง่างาม ต่อสู้ผ่านความเจ็บปวดจนถึงที่สุด"
 single_combat.0041.desc.opponent_response.feint_and_stab.fatality:0 "\n\nก่อนที่ [sc_loser.GetFirstNameNoTooltip] จะนำอาวุธรองของ [sc_loser.GetHerHis] มาใช้ได้ ข้าก็เหวี่ยง [sc_victor.Custom('signature_weapon')] ข้ากลับไปเพื่อ [sc_victor.Custom2('SignatureWeaponKillTypeTorso2ThirdPersonSimplePresentGendered',SCOPE.sC('sc_loser'))] ร่างกายที่บอบช้ำของ [sc_loser.GetHerHis|U] ถูกเหวี่ยงถอยหลัง ชักกระตุกและเลือดออกลงไปใน [sc_defender.Custom('GroundType')]\n\nภายในหนึ่งนาที การเคลื่อนไหวทั้งหมดก็หยุดลง"
 single_combat.0041.desc.opponent_response.butchery.fatality:0 "อย่างระมัดระวัง ระแวงกับดัก ข้าก้าวเข้าไปในช่องว่างที่เห็นได้ชัดในการป้องกันของ [sc_loser.GetHerHis] และฟาดออกไปด้วย [sc_victor.Custom('SignatureWeaponAttemptedLight')] ที่ [sc_victor.Custom2('SignatureWeaponKillTypeHead2ThirdPersonActiveGendered',SCOPE.sC('sc_loser'))] อย่างน่าสยดสยอง\n\n[sc_loser.GetFirstNameNoTooltip] เริ่มสำลักเลือดที่พุ่งออกมาทันที ทำ [sc_loser.Custom('signature_weapon')] ของ [sc_loser.GetHerHis] หล่นเพื่อกุมบาดแผล\n\n[sc_loser.GetSheHe|U] ยังคงกุมอยู่เมื่อ [sc_loser.GetSheHe] สิ้นใจ หนึ่งนาทีเต็มต่อมา"
 single_combat.0041.desc.opponent_response.stoic_veteran.fatality:0 "เราตกอยู่ในรูปแบบการโจมตี-ปัดป้อง-โต้กลับที่ตึงเครียด โดยข้าค่อยๆ ได้เปรียบ บั่นทอน [sc_loser.GetFirstNameNoTooltip] ลงทีละน้อย จนกระทั่ง [sc_loser.GetSheHe] ได้รับบาดแผลและรอยกรีดมากพอที่จะฆ่า [sc_loser.GetWomenMen] ส่วนใหญ่ได้สองครั้ง\n\nแม้ แต่ [sc_loser.GetSheHe] ก็มีขีดจำกัดของ [sc_loser.GetHerHis] เช่นกัน และขณะที่ชาววารังเจียนทรุดลงคุกเข่า พร้อมสำหรับการสังหาร ก็เป็นที่ชัดเจนว่าเราทั้งคู่รู้ดี"
 single_combat.0041.desc.opponent_response.blade_dance.fatality:0 "ขณะข้ากำลังเหวี่ยงกลับ\n\nความโกรธแค้นแผ่กระจายไปทั่วใบหน้าของ [sc_loser.GetFirstNameNoTooltip] คาดว่าเกิดจากความทะลึ่งข้า แต่ข้าไม่มีความสนใจที่จะปล่อยให้มันไปไกลกว่านี้\n\n[sc_victor.Custom('signature_weapon')] ข้า [sc_victor.Custom('SignatureWeaponWoundVerb1ThirdPersonPresent')] ลึกเข้าไปในอกของปรมาจารย์ดาบอย่างถึงแก่ชีวิต"
 single_combat.0041.desc.opponent_response.wrath_of_highgod.fatality:1 "กระแทก [sc_victor.Custom('SignatureWeaponEndType')] ของ [sc_victor.Custom('signature_weapon')] ข้าเข้าที่ [sc_loser.Custom('MaskFace')] ของ [sc_loser.GetHerHis]\n\nกรีดร้องด้วยความโกรธต่อการดูหมิ่นนี้ [sc_loser.GetFirstNameNoTooltip] โซเซถอยหลัง คำสาปแช่งอันชั่วร้ายบนริมฝีปากของ [sc_loser.GetHerHis] จนถึงวินาทีที่ข้า [sc_victor.Custom('SignatureWeaponWoundVerb5')] อาวุธข้าเข้าที่ปอดของ [sc_loser.GetHerHis]\n\nหลังจากนั้น ทุกอย่างคือการสำลัก การหายใจไม่ออก แล้วก็ความเงียบ"
 single_combat.0041.desc.opponent_response.hurt_me_better.fatality:0 "และข้าคิดว่าเราทั้งคู่รู้ว่า [sc_loser.GetSheHe] ไม่สามารถเป็นภัยคุกคามได้มากนักหรือหยุดข้าจากการตอบโต้\n\nการโจมตีอย่างมั่นคงเพียงครั้งเดียวและข้าก็ [sc_victor.Custom2('SignatureWeaponKillTypeHeadThirdPersonFutureGendered',SCOPE.sC('sc_loser'))]"
 single_combat.0041.desc.opponent_response.special_fallback.fatality:0 "ด้วยช่องว่างที่ชัดเจนที่ด้านหลังของ [sc_loser.GetHerHis] ข้าปล่อย [sc_victor.Custom('SignatureWeaponAttemptedLightPlural')] ถล่มใส่ [sc_loser.GetFirstNameNoTooltip] ทุบตี [sc_loser.GetHerHim] ลงกับพื้น\n\n[sc_loser.GetSheHe|U] ลงกระแทกพื้นอย่างแรงที่ด้านข้าง ไอเป็นลิ่มเลือดอยู่ครู่หนึ่ง จนกระทั่ง [sc_loser.GetSheHe] ส่งเสียงครืดคราดแห่งความตายออกมาอย่างเหนื่อยล้า"
 ### No need for a something_to_hide, as it's never fatal.

 ## Aggressor Won, Own Combat Move Feedback
 single_combat.0041.desc.sc_attacker.wait_and_hope:0 "ข้ารอคอยอย่างอดทน หวังว่าช่วงเวลาที่สมบูรณ์แบบจะปรากฏขึ้น\n\nเมื่อไม่มี ข้าก็ลอง [sc_victor.Custom('SignatureWeaponAttemptedLight')] ที่ #EMP อุ่นๆ#! อย่างแท้จริง ซึ่ง"
 single_combat.0041.desc.sc_attacker.unsure_attack:0 "การป้องกันที่ดีที่สุดคือการโจมตีที่มั่นคง แต่แม้ แต่การโจมตีครึ่งๆ กลางๆ ก็ช่วยได้ ด้วยเหตุนี้ ข้าจึงลอง [sc_victor.Custom('SignatureWeaponAttemptedLight')] อย่างลังเล\n\n"
 single_combat.0041.desc.sc_attacker.enthusiastic_onslaught:0 "คำรามท้าทาย ข้าทุ่มสุดตัวเข้าสู่ฝูง [sc_victor.Custom('SignatureWeaponAttemptedHeavyPlural')] ระดมโจมตีครั้งแล้วครั้งเล่าใส่คู่ต่อสู้ข้า\n\n"
 single_combat.0041.desc.sc_attacker.hail_mary:0 "นี่ไม่ใช่การประลองที่ข้าคาดว่าจะชนะ ด้วยเหตุนี้ ข้าไม่มีเหตุผลที่จะเล่นอย่างปลอดภัย และพุ่งไปข้างหน้าโดยเอา [sc_victor.Custom('signature_weapon')] เข้าหาก่อน\n\n"
 single_combat.0041.desc.sc_attacker.pocket_sand:0 "ย่อตัวลงต่ำ ข้าคว้า [sc_defender.Custom('GritType')] กำมือหนึ่งและขว้างมันตรงเข้า [sc_loser.Custom('MaskFace')] คู่ต่อสู้ข้า [sc_loser.GetSheHe|U] ถูก ทำให้ประหลาดใจอย่างสิ้นเชิง,"
 single_combat.0041.desc.sc_attacker.nut_em:1 "เห็นช่องว่างที่ #EMP สมบูรณ์แบบ#! ในการป้องกันคู่ต่อสู้ข้า ข้าก้าวไปข้างหน้าและกระแทก [sc_victor.Custom('MaskFace')] ข้าลงบน [sc_loser.GetHerHim] อย่าง #EMP แรง#!."
 single_combat.0041.desc.sc_attacker.guard:0 "[sc_victor.Custom('signature_weapon')|U] ถืออย่างระแวดระวังอยู่ข้างหน้าข้า ข้าก้าวไปข้างหน้า ปัดป้องการโจมตีครั้งแล้วครั้งเล่าจากคู่ต่อสู้ข้า,"
 single_combat.0041.desc.sc_attacker.probing_attack:0 "ต่อสู้อย่างมีชั้นเชิง ข้าเก็บการโจมตีส่วนใหญ่ไว้เป็นการหลอกล่อ เพียงเอนตัวเข้าหาการโจมตีที่จะโดนแรงที่สุด"
 single_combat.0041.desc.sc_attacker.onslaught:0 "[sc_victor.Custom('signature_weapon')|U] ลอยคว้าง ข้าโยนการระดม [sc_victor.Custom('SignatureWeaponAttemptedHeavyPlural')] ใส่คู่ต่อสู้ข้า"
 single_combat.0041.desc.sc_attacker.surprise_attack:0 "การกวาด [sc_victor.Custom('signature_weapon')] ข้าอย่างน่าทึ่งไปในทิศทางหนึ่งเปิดทางให้เปลี่ยนส่วนโค้ง และ [sc_victor.Custom('SignatureWeaponAttemptedLight')] ที่ ทำให้คู่ต่อสู้ข้าประหลาดใจ\n\n"
 single_combat.0041.desc.sc_attacker.taunt:0 "ด้วยความไม่ใส่ใจอย่างสบายๆ ข้าโยนคำดูถูก การเยาะเย้ย และความเหยียดหยามใส่คู่ต่อสู้ข้า\n\nจึงไม่น่าแปลกใจเลย,"
 single_combat.0041.desc.sc_attacker.put_the_boot_in.peg_leg:0 "มุ่งมั่นที่จะเห็นคู่ต่อสู้ข้าล้มลงไม่ว่าจะเสี่ยงเพียงใด ข้าทุ่มน้ำหนักทั้งหมดเข้าสู่ [sc_victor.Custom('SignatureWeaponAttemptedHeavy')] ที่ส่ง [sc_loser.GetHerHim] โซเซ ตามด้วยการเตะอย่างรุนแรงจากขาปลอมข้า\n\n"
 single_combat.0041.desc.sc_attacker.put_the_boot_in.fallback:0 "มุ่งมั่นที่จะเห็นคู่ต่อสู้ข้าล้มลง ข้าทุ่มน้ำหนักทั้งหมดเข้าสู่ [sc_victor.Custom('SignatureWeaponAttemptedHeavy')] ที่ส่ง [sc_loser.GetHerHim] โซเซ ตามด้วยการเตะอย่างรุนแรง\n\n"
 single_combat.0041.desc.sc_attacker.strict_guard:0 "ไม่มีศัตรูใดทำลายการป้องกันข้าได้ และคู่ต่อสู้ข้าวันนี้ก็ไม่ใช่ข้อยกเว้น ข้าผลัก [sc_loser.GetHerHim] ถอยหลังครั้งแล้วครั้งเล่าด้วยสายโซ่การปัดป้องที่สมบูรณ์แบบ เพียงเสนอ [sc_victor.Custom('SignatureWeaponAttemptedHeavy')] อันร้ายกาจเมื่อ [sc_loser.GetSheHe] เหนื่อยล้าอย่างสิ้นเชิง\n\n"
 single_combat.0041.desc.sc_attacker.confident_attack:0 "ความมั่นใจคือครึ่งหนึ่งของการต่อสู้ใดๆ และข้าก็ปล่อย [sc_victor.Custom('SignatureWeaponAttemptedLightPlural')] อย่างลื่นไหลด้วยความมั่นใจทั้งหมดของผู้เชี่ยวชาญที่ช่ำชอง"
 single_combat.0041.desc.sc_attacker.expert_onslaught:0 "แขนข้างที่ถือ [sc_victor.Custom('signature_weapon')] ข้าเคลื่อนไหวเร็วปานสายฟ้า และโจมตีแรงดุจหินที่แตกสลาย"
 single_combat.0041.desc.sc_attacker.attempt_disarm:0 "เห็นโอกาสที่สมบูรณ์แบบที่จะปลดอาวุธคู่ต่อสู้ข้า ข้ายก [sc_victor.Custom('signature_weapon')] ข้าลงใน [sc_victor.Custom('SignatureWeaponAttemptedHeavy')] ที่กระชาก [sc_loser.Custom('signature_weapon')] ของ [sc_loser.GetHerHis] ออกจากมือของ [sc_loser.GetHerHis]\n\n"
 ### No need for a lightning_assault, as you can't end the duel in the first round.
 single_combat.0041.desc.sc_attacker.tire_opponent:0 "ใช้เวลาข้า สงบนิ่ง ผสมผสานการปัดป้องอย่างไม่หยุดยั้งกับการหลบหลีกที่น่าโมโห ข้ากัดกร่อนพลังงานคู่ต่อสู้ข้าอย่างไม่อาจหยุดยั้งได้\n\n"
 single_combat.0041.desc.sc_attacker.reason_you_suck_speech:0 "ข้าตอบโต้การโจมตี แต่ละครั้งของ [sc_loser.Custom('signature_weapon')] คู่ต่อสู้ข้าด้วยคำพูดเหน็บแนมและกระโดดถอยหลัง\n\n"
 single_combat.0041.desc.sc_attacker.technique_from_legend:0 "ข้าบังคับร่างกายให้เข้ากับภาพในใจอันชัดเจนของตำนาน เปลี่ยนไปใช้ท่าทางที่งุ่มง่ามขณะ [sc_victor.Custom('SignatureWeaponFlourishPresentParticiple')] [sc_victor.Custom('signature_weapon')] ข้า\n\n"
 single_combat.0041.desc.sc_attacker.like_a_viper:0 "ด้วยความแม่นยำที่ไม่ผิดพลาด ข้าพุ่งตัวโดยเอา [sc_victor.Custom('signature_weapon')] เข้าหาก่อนที่จุดบอดในการป้องกันคู่ต่อสู้ข้า"
 single_combat.0041.desc.sc_attacker.pocket_silver:0 "คว้าถุงเงินหนักจากเข็มขัด ข้าขว้างมันใส่ [sc_loser.Custom('MaskFace')] คู่ต่อสู้ข้า"
 single_combat.0041.desc.sc_attacker.martial_voice:0 "การบัญชาการฝูงชนที่ไม่เคยอาบน้ำเป็นศิลปะที่แตกต่างเล็กน้อยจากการบัญชาการผู้ที่เกิดมาสูงส่ง แต่เครื่องมือที่มันมอบให้ข้าพิสูจน์ว่าได้ผลดี เช่นกัน ขณะข้าคำรามคำดูถูกและคำขู่สุดเสียงข้า"
 single_combat.0041.desc.sc_attacker.mocking_boast:0 "มันงดงามจริงๆ การใช้ความรู้สึกอับอายของใครบางคนในความไม่เพียงพอของตนเองเพื่อ"
 single_combat.0041.desc.sc_attacker.is_that_a_crocodile:0 "ข้าถอยหลัง โดยมีคู่ต่อสู้ตามติดข้าตลอดทาง กดดันการโจมตีของ [sc_loser.GetHerHis] ตลอดเวลา ข้างหลัง [sc_loser.GetHerHim] สัตว์เลื้อยคลานอสูรร้าย"
 single_combat.0041.desc.sc_attacker.desert_warrior:0 "ข้ารู้จักเกมนี้ดี และเพียงแค่เต้นรำหนีจากคู่ต่อสู้ข้าเมื่อ [sc_loser.GetSheHe] เข้าใกล้ รักษาระยะใกล้พอที่จะโจมตีได้ แต่ไม่เคยใกล้พอที่จะโดน ไม่นานนักทะเลทรายก็ทำงานแทนข้า,"
 single_combat.0041.desc.sc_attacker.jungle_stalker:0 "ป่าเป็นพันธมิตรที่แข็งแกร่งในการต่อสู้ใด ๆ และข้าเพียงแค่ต้องรอให้มันดักจับศัตรูของข้าด้วยวิธีใดวิธีหนึ่ง เมื่อ [sc_loser.GetSheHe] ทำให้เท้าของ[sc_loser.GetHerHis]ไปเกี่ยวกับเถาวัลย์ ข้าก็จู่โจม\n\n""
 single_combat.0041.desc.sc_attacker.open_terrain_expert:0 "พื้นที่เป็นสินค้าที่มีค่าที่สุดอย่างหนึ่งในการประลองตามธรรมเนียม แต่ข้ายอมเสียพื้นที่ให้คู่ต่อสู้ข้าเหมือนน้ำเซาะหิน และเหมือนน้ำเซาะหิน ข้าก็บั่นทอน [sc_loser.GetHerHim] ลงด้วยการโจมตีครั้งแล้วครั้งเล่า\n\n"
 single_combat.0041.desc.sc_attacker.rough_terrain_expert.rocky:0 "เนินเขาและภูเขาต่อสู้ได้ยากในยามปกติ แต่ประสบการณ์ข้ากับพื้นที่ดังกล่าว ทำให้การประลองนี้ทุกข์ทรมานอย่างยิ่งสำหรับคู่ต่อสู้ข้า\n\n"
 single_combat.0041.desc.sc_attacker.rough_terrain_expert.boggy:0 "หนองบึงและที่ลุ่มชื้นแฉะต่อสู้ได้ยากในยามปกติ แต่ประสบการณ์ข้ากับพื้นที่ดังกล่าว ทำให้การประลองนี้ทุกข์ทรมานอย่างยิ่งสำหรับคู่ต่อสู้ข้า\n\n"
 single_combat.0041.desc.sc_attacker.forest_fighter:0 "มีศิลปะในการต่อสู้ในป่า การผสมผสานระหว่างความละเอียดอ่อนและความป่าเถื่อนที่มาพร้อมกับประสบการณ์อันขมขื่นเท่านั้น ข้ายินดีเป็นอย่างยิ่งที่จะช่วยคู่ต่อสู้ข้าสร้างประสบการณ์นั้น,"
 single_combat.0041.desc.sc_attacker.raaargh:0 "ความโกรธ ความเดือดดาล และความต้องการที่ไม่อาจดับได้ที่จะ #BER ฆ่า#! เอ่อล้นในตัวข้า ฉีกกระชาก #BER รูโหว่เปื้อนเลือด#! ในจิตใจข้า ข้ารู้สึกถึง #EMP คลั่งคล้ายอดนักรบ#! #BER ครอบงำข้า#! #EMP แต่มันคือ#! #BER ความเจ็บปวดที่ดี! กรรรซ์!#!\n\n"
 single_combat.0041.desc.sc_attacker.hard_grit:0 "ในความร้อนแรงของการต่อสู้ ไม่มีการให้อภัย ทุกความผิดพลาดที่ศัตรูข้าทำจะถูกลงโทษสิบเท่า ทุกข้อผิดพลาดที่สะเพร่าจะถูกชดใช้พร้อมดอกเบี้ย [sc_victor.Custom('SignatureWeaponAttemptedHeavyPlural')] ข้าเฉือนคู่ต่อสู้ข้า แต่ละครั้งผลัก [sc_loser.GetHerHim] เข้าใกล้ปากเหวแห่งความพ่ายแพ้มากขึ้น\n\n"
 single_combat.0041.desc.sc_attacker.feint_and_stab:0 "ข้าเหวี่ยง [sc_victor.Custom('signature_weapon')] ข้าในการหลอกล่อที่เกือบจะเกียจคร้าน คู่ต่อสู้ข้าไม่เห็นกริชในมืออีกข้างข้า จนกระทั่งสายเกินไป เมื่อมันอยู่แล้ว"
 single_combat.0041.desc.sc_attacker.butchery:0 "รอยยิ้มอันน่ากลัวปรากฏบนริมฝีปากข้าขณะข้าเริ่มระดม [sc_victor.Custom('SignatureWeaponAttemptedHeavyPlural')] อันรุนแรง การโจมตี แต่ละครั้งมุ่งเน้นไปที่ความเจ็บปวดมากกว่าชัยชนะ\n\n"
 single_combat.0041.desc.sc_attacker.stoic_veteran:0 "[sc_victor.Custom('signature_weapon')|U] ในมือ ข้าฟันคู่ต่อสู้ข้า การโจมตีที่ยาวและสม่ำเสมอ ซึ่งผลัก [sc_loser.GetHerHim] ถอยหลังครั้งแล้วครั้งเล่า"
 single_combat.0041.desc.sc_attacker.blade_dance:0 "ข้าหมุน [sc_victor.Custom('signature_weapon')] ข้าด้วยลีลาอันร้ายกาจ สานบทเพลงแห่งความเจ็บปวดข้ามคู่ต่อสู้ข้าด้วยทุกการโจมตี"
 single_combat.0041.desc.sc_attacker.wrath_of_highgod:0 "ข้าคำรามความภักดีข้าต่อ [sc_victor.GetFaith.HighGodName] [sc_victor.Custom('signature_weapon')] ยกขึ้นเป็นการถวายบูชา"
 single_combat.0041.desc.sc_attacker.hurt_me_better:0 "คู่ต่อสู้ข้าดูเหมือนจะคิดว่า [sc_loser.GetSheHe] กำลังทำร้ายข้าด้วยการโจมตีเล็กๆ น้อยๆ ของ [sc_loser.GetHerHis] แต่ความเจ็บปวดที่พุ่งขึ้นมาทุกครั้งเพียงแค่ขับเคลื่อนให้ข้าต่อสู้หนักขึ้น เร็วขึ้น\n\n"
 single_combat.0041.desc.sc_attacker.special_fallback:0 "เห็นช่องว่างชั่วขณะในการป้องกันคู่ต่อสู้ข้า ข้าเล็งเตะอย่างรุนแรงไปที่หน้าแข้งของ [sc_loser.GetHerHis]"
 single_combat.0041.desc.sc_attacker.something_to_hide:0 "ด้วยเสียงที่สูงกว่าเสียงกระซิบแหบแห้งเล็กน้อย ข้าเปล่งเสียงฟ่อเตือนความจำที่ไม่ผิดพลาดถึงอำนาจที่ข้ามีเหนือคู่ต่อสู้ข้า ทำให้ [sc_loser.GetHerHim] แข็งทื่อทันที\n\n"

 ## Aggressor Won, Own Combat Move Injury
 single_combat.0041.desc.sc_attacker.wait_and_hope.injury:0 "ถึงกระนั้นก็โดนเข้าที่ข้อนิ้วมือของ [sc_loser.GetHerHis] ข้างที่ถือ [sc_loser.Custom('signature_weapon')] ตามสัญชาตญาณ ข้อนิ้วคลายออก และอาวุธของ [sc_loser.GetHerHis] ก็หล่นกระทบพื้นเสียงดังแคร๊ง\n\n[sc_loser.GetFirstNameNoTooltip] และข้าจ้องหน้ากันตาเบิกกว้าง; เห็นได้ชัดว่า [sc_loser.GetSheHe] ประหลาดใจกับสิ่งนี้พอๆ กับข้า\n\nรู้สึกเหมือนเป็นชั่วนิรันดร์ก่อนที่ข้าจะจำได้ว่าต้องเรียกร้องให้ยอมแพ้"
 single_combat.0041.desc.sc_attacker.unsure_attack.injury: "ปาฏิหาริย์แท้ ๆ การโจมตีนั้นโดน [sc_loser.GetFirstNameNoTooltip] ในมุมที่อับจน ทำให้[sc_loser.GetHerHim]ล้มลง!\n\nเมื่อ[sc_loser.GetWomanMan]ผู้นั้นตะเกียกตะกายลุกขึ้นยืนบนเท้าของ[sc_loser.GetHerHis]ได้ ข้าก็ได้วาง[sc_victor.Custom('signature_weapon')]ของข้าเตรียม [sc_victor.Custom2('SignatureWeaponKillTypeGroinThirdPersonFutureGendered',SCOPE.sC('sc_loser'))] แล้ว การยอมจำนนก็ตามมาอย่างรวดเร็ว"
 single_combat.0041.desc.sc_attacker.enthusiastic_onslaught.injury:0 "คาดเดาได้ ไม่นานนักข้าก็บังคับให้ [sc_loser.GetFirstNameNoTooltip] คุกเข่าลง และจากนั้นก็เป็นเพียงการเหวี่ยงยาวๆ อย่างสบายๆ เพื่อนำ [sc_victor.Custom('SignatureWeaponTipType')] ของ [sc_victor.Custom('signature_weapon')] ข้าขึ้นมาที่คอของ [sc_loser.GetHerHis]\n\nการยอมแพ้มาทันทีที่โลหะเย็นสัมผัสคอของ [sc_loser.GetHerHis]"
 single_combat.0041.desc.sc_attacker.hail_mary.injury:0 "[sc_loser.GetFirstNameNoTooltip] มองดู การเยาะเย้ยอยู่ใน [my_foe.Custom('EyeEyes')] ของ [sc_loser.GetHerHis] ไม่มีการเคลื่อนไหวเพื่อหลบ แต่เหวี่ยง [sc_loser.Custom('signature_weapon')] ของ [sc_loser.GetHerHis] กลับมาปัดป้องอาวุธข้าอย่างง่ายดาย\n\nเกือบจะตามสัญชาตญาณที่ข้ากวาดเท้าไปรอบเข่าข้างหนึ่งของ [sc_loser.GetHerHis] และดึง แต่มันก็ได้ผลจริงๆ! คู่ต่อสู้ข้าล้มลง และข้ารีบเตรียมพร้อมสำหรับการสังหาร\n\nการยอมแพ้ที่ตื่นตระหนกและประหลาดใจมาถึงทันทีที่ข้าเริ่มเหวี่ยง [sc_victor.Custom('signature_weapon')] ข้า"
 single_combat.0041.desc.sc_attacker.pocket_sand.injury:0 "ไอและสำลักขณะที่มันลงไปครึ่งทางในหลอดลมของ [sc_loser.GetHerHis]\n\nข้าไม่เสียเวลาในการเตะเข่าของ [sc_loser.GetFirstNamePossessiveNoTooltip] ออกจากข้างใต้ด้วย [sc_victor.Custom('SignatureWeaponAttemptedHeavy')] และ [sc_loser.GetWomanMan] ก็ล้มลง ยังคงดิ้นรนและพยายามเอา [sc_defender.Custom('GritType')] ออกจาก [sc_defender.Custom('EyeEyes')] ของ [sc_loser.GetHerHis]\n\nเมื่อถึงเวลาที่ [sc_loser.GetSheHe] ทำสำเร็จ ข้าก็เตรียมพร้อมที่จะ [sc_victor.Custom2('SignatureWeaponKillTypeGroinThirdPersonFutureGendered',SCOPE.sC('sc_loser'))]\n\nการยอมแพ้ค่อนข้างรวดเร็ว"
 single_combat.0041.desc.sc_attacker.nut_em.injury:0 "บางคนอาจเรียกมันว่าการเคลื่อนไหวที่เสี่ยงหรือโง่เขลา แต่กะโหลกชนหน้าก็ ทำให้ผู้คัดค้านส่วนใหญ่หมดข้อโต้แย้งที่ดีที่สุด แม้ว่ามันจะเจ็บสำหรับข้าด้วยก็ตาม\n\nไม่ว่าข้าจะรู้สึกแย่แค่ไหน [sc_loser.GetFirstNameNoTooltip] ก็รู้สึกแย่กว่าอย่างเห็นได้ชัด ดิ้นรนอยู่บนพื้น หอบหายใจและกุม [sc_loser.Custom('MaskFace')] ของ [sc_loser.GetHerHis]\n\nข้าต้องตั้งตัวเล็กน้อย แต่ข้าก็ยังสามารถเตรียม [sc_victor.Custom('signature_weapon')] ข้าเพื่อ [sc_victor.Custom2('SignatureWeaponKillTypeThirdPersonFutureGendered',SCOPE.sC('sc_loser'))] ได้ทันเวลาที่จะบังคับให้ยอมแพ้"
 single_combat.0041.desc.sc_attacker.guard.injury:0 "จนกระทั่งข้าได้ช่องว่างชั่วขณะที่ #EMP สมบูรณ์แบบ#!\n\nด้วยการปัดป้องและโต้กลับที่รวดเร็วดุจสายฟ้า ข้าสามารถบิด [sc_loser.Custom('signature_weapon')] ออกจากมือของ [sc_loser.GetFirstNamePossessiveNoTooltip] ได้ ส่งมันลอยไป\n\nคู่ต่อสู้ข้าตกตะลึงขณะข้าเตรียมพร้อมสำหรับการโจมตีครั้งที่สอง ครั้งนี้พร้อมสำหรับการสังหาร ความรุนแรงต่อไปพิสูจน์ว่าไม่จำเป็น เพราะข้าได้รับการยอมแพ้ทันทีที่ [sc_loser.GetFirstNameNoTooltip] ประมวลผลว่า [sc_loser.GetSheHe] มีทางเลือกน้อยเพียงใด"
 single_combat.0041.desc.sc_attacker.probing_attack.injury:0 "\n\nผลลัพธ์คือการต่อสู้ที่บั่นทอนกำลังอย่างน่ารังเกียจ อย่างน้อยก็จากมุมมองของ [sc_loser.GetFirstNamePossessiveNoTooltip] ซึ่งจบลงในที่สุดด้วยการที่ข้าตี [sc_loser.Custom('signature_weapon')] ออกจากมือที่เหนื่อยล้าของ [sc_loser.GetHerHis]\n\nโชคดีสำหรับ [sc_loser.GetFirstNameNoTooltip] เราทั้งคู่เห็นแล้วว่าการประลองนี้จะจบลงอย่างไรเมื่อสักครู่ก่อน และ [sc_loser.GetSheHe] ก็ยอมแพ้อย่างรวดเร็วเมื่อถูกปลดอาวุธ"
 single_combat.0041.desc.sc_attacker.onslaught.injury:0 "การโจมตี แต่ละครั้งสร้างความเสียหายอย่างน่าสะพรึงกลัว ต้องใช้การปัดป้องที่หนักหน่วงจนเหงื่อเริ่มไหลลง [sc_loser.Custom('MaskFace')] ของ [sc_loser.GetWomanMan] เพียงแค่ป้องกัน [sc_loser.GetHerselfHimself] อย่างเดียว\n\nไม่มีใครสามารถรักษาความพยายามระดับนั้นได้นานขนาดนั้น และในที่สุด [sc_loser.GetFirstNameNoTooltip] ก็ทรุดลงไปใน [sc_defender.Custom('GroundType')]\n\nข้า [sc_victor.Custom('SignatureWeaponAction')] [sc_victor.Custom('signature_weapon')] ข้า และได้รับการยอมแพ้ที่อ่อนล้าเป็นการตอบแทน"
 single_combat.0041.desc.sc_attacker.surprise_attack.injury:0 "การโจมตีโดนแรงกว่าที่ข้าคาดไว้ เกือบ ทำให้ [sc_loser.GetFirstNameNoTooltip] หมุนตัวไปทั้งตัวและ #EMP เกือบ#! ทำให้ [sc_loser.GetHerHim] ล้มลงโดยสิ้นเชิง\n\n[sc_loser.GetSheHe|U] รวบรวมสติได้ในวินาทีสุดท้าย แต่ข้าก็จัดตำแหน่ง [sc_victor.Custom('signature_weapon')] ข้าเพื่อ [sc_victor.Custom2('SignatureWeaponKillTypeThirdPersonFutureGendered',SCOPE.sC('sc_loser'))] [sc_loser.GetHerHim] แล้ว\n\nการคุมเชิงที่ตึงเครียดเกิดขึ้นขณะที่ [sc_loser.GetFirstNameNoTooltip] ชั่งน้ำหนักทางเลือกของ [sc_loser.GetHerHis] แต่ในที่สุด [sc_loser.GetSheHe] ก็เปล่งเสียงยอมแพ้อันขมขื่นออกมา"
 single_combat.0041.desc.sc_attacker.taunt.injury:0 "จนในที่สุด [sc_loser.GetSheHe] ก็โกรธจัดจน [sc_loser.GetSheHe] ไม่สนใจแบบแผนการต่อสู้ที่สมเหตุสมผลและโยน [sc_loser.Custom('signature_weapon')] ของ [sc_loser.GetHerHis] ลงกับพื้น ตั้งใจจะฆ่าข้าด้วยมือเปล่าของ [sc_loser.GetHerHis]\n\nใช้เวลาเพียงแค่การแกว่ง [sc_victor.Custom('signature_weapon')] ข้าเล็กน้อยเพื่อเตือน [sc_loser.GetFirstNameNoTooltip] ว่า [sc_loser.GetSheHe] อยู่ที่ไหน และข้าก็ได้รับการยอมแพ้ที่เปล่งออกมาผ่านฟันที่กัดแน่นอย่างรวดเร็ว"
 single_combat.0041.desc.sc_attacker.put_the_boot_in.injury:0 "[sc_loser.GetFirstNameNoTooltip] ถูกส่งโซเซ และข้าก็ไม่ปล่อยให้โอกาสหลุดลอยไป พุ่งเข้าใส่ในพายุ [sc_victor.Custom('SignatureWeaponAttemptedLightPlural')] ที่ตี [sc_loser.GetHerHim] กรีดร้องลงไปใน [sc_defender.Custom('GroundType')]\n\nอย่างอ่อนแรง ศัตรูข้ากระตุกมือข้างที่ถือ [sc_loser.Custom('signature_weapon')] ของ [sc_loser.GetHerHis] พยายามรวบรวมเจตจำนงที่จะท้าทายข้าต่อไป\n\nข้าเพียงแค่เตรียมอาวุธข้าเพื่อ [sc_victor.Custom2('SignatureWeaponKillTypeHeadThirdPersonFutureGendered',SCOPE.sC('sc_loser'))] อย่างน้อยก็ จนกระทั่งข้าได้ยินเสียงยอมแพ้ที่สั่นเทา"
 single_combat.0041.desc.sc_attacker.strict_guard.injury:0 "ขณะที่ [sc_loser.GetFirstNameNoTooltip] ลอยถอยหลัง ข้าก็ลอยไปกับ [sc_loser.GetHerHim] นำ [sc_victor.Custom('SignatureWeaponEndType')] ของ [sc_victor.Custom('signature_weapon')] ข้าลงบน [sc_loser.Custom('MaskFace')] ของ [sc_loser.GetHerHis] มีเสียง #EMP ดังกร๊อบ#! น้อยครั้งนักที่จะน่าพอใจอย่างแท้จริงเท่า #EMP นั้น#! \n\nมึนงงและอ่อนแรง คู่ต่อสู้ข้าทรุดลงกับพื้น ทำอาวุธของ [sc_loser.GetHerHis] หลุดมือในกระบวนการ [sc_loser.GetSheHe] เหนื่อยมากจนต้องใช้การเตะอย่างระมัดระวังพอสมควร เพื่อให้ยอมแพ้อย่างเป็นทางการ"
 single_combat.0041.desc.sc_attacker.confident_attack.injury:0 "[sc_loser.GetFirstNameNoTooltip] พยายามอย่างสุดความสามารถที่จะปัดป้องข้า แต่ [sc_loser.GetSheHe] อยู่ในฝ่ายรับโดยสิ้นเชิง และการป้องกันของ [sc_loser.GetHerHis] ก็อ่อนแอลงและสะเพร่าลงเรื่อยๆ กับทุกการโจมตี\n\nเมื่อโอกาสมาถึง ข้าก็ปัด [sc_loser.Custom('signature_weapon')] ของ [sc_loser.GetHerHis] ลอยไปด้วย [sc_victor.Custom('SignatureWeaponAttemptedHeavy')] เพียงครั้งเดียว และ เช่นนั้น การประลองก็ตัดสินแล้ว\n\nข้าได้รับการยอมแพ้ก่อนที่ข้าจะทันเหวี่ยงกลับเสียอีก"
 single_combat.0041.desc.sc_attacker.expert_onslaught.injury:0 "การโจมตีแล้วโจมตีเล่า ข้าทุบคู่ต่อสู้ข้าจนยอมจำนนเปื้อนเลือดและมึนงง ทุบ [sc_loser.GetHerHim] ลงกับพื้นด้วยความโกรธเกรี้ยวทั้งหมดที่ [sc_victor.GetFaith.WarGodName] สามารถมอบให้ข้าได้\n\nเมื่อเหลือเพียงกอง [sc_loser.GetWomanMan] ที่สั่นเทาและเลือดออก ข้าสงสัยว่าข้าทำเกินไปหรือไม่ จากนั้น [sc_loser.GetFirstNameNoTooltip] ก็ไอแรงพอที่จะเสียการควบคุม [sc_loser.Custom('signature_weapon')] ของ [sc_loser.GetHerHis] และข้าก็ถอนหายใจอย่างโล่งอกเล็กน้อย\n\nเมื่อความกังวลหายไป ข้าก็เตะอาวุธศัตรูข้าออกไป และวางอาวุธข้าลงบนคอของ [sc_loser.GetHerHis] ต้องใช้ความพยายามสองสามครั้ง แต่ในที่สุด [sc_loser.GetFirstNameNoTooltip] ก็เปล่งเสียงยอมแพ้ออกมา"
 single_combat.0041.desc.sc_attacker.attempt_disarm.injury:0 "นั่น... ผ่านไปอย่างราบรื่นอย่างน่าประหลาดใจ เมื่อพิจารณาจากทุกสิ่ง [sc_loser.GetFirstNameNoTooltip] และข้าเพียงแค่จ้องหน้ากันอย่างน่าอึดอัด: [sc_loser.GetSheHe] ไม่แน่ใจว่าจะวิ่งตามอาวุธหรือยอมแพ้ ข้า ไม่ได้เตรียมพร้อมสำหรับการดำเนินการที่สมบูรณ์แบบ เช่นนี้\n\nพูดถึงเรื่องนั้น ข้าดับความคิดใดๆ ที่ [sc_loser.GetFirstNameNoTooltip] อาจมีเกี่ยวกับการต่อสู้ต่อไปด้วยการเลิกคิ้วและ [sc_victor.Custom('SignatureWeaponAction')] [sc_victor.Custom('signature_weapon')] ข้า\n\nการยอมแพ้นั้นน่าอับอาย แต่รวดเร็ว"
 ### No need for a lightning_assault, as you can't end the duel in the first round.
 single_combat.0041.desc.sc_attacker.tire_opponent.injury:0 "ต้องให้เครดิต [sc_loser.GetFirstNamePossessiveNoTooltip] มันใช้เวลานานกว่าที่ข้าคิดไว้ แต่ในที่สุดระยะเวลาอันยาวนานของการประลองเราก็เริ่มส่งผลกระทบต่อ [sc_loser.GetHerHim] อย่างเห็นได้ชัด\n\nข้าปล่อยไว้อีกสักพัก เพื่อให้แน่ใจ ยั่วยุศัตรูข้าให้โจมตีต่อไปด้วย [sc_victor.Custom('SignatureWeaponAttemptedLightPlural')] เป็นครั้งคราว จากนั้นก็ตี [sc_loser.Custom('signature_weapon')] ออกจากมือของ [sc_loser.GetHerHis] ด้วย [sc_victor.Custom('SignatureWeaponAttemptedHeavy')] เพียงครั้งเดียว\n\nหมดแรง [sc_loser.GetFirstNameNoTooltip] ยอมแพ้ จากนั้นก็เซหน้าคว่ำลงไปใน [sc_defender.Custom('GroundType')]"
 single_combat.0041.desc.sc_attacker.reason_you_suck_speech.injury:1 "ทีละบรรทัด ข้าค่อยๆ ชอนไชเข้าไปในอัตตาของ [sc_loser.GetHerHis] และฉลองความไม่มั่นคงของ [sc_loser.GetHerHis] จนกระทั่งการป้องกันของ [sc_loser.GetHerHis] อ่อนลงจากความหงุดหงิดล้วนๆ\n\nเพียงเมื่อความรำคาญของ [sc_loser.GetFirstNamePossessiveNoTooltip] ถึงขีดสุด ข้าจึงพุ่งไปข้างหน้า ฉีก [sc_loser.Custom('signature_weapon')] ของ [sc_loser.GetHerHis] ออกไปด้วย [sc_victor.Custom('SignatureWeaponAttemptedLight')]\n\nความคิดเห็นสุดท้ายเกี่ยวกับความแน่วแน่ของ [sc_loser.GetHerHis] ภายใต้แรงกดดัน จากนั้นข้ารอการยอมแพ้อันขมขื่น ขมขื่น น้ำตาเค็มไม่เคยหอมหวานเท่านี้มาก่อน"
 single_combat.0041.desc.sc_attacker.technique_from_legend.injury:0 "จากนั้น อย่างไรก็ตาม ทุกอย่างก็... ได้ผล ข้าปัดการป้องกันของ [sc_loser.GetFirstNamePossessiveNoTooltip] ออกไปอย่างง่ายดาย ปัด [sc_loser.Custom('signature_weapon')] ออกจากมือของ [sc_loser.GetHerHis] และส่ง [sc_loser.GetHerHim] ร่วงลงกับพื้น\n\nก่อนที่ข้าจะรู้ตัว ข้าก็เตรียมพร้อมที่จะ [sc_victor.Custom2('SignatureWeaponKillTypeGroinThirdPersonFutureGendered',SCOPE.sC('sc_loser'))] ประหลาดใจ สับสน และหวาดกลัวมากขึ้นเรื่อยๆ สิ่งที่ [sc_loser.GetFirstNameNoTooltip] ทำได้คือเปล่งเสียงยอมแพ้ออกมาอย่างตะกุกตะกัก"
 single_combat.0041.desc.sc_attacker.like_a_viper.injury:0 "[sc_loser.GetFirstNameNoTooltip] คาดว่าเห็นชีวิต [sc_loser.GetHerHis] แวบผ่านหน้า [sc_loser.GetHerHis] ขณะที่อาวุธข้าพุ่งเข้าหาหัวใจ [sc_loser.GetHerHis] รีบปัดป้อง\n\nข้าอนุญาตให้ตัวเองยิ้มอย่างคดเคี้ยว เกี่ยวอาวุธข้าเข้ากับ [sc_loser.GetHerHis] อย่างงุ่มง่าม และด้วยการสะบัดอย่างแรง เปลี่ยนการสังหารเป็นการปลดอาวุธ [sc_loser.Custom('signature_weapon')] ของ [sc_loser.GetFirstNamePossessiveNoTooltip] ลอยออกไปและหายไปในอากาศ\n\nเมื่อการประลองชนะแล้ว ข้าก็แสดงท่าทีโอ้อวดพอสมควรโดยวาง [sc_victor.Custom('SignatureWeaponTipType')] ของอาวุธข้าลงบนหัวใจศัตรูข้า การยอมแพ้เกือบจะเร็วเท่ากับการโจมตีด้วย [sc_victor.Custom('signature_weapon')] ครั้งแรกข้า"
 single_combat.0041.desc.sc_attacker.pocket_silver.injury:0 "\n\nแม้ [sc_loser.GetFirstNameNoTooltip] จะสามารถหลบสิ่งที่ขว้างมาได้ ข้าก็ใช้เวลาในการนำ [sc_victor.Custom('signature_weapon')] ข้ามาใช้ #EMP อยู่ใน#! วงป้องกันของ [sc_loser.GetHerHis] กระแทก [sc_victor.Custom('SignatureWeaponTipType')] [sc_victor.Custom('SignatureWeaponTipAdjective')] ของมันเข้ากับคอหอยของ [sc_loser.GetWomanMan]\n\n[sc_loser.GetFirstNameNoTooltip] ไม่ยอมแพ้ทันที ชั่วขณะหนึ่ง ดูเหมือนว่า [sc_loser.GetSheHe] อาจจะลองทำอะไรบางอย่างกับอาวุธของ [sc_loser.GetHerHis] เอง แต่การขมวดคิ้วและการเปลี่ยนน้ำหนักข้า ทำให้ชัดเจนว่านั่นสามารถจบลงได้ทางเดียวเท่านั้น\n\nข้าได้รับการยอมแพ้"
 single_combat.0041.desc.sc_attacker.martial_voice.injury:0 "[sc_loser.GetFirstNameNoTooltip] ตกใจอย่างสิ้นเชิงเมื่อข้าเปลี่ยนจากการตะโกนเสียงดังเป็นการ [sc_victor.Custom('SignatureWeaponAttemptedHeavy')] กระโดดถอยหลังด้วยความกลัวตามสัญชาตญาณ\n\nสัญชาตญาณนั้นเร็ว แต่มันขาดความคล่องแคล่ว และศัตรูข้าก็แสดงให้เห็นสิ่งนี้โดยทำ [sc_loser.Custom('signature_weapon')] ของ [sc_loser.GetHerHis] หล่นขณะ [sc_loser.GetSheHe] กระโดดหนี\n\nข้าเตรียมพร้อมสำหรับการสังหารแล้วเมื่อ [sc_loser.GetFirstNameNoTooltip] ยอมแพ้อย่างเร่งรีบ"
 single_combat.0041.desc.sc_attacker.mocking_boast.injury:0 "เปิดช่องว่างในการป้องกันของพวกเขา คำทำนายที่สมหวังด้วยตัวเองอย่างแท้จริง แม้จะได้รับความช่วยเหลือเล็กน้อยก็ตาม\n\nจากนั้น การโจมตีอย่างมั่นคงเพียงครั้งเดียวเข้าที่มือข้างที่ถือ [sc_loser.Custom('signature_weapon')] ของ [sc_loser.GetFirstNamePossessiveNoTooltip] ก็ ทำให้อาวุธของ [sc_loser.GetHerHis] หลุดมือไป ข้าหมุน [sc_victor.Custom('signature_weapon')] ข้าเองด้วยลีลา เตรียมพร้อมที่จะ [sc_victor.Custom2('SignatureWeaponKillTypeThirdPersonFutureGendered',SCOPE.sC('sc_loser'))] ข้าอดไม่ได้ที่จะเหน็บแนมครั้งสุดท้าย\n\n"เอาล่ะ ผู้แพ้จะพูดว่าอะไร?"\n\nยอมแพ้ ปรากฏว่า ยอมแพ้ ยอมแพ้ ยอมแพ้"
 ### No need for an is_that_a_crocodile, as it's never just an injury.
 single_combat.0041.desc.sc_attacker.desert_warrior.injury: "ทิ้งให้ [sc_loser.GetFirstNameNoTooltip] โซซัดโซเซอยู่บนขอบแห่งความอ่อนล้า\n\nข้าโจมตีก็ต่อเมื่อความร้อนที่แผดเผาได้บั่นทอน[sc_loser.GetHerHim]จนแทบหมดสิ้น พุ่งเข้าโจมตีด้วย[sc_victor.Custom('SignatureWeaponAttemptedLightPlural')]เป็นชุด ซึ่งเหวี่ยงคู่ต่อสู้ของข้าไปยัง [sc_defender.Custom('GroundType')]\n\nเมื่อ[sc_loser.GetFirstNameNoTooltip]กลิ้งตัวหงายหลังของ[sc_loser.GetHerHis]ได้ ข้าก็ได้เตรียม[sc_victor.Custom('signature_weapon')]ของข้าพร้อมที่จะ [sc_victor.Custom2('SignatureWeaponKillTypeThirdPersonFutureGendered',SCOPE.sC('sc_loser'))] แล้ว [sc_loser.GetSheHe|U] บ้วน [sc_defender.Custom('GroundType')] ออกจากปากแล้วยอมจำนน"
 single_combat.0041.desc.sc_attacker.jungle_stalker.injury:0 "การเตะอย่างรวดเร็วเข้าที่เป้า ทำให้คู่ต่อสู้ข้าล้มลง กรีดร้อง ลงไปในพงหญ้า [sc_loser.GetFirstNameNoTooltip] ดิ้นรนในตอนแรก แต่หยุดนิ่งอย่างรวดเร็วเมื่อข้าวาง [sc_victor.Custom('SignatureWeaponTipType')] ของ [sc_victor.Custom('signature_weapon')] ข้าลงบน [sc_loser.Custom('MaskFace')] ของ [sc_loser.GetHerHis] อย่างเรียบๆ\n\nการยอมแพ้ใช้เวลาไม่นานเลย"
 single_combat.0041.desc.sc_attacker.open_terrain_expert.injury:0 "ในที่สุด [sc_loser.GetFirstNameNoTooltip] ก็สะดุดจากความอ่อนล้าอย่างแท้จริง และข้าก็เข้าปฏิบัติการด้วย [sc_victor.Custom('SignatureWeaponAttemptedHeavy')] ที่เหวี่ยง [sc_loser.GetHerHim] ลงกับพื้น\n\nคู่ต่อสู้ข้าพยายามโซเซลุกขึ้นยืน แต่การต่อสู้ก็จางหายไปสู่ความตื่นตระหนกเมื่อข้านำรองเท้าบู๊ตข้าลงบนศีรษะของ [sc_loser.GetHerHis]\n\nข้ายก [sc_victor.Custom('signature_weapon')] ข้าเพื่อ [sc_victor.Custom2('SignatureWeaponKillTypeHeadThirdPersonFutureGendered',SCOPE.sC('sc_loser'))] และได้รับการยอมแพ้ที่มึนงงเป็นการตอบแทน"
 single_combat.0041.desc.sc_attacker.rough_terrain_expert.injury.rocky:0 "ครั้งแล้วครั้งเล่า ข้าผลัก [sc_loser.GetFirstNameNoTooltip] ถอยหลัง และครั้งแล้วครั้งเล่า [sc_loser.GetSheHe] ก็สามารถฟื้นตัวได้ในวินาทีสุดท้าย อย่างน้อยก็ จนกระทั่ง [sc_loser.GetSheHe] ทำไม่ได้ และถูกส่งกลิ้งถอยหลังข้ามทางลาดเล็กๆ\n\nข้ารีบตามศัตรูข้าไป และมี [sc_victor.Custom('signature_weapon')] ข้ากดอยู่ที่หลังคอของ [sc_loser.GetHerHis] ก่อนที่ [sc_loser.GetSheHe] จะรวบรวมสติ [sc_loser.GetHerselfHimself] ได้ การยอมแพ้ที่ค่อนข้างบอบช้ำถูกเสนอให้โดยไม่ลังเล"
 single_combat.0041.desc.sc_attacker.rough_terrain_expert.injury.boggy:0 "ต้องใช้ความพยายามพอสมควร แต่ในที่สุด ข้าก็สามารถผลัก [sc_loser.GetFirstNameNoTooltip] ลงไปในสระน้ำหนองเหม็นที่ลึกถึงเข่าได้ [sc_loser.GetSheHe|U] ลื่น ทำ [sc_loser.Custom('signature_weapon')] ของ [sc_loser.GetHerHis] หลุดมือขณะไป และตกลงไปใต้น้ำพร้อมเสียงน้ำกระจายที่น่ารังเกียจ\n\nมันง่ายพอที่จะวางรองเท้าบู๊ตข้าเหนือ [sc_loser.Custom('MaskFace')] ของ [sc_loser.GetHerHis] จากพื้นแข็ง และภัยคุกคามจากการขาดอากาศหายใจในหนองน้ำเหม็นเน่าก็ ทำให้ข้าได้รับการยอมแพ้อย่างรวดเร็ว แม้จะอู้อี้บางส่วนก็ตาม"
 single_combat.0041.desc.sc_attacker.forest_fighter.injury:0 "สานผ่านและรอบๆ พุ่มหนามและต้นไม้ในป่าด้วยความบ้าคลั่ง\n\n[sc_loser.GetFirstNameNoTooltip] ไม่เคยเห็นแม้ แต่ตอไม้เน่าที่ข้าต้อน [sc_loser.GetHerHim] ไปหา สะดุดล้มหงายหลังพร้อมเสียงร้องประหลาดใจ ส่ง [sc_loser.Custom('signature_weapon')] ของ [sc_loser.GetHerHis] ลื่นไถลออกไปในพงหญ้า\n\nการเตะอย่างแรงเข้าที่หน้าอกและ [sc_victor.Custom('SignatureWeaponAttemptedHeavy')] ครั้งสุดท้ายคือทั้งหมดที่จำเป็น เพื่อให้ยอมแพ้หลังจากนั้น"
 single_combat.0041.desc.sc_attacker.raaargh.injury:0 "พุ่งไปข้างหน้าเหมือน [sc_victor.GetWomanMan] ที่ถูกสิง ข้าทำลายการป้องกันศัตรูข้าและฉีก [sc_loser.Custom('signature_weapon')] ออกจากมือของ [sc_loser.GetHerHis] ด้วย [sc_victor.Custom('SignatureWeaponAttemptedHeavy')] \n\nเร็วกว่าที่ข้าจะเห็น แรงพอที่กระดูก #EMP ของข้า#! สั่นสะเทือน ข้าระดมโจมตีด้วยความเกลียดชังที่เหวี่ยง [sc_loser.GetHerHim] ลงกับพื้นได้อย่างง่ายดาย\n\nเร็วเท่าที่มันมาถึงข้า ความโกรธข้าก็ระเหยไป ทิ้งให้ข้าสั่น แต่มีสติ [sc_loser.GetFirstNameNoTooltip] แทบจะกรีดร้องยอมแพ้ขณะที่ [sc_loser.GetSheHe] ยังทำได้"
 single_combat.0041.desc.sc_attacker.hard_grit.injury:0 "ไม่นานนัก ข้าก็สามารถปัด [sc_loser.Custom('signature_weapon')] ออกจากมือของ [sc_loser.GetHerHis] ได้ด้วย [sc_victor.Custom('SignatureWeaponAttemptedLight')] ที่วางไว้อย่างดี\n\n[sc_loser.GetFirstNameNoTooltip] ตกตะลึงชั่วครู่ แต่เปล่งเสียงยอมแพ้ออกมาก่อนที่ข้าจะ [sc_victor.Custom2('SignatureWeaponKillTypeThirdPersonFutureGendered',SCOPE.sC('sc_loser'))]"
 single_combat.0041.desc.sc_attacker.feint_and_stab.injury:0 "แล่นไปที่ [sc_loser.Custom('MaskFace')] ของ [sc_loser.GetHerHis] โดยเอาด้ามเข้าหาก่อน\n\nการโจมตีโดน [sc_loser.GetFirstNameNoTooltip] อย่าง #EMP แรง#! กระแทกลึกจนข้าสาบานได้ว่าข้ารู้สึกถึงกระดูกช้ำ และ [sc_loser.GetSheHe] ก็โซเซถอยหลังอย่างมึนงง\n\nเมื่อ [sc_loser.Custom('signature_weapon')] หล่นจากมือของ [sc_loser.GetHerHis] คู่ต่อสู้ข้าก็เปล่งเสียงยอมแพ้ออกมาโดยที่ข้าไม่ต้องทำอะไรเลย"
 single_combat.0041.desc.sc_attacker.butchery.injury:0 "[sc_loser.GetFirstNameNoTooltip] โซเซและทรุดลงกับการโจมตี แต่ละครั้ง แต่ระลอกความเจ็บปวดอันน่าพึงพอใจ แต่ละครั้งที่ไหลผ่าน [sc_loser.GetHerHim] เพียงกระตุ้นให้ข้าต่อสู้หนักขึ้น\n\nเมื่อถึงเวลาที่ [sc_loser.GetSheHe] ทรุดลง [sc_loser.GetSheHe] ก็หอบหายใจและบ้วนเลือดข้นเหนียวออกมา\n\nข้าเตรียมพร้อมที่จะ [sc_victor.Custom2('SignatureWeaponKillTypeRearHeadThirdPersonPresentGendered',SCOPE.sC('sc_loser'))] อย่างสบายๆ ข้าเกือบจะผิดหวังที่ได้ยินเสียงยอมแพ้อันทรมานก่อนที่ [sc_victor.Custom('signature_weapon')] ข้าจะทันลง"
 single_combat.0041.desc.sc_attacker.stoic_veteran.injury:0 "สิ่งที่ [sc_loser.GetFirstNameNoTooltip] ทำได้คือตามข้าให้ทัน จนกระทั่งการโจมตีครั้งหนึ่งของข้าโดน [sc_loser.Custom('signature_weapon')] ของ [sc_loser.GetHerHis] อย่างแรงจนมัน [sc_loser.Custom('SignatureWeaponBreaksThirdPersonSingularPresent2')]\n\nตะกุกตะกัก ไร้อาวุธ ศัตรูข้าถอยหลังไปสองสามก้าวขณะที่ความเป็นจริงเริ่มเข้ามา\n\nเป็นการยอมแพ้อย่างรวดเร็ว"
 single_combat.0041.desc.sc_attacker.blade_dance.injury:0 "มีศิลปะในการต่อสู้ที่แท้จริง และข้าก็ไม่มีอะไรเลยหากไม่ใช่ศิลปิน\n\nเพียงเมื่อ [sc_loser.GetFirstNameNoTooltip] ถูกทุบตีจนเกือบหมดสติ ข้าจึงโจมตีครั้งสุดท้าย ปลดอาวุธ [sc_loser.GetHerHim] ด้วย [sc_victor.Custom('SignatureWeaponAttemptedHeavy')] ที่ราบรื่นเพียงครั้งเดียว ซึ่งส่ง [sc_loser.Custom('signature_weapon')] ของ [sc_loser.GetWomanMan] ลอยไป\n\nข้าเตรียมตัวเอง ทั้งทางจิตใจและร่างกาย เพื่อ [sc_victor.Custom2('SignatureWeaponKillTypeThirdPersonFutureGendered',SCOPE.sC('sc_loser'))] หยุดอย่างสมบูรณ์แบบในวินาทีที่คู่ต่อสู้ข้ายอมแพ้"
 single_combat.0041.desc.sc_attacker.wrath_of_highgod.injury:0 "ศัตรูข้าเห็นได้ชัดว่าคิดว่าคำสวดภาวนาจะยาวกว่าที่เป็นอยู่ เพราะ [sc_loser.GetSheHe] ถูก ทำให้ประหลาดใจอย่างสิ้นเชิงเมื่อข้าเปลี่ยนไปใช้ [sc_victor.Custom('SignatureWeaponAttemptedHeavy')] อย่างราบรื่น ซึ่งเกือบจะ ทำให้ [sc_loser.GetHerHim] ล้มลงกับพื้น\n\nขณะที่ [sc_loser.GetFirstNameNoTooltip] ตั้งตัว [sc_loser.GetHerselfHimself] ข้าก็กวาดไปข้างหน้า เลื่อน [sc_victor.Custom('SignatureWeaponTipType')] ของ [sc_victor.Custom('signature_weapon')] ข้าขึ้นมาใกล้นิ้วเดียวจาก [sc_loser.Custom('MaskFace')] ของ [sc_loser.GetHerHis]\n\nการยอมแพ้ไม่เคยรู้สึกน่าพอใจมากไปกว่าเมื่อมันอุทิศให้กับ [sc_victor.GetFaith.HighGodName]"
 single_combat.0041.desc.sc_attacker.hurt_me_better.injury:0 "ช้าๆ ความทรมานและอะดรีนาลีนก็หมุนวนไปสู่จุดสูงสุด ข้าเปล่งเสียงคำรามอันทรงพลังและพุ่งเข้าสู่คลื่น [sc_victor.Custom('SignatureWeaponAttemptedHeavyPlural')] ที่ผลัก [sc_loser.GetFirstNameNoTooltip] ลงคุกเข่า\n\nคู่ต่อสู้ข้าพยายามปัดป้อง ล้มเหลวโดยสิ้นเชิงที่จะสังเกตเห็นเข่าข้าลอยตรงเข้า [sc_loser.Custom('MaskFace')] ของ [sc_loser.GetHerHis] [sc_loser.GetSheHe|U] ทรุดลงหงายหลัง หอบหายใจ\n\n[sc_loser.GetFirstNameNoTooltip] ยังคงหอบหายใจเมื่อ [sc_loser.GetSheHe] เปล่งเสียงยอมแพ้ออกมาในไม่กี่วินาทีต่อมา ตาจับจ้องอยู่ที่ [sc_victor.Custom('signature_weapon')] ข้าที่กำลังทิ่มลงมา"
 single_combat.0041.desc.sc_attacker.special_fallback.injury:0 "ดูเหมือนว่าจะ ทำให้ [sc_loser.GetHerHim] ไม่ทันตั้งตัว และ [sc_loser.GetSheHe] ก็สะดุด อย่างแรง\n\nข้าใช้โอกาสนี้วาง [sc_victor.Custom('SignatureWeaponTipType')] ของ [sc_victor.Custom('signature_weapon')] ข้าลงบนใบหน้าของ [sc_loser.GetFirstNamePossessiveNoTooltip] อย่างนุ่มนวล\n\nข้าได้รับการยอมแพ้ทันทีที่ความตกตะลึงหายไป"
 single_combat.0041.desc.sc_attacker.something_to_hide.injury:0 "ขณะที่ [sc_loser.GetFirstNameNoTooltip] ยืนเหม่อลอย ข้าก็ปล่อย [sc_victor.Custom('SignatureWeaponAttemptedLight')] ที่เหวี่ยง [sc_loser.GetHerHim] ถอยหลัง จากนั้นการโจมตีครั้งที่สองก็กระชาก [sc_loser.Custom('signature_weapon')] ออกจากมือของ [sc_loser.GetHerHis]\n\nไร้อาวุธ อยู่ในระยะ [sc_victor.Custom('SignatureWeaponWoundVerb1PresentParticiple')] ง่ายๆ และห่างจากความตายในมือข้าเพียงไม่กี่วินาที [sc_loser.GetFirstNameNoTooltip] ก็ยอมแพ้"

 ## Aggressor Won, Own Combat Move Fatality
 single_combat.0041.desc.sc_attacker.wait_and_hope.fatality:0 "ถึงกระนั้นก็ผ่านการป้องกันของ [sc_loser.GetFirstNamePossessiveNoTooltip] ไปอย่างตรงๆ และ [sc_victor.Custom2('SignatureWeaponKillTypeTorsoThirdPersonActiveGendered',SCOPE.sC('sc_loser'))]\n\nศัตรูข้าโซเซถอยหลังอย่างงุ่มง่าม ดึง [sc_victor.Custom('signature_weapon')] ข้าออกมาพร้อมเสียงเปียกแฉะน่าขยะแขยง เลือดเอ่อล้น จากนั้นก็ท่วมทะลักออกจากบาดแผล ทำให้พื้นดินรอบตัว [sc_loser.GetHerHim] ชุ่มโชก ปากของ [sc_loser.GetWomanMan] กระตุกและห้อยลง กระตุกราวกับพยายามเปล่งคำพูดผ่านความเจ็บปวด\n\n[sc_loser.GetFirstNameNoTooltip] ดูตกใจพอๆ กับข้า"
 single_combat.0041.desc.sc_attacker.unsure_attack.fatality:0 "สุดชีวิตข้า ข้าไม่สามารถชี้ชัดได้ว่า #EMP ตรงไหน#! ที่มันโดน [sc_loser.GetFirstNameNoTooltip] แต่มันต้องโดนแน่ๆ เพราะ [sc_loser.GetSheHe] สะดุดถอยหลังจากแรงปะทะ เลือดไหลทะลักจากที่ไหนสักแห่งบนหน้าอกของ [sc_loser.GetHerHis] เลือดที่ [sc_loser.GetSheHe] หยุดจ้องมองด้วยความไม่เชื่อ\n\nข้ารู้ว่าเรื่องนี้จะจบลงอย่างไร และปฏิเสธที่จะเสี่ยงให้คู่ต่อสู้พาข้าลงหลุมศพไปพร้อมกับ [sc_loser.GetHerHim] [sc_victor.Custom('signature_weapon')|U] ชูสูง ข้าพุ่งไปข้างหน้าเพื่อสังหาร"
 single_combat.0041.desc.sc_attacker.enthusiastic_onslaught.fatality:0 "ความกระตือรือร้นสามารถชดเชยได้หลายสิ่ง และที่นี่มันสามารถทดแทนทักษะได้อย่างสิ้นเชิง ฉีก [sc_loser.Custom('signature_weapon')] ออกจากมือของ [sc_loser.GetFirstNamePossessiveNoTooltip] ด้วยพลังดิบเพียงอย่างเดียว\n\nข้าไม่เสียเวลาในการก้าวไปยังคู่ต่อสู้ที่ถูกปลดอาวุธ ผู้ ซึ่งกำลังป้องกัน [sc_loser.GetHerselfHimself] ด้วย [sc_loser.Custom('HandHands')] ของ [sc_loser.GetHerHis] อยู่แล้ว และด้วยประสิทธิภาพอันไร้ความปรานี ข้า [sc_victor.Custom2('SignatureWeaponKillTypeGroinThirdPersonFutureGendered',SCOPE.sC('sc_loser'))]\n\nเสียงกรีดร้องหยุดลงนานก่อนที่กระแสเลือดจะหยุด"
 single_combat.0041.desc.sc_attacker.hail_mary.fatality:0 "จนกระทั่งข้าพุ่งเข้าใส่แล้ว ข้าจึงตระหนักว่าข้าโจมตีสูงเกินไป ด้วยความตื่นตระหนก ข้าพยายามเหวี่ยงอาวุธข้าต่ำลง และการกระตุกที่ไม่คาดคิดของการเคลื่อนไหวก็กระชากผ่านการป้องกันของ [sc_loser.GetFirstNamePossessiveNoTooltip] และลงตรงที่กะโหลกศีรษะของ [sc_loser.GetHerHis]\n\nการโจมตี [sc_victor.Custom('SignatureWeaponWoundVerb1ThirdPersonPresent')] ตรงผ่านกระดูกและเข้าสู่สมอง สังหาร [sc_loser.GetHerHim] ทันที\n\nชั่วขณะหนึ่ง ศพของ [sc_loser.GetFirstNamePossessiveNoTooltip] โซเซและโอนเอน ถูกยึดไว้ด้วยแขนข้างที่ถือ [sc_victor.Custom('signature_weapon')] ข้า ก่อนที่จะทรุดลงไปใน [sc_defender.Custom('GroundType')] อย่างงุ่มง่าม"
 single_combat.0041.desc.sc_attacker.pocket_sand.fatality:0 "และข้าก็ฉวยโอกาสจากช่องว่างชั่วขณะนั้นกระแทก [sc_victor.Custom('signature_weapon')] ข้าเข้าที่ท้องของ [sc_loser.GetWomanMan] แรงที่สุดเท่าที่ข้าจะทำได้\n\nขณะที่ [sc_loser.GetFirstNameNoTooltip] ล้มหงายหลัง ตาบอดและเลือดออก ข้าพุ่งเข้าสังหาร ซึ่งเฉือนลึกเข้าไปในเส้นคอของ [sc_loser.GetHerHis] เนื้อฉีกขาดเหมือนเนื้อที่เขียง สาดเลือดอุ่นๆ ใส่เราทั้งคู่\n\n[sc_loser.GetSheHe|U] ตายภายในหนึ่งนาทีหลังจากกระแทกพื้น"
 single_combat.0041.desc.sc_attacker.nut_em.fatality:0 "เช่นเดียวกับการโขกศีรษะทุกครั้ง มันเกือบจะเจ็บปวดสำหรับข้าพอๆ กับ [sc_loser.GetHerHim] แต่ [sc_loser.GetFirstNameNoTooltip] ดู... ผิดปกติไป หลังจากนั้น ราวกับว่าการโจมตี ทำให้จิตใจของ [sc_loser.GetHerHis] สับสน\n\nหลังจาก [sc_victor.Custom('SignatureWeaponAttemptedLightPlural')] สองสามครั้งเพื่อทดสอบการป้องกันคู่ต่อสู้ข้า ข้าก็เสี่ยง [sc_victor.Custom('SignatureWeaponAttemptedHeavy')] การโจมตี [sc_victor.Custom('SignatureWeaponWoundVerb1ThirdPersonPresent')] ลึกเข้าไปในไหล่ของ [sc_loser.GetHerHis] ทะลุผ่านไปยังเนื้อส่วนสำคัญของช่องอก\n\nเลือดและเศษกระดูกที่แตกละเอียดพุ่งออกมาจากบาดแผลขณะข้าดึง [sc_victor.Custom('signature_weapon')] ข้าออกมา [sc_loser.GetFirstNameNoTooltip] โซเซ โอนเอน ล้มลง และแน่นิ่งไป"
 single_combat.0041.desc.sc_attacker.guard.fatality:0 "จนกระทั่งการโจมตีที่ตัดสินผิดพลาด ทำให้ข้าปัด [sc_loser.Custom('signature_weapon')] ของ [sc_loser.GetHerHis] กระเด็นไป\n\nก่อนที่ [sc_loser.GetFirstNameNoTooltip] จะคัดค้านได้ ข้าก็เริ่มชุด [sc_victor.Custom('SignatureWeaponAttemptedLightPlural')] เรียกร้องค่าชดเชยเป็นเลือดและความเจ็บปวดสำหรับการตัดสินที่ผิดพลาดของ [sc_loser.GetHerHis]\n\nไม่นานนักศัตรูข้าก็ถูกผลักลงคุกเข่า [sc_loser.Custom('MaskFace')] เปรอะเปื้อนไปด้วยเชือกน้ำลายปนเลือด ด้วยความสงวนท่าทีทั้งหมดของเพชฌฆาต ในที่สุดข้าก็ [sc_victor.Custom2('SignatureWeaponKillTypeThirdPersonFutureGendered',SCOPE.sC('sc_loser'))]"
 single_combat.0041.desc.sc_attacker.probing_attack.fatality:0 "ค่อยๆ ข้าบั่นทอนรูปแบบของ [sc_loser.GetFirstNamePossessiveNoTooltip] ลงทีละน้อย จนกระทั่งข้าสามารถ ทำให้ [sc_loser.GetHerHim] ลอยไปด้วย [sc_victor.Custom('SignatureWeaponAttemptedLight')]\n\nวินาทีที่ศัตรูข้าอยู่ในอากาศ ข้าทุ่มน้ำหนักทั้งหมดลงใน [sc_victor.Custom('SignatureWeaponAttemptedHeavy')] ที่เชื่อมต่อทันทีที่ [sc_loser.GetSheHe] กระแทกพื้น [sc_victor.Custom2('SignatureWeaponKillTypeRearTorsoThirdPersonPresentParticipleGendered',SCOPE.sC('sc_loser'))] ด้วยการโจมตีอย่างรุนแรงครั้งเดียว\n\n[sc_loser.GetFirstNameNoTooltip] สิ้นใจอย่างรวดเร็ว"
 single_combat.0041.desc.sc_attacker.onslaught.fatality:0 "การโจมตี แต่ละครั้งพรากบางสิ่งไปจาก [sc_loser.GetHerHim]: ท่าทางของ [sc_loser.GetHerHis] อากาศในปอดของ [sc_loser.GetHerHis] [sc_loser.Custom('signature_weapon')] ของ [sc_loser.GetHerHis] ชิ้นเนื้อของ [sc_loser.GetHerHis]\n\nเมื่อ [sc_loser.GetSheHe] เกือบจะไร้ทางสู้โดยสิ้นเชิงเท่านั้น ข้าจึงปล่อยให้อาวุธข้า [sc_victor.Custom('SignatureWeaponWoundVerb2')] เข้าที่หน้าอกของ [sc_loser.GetFirstNamePossessiveNoTooltip] อย่างถึงแก่ชีวิต\n\n[sc_loser.GetSheHe|U] ดูเหมือนจะไม่ค่อยซาบซึ้งในความเมตตา ชักกระตุกอย่างอ่อนแรงขณะ [sc_loser.GetSheHe] ล้มหงายหลังลงไปในแอ่งเลือดในชีวิตของ [sc_loser.GetHerHis] ที่แผ่กว้างออกไป"
 single_combat.0041.desc.sc_attacker.surprise_attack.fatality:0 "มากเสียจนเห็นได้ชัดว่า [sc_loser.GetSheHe] เสียการควบคุม [sc_loser.Custom('signature_weapon')] ของ [sc_loser.GetHerHis] ซึ่งลื่นไถลออกไปใน [sc_defender.Custom('GroundType')] ไม่ปล่อยให้ความได้เปรียบหลุดลอยไป ข้ากระโดดไปข้างหน้า [sc_victor.Custom2('SignatureWeaponKillTypeThirdPersonPresentParticipleGendered',SCOPE.sC('sc_loser'))] ในการเคลื่อนไหวอย่างราบรื่นครั้งเดียว\n\n[sc_loser.GetFirstNameNoTooltip] ทรุดลงกับพื้น ชีวิตรินไหลออกไปอย่างรวดเร็ว [sc_loser.GetSheHe|U] ยังคงจ้องมองข้าตรงๆ ใน [sc_victor.Custom('EyeEyes')] จนถึงวาระสุดท้าย"
 single_combat.0041.desc.sc_attacker.taunt.fatality:0 "จนในที่สุด [sc_loser.GetFirstNameNoTooltip] ก็โกรธจัดจนการป้องกันของ [sc_loser.GetHerHis] แตกสลายโดยสิ้นเชิงด้วยความโมโห\n\nเมื่อมีเส้นทางเปิดสู่ท้องของ [sc_loser.GetHerHis] ข้าตอบแทนความไม่อดทนของ [sc_loser.GetHerHis] ด้วยความตายอย่างช้าๆ"
 single_combat.0041.desc.sc_attacker.put_the_boot_in.fatality:0 "การโจมตีคู่ทำลายการป้องกันของ [sc_loser.GetFirstNamePossessiveNoTooltip] และข้าสามารถปลดอาวุธ [sc_loser.GetHerHim] ได้ก่อนด้วย [sc_victor.Custom('SignatureWeaponAttemptedLight')] จากนั้นจึงเปลี่ยนอย่างรวดเร็วเป็นการโจมตีหน้าอกที่ถึงแก่ชีวิต ซึ่งกรีดเป็นลิ่มเปื้อนเลือดตรงผ่านไปยังหัวใจของ [sc_loser.GetHerHis]\n\nมีความตายที่ช้ากว่านี้ให้ประสบ"
 single_combat.0041.desc.sc_attacker.strict_guard.fatality:0 "การโจมตีครั้งแรกทลายการป้องกันของ[sc_loser.GetFirstNamePossessiveNoTooltip]จนเกิดช่องโหว่ ครั้งที่สอง ทำให้[sc_loser.GetHerHim]ใช้แขนข้างที่ถือ[sc_loser.Custom('signature_weapon')]ของ[sc_loser.GetHerHis]ไม่ได้ คู่ต่อสู้ของข้าโซเซ สติเลือนรางท่ามกลางความเจ็บปวดที่ถาโถม\n\nข้าใช้เวลาเล็งการโจมตีครั้งต่อไป [sc_victor.Custom('SignatureWeaponWoundVerb1PresentParticiple')] ลึกเข้าไปในอกของ[sc_loser.GetWomanMan]ด้วย[sc_victor.Custom('signature_weapon')]ของข้า\n\nการโจมตีครั้งถัดมาเพียงแค่ตัดความเจ็บปวดให้สั้นลง"
 single_combat.0041.desc.sc_attacker.confident_attack.fatality:0 "เมื่อข้าตัดสินว่าถึงเวลาที่เหมาะสม ข้าก็เปลี่ยนรูปแบบข้าด้วยการฟาดด้านข้างที่ไม่คาดคิด ซึ่งโดนเข้าที่ท้องของ [sc_loser.GetFirstNameNoTooltip] อย่างจัง\n\nการโจมตีเหวี่ยงศัตรูข้าถอยหลัง บางสิ่งที่แดงและดูสำคัญเลื่อนหลุดออกมาจากรูใหม่ขณะ [sc_loser.GetSheHe] ล้มลงกับพื้น\n\nข้าเข้าใกล้ด้วยความระมัดระวัง แต่ในไม่ช้าก็เป็นที่ชัดเจนว่าความตกตะลึงกำลังเข้ามา ใช้เวลาสักครู่เพื่อเตะ [sc_loser.Custom('signature_weapon')] ของ [sc_loser.GetHerHis] ออกไปเผื่อไว้ ข้าเตรียมพร้อมที่จะปลดปล่อย [sc_loser.GetFirstNameNoTooltip] ออกจากความทุกข์ทรมานของ [sc_loser.GetHerHis]"
 single_combat.0041.desc.sc_attacker.expert_onslaught.fatality:0 "จริงๆ แล้ว น่าชื่นชมที่ [sc_loser.GetFirstNameNoTooltip] สามารถทนทานต่อการโจมตีด้วย [sc_victor.Custom('signature_weapon')] ได้มากเท่าที่ [sc_loser.GetSheHe] ทำ ขณะข้าระดมโจมตี [sc_loser.GetHerHim] ด้วยความโกรธเกรี้ยวทั้งหมดของพายุฝนฟ้าคะนอง\n\nใช้เวลาหนึ่งหรือสองนาที แต่ในที่สุดข้าก็ทุบ [sc_loser.GetHerHim] ลงเป็นกองเปื้อนเลือด บิดเบี้ยว และ #EMP กรีดร้อง#! \n\nเพียงเมื่อข้าพอใจว่าจะไม่มีโอกาสแก้แค้นในวินาทีสุดท้าย ข้าจึงทำการสังหาร"
 single_combat.0041.desc.sc_attacker.attempt_disarm.fatality:0 "ไม่ให้ความปรานี ข้าทุ่มสุดตัวเข้าสู่ [sc_victor.Custom('SignatureWeaponAttemptedHeavy')] ที่ [sc_victor.Custom('SignatureWeaponWoundVerb4ThirdPersonPresent')] ทะลุซี่โครงของ [sc_loser.GetHerHis] อย่างหมดจด\n\nข้ายังคงโจมตี [sc_loser.GetFirstNameNoTooltip] ต่อไปขณะ [sc_loser.GetSheHe] โซเซลงกับพื้น เชื่องช้าและไร้ชีวิตชีวา หยุดเพียงเมื่อการเคลื่อนไหวเดียวที่ศพทำคือจากการโจมตีข้า"
 ### No need for a lightning_assault, as you can't end the duel in the first round.
 single_combat.0041.desc.sc_attacker.tire_opponent.fatality:0 "ใช้เวลาพอสมควรก่อนที่ช่องว่างที่เหมาะสมจะเปิดขึ้นในการป้องกันของ [sc_loser.GetFirstNamePossessiveNoTooltip] แต่เมื่อมันเปิดขึ้น มันคือทั้งหมดที่ข้าต้องการ ด้วย [sc_victor.Custom('SignatureWeaponAttemptedHeavy')] เพียงครั้งเดียวจาก [sc_victor.Custom('signature_weapon')] ข้า ข้าฉีกผ่านท้องของ [sc_loser.GetHerHis] และเข้าสู่กระเพาะอาหารของ [sc_loser.GetHerHis]\n\nเลือด น้ำดี และอาหารมื้อสุดท้ายของคู่ต่อสู้ข้าไหลทะลักออกมา สาดใส่ท่อนล่างข้า และ [sc_loser.GetSheHe] ก็เปล่งเสียงกรีดร้องแสบแก้วหู\n\nมันอาจจะเป็นความเมตตา เมื่อข้ายุติความทุกข์ทรมานของ [sc_loser.GetFirstNamePossessiveNoTooltip] แต่เนิ่นๆ"
 single_combat.0041.desc.sc_attacker.reason_you_suck_speech.fatality:0 "การโจมตีของ [sc_loser.GetHerHis|U] เร่งรีบมากขึ้นเรื่อยๆ ความคับข้องใจก่อตัวขึ้นอย่างเห็นได้ชัดในความสะเพร่าของการโจมตีของ [sc_loser.GetHerHis] จนกระทั่ง [sc_loser.GetFirstNameNoTooltip] ปลดปล่อยเสียงกรีดร้องด้วยความคับข้องใจ\n\nในวินาทีนั้นเอง ข้าก็ปัดผ่านการป้องกันของ [sc_loser.GetHerHis] [sc_victor.Custom('SignatureWeaponWoundVerb5PresentParticiple')] [sc_victor.Custom('signature_weapon')] ข้าลึกเข้าไปในคอของ [sc_loser.GetHerHis]\n\nซากปรักหักพังเปื้อนเลือดที่ฉีกขาดที่เหลืออยู่หลังจากนั้นเจ็บปวดเพียงแค่มอง โชคดีที่ [sc_loser.GetFirstNameNoTooltip] ล้มตายหน้าคว่ำลง ช่วยให้เราทั้งคู่พ้นจากความทุกข์ทรมาน"
 single_combat.0041.desc.sc_attacker.technique_from_legend.fatality:0 "ด้วยความหวังมากกว่าความเชื่อ ข้าพุ่งเข้าใส่ [sc_loser.GetFirstNameNoTooltip] [sc_victor.Custom('signature_weapon')] ออกไปในการเลียนแบบเรื่องราวอย่างสมบูรณ์แบบ ตาหยีลงตามสัญชาตญาณ\n\nมีแรงกระแทกแข็งเหมือนหินกะทันหันที่ [sc_victor.Custom('signature_weapon')] ข้า เสียงเนื้อเปียกถูกเฉือนครึ่ง และอาการกระตุกแล่นผ่านแขนข้า ข้าลืมตา เกือบแน่ใจว่าจะเห็นจุดจบตัวเอง เพียงเพื่อพบกับตอคอที่ #EMP ถูกทำลายล้าง#! ของ [sc_loser.GetFirstNameNoTooltip] พ่นเลือดขึ้นไปในอากาศด้วยความบ้าคลั่งอย่างไม่บันยะบันยัง\n\nเมื่อข้าหาศีรษะของ [sc_loser.GetHerHis] พบ แสงสว่างก็ดับไปจาก [sc_loser.Custom('EyeEyes')] ของ [sc_loser.GetWomanMan] นานแล้ว"
 single_combat.0041.desc.sc_attacker.like_a_viper.fatality:0 "[sc_loser.GetFirstNameNoTooltip] รีบปัดป้อง แต่ก็ไม่ใกล้เคียงกับการหยุดข้าได้เลย\n\nข้าลอยผ่านการปิดกั้นอันอ่อนแอของ [sc_loser.GetHerHis] ไปอย่างง่ายดาย [sc_victor.Custom('SignatureWeaponTipType')] ของ [sc_victor.Custom('signature_weapon')] ทิ่มเข้าไปในหน้าอกของ [sc_loser.GetWomanMan]\n\nเสียงแตกดังและเสียงเปียกป๊อปบ่งบอกถึงกระดูกหักและอวัยวะทะลุเป็นเวลานานราวกับชั่วนิรันดร์ จนกระทั่งอาวุธข้าทะลุออกไปอีกด้านหนึ่งอย่างหมดจด\n\nแทบจะเป็นไปไม่ได้ที่จะบอกว่า [sc_loser.GetFirstNameNoTooltip] ตาย ณ จุดใดของการโจมตี"
 single_combat.0041.desc.sc_attacker.pocket_silver.fatality:0 "[sc_loser.GetFirstNameNoTooltip] หลบถุงเงิน แต่ไม่เห็นการโจมตีตามมาข้า\n\n[sc_victor.Custom('SignatureWeaponAttemptedHeavy')] โดนเข้าที่กรามของ [sc_loser.GetHerHim] อย่างจัง ฉีกเนื้อ ฟัน และกระดูกหลุดออกมา [sc_loser.GetSheHe|U] พยายามกรีดร้อง แต่ทำไม่ได้ผ่านปากที่พังยับเยินของ [sc_loser.GetHerHis]\n\nอาจกล่าวได้ว่าเป็นความเมตตาเมื่อข้าปลดปล่อย [sc_loser.GetHerHim] ออกจากความทุกข์ทรมานของ [sc_loser.GetHerHis]"
 single_combat.0041.desc.sc_attacker.martial_voice.fatality:0 "\n\nโดยไม่มีการเตือนล่วงหน้า คำหยาบคายที่ข้ากรีดร้องออกไปเปลี่ยนเป็นการ [sc_victor.Custom('SignatureWeaponAttemptedHeavy')] [sc_loser.GetFirstNameNoTooltip] ยังคงตกตะลึงในคำพูดข้าจน [sc_loser.GetSheHe] ไม่แม้ แต่จะพยายามปัดป้องการโจมตี\n\nโลหะพบกับเนื้อและกระดูก [sc_victor.Custom('SignatureWeaponWoundVerb2PresentParticiple')] ลึกเข้าไปในไหล่ศัตรูข้า เราทั้งคู่รู้ว่าการไหลของเลือดที่เกิดขึ้นนั้นหนักเกินกว่าจะรอดชีวิตได้"
 single_combat.0041.desc.sc_attacker.mocking_boast.fatality:0 "ฆ่าพวกเขา [sc_loser.GetFirstNameNoTooltip] ตกตะลึงในคำพูดข้าจน [sc_loser.GetSheHe] ไม่สามารถหยุดข้าจากการกระชาก [sc_loser.Custom('signature_weapon')] ออกจากมือของ [sc_loser.GetHerHis] ได้\n\nศัตรูข้ามีเวลาพอที่จะตระหนักว่าสิ่งต่างๆ จะจบลงอย่างไรก่อนที่ข้าจะ [sc_victor.Custom2('SignatureWeaponKillTypeThirdPersonFutureGendered',SCOPE.sC('sc_loser'))]"
 single_combat.0041.desc.sc_attacker.is_that_a_crocodile.fatality:0 "ได้พื้นที่ จนกระทั่งมันเข้าชน [sc_loser.GetHerHim] ลงกับพื้น ส่ง [sc_loser.Custom('signature_weapon')] ของ [sc_loser.GetHerHis] ลื่นไถลออกไปในกระบวนการ\n\nเวลาดูเหมือนจะอ้าปากค้างช้าและกว้างเหมือนปากของสัตว์ร้าย [sc_loser.GetFirstNameNoTooltip] จ้องมองเข้าไปในปากเหม็นนั้นเป็นเวลานานราวกับชั่วนิรันดร์\n\nจากนั้นเวลาและปากของจระเข้ก็งับลง\n\nข้านึกไปว่าข้าได้ยินเสียงกรีดร้องตื่นตระหนกของ [sc_loser.GetFirstNamePossessiveNoTooltip] จากภายในสัตว์ร้ายมหึมานานหลังจากแขนขาของ [sc_loser.GetHerHis] ถูกฟันของมันตัดขาด"
 single_combat.0041.desc.sc_attacker.desert_warrior.fatality:0 "และสิ่งที่ข้าต้องทำคือเตะเข่าออกจากข้างใต้ของ [sc_loser.GetFirstNameNoTooltip]\n\nวินาทีที่ [sc_loser.GetSheHe] อยู่ใน [sc_defender.Custom('GroundType')] มันก็จบลง [sc_victor.Custom('SignatureWeaponAttemptedLight')] หนึ่งครั้ง [sc_victor.Custom2('SignatureWeaponKillTypeTorsoThirdPersonActiveGendered',SCOPE.sC('sc_loser'))]\n\nหลังจากนั้น ก็ไม่มีอะไรเหลือให้ [sc_loser.GetFirstNameNoTooltip] ทำนอกจากตาย"
 single_combat.0041.desc.sc_attacker.jungle_stalker.fatality:0 "เหวี่ยง [sc_victor.Custom('SignatureWeaponEndType')] ของ [sc_victor.Custom('signature_weapon')] เข้าไปในตาของ [sc_loser.GetFirstNamePossessiveNoTooltip] มันง่ายเกินไปที่จะปัด [sc_loser.Custom('signature_weapon')] ของ [sc_loser.GetHerHis] เองออกไป\n\nเมื่อไม่มีทางป้องกันข้าได้ ข้าก็จัดการ [sc_loser.GetFirstNameNoTooltip] อย่างรวดเร็ว"
 single_combat.0041.desc.sc_attacker.open_terrain_expert.fatality:0 "หลีกเลี่ยงไม่ได้ที่ [sc_loser.GetFirstNameNoTooltip] จะยืดตัว [sc_loser.GetHerselfHimself] มากเกินไป และเมื่อ [sc_loser.GetSheHe] ทำ เช่นนั้น ข้าก็รีบฉวยโอกาสด้วย [sc_victor.Custom('SignatureWeaponAttemptedLight')] ที่รวดเร็วดุจสายฟ้าเข้าที่ข้างลำตัวของ [sc_loser.GetHerHis]\n\n[sc_victor.Custom('SignatureWeaponTipType')] ของ [sc_victor.Custom('signature_weapon')] ข้ากลับมาชุ่มด้วยเลือดและเครื่องในที่ตามออกมา คู่ต่อสู้ข้าทรุดลงภายในไม่กี่วินาที ถูกครอบงำด้วยความเจ็บปวดแสนสาหัส\n\nข้ายกอาวุธข้าสำหรับการปลิดชีพ"
 single_combat.0041.desc.sc_attacker.rough_terrain_expert.fatality.rocky:0 "ต้องใช้ความพยายามมากกว่าที่ข้าต้องการ แต่ในที่สุดข้าก็สามารถผลัก [sc_loser.GetFirstNameNoTooltip] ถอยหลังข้ามทางลาดชันเล็กน้อย ทำให้ [sc_loser.GetHerHim] ร่วงหล่นลงไปตามทางลาดในเสียงดังโครมครามของแขนขาที่หักกะทันหัน\n\nเมื่อข้าตามทัน [sc_loser.GetHerHim] การกัดของ [sc_victor.Custom('signature_weapon')] ข้าก็เป็นการปลดปล่อยที่น่ายินดีมากกว่าสิ่งอื่นใด"
 single_combat.0041.desc.sc_attacker.rough_terrain_expert.fatality.boggy:0 "ด้วยการผลักดันที่เพียงพอ ในที่สุดข้าก็สามารถส่ง [sc_loser.GetFirstNameNoTooltip] หน้าคว่ำลงไปในสระน้ำเหม็นเน่าลึกได้\n\nอาวุธของ [sc_loser.GetHerHis|U] หายไปทันที และด้วยความเชี่ยวชาญอย่างจงใจ ข้าวางรองเท้าบู๊ตลงบนหลังคอของ [sc_loser.GetWomanMan]\n\nดิ้นรนเท่าที่ [sc_loser.GetSheHe] จะทำได้ ระหว่าง [sc_victor.Custom('signature_weapon')] ข้าและเท้าข้า [sc_loser.GetFirstNameNoTooltip] ก็ไม่สามารถยกศีรษะ [sc_loser.GetHerHis] ขึ้นเหนือน้ำได้ ไม่นานนักการดิ้นรนของ [sc_loser.GetHerHis] ก็หยุดลงโดยสิ้นเชิง"
 single_combat.0041.desc.sc_attacker.forest_fighter.fatality: "ไล่ต้อน[sc_loser.GetHerHim]ผ่านแนวป่าดุจปีศาจ\n\nเมื่อ [sc_loser.GetFirstNameNoTooltip] สะดุดล้ม ข้ามีโอกาสที่ดีที่สุดที่จะชนะ และพุ่งไปข้างหน้า [sc_victor.Custom('signature_weapon')]ของข้า [sc_victor.Custom('SignatureWeaponWoundVerb5ThirdPersonPresent')] ลง [sc_victor.Custom2('SignatureWeaponKillTypeRearTorsoThirdPersonPresentParticipleGendered',SCOPE.sC('sc_loser'))] ด้วย[sc_victor.Custom('SignatureWeaponAttemptedHeavy')]เพียงครั้งเดียว\n\nข้าเตะ[sc_loser.GetHerHim]ให้หงายหลังของ[sc_loser.GetHerHis] [sc_loser.GetFirstNameNoTooltip] ยังมีชีวิตพอที่จะมอง[sc_victor.Custom('EyeEyes')]ของข้าขณะที่ข้าสังหาร[sc_loser.GetHerHim]"
 single_combat.0041.desc.sc_attacker.raaargh.fatality:0 "หมอกสีแดงบดบังทัศนวิสัยของข้า มากเสียจนข้าเห็นภาพนิ่งของการกระทำของข้ามากกว่าการกระทำจริง อาวุธของ [sc_loser.GetFirstNamePossessiveNoTooltip] ไร้ประโยชน์เมื่อ [sc_victor.Custom('SignatureWeaponBreaksThirdPersonSingularPresent')] [sc_loser.Custom('ArmArms')] ของ [sc_loser.GetHerHis|U] หักเกือบเป็นสองท่อนขณะที่ข้าทุบมันออกไป ใบหน้าของ [sc_loser.GetHerHis|U] เละเทะไปด้วยเลือด หยดฟันที่แตกและเหงือกที่ฉีกขาดขณะที่ข้าดึงหมัดกลับเพื่อโจมตีอีกครั้ง\n\nเมื่อข้าได้สติ มีบางอย่างเหนียวๆ และเปียกๆ อยู่ใต้ส้นเท้าของข้า การเหลือบมองยืนยันว่าเป็นสิ่งที่เหลืออยู่ของกะโหลกศีรษะของ [sc_loser.GetFirstNamePossessiveNoTooltip]"
 single_combat.0041.desc.sc_attacker.hard_grit.fatality:0 "เมื่อไม่มีโอกาสควบคุมการประลองกลับคืนมา การตายของ [sc_loser.GetFirstNamePossessiveNoTooltip] จึงเป็นเรื่องของเวลา ไม่ใช่ว่าจะเป็นหรือไม่\n\nในที่สุด [sc_loser.GetSheHe] ก็ทำผิดพลาดครั้งสำคัญ และการป้องกันของ [sc_loser.GetHerHis] ก็เปิดออกเป็นวินาที มันคือทั้งหมดที่ข้าต้องการ เพราะการโจมตีอีกครั้ง [sc_victor.Custom('SignatureWeaponWoundVerb4ThirdPersonPresent')] คอของ [sc_loser.GetHerHis] อย่างถึงแก่ชีวิต\n\n[sc_loser.GetFirstNameNoTooltip] สำลักจนตายในเวลาอันสั้น"
 single_combat.0041.desc.sc_attacker.feint_and_stab.fatality:1 "แล่นผ่านการป้องกันของ [sc_loser.GetHerHis] และตรงเข้าที่หน้าอกของ [sc_loser.GetHerHis]\n\n[sc_loser.GetFirstNameNoTooltip] โซเซถอยหลัง กริชในมืออีกข้างข้าดึงหลุดออกมาขณะ [sc_loser.GetSheHe] ทำ เช่นนั้น สาดเลือดและเศษกระดูกไปทั่วพื้น\n\n[sc_loser.GetSheHe|U] เลือดออกจนตายอย่างรวดเร็ว แม้จะไม่เจ็บปวดนักก็ตาม"
 single_combat.0041.desc.sc_attacker.butchery.fatality:1 "ทีละน้อย จิตวิญญาณของ [sc_loser.GetFirstNameNoTooltip] ก็แตกสลาย การเลียความทรมาน แต่ละครั้งฉีกกระชากความรู้สึกถึงความสามารถอันแน่วแน่ใดๆ ที่ [sc_loser.GetSheHe] อาจพยายามรักษาไว้ ข้าทุบ [sc_loser.GetHerHim] ลงเป็นกองที่สั่นเทา กรีดร้องและเลือดทะลักลงบน [sc_defender.Custom('GroundType')]\n\nแม้ แต่สำหรับข้า ในที่สุด พอคือพอ [sc_victor.Custom('SignatureWeaponAttemptedLight')] ครั้งสุดท้ายเร่งการตายของ [sc_loser.GetFirstNamePossessiveNoTooltip] อย่างมีนัยสำคัญ แต่ไม่ #EMP มากเกินไป#! อย่างมีนัยสำคัญ"
 single_combat.0041.desc.sc_attacker.stoic_veteran.fatality:1 "\n\nสายตาที่เฉียบคมมองเห็นโอกาสในการรบ และของข้าก็มอบโอกาสให้ข้า [sc_loser.Custom('SignatureWeaponBreaksVerbPastTense')] ของ [sc_loser.Custom('signature_weapon')] ของ [sc_loser.GetFirstNamePossessiveNoTooltip] เมื่อถูกปลดอาวุธ ศัตรูข้าก็แทบไม่เป็นภัยคุกคาม และการโจมตีครั้งต่อไปข้าก็สามารถ [sc_victor.Custom2('SignatureWeaponKillTypeTorsoThirdPersonFutureGendered',SCOPE.sC('sc_loser'))] ได้อย่างอิสระ\n\nด้วยเหตุนั้น [sc_loser.GetFirstNameNoTooltip] ก็ตาย [sc_loser.GetSheHe] เพียงแค่ยังไม่ตายสนิทเท่านั้น\n\nข้าปล่อยให้ศพในไม่ช้าของ [sc_loser.GetHerHis] ล้มหงายหลังโดยมี [sc_victor.Custom('signature_weapon')] ข้ายังคงฝังอยู่ในหน้าอกของ [sc_loser.GetHerHis]"
 single_combat.0041.desc.sc_attacker.blade_dance.fatality:0 "ทีละจังหวะ ซิมโฟนีแห่งความเจ็บปวดข้าก่อตัวขึ้นเหนือเส้นประสาททุกเส้นของ [sc_loser.GetFirstNamePossessiveNoTooltip] ดึงเสียงกรีดร้องเหมือนเสียงร้องประสานเสียงที่สลับด้วยเสียงเหล็กกระทบเหล็ก\n\nเมื่อแรงบันดาลใจข้าเริ่มเหือดแห้ง ข้าก็ตัดการร่ายรำข้าให้สั้นลง ปล่อยให้ศัตรูข้าทรุดลงคุกเข่า เลือดไหลออกจาก [sc_loser.GetHerHim] มากเสียจน [sc_loser.GetFirstNameNoTooltip] แทบไม่สามารถรวบรวมพลังงานเพื่อเงยหน้ามองข้าได้\n\nข้าให้เกียรติ [sc_loser.GetHerHim] ด้วยการตอบรับสายตาของ [sc_loser.GetHerHis] จากนั้นจึงเตรียม [sc_victor.Custom('signature_weapon')] ข้าสำหรับโน้ตตัวสุดท้ายของซิมโฟนี"
 single_combat.0041.desc.sc_attacker.wrath_of_highgod.fatality:0 "ก่อนที่ [sc_loser.GetFirstNameNoTooltip] จะมีโอกาสฉวยโอกาสจากช่วงเวลาเคร่งศาสนาข้า ข้าก็พุ่งเข้าสู่ [sc_victor.Custom('SignatureWeaponAttemptedHeavy')] [sc_loser.Custom('SignatureWeaponBreaksVerbPresentParticiple')] ของ [sc_loser.Custom('signature_weapon')] ของ [sc_loser.GetHerHis]\n\nศัตรูข้าตกตะลึงพูดไม่ออกด้วยหลักฐานการคุ้มครองของ [sc_victor.GetFaith.WarGodNamePossessive] นี้ มันกินเวลาเพียงวินาทีเดียว แต่นั่นคือทั้งหมดที่ข้าต้องการเพื่อ [sc_victor.Custom2('SignatureWeaponKillTypeThirdPersonFutureGendered',SCOPE.sC('sc_loser'))]"
 single_combat.0041.desc.sc_attacker.hurt_me_better.fatality:0 "ขณะที่ภวังค์การต่อสู้เข้าครอบงำข้า ข้าก็เริ่มระดม [sc_victor.Custom('SignatureWeaponAttemptedLightPlural')] อย่างรวดเร็ว สลับสับเปลี่ยนอย่างไม่มีที่ติระหว่างการปัดป้องอย่างโหดเหี้ยมและการโจมตีที่เกือบถึงแก่ชีวิต ความอดทนต่อความเจ็บปวดข้า ทำให้การคำนวณทุกอย่างของ [sc_loser.GetFirstNamePossessiveNoTooltip] ผิดพลาด\n\nไม่นานนักข้าก็สามารถโจมตีถึงแก่ชีวิตได้ ต่อยรูโหว่ที่น่าสะพรึงกลัวเข้าที่ข้างลำตัวศัตรูข้า\n\n[sc_loser.GetSheHe|U] เลือดออกจนตายภายในหนึ่งนาที"
 single_combat.0041.desc.sc_attacker.special_fallback.fatality:0 "[sc_loser.GetFirstNameNoTooltip] สะดุด นานพอที่ข้าจะนำ [sc_victor.Custom('SignatureWeaponEndType')] ของ [sc_victor.Custom('signature_weapon')] ข้ามาใช้สำหรับการโจมตีเข้าที่ใบหน้าของ [sc_loser.GetHerHis]\n\nการสะดุดของ [sc_loser.GetHerHis|U] กลายเป็นการล้มลงอย่างสิ้นเชิง อาวุธกลิ้งหลุดมือไปขณะ [sc_loser.GetSheHe] ล้ม ข้าเตะ [sc_loser.GetWomanMan] ที่มึนงงให้นอนหงาย และด้วยการโจมตีอันไร้ความปรานีครั้งเดียว ข้าก็ [sc_victor.Custom2('SignatureWeaponKillTypeThirdPersonFutureGendered',SCOPE.sC('sc_loser'))]"
 ### No need for a something_to_hide, as it's never fatal.

