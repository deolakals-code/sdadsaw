 single_combat.0031.a.killed_by_best_friend:0 "เจ้า... #DIE1 [Select_CString(sc_victor.IsFemale,'น้องหญิง','พี่ชาย')] [sc_victor.GetFirstNameNoTooltip] ของข้า#!... #DIE2 ข้ารักเจ้า#!..."
