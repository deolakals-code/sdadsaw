 single_combat.0031.desc.opponent_response.special_fallback:0 "[sc_victor.GetFirstNameNoTooltip] หรี่ตาลงชั่วเสี้ยววินาที จากนั้นก็เตะข้าอย่างรุนแรงเข้าที่หน้าแข้ง\n\nข้าสะดุด เพียงเพื่อพบว่าตัวเองกำลังจ้องมองไปที่"
 single_combat.0031.desc.opponent_response.something_to_hide:0 "[sc_victor.GetFirstNameNoTooltip] กระซิบความลับอัน #EMP ลบหลู่#! ที่สุดของข้าออกมา ข้าถูกบังคับและเสียสมาธิ ปล่อยให้การโจมตีครั้งต่อไปโดนตัวข้า,"

 ## Defender Lost, Opponent Finishing Move Injury
 single_combat.0031.desc.opponent_response.wait_and_hope.injury:0 "ที่โดนเข้าที่ข้อนิ้วมือข้างที่ถือ [sc_loser.Custom('signature_weapon')] ของข้าพอดี\n\nนิ้วข้าคลายออกตามสัญชาตญาณ ปล่อยให้อาวุธข้าหล่นกระทบพื้นเสียงดังแคร๊ง\n\nเราทั้งคู่มองหน้ากันอย่าง #EMP ไม่อยากเชื่อ#! อยู่สองสามวินาทีก่อนที่ [sc_victor.GetFirstNameNoTooltip] จะยก [sc_victor.Custom('signature_weapon')] ของ [sc_victor.GetHerHis] ขึ้นอย่างลังเล\n\n"ย-ยอมแพ้หรือตายเสีย!""
 single_combat.0031.desc.opponent_response.unsure_attack.injury:0 "และแม้จะเป็นการโจมตีที่เบาบาง มันก็โดนข้าผิดท่าและข้าก็ล้มไปด้านข้าง\n\nแม้ข้าจะพยายามลุกขึ้นอย่างรวดเร็ว [sc_victor.GetFirstNameNoTooltip] ที่กำลังดีใจอย่างบ้าคลั่งก็มี [sc_victor.Custom('signature_weapon')] ของ [sc_victor.GetHerHis] อยู่ในตำแหน่งแล้ว พร้อมที่จะ [sc_victor.Custom('SignatureWeaponKillTypeGroinFirstPersonFuture')] ด้วยการกระตุกเพียงครั้งเดียว"
 single_combat.0031.desc.opponent_response.enthusiastic_onslaught.injury:0 "ที่เกือบจะตัดมือข้างที่ถือ [sc_loser.Custom('signature_weapon')] ของข้าขาดตรงข้อมือ\n\nการโจมตีครั้งสุดท้ายคือทั้งหมดที่ [sc_victor.GetSheHe] ต้องการเพื่อส่งข้าลงไปคุกเข่า ก่อนที่ข้าจะยกการ์ดขึ้นมาทัน [sc_victor.Custom('SignatureWeaponTipType')] ของ [sc_victor.Custom('signature_weapon')] ของ [sc_victor.GetHerHis] ก็กดดันอย่างแรงกล้าที่คอข้า"
 single_combat.0031.desc.opponent_response.hail_mary.injury:0 "ชั่วขณะหนึ่ง ข้ารู้สึกขบขันในความทะลึ่งของ [sc_victor.GetHerHis] จนกระทั่งข้ารู้สึกถึงบางสิ่งเกี่ยวที่ด้านหลังขาข้า\n\nในพริบตา ข้าก็ลงไปกองกับพื้น และ [sc_victor.GetFirstNameNoTooltip] ก็ยืนอยู่เหนือข้า ประหลาดใจพอๆ กับข้า อย่างไรก็ตาม แขนข้างที่ถือ [sc_victor.Custom('signature_weapon')] ของ [sc_victor.GetHerHis|U] ยังคงมั่นคงและคุกคาม"
 single_combat.0031.desc.opponent_response.pocket_sand.injury:0 "บางสิ่งที่หนักหน่วงกระแทกเข่าข้าจนล้มลง\n\nข้ากระพริบตาถี่ๆ พยายาม ทำให้การมองเห็นชัดเจนขึ้น และภาพพร่ามัวที่ปรากฏขึ้นคือภาพของ [sc_victor.Custom('SignatureWeaponArticle')] [sc_victor.Custom('signature_weapon')] กำลังเตรียมที่จะ [sc_victor.Custom('SignatureWeaponKillTypeGroinFirstPersonFuture')]"
 single_combat.0031.desc.opponent_response.nut_em.injury:0 "และข้าก็ล้มลงเหมือนกระสอบอิฐ\n\nขอสาบานต่อ #EMP [sc_loser.GetFaith.HighGodName]#! [sc_victor.GetWomanMan] ผู้นั้นมีหัวที่แข็ง #EMP อย่างเหลือเชื่อ#!\n\nโลกข้ายังคงหมุนคว้าง แสงสีขาวแห่งความเจ็บปวดฉีกกระชากภาพที่เห็นเป็นริ้วเล็กๆ เมื่อข้าเงยหน้าขึ้นก็พบ [sc_victor.GetFirstNameNoTooltip] กำลังเตรียม [sc_victor.Custom('signature_weapon')] ของ [sc_victor.GetHerHis] เพื่อ [sc_victor.Custom('SignatureWeaponKillTypeFirstPersonFuture')] ด้วยการโจมตีอย่างรวดเร็วครั้งเดียว"
 single_combat.0031.desc.opponent_response.guard.injury:0 "จากนั้น ด้วยการ #EMP ปัดป้อง-โต้กลับอันรวดเร็ว#! บิด [sc_loser.Custom('signature_weapon')] ของข้าหลุดจากมือทันที\n\nข้าแทบไม่มีเวลากระพริบตา\n\nด้วยความมั่นใจเต็มเปี่ยม ศัตรูข้าเปลี่ยนไปใช้ท่าโจมตี เตรียมที่จะ [sc_loser.Custom('SignatureWeaponKillTypeFirstPersonFuture')]"
 single_combat.0031.desc.opponent_response.probing_attack.injury:0 "แต่ละครั้งบั่นทอนกำลังใจข้าด้วย [sc_victor.Custom('SignatureWeaponAttemptedHeavy')] ที่คำนวณมาอย่างดี\n\nข้าพยายามอย่างสุดความสามารถที่จะยัน [sc_victor.GetHerHim] ไว้ แต่ในที่สุด [sc_victor.GetSheHe] ก็ปัด [sc_loser.Custom('signature_weapon')] หลุดจากมือข้าไปอย่างหมดจด\n\nข้ามีเวลาเพียงไม่กี่วินาทีก่อนที่ข้าจะถูก [sc_loser.Custom('SignatureWeaponKillTypePastParticiple')]"
 single_combat.0031.desc.opponent_response.onslaught.injury:0 "ผลักข้าถอยหลังครั้งแล้วครั้งเล่า\n\nไม่นานนักข้าก็ทรุดลง ล้มหงายหลังเสียงดังโครม [sc_victor.GetFirstNameNoTooltip] [sc_victor.Custom('SignatureWeaponActionThirdPerson')] [sc_victor.Custom('signature_weapon')] ของ [sc_victor.GetHerHis] เป็นครั้งสุดท้ายเหนือร่างที่ล้มลงของข้า พร้อมที่จะปลิดชีพข้าในทันที"
 single_combat.0031.desc.opponent_response.surprise_attack.injury:0 "ทำให้ข้าประหลาดใจ การโจมตีนั้น ทำให้ข้าหมุนครึ่งตัวอย่างแรงจนเกือบล้มลงกับพื้น\n\nก่อนที่ข้าจะฟื้นตัว [sc_victor.GetSheHe] ก็จัดตำแหน่ง [sc_victor.Custom('signature_weapon')] ของ [sc_victor.GetHerHis] ใหม่พร้อมสำหรับการสังหาร เราทั้งคู่แข็งทื่อ ครุ่นคิดถึงการเคลื่อนไหว และเป็นที่ชัดเจนว่าการโจมตีของ [sc_victor.GetFirstNamePossessiveNoTooltip] จะ [sc_victor.Custom('SignatureWeaponKillTypeFirstPersonFuture')] ก่อนที่ข้าจะหลบหรือปัดป้องได้ทัน"
 single_combat.0031.desc.opponent_response.taunt.injury:0 "โยน [sc_loser.Custom('signature_weapon')] ทิ้งและพยายามบีบคอ [sc_victor.GetHerHim] ด้วยตัวเอง\n\nเมื่อ [sc_victor.GetFirstNameNoTooltip] แกว่ง [sc_victor.Custom('signature_weapon')] ของ [sc_victor.GetHerHis] ไปมาเท่านั้น ข้าจึงตระหนักว่าข้าทำอะไรลงไป"
 single_combat.0031.desc.opponent_response.put_the_boot_in.injury:0 "ข้าพยายามอย่างสุดความสามารถ แต่คู่ต่อสู้ของข้าก็เริ่มขบวน [sc_victor.Custom('SignatureWeaponAttemptedLightPlural')] ทันที และไม่นานนักข้าก็ลงไปกองกับพื้น มึนงงและหอบหายใจ\n\nแม้จะยังมี [sc_loser.Custom('signature_weapon')] อยู่ในมือ [sc_victor.Custom('signature_weapon')] ของ [sc_victor.GetFirstNamePossessiveNoTooltip] ก็พร้อมที่จะ [sc_victor.Custom('SignatureWeaponKillTypeHeadFirstPersonFuture')]"
 single_combat.0031.desc.opponent_response.strict_guard.injury:0 "ส่งข้าโซเซ\n\nก่อนที่ข้าจะตั้งตัวได้ [sc_victor.GetFirstNameNoTooltip] ก็มาถึงตัวข้าอีกครั้ง [sc_victor.Custom('signature_weapon')] พุ่งเข้าใส่ศีรษะข้าโดยเอา [sc_victor.Custom('SignatureWeaponEndType')] เข้าหาก่อน จนกระทั่ง [sc_loser.Custom('MaskFace')] ข้าเต็มไปด้วย [sc_victor.Custom('SignatureWeaponEndMaterial')] ทื่อๆ\n\nข้าแทบไม่สังเกตเห็น [sc_loser.Custom('signature_weapon')] หลุดจากมือ"
 single_combat.0031.desc.opponent_response.confident_attack.injury:0 "เล่นงานข้า จนกระทั่งการป้องกันข้าอ่อนลงพอที่ [sc_victor.GetSheHe] จะได้ช่องว่างที่ #EMP สมบูรณ์แบบ#!\n\nด้วยการโจมตีอันทรงพลังครั้งเดียว [sc_victor.GetWomanMan] ก็ ทำให้ข้าโซเซถอยหลัง ส่ง [sc_loser.Custom('signature_weapon')] ของข้าลอยไป\n\nการก้าวผิดเพียงครั้งเดียวในตอนนี้หมายถึงความตาย"
 single_combat.0031.desc.opponent_response.expert_onslaught.injury:0 "ทุบตีข้าลงด้วยการโจมตี แต่ละครั้ง ทำให้กระดูกข้าช้ำด้วยการปัดป้อง แต่ละครั้ง จนกระทั่งข้าทรุดลงกับพื้นเป็นกองแทบไม่เหลือชิ้นดี\n\nข้ารู้สึกหนาวเหน็บ วิงเวียน เหมือนศีรษะข้ากำลังเต้นตุบๆ แต่จิตใจข้าอยู่ในห้องอื่น เกิดอะไรขึ้น... เรากำลังหมุนอยู่หรือ? ข้ากำลังหมุนอยู่หรือเปล่า?\n\nเสมหะเปื้อนเลือดก้อนหนึ่งดันตัวออกมาจากปากข้าพร้อมเสียงไอแหบแห้ง; อาการกระตุกส่ง [sc_loser.Custom('signature_weapon')] ของข้าลื่นหลุดจากมือ [sc_victor.GetFirstNameNoTooltip] เตะมันออกไปให้พ้นมือ จากนั้นก็วางโลหะเย็นเฉียบของ [sc_victor.Custom('signature_weapon')] ของ [sc_victor.GetHerHis] ลงบนคอข้า"
 single_combat.0031.desc.opponent_response.attempt_disarm.injury:0 "เราจ้องหน้ากันอยู่ครู่หนึ่ง มันเป็นความเงียบที่ตึงเครียดและน่าอึดอัด เราทั้งคู่ต่างรอให้อีกฝ่ายเคลื่อนไหวก่อน\n\n[sc_victor.GetFirstNameNoTooltip] [sc_victor.Custom('SignatureWeaponFlourishThirdPersonPresentParticiple')] [sc_victor.Custom('signature_weapon')] ของ [sc_victor.GetHerHis] อย่างคุกคามและเลิกคิ้วข้างหนึ่ง"
 ### No need for a lightning_assault, as you can't end the duel in the first round.
 single_combat.0031.desc.opponent_response.tire_opponent.injury:0 "ข้ารู้สึกว่าการจับ [sc_loser.Custom('signature_weapon')] ของข้าอ่อนลง\n\nคู่ต่อสู้ของข้าคงอ่านบางอย่างในท่าทางข้าออก เพราะการกวาด [sc_victor.Custom('signature_weapon')] ของ [sc_victor.GetHerHis] อย่างมั่นคงส่งอาวุธข้าลอยไป\n\nข้าตกอยู่ในความเมตตาของ [sc_victor.GetHerHis]"
 single_combat.0031.desc.opponent_response.reason_you_suck_speech.injury:0 "การป้องกันข้าแตกสลายจากความคับข้องใจล้วนๆ\n\nใน #EMP วินาทีนั้น#! เอง [sc_victor.GetSheHe] ก็โจมตีเข้ามา เป็น [sc_victor.Custom('SignatureWeaponAttemptedLight')] ที่กระชาก [sc_loser.Custom('signature_weapon')] ออกจากมือข้าด้วยการควงอย่างชำนาญ\n\n"อย่ากังวลไปเลย [sc_victor.GetFirstNameNoTooltip]; เจ้ายังคงจับ [sc_loser.Custom('signature_weapon')] ของเจ้าได้ดีกว่า [sc_loser.GetPrimaryTitle.GetTierAsNameNoTooltip] ของเจ้าเสียอีก"."
 single_combat.0031.desc.opponent_response.technique_from_legend.injury:0 "ในฉากที่งดงามราวกับหลุดออกมาจากตำนาน คู่ต่อสู้ข้าปัดการป้องกันข้าออกไป กระชาก [sc_loser.Custom('signature_weapon')] ออกจากมือข้าก่อนที่จะโจมตีด้วย [sc_victor.Custom('SignatureWeaponAttemptedHeavy')] อันร้ายกาจที่ ทำให้ข้าล้มลงกับพื้น\n\n[sc_victor.Custom('signature_weapon')|U] ยกขึ้น ไม่สนใจกรามที่ค้างของข้า [sc_victor.GetSheHe] เตรียมที่จะ [sc_victor.Custom('SignatureWeaponKillTypeGroinFirstPersonFuture')]"
 single_combat.0031.desc.opponent_response.like_a_viper.injury:0 "ข้าพยายามเบี่ยงเบนการโจมตีของอสรพิษนี้ แต่ก็ไร้ผล คู่ต่อสู้ข้าใช้โอกาสนี้เกี่ยว [sc_loser.Custom('signature_weapon')] ของข้าและบิดมันผิดทาง ปัดอาวุธออกไปไกลเกินเอื้อมอย่างน่าสมเพช\n\n[sc_victor.Custom('signature_weapon')] ของ [sc_victor.GetFirstNamePossessiveNoTooltip] มาหยุดพักบนหน้าอกข้า ตรงหน้าหัวใจที่เต้นเร็วของข้าพอดี"
 single_combat.0031.desc.opponent_response.pocket_silver.injury:0 "[sc_victor.GetSheHe] ยก [sc_victor.Custom('signature_weapon')] ของ [sc_victor.GetHerHis] ขึ้นมา #EMP อยู่ใน#! วงป้องกันข้า ใต้คอข้าพอดี\n\nข้ากระตุก [sc_loser.Custom('signature_weapon')] ตามสัญชาตญาณ ชั่งน้ำหนักทางเลือกในความเงียบอันน่าอึดอัด\n\n[sc_victor.GetFirstNameNoTooltip] ขมวดคิ้วใส่ข้า และกล้ามเนื้อของ [sc_victor.GetHerHis] ก็เกร็งพร้อมที่จะโจมตี"
 single_combat.0031.desc.opponent_response.martial_voice.injury:0 "กระโดดถอยหลังเร็วเสียจนแทบทิ้งหนังไว้ข้างหลัง เพียงเสี้ยววินาทีก่อนที่ข้าจะตระหนักว่า [sc_loser.Custom('signature_weapon')] ของข้าไม่ได้กระโดดตามมาด้วย มันหมุนคว้างไปในอากาศตรงที่ข้าทำหล่น ปล่อยให้ข้าไร้ทางสู้ขณะที่ [sc_victor.GetFirstNameNoTooltip] กำลังง้างสำหรับการโจมตีครั้งที่สอง"
 single_combat.0031.desc.opponent_response.mocking_boast.injury:0 "ปัด [sc_loser.Custom('signature_weapon')] ออกจากมือข้างที่ถือ [sc_loser.Custom('signature_weapon')] ของข้าด้วย [sc_victor.Custom('SignatureWeaponEndType')] ของ [sc_victor.Custom('signature_weapon')] ของ [sc_victor.GetHerHis] เอง ส่งผลให้อาวุธหลุดกลิ้งออกจากมือข้า\n\nคู่ต่อสู้ข้าเตรียมที่จะ [sc_victor.Custom('SignatureWeaponKillTypeFirstPersonFuture')] ด้วยการควงดาบและรอยยิ้มเยาะ\n\n"เอาล่ะ ผู้แพ้จะพูดว่าอะไร?""
 ### No need for an is_that_a_crocodile, as it's never just an injury.
 single_combat.0031.desc.opponent_response.desert_warrior.injury:0 "ทำการ [sc_victor.Custom('SignatureWeaponAttemptedLightPlural')] ที่แม่นยำหลายครั้ง ทำให้ข้าล้มลง หมดแรง ลงไปใน [sc_defender.Custom('GroundType')]\n\nข้ากลิ้งตัวเพื่อพบ [sc_victor.GetFirstNameNoTooltip] กำลังเตรียมพร้อมที่จะ [sc_victor.Custom('SignatureWeaponKillTypeHeadFirstPersonFuture')] โดย [sc_victor.Custom('signature_weapon')] ถูกยกสูงอยู่แล้ว"
 single_combat.0031.desc.opponent_response.jungle_stalker.injury:0 "เตะเข้าที่เป้าของข้าอย่าง #EMP แรง#! ทำให้ข้าล้มลงพร้อมเสียงร้อง\n\nบนพื้น ข้าดิ้นรนอยู่สองสามวินาที พยายามปลดปล่อยตัวเองออกจากเจ้าพืชปีศาจต้องสาปนี่ สาปแช่งความเจ็บปวดแสบร้อนที่หว่างขา เพียงเพื่อหยุดลงกะทันหันเมื่อรู้สึกถึงโลหะเย็นเฉียบของ [sc_victor.Custom('SignatureWeaponTipType')] ของ [sc_victor.Custom('SignatureWeaponArticle')] [sc_victor.Custom('signature_weapon')] กดลงบนหน้าผากข้า"
 single_combat.0031.desc.opponent_response.open_terrain_expert.injury:0 "ไม่นานนักข้าก็โซเซ หมดแรง และคู่ต่อสู้ข้าก็ส่งข้ากลิ้งลงกับพื้นด้วย [sc_victor.Custom('SignatureWeaponAttemptedHeavy')] เพียงครั้งเดียว\n\nข้าพยายามลุกขึ้น แต่รองเท้าบู๊ตของ [sc_victor.GetFirstNamePossessiveNoTooltip] ก็เหยียบลงบนหน้าอกข้า และ [sc_victor.GetSheHe] ก็ยก [sc_victor.Custom('signature_weapon')] ของ [sc_victor.GetHerHis] ขึ้นเพื่อ [sc_victor.Custom('SignatureWeaponKillTypeHeadFirstPersonFuture')]"
 single_combat.0031.desc.opponent_response.rough_terrain_expert.injury.rocky:0 "ข้าล้มหงายหลังลงไปบนทางลาดเล็กน้อย ตกลงไปท่ามกลางก้อนหินอย่างแรง เกือบพลาดโดน [sc_loser.Custom('signature_weapon')] ของตัวเอง\n\nข้าพยายามลุกขึ้นยืนให้ดีที่สุด แต่โลหะเย็นเฉียบของ [sc_victor.Custom('signature_weapon')] ของ [sc_victor.GetFirstNamePossessiveNoTooltip] ก็จ่ออยู่ที่ต้นคอข้าแล้ว"
 single_combat.0031.desc.opponent_response.rough_terrain_expert.injury.boggy:0 "ข้าล้มหงายหลังลงไปในบ่อน้ำโคลนเลนทันที\n\n[sc_loser.Custom('signature_weapon')] ของข้าหลุดจากมือทันที และขณะที่ข้าตะเกียกตะกาย เพื่อให้ศีรษะพ้นน้ำ เพื่อสูดอากาศและบ้วนน้ำหนองเหม็นออกมา\n\nรองเท้าบู๊ตเหยียบลงบน [sc_loser.Custom('MaskFace')] ของข้าเบาๆ กดให้ข้าอยู่เหนือผิวน้ำเพียงเล็กน้อย ขู่ว่าจะกดข้าลงไป"
 single_combat.0031.desc.opponent_response.forest_fighter.injury:0 "ตอไม้ที่ [sc_victor.GetSheHe] ผลักข้าถอยหลังเข้าไปชน\n\nข้าสะดุดหน้าคว่ำ [sc_loser.Custom('signature_weapon')] ลอยเข้าไปในพงหญ้า ก่อนที่ข้าจะตั้งตัวได้ การเตะอย่างแรงก็ ทำให้ข้าล้มลงราบท่ามกลางใบไม้ และ [sc_victor.Custom('signature_weapon')] โลหะเย็นเฉียบก็กดลงบนคอข้าอย่างแรง"
 single_combat.0031.desc.opponent_response.raaargh.injury:0 "เหวี่ยงข้าราวกับตุ๊กตาผ้าขี้ริ้ว\n\nข้าล้มหงายหลัง ทำ [sc_victor.Custom('signature_weapon')] หลุดมือ และ [sc_victor.GetSheHe] ก็ยืนค้ำอยู่เหนือข้า ความ #EMP เกลียดชัง#! ดุจสัตว์ร้ายอยู่ใน [sc_victor.Custom('EyeEyes')] ของ [sc_victor.GetHerHis] นี่... นี่คือวิธีที่ข้าจะตาย\n\nรวดเร็วเท่าที่มันมา ความโกรธก็หายไป ทิ้งให้ [sc_victor.GetFirstNameNoTooltip] โยกตัวเบาๆ ยังคงพร้อมที่จะ [sc_victor.Custom('SignatureWeaponKillTypeFirstPersonFuture')] แม้จะสงบลงชั่วขณะ"
 single_combat.0031.desc.opponent_response.hard_grit.injury:0 "ด้วยความสามารถระดับมืออาชีพ [sc_victor.GetFirstNameNoTooltip] ต้อนข้าไปทางนั้นทีทางนี้ที การโจมตี แต่ละครั้งผลักข้าไปมา จนกระทั่ง [sc_victor.GetSheHe] สามารถบิด [sc_loser.Custom('signature_weapon')] หลุดออกจาก [sc_loser.Custom('HandHands')] ของข้าได้\n\nชั่วขณะหนึ่ง ข้าตกตะลึง"
 single_combat.0031.desc.opponent_response.feint_and_stab.injury:0 "ข้าพยายามเปลี่ยนไปใช้การปัดป้องที่เหมาะสม แต่มันสายเกินไปเสียแล้ว และด้ามกริชก็กระแทกเข้าที่แก้มข้าอย่างแรง\n\nการจับอาวุธข้าคลายลง และข้ารู้สึกว่ามันหล่นออกจากมือเสียงดังแคร๊ง ทัศนวิสัยพร่ามัวจากการกระแทก"
 single_combat.0031.desc.opponent_response.butchery.injury:0 "ข้าแทบจะรู้สึกได้ถึงกระดูกเล็กๆ ที่หัก เลือดไหลผ่านหลอดเลือดแดงที่ช้ำ ผลักดันเนื้อเยื่อที่บอบช้ำ ทัศนวิสัยข้าพร่ามัว ว่ายวน เราต่อสู้กันนานแค่ไหนแล้ว? ข้าล้มลงกับพื้นเมื่อไหร่?\n\n[sc_victor.GetFirstNameNoTooltip] ยืนค้ำอยู่เหนือข้า [sc_victor.Custom('signature_weapon')] ยกสูง พร้อมที่จะ [sc_victor.Custom('SignatureWeaponKillTypeHeadFirstPersonFuture')]"
 single_combat.0031.desc.opponent_response.stoic_veteran.injury:0 "แต่ละครั้งฉีกเข้า [sc_loser.Custom('SignatureWeaponEndMaterial')] ของ [sc_loser.Custom('signature_weapon')] ข้า จนกระทั่งอาวุธ [sc_loser.Custom('SignatureWeaponBreaksThirdPersonSingularPresent')]\n\nหลังจากนั้น มันก็เป็นเรื่องง่ายสำหรับ [sc_victor.GetFirstNameNoTooltip] ที่จะปลดอาวุธ [sc_loser.Custom('signature_weapon')] ที่หักของข้า ปล่อยให้ข้าเปลือยเปล่าและอ่อนแอต่อการโจมตีใดๆ ที่อาจตามมา"
 single_combat.0031.desc.opponent_response.blade_dance.injury:0 "ร่ายรำเข้าหาการโจมตีข้าเพียงเพื่อจะดึงกลับในวินาทีสุดท้าย\n\nข้าเกือบจะหลงใหล จากนั้น [sc_loser.Custom('signature_weapon')] ของข้าก็หายไปในพริบตา อาวุธหล่นเสียงดังแคร๊ง ปล่อยให้ข้าไร้ทางสู้ขณะที่ [sc_victor.GetFirstNameNoTooltip] เตรียมที่จะ [sc_victor.Custom('SignatureWeaponKillTypeFirstPersonFuture')]"
 single_combat.0031.desc.opponent_response.wrath_of_highgod.injury:0 "[sc_victor.Custom('SignatureWeaponAttemptedHeavy')] ที่ไม่คาดคิด ซึ่ง ทำให้ข้าเสียสมดุลอย่างสิ้นเชิง\n\n[sc_victor.GetFirstNameNoTooltip] กวาดไปข้างหน้า นำ [sc_victor.Custom('signature_weapon')] ของ [sc_victor.GetHerHis] เข้ามาใกล้นิ้วเดียวจาก [sc_loser.Custom('MaskFace')] ข้า\n\n"ยอมแพ้ ขอสาบานต่อ [sc_victor.GetFaith.WarGodName] หรือตายเสีย!""
 single_combat.0031.desc.opponent_response.hurt_me_better.injury:0 "ลงเอยด้วยเสียงคำรามแหบแห้งและการระดม [sc_victor.Custom('SignatureWeaponAttemptedHeavyPlural')] ที่บังคับให้ข้าคุกเข่าลง\n\nข้าพยายามเหวี่ยง [sc_loser.Custom('signature_weapon')] ขึ้นเพื่อปัดป้องการโจมตีร้ายแรงอีกครั้ง เพียงเพื่อโดนเข่ากระแทกเข้าที่ [sc_loser.Custom('MaskFace')] อย่างรวดเร็ว\n\nข้าพับตัวถอยหลังลงไปใน [sc_defender.Custom('GroundType')] ทัศนวิสัยว่ายวน ทันใดนั้นแสงแวววาวของ [sc_victor.Custom('SignatureWeaponTipType')] ของ [sc_victor.Custom('signature_weapon')] ของ [sc_victor.GetFirstNamePossessiveNoTooltip] ก็เข้ามาในโฟกัส"
 single_combat.0031.desc.opponent_response.special_fallback.injury:0 "[sc_victor.Custom('SignatureWeaponTipType')] ของ [sc_victor.Custom('signature_weapon')] ของ [sc_victor.GetHerHis] กดขึ้นมาที่ [sc_loser.Custom('MaskFace')] ข้า ใกล้จนไม่อาจหลีกเลี่ยงได้"
 single_combat.0031.desc.opponent_response.something_to_hide.injury:0 "กระตุกข้ากลับสู่ความเป็นจริงอันเจ็บปวด\n\nก่อนที่ข้าจะตั้งการ์ดกลับขึ้นมาได้ การโจมตีตามมาของ [sc_victor.GetFirstNamePossessiveNoTooltip] ก็กระชาก [sc_loser.Custom('signature_weapon')] ออกจากมือข้า ปล่อยให้ข้าเปิดโล่งและอ่อนแอ"

 ## Defender Lost, Opponent Finishing Move Fatality
 single_combat.0031.desc.opponent_response.wait_and_hope.fatality:0 "ที่เล็ดลอดผ่านการป้องกันของข้าไปได้อย่างไรไม่ทราบและ [sc_victor.Custom('SignatureWeaponKillTypeTorsoThirdPersonActive')]\n\nข้าโซเซถอยหลัง [sc_victor.Custom('signature_weapon')] ของคู่ต่อสู้ถูกดึงออกพร้อมเสียงเปียกแฉะขณะข้าถอยไป โลหิตเริ่มไหลทะลักออกจากบาดแผล ทำให้พื้นดินใต้เท้าข้าชุ่มโชก และปากข้าก็อ้าพะงาบๆ อย่างไร้คำพูด\n\n[sc_victor.GetFirstNameNoTooltip] ดูตกใจพอๆ กับข้า"
 single_combat.0031.desc.opponent_response.unsure_attack.fatality:0 "และข้าก็โซเซถอยหลัง\n\n[sc_victor.GetSheHe|U] คงจะโดนข้าเข้าที่ไหนสักแห่ง แต่ความเจ็บปวดกะทันหันนั้นรุนแรงเกินกว่าจะบอกได้แน่ชัดว่าที่ใด ข้ารู้สึกถึงเลือดอุ่นๆ ที่ไหลซึมออกมาจากหน้าอก ความเจ็บปวดผลิบานเป็นปม แผ่กระจายไปทั่วลำตัวส่วนบน\n\n[sc_victor.GetFirstNameNoTooltip] ควง [sc_victor.Custom('signature_weapon')] ของ [sc_victor.GetHerHis] พุ่งไปข้างหน้าเพื่อ [sc_victor.Custom('SignatureWeaponKillTypeFirstPersonFuture')]"
 single_combat.0031.desc.opponent_response.enthusiastic_onslaught.fatality:0 "ที่ดูน่าหัวเราะ อย่างน้อยก็ จนกระทั่งครั้งหนึ่งโดนมือข้างที่ถือ [sc_loser.Custom('signature_weapon')] ของข้า ส่งอาวุธข้ากลิ้งหลุดมือไป\n\nข้ามีเวลาพอแค่ยกมือขึ้นป้องกันเมื่อ [sc_victor.GetFirstNameNoTooltip] ก้าวเข้ามาใกล้และ [sc_victor.Custom('SignatureWeaponKillTypeGroinThirdPersonActive')] ด้วย [sc_victor.Custom('signature_weapon')] ของ [sc_victor.GetHerHis], [sc_victor.Custom('SignatureWeaponKillTypeGroinThirdPersonActive_Aftermath')]\n\nปากข้าอ้าพะงาบๆ อย่างไร้คำพูด ความเจ็บปวดรุนแรงเกินกว่าจะทำได้แค่สำลัก"
 single_combat.0031.desc.opponent_response.hail_mary.fatality:0 "เป้าหมายของ [sc_victor.GetHerHis|U] สูงเกินไปสำหรับกลยุทธ์ เช่นนั้น ไอ้คนมือใหม่! ข้าสงสาร [sc_victor.GetHerHim] จริงๆ หากจะมีอะไร การโจมตี เช่นนั้นคงโดนหน้าผา-"
 single_combat.0031.desc.opponent_response.pocket_sand.fatality:0 "มีความเจ็บปวดทรมานอย่างแท้จริงพุ่งตรงมาที่ท้องข้า\n\nข้าล้มหงายหลัง และมีบางสิ่งกระแทกเข้าที่ใต้คางข้า เฉือนลึกเข้าไปในกระดูกกราม เลือดแดงสดไหลออกมาจากบาดแผลอย่างอิสระ ชีวิตข้าไหลซึมออกไปสู่ [sc_defender.Custom('GroundType')] ขณะที่ข้าทรุดลงกับพื้น"
 single_combat.0031.desc.opponent_response.nut_em.fatality:0 "และทุกอย่างก็มืดลง [sc_loser.Custom('EyeEyes')] ข้าเพียงแค่... หยุดทำงาน ข้าโบก [sc_loser.Custom('signature_weapon')] อย่างสิ้นหวัง พยายามปัดป้อง [sc_victor.GetWomanMan] ศัตรูที่พยายามจะฆ่าข้า\n\nมันไม่ได้ผล เพราะข้ารู้สึกถึงบางสิ่ง [sc_victor.Custom('SignatureWeaponWoundVerb1')] ลึกเข้าไปในไหล่ข้า กรีดทางเปื้อนเลือดผ่านร่างกายข้า\n\nข้าโซเซและโอนเอน ไอเอาเสมหะเหนียวข้นสีทองแดงออกมา: [sc_victor.GetFirstNameNoTooltip] คงจะโดนปอดเข้าแล้ว"
 single_combat.0031.desc.opponent_response.guard.fatality:0 "จนกระทั่งการโจมตีที่ผิดพลาดจาก [sc_loser.Custom('signature_weapon')] ของข้าเองบิดอาวุธหลุดออกจากมือ\n\n[sc_victor.GetFirstNameNoTooltip] ไม่เสียเวลาในการปลดปล่อยชุด [sc_victor.Custom('SignatureWeaponAttemptedLightPlural')] แต่ละครั้งฉีกเนื้อข้าเป็นริ้วๆ เปื้อนเลือด\n\nข้าล้มลงคุกเข่า หอบหายใจ ไอเอาเชือกเสมหะสีแดงข้นออกมา [sc_victor.Custom('MaskFace')] ของ [sc_victor.GetFirstNamePossessiveNoTooltip] ไร้อารมณ์ขณะที่ [sc_victor.GetSheHe] เตรียมพร้อมสำหรับการสังหาร"
 single_combat.0031.desc.opponent_response.probing_attack.fatality:0 "ผลักข้าให้เสียสมดุลมากขึ้นเรื่อยๆ ทีละน้อย จนกระทั่งการโจมตีที่พลาดเป้าส่งข้ากลิ้งลงไป\n\nข้าไม่เคยลุกขึ้นจากพื้นได้เลย [sc_victor.Custom('signature_weapon')] ของ [sc_victor.GetFirstNamePossessiveNoTooltip] [sc_victor.Custom('SignatureWeaponKillTypeRearTorsoPresentParticiple')] ด้วย [sc_victor.Custom('SignatureWeaponAttemptedHeavy')] เพียงครั้งเดียว"
 single_combat.0031.desc.opponent_response.onslaught.fatality:0 "มากเกินกว่าจะปัดป้องได้ ข้าปัดป้องสองสามครั้งแรกได้ แต่การโจมตีครั้งที่สี่ของ [sc_victor.GetHerHis] ปัด [sc_loser.Custom('signature_weapon')] ออกจาก [sc_loser.Custom('HandHands')] ข้า และครั้งที่ห้าก็พรากลมหายใจไปจากปอดข้า\n\nข้าแทบไม่มีเวลาตระหนักว่าเกิดอะไรขึ้นก่อนที่ [sc_victor.Custom('signature_weapon')] ของ [sc_victor.GetFirstNamePossessiveNoTooltip] จะ [sc_victor.Custom('SignatureWeaponWoundVerb2ThirdPersonPresent')] ลึกเข้าไปในซี่โครงข้า ทำลายกระดูกและฉีกเนื้อเยื่อ\n\nข้าทรุดลงหงายหลัง หอบหายใจ กำลังจะตาย หน้าอกข้าร้อนผ่าวและแขนขาเย็นเฉียบแล้ว สติสัมปชัญญะของข้าเองดูเหมือนจะไหลออกจากบาดแผลที่เปิดกว้าง"
 single_combat.0031.desc.opponent_response.surprise_attack.fatality:0 "ส่ง [sc_loser.Custom('signature_weapon')] ของข้าหมุนคว้างหลุดจากมือ\n\nข้าถอยหลังอย่างรวดเร็ว แต่ไม่เร็วเท่าที่ [sc_victor.GetFirstNameNoTooltip] จะพุ่งเข้ามาได้ [sc_victor.Custom('SignatureWeaponKillTypeFirstPersonPresentParticiple')] ในการเคลื่อนไหวอย่างรวดเร็วครั้งเดียว\n\nชีวิตหลั่งไหลออกจากร่างข้า ข้าทรุดลง ยังมีสติพอที่จะมองตาฆาตกรของข้า"
 single_combat.0031.desc.opponent_response.taunt.fatality:0 "ละทิ้งการป้องกันและพุ่งเข้าใส่ [sc_victor.GetHerHim]\n\nไม่น่าแปลกใจเมื่อการโจมตีโดยประมาทของข้าเปิดโอกาสให้ [sc_victor.GetFirstNameNoTooltip] โจมตีเข้าที่ท้องข้าได้อย่างเต็มที่"
 single_combat.0031.desc.opponent_response.put_the_boot_in.fatality:0 "ใช้ช่องว่างนั้นอย่างดี [sc_victor.GetFirstNameNoTooltip] เคลื่อนไหวอย่างราบรื่นเข้าสู่ท่า [sc_victor.Custom('SignatureWeaponAttemptedLight')] ที่ฉีก [sc_loser.Custom('signature_weapon')] ออกจากมือข้า\n\n[sc_victor.GetSheHe|U] กำลังเหวี่ยงอาวุธกลับมาก่อนที่ข้าจะหลบทัน [sc_victor.Custom('signature_weapon')] ของ [sc_victor.GetHerHis] [sc_victor.Custom('SignatureWeaponWoundVerb1PresentParticiple')] เข้าที่หน้าอกข้าอย่างถึงแก่ชีวิต"
 single_combat.0031.desc.opponent_response.strict_guard.fatality:0 "ฉีกเปิดการป้องกันข้า อีกครั้งหนึ่งส่งความเจ็บปวดเย็นเยือกผ่านหน้าอกข้า และแขนข้างที่ถือ [sc_loser.Custom('signature_weapon')] ของข้าก็ห้อยต่อง แต่งอย่างไร้ประโยชน์อยู่ข้างลำตัว\n\nข้ารู้สึกถึงแขนขาไม่ได้ ข้าบังคับขาให้ขยับไม่ได้ ข้าทำอะไรไม่ได้เลย\n\n[sc_victor.Custom('SignatureWeaponAttemptedHeavy')] อีกครั้ง [sc_victor.Custom('SignatureWeaponCriticalPresent')] หน้าอกข้า และข้าก็โซเซ โอนเอนอยู่กับที่\n\n[sc_victor.GetFirstNameNoTooltip] เตรียม [sc_victor.Custom('signature_weapon')] ของ [sc_victor.GetHerHis] สำหรับการสังหารครั้งสุดท้าย"
 single_combat.0031.desc.opponent_response.confident_attack.fatality:0 "จนกระทั่งการฟาดด้านข้างที่ไม่คาดคิดกรีดเข้าที่ท้องข้าอย่างจัง\n\nการโจมตีนั้น ทำให้ข้าล้มหงายหลัง บางสิ่งที่เนื้อนิ่มและสีแดงเข้มไหลออกมาทางบาดแผลขณะที่ข้าทรุดลงไปใน [sc_defender.Custom('GroundType')]\n\nความเจ็บปวดท่วมท้นข้า ข้าเคยเลือดออกมากขนาดนี้มาก่อนหรือไม่? [sc_loser.Custom('signature_weapon')] ของข้าถูกเตะออกไป แต่ข้าไม่อาจใส่ใจได้\n\nเหนือข้า [sc_victor.GetFirstNameNoTooltip] เตรียมพร้อมการโจมตีด้วย [sc_victor.Custom('signature_weapon')] ครั้งสุดท้ายของ [sc_victor.GetHerHis]"
 single_combat.0031.desc.opponent_response.expert_onslaught.fatality:0 "ทุบตีข้าลง บังคับให้ข้าลงไปกองกับพื้นเป็นกองที่กรีดร้องและแตกสลาย\n\nทัศนวิสัยข้าว่ายวน สายตาเลือนรางภายใต้ความเจ็บปวด แต่ข้ายังคงมองเห็นเศษเนื้อที่ช้ำของข้าติดอยู่กับ [sc_victor.Custom('signature_weapon')] ของ [sc_victor.GetFirstNamePossessiveNoTooltip]\n\nการโจมตีครั้งต่อไปโดนเข้าที่คอข้า ตัดเสียงกรีดร้องข้าให้สั้นลงด้วยความเมตตาอันเปื้อนเลือด"
 single_combat.0031.desc.opponent_response.attempt_disarm.fatality:0 "ก่อนที่ข้าจะคัดค้านได้ [sc_victor.GetFirstNameNoTooltip] ก็ฟาด [sc_victor.Custom('SignatureWeaponAttemptedHeavy')] เข้าที่ซี่โครงข้า และทุกอย่างก็ลดลงเหลือเพียงความเจ็บปวดแสบร้อน\n\nข้ารู้สึกถึงการโจมตีสองสามครั้งถัดมา แต่เพียงเลือนราง ราวกับผ่านม่านหมอกหรือผ้าคลุมหนา ทัศนวิสัยข้าจางลงเหลือเพียงจุดเดียว"
 ### No need for a lightning_assault, as you can't end the duel in the first round.
 single_combat.0031.desc.opponent_response.tire_opponent.fatality:0 "ช่องว่างที่เหมาะสมเปิดขึ้นในการป้องกันข้า\n\nการโจมตีครั้งต่อไปฉีกบาดแผลเปิดกว้างในท้องข้า ส่งเลือด น้ำดี และอาหารที่ย่อยไปครึ่งหนึ่งทะลักออกมาเปื้อนรองเท้าบู๊ตข้า\n\nข้ากรีดร้อง ความเจ็บปวดเกินจินตนาการ กุมท้องที่เปิดออก บางทีอาจเป็นแค่ความคิดข้า แต่ข้านึกไปว่ามีความสงสารแวบผ่าน [sc_victor.Custom('MaskFace')] ของ [sc_victor.GetFirstNamePossessiveNoTooltip] ขณะที่ [sc_victor.GetSheHe] ยก [sc_victor.Custom('signature_weapon')] ของ [sc_victor.GetHerHis] ขึ้นเพื่อยุติความทุกข์ทรมานข้า"
 single_combat.0031.desc.opponent_response.reason_you_suck_speech.fatality:0 "ข้ากรีดร้องด้วยความคับข้องใจ\n\nดูเหมือนว่านี่คือ #EMP สิ่งที่#! [sc_victor.GetFirstNameNoTooltip] กำลังรอคอยอยู่ เพราะการเสียสมาธิชั่วขณะนี้เองที่ [sc_victor.GetSheHe] ใช้เพื่อกวาดผ่านการป้องกันข้าและ [sc_victor.Custom('SignatureWeaponWoundVerb5')] [sc_victor.Custom('signature_weapon')] ของ [sc_victor.GetHerHis] เข้าที่คอข้า\n\nข้าเริ่มสำลักและหายใจไม่ออกเกือบทันที แต่อากาศไม่เคยเข้ามา มีเพียงเลือด ลิ่มเลือดข้นเหนียวปนน้ำลาย ไหลทะลักขึ้นมาในคอและออกจากปากข้า"
 single_combat.0031.desc.opponent_response.technique_from_legend.fatality:0 "ข้าเคลื่อนตัวไปปิดกั้น แต่คำนวณพลาด... บางอย่าง โลกข้าหมุนคว้าง และข้ารู้สึกเวียนหัว การเคลื่อนไหวอันน่าคลื่นไส้เข้าครอบงำข้า จนกระทั่งศีรษะข้ากระแทกเข้ากับบางสิ่งพร้อมเสียง #EMP ทึบ#!\n\nข้ารู้สึกอะไรไม่ได้ ข้าพูดไม่ได้ ข้า... ข้าเห็นร่างกายนอนอยู่ห่างออกไปไม่กี่ฟุต เลือดพุ่งออกมาจากตอคอ\n\nข้าคือ..."
 single_combat.0031.desc.opponent_response.like_a_viper.fatality:0 "เวลาดูเหมือนจะช้าลง ข้ารู้สึกถึงแขนข้างที่ถือ [sc_loser.Custom('signature_weapon')] ข้าเคลื่อนไหว ช้าเกินกว่าจะเข้ามาแทรกแซงได้ แต่สายตาข้าจับจ้องไปที่อาวุธอันตรายที่กำลังเตรียมพร้อมที่จะ [sc_victor.Custom('SignatureWeaponWoundVerb3')] หน้าอกข้า\n\nจากนั้นมันก็กระแทกเข้ามา\n\nเนื้อฉีกขาด กระดูกแตกละเอียด จากนั้นก็แตกละเอียด ข้ารู้สึกถึงบางสิ่งแทงทะลุหลังข้า แต่ไม่ว่าจะเป็นข้าหรือโลหะข้าก็บอกไม่ได้ ข้า... ข้าหายใจไม่ออก ข้ารู้สึกไม่ได้ ข้าทำไม่ได้"
 single_combat.0031.desc.opponent_response.pocket_silver.fatality:0 "มี [sc_victor.Custom('SignatureWeaponTipType')] ของ [sc_victor.Custom('SignatureWeaponArticle')] [sc_victor.Custom('signature_weapon')] ลอยขึ้นมาเผชิญหน้าข้า\n\nอาวุธกระแทกเข้าที่ปากข้าอย่างจังในระเบิดของฟันและเศษเนื้อเปื้อนเลือด กรามข้าห้อยต่อง แต่งอย่างไร้ประโยชน์ ข้าโซเซ พยายามกรีดร้อง แต่มีเพียงเสียงสะอื้นที่ออกมา\n\nข้าไม่เคยเห็นแม้ แต่การโจมตีเพื่อความเมตตาของ [sc_victor.GetFirstNamePossessiveNoTooltip]"
 single_combat.0031.desc.opponent_response.martial_voice.fatality:0 "มีบางอย่างเกี่ยวกับเสียงนั้นที่ ทำให้ข้าแข็งทื่อ เหมือนกวางเมื่อได้ยินเสียงเขาสัตว์ของนายพราน การโจมตีควรจะปัดป้องได้ง่าย หรือหลบ หรือ... อะไรก็ได้จริงๆ\n\nแต่ข้าไม่ทำ\n\nแทนที่จะเป็น เช่นนั้น มัน [sc_victor.Custom('SignatureWeaponWoundVerb2ThirdPersonPresent')] ลึกเข้าไปในไหล่ข้า แยกกระดูกออกจากกันและสาดเลือดแดงสดใส่เราทั้งคู่"
 single_combat.0031.desc.opponent_response.mocking_boast.fatality:0 "ปัด [sc_loser.Custom('signature_weapon')] ออกจากมือข้าราวกับเป็นของเล่นเด็ก\n\n[sc_loser.Custom('EyeEyes')|U] เบิกกว้างด้วยความกลัว ข้าตื่นตระหนก แต่มันสายเกินไปแล้ว [sc_victor.Custom('signature_weapon')] ของ [sc_victor.GetHerHis|U] กำลังโค้งไปข้างหน้า พร้อมที่จะ [sc_victor.Custom('SignatureWeaponKillTypeFirstPersonFuture')] ด้วยการโจมตีอย่างรวดเร็วครั้งเดียว"
 single_combat.0031.desc.opponent_response.is_that_a_crocodile.fatality:0 "พุ่งเข้าใส่ข้า ทำให้ข้าล้มลงกับพื้น\n\n[sc_loser.Custom('signature_weapon')] ของข้าลอยไป ชั่วเสี้ยววินาที ข้าจ้องตรงเข้าไปในปากที่เปิดกว้างของสัตว์เลื้อยคลานที่น่าสะพรึงกลัว\n\nจากนั้นทุกอย่างก็มืดลง เปียกแฉะ และเจ็บปวด: ข้าดิ้นรน ข้าสำลัก ข้าพยายามกรีดร้อง แต่ไม่มีเสียงใดเล็ดลอดออกมาจากปากของสัตว์ร้าย มีเพียงเสียงกระดูกที่ถูกบดขยี้และไขกระดูกที่พุ่งออกมา"
 single_combat.0031.desc.opponent_response.desert_warrior.fatality:0 "เตะเข่าข้าออกจากข้างใต้อย่างคล่องแคล่ว\n\nถูกโยนลงไปใน [sc_defender.Custom('GroundType')] ข้าดิ้นรนเพื่อลุกขึ้น หมดลมหายใจโดยสิ้นเชิง\n\n[sc_victor.Custom('signature_weapon')] ของ [sc_victor.GetFirstNamePossessiveNoTooltip] [sc_victor.Custom('SignatureWeaponWoundVerb2ThirdPersonPresent')] เข้าที่หน้าอกข้าจากด้านบน และ เช่นนั้นเอง มันก็จบลง แขนขาข้ากระตุกอย่างน่าสมเพช แต่การต่อสู้ได้ออกจากร่างกายข้าไปแล้ว"
 single_combat.0031.desc.opponent_response.jungle_stalker.fatality:0 "ฟาดเข้าที่ตาข้าอย่างจังด้วย [sc_victor.Custom('SignatureWeaponEndType')] ของ [sc_victor.Custom('signature_weapon')] ของ [sc_victor.GetHerHis]\n\nประหลาดใจและกำลังดิ้นรนกับใบไม้อยู่แล้ว [sc_loser.Custom('signature_weapon')] ของข้าเองก็หลุดออกจากมือ\n\nไร้การป้องกัน ข้ากลายเป็นเหยื่อง่ายๆ สำหรับ [sc_victor.GetFirstNameNoTooltip] และชุด [sc_victor.Custom('SignatureWeaponAttemptedHeavyPlural')] ก็ค่อยๆ ควักไส้ข้าออกมา"
 single_combat.0031.desc.opponent_response.open_terrain_expert.fatality:0 "จนกระทั่งข้ายืดตัวมากเกินไป ข้าจึงเห็นว่า [sc_victor.GetSheHe] กำลังทำอะไร [sc_loser.Custom('signature_weapon')] ข้าเหวี่ยงไปข้างหน้าไกลเกินไป [sc_victor.GetFirstNameNoTooltip] หมุน [sc_victor.Custom('signature_weapon')] ของ [sc_victor.GetHerHis] กลับมา และความเจ็บปวดร้อนแรงก็ระเบิดขึ้นที่ข้างลำตัวข้า\n\nข้าทรุดลง หอบหายใจและไอ กลืนอากาศที่ขาดห้วงลงไปอย่างลำบาก มันไร้ประโยชน์ทั้งหมด\n\n[sc_victor.GetFirstNameNoTooltip] [sc_victor.Custom('SignatureWeaponActionThirdPerson')] [sc_victor.Custom('signature_weapon')] ของ [sc_victor.GetHerHis] สำหรับการสังหาร"
 single_combat.0031.desc.opponent_response.rough_terrain_expert.fatality.rocky:0 "ข้าสะดุด ลื่น และล้มลงไปตามทางลาด แขนขากางออก\n\nบางสิ่งที่แหลมคม หินหรืออาวุธ กระแทกเข้าที่กระดูกสันหลังข้า และร่างกายครึ่งล่างของข้าก็ชาไร้ความรู้สึกขณะที่ครึ่งบนกรีดร้องด้วยความทรมาน โลกหมุนหยุดลงกะทันหัน แขนข้างอผิดทาง เลือดเต็มตาข้า และข้าก็หนาวเหลือเกิน\n\n[sc_victor.GetFirstNameNoTooltip] ยืนค้ำอยู่เหนือข้า พร้อมที่จะยุติความทุกข์ทรมานข้า"
 single_combat.0031.desc.opponent_response.rough_terrain_expert.fatality.boggy:0 "ข้าลื่นและสะดุดลงไปในสระน้ำกร่อยลึก\n\n[sc_loser.Custom('signature_weapon')] ของข้าหายไปทันที และขณะที่ข้าตะเกียกตะกาย รองเท้าบู๊ตหนักก็เหยียบลงบนหลังคอข้า กดข้าไว้ใต้น้ำเหม็นเน่า\n\nทุกการดิ้นรนของข้าถูกตอบโต้ด้วยการเหวี่ยง [sc_victor.Custom('signature_weapon')] ของ [sc_victor.GetFirstNamePossessiveNoTooltip] อย่างสบายๆ จนกระทั่งข้าหมดเรี่ยวแรงแม้ แต่จะพยายามผลัก [sc_victor.GetHerHim] ออกไป"
 single_combat.0031.desc.opponent_response.forest_fighter.fatality:0 "กิ่งไม้ก่อนที่ข้าจะสะดุดล้มลงไปในพงหญ้า\n\nหนามและพุ่มไม้ขูด [sc_loser.Custom('MaskFace')] ข้า บางสิ่งที่เหนียวแน่นดึง [sc_loser.Custom('signature_weapon')] ข้าเกือบหลุดจากมือ ข้าต่อสู้เพื่อปลดปล่อยมัน งอตัวลงกับพื้น เมื่อบางสิ่งที่เย็นเฉียบดุจความตาย [sc_victor.Custom('SignatureWeaponKillTypeRearTorsoThirdPersonActive')]\n\nข้าทรุดลงทันที ดินและพืชเน่าเปื่อยเต็มปากข้า ข้ารู้สึกขาไม่ไหวและแขนก็อ่อนปวกเปียก\n\n[sc_victor.GetFirstNameNoTooltip] เตะข้าให้นอนหงายสำหรับการสังหาร"
 single_combat.0031.desc.opponent_response.raaargh.fatality:0 "[sc_loser.Custom('SignatureWeaponBreaksVerbPresentParticiple')] ของ [sc_loser.Custom('signature_weapon')] ข้าด้วย [sc_victor.Custom('SignatureWeaponAttemptedHeavy')] เพียงครั้งเดียว\n\n[sc_victor.GetFirstNameNoTooltip] พุ่งไปข้างหน้า ต่อยเข้าที่ [sc_loser.Custom('MaskFace')] ข้าอย่างแรงจนข้ากลืนฟันไปหลายซี่และลอยถอยหลัง หมุนรอบศีรษะ\n\nข้ากระแทก [sc_defender.Custom('GroundType')] อย่างแรง ไม่สามารถประมวลผลสิ่งที่เกิดขึ้นได้เลย เมื่อข้ากลับมามีสติ ก็มีรองเท้าบู๊ตกำลังลงมาที่ [sc_loser.Custom('MaskFace')] ข้าอย่างรวดเร็วและรุนแรง\n\nและอีกครั้ง และอีกครั้ง และอีกครั้ง..."
 single_combat.0031.desc.opponent_response.hard_grit.fatality:0 "ไม่นานนักข้าก็ถูกบังคับให้เผชิญหน้ากับความจริง [sc_victor.GetSheHe|U] ทำให้ข้าเสียหลักโดยไม่มีช่องว่างให้ยึดพื้นที่กลับคืน และข้าไม่สามารถปิดกั้นได้ตลอดไป\n\nเมื่อความตายมาถึง อย่างน้อยมันก็รวดเร็ว เมื่อ [sc_victor.Custom('signature_weapon')] ของ [sc_victor.GetHerHis] [sc_victor.Custom('SignatureWeaponWoundVerb4ThirdPersonPresent')] คอข้าจนกลายเป็นซากปรักหักพังเปื้อนเลือด"
 single_combat.0031.desc.opponent_response.feint_and_stab.fatality:0 "การโจมตีกรีดเข้าที่หน้าอกข้า และน้ำพุเลือดแท้ๆ ก็พุ่งออกมาจากบาดแผล\n\nบางทีอาจเป็นความโง่เขลาที่ไปต่อกรกับ [sc_victor.GetWomanMan] ที่ฆ่าเพื่อความสนุกสนานเป็นประจำ? อาจจะใช่ อาจจะไม่ใช่ ไม่ว่าทางใด ความชาที่แพร่กระจายอย่างรวดเร็วในแขนขาข้าบอกข้าว่าข้าไม่มีเวลามากนักที่จะเสียใจกับความผิดพลาดของข้า"
 single_combat.0031.desc.opponent_response.butchery.fatality:0 "ไม่นานนักข้าก็กลายเป็นซากที่สั่นเทา [sc_loser.Custom('EyeEyes')] เบิกกว้างด้วยความเจ็บปวด ข้าอยากจะรู้สึกชา แต่ดูเหมือนว่าสิ่งนี้จะรุนแรงขึ้นเรื่อยๆ กับการโจมตี แต่ละครั้งของ [sc_victor.Custom('signature_weapon')] ของ [sc_victor.GetFirstNamePossessiveNoTooltip]\n\nมันแทบจะเป็นความเมตตาเมื่อถึงเวลาที่ [sc_victor.GetSheHe] คว้าหลังศีรษะข้าและ [sc_victor.Custom('SignatureWeaponKillTypeHead2ThirdPersonActive')]; อย่างน้อยข้าก็ตายเร็วขึ้น"
 single_combat.0031.desc.opponent_response.stoic_veteran.fatality:0 "จนกระทั่งการทุ่มน้ำหนักครั้งสุดท้ายใส่ [sc_loser.Custom('signature_weapon')] ข้า [sc_loser.Custom('SignatureWeaponBreaksThirdPersonSingularPresent2')]\n\nข้าไม่ได้ถูกทิ้งให้ครุ่นคิดถึงโชคร้ายนานนัก เนื่องจากการโจมตีครั้งต่อไปโดนเข้าที่หน้าอกข้าอย่างจังและ [sc_victor.Custom('SignatureWeaponKillTypeTorsoThirdPersonActive')]\n\nข้าทรุดลงกับพื้น ชีวิตรินไหลออกไปทุกวินาที ปากขยับโดยบังเอิญมากกว่าตั้งใจ [sc_victor.Custom('signature_weapon')] ของ [sc_victor.GetFirstNamePossessiveNoTooltip] ยังคงฝังอยู่ในตัวข้า"
 single_combat.0031.desc.opponent_response.blade_dance.fatality:0 "กรีดเป็นรอยเปื้อนเลือดบนปลาย [sc_loser.Custom('ArmArms')] และหน้าอกส่วนบนข้า ดูดเลือดข้าเหมือนน้ำบ่อ\n\nมันชัดเจนขึ้นว่าข้าเป็นเพียงเกมสำหรับ [sc_victor.GetHerHim] เมื่อ [sc_victor.GetSheHe] เล่นจบแล้ว\n\nหมดแรง กำลังจะตาย ข้าทรุดลงคุกเข่า แอ่งเลือดของข้าเองให้ความอบอุ่นขณะที่ข้าดิ้นรนเพื่อเงยหน้ามองฆาตกรข้า\n\n[sc_victor.GetFirstNameNoTooltip] ตอบรับสายตาข้าด้วยความไม่แยแสอันว่างเปล่า [sc_victor.Custom('signature_weapon')] ของ [sc_victor.GetHerHis|U] เริ่มร่วงลงมาอย่างน่าสะพรึงกลัว"
 single_combat.0031.desc.opponent_response.wrath_of_highgod.fatality:0 "[sc_victor.Custom('SignatureWeaponAttemptedHeavy')] ที่โดนแรงเสียจน [sc_loser.Custom('signature_weapon')] ของข้า [sc_loser.Custom('SignatureWeaponBreaksThirdPersonSingularPresent')]\n\nตกตะลึง ข้าแข็งทื่อ ทำอาวุธไร้ค่าหล่นลงไปใน [sc_defender.Custom('GroundType')] มันกินเวลาเพียงวินาทีเดียว แต่วินาทีเดียวคือทั้งหมดที่ [sc_victor.GetFirstNameNoTooltip] ต้องการเพื่อ [sc_loser.Custom('SignatureWeaponKillTypeFirstPersonFuture')]"
 single_combat.0031.desc.opponent_response.hurt_me_better.fatality:0 "ลงเอยด้วยชุด [sc_victor.Custom('SignatureWeaponAttemptedLightPlural')] ที่ฟาดข้าราวกับลูกหมาแรกเกิด\n\nการโต้กลับทุกครั้งของข้าดูเหมือนจะไร้ผล คู่ต่อสู้ข้ายินดีรับการลงโทษในปริมาณที่น่าขัน หาก [sc_victor.GetSheHe] สามารถตอบโต้กลับพร้อมดอกเบี้ยได้\n\nข้ามองไม่เห็นการสังหาร เพียงแค่รู้สึกว่ามัน [sc_victor.Custom('SignatureWeaponWoundVerb2PresentParticiple')] เข้าที่ข้างลำตัวข้า เลือดอุ่นๆ เปียกๆ เริ่มไหลลงมาตามเอวข้าขณะที่ข้าล้มลงไปใน [sc_defender.Custom('GroundType')]"
 single_combat.0031.desc.opponent_response.special_fallback.fatality:0 "[sc_victor.Custom('SignatureWeaponEndType')] ของ [sc_victor.Custom('signature_weapon')] ของ [sc_victor.GetFirstNamePossessiveNoTooltip] พุ่งตรงเข้าที่ [sc_loser.Custom('MaskFace')] ข้า ข้าล้มลงราบพร้อมเสียงหอบ [sc_loser.Custom('signature_weapon')] ข้าลื่นหลุดไปขณะที่ข้าทรุดลง และคู่ต่อสู้ข้าก็เตะข้าให้นอนหงาย\n\nก่อนที่ข้าจะมีเวลาคัดค้าน [sc_victor.GetSheHe] ก็ [sc_victor.Custom('SignatureWeaponKillTypeThirdPersonActive')] ด้วย [sc_victor.Custom('signature_weapon')] ของ [sc_victor.GetHerHis] ท้องข้า #EMP ร้องเพลง#! ด้วยความทรมาน แขนขาข้าชาไร้ความรู้สึก ใบหน้าข้าเย็นเฉียบ\n\nนี่... นี่คือจุดจบ"
 ### No need for a something_to_hide, as it's never fatal.

 ## Aggressor Lost, Own Combat Move Feedback
 single_combat.0031.desc.sc_attacker.wait_and_hope:0 "การหวังให้คู่ต่อสู้ทำร้าย [sc_victor.GetHerselfHimself] เองกลายเป็นความคิดที่ผิดพลาด\n\nด้วยความลังเล ข้าจึงกลายเป็นเหยื่ออันโอชะสำหรับ [sc_victor.Custom('SignatureWeaponAttemptedHeavy')] ที่"
 single_combat.0031.desc.sc_attacker.unsure_attack:0 "ด้วยความหวังมากกว่าทักษะ ข้าลอง [sc_loser.Custom('SignatureWeaponAttemptedLight')] อย่างลังเล ซึ่งไม่ได้ผลอะไรเลย คู่ต่อสู้ข้าไม่มีปัญหาในการถอยห่างจากการโจมตีข้า เพียงเพื่อจะ"
 single_combat.0031.desc.sc_attacker.enthusiastic_onslaught:0 "ข้าพุ่งเข้าใส่คู่ต่อสู้ [sc_loser.Custom('signature_weapon')] [sc_loser.Custom('SignatureWeaponFlourishPresentParticiple')] มุ่งมั่นที่จะฟาดฟัน [sc_loser.GetHerHim] ลงด้วยการโจมตีอย่างบ้าคลั่งให้มากครั้งที่สุดเท่าที่จะทำได้\n\n"
 single_combat.0031.desc.sc_attacker.hail_mary:0 "บางครั้งในการต่อสู้ ท่านก็รู้ได้เองว่าเสียเปรียบ นั่นคือกรณีนี้ เมื่อการเดิมพันอันสิ้นหวังของข้าเปลี่ยนจากการระดม [sc_loser.Custom('SignatureWeaponAttemptedHeavyPlural')] อย่างบ้าคลั่งเป็น"
 single_combat.0031.desc.sc_attacker.pocket_sand:0 "คว้า [sc_defender.Custom('GritType')] กำมือหนึ่ง ข้าขว้างมันใส่คู่ต่อสู้ เพียง แต่ลมกระโชก ทำให้ข้าเสียจังหวะและส่ง [sc_defender.Custom('GritType')] ปลิวกลับเข้า [sc_loser.Custom('MaskFace')] #EMP ของข้า#! ตรงๆ\n\n"
 single_combat.0031.desc.sc_attacker.nut_em:0 "ข้าสาบานได้ว่าข้าเห็นช่องว่างในการป้องกันของคู่ต่อสู้ แต่ขณะที่ข้าพุ่งตัวไปข้างหน้าเพื่อโขกกะโหลกข้าเข้าที่ [sc_loser.Custom('MaskFace')] ของ [sc_victor.GetHerHis] บางสิ่งก็จับข้าไว้"
 single_combat.0031.desc.sc_attacker.guard:0 "ข้าพยายามอย่างสุดความสามารถที่จะรักษาท่าป้องกันที่มั่นคง แต่มันก็ไม่ได้ผล ช่องว่างที่เห็นได้ชัดในการปัดป้องข้าเปิดโอกาสให้"
 single_combat.0031.desc.sc_attacker.probing_attack:0 "ความพยายามของข้าที่จะถนอมกำลังกลับผิดพลาดอย่างรวดเร็วเมื่อหนึ่งในการโจมตีหยั่งเชิงข้าถูกปัดป้องอย่างแรง จนกระทั่ง"
 single_combat.0031.desc.sc_attacker.onslaught:0 "ข้าโยน [sc_loser.Custom('SignatureWeaponAttemptedHeavy')] ครั้งแล้วครั้งเล่าใส่คู่ต่อสู้ เป็นการระดมโจมตีอย่างไม่หยุดยั้งที่โดนเป้าอย่างร้ายแรง จนกระทั่งมันไม่โดน\n\n"
 single_combat.0031.desc.sc_attacker.surprise_attack:0 "แม้ข้าจะปกปิดการกระทำข้าอย่างดีที่สุดเท่าที่จะทำได้ คู่ต่อสู้ข้ามองการจู่โจมไม่ให้ตั้งตัวข้าออก ปัดป้องข้าอย่างไม่คาดคิดและ ทำให้ข้าเสียหลัก\n\n"
 single_combat.0031.desc.sc_attacker.taunt:0 "ข้าถอยกลับ พร้อมที่จะดูถูกคู่ต่อสู้ข้าอย่างถึงที่สุด แต่กลับปล่อยให้ตัวเองเสียสมาธิชั่วขณะ\n\nข้าไม่ทันเห็นแม้ แต่ [sc_victor.Custom('SignatureWeaponAttemptedHeavy')]"
 single_combat.0031.desc.sc_attacker.put_the_boot_in.peg_leg:0 "แม้ [sc_loser.Custom('SignatureWeaponAttemptedHeavy')] ข้าจะ ทำให้คู่ต่อสู้โซเซ [sc_victor.GetSheHe] ก็ตอบโต้ก่อนที่การเตะข้าจะโดนเป้าเสียอีก: [sc_victor.Custom('SignatureWeaponAttemptedLight')] ที่รุนแรงจน ทำให้ขาปลอมข้าหลุดและส่งข้ากลิ้งลงกับพื้น\n\n"
 single_combat.0031.desc.sc_attacker.put_the_boot_in.fallback:0 "แม้ [sc_loser.Custom('SignatureWeaponAttemptedHeavy')] ข้าจะ ทำให้คู่ต่อสู้โซเซ การเตะตามมากลับพลาดเป้าไปอย่างสิ้นเชิง และหลังจาก [sc_victor.Custom('SignatureWeaponAttemptedLight')] โต้กลับเพียงครั้งเดียว ข้าก็นอนหายใจหอบอยู่บนพื้น\n\n"
 single_combat.0031.desc.sc_attacker.strict_guard:0 "มีน้อยคนที่จะเถียงว่าการป้องกันข้านั้นยากที่จะทำลายได้น้อยกว่าแทบจะเป็นไปไม่ได้ แต่ถึงกระนั้นคู่ต่อสู้ข้าก็ทำได้ อาจจะด้วยทักษะ อาจจะด้วยโชค\n\n"
 single_combat.0031.desc.sc_attacker.confident_attack:0 "ข้าใช้ [sc_loser.Custom('signature_weapon')] ด้วยความเชี่ยวชาญและสง่างาม แต่แม้ แต่ผู้เชี่ยวชาญก็ทำพลาดได้ กลาง [sc_loser.Custom('SignatureWeaponAttemptedLight')] ที่คำนวณมาอย่างเสี่ยง คู่ต่อสู้ข้า"
 single_combat.0031.desc.sc_attacker.expert_onslaught:0 "ด้วยทักษะอันร้ายกาจ ข้าระดม [sc_loser.Custom('SignatureWeaponAttemptedHeavyPlural')] ใส่คู่ต่อสู้ข้าอย่างแท้จริง บีบให้ [sc_victor.GetHerHim] ถอยหลังทีละก้าว ชัยชนะอยู่ใกล้จนข้าสัมผัสได้!\n\n"
 single_combat.0031.desc.sc_attacker.attempt_disarm:0 "คำนวณว่าตอนนี้น่าจะเป็นโอกาสที่ดีที่สุดสำหรับชัยชนะง่ายๆ ข้าพยายามปัด [sc_victor.Custom('signature_weapon')] ออกจากมือคู่ต่อสู้ด้วย [sc_loser.Custom('SignatureWeaponAttemptedHeavy')] อันทรงพลังครั้งเดียว มันเกือบจะเป็นเรื่องน่าประหลาดใจเมื่อ [sc_victor.GetSheHe] จับ [sc_loser.Custom('signature_weapon')] ข้าผิดมุม,"
 ### No need for a lightning_assault, as you can't end the duel in the first round.
 single_combat.0031.desc.sc_attacker.tire_opponent:0 "เล่นเพื่อซื้อเวลา ข้าถอยห่างจากคู่ต่อสู้ พยายามเคลื่อนผ่านการโจมตีของ [sc_victor.GetHerHis] จนกระทั่ง [sc_victor.GetSheHe] เหนื่อยล้า กลยุทธ์อันตรายในยามปกติ ข้าพบว่าตัวเองโดน [sc_victor.Custom('SignatureWeaponAttemptedLightPlural')] หลายครั้งที่"
 single_combat.0031.desc.sc_attacker.reason_you_suck_speech:0 "บางคนอาจเรียกข้าว่าคนโง่ที่วิจารณ์วิถีชีวิตคู่ต่อสู้ขณะที่เราทั้งคู่ถืออาวุธอันตราย พวกเขาคงรู้สึกว่าตนคิดถูกอย่างแน่นอนเมื่อ"
 single_combat.0031.desc.sc_attacker.technique_from_legend:0 "ข้าสงสัยอยู่บ่อยครั้งว่าคำพูดที่เขียนหรือดาบอันคมกริบของ [sc_loser.GetLadyLord] นั้นทรงพลังกว่ากัน สำหรับคู่ต่อสู้ข้า อย่างน้อยก็ดูเหมือนจะเป็น [sc_victor.Custom('signature_weapon')] ของ [sc_victor.GetHerHis] ขณะที่ [sc_victor.GetSheHe] เยาะเย้ยการเลียนแบบในตำนานข้า\n\n"
 single_combat.0031.desc.sc_attacker.like_a_viper:0 "ข้าพุ่งเข้าใส่ช่องว่างในการป้องกันของคู่ต่อสู้อย่างแรง [sc_loser.Custom('SignatureWeaponTipType')] ของ [sc_loser.Custom('signature_weapon')] แวววาว พร้อมที่จะยุติสิ่งนี้ สิ่งที่ข้าไม่ได้คำนึงถึงคือ"
 single_combat.0031.desc.sc_attacker.pocket_silver:0 "ด้วยความคล่องแคล่วทั้งหมดที่ข้ารวบรวมได้ ข้าคว้าถุงเงินจากเอวและโยนมันตรงไปที่คู่ต่อสู้ โชคไม่ดีที่ [sc_victor.GetSheHe] ตอบสนองตามสัญชาตญาณเร็วกว่าที่ข้าจินตนาการไว้ ทำลายถุงนั้นด้วย [sc_victor.Custom('SignatureWeaponAttemptedHeavy')] ตามสัญชาตญาณ ซึ่ง ทำให้ข้าอาบไปด้วยเหรียญเงินหนักๆ\n\nแม้จะประหลาดใจ,"
 single_combat.0031.desc.sc_attacker.martial_voice:0 "การบัญชาการฝูงชนและการบัญชาการทหารชั้นสูงพิสูจน์ว่าเป็นชุดทักษะที่แยกจากกันอย่างน่าหดหู่ ด้วยความโกรธเคืองมากกว่าตกตะลึงจากการกรีดร้องข้า คู่ต่อสู้ข้ารอให้ข้าหมดลมหายใจ จากนั้นจึง"
 single_combat.0031.desc.sc_attacker.mocking_boast:0 ""เจ้ารู้หรือไม่ว่าวิธีที่ดีในการสร้างชื่อเสียงคืออะไร?" คู่ต่อสู้ข้าถาม [my_foe.Custom('EyeEyes')] หรี่ลงตอบสนองต่อคำโอ้อวดเยาะเย้ยข้า "การฆ่าคนมีชื่อเสียง"\n\nข้า... [sc_victor.GetSheHe] พูดไม่ผิด ความลังเลข้าเปิดโอกาสให้ [sc_victor.GetHerHim] #EMP พอดี#! ที่จะ"
 single_combat.0031.desc.sc_attacker.is_that_a_crocodile:0 "ข้าหลบถอยหลัง ยอมเสียพื้นที่อย่างบ้าคลั่ง เพื่อให้ออกจากระยะของสัตว์ร้าย ยกเว้นว่า มันไม่ขยับ\n\nมันคือก้อนหิน มันเป็นเพียง #EMP ก้อนหิน#! บ้าๆ ไม่ใช่จระเข้บ้าๆ และตอนนี้คู่ต่อสู้ข้า ทำให้ข้าเสียสมดุลและโซเซ\n\n"
 single_combat.0031.desc.sc_attacker.desert_warrior:0 "ข้ารอแล้วรอเล่าให้คู่ต่อสู้ข้าเหนื่อยล้าจากความร้อนทะเลทราย แต่ [sc_victor.GetSheHe] ดูเหมือนจะเหงื่อออกไม่หยุด สู้ต่อไป และความตกตะลึงข้า ทำให้การป้องกันอ่อนแอลง\n\n"
 single_combat.0031.desc.sc_attacker.jungle_stalker:0 "ป่า ทำให้การต่อสู้ยากในหลายแง่มุม แต่มือสมัครเล่นที่อดทนสามารถเอาชนะอุปสรรคที่เลวร้ายที่สุดบางอย่างได้เพียงแค่รักษาความเยือกเย็นของ [sc_loser.GetHerHis] ไว้ ขณะที่รอให้อารมณ์คู่ต่อสู้ข้าแตกสลาย ข้ารู้สึกถึงบางสิ่งเริ่มพันรอบขาข้า และเหลือบมองลงไปเห็นว่าข้าพันอยู่กับเถาวัลย์หนา\n\n"
 single_combat.0031.desc.sc_attacker.open_terrain_expert:0 "ด้วยพื้นที่ต่อสู้มากมาย ข้าถอยหลังแล้วถอยหลังเล่า แลกเปลี่ยนพื้นที่กับความคับข้องใจคู่ต่อสู้ข้า จนกระทั่งข้าสะดุด ข้าจึงตระหนักว่า [sc_victor.GetSheHe] ต้อนข้ามาที่บางสิ่ง ข้าเห็นก้อนหินเป็นครั้งแรกขณะล้มหงายหลัง\n\n"
 single_combat.0031.desc.sc_attacker.rough_terrain_expert.rocky:0 "แม้คู่ต่อสู้ข้าจะไม่คุ้นเคยกับการต่อสู้ในสภาพแวดล้อมที่ไม่เรียบและเต็มไปด้วยหินเท่าข้า [sc_victor.GetSheHe] ก็รักษาท่าทางของ [sc_victor.GetHerHis] ได้ดีเยี่ยม ทำให้การผลักข้าไม่ได้ผลอะไรนอกจาก ทำให้สมดุล #EMP ของข้า#! เสียไป\n\n"
 single_combat.0031.desc.sc_attacker.rough_terrain_expert.boggy:0 "แม้ แต่สำหรับทหารผ่านศึกอย่างข้า หนองบึงและที่ลุ่มชื้นแฉะก็มีอันตรายมากมายที่ประเมินได้ยาก ทุกสระที่ข้าผลักคู่ต่อสู้ข้าเข้าไปกลับตื้นจนไม่เป็นอันตราย แต่ครั้งแรกที่ข้าเสี่ยงก้าวลงไปในน้ำ ข้าก็จมลงไปถึงเข่า!\n\n"
 single_combat.0031.desc.sc_attacker.forest_fighter:0 "บางครั้ง ป่าก็หนาทึบและน่ากลัวเสียจนมี แต่คนโง่เท่านั้นที่คิดจะก้าวเท้าเข้าไปคนเดียว บางครั้ง มันก็งดงามอย่างไม่น่าเชื่อจนเด็กๆ เป็นลมเพียงแค่คิดว่าจะได้เล่นที่นั่น\n\nพื้นที่ป่าปัจจุบันเราเอนเอียงไปทางหลัง และขณะที่ข้ามองหาอันตรายจากสภาพแวดล้อมเพื่อฉวยโอกาส คู่ต่อสู้ข้า"
 single_combat.0031.desc.sc_attacker.raaargh:0 "กรีดร้องฆาตกรรมเปื้อนเลือด ข้าพุ่งเข้าใส่คู่ต่อสู้ สะบัด ฟาด กัด เตะ พายุแห่งความโกรธเกรี้ยวและความรุนแรงที่ดูเหมือนจะดำเนินไปตลอดกาล\n\nเมื่อมันสงบลง ข้าพบว่า"
 single_combat.0031.desc.sc_attacker.hard_grit:0 "ในการรบ ข้ามีนิสัยชอบฉวยโอกาสจากความเย่อหยิ่งของศัตรู ความมั่นใจที่ไม่สมเหตุสมผลควรถูกลงโทษด้วยความพ่ายแพ้อย่างรวดเร็ว อย่างไรก็ตาม คู่ต่อสู้ข้าตอนนี้ดูเหมือนจะมุ่งมั่นที่จะสู้กับข้าแบบตาต่อตาฟันต่อฟันเท่านั้น เปิดช่องว่างเพียงเพื่อล่อให้ข้ายืดตัวมากเกินไป\n\n"
 single_combat.0031.desc.sc_attacker.feint_and_stab:0 "การแบ่งสมาธิข้าระหว่างการโจมตีสองครั้งพิสูจน์ว่าเป็นเรื่อง... ทะเยอทะยาน ข้าตระหนักครั้งแรกว่า [sc_loser.Custom('signature_weapon')] ถูกกระชากออกจากมือเมื่อกริชในมืออีกข้างข้ากระตุกเข้าหามันโดยไม่สมัครใจ,"
 single_combat.0031.desc.sc_attacker.butchery:0 "ปรากฏว่า การฆ่าชาวนาที่หวาดกลัวหน้ากองทัพนักปล้นมืออาชีพนั้นแตกต่างจากการประลองยุทธ์กับศัตรูที่แน่วแน่คนเดียวอยู่บ้าง\n\nเทคนิคที่ ทำให้เด็ก คนป่วย และคนชราหวาดกลัวไม่ได้ผล เช่นเดียวกันกับคู่ต่อสู้ข้า ผู้ ซึ่งฉวยโอกาสจากความมั่นใจเกินเหตุง่ายๆ ข้าเพื่อ"
 single_combat.0031.desc.sc_attacker.stoic_veteran:0 "ในกององครักษ์ เราปกป้องจักรพรรดิจากมือสังหารเป็นหลัก แต่มือสังหารส่วนใหญ่หนีเมื่อเห็นสัญญาณของวารังเจียนติดอาวุธหนัก คู่ต่อสู้ข้า ต้องให้เครดิต [sc_victor.GetHerHis] ดูไม่สะทกสะท้านกับรูปลักษณ์ที่น่าเกรงขามของข้า และการฟันอย่างสงบนิ่งข้าก็ถูกตอบโต้ด้วยการปัดป้องอย่างแน่วแน่ครั้งแล้วครั้งเล่า\n\n"
 single_combat.0031.desc.sc_attacker.blade_dance:0 "ในการรบ ข้าคือศิลปิน การโจมตีทุกครั้งคือฝีแปรง ศัตรูที่ล้มล- #EMP บ้าเอ๊ย#! โอ๊ย บ้าเอ๊ย มือข้างที่ถือ [sc_loser.Custom('signature_weapon')] ข้า [sc_victor.GetSheHe] ตีข้า #EMP ตรง#! ที่มือข้างที่ถือ [sc_loser.Custom('signature_weapon')] ข้า นั่นไม่ควรเกิดขึ้น!\n\n"
 single_combat.0031.desc.sc_attacker.wrath_of_highgod:0 "ข้าไม่สงสัยเลยว่า [sc_loser.GetFaith.HighGodName] ตั้งใจให้ข้าชนะการประลองนี้ และข้าก็พูด เช่นนั้นในคำสวดภาวนาที่ตะโกนออกไป โชคไม่ดีที่คู่ต่อสู้ข้าฉวยโอกาสจากสมาธิที่ไขว้เขวของข้าเพื่อ"
 single_combat.0031.desc.sc_attacker.hurt_me_better:0 "ข้าไม่ใช่คนแปลกหน้าสำหรับความเจ็บปวด และพยายามอย่างสุดความสามารถที่จะดึงพลังจากอาการบาดเจ็บที่คู่ต่อสู้ข้ามอบให้ แม้ แต่สำหรับข้า สิ่งเหล่านี้ก็พิสูจน์ว่ามากเกินไป และจิตใจข้ามุ่งเน้นไปที่ความรู้สึกไม่สบายอย่างแท้จริงของเนื้อที่ฉีกขาดน้อยลง และมุ่งเน้นไปที่ความเจ็บปวดอันแสนหวานน้อยลง\n\nเมื่อสมาธิข้าหายไป สิ่งที่ควรจะเป็นการพุ่งเข้าใส่อย่างกระตือรือร้นกลับกลายเป็นขบวนแห่ [sc_loser.Custom('SignatureWeaponAttemptedLightPlural')] ที่น่าเศร้าแทน\n\n"
 single_combat.0031.desc.sc_attacker.special_fallback:0 "ด้วยความโกรธทั้งหมดที่ข้ารวบรวมได้ ข้าเตะอย่างรุนแรงไปที่หน้าแข้งคู่ต่อสู้ข้า เพียงเพื่อรู้สึกว่าสมดุลข้าหายไปอย่างสิ้นเชิงขณะที่ข้าพลาด #EMP อย่างสิ้นเชิง#! ส่งร่างข้าพุ่งตามเท้าที่พลาดไป\n\n"
 single_combat.0031.desc.sc_attacker.something_to_hide:0 "ข้าเพิ่งจะอ้างอิงถึงหนี้สินคู่ต่อสู้ข้าอย่างแนบเนียนได้เพียงครึ่งทาง เมื่อ [sc_victor.Custom('SignatureWeaponEndType')] ของอาวุธ [sc_victor.GetHerHis] กระแทกเข้าที่กรามข้าอย่างจัง ข้าโซเซถอยหลัง,"

 ## Aggressor Lost, Own Combat Move Injury
 single_combat.0031.desc.sc_attacker.wait_and_hope.injury:0 "เหวี่ยงข้าลงไปใน [sc_defender.Custom('GroundType')] ข้าตะเกียกตะกายกลับ แต่เมื่อข้าตั้งหลักได้ ก็มี [sc_victor.Custom('SignatureWeaponTipType')] [sc_victor.Custom('SignatureWeaponTipAdjective')] ของ [sc_victor.Custom('signature_weapon')] กดแน่นอยู่ที่คอข้า\n\nอีกครั้ง ข้าแข็งทื่อ"
 single_combat.0031.desc.sc_attacker.unsure_attack.injury:0 "พุ่งเข้ามาด้วย [sc_victor.Custom('SignatureWeaponAttemptedHeavy')] ที่ ทำให้ข้าเสียสมดุลอย่างสิ้นเชิง\n\nก่อนที่ข้าจะตั้งตัวได้ การเตะตามมาก็ส่งข้าลอยลงกับพื้น และข้าก็กำลังจ้องมองขึ้นไปที่ [sc_victor.Custom('SignatureWeaponArticle')] [sc_victor.Custom('signature_weapon')] พร้อมที่จะทิ่มลงมาที่คอข้า"
 single_combat.0031.desc.sc_attacker.enthusiastic_onslaught.injury:0 "ข้ามองไม่เห็นการโจมตีด้วย [sc_victor.Custom('SignatureWeaponEndType')] ที่ข้างศีรษะข้าเท่าที่ข้ารู้สึกถึงมัน ระเบิดความเจ็บปวดร้อนแรงสีขาวที่ขมับข้าพร้อมกับการเปลี่ยนแปลงมุมมองกะทันหันขณะข้าล้มไปด้านข้าง\n\nเท้าของ [sc_victor.GetFirstNamePossessiveNoTooltip] ปรากฏขึ้นตรงหน้าข้า เปลี่ยนไปใช้ท่าต่อสู้หลังจากหยุดชั่วครู่ด้วยความสงสาร\n\nข้ามีความอดทนพอที่จะเปล่งเสียงแหบแห้งออกมาได้เพียงประโยคเดียว"
 single_combat.0031.desc.sc_attacker.hail_mary.injury:0 "ขบวนแห่งความผิดพลาด\n\nการโจมตีพลาดหรือสะท้อนกลับจากการปัดป้องของ [sc_victor.GetFirstNamePossessiveNoTooltip] มาโดนข้า ข้าเสียการทรงตัว และถึงกับตีเข้าที่ [sc_loser.Custom('MaskFace')] ตัวเองด้วยมือที่สะบัดไปมา\n\nมันแทบจะเป็นความเมตตาเมื่อคู่ต่อสู้ข้าแทบจะตี [sc_loser.Custom('signature_weapon')] หลุดจากมือข้าอย่างนุ่มนวล"
 single_combat.0031.desc.sc_attacker.pocket_sand.injury:0 "สำลักและไออย่างแรง ข้ากลายเป็นเหยื่อง่ายๆ สำหรับ [sc_victor.GetFirstNameNoTooltip] ผู้ ซึ่งฟาดเข้าที่คอข้าตรงๆ ด้วย [sc_victor.Custom('SignatureWeaponEndType')] ของ [sc_victor.Custom('signature_weapon')] ของ [sc_victor.GetHerHis] ส่งข้าลอยละลิ่วลงไปใน [sc_defender.Custom('GroundType')]\n\nข้าเพิ่งจะหายใจหายคอได้ทันเวลาที่รู้สึกว่าอาวุธ [sc_victor.GetHerHis] มาหยุดพักที่ท้องข้าที่เปิดโล่ง"
 single_combat.0031.desc.sc_attacker.nut_em.injury:0 "อย่างแรงที่ท้อง ส่งข้าลอยผ่านอากาศว่างเปล่าหน้าคว่ำลงกับพื้น\n\nข้าตะเกียกตะกาย พยายามลุกขึ้นยืน แต่การเตะอย่างรุนแรงหลายครั้งแสดงให้ข้าเห็นถึงความผิดพลาดในวิถีทางข้าอย่างรวดเร็ว [sc_victor.Custom('signature_weapon')] ที่กดเบาๆ ที่ต้นคอข้าก็ไม่ได้ช่วยอะไร"
 single_combat.0031.desc.sc_attacker.guard.injury:0 "[sc_victor.Custom('SignatureWeaponAttemptedLightPlural')] ที่วางไว้อย่างดีหลายครั้ง โดยการโจมตีครั้งสุดท้ายปัดอาวุธข้ากระเด็นไป\n\n[sc_victor.GetFirstNameNoTooltip] ไม่เสียเวลาในการเตรียม [sc_victor.Custom('signature_weapon')] ของ [sc_victor.GetHerHis] เองสำหรับการสังหาร"
 single_combat.0031.desc.sc_attacker.probing_attack.injury:0 "ข้าเสียการควบคุม\n\n[sc_loser.Custom('signature_weapon')] ของข้าโค้งออกไปอย่างสง่างาม ปลายต่อปลาย ปล่อยให้ข้าไร้อาวุธในระยะประชิด\n\n[sc_victor.GetFirstNameNoTooltip] เพียงแค่ต้อง [sc_victor.Custom('SignatureWeaponAction')] [sc_victor.Custom('signature_weapon')] ของ [sc_victor.GetHerHis] เอง เพื่อให้ชัดเจนว่าใครชนะการประลองนี้"
 single_combat.0031.desc.sc_attacker.onslaught.injury:0 "แทนที่จะเป็น เช่นนั้น [sc_loser.Custom('signature_weapon')] ข้ากลับฟันเข้าใส่อากาศธาตุ และข้ารู้สึกถึงบางสิ่งที่หนักหน่วงเกี่ยวที่ด้านหลังเข่าข้าและดึง ข้าหมุนครึ่งตัวอย่างงุ่มง่าม พยายามนำอาวุธข้ามาใช้ และโดนหมัดเข้าที่ [sc_loser.Custom('MaskFace')] เต็มๆ เป็นรางวัล\n\nขณะข้าโซเซ การโจมตีอย่างมั่นคงก็กระชาก [sc_loser.Custom('signature_weapon')] ข้าออกไป และเป็นที่ชัดเจนทันทีว่าข้าแพ้แล้ว"
 single_combat.0031.desc.sc_attacker.surprise_attack.injury:0 "ก่อนที่ข้าจะเหวี่ยง [sc_loser.Custom('signature_weapon')] กลับมาป้องกันการโต้กลับที่หลีกเลี่ยงไม่ได้ ข้าก็โดนเข่าที่ไม่คาดคิดเข้าที่ท้อง การงอตัวด้วยความเจ็บปวดมี แต่จะ ทำให้โดนศอกเข้าที่หลังศีรษะเพิ่ม และข้าก็ล้มลง เกือบตาบอดจากความเจ็บปวด ลงกับพื้น"
 single_combat.0031.desc.sc_attacker.taunt.injury:0 "กระแทกเข้าใส่ข้า และข้าก็ล้มลงพร้อมเสียง #EMP ดังตุ้บ#! อย่างหนัก\n\nหน้าคว่ำอยู่ใน [sc_defender.Custom('GroundType')] ข้าสามารถพึมพำได้เพียงประโยคเดียวหรือประมาณนั้น"
 single_combat.0031.desc.sc_attacker.put_the_boot_in.injury:0 "ข้าเอียงไปด้านข้าง พยายามดีดตัวกลับขึ้นมา แต่การโจมตีอันโหดร้ายจาก [sc_victor.Custom('signature_weapon')] ของ [sc_victor.GetFirstNamePossessiveNoTooltip] กระแทกเข้าที่กระดูกสันหลังและกดข้าให้คว่ำหน้า\n\nที่ไหนสักแห่งข้างหลังและเหนือข้า ข้าได้ยิน [sc_victor.GetHerHim] กำลังง้างสำหรับการสังหารพร้อมเสียงเยาะเย้ยที่ได้ยินชัดเจน"
 single_combat.0031.desc.sc_attacker.strict_guard.injury:0 "สิ่งที่สำคัญจริงๆ คือ หลังจาก [sc_victor.Custom('signature_weapon')] โจมตีเพียงไม่กี่ครั้ง อาวุธของ [sc_victor.GetFirstNamePossessiveNoTooltip] ก็วางอยู่บนคอข้าอย่างเย็นเฉียบ [sc_victor.Custom('SignatureWeaponTipType')] [sc_victor.Custom('SignatureWeaponTipAdjective')] กดขึ้นมาที่เส้นเลือดใหญ่ข้า\n\nขณะข้าครุ่นคิดถึงทางเลือก [sc_victor.GetFirstNameNoTooltip] ก็กระตุกอย่างไม่อดทน"
 single_combat.0031.desc.sc_attacker.confident_attack.injury:0 "ผลักอาวุธข้ากลับมาที่ข้าด้วยการปัดป้องที่วางไว้อย่างดี\n\nการหลบ [sc_loser.Custom('signature_weapon')] ของข้า ทำให้ข้าอยู่ในเส้นทางของ [sc_victor.Custom('signature_weapon')] ของ [sc_victor.GetFirstNamePossessiveNoTooltip] อย่างจัง และแม้การโจมตีจะหยุดลงก่อนที่จะถึงแก่ชีวิต มันก็ยังส่งข้าลอยลงกับพื้น อาวุธข้าลอยออกไปขณะข้าล้ม"
 single_combat.0031.desc.sc_attacker.expert_onslaught.injury:0 "ถึงกระนั้น ขณะข้าใช้เวลาสักครู่เพื่อเพลิดเพลินกับความรู้สึกอันแสนหวาน [sc_victor.Custom('SignatureWeaponAttemptedHeavy')] จากที่ไหนไม่ทราบก็กระแทกเข้าที่ขมับข้าอย่างแรง มึนงงชั่วขณะ ข้าโซเซ และการโจมตีครั้งต่อไป ทำให้ข้าไร้อาวุธ ตกอยู่ในความเมตตาของ [sc_victor.GetFirstNamePossessiveNoTooltip] อย่างสิ้นเชิง\n\nเหนื่อยล้า แต่มีชัย ศัตรูข้า [sc_victor.Custom('SignatureWeaponActionThirdPerson')] [sc_victor.Custom('signature_weapon')] ของ [sc_victor.GetHerHis] สำหรับการสังหาร"
 single_combat.0031.desc.sc_attacker.attempt_disarm.injury:0 "ส่งอาวุธลอยไป\n\nไร้ทางสู้ ข้ามีเวลาเพียงชั่วครู่ที่จะยอมรับความพ่ายแพ้ก่อนที่ [sc_victor.GetFirstNameNoTooltip] จะ [sc_victor.Custom('SignatureWeaponKillTypeThirdPersonActive')]"
 ### No need for a lightning_assault, as you can't end the duel in the first round.
 single_combat.0031.desc.sc_attacker.tire_opponent.injury:0 "ทำให้ข้าเสียสมดุลอย่างแรงจนข้าล้มลงไปเลย\n\n[sc_victor.GetFirstNameNoTooltip] ไม่ยอมหยุด และในไม่ช้าก็ยืนอยู่เหนือข้า พร้อมที่จะ [sc_victor.Custom('SignatureWeaponKillTypeGroinFirstPersonFuture')]"
 single_combat.0031.desc.sc_attacker.reason_you_suck_speech.injury:0 "[sc_victor.GetSheHe] กระแทกเข้าที่คอข้าด้วยการตบด้วย [sc_victor.Custom('SignatureWeaponEndType')] กลับหลังมือ\n\nขณะข้าสำลักและไอ พยายามสูดอากาศลงไปในหลอดลมที่ช้ำ [sc_victor.GetFirstNameNoTooltip] ก็มีเวลาเหลือเฟือที่จะง้างสำหรับการโจมตีที่สมบูรณ์แบบ\n\nในอีกเพียงวินาทีเดียว [sc_victor.GetSheHe] จะต้อง [sc_victor.Custom('SignatureWeaponKillTypeHeadFirstPersonFuture')] อย่างแน่นอน"
 single_combat.0031.desc.sc_attacker.technique_from_legend.injury:0 "ห่างไกลจากการเป็นกระบวนท่าเอกที่จบการต่อสู้ ข้าพบว่าตัวเองกำลังตั้งท่าอย่างน่าทึ่งและสูญเสียการควบคุม [sc_loser.Custom('signature_weapon')] ข้าไปอย่างสิ้นเชิง! อาวุธโค้งออกไปไกลอย่างสง่างาม\n\nงุนงง แต่มีความสุข [sc_victor.GetFirstNameNoTooltip] เพียงแค่แกว่ง [sc_victor.Custom('signature_weapon')] ของ [sc_victor.GetHerHis] เองไปในทิศทางข้าอย่างคลุมเครือ"
 single_combat.0031.desc.sc_attacker.like_a_viper.injury:0 "ความ #EMP อดทน#! อันแท้จริงของ [sc_victor.GetHerHis]\n\nเอนตัวเข้าหาการโจมตีข้า ไม่ใช่หนีจากมัน [sc_victor.GetFirstNameNoTooltip] สามารถเบี่ยงเบนข้าไปไกลพอที่จะพลาด #EMP อย่างหวุดหวิด#! เปิดโอกาสให้ข้าโดนเข่ากระแทกเข้าที่ท้องอย่างรวดเร็ว\n\nข้าล้มลง และมี [sc_victor.Custom('SignatureWeaponTipType')] ของ [sc_victor.Custom('SignatureWeaponArticle')] [sc_victor.Custom('signature_weapon')] กดอยู่ที่คอข้าก่อนที่ข้าจะทันคิดถึงการฟื้นตัว"
 single_combat.0031.desc.sc_attacker.pocket_silver.injury:0 "[sc_victor.GetFirstNameNoTooltip] กดดันความได้เปรียบของ [sc_victor.GetHerHis] กระชาก [sc_loser.Custom('signature_weapon')] ออกจากมือข้า ตอนนี้ไร้ทางสู้ ข้าบ้วนเหรียญเงินออกมาเบาๆ"
 single_combat.0031.desc.sc_attacker.martial_voice.injury:0 "ปล่อย [sc_victor.Custom('SignatureWeaponAttemptedHeavy')] ที่รุนแรงอย่างเหลือเชื่อ\n\nประหลาดใจและหมดลมหายใจ ข้าถูกโค่นลงโดยไม่มีปัญหา [sc_victor.GetFirstNameNoTooltip] ก้าวข้ามข้า เตรียม [sc_victor.Custom('signature_weapon')] ของ [sc_victor.GetHerHis] เพื่อ [sc_victor.Custom('SignatureWeaponKillTypeHeadFirstPersonFuture')]"
 single_combat.0031.desc.sc_attacker.mocking_boast.injury:0 "โจมตีเข้าที่หน้าอกข้าด้วย [sc_victor.Custom('SignatureWeaponAttemptedLight')] ประหลาดใจและจุก ข้าแทบไม่มีแรงต้านทานการโจมตีครั้งต่อไป ซึ่งพราก [sc_loser.Custom('signature_weapon')] ข้าไป และ [sc_victor.GetFirstNameNoTooltip] ก็เตรียมที่จะ [sc_victor.Custom('SignatureWeaponKillTypeFirstPersonFuture')] ด้วยการโจมตีครั้งต่อไปของ [sc_victor.GetHerHis]"
 ### No need for an is_that_a_crocodile, as it's never just an injury.
 single_combat.0031.desc.sc_attacker.desert_warrior.injury:0 "หลังจาก [sc_victor.Custom('SignatureWeaponAttemptedLightPlural')] ที่ไม่คาดคิดหลายครั้งจาก [sc_victor.GetFirstNameNoTooltip] ข้าก็สะดุดและล้มหน้าคว่ำลงไปใน [sc_defender.Custom('GroundType')] [sc_victor.Custom('signature_weapon')] ของ [sc_victor.GetHerHis|U] อยู่ที่หลังคอข้าในทันที"
 single_combat.0031.desc.sc_attacker.jungle_stalker.injury:0 "ข้าพยายามปลดปล่อยตัวเองด้วย [sc_loser.Custom('signature_weapon')] ข้า แต่ข้าไม่เร็วพอ และ [sc_victor.GetFirstNameNoTooltip] ก็จับข้าด้วย [sc_victor.Custom('SignatureWeaponAttemptedLight')] ที่ฝังอาวุธข้าลงไปในพื้นป่า\n\nข้าอาจมีเวลาสักสองสามวินาทีก่อนที่การประลองจะจบลงสำหรับข้า"
 single_combat.0031.desc.sc_attacker.open_terrain_expert.injury:0 "[sc_loser.Custom('signature_weapon')] ข้าลอยออกจากมือ และเท้าของ [sc_victor.GetFirstNamePossessiveNoTooltip] ก็เหยียบลงบนคอข้าก่อนที่ข้าจะทันเห็นว่ามันตกลงไปที่ใด"
 single_combat.0031.desc.sc_attacker.rough_terrain_expert.injury.rocky:0 "[sc_victor.Custom('SignatureWeaponAttemptedLight')] ที่โชคไม่ดี ทำให้ข้าล้มขึ้นไปบนทางลาด เบาตามมาตรฐาน แต่เป็นช่องว่างทั้งหมดที่ [sc_victor.GetFirstNameNoTooltip] ต้องการเพื่อ [sc_victor.Custom('SignatureWeaponKillTypeFirstPersonFuture')] หากได้รับอนุญาต"
 single_combat.0031.desc.sc_attacker.rough_terrain_expert.injury.boggy:0 "มันเป็นเรื่องง่ายสำหรับ [sc_victor.GetFirstNameNoTooltip] ที่จะปลดอาวุธข้าหลังจากนี้ ปล่อยให้ข้าตกอยู่ในความเมตตาของ [sc_victor.GetHerHis] อย่างสิ้นเชิง"
 single_combat.0031.desc.sc_attacker.forest_fighter.injury:0 "จับข้าด้วย [sc_victor.Custom('SignatureWeaponAttemptedHeavy')] ที่ร้ายแรง ซึ่งเกือบจะ ทำให้ข้าหมดสติ\n\nเมื่อข้าได้สติกลับคืนมา [sc_loser.Custom('signature_weapon')] ข้าก็หายไปแล้วและมีอาวุธกดแน่นอยู่ที่คอข้า"
 single_combat.0031.desc.sc_attacker.raaargh.injury:0 "ว่าข้าทำ [sc_loser.Custom('signature_weapon')] ข้า [sc_loser.Custom('SignatureWeaponBreaksVerbPastTense')] เสียแล้ว!\n\n[sc_victor.GetFirstNameNoTooltip] ยืนอยู่ห่างออกไปเล็กน้อย สภาพไม่แย่ไปกว่าตอนที่ข้าคลั่งมากนัก มองข้าอย่างระแวดระวัง ที่สำคัญ [sc_victor.GetSheHe] ยังคงมีอาวุธ และอยู่ไม่ไกลเกินไปสำหรับการพุ่งเข้าใส่อย่างมั่นคง"
 single_combat.0031.desc.sc_attacker.hard_grit.injury:0 "มันเป็นการต่อสู้ที่ตึงเครียด แต่ในที่สุด ข้าก็พลาดท่าให้กับการหลอกล่อ เช่นนั้นอย่างแรงเกินกว่าจะฟื้นตัวได้ แทนที่จะเป็น เช่นนั้น ข้านอนแผ่หลาอยู่บนพื้น ไร้อาวุธ"
 single_combat.0031.desc.sc_attacker.feint_and_stab.injury:0 "เพียง แต่อาวุธ #EMP นั้น#! ถูกทุบกระเด็นไปจากการเหวี่ยงกลับของ [sc_victor.GetFirstNamePossessiveNoTooltip]\n\nไร้อาวุธ ไร้อาวุธสำรอง และคู่ต่อสู้ข้ากำลังเตรียมที่จะ [sc_victor.Custom('SignatureWeaponKillTypeGroinFirstPersonFuture')] มีเพียงสิ่งเดียวที่ต้องทำ"
 single_combat.0031.desc.sc_attacker.butchery.injury:0 "ปลดอาวุธข้าได้อย่างง่ายดายจนน่าตกใจ\n\nการวางท่าและข่มขู่ข้าฟังดูกลวงเปล่าแล้วตอนนี้ ท่าทางน่าทึ่งใดๆ ก็ถูกโต้กลับได้อย่างง่ายดายด้วยการหมุน [sc_victor.Custom('signature_weapon')] ของ [sc_victor.GetFirstNamePossessiveNoTooltip]"
 single_combat.0031.desc.sc_attacker.stoic_veteran.injury:0 "ข้าพยายามอย่างสุดความสามารถ แต่มันเป็นเพียงเรื่องของเวลาก่อนที่บางสิ่งจะผิดพลาด และในที่สุด [sc_victor.GetFirstNameNoTooltip] ก็สามารถโต้กลับได้ ซึ่งบิด [sc_loser.Custom('signature_weapon')] หลุดออกจากมือข้าทันที\n\nด้วยเหตุนั้น การประลองจึงตัดสินแล้ว"
 single_combat.0031.desc.sc_attacker.blade_dance.injury:0 "ข้าต้องตั้งสติ ข้าต้องฟื้นตัว ข้าชนะได้ ข้าเพียงแค่ต้องการ ข้าเพียงแค่ ข- ข้ากำลังเผชิญหน้ากับ [sc_victor.GetFirstNameNoTooltip] ที่ยิ้มเยาะอย่างเห็นได้ชัด ผู้ ซึ่ง [sc_victor.Custom('SignatureWeaponActionThirdPerson')] [sc_victor.Custom('signature_weapon')] ที่ยังคง #EMP อยู่ใน#! [sc_victor.Custom('HandHands')] ของ [sc_victor.GetHerHis] ด้วยท่าทีคุกคามอย่างจงใจ"
 single_combat.0031.desc.sc_attacker.wrath_of_highgod.injury:0 "เตะเข้าที่หว่างขาของข้าอย่างแรง และข้าก็ทรุดลงเหมือนกระสอบกะหล่ำปลี\n\nการหายใจฟืดฟาดด้วยความโกรธต่อการดูหมิ่นของ [sc_victor.GetHerHis] ไม่ได้ช่วยอะไรข้าเลย และก่อนที่ข้าจะฟื้นตัว ข้าก็ต้องเผชิญหน้า [sc_loser.Custom('MaskFace')] กับ [sc_victor.Custom('SignatureWeaponTipType')] ของ [sc_victor.Custom('signature_weapon')]"
 single_combat.0031.desc.sc_attacker.hurt_me_better.injury:0 "ณ จุดนี้ ด้วยจิตใจข้าที่หมกมุ่นอยู่ มันไม่ยากเลยที่ [sc_victor.GetFirstNameNoTooltip] จะปัดป้องการโจมตีข้า ปลดอาวุธข้า และบังคับให้ยอมแพ้"
 single_combat.0031.desc.sc_attacker.special_fallback.injury:0 "[sc_victor.GetFirstNameNoTooltip] ฉวยโอกาสได้อย่างง่ายดาย ปล่อยให้ข้าพุ่งไปข้างหน้าก่อนที่จะเตะขาที่เหลือข้าให้ล้มลง ข้าลงไปกองพันกัน และการเตะอย่างมุ่งร้ายสองสามครั้งหลังจากนั้นก็ ทำให้ข้าอยู่ในสภาพนั้น"
 single_combat.0031.desc.sc_attacker.something_to_hide.injury:0 "บ้วนเลือดก้อนๆ ออกจากริมฝีปากที่แตกละเอียด\n\nการโจมตีครั้งต่อไปโดนเข้าที่ท้องข้า ทำให้ข้าทรุดลงกับพื้นอย่างหนัก หายใจไม่ออก ข้าหอบและอาเจียน เพียงรู้สึกว่า [sc_loser.Custom('signature_weapon')] ข้าหลุดออกจากมือในวินาทีสุดท้าย"

 ## Aggressor Lost, Own Combat Move Fatality
 single_combat.0031.desc.sc_attacker.wait_and_hope.fatality:0 "[sc_victor.Custom('SignatureWeaponWoundVerb1ThirdPersonPresent')] ตรงเข้าที่คอข้า ข้ามองด้วยความสยดสยองอยู่หนึ่งหรือสองวินาทีขณะที่เลือดในชีวิตข้าพุ่งออกมาเป็นสายเปียกๆ ก่อนที่จะลดลงเหลือเพียงชีพจรเบาๆ ที่ ทำให้หน้าอกข้าเปียกอย่างรวดเร็ว\n\nข้าทรุดลงคุกเข่า โลกช่างมืดมน มันเคยเป็น เช่นนี้เสมอไปหรือไม่?\n\nชาเหลือเกิน"
 single_combat.0031.desc.sc_attacker.unsure_attack.fatality:0 "พุ่งเข้าใส่ข้าอย่างไม่คาดคิด\n\n[sc_victor.Custom('SignatureWeaponAttemptedLight')] ที่ด้านข้างโดนจุดอ่อนในหน้าอกข้า [sc_victor.Custom('SignatureWeaponKillTypeTorso2PresentParticiple')] ในแนวทแยง ข้ารู้สึกถึงความเจ็บปวดที่ ทำให้หมดแรงและความชาที่ท่วมท้นในเวลาเดียวกันขณะที่ร่างกายข้าเริ่มล้มเหลวทันทีจากอวัยวะที่เสียหายร้ายแรงครึ่งโหล\n\nสิ่งเดียวที่ ทำให้ข้ามั่นคงคือ [sc_victor.Custom('signature_weapon')] ที่ฝังอยู่ในช่องอกข้า"
 single_combat.0031.desc.sc_attacker.enthusiastic_onslaught.fatality:0 "ข้าโจมตีไปไม่กี่ครั้งเมื่อบางสิ่ง [sc_victor.Custom('SignatureWeaponWoundVerb2ThirdPersonPresent')] ลึกเข้าไปในหน้าอกข้า ข้าหมุน สมดุลหายไปโดยสิ้นเชิง และเห็น [sc_victor.Custom('signature_weapon')] ของ [sc_victor.GetFirstNamePossessiveNoTooltip] ดึงออกมาจากร่างกายข้าพร้อมกับเลือดและเศษกระดูกที่กระเซ็น\n\nความเจ็บปวดโจมตีเข้ามาเสี้ยววินาทีหลังจากความไม่เชื่อหยุดลง ความเจ็บปวดแสบร้อนสีขาวที่กรีดร้องถูกครอบงำอย่างรวดเร็วด้วยความชาที่แผ่ซ่านไปทั่วอย่างไม่อาจหยุดยั้งจากบาดแผลร้ายแรงที่หน้าอกข้า"
 single_combat.0031.desc.sc_attacker.hail_mary.fatality:0 "ความพ่ายแพ้ที่รวดเร็วจนข้าไม่แน่ใจด้วยซ้ำว่าการโจมตีครั้งแรกของข้าโดนเป้าหรือไม่\n\nชั่วขณะหนึ่ง ข้ากำลังโจมตี [sc_victor.GetFirstNameNoTooltip] ด้วยทุกสิ่งที่ข้ามี ถัดมา ข้ารู้สึกถึงมือข้างที่ถือ [sc_loser.Custom('signature_weapon')] ข้าไม่ได้ บางสิ่ง... บางอย่างที่กระดูกสันหลังข้า หรือเปล่า? ข้าขยับกล้ามเนื้อไม่ได้ขณะล้มลงไปใน [sc_defender.Custom('GroundType')]\n\nข้าถูกเตะให้นอนหงาย อย่างน้อยก็ได้รับเกียรติให้มองตาฆาตกรข้า\n\nจากนั้น [sc_victor.Custom('signature_weapon')] ของ [sc_victor.GetHerHis] ก็ทิ่มลงมา"
 single_combat.0031.desc.sc_attacker.pocket_sand.fatality:0 "การเบี่ยงเบนความสนใจนั้นเปิดโอกาสให้ [sc_victor.Custom('signature_weapon')] ของ [sc_victor.GetFirstNamePossessiveNoTooltip] กระแทกเข้าที่ลำตัวข้า [sc_victor.Custom('SignatureWeaponKillTypeTorsoPresentParticiple')] อย่างมีประสิทธิภาพโหดร้าย\n\nร่างกายข้าระเบิดด้วยความทรมาน และข้าก็โซเซถอยหลัง อ-อะไรนะ? ทำได้อย่างไร? ข้า...\n\nเลือดพุ่งออกมาจากหน้าอกข้าเป็นสายโค้งร้อนๆ เปียกๆ ข้าครืดคราดบางอย่างที่ไม่เป็นภาษาผ่านปอดที่พังยับเยินข้า; แม้ แต่ #EMP ข้า#! ก็ไม่แน่ใจว่าคืออะไร การสังหารเพื่อความเมตตามาช้าเกินไป"
 single_combat.0031.desc.sc_attacker.nut_em.fatality:0 "บริเวณคาง [sc_victor.Custom('SignatureWeaponKillTypeHead2PresentParticiple')]\n\n[sc_victor.Custom('signature_weapon')] ของ [sc_victor.GetFirstNamePossessiveNoTooltip] กลับมาชุ่มโชกด้วยเลือดข้า ข้ากรีดร้องครึ่งหนึ่ง ครืดคราดครึ่งหนึ่งด้วยเสียงสยองขวัญ แต่แขนข้ายังทำงานได้ดีเกินไปที่ศัตรูข้าจะพิจารณาสังหารเพื่อความเมตตา\n\nแทนที่จะเป็น เช่นนั้น ข้าโซเซอยู่ชั่วขณะอันทรมาน ยังคงกุม [sc_loser.Custom('signature_weapon')] ของตัวเองตามสัญชาตญาณเพื่อความปลอดภัย จนกระทั่งข้าโซเซต่อไปไม่ได้อีก"
 single_combat.0031.desc.sc_attacker.guard.fatality:0 "[sc_victor.Custom('SignatureWeaponAttemptedHeavy')] จากคู่ต่อสู้ข้า ซึ่งกัดลึกเข้าไปในเนื้อต้นขาข้า\n\nเราแลกเปลี่ยนการโจมตีกันอีกหลายครั้ง จนกระทั่งข้าสังเกตเห็นความรู้สึกเปียกชื้นน่าตกใจบริเวณเอว ชั่วขณะหนึ่ง ข้าคิดว่าความกล้าหาญข้าล้มเหลวกลางสมรภูมิ จนกระทั่งการเหลือบมองลงไปแสดงให้เห็นว่าขาข้า #EMP ชุ่มโชก#! ไปด้วยเลือด\n\nทันใดนั้น มันก็โจมตีข้า และข้าก็ล้มลงกับพื้น ยังคงกระตุก"
 single_combat.0031.desc.sc_attacker.probing_attack.fatality:0 "[sc_loser.Custom('signature_weapon')] ข้า [sc_loser.Custom('SignatureWeaponBreaksThirdPersonSingularPresent')]\n\nข้ามีเวลาพอที่จะตระหนักว่าสถานการณ์เลวร้ายเพียงใดก่อนที่ [sc_victor.GetFirstNameNoTooltip] จะ [sc_victor.Custom('SignatureWeaponKillTypeThirdPersonActive')] ด้วยชุด [sc_victor.Custom('SignatureWeaponAttemptedLightPlural')]\n\nเนื้อที่ฉีกขาดร่ำไห้ ข้าโซเซ ข้ากุมบาดแผลข้า แต่มือกลับเปียกชุ่มด้วยเลือดข้าเอง\n\nนี่... นี่คือจุดจบ"
 single_combat.0031.desc.sc_attacker.onslaught.fatality:0 "บางสิ่งแตกที่หัวเข่าข้า และข้าก็ล้มลงกับพื้น แม้ข้าจะกลิ้งตัวให้เร็วที่สุดเท่าที่จะทำได้ โบก [sc_loser.Custom('signature_weapon')] ข้าเพื่อปัดป้อง [sc_victor.GetFirstNameNoTooltip] ข้าดูเหมือนจะไม่สามารถ #EMP เห็น#! [sc_victor.GetHerHim] ได้เลย [sc_victor.GetSheHe] ไปไหน [sc_victor.GetSheHe] ต้องอยู่ที่นี่สักแห่-"
 single_combat.0031.desc.sc_attacker.surprise_attack.fatality:0 "ข้าพยายามควบคุมตัวเองกลับคืนมา แต่การโจมตีครั้งต่อไปของ [sc_victor.GetHerHis] สามารถกระชาก [sc_loser.Custom('signature_weapon')] ออกจากมือข้าได้ ชั่วขณะหนึ่ง ทุกอย่างคือความตื่นตระหนก จากนั้นการประลองก็ตัดสินแล้ว\n\n[sc_victor.Custom('signature_weapon')] ของ [sc_victor.GetFirstNamePossessiveNoTooltip] [sc_victor.Custom('SignatureWeaponWoundVerb2ThirdPersonPresent')] ลึกเข้าไปในไหล่ข้า เฉือนผ่านกระดูกไหปลาร้าและฉีกบางสิ่งที่สำคัญหลุดออกมา ความชาเกิดขึ้นทันที: ความตื่นตระหนก ความเจ็บปวด ทุกสิ่งเพียงแค่... หยุดเป็นปัจจัย"
 single_combat.0031.desc.sc_attacker.taunt.fatality:0 "โดนข้า\n\nข้าเพียงรู้สึกถึงความเจ็บปวดที่สะท้อนไปทั่วร่างกายข้า ปลายประสาทนับพันกรีดร้องด้วยความทรมานขณะข้าโซเซและตาย"
 single_combat.0031.desc.sc_attacker.put_the_boot_in.fatality:0 "[sc_victor.GetFirstNameNoTooltip] ไม่ให้เวลาข้าฟื้นตัว [sc_victor.Custom('signature_weapon')] ของ [sc_victor.GetHerHis] [sc_victor.Custom('SignatureWeaponKillTypeTorso2PresentParticiple')] ด้วย [sc_victor.Custom('SignatureWeaponAttemptedLight')] เลือดพุ่งขึ้นคอและออกจากปากข้า กระเซ็นกลับลงมาบน [sc_loser.Custom('MaskFace')] ข้าเป็นรอยเปื้อนเหนียวๆ\n\nที่ไหนสักแห่งใต้ชั้นแล้วชั้นเล่าของความเจ็บปวด ข้ารู้สึกว่าหัวใจข้ายังเต้นอยู่ ยังคงสูบฉีดเลือดผ่านเส้นเลือดที่ฉีกขาดและออกจากหลอดเลือดแดงที่แตกละเอียด ไม่มีทางกลับมาจากสิ่งนี้ได้"
 single_combat.0031.desc.sc_attacker.strict_guard.fatality:0 "ในท้ายที่สุด มันก็ไม่สำคัญเท่าไหร่ ซากปรักหักพังที่แตกสลายของคอข้าเป็นเครื่องพิสูจน์เพียงพอว่ามันเกิดขึ้นแล้ว และวิธีการนั้นไม่สำคัญ\n\nข้าโงนเงน ชีวิตรินไหล ชั่วขณะหนึ่งข้ายังอยู่ ถัดมา..."
 single_combat.0031.desc.sc_attacker.confident_attack.fatality:0 "โดน [sc_victor.Custom('SignatureWeaponAttemptedHeavy')] อย่างแรงเข้าที่ท้องข้า ฉีกเปิดเนื้อที่เปราะบางและ ทำให้ไส้ข้าทะลักลงกับพื้นอย่างไม่เรียบร้อย\n\nข้าลื่นในกองไส้ตัวเอง สะดุดถอยหลังพร้อมเสียงกรีดร้อง ร่างกายลุกเป็นไฟด้วยความทรมาน\n\nการปลิดชีพมาช้าเกินไป"
 single_combat.0031.desc.sc_attacker.expert_onslaught.fatality:0 "จนกระทั่งการปัดป้องที่ไม่คาดคิดเบี่ยงเบนเข้าที่ [sc_loser.Custom('MaskFace')] ข้า [sc_loser.Custom('SignatureWeaponWoundVerb6PresentParticiple')] บาดแผลลงไปถึงกระดูกและ ทำให้ข้าโซเซถอยหลัง ข้าเปล่งเสียงร้องด้วยความเจ็บปวดประหลาดใจ ถอยห่างจากอาวุธที่ปะทะกัน เมื่อเท้าข้าถูกกวาดออกจากใต้ตัวข้า\n\nมีเวลาพอที่จะกรีดร้องคัดค้านก่อนที่ [sc_victor.GetSheHe] จะ [sc_victor.Custom('SignatureWeaponKillTypeGroinThirdPersonActive')], [sc_victor.Custom('SignatureWeaponKillTypeGroinThirdPersonActive_Aftermath')]\n\nความตายคือการปลดปล่อย"
 single_combat.0031.desc.sc_attacker.attempt_disarm.fatality:0 "จริงๆ แล้ว [sc_loser.Custom('SignatureWeaponBreaksVerbPresentParticiple')]\n\nมันเป็นเรื่องง่ายสำหรับ [sc_victor.GetFirstNameNoTooltip] ที่จะ [sc_victor.Custom('SignatureWeaponKillTypeFirstPersonFuture')] ด้วย [sc_victor.Custom('signature_weapon')] ของ [sc_victor.GetHerHis] หลังจากนั้น และโลกข้าก็หดเล็กลงเหลือเพียงจุดแสงและความเจ็บปวดอันแคบๆ"
 ### No need for a lightning_assault, as you can't end the duel in the first round.
 single_combat.0031.desc.sc_attacker.tire_opponent.fatality:0 "ทำให้ข้าเสียสมดุลอย่างสิ้นเชิง\n\nโซเซและสะดุด [sc_victor.Custom('SignatureWeaponAttemptedHeavy')] อย่างแรงก็เหวี่ยงข้าลงไปใน [sc_defender.Custom('GroundType')] ทันที แม้จะมีอาวุธที่หัก ข้าก็สามารถปัดป้องการโจมตีครั้งต่อไปของ [sc_victor.GetFirstNamePossessiveNoTooltip] ได้ แต่ครั้งถัดมา [sc_victor.Custom('SignatureWeaponKillTypeHead2ThirdPersonActive')]\n\nเสียงร้องอันน่าสะพรึงกลัวข้าอยู่ได้ไม่นาน เพราะความเจ็บปวดครอบงำสติข้าก่อนความตายจะมาถึง"
 single_combat.0031.desc.sc_attacker.reason_you_suck_speech.fatality:0 "[sc_victor.GetFirstNameNoTooltip] ใช้สมาธิที่ไขว้เขวข้าเพื่อเล็ง [sc_victor.Custom('SignatureWeaponAttemptedHeavy')] อย่างมั่นคง ซึ่ง [sc_victor.Custom('SignatureWeaponKillTypeHead2ThirdPersonActive')]\n\nข้าเซถอยหลัง พุ่งกระฉูดเหมือนน้ำพุอันน่าสยดสยอง นี่คงไม่ใช่จุดจบ มันไม่ควรจบลงแบบนี้ ข้าทำได้... ข้ายังคง... ข้าสามารถ...\n\nข้าทำอะไรไม่ได้ ข้าโซเซลงสู่หลุมศพที่เปียกโชกด้วยเลือดข้า"
 single_combat.0031.desc.sc_attacker.technique_from_legend.fatality:0 "ห่างไกลจากการเป็นชัยชนะทันที ข้าพบว่าตัวเองถูกเหวี่ยงลงกับพื้นหน้าคว่ำ ข้าแทบไม่มีเวลาดิ้นรนก่อนที่ [sc_victor.Custom('signature_weapon')] ของ [sc_victor.GetFirstNamePossessiveNoTooltip] จะ [sc_victor.Custom('SignatureWeaponKillTypeRearTorsoThirdPersonActive')]\n\nอะดรีนาลีน ทำให้ความเจ็บปวดส่วนใหญ่หายไป แต่ไม่ใช่ทั้งหมด และข้ากรีดร้องขณะถูกเตะให้นอนหงายสำหรับการสังหารที่หลีกเลี่ยงไม่ได้"
 single_combat.0031.desc.sc_attacker.like_a_viper.fatality:0 "ส่วนโค้งของ [sc_victor.Custom('signature_weapon')] ของ [sc_victor.GetFirstNamePossessiveNoTooltip] ซึ่งฟันเข้าที่หน้าอกข้าจากด้านข้าง [sc_victor.Custom('SignatureWeaponKillTypeTorsoPresentParticiple')] ด้วย [sc_victor.Custom('SignatureWeaponAttemptedHeavy')] เพียงครั้งเดียว\n\nถูกเหวี่ยงออกไปโดยการโต้กลับและแรงเหวี่ยงข้าเอง ข้าลอยเข้าไปใน [sc_defender.Custom('GroundType')] แขนข้ายังทำงานได้ แต่มันรู้สึก... อ่อนแอเหลือเกิน หนักเหลือเกิน สิ่งที่ข้าทำได้คือพลิกตัว เลือดสีแดงเหนียวไหลทะลักออกจากหน้าอกข้า"
 single_combat.0031.desc.sc_attacker.pocket_silver.fatality:0 "[sc_victor.GetFirstNameNoTooltip] เคลื่อนไหวเร็ว ผลักข้าลงกับพื้นก่อนที่ข้าจะทันเห็นว่าเกิดอะไรขึ้น ชั่วขณะอันน่าสะพรึงกลัวต่อมา และ [sc_victor.GetSheHe] ก็ [sc_victor.Custom('SignatureWeaponKillTypeGroinThirdPersonActive')], [sc_victor.Custom('SignatureWeaponKillTypeGroinThirdPersonActive_Aftermath')]\n\nข้ากรีดร้องในตอนแรก แต่ปอดข้าล้มเหลวเร็วกว่าที่ข้าคาดไว้ และในไม่ช้าสิ่งที่ข้าทำได้คือ #EMP ทน#! อย่างไร้คำพูด"
 single_combat.0031.desc.sc_attacker.martial_voice.fatality:0 "ก้าวไปข้างหน้าและ [sc_victor.Custom('SignatureWeaponWoundVerb4ThirdPersonPresent')] คอข้าออกอย่างใจเย็นด้วยการเคลื่อนไหวอย่างรวดเร็วครั้งเดียว\n\nจุดจบเกือบจะ... เรียบง่าย ไม่มีลีลา ไม่มีการกรีดร้อง ไม่มีสัญญาณของสิ่งเหนือธรรมชาติมารับข้า\n\nมีเพียงความเจ็บปวดที่ผลิบาน เสียงครืดคราดเปียกๆ ข้าเอง และ [my_foe.Custom('EyeEyes')] ที่ไร้อารมณ์ของ [sc_victor.GetFirstNamePossessiveNoTooltip] กำลังมองข้าตาย"
 single_combat.0031.desc.sc_attacker.mocking_boast.fatality:0 "เริ่มการหลอกล่ออย่างมีเล่ห์เหลี่ยม หมุนหลังข้าเข้าหา [sc_victor.GetFirstNameNoTooltip] ขณะข้าพยายามปัดป้องผิดทาง\n\nไม่ถึงวินาทีต่อมา [sc_victor.Custom('signature_weapon')] ของศัตรูข้าก็ [sc_victor.Custom('SignatureWeaponKillTypeRearTorsoThirdPersonActive')] ด้วย [sc_victor.Custom('SignatureWeaponAttemptedHeavy')] ข้าทรุดลง พับตัวผิดท่าทับขาข้า ความทรมานระลอกผ่านเศษเนื้อและกระดูกที่ยังคงเชื่อมต่อกับเส้นประสาทที่แตกสลายข้าได้"
 single_combat.0031.desc.sc_attacker.is_that_a_crocodile.fatality:0 "การพุ่งเข้าใส่ฉวยโอกาสจาก [sc_victor.GetFirstNameNoTooltip] ทะลุผ่านการป้องกันข้าไปอย่างจัง เปิดโอกาสให้ [sc_victor.GetHerHim] [sc_victor.Custom('SignatureWeaponWoundVerb3')] ร่างกายครึ่งบนข้าด้วย [sc_victor.Custom('SignatureWeaponAttemptedHeavy')] อันทรงพลัง\n\nข้าทรุดลงหงายหลัง เนื้อที่ฉีกขาดและริ้วเลือดปลิวว่อนขณะที่อาวุธถูกดึงออกจากตัวข้า คืออะไร ข้าไม่ได้ นี่คงไม่ใช่ ช่วยด้วย\n\n#EMP ช่วยด้วย#! "
 single_combat.0031.desc.sc_attacker.desert_warrior.fatality:0 "มันเป็นเพียงตอนที่ข้าหยุดเพื่อเช็ดหยดเหงื่อออกจาก [sc_loser.Custom('EyeEyes')] #EMP ของข้า#! ที่สิ่งต่างๆ เริ่มผิดพลาดอย่างร้ายแรง: [sc_victor.GetFirstNameNoTooltip] เลือก #EMP วินาทีนั้น#! พอดีที่จะโจมตีข้าด้วย [sc_victor.Custom('SignatureWeaponAttemptedHeavy')] ข้าถูกกระแทกลงก่อนที่จะตั้งตัวได้ และการโจมตีครั้งต่อไป [sc_victor.Custom('SignatureWeaponWoundVerb5ThirdPersonPresent')] เข้าที่คอข้าอย่างยุ่งเหยิง\n\nข้าครืดคราดผ่านคอที่พังยับเยินข้า เป่าฟองน้ำลายปนเลือดที่ยุ่งเหยิงขณะพยายามพูดอะไรบางอย่างออกมา แม้จะร้อนเพียงใด ข้ากลับรู้สึกหนาวเหลือเกิน"
 single_combat.0031.desc.sc_attacker.jungle_stalker.fatality:0 "การเหลือบมองนั้นพิสูจน์ว่าเป็นจุดจบข้า [sc_victor.GetFirstNameNoTooltip] กระโจนเข้าหาโอกาสด้วยความยินดี และเมื่อข้ามองกลับขึ้นไปในเสี้ยววินาทีต่อมา ก็มี [sc_victor.Custom('SignatureWeaponTipType')] ของ [sc_victor.Custom('SignatureWeaponArticle')] [sc_victor.Custom('signature_weapon')] กำลังจะ [sc_victor.Custom('SignatureWeaponWoundVerb1')] เข้าที่ท้องข้า\n\nข้ากรีดร้องด้วยความเจ็บปวด แต่มันสายเกินไปแล้ว แม้ว่าบาดแผลแรกจะไม่ถึงแก่ชีวิต [sc_victor.GetFirstNameNoTooltip] ก็ดูเหมือนจะโจมตีได้แม่นยำยิ่งขึ้นด้วยการโจมตีครั้งต่อไปของ [sc_victor.GetHerHis]"
 single_combat.0031.desc.sc_attacker.open_terrain_expert.fatality:0 "การลงพื้นนั้นนุ่มนวล แต่เท้าของ [sc_victor.GetFirstNamePossessiveNoTooltip] ที่เป้าข้าไม่เป็น เช่นนั้น และข้าก็ยังคงมึนงงอยู่ชั่วขณะสำคัญ นั่นคือทั้งหมดที่ต้องใช้เพื่อ [sc_victor.Custom('SignatureWeaponKillTypeTorsoFirstPersonFuture')] ด้วย [sc_victor.Custom('signature_weapon')] ของ [sc_victor.GetHerHis]\n\nเลือดหัวใจข้าสูบฉีดขึ้นและออกจากหน้าอกข้าอย่างรุนแรง ไหลลงมาตามซี่โครงข้า กองรวมกันใน [sc_defender.Custom('GroundType')] รอบตัวข้า\n\nอย่างน้อยข้าก็ตายในที่ที่ข้าสามารถเห็นท้องฟ้าเปิดได้"
 single_combat.0031.desc.sc_attacker.rough_terrain_expert.fatality.rocky:0 "ในท้ายที่สุด สิ่งนี้พิสูจน์ว่าเป็นจุดจบข้า การผลักครั้งหนึ่งมากเกินไปส่งข้าข้ามหน้าผาเล็กๆ ตกลงไปอย่างแรงบนขาข้างเดียวและ ทำให้มันพิการอย่างสิ้นเชิง\n\nเมื่อถึงเวลาที่ [sc_victor.GetFirstNameNoTooltip] ปีนลงจากขอบผามาหาข้า ข้าก็เกือบจะหมดสติไปแล้วจากความเจ็บปวด ไม่มีการต่อสู้ในสภาพนี้ ศัตรูข้ายก [sc_victor.Custom('signature_weapon')] ของ [sc_victor.GetHerHis] ขึ้น: อย่างน้อยความทุกข์ทรมานข้าก็จะจบลงอย่างรวดเร็ว"
 single_combat.0031.desc.sc_attacker.rough_terrain_expert.fatality.boggy:0 "มันเป็นเพียงการตะเกียกตะกายอย่างสิ้นหวังที่สุดในชีวิตข้าที่ข้าสามารถดึงตัวเองออกมาได้ แต่โชคข้ากลับสั้นนัก ขณะข้าโซเซออกจากสระหนึ่ง ข้าก็ตกลงไปในอีกสระหนึ่ง หน้าคว่ำ บางสิ่งข้างบน [sc_victor.Custom('SignatureWeaponKillTypeRearTorsoThirdPersonActive')]\n\nข้าขยับไม่ได้ ข้าดิ้นรนไม่ได้ ข้าพยายามกรีดร้อง แต่น้ำสีเขียวเต็มปอดข้า และข้าก็จมลงไปลึกขึ้นในห้วงลึกของหนองบึง"
 single_combat.0031.desc.sc_attacker.forest_fighter.fatality:0 "เริ่มระดม [sc_victor.Custom('SignatureWeaponAttemptedLightPlural')] อย่างรวดเร็ว\n\nข้าไม่รู้แน่ชัดว่าครั้งไหนที่กรีดโดนหลอดเลือดแดงที่ไหน แต่ไม่นานนักข้าก็ช้าลง เปียกโชกด้วยเลือดตัวเองตั้งแต่ไหล่จรดข้อมือ ด้วยพิธีรีตองเล็กน้อย ข้าล้มหงายหลัง ข้าเหนื่อยเหลือเกิน ข้าไม่สามารถ... ข้าไม่สามารถ..."
 single_combat.0031.desc.sc_attacker.raaargh.fatality:0 "[sc_victor.GetFirstNameNoTooltip] ยืนอยู่ใกล้น่าตกใจ\n\nข้าบังคับแขนให้เอื้อมไปหา [sc_victor.GetHerHim] สังเกตด้วยความสนใจเพียงเล็กน้อยว่าข้าทำ [sc_loser.Custom('signature_weapon')] ข้าหล่น แต่... ไม่มีอะไร เลือดทั้งหมดนี้มาจากไหน? ก้อนเนื้อนั้นเป็นของข้าหรือเปล่า? ทำไมข้ารู้สึก... ชาเหลือเกิน?\n\nโอ้"
 single_combat.0031.desc.sc_attacker.hard_grit.fatality:0 "ต้องใช้เวลาสักพักก่อนที่พวกเราคนหนึ่งจะทำพลาดให้อีกฝ่ายฉวยโอกาสได้ แต่มันก็เกิดขึ้นในที่สุด ข้าทุ่มเทให้กับ [sc_loser.Custom('SignatureWeaponAttemptedLight')] มากเกินไป และก่อนที่ข้าจะหลบทัน ก็มี [sc_victor.Custom('SignatureWeaponArticle')] [sc_victor.Custom('signature_weapon')] ฝังอยู่ในท้องข้า\n\nมันก็เป็น เช่นนั้นเอง"
 single_combat.0031.desc.sc_attacker.feint_and_stab.fatality:0 "ซึ่งเบี่ยงเบนความสนใจข้าไปนานพอที่ข้าจะไม่สังเกตเห็น [sc_victor.Custom('SignatureWeaponAttemptedLight')] ตามมาก่อนที่มันจะ [sc_victor.Custom('SignatureWeaponKillTypeTorso2PresentParticiple')]\n\nข้าโซเซ จากนั้นก็ล้มหงายหลังลงไปใน [sc_defender.Custom('GroundType')] ชักกระตุก พยายามกรีดร้อง แต่ไม่สามารถทำได้เกินกว่าเสียงกระซิบแหบแห้ง ใครจะทน #EMP ความเจ็บปวด#! ขนาดนี้ได้?\n\nพวกเขาทำไม่ได้"
 single_combat.0031.desc.sc_attacker.butchery.fatality:0 "ก้าวเข้ามาในวงป้องกันข้าและ [sc_victor.Custom('SignatureWeaponKillTypeHead2FirstPersonFuture')]\n\nข้าโซเซไปข้างหน้า ไร้คำพูด สำลักเลือดตัวเอง แม้กระทั่งทำ [sc_loser.Custom('signature_weapon')] ตัวเองหล่นเพื่อมุ่งเน้นไปที่การพยายามอุดบาดแผลที่พ่นเลือดในชีวิตข้าลงไปใน [sc_defender.Custom('GroundType')]\n\nน-นี่คือสิ่งที่มันเป็น เช่นนั้นรึ? หลาย... หลายครั้งเหลือเกิน..."
 single_combat.0031.desc.sc_attacker.stoic_veteran.fatality:0 "ต้องใช้เวลามากกว่าการโต้กลับที่ประสบความสำเร็จสองสามครั้งก่อนที่ข้าจะพลาดท่าในที่สุด เลือดไหลซึมจากรอยแผลที่ฉีกขาดครึ่งโหลและรอยกรีดที่ขรุขระทั่วลำตัวข้า หากไม่มีอะไรอื่น ก็ไม่มีใครสามารถพูดได้ว่าข้าล้มลงง่ายๆ แต่ [sc_loser.GetWomanMan] ทุกคนก็มีขีดจำกัดของ [sc_victor.GetHerHis]\n\nข้าทรุดลงคุกเข่า พร้อมสำหรับการสังหารของ [sc_victor.GetFirstNamePossessiveNoTooltip] ดูเหมือนว่าข้าจะถึงขีดจำกัดของข้าแล้ว"
 single_combat.0031.desc.sc_attacker.blade_dance.fatality:0 "เจ้าเด็กน้อยหน้าด้านนี่คิดว่า [sc_victor.GetSheHe] กำลังทำอะไรอยู่ ข-\n\nข้ามี [sc_victor.Custom('SignatureWeaponArticle')] [sc_victor.Custom('signature_weapon')] ฝังอยู่ในหน้าอกข้า ทำได้อย่างไร ที่ไหน แต่ข้า... ข้าคือศิลปิน"
 single_combat.0031.desc.sc_attacker.wrath_of_highgod.fatality:0 "ฟาดเข้าที่ [sc_loser.Custom('MaskFace')] ข้าด้วย [sc_victor.Custom('SignatureWeaponEndType')] ของ [sc_victor.Custom('signature_weapon')] ของ [sc_victor.GetHerHis]\n\nข้าโซเซถอยหลัง คำรามด้วยความโกรธแค้นต่อการดูหมิ่น แต่ความโกรธข้าก็ถูกตัดให้สั้นลง เช่นกันเมื่อ [sc_victor.GetFirstNameNoTooltip] [sc_victor.Custom('SignatureWeaponWoundVerb5ThirdPersonPresent')] อาวุธ [sc_victor.GetHerHis] เข้าที่ปอดข้า ข้าสำลัก หายใจไม่ออก แทบไม่สามารถเปล่งเสียงได้ขณะที่เลือดเริ่มเต็มช่องอกข้า"
 single_combat.0031.desc.sc_attacker.hurt_me_better.fatality:0 "ไม่ว่าใครก็ตาม [sc_loser.GetWomanMan] คนใดก็สามารถเสียเลือดได้มากเท่านั้น และดูเหมือนว่าข้าเสียเลือดมากเกินไปแล้ว\n\n[sc_victor.GetFirstNameNoTooltip] เตรียม [sc_victor.Custom('signature_weapon')] ของ [sc_victor.GetHerHis] เพื่อ [sc_victor.Custom('SignatureWeaponKillTypeHeadFirstPersonFuture')]"
 single_combat.0031.desc.sc_attacker.special_fallback.fatality:0 "ด้วยการเข้าถึงหลังข้าได้อย่างไม่มีอุปสรรค มันง่ายพอที่ [sc_victor.GetFirstNameNoTooltip] จะ [sc_victor.Custom('SignatureWeaponKillTypeFirstPersonFuture')] ด้วยการระดม [sc_victor.Custom('SignatureWeaponAttemptedLightPlural')] อย่างรวดเร็ว\n\nข้าล้มลงไปใน [sc_defender.Custom('GroundType')] ลงไปที่ข้างลำตัว ไอและหายใจหอบผ่านกระดูกที่หักและอวัยวะที่ฉีกขาด เจ็บปวดเหลือเกิน เจ็บปวดเหลือเกิน จางหายไปสู่ความเย็น จางหายไปสู่ความชา จางหายไปสู่... จางหาย..."
