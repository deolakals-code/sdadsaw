 single_combat.0031.a.killed_by_another_head_of_faith:0 "[sc_loser.GetFaith.HighGodName] #DIE1 ทรงเมตตาข้า#! #DIE2 [sc_victor.GetTitleAsNameNoTooltip] เจ้าพูดเช่นเดียวกันได้หรือไม่#!..."
 single_combat.0031.a.killed_by_cultural_head:0 "เจ้าไม่ใช่ชาว #DIE1 [sc_loser.GetCulture.GetNameNoTooltip]#! #DIE2 ที่แท้จริง#!..."
