 ra_dynastic_cycle_open_trigger: "เปิดหน้าต่าง $game_concept_dynastic_cycle$"
 ra_dynastic_cycle_era_open_eras_desc: "ก่อนอื่น เรามาดู [dynastic_cycle_era_short|e] ที่วัฏจักรราชวงศ์กำลังดำเนินอยู่"
 ra_dynastic_cycle_era_open_eras_trigger: "เปิดแท็บ '$dynastic_cycle_tab_dynastic_cycle$'"
 ra_dynastic_cycle_era_effects_desc: "จีนกำลังอยู่ใน [dynastic_cycle_era_short|e] แห่งความก้าวหน้า\n\nหากท่านเป็นขุนนางระดับต่ำ สิ่งสำคัญที่สุดที่ต้องเข้าใจคือมันส่งผลกระทบต่อท่านอย่างไร ซึ่งแสดงไว้ที่นี่\n\nมี $game_concept_dynastic_cycle_eras_short$ ที่แตกต่างกันมากมาย ซึ่งทั้งหมดจะนำพาจีนไปในทิศทางที่แตกต่างกัน"
 ra_dynastic_cycle_era_open_groups_desc: "สถานะของจักรวรรดิไม่สามารถเปลี่ยนแปลงได้ด้วยตัวเอง แต่ได้รับอิทธิพลจากกลุ่ม [characters|E] ที่ทรงพลังภายในพรมแดนของจีน เรามาดู $game_concept_characters$ เหล่านี้กัน"
 ra_dynastic_cycle_era_open_groups_trigger: "เปิดแท็บ '$dynastic_cycle_tab_movements$'"
 ra_dynastic_cycle_era_groups_desc: "[characters|E] จำนวนมากในและรอบ ๆ ประเทศจีนมีผลกระทบต่ออนาคตของจีน $game_concept_characters$ เหล่านี้อยู่ใน [movements|e] ซึ่ง แต่ละกลุ่มต้องการนำพาจีนไปในทิศทางที่แตกต่างกัน\n\nตัวอย่าง เช่น $dynastic_cycle_participant_group_advancement_movement|V$ ต้องการปรับปรุงจักรวรรดิโดยมองเข้าภายในผ่าน [dynastic_cycle_era_short|e] แห่งความก้าวหน้า ในขณะที่ $dynastic_cycle_participant_group_expansion_movement|V$ ปรารถนาให้จีนเติบโตและขยายตัวผ่านกำลังทหารผ่านยุคแห่งการขยายตัว"

 ra_dynastic_cycle_era_group_leader_desc: "แต่ละ [movement|E] มี [movement_leader|E] ผู้ ซึ่งสามารถยื่นคำร้องเพื่อส่งเสริมอุดมการณ์ของ $game_concept_movement$\n\nเพื่อที่จะเป็น $game_concept_movement_leader$ ท่านต้องมี [movement_power|E] สูงสุดภายใน $game_concept_movement$ ของท่าน"

 ra_dynastic_cycle_era_actions_desc: "ท่านยังสามารถดำเนินการเพื่อส่งอิทธิพลต่อ [dynastic_cycle|e] ได้ ไม่ว่าจะด้วยตัวท่านเอง หรือผ่าน [movement|e] ของท่าน\n\nท่านสามารถค้นหาการดำเนินการเหล่านี้ได้ที่ด้านล่างของหน้าต่าง\n\nหากท่านยังคง $dynastic_cycle_participant_group_undecided_movement|V$ ท่านควรเข้าร่วม $game_concept_movement$ แต่ละขบวนการจะให้ประโยชน์หรือบทลงโทษที่แตกต่างกันแก่ท่าน"

