 ra_merit_governor_advancing_retire: "$reactive_advice_meritocratic_governor$"
 ra_merit_governor_advancing_retire_desc: "ไม่ว่าท่านจะได้รับ [merit|E] มากเพียงใด หากต้องการปลดล็อก [merit_levels|E] ที่สูงขึ้น ท่านต้องสำเร็จ [imperial_examinations|E] ด้วย\n\nทว่า [governors|E] ไม่ได้รับอนุญาตให้ลงทะเบียนใน [imperial_examinations|E]\n\nดังนั้น เมื่อท่านไปถึง [merit_level|E] สูงสุดในปัจจุบันแล้ว การเกษียณอายุและเข้าร่วม $game_concept_examinations$ จึงเป็นหนทางเดียวที่จะก้าวหน้าไปสู่ [province|E] ที่มี [title_tier|E] สูงขึ้นได้\n\n#I ท่านสามารถเกษียณจากการเป็น $game_concept_governor$ ได้โดยใช้ [decision|E] $renounce_governorship_decision|V$ ในแผง '$DECISIONS_VIEW_TITLE$'"
