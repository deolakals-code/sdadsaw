 ra_landless_adventurer_1: "นักผจญภัยไร้ที่ดิน"
 ra_landless_adventurer_2: "ค่ายของท่าน"
 ra_landless_adventurer_3: "ผู้ติดตามของท่าน"
 ra_landless_adventurer_4: "สัญญา"
 ra_landless_adventurer_5: "วัตถุประสงค์ของค่าย"
 ra_landless_adventurer_6: "บนเส้นทางสู่อำนาจ"
 ra_landless_adventurer_1_desc: "@ra_landless_adventurer_2! \nท่านเป็น [adventurer|e]! เดินทางไปทั่วโลก เยี่ยมชม [courts|e] ของ [rulers|e] เพื่อหางาน และทำ [task_contracts|e] ให้สำเร็จเพื่อรับรางวัลที่เป็นประโยชน์ ท่านสามารถปรับปรุง [camp|e] ของท่าน รับสมัคร [followers|e] และสร้าง [contact_list|e] ขนาดใหญ่ได้"
 ra_landless_adventurer_2_desc: "ในฐานะ [adventurer|e] ท่านไม่ได้ผูกติดอยู่กับที่ดินผืนใดผืนหนึ่ง แต่มีอิสระที่จะเดินทางไปทั่วโลก ฐานปฏิบัติการของท่านในฐานะ $game_concept_adventurer$ คือ [camp|e] ของท่าน ซึ่งท่านสามารถอัปเกรดและขยายด้วย [camp_buildings|e] ในระหว่างอาชีพนักผจญภัยของท่าน "
 ra_landless_adventurer_3_desc: "ระหว่างการเดินทาง ท่านสามารถรวบรวม [followers|e] ซึ่งทำหน้าที่คล้ายกับ [courtiers|e] ของ [rulers|e] ที่มีที่ดิน เมื่อ [traveling|e] ในฐานะ [adventurer|e] ท่านจะมีโอกาสใช้ [travel_option|e] [GetTravelOption('adventurers_scout_for_talent_option').GetName]\n\nนอกจากนี้ ท่านอาจได้รับ $game_concept_followers$ ใหม่โดยการใช้ [decision|e] เยี่ยมชมที่ดิน ใน $game_concept_camp$ ของท่าน ท่านสามารถดู $game_concept_followers$ ของท่านผ่านปุ่มที่มุมบนซ้ายของแผงควบคุม"
 ra_landless_adventurer_4_desc: "ในฐานะ [adventurer|e] แหล่งรายได้หลักของท่านคือ [task_contracts|e] ท่านสามารถเห็นพวกมันแสดงเป็นม้วนกระดาษบนแผนที่ $game_concept_task_contracts$ สามารถพบได้ทั่วโลก และต้องการให้ท่านทำงานเฉพาะอย่างให้สำเร็จสำหรับนายจ้าง\n\n[prestige_level|E] ของท่านกำหนด [task_contract_tier|e] ของ $game_concept_task_contracts$ ที่ท่านได้รับ การได้รับระดับชื่อเสียง [GetPrestigeLevelName('(int32)2')] หรือสูงกว่าจะปลดล็อกการซื้อหรือพิชิต [land|E] หากท่านต้องการเปลี่ยนไปเป็น [landed|E] [ruler|E] ระดับที่สูงขึ้นจะปลดล็อกตัวเลือกที่ทรงพลังยิ่งขึ้น\n\nท่านสามารถเข้าถึง $game_concept_task_contracts$ ใหม่ได้โดยการย้าย [camp|e] ของท่าน ซึ่งเป็นการกระทำที่จะต้องเสีย [provisions_i][provisions|e] จำนวนหนึ่งตามระยะทางที่ย้าย"
 ra_landless_adventurer_5_desc: "ท่านสามารถดูรายละเอียดเกี่ยวกับ [camp|e] ของท่านได้ในแท็บ $game_concept_realm$ (ไฮไลต์) จากที่นั่น ท่านสามารถเปลี่ยน [camp_purpose|e] ของท่านและเปิดภาพรวม $game_concept_camp$ ได้\n\nวัตถุประสงค์ของ $game_concept_camp$ ของท่านจะกำหนดประเภทของ [task_contracts|e] ที่ท่านจะสามารถหาได้ อาจปลดล็อก [decisions|e] และ [camp_buildings|e] บางอย่าง รวมถึงประโยชน์อื่น ๆ อีกมากมาย"
 ra_landless_adventurer_6_desc: "@ra_landless_adventurer!\nยอมรับ [task_contracts|e] ย้าย [camp|e] ของท่านเพื่อสำรวจส่วนต่าง ๆ ของโลก และเพิ่ม [following|e] ของท่าน\n\nในฐานะ [adventurer|e] ท่านมีอิสระที่จะเลือกเส้นทางในอนาคตของ [dynasty|e] ของท่าน ท่านจะอยู่บนท้องถนน พยายามได้รับ [title|e] ในดินแดนอันห่างไกล หรือยุ่งเกี่ยวกับกิจการของ [rulers|e] ทั่วโลก?"

