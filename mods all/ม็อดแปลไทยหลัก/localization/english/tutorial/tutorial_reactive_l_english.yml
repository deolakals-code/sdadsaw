 reactive_advice_merit_candidacy: "ผู้สมัครเป็นผู้ว่าการ"



 action_reactive_advice_merit_candidacy: "คำแนะนำ: $reactive_advice_merit_candidacy$"
 action_reactive_advice_merit_candidacy_desc: "เรามาดูกันว่าต้องทำอย่างไรจึงจะเป็น $game_concept_governor$ ได้"
 action_reactive_advice_merit_candidacy_click: "$click_to_open_lesson$"

 ra_merit_candidacy_intro: "$reactive_advice_merit_candidacy$"
 ra_merit_candidacy_intro_desc: "เฉพาะผู้ที่มี [merit_level|E] สูงสุดเท่านั้นที่จะได้เป็น [governors|E]\n\nทุกครั้งที่ $game_concept_governor$ ออกจากตำแหน่ง จะมีคนอื่นได้รับการ แต่งตั้งให้มาแทนที่โดยอัตโนมัติ\n\nดังนั้น เพียงแค่มี $game_concept_merit_level$ ที่ดี ในที่สุดท่านก็จะได้รับการ แต่งตั้งเป็น [governor|E] หาก [law|e] ของ [realm|e] ของท่านอนุญาต"
 ra_merit_candidacy_open: "$reactive_advice_merit_candidacy$"
 ra_merit_candidacy_open_desc: "เรามาดูกันว่าท่านและ [house|E] ของท่านมีความก้าวหน้าในระบบราชการอย่างไรบ้าง!"
 ra_merit_candidacy_open_prompt: "เปิดแผง '$ADMINISTRATIVE_GOVERNMENT_HEADER$' (เน้นสี)"
 ra_merit_candidacy_house_members: "$reactive_advice_merit_candidacy$"
 ra_merit_candidacy_house_members_desc: "รายการนี้แสดงให้เห็นว่าสมาชิก แต่ละคนใน [house|E] ของท่านทำผลงานได้ดีเพียงใดในระบบราชการ\n\nเนื่องจากโดยส่วนตัวแล้วท่านสามารถเป็น [governor|E] ได้เพียง [province|E] เดียว การช่วยเหลือครอบครัวขยายของท่านในอาชีพการงานจึงเป็นสิ่งสำคัญ เช่นกัน"
 ra_merit_candidacy_merit: "$reactive_advice_merit_candidacy$"
 ra_merit_candidacy_merit_desc: "[character|E] แต่ละคนมี [merit_level|E] ยิ่ง $game_concept_merit_level$ ดีเท่าไร พวกเขาก็ยิ่งสามารถปกครอง [provinces|E] ที่มี [title_tier|E] สูงขึ้นในฐานะ [governor|E] ได้\n\nเมื่อ $game_concept_merit_level$ ของท่านเพิ่มขึ้น การ แต่งตั้งที่ทรงอิทธิพลมากขึ้นจะพร้อมใช้งาน:\n$BULLET_WITH_TAB$#V อันดับ 9 ถึง 8#!: $game_concept_governor$ ของ $county_celestial_chinese_vassal$ #weak (บรรดาศักดิ์ [county|E])#!\n$BULLET_WITH_TAB$#V อันดับ 7 ถึง 6#!: $game_concept_governor$ ของ $duchy_celestial_chinese_vassal$ #weak (บรรดาศักดิ์ [duchy|E])#!\n$BULLET_WITH_TAB$#V อันดับ 5 ถึง 4#!: $game_concept_governor$ ของ $kingdom_celestial_chinese_vassal$ #weak (บรรดาศักดิ์ [kingdom|E])#!\n$BULLET_WITH_TAB$#V อันดับ 3 ถึง 1#!: [minister|E] สำหรับ [son_of_heaven|E] #weak (บรรดาศักดิ์ [empire|E])#!\n\n$game_concept_characters$ ที่ไม่มี $game_concept_merit_level$ ไม่สามารถเป็น $game_concept_governor$ ได้"
 ra_merit_candidacy_score: "$reactive_advice_merit_candidacy$"
 ra_merit_candidacy_score_desc: "แม้ว่า [merit_level|E] จะมีความสำคัญ แต่หากผู้สมัครสองคนมี [merit_level|E] เท่ากัน คนที่มี @appointment_score![candidate_score|E] สูงสุดจะได้รับ [province|E] ก่อน\n\nดังนั้น การเพิ่ม $game_concept_candidate_score$ ของท่านหมายความว่าท่านจะไม่ต้องรอนานนักในการเป็น [governor|E]\n\nหากต้องการเพิ่ม $game_concept_candidate_score$ ของสมาชิก [house|E] ท่านต้องใช้ [influence_i][influence|E] โดยใช้ $influence_meritorious_career_interaction|V$ หรือเริ่ม [scheme|E] $promote|V$ #weak (เน้นสีทั้งคู่)#!."
 ra_merit_candidacy_exams: "$reactive_advice_merit_candidacy$"
 ra_merit_candidacy_exams_desc: "[imperial_examination|E] แต่ละครั้งที่สำเร็จจะเพิ่ม [merit|E] และปลดล็อก [merit_levels|E] ที่สูงขึ้น\n\nสมาชิก $game_concept_house$ คนอื่น ๆ จะเข้าร่วมกับท่านหากท่านไป $game_concept_examinations$ และพยายาม ทำให้สำเร็จ\n\nดังนั้น การกลับไป $game_concept_examination$ ที่ท่านสำเร็จแล้วจึงมีประโยชน์มากกว่าแค่ตัวท่านเอง"
 ra_merit_candidacy_child_exams: "$reactive_advice_merit_candidacy$"
 ra_merit_candidacy_child_exams_desc: "หากมีสมาชิก [house|E] ที่ยังเป็น [children|E] ท่านยังสามารถช่วยในอาชีพการงานของพวกเขาได้โดยการส่งพวกเขาไปที่ @child_exam_icon!#V การสอบสำหรับเด็ก#!.\n\nหากพวกเขาทำสำเร็จ มันจะช่วยเร่งความก้าวหน้าของพวกเขาไปสู่ $game_concept_examinations$ ต่อไป"
 ra_merit_candidacy_summary: "$reactive_advice_merit_candidacy$"
 ra_merit_candidacy_summary_desc: "ด้วยการ ทำให้แน่ใจว่าท่านมี [merit_level|E] ที่ดีขึ้นเรื่อย ๆ โดยการเข้าร่วม [imperial_examinations|E] และปกครอง [province|E] ของท่านเป็นอย่างดี ท่านจะก้าวหน้าไปสู่จุดสูงสุดของระบบราชการ\n\nณ จุดสูงสุดของลำดับชั้น ท่านยังสามารถได้รับการ แต่งตั้งเป็น [minister|E] เพื่อรับใช้ [son_of_heaven|E] โดยตรงได้อีกด้วย!"
 
