 ra_army_auto_open_desc: "ท่านสามารถสลับ $ARMY_AUTOMATION_FEATURE_NAME$ ได้ในมุมมองการทหาร"
 ra_army_auto_open_prompt: "เปิดมุมมองการทหาร"
