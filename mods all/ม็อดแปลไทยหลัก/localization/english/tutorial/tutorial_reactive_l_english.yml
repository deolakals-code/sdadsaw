 ra_travel_planning_intro_desc:0 "ท่านกำลังจะ [travel|E] ออกจากตำแหน่งปัจจุบันของท่าน ก่อนออกเดินทาง ท่านควรวางแผนการเดินทางของท่าน"

 ra_travel_planning_entourage:0 "$REACTIVE_ADVICE_TRAVEL_PLANNING$"
 ra_travel_planning_entourage_desc:0 "ท่านไม่ค่อย [travel|E] คนเดียว [characters|E] ที่เดินทางไปกับท่านคือ [entourage|E] ของท่าน\n\nตัวละครเหล่านี้มักจะเข้าร่วมกับท่านที่ปลายทางด้วย"

 ra_travel_planning_speed_safety:0 "$REACTIVE_ADVICE_TRAVEL_PLANNING$"
 ra_travel_planning_speed_safety_desc:0 "มีปัจจัยหลักสองประการที่ต้องพิจารณาเมื่อวางแผน [travel|E] ของท่าน: [travel_speed|E] และ [travel_safety|E]\n\nความเร็วพื้นฐานคือ 100% และความเร็วสูงหมายความว่าท่านจะไปถึงจุดหมายปลายทางได้เร็วขึ้น\n\nความปลอดภัยจะต่อต้าน [travel_danger|E] ใด ๆ ที่ท่านอาจพบเจอระหว่างเส้นทาง การมีความปลอดภัยสูงหมายความว่าท่านและ [entourage|E] ของท่านสามารถเดินทางผ่านพื้นที่อันตรายโดยมีความเสี่ยงน้อยลง"

 ra_travel_planning_caravan_master:0 "$REACTIVE_ADVICE_TRAVEL_PLANNING$"
 ra_travel_planning_caravan_master_desc:0 "ท่านสามารถ แต่งตั้ง [GetCourtPositionType('travel_leader_court_position').GetName()] ซึ่งเป็น [court_position|E] พิเศษที่จะเข้าร่วมกับท่านในการ [travels|E] ทั้งหมดของท่าน\n\nพวกเขามีผลกระทบอย่างมากต่อ [travel_speed|E] และ [travel_safety|E] ของท่าน ดังนั้นท่านมักจะต้องการใครสักคนในตำแหน่งนี้ในการเดินทางที่ยาวนานขึ้น"

 ra_travel_planning_travel_options:0 "$REACTIVE_ADVICE_TRAVEL_PLANNING$"
 ra_travel_planning_travel_options_desc:0 "ท่านยังสามารถเลือก [travel_options|E] ได้สูงสุดสองอย่างสำหรับการเดินทางครั้งนี้โดยเฉพาะ\n\nตัวเลือกการเดินทางมักจะต้องใช้ [gold|E] และให้ประโยชน์ต่าง ๆ ส่วนใหญ่เกี่ยวกับ [travel_speed|E] และ [travel_safety|E]\n\nตัวเลือกมากมายช่วยลด [travel_danger|E] สำหรับ [terrain|E] ประเภทเฉพาะบนเส้นทางของท่าน อันตราย แต่ละประเภทในสถานที่หนึ่ง ๆ จะแสดงบนแผนที่ด้วยสีเฉพาะ อันตรายใด ๆ เหล่านี้ที่ท่านอาจพบเจอจะแสดงเป็นไอคอนบนเส้นทางของท่านด้วย"

 ra_travel_planning_custom_route:0 "$REACTIVE_ADVICE_TRAVEL_PLANNING$"
 ra_travel_planning_custom_route_desc:0 "สุดท้าย ท่านสามารถปรับ แต่งเส้นทางของท่านเพื่อหลีกเลี่ยง [travel_danger|E] ระหว่างทาง แทนที่จะมุ่งตรงไปยังจุดหมายปลายทางของท่าน"

 ra_travel_planning_conclusion:0 "$REACTIVE_ADVICE_TRAVEL_PLANNING$"
 ra_travel_planning_conclusion_desc:0 "ก่อนออกเดินทาง ตรวจสอบเวลาเดินทางทั้งหมด และตรวจสอบว่ามีโอกาสเกิด [travel_danger|E] น้อยบนเส้นทางของท่าน\n\nเดินทางโดยสวัสดิภาพ!"

# Create Accolade
 REACTIVE_ADVICE_CREATE_ACCOLADE:0 "เครื่องราชอิสริยาภรณ์"

 reactive_advice_create_accolade:0 "$REACTIVE_ADVICE_CREATE_ACCOLADE$"

 ra_create_accolade_knights_panel:0 "$REACTIVE_ADVICE_CREATE_ACCOLADE$"
 ra_create_accolade_knights_panel_desc:0 "ตอนนี้ท่านสามารถมอบ [accolade|E] ให้กับ [knights|E] ของท่านคนใดคนหนึ่งได้แล้ว!\n\nอัศวิน แต่ละคนที่ถือเครื่องราชอิสริยาภรณ์จะกลายเป็น [acclaimed_knight|E] และมอบโบนัสให้กับท่านและ [armies|E] ของท่าน\n\nเครื่องราชอิสริยาภรณ์จะยังคงอยู่จนกว่าท่านจะทำลายมัน และจะส่งต่อไปยังอัศวินในอนาคตผ่านทาง [accolade_succession|E]"
 ra_create_accolade_knights_panel_prompt:0 "เลือกเครื่องราชอิสริยาภรณ์ที่ยังไม่ได้มอบหมาย (ไฮไลต์)"

 ra_create_accolade_candidates:0 "$REACTIVE_ADVICE_CREATE_ACCOLADE$"
 ra_create_accolade_candidates_desc:0 "เมื่อท่านสร้าง [accolade|E] ท่านเลือก [knights|E] ที่มีคุณสมบัติเหมาะสมคนใดคนหนึ่งในรายการ"
 ra_create_accolade_candidates_prompt:0 "เลือกผู้สมัครในรายการ (ไฮไลต์)"

 ra_create_accolade_attributes:0 "$REACTIVE_ADVICE_CREATE_ACCOLADE$"
 ra_create_accolade_attributes_desc:0 "[acclaimed_knight|E] ทุกคนมี [accolade_types|E] สองประเภท (ไฮไลต์) หนึ่งประเภทหลักและหนึ่งประเภทรอง ก่อนที่ท่านจะสร้าง [accolade|E] คุณลักษณะเหล่านี้จะแสดงสำหรับผู้สมัคร แต่ละคน\n\nคุณลักษณะ แต่ละอย่างจะมอบโบนัสต่าง ๆ ให้กับท่านและ [armies|E] ของท่าน เมื่อเครื่องราชอิสริยาภรณ์ได้รับ [glory|E] ความรุ่งโรจน์จะได้รับจากการเข้าร่วม [GetActivityType( 'activity_tournament' ).GetName()] [contests|E] และ [battles|E]\n\nคุณลักษณะหลักเป็นส่วนหนึ่งของ [accolade|E] เสมอ และไม่สามารถเปลี่ยนแปลงได้เมื่อมีการ [accolade_succession|E]"
  
 ra_create_accolade_conclusion:0 "$REACTIVE_ADVICE_CREATE_ACCOLADE$"
 ra_create_accolade_conclusion_desc:0 "ตอนนี้ท่านสามารถสร้าง [accolade|E] นี้ได้หากต้องการ\n\nเครื่องราชอิสริยาภรณ์เพิ่มเติมจะพร้อมใช้งานเมื่อ [culture|E] ของท่านค้นพบ [innovations|E]"

# House Unity
 reactive_advice_house_unity: "ความสามัคคีในตระกูล"

 action_reactive_advice_house_unity: "คำแนะนำ: $reactive_advice_house_unity$"
 action_reactive_advice_house_unity_desc: "เรียนรู้เกี่ยวกับ [house_unity|E] สำหรับ [clans|E] และวิธีที่ท่านสามารถส่งผลกระทบต่อมันเพื่อรับผลประโยชน์และเข้าถึง [succession_laws|E] ที่แตกต่างกัน"
 action_reactive_advice_house_unity_click: "$click_to_open_lesson$"

 ra_house_unity_1: "$reactive_advice_house_unity$"
 ra_house_unity_1_desc: "ในฐานะ [clan|E] ท่านสามารถเข้าถึง [house_unity|E] ได้!\n\nความสามัคคีของตระกูลแสดงถึงสถานะของความสัมพันธ์ภายใน [house|E] ของท่าน ซึ่งมีตั้งแต่เป็นปฏิปักษ์ไปจนถึงปรองดอง แต่ละ [house_unity_level|E] จะนำมา ซึ่งผลกระทบมากมายสำหรับสมาชิกตระกูลทุกคน และจะกำหนด [succession_law|E] ที่ใช้งานอยู่\n\nการรู้วิธีส่งผลกระทบต่อความสามัคคีของตระกูลจะเป็นประโยชน์ในการบรรลุเป้าหมายของท่าน"

 ra_house_unity_2: "$reactive_advice_house_unity$"
 ra_house_unity_2_desc: "ขั้นแรก ท่านต้องรู้วิธีแสดงภาพ [house_unity|E] ในการทำ เช่นนั้น ให้เปิดมุมมอง [house|E] ของท่าน"

 ra_house_unity_panel_prompt: "เปิดมุมมอง [house|E]"

 ra_house_unity_3: "$reactive_advice_house_unity$"
 ra_house_unity_3_desc: "แท็บความสามัคคีของตระกูลมีข้อมูลและปฏิสัมพันธ์ทั้งหมดที่ท่านต้องการเพื่อใช้ประโยชน์สูงสุดจากความสามัคคีของตระกูล ท่านสามารถดูคะแนนความสามัคคีของตระกูลปัจจุบัน ระดับปัจจุบัน และภาพรวมของระดับความสามัคคีของตระกูลที่สูงขึ้นและต่ำลงได้\n\nนอกจากนี้ ที่นี่ท่านสามารถดูการเปลี่ยนแปลงความสามัคคีล่าสุดได้ นี่เป็นสิ่งสำคัญ เพราะสมาชิกตระกูลทุกคนสามารถดำเนินการ [house_unity_unifying_actions|E] หรือ [house_unity_devisive_actions|E] เพื่อส่งผลกระทบต่อความสามัคคีของตระกูลได้"

 ra_house_unity_4: "$reactive_advice_house_unity$"
 ra_house_unity_4_desc: "ดังที่ได้กล่าวไว้ก่อนหน้านี้ แต่ละ [house_unity_level|E] มีผลกระทบของตัวเอง ในส่วนนี้ ท่านสามารถดูรายการผลกระทบที่ใช้งานอยู่ได้\n\nโปรดจำไว้ว่า ผลกระทบเหล่านี้มีผลต่อสมาชิก [house|E] ทุกคน ในบรรดาผลกระทบ ท่านจะพบ [succession_law|E] ที่ใช้งานอยู่ของตระกูลท่าน"

 ra_house_unity_5: "$reactive_advice_house_unity$"
 ra_house_unity_5_desc: "สุดท้าย แต่ละตระกูลแคลนสามารถเข้าถึงการตัดสินใจเกี่ยวกับความสามัคคีของตระกูลได้ [decisions|E] เหล่านี้จะมอบผลประโยชน์ที่แตกต่างกันให้กับสมาชิกตระกูลทุกคน อย่างไรก็ตาม ส่วนใหญ่แล้ว มีเพียง [house_head|E] เท่านั้นที่สามารถประกาศใช้ได้\n\n#weak ท่านสามารถพยายามเป็นหัวหน้าตระกูลได้โดยใช้ปฏิสัมพันธ์ \"ท้าทายหัวหน้าตระกูล\" กับหัวหน้าตระกูลปัจจุบันของท่าน#!"

 ra_house_unity_6: "$reactive_advice_house_unity$"
 ra_house_unity_6_desc: "ตอนนี้ท่านรู้ทุกสิ่งที่ต้องรู้เกี่ยวกับความสามัคคีของตระกูลแล้ว!\n\nใช้ความรู้นี้ เพื่อให้แน่ใจว่าตระกูลของท่านจะทิ้งร่องรอยที่ยั่งยืนไว้ในประวัติศาสตร์"

# Tax Collection
 action_reactive_advice_tax_collector: "คำแนะนำ: การเก็บภาษี"
 action_reactive_advice_tax_collector_desc: "เปิดเพื่อแนะนำ [tax_jurisdictions|E] และ [tax_collectors|E]"
 action_reactive_advice_tax_collector_click: "$click_to_open_lesson$"

 reactive_advice_tax_collector: "การเก็บภาษี"

 ra_tax_collector_1: "$reactive_advice_tax_collector$"
 ra_tax_collector_1_desc: "ท่านมี [tax_collectors|E]!\n\nพวกเขาจะช่วยท่านรวบรวม [gold|E] และ [levies|E] จากข้าหลวงแคลนของท่าน ผู้เก็บภาษีจะช่วยท่านจัดการ [tax_jurisdictions|E] และพวกเขาจะบังคับใช้พระราชกฤษฎีกาภาษี\n\n#weak ความถนัดของผู้เก็บภาษีของท่านจะส่งผลต่อการสนับสนุนที่ท่านจะได้รับจากผู้เสียภาษีของท่าน#!"

 ra_tax_collector_2: "$reactive_advice_tax_collector$"
 ra_tax_collector_2_desc: "ขั้นแรก ท่านต้องรู้ว่าจะหา [tax_jurisdictions|E] ของท่านได้ที่ไหน วิธี แต่งตั้ง [tax_collectors|E] และมอบหมายผู้เสียภาษี"

 ra_tax_collector_panel_prompt: "เปิดแผง [tax_jurisdictions|E]"

 ra_tax_collector_3: "$reactive_advice_tax_collector$"
 ra_tax_collector_3_desc: "ยินดีต้อนรับสู่มุมมอง [tax_jurisdiction|E] ของท่าน!\n\nที่นี่ท่านสามารถแสดงภาพและจัดการทุกอย่างเกี่ยวกับเขตอำนาจศาลของท่านได้\n\nที่ด้านบน ท่านสามารถดูจำนวน [tax_collectors|E] ที่ท่านได้ แต่งตั้ง และ [gold|E] และ [levies|E] ทั้งหมดที่ท่านได้รับจากผู้เสียภาษีของท่าน"

 ra_tax_collector_4: "$reactive_advice_tax_collector$"
 ra_tax_collector_4_desc: "นี่คือ [tax_jurisdictions|E] ของท่าน ซึ่งท่านสามารถมอบหมายข้าหลวงแคลนของท่านเป็นผู้เสียภาษี และเลือกพระราชกฤษฎีกาภาษีสำหรับ แต่ละเขตอำนาจศาลได้ ท่านจะต้อง แต่งตั้ง [tax_collector|E] เพื่อจัดการเขตอำนาจศาลภาษี แต่ละแห่งของท่านและบังคับใช้พระราชกฤษฎีกาภาษีด้วย\n\n#weak เขตอำนาจศาลที่มีผู้เสียภาษีแต่ไม่มีผู้เก็บภาษีจะไม่ถูกเก็บภาษี หมายความว่าท่านจะไม่ได้รับ [gold|E] หรือ [levies|E] จากเขตอำนาจศาลนั้น#!"

 ra_tax_collector_5: "$reactive_advice_tax_collector$"
 ra_tax_collector_5_desc: "ขอแสดงความยินดี!\n\nท่านรู้พื้นฐานทั้งหมดของการเก็บภาษีแล้ว อย่าลืมตั้งค่าพระราชกฤษฎีกาภาษีของ [tax_jurisdictions|E] เพื่อปรับ แต่ง [vassal_obligations|E] ให้เข้ากับความต้องการปัจจุบันของท่าน\n\nขอให้ [clan|E] ของท่านทิ้งร่องรอยที่ยั่งยืนไว้ในประวัติศาสตร์"

 action_reactive_advice_legitimacy: "คำแนะนำ: ความชอบธรรม"
 action_reactive_advice_legitimacy_desc: "เปิดเพื่อแนะนำ [legitimacy|E]"
 action_reactive_advice_legitimacy_click: "$click_to_open_lesson$"

 reactive_advice_legitimacy: "ความชอบธรรม"

 ra_legitimacy_1: "$reactive_advice_legitimacy$"
 ra_legitimacy_1_desc: "[legitimacy|E] คือการแสดงถึง 'สิทธิ์ในการปกครอง' ของท่าน [vassals|E] ของท่านสร้าง [legitimacy_expectations|E] และท่านถูกคาดหวังให้ตอบสนองความคาดหวังเหล่านั้น\n\n$game_concept_legitimacy$ ที่สูงขึ้นจะให้ประโยชน์มากมายแก่ท่าน และ $game_concept_legitimacy$ ที่ต่ำจะส่งผลเสียต่อความง่ายในการปกครองของท่าน\n\n#weak $game_concept_legitimacy$ มี 5 [legitimacy_levels|E] และระดับล่างสุด 'ไม่ชอบธรรม' หนึ่งระดับ โดยส่วนหนึ่งของ [legitimacy|E] ของผู้ปกครองคนก่อนจะถูกสืบทอดโดย [heir|E] ของพวกเขา ท่านได้รับ $game_concept_legitimacy$ ผ่านหลายวิธี รวมถึงการชนะสงคราม การสร้าง [legends|E] หรือการเข้าร่วม [activities|E] ในทำนองเดียวกัน มันสามารถสูญเสียได้จากการแพ้สงครามและบรรดาศักดิ์ หรือ [epidemics|E] ที่ไม่ถูกตรวจสอบซึ่งทำลายล้างแผ่นดิน#!"

 ra_legitimacy_2: "$reactive_advice_legitimacy$"
 ra_legitimacy_2_desc: "มุมมอง [legitimacy|E] สามารถพบได้ที่ด้านล่างซ้าย ประกอบด้วยข้อมูลเกี่ยวกับ [legitimacy_level|E] ของท่าน [legitimacy_expectations|E] ของท่าน จำนวน [legitimacy|E] ที่ท่านมีในปัจจุบัน และผลกระทบปัจจุบันของทั้งหมดข้างต้น\n\n#weak ข้อเสียและประโยชน์ของการมีคะแนน [legitimacy|E] ที่แน่นอนรวมถึงบทลงโทษและผลประโยชน์ด้านความเห็น โทษและโบนัส [dynasty_prestige|E] ต้นทุน [casus_belli|E] ที่เพิ่มขึ้นและลดลง และเกณฑ์ที่แตกต่างกันสำหรับ [alliances|E] และการเข้าร่วม [faction|E]#!"

 action_reactive_advice_epidemics: "คำแนะนำ: โรคระบาด"
 action_reactive_advice_epidemics_desc: "เปิดเพื่อแนะนำ [epidemics|E]"
 action_reactive_advice_epidemics_click: "$click_to_open_lesson$"

 reactive_advice_epidemics: "โรคระบาด"
 ra_epidemics_panel_prompt: "เปิดแผง [epidemics|E]"
 ra_specific_epidemics_panel_prompt: "เปิดแผง 'ดูโรคระบาด'"

 ra_epidemics_1: "$reactive_advice_epidemics$"
 ra_epidemics_1_desc: "[epidemics|E] คือการระบาดของโรคที่แพร่กระจายไปทั่วแผนที่ ส่งผลกระทบต่อทั้ง [characters|E] และ [holdings|E] เมื่อมีโรคระบาดอยู่ในพื้นที่ [baronies|E] ที่ได้รับผลกระทบจะมี [infection_rate|E] ที่ควบคุมความรุนแรงของผลกระทบ\n\nมุมมอง [epidemics|E] สามารถพบได้ที่ด้านล่างขวา"

 ra_epidemics_2: "$reactive_advice_epidemics$"
 ra_epidemics_2_desc: "[epidemic|E] แต่ละรายการบนแผนที่ถูกแบ่งออกเป็นส่วน ๆ ในแผง $reactive_advice_epidemics$\n\n$reactive_advice_epidemics$ ในอาณาจักรจะถ่ายทอดข้อมูลเกี่ยวกับ $reactive_advice_epidemics$ ภายในอาณาจักรของท่าน $reactive_advice_epidemics$ โลกจะแจ้งให้ท่านทราบเกี่ยวกับ $reactive_advice_epidemics$ ในส่วนที่เหลือของโลก และ $reactive_advice_epidemics$ ใกล้เคียงจะติดตามความคืบหน้าของ $reactive_advice_epidemics$ ที่ยังไม่ได้อยู่ในอาณาจักรของท่าน แต่อยู่ใกล้พอที่จะเป็นภัยคุกคามในอนาคตได้"

 ra_epidemics_3: "$reactive_advice_epidemics$"
 ra_epidemics_3_desc: "ภายในแผงนี้ ข้อมูลที่เกี่ยวข้องจะถูกเก็บไว้สำหรับโรคระบาด แต่ละชนิด มันติดตามว่าโรคระบาดมีความรุนแรงระดับใด ไม่รุนแรง รุนแรง หรือหายนะ เริ่มต้นเมื่อใดและที่ไหน มี [characters|E] เสียชีวิตไปกี่คน และทั้ง [modifiers|E] ของตัวละครและสถานที่ สำหรับ [baronies|E] และ [counties|E]\n\nปุ่ม 'ดูโรคระบาด' จะนำท่านไปสู่รายละเอียดเพิ่มเติม"

 ra_epidemics_4: "$reactive_advice_epidemics$"
 ra_epidemics_4_desc: "แผงนี้ รวมถึงข้อมูลเกี่ยวกับ [infection_rate|E] ของ แต่ละ [barony|E] ที่ได้รับผลกระทบจากโรคระบาด [infection_rate|E] จะคืบหน้าไปสู่ค่าสูงสุดในอัตราที่แตกต่างกันขึ้นอยู่กับความรุนแรงของโรคระบาด และสามารถบรรเทาได้ด้วย $game_concept_epidemic_resistance$\n\n#weak วิธีที่ท่านจัดการและรับมือกับ $reactive_advice_epidemics$ จะไม่เพียงแต่ควบคุมว่า [realm|E] ของท่านจะฟื้นตัวและเจริญรุ่งเรืองในภายหลังได้อย่างไร แต่ยังรวมถึงจำนวน [legitimacy|E] ที่ท่านจะสูญเสียในฐานะผู้ปกครองด้วย#!"

 action_reactive_advice_legends: "คำแนะนำ: ตำนาน"
 action_reactive_advice_legends_desc: "เปิดเพื่อแนะนำ [legends|E]"
 action_reactive_advice_legends_click: "$click_to_open_lesson$"

 reactive_advice_legends: "ตำนาน"
 ra_legends_panel_prompt: "เปิดแผง [legends|E]"
 ra_legends_view_panel_prompt: "เปิดแผงสร้างตำนาน"

 ra_legends_1: "$action_reactive_advice_legends$"
 ra_legends_1_desc: "[legends|E] คือเรื่องราวของการกระทำอันมีชื่อเสียงที่ [character|E] ได้ทำในช่วงชีวิตของพวกเขา แต่ละตำนานมี [legend_type|E] ของตัวเอง: การสร้างความชอบธรรม วีรกรรม หรือศักดิ์สิทธิ์\n\nมุมมอง [legends|E] สามารถพบได้ที่ด้านล่างซ้าย"

 ra_legends_2: "$action_reactive_advice_legends$"
 ra_legends_2_desc: "[legend|E] แต่ละรายการที่ท่านสามารถใช้ได้จะปรากฏที่นี่ พร้อมทั้งข้อมูลทั้งหมด\n\nด้านบนคือ [legend_seeds|E] ซึ่งเป็นพื้นฐานของตำนาน พวกมันสามารถได้รับหรือในบางกรณีอาจมีอยู่แล้ว เนื่องจากตัวละครของท่านมีคุณสมบัติตรงตามเกณฑ์บางอย่าง ด้านล่างคือ $action_reactive_advice_legends$ โลก ซึ่งติดตาม $action_reactive_advice_legends$ อื่น ๆ ในโลกที่ท่านไม่ได้ส่งเสริมอย่างแข็งขัน\n\n#weak 'ผู้ส่งเสริม' คือตัวละครที่สนับสนุนตำนานที่กำหนดอย่างแข็งขัน#!"

 ra_legends_3: "$action_reactive_advice_legends$"
 ra_legends_3_desc: "ข้อมูลที่รวมอยู่ในแผง $action_reactive_advice_legends$ รวมถึงต้นทุนพื้นฐาน การบำรุงรักษา ผลกระทบที่ใช้งานอยู่ และคุณภาพตำนาน\n\nไฮไลต์คือปุ่มที่ใช้เลือกตำนานจากรายการของท่าน"

 ra_legends_4: "$action_reactive_advice_legends$"
 ra_legends_4_desc: "แผงนี้ รวมถึงข้อมูลเกี่ยวกับตำนานที่ท่านกำลังจะสร้าง รวมถึงให้ท่านเลือก [characters|E] ตัวละครเหล่านี้คือตัวเลือกที่เป็นไปได้สำหรับ [legend_protagonists|E]\n\n#weak การเริ่มตำนานจะกระตุ้นพงศาวดารตำนาน ซึ่งท่านสามารถเพิ่ม [legend_quality|E] หรือทำให้ตำนานสมบูรณ์ได้#!"

 # Plague Resistance
 action_reactive_advice_plague_resistance: "คำแนะนำ: การต้านทานโรคระบาด"
 action_reactive_advice_plague_resistance_desc: "เปิดเพื่อแนะนำ [epidemic_resistance|E]"
 action_reactive_advice_plague_resistance_click: "$click_to_open_lesson$"

 reactive_advice_plague_resistance: "การต้านทานโรคระบาด"

 ra_plague_resistance_1: "$reactive_advice_plague_resistance$"
 ra_plague_resistance_1_desc: "เมื่อต้องรับมือกับโรคระบาด ท่านมีทางเลือกไม่กี่อย่างในการจำกัดการแพร่กระจายของโรคระบาดในดินแดนของท่าน\n\nปัจจัยควบคุมหลักสำหรับสิ่งนี้คือ [epidemic_resistance|E] ยิ่งการต้านทานโรคระบาดของ [baronies|E] และ [counties|E] ของท่านสูงเท่าใด ท่านก็จะสามารถยับยั้งโรคระบาดได้ดีขึ้นเท่านั้น\n\n#weak แม้ว่าท่านจะสามารถต่อสู้กับโรคระบาดได้ สิ่งสำคัญคือต้องจำไว้ว่าท่านไม่น่าจะหยุดยั้งพวกมันได้อย่างสมบูรณ์ เตรียมพร้อมสำหรับโรคระบาดขนาดใหญ่ที่จะแพร่กระจายแม้ว่าท่านจะพยายามอย่างเต็มที่แล้วก็ตาม#!"

 ra_plague_resistance_2: "$reactive_advice_plague_resistance$"
 ra_plague_resistance_2_desc: "$reactive_advice_plague_resistance$ สามารถเพิ่มได้หลายวิธี อาคาร เช่น $building_type_hospices_01$ และ $building_type_charnel_grounds_01$ ให้โบนัสโดยธรรมชาติแก่ $reactive_advice_plague_resistance$ สำหรับ [county|E] หรือ [barony|E] ที่สร้างขึ้น\n\n ตัวเลือกอื่น ๆ ที่ไม่ถาวร ได้แก่ [court_position_tasks|E] ที่ดำเนินการโดย $court_physician_court_position$, [decisions|E] หรือเหตุการณ์ต่าง ๆ"

 ra_plague_resistance_3: "$reactive_advice_plague_resistance$"
 ra_plague_resistance_3_desc: "เมื่อ $reactive_advice_plague_resistance$ เพิ่มขึ้น [infection_rate|E] ของ [baronies|E] ที่เกี่ยวข้องจะลดลง\n\nแม้ว่าท่านไม่น่าจะสามารถกำจัดโรคระบาดขนาดใหญ่ได้อย่างสมบูรณ์เพียงแค่ใช้มาตรการ เช่นนี้ การลด [infection_rate|E] จะช่วยลดความเสียหายทั่วไปต่อ [realm|E] ของท่าน"

 action_reactive_advice_tutorial_schemes: "คำแนะนำ: $game_concept_schemes$"
 action_reactive_advice_tutorial_schemes_desc: "เปิดเพื่อแนะนำ [schemes|e]"
 action_reactive_advice_tutorial_schemes_click: "$click_to_open_lesson$"
 reactive_advice_tutorial_schemes: "$ra_tutorial_schemes_1$"

 ra_tutorial_schemes_1: "$game_concept_schemes$"
 ra_tutorial_schemes_1_desc: "ท่านเพิ่งเริ่ม [scheme|E]! $game_concept_schemes$ คือเป้าหมายระยะยาวที่มุ่งเป้าไปที่ตัวละครอื่น พวกมันสามารถมีเป้าหมายที่เป็นศัตรูได้ เช่น พยายาม [GetScheme('murder').GetTypeName] หรือ [GetScheme('abduct').GetTypeName] เป้าหมายของท่าน หรืออาจเป็นเรื่องที่ดีต่อสุขภาพมากกว่า เช่น [GetScheme('befriend').GetTypeName] $game_concept_scheme$"

 ra_tutorial_schemes_2: "$game_concept_schemes$"
 ra_tutorial_schemes_2_desc: "ท่านเพิ่งเริ่ม [scheme|E]! $game_concept_schemes$ คือเป้าหมายระยะยาวที่มุ่งเป้าไปที่ตัวละครอื่น พวกมันสามารถมีเป้าหมายที่เป็นศัตรูได้ เช่น พยายาม [GetScheme('murder').GetTypeName] หรือ [GetScheme('abduct').GetTypeName] เป้าหมายของท่าน หรืออาจเป็นเรื่องที่ดีต่อสุขภาพมากกว่า เช่น [GetScheme('befriend').GetTypeName] $game_concept_scheme$"

 ra_tutorial_schemes_3: "$game_concept_schemes$"
 ra_tutorial_schemes_3_desc: "นี่คือที่ที่ท่านจะเห็นแผนการที่ใช้งานอยู่ทั้งหมดของท่าน ท่านสามารถมี [personal_scheme|e] หนึ่งแผนและ [hostile_scheme|e] หนึ่งแผนที่ใช้งานพร้อมกันได้\n\n#TUT ใช้แผนการเมื่อใดก็ตามที่ท่านต้องการ แต่โปรดจำไว้ว่าตัวละครของท่านจะเก่งหรือด้อยกว่าในแผนการบางอย่างขึ้นอยู่กับ [traits|e] และ [skills|e] ของพวกเขา [perks|e] บางอย่างของ [lifestyle|e] สามารถปลดล็อก $game_concept_schemes$ เพิ่มเติมสำหรับตัวละครของท่านได้#!"

 # Favorite Child
 action_reactive_advice_favorite_child: "คำแนะนำ: บุตรคนโปรด"
 action_reactive_advice_favorite_child_desc: "ตอนนี้ท่านสามารถเลือก [favorite_child|E] ได้แล้ว เปิดข้อความนี้เพื่อเรียนรู้เพิ่มเติมเกี่ยวกับเรื่องนี้และวิธีเลือกพวกเขา"
 action_reactive_advice_favorite_child_click: "$click_to_open_lesson$"

 reactive_advice_favorite_child: "บุตรคนโปรด"

 ra_favorite_child_1: "$reactive_advice_favorite_child$"
 ra_favorite_child_1_desc: "ตอนนี้ท่านสามารถเลือกได้ว่าใครคือ [favorite_child|E] ของท่าน ซึ่งหมายความว่าพวกเขาจะมีความ [opinion|E] ต่อท่านสูงขึ้น และเมื่อท่านสิ้นชีพ ท่านสามารถเลือกที่จะสืบทอดมรดกของท่านในฐานะพวกเขาแทนทายาทของท่านได้\n\nบุตรคนโปรดของท่านสามารถเป็น:\n$BULLET_WITH_TAB$บุตร\n$BULLET_WITH_TAB$หลาน\n$BULLET_WITH_TAB$เหลน\nตราบใดที่พวกเขาอยู่ใน [dynasty|E] ของท่าน"
 ra_favorite_child_1_prompt: "เปิดมุมมองตัวละครของท่าน (ไฮไลต์)"

 ra_favorite_child_2: "$reactive_advice_favorite_child$"
 ra_favorite_child_2_desc: "ในมุมมองตัวละคร ค้นหาบุตรที่ท่านต้องการกำหนดให้เป็นบุตรคนโปรด\n\nคลิกขวาที่บุตรเพื่อโต้ตอบ และมองหาตัวเลือก เลือกบุตรคนโปรด หรือคลิกที่บุตรจากบุตรของท่าน\n\nโปรดจำไว้ว่าการเลือก $game_concept_favorite_child$ ยังหมายความว่าบุตรคนอื่น ๆ อาจมีความเห็นต่อท่านต่ำลง"
 ra_favorite_child_2_prompt: "คลิกขวาที่บุตรคนใดคนหนึ่งของท่านเพื่อดูปฏิสัมพันธ์ที่มีอยู่ (ไฮไลต์)"

 ra_favorite_child_3: "$reactive_advice_favorite_child$"
 ra_favorite_child_3_desc: "หลังจากเลือกบุตรคนโปรดแล้ว จะมีไอคอนบนรูปภาพของพวกเขา และ แม้ว่าพวกเขาจะไม่ใช่ทายาทของท่าน ก็เป็นไปได้ที่จะเล่นต่อในฐานะพวกเขาหลังจากท่านสิ้นชีพ\n\nหากท่านต้องการเปลี่ยนบุตรคนโปรดเมื่อใดก็ตาม ให้กลับไปที่มุมมองตัวละครและเลือกคนอื่น"


 # Army Automation
 action_reactive_advice_army_automation: "คำแนะนำ: $ARMY_AUTOMATION_FEATURE_NAME$"
 action_reactive_advice_army_automation_desc: "หากท่านไม่ต้องการควบคุมทุก [war|E] ด้วยตนเอง ท่านสามารถเปิด $ARMY_AUTOMATION_FEATURE_NAME$ ได้ เปิดข้อความนี้เพื่อเรียนรู้วิธีการทำ"
 action_reactive_advice_army_automation_click: "$click_to_open_lesson$"

