 ra_gp_3_desc: "[great_projects|e] มีที่ตั้ง และค่าใช้จ่ายที่ต้องชำระก่อนจึงจะเริ่มได้\n\nเมื่อเริ่มแล้ว ผู้ก่อตั้งและ [subjects|e] ของพวกเขาจะสามารถมอบ [great_project_contributions|e] เพื่อช่วยให้สำเร็จได้ ซึ่งหมายความว่าโดยปกติผู้ก่อตั้งจะไม่ต้องจ่ายค่า $game_concept_great_project_contributions$ ทั้งหมดด้วยตนเอง\n\nโดยทั่วไป $game_concept_great_projects$ ต้องใช้เวลาและความพยายามอย่างมากในการ ทำให้สำเร็จ"

