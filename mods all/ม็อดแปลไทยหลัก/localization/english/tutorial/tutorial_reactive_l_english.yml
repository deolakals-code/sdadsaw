 ra_tributaries_1: "$reactive_advice_tributaries$"
 ra_tributaries_1_desc: "[tributaries|E]เป็นประเภทหนึ่งของ[subject|E] ซึ่งเป็นความสัมพันธ์ระหว่าง[rulers|e]สองฝ่ายที่มีการตกลงทำ[truce|E]เพื่อแลกกับการจ่ายเงินเป็นระยะ เมื่อข้อตกลงมีผลบังคับใช้ เมืองขึ้นจะมอบ[herd|E], [taxes|E]หรือ[prestige|E]ให้กับอีกฝ่าย ซึ่งก็คือ[suzerain|E]ของตน"
