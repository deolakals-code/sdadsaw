 ra_treasury_1_desc: "ใน [realm|E] นี้ [top_liege|E] และ [governor|E] ทุกคนมี [treasury_i] [treasury|E]\n\nในขณะที่ [gold|E] คือความมั่งคั่งส่วนตัวของท่าน $game_concept_treasury$ มีไว้เพื่อใช้ในกิจการของรัฐบาลเท่านั้น ( เช่น การปรับปรุง [province|E] ของท่านหากท่านเป็น $game_concept_governor$)\n\n$game_concept_treasury$ จะผูกติดอยู่กับ [title|E] ปัจจุบันของท่าน ดังนั้นหากตำแหน่งของท่านภายใน [realm|E] เปลี่ยนไป ท่านจะไม่สามารถเข้าถึง $game_concept_treasury$ เดิมของท่านได้อีกต่อไป"
 ra_treasury_2: "$ra_treasury_1$"
 ra_treasury_2_desc: "ท่านมีอิสระที่จะบริจาค [gold|E] ส่วนตัวของท่านเพื่อเสริม [treasury|E] ในกรณีที่เงินเหลือน้อย\n\nพึงระวังว่าไม่มีหนทางถูกกฎหมายใดที่จะได้ $game_concept_gold$ ที่ท่านบริจาคไปแล้วกลับคืนมา!\n\n#I หากท่านประสงค์จะทำเช่นนี้ ท่านสามารถใช้ปุ่มที่เน้นสีได้#!"
 ra_treasury_3: "$ra_treasury_1$"
 ra_treasury_3_desc: "หาก [gold|E] ของท่านกำลังเหลือน้อย ท่านสามารถใช้ [scheme|E] $celestial_siphon_treasury_interaction_without_scheme_suffix|V$ กับตนเองหรือ [governor|E] ใด ๆ ใน [realm|E] ได้ สิ่งนี้จะแปลง [treasury|E] ของ [character_possessive|E] เป้าหมายให้เป็น $game_concept_gold$ ของท่านเอง\n\nอย่างไรก็ตาม ท่านคงไม่อยากถูกจับได้ว่ายักยอกจากรัฐ..."

