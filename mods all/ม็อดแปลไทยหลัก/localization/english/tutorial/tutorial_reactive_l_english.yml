 ra_tributaries_2: "$reactive_advice_tributaries$"
 ra_tributaries_2_desc: "เมื่อเปรียบเทียบกับ[subject|E]ประเภทปกติคือ[vassals|E]แล้ว [tributaries|E]มีอิสระจาก[suzerain|E]ของตนมากกว่าเล็กน้อย พวกเขาสามารถปลดแอกตนเองได้หากข้อกำหนดของผู้นำของตนไม่เป็นไปตามที่คาดหวัง และไปแสวงหาโชคที่อื่นได้"
 ra_tributaries_2_prompt: "คลิกที่แท็บผู้อยู่ใต้ปกครองเพื่อดำเนินการต่อ (ที่เน้นสี)"

 ra_tributaries_3: "$reactive_advice_tributaries$"
 ra_tributaries_3_desc: "[subjects|E]ทุกประเภทจะแสดงอยู่ในแผงอาณาจักร ในรายการผู้อยู่ใต้ปกครอง ท่านจะเห็นโอกาสที่[tributaries|E]ของท่านต้องการที่จะปลดแอก และ[tributary_contract|E]พิเศษที่ท่านในฐานะ[suzerain|E]สามารถเพิ่มหรือลดการจ่ายเงินของพวกเขา หรือการสนับสนุนทางทหารที่ฝ่ายใดฝ่ายหนึ่งจะมีในการทะเลาะวิวาทที่จะเกิดขึ้น"

 ra_tributaries_4: "$reactive_advice_tributaries$"
 ra_tributaries_4_desc: "เนื่องจากการ[migration|E]เป็นการกระทำทั่วไปสำหรับ[nomads|E] การย้ายออกจากดินแดนของ[tributaries|E]ของท่านจึงส่งผลกระทบอย่างใหญ่หลวงต่อความเต็มใจของพวกเขาที่จะยังคงเป็นผู้ส่งส่วยให้ท่าน หากพวกเขาไม่สามารถประจักษ์ในความยิ่งใหญ่ของท่านได้ ในไม่ช้าพวกเขาก็จะมองหาการคุ้มครองและสัญญาสงบศึกกับ[rulers|e]อื่นที่อยู่ใกล้กว่า"

 ra_tributaries_5: "$reactive_advice_tributaries$"
 ra_tributaries_5_desc: "หากท่านเองมีบทบาทเป็น[tributary|E] ก็อาจช่วยให้ท่านสามารถขยาย[herd|E]ของท่านได้อย่างสงบสุขภายใต้การคุ้มครองของ[suzerain|E]ที่ใหญ่กว่า แต่ใน[the_great_steppe|E]อำนาจสามารถเปลี่ยนมือได้อย่างรวดเร็ว จงแน่ใจว่าท่านและผู้คนที่ท่านถือว่าเป็นสหายช่วยเหลือ ซึ่งกันและกันในยามต้องการเพื่อเติบโต แต่อย่ากลัวที่จะปลดแอกและเข้าร่วมกับฝ่ายของข่านผู้ยิ่งใหญ่กว่าเมื่อสถานการณ์บังคับ"

