 ra_admin_gov_7: "ที่ดินส่วนตัว"
 ra_admin_gov_8: "บนเส้นทางสู่อำนาจ"


 ra_admin_gov_1_desc: "@ra_admin_gov_1!ท่านอยู่ในการปกครองแบบ [administrative_government|e] ซึ่งประกอบด้วย $TUTORIAL_GOVERNORS$ ผู้ ซึ่งจัดการและดูแลดินแดนแทน [top_liege|e] ของตน แม้ว่าพวกเขาจะไม่ได้เป็นเจ้าของดินแดนนั้นจริง ๆ ก็ตาม"
 ra_open_admin_gov_panel_prompt: "เปิดแท็บ '$TUTORIAL_PROVINCES_NO_TOOLTIP$' ในแผงการปกครองแบบบริหาร (เน้นสี)"

 ra_admin_gov_2_desc: "นี่คือ $TUTORIAL_PROVINCES$ ทั้งหมดที่มีอยู่ภายใน [top_realm|e]\n\n$TUTORIAL_GOVERNOR$ สามารถถือครอง $TUTORIAL_PROVINCE_NO_TOOLTIP$ ได้เพียงแห่งเดียว การเติบโตอย่างแข็งแกร่งหมายถึงการกระจายการปกครองเหนือ $TUTORIAL_PROVINCES_NO_TOOLTIP$ ในหมู่สมาชิก [house|e] ของตน\n\nเนื่องจาก $TUTORIAL_GOVERNORS_NO_TOOLTIP$ ไม่ได้เป็นเจ้าของ $TUTORIAL_PROVINCE_NO_TOOLTIP$ ของตน พวกเขาจึงจำเป็นต้องรักษาตำแหน่งของตนไว้ผ่าน [schemes|e] และการดำเนินการทางการเมือง\n\n#I ท่านสามารถตรวจสอบ $TUTORIAL_PROVINCES_NO_TOOLTIP$ ได้โดยการคลิกบนแผนที่ หรือในรายการ#!"
 ra_open_admin_gov_theme_detail_prompt: "ตรวจสอบ $TUTORIAL_PROVINCE_NO_TOOLTIP$"

 ra_admin_gov_3_desc: "[skills|e] ของ $TUTORIAL_GOVERNOR_NO_TOOLTIP$ และอันดับของพวกเขาใน [trait|e] [GetTrait('governor').GetName( GetNullCharacter )] จะเป็นตัวกำหนด [governor_efficiency|e] ของพวกเขา ซึ่งวัดว่าพวกเขาสามารถรวบรวม [levies|e] และ [taxes|e] ได้มากเพียงใดสำหรับ $game_concept_top_liege$ ของตน\n\n$game_concept_governor_efficiency$ ที่สูงยังช่วยเสริมความแข็งแกร่งให้กับ $TUTORIAL_PROVINCIAL_ARMIES$ ของ [province|E] อีกด้วย\n\nหากท่านคือ [top_liege|e] ท่านควรตั้งเป้าหมาย เพื่อให้แน่ใจว่า $game_concept_provinces$ ถูกถือครองโดย $TUTORIAL_GOVERNORS_NO_TOOLTIP$ ที่มี $game_concept_governor_efficiency$ สูง"
 ra_admin_gov_3_prompt: "เปิดแท็บ 'การ แต่งตั้ง $TUTORIAL_GOVERNOR_NO_TOOLTIP$'"

 ra_admin_gov_4_desc: "[succession|e] ของ $TUTORIAL_PROVINCE$ ใน [administrative_government|e] จะถูกกำหนดโดยการเลือกตั้ง ซึ่งท่านจะใช้ @influence_icon![influence|e] เพื่อเพิ่ม [candidate_score|E] ของผู้สมัคร \n\nหากท่านกำลังมองหาหนทางขยายอำนาจภายใน [realm|e] ท่านย่อมต้องการให้แน่ใจว่าสมาชิก [house|e] ของท่านได้เป็น $TUTORIAL_GOVERNORS$ หรือแม้กระทั่งถือครอง [title|e] $game_concept_top_realm$ เสียเอง"

 ra_admin_gov_5_desc: "แต่ละ $TUTORIAL_PROVINCE$ ถูก [governed|e] โดย [family|e] ท่านสามารถเห็นตราอาร์มของ [house|e] แสดงอยู่ถัดจาก แต่ละ $TUTORIAL_PROVINCE_NO_TOOLTIP$\n\nเมื่อ $game_concept_house$ ของท่านได้รับ [titles|e] มากขึ้น ท่านจะมีความโดดเด่นมากขึ้น และอาจกลายเป็น [powerful_family|e] ได้"

 ra_open_admin_gov_powerful_families_intro: "เปิดแท็บตระกูลขุนนาง (ไฮไลต์)"

 ra_admin_gov_6_desc: "[powerful_family|e] คือ [house|e] ที่ทรงอิทธิพลใน [administrative_government|e] ตระกูลของ [top_liege|e] จะถือว่าทรงพลังเสมอ ไม่ว่า [powerful_family_rating_mid|e] ของพวกเขาจะเป็น เช่นไร นอกจากนี้ ยังสามารถมี $game_concept_powerful_families$ อื่น ๆ ได้อีกห้าตระกูล\n\nแม้ว่า $game_concept_house$ ใด ๆ จะสามารถกำหนด [powerful_family_attribute|E] ได้ แต่มันจะมีผลก็ต่อเมื่อตระกูลที่เกี่ยวข้องนั้นถือว่าทรงพลัง"
 ra_open_admin_gov_open_estate_prompt: "ดูที่ดินส่วนตัวของท่าน"
 ra_admin_gov_7_desc: "[estate|e] คือประเภทของ [domicile|e] ซึ่งแสดงถึงการถือครองที่ดินส่วนตัวที่ไม่ผูกติดกับ [landed|e] [titles|e] ใด ๆ โดยเฉพาะ ใน [administrative_government|e] มันทำหน้าที่เป็นฐานปฏิบัติการสำหรับ [family|e] ของท่าน และจะถูกสืบทอดภายใน [house|e] ของท่าน\n\nท่านสามารถอัปเกรดและสร้าง [estate_buildings|e] ใหม่ภายใน $game_concept_estate$ ของท่านเพื่อเพิ่ม [influence|e] และอิทธิพลทางการเมืองของท่านภายใน [realm|e]\n\n#TUT ที่น่าสังเกตคือ [feudal|e] [rulers|e] ภายใน $game_concept_administrative_government$ จะไม่สามารถเข้าถึง $game_concept_estate$ ได้#!"
 ra_admin_gov_8_desc: "@ra_admin_gov_8! [administrative_government|e] เป็นเรื่องเกี่ยวกับครอบครัว อิทธิพลทางการเมือง การวางอุบาย และการ แต่งตั้งคนที่เหมาะสมกับงานที่เหมาะสม\n\nท่านจะใช้ [influence|e] เพื่อปรับปรุงสถานะของท่านภายใน [realm|e] ในขณะที่ชี้นำสมาชิกของ [dynasty|e] ของท่านไปสู่ตำแหน่งที่มีอำนาจ\n\n[scheme|e] ต่อต้านคู่แข่งของท่านและบ่อนทำลายอำนาจของพวกเขาผ่านการวางแผนทางการเมือง เส้นทางสู่อำนาจนั้นยาวนานและคดเคี้ยว แต่หากท่านเล่นไพ่ของท่านอย่างถูกต้อง ท่านอาจจะสามารถนำทางไปได้"

 ra_agent_scheme_rework_1: "แผนการที่ซับซ้อน"
 ra_agent_scheme_rework_1_desc: "มาใช้เวลาสักครู่เพื่อทบทวน [schemes|e] ที่ซับซ้อน $game_concept_schemes$ เหล่านี้ประกอบด้วยพารามิเตอร์หลักสามประการคือ [success_chance|e], [scheme_speed_single|e] และ [secrecy|e]\n\nเพื่อช่วยท่านในการทำ $game_concept_scheme$ ให้สำเร็จ มี [agents|e] ประเภทต่าง ๆ ซึ่งมักจะมาในกลุ่มที่เลือกไว้ล่วงหน้าห้าคนเมื่อเริ่ม $game_concept_scheme$ ที่ซับซ้อน"
 reactive_advice_agent_scheme_rework: "$ra_agent_scheme_rework_1$"

 ra_agent_scheme_rework_2: "รายละเอียดแผนการที่ซับซ้อน"
 ra_agent_scheme_rework_2_desc: "[scheme|e] ที่ซับซ้อนจะดำเนินไปในช่วง [scheme_phases|e] หลายช่วง แต่ละ $game_concept_scheme_phase$ ประกอบด้วยจำนวนวันที่แน่นอน หลังจากนั้น [success_chance|e] ของท่านจะเพิ่มขึ้น\n\nมีโอกาสที่ท่านจะได้รับ [scheme_opportunity_opportunity|e] หลังจาก แต่ละ $game_concept_scheme_phase$ ซึ่งท่านสามารถใช้เพื่อโน้มน้าวให้ [agents|e] เข้าร่วม หรือเพื่อดำเนินการ $game_concept_scheme$ ด้วย $game_concept_success_chance$ ที่สูงขึ้น"

 ra_agent_scheme_rework_3: "ศักยภาพของแผนการที่ซับซ้อน"
 ra_agent_scheme_rework_3_desc: "แต่ละ [scheme|e] มี [scheme_potential|e] ที่เกี่ยวข้อง ศักยภาพนี้สามารถเพิ่มขึ้นได้โดยการใช้ [agents|e] และทำหน้าที่เป็นขีดจำกัดที่เข้มงวดสำหรับ [success_chance|e] สูงสุดที่ท่านสามารถสะสมได้\n\n$game_concept_scheme_potential$ ไม่สามารถเกิน 95% ได้ หมายความว่า $game_concept_schemes$ ทั้งหมด โดยไม่คำนึงถึงจำนวน [scheme_opportunity_opportunities|e] ที่ใช้เพื่อเพิ่ม $game_concept_success_chance$ จะมีโอกาสล้มเหลวเสมอ"

 ra_agent_scheme_rework_4: "ความลับของแผนการที่ซับซ้อน"
 ra_agent_scheme_rework_4_desc: "[scheme|e] ที่ซับซ้อนมีระดับ [secrecy|e] ที่แนบมาด้วย นี่คือค่าที่แสดงถึงความน่าจะเป็นที่ $game_concept_scheme$ จะถูกค้นพบ\n\nเมื่อเริ่ม $game_concept_scheme$ มันจะมีระยะเวลาผ่อนผันสองสามเดือน ซึ่งในระหว่างนั้นจะไม่สามารถถูกค้นพบได้ไม่ว่าในกรณีใด ๆ หลังจากช่วงเวลานี้ $game_concept_scheme$ มีความเสี่ยงที่จะถูกค้นพบผ่าน [scheme_breaches|e]\n\nท่านสามารถดำเนินการแผนการได้ แม้ว่าจะมี $game_concept_scheme_breaches$ แต่มันจะอยู่ที่ [success_chance|e] ที่ลดลง หาก $game_concept_scheme$ ของท่านสะสม $game_concept_scheme_breaches$ เจ็ดครั้ง มันจะถูกยกเลิก\n\n#TUT นอกจากนี้ แผนการพื้นฐานบางอย่าง เช่น [GetScheme('seduce').GetTypeName] อาจถือเป็นความลับและมีระยะเวลาผ่อนผันที่เกี่ยวข้อง#!"
 
 ra_agent_scheme_rework_5: "ตัวแทนในแผนการที่ซับซ้อน"
 ra_agent_scheme_rework_5_desc: "[schemes|e] ที่ซับซ้อนมีช่อง [agent|e] ห้าช่องที่สามารถเติมด้วยผู้สมรู้ร่วมคิดที่เป็นไปได้ โดยทั่วไปแล้ว เป็นความคิดที่ดีที่จะเติมช่อง $game_concept_agent$ ให้มากที่สุดเท่าที่จะเป็นไปได้ เนื่องจากพวกเขาสามารถให้โบนัสที่เป็นประโยชน์ต่อ [scheme_speed|e], [secrecy|e] หรือ [scheme_potential|e]\n\nประเภท $game_concept_agent$ ที่แตกต่างกันชอบ [skills|e] ที่แตกต่างกัน ตัวอย่าง เช่น [GetAgentSlotType( 'agent_infiltrator' ).GetName] ได้รับประโยชน์จาก [intrigue_i|e] [intrigue|e] และ [diplomacy_i|e] [diplomacy|e] นอกเหนือจาก [traits|e] บางอย่าง"

 ra_agent_scheme_rework_6: "การดำเนินการแผนการ"
 ra_agent_scheme_rework_6_desc: "เมื่อท่านรู้สึกมั่นใจว่าท่านได้วางแผนเพียงพอแล้ว อาจถึงเวลาพิจารณาดำเนินการ [scheme|e] ของท่าน ในการทำ เช่นนี้ ท่านสามารถใช้ประโยชน์จาก [EmptyScope.ScriptValue('multi_ending_scheme_charge_to_advance_threshold_t1_value')], [EmptyScope.ScriptValue('multi_ending_scheme_charge_to_advance_threshold_t2_value')], [EmptyScope.ScriptValue('multi_ending_scheme_charge_to_advance_threshold_t3_value')] หรือ [EmptyScope.ScriptValue('multi_ending_scheme_charge_to_advance_threshold_t4_value')] ของ [scheme_opportunity_opportunities|e] ที่ท่านสะสมไว้\n\nนอกจากนี้ หากท่านสงสัยว่ามีคนกำลังวางแผนต่อต้านท่าน อาจคุ้มค่าที่จะเปลี่ยน [scheme_countermeasure|e] ที่ใช้งานอยู่ของท่านเพื่อหลีกเลี่ยงเหตุการณ์ไม่คาดฝันที่อาจเกิดขึ้น\n\nขอให้โชคดี และมีความสุขกับการวางแผน!"

