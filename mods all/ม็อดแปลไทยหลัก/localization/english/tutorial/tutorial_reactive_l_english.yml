 ra_laamp_contract_move_1: "การหาสัญญา"
 ra_laamp_contract_move_1_desc: "หากงานในพื้นที่ท้องถิ่นของท่านหมดลง หรือท่านแสวงหางานที่น่าตื่นเต้นยิ่งขึ้น การย้าย [camp|E] ของท่านเป็นวิธีที่ง่ายที่สุดในการหา [task_contracts|E] ใหม่ ๆ มากมาย\n\nท่านต้อง [travel|E] เป็นระยะทางพอสมควรจากที่ตั้งแคมป์เก่าของท่าน เพื่อให้แน่ใจว่าท่านจะพบโอกาสใหม่ ๆ เมื่อท่านมาถึง"
 ra_domicile_camp_task: "ไปที่หน้าต่างค่าย"

 ra_laamp_contract_move_2: "การย้ายค่ายของท่าน"
 ra_laamp_contract_move_2_desc: "นี่คือตัวอย่างของจุดหมายปลายทางที่อยู่ห่างจากตำแหน่ง [camp|E] ปัจจุบันของท่านพอสมควร\n\nท่านอาจวางแผน [travel|E] โดยตรงจากมุมมอง [county|E] ไปยัง [barony|E] ที่เลือกในเคาน์ตี\n\n#weak หมายเหตุ: ท่านอาจเริ่มการเดินทางของค่ายจากหน้าต่างค่าย โดยใช้ปุ่มย้ายที่อยู่ด้านล่าง#!"
 ra_domicile_travel_task: "ไปที่มุมมอง $relocate_camp_to_interaction$"

 ra_laamp_contract_move_3: "การเดินทางพร้อมค่ายของท่าน"
 ra_laamp_contract_move_3_desc: "[traveling|E] พร้อม [camp|E] ของท่านทำงานเหมือนกับการเดินทางปกติ แต่ท่านนำ [camp_buildings|E] และ [followers|E] ทั้งหมดไปด้วย และต้องใช้ [provisions|E]"
 ra_domicile_depart_task: "เริ่มการเดินทางของค่ายของท่าน"

