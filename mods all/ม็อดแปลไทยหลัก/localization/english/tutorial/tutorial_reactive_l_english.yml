 ra_christian_situation_2_desc: "[GetSituation('the_christian_church').GetName] can be accessed through the Situations panel, or by clicking the highlighted button."
 ra_christian_situation_2_prompt: "Open the Christian Church Situation (highlighted)"
 ra_christian_situation_3_desc: "The highlighted area shows the current [the_christian_church_chapter_short|e] of [GetSituation('the_christian_church').GetName]. As you can see, the [situation|e] is currently in the [GetSituation('the_christian_church').GetTopSubRegion.GetCurrentPhase.GetName].\n\nEach $game_concept_the_christian_church_chapter_short$ comes with its a set of benefits (and sometimes drawbacks) for [secular_rulers|e] and [clergy|e]. For instance, $game_concept_secular_rulers$ can appoint their own [court_chaplains|e] during the [GetSituationType('the_christian_church').GetPhaseType('investiture_crisis').GetName]."
 ra_christian_situation_4_desc: "This section shows all the potential [the_christian_church_chapters_short|e] [GetSituation('the_christian_church').GetName] can currently transition into.\n\nEach $game_concept_the_christian_church_chapter_short$ leads into a limited number of other $game_concept_the_christian_church_chapters_short$, so you'll want to push the Church toward the one you're interested in while you still can! More on that later."
 ra_christian_situation_4b_desc: "[situation_catalyst_catalysts|e] dictate the flow of Chapters. Let's take a look at them."
 ra_christian_situation_4b_prompt: "Click the #V View Catalysts#! button of a potential future Chapter (highlighted)"
 ra_christian_situation_4c_desc: "In this window, you can see a list of all [situation_catalyst_catalysts|e] that contribute progress toward a specific [the_christian_church_chapter_short|e].\n\n$game_concept_situation_catalyst_catalysts$ can be triggered by any [GetReligionByKey('christianity_religion').GetAdjective] [ruler|e]. There's no limit to how many times a $game_concept_situation_catalyst_catalyst$ can be triggered. Each time one is triggered, it will award a certain amount of points of progress toward the Chapter it's tied to.\n\nSome Catalysts will happen naturally over time, while others require more active effort to trigger. For a $game_concept_the_christian_church_chapter_short$ to become active, it must reach #V 1000#! points of progress. This usually happens over the course of many ingame years."
 ra_christian_situation_close_catalyst_subwindow_desc: "With [situation_catalyst_catalysts|e] covered, let's talk about the [decisions|e] at the bottom of the Situation."
 ra_christian_situation_close_catalyst_subwindow_prompt: "Close the Catalysts subwindow"
 ra_christian_situation_4d_desc: "Here, you'll see some important [decisions|e] that you can take to shape the future of the [GetReligionByKey('christianity_religion').GetAdjective] [faith|e]. Certain $game_concept_decisions$ will only be available during certain [the_christian_church_chapters_short|e].\n\nIf you'd like to steer the Church toward a specific $game_concept_the_christian_church_chapter_short$ you can take the #V Guide the Christian Church#! $game_concept_decision$, available once every ten years."
 ra_christian_situation_5_desc: "In this tab, we can see the six [situation_participant_groups|e] of [GetSituation('the_christian_church').GetName].\n\nThe Main Power is defined as the [GetReligionByKey('christianity_religion').GetAdjective] [faith|e] that controls the most [counties|e] in the world. In 1066, this is [GetFaithByKey('catholic').GetName].\n\nThe Secondary Powers Group consists of any other Christian $game_concept_faiths$ that follow the [GetDoctrine('special_doctrine_ecumenical_christian').GetBaseName] [doctrine|e]. In 1066, [GetFaithByKey('orthodox').GetName] and [GetFaithByKey('miaphysitism').GetName] qualify.\n\nLastly, the Heretics $game_concept_situation_participant_group$ consist of all other Christian $game_concept_faiths$ which do not follow the [GetDoctrine('special_doctrine_ecumenical_christian').GetBaseNameNoTooltip] $game_concept_doctrine$."
 ra_christian_situation_college_of_cardinals_desc: "You can take a peek at the [college_of_cardinals|e] by clicking the highlighted button. The future Pope will be one of three [cardinals|e], with each one filling a different niche.\n\nYou can directly influence who will be the next Pope either by increasing a $game_concept_cardinal$'s [papabile_score|e], or by convincing other $game_concept_cardinals$ to vote for them."
 ra_christian_situation_6_desc: "[GetSituation('the_christian_church').GetName] will wax and wane in power and influence between different [the_christian_church_chapters_short|e] as time progresses. Both [secular_rulers|e] and [clergy|e] have the ability to push [GetReligionByKey('christianity_religion').GetName] in the direction they desire.\n\nYou might build great cathedrals during a [the_christian_church_stability|e], look to spread the [faith|e] during a [the_christian_church_zeal|e], or try to guide the Church away from sin during a [the_christian_church_crisis|e].\n\nPerhaps you can mend the schism? Or even prevent it from happening altogether? Maybe the Church will deem your [rite|e] heretical? In any case, good luck!"
 reactive_advice_puppets: "Advice: $game_concept_puppets$"
 action_reactive_advice_puppets_desc: "You have access to one or more [puppets|e]! This lets you take certain action you would otherwise not be able to. Let's take a moment to get familiar with them."
 reactive_advice_puppets_desc: "[puppets|e] can be viewed inside the Intrigue window. Let's navigate over there to get a better look at the different [puppet_types|e] you have access to."
 reactive_advice_puppets_2_desc: "In this window, you can see the various [puppet_types|e] you have access to. Once a character occupies a $game_concept_puppet_type$ slot, they are considered to be your [puppet|e].\n\nNot all $game_concept_characters$ are fit for all $game_concept_puppet_types$. For instance, the [clerical_puppet|e] $game_concept_puppet_type$ can only ever be occupied by your [realm_priest|e]."
 reactive_advice_puppets_3: "Acting Through $game_concept_puppets$"
 reactive_advice_puppets_3_desc: "Once a [character|e] occupies a $game_concept_puppet_type$ slot, they are your [puppet|e] and you can act through them.\n\nThrough a $game_concept_puppet$ you can perform [interactions|e], take [decisions|e], and start [great_projects|e] that you could not otherwise.\n\nAs an example, if you are a [secular_ruler|e] and wish to create your own [rite|e], you can do so through your [clerical_puppet|e]."
 reactive_advice_puppets_4: "$game_concept_puppet$ Actions"
 reactive_advice_puppets_4_desc: "There is a set of common actions shared by all [puppets|e], but each [puppet_type|e] also has access to its own set of unique actions. For instance, all $game_concept_puppets$ can be ordered to perform the [send_gift|e] interaction, but only a [clerical_puppet|e] can be ordered to [excommunicate|e] someone.\n\nIf an action has a cost, your $game_concept_puppet$ will use their own Resources to perform it. In our #high Send Gift#! example, the $game_concept_puppet$ would spend their own [gold|e], and the recipient of the [interaction|e] would have their opinion of the $game_concept_puppet$ increased.\n\nTo act as your $game_concept_puppet$, open the $game_concept_interaction$ Menu by right-clicking a character. If you have a $game_concept_puppet$, you can access their $game_concept_interactions$ by clicking the button corresponding to its $game_concept_puppet_type$."
 reactive_advice_puppets_5_desc: "[puppets|e] are versatile. As a [secular_ruler|e] you can use them to shape your [faith|e] to your liking. As a member of [clergy|e], why not puppet a [ruler|e] in order to control their [realm|e] from the shadows?\n\nGood luck, and happy puppeteering!"
 reactive_advice_puppets_open_panel_prompt: "Open the Intrigue window, then select the $game_concept_puppets$ tab"
 reactive_advice_clerical_regions: "Advice: $game_concept_clerical_regions$"
 action_reactive_advice_clerical_regions_desc: "You have land inside of a [clerical_region|e]! You may have an [archbishop|e] presiding over ecclesiastical affairs in your [realm|e]. Let's take a moment to talk about what that means."
 reactive_advice_clerical_regions_desc: "You have land inside of a [clerical_region|e]. You fall under the jurisdiction of the $game_concept_clerical_region$ that contains your [capital|e]. Before we dig in deeper, let's take a look at the map."
 reactive_advice_clerical_regions_faiths_map_mode_prompt: "Switch to the Faiths map mode by clicking the button in the bottom right (highlighted)"
 reactive_advice_clerical_regions_2_desc: "Good job! You are now viewing all the [faiths|e] and [rites|e] in the world. From here, you can switch to viewing [clerical_regions|e] by clicking the highlighted button."
 reactive_advice_clerical_regions_map_mode_prompt: "Switch to the Clerical Regions map mode (highlighted)"
 reactive_advice_clerical_regions_3_desc: "From here, you can see all the [clerical_regions|e] present in the world. These are administrative divisions within your [faith|e]. For Christian $game_concept_faiths$, these regions are called [archdioceses|e].\n\nIf you would like to switch back and forth between administrative layers, you can use #V E#! to view Realms on the map, and #V SHIFT+R#! to view $game_concept_clerical_regions$."
 reactive_advice_clerical_regions_select_region_prompt: "Click a $game_concept_clerical_region$ on the map"
 reactive_advice_clerical_regions_4_desc: "A [clerical_region|e] is a geographic area held by a member of [clergy|e]. In Christian [faiths|e], these regions are called [archdioceses|e] and their [holders|e] are called [archbishops|e]. $game_concept_archbishops$ have access to a [domicile|e], which is inherited along with the $game_concept_clerical_region$ [title|e].\n\nAs a [secular_ruler|e], you want to keep an eye on the $game_concept_archbishop$ who presides over the $game_concept_clerical_region$ in which your [capital|e] is located.\n\nAn $game_concept_archbishop$ can, for instance, increase your [legitimacy|e] through the #TUT_KW $request_legitimacy_interaction$#! [interaction|e], make neighboring [titles|e] [de_jure|e] through #TUT_KW $ecclesiastical_de_jure_shifting_interaction$#!, or enforce a [white_peace|e] between yourself and another Christian [ruler|e]."
 reactive_advice_clerical_regions_5_desc: "The [rite|e] of a [clerical_region|e]'s [holder|e] will gradually spread to the counties within the region.\n\nIf you would like to keep your lands from converting it may be wise to try to find an [archbishop|e] who shares your $game_concept_rite$. As a [secular_ruler|e], you could accomplish this by ordering a [puppet|e] to ask their [head_of_faith|e] for a [clerical_title|e]."
 reactive_advice_clerical_regions_6_desc: "Characters can only ever hold one [clerical_region|e] at a time.\n\nIf a [holder|e] of a $game_concept_clerical_region$ has land and is granted another region outside of their [realm|e], they will lose their lands.\n\nThe [head_of_faith|e] is exempt from this, as they will always hold the capital $game_concept_clerical_region$, no matter where else they may hold land."
 reactive_advice_personal_beliefs: "Advice: Personal Beliefs"
 action_reactive_advice_personal_beliefs_desc: "You have a level of [spiritual_fulfillment|e], a measure of how at peace you feel with your [faith|e].\n\nThis is affected by many different things, but primarily it increases from adoption of [personal_tenets|e]. Let's take a look."
 reactive_advice_personal_beliefs_1: "Personal Beliefs"
 reactive_advice_personal_beliefs_desc: "[spiritual_fulfillment|e] is a number between #N -100#! and #P 100#!, and measures how at peace you are with your [faith|e]. High $game_concept_spiritual_fulfillment$ will grant you a variety of benefits, mostly related to your $game_concept_faith$.\n\nOn the other hand, having low $game_concept_spiritual_fulfillment$ will increase your [stress|e] gain, but it also comes with certain benefits..."
 reactive_advice_personal_beliefs_open_window_prompt: "Open the $PERSONAL_BELIEFS_VIEW_TITLE$ window (highlighted)"
 reactive_advice_personal_beliefs_2: "Your $game_concept_personal_tenets$"
 reactive_advice_personal_beliefs_2_desc: "These are your [personal_tenets|e]. All [core_tenets|e] have a corresponding $game_concept_personal_tenet$ with its own unique effects available to those who adopt it.\n\nYou can only adopt a limited number of $game_concept_personal_tenets$. Switching a Tenet out or outright rejecting it will generally result in a loss of [spiritual_fulfillment|e].\n\nThe number of slots you have is limited, and grows with your [piety_level|e]. Certain [traits|e] and [dynasty_perks|e] can also increase your number of $game_concept_personal_tenets$ slots."
 reactive_advice_personal_beliefs_3_desc: "This is your [spiritual_fulfillment|e]. Upon reaching a new [spiritual_fulfillment_level|e], the effects of that level become available to you.\n\nFor instance, at the lowest level of Fulfillment, you stop gaining stress from #V [GetScheme('murder').GetTypeName]#! [schemes|e], while at the highest level you unlock the ability to #V [GetScheme('befriend').GetTypeName]#! your [head_of_faith|e].\n\nOutside of adopting [personal_tenets|e] you can also lose and gain $game_concept_spiritual_fulfillment$ by acting in ways your [faith|e] considers [sinful|e] or [virtuous|e]. This primarily happens in events."
 reactive_advice_personal_beliefs_4: "Learning $game_concept_core_tenets$ and $game_concept_doctrines$"
 reactive_advice_personal_beliefs_4_desc: "The right-side section of this window is dedicated to all the [core_tenets|e] and [doctrines|e] you know about. Whenever you learn about a $game_concept_core_tenet$ or $game_concept_doctrine$ from another Character, it will show up here.\n\nAs you start out, you will know all the $game_concept_core_tenets$ and $game_concept_doctrines$ your [faith|e] knows about. Through [travel|e], [activities|e], and events you may learn about others.\n\nOnce you know about a $game_concept_core_tenet$ or $game_concept_doctrine$, you will be able to make it a core belief of your own [rite|e], should you choose to create one. Of course, $game_concept_core_tenets$ and $game_concept_doctrines$ known to you but not your $game_concept_faith$ will generally be considered [rite_divergent|e]..."
 reactive_advice_ecclesiastical_ruler: "Advice: [ecclesiastical|e] Government"
 action_reactive_advice_ecclesiastical_ruler_desc: "You are an [ecclesiastical|e] [ruler|e]. This is a special kind of playable [theocracy|e] for Christian [faiths|e]. Let's take a moment to go over what you can do."
 reactive_advice_ecclesiastical_ruler_1: "$game_concept_ecclesiastical$ Government"
 reactive_advice_ecclesiastical_ruler_desc: "As an [ecclesiastical|e] character, you are part of the [clergy|e] of your [faith|e].\n\nWhen playing as this government type, your [heir|e] is the person first in line to inherit your [primary_title|e], regardless of their [dynasty|e]."
 reactive_advice_ecclesiastical_ruler_map_mode: "$game_concept_clerical_regions$ on the Map"
 reactive_advice_ecclesiastical_ruler_map_mode_desc: "Your [faith|e] divides its lands into [clerical_regions|e] called [archdioceses|e], each one held by a member of [clergy|e].\n\nAs an [ecclesiastical|e] [ruler|e], you can only ever hold one $game_concept_archdiocese$ at a time.\n\nLet's take a look at them!"
 reactive_advice_ecclesiastical_ruler_map_mode_prompt: "Open the $game_concept_clerical_regions$ map mode (highlighted)"
 reactive_advice_ecclesiastical_ruler_open_archdiocese: "Inspect an $game_concept_archdiocese$"
 reactive_advice_ecclesiastical_ruler_open_archdiocese_desc: "These are all the [clerical_regions|e] within your [faith|e]. Holding an [archdiocese|e] gives you access to a [cathedral_complex|e], a special kind of [domicile|e].\n\nIf you're not already an [archbishop|e], becoming one would be a good first goal. Either way, let's take a look at the $game_concept_clerical_region$ view."
 reactive_advice_ecclesiastical_ruler_open_archdiocese_prompt: "Select a $game_concept_clerical_region$ on the map"
 reactive_advice_ecclesiastical_ruler_archdiocese_view_desc: "This is the [rite|e] of the [archdiocese|e]. It's determined by the $game_concept_rite$ of the [title|e] [holder|e]. You can also see the [treasury|e] attached to the $game_concept_title$.\n\nBelow it you can also see the [independent_rulers|e] with capitals inside of it."
 reactive_advice_ecclesiastical_ruler_cathedral_complex_desc: "Here you can see the [cathedral_complex|e] of the [holder|e]. This is a special kind of [domicile|e], that can be upgraded through a [great_project|e]. Since it's attached to the [title|e], it will be inherited along with it."
 reactive_advice_ecclesiastical_ruler_archdiocese_succession: "Becoming an $game_concept_archbishop$"
 reactive_advice_ecclesiastical_ruler_archdiocese_succession_desc: "When playing as an [ecclesiastical|e] character, and especially if you are not already an [archbishop|e], you might want to keep an eye on the [succession|e] of the [title|e].\n\nTo acquire an $game_concept_archdiocese$, you can use the #V $influence_clerical_candidacy_interaction$#! Interaction on yourself. This increases your [candidate_score|e] for the [title|e].\n\nClerical $game_concept_candidate_score$ can also be increased by several other means, such as a high [learning|e] [skill|e], or by having [virtuous|e] traits."
 reactive_advice_ecclesiastical_ruler_open_cardinals: "Becoming the Pope"
 reactive_advice_ecclesiastical_ruler_open_cardinals_desc: "That's all well and good, but what if you want to become the Pope? To figure this out, we should take a look at the [college_of_cardinals|e]."
 reactive_advice_ecclesiastical_ruler_open_cardinals_college_tt: "Open the $game_concept_college_of_cardinals$ (highlighted)"
 reactive_advice_ecclesiastical_ruler_2: "Cardinals"
 reactive_advice_ecclesiastical_ruler_2_desc: "To start out with, if your [faith|e] lacks a [head_of_faith|e] #weak (such as Chalcedonianism in 867)#!, the Pope is simply a special name for the [head_of_rite|e] of the Roman Rite. In order to be eligible #weak (or papabile, if you will)#! for the Papacy, you must become a [cardinal|e]. These are special [titles|e] the Pope will grant to members of [clergy|e].\n\nIn this window, you can see the three $game_concept_cardinals$ who are the most likely to become the new Pope, as well as how all the $game_concept_cardinals$ are voting. You can use the #V $request_clerical_elector_title_interaction$#! Interaction on the Pope to become a $game_concept_cardinal$."
 reactive_advice_ecclesiastical_ruler_3: "Becoming a Religious Head"
 reactive_advice_ecclesiastical_ruler_3_desc: "If you'd rather eschew the Roman Rite in favor of your own, you can make your own branched [rite|e] the new Mainline. There's a couple of ways to do this, depending on whether or not your [faith|e] has a [head_of_faith|e].\n\nWhen there is no $game_concept_head_of_faith$, your $game_concept_rite$ must have more [counties|e] following it, and it must control as many or more [holy_sites|e] as the current Mainline to overtake it.\n\nIf there #EMP is#! a $game_concept_head_of_faith$, your $game_concept_rite$ can become the mainline if you're elected Pope. Failing that you could champion yourself or someone else as an [antipope|e].\n\nAlternatively, if you're [heretical|e] enough, you can simply branch off and become the Head of your own brand-new $game_concept_faith$."
