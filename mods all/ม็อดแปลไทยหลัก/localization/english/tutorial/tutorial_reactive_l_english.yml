l_english: 
 open_tutorial_lesson:1 "คำแนะนำ: "
 click_to_open_lesson:1 "#I คลิกเพื่อเรียนรู้เพิ่มเติม#!"
 reactive_advice_mercenaries:0 "$reactive_advice_mercenaries_step_1$"
 action_reactive_advice_mercenaries:0 "$open_tutorial_lesson$$reactive_advice_mercenaries_step_1$"
 action_reactive_advice_mercenaries_desc:0 "ทหารรับจ้างคือทหารที่จ้างมาเพื่อพลิกสถานการณ์ในสงครามได้\nเปิดข้อความนี้เพื่อรับคำแนะนำและเคล็ดลับเกี่ยวกับวิธีใช้งานพวกเขาให้ดีที่สุด!"
 action_reactive_advice_mercenaries_click:0 "$click_to_open_lesson$"
 reactive_advice_mercenaries_step_1:0 "ทหารรับจ้าง"
 reactive_advice_mercenaries_desc:0 "หากท่านกำลังพ่ายแพ้ในสงคราม ท่านอาจพลิกสถานการณ์ให้เป็นใจได้โดยการจ้าง [mercenaries|E]\n\nทหารรับจ้างต้องใช้ [gold|E] แต่จะมอบ [army|E] ที่สำคัญให้แก่ท่าน เมื่อจ้างแล้ว ท่านจะสามารถควบคุมพวกเขาได้เหมือนกองทัพอื่น ๆ\n\n#TUT ท่านอาจต้องการจ้างหน่วยทหารรับจ้างสำหรับสงครามปัจจุบันของท่าน แม้ว่าท่านอาจต้อง [debt|E] ในการจ้างพวกเขา เราขอแนะนำให้ท่านหาหน่วยที่ราคาไม่แพง เว้นแต่ท่านกำลังพ่ายแพ้อย่างหนัก#!"
 reactive_advice_mercenaries_task:0 "ไปที่มุมมอง $HIRE_TROOPS$ และเลือกกองทหารรับจ้างใดก็ได้"
 reactive_advice_succession:0 "$reactive_advice_succession_step_1$"
 action_reactive_advice_succession:0 "$open_tutorial_lesson$$reactive_advice_succession_step_1$"
 action_reactive_advice_succession_desc:0 "เกิดอะไรขึ้น? ท่านสิ้นชีพ และมีการสืบทอดเกิดขึ้น!\nเปิดข้อความนี้เพื่อสรุปสิ่งที่เกิดขึ้น รวมถึงคำแนะนำในการวางแผนครั้งต่อไป"
 action_reactive_advice_succession_click:0 "$click_to_open_lesson$"
 reactive_advice_succession_step_1:0 "การสืบทอด"
 reactive_advice_succession_desc:3 "พระราชาสวรรคตแล้ว ขอพระราชาองค์ใหม่ทรงพระเจริญ!\n\nอย่ากังวลไป แม้ว่าตัวละครเก่าของท่านจะสิ้นชีพแล้ว Crusader Kings III เป็นเกมเกี่ยวกับราชวงศ์ เนื่องจาก [ruler|E] ของท่านมี [player_heir|E] ท่านจะได้ควบคุมพวกเขาแทน!\n\n#TUT ความตายเป็นส่วนหนึ่งตามธรรมชาติของเกม และท่านมักจะได้เล่นต่อในฐานะ [eligible_child|E] ที่อาวุโสที่สุด (ขึ้นอยู่กับ [succession_laws|E] ของอาณาจักรท่าน) เพื่อวางแผนการสืบทอดที่ปลอดภัย เราขอแนะนำให้ท่านมีบุตรอย่างน้อยสองคน คนที่สองทำหน้าที่เป็นตัวสำรองเผื่อคนแรกเสียชีวิต\n\nในการสืบทอด ท่านอาจสูญเสีย [titles|E] บางส่วนที่ตัวละครก่อนหน้าของท่านถือครองอยู่ อย่ากังวล ท่านยังคงมี [claims|E] เหนือบรรดาศักดิ์ทั้งหมดที่ท่านสูญเสียไป#!\n\n#weak เราขอแนะนำให้ท่านใช้เวลาทำความคุ้นเคยกับตัวละครใหม่ของท่านก่อนดำเนินการต่อ#!"
 reactive_advice_domain_limit:0 "$reactive_advice_domain_limit_step_1$"
 reactive_advice_domain_limit_step_1:0 "ขีดจำกัดโดเมน"
 reactive_advice_domain_limit_desc:0 "ขณะนี้ท่านถือครองที่ดินใน [domain|E] ของท่านมากกว่าที่ตัวละครของท่านจะสามารถจัดการได้ด้วยตนเอง ถึงเวลาสร้าง [vassals|E] ใหม่แล้ว!\n\nเนื่องจากท่านต้องการเก็บรักษาบรรดาศักดิ์อันมีค่าไว้ในโดเมนของท่าน เราขอแนะนำให้ท่านไปที่แท็บโดเมนในมุมมองอาณาจักรของท่าน ซึ่งท่านสามารถดูได้ว่า แต่ละบรรดาศักดิ์มีค่าต่อท่านเท่าใด พิจารณาด้วยว่าบรรดาศักดิ์ใดอยู่ใน [de_jure|E] ของท่าน\n\n#TUT ควรหลีกเลี่ยงการอยู่เกิน [domain_limit|E] นานเกินไป เนื่องจากการทำเช่นนั้นจะส่งผลตามมา\n\nเพื่อให้อยู่ต่ำกว่าขีดจำกัด ท่านต้องมอบ [titles|E] ส่วนเกินให้กับข้าหลวงใหม่ แม้ว่าท่านจะสามารถมอบบรรดาศักดิ์ให้กับข้าหลวงที่มีอยู่แล้วได้ แต่บ่อยครั้งการหาคนไม่มีที่ดินมามอบให้เป็นความคิดที่ดีกว่า\n\nสมาชิก [dynasty|E] ที่ห่างไกล หรือ [courtiers|E] ที่มีลักษณะนิสัย [GetTrait('content').GetName( GetPlayer )] [trait|E] เป็นข้าหลวงที่ยอดเยี่ยม ส่วน [claimants|E] ต่อบรรดาศักดิ์ของท่าน หรือข้าราชสำนักที่มีลักษณะนิสัย [GetTrait('ambitious').GetName( GetPlayer )] นั้นไม่ค่อยดีนัก#!"
 reactive_advice_vassal_limit:0 "$reactive_advice_vassal_limit_step_1$"
 reactive_advice_vassal_limit_step_1:0 "ขีดจำกัดข้าหลวง"
 reactive_advice_vassal_limit_desc:0 "ไม่มีใครสามารถจัดการเคานต์จำนวนมากได้ ผู้พิชิตที่มุ่งมั่นต้องพึ่งพา [vassals|E] ระดับสูง เช่น ดยุก เพื่อจัดการดินแดนแทนตน!\n\nท่านสามารถดูขีดจำกัดข้าหลวงปัจจุบันของท่านได้ในมุมมองโดเมน\n\n#TUT เช่นเดียวกับขีดจำกัดโดเมนของท่าน ท่านไม่ควรเกิน [vassal_limit|E] เพื่อหลีกเลี่ยงบทลงโทษนี้ ท่านควรควบรวมข้าหลวงของท่าน\n\nวิธีที่ดีที่สุดคือการมอบ [duchies|E] ให้กับข้าหลวงของท่าน ซึ่งจะทำให้พวกเขาปกครองพื้นที่ที่ใหญ่ขึ้น เพื่อที่ท่านจะได้ไม่ต้องทำเอง! แต่เพื่อให้ได้ผล ท่านต้องถือครอง [kingdom|E] หรือ [empire|E] ด้วยตนเอง อย่าทำผิดพลาดโดยการมอบ [primary_titles|E] ของท่านไป!\n\nหากท่านพบว่าตนเองเกินขีดจำกัดข้าหลวงในฐานะดยุก เราขอแนะนำให้ท่านก่อตั้งอาณาจักรโดยเร็วที่สุดเท่าที่จะทำได้#!"
 reactive_advice_megaduke_penalty:0 "$reactive_advice_megaduke_penalty_step_1$"
 reactive_advice_megaduke_penalty_step_1:0 "ดัชชีใหญ่เกินไป!"
 reactive_advice_megaduke_penalty_desc:2 "[duchy|E] ของท่านกำลังพังทลายลงภายใต้แรงกดดันจากการมีที่ดินมากเกินไป ท่านควร [create|E] หรือ [usurp|E] [kingdom|E]!\n\n#TUT บางทีท่านอาจสามารถก่อตั้งอาณาจักรได้แล้ว? หากเป็นเช่นนั้น ให้เปิดมุมมองเคล็ดลับ และดูว่ามีอาณาจักรใดที่ท่านสามารถก่อตั้งได้หรือไม่ หากไม่มี ท่านมี [decision|E] ให้ก่อตั้งอาณาจักรของท่านเอง — แม้ว่าพึงระวังว่าตำแหน่งที่ท่านก่อตั้งขึ้นเองนั้นมักจะอ่อนแอกว่าตำแหน่งที่สืบสิทธิ์ตาม [de_jure|E] ที่มีอยู่เดิม\n\nหากท่านเป็น [vassal|E] และ [liege|E] ของท่านเป็นกษัตริย์ ท่านต้องเรียกร้องเอกราชก่อนที่ท่านจะก้าวขึ้นเป็นกษัตริย์เสียเอง ขั้นตอนแรกคือการเข้าร่วมหรือเริ่มก่อตั้ง [independence_faction|E]#!"
 reactive_advice_bastards:0 "$reactive_advice_bastards_step_1$"
 action_reactive_advice_bastards:0 "$open_tutorial_lesson$$reactive_advice_bastards_step_1$"
 action_reactive_advice_bastards_desc:0 "บุตรนอกสมรสอาจเป็นพรหรือคำสาปก็ได้ แต่มันหมายความว่าอย่างไรกันแน่?\nเปิดข้อความนี้เพื่อสรุปเรื่องบุตรนอกสมรส และวิธีที่มันจะเป็นประโยชน์ต่อท่าน!"
 action_reactive_advice_bastards_click:0 "$click_to_open_lesson$"
 reactive_advice_bastards_step_1:0 "บุตรนอกสมรส"
 reactive_advice_bastards_desc:1 "อุ๊ย! ดูเหมือนว่าท่านจะมีบุตร [bastard|E]! นี่อาจเป็นภัยคุกคาม หรือโอกาสก็ได้...\n\n#TUT การมีบุตรนอกสมรสไม่ใช่เรื่องเลวร้ายไปเสียทั้งหมด พวกเขาสามารถแต่งงานเพื่อสร้าง [alliances|E] ได้โดยไม่เป็นภัยคุกคามโดยตรงต่อ [succession|E] ของท่าน เนื่องจากพวกเขาไม่ถือว่าเป็น [legitimate|E]\n\nอาจเป็นความคิดที่ดีที่จะมีบุตรนอกสมรสไว้บ้าง เพื่อให้สามารถ [legitimized|E] ได้หากท่านขาดบุตรในสมรส อย่างไรก็ตาม อย่าลืมจับตาดู [opinion|E] ที่ [spouse|E] ของท่านมีต่อท่าน...\n\nหากท่านต้องการมีบุตรนอกสมรส เราขอแนะนำให้ท่านใช้ [GetScheme('seduce').GetTypeName] [scheme|E] กับตัวละครที่ยังไม่ได้แต่งงาน หากท่านยั่วยวนหญิงที่แต่งงานแล้ว สามีของเธออาจคิดว่าเด็กเป็นลูกของเขา หากเกิดเหตุการณ์นี้ขึ้น ท่านจะไม่สามารถรับรองบุตรได้#!"
 reactive_advice_protecting_against_hostile_schemes:0 "$reactive_advice_protecting_against_hostile_schemes_step_1$"
 action_reactive_advice_protecting_against_hostile_schemes:0 "$open_tutorial_lesson$$reactive_advice_protecting_against_hostile_schemes_step_1$"
 action_reactive_advice_protecting_against_hostile_schemes_desc:0 "อันตรายมากมายซุ่มซ่อนอยู่ในเงามืด และภัยคุกคามจากแผนการก็อยู่ไม่ไกล\nเปิดข้อความนี้เพื่อสรุปเรื่องแผนการ และวิธีป้องกันตนเอง!"
 action_reactive_advice_protecting_against_hostile_schemes_click:0 "$click_to_open_lesson$"
 reactive_advice_protecting_against_hostile_schemes_step_1:0 "การป้องกันแผนการร้าย"
 reactive_advice_protecting_against_hostile_schemes_step_2:0 "$reactive_advice_protecting_against_hostile_schemes_step_1$"
 reactive_advice_protecting_against_hostile_schemes_desc:0 "ระวังตัวด้วย! ในฐานะผู้ปกครอง มีหลายคนที่อาจวาง [scheme|E] เพื่อให้ท่านตาย...\n\nพยายาม ทำให้แน่ใจว่าข้าราชบริพารของท่านมี [opinion|E] ที่ดีต่อท่าน แต่ที่สำคัญที่สุด #emphasis จง#! รักษาความภักดีของ [spymaster|E] ของท่านเสมอ\n\n#TUT ท่านอาจไม่รู้ว่ามีอยู่ แต่ [hostile_schemes|E] อาจมุ่งเป้ามาที่ท่านได้ตลอดเวลา เพื่อป้องกันแผนการ เราขอแนะนำให้ท่านทำให้ [vassals|E] และ [courtiers|E] ของท่านมีความสุข#!"
 reactive_advice_protecting_against_hostile_schemes_2_desc:0 "การมีหัวหน้าสายลับที่มีความเห็นต่อท่านต่ำมากอาจเป็นเหมือนโทษประหาร เนื่องจากจะไม่มีทางให้ท่านค้นพบ [secret_schemes|E] ได้เลย!\n\n#TUT พิจารณาทั้งหมดนี้หากท่านวางแผนที่จะเล่นเป็น [tyrant|E] เพราะแม้ว่าท่านอาจปราบปรามข้าราชบริพารของท่านผ่าน [dread|E] พวกเขาก็ยังสามารถวางแผนต่อต้านท่านได้\n\nสุดท้าย ระวัง [claimants|E] ที่มีลักษณะนิสัย [GetTrait('sadistic').GetName( GetPlayer )] หรือ [GetTrait('ambitious').GetName( GetPlayer )] ต่อบัลลังก์ของท่าน...#!"
 reactive_advice_protect_against_factions:0 "$reactive_advice_protect_against_factions_step_1$"
 action_reactive_advice_protect_against_factions:0 "$open_tutorial_lesson$$reactive_advice_protect_against_factions_step_1$"
 action_reactive_advice_protect_against_factions_desc:0 "กลุ่มอิทธิพลเป็นสิ่งที่อันตรายหากปล่อยไว้โดยไม่ตรวจสอบ\nเปิดข้อความนี้เพื่อสรุปเรื่องกลุ่มอิทธิพล และวิธีจัดการที่ดีที่สุด!"
 action_reactive_advice_protect_against_factions_click:0 "$click_to_open_lesson$"
 reactive_advice_protect_against_factions_step_1:0 "การป้องกันกลุ่มอิทธิพล"
 reactive_advice_protect_against_factions_desc:1 "มี [faction|E] ก่อตัวขึ้นต่อต้านท่าน แต่อย่าตื่นตระหนก ท่านยังมีเวลาแก้ไขสถานการณ์!\n\n[vassals|E] และ [counties|E] เข้าร่วมกลุ่มอิทธิพลเมื่อพวกเขาไม่พอใจการปกครองของท่าน เพื่อต่อต้านสิ่งนี้ ท่านสามารถเพิ่ม [opinion|E] ของพวกเขาที่มีต่อท่าน หรือพยายาม ทำให้เป็นที่ [dreaded|E]\n\n#TUT เพื่อหลีกเลี่ยงกลุ่มอิทธิพล เราขอแนะนำให้ท่านเพิ่ม [opinion|E] ของข้าหลวงที่มีต่อท่าน ควบคุมจังหวะการพิชิตของท่าน และพยายาม [GetScheme('murder').GetTypeName] [claimants|E] ใด ๆ ที่ได้รับความนิยมมากกว่าท่าน\n\nท่านมักจะมีเวลาเอาใจข้าหลวงของท่านก่อนที่กลุ่มอิทธิพลจะยื่นข้อเรียกร้อง ใช้เวลานี้อย่างชาญฉลาด#!"
 reactive_advice_protect_against_factions_2_desc:0 "เคาน์ตีที่มี [county_opinion|E] ต่ำมักจะเข้าร่วม [peasant_faction|E] ซึ่งแตกต่างจากกลุ่มอิทธิพลอื่น ๆ กลุ่มอิทธิพลนี้จะลุกฮือขึ้นไม่ว่าพวกเขาจะมีโอกาสชนะหรือไม่ก็ตาม!\n\nบางครั้ง ท่านก็แค่ต้องสั่งสอนชาวนาให้อยู่ในที่ในทาง...\n\n#TUT ท่านควรจับตาดู Peasant Factions อยู่เสมอ หากพวกเขาโจมตีในขณะที่ท่านกำลังทำสงคราม พวกเขาสามารถสร้างความเสียหายอย่างมีนัยสำคัญต่อ [control|E] ของท่านได้#!"
 reactive_advice_protect_against_factions_step_2:0 "$reactive_advice_protect_against_factions_step_1$"
 reactive_advice_imprisoned:0 "$reactive_advice_imprisoned_step_1$"
 action_reactive_advice_imprisoned:0 "$open_tutorial_lesson$$reactive_advice_imprisoned_step_1$"
 action_reactive_advice_imprisoned_desc:0 "มีคนจองจำท่าน! นี่ไม่ใช่เรื่องดี...\nเปิดข้อความนี้เพื่อรับคำแนะนำเกี่ยวกับสิ่งที่จะเกิดขึ้น และสิ่งที่ท่านสามารถทำได้ หากถูกจองจำ"
 action_reactive_advice_imprisoned_click:0 "$click_to_open_lesson$"
 reactive_advice_imprisoned_step_1:0 "ท่านถูกจองจำ!"
 reactive_advice_imprisoned_desc:2 "ตัวละครของท่านถูกจับกุม และตอนนี้อยู่ในความเมตตาของผู้อื่น ท่านทำอะไรกับเรื่องนี้ได้ไม่มากนัก\n\nไปที่ตัวละครที่จับท่านเป็น [prisoner|E] และใช้ #TUT_KW 'Ransom Yourself'#! [interaction|E] หากท่านโชคดี ท่านจะสามารถจ่ายเงินเพื่ออิสรภาพได้! หากท่านโชคร้าย พวกเขาอาจเลือกที่จะ [execute|E] ท่าน\n\n#TUT หากท่านกำลังทำ [war|E] กับผู้ที่จองจำท่าน พวกเขาสามารถบังคับให้เกิด [victory|E] ได้ ไม่มีอะไรที่ท่านสามารถทำได้เกี่ยวกับเรื่องนี้ ยกเว้นแต่ต้องระมัดระวังมากขึ้นในอนาคต!\n\nหากท่านถูกจับขณะ [commanding|E] [army|E] อาจเป็นเพราะท่านมี [prowess_i][prowess|E] ต่ำ บางครั้งการลดความเสี่ยงนี้โดยไม่นำทัพด้วยตนเองก็เป็นความคิดที่ดี\n\nหากท่านถูกจับในการ [siege|E] นั่นเป็นเพราะศัตรู [occupied|E] [realm_capital|E] ของท่าน ท่านควรพยายามทำให้ศัตรูอยู่ห่างจากเมืองหลวงของท่านเสมอ!#!"
 reactive_advice_county_control:0 "$reactive_advice_county_control_step_1$"
 action_reactive_advice_county_control:0 "$open_tutorial_lesson$$reactive_advice_county_control_step_1$"
 action_reactive_advice_county_control_desc:1 "หาก [control|E] ต่ำใน [county|E] ท่านจะได้รับประโยชน์จากมันน้อยลง\nเปิดข้อความนี้เพื่อสรุปวิธีจัดการการควบคุมเคาน์ตีของท่าน!"
 action_reactive_advice_county_control_click:0 "$click_to_open_lesson$"
 reactive_advice_county_control_step_1:0 "การควบคุมเคาน์ตี"
 reactive_advice_county_control_desc:2 "หนึ่งใน [counties|E] ของท่านมี [control|E] ต่ำ ซึ่งหมายความว่าท่านจะได้รับ [taxes|E] และ [levies|E] จากดินแดนนั้นลดลง อย่างไรก็ตาม มีวิธีที่จะเพิ่มการควบคุมอีกครั้ง!\n\n#TUT มีหลายแห่งที่ท่านสามารถดูการควบคุมได้: ในแท็บดินแดนในมุมมองอาณาจักร ในมุมมองเคล็ดลับ และในมุมมองเคาน์ตี\n\nในการเพิ่มการควบคุม ท่านต้องไปที่มุมมองสภาของท่านและมอบหมายให้ [marshal|E] ของท่านทำภารกิจ [increase_control|E] การควบคุมยังเพิ่มขึ้นตามกาลเวลา แต่กระบวนการนี้เชื่องช้ามาก — เราขอแนะนำให้ท่านใช้จอมพลที่มีทักษะสูงแทน\n\nหากท่านปล่อยเคาน์ตีที่มีการควบคุมต่ำทิ้งไว้เป็นเวลานาน มันอาจเกิด [county_corruption|E] ได้ เพื่อหลีกเลี่ยงปัญหานี้ เราขอแนะนำไม่ให้ท่านพิชิตดินแดนมากเกินไปในคราวเดียว#!"
 reactive_advice_looming_game_over:0 "$reactive_advice_looming_game_over_step_1$"
 reactive_advice_looming_game_over_step_1:0 "การหลีกเลี่ยงเกมโอเวอร์"
 reactive_advice_looming_game_over_desc:5 "แย่แล้ว! ดูเหมือนว่าท่านจะไม่มี [player_heir|E] หากท่านสิ้นชีพตอนนี้ มันจะเป็น [game_over|E] มาพยายามหลีกเลี่ยงสิ่งนั้นกันเถอะ!\n\n#TUT หากท่านอยู่ในสถานการณ์นี้ น่าจะหมายความว่าท่านเป็นคนสุดท้ายของราชวงศ์ จากตรงนี้มีเพียงแนวทางเดียวที่ถูกต้อง คือการมีทายาทที่ [legitimate|E]!\n\nหากท่านอยู่ในสังคมที่อนุญาตให้เพียงเพศเดียวสืบทอดได้ ท่านสามารถลองเปลี่ยน [gender_law|E] ของท่านให้มีความเข้มงวดน้อยลง หากท่านมี [bastards|E] ใด ๆ ตอนนี้เป็นเวลาที่จะรับรองพวกเขา!\n\nนอกเหนือจากนั้น ตรวจสอบให้แน่ใจว่าท่าน [married|E] กับตัวละครที่มี [fertility|E] สูง (ตามกฎทั่วไป ผู้หญิงอายุเกิน 45 ปีมักไม่ค่อยมีบุตร) หากยังไม่ได้ผล ให้ [divorce|E] หรือพยายาม [GetScheme('murder').GetTypeName] [spouse|E] ของท่านและแต่งงานใหม่กับคนอื่น หรือลองใช้ [GetScheme('seduce').GetTypeName] [scheme|E] เพื่อให้มีบุตรนอกสมรส\n\nเวลาเป็นสิ่งสำคัญ อย่าเสี่ยงโดยไม่จำเป็น!#!"
 reactive_advice_bankruptcy:0 "$reactive_advice_bankruptcy_step_1$"
 action_reactive_advice_bankruptcy:0 "$open_tutorial_lesson$$reactive_advice_bankruptcy_step_1$"
 action_reactive_advice_bankruptcy_desc:0 "ท่านไม่มี [gold_i]ทองคำ ท่านเป็นหนี้!\nเปิดข้อความนี้เพื่อสรุปเรื่องหนี้สิน และวิธีหลุดพ้นจากมัน"
 action_reactive_advice_bankruptcy_click:0 "$click_to_open_lesson$"
 reactive_advice_bankruptcy_step_1:0 "หนี้สิน"
 reactive_advice_bankruptcy_desc:2 "ท่านหมด [gold_i][gold|E] แล้ว นี่เป็นเรื่องเลวร้ายมาก ท่านต้องลดค่าใช้จ่ายและพยายามเติมคลังสมบัติของท่านให้เร็วที่สุดเท่าที่จะทำได้!\n\n#TUT การเป็น [debt|E] ขัดขวางท่านจากการทำหลายสิ่งหลายอย่าง เช่น การประกาศ [wars|E] หรือการเสริมกำลัง [men_at_arms|E] และจะทำให้ท่านเกิด [county_corruption|E] อย่าปล่อยให้หนี้สินของท่านพอกพูนจนควบคุมไม่ได้!\n\nสิ่งที่ชัดเจนที่สุดที่ต้องทำคือยุติ [wars|E] ใด ๆ ที่ท่านอาจกำลังต่อสู้อยู่ เนื่องจากเมื่อท่านอยู่ในยามสงบ ท่านไม่ต้องจ่ายค่าบำรุงรักษา [armies|E] ของท่าน หากท่านกำลังสูญเสียทองคำจำนวนมาก ท่านอาจต้องการพิจารณายุบหน่วยทหารประจำการบางส่วน\n\nหาก [faith|E] ของท่านอนุญาต ท่านสามารถใช้ #TUT_KW $hof_ask_for_gold_interaction$#! [interaction|E] กับ [head_of_faith|E] ของท่าน หรือ #TUT_KW $borrow_from_holy_order_decision$#! Decision\n\nอาจเป็นความคิดที่ดีที่จะเปลี่ยนไปใช้ $stewardship_wealth_focus_short$ [focus|E] หากท่านยังไม่ได้ใช้#!"
 reactive_advice_rightful_liege:0 "$reactive_advice_rightful_liege_step_1$"
 action_reactive_advice_rightful_liege:0 "$open_tutorial_lesson$$reactive_advice_rightful_liege_step_1$"
 action_reactive_advice_rightful_liege_desc:0 "โครงสร้าง De Jure มีความสำคัญอย่างยิ่งต่อข้าหลวงของท่าน การไม่ได้เป็นเจ้านาย #emphasis โดยชอบธรรม#! ของพวกเขาสามารถส่งผลเสียต่อความสัมพันธ์ของท่านได้\nเปิดข้อความนี้เพื่อสรุปความหมายของการเป็นเจ้านายโดยชอบธรรม!"
 action_reactive_advice_rightful_liege_click:0 "$click_to_open_lesson$"
 reactive_advice_rightful_liege_step_1:0 "เจ้านายโดยชอบธรรม"
 reactive_advice_rightful_liege_step_2:0 "$reactive_advice_rightful_liege_step_1$"
 reactive_advice_rightful_liege_desc:1 "ท่านไม่ใช่ [rightful_liege|E] ของ [vassal|E] สิ่งนี้จะลด [opinion|E] ของพวกเขาที่มีต่อท่าน และ ทำให้พวกเขามอบ [taxes|E] และ [levies|E] ให้ท่านน้อยลง\n\nท่านควรพยายามเป็นเจ้านายโดยชอบธรรมของข้าหลวงทั้งหมดของท่าน!\n\n#TUT ในการทำเช่นนี้ ท่านต้องถือ [title|E] ที่อยู่เหนือพวกเขาก้าวหนึ่งใน [de_jure|E] ข้าหลวงระดับ [county|E] ต้องการอยู่ภายใต้ [duchy|E] โดยชอบธรรมของตน ตัวอย่างเช่น เคานต์แห่ง $c_madrid$ ต้องการอยู่ภายใต้ดยุกแห่ง $d_toledo$\n\nเป็นเรื่องปกติมากที่จะมีข้าหลวงบางคนที่ท่าน #emphasis ไม่ใช่#! เจ้านายโดยชอบธรรมของพวกเขา ท่านทำอะไรกับเรื่องนี้ได้ไม่มากนัก และมันเป็นเรื่องปกติอย่างสมบูรณ์! อย่างไรก็ตาม อย่าลืมใช้ #TUT_KW $grant_vassal_interaction$#! [interaction|E] เพื่อจัดระเบียบข้าหลวงของท่าน ท่านไม่สามารถถือทุกบรรดาศักดิ์ได้ด้วยตนเอง#!"
 reactive_advice_rightful_liege_2_desc:0 "เมื่อพิชิตดินแดนใหม่ ท่านมักจะได้รับข้าหลวงใหม่ ซึ่งท่านไม่ใช่เจ้านายโดยชอบธรรม การวางแผนการพิชิตของท่านอย่างเหมาะสมสามารถบรรเทาปัญหานี้ได้\n\n#TUT เพื่อหลีกเลี่ยงการมีข้าหลวงที่ไม่ชอบท่านมากเกินไป เราขอแนะนำให้ท่านพยายามมุ่งเน้นการพิชิตของท่านภายในพื้นที่ De Jure เดียวในแต่ละครั้ง ด้วยวิธีนี้ ท่านจะสามารถ #emphasis ในที่สุด#! กลายเป็นเจ้านายโดยชอบธรรมของพวกเขาได้ จดบันทึกเพื่อตรวจสอบว่าท่านสามารถ [create|E] บรรดาศักดิ์ใหม่ได้บ่อยครั้งหรือไม่!\n\nอย่าลืมใช้โหมดแผนที่ De Jure ทุกครั้งที่ท่านวางแผนการพิชิตของท่าน!#!"
 
 reactive_advice_bishop_endorsement:0 "$reactive_advice_bishop_endorsement_step_1$"
 action_reactive_advice_bishop_endorsement:0 "$open_tutorial_lesson$$reactive_advice_bishop_endorsement_step_1$"
 action_reactive_advice_bishop_endorsement_desc:0 "บิชอปของท่านไม่ได้รับรองท่าน!\nเปิดข้อความนี้เพื่อสรุปความหมายสำหรับท่าน และวิธีแก้ไข"
 action_reactive_advice_bishop_endorsement_click:0 "$click_to_open_lesson$"
 reactive_advice_bishop_endorsement_step_1:0 "การรับรองจากบิชอป"
 reactive_advice_bishop_endorsement_desc:3 "[faith|E] ของตัวละครของท่าน ทำให้ท่านมี [realm_priest|E] ใน [council|E] ของท่าน\n\nบิชอปเหล่านี้มีอำนาจมหาศาล และยินดีที่จะแบ่งปันอำนาจนั้นกับท่าน หากท่านยังคงเป็นที่โปรดปรานของพวกเขา...\n\n#TUT บิชอปของท่านมอบ [taxes|E] และ [levies|E] จาก [temple_holdings|E] ทั้งหมดใน [realm|E] ของท่าน และจำนวนที่พวกเขามอบให้ท่านขึ้นอยู่กับ [opinion|E] ของพวกเขาที่มีต่อท่าน\n\nการไม่เป็นที่ชื่นชอบหมายความว่าท่านจะไม่ได้รับอะไรเลย และบิชอปอาจทำให้ชีวิตท่านลำบากได้! ตัวอย่างเช่น พวกเขาสามารถบังคับให้ท่านหย่ากับ [spouse|E] ของท่าน...\n\nท่านควรพยายามอย่างเต็มที่เพื่อปรับปรุงความเห็นของพวกเขาที่มีต่อท่าน การใช้ #TUT_KW $gift_interaction$#! [interaction|E] หรือเริ่ม [GetScheme('sway').GetTypeName] [scheme|E] เป็นสองทางเลือกที่ดีที่ควรพิจารณา\n\nหากทุกอย่างล้มเหลว [GetScheme('murder').GetTypeName] ก็เป็นทางเลือกเสมอ... บางทีผู้สืบทอดตำแหน่งของพวกเขาอาจเป็นมิตรมากกว่า?#!"
 
 reactive_advice_encyclopedia:0 "$reactive_advice_encyclopedia_step_1$"
 action_reactive_advice_encyclopedia:0 "$open_tutorial_lesson$$reactive_advice_encyclopedia_step_1$"
 action_reactive_advice_encyclopedia_desc:0 "ต้องการเรียนรู้เพิ่มเติมเกี่ยวกับคำศัพท์บางคำในเกมหรือไม่? เปิดข้อความนี้เพื่อแนะนำสารานุกรม"
 action_reactive_advice_encyclopedia_click:0 "$click_to_open_lesson$"
 reactive_advice_encyclopedia_step_1:0 "สารานุกรม"
 reactive_advice_encyclopedia_desc:0 "Crusader Kings III มีแนวคิดและคำศัพท์มากมายที่ท่านสามารถเรียนรู้ได้ หากท่านสงสัยเกี่ยวกับแนวคิดในเกม ท่านสามารถเปิดสารานุกรมได้\n\nทำตาม UI ที่ไฮไลต์เพื่อดูวิธีการทำสิ่งนี้\n\n#TUT หมวดหมู่ 'บทเรียนสอนเล่น' ของสารานุกรมแสดงรายการส่วนต่าง ๆ ของบทช่วยสอน เผื่อท่านต้องการทบทวนความจำ #!"

 reactive_advice_religion:0 "$lesson_basics_religion_1$"
 action_reactive_advice_religion:0 "$open_tutorial_lesson$$lesson_basics_religion_1$"
 action_reactive_advice_religion_desc:0 "ต้องการเรียนรู้เพิ่มเติมเกี่ยวกับศรัทธาและศาสนาหรือไม่? เปิดข้อความนี้เพื่อแนะนำศาสนาของท่าน"
 action_reactive_advice_religion_click:0 "$click_to_open_lesson$"

 reactive_advice_dynamic_culture:0 "วัฒนธรรม"
 action_reactive_advice_dynamic_culture:0 "$open_tutorial_lesson$$reactive_advice_dynamic_culture$"
 action_reactive_advice_dynamic_culture_desc:0 "ต้องการเรียนรู้เพิ่มเติมเกี่ยวกับวัฒนธรรมหรือไม่? เปิดข้อความนี้เพื่อแนะนำวัฒนธรรม"
 action_reactive_advice_dynamic_culture_click:0 "$click_to_open_lesson$"

 reactive_advice_fabricate_claim:0 "$reactive_advice_fabricate_claim_step_1$"
 action_reactive_advice_fabricate_claim:0 "$open_tutorial_lesson$$reactive_advice_fabricate_claim_step_1$"
 action_reactive_advice_fabricate_claim_desc:0 "ท่านพบว่าตนเองไม่สามารถประกาศสงครามได้หรือไม่? ท่านสามารถสร้างสิทธิ์เรียกร้องได้!\nเปิดข้อความนี้เพื่อสรุปวิธีใช้สภาของท่านในการสร้างสิทธิ์เรียกร้อง"
 action_reactive_advice_fabricate_claim_click:0 "$click_to_open_lesson$"
 reactive_advice_fabricate_claim_step_1:0 "การสร้างสิทธิ์เรียกร้อง"
 reactive_advice_fabricate_claim_desc:1 "ท่านไม่สามารถประกาศสงครามได้หากไม่มี [casus_belli|E] แหล่งที่มาที่พบบ่อยที่สุดของ Casus Bellis คือ [claims|E] แต่บางครั้งก็ยากที่จะได้รับสิทธิ์เรียกร้องที่ท่านต้องการ\n\nนี่คือที่มาของ [fabricated_claims_short|E]!\n\n#TUT ท่านสามารถมอบหมายให้ [court_chaplain|E] ของท่านสร้างสิทธิ์เรียกร้องใน [county|E] ใด ๆ ที่อยู่ใกล้เคียง ซึ่งสามารถทำได้จากมุมมอง [council|E] ท่านสามารถสร้างสิทธิ์เรียกร้องได้ครั้งละหนึ่งสิทธิ์เท่านั้น และแต่ละสิทธิ์จะใช้เวลาในการดำเนินการ\n\nเครื่องมือนี้มีประโยชน์อย่างยิ่งเมื่อท่านเล่นเป็น [ruler|E] ขนาดเล็ก เนื่องจาก Casus Bellis จะหาได้ง่ายขึ้นเมื่อ [realm|E] ของท่านใหญ่ขึ้น\n\nเราขอแนะนำให้ท่านสร้างสิทธิ์เรียกร้องกับเพื่อนบ้านที่อยู่ติดกัน โดยเฉพาะอย่างยิ่งผู้ที่อ่อนแอกว่าท่าน! หากท่านเล่นเป็นเคานต์ ให้มุ่งเน้นไปที่การอ้างสิทธิ์ในบรรดาศักดิ์ภายใน [de_jure|E] [duchy|E] เดียวกันกับ [realm_capital|E] ของท่าน#!"
 
 reactive_advice_education:0 "$reactive_advice_education_step_1$"
 action_reactive_advice_education:0 "$open_tutorial_lesson$$reactive_advice_education_step_1$"
 action_reactive_advice_education_desc:1 "ทายาทของท่านจะไม่กลายเป็นผู้ปกครองที่ยิ่งใหญ่หากไม่ได้รับการศึกษา!\nเปิดข้อความนี้เพื่อสรุปเรื่องการอุปถัมภ์ และวิธีเตรียมทายาทของท่านให้พร้อมสำหรับอำนาจอย่างเหมาะสม"
 action_reactive_advice_education_click:0 "$click_to_open_lesson$"
 reactive_advice_education_step_1:0 "การศึกษา"
 reactive_advice_education_desc:4 "ดูเหมือนว่า [player_heir|E] ของท่านจะไม่มี [guardian|E]! หากไม่ได้รับการ [education|E] ที่เหมาะสม พวกเขาจะได้รับ [skills|E] ที่ไม่ดีและ [traits|E] แบบสุ่ม\n\n#TUT ใช้ #TUT_KW $educate_child_interaction$#! [interaction|E] กับทายาทของท่านและหาตัวละครที่เหมาะสมเพื่อเป็น [guardian|E] ของพวกเขา\n\nท่านต้องการหาตัวละครที่มีความรู้ในสาขาที่ท่านต้องการให้ [ward|E] ของพวกเขาเก่ง เราขอแนะนำให้ท่านมองหาผู้ปกครองที่มี [education_trait|E] ระดับสูง ( เช่น [GetTrait('education_martial_4').GetName( GetPlayer )]) หรือลักษณะนิสัย เช่น [GetTrait('intellect_good_1').GetName( GetPlayer )] หรือ [GetTrait('intellect_good_3').GetName( GetPlayer )] หากท่านไม่เต็มใจที่จะเสี่ยงให้คนอื่นหล่อหลอมบุคลิกภาพของบุตรหลาน ท่านสามารถให้การศึกษาแก่ทายาทของท่านด้วยตนเองได้!\n\nโดยทั่วไปแล้ว ท่านต้องการให้บุตรหลานทุกคนได้รับการศึกษาที่ดี แต่หากท่านมีบุตรหลานที่ไม่สนใจเป็นพิเศษ ( เช่น บุตรคนที่สี่หรือห้า) ท่านสามารถมอบหมายให้พวกเขาไปอยู่กับ [vassals|E] ของท่านเพื่อเพิ่ม [opinion|E] ได้เสมอ วิธีที่ง่ายที่สุดในการหาผู้สอนที่เป็นไปได้คือการใช้ #TUT_KW $offer_ward_interaction$#! Interaction โดยตรงกับข้าหลวง#!"
 reactive_advice_tooltip_modes:0 "$reactive_advice_tooltip_modes_step_1$"
 action_reactive_advice_tooltip_modes:0 "$open_tutorial_lesson$$reactive_advice_tooltip_modes_step_1$"
 action_reactive_advice_tooltip_modes_desc:1 "Crusader Kings III มีโหมดคำแนะนำเครื่องมือที่แตกต่างกัน!\nเปิดข้อความนี้เพื่อสรุปโหมดต่าง ๆ และค้นหาโหมดที่เหมาะกับสไตล์การเล่นของท่านมากที่สุด"
 action_reactive_advice_tooltip_modes_click:0 "$click_to_open_lesson$"
 reactive_advice_tooltip_modes_step_1:0 "โหมดคำแนะนำเครื่องมือ"
 reactive_advice_tooltip_modes_step_2:0 "โหมดคำแนะนำเครื่องมือขั้นสูง"
 reactive_advice_tooltip_modes_desc:1 "โหมดคำแนะนำเครื่องมือควบคุม #EMP วิธี#! ที่ท่านเข้าถึง [highlighted_text|E] และข้อมูลในคำแนะนำเครื่องมือ #weak (กล่าวอีกนัยหนึ่งคือ วิธีล็อกคำแนะนำเครื่องมือเพื่อให้ท่านสามารถเลื่อนเมาส์เข้าไปได้)#!.\n\nโหมดคำแนะนำเครื่องมือเริ่มต้นเรียกว่า #V ล็อกตามเวลา#! ด้วยโหมดนี้ คำแนะนำเครื่องมือจะล็อกอยู่กับที่หลังจากเวลาที่กำหนด ซึ่งระบุด้วยแถบความคืบหน้าขนาดเล็ก"
 reactive_advice_tooltip_modes_2_desc:0 "หากท่านเป็นผู้เล่นที่มีประสบการณ์ หรือเพียงแค่ไม่ต้องการให้คำแนะนำเครื่องมือของท่านล็อกโดยอัตโนมัติ เราขอแนะนำให้ลองใช้ #V ล็อกด้วยการกระทำ#! ด้วยโหมดนี้ ท่านกด #V ปุ่มเมาส์กลาง#! เพื่อล็อกคำแนะนำเครื่องมือ\n\n#I ท่านเปลี่ยนโหมดคำแนะนำเครื่องมือโดยไปที่ #V เมนูในเกม#! จากนั้นไปที่ #V การตั้งค่า#! จากนั้นส่วน #V เกม#! การตั้งค่า #V โหมดคำแนะนำเครื่องมือ#! อยู่ที่นั่น#!"

 action_perk_bonus_cap_modes:0 "ถึงโบนัสสูงสุดของความสามารถแล้ว"
 action_perk_bonus_cap_modes_desc:0 "ท่านได้รับโบนัสสูงสุดที่ความสามารถสามารถให้ได้แล้ว ความสามารถบางอย่าง เช่น [GetPerk('sound_foundations_perk').GetName(GetPlayer)] มีจำนวนคะแนนทักษะสูงสุดที่สามารถให้ได้"
 action_perk_bonus_cap_modes_click:0 "$click_to_open_lesson$"
 reactive_advice_perk_bonus_cap:0 "$action_perk_bonus_cap_modes$"
 reactive_advice_perk_bonus_cap_desc:0 "$action_perk_bonus_cap_modes_desc$ ในขณะที่เกินขีดจำกัด โบนัสจะไม่เพิ่มขึ้นอีก และจะไม่ลดลงจนกว่าท่านจะอยู่ต่ำกว่าขีดจำกัด"
 reactive_advice_perk_bonus_cap_step_1:0 "$action_perk_bonus_cap_modes$"

 action_reactive_advice_varangian_adventure:0 "$open_tutorial_lesson$$reactive_advice_varangian_adventure_step_1$"
 action_reactive_advice_varangian_adventure_desc:0 "ท่านสามารถเริ่มการผจญภัยวารังเจียนได้\nเปิดข้อความนี้เพื่อเรียนรู้เพิ่มเติมเกี่ยวกับสงครามประเภทพิเศษนี้"
 action_reactive_advice_varangian_adventure_click:0 "$click_to_open_lesson$"
 reactive_advice_varangian_adventure:0 "$game_concept_varangian_adventures$"
 reactive_advice_varangian_adventure_step_1:0 "$game_concept_varangian_adventures$"
 reactive_advice_varangian_adventure_desc:0 "ท่านสามารถประกาศ [varangian_adventure|E] ได้\n\nในช่วงระยะเวลาของ $culture_era_tribal$ [era|E] สงครามประเภทนี้มีให้ท่านใช้เพื่อเริ่มต้นชีวิตใหม่ในดินแดนอันห่างไกล ห่างจากชายฝั่งอันหนาวเหน็บของบ้านเกิดเมืองนอนของท่าน\n\n$game_concept_varangian_adventures$ ที่ประสบความสำเร็จไม่เพียง แต่จะย้ายอาณาจักรของท่านไปยังสถานที่ต่างแดนเท่านั้น แต่ยังจะทิ้งดินแดนที่มีอยู่ทั้งหมดของท่านให้เป็นอิสระ รวมถึงข้าหลวงของท่านด้วย\n\n[varangian_adventure|E] ครั้งแรกของท่านที่ดำเนินการในฐานะผู้ปกครอง $north_germanic_group$ จะเรียกกองกำลังเพิ่มเติมจากเคาน์ตีที่มี [faith|E] และ [culture|E] เดียวกันใน [GetGeographicalRegion('dlc_fp1_region_core_mainland_scandinavia').GetName] เพื่อช่วยท่านพิชิตบ้านใหม่ของท่าน"

# Court positions
 action_reactive_advice_court_positions:0 "$open_tutorial_lesson$$ra_court_pos_open_view$"
 action_reactive_advice_court_positions_desc:0 "เปิดข้อความนี้เพื่อแนะนำตำแหน่งในราชสำนัก"
 action_reactive_advice_court_positions_click:0 "$click_to_open_lesson$"
 reactive_advice_court_positions: "$ra_court_pos_open_view$"
 

 ra_court_pos_open_view:0 "ตำแหน่งในราชสำนัก"
 ra_court_pos_open_view_desc:0 "นี่เป็นเวลาที่ดีที่จะทบทวน [court_positions|E] เป็นตำแหน่งและเกียรติยศที่ท่านสามารถมอบให้กับ [courtiers|E] และ [vassals|E] ของท่านได้\n\nแต่ละตำแหน่งให้ประโยชน์แก่ท่าน โดยต้องเสียเงินเดือน ตัวอย่าง เช่น [GetCourtPositionType('court_physician_court_position').GetName()] จะช่วยให้ท่านและ [court|E] ของท่านมีสุขภาพดี"
 ra_court_pos_open_view_trigger:0 "เปิดแท็บตำแหน่งในราชสำนัก (ไฮไลต์)"
 ra_court_pos_appointing:0 "$ra_court_pos_open_view$"
 ra_court_pos_appointing_desc:1 "ท่านสามารถ แต่งตั้ง [court_positions|E] ใหม่ได้โดยคลิกที่รูปภาพว่างสำหรับตำแหน่งในราชสำนักที่ว่างอยู่ ตัวละครที่มี [aptitude|E] สูงสำหรับตำแหน่งนั้นจะให้โบนัสแก่ท่านมากขึ้น\n\n#TUT เมื่อท่านแต่งตั้งใครสักคนเข้าสู่ตำแหน่ง มันยังส่งผลต่อ [opinion|E] ของพวกเขาที่มีต่อท่านด้วย ด้วยเหตุนี้ อาจเป็นประโยชน์ที่จะแต่งตั้งคนที่ขาด $game_concept_aptitude$ เพียงเพื่อให้พวกเขาชอบท่านมากขึ้น#!"
 ra_court_pos_salary:0 "$ra_court_pos_open_view$"


# Inventory
 action_reactive_advice_artifact_inventory:0 "$open_tutorial_lesson$$ra_artifact_inventory_general$"
 action_reactive_advice_artifact_inventory_desc:0 "เปิดข้อความนี้เพื่อแนะนำสิ่งประดิษฐ์ในคลัง"
 action_reactive_advice_artifact_inventory_click:0 "$click_to_open_lesson$"
 reactive_advice_artifact_inventory: "$ra_artifact_inventory_general$"

 ra_artifact_inventory_general:0 "คลัง"
 ra_artifact_inventory_general_desc:0 "ท่านได้รับ [inventory_artifact|E] ชิ้นแรกของท่านแล้ว [artifacts|E] เหล่านี้พกติดตัวและให้ประโยชน์ต่าง ๆ"
 ra_artifact_inventory_open_step:0 "$ra_artifact_inventory_general$"
 ra_artifact_inventory_open_step_desc:0 "[inventory_artifacts|E] ถูกเก็บไว้ในคลังของท่าน มาเปิดดูกันเลย"
 ra_artifact_inventory_open_step_open:0 "เปิดคลัง (ไฮไลต์)"
 ra_artifact_inventory_welcome:0 "$ra_artifact_inventory_general$"
 ra_artifact_inventory_welcome_desc:0 "ในคลังของท่าน ท่านสามารถสวมใส่ [inventory_artifacts|E] เพื่อรับประโยชน์ต่าง ๆ เช่น การเพิ่ม [skill|E] บางอย่าง หรือเพิ่ม [prestige|E] ของท่าน\n\nท่านยังสามารถ [repair|E] หรือ [reforge|E] [inventory_artifacts|E] ซึ่งจะฟื้นฟู [durability|E] และป้องกันไม่ให้ถูกทำลายเมื่อเวลาผ่านไป\n\nท่านยังสามารถดูได้ว่าท่านมี [artifact_claims|E] ใดบ้าง และพยายามยึด [artifacts|E] เหล่านั้นมาเป็นของท่านเอง!"
 
 # Station Men-at-Arms
 ra_maa_stationing_open_card_step:0 "การประจำการทหารประจำการ"
 ra_maa_stationing_open_card_step_desc:0 "ท่านมี [men_at_arms|E] ที่ท่านยังไม่ได้ [stationed|E]\n\nการประจำการ [regiments|E] ของท่านจะ ทำให้พวกเขามีพลังมากขึ้นและเก่งในการต่อสู้ ซึ่งอาจมีความสำคัญอย่างยิ่งต่อการชนะ [battles|E]\n\nมาประจำการกองทหารกันเถอะ!"
 ra_maa_stationing_open_card_step_tt:0 "คลิกที่ทหารประจำการของท่านคนใดคนหนึ่งที่มีข้อความ '#X $MAA_UNSTATIONED$#!' (ไฮไลต์)"
 ra_maa_stationing_click_station_button:0 "$ra_maa_stationing_open_card_step$"
 ra_maa_stationing_click_station_button_desc:0 "ท่านสามารถประจำการ [regiment|E] หนึ่งกองของ [men_at_arms|E] ต่อ [holding|E] ใน [domain|E] ของท่าน\n\nที่ดินทั้งหมดใช้ได้กับกองทหารทุกประเภท แต่บางแห่งให้โบนัสมากกว่าที่อื่น\n\nมาเลือกที่ดินเพื่อประจำการกองทหารนี้กัน"
 ra_maa_stationing_click_station_button_tt:0 "คลิกปุ่ม 'เปลี่ยนที่ดินประจำการ' (ไฮไลต์)"
 ra_maa_stationing_select_station:0 "$ra_maa_stationing_open_card_step$"
 ra_maa_stationing_select_station_desc:0 "[holdings|E] ที่แตกต่างกันให้โบนัสในปริมาณที่แตกต่างกัน ขึ้นอยู่กับ [buildings|E] ที่ท่านเลือกสร้าง\n\nในมุมมองนี้ ท่านสามารถเห็นได้อย่างชัดเจนว่า [men_at_arms|E] [regiment|E] ของท่านจะดีขึ้นเท่าใดหากประจำการในที่ดิน\n\nคลิกที่ที่ดิน #P สีเขียว#! บนแผนที่ ซึ่งท่านคิดว่าให้โบนัสที่ดีที่สุดแก่กองทหารของท่าน"
 ra_maa_stationing_select_station_tt:0 "คลิกที่ที่ดิน #P สีเขียว#! ใด ๆ บนแผนที่"
 ra_maa_stationing_finished:0 "$ra_maa_stationing_open_card_step$"
 ra_maa_stationing_finished_desc:0 "กองทหาร [men_at_arms|E] [regiment|E] บัดนี้ได้ [stationed|E] แล้ว ท่านสามารถเห็นได้ว่ามันดีขึ้นเพียงใดใต้ภาพเหมือนของมัน (ส่วนที่เน้นสี)\n\nโปรดอย่าลืมตรวจสอบเป็นครั้งคราว เพื่อให้กองทหารของท่านประจำการอยู่ใน [holdings|E] ที่เหมาะสมที่สุด\n\nสิ่งนี้สำคัญอย่างยิ่งหากท่านพิชิตหรือสืบทอดดินแดนใหม่ หรือหากท่านตัดสินใจที่จะ ทำให้ที่ดินมีความเชี่ยวชาญเฉพาะด้านด้วย [buildings|E] เช่น [GetBuilding('smiths_01').GetName] หรือ [GetBuilding('stables_01').GetName]"
 reactive_advice_station_maa: "$ra_maa_stationing_open_card_step$"


# Tours
