 ra_laamp_contract_move_5: "สัญญาใหม่"
 ra_laamp_contract_move_5_desc: "ตอนนี้ท่านมาถึงแล้ว [task_contracts|E] ใหม่ ๆ หลายรายการจะพร้อมให้ท่านใช้งานในภูมิภาค!\n\nโปรดจำไว้ว่า ท่านอาจย้าย [camp|E] ของท่านได้ตลอดเวลาเพื่อหา [task_contracts|E] ใหม่ ๆ และโอกาสใหม่ ๆ จะเกิดขึ้นตราบใดที่ท่าน [travel|E] ไกลพอ อย่างน้อยสอง [de_jure|E] [duchies|E] ห่างจากที่ตั้งแคมป์เก่าของท่านเป็นกฎเกณฑ์ขั้นต่ำที่ดี"
 
