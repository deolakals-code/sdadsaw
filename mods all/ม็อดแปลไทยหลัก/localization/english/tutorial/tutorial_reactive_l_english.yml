 ra_admin_gov_troops_1: "การทหารในรัฐบาลบริหาร"
 ra_admin_gov_troops_1b: "การทหารในรัฐบาลบริหาร"
 ra_admin_gov_troops_1_desc: "@ra_admin_troops_1! ใน [administrative_government|e] การจัดการทหารและกองกำลังทำงานแตกต่างจากประเภท $game_concept_government$ อื่น ๆ\n\nในขณะที่ท่านยังคงสามารถเข้าถึงและควบคุมกองกำลังของท่านเองได้อย่างเต็มที่ ท่านยังสามารถเข้าถึง $TUTORIAL_PROVINCIAL_ARMIES$ ได้อีกด้วย ใน $game_concept_administrative_government$ แต่ละ [province|e] สามารถมี [army|e] ของตนเอง ซึ่งเป็นทรัพย์สินของ [title|e] นั้น ๆ โดยเฉพาะ\n\n[governors|e] รับบทบาทเป็นทั้งเจ้าหน้าที่พลเรือนและทหาร ในขณะที่ [top_liege|e] มีความสามารถในการจัดการกองกำลังของ $game_concept_governors$ โดยเข้าควบคุมพวกมันหรือมอบหมายให้ $game_concept_governors$ อื่น ๆ ทั่ว [realm|e]"
 ra_admin_gov_troops_1_prompt: "เปิดแท็บ $TUTORIAL_PROVINCIAL_ARMIES_NO_TOOLTIP$ (ไฮไลต์)"

 ra_admin_gov_troops_2: "การทหารในรัฐบาลบริหาร"
 ra_admin_gov_troops_2b: "การทหารในรัฐบาลบริหาร"
 ra_admin_gov_troops_2_desc: "[governors|e] สามารถสร้าง [men_at_arms|e] เป็นส่วนหนึ่งของ $game_concept_governorship$ ที่พวกเขารับผิดชอบ กองกำลังเหล่านี้เป็นของ [title|e] และสามารถยืมโดย $game_concept_governors$ อื่น ๆ ใน [realm|e] ได้\n\n[top_liege|e] มี $TUTORIAL_PROVINCIAL_ARMIES$ อยู่ในมือ และมีความสามารถในการจัดการกองกำลังของ $game_concept_governors$ พวกเขาสามารถเข้าควบคุมพวกมันใน [wars|e] ของตนเอง หรือมอบหมายใหม่ให้กับ $game_concept_governors$ ที่อาจต้องการ\n\nสิ่งนี้ ทำให้พวกเขามีความสามารถในการระดมพลและใช้พวกมัน ปรับปรุงการป้องกันตามแนวชายแดนของ $game_concept_realm$"
 ra_admin_gov_troops_2_prompt: "ตรวจสอบ [GetPlayer.Custom('GetProvincialArmyConceptNoTooltip')]"

 ra_admin_gov_troops_3: "การได้รับกองทัพเพิ่มเติม"
 ra_admin_gov_troops_3_desc: "ในฐานะ [governor|E] ท่านสามารถใช้อิทธิพล [influence|e] ของท่านเพื่อเรียกความช่วยเหลือจาก $game_concept_army$ จาก [province|e] อื่นได้\n\n[top_liege|e] สามารถบังคับ $game_concept_governor$ ใด ๆ ให้มอบหมาย $game_concept_army$ ของตนใหม่ หรือเข้าควบคุมเสียเองก็ได้"

 ra_admin_gov_troops_4: "ข้อมูลเฉพาะของกองทัพ"
 ra_admin_gov_troops_4_desc: "หากกองกำลังถูกระดมโดย [governor|e] ใน [war|e] [top_liege|e] จะไม่สามารถมอบหมายกองกำลังใหม่ได้จนกว่าพวกเขาจะถูกปลดประจำการ\n\nในกรณีที่มีการกบฏจาก $game_concept_governors$ ต่อ [liege|e] $game_concept_governor$ จะยึดกองกำลังใด ๆ ที่มาจาก [governorship|e] ของตนกลับคืนไป\n\nจงจับตาสถานการณ์ในอาณาจักรทั้งหมดเพื่อเพิ่มประสิทธิภาพการใช้งาน"

 ra_admin_gov_troops_5: "บนเส้นทางสู่อำนาจ"
 ra_admin_gov_troops_5_desc: "@ra_admin_troops_5! ในขณะที่ [administrative|e] [realm|e] ขับเคลื่อนด้วยการดำเนินการทางการเมืองและการวางอุบาย การมีกองทัพที่แข็งแกร่งและมีการจัดการที่ดีจะไม่เพียง แต่ปรับปรุงการป้องกันของท่านเท่านั้น แต่ยังช่วยในการแสวงหาทางการทูตของท่านอีกด้วย\n\nท้ายที่สุดแล้ว อำนาจทางทหารเป็นเพียงหนึ่งในหลายเส้นทางสู่อำนาจ..."
 
 action_reactive_advice_laamp_contract_move: "$open_tutorial_lesson$ การหาสัญญา"
 action_reactive_advice_laamp_contract_move_desc: "โอกาส [task_contract|E] ในท้องถิ่นของท่านขาดแคลนหรือไม่? เปิดข้อความนี้เพื่อแนะนำการหาสัญญาใหม่"
