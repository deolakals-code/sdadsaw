 reactive_advice_migration: "การอพยพ"

action_reactive_advice_migration: "คำแนะนำ: $reactive_advice_migration$"
action_reactive_advice_migration_desc: "ในฐานะชนเผ่าเร่ร่อนภายในทุ่งหญ้าสเตปป์อันยิ่งใหญ่ ท่านสามารถอพยพไปยังดินแดนใหม่ได้ เปิดเพื่อเรียนรู้เพิ่มเติมเกี่ยวกับการอพยพ"
action_reactive_advice_migration_click: "$click_to_open_lesson$"

 ra_migration_1: "$reactive_advice_migration$"
 ra_migration_1_desc: "เมื่อเล่นเป็น[nomad|E]ใน[the_great_steppe|E] ท่านมีความเป็นไปได้ที่จะ[migrate|E]\nการอพยพมีความสำคัญต่อชนเผ่าเร่ร่อน เนื่องจากเป็นหนทางอันยอดเยี่ยมในการค้นหาดินแดนใหม่ เพื่อให้[herd|E]ของท่านได้เล็มหญ้าและเติบโตขยายใหญ่\n\n[herd|E]เป็นตัวแทนของผู้คนและฝูงปศุสัตว์ของท่าน และ[herd|E]ของท่านต้องการดินแดนที่มี[county_fertility|E]ดี เพื่อให้มีอาหารเพียงพอ\nให้เรามาดูกันว่าจะค้นหาจุดที่ดีที่สุดในทุ่งสเตปป์ ซึ่งความอุดมสมบูรณ์จะเป็นประโยชน์ต่อท่านและ[realm|E]ของท่านได้อย่างไร"
 ra_migration_1_prompt: "คลิกที่ปุ่มการอพยพ (ที่เน้นสี)"

 ra_migration_1b: "$ra_migration_1$"

 ra_migration_2: "$reactive_advice_migration$"
 ra_migration_2_desc: "การเลือกที่ตั้งใหม่สำหรับท่านและ[herd|E]ของท่านควรจะขึ้นอยู่กับ[county_fertility|E]เป็นหลัก ความอุดมสมบูรณ์ของดินแดนวัดจากระดับ 0-100 และจะลดลงอย่างต่อเนื่องเมื่อท่านอาศัยอยู่ในดินแดนนั้น เมื่อมันหมดลง ท่านจำเป็นต้อง[migrate|E]ไปยังที่ตั้งใหม่เพื่อการเติบโตต่อไป"
 ra_migration_2_prompt: "คลิกที่ปุ่มโหมดแผนที่เพื่อดูโหมดแผนที่ความอุดมสมบูรณ์ (ที่เน้นสี)"

 ra_migration_3: "$reactive_advice_migration$"
 ra_migration_3_desc: "ระยะทางที่ท่านสามารถ[migrate|E]ได้นั้นขึ้นอยู่กับ[title_tiers|E]ของท่านและกฎหมาย[dominance|E]ที่ท่านบังคับใช้อยู่ในปัจจุบัน อาณาจักรที่มีเขตปกครองขนาดใหญ่และมี[dominance|E]สูงจะมีความต้องการจากการอพยพที่แตกต่างออกไป และในบางจุดอาจไม่จำเป็นต้องอพยพเลยเพื่อการขยาย[herd|E]ของท่าน หากต้องการเลือกสถานที่ที่ท่านอาจต้องการอพยพไป ให้คลิกที่ตำแหน่ง[de_jure|E]บนแผนที่"
 ra_migration_3_prompt: "คลิกที่สถานที่ใดก็ได้ภายในระยะบนแผนที่"

 ra_migration_4: "$reactive_advice_migration$"
 ra_migration_4_desc: "ขึ้นอยู่กับสถานที่ที่ท่านเลือก ท่านจะเห็นหมุดบนแผนที่บอกถึง[county_fertility|E]ที่เฉพาะเจาะจง หรือผลรวมของ[domain_fertility|E]ทั้งหมดของตำแหน่ง[de_jure|E]ที่เลือก"

 ra_migration_5: "$reactive_advice_migration$"
 ra_migration_5_desc: "สถานที่ที่ท่านเลือกสำหรับการ[migration|E]นั้นมักจะมี[nomad|E]หรือ[herder|E]อย่างน้อยหนึ่งรายที่คุณจะต้องเจรจาด้วยเพื่อขออนุญาตเข้าพื้นที่ ท่านสามารถเสนอ[herd|E], [gold|E]หรือใช้[hook|E]เพื่อช่วยโน้มน้าวให้พวกเขายอมรับข้อเสนอของท่านในการอพยพเข้าสู่พื้นที่ของพวกเขา"

 ra_migration_6: "$reactive_advice_migration$ (ยอมรับการเจรจา)"
 ra_migration_6_desc: "อาจมี[nomads|E]หลายกลุ่มในสถานที่เป้าหมายของท่าน หากท่าน[migrate|E]อย่างเป็นปรปักษ์ พวกเขาทั้งหมดจะตอบโต้ แต่หากท่านสามารถชักชวนตัวละครที่แข็งแกร่งที่สุดในพื้นที่ให้ยอมรับการย้ายถิ่นของท่านได้ พวกเขาทั้งหมดก็จะต้อนรับท่าน \n\n หากการเจรจาการอพยพเป็นผลสำเร็จ ท่านจะต้องละทิ้งตำแหน่งปัจจุบันของท่าน และอาจ รวมถึง[subjects|E]ของท่านด้วย"

 ra_migration_7: "$reactive_advice_migration$ (ปฏิเสธการเจรจา)"
 ra_migration_7_desc: "หาก[nomad|E]ที่มี[herd|E]ใหญ่ที่สุดในพื้นที่ไม่ยอมรับข้อเสนอของท่าน ท่านจะต้องประกาศ[war|E]ต่อพวกเขาและชนเผ่าเร่ร่อนอื่นๆ ทั้งหมดที่อาศัยอยู่ในสถานที่ที่เลือก ท่านสามารถดูความแข็งแกร่งของฝูงสัตว์ทั้งหมดที่แสดงในหน้าต่างสำหรับกรณีเหล่านี้ได้\n\nเช่นเดียวกับการเจรจาที่สำเร็จ การปฏิเสธข้อเสนอจะนำไปสู่การที่ท่านต้องละทิ้ง[title|E]ปัจจุบันของท่าน และอาจ รวมถึง[subjects|E]ของท่านด้วย ท่านจะถูกพิจารณาว่าเป็น[unlanded|E]ด้วย ซึ่งหมายความว่าท่านไม่มี[county_fertility|E]และ ดังนั้นฝูงสัตว์ของท่านจะไม่เติบโต\n\nจึงเป็นเรื่องสำคัญอย่างยิ่งที่จะต้องชนะสงคราม หรือหลังจากนั้นก็ค้นหาสถานที่อื่น เพื่อให้ท่านและฝูงปศุสัตว์ของท่านอพยพไป"

 ra_migration_8: "$reactive_advice_migration$"
 ra_migration_8_desc: "หากทุกอย่างเป็นไปด้วยดีกับการ[migration|E] ท่านจะมีดินแดนใหม่มากมายให้เล็มหญ้า มีความเป็นไปได้ใหม่ๆ ในการจัดการกับ[settlement_issue|E] ซึ่งเปิดโอกาสให้ท่านจัดการความขัดแย้งและเพิ่ม[county_control|E]ใน[domain|E]ใหม่\n\nดินแดนเปลี่ยนมือบ่อยครั้งใน[the_great_steppe|E] ดังนั้นจงรักษาสมดุลระหว่าง[dread|E]กับ[opinion|E]ของท่านให้ดีเพื่อเปิดทุกประตูไว้เสมอ การสูญเสียตำแหน่งหนึ่งสำหรับ[nomad|E]หมายถึงโอกาสสามเท่าที่จะคว้ามาได้ตราบใดที่ท่านยังคงขยาย[herd|E]และ[dominance|E]ของท่านต่อไป"

 # one small steppe for man...

 reactive_advice_great_steppe: "ทุ่งหญ้าสเตปป์อันยิ่งใหญ่"

 action_reactive_advice_great_steppe: "คำแนะนำ: $reactive_advice_great_steppe$"
 action_reactive_advice_great_steppe_desc: "ทุ่งหญ้าสเตปป์อันยิ่งใหญ่เป็นสถานการณ์ที่ท่านจะต้องคำนึงถึงความอุดมสมบูรณ์ของดินแดน เปิดเพื่อเรียนรู้เพิ่มเติมว่าสิ่งนี้ส่งผลกระทบต่ออะไรบ้าง"
 action_reactive_advice_great_steppe_click: "$click_to_open_lesson$"

 ra_great_steppe_1: "$reactive_advice_great_steppe$"
 ra_great_steppe_1_desc: "ยินดีต้อนรับสู่[the_great_steppe|E]!\n\nเมื่อเล่นเป็น[ruler|E]แบบ[GetGovernment( 'nomad_government' ).GetName] การ ทำให้แน่ใจว่า[herd|E]ของพวกเขาสามารถเติบโตได้คือข้อกังวลหลัก ฝูงสัตว์จะเติบโตได้ด้วยการมีดินแดนที่อุดมสมบูรณ์ให้เล็มหญ้า ดังนั้นท่านจึงจำเป็นต้องเดินทางไปรอบๆ เพื่อค้นหาทุ่งหญ้าที่อุดมสมบูรณ์ เพื่อให้ท่านและฝูงปศุสัตว์ของท่านเจริญรุ่งเรือง\n\nชนเผ่าเร่ร่อนปกครองในภูมิภาคทุ่งสเตปป์ ที่ ซึ่งท่านจะมีส่วนร่วมใน[situation|E] ทุ่งสเตปป์แบ่งออกเป็นสามภูมิภาค โดยเน้นไปที่[county_fertility|E]ของดินแดน"
 ra_great_steppe_1_prompt: "คลิกปุ่มสถานการณ์เพื่อดำเนินการต่อ (ที่เน้นสี)"

 ra_great_steppe_1b: "$reactive_advice_great_steppe$"

 ra_great_steppe_2: "$reactive_advice_great_steppe$"
 ra_great_steppe_2_desc: "แต่ละภูมิภาคทั้งสามจะได้รับผลกระทบจาก[steppe_season|E] ฤดูกาลเหล่านี้ไม่ใช่ฤดูหนาวหรือฤดูร้อนตามปกติ แต่เป็นผลกระทบระยะยาวต่อ[county_fertility|E]ของดินแดน\n\nผลกระทบเหล่านี้จะส่งผลต่อท่านอย่างไรและที่ไหนสามารถดูได้จากผลกระทบของฤดูกาล ตัวอย่าง เช่น การอาศัยอยู่ในภูมิภาคที่มีทุ่งหญ้าอุดมสมบูรณ์จะมีผลกระทบต่อความอุดมสมบูรณ์ เพื่อให้[herd|E]ของท่านได้เล็มหญ้า แต่มันก็จะส่งผลกระทบต่อความเห็นของผู้คนที่ติดตามท่านด้วย"

 ra_great_steppe_3: "$reactive_advice_great_steppe$"
 ra_great_steppe_3_desc: "เพื่อให้สามารถวางแผนล่วงหน้าได้ ท่านสามารถขอความช่วยเหลือจาก[GetCourtPositionType('court_astrologer_court_position').GetName()]ของท่านได้ นักดูดาวจะทำนายโอกาสของสองฤดูกาลที่จะเป็นฤดูถัดไปในภูมิภาค\n\nด้วยข้อมูลนี้ ท่านสามารถตัดสินใจได้ว่าการอยู่ในสถานที่เดิมนั้นดีที่สุดหรือควรพยายาม[migrate|E]ไปยังภูมิภาคข้างเคียง\n\nยิ่งท่านสามารถอยู่ในดินแดนที่อุดมสมบูรณ์ได้นานเท่าใด [herd|E]ของท่านก็จะยิ่งใหญ่ขึ้นและผู้คนของท่านก็จะมีความสุขมากขึ้นเท่านั้น"

 ra_great_steppe_4: "$reactive_advice_great_steppe$"
 ra_great_steppe_4_desc: "เพื่อให้เห็นภาพรวมว่า[nomads|E]อื่นๆ ใน[the_great_steppe|E]เป็นอย่างไรบ้าง ท่านสามารถดูได้ที่ด้านล่างของแผงควบคุม ชนเผ่าเร่ร่อนที่มี[herd|E]ใหญ่ที่สุดจะดำรงตำแหน่ง[gurkhan|E] โดยความแข็งแกร่งของฝูงสัตว์ของพวกเขาจะเป็นทั้งภัยคุกคามที่ใหญ่ที่สุดหรือพันธมิตรที่ยิ่งใหญ่ที่สุดที่ท่านสามารถพบได้ในทุ่งสเตปป์ หากท่านดำรงตำแหน่งนี้ ท่านยังมีโอกาสที่จะยกระดับ[dominance|E]ของท่าน (ในแผงอาณาจักร) สู่ระดับที่ห้าและเป็นระดับสุดท้ายคือ อำนาจครอบงำอันไร้ขีดจำกัด\n\nความแข็งแกร่งของฝูงสัตว์จะถูกใช้ระหว่างสงครามและการปล้นสะดม แต่อยู่ในรูปแบบของ[horde|E] [horde|E]คือส่วนหนึ่งของฝูงสัตว์ของท่านที่เหมาะสมกับการรบ ดังนั้นให้คิดเสียว่าเป็นม้า อูฐ และผู้คนของท่านที่สามารถถือคันธนูและลูกธนูได้ ในขณะที่ฝูงสัตว์ที่เหลือคือแกะ วัว และเด็ก เป็นต้น"

 ra_great_steppe_5: "$reactive_advice_great_steppe$"
 ra_great_steppe_5_desc: "หากต้องการดูภูมิภาคอื่น ท่านสามารถคลิกที่ภูมิภาคนั้นๆ ในมุมมองนี้ได้ แต่ภูมิภาคที่ส่งผลกระทบต่อท่านคือภูมิภาคที่ท่านอยู่ในปัจจุบัน \n\n บัดนี้ ท่านพร้อมที่จะนำฝูงปศุสัตว์ของท่านทั้งในยามอุดมสมบูรณ์และยามยากลำบากแล้วหรือยัง? การค้นหาดินแดนใหม่ผ่านทาง[war|E]หรือการ[migrating|E]เป็นทางเลือกเสมอสำหรับ[ruler|E]ผู้แข็งแกร่งแบบ[GetGovernment( 'nomad_government' ).GetName]เพื่อแสดงให้ผู้คนของท่านเห็นหนทางสู่ดินแดนอันอุดมสมบูรณ์ ดุจแอปเปิลทองคำแห่งทุ่งสเตปป์"


reactive_advice_kurultai: "สภาคุรุลไท"

action_reactive_advice_kurultai: "คำแนะนำ: $reactive_advice_kurultai$"
action_reactive_advice_kurultai_desc: "เปิดที่นี่เพื่อเรียนรู้เพิ่มเติมเกี่ยวกับสภาของชนเผ่าเร่ร่อน คุรุลไต"
action_reactive_advice_kurultai_click: "$click_to_open_lesson$"

 ra_kurultai_1: "$reactive_advice_kurultai$"
 ra_kurultai_1_desc: "ท่านมี[council|E]แบบ[kurultai|E]ในฐานะผู้ปกครองใน[the_great_steppe|E] \n\nท่านอาจคุ้นเคยกับการมีสภาอยู่แล้ว แต่เมื่อเล่นเป็น[nomad|E] ท่านจะมีผู้บริหารประเภทใหม่ที่จะมุ่งเน้นไปที่การสนับสนุนการเติบโตของ[county_fertility|E]หรือ[herd|E]ของท่านมากขึ้น"
 ra_kurultai_1_prompt: "คลิกที่แผงสภาเพื่อดำเนินการต่อ (ที่เน้นสี)"

 ra_kurultai_1b: "$ra_kurultai_1$"

 ra_kurultai_2: "$reactive_advice_kurultai$"
 ra_kurultai_2_desc: "ท่านสามารถมีสมาชิก[kurultai|E]ได้ 4 คนใน[council|E]ของท่าน ร่วมกับ[spouse|E]ของท่านและ[spymaster|E]หนึ่งคน คุรุลไตสามารถมีภารกิจต่างๆ ที่ผูกกับ[skills|E]หลากหลาย เช่น การจัดการความอุดมสมบูรณ์จะเป็นภารกิจหนึ่งที่อิงตาม[stewardship|E]ของคุรุลไตของท่าน หากท่านได้มอบหมายคุรุลไตแล้ว ท่านสามารถคลิกปุ่มที่มุมล่างซ้ายเพื่อสลับภารกิจออกได้"

 ra_kurultai_3: "$reactive_advice_kurultai$"
 ra_kurultai_3_desc: "[kurultai|E]จะทำงานตามภารกิจที่ได้รับมอบหมาย แต่ผลกระทบที่ใหญ่ที่สุดของพวกเขาจะอยู่ที่[succession|E]ของ[realm|E]ของท่าน\n\nตัวละคร แต่ละคนใน[the_great_steppe|E]สามารถ[obedient|E]ต่อ[ruler|E]คนหนึ่งได้ และการเชื่อฟังมีความสำคัญอย่างยิ่งโดยเฉพาะสำหรับสมาชิกคุรุลไตของท่านและคำพูดของพวกเขาว่าใครจะเป็น[heir|E]ของท่าน"
 ra_kurultai_3_prompt: "คลิกที่แท็บอาณาจักรเพื่อดำเนินการต่อ (ที่เน้นสี)"

 ra_kurultai_4: "$reactive_advice_kurultai$"
 ra_kurultai_4_desc: "ที่ด้านบนของแผงนี้ ท่านสามารถดูได้ว่า[succession|E]ของท่านถือว่ามั่นคงหรือวุ่นวาย นี่จะเป็นตัวบ่งชี้ว่า[heir|E]ของท่านจะสืบทอด[realm|E]ทั้งหมดของท่านหรือว่าจะถูกแบ่งแยกให้กับตัวละครอื่นที่ทรงพลังกว่า"
 ra_kurultai_4_prompt: "คลิกที่แท็บการสืบทอดเพื่อดำเนินการต่อ (ที่เน้นสี)"

 ra_kurultai_5: "$reactive_advice_kurultai$"
 ra_kurultai_5_desc: "ในแถบที่เน้นสี ท่านจะได้รับข้อบ่งชี้ว่า[kurultai|E]และบุตรคนโตสุดของท่านจะเห็นชอบกับ[succession|E]หรือคัดค้าน\n\nเพื่อให้การสืบทอดมั่นคง ท่านจำเป็นต้อง ทำให้คุรุลไต[obedient|E]ต่อท่าน แต่ท่านก็จำเป็นต้องให้[steppe_seasons|E]เป็นใจให้ท่านด้วย หากฤดูกาลปัจจุบันส่งผลกระทบต่อดินแดนของท่านในทางที่ไม่ดี เช่น ภัยซุด ผู้คนของท่านจะคิดว่าท่านกำลังถูกลงโทษและจะตั้งคำถามต่อการปกครองของท่านและการตัดสินใจว่าใครจะเป็นผู้สืบทอดตำแหน่งต่อจากท่าน \n\nเพื่อที่จะควบคุมการสืบทอดต่อไป จง ทำให้ผู้คนของท่านเชื่อฟังและ[migrate|E]ไปยังดินแดนที่เป็นประโยชน์ต่อท่าน"


