 ra_merit_governor_advancing: "$reactive_advice_meritocratic_governor$"
 ra_merit_governor_advancing_desc: "[governor|E] แต่ละคนจะปกครอง [province|E] ใน [title_tier|E] ที่แน่นอน\n\nจากต่ำสุดไปสูงสุด ได้แก่:\n$EFFECT_LIST_BULLET$$county_celestial_chinese_vassal$ #weak (บรรดาศักดิ์ [county|E])#!\n$EFFECT_LIST_BULLET$$duchy_celestial_chinese_vassal$ #weak (บรรดาศักดิ์ [duchy|E])#!\n$EFFECT_LIST_BULLET$$kingdom_celestial_chinese_vassal$ #weak (บรรดาศักดิ์ [kingdom|E])#!\n\nเพื่อที่จะก้าวหน้าในลำดับชั้นและไปถึง $game_concept_title_tier$ ที่สูงขึ้น ท่านต้องเพิ่ม [merit_level|E] ของท่านโดยการได้รับ [merit|E] และในที่สุดก็เกษียณอายุเพื่อสำเร็จ [imperial_examinations|E]"
