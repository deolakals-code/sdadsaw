 ra_army_auto_explain_desc: "ที่นี่ท่านสามารถตัดสินใจได้ว่า [armies|E] ของท่านควรทำงานอัตโนมัติหรือไม่ ท่านสามารถทำได้ตลอดเวลา แม้กระทั่งกลาง [war|E]\n\nท่านยังคงซื้อ [men_at_arms|E] จ้าง [mercenaries|E] และออก [raids|E] ด้วยตนเอง ท่านสามารถปรับ แต่งพฤติกรรมนี้ได้ที่นี่ โดยคลิกปุ่มการตั้งค่า $ARMY_AUTOMATION_FEATURE_NAME$"

