 ra_merit_governor_holding_view_desc: "นี่คือช่องที่สามารถสร้าง [buildings|E] ได้ใน [holding|E] ที่เลือก\n\nเนื่องจาก $game_concept_buildings$ เหล่านี้เป็นของ [province|E] ท่านจึงต้องจ่ายค่าก่อสร้างโดยใช้ [treasury|E] ไม่ใช่ [gold|E] ส่วนตัวของท่าน\n\nการสร้าง $game_concept_buildings$ ในฐานะ [governor|E] จะมอบ [merit|E] ให้แก่ท่าน ซึ่งในที่สุดจะช่วยให้ท่านสามารถปกครอง [provinces|E] ที่มี [title_tier|E] สูงขึ้นได้\n\n#I เชิญเริ่มการก่อสร้างก่อนที่เราจะไปต่อได้เลย#!"
