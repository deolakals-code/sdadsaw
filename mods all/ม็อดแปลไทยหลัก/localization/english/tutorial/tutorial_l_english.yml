 # Basics
 lesson_basics_welcome:1 "ยินดีต้อนรับสู่ Crusader Kings III"
 lesson_welcome_desc:3 "@tutorial_screenshot_1!\nท่านคือผู้ปกครองยุคกลาง! รัชสมัยของท่านอาจสั้น แต่ทายาทของท่านสามารถนำราชวงศ์ไปสู่ความโดดเด่นได้\n\nดินแดนรอให้ท่านยึดครอง ไม่ว่าจะด้วยคมดาบหรือการสมรส ในขณะที่การทูตอันชาญฉลาดสามารถขยายอิทธิพลของท่านไปไกลเกินกว่าความฝันอันสูงสุดของผู้พิชิตใด ๆ..."
 
 full_tutorial_explanation_desc: "\n#TUT 2 ชั่วโมง#!"
 quick_tutorial_explanation_desc: "\n#TUT 13 นาที#!"

 #Quick Tutorial
 lesson_basics_quick_camera: "กล้อง"
 lesson_basics_quick_camera_desc: "ใช้ปุ่ม W, A, S และ D เพื่อเลื่อนกล้องไปทั่วแผนที่\n\nท่านยังสามารถเลื่อนเคอร์เซอร์ไปที่ขอบหน้าจอเพื่อแพนกล้องได้\n\nการกดปุ่ม '#V Home#!' บนแป้นพิมพ์จะพาท่านกลับไปยังบ้านของท่านใน [GetPlayer.GetCapitalLocation.GetBaronyNameExplicitlyNoTooltip]"

 lesson_basics_quick_zoom: "การซูม"
 lesson_basics_quick_zoom_desc: "หากต้องการซูมเข้าและออกจากแผนที่ ให้ใช้วงล้อเลื่อนของเมาส์\n\nเมื่อซูมเข้าไปจนสุด ท่านจะเห็น $game_concept_detail_zoom$ ซูมออกมาเล็กน้อย ท่านจะเห็น $game_concept_political_zoom$ และสุดท้าย การซูมออกมาจนสุดจะแสดง $game_concept_paper_zoom$"

 lesson_basics_quick_nested_tooltips: "คำแนะนำเครื่องมือซ้อนกัน"
 lesson_basics_quick_nested_tooltips_desc: "$lesson_basics_tooltips_in_tooltips_desc$"
 lesson_basics_quick_nested_tooltips_hover_word: "$lesson_basics_tooltips_in_tooltips_hover_word$"
 lesson_basics_quick_nested_tooltips_hover_word_deeper: "$lesson_basics_tooltips_in_tooltips_hover_word_deeper$"

 lesson_basics_quick_nested_tooltips_complete: "$lesson_basics_quick_nested_tooltips$"
 lesson_basics_quick_nested_tooltips_complete_desc: "$lesson_basics_quick_nested_tooltips_desc$"


 lesson_basics_quick_characters: "ตัวละคร"
 lesson_basics_quick_characters_desc: "ท่านกำลังเล่นเป็น [GetPlayer.GetShortUINameNotMeNoTooltip] หนึ่งใน [characters|E] มากมายในโลกใบนี้ ซึ่งแสดงผ่านรูปแทนตัวละคร\n\nท่านคือ [ruler|E] ของ [realm|E] แบบศักดินา!"

 lesson_basics_quick_this_is_you_1: "นี่คือท่าน"
 lesson_basics_quick_this_is_you_1_desc: "นี่คือที่ที่ท่านจะเห็นตนเอง และ [family|e] ที่ใกล้ชิดที่สุด\n\nทางด้านขวา ท่านจะเห็น [heir|e] ของท่าน ผู้ ซึ่งถูกกำหนดให้สืบทอด $game_concept_realm$ ของท่านต่อหลังจากที่ท่านจากไป\n\n#TUT หากท่านหลงทางในแผนที่ ท่านสามารถคลิกที่ตัวละครของท่านเพื่อจัดกล้องให้อยู่กึ่งกลาง [realm|e] ของท่านอีกครั้ง#!"
 
 lesson_basics_quick_this_is_you_2: "คู่สมรสของท่าน"
 lesson_basics_quick_this_is_you_2_desc: "การมี [spouse|E] ถือเป็นความคิดที่ดี พวกเขาจะช่วยท่านในการปกครอง [realm|e] และช่วยให้ท่านมั่นใจได้ถึงอนาคตของ [dynasty|e] ของท่าน\n\nในตอนนี้ ท่านยังไม่ได้สมรส เรามาทำอะไรสักอย่างเกี่ยวกับเรื่องนี้กันดีหรือไม่"
 lesson_basics_quick_find_spouse_tt: "ทำการสมรส"

 lesson_basics_quick_marriage_window: "$lesson_basics_quick_this_is_you_2$"
 lesson_basics_quick_marriage_window_desc: "การค้นหา [spouse|E] ที่เหมาะสมนั้นไม่ใช่เรื่องง่าย แต่มีบางสิ่งที่ควรคำนึงถึง:\n\n$EFFECT_LIST_BULLET$การเมือง: [marriages|E] คือหนทางหลักในการสร้าง [alliance|E]\n$EFFECT_LIST_BULLET$ความสามารถ: [skills|E] ของนางจะถูกเพิ่มเข้ามาให้ท่าน\n$EFFECT_LIST_BULLET$พันธุกรรม: [congenital_traits|E] เช่น [GetTrait('intellect_good_2').GetName( GetNullCharacter )] อาจถูกสืบทอดไปยัง [children|E] ของท่าน\n$EFFECT_LIST_BULLET$ชนชั้น: การสมรสกับ [lowborn|E] จะ ทำให้ท่านสูญเสีย [prestige|E]"

 lesson_basics_quick_married_great_job: "คู่สมรสของท่าน"
 lesson_basics_quick_married_great_job_desc: "ขอแสดงความยินดีกับการสมรส! การรวมกันระหว่างท่านและ [spouse|e] ของท่านได้สร้าง [alliance|e] ระหว่างท่านกับ [ruler|e] ของ [realm|e] ที่ $game_concept_spouse$ ของท่านมาจาก ซึ่งหมายความว่าท่านสามารถเรียกหากันและกันเพื่อเข้าร่วม [wars|e] ได้!\n\n#TUT หากไม่มีสมาชิกที่ยังมีชีวิตอยู่คนอื่น ๆ ใน [dynasty|e] ของท่านเหลืออยู่หลังจากตัวละครของท่านเสียชีวิต ท่านจะแพ้เกม การมี $game_concept_spouse$ สามารถช่วยท่านป้องกันสิ่งนี้ได้#!"

 lesson_basics_quick_this_is_you_3: "ลักษณะนิสัย"
 lesson_basics_quick_this_is_you_3_desc: "ต่อไป มาดู [traits|e] ของตัวละครของท่านกัน! อย่างที่ท่านเห็น เขาเป็น @temperate_icon_tutorial! [GetTrait('temperate').GetName( GetNullCharacter )], @gregarious_icon_tutorial! [GetTrait('gregarious').GetName( GetNullCharacter )] และ @impatient_icon_tutorial! [GetTrait('impatient').GetName( GetNullCharacter )]\n\n#TUT $game_concept_traits$ ส่งผลต่อวิธีที่ตัวละครของท่านตอบสนองต่อเหตุการณ์ในโลกของเกม ท่านยังสามารถได้รับลักษณะใหม่ ๆ ในขณะที่เล่นได้#!"

 lesson_basics_quick_skills: "ทักษะ"
 lesson_basics_quick_skills_desc: "ตัวละครยังมี [skills|e] ด้วย! เรามาดูกัน\n\n$game_concept_skills$ หลักห้าประการที่กำหนดความสามารถของตัวละครท่านคือ [diplomacy_i|e][diplomacy|e], [martial_i|e][martial|e], [stewardship_i|e][stewardship|e], [intrigue_i|e][intrigue|e] และ [learning_i|e][learning|e]\n\n#TUT $game_concept_skills$ สามารถเปลี่ยนแปลงได้ตลอดในระหว่างเกมขึ้นอยู่กับการกระทำของท่าน#!"

 lesson_basics_quick_your_domain_1: "เขตปกครองส่วนตัวของท่าน"
 lesson_basics_quick_your_domain_desc_1: "@tutorial_screenshot_2! ต่อไป มาดู [domain|e] ของท่าน ซึ่งประกอบด้วยที่ดินทั้งหมดที่ท่านเป็นเจ้าของเป็นการส่วนตัว ภาพรวมของ $game_concept_domain$ ของท่านจะแสดงในส่วนที่เน้นสี"
 
 lesson_basics_quick_your_domain_2: "ตราอาร์มของท่าน"
 lesson_basics_quick_your_domain_desc_2: "นี่คือตราอาร์มของ [GetPlayer.GetPrimaryTitle.GetName] ใช้เพื่อแสดง [realm|e] ของท่านในสถานที่ต่าง ๆ ตัวอย่าง เช่น ท่านสามารถเห็นมันลอยอยู่เหนือ [capital|e] ของท่าน $cn_luimneach$\n\n#TUT เห็นมงกุฎเล็ก ๆ เหนือตราอาร์มของท่านหรือไม่? นั่นแสดงถึง [title_tier|e] ของมัน เมื่อ $game_concept_title_tiers$ ก้าวหน้าในยศ มงกุฎบนตราอาร์มที่เกี่ยวข้องจะหรูหรามากขึ้น!#!"

 lesson_basics_quick_your_domain_3: "ตำแหน่งของท่าน"
 lesson_basics_quick_your_domain_desc_3: "ปัจจุบันท่านดำรง [titles|e] ทั้งหมดสามตำแหน่ง ซึ่งทั้งหมดแสดงถึงดินแดนบนแผนที่ $game_concept_title$ หลักและสำคัญที่สุดของท่านคือตำแหน่งซ้ายสุด มันกำหนดชื่อ [realm|e] ของท่าน ท่านยังครอบครอง $game_concept_titles$ $c_thomond$ และ $c_ennis$ ด้วย\n\n#TUT การวางเมาส์เหนือ $game_concept_titles$ ในแผงตัวละครของท่านจะแสดงให้เห็นว่าดินแดนใดที่พวกมันเป็นตัวแทนบนแผนที่#!"
 
 lesson_basics_quick_relationships: "ตัวละครอื่น ๆ"
 lesson_basics_quick_relationships_desc: "@tutorial_screenshot_3!\nในส่วนนี้ ท่านสามารถเห็น [characters|e] อื่น ๆ ที่หลากหลาย ซึ่งท่านมีความเชื่อมโยงด้วย ซึ่ง รวมถึง [family|e] ของท่าน ทุกคนที่ท่านมี [relationship|e] ด้วย [courtiers|e] ของท่าน และ [subjects|e] ของท่าน"


 lesson_basics_quick_realm: "อาณาจักร"
 lesson_basics_quick_realm_desc: "มาดูแถบทางด้านขวาของหน้าจอกัน มีปุ่มอยู่สองสามปุ่มที่นี่ แต่เริ่มต้น เราสนใจที่จะดู [realm|e] ของท่าน"

 
 lesson_basics_quick_realm_great_job: "เคาน์ตีและที่ดินถือครอง"
 lesson_basics_quick_realm_great_job_desc: "จำ [titles|e] ที่เราเห็นก่อนหน้านี้ได้หรือไม่? ในมุมมองนี้ ท่านสามารถตรวจสอบที่ดินที่พวกมันเป็นตัวแทนได้อย่างละเอียดมากขึ้น พวกมันคือ [counties|e] แต่มีชื่อที่แตกต่างและไม่เหมือนใคร เนื่องจาก [culture|e] ไอริชของท่าน\n\n$game_concept_counties$ (หรือในกรณีของท่านคือ Earldoms) ประกอบด้วยที่ดินผืนเล็ก ๆ ที่เรียกว่า [holdings|e] $game_concept_holding$ สามารถรองรับ [buildings|e] ได้หลายหลัง ซึ่งให้ประโยชน์ต่าง ๆ"

 lesson_basics_quick_vassals: "ข้าหลวง"
 lesson_basics_quick_vassals_desc: "สังเกตว่า $c_ormond$ รวมอยู่ในโครงร่างของ [realm|e] ของท่านบนแผนที่ แม้ว่าจะไม่ปรากฏในมุมมอง [domain|e] หรือไม่? เพื่ออธิบายว่าทำไมถึงเป็น เช่นนั้น เราจะต้องดู [vassals|e] ของท่าน"

 lesson_basics_quick_vassals_2: "ข้าหลวง"

 lesson_basics_quick_council_1: "สภา"
 lesson_basics_quick_council_1_desc: "โชคดีที่ท่านไม่ต้องจัดการ [realm|e] ทั้งหมดด้วยตัวเอง มาดู [council|e] ของท่าน ซึ่งเป็นอีกมุมมองหนึ่งที่เข้าถึงได้ในแถบทางด้านขวา"

 lesson_basics_quick_council_2: "สภา"
 lesson_basics_quick_council_2_desc:0 "@tutorial_screenshot_4! นี่คือ [council|e] ของท่าน ซึ่งประกอบด้วย [councillors|e] หกคน รวมถึง [spouse|e] ของท่านด้วย พวกเขาสามารถทำได้ เช่น $task_collect_taxes$ หรือ $task_find_secrets$ ผ่าน [councillor_tasks|e]"

 lesson_basics_quick_council_3: "ภารกิจของสมาชิกสภา"
 lesson_basics_quick_council_3_desc: "ลองใช้ [councillor_task|e] ดูสิ! จะไม่ดีหรือถ้าท่านมี [county|e] อีกแห่งภายใน [realm|e] ของท่าน? เพื่อให้บรรลุเป้าหมายนั้น ท่านจะต้องมี [claim|e] ท่านสามารถให้ [realm_priest|e] ของท่านสร้างขึ้นมาได้"
 
 lesson_basics_council_fabricate_claim_tt: "สร้าง $game_concept_claim$ ใน $game_concept_county$ นอกพรมแดนของท่าน"

 lesson_basics_quick_vassals_great_job: "ข้าหลวง"
 lesson_basics_quick_vassals_great_job_desc: "@tutorial_screenshot_5! นี่คือ [vassal|e] ซึ่งเป็น [ruler|e] อีกคนหนึ่งที่ช่วยในการบริหาร [realm|e] ของท่านโดยปกครอง [county|e] นอก [domain|e] ของท่าน\n\nในฐานะ [liege|e] ของ $game_concept_vassal$ ท่านจะได้รับการชำระเงินในรูปแบบของ $game_concept_taxes$ (@gold_icon![gold|e]) และ @soldier_icon! [levies|e]"

 lesson_basics_quick_vassals_great_job_2: "เขตปกครองส่วนตัวและอาณาจักร"
 lesson_basics_quick_vassals_great_job_2_desc: "มีความแตกต่างที่สำคัญระหว่าง [domain|e] และ [realm|e] ของท่าน $game_concept_domain$ ของท่านคือที่ดินที่ท่านถือครองเป็นการส่วนตัว ในขณะที่ $game_concept_realm$ ของท่านยัง รวมถึงที่ดินทั้งหมดที่ [vassals|e] ของท่านถือครองด้วย\n\n#TUT [domain_limit|e] ของท่านขัดขวางอย่างยิ่งไม่ให้ท่านถือครอง [titles|e] จำนวนไม่จำกัดด้วยตนเอง ซึ่งหมายความว่าท่านจะต้องพึ่งพา $game_concept_vassals$ เพื่อขยายพรมแดนของท่านต่อไป#!"

 lesson_basics_quick_holdings: "ที่ดินถือครอง"
 lesson_basics_quick_holdings_desc: "ปัจจุบัน [domain|E] ของท่านประกอบด้วย [counties|E] (เรียกว่า 'Earldoms' เนื่องจาก [culture|E] ไอริชของท่าน) ของ $c_thomond$ และ $c_ennis$ เนื่องจาก $c_ormond$ ถูกถือครองโดย [vassal|e] ของท่าน จึงไม่เป็นส่วนหนึ่งของ $game_concept_domain$ ของท่าน\n\n[counties|E] เหล่านี้ประกอบด้วยที่ดินผืนเล็ก ๆ — [baronies|E] ซึ่งเป็น [holdings|E] แต่ละแห่งของ [realm|E]\n\n#TUT ที่ดินถือครองแสดงถึงการตั้งถิ่นฐานในดินแดนของท่าน!#!"

 lesson_basics_quick_resources_1: "ทรัพยากร"
 lesson_basics_quick_resources_1_desc: "ทำได้ดีมาก! [councillor|e] ของท่านกำลังดำเนินการ เพื่อให้ท่านได้ [claim|e]\n\nต่อไป มาดูแถบที่มุมบนขวาของหน้าจอกัน ที่นี่ ท่านจะพบทรัพยากรจำนวนหนึ่ง ซึ่งสามารถใช้เพื่อโต้ตอบกับโลกในรูปแบบต่าง ๆ ได้"

 lesson_basics_quick_resources_gold: "@gold_icon! $game_concept_gold$"
 lesson_basics_quick_resources_gold_desc: "[gold_i|e] [gold|e] เป็นตัววัดความมั่งคั่งของท่าน และสามารถใช้จ่ายสำหรับสิ่งต่าง ๆ ได้หลายอย่าง รวมถึงอาคาร กองทัพ และสินบน\n\nโดยทั่วไปแล้ว การมี [skill|e] [stewardship_i|e][stewardship|e] ที่ดีจะช่วยท่านในความพยายามในการสร้าง $game_concept_gold$"

 lesson_basics_quick_resources_prestige: "@prestige_icon! $game_concept_prestige$"
 lesson_basics_quick_resources_prestige_desc: "[prestige_i|e] [prestige|e] แสดงถึงอิทธิพลทางสังคมและการเมืองของท่าน เมื่อท่านได้รับ $game_concept_prestige$ ท่านจะเพิ่ม [prestige_level|e] ของท่านด้วย\n\nในฐานะทรัพยากร $game_concept_prestige$ สามารถใช้เพื่อตัดสินใจทางโลกภายใน [realm|e] ของท่านได้ [diplomacy_i|e][diplomacy|e] ที่สูงจะช่วยให้ท่านได้รับ $game_concept_prestige$ มากขึ้น"

 lesson_basics_quick_resources_piety: "[piety_i|e] $game_concept_piety$"
 lesson_basics_quick_resources_piety_desc: "[piety_i|e] [piety|e] เป็นทรัพยากรที่สะท้อนว่าตัวละครของท่านมีคุณธรรมเพียงใด สามารถใช้เพื่อโต้ตอบกับ [faith|e] ของท่านในรูปแบบต่าง ๆ เช่น การประกาศ [holy_wars|e]\n\n[piety_level|e] ของท่านยังเพิ่มขึ้นตาม $game_concept_piety$ ที่สะสมไว้ การมุ่งเน้นไปที่ [learning_i|e][learning|e] อาจเป็นความคิดที่ดีสำหรับตัวละครที่ศรัทธาเป็นพิเศษ"

 lesson_basics_quick_resources_renown: "@dynasty_prestige_icon! $game_concept_dynasty_prestige$"
 lesson_basics_quick_resources_renown_desc: "[dynasty_prestige_i|e] [dynasty_prestige|e] แสดงถึงอิทธิพลของ [dynasty|e] ของท่าน และสามารถใช้ในการตัดสินใจที่จะกำหนดอนาคตของครอบครัวท่านได้\n\n$game_concept_dynasty_prestige$ เชื่อมโยงกับ [dynasty_prestige_level|e] ของท่าน ซึ่งเป็นตัววัดโดยรวมว่า $game_concept_dynasty$ ของท่านมีชื่อเสียงเพียงใด"

 lesson_basics_quick_resources_time: "เวลา"
 lesson_basics_quick_resources_time_desc: "ตอนนี้เราพูดถึงทรัพยากรเสร็จแล้ว มาสรุปด้วยคำแนะนำสุดท้ายกัน ตอนนี้เกมหยุดชั่วคราว ท่านสามารถควบคุมความเร็วของเวลาที่ดำเนินไปในโลกได้ที่มุมล่างขวา\n\n#TUT Crusader Kings III เป็นเกมที่ดำเนินไปเป็นเวลาหลายร้อยปี ดังนั้นอย่าลังเลที่จะใช้เวลาของท่าน#!"

 lesson_basics_quick_unpause_tt: "ยกเลิกการหยุดเกมชั่วคราวโดยกด Spacebar หรือคลิกปุ่มที่มุมล่างขวา"

 lesson_basics_quick_done: "ขอให้โชคดี!"
 lesson_basics_quick_done_desc: "ขอแสดงความยินดีที่สำเร็จบทช่วยสอนฉบับย่อ! ตอนนี้เกมได้ยกเลิกการหยุดชั่วคราวแล้ว และเวลากำลังดำเนินไป จากจุดนี้ไป ขึ้นอยู่กับท่านที่จะกำหนดอนาคตของตระกูล [GetPlayer.GetHouse.GetName]\n\n#TUT ท่านมีอิสระที่จะทำอะไรก็ได้ที่ท่านต้องการ แต่คอยสังเกต @reactive_advice_icon! คำแนะนำเชิงโต้ตอบ ที่ปรากฏที่ด้านบนของหน้าจอ\n\nใครจะรู้ บางทีท่านอาจจะได้เป็นกษัตริย์แห่งไอร์แลนด์ก็ได้?#!"

 
 #Camera & Map
 lesson_basics_camera:0 "กล้อง ($lesson_basics$)"
 lesson_basics_camera_desc:1 "ใช้ปุ่ม W, A, S และ D เพื่อเลื่อนกล้องไปทั่วแผนที่ ท่านยังสามารถเลื่อนเคอร์เซอร์ไปที่ขอบหน้าจอเพื่อแพนกล้องได้ การกดปุ่ม 'Home' จะนำท่านไปยัง [realm_capital|E] ของท่าน\n\nหากต้องการซูมเข้าและออกบนแผนที่ ให้ใช้ Scroll Wheel\n\n#TUT ข้อมูลที่แตกต่างกันจะแสดงในระดับการซูมที่แตกต่างกัน: [detail_zoom|E], [political_zoom|E] และ [paper_zoom|E]\n\nเมื่อซูมเข้า ท่านจะสามารถเลือกและจัดการ [holdings|E] ของท่านได้ การซูมออกจะให้ภาพรวมของ [realms|E] ทั้งหมด#!"
 lesson_basics_paused_intro:0 "การหยุดชั่วคราว ($lesson_basics$)"
 lesson_basics_paused_intro_desc:1 "Crusader Kings III ครอบคลุมเวลาหลายร้อยปีและหลายชั่วอายุคน ตอนนี้ เวลากำลังหยุดนิ่ง เพราะเกม #EMP หยุดชั่วคราว#! อยู่\n\n#TUT สำหรับส่วนนี้ของบทช่วยสอน เราจะให้เกมหยุดชั่วคราวในขณะที่เราแนะนำแนวคิดบางอย่างของเกมให้ท่าน#!"


 lesson_basics_tooltips_in_tooltips: "คำแนะนำเครื่องมือซ้อนกัน ($lesson_basics$)"
 lesson_basics_tooltips_in_tooltips_desc: "คำสำคัญจะถูกทำเครื่องหมายด้วย [highlighted_text|E] สีน้ำเงิน ซึ่งหมายความว่าท่านสามารถวางเคอร์เซอร์เหนือคำเหล่านั้นเพื่อเปิดคำแนะนำเครื่องมือที่ให้ข้อมูลได้\n\nคำแนะนำเครื่องมือเหล่านี้อาจมีคำสำคัญที่เน้นสีอยู่ด้วย ซึ่งสามารถวางเมาส์เหนือได้ เช่นกัน\n\nต้องใช้เวลา #bold สองสามวินาที#! เพื่อให้คำแนะนำเครื่องมือ 'ล็อก' ตำแหน่งสำหรับการวางเมาส์ซ้อน"
 lesson_basics_tooltips_in_tooltips_hover_word:0 "วางเคอร์เซอร์ของท่านเหนือ [highlighted_text|E] นี้"
 lesson_basics_tooltips_in_tooltips_hover_word_deeper: "วางเมาส์เหนือคำว่า 'ยอดเยี่ยม' ภายในคำแนะนำเครื่องมือที่เปิดขึ้น"
 lesson_basics_tooltips_in_tooltips_complete:0 "$lesson_basics_tooltips_in_tooltips$"
 lesson_basics_tooltips_in_tooltips_complete_desc:0 "$lesson_basics_tooltips_in_tooltips_desc$"


 lesson_basics_web_of_titles:0 "ผู้ปกครองดินแดน ($lesson_basics_map$)"
 lesson_basics_web_of_titles_desc:2 "ตอนนี้ มาพูดถึง #EMP เกม#! กัน ทุกอย่างเกิดขึ้นบนแผนที่ตรงหน้าท่าน โลกประกอบด้วยดินแดนขนาดใหญ่และเล็ก — [titles|E] ที่ดิน ซึ่งถือครองโดย [rulers|E] ต่าง ๆ\n\n#TUT $game_concept_titles$ แสดงด้วยตราอาร์มที่ประณีต ซึ่งแสดงเป็นไอคอนบนแผนที่\n\nไอคอนที่แสดงถึง [realm|E] ของท่านคือไอคอนของ [primary_title|E] ของท่าน ซึ่งเป็น $game_concept_title$ ที่สำคัญและมีเกียรติที่สุดที่ท่านถือครอง#!"
 #\n\n@coa_icon!"
 lesson_basics_realm:0 "พรมแดน ($lesson_basics_map$)"
 lesson_basics_realm_desc:3 "หากท่านวางเมาส์เหนือภาพตัวละครของท่าน ตราอาร์มเหนือ [realm_capital|E] ของท่าน ($cn_luimneach$) จะเรืองแสงและ [realm|E] ทั้งหมดของท่านจะถูกเน้นสี Munster คือ [primary_title|E] ของท่าน ซึ่งเป็นเหตุผลว่าทำไม $game_concept_realm$ ของท่านจึงตั้งชื่อตามมัน\n\nท่านยังถือครอง Earldom of Thomond เป็น $game_concept_title$ แยกต่างหากด้วย\n\n#TUT หากท่านซูมออก จะมีข้อความว่า "Munster" ในส่วนนี้ของแผนที่ เพราะท่านคือผู้ปกครองสูงสุดของพื้นที่#!"
 lesson_basics_map_modes:0 "การปกครองเหนือผู้อื่น ($lesson_basics_map$)"
 lesson_basics_map_modes_desc:1 "ในฐานะ [ruler|E] ท่านสามารถถือครองที่ดินได้ด้วยตนเองเพียงจำนวนหนึ่งเท่านั้น — ท่านมักจะมี $game_concept_rulers$ อื่น ๆ ช่วยในการบริหาร [realm|E] โดยการถือครองที่ดิน ([titles|E]) ภายในพรมแดนของท่าน ทำให้พวกเขาเป็น [vassals|E] ของท่าน\n\n#TUT หากต้องการค้นหาที่ดินของท่านเอง ซึ่งคือ [domain|E] ของท่าน ให้กดปุ่ม 'Home' และซูมเข้า เมื่อเข้าใกล้มากขึ้น ท่านจะเห็นป้ายกำกับสีน้ำเงินบน [baronies|E] ที่เป็นของท่าน (ในกรณีนี้คือ $cn_luimneach$ และ $cn_inis$)\n\nEarldom of $c_ormond$ ถูกถือครองโดยข้าหลวงของท่าน#!"
 ### What makes a ruler
 lesson_basics_characters:0 "ตัวละคร ($lesson_basics_character$)"
 lesson_basics_characters_desc:1 "ท่านเล่นเป็นหนึ่งใน [characters|E] มากมายในโลกนี้ ซึ่งแสดงด้วยรูปประจำตัวละคร ตัวละครของท่านคือ [ruler|E] ของ [realm|E]!\n\n#TUT ท่านจะต้องทำให้แน่ใจว่า [dynasty|E] ของท่านอยู่รอดและเจริญรุ่งเรืองตลอดหลายยุคสมัย [titles|E] ของท่านให้พลังและการควบคุมเหนือดินแดน เช่นเดียวกับเหนือตัวละครอื่น ๆ (ซึ่งอาจถือครองตำแหน่งและที่ดินของตนเอง)#!"
 lesson_basics_characters_click_on_character:0 "คลิกที่ตัวละครของท่าน"
 lesson_basics_skills:0 "ทักษะ ($lesson_basics_character$)"
 lesson_basics_skills_desc:3 "[characters|E] มี [skills|E] ซึ่งบ่งบอกถึงความเชี่ยวชาญในสาขาใดสาขาหนึ่ง บางคนเป็นนักพูดที่ยอดเยี่ยม ในขณะที่คนอื่น ๆ ชอบที่จะแสดงเจตนาของตนให้ชัดเจนในสนามรบ\n\n#TUT ทักษะหลักคือ:\n#![diplomacy_i|E] [diplomacy|E]\n#weak การปรับปรุงความเห็นของผู้อื่นที่มีต่อท่าน#!\n[martial_i|E] [martial|E]\n#weak การระดมพลและบัญชาการกองทัพ#!\n[stewardship_i|E] [stewardship|E]\n#weak การจัดการที่ดินส่วนตัวของท่าน#!\n[intrigue_i|E] [intrigue|E]\n#weak การวางแผนและการค้นหาความลับ#!\n[learning_i|E] [learning|E]\n#weak การศึกษาเทววิทยาและเทคโนโลยี#!"
 lesson_basics_traits_1:0 "ลักษณะนิสัย ($lesson_basics_character$)"
 lesson_basics_traits_1_desc: "[characters|E] ยังมี [traits|E] ซึ่งสามารถส่งผลต่อ [skills|E] รวมถึงปฏิกิริยาของพวกเขาต่อสิ่งต่าง ๆ สิ่งเหล่านี้แสดงให้เห็นด้วยไอคอนในมุมมองตัวละคร\n\nTraits บางอย่างบอกท่านเกี่ยวกับบุคลิกภาพของ $game_concept_character$ เช่น [GetTrait('fickle').GetName( GetNullCharacter )], [GetTrait('calm').GetName( GetNullCharacter )], หรือ [GetTrait('generous').GetName( GetNullCharacter )] Traits อื่น ๆ เฉพาะเจาะจงกับวิธีการใช้ชีวิตของ $game_concept_character$ เช่น [tutorial_education_trait|E] หรือ [commander_traits|E]\n\n#TUT ท่านคือ:\n@temperate_icon_tutorial! [GetTrait('temperate').GetName( GetNullCharacter )]\n@gregarious_icon_tutorial! [GetTrait('gregarious').GetName( GetNullCharacter )]\n@impatient_icon_tutorial! [GetTrait('impatient').GetName( GetNullCharacter )]\n\nเมื่อตัวละครเลือกที่จะประพฤติตนขัดแย้งกับ Traits บุคลิกภาพของพวกเขา มันอาจทำให้พวกเขาเกิด [stress|E] ได้#!"
 lesson_basics_traits_2:0 "ลักษณะนิสัย ($lesson_basics_character$)"
 lesson_basics_traits_2_desc:1 "[traits|E] ยังสามารถส่งผลต่อวิธีที่ [characters|E] อื่น ๆ ตอบสนองต่อ #EMP ท่าน#! ได้\n\nบางคนประทับใจในลักษณะนิสัย @brave_icon! [GetTrait('brave').GetName( GetNullCharacter )] ในขณะที่ตัวละคร @lustful_icon! [GetTrait('lustful').GetName( GetNullCharacter )] มีแนวโน้มที่จะปรากฏในเรื่องซุบซิบนินทาที่น่าอื้อฉาวมากกว่า...\n\n#TUT ลักษณะนิสัยมีอิทธิพลต่อศีลธรรมและความโลภของตัวละครอื่น ๆ ซึ่งสามารถส่งผลต่อทั้งการกระทำที่เป็นมิตรและเป็นศัตรูของพวกเขา#!"
 lesson_basics_opinion:0 "ความเห็น ($lesson_basics_character$)"
 lesson_basics_opinion_desc:3 "[characters|E] ทั้งหมด (ใช่ #EMP ทั้งหมด#!) มี [opinion|E] ต่อกัน ซึ่งขับเคลื่อนพฤติกรรมของพวกเขา\n\n#N $game_concept_opinion$ ต่ำ#! อาจ ทำให้ผู้คนลุกขึ้นต่อต้านท่านหรือไม่เต็มใจที่จะช่วยท่าน #P $game_concept_opinion$ สูง#! ในทางกลับกัน สามารถ ทำให้ $game_concept_characters$ มีแนวโน้มที่จะเข้าร่วม [schemes|E] ของท่านมากขึ้น...\n\n#TUT วิธีที่ท่านเลือกโต้ตอบกับ $game_concept_characters$ อื่น ๆ มักจะส่งผลต่อความเห็นของพวกเขาที่มีต่อท่าน#!"
 
 ### Resources
 lesson_basics_resources_1:0 "[gold_i|E] ทอง ($lesson_basics_resources$)"
 lesson_basics_resources_1_desc:2 "เพื่อให้บรรลุเป้าหมาย ท่านจะต้องมี [gold|E] เหนือสิ่งอื่นใด $game_concept_gold$ ใช้จ่ายสำหรับ [buildings|E], [armies|E] และสินบน $game_concept_gold$ จะถูกรวบรวมอย่างต่อ เนื่องจากทั้ง [holdings|E] และ [vassals|E] ของท่านในรูปแบบ [tax|E] $game_concept_vassals$ ที่ใหญ่กว่าและ $game_concept_holdings$ ที่สำคัญกว่ามักจะให้ $game_concept_tax$ มากกว่า\n\nอย่างไรก็ตาม เงินไม่สามารถซื้อทุกสิ่งได้ — บางสิ่งสามารถทำได้โดยการใช้ [prestige|E] ในปริมาณที่เหมาะสม หรือสำหรับเรื่องทางศาสนาคือ [piety|E]\n\n#TUT ท่านสามารถดูสถานะปัจจุบันของทอง เกียรติภูมิ และความศรัทธาของท่านได้ในแถบด้านบนขวา#!\n"
 lesson_basics_resources_2:0 "[prestige_i|E] เกียรติภูมิ ($lesson_basics_resources$)"
 lesson_basics_resources_2_desc:2 "[prestige|E] ของท่านบอกว่าท่านได้รับความเคารพมากเพียงใด สามารถได้รับอย่างต่อเนื่องเมื่อเวลาผ่านไป ( เช่น โดยการถือครอง [titles|E] จำนวนมาก) หรืออย่างแข็งขัน ( เช่น โดยการ [marrying|E] เข้าสู่ [dynasties|E] ที่มีชื่อเสียง หรือต่อสู้ในฐานะ [ally|E] ใน [wars|E])\n\nเมื่อใดก็ตามที่ท่านได้รับ $game_concept_prestige$ ท่านจะสร้างไปสู่ [prestige_level|E] ถัดไป $game_concept_prestige_levels$ ที่สูงขึ้น ทำให้ [characters|E] อื่น ๆ คิดดีกับท่านมากขึ้น และนำมา ซึ่งวิธีที่ทรงพลังในการทำ $game_concept_war$\n\n#TUT การกระทำบางอย่าง #EMP มีค่าใช้จ่าย#! เป็น $game_concept_prestige$ เช่น การประกาศ $game_concept_war$ การกระทำเหล่านี้ช่วยให้ท่านใช้ประโยชน์จากชื่อเสียงของท่านเพื่อประโยชน์ของตนเอง และ $game_concept_characters$ จะไม่คิดร้ายต่อท่านจากการใช้มัน\n\nการใช้ $game_concept_prestige$ ไม่ส่งผลต่อความคืบหน้า $game_concept_prestige_level$ ของท่าน เพียงแค่ส่งผลต่อ $game_concept_prestige$ ปัจจุบันของท่านเท่านั้น#!"
 lesson_basics_resources_3:0 "[piety_i|E] ความศรัทธา ($lesson_basics_resources$)"
 lesson_basics_resources_3_desc:2 "ด้วย [piety|E] จำนวนมาก ท่านจะโต้ตอบกับ [head_of_faith|E] ของท่านได้ง่ายขึ้น เนื่องจากท่านเป็น $catholic_adherent$ นี่คือพระสันตะปาปา\n\n$game_concept_piety$ สามารถได้รับอย่างต่อ เนื่องจาก [skill|E] [learning|E] และ [traits|E] ที่ [virtuous|E] หรืออย่างแข็งขันจากการกระทำที่เคร่งศาสนา เช่น การไป [pilgrimage|E]\n\nท่านยังมี [piety_level|E] ซึ่งสร้างขึ้นเมื่อเวลาผ่านไปเมื่อใดก็ตามที่ท่านได้รับ $game_concept_piety$ และสามารถมีผลกระทบเชิงบวกต่อตัวละครของท่านได้\n\n#TUT เช่นเดียวกับเกียรติภูมิ การกระทำบางอย่างกำหนดให้ท่านต้อง #EMP ใช้จ่าย#! $game_concept_piety$ เช่น การประกาศ [holy_wars|E] หรือการสร้าง [faith|E] ใหม่\n\nการใช้ $game_concept_piety$ เช่นนี้เป็นเรื่องปกติ และ [characters|E] อื่น ๆ จะไม่คิดร้ายต่อท่านจากการทำ เช่นนั้น#!"

 # Lifestyles
 lesson_basics_lifestyles_1:0 "วิถีชีวิต ($lesson_basics_lifestyles$)"
 lesson_basics_lifestyles_1_desc:1 "นอกเหนือจาก [traits|E] แล้ว [character|E] ของท่านยังสามารถเลือก [lifestyle|E] ได้ มี $game_concept_lifestyles$ [SelectLocalization( HasDlcFeature( 'wandering_nobles' ), 'number_six', 'number_five' )] แบบ หนึ่งแบบสำหรับ แต่ละทักษะ\n\n$game_concept_lifestyles$ แสดงถึงสิ่งที่ท่านทุ่มเทความพยายามมากที่สุดใน แต่ละวัน และ แต่ละแบบมี [focuses|E] หลายอย่างที่เกี่ยวข้องกับมัน\n\nทุก $game_concept_focus$ ให้โบนัสเฉพาะแก่ท่านและ ทำให้เหตุการณ์ที่เกี่ยวข้องกับ $game_concept_focus$ นั้นมีแนวโน้มที่จะเกิดขึ้นมากขึ้น"
 lesson_basics_lifestyle_open_window_tt:2 "คลิกปุ่มวิถีชีวิต (เน้นสี)"
 lesson_basics_lifestyles_2:0 "จุดมุ่งหมาย ($lesson_basics_lifestyles$)"
 lesson_basics_lifestyles_no_GUI_highlight:0 "$lesson_basics_lifestyles_2$"
 lesson_basics_lifestyles_2_desc:3 "คลิกที่ [lifestyle|E] ใด ๆ เพื่อดู [focuses|E] ของมัน\n\nเมื่อเวลาผ่านไป [character|E] ของท่านจะได้รับ [lifestyle_experience|E] จากการรักษาวิถีชีวิต $game_concept_lifestyle$ นั้น ๆ เมื่อท่านได้รับ $game_concept_lifestyle_experience$ เพียงพอ ท่านสามารถเลือกหนึ่งใน [perks|E] ของ $game_concept_lifestyle$ นั้นจาก #EMP ต้นไม้#! ใด ๆ ของมันได้\n\n$game_concept_perks$ แสดงถึงการฝึกฝนและพัฒนาตนเองเมื่อเวลาผ่านไป และมอบโบนัสเฉพาะ ( เช่น ลักษณะนิสัยพิเศษ) หรือปลดล็อกกลไกและเนื้อหาเฉพาะของ $game_concept_lifestyle$ ( เช่น ความสามารถในการเริ่ม [schemes|E] [GetScheme('abduct').GetTypeName])$lesson_basics_lifestyles_2_reuse$"
 lesson_basics_lifestyles_2_reuse:1 "\n\n#TUT ตัวอย่างเช่น จุดมุ่งหมาย $martial_strategy_focus_short$, $martial_authority_focus_short$ และ $martial_chivalry_focus_short$ ทั้งหมดให้ประสบการณ์การทหาร ซึ่งสามารถใช้เพื่อรับ [perks|E] ใด ๆ ของวิถีชีวิตการทหารได้\n\nการทำให้ต้นไม้คุณสมบัติพิเศษสมบูรณ์จะนำไปสู่ลักษณะนิสัยวิถีชีวิตที่แตกต่างกัน!#!"
 lesson_basics_lifestyle_choose_focus_tt:0 "เลือกจุดมุ่งหมาย"
 lesson_basics_lifestyles_2_b:0 "$lesson_basics_lifestyles_2$"
 lesson_basics_lifestyles_2_b_desc:0 "เมื่อเลือก [focus|E] แล้ว ท่านอาจเดาได้แล้วว่า [character|E] ของท่านจะได้รับ [lifestyle_experience|E] เมื่อเวลาผ่านไป $lesson_basics_lifestyles_2_reuse$"
 
# Interacting
 lesson_basics_interacting_1:0 "ตัวละครอื่น ๆ ($lesson_basics_interacting$)"
 lesson_basics_interacting_1_desc:1 "ตอนนี้ เมื่อเลือก [focus|E] แล้ว เราสามารถไปยังเรื่องของคนอื่น ๆ ได้! การโต้ตอบกับ [characters|E] อื่น ๆ เป็นกุญแจสำคัญใน Crusader Kings III และท่านมีตัวเลือกมากมายในการทำ เช่นนั้น\n\n#TUT ท่านสามารถคลิกขวาที่ภาพตัวละคร รวมถึงตัวท่านเอง เพื่อดูรายการ [interactions|E] ที่เป็นไปได้ เช่น การจัดการ [marriage|E] หรือการริเริ่ม [scheme|E] นี่คือที่ที่ท่านเริ่ม [wars|E] ด้วย แต่เก็บเรื่องนั้นไว้ทีหลังก่อน#!"
 lesson_basics_open_character_view_tt:0 "เปิดมุมมองตัวละครของท่าน"
 lesson_basics_open_interactions_tt:2 "คลิกขวาที่ภาพ $game_concept_character$ ของ [player_heir|E] ของท่านเพื่อดูการปฏิสัมพันธ์ที่มีอยู่"
 lesson_basics_interacting_2:0 "ส่งของขวัญ ($lesson_basics_interacting$)"
 lesson_basics_interacting_2_desc:2 "เริ่มต้นด้วยพื้นฐาน — ทุกคนชอบทอง! ลองส่งสินบนให้ [player_heir|E] ของท่านดู\n\n#TUT [interactions|E] ส่วนใหญ่จะเปิดหน้าต่างที่สองพร้อมรายละเอียดเมื่อเลือก ท่านสามารถยืนยันหรือยกเลิกการกระทำในหน้าต่างนี้ได้#!"
 lesson_basics_send_gift_tt:2 "ยืนยันการปฏิสัมพันธ์ #TUT_KW ส่งของขวัญ#! กับ $game_concept_heir$ ของท่าน"
 lesson_basics_interacting_3:0 "ส่งของขวัญแล้ว ($lesson_basics_interacting$)"
 lesson_basics_interacting_3_desc:1 "ทำได้ดีมาก! ท่านประสบความสำเร็จในการ #P เพิ่ม#! [opinion|E] ของใครบางคนที่มีต่อท่าน\n\n#TUT สังเกต #bold ข้อความแจ้งเตือน#! ที่มุมล่างขวา — นี่คือที่ที่ข้อมูล #EMP ที่น่าสนใจเล็กน้อยแต่ไม่สำคัญ#! ปรากฏขึ้น และจะหายไปหลังจากนั้นครู่หนึ่งเมื่อยกเลิกการหยุดชั่วคราว#!\n\nตัวปรับปรุงความเห็นบางอย่างคงอยู่ตลอดไป เช่น ความผูกพันในครอบครัว อื่น ๆ จะลดลงเมื่อเวลาผ่านไป เช่น ความทรงจำที่จางหายไปของการได้รับของขวัญเป็นเงิน...\n\n#TUT หากท่านวางเคอร์เซอร์เหนือหมายเลขความเห็นบนตัวละครอื่น ท่านจะเห็นได้อย่างชัดเจนว่าตัวเลขต่าง ๆ มาจากไหน เป็นเพราะพันธมิตรจากการสมรส ของขวัญเป็นทอง หรือเพียงเพราะพวกเขาชื่นชมในความซื่อสัตย์ของท่าน?#!"

# Generational Gameplay
 lesson_basics_many_lives_1:0 "การเล่นเป็นครอบครัว ($lesson_basics_succession$)"
 lesson_basics_many_lives_1_desc:2 "ต่อไป มาพูดถึง [dynasty|E] ของท่านกัน เมื่อเกมดำเนินไป เว้น แต่ [character|E] ของท่านจะประสบ "อุบัติเหตุ" ที่ไม่คาดฝันหรือโรคร้ายแรง พวกเขาจะแก่ลงและในที่สุดก็จะตาย\n\n#TUT เรื่องราวยังไม่จบแค่นั้น — มันจะเป็น [game_over|E] ก็ต่อเมื่อท่านไม่มีทายาทจากราชวงศ์ของท่านเอง!#!"
 lesson_basics_many_lives_2:0 "ทายาท ($lesson_basics_succession$)"
 lesson_basics_many_lives_2_no_GUI_highlight:0 "$lesson_basics_many_lives_2$"
 lesson_basics_many_lives_2_desc:5 "ตราบใดที่ [titles|E] ของท่านมี [heirs|E] จาก [dynasty|E] ของท่าน มรดกของท่านจะคงอยู่ต่อไป เมื่อ [character|E] ปัจจุบันของท่านตาย ท่านก็แค่เริ่มเล่นตัวใหม่: [player_heir|E]\n\nขึ้นอยู่กับประเภทของ [succession|E] ที่ [realm|E] ของท่านมี นี่น่าจะเป็นหนึ่งในลูก ๆ ของท่าน — บางทีอาจเป็นคนที่ท่านได้เตรียมไว้เพื่อ [Concept( 'ruler', 'Rule' )|E]?\n\n#TUT $game_concept_dynasty$ ของท่านมีตราอาร์มของตัวเอง ซึ่งขณะนี้ถูกเน้นสี และสามารถคลิกเพื่อดูข้อมูลเพิ่มเติมได้\n\nท่านไม่จำเป็นต้องทำอะไรกับสิ่งนี้ในตอนนี้ แต่หากท่านต้องการดูรายละเอียดของ $game_concept_dynasty$ ของท่านในภายหลัง สามารถพบได้ที่นี่\n\n#!"

# Succession Laws 
 lesson_basics_succession_laws:0 "กฎหมายการสืบทอดตำแหน่ง ($lesson_basics_succession$)"
 lesson_basics_succession_laws_desc:0 "[succession_laws|E] กำหนดวิธีการแบ่ง [titles|E] และทรัพยากรทั้งหมดระหว่าง [heirs|E] เมื่อ [character|E] ตาย ปัจจุบันท่านมีทายาทเพียงคนเดียว แต่ลองมาดูกัน!\n\n#TUT ในบางกรณี เมื่อท่านเข้ารับตำแหน่งตัวละครใหม่ ท่านอาจพบว่าพวกเขามีส่วนรับผิดชอบต่อการเสียชีวิตก่อนวัยอันควรของผู้ปกครองคนก่อนของท่าน...#!"
 lesson_basics_succession_tab_tt:0 "ตรวจสอบแท็บการสืบทอดตำแหน่ง"
 lesson_basics_succession_laws_complete_2:0 "$lesson_basics_succession_laws$"
 lesson_basics_succession_laws_complete_2_desc:0 "$lesson_basics_succession_laws_desc$"
 lesson_basics_renown:0 "ชื่อเสียงราชวงศ์ ($lesson_basics_succession$)"
 lesson_basics_renown_no_GUI_highlight:0 "$lesson_basics_renown$"
 lesson_basics_renown_no_GUI_highlight_2:0 "$lesson_basics_renown$"
 lesson_basics_renown_desc:2 "ในฐานะสมาชิกของ [dynasty|E] ท่านยังมี [dynasty_prestige|E] ด้วย ซึ่งแบ่งปันโดยทุกคนใน $game_concept_dynasty$ ของท่าน $game_concept_dynasty_prestige$ เติบโตขึ้นในหลายวิธีและสะท้อนว่า #EMP ราชวงศ์#! ของท่านมีชื่อเสียง (หรือฉาวโฉ่) เพียงใด ไม่ใช่แค่ท่าน\n\nการเพิ่ม $game_concept_dynasty_prestige$ ของท่านจะส่งผลสะท้อนไปยังรุ่นลูกรุ่นหลานของท่าน เพิ่ม [dynasty_prestige_level|E] ของท่าน ในฐานะ [dynast|E] (สมาชิกที่ทรงอำนาจที่สุดของ $game_concept_dynasty$ ของท่าน) ชื่อเสียงราชวงศ์จะช่วยให้ท่านปลดล็อก [dynasty_perks|E] ที่จะเป็นประโยชน์ต่อญาติพี่น้องทั้งหมดของท่าน\n\n#TUT หากต้องการดู $game_concept_dynasty_perk$ ของราชวงศ์ ให้คลิกที่ตราอาร์มราชวงศ์ของพวกเขา#!"

# Marriage
 lesson_basics_marriage_concept_1:0 "การสมรส ($lesson_basics_marriage$)"
 lesson_basics_marriage_concept_1_desc:1 "เพื่อให้แน่ใจในอนาคตของ [dynasty|E] ของท่าน ท่านต้องการสมาชิกในครอบครัว การ [married|E] เป็นจุดเริ่มต้นที่ดี แต่เราไม่สามารถรับประกันได้ว่าท่านจะสมรสด้วยความรัก @arrange_marriage_icon!"
 lesson_basics_marriage_concept_2:0 "การหาคู่สมรส ($lesson_basics_marriage$)"
 lesson_basics_marriage_concept_2_b:0 "$lesson_basics_marriage_concept_2$"
 lesson_basics_marriage_concept_2_desc:1 "มาสมรสกันเถอะ!\n\nสำหรับตัวละครที่ยังไม่ได้สมรสใน [domain|E] ของท่าน ท่านสามารถจัดการ [marriages|E] (หรือ [betrothals|E]) ได้โดยคลิกขวาที่ตัวละครและเลือก #TUT_KW หาคู่สมรส#! หรือ #TUT_KW จัดการสมรส#!.\n\n#TUT ตัวเลือกทั้งสองทำงานแตกต่างกัน ดังนั้นมาดูทั้งสองอย่างกัน...#!"
 lesson_basics_marriage_concept_2_b_desc:1 "ในขณะที่ตัวละครของท่านสมรสแล้ว ให้เราแนะนำขั้นตอนที่เกี่ยวข้องให้ท่านทราบ\n\nสำหรับตัวละครที่ยังไม่ได้สมรสใน [domain|E] ของท่าน ท่านสามารถจัดการ [marriages|E] (หรือ [betrothals|E]) ได้โดยคลิกขวาที่ตัวละครและเลือก #TUT_KW หาคู่สมรส#! หรือ #TUT_KW จัดการสมรส#!.\n\n#TUT ท่านไม่จำเป็นต้องสมรสกับใครอีก แต่การเลือก #TUT_KW หาคู่สมรส#! จะเปิดมุมมองการสมรสให้เรา#!"
 lesson_basics_marriage_instruction_open_window:0 "$lesson_basics_marriage_concept_1$"
 lesson_basics_marriage_instruction_open_window_desc:0 "มาหาคนให้ตัวละครของท่านสมรสด้วยกันเถอะ!"
 lesson_basics_open_interactions_marriage_tt:0 "คลิกขวาที่ตัวละครของท่านเอง"
 lesson_basics_open_interactions_marriage_alt_tt:0 "คลิกขวาที่ตัวละคร #EMP ที่ยังไม่ได้สมรส#!"
 lesson_basics_marriage_view_tt:1 "เลือก #TUT_KW หาคู่สมรส#!"
 lesson_basics_find_spouse_concept:0 "การเลือกคู่สมรส ($lesson_basics_marriage$)"
 lesson_basics_find_spouse_concept_desc:1 "การเลือก #TUT_KW หาคู่สมรส#! จะเปิดรายการ [spouses|E] ที่เป็นไปได้ — พวกเขามาจาก [courts|E] ทั่วโลก!\n\nการเลือก #TUT_KW จัดการสมรส#! จะเปิดรายการ [spouses|E] ที่เป็นไปได้ เช่นกัน แต่เฉพาะกับคนจาก [court|E] ของตัวละครที่ท่านคลิกเท่านั้น\n\n#TUT ตัวละครของท่านเองจะปรากฏทางด้านซ้าย เพราะการสมรสนี้ต้องการการอนุมัติ #EMP ของท่าน#! ใครก็ตามที่เป็น [liege|E] ของคู่สมรสอีกฝ่ายจะปรากฏทางด้านขวา เนื่องจากการรวมกันจะต้องได้รับการอนุมัติจากพวกเขา เช่นกัน\n\n#TUT_KW จัดการสมรส#! อาจมีประโยชน์สำหรับการจับคู่ระหว่าง [courtiers|E] ของท่าน หรือสำหรับการตั้งค่า [alliance|E] การสมรสที่เฉพาะเจาะจง สำหรับตอนนี้ #TUT_KW หาคู่สมรส#! มีความเกี่ยวข้องกับวัตถุประสงค์ของเรามากกว่า#!"
 lesson_basics_arrange_marriage_concept:0 "จัดการสมรส ($lesson_basics_marriage$)"
 lesson_basics_arrange_marriage_concept_desc:0 "\n\n#TUT สิ่งนี้อาจมีประโยชน์สำหรับการจับคู่ระหว่าง [courtiers|E] ของท่าน หรือสำหรับการตั้งค่า [alliance|E] การสมรสที่เฉพาะเจาะจง#!"
 lesson_basics_choosing_a_spouse:0 "ตัวกรองตัวละคร ($lesson_basics_marriage$)"
 lesson_basics_choosing_a_spouse_no_GUI_highlight:0 "$lesson_basics_choosing_a_spouse$"
 lesson_basics_choosing_a_spouse_desc:2 "มีปัจจัยหลายอย่างที่ต้องพิจารณาเมื่อเลือก [spouse|E] เพื่อช่วยท่าน มีฟังก์ชันตัวกรอง (เน้นสี) เพื่อลดจำนวนผู้สมัครลง แง่มุมที่ต้องพิจารณา ได้แก่ [alliances|E] ที่เป็นไปได้ [skills|E] [traits|E] บุคลิกภาพ [fertility|E] ที่คาดหวัง และอื่น ๆ\n\nลักษณะนิสัยบางอย่างเป็น [congenital|E] ซึ่งหมายความว่าอาจถ่ายทอดไปยังลูก ๆ ของท่านได้ — บางทีคนที่มีลักษณะนิสัย เช่นนั้นอาจเป็นจุดเริ่มต้นที่ดี?\n\n#TUT ท่านสามารถเปลี่ยนการเลือกของท่านได้โดยคลิกปุ่ม #TUT_KW ล้างตัวละคร#! ระหว่างตัวละครที่ท่านกำลังจัดการให้สมรสกัน จะไม่มีอะไรเกิดขึ้นจนกว่าท่านจะคลิก #TUT_KW ส่งข้อเสนอ#!.#!"
 send_marriage_proposal_button_name:0 "ส่งข้อเสนอ"
 lesson_basics_say_yes:0 "ส่งข้อเสนอ ($lesson_basics_marriage$)"
 lesson_basics_said_yes:0 "$lesson_basics_say_yes$"
 lesson_basics_say_yes_desc:1 "เมื่อท่านเลือกตัวละครสองตัวสำหรับการ [marriage|E] ของท่าน ท่านจะเห็นรายละเอียดของการรวมกัน พร้อมด้วยตัวเลือกเพิ่มเติม เช่น การให้การสมรสเป็นแบบ [matrilineal|E]\n\n#TUT หากท่านพอใจกับการสมรส ให้ดำเนินการส่งข้อเสนอ การกระทำนี้มักใช้เวลาสองสามวัน แต่เราจะทำให้มันเกิดขึ้นทันทีสำหรับบทช่วยสอน#!"
 lesson_basics_get_married_tt:1 "ทำการสมรส — เลือกคู่สมรสสำหรับตัวละครของท่านและคลิก #TUT_KW ส่งข้อเสนอ #! เพื่อเสนอการรวมกัน"
 lesson_basics_already_married:0 "$lesson_basics_marriage_concept_1$"
 lesson_basics_already_married_desc:0 "เมื่อใดก็ตามที่ท่านกำลังจัดการ [marriage|E] ระหว่าง [characters|E] ขั้นตอนสุดท้ายก่อนส่งข้อเสนอจะแสดงรายละเอียดของการรวมกัน พร้อมด้วยตัวเลือกเพิ่มเติม เช่น การให้การสมรสเป็นแบบ [matrilineal|E]\n\n#TUT ตัวละครของท่านสมรสแล้ว — ทำได้ดีมาก!#!"
 lesson_basics_marriage_final_notes:0 "ขอแสดงความยินดี! ($lesson_basics_marriage$)"
 lesson_basics_marriage_final_notes_desc:3 "ยอดเยี่ยม! ขอให้ท่านทั้งสองอยู่ด้วยกันอย่างมีความสุขและยืนยาว!\n\n#TUT ท่านอาจสังเกตเห็น #bold ข้อความ Toast#! ที่ด้านบนของหน้าจอ — ข้อความ toast ให้ข้อมูลที่รวดเร็ว ซึ่งเกี่ยวข้องกับท่านหรือตัวละครของท่าน [marriages|E] มักจะมาพร้อมกับ #bold เหตุการณ์#! เนื่องจาก [liege|E] ของ [spouse|E] ที่เป็นไปได้ของท่านยอมรับ (หรือปฏิเสธ) ข้อเสนอของท่านด้วยจดหมาย มีเหตุการณ์ประเภทต่าง ๆ และมีความสำคัญต่อการกำหนดชะตากรรมของท่าน ดังนั้นคอยสังเกตให้ดี!#!\n\nสำหรับบทช่วยสอนนี้ เราขอแนะนำให้ท่านใช้ #TUT_KW หาคู่สมรส#! สำหรับบุตรชายของท่านด้วย\n\n#TUT ทันทีที่บุตรชายของท่านสมรส เขาสามารถเริ่มผลิตสมาชิกในครอบครัวของท่าน (และ [heirs|E] สำหรับ [titles|E] ของท่านที่เป็น [dynasty|E] ของท่าน) ได้#!"

# Dynasty & House
 lesson_basics_dynasty_and_house:0 "ราชวงศ์และตระกูล ($lesson_basics_titles$)"
 lesson_basics_dynasty_and_house_desc:0 "ครอบครัวเป็นสิ่งสำคัญ! [player_heir|E] จะมาจาก [dynasty|E] ของท่านเสมอ และส่วนใหญ่มักจะมาจาก [house|E] ของท่าน\n\n#TUT ในอนาคต การจับตาดูครอบครัวของท่าน — และ #EMP [line_of_succession|E] #! ของพวกเขา — จะไม่เสียหาย ขึ้นอยู่กับ [succession_laws|E] ของพวกเขา ท่านอาจลงเอยด้วยการสืบทอด [titles|E] (พร้อมกับที่ดินและ [vassals|E]) จากญาติของท่าน#!"

# Titles & Holdings
 lesson_basics_landed_titles:0 "ที่ดินและตำแหน่ง ($lesson_basics_titles$)"
 lesson_basics_landed_titles_desc:2 "ไม่ใช่ทุกคนใน [dynasty|E] ของท่านจะเป็นเจ้าของที่ดิน แต่ที่ดินทุกผืนบนแผนที่ #EMP มี#! เจ้าของ\n\nบางครั้งเจ้าของคือท่าน บางครั้งเป็นหนึ่งใน [vassals|E] ของท่าน และบางครั้งก็เป็น [realm|E] อื่นโดยสิ้นเชิง ( ซึ่งหลายแห่งก็มี หรือเป็น $game_concept_vassals$)"
 lesson_basics_de_jure_titles:0 "ตำแหน่ง ($lesson_basics_titles$)"
 lesson_basics_de_jure_titles_desc:4 "ตำแหน่ง [titles|E] ส่วนใหญ่อยู่ในลำดับชั้นคล้ายพีระมิด ตาม [title_tier|E] $game_concept_title$ ของพวกเขา:\n\n[barony|E] — ปกครองโดยบารอนหรือบารอนเนส\n[county|E] — ปกครองโดยเคานต์หรือเคาน์เตส\n[duchy|E] — ปกครองโดยดยุกหรือดัชเชส\n[kingdom|E] — ปกครองโดยกษัตริย์หรือราชินี\n[empire|E] — ปกครองโดยจักรพรรดิหรือจักรพรรดินี\n\nทุก $game_concept_title$ เป็นส่วนหนึ่งตามกฎหมายของ $game_concept_title$ หนึ่ง $game_concept_title_tier$ ขึ้นไปในสายโซ่ ตัวอย่าง เช่น แต่ละ $game_concept_county$ จึงเป็นส่วนหนึ่งของ $game_concept_duchy$\n\n#TUT หมายเหตุ: มีชื่อแบบไดนามิกมากมายสำหรับตำแหน่งเหล่านี้ — [ruler|E] ปัจจุบันของท่านรับผิดชอบ "Petty Kingdom" ซึ่งสอดคล้องกับระดับ [duchy|E]#!"
 lesson_basics_de_jure_cbs:0 "$lesson_basics_de_jure_titles$ โดยนิตินัย"
 lesson_basics_de_jure_cbs_desc:4 "เราพูดว่า "ตามกฎหมาย" เพราะ เนื่องจาก Crusader Kings III ให้ท่านเล่นกับประวัติศาสตร์ จึงไม่มีทางรับประกันได้ว่า [king|E] จะ #EMP ควบคุม#! [titles|E] ทั้งหมดที่ [kingdom|E] ของเขา "ควรจะ" มีอยู่ภายในพรมแดนของตนจริง ๆ\n\nเราเรียกโครงสร้างลำดับชั้น $game_concept_title$ นี้ว่า [de_jure|E] และหากโครงสร้างถูกทำลาย มักจะเป็นไปได้ที่จะประกาศสงครามเพื่อยึดดินแดนที่หลงผิด\n\n#TUT หากท่านเปลี่ยนไปใช้โหมดแผนที่ตำแหน่งดัชชี ท่านจะเห็นว่า ในฐานะผู้ปกครอง [duchy|E] ของ $d_munster$ [county|E] ของ $c_desmond$ ควรจะเป็นส่วนหนึ่งของอาณาจักรของท่านตามกฎหมาย#!"
 lesson_basics_de_jure_cbs_complete_1:0 "$lesson_basics_de_jure_cbs$"
 lesson_basics_de_jure_cbs_complete_2:0 "$lesson_basics_de_jure_cbs$"
 lesson_basics_change_map_mode_1_tt:1 "เปลี่ยนเป็นโหมดแผนที่ตำแหน่งดัชชี"
 lesson_basics_change_map_mode_2_tt:0 "กลับสู่โหมดแผนที่อาณาจักร"
 lesson_basics_holdings_and_buildings:0 "ที่ดินถือครองของท่าน ($lesson_basics_holdings$)"
 lesson_basics_holdings_and_buildings_desc:3 "ตำแหน่ง [de_jure|E] ของ Munster ประกอบด้วยสี่ [counties|E] ชื่อของพวกเขาควรจะมองเห็นได้บนแผนที่: $c_thomond$ และ $c_ennis$ (ถือครองโดยท่าน), $c_desmond$ (ถือครองโดย [ruler|E] เพื่อนบ้าน) และ $c_ormond$ (ถือครองโดย [vassal|E] ของท่าน)\n\n[counties|E] เหล่านี้ประกอบด้วยที่ดินผืนเล็ก ๆ — [baronies|E] ซึ่งเป็น [holdings|E] แต่ละแห่งของ [realm|E]\n\n#TUT ที่ดินถือครองแสดงถึงการตั้งถิ่นฐานในดินแดนของท่าน!#!"
 lesson_basics_buildings:0 "อาคารของท่าน ($lesson_basics_holdings$)"
 lesson_basics_buildings_no_GUI_highlight:0 "อาคาร ($lesson_basics_holdings$)"
 lesson_basics_buildings_desc:3 "[holdings|E] ให้ระดับ [taxes|E] และ [levies|E] ที่แตกต่างกัน เช่นเดียวกับ [buildings|E] ที่ท่านสามารถสร้างและอัปเกรดได้ ขึ้นอยู่กับ [holding_type|E]\n\n#TUT เราแนะนำให้ท่านเริ่มด้วยการอัปเกรด #TUT_KW $building_curtain_walls_01$.#!#!"
 lesson_basics_start_construction_tt:1 "คลิกที่ที่ดินถือครองเมืองหลวงของท่าน ($cn_luimneach$) เลือก #TUT_KW $building_curtain_walls_01$#! ท่ามกลางอาคารของมัน และ #TUT_KW อัปเกรด#! โครงสร้าง"
 lesson_basics_buildings_complete:0 "$lesson_basics_holdings_and_buildings$"
 lesson_basics_buildings_complete_desc:1 "ทำได้ดีมาก! อย่างไรก็ตาม จะต้องใช้เวลาสักพักกว่า [building|E] จะพร้อม — $cn_luimneach$ ไม่ได้สร้างเสร็จในวันเดียว... อย่าลังเลที่จะปิดหน้าต่างการก่อสร้าง #EMP $building_type_curtain_walls_01$#!.\n\n#TUT เมื่อการก่อสร้างของท่านเสร็จสมบูรณ์ ท่านจะได้รับประโยชน์จากอาคารหรือการอัปเกรดที่ท่านเลือก#!"
 lesson_basics_taxes:0 "การเก็บภาษี ($lesson_basics_holdings$)"
 lesson_basics_taxes_desc:1 "[holding|E] ทุกแห่งให้ [taxes|E] แก่ [holder|E] ของตน หากผู้ถือครองนั้นเป็น [vassal|E] พวกเขาจะจ่ายภาษีให้กับ [liege|E] ของตน\n\nภาษีคือแหล่ง [income|E] หลักของ [gold_i] [gold|E] ของท่าน!\n\n#TUT [obligations|E] สามารถส่งผลต่อความสูงหรือต่ำของภาษีเหล่านี้ การอยู่ใน [war|E] สามารถส่งผลต่อระดับ [control|E] ใน [county|E] ซึ่งส่งผลต่อภาษี#!"

#Vassals
 lesson_basics_vassals_concept:0 "ข้าหลวง ($lesson_basics_vassals$)"
 lesson_basics_realm_view_tt:2 "เปิดมุมมองอาณาจักรทางด้านขวาของหน้าจอ (เน้นสี)"
 lesson_basics_vassals_tab_tt:0 "ตรวจสอบแท็บข้าหลวง"
 lesson_basics_vassals_concept_desc:3 "ในฐานะ [ruler|E] ท่านมีแนวโน้มที่จะเป็น [liege|E] ของ [vassal|E] อย่างน้อยหนึ่งคน เหล่านี้คือ $game_concept_rulers$ ที่ได้สาบานความภักดีต่อท่านและ ดังนั้นจึงเป็นส่วนหนึ่งของ [realm|E] ของท่าน\n\n#TUT ข้าหลวงจัดหา [gold|E] ([taxes|E]) และทหาร ([levies|E]) ให้ท่าน\n\nเป็นไปได้ที่จะเป็นทั้ง $game_concept_liege$ และ $game_concept_vassal$ ในเวลาเดียวกัน#!"
 lesson_basics_vassals_concept_complete_2:0 "$lesson_basics_vassals_concept$"

 lesson_basics_vassals_concept_great_job:0 "$lesson_basics_vassals_concept$"
 lesson_basics_vassals_concept_great_job_desc:2 "นี่คือรายชื่อ [vassals|E] ปัจจุบันของท่าน พร้อมด้วยข้อมูลเพิ่มเติมเกี่ยวกับพวกเขา\n\nที่ด้านบนสุดของรายการคือ [ruler|E] ของ $c_ormond$ ซึ่งท่านสามารถเห็นที่ดินของเขาบนแผนที่ — นี่คือ Earldom (ตำแหน่ง [title|E] ระดับ [county|E]-[title_tier|E]) ภายใน [realm|E] ของท่าน\n\n#TUT มาที่นี่เพื่อดูภาพรวมของสิ่งต่าง ๆ เช่น [opinion|E] ปัจจุบันของข้าหลวงของท่านที่มีต่อท่าน ไม่ว่าพวกเขาจะถือว่าเป็น [powerful_vassal|E] หรือไม่ และระดับของ [taxes|E] และ [levies|E] ที่พวกเขากำลังจัดหาให้ท่านในปัจจุบัน#!"
 lesson_basics_vassals_concept_greyed_out:0 "$lesson_basics_vassals_concept$"
 lesson_basics_vassals_concept_greyed_out_desc:0 "นี่คือที่ที่ท่านสามารถเปลี่ยน [vassal_contracts|E] ได้ ซึ่งกำหนดว่า [vassal|E] แบบศักดินาจะให้ [levies|E] และ [taxes|E] แก่ท่านมากน้อยเพียงใด"

 lesson_basics_happy_vassals:0 "$lesson_basics_vassals_concept$"
 lesson_basics_happy_vassals_desc:2 "การ ทำให้ [vassals|E] ของท่านมีความสุขนั้นคุ้มค่า — สิ่งนี้จะ ทำให้พวกเขาอยู่ห่างจาก [schemes|E] และ [factions|E] ที่ต่อต้านท่าน\n\nไม่ว่า [character|E] ของท่านจะเป็น [ruler|E] ที่ยิ่งใหญ่เพียงใด หาก [realm|E] ของท่านรวมตัวกันต่อต้านท่าน ไม่ว่าจะเพื่อ [depose|E] ท่านผ่าน [war|E] หรือเพียงแค่ [GetScheme('murder').GetTypeName] ท่านขณะหลับ รัชสมัยของท่านก็มีแนวโน้มที่จะสั้นลง\n\n#TUT ข้าหลวงบางคนของท่านอาจรับใช้ใน [council|E] ของท่าน ทำให้ [opinion|E] ของพวกเขามีความสำคัญเป็นพิเศษ เนื่องจากพวกเขาจะได้รับความไว้วางใจให้ทำ [councillor_tasks|E]#!"
 lesson_basics_vassal_limit:0 "ขีดจำกัดข้าหลวง ($lesson_basics_vassals$)"
 lesson_basics_vassal_limit_desc:2 "มีขีดจำกัดจำนวน [vassals|E] ที่ท่านสามารถดูแลได้อย่างสะดวกสบายก่อนที่ [realm|E] ของท่านจะจัดการได้ยาก การมีเกิน [vassal_limit|E] นี้จะส่งผลกระทบต่อ [taxes|E] และ [levies|E] ที่ท่านได้รับ\n\nสิ่งนี้ไม่สำคัญสำหรับบทช่วยสอน แต่เมื่อท่านเริ่มสร้างอาณาจักรของตนเอง โปรดระวังการเติบโตที่รวดเร็วเกินไป\n\n#TUT หากท่านมีข้าหลวงเกินขีดจำกัด ท่านสามารถมอบบรรดาศักดิ์ระดับต่ำกว่าให้แก่ข้าหลวงของท่านได้ บางครั้งท่านยังสามารถ [create|E] บรรดาศักดิ์ระดับ[title_tier|E]สูง #EMP ใหม่#! เพื่อรวบรวมอำนาจของท่านในภูมิภาคและเสริมสร้างการควบคุมของท่านเหนือบรรดาศักดิ์ระดับต่ำกว่าที่อยู่ภายใต้อำนาจ [de_jure|E] ของบรรดาศักดิ์ใหม่ของท่านได้อีกด้วย#!"

# Domain
 lesson_basics_domain_1:0 "อาณาจักรและเขตปกครองส่วนตัว ($lesson_basics_domain$)"
 lesson_basics_domain_1_desc:3 "#EMP [realm|E]#! ของท่านคือผืนดินและ [titles|E] ทั้งหมดที่ท่านควบคุม รวมถึงพื้นที่ที่ [vassals|E] ของท่านถือครองอยู่ ตอนนี้ สำหรับท่าน หมายถึง [counties|E] (เรียกว่า 'Earldoms' เนื่องจาก [culture|E] ไอริชของท่าน) ของ $c_ennis$, $c_thomond$ และ $c_ormond$\n\nเมื่อใช้คำว่า #EMP [domain|E]#! เราหมายถึงที่ดินที่ท่านเป็นเจ้าของเป็นการส่วนตัว โดยไม่มี $game_concept_vassals$: $c_ennis$ และ $c_thomond$\n\n#TUT บางสิ่งที่เกิดขึ้นจะส่งผลต่อ [domain|E] ของท่านเท่านั้น ($c_ennis$ และ $c_thomond$) ในขณะที่สิ่งอื่น ๆ จะส่งผลกระทบต่อ [realm|E] ทั้งหมดของท่าน ซึ่งคือ [duchy|E] (หรือ 'Petty Kingdom') ของ Munster#!"
 lesson_basics_domain_1_b:0 "อาณาจักรและเขตปกครองส่วนตัว ($lesson_basics_domain$)"
 lesson_basics_domain_1_b_desc:0 "ตัวอย่าง: [county|E] Essex กำลังประสบปัญหาจำนวนทหารลดลง เนื่องจากพื้นที่ถูก #EMP มนุษย์กินคน#! บุกรุก [holder|E] ของ Essex จะได้รับแจ้งถึงเหตุการณ์นี้ เนื่องจากอยู่ในเขตแดน [domain|E] ของพวกเขา [liege|E] ของพวกเขาจะไม่ได้รับแจ้ง\n\n#TUT #EMP เจ้าเหนือหัว#! ของเคานต์แห่ง Essex มี Essex อยู่ใน [realm|E] ของพวกเขา และจะทราบสิ่งที่เกิดขึ้นก็ต่อเมื่อพวกเขาคลิกที่เคาน์ตีบนแผนที่และเห็นตัวปรับปรุง หรือหากพวกเขาสังเกตเห็นว่าข้าหลวงของพวกเขากำลังจัดหาทหารเกณฑ์น้อยลง#!"
 lesson_basics_domain_2:0 "$lesson_basics_domain_1$"
 lesson_basics_domain_2_desc:2 "โปรดทราบว่ามีขีดจำกัดว่าท่านสามารถถือครองที่ดินเป็นการส่วนตัวได้มากเพียงใด ก่อนที่ท่านจะเริ่มได้รับบทลงโทษ: [domain_limit|E]\n\n#TUT เมื่อท่านเกินขีดจำกัดเขตปกครองส่วนตัว เป็นความคิดที่ดีที่จะใช้การปฏิสัมพันธ์ #TUT_KW มอบตำแหน่ง#! กับ [characters|E] ที่ท่านเป็นมิตรด้วย ทำให้พวกเขาเป็น [vassals|E] ของท่าน\n\nเนื่องจากท่านไม่มีตำแหน่งว่างที่จะมอบให้ ท่านจึงไม่สามารถทำ เช่นนี้ได้ในขณะนี้ แต่โดยปกติแล้วท่านจะพบได้ในเมนู $game_concept_character$ ซึ่งมองเห็นได้เมื่อคลิกขวาที่ $game_concept_character$#!"

# Council
 lesson_basics_council_concept:0 "สภา ($lesson_basics_council$)"
 lesson_basics_council_concept_desc:1 "การจัดการ [realm|E] เป็นงานหนักมาก ในฐานะ [ruler|E] ท่านได้รับความช่วยเหลือจาก [council|E] ของท่าน — เหล่านี้อาจเป็น [vassals|E] หรือสมาชิกของ [court|E] ของท่าน และพวกเขาทำหน้าที่เป็นที่ปรึกษาที่ไว้ใจได้ของท่าน\n\n#TUT มีตำแหน่งสภาที่สอดคล้องกับแต่ละ [skill|E] และ [rulers|E] ที่สมรสแล้วจะมี [spouse|E] ของตนคอยช่วยเหลือด้วย#!"
 lesson_basics_council_view_tt:1 "เปิดมุมมองสภา (เน้นสี)"
 lesson_basics_council_tasks:0 "ภารกิจของสภา ($lesson_basics_council$)"
 lesson_basics_council_tasks_desc:1 "[councillors|E] สามารถถูกมอบหมายงานได้ และพวกเขาทั้งหมดทำสิ่งที่แตกต่างกัน!\n\nท่านสามารถเปลี่ยนภารกิจของสมาชิกสภาได้โดยคลิกที่ปุ่มใกล้กับภาพของพวกเขาในมุมมองสภา\n\n#TUT การเป็นสมาชิกสภาเป็นตำแหน่งอันทรงเกียรติ — [powerful_vassals|E] คาดหวังว่าจะได้รับการแต่งตั้งและจะไม่พอใจหากถูกละเลย#!"

# Schemes & Hooks
 lesson_basics_schemes_concept:0 "แผนการ ($lesson_basics_schemes$)"
 lesson_basics_schemes_concept_complete:0 "$lesson_basics_schemes_concept$"
 lesson_basics_schemes_concept_desc:4 "[schemes|E] คือเป้าหมายระยะยาวที่มุ่งเป้าไปที่ตัวละครอื่น พวกเขาสามารถมีเป้าหมายที่เป็นศัตรูได้ เช่น พยายาม [GetScheme('murder').GetTypeName] หรือ [GetScheme('abduct').GetTypeName] เป้าหมายของท่าน หรืออาจเป็นเรื่องที่ดีต่อสุขภาพมากกว่า เช่น แผนการ [GetScheme('befriend').GetTypeName]"
 lesson_basics_intrigue_view_tt:0 "เปิดมุมมองอุบาย (เน้นสี)"
 lesson_basics_schemes_tab_tt:1 "ตรวจสอบแท็บแผนการ (ควรเปิดอยู่ตามค่าเริ่มต้น)"
 lesson_basics_hooks_and_secrets_tab_tt:0 "ตรวจสอบแท็บข้อผูกมัดและความลับ"
 lesson_basics_schemes_murder:0 "$lesson_basics_schemes_concept$"
 lesson_basics_schemes_murder_desc:3 "เวลาที่ดีในการใช้ [scheme|E] อาจเป็นเมื่อท่านพบว่า [line_of_succession|E] ไม่ชัดเจนและเอื้ออำนวยอย่างที่ท่านต้องการ — วิธีหนึ่งในการก้าวไปข้างหน้าคือเพียงแค่ #EMP กำจัด#! คู่แข่ง\n\nอย่างเงียบ ๆ และไม่มีพยาน\n\n#TUT ความพยายาม [GetScheme('murder').GetTypeName] มาพร้อมกับความเสี่ยงที่จะถูกค้นพบ หากความพยายามของท่านผิดพลาด จะทำให้ [character|E] ของท่านไม่เป็นที่นิยม — โดยเฉพาะกับเป้าหมายที่ท่านตั้งใจไว้#!"
 lesson_basics_schemes_sway:0 "$lesson_basics_schemes_concept$"
 lesson_basics_schemes_sway_desc:0 "[scheme|E] Sway ถูกสร้างขึ้นเพื่อเพิ่ม [opinion|E] ที่ใครบางคนมีต่อตัวละครของท่าน ลองใช้ดูสิ!"
 lesson_basics_schemes_sway_complete:0 "$lesson_basics_schemes_concept$"
 lesson_basics_schemes_sway_complete_desc:2 "ยอดเยี่ยม! เมื่อเริ่มดำเนินการแล้ว [scheme|E] ของท่านจะค่อย ๆ คืบหน้าไปตามกาลเวลา เวลาก่อนที่จะได้ข้อสรุปจะแตกต่างกันไปขึ้นอยู่กับ [success_chance|E] ของแผนการ ซึ่งอาจได้รับผลกระทบจาก [skills|E] ที่เกี่ยวข้อง — ในกรณีนี้ได้รับผลกระทบจาก [diplomacy|E] ของท่าน\n\n#TUT หากท่านไม่พอใจกับแผนการของท่าน ท่านสามารถยกเลิกได้ตลอดเวลาโดยคลิกปุ่ม #bold ละทิ้งแผนการ#! (#TUT_KW X#!) ถัดจากแผนการ#!"
 tutorial_basic_schemes_start_swaying_tt:2 "คลิกขวาที่ [court_chaplain|E] ของท่าน ("$councillor_court_chaplain_theocrat_duchy$" ของท่าน) และเลือก #TUT_KW Sway (แผนการ)#!"
 lesson_basics_hooks:0 "ความลับ ($lesson_basics_schemes$)"
 lesson_basics_hooks_desc:3 "บางครั้ง [schemes|E] สามารถก่อให้เกิด [secrets|E] ได้ — หากท่านจับได้ว่ามีคนพยายามก่อเหตุ [GetScheme('murder').GetTypeName] อาจเป็นประโยชน์สูงสุดของพวกเขาที่จะ ทำให้แน่ใจว่าท่านเก็บเป็นความลับ\n\nท่านยังสามารถ [blackmail|E] พวกเขา เพื่อรับ [hook|E] ได้! $game_concept_hooks$ แสดงถึงบุญคุณที่ท่านสามารถเรียกคืนได้ หรือการควบคุมที่ท่านมีเหนือ [character|E] คนใดคนหนึ่ง ทำให้ท่านสามารถสนับสนุน (หรือบังคับ) ให้พวกเขาทำตามคำสั่งของท่านได้\n\nขณะที่ท่านเล่น ท่านจะพบวิธีต่าง ๆ มากมายในการรับและใช้ $game_concept_hooks$ ทดลองใช้ดู!\n\n#TUT ต่อไป สมมติว่าท่านสามารถรับ [hook|E] จาก [vassals|E] คนหนึ่งของท่านได้...#!"
 lesson_basics_hooks_complete:0 "ข้อผูกมัด ($lesson_basics_schemes$)"
 lesson_basics_hooks_complete_desc:4 "[weak_hook|E] นี้สามารถใช้สำหรับสิ่งต่าง ๆ ได้หลายอย่าง ตัวอย่าง เช่น ท่านสามารถเพิ่ม [obligations|E] ที่กำหนดโดย [vassal_contract|E] ที่ท่านมีกับ [vassal|E] แบบ [GetGovernment('feudal_government').GetName]\n\n#TUT หากต้องการเข้าถึงเมนูสำหรับเปลี่ยนสัญญาข้าหลวง ให้ไปที่รายชื่อข้าหลวงของท่านในมุมมองอาณาจักร หรือคลิกขวาที่ภาพของเขาเพื่อเลือก #TUT_KW แก้ไขสัญญาข้าหลวง.#!\n\nท่านอาจสังเกตเห็นว่าการปฏิสัมพันธ์บางอย่างไม่สามารถมองเห็นได้ทันที เมื่อท่านมีการปฏิสัมพันธ์มากมาย เมนูการปฏิสัมพันธ์ [character|E] จะแสดงเฉพาะรายการที่พบบ่อยที่สุดเท่านั้น\n\nหากต้องการแสดงการปฏิสัมพันธ์ที่ขาดหายไป ให้คลิกปุ่ม "เพิ่มเติม..." ในหมวดหมู่#!"

# Culture
 lesson_basics_culture_open_view:1 "วัฒนธรรม"
 lesson_basics_culture_open_view_desc:0 "[character|E] และ [county|E] ทุกคนเป็นส่วนหนึ่งของ [culture|E] [SelectLocalization( GetPlayer.IsValid, 'lesson_basics_culture_open_view_desc_INGAME', '' )]"
 lesson_basics_culture_open_view_desc_INGAME:0 "\n\n[ruler|E] ปัจจุบันของท่านเป็นส่วนหนึ่งของวัฒนธรรม [GetPlayer.GetCulture.GetNameNoTooltip] ซึ่งแสดงอยู่ที่ด้านล่างซ้าย"
 lesson_basics_culture_open_view_trigger:0 "เปิดมุมมองวัฒนธรรม (เน้นสี)"
 
 lesson_basics_culture_elements:0 "วัฒนธรรม"
 lesson_basics_culture_elements_desc:1 "[culture|E] ถูกกำหนดโดย [ethos|E], [culture_pillars|E] และ [traditions|E] แต่ละอย่างกำหนดประโยชน์หรือบทลงโทษต่าง ๆ ให้กับสมาชิกทุกคนในวัฒนธรรม\n\n#V จริยธรรม#! อธิบายถึงค่านิยมหลักของวัฒนธรรม เป็นตัวกำหนดหลักว่าประเพณีใดบ้างที่วัฒนธรรมสามารถใช้ได้ [SelectLocalization( GetPlayer.IsValid, 'lesson_basics_culture_elements_desc_INGAME', '' )]\n\n#V เสาหลักทางวัฒนธรรม#! สะท้อนถึงต้นกำเนิดของวัฒนธรรม และไม่สามารถเปลี่ยนแปลงได้ เช่นกัน สิ่งเหล่านี้มีผลกระทบอย่างมากต่อ [cultural_acceptance|E] ของวัฒนธรรมอื่น ๆ แต่โดยทั่วไปแล้วมีความสำคัญน้อยกว่าจริยธรรม\n\n#V ประเพณี#! ของวัฒนธรรมมีความยืดหยุ่นมากกว่า แต่ยังคงมีความสำคัญอย่างยิ่งต่อวัฒนธรรมได้ แตกต่างจากจริยธรรมและเสาหลัก ประเพณีสามารถเปลี่ยนแปลงได้โดยประมุขวัฒนธรรม ซึ่งเป็นหัวข้อถัดไปของเรา"
 lesson_basics_culture_elements_desc_INGAME:1 "จริยธรรมของวัฒนธรรมของท่าน [GetPlayer.GetCulture.GetCollectiveNounNoTooltip] คือ [GetPlayer.GetCulture.GetEthos.GetName]"
 lesson_basics_culture_culture_head:0 "วัฒนธรรม (ประมุขวัฒนธรรม)"
 lesson_basics_culture_culture_head_desc:0 "[culture_head|E] คือ [ruler|E] ของ [culture|E] ที่มี [realm|E] ใหญ่ที่สุด [SelectLocalization( GetPlayer.IsValid, 'lesson_basics_culture_culture_head_desc_INGAME', '' )]\n\nประมุขวัฒนธรรมสามารถสร้างประเพณีใหม่สำหรับวัฒนธรรมของตนได้\n\nพวกเขายังมีบทบาทสำคัญในการพัฒนาเทคโนโลยีและสังคมของวัฒนธรรม ซึ่งเราจะมาดูกันตอนนี้"
 lesson_basics_culture_culture_head_desc_INGAME:0 "[SelectLocalization(ObjectsEqual(GetPlayer, GetPlayer.GetCulture.GetCultureHead), 'lesson_basics_culture_culture_head_desc_YOU', 'lesson_basics_culture_culture_head_desc_OTHER' )]"
 lesson_basics_culture_culture_head_desc_YOU:0 "ท่านคือประมุขวัฒนธรรมของวัฒนธรรมของท่าน"
 lesson_basics_culture_culture_head_desc_OTHER:0 "[GetPlayer.GetCulture.GetCultureHead.GetName] คือประมุขวัฒนธรรมของวัฒนธรรมของท่าน"

 lesson_basics_culture_innovations_open:0 "วัฒนธรรม (นวัตกรรม)"
 lesson_basics_culture_innovations_open_desc:0 "[culture|E] ของท่านกำหนดว่าท่านสามารถเข้าถึง [innovations|E] ใดได้บ้าง ซึ่งแสดงในแท็บนวัตกรรม"
 lesson_basics_culture_open_innovations_tab_trigger:0 "เปิดแท็บนวัตกรรม (เน้นสี)"

 lesson_basics_culture_innovations:0 "วัฒนธรรม (นวัตกรรม)"
 lesson_basics_culture_innovations_desc:0 "[innovations|E] คือสิ่งประดิษฐ์และการปรับตัวที่ [culture|E] สามารถค้นพบได้เมื่อเวลาผ่านไป $game_concept_innovations$ ให้โบนัสใหม่ [buildings|E] และ [men_at_arms|E] สำหรับสมาชิกทุกคนของ $game_concept_culture$\n\nนวัตกรรมถูกจัดกลุ่มเป็น [eras|E] ดังนั้นนวัตกรรมส่วนใหญ่จึงไม่สามารถใช้ได้ในช่วงต้นของเกม [SelectLocalization( GetPlayer.IsValid, 'lesson_basics_culture_innovations_desc_INGAME', '' )]"
 lesson_basics_culture_innovations_desc_INGAME:0 "วัฒนธรรมของท่านอยู่ในยุค [GetPlayer.GetCulture.GetCultureEra.GetName] ในขณะนี้"

 lesson_basics_culture_innovations_spread:0 "วัฒนธรรม (นวัตกรรม)"
 lesson_basics_culture_innovations_spread_desc:0 "[innovations|E] มักจะถูกค้นพบอย่างช้า ๆ อย่างไรก็ตาม [culture_head|E] ยังสามารถ ทำให้ [culture|E] ค้นพบนวัตกรรมได้เร็วขึ้น โดยเลือกให้เป็น [fascination|E] ของวัฒนธรรม (เน้นสี)\n\n#I เมื่อท่านเป็นประมุขวัฒนธรรม ท่านสามารถคลิกที่นวัตกรรมเพื่อตั้งให้เป็นความหลงใหลใหม่ได้#!\n\nวัฒนธรรมยังค้นพบนวัตกรรมได้เร็วขึ้นหากวัฒนธรรมเพื่อนบ้านค้นพบแล้ว"

# Religion
 lesson_basics_religion_1:1 "ความเชื่อและศาสนา"
 lesson_basics_religion_1_read_only:0 "$lesson_basics_religion_1$"
 lesson_basics_religion_1_desc:2 "[characters|E] ทุกคนเชื่อใน [faith|E] ซึ่งในทางกลับกันเป็นส่วนหนึ่งของ [religion|E] ตัวอย่าง เช่น คาทอลิกเป็น $game_concept_faith$ ซึ่งเป็นส่วนหนึ่งของ $christianity_religion$\n\nทุก $game_concept_faith$ แตกต่างจาก $game_concept_faith$ อื่น ๆ ทั้งหมด — มาดูกันใกล้ ๆ"
 lesson_basics_religion_click_religion_tt:1 "เปิดมุมมองความเชื่อ (เน้นสี)"
 lesson_basics_religion_2:0 "หลักคำสอน ($lesson_basics_religion$)"
 lesson_basics_religion_2_desc:2 "[faith|E] ของท่านมี [doctrines|E] จำนวนหนึ่ง $game_concept_doctrines$ เหล่านี้กำหนดกฎสำหรับสมาชิกของ $game_concept_faith$ และควบคุมหลายสิ่งหลายอย่าง เช่น [succession_laws|E] เพศที่มีอยู่ หรือตัวละครใดสามารถถือครอง [temple_holdings|E] ได้\n\n[core_tenets|E] ที่ด้านบน เป็น $game_concept_doctrines$ พิเศษที่ให้โบนัสหรือตัวเลือกสำหรับตัวละครของท่าน เช่น ความสามารถในการทำสมาธิหรือเข้าร่วมใน [great_holy_wars|E]\n\n#TUT ความเชื่อทั้งหมดมี [sins|E] และ [virtues|E] ด้วย ซึ่งบ่งบอกถึงพฤติกรรมที่ถูกตำหนิหรือเฉลิมฉลองโดยคนรอบข้าง#!"
 lesson_basics_religion_3:0 "@fervor_icon! ความแรงกล้า ($lesson_basics_religion$)"
 lesson_basics_religion_3_desc:1 "[faiths|E] ทั้งหมดมี [fervor|E] ซึ่งเพิ่มขึ้นและลดลงเมื่อเวลาผ่านไป ขึ้นอยู่กับจำนวนผู้นับถือ $game_concept_faith$ สถานการณ์ [holy_wars|E] และอื่น ๆ $game_concept_fervor$ แสดงถึงความคลั่งไคล้ของสมาชิกส่วนใหญ่ของ $game_concept_faith$ ในปัจจุบัน รวมถึงชาวนาที่ไม่ได้รับการชำระล้างจำนวนมากทั่วโลก\n\nเมื่อ $game_concept_fervor$ ของ $game_concept_faith$ ของท่านสูง จะง่ายต่อการเปลี่ยน [counties|E] (โดยใช้ [convert_county|E]) มานับถือ $game_concept_faith$ ของท่าน และ $game_concept_counties$ ที่นับถือ $game_concept_faith$ ของท่านจะ #EMP ต่อต้าน#! การเปลี่ยนไปนับถือ $game_concept_faiths$ อื่น ๆ\n\nอย่างไรก็ตาม เมื่อ $game_concept_fervor$ ต่ำ $game_concept_rulers$ อาจตัดสินใจละทิ้ง $game_concept_faith$ ปัจจุบันของตนเพื่อหันไปนับถือศาสนาอื่นจาก [religion|E] เดียวกัน ก่อให้เกิด [heresy|E]\n\n#TUT $game_concept_rulers$ นอกรีตจะเปลี่ยนศาสนาพร้อมกับดินแดนและข้าหลวงที่ใกล้ชิดที่สุด และมีอิสระที่จะเผยแพร่ $game_concept_faith$ ใหม่ของตนแทนที่ศาสนาเดิม#!"
 lesson_basics_religion_4:0 "ความเชื่อใหม่ ($lesson_basics_religion$)"
 lesson_basics_religion_4_no_GUI_highlight:0 "$lesson_basics_religion_4$"
 lesson_basics_religion_4_desc:1 "จากมุมมอง [faith|E] เป็นไปได้ที่จะสร้าง $game_concept_faith$ ใหม่ของท่านเอง [doctrines|E] และ [core_tenets|E] จะมีค่าใช้จ่าย [piety|E] จำนวนหนึ่ง ขึ้นอยู่กับว่า $game_concept_core_tenets$ ใดที่ $game_concept_faith$ ปัจจุบันของท่านมี\n\nนี่ไม่ใช่สิ่งที่ต้องกังวลสำหรับ [character|E] คนแรกของท่าน แต่มันอาจเป็นเป้าหมายแรกที่สนุกมากที่จะพยายาม ทำให้สำเร็จเมื่อท่านรู้สึกมั่นใจมากขึ้น!\n\n#TUT [family_members|E] และ [vassals|E] ที่มี [opinion|E] สูงต่อท่านมีแนวโน้มที่จะเข้าร่วม $game_concept_faith$ ใหม่ของท่าน และทักษะ [learning|E] ที่สูงสามารถโน้มน้าวคนอื่น ๆ ได้อีกมาก แต่ใครก็ตามที่นับถือ $game_concept_faith$ เดิมของท่านที่ไม่เปลี่ยนศาสนาจะถือว่าท่านเป็นพวกนอกรีต#!"

# War
 lesson_basics_warfare:0 "สงคราม ($lesson_basics_war$)"
 lesson_basics_warfare_desc:1 "[war|E] เป็นส่วนสำคัญของ Crusader Kings III มีแนวคิดมากมายที่ต้องครอบคลุม แต่สำหรับตอนนี้ มาพูดถึงบางส่วนสั้น ๆ กันก่อน\n\n#TUT ส่วนที่เหลือและรายละเอียด เราจะให้ท่านค้นพบเมื่อท่านเริ่มเล่น#!"
 lesson_basics_levies:0 "สงคราม ($lesson_basics_war$)"
 lesson_basics_levies_complete:0 "$lesson_basics_levies$"
 lesson_basics_levies_desc:2 "เหตุการณ์ที่สำคัญที่สุดในสงครามใด ๆ คือ [battles|E] ซึ่งต่อสู้โดย [armies|E] ทหารส่วนใหญ่ของท่านจะมาจาก [levies|E] แต่ท่านสามารถขยาย $game_concept_army$ ของท่านได้โดยการจ้าง [men_at_arms|E]\n\n#TUT หากสถานการณ์ยากลำบากจริง ๆ ท่านยังสามารถจ้าง [mercenaries|E] ได้ — หากท่านมี [gold|E]#!"
 lesson_basics_military_view_tt:1 "เปิดมุมมองการทหาร (เน้นสี)"
 lesson_basics_rally_points:0 "สงคราม ($lesson_basics_war$)"
 lesson_basics_rally_points_desc:2 "เมื่อ [war|E] เริ่มต้น ท่านสามารถระดม [armies|E] ของท่านได้ด้วยการคลิกเพียงครั้งเดียวที่ปุ่มสีแดงขนาดใหญ่ "$RAISE_ALL$" ที่จะปรากฏขึ้นพร้อมกับไอคอน $game_concept_war_score$ ที่มุมล่างขวาของหน้าจอ — ท่านสามารถ $RAISE_ALL$ จากมุมมองการทหารนี้ได้ เช่นกัน\n\nเมื่อ $game_concept_war$ สิ้นสุดลง ท่านต้องยุบกองทหารของท่านก่อนที่จะเริ่ม $game_concept_war$ อื่น\n\n#TUT [rally_points|E] คือพื้นที่ชุมนุมสำหรับ [levies|E] และ [men_at_arms|E] ภายใต้คำสั่งของท่าน นี่คือที่ที่พวกเขาจะปรากฏตัวเมื่อถูกเรียกเข้าร่วมสงคราม#!"
 lesson_basics_casus_belli:0 "สงคราม ($lesson_basics_war$)"
 lesson_basics_casus_belli_desc:1 "ในการเริ่ม [war|E] ท่านจะต้องมีเหตุผลที่ถูกต้องตามกฎหมาย ซึ่งคือ [casus_belli|E] ต่อ [ruler|E] อื่น\n\nมีหลายวิธีในการได้รับ $game_concept_casus_belli$: ท่านอาจมี [titles|E] [de_jure|E] ที่ ทำให้ท่านเป็น [rightful_liege|E] ของเป้าหมายของท่าน ท่านอาจสืบทอด [claims|E] หรือท่านอาจดำเนิน [holy_wars|E] ต่อต้านพวกนอกรีตที่อยู่ใกล้เคียง\n\nแม้ว่าสิ่งเหล่านี้จะเป็นเรื่องธรรมดาที่สุด แต่ก็มี $game_concept_casus_belli$ ประเภทต่าง ๆ มากมายให้ท่านค้นพบและใช้ขณะเล่น!\n\n#TUT วิธีที่ง่ายและตรงไปตรงมาที่สุดในการได้รับ $game_concept_claims$ คือการใช้ #EMP [fabricate_claim|E]#! นี่คือสิ่งที่ [court_chaplain|E] ของท่านดูแล ผ่านหนึ่งใน [councillor_tasks|E] ของเขา#!"

# UNPAUSING!! :D Do this when the player is actually supposed to unpause
 lesson_basics_pausing_2:0 "เกือบถึงแล้ว ($lesson_basics_unpause$)"
 lesson_basics_pausing_2_desc:1 "อีกไม่นาน เราจะให้ท่านยกเลิกการหยุดเกมชั่วคราว! มีเพียงไม่กี่อย่างที่ต้องทบทวนก่อน\n\nประการแรก สิ่งสำคัญคือต้องรู้ว่ามีห้าระดับความเร็วที่แตกต่างกันให้ท่านเล่น (กดปุ่ม 1-5 เพื่อสลับระหว่างกันได้อย่างง่ายดาย) และท่านจะสามารถหยุดชั่วคราวหรือเปลี่ยนจังหวะได้ทุกเมื่อที่ต้องการ\n\n#BOLD ประการที่สอง สำหรับเหตุการณ์สำคัญบางอย่าง เกมจะหยุดชั่วคราวอัตโนมัติให้ท่าน#!\n\n#TUT ไม่มีอะไรผิดปกติกับการเล่นที่ความเร็วต่ำ เพิ่มความเร็วเมื่อสถานการณ์เงียบสงบ หรือลดความเร็วลงเมื่อท่านเข้าสู่สงคราม\n\nโดยทั่วไป เราแนะนำให้ท่านหยุดเกมชั่วคราวเมื่อตรวจสอบเมนู หรือเมื่อท่านต้องเผชิญกับการตัดสินใจที่ยากลำบาก#!"
 lesson_basics_pausing_3:0 "การเริ่มเกม ($lesson_basics_unpause$)"
 lesson_basics_pausing_3_desc:2 "ในการเริ่มให้เวลาเดิน ให้ยกเลิกการหยุดเกมชั่วคราว (โดยใช้ #EMP Spacebar#! หรือคลิกปุ่มเล่นที่มุมล่างขวา)\n\nสิ่งนี้จะ ทำให้วัน เดือน และปีผ่านไป กองทัพที่ได้รับคำสั่งให้เดินทัพจะเคลื่อนที่ เหตุการณ์จะเกิดขึ้นบนหน้าจอ จดหมายจะถูกส่ง และ [characters|E] จะแก่ลง\n\n#TUT หาความเร็วที่สบายสำหรับท่าน — ท่านสามารถเปลี่ยนได้ตลอดเวลาในภายหลัง#!"

 # Actual Warfare
 lesson_declare_war_step_1:0 "ตอนนี้ทำอะไร?"
 lesson_declare_war_step_1_complete:0 "$lesson_declare_war_step_1$"
 lesson_declare_war_step_1_desc:1 "ตอนนี้ ในฐานะภารกิจแรก มาเตือนเพื่อนบ้านของท่าน เอิร์ลแห่ง $c_desmond$ ว่าใครคือ [rightful_liege|E] ที่แท้จริงของเขา... หากมันบังเอิญขยาย [realm|E] ของท่าน ก็ให้เป็นไป!\n\nใช้ระบบปฏิสัมพันธ์ตัวละครที่เราได้กล่าวถึงไปก่อนหน้านี้ และเลือกเขาผ่านแผนที่ ประกาศสงครามกับ [ruler|E] แห่ง $c_desmond$ ท่านควรจะมี [casus_belli|E] ที่ถูกต้องอยู่แล้ว เนื่องจาก [title|E] ของเขาเป็นส่วนหนึ่งของ $game_concept_realm$ ของท่าน [de_jure|E]\n\n#TUT เพื่อประสบการณ์ที่ลงมือปฏิบัติมากขึ้น ตอนนี้เราจะแนะนำท่านเกี่ยวกับสิ่งที่เกิดขึ้นในกระแสของสงคราม#!"
 lesson_declare_war_tt:1 "#TUT_KW ประกาศสงคราม#! กับเอิร์ล เมียร์แดค แห่ง $c_desmond$"
 lesson_raise_troops_step_1:0 "ระดมกองทัพ"
 lesson_raise_troops_step_2:0 "$lesson_raise_troops_step_1$"
 lesson_raise_troops_step_1_desc:3 "บัดนี้ท่านกำลังอยู่ใน [war|E]! ต่อไป ท่านควรระดม [armies|E] ของท่าน มีปุ่มปรากฏขึ้นที่ด้านล่างของหน้าจอเพื่อช่วยท่าน แต่ท่านก็สามารถทำสิ่งนี้ได้จากหน้าต่างการทหารของท่าน\n\n#TUT ไม่ว่า [rally_point|E] ของท่านจะอยู่ที่ใด [army|E] ของท่านก็จะไปรวมตัวกันที่นั่นและรอคำสั่งจากท่าน\n\nหมายเหตุ: ท่านจะต้องเลิกหยุดเกมชั่วคราว (กด 'Spacebar'!) เพื่อให้ $game_concept_army$ ของท่านรวบรวมกำลังพลได้มากกว่าหยิบมือ ทิ้งไว้สักสองสามวัน แล้วกองทัพจะมีกำลังเต็มอัตรา!#!"
 lesson_declare_war_step_2:0 "$lesson_declare_war_step_1$"
 lesson_raise_troops_tt:0 "ระดมกองทัพของท่าน"
 lesson_army_movement_step_1:0 "การเคลื่อนทัพ"
 lesson_army_movement_step_1_desc:2 "หากต้องการเคลื่อนย้าย [army|E] ของท่าน ให้คลิกที่ $game_concept_army$ (บนแผนที่) และคลิกขวาบนพื้นที่ที่ท่านต้องการให้ไป\n\nเพื่อที่จะชนะ [war|E] ท่านมักจะต้องยึด [realm_capital|E] ของศัตรูในการ [siege|E] ดังนั้น นี่จึงเป็นสิ่งที่ท่านควรให้ความสำคัญเมื่อทำการรุก\n\n#TUT หากท่านสั่งการ $game_concept_army$ ของท่านข้ามน้ำ มันจะ [embark|E] เปลี่ยนเป็น [fleet|E] สำหรับตอนนี้ ให้เราอยู่บนบกไปก่อน#!"
 lesson_army_purpose_step_1:0 "กองทัพ"
 lesson_army_purpose_step_1_desc:2 "ตอนนี้ [army|E] ของท่านกำลังเคลื่อนที่ มันอาจกำลังมุ่งหน้าเข้าสู่การต่อสู้กับกองกำลังศัตรู นี่อาจเป็นการเผชิญหน้าโดยตรงกับ $game_concept_armies$ อื่น ๆ หรือการเริ่มต้น [siege|E]\n\n#TUT [battles|E] จะเกิดขึ้นโดยอัตโนมัติหาก $game_concept_armies$ ที่เป็นศัตรูสองกองทัพมาพบกัน ในทำนองเดียวกัน $game_concept_sieges$ จะเกิดขึ้นเมื่อท่านวาง $game_concept_army$ ของท่านบน [holding|E] ของศัตรู\n\nนี่เป็นเวลาที่ดีที่จะ #EMP ยกเลิกการหยุดเกมชั่วคราว#! หากท่านยังไม่ได้ทำ มิฉะนั้นเวลาจะหยุดนิ่งและ $game_concept_armies$ ของท่านจะไม่เคลื่อนที่!#!"
 lesson_battle_mechanics_step_1:0 "การรบ!"
 lesson_battle_mechanics_step_1_desc:2 "ผลลัพธ์ของ [battle|E] ระหว่าง [armies|E] สองกองทัพขึ้นอยู่กับหลายสิ่ง: จำนวน [levies|E] ที่ทั้งสองฝ่ายมี [men_at_arms|E] ใด (ถ้ามี) ที่ฝ่ายใดฝ่ายหนึ่งใช้ [commanders|E] ที่เกี่ยวข้อง และแม้กระทั่ง [terrain|E] ที่ท่านกำลังต่อสู้\n\n#TUT สามารถดูรายละเอียดเพิ่มเติมได้จากมุมมองการรบ — คลิกที่ $game_concept_army$ ที่กำลังต่อสู้ของท่านเพื่อเปิดมัน#!"
 lesson_siege_mechanics_step_1:0 "การล้อม!"
 lesson_siege_mechanics_step_1_desc:4 "[army|E] ของท่านกำลังโจมตี [holding|E] ของศัตรู! คลิกไอคอนที่เน้นสี (หัวหอก!) เพื่อดูว่าสถานการณ์เป็นอย่างไร\n\nท่านต้องชนะ $game_concept_sieges$ เพื่อชนะสงครามส่วนใหญ่ เนื่องจากมันเพิ่ม [war_score|E] ของท่าน\n\nเมื่อใดก็ตามที่ $game_concept_siege$ ชนะ (ใช้เวลาโจมตีสองสามรอบ) พื้นที่จะกลายเป็น [occupied|E] เปลี่ยนรูปลักษณ์ปกติบนแผนที่จากสีทึบเป็นสีลายทาง เมื่อซูมออก"
 lesson_warscore_step_1:0 "คะแนนสงคราม"
 lesson_warscore_step_1_desc:1 "เพื่อให้ทราบว่าใครกำลังชนะใน [war|E] ท่านสามารถดู [war_score|E] ได้เสมอ ที่มุมล่างขวา มันมีค่าตั้งแต่ #N -100#! ถึง #P +100#! และเปลี่ยนแปลงตาม [battles|E] และ [sieges|E] ที่ชนะหรือแพ้ เช่นเดียวกับดินแดนที่ถูกยึดครอง\n\n#TUT ที่ #P 100#! $game_concept_war_score$ ท่านสามารถบังคับให้อีกฝ่ายยอมรับ [peace_offer|E] ของท่านได้\n\nในทางกลับกัน ที่ #N -100#! $game_concept_war_score$ #EMP พวกเขา#! สามารถบังคับ #EMP ท่าน#! ให้ยอมรับ [peace_offer|E] #EMP ของพวกเขา#! ได้#!"
 lesson_warscore_step_2:0 "ผลลัพธ์ของสงคราม"
 lesson_warscore_step_2_desc:6 "[wars|E] ทั้งหมดจบลงด้วยหนึ่งในสามวิธี:\n$EFFECT_LIST_BULLET$[victory|E]\n$EFFECT_LIST_BULLET$[white_peace|E]\n$EFFECT_LIST_BULLET$[defeat|E]\n\nผลที่ตามมาที่แน่นอนของสิ่งเหล่านี้เปลี่ยนแปลงไปขึ้นอยู่กับ [casus_belli|E]\n\n#TUT สามารถดูรายละเอียดสำหรับสงครามเฉพาะได้โดยคลิกขวาที่ [ruler|E] ศัตรูของท่านและเลือก #TUT_KW เสนอสันติภาพ#! หรือคลิกไอคอน $game_concept_war_score$ ที่มุมล่างขวาแล้วเลือกแท็บใดแท็บหนึ่งที่ด้านล่างของหน้าจอ#!"
 lesson_winning_wars_step_1:0 "ชัยชนะอยู่ใกล้แค่เอื้อม"
 lesson_winning_wars_step_1_desc:3 "[war_score] ของท่านอยู่ที่ #P +100%#!!\n\nตอนนี้ท่านสามารถบังคับใช้ข้อเรียกร้องของท่านได้โดยคลิกไอคอน $game_concept_war_score$ เพื่อเปิดมุมมองสงครามแล้วเลือกแท็บ #TUT_KW บังคับใช้ข้อเรียกร้อง#! ที่ด้านล่างของหน้าจอ\n\n#TUT ท่านยังสามารถคลิกขวาที่ [ruler|E] ศัตรูและเลือก #TUT_KW เสนอสันติภาพ#! ได้#!"
 lesson_losing_wars_step_1:0 "ความพ่ายแพ้ที่ใกล้เข้ามา"
 lesson_losing_wars_step_1_desc:2 "[war|E] นี้ไม่เป็นไปด้วยดี! อาจถึงเวลาที่จะฟ้องร้องขอ [white_peace|E]\n\nในขณะที่ $game_concept_war$ #EMP นี้#! อาจเป็นสาเหตุที่สูญหายไปแล้ว ไม่มีความเสียหายใด ๆ ในการยอมรับความพ่ายแพ้และมีชีวิตอยู่เพื่อต่อสู้อีกวัน โดยคลิกขวาที่ศัตรูของท่านและเลือก #TUT_KW สันติภาพสีขาว#! (หรือ #TUT_KW ยอมจำนน#! หากสันติภาพสีขาวไม่พร้อมใช้งาน) ในมุมมองการปฏิสัมพันธ์"
 lesson_war_final_notes_reuse:1 "\n\n#TUT บทเรียนบทช่วยสอนสิ้นสุดที่นี่ อย่างไรก็ตาม คำแนะนำจะยังคงปรากฏเป็นครั้งคราวเป็นไอคอนแจ้งเตือนที่ด้านบนของหน้าจอ คลิกการแจ้งเตือนคำแนะนำเหล่านี้เพื่อเรียนรู้เพิ่มเติมเกี่ยวกับสถานการณ์หรือระบบบางอย่างที่ท่านกำลังเผชิญอยู่!\n\nขอบคุณที่อยู่กับเรา — และขอให้โชคดี!#!"
 lesson_war_final_notes_victory_step_1:0 "ชนะสงคราม!"
 lesson_war_final_notes_victory_step_1_desc:1 "ขอแสดงความยินดีกับ [victory|E] ของท่าน!\n\nตอนนี้ท่านได้สัมผัสประสบการณ์การผ่านส่วนสำคัญของเกมแล้ว$lesson_war_final_notes_reuse$"
 lesson_war_final_notes_defeat_step_1:0 "แพ้สงคราม"
 lesson_war_final_notes_defeat_step_1_desc:1 "เราเสียใจกับ [defeat|E] ของท่านด้วย แต่โปรดมั่นใจว่าตอนนี้ท่านได้ผ่านแง่มุมที่ท้าทายของเกมแล้ว และมันจะง่ายขึ้นจากนี้ไป$lesson_war_final_notes_reuse$"
 lesson_war_final_notes_white_peace_step_1:0 "สันติภาพสีขาว"
 lesson_war_final_notes_white_peace_step_1_desc:0 "บทเรียนมากมายที่ได้เรียนรู้! สิ่งที่ท่านจะนำติดตัวไปสู่อนาคต!$lesson_war_final_notes_reuse$"
 lesson_war_final_notes_invalidated_step_1:0 "สงครามไม่ถูกต้อง"
 lesson_war_final_notes_invalidated_step_1_desc:0 "ท่านยังอยู่ที่นี่! ยอดเยี่ยม! ช่างแปลกประหลาดที่สงครามหยุดไม่ถูกต้อง$lesson_war_final_notes_reuse$"
 lesson_guided_final_notes_mission_step_1:0 "ตอนนี้ทำอะไร?"
 lesson_guided_final_notes_mission_step_1_desc:3 "มีสิ่งต่างๆ มากมายที่ท่านสามารถทำได้ตอนนี้ หลังจากที่ท่านได้ทำความคุ้นเคยกับระบบสำคัญบางส่วนแล้ว — Crusader Kings III คือการตั้งเป้าหมายของท่านเอง\n\nหากท่านต้องการคำแนะนำ เราขอแนะนำให้ท่านพยายามก้าวขึ้นเป็นกษัตริย์หรือราชินีของ $k_ireland$ ทั้งมวล! [war|E] มิใช่หนทางเดียวเท่านั้น...\n\nหรือท่านสามารถคลิกปุ่ม #bold เคล็ดลับ#! ที่ด้านบน และดูว่ามีรายการใดที่ถูกใจท่านบ้าง!"
 lesson_open_war_overview_tt:0 "เปิดภาพรวมสงคราม (เน้นสี)"
