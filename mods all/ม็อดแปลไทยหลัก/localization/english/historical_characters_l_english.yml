 nick_la_hire_desc: "มีคำอธิบายมากมายเกี่ยวกับที่มาของชื่อเล่น "ลา อีร์" บ้างก็ว่าชาวอังกฤษตั้งฉายาให้เขาว่า "เทพแห่งความโกรธเกรี้ยว" (พระพิโรธของพระเจ้า) บ้างก็ว่าเป็นคำภาษาฝรั่งเศสเก่า "hīra" หมายถึง "ความโกรธ" หรือ "ผู้โกรธเกรี้ยว" อีกทางหนึ่ง อาจเป็นไปได้ว่าชื่อของเขามาจากคำภาษาฝรั่งเศส "เม่น" ("hérisson") เพราะเขามีนิสัยเจ้าอารมณ์"
