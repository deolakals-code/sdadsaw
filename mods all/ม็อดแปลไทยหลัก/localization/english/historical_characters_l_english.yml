l_english: 
 HISTORICAL_CHARACTER_TOOLTIP: "#T ตัวละครตามประวัติศาสตร์#!\n\n#high [Character.Custom('HistoricalCharacterDesc')]#!\n\n#weak ตัวละครนี้เป็นบุคคลตามประวัติศาสตร์ แต่อาจเบี่ยงเบนไปเมื่อเทียบกับบุคคลจริงโดยอิงตาม [culture|E] และ [faith|E] ของสถานที่กำเนิดของ [Character.GetHerHis] [Character.GetSheHe|U] อาจปรากฏตัวนอกช่วงเวลาทางประวัติศาสตร์ที่โดดเด่นของ [Character.GetHerHis] เล็กน้อย ประมาณ 1-5 ปี#!"
 danger_dynasty_abandon_tt: "#X @warning_icon! ท่านจะละทิ้ง [dynasty|E] ของท่านและจะไม่สามารถกลับมาเล่นเป็นพวกเขาได้อีก!#!"
 will_wander_tt: "[historical_character.GetFullName] จะกลายเป็น [wanderer|E]"
 
 historical_char_creation_events.t: "เสียงสะท้อนแห่งประวัติศาสตร์: [historical_character.GetFullNameNicknamedNoTooltip]"
 historical_char_creation_events.desc: "[historical_character.Custom('HistoricalCharacterJobDesc')] ผู้เป็นที่รู้จักในนาม [historical_character.GetFullNameNicknamed] มีรายงานว่ากำลังพเนจรอยู่ในอาณาจักรของข้าเพื่อหางาน [historical_character.GetSheHe|U] มาจาก [birth_location.GetName] และมีลักษณะบางอย่างเกี่ยวกับ [historical_character.GetHerHim]... [historical_character.Custom('DescriptorPositiveStandalone')] แต่ก็ค่อนข้าง [historical_character.Custom('DescriptorNegativeStandalone')]\n\n\n@historical_character_icon! #weak ตัวละครนี้เป็นบุคคลตามประวัติศาสตร์:#!\n#help_light_background [historical_character.Custom('HistoricalCharacterDesc')]#!"
 historical_char_creation_events_alternative.desc: "[historical_character.Custom('HistoricalCharacterJobDesc')] ผู้เป็นที่รู้จักในนาม [historical_character.GetFullNameNicknamed] ได้สร้างชื่อเสียงให้ [historical_character.GetHerselfHimself] ในราชสำนัก [historical_character.GetSheHe|U] คือ [historical_character.Custom('DescriptorPositiveStandalone')] และแม้ข้าจะชี้ชัดไม่ได้ แต่ก็มีบางอย่างที่ไม่ธรรมดาเกี่ยวกับ [historical_character.GetHerHim]...\n\n\n@historical_character_icon! #weak ตัวละครนี้เป็นบุคคลตามประวัติศาสตร์:#!\n#help_light_background [historical_character.Custom('HistoricalCharacterDesc')]#!"
 historical_char_creation_events.1.a: "ข้าสงสัยว่าชะตากรรมใดรออยู่เบื้องหน้า [historical_character.GetHerHim]..."
 historical_char_creation_events.1.b: "[historical_character.GetWomanMan] เช่นนี้สามารถรับใช้ข้าได้เป็นอย่างดี!"
 historical_char_creation_events.1.c: "[historical_character.GetFullNameNoTooltip]? ใครจะสนใจ!"
 
 historical_char_creation_events.2.t: "การปฏิรูปศาสนา: สำเร็จ"
 historical_char_creation_events.2.desc: "[inspiration_owner.GetFullName] ใช้เวลาทั้งวันทั้งคืนนับไม่ถ้วนในการศึกษาตำรา คัมภีร์ และได้เขียนเอกสารและวิทยานิพนธ์นับไม่ถ้วน อัจฉริยภาพของ [inspiration_owner.GetHerHis|U] เป็นที่ประจักษ์ขณะที่ข้าอ่านสิ่งที่ [inspiration_owner.GetSheHe] ได้เขียน...\n\nน่าทึ่งยิ่งนัก นี่อาจเปลี่ยนแปลง #EMP ทุกสิ่ง#! ได้"
 historical_char_creation_events.2.a: "ถ้อยคำอันศักดิ์สิทธิ์เหล่านี้ต้องได้รับการแบ่งปัน!"
 religious_reformer_modifier: "นักปฏิรูปศาสนา"
 religious_reformer_modifier_desc: "ด้วยความช่วยเหลือจากผู้มีปัญญาอันยิ่งใหญ่ ตัวละครนี้พร้อมที่จะสร้างความเชื่อใหม่\n\nตัวปรับ แต่งนี้จะถูกลบออกหากมีการสร้าง [faith|E] ใหม่"
 mass_conversion_tt: "มอบสิทธิ์ใช้ [decision|E] #V $legendary_conversion$#! หนึ่งครั้ง"
 religious_inspiration: "แรงบันดาลใจทางศาสนา"
 religious_inspiration_desc: "ตัวละครที่มีแรงบันดาลใจทางศาสนาจะได้รับ [inspired|E] ให้ทุ่มเททั้งหัวใจและจิตวิญญาณในการค้นคว้าความซับซ้อนและความลึกลับของ [faith|E] พวกเขามักเป็นนักปฏิรูปผู้ยิ่งใหญ่หรือผู้นำขบวนการทางศาสนา แรงบันดาลใจนี้ #EMP หายากยิ่ง#!นัก"
 
 historical_character.karunakara: "กรุณากระ เป็นแม่ทัพผู้มีชื่อเสียงของพระเจ้ากุโลตตุงคะแห่งโจฬะ และได้บดขยี้ทั้งศัตรูและผู้ทรยศต่ออุดมการณ์ของโจฬะ ชีวิตของกรุณากระได้รับการบรรยายไว้ในบทกวี กลิงกัตตุปารณี ซึ่งยกย่องการครอบครองกลิงคะและการถวายความเคารพต่อกุโลตตุงคะในเวลาต่อมา"
 historical_character.sekkilhar: "ในฐานะเด็กอัจฉริยะ เสกกีฬระ ได้รับการคัดเลือกตั้งแต่อายุยังน้อยโดยพระราชากุโลตตุงคะให้เป็นรัฐมนตรีและรัฐบุรุษผู้ทรงคุณค่า เสกกีฬระเป็นที่รู้จักมากที่สุดจากการเขียน เปริยะ ปุราณัม ซึ่งเป็นเรื่องราวชีวิตของนายานาร์ (นักบุญไศวะ) 63 ท่าน ใน 4253 บท ในที่สุด เสกกีฬระเองก็ได้กลายเป็นเทพเจ้าในขบวนแห่ในภูมิภาคนี้"
 historical_character.omar_khayyam: "โอมาร์ คัยยาม เป็นพหูสูต กวี นักคณิตศาสตร์ และนักดาราศาสตร์ชาวเปอร์เซียในศตวรรษที่ 11 เป็นที่รู้จักดีที่สุดในปัจจุบันจากบทกวีของเขา ซึ่งรวบรวมไว้ใน "รุไบยาต" เขามีส่วนสำคัญในการพัฒนาพีชคณิตและดาราศาสตร์ในเปอร์เซีย ผลงานทางวิชาการของเขาเกี่ยวกับการจำแนกและการแก้สมการกำลังสามถือเป็นความสำเร็จอันยิ่งใหญ่ในวิชาคณิตศาสตร์"
 historical_character.bhaskaracharya: "ภาสกราจารย์ เป็นนักคณิตศาสตร์และนักดาราศาสตร์ชาวอินเดียในศตวรรษที่ 12 ผู้เขียนผลงานชิ้นเอก "สิทธานตะ ศิโรมณี" ตำราฉบับสมบูรณ์นี้ครอบคลุมหัวข้อต่างๆ เช่น เลขคณิต พีชคณิต คณิตศาสตร์ของดาวเคราะห์ และตรีโกณมิติทรงกลม ผลงานของเขาเกี่ยวกับแคลคูลัสเกิดขึ้นก่อนนิวตันและไลบ์นิซกว่าห้าศตวรรษ"
 historical_character.joseph_rabban: "โยเซฟ รับบัน เป็นบุคคลสำคัญในชุมชนชาวยิวแห่งมาลาบาร์ในศตวรรษที่ 9 กษัตริย์เจระได้มอบสิทธิ์และสิทธิพิเศษแก่เขาสำหรับชุมชนชาวยิวในโคชิน และความเป็นผู้นำของรับบันช่วยเสริมสร้างสถานะและอิทธิพลของชาวยิวในอินเดียตอนใต้ การกระทำของเขารับประกันความเป็นอิสระและความเคารพต่อการมีส่วนร่วมทางการค้าและวัฒนธรรมของพวกเขา"
 historical_character.atisha: "หนึ่งในนามที่ยิ่งใหญ่ที่สุดในพุทธศาสนายุคกลาง อติชา เป็นผู้นำทางศาสนาเดิมมาจากเบงกอล แต่มีความสัมพันธ์อย่างแน่นแฟ้นกับอารามวิกรมศิลาในแคว้นพิหาร ผ่านผลงานของท่าน ท่านมีส่วนรับผิดชอบในการเผยแพร่พุทธศาสนานิกายมหายานและวัชรยานไปทั่วเอเชียตะวันออกเฉียงใต้และทิเบต"
 historical_character.hemachandra: "เหมจันทระ เป็นนักปราชญ์ พหูสูต และนักบวชเชนชาวอินเดียในศตวรรษที่ 12 เขามีส่วนสำคัญในการพัฒนาคณิตศาสตร์ ไวยากรณ์ ฉันทลักษณ์ และปรัชญา "สิทธเหม" ของเหมจันทระเป็นผลงานสำคัญในวรรณกรรมเชน และคำสอนของเขามีอิทธิพลอย่างมากต่อการศึกษาและการปฏิบัติของศาสนาเชน"
 historical_character.kshemendra: "เกษเมนทระ เป็นกวีและนักปราชญ์ชาวแคชเมียร์ในศตวรรษที่ 11 มีความสามารถหลากหลายในการสร้างสรรค์วรรณกรรม ซึ่งครอบคลุมงานเสียดสี การล้อเลียน และตำราทางศาสนา ผลงานเด่นของเขา ได้แก่ "สมยมัตฤกา" และ "ทรรปทลนะ" ซึ่งวิพากษ์วิจารณ์ขนบธรรมเนียมในยุคของเขาอย่างมีอารมณ์ขัน ทำให้เขาเป็นบุคคลที่มีเอกลักษณ์ในวรรณคดีสันสกฤตคลาสสิก"
 historical_character.akka_mahadevi: "อักกะ มหาเทวี เป็นกวีภาษากันนาดาในศตวรรษที่ 12 และเป็นบุคคลสำคัญในขบวนการภักติของนิกายลัทธิลิงคายัต เป็นที่รู้จักจากวจนะหรือบทกวีของนาง นางดำเนินตามเส้นทางแห่งการอุทิศตนทางจิตวิญญาณและการหลุดพ้น ท้าทายบรรทัดฐานทางสังคมด้วยการละทิ้งชีวิตทางโลกและสนับสนุนความเท่าเทียมและการเสริมพลังของผู้หญิงในการปฏิบัติทางจิตวิญญาณ"
 historical_character.namdev: "นามเทพ เป็นนักบุญและกวีภาษามราฐีในศตวรรษที่ 13 เป็นที่รู้จักจากบทเพลงอุทิศตนแด่วิโฐบา และเป็นบุคคลสำคัญในขบวนการภักติในมหาราษฏระ เป็นที่นิยมในหมู่สามัญชน ผลงานของท่านยังช่วยเพิ่มการแพร่กระจายและเกียรติภูมิของภาษามราฐีในฐานะภาษาแห่งบทกวีและศาสนาอย่างมาก"
 historical_character.madhvacharya: "มัธวาจารย์ เป็นนักปรัชญาชาวอินเดียในศตวรรษที่ 13 และเป็นผู้เสนอหลักสำคัญของสำนักทไวตะแห่งเวทานตะ เขาสอนว่าอาตมัน (วิญญาณ) และความเป็นจริงสูงสุด (พรหมัน) นั้นแตกต่างกัน ซึ่งขัดแย้งอย่างสิ้นเชิงกับปรัชญาอทไวตะที่แพร่หลายในขณะนั้น งานเขียนและการโต้วาทีของเขามีอิทธิพลอย่างมากต่อเทววิทยาฮินดู"
 historical_character.vidyapati: "วิทยปติ เป็นกวีและนักปราชญ์จากแคว้นพิหาร อินเดีย ในศตวรรษที่ 14 เขาได้รับการยกย่องจากบทเพลงรักและบทสวดสรรเสริญที่อุทิศแด่พระศิวะ ซึ่งมีอิทธิพลอย่างลึกซึ้งต่อขบวนการภักติ ผลงานของเขาได้รับการเฉลิมฉลองในด้านความงามทางภาษาและการแสดงออกทางอารมณ์ที่ลึกซึ้ง"
 historical_character.abhinavagupta: "อภินวคุปตะ เป็นนักปรัชญาและผู้มีญาณทิพย์ชาวอินเดียจากแคชเมียร์ในศตวรรษที่ 10-11 เขาได้รับการยกย่องว่าเป็นหนึ่งในนักปราชญ์ที่ยิ่งใหญ่ที่สุดของไศวนิกายอทไวตะ ผลงานของอภินวคุปตะมีอิทธิพลต่อปรัชญาฮินดู โดยเฉพาะทฤษฎีเกี่ยวกับสุนทรียศาสตร์และจิตวิญญาณในอรรถกถาของเขา "อภินวภารตี""
 historical_character.basava: "พสวะ เป็นนักปรัชญาและนักปฏิรูปสังคมชาวอินเดียในศตวรรษที่ 12 ผู้ก่อตั้งขบวนการลัทธิลิงคายัต คำสอนของเขาท้าทายระบบวรรณะแบบดั้งเดิมและเน้นการอุทิศตนแด่องค์พระศิวะ วจนะหรือบทกวีของพสวะ สนับสนุนความเท่าเทียมทางจิตวิญญาณและหล่อหลอมขบวนการภักติ แนวคิดของเขาส่งผลกระทบอย่างมากต่อสังคมและศาสนาอินเดียยุคกลาง"
 historical_character.hildegard: "ฮิลเดการ์ด ฟอน บิงเงน เป็นอธิการิณี ผู้มีญาณทิพย์ นักเขียน และนักประพันธ์ผู้มีความคิดก้าวหน้า มีชื่อเสียงจากนิมิตทางศาสนาและผลงานทางวิชาการ นางประพันธ์ตำราเกี่ยวกับเทววิทยา การแพทย์ และดนตรี ซึ่งมีส่วนช่วยในการพัฒนาความคิดของศาสนาคริสต์ยุคกลาง ฮิลเดการ์ดยังเป็นที่รู้จักจากบทประพันธ์ทางศาสนาและบทละคร โดยเน้นการเยียวยาทางจิตวิญญาณและแบบองค์รวม"
 historical_character.thomas_aquinas: "โธมัส อควีนาส เป็นนักเทววิทยาและนักปรัชญาในคณะโดมินิกัน มีชื่อเสียงจากการผสมผสานปรัชญาอริสโตเติลเข้ากับเทววิทยาคริสเตียนในผลงาน "ซุมมา เตโอโลจิกา" เขาเป็นผู้สนับสนุนความเข้ากันได้ของเหตุผลและศรัทธา ซึ่งส่งผลกระทบอย่างมากต่อหลักคำสอนของศาสนาคริสต์ กฎหมายธรรมชาติ และจริยธรรม มรดกของอควีนาสยังคงอยู่ใฐานะนักบุญผู้ได้รับการ แต่งตั้งและนักปราชญ์แห่งคริสตจักร"
 historical_character.dante_alighieri: "ดันเต อาลีกีเอรี เป็นกวีชาวอิตาลีมีชื่อเสียงจาก "เดอะ ดีไวน์ คอมเมดี" มหากาพย์การเดินทางผ่านนรก แดนชำระ และสวรรค์ ผลงานของเขามีผลกระทบยาวนานต่อวรรณกรรมตะวันตกและเทววิทยาคริสเตียน การสำรวจศีลธรรมและธรรมชาติของมนุษย์ ทำให้ดันเตได้รับฉายา "บิดาแห่งภาษาอิตาลี""
 historical_character.thomas_becket: "โธมัส เบ็กเกต เป็นอาร์ชบิชอปและมรณสักขีชาวอังกฤษ เป็นที่รู้จักดีที่สุดจากความขัดแย้งกับพระเจ้าเฮนรีที่ 2 เกี่ยวกับสิทธิ์ของคริสตจักร การปกป้องอำนาจของศาสนจักรอย่างแข็งขันนำไปสู่การฆาตกรรมเขาในอาสนวิหารแคนเทอร์เบอรีในปี 1170 การพลีชีพของเบ็กเกต ทำให้สถานะนักบุญของเขามั่นคงขึ้น โดยศาลเจ้าของเขาที่แคนเทอร์เบอรีกลายเป็นสถานที่แสวงบุญที่สำคัญ"
 historical_character.maimonides: "ไมโมนิเดส เป็นนักปรัชญาและนักปราชญ์ชาวยิวในศตวรรษที่ 12 เขาเป็นที่รู้จักดีที่สุดจากผลงาน "มิชเนห์ โทราห์" ซึ่งเป็นการประมวลกฎหมายยิว และ "คู่มือสำหรับผู้สับสน" ซึ่งกล่าวถึงความสัมพันธ์ระหว่างศาสนาและปรัชญา เขาได้รับการยกย่องว่าเป็นหนึ่งในนักคิดชาวยิวที่มีอิทธิพลมากที่สุดในประวัติศาสตร์"
 historical_character.chretien_de_troyes: "เรื่องราวของเครเตียง เดอ ทรัวส์ ซึ่งเขียนเป็นภาษาฝรั่งเศสเก่า มีบทบาทสำคัญในการพัฒนาตำนานกษัตริย์อาเธอร์ การนำเสนอความรักแบบเทิดทูน (courtly love) และจอกศักดิ์สิทธิ์ในผลงานต่างๆ เช่น "ลานเซลอต อัศวินแห่งเกวียน" และ "เพอร์ซิวาล เรื่องราวแห่งจอกศักดิ์สิทธิ์" มีอิทธิพลต่อวรรณกรรมอัศวิน งานเขียนของเขาเน้นย้ำถึงรูปแบบของอัศวิน วีรกรรม และความรักแบบเทิดทูน"
 historical_character.egil_skallagrimrsson: "กวีนักรบชาวไอซ์แลนด์ผู้มีชื่อเสียง เอกิล สกัลลาคริมส์ซอน เป็นตัวละครหลักใน "เอกิลส์ ซากา" เป็นที่รู้จักจากอารมณ์ที่รุนแรงและความสามารถทางกวี เขาเป็นที่จดจำจากการกระทำที่รุนแรง บทกวีที่ทรงพลัง และบทบาทสำคัญในการตั้งถิ่นฐานยุคแรกของไอซ์แลนด์และการบุกปล้นของไวกิ้งในอังกฤษ"
 historical_character.gunnlaug_ormstunga: "กุนน์เลาก์ ออร์มสตุงกา ตัวเอกของ "กุนน์เลากส์ ซากา ออร์มสตุงกู" เป็นกวีนักรบไวกิ้งที่รู้จักจากการเดินทางและการแข่งขันทางกวี ซากาเล่าถึงเรื่องราวความรักอันน่าเศร้าและการต่อสู้กับคู่แข่งทางกวี จับภาพพลวัตของเกียรติยศและชื่อเสียงในสังคมไวกิ้ง"
 historical_character.torbjorg_the_seeress: "ทอร์บยอร์ก ผู้ทำนายหญิง เป็นบุคคลผู้พยากรณ์ที่ปรากฏใน "ซากาของอีริกผมแดง" เป็นที่รู้จักจากการปฏิบัติสปา (การพยากรณ์) และไซดร์ (เวทมนตร์นอร์ส) นางมีบทบาทสำคัญในการทำนายเหตุการณ์ในอนาคต โดยการปรากฏตัวในพิธีกรรมในซากาสะท้อนความเชื่อของชาวนอร์สในพลังแห่งการพยากรณ์"
 historical_character.erik_rode: "อีริก โรเด หรือที่รู้จักในนาม อีริกผมแดง เป็นนักสำรวจไวกิ้งและผู้ก่อตั้งถิ่นฐานชาวนอร์สแห่งแรกในกรีนแลนด์ เขาเป็นที่รู้จักจากจิตวิญญาณแห่งการผจญภัยและการนำความพยายามในการตั้งอาณานิคม ก่อตั้งชุมชนที่จะคงอยู่ต่อไปอีกหลายศตวรรษ"
 historical_character.alhazen: "ฮะซัน อัล-ฮัยษัม เป็นนักคณิตศาสตร์และนักฟิสิกส์ชาวอาหรับในศตวรรษที่ 11 มีชื่อเสียงจากผลงานด้านทัศนศาสตร์ หนังสือของเขา "กิตาบ อัล-มะนาซิร" ("ตำราทัศนศาสตร์") ได้วางรากฐานหลักการของทัศนศาสตร์สมัยใหม่และมีอิทธิพลต่อวิทยาศาสตร์ตะวันตกในยุคกลาง เขาเป็นที่จดจำจากแนวทางการทดลองที่เข้มงวดและการมีส่วนร่วมที่สำคัญต่อยุคทองของอิสลาม"
 historical_character.ibn_battuta: "อิบนุ บะฏูเฏาะฮ์ เป็นนักสำรวจชาวโมร็อกโกในศตวรรษที่ 14 เป็นที่รู้จักจากการเดินทางที่กว้างขวาง ครอบคลุมระยะทางกว่า 120,000 กิโลเมตรทั่วโลกอิสลามและไกลกว่านั้น บันทึกการเดินทางของเขา "ริห์ละฮ์" ให้ข้อมูลเชิงลึกอย่างละเอียดเกี่ยวกับวัฒนธรรมและสังคมยุคกลาง ทำให้เขาเป็นหนึ่งในนักเดินทางที่มีชื่อเสียงที่สุดในประวัติศาสตร์"
 historical_character.william_of_ockham: "วิลเลียมแห่งอ็อกคัม เป็นนักปรัชญาและนักเทววิทยาชาวอังกฤษในศตวรรษที่ 14 มีชื่อเสียงจาก "มีดโกนอ็อกคัม" หลักการที่นิยมคำอธิบายที่เรียบง่ายกว่า เป็นบุคคลสำคัญในขนบธรรมเนียมสกอลัสติก เขาท้าทายอำนาจของคริสตจักรและสนับสนุนการแยกอำนาจทางโลกและศาสนา แนวคิดของเขามีอิทธิพลต่อการพัฒนาตรรกศาสตร์ วิทยาศาสตร์ และความคิดทางการเมือง"
 historical_character.geoffrey_chaucer: "เจฟฟรีย์ ชอเซอร์ เป็นกวีและนักประพันธ์ชาวอังกฤษในศตวรรษที่ 14 เป็นที่รู้จักดีที่สุดจาก "เดอะ แคนเทอร์เบอรี เทลส์" ชุดเรื่องเล่าเกี่ยวกับการเดินทางแสวงบุญไปยังแคนเทอร์เบอรี ผลงานของเขาได้รับการยกย่องจากตัวละครที่สดใส อารมณ์ขัน และการสำรวจสังคมยุคกลาง การมีส่วนร่วมของชอเซอร์ต่อวรรณคดีอังกฤษ ทำให้เขาได้รับฉายา "บิดาแห่งกวีนิพนธ์อังกฤษ""
 historical_character.aaron_of_lincoln: "แอรอนแห่งลินคอล์น เป็นนักการเงินและผู้ให้กู้ยืมเงินชาวยิวชาวอังกฤษในศตวรรษที่ 12 เป็นที่รู้จักจากการเป็นหนึ่งในชาวยิวที่ร่ำรวยที่สุดในอังกฤษยุคกลาง เขาให้เงินกู้จำนวนมากแก่ขุนนางและคริสตจักรสำหรับโครงการก่อสร้าง รวมถึงอาสนวิหารต่างๆ หลังจากการเสียชีวิตของเขา พระเจ้าเฮนรีที่ 2 ได้ยึดทรัพย์สินมหาศาลของเขา"
 historical_character.john_wycliffe: "จอห์น วิคลิฟฟ์ เป็นนักเทววิทยาและนักปฏิรูปชาวอังกฤษในศตวรรษที่ 14 เป็นที่รู้จักจากการวิพากษ์วิจารณ์แนวปฏิบัติของคริสตจักรคาทอลิกในช่วงแรก เขาสนับสนุนการแปลพระคัมภีร์เป็นภาษาอังกฤษ วางรากฐานสำหรับการปฏิรูปโปรเตสแตนต์ คำสอนของวิคลิฟฟ์ ซึ่งตั้งคำถามถึงอำนาจของคริสตจักร มีอิทธิพลต่อขบวนการลอลลาร์ดและนักปฏิรูปในภายหลัง เช่น มาร์ติน ลูเทอร์"
 historical_character.roger_bacon: "โรเจอร์ เบคอน เป็นนักปรัชญาและไฟรอาร์คณะฟรันซิสกันชาวอังกฤษในศตวรรษที่ 13 ได้รับการยอมรับจากการสนับสนุนวิธีการทางวิทยาศาสตร์ในช่วงแรก เขาเน้นการสังเกตและการทดลองในการศึกษาของเขา ซึ่งมีส่วนช่วยในการพัฒนาวิทยาศาสตร์เชิงประจักษ์ ผลงานของเบคอนในด้านทัศนศาสตร์และการเล่นแร่แปรธาตุมีอิทธิพลต่อนักปราชญ์ในภายหลังในยุคกลาง"
 historical_character.heloise_dargenteuil: "เอลออีซ ดาร์ฌ็องเตย เป็นอธิการิณีและนักปราชญ์ชาวฝรั่งเศสในศตวรรษที่ 12 เป็นที่รู้จักดีที่สุดจากการติดต่อทางจดหมายกับปีเตอร์ อเบลาร์ด จดหมายของนางมีชื่อเสียงในด้านเนื้อหาที่เปี่ยมด้วยอารมณ์และสติปัญญา แสดงให้เห็นถึงสติปัญญาอันลึกซึ้งและอารมณ์ที่ลึกซึ้งของนาง ต่อมาเอลออีซได้เป็นอธิการิณีแห่งอารามปารากลีต ที่ ซึ่งนางได้แสดงความเป็นผู้นำที่แข็งแกร่ง"
 historical_character.peter_abelard: "ปีเตอร์ อเบลาร์ด เป็นนักปรัชญาและนักเทววิทยาชาวฝรั่งเศสในศตวรรษที่ 12 มีชื่อเสียงจากแนวทางสกอลัสติกและความสัมพันธ์ที่เป็นที่ถกเถียงกับเอลออีซ หนังสือของเขา "Sic et Non" ใช้การให้เหตุผลเชิงวิภาษเพื่อสำรวจคำถามทางเทววิทยา ชีวิตและผลงานของอเบลาร์ดมีผลกระทบอย่างมากต่อปรัชญายุคกลาง ในขณะที่เรื่องราวความรักของเขากับเอลออีซยังคงเป็นเรื่องเล่าคลาสสิกในยุคกลาง"
 historical_character.petrarch: "เปตราก เป็นนักปราชญ์และกวีชาวอิตาลีในศตวรรษที่ 14 ได้รับการยกย่องอย่างกว้างขวางว่าเป็น "บิดาแห่งมนุษยนิยม" เขาเป็นที่รู้จักดีที่สุดจากบทกวีซอนเน็ตและบทกวีอื่นๆ โดยเฉพาะ "กันโซนิเอเร" ซึ่งเน้นไปที่ความรักที่ไม่สมหวังที่เขามีต่อเลารา ผลงานของเปตรากเป็นเครื่องมือสำคัญในการพัฒนาแนวคิดมนุษยนิยมสมัยฟื้นฟูศิลปวิทยา โดยเน้นการเรียนรู้แบบคลาสสิกและปัจเจกบุคคล"
 historical_character.christine_pizan: "คริสตีน เดอ ปิซาน เป็นนักเขียนและกวีชาวฝรั่งเศสในศตวรรษที่ 14 มีชื่อเสียงจากผลงานที่สนับสนุนสิทธิและการศึกษาของผู้หญิง นางเขียน "ตำรานครแห่งสตรี" ซึ่งท้าทายการเกลียดชังผู้หญิงในยุคของนางและเฉลิมฉลองความสำเร็จของผู้หญิง งานเขียนของคริสตีนเป็นหนึ่งในงานเขียนแรกๆ ที่กล่าวถึงความเท่าเทียมทางเพศ ทำให้เธอกลายเป็นผู้บุกเบิกแนวคิดสตรีนิยมในยุโรปยุคกลาง"
 historical_character.giotto_di_bondone: "จอตโต ดี บอนโดเน เป็นจิตรกรและสถาปนิกชาวอิตาลีในศตวรรษที่ 13-14 ได้รับการยกย่องจากการใช้มุมมองและความสมจริงในงานศิลปะที่เป็นนวัตกรรมใหม่ ผลงานของเขาเป็นการเปลี่ยนแปลงจากขนบธรรมเนียมไบแซนไทน์ที่มีรูปแบบตายตัว วางรากฐานสำหรับยุคฟื้นฟูศิลปวิทยา ภาพเฟรสโกของจอตโตในโบสถ์น้อยสโกรเวญญีในปาดัวถือเป็นผลงานชิ้นเอก ซึ่งมีอิทธิพลต่อศิลปินรุ่นต่อๆ มา"
 historical_character.fibonacci: "เลโอนาร์โด ฟีโบนัชชี เป็นนักคณิตศาสตร์ชาวอิตาลีในศตวรรษที่ 12-13 เป็นที่รู้จักดีที่สุดจากการนำระบบตัวเลขฮินดู-อาหรับมาสู่ยุโรป หนังสือของเขา "Liber Abaci" ทำให้การใช้ตัวเลขอารบิกและเลขคณิตเป็นที่นิยมในโลกตะวันตก ฟีโบนัชชียังได้รับการยอมรับจากลำดับฟีโบนัชชี แนวคิดทางคณิตศาสตร์ที่อธิบายรูปแบบที่พบในธรรมชาติและสาขาวิชาต่างๆ"
 historical_character.giovanni_boccaccio: "โจวันนี บอกกัชโช เป็นนักเขียนและกวีชาวอิตาลีในศตวรรษที่ 14 เป็นที่รู้จักดีที่สุดจากผลงาน "เดอะ เดคาเมรอน" ชุดเรื่องเล่าโดยคนสิบคนที่หนีกาฬมรณะ การเล่าเรื่องที่สดใสและการสำรวจพฤติกรรมมนุษย์ของบอกกัชโช ทำให้เขากลายเป็นบุคคลสำคัญในวรรณกรรมยุคฟื้นฟูศิลปวิทยายุคแรก ผลงานของเขามีอิทธิพลต่อนักเขียนในภายหลัง เช่น ชอเซอร์ และช่วยหล่อหลอมขนบธรรมเนียมวรรณกรรมอิตาลี"
 historical_character.snorri_sturluson: "สนอร์รี สตูร์ลูซอน เป็นนักประวัติศาสตร์ กวี และนักการเมืองชาวไอซ์แลนด์ในศตวรรษที่ 13 มีชื่อเสียงจากการประพันธ์ "ร้อยแก้วเอ็ดดา" ผลงานพื้นฐานของตำนานนอร์ส งานเขียนของเขาเป็นแหล่งข้อมูลสำคัญสำหรับความเข้าใจสมัยใหม่เกี่ยวกับมรดกนอร์ส ผลงานของสนอร์รียัง รวมถึง "เฮมสคริงลา" พงศาวดารกษัตริย์นอร์เวย์ที่ผสมผสานประวัติศาสตร์กับนิทานพื้นบ้าน"
 historical_character.hrotsvitha: "โรสวิตทา เป็นนักพรตหญิง กวี และนักเขียนบทละครชาวเยอรมันในศตวรรษที่ 10 เป็นที่รู้จักในฐานะนักเขียนบทละครหญิงคนแรกในยุคคริสเตียน เขียนจากอารามกันเดอร์สไฮม์ นางประพันธ์บทละคร บทกวี และตำนานที่ผสมผสานแก่นเรื่องคริสเตียนเข้ากับอิทธิพลคลาสสิก โดยมักเฉลิมฉลองความเข้มแข็งและสติปัญญาของผู้หญิง"
 historical_character.ramanuja: "รามานุชะ เป็นนักเทววิทยาชาวอินเดียในศตวรรษที่ 11 เป็นที่รู้จักจากบทบาทพื้นฐานในการก่อตั้งขนบธรรมเนียมศรีไวษณพ เขาสนับสนุนการอุทิศตนแด่พระวิษณุ ส่งเสริมแนวทางส่วนบุคคลและความเมตตาต่อจิตวิญญาณ การตีความเวทานตะของเขาเน้นย้ำถึงอทไวตะแบบมีคุณสมบัติ (qualified non-dualism) ซึ่งแตกต่างอย่างมากจากสำนักคิดอื่นๆ"
 historical_character.arnaldus_de_villa_nova: "อาร์นัลดุส เดอ บิลา โนบา เป็นแพทย์ นักเล่นแร่แปรธาตุ และนักปราชญ์ชาวคาตาลันในศตวรรษที่ 13 มีชื่อเสียงจากการมีส่วนร่วมในการแพทย์และเคมี เขาเป็นผู้สนับสนุนวิธีการทางวิทยาศาสตร์ในการปฏิบัติทางการแพทย์ในช่วงแรก และได้รับเครดิตจากตำราทางการแพทย์และงานเขียนเกี่ยวกับการเล่นแร่แปรธาตุจำนวนมาก ผลงานของเขามีอิทธิพลอย่างมากต่อความคิดทางการแพทย์ของยุโรปและสาขาเคมีที่กำลังเกิดขึ้นใหม่"
 historical_character.ibn_khaldun: "อิบนุ ค็อลดูน เป็นนักปราชญ์ชาวอาหรับจากตูนิสในศตวรรษที่ 14 ถือเป็นหนึ่งในบิดาแห่งสังคมวิทยาสมัยใหม่ ประวัติศาสตร์นิพนธ์ และเศรษฐศาสตร์ ผลงานที่มีชื่อเสียงที่สุดของเขาคือ "มุก็อดดิะมะฮ์" (บทนำ) เป็นความพยายามในช่วงแรกๆ ที่จะขจัดตำนานออกจากปรากฏการณ์ทางประวัติศาสตร์และสังคม และวางรากฐานในการวิเคราะห์เหตุและผล ความขัดแย้งทางสังคม และปัจจัยทางเศรษฐกิจ"
 historical_character.rumi: "รูมี เป็นกวี นักเทววิทยา และผู้มีญาณทิพย์ซูฟีชาวเปอร์เซียในศตวรรษที่ 13 มรดกทางจิตวิญญาณอันลึกซึ้งของเขาถูกสรุปไว้ในผลงานกวีนิพนธ์ โดยเฉพาะอย่างยิ่ง "มัษนาวี" ซึ่งมักถูกเรียกว่า "อัลกุรอานในภาษาเปอร์เซีย" คำสอนของรูมีเน้นย้ำถึงความรักที่ไม่มีเงื่อนไข ความอดทนอดกลั้น และการแสวงหาความจริงอันศักดิ์สิทธิ์ผ่านประสบการณ์ทางจิตวิญญาณส่วนบุคคล"
 historical_character.avicenna: "อาวิเซนนา หรือที่รู้จักในนาม อิบนุ ซีนา เป็นพหูสูตชาวเปอร์เซียผู้ได้รับการยกย่องว่าเป็นหนึ่งในแพทย์ นักดาราศาสตร์ นักคิด และนักเขียนที่สำคัญที่สุดในยุคทองของอิสลาม เขาเป็นที่รู้จักดีที่สุดจากผลงานชิ้นเอก "ตำราการเยียวยา" และ "ประมวลการแพทย์" ซึ่งใช้เป็นตำราแพทย์มาตรฐานทั้งในโลกอิสลามและยุโรปเป็นเวลาหลายศตวรรษ"
 historical_character.averroes: "อาเวอร์โรเอส (อิบนุ รุชด์) เป็นพหูสูตชาวอัลอันดะลุสในศตวรรษที่ 12 มีชื่อเสียงจากงานเขียนเกี่ยวกับปรัชญาอริสโตเติล ผลงานของเขามุ่งเน้นไปที่การผสมผสานขนบธรรมเนียมอิสลามเข้ากับปรัชญากรีกคลาสสิก ความพยายามของเขาในการหาเหตุผลให้ปรัชญา ทำให้เขากลายเป็นบุคคลสำคัญทั้งในประวัติศาสตร์ปัญญาชนอิสลามและยุโรป ซึ่งมีส่วนสำคัญต่อยุคฟื้นฟูศิลปวิทยา"
 historical_character.al_biruni: "อัลบิรูนี เป็นนักปราชญ์และพหูสูตชาวเปอร์เซียในศตวรรษที่ 11 ผู้มีส่วนสำคัญในสาขาวิทยาศาสตร์ต่างๆ รวมถึงดาราศาสตร์ คณิตศาสตร์ และภูมิศาสตร์ เขาเขียนเกี่ยวกับรัศมีของโลกอย่างกว้างขวางและรวบรวมการศึกษาที่ครอบคลุมเกี่ยวกับศาสนาและปรัชญาของอินเดียหลังจากติดตามการรุกรานของกาสนาวิยะห์"
 historical_character.rashi: "ราชิ (ชโลโม ยิตซ์หากี) เป็นรับบีชาวฝรั่งเศสในศตวรรษที่ 11 และนักปราชญ์ชาวยิวที่ได้รับการยกย่อง มีชื่อเสียงจากอรรถกถาที่ครอบคลุมเกี่ยวกับทัลมุดและพระคัมภีร์ฮีบรู ผลงานของเขามีผลกระทบอย่างลึกซึ้งและยาวนานต่อการศึกษาและกฎหมายยิว และเป็นส่วนสำคัญของการศึกษาแบบยิวดั้งเดิม"
 historical_character.yehuda_halevi: "เยฮูดา ฮาเลวี เป็นกวีและนักปรัชญาชาวยิวชาวสเปนในศตวรรษที่ 12 ได้รับการยกย่องจากบทกวีที่ซาบซึ้งและบทสนทนาทางปรัชญา ใน "เดอะ คูซารี" ฮาเลวีปกป้องความจริงทางปรัชญาของศาสนายูดาห์และแสดงความปรารถนาอย่างลึกซึ้งต่อไซอัน งานเขียนของเขาผสมผสานการอุทิศตนทางศาสนาเข้ากับขนบธรรมเนียมทางภาษาที่เข้มข้น ทำให้เขากลายเป็นบุคคลสำคัญในวรรณคดีฮีบรูยุคกลาง"
 historical_character.shaprut: "ฮัสได อิบนุ ชัปรุฏ เป็นแพทย์ นักการทูต และนักปราชญ์ชาวยิวในสเปนมุสลิมศตวรรษที่ 10 รับใช้ในฐานะคนสนิทของเคาะลีฟะฮ์ อับดุรเราะห์มานที่ 3 เขามีบทบาทสำคัญในราชสำนักทางปัญญาและการทูตของกอร์โดบา ส่งเสริมการแลกเปลี่ยนทางวัฒนธรรมระหว่างนักปราชญ์ชาวยิวและอิสลาม"
 historical_character.gersonides: "เลวี เบน เกอร์ชอน (เกอร์โซนิเดส) เป็นนักปรัชญา นักดาราศาสตร์ และนักคณิตศาสตร์ชาวยิวชาวฝรั่งเศสในศตวรรษที่ 14 มีชื่อเสียงจากแนวทางทางวิทยาศาสตร์ เขาประพันธ์ตำราที่มีอิทธิพลหลายเล่มเกี่ยวกับคณิตศาสตร์และดาราศาสตร์ เขายังเป็นที่รู้จักจากผลงานในการปรับปรุงการออกแบบเครื่องมือทางดาราศาสตร์และการสำรวจทางปรัชญาเกี่ยวกับเจตจำนงเสรีและการหยั่งรู้อันศักดิ์สิทธิ์"
 historical_character.ezra: "อับราฮัม อิบนุ เอซรา เป็นนักปราชญ์ กวี และพหูสูตชาวยิวจากสเปนในศตวรรษที่ 12 เป็นที่รู้จักจากการมีส่วนร่วมอย่างลึกซึ้งต่ออรรถกถาพระคัมภีร์ โหราศาสตร์ และคณิตศาสตร์ อิบนุ เอซราเดินทางอย่างกว้างขวางทั่วทะเลเมดิเตอร์เรเนียน มีอิทธิพลต่อวงการปัญญาชนด้วยงานเขียนของเขา"
 historical_character.gabriol: "โซโลมอน อิบนุ กาบิรอล เป็นนักปรัชญาและกวีชาวยิวจากสเปนมุสลิมในศตวรรษที่ 11 เป็นที่รู้จักจากผลงานแนวนีโอเพลโตนิสต์ โดยเฉพาะอย่างยิ่ง "Fons Vitae" ("น้ำพุแห่งชีวิต") เขาสำรวจธรรมชาติของพระเจ้าและจักรวาล ซึ่งมีอิทธิพลอย่างมากต่อความคิดของชาวยิวและคริสเตียน อิบนุ กาบิรอลยังเป็นนักเขียนกวีนิพนธ์ฮีบรูที่มีผลงานมากมาย"
 historical_character.nachmanides: "นัคมานิเดส หรือที่รู้จักในนาม โมเสส เบน นาห์มาน หรือ รัมบัน เป็นนักปราชญ์และนักเทววิทยาชาวยิวในศตวรรษที่ 13 มีชื่อเสียงจากอรรถกถาที่ลึกซึ้งเกี่ยวกับโตราห์และความเป็นผู้นำในชุมชนชาวยิวแห่งจิโรนา นัคมานิเดสปกป้องความเชื่อของชาวยิวอย่างมีชื่อเสียงในการโต้วาทีแห่งบาร์เซโลนาในปี 1263 งานเขียนและคำสอนของเขาผสมผสานกฎหมายยิว เรื่องลึกลับ และคำสอนทางจริยธรรม"
 historical_character.crescas: "ฮัสได เครสกัส เป็นนักปรัชญาชาวยิวในศตวรรษที่ 14 มีชื่อเสียงจากการท้าทายปรัชญาอริสโตเติลที่แพร่หลายในยุคของเขา เขาเป็นที่รู้จักดีที่สุดจากผลงานทางปรัชญา "Or Adonai" (แสงแห่งพระเจ้า) ซึ่งโต้แย้งมุมมองของอริสโตเติลและวางรากฐานแนวคิดสำหรับปรัชญายิวสมัยใหม่ ซึ่งมีอิทธิพลต่อนักคิด เช่น สปิโนซา"
 historical_character.saadia: "ซาอะดียะฮ์ กาโอน เป็นนักปรัชญา นักเทววิทยา และนักปราชญ์ชาวยิวในศตวรรษที่ 10 เขาดำรงตำแหน่งหัวหน้าสถาบันการศึกษาซูราอันโด่งดัง และมีชื่อเสียงจากผลงานเกี่ยวกับกฎหมายยิวและตำราปรัชญา "เอมูนอธ เว-เดออธ" (ตำราแห่งความเชื่อและความเห็น) ตำรานี้เป็นความพยายามอย่างเป็นระบบครั้งแรกในการผสมผสานเทววิทยายิวเข้ากับองค์ประกอบของปรัชญากรีก"
 historical_character.awkal: "ยูซุฟ อิบนุ 'เอาว์กัล เป็นพ่อค้าและนักเดินทางชาวยิวจากโลกอิสลามในศตวรรษที่ 10 เป็นที่รู้จักจากบันทึกโดยละเอียดเกี่ยวกับการเดินทางค้าขายของเขาข้ามทะเลเมดิเตอร์เรเนียน ตะวันออกใกล้ และบางส่วนของแอฟริกา งานเขียนของเขาให้ข้อมูลเชิงลึกอันมีค่าเกี่ยวกับแนวปฏิบัติทางการค้า ปฏิสัมพันธ์ทางวัฒนธรรม และชีวิตที่สดใสของชุมชนชาวยิวตามเส้นทางการค้าของเขา"
 historical_character.benjamin_of_tudela: "เบนจามินแห่งตูเดลา เป็นนักเดินทางและนักสำรวจชาวยิวในศตวรรษที่ 12 เขาเป็นที่รู้จักดีที่สุดจากบันทึกการเดินทาง "การเดินทางของเบนจามิน" ซึ่งบันทึกการเดินทางของเขาผ่านยุโรป เอเชีย และแอฟริกา เบนจามินให้บันทึกโดยละเอียดเกี่ยวกับชุมชนชาวยิวทั่วโลกยุคกลาง"
 historical_character.marco_polo: "มาร์โก โปโล เป็นพ่อค้า นักสำรวจ และนักเขียนชาวเวนิส ผู้เดินทางผ่านเอเชียตามเส้นทางสายไหมระหว่างปี 1271 ถึง 1295 บันทึกการเดินทางที่กว้างขวางของเขาไปยังประเทศจีนภายใต้การปกครองของกุบไลข่านได้รับการตีพิมพ์ในชื่อ "การเดินทางของมาร์โก โปโล" ซึ่ง ทำให้ชาวยุโรปได้เห็นภาพรวมของดินแดนและวัฒนธรรมเอเชียอย่างครอบคลุม"
 historical_character.bridget_of_sweden: "บริดเจตแห่งสวีเดน เป็นผู้มีญาณทิพย์และนักบุญในศตวรรษที่ 14 เป็นที่รู้จักจากนิมิตทางศาสนาที่ลึกซึ้งและการก่อตั้งคณะนักบุญบริจิด หลังจากการเสียชีวิตของสามี นางได้อุทิศชีวิตเพื่อการรับใช้ศาสนาและเดินทางแสวงบุญไปยังสถานที่ศักดิ์สิทธิ์หลายแห่ง"
 historical_character.meister_eckhart: "ไมสเตอร์ เอ็กฮาร์ต เป็นนักเทววิทยา นักปรัชญา และผู้มีญาณทิพย์ในศตวรรษที่ 13 เป็นที่รู้จักจากคำสอนที่มีอิทธิพลเกี่ยวกับธรรมชาติของพระเจ้าและความสัมพันธ์ของวิญญาณมนุษย์กับสิ่งศักดิ์สิทธิ์ คำเทศนาและงานเขียนของเขาสำรวจแก่นเรื่องของการละวาง การกำเนิดอันศักดิ์สิทธิ์ในจิตวิญญาณ และอัตลักษณ์ของการดำรงอยู่"
 historical_character.jangar: "จังการ์ เป็นวีรบุรุษในตำนานของมหากาพย์ออยรัต "มหากาพย์แห่งจังการ์" เขามีชื่อเสียงจากการสร้างเมืองแชงกรี-ลา อันน่าอัศจรรย์ และนำพาผู้คนด้วยปัญญาและความกล้าหาญ การต่อสู้กับศัตรูและการแสวงหาเพื่อฟื้นฟูสันติภาพและความเจริญรุ่งเรืองให้กับดินแดนของเขาสรุปการต่อสู้และอุดมการณ์ของชาวออยรัต"
 historical_character.zawisza: "ซาวิชา เดอะ แบล็ก เป็นอัศวินและผู้บัญชาการทหารชาวโปแลนด์ในศตวรรษที่ 15 มีชื่อเสียงในด้านความกล้าหาญและความเป็นอัศวิน ซาวิชาสร้างชื่อเสียงให้กับตนเองในยุทธการที่กรุนวาลด์ในปี 1410 และต่อมารับใช้ในราชสำนักต่างๆ เขาเสียชีวิตอย่างวีรบุรุษระหว่างการล้อมป้อมปราการโกลูบัคในปี 1428 ขณะรับใช้ในสงครามครูเสดต่อต้านจักรวรรดิออตโตมัน"
 historical_character.theophanes_the_greek: "ธีโอฟาเนส ชาวกรีก เป็นจิตรกรไบแซนไทน์ผู้โดดเด่น เขานำความลึกซึ้งทางอารมณ์ที่แสดงออกมาสู่การพัฒนาประติมานวิทยารัสเซีย ซึ่งแตกต่างจากรูปแบบไบแซนไทน์ที่เป็นทางการมากกว่า ผลงานที่โดดเด่นที่สุดของเขา ได้แก่ ภาพเฟรสโกในโบสถ์แห่งการจำแลงพระกายในโนฟโกรอด และอาสนวิหารแม่พระรับสารในมอสโก"
 historical_character.nicetas_choniates: "นิเคตัส โคนิอาเตส เป็นข้าราชการและนักประวัติศาสตร์ไบแซนไทน์ในช่วงปลายศตวรรษที่ 12 และต้นศตวรรษที่ 13 มีชื่อเสียงจากผลงาน "พงศาวดาร" เขาให้บันทึกโดยละเอียดเกี่ยวกับชีวิตและการเมืองไบแซนไทน์ตั้งแต่ปี 1118 ถึง 1207 ครอบคลุมความเสื่อมของจักรวรรดิไบแซนไทน์และเหตุการณ์ในสงครามครูเสดครั้งที่สี่"
 historical_character.michael_psellos: "มิคาเอล เซลลอส เป็นนักปรัชญา นักการเมือง และนักประวัติศาสตร์ไบแซนไทน์ในศตวรรษที่ 11 รับใช้ในฐานะข้าราชสำนักภายใต้จักรพรรดิหลายพระองค์ เซลลอสมีบทบาทสำคัญในการฟื้นฟูปรัชญาและวิทยาศาสตร์กรีกในราชสำนักไบแซนไทน์ ผลงานที่โดดเด่นที่สุดของเขา "โครโนกราเฟีย" ให้บันทึกที่เจาะลึกและละเอียดเกี่ยวกับการเมืองและชีวิตในราชสำนักไบแซนไทน์"
 historical_character.john_tzetzes: "จอห์น เซตเซส เป็นนักปราชญ์ไบแซนไทน์ในศตวรรษที่ 12 เป็นที่รู้จักจากผลงานวรรณกรรมที่กว้างขวางและความรู้กว้างขวางในวรรณคดีคลาสสิก เขาเขียนเกี่ยวกับหัวข้อทางไวยากรณ์ ประวัติศาสตร์ และตำนานอย่างกว้างขวาง โดยผลงานที่มีชื่อเสียงที่สุดของเขาคือ "คิลิอาเดส" หรือ "ตำราประวัติศาสตร์" ชุดรวมเรื่องราวทางประวัติศาสตร์และตำนานในรูปแบบบทกวี"
 historical_character.theophylact_of_ohrid: "ธีโอฟิแลกต์ เป็นอาร์ชบิชอปและนักปราชญ์ไบแซนไทน์ในศตวรรษที่ 11 ในระหว่างดำรงตำแหน่งอาร์ชบิชอปแห่งโอครีด เขามีบทบาทสำคัญในชีวิตทางศาสนาและวัฒนธรรมของภูมิภาค โดยมีอิทธิพลอย่างมากต่อเทววิทยาออร์โธดอกซ์ตะวันออก"
 historical_character.eustathius_of_thessalonica: "ยูสตาธิอุสแห่งเทสซาโลนิกา เป็นนักปราชญ์ นักเทววิทยา และอาร์ชบิชอปแห่งเทสซาโลนิกาชาวไบแซนไทน์ในศตวรรษที่ 12 มีชื่อเสียงจากการเขียนที่มากมาย ยูสตาธิอุสประพันธ์อรรถกถาโดยละเอียดเกี่ยวกับผลงานของโฮเมอร์ การดำรงตำแหน่งอาร์ชบิชอปของเขาโดดเด่นด้วยความพยายามในการสร้างและปฏิรูปบทบาทของคริสตจักรในสังคมหลังการรุกรานเทสซาโลนิกาของซิซิลี"
 historical_character.nicephorus_blemmydes: "นิเคโฟรุส เบลมมิเดส เป็นนักปราชญ์และนักเทววิทยาไบแซนไทน์ในศตวรรษที่ 13 เขาก่อตั้งโรงเรียนและอารามที่ ซึ่งเขาสอนและอาศัยอยู่เกือบตลอดชีวิต เบลมมิเดสเขียนเกี่ยวกับปรัชญา เทววิทยา และวิทยาศาสตร์อย่างกว้างขวาง พยายามที่จะประสานแนวคิดทางปรัชญาคลาสสิกเข้ากับหลักคำสอนของคริสเตียน"
 historical_character.georgius_pachymeres: "เกออร์กิอุส ปาคิเมเรส เป็นนักประวัติศาสตร์และนักปราชญ์ไบแซนไทน์ในศตวรรษที่ 13 เป็นที่รู้จักจากผลงานที่ครอบคลุม "ฮิสตอเรีย ไบแซนตินา" ซึ่งบันทึกประวัติศาสตร์ของจักรวรรดิไบแซนไทน์ตั้งแต่ปี 1255 ถึง 1308 งานเขียนของเขาให้บันทึกโดยละเอียดเกี่ยวกับการครองราชย์ของราชวงศ์ปาไลโอโลกอสและผลกระทบของการยึดครองของละติน"
 historical_character.manuel_moschopoulos: "มานูเอล โมสโคปูโลส เป็นนักปราชญ์และนักไวยากรณ์ไบแซนไทน์ในช่วงปลายศตวรรษที่ 13 และต้นศตวรรษที่ 14 เป็นที่รู้จักดีที่สุดจากผลงานในการฟื้นฟูการเรียนรู้และวรรณคดีกรีกคลาสสิก เขาเขียนเกี่ยวกับหัวข้อทางไวยากรณ์อย่างกว้างขวางและสร้างอรรถกถาเกี่ยวกับนักประพันธ์คลาสสิก โดยมีเป้าหมายเพื่อรักษาและ ทำให้ตำราโบราณกระจ่างขึ้น"
 historical_character.theodore_metochites: "บุรุษแห่งยุคฟื้นฟูศิลปวิทยาก่อนยุคฟื้นฟูศิลปวิทยา เมโตคิเตสเป็นพหูสูตผู้เก่งกาจในด้านปรัชญา ดาราศาสตร์ คณิตศาสตร์ และศิลปะ รับใช้ในฐานะหัวหน้ารัฐมนตรีภายใต้จักรพรรดิอันโดรนิคอสที่ 2 ปาไลโอโลกอส เขาเป็นที่รู้จักดีที่สุดจากการอุปถัมภ์โบสถ์โคราในคอนสแตนติโนเปิล ที่ ซึ่งเขาได้มอบหมายให้สร้างโมเสกและภาพเฟรสโกอย่างกว้างขวาง"
 historical_character.michael_choniates: "มิคาเอล โคนิอาเตส เป็นนักปราชญ์ กวี และบุคคลสำคัญทางศาสนาชาวไบแซนไทน์ในศตวรรษที่ 12 มีชื่อเสียงจากการดำรงตำแหน่งอาร์ชบิชอปแห่งเอเธนส์ตั้งแต่ปี 1182 ถึง 1204 ในช่วงเวลาที่การควบคุมของไบแซนไทน์เสื่อมลง เขาพยายามที่จะรักษาขนบธรรมเนียมทางวัฒนธรรมและปัญญาของเอเธนส์"
 historical_character.joseph_tarchaneiotes: "โยเซฟ ทาร์คาไนโอเตส เป็นแม่ทัพไบแซนไทน์ที่ปฏิบัติงานในช่วงปลายศตวรรษที่ 11 เป็นที่รู้จักเบื้องต้นจากบทบาทของเขาในการทัพทางทหารของไบแซนไทน์ต่อต้านพวกเติร์กเซลจุก รับใช้ภายใต้จักรพรรดิอเล็กซิออสที่ 1 คอมเนนอส ทาร์คาไนโอเตสมีบทบาทสำคัญในการรบที่สำคัญหลายครั้ง รวมถึงการป้องกันไนเซียที่ประสบความสำเร็จ"
 historical_character.gemistus_pletho: "เกมิสตุส เพลโธ เป็นนักปรัชญาในศตวรรษที่ 15 ผู้สนับสนุนแนวคิดนีโอเพลโตนิสต์อย่างแข็งขัน เพลโธมีบทบาทสำคัญในการฟื้นฟูทางปัญญา ซึ่งเกิดขึ้นก่อนการล่มสลายของคอนสแตนติโนเปิล เขามีบทบาทสำคัญในระหว่างสภาแห่งฟลอเรนซ์ ที่ ซึ่งเขาโต้แย้งเพื่อการรวมคริสตจักรออร์โธดอกซ์และคาทอลิกเข้าด้วยกัน"
 historical_character.arethas_of_caesarea: "อาเรทัสแห่งซีซาเรีย เป็นอาร์ชบิชอป นักปราชญ์ และนักสะสมต้นฉบับตัวเขียนกรีกโบราณที่มีผลงานมากมายในศตวรรษที่ 10 ดำรงตำแหน่งอาร์ชบิชอปแห่งซีซาเรียในคัปปาโดเกีย อาเรทัสมีส่วนสำคัญต่อชีวิตทางปัญญาและวัฒนธรรมของไบแซนเทียม ทำให้มั่นใจได้ว่าความรู้คลาสสิกที่ต่อมาจะมีอิทธิพลต่อยุคฟื้นฟูศิลปวิทยาจะอยู่รอดต่อไป"
 historical_character.basil_lekapenos: "เบซิล เลกาเปนอส เป็นขันทีและผู้บริหารผู้ทรงอำนาจ ซึ่งดำรงตำแหน่งหัวหน้ารัฐมนตรีในรัชสมัยของจักรพรรดิไบแซนไทน์หลายพระองค์ในช่วงปลายศตวรรษที่ 10 และต้นศตวรรษที่ 11 เบซิลเป็นโอรสนอกสมรสของจักรพรรดิโรมานอสที่ 1 มีอิทธิพลอย่างมากในราชสำนักไบแซนไทน์ผ่านบทบาทปาราคอยโมเมโนส หรือองคมนตรี"
 historical_character.john_the_orphanotrophos: "จอห์น ดิ ออร์ฟาโนโทรฟอส เป็นขันทีผู้มีชื่อเสียงและข้าราชสำนักผู้มีอิทธิพลในช่วงต้นศตวรรษที่ 11 ในรัชสมัยของจักรพรรดิมิคาเอลที่ 4 ในฐานะหัวหน้าออร์ฟาโนโทรฟอส ข้าราชการผู้รับผิดชอบสวัสดิการของเด็กกำพร้าและคนยากจน จอห์นได้รวบรวมอำนาจและอิทธิพลอย่างมาก"
 historical_character.samonas: "ซาโมนาส เป็นขันทีผู้มีชื่อเสียงและข้าราชสำนักผู้มีอิทธิพลในช่วงปลายศตวรรษที่ 9 และต้นศตวรรษที่ 10 ภายใต้จักรพรรดิเลโอที่ 6 ผู้ทรงปรีชา เดิมมาจากซาโมซาตา เขาก้าวขึ้นสู่ความโดดเด่นผ่านตำแหน่งปาราคอยโมเมโนส หรือองคมนตรีของจักรพรรดิ ที่ ซึ่งเขามีอำนาจอย่างมากในราชสำนักไบแซนไทน์"
 historical_character.peter_the_eunuch: "ปีเตอร์ ขันที เป็นข้าราชสำนักไบแซนไทน์ผู้โดดเด่นและที่ปรึกษาที่ไว้ใจได้ในรัชสมัยของจักรพรรดิมิคาเอลที่ 4 ในศตวรรษที่ 11 ดำรงตำแหน่งปาราคอยโมเมโนส ปีเตอร์มีบทบาทสำคัญในการสนับสนุนการขึ้นครองบัลลังก์ของมิคาเอลที่ 4 และส่งเสริมผลประโยชน์ของอารามสตูติออส"
 historical_character.constantine_the_paphlagonian: "คอนสแตนติน ชาวปาฟลาโกเนีย เป็นขันทีไบแซนไทน์และข้าราชสำนักผู้มีอิทธิพลในศตวรรษที่ 9 เขาดำรงตำแหน่งปาราคอยโมเมโนส หรือองคมนตรี ของจักรพรรดิเลโอที่ 6 ผู้ทรงปรีชา เขามีชื่อเสียงจากความพยายามในการรักษาเสถียรภาพภายในราชสำนักในช่วงเวลาของการวางอุบายทางการเมืองและการแบ่งฝักแบ่งฝ่าย"
 historical_character.peter_the_stratopedarches: "ปีเตอร์ 'สตราโตเปดาร์เคส' เป็นผู้บัญชาการทหารและขันทีผู้มีชื่อเสียงในศตวรรษที่ 10 ผู้ ซึ่ง "มีกำลังกายแข็งแรง" เขามีบทบาทสำคัญในรัชสมัยของจักรพรรดิเบซิลที่ 2 โดยเฉพาะอย่างยิ่งในระหว่างการกบฏที่นำโดยแม่ทัพบาร์ดัส สเกลรอส"
 historical_character.basilios_bessarion: "บาซิลิออส เบสซาริออน เป็นนักปราชญ์ นักปรัชญา และพระคาร์ดินัลในศตวรรษที่ 15 เบสซาริออนเปลี่ยนมานับถือศาสนาคาทอลิกและสนับสนุนการรวมคริสตจักรออร์โธดอกซ์และคาทอลิกในระหว่างสภาแห่งฟลอเรนซ์ โดยโต้แย้งว่าการเคลื่อนไหวดังกล่าวจะเสริมสร้างเอกภาพของชาวคริสต์ต่อต้านภัยคุกคามจากออตโตมันที่เพิ่มมากขึ้น"
 historical_character.demetrios_kydones: "เดเมตริออส คิโดเนส เป็นนักปราชญ์ นักแปล และนักการทูตผู้โดดเด่นในศตวรรษที่ 14 เป็นที่รู้จักจากการสนับสนุนขนบธรรมเนียมละตินและโรมันคาทอลิกภายในจักรวรรดิไบแซนไทน์ออร์โธดอกซ์ เขาแปลผลงานมากมายของโธมัส อควีนาส และนักปรัชญาสกอลัสติกละตินคนอื่นๆ เป็นภาษากรีก"
 historical_character.manuel_holobolos: "มานูเอล โฮโลโบโลส เป็นนักปราชญ์และข้าราชการในศตวรรษที่ 13 เป็นที่รู้จักจากทักษะทางวรรณกรรมและวาทศิลป์ เขาดำรงตำแหน่งบริหารต่างๆ ภายใต้จักรพรรดิไบแซนไทน์หลายพระองค์ และเป็นที่จดจำมากที่สุดจากจดหมายและสุนทรพจน์ที่ไพเราะ"
 historical_character.john_axuch: "จอห์น อักซุค เป็นผู้บัญชาการทหารไบแซนไทน์ในศตวรรษที่ 12 และเป็นหัวหน้ารัฐมนตรีภายใต้จักรพรรดิจอห์นที่ 2 คอมเนนอส เดิมเป็นชาวเติร์กเซลจุกที่ถูกจับเป็นเชลยตั้งแต่เด็กและเติบโตในครัวเรือนของจักรพรรดิ อักซุคก้าวขึ้นมาเป็นที่ปรึกษาและสหายที่จักรพรรดิไว้วางใจมากที่สุด"
 historical_character.mkhitar_gosh: "มคิตาร์ กอช เป็นนักปราชญ์ นักบวช และนักกฎหมายชาวอาร์เมเนียในศตวรรษที่ 12 มีชื่อเสียงจากการมีส่วนร่วมในกฎหมายและวรรณคดีอาร์เมเนีย เขาประพันธ์หนึ่งในการประมวลกฎหมายอาร์เมเนียที่เก่าแก่ที่สุด "ดาตัสตานากิร์ก" ('ตำรากฎหมาย')"
 historical_character.shota_rustaveli: "โชตา รุสตาเวลี เป็นกวีชาวจอร์เจียในศตวรรษที่ 12 และเป็นหนึ่งในผู้มีส่วนร่วมที่ยิ่งใหญ่ที่สุดในวรรณคดีจอร์เจีย เขาเป็นที่รู้จักดีที่สุดจากบทกวีมหากาพย์ "อัศวินในหนังเสือดำ" ซึ่งถือเป็นผลงานชิ้นเอกของวรรณคดีแห่งชาติจอร์เจีย"
 historical_character.grigor_tatevatsi: "กริกอร์ ตาเตวัตซี เป็นนักปรัชญา นักเทววิทยา และนักปราชญ์ชาวอาร์เมเนียในศตวรรษที่ 14 มีชื่อเสียงจากบทบาทในฐานะครูและหัวหน้าโรงเรียนของอารามตาเตฟในอาร์เมเนียยุคกลาง"
 historical_character.sargis_pitsak: "ซาร์กิส ปิตซัก เป็นผู้วาดภาพประกอบต้นฉบับตัวเขียนและอาลักษณ์ชาวอาร์เมเนียในศตวรรษที่ 14 มีชื่อเสียงจากการมีส่วนร่วมในศิลปะการทำหนังสืออาร์เมเนียยุคกลาง"
 historical_character.medici: "อาเวราร์โด เด เมดีชี หรือที่รู้จักในนาม บิชชี เป็นบรรพบุรุษยุคแรกๆ ของตระกูลเมดีชีอันโด่งดัง ซึ่งก้าวขึ้นสู่ความโดดเด่นในฟลอเรนซ์ระหว่างยุคฟื้นฟูศิลปวิทยา อาเวราร์โดมีบทบาทสำคัญในการสร้างความมั่งคั่งและสถานะของตระกูลในวงการการเมืองและสังคมของฟลอเรนซ์"
 historical_character.borgia: "อัลฟอนโซ เด บอร์เจีย เป็นพระคาร์ดินัลและนักการทูตชาวสเปนผู้ ซึ่งต่อมาได้เป็นสมเด็จพระสันตะปาปาคาลิกซ์ตุสที่ 3 ในปี 1455 ก่อนดำรงตำแหน่งสมเด็จพระสันตะปาปา เขาเคยดำรงตำแหน่งนักกฎหมายและผู้บริหารที่น่านับถือ โดยมีบทบาทสำคัญในการประนีประนอมฝ่ายที่ขัดแย้งกันในการประนีประนอมแห่งกัสเป"
 historical_character.william_wallace: "วิลเลียม วอลเลซ เป็นอัศวินชาวสกอตและผู้นำคนสำคัญในช่วงสงครามประกาศอิสรภาพของสกอตแลนด์ต่ออังกฤษในช่วงปลายศตวรรษที่ 13 เป็นที่รู้จักจากกลยุทธ์ที่กล้าหาญและความรักชาติอย่างรุนแรง วอลเลซเอาชนะกองทัพอังกฤษอย่างมีชื่อเสียงในยุทธการที่สเตอร์ลิงบริดจ์ในปี 1297 และได้รับการ แต่งตั้งเป็นผู้พิทักษ์แห่งสกอตแลนด์"
 historical_character.la_hire: "เอเตียน เดอ วีโญลส์ หรือที่รู้จักกันในนาม ลา อีร์ เป็นผู้บัญชาการทหารคนสำคัญในช่วงท้ายของสงครามร้อยปี มีชื่อเสียงในด้านความกล้าหาญและความสามารถในการรบ ลา อีร์เป็นหนึ่งในผู้บัญชาการหลักภายใต้ฌาน ดาร์ก"
 historical_character.bar_sauma: "รับบัน บาร์ เซามา เป็นนักบวชเนสโตเรียนที่ผันตัวมาเป็นนักการทูตจากจีนสมัยราชวงศ์หยวน เดิมทีออกเดินทางแสวงบุญไปยังเยรูซาเล็ม แต่ไม่สำเร็จ กลับใช้เวลาหลายปีในแบกแดดแทน ต่อมาในชีวิต เขาได้ทำหน้าที่เป็นทูตมองโกลไปยังยุโรป พบปะกับกษัตริย์ยุโรป จักรพรรดิไบแซนไทน์ และสมเด็จพระสันตะปาปา เพื่อหารือเกี่ยวกับพันธมิตรแฟรงก์-มองโกลที่เป็นไปได้"
 historical_character.hodja: "นัสรุดดีน "ฮอจา" เป็นวีรบุรุษพื้นบ้านและบุคคลในวรรณกรรมที่เป็นสัญลักษณ์ในวัฒนธรรมตุรกี มักถูกพรรณนาว่าเป็นชายชราผู้ชาญฉลาดและมีไหวพริบ ซึ่งให้คำแนะนำที่คลุมเครือหรือประสบเคราะห์กรรม แต่แก้ไขได้ทั้งหมดด้วยไหวพริบและอารมณ์ขันอันเฉียบแหลมของเขา"
 historical_character.widukind_of_corvey: "วีดูกินด์แห่งคอร์เวย์ เป็นนักบวชและนักประวัติศาสตร์ชาวแซกซอนในศตวรรษที่ 10 มีชื่อเสียงจากผลงาน "Res gestae Saxonicae" พงศาวดารที่ให้รายละเอียดเกี่ยวกับการกระทำของชาวแซกซอน โดยเน้นไปที่รัชสมัยของจักรพรรดิออตโตที่ 1 เป็นพิเศษ"
 historical_character.roger_de_flor: "โรเจอร์ เด ฟลอร์ เป็นหัวหน้ากองทหารรับจ้างและนักผจญภัยผู้โดดเด่นในช่วงปลายศตวรรษที่ 13 และต้นศตวรรษที่ 14 เดิมเป็นอัศวินเทมพลาร์ ต่อมาได้เป็นผู้นำของอัลโมกาบาเรส ก่อตั้งกองร้อยคาตาลัน เขาต่อสู้เพื่ออันโดรนิคอสที่ 2 และมิคาเอลที่ 9 ซึ่งคนหลังได้สั่งลอบสังหารเขา เนื่องจากอิทธิพลที่เพิ่มขึ้นของเขาภายในจักรวรรดิไบแซนไทน์"
 historical_character.regino_of_prum: "เรจิโนแห่งพรึม เป็นนักบวชเบเนดิกติน นักประวัติศาสตร์ และนักทฤษฎีดนตรีผู้มีชื่อเสียงในศตวรรษที่ 9 เขาดำรงตำแหน่งเจ้าอาวาสแห่งอารามพรึม จนกระทั่งถูกขับไล่ในปี 899 หลังจากนั้นเขาได้เป็นเจ้าอาวาสแห่งอารามเซนต์มาร์ตินในเทรียร์ เขาเป็นที่รู้จักดีที่สุดจากพงศาวดาร "โครนิคอน""
 historical_character.geoffrey_of_monmouth: "เจฟฟรีย์แห่งมอนมัธ เป็นนักบวชชาวเวลส์ในศตวรรษที่ 12 และเป็นหนึ่งในบุคคลที่สำคัญที่สุดในการพัฒนาประวัติศาสตร์นิพนธ์ของบริเตนและวรรณกรรมกษัตริย์อาเธอร์ ผลงานชิ้นเอกของเขา "Historia Regum Britanniae" (ประวัติศาสตร์กษัตริย์แห่งบริเตน) เป็นบันทึกกึ่งประวัติศาสตร์ที่บันทึกชีวิตของกษัตริย์แห่งบริเตน"
 historical_character.raiktor: "ในปี 1081 ท่ามกลางความวุ่นวายหลังการขึ้นสู่อำนาจของอเล็กซิออสที่ 1 คอมเนนอส ไรค์ตอร์ นักบวชคนหนึ่งได้อ้างตนอย่างไม่ถูกต้องว่าเป็นจักรพรรดิมิคาเอลที่ 7 ผู้ถูกถอดถอน ฉวยโอกาสนี้ ดยุกโรเบิร์ต กิสการ์ดแห่งนอร์มันได้ใช้คำอ้างของไรค์ตอร์เพื่อเป็นข้ออ้างในการรุกรานคาบสมุทรบอลข่าน แม้ว่าการหลอกลวงจะถูกเปิดเผย กิสการ์ดก็ยังคงดำเนินทัพต่อไป โดยนำไรค์ตอร์มาแห่หน้าเมืองดิราเคียมเพื่อขอการสนับสนุน ในที่สุด กิสการ์ดก็ทอดทิ้งไรค์ตอร์เมื่อกลอุบายล้มเหลว ซึ่งน่าจะนำไปสู่การกำจัดไรค์ตอร์อย่างเงียบๆ เมื่อเขาไม่มีประโยชน์อีกต่อไป"
 historical_character.nichiren: "นักปฏิรูปศาสนาพุทธในญี่ปุ่นผู้ถอนรากถอนโคนและไม่ประนีประนอม $Nichiren$ ได้ประกาศว่าการอุทิศตนต่อสัทธรรมปุณฑรีกสูตรเป็นหนทางเดียวสู่การไถ่บาป ท่านวิพากษ์วิจารณ์นิกายคู่แข่งและความเฉื่อยชาทางการเมืองอย่างดุเดือด และต้องทนทุกข์กับการเนรเทศและความพยายามลอบสังหาร เพราะคำสอนของท่าน มรดกของท่านจุดประกายการสร้างนิกายพุทธศาสนาชาตินิยมอันเป็นเอกลักษณ์ที่สืบทอดมาจนถึงทุกวันนี้"
 historical_character.dogen: "ผู้ก่อตั้งนิกายโซโตแห่งศาสนาพุทธนิกายเซนในญี่ปุ่น ได้รับการเคารพนับถือจากคำสอนเรื่องการทำสมาธิและผลงานชิ้นเอก โชโบเก็นโซ ซึ่งหล่อหลอมปรัชญาเซนของญี่ปุ่น"
 historical_character.kokan_shiren: "ภิกษุนิกายรินไซเซน กวี และนักประวัติศาสตร์ในยุคคามาคูระ ผู้รวบรวม เซ็นริน โคคุโฮกิ (ตำราประวัติศาสตร์พุทธศาสนาที่โดดเด่น) และกวีนิพนธ์ที่ผสมผสานความเข้าใจอย่างลึกซึ้งของเซนเข้ากับความสง่างามทางวรรณกรรม"
 historical_character.jeong_mong_ju: "รัฐบุรุษ นักปราชญ์ และกวีแห่งปลายสมัยโครยอ ช็อง มง-จู ได้รับการเคารพนับถือจากความจงรักภักดีอย่างไม่สั่นคลอนต่อราชวงศ์ในยุคสุดท้าย ท่านเป็นปรมาจารย์ด้านแนวคิดขงจื๊อใหม่และการทูต ท่านต่อต้านการผงาดขึ้นของระบอบโชซอนและถูกลอบสังหาร เพราะหลักการของท่าน บทกวีสุดท้ายของท่าน ซึ่งแสดงถึงความซื่อสัตย์อันมั่นคง ยังคงเป็นหนึ่งในบทกวีที่มีชื่อเสียงที่สุดของเกาหลี"
 historical_character.yi_saek: "นักปราชญ์ขงจื๊อคนสำคัญแห่งปลายสมัยโครยอ อี แซ็ก ได้นำแนวคิดขงจื๊อใหม่ของจูซีเข้ามาในเกาหลี และฝึกฝนนักปฏิรูปรุ่นอนาคตของโชซอน แม้ว่าท่านจะสนับสนุนการปฏิรูปการศึกษา แต่ท่านยังคงภักดีต่อราชวงศ์โครยอและปฏิเสธที่จะรับตำแหน่งภายใต้ผู้สืบททอด อิทธิพลของท่านเชื่อมโยงสองราชวงศ์และหล่อหลอมความคิดของเกาหลีมานานหลายศตวรรษ"
 historical_character.jinul: "พระภิกษุนิกายซอน (เซน) ผู้มีวิสัยทัศน์แห่งยุคโครยอ $Ji_nul$ พยายามปฏิรูปพุทธศาสนาในเกาหลีผ่านการรวมการฝึกสมาธิและการศึกษาพระธรรมเข้าด้วยกัน ท่านก่อตั้งนิกายโชกเยที่วัดซงกวังซา โดยเน้นการตรัสรู้ส่วนบุคคลภายใต้วินัยสงฆ์ คำสอนของท่านวางรากฐานให้กับนิกายซอนของเกาหลีตามที่ปฏิบัติกันในปัจจุบัน ผสานความเข้าใจแบบเซนเข้ากับความลึกซึ้งทางวิชาการ"
 historical_character.prapanca: "กวีราชสำนักและนักพงศาวดารในชวามัชปาหิต ผู้ประพันธ์มหากาพย์ นาการาเกรตากามา (1365) ซึ่งให้รายละเอียดเกี่ยวกับความรุ่งโรจน์และภูมิศาสตร์ของมัชปาหิต ผลงานของท่านเป็นแหล่งข้อมูลสำคัญเกี่ยวกับประวัติศาสตร์และรัฐศาสตร์ของชวา"
 historical_character.tantular: "กวีชาวชวาผู้มีชื่อเสียง เอ็มปู ตันตูลาร์ ประพันธ์ กากาวิน ซูตาโซมา ซึ่งแนะนำวลี "Bhinneka ตุนggal Ika" ("เอกภาพท่ามกลางความหลากหลาย") ซึ่งต่อมาได้นำมาใช้เป็นคติพจน์ประจำชาติของอินโดนีเซีย"
 historical_character.kanwa: "กวีราชสำนักในรัชสมัยพระเจ้าแอร์ลังกา เอ็มปู กันวา ประพันธ์ กากาวิน อรชุนวิวาหะ มหากาพย์ที่ผสมผสานเทพปกรณัมฮินดูกับอุดมคติของชวา"
 historical_character.sedah: "เอ็มปู เซอดะฮ์ ได้รับมอบหมายจากพระเจ้าชยภยะ ให้เริ่มประพันธ์ กากาวิน ภารตะยุทธา ซึ่งดัดแปลงจากมหาภารตะ ต่อมา เอ็มปู ปานูลุฮ์ ได้ประพันธ์จนเสร็จสมบูรณ์"
 historical_character.panuluh: "เอ็มปู ปานูลุฮ์ ประพันธ์ กากาวิน ภารตะยุทธา จนเสร็จสมบูรณ์ และยังประพันธ์ กากาวิน หริวังสา ซึ่งมีส่วนสำคัญต่อธรรมเนียมวรรณกรรมชวา"
 historical_character.dharmaja: "กวีในรัชสมัยพระเจ้าแอร์ลังกา เอ็มปู ธรรมชา เป็นที่รู้จักจากการประพันธ์ กากาวิน สมรทหนะ บทกวีที่มีอิทธิพลต่อวรรณกรรมชวายุคหลัง"
 historical_character.monaguna: "เอ็มปู โมนาคูนะ ได้รับการยกย่องว่าเป็นผู้ประพันธ์ กากาวิน สุมนสันตกะ ผลงานกวีนิพนธ์ที่สะท้อนการผสมผสานเรื่องเล่าฮินดูกับวัฒนธรรมชวา"
 historical_character.kuturan: "บุคคลสำคัญทางศาสนาที่เคารพนับถือในประวัติศาสตร์บาหลี เอ็มปู กูตูรัน ได้รับการยกย่องว่าเป็นผู้รวบรวมนิกายต่างๆ ของศาสนาฮินดูในบาหลี และก่อตั้งระบบ เดซา อาดัต ซึ่งผสมผสานกฎหมายศาสนาและกฎหมายจารีตประเพณีเข้าด้วยกัน"
 historical_character.dwijendra: "ผู้นำทางจิตวิญญาณที่มีบทบาทสำคัญในการเผยแผ่ศาสนาฮินดูในลอมบอกและบาหลี เอ็มปู ทวิเชนทระ เป็นที่รู้จักจากคำสอนและการสร้างวัดทั่วทั้งเกาะ"
 historical_character.kavindrarimathana: "กวีนทราริมถนะ เป็นสถาปนิกและวิศวกรผู้โดดเด่นในรัชสมัยพระเจ้าราเชนทรวรมันที่ 2 ท่านได้รับการยกย่องว่าเป็นผู้ออกแบบวัดสำคัญๆ รวมถึงปราสาทแปรรูปและปราสาทแม่บุญตะวันออก ซึ่งแสดงถึงความสามารถทางสถาปัตยกรรมอันยอดเยี่ยมของจักรวรรดิเขมร"
 historical_character.daun_penh: "แม่ม่ายผู้เป็นที่เคารพนับถือในศตวรรษที่ 14 กล่าวกันว่า ยายเพ็ญ ได้ค้นพบพระพุทธรูปศักดิ์สิทธิ์ภายในต้นตะเคียนที่ลอยน้ำมาในช่วงน้ำท่วมโตนเลสาบ ท่านตีความว่าเป็นนิมิตหมายอันศักดิ์สิทธิ์ จึงได้สร้างศาลเจ้าบนยอดเขา (วัดพนม) ซึ่งท่านได้ประดิษฐานพระธาตุไว้ การกระทำอันเปี่ยมศรัทธาของท่านก่อให้เกิดเมืองพนมเปญ ซึ่งตั้งชื่อตามท่าน"
 historical_character.yue_fei: "หนึ่งในแม่ทัพผู้โด่งดังที่สุดของจีน งักฮุย (เยว่เฟย) เติบโตจากสามัญชนจนกลายเป็นผู้พิทักษ์ที่แน่วแน่ของราชวงศ์ซ่งใต้ต่อต้านการรุกรานของราชวงศ์จินของชาวจูร์เชน ด้วยความจงรักภักดีอย่างไม่สั่นคลอนต่อฮ่องเต้และอุดมการณ์แห่งเอกภาพของชาติ ท่านกลับถูกทรยศโดยขุนนางทุจริตและถูกประหารชีวิตอย่างไม่เป็นธรรม มรดกของท่านยังคงเป็นสัญลักษณ์ของความรักชาติและความซื่อสัตย์สุจริต"
 historical_character.wen_tianxiang: "นักปราชญ์-แม่ทัพผู้เป็นที่เคารพนับถือแห่งปลายราชวงศ์ซ่งใต้ เหวิน เทียนเสียง ยืนหยัดเป็นสัญญาณแห่งการต่อต้านการพิชิตของมองโกล หลังจากถูกจับกุมหลังจากการป้องกันราชวงศ์ล้มเหลว ท่านปฏิเสธที่จะรับใช้ราชวงศ์หยวนและยอมพลีชีพ บทกวีที่ท่าน แต่งในคุก โดยเฉพาะ "บทเพลงแห่งคุณธรรม" (เจิ้งชี่เกอ) ได้จารึกมรดกของท่านไว้ในฐานะแบบอย่างแห่งคุณธรรมและความภักดี"
 historical_character.fan_zhongyan: "รัฐบุรุษ อัครมหาเสนาบดี และนักปราชญ์ขงจื๊อใหม่แห่งราชวงศ์ซ่งเหนือ ฟ่าน จ้งเหยียน เป็นที่รู้จักจากคติพจน์อันโด่งดังของท่าน "จงกังวลก่อนผู้คน และจงเพลิดเพลินทีหลังผู้คน" ท่านได้ดำเนินการปฏิรูปครั้งสำคัญเพื่อปรับปรุงการปกครองและสวัสดิการสังคม"
 historical_character.li_qingzhao: "หนึ่งในกวีหญิงที่ยิ่งใหญ่ที่สุดของจีน หลี่ ชิงจ้าว ได้รับการยกย่องจากบทกวีประเภท "ฉือ" (โคลง) ในสมัยราชวงศ์ซ่ง ซึ่งแสดงออกถึงความสูญเสียส่วนตัวและความสง่างามของยุคสมัยที่ล่วงเลยไปอย่างสะเทือนอารมณ์"
 historical_character.qiu_chuji: "ปรมาจารย์ลัทธิเต๋าผู้เป็นที่เคารพนับถือ (หนึ่งในเจ็ดนักพรตแท้จริงแห่งอุดร) และที่ปรึกษาของเจงกีส ข่าน ชิว ชู่จี (คูชูกิ) เดินทางจากจีนตอนเหนือไปยังเอเชียกลางเพื่อถวายคำปรึกษาแก่ข่านในเรื่องการปกครองและการมีอายุยืนยาว ช่วยวางนโยบายศาสนาในยุคแรกของราชวงศ์หยวน"
 historical_character.chu_van_an: "อาจารย์ขงจื๊อผู้ทรงเกียรติแห่งราชวงศ์เจิ่น (ตรัน) จู วัน อาน หัวหน้าสถาบันหลวงในทังล็อง (ฮานอย) เป็นที่รู้จักในด้านความซื่อตรง การปฏิรูปการศึกษา และฎีกา "เจ็ดหัวขุนนาง" อันโด่งดัง ที่เรียกร้องให้กษัตริย์กำจัดขุนนางทุจริต"
 historical_character.nguyen_thuyen: "ขุนนางกวีในศตวรรษที่ 13 เหงียน เทวียน (เหวียนเทวียน) ได้รับการยกย่องว่าเป็นผู้บุกเบิกการใช้อักษรโนม (อักษรเวียดนามพื้นเมือง) ในวรรณคดี เป็นที่จดจำจากการประพันธ์บทกวีที่ตามตำนานเล่าว่าสามารถขับไล่จระเข้ได้ ซึ่งเป็นสัญลักษณ์ของอานุภาพแห่งภาษาและการเรียนรู้ของเวียดนาม"
 historical_character.pham_ngu_lao: "แม่ทัพผู้โด่งดังแห่งราชวงศ์เจิ่น (ตรัน) ฝั่ม หงู หลาว (ฟามงูเหลา) ผู้ช่วยขับไล่การรุกรานของมองโกลหลายครั้งในศตวรรษที่ 13 ท่านเกิดในตระกูลชาวนา แต่ได้ก้าวขึ้นมาด้วยความกล้าหาญและกลายเป็นสัญลักษณ์ของความรักชาติ (และยังเป็นหัวข้อของบทกวีที่มีชื่อเสียง ซึ่งเน้นย้ำถึงความทุ่มเทของท่าน)"
 historical_character.sakata_kintoki: "นักรบผู้ทรงพลังจากภูเขาแห่งซากามิ กล่าวกันว่า $dynn_Satake$ $Kin_toki$ (ซากาตะ คินโทกิ) รับใช้ $dynn_Minamoto$ $Yorimitsu$ (มินาโมโตะ โนะ โยริมิตสึ) ด้วยพละกำลังและความภักดีอันยิ่งใหญ่ วีรกรรมในตำนานของท่านในนาม "คินทาโร่" รวมถึงการปล้ำหมี การถอนรากถอนโคนต้นไม้ และการบุกเข้าสู่สมรภูมิ"
 historical_character.takezaki_suenaga: "ซามูไรผู้ภักดีอย่างแรงกล้าของรัฐบาลโชกุนคามาคูระ $dynn_Takezaki$ $Suenaga$ (ทาเคซากิ ซุเอนากะ) ได้รับชื่อเสียงจากความกล้าหาญระหว่างการรุกรานญี่ปุ่นของมองโกล ด้วยความมุ่งมั่นที่จะได้รับการยอมรับอย่างเหมาะสมสำหรับความดีความชอบ ท่านจึงได้ว่าจ้างให้จัดทำม้วนภาพวาดที่บันทึกวีรกรรมของท่าน"
 historical_character.eisai: "เกิดในตระกูลศาลเจ้า $Eisai$ ได้บวชเป็นภิกษุ แต่ไม่พอใจนิกายปุณฑรีกะ (Pundarika) หรือเท็นได (Tendai) ซึ่งเป็นนิกายหลักของพุทธศาสนาในขณะนั้น จึงเดินทางไปจีนเพื่อศึกษาคำสอนของนักคิดสายฌาน (Dhyana) หรือ ฉาน (Chan) เมื่อกลับมา ท่านได้นำแนวคิดเหล่านี้มาเผยแพร่ในญี่ปุ่น ก่อตั้งนิกายรินไซเซน (Zen Rinzai) สร้างวัดแห่งแรก และ ทำให้ชาเขียวกลับมาเป็นที่นิยมอีกครั้ง"
 historical_character.ippen: "อิปเปน (Ippen) ศึกษาพระคัมภีร์ตั้งแต่อายุยังน้อยก่อนจะกลับไปใช้ชีวิตฆราวาส ขณะจาริกแสวงบุญที่คุมาโนะ เทพคามิได้เปิดเผยหนทางสู่การตรัสรู้แก่ท่าน นั่นคือ: การสวด [Glossary( 'เนมบุตสึ', 'GLOSS_NEMBUTSU')] อย่างปีติยินดี ด้วยแรงบันดาลใจจากสวรรค์ $Ippen$ กลับสู่ร่มกาสาวพัสตร์ในฐานะภิกษุและอาจารย์แห่งนิกายสุขาวดี (Pure Land) ผู้ทุ่มเท เดินทางไปทั่วญี่ปุ่นพร้อมกับกลุ่มผู้ติดตามที่กระตือรือร้น และก่อตั้งนิกายจีชู (Ji-shū)"
 historical_character.myoe: "กำพร้าตั้งแต่เด็ก $MyO_e$ ศึกษาจากหลากหลายนิกาย โดยมี $Mongaku$ (มงกากุ) และ $Eisai$ (เอไซ) เป็นหนึ่งในอาจารย์ของท่าน แต่ท่านกลับรู้สึกเฉยเมย ด้วยการแสวงหาความสันโดษจากการโต้วาทีของอาราม ท่านจึงหวนกลับไปหาคำสอนของนิกายเคงอน (Kegon) ที่เคยเป็นที่นิยมในอดีต และฟื้นฟูคำสอนเหล่านั้นด้วยการผสมผสานแนวคิดของชินงอน (Shingon) และเท็นได (Tendai) เข้าไป พร้อมทั้งปฏิเสธความหลงใหลใน [Glossary( 'เนมบุตสึ', 'GLOSS_NEMBUTSU')]"
 historical_character.honen: "โฮเน็น (HO_nen) บรรพชาเป็นสามเณรตั้งแต่เด็กหลังจากบิดาถูกลอบสังหาร และประสบความสำเร็จในการไต่เต้าสู่ตำแหน่งนักบวชเท็นได (Tendai) ด้วยความไม่พอใจในความสุขสบายที่เหล่าภิกษุได้รับ ซึ่งตรงกันข้ามกับความทุกข์ยากของสามัญชน $HO_nen$ ตระหนักว่า [Glossary( 'เนมบุตสึ', 'GLOSS_NEMBUTSU')] เป็นหลักคำสอนที่ไม่แบ่งแยก และกลายเป็นอาจารย์ชั้นนำของนิกายสุขาวดี (Pure Land) แนวคิดที่รุนแรงของท่านก่อให้เกิดความโกรธแค้นจากนิกายอื่น ๆ นำไปสู่การเนรเทศท่านในเหตุการณ์การกวาดล้างโจเง็น (Jogen persecution)"
 historical_character.shinran: "ชินรัน (Shinran) เป็นเด็กกำพร้า ท่านบรรพชาตั้งแต่อายุยังน้อย แต่ก็ต้องดิ้นรนในสมณเพศ ด้วยการชี้นำจากนิมิตให้ไปหาเพื่อนภิกษุ $HO_nen$ (โฮเน็น) $Shinran$ จึงกลายเป็นศิษย์เอกและต้องทนทุกข์จากการเนรเทศในเหตุการณ์การกวาดล้างโจเง็น (Jogen persecution) ท่านยังคงเทศนา [Glossary( 'เนมบุตสึ', 'GLOSS_NEMBUTSU')] แห่งนิกายสุขาวดี (Pure Land) แก่ผู้คนอย่างมุ่งมั่น ในที่สุดท่านก็ได้ก่อตั้งนิกายของตนเอง คือ โจโด ชินชู (Jōdo Shinshū) หรือ นิกายสุขาวดีที่แท้จริง ซึ่งปัจจุบันเป็นนิกายที่มีผู้ปฏิบัติตามอย่างกว้างขวางที่สุดในญี่ปุ่น"
 historical_character.mibu_tadamine: "แม้จะมีต้นกำเนิดที่ต่ำต้อย $Tadamine$ (ทาดามิเนะ) ก็ได้รับชื่อเสียงอย่างมากจากบทกวีวากะ (วากะ) ของท่าน หลังจากปรากฏตัวในการแข่งขัน ท่านได้รับพระราชโองการและอุปถัมภ์จากตระกูลฟูจิวาระ ท่านและ $Tadami$ (ทาดามิ) บุตรชายของท่าน ถูกนับรวมอยู่ใน สามสิบหกเซียนกวีแห่งญี่ปุ่น โดยมีบทกวีมากกว่าแปดสิบเอ็ดบทที่เชื่อว่ารวมอยู่ในกวีนิพนธ์ของราชสำนัก"
 historical_character.murasaki: "ท่านหญิงมุราซากิ (Lady มูราซากิ) เหลนสาวของกวีชื่อดัง ฟูจิวาระ โนะ คาเนสุเกะ เกิดในตระกูลโยชิคาโดะผู้คงแก่เรียน ท่านทำหน้าที่เป็นนางข้าหลวงของจักรพรรดินีฟูจิวาระ โนะ โชชิ ในจักรพรรดิอิจิโจ พรสวรรค์ด้านกวีนิพนธ์ของท่านเป็นที่ประจักษ์ในไม่ช้า และท่านถูกนับรวมอยู่ใน สามสิบหกเซียนกวีหญิง ปัจจุบันท่านเป็นที่รู้จักกันดีที่สุดจากอนุทินของท่าน การเป็นคู่แข่งกับกวี #EMP เซ โชนะงน#! (เซริ Shōnagon) และ #EMP ตำนานเก็นจิ#! (Tale of Genji) ซึ่งอาจเป็นนวนิยายที่เก่าแก่ที่สุด"
