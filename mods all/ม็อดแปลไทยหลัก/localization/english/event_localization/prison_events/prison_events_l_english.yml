l_english: 
 prison.1001.t:0 "ความจริงหรือความทรมาน"
 prison.1001.start.desc:1 "การฝันกลางวันของข้าสิ้นสุดลงอย่างกะทันหันเมื่อประตูห้องขังถูกกระชากเปิด เงาของผู้คุมนั้นคุ้นเคย แต่ [actor.GetWomanMan] ที่อยู่ข้างหลังเขา... โอ้ ไม่นะ\n\n"
 prison.1001.rack.desc:0 "[actor.GetTitledFirstName] มัดข้าเข้ากับเครื่องทรมานด้วย [actor.GetHerselfHimself] รอยยิ้มพึงพอใจปรากฏบนริมฝีปากของ [actor.GetHerHis] "ข้าเชื่อว่าเจ้าคงได้ยินเสียงคนอื่นๆ แล้ว เสียงกรีดร้อง เสียงกระดูกและเส้นเอ็นหัก""
 prison.1001.whip.desc:0 "[actor.GetTitledFirstName] ควงแส้ในมือของ [actor.GetHerHis] "โอ้ แส้ดูเหมือนไม่มีพิษสง แต่ก็สามารถแยกเนื้อออกจากกระดูกได้ดีพอๆ กับมีดเล่มใด""
 prison.1001.rats.desc:0 ""หนูพวกนี้อาจดูเชื่อง" [actor.GetTitledFirstName] กล่าว พลางชี้ไปที่ถังที่ส่งเสียงร้องจี๊ดๆ เบาๆ "แต่ถ้าพวกมันได้กลิ่นไฟ พวกมันจะกัดแทะทุกสิ่งอย่าง #emp ทุกสิ่ง#! เพื่อหนีออกมาอย่างมีความสุข""
 prison.1001.poetry.desc:0 "[actor.GetTitledFirstName] ดึงม้วนคัมภีร์ที่ยาว ยาว #EMP ยาวมาก#! ออกมาจากใต้รักแร้ของ [actor.GetHerHis]\n\n"ข้าหวังว่าเจ้าคงไม่รังเกียจหากข้าจะอ่านบทกวี... #EMP ชั้นเลิศ#! สักเล่มสองเล่มให้เจ้าฟัง""
 prison.1001.my_secret.desc:1 ""เจ้ากำลังปิดบังบางอย่าง ข้าบอกได้" [actor.GetTitledFirstName] กล่าว "บอกความจริงแก่ข้า มิฉะนั้น...""
 prison.1001.anothers_secret.desc:1 ""เจ้ารู้บางอย่างเกี่ยวกับ [reveal_secret_owner.Custom2('MyCharacterIntroductionNoComma' SCOPE.sC('actor'))]" [actor.GetTitledFirstName] กล่าว "บอกข้ามาให้หมด มิฉะนั้น...""
 prison.1001.a:0 "ข้าจะบอกท่านทุกอย่าง ข้าสาบาน!"
 prison.1001.b:0 "..."


 prison.1002.rack.desc:0 "จะ ทำให้เรื่องยุ่งยากไปไย? ไม่มีอะไรดีเท่าเครื่องทรมานแบบเก่าๆ อีกแล้ว เมื่อผู้คุมลาก [recipient.GetTitledFirstName] เข้ามาในห้อง สายตาของ [recipient.GetHerHis] ก็จับจ้องไปที่โครงไม้ขนาดใหญ่ทันที"
 prison.1002.whip.desc:0 "โอ้ จุมพิตอันแสนหวานของแส้! มันอาจดูไม่มีพิษสง แต่ก็สามารถแยกเนื้อออกจากกระดูกได้ดีพอๆ กับมีดเล่มใด ดูจากสีหน้าของ [recipient.GetTitledFirstNamePossessive] แล้ว [recipient.GetSheHe] รู้เรื่องนี้ดีเกินไป"
 prison.1002.rats.desc:1 "หนูในถังอาจดูขี้อายในตอนแรก แต่พวกมันจะกัดแทะหน้าอกของ [recipient.GetWomanMan] อย่างมีความสุขเมื่อมีความร้อนเข้ามาเกี่ยวข้อง ขณะที่ข้าอธิบายแนวคิดให้ [recipient.GetTitledFirstName] ฟัง ความตั้งใจของ [recipient.GetHerHis] ก็ละลายหายไปต่อหน้าต่อตาข้า"
 prison.1002.poetry.desc:0 "เมื่อใครสักคนสามารถบิดเบือนคำพูดเพื่อความสุขได้ เช่นเดียวกับข้า การบิดเบือนเพื่อทำร้ายก็เป็นเรื่องง่าย\n\nข้าหยิบม้วนบทกวีขนาดยาวออกมาจากแขน คลี่มันออก ปล่อยให้ม้วนคัมภีร์กระทบพื้นและม้วนกลับออกไปนอกประตูอย่างแผ่วเบา"
 prison.1002.anothers_secret.desc:0 "\n\n"ไม่ ไม่ ข้า... ข้ามีข้อมูล! [reveal_secret_owner.GetTitledFirstName] [secret_to_reveal.Custom('SecretDescriptionThirdPerson')]! ข้าจะบอกท่านทุกอย่าง!""
 prison.1002.my_secret.desc:0 "\n\n"ได้โปรด ไม่! #EMP ได้โปรด!#! ข้าจะบอกทุกอย่างที่ท่านอยากรู้! ข้า... ข้า [secret_to_reveal.Custom('SecretDescriptionFirstPerson')]!""
 prison.1002.a:0 "น่าสนใจ พา [recipient.GetHerHim] กลับไปที่ห้องขัง"
 prison.1002.b:0 "ข้ายังไม่เสร็จธุระกับเจ้า #emp ซะทีเดียว#!..."

 prison.1003.t:0 "การทรมาน"
 prison.1003.rack.desc:0 "จะ ทำให้เรื่องยุ่งยากไปไย? ไม่มีอะไรดีเท่าเครื่องทรมานแบบเก่าๆ อีกแล้ว เสียงเมื่อกระดูกและเส้นเอ็นหักนั้นช่างน่าจดจำ แต่ไม่น่าจดจำเท่าความเจ็บปวดที่ [recipient.GetTitledFirstName] กำลังจะได้ประสบในไม่ช้า..."
 prison.1003.whip.desc:0 "โอ้ สัมผัสอันหอมหวานของแส้! มันอาจดูไม่มีพิษสง แต่มันสามารถแยกเนื้อออกจากกระดูกได้ดีพอๆ กับมีด — ความจริงที่ [recipient.GetTitledFirstName] กำลังจะได้ประสบในไม่ช้า [recipient.GetSheHe|U] จะต้องนอนบนท้อง [recipient.GetHerHis] ไปอีกนาน..."
 prison.1003.rats.desc:0 ""หนูพวกนี้อาจดูขี้อาย" ข้ากล่าวขณะมัดถังเข้ากับหน้าอกที่เปลือยเปล่าของ [recipient.GetFirstNamePossessive] "แต่เมื่อข้างในนั้นร้อนขึ้น พวกมันจะทำทุกอย่างเพื่อหนีออกมา โชคดีสำหรับพวกมันที่ฟันของพวกมัน #emp คมมาก#!." [recipient.GetSheHe|U] ร้องขอความเมตตาขณะที่ข้ายื่นมือไปหยิบถ่านที่ลุกโชน"
 prison.1003.poetry.desc:0 "$prison.1002.poetry.desc$\n\nจากนั้นข้าก็เริ่มอ่าน"
 prison.1003.a:0 "อา... ข้าสามารถฟังเสียงกรีดร้องของ [recipient.GetHerHis] ได้เป็นชั่วโมง"
 prison.1003.b:0 "มันจำเป็นต้องทำ"

 prison.1010.rack.desc:0 "[actor.GetTitledFirstName] มัดข้าเข้ากับเครื่องทรมานด้วย [actor.GetHerselfHimself] รอยยิ้มพึงพอใจปรากฏบนริมฝีปากของ [actor.GetHerHis] ข้าเคยได้ยินเสียงกรีดร้อง เสียงเมื่อกระดูกและเส้นเอ็น #emp หัก#!... ข้าร้องขอความเมตตา แต่รอยยิ้มของ [actor.GetFirstNamePossessiveNoTooltip] กลับกว้างขึ้นเท่านั้น"
 prison.1010.whip.desc:0 "[actor.GetTitledFirstName] ควงแส้ในมือของ [actor.GetHerHis] "โอ้ แส้ดูเหมือนไม่มีพิษสง แต่ก็สามารถแยกเนื้อออกจากกระดูกได้ดีพอๆ กับมีดเล่มใด ให้ข้าสาธิตให้ดู...""
 prison.1010.rats.desc:0 ""หนูพวกนี้อาจดูขี้อาย" [actor.GetTitledFirstName] กล่าวขณะที่ [actor.GetSheHe] มัดถังเข้ากับหน้าอกที่เปลือยเปล่าของข้า "แต่เมื่อข้างในนั้นร้อนขึ้น พวกมันจะทำทุกอย่างเพื่อหนีออกมา โชคดีสำหรับพวกมันที่ฟันของพวกมัน #emp คมมาก#!.""
 prison.1010.poetry.desc:0 "$prison.1001.poetry.desc$\n\nจากนั้น [actor.GetSheHe] ก็เริ่ม"
 prison.1010.a:0 "ได้โปรด ไม่ ข้า...! #emp อ๊ากกกกกกก!#!"

 prison.1020.t:0 "ทำให้ตาบอด"
 prison.1020.start.desc:0 "ผู้คุมลาก [recipient.GetTitledFirstName] ที่ตื่นตระหนกเข้ามาใน [ROOT.Char.Custom('GetRoom')] "ได้โปรด! ข้าจะทำทุกอย่าง ทุกอย่างที่ท่านต้องการ!" เสียงประท้วงของ [recipient.GetHerHis|U] ถูกตัดสั้นลงเมื่อผู้คุมอุดปาก [recipient.GetHerHim] และมัด [recipient.GetHerHim] ลงบนโต๊ะ\n\n"
 prison.1020.cruel.desc:0 ""โอ้ [recipient.GetFirstNameNoTooltip]" ข้าถอนหายใจอย่างเสแสร้ง "เจ้ากับข้าไม่เคยเห็นพ้องต้องกันเลย แต่ในแง่ดี ข้าได้ตัดสินใจในที่สุดว่าจะแก้ไขสถานการณ์นี้อย่างไร""
 prison.1020.compassionate.desc:0 ""นี่อาจดูป่าเถื่อน" ข้ากล่าวขณะที่แพทย์เตรียมเครื่องมือของ [physician.GetHerHis] "แต่นี่เพื่อความมั่นคงของอาณาจักร เชื่อข้าเถอะ — ข้าไม่ได้มีความสุขกับความทุกข์ทรมานของเจ้า""
 prison.1020.compassionate.landless.desc:0 ""นี่อาจดูป่าเถื่อน" ข้ากล่าวขณะที่แพทย์เตรียมเครื่องมือของ [physician.GetHerHis] "แต่นี่เพื่อสิ่งที่ดีที่สุด เชื่อข้าเถอะ — ข้าไม่ได้มีความสุขกับความทุกข์ทรมานของเจ้า""
 prison.1020.child.desc:1 ""นี่จะ ทำให้ทุกอย่างรู้สึกดีขึ้น" แพทย์กล่าวขณะที่ [physician.GetSheHe] เสนอยา ทำให้สงบแก่ [recipient.GetTitledFirstName] มือเล็ก ๆ ของ [recipient.GetHerHis|U] สั่น แต่ [recipient.GetSheHe] ก็ดื่มมันทั้งหมด\n\nเมื่อ [recipient.Custom('GirlBoy')] หลับไปแล้ว แพทย์ก็มองข้านาน ๆ "ท่านแน่ใจหรือเกี่ยวกับเรื่องนี้ [actor.GetLadyLord] ของข้า?""
 prison.1020.a:0 "โอ้ ใช่ นี่มัน #emp จะ#! เจ็บแน่"
 prison.1020.b:0 "ข้ามีเหตุผลของข้า"

 prison.1021.start.desc:0 "ข้ากำลังครุ่นคิดถึงชะตากรรมของตนอย่างเงียบๆ เมื่อผู้คุมกระแทกประตูเปิดออกอย่างกะทันหันและลากข้าออกจากห้องขัง ที่นั่น ในทางเดินอันมืดสลัว [actor.GetTitledFirstName] รออยู่\n\n"
 prison.1021.landless_start.desc:0 "ข้ากำลังครุ่นคิดถึงชะตากรรมของตนอย่างเงียบๆ เมื่อผู้คุมเข้ามาอย่างกะทันหันและลากข้าออกจากกรง ทันใดนั้นข้าก็เผชิญหน้ากับ [actor.GetTitledFirstName]\n\n"
 prison.1021.cruel.desc:0 "สีหน้าพึงพอใจบนใบหน้าของ [actor.GetHerHis] ทำให้ข้าขนลุกซู่\n\n"อย่ากังวลไปเลย ข้าไม่ได้มาเพื่อเอาศีรษะของเจ้า — แค่ดวงตาของเจ้าก็พอแล้ว""
 prison.1021.compassionate.desc:0 ""[recipient.GetFirstNameNoTooltip] ข้าอยากให้เจ้ารู้ว่าข้าไม่ได้มีความสุขกับเรื่องนี้ ข้าถูกบังคับให้ ทำให้เจ้าตาบอด เพื่อความมั่นคงของอาณาจักร""
 prison.1021.child.desc:0 ""นี่จะ ทำให้ทุกอย่างรู้สึกดีขึ้น" แพทย์กล่าวขณะที่ [physician.GetSheHe] เสนอขวดแก้วเล็กๆ ให้ข้า ที่นี่เป็นสถานที่เลวร้าย มีคนเลวร้าย แต่ดวงตาของ [physician.GetHerHis]... พวกมันดูใจดี ด้วยมือที่สั่นเทา ข้ายกขวดขึ้นจรดริมฝีปาก"
 prison.1021.a:0 "ดวง... ดวงตาของข้า? ปล่อยข้า! #emp ไม่นะ!#!"
 prison.1021.b:0 "ข้า... ข้ารู้สึกแปลกๆ..."

 prison.1025.t:0 "ตอน"
 prison.1025.cruel.desc:0 ""โอ้ [recipient.GetFirstNameNoTooltip]" ข้าถอนหายใจอย่างเสแสร้ง "อย่ากังวลไปเลย ข้าไม่ได้มาที่นี่เพื่อเอาศีรษะของเจ้า — หรือสิ่งอื่นใดที่มีค่า ความเป็นชายของเจ้าก็พอแล้ว""

 prison.1026.cruel.desc:0 "สีหน้าพึงพอใจบนใบหน้าของ [actor.GetHerHis] ทำให้ข้าขนลุกซู่\n\n"อย่ากังวลไปเลย ข้าไม่ได้มาเพื่อเอาศีรษะของเจ้า — หรือสิ่งอื่นใดที่มีค่าในเรื่องนั้น ความเป็นชายของเจ้าก็พอแล้ว""
 prison.1026.compassionate.desc:0 ""[recipient.GetFirstNameNoTooltip] ข้าอยากให้เจ้ารู้ว่าข้าไม่ได้มีความสุขกับเรื่องนี้ ข้าถูกบังคับให้ตอนเจ้า เพื่อความมั่นคงของอาณาจักร""
 prison.1026.a:0 "อะไรนะ...? ปล่อยข้า! #emp ไม่นะ!#!"

 prison.1030.t: "ทำให้เสียโฉม"
 prison.1030.cruel.desc: ""เอาล่ะ [recipient.GetFirstNameNoTooltip]" ข้าถอนหายใจอย่างเสแสร้ง "ดูเหมือนจะถึงเวลาแล้วที่รูปลักษณ์ภายนอกของเจ้าจะสะท้อนความอัปลักษณ์ภายใน""

 prison.1031.cruel.desc: "สีหน้าพึงพอใจบนใบหน้าของ [actor.GetHerHis] ทำให้ข้าขนลุกซู่\n\n"อย่ากังวลไปเลย ข้าไม่ได้มาเพื่อเอาศีรษะ #EMP ทั้งหมด#! ของเจ้า — แค่ส่วนหนึ่งของมันก็พอแล้ว...""
 prison.1031.a: "จมูก... จมูกของข้า? ปล่อยข้า! #emp ไม่นะ!#!"

 prison.1041.t: "ทำให้พิการ"
 prison.1041.cruel.desc: ""สิ่งหนึ่งที่ข้าชื่นชมในตัวเจ้าเสมอมา [recipient.GetFirstName]" ข้ายิ้มเยาะ "คือความสามารถของเจ้าในการใช้ประโยชน์สูงสุดจากสถานการณ์ที่เลวร้าย เจ้าดูเหมือนจะทำอะไรได้มากขึ้นด้วยทรัพยากรที่น้อยลงเสมอ — แม้จะน้อยลงไปสักสองสามปอนด์...""
 prison.1041.compassionate.desc: ""[recipient.GetFirstName] ข้าอยากให้เจ้ารู้ว่าข้าไม่ได้มีความสุขกับเรื่องนี้ ข้าถูกบังคับให้ ทำให้เจ้าพิการ เพื่อความมั่นคงของอาณาจักร""
 prison.1042.cruel.desc: "สีหน้าพึงพอใจบนใบหน้าของ [actor.GetHerHis] ทำให้ข้าขนลุกซู่\n\n""สิ่งหนึ่งที่ข้าชื่นชมในตัวเจ้าเสมอมา [recipient.GetFirstName]" [actor.GetSheHe] ยิ้มเยาะ "คือความสามารถของเจ้าในการใช้ประโยชน์สูงสุดจากสถานการณ์ที่เลวร้าย เจ้าดูเหมือนจะทำอะไรได้มากขึ้นด้วยทรัพยากรที่น้อยลงเสมอ — แม้จะน้อยลงไปสักสองสามปอนด์...""
 prison.1041.a: "แขนขา... แขนขาของข้า? ไม่ เจ้าทำไม่ได้ #EMP เจ้าทำไม่ได้!#!"

 prison.9001.t:0 "อิสรภาพ!"
 prison.9001.desc_1:0 "ข้าใช้เวลาหลายวันวางแผนการหลบหนี คิดถึงแนวทางปฏิบัติและเส้นทางหลบหนีที่ดีที่สุด แต่ทั้งหมดก็ไร้ผลเมื่อวันหนึ่งผู้คุมลืมล็อคห้องขัง เดินโซเซจากไปโดยไม่หันกลับมามอง"
 prison.9001.desc_2:0 "คำพูดดีๆ ที่นี่ คำชมจากใจที่นั่น – ในไม่ช้าผู้คุมก็มองข้าด้วยความคุ้นเคยอันอบอุ่นแทนที่จะเป็นความสงสัยในตอนแรกที่ [dummy_gender.GetSheHe] มี เมื่อข้าขอสูดอากาศบริสุทธิ์สักหน่อย [dummy_gender.GetSheHe] ก็ไม่ได้ซักถามข้าเลย และข้าก็ทิ้ง [dummy_gender.GetHerHim] หน้าคว่ำอยู่ในคูน้ำ"
 prison.9001.desc_3_opening:0 "ชั่วขณะที่เสียสมาธิ นั่นคือทั้งหมดที่ข้าต้องการเพื่อล้วงกุญแจจากเข็มขัดของผู้คุมมาไว้ข้างหลัง"
 prison.9001.desc_3_house_arrest:0 "เมื่อความมืดมาเยือน ข้าค่อยๆ แง้มประตูห้องขังออกอย่างช้าๆ ขมวดคิ้วกับเสียงเสียดสี"
 prison.9001.desc_3:0 "เมื่อความมืดมาเยือน ข้าค่อยๆ ออกจากห้องขังอย่างช้าๆ ขมวดคิ้วกับเสียงเสียดสี"
 prison.9001.desc_4:0 "ข้าสำรวจทุกตารางนิ้วของห้องขัง ข้าตรวจสอบบานพับทุกอัน ลูบคลำไปตามลูกกรงทุกซี่ และสำรวจโซ่ทุกเส้น เมื่อความมืดมาเยือนอีกครั้ง ในที่สุดข้าก็พบสิ่งที่ข้าตามหา – หินที่หลวม! หลังจากนั้นก็เป็นงานง่ายที่จะขยายรูให้เป็นอุโมงค์"
 prison.9001.desc_5:0 "ข้าย่องไปทั่วสถานที่ ประตูทุกบานคุ้นเคยเหมือนเพื่อนเก่า และข้ารอเวลา ข้ารู้ว่าใครไปไหน และเวลาใด ข้ารู้ว่าใครเรียกใช้คนรับใช้คนใด และข้ารู้เส้นทางที่เร็วที่สุดที่จะออกจากที่นี่ เมื่อความมืดมาเยือน ข้าเพียงแค่รอช่วงเวลาที่สมบูรณ์แบบ แล้วข้าก็หลบหนีเหมือนเงา"
 prison.9001.desc_6:0 "ข้ารอจนความมืดมาเยือน และทันทีที่ข้ามั่นใจว่าไม่มีใครอยู่ใกล้ ข้าก็คว้าลูกกรงข้างละอันแล้ว #EMP งอ#! มัน เหงื่อหยดเข้าตาข้า และเสียงหอบหายใจของข้าดังก้องในความมืด แต่ในไม่ช้าข้าก็มีรูที่ใหญ่พอจะลอดผ่านไปได้"
 prison.9001.desc_7:0 "ทันทีที่ผู้คุมจากไป ข้าก็จัดการกับแม่กุญแจ มันเก่าและขึ้นสนิม และทั้งหมดที่ข้ามีคือตะปูเล็กๆ ที่ข้าพบในมุมห้อง แต่นั่นไม่อาจหยุดข้าได้ บิดเล็กน้อย ดันเบาๆ และ– #EMP ได้แล้ว!#!"
 prison.9001.desc_8:0 "ข้ายิ้มขณะที่ผู้คุมพยายามกลั้นหาว ข้าชวนคุยมาหลายชั่วโมงแล้ว และข้าก็ดำดิ่งสู่หัวข้อ [ROOT.Char.Custom('subject_of_interest')] โดยไม่หยุดยั้ง ในไม่ช้า [dummy_gender.GetSheHe] ก็สัปหงกบนเก้าอี้ของ [dummy_gender.GetHerHis] และจากนั้นการเอากุญแจจาก [dummy_gender.GetHerHim] ก็เป็นเรื่องง่าย"
 prison.9001.desc_9:0 "หลายวันของการเหลือบมองอย่างมีเลศนัย ท่าทางที่ส่อไปในทางชู้สาว และคำเชิญชวน ในที่สุดก็ได้ผล และขณะที่ผู้คุมเข้าใกล้ข้าโดยมือข้างหนึ่งกำลังปลดเชือก [dummy_gender.Custom('GetUpperClothingArticle')] ของ [dummy_gender.GetHerHis] ข้าก็ยิ้ม มันเป็นเรื่องที่ไม่เจ็บปวด ที่จะหมดสติไปในห้วงแห่งความสุข และข้าแน่ใจว่าจะไม่ก่อให้เกิดอันตรายที่ไม่จำเป็น"
 prison.9001.desc_ending_1:0 "\n\nขณะที่ข้าหายลับเข้าไปใน [imprisoner.Custom('TerrainType')] รอบๆ [imprisoner.Custom('ResidenceBuilding')] ของ [imprisoner.GetTitledFirstNamePossessive] ในที่สุดข้าก็กล้าที่จะหวัง"
 prison.9001.desc_ending_2:0 "\n\nขณะที่ข้าหายลับไปในยามค่ำคืน เมื่อข้าอยู่ห่างไกลจากทุกสิ่ง ข้าเงยหน้าขึ้นและหัวเราะ"
 prison.9001.a:0 "ข้าเป็นอิสระแล้ว!"

 prison.9002.desc_opening:0 "ทั้งหมดที่ข้าต้องการคือชั่วขณะหนึ่งที่ความสนใจลดลง"
 prison.9002.desc_rat:0 "– ข้าปล่อยหนูของข้า ซึ่งค่อยๆ คลานข้ามพื้น ขึ้นไปบนม้านั่งที่ผู้คุมนั่งพักอยู่ และตรงไปยังกุญแจ"
 prison.9002.desc_stone:0 "– ข้าย่องไปข้างหลังผู้คุมและ #EMP ทุบ#! หินของข้าเข้าที่ด้านหลังหมวกเกราะของ [dummy_gender.GetHerHis] ขณะที่ผู้คุมล้มลงกับพื้น ข้าก็รีบค้นหา [dummy_gender.GetHerHim] เพื่อหากุญแจอย่างรวดเร็ว"
 prison.9002.desc_spoon:0 "และข้าก็แทงช้อนของข้าเข้าไปในแม่กุญแจ หลังจากขยับและงออยู่นาน แม่กุญแจก็เปิดออกพร้อมเสียง #EMP คลิก#! ดังๆ"
 prison.9002.desc_cockroach:0 "– ข้าปล่อยแมลงสาบของข้า และขณะที่มันวิ่งไปใต้เท้าของผู้คุม [dummy_gender.GetSheHe] ก็กระตุกถอยหลังอย่างแรงพอที่จะ ทำให้กะโหลกศีรษะของ [dummy_gender.GetHerHis] กระแทกพื้น"
 prison.9002.desc_end:0 ", และในไม่ช้าทั้งข้าและ [ROOT.Char.Custom('prison_pet')] ที่ไว้ใจได้ของข้าก็หายลับเข้าไปใน [imprisoner.Custom('TerrainType')] รอบๆ [imprisoner.Custom('ResidenceBuilding')] ของ [imprisoner.GetTitledFirstNamePossessive]"
 prison.9002.a:0 "เราเป็นอิสระแล้ว [ROOT.Char.Custom('prison_pet')]!"

 prison.9003.desc:0 "ทันทีที่ผู้คุมของ [imprisoner.GetTitledFirstNamePossessive] หันหลังให้ข้าและเพื่อนนักโทษของข้า [prison_friend.GetTitledFirstName] เราก็ลงมือ\n\nการถูกจองจำมาหลายวัน ทำให้ข้าอ่อนแอลง และขณะที่ผู้คุมชกหมัดหุ้มเหล็กเข้าที่ท้องของข้า ข้าก็พบว่าตัวเองถูกครอบงำและถูกกดลงอย่างรวดเร็ว ผู้คุมเตรียมการโจมตีครั้งสุดท้าย แต่ข้าเห็น [prison_friend.GetTitledFirstNameNoTooltip] ยืนอยู่เหนือเรา ถือมีดของผู้คุมเอง – ในไม่ช้าเราก็เคลื่อนไหวอีกครั้ง\n\nขณะที่เราเดินทางออกไปในยามค่ำคืน พิงกันและกัน เราก็หัวเราะ"
 prison.9003.a:0 "เราเป็นอิสระแล้ว!"

 prison.9499.t:0 "หลบหนี!"
 prison.9499.desc_house_arrest:0 "นักโทษของข้า [escapee.GetTitledFirstName] ได้หลบหนีจากการกักบริเวณของ [escapee.GetHerHis]!"
 prison.9499.desc_dungeon:0 "นักโทษของข้า [escapee.GetTitledFirstName] ได้หลบหนีออกจากคุกใต้ดินของข้า!"
 prison.9499.desc_ending:0 "\n\nผู้คุมไม่มีอะไรจะแก้ตัว แต่ความเสียหายก็ได้เกิดขึ้นแล้ว"
 prison.9499.a:0 "สาปแช่งเจ้า [escapee.GetFirstNameNoTooltip]!"

 prison.9501.t:0 "โซ่ตรวนที่ไม่อาจทำลาย"
 prison.9501.desc:0 "ขณะที่ผู้คุมเสียสมาธิชั่วขณะ ข้าเอื้อมมือไปหยิบกุญแจที่ห้อยอยู่บนเข็มขัดของ [jailor.GetHerHis] แต่มีมือที่แข็งแรงหยุดข้าไว้ครึ่งทาง\n\n"โอ้ ไม่ ไม่ ไม่มีการหลบหนีที่นี่ #EMP นายหญิง/นายท่าน [ROOT.Char.GetTitleAsNameNoTooltip] ของข้า#!." ผู้คุมยิ้มเยาะเย้ยข้าและหัวเราะ\n\n"เจ้าคิดว่าข้าวต้มที่เจ้าได้รับนั้นแย่แล้วหรือ?"\n\n"แค่. เจ้า. รอ.""
 prison.9501.a:0 "ข้าจะเน่าตายในนี้..."

 prison.9502.t:0 "[ROOT.Char.Custom('prison_pet')|U] ผู้กล้าหาญของข้า"
 prison.9502.desc_opening:0 "ขณะที่ผู้คุมหันกลับไป ข้ารีบคว้า [ROOT.Char.Custom('prison_pet')] ของข้าแล้วขว้างไปที่ศีรษะของ [dummy_gender.GetHerHis]\n\n"
 prison.9502.desc_rat:0 "มันตะเกียกตะกาย พยายามหาที่ยึดเกาะ แต่ผู้คุมรีบเอื้อมมือขึ้นไปโยนมันลงบนพื้น\n\nเสียงกรีดร้องประท้วงของข้าเกือบจะถูกกลบด้วยเสียงร้องโหยหวนด้วยความเจ็บปวดขณะที่ผู้คุมบดขยี้ส้นเท้าของ [dummy_gender.GetHerHis] ลงไปอย่างโหดเหี้ยม"
 prison.9502.desc_stone:0 "มันกระเด็นออกจากหมวกเกราะของผู้คุมอย่างแรง แต่ [dummy_gender.GetSheHe] เพียงแค่หันกลับมาพร้อมกับเลิกคิ้วด้วยความประหลาดใจ\n\nเมื่อเห็นหิน [dummy_gender.GetSheHe] ก็โยนมันทิ้งไปด้วยรอยยิ้มเยาะเย้ย"
 prison.9502.desc_spoon:0 "มันกระเด็นออกจากหมวกเกราะของผู้คุม และ [dummy_gender.GetSheHe] แทบจะไม่สังเกตเห็น\n\nเมื่อหันกลับมาและเห็นช้อนที่วางผิดที่ [dummy_gender.GetSheHe] ก็หยิบมันขึ้นมาแล้วยัดใส่เข็มขัดของ [dummy_gender.GetHerHis] เอง"
 prison.9502.desc_cockroach:0 "มันตะเกียกตะกายหาที่ยึดเกาะ แต่การเคลื่อนไหวคงจะเตือนผู้คุม เพราะมือของ [dummy_gender.GetHerHis] ยกขึ้นมาและตบแมลงสาบอันเป็นที่รักของข้าลงกับพื้นอย่างโหดเหี้ยม เหยียบมันลงกับพื้นด้วยรอยยิ้มเยาะเย้ยอย่างรังเกียจ"
 prison.9502.a:0 "ไม่!! [ROOT.Char.Custom('prison_pet')] ของข้า!"

 prison.9503.t:0 "การทรยศ"
 prison.9503.desc:0 "เพื่อนนักโทษของข้า [prison_friend.GetTitledFirstName] และข้าใช้เวลาหลายคืนวางแผนการหลบหนีของเรา\n\nขณะที่ข้าทำเสียงดัง [prison_friend.GetSheHe] ก็ยืนพร้อมอยู่ที่ประตู ผู้คุมเปิดประตู และข้ายิ้ม ตอนนี้ [prison_friend.GetFirstNameNoTooltip] จะโจมตีจากด้านหลังและ– และนั่นคือเสียงประตูปิดตามหลังผู้คุม [prison_friend.GetTitledFirstNameNoTooltip] หายลับไปในยามค่ำคืน โดยไม่มีใครขัดขวางขณะที่ผู้คุมทั้งหมดมุ่งมาที่ข้า"
 prison.9503.a:0 "เอาล่ะ อย่างน้อย [prison_friend.GetSheHe] ก็ออกไปได้..."
 prison.9503.b:0 "เจ้า[prison_friend.Custom2('InsultAdjective', ROOT.Char)] [prison_friend.Custom2('InsultNoun', ROOT.Char)] มันทรยศข้า!"

 prison.9504.t:0 "เพื่อนนักโทษของข้า"
 prison.9504.desc:0 "ข้าใช้เวลาหลายชั่วโมงวางแผนการหลบหนี และขณะที่ข้าเดินทางออกไปกลางดึก ข้าก็อดไม่ได้ที่จะยิ้ม นี่อาจจะได้ผล! ผู้คุมถูก ทำให้หมดฤทธิ์แล้ว ทาง–\n\n"[ROOT.Char.GetFirstNameNoTooltip] กำลังหลบหนี! ยาม! #EMP ยาม!#!" เสียงแหบแห้งของ [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('prison_rival'))] ของข้า [prison_rival.GetTitledFirstName] ทำลายความเงียบ และในไม่ช้าข้าก็ถูกล้อมรอบด้วยยามติดอาวุธและโกรธเกรี้ยว"
 prison.9504.a:0 "สาปแช่งเจ้า [prison_rival.GetFirstNameNoTooltip]!"

 prison.9505.t:0 "การผลักดันขอบเขต"
 prison.9505.opening:0 "ข้าเริ่มตระหนักแล้วว่าข้าต้องกำหนดชะตาชีวิตของตนเอง เป็นที่ชัดเจน เช่นกันว่าไม่ใช่ทุกส่วนของ [bg_override_char.Custom('GetDungeon')|l] จะมีการป้องกันที่แน่นหนาเท่ากัน"
 prison.9505.tumble:0 "\n\nอย่างไรก็ตาม หลังจากตกจากส่วนที่ยื่นออกมาของกำแพงอย่างรุนแรง ข้าก็หวังว่ามันจะเป็น เช่นนั้น ใช้เวลาเป็นชั่วโมงกว่าจะมีคนพบข้าและช่วยพาข้าไปยังห้องพักของข้า ที่ ซึ่งมีการเรียกหมอมารักษา"
 prison.9505.tunnels:0 "\n\nอย่างไรก็ตาม ในไม่ช้าข้าก็ค้นพบว่าอุโมงค์ใต้กำแพงนั้นมืดและสับสน หลังจากมีรอยถลอกมากมายและหินกระแทกศีรษะข้าหลายครั้ง ข้าจึงหาทางออกกลับไปยังลานภายในได้สำเร็จ"
 prison.9505.camp: "\n\nอย่างไรก็ตาม ในไม่ช้าข้าก็พบว่าตัวเองอยู่ท่ามกลางเต็นท์ที่ซับซ้อนราวกับรังกระต่าย ซึ่งเกลื่อนไปด้วยกระถางไฟ ทหารที่เบื่อหน่าย และสิ่งกีดขวางให้สะดุดล้ม เมื่อถูกเชือกเต็นท์เจ้าเล่ห์ ทำให้หน้าคะมำ ข้ายอมรับว่าไม่มีทางออก ขณะที่ผู้คุมขังข้าไว้"
 prison.9505.a:0 "ข้า... ข้ายังไม่ตาย...!"
 prison.1010.toast_puppeteer:0 "[puppet_or_actor.GetShortUIName] tortured [recipient.GetShortUIName] but found no secrets"
 prison.1020.toast_puppeteer:0 "[puppet_or_actor.GetShortUIName] blinded [recipient.GetShortUIName]"
 prison.1025.toast_puppeteer:0 "[puppet_or_actor.GetShortUIName] castrated [recipient.GetShortUIName]"
 prison.1030.toast_puppeteer: "[puppet_or_actor.GetShortUIName] disfigured [recipient.GetShortUIName]"
 prison.1041.toast_puppeteer: "[puppet_or_actor.GetShortUIName] maimed [recipient.GetShortUIName]"
