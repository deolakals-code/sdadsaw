l_english: 
### Events
## Court Event 7030
# Foreign Merchants wish to establish a merchant quarter
 court.7030.title:0 "พ่อค้าต่างชาติ"
 court.7030.desc:0 "ขณะที่ข้าพเจ้าสำรวจราชสำนัก ข้าพเจ้าสังเกตเห็น [ROOT.Char.GetCouncillorPosition( 'councillor_steward' ).GetPositionName] ของข้าพเจ้า [steward.GetTitledFirstName] กำลังสนทนาอย่างมีชีวิตชีวากับแขกต่างชาติคนหนึ่งของข้าพเจ้า [foreign_merchant.GetName] ด้วยความสงสัย ข้าพเจ้าจึงเข้าไปหาทั้งคู่\n\n"[ROOT.Char.GetTitledFirstNameNoTooltip] ข้าพเจ้าเป็นตัวแทนผลประโยชน์ของกลุ่มการค้าของญาติชาว [foreign_merchant.GetCulture.GetName] ของข้าพเจ้า ซึ่งเห็นศักยภาพอันยิ่งใหญ่ในการจัดตั้งชุมชนพ่อค้าชาว [foreign_merchant.GetCulture.GetCollectiveNounNoTooltip] ที่นี่ใน [ROOT.Char.GetCapitalLocation.GetCounty.GetTitle.GetNameNoTier]" [foreign_merchant.GetNameNoTooltip] กล่าวอย่างประจบประแจง\n\n"[ROOT.GetCharacter.Custom2('RelationToMeShort' , SCOPE.sC('steward'))|U] เราต้องไม่ลำเอียงเข้าข้าง #EMP ชาวต่างชาติ#! มากกว่าคนของเราเอง!" [steward.GetFirstNameNoTooltip] คัดค้าน"
 court.7030.a:0 "เราจะจัดตั้งชุมชนพ่อค้าชาว [foreign_merchant.GetCulture.GetCollectiveNounNoTooltip]"
 court.7030.b:0 "สามารถทำข้อตกลงกันได้ที่นี่"
 court.7030.c:0 "เราจะขยายพื้นที่การค้าสำหรับทุกคน!"
 court.7030.d:0 "ชาว [foreign_merchant.GetCulture.GetCollectiveNounNoTooltip] จะต้องไม่แสวงหาผลประโยชน์จากตลาดของเรา!"
 court.7030.d.tt:0 "ขับไล่ [foreign_merchant.GetFirstNameNoTooltip] ออกจากอาณาจักรของเรา และยึดทองคำที่ [foreign_merchant.GetSheHe] ขโมยไปจากพ่อค้าของเราเองโดยชอบธรรม!"
### Court Event 7040
 court.7040.title:0 "เสาหลักแห่งชุมชน"
 court.7040.desc:1 "ข้าพเจ้าสังเกตเห็นว่า [ROOT.Char.GetCouncillorPosition( 'councillor_court_chaplain' ).GetPositionName] ของข้าพเจ้ากำลังเดินไปมาในห้องอย่างกระวนกระวาย\n\n"[chaplain.GetName] มีเรื่องอันใดรึ?" ข้าพเจ้าถาม\n\n"เป็นเรื่องของ [ascetic.GetName] พ่ะย่ะค่ะ/ขอรับ [ascetic.GetSheHe|U] ได้ปีนขึ้นไปบนเสาในลานพระราชวังในตอนเช้า และอยู่บนนั้นตลอดทั้งวันเพื่อบำเพ็ญสมาธิอย่างเงียบๆ [ascetic.GetSheHe|U] ปฏิเสธอาหารและเครื่องดื่ม และพูดน้อยมากเมื่อถูกถาม การปฏิบัติทางพรต เช่นนี้ไม่ใช่เรื่องที่ไม่เคยได้ยิน แต่กำลังรบกวนข้าราชสำนักบางคนของท่าน และพวกเขากำลังขอให้ข้าพเจ้าทำอะไรบางอย่างเกี่ยวกับเรื่องนี้""
 court.7040.a:0 "เพียงแค่เพิกเฉยต่อ [ascetic.GetHerHim] ในที่สุด [ascetic.GetSheHe] ก็จะเลิกไปเอง"
 court.7040.b:0 "ส่ง [ascetic.GetHerHim] ไปหา [head_of_faith.GetTitledFirstNameNoTooltip], ดูว่า [head_of_faith.GetSheHe] จะว่าอย่างไร"
 court.7040.c:0 "ความศรัทธาของ [ascetic.GetNamePossessiveNoTooltip] ช่างสร้างแรงบันดาลใจ, ข้าจะปฏิบัติตามแบบอย่างของ[ascetic.GetHerHis]!"
 court.7040.d:0 "หาก [ascetic.GetSheHe] ต้องการอยู่อย่างสันโดษ [ascetic.GetSheHe] ก็สามารถไปทำที่อื่นได้!"
### Court Event 7050 - Friend gifts you a cultural artifact from their time
 court.7050.title:0 "ของขวัญจากสหาย"
 court.7050.desc:0 "ขณะที่กิจการในราชสำนักดำเนินต่อไป ข้าพเจ้ายินดีเป็นอย่างยิ่งที่ได้เห็นใบหน้าของสหายข้าพเจ้า [friend.GetName] ท่ามกลางนักวางแผนและคนประจบสอพลอนับสิบ ข้าพเจ้าทักทาย [friend.GetFirstNameNoTooltip] อย่างอบอุ่น และสนทนากับ [friend.GetHerHim] อย่างอิสระดังที่ข้าพเจ้าสามารถทำได้กับคนเพียงไม่กี่คน ครึ่งทางของการสนทนา [friend.GetSheHe] หยิบถุงเล็กๆ ออกมาจากเสื้อผ้าของ [friend.GetHerHis] และวางไว้ในมือข้าพเจ้า \n\n"ของขวัญสำหรับท่านสหายของข้าพเจ้า บางสิ่ง เพื่อให้ท่านระลึกถึงช่วงเวลาดีๆ มันพิเศษสำหรับข้าพเจ้า และสำหรับผู้คนของข้าพเจ้า ชาว [friend.GetCulture.GetCollectiveNoun] ข้าพเจ้าหวังว่าท่านจะรับมันไว้""
 court.7050.a:0 ""แน่นอนสหายของข้าพเจ้า ข้าพเจ้าจะเก็บมันไว้กับตัวเสมอ!""
 court.7050.a.tt:0 "สิ่งนี้อาจมีผลกระทบที่ไม่ได้ตั้งใจ..."
 court.7050.b:0 ""ท่านใจดีเกินไป ข้าพเจ้ารับของขวัญของท่าน!""
 court.7050.c:0 "ข้าพเจ้าคือชาว [ROOT.Char.GetCulture.GetNameNoTooltip] ไม่ใช่ชาว [friend.GetCulture.GetNameNoTooltip]! ข้าพเจ้าปฏิเสธของขวัญของท่าน"
 court.7051.title:0 "สัญลักษณ์นอกรีต?"
 court.7051.desc:0 "นับตั้งแต่ข้าได้รับ [court_7050_artifact.GetName] เป็นของขวัญจาก [friend.GetName], ข้าก็เก็บมันไว้กับตัวมาตลอด ข้าคาดว่าคงเป็นที่สังเกตเห็นในราชสำนัก, เพราะตอนนี้ข้าถูกเข้าพบโดย [court_chaplain.GetCouncilTitle] [court_chaplain.GetName], ผู้ ซึ่งแสดงความกังวลของ[court_chaplain.GetHerHis]ว่าข้ากำลังถูกชักนำให้หลงผิดไปจากศรัทธาที่แท้จริง!\n\n"ข้าสังเกตเห็นว่าท่านเริ่มแสดงความชื่นชอบต่อสัญลักษณ์และวัตถุนอกรีต, สิ่งเหล่านั้น ซึ่งเกี่ยวข้องกับความเชื่อของพวก[court_chaplain.Custom('GetDerogatoryNonbeliever')] มักกล่าวกันว่า [court_chaplain.GetFaith.DevilName] มาหาเราโดยปลอมตัวเป็นมิตร, เพียงเพื่อนำเราไปสู่ความผิดพลาด""
 court.7051.a:0 "ข้าพเจ้าถูกหลอกโดย [ROOT.Char.GetFaith.DevilName]!"
 court.7051.a.tt:0 "เข้าข้าง [court_chaplain.GetFaith.GetAdherentNamePlural] มากกว่าสหายของท่าน"
 court.7051.b:0 "สัญลักษณ์? รูปเคารพ? ท่านกำลังพูดเรื่องอะไรกันแน่?"
 court.7051.b.tt:0 "แสร้งทำเป็นไม่รู้เรื่องโบราณวัตถุ"
 court.7051.c:0 "ท่านไม่สามารถแยกแยะความแตกต่างระหว่างวัฒนธรรมและศรัทธาได้หรือ?"
 court.7051.c.success:0 "ท่านโน้มน้าว [court_chaplain.GetNameNoTooltip] ได้สำเร็จ"
 court.7051.c.failure:0 "ท่านไม่สามารถโน้มน้าว [court_chaplain.GetNameNoTooltip] ได้"
 court.7051.d:0 "ไปให้พ้น, ข้าเชื่อใจ [friend.GetNameNoTooltip] ว่าจะไม่นำข้าไปในทางที่ผิด!"
### Court Event 7070 - Architect wishes to give your palace a makeover
 court.7070.title:0 "ศักยภาพของพระราชวัง"
 court.7070.desc:0 ""[ROOT.Char.Custom('FormOfAddressForLiege')|U], ข้าได้หารือเกี่ยวกับสภาพปัจจุบันของพระราชวังของท่านใน [palace_county.GetName] กับข้าราชบริพารของท่านที่เคยเป็นแขกที่นั่น ในฐานะ $royal_architect_court_position$ ของท่าน, ข้าคงจะบกพร่องต่อหน้าที่หากข้าไม่แจ้งให้ท่านทราบว่าพระราชวังของท่านใน [palace_county.GetName] อยู่ในสภาพที่ต้องการการบูรณะอย่างเร่งด่วน!" [architect.GetName] กล่าว\n\n"ข้าสงสัยว่า [ROOT.Char.Custom2('RelationToMeAddress',architect)], พวกเราอาจจะใช้โอกาสนี้ในการปรับปรุงการตก แต่งและรูปแบบทั้งหมดของพระราชวังอย่างจริงจัง, เพื่อที่จะเปลี่ยนจากสถาปัตยกรรม [ROOT.Char.GetCulture.GetName] แบบคลาสสิก ข้าต้องการเพียงเงินทุนและเวลาในการร่างแนวคิดบางอย่าง," [architect.GetFirstNameNoTooltip] เอ่ยถาม"
 court.7070.a:0 "ข้อเสนอแนะยอดเยี่ยม ท่านสามารถร่างแผนได้"
 court.7070.a.tt:0 "[architect.GetFirstNameNoTooltip] จะได้รับแรงบันดาลใจจาก [cultures|E] อื่นๆ เมื่อวางแผนการปรับปรุงพระราชวัง โดยนำเสนอทางเลือกที่อาจเพิ่ม [cultural_acceptance|E] ต่อ [cultures|E] อื่นๆ"
 court.7070.b:0 "ความฟุ่มเฟือย เช่นนั้นไม่จำเป็น การปรับปรุงง่ายๆ ก็เพียงพอแล้ว"
 court.7070.c:0 "พระราชวังก็ดีอยู่แล้ว!"
 court.7071.title:0 "สถาปัตยกรรมเลียนแบบ"
 court.7071.desc:0 "ตามสัญญา [architect.GetName] ได้กลับมาหาข้าพเจ้าพร้อมแผนการโดยละเอียดสามแผนสำหรับการปรับปรุงพระราชวังที่เสนอใน [palace_county.GetName]\n\n"ข้าพเจ้าได้รับแรงบันดาลใจจากรูปแบบ [culture_option_1.GetProvince.GetCounty.GetCulture.GetName] สำหรับการออกแบบแรก รูปแบบ [culture_option_2.GetProvince.GetCounty.GetCulture.GetName] สำหรับการออกแบบที่สอง และสำหรับแผนสุดท้าย ข้าพเจ้ายังคงรักษา [ROOT.Char.GetCulture.GetName] เป็นอิทธิพลหลัก [ROOT.Char.Custom2('RelationToMeAddress',architect)]"\n\nจากที่เห็น การออกแบบทั้งสามดูเหมือนจะมีราคาแพงมากและ รวมถึงการเพิ่มเติมใหม่ๆ เช่นเดียวกับการปรับปรุงโครงสร้างที่มีอยู่ - ไม่น่าจะเป็นงานที่รวดเร็วหรือราคาถูก"
 court.7071.a:0 "เลือกการออกแบบแบบ [culture_option_1.GetProvince.GetCounty.GetCulture.GetNameNoTooltip]"
 court.7071.continue:0 "โครงการดำเนินต่อไป..."
 court.7071.b:0 "มาใช้การออกแบบแบบ [culture_option_2.GetProvince.GetCounty.GetCulture.GetNameNoTooltip] กันเถอะ"
 court.7071.c:0 "พระราชวังนี้จะเป็นอนุสรณ์แห่งความเหนือกว่าของชาว [ROOT.Char.GetCulture.GetNameNoTooltip]!"
 court.7071.d:0 "นี่มันมากเกินไป ยกเลิกโครงการ"
 court.7072.title:0 "การปรับปรุงพระราชวังเสร็จสมบูรณ์!"
 court.7072.desc.other_culture:0 "หลังจากทำงานมาหลายเดือน ข้าพเจ้าได้รับแจ้งว่างานก่อสร้างที่พระราชวังใน [palace_county.GetName] เสร็จสมบูรณ์แล้ว และข้าพเจ้าได้เดินทางไปยัง [palace_county.GetNameNoTooltip] พร้อมกับ $royal_architect_court_position$ ของข้าพเจ้า [architect.GetName] เพื่อตรวจสอบผลลัพธ์ด้วยตนเอง\n\nขณะที่ข้าพเจ้าจ้องมองพระราชวังใหม่ แล้วมุ่งหน้าเข้าไปข้างใน [architect.GetFirstNameNoTooltip] ยังคงอยู่เคียงข้างข้าพเจ้า รอคอยคำชมและการอุปถัมภ์อย่างกระตือรือร้น หลังจากสำรวจพระราชวังด้วยรูปแบบที่ไม่คุ้นเคยและการตก แต่งแบบต่างชาติ ข้าพเจ้าประกาศว่ามัน..."
 court.7072.desc.own_culture:0 "หลังจากทำงานมาหลายเดือน ข้าพเจ้าได้รับแจ้งว่างานก่อสร้างที่พระราชวังใน [palace_county.GetName] เสร็จสมบูรณ์แล้ว และข้าพเจ้าได้เดินทางไปยัง [palace_county.GetNameNoTooltip] พร้อมกับ $royal_architect_court_position$ ของข้าพเจ้า [architect.GetName] เพื่อตรวจสอบผลลัพธ์ด้วยตนเอง ขณะที่ข้าพเจ้าจ้องมองพระราชวังใหม่ แล้วมุ่งหน้าเข้าไปข้างใน [architect.GetFirstNameNoTooltip] ยังคงอยู่เคียงข้างข้าพเจ้า รอคอยคำชมและการอุปถัมภ์อย่างกระตือรือร้น หลังจากสำรวจพระราชวัง ด้วยรูปแบบที่คุ้นเคยและการตก แต่งที่ให้ความมั่นใจ ข้าพเจ้าประกาศว่ามัน..."
 court.7072.a:0 ""งดงาม งดงามอย่างแท้จริง!""
 court.7072.b:0 ""หายนะ ข้าพเจ้าเกลียดสิ่งนี้!""
 court.7072.c:0 ""พอรับได้ แต่มันจะคุ้มค่ากับค่าใช้จ่ายหรือไม่?""
## Exotic Pet 
 court.7100.title:0 "สัตว์ร้ายที่ถูกจับ"
 court.7100.desc:0 "เหตุการณ์แปลก ๆ ทุกรูปแบบเป็นที่ทราบกันดีว่าเกิดขึ้นในราชสำนักของข้า, แต่ $master_of_hunt_court_position$ [huntmaster.GetFirstName] จูง #EMP [SCOPE.Custom('GetExoticPet')] #!เข้ามาในห้องบัลลังก์ของข้าด้วยโซ่ตรวนนั้น ไม่ใช่สิ่งที่ข้าคาดคิดไว้เลย, จริง ๆ\n\n"[ROOT.Char.Custom('FormOfAddressForLiege')|U], ข้านำเสนอสัตว์ร้ายชั้นดีนี้แก่ท่านเป็นของขวัญ, รางวัลจากการล่าครั้งล่าสุดของข้า! #EMP ผู้ปกครองทั้งหมด #!ในทุกวันนี้ล้วนมีสัตว์แปลก ๆ เพื่อประดับราชสำนักและแสดงความยิ่งใหญ่ของพวกเขา!"\n\nเป็นที่ชัดเจนว่า [huntmaster.GetFirstNameNoTooltip] ต้องการให้ข้าเก็บสิ่งนี้ไว้!"
 court.7100.a:0 "ข้าพเจ้าจะทำอะไรกับ [SCOPE.Custom('GetExoticPet')]?"
 court.7100.a.tt:0 "สั่งให้ [huntmaster.GetFirstName] กำจัดสัตว์ตัวนั้นทันที!"
 court.7100.b:0 "สัตว์ร้ายตัวนี้จะเป็นสัตว์เลี้ยงสุดที่รักของข้าพเจ้า!"
 court.7100.c:0 "ทำไม #EMP ท่าน #!ไม่เก็บมันไว้แทนล่ะ?"
## Court Musician Racket
 court.7200.title:0 "ดังและภูมิใจ"
 court.7200.intro.desc:0 "ข้าพเจ้าภูมิใจในความหรูหราของราชสำนัก แต่หลายคืนมานี้ความหรูหรานั้นอยู่ในรูปแบบของการทรมานทางดนตรีอันประณีต"
 court.7200.drum.desc:0 "\n\nเมื่อเร็วๆ นี้ $court_musician_court_position$ ของข้าพเจ้า [loud_musician.GetFirstName] ได้เครื่องดนตรีใหม่มา เป็นกลองชนิดหนึ่ง และได้ตีมันเสียงดังตลอดเวลาทั้งกลางวันและกลางคืน"
 court.7200.trombone.desc:0 "\n\nเมื่อเร็วๆ นี้ $court_musician_court_position$ ของข้าพเจ้า [loud_musician.GetFirstName] ได้เครื่องดนตรีใหม่มา เป็นแตรทองเหลืองชนิดหนึ่ง และได้เป่ามันเสียงดังตลอดเวลาทั้งกลางวันและกลางคืน"
 court.7200.pipes.desc:0 "\n\nเมื่อเร็วๆ นี้ $court_musician_court_position$ ของข้าพเจ้า [loud_musician.GetFirstName] ได้เครื่องดนตรีใหม่มา เป็นปี่ชนิดหนึ่ง และได้เป่าเสียงไม่เข้ากันตลอดทั้งวันทั้งคืน"
 court.7200.guitar.desc:0 "\n\nเมื่อเร็วๆ นี้ $court_musician_court_position$ ของข้าพเจ้า [loud_musician.GetFirstName] ได้เครื่องดนตรีใหม่มา เป็นซิโตลา ข้าพเจ้าเชื่อ เช่นนั้น และได้ดีดมันเสียงดังตลอดเวลาทั้งกลางวันและกลางคืน"
 court.7200.outro.desc:0 "\n\nเมื่อเผชิญหน้ากับ [loud_musician.GetFirstNameNoTooltip], [loud_musician.GetSheHe] ก็ประกาศว่า, "[ROOT.Char.Custom('FormOfAddressForLiege')|U], ข้าเพียงแค่ฝึกฝนศิลปะของข้า, เพื่อที่ข้าจะได้เป็น $court_musician_court_position$ ที่ท่านสมควรได้รับ!""
 court.7200.a:0 "เพียงแค่ลดเสียงดนตรีให้เบาที่สุดในตอนกลางคืน?"
 court.7200.b:0 "เอา #EMP ศิลปะ #!ของเจ้าไปให้พ้น!"
 court.7200.c:0 "ถ้าดนตรีของเจ้าดีกว่านี้ เราคงไม่บ่น!"
# Food Taster Displeased
 court.7300.t:0 "ซอสเนื้อแกะอยู่ไหน?"
 court.7300.desc:1 "ความพยายามลอบสังหารชีวิตข้านั้นเป็นสิ่งที่คาดเดาได้, และ ดังนั้นคนที่ข้าพึ่งพาเรื่องความปลอดภัยจะต้องยังคงภักดีและมีทัศนคติที่ดีต่อข้า อย่างไรก็ตามวันนี้, $food_taster_court_position$ ที่ข้า แต่งตั้ง [taster.GetFirstName] ดูรังเกียจอย่างที่สุด, และหน้าซีดเล็กน้อย, ขณะที่ข้าเข้าไปตรวจสอบ[taster.GetHerHim]\n\n "[ROOT.Char.Custom('FormOfAddressForLiege')|U], ข้าทนไม่ไหวอีกต่อไปแล้ว อาหารที่ราชสำนักของท่านเสิร์ฟนั้นมัน #EMP เลวร้ายอย่างที่สุด!#! ข้าไม่อยากจะเชื่อว่าท่านกินข้าวต้มเละ ๆ นี่ #EMP คืนแล้วคืนเล่าคืนเล่า..."#!\n\n"...ของโสโครกนี่แทบจะไม่เหมาะกับโต๊ะอาหารของชาวนาด้วยซ้ำ!""
 court.7300.a:0 "#EMP โต๊ะอาหารของชาวนา? #!เราต้องแก้ไขเรื่องนี้ทันที!"
 court.7300.b:0 "อาหารก็ดีอยู่แล้ว ท่านกำลังพูดเรื่องอะไร?"
 court.7300.c:0 "ก็ได้ ข้าพเจ้าจะหาคนอื่นมารับเงินเพื่อกินอาหารของข้าพเจ้า!"
## Troublesome Guests
 court.7400.title:0 "อยู่เกินเวลาต้อนรับ?"
 court.7400.desc:1 "ราชสำนักของข้าพเจ้ามีชื่อเสียงในด้านการต้อนรับที่หรูหรา และแขกที่นี่มักพิสูจน์ว่า...มีประโยชน์\n\nอย่างไรก็ตาม ในบางครั้ง เราก็มีแขก #EMP ที่ซ้ำซ้อน #!ในราชสำนัก ซึ่งวัตถุประสงค์ไม่ชัดเจนและการปรากฏตัวของพวกเขาเป็นการสิ้นเปลืองคลังของข้าพเจ้าโดยไม่จำเป็น\n\nหนึ่งในผู้เกาะกิน เช่นนั้นคือ [guest.GetFirstName] ซึ่งอยู่ที่นี่มาระยะหนึ่งแล้วในฐานะแขกของ [guest_liege.GetTitledFirstName] และดูเหมือนจะกินจุพอสำหรับสิบสองคน\n\n[guest.GetWomanMan] กำลังกินจนข้าพเจ้าหมดตัว และต้อง #EMP ทำ#! อะไรบางอย่าง"
 court.7400.a:0 "ปล่อยให้ [guest.GetHerHim] อยู่ต่อ"
 court.7400.a.tt:0 "แน่นอนว่าพวกเขาต้องมีประโยชน์ในบางจุด ใช่ไหม?"
 court.7400.b:1 "ข้ารู้จักงานที่สมบูรณ์แบบสำหรับ [guest.GetHerHim]..."
 court.7400.b.tt:1 "จ้าง [guest.GetHerHim] ในตำแหน่งเล็กน้อยบางตำแหน่งในราชสำนักของท่าน"
 court.7400.c:1 "ไอ้ปรสิต กลับไปที่ที่เจ้ามา!"
## Child starts to go hunting
 court.7600.t:0 "หัวใจป่าเถื่อน"
 court.7600.desc:1 "[child.Custom('GetDaughterSon')] ของข้า [child.GetName] เดินเข้ามาในห้องบัลลังก์พร้อมกับโคลนและเลือดที่เกรอะกรังไปทั่วใบหน้าของ[child.GetHerHis] ข้ายืนขึ้นด้วยความตกใจ, ตั้งใจจะตำหนิ[child.GetHerHim]สำหรับความไม่เหมาะสมของ[child.GetHerHis], เมื่อ $master_of_hunt_court_position$ [huntmaster.GetFirstName] ก้าวเข้ามา, ในสภาพที่เต็มไปด้วยโคลนและคราบเลือด เช่นเดียวกัน, ยิ้มกว้างจนถึงใบหู\n\n"[ROOT.Char.Custom('FormOfAddressForLiege')|U], [child.GetTitledFirstNameNoTooltip] ที่นี่ล้ม [child.Custom('GetAnimalType')] อันยิ่งใหญ่ได้ระหว่างการล่าของเรา, บางทีอาจเป็นตัวที่ดีที่สุดที่ข้าเคยเห็นในปีนี้"\n\nข้าเดาว่าชั้นเรียนล่าสัตว์ของ [child.GetFirstNamePossessiveNoTooltip] คงเป็นไปได้ด้วยดี, แต่ข้าก็อดสงสัยไม่ได้ว่ามันจะไม่มีวิธีที่มีประสิทธิผลมากกว่านี้ในการลงทุนเวลาของ[child.GetHerHis]หรือ..."
 court.7600.a:1 "การออกไปเที่ยวเหล่านี้จะถูกแทนที่ด้วยการศึกษาที่มีประโยชน์มากกว่า"
 court.7600.b:1 "อืมมม บางทีเราควรทดสอบ [child.Custom('GetDaughterSon')] ของข้าพเจ้าเพิ่มเติม..."
 court.7600.b.tt:1 "สั่งให้ [huntmaster.GetNameNoTooltip] ผลักดัน [child.GetNameNoTooltip] ให้ถึงขีดจำกัดของ [child.GetHerHis] ในการล่าอีกครั้ง"
 court.7600.b.death:1 "[child.GetNameNoTooltip] เสียชีวิตขณะล่าสัตว์"
 court.7600.b.wounding:1 "[child.GetNameNoTooltip] ได้รับบาดเจ็บขณะล่าสัตว์"
 court.7600.b.victory:1 "การล่าสัตว์ที่ประสบความสำเร็จสำหรับ [child.GetNameNoTooltip]"
 court.7600.c:1 "ข้าพเจ้าไม่สามารถภูมิใจได้มากกว่านี้อีกแล้ว!"
 7600_taking_child_to_hunt: "พาเด็กไปล่าสัตว์"
 7600_taking_child_to_hunt.tt: "การพาเด็กไปล่าสัตว์อย่างปลอดภัยเป็นความรับผิดชอบที่ต้องใช้ประสบการณ์อย่างมาก ความถนัด [aptitude|E] ของ $master_of_hunt_court_position$ ของท่านเพิ่มขึ้น"
## Child wants a destrier
 court.7610.title:0 "คำขอในคอกม้า"
 court.7610.desc:1 "[child.Custom('GetDaughterSon')] ของข้าพเจ้า [child.GetName] กำลังเติบโตขึ้น และวันหนึ่งจะถูกคาดหวังให้รับบทบาทที่สูงส่งในสังคม เห็นได้ชัดว่า [child.GetSheHe] ได้ตัดสินใจว่าวันนี้คือวันนั้น\n\n "[ROOT.Char.GetMotherFather|U] ข้าพเจ้าขอม้าศึกได้หรือไม่?"\n\n#EMP ม้าศึก?#! สำหรับ #EMP เด็ก?!#! ขณะที่ข้าพเจ้าไตร่ตรองคำขอ ข้าพเจ้าสังเกตเห็น $master_of_horse_court_position$ [horsemaster.GetName] เหลือบมองข้าพเจ้าจากอีกฟากหนึ่งของท้องพระโรง\n\nอย่างน้อยตอนนี้ข้าพเจ้าก็รู้แล้วว่า [child.Custom('GetDaughterSon')] ของข้าพเจ้าคุยกับใครเมื่อเร็วๆ นี้...."
 court.7610.a:0 "เป็นทางเลือกที่กล้าหาญ!"
 court.7610.b:1 "แล้วอะไรที่... เล็กกว่านี้ล่ะ?"
 court.7610.c:1 "อย่าไร้สาระน่า"
## Negotiation over a falcon
 court.7620.title:0 "นกขนสีทอง"
 court.7620.desc:1 "ที่ปีกของท้องพระโรง ข้าพเจ้าได้ยิน $master_of_hunt_court_position$ [huntmaster.GetName] กำลังเจรจาอย่างเข้มข้นกับ [falconer.GetName] เกี่ยวกับการขายเหยี่ยวเพเรกรินที่สวยงาม ซึ่งเป็นนกที่มีเกียรติอย่างสูงสำหรับทุกคนที่จะเป็นเจ้าของ\n\n[huntmaster.GetFirstNameNoTooltip] ดูเหมือนจะติดอยู่กับการต่อรองราคา โดยคนเลี้ยงเหยี่ยวปฏิเสธที่จะขยับ และจากความหงุดหงิดในน้ำเสียงของทั้งคู่ พวกเขาอยู่ที่นี่มา #EMP สักพัก#! แล้ว\n\nบางทีพวกเขาอาจจะซาบซึ้งกับการแทรกแซงของ [ROOT.Char.GetTitleAsNamePossessiveNoTooltip] ของพวกเขา... เกือบเท่าที่ข้าพเจ้าคิดว่าข้าพเจ้าจะซาบซึ้งกับนกตัวใหม่"
 court.7620.a:0 "[falconer.GetFirstNameNoTooltip] ท่านก็รู้ว่าท่านกำลังขอมากเกินไป!"
 court.7620.a.success:0 "ท่านประสบความสำเร็จในการเจรจากับ [falconer.GetShortUINameNoTooltip]"
 court.7620.a.failure:0 "ท่านล้มเหลวในการเจรจากับ [falconer.GetShortUINameNoTooltip]"
 court.7620.b:1 "มาเถอะ ข้าพเจ้าจะให้ข้อเสนอที่ดีกว่าแก่ท่าน"
 court.7620.c:0 "เพียงแค่อย่าให้มันเข้ามาในท้องพระโรงของข้าพเจ้าก็พอ โอเคไหม?"
## Argument over a hawking kill
 court.7630.title:0 "นกล่าเหยื่อ"
 court.7630.desc:0 "การล่าสัตว์ดูเหมือนจะดึงเอาด้านที่แย่ที่สุดในวงในของข้าราชสำนักออกมา $master_of_horse_court_position$ ของข้าพเจ้า [horsemaster.GetName] และ $master_of_hunt_court_position$ ของข้าพเจ้า [huntmaster.GetName] เพิ่งกลับมาจากการล่าสัตว์ด้วยกัน และตอนนี้กำลังโต้เถียงกันอย่างดุเดือดกลางท้องพระโรงของข้าพเจ้า\n\n"นกของข้าพเจ้าล่อมันออกมา มันต้องเป็นผู้สังหาร!" [horsemaster.GetFirstNameNoTooltip] ตะโกน\n\n "นกของข้าพเจ้าได้ซากศพ ไม่ต้องสงสัยเลยว่าเกียรติยศเป็นของข้าพเจ้า!" [huntmaster.GetFirstNameNoTooltip] ตะโกน\n\nพวกเขาดูเหมือนจะโกรธจัดว่าเหยี่ยวของใครเป็นผู้รับผิดชอบในการสังหาร"
 court.7630.a:0 "ชัยชนะเป็นของ [horsemaster.GetFirstNameNoTooltip]"
 court.7630.b:0 "นี่คือความสำเร็จของ [huntmaster.GetFirstNamePossessiveNoTooltip]"
 court.7630.c:0 "ทำไมพวกท่านทั้งสองไม่สามารถแบ่งปันชัยชนะนี้ได้?"
 court.7630.c.tt:0 "พยายามโน้มน้าว [horsemaster.GetShortUIName] และ [huntmaster.GetShortUIName] ว่าพวกเขาทั้งคู่เป็นผู้ชนะ:"
 court.7630.c.success:0 "ท่านประสบความสำเร็จในการหาจุดกึ่งกลาง"
 court.7630.c.failure:0 "ท่านเพียงแค่ ทำให้เรื่องแย่ลง"
## Courtier Abused their Bird
 court.7640.title:0 "การทารุณกรรมนก"
 court.7640.desc:1 ""จับกุม[avian_abuser.GetHerHim]!" $master_of_hunt_court_position$ [huntmaster.GetFirstName] ตะโกนลั่น, พลางชี้ไปที่ [avian_abuser.GetName] ทหารองครักษ์ส่วนตัวของข้าเคลื่อนไปข้างหน้าอย่างลังเล, ไม่แน่ใจว่าจะทำตามคำสั่งของ [huntmaster.GetFirstNameNoTooltip] หรือไม่ ข้ายกมือขึ้นเพื่อหยุดพวกเขา, และถาม [huntmaster.GetFirstNameNoTooltip] ว่าอะไร ทำให้[huntmaster.GetHerHim]ก่อความโกลาหล เช่นนี้\n\n"[ROOT.Char.Custom('FormOfAddressForLiege')|U], #EMP สัตว์ประหลาด#! ตนนี้จงใจทำร้ายเหยี่ยวของ[avian_abuser.GetHerHis]ระหว่างการล่าครั้งล่าสุดของเรา! [avian_abuser.GetSheHe|U]จะต้องถูกลงโทษอย่างหนัก, เกียรติยศ #EMP เรียกร้อง#! เช่นนั้น""
 court.7640.a:0 "มันเป็นแค่นก ปล่อย [avian_abuser.GetHerHim] ไป"
 court.7640.b:0 "จำคุก #EMP ไอ้คนพาล#! นี้!"
 court.7640.c:0 "ปรับ #EMP ไอ้คนชั่ว#! นี้!"
 court.7640.d:0 "เฆี่ยน #EMP ไอ้เลว#! นี้!"
## Spymaster has a reverse carrier pigeon
 court.7700.t:0 "ด้นสด"
 court.7700.desc:1 "วันนี้ บนไหล่ของ [spymaster.Custom2('MyCharacterIntroduction', ROOT.Char)] มีอีกาหน้าตาประหลาดเกาะอยู่ ใช้ความวุ่นวายของท้องพระโรงเพื่อป้องกันการสนทนาของเราจากหูที่สอดรู้สอดเห็น [spymaster.GetFirstNameNoTooltip] ยกย่องคุณสมบัติอันน่าทึ่งของนกให้ข้าพเจ้าฟัง\n\n"นางเป็นหัวขโมยที่เก่งกาจ ฝ่าบาท นางไม่ได้ขโมยทองคำหรืออัญมณี แต่ขโมยบันทึก กุญแจ และจดหมาย - สิ่งเล็กๆ น้อยๆ ทั้งหมดที่บรรจุความจริงอันน่าอึดอัดใจที่เจ้าของต้องการปกปิด""
 court.7700.a:0 "หัวขโมย! ทหาร จับกุมไอ้คนพาลนี้!"
 court.7700.b:0 "ท่านช่วยหาข้อมูลเพิ่มเติมเกี่ยวกับ [scheme.GetTargetCharacter.GetTitledFirstNameNoTooltip] ได้หรือไม่?"
 court.7700.b.tt:0 "ใช้ประโยชน์จากสิ่งนี้เพื่อช่วย [scheme.GetName] ที่กำลังดำเนินอยู่ของท่าน"
 court.7700.c:1 "ช่างหลอกลวงอย่างน่าชื่นชม..."
 court.7700.d:0 "เล่ห์เหลี่ยม เช่นนั้นต่ำต้อยเกินไปสำหรับข้าพเจ้า"
