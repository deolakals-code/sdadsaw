l_english: 

 # Secret History
 court_6000_all_courtiers_and_guests:0 "[courtiers|E] และ [guests|E] ทั้งหมดของท่าน"
 court.6000.t:0 "ประวัติศาสตร์ลับ"
 court.6000.desc_opening:1 "ขณะที่ข้าพเจ้าเดินเข้าไปในห้อง ข้าพเจ้าประหลาดใจอย่างยิ่งกับเสียงร้องอุทานด้วยความตกใจของ [courtier.GetFirstName] ซึ่งก่อนหน้านี้กำลังหมกมุ่นอยู่กับต้นฉบับที่ชื่อว่า 'ประวัติศาสตร์ลับของ [ROOT.Char.GetPrimaryTitle.GetNameNoTier]'"
 court.6000.desc_liege:0 "\n\n"[SCOPE.sC('courtier').Custom2('RelationToMe', ROOT.GetCharacter)] ของข้า!"
 court.6000.desc_family:0 "\n\n"[SCOPE.sC('courtier').Custom2('RelationToMe', ROOT.GetCharacter)]!"
 court.6000.desc_ending:0 "ไม่มีอะไรน่าสงสัย! ไม่มีเลย!" [courtier.GetSheHe] ตะโกน ขณะพยายามซ่อนวัตถุที่น่ารังเกียจนั้นไว้ในเสื้อคลุมของ [courtier.GetHerHis] อย่างไม่สำเร็จ \n\nเมื่อข้าพเจ้าสามารถแย่งหนังสือเล่มนั้นมาจากมือของ [courtier.GetHerHis] ได้ ข้าพเจ้าตกใจเมื่อพบหน้าแล้วหน้าเล่าของรายละเอียดความชั่วร้ายที่กล่าวหาว่าเกิดขึ้นในราชสำนักของผู้ดำรงตำแหน่งก่อนหน้าข้าพเจ้า โดยได้รับพรจาก [predecessor.GetHerHis]!"
 court.6000.a:1 "#EMP น่าโมโห!#! ใครกันที่เขียนเรื่องโกหกโจ่งแจ้ง เช่นนี้?"
 court.6000.a.tt:0 "ท่านส่งหัวหน้าสายลับไปสืบสวน"
 court.6000.b:0 "โอ้โห เรื่องซุบซิบฉาวโฉ่!"
 court.6000.b.tt:0 "ท่านอาจเปิดโปงอดีต #EMP อันฉาวโฉ่#! ของใครบางคน"
 court.6000.c:1 "ทุกคนสมควรได้รับรู้ความจริงเกี่ยวกับ [predecessor.GetTitledFirstNameNoTooltip]!"
 court.6000.c.tt:0 "[predecessor.GetSheHe|U] เป็นทรราชที่น่ารังเกียจ ไม่คู่ควรกับราชวงศ์ของข้าพเจ้า! ให้ข้าพเจ้าบอกท่าน #EMP อย่างชัดเจน#! ว่าข้าพเจ้าคิดอย่างไรกับไอ้ลูกสุนัขขี้ขลาดตาขาวนั่น..."
 court.6000.d:0 "น่าเบื่ออะไร เช่นนี้ ข้าพเจ้าไม่สนใจจริงๆ"
 court.6000.e.tt:0 "ท่านเริ่มการสืบสวนของท่านเอง"
 court.6000.f:0 "ทั้งหมดเป็นความจริง แต่เราต้องให้อภัยและลืมเลือน"
 court.6002.desc:0 "ข้ากำลังก้มหน้าก้มตาอ่านจดหมายติดต่อระหว่างประเทศอยู่ เมื่อ [spymaster.GetTitledFirstName] พรวดพราดเข้ามาในห้อง, ลาก [author.GetTitledFirstName] ที่ท่าทางหวาดกลัวตามหลังมาด้วย \n\n "[ROOT.Char.Custom('FormOfAddressForLiege')|U], ข้าเจอ[author.GetHerHim]แล้ว! เจ้าวายร้ายที่เขียนหนังสือโป้ปดอันน่าละอายเกี่ยวกับผู้ครองบัลลังก์ก่อนหน้าท่าน, [predecessor.GetTitledFirstName]!""
 court.6002.b.desc_opening:0 "ในช่วงหลายเดือนที่ผ่านมา ข้าพเจ้าได้อุทิศเวลาว่างทุกขณะให้กับการค้นหางูร้ายที่หลบซ่อนตัว ซึ่งกำลังเผยแพร่หนังสือเกี่ยวกับความผิดพลาดของผู้ดำรงตำแหน่งก่อนหน้าข้าพเจ้า"
 court.6002.b.desc_ending:2 "หลังจากนอนไม่หลับมาหลายคืน ในที่สุดข้าพเจ้าก็พบตัวผู้กระทำผิด: มันคือ [author.GetTitledFirstName] ผู้ขี้ขลาด! \n\nขณะที่ [author.GetSheHe] ยืนตัวสั่นอยู่ต่อหน้าข้าพเจ้า รอการตัดสิน ข้าพเจ้าคิดอย่างรอบคอบว่าจะพูดอะไรต่อไป"
 court.6002.a:0 "เจ้าควรละอายใจกับคำโกหกอันน่าอดสูของเจ้า!"
 court.6002.a.tt:0 "[author.GetSheHe|U] ควรจะถอนคำประกาศของ [author.GetHerHis] และสำนึกผิด หรือไม่ก็..."
 COURT_OF_NO_SECRETS_VALUE: "การกดขี่ฝ่ายตรงข้าม"
 court.6002.a.tt2: "เพิ่มประสิทธิภาพของภารกิจ $task_find_secrets$ ของหัวหน้าสายลับของท่านเป็นเวลา 15 ปี"
 court.6002.b:0 "ทหาร จับกุมคนทรยศผู้นี้!"
 court.6002.c:0 "เจ้าล้ำเส้นเกินไปแล้วจริงๆ [author.GetFirstNameNoTooltip]..."
 court.6002.d:0 "ข้าพเจ้าแน่ใจว่าเจ้าไม่ได้มีเจตนาร้ายกับบันทึกเล็กๆ ของเจ้า ใช่ไหม?"
 court.6003.desc:1 "เป็นเวลาหลายเดือนแล้ว แต่หัวหน้าสายลับของข้า [spymaster.GetTitledFirstName] ยังไม่ได้รายงานความคืบหน้าที่สำคัญใด ๆ เกี่ยวกับภารกิจพิเศษของ [spymaster.GetHerHis]: การตามหาผู้เขียนต้นฉบับอันน่าอับอายที่สาปแช่ง ซึ่งให้รายละเอียดเกี่ยวกับความชั่วร้ายที่เป็นความลับของบรรพบุรุษของข้า! \n\nไม่น่าแปลกใจเลยที่เมื่อข้าเรียก [spymaster.GetHerHim] มาพบในที่สุด [spymaster.GetFirstNameNoTooltip] ดูประหม่าและรู้สึกผิดอย่างมาก "[ROOT.GetLadyLord] ของข้า! ข้าได้ค้นหาไปทั่วทุกหนทุกแห่ง แต่ผู้เขียนหายตัวไปแล้ว! บางทีพวกเขาอาจออกจากราชสำนักไปแล้ว หรือมีใครบางคนกำลังปกป้องพวกเขาอยู่ หรือ-" \n\nข้าหยุดคำพูดพล่ามของ [spymaster.GetHerHis] ด้วยท่าทางมือ"
 court.6003.b.desc_ending:0 "\n\nน่าเศร้าที่ความพยายามอย่างสุดความสามารถของข้าพเจ้ากลับไร้ผล เนื่องจากผู้กระทำผิดดูเหมือนจะหายตัวไป และร่องรอยก็เย็นลง ข้าพเจ้าคงจะไม่มีวันได้รู้ความจริง"
 court.6003.a:0 "ช่างมันเถอะ มันไม่ใช่เรื่องใหญ่"
 court.6003.b:0 "นี่น่าผิดหวังมาก"
 court.6003.c:2 "พวกเจ้า #EMP ปลิงไร้ประโยชน์#! กำลังปกป้องผู้ แต่งอยู่ใช่ไหม?"
 court.6003.c.tt:0 "ท่านระบายอารมณ์ใส่ข้าราชสำนักของท่าน"
 court.6003.d:0 "ท่านทำดีที่สุดแล้ว, [spymaster.GetTitledFirstNameNoTooltip]..."
 court.6003.e:0 "ในเมื่อเจ้าหาผู้ แต่งไม่พบ เจ้าก็ต้องรับผิดแทนพวกเขา!"
 #Prophet in the Halls
 court.6010.t:0 "ศาสดาในโถงทางเดิน"
 court.6010.desc:1 ""#EMP จงสำนึกผิดวันนี้!#! เรียนรู้ความจริงอันแท้จริง! ก้าวเข้าสู่แสงสว่าง!" \n\nนับตั้งแต่ [preacher.GetTitledFirstName] เข้าร่วมราชสำนักของข้าพเจ้า ความพยายามอย่างไม่ลดละของ [preacher.GetHerHis] ในการเปลี่ยนให้ทุกคนมานับถือลัทธิต่างแดนของ [preacher.GetHerHis] ได้กลายเป็นเสียงรบกวนในชีวิตประจำวันของข้าพเจ้า\n\nทั้งวันทั้งคืน [preacher.GetSheHe] เดินด้อมๆ มองๆ ในลาน ป้วนเปี้ยนตามโถงทางเดิน และซ่อนตัวรอผู้สัญจรไปมาที่ไม่ทันระวังตัวในมุมมืด พร้อมที่จะ #EMP โน้มน้าว#! พวกเขาด้วยเสียงกรีดร้องอันยืนกรานของ [preacher.GetHerHis] \n\nข้าราชสำนักของข้าพเจ้าเหนื่อยล้า และหลังจากที่ [preacher.GetFirstNameNoTooltip] ซุ่มโจมตีข้าพเจ้าระหว่างทางไปห้องส้วม ข้าพเจ้าก็เห็นด้วยกับความไม่พอใจของพวกเขา"
 court.6010.a:0 "เราสามารถทนต่อสิ่งนี้และมากกว่านี้ได้ [preacher.GetFirstNameNoTooltip] ไม่เป็นอันตราย"
 court.6010.b:1 "เตะไอ้โง่นั่นออกจากราชสำนักของข้าพเจ้า!"
 court.6010.c:1 "[preacher.GetSheHe|U] จะไปเทศน์ให้หนูฟัง ข้าพเจ้าก็ไม่สน..."
 court.6010.c.tt:0 "เจ้าเหนือหัวของ [preacher.GetHerHim|U] [preacher_liege.GeTitledFirstName] จะไม่พอใจ"
 court.6010.c.tt2: "ภารกิจ $task_conversion$ ของ [chaplain.GetCouncilTitlePossessive|U] [councillor_task|E] ของท่านมีประสิทธิภาพ #P มากขึ้น#! ในเคาน์ตีที่มีความเชื่อ [preacher.GetFaith.GetName] เป็นเวลา 20 ปี"
 court.6010.c.tt3: "ภารกิจ $task_conversion$ ของ [chaplain.GetCouncilTitlePossessive|U] [councillor_task|E] ของท่านมีประสิทธิภาพ #N น้อยลง#! ในเคาน์ตีที่มีความเชื่อ [preacher.GetFaith.GetName] เป็นเวลา 20 ปี"
 court.6010.a_every_county: "ทุกเคาน์ตี [county|E] ที่มีความเชื่อ [preacher.GetFaith.GetName] ในอาณาจักร [realm|E] ของท่าน ([preacher_faith_counties_size])"
 court_6010_harsh_conversions: "การเปลี่ยนศาสนาอย่างรุนแรง"
 court_6010_tolerant_conversions: "แนวทางที่อดทนอดกลั้น"
 court.6010.d:0 "พอได้แล้วกับ #EMP การดูหมิ่นศาสนา#!! นี้"
 court_6010_all_courtiers_and_guests_faith:0 "ข้าราชสำนัก [courtiers|E] และแขก [guests|E] ชาว [preacher.GetFaith.GetAdjectiveNoTooltip] ทั้งหมดของท่าน"
 court.6011.desc_opening:0 "[preacher_liege.Custom2('AppropriateGreetingNegative', ROOT.Char)]"
 court.6011.desc_prisoner:0 "ข้าพเจ้าทราบมาว่าท่านเพิ่งจำคุกไพร่ฟ้าข้าแผ่นดินของข้าพเจ้าโดยไม่มีเหตุผลที่ดีไปกว่าการเทศนาความเชื่อของ [preacher.GetHerHis] - #EMP ความเชื่อของข้าพเจ้าเอง#! - ในราชสำนักของท่าน \n\nข้าพเจ้าเชื่อว่าทั้งหมดนี้เป็นความเข้าใจผิด และท่านจะแก้ไขสถานการณ์ทันที มิฉะนั้นข้าพเจ้าอาจเข้าใจเจตนาของท่านผิดไป"
 court.6011.desc_executed:0 "ข้าพเจ้าได้ทราบด้วยความตกใจอย่างยิ่งว่าท่านเพิ่งประหารชีวิตไพร่ฟ้าข้าแผ่นดินของข้าพเจ้า - แขกในราชสำนักของท่าน - ในฐานะพวกนอกรีตที่เป็นอันตราย \n\nข้าพเจ้าอยากจะสันนิษฐานว่ามันเป็นความเข้าใจผิด และท่านไม่ได้ #EMP ต้องการ#! ที่จะดูหมิ่นข้าพเจ้าและท้าทายความเชื่อของข้าพเจ้าจริงๆ"
 court.6011.a:0 "ข้าพเจ้าไม่ได้มีเจตนาดูหมิ่นท่าน โปรดรับค่าชดเชยนี้"
 court.6011.b:0 "นักเทศน์ปลอมตัวของท่านไม่เป็นที่ต้อนรับในราชสำนักของข้าพเจ้า"
 #Possession at Court
 court.6020.t:0 "การถูกสิงในราชสำนัก"
 court.6020.desc_opening:1 "สภาพของ [possessed_char.GetTitledFirstNamePossessive] นั้นลึกลับและน่าสะพรึงกลัวพอๆ กัน"
 court.6020.desc_chaplain:0 "\n\nตามคำกล่าวของ [court_chaplain.GetCouncilTitle|U] [court_chaplain.GetTitledFirstName]"
 court.6020.desc_no_chaplain:0 "\n\nเป็นความเห็นทั่วไปว่า"
 court.6020.desc_middle:1 "มีสิ่งมีชีวิตมืดมิดอาศัยอยู่ในร่างของ [possessed_char.GetHerHis] และบางครั้งก็แสดงตนออกมาด้วยพลังที่ควบคุมไม่ได้ อย่างไรก็ตาม ความถี่และความรุนแรงของเหตุการณ์เหล่านี้กำลังก่อให้เกิดความตื่นตระหนกเพิ่มขึ้นในหมู่ข้าราชสำนักผู้ศรัทธาของข้าพเจ้า [court_chaplain.GetSheHe|U] เกรงว่าการปรากฏตัวของความชั่วร้ายจะเข้าครอบงำและแพร่กระจายความโกลาหลและความตายในหมู่พวกเรา"
 court.6020.desc_physician:0 "\n\n[court_physician.GetTitledFirstName] ทำให้ข้าพเจ้ามั่นใจว่า"
 court.6020.desc_no_physician:0 "\n\n"
 court.6020.desc_ending:0 "[possessed_char.GetFirstNameNoTooltip] ไม่เคยเป็นอันตราย #EMP โดยตรง#! แต่ข้าราชสำนักของข้าพเจ้ายืนกรานว่าต้องทำอะไรบางอย่าง"
 court.6020.a:1 "[court_chaplain.GetTitledFirstNameNoTooltip] ขับไล่ปีศาจออกไป!"
 court.6020.a.success:0 "การไล่ผีของ [court_chaplain.GetFirstNamePossessive] ประสบความสำเร็จ"
 court.6020.a.success.tt:0 "ด้วยการไล่ผีเป็นประจำเพื่อควบคุมความชั่วร้าย สภาพของ [possessed_char.GetTitledFirstNamePossessive] ดูเหมือนจะดีขึ้น และข้าราชสำนักของท่านก็พอใจ"
 court.6020.a.failure:0 "การไล่ผีของ [court_chaplain.GetFirstNamePossessive] ล้มเหลว"
 court.6020.a.failure.tt:0 "สภาพของ [possessed_char.GetTitledFirstNamePossessive] ไม่ได้รับผลกระทบ"
 court.6020.b:0 "อย่ากลัวไปเลย! มันเป็นสัญญาณแห่งความโปรดปรานของทวยเทพ!"
 court.6020.c:0 "พลังของวัตถุมงคลนี้จะช่วย [possessed_char.GetHerHim] ได้"
 court.6020.c.tt:0 "กล่าวกันว่าการประทับ [6020_relic.GetNameNoTooltip] ของท่านสามารถรักษาอาการป่วยใดๆ ได้"
 court.6020.d:1 "[court_physician.GetTitledFirstNameNoTooltip] ท่านรู้จักสมุนไพรใดที่อาจช่วย [possessed_char.GetHerHim] ได้หรือไม่?"
 court.6020.d.tt:0 "ประสบการณ์ด้านการแพทย์ของ [court_physician.GetFirstNamePossessive] ช่วยปรับปรุงสภาพของ [possessed_char.GetTitledFirstNamePossessive]"
 court.6020.d.tt.2:0 "[court_physician.GetFirstNameNoTooltip] ลองใช้ยาสมุนไพรบางชนิด"
 court.6020.e:0 "มันเป็นเพียงโรคทางสมองเท่านั้น [court_physician.GetFirstNameNoTooltip]?"
 court.6020.f:0 "ปล่อย [possessed_char.GetHerHim] ไปเถอะ"
 court.6020.b.tt: "การมี #EMP นิมิตพยากรณ์#! ถือเป็นความช่วยเหลืออย่างยิ่งสำหรับ $court_poet_court_position$, $court_musician_court_position$, หรือ $cave_hermit_court_position$"
 court_6020_all_courtiers_and_guests_christian:1 "ข้าราชสำนัก [courtiers|E] และแขก [guests|E] ที่นับถือศาสนาเดียวกันทั้งหมดของท่าน"
 court_6020_all_courtiers_or_guests_polith:1 "ข้าราชสำนัก [courtiers|E] และแขก [guests|E] อื่นๆ ทั้งหมดของท่าน (ที่ไม่ใช่พวกมองโลกในแง่ร้าย)"
 #The Ballad of the Garlic King
 court.6030.t:0 "บทเพลงของ [ROOT.Char.Custom('GetQueenKing')] กระเทียม"
 court.6030.desc:1 ""#EMP มีเรื่องเล่าในเมืองเล็กๆ ของเรา\nเกี่ยวกับ [ROOT.Char.Custom('GetQueenKing')] ผู้สวมมงกุฎกระเทียม\n[ROOT.Char.GetSheHe] ขี่ลาไปรบกับ [ROOT.Char.Custom('GetUnbelieverNamePlural')]\nแต่ความสำเร็จเพียงอย่างเดียวของ [ROOT.Char.GetHerHis] คือการสู้กับลิงตัวเล็กๆ...#!"\n\nบทเพลงที่ถูกสาปแช่งนี้ได้รับความนิยมอย่างมากในหมู่นักดนตรีพเนจรและสามัญชน - #EMP ได้รับความนิยมมากเกินไป#! สำหรับรสนิยมของข้าพเจ้า ตั้งแต่ข้าพเจ้าพบความคล้ายคลึงกันอย่างน่ารำคาญระหว่างตัวข้าพเจ้ากับตัวเอกของมัน... แต่การได้ยินมัน ร้องอย่างหน้าไม่อายต่อหน้าข้าพเจ้าโดย [6030_courtier.Custom2('MyCharacterIntroduction', ROOT.Char)] นั้นมันเกินไปแล้ว!"
 court.6030.a:0 "แต่มัน #EMP เป็น#! เรื่องตลกจริงๆ!"
 court.6030.b:0 "นี่มัน #EMP น่าอาย#! มาก..."
 court.6030.c:0 "#EMP เจ้าคิดว่ามันตลกหรือ?!#!"
 court.6030.d:0 "นี่มัน #EMP รับไม่ได้#!."
 court.6030.d.tt:0 "ท่านห้ามไม่ให้มีการแสดงบทเพลงนี้ โดยขู่ว่าจะจำคุกผู้ฝ่าฝืน"
 court.6030.e:0 "ข้า. ทน. ไม่. ไหว. อีกต่อไปแล้ว!"
 court.6030.e.tt:0 "ท่านชกต่อยคนต่อไปที่ยั่วยุท่านด้วยการร้องเพลงโง่ๆ นั้น - ซ้ำๆ"
 court.6030.f:0 "เอ่อ พวกเขาคงต้องหยุดไปเองสักวัน...?"
 #Scrounger Life
 court.6040.t:0 "ชีวิตนักขอทาน"
 court.6040.desc:0 "[scrounger.GetTitledFirstName|U] กลายเป็นส่วนหนึ่งของราชสำนักข้าอย่างถาวร - และเป็นส่วนที่ #EMP แพง#! ด้วย อันที่จริง เป็นส่วนที่ #EMP กว้างขวาง#! ด้วย\n\n[scrounger.GetSheHe|U] อยู่ที่นั่นทุกงานเลี้ยง สวาปามทุกอย่างที่ขวางหน้าขณะบ่นว่าตู้กับข้าวของ [scrounger.GetHerHis] ว่างเปล่าเพียงใด "ท่านเสิร์ฟเครื่องดื่มที่ดีที่สุด [ROOT.Char.GetLadyLord] ของข้า!" [scrounger.GetSheHe] พูดหลังจากดื่ม [ROOT.Char.Custom('GetExpensiveDrink')] ชั้นดีของข้าไปอีกเหยือก "ท่านเป็นผู้ที่ #EMP [SCOPE.Custom('PersonalityGetSharedTraitDescriptionFromFlag')]#! ที่สุด เป็นผู้ที่ #EMP [ROOT.Char.Custom('ComplimentAdjective')]#! ที่สุด เป็น [ROOT.Char.GetLadyLord] ที่ #EMP ดูดีที่สุด#!" [scrounger.GetSheHe] ประกาศ มือของ [scrounger.GetHerHis] ยื่นออกมาเพื่อขอกู้ยืมอีกครั้ง ซึ่ง [scrounger.GetSheHe] จะไม่มีวันชดใช้\n\n[scrounger.GetSheHe|U] เป็นการสิ้นเปลืองเงินที่น่ารำคาญ แต่ท่าทางที่เกินจริงของ [scrounger.GetHerHis] ก็ค่อนข้างน่าบันเทิง"
 court.6040.a:0 "ในเมื่อเจ้าอยู่ที่นี่เสมอ เจ้าก็ควรทำตัวให้มีประโยชน์เสียบ้าง!"
 court.6040.b:0 "เมื่อพิจารณาดูแล้ว ข้าพเจ้าว่า [scrounger.GetHerHim] ตลกดี!"
 court.6040.c:1 "เอาปลิงตัวนี้ออกไปให้พ้นสายตาข้าพเจ้า"
 court.6041.desc:0 "หลายเดือนผ่านไปนับตั้งแต่ข้าพเจ้าตัดสินใจปล่อยให้ [scrounger.GetTitledFirstName] ใช้ชีวิตปรสิตต่อไปในราชสำนักของข้าพเจ้า\n\nข้าพเจ้าไม่ได้คาดหวังอะไรมากไปกว่าเรื่องเล่าเกินจริงเกี่ยวกับความยากจนและคำชมที่เฟื่องฟูอย่างน่าขันตามปกติของ [scrounger.GetHerHis] แต่เมื่อเร็วๆ นี้ ข้าพเจ้าสังเกตเห็นว่าเรื่องราวของ [scrounger.GetHerHis] ตลกขึ้น สัมผัสของ [scrounger.GetHerHis] คมขึ้น และคำชมของ [scrounger.GetHerHis] น่าพอใจมากขึ้น\n\nทั้งข้าราชสำนักและแขกต่างชาติของข้าพเจ้าต่างได้รับความบันเทิงอย่างมากจากถ้อยคำที่สร้างสรรค์อย่างมีศิลปะของ [scrounger.GetHerHis] [scrounger.GetFirstNameNoTooltip] อาจพบอาชีพที่มีประโยชน์แล้วหรือ?"
 court.6041.a:0 "ข้ารู้ว่าเจ้ามีดีอะไรบ้าง!"
 court.6041.b:0 "... แต่ข้าพนันได้เลยว่าเจ้าทำได้ดีกว่านี้อีก!"
 court.6041.b.failure:0 "แม้จะพยายามอย่างเต็มที่แล้ว [scrounger.GetFirstNameNoTooltip] ดูเหมือนจะถึงจุดสูงสุดของความสามารถของ [scrounger.GetHerHis] แล้ว"
 court.6041.b.success:0 "[scrounger.GetFirstNameNoTooltip] ได้รับแรงบันดาลใจสำหรับผลงานชิ้นเอก"
 court.6041.b.failure.tt:0 "[scrounger.GetFirstNameNoTooltip] ไม่สามารถพัฒนาได้อีกต่อไป"
 court.6041.b.success.tt:0 "[scrounger.GetFirstNameNoTooltip] ได้รับแรงบันดาลใจ!"
 court.6041.c:0 "ข้าพเจ้าเสียเวลากับเจ้ามากพอแล้ว"
 #Saucy Readings
 court.6050.t:0 "การอ่านเรื่องลามก"
 court.6050.desc_opening:0 "ช่วงหลังๆ นี้ ข้าพเจ้าอดไม่ได้ที่จะสังเกตเห็นกลุ่มสาวใช้ที่หัวเราะคิกคักและนักรบที่ปกติแล้วเคร่งขรึมรวมตัวกันในซอกมืดเพื่อฟังหนังสืออย่างหลงใหล \n\nวันนี้ ในที่สุดข้าพเจ้าก็จับ [courtier.GetTitledFirstName] ได้พร้อมกับหนังสือในมือของ [courtier.GetHerHis]"
 court.6050.desc_byz:0 "แม้ว่าหน้าปกจะบ่งบอกว่าเป็นหนังสือสวดมนต์ที่เคร่งศาสนา แต่มันเป็นนวนิยายลามกที่เขียนขึ้นเมื่อหลายศตวรรษก่อนโดยบรรพบุรุษนอกรีตของเรา! มีหญิงสาวสวย โจรสลัด การล่อลวง และหน้าแล้วหน้าเล่าที่เต็มไปด้วยตัณหาและความปรารถนาที่ไม่บริสุทธิ์..."
 court.6050.desc_islam:0 "เมื่อกวาดตาอ่านข้อความอย่างรวดเร็ว ข้าพเจ้าพบโจรสลัด สาวใช้ที่นุ่งน้อยห่มน้อย กษัตริย์ที่ขับเคลื่อนด้วยความหรูหรา ราชินีที่มักมากในกามและเจ้าเล่ห์ และแม้กระทั่งหนูข้างถนนที่ร่ำรวย ซึ่ง แต่งงานกับเจ้าหญิงด้วยความช่วยเหลือของญิน..."
 court.6050.desc_sonetti:0 "มีบทกวีหน้าแล้วหน้าเล่า รูปแบบงดงาม แต่เนื้อหาลามก ความงามดุจเทพธิดาของผู้หญิงทุกประเภทได้รับการยกย่องด้วยถ้อยคำที่อ่อนโยน ซึ่งแทบจะไม่สามารถปกปิดความปรารถนาทางโลกของกวีได้..."
 court.6050.desc_chaucer:0 "ทั้งหมดเป็นเรื่องเล่าจากผู้แสวงบุญบนท้องถนน อย่างไรก็ตาม พวกเขาไม่ได้เกี่ยวข้องกับการไถ่บาป แต่เกี่ยวกับฆาตกรรมที่น่าสยดสยองและภรรยาที่ไม่ซื่อสัตย์..."
 court.6050.desc_generic:0 "เห็นได้ชัดว่าเป็นข้อความลามก เต็มไปด้วยสิ่งล่อใจทางกามารมณ์ การยั่วยวนทางโลก และหน้าอกที่อวบอิ่ม..."
 court.6050.desc_ending:0 "\n\nข้าพเจ้านิ่งเงียบขณะไตร่ตรองถึงปฏิกิริยาที่เป็นไปได้ของ [court_chaplain.GetCouncilTitle] [court_chaplain.GetTitledFirstName] และ [courtier.GetFirstNameNoTooltip] จ้องมองข้าพเจ้าด้วยความหวาดหวั่น"
 court.6050.a:0 "ตาของข้าพเจ้า!"
 court.6050.b:0 "ชำระล้างพวกมันด้วยไฟ!"
 court.6050.b.tt:1 "ท่านเผาสำเนาทั้งหมดของข้อความอื้อฉาว และสั่งห้ามในราชสำนักของท่าน"
 court.6050.b.tt.2: "เด็กที่ได้รับการศึกษาในราชสำนักของท่านจะมีแนวโน้มที่จะพัฒนาบุคลิกภาพ [GetTrait('pensive').GetName( GetNullCharacter )], [GetTrait('chaste').GetName( GetNullCharacter )], หรือ [GetTrait('zealous').GetName( GetNullCharacter )] มากขึ้น"
 court.6050.c:0 "วัฒนธรรมมาในทุกรูปแบบ ปล่อยให้พวกเขาอ่าน"
 court.6050.c.tt: "เด็กที่ได้รับการศึกษาในราชสำนักของท่านจะมีแนวโน้มที่จะพัฒนาบุคลิกภาพ [GetTrait('curious').GetName( GetNullCharacter )], [GetTrait('lustful').GetName( GetNullCharacter )], หรือ [GetTrait('cynical').GetName( GetNullCharacter )] มากขึ้น"
 court.6050.c.unlock_text:0 "ตัวเลือกนี้ใช้ได้ เนื่องจากทักษะ [learning|E] ที่สูงของท่าน"
 court.6050.d:0 "อู้ววว ฉ่ำ!"
 court.6050.e:1 "ทำไมเราต้องจำกัดตัวเองอยู่แค่การอ่าน [courtier.GetFirstNameNoTooltip]?"
 court.6050.e.tt:0 "ท่านได้รับแรงบันดาลใจจากการอ่าน"
 court.6050.f:0 "ทำให้มันหายไป แล้วข้าพเจ้าจะแสร้งทำเป็นไม่เห็นอะไร"
 court_6050_courtiers_or_guests:0 "ข้าราชสำนัก [courtiers|E] และแขก [guests|E] ที่ไม่บริสุทธิ์ทั้งหมดของท่าน"
 #The Joys of Wine
 court.6060.t:0 "ความสุขจากไวน์"
 court.6060.desc_opening:1 "ทันใดนั้น [court_chaplain.GetCouncilTitle] [court_chaplain.GetTitledFirstName] และ [court_physician.Custom2('MyCharacterIntroduction', ROOT.Char)] ก็บุกเข้ามาในท้องพระโรง ทะเลาะกัน\n\n"ไวน์เป็นการดูหมิ่น [ROOT.Char.GetFaith.HighGodName]! มัน #EMP ต้อง#! หลีกเลี่ยง!" [court_chaplain.GetFirstNameNoTooltip] กรีดร้อง\n\n"ไวน์เล็กน้อยดีต่อสุขภาพร่างกาย!" [court_physician.GetFirstNameNoTooltip] ตอบโต้"
 court.6060.desc_drunkard_courtier:1 "\n\nจากมุมหนึ่งของห้อง [courtier_drunkard.GetTitledFirstName] ขัดจังหวะการสนทนา: "ปริมาณไวน์เดียวที่ดีต่อท่านคือ #EMP ทั้งหมดนั่นแหละ#!!""
 court.6060.desc_ending:0 "\n\nจุดยืนของข้าพเจ้าเกี่ยวกับไวน์คืออะไร?"
 court.6060.a:0 "ไวน์เปิดประตูให้ [ROOT.Char.GetFaith.DevilName]!"
 court.6060.b:0 "ไวน์เล็กน้อยช่วยรักษาสมดุลของธาตุในร่างกาย"
 court.6060.c:0 "[courtier_drunkard.GetFirstNameNoTooltip|U] ดื่มอวยพรกับข้าพเจ้า!"
 court.6060.c.tt: "[courtier_drunkard.GetFirstNameNoTooltip|U] เปิดคลังลับของ [courtier_drunkard.GetHerHis]!"
 court.6060.c.tt.2: "ต้องขอบคุณการสนับสนุนด้านไวน์ของ [courtier_drunkard.GetFirstNamePossessiveNoTooltip] สิ่งอำนวยความสะดวกด้านอาหารในราชสำนักจึงถูกลง 50% ในอีก 10 ปีข้างหน้า"
 court.6060.d:0 "คำตอบอยู่ที่ก้นเหยือกนี้!"
 # The Value of Letters
 court.6070.t:0 "คุณค่าของตัวอักษร"
 court.6070.desc:0 "ข้ารู้สึกได้ถึงสายตาตัดสินจากเหล่าข้าราชบริพารทั้งหลายที่จับจ้องมาที่ข้า ขณะที่ข้าค่อย ๆ ลงนามในกฤษฎีกาฉบับใหม่อย่างระมัดระวังด้วยปากกาที่สั่นเทาและมือที่ไม่มั่นคง \n\nแน่นอน, #EMP การลงนาม#! ถือเป็นคำที่รุนแรงไป ข้าเป็นเพียงการวาดตามตัวอักษรที่แกะสลักไว้ในแผ่นไม้ - และแทบจะไม่สำเร็จด้วยซ้ำ วันนี้, แม้ แต่ [tutor_6070.Custom2('MyCharacterIntroduction', ROOT.Char)] ก็ยังมองข้าด้วยสิ่งที่ข้าเดาว่าเป็นการผสมผสานระหว่างความสงสารและความรังเกียจ \n\nก่อนที่ข้าจะได้ตำหนิ[tutor_6070.GetHerHim]ที่ดูหมิ่นข้า, [tutor_6070.GetSheHe] ก็พูดแทรกขึ้นมาด้วยน้ำเสียงมีความหวัง: "[ROOT.Char.Custom('FormOfAddressForLiege')|U], บางทีอาจถึงเวลาแล้วที่ท่านจะเรียนรู้การอ่านและเขียนอย่างถูกต้อง?""
 court.6070.a:0 "สอนข้าพเจ้า #EMP เดี๋ยวนี้#!!"
 court.6070.a.success:0 "ข้าพเจ้าเรียนรู้วิธีอ่านและเขียนได้สำเร็จ"
 court.6070.a.failure:0 "การเรียนรู้วิธีอ่านและเขียนเป็นเรื่องที่สูญเปล่าสำหรับข้าพเจ้า"
 court.6070.a.tt.1:0 "จะไม่มีใครล้อเลียนข้าพเจ้าอีกต่อไป"
 court.6070.a.tt.2:0 "ข้าพเจ้าจะต้องหาทางออกอื่น"
 court.6070.b:0 "การขยับปากกาเป็นเรื่องของคนขี้แพ้และคนอ่อนแอ!"
 court.6070.c:0 "ข้าพเจ้าจะแสร้งทำเป็นไม่สังเกตเห็นพวกเขาต่อไป"
 court.6070.d:0 "ข้าพเจ้า #EMP รู้#! วิธีเขียน ขอบคุณมาก!"
 court.6070.d.tt:0 "ถ้าข้าพเจ้าพูดด้วยความเชื่อมั่นมากพอ พวกเขาอาจจะเชื่อข้าพเจ้า..."
 court.6070.d.tt.success:0 "พวกเขาเชื่อคำโกหกที่โจ่งแจ้งของข้าพเจ้า!"
 court.6070.d.tt.failure:0 "พวกเขามองทะลุข้าพเจ้า"
 every_courtier_or_guest_6070_learning:0 "ข้าราชสำนัก [courtiers|E] และแขก [guests|E] ที่รู้หนังสือทั้งหมดของท่าน"
 court.6071.desc:0 "#EMP ส...ห...า...ย...ที่...ร...ั...ก,#!\n\n"ใช่ ดูเหมือนจะถูกต้องแล้ว!"\n\nข้าพเจ้าใช้เวลาหลายชั่วโมงนับไม่ถ้วนในการฝึกตัวอักษรภายใต้สายตาที่เข้มงวดของ [tutor_6070.Custom2('MyCharacterIntroduction', ROOT.Char)] และดูเหมือนว่าความพยายามของข้าพเจ้าจะได้รับผลตอบแทน! จดหมายระหว่างประเทศ รายงานของที่ปรึกษา และคำปฏิญาณของข้าหลวงไม่มีความลับใดๆ จากข้าพเจ้าอีกต่อไป! \n\nส่งปากกามาให้ข้าพเจ้า - ข้าพเจ้าต้องการเซ็นชื่อเพิ่ม!"
 court.6071.a:0 "ข้าพเจ้าฉลาดเกินไป"
 court.6071.b:0 "[tutor_6070.GetFirstNameNoTooltip] สมควรได้รับค่าตอบแทน"
 court.6071.b.tt: "ความถนัดของ [tutor_6070.GetFirstNamePossessiveNoTooltip] ในฐานะ $court_tutor_court_position$ เพิ่มขึ้น"
 court_language_teacher_desc: "สอนเจ้าเหนือหัวให้เขียน"
 court.6072.desc:0 "#EMP เ...พ...ื...่...อ...น... ร...ั...ก,#!\n\n"ดูนั่นสิ! ข้าทำได้ดีมาก, ใช่ไหม?"\n\n[tutor_6070.Custom2('MyCharacterIntroduction', ROOT.Char)|U] ถอนหายใจ, ส่ายหน้า[tutor_6070.GetHerHis]ด้วยสีหน้าสิ้นหวัง "[ROOT.Char.Custom('FormOfAddressForLiege')|U], บางทีท่านอาจจะอยากใช้ตราประทับอันหรูหราแวววาวนี้แทนการลงนาม?"\n\nเห็นได้ชัดว่า, [tutor_6070.GetSheHe] ไม่พอใจกับความก้าวหน้าอัน #EMP น่าทึ่ง#! ที่ข้าทำได้ในความพยายามที่จะเรียนรู้อ่านและเขียน"
 court.6072.a:0 "ตัวอักษรไร้ประโยชน์อยู่แล้ว! เอา [ROOT.Char.Custom('child_object_of_interest_random')] ของข้าพเจ้าคืนมา!"
 court.6072.a.tt:0 "ไม่มีใครประทับใจ"
 court.6072.b:0 "ดีมาก ข้าพเจ้าจะเซ็นชื่ออย่างหรูหราในสิ่งที่ #EMP ข้าพเจ้าอ่าน#! ด้วยตราประทับ"
 court.6072.b.tt:0 "มันดูน่าประทับใจอย่างแน่นอน แต่มันไม่สามารถปกปิดความจริงที่ว่าท่านไม่ได้อ่านสิ่งที่ท่านเซ็นชื่อ"
 court.6072.c:0 "ทั้งหมดเป็นความผิดของเจ้า [tutor_6070.GetFirstNameNoTooltip]!"
 #The Munificence of X
 court.6080.t:0 "ความเอื้อเฟื้อของ [6080_visitor.GetFirstNameNoTooltip]"
 court.6080.desc:0 "ในช่วงสองสามวันที่ผ่านมา [6080_visitor.GetTitledFirstName] ได้มาเยือนราชสำนักของข้าขณะอยู่ระหว่างทาง [6080_visitor.GetHerHis] ไปทำธุระบางอย่าง อาจจะเป็นสถานศักดิ์สิทธิ์หรืออะไรทำนองนั้น"
 court.6080.desc_middle: "\n\nนับตั้งแต่การมาถึงของ [6080_visitor.GetHerHis] [6080_visitor.GetSheHe] ได้บดบังรัศมีของข้าพเจ้าด้วยความเอื้อเฟื้อเผื่อแผ่ต่อข้าราชสำนักของข้าพเจ้าเอง ซึ่งทุกคนต่างรับทองคำของ [6080_visitor.GetHerHis] อย่างไร้ศักดิ์ศรี! ข้าพเจ้าอดไม่ได้ที่จะเยาะเย้ยเมื่อเห็น [6080_visitor.GetHerHim] ถูกห้อมล้อมด้วยข้าราชสำนักที่ชื่นชมเป็นครั้งที่ร้อย #EMP ข้าราชสำนักของข้าพเจ้า#!\n\n"ถุงเงินสำหรับเจ้า [beneficiary_1.GetFirstName] คนดี!"
 court.6080.desc_liege: "ในช่วงสองสามวันที่ผ่านมา [6080_visitor.GetTitledFirstName] เจ้าเหนือหัวของข้าพเจ้า ได้มาเยือนราชสำนักของข้าพเจ้าในโอกาส [GetActivityType('activity_tour').GetName] ของ [6080_visitor.GetHerHis]"
 court.6080.desc_2:0 "และเหรียญบางส่วนสำหรับเจ้าด้วย [beneficiary_2.GetFirstName] ผู้ใจดี!"
 court.6080.desc_3:0 "และสำหรับเจ้า [beneficiary_child.GetFirstName] ที่น่ารัก เค้กน้ำผึ้งหวานๆ!"
 court.6080.desc_end:0 "จำไว้ว่า ความร่ำรวยมีไว้เพื่อแบ่งปัน!""
 court.6080.a:0 "ข้าพเจ้าสามารถเอื้อเฟื้อ #EMP ได้มากกว่า#! นี้อีก!"
 court.6080.b:0 "ข้าพเจ้าควรใช้ประโยชน์จากความเอื้อเฟื้อที่โง่เขลาของ [6080_visitor.GetHerHis] ด้วย!"
 court.6080.b.success:0 "ข้าพเจ้าโน้มน้าวให้ [6080_visitor.GetFirstNameNoTooltip] ควักเงินให้ข้าพเจ้าด้วย"
 court.6080.b.success.tt:0 "[6080_visitor.GetFirstNameNoTooltip] ถูกโน้มน้าว!"
 court.6080.b.failure:0 "[6080_visitor.GetFirstNameNoTooltip] ไม่ประทับใจอย่างสิ้นเชิงกับความพยายามของข้าพเจ้า"
 court.6080.b.failure.tt:0 "[6080_visitor.GetFirstNameNoTooltip] ไม่ถูกโน้มน้าว"
 court.6080.c:0 "ข้าพเจ้าเชื่อว่า [6080_visitor.GetFirstNameNoTooltip] อยู่เกินเวลาต้อนรับของ [6080_visitor.GetHerHis] แล้ว..."
 court.6080.d:0 "ให้ [6080_visitor.GetHerHim] ใช้จ่ายดีกว่าข้าพเจ้า"
 #The Art of Rhetoric
 court.6090.t:0 "ศิลปะแห่งวาทศิลป์"
 court.6090.desc:0 ""#EMP แต่ข้าพเจ้าเบื่ออออออ!#!" ข้าพเจ้าจำเสียงคร่ำครวญของ [6090_child_a.Custom2('MyCharacterIntroduction', ROOT.Char)] ได้ทันที แม้กระทั่งก่อนที่เจ้าเด็กซนจะอยู่ในสายตาข้าพเจ้า\n\nฉากที่ข้าพเจ้าพบต่อหน้าต่อตานั้นค่อนข้างน่าสมเพช:"
 court.6090.desc.cp: "[6090_poet.Custom2('MyCharacterIntroduction', ROOT.Char)] ดูเหมือนจะใกล้ร้องไห้"
 court.6090.desc.teacher: "[6090_poet.GetFirstName] ครูผู้มีชื่อเสียงในท้องถิ่น ซึ่งกำลังมาเยือนราชสำนักของเรา ดูเหมือนจะหมดความอดทน [6090_poet.GetHerHis] แล้ว"
 court.6090.desc.middle: "ขณะที่ [6090_child_a.GetFirstNameNoTooltip] และ [6090_child_b.GetFirstName] จ้องมอง [6090_poet.GetHerHim] ด้วยสีหน้าที่ไม่ประทับใจที่สุดเท่าที่ข้าพเจ้าเคยเห็นบนใบหน้าอ่อนเยาว์ของพวกเขา"
 court.6090.desc_other:0 "[6090_child_c.GetFirstName] ได้เดินเตร็ดเตร่ไปที่หน้าต่าง เห็นได้ชัดว่าสนใจ #EMP อะไรก็ได้#! ที่เกิดขึ้นข้างนอกมากกว่า"
 court.6090.desc_end:0 "\n\nเมื่อดวงตาของ[6090_poet.GetHerHis]สบตากับข้า, [6090_poet.GetFirstNameNoTooltip] อ้อนวอนข้าว่า: "[ROOT.Char.Custom('FormOfAddressForLiege')|U], #EMP ได้โปรดเถิด#!, ข้าแค่พยายามอธิบายให้บุตรหลานของท่านฟังถึงศิลปะอันวิจิตรของวาทศิลป์, ตามที่ชาติกำเนิดอันสูงส่งของพวกเขาต้องการ...""
 court.6090.a:0 "ตั้งใจฟังนะ เด็กๆ! พวกเจ้าจะต้องใช้สิ่งนี้"
 court.6090.b:0 "ให้ข้าพเจ้าอธิบายให้ชัดเจนยิ่งขึ้น"
 court.6090.b.success:0 "เด็กๆ ประทับใจ"
 court.6090.b.failure:0 "ข้าพเจ้าน่าเบื่อยิ่งกว่า [6090_poet.GetFirstNameNoTooltip]"
 court.6090.b.failure.tt:0 "เด็กๆ ไม่ได้เรียนรู้อะไรเลย"
 court.6090.c:0 "เจ้ามันน่าเบื่อเกินไป [6090_poet.GetFirstNameNoTooltip]!"
 court.6090.c.tt: "#EMP การสงคราม#! เป็นสิ่งที่คู่ควรแก่การใฝ่หาสำหรับขุนนางหนุ่มสาวมากกว่า! มาฝึกกับข้าพเจ้าสิ!"
