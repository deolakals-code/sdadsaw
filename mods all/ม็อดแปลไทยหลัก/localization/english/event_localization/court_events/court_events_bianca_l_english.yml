l_english: 
 # Sus about a budding friend(?)ship
 court.3000.t:0 "ความไม่ไว้วางใจในมิตรภาพ"
 court.3000.desc.opening:0 "ความวิตกกังวลบีบรัดท้องของข้าขณะที่ความริษยาอันน่ารังเกียจผุดขึ้น ข้าถอนหายใจและจ้องมองไปยังต้นเหตุแห่งความทุกข์ของข้า\n\n"
 court.3000.desc.opening.trustful:0 "ข้ารู้สึกถึงความริษยาแปลบปลาบในอกขณะมองไปยังต้นเสียงหัวเราะ เป็นความรู้สึกที่ข้ารู้จักดี ทว่ามันไม่เหมือนข้าเลยที่จะรู้สึก เช่นนี้\n\n"
 court.3000.desc:0 "ข้ารู้ว่าข้าควรจะขอบคุณที่อาคันตุกะของเรา, [foreign_guest.GetTitledFirstName], ดูเหมือนจะเข้ากันได้ดีกับ [family_member.GetName], แต่มีบางอย่างในท่าทีของทั้งสองที่ ทำให้ข้ากังวล\n\nรอยยิ้มของพวกเขาเป็นแบบที่เพื่อนรักตลอดชีวิต — หรือคู่รักที่ทุ่มเท — แบ่งปันกัน พวกเขาทำตัวราวกับว่ามีเพียงพวกเขาอยู่ในห้องอย่างไม่ละอายใจ ทิ้งข้าไว้นอกวงสนทนาอย่างไม่ไยดี ความสัมพันธ์ของพวกเขาคืออะไรกันแน่ และข้าควรทำอะไรกับมันหรือไม่?"
 court.3000.a:0 "ข้า #EMP ต้อง#! หยุดยั้งสิ่งที่กำลังผลิบานระหว่างพวกเขาทั้งสอง"
 court.3000.a.tt.success:0 "ความสัมพันธ์ของ [foreign_guest.GetFirstNamePossessiveNoTooltip] และ [family_member.GetFirstNamePossessiveNoTooltip] ยังคงเหมือนเดิม"
 court.3000.a.tt.failure:0 "[foreign_guest.GetFirstNameNoTooltip] และ [family_member.GetFirstNameNoTooltip] เพิกเฉยต่อความปรารถนาของข้าและยังคงสานสัมพันธ์ต่อไป"
 court.3000.b:0 "ข้าควรส่งเสริมความผูกพันของพวกเขา เพื่อให้แน่ใจว่าการมาเยือนเป็นไปด้วยดี"
 court.3000.b.tt.success:0 "ความสัมพันธ์ของ [foreign_guest.GetFirstNamePossessiveNoTooltip] และ [family_member.GetFirstNamePossessiveNoTooltip] แน่นแฟ้นยิ่งขึ้นและพวกเขาซาบซึ้งในการสนับสนุนของข้า"
 court.3000.b.tt.failure:0 "[foreign_guest.GetFirstNameNoTooltip] และ [family_member.GetFirstNameNoTooltip] ไม่พอใจที่ข้าเข้ามายุ่งเกี่ยว"
 court.3000.c:0 "ไม่ว่าความสัมพันธ์ของพวกเขาจะเป็น เช่นไร ข้าจะไม่เข้าไปยุ่ง"
 court.3000.c.tt.success:0 "ความสัมพันธ์ของ [foreign_guest.GetFirstNamePossessiveNoTooltip] และ [family_member.GetFirstNamePossessiveNoTooltip] แน่นแฟ้นยิ่งขึ้น"
 court.3000.c.tt.neutral:0 "[foreign_guest.GetFirstNameNoTooltip] และ [family_member.GetFirstNameNoTooltip] สนิทสนมกันมากขึ้น"
 court.3000.d:0 "[foreign_guest.GetFirstNameNoTooltip] ไม่เป็นที่ต้อนรับในราชสำนักของข้าอีกต่อไป!"
 court.3000.neutral_outcome:0 "ความสนใจที่ทั้งสองมีต่อกันค่อย ๆ จางหายไปเหมือนเดิม"
 court.3000.friendly_outcome:0 "ทั้งสองอาจกลายเป็นเพื่อน หรือแม้แต่คู่รักกัน..."
 court.3000.better_friends_outcome:0 "ทั้งสองอาจกลายเป็นเพื่อนที่ดีที่สุดและมากกว่านั้น..."

 # A courtier shows you their written work after being inspired by other writers
 court.3010.t:0 "งานเขียนอันได้แรงบันดาลใจ"
 court.3010.desc.opening:1 ""[ROOT.Char.Custom2('RelationToMeAddress', inspired_writer)|U]!" [inspired_writer.GetTitledFirstName] เข้ามาหาข้า กำต้นฉบับไว้แน่น "ข้าได้เขียนงานประพันธ์ขึ้นหลังจากอ่านวรรณกรรมที่นิยมในราชสำนักของท่าน โปรดให้เกียรติเป็นคนแรกที่ได้อ่านถ้อยคำของข้าด้วยเถิด!" ข้ารับต้นฉบับและเหลือบมองบางบรรทัด\n\n"
 court.3010.desc.low_learning:0 "ทุกคำบรรยายถึงตัวเอกกล่าวถึงการมี 'ดวงตาสีฟ้าครามกลมโตงดงาม' ของเขา และ [inspired_writer.GetFirstNameNoTooltip] เน้นย้ำถึงสิ่งนั้นแม้ในสถานการณ์ที่ไม่เหมาะสม"
 court.3010.desc.shy_or_chaste:0 "สายตาของข้าจับจ้องไปที่คำบรรยายฉากยามเย็น คู่รักสองคนเกี่ยวเกี่ยวนิ้วก้อยกันอย่างอ่อนโยน เพราะเขินอายเกินกว่าจะจับมือ พวกเขากระซิบถ้อยคำหวานขณะเดินอยู่ใต้ทะเลดาวอันไร้ที่สิ้นสุด"
 court.3010.desc.lustful:0 "ทุกประโยคที่บรรยายถึงสตรีนั้นละเอียดลอออย่างยิ่งยวดและมักมีคำอย่าง เด้ง หรือ สั่นไหว อยู่เสมอ แต่มิใช่เพียงสตรีเท่านั้น บุรุษก็ เช่นกัน ทว่า คำบรรยายของพวกเขามุ่งเน้นไปที่กล้ามเนื้อเป็นมัดและคางที่ได้รูป"
 court.3010.desc.adventurer_or_pilgrim:0 "จุดสนใจอยู่ที่ทิวทัศน์อันกว้างใหญ่ไพศาลและงดงาม และการเปลี่ยนแปลงไปตามระยะทางที่ห่างจากบ้านมากขึ้น นอกจากนี้ยังมีบางตอนเกี่ยวกับความปรารถนาที่จะเดินทางและความคิดถึงบ้าน ซึ่งเห็นได้ชัดว่าเป็นประสบการณ์ของผู้เขียน"
 court.3010.desc.sadistic:0 "ความรุนแรงที่บรรยายนั้นเกินกว่าระดับที่คนส่วนใหญ่จะทนได้สำหรับความโหดร้ายและความลามก มันวาดภาพฉากนองเลือดสีแดงฉาน โดยมีอัศวินลุยเลือดสูงถึงเข่า"
 court.3010.desc.generic_fallback:1 "ฉากหลังนั้นคุ้นเคย เช่นเดียวกับชื่อของตัวเอก เดี๋ยวนะ นี่อาจเป็นความพยายามของ [inspired_writer.GetFirstNamePossessiveNoTooltip] ในการเขียนภาคต่อหรือเขียนใหม่จากงานของผู้อื่นหรือไม่?"
 court.3010.desc.ending:0 "\n\nข้ากระแอมและเงยหน้าขึ้นจากต้นฉบับ สบตากับดวงตาที่คาดหวังของ [inspired_writer.GetFirstNamePossessiveNoTooltip]"
 court.3010.a:0 "พระเจ้าช่วย! นี่มัน... นี่มันน่าทึ่งมาก! ท่านต้องเขียนอีก!"
 court.3010.a.tt:0 "ด้วยกำลังใจจากคำชมของท่าน [inspired_writer.GetFirstNameNoTooltip] จะขอให้ท่านอ่านงานเขียนของพวกเขาเพิ่มเติมในอนาคต"
 court.3010.b:0 "ข้ากังวลเกี่ยวกับสุขภาพจิตของท่านหากนี่คือสิ่งที่จิตใจของท่านสร้างขึ้น"
 court.3010.c:0 "ท่านมีศักยภาพอย่างแน่นอน แต่ท่านสามารถปรับปรุงได้ในบางด้าน"
 court.3010.c.neutral:0 "[inspired_writer.GetFirstNameNoTooltip] อาจจะยอมรับความคิดเห็นของท่านอย่างไม่เต็มใจนัก และอาจเขียนต่อไปในอนาคต"
 court.3010.c.stress:0 "สิ่งที่ [inspired_writer.GetSheHe] ต้องการ — หรือจำเป็นต้องมี — คือกำลังใจมากกว่าคำติชม"
 court.3010.c.depression:0 "คำพูดของท่านบาดลึกเข้าไปในจิตวิญญาณของพวกเขา"

 court.3011.desc.opening:0 "ข้าได้ยินเสียงฝีเท้าของใครบางคนใกล้เข้ามาจากด้านหลังและหันไปเห็น [inspired_writer.GetTitledFirstName] ดูตื่นเต้นไปหมด "[ROOT.Char.Custom2('RelationToMeAddress', inspired_writer)|U]!" [inspired_writer.GetSheHe|U] เรียกข้าอย่างกระตือรือร้นขณะที่ [inspired_writer.GetSheHe] เข้ามาใกล้และก้มศีรษะของ [inspired_writer.GetHerHis] คำนับพอเป็นพิธี "เสร็จแล้ว! ร่างแรกของข้า!"\n\nต้นฉบับถูกยัดใส่มือข้าก่อนที่ข้าจะได้พูดอะไร การเหลือบมองคร่าว ๆ เผยให้เห็น"
 court.3011.desc.low_learning:1 "คำบรรยายถึง 'ดวงตาสีฟ้าครามกลมโตงดงาม' ของตัวเอก ในสถานการณ์ที่ไม่เหมาะสม"
 court.3011.desc.shy_or_chaste:1 "ฉากโรแมนติกที่อ่อนโยน แต่ไม่สมจริงระหว่างคู่รักสองคน"
 court.3011.desc.lustful:2 "ส่วนต่าง ๆ ของร่างกายที่เด้ง สั่นไหว และนูนโปน พันกันยุ่งเหยิงในผ้าปูที่นอน"
 court.3011.desc.adventurer_or_pilgrim:1 "ทิวทัศน์อันกว้างใหญ่ไพศาลและงดงาม และข้อความเกี่ยวกับความปรารถนาที่จะเดินทาง"
 court.3011.desc.sadistic:1 "ความรุนแรง ความโหดร้าย และความลามก"
 court.3011.desc.generic_fallback:1 "การเขียนใหม่และภาคต่อของเรื่องราวอื่น ๆ ที่มีชื่อเสียงมากกว่า"
 court.3011.desc.ending:0 "\n\nเป็นที่ชัดเจนว่า [inspired_writer.GetFirstNameNoTooltip] ได้พบแรงบันดาลใจของ [inspired_writer.GetHerHis] แล้ว"
 court.3011.a:0 "นี่มันน่ารักมาก! ท่านต้องเขียนต่อไปอีก!"
 court.3011.b.gregarious:0 ""ข้าอยากเห็นท่านลองเขียนหัวข้ออื่นดูบ้าง!""
 court.3011.b.blunt:0 ""ท่านจะหยุดนิ่งถ้าท่านเขียน แต่เรื่องเดิม ๆ""
 court.3011.c:0 "ข้าอ่านต้นฉบับของท่านพอแล้ว"
 court.3011.c.tt.stop:0 "[inspired_writer.GetFirstNameNoTooltip] หยุดนำงานเขียนมาให้ท่านดูขณะลองสิ่งใหม่ ๆ"
 court.3011.c.tt.gain_inspiration:0 "[inspired_writer.GetFirstNameNoTooltip] ได้รับแรงบันดาลใจในการเขียนผลงานชิ้นเอก!"
 court.3011.c.tt.hurt:0 "[inspired_writer.GetFirstNameNoTooltip] รู้สึกเจ็บปวดจากการขาดการสนับสนุนของท่าน"

 #Latrine disaster events
 court.3020.t:0 "กลิ่นเหม็นเน่า"
 court.3020.desc.opening:1 ""[ROOT.Char.Custom2('RelationToMeAddress', latrine_chancellor)|U]. ขอเรียนสักครู่เถิด"\n\n[latrine_chancellor.GetCouncilTitle] ของข้า, [latrine_chancellor.GetTitledFirstName], เข้ามาหาข้าในช่วงพักสั้น ๆ ขณะดูแลกิจการในราชสำนัก [latrine_chancellor.GetSheHe|U] ชี้ไปยังมุมที่ไม่ค่อยมีคนในห้อง และข้าก็เดินตาม [latrine_chancellor.GetHerHim] ไป\n\n"ข้ากังวลเกี่ยวกับสภาพของ "
 court.3020.desc.castle:0 "ปราสาท [capital.GetNameNoTooltip]"
 court.3020.desc.city:0 "ศาลากลางเมือง [capital.GetNameNoTooltip]"
 court.3020.desc.temple:0 "ศาสนสถานใน [capital.GetNameNoTooltip]"
 court.3020.desc.ending:0 "ขณะจัดการประชุมในห้องหนึ่ง พวกเราทุกคนสังเกตเห็น... กลิ่นอันน่าสะพรึงกลัว! มันต้องมาจากส้วมชั้นล่างแน่ ๆ ข้าขอวิงวอนให้ท่านพิจารณาจ่ายเงินเพื่อซ่อมแซมส่วนที่ถูกละเลยของอาคาร""
 court.3020.a:0 "ข้าจะดูแลให้ปัญหาได้รับการแก้ไขโดยเร็วที่สุด"
 court.3020.b:0 "[latrine_steward.GetCouncilTitle] ของข้าสามารถจัดการเรื่องนี้ได้"
 court.3020.b.success:0 "[latrine_steward.GetFirstName] ต่อรองได้ดีและช่วยประหยัดเงินให้ท่าน"
 court.3020.b.failure:0 "[latrine_steward.GetFirstName] ลงเอยด้วยการใช้เงินของท่านมากกว่าที่จำเป็น"
 court.3020.c:1 "แน่นอนว่า $royal_architect_court_position$ ของข้าสามารถแก้ไขปัญหานี้ได้โดยไม่ต้องใช้เงิน..."
 court.3020.c.success:0 "[royal_architect.GetFirstName] สามารถหาวิธีแก้ปัญหาโดยไม่ต้องเสียเงินได้"
 court.3020.c.failure:0 "[royal_architect.GetFirstName] คิดวิธีที่ไม่ต้องใช้เงินไม่ออก"
 court.3020.d:0 "แค่ไปอุดรูบนพื้นเสีย!"

 court.3021.t:0 "ระวังข้างล่าง!"
 court.3021.desc:0 "ข้าถูกร้องขอให้ไกล่เกลี่ยความขัดแย้งระหว่าง [courtier1.GetTitledFirstName] และ [courtier2.GetTitledFirstName]. ข้าราชบริพารของข้าคงจะเบื่อ #EMP อย่างยิ่ง#! ในวันนี้ เพราะหลายคนมาที่นี่เพื่อสังเกตการณ์\n\nขณะที่ทั้งสองทะเลาะกันเรื่อง [courtier1.Custom('subject_of_interest')], เราถูกขัดจังหวะด้วยเสียงดังสนั่น ทุกคนในห้องยกเว้นข้าต่างโซเซเมื่อพื้นไม้โก่งตัวอย่างเห็นได้ชัด! [ROOT.Char.GetFaith.HighGodName] คงจะคุ้มครองข้าอยู่ เพราะข้านั่งอยู่ในซุ้มที่ไม่ได้รับผลกระทบจากภัยพิบัติ\n\nผู้ที่อยู่ใกล้ประตูที่สุดรีบวิ่งออกไป ขณะที่คนอื่น ๆ ทำได้เพียงกรีดร้องเมื่อพื้นถล่มลงมา สายตาของข้าจับจ้องไปมาระหว่างคนสองคนที่ยืนอยู่ใกล้ข้าที่สุด"
 court.3021.a:0 "ตามสัญชาตญาณ ข้ายื่นมือออกไปหา [courtier1.GetFirstNameNoTooltip]"
 court.3021.b:0 "ข้าดึง [courtier2.GetFirstNameNoTooltip] ที่หวาดกลัวมายังซุ้มที่มั่นคง"
 court.3021.c:0 "ข้าถอยกลับด้วยความสยดสยองขณะมองดูทุกคนตกลงไปในส้วมด้านล่าง"
 court.3021.latrine_disaster:0 "ภัยพิบัติส้วม [capital.GetNameNoTooltip]"
 
 #Lady-in-waiting 
 court.3030.t:0 "จู้จี้เรื่องเครื่อง แต่งกาย"
 court.3030.desc.intro:0 "ด้วยความเอาใจใส่อย่างยิ่ง, $lady_in_waiting_court_position$ ของข้า, [fussy_liw.GetFirstName], คอยติดตามข้าติด ๆ เพื่อให้แน่ใจว่าข้าทั้งประพฤติตนและนำเสนอตัวเองอย่างเหมาะสมในราชสำนัก\n\n"[ROOT.Char.Custom('FormOfAddressForLiege')|U]! ได้โปรด, อยู่นิ่ง ๆ สักครู่เถิด เพื่อที่ข้าจะได้จัดเสื้อผ้าของท่าน!"\n\n"
 court.3030.desc.lovers:1 "ข้าเอนตัวเข้าหาสัมผัสของ [fussy_liw.GetHerHis] ตามสัญชาตญาณก่อนจะหยุดตัวเองเมื่อตระหนักว่าเราอยู่ในที่สาธารณะ แม้จะไม่ใช่เรื่องแปลกที่ [fussy_liw.GetFirstNameNoTooltip] สุดที่รักของข้าจะจู้จี้กับเครื่อง แต่งกายของข้า เช่นนี้,"
 court.3030.desc.generic:1 "[fussy_liw.GetFirstNameNoTooltip] ดูเหมือนจะไม่สนใจว่าเราอยู่ในที่สาธารณะขณะที่ [fussy_liw.GetSheHe] จัดเครื่อง แต่งกายของข้า,"
 court.3030.desc.ending:0 "ข้าอดไม่ได้ที่จะรู้สึกราวกับว่า [fussy_liw.GetSheHe] กำลังปฏิบัติต่อข้าราวกับเด็กซุกซน!\n\nขณะที่ข้ากำลังครุ่นคิดเงียบ ๆ ข้าสังเกตเห็นว่ามีคนมองดูเรากระซิบกระซาบกัน และข้ารู้สึกว่าต้องพูดเพื่อปกป้องตัวเอง!"
 court.3030.a:0 "สร้างเรื่อง: "เจ้า #EMP กล้าดีอย่างไร#! มาแตะต้อง #EMP ตัวข้า#!?""
 court.3030.b:0 ""เจ้าควรจะทำการปรับเปลี่ยนเหล่านี้ให้เร็วกว่านี้และเร็วกว่านี้!""
 court.3030.c:0 "ไม่พูดอะไร เพราะ [fussy_liw.GetSheHe] เพียงแค่ทำหน้าที่ของ [fussy_liw.GetHerHis]"
 court.3030.d:0 ""ไม่จำเป็นต้องปรับเปลี่ยนอะไร""
 
 court.3031.t:0 "การประนีประนอม"
 court.3031.desc:0 "ขณะที่ข้ากำลังใช้เวลาแห่งความสงบชั่วครู่ในราชสำนัก เฝ้ามองผู้คนอย่างเงียบๆ [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('liw'))] นาม [liw.GetFirstName] ก็เข้ามาหาข้า\n\n"[ROOT.Char.Custom('FormOfAddressForLiege')|U] ขอเวลาสักครู่ได้หรือไม่พะย่ะค่ะ?"\n\n[liw.GetSheHe|U] [liw.Custom('quirk_pos_present')] ขณะรอการอนุญาตจากข้า ข้าพยักหน้าให้ [liw.GetHerHim] พูดต่อ\n\n"ในงานของข้า ข้ามีความเข้าใจที่ดีว่าผู้คนคิดอ่านอย่างไรและอะไรเป็นแรงจูงใจของพวกเขา ด้วยความรู้นี้ ข้าสามารถพยายามสานสัมพันธ์กับกลุ่มที่ท่านสนใจได้ ท่านว่าอย่างไร?""
 court.3031.a:0 "ปรับปรุงสถานะของข้ากับข้าหลวงที่เป็นชนกลุ่มน้อย"
 court.3031.b:0 "พูดจาดี ๆ ให้ข้าในหมู่บารอน"
 court.3031.c:0 "ข้าต้องการสร้างความสัมพันธ์ที่ดีขึ้นกับ [reference_county.GetProvince.GetCounty.GetCulture.GetCollectiveNounNoTooltip]"
 every_culture_county_3031:0 "[county|E]ของ[realm|E]ทุกแห่งที่มี[culture|E] [reference_county.GetCulture.GetName]"
 court.3031.d:0 "ข้าไม่สนใจว่าคนอื่นจะคิดอย่างไร"

 #Homesickness
 court.3040.t:0 "[homesick_parent.GetMotherFather|U] ผู้คิดถึงบ้านของข้า"
 court.3040.desc:0 "ขณะที่ข้ากำลังทักทายผู้คนในราชสำนัก ข้าได้ยินเสียงถอนหายใจหนัก ๆ อีกครั้งจาก [ROOT.GetCharacter.Custom2('RelationToMe', SCOPE.sC('homesick_parent'))] ของข้า ไม่ว่าจะตั้งใจหรือไม่ก็ตาม การปรากฏตัวอย่างเคร่งขรึมของ [homesick_parent.GetTitledFirstNamePossessive] ก็ไม่ได้ถูกมองข้ามไป\n\n"โอ้ สวัสดี ลูกข้า" [homesick_parent.GetSheHe] กล่าวหลังจากอาการตกใจเริ่มหายไป ข้าบอกไม่ได้แน่ชัดว่า [homesick_parent.GetTitledFirstNameNoTooltip] กำลังแสดงละครหรือพูดความจริง "โปรดอย่าใส่ใจข้าเลย ข้าแค่คิดถึงบ้านเท่านั้นเอง..."\n\nข้ายังไม่ทันได้ตอบ [homesick_parent.GetSheHe] ก็ถอนหายใจอย่างเศร้าสร้อยอีกครั้ง การจากไปโดยไม่พูดอะไรย่อมไม่เปลี่ยนแปลงสิ่งใด ดังนั้นข้าจึงตัดสินใจที่จะพูด"
 court.3040.a:0 "ท่านแค่คิดถึงความหรูหราของชาว [homesick_parent.GetCulture.GetNameNoTooltip] เท่านั้น!"
 court.3040.a.tt: "เพิ่ม [court_amenity|E] แบบสุ่มหนึ่งระดับ"
 court.3040.a.tt_2: "ระดับสิ่งอำนวยความสะดวกในราชสำนักเพิ่มขึ้น"
 court.3040.b:1 "ท่านควรหาอะไรทำแทนที่จะมานั่งเศร้าโศก"
 court.3040.c:0 "อารมณ์ขันแบบ [homesick_parent.GetCulture.GetNameNoTooltip] ดี ๆ จะช่วยได้!"
 court.3040.c.tt: "$court_jester_court_position$ จากวัฒนธรรมของ [homesick_parent.GetHerHis] จะต้อง ทำให้ [homesick_parent.GetHerHim] หัวเราะได้อย่างแน่นอน"
 court.3040.d:0 "ความรู้สึกของท่านคือปัญหาของท่าน อย่าเอามันมาที่ราชสำนักของข้า"

 #Chief Eunuch
 court.3050.t:0 "จดหมายหมิ่นประมาท"
 court.3050.desc:0 ""ข้ามีข้อเสนอแนะอันยอดเยี่ยมสำหรับ [ROOT.Char.GetLadyLord] ของข้า" $chief_eunuch_court_position$ ของข้า, [chief_eunuch.GetFirstName], กล่าวอย่างมีลับลมคมใน\n\n"หนึ่งในผู้ไม่หวังดีต่อท่าน, [target.GetTitledFirstName], อยู่ที่นี่ในวันนี้ หากเป็นความประสงค์ของท่าน ข้าสามารถสร้างจดหมายมัดตัวไว้กับตัว [target.GetHerHis] เพื่อที่เราจะได้เยาะเย้ย [target.GetHerHim] ต่อหน้าสาธารณชนได้"\n\n[chief_eunuch.GetFirstNameNoTooltip] ยิ้มอย่าง [chief_eunuch.Custom('quirk_neg_adjective')] ขณะกลั้นหัวเราะ "แล้วท่านต้องการให้ข้าใส่อะไรลงในจดหมาย?""
 court.3050.a:0 "เตือนเจ้าโง่นั่นว่าข้ารู้ความลับของ [target.GetHerHis] น่าจะ ทำให้ [target.GetHerHim] เหงื่อตกได้"
 court.3050.b:0 "ปลอมจดหมายปฏิเสธเยาะเย้ย [target.GetTitledFirstNameNoTooltip] สำหรับความไม่น่าปรารถนาของ [target.GetHerHis]"
 court.3050.c:0 "วางหลักฐานว่า [target.GetFirstNameNoTooltip] ใส่ร้ายผู้อื่น"
 court.3050.d:0 "อย่าเพิ่งก่อเรื่องในครั้งนี้เลย"

 #Cat
 court.3060.t:0 "นักล่าตระกูลแมว"
 court.3060.desc:0 ""ข้าคิดว่าข้าเจอสาเหตุแล้วว่าทำไมบางวันถึงมีหนูน้อยกว่าวันอื่น ๆ!" [ROOT.GetCharacter.Custom2('RelationToMe', SCOPE.sC('cat_finder'))] ของข้า, [cat_finder.GetTitledFirstName], ประกาศอย่างมีความสุขขณะที่ [cat_finder.GetSheHe] ขยับไปด้านข้างเพื่อเผยให้เห็นคนรับใช้ที่อุ้มแมวที่ไม่พอใจ #EMP อย่างยิ่ง#! อยู่\n\nมันดิ้นรนพยายามปลดปล่อยตัวเองออกจากแขนที่เต็มไปด้วยรอยขีดข่วนของคนรับใช้ ร้องเหมียว ๆ อย่างน่าเอ็นดู\n\n"ข้าว่านี่คือนักล่าหนูที่ประสบความสำเร็จตัวหนึ่ง! อันที่จริง มันกำลังปล้ำอยู่กับหนูอ้วนตัวหนึ่งตอนที่เราเจอมัน! ท่านว่าอย่างไร เราควรรับเลี้ยงแมวตัวนี้หรือไม่?""
 court.3060.a:0 "ข้าอยากได้เพื่อนร่วมทางตระกูลแมว!"
 court.3060.b:0 "ทำไมท่านไม่รับแมวไปเลี้ยงล่ะ ในเมื่อท่านเป็นคนเจอมัน"
 court.3060.c:0 "ท่านฝึกสุนัขตัวหนึ่งให้ล่าหนูไม่ได้หรือ?"
 court.3060.d:0 "ครั้งนี้ไม่เอาแมว"
 
 #Royal Court
 court.3070.t:0 "[ROOT.Char.GetTitleTierName] ผู้ไม่มีใครรู้จัก"
 court.3070.desc.opening:0 ""โอ้ แล้วท่านจะไม่มีวันเชื่อเลยว่าเกิดอะไรขึ้นต่อไป!" แขกของข้า, [court_enjoyer.GetTitledFirstName], ไม่หยุดพูดถึง [court_enjoyer.GetHerselfHimself] และทุกสิ่งที่เกิดขึ้นกับ [court_enjoyer.GetHerHim]. นอกจาก [court_enjoyer.GetHerHis] การพูดพล่ามไม่หยุดแล้ว ข้ายังรู้สึกไม่สบายใจกับคนแปลกหน้าที่พูดกับข้าอย่างไม่เป็นทางการ เช่นนี้\n\nข้าพยายามขอตัวจากแขกโดยบอก [court_enjoyer.GetHerHim] ว่าข้ามีเรื่องและผู้คนอื่น ๆ ที่ต้องดูแล แต่ [court_enjoyer.GetSheHe] ขัดจังหวะข้า ถามว่าข้าทำงานอะไร หรือว่าข้ามาที่นี่เพื่อ "
 court.3070.desc.opening_food:0 "เพลิดเพลินกับอาหารอร่อยเหมือนแขกคนอื่น ๆ"
 court.3070.desc.opening_lodging:0 "เพลิดเพลินกับเตียงนอนหรูหราเหมือนแขกคนอื่น ๆ"
 court.3070.desc.opening_fashion:0 "แต่งตัวเหมือน [ROOT.Char.GetTitleAsNameNoTooltip] สักวันเหมือนแขกคนอื่น ๆ"
 court.3070.desc.opening_servants:0 "ได้รับการปฏิบัติเหมือน [ROOT.Char.GetTitleAsNameNoTooltip] สักวันเหมือนแขกคนอื่น ๆ"
 court.3070.desc.middle:1 "\n\nด้วยความตกตะลึง, ข้าพยายามตอบกลับไปว่า, "ข้าคือ #EMP [ROOT.Char.GetTitleAsNameNoTooltip]#!...!"\n\nเลือดสูบฉีดหายไปจากใบหน้าของ[court_enjoyer.GetHerHis] และ[court_enjoyer.GetSheHe]ก็เริ่มพูดตะกุกตะกัก\n\n"ข้าขออภัยอย่างสุดซึ้ง, [ROOT.Char.Custom('FormOfAddressForLiege')]! ข-ข้าสัญญาว่าข้าไม่ได้มาที่นี่เพียงเพื่อเกาะกินโชคลาภของท่านและ "
 court.3070.desc.closing_food:0 "กินเหมือน [ROOT.Char.GetTitleAsNameNoTooltip]!"
 court.3070.desc.closing_lodging:0 "พักในที่พักที่ดีที่สุดในอาณาจักร!"
 court.3070.desc.closing_fashion:0 "เพื่ออยู่ท่ามกลางผู้คนที่ทันสมัยที่สุดในอาณาจักร!"
 court.3070.desc.closing_servants:0 "เพื่อให้คนรับใช้ดูแลทุกความต้องการของข้าในช่วงเวลาสั้น ๆ!"
 court.3070.desc.closing:0 "ข้าสาบานได้! เพียง แต่ว่า... ชื่อเสียงราชสำนักของท่านเป็นที่กล่าวขานมากกว่ารูปลักษณ์ของท่าน, [ROOT.Char.Custom('FormOfAddressForLiege')]!""
 court.3070.a:0 "บางทีพวกเขาอาจจะจำข้าได้ถ้าข้า ทำให้เจ้าเป็นตัวอย่าง!"
 court.3070.b:0 "บอกต่อ ๆ กันไปว่าข้าเป็นเจ้าบ้านที่เอื้อเฟื้อ"
 court.3070.c:0 "ข้าจะมีการทดสอบภาคบังคับสำหรับแขกที่พวกเขาต้องผ่านเพื่อพักที่นี่..."
 court.3070.d:0 "ข้า... จริง ๆ แล้วไม่รังเกียจที่ทุกคนไม่รู้ว่าข้าเป็นใคร"

