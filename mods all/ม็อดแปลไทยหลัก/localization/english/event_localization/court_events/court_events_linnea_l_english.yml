l_english: 

 court.5001.t:0 "วันอันเปลี่ยวเหงา"
 court.5001.desc:0 "[friend.Custom2('MyCharacterIntroduction', ROOT.Char)|U] กำลังเบื่อหน่ายอย่างยิ่ง ข้าเห็นได้จากสีหน้าของ [friend.GetHerHis] และจากท่าทีที่ [friend.GetSheHe] พยายามเรียกร้องความสนใจจากข้าตลอดเวลา\n\nข้ารู้ว่าภาระหน้าที่ของข้ากินเวลาไปมาก และนั่น ทำให้ [friend.GetHerHim] รู้สึกเปลี่ยวเหงาในบางครั้ง..."
 court.5001.a:0 "ข้าจะหาเวลาให้ [friend.GetHerHim] มากขึ้น"
 court.5001.b:0 ""เจ้ารู้หรือไม่ว่าเจ้าต้องการอะไร? [friend.Custom('WifeHusbandOpp')] สักคน""
 court.5001.c_dog:0 ""เจ้า... เจ้าเอา [ROOT.Char.Custom('DogStoryName')] ไปได้""
 court.5001.c_cat:0 ""เจ้า... เจ้าเอา [ROOT.Char.Custom('CatStoryName')] ไปได้""
 court.5001.d:0 "[friend.GetSheHe|U] ต้องการภารกิจ เพื่อให้มีอะไรทำ"

 court.5010.t:0 "การหลอกหลอน"
 court.5010.desc:0 "เหล่าคนรับใช้ที่เบิกตากว้างต่างพากันมาหาข้ามากขึ้นเรื่อยๆ โดยอ้างว่าเห็น [family_member.Custom2('MyCharacterIntroduction', ROOT.Char)] เดินไปตามโถงทางเดิน\n\n"[family_member.GetSheHe|U] หาความสงบมิได้ [ROOT.Char.Custom('FormOfAddressForLiege')] นั่นคือเหตุผลที่ [family_member.GetSheHe] ยังคงวนเวียนอยู่ในสถานที่ที่ [family_member.GetHerHis] สิ้นใจ!""
 court.5010.a:0 "หยุดเรื่องไร้สาระนี่เสีย [family_member.GetSheHe] ตายและจากไปแล้ว!"
 court.5010.b:0 "นับเป็นเกียรติที่ [family_member.GetSheHe] มาเยี่ยมเยียนเรา อย่ารบกวน [family_member.GetHerHim]"
 court.5010.c:0 "ข้าจะให้คนไปตรวจสอบเรื่องนี้"

 court.5020.t:0 "ปัญหาเรื่องหมอน"
 court.5020.desc:0 "[courtier.Custom2('MyCharacterIntroduction', ROOT.Char)|U] เข้ามาหาข้าอย่างบ้าคลั่ง ถุงใต้ตาของ [courtier.GetHerHis] ลึก\n\n"แมวบ้านั่นของท่านไม่ยอมออกจากห้องของข้าไปเลย ดูเหมือนว่าหมอน #EMP ของข้า#! จะเป็นที่ที่ดีที่สุดในการนอนใน [ROOT.Char.Custom('ResidenceBuilding')] บ้า ๆ ทั้งหมดนี้ สิ่งมีชีวิตนั้นต้องถูกควบคุม!" [courtier.GetFirstNameNoTooltip] หยุดชั่วคราวก่อนที่จะสงบสติอารมณ์ [courtier.GetHerselfHimself] อย่างเห็นได้ชัด "หากเป็นที่พอพระทัยของ [ROOT.Char.GetLadyLord] ของข้า""
 court.5020.a:0 "เห็นได้ชัดว่าตอนนี้มันเป็นหมอนของ [ROOT.Char.Custom('CatStoryNamePossessive')]"
 court.5020.b:0 "ข้าจะดูแลให้ [ROOT.Char.Custom('CatStorySheHe')] อยู่ห่าง ๆ"

 court.5021.desc:0 "ข้ามองเห็น [courtier.Custom2('MyCharacterIntroduction', ROOT.Char)] อยู่ฝั่งตรงข้ามห้อง [courtier.GetSheHe] อารมณ์ดีในช่วงหลังมานี้ และขอบตาคล้ำลึกของ [courtier.GetHerHis] ก็หายไปแล้ว\n\nสิ่งที่ ทำให้ข้ากังวลคือ [ROOT.Char.Custom('CatStoryName')] สุดที่รักของข้าดูเหมือนจะหายตัวไปในเวลาเดียวกัน..."
 court.5021.desc_mittens:0 "\n\n[courtier.GetFirstNameNoTooltip] เห็นข้ามองอยู่และโบกมือให้ข้า เห็นถุงมือสี [ROOT.Char.Custom('CatFurColor')] คู่ใหม่ได้อย่างชัดเจน"
 court.5021.a:0 "[ROOT.Char.Custom('CatStorySheHe')] หายไปไหนกันนะ?"
 court.5021.a_mittens:0 "ถุงมือสวยจั– โอ้ ไม่นะ #EMP [ROOT.Char.Custom('CatStoryName')]#!!"
 court.5021.b:0 "[courtier.GetFirstNameNoTooltip] จะหายตัวไปในทำนองเดียวกัน"
 court.5021.c:0 ""ชะตากรรมของเจ้าจะเป็น เช่นเดียวกับของ [ROOT.Char.Custom('CatStoryNamePossessive')]""

 court.5025.t:0 "ข้อเสนอ"
 court.5025.desc:0 ""ขนสี [ROOT.Char.Custom('CatFurColor')] เป็นมันเงาและดวงตาสี [ROOT.Char.Custom('CatEyeColor')] เหล่านั้น... ข้าไม่เคยเห็นแมวที่สวยงาม เช่นนี้มาก่อน!"\n\n[buyer.Custom2('MyCharacterIntroduction', ROOT.Char)|U] ลูบ [ROOT.Char.Custom('CatStoryName')] อย่างครุ่นคิดก่อนจะหันกลับมาหาข้า "[ROOT.Var('price_for_pet').GetValue|0] เหรียญทองน่าจะเพียงพอ ใช่หรือไม่?""
 court.5025.a:0 "[ROOT.Char.Custom('CatStorySheHe')|U] เป็นของท่าน!"
 court.5025.b:0 "กล้าดีอย่างไร ข้าไม่มีวันขาย [ROOT.Char.Custom('CatStoryName')]!"

 court.5026.desc:1 ""ขนสี [ROOT.Char.Custom('DogFurColor')] เป็นมันเงา เช่นนี้ แถมยังฝึกมาอย่างดีอีกด้วย! ข้าไม่เคยเห็นสุนัขที่สง่างาม เช่นนี้มาก่อน!"\n\n[buyer.Custom2('MyCharacterIntroduction', ROOT.Char)|U] ลูบ [ROOT.Char.Custom('DogStoryName')] อย่างครุ่นคิดก่อนจะหันกลับมาหาข้า "[ROOT.Var('price_for_pet').GetValue|0] เหรียญทองน่าจะเพียงพอ ใช่หรือไม่?""
 court.5026.a:0 "[ROOT.Char.Custom('DogStorySheHe')|U] เป็นของท่าน!"
 court.5026.b:0 "กล้าดีอย่างไร ข้าไม่มีวันขาย [ROOT.Char.Custom('DogStoryName')]!"

 court.5030.t:0 "เวลาเล่น"
 court.5030.desc_opening:0 "ข้ามองเห็น [child.Custom2('MyCharacterIntroduction', ROOT.Char)] กำลังเล่นกับ [child.Custom('child_favorite_toy')] ชิ้นโปรดของ [child.GetHerHis] อยู่ฝั่งตรงข้ามห้อง"
 court.5030.desc_young:0 "พวกผู้ใหญ่รอบตัวข้ามักไม่มีความสุขและต้องการให้ข้าช่วยพวกเขา แต่ข้าคิดว่าข้าอยากจะช่วยปราบมังกรที่น่าสะพรึงกลัวที่ [child.GetSheHe] ดูเหมือนกำลังต่อสู้อยู่มากกว่า!"
 court.5030.desc:0 "ข้าฟังผู้คนคร่ำครวญและบ่นมาทั้งวันแล้ว และข้าก็ #EMP เบื่อ#! มากจนอดไม่ได้ที่จะหันเหความสนใจไปยังเกมอะไรก็ตามที่ [child.GetSheHe] กำลังเล่นอยู่..."
 court.5030.desc_ending:0 "\n\n[child.GetFirstNameNoTooltip] เห็นข้ามองอยู่และโบกมือเรียกให้ข้าไปร่วมเล่นกับ [child.GetHerHim]"
 court.5030.a:0 "นำ [ROOT.Char.Custom('child_favorite_toy')] ของข้ามา!"
 court.5030.b_young:0 "ไม่ ข้าต้องทำตัวจริงจัง"
 court.5030.b:0 "ไม่ ข้าต้องศึกษาเล่าเรียน"

 court.5040.t:0 "การเล่นตลกอย่างต่อเนื่อง"
 court.5040.desc:0 "อีกครั้งที่ข้าถูกบังคับให้ฟังผู้คนบ่น – [prank_alternative_1.Custom2('MyCharacterIntroduction', ROOT.Char)] ต้องการความสนใจ, [prank_alternative_2.Custom2('MyCharacterIntroduction', ROOT.Char)] อ้างว่าราชสำนักของข้าน่าเบื่อลง, และ [prank_alternative_3.Custom2('MyCharacterIntroduction', ROOT.Char)] คิดว่าช่วงนี้มีอาหารที่มีกระเพาะปัสสาวะสัตว์มากเกินไปเสียเหลือเกิน\n\n...เดี๋ยวก่อน ข้ามีความคิด"
 court.5040.a:0 "ข้าต้องอดทนและประพฤติตนเยี่ยง [ROOT.Char.GetLadyLord] ที่เหมาะสม"
 court.5040.b:0 "กระเพาะปัสสาวะที่พองลมบนเก้าอี้ของ [prank_alternative_1.GetFirstNamePossessiveNoTooltip] – นี่สิคือความสนใจ!"
 court.5040.c:0 "การที่ [prank_alternative_2.GetFirstNameNoTooltip] ผายลมออกมาคงจะไม่น่าเบื่อเลยสักนิด"
 court.5040.d:0 "[prank_alternative_3.GetFirstNameNoTooltip] จะพบกระเพาะปัสสาวะบนเก้าอี้ของ [prank_alternative_3.GetHerHis] แทนที่จะเป็นบนจาน!"

 court.5041.desc_option_1:0 "ขณะที่ [prank_target.GetTitledFirstName] กำลังเสียสมาธิระหว่างอาหารค่ำ ข้าค่อย ๆ โรยชิ้นส่วนเล็ก ๆ ของสายพิณไลร์ลงบนจานของ [prank_target.GetHerHis]\n\nข้าแทบจะกลั้นหัวเราะไว้ไม่อยู่เมื่อ [prank_target.GetSheHe] หันกลับมาพบว่าจานตรงหน้า [prank_target.GetHerHim] เต็มไปด้วยหนอน แต่ข้าต้องหลีกเลี่ยงความสงสัยหากจะดำเนินภารกิจนี้ต่อไป!"
 court.5041.desc_option_2:0 "ข้านำเลือดลูกวัวไปตากแห้งและทำเป็นผง จากนั้นข้าก็โรยลงบนสเต็กของ [prank_target.GetTitledFirstNamePossessive] เมื่อ [prank_target.GetSheHe] ไม่ได้มอง ทันใดนั้นผงก็กลายเป็นเลือดเหลว และข้าทำได้เพียงพยายามกลั้นหัวเราะเมื่อใบหน้าของ [prank_target.GetFirstNamePossessiveNoTooltip] บิดเบี้ยวด้วยความสยดสยองขณะที่สเต็กเริ่มมีเลือดไหลต่อหน้า [prank_target.GetHerHim]!"
 court.5041.desc_option_3:0 "ข้าแอบมอบหมายให้คนรับใช้บางคนไปหางูมาให้ข้า – มากที่สุดเท่าที่จะหาได้ จากนั้น ขณะที่ [prank_target.GetTitledFirstName] ออกไปข้างนอก ข้าก็ให้พวกเขาปล่อยงูในห้องพักของ [prank_target.GetHerHis] เสียงกรีดร้องที่ดังก้องไปตามโถงทางเดินเมื่อ [prank_target.GetHerHis] กลับมา ทำให้ข้าหัวเราะจนตัวงอ!"
 court.5041.desc_option_4:0 "ข้าบดกำยานบางส่วนให้เป็นผงละเอียดมากก่อนจะซ่อนไว้ในมือ จากนั้น ขณะที่เรานั่งตรงข้ามกันที่โต๊ะโดยมีเทียนอยู่ระหว่างเรา ข้าก็เหวี่ยงมือไปทางใบหน้าของ [prank_target.GetTitledFirstNamePossessive] เมื่อผงผ่านเปลวไฟ มันก็ลุกไหม้อย่างน่าตื่นตา!\n\n[prank_target.GetSheHe|U] กรีดร้อง คิดว่าใบหน้าของ [prank_target.GetHerHis] ลุกเป็นไฟ แต่ข้ารู้ว่ามันเป็นเพียงกลอุบายและหัวเราะอย่างร่าเริง"
 court.5041.desc_option_5:0 "ข้าค่อย ๆ แง้มประตูห้องพักของ [prank_target.GetTitledFirstNamePossessive] และทรงตัวบนเก้าอี้ ข้าค่อย ๆ นำหม้อปัสสาวะที่เต็มเปี่ยมไปวางไว้บนขอบประตู จากนั้น: เคาะเร็ว ๆ และหลบหนีไปรอบมุมเร็วยิ่งกว่า\n\n“ใครน่ะ–” #EMP ซ่า!#!"
 court.5041.desc_opening:0 "#EMP แพร๊ด!#!\n\nเสียงดังแหวกอากาศไปทั่วโถงขณะที่ [prank_target.Custom2('MyCharacterIntroduction', ROOT.Char)] นั่งลง และใบหน้าของ [prank_target.GetHerHis] ก็ยิ่งแดงขึ้นเมื่อความเงียบดำเนินต่อไป ข้าพยายามกลั้นหัวเราะ แต่หากข้าจะแกล้ง [prank_target.GetHerHim] อีกครั้ง ข้าต้องหลีกเลี่ยงความสงสัย!"
 court.5041.a:0 "ข้าจะหยุด และข้าจะปลอบใจ [prank_target.GetHerHim]"
 court.5041.option_1:0 "มื้อต่อไปของ [prank_target.GetHerHis|U] จะเต็มไปด้วย "หนอน"!"
 court.5041.option_2:0 "สเต็กชิ้นต่อไปที่ [prank_target.GetSheHe] กินจะดูเหมือนมีเลือดไหล!"
 court.5041.option_3:0 "ข้าจะปล่อยงูในห้องพักของ [prank_target.GetHerHis]!"
 court.5041.option_4:0 "ข้าจะ ทำให้ [prank_target.GetHerHim] ตกใจด้วยผงติดไฟ!"
 court.5041.option_5:0 "จะมีเซอร์ไพรส์รอ [prank_target.GetHerHim] อยู่บนประตูห้องของ [prank_target.GetHerHis]!"

 court.5042.desc_chastiser:0 "\n\nแต่ [chastiser.Custom2('MyCharacterIntroduction', ROOT.Char)|U] ไม่เห็นความขบขันในเรื่องนี้เลย\n\n"ข้ารู้ว่าเป็นท่านที่เล่นตลกอันชั่วร้ายเหล่านี้ไปทั่วราชสำนัก"
 court.5042.desc_chastiser_snake:0 "[prank_target.GetTitledFirstName] ผู้น่าสงสารสะดุ้งตกใจกับทุกเงา และสิ่งที่งูทำกับใบหน้าของ [prank_target.GetHerHis]... มันน่าอัปยศ ฝ่าบาท""
 court.5042.desc_chastiser_no_snake:0 "[prank_target.GetTitledFirstName] ผู้น่าสงสารสะดุ้งตกใจกับทุกเงา! มันน่าอัปยศ... ฝ่าบาท""
 court.5042.desc_no_chastiser:0 "แต่ข้าราชบริพารของข้าไม่เห็นความขบขันในเรื่องนี้เลย และพวกเขาแสดงให้เห็นอย่างชัดเจนว่าจะประณามการเล่นตลกใด ๆ อีก และพวกเขาจะระวังตัว"
 court.5042.a:0 "มันเป็นเพียงการเล่นตลก!"

 court.5050.t:0 "ข้าราชบริพารผู้ถูกเมิน"
 court.5050.desc:2 ""เหตุใดท่านจึงให้เกียรติเจ้า[courtier_given_title.Custom2('InsultNoun', SCOPE.sC('courtier'))] [courtier_given_title.GetTitledFirstName] นั่นด้วยตำแหน่งในราชสำนัก แต่กลับไม่ใช่ข้า?"\n\n[courtier.Custom2('MyCharacterIntroduction', ROOT.Char)|U] โกรธจัด เห็นได้ชัดว่า [courtier.GetSheHe] มั่นใจว่าเกียรตินี้จะตกเป็นของ [courtier.GetHerHim] และไม่ใช่ของผู้อื่น"
 court.5050.a:0 "โอ้ เลิกพูดเสียที!"
 court.5050.b:1 "เจ้าพูดถูก เจ้าสมควรได้รับตำแหน่ง"
 court.5050.c:0 "หากเจ้าจะพูดตลก เช่นนี้ ข้าควรจะเริ่มจ่ายเงินให้เจ้าแล้ว!"

 court.5055.t:0 "พรสวรรค์อันมีสีสัน"
 court.5055.desc:0 "ข้าพบ [painter.Custom2('MyCharacterIntroduction', ROOT.Char)] นั่งอยู่บนพื้น ล้อมรอบด้วยสีที่หกและชิ้นส่วนผ้าใบ เป็นครั้งที่สามในเดือนนี้\n\nข้าราชบริพารของข้ากระซิบกันว่า [painter.GetHerHim] เป็นอัจฉริยะทางศิลปะที่กำลังเติบโต แต่เหล่าคนรับใช้บ่นเรื่องการขัดพื้นให้ปราศจากสีหลังจาก #EMP แรงบันดาลใจ#! ของ [painter.GetHerHis]"
 court.5055.a:0 "เจ้าต้องมุ่งเน้นไปที่การศึกษาที่ #EMP มีประโยชน์#!, [painter.GetFirstNameNoTooltip]"
 court.5055.b:0 "อัจฉริยภาพของ [painter.GetHerHis|U] จะได้รับการบ่มเพาะ!"
 court.5055.b_tt:0 "[painter.GetFirstNameNoTooltip] ดำเนินการตามความสนใจทางศิลปะของ [painter.GetHerHis] ต่อไป"

 court.5056.desc_opening:1 "พรสวรรค์ด้านพู่กันของ [painter.Custom2('MyCharacterIntroduction', ROOT.Char)|U] เติบโตขึ้นทุกปีที่ผ่านไป และความสนใจและความสามารถในด้านอื่น ๆ ของ [painter.GetHerHis] ก็ เช่นกัน\n\n"
 court.5056.desc_family:1 ""ขอบคุณที่เชื่อมั่นในตัวข้า, [painter.Custom2('RelationToMeShort', ROOT.Char )]""
 court.5056.desc:0 ""ขอบคุณที่เชื่อมั่นในตัวข้าและความสามารถของข้า [ROOT.Char.Custom('FormOfAddressForLiege')]""
 court.5056.desc_ending:1 "ข้ามีโครงการใหม่ที่อยากจะเริ่ม บางทีท่านอาจสนใจที่จะเป็นผู้อุปถัมภ์ของข้าอีกครั้ง?""
 court.5056.a:1 "แน่นอน!"
 court.5056.b:0 "ตอนนี้เจ้าโตพอที่จะสร้างเส้นทางชีวิตของตัวเองแล้ว"

 court.5057.desc:0 "เมื่อเวลาผ่านไปหลายปี ก็เห็นได้ชัดเจนอย่างเจ็บปวดว่า [painter.Custom2('MyCharacterIntroduction', ROOT.Char)] ไม่มีทั้งพรสวรรค์และความมุ่งมั่นที่จะวาดผลงานชิ้นเอกที่ [painter.GetSheHe] สัญญาไว้กับข้า\n\n"ข้าเป็นเพียงเด็กที่ต้องการความสนใจ ไม่น่าเชื่อว่าท่านจะเชื่อเรื่องไร้สาระของข้าจริง ๆ!""
 court.5057.a:0 "อา ความเขลาในวัยเยาว์..."
 court.5057.b:0 "ไม่มีใครมาหลอกข้าได้!"

 court.5060.t:0 "$knight_culture_player_no_tooltip$ ผู้กล้าหาญ"
 court.5060.desc:0 "[knight.Custom2('MyCharacterIntroduction', ROOT.Char)|U] มีผลงานยอดเยี่ยมในการรบครั้งล่าสุดของเรา และราชสำนักของข้าก็เต็มไปด้วยความตื่นเต้น ช่างเป็น $knight_culture_player_no_tooltip_lowercase$ ที่ประสบความสำเร็จ ช่างเป็นแบบอย่าง ช่างเป็น #EMP [knight.GetWomanMan]#!!\n\nด้วยคำสรรเสริญทั้งหมดที่หลั่งไหลมายัง [knight.GetHerHim] ทำให้เห็นได้ชัดว่าข้าถูกคาดหวังให้มอบรางวัลแก่ [knight.GetHerHim] อย่างเป็นทางการในบางลักษณะ"
 court.5060.a:0 "เอ่อ... ข้าจะกล่าวชื่นชม [knight.GetHerHim]"
 court.5060.b:0 "[knight.GetSheHe|U] คือ [knight.GetLadyLord] คนใหม่แห่ง [title_to_grant.GetNameNoTooltip]!"
 court.5060.c:0 "เชื้อสาย $knight_culture_player_no_tooltip_lowercase$ ที่ควรค่าแก่การสรรเสริญอย่างยิ่ง!"
 court.5060.d.champion:0 "[knight.GetSheHe|U] จะรับใช้ในฐานะ $champion_court_position$ ของข้า!"
 court.5060.d.bodyguard:0 "[knight.GetSheHe|U] จะรับใช้ในฐานะ $bodyguard_court_position$ ของข้า!"
 court.5060.d.akolouthos: "[knight.GetSheHe|U] จะรับใช้ในฐานะ $akolouthos_court_position$ ของข้า!"

 court.5070.t:0 "อาจารย์ผู้ทุ่มเท"
 court.5070.desc:0 "[court_tutor.Custom2('MyCharacterIntroduction', ROOT.Char)|U] เข้ามาหาข้าพร้อมความกังวลเกี่ยวกับสภาพของสื่อการเรียนการสอนของเรา\n\n"เราพอจะใช้ที่มีอยู่ได้ แต่ลองจินตนาการถึงความก้าวหน้าที่เด็ก ๆ ของเราจะไปถึงได้หากเรามีสื่อที่ดีกว่านี้... กระดานขี้ผึ้งใหม่ กระดาษหนัง หรือแม้กระทั่งหมึก!""
 court.5070.a:0 "แต่ท่านก็ทำงานได้ดีเยี่ยมอยู่แล้ว!"
 court.5070.b:0 "แน่นอน ท่านจะได้รับเงินทุน!"
 court.5070.b.tt:0 "สิ่งนี้ส่งเสริมการศึกษาของเด็กในอุปถัมภ์ของท่านทุกคน"

 court.5075.t:0 "ม้าแพลฟรีย์สองตัว"
 court.5075.desc_opening:0 "[neighbor.Custom2('MyCharacterIntroduction', ROOT.Char)|U] ได้มอบของขวัญอันล้ำค่าแก่ข้า: ม้าแพลฟรีย์พันธุ์ดีคู่หนึ่ง ตัวเมียหนึ่งตัวและตัวผู้หนึ่งตัว!\n\n"
 court.5075.desc_horse_master:0 ""[ROOT.Char.Custom('FormOfAddressForLiege')|U]" [master_of_the_horse.Custom2('MyCharacterIntroduction', ROOT.Char)] กวักมือเรียกข้าไปยัง [dummy_gender.Custom('HorseMareStallion')]"
 court.5075.desc:0 ""[ROOT.Char.Custom('FormOfAddressForLiege')|U]" นายโรงม้าของข้ากวักมือเรียกข้าไปยัง [dummy_gender.Custom('HorseMareStallion')]"
 court.5075.desc_ending:0 ""ดูมัดกล้ามเนื้อเหล่านี้สิ... และสะโพกนั่น! ตัวนี้น่าจะใช้การได้ดีในสงคราม""
 court.5075.a:0 "พวกมันจะรับใช้เหล่าขุนนางและสุภาพสตรีในราชสำนัก"
 court.5075.b:0 "และพวกมันทั้งคู่จะขายได้ราคาดี!"
 court.5075.c:0 "ข้าจะฝึก [dummy_gender.Custom('HorseMareStallion')] ด้วยตนเอง"
 court.5075.c.success:0 "ท่านสามารถฝึกม้าได้อย่างเหมาะสม"
 court.5075.c.failure:0 "ม้าสะบัดท่านตก"
