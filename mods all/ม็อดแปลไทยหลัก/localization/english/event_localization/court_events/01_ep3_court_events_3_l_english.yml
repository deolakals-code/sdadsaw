l_english: 

 #The Peak of Elegance
 court_events.3000.t: "จุดสูงสุดแห่งความสง่างาม"
 court_events.3000.desc: "[chancellor.Custom2('MyCharacterIntroduction',ROOT.Char)|U] และ [steward.Custom2('MyCharacterIntroduction',ROOT.Char)] ดูเหมือนจะอารมณ์ดีในวันนี้\n\n"มาร่วมกับพวกเราเถิด ใต้เท้า!" [chancellor.GetFirstNameNoTooltip] อุทาน "พวกเรากำลังพูดถึงเรื่องที่ท่านสนใจ การลงทุนของท่านเพื่อส่งเสริมและรักษาแฟชั่น [ROOT.Char.GetCulture.GetNameNoTooltip] ให้เป็นจุดสูงสุดแห่งความสง่างามอย่างแท้จริงกำลังผลิดอกออกผล!"\n\n"ผู้ปกครองต่างแดนชื่นชมและอิจฉาท่าน แต่ [steward.GetFirstNameNoTooltip] และตัวข้าเองไม่สามารถตกลงกันได้ถึงวิธีที่ดีที่สุดในการใช้ประโยชน์จากชื่อเสียงของท่าน""
 court_events.3000.a: "ทุกคนควรรู้ว่าข้าคือที่สุดแห่งแฟชั่น"
 court_events.3000.b: "แฟชั่น [ROOT.Char.GetCulture.GetNameNoTooltip] ควรเป็นแบบอย่างแก่ทุกคน"
 court_events.3000.c: "ทุกคนควรซื้อหมวกของเรา!"
 #The Same Old Soup
 court_events.3010.t: "ซุปเดิมๆ"
 court_events.3010.desc: ""ข้าขอร้องท่านเถิด [ROOT.Char.Custom2('RelationToMeAddress', SCOPE.sC('courtier'))] ของข้า" [courtier.Custom2('MyCharacterIntroduction', ROOT.Char)] เข้ามาหาข้าด้วยสายตาอ้อนวอน\n\n"ท่านต้องทำอะไรสักอย่างเกี่ยวกับอาหารที่เสิร์ฟในราชสำนัก! พวกเราทุกคนกินเหมือนชาวนา ทูตต่างแดนทำหน้าบึ้งที่โต๊ะอาหารของเรา และผู้ปกครองและศิลปินเพื่อนบ้านใช้อาหารพื้นเมืองของเราเป็นตัวอย่างของรสนิยมที่แย่และนิสัยป่าเถื่อน!""
 court_events.3010.a: "ก็ได้ ข้าจะจ้างพ่อครัวต่างชาติ"
 court_events.3010.b: "แต่มันดีต่อสุขภาพและเคร่งศาสนานะ!"
 court_events.3010.c: "มันเพื่อความปลอดภัยของข้า"
 cheaper_food_for_15_years: "$court_food_quality_decent$ ถูกลง #P 20%#! เป็นเวลา 15 ปี"
 court_events.3010.c.tt: "เมื่อซุปของท่านมีรสชาติและหน้าตาเหมือนเดิมทุกวัน มันยากขึ้นมากที่จะแอบใส่ยาพิษลงไปโดยไม่มีใครสังเกต!"
 # What's in a Bed?
 court_events.3020.t: "มีอะไรในเตียงนอน?"
 court_events.3020.desc: "[courtier.Custom2('MyCharacterIntroduction', ROOT.Char)|U] ดูเศร้าเป็นพิเศษในวันนี้\n\n"พวกเราอยู่ในราชสำนักนี้เหมือนสัตว์! หรือแย่กว่านั้น เหมือน #EMP ชาวนา!#! ห้องพักแออัด ทั้งครอบครัวกองรวมกันในเตียงเดียวกัน หม้อถ่ายทิ้งเกลื่อนกลาด พวกเรากลิ้งเกลือกอยู่ในความสกปรกและกลิ่นเหม็น...""
 court_events.3020.desc_physician: "\n\n[physician.Custom2('MyCharacterIntroduction', ROOT.Char)|U] พูดแทรกขึ้นมา: "อากาศเสียยัง ส่งผลให้เกิดโรคระบาดอีกด้วย!""
 court_events.3020.desc_architect: "\n\n"ต้องมีอะไรที่เราทำได้บ้าง" [architect.Custom2('MyCharacterIntroduction', ROOT.Char)] พูดเสริม""
 court_events.3020.a: "พวกเราสมควรได้รับสิ่งที่ดีกว่านี้"
 court_events.3020.b: "เรื่องนี้ต้องการผู้เชี่ยวชาญ: [expert.GetFirstNameNoTooltip]!"
 court_events.3020.c: "[architect.GetFirstNameNoTooltip] และ [physician.GetFirstNameNoTooltip] แก้ปัญหานี้!"
 court_events.3020.d: "ข้ามั่นใจว่ามันไม่ได้แย่ขนาดนั้น"
 cheaper_lodgings_for_15_years: "$court_lodging_standards_middling$ ถูกลง #P 15%#! เป็นเวลา 15 ปี"
 cheaper_lodgings_for_15_years_1: "$court_lodging_standards_middling$ ถูกลง #P 25%#! เป็นเวลา 15 ปี"
 #It Came to Me in a Dream
 court_events.3030.t: "มันมาหาข้าในฝัน"
 court_events.3030.desc: ""[ROOT.Char.GetTitleAsNameNoTooltip] ผู้ใจกว้าง! ขอให้ข้าได้แสดงความขอบคุณอย่างสุดซึ้ง และนำข่าวดีมาแจ้งท่าน!" [inspiration_owner.GetTitledFirstName] อุทานขณะรีบมาหาข้า\n\n"ข้าเพลิดเพลินกับห้องพักที่ท่านจัดให้ข้าเป็นอย่างยิ่ง มันกว้างขวางมาก ข้าจึงสามารถเดินไปมาขณะคิด และทำงานได้อย่างสบายใจโดยไม่มีใครรบกวน ทิวทัศน์สวนนั้นงดงามจับใจจนเป็นแรงบันดาลใจ และเตียงนอน — โอ้ เตียงนอน! — มันสบายมากจนข้ารู้สึกเหมือนนอนอยู่บนเมฆ! อันที่จริง แรงบันดาลใจจากสวรรค์ที่จะ ทำให้ [inspiration_owner.Custom('GetInspirationTypeObject')] ของท่านดียิ่งขึ้นเพิ่งมาหาข้าขณะที่ข้ากำลังหลับ ข้าต้องรีบกลับไปทำงานแล้ว!""
 court_events.3030.a: "แล้วเตียงที่ดีกว่านี้ล่ะ?"
 court_events.3030.b: "ข้าดีใจจริงๆ ที่ได้ยิน เช่นนั้น!"
 #Empty Court
 court_events.3040.t: "ราชสำนักที่ว่างเปล่า"
 court_events.3040.desc: "ขณะที่ข้าเกิดอยากกินขนมขึ้นมากะทันหันและหาคนรับใช้สักคนมาช่วยไม่ได้ ข้าก็ตระหนักว่าสิ่งนี้กลายเป็นเรื่องปกติไปแล้ว ข้าไม่สามารถทำอะไรในราชสำนักของข้าได้เลย เพราะมีคนรับใช้ไม่เคยพอ!\n\nความคิดของข้าถูกขัดจังหวะโดยการปรากฏตัวของ [steward.Custom2('MyCharacterIntroduction', ROOT.Char)] "ใต้เท้า [ROOT.Char.GetTitleAsNameNoTooltip] ท่านมีความคิดเห็นอย่างไรเกี่ยวกับสงครามที่กำลังทำลายล้างเพื่อนบ้านของเรา [war_realm.GetName]? ผู้ลี้ภัยนับไม่ถ้วนจาก [occupied_prov.GetName] ที่ถูกยึดครองกำลังหลั่งไหลข้ามพรมแดนของเรา ในขณะที่เราพูดกันอยู่นี้!"\n\nนี่อาจเป็นทางออกที่ข้ากำลังต้องการอยู่หรือเปล่า?"
 court_events.3040.a: "ประตูเมืองของเราจะเปิดต้อนรับพวกเขา!"
 court_events.3040.b: "ดีมาก พวกเขาสามารถทำงานให้เราได้"
 court_events.3040.c: "เราไม่ต้องการพวกเขา"
 cheaper_servants_for_15_years: "$court_servants_some$ ถูกลง #P 20%#! เป็นเวลา 15 ปี"
 #At the Table of the X
 court_events.3050.t: "ที่โต๊ะอาหารของ [ROOT.Char.GetTitleAsNameNoTooltip]"
 court_events.3050.desc: ""[ROOT.Char.Custom('FormOfAddressForLiege')|U]" — [chancellor.Custom2('MyCharacterIntroduction', ROOT.Char)] เริ่มต้น — "ข้าได้ทราบมาว่ามื้ออาหารอันหรูหราที่เสิร์ฟบนโต๊ะของท่านนั้น ได้สร้างชื่อเสียงเลื่องลือทีเดียว!"\n\n"ช่างเป็นอาหารอันโอชะที่แปลกใหม่, รสชาติช่างเย้ายวน... เหล่าข้าหลวงของท่าน #EMP ปรารถนาอย่างยิ่ง#! ที่จะได้รับเชิญให้มาร่วมงานเลี้ยงของท่าน!"\n\nสิ่งนี้ ทำให้ข้าเกิดความคิดขึ้นมา..."
 court_events.3050.a: "ให้พวกเขาปรารถนาโต๊ะอาหารของ [ROOT.Char.GetTitleAsNameNoTooltip]!"
 court_events.3050.b: "เชิญพวกเขามาที่โต๊ะอาหารของ [ROOT.Char.GetTitleAsNameNoTooltip] กันเถอะ!"
 court_events.3050.a.tt: "ท่านได้รับ #P $food_improves_opinion$#!: เพิ่มประสิทธิภาพของ [domestic_affairs|E] เป็นเวลา #P 15#! ปี"
 court_events.3050.b.tt: "ท่านได้รับ #P $food_improves_feasts$#!: การยอมรับของแขก #P +15#! และค่าใช้จ่ายทอง #P -15%#! สำหรับกิจกรรมงานเลี้ยงของท่านเป็นเวลา #P 15#! ปี"
 food_improves_feasts: "อาหารเลื่องชื่อ"
 food_improves_opinion: "$food_improves_feasts$"
 food_improves_feasts_desc: "$food_improves_feasts$: $VALUE|=+0$"
 chancellor_domestic_affairs_opinion_food_bonus_desc: "\n$TAB$$food_improves_opinion$: #P +[SCOPE.ScriptValue('chancellor_domestic_affairs_opinion_food_bonus')|2]#!"
 chancellor_domestic_affairs_tyranny_food_bonus_desc: "\n$TAB$$food_improves_opinion$: #P +[SCOPE.ScriptValue('chancellor_domestic_affairs_tyranny_food_bonus')|P0]%#!"
 # A Faceless Sea
 court_events.3060.t: "ทะเลไร้หน้า"
 court_events.3060.desc: "ไม่ว่าข้าจะหันไปทางใด, ข้าก็เห็นผู้คนที่สวมสีของข้า: วิ่งวุ่นไปมา, ซุบซิบนินทา, ขัดเกราะเก่า ๆ, นำอาหารมาให้, ถือสาร...\n\nเดี๋ยวนี้มีพวกเขากี่คนกันนะ? พวกเขาไป ๆ มา ๆ ดั่งกระแสน้ำ, และข้าพบว่าเป็นไปไม่ได้เลยที่จะจดจำใบหน้าที่คุ้นเคยได้! ข้าจะไว้ใจใครได้บ้าง?\n\nขณะที่ข้ากำลังจมอยู่กับความคิด, [spymaster.Custom2('MyCharacterIntroduction', ROOT.Char)] เข้ามาหาข้า "[ROOT.Char.Custom('FormOfAddressForLiege')|U], ข้าเห็นท่านกำลังพิจารณาเหล่าคนรับใช้ ช่างมีมากมายเหลือเกิน! ในทะเลผู้คนที่ไร้ใบหน้า เช่นนี้, ไม่มีใครสามารถติดตามได้ว่าใครเป็นใคร มันคงจะง่ายมากที่จะแทรกซึมสายลับเข้าไปในทุกที่ที่ต้องการ... แน่นอน, ศัตรูของท่านก็สามารถฉวยโอกาสนี้ได้ เช่นกัน, แต่ลองคิดถึงความเป็นไปได้ทั้งหมดดูสิ...""
 court_events.3060.a: "ความเป็นไปได้มากมาย..."
 court_events.3060.a.tt: "... ที่จะแทงข้างหลังข้าด้วย!"
 court_events.3060.b: "ให้พวกเขาทำงานแทนสิ!"
 # Rags and not Riches?
 court_events.3070.t: "ผ้าขี้ริ้วและไม่ใช่ความร่ำรวย?"
 court_events.3070.desc: "ระหว่างการเดินทางของ[guest.GetHerHis], [guest.GetTitledFirstName] ได้พบว่า[guest.GetHerselfHimself]กำลังเยี่ยมเยือนราชสำนักของข้า จนถึงตอนนี้, [guest.GetSheHe]ก็ยังไม่รู้สึกประทับใจนัก\n\n"โอ้, ข้าเข้าใจแล้ว, นี่คือสิ่งที่พวกท่านเรียกว่า "แฟชั่น" แถวนี้สินะ... อภัยให้ข้าด้วย, [ROOT.Char.Custom('FormOfAddressForLiege')], แต่ข้าแทบจะแยกท่านออกจากคนรับใช้ของท่านไม่ออกเลย, อาภรณ์ของท่านช่างสมถะเหลือเกิน! บางทีข้าอาจจะแบ่งปันคำแนะนำบางอย่างได้, หากท่านอนุญาต?""
 court_events.3070.a: "มาดูกันว่าเจ้ามีอะไรจะเสนอ"
 court_events.3070.b: "ข้ายอมรับความอ่อนน้อมถ่อมตนแล้ว เจ้าควรลองดูบ้าง"
 court_events.3070.c: "#EMP กล้าดียังไง?!#!"
 cheaper_fashion_for_15_years: "$court_fashion_decent$ ถูกลง #P 20%#! เป็นเวลา 15 ปี"
 free_fashion_for_15_years: "$court_fashion_acceptable$ #P ฟรี#! เป็นเวลา 15 ปี"
 # Silvertongue
 court_events.3080.t: "ลิ้นเงิน"
 court_events.3080.desc: "[poet.GetWomanMan] ที่เข้าร่วมราชสำนักของข้าในวันนี้มีไหวพริบที่แปลกประหลาดและรอยยิ้มที่เปี่ยมไปด้วยเสน่ห์และความมั่นใจ\n\n"[ROOT.Char.GetTitleAsNameNoTooltip] ผู้รุ่งโรจน์ ขอให้ข้าแนะนำตัวเอง: ข้าชื่อ [poet.GetFirstNameNicknamed] และข้าเป็นกวีผู้มีฝีมือเลิศ! ชื่อเสียงของข้าขจรขจายไปทั่วทั้งทวีป แต่ในโอกาสพิเศษนี้ ข้าตัดสินใจว่าวันแห่งการพเนจรของข้าสิ้นสุดลงแล้ว และข้าอยากจะเสนอ — แด่ [ROOT.Char.GetLadyLord] ผู้ #EMP มีเมตตา#! และ #EMP สง่างาม#! ที่สุด — บริการอันประเมินค่ามิได้ของข้า""
 court_events.3080.a: "เจ้าจะเขียนสุนทรพจน์ให้ข้า"
 court_events.3080.b: "ความเชี่ยวชาญของเจ้าอาจช่วยแผนการของข้าได้..."
 court_events.3080.c: "เขียนถ้อยคำหวานปานน้ำผึ้งให้ชู้รักของข้า!"
 court_events.3080.d: "ตอนนี้เราไม่ต้องการทักษะของเจ้า"
 # I Want a Pony!
 court_events.3090.t: "ข้าอยากได้ม้าโพนี่!"
 court_events.3090.desc: ""[ROOT.Char.GetMotherFather|U] ท่านจะสอนข้าขี่ม้าไหม? ข้าอยากเป็นนักรบที่ยิ่งใหญ่ที่สุดที่เคยมีมา!"\n\nเสียงอันกระตือรือร้นของ [child.GetFirstNamePossessive] ดังขึ้นมาหาข้าในช่วงเวลาเงียบสงบที่หาได้ยากระหว่างภารกิจทางการมากมายของข้า ความทะเยอทะยานของ[child.GetHerHis|U]นั้นเกินตัว แต่[child.GetSheHe]ก็ยังเป็นแค่เด็ก... มีอะไรผิดปกติกับการเล่นตามน้ำไปสักพัก?"
 court_events.3090.a: "แน่นอน ไปกันเถอะ!"
 court_events.3090.b: "เรียนตอนนี้ — ม้าโพนี่ทีหลัง!"
 court_events.3090.b.tt: "ถ้าเจ้าตั้งใจเรียนตอนนี้ ข้าสัญญาว่าจะให้ม้าศึกที่ดีที่สุดแก่เจ้าเมื่อเจ้าโตขึ้น!"
 court_events.3090.b.tt_effect: "[child.GetShortUIName|U] จะได้รับม้าศึกเมื่ออายุครบ 16 ปีบริบูรณ์ของ [child.GetHerHis]"
 court_events.3090.c: "ข้าไม่มีเวลาสำหรับเรื่องนี้ [child.Custom('GetDaughterSon')]"
 court_events.3091.desc_no_parent: "รู้สึกเหมือนเมื่อวานนี้เองที่ข้าซุ่มโจมตีท่านระหว่างการประชุม [parent.GetMotherFather] ประกาศอย่างภาคภูมิใจถึงความตั้งใจของข้าที่จะเป็นนักรบผู้ยิ่งใหญ่ — ผู้ที่ต้องรู้วิธีขี่ม้าอย่างถูกต้อง\n\nข้าแค่อยากใช้เวลาอยู่กับท่านมากขึ้น ท่านฉลาดเสมอ คิดถึงอนาคตของข้าเสมอ ตั้งแต่วันนั้น ข้าก็ตั้งใจเรียนอย่างที่ท่านขอ ตอนนี้ วันเกิดปีที่ 16 ของข้ามาถึงแล้ว แต่ท่านไม่อยู่แล้ว\n\nท่านรักษาสัญญาเสมอ ดังนั้นข้าจึงซื้อม้าศึกให้ตัวเอง — เหมือนที่ท่านสัญญากับข้าในวันนั้น — เพื่อเป็นเกียรติแก่ความทรงจำของท่าน"
 court_events.3091.desc: "วันเกิดปีที่ 16 ของข้าไม่เพียง แต่เป็นเครื่องหมายการก้าวเข้าสู่วัยผู้ใหญ่ แต่ยังเป็นวันหมดอายุของสัญญาที่ [parent.GetMotherFather] ของข้าให้ไว้กับข้ามานาน\n\nเป็นเวลาหลายปีที่ข้ารักษาส่วนของข้าในข้อตกลง ตั้งใจเรียนอย่างหนัก [parent.GetMotherFather] ของข้าจะจำส่วนของ[parent.GetHerHis]ได้หรือไม่?\n\nข้ายังคงจมอยู่ในความคิดเมื่อ [parent.Custom('GetMamaPapa')|U] ปรากฏตัวจากสวน ค่อยๆ จูงม้าศึกสง่างามมาตามบังเหียน [parent.GetSheHe|U] จำได้!"
 court_events.3091.a: "ข้าจะ ทำให้ท่านภูมิใจ!"
 court_events.3092.desc: ""ราวกับเมื่อวานนี้เองที่เจ้าซุ่มโจมตีข้า [child.GetFirstName] เป็นเพียง [child.Custom('GirlBoy')] ตัวน้อยที่ประกาศเจตนาของ [child.GetHerHis] อย่างภาคภูมิใจว่าจะกลายเป็นนักรบผู้ยิ่งใหญ่!"\n\nข้ายิ้มพลางจูงม้าศึกสง่างามด้วยบังเหียน "ในวันนั้น ข้าสัญญาว่าจะให้ม้าที่ดีที่สุดเท่าที่เคยมีมาใน [ROOT.Char.GetPrimaryTitle.GetBaseNameNoTierNoTooltip] ของเรา หากเจ้ายังคงศึกษาเล่าเรียนอย่างเหมาะสม เจ้าจำได้หรือไม่?"\n\nรอยยิ้มที่ปรากฏบนใบหน้าของลูกข้าขณะที่ [child.GetSheHe] ขึ้นขี่หลังม้าเป็นครั้งแรก คือการยอมรับทั้งหมดที่ข้าต้องการ"
 court_events.3092.a: "ด้วยความยินดี [child.Custom('GetDaughterSon')]!"
 # A Language for the X's Court
 court_events.3100.t: "ภาษาสำหรับราชสำนักของ [ROOT.Char.GetTitleAsNamePossessiveNoTooltip|U]"
 court_events.3100.desc: ""[ROOT.Char.GetTitleAsNameNoTooltip] ผู้น่าเกรงขาม อำนาจและเกียรติยศของท่านนั้นเกินคำถาม แต่ราชสำนักของท่านรู้สึกว่าไม่ได้รับการรับฟัง เพราะท่านพูดภาษาเดียวกับพวกเขาไม่ได้" [chancellor.Custom2('MyCharacterIntroduction', ROOT.Char)] เริ่มต้นอย่างประหม่า\n\n"บางที การเรียนรู้ [ROOT.Char.GetCourtLanguage.GetName] จะ ทำให้ท่านใกล้ชิดกับประชาชนของท่านมากขึ้น? ข้าอาจเสนอความช่วยเหลือเล็กน้อยของข้าได้หากท่านอนุญาต""
 court_events.3100.a: "ข้าเดาว่าข้าควรเริ่มเรียน"
 court_events.3100.b: "[linguist.GetFirstNameNoTooltip] สอนข้า!"
 court_events.3100.c: "ข้าไม่มีเวลาสำหรับเรื่องไร้สาระนี้"
 court_events.3100.a.tt: "ข้าเริ่ม [scheme|E] [GetScheme('learn_language').GetTypeName] ต่อ [chancellor.GetShortUIName] ด้วย [GetModifier('pressured_to_learn_court_language_modifier').GetNameWithTooltip]"
 # The Best Builder
 court_events.3110.t: "ช่างก่อสร้างที่ดีที่สุด"
 court_events.3110.desc: ""[ROOT.Char.Custom('FormOfAddressForLiege')|U]," [steward.Custom2('MyCharacterIntroduction', ROOT.Char)] เข้ามาหาข้า, ความกังวลฉายชัดบนใบหน้าของ[steward.GetHerHis] "ข้านำข่าวร้ายมาบอก"\n\n"[vassal.GetTitledFirstName|U] แห่ง [vassal.GetPrimaryTitle.GetBaseNameNoTier] ได้ทำการสร้างเมืองหลวงของ[vassal.GetHerHis]อย่างน่าประทับใจ จนพวกชาวบ้านเริ่มนำไปเปรียบเทียบกับ [ROOT.Char.GetCapitalLocation.GetBaronyNameExplicitly], และถึงกับกล้าพูดว่าเมืองหลวงของเรานั้นด้อยกว่า!"\n\n"การแสดงพลังอำนาจที่แข็งแกร่งเป็นหนทางเดียวที่จะรักษาหน้าไว้ได้ในตอนนี้, ข้าเกรงว่าจะเป็น เช่นนั้น""
 court_events.3110.a: "ข้าจะสร้างให้เหนือกว่า[vassal.GetHerHim]!"
 court_events.3110.architect: "[GetCourtPositionType('royal_architect_court_position').GetName()] ของท่านเริ่มทำงาน"
 court_events.3110.b: "ปรับ [vassal.GetHerHim] อย่างหนัก"
 court_events.3110.b.tt: "ข้ามั่นใจว่า[vassal.GetSheHe]ต้องเคยทำผิดกฎหมายสักครั้ง!"
 court_events.3110.c: "ดีสำหรับ[vassal.GetHerHim] ข้าเดาว่านะ"
 MODIFIER_DEFINITION_VALUE_ARCHITECT_SCALE: " \t#weak เพิ่มขึ้นตามระดับ [aptitude|E] ของ [GetCourtPositionType('royal_architect_court_position').GetName()] ของท่าน#!"
 court_events.3110.a.success: "โครงการก่อสร้างของท่านเริ่มต้นได้สำเร็จ"
 court_events.3110.a.failure: "โครงการก่อสร้างของท่านล้มเหลว"
 court_events.3110.a.success.tt: "เริ่มโครงการก่อสร้างแล้ว"
 court_events.3110.a.failure.tt: "โครงการก่อสร้างล้มเหลว"
 court_events.3110.b.success: "ท่านพบข้ออ้างที่สมบูรณ์แบบ"
 court_events.3110.b.success.tt: "[vassal.GetShortUINameNoTooltip] จ่ายเงิน"
 court_events.3110.b.failure: "ตำแหน่งของ [vassal.GetTitleAsNamePossessiveNoTooltip] ไม่มีที่ติ"
 court_events.3110.b.failure.tt: "[vassal.GetShortUINameNoTooltip] ไม่มีความผิด"
 court_events.3115.desc: "[relative.Custom2('MyCharacterIntroduction', ROOT.Char)|U] เข้ามาหาข้า ความกังวลปรากฏบนใบหน้าของ[relative.GetHerHis] "ข้านำข่าวร้ายมาแจ้ง"\n\n"ตระกูล [vassal.GetHouse.GetBaseName] ภายใต้การนำของ [vassal.GetTitledFirstName] ได้ขยายคฤหาสน์ของตระกูลเพื่อสะท้อนอำนาจและความร่ำรวยเกินความคาดหมายของเรา จนคฤหาสน์ของเราเองดูด้อยกว่าเมื่อเปรียบเทียบ!"\n\nเราต้องทำอะไรสักอย่าง และต้องเร็วด้วย หากเราต้องการรักษาหน้า!""
 # I Could Do Better!
 court_events.3120.t: "ข้าทำได้ดีกว่านี้!"
 court_events.3120.desc: "[inspired.Custom2('MyCharacterIntroduction', ROOT.Char)|U] จ้องมอง [artifact.GetName] ของข้ามานานจนน่าอึดอัดแล้ว สีหน้าเจ็บปวดของ[inspired.GetHerHis]ไม่ส่อแววดีเลย\n\n"มีอะไร, [inspired.GetFirstNameNoTooltip]?! พูดมา!" ในที่สุดข้าก็ระเบิดอารมณ์ออกมา\n\n"ขออภัย, [ROOT.Char.Custom('FormOfAddressForLiege')], ข้าไม่ได้ตั้งใจจะรบกวนท่าน เพียง แต่ว่า [artifact.GetType] ชิ้นนี้มันช่าง... #EMP ฝีมือสมัครเล่น?#! ไม่ขัดเกลา, ไม่ประณีต, #EMP ดูไร้ราคา!#! [ROOT.Char.GetTitleAsNameNoTooltip] ระดับท่านสมควรได้รับสิ่งที่ดีกว่านี้! #EMP ข้า#! น่าจะสร้างสิ่งที่ยอดเยี่ยมกว่านี้ได้...""
 court_events.3120.a: "ถ้า เช่นนั้นก็ ทำให้มันดีขึ้นเดี๋ยวนี้ [inspired.GetFirstNameNoTooltip] ข้าเชื่อใจเจ้า"
 court_events.3120.b: "จงมุ่งเน้นไปที่การสร้างสรรค์ของเจ้าเอง!"
 court_events.3120.c: "แสดงให้ข้าเห็นว่าเจ้ายังทำได้ดีกว่านี้!"
 court_events.3120.d: "อย่าลำบากเลย"
