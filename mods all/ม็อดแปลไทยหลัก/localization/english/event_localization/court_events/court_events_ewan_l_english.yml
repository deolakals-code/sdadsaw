l_english: 
 ##################################################
 # #Misc

 ##################################################
 # PATRONAGE
 court.2001.t:0 "การประจบประแจงแข่งขันกัน"
 court.2001.desc:0 "ทั้ง [crony_a.GetFirstName] และ [crony_b.GetFirstName] ไม่ทันสังเกตขณะที่ข้าค่อย ๆ ย่องเข้าไปใกล้การสนทนาอันอึกทึกในโถงทางเดินของพวกเขา\n\n"#EMP การยอมจำนนทางกายภาพ#! คือกุญแจสำคัญ! ทุกรอยช้ำจากการคุกเข่าบนเข่าของข้าคือเหรียญใหม่ในกระเป๋าเงินของข้า! เจ้าไม่มีทางพลาดได้เลยกับการหมอบกราบ"\n\n"ไร้สาระ แค่เติมคำคุณศัพท์ซ้อน ๆ กันหน้าตำแหน่งของ [ROOT.Char.GetHerHis] แล้วเจ้าจะร่ำรวยไปจนตาย หากเจ้ายังมีลมหายใจก่อนที่จะไปถึง '[ROOT.Char.GetTitleAsNameNoTooltip]' แสดงว่าเจ้าทำผิดแล้ว"\n\nข้ากระแอม ทำให้พวกประจบสอพลอที่ตกใจกลัวเงียบกริบทันที"
 court.2001.a:0 "ตามจริงแล้ว พวกเจ้าทั้งสองน่าจะพยายามให้มากกว่านี้"
 court.2001.a.sadistic:0 "ใครก็ตามที่โค้งคำนับต่ำที่สุดจะได้เหรียญ #EMP แวววาว#! นี้ไป ไปได้"
 court.2001.a.sadistic.crony_a_wins:0 "[crony_a.GetFirstNameNoTooltip] โค้งคำนับต่ำที่สุด"
 court.2001.a.sadistic.crony_b_wins:0 "[crony_b.GetFirstNameNoTooltip] โค้งคำนับต่ำที่สุด"
 court.2001.b:0 "ข้ามองทะลุเล่ห์เหลี่ยมของพวกเจ้าแล้ว เหล่าข้ารับใช้!"
 court.2001.c:0 "ข้าคิดว่าพวกเจ้ากำลังพลาดหนทางที่ชัดเจนที่สุดสู่หัวใจของข้า..."
 court.2001.d:0 "เรื่องนี้ต่ำชั้นเกินไปสำหรับข้า"

 ##################################################
 # MAJESTY
 court.2201.t:0 "ส่วนแบ่งผลประโยชน์"
 court.2201.desc:0 ""-เป็นของข้า! การแบ่ง [ROOT.Char.GetPrimaryTitle.GetNameNoTier] ให้กับทายาท แต่ละคนนั้นไร้เหตุผล!" [eldest_heir.GetFirstName] ร้องตะโกนขณะที่[eldest_heir.GetSheHe]และ [younger_heir.Custom2('HerHisCharacterIntroduction', eldest_heir)] ทะเลาะวิวาทกันเสียงดังอยู่อีกฟากหนึ่งของห้อง "เรากำลัง ทำให้อาณาจักรต้องเผชิญกับการฆาตกรรมและสงครามกลางเมือง [ROOT.Char.GetMotherFather|U] ควรยกดินแดนทั้งหมดของ[ROOT.Char.GetHerHis]ให้ #EMP ข้า#!!"\n\n"ฆาตกรรม? สงครามกลางเมือง? เจ้าวางแผน #EMP อะไร#! กันแน่สำหรับตอนที่เจ้าเป็น [ROOT.Char.GetTitleAsNameNoTooltip]?" [younger_heir.GetFirstNameNoTooltip] แค่นเสียง "เจ้าจะเป็นผู้ปกครองที่โหดร้ายอย่างที่สุดหากนี่คือวิธีที่เจ้าคิดเกี่ยวกับครอบครัวของตัวเองก่อนที่มงกุฎจะ #EMP สัมผัส#! กะโหลกอันน่าเกลียดของเจ้าเสียอีก"\n\nศีรษะข้าปวดตุบๆ พวกเขาเถียงกัน ตลอด ทั้ง เช้า"
 court.2201.a:0 "มีสิทธิ์ได้ #EMP มากกว่า#! งั้นหรือ [eldest_heir.GetFirstNameNoTooltip]? เอาเป็น #EMP ไม่ได้อะไรเลย#! ดีไหม!!"
 court.2201.b:0 "น่าเศร้าที่ต้องบอกว่า นั่นเป็นเพียงกฎของเกม [younger_heir.GetFirstNameNoTooltip]..."
 court.2201.c:0 "พวกเขาเป็นครอบครัว พวกเขาจะเข้ากันได้ #EMP ดี#! โดยไม่มีข้า ใช่ไหม?"
 court.2201.d:0 "ลูกๆ เจ้าอยากรู้ความหมายที่แท้จริงของครอบครัวหรือไม่?"

 ##################################################
 # FOREIGN GUESTS
 court.2401.t:0 "ความหรูหรามือสอง"
 court.2401.desc:1 ""อาภรณ์ชั้นเลิศที่สุดในแผ่นดิน ใต้เท้า [ROOT.Char.GetTitleAsNameNoTooltip] ที่ดี ส่วนใหญ่เป็น เพราะมัน #EMP ไม่ได้#! มาจากแผ่นดินนี้" [seller.GetFirstName] หัวเราะหึๆ ขณะที่ข้าเดินผ่านห้องที่เปิดอยู่ของ[seller.GetHerHis] [seller.GetHerHis|U] น้ำเสียงเปี่ยมไปด้วยเสน่ห์และความเจ้าเล่ห์\n\n"เกือบใหม่ ดีเหมือนใหม่ และสดใหม่จากผู้นำเทรนด์ในราชสำนักของ [grander_ruler.GetTitledFirstNamePossessive]! นี่คือสิ่งที่ #EMP ทุกคน#! ใน [grander_ruler.GetPrimaryTitle.GetName] จะสวมใส่ในฤดูกาลหน้า""
 court.2401.a:0 "โอ้โห พวกนั้น #EMP ดู#! น่าดึงดูดใจจริงๆ..."
 court.2401.b:0 "เราไม่ต้องการเรื่องไร้สาระจากต่างแดนในราชสำนักของข้า!"
 court.2401.c:0 "ใครจะสนว่าคนอื่นใส่อะไร?"

 court.2411.t:0 "โถงทางเดินวกวน"
 court.2411.desc:1 "การเดินเล่นของข้านำข้าผ่านปีกวังที่ไม่ได้ใช้งาน สำรวจห้องพักที่กว้างขวาง (แม้จะเต็มไปด้วยฝุ่น) ซึ่งพนักงานที่ทำงานหนักเกินไปของข้าไม่ค่อยได้มาเยือน เมื่อข้าได้ยินเสียงสะอื้นไห้ดังมาจากทางเดินข้าง ๆ\n\nเมื่อเข้าไปตรวจสอบ ข้าพบ [lost_guest.Custom2('MyCharacterIntroduction', ROOT.Char)] ล้มลงด้วยความสิ้นหวัง [lost_guest.GetSheHe|U] พรวดพราดขึ้นทันทีที่ [lost_guest.GetSheHe] เห็นข้า จับไหล่ข้า และเริ่มพูดพล่ามเหมือนคนบ้า [lost_guest.GetWomanMan]\n\n"[ROOT.Char.GetTitleAsNameNoTooltip] ข้าหลงอยู่ในทางเดินเหล่านี้มา #EMP สามวัน#!! ข้าหาทางออกไม่เจอ มี แต่ทางเดินที่เชื่อมต่อกันเป็นวงไม่มีที่สิ้นสุดและห้องที่ผุพังโดยไม่มีคนรับใช้ให้เห็นเลย!""
 court.2411.a:1 "ด้วยนามแห่ง [ROOT.Char.GetFaith.HighGodName] ให้ข้าแสดงทางออกให้เจ้า!"
 court.2411.b:0 "เป็นไปได้อย่างไร... เจ้าช่าง #EMP โง่เขลา#! ได้ถึงเพียงนี้?"
 court.2411.c:1 "*ผิวปาก* ช่างเป็นโถงทางเดินที่ซับซ้อนราวรังผึ้งที่ข้ามี..."

