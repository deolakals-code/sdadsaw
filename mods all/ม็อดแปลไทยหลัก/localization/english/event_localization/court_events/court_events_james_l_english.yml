l_english: 
 court.0101.t:0 "คนชั้นต่ำในราชสำนัก"
 court.0101.desc.opening:1 "นักโทษนาม [lowborn_criminal.GetName] ถูกนำตัวมาต่อหน้า [executioner.GetName] ด้วยข้อหา"
 court.0101.desc.murderer:0 "ฆาตกรรมอันน่าสะพรึงกลัว!\n\n"
 court.0101.desc.deviant:0 "การกระทำเยี่ยงเดรัจฉานและความชั่วร้ายอันไม่บริสุทธิ์!\n\n"
 court.0101.desc.witch:0 "การกระทำอันชั่วร้ายและอาชญากรรมต่อ [lowborn_criminal.GetFaith.HighGodName]!\n\n"
 court.0101.desc.lazy:0 "ไม่เชื่อฟังคำสั่งของนายของ [lowborn_criminal.GetHerHis] ในฐานะเด็กฝึกงานของช่างก่อสร้างหมู่บ้าน [lowborn_criminal.GetName] ถูกกล่าวหาว่าเถียงนายของ [lowborn_criminal.GetHerHis] ไม่เชื่อฟังคำสั่ง และถึงกับท้าทายความเชี่ยวชาญของนายของ [lowborn_criminal.GetHerHis]"
 court.0101.desc.thief:0 "ข้อหาลักทรัพย์หลายกระทงทั่วทั้งอาณาจักร\n\n คนชั้นต่ำผู้นี้ได้รีดเลือดอาณาจักร [ROOT.Char.GetPrimaryTitle.GetName] อันยิ่งใหญ่นี้จนแห้งเหือดด้วยการยักยอกทรัพย์สินของราชสำนัก เช่น ขนมปัง ผัก และแม้กระทั่งเสื้อผ้าของ [lowborn_criminal.GetHerHis] ทั้งหมด!"
 court.0101.desc.sumptuary:0 "ละเมิดกฎหมายควบคุมการ แต่งกายของ [ROOT.Char.GetTitleAsNameNoTooltip]\n\n [lowborn_criminal.GetSheHe] ได้สวมใส่ผ้าที่ฉูดฉาดและน่าเกลียดสารพัดชนิดและเสื้อผ้าที่ไม่เข้าชุดกัน นี่เป็นมากกว่าอาชญากรรมต่อ [ROOT.Char.GetTitleAsNameNoTooltip] แต่มันคืออาชญากรรมต่อความเหมาะสมอันดีงาม"
 court.0101.desc.cannibal:0 "[lowborn_criminal.GetName] และครอบครัวของ [lowborn_criminal.GetHerHis] อาศัยอยู่ในถ้ำใกล้ [ROOT.Char.GetCapitalLocation.GetTitle.GetNameNoTierNoTooltip] ล่อลวงนักเดินทางด้วยสัญญาว่าจะให้ที่พักและอาหาร เชื่อกันว่าครอบครัวของ [lowborn_criminal.GetHerHis|U] ได้กินเนื้อนักเดินทางไปแล้วกว่าพันคนด้วยวิธีนี้ และชาวเมือง [ROOT.Char.GetCapitalLocation.GetTitle.GetNameNoTierNoTooltip] เรียกร้องความยุติธรรม"
 court.0101.desc.sadistic:0 "อาชญากรผู้นี้เชือดคอเจ้าของโรงสีและปล้นบ้านของเขา ยิ่งไปกว่านั้น [lowborn_criminal.GetSheHe] ยังบังคับให้ภรรยาของเจ้าของโรงสีทำไข่ให้ [lowborn_criminal.GetHerHim] ซึ่ง [lowborn_criminal.GetSheHe] ก็กินไข่นั้นจากร่างของเจ้าของโรงสีผู้ล่วงลับไปแล้ว ขณะบังคับให้ภรรยาเข้าร่วมกับ [lowborn_criminal.GetHerHim]"
 court.0101.desc.priest:0 "[lowborn_criminal.GetFaith.PriestNeuter] นาม [lowborn_criminal.GetName] ได้สังหารสมาชิกในกลุ่มศาสนิกชนของ [lowborn_criminal.GetHerHis] เอง คนชั่วช้านี้พยายามขออภัยโทษสำหรับอาชญากรรมของ [lowborn_criminal.GetHerHis] จากทางการ [lowborn_criminal.GetFaith.GetAdjective] แต่ทหารหลวงจับ [lowborn_criminal.GetHerHim] ได้ขณะกลับเข้ามาใน [ROOT.Char.GetCapitalLocation.GetTitle.GetNameNoTierNoTooltip] และจับกุม [lowborn_criminal.GetFaith.PriestNeuter] ผู้ชั่วร้ายนี้ทันที"
 court.0101.desc.stableboy:1 "[lowborn_criminal.GetName] ถูกจับได้ขณะกำลังกระทำการลามกกับ [lowborn_criminal.Custom('servant_for_romance')] ของราชวงศ์ ไม่เพียง แต่เป็นการนอกใจเท่านั้น แต่มันยังเป็นการดูหมิ่นเกียรติยศของตระกูล [ROOT.Char.GetHouse.GetBaseNameNoTooltip]!"
 court.0101.desc.kinky:0 "[lowborn_criminal.GetName] ถูกพบในสภาพถูกล่ามโซ่ติดกับเสา เนื้อตัวอาบไปด้วยข้าวต้มตั้งแต่หัวจรดเท้า พร้อมอุปกรณ์น่าเกลียดติดอยู่ที่อวัยวะเพศของ [lowborn_criminal.GetHerHis] บาดแผลบนร่างกายของ [lowborn_criminal.GetHerHis] บ่งชี้ถึงการบาดเจ็บเพื่อความสุข และนักโทษดูเหมือนจะไม่ละอายใจต่อความปรารถนาผิดธรรมชาติของ [lowborn_criminal.GetHerHis] เลยแม้ แต่น้อย"
 court.0101.desc.animals:1 "นักโทษถูกจับได้ขณะกำลังกระทำการอันไม่บริสุทธิ์กับสมาชิกในฝูงปศุสัตว์ของ [lowborn_criminal.GetHerHis] ม้า และรังผึ้ง การกระทำอันเบี่ยงเบน เช่นนี้ขัดต่อพระประสงค์ของ [lowborn_criminal.GetFaith.HighGodName] และเป็นอาชญากรรมไม่เพียงต่อธรรมชาติ แต่ยังต่อความเหมาะสมและความรู้สึกผิดชอบชั่วดี!"
 court.0101.desc.baby_soup:0 "[lowborn_criminal.GetName] ถูกชาวบ้านใน [ROOT.Char.GetCapitalLocation.GetTitle.GetNameNoTierNoTooltip] รายงานถึงการกระทำอันน่าสะพรึงกลัวในการต้มลูกแรกเกิดของ [lowborn_criminal.GetHerHis] เองทั้งเป็นพร้อมกับสมุนไพรและผักบางชนิด การกระทำเยี่ยงเดรัจฉานนี้เป็นความพยายามที่จะยืดอายุขัยของ [lowborn_criminal.GetHerHis] อย่างผิดธรรมชาติ!"
 court.0101.desc.suspicious_healer:1 "ในฐานะผู้รักษา [lowborn_criminal.GetName] ถูกกล่าวหาว่าใช้เวทมนตร์ชั่วร้ายเพื่อนำความตายมาสู่ผู้ป่วยและผู้สูงอายุใน [ROOT.Char.GetCapitalLocation.GetTitle.GetNameNoTierNoTooltip] การกระทำผิดของ [lowborn_criminal.GetName] มีมากเกินกว่าจะนับได้ ทำให้ [lowborn_criminal.GetHerHim] ได้รับฉายาว่า “ทูตแห่ง [lowborn_criminal.GetFaith.DeathDeityName]”"
 court.0101.desc.devil_worshiper:0 "แม้จะถูกคิดว่าเป็น [lowborn_criminal.GetWomanMan] ผู้เคร่งศาสนา [lowborn_criminal.GetName] กลับมีศาลเจ้าส่วนตัวอยู่ในที่พักอาศัยของตน แต่เมื่อตรวจสอบแล้วพบว่า [lowborn_criminal.GetSheHe] ไม่ได้บูชา [lowborn_criminal.GetFaith.HighGodName] แต่บูชา [lowborn_criminal.GetFaith.WitchGodName] และทำการบูชายัญอันไม่บริสุทธิ์ต่อ [lowborn_criminal.GetFaith.WitchGodHerHim]!"
 court.0101.desc.outro:1 "\n\n[executioner.GetName] ยืนกรานว่า [lowborn_criminal.GetSheHe] รู้สึกขยะแขยงคนบาปผู้นี้ เช่นเดียวกับทุกคน และถามท่านว่าควรจะทำอย่างไรกับบุคคลผู้ชั่วช้านี้"
 court.0101.a.cannibal:0 "สับทั้งครอบครัวให้สุนัขล่าเนื้อกิน"
 court.0101.a.sadistic:0 "ทรมานบนกงล้อสักสองสามรอบน่าจะ ทำให้พวกเขาสิ้นฤทธิ์"
 court.0101.a.priest.sky:0 "ให้แร้งจิกกินร่างของ [lowborn_criminal.GetHerHis]... ทั้งเป็น"
 court.0101.a.priest:0 "จัดการฝัง [lowborn_criminal.GetSheHe] อย่างเหมาะสม... ทั้งเป็น"
 court.0101.a.stableboy:0 "ตัดอวัยวะเพศของ [lowborn_criminal.GetHerHis] ออกแล้วโยนให้ม้ากิน"
 court.0101.a.kinky:0 "ให้เฆี่ยน [lowborn_criminal.GetHerHim] ต่อหน้าสาธารณชนจนตาย"
 court.0101.a.animals:0 "เผา [lowborn_criminal.GetHerHim] ทั้งเป็นพร้อมกับวัวของ [lowborn_criminal.GetHerHis]"
 court.0101.a.baby_soup:0 "โยน [lowborn_criminal.GetHerHim] ลงในหม้อต้มน้ำมันดิน"
 court.0101.a.suspicious_healer:0 "ให้ [lowborn_criminal.GetHerHim] ลองชิม “ยา” บางอย่างด้วย [lowborn_criminal.GetHerselfHimself]"
 court.0101.a.devil_worshiper:0 "บางทีเปลวไฟอาจช่วยให้ [lowborn_criminal.GetHerHim] รู้สึกใกล้ชิดกับ [lowborn_criminal.GetFaith.WitchGodMistressMaster] ของ [lowborn_criminal.GetHerHis] มากขึ้น"
 court.0101.a:0 "ทรมานจนตายคือคำตอบเดียว"
 court.0101.b:0 "จะทำอะไรกับพวกเขาก็ตามใจเจ้า"
 court.0101.c.deviant:1 "[lowborn_criminal.GetSheHe|U] ฟังดูเหมือน [lowborn_criminal.GetSheHe] รู้จักความสนุกดี!"
 court.0101.c.beastiality:1 "... #EMP และ#! ม้าด้วยรึ? [lowborn_criminal.GetSheHe|U] ช่างเป็นอัจฉริยะด้านความคิดสร้างสรรค์!"
 court.0101.c:0 "[lowborn_criminal.GetNameNoTooltip] รู้วิธีสนุกเสียจริง!"
 court.0101.d:0 "ขังพวกเขาไว้ ข้าจะตัดสินใจทีหลัง..."

 court.0102.t:0 "มลทินทางสังคมของการประหารชีวิต"
 court.0102.desc:0 "ข้าเห็น [executioner.Custom2('MyCharacterIntroduction', ROOT.Char)] นั่งด้วยสีหน้าเศร้าสร้อย และเมื่อข้าสอบถามว่าสิ่งใดกำลังรบกวนจิตใจอันมืดมนของ [executioner.GetHerHis] [executioner.GetSheHe] ก็ถอนหายใจ\n\n “ท่านเห็นไหม [ROOT.Char.GetLadyLord] ของข้า ทุกคืนข้าต้องเดินทางไกลออกไปนอก [ROOT.Char.GetCapitalLocation.GetTitle.GetNameNoTierNoTooltip] เพื่อไปนอน เพชฌฆาตไม่ได้รับอนุญาตให้อยู่ภายในเขตเมือง ไม่ใช่ว่าข้าไม่ชอบการทรมานหรืออะไรหรอกนะ มันแค่เหงาเมื่อเสียงเดียวที่ข้าได้ยินคือเสียงกรีดร้องของผู้ถูกสาปแช่ง”"
 court.0102.a:0 "นอนในปราสาทคืนนี้เถิด สหาย"
 court.0102.b:0 "มันเป็นชีวิตที่ยากลำบาก แต่บางคนก็ต้องใช้ชีวิต เช่นนั้น"
 court.0102.c:0 "ฮ่า! เจ้าไม่ควรค่าแก่ความเห็นใจไปกว่าหนูในท่อระบายน้ำของข้าหรอก!"
 court.0103.t:0 "โอกาสจากหลุมศพ"
 court.0103.desc.opening:1 "[executioner.Custom2('MyCharacterIntroduction', ROOT.Char)|U] ดึงดูดสายตาข้าในช่วงหลังมานี้ เนื่องจาก [executioner.GetSheHe] ดูเหมือนจะสวมใส่เสื้อผ้าที่แพงขึ้นเรื่อย ๆ และเดินกรีดกรายไปมาราวกับนกยูง\n\nเมื่อสอบถาม [executioner.GetSheHe] ก็ยิ้มให้ข้าเห็นฟันเหลือง ๆ และบอกข้าว่า [executioner.GetSheHe] ได้ยักยอกของมีค่าจากผู้ถูกสาปแช่ง"
 court.0103.desc.hair_and_teeth:0 "กิจการของ [executioner.GetHerHis|U] เกี่ยวข้องกับการขายปอยผมของนักโทษให้กับช่างทำตุ๊กตา ฟันให้กับผู้ที่ไม่มีฟัน และแม้กระทั่งลูกตาให้กับผู้ที่ฝึกฝนเวทมนตร์คาถา"
 court.0103.desc.jewelry:0 "[executioner.GetSheHe|U] สารภาพว่าขโมยเสื้อผ้าและเครื่องประดับจากผู้ถูกสาปแช่งและนำไปขาย ทำกำไรอย่างงามจากทรัพย์สินอันจำกัดที่เหลืออยู่ของผู้ที่อยู่ในคุกใต้ดิน [executioner.GetSheHe|U] ถึงกับขโมยของจากศพของผู้ที่เพิ่งเสียชีวิต!"
 court.0103.desc.meat:0 "[executioner.GetSheHe|U] ได้ชำแหละผู้ที่เพิ่งเสียชีวิตและขายเนื้อของพวกเขาในตลาดว่าเป็นเนื้อแปลกใหม่! [executioner.GetSheHe|U] อ้างว่านี่เป็นทางเลือกที่ดีกว่าการทำพิธีศพตามที่ได้รับอนุมัติ เนื่องจากผู้ถูกสาปแช่งไม่คู่ควรกับคำขอสุดท้าย เช่นนั้น"
 court.0103.desc.saint_bones:0 "[executioner.GetSheHe|U] ได้นำอวัยวะภายในออกจากกระดูกของนักโทษชั้นต่ำและขายพวกมันเป็นโบราณวัตถุปลอม หลอกลวงนักท่องเที่ยวชาวต่างชาติและนักบุญให้ซื้อสิ่งของเหล่านี้ราวกับว่าพวกมันเป็นกระดูกของนักบุญ!"
 court.0103.desc.outro:0 "\n\nเห็นได้ชัดว่า [executioner.GetSheHe] ได้ทำเงินก้อนโตจากกิจการนี้ โดยไม่สนใจว่าผู้อื่นจะคิดอย่างไรกับธุรกิจเยี่ยงเดรัจฉานของ [executioner.GetHerHis]"
 court.0103.a:0 "แบ่งส่วนให้ข้าด้วย แล้วข้าสัญญาว่าเจ้าจะได้นักโทษเพิ่ม!"
 court.0103.b:0 "การค้าอันน่าสยดสยองนี้ต้องจบลงเดี๋ยวนี้!"
 court.0103.c:0 "ข้าจะแสร้งทำเป็นว่าไม่ได้ยินเรื่องนั้น"

 court.0104.t:0 "ความหลงใหลอันไม่ดีต่อสุขภาพ"
 court.0104.desc:0 "“โอ้! โอ้! แล้วท่านทำอะไรต่อ?” ข้าได้ยินเสียงร่าเริงของเด็กในอุปถัมภ์อันเป็นที่รักของข้า, [morbid_child.GetName], ดังก้องไปทั่วโถงของ [ROOT.Char.GetCapitalLocation.GetTitle.GetNameNoTierNoTooltip]. ด้วยความประหลาดใจ ข้าเห็น [morbid_child.GetHerHim] เงยหน้ามอง [executioner.Custom2('MyCharacterIntroduction', ROOT.Char)] ด้วยความชื่นชมอย่างแปลกประหลาดที่ข้ายังไม่เคยเห็นในตัว [morbid_child.Custom('GirlBoy')] คนนี้ “ข้าจุดไฟแล้วหนูก็เริ่มขุดเข้าไปในอกของมันเพื่อหนี! สุดยอด มันร้องเหมือนนกไนติงเกลเลย!” เพชฌฆาตส่งเสียงร้องแหลมเยาะเย้ย สร้างความขบขันให้กับ [morbid_child.Custom('PetName')] [morbid_child.GetName] ของข้าเป็นอย่างมาก"
 court.0104.a:0 "น่าขันสิ้นดี! แล้วเกิดอะไรขึ้นต่อ?"
 court.0104.b:0 "ความหลงใหลอันน่าสยดสยองนี้ต้องจบลงเดี๋ยวนี้!"
 court.0104.c:0 "ข้าจะแสร้งทำเป็นว่าไม่ได้ยินอะไร"

 court.0106.t:0 "โรงละครมืดสำหรับกรรมมืด"
 court.0106.desc:0 "พลบค่ำในราชสำนัก เพชฌฆาตได้เดินโซซัดโซเซออกจากที่พักอันน่าหดหู่ของ [executioner.GetHerHis] และปรากฏตัว [executioner.GetHerselfHimself] ท่ามกลางแสงไฟจากคบเพลิงในราชสำนัก เลือดสดเปื้อนเสื้อผ้าขาดรุ่งริ่งของ [executioner.GetHerHis] และคีมสกปรกคู่หนึ่งหยดอยู่ในมือ “ [ROOT.Char.GetLadyLord] ของข้า หมู่นี้ข้ากำลังคิดอยู่ว่าจะ ทำให้พวกเขากรีดร้องได้ไกลแค่ไหน?”"
 court.0106.a:0 "ทำทุกอย่างเพื่อรีดคำสารภาพ"
 court.0106.b:0 "จงอ่อนโยนต่อวิญญาณอันน่าสงสารเหล่านี้"
 court.0106.c:0 "สิ่งที่เจ้าทำในสถานที่อันน่าสะพรึงกลัวนั้นเป็นเรื่องของเจ้า"

 court.0107.t:1 "[unruly_child.GetNameNoTooltip] ผู้สิ้นหวัง"
 court.0107.desc:1 "จากบัลลังก์ของข้า ข้าได้ยินเสียงร้องอันโหยหวนของ [unruly_child.Custom2('MyCharacterIntroduction', ROOT.Char)] และเสียงการต่อสู้ ข้ารีบลุกขึ้นและวิ่งไปตามโถงทางเดินทันที ข้าหยุดกะทันหันเมื่อเห็น [tutor.Custom2('MyCharacterIntroduction', ROOT.Char)] กำลังจับตัว [unruly_child.Custom('GetLassLad')] ผู้น่าสงสารไว้ด้วยแขนข้างหนึ่งและกอดหนังสือไว้ด้วยแขนอีกข้างอย่างงุ่มง่าม\n\nข้าแทบไม่มีเวลาตะคอกถามคำอธิบายเมื่อทั้งคู่เริ่มโพล่งเรื่องราวในมุมมองของตนออกมา\n\n"[unruly_child.GetTitledFirstNameNoTooltip] ปฏิเสธที่จะให้ข้าอ่านผลงานชิ้นเอกของข้าเกี่ยวกับศิลปะแห่ง [tutor.Custom('GetTutorEducation')] ให้ [unruly_child.GetHerHim] ฟัง!" อาจารย์ร้อง\n\n"ข้าได้ยินหนังสือที่น่าเบื่อนี่มาเป็นพันครั้งแล้ว!" [unruly_child.GetNameNoTooltip] ประท้วง "มัน #EMP น่าเบื่อมาก!#!""
 court.0107.a:1 "[unruly_child.GetNameNoTooltip], จงเชื่อว่า [tutor.GetNameNoTooltip] รู้ดีที่สุด"
 court.0107.a.tt.1: "มีโอกาสที่การศึกษาของ [unruly_child.GetShortUINamePossessiveNoTooltip] จะดีขึ้น"
 court.0107.a.tt.2: "[tutor.GetShortUINameNoTooltip] จะทำงานหนักยิ่งขึ้นในฐานะ [GetCourtPositionType('court_tutor_court_position').GetName()]"
 court.0107.b:1 "หนังสือเล่มนี้น่าสนใจ บางทีข้าอาจจะซื้อมันจากท่านได้?"
 court_position_liege_support: "การสนับสนุนจากเจ้าเหนือหัว"
 court.0107.b.tt:0 "ท่านได้รับโบราณวัตถุหนังสือ"
 court.0107.c:1 "บางที [unruly_child.Custom('GetLassLad')] ควรเรียนรู้อย่างอื่น..."
 buy_book_artifact:0 "ท่านได้รับ [court_artifact|E] หนังสือ"

 court.0108.t:0 "ข้าราชบริพารผู้ตระการตา"
 court.0108.desc:1 "อ้างว่าเป็นผู้ลี้ภัยจากดินแดนอันไกลโพ้น [foreign_prince.Custom('GetPrincessPrince')] [foreign_prince.GetName] ได้ปรากฏตัวในราชสำนักพร้อมกับสัตว์แปลก ๆ มากมาย และได้ทำการกุศลอันน่าทึ่งไปทั่วท้องถนนของ [ROOT.Char.GetCapitalLocation.GetTitle.GetNameNoTierNoTooltip] แล้ว\n\nชาวต่างชาติผู้มั่งคั่งอย่างมหาศาลได้ประกาศเจตจำนงของ [foreign_prince.GetHerHis] ที่จะ แต่งงานกับ [available_child.Custom2('MyCharacterIntroduction', ROOT.Char)]!\n\nแม้ว่าราชสำนักจะเต็มไปด้วยความกระตือรือร้นต่อ [foreign_prince.Custom('GetPrincessPrince')] ผู้แปลกใหม่นี้ แต่ไม่ใช่ทุกคนที่จะเชื่อ [sceptical_courtier.Custom2('MyCharacterIntroduction', ROOT.Char)|U] อ้างว่าไม่เคยได้ยินชื่อดินแดนอันไกลโพ้นที่ชาวต่างชาติอ้างว่าเป็นบ้านเกิดและหาไม่พบบนแผนที่ใด ๆ\n\n[sceptical_courtier.GetSheHe|U] พร้อมกับผู้ติดตามที่มีความคิดเห็นคล้ายกันอีกหลายคน ได้ประณาม [foreign_prince.Custom('GetPrincessPrince')] [foreign_prince.GetName] ว่าเป็นคนลวงโลกและยืนกรานว่าเราต้องลงโทษ [foreign_prince.GetHerHim] ฐานพยายามหลอกลวง [available_child.GetName] ให้ แต่งงานกับ #EMP คนชั้นต่ำ#!."
 court.0108.a:1 "อย่าทำตัวเป็นคนขัดคอเลย, [sceptical_courtier.GetNameNoTooltip]. พวกเขาจะ แต่งงานกันในตอนเช้า!"
 court.0108.b:1 "[sceptical_courtier.GetNameNoTooltip] พูดถูก! จับ [foreign_prince.GetHerHim] ไปขังคุก!"
 court.0108.c:1 "ขอบคุณสำหรับการมาเยือน, [foreign_prince.Custom('GetPrincessPrince')] [foreign_prince.GetFirstNameNoTooltip], แต่ท่านควรจะไปได้แล้ว"

 court.0109.t:0 "ผู้เชี่ยวชาญด้านกายวิภาคศาสตร์"
 court.0109.desc:1 "ขณะที่ข้าเดินไปมาในราชสำนัก ข้าได้ยิน [executioner.Custom2('MyCharacterIntroduction', ROOT.Char)] กำลังสนทนากับ [learned_courtier.Custom2('MyCharacterIntroduction', ROOT.Char)] เกี่ยวกับธรรมชาติของการรักษาและยา [executioner.GetSheHe|U] ดูเหมือนจะคุ้นเคยกับการทำงานของร่างกายมนุษย์อย่างน่าทึ่ง\n\n"เจ้าไม่ได้ใช้เวลาทั้งวันผ่าร่างคนโดยไม่ได้เรียนรู้อะไรเลยเกี่ยวกับการทำงานของสิ่งสร้างของ [executioner.GetFaith.HighGodNamePossessive] เอง" [executioner.GetSheHe|U] กล่าวหลังจากอธิบายวิธีใช้ปลิงเพื่อล้างความเน่าเสียออกจากบาดแผลที่ติดเชื้อ\n\nดูเหมือนว่า [executioner.GetNameNoTooltip] ได้ใช้ความเชี่ยวชาญด้านกายวิภาคศาสตร์มนุษย์ของ [executioner.GetHerHis] เพื่อช่วยเหลือชาวบ้านใน [ROOT.Char.GetCapitalLocation.GetTitle.GetNameNoTierNoTooltip] และแม้กระทั่งคนชั้นต่ำในคุกใต้ดินของข้า"
 court.0109.a:0 "เจ้าเสียเปล่าในฐานะเพชฌฆาต! มาเป็นแพทย์หลวงของข้าเถิด!"
 court.0109.b:0 "อย่าเสียเวลาไปกับการรักษาคนชั้นต่ำเหล่านี้!"
 court.0109.c:0 "น่าสนใจ บางทีท่านอาจสอนวิธีการบางอย่างของท่านให้ข้าได้"
 court.0109.d:0 "ทำได้ดีมาก! จงรับใช้ผู้ป่วยและผู้ขัดสนใน [ROOT.Char.GetCapitalLocation.GetTitle.GetNameNoTierNoTooltip] ต่อไป"

 court.0110.t:0 "การบรรยายเรื่องตัณหาราคะ"
 court.0110.desc.intro:0 "ข้ากำลังเดินกรีดกรายไปมาในราชสำนัก พึงพอใจกับอีกคืนที่เต็มไปด้วยตัณหาและความหลงใหล เมื่อข้าพบว่าตัวเองถูก [parent.Custom2('MyCharacterIntroduction', ROOT.Char)] และ [chaplain.Custom2('MyCharacterIntroduction', ROOT.Char)] ต้อนจนมุม! พวกเขาทั้งคู่จ้องมองข้าด้วยสายตาที่อยู่กึ่งกลางระหว่างความขยะแขยง การล่าเหยื่อ และความกังวล\n"นี่มันหมายความว่าอย่างไร?" ข้าเรียกร้อง\n\n"
 court.0110.desc.deviant:1 ""โอ้ [ROOT.Char.Custom('GetDaughterSon')] ของข้า ข้ากังวลเรื่องจิตวิญญาณของเจ้ามาก ทุกคืนเจ้ากระทำการเยี่ยงเดรัจฉานที่อาจ ทำให้ [ROOT.Char.GetFaith.FertilityGodName] หันหน้าหนีด้วยความขยะแขยง""
 court.0110.desc.pox:0 ""เจ้ามีชู้รักมากกว่าที่สุนัขป่ามีเห็บ ข้าเกรงว่าซิฟิลิสอาจไม่ใช่สิ่งเดียวที่เปรอะเปื้อนร่างกายของเจ้าเมื่อตัณหาของเจ้าได้รับการสนอง""
 court.0110.desc.notspecial:0 ""ร่างกายของเจ้าคือวิหาร แต่เจ้ากลับปฏิบัติต่อมันเหมือนซ่องโสเภณี! จะมีชู้รักมากพอที่จะเติมเต็มช่องว่างที่ควรจะเป็นจิตวิญญาณของเจ้าได้หรือไม่?""
 court.0110.desc.outro:0 "[parent.GetMotherFather] ของข้าตำหนิข้าโดยไม่รู้สึกผิดเลยแม้ แต่น้อย\n\n"ทุกคืนที่เจ้ามัว แต่เพลิดเพลินกับความสุขทางโลกเหล่านี้ เจ้ากำลังก้าวเข้าใกล้ [ROOT.Char.GetFaith.NegativeAfterLife] มากขึ้น!" [chaplain.GetNameNoTooltip] เสริม "เราเผชิญหน้ากับเจ้าตอนนี้เพื่อช่วยจิตวิญญาณของเจ้า ลูกรัก จำเป็นต้องมีคำปฏิญาณว่าจะถือพรหมจรรย์ เพียงเท่านี้และไม่มีอะไรน้อยไปกว่านี้ที่จะช่วยจิตวิญญาณของเจ้าให้รอดพ้นจากความทรมานชั่วนิรันดร์ได้""
 court.0110.a:0 "ช่างอวดดีเสียจริง! จับไปขังคุก!"
 court.0110.b:0 "ท่านพูดถูก ข้ากลัวต่อจิตวิญญาณอมตะของข้า"
 court.0110.c:0 "ข้าจะไม่ยอมถูกกักขังทางกามารมณ์!"

 court.0111.t:0 "วัตถุมงคลแห่งการแก้แค้น"
 court.0111.desc:1 "ขณะที่ข้ากำลังเดินชมราชสำนัก ข้าบังเอิญไปพบกับการถกเถียงอย่างเผ็ดร้อนระหว่าง [executioner.Custom2('MyCharacterIntroduction', ROOT.Char)] และ [antiquarian.Custom2('MyCharacterIntroduction', ROOT.Char)] เกี่ยวกับว่ากะโหลกของ [rival.Custom2('MyCharacterIntroduction', ROOT.Char)] จะเป็นสิ่งประดิษฐ์ที่เหมาะกับราชสำนักของข้าหรือไม่\n\n"อ่า นาย[ROOT.Char.GetLadyLord] ข้าอยากจะมอบกะโหลกของ [rival.GetTitledFirstNameNoTooltip] ให้ท่านเป็นของขวัญ หาก [rival.GetSheHe] ประสบกับจุดจบอันไม่คาดฝัน" [executioner.GetName] ถูมือที่เปื้อนเลือดของ [executioner.GetHerHis] ไปมาด้วยความยินดีราวกับเด็ก "หรือบางทีอาจจะนำฟันของ [rival.GetHerHis] มาร้อยเป็นสร้อยคอเก๋ๆ!"\n\n"[ROOT.Char.Custom('FormOfAddressForLiege')|U] ท่านคงไม่ประสงค์ให้ข้าพยายามปลอมแปลงวัตถุอันน่าสยดสยอง เช่นนี้ให้เป็นของสูงค่าที่คู่ควรแก่ราชสำนักหรอกนะ!" [antiquarian.GetTitledFirstNameNoTooltip] คัดค้าน "บางทีเจ้าตัวประหลาดนี่ควรจะอยู่ในคุกใต้ดินที่ ซึ่ง [executioner.GetSheHe] สมควรอยู่ และปล่อยเรื่องของโบราณวัตถุและของเก่าแก่ให้เป็นหน้าที่ของผู้เชี่ยวชาญเถิด""
 court.0111.a:0 "กะโหลกศีรษะของ [rival.GetHerHis|U] จะเป็นของแปลกที่น่าสนใจสำหรับเปิดตัวในงานเลี้ยง!"
 court.0111.b:0 "เป็นความคิดที่น่าขยะแขยงอย่างที่สุด"
 get_skull_artifact:0 "ท่านได้รับ [court_artifact|E] กะโหลกศีรษะ"

 court.0112.t:0 "ศพในตู้เสื้อผ้า"
 court.0112.desc:1 "ข้าพบว่าตัวเองกำลังสำรวจเข้าไปในตู้เสื้อผ้าอันหรูหราของข้า ด้วยความอยากรู้ว่ามีผ้าชั้นเลิศใดซ่อนอยู่ด้านหลังสุด ข้าพบถุงผ้าลายสก๊อตใบหนึ่งที่หนักกว่าใบอื่นมาก และเมื่อกรีดมันเปิดออก ข้าก็หงายหลังล้มลงทันทีที่กลิ่นเหม็นเน่ารุนแรงของซากศพโชยปะทะจมูก\n\nร่างของคนแปลกหน้า ที่เน่าเปื่อยบางส่วน แห้งกรัง และแช่อยู่ในหนองน้ำจากร่างของ [corpse.GetHerHis] เอง ค่อยๆ เผยออกมาให้ข้าเห็น\n\nข้ากรีดร้องราวกับทารก และราวกับถูกเรียกขานด้วยเสียงของข้า [guilty_courtier.Custom2('MyCharacterIntroduction', ROOT.Char)] ก็ปรากฏตัวที่ประตู พร้อมสีหน้าที่บ่งบอกถึงความรู้สึกผิดและความขยะแขยงฉายชัดบนใบหน้าของ [guilty_courtier.GetHerHis]\n\n"[ROOT.Char.Custom('FormOfAddressForLiege')|U] โปรดเชื่อข้าเถิดว่าข้ากำลังป้องกันตัว! [corpse.GetSheHe|U] บุกเข้ามาในห้องของท่าน และหากข้าไม่ลงมือ [corpse.GetName] คงจะฆ่าข้า หรือ [guilty_courtier.GetFaith.HighGodName] เท่านั้นที่รู้ว่าจะเกิดอะไรขึ้นอีก!"\n\n[guilty_courtier.GetNameNoTooltip] เต็มไปด้วยความเศร้าโศกอย่างชัดเจนจน [guilty_courtier.GetSheHe] สารภาพกับข้าทันทีโดยไม่ต้องคาดคั้น "ข้าขอร้องท่าน โปรดทำเป็นมองไม่เห็น แล้วข้าจะสั่งตัดอาภรณ์ให้ท่าน ซึ่งจะ ทำให้แม้ แต่ [ROOT.Char.GetTitleAsNameNoTooltip] ที่ร่ำรวยที่สุดยังต้องอิจฉาตาร้อน!""
 court.0112.a:0 "เขียวเหมือนศพนี่น่ะหรือ? ข้อตกลงที่ดี"
 court.0112.a.tt:0 "ท่านได้รับโบราณวัตถุเครื่องราชกกุธภัณฑ์"
 court.0112.b:0 "ในไม่ช้า ทั่วทั้ง [ROOT.Char.GetCapitalLocation.GetTitle.GetNameNoTierNoTooltip] จะรู้ว่าเจ้าทำอะไรลงไป!"
 court.0112.c:0 "อย่าพูดถึงเรื่องนี้อีกเลย"
 get_regalia_artifact:0 "ท่านได้รับ [artifact|E] เครื่องราชกกุธภัณฑ์"
