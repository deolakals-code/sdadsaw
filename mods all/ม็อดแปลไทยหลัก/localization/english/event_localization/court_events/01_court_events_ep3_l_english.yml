 employer_booner_master_of_hunt_1_modifier: "คำแนะนำการล่าสัตว์"
 employer_booner_master_of_hunt_1_modifier_desc: "พื้นที่ล่าสัตว์ของข้าหลวงของตัวละครนี้เป็นจุดสนใจหลักในพลังงานของนายพรานหลวงผู้มีทักษะ"
 employer_booner_master_of_hunt_2_modifier: "การดูแลสัตว์ป่าแบบใหม่"
 employer_booner_master_of_hunt_2_modifier_desc: "พื้นที่ล่าสัตว์ของตัวละครนี้เป็นจุดสนใจหลักในพลังงานของนายพรานหลวงผู้มีทักษะ\n[prestige_i|E][prestige|E] จาก [activity|E] [GetActivityType( 'activity_hunt' ).GetName]: #P +20%#!"
 employer_booner_master_of_hunt_3_modifier: "คำแนะนำแบบใหม่"
 employer_booner_master_of_hunt_3_modifier_desc: "พื้นที่ล่าสัตว์ของตัวละครนี้และข้าหลวงของพวกเขาเป็นจุดสนใจหลักในพลังงานของนายพรานหลวงผู้มีทักษะ\n[prestige_i|E][prestige|E] จาก [activity|E] [GetActivityType( 'activity_hunt' ).GetName]: #P +20%#!"
 # Royal Architect
 court.8200.t: "รากฐานที่มั่นคง"
 court.8200.desc: "ทักษะของ [GetCourtPositionType('royal_architect_court_position').GetName()] [position_holder.Custom('ComplimentAdjective')] ของข้า, [position_holder.GetTitledFirstNamePossessive], ได้รับการยกย่องอย่างมากในราชสำนัก — แม้ แต่งานซ่อมแซมที่ง่ายที่สุดก็ยังได้รับการจัดการด้วยความเอาใจใส่และแม่นยำ ซึ่งหาได้ยากใน [ROOT.Char.GetPrimaryTitle.GetNameNoTierNoTooltip] — หรือที่อื่นใดก็ตาม\n\n[position_holder.GetSheHe|U] ครุ่นคิดอย่างหนักในสัปดาห์ที่ผ่านมา, และในที่สุดก็แบ่งปันความกระวนกระวายใจของ [position_holder.GetHerHis]: "[ROOT.Char.Custom('FormOfAddressForLiege')|U], ในการทำงานของข้า ข้าสังเกตเห็นหนทางที่จะเพิ่มประสิทธิภาพโครงการก่อสร้างของท่าน, แต่ความพยายามของข้าอาจจะเป็นประโยชน์มากกว่าหากใช้ช่วยในการขยายหมู่บ้าน?""
 court.8200.a: "เจ้าคือสถาปนิก #EMP ของข้า#! "
 court.8200.b: "ดูแลความต้องการของประชาชน"
 court.8200.c: "[position_holder.GetWomanMan] ผู้มีพรสวรรค์สามารถทำได้ทั้งสองอย่าง"
 court.8200.c.success: "ท่านช่วย [position_holder.GetFirstNameNoTooltip]"
 court.8200.c.failure: "[position_holder.GetFirstNameNoTooltip] มีภาระมากเกินไป"
 employer_booner_royal_architect_1_modifier: "การประกอบที่มีประสิทธิภาพ"
 employer_booner_royal_architect_1_modifier_desc: "การก่อสร้างของตัวละครนี้เป็นจุดสนใจหลักในพลังงานของสถาปนิกหลวงผู้มีทักษะ"
 employer_booner_royal_architect_2_modifier: "การกำกับดูแลพลเรือน"
 employer_booner_royal_architect_2_modifier_desc: "หมู่บ้านของตัวละครนี้เป็นจุดสนใจหลักในพลังงานของสถาปนิกหลวงผู้มีทักษะ\nความคืบหน้าภารกิจ [councillor_task|E] เพิ่มการพัฒนาในเคาน์ตี: #P +10%#!"
 employer_booner_royal_architect_3_modifier: "การกำกับดูแลที่มีประสิทธิภาพ"
 employer_booner_royal_architect_3_modifier_desc: "การก่อสร้างและหมู่บ้านของตัวละครนี้เป็นจุดสนใจหลักในพลังงานของสถาปนิกหลวงผู้มีทักษะ\nความคืบหน้าภารกิจ [councillor_task|E] เพิ่มการพัฒนาในเคาน์ตี: #P +10%#!"
 # Cupbearer
 court.8201.t: "เจ้าแห่งจอก"
 court.8201.desc: "[GetCourtPositionType('cupbearer_court_position').GetName()] ผู้ [position_holder.Custom('ComplimentAdjective')] ของข้า [position_holder.GetTitledFirstName] เป็น [position_holder.GetWomanMan] ที่ไว้ใจได้ แบกรับความรับผิดชอบของ [position_holder.GetHerHis] ด้วยความมั่นใจอย่างมาก\n\nไม่เพียง แต่ [position_holder.GetSheHe] จะ ทำให้แน่ใจว่าถ้วยของข้าเต็มเปี่ยม แต่ยัง รวมถึงถ้วยของแขกและราชสำนักของข้าด้วย และเสมอด้วยรอยยิ้ม\n\nความกระตือรือร้นและความคล่องแคล่ว เช่นนี้หาได้ยาก [position_holder.GetSheHe] มีประโยชน์อย่างยิ่ง..."
 court.8201.a: "ปฏิบัติต่อผู้มาเยือนของข้าให้ดี [position_holder.GetFirstNameNoTooltip]"
 court.8201.b: "ดูแลคนรับใช้ของข้าให้อยู่ในมาตรฐาน"
 court.8201.c: "ข้าคาดหวังมาตรฐานการบริการสูงสุด"
 court.8201.c.success: "ท่านช่วย [position_holder.GetFirstNameNoTooltip]"
 court.8201.c.failure: "[position_holder.GetFirstNameNoTooltip] มีภาระมากเกินไป"
 employer_booner_cupbearer_1_modifier: "จอกที่เต็มเปี่ยม"
 employer_booner_cupbearer_1_modifier_desc: "ข้าหลวงของตัวละครนี้อยู่ภายใต้การดูแลอย่างใกล้ชิดของพนักงานเชิญพระสุธารสผู้มีทักษะ"
 employer_booner_cupbearer_2_modifier: "ความใส่ใจพิเศษ"
 employer_booner_cupbearer_2_modifier_desc: "คนรับใช้ของตัวละครนี้อยู่ภายใต้การดูแลอย่างใกล้ชิดของพนักงานเชิญพระสุธารสผู้มีทักษะ\nค่าบำรุงรักษา [court_amenity|E] คนรับใช้: #P -25%#!"
 employer_booner_cupbearer_3_modifier: "ความใส่ใจที่เต็มเปี่ยม"
 employer_booner_cupbearer_3_modifier_desc: "ข้าหลวงและคนรับใช้ของตัวละครนี้อยู่ภายใต้การดูแลอย่างใกล้ชิดของพนักงานเชิญพระสุธารสผู้มีทักษะ\nค่าบำรุงรักษา [court_amenity|E] คนรับใช้: #P -25%#!"
 # Lady-in-Waiting
 court.8203.t: "ดวงตาอยู่ทุกหนแห่ง"
 court.8203.desc: "[GetCourtPositionType('lady_in_waiting_court_position').GetName()] ผู้ [position_holder.Custom('ComplimentAdjective')] ของข้า [position_holder.GetTitledFirstName] ได้ปรับตัวเข้ากับบทบาทของ [position_holder.GetHerHis] ได้อย่างน่าชื่นชม ดูเหมือนจะสามารถคาดเดาทุกความต้องการของข้าได้\n\nยิ่งไปกว่านั้น [position_holder.GetSheHe] ไม่ปล่อยให้สิ่งใดหลุดรอดความสนใจของ [position_holder.GetHerHis] ในราชสำนัก ตั้งแต่เรื่องซุบซิบเล็กน้อยที่สุดไปจนถึงข่าวร้ายแรงที่สุด\n\n[position_holder.GetSheHe|U] อาจเป็นทรัพย์สินอันยิ่งใหญ่ หากพรสวรรค์เหล่านี้ได้รับการชี้นำ..."
 court.8203.a: "[position_holder.GetFirstNameNoTooltip] ข้าต้องการความช่วยเหลือจากเจ้า..."
 court.8203.b: "แม้ แต่เสียงกระซิบที่เงียบที่สุดก็ต้องไม่พลาด"
 court.8203.c: "ความลับและเสน่ห์ จงใช้สิ่งเหล่านี้เป็นอาวุธของเจ้า"
 court.8203.c.success: "ท่านช่วย [position_holder.GetFirstNameNoTooltip]"
