 # Caravan Master
 court.8197.t: "[position_holder.Custom('QueenKing')] แห่งท้องถนน"
 court.8197.desc: "[GetCourtPositionType('travel_leader_court_position').GetName()] ผู้ [position_holder.Custom('ComplimentAdjective')] ของข้า [position_holder.GetTitledFirstName] เป็นนักจัดการที่เชี่ยวชาญ: ตั้งแต่จ้าง [position_holder.GetHerHim] แม้ แต่การเดินทางเพียงเล็กน้อยก็ดูเหมือนจะเป็นภาพของความสะดวกสบายอย่างรวดเร็ว!\n\n[position_holder.GetSheHe|U] ยุ่งอยู่กับ [position_holder.GetHerselfHimself] ทั้งวันทั้งคืน เติมเสบียงและปรับปรุงกำหนดการเดินทางของ [ROOT.Char.GetPrimaryTitle.GetAdjectiveNoTooltip] ชั่วขณะหนึ่ง ข้าประหลาดใจ เมื่อ [position_holder.GetSheHe] ถามข้าอย่างจริงจังว่า: "[ROOT.Char.GetTitleAsNameNoTooltip] ของข้า สิ่งใดมีค่ามากกว่ากัน: เวลาของท่านหรือสุขภาพของท่าน?""
 court.8197.a: "ข้าแค่อยากไปถึงที่หมายอย่างปลอดภัย!"
 court.8197.b: "เราต้องไม่โอ้เอ้ ข้ามีเรื่องต้องทำมากเกินไป"
 court.8197.c: "ความปลอดภัยและเวลาของข้ามีค่าเท่ากัน!"
