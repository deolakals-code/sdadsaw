 employer_booner_lady_in_waiting_1_modifier: "การสนับสนุนทางศีลธรรม"
 employer_booner_lady_in_waiting_1_modifier_desc: "กลยุทธ์ทางสังคมของตัวละครนี้ได้รับคำแนะนำจากนางสนองพระโอษฐ์ผู้มีทักษะ"
 employer_booner_lady_in_waiting_2_modifier: "ผู้กระซิบในราชสำนัก"
 employer_booner_lady_in_waiting_2_modifier_desc: "การรวบรวมข่าวซุบซิบของตัวละครนี้ได้รับคำแนะนำจากนางสนองพระโอษฐ์ผู้มีทักษะ\nความคืบหน้าภารกิจ [councillor_task|E] ค้นหาความลับภายในอาณาจักร: #P +10#!"
 employer_booner_lady_in_waiting_3_modifier: "การสนับสนุนในราชสำนัก"
 employer_booner_lady_in_waiting_3_modifier_desc: "กลยุทธ์ทางสังคมและการรวบรวมข่าวซุบซิบของตัวละครนี้ได้รับคำแนะนำจากนางสนองพระโอษฐ์ผู้มีทักษะ\nความคืบหน้าภารกิจ [councillor_task|E] ค้นหาความลับภายในอาณาจักร: #P +10#!"
 # Food Taster
 court.8204.t: "มาตรวัดแห่งราชสำนัก"
 court.8204.desc: "ตัดสินจากรอยยิ้มและท้องที่ขยายใหญ่ขึ้นของ [position_holder.GetHerHis] [GetCourtPositionType('food_taster_court_position').GetName()] ผู้ [position_holder.Custom('ComplimentAdjective')] ของข้า [position_holder.GetTitledFirstName] ไม่ได้เกิดมาเพื่อสิ่งใดนอกจากอาหารค่ำของ [ROOT.Char.GetTitleAsNameNoTooltip]\n\n[position_holder.GetSheHe|U] ใช้เวลามากขึ้นเรื่อย ๆ ในครัว ชิมอาหารที่นำเสนอและให้คำแนะนำแก่พ่อครัว\n\nข้าควรใช้ประโยชน์จากความกระตือรือร้นที่หาได้ยากของ [position_holder.GetHerHis] สำหรับบทบาทที่ไม่ค่อยคุ้มค่านี้..."
 court.8204.a: "อย่าให้สิ่งใดเล็ดลอดสายตาของเจ้าไปได้ [position_holder.GetFirstNameNoTooltip]"
 court.8204.b: "ห้องครัวเป็นของเจ้าที่จะสั่งการ!"
 court.8204.c: "ข้าต้องการสายตาจับจ้องที่อาหาร #EMP และ#! พนักงาน"
 court.8204.c.success: "ท่านช่วย [position_holder.GetFirstNameNoTooltip]"
 court.8204.c.failure: "[position_holder.GetFirstNameNoTooltip] มีภาระมากเกินไป"
 employer_booner_food_taster_1_modifier: "การคัดกรองคนรับใช้"
 employer_booner_food_taster_1_modifier_desc: "คนรับใช้ของตัวละครนี้อยู่ภายใต้การดูแลอย่างใกล้ชิดของพนักงานชิมพระกระยาหารผู้มีทักษะ"
 employer_booner_food_taster_2_modifier: "เมนูที่ได้รับการอนุมัติ"
 employer_booner_food_taster_2_modifier_desc: "ห้องครัวของตัวละครนี้อยู่ภายใต้การดูแลอย่างใกล้ชิดของพนักงานชิมพระกระยาหารผู้มีทักษะ\nค่าบำรุงรักษา [court_amenity|E] อาหาร: #P -25%#!"
 employer_booner_food_taster_3_modifier: "เมนูที่ผ่านการคัดกรอง"
 employer_booner_food_taster_3_modifier_desc: "คนรับใช้และห้องครัวของตัวละครนี้อยู่ภายใต้การดูแลอย่างใกล้ชิดของพนักงานชิมพระกระยาหารผู้มีทักษะ\nค่าบำรุงรักษา [court_amenity|E] อาหาร: #P -25%#!"
 # Poor Holder
 court.8301.t: "ความคาดหวังที่ไม่สมหวัง"
 court.8301.intro: "หัวข้อเกี่ยวกับความเชี่ยวชาญอันกว้างขวาง หรือการขาดความเชี่ยวชาญ ของ [position_holder.GetHeldCourtPositionsString] ผู้เงอะงะของข้า [position_holder.GetFirstNamePossessive] ได้กลายเป็นเรื่องตลกขบขันที่เพิ่มมากขึ้น เมื่อพิจารณาดูแล้ว พรสวรรค์ของ[position_holder.GetHerHis]ก็ยังขาดอยู่มาก...\n\n"
 court.8301.detractor: "ผู้ที่วิจารณ์ [position_holder.GetHerHis] มากที่สุดคือ [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('detractor'))] ของข้า [detractor.GetTitledFirstName] ซึ่งไม่พยายามซ่อนความดูถูกของ[detractor.GetHerHis]เลย\n\n"
 court.8301.desc: ""มาเถิด ใต้เท้า" [position_holder.GetFirstName] พูดตะกุกตะกักท่ามกลางเสียงหัวเราะคิกคักของราชสำนัก หลังจากความเข้าใจอันสับสนของ[position_holder.GetHerHis]เกี่ยวกับ [position_holder.Custom('GetCourtPositionSubject')] ถูกเยาะเย้ยอย่างหนักอีกครั้ง "ข้า #EMP ทำ#! งานเก่งนะ... ม-ไม่ใช่หรือ?""
 court.8301.a: "มาคุยเรื่องค่าตอบแทนของเจ้ากันเถอะ [position_holder.GetFirstNameNoTooltip]..."
 court.8301.b: "ข้าคิดว่าถึงเวลาที่เจ้าจะก้าวลงจากตำแหน่งแล้ว"
 court.8301.c: "#weak *ถอนหายใจ*#! #EMP ใช่...#! เอ่อ ใช่! เจ้าเก่งมาก!"
