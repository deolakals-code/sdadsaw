 # Holder Improves
 court.8311.t: "เรียนรู้งาน"
 court.8311.desc: "แม้ว่าในตอนแรกจะมีความเข้าใจที่ไม่ค่อยดีนักเกี่ยวกับกลไกพื้นฐานที่สุดของ [position_holder.Custom('GetCourtPositionSubject')] แต่ [position_holder.GetHeldCourtPositionsString] ของข้า [position_holder.GetTitledFirstName] ดูเหมือนจะเริ่มเติบโตในบทบาทของ[position_holder.GetHerHis]แล้ว\n\nหลายคนในราชสำนักสังเกตเห็นความสามารถที่เพิ่มขึ้นของ[position_holder.GetHerHis] แม้ว่าจะยังค่อนข้างจำกัดก็ตาม อย่างน้อยที่สุดดูเหมือนว่า[position_holder.GetSheHe]พยายามอย่างแท้จริงที่จะหาเลี้ยงชีพของ[position_holder.GetHerHis]"
 court.8311.a: "ช่างน่ายินดีที่ได้เห็น เช่นนี้ [position_holder.GetFirstNameNoTooltip]!"
 bonus_aptitude_role_tt: "ความถนัด [position_holder.Custom('GetTargetCourtPosition')] [aptitude|E]: #P +[SCOPE.ScriptValue('cp_bonus_aptitude_value')]#!"
 cp_bonus_aptitude: "เรียนรู้งาน"
 # Salary Review
 court.8321.t: "แนวทางแครอท"
 court.8321.desc: "[position_holder.GetHeldCourtPositionsString] ของข้า, [position_holder.GetTitledFirstName] ได้ปรับตัวเข้ากับบทบาทของ[position_holder.GetHerHis]ได้บ้างแล้ว, แม้ว่าจะไม่ใช่โดยปราศจากปัญหาติดขัดในช่วงเริ่มต้นก็ตาม\n\n[position_holder.GetSheHe|U]ไม่ได้ปิดบังเลยว่า[position_holder.GetSheHe]คิดว่า[position_holder.GetSheHe]ควรได้รับรางวัลตอบแทนที่ดีกว่านี้ หาก[position_holder.GetSheHe]จะทุ่มเท[position_holder.GetHerselfHimself]ให้กับงานของ[position_holder.GetHerHis]อย่างแท้จริง\n\n"โธ่, [ROOT.Char.Custom('FormOfAddressForLiege')], ข้ากำลังรับใช้ [ROOT.Char.GetTitleAsNameNoTooltip] แห่ง [ROOT.Char.GetPrimaryTitle.GetBaseNameNoTierNoTooltip] อยู่นะ! ข้าไม่ควรได้รับอะไรมากกว่าเศษอาหารเหลือบนโต๊ะหรอกหรือ หากข้าจะต้องใช้เวลาทั้งวันหมกมุ่นอยู่กับ [position_holder.Custom('GetCourtPositionSubject')] เพื่อท่าน?""
 court.8321.a: "ตกลง แต่เจ้าควรจะ ทำให้คุ้มค่า"
 court.8321.b: "แล้วโบนัสเล็กน้อยล่ะ?"
 court.8321.b.success: "[position_holder.GetSheHe|U] รับข้อเสนอ"
 court.8321.b.failure: "[position_holder.GetSheHe|U] รู้สึกถูกดูหมิ่น"
 court.8321.c: "ตอนนี้ไม่มีเงินทุนเหลือพอ..."
