 # Hunt Master
 court.8199.t: "เจ้าแห่งพงไพร"
 court.8199.desc: "[GetCourtPositionType('master_of_hunt_court_position').GetName()] ผู้ [position_holder.Custom('ComplimentAdjective')] ของข้า [position_holder.GetTitledFirstName] ได้แสดงฝีมือของ [position_holder.GetHerselfHimself] อย่างยอดเยี่ยม และทุกคนต่างเห็นพ้องกันว่าสัตว์ป่าของ [ROOT.Char.GetPrimaryTitle.GetAdjectiveNoTooltip] ไม่เคยอุดมสมบูรณ์เท่านี้มาก่อน\n\nข้ายินดีที่เห็น [position_holder.GetHerHim] โผล่ศีรษะของ [position_holder.GetHerHis] เข้ามาในห้องบัลลังก์ของข้า สดชื่นจากป่าพร้อมคำถามเร่งด่วน: "[ROOT.Char.GetTitleAsNameNoTooltip] ของข้า ข้าหลวงบางคนของท่านได้ขอความช่วยเหลือจากข้าเกี่ยวกับสัตว์ป่าของพวกเขา แต่ข้าก็มีแผนที่จะปรับปรุงพื้นที่ล่าสัตว์ของท่านด้วย ข้าควรทำอย่างไรดี?""
 court.8199.a: "ทำให้ราษฎรของข้ามีความสุข"
 court.8199.b: "การปรับปรุง เจ้าว่าอย่างไรนะ?"
 court.8199.c: "ทำไมไม่ทำทั้งสองอย่างล่ะ?"
