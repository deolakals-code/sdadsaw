l_english: 
 # Court Position Boons
 employer_booner_invalidated_tt: "#weak ตัวปรับแต่งจะถูกลบออกหาก [position_holder.GetShortUIName|V] สูญเสีย [court_position|E] นี้ หรือไม่ได้อยู่ใน [court|E] เดียวกันกับ [THIS.Char.GetShortUIName|V]#!"
 employer_boon_target_invalidated_title: "ข้าราชสำนักสูญเสียคุณประโยชน์"
 employer_booner_invalidated_title: "สูญเสียคุณประโยชน์จากตำแหน่งในราชสำนัก"
 # Physician
 court.8190.t: "แพทย์หลวงผู้ประเสริฐ [position_holder.GetFirstNameNoTooltip]"
 court.8190.desc: "[GetCourtPositionType('court_physician_court_position').GetName()] ผู้ [position_holder.Custom('ComplimentAdjective')] ของข้า [position_holder.GetTitledFirstName] เป็นผู้เยียวยาที่แท้จริง พร้อมเสมอด้วยยาหรือยาทาที่เหมาะสมตั้งแต่เสียงพึมพำแรกของอาการป่วยเพียงเล็กน้อยของข้าราชสำนัก\n\nพรสวรรค์ของ [position_holder.GetHerHis|U] ดูเหมือนจะสูญเปล่าไป เมื่อ [position_holder.GetSheHe] ต้องดูแลรักษาผู้คนในราชสำนัก [ROOT.Char.GetPrimaryTitle.GetAdjectiveNoTooltip] ทั้งหมด ซึ่งเรียกร้องความสนใจอยู่เสมอ"
 court.8190.a: "ข้าต้องการการดูแลที่ใกล้ชิดกว่านี้"
 court.8190.b: "เจ้าจงดูแลทายาทของข้า [heir.GetFirstNameNoTooltip]"
 court.8190.c: "จงทุ่มเทความพยายามของเจ้าให้กับ [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('child'))] ของข้า [child.GetFirstNameNoTooltip]"
 court.8190.d: "[ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('spouse'))] ของข้า [spouse.GetFirstNameNoTooltip] น่าจะต้องการพรสวรรค์ของเจ้า"
 court.8190.e: "ดูแล [relation.GetFirstNameNoTooltip] ไปก่อน"
 court.8190.f: "[ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('family'))] ของข้า [family.GetFirstNameNoTooltip] คือผู้ป่วยสำคัญที่สุดของเจ้า"
 court.8190.g: "ดูแลข้อร้องเรียนของ [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('house'))] ของข้า [house.GetFirstNamePossessiveNoTooltip]"
 employer_booner_court_physician_modifier: "การดูแลใกล้ชิด"
 employer_booner_court_physician_modifier_desc: "ตัวละครนี้เป็นจุดสนใจหลักในพลังงานของ $court_physician_court_position$ ผู้มีทักษะ"
 # Tutor
 court.8191.t: "การสอนพิเศษ"
 court.8191.desc: "[GetCourtPositionType('court_tutor_court_position').GetName()] ผู้ [position_holder.Custom('ComplimentAdjective')] ของข้า [position_holder.GetTitledFirstName] เป็นครูผู้มีพรสวรรค์ จัดการกับเด็กซน ๆ ให้อยู่ในระเบียบอย่างชำนาญขณะที่ [position_holder.GetSheHe] ดูแลการศึกษาของพวกเขา\n\nความสนใจของ [position_holder.GetHerHis|U] ถูกแบ่งไปยังเด็ก ๆ ในราชสำนัก [ROOT.Char.GetPrimaryTitle.GetAdjectiveNoTooltip] แต่ก็มีที่ว่างสำหรับหนึ่งในนั้นที่จะได้รับการสอนพิเศษอย่างใกล้ชิดภายใต้การดูแลที่ไว้ใจได้ของ [position_holder.GetHerHis]"
 court.8191.a: "#EMP ข้า#! อยากเรียนรู้เพิ่มเติม!"
 court.8191.b: "[ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('heir'))] ของข้า [heir.GetFirstNameNoTooltip] อยู่ในลำดับสืบทอด ต้องมีความเฉลียวฉลาด"
 court.8191.c: "ข้าคิดว่า [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('struggling'))] ของข้า [struggling.GetFirstNameNoTooltip] ต้องการความช่วยเหลือ"
 court.8191.d: "เหตุใดไม่มุ่งเน้นไปที่ [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('hostage'))] ของข้า [hostage.GetFirstNameNoTooltip]?"
 court.8191.e: "[ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('interesting'))] ของข้า [interesting.GetFirstNameNoTooltip] น่าจะต้องการพรสวรรค์ของเจ้า"
 court.8191.f: "ดูแลการศึกษาของ [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('oldest'))] ของข้า [oldest.GetFirstNamePossessiveNoTooltip]"
 court.8191.g: "ถึงเวลาที่ [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('youngest'))] ของข้า [youngest.GetFirstNameNoTooltip] จะฝึกฝนปลายปากกาของ[youngest.GetHerHis]"
 court.8191.h: "มุ่งเน้นไปที่ [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('extra'))] ของข้า [extra.GetFirstNameNoTooltip]"
 court.8191.i: "[ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('bonus'))] ของข้า [bonus.GetFirstNameNoTooltip] จะได้รับประโยชน์สูงสุด"
 employer_booner_court_tutor_modifier: "การสอนพิเศษ"
 employer_booner_court_tutor_modifier_desc: "ตัวละครนี้เป็นจุดสนใจหลักในพลังงานของอาจารย์ผู้สอนในราชสำนักผู้มีทักษะ\nปรับปรุงผลลัพธ์ [education|E] ของ [child_possessive|E] นี้"
 # Seneschal
 court.8192.t: "ระเบียบอันเข้มงวด"
 court.8192.desc: "นับตั้งแต่การ แต่งตั้ง [position_holder.GetHerHis] ให้เป็น [GetCourtPositionType('seneschal_court_position').GetName()] ของข้า [position_holder.GetTitledFirstName] ก็เป็นผู้ที่ [position_holder.Custom('ComplimentAdjective')] อยู่เสมอ ทำให้ราชสำนักและครัวเรือนของข้าดำเนินไปอย่างราบรื่น\n\nขณะที่ข้ากำลังครุ่นคิดถึงการ แต่งตั้งที่ดีของข้า ข้าก็ได้ยินเสียงของ [position_holder.GetHerHis] จากด้านหลัง: "[position_holder.Custom2('RelationToMeShort', ROOT.Char)|U] ข้าพบว่ามีช่องทางประหยัดมากมายใน [ROOT.Char.Custom('ResidenceBuilding')|l] นี้ แต่ข้าสงสัยว่าท่านคิดว่าการประหยัดส่วนใดจำเป็นที่สุด?"\n\n[position_holder.GetSheHe|U] ยกบัญชีของ [position_holder.GetHerHis] ขึ้น และเลิกคิ้วอย่างสงสัย"
 court.8192.a: "ข้าคิดว่าเราประหยัดค่าเครื่องเรือนได้"
 court.8192.b: "จงแน่ใจว่าเจ้าใช้ประโยชน์จากคนรับใช้ให้มากที่สุด"
 court.8192.c: "เหตุใดต้องประนีประนอม?"
 court.8192.c.success: "ท่านช่วย [position_holder.GetFirstNameNoTooltip]"
 court.8192.c.failure: "[position_holder.GetFirstNameNoTooltip] มีภาระมากเกินไป"
 employer_booner_seneschal_1_modifier: "การประหยัดค่าที่พัก"
 employer_booner_seneschal_1_modifier_desc: "ข้าหลวงของตัวละครนี้ได้รับการดูแลโดยเซเนสชาลผู้มีทักษะ"
 employer_booner_seneschal_2_modifier: "ผู้ควบคุมงาน"
 employer_booner_seneschal_2_modifier_desc: "ราชสำนักของตัวละครนี้อยู่ภายใต้การควบคุมของเซเนสชาลผู้มีทักษะ\nค่าบำรุงรักษา [court_amenity|E] ที่พัก: #P -25%#!"
 employer_booner_seneschal_3_modifier: "การประหยัดของผู้ควบคุมงาน"
 employer_booner_seneschal_3_modifier_desc: "ราชสำนักและคนรับใช้ของตัวละครนี้อยู่ภายใต้การควบคุมของเซเนสชาลผู้มีทักษะ\nค่าบำรุงรักษา [court_amenity|E] ที่พัก: #P -25%#!"
 # Wet Nurse
 court.8193.t: "ได้รับการดูแลอย่างดี"
 court.8193.desc: "[GetCourtPositionType('wet_nurse_court_position').GetName()] ผู้ [position_holder.Custom('ComplimentAdjective')] ของข้า [position_holder.GetTitledFirstName] เข้ากับเด็ก ๆ ได้เป็นอย่างดี ดูแลเจ้าตัวเล็กราวกับเป็นลูกของ [position_holder.GetHerHis] เอง\n\nข้าค่อนข้างประหลาดใจเมื่อ [position_holder.GetSheHe] ถามข้า ระหว่างที่กำลังดุเด็กคนหนึ่ง: "มีเด็กคนใดใน [ROOT.Char.Custom('GetCourt')] ที่ท่านคิดว่าต้องการความสนใจเป็นพิเศษจากข้าหรือไม่ [ROOT.Char.GetTitleAsNameNoTooltip] ของข้า?""
 court.8193.a: "#EMP ข้า#! ควรได้รับเวลาทั้งหมดของ[position_holder.GetHerHis]!"
 court.8193.b: "ทายาทน้อยของข้า [heir.GetFirstNameNoTooltip] มาก่อน"
 court.8193.c: "ดูแล [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('baby'))] แรกเกิดของข้า [baby.GetFirstNameNoTooltip]"
 court.8193.d: "[ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('hostage'))] ของข้า [hostage.GetFirstNameNoTooltip] จะได้รับการดูแลอย่างดี"
 court.8193.e: "มุ่งเน้นไปที่ [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('interesting'))] ของข้า [interesting.GetFirstNameNoTooltip]"
 court.8193.f: "[sickest.GetFirstNameNoTooltip] น้อย [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('sickest'))] ของข้า คือผู้ที่สำคัญที่สุดของเจ้า"
 court.8193.g: "ใช้เวลามากขึ้นกับ [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('second_sickest'))] ของข้า [second_sickest.GetFirstNameNoTooltip]"
 court.8193.h: "พยายามเป็นพิเศษเพื่อ [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('extra'))] ของข้า [extra.GetFirstNameNoTooltip]"
 court.8193.i: "ข้าต้องการให้ [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('bonus'))] ของข้า [bonus.GetFirstNameNoTooltip] เติบโตอย่างแข็งแรง"
 employer_booner_wet_nurse_modifier: "ลูกรักของแม่นม"
 employer_booner_wet_nurse_modifier_desc: "ตัวละครนี้เป็นจุดสนใจหลักในพลังงานของแม่นมผู้มีทักษะ"
 # High Almoner
 court.8194.t: "เป้าหมายของการกุศล"
 court.8194.desc: "[GetCourtPositionType('high_almoner_court_position').GetName()] [position_holder.Custom('ComplimentAdjective')] ของข้า, [position_holder.GetTitledFirstName], จัดการความรับผิดชอบของ[position_holder.GetHerHis] ด้วยความเอาใจใส่อย่างยิ่ง, และการกุศล [ROOT.Char.GetPrimaryTitle.GetAdjectiveNoTooltip] ก็ได้รับชื่อเสียงเลื่องลือไปไกล\n\nดังนั้น ข้าจึงประหลาดใจเล็กน้อย, เมื่อ [position_holder.GetSheHe] เอ่ยถามข้า, ขณะที่ถุงเหรียญส่งเสียงกรุ๊งกริ๊งในฝ่ามือของ[position_holder.GetHerHis]: "เวลาของข้าถูกแบ่งไประหว่างผู้ขัดสนอย่างแท้จริง กับเหล่าขุนนางและสุภาพสตรีผู้ศรัทธาแห่ง [ROOT.Char.GetCapitalLocation.GetBaronyNameExplicitlyNoTooltip] — ข้าต้องการคำชี้แนะจากท่าน, [ROOT.Char.Custom('FormOfAddressForLiege')]...""
 court.8194.a: "จงมอบพระคุณ [ROOT.Char.GetFaith.WealthGodNamePossessive] แก่คนยากจน"
 court.8194.b: "จงแน่ใจว่าทานเหล่านี้ไปถึงที่ที่ถูกต้อง..."
 court.8194.c: "ข้าเห็นหนทางที่เป็นประโยชน์ต่อทุกคน"
 court.8194.c.success: "ท่านช่วย [position_holder.GetFirstNameNoTooltip]"
 court.8194.c.failure: "[position_holder.GetFirstNameNoTooltip] มีภาระมากเกินไป"
 employer_booner_high_almoner_1_modifier: "การบรรเทาทุกข์ตามเป้าหมาย"
 employer_booner_high_almoner_1_modifier_desc: "ราษฎรผู้ขัดสนของตัวละครนี้เป็นจุดสนใจของสมุหพระอัลโมนเนอร์ผู้เอาใจใส่"
 employer_booner_high_almoner_2_modifier: "การกุศลเพื่อภาพลักษณ์"
 employer_booner_high_almoner_2_modifier_desc: "มโนธรรมของข้าหลวงผู้ศรัทธาของตัวละครนี้เป็นจุดสนใจของสมุหพระอัลโมนเนอร์ผู้เอาใจใส่"
 employer_booner_high_almoner_3_modifier: "การบรรเทาทุกข์เพื่อภาพลักษณ์"
 employer_booner_high_almoner_3_modifier_desc: "ราษฎรผู้ขัดสนและมโนธรรมของข้าหลวงผู้ศรัทธาของตัวละครนี้เป็นจุดสนใจของสมุหพระอัลโมนเนอร์ผู้เอาใจใส่"
 # Bodyguard
 court.8195.t: "การดูแลตนเอง"
 court.8195.desc: "[GetCourtPositionType('bodyguard_court_position').GetName()] [position_holder.Custom('ComplimentAdjective')] ของข้า, [position_holder.GetTitledFirstName], เป็นนักสู้ผู้สร้างแรงบันดาลใจยามอยู่ในลานฝึกซ้อม, และเป็นตัวตนที่สร้างความอุ่นใจอย่างยิ่งใน [ROOT.Char.Custom('ResidenceBuilding')|l]\n\nวันหนึ่ง [position_holder.GetSheHe] เข้ามาหาข้า, ในมือถือดาบซ้อม, โดยมี [portrait.GetFirstName] ติดตามมาด้วย, และเอ่ยถาม: "ข้าได้รับคำร้องขอให้ช่วยฝึกฝน, และข้าจะรับคำร้องเหล่านั้นหากท่านอนุญาต, [ROOT.Char.Custom('FormOfAddressForLiege')] มีผู้ใดที่ท่านอยากให้ข้าสอนหรือไม่?""
 court.8195.a: "เจ้าจะประลองกับ #EMP ข้า#!!"
 court.8195.b: "[ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('heir'))] และทายาทของข้า [heir.GetFirstNameNoTooltip] ต้องแข็งแกร่ง"
 court.8195.c: "ข้าคิดว่า [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('struggling'))] ของข้า [struggling.GetFirstNameNoTooltip] น่าจะต้องการคำแนะนำจากเจ้า"
 court.8195.d: "มุ่งเน้นไปที่การฝึกของ [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('hostage'))] ของข้า [hostage.GetFirstNamePossessiveNoTooltip]"
 court.8195.e: "[ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('interesting'))] ของข้า [interesting.GetFirstNameNoTooltip] น่าจะต้องการความใส่ใจจากเจ้า"
 court.8195.f: "ฝึก [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('oldest'))] ของข้า [oldest.GetFirstNameNoTooltip]"
 court.8195.g: "ถึงเวลาที่ [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('youngest'))] ของข้า [oldest.GetFirstNameNoTooltip] จะเรียนรู้การต่อสู้"
 court.8195.h: "ดูแล [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('extra'))] ของข้า [extra.GetFirstNameNoTooltip]"
 court.8195.i: "[ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('bonus'))] ของข้า [bonus.GetFirstNameNoTooltip] จะได้รับประโยชน์สูงสุด"
 employer_booner_bodyguard_modifier: "การฝึกประลอง"
 employer_booner_bodyguard_modifier_desc: "ตัวละครนี้กำลังได้รับการฝึกส่วนตัวจากองครักษ์ผู้มีทักษะ"
 # Master of Horse
 court.8196.t: "บนหลังอาน"
 court.8196.desc: "พรสวรรค์ของ [GetCourtPositionType('master_of_horse_court_position').GetName()] ผู้ [position_holder.Custom('ComplimentAdjective')] ของข้า [position_holder.GetTitledFirstName] เป็นที่ยอมรับกันอย่างกว้างขวางว่าประเมินค่ามิได้\n\nการฝึกและความแม่นยำของม้าก้าวหน้าไปอย่างก้าวกระโดด และ [position_holder.GetSheHe] มีความสามารถโดยธรรมชาติในการควบคุมทั้งสัตว์และผู้ดูแลพวกมัน\n\nวันนี้ [position_holder.GetSheHe] เข้ามาหาข้าในห้องบัลลังก์และถามข้าโดยตรงว่า: "[ROOT.Char.GetTitleAsNameNoTooltip] ของข้า ข้าควรจะร่างแนวทางการดูแลคอกม้าที่เหมาะสม หรือมุ่งเน้นไปที่การฝึก?""
 court.8196.a: "ประหยัดเรื่องม้าให้มากที่สุดเท่าที่จะทำได้"
 court.8196.b: "อานม้าที่ว่างเปล่าไร้ประโยชน์"
 court.8196.c: "เจ้าทำทั้งสองอย่างไม่ได้หรือ?"
 court.8196.c.success: "ท่านช่วย [position_holder.GetFirstNameNoTooltip]"
 court.8196.c.failure: "[position_holder.GetFirstNameNoTooltip] มีภาระมากเกินไป"
