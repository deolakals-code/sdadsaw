 # Antiquarian
 court.8198.t: "ภัณฑารักษ์ผู้เอาใจใส่"
 court.8198.desc: "[GetCourtPositionType('antiquarian_court_position').GetName()] [position_holder.Custom('ComplimentAdjective')] ของข้า, [position_holder.GetTitledFirstName], ดูแลคลังสมบัติของข้าเป็นอย่างดี: สิ่งของต่างๆ ถูกเก็บรักษาความสะอาดและปัดฝุ่นอย่างดี, และ [position_holder.GetSheHe] ก็พร้อมเสมอที่จะเสนอเกร็ดเล็กเกร็ดน้อยแก่แขกผู้มาเยือนที่อยากรู้อย่างเห็น, หรือไม่ก็ตาม\n\nด้วยความรับผิดชอบต่อสมบัติล้ำค่าทั้งหมดในราชสำนัก [ROOT.Char.GetPrimaryTitle.GetAdjectiveNoTooltip], เวลาของ [position_holder.GetHerHis] จึงมีจำกัดอย่างเข้าใจได้, และ [position_holder.GetSheHe] ก็เอ่ยถามข้า, หลังจากที่ข้าชื่นชมผลงานอันดีของ [position_holder.GetHerHis], ว่า: "...มีวัตถุใดที่ท่านคิดว่าต้องการความเอาใจใส่เป็นพิเศษหรือไม่, [ROOT.Char.Custom('FormOfAddressForLiege')]?""
 court.8198.a: "เจ้าช่วยดู [weak_1.Custom('ArtifactType')] นี้ได้หรือไม่?"
 court.8198.b: "มี [weak_2.Custom('ArtifactType')] ที่ดูไม่น่าสนใจ #EMP อยู่#! ชิ้นหนึ่ง"
 court.8198.c: "ลองดู [weak_3.Custom('ArtifactType')] นี้ให้ข้าหน่อย"
 court.8198.d: "[broken_1.Custom('ArtifactType')] นี้ควรได้รับการซ่อมแซม"
 court.8198.e: "[broken_2.Custom('ArtifactType')] ของข้ากำลังจะพังเป็นชิ้นๆ"
 court.8198.f: "ดูแล [broken_3.Custom('ArtifactType')] นี้ด้วย"
 court.8198.g: "แล้ว [weak_4.Custom('ArtifactType')] ของข้าล่ะ?"
 court.8198.h: "ซ่อม [broken_4.Custom('ArtifactType')] ทีสิ?"
 court.8198.i: "ไม่ แค่ทำงานดีๆ ต่อไป!"
