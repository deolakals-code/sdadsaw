l_english: 

court_events.1000.t: "ความโอ่อ่าที่สุดเหนือสิ่งอื่นใด"
court_events.1000.desc: ""ข้า แต่ [ROOT.Char.GetTitleAsNameNoTooltip] ผู้ยิ่งใหญ่! เราสองคนได้ร่อนเร่ไปทั่วโลกหล้าที่รู้จักกัน" [guest.GetName], คนแรกในคู่นักเดินทางชื่อดัง, ประจบประแจง "ได้ยลโดมสำราญกลางแสงตะวัน! ถ้ำน้ำแข็ง! ได้ดื่มน้ำนมแห่งปาเลสไตน์และลิ้มรสน้ำผึ้งหวาน."\n\n"เราได้เยือนค่ายของข่าน วังของสุลต่าน โถงโบราณ... แต่ไม่มีราชสำนักใดในปฐพีเทียบเคียงของท่านได้เลย: ไม่มีที่ใดเสมอเหมือนในความสง่างามและความหรูหรา!"\n\nสหายของ [guest.GetHerHis|U] [guest_2.GetName] แสดงความเคารพแบบต่างแดนอันแปลกประหลาด พลางวิงวอน:\n\n"ความสะดวกสบายของสถานที่แห่งนี้ — มันเหนือล้ำกว่าแม้ แต่ความฟุ้งเฟ้อของชาว [second_court.GetPrimaryTitle.GetAdjective]... [ROOT.Char.GetTitleAsNameNoTooltip] ผู้ปรีชา โปรดอนุญาตให้เราได้สัมผัส [guest_2.GetFaith.PositiveAfterLife] ล่วงหน้าอีกสักครั้งเถิด!""
court_events.1000.a: "เพียงการกุศลเท่านั้นที่จะหักล้างชื่อเสียงด้านความฟุ่มเฟือยได้..."
court_events.1000.a.flavor: "และ ทำให้ประชาชนของข้าร่ำรวยขึ้น!"
court_events.1000.b: ""จงอยู่ที่นี่ ในราชสำนักอันโอ่อ่าที่สุด""
court_events.1000.b.flavor: "และนำข้าราชบริพารของข้าสรรเสริญข้าในฐานะประมุขผู้ยิ่งใหญ่ที่สุด!"
court_events.1000.c: ""จงบอกเล่าถึงสิ่งมหัศจรรย์ทั้งปวงที่เจ้าได้เห็น ณ ที่นี่""
traveling_friends_court_position_aptitude: "สหายนักเดินทางเหล่านี้มีความ [aptitude|E] เพิ่มขึ้นเมื่อทั้งคู่ดำรง [court_positions|E]"
visiting_gives_opinion: "[ruler|E] ทุกคนที่ให้ที่พักพิงแก่ [guest.GetFirstName] หรือ [guest_2.GetFirstName] จะได้รับ #P 20#! [opinion|E] ต่อ #high ท่าน#! #EMP (ชื่อเสียง)#!"

court_events.1010.t: "จากรังมดอีกแห่ง"
court_events.1010.desc: "ข้าราชบริพารชาว[grander_ruler.GetPrimaryTitle.GetAdjectiveNoTooltip]คนหนึ่งแอบย่องเข้ามา [defector.GetSheHe|U]โค้งคำนับต่อหน้าข้า, พลางเหลือบมองทหารยามของข้าอย่างประหม่า\n\n"ข้ามาจากสถานที่อันโอ่อ่า" เจ้าคนประจบสอพลอนี้, [defector.GetName], กล่าว, "ราชสำนักของ [grander_ruler.GetName]"\n\n"หากข้าจะออกจากการจ้างงานของ[grander_ruler.GetHerHis], เหล่าข้าราชการจำนวนมากก็จะมาพร้อมกับข้า แม้เป็นเพียงแมลงตัวเล็ก ๆ, แต่ด้วยแรงงานอันอุตสาหะของเรา ราชสำนักจึงได้กลายเป็นสง่างาม! และพวกเราไม่ปรารถนาที่จะผูกมัดอยู่กับ [grander_ruler.GetTitleAsNameNoTooltip] [grander_ruler.Custom2('InsultAdjective', SCOPE.sC('defector'))] ผู้นั้น..."\n\n"พวกเราขอเสนอบริการของเราแก่ #EMP ท่าน#!, โอ้ [ROOT.Char.GetTitleAsName]""
court_events.1010.a: ""ด้วยความหลักแหลมของเจ้า... จงพิสูจน์ประโยชน์ของเจ้าให้ข้าเห็น""
court_events.1010.a.flavor: "นักสะสมของเก่าของข้าบอกข้าเกี่ยวกับสมบัติอันยิ่งใหญ่ของ [grander_ruler.GetTitleAsNamePossessiveNoTooltip]... และโดยเฉพาะอย่างยิ่งชิ้นหนึ่ง ที่มือขโมยสามารถ ทำให้เป็นของข้าได้"
court_events.1010.a.success: "ผู้แปรพักตร์ขโมยโบราณวัตถุของเจ้าเหนือหัวของพวกเขา"
court_events.1010.a.failure: "ผู้ทรยศถูกจับและประหารชีวิต"
court_events.1010.b: "ผู้แปรพักตร์เหล่านี้รู้วิถีแห่งความประณีตเป็นอย่างดี"
court_events.1010.c: "นักบวชผู้มีทักษะจะบริหารราชสำนักนี้ได้ดีกว่า"
court_events.1010.c.flavor: "หากต้องการมือที่มีประโยชน์มากขึ้นในการบริหารราชสำนักนี้ [court_chaplain.GetCouncilTitle] ของข้าสามารถค้นหาและดูแลบางคนที่ปราศจากบาปได้..."
court_events.1010.d: "#EMP "ไสหัวกลับบ้านไป เจ้าแมลงสาบทรยศ!"#!"

court_events.1011.opening: "ถึงอดีตนายของข้า,"
court_events.1011.desc: "ข้า, [defector.GetName], และคนรับใช้ที่ถูกกดขี่ของเจ้าจำนวนมากได้หนีออกจากการรับใช้ของเจ้าแล้ว หากปราศจากความเชี่ยวชาญของพวกเรา, อีกไม่นานราชสำนักของเจ้าก็จะอยู่ในสภาพยุ่งเหยิงสมกับที่เจ้าสมควรได้รับ\n\nเจ้าเป็น [grander_ruler.Custom2('InsultNoun', SCOPE.sC('defector'))] มาโดยตลอด มากกว่าที่จะเป็นนายเหนือหัวผู้คู่ควร และ ดังนั้น, ผู้มาแทนที่เจ้า, [root_scope.GetName], จะได้ลิ้มรสความสะดวกสบายและความรุ่งโรจน์ที่เจ้าเคยรู้จัก"
court_events.1011.a: "#EMP คนทรยศ!#!"
