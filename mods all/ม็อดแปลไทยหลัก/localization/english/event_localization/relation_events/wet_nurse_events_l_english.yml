 bp2_yearly.7024.t: "$bp2_decision.0002.t$: $rites_of_passage_seclusion$"
 bp2_yearly.7024.desc: ""การปลีกวิเวกช่วยเสริมสร้างร่างกายและจิตวิญญาณ" [ROOT.Char.GetCouncillorPosition( 'councillor_court_chaplain' ).GetPositionName]ของข้า [priest.GetFirstName] ยืนกราน "ในความสงบเงียบคือปัญญา! ในการเอาชีวิตรอดคือความเจ้าเล่ห์ จงเลือกสถานที่แห่งความสามัคคี... แต่เป็นที่ใดที่หนึ่งที่ป่าเถื่อน โหดร้าย"\n\n[priest.GetSheHe|U] ยื่นเสบียงเพียงเล็กน้อยออกมา\n\n"
 bp2_yearly.7024.desc_capital: ""[teentribal.Custom('GirlBoy')]ปลอดภัยที่บ้าน ใน[rite_location.GetTerrain.GetNameNoTooltip|l]ของ[rite_location.GetName]""
 bp2_yearly.7024.desc_abroad: "สำหรับการทดสอบที่แท้จริง ลองพิจารณา[abroad_location.GetTerrain.GetNameNoTooltip|l]ที่แปลกประหลาดและห่างไกลของ[abroad_location.GetName]!"
 bp2_yearly.7024.desc_realm: "หรือผู้ทำพิธีอาจเดินทางช่วงสั้นๆ: ไปยัง[realm_location.GetName] บางที?"
 bp2_yearly.7024.desc_end: "บัดนี้ เด็กน้อย จงไป — ด้วยปัญญาของ[priest.GetFaith.KnowledgeGodName]""
 bp2_yearly.7024.a: "ออกเดินทาง สู่ดินแดนอันไกลโพ้น!"
 bp2_yearly.7024.a.tt: "#N สูงกว่า#! โอกาสที่จะเกิดอันตราย"
 bp2_yearly.7024.a.abroad: "[teentribal.GetFirstName] จะเดินทางไปยัง[abroad_location.GetTerrain.GetNameNoTooltip|l]ของ[abroad_location.GetName] ภายในอาณาจักรของ[foreign_ruler.GetName]"
 bp2_yearly.7024.win: "หลีกเลี่ยงอันตรายทั้งหมด"
 bp2_yearly.7024.lose: "ตกอยู่ในอันตราย"
 bp2_yearly.7024.b: "การเดินทางไม่จำเป็นต้องยาวนานเกินไป"
 bp2_yearly.7024.b.tt: "#Z ปานกลาง#! โอกาสที่จะเกิดอันตราย"
 bp2_yearly.7024.b.realm: "[teentribal.GetFirstName] จะเดินทางไปยัง[realm_location.GetTerrain.GetNameNoTooltip|l]ของ[realm_location.GetName]"
 bp2_yearly.7024.c: "ป่าในท้องถิ่นก็ใช้ได้"
 bp2_yearly.7024.c.tt: "#P ต่ำกว่า#! โอกาสที่จะเกิดอันตราย"
 bp2_yearly.7024.c.capital: "[teentribal.GetFirstName] จะปลีกวิเวกใน[rite_location.GetTerrain.GetNameNoTooltip|l]ของ[rite_location.GetName] [realm_capital|E]"
 bp2_yearly.7024.d: "$bp2_decision.0002.f$"
 bp2_yearly.7024.d.tt: "$bp2_decision.0002.cooldown$"
 bp2_yearly.7025.t: "$bp2_decision.0002.t$: $rites_of_passage_seclusion$"
 bp2_yearly.7025.desc: "— [teentribal.MakeScope.Var('animal_type').GetFlagName]ที่น้ำลายไหลยืดตัวหนึ่งย่องเข้ามาในค่ายเล็กๆ ของข้า!\n\nข้าไม่สามารถวิ่งหนีสิ่งมีชีวิตที่สิ้นหวังนี้ได้ สัตว์ร้ายต้องถูกต่อสู้หรือเอาชนะด้วยสติปัญญา ข้ามีกระต่ายป่าที่เพิ่งฆ่าสดๆ อยู่ใกล้มือ..."
 bp2_yearly.7025.desc_realm: "ข้ามาถึง[realm_location.GetTerrain.GetNameNoTooltip|l]ที่อยู่ใกล้เคียงของ[realm_location.GetName]อย่างรวดเร็วและเริ่มเตรียมตัวสำหรับค่ำคืนทันที ขณะที่ข้ากำลังก่อกองไฟเพื่อทำอาหารเย็น $bp2_yearly.7025.desc$"
 bp2_yearly.7025.desc_abroad: "รุ่งอรุณขึ้นเหนือ[seclusion_location.GetName] [realm_location.GetTerrain.GetNameNoTooltip|l]ที่ไม่รู้จัก ปราศจากชาว[seclusion_location.GetCounty.GetCulture.GetCollectiveNoun]ในท้องถิ่น น่าสะพรึงกลัวในยามค่ำคืนและสวยงามในยามเช้า\n\nค่ายกองไฟที่จุดครึ่งๆ กลางๆ ของข้าและข้าไม่ได้อยู่ที่นี่ตามลำพัง $bp2_yearly.7025.desc$"
 bp2_yearly.7025.desc_capital: "ข้ารีบหาสถานที่ที่ดีสำหรับค่ายของข้า นอก[rite_location.GetName] ดังนั้นข้าจึงก่อกองไฟทันทีเพื่อเตรียมตัวสำหรับค่ำคืนและกินอะไรอุ่นๆ $bp2_yearly.7025.desc$"
 bp2_yearly.7025.desc_fight: "บางที การโยนมันออกไป อาจซื้อเวลาให้ข้าคว้าคันธนูได้?"
 bp2_yearly.7025.desc_outwit: "บางทีข้าอาจจะถอยออกไปอย่างแนบเนียน ในขณะที่สิ่งนั้น ทำให้[teentribal.MakeScope.Var('animal_type').GetFlagName]พอใจ?"
 bp2_yearly.7025.a: "ข้าจะแอบหนีไปซ่อน"
 bp2_yearly.7025.a_win: "ท่านคืบคลานหนีจากสัตว์ร้ายที่ถูกเบี่ยงเบนความสนใจ"
 bp2_yearly.7025.a_lose: "[teentribal.MakeScope.Var('animal_type').GetFlagName]ที่โกรธเกรี้ยว โจมตีท่าน"
 bp2_yearly.7025.tt: "[teentribal.MakeScope.Var('animal_type').GetFlagName]โจมตีระหว่างการปลีกวิเวก"
 bp2_yearly.7025.b: "ด้วยลูกธนูอันแหลมคม ข้าจะขับไล่[teentribal.MakeScope.Var('animal_type').GetFlagName]ไป!"
 bp2_yearly.7025.b_win: "[teentribal.MakeScope.Var('animal_type').GetFlagName]หนีไป ถูกลูกธนูต่อย"
 bp2_yearly.7025.b_lose: "[teentribal.MakeScope.Var('animal_type').GetFlagName]ที่ไม่ได้รับบาดเจ็บโจมตี"
 bp2_yearly.7026.t: "$bp2_decision.0002.t$: $rites_of_passage_shaving$"
 bp2_yearly.7026.desc: "ด้วยการถักเปียอย่างประณีตและสะบัดผมสวยงามด้วยความกตัญญู เผ่ารวมตัวกันเพื่อทำพิธีโกนผม\n\n[ROOT.Char.GetCouncillorPosition( 'councillor_court_chaplain' ).GetPositionName]ของข้า [priest.GetFirstName] จับผมของ[teentribal.GetFirstNamePossessive]และหยิบมีดที่จารึกไว้\n\n"[teentribal.Custom('GirlBoy')]ผู้นี้จะละทิ้งวัยเด็กเพื่ออนาคตของเผ่า! [teentribal.GetSheHe|U] จะสูญเสียทุกสิ่งที่มีอยู่เพื่อความไร้สาระ ทิ้งธรรมชาติที่แท้จริงของ[teentribal.GetHerHis] พลังแห่งจิตวิญญาณของ[teentribal.GetHerHis] ให้เปิดเผยออกมา!"\n\nนักปราชญ์เหลือบมองมาทางข้าอย่างระแวดระวัง\n\n"...หาก[ROOT.Char.GetTitleAsName]ของเราประสงค์ เช่นนั้น""
 bp2_yearly.7026.desc_child: "ด้วยการถักเปียอย่างประณีตและสะบัดผมสวยงามด้วยความกตัญญู เผ่ารวมตัวกันเพื่อทำพิธีโกนผม\n\n[ROOT.Char.GetCouncillorPosition( 'councillor_court_chaplain' ).GetPositionName]ของข้า [priest.GetFirstName] จับผมของข้าและหยิบมีดที่จารึกไว้\n\n"[ROOT.Char.GetTitleAsName]ของเราจะละทิ้งวัยเด็กเพื่ออนาคตของเผ่า! [teentribal.GetSheHe|U] จะสูญเสียทุกสิ่งที่มีอยู่เพื่อความไร้สาระ ทิ้งธรรมชาติที่แท้จริงของ[teentribal.GetHerHis] พลังแห่งจิตวิญญาณของ[teentribal.GetHerHis] ให้เปิดเผยออกมา!"\n\nนักปราชญ์เหลือบมองมาทางข้าอย่างระแวดระวัง\n\n"...หาก[ROOT.Char.GetTitleAsNameNoTooltip]ของเราประสงค์ เช่นนั้น""
 bp2_yearly.7026.a: "การอุทิศตนอย่างสมบูรณ์: การโกนที่โหดร้าย ทั้งหมด"
 bp2_yearly.7026.a.tt: "[ROOT.Char.Custom2('RelationToMeShort',priest)]ของข้าลากใบมีดของ[priest.GetHerHis]ไปทั่วหนังศีรษะ ด้วยความแข็งขันที่เหมาะสม"
 bp2_yearly.7026.a.toast: "พิธีโกนผมเสร็จสิ้นแล้ว"
 bp2_yearly.7026.b: "ตัดเพียงปอยเดียว เพื่อเก็บไว้เสมอ!"
 bp2_yearly.7026.b.tt: "ผมเส้นเล็กๆ ถูกตัดและใส่ไว้ในล็อกเกตพิธีกรรม เป็นสัญลักษณ์แห่งหน้าที่"
 bp2_yearly.7026.b.toast: "การตัดผมเสร็จสมบูรณ์แล้ว"
 bp2_yearly.7026.c: "$bp2_decision.0002.f$"
 bp2_yearly.7026.c.tt: "$bp2_decision.0002.cooldown$"
 bp2_yearly.7027.t: "$bp2_decision.0002.t$: การชำระล้าง"
 bp2_yearly.7027.desc: "เผ่ารวมตัวกันอย่างเคารพริมฝั่งน้ำ ขณะที่[priest.GetFirstName]ผู้ศักดิ์สิทธิ์ชูถ้วยพิธีกรรมขึ้น\n\n"จากหยดน้ำไม่กี่หยดก่อเกิดเป็นทะเล! จาก[teentribal.Custom('GirlBoy')] ก่อเกิดเป็น[teentribal.GetWomanMan]! มันเริ่มต้น เช่นนี้" [priest.GetSheHe|U] เทน้ำศักดิ์สิทธิ์ลงบนเส้นผมและผิวหนัง\n\n"ในนามของ[priest.GetFaith.WaterGodName]: ขอให้น้ำชำระล้างเจ้า ขอให้มันชะล้างความเป็นเด็กออกไปและทิ้งปัญญาแห่งความเป็นผู้ใหญ่ไว้"\n\nส่วนต่อไปของพิธีตกอยู่กับข้า — และสระน้ำศักดิ์สิทธิ์รออยู่"
 bp2_yearly.7027.a: "การเกือบจมน้ำคือการรู้จักน้ำ!"
 bp2_yearly.7027.a.tt: "การกระโดดลงไปในน้ำศักดิ์สิทธิ์นั้น... เกือบถึงแก่ชีวิตในด้านความยาวนาน"
 bp2_yearly.7027.b: "พิธีกรรมต้องการ... การอาบน้ำเบาๆ"
 bp2_yearly.7027.b.tt: "การจุ่มตัวสั้นๆ: สัญลักษณ์คือเจ้าแห่งโลกที่ตื่นอยู่"
 bp2_yearly.7027.c: "$bp2_decision.0002.f$"
 bp2_yearly.7027.c.tt: "$bp2_decision.0002.cooldown$"
 bp2_yearly.7027.tt: "การชำระล้างด้วย$cleansing_type_element$เสร็จสมบูรณ์แล้ว"
 bp2_yearly.7028.t: "$bp2_decision.0002.t$: การชำระล้าง"
 bp2_yearly.7028.desc: "เปลวไฟขนาดใหญ่ส่องสว่างใบหน้าที่เคร่งขรึมของชนเผ่าของข้า [ROOT.Char.GetCouncillorPosition( 'councillor_court_chaplain' ).GetPositionName]ของข้า [priest.GetFirstName] ซึ่งถือด้ามหอก ทำลายกองไฟและกระจายถ่านคุให้เป็นทางที่เรืองแสง\n\nหายใจ — หายใจอย่างสม่ำเสมอ ข้าขอร้อง\n\n"เยาวชนผู้นี้พร้อมที่จะเข้าร่วมในหมู่พวกท่านแล้วหรือ?!" [priest.GetFirstNameNoTooltip] ร้องถาม "[priest.GetFaith.WarGodName] จะตัดสิน ขณะที่[teentribal.GetFirstName]เผชิญหน้ากับการทดลองด้วยไฟ! ไปเถิด เด็กน้อย: เผาสิ่งที่ไม่คู่ควรทิ้งไป แล้วเจ้าอาจก้าวเหยียบบนผืนดินเย็นในฐานะ[ROOT.Char.GetCulture.GetName] [teentribal.GetWomanMan]!""
 bp2_yearly.7028.a: "[priest.GetFaith.WarGodName|U] แบกผู้ศรัทธาผ่านไป!"
 bp2_yearly.7028.a.tt: "ก้าวอย่างรอบคอบและพากเพียรระหว่างการเดินลุยไฟ"
 bp2_yearly.7028.b: "รีบเร่ง! วิ่งผ่านไปเลย"
 bp2_yearly.7028.b.tt: "การเดินลุยไฟได้รับเกียรติ แต่การวิ่งผ่านนั้นรวดเร็วดุจสายลม"
 bp2_yearly.7028.c: "$bp2_decision.0002.f$"
 bp2_yearly.7028.c.tt: "$bp2_decision.0002.cooldown$"
 bp2_yearly.7028.tt: "$bp2_yearly.7027.tt$"
 bp2_yearly.7029.t: "พิธีเปลี่ยนผ่าน: ความกลัวที่คุ้นเคย"
 bp2_yearly.7029.desc: "ในฐานะ[ROOT.Char.GetTitleAsName] ข้าอนุญาตให้เยาวชนที่จะทำพิธีเปลี่ยนผ่านในไม่ช้า บางคนให้คำมั่นสัญญาที่กล้าหาญ คำสาบานที่น้อยคนใน[ROOT.Char.GetCulture.GetCollectiveNoun]จะรักษาได้ คนอื่นๆ เช่น [ROOT.Char.Custom2('RelationToMeShort', teentribal)]ของข้า [teentribal.GetFirstName] ตัวสั่น\n\nวันนี้ การทดลองที่เลือกคือสิ่งเดียวกับที่ข้าเคยทำ:"
 bp2_yearly.7029.desc_duel: "ทักษะด้านอาวุธของ[teentribal.GetFirstNamePossessiveNoTooltip]คือคุณค่าของ[teentribal.GetHerHis] แต่ข้าสังเกตเห็น... [teentribal.GetSheHe] ไม่ได้ถือดาบ\n\n"คู่ต่อสู้ที่ถูกระบุชื่อนั้นเหมือนภูเขา!" [teentribal.GetSheHe] คร่ำครวญ "ข้าจะชนะได้อย่างไร นอกจากใช้กลอุบายสกปรกบางอย่าง?""
 bp2_yearly.7029.desc_scarification: "ใบหน้าของ[teentribal.GetFirstNamePossessiveNoTooltip]จะถูก ทำให้เป็นแผลเป็น เป็นเครื่องหมายให้[teentribal.GetHerHim]เป็นหนึ่งในพวกเราตลอดไป [teentribal.GetSheHe|U] หวาดกลัวเพียงแค่คิดถึงใบมีด\n\n"ข้ากลัวเสียตา!" [teentribal.GetSheHe] คร่ำครวญ "ข้าจะเตรียมตัวสำหรับสิ่งที่น่ากลัว เช่นนี้ได้อย่างไร?""
 bp2_yearly.7029.desc_seclusion: "[teentribal.GetFirstNameNoTooltip] ยืนเตรียมพร้อมสำหรับเส้นทางสู่การปลีกวิเวก แต่เตรียมตัวได้ไม่ดีนัก [teentribal.GetSheHe|U] ยังคงอยู่ในอ้อมกอด ด้วยดวงตาที่ชุ่มน้ำ\n\n"นั่นเป็นลางร้ายหรือไม่?" [teentribal.GetSheHe] ถาม "ไม่ใช่หรือ? ถึงกระนั้น... อากาศแย่ๆ แบบนี้ แน่นอนว่าไม่มีใครเดินทางในสภาพอากาศ เช่นนี้?""
 bp2_yearly.7029.desc_hair_shaving: "ผมของ[teentribal.GetFirstNamePossessiveNoTooltip]จะถูกโกน [teentribal.GetSheHe|U] กำผมเป็นกำมือด้วยความหวาดกลัวจนข้อนิ้วขาวซีด\n\n"พวกเขาบอกว่าผมของข้าสวยที่สุดในเผ่า!" [teentribal.GetSheHe] คัดค้าน "เราแค่ตัดขนสัตว์บูชายัญไม่ได้หรือ?!"
 bp2_yearly.7029.desc_fire_cleanse: "เท้าของ[teentribal.GetFirstNamePossessiveNoTooltip]เปลือยเปล่า เพื่อให้พวกเขารู้จักความหนาวเย็นก่อนการเดินลุยไฟ [teentribal.GetSheHe|U] มองตะเกียงเล็กๆ อย่างสงสัย\n\n"มีความจริงใดๆ ในไฟจริงๆ หรือ?" [teentribal.GetSheHe] คร่ำครวญ "ถ้าพวกท่านทุกคนต้องการเพียงความทรมานจากข้า ข้าคิดว่าข้าจะให้พวกท่านอย่างเหลือเฟือ..."
 bp2_yearly.7029.desc_water_cleanse: "[teentribal.GetFirstNameNoTooltip] จะถูกมอบให้กับน้ำ [teentribal.GetSheHe|U] ดูเหมือนจะไม่กระตือรือร้นที่จะถูกจุ่มลงไปเลย\n\n"บางทีข้าจะเสกให้สัตว์ร้ายจากห้วงลึกมาเขมือบข้า" [teentribal.GetSheHe] บ่น " [ROOT.Char.GetFaith.PriestNeuter] ก็อยากจะฆ่าข้ามากพอๆ กัน..."
 bp2_yearly.7029.a: "การเล่าเรื่องพิธีกรรมของข้าจะสร้างแรงบันดาลใจให้[teentribal.GetHerHim]!"
