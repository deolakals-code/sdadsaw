l_english: 
 bp2_decision.0001.t: "$find_wet_nurse_decision$"
 bp2_decision.0001.desc: "ด้วยความตั้งใจที่จะมอบการดูแลที่ดีที่สุดแก่[ROOT.Char.Custom('GetChildChildren')]ของเรา$bp2_decision.0001.desc_candidates$"
 bp2_decision.0001.desc_widower: "เนื่องจากการเลี้ยงดูบุตรที่มีสถานะสูงส่งนั้นห่างไกลจากการเป็นภาระหน้าที่ของผู้เดียว$bp2_decision.0001.desc_candidates$"
 bp2_decision.0001.desc_candidates: ", ข้าได้ให้ข้าราชการของข้าเสาะหาสตรีที่มีความสามารถสำหรับตำแหน่ง[GetCourtPositionType('wet_nurse_court_position').GetName()]\n\nบัดนี้ พวกเขานำเสนอสตรีท้องถิ่นสองสามคน เพื่อให้ข้าตัดสิน"
 bp2_decision.0001.a: "ข้าพอใจ[wet_nurse_candidate_1.GetFirstNameNoTooltip]ผู้มีประสบการณ์มากกว่า"
 bp2_decision.0001.a.aptitude: "[aptitude|E]ของ[wet_nurse_candidate_1.GetUINamePossessive]คือ[wet_nurse_candidate_1.GetCourtPositionAptitude( GetCourtPositionType( 'wet_nurse_court_position' ) )]"
 bp2_decision.0001.b: "[wet_nurse_candidate_2.GetFirstNameNoTooltip]ก็ดีพอแล้ว"
 bp2_decision.0001.b.aptitude: "[aptitude|E]ของ[wet_nurse_candidate_2.GetUINamePossessive]คือ[wet_nurse_candidate_2.GetCourtPositionAptitude( GetCourtPositionType( 'wet_nurse_court_position' ) )]"
 bp2_decision.0001.c: "ข้าไม่ชอบใครเลย"
 bp2_yearly.7000.t: "การลาป่วย"
 bp2_yearly.7000.desc: "แม่นม [wet_nurse.GetFirstName] ได้ขอเข้าเฝ้าข้าเป็นการด่วน\n\n"[wet_nurse.Custom2('RelationToMe', ROOT.Char)]ที่รักของข้า ข้าป่วยเสียแล้ว! ข้าต้องขอพักผ่อนสักสองสามวัน — ธาตุที่ไม่ดีของข้าอาจส่งผลต่อเด็กๆ ที่อยู่ในความดูแลของข้าได้"\n\n[wet_nurse.GetSheHe|U] คร่ำครวญด้วยความเร่งด่วนอย่างเห็นได้ชัด"
 bp2_yearly.7000.desc_child_liege: "แม่นมของข้า [wet_nurse.GetFirstName] ดูไม่ค่อยสบายนักช่วงนี้ [wet_nurse.GetSheHe|U] สังเกตเห็นความกังวลของข้า\n\n"[wet_nurse.Custom2('RelationToMe', ROOT.Char)]น้อยที่รักของข้า [nursed_child.GetFirstName] แม้ว่ามันจะ ทำให้ใจข้าหนักอึ้ง ข้าต้องบอกท่าน... ความเจ็บป่วยอันน่ารังเกียจบางอย่างได้มาเยือนข้า ข้าต้องจากไปสักพัก แต่อย่ากังวลไปเลย! ข้าจะกลับมาหาท่านในไม่ช้า""
 bp2_yearly.7000.a: "อย่ากังวลไปเลย ข้าจะดูแลท่านเอง"
 bp2_yearly.7000.a.tt: "ท่านออกค่าใช้จ่ายในการไปพบแพทย์"
 bp2_yearly.7000.b: "ให้เป็นการลาถาวรไปเลย"
 bp2_yearly.7000.b.tt: "ขาดการดูแลของ[wet_nurse.GetFirstNamePossessiveNoTooltip]"
 bp2_yearly.7000.c: "ป่วยรึ? อยู่ห่างๆ บุตรของข้าไว้!"
 bp2_yearly.7000.c_child_liege: "ป่วยรึ? ท่านควรอยู่ห่างๆ ข้าไว้!"
 bp2_yearly.7000.ill: "[nursed_child.GetFirstNameNoTooltip] ติดโรค"
 bp2_yearly.7000.healthy: "[nursed_child.GetFirstNameNoTooltip] ป้องกันโรคได้"
 bp2_yearly.7000.healthy.tt: "[nursed_child.GetShortUIName] ยังคงแข็งแรงดี"
 bp2_yearly.7001.t: "ความสงสัยของแม่นม"
 bp2_yearly.7001.desc: "[wet_nurse.GetFirstName] เป็นแม่นมที่ยอดเยี่ยมสำหรับบุตรของข้า เป็นผู้ดูแลที่ควรค่าแก่การชื่นชม อย่างไรก็ตาม เมื่อเร็วๆ นี้ [ROOT.Char.Custom2('RelationToMe', jealous_spouse)] ของข้า [jealous_spouse.GetFirstName] ค่อนข้างสงสัยในตัว[wet_nurse.GetHerHim]\n\n"[jealous_spouse.Custom2('RelationToMe', ROOT.Char)] ของข้า ความสนใจของท่านที่มีต่อบุตรของเราช่างเบ่งบานเหลือเกินตั้งแต่เราจ้างนางแพศยานั่น [wet_nurse.GetFirstNameNoTooltip]! เป็นไปได้หรือไม่ว่า#EMP ความอุดมสมบูรณ์#! ของ[wet_nurse.GetHerHis]เป็นแรงบันดาลใจให้ท่าน?"\n\n"
 bp2_yearly.7001.desc_lover: "ดูเหมือนว่า... ข้าไม่ระมัดระวังเท่าที่ควร"
 bp2_yearly.7001.desc_no_lover: "[jealous_spouse.GetFirstNameNoTooltip] กำลังโจมตีข้าโดยไม่มีเหตุผล! ใช่ไหม...?"
 bp2_yearly.7001.a: "ท่านต้องการให้ข้าเพิกเฉยต่อทายาทของเรารึ?!"
 bp2_yearly.7001.a.tt: "ตัวเลือกนี้มีให้ เพราะท่านมี[lover|E]"
 bp2_yearly.7001.b: "เหลวไหล ที่รัก ท่านก็รู้ว่าข้าซื่อสัตย์!"
 bp2_yearly.7001.b.spouse_convinced: "ท่านโน้มน้าว[jealous_spouse.GetFirstNameNoTooltip]ได้สำเร็จ"
 bp2_yearly.7001.b.spouse_not_convinced: "[jealous_spouse.GetFirstNameNoTooltip] ไม่เชื่อท่าน"
 bp2_yearly.7001.c: "ข้าจะคลายความกลัวของท่าน"
 bp2_yearly.7001.tt: "ท่านเป็นที่รู้จักในฐานะคนโกหก"
 bp2_yearly.7002.t: "คู่สมรสร่วมแม่นม"
 bp2_yearly.7002.desc: "[court_chaplain.GetFirstName] พรวดพราดเข้ามาใน[ROOT.Char.Custom('GetChamber')] ของข้า, ด้วยสีหน้ากังวลบนใบหน้าของ[court_chaplain.GetHerHis]\n\n"[ROOT.Char.Custom('FormOfAddressForLiege')|U], ขออภัยที่บุกรุก, ข้ามีเรื่องด่วน! ข้าได้เรียนรู้มาว่าท่านและ [spouse.GetFirstName] มีแม่นมคนเดียวกันในวัยเด็ก นี่ ทำให้การ แต่งงานของท่านไม่เหมาะสมอย่างยิ่ง; ท่านเป็นพี่น้องร่วมน้ำนม — ในสายพระเนตรของ[ROOT.Char.GetFaith.HighGodNamePossessive], ท่านคือครอบครัวที่ใกล้ชิดที่สุด!"\n\nช่างเป็นการเปิดเผยที่น่าตกใจ! [court_chaplain.GetFirstNameNoTooltip] พูดต่อก่อนที่ข้าจะทันโต้แย้ง \n\n"ข้าแนะนำให้ท่านหย่าทันที มิฉะนั้น, ข้าจะถูกบังคับให้ประกาศว่าการ แต่งงานของท่านเป็นการสมสู่ในหมู่ญาติ""
 bp2_yearly.7002.a: "ร่วมประเวณีในหมู่ญาติสนิท ท่านว่ารึ? ข้าแค่เรียกว่าความรัก!"
 bp2_yearly.7002.b: "เราจะหย่าร้างกันทันที"
 bp2_yearly.7002.c: "บางทีเราอาจตกลงที่จะลืมเรื่องนี้ไป...?"
 bp2_yearly.parental_neglect_effect: "[nursed_child.GetFirstNameNoTooltip] โกรธจัด"
 bp2_yearly.7003.title: "[nursed_child.GetFirstNamePossessiveNoTooltip] แรก"
 bp2_yearly.7003.t: "คำพูด$bp2_yearly.7003.title$"
 bp2_yearly.7003.desc: ""เร็วเข้า ฝ่าบาท ท่านต้องฟังนี่!"\n\nแม่นม [wet_nurse.GetFirstName] รีบพาข้าเข้าไปใน[ROOT.Char.Custom('GetChamber')]ของ[ROOT.Char.Custom2('RelationToMePossessive', nursed_child)] [wet_nurse.GetFirstNameNoTooltip] ชี้ไปที่[nursed_child.GetFirstName]ด้วยความตื่นเต้น ดังนั้นข้าจึงเอนตัวไปหา[nursed_child.GetHerHim]และตั้งใจฟัง\n\n"
 bp2_yearly.7003.desc_gold: "[nursed_child.GetFirstNameNoTooltip] ยื่นเหรียญที่เปื้อนน้ำลายให้ข้าและพูดว่า:\n\n"ท-ทอ, ท-ท-ทอง...""
 bp2_yearly.7003.desc_secret: "ขณะที่กดนิ้วลงบนริมฝีปากเล็กๆ ของ[nursed_child.GetHerHis] [nursed_child.GetFirstNameNoTooltip] กระซิบกับข้าว่า:\n\n"ความลับ""
 bp2_yearly.7003.desc_motto: ""[nursed_child.GetHouse.GetMotto]."\n\nเหลือเชื่อ: คำขวัญประจำตระกูล[nursed_child.GetHouse.GetName]ของเรา! [nursed_child.GetSheHe|U] พูดออกมาโดยไม่ติดขัด!"
 bp2_yearly.7003.desc_house: ""[nursed_child.GetHouse.GetNameNoTooltip]."\n\nน่าทึ่ง! [nursed_child.GetFirstNameNoTooltip] เรียนรู้ที่จะพูดชื่อตระกูลของเราแล้ว"
 bp2_yearly.7003.desc_military: ""กู-บา-นู... [nursed_child.Custom( 'KnightCultureNoTooltipLowercase' )]!"\n\nดูเหมือนว่า[nursed_child.GetFirstNameNoTooltip]มีจิตวิญญาณนักรบแล้ว!"
 bp2_yearly.7003.desc_faith: ""[nursed_child.GetFaith.random_GoodGodNames]."\n\nดูเหมือนว่า[nursed_child.GetFirstNameNoTooltip]เป็นผู้ศรัทธาแล้ว!"
 bp2_yearly.7003.desc_father: ""พ่อ-, พ่อ-...""
 bp2_yearly.7003.desc_mother: ""แม่-, แม่-...""
 bp2_yearly.7003.a: "น่าปิติยินดีอะไร เช่นนี้!"
 bp2_yearly.7003.b: "[nursed_child.GetSheHe] พูดอะไรได้อีกบ้าง?"
 bp2_yearly.7003.b.tt: "ท่านกดดันให้[nursed_child.GetFirstNameNoTooltip]พูดต่อไป"
 bp2_yearly.7003.c: "ข้าไม่มีเวลาสำหรับเรื่องนี้"
 bp2_yearly.7004.t: "ก้าว$bp2_yearly.7003.title$"
 bp2_yearly.7004.desc: "ข้าได้ยินเสียงเอะอะจากห้องของ[nursed_child.GetFirstNamePossessive] [ROOT.Char.Custom2('RelationToMeShort', nursed_child)] ของข้า เมื่อรีบเข้าไปข้างใน, ข้าเห็นแม่นม, [wet_nurse.GetFirstName], กำลังเล่นอยู่กับ [nursed_child.GetFirstName] \n\n"[ROOT.Char.Custom('FormOfAddressForLiege')|U], มาได้จังหวะพอดี! [nursed_child.GetFirstNameNoTooltip] เพิ่งก้าวแรกของ[nursed_child.GetHerHis]!" [wet_nurse.GetSheHe] ตะโกนอย่างตื่นเต้น\n\n[wet_nurse.GetSheHe]จับมือ[nursed_child.Custom('GirlBoy')] ของข้า, พยายามพา[nursed_child.GetHerHim] เดินไปรอบห้อง"
 bp2_yearly.7004.a: ""ก้าวที่ยิ่งใหญ่สำหรับเด็ก ก้าวเล็กๆ สำหรับผู้ปกครอง""
 bp2_yearly.7004.b: "[nursed_child.GetSheHe] ทำอะไรได้อีกบ้าง?"
 bp2_yearly.7004.b.tt: "ท่านกดดันให้[nursed_child.GetFirstNameNoTooltip]เดินต่อไป"
 bp2_yearly.7004.c: "$bp2_yearly.7003.c$"
 bp2_yearly.7005.t: "ฟันซี่$bp2_yearly.7003.title$"
 bp2_yearly.7005.desc: "เมื่อข้าอนุญาต [ROOT.Char.Custom2('RelationToMeShort', nursed_child)] ของข้า [nursed_child.GetFirstName] และแม่นมของ[nursed_child.GetHerHis]ก็เดินขบวนเข้ามาใน[ROOT.Char.Custom('GetChamber')]ของข้า [wet_nurse.GetFirstName] วางท่าเหมือนผู้ประกาศและประกาศว่า:\n\n"ฝ่าบาท ท่านกำลังเป็นสักขีพยานในโอกาสอันยิ่งใหญ่! [nursed_child.GetFirstNameNoTooltip] มีของขวัญอันยิ่งใหญ่จะมอบให้ท่าน" [wet_nurse.GetSheHe|U] ผลัก[nursed_child.GetHerHim]ไปข้างหน้า "เอาเลย [nursed_child.GetFirstNameNoTooltip] บอก[ROOT.Char.GetHerHim]สิ!"\n\n"[nursed_child.Custom2('RelationToMeShort', ROOT.Char)|U] ฟันข้าหลุด!" [ROOT.Char.Custom2('RelationToMeShort', nursed_child)] ของข้าอวดรอยยิ้มฟันหลออย่างภาคภูมิใจ ยื่นถุงเล็กๆ ที่มีฟันซี่ที่หลุดอยู่ข้างในให้ข้า"
 bp2_yearly.7005.a: "น่ารัก! แต่เก็บฟันของเจ้าไว้เป็นเครื่องรางนำโชคเถิด"
 bp2_yearly.7005.b: "นี่ ของขวัญย่อมคู่ควรกับของขวัญ!"
 bp2_yearly.7005.b.tt: "ท่านได้รับฟันหนึ่งซี่"
 bp2_yearly.7005.c: "$bp2_yearly.7003.c$"
 child_teeth_memorabilia: "ฟันน้ำนมของ[nursed_child.GetNamePossessiveNoTooltip]"
 child_teeth_memorabilia_desc: "ฟันน้ำนมซี่แรกที่หลุดของ[nursed_child.GetNamePossessiveNoTooltip]"
 bp2_yearly.7006.t: "การสวมเสื้อผ้า$bp2_yearly.7003.title$"
 bp2_yearly.7006.desc: "ขณะที่ข้ารออย่างอดทนให้คนรับใช้นำเสื้อผ้ามาให้ คนรับใช้คนหนึ่งพูดตะกุกตะกัก: "ใต้เท้า เอ่อ... ไม่มีใครหาเสื้อผ้าของท่านเจอเลยขอรับ!"\n\n"ข้าถูกรายล้อมไปด้วยความไร้ความสามารถ!" ข้าพึมพำ พลางเดินออกจาก[ROOT.Char.Custom('GetChamber')]ของข้าอย่างฉุนเฉียว\n\nใน[ROOT.Char.Custom('GetRoom')]ของ[ROOT.Char.Custom2('RelationToMeShort', nursed_child)] [nursed_child.GetFirstNamePossessive] ข้าไม่เพียง แต่พบเสื้อผ้าของข้าเท่านั้น แต่ยังพบแม่นมของ[nursed_child.Custom('GirlBoyPossessive')]อีกด้วย\n\n"ข้าไม่มีส่วนเกี่ยวข้องนะเพคะ ฝ่าบาท — [nursed_child.GetSheHe] แต่งตัว[nursed_child.GetHerselfHimself]เอง!" [wet_nurse.GetFirstName] ตอบพร้อมกับหัวเราะคิกคัก"
 bp2_yearly.7006.a: "เจ้าตัวแสบน้อย!"
 bp2_yearly.7006.b: "งั้น [nursed_child.GetSheHe] ก็เป็น[nursed_child.Custom('GetPrincessPrince')]แห่งแฟชั่นสินะ?"
 bp2_yearly.7006.c: "$bp2_yearly.7003.c$"
 bp2_yearly.7008.t: "ความขุ่นเคือง$bp2_yearly.7003.title$"
 bp2_yearly.7008.desc_start: ""โอ้ ย้อนกลับไปเมื่อเจ้ายังเป็นเพียงเด็กน้อย! ข้าจะทะนุถนอมวันเหล่านั้นเสมอ" [ROOT.Char.Custom2('RelationToMeShort', reflecting_parent)] ของข้า [reflecting_parent.GetFirstName] กล่าวขึ้นมาโดยไม่มีปี่มีขลุ่ย\n\nทุกสิ่งทุกอย่างพรั่งพรูเข้ามา ข้า#EMP รู้#! ว่า"
 bp2_yearly.7008.desc: "$bp2_yearly.7008.desc_start$ [reflecting_parent.GetSheHe] ไม่เคยใส่ใจข้าเลย ข้า#EMP รู้#! ว่าช่วงเวลาที่น่าขบขันของ[reflecting_parent.GetHerHis]คือการทดลองที่เลวร้ายที่สุดของข้า"
 bp2_yearly.7008.desc_dead_parent: "$bp2_yearly.7008.desc_start$ [ROOT.Char.Custom2('RelationToMeShort', ROOT.Var('nursed_child_parent_var').Char)] ของข้า [ROOT.Var('nursed_child_parent_var').Char.GetFirstName] เป็นศัตรูกับข้าตราบเท่าที่[ROOT.Var('nursed_child_parent_var').Char.GetSheHe]ยังมีชีวิตอยู่"
 bp2_yearly.7008.desc_word: "[ROOT.Var('nursed_child_parent_var').Char.GetSheHe|U] ถึงกับเพิกเฉยต่อคำพูดแรกของข้า!"
 bp2_yearly.7008.desc_step: "[ROOT.Var('nursed_child_parent_var').Char.GetSheHe|U] จากไปอย่างเบื่อหน่าย ขณะที่ข้ากำลังก้าวแรก"
 bp2_yearly.7008.desc_tooth: "[ROOT.Var('nursed_child_parent_var').Char.GetSheHe|U] ถอยหนีด้วยความรังเกียจ จากฟันซี่แรกที่หลุดของข้า!"
 bp2_yearly.7008.desc_dress: "[ROOT.Var('nursed_child_parent_var').Char.GetSheHe|U] เยาะเย้ยความรักในการ แต่งตัวในวัยเด็กของข้า!"
 bp2_yearly.7008.desc_end: "\n\nข้าควรจะได้สิ่งที่ข้าสมควรได้รับ! หรือบางที... ข้าควรหยุดครุ่นคิดถึงอดีตจะดีกว่า?"
 bp2_yearly.7008.a: ""มอบที่ดินของท่านให้ข้า [nursed_child.Custom2('RelationToMeShort', reflecting_parent)]!""
 bp2_yearly.7008.a.tt_good: "[reflecting_parent.GetFirstNameNoTooltip] เห็นด้วยกับท่าน"
 bp2_yearly.7008.a.tt_bad: "[reflecting_parent.GetFirstNameNoTooltip] เสนอบางอย่างอื่นแทน"
 bp2_yearly.7008.b: ""ท่านเป็นหนี้ทรัพย์สมบัติแก่ข้า!""
 bp2_yearly.7008.c: ""ข้าเกลียดท่าน และหวังว่าจะไม่ได้พบท่านอีก!""
 bp2_yearly.7008.c_dead_parent: ""เหตุใดท่านจึงละเลยข้า เช่นนี้!?""
 bp2_yearly.7008.d: "ข้าอยากจะมุ่งเน้นไปที่บุตรของข้าเองมากกว่า"
 bp2_yearly.7008.e: "การปฏิบัติดังกล่าว... ถูกต้องแล้ว"
 bp2_yearly.7008.tt: "[reflecting_parent.GetFirstNameNoTooltip] จะต้องตอบสนอง"
 bp2_yearly.7009.t: "สายสัมพันธ์$bp2_yearly.7003.title$"
 bp2_yearly.7009.desc: "$bp2_yearly.7008.desc_start$ [ROOT.Char.Custom2('RelationToMeShort', reflecting_parent)] ของข้ามองเห็นสิ่งที่ดีที่สุดในตัวข้า พยายามปกป้องข้าเสมอ ช่วงเวลาที่ดีที่สุดในวัยเด็กของข้าคือช่วงเวลาที่อยู่กับ[reflecting_parent.GetHerHim]"
 bp2_yearly.7009.desc_dead_parent: "$bp2_yearly.7008.desc_start$ [ROOT.Char.Custom2('RelationToMeShort', reflecting_parent)] ของข้ามีความผูกพันอย่างลึกซึ้งต่อข้า และ ในขณะที่[ROOT.Char.Custom2('RelationToMeShort', ROOT.Var('nursed_child_parent_var').Char)]ของข้า [ROOT.Var('nursed_child_parent_var').Char.GetFirstName] ยังมีชีวิตอยู่ [ROOT.Var('nursed_child_parent_var').Char.GetSheHe] ก็รักข้าอย่างสุดซึ้ง เช่นกัน"
 bp2_yearly.7009.desc_word: "เป็น[ROOT.Var('nursed_child_parent_var').Char.GetSheHe]ที่ได้ยินคำพูดแรกของข้า"
 bp2_yearly.7009.desc_step: "[ROOT.Var('nursed_child_parent_var').Char.GetSheHe|U] ช่วยข้าก้าวแรก"
 bp2_yearly.7009.desc_tooth: "[ROOT.Var('nursed_child_parent_var').Char.GetSheHe|U] ถึงกับรับฟันน้ำนมของข้าไว้ในมือของ[ROOT.Var('nursed_child_parent_var').Char.GetHerHis]เอง"
 bp2_yearly.7009.desc_dress: "[ROOT.Var('nursed_child_parent_var').Char.GetSheHe|U] สนับสนุนความซุกซน การ แต่งตัวของข้า"
 bp2_yearly.7009.desc_end: "\n\nบางทีข้าควรตอบแทนความรักของ[ROOT.Var('nursed_child_parent_var').Char.GetHerHis]?"
 bp2_yearly.7009.desc_end_dead_parent: "\n\nอย่างไรก็ตาม มันสายเกินไปที่จะขอบคุณ[ROOT.Var('nursed_child_parent_var').Char.GetHerHim] ความกตัญญูของข้ามีเพียงต่อ[ROOT.Char.Custom2('RelationToMe', reflecting_parent)]ของข้าเท่านั้นในตอนนี้"
 bp2_yearly.7009.a: ""ข้ารักท่านมาก [nursed_child.Custom2('RelationToMeShort', reflecting_parent)]""
 bp2_yearly.7009.a.tt_good: "$bp2_yearly.7008.a.tt_good$"
 bp2_yearly.7009.a.tt_bad: "[reflecting_parent.GetFirstNameNoTooltip] ต้องการบางอย่างเป็นการตอบแทน"
 bp2_yearly.7009.b: "ข้าจะส่งต่อความรักความเอาใจใส่ไปยังบุตรของข้า!"
 bp2_yearly.7009.c: "อือฮึ ครอบครัว ความกตัญญู... และอื่นๆ"
 bp2_yearly.7010.t: "$bp2_yearly.7008.t$"
 bp2_yearly.7010.desc_start: "ขณะที่ข้ากำลังหารือกิจการในราชสำนักบางอย่างกับ[ROOT.Char.Custom2('RelationToMeShort', nursed_child)]ของข้า [nursed_child.GetFirstName] [nursed_child.GetSheHe] ก็เริ่มพูดถึงวัยเด็กของ[nursed_child.GetHerHis]อย่างกะทันหัน\n\n"
 bp2_yearly.7010.desc: "$bp2_yearly.7010.desc_start$"[nursed_child.Custom2('RelationToMeShort', ROOT.Char)]ที่รักของข้า ท่านต้องยอมรับ: ท่านไม่เคยใส่ใจข้าเลย แม้ แต่ตอนที่ข้ายังเด็ก"
 bp2_yearly.7010.desc_dead_parent: "$bp2_yearly.7010.desc_start$"โอ้ [nursed_child.Custom2('RelationToMeShort', ROOT.Char)] มันผิดที่จะพูดถึงคนตายในทางไม่ดี แต่ท่านต้องยอมรับว่า[nursed_child.Custom2('RelationToMeShort', nursed_child.MakeScope.Var('nursed_child_parent_var').Char)]ของข้าเป็นบิดา/มารดาที่แย่ที่สุดเท่าที่จะเป็นไปได้!"
 bp2_yearly.7010.desc_word: "คำพูดแรกของข้าถูกเพิกเฉย!"
 bp2_yearly.7010.desc_step: "ก้าวแรกของข้าถูกละเลย!"
 bp2_yearly.7010.desc_tooth: "ฟันซี่แรกที่ข้าหลุดถูกโยนทิ้ง!"
 bp2_yearly.7010.desc_dress: "การ แต่งตัวของข้าถูกเยาะเย้ยอย่างโหดร้าย"
 bp2_yearly.7010.desc_end: "นั่น#EMP คือ#! ความรักหรือ?"\n\n[nursed_child.GetFirstNameNoTooltip] ดิ้นรน ตัวสั่นด้วยอารมณ์ แต่ดูเหมือนจะแน่วแน่"
 bp2_yearly.7010.desc_title: "$bp2_yearly.7008.a$"
 bp2_yearly.7010.desc_gold: "$bp2_yearly.7008.b$"
 bp2_yearly.7010.desc_hate: "$bp2_yearly.7008.c$"
 bp2_yearly.7010.desc_hate_dead_parent: "$bp2_yearly.7008.c_dead_parent$"
 bp2_yearly.7010.a: "ข้ายินดีที่จะพิสูจน์ความสำนึกผิด"
 bp2_yearly.7010.a.tt: "$bp2_yearly.7008.a.tt_good$"
 bp2_yearly.7010.b: ""จากนี้ไป เจ้าจะได้สิ่งที่เจ้าต้องการจากข้า!""
 bp2_yearly.7010.b.tt: "$bp2_yearly.7008.a.tt_bad$"
 bp2_yearly.7010.c: ""โตได้แล้ว""
 bp2_yearly.7010.c.tt: "[reflecting_parent.GetFirstNameNoTooltip] ไม่ได้ใส่ใจจริงๆ"
 bp2_yearly.7011.t: "$bp2_yearly.7009.t$"
 bp2_yearly.7011.desc: "$bp2_yearly.7010.desc_start$"[nursed_child.Custom2('RelationToMeShort', ROOT.Char)|U] ท่านดูแลข้าเหมือนสุนัขดูแลลูกของมัน ดีกว่าเสียอีก ความทรงจำแรกๆ ที่ข้ารักที่สุดคือความทรงจำกับท่าน"
 bp2_yearly.7011.desc_dead_parent: "$bp2_yearly.7010.desc_start$"ในขณะที่[nursed_child.Custom2('RelationToMeShort', nursed_child.MakeScope.Var('nursed_child_parent_var').Char)]ของข้าอยู่กับเรา ข้ารัก[nursed_child.MakeScope.Var('nursed_child_parent_var').Char.GetHerHim]อย่างแท้จริงเสมอมา [nursed_child.MakeScope.Var('nursed_child_parent_var').Char.GetSheHe] และท่านสละเวลาให้ข้าเสมอ"
 bp2_yearly.7011.desc_word: "เมื่อข้าพูดคำแรก!"
 bp2_yearly.7011.desc_step: "เมื่อข้าก้าวแรก!"
 bp2_yearly.7011.desc_tooth: "เมื่อข้าวางฟันซี่แรกที่หลุดไว้ในมือท่าน"
 bp2_yearly.7011.desc_dress: "เมื่อข้าเล่นซนและวิ่งเล่นไปมา!"
 bp2_yearly.7011.desc_end: "ท่านกอดข้าไว้ใกล้ชิดเหลือเกิน"\n\n[nursed_child.GetSheHe|U] หน้าแดง เปล่งประกาย\n\n"
 bp2_yearly.7011.desc_receive_love: "$bp2_yearly.7011.desc_end$$bp2_yearly.7009.a$"
 bp2_yearly.7011.desc_forwarded_love: ""$bp2_yearly.7011.desc_end$"$bp2_yearly.7009.b$""
 bp2_yearly.7011.a: ""และข้ารักเจ้า [ROOT.Char.Custom2('RelationToMeShort', nursed_child)]!""
 bp2_yearly.7011.a.tt: "$bp2_yearly.7009.a.tt_good$"
 bp2_yearly.7011.b: ""ช่างเป็นความภักดีอะไร เช่นนี้!""
 bp2_yearly.7011.b.tt: "$bp2_yearly.7009.a.tt_bad$"
 bp2_yearly.7011.c: ""อย่าครุ่นคิดถึงอดีตเลย""
 bp2_yearly.7011.c.tt: "$bp2_yearly.7010.c.tt$"
 bp2_yearly.7012.t: "น้ำนมแห่งความรักของแม่นม"
 bp2_yearly.7012.desc: "[nursed_child.Custom2('MyCharacterIntroduction', ROOT.Char)|U] เดินโซเซเข้ามา รบกวนการประชุมสภาของข้า และพยายามดึงข้าไปข้างๆ\n\n"[nursed_child.GetFirstNameNoTooltip]! เจ้าไม่ควรอยู่ที่นี่" ข้าคัดค้าน แต่[nursed_child.Custom('GirlBoy')]หน้าแดงและเริ่มตะโกน\n\n"ข้า#EMP เกลียด#! ท่าน! ทำไมทำ เช่นนี้?!" [nursed_child.GetSheHe|U] หยุดสูดจมูก โดยทุกสายตาจับจ้องไปที่[nursed_child.GetHerHim] "ท่านส่ง[former_wet_nurse.GetFirstName]ของข้าไป! นางไม่ใช่แค่แม่นมธรรมดา — ข้ารักนางเหมือนแม่! #EMP มากกว่า#! แม่ของข้าเสียอีก!""
 bp2_yearly.7012.a: "ยกโทษให้ข้าด้วย ข้าจะจ้างนางกลับมา!"
 bp2_yearly.7012.b: "เจ้าควรเคารพการตัดสินใจของ[nursed_child.Custom2('RelationToMePossessive', ROOT.Char)]"
 bp2_yearly.7012.b_win: "ท่านปลอบโยนและอบรม[nursed_child.GetFirstNameNoTooltip]"
 bp2_yearly.7012.b_loss: "[nursed_child.GetFirstNameNoTooltip] ไม่พอใจการครอบงำของท่าน"
 bp2_yearly.7012.c: "เด็กน้อย จงเงียบเสีย!"
 bp2_yearly.7013.t: "ความเศร้าโศกของเด็ก"
 bp2_yearly.7013.desc: "เมื่อเร็วๆ นี้ [nursed_child.GetFirstName] ได้เดินเตร็ดเตร่ไปมา จมอยู่ในความคิดของ[nursed_child.GetHerHis] ในห้องของ[nursed_child.GetHerHis] ข้าพบ[nursed_child.GetHerHim]กำลังร้องไห้ฟุบหน้ากับหมอน \n\n"มีเรื่องอะไรหรือ [ROOT.Char.Custom2('RelationToMeShort', nursed_child)] ของข้า?" ข้าถาม ขณะที่[nursed_child.GetSheHe]เริ่มสงบลง\n\n"จะเกิดอะไรขึ้นเมื่อท่านตาย? ข้าแค่สงสัย.... ว่าแม่นมของข้า [former_wet_nurse.GetFirstName] สบายดีหรือไม่" [nursed_child.GetSheHe|U] สูดจมูกอย่างแรง กลั้นน้ำตา "บางทีนางอาจจะต้องให้นม[ROOT.Char.GetFaith.DevilName]แล้วตอนนี้?"\n\nขณะที่เสียงของ[nursed_child.GetFirstNamePossessiveNoTooltip]สั่นเครือ [nursed_child.GetSheHe] ก็ร้องไห้ออกมา น้ำตาหยดใหญ่ที่สุดและชุ่มฉ่ำที่สุดเท่าที่ข้าเคยเห็น"
 bp2_yearly.7013.a: ""แม่นมคนใหม่ของเจ้าจะ ทำให้ทุกอย่างดีขึ้น!""
 bp2_yearly.7013.a.tt: "กระตุ้น $bp2_decision.0001.t$"
 bp2_yearly.7013.b: ""นางอยู่ใน[nursed_child.GetFaith.PositiveAfterLife]แล้วอย่างแน่นอน""
 bp2_yearly.7013.c: "ตายแล้วก็คือตาย"
 bp2_yearly.7014.t: "การปรากฏตัวที่คุ้นเคย"
 bp2_yearly.7014.desc: "แม่นมของข้า [wet_nurse.GetFirstName] พาข้าเข้านอน กำลังจะดับเทียนสำหรับกลางคืน\n\n"เดี๋ยวก่อน! ข้าอยากจะพูดอะไรบางอย่าง!" ข้าอ้อนวอน "ข้าชอบที่ท่านอยู่ที่นี่... ข้าคงจะรู้สึกเหงามากใน[ROOT.Char.GetCurrentLocation.GetName]หากไม่มีท่าน"\n\n[wet_nurse.GetFirstNameNoTooltip] ดูเหมือนจะไม่สบายใจเล็กน้อยกับเรื่องนี้ แต่ก็รู้สึกซาบซึ้ง\n\n"ข้าเป็นผู้รับใช้ที่อุทิศตน"
 bp2_yearly.7014.desc_faith: "แห่ง[wet_nurse.GetFaith.HighGodName] เช่นเดียวกับที่ท่านจะเป็นในวันหนึ่ง เมื่อท่านเข้มแข็งในศรัทธาของท่าน [wet_nurse.GetFaith.HighGodName] จะนำทางและปลอบโยนท่าน และท่านจะไม่ต้องการข้าอีกต่อไป""
 bp2_yearly.7014.desc_culture: "ชาว[wet_nurse.GetCulture.GetName] เช่นเดียวกับท่าน เราแบ่งปันหัวใจ[wet_nurse.GetCulture.GetEthos.GetNameNoTooltip|l]ของเรา [tradition.GetNameNoTooltip], [tradition_2.GetNameNoTooltip]... นี่คือวิถีของเรา! ไม่ว่าจะยิ่งใหญ่หรือเล็กน้อย เราล้วนเป็นคนดี""
 bp2_yearly.7014.desc_culture_no_trad: "ชาว[wet_nurse.GetCulture.GetName] เช่นเดียวกับท่าน เราแบ่งปันหัวใจ[wet_nurse.GetCulture.GetEthos.GetNameNoTooltip|l]และวิถีโบราณของเรา! ไม่ว่าจะยิ่งใหญ่หรือเล็กน้อย เราล้วนเป็นคนดี""
 bp2_yearly.7014.a: ""ข้าอยากให้ท่านเป็นแม่ของข้า!""
 bp2_yearly.7014.b: "ข้าจะไม่ลืมช่วงเวลานี้"
 parenting_by_example: "การเลี้ยงดูโดยเป็นแบบอย่าง"
 parenting_by_example_desc: "บิดามารดาของตัวละครนี้สอนให้พวกเขาเลี้ยงดูบุตรด้วยความรักและความเอาใจใส่"
 role_model_parent: "บิดามารดาต้นแบบ"
 role_model_parent_desc: "บิดามารดานี้เป็นแรงบันดาลใจให้บุตรของพวกเขารักและดูแลบุตรหลานของตนเอง"
 rites_of_passage_decision: "$bp2_decision.0002.t$"
 rites_of_passage_decision_desc: "เยาวชนในวัยที่กำหนดอาจเข้าร่วมในพิธีเปลี่ยนผ่าน: พิธีกรรมที่บ่งบอกว่าพวกเขาเป็นผู้ใหญ่ที่มีสถานะในชนเผ่า"
 rites_of_passage_decision_effect_tooltip: "เยาวชนเข้าร่วมในหนึ่งใน: $rites_of_passage_duel$, $rites_of_passage_scarification$, $rites_of_passage_seclusion$, $rites_of_passage_shaving$ หรือ การชำระล้างด้วยธาตุ"
 rites_of_passage_decision_confirm: "ถึงเวลาแล้ว"
 rites_of_passage_duel: "การประลอง"
 rites_of_passage_scarification: "การ ทำให้เกิดแผลเป็น"
 rites_of_passage_seclusion: "การปลีกวิเวก"
 rites_of_passage_shaving: "การโกนผม"
 bp2_decision.0002.t: "พิธีเปลี่ยนผ่าน"
 bp2_decision.0002.desc: "กาลเวลานำพาผู้ใหญ่คนใหม่เข้ามาสู่ชนเผ่า[ROOT.Char.GetCulture.GetName] แต่มีเพียงพิธีพิสูจน์เท่านั้นที่สร้างความเป็นผู้ใหญ่ สถานะ และคุณค่า [teentribal.GetFirstName] [ROOT.Char.Custom2('RelationToMeShort',teentribal)]ของข้า อยู่ในวัยที่เหมาะสม ผู้คน[ROOT.Char.GetCulture.GetEthos.GetNameNoTooltip|l]ของเรามีวิธีการทดสอบ[teentribal.GetHerHis]ที่สืบทอดกันมาสามวิธี\n\n"
 bp2_decision.0002.desc_root: "จนกว่าข้าจะอ้างสิทธิ์ในความเป็นผู้ใหญ่ เพื่อนร่วมเผ่า[ROOT.Char.GetCulture.GetCollectiveNoun]ของข้าจะไม่เคารพข้าในฐานะสมาชิกเต็มตัวของชนเผ่า ผู้คนที่มีใจ[ROOT.Char.GetCulture.GetEthos.GetNameNoTooltip|l]ของเรามีพิธีกรรมที่สืบทอดกันมาสามอย่างเพื่อเป็นเครื่องหมายแห่งการเปลี่ยนผ่านสู่วุฒิภาวะ... และพิสูจน์คุณค่าของข้าในฐานะ[ROOT.Char.GetTitleAsName]\n\n"
 bp2_decision.0002.desc_duel: "ในการประลองกับชาว[ROOT.Char.GetCulture.GetName] [teentribal.GetWomanMan] อีกคน เราจะได้รับชัยชนะด้วยทักษะและความแข็งแกร่ง"
 bp2_decision.0002.desc_scarification: "ในการ ทำให้เกิดแผลเป็น ความมุ่งมั่นจะถูกจารึกลงบนผิวหนัง"
 bp2_decision.0002.desc_seclusion: "ในการปลีกวิเวก เราทดสอบความสามารถในการปรับตัวและการมองการณ์ไกล"
 bp2_decision.0002.desc_hair_shaving: "การโกนผมที่สวยงามพิสูจน์ถึงพลังใจ"
 bp2_decision.0002.desc_cleansing: "พลังแห่งการชำระล้างของ$cleansing_type_element$สามารถเผชิญหน้าได้ด้วยความอดทนและความกระตือรือร้นเท่านั้น"
 bp2_decision.0002.desc_end: "\n\nหาก[teentribal.GetFirstNameNoTooltip]ผ่านการทดลองใดๆ เหล่านี้ [teentribal.GetSheHe] จะเป็นที่โปรดปรานในสายพระเนตรของ[ROOT.Char.GetFaith.HighGodName] และได้รับเกียรติในฐานะ[ROOT.Char.GetCulture.GetNameNoTooltip] [teentribal.GetWomanMan] ที่คู่ควร"
 bp2_decision.0002.desc_end_root: "\n\nหากข้าผ่านการทดลองใดๆ เหล่านี้ ข้าจะกลายเป็นผู้คู่ควรในสายพระเนตรของ[ROOT.Char.GetFaith.HighGodName] และเป็น[ROOT.Char.GetCulture.GetNameNoTooltip] [teentribal.GetWomanMan] ที่ได้รับเกียรติ"
