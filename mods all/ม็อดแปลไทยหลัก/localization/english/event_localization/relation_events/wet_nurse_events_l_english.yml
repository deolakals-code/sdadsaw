 bp2_yearly.7021.t: "$bp2_decision.0002.t$: $rites_of_passage_duel$"
 bp2_yearly.7021.desc: "[teentribal.GetWomanMan] ชาว[ROOT.Char.GetCulture.GetName]ต้องเกลียดชังความกลัว ปฏิเสธความอ่อนแอ และคาดหวังที่จะรู้จักความเจ็บปวดในชีวิต\n\n[teentribal.GetFirstName]ผู้อ่อนเยาว์ได้เคยต่อสู้กับเยาวชนรุ่นราวคราวเดียวกัน แต่ไม่เคยต้องเผชิญกับการโจมตีของชาว[ROOT.Char.GetCulture.GetNameNoTooltip]ที่โตเต็มวัย\n\nนักรบผู้แข็งแกร่งในเผ่าของเรามีมากมาย แต่มีเพียงคนเดียวเท่านั้นที่สามารถทดสอบคุณค่าของ[ROOT.Char.Custom2('RelationToMePossessive',teentribal)]ของข้าได้"
 bp2_yearly.7021.desc_root: "นักรบถือกำเนิดจากการต่อสู้ เกิดในกองเลือด\n\nข้าเคยต่อสู้กับเยาวชนรุ่นราวคราวเดียวกัน แต่ไม่เคยสู้กับคู่ต่อสู้ที่คู่ควรอย่างแท้จริง: ชาว[ROOT.Char.GetCulture.GetName]ที่โตเต็มวัย\n\nนักรบผู้แข็งแกร่งในเผ่าของเรามีมากมาย แต่ข้าสามารถท้าทายได้เพียงคนเดียวเพื่อพิสูจน์ความพร้อมของข้า"
 bp2_yearly.7021.a: "[teentribal.GetSheHe|U] เผชิญหน้ากับ[teentribal.Custom2('RelationToMeShort', family_duelist)|l]ของ[teentribal.GetHerHis]!"
 bp2_yearly.7021.a_root: "[teentribal.Custom2('RelationToMeShort', family_duelist)|U] ข้าจะพิสูจน์ตัวเองกับท่าน!"
 bp2_yearly.7021.a.tt: "[teentribal.GetFirstName] ท้าทาย[teentribal.Custom2('RelationToMeShort', family_duelist)|l]ของ[teentribal.GetHerHis] [family_duelist.GetFirstName] ใน[single_combat_duel|E]"
 bp2_yearly.7021.b_root: "ข้าท้าทาย[ROOT.Char.Custom2('RelationToMeShort', duelist_1)]ของข้า [duelist_1.GetFirstNameNoTooltip]!"
 bp2_yearly.7021.b: "[teentribal.GetSheHe|U] จะประลองกับ[teentribal.Custom2('RelationToMeShort', duelist_1)|l]ของข้า [duelist_1.GetFirstNameNoTooltip]!"
 bp2_yearly.7021.b.tt: "[teentribal.GetFirstName] ท้าทาย[duelist_1.GetFirstName]ใน[single_combat_duel|E]"
 bp2_yearly.7021.c: "[duelist_2.GetFirstNameNoTooltip] ผู้[duelist_2.Custom('ComplimentAdjective')] — ออกมา!"
 bp2_yearly.7021.c_root: "ข้าอยากจะสู้กับ[ROOT.Char.Custom2('RelationToMeShort', duelist_2)]ของข้า [duelist_2.GetFirstNameNoTooltip] มากกว่า"
 bp2_yearly.7021.c.tt: "[teentribal.GetFirstName] ท้าทาย[duelist_2.GetFirstName]ใน[single_combat_duel|E]"
 bp2_yearly.7021.d: "$bp2_decision.0002.f$"
 bp2_yearly.7021.d.tt: "$bp2_decision.0002.cooldown$"
 bp2_yearly.7022.t: "$bp2_decision.0002.t$: การ$rites_of_passage_duel$ได้ต่อสู้กันแล้ว"
 bp2_yearly.7022.desc_child_win: "เมื่อพรของ[ROOT.Char.GetFaith.PriestNeuter]สิ้นสุดลง อาวุธของผู้ท้าชิงก็กระทบกัน ประสบการณ์ของ[sc_loser.GetFirstNamePossessive] ทำให้[sc_loser.GetHerHim]ได้เปรียบทันที — แต่ถึงกระนั้น [sc_loser.GetSheHe] ก็ไม่สามารถปัดป้องการโจมตีอันชาญฉลาดของ[sc_victor.GetFirstNamePossessive]ได้นานนัก\n\n[ROOT.Char.Custom2('RelationToMe',teentribal)]ของข้า ทำให้[sc_loser.GetFirstNameNoTooltip]ล้มลง\n\n"ข้ายอมแพ้!" [sc_loser.GetWomanMan]ผู้สูงวัยกว่าคร่ำครวญ "[sc_victor.GetFirstNameNoTooltip] ทุบข้อนิ้วของข้าและ ทำให้ข้าตาบอดด้วยเลือด: [sc_victor.GetSheHe] เป็นนักรบเต็มตัว เช่นเดียวกับคนอื่นๆ เป็น[ROOT.Char.GetCulture.GetName] [sc_victor.GetWomanMan] ที่คู่ควรที่สุด!"\n\nพิธีกรรมจึงเสร็จสมบูรณ์"
 bp2_yearly.7022.desc_child_lost: "เครื่องเซ่นไหว้เพิ่งถูกประพรมเพียงเล็กน้อย [sc_loser.GetFirstName] ก็เปิดฉากโจมตีอย่างดุเดือด! ภายใต้ห่าอาวุธ ประสบการณ์ของ [sc_victor.GetFirstNamePossessive] ก็บังเกิดผล: [sc_victor.GetSheHe] ยืนหยัดผ่านพายุนี้ไปได้ [ROOT.Char.Custom2('RelationToMe',teentribal)] ผู้อ่อนเยาว์ของข้า เริ่มอ่อนแรงในไม่ช้า ทุ่มสุดกำลังในการต่อสู้... แต่จบพิธีกรรมนี้ด้วยคมเหล็กที่จ่อคอหอยของ [sc_loser.GetHerHis]\n\nเมื่อเห็นประกายไฟในดวงตาของคู่ต่อสู้ของ [sc_victor.GetHerHis] [sc_victor.GetFirstNameNoTooltip] ก็แสดงความเมตตา\n\n\"นี่คือ [sc_loser.GetWomanMan] ที่อยู่เบื้องหน้าข้า! การดิ้นรนต่อสู้ มิใช่ชัยชนะต่างหาก ที่ ทำให้ [sc_loser.GetHerHim] มีที่ยืนในหมู่พวกเรา [sc_loser.GetFirstNameNoTooltip] ได้แสดงให้เห็นถึงความกล้าหาญของนักรบและคุณธรรมแห่ง [ROOT.Char.GetCulture.GetName]\""
 bp2_yearly.7022.desc_root_win: ""พอแล้ว!" [sc_loser.GetFirstName] หอบหายใจ โยน[sc_loser.Custom('SignatureWeaponNameOrType')]ของ[sc_loser.GetHerHis]ลงบนพื้นดิน "สังหารข้าในฐานะ[ROOT.Char.GetWomanMan]ผู้ทรงเกียรติ! ข้าคงละอายใจหากต้องตายด้วยน้ำมือของ[teentribal.Custom('GirlBoy')]"\n\n"แต่ — #EMP ข้ากำลังพูดอะไรอยู่?!# ท่านต่อสู้เหมือน[ROOT.Char.GetWomanMan]ที่เหมาะสมแล้ว เหมือน[ROOT.Char.GetTitleAsName]: ผู้ที่จะรู้จักอำนาจ รู้จักชัยชนะ! ข้าจะพูดแทนท่าน และดูแลให้สิทธิพิเศษของท่านเพิ่มพูนขึ้น"\n\nมันเสร็จสิ้นแล้ว ด้วยคุณธรรมแห่ง[ROOT.Char.Custom('SignatureWeaponNameOrType')]ของข้า ข้าได้รับการพิสูจน์แล้ว"
 bp2_yearly.7022.desc_root_lost: "แม้ว่าข้าจะไม่สามารถเทียบชั้นความเก๋าของ[sc_victor.GetFirstName]ได้... พิธีกรรมจะจบลง เช่นนี้ไม่ได้! ข้าพยายามดิ้นรนลุกขึ้นยืน เตรียมพร้อม และข้าก็ถูกปลดอาวุธ ข้าไล่ตามอาวุธของข้า แต่ศัตรูขวางทางข้าไว้ #EMP มันจะจบลงเช่นนี้ไม่ได้!#! \n\n[sc_victor.GetFirstNameNoTooltip] จ้องมองข้าอย่างขบขัน\n\n"หยุดก่อน [ROOT.Char.Custom('RegionalFerociousAnimal')]หนุ่ม! [ROOT.Char.GetTitleAsName]ของข้า ความดุร้ายของท่านคือความดุร้ายของ[ROOT.Char.Custom( 'KnightCultureNoTooltipLowercase' )]ชาว[ROOT.Char.GetCulture.GetName]! ท่านได้ต่อสู้อย่างกล้าหาญ และ — ไม่ว่าจะพ่ายแพ้หรือไม่ — ข้าให้เกียรติท่านในฐานะสมาชิกของเผ่า"\n\n"ผลลัพธ์นี้จะได้รับการยอมรับ""
 bp2_yearly.7022.toast: "การประลองหล่อหลอม[teentribal.GetFirstNameNoTooltip]"
 bp2_yearly.7022.a: "นี่คือความมุ่งมั่นของตระกูล[teentribal.GetHouse.GetBaseNameNoTooltip]!"
 bp2_yearly.7022.a_victory: "การชนะคือการได้รับความมั่นใจในฝีมือนักรบ และในตนเอง"
 bp2_yearly.7022.a_loss: "[teentribal.GetFirstNameNoTooltip] จะไม่มีวันลืมความพ่ายแพ้นี้... และ[teentribal.GetSheHe]จะได้เรียนรู้ว่าความดื้อรั้นของ[teentribal.GetHerHis]มีประโยชน์นอกเหนือจากในสนามรบ"
 bp2_yearly.7022.b: "เผ่าจะได้รับยอดฝีมือคนใหม่"
 bp2_yearly.7022.b_victory: "ยังมีกลเม็ดอีกมากมายที่ต้องเรียนรู้ แต่นี่เป็นการเริ่มต้นที่ดี!"
 bp2_yearly.7022.b_loss: "[teentribal.GetFirstNameNoTooltip] ต้องอุทิศตนให้กับการฝึกฝน เพื่อการประลองที่ดีขึ้นในอนาคต!"
 bp2_yearly.7022.c: "การต่อสู้ที่นองเลือด! การต่อสู้ที่#EMP นองเลือด#! อย่างยิ่ง..."
 bp2_yearly.7022.c_victory: "ความปิติยินดีบางอย่างเกิดขึ้น ความคลั่งไคล้อันชั่วร้ายบางอย่างตื่นขึ้น... พร้อมกับการไหลของเลือด"
 bp2_yearly.7022.c_loss: "ข้าเห็นคนนับเสบียงที่นี่ ไม่ใช่นักสู้... หาก[teentribal.GetFirstNameNoTooltip]ต้องการมีชีวิตยืนยาว"
 bp2_yearly.7023.t: "$bp2_decision.0002.t$: $rites_of_passage_scarification$"
 bp2_yearly.7023.desc: "[ROOT.Char.GetCulture.GetCollectiveNoun]ในเผ่าของข้ารวมตัวกันเพื่อชมพิธีกรรม ทำให้เกิดแผลเป็น ด้วยควันสมุนไพรศักดิ์สิทธิ์ที่คละคลุ้งในอากาศ [ROOT.Char.GetCouncillorPosition( 'councillor_court_chaplain' ).GetPositionName]ของข้า [priest.GetFirstName] เริ่มพิธี ผู้ที่มาชุมนุมต่างเงียบสงัด\n\n[priest.GetSheHe|U] ชักใบมีดในพิธีกรรมออกมา\n\n"ณ ที่นี้ [teentribal.GetFirstName] แห่งตระกูล[teentribal.GetHouse.GetName]" [priest.GetWomanMan]ผู้ศักดิ์สิทธิ์กล่าวเสียงเรียบ "จะถูกทำเครื่องหมายและสับ เฉือนด้วยความเจ็บปวด เมื่อเรามองดู[teentribal.GetHerHim]ในวันข้างหน้า เราจะเห็นความเชื่อมั่น — เราจะเห็นว่า[teentribal.GetSheHe]คือ[teentribal.GetWomanMan]!""
 bp2_yearly.7023.a: "การสวมใส่ข้อพิสูจน์คือการรู้จักความภาคภูมิใจ"
 bp2_yearly.7023.a.tt: "[priest.GetFirstNameNoTooltip] กรีดอย่างแรง ครั้งแล้วครั้งเล่า"
 bp2_yearly.7023.a_nothing: "รอยกรีดสะอาด"
 bp2_yearly.7023.a_scarred: "รอยกรีดทิ้งรอยแผลเป็นถาวร"
 bp2_yearly.7023.a_wounded: "รอยกรีดลึกอย่างโหดเหี้ยม"
 bp2_yearly.7023.b: "บางทีนี่อาจเป็นแค่... สัญลักษณ์?"
 bp2_yearly.7023.b.tt: "[priest.GetFirstNameNoTooltip] ใช้ใบมีดอย่างนุ่มนวล ทำให้เกิดรอยเพียงเล็กน้อย"
