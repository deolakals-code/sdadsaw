l_english: 
 vassal.1001.t:0 "ตามประสงค์แห่ง [ROOT.Char.GetFaith.HighGodName|U]"
 vassal.1001.desc:0 "ข้าหลวงทางศาสนาของข้า [ROOT.Char.Custom2('RelationDescriptor', SCOPE.sC('religious_liege'))] [religious_liege.GetTitledFirstName] กำลังเสด็จผ่านอาณาเขตของข้า ขณะที่ [religious_liege.GetSheHe] ทอดพระเนตรอาคารต่างๆ [religious_liege.GetSheHe] [ROOT.Char.Custom2('QuirkPresentPosOrNeg', SCOPE.sC('religious_liege'))] และขมวดพระขนง\n\n"ท่านรู้หรือไม่ว่าสิ่งใดขาดหายไปจากทิวทัศน์นี้? [religious_liege.GetFaith.HouseOfWorship] – เครื่องบรรณาการอันรุ่งโรจน์แด่ [religious_liege.GetFaith.HighGodName]!""
 vassal.1001.a:0 "ข้าขอสัญญา [ROOT.Char.GetFaith.HouseOfWorship] จะต้องถูกสร้างขึ้น!"
 vassal.1001.a.tt:0 "#F [religious_liege.GetFirstNameNoTooltip] จะจดจำคำสัญญา และเป็นหนี้ [favor|E] แก่ข้าหากสำเร็จภายในสิบปี#!"
 vassal.1001.b_zealous:0 "ท่านคิดว่าตนเป็นใคร ถึงมากล่าวแทน [ROOT.Char.GetFaith.HighGodName]?!"
 vassal.1001.b:0 "สิ่งนั้นหาจำต้องมีไม่"

 vassal.1010.desc:0 ""ครานี้ท่านทำได้เหนือความคาดหมายยิ่งนัก [ROOT.Char.GetFirstNameNoTooltip] ช่างเป็นอาคารที่งดงามอย่างแท้จริง" [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('religious_liege'))] ของข้า [religious_liege.GetTitledFirstName] [religious_liege.Custom('quirk_pos_present')] และผายมือไปยัง [religious_liege.GetFaith.HouseOfWorship] ที่เพิ่งสร้างเสร็จใหม่\n\n"ข้ามั่นใจว่า [religious_liege.GetFaith.HighGodName] ทรงประทับใจไม่น้อยไปกว่าข้า!""
 vassal.1010.a:0 "ข้ามีชีวิตอยู่เพียงเพื่อรับใช้ [religious_liege.GetFaith.HighGodName] เท่านั้น"

 vassal.1020.desc_religious:0 ""ไม่นึกว่า [ROOT.Char.GetWomanMan] ผู้ศรัทธา เช่นท่านจะให้คำสัญญาเลื่อนลอย... มิหนำซ้ำยังเกี่ยวกับเรื่องสร้าง [religious_liege.GetFaith.HouseOfWorship] ถวายแด่ [religious_liege.GetFaith.HighGodName] เสียด้วย!""
 vassal.1020.desc_not_as_religious:0 ""ท่านโกหกข้า [ROOT.Char.GetFirstNameNoTooltip]... มิหนำซ้ำยังเกี่ยวกับเรื่องสร้าง [religious_liege.GetFaith.HouseOfWorship] ถวายแด่ [religious_liege.GetFaith.HighGodName] เสียด้วย!""
 vassal.1020.desc:0 "\n\n[ROOT.Char.Custom2('RelationToMe', SCOPE.sC('religious_liege'))] ของข้า [religious_liege.GetTitledFirstName] ไม่ได้ปิดบังความไม่พอใจของ [religious_liege.GetHerHis] ขณะที่ [religious_liege.GetSheHe] [religious_liege.Custom('quirk_neg_present')]"
 vassal.1020.a:0 "ผิดพลาดเป็นเรื่องปุถุชน!"
 vassal.1020.a_religious:0 "ข้าหวังว่า [religious_liege.GetFaith.HighGodName] จะทรงอภัยให้ข้า..."
 vassal.1020.a.tt:0 "#F บางทีข้าน่าจะรักษาสัญญาและสร้าง [THIS.Char.GetFaith.HouseOfWorship] นั่นเสีย...#!"

 vassal.1101.desc:0 ""[ROOT.Char.Custom('FormOfAddressForLiege')|U], ข้าสังเกตเห็นว่ายังมีพื้นที่สำหรับ [religious_vassal.GetFaith.HouseOfWorship] ในดินแดนของท่าน"\n\n[religious_vassal.GetTitledFirstName] [ROOT.Char.Custom2('RelationDescriptor', SCOPE.sC('religious_vassal'))] [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('religious_vassal'))] ของข้า, [ROOT.Char.Custom2('QuirkPresentPosOrNeg', SCOPE.sC('religious_vassal'))] ก่อนจะกล่าวต่อ, "หากท่านสร้างขึ้น ท่านจะได้รับความกตัญญูจาก[religious_vassal.GetFaith.HighGodNameAlternatePossessive] อย่างแน่นอน, เช่นเดียวกับของข้า""
 vassal.1101.a.tt:0 "#F [religious_vassal.GetFirstNameNoTooltip] จะจดจำคำสัญญา และเป็นหนี้ [favor|E] แก่ข้าหากสำเร็จภายในสิบปี#!"

 vassal.1110.desc:0 ""ครั้งนี้ท่านทำได้ยอดเยี่ยมยิ่งนัก, [ROOT.Char.Custom('FormOfAddressForLiege')] มันเป็นอาคารที่งดงามอย่างแท้จริง" [religious_vassal.GetTitledFirstName] [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('religious_vassal'))] ของข้า, [religious_vassal.Custom('quirk_pos_present')] และผายมือไปยัง [religious_vassal.GetFaith.HouseOfWorship] ที่สร้างขึ้นใหม่\n\n"ข้ามั่นใจว่า [religious_vassal.GetFaith.HighGodName] ก็ประทับใจ เช่นเดียวกับข้า!""
 vassal.1110.a:0 "ข้ามีชีวิตอยู่เพื่อรับใช้ [religious_vassal.GetFaith.HighGodName]"

 vassal.1120.desc_religious:0 ""ไม่นึกว่า [ROOT.Char.GetWomanMan] ผู้ศรัทธา เช่นท่านจะให้คำสัญญาเลื่อนลอย... มิหนำซ้ำยังเกี่ยวกับเรื่องสร้าง [religious_vassal.GetFaith.HouseOfWorship] ถวายแด่ [religious_vassal.GetFaith.HighGodName] เสียด้วย!""
 vassal.1120.desc_not_as_religious:0 ""[ROOT.Char.Custom('FormOfAddressForLiege')|U], ท่านโกหกข้า... และยังเป็นเรื่องการสร้าง [religious_vassal.GetFaith.HouseOfWorship] ถวาย [religious_vassal.GetFaith.HighGodName] เสียด้วย!""
 vassal.1120.desc:0 "[ROOT.Char.Custom2('RelationToMe', SCOPE.sC('religious_vassal'))] ของข้า [religious_vassal.GetTitledFirstName] [religious_vassal.Custom('quirk_neg_present')] และส่ายหน้า\n\n"ขอ [religious_vassal.GetFaith.HighGodNameAlternate|U] ทรงอภัยให้ท่านเถิด""
 vassal.1120.a:0 "ผิดพลาดเป็นเรื่องปุถุชน!"
 vassal.1120.a.tt:0 "#F บางทีข้าน่าจะรักษาสัญญาและสร้าง [THIS.Char.GetFaith.HouseOfWorship] นั่นเสีย...#!"

 vassal.2001.t:0 "สั่งสอนเยาวชน"
 vassal.2001.desc:0 ""[ROOT.Char.Custom('FormOfAddressForLiege')|U], ข้าคิดว่า [child_to_educate.GetFirstName] ผู้น้อยจะสามารถเรียนรู้ได้มาก หาก[child_to_educate.GetSheHe] ได้มีโอกาสศึกษาภายใต้การดูแลของท่าน"\n\n[vassal_proposing_education.Custom2('RelationToMe', SCOPE.sC('child_to_educate'))] ของ [vassal_proposing_education.GetTitledFirstNamePossessive] [ROOT.Char.Custom2('QuirkPresentPosOrNeg', SCOPE.sC('child_to_educate'))] ก่อนจะโบกมือให้พวกเรา"
 vassal.2001.a:0 "แน่นอน ข้าจะอบรมสั่งสอน [child_to_educate.Custom('GirlBoy')] ผู้นี้เอง"
 vassal.2001.b:0 "[child_to_educate.Custom('GetDaughterSon')] ของท่านเป็นความรับผิดชอบของท่าน!"

 vassal.2101.t:0 "นักเลี้ยงผู้กระตือรือร้น"
 vassal.2101.desc:1 ""หลายเดือนผ่านไปแล้วนับ แต่เหล่าขุนนางและท่านหญิงแห่งอาณาจักรมารวมตัวกันในงานเลี้ยง เจ้าเหนือหัว [ROOT.Char.GetTitleTierName] ของข้า"\n\n[party_vassal.GetTitledFirstName] [ROOT.Char.Custom2('QuirkAdverbPosOrNeg', party_vassal)] กล่าวต่อ "การแก้ไขสถานการณ์นี้โดยเร็วจะเป็นประโยชน์ต่อท่าน — ไม่ต้องพูดถึงพวกเราที่ชื่นชอบงานเลี้ยงดีๆ!""
 vassal.2101.a:0 "ข้าสัญญาว่าจะจัดงานเลี้ยงในเร็ววัน!"
 vassal.2101.a_hyped:0 "แน่นอน เราควรจัดงานเลี้ยง! ข้าไม่รู้ว่ารออะไรอยู่ตั้งนาน"
 vassal.2101.a.tt:0 "#F [party_vassal.GetFirstNameNoTooltip] จะจดจำคำสัญญาที่ข้าให้ไว้ และจะรู้สึกขอบคุณหากสำเร็จภายในสิบปี#!"
 vassal.2101.b:0 "ข้าจะจัดงานเลี้ยงเมื่อข้ารู้สึกอยากจัด"
 vassal.2101.b_arrogant:0 "ท่านคิดว่าตนเป็นใคร?!"
 vassal.2101.b_greedy:0 "ท่านรู้หรือไม่ว่ามันต้องใช้เงินเท่าใด?!"
 vassal.2101.b_lazy:0 "ข้ามั่นใจว่าข้าจะทำมันในที่สุด..."
 vassal.2101.b_shy:0 "งานเลี้ยง? กับผู้คน? ข้าไม่คิด เช่นนั้น..."

 vassal.2110.desc:0 ""[ROOT.Char.Custom('FormOfAddressForLiege')|U]! ครั้งนี้ท่านทำได้ยอดเยี่ยมจริงๆ!"\n\n[party_vassal.GetTitledFirstName] [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('party_vassal'))] ของข้า ดูเหมือนจะยังไม่ฟื้นจากงานเลี้ยงที่ข้าสัญญาไว้กับ[party_vassal.GetHerHim] แต่[party_vassal.GetSheHe] ก็ยังอารมณ์ดี"
 vassal.2110.a:0 "มันเป็นงานเลี้ยงที่น่าจดจำอย่างแท้จริง!"

 vassal.2120.desc_party:0 ""ไม่นึกว่า [ROOT.Char.GetWomanMan] ผู้ทุ่มเทให้กับช่วงเวลาดีๆ เช่นท่านจะให้คำสัญญาเลื่อนลอย... ข้าต้องยอมรับว่าข้าผิดหวัง""
 vassal.2120.desc_regular:0 ""ไม่นึกว่า [ROOT.Char.GetWomanMan] [party_vassal.Custom2('DescriptorPositive', ROOT.Char)] เช่นท่านจะให้คำสัญญาเลื่อนลอย... ข้าต้องยอมรับว่าข้าผิดหวัง""
 vassal.2120.desc:0 "\n\n[ROOT.Char.Custom2('RelationToMe', SCOPE.sC('party_vassal'))] ของข้า [party_vassal.GetTitledFirstName] [party_vassal.Custom('quirk_neg_present')] และส่ายหน้า"
 vassal.2120.a:0 "ข้าคงลืมไป!"

 vassal.2201.t:0 "การช่วยเหลือทางการเงิน"
 vassal.2201.desc:0 ""เจ้าเหนือหัว [ROOT.Char.GetTitleTierName] ของข้า ข้าอดสังเกตมิได้ว่าท่านอาจได้รับประโยชน์จากความช่วยเหลือทางการเงินบางอย่าง"\n\n[ROOT.Char.Custom2('RelationToMe', SCOPE.sC('vassal_loan_holder'))] ของข้า [vassal_loan_holder.GetTitledFirstName] [vassal_loan_holder.Custom('quirk_pos_present')] ขณะที่ [vassal_loan_holder.GetSheHe] เสนอข้อตกลง: เงินกู้เพื่อแบ่งเบาภาระในคลังของข้า"
 vassal.2201.a:0 "ข้าขอบคุณในความช่วยเหลือของท่าน [vassal_loan_holder.GetFirstNameNoTooltip]"
 vassal.2201.a.money_loan_tooltip:0 "ข้าจะยืม [gold_i] #bold [THIS.Var('amount_to_loan_root').GetValue]#! ทอง จาก [vassal_loan_holder.GetFirstNameNoTooltip]"
 vassal.2201.a.repay_loan:0 "ข้าจะต้องใช้การตัดสินใจ #bold ชำระคืนเงินกู้#! เพื่อชำระคืนเงินกู้"
 vassal.2201.b:0 "ข้าไม่ได้ #EMP สิ้นไร้หนทาง#! ขนาดนั้น!"

 vassal.2205.desc_inherited:0 ""[ROOT.Char.Custom('FormOfAddressForLiege')|U], [vassal_loan_holder.Custom2('RelationToMe', SCOPE.sC('original_lender'))] ผู้ล่วงลับของข้าเคยให้ท่านกู้ยืมเงิน"\n\n[vassal_loan_holder.GetTitledFirstName] [ROOT.Char.Custom2('QuirkPresentPosOrNeg', SCOPE.sC('vassal_loan_holder'))] ก่อนจะกล่าวต่อ "ในฐานะผู้สืบทอดของ[vassal_loan_holder.GetHerHis] ข้าจึงมาขอให้ท่านชำระคืนเงินกู้นั้น""
 vassal.2205.desc_inherited_loan:0 ""[ROOT.Char.Custom('FormOfAddressForLiege')|U], ข้าเคยให้ [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('original_loaner'))] ผู้ล่วงลับของท่านยืมทองคำจำนวนหนึ่ง"\n\n[vassal_loan_holder.GetTitledFirstName] [ROOT.Char.Custom2('QuirkPresentPosOrNeg', SCOPE.sC('vassal_loan_holder'))] ก่อนจะกล่าวต่อ "ในฐานะผู้สืบทอดของ[vassal_loan_holder.GetHerHis] หน้าที่ในการชดใช้หนี้สินนั้นจึงตกอยู่กับท่าน""
 vassal.2205.desc_all_new_char:0 ""[ROOT.Char.Custom('FormOfAddressForLiege')|U], [vassal_loan_holder.Custom2('RelationToMe', SCOPE.sC('original_lender'))] ผู้ล่วงลับของข้าเคยให้ [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('original_loaner'))] ของท่านยืมทองคำจำนวนหนึ่ง"\n\n[vassal_loan_holder.GetTitledFirstName] [ROOT.Char.Custom2('QuirkPresentPosOrNeg', SCOPE.sC('vassal_loan_holder'))] ก่อนจะกล่าวต่อ "ในฐานะผู้สืบทอดของ[vassal_loan_holder.GetHerHis] หน้าที่ในการชดใช้หนี้สินนั้นจึงตกอยู่กับท่าน""
 vassal.2205.desc_first_time:0 ""[ROOT.Char.Custom('FormOfAddressForLiege')|U], ข้าเชื่อว่าเงินกู้นั้นเป็นประโยชน์?"\n\n[vassal_loan_holder.GetTitledFirstName] ได้มาทวงถาม, ขอชำระคืนทองคำที่[vassal_loan_holder.GetSheHe] มอบให้ข้า"
 vassal.2205.desc_second_time:0 ""[ROOT.Char.Custom('FormOfAddressForLiege')|U], ข้าไม่สนุกกับเกมนี้เลย ท่านเป็นหนี้ข้า, และข้าเชื่อว่าสัญญาของท่านที่จะชดใช้คืนนั้นไม่ใช่คำโกหก"\n\n[vassal_loan_holder.GetTitledFirstName] [vassal_loan_holder.Custom('quirk_neg_present')] ขณะที่เขายืนอยู่ต่อหน้าข้าเป็นครั้งที่สอง"
 vassal.2205.desc_three_times:0 ""ข้าเริ่มเบื่อหน่ายกับเรื่องนี้แล้ว, [ROOT.Char.Custom('FormOfAddressForLiege')]! นี่เป็นครั้งสุดท้ายที่ข้าจะถามท่านดีๆ; เงินที่ท่านติดหนี้ข้าอยู่ที่ไหน?"\n\n[vassal_loan_holder.Custom('quirk_neg_pp')|U], [vassal_loan_holder.GetTitledFirstName] เปล่งประกายความไม่พอใจ, ความอดทนของ[vassal_loan_holder.GetHerHis] หมดสิ้นแล้ว"
 vassal.2205.desc_more_times:0 ""หากข้ารู้ว่าท่านเป็น[ROOT.Char.Custom2('InsultNoun', SCOPE.sC('vassal_loan_holder'))] [ROOT.Char.Custom2('InsultAdjectiveArticle', SCOPE.sC('vassal_loan_holder'))] ไม่ซื่อสัตย์ เช่นนี้ ข้าคงไม่เคยช่วยเหลือท่าน"\n\nเงินในคลังของข้าแทบไม่ช่วยปลอบโยนเลย ขณะที่[vassal_loan_holder.GetTitledFirstNamePossessive] [vassal_loan_holder.Custom('quirk_neg_present')] ก่อนจะเดินจากไป"
 vassal.2205.z:0 "นี่! เอาไปแล้วไปให้พ้น!"
 vassal.2205.a:0 "แน่นอน ท่านจะได้ทองของท่านคืน!"
 vassal.2205.a.tt:0 "#F ข้าควรจ่ายคืน [vassal_loan_holder.GetHerHim] โดยเร็วที่สุด!#!"
 vassal.2205.b:0 "อย่ามารบกวนข้าด้วยเรื่องเล็กน้อย เช่นนี้"
 vassal.2205.c_greedy:0 "ข้ากำลังหลอกใครอยู่? ทองคำนี่มันช่างปลอบใจได้ดีจริงๆ!"
 vassal.2205.c:0 "แต่มันก็เป็นเงินจำนวนมากนะ..."

 vassal.2301.t:0 "[ROOT.Char.Custom2('RelationToMe', SCOPE.sC('skilled_vassal'))|U] ผู้มีทักษะของข้า"
 vassal.2301.desc_opening:1 "[skilled_vassal.Custom2('MyCharacterIntroduction', ROOT.Char)|U] ได้พิสูจน์ให้เห็นว่า [skilled_vassal.GetHerselfHimself] มีความสามารถสูงยิ่ง,"
 vassal.2301.desc_diplomacy:0 "โดยเฉพาะอย่างยิ่งในเรื่องที่เกี่ยวกับการทูต"
 vassal.2301.desc_martial:0 "โดยเฉพาะอย่างยิ่งในเรื่องการทหาร"
 vassal.2301.desc_stewardship:0 "โดยเฉพาะอย่างยิ่งในเรื่องการบริหาร"
 vassal.2301.desc_intrigue:0 "โดยเฉพาะอย่างยิ่งในเรื่อง #EMP ลับเฉพาะ#!"
 vassal.2301.desc_learning:0 "โดยเฉพาะอย่างยิ่งในเรื่องวิชาการ"
 vassal.2301.desc_ending:1 "\n\n"มีโครงการบางอย่างที่ข้าอยากจะดำเนินการใน [develop_county.GetName] เจ้าเหนือหัวของข้า แน่นอนว่าต้องได้รับพรจากท่าน""
 vassal.2301.a:2 "รับช่วงต่อเลย [skilled_vassal.GetFirstNameNoTooltip]!"
 vassal.2301.b_diplomacy:0 "ไม่ #EMP ท่าน#! ต้องยอมรับความเชี่ยวชาญทางการทูตของข้าแทน"
 vassal.2301.b_martial:0 "ความกล้าหาญทางทหารรึ? หึ! ข้าจะทำการปรับเปลี่ยนเหล่านี้ #EMP ด้วยตนเอง#!"
 vassal.2301.b_stewardship:0 "ข้าสามารถจัดการปัญหาด้านการบริหารนี้ได้ด้วยตนเอง"
 vassal.2301.b_intrigue:0 "ข้าคิดว่า #EMP ข้า#! ควรจัดการเรื่องละเอียดอ่อน เช่นนี้"
 vassal.2301.b_learning:0 "ข้ามีคุณสมบัติเหมาะสมกว่ามากในการจัดการปัญหานี้"
 vassal.2301.c:0 "ข้าหลวงไม่ควรทำการโดยพลการ เช่นนี้"

 vassal.2401.t:0 "ความหวังอันริบหรี่"
 vassal.2401.desc_family:0 ""[ROOT.Char.Custom2('RelationToMe', SCOPE.sC('vassal_needs_gold'))|U] ข้าต้องการเงินทุนบางส่วน""
 vassal.2401.desc_other:0 ""[ROOT.Char.Custom('FormOfAddressForLiege')|U] – [ROOT.Char.GetTitleTierName] ของข้า – ข้าต้องการเงินทุนบางส่วน""
 vassal.2401.desc:0 "\n\n[ROOT.Char.Custom2('RelationToMe', SCOPE.sC('vassal_needs_gold'))] ของข้า [vassal_needs_gold.GetTitledFirstName] มองข้า [ROOT.Char.Custom2('QuirkAdverbPosOrNeg', SCOPE.sC('vassal_needs_gold'))] ก่อนกล่าวต่อ "ข้ายินดีที่จะยอมผ่อนปรน... ได้โปรด ข้ารู้ว่าท่านมีหนทางที่จะช่วยข้าได้!""
 vassal.2401.a:0 "ทองแลกกับ [possible_county.GetNameNoTierNoTooltip] ก็สมเหตุสมผล ใช่หรือไม่?"
 vassal.2401.b:0 "ท่านได้รับประโยชน์จากสัญญาที่ #EMP ได้เปรียบอย่างยิ่ง#! มาตลอด..."
 vassal.2401.c:0 "ท่านจัดการเรื่องเงินทองของตัวเองไม่ได้หรือ?!"

 vassal.2451.t:0 "สัญญาที่ดีกว่า"
 vassal.2451.desc:0 "[ROOT.Char.Custom2('RelationToMe', SCOPE.sC('negotiating_vassal'))] ของข้า [negotiating_vassal.GetTitledFirstName] เข้ามาหาข้าพร้อมรอยยิ้ม [ROOT.Char.Custom2('QuirkAdjectivePosOrNeg', SCOPE.sC('negotiating_vassal'))]\n\n"ข้าจะขอบคุณมากหากเราสามารถ... เจรจาสัญญาของข้าใหม่ได้ เจ้าเหนือหัว [ROOT.Char.GetTitleTierName] ของข้า การปรับปรุงใดๆ แน่นอนว่าจะได้รับการตอบรับอย่างกระตือรือร้นจากคลังหรือดินแดนของข้า""
 vassal.2451.a:0 "ข้า #EMP สนใจ#! ใน [possible_county.GetNameNoTierNoTooltip] มาตลอด..."
 vassal.2451.b:0 "คลังของข้าต้องการการเติมเต็ม นั่นแน่นอน"
 vassal.2451.c:0 "ท่านจะไม่พบข้อตกลงใดๆ ที่นี่ [negotiating_vassal.GetFirstNameNoTooltip]"

 vassal.2501.t:0 "คำร้องขอสันติภาพ"
 vassal.2501.desc:0 ""[ROOT.Char.Custom('FormOfAddressForLiege')|U], สงครามครั้งนี้..." [peaceful_vassal.GetTitledFirstName] [ROOT.Char.Custom2('RelationDescriptor', SCOPE.sC('peaceful_vassal'))] [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('peaceful_vassal'))] ของข้า, ถอนหายใจก่อนกล่าวต่อ, "มันหนักหนาสำหรับกองทหาร — หนักหนาสำหรับเราทุกคน ข้าต้องยอมรับว่าข้ามีความสงสัย"\n\nบางทีข้าควรทำอะไรสักอย่างเพื่อบรรเทาความเคลือบแคลงที่เพิ่มขึ้นของ[peaceful_vassal.GetHerHis]"
 vassal.2501.a:0 "การลดแรงกดดันต่อ [peaceful_vassal.GetHerHim] อาจช่วยได้"
 vassal.2501.b:0 "ข้าต้องเตือนท่านหรือไม่ว่าใครคือ [ROOT.Char.GetTitleTierName]?!"
 vassal.2501.c:0 "ท่านต้องเรียนรู้ที่จะระงับความสงสัยของท่าน"

 vassal.2601.t:0 "ปรารถนาสงคราม"
 vassal.2601.desc:0 ""[ROOT.Char.Custom('FormOfAddressForLiege')|U], ท่านมีเหตุผลที่จะโจมตี [holder_of_claim.GetTitledFirstName], แต่ท่านกลับยั้งมือ..." [warmongering_vassal.GetTitledFirstName] [ROOT.Char.Custom2('RelationDescriptor', SCOPE.sC('warmongering_vassal'))] [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('warmongering_vassal'))] ของข้า, [ROOT.Char.Custom2('QuirkPresentPosOrNeg', SCOPE.sC('warmongering_vassal'))] ก่อนกล่าวต่อ, "ทำไม? เราสงบสุขกันมานานเกินไปแล้ว, ท่านควรฉวยโอกาสนี้!""
 vassal.2601.a:0 "ท่านพูดถูก [warmongering_vassal.GetFirstNameNoTooltip]!"
 vassal.2601.a.tt:0 "#F [warmongering_vassal.GetFirstName] จะจดจำคำสัญญาที่ข้าให้ไว้#!"
 vassal.2601.b:0 "ข้าจะไม่ยอมถูกบีบให้กระทำการก่อนเวลาอันควร"

 vassal.2610.desc:0 ""ท่านทำในสิ่งที่ถูกต้องแล้ว, [ROOT.Char.Custom('FormOfAddressForLiege')] เราจะแสดงให้ [recipient.GetTitledFirstName] [ROOT.Char.Custom2('DescriptorNegative', SCOPE.sC('recipient'))] นั่นเห็นว่าเราทำอะไรได้บ้าง! ท่านจะต้องอ้างสิทธิ์ใน [claim_to_fight_for.GetNameNoTier]!""
 vassal.2610.a:0 "เราจะชนะสงครามนี้!"

 vassal.2620.desc:0 "[warmongering_vassal.GetTitledFirstName] [ROOT.Char.Custom2('RelationDescriptor', SCOPE.sC('warmongering_vassal'))] [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('warmongering_vassal'))] ของข้า, [warmongering_vassal.Custom('quirk_neg_present')]\n\n"[ROOT.Char.Custom('FormOfAddressForLiege')|U], [holder_of_claim.GetTitledFirstName] ยังไม่เห็นความโกรธาของท่าน, หรือกองทัพของท่านเลย ทำไมท่านถึงสัญญากับข้าถึงสงครามที่ท่านไม่เคยคิดจะเริ่ม?""
 vassal.2620.a:0 "มันมีเรื่องอื่นเกิดขึ้นมากมาย..."

 vassal.2701.t:0 "[ROOT.Char.Custom2('RelationToMe', SCOPE.sC('teacher'))|U] ผู้ [ROOT.Char.Custom('CommanderTraitBeingTaughtNoTooltip')] ของข้า"
 vassal.2701.desc:0 "[ROOT.Char.Custom2('RelationDescriptor', SCOPE.sC('teacher'))] [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('teacher'))] ของข้า [teacher.GetTitledFirstName] เป็นที่รู้จักในด้านความสามารถทางทหารของ [teacher.GetHerHis] — โดยเฉพาะในด้านที่ข้าพบว่าตนเองขาดตกบกพร่อง"
 vassal.2701.a:0 "ท่านจะสอนข้าได้หรือไม่ [teacher.GetFirstNameNoTooltip]?"
 vassal.2701.a.tt:0 "ข้าไม่ได้รับลักษณะ [THIS.Char.Custom('CommanderTraitBeingTaught')]"
 vassal.2701.a.random_list.success:0 "การฝึกสำเร็จ"
 vassal.2701.a.random_list.failure:0 "การฝึกไม่สำเร็จ"
 vassal.2701.c:0 "ข้ามีเรื่องที่ดีกว่าต้องทำ!"

 vassal.2702.desc_success_inclination:0 ""น่าประทับใจยิ่งนัก, [ROOT.Char.Custom('FormOfAddressForLiege')]!"\n\nความโน้มเอียงของข้าต่อคำสอนของ [teacher.GetTitledFirstName] อาจไม่น่าแปลกใจนัก, แต่ข้าก็พบว่าตนเองพึงพอใจ"
 vassal.2702.desc_success_no_inclination:0 ""น่าประทับใจยิ่งนัก, [ROOT.Char.Custom('FormOfAddressForLiege')]!"\n\nแม้จะไม่เคยมีพรสวรรค์ด้านการทหาร, ข้ากลับพบว่าตนเองรับคำสอนของ[teacher.GetTitledFirstNamePossessive] ด้วยความกระหายและทักษะที่น่าประหลาดใจแม้กระทั่งตัวข้าเอง"
 vassal.2702.desc_failure:0 "แม้ว่า [teacher.GetTitledFirstNamePossessive] จะพยายามอย่างสุดความสามารถแล้ว แต่สิ่งที่ [teacher.GetSheHe] บอกหรือสาธิตให้ข้าพเจ้าดูนั้นไม่มีอะไรเข้าใจได้เลย นี่เป็นการลงทุนที่สูญเปล่าโดยแท้"
 vassal.2702.a:0 "ในที่สุดข้าก็รู้ว่าเรื่องวุ่นวายทั้งหมดนั้นเกี่ยวกับอะไร!"
 vassal.2702.b:0 "[teacher.GetSheHe] เป็นครูที่ไม่ดี หรือข้าไม่เหมาะกับสิ่งนี้?"

 vassal.2801.t:0 "ข้อเรียกร้องของเจ้าเหนือหัว"
 vassal.2801.desc:0 ""[ROOT.Char.GetTitledFirstNameNoTooltip] ข้าอดสังเกตมิได้ว่าไม่มีการปรับปรุงใดๆ เกิดขึ้นใน [develop_county.GetNameNoTier] มาสักพักแล้ว แม้ว่าท่านจะมีหนทางที่จะดำเนินการดังกล่าวอย่างชัดเจน""
 vassal.2801.a:0 "ข้าจะจัดการทันที!"
 vassal.2801.b:0 "หากท่านสามารถลดภาระผูกพันอื่นๆ ของข้าลงได้..."

 vassal.2901.t:0 "[claim_to_propose.GetNameNoTier|U]"
 vassal.2901.desc:0 ""เจ้าเหนือหัว [ROOT.Char.GetTitleTierName] ของข้า ปัจจุบันท่านครอบครองบางสิ่ง — บางแห่ง — ที่ควรเป็นของข้า"\n\n[ROOT.Char.Custom2('RelationDescriptor', SCOPE.sC('claim_vassal'))] [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('claim_vassal'))] ของข้า [claim_vassal.GetTitledFirstName] มาอยู่ต่อหน้าข้า ยืนกรานให้ข้ามอบ [claim_to_propose.GetName] ให้แก่เขา"
 vassal.2901.a:0 "ข้าจะดูว่าข้าทำอะไรได้บ้าง"
 vassal.2901.a.tt:0 "#F [claim_vassal.GetFirstNameNoTooltip] จะจดจำคำสัญญาของข้า และจะรู้สึกขอบคุณหากรักษาสัญญา!#!"
 vassal.2901.b:0 "[claim_to_propose.GetNameNoTierNoTooltip] เป็นของข้า!"
 vassal.2901.z:0 "ท่านควรได้รับสิ่งที่ท่านร้องขอ"

 vassal.2910.desc:0 ""ขอบคุณ เจ้าเหนือหัว [ROOT.Char.GetTitleTierName] ของข้า!"\n\n[ROOT.Char.Custom2('RelationDescriptor', SCOPE.sC('recipient'))] [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('recipient'))] ของข้า [recipient.GetTitledFirstName] มีความสุขกับตำแหน่งที่ข้ามอบให้ [recipient.GetHerHim] และข้าก็ยินดีกับบุญคุณที่ได้รับ"
 vassal.2910.a:0 "ทุกสิ่งมีราคาของมัน!"

 vassal.2911.desc:0 "[ROOT.Char.Custom2('RelationDescriptor', SCOPE.sC('claim_vassal'))] [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('claim_vassal'))] ของข้าโกรธจัด [claim_vassal.GetSheHe|U] ในที่สุดก็ตระหนักว่าคำสัญญาของข้าที่จะมอบ [claim_to_propose.GetName] ให้ [claim_vassal.GetHerHim] นั้นเป็นเพียงคำพูดที่ว่างเปล่า"
 vassal.2911.a:0 "ข้าไม่มีภาระผูกพันที่จะต้องตอบสนองคำขอที่ไร้สาระ เช่นนั้น"

 vassal.3001.t:0 "ปัญหาเรื่องทายาท"
 vassal.3001.desc_child:0 "[ROOT.Char.Custom2('RelationToMe', SCOPE.sC('vassal_to_ask'))] ของข้า [vassal_to_ask.GetTitledFirstName] ยืนอยู่ท่ามกลางความรักและ [vassal_to_ask.Custom('ChildChildrenGender')] มากมายของ [vassal_to_ask.GetHerHis] และข้าก็นึกถึงความเย็นชาอันโหดร้ายที่แทรกซึมอยู่ในบ้านของข้าเอง — ความรู้สึกที่อาจถูกปัดเป่าไปด้วยบุตรอีกคน"
 vassal.3001.desc_no_child:0 "[ROOT.Char.Custom2('RelationToMe', SCOPE.sC('vassal_to_ask'))] ของข้า [vassal_to_ask.GetTitledFirstName] ยืนอยู่ท่ามกลางความรักและ [vassal_to_ask.Custom('ChildChildrenGender')] มากมายของ [vassal_to_ask.GetHerHis] และข้าก็นึกถึงห้องที่ว่างเปล่าและโถงทางเดินที่เงียบสงัดในบ้านของข้าเอง"
 vassal.3001.desc:0 "\n\nแน่นอนว่าเราได้พยายามแล้ว [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('spouse'))] ของข้า [spouse.GetFirstName] และข้า แต่ต้องมีบางอย่างที่เราทำผิดพลาด..."
 vassal.3001.a:0 "บางที [vassal_to_ask.GetFirstNameNoTooltip] อาจให้คำแนะนำข้าได้บ้าง!"
 vassal.3001.b:0 "นี่เป็นเรื่องส่วนตัว"

 vassal.3002.desc:1 ""[ROOT.Char.GetFirstNameNoTooltip] ท่านได้รับพรให้มี [ROOT.Char.Custom('ChildChildrenGender')] หลายคน และข้าไม่มีโชค เช่นนั้น ท่านมีคำแนะนำเกี่ยวกับวิธี... แก้ไขปัญหานั้นหรือไม่?"\n\nข้าไม่อยากจะเชื่อเลย! [ROOT.Char.Custom2('RelationDescriptor', SCOPE.sC('liege_with_trouble'))] [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('liege_with_trouble'))] ของข้า [liege_with_trouble.GetTitledFirstName] กำลังขอคำแนะนำเรื่องในห้องนอนจากข้า!"
 vassal.3002.a:1 "อัณฑะหมูแห้งกับไวน์ฟังดูเป็นอย่างไร?"
 vassal.3002.a.critical_success:0 "คำแนะนำของข้าได้ผลลัพธ์ที่น่าทึ่ง"
 vassal.3002.a.success:0 "คำแนะนำของข้าได้ผลลัพธ์ที่ดี"
 vassal.3002.a.failure:0 "คำแนะนำของข้าก่อให้เกิดผลเสียมากกว่าผลดี"
 vassal.3002.b:0 "ข้าไม่ต้องการเกี่ยวข้องกับสิ่งที่เกิดขึ้นในนั้น!"
 vassal.3002.c:1 "ข้าคิดว่า [spouse.GetTitledFirstNameNoTooltip] ต้องการบทเรียนบางอย่าง"
 vassal.3002.c.tt_success:0 "[liege_with_trouble.GetTitledFirstNameNoTooltip] เห็นด้วย"
 vassal.3002.c.tt_failure:0 "[liege_with_trouble.GetSheHe|U] ถูกดูหมิ่น"
 vassal.3002.d:0 "ข้าคิดว่าการ... #EMP สอนพิเศษ#! ส่วนตัวบางอย่างจะเป็นประโยชน์ต่อท่าน"
 vassal.3002.d.tt_success:0 "[liege_with_trouble.GetSheHe|U] สนใจบทเรียนส่วนตัว"
 vassal.3002.d.tt_failure:0 "[liege_with_trouble.GetSheHe|U] ถูกดูหมิ่น"

 vassal.3003.desc_good_counsel:0 "[vassal_to_ask.GetTitledFirstName] [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('vassal_to_ask'))] ของข้า, มอบยาต้มให้ข้าดื่ม, พร้อมอ้างว่า: "ท่านจะสังเกตเห็นความแตกต่างในทันที, [ROOT.Char.Custom('FormOfAddressForLiege')]!"\n\nความคลุมเครือของ[vassal_to_ask.GetHerHis] เกี่ยวกับส่วนผสม ทำให้ข้ากังวลเล็กน้อย, แต่ข้าก็รู้สึกได้ถึงพลังชีวิตที่ไหลเวียนอย่างรุนแรงผ่านเส้นเลือดของข้าแล้ว!"
 vassal.3003.desc_bad_counsel:0 "[vassal_to_ask.GetTitledFirstName] [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('vassal_to_ask'))] ของข้า, มอบยาต้มให้ข้าดื่ม, พร้อมอ้างว่า: "ท่านจะสังเกตเห็นความแตกต่างในทันที, [ROOT.Char.Custom('FormOfAddressForLiege')]!"\n\nความคลุมเครือของ[vassal_to_ask.GetHerHis] เกี่ยวกับส่วนผสม ทำให้ข้ากังวลเล็กน้อย, และขณะที่ข้ารู้สึกว่าธาตุอุ่นในกายลดน้อยลง ข้าก็สาปแช่งคำแนะนำที่เลวร้ายของ[vassal_to_ask.GetHerHis]!"
 vassal.3003.desc_making_a_move_on_spouse:0 ""ส่ง[spouse.GetWifeHusband] ของท่านมาหาข้า แล้วข้าจะบอก[spouse.GetHerHim] ว่าจะ ทำให้ท่านพึงพอใจมากขึ้นได้อย่างไร, [ROOT.Char.Custom('FormOfAddressForLiege')]""
 vassal.3003.desc_making_a_move:0 ""แต่, [ROOT.Char.Custom('FormOfAddressForLiege')], มันยากเหลือเกินที่จะให้คำแนะนำ มันจะง่ายกว่ามากหากเพียงแค่แสดงให้ท่านเห็น...""
 vassal.3003.desc_refusal:0 "ความอหังการของ [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('vassal_to_ask'))] [ROOT.Char.Custom2('DescriptorNegative', SCOPE.sC('vassal_to_ask'))]! แม้หลังจากที่ข้าเข้าหา [vassal_to_ask.GetTitledFirstName] ด้วยคำถามที่ละเอียดอ่อนของข้า [vassal_to_ask.GetSheHe] ก็ปฏิเสธข้า"
 vassal.3003.a:0 "[spouse.GetTitledFirstNameNoTooltip]! มาพบข้าที่ห้องของเรา!"
 vassal.3003.b:0 "ข้าถูกสาปให้มีชีวิตที่ไร้บุตรหรือไม่?"
 vassal.3003.spouse:0 "ข้าจะส่ง [spouse.GetHerHim] ไปทันที!"
 vassal.3003.spouse.tt:0 "เพิ่มโอกาสมีบุตร"
 vassal.3003.c:0 "ใช่ การสอนพิเศษส่วนตัวอาจช่วยได้"
 vassal.3003.d:0 "ช่างอหังการนัก!"

 vassal.3004.desc_spouse:0 "ประสิทธิภาพของบทเรียนส่วนตัวของข้ากับ [spouse.GetTitledFirstName] อาจเป็นที่น่าสงสัย แต่ [spouse.GetSheHe] ไม่ได้แสดงความไม่พอใจใดๆ อย่างแน่นอน\n\nหาก [spouse.Custom2('RelationToMe', SCOPE.sC('liege_with_trouble'))] ของ [spouse.GetHerHis] โชคดี [spouse.GetSheHe] คงได้เรียนรู้อะไรไปบ้าง...!"
 vassal.3004.desc_refused:0 "[liege_with_trouble.GetTitledFirstName] ปฏิเสธข้า!\n\nข้าได้ แต่หวังว่า [liege_with_trouble.Custom2('RelationToMe', SCOPE.sC('spouse'))] ของ [liege_with_trouble.GetHerHis] จะโชคดีกว่าในห้องนอนของพวกเขา...!"
 vassal.3004.desc:0 "ประสิทธิภาพของบทเรียนส่วนตัวของข้ากับ [liege_with_trouble.GetTitledFirstName] อาจเป็นที่น่าสงสัย แต่ [liege_with_trouble.GetSheHe] ไม่ได้แสดงความไม่พอใจใดๆ อย่างแน่นอน\n\nหาก [liege_with_trouble.Custom2('RelationToMe', SCOPE.sC('spouse'))] ของ [liege_with_trouble.GetHerHis] โชคดี [liege_with_trouble.GetSheHe] คงได้เรียนรู้อะไรไปบ้าง...!"
 vassal.3004.a:0 "เป็น [liege_with_trouble.GetSheHe] เองที่พลาด!"
 vassal.3004.b:0 "การส่งต่อความสามารถของข้าเป็นอย่างน้อยที่สุดที่ข้าสามารถทำได้!"
 vassal.3004.c:0 "[spouse.GetFirstNameNoTooltip] เป็นนักเรียนที่ยอดเยี่ยม!"

 vassal.5010.opening:0 "[vassal.Custom2('AppropriateGreeting', ROOT.Char)]"
 vassal.5010.desc:0 "อาจไม่ใช่หน้าที่ของข้าที่จะตั้งคำถามกับกลยุทธ์ของท่าน แต่ข้าสงสัยว่าเหตุใดท่านจึงปล่อยให้ศัตรูแห่งศรัทธาของเราดำเนินธุรกิจชั่วร้ายของพวกเขาโดยไม่มีการแทรกแซง เรามีทั้งหนทางและสิทธิ์ที่จะมอบความยุติธรรมของ [ROOT.Char.GetFaith.HighGodNamePossessive] ให้แก่พวกเขา ดังนั้นเราต้องทำ เช่นนั้นอย่างแน่นอน!"
 vassal.5010.a:0 "ภายในหกเดือนเราจะเคลื่อนทัพต่อต้านพวกเขา!"
 vassal.5010.a.tt:0 "#F ข้าให้คำมั่นว่าจะประกาศสงครามกับพวกนอกรีต#!"
 vassal.5010.b:0 "เมื่อถึงเวลาอันควร..."
 vassal.5010.b.tt:0 "#F ข้าได้สัญญาทุกอย่างและไม่ได้สัญญาอะไรเลย#!"
 vassal.5010.c:0 "อย่าบอก [ROOT.Char.GetTitleTierName] ว่า [ROOT.Char.GetSheHe] ต้องทำอะไร!"

 vassal.5020.t:0 "คำสัญญาอันเคร่งศาสนาที่ถูกผิด"
 vassal.5020.desc:0 "หกเดือนผ่านไปแล้วนับตั้งแต่ข้าให้คำมั่นว่าจะส่งกองทัพไปต่อสู้กับศัตรูแห่งศรัทธา [vassal.GetTitledFirstName] จะไม่พอใจกับการที่ข้าไม่ดำเนินการตามสัญญา"
 vassal.5020.a:0 "บางทีข้าอาจพูดเร็วไป"
 vassal.5020.b:0 "คำพูดเป็นเพียงลมปาก"
 
 vassal.5050.desc:1 "ข้าใคร่ร้องเรียนต่อท่าน, ด้วยสติปัญญาของท่าน, ให้พิจารณาสิทธิ์ของข้าใน [claim.GetName] มันไม่ถูกต้องที่ [claimed_title_holder.GetTitledFirstName] จะนั่งอย่างปลอดภัยในฐานะผู้ช่วงชิงในปราสาทของ[vassal.GetHerHis], เยาะเย้ยสิทธิ์โดยกำเนิดของราชวงศ์ข้า ได้โปรด, [ROOT.Char.Custom('FormOfAddressForLiege')], สนับสนุนข้าหลวงผู้ภักดีของท่านด้วยการจับอาวุธหากพวกเขาไม่ยอมรับสิทธิ์ของข้าโดยสมัครใจ!"
 vassal.5050.a:0 "ภายในปีนี้ข้าจะดำเนินการในนามของท่าน!"
 vassal.5050.a.tt:0 "#F ข้าขอปฏิญาณว่าจะผลักดันสิทธิ์ของ [vassal.GetTitledFirstNamePossessive]#!"
 vassal.5050.b:0 "เมื่อถึงเวลาอันควร..."
 vassal.5050.b.tt:0 "#F ข้าจะดำเนินการก็ต่อเมื่อข้าเห็นประโยชน์เท่านั้น#!"
 vassal.5050.c:0 "ข้ามีเรื่องเร่งด่วนอื่นๆ อีกมาก"

 vassal.5060.t:0 "คำสัญญาที่ถูกผิด"
 vassal.5060.desc:0 "หนึ่งปีผ่านไปแล้วนับตั้งแต่ข้าให้คำมั่นกับ [vassal.GetTitledFirstName] ว่าจะทำสงครามเพื่ออ้างสิทธิ์ของ [vassal.GetHerHis] ใน [claim.GetName] [vassal.GetTitledFirstName] จะไม่พอใจกับการที่ข้าไม่ดำเนินการในนามของ [vassal.GetHerHis]"
 vassal.5060.a:0 "บางทีข้าไม่ควรให้คำมั่น เช่นนั้น"
 vassal.5060.b:0 "แต่เวลามันยังไม่เหมาะสม ท่านเข้าใจไหม?"
