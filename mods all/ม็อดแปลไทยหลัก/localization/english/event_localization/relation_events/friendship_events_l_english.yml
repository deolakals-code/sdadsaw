l_english: 
 friendship.0001.t:0 "ห่างเหินกันไป"
 friendship.0001.desc_opening:1 "กาลเวลาและผู้คนย่อมเปลี่ยนแปลง บางครั้งผู้ที่ใกล้ชิดเราที่สุดก็ดูเหมือนกลายเป็นคนแปลกหน้า\n\n"[ROOT.Char.GetTitledFirstNameNoTooltip]," [friend_in_question.Custom2('MyCharacterIntroduction', ROOT.Char)] ยิ้มเศร้าๆ"
 friendship.0001.desc_murder:0 ""การที่ท่านสังหาร... ข้ารู้สึกว่ามิตรภาพระหว่างเราไม่หลงเหลืออยู่แล้ว""
 friendship.0001.desc:0 ""ข้ารู้สึกว่ามิตรภาพระหว่างเราไม่หลงเหลืออยู่แล้ว""
 friendship.0001.a:0 "มันเป็นวิถีแห่งสรรพสิ่ง"
 friendship.0001.b:1 "แต่... จงระลึกถึงช่วงเวลาดีๆ ทั้งหมด!"
 friendship.0001.b.tt:0 "[friend_in_question.GetSheHe|U] จะให้โอกาสความสัมพันธ์ของเราอีกครั้ง"

 friendship.0002.t:0 "ห่างเหินกันไป"
 friendship.0002.desc:0 "กาลเวลาและผู้คนย่อมเปลี่ยนแปลง บางครั้งผู้ที่ใกล้ชิดเราที่สุดก็ดูเหมือนกลายเป็นคนแปลกหน้า\n\nเป็นที่ชัดเจนว่า [first_friend.GetTitledFirstName] และข้ามิอาจเรียกได้ว่าเป็นสหายกันอีกต่อไป"
 friendship.0002.a:0 "มันเป็นวิถีแห่งสรรพสิ่ง"

 friendship.0003.t:0 "บางสิ่งที่มากกว่า"
 friendship.0003.desc_intro:0 "[ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('friend_as_potential_lover'))]ของข้า "
 friendship.0004.desc_intro:0 "[ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('first_friend'))]ของข้า "
 friendship.0003.desc:0 "[friend_as_potential_lover.GetTitledFirstName] มีความสำคัญต่อข้ามาก ข้าพบว่าตนเองครุ่นคิดถึง[friend_as_potential_lover.GetHerHim]อยู่บ่อยครั้ง และบางครั้งข้าแทบจะทนระยะห่างระหว่างเราไม่ได้\n\nนี่เป็นเครื่องวัดความลึกซึ้งของมิตรภาพของเรา หรือเป็นบางสิ่งที่มากกว่านั้น?"
 friendship.0003.a:0 "ข้าควรเขียนถึง[friend_as_potential_lover.GetHerHim] [friend_as_potential_lover.GetSheHe]ให้คำแนะนำที่ดีเสมอ"
 friendship.0003.goes_for_it_tooltip:1 "ท่านสารภาพความรู้สึกของท่านต่อ [friend_as_potential_lover.GetTitledFirstName]"
 friendship.0003.b:0 "ไม่ เราเป็นสหายกัน และเป็นเพียงสหายเท่านั้น"
 friendship.0004.desc:1 "[first_friend.GetTitledFirstName] มีความสำคัญต่อข้ามาก ข้าพบว่าตนเองครุ่นคิดถึง[first_friend.GetHerHim]อยู่บ่อยครั้ง และบางครั้งข้าแทบจะทนระยะห่างระหว่างเราไม่ได้\nนี่เป็นเครื่องวัดความลึกซึ้งของมิตรภาพของเรา หรือเป็นบางสิ่งที่มากกว่านั้น?"
 friendship.0004.a:0 "โอ้ ข้ามิอาจปฏิเสธความปรารถนานี้ได้อีกต่อไป!"
 friendship.0004.goes_for_it_tooltip:1 "ด้วยหัวใจที่เปิดเผย ท่านตัดสินใจสารภาพความรู้สึกของท่าน"
 friendship.0004.b:0 "ไม่ เราเป็นสหายที่ดีต่อกัน และเป็นเพียงสหายที่ดีเท่านั้น"
 friendship.0005.t:0 "การปฏิเสธอย่างระมัดระวัง"
 friendship.0005.desc:0 "แม้ว่าข้าพยายามพูดให้คลุมเครือ [friend_as_potential_lover.GetTitledFirstName] ก็รู้แน่ชัดว่าข้าพยายามจะพูดอะไร เช่นเคย คำตอบ[friend_as_potential_lover.GetHerHis|U]นั้นช่างนุ่มนวล เต็มไปด้วยความห่วงใย ทว่าเจ็บปวดเหลือเกิน\n\n[friend_as_potential_lover.GetSheHe|U] รู้สึกผูกพันกับข้าอย่างมาก แต่ในฐานะสหายเท่านั้น"
 friendship.0005.a:0 "ข้าพยายามไม่แสดงความเจ็บปวดบนใบหน้า "โอ้ ท่านเข้าใจข้าผิดไป""
 friendship.0005.b:1 "เหตุใดท่านจึงผลักไสข้า ทั้งที่ข้ารู้ว่าท่านก็รู้สึก เช่นเดียวกัน [friend_as_potential_lover.GetFirstNameNoTooltip]?"
 friendship.0005.c:0 "ในนั้นก็มีความงดงามอยู่ เช่นกัน"
 friendship.0007.t:0 "เมื่อความห่วงใยกลายเป็นความปรารถนา"
 friendship.0007.desc:0 "หัวใจข้าเต้นระรัวเมื่อข้ายื่นมือไปสัมผัสแก้มของ[friend_as_potential_lover.GetTitledFirstNamePossessive] แม้ข้าจะรู้อยู่แล้วว่า[friend_as_potential_lover.GetSheHe]จะไม่ปัดป้อง\n\nอ้อมกอดของเราเปี่ยมล้นด้วยความรักยิ่งกว่าที่ข้าเคยรู้สึกมา"
 friendship.0007.a:1 "โอ้ [friend_as_potential_lover.GetFirstNameNoTooltip]!"
 friendship.0008.t:0 "เมื่อความห่วงใยกลายเป็นความปรารถนา"
 friendship.0008.desc:0 "หัวใจข้าเต้นระรัวเมื่อข้ายื่นมือไปสัมผัสแก้มของ[first_friend.GetTitledFirstNamePossessive] แม้ข้าจะรู้อยู่แล้วว่า[first_friend.GetSheHe]จะไม่ปัดป้อง\n\nอ้อมกอดของเราเปี่ยมล้นด้วยความรักยิ่งกว่าที่ข้าเคยรู้สึกมา"
 friendship.0008.a:1 "โอ้ [first_friend.GetFirstNameNoTooltip]!"
 friendship.0009.t:0 "สิ่งที่อาจเป็นไปได้"
 friendship.0009.desc:0 "หลังจากการจากไปของ[friend_as_potential_lover.GetHerHis] ข้าใช้เวลายามค่ำคืนอยู่กับตนเองหลายครั้ง ครุ่นคิดถึง [friend_as_potential_lover.GetFirstName] ผู้ภักดี เป็นมิตร และอบอุ่นจนถึงที่สุด ข้าอดคิดไม่ได้ว่าสิ่งใดอาจเป็นไปได้ หาก[friend_as_potential_lover.GetSheHe]ไม่ถูกพรากไปจากข้าเร็วเกินไป"
 friendship.0009.a:1 "หลับให้สบายเถิด สหายรักของข้า [friend_as_potential_lover.GetFirstNameNoTooltip]"
 
 friendship.0010.t:0 "ห่างเหินกันไป"
 friendship.0010.desc:0 "ข้าไม่เคยคาดคิดว่าจะเห็นสีหน้าสับสน เช่นนั้นบนใบหน้าของ[best_friend.GetTitledFirstNamePossessive] เมื่อข้าเล่าความฝันให้[best_friend.GetHerHim]ฟัง ข้าคิดว่า[best_friend.GetSheHe]จะเข้าใจข้าเสมอ คอยสนับสนุนข้าเสมอ\n\nทว่า บางครั้งเมื่อเราพบกัน ข้ารู้สึกราวกับกำลังพูดคุยกับคนแปลกหน้า"
 friendship.0010.a:0 "เราต้องแก้ไขเรื่องนี้ สร้างมิตรภาพของเราขึ้นใหม่!"
 friendship.0010.b:0 "เรื่องนี้ไม่คุ้มค่ากับความพยายามอีกต่อไปแล้ว"
 friendship.0010.a.success:0 "ข้าประสานความสัมพันธ์ของเรา"
 friendship.0010.a.failure:0 "ความพยายามของข้าสูญเปล่า"
 friendship.0010.a.success.message:0 "[best_friend.GetTitledFirstName] และข้ายังคงเป็นสหายที่ดีที่สุดต่อกัน"
 friendship.0010.a.failure.message:0 "ข้าล้มเหลวในการซ่อมแซมความสัมพันธ์กับ [best_friend.GetTitledFirstName]"

 friendship.0011.t:0 "ห่างเหินกันไป"
 friendship.0011.desc:0 "จุดจบนั้นเชื่องช้าและไม่น่าตื่นเต้น แต่ก็หลีกเลี่ยงไม่ได้ดั่งกาลเวลาที่ผ่านไป ครั้งหนึ่ง ข้าเคยคิดว่า [other_best_friend.GetTitledFirstName] จะเป็นสหายที่ใกล้ชิดที่สุดของข้าตลอดไป แต่วันนี้ คำขอโทษที่ดูฝืนใจ[other_best_friend.GetHerHis]นั้นไม่น่าแปลกใจเลย"
 friendship.0011.a:0 "เราเคยมีช่วงเวลาดีๆ ร่วมกัน แต่ถึงเวลาที่ต้องปล่อยวางแล้ว"

 friendship.0014.t:0 "การทรยศ"
 friendship.0014.desc:0 "หลังจากทุกสิ่งที่เราเผชิญมาร่วมกัน ข้ายังไม่อยากเชื่อว่า [friend_to_rival.GetTitledFirstName] จะทำสิ่ง[friend_to_rival.GetSheHe]ได้ทำลงไป\nมันคือการทรยศต่อทุกท่าทีที่เป็นมิตรที่เราเคยมีต่อกัน แท้จริงแล้ว คือการทรยศต่อมิตรภาพของเรา! เราเคยร่วมทุกข์ร่วมสุขกัน แต่บัดนี้ [friend_to_rival.GetSheHe]ได้สร้างศัตรูไปตลอดชีวิตแล้ว"
 friendship.0014.a:0 "[friend_to_rival.GetFirstName] จะต้องชดใช้!"

 friendship.0015.opening:0 "[original_friend.Custom2('AppropriateGreeting', ROOT.Char)]"
 friendship.0015.desc:0 "ข้าขอประณามมิตรภาพที่ท่านได้ล้อเลียนอย่างไม่ไยดี!\nสำหรับคำสัญญาและท่าทีทั้งหมดของท่านที่จบลงด้วยความไร้เกียรติ... เมื่อรู้จักท่านอย่างที่เป็นอยู่ตอนนี้ ข้าไม่ควรจะแปลกใจเลย\n\nท่านนำความทุกข์นี้มาสู่ตนเอง"
 friendship.0015.a:0 "เจ้าต่างหากที่เป็นคนโง่, [original_friend.GetFirstNameNoTooltip]"

 friendship.0018.t:0 "สหายมากเกินกว่าเวลาจะมีให้"
 friendship.0018.desc:0 "[ROOT.GetCharacter.Custom('friendship_metaphor_with_tending')]\nด้วยสหายมากมายที่กระจัดกระจายไปตามลม ข้าแทบไม่มีเวลาติดต่อกันทางจดหมาย นับประสาอะไรกับการให้ความใส่ใจที่พวกเขาสมควรได้รับ\nบางทีมันอาจจะง่ายกว่าสำหรับข้าหากข้าจะปล่อยใครบางคน... ให้ห่างเหินไป"
 friendship.0018.a:0 ""ข้าเสียใจที่ต้องเขียนมาแจ้งข่าวร้ายแก่เจ้า, [friend_1.GetTitledFirstNameNoTooltip]...""
 friendship.0018.b:0 ""เจ้าดีต่อข้ามาตลอด, [friend_2.GetFirstNameNoTooltip], แต่...""
 friendship.0018.c:0 ""ไม่ใช่ความผิดของเจ้า แต่เป็นข้าเอง, [friend_3.GetFirstNameNoTooltip]...""
 friendship.0018.d:0 "ข้าจะไม่ ทำให้สหายของข้าแม้ แต่คนเดียวผิดหวัง!"
 friendship.0018.e:0 "โอ้ ไม่ ข้าจัดการเรื่องนี้ได้"
 friendship.0019.t:0 "การหยุดติดต่อสื่อสาร"
 friendship.0019.desc:0 "ข้ารอคอยจดหมายฉบับล่าสุดของ[first_friend.GetTitledFirstNamePossessive]มานานแล้ว แต่ก็ไม่มีอะไรมาถึง ข้าได้ส่งสาส์นของข้าไปเอง แต่ก็ไม่มีการตอบกลับ\nข้อสรุปที่หลีกเลี่ยงไม่ได้ดูเหมือนจะเป็นว่า [first_friend.GetSheHe]ไม่ถือว่าข้าเป็นสหายที่ควรค่าแก่เวลาและความใส่ใจอีกต่อไป"
 friendship.0019.a_1:0 "ข้าคือหนึ่งในไม่กี่คนที่จะตอบรับเจ้าในยามที่เจ้าต้องการความช่วยเหลือ, [first_friend.GetFirstNameNoTooltip]"
 friendship.0019.a_2:0 "ข้าเองก็ไม่ใช่เพื่อนที่ดีที่สุด เช่นกัน, [first_friend.GetFirstNameNoTooltip]"
 
 friendship.1002.opening:0 "[sender.Custom2('AppropriateGreeting', ROOT.Char)]"
 friendship.1002.desc:0 "โปรดรับของขวัญนี้เป็นเครื่องแสดงความขอบคุณสำหรับมิตรภาพอันยั่งยืนของเรา"
 friendship.1002.a:0 "ขอให้มิตรภาพของเราเบ่งบานตลอดไป!"
 friendship.1003.desc:2 "นายพรานของข้าจับกวางตัวผู้เป็นๆ ตัวนี้ได้ ความสง่างามและสูงศักดิ์ของมัน ทำให้ข้านึกถึงท่าน!\n\nโปรดรับมันไว้เป็นเครื่องหมายแห่งมิตรภาพอันยั่งยืนของเรา!"
 friendship.1003.a:2 "ปล่อยให้มันเดินเล่นในสวน!"
 friendship.1003.b:1 "มันจะกลายเป็นเนื้อชิ้นเลิศอย่างแท้จริง..."
 garden_stag_modifier:0 "กวางในสวน"
 impromptu_venison_feast_modifier:0 "งานเลี้ยงเนื้อกวางกะทันหัน"
 friendship.1004.desc:1 "เพื่อเป็นเครื่องแสดงความขอบคุณสำหรับมิตรภาพอันยั่งยืนของเรา ข้าอยากจะแบ่งปันบางสิ่งที่ท่านอาจพบว่าน่าสนใจ\n\nโปรดใช้ข้อมูลนี้ตามที่ท่านเห็นสมควร"
 friendship.1004.a:0 "ช่างมีน้ำใจยิ่งนัก!"
 
 friendship.1006.t:0 "การสนับสนุน"
 friendship.1006.desc:1 "ด้วยความห่วงใยในสงครามปัจจุบันของข้า สหายของข้า [friend.GetTitledFirstName] ได้จ่ายเงินจากคลังสมบัติ[friend.GetHerHis]เพื่อช่วยเหลือความพยายามของข้า!"
 friendship.1006.desc_2:0 "\n\nนำขบวนเกวียนที่บรรทุกทองคำ[friend.GetHerHis]มาเต็ม [friend.GetFirstNameNoTooltip] มาถึงค่ายหลักของข้าเมื่อเช้านี้ และตอนนี้กำลังยุ่งอยู่กับการจ่ายเงินให้ทหารของข้า [friend.GetSheHe|U]ช่างมีน้ำใจอย่างแท้จริง"
 friendship.1006.a:0 "ข้าซาบซึ้งใจอย่างหาที่สุดมิได้"
 friendship.1006.b:0 "[friend.GetFirstNameNoTooltip] ข้าต้องการ#EMP มากกว่านี้!#!"
 
 friendship.1007.t:0 "การทรยศและความคดเคี้ยว"
 friendship.1007.desc:0 "เนื่องจากไม่สามารถรับมือกับสงคราม[friend_at_war.GetHerHis]ได้ด้วยตนเอง [friend_at_war.GetTitledFirstName] จึงได้รับความช่วยเหลือในรูปแบบของการจ่ายทองคำจำนวนมากจาก [friend_providing_gift.GetTitledFirstName]!"
 friendship.1007.a:0 "ไร้เกียรติ!"
 friendship.1008.t:0 "บุคคลตัวอย่าง"
 friendship.1008.desc:0 "[courtier_on_offer.GetTitledFirstName] รับใช้ข้ามาอย่างดีเป็นเวลานาน และปฏิบัติหน้าที่[courtier_on_offer.GetHerHis]ได้อย่างยอดเยี่ยม ทำให้ข้าคิดว่า[courtier_on_offer.GetSheHe]เป็นบุคคลประเภทที่ [friend_receiving_gift.GetTitledFirstName] สามารถใช้ประโยชน์ได้ใน[friend_receiving_gift.Custom('GetCourt')][friend_receiving_gift.GetHerHis]"
 friendship.1008.a:0 "[friend_receiving_gift.GetFirstNameNoTooltip] จะชื่นชมการรับใช้ของ[courtier_on_offer.GetHerHis]"
 friendship.1008.a.success:0 "[friend_receiving_gift.GetFirstName] ยอมรับข้อเสนอของท่าน"
 friendship.1008.a.failure:0 "[friend_receiving_gift.GetFirstName] ปฏิเสธข้อเสนอของท่าน"
 friendship.1008.b:0 "ไม่ ข้าต้องการ [courtier_on_offer.GetTitledFirstNameNoTooltip] ที่นี่"
 friendship.1008.b.tt:0 "[courtier_on_offer.GetTitledFirstName] ยังคงอยู่ใน[THIS.Char.Custom('GetCourt')]ของท่าน"
 friendship.1009.t:0 "คำแนะนำ"
 friendship.1009.desc:0 "ไม่ใช่ครั้งแรกที่ข้าได้ยินเรื่องราวว่า [courtier_on_offer.GetTitledFirstName] เป็นผู้รับใช้ที่ยอดเยี่ยมเพียงใด และบัดนี้ [first_friend.GetTitledFirstName] ได้ส่ง[courtier_on_offer.GetHerHim]มายัง[ROOT.Char.Custom('GetCourt')]ของข้า [courtier_on_offer.GetSheHe|U]แนะนำ[courtier_on_offer.GetHerselfHimself]ว่าเป็นเครื่องหมายแห่งมิตรภาพระหว่าง [first_friend.GetFirstName] และข้า"
 friendship.1009.a:1 "ยินดีต้อนรับสู่การรับใช้ของข้า [courtier_on_offer.GetFirstNameNoTooltip]!"
 friendship.1009.b:1 "ท่านคงไม่ได้เก่งกาจขนาดนั้น หาก [first_friend.GetTitledFirstNameNoTooltip] สามารถสละท่านมาได้อย่างง่ายดาย"
 friendship.1009.rejection_tooltip:1 "[courtier_on_offer.GetTitledFirstNameNoTooltip] ถูกส่งกลับไป"
 
 friendship.2001.t:0 "ความจำเป็นที่จะต้องบอก"
 friendship.2001.desc:0 "ความลับของข้าคือภาระอันน่าอึดอัดที่ข้ามิอาจวางลงได้ แต่หากข้าเพียงแบ่งปันมันกับใครสักคน มันอาจจะเบาลง\n\nข้ารู้สึกมั่นใจว่า [friend_receiving_confession.GetTitledFirstName] จะเข้าใจข้า"
 friendship.2001.a:1 "เข้ามาใกล้ๆ เถิด [friend_receiving_confession.GetFirstNameNoTooltip] ข้ามีบางอย่างจะสารภาพ"
 friendship.2001.b:0 "ไม่... ไม่มีใครรู้ได้!"
 friendship.2002.t:0 "ความลับที่เคยบอกเล่า"
 friendship.2002.desc:0 "[confessor.GetTitledFirstName] มาหาข้า ต้องการแบ่งปันบางสิ่งที่รบกวนจิตใจ[confessor.GetHerHis]\n\nข้าแสดงความเข้าใจอย่างที่สุดต่อ[ROOT.GetCharacter.Custom2('RelationToMe', SCOPE.sC('confessor'))]ของข้า ภายในใจข้ารู้สึกสงสัยใคร่รู้อยู่ไม่น้อย..."
 friendship.2002.a:0 "ท่านทำถูกแล้วที่ไว้วางใจข้า [confessor.GetFirstNameNoTooltip]"
 friendship.2002.b:0 "[confessor.GetFirstNameNoTooltip] ข้าก็มีคำสารภาพของข้าเอง เช่นกัน"
 friendship.2003.t:0 "ความลับที่แบ่งปันกัน"
 friendship.2003.desc:0 "เมื่อข้าแบ่งปันความลับของข้ากับ [friend_receiving_confession.GetTitledFirstName] ดวงตา[friend_receiving_confession.GetHerHis]เบิกกว้าง\n "เหตุใดเล่า [SCOPE.GetRootScope.GetCharacter.GetFirstName] ข้าก็มีบางอย่างจะบอกท่าน เช่นกัน!"\n\nปรากฏว่า [friend_receiving_confession.GetFirstName] ก็มีความลับคล้ายกัน[friend_receiving_confession.GetHerHis]!"
 friendship.2003.a:0 "เป็นการดีที่เราทั้งคู่ต่างรู้"
 friendship.2004.t:0 "ภาระอันหนักหน่วง"
 friendship.2004.desc:0 "ข้าไม่อาจเก็บความจริงไว้ภายใน เช่นนี้ กัดกินจิตวิญญาณของข้า ใครสักคนต้องรู้\n\n[friend_receiving_confession.GetTitledFirstName] คงจะเข้าใจ และช่วยแบ่งเบาภาระของข้า"
 friendship.2004.a:0 "ข้าต้องบอก[friend_receiving_confession.GetHerHim]"
 friendship.2005.t:0 "ความลับที่เคยบอกเล่า"
 friendship.2005.desc:0 "[confessor.GetTitledFirstName] บอกข้าว่าเป็นความลับดำมืดที่[confessor.GetSheHe]รู้สึกว่าจำเป็นต้องแบ่งปันกับข้า แต่ข้าไม่เคยจินตนาการถึงเรื่องนี้เลย!\n\nอย่างน้อยสหายของข้าก็ไม่ต้องอยู่กับภาระของความรู้นี้เพียงลำพังอีกต่อไป"
 friendship.2005.a:0 "ท่านทำถูกแล้วที่ไว้วางใจข้า สหาย"
 friendship.2005.b:0 "[confessor.GetFirstNameNoTooltip], ข้ามีเรื่องสารภาพ เช่นกัน..."
 friendship.2006.t:0 "ความลับที่แบ่งปันกัน"
 friendship.2006.desc:0 "ข้ากังวลว่าแม้ แต่ [friend_receiving_confession.GetTitledFirstName] ก็จะไม่เข้าใจข้าเมื่อข้าแบ่งปันความลับ แต่[friend_receiving_confession.GetSheHe]เข้าใจได้ดีเกินกว่าที่ข้าจะจินตนาการได้\n\n"ข้ารู้ดีว่าท่านรู้สึกอย่างไร [ROOT.GetCharacter.GetFirstName] รู้สึกอย่างไรแน่แท้ทีเดียว...""
 friendship.2006.a:0 "ข้าไม่อยากเชื่อว่าเรามีอะไรเหมือนกันมากเพียงนี้ [ROOT.GetCharacter.Custom2('RelationToMe', SCOPE.sC('friend_receiving_confession'))]ของข้า"
 
 friendship.2007.t:0 "ถ้อยคำอันเมตตา"
 friendship.2007.desc:0 "เส้นทางของข้าบังเอิญมาบรรจบกับ [talking_target.GetTitledFirstName] และน่าประหลาดใจที่ดูเหมือนว่า[talking_target.GetSheHe]ไม่มีความประทับใจที่ดีต่อสหายของข้า [friend_interceded_for.GetTitledFirstName]!\n\nบางทีข้าควรใช้โอกาสนี้เปลี่ยนใจ[talking_target.GetHerHis]"
 friendship.2007.a:1 "ให้ข้าเล่าเรื่องราวเกี่ยวกับ [friend_interceded_for.GetFirstNameNoTooltip] ให้ท่านฟัง..."
 friendship.2007.b:0 "ผู้คนควรจะพูดถึง#EMP ข้า#! แทนสิ"
 friendship.2007.utter_failure_tt:0 "ข้าทำลายชื่อเสียงของ[friend_interceded_for.GetFirstNamePossessive]อย่างย่อยยับ"
 friendship.2007.failure_tt:0 "ข้า ทำให้สถานการณ์แย่ลงสำหรับ [friend_interceded_for.GetFirstName]"
 friendship.2007.success_tt:0 "ข้าปรับปรุงความคิดเห็นของ[talking_target.GetFirstNamePossessive]ที่มีต่อ [friend_interceded_for.GetFirstName]"
 
 friendship.2009.t:0 "ความน่าอับอาย"
 friendship.2009.desc:0 "โอ้ ไม่ ข้าไม่รู้ว่าเกิดอะไรขึ้น แต่ยิ่งข้าเล่าเรื่อง [friend_interceded_for.GetFirstName] ให้ [talking_target.GetTitledFirstName] ฟังมากเท่าไหร่ สีหน้า[talking_target.GetHerHis]ก็ยิ่งดูบูดบึ้งมากขึ้นเท่านั้น\n\nมัน ทำให้สถานการณ์แย่ลงสำหรับ [friend_interceded_for.GetFirstName] มากเสียจน[friend_interceded_for.GetSheHe]สงสัยว่าข้าพูดอะไรกับ [talking_target.GetFirstNameNoTooltip] ไปกันแน่!"
 friendship.2009.a:0 "ข้าขอโทษจริงๆ, [friend_interceded_for.GetFirstNameNoTooltip]"
 
 friendship.2010.t:0 "ความน่าอับอาย"
 friendship.2010.desc:0 "ขณะใช้เวลากับ[talking_target.GetHerHim] สหายของข้า [friend_doing_interceding.GetTitledFirstName] ค้นพบว่า [talking_target.GetTitledFirstName] และข้ามีความสัมพันธ์ที่... ตึงเครียด\n\nอย่างไรก็ตาม ขณะพยายามโน้มน้าว [talking_target.GetFirstName] ถึงคุณงามความดีของข้า ดูเหมือนว่า[friend_doing_interceding.GetSheHe]จะ ทำให้สถานการณ์แย่ลงไปอีก!"
 friendship.2010.a:0 "โอ้ ไม่นะ [friend_doing_interceding.GetFirstNameNoTooltip]!"
 
 friendship.2012.t:0 "พยายามมาก แต่ได้ผลน้อย"
 friendship.2012.desc:0 "ข้าพยายามวาดภาพ [friend_interceded_for.GetTitledFirstName] ในแง่ดีที่สุด แต่ [talking_target.GetTitledFirstName] เพียงแค่เหลือบมองไปทางอื่นทุกครั้งที่ข้าเอ่ยชื่อ[friend_interceded_for.GetHerHis]\n\nข้าสงสัยว่า[talking_target.GetSheHe]ไม่ค่อยประทับใจนัก"
 friendship.2012.a:0 "แต่ [friend_interceded_for.GetFirstNameNoTooltip] ยอดเยี่ยมมากนะ!"
 
 friendship.2013.t:0 "การพิจารณาความสัมพันธ์ใหม่"
 friendship.2013.desc:0 "ขณะใช้เวลายามเย็นร่วมกับ [friend_doing_interceding.GetTitledFirstName] [friend_doing_interceding.GetSheHe]ได้แบ่งปันเรื่องราวหลายอย่างเกี่ยวกับ [friend_interceded_for.GetTitledFirstName] หลังจากได้ยินเรื่องราวการกระทำ[friend_interceded_for.GetHerHis]เป็นเวลาหลายชั่วโมง ข้าต้องยอมรับว่าข้าดูเหมือนจะตัดสิน[friend_interceded_for.GetHerHim]อย่างไม่ยุติธรรม"
 friendship.2013.a:0 "[friend_interceded_for.GetFirstNameNoTooltip] อาจไม่ได้แย่อย่างที่คิด"
 
 friendship.2014.t:0 "คำชมเชย"
 friendship.2014.desc:0 "ขณะใช้เวลากับ[talking_target.GetHerHim] สหายของข้า [friend_doing_interceding.GetTitledFirstName] ค้นพบว่า [talking_target.GetTitledFirstName] และข้ามีความสัมพันธ์ที่... ตึงเครียด\n\nอย่างไรก็ตาม [friend_doing_interceding.GetFirstName] ไม่ปล่อยให้เป็น เช่นนั้น และโน้มน้าว [talking_target.GetFirstName] ได้สำเร็จว่าข้าไม่ได้แย่อย่างที่[talking_target.GetSheHe]คิด!"
 friendship.2014.a:0 "ข้าเป็นหนี้บุญคุณสหายของข้าอย่างใหญ่หลวง!"
 friendship.2015.t:0 "การเปลี่ยนแปลงความเชื่อมั่น"
 friendship.2015.desc:0 "ข้าพยายามวาดภาพ [friend_interceded_for.GetTitledFirstName] ในแง่ดีที่สุด และ [talking_target.GetTitledFirstName] ก็ค่อยๆ เริ่มฟังด้วยความสนใจมากขึ้นเรื่อยๆ\n\nเมื่อ[talking_target.GetSheHe]พึมพำกับ[talking_target.GetHerselfHimself]ว่า "ข้าไม่เคยรู้เรื่องนั้นเลย!" ข้าก็รู้ว่าข้าได้สร้างความประทับใจแล้ว"
 friendship.2015.a:0 "สหายของข้าเป็น[friend_interceded_for.GetWomanMan]ที่ยอดเยี่ยม!"
 friendship.3001.t:0 "สหายที่เลือกคบ"
 friendship.3001.desc:1 "[ROOT.GetCharacter.Custom2('RelationToMe' , SCOPE.sC('spouse_benefitting') )]ของข้า [spouse_benefitting.GetTitledFirstName] รายล้อม[spouse_benefitting.GetHerselfHimself]ด้วยคนดี\n\n[friend_being_approved.GetTitledFirstName] เป็นตัวอย่างของรสนิยมที่ดีที่[spouse_benefitting.GetWifeHusband]ของข้ามีในการเลือกคบสหาย"
 friendship.3001.a:0 "มีคนดีมากมายในชีวิตของข้า"
 friendship.3002.t:0 "สหายที่เลือกคบ"
 friendship.3002.desc:1 "[first_spouse.GetWifeHusband]ของข้า [first_spouse.GetTitledFirstName] ยิ้มให้ข้าขณะที่[first_spouse.GetSheHe]กล่าวถึงการเลือกคบคนที่ข้ารายล้อมตนเองด้วยว่าดีเพียงใด\n\n[first_spouse.GetSheHe|U]คงหมายถึงคนอย่างสหายของข้า [friend_being_approved.GetTitledFirstName]"
 friendship.3002.a:0 "มีคนดีมากมายในชีวิตของข้า"
 friendship.3003.t:0 "สหายที่เลือกคบ"
 friendship.3003.desc:1 "[ROOT.GetCharacter.Custom2('RelationToMe' , SCOPE.sC('spouse_suffering') )]ของข้า [spouse_suffering.GetTitledFirstName] รายล้อม[spouse_suffering.GetHerselfHimself]ด้วยคนเลวบางคน\n\nสหายคนนั้นของ[spouse_suffering.GetHersHis] [friend_being_disapproved.GetTitledFirstName] อยู่ในหมู่คนที่เลวร้ายที่สุด"
 friendship.3003.a:1 "หาก[friend_being_disapproved.GetWomanMan]ผู้นั้นมาเยี่ยมเราอีกครั้ง..."
 spouse_responds_tt:0 "[spouse_suffering.GetFirstName] อาจละทิ้งสหาย[spouse_suffering.GetHerHis] หรือไม่ก็ได้..."
 friendship.3004.t:0 "สหายที่เลือกคบ"
 friendship.3004.desc:1 "มันคงจะง่ายกว่ามากหากผู้คนในชีวิตของข้าเข้ากันได้ อนิจจา [ROOT.GetCharacter.Custom2('RelationToMe', SCOPE.sC('spouse'))]ของข้า [spouse.GetTitledFirstName] ทนสหายที่ดีของข้า [friend_being_disapproved.GetTitledFirstName] ไม่ได้เลย"
 friendship.3004.a:1 "ข้าจะไม่ละทิ้ง[friend_being_disapproved.GetHerHim]ไม่ว่าด้วยเหตุผลใดก็ตาม"
 friendship.3004.b:1 "[spouse.GetFirstNameNoTooltip] มาก่อนเสมอ"
 friendship.3005.t:0 "การเลือกคบสหาย"
 friendship.3005.desc:1 "สหายที่ดีของข้า — หรือควรจะเป็นอดีตสหาย — [spouse_suffering.GetTitledFirstName] ได้แจ้งข้าว่าข้าไม่เป็นที่ต้อนรับในราชสำนัก[spouse_suffering.GetHerHis]อีกต่อไป!\n\nไม่มีเหตุผลใดๆ ให้ไว้ แต่ข้ารู้ว่า[spouse.GetWifeHusband][spouse_suffering.GetHerHis] [spouse.GetTitledFirstName] ไม่ชอบข้า..."
 friendship.3005.a:0 "เจ้าทำ เช่นนี้กับข้าได้อย่างไร, [spouse_suffering.GetFirstNameNoTooltip]?"
 friendship.3006.t:0 "ความสัมพันธ์อันดี"
 friendship.3006.desc:1 "สหายและที่ปรึกษาที่ดีของข้า [friend_on_council.GetTitledFirstName] มีบุญคุณที่ [hooked_councillor.GetTitledFirstName] ต้องชดใช้ [friend_on_council.GetSheHe|U]ได้แจ้งให้ [hooked_councillor.GetFirstNameNoTooltip] ทราบอย่างชัดเจนว่าควรชดใช้ในรูปแบบใดก็ตามที่ข้าร้องขอ"
 friendship.3006.a:0 "ขอบคุณ สหายของข้า!"
 friendship.3006.b:0 "ข้าเชื่อใจท่านว่าจะใช้ประโยชน์จากข้อได้เปรียบนี้ได้ดีกว่าข้า [friend_on_council.GetFirstNameNoTooltip]"
 friendship.3007.t:0 "ความสบายใจจากสหาย"
 friendship.3007.opening:1 "มีเพียงไม่กี่สิ่งที่ข้าเพลิดเพลินยิ่งกว่าการได้อยู่ร่วมกับ[friend.GetTitledFirstNamePossessive]"
 friendship.3007.fallback:1 "\n\n[friend.GetSheHe|U]ดูเหมือนจะรู้แน่ชัดว่าต้องทำอย่างไรเพื่อบรรเทาจิตใจที่ว้าวุ่นของข้า มันช่วยข้าได้มากเมื่อ[friend.GetSheHe]ชวนข้าไปด้วยเมื่อวันก่อน"
 friendship.3007.malicious:0 "\n\nเราใช้เวลายามเย็นก่อกวนเหล่าคนรับใช้ จู้จี้จุกจิกกับทุกความผิดพลาดเล็กน้อยและบ่นเกี่ยวกับทุกรายละเอียด ใครจะรู้ว่าการกระทำทรมานเล็กๆ น้อยๆ สามารถช่วยบรรเทาจิตใจที่ว้าวุ่นได้จริง!"
 friendship.3007.benevolent:1 "\n\nเราเดินเล่นในเมืองด้วยกัน โยนเหรียญให้คนยากจน และให้อภัยนักล้วงกระเป๋าผู้กล้าหาญ การกระทำเพื่อการกุศลและการให้อภัยเพียงเล็กน้อยสามารถบรรเทาจิตใจที่เคร่งเครียดได้อย่างแท้จริง"
 friendship.3007.dominant:1 "\n\n[friend.GetSheHe|U]ลากข้าไปทำกิจกรรมอย่างหนึ่งแล้วอย่างเล่า และจังหวะที่รวดเร็วช่วยให้ข้าไม่ต้องคิดถึงปัญหาของข้าได้อย่างแท้จริง"
 friendship.3007.submissive:1 "\n\nการได้[friend.GetHerHis|U]ร่วมเดินทางในการเดินเล่นในชนบทช่วยบรรเทาจิตใจที่ว้าวุ่นของข้าได้อย่างแท้จริง แม้ว่าข้าจะเป็นผู้ริเริ่มกิจกรรมก็ตาม"
 friendship.3007.extroverted:0 "\n\nค่ำคืนอันอึกทึกในเมืองและการได้รู้จักผู้คนใหม่ๆ มากมายช่วยให้ข้าลืมปัญหาไปได้อย่างแท้จริง!"
 friendship.3007.introverted:0 "\n\nมันช่วยให้จิตใจข้าสงบลงอย่างแท้จริงที่ได้ใช้เวลายามเย็นอันเงียบสงบอยู่ด้วยกัน ดื่มไวน์และพูดคุยเกี่ยวกับปัญหาของเรา"
 friendship.3007.emotional:2 "\n\n[friend.GetSheHe|U]สนับสนุนให้ข้าขว้างจานและกรีดร้องใส่หมอน และหลังจากพายุอารมณ์สงบลง ข้าก็รู้สึกดีขึ้นจริงๆ"
 friendship.3007.levelheaded:0 "\n\n[friend.GetSheHe|U]รับฟังปัญหาทั้งหมดของข้าอย่างเงียบๆ ช่วยให้ข้ามองเห็นภาพรวม และหลังจากนั้นไม่นาน ข้าก็ตระหนักว่ามันไม่ได้เลวร้ายอย่างที่ข้าจินตนาการไว้"
 friendship.3007.end_chill:1 "\n\nหลังจากการพักผ่อนสั้นๆ นี้ ข้าก็พร้อมที่จะปฏิบัติหน้าที่อีกครั้ง ข้าโชคดีที่มีสหาย เช่น [friend.GetTitledFirstName]!"
 friendship.3007.end_severe:1 "\n\nหลังจากการพักผ่อนสั้นๆ นี้ ข้ารู้สึกสบายใจกว่าที่เคยเป็นมานาน! ข้าโชคดีที่มีสหาย เช่น [friend.GetTitledFirstName]"
 friendship.3007.a:0 "การพักผ่อนเล็กๆ ที่ดี"
 friendship.3007.b:2 "การใช้เวลากับ [friend.GetFirstNameNoTooltip] เป็นสิ่งที่ดีสำหรับข้าเสมอ"
 friendship.3007.c:1 "ข้าไม่รู้ตัวเลยว่าข้าต้องการสิ่งนี้มากเพียงใด"
 friendship.3007.d:0 "ข้าลืมเรื่องปัญหาของโลกไปชั่วขณะหนึ่ง"
