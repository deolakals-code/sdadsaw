l_english: 
 bishop.2001.t:0 "สิทธิของนักบวช"
 bishop.2001.desc.a:0 "[scoped_bishop.GetCouncilTitle] [scoped_bishop.GetFirstName] กำลังพิโรธ \n\n[scoped_bishop.GetSheHe|U] อ้างว่าข้าไม่มีสิทธิ์กักขัง [scoped_prisoner.GetTitledFirstName] ไว้เป็นนักโทษ "[scoped_prisoner.GetSheHe|U] เป็น[scoped_prisoner.GetWomanMan]ในสมณเพศ! ไม่ว่า[scoped_prisoner.GetHerHis]จะก่ออาชญากรรมใด ผู้ปกครองฝ่ายอาณาจักรใดเล่าจะมีสิทธิอำนาจพิพากษา[scoped_prisoner.GetHerHim]!""
 bishop.2001.desc.b:0 "นักโทษของข้า [scoped_prisoner.GetTitledFirstName] สวดท่อนหนึ่งจาก[scoped_prisoner.GetFaith.ReligiousText]ด้วยน้ำเสียงหนักแน่นและเงยหน้าขึ้น รอคอยการตัดสิน[scoped_prisoner.GetHerHis] "[scoped_prisoner.GetFirstNameNoTooltip] ได้พิสูจน์แล้วว่าเป็นนักบวช" [scoped_bishop.GetCouncilTitle] [scoped_bishop.GetFirstName] กล่าว พลางยืนอยู่ข้างนักโทษและมองข้าอย่างเหยียดหยาม "ด้วยเหตุนี้ [scoped_prisoner.GetSheHe]ต้องถูกส่งมอบให้อยู่ภายใต้การดูแลของคณะสงฆ์""
 bishop.2001.desc.c:0 "[scoped_prisoner.GetTitledFirstName] สวดท่อนหนึ่งด้วยน้ำเสียงสั่นเครือจาก[scoped_prisoner.GetFaith.ReligiousText]ที่ถืออยู่เบื้องหน้า[scoped_prisoner.GetHerHim] แล้วจึงยืนนิ่งเงียบ\n\n"[scoped_prisoner.GetFirstNameNoTooltip] ได้พิสูจน์แล้วว่าเป็นนักบวช" [scoped_bishop.GetCouncilTitle] [scoped_bishop.GetFirstName] กล่าว พลางยืนอยู่ข้างนักโทษและมองข้าอย่างเหยียดหยาม "ด้วยเหตุนี้ [scoped_prisoner.GetSheHe]ต้องถูกส่งมอบให้อยู่ภายใต้การดูแลของคณะสงฆ์""
 bishop.2001.a:0 "แน่ใจหรือว่า [scoped_prisoner.GetSheHe]จะสวดท่อนที่*ข้า*เลือกได้?"
 tooltip.bishop.2001.a.success:0 "[scoped_prisoner.GetTitledFirstName] สวดท่อนนั้นได้อย่างถูกต้อง"
 bishop.2001.success.a.desc.tt:0 "[scoped_prisoner.GetTitledFirstName] ถูกส่งมอบให้อยู่ภายใต้การดูแลของคณะสงฆ์"
 tooltip.bishop.a.2001.fail:0 "[scoped_prisoner.GetTitledFirstName] ไม่สามารถอ่านบทที่สองได้"
 bishop.2001.failure.a.desc.tt:0 "[scoped_prisoner.GetTitledFirstName] ถูกโยนกลับเข้าคุกใต้ดิน"
 bishop.2001.b:0 "ท่านไม่เหลือทางเลือกให้ข้า"
 bishop.2001.c:0 "ระวังสะดุดตอนออกไปด้วยล่ะ..."
 tooltip.bishop.c.2001.success:0 "[scoped_prisoner.GetTitledFirstName] ประสบอุบัติเหตุ"
 bishop.2001.success.c.desc.tt:0 "[scoped_prisoner.GetFirstName] สิ้นใจหลังจาก[scoped_prisoner.GetHerHis]ถูกปล่อยตัว"
 tooltip.bishop.c.2001.fail:0 "[scoped_prisoner.GetTitledFirstName] หนีรอดไปได้อย่างปลอดภัย"
 bishop.2001.failure.c.desc.tt:0 "[scoped_prisoner.GetFirstName] หลบรอดจากมือสังหารของข้าไปได้!"
 bishop.2001.d:0 "นี่คือนักโทษของข้า [scoped_prisoner.GetSheHe]จะยังคงอยู่ในคุกใต้ดินของข้า!"
 
 bishop.2002.t:1 "ครอบครัว[ROOT.Char.GetFaith.GetAdjectiveNoTooltip]ของข้า"
 bishop.2002.desc.b:0 "ข้ายกมือขึ้นเพื่อเรียกหา [scoped_relative.GetFirstName] จากอีกฟากของโถง ทว่า[ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('scoped_relative'))]ของข้าเพียงชำเลืองมองอย่างอับอายก่อนจะรีบจากไป"
 bishop.2002.desc.c:0 "ข้ามองไปรอบโต๊ะอาหารค่ำ พยายามเริ่มบทสนทนา แต่กลับพบเพียงสายตาอับอายและใบหน้าที่หันหนี"
 bishop.2002.desc.a:0 "\n\nครอบครัวของข้าเองกลับถูกยุยงให้ต่อต้านข้า โดย [scoped_bishop.GetCouncilTitle] [scoped_bishop.GetFirstName] ผู้เป็น[scoped_bishop.Custom2('InsultAdjective', ROOT.Char)] [scoped_bishop.Custom2('InsultNoun', ROOT.Char)] ผู้นั้น [scoped_bishop.GetSheHe|U] มีนิสัยชอบกระซิบคำโกหกใส่หูญาติพี่น้องของข้าทุกครั้งที่พวกเขาไปขอคำแนะนำทางจิตวิญญาณจาก[scoped_bishop.GetHerHim] โดยอ้างว่าข้าเป็น[ROOT.Char.GetTitleTierName] ที่ชั่วร้าย และ [ROOT.GetCharacter.GetFaith.HighGodName] ได้สาปแช่งตระกูลของเรา"
 bishop.2002.a:0 "ข้าก็มีบางอย่างจะพูดเกี่ยวกับ[scoped_bishop.GetHerHim] เช่นกัน..."
 tooltip.bishop.2002.a.success:0 "ข้าโน้มน้าวญาติของข้าได้ว่า [scoped_bishop.GetTitledFirstName] กำลังโป้ปด"
 bishop.2002.success.a.desc.tt:0 "ข้าเปิดโปงความพยายามใส่ร้ายข้าของ[scoped_bishop.GetFirstNamePossessive]"
 tooltip.bishop.a.2002.fail:0 "ครอบครัวของข้ายังคงไม่เชื่อคำพูดของข้า"
 bishop.2002.failure.a.desc.tt:0 "ญาติของข้าปฏิเสธที่จะฟังข้า"
 bishop.2002.b:0 "การแสดงความสำนึกผิดต่อสาธารณะจะช่วยได้หรือไม่?"
 bishop.2002.c:0 "ข้าจะไม่ยอมให้[scoped_bishop.GetCouncilTitle|U]มาบ่อนทำลายข้า!"

 bishop.2003.t:0 "นักบวชของประชาชน"
 bishop.2003.desc:0 "ไม่มีวันใดผ่านไปโดยที่ [scoped_bishop.GetCouncilTitle] [scoped_bishop.GetFirstName] ไม่เยาะเย้ยข้าในระหว่างเทศนาของ[scoped_bishop.GetHerHis]\n\n[scoped_bishop.Custom2('InsultNoun', ROOT.Char)] ที่หมกมุ่นผู้นั้นมั่นใจว่าข้าเป็นสมุนของ[ROOT.Char.GetFaith.DevilName] และจะไม่หยุดพักจนกว่า[scoped_bishop.GetSheHe] จะยุยงเหล่าไพร่ให้ต่อต้านข้าได้สำเร็จ"
 bishop.2003.a:0 "เงินบริจาคและการผ่อนปรนเล็กน้อยคงจะ ทำให้[scoped_bishop.GetHerHim]สงบลงได้..."
 bishop.2003.b.a:0 "ข้าควบคุมทุกอย่างได้อย่างสมบูรณ์!"
 bishop.2003.b.b:0 "ชิ เรื่องเลวร้ายที่สุดที่อาจเกิดขึ้นได้คืออะไรกัน?"
 bishop.2003.c:0 "ข้าจะไม่ทนต่อการขัดขืนคำสั่งจากข้าหลวงของข้าเอง!"
 bishop.2003.c.infidel:0 "ถึงเวลาแล้วที่จะต้องปิดปาก[scoped_bishop.GetHerHim]เสียที"
 bishop.2002.everyrelative.custom:0 "ทุก[family_member|E][scoped_bishop.GetFaith.GetAdjective]อื่น ๆ ของข้า"
 bishop.2002.everypiousrelative.custom:0 "ทุก[family_member|E][scoped_bishop.GetFaith.GetAdjective]ผู้เปี่ยมศรัทธาของข้า"
 bishop.2003.countyunrest.custom:0 "ทุก[county|E][scoped_bishop.GetFaith.GetAdjective]ใน[domain|E]ของข้า"
 bishop.2003.everytheocrat.custom:0 "ทุกข้าหลวง[theocratic|E][scoped_bishop.GetFaith.GetAdjective]"
 
 bishop.2004.t:0 "ในสายตาของผู้คลั่งศาสนา"
 bishop.2004.desc:0 "[scoped_bishop.GetCouncilTitle] [scoped_bishop.GetFirstName] ของข้าได้บ่นเรื่อง 'การขาดความศรัทธา' ที่ถูกกล่าวหาของข้าในทุกการเทศนาช่วงหลังนี้\n\nดูเหมือนว่า[scoped_bishop.GetSheHe] จะเลยเถิดถึงขั้นเรียกข้าว่า '[root_scope.Custom2('InsultNoun', SCOPE.sC('scoped_bishop'))] ผู้ไร้ศรัทธา' และเหล่าข้าหลวงที่เคร่งศาสนาของข้าก็เริ่มที่จะฟัง[scoped_bishop.GetHerHim]..."
 bishop.2004.theologian:0 "นี่เป็นการโป้ปดและใส่ร้ายอย่างชัดแจ้ง!"
 bishop.2004.a:0 "ข้าคิดว่า 'การบริจาคด้วยศรัทธาอันบริสุทธิ์' อีกครั้งอาจจะช่วยได้..."
 bishop.2004.b:0 "ชิ! ปล่อยให้พวกเขาเชื่อในสิ่งที่พวกเขาจะเชื่อไปเถอะ"
