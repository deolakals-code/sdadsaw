l_english: 

 adultery.0002.t:0 "ผู้อื่น"
 adultery.0002.consort_start.desc:0 "[lover_spouse.Custom2('MyCharacterIntroduction', ROOT.Char)|U] มิได้อยู่ใน [ROOT.Char.Custom('GetChamber')|l] ของเราอีกคราเมื่อรัตติกาลมาเยือน หมู่นี้ [lover_spouse.GetSheHe|U] ดูห่างเหิน — เหม่อลอยและไม่ค่อยปรากฏตัวที่ [ROOT.Char.Custom('GetCourt')|l] เลย"
 adultery.0002.soulmate_start.desc:0 "นานเหลือเกินแล้วที่ข้ามิได้โอบกอด [lover_spouse.Custom2('MyCharacterIntroduction', ROOT.Char)] ไว้ในอ้อมแขน หมู่นี้ [lover_spouse.GetSheHe|U] ดูห่างเหิน — [lover_spouse.GetSheHe] อ้างเหตุผลครั้งแล้วครั้งเล่าว่าเหตุใดเราจึงพบกันมิได้"
 adultery.0002.desc:1 "\n\nข้ามิอาจ ทำให้ [lover_spouse.GetHerHis] พึงพอใจได้หรือ? หรือ [lover_spouse.GetSheHe] เพียงแค่กำลังยุ่ง? หรือว่า [lover_spouse.GetSheHe] กำลังกกกอดผู้อื่นอยู่...?"
 adultery.0002.a:0 ""เจ้ามีผู้อื่นใช่หรือไม่, [lover_spouse.GetFirstNameNoTooltip]?""
 adultery.0002.a.tt:0 "ข้าเผชิญหน้ากับ [lover_spouse.GetTitledFirstNameNoTooltip]"
 adultery.0002.b:0 "ข้าจะสืบเรื่องนี้ด้วยตนเอง"
 adultery.0002.b.tt:0 "หาก [lover_spouse.GetSheHe] นอกใจ ข้าจะต้องรู้ให้ได้"
 adultery.0002.b.success:0 "ข้าสืบรู้เรื่องชีวิตรักของ [lover_spouse.GetHerHis] ได้สำเร็จ"
 adultery.0002.b.success.innocent:0 "[lover_spouse.GetTitledFirstName] บริสุทธิ์"
 adultery.0002.b.failure:0 "ข้าไม่พบหลักฐานการนอกใจ"
 adultery.0002.c:0 "ทุกย่างก้าวของ [lover_spouse.GetHerHis|U] จะถูกจับตามอง"
 adultery.0002.c.tt:0 "[spymaster|E] ของข้าจะคอยสอดแนม [lover_spouse.GetShortUIName] ต่อไป"
 adultery.0002.d:0 "[lover_spouse.GetSheHe|U] ไม่มีวันลบหลู่ความศักดิ์สิทธิ์ของการสมรสของเรา!"
 adultery.0002.d.concubine_or_soulmate:0 "[lover_spouse.GetSheHe|U] ไม่มีวันดูหมิ่นข้า เช่นนี้!"

 adultery.0003.t:0 "ข้อกล่าวหา"
 adultery.0003.desc:0 "หมู่นี้ [spouse.Custom2('MyCharacterIntroduction', ROOT.Char)|U] ดูตึงเครียด และเมื่อเราอยู่กันตามลำพัง ในที่สุดก็ปรากฏชัดเจนว่า เพราะเหตุใด\n\n"โปรดบอกความจริงแก่ข้าเถิด" [spouse.GetSheHe] กล่าวด้วยน้ำเสียงเคร่งขรึม "มีผู้อื่นอยู่ใช่หรือไม่? ท่านมีชู้รักหรือ?""
 adultery.0003.a:0 "หามิได้แน่นอน!"
 adultery.0003.a.tt_lie:0 "ข้าหวังว่า [spouse.GetSheHe] จะเชื่อ..."
 adultery.0003.a.tt_truth:0 "เหตุใด [spouse.GetSheHe] จึงสงสัย เช่นนี้..."
 adultery.0003.b:0 "ข้านึกว่าท่านไม่ทันสังเกตเสียอีก..."
 adultery.0003.b.tt:0 "[spouse.GetSheHe|U] อาจให้อภัยท่าน หรือไม่ก็ได้..."

 adultery.0004.desc:0 ""ท่านกล่าว เช่นนี้ได้อย่างไร, [spouse.GetFirstNameNoTooltip]? ข้าไม่มีวันมีชู้รัก!"\n\n[lover_spouse.GetTitledFirstName] ดูไม่พอใจอย่างแท้จริงขณะที่ [lover_spouse.GetSheHe] ปฏิเสธข้อกล่าวหาของข้า"
 adultery.0004.b:0 "ข้ามีทางเลือกน้อยนัก นอกจากเชื่อคำพูด [lover_spouse.GetHerHis] ของ [lover_spouse.GetHerHim]"
 adultery.0004.b.malicious:0 "สำหรับตอนนี้..."

 # Shares some text with infidelity_confrontation.1000, the event for discovering a lover secret
 adultery.0006.apologetic_start.desc:1 "[lover_spouse.GetFirstNameNoTooltip] นิ่งเงียบราวกับถูกแช่แข็ง แต่ข้ามองเห็นได้ในดวงตาของ [lover_spouse.GetHerHis] ความกลัวของข้าเป็นจริง ข้าเองก็ดูเหมือนจะแข็งค้างไป เช่นกัน — เว้น แต่หัวใจของข้า ซึ่งกำลังเต้นระรัว\n\nเมื่อถ้อยคำหลุดออกจากริมฝีปากของ [lover_spouse.GetFirstNamePossessiveNoTooltip] ในที่สุด หยาดน้ำตาก็ไหลรินจากดวงตาของ [lover_spouse.GetHerHis] เช่นกัน "ได้โปรดเถิด ที่รักของข้า [lover_spouse.Custom2('RelationToMe', SCOPE.sC('spouse'))] ท่านต้องให้อภัยข้า ข้าขอร้องท่าน! ข้า... ข้าจะบอกท่านทุกอย่าง ข้าได้ร่วมเตียงกับ "
 adultery.0006.your_lovername.desc:1 "[sex_partner.Custom2('YourCharacterIntroductionNoComma', ROOT.Char)]"
 adultery.0006.my_lovername.desc:1 "[sex_partner.Custom2('MyCharacterIntroductionNoComma', lover_spouse)]"
 adultery.0006.unapologetic_start.desc:1 "[lover_spouse.GetFirstNameNoTooltip] ไม่คาดคิดว่าจะถูกข้ากล่าวหา นั่นชัดเจนนัก ทว่า [lover_spouse.GetSheHe|U] ก็มิได้หวั่นไหวนานนัก\n\n"ใช้เวลานานทีเดียวกว่าท่านจะสังเกตเห็น, #EMP [lover_spouse.Custom2('RelationToMe', SCOPE.sC('spouse'))]#!." วาจาของ [lover_spouse.GetHerHis|U] อาบไปด้วยยาพิษ "ใช่ ข้าได้นอนกับผู้อื่น – "
 adultery.0006.male_lover.desc:0 "ชายผู้ไร้ความสำคัญ ข้าไม่รู้แม้กระทั่งชื่อของเขา"
 adultery.0006.female_lover.desc:0 "หญิงผู้ไร้ความสำคัญ ข้าไม่รู้แม้กระทั่งชื่อของนาง"
 adultery.0006.apologetic_end.desc:0 "มันเกิดขึ้นเพียงครั้งเดียว ข้าสาบาน!""
 adultery.0006.unapologetic_end.desc:0 "มันเกิดขึ้นเพียงครั้งเดียว แต่จงเชื่อคำข้าเถิด ข้ายินดีจะทำมันอีก""

 adultery.0006.a:0 "ทุกคนจะได้รู้ถึงการทรยศของเจ้า, เจ้า[lover_spouse.Custom2('InsultNounSexual', ROOT.Char)]!"
 adultery.0006.b:0 "ข้าให้อภัยเจ้า ครั้งนี้"
 adultery.0006.c:0 "หากข้าไม่อาจเชื่อใจ [lover_spouse.GetHerHim] ได้อีกต่อไป แล้วเราจะเหลือสิ่งใดเล่า?"

 adultery.0007.start.desc:0 "ความกังวลของข้ามิได้ไร้มูล ข้าพบหลักฐานการนอกใจของ [lover_spouse.GetFirstNamePossessiveNoTooltip]!\n\n"
 adultery.0007.lover_my.desc:0 "เจ้า[lover_spouse.Custom2('InsultNoun', ROOT.Char)] จอมโกหกนั่น ได้ต้อนรับ [sex_partner.Custom2('MyCharacterIntroduction', ROOT.Char)] ขึ้นเตียงของ[lover_spouse.GetHerHis]"

 adultery.0007.lover_herhis.desc:0 "เจ้า[lover_spouse.Custom2('InsultNoun', ROOT.Char)] จอมโกหกนั่น ได้ต้อนรับ [sex_partner.Custom2('HerHisCharacterIntroduction', lover_spouse)] ขึ้นเตียงของ[lover_spouse.GetHerHis]"
 adultery.0007.male_lover.desc:0 "[lover_spouse.GetSheHe|U] ได้ ทำให้ [lover_spouse.GetHerselfHimself] มัวหมองกับสามัญชนชั้นต่ำ ชายผู้ไร้ความสำคัญ"
 adultery.0007.female_lover.desc:0 "[lover_spouse.GetSheHe|U] ได้ ทำให้ [lover_spouse.GetHerselfHimself] มัวหมองกับสามัญชนชั้นต่ำ หญิงผู้ไร้ความสำคัญ"
 adultery.0007.end.desc:0 "เท่าที่ข้าทราบ มันเกิดขึ้นเพียงครั้งเดียว ช่างเป็นการปลอบใจที่เย็นชาเมื่อต้องเผชิญกับการทรยศของ [lover_spouse.GetHerHis]..."

 adultery.0008.t:0 "ถูกค้นพบ"
 adultery.0008.sex_partner.desc:0 "ข้านึกว่าข้าระมัดระวังอย่างดีแล้ว ว่าไม่มีหลักฐานใดๆ เกี่ยวกับการสมสู่เล็กๆ น้อยๆ ของข้ากับ [sex_partner.Custom2('MyCharacterIntroductionNoComma', ROOT.Char)] แต่ ทว่า ด้วยวิธีใดที่หยั่งไม่ถึง [spouse.Custom2('MyCharacterIntroduction', ROOT.Char)] ได้ค้นพบและเปิดโปงความลับของเราให้โลกรู้!"
 adultery.0008.no_sex_partner.desc:0 "ข้านึกว่าข้าระมัดระวังอย่างดีแล้ว ว่าไม่มีหลักฐานใดๆ เกี่ยวกับการสมสู่เล็กๆ น้อยๆ ของข้า แต่ ทว่า ด้วยวิธีใดที่หยั่งไม่ถึง [spouse.Custom2('MyCharacterIntroduction', ROOT.Char)] ได้ค้นพบเรื่องชู้สาวของข้าและเปิดโปงให้โลกรู้!"
 adultery.0008.a:0 "[ROOT.Char.Custom('CulturalCurse')|U]!"

 adultery.0009.desc:0 "น้ำตาของ [spouse.GetTitledFirstNamePossessive] เจ็บปวดยิ่งกว่าคำพูดรุนแรงใดๆ ข้ายืนสิ้นหวังขณะที่ [spouse.GetSheHe] ซ่อนใบหน้า [spouse.GetHerHis] ไว้ในผ้าเช็ดหน้า\n\n"ข้า... ข้านึกว่าเราจะอยู่ด้วยกันตลอดไป" [spouse.GetSheHe] กระซิบผ่านเสียงสะอื้น "เราสัญญาแล้ว #EMP ท่าน#! สัญญาแล้ว, [ROOT.Char.GetFirstNameNoTooltip] — แต่ท่านก็ยังร่วมเตียงกับผู้อื่น ข้าไม่อาจเชื่อใจท่านได้อีกแล้ว มันจบสิ้นแล้ว""
 adultery.0009.a:0 "ข้าช่างโง่เขลาเสียจริง..."

 adultery.1001.t:0 "คำถามแห่งความภักดี"
 adultery.1001.opening:0 "[ROOT.Char.Custom2('RelationToMe', SCOPE.sC('mother'))] ของข้า, [mother.GetTitledFirstName], กำลังตั้งครรภ์ และข้าควรจะยินดีเป็นอย่างยิ่ง ทว่า [mother.GetSheHe] กลับมีท่าทีแปลกไป และข้าสลัดความรู้สึกที่ว่ามีบางอย่างผิดปกติไปไม่ได้\n\n"
 adultery.1001.default:1 "ข้าเป็นบิดาจริงๆ ดังที่ [mother.GetSheHe] อ้าง หรือว่า [mother.GetSheHe] ได้ทรยศต่อพันธะของเรา?"
 adultery.1001.hard_to_believe:0 "ยากที่จะเชื่อว่า [mother.GetSheHe] จะทรยศข้า เช่นนี้ แต่เป็นไปได้หรือไม่ว่าข้าไม่ใช่บิดา?"
 adultery.1001.easy_to_believe:0 "ดูเหมือนเป็นไปได้เหลือเกินว่า [mother.GetSheHe] จะทรยศข้า และข้าไม่ใช่บิดาของบุตรในครรภ์ของ [mother.GetHerHis]"
 adultery.1001.desc_sadistic:0 "ข้าไม่คิดว่า [mother.GetHerHim] จะอุ้มท้องบุตรของผู้อื่นเพียงเพื่อทรมานข้า"
 adultery.1001.desc_lustful:0 "ข้ากังวลเสมอมาว่าความใคร่ที่ไม่รู้จักพอของ [mother.GetHerHis] นั้นเป็นเรื่องทั่วไป มิใช่เพียงแค่กับข้า บุตรในครรภ์อาจเป็นของผู้อื่นหรือไม่?"
 adultery.1001.desc_deceitful:0 "[mother.GetSheHe|U] อ้างว่าข้าเป็นบิดา แต่ [mother.GetSheHe] เคยโกหกข้ามาหลายครั้งแล้ว"
 adultery.1001.desc_root_trusting:0 "ข้าสงสัยว่าข้าอาจไม่ใช่บิดา แต่... [mother.GetSheHe|U] ไม่มีวันเก็บเรื่อง เช่นนั้นไว้กับตัวใช่หรือไม่?"
 adultery.1001.desc_root_lunatic:0 "พวกเขากระซิบบอกข้า ข้าเข้าใจ ข้าคิดว่าข้าเข้าใจ ข้าจะเป็นบิดาของสิ่งนั้นในตัวนางได้อย่างไร? สิ่งที่โหดร้ายและน่าสะพรึงกลัวนั่น?"
 adultery.1001.desc_lunatic:0 "[mother.GetSheHe|U] อ้างว่าข้าเป็นบิดา แต่ [mother.GetSheHe] ก็อ้างว่าเงาพูดคุยกับ [mother.GetHerHim] ด้วย"
 adultery.1001.a:0 "[mother.GetSheHe|U] ต้องบอกข้า!"
 adultery.1001.a.tt:0 "เผชิญหน้ากับ [mother.GetFirstNameNoTooltip] โดยตรง"
 adultery.1001.b:0 "ข้าจะตรวจสอบเรื่องนี้อย่างลับๆ"
 adultery.1001.b_no_scheme:0 "ข้าควรตรวจสอบเรื่องนี้ภายหลัง..."
 adultery.1001.b_cannot_start_scheme:0 "#F ข้าไม่มีเวลาตรวจสอบเรื่องนี้ในตอนนี้ แต่ข้าจะจำไว้...#!"
 adultery.1001.c:0 "ข้าต้องเป็นบิดาแน่นอน"
 adultery.1001.c.tt:0 "#F เหตุใดข้าต้องกังวลกับเรื่องไร้สาระด้วยเล่า?#!"

 adultery.1002.t:0 "ความสงสัยที่คืบคลาน"
 adultery.1002.desc_paranoid:1 ""ข้ารู้ว่าเด็กคนนี้ไม่ใช่ลูกข้าจริงๆ!" ดวงตาของ [spouse.Custom('WifeHusbandPossessive')] เบิกกว้างด้วยข้อกล่าวหา "ใครกัน?" [adultery_spouse.GetSheHe] ยืนกราน "ใคร?""
 adultery.1002.desc_chaste:0 ""บุตรที่ท่านอุ้มท้องอยู่นั้นเป็นของข้าจริงหรือ?" [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('spouse'))] ของข้าถาม "ข้ารู้ว่าความทุ่มเทของข้านั้น... ในฐานะ [spouse.GetWomanMan]... ต่อ [spouse.GetFaith.HighGodName] ก่อนสิ่งอื่นใด""
 adultery.1002.desc_craven:0 ""คือ... คือบุตรเป็นของข้าจริงหรือ?" [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('adultery_spouse'))] ของข้าดูเหมือน [adultery_spouse.GetSheHe] จะกลัวคำตอบ"
 adultery.1002.desc_vengeful:0 ""บุตรที่ท่านอุ้มท้องอยู่นั้นเป็นของข้าจริงหรือ?" [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('adultery_spouse'))] ของข้าถาม "ข้าสาบานต่อ [adultery_spouse.GetFaith.HighGodName] หากท่านโกหกข้า...""
 adultery.1002.desc_compassionate:0 ""บุตรที่ท่านอุ้มท้องอยู่นั้นเป็นของข้าจริงหรือ?" [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('adultery_spouse'))] ของข้าถาม "ข้าไม่ต้องการให้ท่านต้องทนทุกข์ ไม่ว่าท่านจะทำสิ่งใดลงไปก็ตาม""
 adultery.1002.worried:0 ""บอกข้าเถิด เป็นของข้าจริงหรือ?" [adultery_spouse.GetTitledFirstName] ดูเหมือนเป็นทุกข์ ดวงตาของ [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('adultery_spouse'))] สบตาข้าด้วยแววตากังวล"
 adultery.1002.desc_sadistic:0 ""ท่านไม่ได้ตั้งท้องกับ [spouse.GetWomanMan] อื่นใช่หรือไม่?" [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('spouse'))] ของข้ามองข้าอย่างระมัดระวัง "ท่านรู้ใช่ไหมว่านั่นเกือบจะเลวร้ายพอๆ กับการโกหกข้า?" [spouse.GetSheHe|U] ยิ้ม"
 adultery.1002.desc_lunatic:0 ""บุตรเป็นของข้าหรือไม่?!" ดวงตาของ [adultery_spouse.GetTitledFirstNamePossessive] กลอกไปมาอย่างรุนแรงในศีรษะของ [adultery_spouse.GetHerHis] "พวกเขาจะบอกข้า ท่านรู้ไหม!""
 adultery.1002.conclusion:0 "\n\nข้า [ROOT.Char.Custom2('QuirkPersonalTowardsOther', SCOPE.sC('adultery_spouse'))]"
 adultery.1002.a:0 "ข้าต้องบอกความจริงแก่ท่าน"
 adultery.1002.a.confession_tt:0 "[adultery_spouse.GetShortUIName|U] จะได้รู้ความจริง"
 adultery.1002.b:0 "แน่นอนว่าเป็นของท่าน, [adultery_spouse.GetFirstNameNoTooltip]!"
 adultery.1002.b.tt:0 "#F หวังว่า [adultery_spouse.GetSheHe|U] จะไม่ถามคำถามเพิ่มเติม#!"
 adultery.1002.c:0 "แน่นอนว่าเป็นของท่าน, [adultery_spouse.GetFirstNameNoTooltip]!"
 adultery.1002.c.tt:0 "#F [adultery_spouse.GetSheHe|U] ต้องเชื่อแน่ว่าเป็นเช่นนั้น!#!"

 adultery.1003.desc:0 ""แน่นอนว่าบุตรเป็นของท่าน" [mother.GetFirstName] [ROOT.Char.Custom2('QuirkPresentPosOrNeg', SCOPE.sC('mother'))] "เหตุใดท่านจึงคิดเป็นอื่นไปได้?""
 adultery.1003.a:0 "ข้าเพียงต้องการได้ยิน [mother.GetHerHim] กล่าวเท่านั้น"
 adultery.1003.a.tt:0 "#F ช่างเป็นเรื่องน่าสบายใจที่ได้รู้#!"
 adultery.1003.b:0 "ข้าไม่เชื่อ [mother.GetHerHim]!"
 adultery.1003.duel_success:0 "ค้นพบความจริง"
 adultery.1003.duel_success_tt:0 "หากมีผู้อื่นเป็นบิดาของบุตรในครรภ์ของ [mother.GetFirstNamePossessiveNoTooltip] ข้าจะหาหลักฐานการนอกใจของ [mother.GetHerHis] ให้พบ"
 adultery.1003.duel_failure:0 "สายลับถูกค้นพบ"

 adultery.1004.default_reaction:0 "น้ำตาคลอเบ้าในดวงตาของ [mother.GetTitledFirstNamePossessive]"
 adultery.1004.reaction_callous:0 "[mother.GetTitledFirstName] จ้องมองข้า ใบหน้าของ [mother.GetHerHis] ไม่ไหวติง"
 adultery.1004.reaction_sadistic:0 "[mother.GetTitledFirstName] ยิ้มเยาะให้ข้า"
 adultery.1004.reaction_gluttonous:0 "[mother.GetTitledFirstName] พยายามซ่อนน้ำตาที่คลอเบ้าในดวงตาของ [mother.GetHerHis] หลังขนมปังก้อนหวานของ [mother.GetHerHis]"
 adultery.1004.reaction_deceitful:0 ""ข้าเหนื่อยเหลือเกินกับการโกหก" [mother.GetTitledFirstName] ดูเหมือนใกล้จะร้องไห้"
 adultery.1004.reaction_compassionate:0 ""ท่านควรนั่งลง ที่รัก" มีความห่วงใยอย่างแท้จริงในดวงตาของ [mother.GetTitledFirstNamePossessive]"
 adultery.1004.reaction_honest:0 ""ข้าไม่ต้องการโกหกท่าน หรือผู้ใด" ดวงตาของ [mother.GetTitledFirstNamePossessive] แดงก่ำจากการร้องไห้"
 adultery.1004.reaction_lunatic:0 "[mother.GetTitledFirstName] ดูมีสติอย่างผิดปกติขณะที่ [mother.GetSheHe] จ้องมองข้า จากนั้นดวงตาของ [mother.GetHerHis] ก็ขุ่นมัว "เสียงกระซิบได้บอกท่านแล้วหรือ?""
 adultery.1004.reaction_positive_opinion:0 ""ท่านต้องเข้าใจนะ ข้าไม่เคยต้องการทำร้ายท่านเลย" น้ำตาไหลอาบใบหน้าของ [mother.GetTitledFirstNamePossessive]"
 adultery.1004.reaction_negative_opinion:0 "ริมฝีปากของ [mother.GetTitledFirstNamePossessive] เม้มเป็นเส้นบางในสีหน้าแข็งกระด้างของ [mother.GetHerHis] "เกือบจะเป็นการปลดปล่อยเสียด้วยซ้ำ ท่านรู้ไหม""
 adultery.1004.default_admission:0 "\n\nหลังจากความเงียบอันยาวนาน ในที่สุด [mother.GetSheHe] ก็ยอมรับ "[real_father.GetTitledFirstName] คือบิดาที่แท้จริงของบุตรข้า""
 adultery.1004.a:0 "เป็นไปได้อย่างไร? ข้าต้องการเวลาคิด"
 adultery.1004.a.tt:0 "ข้าเก็บความลับนี้ไว้กับตัว สำหรับตอนนี้"
 adultery.1004.b:0 "ความลับนี้ต้องอยู่ระหว่างเราเท่านั้น!"
 adultery.1004.c:0 "ทุกคนจะได้รู้ถึงการนอกใจของเจ้า!"


 adultery.1006.t:0 "[adultery_spouse.GetSheHe|U] รู้แล้ว"
 adultery.1006.very_positive_opinion:0 ""ใช่ [real_father.GetTitledFirstName] คือบิดา" เกือบจะเป็นการปลดปล่อยที่ไม่ต้องเก็บความลับนี้จาก [adultery_spouse.GetSheHe] อีกต่อไป"
 adultery.1006.very_negative_opinion:0 ""ใช่ [real_father.GetTitledFirstName] คือบิดา" ข้าอดไม่ได้ที่จะสนุกกับการตอกย้ำ"
 adultery.1006.fallback:0 ""ใช่ [real_father.GetTitledFirstName] คือบิดา..." ข้าไม่มีทางเลือกอื่นนอกจากสารภาพ"
 adultery.1006.conclusion:0 "\n\nอย่างน้อยก็มีเพียง [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('adultery_spouse'))] ของข้าเท่านั้นที่รู้"
 adultery.1006.a:0 "จะเกิดอะไรขึ้นต่อไป?"

 adultery.1009.t:0 "ความสงสัยคลี่คลาย"
 adultery.1009.desc:0 "ดูเหมือนว่าความกลัวของข้าอาจไร้มูล แม้ว่าสายลับของข้าจะพยายามทุกวิถีทาง ข้าก็ไม่พบข้อบ่งชี้ใดๆ ว่า [mother.GetTitledFirstName] นอกใจ\n\nน่าเสียดายที่ [mother.GetSheHe] ได้รู้ถึงความสงสัยของข้า และผิดหวังในตัวข้ามาก"
 adultery.1009.a:0 "แน่นอนว่าข้าเชื่อใจท่านมาตลอด ที่รัก!"
 adultery.1009.a.flavor_tt:0 "ข้าเพียงแค่ต้องแน่ใจเท่านั้น"

 adultery.2001.t:0 "[adultery_child.Custom('GetDaughterSon')|U] ของข้า"
 adultery.2001.desc_dislike:0 "บางครั้งข้าก็สงสัยเกี่ยวกับ [adultery_child.GetTitledFirstName] สิ่งที่ [adultery_child.GetSheHe] พูด บุคลิกที่น่ารำคาญของ [adultery_child.GetHerHis] วิธีที่ [adultery_child.GetSheHe] มักจะกวนประสาทข้าเสมอ... [adultery_child.GetSheHe|U] แปลกแยกสำหรับข้าราวกับเป็นไพร่ฟ้าคนหนึ่ง"
 adultery.2001.desc_suspicious_mother:0 "[ROOT.Char.Custom2('RelationToMe', SCOPE.sC('adultery_spouse'))] ของข้า [adultery_spouse.GetTitledFirstName] กำลังปิดบังบางอย่างเกี่ยวกับ [adultery_child.Custom('GetDaughterSon')] ของเรา ข้าแน่ใจ! การเหลือบมองอย่างลับๆ ความปกป้อง [adultery_child.GetTitledFirstName] ของนาง วิธีที่ [adultery_spouse.GetSheHe] หลีกเลี่ยงคำถามทั้งหมดของข้า..."
 adultery.2001.desc_mother_lover:0 "นับตั้งแต่ข้ารู้ว่า [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('adultery_spouse'))] ของข้า [adultery_spouse.GetTitledFirstName] ได้นอกใจต่อพันธะของเรา ข้ามองทุกคนที่ใกล้ชิดกับ [adultery_spouse.GetHerHim] ด้วยความสงสัย; ข้าราชบริพารทุกคนที่เดินผ่านไปมา แม้กระทั่ง [ROOT.Char.Custom('ChildChildrenGender')] ของข้าเอง..."
 adultery.2001.desc_fallback:0 "เมื่อใดก็ตามที่ข้าพูดถึง [adultery_child.GetTitledFirstName] กับ [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('adultery_spouse'))] ของข้า [adultery_spouse.GetTitledFirstName] [adultery_spouse.GetSheHe] ก็มักจะตีตัวออกห่าง ตอนแรกข้าไม่ได้คิดอะไร แต่ตอนนี้ข้าเริ่มสงสัยว่า [adultery_spouse.GetFirstName] กำลังปิดบังบางอย่าง"
 adultery.2001.desc_end:1 "\n\nข้ามิได้ตั้งคำถามถึงสายเลือดของ [adultery_child.Custom('GetDaughterSon')] ของข้า [adultery_child.GetTitledFirstName] อย่างง่ายดาย แต่ความสงสัยกำลังกัดกินใจข้า"
 adultery.2001.a:0 "ข้าต้องแน่ใจ!"
 adultery.2001.b:0 "แน่นอนว่า [adultery_child.GetSheHe] คือ [adultery_child.Custom('GetDaughterSon')] ของข้า"
 adultery.2001.a.tt:0 "หาก [adultery_child.GetFirstNameNoTooltip] ไม่ใช่บุตรที่แท้จริงของข้า:"
 adultery.2001.a.duel_success:1 "ข้าสอดแนมครอบครัวของข้าได้สำเร็จ"
 adultery.2001.a.duel_success.tooltip:0 "ท่านค้นพบความจริง ไม่ว่ามันจะเป็นอะไรก็ตาม"
 adultery.2001.a.duel_failure:1 "ข้าถูกจับได้ขณะพยายามเปิดเผยความจริง"

 adultery.2002.t_a:0 "บุตรของเรา"
 adultery.2002.desc_no_child:0 "ข้าโบกมือให้ [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('adultery_spouse'))] ของข้า [adultery_spouse.GetTitledFirstName] ขณะที่ [adultery_spouse.GetSheHe] เดินข้ามสวน แต่ [adultery_spouse.GetSheHe] หันหน้าหนีอย่างเห็นได้ชัด\n\nความกังวลเริ่มแรกของข้าเกี่ยวกับความซื่อสัตย์ของ [adultery_spouse.GetHerHis] ดูเหมือนจะเป็นความเข้าใจผิด อย่างไรก็ตาม [adultery_spouse.GetFirstNameNoTooltip] คงไม่ลืมเรื่องนี้ในเร็ววัน"
 adultery.2002.desc_not_born:0 "ข้าโบกมือให้ [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('adultery_spouse'))] ของข้า [adultery_spouse.GetTitledFirstName] ขณะที่ [adultery_spouse.GetSheHe] เดินข้ามสวน แต่ [adultery_spouse.GetSheHe] หันหน้าหนีอย่างเห็นได้ชัด\n\nความกังวลเริ่มแรกของข้าเกี่ยวกับความซื่อสัตย์ของ [adultery_spouse.GetHerHis] ดูเหมือนจะเป็นความเข้าใจผิด อย่างไรก็ตาม [adultery_spouse.GetFirstNameNoTooltip] คงไม่ลืมเรื่องนี้ในเร็ววัน"
 adultery.2002.desc_spouse:0 "ข้าโบกมือให้ [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('adultery_spouse'))] ของข้า [adultery_spouse.GetTitledFirstName] ขณะที่ [adultery_spouse.GetSheHe] เดินข้ามสวน แต่ [adultery_spouse.GetSheHe] หันหน้าหนีอย่างเห็นได้ชัด\n\nความกังวลเริ่มแรกของข้าเกี่ยวกับสายเลือดของ [adultery_child.GetTitledFirstNamePossessive] ดูเหมือนจะเป็นความเข้าใจผิด อย่างไรก็ตาม พวกเขาคงไม่ลืมเรื่องนี้ในเร็ววัน"
 adultery.2002.desc:0 "ข้าโบกมือให้ [adultery_child.Custom('GetDaughterSon')] ของข้า [adultery_child.GetTitledFirstName] ขณะที่ [adultery_child.GetSheHe] เดินข้ามสวน และข้าพยายามปัดเป่าความสงสัยอันมืดมนของข้า\n\nความกังวลเริ่มแรกของข้าเกี่ยวกับสายเลือดของ [adultery_child.GetTitledFirstNamePossessive] ดูเหมือนจะเป็นความเข้าใจผิด อย่างไรก็ตาม พวกเขาคงไม่ลืมเรื่องนี้ในเร็ววัน"
 adultery.2002.a_spouse:0 "หากพวกเขาคิดว่าจะซ่อนสิ่งต่างๆ จากข้าได้ พวกเขาคิดผิด!"
 adultery.2002.a_unborn:0 "[adultery_spouse.GetSheHe|U] ซ่อนอะไรจากข้าไม่ได้!"
 adultery.2002.a:0 "[adultery_child.GetSheHe|U] ซ่อนอะไรจากข้าไม่ได้!"
 adultery.2002.a_spouse_tt:0 "#F ข้าจะจับตาดูพวกเขาใกล้ชิดยิ่งขึ้น!#!"
 adultery.2002.a.tt_unborn:0 "#F ข้าจะจับตาดู [adultery_spouse.GetHerHim] ใกล้ชิดยิ่งขึ้น!#!"
 adultery.2002.a.tt:0 "#F ข้าจะจับตาดู [adultery_child.GetHerHim] ใกล้ชิดยิ่งขึ้น!#!"
 adultery.2002.b:0 "ช่างโล่งใจเสียจริง!"

 adultery.2003.desc:0 ""ใช่แล้ว ท่านพ่— [ROOT.Char.GetFirstNameNoTooltip], [real_father.GetTitledFirstName] คือ [real_father.Custom('MotherFather')] ที่แท้จริงของข้า!"\n\nความเจ็บปวดจากการทรยศของ [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('adultery_spouse'))] [adultery_spouse.GetTitledFirstNamePossessive] เกือบจะถูกบดบังด้วยความโล่งใจที่ได้รู้ความจริงในที่สุด นึกไม่ถึงว่า [adultery_spouse.GetSheHe] และ [adultery_child.GetFirstName] จะปิดบังเรื่องนี้จากข้า..."
 adultery.2003.a:0 "พวกเขาหลอกลวงข้า เช่นนี้ได้อย่างไร?!"

 
 adultery.2006.t:0 "วงศ์ตระกูลของข้า"
 adultery.2006.desc:0 "[ROOT.Char.Custom2('RelationToMe', SCOPE.sC('owner'))] ของข้า [owner.GetTitledFirstName] ได้รู้แล้วว่าข้าคือ [ROOT.Char.Custom('GetDaughterSon')] ของ [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('real_father'))] ของข้า [real_father.GetTitledFirstName] และไม่ใช่ของ [owner.GetHerHim]! อย่างน้อยก็ยังไม่เป็นที่รู้กันทั่วไป...ยัง"
 adultery.2006.a:0 "ข้าจะเผชิญหน้า [owner.GetHerHim] ได้อย่างไร?"

 adultery.2008.t:0 "[adultery_child.Custom('GetDaughterSon')|U] ของข้า?"
 adultery.2008.desc:2 "ความกลัวที่ก่อตัวในอกข้านี้มีเหตุผลมาโดยตลอด!\n\nสายลับของข้าได้ค้นพบว่าข้าไม่ใช่บิดาของ [adultery_child.GetTitledFirstName] [adultery_child.GetSheHe|U] เป็นผลมาจากการสมสู่ที่ผิดทำนองคลองธรรมระหว่าง [adultery_spouse.GetFirstName] และ [real_father.Custom2('MyCharacterIntroduction', ROOT.Char)]!"
 adultery.2008.a:0 "ให้พวกเขาทุกคนรู้ไปเลย — นั่นไม่ใช่บุตรของข้า!"
 adultery.2008.b:0 "ข้าต้องการเวลาคิด"
 adultery.2008.b.tt:0 "ข้าเก็บเรื่องนี้ไว้กับตัวก่อน"

 adultery.2009.t:0 "[adultery_child.Custom('GetDaughterSon')|U] ของข้า?"
 adultery.2009.desc:1 "แม้จะติดตาม [adultery_child.GetTitledFirstName] ไปทุกหนทุกแห่ง สายลับของข้าก็ไม่พบข้อบ่งชี้ใด ๆ ที่ข้าควรสงสัยในเชื้อสายของ [adultery_child.GetHerHis]\n\nน่าเสียดายที่ [adultery_child.GetFirstNameNoTooltip] ยังคงไม่พอใจที่ข้าจะมีความสงสัยใด ๆ เลย"
 adultery.2009.a:0 "ถ้า เช่นนั้น [adultery_child.GetSheHe] ก็เป็นบุตรของข้าจริงๆ สินะ"

 adultery.3001.t:0 "ความลับ"
 adultery.3001.desc:0 ""[ROOT.Char.Custom('GetDaughterSon')] ของข้า บุตรสุดที่รักของข้า ข้าต้องบอกเจ้า! เจ้าจะให้อภัยข้าได้หรือไม่?"\n\nมารดาของข้าทรุดลงกับพื้น น้ำตาไหลอาบใบหน้าของ [parent_with_secret.GetHerHis] และข้าพูดอะไรไม่ออก"
 adultery.3001.desc_father:1 "[father.GetFirstName], [father.GetWomanMan] ที่ข้าเติบโตมาโดยคิดว่าเป็นบิดาของข้า ไม่ได้เกี่ยวข้องกับข้าเลยแม้ แต่น้อย บิดาที่แท้จริงของข้าคือ [real_father.GetTitledFirstName]!"
 adultery.3001.desc_no_father:0 "[real_father.Custom('MotherFather')] ของข้าคือ [real_father.GetTitledFirstName]!"
 adultery.3001.a:0 "[parent_with_secret.Custom('MotherFather')] ของข้าเองทำ เช่นนี้กับข้าได้อย่างไร?!"
 adultery.3001.a.tt:0 "#F อย่างน้อยก็ยังไม่เป็นที่รู้กันทั่วไป...#!"

 adultery.4001.t:0 "การทรยศของ [adultery_spouse.GetTitledFirstNamePossessiveNoTooltip]"
 adultery.4001.start.desc:0 "[ROOT.Char.Custom2('RelationToMe', adultery_spouse)] ของข้า"
 adultery.4001.unsuccessful_sex_attempt.desc:0 "พยายามยั่วยวน [sex_partner.Custom2('MyCharacterIntroductionNoComma', ROOT.Char)]?!"
 adultery.4001.fur.desc:1 "พวกเขากล่าวว่า [adultery_spouse.GetSheHe] ไปยังห้องของ [sex_partner.GetHerHis] โดยสวมเพียงขนสัตว์ และถูกโยนออกมาในทันที!"
 adultery.4001.laugh.desc:0 "พวกเขากล่าวว่า [sex_partner.GetSheHe] หัวเราะเยาะใส่หน้า [adultery_spouse.GetHerHis] เมื่อ [adultery_spouse.GetSheHe] เชิญ [sex_partner.GetHerHim] เข้าสู่เตียงนอนของ [adultery_spouse.GetHerHis]!"
 adultery.4001.threw.desc:0 "พวกเขากล่าวว่า [adultery_spouse.GetSheHe] โถม [adultery_spouse.GetHerselfHimself] เข้าใส่ [sex_partner.GetHerHim] ทันทีที่พวกเขาอยู่ตามลำพัง แต่ [sex_partner.GetFirstNameNoTooltip] ทนความคิดนั้นไม่ได้!"
 adultery.4001.sex_partner.desc:0 "ได้สมสู่กับ [sex_partner.Custom2('MyCharacterIntroductionNoComma', ROOT.Char)]?!"
 adultery.4001.commoner.desc:0 "ได้สมสู่กับสามัญชนชั้นต่ำ?!"
