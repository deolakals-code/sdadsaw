l_english: 
 lover.0001.t:0 "อวสานแห่งแรงปรารถนา"
 lover.0001.desc_opening:1 ""ยอดรักของข้า [ROOT.Char.Custom('LoverPetName')] เรื่องนี้... เรื่องนี้มันไปต่อไม่ได้แล้ว!"\n\nคนรักของข้า [lover.GetTitledFirstName] ผละออกจากข้า,"
 lover.0001.desc_murder:0 ""ประกายไฟที่ริบหรี่ระหว่างเรา... และคิดไม่ถึงว่าเจ้าจะลงมือฆ่า... มันมากเกินไปแล้ว!""
 lover.0001.desc:0 ""ประกายไฟระหว่างเรา มัน– มันเหมือนกับว่าดับไปแล้ว""
 lover.0001.a:1 "ข้าเห็นด้วย ถึงเวลาที่เราต้องแยกทางกันแล้ว"
 lover.0001.b:1 "แต่... จำช่วงเวลาดีๆ ทั้งหมดได้หรือไม่!"
 lover.0001.b.tt:0 "[lover.GetSheHe|U] จะให้โอกาสความสัมพันธ์ของเราอีกครั้ง"

 lover.0002.t:0 "อวสานแห่งแรงปรารถนา"
 lover.0002.still_in_love:0 "ถ้อยคำของ [first_lover.GetHerHis|U] ยังคงดังก้องอยู่ในหูของข้า ด้วยน้ำเสียงเศร้าสร้อยที่ [first_lover.GetTitledFirstName] พูดกับข้า ข้าอดไม่ได้ที่จะรู้สึกราวกับว่า [first_lover.GetSheHe] กำลังพยายามทำร้ายข้า\n\n"ข้า... แต่ข้ารักเจ้านะ!" ข้าเค้นเสียงออกจากลำคอที่แห้งผาก คำวิงวอนของข้าไม่อาจเปลี่ยนใจ [first_lover.GetHerHis] ได้"
 lover.0002.still_likes:0 "ถ้อยคำของ [first_lover.GetTitledFirstNamePossessive] ช่างเจ็บปวด แต่ข้าพยายามกล้ำกลืนความเจ็บปวดนั้นไว้\n\nหากนี่คือสิ่งที่ [first_lover.GetSheHe] คิดว่าดีที่สุดสำหรับเรา ข้าจะไม่ ทำให้ [first_lover.GetHerHim] ต้องลำบากใจที่จะจากไป"
 lover.0002.neutral:0 ""ทุกสิ่งย่อมมีวันสิ้นสุด" [first_lover.GetTitledFirstName] บอกข้า มัน ทำให้ข้าเศร้าใจเมื่อนึกถึงทุกสิ่งที่เราเคยมีร่วมกัน และทุกสิ่งที่เราสูญเสียไปในตอนนี้ แต่ท้ายที่สุดแล้ว นี่ดูเหมือนจะเป็นสิ่งที่ดีที่สุด"
 lover.0002.dislike:0 "[first_lover.GetTitledFirstName] เข้ามาหาข้าอย่างไม่แน่ใจนัก เมื่อข้ารู้ว่า [first_lover.GetSheHe] มาเพื่อบอกข้าว่าเราจะไม่พบกันอีกต่อไป ข้าก็ไม่ได้เสียใจ มีเพียงความโล่งใจเท่านั้น"
 lover.0002.hate:0 "[first_lover.GetTitledFirstName] เข้ามาหาข้า แจ้งว่ามีเรื่องสำคัญจะหารือ แต่ก่อนที่ [first_lover.GetSheHe] จะเอ่ยปาก ข้าก็สาดคำต่อว่าไปเสียยกใหญ่ว่า [first_lover.GetSheHe] ทำให้ข้าผิดหวังอีกครั้งได้อย่างไร\n\nข้าเกือบจะดีใจเมื่อ [first_lover.GetSheHe] บอกว่า [first_lover.GetSheHe] ไม่ต้องการพบข้าอีกต่อไป"
 lover.0002.like.vengeful:0 "ขณะที่ข้อแก้ตัวอันอ่อนเปลี้ยผ่านริมฝีปากของ [first_lover.GetTitledFirstNamePossessive] ความเกลียดชังก็เริ่มคุกรุ่นในท้องของข้า แต่ละคำพูดเป็นเชื้อไฟ งั้นรึ ข้าไม่ดีพอสำหรับ [first_lover.GetHerHim] อีกต่อไปแล้วใช่ไหม? [first_lover.GetSheHe|U] จะต้องเสียใจกับเรื่องนี้ จำคำข้าไว้..."
 lover.0002.dislike.vengeful:0 "ขณะที่ข้อแก้ตัวอันน่าสมเพชผ่านริมฝีปากของ [first_lover.GetTitledFirstNamePossessive] ความดูถูกอันเย็นเยียบก็แผ่ซ่านจากท้องของข้า ทำลายความรู้สึกอ่อนโยนใดๆ ที่ข้าเคยมีต่อ [first_lover.GetHerHim] จนหมดสิ้น [first_lover.GetSheHe|U] จะต้องเสียใจที่ปฏิเสธข้า เช่นนี้ จำคำข้าไว้..."
 lover.0002.like.humble:0 "แม้ว่าความเจ็บปวดจากคำพูดของ [first_lover.GetTitledFirstNamePossessive] นั้นแทบจะทนรับไม่ไหว ข้าก็ไม่อาจปฏิเสธความจริงในคำพูดนั้นได้ ข้าไม่เคยดีพอสำหรับ [first_lover.GetHerHim] เลย ข้าหวังว่า [first_lover.GetSheHe|U] จะมีความสุขมากขึ้นหากไม่มีข้า..."
 lover.0002.like.arrogant:0 "[first_lover.GetTitledFirstName]... ไม่ต้องการข้าอีกต่อไปแล้ว? สิ่งที่ [first_lover.GetSheHe] พูดนั้นไร้เหตุผลสิ้นดี ข้าคิดว่า [first_lover.GetSheHe] คงไม่สบาย หรือบางทีอาจถูกบังคับให้พูดคำประหลาดเหล่านั้นออกมา ข้า... ข้าสมบูรณ์แบบสำหรับ [first_lover.GetHerHim]!"
 lover.0002.dislike.arrogant:0 "ข้าแทบจะกลั้นหัวเราะไว้ไม่อยู่ ถ้อยคำของ [first_lover.GetTitledFirstNamePossessive] ช่างไร้สาระเสียจริง แน่นอนว่า [first_lover.GetSheHe] ยังต้องการข้า ข้าคือทุกสิ่งที่ [first_lover.GetSheHe] เคยปรารถนา! อย่างไรก็ตาม ข้าไม่ได้โต้เถียง – ความสูญเสียเป็นของ [first_lover.GetHerHis] ข้าไม่ใส่ใจแม้ แต่น้อย"
 lover.0002.like.lustful:0 "ข้าคิดถึงสัมผัสจากมืออันกระตือรือร้นของ [first_lover.GetTitledFirstNamePossessive] ดังนั้นการมาถึงโดยไม่บอกกล่าวของ [first_lover.GetHerHis] จึงเป็นเรื่องน่าประหลาดใจอย่างยิ่ง ข้าแทบรอไม่ไหวที่จะหลงใหลในอ้อมกอดของ [first_lover.GetHerHis] แต่เมื่อข้าพยายามดึง [first_lover.GetHerHim] เข้ามาใกล้ [first_lover.GetSheHe] กลับขัดขืน\n\nข้าแทบจำคำพูดที่ตามมาไม่ได้ แต่ความเจ็บปวดร้าวลึกที่ [first_lover.GetSheHe] ทิ้งไว้ยังไม่จางหายไปแม้ แต่น้อย"
 lover.0002.dislike.lustful:0 "น่าประหลาดใจที่เมื่อ [first_lover.GetTitledFirstName] บอกข้าว่าเราเลิกกันแล้ว ความรู้สึกแรกของข้าคือความโล่งใจ ในที่สุดข้าก็ยอมรับได้ว่า [first_lover.GetSheHe] ไม่สามารถเติมเต็มความปรารถนาของข้าได้อีกต่อไป"
 lover.0002.like.understanding:0 "แม้ว่า [first_lover.GetTitledFirstNamePossessive] จะพยายามหาคำพูด ข้าก็รู้จัก [first_lover.GetHerHim] ดีพอที่จะบอกได้ว่ามันคงเป็นเรื่องร้าย ข้าข่มความเศร้าโศก ไม่ต้องการ ทำให้เรื่องนี้ยากขึ้นสำหรับ [first_lover.GetHerHim] และบีบมือ [first_lover.GetHerHis] เบาๆ จากนั้นคำพูดก็หลั่งไหลออกมาจาก [first_lover.GetHerHim] ราวกับน้ำตก และความกลัวที่ลึกที่สุดของข้าก็ได้รับการยืนยัน"
 lover.0002.dislike.understanding:0 "ไม่ว่า [first_lover.GetTitledFirstName] จะมาบอกอะไรข้า เห็นได้ชัดว่ามัน ทำให้ [first_lover.GetHerHim] ทุกข์ใจ แม้ว่าความรู้สึกของข้าที่มีต่อ [first_lover.GetHerHim] จะจางหายไปแล้ว แต่ก็ยังเจ็บปวดที่เห็น [first_lover.GetHerHim] อยู่ในสภาพ เช่นนั้น\n\nเมื่อข้าปลอบโยน [first_lover.GetHerHim] ว่าทุกอย่างจะเรียบร้อยดี [first_lover.GetSheHe] ก็บอกข้าในที่สุดว่าเราเลิกกันแล้ว"
 lover.0002.like.angry:0 "หลังจากเฝ้าดู [first_lover.GetTitledFirstName] กระสับกระส่ายและเหงื่อตกอยู่เกือบชั่วโมง คำสารภาพของ [first_lover.GetHerHis] ก็ไม่น่าแปลกใจนัก อย่างไรก็ตาม ข้าไม่ได้คาดหวังปฏิกิริยาของตัวเอง ถ้อยคำหยาบคายหลั่งไหลออกมาจากปากข้าราวกับลาวา ข้าหยุดมันไม่ได้ และก็ไม่ต้องการหยุด ข้าต้องเห็นความเจ็บปวดของตัวเองสะท้อนอยู่บนใบหน้าของ [first_lover.GetFirstNamePossessive]\n\nความโกรธเกรี้ยวปกป้องข้าไว้ จนกระทั่ง [first_lover.GetFirstName] เดินกระทืบเท้าออกจาก [ROOT.Char.Custom('GetRoom')] จากนั้นข้าก็เหลือเพียงความจริงอันแสนทรมานของการถูกปฏิเสธ"
 lover.0002.dislike.angry:0 "หลังจากเฝ้าดู [first_lover.GetTitledFirstName] กระสับกระส่ายและเหงื่อตกอยู่เกือบชั่วโมง ข้าก็ไม่อาจระงับความโกรธไว้ได้อีกต่อไป ทุกถ้อยคำอาฆาตแค้นที่ข้าเคยอยากพูดกับ [first_lover.GetWomanMan] ที่น่ารังเกียจนั้นหลั่งไหลออกมาจากปากข้าราวกับลาวา\n\nความเจ็บปวดในดวงตาของ [first_lover.GetHerHis] ทำให้ข้าแข็งแกร่งขึ้น และเมื่อ [first_lover.GetSheHe] เค้นเสียงออกมาในที่สุดว่าเราเลิกกันแล้ว ชัยชนะของข้าก็สมบูรณ์"
 lover.0002.like.paranoid:0 "เมื่อ [first_lover.GetTitledFirstName] บอกข้าว่า [first_lover.GetSheHe] ไม่ต้องการข้าอีกต่อไป มันก็ไม่น่าแปลกใจเลย ข้าเห็นมันในดวงตาของ [first_lover.GetHerHis] มานานแล้ว รู้สึกได้ถึงความลังเลในสัมผัสของ [first_lover.GetHerHis] ทุกครั้งที่ข้าถาม [first_lover.GetSheHe] ก็ปฏิเสธ แต่ดูเหมือนว่า [first_lover.GetSheHe] ไม่สามารถซ่อนมันได้อีกต่อไป หรือบางที [first_lover.GetSheHe] แค่สนุกกับการเฝ้าดูข้าทนทุกข์ทรมาน..."
 lover.0002.dislike.paranoid:0 "เมื่อ [first_lover.GetTitledFirstName] บอกข้าว่า [first_lover.GetSheHe] ไม่ต้องการข้าอีกต่อไป มันก็ไม่น่าแปลกใจเลย ข้ารู้ว่ามันจะต้องเกิดขึ้นมานานแล้ว แม้ว่า [first_lover.GetSheHe] จะปฏิเสธอยู่ตลอด บางที [first_lover.GetSheHe] อาจยืดเยื้อเรื่องทั้งหมดเพื่อลงโทษข้า... ใช่ ข้ามั่นใจว่า [first_lover.GetWomanMan] ที่ชั่วร้ายนั่นสนุกกับความทุกข์ทรมานของข้า!"
 lover.0002.a:0 "แต่เหตุใดเล่า ยอดรักของข้า..."
 lover.0002.b:0 "ไม่ ข้าต้องทำอะไรสักอย่าง!"
 lover.0002.c:0 "นี่อาจเป็นสิ่งที่ดีที่สุดแล้ว"
 lover.0002.d:0 "ในที่สุด! สรรเสริญ [ROOT.GetCharacter.GetFaith.FertilityGodName]!"
 lover.0002.e:0 "ข้าจะไม่มีวันให้อภัยการทรยศของ [first_lover.GetHerHis]"

 lover.0003.t:0 "มากเกินพอดี"
 lover.0003.desc.intro:0 "ข้าไม่เคยคิดเลยว่า [ROOT.Char.GetWomanMan] คนหนึ่งจะมี [ROOT.Char.Custom('lover_reason')] มากเกินไปได้ แต่ดูเหมือนชีวิตได้พิสูจน์ให้ข้าเห็นแล้วว่าข้าคิดผิด บางวัน ข้ารู้สึกราวกับว่าเวลาว่างของข้าไม่มีอะไรนอกจาก "
 lover.0003.desc.twolovers:0 "[lover_1.Custom('lover_activity')] และ [lover_2.Custom('lover_activity')] "
 lover.0003.desc.threelovers:0 "[lover_1.Custom('lover_activity')], [lover_2.Custom('lover_activity')] และ [lover_3.Custom('lover_activity')] "
 lover.0003.desc.end1:0 "\n\nข้าจะดำเนินต่อไป เช่นนี้ได้นานแค่ไหน? เหล่า "
 lover.0003.desc.end2men:0 "บุรุษ"
 lover.0003.desc.end2women:0 "สตรี"
 lover.0003.desc.end2people:0 "ผู้คน"
 lover.0003.desc.end3:0 "เหล่านี้จะ ทำให้ข้าถึงจุดจบ!"
 lover_0003.a:0 "ข้าต้องปล่อย [lover_1.GetFirstNameNoTooltip] ไป"
 lover_0003.b:0 "[lover_2.GetFirstNameNoTooltip] และข้าได้มาถึงจุดสิ้นสุดของเส้นทางเราแล้ว"
 lover_0003.c:0 "ข้าไม่อาจดำเนินต่อไป เช่นนี้กับ [lover_3.GetFirstNameNoTooltip] ได้"
 lover_0003.d:0 "ความรักไม่ใช่เรื่องของปริมาณ แต่เป็นเรื่องของคุณภาพ!"
 lover_0003.d.tt:0 "ท่านใช้ทักษะด้านความรักเพื่อ ทำให้คนรักของท่านพึงพอใจโดยไม่ ทำให้ตัวเองเหนื่อยเกินไป"
 lover_0003.e:0 "มันอาจ ทำให้ข้าแตกสลาย แต่ชีวิตจะมีความหมายอะไรหากปราศจาก [ROOT.Char.Custom('lover_reason')]?"
 lover_0003.e.tt:0 "ท่านพยายามอย่างหนักเพื่อรักษาความสัมพันธ์ให้คงอยู่"

 lover.0004.t:0 "ความเจ็บปวดจากการถูกปฏิเสธ"
 lover.0004.desc:0 "[first_lover.GetFirstName] และข้าเคยมีเรื่องขัดแย้งกัน ข้าไม่อาจปฏิเสธได้ แต่การปฏิเสธของ [first_lover.GetHerHis] ก็ ทำให้ข้าตกใจ แม้ข้าจะอธิบายไม่ได้ว่าทำไม ข้าไม่เคยคิดว่าเราจะจบลง เช่นนี้\n\nความโกรธ ความขุ่นเคือง ความเสียใจ... ความเฉยเมย อารมณ์เหล่านี้ถาโถมเข้ามาและ ทำให้ข้าตกตะลึง ไม่แน่ใจว่าจะทำหรือรู้สึกอย่างไร"
 lover_0004.a:0 "ข้าจะมีชีวิตต่อไปได้อย่างไรหากปราศจาก [first_lover.GetHerHis] [ROOT.Char.Custom('lover_reason')]?"
 attempt_to_regain_affection_tt:0 "ข้าต้องใช้มาตรการขั้นเด็ดขาดเพื่อเรียกความรักของ [first_lover.GetHerHis] กลับคืนมา!"

 lover.0005.t:0 "นรกยังมิอาจเทียบเท่าความโกรธา"
 lover.0005.desc:0 "หากข้าอ้างว่าคิดว่า [lover.GetFirstName] จะยอมรับการตัดสินใจของข้าได้ดี ข้าคงกำลังโกหก แต่ปฏิกิริยาของ [lover.GetHerHis] ทำให้ข้าประหลาดใจ ไม่มีน้ำตา ไม่มีการอ้อนวอน ไม่มีการด่าทอ มีเพียงดวงตาของ [lover.GetTitledFirstNamePossessive] เท่านั้นที่ทรยศความรู้สึกที่แท้จริงของ [lover.GetHerHis] และสิ่งที่ข้าเห็น ทำให้ข้าหนาวเยือกไปถึงกระดูก"
 lover_0005.a:0 "ข้าเกรงว่าวันนี้ข้าได้สร้างศัตรูขึ้นแล้ว"

 lover.0101.t:0 "ถูกจับกุมโดย [lover.GetHerHim|U]"
 lover.0101.desc_dungeon:0 "ข้ามองแทบไม่เห็นลูกกรง เพราะม่านน้ำตาบดบัง เหตุใด [ROOT.Char.Custom2('RelationToMe',SCOPE.sC('lover'))] ของข้าจึงทำ เช่นนี้กับข้าได้? [lover.GetTitledFirstName] ยอดรักของข้า [lover.Custom('LoverPetName')] ได้โปรดปล่อยข้าออกไป..."
 lover.0101.desc_house_arrest:0 "แม้ว่าข้าจะเดินอยู่ในโถงเดียวกับ [ROOT.Char.Custom2('RelationToMe',SCOPE.sC('lover'))] ของข้า [lover.GetTitledFirstName] หัวใจของเรากลับไม่เคยห่างไกลกันเท่านี้มาก่อน ยอดรักของข้า [lover.Custom('LoverPetName')] ได้โปรด ปล่อยข้าออกไป..."
 lover.0101.a:0 "[lover.GetWomanMan] ที่ข้ารักไม่มีทางทำ เช่นนี้กับข้า!"
 lover.0101.b:0 "นี่เป็นเพียงอุปสรรคอีกอย่างหนึ่งที่เราต้องเอาชนะ"

 lover.0102.t:0 "นักโทษ"
 lover.0102.desc:0 "ใครจะคาดคิดว่าเรื่องจะมาถึงจุดนี้? [ROOT.Char.Custom2('RelationToMe',SCOPE.sC('imprisoned_lover'))] ของข้า [imprisoned_lover.GetTitledFirstName] หลีกเลี่ยงแม้กระทั่งการปรากฏตัวของข้า และ แม้ว่า [imprisoned_lover.GetSheHe] จะยังอยู่ในกำมือข้า ความรักที่ [imprisoned_lover.GetHerHis] มีต่อข้าก็หมดสิ้นไปแล้ว"
 lover.0102.a:0 "ความรักที่ [imprisoned_lover.GetSheHe] เคยมีได้หลบหนีไป ในขณะที่ [imprisoned_lover.GetSheHe] ทำไม่ได้!"

 lover.0103.t:0 "ความรู้สึกที่ขัดแย้ง"
 lover.0103.desc:0 "การที่ [ROOT.Char.Custom2('DescriptorNegative', SCOPE.sC('lover'))] [ROOT.Char.Custom2('RelationToMe',SCOPE.sC('lover'))] ของข้า [lover.GetTitledFirstName] จะประกาศสงครามกับข้า... ไม่ว่าเราเคยมีอะไรร่วมกัน — ไม่ว่าความรู้สึกใดที่ข้าเคยมีต่อ [lover.GetHerHim] – กำลังค่อยๆ ถูกกลบด้วยเสียงแตรศึก"
 lover.0103.a:0 "ไม่มีสิ่งใดจะขวางทางข้าได้ แม้ แต่เจ้า ยอดรักของข้า!"
 lover.0103.b:0 "เมื่ออยู่ในสงคราม ชีวิตมีค่าที่สุด และความรักก็หอมหวานยิ่งขึ้น"
 lover.0103.b.tt:0 "#F ข้าจะไม่ตัดสินใจอย่างหุนหันพลันแล่นท่ามกลางความร้อนแรงของการต่อสู้!#!"

 lover.0104.desc:0 "นับตั้งแต่เลือกการพิชิต [war_title.GetName] แทนคนรักของข้า [war_lover.GetTitledFirstName] [war_lover.GetSheHe] ก็ปฏิเสธที่จะมองหน้าข้า และข้าเกรงว่าสิ่งที่เราเคยมีจะสูญสิ้นไปตลอดกาล"
 lover.0104.a:0 "ทุกอย่างยุติธรรมในความรักและสงคราม"

 lover.0201.t:0 "จุดจบของความสัมพันธ์ฉันชู้สาว"
 lover.0201.desc:0 ""ข้าดีใจเหลือเกินที่เจ้าเข้าใจว่าทำไมมันต้องเป็น เช่นนี้" คนรักของข้าบอกข้า\n\nโอ้ [breaker.GetFirstName] ข้าหวังว่าข้าจะเข้าใจ! ทีแรกเจ้ากระซิบถ้อยคำหวานหู แต่ตอนนี้เจ้ากลับเดินจากไป?"
 lover.0201.other_lover:0 "\n\nเป็น เพราะเจ้า[other_lover.Custom2('InsultNounSexual', ROOT.Char)] นั่นใช่หรือไม่?!"
 lover.0201.a:0 "นี่ไม่ใช่สิ่งที่ควรจะเป็น"

 lover.0202.t:0 "[breaker.Custom('WifeHusband')] ของข้าเอง"
 lover.0202.desc:0 "ข้า... สับสน [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('breaker'))] ของข้า [breaker.GetFirstName] กล่าวว่า [breaker.GetSheHe] ไม่ปรารถนาที่จะเป็นคนรักของข้าอีกต่อไป แรงปรารถนาของเราไม่เพียงพอที่จะ ทำให้เปลวไฟของการสมรสนี้ลุกโชนต่อไปหรือ?"
 lover.0202.a:0 "[breaker.GetSheHe] คิดว่า [breaker.GetSheHe] กำลังทำอะไรอยู่?"

 lover.0203.t:0 "ความโล่งใจ"
 lover.0203.desc:0 ""ไม่ใช่เจ้าหรอก เป็นข้าเอง..." ข้าไม่ได้ตั้งใจฟังจริงๆ ขณะที่ [breaker.GetFirstName] กำลังพูด ไม่ต้องสงสัยเลยว่า [breaker.GetSheHe] มาที่นี่เพื่อยุติความสัมพันธ์ชั่วครั้งชั่วคราวของเรา แต่ทั้งหมดที่ข้ารู้สึกคือคลื่นแห่งความโล่งใจที่ถาโถมเข้ามา"
 lover.0203.a:0 "ใช่ ใช่ นี่เป็นเรื่องน่าเสียดายอย่างยิ่ง ไปได้แล้วตอนนี้"

 lover.0204.t:0 "[lover.Custom('WomanManGirlBoy')] ที่ถูกหยาม"
 lover.0204.desc:0 ""เจ้ากล้าดียังไง! กล้าดียังไงมาเลิกกับข้า, และยังไปหาเจ้า[other_lover.Custom2('InsultNounSexual', SCOPE.sC('lover'))] นั่นอีก!"\n\nข่าวลือแพร่สะพัดไปอย่างรวดเร็ว, และปฏิกิริยาอันเกินจริงของ [lover.GetFirstName] ก็ถูกนำมาแสดงซ้ำต่อหน้าข้า เห็นได้ชัดว่า[lover.GetSheHe] โกรธเคืองข้า และอาจหาทางแก้แค้นไม่ว่าจะมีเหตุผลสมควรหรือไม่ก็ตาม"
 lover.0204.a:0 "[breaker.GetFirstNameNoTooltip] เลือกข้า ทำใจเสียเถอะ"

 # Ask lover to be exclusive (lover -> soulmate)
 lover.3111.t:0 "หนึ่งเดียวของข้า"
 lover.3111.desc:1 "[ROOT.Char.Custom2('RelationToMe',SCOPE.sC('lover'))] ของข้า [lover.GetTitledFirstName] กอดข้าไว้ในอ้อมแขน [lover.GetHerHis] และข้ารู้สึกถึงความสุขที่ไม่ค่อยได้สัมผัส ลองจินตนาการดูสิว่าหากสิ่งนี้สามารถคงอยู่ตลอดไป — หาก [lover.GetSheHe] สามารถเป็นของข้าตลอดไป และเป็นของข้าเพียงผู้เดียว..."
 lover.3111.a:1 "ให้เราสัญญาว่าจะไม่รักใครอื่นอีก!"
 lover.3111.a.success:0 "[lover.GetShortUIName|U] ตกลงที่จะเป็นคู่รักเพียงหนึ่งเดียว"
 lover.3111.a.failure:0 "ข้อเสนอของข้า ทำให้ [lover.GetShortUIName] รู้สึกอึดอัด"
 lover.3111.a.tt:0 "#F ข้าจะเสนอให้เราสาบานว่าจะอุทิศตนให้แก่กันและกันเท่านั้น#!"
 lover.3111.b:0 "การมี [lover.GetHerHim] เช่นนี้คือทั้งหมดที่ข้าต้องการ มาเป็นของข้าอีกครั้ง!"
 lover_0300_break_up_with_other_lovers_effect.tt:0 "คนรักคนอื่นๆ ทั้งหมดของท่าน"

 # Send a love letter
 lover.3002.t:0 "บอกด้วยถ้อยคำ"
 lover.3002.desc:0 "ความรู้สึกของข้าที่มีต่อ [lover.GetFirstName] แทบจะระเบิดออกมาจากอก! ข้าต้องการอย่างยิ่งที่จะให้ [lover.GetHerHim] รู้ว่าข้ารู้สึกอย่างไร!\n\nความรักเอ๋ย จงนำทางมือข้าขณะที่ข้าจรดหมึกลงบนกระดาษ!"
 lover.3002.a:0 "ความจริงเพียงหนึ่งเดียวคือบทกวี!"
 lover.3002.b:0 "นี่มันยากกว่าที่ข้าคิดไว้มาก..."
 lover.3002.a_beautiful:0 "สาส์นรักอันงดงาม"
 lover.3002.a_good:0 "สาส์นรักที่ดี"
 lover.3002.a_competent:0 "สาส์นรักที่ใช้ได้"
 lover.3002.a_bad:0 "สาส์นรักที่แย่"
 
 # Terrible love letter
 lover.3003.desc:0 "ข้าได้รับสาส์นจาก [first_lover.GetTitledFirstName]!\n\n[first_lover.Custom2('love_letter', ROOT.Char )]"
 lover.3003.desc_conclusion:0 "\n\nนี่มัน... อะไรกัน?"
 lover.3003.a:0 "นั่นอาจเป็นบทกวีที่แย่ที่สุดที่ข้าเคยได้ยินมา!"

 lover.3004.desc:1 "ดูเหมือนว่าสาส์นของข้าจะไม่ได้รับการตอบรับที่ดีนัก ให้ข้าดูอีกครั้งสิ...\n\n[first_lover.Custom2('love_letter', SCOPE.sC('lover'))]"
 lover.3004.a:0 "มันแย่ขนาดนั้นเชียวหรือ?"

 lover.3005.desc_conclusion:0 "\n\nนั่น... ก็ดีนะ"
 lover.3005.a:0 "อย่างน้อย [first_lover.GetSheHe] ก็คิดถึงข้า"

 lover.3006.desc:1 "ดูเหมือนว่าสาส์นของข้าจะได้รับการตอบรับที่ดี แม้ว่าจะถูกบรรยายว่าเป็น "ความพยายาม แต่งบทกวีอย่างเรียบง่าย" ก็ตาม:\n\n[first_lover.Custom2('love_letter', SCOPE.sC('lover'))]"
 lover.3006.a:0 "เอาเถอะ ความตั้งใจต่างหากที่สำคัญ!"

 lover.3007.desc_conclusion:0 "\n\nบทกวี เพียงเพื่อข้า!"
 lover.3007.a:0 "โอ้ ช่างน่าประทับใจ!"

 lover.3008.desc:1 "สาส์นของข้าได้รับการตอบรับที่ดี! [lover.GetTitledFirstName] ดูเหมือนจะท่องมันให้หลายคนฟัง\n\n[first_lover.Custom2('love_letter', SCOPE.sC('lover'))]"
 lover.3008.a:0 "ลิ้นเงินลิ้นทองของข้าทำงานได้ผล!"

 lover.3009.desc_conclusion:0 "\n\nมันงดงามอย่างแท้จริง และเขียนขึ้นเพื่อข้าโดยเฉพาะ!"
 lover.3009.a:0 "ข้าจะเก็บถ้อยคำเหล่านี้ไว้ในใจ!"

 lover.3010.desc:1 "[lover.GetTitledFirstName] ตอบสาส์นของข้า กล่าวว่าเป็นหนึ่งในสิ่งที่งดงามที่สุดที่ [lover.GetSheHe] เคยได้ยินมา! เมื่อมองย้อนกลับไป ข้าก็ไม่แปลกใจเลย:\n\n[first_lover.Custom2('love_letter', SCOPE.sC('lover'))]"
 lover.3010.a:0 "บางทีข้าควรจะเป็นกวี แทนที่จะเป็น [ROOT.Char.GetTitleAsNameNoTooltip]!"

 lover.3112.desc:0 ""ข้าจะไม่มีวันปรารถนาใครอื่นนอกจากเจ้า ยอดรักของข้า [ROOT.Char.Custom('LoverPetName')]"\n\n[proposing_lover.GetTitledFirstName] กอดข้าไว้ใกล้ ลมหายใจ [proposing_lover.GetHerHis] รดต้นคอข้า ขณะที่ [proposing_lover.GetSheHe] ขอคำสัญญา: ว่าจะไม่มีวันมีคนรักอื่นนอกจาก [proposing_lover.GetHerHim]"
 lover.3112.a:0 "ข้าไม่ต้องการใครอื่นนอกจากเจ้า!"
 lover.3112.b:1 "แน่นอน ข้าจะ #EMP ไม่มีทาง#! มีคนอื่นเด็ดขาด"
 lover.3112.b.tt:0 "#F คำโกหกที่ขับเคลื่อนด้วยความรักจะนำพาอันตรายใดมาได้เล่า?#!"
 lover.3112.c:0 "เจ้าคงไม่ได้พูดจริงจังกระมัง?!"
 lover.3112.b.remain_together.tt:0 "[THIS.Char.GetShortUIName] ยังคงเป็น [lover|E] ของท่าน"

 lover.3113.desc:0 ""ใช่ แน่นอน ข้าต้องการเป็นของเจ้าเพียงผู้เดียว ยอดรักของข้า [ROOT.Char.Custom('LoverPetName')]!"\n\nหัวใจข้าพองโตเมื่อความรักและความปรารถนาไหลเวียนไปทั่วร่าง ข้าดึง [lover.GetTitledFirstName] เข้ามาใกล้และจูบ [lover.GetHerHim] อย่างลึกซึ้ง"
 lover.3113.a:0 "ไม่มีใครสำคัญนอกจากเจ้า!"
 lover.3113.a.tt:0 "#F ข้าจะไม่มีวันรักใครอื่นเหมือนที่รัก [lover.GetFirstNameNoTooltip]!#!"

 lover.3114.desc:0 ""ข้ารักใคร่เจ้า [ROOT.Char.GetFirstNameNoTooltip] แต่ข้ายังไม่พร้อมที่จะสาบานตนต่อเจ้า"\n\n[lover.GetTitledFirstName] [lover.Custom('quirk_neg_present')] ขณะที่เราตกอยู่ในความเงียบงันอันน่าอึดอัด"
 lover.3114.a:0 "ข้าอ่านใจ [lover.GetHerHim] ผิดไปได้อย่างไร?"


 lover.0304.opening:1 "[ROOT.Char.GetFirstNameNoTooltip] ที่รักของข้า,"
 lover.0304.desc:0 "ข้าไม่เคยคาดคิดว่ามันจะจบลง เช่นนี้ แต่เราก็มาถึงจุดนี้แล้ว ข้าขอโทษ แต่ข้ารักคนอื่น เราไม่อาจอยู่ด้วยกันได้อีกต่อไป\n\nข้าขอให้เจ้ามีความสุขที่สุดในโลก ขอ [ROOT.Char.GetFaith.HighGodName] คุ้มครองเจ้า"
 lover.0304.a:0 "นี่คือจุดจบแล้วสินะ?"


 lover.1001.t:0 "ข่าวลือและการคาดเดา"
 lover.1001.desc:0 "[ROOT.GetCharacter.Custom2('RelationToMe' , SCOPE.sC('snoopy_lover') )] ของข้า [snoopy_lover.GetTitledFirstName] ได้ยินเรื่องราวมากมายระหว่างการไปมาของ [snoopy_lover.GetHerHis] ที่ [ROOT.Char.Custom('GetCourt')] ของข้า\n\nเมื่อเร็ว ๆ นี้ [snoopy_lover.GetSheHe] ได้ยินเรื่องราวที่น่าสนใจมากเกี่ยวกับสิ่งที่ [ROOT.GetCharacter.Custom2('RelationToMe' , SCOPE.sC('secret_holder') )] ของข้า [secret_holder.GetTitledFirstName] ทำในเงามืด..."
 lover.1001.a:0 "นี่เป็นประโยชน์อย่างยิ่งที่ได้รู้ ยอดรักของข้า [ROOT.GetCharacter.Custom('LoverPetName')]"

 lover.1002.t:0 "ชักใยเบื้องหลัง"
 lover.1002.desc:0 "[ROOT.GetCharacter.Custom('LoverPetName_possessive')|U] [lover.GetTitledFirstName] รู้เรื่องมากมายเกี่ยวกับการจัดการความสัมพันธ์ต่างๆ ใน [ROOT.Char.Custom('GetCourt')] ของข้า [lover.GetSheHe|U] เสนอว่า [lover.GetSheHe] สามารถนำความเชี่ยวชาญ [lover.GetHerHis] มาใช้ประโยชน์ในการทูตของข้าต่อ [target.GetTitledFirstName] ได้"
 lover.1002.a:0 "เป็นความคิดที่ยอดเยี่ยม!"
 lover.1002.b:0 "ข้าไม่อาจให้ [lover.GetFirstNameNoTooltip] เข้ามาเกี่ยวข้องกับเรื่องนี้ได้"

 lover.1003.t:0 "การปลอบโยนจากคนรัก"
 lover.1003.desc:0 "ภาระของการเป็น [ROOT.Char.GetTitleAsNameNoTooltip] ได้ถ่วงข้าอย่างหนักเมื่อเร็วๆ นี้ และมีเพียงอ้อมกอดอันอบอุ่นของ [ROOT.Char.Custom2('RelationToMe' , SCOPE.sC('lover') )] ของข้า [lover.GetTitledFirstName] เท่านั้นที่ดูเหมือนจะช่วยแบ่งเบาภาระได้\n\n"ได้โปรด ยอดรักของข้า [ROOT.Char.Custom('LoverPetName')] ให้ข้าช่วยท่านผ่อนคลายเถิด""
 lover.1003.a:0 "เราจะทำอย่างไรหากไม่มีกันและกัน ยอดรักของข้า?"
 lover.1003.b:0 "นี่แหละที่ข้าต้องการ!"

 lover.1004.t:0 "ไปจากที่นี่กันเถอะ"
 lover.1004.desc:0 "[ROOT.Char.Custom2('RelationToMe' , SCOPE.sC('lover') )] ของข้า [lover.GetTitledFirstName] ยิ้ม [lover.Custom('quirk_pos_adverb')] ขณะที่ [lover.GetSheHe] กอดข้า และข้าก็นึกขึ้นได้อีกครั้งว่าทำไมข้าถึงรัก [lover.GetHerHim] มาก เช่นนี้\n\nคงจะดีเพียงใดหากได้หนีไปด้วยกันสักพัก เพียงแค่เราสองคน..."
 lover.1004.a:0 "ข้าได้ยินมาว่า [county.GetNameNoTierNoTooltip] น่าอยู่มากในช่วงเวลานี้ของปี"
 lover.1004.a.tt:0 "#F การเดินทางสุดโรแมนติก... ใครจะรู้ว่าอะไรอาจเกิดขึ้น?#!"
 lover.1004.b:0 "ห้องนอนก็เป็นจุดหมายปลายทางที่น่าตื่นเต้นพอแล้ว!"

 lover.1005.desc_opening_same_court:0 ""โอ้ [ROOT.Char.GetFirstNameNoTooltip]! การได้หลบหนีจากราชสำนัก แม้เพียงชั่วครู่... นี่เหมือนฝันเลย"\n\n"
 lover.1005.desc_opening_other_court:0 ""โอ้ [ROOT.Char.GetFirstNameNoTooltip]! การได้พบกัน เช่นนี้ ห่างไกลจากราชสำนักของเราทั้งคู่... มันเหมือนฝันเลย"\n\n"
 lover.1005.desc_object_of_importance:0 "เมื่อเห็นรอยยิ้มระบายบนริมฝีปากของ [lover.GetTitledFirstNamePossessive] และความกระตือรือร้นในดวงตา [lover.GetHerHis] ข้าก็ยินดีเป็นอย่างยิ่งที่จะตกลงและหาที่พักในโรงเตี๊ยมแห่งหนึ่งใน [county.GetNameNoTier] – โรงเตี๊ยมที่ประดับประดาด้วย [ROOT.Char.Custom2('LoverSeductionObjectIndefinite', SCOPE.sC('lover'))]"
 lover.1005.desc:0 "เมื่อเห็นรอยยิ้มระบายบนริมฝีปากของ [lover.GetTitledFirstNamePossessive] และความกระตือรือร้นในดวงตา [lover.GetHerHis] ข้าก็ยินดีเป็นอย่างยิ่งที่จะตกลงและหาที่พักในโรงเตี๊ยมแห่งหนึ่งใน [county.GetNameNoTier]"
 lover.1005.a:0 "ห้องส่วนตัวที่สุดของท่านเป็นเวลาหนึ่งสัปดาห์!"
 lover.1005.a.tt:0 "#F การหายตัวไปของข้าอาจถูกสังเกตเห็นได้#!"
 lover.1005.b:0 "มาใช้เวลาค่ำคืนนี้ให้คุ้มค่าที่สุดกันเถอะ"
 lover.1005.c:0 "หืม โรงเตี๊ยมนี้ — ทั้งหมู่บ้านนี้ — น่าจะได้รับการปรับปรุงนะ..."

 lover.1006.opening:0 "[lover.Custom2('AppropriateGreeting', ROOT.Char)]"
 lover.1006.desc_opening:0 "ข้าขอวิงวอนให้ท่านมอบความสามารถของท่านแก่ข้า!"
 lover.1006.desc_chancellor:0 "ทักษะของท่านในด้านการทูตเป็นที่รู้จักอย่างกว้างขวาง"
 lover.1006.desc_steward:0 "ทักษะของท่านในด้านการบริหารเป็นที่รู้จักอย่างกว้างขวาง"
 lover.1006.desc_marshal:0 "ทักษะของท่านในด้านการทหารเป็นที่รู้จักอย่างกว้างขวาง"
 lover.1006.desc_spymaster:0 "ทักษะของท่านในด้าน #EMP ที่ละเอียดอ่อน#! เป็นที่รู้จักอย่างกว้างขวาง"
 lover.1006.desc_court_chaplain:0 "ทักษะของท่านในด้านเทววิทยาเป็นที่รู้จักอย่างกว้างขวาง"
 lover.1006.desc_kurultai: "ความเชี่ยวชาญของท่านในกิจการปศุสัตว์เป็นที่เลื่องลือไปทั่ว,"
 lover.1006.desc_end:1 "และข้าคิดว่าท่านจะเป็นผู้ที่เหมาะสมที่สุดสำหรับตำแหน่งในสภาของข้า"
 lover.1006.a:0 "แน่นอน ข้าจะช่วยท่าน [lover.GetFirstNameNoTooltip]!"
 lover.1006.b:0 "ข้าไม่มีเวลาที่จะรับใช้ในสภา"

 lover.1007.t:0 "ข้าหลวงและเจ้าเหนือหัว [ROOT.Char.GetHerHis|U]"
 lover.1007.desc:1 ""ยอดรักของข้า [ROOT.Char.Custom('LoverPetName')] ท่านสมควรได้รับดวงดาว" [ROOT.Char.Custom2('RelationToMe',SCOPE.sC('lover'))] ของข้า [lover.GetTitledFirstName] ลูบมือ [lover.GetHerHis] ลงบนหลังข้าขณะที่เรานอนเคียงข้างกันบนเตียง [lover.GetHerHis] "น่าเศร้าที่ข้าสามารถมอบให้ท่านได้เพียงสิ่งของทางโลก... พรุ่งนี้เช้า ข้าจะปรับเปลี่ยนเงื่อนไขในสัญญาข้าหลวงของท่าน""
 lover.1007.a:0 "ท่านดีต่อข้าเหลือเกิน [lover.GetFirstNameNoTooltip]!"
 lover.1007.b:0 "แค่ #EMP บางส่วน#! เท่านั้นหรือ ที่รัก?"
 lover.1007.b_1:0 "ข้าได้รับข้อตกลงที่ดียิ่งขึ้น"
 lover.1007.b_2:0 "[lover.GetFirstNameNoTooltip] ไม่พอใจในความโลภของข้า"

 lover.1008.t:0 "[lover.GetTitleTierName] มาถึงแล้ว"
 lover.1008.desc:0 "ขณะที่ข้าไปต้อนรับ [ROOT.Char.Custom2('RelationToMe',SCOPE.sC('lover'))] ของข้า [lover.GetTitledFirstName] ที่ [capital.GetNameNoTier] [lover.GetSheHe] ก็ถูกห้อมล้อมไปด้วยบุคคลสำคัญและข้าราชการ ต่างร้องขอความช่วยเหลือและความเห็นจาก [lover.GetHerHis]"
 lover.1008.a:0 "แยกย้ายไป! [lover.GetSheHe|U] มาที่นี่เพื่อพบข้า!"
 lover.1008.b:0 "ความคิดเห็น [lover.GetHerHis|U] เกี่ยวกับเรื่องเหล่านี้คงจะเป็นประโยชน์..."

 lover.2001.t:0 "ความกดดันจากความลับ"
 lover.2001.desc:0 "ข้าใช้เวลามากมายครุ่นคิดว่าใครอาจจะรู้เรื่องความสัมพันธ์ของข้ากับ [lover.GetTitledFirstName]\n\nหัวใจข้าเต้นเร็วเมื่อความคิดเห็นที่ไม่เป็นพิษเป็นภัยกลับกลายเป็นมีความหมายแฝง ข้าพยายามบอกตัวเองว่าทั้งหมดนี้อยู่ในหัวข้าเอง"
 lover.2001.a:0 "ไม่มีใครรู้ แน่นอน ไม่มีใครรู้"

 lover.2002.t:0 "ภาระแห่งรัก"
 lover.2002.desc:1 "ข้าหลงใหลในตัว [lover.GetHerHim] อย่างมาก แต่ [lover.GetTitledFirstName] ต้องการความเอาใจใส่และการดูแลเอาใจใส่มากมาย ซึ่งเป็นเรื่องยากในเวลา เช่นนี้!\n[lover.GetSheHe|U] รู้ดีว่าหน้าที่ของข้าในฐานะ [ROOT.Char.GetTitleAsNameNoTooltip] สำคัญเพียงใด ดังนั้นแน่นอนว่าข้าไม่สามารถใช้เวลาตื่นที่เหลือทั้งหมดอยู่กับ [lover.GetHerHim] ได้!"
 lover.2002.secret:0 "\n\nเพียงแค่การเก็บเรื่องของเราเป็นความลับก็เป็นงานที่ใหญ่หลวงแล้ว!"
 lover.2002.a:0 "ไม่นะ ยอดรักของข้า [ROOT.GetCharacter.Custom('LoverPetName')] ไม่ใช่ว่าข้าไม่ใส่ใจ!"

 lover.2003.t:0 ""ภาระ" แห่งรัก"
 lover.2003.desc:0 "[first_lover.GetSheHe|U] โทษว่าเป็น เพราะหน้าที่ทั้งหมด [first_lover.GetHerHis] ในฐานะ [first_lover.GetTitleAsNameNoTooltip] แต่รู้สึกราวกับว่า [first_lover.GetTitledFirstName] ไม่ได้มองข้าเหมือนที่ [first_lover.GetSheHe] เคยทำด้วยซ้ำ\n\nมันมากเกินไปจริงๆ หรือที่จะขอให้คนที่อ้างว่ารักท่านสละเวลาอย่างน้อยสักครู่เพื่ออยู่กับท่าน?"
 lover.2003.a:0 "ข้าสมควรได้รับสิ่งที่ดีกว่านี้"

 lover.2004.t:0 "คำสัญญาที่แตกสลาย"
 lover.2004.desc:0 "[ROOT.Char.Custom2('RelationToMe',SCOPE.sC('lover'))] ของข้า [lover.GetTitledFirstName] ยืนยันว่าการสมรส [lover.GetHerHis] กับ [lovers_lover.GetTitledFirstName] เป็นเพียงความจำเป็นทางการเมือง แต่รอยยิ้มบางอย่างที่ [lover.GetSheHe] ส่งให้ [lover.GetHerHis] [lover.Custom2('RelationToMe',SCOPE.sC('lovers_lover'))] ทำให้ข้าสงสัย..."
 lover.2004.a:0 "ข้าจะไม่ทนเรื่องนี้ — เราสัญญาว่าจะไม่รักใครอื่น!"
 lover.2004.a.tt:1 "ท่านเผชิญหน้ากับ [lover.GetShortUIName]"
 lover.2004.b:0 "ข้าเชื่อใจ [lover.GetHerHim]"
 lover.2004.b.tt:0 "#F ที่รักของข้าไม่มีทางโกหกข้า!#!"

 lover.2005.desc:0 ""ยอดรักของข้า [ROOT.Char.Custom('LoverPetName')] แน่นอนว่าสายตาอ่อนโยนที่ข้าเห็นระหว่าง [lovers_lover.GetTitledFirstName] กับท่านเป็นเพียงความเข้าใจผิดใช่หรือไม่?"\n\n[ROOT.Char.Custom2('RelationToMe',SCOPE.sC('original_lover'))] ของข้า [original_lover.GetTitledFirstName] กังวลเกี่ยวกับคำสัญญาเรื่องความจงรักภักดีส่วนตัวที่เราให้ไว้ต่อกันนับตั้งแต่ข้า แต่งงาน..."
 lover.2005.a:0 "อย่ากังวลเลยที่รัก ท่านคือคนเดียวสำหรับข้า!"
 lover.2005.b:0 "ท่านไม่มีสิทธิ์ในเรื่องการสมรสของข้า"

 lover.3103.desc_married:1 "แม้ว่า [lover.GetFirstName] จะเป็น [lover.Custom('WifeHusband')] ของ [ROOT.Char.Custom2('DescriptorNegative', SCOPE.sC('lovers_lover'))] [lovers_lover.GetTitledFirstName] นั่น [lover.GetSheHe] ก็ยืนยันกับข้าว่า [lover.GetSheHe] รักเพียงข้าเท่านั้น\n\n"[lover.Custom('LoverPetName')|U] ท่านไม่ต้องกังวลอะไรเลย ท่านคือโลกทั้งใบของข้า ข้าไม่มีทางรักใครอื่นได้""
 lover.3103.a:0 "สุดท้าย [lover.GetSheHe|U] ก็เลือกข้า — นั่นคือทั้งหมดที่สำคัญ"

 lover.3104.desc_married:0 ""ข้าไม่อาจทิ้ง [lovers_lover.GetHerHim] ได้ – [lovers_lover.GetSheHe] คือ [lovers_lover.Custom('WifeHusband')] ของข้า! และถึงแม้ข้าจะทำได้... ข้าก็รัก [lovers_lover.GetHerHim] มากเท่าที่ข้ารักท่าน ยอดรักของข้า [lover.Custom('LoverPetName')]""
 lover.3104.desc_ending:0 "\n\nคำพูดของ [lover.GetTitledFirstNamePossessive] เจ็บปวดยิ่งกว่าการสมรสเสียอีก คิดไม่ถึงว่า [lover.GetSheHe] จะปฏิเสธข้า เช่นนี้!"
 lover.3104.a:0 "อย่างน้อย [lovers_lover.GetSheHe] ก็ยังต้องการข้า..."
 lover.3104.a.tt:0 "#F ท่ามกลางคนอื่นๆ...#!"
 lover.3104.b:0 "ถ้า เช่นนั้นข้าจะยุติมันเอง!"

 lover.3105.t:0 "เตียงขนาด [ROOT.Char.GetTitleTierName]"
 lover.3105.desc:0 ""การที่เจ้าจะทรยศข้า เช่นนี้ [ROOT.Char.GetFirstNameNoTooltip]... ข้าไม่น่าปล่อยให้ [ROOT.Char.Custom2('InsultNounSexual', SCOPE.sC('lover'))] เช่นนี้เข้ามาในเตียงข้าเลย"\n\nคิดไม่ถึงว่า [discoverer.Custom('LoverPetName')] ของข้า [discoverer.GetFirstName] จะทิ้งข้าไป เพราะเรื่องเล็กน้อยเพียงเท่านี้!"
 lover.3105.a:0 "อย่างน้อยข้าก็ยังมี [lovers_lover.GetFirstNameNoTooltip]!"


 lover.3201.t:0 "ของขวัญที่สมบูรณ์แบบ"
 lover.3201.desc:0 "เมื่อมอง[ROOT.Char.Custom2('LoverSeductionObject', SCOPE.sC('lover'))] ที่รูปทรงสมบูรณ์แบบและจินตนาการถึงรอยยิ้มของ[lover.GetTitledFirstNamePossessive] ข้าก็แทบจะเก็บอาการไว้ไม่อยู่\n\n"ช่างงดงามยิ่งนัก ท่านไม่เห็นด้วยหรือ, [ROOT.Char.Custom('FormOfAddressForLiege')]?" พ่อค้าชราผายมือไปยัง[ROOT.Char.Custom2('LoverSeductionObject', SCOPE.sC('lover'))] พร้อมขยิบตา "ของขวัญอันสมบูรณ์แบบสำหรับคนรัก""
 lover.3201.a:0 "เป็น เช่นนั้น โปรดห่อให้ดี"
 lover.3201.b:0 "เป็น เช่นนั้นจริงๆ ข้าจะเอาสิบชิ้น!"
 lover.3201.c:0 "ของไร้ค่า เช่นนี้รึ? ไว้ชีวิตข้าเถอะ"
 lover.3201.c.tt:0 "#F ข้ามั่นใจว่าจะหาวิธีอื่นแสดงให้ [lover.GetHerHim] เห็นว่าข้ารัก [lover.GetHerHim] มากเพียงใด!#!"
 

 lover.3202.desc_exquisite_gift:0 "[ROOT.Char.Custom2('LoverSeductionObjectMultiple', SCOPE.sC('original_lover'))] สิบชิ้นจัดเรียงอยู่บนเตียงข้า — ปริศนาที่ไขได้ด้วยหัวใจข้าเท่านั้น"
 lover.3202.desc_ordinary_gift:0 "[ROOT.Char.Custom2('LoverSeductionObjectIndefinite', SCOPE.sC('original_lover'))|U] วางอยู่บนหมอนข้า — ปริศนาที่ไขได้ด้วยหัวใจข้าเท่านั้น"
 lover.3202.desc_ending:0 "\n\nโอ้ [original_lover.GetTitledFirstName] ยอดรักของข้า [original_lover.Custom('LoverPetName')] [ROOT.Char.GetWomanMan] คนหนึ่งไม่อาจปรารถนา [ROOT.Char.Custom2('RelationToMe',SCOPE.sC('original_lover'))] ที่ดีกว่านี้ได้อีกแล้ว!"
 lover.3202.a:0 "ข้าต้องจำไว้ขอบคุณ [original_lover.GetHerHim] สำหรับของขวัญชิ้นนี้!"
 lover.3202.a.tt:0 "#F และ #EMP ความกตัญญู#! ของข้าคือสิ่งที่ [original_lover.GetSheHe] จะต้องชื่นชมอย่างแน่นอน#!"

 lover.3203.t:0 "ที่รักของข้า"
 lover.3203.desc:0 "วันที่ทำงานอย่างมีประสิทธิผลควรจบลงด้วยการคลุกเคล้าที่ดี คิดไม่ถึงว่าข้าจะได้รับพร เช่นนี้ที่มีห้องนอนของทั้ง [lover.Custom('ComplimentAdjective')] [lover.GetTitledFirstName] และ [ROOT.Char.Custom2('RelationToMe',SCOPE.sC('spouse'))] ของข้า [spouse.GetTitledFirstName] เปิดรอข้าอยู่!"
 lover.3203.a_not_beloved:0 "ข้าจะไปหา [ROOT.Char.Custom2('RelationToMe',SCOPE.sC('spouse'))] ของข้า ตามที่สมควร"
 lover.3203.a_beloved:0 "ข้าจะไปหา [ROOT.Char.Custom2('RelationToMe',SCOPE.sC('spouse'))] ของข้า ตามที่หัวใจข้าเรียกร้อง!"
 lover.3203.b:0 "ข้ากำลังไป [lover.GetFirstNameNoTooltip]!"
 lover.3203.b.success:0 "ข้าแอบหนีไปโดยไม่มีใครพบเห็น"
 lover.3203.b.failure:0 "ข้าถูกจับได้"
 lover.3203.b.tt_safe:0 "[spouse.GetFirstNameNoTooltip] ไม่รู้เรื่องอะไรเลย"
 lover.3203.c:0 "ข้าแข็งแกร่งกว่าแรงกระตุ้นเหล่านี้!"

 lover.3204.t:0 "ความปรารถนาอันห่างไกล"
 lover.3204.desc:0 "ใน แต่ละวันที่ผ่านไป ข้ารู้สึกถึงระยะห่างจาก [ROOT.Char.Custom2('RelationToMe',SCOPE.sC('lover'))] ของข้า [lover.GetTitledFirstName] มากขึ้นเรื่อยๆ หากเพียง แต่ข้าจะได้เห็นรอยยิ้ม [lover.Custom('quirk_pos_adjective')] ของ [lover.GetHerHis] บ่อยขึ้น สัมผัสร่างกายอันอบอุ่น [lover.GetHerHis] แนบชิดข้า ลิ้มรสสิ่งที่ [lover.GetSheHe] มีให้...\n\nด้วยความปรารถนาของข้าที่ลุกโชนสว่างไสว เช่นเคย มันช่างเหน็ดเหนื่อยเหลือเกินที่ต้องแยกจากกัน เช่นนี้"
 lover.3204.a:0 "ทุกอย่างเป็นไปตามที่ [ROOT.Char.GetFaith.HighGodName] ประสงค์"
 lover.3204.a.tt:0 "#F ข้าจะไม่ดำเนินการใดๆ สิ่งใดเกิดขึ้นย่อมเป็นสิ่งที่ถูกกำหนดไว้แล้ว#!"
 lover.3204.b:0 "จะมีประโยชน์อันใดเมื่อเราต้องห่างกัน เช่นนี้?"
 
 lover.3205.opening:0 "[original_lover.Custom2('AppropriateGreeting', ROOT.Char)]"
 lover.3205.desc:0 "ถึงยอดรักของข้า [ROOT.Char.Custom('LoverPetName')] [ROOT.Char.GetTitledFirstName] ผู้ [ROOT.Char.Custom('ComplimentAdjective')]\n\nข้าเกรงว่าระยะทางที่กั้นข้าจากอ้อมกอดของท่านได้เอาชนะข้าแล้ว โปรดยกโทษให้ข้าด้วย ที่รัก และโปรดรู้ว่าข้ายังคงโหยหาความหวานและความอบอุ่นของท่าน แม้ว่าข้าจะต้องยุติสิ่งที่เราเคยมี"
 lover.3205.a:0 "นี่คือจุดจบสินะ..."
 lover.3205.a.tt:0 "#F [original_lover.GetSheHe|U] ทำร้ายหัวใจข้าผ่าน #EMP สาส์น#! เนี่ยนะ?!#!"

 lover.3206.t:0 "ข้ามสนามรบ"
 lover.3206.desc:0 "โอ้ [lover.GetTitledFirstName] ที่รักของข้า เราทั้งคู่จะรอดจากสงครามนี้หรือไม่?\n\nการที่ [ROOT.Char.Custom2('RelationDescriptor', SCOPE.sC('attacker'))] [ROOT.Char.Custom2('RelationToMe',SCOPE.sC('attacker'))] ของข้า [attacker.GetTitledFirstName] เรียกข้าเข้าร่วมสงครามเป็นเรื่องหนึ่ง แต่การให้ข้าจับอาวุธต่อสู้กับที่รักของข้า..."
 lover.3206.a:0 "ทุกอย่างยุติธรรมในความรักและสงคราม — ข้าทำอะไรไม่ได้"
 lover.3206.b:0 "ข้าจะขัดขวางความพยายามของ [attacker.GetFirstNamePossessiveNoTooltip]!"
 lover.3206.b.tt:0 "#F ทำทุกอย่างเพื่อให้ [lover.GetFirstNameNoTooltip] ของข้าปลอดภัย!#!"

 lover.3207.t:0 "รักข้ามแดน"
 lover.3207.desc:0 "แม้ว่าข้าจะอยู่ห่างไกลจาก [ROOT.Char.Custom2('RelationToMe',SCOPE.sC('lover'))] ของข้า [lover.GetTitledFirstName] หัวใจของเราก็เป็นหนึ่งเดียวกัน หากข้าเตือน [lover.GetHerHim] ถึงความรู้สึกของข้า มันอาจจะนำรอยยิ้ม [lover.Custom('quirk_pos_adjective')] ที่ข้ารักมาสู่ใบหน้า [lover.GetHerHis]..."
 lover.3207.a:0 "ข้าจะ แต่งบทกวีที่ถ่ายทอดความรู้สึกของข้าที่มีต่อ [lover.GetHerHim]!"
 lover.3207.a_object:0 "บทกวี และ [ROOT.Char.Custom2('LoverSeductionObjectIndefinite', SCOPE.sC('lover'))] เพื่อถ่ายทอดความรู้สึกของข้า!"
 lover.3207.a.tt:0 "หาก [lover.GetFirstNameNoTooltip] ชื่นชมบทกวี:"
 lover.3207.c:0 "[lover.GetSheHe|U] รู้ดีอยู่แล้วว่า [lover.GetSheHe] มีความหมายต่อข้าเพียงใด!"
 lover.3207.c.tt:0 "#F แน่นอนว่า [lover.GetSheHe] ต้องรู้สิ...!#!"
 
 lover.3208.opening:0 "[writing_lover.Custom2('AppropriateGreeting', ROOT.Char)]"
 lover.3208.desc_object:0 "[ROOT.Char.Custom2('LoverSeductionObject', SCOPE.sC('writing_lover'))] นี้เป็นเพียงเครื่องเตือนใจถึงความปรารถนาและความทุ่มเทของข้า\n"
 lover.3208.a:0 "นี่ช่างน่ารักเหลือเกิน!"
 lover.3208.a_terrible:0 "#F ข้ารู้ว่า [writing_lover.GetSheHe] หมายความดี แต่ #EMP บทกวี#! นั่น...#!#"
 lover.3208.a_okay:0 "#F แม้ว่าบทกวี [writing_lover.GetHerHis] จะต้องปรับปรุงบ้างก็ตาม...#!#"
 lover.3208.a_great:0 "#F [writing_lover.GetSheHe|U] สามารถเขียนบทกวีที่ไพเราะได้ด้วย!#!#"
 lover.3208.a_amazing:0 "#F การอ่านบทกวีนี้ทำให้ข้าตกหลุมรัก [writing_lover.GetHerHim] อีกครั้ง!#!#"
 lover.3208.b:0 "นี่เป็นเรื่องไร้สาระที่สุดที่ข้าเคยอ่านมา!"

 lover.3209.opening:0 "[lover.Custom2('AppropriateGreeting', ROOT.Char)]"
 lover.3209.desc:0 "บทกวีที่ท่านส่งมา ทำให้วันของข้าสว่างไสวและความปรารถนาในตัวท่านก็ลุกโชน การได้รู้ว่าท่านกำลังคิดถึงข้า เช่นกันเป็นสิ่งเดียวที่ ทำให้ทนได้"
 lover.3209.a:0 "โอ้ [lover.GetFirstNameNoTooltip] ข้าคิดถึงท่านเหลือเกิน!"

 lover.3210.desc:0 "โปรดอย่าส่งเรื่องไร้สาระ เช่นนี้มาให้ข้าอีก ข้ายังคงคิดถึงท่านด้วยความรักใคร่แม้ระยะทางจะกั้นเรา และอยากจะรักษาความรู้สึกนั้นไว้"
 lover.3210.a:0 "บางทีข้าอาจจะไม่ใช่นักกวีเท่าไหร่นัก..."

 lover.3211.t:0 "เพื่อพรรณนาถึงความรัก"
 lover.3211.desc:0 "จิตรกรผู้มีพรสวรรค์ได้มาถึง [capital.GetNameNoTier] และความคิดของข้าก็พุ่งตรงไปยัง [ROOT.Char.Custom2('RelationToMe',SCOPE.sC('lover'))] ของข้า [lover.GetTitledFirstName] ทันทีเมื่อข้าเห็นผลงานศิลปะอันงดงาม\n\nภาพวาดคงเป็นของขวัญที่น่ารัก หากเพียง แต่ข้าจะตัดสินใจเลือกหัวข้อที่สมบูรณ์แบบเพื่อวาดภาพได้..."
 lover.3211.a:0 "ความมืดของตรอกซอยก่อนรุ่งสาง เต็มไปด้วยสัญลักษณ์!"
 lover.3211.a.tt:0 "#F ข้ามั่นใจว่า [lover.GetSheHe] จะเข้าใจความหมายโดยนัยอันละเอียดอ่อน!#!"
 lover.3211.b:0 "อับราฮัมและซาราห์ เคียงข้างกัน"
 lover.3211.b.tt:0 "#F หวังว่า [lover.GetSheHe] จะเพลิดเพลินกับสัญลักษณ์ทางศาสนา!#!"
 lover.3211.c:0 "เพื่อครอบคลุมความปรารถนาอันเร่าร้อนของข้า — การต่อสู้อันน่าทึ่ง!"
 lover.3211.c.tt:0 "#F ไม่มีสิ่งใดบ่งบอกถึงความรักได้ดีเท่ากับการต่อสู้เพื่อสิ่งที่คุณรัก!#!"
 lover.3211.d:0 "ตลาดที่พลุกพล่านเป็นลวดลายที่สมบูรณ์แบบ!"
 lover.3211.d.tt:0 "#F [lover.GetSheHe|U] จะต้องเพลิดเพลินกับภาพที่มีชีวิตชีวา เต็มไปด้วยโอกาสอย่างแน่นอน#!"
 lover.3211.e:0 "ภาพวาดที่แสดงบทสนทนาระหว่างโสกราตีสและเฟดรัส!"
 lover.3211.e.tt:0 "#F จะมีวิธีใดที่ดีไปกว่าการให้เกียรติความรักของเราด้วยการวาดภาพหนึ่งในการสนทนาที่บันทึกไว้ครั้งแรกเกี่ยวกับเรื่องนี้?#!"
 lover.3211.f:0 "ข้าไม่มีเวลาสำหรับการตามใจ เช่นนี้"
 lover.3211.appreciate:0 "หาก [lover.GetFirstNameNoTooltip] ชื่นชมท่าทีนี้:"

 lover.3212.desc_opening:0 "ของขวัญสำหรับยอดรักของข้า [ROOT.Char.Custom('LoverPetName')] [ROOT.Char.GetFirstNameNoTooltip],\n\n"
 lover.3212.desc_lifestyle_schemer:0 "ภาพวาดนี้แสดงตรอกซอยอันมืดครึ้มใน [capital.GetNameNoTier] ก่อนรุ่งสาง แต่ข้าจะปล่อยให้สัญลักษณ์และความหมายโดยนัยที่ซ่อนอยู่ในความมืดให้ท่านไขปริศนาด้วยตนเอง"
 lover.3212.desc_lifestyle_scholar:0 "ภาพวาดนี้แสดงอับราฮัมและซาราห์ยืนเคียงข้างกัน เป็นหนึ่งเดียวกันเหมือนเรา พร้อมที่จะเผชิญหน้ากับอนาคตร่วมกัน ข้าหวังว่าท่านจะชื่นชมความสำคัญเชิงสัญลักษณ์ของภาพวาดนี้"
 lover.3212.desc_lifestyle_general:0 "ภาพวาดนี้แสดงการต่อสู้อันน่าอัศจรรย์ วีรบุรุษผู้รุ่งโรจน์มีชัยเหนือความชั่วร้าย เช่นเดียวกับที่ภาพวาดเพียงพอที่จะ ทำให้เลือดข้าเดือดพล่าน การเอ่ยชื่อท่านก็ เช่นกัน ที่รักของข้า [ROOT.Char.GetFirstNameNoTooltip]!"
 lover.3212.desc_lifestyle_administrator:0 "ภาพวาดนี้แสดงตลาดที่พลุกพล่าน เต็มไปด้วยผู้คนและสินค้า เช่นเดียวกับที่ข้าเต็มไปด้วยความรักต่อท่าน โปรดให้ภาพนี้เตือนท่านถึงโอกาสมากมายที่เราเผชิญทุกวัน รวมถึงความรู้สึกของข้าด้วย! "
 lover.3212.desc_lifestyle_diplomat:0 "ภาพวาดนี้เป็นการตีความบทสนทนาระหว่างโสกราตีสและเฟดรัส ซึ่งอภิปรายเรื่องความรักและวาทศิลป์ โดยได้รับแรงบันดาลใจจากความรักที่ข้ามีต่อท่าน"
 lover.3212.a.perfect:0 "#F ข้าไม่เคยเห็นภาพวาดใดที่สื่อสารกับข้าเช่นนี้มาก่อน!#!"
 lover.3212.a:0 "มันน่ารักมาก!"
 lover.3212.b:0 "ภาพวาดนี้น่าเกลียด โยนทิ้งไป!"

 lover.3213.desc_perfect:0 "ข้าไม่เคยเห็นผลงานศิลปะ เช่นภาพวาดที่ท่านส่งมาให้ข้ามาก่อน มัน ทำให้ข้าซาบซึ้งถึงแก่น"
 lover.3213.desc:0 "ภาพวาดที่ท่านส่งมาให้ข้าเป็นที่ชื่นชมอย่างยิ่ง ความคิดและพรสวรรค์ที่ใส่ลงไปนั้นเห็นได้ชัด"
 lover.3213.desc_lifestyle_schemer:0 "และรายละเอียดอันละเอียดอ่อนและสัญลักษณ์ที่ซ่อนอยู่ในมุมที่มืดที่สุดของตรอกซอยนั้นบ่งบอกถึงความหมายที่ลึกซึ้งยิ่งขึ้นอย่างแท้จริง!"
 lover.3213.desc_lifestyle_scholar:0 "และการเลือกอับราฮัมและซาราห์เป็นลวดลายนั้นเป็นอัจฉริยภาพ!"
 lover.3213.desc_lifestyle_general:0 "และการต่อสู้ที่วาดไว้นั้น ทำให้ข้าตื่นเต้นจริงๆ ข้าแทบรอไม่ไหวที่จะพบท่าน ที่รักของข้า!"
 lover.3213.desc_lifestyle_administrator:0 "และตลาดที่พลุกพล่าน เต็มไปด้วยผู้คนและโอกาส ดูมีชีวิตชีวามาก!"
 lover.3213.desc_lifestyle_diplomat:0 "และการได้เห็นบทสนทนาอันโด่งดังที่วาดออกมาในลักษณะนี้ช่างเป็นแรงบันดาลใจอย่างแท้จริง!"
 lover.3213.a:0 "ข้าดีใจที่ [lover.GetSheHe] ชื่นชมของขวัญ!"

 lover.3214.desc:0 "ข้าชื่นชมในท่าที แต่ภาพวาดที่ท่านส่งมาให้ข้านั้นเป็นหนึ่งในผลงานศิลปะที่น่าเกลียดที่สุดที่ข้าเคยเห็นมา มันตั้งใจให้เป็นเรื่องตลกหรือ?"
 lover.3214.a:0 "อาฮะฮะ... ใช่ เรื่องตลก"

 lover.3215.t:0 "ขับขานสรรเสริญท่าน"
 lover.3215.desc:0 "เนื่องจากข้าไม่สามารถอยู่เคียงข้างที่รักของข้า [lover.GetTitledFirstNamePossessive] ได้ ข้าเกรงว่า [lover.GetSheHe] จะลืมไปว่าความรู้สึกของข้าที่มีต่อ [lover.GetHerHim] นั้นลุกโชนเพียงใด\n\nการส่ง [lover.Custom('MusicalPerformer')] ไปทำหน้าที่เป็นตัวแทนของข้าในศิลปะแห่งรัก การเกี้ยวพาราสี [lover.GetHerHim] ด้วยบทกวี เพลง และถ้อยคำหวานที่เขียนในนามของข้า คงจะเตือน [lover.GetHerHim] ได้อย่างแน่นอน!"
 lover.3215.a:0 "ข้าจะส่งคนที่ดีที่สุดไป ทันที!"
 lover.3215.a.tt:0 "[lover.Custom('MusicalPerformer')] ในความดูแลของข้าจะเข้าร่วม [THIS.Char.Custom('GetCourt')] ใน [court_location.GetNameNoTier]"
 lover.3215.b:0 "ใครก็ได้น่าจะพอใช่ไหม?"
 lover.3215.c:0 "ข้าจะไม่พึ่งพานักดนตรีพเนจรบางคนมาทำการเกี้ยวพาราสีแทนข้า"
 lover.3215.c.tt:0 "#F ข้ามั่นใจว่าจะได้รับโอกาสอื่นที่เป็นส่วนตัวมากกว่านี้#!"

 lover.3216.desc:0 "[lover.Custom('MusicalPerformer')] คนหนึ่งมาถึงราชสำนัก อย่างเป็นทางการเพื่อสร้างความบันเทิงและให้ความเพลิดเพลิน แต่ในไม่ช้าเขาก็เข้ามาหาข้าเพื่อเปิดเผยเหตุผลที่แท้จริงของการมาเยือนของเขา"
 lover.3216.desc_fancy_troubadour:0 "[lover.Custom('MusicalPerformer')] คนหนึ่งมาถึงราชสำนัก ขับขานด้วยเสียงราวกับเทพเจ้า และถ่ายทอดร้อยแก้วที่ไหลลื่นราวกับสายน้ำ ในไม่ช้าเขาก็เข้ามาหาข้าเพื่อเปิดเผยเหตุผลที่แท้จริงของการมาเยือนของเขา"
 lover.3216.desc_ending:0 "\n\n"[original_lover.GetTitledFirstName] ส่งข้ามา, เพื่อยืนยันความรักของ[original_lover.GetHerHis] ต่อท่าน และเพื่อแสดงให้ท่านชม, [ROOT.Char.Custom('FormOfAddressForLiege')]""
 lover.3216.a:0 "ช่างน่ายินดีอะไร เช่นนี้!"
 lover.3216.b:0 "เหตุใด [original_lover.GetSheHe] จึงส่งคนอื่นมาทำการเกี้ยวพาราสีแทน [original_lover.GetHerHis]?!"

 lover.3217.desc:0 "[lover.Custom('MusicalPerformer')] ที่ท่านส่งมานั้นน่ายินดีอย่างยิ่ง! เขาร้องเพลงเหมือนนก และปั่นร้อยแก้วราวกับเกิดมาพร้อมแกนหมุนในมือ ข้าได้รับการเตือนถึงความรักของท่านทุกวัน และชีวิตข้าก็สมบูรณ์ยิ่งขึ้น เพราะสิ่งนี้!"
 lover.3217.a:0 "ข้าดีใจ!"

 lover.3218.desc:0 "ท่านกำลังเยาะเย้ยข้าอยู่หรือ ยอดรักของข้า [ROOT.Char.Custom('LoverPetName')]? [lover.Custom('MusicalPerformer')] ที่ท่านส่งมาแทบจะร้องไม่เป็นเพลง และข้าเคยเพลิดเพลินกับร้อยแก้วสำหรับเด็กที่มีเนื้อหาสาระมากกว่านี้เสียอีก"
 lover.3218.a:0 "ข้า #EMP รู้#! ว่าข้าไม่ควรเลือกนักดนตรีข้างถนน!"

 lover.3219.t:0 "ของที่ระลึกส่วนตัว"
 lover.3219.desc:0 "[ROOT.Char.Custom2('RelationToMe',SCOPE.sC('lover'))] ของข้า [lover.GetTitledFirstName] อยู่ห่างไกลจากอ้อมกอดข้าเหลือเกิน... หาก [lover.GetSheHe] มีบางสิ่งไว้ระลึกถึงข้า บางสิ่งที่ส่วนตัว ข้าคงจะสบายใจขึ้น"
 lover.3219.a:0 "[lover.GetSheHe|U] จะได้รับปอยผมของข้า"
 lover.3219.a.tt:0 "#F [lover.GetSheHe|U] คงคิดถึงข้ามากเช่นกัน#!"
 lover.3219.b:0 "ข้าจะส่งชุดชั้นในบางส่วนของข้าให้ [lover.GetHerHim]!"
 lover.3219.b.tt:0 "#F แน่นอนว่า [lover.GetSheHe] จะชื่นชมท่าทีที่กล้าแสดงออกนี้#!"
 lover.3219.c:0 "ส่ง [lover.Custom2('LoverSeductionObjectIndefinite', ROOT.Char)] เพื่อระลึกถึงวันเก่าๆ"
 lover.3219.c.tt:0 "#F ข้ารู้ว่า [lover.GetSheHe] โรแมนติกเพียงใด#!"
 lover.3219.d:0 "ข้าไม่มีเวลาสำหรับของขวัญไร้สาระ เช่นนี้"
 lover.3219.d.tt:0 "#F ข้าจะหาโอกาสที่ดีกว่านี้เพื่อแสดงให้ [lover.GetHerHim] เห็นว่าข้าคิดถึง [lover.GetHerHim] มากเพียงใด!#!"

 lover.3220.desc_opening:0 "ทุกวันที่ปราศจากท่านช่างว่างเปล่า และทุกช่วงเวลาที่อยู่นอกอ้อมกอดท่านคือความทรมาน"
 lover.3220.desc_hair:0 "เพื่อเตือนท่านถึงความรักของข้าเมื่อข้าไม่อาจอยู่ใกล้ ข้าได้ส่งของขวัญส่วนตัวให้ท่าน: ปอยผมของข้า"
 lover.3220.desc_smallclothes:0 "เพื่อเตือนท่านถึงความรักของข้าเมื่อข้าไม่อาจอยู่ใกล้ ข้าได้ส่งของขวัญส่วนตัวให้ท่าน: ชุดชั้นในบางส่วนของข้า"
 lover.3220.desc_object:0 "เพื่อเตือนท่านถึงความรักของข้าเมื่อข้าไม่อาจอยู่ใกล้ ข้าได้ส่งของขวัญที่สะท้อนถึงอดีตของเราให้ท่าน: [ROOT.Char.Custom2('LoverSeductionObjectIndefinite', SCOPE.sC('original_lover'))]"
 lover.3220.a:0 "นี่เป็นของขวัญที่น่ารักเหลือเกิน!"
 lover.3220.b:0 "ข้าควรจะทำอะไรกับสิ่งนี้?"
 lover.3220.b.tt_smallclothes:0 "#F แหวะ แค่แหวะ#!"

 lover.3221.desc_opening:0 "ของขวัญที่ท่านส่งมาให้ข้ากลายเป็นสิ่งล้ำค่าสำหรับข้าอย่างรวดเร็ว"
 lover.3221.desc_hair:0 "ความคับข้องใจที่ได้อยู่ใกล้ท่านน้อยครั้งนักจะทนได้ง่ายขึ้นเมื่อมีส่วนหนึ่งของท่านอยู่ใกล้ เช่นนี้"
 lover.3221.desc_smallclothes:0 "ความคับข้องใจที่ได้อยู่ใกล้ท่านน้อยครั้งนักจะทนได้ง่ายขึ้นเมื่อมีของส่วนตัวของท่าน เช่นนี้คอยเตือนใจถึงสิ่งที่เรามีร่วมกัน"
 lover.3221.desc_object:0 "ความคับข้องใจที่ได้อยู่ใกล้ท่านน้อยครั้งนักจะทนได้ง่ายขึ้นเมื่อมีเครื่องเตือนใจถึงอดีตที่เรามีร่วมกัน"
 lover.3221.a:0 "ข้าโล่งใจที่ [lover.GetSheHe] ชอบของขวัญ!"

 lover.3222.desc_opening:0 "ของขวัญที่ท่านส่งมาให้ข้านั้นช่าง... ส่วนตัวจริงๆ"
 lover.3222.desc_hair:0 "ข้าต้องสอบถาม — ข้าควรจะทำอะไรกับผมนี้? มันมีไว้สำหรับพิธีกรรมลึกลับบางอย่างหรือ?"
 lover.3222.desc_smallclothes:0 "ข้าต้องสอบถาม — อะไรดลใจให้ท่านส่งเสื้อผ้าที่หยาบคาย เช่นนี้มาให้ข้า?"
 lover.3222.desc_object:0 "ข้าต้องสอบถาม — เหตุใดท่านจึงให้ความสำคัญกับอดีตระหว่างเรามากนัก? ท่านมองไม่เห็นอนาคตหรือ?"
 lover.3222.a:0 "ข้าไม่อยากจะเชื่อเลยว่า [lover.GetSheHe] ไม่ชื่นชมของขวัญ!"

 lover.7001.t:0 "สหาย [potential_lover.Custom2('ComplimentAdjective', ROOT.Char)|U] ของข้า"
 lover.7001.desc:0 "นั่งอยู่ข้าง [potential_lover.GetTitledFirstNamePossessive] พูดคุยเกี่ยวกับ [potential_lover.Custom('herhis_subject_of_interest')] เห็น [potential_lover.GetHerHim] ยิ้ม [potential_lover.Custom('quirk_pos_adverb')]... ขณะที่สายตาเราประสานกัน หัวใจข้าเริ่มเต้นเร็วขึ้น และดูจากแก้มที่แดงระเรื่อของ [potential_lover.GetHerHis] ข้าไม่ใช่คนเดียวที่รู้สึกถึงความตึงเครียดที่เกิดขึ้นอย่างกะทันหัน"
 lover.7001.a:0 "ข้าจะ ทำให้ช่วงเวลานี้คงอยู่นานที่สุดเท่าที่จะทำได้!"
 lover.7001.a.tt:0 "#F บางทีสักวันเราอาจเป็นได้มากกว่าสหาย?#!"
 lover.7001.b:0 "เอาล่ะ เกี่ยวกับสิ่งที่ท่านกำลังพูด..."
 lover.7001.b.tt:0 "#F ข้าไม่ต้องการให้ [potential_lover.GetHerHim] คิดว่าเราอาจเป็นอะไรได้นอกจากสหาย#!"

 lover.7002.t:0 "สหาย [proposing_friend.Custom2('ComplimentAdjective', ROOT.Char)|U] ของข้า"
 lover.7002.desc:0 "นั่งอยู่ข้าง [proposing_friend.GetTitledFirstNamePossessive] พูดคุยเกี่ยวกับ [ROOT.Char.Custom('subject_of_interest')] สบสายตา [proposing_friend.GetHerHis] ที่จับจ้องมายังข้าขณะที่ข้ายิ้ม... ทันใดนั้นความตึงเครียดก็ชัดเจนขึ้น และดูจากแก้มที่แดงระเรื่อของ [proposing_friend.GetHerHis] ข้าไม่ใช่คนเดียวที่รู้สึก เช่นนี้"

 lover.7003.t:0 "ศัตรู [potential_lover.Custom2('InsultAdjective', ROOT.Char)|U]"
 lover.7003.desc:0 "[potential_lover.GetTitledFirstName] เริ่มต้นการต่อว่าอีกครั้งเกี่ยวกับ [potential_lover.Custom('herhis_subject_of_interest')] และข้า ปล่อยให้ความคิดล่องลอยไป อดไม่ได้ที่จะสังเกตว่า [potential_lover.GetSheHe] จริงๆ แล้วเป็น [potential_lover.GetWomanMan] ที่ [potential_lover.Custom2('ComplimentAdjective', ROOT.Char)] ทีเดียว\n\nความตึงเครียดระหว่างเราไม่ใช่เรื่องใหม่ แต่ขณะที่สายตาเราประสานกัน ข้ารู้สึกว่าหัวใจข้าสั่นไหวด้วยบางสิ่งที่นอกเหนือไปจากความเกลียดชัง..."
 lover.7003.a:0 "เจ้า[potential_lover.Custom2('InsultNoun', ROOT.Char)] นั่นร่ายมนตร์อะไรใส่ข้ากัน?!"
 lover.7003.a.tt:0 "#F ข้าต้องสืบสวนความรู้สึกแปลกประหลาดนี้ต่อไป...#!"
 lover.7003.b:0 "มันต้องเป็นความเกลียดชังที่ข้ารู้สึก"

 lover.7004.t:0 "ศัตรู [proposing_rival.Custom2('InsultAdjective', ROOT.Char)|U]"
 lover.7004.desc_opening:0 "ท่ามกลางการสนทนาที่น่าสนใจเกี่ยวกับ [ROOT.Char.Custom('subject_of_interest')] ข้าเห็น [proposing_rival.GetTitledFirstName] อยู่ฝั่งตรงข้าม [ROOT.Char.Custom('GetRoom')] กำลังขมวดคิ้ว\n\n"
 lover.7004.desc_potential_lover_is_go:0 "ขณะที่สายตาเราประสานกัน [proposing_rival.GetSheHe] ทำให้ข้าประหลาดใจ ยิ้ม [proposing_rival.Custom('quirk_pos_adverb')] [proposing_rival.GetSheHe] เป็น [proposing_rival.GetWomanMan] ที่ [proposing_rival.Custom2('ComplimentAdjective', ROOT.Char)] เช่นนี้มาตลอดหรือ?"
 lover.7004.desc_not:0 "เมื่อสายตาเราสบกัน [proposing_rival.GetSheHe] ก็ขมวดคิ้วและหลบตาอย่างรวดเร็ว — ช่างเป็น[proposing_rival.Custom2('InsultNoun', ROOT.Char)] เหมือนเคย!"
 lover.7004.a:0 "ข้ายิ้มตอบ...?"
 lover.7004.a.tt:0 "#F อะไรคือความรู้สึกสั่นไหวในใจข้าอย่างกะทันหันนี้?#!"
 lover.7004.b:0 "แหวะ ปล่อยข้าไว้ตามลำพัง [proposing_rival.GetFirstNameNoTooltip]"

 lover.7005.t:0 "[ROOT.GetCharacter.Custom2('RelationToMe' , SCOPE.sC('potential_lover') )|U] ที่รักของข้า"
 lover.7005.desc:0 "ข้าสังเกตเห็นมานานแล้วว่า [ROOT.GetCharacter.Custom2('RelationToMe' , SCOPE.sC('potential_lover') )] ของข้า [potential_lover.GetTitledFirstName] เป็น [potential_lover.GetWomanMan] ที่ดูดีมาก ท่าทางที่ [potential_lover.GetSheHe] ยิ้มและ [potential_lover.Custom('quirk_pos_present')] ไม่เคยพลาดที่จะ ทำให้หัวใจข้าสั่นไหว..."
 lover.7005.a:0 "นี่เป็นความรู้สึกปกติที่จะมีต่อ [ROOT.GetCharacter.Custom2('RelationToMe' , SCOPE.sC('potential_lover') )] หรือ?"
 lover.7005.a.tt:0 "#F ไม่ว่ามันจะหมายถึงอะไร ข้าต้องการมันมากขึ้น!#!"
 lover.7005.b:0 "[potential_lover.GetSheHe|U] คือ [ROOT.GetCharacter.Custom2('RelationToMe' , SCOPE.sC('potential_lover') )] ของข้า ตั้งสติหน่อย [ROOT.Char.GetFirstNameNoTooltip]!"

 lover.7006.t:0 "[ROOT.GetCharacter.Custom2('RelationToMe' , SCOPE.sC('proposing_family') )|U] ที่รักของข้า"
 lover.7006.desc:0 "[ROOT.GetCharacter.Custom2('RelationToMe' , SCOPE.sC('proposing_family') )] ของข้า [proposing_family.GetTitledFirstName] เป็น [proposing_family.GetWomanMan] ที่ [proposing_family.Custom2('ComplimentAdjective', ROOT.Char)] มาก ข้ารู้เรื่องนั้นมานานแล้ว แต่เมื่อเร็วๆ นี้ [proposing_family.GetSheHe] เริ่มอ้อยอิ่งอยู่ใกล้ข้า ยิ้มหวานกว่าปกติ มองข้าเมื่อ [proposing_family.GetSheHe] คิดว่าข้ามองไม่เห็น [proposing_family.GetHerHim]..."
 lover.7006.a:0 "ข้าก็สนใจ [proposing_family.GetHerHim] เช่นกัน!"
 lover.7006.a.tt:0 "#F แต่จะไม่มีอะไรเกิดขึ้น... ลองจินตนาการถึงเรื่องอื้อฉาวสิ!#!"
 lover.7006.b:0 "มันไม่มีอะไรนอกจากความรักฉัน [ROOT.GetCharacter.Custom2('RelationToMe' , SCOPE.sC('proposing_family') )] แน่นอน"

 lover.8102.t:0 "$pilgrimage_header$ ผลที่ตามมา"
 lover.8102.desc:0 ""ขออภัย" ชาวบ้านหน้าตาคุ้นเคยปรากฏตัวต่อหน้าข้า ขณะที่ข้าพยายามนึกว่าเคยพบ [brothel_worker.GetHerHim] ที่ไหนมาก่อน [brothel_worker.GetSheHe] ก็ตอบราวกับอ่านใจข้าได้\n\n"เราพบกันที่โรงหญิงงามใน [brothel_location.GetName] ท่านจ่ายค่าบริการของข้า" สีชมพูระเรื่อปรากฏบนแก้ม [brothel_worker.GetHerHis]\n"การที่เราได้กลับมาพบกันอีกครั้ง... มันต้องเป็นโชคชะตาที่"
 lover.8102.desc.puppy_love:0 "ข้าตกหลุมรักท่าน ทุกอย่างรู้สึกถูกต้องเหลือเกินในอ้อมแขนท่าน... พอจะมีที่ว่างในใจท่านสำหรับคนอย่างข้าบ้างหรือไม่?""
 lover.8102.desc.they_pregnant:0 "ข้าตั้งครรภ์ลูกของท่าน ชานั่นคงไม่มีสมุนไพรที่เหมาะสม ข้าไม่ต้องการเลี้ยงลูกตามลำพัง""
 lover.8102.desc.you_pregnant:0 "ท่านอาจจะตั้งครรภ์ ชานั่นไม่มีสมุนไพรและความแรงที่เหมาะสม ข้าไม่ต้องการให้ท่านเลี้ยงลูกตามลำพัง""
 lover.8102.desc.ending:0 "\n\nเสียง [brothel_worker.GetHerHis|U] แผ่วลงและ [brothel_worker.GetSheHe] ส่งยิ้มเขินอายให้ข้า หรือบางทีนั่นอาจเป็นรอยยิ้มเยาะที่รู้ทัน?"
 lover.8102.a:0 "ข้าจะรับผิดชอบการกระทำของข้าอย่างเต็มที่"
 lover.8102.b:0 "เจ้าแค่พยายามจะใส่ร้ายข้าใช่หรือไม่!?"
 lover.8102.c:0 "ลืมคืนนั้นไปเสีย มิฉะนั้นจะไม่มีใครได้ยินข่าวคราวจากเจ้าอีกเลย"
 lover.8102.c.success:0 "[brothel_worker.GetTitledFirstNameNoTooltip] ถูกข่มขู่ให้เงียบ"
 lover.8102.c.failure:0 "[brothel_worker.GetTitledFirstNameNoTooltip] ตกลงที่จะเงียบเพื่อแลกกับราคา"
 lover.8102.c.crit_failure:0 "[brothel_worker.GetTitledFirstNameNoTooltip] บอกโลกว่าท่านทำอะไรลงไป"
 lover.8102.d:0 "เจ้ามากับข้าได้ ตราบใดที่เจ้าเก็บอดีตของเราเป็นความลับ"
