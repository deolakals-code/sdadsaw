l_english: 
 rivalry.0001.t:0 "ฝังขวานศึก"
 rivalry.0001.desc:2 ""[ROOT.Char.GetTitledFirstNameNoTooltip] เราเคยมีความขัดแย้งกันในอดีต แต่ท่านไม่เห็นด้วยหรือว่าถึงเวลาแล้วที่จะปล่อยให้เรื่องที่ผ่านไปแล้วผ่านไป?"\n\n[rival.Custom2('MyCharacterIntroduction', ROOT.Char)|U] ผายมือจากข้าไปยัง[rival.GetHerHim] "ไม่ว่าอะไรจะอยู่ระหว่างเรา... ให้เราเริ่มต้นใหม่เถิด!""
 rivalry.0001.a:1 "ใช่ ให้เป็น เช่นนั้นเถิด"
 rivalry.0001.b:0 "เจ้ากำลังหมอบคลานต่อหน้าข้า?! [ROOT.Char.GetFaith.HighGodName] ทรงพระเมตตา!"

 rivalry.0002.t:0 "ฝังขวานศึก"
 rivalry.0002.desc:0 "บัดนี้ เมื่อมองย้อนกลับไป ทุกอย่างดูแปลกประหลาดนัก ความเกลียดชังที่ข้าแบกรับและความเจ็บปวดที่ข้าปรารถนาจะก่อให้เกิดอย่างยิ่งยวด...\nทั้งหมดนั้นเพื่ออะไรกัน?\n\nการเรียก [rival_response.GetTitledFirstName] ว่าศัตรูของข้า ไม่สมเหตุสมผลสำหรับข้าอีกต่อไป"
 rivalry.0002.a:0 "ปล่อยให้เรื่องที่ผ่านไปแล้วผ่านไป"

 rivalry.0003.t:0 "คู่ต่อสู้ที่ไม่คู่ควร"
 rivalry.0003.imprisoned.desc:0 "เมื่อข่าวการถูกจองจำของ [nemesis.GetTitledFirstNamePossessive] มาถึงข้า,"
 rivalry.0003.incapable.desc:0 "เมื่อข้าได้ยินครั้งแรกเกี่ยวกับอุบัติเหตุของ [nemesis.GetTitledFirstNamePossessive] และสภาพน้ำลายไหล ติดเตียง,"
 rivalry.0003.my_prisoner.desc:0 "เมื่อข้ากระแทกประตู[SelectLocalization( IsLandlessAdventurer( ROOT.Char ), 'กรง', 'ห้องขัง')]ใส่ใบหน้าที่น่ารังเกียจของ [nemesis.GetTitledFirstNamePossessive],"
 rivalry.0003.middle.desc:0 "ข้าเปี่ยมไปด้วยความยินดี เจ้า[nemesis.Custom2('InsultAdjective', ROOT.Char)] [nemesis.Custom2('InsultNoun', ROOT.Char)] นั่นในที่สุดก็ได้รับสิ่งที่[nemesis.GetSheHe] สมควรได้รับ!\n\n"
 rivalry.0003.compassionate.desc:0 "แต่ความสุขของข้าจางหายไปตามกาลเวลา เป็นความยินดีที่ได้เอาชนะ [nemesis.GetTitledFirstNameNoTooltip] คนเก่า แต่สิ่งมีชีวิตที่น่าสังเวชนี้หรือ? ข้าเกือบจะรู้สึก #EMP สงสาร#! [nemesis.GetHerHim]..."
 rivalry.0003.uncompassionate.desc:0 "อย่างไรก็ตาม เมื่อเวลาผ่านไป สภาพอันน่าสมเพชของ[nemesis.GetHerHis]กลับ ทำให้ข้า #EMP เบื่อหน่าย#! ข้าไม่พบความสุขในการทรมานหนูตัวเล็กๆ ที่อ่อนแอ"
 rivalry.0003.a:0 "ถึงเวลาปิดฉากบทนี้แล้ว"
 rivalry.0003.b:0 "ข้าจะไม่มีวันให้อภัย[nemesis.GetHerHim]! ไม่มีวัน!"

 rivalry.1001.t:0 "ปรากฏอยู่เสมอ"
 rivalry.1001.desc.opening:0 "[rival.GetTitledFirstName] ได้กลายเป็นภัยพิบัติที่คอยรบกวนชีวิตข้าอยู่เสมอ\n\n"
 rivalry.1001.malicious:0 "[rival.GetSheHe|U] ดูเหมือนจะทำลายทุกสิ่งที่ข้าทำเสมอ, และ[rival.GetWomanMan] [rival.Custom2('InsultAdjective', ROOT.Char)] ผู้นั้นก็ยิ้มเยาะขณะที่[rival.GetSheHe] ทำมัน!"
 rivalry.1001.benevolent:0 "เมื่อใดก็ตามที่เราบังเอิญพบกัน [rival.GetWomanMan] [rival.Custom2('InsultAdjective', ROOT.Char)] ผู้นั้นก็จะพยายามทำตัวให้ดูดีและเที่ยงธรรม, เยาะเย้ยข้าจากท่าทีที่สูงส่งของ[rival.GetHerHis] สิ่งที่ ทำให้ข้าขุ่นเคืองจริงๆ คือ [rival.GetSheHe] ดูเหมือนจะหลอกคนอื่นได้ทั้งหมด!"
 rivalry.1001.dominant:0 "ไม่เพียง แต่[rival.GetSheHe]จะเรียกร้องความสนใจและพื้นที่อยู่ตลอดเวลา [rival.GetSheHe]ยังกล้าเรียกร้องเวลาและความสนใจจากข้าอีกด้วย ราวกับว่าข้าไม่มีอะไรดีกว่าทำนอกจากการฟัง[rival.GetHerHim]โอ้อวด!"
 rivalry.1001.submissive:0 "[rival.GetWomanMan] [rival.Custom2('InsultAdjective', ROOT.Char)] ผู้นั้นแสร้งทำเป็นอ่อนน้อม, เพียงเพื่อหันกลับมาแทงข้างหลังข้าในทุกโอกาส!"
 rivalry.1001.extroverted:0 "[rival.GetSheHe|U] เรียกร้องความสนใจทั้งหมดในทุกงานเสมอ ทำให้ทุกคนต้องฟัง[rival.GetHerHim]พล่ามไม่หยุดเป็นเวลาหลายชั่วโมง ราวกับว่านั่นยังไม่แย่พอ [rival.GetSheHe]ยังดูเหมือนจะใช้ทุกโอกาสเพื่อเหน็บแนมข้าขณะที่[rival.GetSheHe]ทำ เช่นนั้น!"
 rivalry.1001.introverted:0 "[rival.GetWomanMan] [rival.Custom2('InsultAdjective', ROOT.Char)] ผู้นั้นมีเสน่ห์ดึงดูดราวกับก้อนหิน, แต่ดูเหมือนจะยังหาเวลามาปล่อยข่าวลือเกี่ยวกับข้าได้!"
 rivalry.1001.emotional:0 "[rival.GetSheHe|U] ใช้ทุกโอกาสเพื่อสร้างเรื่องและ ทำให้ข้าเป็นตัวร้าย! [rival.GetSheHe|U] คร่ำครวญและบ่นว่า ลากชื่อเสียงของข้าไปคลุกโคลน และโทษข้าสำหรับทุกสิ่งที่ผิดพลาดในชีวิตของ[rival.GetHerHis]"
 rivalry.1001.levelheaded:0 "ไม่สำคัญว่าจะเป็นการบ่อนทำลายการปกครองของข้าหรือการกล่าวคำดูถูกที่เจ็บแสบ [rival.GetSheHe] ก็อยู่ที่นั่นเสมอ รอคอยอยู่"
 rivalry.1001.desc.fallback:0 "รู้สึกราวกับว่าไม่ว่าข้าจะไปที่ไหนหรือทำอะไร [rival.GetTitledFirstName] ก็สามารถ ทำให้การปรากฏตัวของ[rival.GetHerHis]เป็นที่รับรู้ได้ มันคือเงาที่ ทำให้ทุกวันของข้ามืดมนอยู่เสมอ"
 rivalry.1001.a:1 "สาปแช่งเจ้า [rival.GetFirstNameNoTooltip]!"
 
 rivalry.1010.t:0 "การกระทำอันมุ่งร้าย"
 rivalry.1010.desc:0 "[rival.Custom2('InsultBehavior', ROOT.Char)] ของ [rival.GetTitledFirstNamePossessive] รบกวนจิตใจข้ามาตลอด, แต่"
 rivalry.1010.desc.patient:0 "แม้ แต่ข้าก็ยังทน [rival.Custom2('InsultBehavior', ROOT.Char)] ของ [rival.GetTitledFirstNamePossessive] ได้เพียงเท่านี้ ก่อนที่มันจะมากเกินรับไหว, และ"
 rivalry.1010.desc.end:0 "เมื่อเร็วๆ นี้มันกวนประสาทข้ามากกว่าที่เคย ข้าต้องการแก้แค้น[rival.GetHerHim]สำหรับพฤติกรรมนี้ แต่การตอบโต้ของข้าควรอยู่ในรูปแบบใด?"
 rivalry.1010.a:0 "ปล่อยข่าวลืออื้อฉาว ซึ่งจะรบกวน[rival.GetHerHim]ไปอีกหลายปี!"
 rivalry.1010.a.success.tt:0 "#F ข่าวลือนำไปสู่การนินทาและการคาดเดามากมาย #!"
 rivalry.1010.a.failure.tt:0 "#F ไม่มีใครเชื่อข่าวลือที่ไม่น่าเป็นไปได้ #!"
 rivalry.1010.a.badfailure.tt:0 "#F ข้าถูกเปิดโปงว่าเป็นต้นตอของข่าวลือ #!"
 rivalry.1010.b:0 "เขียนบทกวีคมคายเยาะเย้ยความล้มเหลวมากมายของ[rival.GetHerHis]!"
 rivalry.1010.b.success.tt:0 "#F บทกวีเป็นที่นิยมมากจนถูกคัดลอกซ้ำแล้วซ้ำเล่า #!"
 rivalry.1010.b.failure.tt:0 "#F ผู้คนคิดว่าบทกวีเขียนได้ไม่ดีและมีรสนิยมแย่ #!"
 rivalry.1010.b.badfailure.tt:0 "#F ข้าถูกเปิดโปงว่าเป็นผู้แต่งบทกวี #!"
 rivalry.1010.c:0 "ประณามพฤติกรรมหยาบคายของ[rival.GetHerHis]ต่อหน้า[rival.GetHerHis]โดยตรง!"
 rivlary.1010.c.tt:0 "#F [rival.GetTitledFirstName] จะตอบโต้ต่อการดูหมิ่นของท่าน #!"

 rivalry.1011.t:0 "คำพูดมุ่งร้าย"
 rivalry.1011.desc.poem:0 "มีบทกวีใหม่แพร่สะพัด ซึ่งเยาะเย้ยข้าสำหรับ [ROOT.GetCharacter.Custom('quirk_neg_noun')] ของข้าและ ทำให้ข้าดูไม่ดี แม้ว่าข้าจะไม่สามารถพิสูจน์ได้ว่า [from_rival.GetTitledFirstName] อยู่เบื้องหลังเรื่องนี้ แต่สำนวนร้อยแก้วนั้นบ่งบอกถึงการมีส่วนร่วมของ[from_rival.GetHerHis]อย่างชัดเจน"
 rivalry.1011.desc.rumors:0 "ข่าวลือที่น่าตกใจเกี่ยวกับ [ROOT.GetCharacter.Custom('quirk_neg_noun')] ของข้าแพร่สะพัดไปทั่ว [ROOT.Char.Custom('GetCourt')] ของข้า ข้าถูกตามรังควานด้วยเสียงกระซิบที่ไม่เป็นมิตรและเสียงหัวเราะเยาะอย่างโหดร้ายไม่ว่าข้าจะไปที่ใด กลอุบายสกปรกนี้เป็นพฤติกรรมต่ำทรามที่ข้าคาดหวังว่า [from_rival.GetTitledFirstName] จะลดตัวลงไปทำ!"
 rivalry.1011.a:0 "ข้าจะแก้แค้น[from_rival.GetHerHim]สำหรับเรื่องนี้!"

 rivalry.1012.t:0 "ความเพ้อฝันอันโง่เขลา"
 rivalry.1012.desc.poem:0 "ข้าเพิ่งทราบว่า [from_rival.GetTitledFirstName] ได้เขียนบทกวีใส่ร้ายเพื่อพยายามเยาะเย้ยข้าสำหรับ [ROOT.GetCharacter.Custom('quirk_neg_noun')] ของข้า! อย่างไรก็ตาม บทกวีของ[from_rival.GetHerHis]เขียนได้แย่มากจนทุกคนกลับเยาะเย้ย [from_rival.GetFirstName] ที่สิ้นเปลืองกระดาษดีๆ ไปกับเรื่องไร้สาระของ[rival.GetHerHis]!"
 rivalry.1012.desc.rumors:0 "ข้าเพิ่งทราบว่า [from_rival.GetTitledFirstName] พยายามปล่อยข่าวลือใส่ร้ายเกี่ยวกับสิ่งที่ข้าถูกกล่าวหาว่าทำเป็นการส่วนตัว ไอ้คนน่าสมเพช [from_rival.Custom('quirk_neg_adjective')] นั่นต้องมีมุมมองที่บิดเบี้ยวเกี่ยวกับข้ามาก เนื่องจากข่าวลือนั้นแปลกประหลาดและไม่น่าเชื่อถือจนทุกคนปัดตกไปโดยสิ้นเชิง แต่พวกเขากลับนินทาว่า [from_rival.GetFirstName] ลดตัวลงไปใช้วิธีการที่มุ่งร้ายและใจแคบ เช่นนี้ได้อย่างไร"
 rivalry.1012.a:0 "สมควรแล้วไอ้คนเสเพลนั่น!"

 rivalry.1013.t:0 "ข่าวลือถูกปล่อย"
 rivalry.1013.desc:0 "ข่าวลืออื้อฉาวเกี่ยวกับ [rival.GetTitledFirstName] ที่ข้าพยายามปล่อยไปทั่ว [rival.Custom('GetCourt')] ของ[rival.GetHerHis]ได้กลายเป็นหัวข้อโปรดใหม่สำหรับการนินทาและการคาดเดา ข้าได้ยินมาว่า [rival.GetTitledFirstName] รู้สึกขุ่นเคืองและหงุดหงิดมากขึ้นเรื่อยๆ ที่พยายามจะหยุดยั้งข่าวลือเหล่านั้น!"
 rivalry.1013.a:0 "บางทีนี่อาจจะ ทำให้ [rival.GetHerHim] รู้สำนึกถึงสถานะของ[rival.GetHerHis]เสียที"

 rivalry.1014.t:0 "ข่าวลือถูกปฏิเสธ!"
 rivalry.1014.desc.start:0 "ไม่มีใครเชื่อข่าวลือที่ข้าพยายามปล่อยเกี่ยวกับ [rival.GetTitledFirstName] อย่างจริงจัง โดยปัดตกไปว่าเป็นเรื่องเหลวไหลและแปลกประหลาด ผู้คนกำลังหัวเราะเยาะ"
 rivalry.1014.desc.hidden:0 "ใครก็ตามที่สร้างมันขึ้นมา โดยกล่าวว่าพวกเขาต้องเป็น"
 rivalry.1014.desc.exposed:0 "ข้าที่สร้างมันขึ้นมา โดยกล่าวว่าข้าเป็น"
 rivalry.1014.desc.end:0 "คนไม่รู้จักโตและใจแคบที่ลดตัวลงไปใช้กลอุบายต่ำทราม เช่นนี้เพื่อพยายามทำลายชื่อเสียงของ [rival.GetFirstNamePossessive]"
 rivalry.1014.a:0 "อย่างน้อยข้าก็สามารถกลบร่องรอยได้..."
 rivalry.1014.a.exposed:0 "มันไม่ได้เป็นไปตามแผนเลยแม้ แต่น้อย"

 rivalry.1015.t:0 "บทกวียอดนิยม"
 rivalry.1015.desc:0 "สัมผัสคมคายและนัยยะแฝงอันชาญฉลาดที่ข้าใส่ลงไปในบทวิจารณ์อันเผ็ดร้อนเกี่ยวกับลักษณะนิสัยของ [rival.GetTitledFirstNamePossessive] ได้แพร่กระจายไปทั่ว [rival.Custom('GetCourt')] ของ[rival.GetHerHis]ราวกับไฟป่า! แม้[rival.GetSheHe]จะพยายามเพียงใด [rival.GetSheHe]ก็ไม่สามารถหยุดยั้งการแพร่กระจายได้ ซึ่งยิ่งเพิ่มความอับอายให้[rival.GetHerHis]!"
 rivalry.1015.a:0 "บางทีนี่อาจจะ ทำให้ [rival.GetHerHim] รู้สำนึกถึงสถานะของ[rival.GetHerHis]เสียที"

 rivalry.1016.t:0 "บทกวีถูกปฏิเสธ"
 rivalry.1016.desc:0 "หลังจากเขียนบทกวีหลายบทเยาะเย้ยลักษณะนิสัยของ [rival.GetTitledFirstNamePossessive] ข้าก็เผยแพร่ไปทั่ว [rival.Custom('GetCourt')] ของ[rival.GetHerHis]และรอให้มันเป็นที่นิยม\n\nน่าเสียดาย ดูเหมือนว่างานเขียนของข้าไม่เป็นที่นิยมนัก... อันที่จริง ทุกคนค่อนข้างเห็นพ้องกันว่าบทกวีเหล่านั้นเป็นเรื่องไร้สาระที่ไม่คุ้มค่ากระดาษที่ใช้เขียน!"
 rivalry.1016.desc.exposed:0 "ที่แย่กว่านั้น ความเกลียดชังของข้าที่มีต่อ [rival.GetTitledFirstName] นั้นชัดเจนมากจนทุกคนรู้ว่าข้าเป็นคนเขียน!"
 rivalry.1016.a:0 "ข้าแค่ดีใจที่ไม่ได้ลงชื่อไว้"
 rivalry.1016.a.exposed:0 "ทำไมข้าถึงคิดว่านั่นเป็นความคิดที่ดี?"

 rivalry.1017.t:0 "คำดูถูกอันอุกอาจ!"
 rivalry.1017.desc:2 "ข้ากำลังทำธุระของข้า [ROOT.GetCharacter.Custom('quirk_pos_adverb')] เมื่อ [from_rival.GetTitledFirstName] เดินเข้ามาหาข้าและสบประมาทข้าต่อหน้า\n\n"เจ้า[ROOT.GetCharacter.Custom2('InsultNoun', SCOPE.sC('from_rival'))] [ROOT.GetCharacter.Custom('quirk_neg_adjective')|U], การมีอยู่ของเจ้า ทำให้ข้าเศร้าใจ!""
 rivalry.1017.a:0 "ข้าตอบโต้การหมิ่นประมาทนี้ด้วยคำดูถูกของข้าเองมากมาย!"
 rivalry.1017.b:0 "ไอ้คนขี้ปดน่าสมเพชนั่นจะต้องตอบข้าในการประลอง!"
 rivalry.1017.b.tt:0 "#F ข้าจะแสดงให้ไอ้คนเสเพลนั่นเห็นว่าข้าดีกว่า[from_rival.GetSheHe]#!"
 rivalry.1017.c:0 "ข้าจะทำสิ่งที่ถูกต้องและหันแก้มอีกข้างให้"

 rivalry.1018.t:0 "การตอบโต้"
 rivalry.1018.desc:0 "เมื่อข้าเข้าไปหา [rival.GetTitledFirstName] เพื่อต่อว่า[rival.GetHerHim] [rival.GetSheHe] ก็โต้กลับด้วยคำดูถูกและการประทุษร้ายของ[rival.GetHerHis]เองมากมาย!\n\nการโต้เถียงถูกมองว่าเป็นเรื่องเด็กๆ และเราทั้งคู่ต่างเสียหน้าไปตามๆ กัน"
 rivalry.1018.a:0 "ทั้งหมดเป็นความผิดของ[rival.GetHerHis]ที่เป็นคน [rival.Custom('quirk_neg_adjective')] เช่นนี้ตั้งแต่แรก!"

 rivalry.1019.t:0 "การดูหมิ่นอันไร้ค่า"
 rivalry.1019.desc:0 "เมื่อข้าเข้าไปหา [rival.GetTitledFirstName] เพื่อต่อว่า[rival.GetHerHim] โดยแจกแจงความผิดทั้งหมดของ[rival.GetHerHis] [rival.GetSheHe|U] ไม่มีอะไรจะพูดเพื่อแก้ต่างให้[rival.GetHerHis] และข้าจากมาโดยรู้ว่า[rival.GetSheHe]ได้ถูกสั่งสอนให้รู้สำนึกแล้ว"
 rivalry.1019.a:0 "ข้ารู้อยู่แล้วว่า[rival.GetSheHe]อ่อนแอ!"

 rivalry.1020.t:0 "การดูหมิ่นถูกท้าทาย!"
 rivalry.1020.desc:0 "เมื่อข้าประณาม [rival.GetTitledFirstName] เกี่ยวกับ [rival.Custom('quirk_neg_noun')] ของ[rival.GetHerHis] [rival.GetSheHe] ถือว่าเป็นการดูหมิ่นอย่างร้ายแรงและท้าทายข้าให้ประลองเพื่อรักษาเกียรติของ[rival.GetHerHis]!"
 rivalry.1020.a:0 "ตกลง [rival.GetFirstNameNoTooltip]!"
 rivalry.1020.b:0 "เอ่อ... ไม่จำเป็นต้องใช้ความรุนแรงหรอกนะ ตอนนี้..."
 rivalry.1021.tt:0 "ชัยชนะอันงดงาม"
 rivalry.1022.tt:0 "ชัยชนะอย่างฉิวเฉียด"
 rivalry.1023.tt:0 "ความพ่ายแพ้อย่างฉิวเฉียด"
 rivalry.1024.tt:0 "ความพ่ายแพ้อันน่าอัปยศ"

 rivalry.1021.t:0 "ชัยชนะอันงดงาม"
 rivalry.1021.desc:1 "ตั้งแต่เริ่มการประลองกับ [duel_loser.GetTitledFirstName] ก็เห็นได้ชัดว่าข้าเป็นฝ่ายได้เปรียบ ข้าฉวยโอกาสกดดัน ทำให้[duel_loser.GetHerHim]เสียหลัก ในไม่ช้า [duel_loser.GetSheHe] ก็ทำพลาดและเปิดช่องว่างให้ข้า ซึ่งข้าฉวยโอกาสนั้น [ROOT.GetCharacter.Custom('SignatureWeaponCritical')] แขนของ[duel_loser.GetHerHis] จบการประลอง!\n\nความจริงที่ว่าชัยชนะของข้ารวดเร็วและเด็ดขาด ทำให้มันดียิ่งขึ้นไปอีก"
 rivalry.1021.a:1 "ข้าได้พิสูจน์ตนเองแล้วว่าเหนือกว่า [duel_loser.GetFirstNamePossessiveNoTooltip]!"

 rivalry.1022.t:0 "ชัยชนะอย่างฉิวเฉียด"
 rivalry.1022.desc:2 "ข้าเริ่มการประลองกับ [duel_loser.GetTitledFirstName] และตระหนักว่าเราสูสีกันมากกว่าที่ข้าคาดไว้ เราแลกหมัดและปัดป้องไปมาอยู่พักหนึ่ง ไม่มีใครได้เปรียบอีกฝ่ายนานนัก\n\nในที่สุดเราทั้งคู่ก็เริ่มเหนื่อยล้าและเขาเปิดช่องว่าง ทำให้ข้าสามารถ [ROOT.GetCharacter.Custom('SignatureWeaponCritical')] ขาของ[duel_loser.GetHerHis]และจบการประลอง!"
 rivalry.1022.a:0 "ชัยชนะของข้าพิสูจน์ว่าข้าเป็นฝ่ายถูก"

 rivalry.1023.t:0 "ความพ่ายแพ้อย่างฉิวเฉียด"
 rivalry.1023.desc:2 "ขณะที่ [duel_winner.GetTitledFirstName] และข้าเริ่มการประลอง ข้าตระหนักว่า[duel_winner.GetSheHe]เป็นศัตรูที่เก่งกาจกว่าที่ข้าคาดการณ์ไว้ การต่อสู้เป็นไปอย่างสูสี เรา แต่ละคนแลกเปลี่ยนการโจมตีและปัดป้องขณะที่มองหาช่องว่าง\n\nในที่สุดเมื่อข้าเริ่มเหนื่อยล้า การป้องกันของข้าก็พลาดไปชั่วขณะ ซึ่ง [duel_winner.GetFirstName] ฉวยโอกาส [duel_winner.Custom('SignatureWeaponCritical')] แขนของข้าด้วย [duel_winner.Custom('signature_weapon')] ของ[duel_winner.GetHerHis]."
 rivalry.1023.desc.end:0 "เลือดไหลไม่หยุด ข้าไม่มีทางเลือกอื่นนอกจากยอมแพ้การประลอง"
 rivalry.1023.desc.death:0 "บาดแผลส่งผลต่อข้าและข้าทรุดลงกับพื้น"
 rivalry.1023.a:2 "ข้าจะจัดการเจ้าคราวหน้า [duel_winner.GetTitledFirstNameNoTooltip]!"
 rivalry.1023.a.death:0 "มันมืดเหลือเกิน..."

 rivalry.1024.t:0 "ความพ่ายแพ้อันน่าอัปยศ"
 rivalry.1024.desc:2 "เมื่อ [duel_winner.GetTitledFirstName] และข้าพบกันเพื่อเริ่มการประลอง [duel_winner.GetSheHe] ไม่เสียเวลากระโจนเข้าใส่ทันที! ข้าไม่ทันตั้งตัว พยายามตั้งหลักและการโจมตีอย่างไม่หยุดยั้งของ [duel_winner.GetFirstNamePossessive] ทำให้ข้าไม่มีช่องว่างให้ฟื้นตัว\n\nไม่นานนัก [duel_winner.GetSheHe] ก็หลุดผ่านการป้องกันของข้าและ [duel_winner.Custom('SignatureWeaponCriticalPresent')] ขาของข้าด้วย [duel_winner.Custom('signature_weapon')] ของ[duel_winner.GetHerHis],"
 rivalry.1024.desc.end:0 "เป็นการบ่งบอกถึงจุดสิ้นสุดของการประลองอย่างชัดเจน ความพ่ายแพ้อันน่าอับอายของข้า ทำให้ข้ารู้สึกอัปยศและละอายใจ!"
 rivalry.1024.desc.death:0 "ทำให้ข้าทรุดลงและล้มลงกับพื้น"
 rivalry.1024.a:0 "ข้าต้องเดินกะเผลกกลับบ้านอย่างอัปยศ"

 rivalry.1025.t:0 "การแสดงอันน่าละอาย"
 rivalry.1025.desc:1 "ไอ้ขี้ขลาด [from_rival.GetTitledFirstName] นั่นปฏิเสธที่จะประลองกับข้า ทั้งๆ ที่ดูถูกข้าต่อหน้า! ข้าคิดไม่ออกว่าจะมีอะไรน่าละอายไปกว่าการไร้ความเคารพ เช่นนี้โดยไม่มีความกล้าที่จะรับผิดชอบ ข้ารู้อยู่เสมอว่า[rival.GetSheHe]ไร้เกียรติ และนี่คือข้อพิสูจน์!"
 rivalry.1025.a:0 "อย่างน้อยข้าก็ยังรักษาเกียรติของข้าไว้ได้"

 rivalry.1030.t:0 "การแทรกแซงชีวิตสมรส"
 rivalry.1030.desc.happy:0 "มัน ทำให้ข้ารำคาญใจที่คู่ปรับของข้า [rival.GetTitledFirstName] ดูเหมือนจะมีความสุขกับชีวิตสมรสอันแสนสุขกับ [rival_spouse.GetWifeHusband] ของ[rival.GetHerHis] [rival_spouse.GetTitledFirstName] ข้าสามารถสร้างความเครียดและความกังวลให้[rival.GetHerHim]ได้อย่างมากโดยการหว่านความสงสัยระหว่างทั้งสอง ทำให้พวกเขาไม่ไว้วางใจ ซึ่งกันและกัน"
 rivalry.1030.desc.neutral:0 "ชีวิตสมรสที่ไร้รักระหว่างคู่ปรับของข้า [rival.GetTitledFirstName] และ [rival_spouse.GetWifeHusband] ของ[rival.GetHerHis] [rival_spouse.GetTitledFirstName] เปิดโอกาสอันเย้ายวนให้ข้า หากข้าสามารถหว่านความสงสัยและความไม่ไว้วางใจระหว่างทั้งสองได้ [rival.GetFirstName] ก็จะว้าวุ่นใจกับชีวิตสมรสที่กำลังพังทลายของ[rival.GetHerHis]จน[rival.GetSheHe]ไม่สามารถเข้ามาแทรกแซงแผนการของข้าได้!"
 rivalry.1030.desc.unhappy:0 "ไม่ใช่เรื่องแปลกที่คู่ปรับของข้า [rival.GetTitledFirstName] และ [rival_spouse.GetWifeHusband] ของ[rival.GetHerHis] [rival_spouse.GetTitledFirstName] จะทะเลาะกันอย่างรุนแรง ข้าสามารถยุยงให้เกิดการทะเลาะกันอีกครั้งระหว่างพวกเขาด้วยจดหมายที่วางไว้อย่างระมัดระวัง ทำให้ [rival.GetFirstName] ไขว้เขวและ ทำให้[rival.GetHerHim]แทรกแซงแผนการของข้าได้ยากขึ้น..."
 rivalry.1030.a:0 "ข้าจะวางจดหมายถึง [rival_spouse.GetTitledFirstNameNoTooltip] จากชู้รักลับ"
 rivalry.1030.a.tt:1 "[rival.GetTitledFirstName] จะค้นพบหลักฐานที่บ่งชี้ความผิด... แต่[rival.GetSheHe]จะเชื่อหรือไม่?"
 rivalry.1030.b:0 "ข้าอยากจะใส่ร้าย [rival.GetTitledFirstNameNoTooltip] แทนมากกว่า"
 rivalry.1030.b.tt:1 "[rival_spouse.GetTitledFirstName] จะค้นพบหลักฐานที่บ่งชี้ความผิด... แต่[rival_spouse.GetSheHe]จะเชื่อหรือไม่?"
 rivalry.1030.c:0 "การแทรกแซงชีวิตคู่ของผู้อื่นมันเกินไปแล้ว!"
 rivalry.1030.c.tt:1 "ละทิ้งเส้นทางนี้ไปก่อน"
 rivalry.1030.a_success:0 "การใส่ร้ายสำเร็จ"
 rivalry.1030.a_failure:0 "แผนการล้มเหลว"

 rivalry.1031.t:0 "หลักฐานการนอกใจ?"
 rivalry.1031.desc:0 "วันนี้ข้าพบจดหมายจ่าหน้าถึง [my_spouse.GetWifeHusband] ของข้า [my_spouse.GetFirstName] เขียนด้วยลายมือของชู้รัก ซึ่งให้รายละเอียดเกี่ยวกับการผจญภัยอันเร่าร้อนครั้งล่าสุดของพวกเขาด้วยกัน และอ้อนวอนอยากรู้ว่าพวกเขาจะพบกันอีกเมื่อใด!"
 rivalry.1031.desc.fooled:0 "\n\nผู้เขียนจดหมายไม่ได้ระบุตัวตน และจิตใจของข้าก็เต็มไปด้วยการคาดเดาว่า [my_spouse.GetWifeHusband] ของข้าอาจกำลังมีชู้กับใคร!"
 rivalry.1031.desc.suspicious:0 "\n\nตอนแรกข้าเสียใจ แต่เมื่อข้าอ่านอย่างละเอียดขึ้น ข้าสังเกตเห็นว่าจดหมายนั้นธรรมดามาก ขาดรายละเอียดส่วนตัวใดๆ และไม่สามารถระบุตัวผู้เขียนได้ ใครๆ ก็เขียนได้..."
 rivalry.1031.a.fooled:0 "ข้าต้องค้นหาให้ได้ว่าชู้รักลึกลับของ[my_spouse.GetHersHis]คือใคร!"
 rivalry.1031.a.suspicious:0 "สืบสวนอย่างเงียบๆ เพื่อดูว่าเกิดอะไรขึ้น"
 rivalry.1031.b.fooled:0 "ข้าจะเผชิญหน้ากับ [my_spouse.GetFirstNameNoTooltip] โดยตรงเกี่ยวกับจดหมาย!"
 rivalry.1031.b.suspicious:0 "ข้าจะเผชิญหน้ากับ [my_spouse.GetFirstNameNoTooltip] โดยตรงและเรียนรู้ความจริง!"
 rivalry.1031.b.tt:1 "ข้าจะถาม [my_spouse.GetTitledFirstName] ว่า[my_spouse.GetSheHe]นอกใจหรือไม่"
 rivalry.1031.c:0 "ข้าเชื่อใจ [my_spouse.GetTitledFirstNameNoTooltip] จดหมายนี้ต้องเป็นของปลอม!"
 rivalry.1031.c.tt:1 "ข้าทิ้งจดหมายไป"

 rivalry.1032.t:0 "ข้อกล่าวหาเรื่องการนอกใจ"
 rivalry.1032.desc:0 "[suspicious_spouse.GetWifeHusband] ของข้า [suspicious_spouse.GetFirstName] เข้ามาหาข้าวันนี้พร้อมจดหมายในมือ ซึ่ง[suspicious_spouse.GetSheHe]บอกว่าเขียนโดยชู้รักลับของข้า! ตอนนี้[suspicious_spouse.GetSheHe]กำลังกล่าวหาว่าข้ามีชู้!"
 rivalry.1032.a:0 "ข้าไม่ได้นอกใจท่าน ข้าสาบาน!"
 rivalry.1032.a.tt:1 "ข้าพยายามโน้มน้าว [suspicious_spouse.GetFirstNameNoTooltip] ว่าข้าซื่อสัตย์"
 rivalry.1032.b:0 "ข้าต้องสารภาพเรื่องชู้สาวกับ [spouse_lover.GetTitledFirstNameNoTooltip]!"

 rivalry.1033.t:0 "การปฏิเสธการกระทำผิด"
 rivalry.1033.desc:0 "ข้าเผชิญหน้ากับ [my_spouse.GetFirstName] เกี่ยวกับจดหมายจากชู้รักลับของ[my_spouse.GetHerHis]ในวันนี้ แต่[my_spouse.GetSheHe]ดูตกใจและเจ็บปวดกับข้อกล่าวหา และยืนกรานความบริสุทธิ์ของ[my_spouse.GetHerHis]!"
 rivalry.1033.a:0 "ข้าเชื่อใจ [my_spouse.GetFirstNameNoTooltip] และเชื่อสิ่งที่[my_spouse.GetSheHe]พูด!"
 rivalry.1033.a.tt:1 "ข้ายุติการสืบสวนนี้"
 rivalry.1033.b:0 "โกหก! ข้าจะสืบสวนต่อไปและค้นหาความจริง!"

 rivalry.1034.t:0 "คำสารภาพทั้งน้ำตา"
 rivalry.1034.desc:0 "เมื่อข้าเผชิญหน้ากับ [my_spouse.GetFirstName] เกี่ยวกับจดหมายจากชู้รักลับของ[my_spouse.GetHerHis] [my_spouse.GetSheHe] ก็เสียใจและสารภาพทั้งน้ำตาว่ามีชู้กับ [spouse_lover.GetTitledFirstName]!"
 rivalry.1034.a:0 "[my_spouse.GetSheHe] ทำ เช่นนี้กับข้าได้อย่างไร?"

 rivalry.1035.t:0 "พบการปลอมแปลง!"
 rivalry.1035.desc:0 "หลังจากการสืบสวนแหล่งที่มาของจดหมายจากชู้รักที่ถูกกล่าวหาของ [my_spouse.GetFirstName], ข้าได้ค้นพบว่ามันเป็นของปลอมที่ถูกวางไว้โดยไม่ใช่ใครอื่นนอกจาก [instigator.GetTitledFirstName] เจ้า[instigator.Custom2('InsultAdjective', ROOT.Char)] [instigator.Custom2('InsultNoun', ROOT.Char)] นั่นเอง!"
 rivalry.1035.a:0 "[instigator.GetSheHe|U] จะต้องชดใช้สำหรับการแทรกแซงชีวิตสมรสของข้า!"

 rivalry.1036.t:0 "ทางตัน"
 rivalry.1036.desc:0 "ข้าได้ติดตามทุกเบาะแสที่ข้าหาได้เพื่อตามหาว่าใครคือชู้รักลับที่ถูกกล่าวหาว่าส่งจดหมายฉบับนั้นให้ [rival_spouse.GetFirstName] แต่ข้าไม่สามารถระบุต้นกำเนิดของจดหมายได้"
 rivalry.1036.a:0 "ข้าจะจับตาดู [rival_spouse.GetFirstNameNoTooltip] ต่อไป ไม่ว่า อย่างไรก็ตาม..."
 rivalry.1036.b:0 "ข้าต้องสรุปว่าจดหมายเป็นของปลอม!"

 rivalry.1037.t:0 "แทรกแซงชีวิตสมรส"
 rivalry.1037.desc:0 "สายลับของข้าแจ้งว่ามีความตึงเครียดใหม่เกิดขึ้นระหว่าง [rival.GetTitledFirstName] และ [rival_spouse.GetWifeHusband] ของ[rival.GetHerHis] [rival_spouse.GetFirstName] จริงๆ ดูเหมือนว่ากลอุบายของข้าในการหว่านความไม่ไว้วางใจระหว่างพวกเขาประสบความสำเร็จ!"
 rivalry.1037.a:0 "ความขัดแย้งของพวกเขาช่างไพเราะราวเสียงดนตรีในหูข้า!"

 rivalry.1038.t:0 "แทรกแซงชีวิตสมรส"
 rivalry.1038.desc:0 "สายลับของข้าแจ้งว่า [rival.GetTitledFirstName] ได้ตัดสินแล้วว่าจดหมายที่ข้าปลอมขึ้นเพื่อหว่านความไม่ไว้วางใจระหว่าง[rival.GetHerHim]และ [rival_spouse.GetWifeHusband] ของ[rival.GetHerHis] [rival_spouse.GetFirstName] เป็นของปลอม และไม่หลงกลอุบายของข้า!"
 rivalry.1038.a:0 "ข้าคงต้องลองอย่างอื่น..."

 rivalry.1039.t:0 "$rivalry.1037.t$"
 rivalry.1039.desc:0 "สายลับของข้าแจ้งว่า [my_spouse.GetTitledFirstName] เห็นได้ชัดว่ามีชู้มาตลอด และจดหมายปลอมของข้า ทำให้[my_spouse.GetHerHim]เสียใจและสารภาพกับ [suspicious_spouse.GetTitledFirstName]!"
 rivalry.1039.a:0 "เอาล่ะสิ... นั่น #EMP น่าสนใจ#! ทีเดียว"

 rivalry.2001.t:0 "อุปสรรคต่อมิตรภาพ"
 rivalry.2001.desc:2 "ข้าได้รับจดหมายจาก [target_in_question.GetTitledFirstName] ถามว่าข้าคิดอย่างไรกับ [rival.GetTitledFirstName] ดูเหมือนว่า [ROOT.GetCharacter.Custom2('RelationToMe' , SCOPE.sC('rival') )] กำลังพยายามผูกมิตรทางการทูตกับ[target_in_question.GetHerHim]"
 rivalry.2001.a:0 "หึ, [target_in_question.GetFirstNameNoTooltip] ต้องถามด้วยหรือ?"
 rivalry.2001.b:0 "[target_in_question.GetFirstNameNoTooltip] ควรตัดสินใจด้วยตัว[target_in_question.GetHerHis] เอง"

 rivalry.2002.t:0 "อุปสรรคต่อมิตรภาพ"
 rivalry.2002.desc:0 "ข้าพยายามอย่างหนักเพื่อสร้างความประทับใจที่ดีให้แก่ [target_in_question.GetTitledFirstName] และข้าค้นพบอะไร?\n\nไม่ใช่ใครอื่นนอกจาก [first_rival.GetTitledFirstName] ที่ปล่อยข่าวลือชั่วร้ายเกี่ยวกับข้าเพื่อทำลายความพยายามของข้า!"
 rivalry.2002.a:0 "[target_in_question.GetFirstNameNoTooltip] เชื่อสิ่งที่ [first_rival.GetFirstNameNoTooltip] บอก[target_in_question.GetHerHim] จริงๆ หรือ?"

 rivalry.3001.t:0 "จากร้ายกลายเป็นร้ายกว่า"
 rivalry.3001.desc.opening:0 "ราวกับว่ายังไม่พอที่[rival.GetSheHe]ยอมรับความชั่วร้ายที่สุดของมนุษยชาติ [rival.GetTitledFirstName] ตอนนี้ยังมาดูถูกข้าต่อหน้าอีก!\n\n"
 rivalry.3001.malicious:0 "[rival.GetSheHe|U] ส่งผู้ส่งสารมา, จงใจให้ทั้ง[ROOT.Char.Custom('GetCourt')] ได้ยินคำพูดอันเลวร้ายที่นำมาส่ง "ถึง [ROOT.Char.GetTitledFirstName] [ROOT.Char.Custom2('InsultAdjective', SCOPE.sC('rival'))]" มันเริ่มต้น เช่นนั้น, และมี แต่แย่ลงเรื่อยๆ [rival.GetWomanMan] [rival.Custom2('InsultAdjective', ROOT.Char)] ผู้นั้นช่างกล้านัก!"
 rivalry.3001.benevolent:0 "[rival.GetSheHe|U] ส่งจดหมายมา, ขอสร้างสัมพันธ์ที่ดีขึ้น แต่ในขณะเดียวกันก็เรียกข้าว่า "[ROOT.Char.GetTitledFirstName] [ROOT.Char.Custom2('InsultAdjective', SCOPE.sC('rival'))]" [rival.GetSheHe|U] เผยธาตุแท้ของ[rival.GetHerHis] ออกมาแล้ว!"
 rivalry.3001.dominant:1 "[rival.GetSheHe|U] ส่งผู้ส่งสารมา, เรียกข้าว่า "[ROOT.Char.GetTitledFirstName] [ROOT.Char.Custom2('InsultAdjective', SCOPE.sC('rival'))]", และแทบจะอ้อนวอนขอต่อสู้!"
 rivalry.3001.submissive:0 "ข้าพบจดหมายฉบับหนึ่งใน[ROOT.Char.Custom('GetChamber')] ส่วนตัวของข้า, ถูกลอบนำเข้ามาในยามค่ำคืน "ถึง [ROOT.Char.GetTitledFirstName] [ROOT.Char.Custom2('InsultAdjective', SCOPE.sC('rival'))]" มันเริ่มต้น เช่นนั้น, และมี แต่แย่ลงเรื่อยๆ [rival.GetWomanMan] [rival.Custom2('InsultAdjective', ROOT.Char)] ผู้นั้นถึงกับกล้าลงชื่อของ[rival.GetHerHis] ไว้!"
 rivalry.3001.extroverted:1 "ผู้ส่งสารของ[rival.GetHerHis|U] ก้าวออกมาขณะที่ข้ากำลังปราศรัยกับ[ROOT.Char.Custom('GetCourt')] ของข้า, ทักทายข้าว่า "[ROOT.Char.GetTitledFirstName] [ROOT.Char.Custom2('InsultAdjective', SCOPE.sC('rival'))]", ก่อนจะเหยียบย่ำชื่อเสียงของข้าต่อหน้าทุกคน!"
 rivalry.3001.emotional:1 "[rival.GetSheHe|U] ส่งผู้ส่งสารมากล่าวหาข้าว่า "ทำลายชีวิตทั้งชีวิตของ[rival.GetFirstNamePossessiveNoTooltip]", เรียกข้าว่า "[ROOT.Char.GetTitledFirstName] [ROOT.Char.Custom2('InsultAdjective', SCOPE.sC('rival'))]", แล้วก็เริ่มโวยวาย"
 rivalry.3001.levelheaded:1 "[rival.GetSheHe|U] ส่งผู้ส่งสารที่รอคอยเวลาของ[rival.GetHerHis], รอโอกาสที่สมบูรณ์แบบที่จะเรียกข้าว่า "[ROOT.Char.GetTitledFirstName] [ROOT.Char.Custom2('InsultAdjective', SCOPE.sC('rival'))]" ราวกับเป็นอุบัติเหตุ, แล้ว[rival.GetSheHe] ก็แสร้งทำเป็นว่าทั้งหมดนั้นเป็นเรื่องผิดพลาด"
 rivalry.3001.desc.fallback:1 "[rival.GetSheHe|U] ส่งผู้ส่งสารมาเรียกข้าว่า "[ROOT.Char.GetTitledFirstName] [ROOT.Char.Custom2('InsultAdjective', SCOPE.sC('rival'))]" ต่อหน้าทุกคน!"
 rivalry.3001.desc.end:0 "\n\nเรื่องนี้ยอมไม่ได้ ข้าจะ ทำให้แน่ใจว่า[rival.GetSheHe]ต้องชดใช้สำหรับความโอหังของ[rival.GetHerHis]"
 rivalry.3001.a:0 "คอยดูเถอะ [rival.GetTitledFirstNameNoTooltip]!"

 rivalry.3002.t:0 "ศัตรูของสหายข้า"
 rivalry.3002.desc:0 "[friend.GetTitledFirstName] [ROOT.GetCharacter.Custom2('RelationToMe' , SCOPE.sC('friend') )] ของข้า กำลังประสบกับความรำคาญใจเมื่อเร็วๆ นี้ [rival.GetTitledFirstName] ได้เลือก[friend.GetHerHim]เป็นเป้าหมายสำหรับแผนการอันชั่วร้ายทั้งหมดของ[rival.GetHerHis]\n\nข้าจะเป็นใครหากปล่อยให้การปฏิบัติต่อสหายของข้า เช่นนี้ดำเนินต่อไป?"
 rivalry.3002.a:0 "ข้าขอประณามเจ้า [rival.GetTitledFirstNameNoTooltip]!"
 rivalry.3002.b:0 "[rival.GetTitledFirstNameNoTooltip] ไม่จำเป็นต้องรู้ว่าข้ารู้สึกอย่างไร"

 rivalry.3003.t:0 "เหล่าหนูรวมตัว"
 rivalry.3003.desc:2 "ดูเหมือนว่า [first_friend.GetTitledFirstName] จะประณามข้า, โดยอ้างถึงความเป็นศัตรูของข้ากับ [friend.GetTitledFirstName] [first_friend.Custom2('InsultAdjective', ROOT.Char)] ผู้เป็น[first_friend.Custom2('RelationToMe', SCOPE.sC('friend') )] ของ[first_friend.GetHerHis]\n\nดูเหมือนศัตรูของข้าจะเพิ่มจำนวนขึ้น..."
 rivalry.3003.a:0 "บาห์! ฝูงแกะชัดๆ"

 rivalry.3004.t:0 "บุคคลที่เลวร้ายที่สุดเท่าที่จะเป็นไปได้"
 rivalry.3004.opening:0 "แม้ว่าข้าจะไม่ได้เกลียด [rival.GetTitledFirstName] อย่างรุนแรงอยู่แล้ว ข้าก็รู้ว่าเราไม่มีวันเข้ากันได้!"
 rivalry.3004.fallback:0 "\n\n[rival.GetSheHe|U] ดูเหมือนจะประพฤติตนตรงกันข้ามกับที่ข้าจะทำในทุกสถานการณ์!"
 rivalry.3004.a:0 "[rival.GetSheHe] ทำ เช่นนั้นเพียงเพื่อจะแกล้งข้าหรือ?!"

 
