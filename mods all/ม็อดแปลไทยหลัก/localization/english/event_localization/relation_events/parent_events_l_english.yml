l_english: 
 parent_meddling_tt:0 "พระ[parent.Custom('มารดาบิดา')]ของข้าคาดหวังที่จะมีส่วนร่วมในการตัดสินใจของข้า"
 parent_meddling_decrease_tt:0 "พระ[parent.Custom('มารดาบิดา')]ของข้าพอพระทัยที่ข้าปฏิบัติตามคำแนะนำ[parent.GetHerHis]"
 parent.1001.t:0 "คำแนะนำเยี่ยงพระ[parent.Custom('มารดาบิดา')]"
 parent.1001.desc:1 "[parent.Custom('MotherFather')] ของข้ามีเรื่องจะพูดมากมายเกี่ยวกับ $knight_culture_player_plural_no_tooltip_lowercase$ ของ [ROOT.Char.Custom('GetCourt')] ของข้า แสดงความคิดเห็นเกี่ยวกับทุกสิ่งตั้งแต่การฝึกฝน ไปจนถึงสิ่งที่พวกเขาควรเตรียมพร้อมในสนามรบ\n\nแม้ แต่ $knight_culture_player_plural_no_tooltip$ ก็ยอมรับว่าสิ่งที่ [parent.GetSheHe] พูดนั้นสมเหตุสมผลมาก เช่นกัน"
 parent.1001.a:1 ""แล้วเหล่า $knight_culture_player_plural_no_tooltip_lowercase$ #EMP ควร#! จัดระเบียบอย่างไรเล่า พระ[parent.Custom('มารดาบิดา')]?""
 parent.1001.b:0 "ข้า แต่เพียงผู้เดียวที่จะตัดสินใจว่าพวกเขาจะต่อสู้อย่างไร!"
 
 parent.1002.desc:0 "พระ[parent.Custom('มารดาบิดา')]ของข้าเป็น[parent.GetWomanMan]ผู้ทรงปัญญา เข้าใจความต้องการและความปรารถนาของผู้คนอย่างลึกซึ้ง\n\n[parent.GetSheHe|U]มักจะประทานคำแนะนำแก่ข้าเมื่อต้องรับมือกับผู้อื่น"
 parent.1002.a:0 "ตามจริงแล้ว ข้าต้องการคำแนะนำทั้งหมดที่ข้าจะหาได้"
 parent.1002.b:0 ""นี่คือราชสำนัก[ROOT.Char.Custom('GetCourt')] #EMP ของข้า#! ไม่ใช่ของท่าน พระ[parent.Custom('มารดาบิดา')]""
 
 parent.1003.desc:0 "พระ[parent.Custom('มารดาบิดา')]ของข้ามักใช้เวลาหลายชั่วโมงชี้ให้เห็นรายละเอียดเล็กน้อยที่ข้ามองข้ามในราชสำนัก[ROOT.Char.Custom('GetCourt')]ของข้า\n\nคนรับใช้สองคนที่เคยทะเลาะกัน บัดนี้กลับมานินทากัน ทหารยามดูเงียบกว่าปกติ กระถางไฟถูกย้ายไปอีกด้านหนึ่งของพระตำหนัก[ROOT.Char.Custom('ResidenceBuilding')]..."
 parent.1003.a:0 "รู้ไว้ดีกว่าต้องมาเสียใจทีหลังที่ไม่รู้"
 parent.1003.b:0 ""ข้าจะไม่ให้ท่านมาเติมเชื้อไฟความกังวลของข้า พระ[parent.Custom('มารดาบิดา')]""

 parent.1004.desc:0 "บางครั้งข้าคิดว่าพระ[parent.Custom('มารดาบิดา')]ของข้าทรงทราบภาพรวมของคลังสมบัติของข้าดียิ่งกว่าเสนาบดีคลังเสียอีก ดูเหมือนเหรียญทองคำจะมีค่าเป็นสองเท่าเมื่อ[parent.GetSheHe]ตรัสบอกข้าว่าควรใช้จ่ายอย่างไร!"
 parent.1004.a:0 ""โปรดชี้แนะข้าสู่ทางเลือกอันรอบคอบด้วยเถิด พระ[parent.Custom('มารดาบิดา')]""
 parent.1004.b:0 "อาณาจักรของข้า คลังสมบัติของข้า!"
 
 parent.1005.desc:0 "มีบุรุษและสตรีผู้ทรงปัญญามากมายประดับราชสำนัก[ROOT.Char.Custom('GetCourt')]ของข้า แต่ข้าสงสัยว่าจะมีผู้ใดสักคนเอาชนะพระ[parent.Custom('มารดาบิดา')]ของข้าในการโต้วาทีได้ [parent.GetSheHe|U]ทรงมีมุมมองที่น่าประหลาดใจหรือความรู้อีกชั้นหนึ่งมาเปิดเผยเสมอ!"
 parent.1005.a:0 ""โปรดแบ่งปันปัญญาของท่านแก่ข้าด้วยเถิด พระ[parent.Custom('มารดาบิดา')]!""
 parent.1005.b:0 "ถ้อยคำนั้นน่าตื่นตา แต่จะทรงปัญญาทั้งหมดจริงหรือ?"

 parent.1006.t:0 "หัตถ์นำทาง"
 parent.1006.desc:0 "พระ[parent.Custom('มารดาบิดา')]ของข้าทรงสนพระทัยอย่างยิ่งในความเป็นไปใน[county.GetNameNoTier]ช่วงหลังนี้\n\n[parent.GetSheHe|U]ถึงกับทรงเริ่มติดต่อกับเหล่าบารอนและนายกเทศมนตรี สั่งสอนพวกเขาในเรื่องการจัดการที่เหมาะสม!"
 parent.1006.a:0 "ทำได้ดีมาก พระ[parent.Custom('มารดาบิดา')]"
 
 parent.1007.t:0 "พระ[parent.Custom('มารดาบิดา')]ผู้ไกล่เกลี่ย"
 parent.1007.desc_opening:0 "[ROOT.Char.Custom2('RelationToMe', SCOPE.sC('courtier'))]ของข้า [courtier.GetTitledFirstName] ได้แสดงความรังเกียจ[courtier.GetHerHis]ที่มีต่อข้าอย่างชัดเจน\n\n"
 parent.1007.courtier_1:0 "ข้าจับ[courtier.GetHerHim]ได้คาหนังคาเขาขณะกำลังเล่าเรื่องความผิดพลาดที่ข้า#EMP ถูกกล่าวหา#!ว่าก่อขึ้นในงานที่ข้าไม่ได้เข้าร่วมด้วยซ้ำ!"
 parent.1007.courtier_2:0 "ข้าบังเอิญเจอ[courtier.GetHerHim]และผู้ติดตามอีกคนกำลังเดินอยู่ในพระตำหนัก[ROOT.Char.Custom('ResidenceBuilding')] ทันทีที่[courtier.GetTitledFirstNameNoTooltip]เห็นข้า [courtier.GetSheHe]ก็จงใจหยุดนินทา จนกระทั่งข้าเดินผ่านไป นี่ไม่ใช่ครั้งแรกที่มีการดูหมิ่น เช่นนี้!"
 parent.1007.desc_end:0 "\n\nด้วยทรงเป็นผู้ไกล่เกลี่ยเสมอมา พระ[parent.Custom('มารดาบิดา')]ของข้าจึงเสนอที่จะสะสางเรื่องระหว่างเรา"
 parent.1007.a:0 "ความช่วยเหลือของพระ[parent.Custom('มารดาบิดา')]เป็นที่ต้อนรับเสมอ"
 parent.1007.b:0 "ข้าจะควบคุมคนเหล่านี้ด้วยตนเอง!"

 parent.1009.t:0 "ความสัมพันธ์ใหม่"
 parent.1009.desc:0 "คนรู้จักเก่าคนหนึ่งของพระ[parent.Custom('มารดาบิดา')]ของข้า [new_courtier.GetTitledFirstName] ได้มาถึงราชสำนัก[ROOT.Char.Custom('GetCourt')]ของข้า ตามคำเชิญ[parent.GetHerHis]\n\nพระ[parent.Custom('มารดาบิดา')]ของข้าทรงบอกใบ้ไม่หยุดหย่อนถึงอิทธิพลที่ดีที่ [new_courtier.GetFirstNameNoTooltip] สามารถส่งผลได้หาก[new_courtier.GetSheHe]ได้รับตำแหน่งบางอย่าง..."
 parent.1009.a:0 "ข้ามั่นใจว่าเราสามารถหาบางสิ่งให้[new_courtier.GetHerHim]ทำได้"
 parent.1009.b:0 "ไม่ [new_courtier.GetSheHe]จะไม่มีที่พำนักที่นี่"

 parent.1010.t:0 "ผ่อนคลายความสัมพันธ์"
 parent.1010.desc:0 "ช่วงหลังนี้ภาระของข้าในฐานะ[ROOT.Char.GetTitleAsNameNoTooltip]หนักหน่วงกว่าปกติ และดูเหมือนพระ[parent.Custom('มารดาบิดา')]ของข้าจะทรงสังเกตเห็น\n\n[parent.GetSheHe|U]ทรงยืนกรานให้ข้าหยุดพักสักวัน รับรองกับข้าว่า[parent.GetSheHe]จะจัดการความรับผิดชอบของข้าในระหว่างนั้น"
 parent.1010.a:0 "การพักผ่อนคือสิ่งที่ข้าต้องการอย่างแท้จริง"
 parent.1010.b:0 "นี่ไม่ใช่เวลาที่จะพักผ่อน!"

 parent.2002.t:0 "การศึกษาที่ดี"
 parent.2002.desc:0 "หลังจากไม่เห็น [child.GetTitledFirstName] มาหลายวัน ในไม่ช้าข้าก็ค้นพบว่าพระ[parent.Custom('มารดาบิดา')]ผู้ก้าวก่ายของข้ารู้แน่ชัดว่า[child.GetSheHe]อยู่ที่ไหน:\n"ข้าเพียงส่ง[child.GetHerHim]ไป เพราะห่วงใยการศึกษา[child.GetHerHis] สิ่งต่างๆ จะดีขึ้นมากสำหรับ[child.GetHerHim]ในการดูแลของ[new_guardian.GetTitledFirstNamePossessive]""
 parent.2002.a:0 "ท่านส่งพระ[child.Custom('ธิดาโอรส')]ของข้าไป #EMP ที่ไหน#!?"
 child_sent_away_tt:0 "[child.GetTitledFirstName] จะได้รับการศึกษาจาก [new_guardian.GetTitledFirstName]"

 parent.2003.t:0 "พระ[parent.Custom('มารดาบิดา')]ผู้ใจแคบของข้า"
 parent.2003.desc:0 "ข้าคิดว่าความบาดหมางระหว่างพระ[parent.Custom('มารดาบิดา')]ของข้ากับ[ROOT.Char.Custom2('RelationToMe', SCOPE.sC('hated_courtier'))]ของข้า [hated_courtier.GetTitledFirstName] จะไม่มีวันสิ้นสุด\n\nเอาล่ะ บัดนี้มันจบลงแล้ว พระ[parent.Custom('มารดาบิดา')]ของข้าได้เนรเทศ [hated_courtier.GetFirstNameNoTooltip] ออกจาก[ROOT.Char.Custom('GetRealmOrDomicile')|l]ของข้า!"
 parent.2003.a:0 "กล้าดีอย่างไร[parent.GetSheHe]?! นี่คือ[ROOT.Char.Custom('GetRealmOrDomicile')|l] #EMP ของข้า#! "
 parent.2003.b:0 "ไปให้พ้นๆ เสียก็ดี"
 
 parent.2004.t:0 "ความรำคาญไม่สิ้นสุด"
 parent.2004.opening:0 "พระ[parent.Custom('มารดาบิดา')]ของข้า [parent.GetFirstName] ทรงติดตามข้าไปทุกหนแห่ง แสดงความคิดเห็น[parent.GetHerHis]เกี่ยวกับทุกสิ่งที่ข้าทำและพยายามเสนอแนะแนวทาง"
 parent.2004.malicious:0 "\n\n[parent.GetSheHe|U]เหน็บแนมข้าอย่างไร้ความปรานี อ้างว่าการปฏิบัติที่รุนแรงนั้นเป็นไปเพื่อประโยชน์ของข้าเอง ขณะที่ปฏิเสธรอยยิ้มที่ข้าเห็นบางครั้งปรากฏบนริมฝีปาก[parent.GetHerHis]"
 parent.2004.benevolent:0 "\n\n[parent.GetSheHe|U]สั่งสอนข้าถึงคุณธรรมแห่งความชอบธรรม บอกเป็นนัยว่าข้ายังมีอีกมากที่ต้องเรียนรู้ในเรื่องนี้"
 parent.2004.dominant:0 "\n\n[parent.GetSheHe|U]สั่งสอนข้าอยู่ตลอดเวลา ไม่เคยผ่อนปรนและไม่เคยปล่อยให้ข้าได้พักผ่อน"
 parent.2004.submissive:0 "\n\n[parent.GetSheHe|U]กลายเป็นเงาตามตัวข้าไปแล้ว ซ่อนเร้นความคิดเห็นทั้งหมด[parent.GetHerHis]ไว้ภายใต้หน้ากากของคำแนะนำและการบอกเป็นนัย"
 parent.2004.extroverted:0 "\n\n[parent.GetSheHe|U]ถึงกับทำ เช่นนั้นท่ามกลางเหล่าข้าราชบริพาร[ROOT.Char.Custom('GetCourtierPlural')|l]ของข้า [parent.GetSheHe|U]ผลักดันให้ข้าพูดคุยกับพวกเขา สร้างสถานการณ์ที่น่าอึดอัดสำหรับทุกคน!"
 parent.2004.introverted:0 "\n\n[parent.GetSheHe|U]เทศนาเกี่ยวกับคุณธรรมของความสันโดษ และพยายามแยกข้าออกจากเหล่าข้าราชบริพาร[ROOT.Char.Custom('GetCourtierPlural')|l]ของข้า!"
 parent.2004.emotional:0 "\n\n[parent.GetSheHe|U]มีแนวโน้มที่จะระเบิดอารมณ์ และ[parent.GetSheHe]ใช้ประโยชน์อย่างเต็มที่จากข้อเท็จจริงที่ว่าข้าจะรับฟังเพื่อหลีกเลี่ยงการสร้างเรื่อง"
 parent.2004.levelheaded:0 "\n\n[parent.GetSheHe|U]ต้องการโต้แย้งกับข้าในทุกเรื่อง อ้างว่าการรีบร้อนเข้าสู่สถานการณ์ใดๆ คือการสละข้อได้เปรียบทั้งหมด การสนทนาที่ยาวนานกำลังใช้เวลาและพลังงานมากเกินไป"
 parent.2004.fallback:0 "\n\n[parent.GetSheHe|U]รบกวนข้าไม่สิ้นสุดด้วยคำแนะนำ และราชสำนัก[ROOT.Char.Custom('GetCourt')|l]ก็เริ่มซุบซิบนินทาว่าใครกันแน่ที่เป็นผู้ตัดสินใจในพระตำหนัก[ROOT.Char.Custom('ResidenceBuilding')]!"
 parent.2004.end:0 "ข้ารู้ว่า[parent.GetSheHe]ทำไป เพราะความรัก แต่นี่มันเริ่มจะน่าขันแล้ว"
 parent.2004.a:0 "ข้าจะสั่งให้[parent.GetHerHim]หยุด!"
 parent.2004.b:0 "[parent.GetSheHe|U]น่ารำคาญ แต่ก็มีประโยชน์อย่างปฏิเสธไม่ได้..."
 parent.2004.b.message:0 "ข้าพอใจกับที่เป็นอยู่"

 parent.3001.t:0 "ภายใต้ปีกของข้า"
 parent.3001.desc:0 "ช่วงหลังนี้ข้าสังเกตเห็นว่าพระ[child.Custom('ธิดาโอรส')]ที่รักของข้า [child.GetTitledFirstName] ใช้เวลาอยู่กับพระ[parent.Custom('มารดาบิดา')]ของข้าเป็นอย่างมาก\n\nดูเหมือนว่า [parent.GetTitledFirstName] จะทรงสนพระทัยเป็นการส่วนตัวในชีวิตของ[child.GetFirstNamePossessiveNoTooltip] และตั้งพระทัยที่จะเป็นส่วนหนึ่งในชีวิตนั้นอย่างแข็งขัน"
 parent.3001.a:0 "พระ[parent.Custom('มารดาบิดา')]ของข้าทรงห่วงใยพระ[child.Custom('ธิดาโอรส')]ของข้าอย่างแท้จริง!"
 parent.3001.b:0 "ความสนพระทัยอย่างกะทันหัน[parent.GetHerHis]ในตัวพระ[child.Custom('ธิดาโอรส')]ของข้านั้นน่ากังวล..."
 parent.3001.c:0 "พระ[parent.Custom('มารดาบิดา')]เจ้าเล่ห์ของข้าจะหนีรอดไปไม่ได้!"
