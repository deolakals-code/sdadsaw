 spouse.3012.b:0 "ข้าจะไม่แสร้งทำเป็นช่วย [ROOT.Char.Custom2('RelationToMe' , SCOPE.sC('spouse') )] ของข้าเลย"
 spouse.3013.t:0 "ภัยคุกคาม?"
 spouse.3013.desc:1 "[initial_spouse.GetFirstName] [ROOT.Char.Custom2('RelationToMe' , SCOPE.sC('initial_spouse'))] ของข้า มาหาข้าด้วยสีหน้ากังวลในดวงตาของ[initial_spouse.GetHerHis] [initial_spouse.GetFirstName] ลดเสียงลง เล่าให้ข้าฟังถึงพฤติกรรมที่น่าสงสัยอย่างยิ่งที่[initial_spouse.GetSheHe]สังเกตเห็นจาก [agent.GetTitledFirstName] [initial_spouse.GetFirstName] กล่าวหา[agent.GetHerHim]โดยตรงว่าติดต่อประสานงานกับกองกำลังที่วางแผนร้าย!"
