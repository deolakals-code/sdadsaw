 spouse.3011.t:0 "ความเข้าใจผิดอันเลวร้าย"
 spouse.3011.bad:0 "ไม่ว่าข้าจะพยายามวาดภาพ [spouse.GetFirstName] ในแง่ร้ายเพียงใด [told_of_character.GetFirstName] ก็คิดว่าข้ากำลังยกย่อง[spouse.GetHerHim]! ตอนนี้พวกเขาดูเหมือนจะเข้ากันได้ดีกว่าที่เคย"
 spouse.3011.a:0 "ข้าทำอะไรลงไป?"
 spouse.3012.t:0 "ภัยคุกคาม..."
