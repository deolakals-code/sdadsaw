 spouse.3008.a:0 "ข้าไม่ควรแปลกใจเลยว่าสิ่งนั้น ทำให้ข้าพอใจมากเพียงใด"
 spouse.3009.t:0 "ความประหลาดใจในเชิงบวก"
 spouse.3009.bad:0 "\n\nข้าเคยนับถือ [spouse.GetFirstName] อย่างสูง และสิ่งที่[initial_spouse.GetSheHe]บอกข้า ทำให้ชัดเจนว่าข้าคิดถูก!"
 spouse.3009.a:0 "[spouse.GetWomanMan] ที่ควรค่าแก่ความเคารพของข้า"
 spouse.3010.t:0 "ความประหลาดใจในเชิงบวก"
 spouse.3010.bad:0 "\n\nข้าไม่จำเป็นต้องกังวล เพราะ [told_of_character.GetFirstName] บอกข้าในภายหลังว่า [initial_spouse.GetFirstName] ทำให้[told_of_character.GetHerHim]เห็นด้านต่างๆ ของข้าที่[told_of_character.GetSheHe]ไม่เคยชื่นชมอย่างเหมาะสมมาก่อน!"
