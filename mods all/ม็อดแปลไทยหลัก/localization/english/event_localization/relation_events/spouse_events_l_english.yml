 spouse.2003.exceptional:0 "\n\nพูดตามตรง ข้าไม่เคยตระหนักอย่างเต็มที่ว่า[spouse.GetSheHe]เป็น [spouse.GetWomanMan] ที่ยอดเยี่ยมเพียงใดมาก่อนหน้านี้!"
 spouse.2003.a:1 "ขอบคุณที่ ทำให้ข้าเห็น [initial_spouse.GetFirstNameNoTooltip]!"
