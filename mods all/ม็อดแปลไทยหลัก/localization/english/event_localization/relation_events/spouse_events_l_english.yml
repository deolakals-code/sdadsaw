l_english: 
 spouse.0001.t:0 "สิ่งที่เราแบ่งปัน"
 spouse.0001.desc:0 "เมื่อเราพูดคุยถึงชีวิต [ROOT.Char.Custom2('RelationToMe' , SCOPE.sC('spouse') )] ของข้าและข้ามักเห็นพ้องกัน ข้ารู้ดีว่า [spouse.GetFirstName] เข้าใจว่าข้ามองโลกอย่างไร"
 spouse.0001.a:0 "ข้าโชคดีที่ได้อยู่กับคนที่เข้าใจข้า"
 spouse.0002.t:0 "สิ่งที่เราแบ่งปัน"
 spouse.0002.desc:0 "วันก่อน [ROOT.Char.Custom2('RelationToMe' , SCOPE.sC('first_spouse'))] ของข้า [first_spouse.GetFirstName] กล่าวว่า[first_spouse.GetSheHe]รู้สึกว่าข้าเป็นหนึ่งในไม่กี่คนที่เข้าใจ[first_spouse.GetHerHim]อย่างแท้จริง\n\nข้ารู้แน่ชัดว่า[first_spouse.GetSheHe]หมายถึงอะไรเมื่อ[first_spouse.GetSheHe]พูด เช่นนั้น"
 spouse.0002.a:0 "เราผูกพันกันมากกว่าเพียงแค่การสมรส"
 spouse.0003.t:0 "สิ่งที่เราทำ"
 spouse.0003.desc:0 "บางครั้งข้าคิดว่าไม่มีใครที่ข้าอยากใช้เวลาด้วยมากไปกว่า [ROOT.Char.Custom2('RelationToMe' , SCOPE.sC('spouse') )] ของข้า [spouse.GetFirstName] ในบรรดาสิ่งต่างๆ ที่ต้องทำในชีวิตนี้ เราเพลิดเพลินกับสิ่งเดียวกันมากมาย"
 spouse.0003.a:0 "ชีวิตสามารถแบ่งปันได้หลายวิธี"
 spouse.0004.t:0 "สิ่งที่เราแบ่งปัน"
 spouse.0004.desc:0 "ในบรรดาผู้คนทั้งหมดใน [ROOT.Char.Custom('GetCourt')] ของข้าที่ [first_spouse.GetSheHe] สามารถใช้เวลา [first_spouse.GetHerHis] ร่วมด้วยได้ [ROOT.Char.Custom2('RelationToMe' , SCOPE.sC('spouse') )] ของข้า [first_spouse.GetFirstName] กลับใช้เวลาส่วนใหญ่เท่าที่ [first_spouse.GetSheHe] จะทำได้กับข้า\n\n[first_spouse.GetSheHe|U] เพลิดเพลินกับสิ่งที่เราทำร่วมกันจริงๆ!"
 spouse.0004.a:0 "ชีวิตสามารถแบ่งปันได้หลายวิธี"
 spouse.0005.t:0 "ความขัดแย้งในชีวิตสมรส"
 spouse.0005.desc:0 "ไม่ว่าข้าจะพยายามอธิบายกี่ครั้งว่าทำไมข้าถึงทำสิ่งที่ข้าทำ [ROOT.Char.Custom2('RelationToMe' , SCOPE.sC('spouse') )] ของข้าก็ไม่เคยเข้าใจข้าอย่างถ่องแท้\n\n[spouse.GetFirstName] และข้าดูเหมือนจะเป็นคนที่แตกต่างกันโดยสิ้นเชิง"
 spouse.0005.a:0 "เราอยู่ในสถานการณ์นี้ไม่ว่าเราจะต้องการหรือไม่ก็ตาม"
 spouse.0006.t:0 "ความขัดแย้งในชีวิตสมรส"
 spouse.0006.desc:0 "ข้าไม่เข้าใจ [ROOT.Char.Custom2('RelationToMe' , SCOPE.sC('from_spouse') )] ของข้า [from_spouse.GetFirstName] [from_spouse.GetSheHe|U] พยายามอธิบายว่าทำไม[from_spouse.GetSheHe]ถึงทำสิ่งที่[from_spouse.GetSheHe]ทำ แต่มันไม่สมเหตุสมผลสำหรับข้าเลย\n\nเราแตกต่างกันเกินไปหรือ?"
 spouse.0006.a:0 "[from_spouse.GetSheHe|U] ไม่ได้ ทำให้มันง่ายสำหรับข้าเลย"
 spouse.0007.t:0 "สหายของสหาย"
 spouse.0007.desc:1 "[friend_in_common.GetTitledFirstName] [ROOT.GetCharacter.Custom2('RelationToMe' , SCOPE.sC('friend_in_common') )] ของข้า ได้เล่าให้ข้าฟังว่า [ROOT.Char.Custom2('RelationToMe' , SCOPE.sC('spouse') )] ของข้า [spouse.GetFirstName] เป็นสหายที่ดีต่อ[friend_in_common.GetHerHim]เพียงใด การรู้ว่า [ROOT.Char.Custom2('RelationToMe' , SCOPE.sC('spouse') )] ของข้าปฏิบัติต่อผู้อื่นอย่างไร ทำให้ข้านับถือ[spouse.GetHerHim]มากยิ่งขึ้น"
 spouse.0007.a:0 "มัน ทำให้ข้ายิ้มได้"
 spouse.0008.t:0 "สหายของสหาย"
 spouse.0008.desc:1 "[first_spouse.GetFirstName] [ROOT.GetCharacter.Custom2('RelationToMe' , SCOPE.sC('first_spouse') )] ของข้า ส่งยิ้มอันอบอุ่นให้ข้ามากกว่าปกติ โดยกล่าวว่าการเห็นข้า ทำให้หัวใจของ[first_spouse.GetHerHis]อบอุ่น\n\nเห็นได้ชัดว่าสหายร่วมของเรา [friend_in_common.GetTitledFirstName] ได้เล่าให้[first_spouse.GetHerHim]ฟังว่าข้าเป็นสหายที่ดีเพียงใด!"
 spouse.0008.a:1 "ขอบคุณท่าน [friend_in_common.GetFirstNameNoTooltip]!"
 spouse.0008.b:1 "[ROOT.Char.Custom2('RelationToMeShort' , SCOPE.sC('first_spouse') )] ของข้าใช้เวลากับ[friend_in_common.GetHerHim]มากแค่ไหนกัน?"
 spouse.0009.t:0 "ความเป็นมิตรที่เผชิญกับความสงสัย"
 spouse.0009.desc:0 "แม้ว่าข้าจะแสดงความรักต่อ [spouse.GetFirstName] ข้ากลับได้รับการตอบสนองที่เย็นชาและน่าสงสัย เห็นได้ชัดว่าข้าใช้เวลากับสหายของเรา [friend_in_common.GetTitledFirstName] มากเกินไป"
 spouse.0009.a:0 "[spouse.GetSheHe] กล้าดีอย่างไร?"
 spouse.0009.has_lover_tooltip:1 "[spouse.GetFirstNameNoTooltip] ไม่มีทางรู้ได้ [spouse.GetSheHe] รู้ได้หรือ?"
 
 spouse.1001.t:0 "เวลาที่เราใช้ร่วมกัน"
 spouse.1001.desc:0 "ข้าอาจไม่ได้ผูกพันกับ [ROOT.Char.Custom2('RelationToMe' , SCOPE.sC('spouse') )] ของข้ามากนัก แต่ยิ่งข้าใช้เวลากับ [spouse.GetFirstName] มากเท่าไร ข้าก็ยิ่งเริ่มเข้าใจ[spouse.GetHerHim]มากขึ้นเท่านั้น"
 spouse.1001.a:0 "บางทีข้าอาจจะรัก[spouse.GetHerHim]ได้ในที่สุด เมื่อเวลาผ่านไป"
 spouse.1002.t:0 "เวลาที่เราใช้ร่วมกัน"
 spouse.1002.desc:0 "ขณะที่ [ROOT.Char.Custom2('RelationToMe' , SCOPE.sC('spouse') )] ของข้าและข้าใช้เวลาอยู่ด้วยกันมากขึ้น ข้าพบว่า[first_spouse.GetHerHim]เริ่มเปิดใจให้ข้า [first_spouse.GetFirstName] กล่าวว่า[first_spouse.GetSheHe]ยังคงเห็นด้านใหม่ๆ ของข้าอยู่เสมอ"
 spouse.1002.a:0 "บางที[first_spouse.GetSheHe]อาจจะรักข้าได้ในที่สุด เมื่อเวลาผ่านไป"
 spouse.1003.t:0 "เวลาที่เราใช้ร่วมกัน"
 spouse.1003.desc:0 "ข้าไม่ได้ผูกพันกับ [ROOT.Char.Custom2('RelationToMe' , SCOPE.sC('spouse') )] ของข้ามากนัก และยิ่งข้าใช้เวลากับ [spouse.GetFirstName] มากเท่าไร ข้าก็ยิ่งเริ่มเข้าใจว่าทำไมจึงเป็น เช่นนั้น ทุกสิ่งที่[spouse.GetSheHe]ทำล้วนกวนประสาทข้าเล็กน้อย"
 spouse.1003.a:0 "ข้าต้องใช้ชีวิตทั้งชีวิตกับคนผู้นี้"
 spouse.1004.t:0 "เวลาที่เราใช้ร่วมกัน"
 spouse.1004.desc:0 "ข้าคงไม่ได้คิดไปเอง [first_spouse.GetFirstName] [ROOT.GetCharacter.Custom2('RelationToMe' , SCOPE.sC('spouse') )|U] ดูเหมือนจะรำคาญมากขึ้นเรื่อยๆ ยิ่งเราใช้เวลาอยู่ด้วยกันนานขึ้น ถ้าข้าไม่รู้ดีกว่านี้ ข้าคงบอกว่าข้ากำลังกวนประสาท [ROOT.Char.Custom2('RelationToMe' , SCOPE.sC('spouse') )] ของข้า!"
 spouse.1004.a:0 "ให้เราใช้เวลาร่วมกันน้อยลงสักหน่อย สักพักหนึ่ง"
 spouse.2001.t:0 "ความสบายใจ"
 spouse.2001.opening:0 "ด้วยสิ่งต่างๆ มากมายที่ต้องทำและเวลาน้อยนิด ข้าไม่รู้ว่าจะรับมือได้อย่างไรหากไม่มี [ROOT.GetCharacter.Custom2('RelationToMe' , SCOPE.sC('spouse') )] ที่รักของข้า [spouse.GetFirstName]"
 spouse.2001.chaste:0 "\n\n[spouse.GetSheHe|U] ทำให้ข้ารู้ว่า[spouse.GetSheHe]อยู่เคียงข้างข้าทางจิตวิญญาณตลอดปัญหาทั้งปวงของข้า"
 spouse.2001.lustful:0 "\n\n[spouse.GetSheHe|U] ปลุกพลังข้าในค่ำคืนอันเร่าร้อน เตือนข้าถึงความปรารถนาที่ข้าต้องการเพื่อเอาชนะอุปสรรค"
 spouse.2001.temperate:0 "\n\n[spouse.GetSheHe|U] เตือนข้าว่าทุกสิ่งต้องทำอย่างพอประมาณ มิฉะนั้นข้าจะทำลายตนเอง"
 spouse.2001.gluttonous:0 "\n\n[spouse.GetSheHe|U] รู้ดีว่าเมื่อใดที่ข้าต้องการเบี่ยงเบนความสนใจด้วยอาหารและเครื่องดื่มอันน่ารื่นรมย์"
 spouse.2001.generous:0 "\n\n[spouse.GetSheHe|U] ให้[spouse.GetHerselfHimself]มากมายเพื่อสนับสนุนข้า"
 spouse.2001.greedy:0 "\n\n[spouse.GetSheHe|U] ดูเหมือนจะหาโอกาสใหม่ๆ ให้ข้าบรรลุเป้าหมายอยู่เสมอ"
 spouse.2001.diligent:0 "\n\nเมื่อทุกอย่างหนักหนาเกินไป [spouse.GetSheHe] ก็ช่วยข้า จับปากกาขนนกตามที่ต้องการ ไม่เคยบ่น"
 spouse.2001.lazy:0 "\n\n[spouse.GetSheHe|U] ทำให้แน่ใจว่าข้าได้พักผ่อนอย่างเหมาะสมเมื่อข้าต้องการ"
 spouse.2001.wrathful:0 "\n\n[spouse.GetSheHe|U] ปัดเรื่องไม่สำคัญในนามของข้า สาปแช่งผู้ส่งสารเหล่านั้นที่มาพร้อมจดหมายหยุมหยิม"
 spouse.2001.calm:0 "\n\n[spouse.GetSheHe|U] พิจารณาทุกสิ่งอย่างเท่าเทียม ช่วยข้าจัดการเรื่องทั้งหมดที่ไม่สำคัญเร่งด่วน"
 spouse.2001.impatient:0 "\n\n[spouse.GetSheHe|U] หาทางให้ข้าทำงานเสร็จเร็วขึ้นเสมอ และไปถึงจุดสิ้นสุดของวัน"
 spouse.2001.patient:0 "\n\n[spouse.GetSheHe|U] ทำให้แน่ใจว่าข้าใช้เวลากับทุกสิ่งที่ต้องทำ เตือนข้าว่าไม่ว่าจะใช้เวลานานแค่ไหน ข้าก็จะผ่านมันไปได้"
 spouse.2001.stubborn:0 "\n\n[spouse.GetSheHe|U] กระตุ้นข้า ทำให้แน่ใจว่าข้าจะไม่ยอมแพ้จนกว่างานจะเสร็จ"
 spouse.2001.fickle:0 "\n\n[spouse.GetSheHe|U] หาเรื่องใหม่ๆ ให้ข้าทำเสมอ เพื่อเบี่ยงเบนความคิดข้าออกจากสิ่งที่หนักอึ้งบนบ่า"
 spouse.2001.humble:0 "\n\n[spouse.GetSheHe|U] เตือนข้าว่างานของข้าคือหน้าที่ และสิ่งที่สำคัญที่สุดคือข้าต้อง ทำให้สำเร็จด้วยเกียรติ"
 spouse.2001.arrogant:0 "\n\n[spouse.GetSheHe|U] เตือนข้าว่าข้ากำลังทำสิ่งที่ข้าเลือก และไม่มีใครสามารถตัดสินข้าได้อย่างแท้จริงนอกจาก [ROOT.Char.GetFaith.HighGodName]"
 spouse.2001.deceitful:0 "\n\n[spouse.GetSheHe|U] อยู่ที่นั่นเสมอเพื่อบอกข้าว่าทุกอย่างจะเรียบร้อยดี"
 spouse.2001.honest:0 "\n\n[spouse.GetSheHe|U] บอกข้าเสมอว่าแม้จะมีอะไรต้องทำมากมาย [spouse.GetSheHe] ก็เชื่ออย่างแท้จริงว่าข้าทำได้"
 spouse.2001.craven:0 "\n\n[spouse.GetSheHe|U] ช่วยข้าหลีกเลี่ยงหน้าที่เหล่านั้นที่ข้าไม่อยากทำที่สุดเสมอ"
 spouse.2001.brave:0 "\n\n[spouse.GetSheHe|U] สนับสนุนให้ข้าเผชิญหน้ากับความท้าทายอย่างตรงไปตรงมา และไม่ปล่อยให้ความกดดัน ทำให้ข้าท้อถอย"
 spouse.2001.shy:0 "\n\n[spouse.GetSheHe|U] ช่วยข้าหลบซ่อนจากข้าราชการและผู้ส่งสารที่นำเรื่องมาให้ข้าพิจารณามากขึ้นเรื่อยๆ"
 spouse.2001.gregarious:0 "\n\nเมื่อมีเรื่องใหม่ๆ ถูกนำมาให้ข้าพิจารณา [spouse.GetSheHe] รู้วิธีพูดปัดป้องอย่างที่ไม่มีใครทำได้"
 spouse.2001.ambitious:0 "\n\n[spouse.GetSheHe|U] เตือนข้าว่าทำไมข้าถึงทำสิ่งที่ข้าทำ และรางวัลที่จะได้รับเมื่อผ่านพ้นไปคืออะไร"
 spouse.2001.content:0 "\n\n[spouse.GetSheHe|U] เตือนข้าว่าท้ายที่สุดแล้วมันไม่สำคัญมากนัก สิ่งต่างๆ จะดีเอง แม้ว่าหน้าที่บางอย่างของข้าจะยังไม่เสร็จ"
 spouse.2001.arbitrary:0 "\n\n[spouse.GetSheHe|U] ช่วยข้าโดยการเลือกหน้าที่ที่ข้าควร ทำให้เสร็จ และหน้าที่ใดที่ข้าสามารถละทิ้งได้"
 spouse.2001.just:0 "\n\n[spouse.GetSheHe|U] ทำให้ข้ามุ่งเน้นไปที่การให้ความพิจารณาและการตัดสินแก่ทุกเรื่องตามที่สมควรได้รับ"
 spouse.2001.cynical:0 "\n\n[spouse.GetSheHe|U] ส่งยิ้มปลอบใจให้ข้า และบอกข้าว่าในท้ายที่สุดแล้วไม่สำคัญว่าข้าจะทำอะไรเสร็จ สิ่งสำคัญคือข้าถูกมองว่ากำลังทำสิ่งต่างๆ"
 spouse.2001.zealous:0 "\n\nเมื่อใดก็ตามที่ทุกอย่างหนักหนาเกินไป [spouse.GetSheHe] ก็ช่วยข้าสวดภาวนา เพื่อให้ [ROOT.Char.GetFaith.HighGodName] ประทานพละกำลังที่ข้าต้องการ"
 spouse.2001.paranoid:0 "\n\n[spouse.GetSheHe|U] ชี้ให้ข้าเห็นว่าใครกำลังทำงานอย่างแข็งขันเพื่อสร้างปัญหาให้ข้า และใครที่ข้าควรจะ ทำให้ผิดหวังโดยสมัครใจ"
 spouse.2001.trusting:0 "\n\n[spouse.GetSheHe|U] ทำให้จิตใจข้ามุ่งไปที่ผู้ที่พึ่งพาข้าให้ทำหน้าที่ในฐานะเจ้าเหนือหัว และทุกคนต้องทำหน้าที่ของตนด้วยความสุจริตใจ"
 spouse.2001.compassionate:0 "\n\n[spouse.GetSheHe|U] ช่างใจดีและห่วงใย รับฟังความกังวลของข้าและแบ่งปันคำแนะนำและการสนับสนุนที่[spouse.GetSheHe]สามารถให้ได้"
 spouse.2001.callous:0 "\n\n[spouse.GetSheHe|U] ไม่มีความอดทนต่อ "พวกโง่เง่า" ที่ ทำให้ข้าเสียเวลา และ[spouse.GetSheHe]ก็ยินดีที่จะให้พวกเขาได้ยิน"
 spouse.2001.sadistic:0 "\n\nขณะที่ความทุกข์ของข้าเพิ่มมากขึ้น รอยยิ้มของ[spouse.GetHerHis]ก็กว้างขึ้นเรื่อยๆ เพื่อสนับสนุนข้า ขณะที่ข้าดิ้นรนฝ่าฟันความพยายามในหน้าที่ของข้า"
 spouse.2001.vengeful:0 "\n\n[spouse.GetSheHe|U] มีคำพูดที่รุนแรงสำหรับผู้ที่เรียกร้องจากข้ามากเกินไป และมันเป็นการปลดปล่อยอย่างยิ่งที่ได้ฟังคนอื่นสาปแช่งชื่อของพวกเขา"
 spouse.2001.forgiving:0 "\n\n[spouse.GetSheHe|U] แสดงความเข้าใจอย่างยิ่งต่อสถานการณ์ของข้า และแจ้งให้ข้าทราบว่าทันทีที่ช่วงเวลาที่ตึงเครียดเหล่านี้ผ่านไป การละเลยด้านอื่นๆ ในชีวิตของข้าจะได้รับการให้อภัย"
 spouse.2001.a:1 "ไม่มีใคร ทำให้ข้ายิ้มได้เหมือน [spouse.GetFirstNameNoTooltip] ที่รักของข้า"
 spouse.2002.t:0 "คำพูดดีๆ"
 spouse.2002.desc:0 "ระหว่างการเยี่ยมเยียน ดูเหมือนว่าข้าจะได้รับความสนใจจาก [told_of_character.GetFirstNamePossessive] แม้จะเป็นเพียงช่วงสั้นๆ นี่อาจเป็นโอกาสอันดีที่จะพูดถึง [ROOT.GetCharacter.Custom2('RelationToMe' , SCOPE.sC('spouse') )] ที่รักของข้า [spouse.GetFirstName] ในทางที่ดี"
