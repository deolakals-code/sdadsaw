 spouse.2009.bad:0 "\n\nข้าไม่แน่ใจว่านั่นเป็นความตั้งใจหรือไม่ แต่การฟัง [initial_spouse.GetFirstName] ทำให้ข้าคิดว่าข้าให้เครดิต [spouse.GetFirstName] มากเกินไป"
 spouse.2009.a:1 "ขอบคุณที่ ทำให้ข้าเห็น [initial_spouse.GetFirstNameNoTooltip]..."
 spouse.2010.t:0 "การสนับสนุนของ [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('told_of_character'))] ของข้า"
 spouse.2010.desc:0 "\n\nไม่ว่า[initial_spouse.GetSheHe]จะพูดอะไร มันต้องทิ้งรสชาติที่ไม่ดีไว้กับ [told_of_character.GetFirstName] เมื่อออกเดินทาง [told_of_character.GetSheHe] เพียงแค่มองมาที่ข้า ส่ายศีรษะของ[told_of_character.GetHerHis]"
 spouse.2010.a:1 ""ข้าจะทำอย่างไรหากไม่มี [initial_spouse.GetFirstNameNoTooltip] ที่รักของข้า...""
 spouse.2011.t:0 "ตั้งใจฟัง"
 spouse.2011.desc:0 "ไม่ว่าข้าจะพยายามแก้ไขตัวเองมากแค่ไหน ทุกสิ่งที่ข้าพูดเกี่ยวกับ [ROOT.Char.Custom2('RelationToMe' , SCOPE.sC('spouse') )] ของข้ากลับกลายเป็นคำดูถูก แทนที่จะเป็นการยกย่อง! เมื่อออกเดินทาง [told_of_character.GetFirstName] เพียงแค่ส่ายศีรษะใส่ [spouse.GetFirstName]"
 spouse.2011.a:0 "ข้าทำอะไรลงไป?"
 spouse.2012.t:0 "ความลับในชีวิตสมรส"
 spouse.2012.secret_about_me:0 "มีบางสิ่งที่ข้ารู้สึกว่าไม่สามารถเก็บซ่อนจาก [ROOT.Char.Custom2('RelationToMe' , SCOPE.sC('spouse'))] ของข้าได้ ข้ารู้ว่า [spouse.GetFirstName] จะเข้าใจ"
 spouse.2012.secret_about_spouse:0 "มีบางสิ่งที่ข้ารู้เกี่ยวกับ [spouse.GetFirstName] [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('spouse'))] ของข้าไม่สามารถดำเนินชีวิตต่อไปในความไม่รู้ได้"
 spouse.2012.secret_about_other:0 "ข้ากำลังครุ่นคิดว่าจะแบ่งปันบางสิ่งกับ [ROOT.Char.Custom2('RelationToMe' , SCOPE.sC('spouse'))] ของข้าในครั้งต่อไปที่เราอยู่ตามลำพัง ห่างจากหูที่คอยฟังหรือไม่\n\nสิ่งที่ข้าได้เรียนรู้เกี่ยวกับ [owner_of_secret.GetTitledFirstName] จะเป็นที่สนใจอย่างยิ่งต่อ[spouse.GetHerHim]"
 spouse.2012.a:1 "ข้าจะแบ่งปันความลับนี้กับ [spouse.GetFirstNameNoTooltip]"
 spouse.2012.a.tt:0 "ความลับถูกเปิดเผยต่อ [spouse.GetTitledFirstName]"
 spouse.2012.b:0 "บางสิ่งควรปล่อยให้อยู่ในความมืดจะดีกว่า"
 spouse.2013.t:0 "ความลับในชีวิตสมรส"
 spouse.2013.opening:0 "[first_spouse.GetFirstName] [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('first_spouse'))] ของข้า พาข้าไปข้างๆ และมองข้าด้วยสีหน้าจริงจัง"
 spouse.2013.secret_about_me:0 "\n\n"ข้ามีความลับจะสารภาพ" [first_spouse.GetSheHe] กล่าว เมื่อ[first_spouse.GetSheHe]เอนตัวเข้ามาและกระซิบที่หูข้า ตาข้าเบิกกว้าง"
 spouse.2013.secret_about_spouse:0 "\n\n"มีบางสิ่งที่ท่านต้องรู้" [first_spouse.GetSheHe] กล่าว เมื่อ[first_spouse.GetSheHe]เอนตัวเข้ามาและกระซิบที่หูข้า ตาข้าเบิกกว้าง"
 spouse.2013.secret_about_other:0 "\n\n"ข้าต้องบอกอะไรบางอย่างกับท่าน" [first_spouse.GetSheHe] กล่าว "บางอย่างเกี่ยวกับ [owner_of_secret.GetTitledFirstName]" \nเมื่อ[first_spouse.GetSheHe]เอนตัวเข้ามาและกระซิบที่หูข้า ตาข้าเบิกกว้าง"
 spouse.2013.a:0 "จริงหรือ? ข้าไม่เคยรู้มาก่อนเลย!"
 spouse.2014.t:0 "ภัยคุกคาม?"
 spouse.2014.desc:0 "มีบางอย่างผิดปกติเกี่ยวกับท่าทีของ [agent.GetTitledFirstName] รอบๆ [ROOT.Char.Custom2('RelationToMe' , SCOPE.sC('spouse'))] ของข้า เมื่อ[agent.GetSheHe]คิดว่าไม่มีใครมอง ข้าเห็น[agent.GetHerHim]ชำเลืองมอง เดินเตร่ในโถงทางเดินที่ว่างเปล่า และให้ความสนใจอย่างใกล้ชิดกับการเคลื่อนไหวทุกอย่างของ [spouse.GetFirstNamePossessive]\n\nข้ากังวลว่า[agent.GetSheHe]ต้องกำลังวางแผนอะไรบางอย่าง"
 spouse.2014.a:0 "[ROOT.GetCharacter.Custom2('RelationToMe' , SCOPE.sC('spouse') )] ของข้าต้องได้รับการเตือน!"
 spouse.2014.reveal_tt:0 "[spouse.GetTitledFirstName] จะได้รับการเตือนว่า [agent.GetTitledFirstName] กำลังทำอะไรบางอย่าง"
 spouse.2014.b:0 "ข้าคงเข้าใจผิดไปเอง"
 spouse.2015.t:0 "ภัยคุกคาม?"
 spouse.2015.desc:0 "[first_spouse.GetFirstName] [ROOT.Char.Custom2('RelationToMe' , SCOPE.sC('first_spouse'))] ของข้า มาหาข้าด้วยสีหน้ากังวลในดวงตาของ[first_spouse.GetHerHis] [first_spouse.GetFirstName] ลดเสียงลง เล่าให้ข้าฟังถึงพฤติกรรมที่น่าสงสัยอย่างยิ่งที่[first_spouse.GetSheHe]สังเกตเห็นจาก [agent.GetTitledFirstName] [first_spouse.GetFirstName] กล่าวหา[agent.GetHerHim]โดยตรงว่าติดต่อประสานงานกับกองกำลังที่วางแผนร้าย!"
 spouse.2015.a:0 "ขอบคุณสำหรับคำเตือน [first_spouse.Custom2('RelationToMe' , SCOPE.sC('spouse'))] ที่รักของข้า!"
 spouse.2015.b:1 "ข้าเชื่อใจ [first_spouse.GetFirstNameNoTooltip] ในเรื่องนี้ได้จริงหรือ?"
 spouse.3001.t:0 "ความทุกข์ในชีวิตสมรส"
 spouse.3001.desc.opening:0 "ราวกับว่าข้ายังไม่มีปัญหามากพออยู่แล้ว ข้ายังต้องรับมือกับ [ROOT.Char.Custom2('RelationToMe' , SCOPE.sC('spouse') )] ของข้าอีก! "
 spouse.3001.desc.fallback:0 "มีสิ่งที่ข้าทำได้ไม่ดีพอเสมอ และมีคำบ่นใหม่ทุกวัน"
 spouse.3001.lazy:0 "[spouse.GetSheHe|U] ไม่เคยเต็มใจที่จะช่วยเหลือข้าเลย เมื่อข้ายุ่งที่สุด [spouse.GetSheHe] ก็จงใจงีบหลับและนินทา บ่อยครั้งต่อหน้าต่อตาข้า!"
 spouse.3001.wrathful:0 "ข้าขอสาบานต่อ [ROOT.Char.GetFaith.HighGodName] อารมณ์ของ[spouse.GetHerHis]กำลัง ทำให้ข้าเสียสติ การอาละวาด การทะเลาะวิวาท และความขุ่นเคืองที่ไม่สิ้นสุด... ความอดทนของข้าใกล้จะหมดลงแล้ว"
 spouse.3001.deceitful:0 "เมื่อเร็วๆ นี้ ข้าได้ค้นพบคำโกหกมากมาย ส่วนใหญ่เป็นเรื่องเล็กน้อยที่ไม่สำคัญ แต่ความสงสัยก็ครอบงำข้า [ROOT.Char.Custom2('RelationToMe' , SCOPE.sC('spouse') )] ของข้ากำลังซ่อนอะไรไว้อีก...?"
 spouse.3001.paranoid:0 "[spouse.GetFirstName] เอา แต่โทษข้าในสิ่งที่ข้าไม่เคยทำ และมันกำลังทดสอบความอดทนของข้า ข้าถูกล่อลวงให้ทำผิดตามข้อกล่าวหาครั้งต่อไปของ[spouse.GetHerHis]จริงๆ..."
 spouse.3001.impatient:0 "\n\nเป็นหน้าที่ของ[spouse.GetHerHis]ที่จะสนับสนุนข้าและเข้าใจ แต่[spouse.GetSheHe]กลับไม่มีความอดทน แม้ว่าข้าจะหายใจไม่ออกภายใต้น้ำหนักของความรับผิดชอบ [spouse.GetFirstName] ก็สนใจ แต่คำสัญญาที่ไม่บรรลุผลและความสนใจที่ขาดหายไป"
 spouse.3001.arrogant:0 "[spouse.GetFirstName] โกรธเคืองเกี่ยวกับความรับผิดชอบอันหนักอึ้งของข้า แต่ไม่ใช่ เพราะห่วงใยในความเป็นอยู่ที่ดีของข้า ไม่ [spouse.GetSheHe] คาดหวังให้ข้าให้ความสำคัญกับ[spouse.GetHerHim]มากกว่าหน้าที่ของข้าในฐานะ [ROOT.Char.GetTitleAsNameNoTooltip]!"
 spouse.3001.sadistic:0 "\n\nข้ากำลังดิ้นรน เพื่อให้ความสนใจกับความรับผิดชอบมากมายของข้าตามที่สมควรได้รับ และข้ารู้สึกว่าตนเองกำลังอ่อนล้า ครั้งหนึ่ง ข้าเคยคิดว่าจะได้รับการสนับสนุนจาก [spouse.GetFirstName] แต่ข้าไม่โง่เขลา เช่นนั้นอีกต่อไป ข้าคิดว่า[spouse.GetSheHe]พบความสุขในความทุกข์ทรมานของข้าจริงๆ!"
 spouse.3001.callous:0 "หลังจากวันที่ยาวนานและน่าเบื่อหน่าย ข้าโหยหาความเห็นอกเห็นใจและกำลังใจ [spouse.GetFirstName] ไม่ได้เสนออะไรนอกจากคำพูดที่ทิ่มแทงและการปฏิเสธที่เย็นชา"
 spouse.3001.vengeful:0 "ข้ายอมรับ ข้าเป็นเพียง [ROOT.Char.GetWomanMan] และข้ามีข้อบกพร่อง แต่ [spouse.GetFirstName] มีข้อบกพร่องอย่างสุดขั้ว! [spouse.GetSheHe|U] จำทุกความผิดพลาดที่ข้าเคยทำ และที่แย่กว่านั้นคือยังคงลงโทษข้าสำหรับความผิดพลาดเหล่านั้น"
 spouse.3001.desc.end:0 "\n\nท่านอาจคิดว่า [spouse.GetSheHe] กำลังพยายามอย่างสุดความสามารถ [spouse.GetHerHis] เพื่อ ทำให้ชีวิตของข้าเป็นความทรมานที่ไม่สิ้นสุด!"
 spouse.3001.a:0 "ทำไมท่านถึงเกลียดข้านัก?!"

 spouse.3002.t:0 "โอกาสสำหรับการแก้เผ็ด"
 spouse.3002.desc:0 "ระหว่างการเยี่ยมเยียน ดูเหมือนว่าข้าจะได้รับความสนใจจาก [told_of_character.GetTitledFirstNamePossessive] แม้จะเป็นเพียงช่วงสั้นๆ นี่อาจเป็นโอกาสอันดีที่จะบอก[told_of_character.GetHerHim]ว่า[told_of_character.GetSheHe]ควรคิดอย่างไรเกี่ยวกับ [ROOT.Char.Custom2('RelationToMe' , SCOPE.sC('spouse') )] ของข้า [spouse.GetFirstName] จริงๆ"
 spouse.3002.a:1 "ให้ข้าบอกอะไรบางอย่างแก่ท่าน [told_of_character.GetFirstNameNoTooltip]"
 spouse.3002.a.great:0 "เรื่องราวที่น่าเชื่อถือ"
