 spouse.2008.desc:0 "ดูเหมือนว่า [told_of_character.GetTitledFirstName] ประทับใจอย่างยิ่งกับวิธีที่ข้าพูดถึง [spouse.GetFirstName]! พวกเขาเข้ากันได้ดีกว่าที่เคย"
