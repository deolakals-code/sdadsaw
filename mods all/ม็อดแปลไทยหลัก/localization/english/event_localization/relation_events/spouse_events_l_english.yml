 spouse.2004.opening:1 "ระหว่างการเยี่ยมเยียนครั้งล่าสุด [initial_spouse.GetFirstName] [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('initial_spouse'))] ของข้า พูดคุยกับ [told_of_character.GetTitledFirstName] อย่างยืดยาว"
