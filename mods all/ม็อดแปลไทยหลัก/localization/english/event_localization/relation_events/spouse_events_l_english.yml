 spouse.3012.agent_suspicious:0 "\n\nการแบ่งปันพฤติกรรมที่น่าสงสัยที่ข้าเห็นจาก [agent.GetTitledFirstName] ควรจะ ทำให้[spouse.GetHerHim]สบายใจน้อยลงเล็กน้อย"
 spouse.3012.agent_probably_innocent:0 "\n\nการอ้างว่าข้าสังเกตเห็นพฤติกรรมที่น่าสงสัยอย่างยิ่งจาก [agent.GetTitledFirstName] ควรจะ ทำให้[spouse.GetHerHim]สบายใจน้อยลงเล็กน้อย"
 spouse.3012.a:1 "[spouse.GetFirstNameNoTooltip] ต้องได้รับแจ้งเกี่ยวกับ "ภัยคุกคาม" นี้!"
