l_english: 
 bishop.1001.opening:0 "[bishop.Custom2('AppropriateGreeting', ROOT.Char)]"
 bishop.1001.desc:0 "เป็นหน้าที่ของข้าที่ต้องแจ้งให้ท่านทราบว่า มีหลักฐานอันมิอาจปฏิเสธได้ถูกเปิดเผย ซึ่งพิสูจน์ได้ว่าการสมรสของท่านกับ [spouse.GetTitledFirstName] เป็นการสมรสร่วมสายโลหิต\n\n"
 bishop.1001.desc.actually_incestuous: "ข้อมูลนี้จะถูกเก็บไว้เป็นความลับระหว่างเราสอง หากท่านยุติสายสัมพันธ์อันไม่บริสุทธิ์นี้โดยทันที"
 bishop.1001.desc.made_up: "ข้อมูล... #EMP อันมิอาจปฏิเสธได้#! นี้จะถูกเก็บไว้เป็นความลับระหว่างเราสอง หากท่านยุติสายสัมพันธ์ที่ #EMP ไม่บริสุทธิ์อย่างเห็นได้ชัด#! นี้โดยทันที"
 bishop.1001.a:0 "แน่นอน ท่าน[bishop.GetTitledFirstNameNoTooltip]"
 bishop.1001.a.tt:1 "@warning_icon! #X ท่านหย่ากับ [spouse.GetUIName]#!"
 bishop.1001.b:0 "การสมรสของเราจะไม่ถูกทำลายด้วยคำโป้ปดที่ชัดเจน เช่นนี้!"
 bishop.1001.b.success:0 "ข้าพิสูจน์ได้ว่าคำกล่าวอ้างนั้นเป็นเท็จ"
 bishop.1001.b.failure:0 "คำกล่าวอ้างนั้นมิอาจปฏิเสธได้จริง"
 bishop.1001.c:0 "กล้าโป้ปดเรื่อง เช่นนี้... ข้าจะสั่งสอน[bishop.GetHerHim]ให้รู้สำนึก"
 bishop.1001.c.success:0 "ข้าโต้แย้งถึงความศักดิ์สิทธิ์ของการสมรสของเราได้สำเร็จ"
 bishop.1001.c.failure:0 "[bishop.GetTitledFirstNameNoTooltip] ไม่ยอมเชื่อ"
 bishop.1001.d:0 "แน่นอนว่าเรื่องทั้งหมดนี้คงจะ... ลืมเลือนไปได้กระมัง?"

 bishop.1011.desc_opening:0 "การที่ท่านเข้าไปพัวพันกับ[faction.GetNameNoTooltip] ซึ่งมุ่งเป้าไปที่ [targeting.GetTitledFirstName] นั้นช่างไม่เหมาะสมอย่างยิ่ง — หากท่านไม่ถอนตัวออกมา ข้าพเจ้าจำต้องใช้มาตรการขั้นเด็ดขาด"
 bishop.1011.desc_cannibal:0 "\n\nว่า แต่ [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('cannibal_food'))]ของท่าน [cannibal_food.GetTitledFirstName] ดูน่าอร่อยยิ่งนัก คงจะ#EMP น่าเสียดาย#! หากมีเรื่องใดเกิดขึ้นกับ[cannibal_food.GetHerHim]..."
 bishop.1011.desc_beating:0 "\n\nกลุ่มผู้คลั่งศาสนากำลังตระเวนอยู่ใกล้ ๆ นี้ มอบการลงทัณฑ์จากสวรรค์โดยปราศจากความปรานี [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('to_beat_up'))]ของท่าน [to_beat_up.GetTitledFirstName] ยังคงเดินตามท้องถนนเพียงลำพังในบางครั้ง ใช่หรือไม่...?"
 bishop.1011.a:0 "ข้าจะไม่ท้าทายความพิโรธของ[bishop.GetFaith.HouseOfWorship]"
 bishop.1011.b:0 "วาจาของท่านทำอันตรายข้าไม่ได้!"
 bishop.1011.b.tt:1 "ท่านเพิกเฉยต่อคำขู่แฝงเร้น"
 bishop.1011.b.outcome:0 "พบเลือดสาดตามท้องถนน"
 all_my_theocratic_vassals:0 "ข้าหลวงฝ่ายศาสนจักรทั้งหมดของข้า"
 bishop.1011.c:0 "โปรดให้ข้าได้อธิบายเหตุผล..."
 bishop.1011.c.success_vassal:0 "[bishop.GetTitledFirstNameNoTooltip] เชื่อมั่นมากจน[bishop.GetSheHe]ชักชวนสหายร่วมงานเข้าร่วมอุดมการณ์"
 bishop.1011.c.success:0 "[bishop.GetTitledFirstNameNoTooltip] เข้าใจแรงจูงใจของข้า"
 bishop.1011.c.failure:0 "[bishop.GetTitledFirstNameNoTooltip] ไม่รู้สึกประทับใจ"
 bishop.1011.c.failure.tt:0 "[bishop.GetSheHe|U] ใช้มาตรการขั้นเด็ดขาด"

 bishop.1012.title:0 "การหายตัวไปอย่างลึกลับ"
 bishop.1012.desc:0 "[cannibal_food.GetTitledFirstName] ได้หายตัวไป ทิ้งไว้เพียงกองเลือดเบื้องหลัง..."
 
