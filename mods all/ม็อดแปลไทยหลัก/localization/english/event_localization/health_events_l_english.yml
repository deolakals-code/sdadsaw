 # Suicide events, by Linnéa Thimrén 
 health.6001.t:0 "ความพยายาม"
 health.6001.desc_opening:0 "ข้าจะจบชีวิตตัวเอง ข้าอดไม่ได้ที่จะรู้สึกเศร้าใจเมื่อนึกถึงทุกสิ่งที่ข้าจะทิ้งไว้เบื้องหลัง แต่ใจข้าแน่วแน่แล้ว"
 health.6001.desc_depression:0 "ความทุกข์ทรมานดูเหมือนจะไม่มีที่สิ้นสุด"
 health.6001.desc_sickness:0 "ร่างกายของข้ากลายเป็นคุก ค่อยๆ ผุพังไป..."
 health.6001.desc_lunacy:0 "เงาได้พูดแล้ว และข้าจะเข้าร่วมกับพวกมันในไม่ช้า"
 health.6001.desc_loss:0 "ข้าทนกับการสูญเสียอีกต่อไปไม่ได้แล้ว"
 health.6001.desc_stress:0 "ข้าทนไม่ไหวแล้ว"
 health.6001.desc_ending:0 "\n\nสิ่งที่ข้ายังไม่ได้ตัดสินใจคือข้าจะทำอย่างไร..."
 health.6001.warning:0 "มีความเป็นไปได้เสมอที่ความพยายามจะล้มเหลว"
 health.6001.a:0 "ข้าจะหาอาคารที่สูงพอ"
 health.6001.a_tribal:0 "ข้าจะหาหน้าผาที่สูงพอ"
 health.6001.b:0 "ชา ชงจากพืชมีพิษ... ฟังดูเกือบจะน่าลิ้มลอง"
 health.6001.c:0 "อ่างน้ำอุ่นและมีดคมๆ น่าจะเพียงพอ"
 health.6001.d:0 "ข้าไม่แน่ใจอีกต่อไปว่านี่คือสิ่งที่ข้าต้องการทำ"
 health.6001.d_tt:0 "ข้าไม่ได้พยายาม"

 health.6002.desc_fall:0 "ขณะที่ข้าขยับเข้าใกล้ขอบ ลมพัดพาเนื้อผ้า [ROOT.Char.Custom('GetClothingArticle')] ของข้า และมันก็สะบัดรอบตัวข้า มันเป็นทางลงที่ยาวไกล"
 health.6002.desc_poison:0 "ขณะที่ชาเดือด อากาศก็เต็มไปด้วยกลิ่นเหม็นราวกับจะเตือนข้าถึงจุดประสงค์ของมัน ข้าเทของเหลวลงในถ้วย มันเย็นลงอย่างรวดเร็ว และข้ายกถ้วยขึ้นจรดริมฝีปาก"
 health.6002.desc_knife:0 "นั่งอยู่ในอ่างน้ำอุ่น ข้าสูดไอน้ำขณะเอื้อมมือไปหยิบมีดคมๆ ข้างตัว"
 health.6002.desc_ending:1 "\n\n"[ROOT.Char.GetFirstNameNoTooltip]! อย่าทำอย่างนั้น [friendly_person.Custom2('RelationToMeShort', ROOT.Char)]!"\n\nข้าหันกลับไปพบ [friendly_person.GetTitledFirstName] ยืนอยู่ตรงนั้น เอื้อมมือมาหาข้าด้วยสีหน้าหวาดกลัว "ได้โปรด นี่ไม่ใช่วิธีแก้ปัญหา""
 health.6002.a:0 "ไม่มีอะไรที่ท่านจะหยุดข้าได้"
 health.6002.a_success:0 "ความพยายามของท่านสำเร็จ"
 health.6002.a_failure:0 "ความพยายามของท่านล้มเหลว"
 health.6002.b:0 "ท่านพูดถูก สิ่งต่างๆ อาจจะยังดีขึ้นได้"

 health.6004.desc:0 "ก้าวเล็กๆ ออกไปเหนือขอบ นั่นคือทั้งหมดที่ต้องทำ ด้วยลมที่กรีดร้องรอบตัวข้า ข้ายกเท้าขึ้นและก้าวไปข้างหน้า\n\nชั่วขณะหนึ่งรู้สึกเหมือนข้าลอยอยู่ในอากาศ โลกหมุนรอบตัวข้า แล้วทุกอย่างก็เร็วมาก ลมในหูของข้า ความรู้สึกของการตก พื้นดินลอยขึ้นมาหาข้า..."
 health.6004.a:0 "เป็นอิสระ ในที่สุด"

 health.6005.desc:0 "ก้าวเล็กๆ ออกไปเหนือขอบ นั่นคือทั้งหมดที่ต้องทำ ด้วยลมที่กรีดร้องรอบตัวข้า ข้ายกเท้าขึ้นและ–\n\nข้าถูกกระชากกลับอย่างกะทันหัน ทหารยามคนหนึ่งกดข้าลง "
 health.6005.desc_ending:0 ""ข้าเสียใจ [ROOT.Char.Custom('FormOfAddressForLiege')] แต่ท่านกำลังเสียสติ!""
 health.6005.a:0 "แผนการของข้า ถูกขัดขวาง..."

 health.6007.desc:0 "ข้าสูดไอน้ำจากถ้วยชาที่ถืออยู่ในมือ และหลับตาลง ข้าค่อยๆ ยกขอบถ้วยขึ้นจรดริมฝีปากและจิบยาวๆ ข้ากลืนลงไป\n\nไม่นานโลกก็เริ่มเป็นสีเทาและเลือนลาง ความมืดคืบคลานเข้ามาที่ขอบการมองเห็น และข้าวางศีรษะลงบนโต๊ะ ข้ารู้สึกว่าลมหายใจสั้นลงเรื่อยๆ ข้าหลับตาลง"
 
 health.6008.desc:0 "ข้าสูดไอน้ำจากถ้วยชาที่ถืออยู่ในมือ และหลับตาลง ข้าค่อยๆ ยกขอบถ้วยขึ้นจรดริมฝีปากและ–\n\nถ้วยถูกกระชากออกจากมือข้าและโยนลงบนพื้น ซึ่งมันแตกละเอียด ทหารยามคนหนึ่งยืนอยู่เหนือข้า ความตื่นตระหนกในดวงตา [dummy_gender.GetHerHis]"

 health.6010.desc:0 "ไอน้ำจากอ่างน้ำร้อนของข้าลอยอยู่รอบตัว และข้าหายใจเข้าลึกๆ ขณะหยิบมีดข้างตัวขึ้นมา ข้าวางมันเบาๆ บนแขนข้างหนึ่ง แล้วข้าก็กดลงไป แรงๆ\n\nเมื่อข้ามีรอยกรีดเหมือนกันสองรอยบนแขนทั้งสองข้าง ข้าปล่อยให้มันจมกลับลงไปในน้ำที่แดงขึ้นอย่างรวดเร็ว ข้าเอนศีรษะไปด้านหลังและถอนหายใจขณะที่โลกเริ่มหมุน มันคงอีกไม่นานแล้ว..."
 
 health.6011.desc:0 "ขณะที่ข้ากำลังจะกรีดแขนตัวเองด้วยมีด ไอน้ำจากอ่างน้ำร้อนลอยอยู่รอบตัว ทหารยามก็บุกเข้ามาและแย่งมีดไปจากมือข้าอย่างรวดเร็ว\n\n"

 health.6100.desc:0 ""สวัสดี [ROOT.Char.GetTitledFirstNameNoTooltip] ข้าแค่อยากมาเยี่ยมท่าน เพื่อถามว่าท่านเป็นอย่างไรบ้างตั้งแต่... เหตุการณ์เมื่อครู่ก่อน"\n\n[friendly_person.GetTitledFirstName] ถามข้าด้วยความอบอุ่นอย่างแท้จริง และแม้ แต่การกล่าวถึงความพยายามฆ่าตัวตายของข้าก็ไม่สามารถดับมันลงได้อย่างสมบูรณ์"
 health.6100.a:0 "ข้าดีขึ้นแล้ว ขอบคุณ"
 health.6100.b:0 "ข้าเป็นอย่างไรไม่ใช่เรื่องของท่าน"

 health.6200.desc_opening:0 "ในช่วงเวลาที่หายากของความชัดเจน ข้ารู้สึกถึงใครบางคนที่ข้างเตียง"
 health.6200.desc_close_person:0 "\n\nต้องเป็น [ROOT.Char.Custom2('RelationToMe',SCOPE.sC('close_person'))] [close_person.GetTitledFirstName] ของข้า หนึ่งในไม่กี่คนที่มาเยี่ยมข้าในปัจจุบัน ข้าพยายามเอื้อมมือไปหา [close_person.GetHerHim] แต่มือของข้าไม่แม้ แต่จะกระตุก..."
 health.6200.desc:0 "คนเดียวที่มาเยี่ยมข้าในปัจจุบันคือคนรับใช้ แต่ข้าต้องการ #EMP ใครสักคน#! มาปลดปล่อยข้า..."
 health.6200.a:0 ""[close_person.GetFirstNameNoTooltip]... ได้โปรด... จบเรื่องนี้เสียที...""
 health.6200.a_success:0 "[close_person.GetSheHe|U] ตกลงที่จะทำ"
 health.6200.a_failure:0 "[close_person.GetSheHe|U] ปฏิเสธข้า"
 health.6200.a_failure_tt:0 "ท่านไม่ตาย"
 health.6200.b:0 "ข้าไม่สามารถขอสิ่งนี้จาก [close_person.GetHerHim] ได้ คนรับใช้ต้องทำ..."
 health.6200.b_2:0 "คนรับใช้ต้องทำ..."
 health.6200.b_success:0 "คนรับใช้ทำตามความปรารถนาของท่าน"
 health.6200.b_failure:0 "ไม่มีคนรับใช้คนใดยอมทำ"

 health.6203.desc:0 "ข้านั่งอยู่ข้างเตียงของ [incapable_person.GetTitledFirstNamePossessive] เมื่อ [incapable_person.GetSheHe] ดูเหมือนจะตื่นขึ้นมาเกือบจะทันที ดวงตาเลื่อนขึ้นไปด้านบน ตั้งแต่ [incapable_person.GetSheHe] ถูกผูกติดอยู่กับเตียงนี้ [incapable_person.GetSheHe] แทบจะไม่พูดอะไรเลย แต่ทันใดนั้นความเงียบก็ถูกทำลายลงด้วยเสียงแหบแห้ง\n\n"[ROOT.Char.GetFirstNameNoTooltip]? [ROOT.Char.GetFirstNameNoTooltip] ได้โปรด... จบเรื่องนี้เสียที เมตตา..."
 health.6203.desc_murder:0 "\n\n[incapable_person.GetSheHe] ไม่รู้เลยว่า [incapable_person.GetSheHe] กำลังเล่นตามแผนของข้า!"
 health.6203.a:0 "ข้า... ข้าเข้าใจ..."
 health.6203.b:0 "ไม่! ท่านจะขอสิ่ง เช่นนี้จากข้าได้อย่างไร?!"

 health.6204.desc_opening:0 "ข้าไม่สามารถเข้าใจคำตอบของ [close_person.GetTitledFirstNamePossessive] ได้ แต่ [close_person.GetSheHe] ไม่ได้จากไปจากข้างเตียงข้า\n\n"
 health.6204.desc_1:0 "หลังจากนั้นครู่หนึ่ง ข้ารู้สึกถึงการเคลื่อนไหว แล้วข้ารู้สึกถึงแรงกดเบาๆ ที่ใบหน้า แรงกดเพิ่มขึ้น และข้าพบว่าข้าหายใจไม่ออก และข้าเต็มไปด้วยความรู้สึก... ขอบคุณ [close_person.GetSheHe|U] ตกลง [close_person.GetSheHe|U]..."
 health.6204.desc_2:0 "หลังจากนั้นครู่หนึ่ง ข้ารู้สึกถึงการเคลื่อนไหว แล้วข้ารู้สึกถึงแรงกดเย็นๆ คมๆ ที่คอ ข้าแทบไม่รู้สึกถึงรอยกรีด แต่ข้าได้ยินเสียงสูดลมหายใจเข้าของ [close_person.GetHerHis] ได้ยินเสียงมีดกระทบพื้น ได้ยินเสียงหึ่งๆ ในหู... แล้วก็... ไม่มีอะไร"
 health.6204.a:0 "เป็นอิสระ ในที่สุด..."

 health.6205.desc_1:0 "หลังจากนั้นครู่หนึ่ง ข้ารู้สึกถึงการเคลื่อนไหว แล้วข้ารู้สึกถึงแรงกดเบาๆ ที่ใบหน้า แรงกดเพิ่มขึ้น และข้าพบว่าข้าหายใจไม่ออก และข้าเต็มไปด้วยความรู้สึก... ขอบคุณ ขณะที่ข้ากำลังจะหลับไป อากาศก็พุ่งกลับเข้าสู่ปอดของข้า ข้าได้ยินเสียงร้องไห้และเสียงกรีดร้องอย่างบ้าคลั่ง ข้าได้ยินเสียงฝีเท้าออกจาก [ROOT.Char.Custom('GetRoom')]"
 health.6205.desc_2:0 "หลังจากนั้นครู่หนึ่ง ข้ารู้สึกถึงการเคลื่อนไหว แล้วข้ารู้สึกถึงแรงกดเย็นๆ คมๆ ที่คอ แรงกดเพิ่มขึ้นและ– และข้าได้ยินเสียงมีดกระทบพื้น ข้าได้ยินเสียงร้องไห้ เสียงอ้อนวอน ฝีเท้าออกจาก [ROOT.Char.Custom('GetRoom')]"
 health.6205.a:0 "ไม่... ได้โปรด... กลับมา..."

 health.6206.desc:0 ""[ROOT.Char.GetFirstNameNoTooltip]..."\n\nข้าได้ยินเสียงของ [close_person.GetFirstNamePossessive] ราวกับมาจากห้วงลึกอันยิ่งใหญ่ "[ROOT.Char.GetFirstNameNoTooltip] ข้า... ข้าทำไม่ได้"\n\nความสิ้นหวังเข้าครอบงำข้า และมีเพียงเสียงร้องไห้ เสียงฝีเท้าที่จากไป เท่านั้นที่ทะลุผ่านม่านหมอกในใจข้า"

 health.6207.desc:0 "ครั้งต่อไปที่คนรับใช้เข้ามาใน [ROOT.Char.Custom('GetRoom')] ข้าพยายามดิ้นรนให้หลุดพ้นจากม่านหมอกในจิตใจ และความเฉื่อยชาของร่างกาย\n\n"เจ้า... ใคร...?"\n\n"ข้าหรือ [ROOT.Char.Custom('FormOfAddressForLiege')]?" เสียงฝีเท้าเดินอย่างรวดเร็วมาที่ข้างเตียงข้า "ข้าคือ [servant.GetFirstName] มีสิ่งใดให้ข้ารับใช้หรือไม่?""
 health.6207.a:0 ""[servant.GetFirstNameNoTooltip]... ได้โปรด... จบเรื่องนี้เสียที...""
 health.6207.a_success:0 "[servant.GetSheHe|U] ตกลงที่จะทำ"
 health.6207.a_failure:0 "[servant.GetSheHe|U] ปฏิเสธข้า"

 health.6209.desc_refusal:0 ""[ROOT.Char.Custom('FormOfAddressForLiege')|U]! ข้า..."\n\n"
 health.6209.desc:0 ""[ROOT.Char.Custom('FormOfAddressForLiege')|U]! ข้ามิอาจ...ทำได้! ท่านกล้าถามเรื่อง เช่นนี้ได้อย่างไร..."\n\nความสิ้นหวังท่วมท้นข้า และมีเพียงเสียงร้องไห้ เสียงฝีเท้าที่เดินจากไป เท่านั้นที่แทรกผ่านม่านหมอกในจิตใจข้าได้"

 health.6210.desc:0 "ข้ากำลังรอคอย นั่นคือสิ่งที่ข้าจำได้แม้จะผ่านม่านหมอกในใจ – ข้ากำลังรอคอยการปลดปล่อยที่ [close_person.GetTitledFirstName] สามารถมอบให้ข้าได้ แต่มันไม่มาถึง ทำไม...? ทำไม [close_person.GetSheHe] ถึงไม่มา?"
 health.6210.a:0 "[close_person.GetSheHe] ทอดทิ้งข้าไปแล้วหรือ...?"

 # Infirm events
 health.7000.t:0 "นักโทษในร่างกายของข้าเอง"
 health.7000.desc:0 "ข้ารู้ว่าการแก่ตัวลงหมายถึงการทำทุกอย่างช้าลง แต่ข้าไม่คิดว่าทุกอย่างจะหยุดนิ่งจนกว่าข้าจะตาย ช่วงหลังๆ นี้ ข้ารู้สึกไม่สบายตัวตลอดเวลาและทุกอย่างต้องใช้ความพยายามมากกว่าเดิม ข้ากังวลว่าถ้าข้านอนลง ข้าอาจจะไม่สามารถลุกขึ้นได้อีก ไม่ต้องสงสัยเลยว่าเวลาของข้ากำลังจะหมดลง"
 health.7000.desc_collapse:0 "ข้ารู้ว่าข้าฝืนตัวเอง – ข้าควรจะฟังสิ่งที่ร่างกายบอก แต่ข้าเลือกที่จะเพิกเฉย "ข้าจะทำสิ่งนี้ให้เสร็จก่อนเข้านอน แค่อีกนิดหน่อย แล้วข้าจะพักผ่อน" ทันใดนั้นข้ารู้สึกหน้ามืด และเมื่อข้าลุกขึ้น ภาพก็ดับไป\n\nวันต่อมา ข้าตื่นขึ้นมาบนเตียง ไม่สามารถลุกขึ้นได้ เพราะร่างกายปฏิเสธที่จะฟังข้า บางที [ROOT.Char.GetFaith.HighGodName] อาจตัดสินใจลงโทษข้าที่ไม่ปฏิบัติต่อภาชนะนี้ ซึ่งมีไว้เพื่อรับใช้ [ROOT.Char.GetFaith.HighGodNameAlternate] ด้วยความเคารพ"
 health.7000.desc_closing:0 "\n\nข้ารู้สึกเหมือนทำอะไรไม่ได้นอกจากรอคอยอ้อมกอดอันแสนหวานของความตายมารับข้าไป"
 health.7000.a:0 "ข้าจะต้องรอนานแค่ไหน?"
 health.7000.a.lazy:0 "อย่างน้อยข้าก็ได้นอนอยู่บนเตียงทั้งวัน..."
 health.7100.desc:0 "วันนี้วันอะไร? ข้าพักผ่อนมานานแค่ไหนแล้วครั้งนี้?\n\nข้าพบว่าตัวเองกำลังมองหาใบหน้าของผู้มาเยี่ยมบ่อยๆ เพื่อหาสัญญาณใดๆ – ริ้วรอยหรือแผลเป็น – #bold อะไรก็ได้#! เพื่อเป็นหลักฐานว่าเวลายังคงผ่านไป อย่างไรก็ตาม การปฏิสัมพันธ์ที่ข้ามีกับผู้อื่นรู้สึกเหมือนพวกเขากำลังพูด #bold ใส่#! ข้า ไม่ใช่พูด #bold กับ#! ข้า\n\nข้ายังเป็นข้าอยู่หรือไม่ หรือเป็นวิญญาณที่ถูกพรากไปจากร่างกาย? ข้ากำลังมีชีวิตอยู่ หรือเพียงแค่ดำรงอยู่?"
 health.7100.a:0 "การดำรงอยู่ของข้าคือการทรมาน"
 health.7200.t: "ข้าอยู่ที่ใดกัน?"
 health.7200.desc: "เดี๋ยวก่อน ทำไมข้าถึงมาอยู่ที่นี่? ข้าไม่ได้ตั้งใจจะมาที่นี่นี่นา... หรือว่าตั้งใจ? ข้ากำลังมองหาอะไรอยู่หรือเปล่า?\n\nบางทีอาจจะไม่มีอะไร... เดี๋ยวก่อน เมื่อกี้ข้ากำลังคิดอะไรอยู่นะ?\n\nปวดหัวจัง..."
 health.7200.a: "ข้าควรกลับไปนอน..."
 health.7300.t: "วิสัยทัศน์พร่ามัว"
 health.7300.desc: "ดวงอาทิตย์สว่างเจิดจ้าเช่นนี้เสมอมาหรือ? รัศมีของมันแทงเข้าตาราวกับปลายหอก ข้าควรหลบเข้าที่ร่มจะดีกว่า...\n\n...เงามืดนั้นหม่นหมองเช่นนี้เสมอมาหรือ?"
 health.7300.a: "โลกดูจืดชืดและไร้สีสัน"
 health.7400.t: "หัวใจที่สั่นเทา"
 health.7400.desc: "หน้าอกข้าแน่นไปหมด — และข้าก็หายใจหอบอย่างที่ไม่เคยเป็นมาก่อน หอบแฮ่กราวกับสุนัขดำในวันอากาศร้อน ความเจ็บปวดจางๆ คืบคลานเข้าสู่กราม แล้วลามลงไปที่แขน ก่อนจะค่อยๆ หายไป...\n\nแต่ข้าไม่ได้ทำอะไรเลยนี่นา?"
 health.7400.a: "ข้าควรจะพักผ่อนเสียหน่อย"
 health.7500.t: "กระดูกปวดร้าว"
 health.7500.desc: "โอ๊ย! ทำไมหลังข้าถึงปวดร้าวเช่นนี้? ข้าเพียงแค่สะดุดตอนลุกจากเตียง เป็นเพียงการก้าวพลาดเล็กน้อยแท้ๆ...\n\nไม่มีรอยฟกช้ำ ไม่มีบาดแผล แต่ความเจ็บปวดกลับแผ่ซ่านไปทั่วกระดูกสันหลัง\n\nเดี๋ยวก็คงหายกระมัง"
 health.7500.a: "ข้าควรระมัดระวังฝีเท้าให้มากกว่านี้"
