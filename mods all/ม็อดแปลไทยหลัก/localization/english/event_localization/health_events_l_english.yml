 fire_court_physician_effect.tt:1 "[THIS.Char.GetShortUIName] ไม่ได้เป็น [GetCourtPositionType('court_physician_court_position').GetName()] อีกต่อไป"

 #Recovery events, by Linnéa Thimrén and Petter Vilberg
 health.0001.desc:0 "บาดแผลของข้าหายดีแล้ว"

 health_wounded_title:0 "บาดเจ็บ:"
 health.0002.t:1 "$health_wounded_title$ การเยียวยา"
 health.0002.desc:0 "อาการบาดเจ็บของข้าค่อยๆ ดีขึ้น และความเจ็บปวดก็มิได้อยู่เป็นเพื่อนข้าตลอดเวลาอีกต่อไป ข้ายังคงอ่อนแออยู่ แต่ในวันนี้ข้าสามารถทำหลายสิ่งที่เมื่อเดือนก่อนเป็นไปไม่ได้"
 health.0002.a:0 "ข้ารอคอยการฟื้นตัวอย่างสมบูรณ์"

 health.0003.t:1 "$health_wounded_title$ เฉียดความตาย"
 health.0003.desc:0 "ดูเหมือนว่าช่วงเวลาที่เลวร้ายที่สุดได้ผ่านพ้นไปแล้ว บาดแผลฉกรรจ์และกระดูกที่หักของข้าเริ่มสมานตัวเข้าด้วยกันอย่างช้าๆ"
 health.0003.a:0 "ข้าอาจจะรอดพ้นจากสิ่งนี้ไปได้"

 health.0004.t:1 "$health_wounded_title$ ไฟมอดลง"
 health.0004.desc:0 "ผิวหนังโดยรอบแข็งกระด้างขึ้น แต่ความรู้สึกแสบร้อนในบาดแผลของข้าได้ผ่านพ้นไปแล้ว ดูเหมือนว่าการติดเชื้อจะหายไป"
 health.0004.a:1 "ขอบคุณ [ROOT.Char.GetFaith.HealthGodName]"

 health.wounded_1_success:0 "การรักษาบาดแผลสำเร็จ"
 health.wounded_1_failure:0 "การรักษาบาดแผลล้มเหลว"

 # Becoming wounded, by Linnéa Thimrén and Petter Vilberg
 health.0102.t:1 "$health_wounded_title$ บาดแผลลึก"
 health.0102.desc:0 "ความเจ็บปวดแล่นพล่านไปทั่วร่างทุกย่างก้าว และแม้ แต่การเคลื่อนไหวเพียงเล็กน้อยก็ ทำให้ข้าหอบหายใจ เมื่อข้ายกมือขึ้นสัมผัสบาดแผลอย่างแผ่วเบา มือก็เปื้อนเลือด และข้าตัวสั่นเมื่อเลือดหยดลงข้างลำตัว"
 health.0102.court_physician.desc:0 "\n\n"มิต้องกังวล [ROOT.Char.Custom('FormOfAddressForLiege')] บาดแผลของท่านลึกก็จริง แต่ความรู้ของข้าลึกยิ่งกว่า""
 health.0102.a:0 "ข้าเพียงต้องการนั่งลงสักครู่..."

 health.0104.t:1 "$health_wounded_title$ บาดเจ็บสาหัส"
 health.0104.desc:0 "นั่นคือกระดูกที่ข้าเห็นฝังอยู่ในเนื้อหนัง หรือเป็นสิ่งที่ควรซ่อนอยู่ลึกยิ่งกว่านั้น? ขณะที่ผิวหนังของข้าแยกออกราวกับปากเหวอันหิวกระหายแห่งความตาย ข้าตะลึงงันกับสายเลือดที่หลั่งไหลออกมา"
 health.0104.court_physician.desc:0 "\n\n"ท่านบาดเจ็บสาหัส [ROOT.Char.Custom('FormOfAddressForLiege')] พวกเราต้องรีบรักษาท่านเดี๋ยวนี้!""
 health.0104.a:1 "[ROOT.Char.GetFaith.HealthGodName|U] โปรดช่วยข้าให้พ้นจากความเจ็บปวดนี้!"

 # Infection/gangrene, by Linnéa Thimrén and Petter Vilberg
 health.0201.desc:0 "บาดแผลติดเชื้อ"

 health.0202.t:1 "$health_wounded_title$ มลทินภายใน"
 health.0202.desc:0 "ข้ารู้สึกราวกับมีดร้อยเล่มกำลังกรีดผ่านบาดแผลของข้า! เนื้อหนังเริ่มคล้ำและเลือดเริ่มซีด เป็นที่ชัดเจนว่าบาดแผลติดเชื้อแล้ว"
 health.0202.unintelligent:0 "ราวกับมีมีดมากมายกรีดผิวหนังรอบแผลข้าทุกครั้งที่สัมผัส เนื้อนุ่ม และข้าคิดว่าเลือดมีสีผิดปกติ"
 health.0202.court_physician.desc:0 "\n\n"บาดแผลของท่านติดเชื้อ [ROOT.Char.Custom('FormOfAddressForLiege')] แต่อย่าวิตกไป ข้าจะดูแลท่านให้ผ่านพ้นเรื่องนี้ไปให้ได้""
 health.0202.a:0 "ข้าหวังว่าข้าจะมีชีวิตรอดผ่านเรื่องนี้ไปได้"

 health.0203.desc:0 "บาดแผลเนื้อตายเน่า"

 health.0204.t:1 "$health_wounded_title$ ลางร้ายสีคล้ำ"
 health.0204.desc:0 "บาดแผลย่อมต้องเจ็บปวด และอาการบวมเล็กน้อยก็ไม่ใช่เรื่องผิดปกติ ข้าจึงคิดว่าแผลกำลังหายดี อย่างไรก็ตาม บัดนี้มีตุ่มพองทำลายผิวหนังของข้า และรอยแดงกำลังเปลี่ยนเป็นสีดำ ร่างกายของข้ากำลังเน่าเปื่อยต่อหน้าต่อตา!"
 health.0204.court_physician.desc:0 "\n\n"ท่านติดเชื้อเนื้อเน่า [ROOT.Char.Custom('FormOfAddressForLiege')] นี่เป็นเรื่องร้ายแรงที่สุด... พวกเราต้องรักษาท่านทันที!""

 # Disease Contraction, by Mathilda Bjarnehed
 health.1001.t:1 "[SCOPE.Custom('EventTitleDisease')]: สังขารของข้า"
 health.1001.desc:0 "ไม่ว่าจะเป็น [ROOT.Char.GetTitleAsNameNoTooltip] หรือไพร่ สูงหรือต่ำ ก็ไม่สำคัญ ในท้ายที่สุด เราทุกคนล้วน แต่ต้องตาย\n\nข้าตระหนักถึงสิ่งนี้เมื่อข้าตื่นขึ้นมาพร้อมอาการไอในยามเช้าตรู่ ความเจ็บปวดทื่อๆ แล่นไปทั่วศีรษะและลำคอ ร่างกายของข้าสั่นสะท้านและอ่อนแรง ศีรษะของข้ามีของเหลวไหลออกมาจากทุกทวาร\n\n"
 health.1001.nophysician.desc: "แน่นอนว่าต้องมีใครสักคนในอาณาจักรที่ข้าสามารถหามาแก้ไขอาการต้องสาปนี้ได้..."
 health.1001.court_physician.desc:0 ""ข้าได้ยินเสียงหายใจฟืดฟาดนั่นมาจากอีกฟากของ [ROOT.Char.Custom('GetCourt')] เลย [ROOT.Char.Custom('FormOfAddressForLiege')]!" [physician.GetFirstName] หมอหลวงของข้า ชะโงกศีรษะ [physician.GetHerHis] เข้ามาใน [ROOT.Char.Custom('GetChamber')] ของข้า "หากท่านต้องการ ข้ารู้จักวิธีรักษาที่เหมาะสมอยู่พอสมควร""
 health.1001.a:0 "สิ่งที่ข้าต้องการคือการนอนอยู่บนเตียง..."
 health.1001.b:0 "ข้าต้องกลับบ้าน #EMP ทันที!#!"

 health.1002.t:1 "[SCOPE.Custom('EventTitleDisease')]: คมดุจมีด"
 health.1002.desc:0 "การหายใจเป็นสิ่งที่ง่ายดายและยอดเยี่ยม — ปาฏิหาริย์เล็กๆ ที่เราแทบไม่เคยใส่ใจ ตอนนี้ ขณะที่ข้าพยายามหายใจให้สม่ำเสมอ และอาการไอตามมาด้วยความเจ็บแปลบที่หน้าอก มันกลับอยู่ในความคิดของข้าตลอดเวลา"
 health.1002.court_physician.desc:0 "\n\nหมอหลวงของข้า [physician.GetFirstName] มองข้าตั้งแต่หัวจรดเท้า "เป็นโรคปอดบวม [ROOT.Char.Custom('FormOfAddressForLiege')] มิอาจมองข้ามได้ เราจะดำเนินการอย่างไรดี?""
 health.1002.a:0 "ได้โปรด อย่าให้สิ่งนี้เป็นจุดจบเลย!"

 health.1003.t:1 "[SCOPE.Custom('EventTitleDisdease')]: ราคาของความฟุ่มเฟือย"
 health.1003.court_amenities_gout.desc:0 "ราชสำนักของข้ามีชื่อเสียงด้านการเสิร์ฟอาหารอย่างหรูหราและไม่หยุดหย่อน เมื่อเท้าของข้าเริ่มบวม ข้าก็ตระหนักว่าพวกเราหลายคนอาจต้องเตรียมพร้อมรับความเจ็บปวดที่ไม่หยุดหย่อน เช่นกัน"
 health.1003.desc:0 "พวกเขาเรียกมันว่า "โรคของกษัตริย์" ราวกับว่ามีบางสิ่งที่หรูหราหรือน่าอิจฉาเกี่ยวกับข้อต่อที่บวมและปวดเมื่อยของข้า\n\nโดยเฉพาะนิ้วหัวแม่เท้าของข้าบวมเป่งอย่างเจ็บปวด ทำให้ข้าเดินกะเผลก\n\nเมื่อความเจ็บปวดถึงขีดสุด ข้าอดไม่ได้ที่จะปรารถนาให้ตนเป็นเพียงชาวนาธรรมดา"
 health.1003.court_physician.desc:0 "\n\nหมอหลวงของข้า [physician.GetFirstName] วางยาขี้ผึ้งบางส่วนข้างกายข้า "ข้าเห็นใจท่าน [ROOT.Char.Custom('FormOfAddressForLiege')] ข้ามีแนวคิดสองสามอย่างที่อาจบรรเทาอาการโรคเกาต์ของท่านได้""
 health.1003.a:0 "เอายาทามาให้ข้า! เร็วเข้า!"

 health.1004.t:1 "[SCOPE.Custom('EventTitleDisease')]: สายตาที่หลบเลี่ยง"
 health.1004.desc:0 "อาการแรกเริ่มนั้นเล็กน้อย และข้าก็รีบลืมมันไป บางทีข้าอาจกลัวเกินกว่าจะเห็นความจริง ทว่า รอยแผลอันน่าสยดสยองบนใบหน้าข้า แผลเปื่อยนี้... เป็นสิ่งที่ข้าไม่อาจเพิกเฉยได้อีกต่อไป\n\nเหล่า [ROOT.Char.Custom('GetCourtierPlural')|l] ของข้ายังคงปฏิบัติตามคำสั่ง แต่มีบางอย่างเปลี่ยนไปในสายตาที่พวกเขามองข้า นั่นคือความกลัวในดวงตาของพวกเขาหรือ? ความสงสาร? หรือความรังเกียจ?"
 health.1004.court_physician.desc:0 "\n\n"ข้าเสียใจ — โรคเรื้อนเป็นความเจ็บป่วยถาวร [ROOT.Char.Custom('FormOfAddressForLiege')] อย่างไรก็ตาม ข้ามีวิธีบรรเทาอาการของท่าน""
 health.1004.a:0 "ข้าทำสิ่งใดลงไปจึงสมควรได้รับคำสาปนี้?"

 health.1005.t:1 "[SCOPE.Custom('EventTitleDisease')]: ไข้ค่าย"
 health.1005.desc:0 "ข้าเคยได้ยินเรื่องราวเกี่ยวกับทหารกล้าที่ล้มตายราวใบไม้ร่วงก่อนที่จะได้เหยียบสนามรบเสียอีก แต่ข้า ผู้เป็น [ROOT.Char.GetTitleAsNameNoTooltip]? ฝันร้ายอันเจ็บปวดและเป็นไข้นี้ไม่ใช่ชะตากรรมสำหรับข้า\n\nขณะที่อาหารอีกมื้อถูกบังคับให้ออกมาทางลำคอ ข้าสวดภาวนาขอการไถ่บาป รูจมูกของข้าแสบด้วยกลิ่นฉุนของน้ำดี"
 health.1005.court_physician.desc:0 "\n\n"มิต้องกังวล [ROOT.Char.Custom('FormOfAddressForLiege')]! ไข้รากสาดใหญ่รักษาได้ ข้ารับรอง""
 health.1005.a:0 "ข้าขอร้อง ให้มันจบลงเสียที!"

 health.1006.t:1 "[SCOPE.Custom('EventTitleDisease')]: ทีละน้อย"
 health.1006.desc:0 "รอยเปื้อนสีแดงเข้ม ช่างตัดกับผืนผ้าสีซีด ข้าจ้องมองมันอย่างไม่เชื่อสายตา พยายามกลั้นอาการไออีกครั้ง มัน...? ข้า...? \n\nข้าเช็ดนิ้วกับริมฝีปาก มือสั่นเทาขณะดึงกลับ ข้ารู้สึกถึงความเปียกชื้นอันอบอุ่น แต่ข้ากลัวที่จะมอง"
 health.1006.court_physician.desc:0 "\n\n"ข้าเกรงว่าท่านจะติดเชื้อวัณโรค [ROOT.Char.Custom('FormOfAddressForLiege')] ข้าจะรักษาท่านทันที""
 health.1006.a:0 "นี่คือชะตากรรมของข้างั้นหรือ? ที่จะค่อยๆ ผ่ายผอมลง?"

 health.1007.t:1 "[SCOPE.Custom('EventTitleDisease')]: คนแปลกหน้าภายใน"
 health.1007.desc:0 "มีบางสิ่งอยู่ภายในตัวข้า ซึ่งไม่ใช่ข้า มันกัดกินเนื้อหนังของข้า ดูดกินพลังชีวิตของข้า ความแข็งแกร่งของมันเพิ่มขึ้น ในขณะที่ข้าเหี่ยวเฉาลง\n\nข้ากดมือลงบนก้อนเนื้อใต้ผิวหนัง นิ้วมือของข้าปวดร้าวอยากจะฉีกมันออก ความคิดที่ว่ามันกำลังเติบโต ทำให้ข้าอยากอาเจียน"
 health.1007.court_physician.desc:0 "\n\n"ใช่แล้ว โชคไม่ดีเลย มันคือมะเร็ง ข้ารู้จักการรักษาที่มีประสิทธิภาพเพียงวิธีเดียว...""
 health.1007.a:0 "เมื่อต่อกรกับศัตรูผู้นี้ ย่อมไม่มีชัยชนะ"

 health.1008.t:1 "[SCOPE.Custom('EventTitleDisease')]: ไฟรัก"
 health.1008.desc:0 "ความรู้สึกแสบร้อนที่ขาหนีบของข้าทวีความรุนแรงจนทนไม่ไหว ข้าต้องขอตัวและหนีไปยัง [ROOT.Char.Custom('GetChamber')] ของข้า ในที่สุดเมื่ออยู่ตามลำพัง ข้าก็สามารถเกาตัวเองเพื่อบรรเทาอาการได้\n\nทว่า ไม่มีการบรรเทาใดๆ เพราะนิ้วของข้าพบตุ่มพองและ ทำให้มันแตกออก!"
 health.1008.partner.a:0 "[infecting_partner.GetFirstNameNoTooltip]...!"
 health.1008.no_partner.a:0 "ได้อย่างไร? ใครกัน?!"

 health.1013.t:1 "[SCOPE.Custom('EventTitleDisease')]: ซิฟิลิส"
 health.1013.desc:0 "ข้าคิดว่ามันเป็นเพียงตุ่มพองไม่กี่ตุ่ม แม้ข้าจะรู้สึกรังเกียจและสาปแช่งโชคร้ายของตน ข้าไม่เคยจินตนาการว่ามันจะเลวร้ายลง บัดนี้ ผื่นแดงกำลังลุกลามไปทั่วร่างกายของข้า\n\nข้ารู้ว่าจะเกิดอะไรขึ้นต่อไป แผลเปื่อย ไข้ ความเจ็บปวดนานัปการ และเนื้อเยื่อฝ่อลีบ และในท้ายที่สุด — หากข้ามีชีวิตอยู่นานขนาดนั้น — ข้าจะเสียสติ"
 health.1013.court_physician.desc:0 "\n\n"[ROOT.Char.Custom('FormOfAddressForLiege')|U] นั่น... ดูไม่ดีเลย ข้าขอดูว่าข้าจะทำอะไรได้บ้าง""
 health.1013.partner.a:0 "เจ้าสาปแช่งข้า [infecting_partner.GetFirstNameNoTooltip]"
 health.1013.no_partner.a:0 "ข้าถูกสาปแช่ง ถูกสาปแช่งอย่างแท้จริงและสิ้นเชิง"

 health.1014.t:1 "[SCOPE.Custom('EventTitleDisease')]: การตกต่ำ"
 health.1014.desc:0 "ข้าอยู่ที่ไหน?\n\nข้าจ้องมองโถงทางเดินว่างเปล่าเบื้องหน้า หัวใจเต้นระรัวและมือสั่นเทา ข้ามาที่นี่ได้อย่างไร? จิตใจของข้า... แตกสลาย มีภาพต่างๆ — บันได การตก เงาตามมุมห้อง — แต่ข้าไม่สามารถปะติดปะต่อมันเข้าด้วยกันได้\n\nมีคนกำลังเฝ้ามองข้าอยู่\n\nข้าหมุนตัวกลับไป พบเพียงความว่างเปล่า"
 health.1014.a:0 "ข้าไม่กลัวเจ้า ได้ยินไหม?! ไม่กลัว!"

 health.1010.t:1 "[SCOPE.Custom('EventTitleDisease')]: กาฬโรคแดง"
 health.1010.desc:0 "เมื่อมีไข้และอาเจียนระลอกแรก ข้าหวังอย่างยิ่งว่ามันจะไม่เลวร้ายไปกว่าไข้เหงื่อออก และข้าก็ดีขึ้นเล็กน้อย ลุกจากเตียง กลับไปทำหน้าที่ของตน เป็นเวลาหนึ่งสัปดาห์ ทุกอย่างเป็นไปด้วยดี — จนกระทั่งข้าสังเกตเห็นจุดแดงจุดแรกในปากของข้า"
 health.1010.end.desc:0 "\n\nนั่นคือเมื่อสองวันก่อน และบัดนี้แผลเปื่อยที่เป็นสัญญาณบ่งบอกกำลังลุกลามไปทั่วผิวหนังของข้า..."
 health.1010.court_physician.desc:0 "\n\n"แท้จริงแล้ว แผลเปื่อยเหล่านี้เป็นสัญญาณที่แน่นอนของไข้ทรพิษ อันตรายมากหากปล่อยทิ้งไว้โดยไม่รักษา""
 health.1010.a:1 "[ROOT.Char.GetFaith.HealthGodName] ข้าขอร้องท่าน ยังไม่ใช่ตอนนี้! ข้ายังไม่พร้อม!"

 health.1011.t:1 "[SCOPE.Custom('EventTitleDisease')]: สัมผัสแห่งยมทูต"
 health.1011.desc:0 "ความกลัวกาฬโรคเป็นเพื่อนร่วมทางตลอดชีวิตของข้า พี่เลี้ยงในวัยเด็กของข้าเล่าเรื่องราวก่อนนอนอันน่าสะพรึงกลัวเกี่ยวกับต่อมน้ำเหลืองบวมและแขนขาที่ดำคล้ำ\n\nแต่กาฬโรคไม่ใช่แค่เรื่องน่ากลัวอีกต่อไป ข้าค่อยๆ กดนิ้วลงบนก้อนเนื้อที่รักแร้ พลังอันมืดมิดและร้ายแรงกำลัง ทำให้เนื้อหนังของข้าเป็นมลทิน กลืนกินข้า ในขณะที่ข้ายังหายใจอยู่"
 health.1011.court_physician.desc:0 "\n\n"[ROOT.Char.Custom('FormOfAddressForLiege')|U] ข้าจะทำทุกอย่างในอำนาจของข้า แต่อาจเป็นการดีหากท่านเตรียมใจสำหรับสิ่งที่เลวร้ายที่สุด...""
 health.1011.a:1 "โอ้ [ROOT.Char.GetFaith.HealthGodName]! โปรดช่วยข้าให้พ้นจากฝันร้ายนี้!"

 # Travel loc if you get ill on the road
 health.travel.t:0 "[SCOPE.Custom('EventTitleDisease')]: จุดสิ้นสุดของการเดินทาง?"
 health.travel.option.home:0 "ข้าสามารถรับการรักษาที่ดีที่สุดได้ที่บ้าน"
 health.travel.option.home.flavor:0 "ท่านละทิ้ง [ROOT.Char.GetInvolvedActivity.GetNameNoTooltip] ของท่านและเริ่มเดินทางกลับบ้าน"
 health.travel.option.continue:0 "เราต้องอดทนต่อไป"

 # Recover from diseases, by Mathilda Bjarnehed
 health.1101.t:1 "[SCOPE.Custom('EventTitleDisease')]: ตัวข้าคนเดิม"
 health.1101.desc:1 "เมื่อข้าตื่นขึ้นในเช้านี้และสังเกตเห็นแสงแรกของดวงอาทิตย์ ข้าใช้เวลาครู่หนึ่งจึงตระหนักว่าข้าได้หลับสนิทเป็นครั้งแรกในรอบหลายสัปดาห์ ข้าไม่ได้ตื่นขึ้นมาไอเลยสักครั้ง!\n\nมันเป็นหนทางยาวนานในการกลับมามีสุขภาพดี แต่ข้าพบว่าตนเองอยู่ในอ้อมกอดอันอบอุ่นของมันอีกครั้ง"
 health.1101.a:0 "ข้าดีใจที่หายดีอีกครั้ง"

 health.1102.t:1 "[SCOPE.Custom('EventTitleDisease')]: พลังของข้ากลับคืนมา"
 health.1102.desc:0 "ข้าต้องยอมรับว่า ข้าเคยกังวลถึงชีวิตของตนอยู่ช่วงหนึ่ง แต่บัดนี้ความปวดร้าวเหล่านั้นเป็นเพียงความทรงจำอันเลือนราง ด้วยความรู้สึกขอบคุณอย่างเต็มเปี่ยม ข้าสูดหายใจลึก เตรียมพร้อมสำหรับวันที่จะมาถึง"
 health.1102.a:0 "ถึงเวลาพิชิตโลกแล้ว!"

 health.1103.t:1 "[SCOPE.Custom('EventTitleDisease')]: เป็นอิสระจากความเจ็บปวด"
 health.1103.desc:0 "ข้าต้องจำกัดตัวเองและละทิ้งความสุขมากมายในชีวิต แต่มันเป็นการเสียสละที่ข้ายินดีทำอีกครั้ง มีสิ่งอื่นให้เพลิดเพลินในชีวิตนอกเหนือจากอาหารและเครื่องดื่ม!\n\nบัดนี้ เมื่อความเจ็บปวดไม่เป็นอุปสรรคต่อข้าอีกต่อไป ในที่สุดข้าก็เป็นอิสระที่จะไล่ตามสิ่งเหล่านั้น"
 health.1103.a:0 "ความพอประมาณได้ผล!"

 health.1105.t:1 "[SCOPE.Custom('EventTitleDisease')]: การต่อสู้ที่ได้รับชัยชนะ"
 health.1105.desc:0 "ไม่เหมือนกับหลายคนก่อนหน้าข้า ข้าแข็งแกร่งพอที่จะรอดพ้นจากความหายนะของไข้ค่ายอันน่าสะพรึงกลัว มันเป็นความท้าทายที่โหดร้าย ข้าจะไม่ปฏิเสธ แต่ข้าก็อดทน!"
 health.1105.a:0 "ข้ามีชีวิตอยู่เพื่อต่อสู้อีกวัน!"

 health.1106.t:1 "[SCOPE.Custom('EventTitleDisease')]: โอกาสครั้งที่สอง"
 health.1106.desc:0 "ข้าผ่ายผอมลง ไอ และเลือดออก ข้าคิดว่าข้าจะผอมแห้งจนไม่เหลืออะไร มันรู้สึก เช่นนั้นจริงๆ เมื่อข้าแทบจะลุกจากเตียงไม่ได้\n\nทว่า สุขภาพและความแข็งแรงของข้าฟื้นตัว แม้จะช้ามากก็ตาม ในที่สุด ข้าก็พร้อมที่จะเผชิญโลกและความท้าทายทั้งหมดของมัน"
 health.1106.a:0 "ถึงเวลาพิชิตโลกแล้ว!"

 health.1107.t:1 "[SCOPE.Custom('EventTitleDisease')]: ปาฏิหาริย์ทางการแพทย์"
 health.1107.desc:0 "พวกเขาบอกข้าว่าข้าเป็นสิ่งมหัศจรรย์ เป็นปาฏิหาริย์ ผู้คนไม่ควรฟื้นตัวจากสิ่ง เช่นนี้\n\nทว่าข้ารู้สึกสบายดี และก้อนเนื้อก็หายไป ไม่มีข้อสรุปอื่นใด — ข้าหายจากมะเร็งแล้ว"
 health.1107.a:0 "ข้าจะใช้ชีวิตให้เต็มที่!"

 health.1109.t:1 "[SCOPE.Custom('EventTitleDisease')]: ความโล่งใจครั้งใหญ่"
 health.1109.desc:0 "ข้ากลัวว่าซิฟิลิสจะคร่าชีวิตข้าไป ทว่าดูเหมือนว่าข้าจะชนะการต่อสู้ครั้งนี้ ข้าไม่มีอาการมาหลายเดือนแล้ว ถึงเวลาปล่อยวางความกังวลนั้นเสียที"
 health.1109.a:0 "ข้าจะใช้ชีวิตให้เต็มที่!"

 health.1110.t:1 "[SCOPE.Custom('EventTitleDisease')]: หนีจาก [ROOT.Char.GetFaith.DeathDeityName]"
 health.1110.desc:0 "แม้ว่าแผลเป็นอาจยังคงอยู่ ทั้งบนผิวหนังและในใจของข้า ดูเหมือนว่าโรคภัยได้ออกจากร่างกายข้าไปแล้ว ข้าจะรอดชีวิต ยังมีเวลา"
 health.1110.a:1 "สรรเสริญ [ROOT.Char.GetFaith.HealthGodName]! ข้าสบายดี!"
 health.1110.a.tt:0 "บัดนี้ข้ามีภูมิคุ้มกันต่อ [GetTrait('smallpox').GetName( GetNullCharacter )]"

 health.1111.t:1 "[SCOPE.Custom('EventTitleDisease')]: ฝ่าฟันทุกอุปสรรค"
 health.1111.desc:0 "ดูเหมือนว่า [ROOT.Char.GetFaith.DeathDeityName] ได้ผ่านประตูของข้าไป เฝ้าอยู่ข้างเตียง แต่ในที่สุดก็ตัดสินใจปล่อยให้ข้ามีชีวิตอยู่ ข้าจะไม่มีวันลืมความทรมานจากสัมผัสของ [ROOT.Char.GetFaith.DeathDeityHerHis|U] ทว่า [ROOT.Char.GetFaith.DeathDeitySheHe|U] ได้เปิดตาข้าให้เห็นปาฏิหาริย์แห่งชีวิต\n\n กาฬโรคได้คร่าชีวิตไปมากมาย แต่ข้าจะไม่เป็นหนึ่งในนั้น"
 health.1111.a:1 "สรรเสริญ [ROOT.Char.GetFaith.HealthGodName] สำหรับปาฏิหาริย์นี้!"
 health.1111.a.tt:0 "บัดนี้ข้ามีภูมิคุ้มกันต่อ [GetTrait('bubonic_plague').GetName( GetNullCharacter )]"

 # STD events, by Mathilda Bjarnehed
 health.2001.t:1 "[SCOPE.Custom('EventTitleDisease')]: ความประหลาดใจอันน่ารังเกียจ"
 health.2001.start.desc:0 "ขณะที่ข้าสอดตัวเข้าไปใต้ผ้าปูที่นอนเพื่อร่วมกับ [std_partner.GetFirstName] ข้าตกใจสุดขีดเมื่อพบตุ่มพองมีหนองไหลบนส่วนที่ลับที่สุดของ [std_partner.GetHerHis]!"
 health.2001.not_sick.desc:0 "[std_partner.GetSheHe] นำโรคอันน่ารังเกียจ เช่นนี้มาสู่เตียงของเราได้อย่างไร?"
 health.2001.sick.desc:0 "ข้าทำสิ่งนี้กับ [std_partner.GetHerHim] หรือ?"
 health.2001.a.not_sick:0 "ออกไปจากเตียงข้า เจ้า [std_partner.Custom2('InsultNounSexual', ROOT.Char)] ทรยศ!"
 health.2001.a.sick:0 "ยกโทษให้ข้าด้วย [std_partner.GetFirstNameNoTooltip] แต่ข้าไม่สามารถร่วมเตียงกับท่าน เช่นนี้ได้"
 health.2001.c.not_sick:0 "แค่คิดว่าจะสัมผัสเจ้า... ข้าทำไม่ได้!"
 health.2001.c.sick:0 "ยกโทษให้ข้าด้วย [std_partner.GetFirstNameNoTooltip] เราไม่สามารถดำเนินต่อไป เช่นนี้ได้"
 health.2001.d.not_sick:0 "ข้ายกโทษให้เจ้า [std_partner.GetFirstNameNoTooltip]"
 health.2001.d.sick:0 "ที่รัก ข้าไม่สามารถแสดงความเสียใจได้อย่างไร!"
 health.2001.c.tt:0 "ข้ายังคงไปเยี่ยมเตียงของ [std_partner.GetFirstNamePossessive] เสี่ยงต่อการติดเชื้อเพื่อทำ เช่นนั้น"
 health.2001.c.tt_sick:0 "ข้ายังคงไปเยี่ยมเตียงของ [std_partner.GetFirstNamePossessive]"

 health.2002.t:1 "[SCOPE.Custom('EventTitleDisease')]: เลวร้ายยิ่งกว่า"
 health.2002.start.desc:0 "สิ่งที่ [std_partner.GetFirstName] ยืนกรานว่าเป็นเพียงตุ่มพอง ในที่สุดก็ได้เผยโฉมหน้าที่แท้จริงออกมา ผื่นแดงกำลังลุกลามไปทั่วผิวหนังของ [std_partner.GetHerHis] — สัญญาณที่แน่นอนของซิฟิลิส"
 health.2002.early_great_pox.desc:0 "\n\nนี่หมายความว่า...?"
 health.2002.a.not_sick:0 "ออกไปให้พ้นหน้าข้า!"
 health.2002.a.sick:0 "ข้า... ข้าทำไม่ได้ นี่มันมากเกินไป!"
 health.2002.b.not_sick:0 "ข้าไม่สามารถอยู่กับเจ้า เช่นนี้ได้ [std_partner.GetFirstName]!"
 health.2002.b.sick:0 "ที่รัก ข้าขอโทษ แต่ข้าทำไม่ได้..."
 health.2002.c:0 "ข้าจะยืนหยัดเคียงข้างท่านในเรื่องนี้ ที่รักของข้า"
 health.2002.d.not_sick:0 "นี่อาจเป็นจุดจบของข้า"
 health.2002.d.sick:0 "เราถูกสาปแช่ง!"

 health.2003.t:1 "[SCOPE.Custom('EventTitleDisease')]: ถูกทอดทิ้ง"
 health.2003.start.desc:1 "เมื่อข้าบอก [ROOT.GetCharacter.Custom2('RelationToMe', SCOPE.sC('other_partner'))] ถึงความเจ็บป่วยของข้า ข้าแสวงหาการปลอบโยนจาก [other_partner.GetHerHis] แต่กลับได้รับการปฏิเสธจาก [other_partner.GetHerHis] ความรังเกียจฉายชัดในดวงตาของ [other_partner.GetFirstNamePossessive] เมื่อ [other_partner.GetSheHe]"
 health.2003.consort.desc:0 "บอกให้ข้าอยู่ห่างจากเตียงของ [other_partner.GetHerHis]"
 health.2003.lover.desc:0 "ยุติความสัมพันธ์ระหว่างเรา"
 health.2003.a:0 "ทุกสิ่งจะถูกพรากไปจากข้างั้นหรือ?"

 #Courtier/guest/prisoner has contagious disease
 health.2101.t:1 "[SCOPE.Custom('EventTitleDisease')]: ฆาตกรท่ามกลางพวกเรา"
 health.2101.smallpox_outbreak.desc:0 "คำสาปแห่งความตายได้ตกลงมาสู่ราชสำนักของข้า — พบผู้ป่วยไข้ทรพิษ!"
 health.2101.smallpox_spreads.desc:0 "มีอีกหนึ่งชีวิตถูกสาปด้วยไข้ทรพิษ"
 health.2101.bubonic_plague_outbreak.desc:2 "[ROOT.Char.GetFaith.DeathDeityName|U] ได้เงื้อเคียว [ROOT.Char.GetFaith.DeathDeityHerHis] ขึ้นเหนืออาณาจักรของข้า — พบผู้ป่วยกาฬโรคอันน่าสะพรึงกลัว!"
 health.2101.bubonic_plague_spreads.desc:0 "มีอีกหนึ่งชีวิตยืนอยู่หน้าประตูแห่งความตาย ต่อมน้ำเหลืองบวมอันน่าสะพรึงกลัวทำลายผิวหนังของ [sick_character.GetHerHis]"
 health.2101.typhus_outbreak.desc: "ผู้ป่วยไข้ค่ายอันตรายได้คืบคลานเข้ามาในราชสำนัก ผื่น ไอ และไข้รุมเร้าผู้ป่วย"
 health.2101.typhus_spreads.desc: "พบผู้ป่วยไข้รากสาดใหญ่อีกราย"
 health.2101.consumption_outbreak.desc: "เสียงไอแหบแห้งดังไปทั่วราชสำนัก วัณโรคคืบคลานไปตามทางเดิน คร่าชีวิตเหยื่อรายแรก"
 health.2101.consumption_spreads.desc: "ผู้โชคร้ายจำนวนมากขึ้นตกอยู่ในเงื้อมมือของวัณโรค"
 health.2101.measles_outbreak.desc: "ผื่นที่ขึ้นบนผิวหนังของผู้ป่วยนั้นเห็นได้ชัดเจน: พบโรคหัดในราชสำนัก"
 health.2101.measles_spreads.desc: "ผู้คนล้มป่วยมากขึ้นเรื่อยๆ และมีผื่นสีคล้ำขึ้นบนผิวหนัง ซึ่งบ่งบอกถึงการมีอยู่ของโรคหัด"
 health.2101.dysentery_outbreak.desc: "กลิ่นเหม็นรอบๆ สถานที่บอกเล่าเรื่องราวของมันเอง พบโรคบิดในราชสำนัก"
 health.2101.dysentery_spreads.desc: "ยังคงพบผู้ป่วยโรคบิดเพิ่มขึ้นเรื่อยๆ ส้วมถูกใช้งานตลอดทั้งวันทั้งคืน"
 health.2101.ergotism_outbreak.desc: "โรคเออร์กอตได้ปรากฏขึ้นในราชสำนัก การเคลื่อนไหวกระตุกของเหยื่อ ทำให้ทุกคนที่อยู่ ณ ที่นั้นเห็นได้ชัดเจน"
 health.2101.ergotism_spreads.desc: "ยังคงมีผู้ป่วยโรคเออร์กอตเพิ่มขึ้นเรื่อยๆ ทำให้แขนขาของพวกเขาร้อนรุ่มอยู่ใต้ผิวหนัง"
 health.2101.imporant.desc:1 "[ROOT.GetCharacter.Custom2('RelationToMe', SCOPE.sC('sick_character'))] [sick_character.GetFirstName] ที่น่าสงสารของข้ากำลังต่อสู้เพื่อชีวิตของ [sick_character.GetHerHis]"
 health.2101.prisoner.desc:1 "เหยื่อผู้โชคร้ายคือ [sick_character.GetTitledFirstName] หนึ่งในนักโทษของข้า"
 health.2101.courtier_or_guest.desc:1 "เหยื่อผู้โชคร้ายคือ [ROOT.GetCharacter.Custom2('RelationToMe', SCOPE.sC('sick_character'))] [sick_character.GetTitledFirstName] ของข้า"
 health.2101.immune.desc:0 "\n\nแม้ว่าข้าจะมีภูมิคุ้มกันต่อความหายนะของโรคระบาดร้ายแรงนี้ การปรากฏตัวของ [sick_character.GetFirstNamePossessive] ก็เป็นอันตรายต่อทุกคนในราชสำนักของข้า"
 health.2101.not_immune.desc:0 "\n\nมลทินที่ครอบงำเนื้อหนังของ [sick_character.GetHerHis] เป็นอันตรายต่อพวกเราทุกคน ตราบใดที่ [sick_character.GetSheHe] ยังคงป่วยอยู่ ไม่มีชีวิตใดในราชสำนักที่จะปลอดภัย"
 health.2101.a:0 "แยก [sick_character.GetHerHim] ออกไปและสวดภาวนาขอการไถ่บาป"
 health.2101.a.tt:0 "โรคจะแพร่กระจายอย่างไม่มีอุปสรรคในราชสำนักของข้า"
 health.2101.b:0 "[sick_character.GetTitledFirstNameNoTooltip] ถูกเนรเทศออกจากราชสำนักของข้า!"
 health.2101.c:0 "โยน [sick_character.GetHerHim] ออกไป!"
 
 # Important character has dangerous disease events, by Mathilda Bjarnehed
 health.2201.t:2 "[SCOPE.Custom('EventTitleDisease')]: [ROOT.GetCharacter.Custom2('RelationToMeShort', SCOPE.sC('sick_character'))|U] ที่น่าสงสารของข้า"
 health.2201.start.desc:1 "ข่าวร้ายมาถึงข้า [ROOT.GetCharacter.Custom2('RelationToMe', SCOPE.sC('sick_character'))] [sick_character.GetFirstName] ของข้าล้มป่วยด้วย"
 disease_ill_article:0 "" # Thai doesn't use articles like 'a'
 disease_ill:0 "ไข้หวัด"
 disease_pneumonic:0 "โรคปอดบวม"
 disease_gout_ridden:0 "โรคเกาต์"
 disease_leper:0 "โรคเรื้อน"
 disease_typhus:0 "ไข้รากสาดใหญ่"
 disease_consumption:0 "วัณโรค"
 disease_cancer:0 "มะเร็ง"
 disease_lovers_pox:0 "กามโรค"
 disease_early_great_pox:0 "กามโรค"
 disease_great_pox:0 "ซิฟิลิส"
 disease_smallpox:0 "ไข้ทรพิษ"
 disease_bubonic_plague:0 "กาฬโรค"
 disease_measles: "โรคหัด"
 disease_ergotism: "ไฟศักดิ์สิทธิ์"
 disease_dysentery: "โรคบิด"
 missing_illness:0 "#D ไม่พบโรค #!"
 health.2201.minor_disease.desc:0 "\n\nโดยปกติแล้ว โรคเล็กน้อย เช่นนี้จะไม่ ทำให้เกิดความกังวลมากนัก ทว่าสุขภาพของ [sick_character.GetFirstNamePossessive] นั้นเปราะบาง และนี่อาจมากเกินไปสำหรับ [sick_character.GetHerHim]"
 health.2201.leprosy.desc:1 "\n\nแม้ว่า [sick_character.GetSheHe] อาจมีชีวิตอยู่ได้อีกหลายปี ความพิการของ [sick_character.GetHerHis] จะ ทำให้ [sick_character.GetHerHim] ถูกรังเกียจและไม่ไว้วางใจ แม้ แต่ข้าก็ไม่สามารถระงับความรังเกียจเมื่อคิดถึงแผลเปื่อยที่เติบโตทั่วผิวหนังของ [sick_character.GetHerHis] ได้..."
 health.2201.lethal_disease.desc:0 "\n\nโรคร้ายคร่าชีวิตอย่างโหดเหี้ยม ไม่ว่าเด็กหรือแก่ ยากจนหรือร่ำรวย ชายหรือหญิง ข้าเกรงว่านี่คือจุดจบ มีเพียงปาฏิหาริย์เท่านั้นที่จะช่วย [sick_character.GetHerHim] ได้"
 health.2201.major_disease.desc:1 "\n\nอนาคตไม่แน่นอน ความตายวนเวียนอยู่ใกล้เตียงของ [sick_character.GetHerHis] ทว่าทุกสิ่งยังไม่สูญสิ้น [sick_character.GetFirstNameNoTooltip] อาจรอดชีวิต หากโชคเข้าข้าง [sick_character.GetHerHis]\n\nมีเพียง [ROOT.Char.GetFaith.FateGodName] เท่านั้นที่รู้ชะตากรรมของ [sick_character.GetHerHis]"
 health.2201.court_physician.desc:1 "\n\nแพทย์หลวงต้องการทราบว่า [ROOT.GetCharacter.Custom2('RelationToMeShort', SCOPE.sC('sick_character'))] ของข้าควรได้รับการรักษาอย่างไร"
 health.2201.court_physician.desc_sick_physician:0 "\n\n[sick_character.GetSheHe|U] อาจเป็นแพทย์หลวงของข้า แต่ [sick_character.GetSheHe] ก็ยังคงมองมาที่ข้าเพื่อขอคำแนะนำ"
 health.2201.a:0 "นี่คือศัตรูที่ข้าไม่สามารถปกป้อง [sick_character.GetHerHim] ได้"

 #There is no longer an outbreak! 
 health.2102.t:1 "[SCOPE.Custom('EventTitleDisease')]: วันใหม่"
 health.2102.start1.desc:0 "การระบาดของ"
 health.2102.smallpox.desc:0 "ไข้ทรพิษ"
 health.2102.bubonic_plague.desc:0 "กาฬโรค"
 health.2102.start2.desc:0 "ซึ่งได้ทำลายล้างราชสำนักของข้า ในที่สุดก็สิ้นสุดลงแล้ว"
 health.2102.physician.desc:1 "เหยื่อทั้งหมดได้ฟื้นตัวหรือจากโลกนี้ไปแล้ว\n\n[physician.Custom2('MyCharacterIntroduction', ROOT.Char)|U] รับรองกับข้าว่าศพทั้งหมดได้รับการจัดการอย่างเหมาะสม และภัยคุกคามได้หมดไปโดยสิ้นเชิงแล้ว"
 health.2102.no_physician.desc:1 "เหยื่อทั้งหมดได้ฟื้นตัวหรือจากโลกนี้ไปแล้ว ไม่มีโรคภัยเหลืออยู่"
 health.2102.2_victims.desc:0 "\n\nทว่า หนทางสู่การฟื้นตัวยังอีกยาวไกล เราได้สูญเสีย [victim_1.Custom2('MyCharacterIntroduction', ROOT.Char)] และ [victim_2.Custom2('MyCharacterIntroduction', ROOT.Char)] รวมถึงคนอื่นๆ อีกมากมาย ชีวิตดำเนินต่อไป แต่บาดแผลยังคงอยู่"
 health.2102.1_victim.desc:0 "\n\nทว่า หนทางสู่การฟื้นตัวยังอีกยาวไกล เราได้สูญเสีย [victim_1.Custom2('MyCharacterIntroduction', ROOT.Char)] และคนอื่นๆ อีกมากมาย ชีวิตดำเนินต่อไป แต่บาดแผลยังคงอยู่"
 health.2102.root_victim.desc:0 "\n\nบางคืน ข้ายังคงตื่นขึ้นมากลางดึกด้วยเหงื่อเย็นเฉียบ ตัวแข็งทื่อด้วยความกลัว ข้ารอดมาได้ ทว่าบาดแผล — ทั้งบนผิวหนังและในใจ — จะยังคงอยู่ไปอีกหลายปี"
 health.2102.a.victim:0 "ในที่สุด เราก็ได้พักผ่อน และไว้อาลัย"
 health.2102.a.no_victim:0 "ในที่สุด เราก็ปลอดภัยแล้ว"
 health.2102.a.dead_and_survivors.tt:0 "#N [THIS.Var('dead_victims_num').GetValue|0]#! เหยื่อเสียชีวิต และ #P [THIS.Var('surviving_victims_num').GetValue|0]#! รอดชีวิตในราชสำนัก"
 health.2102.a.no_survivors.tt:0 "#N [THIS.Var('dead_victims_num').GetValue|0]#! เหยื่อเสียชีวิตในราชสำนัก"
 health.2102.a.no_dead.tt:0 "#P [THIS.Var('surviving_victims_num').GetValue|0]#! เหยื่อรอดชีวิตในราชสำนัก"
 health.2102.a.dead.tt:0 "[THIS.Char.GetShortUIName] เสียชีวิตระหว่างการระบาด"
 health.2102.a.surviving.tt:0 "[THIS.Char.GetShortUIName] ล้มป่วย แต่ฟื้นตัวระหว่างการระบาด"

 health.2202.t:1 "[SCOPE.Custom('EventTitleDisease')]: สมดุลของเหลวในร่างกาย"
 health.2202.desc:2 "ขณะที่ข้าเดินไปตามโถงทางเดิน ข้าได้ยินเสียงหัวเราะเบาๆ เสียงนั้น... ข้าไม่คุ้นเคยกับการได้ยินมันชัดเจนและสดใส เช่นนี้\n\nข้าผลักประตูที่เปิดแง้มอยู่ และที่นั่นเบื้องหน้าข้าคือ [ROOT.GetCharacter.Custom2('RelationToMe', SCOPE.sC('sick_character'))] [sick_character.GetFirstName] ของข้า ดูเหมือนจะฟื้นตัวจาก"
 health.2202.desc.happy: "\n\n[ROOT.GetCharacter.Custom2('RelationToMe', SCOPE.sC('sick_character'))] อันเป็นที่รักของข้าหายดีอีกครั้งแล้ว! ยากที่จะไม่หลั่งน้ำตาแห่งความปิติยินดี..."
 health.2202.desc.angry: "\n\nเรื่องนี้เกิดขึ้นได้อย่างไร? ทำไมต้องเป็นข้า [ROOT.Char.GetFaith.HealthGodName]? #EMP ทำไม!?#!"
 health.2202.desc.relieved: "\n\nภาระอันหนักอึ้งถูกยกออกจากบ่าของข้าเมื่อ [sick_character.GetSheHe] ทักทายข้า และข้าพยายามกลั้นน้ำตาแห่งความโล่งใจ"
 health.2202.desc.neutral: "\n\nข้าพยักหน้าให้ [sick_character.GetHerHim] อย่างเคร่งขรึม"
 health.2202.a.happy:1 "ข่าวดีจริงๆ! สรรเสริญ [ROOT.Char.GetFaith.HealthGodName]!"
 health.2202.a.angry:0 "ช่างโชคร้าย..."
 health.2202.a.relieved:0 "ราชสำนักของข้าปลอดภัยขึ้นเล็กน้อย"
 health.2202.a.neutral:0 "โชคดี"

 # Recruit physician event
 health.3001.disease.t:0 "[SCOPE.Custom('EventTitleDisease')]:"
 health.3001.t:1 "แพทย์ประจำ [ROOT.Char.Custom('GetCourt')|U]"
 health.3001.fallback_reason.desc:0 "โลกนี้เต็มไปด้วยอันตราย แม้ แต่กับ [ROOT.Char.GetTitleTierName] และ [ROOT.Char.Custom('GetCourt')|l] ของ [ROOT.Char.GetHerHis] ข้าควรจ้างแพทย์หลวงไว้เผื่อเกิดการบาดเจ็บหรือโรคภัย\n\nข้าได้สอบถามคำแนะนำ และได้รวบรวมตัวเลือกสองสามคนไว้ให้เลือก"
 health.3001.decision.desc:0 "โลกนี้เต็มไปด้วยอันตราย แม้ แต่กับ [ROOT.Char.GetTitleTierName] และ [ROOT.Char.Custom('GetCourtierPlural')|l] ของ [ROOT.Char.GetHerHis] ตามคำขอของข้า คนรับใช้ของข้าได้สอบถามคำแนะนำ บัดนี้พวกเขาได้รวบรวมตัวเลือกสองสามคนไว้ให้เลือก"
 health.3001.already_sick.desc:0 "ในที่สุด คนรับใช้ของข้าก็พบบางคนที่อาจเหมาะสมที่จะทำหน้าที่เป็นแพทย์หลวงของข้า ไม่ว่าจะทางใด ข้าเกรงว่าข้าคงไม่สามารถเลือกมากได้ในตอนนี้"
 health.3001.a:0 "เห็นได้ชัดว่า [high_skill_option.GetFirstNameNoTooltip] ค่อนข้างมีประสบการณ์"
 health.3001.a.tt:1 "[GetCourtPositionType('court_physician_court_position').GetName()] ยังมีเงินเดือน [gold_i][SCOPE.ScriptValue('court_position_physician_salary')]"
 health.3001.a.aptitude:0 "[aptitude|E] ของ [high_skill_option.GetUINamePossessive|U] คือ [high_skill_option.GetCourtPositionAptitude( GetCourtPositionType( 'court_physician_court_position' ) )]"
 health.3001.b:0 "[low_skill_option.GetFirstNameNoTooltip] ดูเหมือนจะกระตือรือร้น หากไม่มีอะไรอื่น"
 health.3001.b.aptitude:0 "[aptitude|E] ของ [low_skill_option.GetUINamePossessive|U] คือ [low_skill_option.GetCourtPositionAptitude( GetCourtPositionType( 'court_physician_court_position' ) )]"
 health.3001.c:0 "[mystic_option.GetFirstNameNoTooltip] อ้างว่าได้รับการฝึกฝนด้าน "การแพทย์ทางเลือก""
 health.3001.c.aptitude:0 "[aptitude|E] ของ [mystic_option.GetUINamePossessive|U] คือ [mystic_option.GetCourtPositionAptitude( GetCourtPositionType( 'court_physician_court_position' ) )]"
 health.3001.d.two:0 "ทั้งสองคนไม่ ทำให้ข้าประทับใจ"
 health.3001.d.more:0 "พวกเขาทั้งหมดไม่ ทำให้ข้าประทับใจ"
 health.3001.e:0 "[excellent_skill_option.GetFirstNameNoTooltip] เป็นที่รู้จักอย่างกว้างขวางในแวดวงวิชาการ"
 health.3001.e.aptitude:0 "[aptitude|E] ของ [excellent_skill_option.GetUINamePossessive|U] คือ [excellent_skill_option.GetCourtPositionAptitude( GetCourtPositionType( 'court_physician_court_position' ) )]"
 health.3001.d.tt:1 "ข้าไม่รับสมัครใครเป็น [GetCourtPositionType('court_physician_court_position').GetName()] ของข้า"

 #Disease treatment, by Mathilda Bjarnehed & Milla Isaksson
 health.3101.t:1 "[SCOPE.Custom('EventTitleDisease')]: ถึงเวลาสำหรับการรักษา"
 health.3101.start.desc:0 "กลิ่นอันน่าสะพรึงของยาดองเดือดพล่านและยาขี้ผึ้งบดปะทะเข้ากับประสาทสัมผัสของข้า ขณะที่ข้าเดินไปยังห้องทำงานของหมอหลวง [physician.GetFirstNamePossessive] [physician.GetSheHe|U] เงยหน้าขึ้นจากยาที่ [physician.GetSheHe] กำลังเตรียม\n\n"ถึงเวลาแล้ว [ROOT.Char.Custom('FormOfAddressForLiege')] ข้ารู้จักหลายวิธีที่จะรักษา"
 health.3101.safe_recommendation.desc:0 "แม้ว่าข้าค่อนข้างแน่ใจว่ายาต้มธรรมดาก็เพียงพอแล้ว"
 health.3101.risky_recommendation.desc:0 "ข้าอยากจะแนะนำมาตรการที่รุนแรง แต่"
 health.3101.mystic_recommendation.desc:0 "หากข้าอาจจะกล้าหาญถึงเพียงนี้ ข้าอยากจะแนะนำการรักษา... ทางเลือก แต่"
 health.3101.end.desc:1 "ทางเลือกเป็นของท่าน และของท่าน แต่เพียงผู้เดียว" [physician.GetSheHe|U] ทำหน้าบึ้ง\n\n"มันจะไม่น่าพอใจ""
 health.3101.a:0 "ทำเท่าที่จำเป็นเท่านั้น"
 health.3101.b:0 "มันสายเกินไปสำหรับความระมัดระวังแล้ว!"
 health.3101.c:0 "ข้ายินดีที่จะ... ลองสิ่งใหม่ๆ"
 health.3101.d:0 "ปล่อยข้าไว้ตามลำพัง!"
 health.3101.e:0 "ส่งคนไปตามแพทย์หลวง! เดี๋ยวนี้!"
 health.3101.e.already_looking: "เร็วๆ นี้! ความช่วยเหลืออยู่ระหว่างทาง!"
 health.3101.e_sick_physician:0 "ข้าต้องการแพทย์หลวงคนใหม่!"
 health.3101.e.tt:1 "คนรับใช้ของข้าจะค้นหาผู้ที่อาจเป็น [GetCourtPositionType('court_physician_court_position').GetName()] ได้"
 health.3101.tutorial.tt:0 "การเลือกตัวเลือกนี้จะแสดงวิธี แต่งตั้ง [GetCourtPositionType('court_physician_court_position').GetName()] ซึ่งอาจสามารถรักษาอาการป่วยของท่านได้"
 health.3101.f:0 "โอ้ [ROOT.Char.GetFaith.HighGodName] ข้าจะต้องตาย เช่นนี้หรือ...!?"
 health_3101_already_looking_tt: "ท่านกำลังค้นหา [GetCourtPositionType('court_physician_court_position').GetName()] อยู่แล้ว"

 safe_diseaste_treatment.tt:0 "การรักษาที่ปลอดภัยอาจบรรเทาอาการชั่วคราวและมีความเสี่ยงน้อย"
 risky_diseaste_treatment.tt:0 "การรักษาที่มีความเสี่ยงอาจให้ผลลัพธ์ที่ยอดเยี่ยม แต่อาจ ทำให้อาการแย่ลงหรือบาดเจ็บถาวรได้"
 mystic_diseaste_treatment.tt:0 "การรักษาแบบลึกลับนั้นคาดเดาไม่ได้ ผลลัพธ์ของพิธีกรรมแปลกๆ อาจเป็นปาฏิหาริย์ แต่อาจ ทำให้ท่านเสียสติได้..."
 safe_wound_treatment.tt:0 "การรักษาที่ปลอดภัยอาจบรรเทาความเจ็บปวดของข้าชั่วคราวและมีความเสี่ยงน้อย"
 risky_wound_treatment.tt:0 "การรักษาที่มีความเสี่ยงอาจให้ผลลัพธ์ที่ยอดเยี่ยม แต่อาจ ทำให้อาการแย่ลงหรือบาดเจ็บถาวรได้"
 no_treatment_effect.tt:0 "หากไม่ได้รับการรักษา ธรรมชาติจะดำเนินไปตามวิถีของมัน"
 deny_treatment_effect.tt:0 "จะไม่มีการรักษาใดๆ และธรรมชาติจะดำเนินไปตามวิถีของมัน"
 pick_own_treatment_effect.adult.tt:0 "[sick_character.GetTitledFirstName] จะตัดสินใจว่า [sick_character.GetSheHe] ต้องการการรักษาแบบใด"
 pick_own_treatment_effect.child.tt:0 "แพทย์หลวงจะตัดสินใจว่า [sick_character.GetTitledFirstName] จะได้รับการรักษาแบบใด"

 health.3102.t:1 "[SCOPE.Custom('EventTitleDisease')]: [ROOT.GetCharacter.Custom2('RelationToMeShort', SCOPE.sC('sick_character'))|U] ที่ป่วยของข้า"
 health.3102.preamble: "ความมืดสลัวของห้องถูกขับไล่ไปบ้างด้วยเปลวไฟที่สั่นไหว บนโต๊ะของแพทย์หลวงนอนอยู่ [sick_character.GetFirstName] ร่างของพวกเขาแข็งทื่อด้วยความคาดหวังที่หวาดกลัว\n\n"
 health.3102.start.desc:0 "ถึงเวลาตัดสินใจว่าจะรักษา [sick_character.GetFirstNamePossessive] อย่างไร"
 health.3102.start.desc_sick_physician:0 "ถึงเวลาตัดสินใจว่าจะรักษาข้าอย่างไร"
 health.3102.treatment: "มีการรักษาที่เป็นไปได้หลายวิธี ตั้งแต่แบบทั่วไปไปจนถึงแบบนอกรีต ขึ้นอยู่กับข้าที่จะตัดสินใจว่าวิธีใดเหมาะสมกับความต้องการเฉพาะของ [sick_character.GetFirstNamePossessiveNoTooltip] มากที่สุด"
 health.3102.a:0 "จงระมัดระวัง ทำเท่าที่จำเป็นเท่านั้น"
 health.3102.b:0 "ถึงเวลาสำหรับมาตรการที่รุนแรงแล้ว"
 health.3102.c:0 "มีเพียงพลังที่สูงส่งกว่าเท่านั้นที่จะช่วย [sick_character.GetHerHim] ได้ในตอนนี้"
 health.3102.c_sick_physician:0 "มีเพียงพลังที่สูงส่งกว่าเท่านั้นที่จะช่วยท่านได้ในตอนนี้"
 health.3102.d:0 "จะไม่มีการรักษา"
 health.3102.e_adult:1 "ทางเลือกขึ้นอยู่กับ [ROOT.GetCharacter.Custom2('RelationToMeShort', SCOPE.sC('sick_character'))] ของข้า"
 health.3102.e_child:1 "ข้าเชื่อมั่นในการตัดสินใจของท่าน"

 health.3103.t:1 "[SCOPE.Custom('EventTitleDisease')]: สว่างขึ้นเล็กน้อย"
 health.safe_treatment.1.desc:0 "[physician.GetTitledFirstName] ตัดสินใจว่าแนวทางการรักษาที่ดีที่สุดคือการพักผ่อน [physician.GetSheHe|U] ห้อมล้อมข้าด้วยหมอนนุ่มๆ และค่อยๆ ห่มผ้าห่มหลายชั้นให้ข้า ก่อนที่ [physician.GetSheHe] จะออกจาก [ROOT.Char.Custom('GetChambersOrTent')] ของข้า [physician.GetFirstNameNoTooltip] ก็ดึงม่านปิดให้ข้า มันเป็นเวลาเที่ยงวัน\n\nการนอนหลับเพิ่มเติม"
 health.safe_treatment.2.desc:0 "[physician.GetTitledFirstName] กล่าวโทษว่าอาการป่วยของข้าเกิดจากการรับประทานอาหารที่ไม่ดีต่อสุขภาพ เพื่อฟื้นฟูร่างกายของข้า [physician.GetSheHe] ยืนกรานให้ข้าบริโภคเฉพาะผักดิบและชาสมุนไพรเป็นเวลาหนึ่งสัปดาห์ เพื่อไม่ให้ข้าถูกล่อใจ [physician.GetSheHe] ได้ยึดขนมของข้าไป [physician.GetSheHe|U] ไม่เคยคืนมันเลย\n\nข้อจำกัดด้านอาหาร"
 health.safe_treatment.3.desc:0 "[physician.GetTitledFirstName] บอกให้ข้านอนลงบนเตียงแล้วยื่นมือให้ [physician.GetHerHim] [physician.GetSheHe] ถูและตบฝ่ามือของข้าอย่างแรงจนแดง จากนั้นก็ทำซ้ำกับฝ่าเท้าของข้า เพื่อเป็นการปิดท้าย [physician.GetSheHe] หยิกข้าเบาๆ ขึ้นลงตามแขนขา\n\nกระบวนการแปลกๆ นี้"
 health.safe_treatment.4.desc:0 "[physician.GetTitledFirstName] เสนอยาใสในขวดปิดทองให้ข้า เนื่องจากข้าเคยลิ้มรสยาบางอย่างของ [physician.GetFirstNamePossessive] มาก่อน ตอนแรกข้าจึงกังวล แต่เมื่อข้าดื่มเข้าไป ข้าไม่สามารถตรวจจับกลิ่นหรือรสชาติใดๆ ได้ ข้าสอบถามเกี่ยวกับส่วนผสม แต่ [physician.GetSheHe] บอกข้าว่าเป็นสูตรลับ\n\nยาอันลึกลับ"
 health.safe_treatment.5.desc:1 ""ผ่อนคลายลมหายใจของท่าน" [physician.GetTitledFirstName] สั่งข้า ขนนกในมือ [physician.GetHerHis] ดูราวกับไม่มีตัวตนขณะที่ [physician.GetSheHe] เริ่มปัดเบาๆ ใต้จมูกของข้า "ความชั่วร้าย จงหายไป!" [physician.GetSheHe] กระตุ้นขณะที่ข้าจามเสียงดัง\n\nการจั๊กจี้แปลกๆ"
 health.safe_treatment.6.desc:1 "[physician.GetTitledFirstName] จัดพิธีเล็กๆ ในนามของข้า เมื่อครอบครัวและคนสนิทของข้ารวมตัวกันในห้องโถงใหญ่ [ROOT.Char.Custom('DefaultPriestTitle')] ก็เทศนาเน้นย้ำถึงคุณธรรมและความเมตตาของข้า พิธีสิ้นสุดลงด้วยการสวดภาวนาเงียบๆ เป็นเวลาหนึ่งชั่วโมง\n\nการเข้าถึง [ROOT.Char.GetFaith.HealthGodName]"
 health.safe_treatment.7.desc:1 "ข้าใช้เวลาหลายเย็นกับ [physician.GetTitledFirstName] นั่งอยู่ข้างเตียง สวดท่อนต่างๆ จาก [ROOT.Char.GetFaith.ReligiousText]\n\nถ้อยคำของ [ROOT.Char.GetFaith.HealthGodName]"
 health.safe_treatment.8.desc:0 "[physician.GetTitledFirstName] เรียก [ROOT.Char.Custom('DefaultPriestTitle')] ให้นำนักร้องที่เก่งที่สุดในราชสำนักมา ซึ่งกลายเป็นเด็กหนุ่มที่มีเสียงเทเนอร์สดใส เป็นเวลาหลายวันติดต่อกัน เด็กคนนั้นร้องเพลงกล่อมข้าจนหลับ\n\nเสียงที่ผ่อนคลาย"
 health.safe_treatment.9.desc:0 "ไอน้ำลอยขึ้นจากถ้วยขณะที่ [physician.GetTitledFirstName] คนผงสีเขียวในนั้น [physician.GetSheHe|U] อธิบายสรรพคุณทางยาของสมุนไพรอย่างละเอียด ก่อนจะส่งสัญญาณให้ข้าดื่ม "รากก็อยู่ในนั้นด้วย" [physician.GetSheHe] เปิดเผยอย่างโอ้อวด\n\nสมุนไพรรสขม"
 health.safe_treatment.10.desc:0 "[physician.GetTitledFirstName] ยืนกรานว่าของเหลวในร่างกายของข้าไม่สมดุล และวิธีที่ดีที่สุดในการฟื้นฟูคือการเอาเลือดออก หลังจากปรึกษาแผนภูมิทางดาราศาสตร์แล้ว [physician.GetSheHe] ตัดสินใจว่าข้าควรถูกเอาเลือดออกจากรักแร้และขมับ\n\nการเอาเลือดออก"
 health.safe_treatment.11.desc:0 "[physician.GetTitledFirstName] บอกให้ข้าถอดเสื้อผ้าแล้วคุกเข่าโดยยกก้นขึ้น นั่นก็น่าอึดอัดพอแล้ว แต่เมื่อข้าเห็นเครื่องมือในมือ [physician.GetHerHis] ข้าเกือบจะวิ่งหนี [physician.GetSheHe|U] คงสังเกตเห็น เพราะ [physician.GetSheHe] ตบไหล่ข้าเบาๆ อย่างใจเย็นและบอกให้ข้าหยุดเกร็ง\n\nการสวนทวาร"
 health.safe_treatment.12.desc:0 "[physician.GetTitledFirstName] เข้ามาใน [ROOT.Char.Custom('GetChambersOrTent')] ของข้าพร้อมกับไหดินเผาในอ้อมแขน [physician.GetHerHis] และมานั่งข้างเตียงข้า [physician.GetSheHe|U] ดึงปลิงตัวหนึ่งออกจากไหและมองมันอย่างอ่อนโยนที่สุดก่อนจะค่อย ๆ วางมันลงบนใบหน้าข้า "อยู่นิ่ง ๆ [ROOT.Char.Custom('FormOfAddressForLiege')] อย่ารบกวนการกินของพวกมันจะดีกว่า"\n\nเหล่าปลิง"
 health.safe_treatment.13.desc:0 "เมื่อ [physician.GetTitledFirstName] เข้ามาใน [ROOT.Char.Custom('GetChambersOrTent')] ของข้า [physician.GetSheHe] ก็ตามมาด้วยกลิ่นเหม็นคลุ้ง ต้นตอของกลิ่นเหม็นคือไหในมือ [physician.GetHerHis] — "ส่วนผสมของมูลวัวและสมุนไพรสำหรับยาพอกของท่าน [ROOT.Char.Custom('FormOfAddressForLiege')]" เมื่อ [physician.GetFirstName] เริ่มป้ายมันลงบนหน้าอกข้า ข้าแทบจะอาเจียน\n\nในท้ายที่สุด ยาพอก"
 health.safe_treatment.14.desc:0 "[physician.GetTitledFirstName] นำยาต้มที่ทำจากบัคธอร์นและมะขามแขกมาให้ข้า ตอนแรกข้าคิดว่ายาไม่มีผล แต่ต่อมาในวันเดียวกัน ข้ารู้สึกปั่นป่วนในลำไส้ ซึ่ง ทำให้ข้าวิ่งไปเข้าส้วม ขณะที่ข้าร้องโหยหวนด้วยความเจ็บปวด [physician.GetFirstName] รับรองกับข้าว่าความโสโครกถูกขับออกมาพร้อมกับอุจจาระของข้า\n\nในที่สุด การชำระล้าง"
 health.safe_treatment.15.desc:0 "[physician.GetTitledFirstName] นำซากแมวที่ไหม้เกรียมมาให้ข้าและกระตุ้นให้ข้าเริ่มกิน ขณะที่ข้ากิน [physician.GetSheHe] เล่าให้ข้าฟังว่า [physician.GetSheHe] ไล่ตามแมวอ้วนตัวนั้นไปทั่วที่ดินของข้าเป็นเวลาหลายชั่วโมง ข้าคิดว่า [physician.GetSheHe] ต้องการคำชมเชยสำหรับการทำงานหนักของ [physician.GetHerHis] แต่รสชาติอันน่าขยะแขยงของอาหาร ทำให้ข้าเงียบ\n\nในที่สุด อาหารมันๆ"
 health.safe_treatment.16.desc:0 "[physician.GetTitledFirstName] นำถังที่ส่งเสียงร้องมาที่ [ROOT.Char.Custom('GetChambersOrTent')] ของข้าและบอกให้ข้าเปิดเผยร่างกายส่วนบน [physician.GetSheHe|U] คว้าคางคก ควักไส้มันด้วยมือที่คล่องแคล่ว และเริ่มวางซากที่ยังกระตุกอยู่บนหน้าอกของข้า [physician.GetSheHe|U] ทำต่อไป จนกระทั่งถังว่างเปล่าและลำตัวของข้าถูกปกคลุม\n\nการรักษาด้วยคางคก"
 health.safe_treatment.17.desc:1 "[physician.GetTitledFirstName] มาที่ [ROOT.Char.Custom('GetChambersOrTent')] ของข้าและเสนอยาให้ข้า ซึ่งมีสีเหลือง [physician.GetSheHe|U] บอกให้ข้าบีบจมูกขณะดื่ม เมื่อของเหลวอุ่นๆ ผ่านริมฝีปากข้า ข้าก็เกือบจะบ้วนมันออกมาทันที ข้าเรียกร้องให้รู้ส่วนผสมในถ้วย และ [physician.GetSheHe] เปิดเผยว่าเป็นปัสสาวะสดจากสุกรที่ตั้งท้อง\n\nของเสียจากสุกร"
 health.safe_treatment.18.desc:0 "[physician.GetTitledFirstName] จุ่มมือ [physician.GetHerHis] ลงในถังที่ [physician.GetSheHe] นำมาที่ [ROOT.Char.Custom('GetChambersOrTent')] ของข้า เมื่อ [physician.GetSheHe] ดึงมันออกมาอีกครั้ง ปลาตัวเล็กๆ ก็ดิ้นอยู่ระหว่างนิ้ว [physician.GetHerHis] "อ้าปากกว้างๆ" [physician.GetSheHe] พูดและหย่อนมันลงในปากข้า ข้าพยายามไม่สำรอกขณะที่มันจั๊กจี้ที่หลังคอของข้า\n\nอะไรก็ตามที่อยู่ในปลานั้น"
 health.safe_treatment.19.desc:0 "ของเหลวในถ้วยนั้นอุ่นและเปรี้ยว "มันจะขับไล่ความร้อนอื่นออกไป" [physician.GetTitledFirstName] อธิบาย\n\nยา"
 health.safe_treatment.20.desc:0 "เพื่อปรับสมดุลของเหลวในร่างกายของข้า [physician.GetTitledFirstName] ทำให้ข้าดื่มน้ำเกลือเพื่อกระตุ้นให้อาเจียน มันได้ผลดีมาก\n\nการล้างท้อง"
 health.safe_treatment.21.desc:0 "เพื่อกำจัดอาการป่วยของข้า [physician.GetTitledFirstName] สั่งให้ข้านอนห้อยหัวลงเป็นเวลาสองสามวัน "มันจะปรับสมดุลให้ท่าน" [physician.GetSheHe] รับรองกับข้า \n\nข้ารู้สึกเหมือนค้างคาว\n\nท่านอนแปลกๆ"

 health.3103.end.desc:0 "กลายเป็นสิ่งที่ข้าต้องการพอดี สำหรับตอนนี้ อาการที่เลวร้ายที่สุดของข้าบรรเทาลง และโลกดูสว่างขึ้นเล็กน้อย"
 health.3103.a:0 "ยอดเยี่ยมมาก [physician.GetFirstNameNoTooltip]"
 health.3104.t:1 "[SCOPE.Custom('EventTitleDisease')]: เลวร้ายยิ่งกว่า"
 health.3104.end.desc:0 "ไม่ได้ช่วยให้อาการของข้าดีขึ้นเลย อันที่จริง ข้าคิดว่าข้ารู้สึกแย่ลง!"
 health.3104.a:0 "ไปให้พ้น ข้าต้องการพักผ่อน..."

 health.3105.t:1 "[SCOPE.Custom('EventTitleDisease')]: ปาฏิหาริย์ทางการแพทย์"
 health.risky_treatment_medicine.1.desc:0 "หม้อที่ [physician.GetTitledFirstName] นำมาพร้อมกับ [physician.GetHerHim] ไปยัง [ROOT.Char.Custom('GetChambersOrTent')] ของข้าส่งเสียงหึ่งๆ แปลกๆ ก่อนที่ข้าจะหยุด [physician.GetHerHim] ได้ [physician.GetSheHe] ก็โยนมันลงบนพื้น ซึ่งมันระเบิดออกเป็นเศษเครื่องปั้นดินเผาและฝูงผึ้งที่โกรธเกรี้ยว ขณะที่แพทย์หลวงของข้าหนีออกจากห้องไป ข้าก็กลายเป็นเป้าหมายเดียวของพวกมัน"
 health.risky_treatment_medicine.2.desc:0 "ข้าไม่อยากเชื่อสายตาตัวเองเมื่อ [physician.GetTitledFirstName] ดึงมือที่ถูกตัดออกจากกระเป๋า [physician.GetHerHis] จุดดำบนนิ้วของมัน ทำให้ข้าขนลุก และข้าเรียกร้องให้รู้ว่า [physician.GetSheHe] ได้มันมาจากไหน [physician.GetSheHe|U] เพียงแค่บอกให้ข้าเงียบและเริ่มถูมือที่ถูกตัดกับหน้าอกของข้า"
 health.risky_treatment_medicine.3.desc:0 "[physician.GetTitledFirstName] นำยาชนิดที่แปลกประหลาดที่สุดมาให้ข้า มันไม่มีทั้งกลิ่นและรสชาติ มีลักษณะเหมือนของเหลวสีเงิน ยาต้มโลหะนี้กลืนง่ายพอสมควร แต่ข้าก็อดไม่ได้ที่จะรู้สึกไม่สบายใจ"
 health.risky_treatment_medicine.4.desc:0 "[physician.GetTitledFirstName] ยืนกรานว่าวิธีเดียวที่จะรักษาอาการของข้าได้คือการวิ่งเปลือยกายตอนเที่ยงคืน ในคืนพระจันทร์เต็มดวงครั้งต่อไป [physician.GetSheHe] บังคับให้ข้าถอดเสื้อผ้าและวิ่งไปในถิ่นทุรกันดาร "อย่าหยุดจนกว่าขาของท่านจะหมดแรง!" [physician.GetSheHe] ตะโกนตามหลังข้า "ขับไล่ความชั่วร้ายออกทางเหงื่อของท่าน!""
 health.risky_treatment_medicine.5.desc:0 "ผงนั้นเป็นสีเหลืองและมีกลิ่นหอมน่ากิน ข้าเสียขวัญเมื่อเห็น [physician.GetTitledFirstName] ผสมมันกับกำมะถันแล้วโรยลงบนถุงน้ำดีของบีเวอร์ที่ยังอุ่นอยู่ สัตว์ตัวนั้นถูกพบว่าติดเชื้อพิษสุนัขบ้า น้ำลายฟูมปาก แสดงอาการป่วยชัดเจน "เราใช้ความชั่วร้ายต่อสู้กับความชั่วร้าย [ROOT.Char.Custom('FormOfAddressForLiege')]""
 health.risky_treatment_medicine.6.desc:0 "[physician.GetTitledFirstName] เข้ามาหาข้าพร้อมกับมีดเล็กๆ [physician.GetSheHe|U] จับแขนข้าไว้นิ่งๆ และกรีดอย่างแม่นยำ แทบจะไม่ ทำให้ผิวหนังของข้าแตก [physician.GetSheHe|U] จากนั้นก็กดบางสิ่งที่น่ารังเกียจลงบนบาดแผล การเหลือบมองสารนั้นเพียงครั้งเดียวก็เพียงพอแล้วสำหรับข้า"
 health.risky_treatment_medicine.7.desc:0 "[physician.GetTitledFirstName] ยื่นจานที่มีสารผงสีเทาอยู่บนนั้นให้ข้า เห็นได้ชัดว่ามันประกอบด้วยสะเก็ดแผลที่บดละเอียดจากคนที่มีอาการแย่กว่าข้า [physician.GetTitledFirstName] ไม่ได้แสดงท่าทีล้อเล่นขณะที่ [physician.GetSheHe] บอกให้ข้าโน้มตัวเข้าไปและสูดดมให้มากที่สุดเท่าที่จะทำได้"
 health.risky_treatment_medicine.8.desc:0 "ผงสีแดงมีสีสันน่าดึงดูดใจ คนรับใช้คนหนึ่งทำพลาดโดยชิมมันในรูปแบบบริสุทธิ์ — ลิ้นของเขาบวมเป่ง และ [physician.GetTitledFirstName] ได้ตำหนิเขาอย่างรุนแรง [physician.GetTitledFirstName] เทเครื่องเทศลงในถ้วยน้ำและคนอย่างพิถีพิถัน ก่อนจะป้อนให้ข้าหนึ่งช้อน"
 health.risky_treatment_medicine.9.desc:0 "ข้าเบิกตาโพลงเมื่อ [physician.GetTitledFirstName] จูงแพะเข้ามาใน [ROOT.Char.Custom('GetChambersOrTent')] ของข้า กลิ่นเหม็นจากการผายลมของมัน ทำให้ข้าต้องปิดจมูก แต่หมอกลับดึงมือข้าออก "ขออภัย [ROOT.Char.Custom('FormOfAddressForLiege')] แต่นี่คือการรักษา" [physician.GetSheHe|U] แนะนำให้หายใจลึก ๆ"
 health.risky_treatment_surgery.1.desc:0 "[physician.GetTitledFirstName] ให้ยาต้มแก่ข้า ซึ่งมีรสชาติประหลาดที่สุด มัน ทำให้ข้ารู้สึกชาและเปลือกตาของข้าก็เริ่มตกลง "ข้าขออภัย [ROOT.Char.Custom('FormOfAddressForLiege')] แต่ท่านคงไม่อยากตื่นสำหรับส่วนต่อไป" [physician.GetSheHe] กล่าว ความตื่นตระหนกจู่โจมข้าและข้าพยายามลุกขึ้นจากโต๊ะผ่าตัด แต่แขนขาของข้าไม่เชื่อฟัง"
 health.risky_treatment_surgery.2.desc:0 "ผู้ช่วยของ [physician.GetTitledFirstNamePossessive] รับรองกับ [physician.GetHerHim] ว่ายา ทำให้ข้าหลับไปแล้ว โอ้ [physician.GetSheHe] ผิดไปมากแค่ไหน! ข้าไม่สามารถพูดหรือเคลื่อนไหวได้ แต่ข้ายังคงรับรู้ทุกสิ่งที่พวกเขาทำกับข้า ข้าพยายามกรีดร้องและดิ้นรน แต่ข้าเป็นนักโทษในร่างกายของตัวเอง กระบวนการดูเหมือนจะยาวนานตลอดไป..."
 health.risky_treatment_amputation.1.desc:0 "[physician.GetTitledFirstName] รัดสายรัดเส้นสุดท้าย ยึดข้าไว้กับโต๊ะผ่าตัด "ข้าจะไม่โกหกท่าน [ROOT.Char.Custom('FormOfAddressForLiege')] นี่จะเจ็บปวดอย่างแสนสาหัส แต่มันจำเป็นต้องทำ"\n\nข้าพยายามประท้วงเมื่อ [physician.GetFirstName] นำเลื่อยออกมา แต่ เนื่องจากยาต้มระงับประสาทที่ [physician.GetSheHe] ให้ข้าดื่ม ข้าพูดคำต่าง ๆ อู้อี้จนฟังไม่รู้เรื่อง"
 health.risky_treatment_disfigurement.1.desc:0 "[physician.GetTitledFirstName] แจ้งข้าว่า [physician.GetSheHe] ได้ระบุเนื้อเยื่อที่ปนเปื้อน ซึ่งเป็นต้นตอของโรคของข้า และการกำจัดมันออกไปน่าจะรักษาข้าได้ ข้าพอใจมากและตกลงที่จะผ่าตัด\n\nข้าหวังว่า [physician.GetFirstName] จะบอกข้าว่า "เนื้อเยื่อ" นั้นคือใบหน้าของข้า"
 health.risky_treatment_eye.1.desc:0 "[physician.GetTitledFirstName] ทำให้ข้าดื่มยาต้มจากฝิ่นก่อนที่จะมัดข้าไว้กับโต๊ะผ่าตัดของ [physician.GetHerHis] ข้าเกือบจะเคลิ้มหลับขณะที่ [physician.GetSheHe] เตรียมเครื่องมือ [physician.GetHerHis] แต่เมื่อ [physician.GetSheHe] ยกมีดผ่าตัดขึ้นมาที่ดวงตาข้า ข้าก็ตื่นเต็มตา "ข้าเสียใจ [ROOT.Char.Custom('FormOfAddressForLiege')] แต่เราต้องกำจัดรากเหง้าของปัญหา""
 health.3105.end.desc:0 "\n\nน่าแปลกที่ข้าไม่รู้สึกถึงอาการใดๆ อีกต่อไป..."
 health.3105.a:0 "มันคือปาฏิหาริย์!"
 
 health.3106.t:1 "[SCOPE.Custom('EventTitleDisease')]: สมดุลของเหลวในร่างกาย"
 health.3106.end.desc:0 "\n\nการรักษาเกือบจะน่ารังเกียจพอๆ กับอาการของข้า ทว่าดูเหมือนว่ามันจะได้ผล แม้ว่าข้าจะยังไม่หายสนิท แต่ข้ารู้สึกดีขึ้นมาก"
 health.3106.a:0 "ข้าจะมีชีวิตอยู่เพื่อดูวันพรุ่งนี้"

 health.3107.t:1 "[SCOPE.Custom('EventTitleDisease')]: การรักษาที่ผิดพลาดอย่างร้ายแรง"
 health.3107.death.desc:0 "\n\nเมื่อข้าตื่นขึ้น ข้ารู้สึกได้ถึงกระดูก มีบางอย่างผิดพลาด ผิดพลาดอย่างมาก"
 health.3107.end.desc:0 "\n\nข้าคิดว่ามันเป็นไปไม่ได้ที่จะรู้สึกแย่ไปกว่าที่ข้ารู้สึกอยู่แล้ว แต่ [physician.GetFirstNameNoTooltip] พิสูจน์ให้ข้าเห็นว่าข้าคิดผิด!"
 health.3107.a:0 "ข้ารู้สึก... อ่อนแอ..."
 health.3107.b:0 "สิ่งนี้จะไม่เกิดขึ้นอีก เจ้าเข้าใจข้าไหม?"
 health.3107.c:0 "เราทุกคนรู้ถึงความเสี่ยง ท่านได้รับการอภัยแล้ว"
 health.3107.d:0 "ทหาร! จับ [physician.GetHerHim] ไปขัง!"
 health.3107.d.tt:0 "เมื่ออยู่ในคุกของข้า ข้าสามารถตัดสินใจได้ว่าจะทำอย่างไรกับ [physician.GetTitledFirstName]"
 health.3107.e:0 "คนทรยศผู้นี้สมควรตาย!"
 health.3107.f:0 "โอ้ [physician.GetFirstNameNoTooltip] ท่านทำอะไรกับตัวเองลงไป?"

 health.3108.t:1 "[SCOPE.Custom('EventTitleDisease')]: พลังที่ยิ่งใหญ่กว่า"
 health.mystic_treatment_occult.cannibal.desc:0 ""ดื่มนี่สิ" [physician.GetTitledFirstName] กระซิบ แทบจะไม่ทันที่ของเหลวจะผ่านริมฝีปากข้า ความรู้สึกแปลกๆ ก็เริ่มขึ้น แขนขาของข้าชา แต่ภายใน ไฟก็ลุกโชนขึ้น...\n\n"ทีนี้ กินนี่สิ" ชิ้นเนื้อนั้นอุ่น เปียก และเหนียว ไฟชอบสิ่งนั้น มันต้องการมากกว่านี้ เมื่อ [physician.GetSheHe] ส่งแขนซีดๆ ที่เหลือให้ข้า ข้าก็ตะกละตะกลามกินจนสำรอกออกมา"
 health.mystic_treatment_occult.deviant.desc:0 "[physician.GetTitledFirstName] ให้ข้าถอดเสื้อผ้าและนวดน้ำมันทั่วผิวหนังของข้า เมื่อ [physician.GetSheHe] เลื่อนมือ [physician.GetHerHis] ไปยังส่วนที่ลับที่สุดของข้า ดวงตา [physician.GetHerHis] สบตาข้า ข้าตระหนักว่าข้าต้องการสิ่งนี้ ข้าพยักหน้า\n\nไม่นาน มืออื่นๆ ก็เข้าร่วมกับ [physician.GetFirstNamePossessive] เรียบเนียน หยาบกร้าน เหี่ยวย่น เรียว แข็งแรง เมื่อเข่าของข้าทรุดลง พวกเขาก็จับข้าไว้ และข้ายอมจำนนต่อสัมผัสของพวกเขา"
 health.mystic_treatment_occult.1.desc:0 "ถูกกักขังอยู่บนเตียง คนรับใช้บอกข้าว่าควันจากกองไฟสามารถมองเห็นได้ไกลหลายไมล์ ชีวิตของสัตว์ชั้นดีกว่าสองโหลได้สิ้นสุดลงในคืนนั้น ในการสังเวยครั้งใหญ่ ตามคำสั่งของ [physician.GetTitledFirstNamePossessive] ข้าได้ถูผิวหนังของข้าด้วยขี้เถ้าเป็นเวลาสองสัปดาห์"
 health.mystic_treatment_occult.2.desc:0 "[physician.GetTitledFirstName] สั่งให้ข้าก้าวเข้าไปในอ่างอาบน้ำที่ว่างเปล่าและทิ้งให้ข้าถอดเสื้อผ้าตามลำพัง การกลับมา [physician.GetHerHis|U] ถูกประกาศด้วยเสียง "แบะ!" ดังลั่น [physician.GetSheHe|U] ตามมาด้วยคนรับใช้และแพะครึ่งโหล ด้วยมือที่คล่องแคล่ว [physician.GetFirstNameNoTooltip] ก็คว้าแพะและเชือดคอพวกมันเหนืออ่างทีละตัว\n\nคราบบนพื้นจะไม่หายไป"
 health.mystic_treatment_occult.3.desc:1 "[physician.GetTitledFirstName] บอกข้าว่า [ROOT.Char.GetFaith.HealthGodName] ต้องการเครื่องสังเวย ต่อมาในเย็นวันนั้นข้าได้ยินเสียงกรีดร้อง\n\nตามเสียงไป ข้าพบ [physician.GetFirstNameNoTooltip] ก้มตัวอยู่เหนือศพ ความตื่นตระหนกในดวงตา [physician.GetHerHis] เลือดบนมือ [physician.GetHerHis] "มันเพื่อประโยชน์ของอาณาจักร...!" [physician.GetSheHe] หายใจหอบ"
 health.mystic_treatment_occult.4.desc:0 "[physician.GetFirstName] ให้ถุงสมุนไพรแก่ข้าและส่งข้าออกเดินทาง เพื่อค้นหา "ผู้นำทางจิตวิญญาณ" ของข้า ข้าเร่ร่อนไปในถิ่นทุรกันดารเป็นเวลาหลายวัน กินเพียงรากไม้จากถุง นอนใต้แสงดาว ในที่สุด ข้าก็รู้สึกถึงการปรากฏตัว เบื้องหน้าข้าคือสัตว์มีเขาขนาดใหญ่ ข้าหันหลังกลับ และวิ่งหนี\n\nกลับถึงบ้านอย่างปลอดภัยบนเตียงของข้า การนอนหลับหลีกเลี่ยงข้า ข้าคือสัตว์ร้ายหรือ?"
 health.mystic_treatment_occult.5.desc:0 "[physician.GetTitledFirstName] ยืนอยู่ที่ปลายเตียงของข้าขณะที่คนรับใช้จุดเทียน หม้อถูกวางไว้ในมือข้า — ตัดสินจากเสียง มันบรรจุสัตว์ตัวเล็กๆ ที่หวาดกลัวอยู่ "สิ่งมีชีวิตนี้จะแบกรับภาระของท่านแทนท่าน" [physician.GetSheHe] อธิบาย จากนั้นการสวดมนต์ก็เริ่มขึ้น"
 health.mystic_treatment_questionable.1.desc:0 "[physician.GetFirstName] นั่งข้าหน้ากระจกสูงและจุดเทียนเป็นวงกลมรอบตัวข้า "เราต้องติดต่อกับตัวตนอื่นของท่าน" [physician.GetSheHe] กล่าวอย่างสบายๆ เมื่อข้าเลิกคิ้วใส่ [physician.GetHerHim] [physician.GetSheHe] ก็วางมือบนไหล่ข้า "นี่อาจจะ... เปลี่ยนแปลงท่าน""
 health.mystic_treatment_questionable.2.desc:1 "ห้องสว่างขึ้นเพียงด้วยเปลวเทียน ขณะหันหน้าไปทางหน้าต่างทิศตะวันตก [physician.GetTitledFirstName] ทาเล็บของข้าด้วยหยดน้ำมัน ข้ารู้สึกถึงความร้อนบนผิวหนังขณะที่ [physician.GetSheHe] ยื่นมือข้าเข้าไปใกล้เปลวไฟ "อย่ากังวล [ROOT.Char.Custom('FormOfAddressForLiege')] ด้วยพระปัญญาของ [ROOT.Char.GetFaith.HealthGodName] ท่านจะได้รับการชำระล้าง""
 health.mystic_treatment_questionable.3.desc:1 ""ดวงจันทร์เรียกร้องความจงรักภักดีของท่าน" [physician.GetTitledFirstName] กล่าว ก่อนจะยื่นเค้กที่ราดด้วยบางสิ่งที่มีกลิ่นเผ็ดร้อนให้ข้า ไม่กี่นาทีหลังจากกิน ข้าเงยหน้ามองท้องฟ้ายามค่ำคืนและ แต่งบทกวีที่ยิ่งใหญ่ที่สุดในโลกขึ้นมาอย่างด้นสด ต่อมา คำเหล่านั้นก็หลุดลอยไปจากข้า..."
 health.mystic_treatment_questionable.4.desc:0 "[physician.GetTitledFirstName] ให้ข้าดื่มยาต้มที่หนักเป็นพิเศษ ทุกคืนก่อนนอน "มันคลายโครงสร้างตัวตนของท่าน ปล่อยให้วิญญาณเข้ามาในร่างกายของท่าน" [physician.GetSheHe] รับรองกับข้า "มันค่อนข้าง... ผ่อนคลายด้วย" [physician.GetSheHe] ยอมรับ ยิ้มให้ข้า"
 health.mystic_treatment_questionable.5.desc:0 "[physician.GetFirstName] บอกข้าว่าภารกิจในการตีความ [ROOT.Char.GetFaith.ReligiousText] เป็นงานที่ยาก แต่การชำระล้างด้วยไฟเป็นศิลปะที่เก่าแก่พอๆ กับโลกใบนี้ ข้าไม่รู้เลยว่า [physician.GetSheHe] จะให้ข้าเดินข้ามถ่านที่ลุกไหม้"
 health.mystic_treatment_questionable.6.desc:2 "[physician.GetTitledFirstName] บอกข้าว่า [ROOT.Char.GetFaith.HealthGodName] ต้องการการทดสอบจิตใจของข้า เราเดินทางไปด้วยกัน จนกระทั่งถึงทะเลสาบเล็กๆ จับมือกัน เราเดินลงไปในน้ำ ข้าตกใจเมื่อ [physician.GetFirstNameNoTooltip] คว้าไหล่ข้าและกดข้าลง ข้าคงหมดสติไป เพราะข้าจำไม่ได้ว่าเกิดอะไรขึ้นหลังจากนั้น..."
 health.3108.end.desc:0 "\n\nเมื่อข้าตื่นขึ้นในเช้านี้ ความเจ็บปวดและความรู้สึกไม่สบายที่ข้าคุ้นเคยได้หายไปแล้ว [physician.GetSheHe]... รักษาข้าแล้วหรือ?"
 health.3108.a:0 "ข้าไม่รู้ว่าจะรู้สึกอย่างไร... หรือจะเชื่ออะไร"

 health.3109.t:1 "[SCOPE.Custom('EventTitleDisease')]: ความรู้สึกขัดแย้ง"
 health.3109.end.desc:0 "\n\nข้ายังไม่แน่ใจว่าข้ารู้สึกอย่างไรเกี่ยวกับสิ่งที่เกิดขึ้น แต่ข้าปฏิเสธไม่ได้ว่าอาการส่วนใหญ่ของข้าหายไปตั้งแต่นั้นมา"
 health.3109.a:0 "ข้าไม่รู้ว่าข้าคาดหวังอะไร แต่นั่นไม่ใช่สิ่งที่เกิดขึ้น"

 health.3110.t:1 "[SCOPE.Custom('EventTitleDisease')]: สู่ความมืดมิด"
 health.3110.end.desc:0 "\n\nจิตใจของข้าคงถูกเปลี่ยนแปลง บิดเบือนด้วยกลอุบายอันมืดมิดบางอย่าง ข้าคงไม่ยอมทำสิ่งนี้โดยสมัครใจ ความทรงจำหลอกหลอนข้า..."

 # Punishment for mistreating important people
 health.3200.death.desc:0 "แม้ว่าข้าจะเห็นได้ชัดเจนว่าใบหน้านั้นเป็นของ [sick_character.GetTitledFirstNamePossessive] แต่มันก็ยังดูไม่เหมือน [sick_character.GetHerHim] เลย [sick_character.GetSheHe|U] ไม่ได้... อยู่ที่นั่นอีกต่อไป ส่วนที่เหลือของร่างกายถูกห่อด้วยผ้าห่อศพหนา ปกปิดรายละเอียดอันน่าสยดสยองของความล้มเหลวของ [physician.GetTitledFirstNamePossessive]"
 health.3200.failure.desc:0 "ข้าใช้เวลาครู่หนึ่งจึงจำ [sick_character.GetTitledFirstName] ได้ [sick_character.GetSheHe|U] ช้ำและบวมมาก [sick_character.GetSheHe] แทบจะดูไม่เหมือนมนุษย์ ขณะที่ข้าจับมือ [sick_character.GetHerHis] [ROOT.GetCharacter.Custom2('RelationToMeShort', SCOPE.sC('sick_character'))] ของข้าพยายามพูด แต่ไม่มีเสียงใดเล็ดลอดออกมาจากริมฝีปาก [sick_character.GetHerHis]"
 health.3200.failure.desc_2:0 "ขณะที่ข้าเข้าใกล้ [ROOT.Char.Custom('GetChambersOrTent')] ของ [ROOT.GetCharacter.Custom2('RelationToMeShort', SCOPE.sC('sick_character'))] [sick_character.GetTitledFirstNamePossessive] ข้าได้ยินเสียงกรีดร้องอันน่าสะพรึงกลัว แทบจะไม่ใช่เสียงมนุษย์และเต็มไปด้วยความเจ็บปวด ข้าพุ่งเข้าไปในห้องเพียงเพื่อพบ [sick_character.GetFirstNameNoTooltip] ล้มกองอยู่บนพื้น #EMP ปกคลุม#! ไปด้วยเลือด"
 health.3200.failure.desc_3:0 "ข้าใช้เวลาครู่หนึ่งจึงจะเข้าใจความเสียหายทั้งหมดที่ [sick_character.Custom2('MyCharacterIntroduction', ROOT.Char)] ได้ก่อขึ้นกับร่างกายของ [sick_character.GetHerHis] เอง [sick_character.GetSheHe] ปกคลุมไปด้วยเลือดจำนวนมหาศาลและยังคงกวัดแกว่งมีดด้วยท่าทางที่รุนแรง ก่อนที่ข้าจะเข้าแทรกแซงได้ [sick_character.GetSheHe] ก็จ้องมองใบมีดคมกริบด้วยความผิดหวังก่อนจะหมดสติไปทันที"
 health.3200.end.desc:0 "\n\nหมอ [physician.Custom2('InsultAdjective', ROOT.Char)] กำลังยืนอยู่ที่มุมห้อง บิดมือ [physician.GetHerHis] ไปมาอย่างกระวนกระวาย..."
 health.3200.death.tt:0 "[sick_character.GetTitledFirstName] เสียชีวิตขณะรับการรักษา"

 health.3201.desc:1 "มีบางอย่างที่ดุร้ายในดวงตาของ [ROOT.GetCharacter.Custom2('RelationToMe', SCOPE.sC('sick_character'))] [sick_character.GetFirstNamePossessive] ข้าถาม [sick_character.GetHerHim] ว่า [sick_character.GetSheHe] เห็นอะไร แต่ไม่มีคำพูดใดเล็ดลอดออกมาจากริมฝีปาก [sick_character.GetHerHis]\n\n"
 health.3201.occult.desc:0 "คนรับใช้บอกข้าว่า [physician.GetTitledFirstName] ได้ทำพิธีกรรมชั่วร้ายบางอย่าง ซึ่งเป็นสาเหตุเบื้องหลังความทุกข์ทรมานของ [sick_character.GetFirstNamePossessive] เรื่องเล่านี้ช่างน่าสยดสยอง อย่างน้อยก็ว่าได้ "
 health.3201.occult.desc_sick_physician:0 "คนรับใช้บอกข้าว่า [physician.GetTitledFirstName] ได้ทำพิธีกรรมชั่วร้ายบางอย่าง ซึ่งเป็นสาเหตุเบื้องหลังความทุกข์ทรมานของ [physician.GetHerHis] เรื่องเล่านี้ช่างน่าสยดสยอง อย่างน้อยก็ว่าได้ "
 health.3201.questionable.desc:0 "ดูเหมือนว่าการรักษา "ทางเลือก" อย่างหนึ่งของ [physician.GetFirstNamePossessive] จะผิดพลาดอย่างร้ายแรง"
 health.3201.c:0 "อย่าพูดเรื่องนี้แม้ แต่คำเดียว [physician.GetFirstNameNoTooltip]!"

 court_physician_treatment_success_message_title:0 "การรักษาสำเร็จ"
 court_physician_treatment_failure_message_title:0 "การรักษาล้มเหลว"

 inform_relatives_about_disease_treatment_effect.safe_success.desc:0 "[physician.GetTitledFirstName] ลดอาการของ [sick_character.GetTitledFirstNamePossessive]"
 inform_relatives_about_disease_treatment_effect.safe_failure.desc:0 "การรักษา [sick_character.GetTitledFirstNamePossessive] ซึ่งดำเนินการโดย [physician.GetTitledFirstName] ไม่ประสบผลสำเร็จ"
 inform_relatives_about_disease_treatment_effect.risky_critical_success.desc:0 "[physician.GetTitledFirstName] รักษา [sick_character.GetTitledFirstNamePossessive] หาย"
 inform_relatives_about_disease_treatment_effect.risky_success.desc:0 "[physician.GetTitledFirstName] ลดอาการของ [sick_character.GetTitledFirstNamePossessive] ลงอย่างมาก"
 inform_relatives_about_disease_treatment_effect.risky_failure.desc:0 "[physician.GetTitledFirstName] ทำการรักษา [sick_character.GetTitledFirstName] ผิดพลาด"
 inform_relatives_about_disease_treatment_effect.mystic_failure.desc:0 "[sick_character.GetTitledFirstName] ไม่เหมือนเดิมหลังจากพิธีกรรมที่ล้มเหลวของ [physician.GetTitledFirstNamePossessive]!"
 physician_level_up_chance_effect.t:0 "ความรู้ของ $court_physician_court_position$ เพิ่มขึ้น"
 
 # Wound treatment, by Linnéa Thimrén
 health.4000.t:1 "$health_wounded_title$ [ROOT.GetCharacter.Custom2('RelationToMeShort', SCOPE.sC('sick_character'))|U] ที่บาดเจ็บของข้า"
 health.4000.start.desc:0 "[ROOT.GetCharacter.Custom2('RelationToMe', SCOPE.sC('sick_character'))] [sick_character.GetTitledFirstName] ของข้าได้รับบาดเจ็บ"
 health.4000.infected_wound.desc:1 "และเนื้อหนังของ [sick_character.GetHerHis] ได้ติดเชื้อและบวม\n\nหากได้รับการรักษาที่ถูกต้อง และ [ROOT.Char.GetFaith.HealthGodName] เมตตา [sick_character.GetSheHe] ควรจะรอดชีวิต"
 health.4000.gangrene.desc:1 "และเนื้อหนังของ [sick_character.GetHerHis] ได้ติดเชื้อและตาย\n\nความดำคล้ำกำลังลุกลามไปทั่วผิวหนังของ [sick_character.GetHerHis] และมีเพียง [ROOT.Char.GetFaith.FateGodName] เท่านั้นที่รู้ว่า [sick_character.GetSheHe] จะรอดชีวิตหรือไม่"
 health.4000.close_to_death_wounded.desc:0 "และการบาดเจ็บนั้นลึกมาก ทุกลมหายใจ [sick_character.GetHerHis|U] คือการต่อสู้ และข้าเกรงว่ามีเพียงปาฏิหาริย์เท่านั้นที่จะช่วย [sick_character.GetHerHim] ได้"
 health.4000.very_wounded.desc:0 "และการบาดเจ็บนั้นลึก ข้าเกรงว่าร่างกายของ [sick_character.GetHerHis] จะไม่แข็งแรงพอที่จะต่อสู้กับสิ่งนี้ได้ด้วยตัวเอง ข้ารู้สึกถึงความตายวนเวียนอยู่ข้างเตียง [sick_character.GetHerHis]"
 health.4000.wounded.desc:0 "และ [sick_character.GetSheHe] เจ็บปวดอย่างเห็นได้ชัด อาการบาดเจ็บเล็กน้อย แต่ความเจ็บป่วยทางกายไม่ใช่เรื่องที่จะมองข้ามได้"
 health.4000.a:0 "ไม่มีอะไรที่สามารถทำได้"

 health.4001.start.desc:0 ""ถึงเวลาที่จะรักษาบาดแผลของท่านแล้ว""
 health.4001.safe_recommendation.desc:0 "ข้าแน่ใจว่าการรักษาแบบง่ายๆ ก็เพียงพอแล้ว แต่"
 health.4001.gangrene.desc:0 "เนื่องจากความตายกำลังแพร่กระจายไปทั่วเนื้อหนังแล้ว ข้าเกรงว่าข้าต้องแนะนำ... มาตรการ #EMP ที่รุนแรง#! แต่"
 health.4001.infection.desc:0 "เนื่องจากบาดแผลติดเชื้อ ข้าต้องแนะนำมาตรการที่รุนแรง แต่"
 health.4001.risky_recommendation.desc:0 "ข้าแนะนำมาตรการที่รุนแรง แต่"

 health.4002.start.desc:0 ""ถึงเวลาที่จะรักษา [ROOT.GetCharacter.Custom2('RelationToMeShort', SCOPE.sC('sick_character'))] ของท่านแล้ว""
 health.4002.start.desc_sick_physician:0 ""ถึงเวลาที่จะรักษาข้าแล้ว""

 health.4101.t:1 "$health_wounded_title$ การเยียวยา"
 health.4101.desc_infection:0 "ขณะที่ [physician.GetFirstName] เริ่มบดสมุนไพรและน้ำผึ้งเข้าด้วยกันอย่างเบามือ ข้าคิดว่า [physician.GetSheHe] กำลังล้อเล่น — แน่นอนว่าพืชสีเขียวไม่สามารถช่วยข้าได้ ขณะที่ [physician.GetSheHe] ทายาพอกลงบนบาดแผลที่ปวดร้าวของข้า มัน"
 health.4101.desc_1:0 "ขณะที่ [physician.GetFirstName] เทไวน์ขวดหนึ่งลงบนบาดแผลของข้า ความเจ็บปวดนั้นเกินกว่าสิ่งที่บาดแผลเองได้นำมาให้ข้า\n\n"โปรดอดทน [ROOT.Char.GetTitleTierName] ของข้า จำเป็นต้องขับไล่ความเน่าเสียภายในออกไป"\n\nและแน่นอน หลังจากพันแผลอย่างแน่นหนา มันก็"
 health.4101.desc_2:0 "[physician.GetFirstName] ร้อยเข็มอย่างรวดเร็วและเริ่มเย็บบาดแผลของข้าราวกับว่า [physician.GetSheHe] กำลังทำงานเย็บปักถักร้อยอยู่รอบกองไฟ ภาพรอยเย็บที่ยึดเนื้อหนังของข้าไว้ด้วยกันช่างน่าสยดสยอง! เมื่อเวลาผ่านไป มัน"
 health.4101.desc_end:0 "ก็เริ่มหายดีในไม่ช้า"
 health.4101.a:0 "ยอดเยี่ยมมาก [physician.GetFirstNameNoTooltip]!"

 health.4102.t:1 "$health_wounded_title$ ปวดร้าว"
 health.4102.desc_infection:0 "ถุงที่ [physician.GetFirstName] ถือเข้ามาใน [ROOT.Char.Custom('GetChambersOrTent')] ของข้าเคลื่อนไหวได้เอง ภายในกระตุกราวกับมีชีวิต ขณะที่ [physician.GetFirstNameNoTooltip] ดึงปลิงที่ดิ้นไปมาออกมา ข้ารู้สึกว่าใบหน้าของข้าซีดเผือด "อยู่นิ่ง ๆ ตอนนี้ [ROOT.Char.GetTitleTierName] ของข้า..."\n\nไม่ว่าผลที่ [physician.GetSheHe] หวังไว้จะเป็นอย่างไร มันก็ไม่ใช่สิ่งนี้อย่างแน่นอน ขณะที่สิ่งมีชีวิตเหล่านั้นดูดเลือดข้า มันก็"
 health.4102.desc_end:0 "ไม่ได้ช่วยปรับสมดุลของเหลวในร่างกายของข้าเลย และความเจ็บปวดก็ยิ่งเลวร้ายลง"
 health.4102.a:0 "อ๊าก...! อย่าแตะต้องข้า!"

 health.4103.t:1 "$health_wounded_title$ มือแห่งการเยียวยา"
 health.4103.risky_treatment_medicine.1.desc:0 "เมื่อ [physician.GetFirstName] จุดไฟใน [ROOT.Char.Custom('GetChambersOrTent')] ของข้า ข้าสันนิษฐานว่า [physician.GetSheHe] ตั้งใจให้ความร้อนช่วยปรับสมดุลของเหลวในร่างกายของข้า อย่างไรก็ตาม ขณะที่ผู้ช่วย [physician.GetHerHis] เริ่มมัดข้าไว้กับเตียง ข้าสังเกตเห็นแท่งเหล็กกำลังร้อนขึ้นในเปลวไฟ"
 health.4103.risky_treatment_disfigurement.1.desc:0 "[physician.GetFirstName] เห็นความสยดสยองของข้าขณะที่ [physician.GetSheHe] นำมีดยาวและเข็มงอออกมาจากกระเป๋า [physician.GetHerHis] "เพื่อให้ร่างกายของท่านหายดี เราต้องกำจัดเนื้อเยื่อที่ได้รับผลกระทบทั้งหมดและปิดบาดแผล"\n\nข้าไม่รู้ว่าอะไรเจ็บปวดที่สุด — ความเจ็บปวดแสบร้อนของเนื้อที่ฉีกขาดและความรู้สึกดึงของเข็มผ่านผิวหนัง หรือภาพของตัวเองหลังจากนั้น"
 health.4103.end.desc:0 "\n\nน่าประหลาดใจที่ข้าพบว่าร่างกายของข้ากำลังฟื้นตัวในไม่ช้า!"

 health.4104.t:1 "$health_wounded_title$ กำลังฟื้นตัว"
 health.4104.end.desc:0 "\n\nหลังจากผ่านการรักษานั้นมา ข้าพบว่าเป็นการยากที่จะหาความสุขในการฟื้นตัวของร่างกาย แต่ข้ากำลังดีขึ้น"

 health.4105.t:1 "$health_wounded_title$ หายนะมาเยือน"
 health.4105.end.desc:0 "\n\nข้าไม่เชื่อว่าข้าจะเจ็บปวดได้มากกว่านี้ แต่ข้าก็ได้รับการพิสูจน์ในไม่ช้าว่าข้าคิดผิด"


