 # Hired an Assassin
 murder_outcome_reworked.0001.desc.assassin_present_at_location.consort: "[assassin.GetFirstName] ในฐานะ [assassin.Custom2('GetYourConsortType', target)] ของ [target.GetHerHis] แน่นอนว่าได้เข้าประจำที่แล้ว: ทั้งหมดที่[assassin.GetSheHe]ต้องทำคือรอให้ [target.GetFirstNameNoTooltip] หลับใหล ชักมีดที่เตรียมไว้จากใต้หมอนของ[assassin.GetHerHis] และเชือดคอหอยของ[target.Custom2('InsultNoun', ROOT.Char)]นั่น เชือกที่โยนจากหน้าต่าง รอยกรีดตื้นๆ ที่ทำขึ้นเองสองสามแห่ง และร่องรอยการต่อสู้ที่เตรียมไว้ล่วงหน้าด้านล่าง ช่วยเสแสร้งการหลบหนีของนักฆ่า "ตัวจริง" ได้เป็นอย่างดี"
 murder_outcome_reworked.0001.desc.hired_assassin.assassin_present_at_location: "[assassin.GetFirstName] ดำเนินการตามแผนของเราได้อย่างสมบูรณ์แบบ ในยามวิกาล [assassin.GetSheHe] ลอบเร้นผ่านช่องว่างของการลาดตระเวน ปล่อยตัว[assassin.GetHerselfHimself]เข้าไปในห้องของเหยื่อด้วยกุญแจที่ขโมยมา และจบชีวิตอันน่าสังเวชของ [target.GetFirstNamePossessiveNoTooltip] ลงด้วยเสียงครืดคราดเปียกแฉะ"
 murder_outcome_reworked.0001.desc.hired_assassin.assassin_remote_working: "ลูกจ้างของ [assassin.GetFirstNamePossessive] ดำเนินการตามแผนของเราได้อย่างสมบูรณ์แบบ ในยามวิกาล [dummy_assassin_gender.GetWomanMan] ผู้นั้นลอบเร้นผ่านช่องว่างที่สอดแนมไว้ในการลาดตระเวน ปล่อยตัว[dummy_assassin_gender.GetHerselfHimself]เข้าไปในห้องของเหยื่อด้วยกุญแจที่ขโมยมา และจบชีวิตอันน่าสังเวชของ [target.GetFirstNamePossessiveNoTooltip] ลงด้วยเสียงครืดคราดเปียกแฉะ"
 murder_outcome_reworked.0002.desc: "$murder_outcome.5001.hired_assassin$"
 murder_outcome_reworked.0003.desc: "นักฆ่าทำพลาดครั้งใหญ่ในช่วงเวลาที่ละเอียดอ่อนที่สุด! [target.GetFirstNameNoTooltip] ตื่นขึ้นมาเห็นร่างน่าสะพรึงกลัวในชุดคลุมสีดำมืดยืนอยู่ข้างเตียงของ [target.GetHerHis] และกรีดร้องขอความช่วยเหลือทันที ทำให้สายลับของเราที่ตกใจต้องรีบหนีไป"
 murder_outcome_reworked.0004.desc: "เสียงมือไม้ซุ่มซ่ามและคำสบถแผ่วเบาปลุกข้าให้ตื่นจากการหลับใหล\n\nใกล้ตัวข้า—#EMP ใกล้เกินไปจนน่าอึดอัด#!—มีร่างหนึ่งในชุดคลุมสีดำมืดยืนอยู่ ดูเหมือนจะตกใจพอๆ กับข้า เสียงกรีดร้องขอความช่วยเหลืออย่างกะทันหันของข้า ทำให้มันรีบหนีไป ขณะที่ทหารยามของข้ารีบเข้ามา"
 
 # Hired A Gang Of Thugs
 murder_outcome_reworked.0011.desc: "มันไม่ได้ต้องใช้อะไรมากนักจริงๆ—เพียงแค่กลุ่มโจรผู้สิ้นหวังที่ละโมบในเงินตราและโอกาสที่สร้างขึ้น เพื่อให้พวกเขาลงมือ— แต่ผลลัพธ์นั้น #EMP ยอดเยี่ยม#! การตะลุมบอน ทำให้ผู้คุ้มกันของ [target.GetHerHis] ไม่ทันตั้งตัวโดยสิ้นเชิง เปิดโอกาสให้หนึ่งในพวกอันธพาลจัดการเจ้าสารเลวนั่นเข้าที่ตาพอดี"
 murder_outcome_reworked.0012.desc.alley: "ข้าและคณะผู้ติดตามกำลังเดินทางผ่านตรอกซอกซอยของ [target.GetCurrentLocation.GetName],"
 murder_outcome_reworked.0012.desc.wilderness: "ข้าและคณะผู้ติดตามกำลังเดินทางผ่านถิ่นทุรกันดารของ [target.GetCurrentLocation.GetName],"
 murder_outcome_reworked.0012.desc: "เมื่อเสียงกรีดร้องอันน่าขนลุกดังแทรกเข้ามาในหมู่พวกเรา\n\nดูเหมือนจะมาจากที่ไหนก็ไม่รู้ พวกเราถูกโจมตีโดยกลุ่มคนพาล! ลูกธนูและดาบปลิวว่อนอย่างรวดเร็ว ความดุร้ายอย่างแท้จริงและความกระหายในการฆ่าฟันทำลายล้างทหารยามของข้าในชั่วพริบตา ไม่เต็มใจที่จะให้การซุ่มโจมตีนี้เป็นหลุมศพของข้า ข้าจึงหลบหนี พุ่งไปยังจุดที่ปลอดภัยกว่า จากนั้น เหนือเสียงอึกทึกของการต่อสู้ ข้าได้ยินเสียงสายธนูที่ดังกังวานเพียงเส้นเดียว"
 murder_outcome_reworked.0013.desc: "แผนของเราดู...สมบูรณ์แบบมาก...สิ่งเบี่ยงเบนความสนใจที่สร้างขึ้น ฝูงโจรผู้สิ้นหวัง และการซุ่มโจมตีอย่างกะทันหัน มัน #EMP ควรจะ#! เป็นหลุมศพของ [target.GetFirstNamePossessiveNoTooltip] แต่ทหารยามโง่เง่าของ [target.GetHerHis] กลับเอาตัวเข้ารับทุกหมัด ทุกดอกธนู หรือทุกคมดาบ รวมกำลังกัน และโต้กลับ ลูกจ้างของเราล้มตายเป็นเบือ"
 murder_outcome_reworked.0014.desc: "เมื่อเสียงกรีดร้องอันน่าขนลุกดังแทรกเข้ามาในหมู่พวกเรา\n\nดูเหมือนจะมาจากที่ไหนก็ไม่รู้ พวกเราถูกโจมตีโดยกลุ่มคนพาล! การโจมตีของพวกมันดุร้าย แต่เทียบไม่ได้กับความโกรธเกรี้ยวของทหารยามของข้า และเราก็กรูกันออกไปเผชิญหน้ากับพวกมัน การตะลุมบอนอันดุเดือดจึงเกิดขึ้น โดยพวกอันธพาล #EMP เห็นได้ชัด#! ว่ามุ่งเป้ามาที่ข้าเป็นหลัก มีเพียงคนโง่เท่านั้นที่จะไม่รู้ว่านี่คือความพยายามลอบสังหาร"

 # Poisoning
 murder_outcome_reworked.0021.desc: "ใช้เวลาหลายสัปดาห์ในการวางรากฐานสำหรับแผนของข้า: อาหารจานยาพิษ เหมาะสำหรับ [target.GetWomanMan] ผู้มีสถานะ เช่น [target.GetHerHis] เป็นคนโง่เสมอ [target.GetFirstNameNoTooltip] พิสูจน์แล้วว่าไม่สามารถได้กลิ่นยาพิษผ่านสมุนไพรต่างแดนที่โรยอยู่บนเป็ดปนเปื้อนได้ เห็นได้ชัดว่าไม่ทันสังเกตเห็นรสขมร้ายแรง จนกระทั่งมันสายเกินไป มากเกินไปแล้ว"
 murder_outcome_reworked.0022.desc: "ข้ากำลังเพลิดเพลินกับเป็ดย่างชั้นเลิศในงานเลี้ยงของข้าเมื่อ... รสขมประหลาดอะไรนี่ในรสชาติที่ตามมา? พ่อครัวโง่นั่นต้อง—\n\nลำคอของข้าบวมเป่ง บางสิ่งที่ข้นและหนักหน่วงระเบิดในลำคอของข้า ทำให้การมองเห็นของข้ามัวลงด้วยอาการปวดหัวตุบๆ ที่ถาโถมเข้าใส่หน้าผากของข้าราวกับพายุโหมกระหน่ำ ทำไม... ทำไมการมองเห็นของข้าจึงมัวและมืดลง เช่นนี้ ณ ที่ใดที่หนึ่ง เสียงหัวเราะอันห่างไกลเปลี่ยนเป็นเสียงกรีดร้องด้วยความหวาดกลัว ข้าตั้งสติไม่ได้ #DIE1 ข้าคิดอะไรไม่ออก#! #DIE2 ข้าไม่สามารถ...#!"
 murder_outcome_reworked.0023.desc: "#EMP เจ้าโง่!#! เป็นไปได้อย่างไรที่จะต้องมีพวกมันสักคนมาทำลายแม้กระทั่งแผนการที่สมบูรณ์แบบที่สุดเสมอ?!\n\nเป็ดพร้อมเสิร์ฟแล้ว กลิ่นยาพิษถูกซ่อนไว้อย่างมีศิลปะด้วยสมุนไพรกลิ่นหอมหวาน ความเงียบของเหล่าพ่อครัวถูกซื้อไว้ด้วยเงินจำนวนมาก... แต่กระนั้น คนรับใช้โง่เง่าคนหนึ่ง #EMP ก็ดัน#! แอบชิมอาหารจานนั้น เพียง เพื่อที่จะล้มลงตายทันทีต่อหน้า [target.GetFirstNameNoTooltip]!"
 murder_outcome_reworked.0024.desc: "ขณะที่ข้ากำลังจะกัดเป็ดชิ้นที่ชุ่มฉ่ำที่สุดเท่าที่ข้าเคยเห็นมา คนรับใช้คนหนึ่งของข้าก็ล้มลง หน้าคว่ำลงบนโต๊ะและกุมลำคอของตนเอง เขาแอบชิมอาหารของข้า!\n\nอย่างน้อยที่สุด เขาก็ทำหน้าที่เป็นคำเตือนว่าอย่าแตะต้องเป็ดตัวนั้น ขณะเดียวกันก็ได้รับโทษอันสาสมสำหรับอาชญากรรมของเขา"
 
 # Creepy-Crawly
 murder_outcome_reworked.0031.desc: "แผนได้ผลราวกับเวทมนตร์: [SCOPE.Custom('VenomousCreature')] ล้ำค่าของข้ากำลังรอ [target.GetFirstNameNoTooltip] อยู่ในเตียงของ [target.GetHerHis] เมื่อ [target.GetSheHe] เข้านอน เงียบเชียบและพร้อมที่จะโจมตีเมื่อถูกยั่วยุครั้งแรก แล้ว [target.GetFirstNameNoTooltip] ก็ขยับตัว"
 murder_outcome_reworked.0033.desc: "แผนนี้ ถูกกล่าวอ้างว่า รัดกุมที่สุดแล้ว: [SCOPE.Custom('VenomousCreature')] กำลังรอ [target.GetFirstNameNoTooltip] อยู่ในเตียงของ[target.GetHerHis] เมื่อ[target.GetSheHe]กลับมาพักผ่อนในยามค่ำคืน [target.GetSheHe]เพียงแค่เอนกายลงและปล่อยให้เจ้าสัตว์เลื้อยคลานตัวน้อยทำงานของมัน! แต่[target.Custom2('InsultNoun', ROOT.Char)]นั่นกลับสังเกตเห็นความเคลื่อนไหวที่น่าสงสัยในผ้าห่ม และสังหาร[SCOPE.Custom('VenomousCreatureType')]ก่อนที่มันจะทันได้ฉกกัด"
 murder_outcome_reworked.0034.desc: "ขณะที่ข้าเข้านอน การเคลื่อนไหวที่น่าสงสัยในผ้าห่มบนเตียงของข้าดึงดูดความสนใจของข้า ข้าดึงผ้าห่มกลับอย่างระมัดระวังเพื่อไม่ให้แขกที่ไม่ได้รับเชิญตกใจ เพียงเพื่อจะพบ [SCOPE.Custom('VenomousCreatureType')] กำลังรอข้าอยู่!\n\n"
 murder_outcome_reworked.0034.desc_unknown: "ข้าไม่สามารถระบุได้อย่างแน่ชัดว่าเจ้าตัวเล็กน่าขนลุกนี่คืออะไร แต่ข้าสงสัยว่ามันไม่เป็นมิตร"
 murder_outcome_reworked.0034.desc_end: "โดยไม่ลังเลแม้ แต่น้อย ข้าคว้ากริชของข้าและแทงเจ้าสัตว์ร้ายนั่นให้แน่นิ่งอยู่กับที่"
 
 # Riled-Up Mob
 murder_outcome_reworked.0041.desc: "ฝูงชนชาวนาที่โกรธแค้นและถูกปลุกปั่นกำลังรอ [target.GetFirstNameNoTooltip] อยู่ระหว่างทางที่ [target.GetHerHis] ผ่านเมือง\n\nเพียงแค่เห็น [target.GetLadyLord] ขี่ม้าผ่านไปอย่างไม่ใส่ใจ ก็เพียงพอให้พวกเขาระเบิดความรุนแรงถึงขั้นฆ่าฟันออกมา ทหารยามไม่กี่คนที่ติดตามเจ้านายของตนไร้กำลังต่อกรกับความโกรธแค้นอันมืดบอดของฝูงชนที่กระหายเลือด; [target.GetFirstNameNoTooltip] ถูกเหยียบย่ำ ทุบตี และแทงจนจำไม่ได้—เกินกว่าจะมีโอกาสรอดชีวิตใดๆ"
 murder_outcome_reworked.0042.desc: "ข้ามัว แต่จมอยู่ในความคิดขณะขี่ม้าผ่านเมือง จึงไม่ได้ใส่ใจกับเสียงพึมพำอย่างประหม่าของทหารยาม หรือฝูงชนที่เพิ่มมากขึ้น ซึ่งขวางทางเราอยู่ กว่าข้าจะสังเกตเห็น ก็สายเกินไปเสียแล้ว\n\nชาวนาที่โกรธแค้นล้อมรอบพวกเรา ฉุดกระชากเราลงจากหลังม้า และทุบตีเราอย่างไร้ความปรานี ขณะที่การทุบตีอย่างไม่หยุดยั้งถาโถมเข้าใส่ข้า มากมายจนนับไม่ถ้วน การมองเห็นของข้าถูกบดบังด้วยเลือด จากนั้นทุกสิ่งก็มืดดำลง"
 murder_outcome_reworked.0043.desc: "ทุกอย่างกำลังไปได้สวย: ผู้ปลุกปั่นของข้าประสบความสำเร็จในการรวบรวมฝูงชนชาวนาและปลุกเร้าจิตวิญญาณของพวกเขาต่อต้าน [target.GetFirstNameNoTooltip] อย่างเพียงพอ\n\nอย่างไรก็ตาม เมื่อ [target.GetFirstNameNoTooltip] ปรากฏตัว [target.GetHerHis] พร้อมกับองครักษ์ติดอาวุธ ความกระหายเลือดของฝูงชนก็ระเหยหายไปเหมือนหิมะในแสงแดด! มีเพียงผู้หลงเหลือไม่กี่คนที่โจมตี และพวกเขาก็ถูกทหารปราบปรามอย่างรวดเร็ว"
 murder_outcome_reworked.0044.desc: "ขณะที่ข้าขี่ม้าผ่านเมืองพร้อมคณะผู้ติดตาม ข้าอดไม่ได้ที่จะสังเกตเห็นฝูงชนที่เพิ่มมากขึ้นล้อมรอบเราจากทุกทิศทาง\n\nโชคดีที่เช้านี้ข้าตัดสินใจออกเดินทางพร้อมกับกลุ่มทหารติดอาวุธอย่างดีจำนวนมาก ซึ่งภาพที่เห็นนั้นช่วยลดความไม่พอใจของฝูงชนได้อย่างน่าอัศจรรย์ เมื่อชาวนากลุ่มเล็กๆ ที่ดูโกรธแค้นพยายามโจมตีเรา ทหารยามของข้าก็ฟันพวกเขาล้มลงอย่างง่ายดาย ทำให้พวกไม่เอาไหนที่เหลืออยู่กระจัดกระจายไป"
 
 # Bricked Up Alive
 murder_outcome_reworked.0051.desc: "แผนนี้งดงามในความเรียบง่ายของมัน: ข้าเชิญ [target.GetFirstNameNoTooltip] มาดื่ม โดยรู้ดีว่า [target.GetSheHe] จะหยุดไม่ได้จนกว่าจะเมาหัวราน้ำ จากนั้น เจ้าโง่นั่นตามข้าลงไปที่ห้องใต้ดินโดยไม่อิดเอื้อนและหลับไปในทันที [target.GetSheHe|U] ไม่แม้ แต่จะขยับตัวขณะที่คนรับใช้ของข้าก่อกำแพงปิดทางเข้าห้อง #EMP ตลอดกาล#!."
 murder_outcome_reworked.0053.desc: "ทุกอย่างเป็นไปตามแผน: ข้าเชิญ [target.GetFirstNameNoTooltip] มาดื่ม โดยรู้ดีว่า [target.GetSheHe] จะหยุดไม่ได้จนกว่าจะเมาหัวราน้ำ จากนั้น เจ้าโง่นั่นตามข้าลงไปที่ห้องใต้ดินโดยไม่อิดเอื้อนและหลับไปในทันที คนรับใช้ของข้าเพียงแค่ต้องก่อกำแพงและผนึก [target.GetHerHim] ไว้ข้างใน แต่ดูเหมือนว่าพวกเขา #EMP เหนื่อยเกินไป#! และทำงานไม่เสร็จ ดังนั้น [target.GetFirstNameNoTooltip] จึงหนีรอดไปได้!"
 
 # Sink A Boat They're On
 murder_outcome_reworked.0061.desc: "เรือล่มตลอดเวลา มันเป็นเรื่องจริงของชีวิต บางครั้ง พวกมันก็ #EMP ได้รับการช่วยเหลือ#! ให้จมลงด้วยการดัดแปลงบางอย่าง ในเวลาที่พวกมันอยู่ห่างจากชายฝั่งมากเกินไปเพียงเล็กน้อยพอดี อ้อมกอดอันเย็นเยียบของทะเลเปิดนั้นน่าตกใจ พวกเขาบอกข้ามา ข้าคงถาม [target.GetFirstNameNoTooltip] ได้ ถ้า [target.GetSheHe] ไม่ได้จมน้ำตายไปเสียก่อน ช่างเป็น #EMP โศกนาฏกรรม#! ที่แท้จริง"
 murder_outcome_reworked.0062.desc_port: "ข้าพบว่าตนเองอยู่บนเรือท้องถิ่นเพื่อการเดินทางตรวจตราสั้นๆ ชายฝั่งยังคงมองเห็นอยู่ใกล้ๆ และจิตใจของข้าจดจ่ออยู่กับรายงานบางอย่างจนแทบไม่ได้ยินเสียงแตกดังลั่นอย่างกะทันหันและเสียงกรีดร้องของกะลาสี"
 murder_outcome_reworked.0062.desc_travel: "ข้ารักทะเลเปิด! แสงอาทิตย์จุมพิตใบหน้าข้า สายลมพัดเสื้อคลุมของข้าให้สะบัดไปมา กลิ่นเค็มสดชื่นของน้ำทะเลที่อบอวลในจมูก เสียงแตกน่าขนลุกพร้อมกับเสียงกรีดร้องอย่างบ้าคลั่งจากกะลาสี— เดี๋ยว #EMP อะไรนะ#!?!"
 murder_outcome_reworked.0062.desc: "\n\nข้าไม่มีเวลาตอบสนองขณะที่เสากระโดงเรือที่หักโค่นลงมาทับข้า ทำให้ลมหายใจทั้งหมดออกจากปอดและเหวี่ยงข้าตกทะเล ความตกใจจากการกระแทกกับน้ำเย็นจัดการส่วนที่เหลือ ขณะที่เสื้อผ้าหนักๆ ของข้าดึงข้าลง...สู่ใต้เกลียวคลื่น..."
 murder_outcome_reworked.0063.desc: "เรือล่มตลอดเวลา มันเป็นเรื่องจริงของชีวิต หรืออย่างน้อย มัน #EMP ควรจะ#! เป็น เช่นนั้น! มันยากแค่ไหนกันที่จะก่อวินาศกรรมเศษขยะลอยน้ำชิ้นหนึ่ง เพื่อให้มันจมลงใต้เกลียวคลื่น พร้อมกับ [target.GetFirstNameNoTooltip]?!\n\nเห็นได้ชัดว่ามันยากเกินไปสำหรับผู้สมรู้ร่วมคิดของข้า เนื่องจากเรือของ [target.GetFirstNamePossessiveNoTooltip] กลับมาได้อย่างปลอดภัยโดยมีเพียงเหตุขัดข้องเล็กน้อยระหว่างทาง เหตุขัดข้องที่จัดฉากขึ้นอย่างชัดเจนและอาจถึงแก่ชีวิตได้"
 murder_outcome_reworked.0064.desc: "เรือของข้ากำลังแล่นอย่างสงบในยามอาทิตย์อัสดงเมื่อเสียงแตกดังลั่นและเสียงกรีดร้องอย่างบ้าคลั่งของกะลาสีดึงดูดความสนใจของข้า ในชั่วขณะหนึ่ง ข้าพบว่าตนเองถูกทหารยามคนหนึ่งดึงตัวออกไปขณะที่ส่วนหนึ่งของเสากระโดงเรือหล่นลงมาหยุดอยู่ตรงหน้าข้าพอดี\n\nความเสียหายต่อเรือนั้นมากพอสมควร แต่กัปตันมั่นใจว่าเราจะกลับไปยังท่าเรือที่ใกล้ที่สุดได้อย่างปลอดภัย และที่สำคัญที่สุด ไม่มีใครได้รับบาดเจ็บ"
 
 # Poisoned Drink
 murder_outcome_reworked.0071.desc: "ผู้สมรู้ร่วมคิดของข้าเข้าถึงสิ่งใดมิใช่แค่ถ้วยส่วนตัวของ [target.GetFirstNamePossessiveNoTooltip] ในอาหารค่ำมื้อสุดท้ายของ[target.GetHerHis]! โดยไม่มีใครสังเกต พวกเขาเทยาพิษร้ายแรงเพียงไม่กี่หยดลงในเครื่องดื่มของ[target.GetHerHis] [target.Custom2('InsultNoun', ROOT.Char)]ผู้น่าสงสารนั่นดื่มถ้วยทั้งใบในอึกเดียวและสิ้นใจก่อนที่จะทันรู้ตัวด้วยซ้ำว่าเกิดสิ่งใดขึ้น!"
 murder_outcome_reworked.0073.desc: "ผู้สมรู้ร่วมคิดของข้าลอบนำถังยาพิษเข้าไปในครัวของ [target.GetFirstNamePossessiveNoTooltip] ได้สำเร็จ และเตรียมเสิร์ฟเครื่องดื่มที่ปนเปื้อนเต็มถ้วยให้[target.GetHerHim] ความคิดเรื่องถังนั่นเป็นความผิดพลาด\n\nก่อนที่[target.Custom2('InsultNoun', ROOT.Char)]นั่นจะทันได้ยกถ้วยขึ้นจรดริมฝีปากของ[target.GetHerHis] เหล่าคนรับใช้ก็พรวดพราดเข้ามาในห้อง ประกาศว่ามีคนอื่นที่ดื่มจากถังเดียวกันได้สิ้นใจตายทันที"
 murder_outcome_reworked.0074.desc: "ข้ากำลังเพลิดเพลินกับอาหารค่ำในยามเย็น เช่นทุกวัน ถ้วยอันงดงามที่เต็มเปี่ยมวางอยู่ตรงหน้าข้า ช่างยั่วยวนใจยิ่งนัก ในที่สุดเมื่อข้ายื่นมือไปหามัน เหล่าคนรับใช้กลุ่มใหญ่ก็พรวดพราดเข้ามาในห้องพร้อมกรีดร้อง "[ROOT.Char.Custom('FormOfAddressForLiege')|U] หยุดก่อน! มันมียาพิษ! พวกเราคนหนึ่งดื่มจากถังเดียวกันและล้มลงสิ้นใจทันที!" มือของข้าหยุดค้างอยู่กลางอากาศ"
 
 #################################################
 # Outcomes — Children

 # Left Child In Forest
 murder_outcome_reworked.4001.desc: "[target.GetSheHe|U] ตื่นเต้นมากกับการเดินทางไปป่าของ [target.GetHerHis]! น่าเศร้าที่ทุกคนรู้ว่าป่าไม่ใช่สถานที่สำหรับเด็ก—เด็กเกินไป #EMP ไร้เดียงสา#! เกินไป—มันง่ายมากที่พวกเขาจะถูกพัดพาไปโดยความกระตือรือร้นของตนเองจนหลงทิศทาง หลงจากผู้ดูแล และหลงทางกลับบ้าน พวกเขาไม่เคยกลับมา เช่นเดียวกับ [target.GetFirstNameNoTooltip] ตัวน้อย ช่างเป็นโศกนาฏกรรม"
 murder_outcome_reworked.4003.desc: "มันควรจะง่ายมาก! ป่าไม่ใช่สถานที่สำหรับเด็ก: มืด อันตราย เต็มไปด้วยหุบเหว พืชมีพิษ และสัตว์ร้ายกระหายเนื้อ! มันยากแค่ไหนสำหรับเด็กที่จะหลงทางและตาย?!\n\nเห็นได้ชัดว่ามันยากเกินไปสำหรับ [target.GetFirstNameNoTooltip] เพราะเจ้าเด็กเหลือขอนั่นมี #EMP ความกล้า#! ที่จะหาทางกลับบ้าน [target.GetHerHis] ได้อย่างปลอดภัย!"
 
 # Infant Stabbed To Death
 murder_outcome_reworked.4011.desc: "เด็กช่างเป็นสิ่งมีชีวิตที่เปราะบาง... ความเจ็บป่วยใดๆ ก็สามารถพรากพวกเขาไปจากครอบครัวได้ หรืออุบัติเหตุใดๆ! เช่นอุบัติเหตุที่เกี่ยวกับศีรษะเล็กๆ อันบอบบางและเข็มแหลมคม—ข้าไม่จำเป็นและไม่ต้องการได้ยินรายละเอียด ตราบใดที่งานสำเร็จลุล่วง ช่างน่าสยดสยอง ช่างเป็น #EMP ความอัปยศ#!."
 murder_outcome_reworked.4013.desc: "ผู้คนมีความลังเลใจมากมายเมื่อเป็นเรื่องของเด็ก ผู้สมรู้ร่วมคิดของข้าทุกคนเห็นพ้องต้องกันว่า [target.GetFirstNameNoTooltip] ต้องไป พวกเขาได้รับค่าจ้างอย่างงาม เพื่อให้มันเกิดขึ้น แต่กระนั้นพวกเขากลับลังเลเพียงแค่เห็นทารกนอนหลับอย่างสงบ! มันง่ายมาก เพียงแค่แทงอย่างแรงตรงที่ศีรษะอ่อนที่สุด แล้วมันก็จะจบลง... ช่างเป็นโอกาสที่สูญเปล่า"
 
 # Infant Bitten By Creepy Crawly
 murder_outcome_reworked.4021.desc: "ผู้คนช่างแปลกประหลาด เป็นการยากที่จะหาคนที่เต็มใจจะลงมือกับทารก แต่การวาง [SCOPE.Custom('VenomousCreature')] ไว้ในเปลนั้น ดูเหมือนจะเป็นที่ยอมรับได้มากกว่ามาก ส่วน [SCOPE.Custom('VenomousCreatureType')] นั้น ก็ไม่มีความลังเลใจเป็นพิเศษ เช่นกันและโจมตีอย่างแม่นยำ ยาพิษออกฤทธิ์อย่างรวดเร็วและไร้ความปรานี"
 murder_outcome_reworked.4023.desc: "[SCOPE.Custom('VenomousCreature')] ถูกส่งไปยังเตียงของ [target.GetFirstNamePossessiveNoTooltip] ตามแผน แต่ดูเหมือนว่าการเคลื่อนไหวของทารก ทำให้มันตกใจจนซ่อนตัวแทนที่จะโจมตี เจ้าสัตว์ไร้ประโยชน์ถูกพบในอีกหลายชั่วโมงต่อมาโดยคนรับใช้ ซ่อนตัวอยู่ใต้ตู้ ทารกที่น่าสาปแช่งนั่นไม่ได้รับอันตรายใดๆ"
 murder_outcome_reworked.4024.desc: "เตียงนุ่มๆ ใต้ร่างข้าและผ้าห่มอุ่นๆ ที่คลุมตัวข้าคือทั้งหมดที่ข้าปรารถนา ข้าเกือบจะหมดสติเมื่อรู้สึกถึงความรู้สึกแปลกๆ อย่างคลุมเครือ ราวกับมีบางสิ่งกำลังเคลื่อนที่ขึ้นมาบนตัวข้า ข้าพลิกตัวไปด้านข้างอย่างรวดเร็วและความรู้สึกนั้นก็หายไป ข้าหลับไป\n\nต่อมา ข้าถูกปลุกให้ตื่นด้วยเสียงกรีดร้องแหลมสูงของคนรับใช้ ข้าไม่แน่ใจว่าเกิดอะไรขึ้น: ผู้ใหญ่จำนวนมากกำลังวิ่งวุ่น เสียงดังของพวกเขาดังก้อง และหลายคนชี้ไปที่บางสิ่งที่ข้ามองไม่เห็นใต้ตู้"
 
 # Poisoned Candy
 murder_outcome_reworked.4031.desc: "เด็กช่างหลอกง่ายเสียจริง! ข้าเพียงแค่ต้องปลอมตัวผู้สมรู้ร่วมคิดคนหนึ่งของข้าเป็นคนรับใช้ ให้เขานำเค้กที่ดูน่าอร่อยและมียาพิษอย่างแน่นอนไปให้ [target.GetFirstNameNoTooltip] และเจ้าโง่ตัวน้อยก็กลืนมันลงไปในคำใหญ่คำเดียว โดยไม่ถามอะไรเลย!\n\nบางทีเราควรเริ่มสอนเด็กๆ ไม่ให้รับขนมจากคนแปลกหน้า..."
 murder_outcome_reworked.4033.desc: "สาปแช่งเด็กและความคาดเดาไม่ได้ของพวกเขา! มันควรจะง่ายมาก: ลอบนำขนมที่มียาพิษ แต่ต้านทานไม่ได้ไปให้ [target.GetFirstNameNoTooltip] และ [target.GetFirstNameNoTooltip] ก็ตาย เด็กประเภทไหนกันที่ตอบว่า \"ข้าไม่หิว\" เมื่อมีคนเสนอ #EMP ขนมหวาน?#! ให้!"
 murder_outcome_reworked.4034.desc: "ข้ากำลังออกไปเล่น รู้สึกกระหายน้ำเล็กน้อย เมื่อคนรับใช้คนหนึ่งก็ปรากฏตัวขึ้นจากที่ไหนไม่รู้ เสนอ [ROOT.Char.Custom('FavoriteTreat')] ให้ข้า แต่ข้าไม่ต้องการ [ROOT.Char.Custom('FavoriteTreat')] ข้าอยากดื่มน้ำ! คนรับใช้โง่!\n\nข้าลืมเรื่องราวทั้งหมดเกี่ยวกับเหตุการณ์นั้นไปแล้วเมื่อคนรับใช้หลายคนเข้ามาหาข้าในอีกหลายชั่วโมงต่อมา แสดงความยินดีกับข้าที่ฉลาดและกล้าหาญมาก และขัดขวางแผนการชั่วร้ายบางอย่างหรืออะไรทำนองนั้น ช่างมันเถอะ แต่ตอนนี้ข้าอยากได้ [ROOT.Char.Custom('FavoriteTreat')] แล้วนะ!"
 
 # Child Pushed To Death
 murder_outcome_reworked.4041.desc: "ทุกสิ่งย่อมร่วงหล่นในที่สุด: อาณาจักร, [ROOT.Char.Custom('LadiesLords')], #EMP เด็กที่ถูกผลักจากที่สูง#!...\n\nช่างเป็นโศกนาฏกรรมที่หลีกเลี่ยงไม่ได้"
 murder_outcome_reworked.4043.desc: "ขณะที่สายลับของข้าผลัก [target.GetHerHim] ตกขอบไป เสื้อผ้าของ [target.GetHerHis] เกี่ยวเข้ากับส่วนที่ยื่นออกมาของกำแพงด้านล่างพอดี มันยึด [target.GetHerHim] ไว้นานพอที่ความช่วยเหลือจะมาถึงเพื่อช่วยทั้งเด็กและ"
 
 #################################################
 # Outcomes — Prison

 # Beaten To Death In Prison
 murder_outcome_reworked.7001.desc: "ความแน่นอนอย่างหนึ่งของชีวิตคือผู้คุมขังสนใจเพียงว่าใครได้รับอนุญาตให้ออกจากคุกของตน และแทบไม่สนใจว่าใครเข้ามาหรือเกิดอะไรขึ้นกับพวกเขา\n\nเมื่อผู้สมรู้ร่วมคิดของข้าเสนอสินบนจำนวนงามให้พวกเขาเพื่อขออนุญาตเยี่ยม #EMP สหายรัก#! [target.GetFirstNameNoTooltip] พวกเขาก็กระตือรือร้นที่จะยอมรับมากเกินไป การทำหูทวนลมต่อเสียงกรีดร้องและเสียงกระดูกแตกเป็นเพียงส่วนหนึ่งของบริการ"
 murder_outcome_reworked.7003.desc: "$murder_outcome_reworked.7001.desc$ แล้วทำไมพวกเขาต้องเข้ามาแทรกแซงก่อนที่งานจะเสร็จสิ้นด้วยล่ะ?!"
 murder_outcome_reworked.7004.desc: "$murder_outcome.5001.beat_to_death_in_dungeon$ จากนั้น ผู้คุมขังประจำของข้าก็พังเข้ามา และการทุบตีก็หยุดลง"
 
 # Unwelcome Guest - House Arrest
 murder_outcome_reworked.7011.desc: "นักโทษที่ถูกกักบริเวณในบ้านควรได้รับการจับตามองอย่างใกล้ชิด; ดังนั้น การลอบส่งสายลับคนหนึ่งของข้าเข้าไปในบ้านของ [target.GetFirstNamePossessiveNoTooltip] โดยอ้างว่ามาเยี่ยมสหายเก่าจึงเป็นความอัจฉริยะอย่างแท้จริง หากข้าจะกล่าว เช่นนั้นเอง! ผู้สมรู้ร่วมคิดของข้าเข้าและออกไปก่อนที่ทหารยามจะรู้ตัวว่ามีบางอย่างผิดปกติ"
 murder_outcome_reworked.7012.desc: "ทหารยามของข้าได้แนะนำร่างคลุมฮู้ดที่ไม่คุ้นเคยเข้ามาในห้องของข้าว่าเป็นสหายเก่าของข้า ข้ากำลังจะคัดค้านว่าต้องมีการเข้าใจผิดแน่ๆ เพราะข้าไม่รู้จักบุคคลนี้อย่างชัดเจน เมื่อกริชวาววับปรากฏออกมาจากกระเป๋าที่ซ่อนอยู่ #EMP โอ้.#! เป็นสหายเก่า #EMP ประเภทนั้น#! นี่เอง\n\nข้าไม่มีเวลาตอบสนองขณะที่กริชพุ่งเข้าใส่ข้าเร็วกว่าลูกธนู และข้าก็ล้มลงกับพื้นโดยไม่มีเสียงใดๆ"
 murder_outcome_reworked.7013.desc: "นักโทษที่ถูกกักบริเวณในบ้านควรได้รับการจับตามองอย่างใกล้ชิด; ดังนั้น การลอบส่งสายลับคนหนึ่งของข้าเข้าไปในบ้านของ [target.GetFirstNamePossessiveNoTooltip] โดยอ้างว่ามาเยี่ยมสหายเก่าควรจะเป็นความอัจฉริยะอย่างแท้จริง! น่าเศร้าที่ทหารยามไม่เชื่อเรื่องราวของผู้สมรู้ร่วมคิดของข้าจริงๆ และรออยู่ด้านนอกห้อง พร้อมที่จะเข้าแทรกแซงในกรณีที่มีธุรกิจน่าสงสัยใดๆ เห็นได้ชัดว่า การพยายามฆ่า #EMP นับ#! ว่าเป็น #EMP ธุรกิจน่าสงสัย#!."

 #################################################
 # Outcomes — Special/Other
 
 # Strangling Incapable
 murder_outcome_reworked.8001.desc: "วันแห่งความรุ่งโรจน์ของ [target.GetFirstNamePossessiveNoTooltip] ได้ผ่านพ้น [target.GetHerHim] ไปนานแล้ว แต่ [target.GetSheHe] ก็ยังยึดติดกับชีวิตไว้นานเหลือเกิน อย่างสิ้นหวังเหลือเกิน อย่าง #EMP ไร้ประโยชน์#! เหลือเกิน... ข้าเชื่อว่าสิ่งที่สายลับของข้าทำนั้นไม่ใช่อะไรอื่นนอกจากการกระทำด้วยความเมตตา [target.GetFirstNameNoTooltip] เป็นเพียงเปลือกที่ว่างเปล่า นั่นถือเป็นการฆาตกรรมจริงๆ หรือ?"
 murder_outcome_reworked.8003.desc: "มันน่าโมโหมากที่สายลับคนหนึ่งจะไร้ความสามารถอย่างร้ายกาจได้ถึงเพียงนี้ มันจะยากแค่ไหนกันที่จะรัดคอคนที่เปราะบาง ซึ่งจิตใจไม่อยู่กับเนื้อกับตัวแล้วและแทบจะไม่มีชีวิตอยู่เลย?! แต่กระนั้น ข้าก็พบ แต่ความล้มเหลว"
