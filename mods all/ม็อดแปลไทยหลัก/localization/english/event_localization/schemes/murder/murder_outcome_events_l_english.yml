l_english: 
 do_not_execute_murder_tooltip:0 "อย่าพยายามดำเนินการฆาตกรรม"
 murder_child_really_tooltip:1 "การฆาตกรรมเด็ก ท่านแน่ใจในเรื่องนี้แล้วหรือ?"
 murder_outcome_murdered_rival_tt: "ท่านได้รับ [prestige_i][EmptyScope.ScriptValue('rival_outlived_prestige_value')|P0] จากการมีชีวิตยืนยาวกว่า [rival|E] ของท่าน"
 murder_unknown_murder_against_you_was_successful:0 "#X ท่านถูกฆาตกรรมโดยผู้โจมตีที่ไม่ทราบชื่อ!#!"
 murder_unknown_murder_against_you_was_successful_other:0 "#X [THIS.Char.GetShortUIName] ถูกฆาตกรรมโดยผู้โจมตีที่ไม่ทราบชื่อ!#!"

 murder_outcome.1001.t:0 "นักฆ่า!"
 murder_outcome.1001.d:0 "ถึงเวลาแล้ว สายลับของข้าอยู่ในตำแหน่งแล้ว หนึ่งในนั้นจะจ่ายเงินให้นักฆ่าในคืนที่ลงมือ อีกคนจะ ทำให้แน่ใจว่ากำแพงไม่มีทหารยาม คนที่สามจะทิ้งร่องรอยเทียนไขอย่างแนบเนียนไปยังห้องบรรทมของ [target.GetTitledFirstNamePossessive]\n\nทุกอย่างเข้าที่แล้ว"
 murder_outcome.1001.a:0 "ลงมือ"
 murder_outcome.1001.b:0 "เดี๋ยวก่อน ข้ายังไม่พร้อม"

 murder_outcome.1002.t:0 "ถูกโจมตี"
 murder_outcome.1002.opening:0 "สายลับของข้าได้กำหนดการเดินทางสำหรับ [target.GetTitledFirstName] ซึ่งจะนำพวกเขาผ่านป่าทึบ $murder_outcome.1002.d$"
 murder_outcome.1002.opening_travel:0 "สายลับของข้าได้ทราบว่า [target.GetTitledFirstName] กำลังเดินทางไปยัง [province.GetName] ซึ่งจะนำ [target.GetHerHim] ผ่านพื้นที่รกร้างหลายแห่ง\n\n$murder_outcome.1002.d$"
 murder_outcome.1002.d:1 "สิ่งที่ขาดหายไปคือกลุ่มอันธพาลที่จะสังหาร [target.GetHerHim] อย่างน่าเศร้าในการปล้นบนทางหลวงที่ผิดพลาด\n\nข้าสามารถจินตนาการถึงเลือดของ [target.GetHerHis] ที่ซึมลงสู่ดินสีคล้ำได้แล้ว..."
 murder_outcome.1002.a:1 "โอ้ ถิ่นทุรกันดารช่างเป็นสถานที่อันตรายเสียนี่กระไร"
 murder_outcome.1002.b:0 "เดี๋ยวก่อน นี่ไม่ใช่เวลาที่เหมาะสม"

 murder_outcome.1003.t:0 "มื้ออาหารที่ต้องตายเพื่อลิ้มลอง"
 murder_outcome.1003.d:0 "สายลับของข้าเตรียมการมาหลายสัปดาห์ พ่อครัวถูกติดสินบนให้มองไปทางอื่น ยาพิษถูกจัดหามาแล้ว และเป็ดถูกมอบให้แก่ [target.GetTitledFirstName] เพียงผู้เดียว มันจะถูกทาด้วยยาพิษ และเตียงสมุนไพรจะกลบกลิ่นขณะเสิร์ฟ ความขมร้ายแรงจะเป็นสิ่งสุดท้ายที่เป้าหมายของข้าได้ลิ้มรส"
 murder_outcome.1003.a:0 "เชิญอร่อย [target.GetFirstNameNoTooltip]..."
 murder_outcome.1003.b:0 "เดี๋ยวก่อน ข้าต้องการเวลาเตรียมตัวมากกว่านี้!"

 murder_outcome.1004.t:0 "ไม่ได้รับเชิญ"
 murder_outcome.1004.desc:0 "หนึ่งในสายลับของข้าได้ [SCOPE.Custom('VenomousCreature')] มา และจัดการให้คนรับใช้ซ่อนมันไว้ในเตียงของ [target.GetTitledFirstNamePossessive] ก่อนค่ำ\n\nสิ่งที่พวกเขาต้องการคือคำสั่งของข้า และ [target.GetSheHe] ก็ไม่ต่างจากตายทันทีที่ [SCOPE.Custom('VenomousCreatureType')] โจมตี"
 murder_outcome.1004.a:0 "ข้าหวังว่าเจ้าจะไม่กลัว [SCOPE.Custom('VenomousCreatureTypePlural')] นะ [target.GetFirstNameNoTooltip]..."
 murder_outcome.1004.b:0 "นี่ไม่ใช่วิธีที่จะทำ"

 murder_outcome.1005.t:1 "$knight_culture_player_plural_no_tooltip$ และไพร่"
 murder_outcome.1005.desc:0 "ด้วยความไม่สงบเมื่อเร็วๆ นี้ในหมู่ไพร่แห่ง [home_province.GetNameNoTier] หนึ่งในสายลับของข้าได้เสนอข้อเสนอแนะที่ไม่เหมือนใครในการจัดการกับ [target.GetTitledFirstName]\n\nด้วยเหรียญในกระเป๋าที่ถูกต้องและผู้ปลุกปั่นในทุกมุม เราสามารถจัดฉากการจลาจลทั้งหมด ในขณะที่ [target.GetTitleTierName] กำลังผ่านไปตามถนน"
 murder_outcome.1005.a:0 "ถึงเวลาสำหรับการปกครองโดยฝูงชนแบบเก่าที่ดีแล้ว"
 murder_outcome.1005.b:0 "นี่มันคาดเดาไม่ได้เกินไป!"

 murder_outcome.1006.t:0 "ถังไวน์"
 murder_outcome.1006.desc:0 "[target.GetTitledFirstName] จะเข้าร่วมงานเฉลิมฉลองท้องถิ่นใน [home_province.GetName] และข้าบังเอิญรู้ว่า [target.GetSheHe] เป็นผู้ที่ชื่นชอบไวน์อยู่บ้าง\n\nข้าสามารถล่อ [target.GetHerHim] เข้าไปในห้องใต้ดินของ [target.Custom('ResidenceBuilding')] ของข้าเพื่อชิมไวน์สุดพิเศษ แล้ว ทำให้แน่ใจว่า [target.GetSheHe] จะไม่ได้เดินออกมาอีกเลย...!"
 murder_outcome.1006.a:0 "นี่มันง่ายมาก!"

 murder_outcome.1007.t:0 "ในน่านน้ำปั่นป่วน"
 murder_outcome.1007.travel:0 "[target.GetTitledFirstName] กำลังอยู่บนเรือที่ไหนสักแห่งใน [province.GetName]"
 murder_outcome.1007.desc_not_inspection:0 "[target.GetTitledFirstName] กำลังเยี่ยมชมเรือที่ทอดสมออยู่ในท่าเรือแห่งหนึ่งของ [province.GetNameNoTier] ในปลายสัปดาห์นี้"
 murder_outcome.1007.desc:0 "[target.GetTitledFirstName] กำลังตรวจสอบเรือที่ทอดสมออยู่ในท่าเรือแห่งหนึ่งของ [province.GetNameNoTier] ในปลายสัปดาห์นี้"
 murder_outcome.1007.desc_ending:0 "\n\nมันคงง่ายที่จะให้สายลับของข้าชโลมเรือพายที่จะใช้รับส่ง [target.GetHerHim] ด้วยของเหลวไวไฟ รอ จนกระทั่งมันออกไปกลางท่าเรือ ยิงธนูไฟ แล้วก็... ปล่อยให้น้ำพราก [target.GetHerHim] ไป"
 murder_outcome.1007.desc_ending_travel:0 "\n\nมันคงเป็นโศกนาฏกรรมหากสายลับของข้าชโลมไม้ด้วยของเหลวไวไฟ หลบหนีไปบนเรือพายลำเดียว และจุดไฟเผาเรือขณะที่พวกเขาหลบหนีอย่างปลอดภัย... ซึ่งจะ ทำให้แน่ใจถึงความตายของ [target.GetFirstNamePossessiveNoTooltip] พร้อมกับคณะผู้ติดตามของ [target.GetHerHis]"
 murder_outcome.1007.a:0 "เริ่มดำเนินการตามแผน"

 murder_outcome.1008.t:0 "เครื่องดื่มแห่งชีวิต"
 murder_outcome.1008.desc:0 "สายลับของข้าได้ผงยาที่ไม่ทิ้งร่องรอยเมื่อละลายในเครื่องดื่มมา คนรับใช้ที่รับผิดชอบในการเติมและจัดการถ้วยของ [target.GetTitledFirstNamePossessive] ถูกติดสินบนให้มองไปทางอื่น และสิ่งที่เหลืออยู่คือการอนุมัติของข้าเพื่อลอบใส่ยาพิษลงในเครื่องดื่มดับกระหายครั้งต่อไปของ [target.GetHerHis]"
 murder_outcome.1008.a:0 "ดื่มอวยพรแด่สุขภาพของ [target.GetShortUINamePossessiveNoTooltip]!"

 murder_outcome.1201.t:0 "เส้นทางที่ไม่ค่อยมีคนใช้"
 murder_outcome.1201.desc:0 "[assassin.GetTitledFirstName] กำลังเตรียมการเดินทางพิเศษสำหรับ [target.GetTitledFirstName] ผู้อ่อนเยาว์ เด็กน้อยเชื่อใจว่า [target.GetSheHe] จะได้ไปเที่ยวป่าอย่างสนุกสนาน\n\nน่าเสียดายที่ [target.GetFirstNameNoTooltip] จะหลงทาง และเป็นไปไม่ได้ที่จะหาพบก่อนค่ำ โอ้ [target.GetSheHe] ช่างเยาว์วัยเหลือเกิน..."
 murder_outcome.1201.no_assassin:0 "หนึ่งในสายลับของข้ากำลังเตรียมการเดินทางพิเศษสำหรับ [target.GetTitledFirstName] ผู้อ่อนเยาว์ เด็กน้อยเชื่อใจว่า [target.GetSheHe] จะได้ไปเที่ยวป่าอย่างสนุกสนาน\n\nน่าเสียดายที่ [target.GetFirstNameNoTooltip] จะหลงทาง และเป็นไปไม่ได้ที่จะหาพบก่อนค่ำ โอ้ [target.GetSheHe] ช่างเยาว์วัยเหลือเกิน..."
 murder_outcome.1201.a:0 "เด็กหลงป่า... มันเกิดขึ้นบ่อยครั้งอย่างน่าเศร้า"
 murder_outcome.1201.b:0 "ไม่ ข้าต้องคิดเรื่องนี้ใหม่!"

 murder_outcome.1202.t:0 "ไร้ทางสู้"
 murder_outcome.1202.desc:0 "ถึงเวลาแล้ว หนึ่งในแม่นมของ [target.GetTitledFirstNamePossessive] ตัวน้อยยินดีที่จะทำสิ่งที่ต้องทำ แน่นอนว่าต้องมีค่าตอบแทนที่เพียงพอ\n\nข้าโบกมือไล่สายลับของข้าไปก่อนที่ [dummy_gender.GetSheHe] จะอธิบายจุดประสงค์ของเข็มแหลมคมเสร็จ"
 murder_outcome.1202.a:0 "จัดการให้เสร็จ ไม่ว่าจะราคาเท่าไหร่"
 murder_outcome.1202.b:0 "ข้ากำลังคิดอะไรอยู่?"

 murder_outcome.1203.desc:0 "เป็นการยากที่จะหาชายที่เต็มใจจะลงมือกับทารก แต่การหาคนที่เต็มใจจะวาง [SCOPE.Custom('VenomousCreatureType')] ไว้ในเปลนั้นง่ายกว่ามาก\n\nข้ามองสายลับของข้ายัด [SCOPE.Custom('VenomousCreature')] ลงในถุงเล็กๆ และตัวสั่น – สิ่งนั้นเกือบจะใหญ่เท่ากับเหยื่อในอนาคตของมัน!"

 murder_outcome.1204.t:0 "ชอบของหวาน"
 murder_outcome.1204.desc:0 "หากมีสิ่งหนึ่งที่ [target.GetTitledFirstName] โดยเฉพาะไม่สามารถต้านทานได้ นั่นคือขนมโปรดของ [target.GetHerHis]...\n\nขนมหวานชิ้นต่อไปของ [target.GetHerHis|U] จะเป็นส่วนหนึ่งของ [target.Custom('FavoriteTreat')] และอีกส่วนหนึ่งเป็นยาพิษร้ายแรง – "ถูกลืม" ไว้โดยสายลับของข้าต่อหน้าเด็ก"
 murder_outcome.1204.a:0 "เชิญอร่อยกับลูกอม!"

 murder_outcome.1205.t:0 "ความสูงอันตราย"
 murder_outcome.1205.desc_opening:0 "เวลาของ [target.GetTitledFirstNamePossessive] มาถึงแล้ว ทุกสิ่งย่อมร่วงหล่นในที่สุด: อาณาจักร [ROOT.Char.Custom('LadiesLords')] #EMP เด็กที่ถูกผลักจากที่สูง#!...\n\n"
 murder_outcome.1205.desc_dog:0 "สายลับของข้าจะผูกเชือกรอบคอสุนัขของ [target.GetTitledFirstNamePossessiveNoTooltip] ตัวน้อยและแขวนมันไว้บนกำแพงสูง – เสียงร้องครวญครางและกรีดร้องจะต้องเรียกเด็กมาอย่างแน่นอน"
 murder_outcome.1205.desc_cat:0 "สายลับของข้าจะผูกเชือกรอบคอแมวของ [target.GetTitledFirstNamePossessiveNoTooltip] ตัวน้อยและแขวนมันไว้บนกำแพงสูง – เสียงร้องโหยหวนจะต้องเรียกเด็กมาอย่างแน่นอน"
 murder_outcome.1205.desc_toy:0 "สายลับของข้าจะผูกเชือกรอบของเล่นชิ้นโปรดของ [target.GetTitledFirstNamePossessiveNoTooltip] ตัวน้อย [target.Custom('child_favorite_toy_indefinite')] และแขวนมันไว้บนกำแพงสูง – [target.GetSheHe] จะต้องมาตามหาอย่างแน่นอน"
 murder_outcome.1205.desc:0 "สายลับของข้าจะทิ้งร่องรอยขนมหวานนำทางขึ้นไป สูงขึ้นไป สูงพอที่จะ ทำให้ท้องน้อยๆ ของ [target.GetTitledFirstNamePossessiveNoTooltip] เสียวแปลบ เมื่อถึงยอด [target.GetSheHe] จะพบตะกร้าที่เต็มไปด้วยขนมแขวนอยู่เหนือขอบกำแพง"
 murder_outcome.1205.desc_ending:0 "และขณะที่ [target.GetSheHe] เอื้อมมือลงไปแก้เชือก มันคงง่ายมากที่ [target.GetHerHim] จะลื่น..."
 murder_outcome.1205.a:0 "โศกนาฏกรรมโดยแท้"

 murder_outcome.1301.t:0 "ถูกลืมในความมืด"
 murder_outcome.1301.desc:0 "ดูเหมือนว่าด้วยราคาที่เหมาะสม กลุ่มข้าราชสำนักอาจหลุดรอดจากความทรงจำของผู้คุมคุกในคุกใต้ดินของ [prison_owner.GetTitledFirstNamePossessive] ไปได้อย่างสะดวก ขณะที่พวกเขาเดินทางไปเยี่ยม [target.GetTitledFirstName] เป็นครั้งสุดท้ายที่ [target.GetSheHe] จะเคยมี..."
 murder_outcome.1301.a:0 "[prison_owner.GetFirstNameNoTooltip] จะใช้เวลานานเท่าใดกว่าจะรู้ว่า [target.GetFirstNameNoTooltip] ตายแล้ว?"
 murder_outcome.1301.b:0 "ไม่ ไม่ใช่ตอนนี้"

 murder_outcome.1302.t:0 "แขกที่ไม่พึงประสงค์"
 murder_outcome.1302.desc:0 "เป็นการยากที่จะเข้าถึง [target.GetTitledFirstName] ในระหว่างการกักบริเวณในบ้านของ [target.GetHerHis] อย่างไรก็ตาม สายลับของข้าได้พบคนรับใช้เก่าจาก"
 murder_outcome.1302.home_court_exists:0 "ราชสำนักที่ [target_home.GetNameNoTier],"
 murder_outcome.1302.home_court_does_not_exists:0 "ราชสำนักเดิมของ [target.GetHerHis],"
 murder_outcome.1302.end:0 "ที่เต็มใจจะปลอมตัวเป็นเพื่อนของ [target.GetFirstNamePossessive] โดยมาเยี่ยม..."
 murder_outcome.1302.a:0 "ติดอาวุธให้คนรับใช้และส่ง [dummy_gender.GetHerHim] ไปตามทางของ [dummy_gender.GetHerHis]"
 murder_outcome.1302.b:0 "ไม่ ไม่ใช่ตอนนี้"

 murder_outcome.1401.t:0 "ความเมตตา"
 murder_outcome.1401.desc:0 "[target.GetTitledFirstName] ผู้น่าสงสาร ไร้ทางสู้... ชีวิตจะมีค่าควรอยู่เมื่อใดกัน?\n\nหนึ่งในสายลับของข้าได้จัดการให้นักฆ่าเข้าไปในห้องที่ [target.GetTitleTierName] ผู้ไร้ความสามารถกำลัง "พักผ่อน" อยู่"
 murder_outcome.1401.a:0 "นี่คือสิ่งที่ดีที่สุดแล้ว"
 murder_outcome.1401.b:0 "ไม่ นี่ดูเหมือนจะผิด"

 murder_outcome.2000.t:0 "ชะตาพลิกผัน"
 murder_outcome.2000.desc:0 "ขณะที่ข้ากำลังเตรียมการทุกอย่างที่จำเป็นสำหรับการจากโลกนี้ไปของ [target.GetTitledFirstNamePossessive] ข้าก็ถูกขัดจังหวะโดยมหาดเล็ก [owner.Custom2('InsultNoun', ROOT.Char)] นั่นดันไปตายโดยที่ข้ายังมิทันได้ช่วยเลย!"
 murder_outcome.2000.a:0 "[ROOT.Char.GetFaith.DevilName|U] คงกระตือรือร้นที่จะได้ [target.GetHerHis] เป็นเพื่อน!"
 murder_outcome.2000.a.tt:0 "[target.GetTitledFirstName] [target.GetDeathReason]"
 murder_outcome.2500.desc:0 "ขณะที่ข้ากำลังเตรียมการนัดพบระหว่าง [target.GetTitledFirstName] กับ [ROOT.Char.GetFaith.DevilName|U] ต่อไป ข้าก็ถูกขัดจังหวะโดยมหาดเล็ก [owner.Custom2('InsultNoun', ROOT.Char)] นั่นเดินทางไปไกลและบัดนี้ก็อยู่ไกลเกินเอื้อมของข้าแล้ว! "
 murder_outcome.2500.a:0 "เจ้าอาจหนีข้าพ้น แต่เจ้าหนีความตายไม่พ้น!"

 murder_outcome.2001.t:0 "นักฆ่า!"
 murder_outcome.2001.opening_1:0 "แผนสำเร็จ และ [target.GetName] ตายในที่สุด!"
 murder_outcome.2001.opening_2: "ดูเหมือนจะเป็นการยากที่จะเข้าถึง [target.GetTitledFirstName] โดย [target.GetHerselfHimself] แต่เมื่อนักฆ่าทำได้ในที่สุด [target.GetSheHe] ก็มีชีวิตอยู่บนโลกนี้ได้อีกไม่นาน"
 murder_outcome.2001.opening_3:0 "นักฆ่าปฏิบัติการได้อย่างยอดเยี่ยม และ [target.GetName] ตายในที่สุด!"
 murder_outcome.2001.heh:0 "\nเหอะ"
 murder_outcome.2001.owner_is_known_1:0 "\n\nน่าเสียดาย แม้ว่าข้าจะยังคงอ้างว่าข้อกล่าวหานั้นไม่มีมูล แต่ก็ไม่มีใครสงสัยว่าเป็นการกระทำของข้า"
 murder_outcome.2001.owner_is_known_2:0 "\n\nอย่างไรก็ตาม ใครบางคน ที่ไหนสักแห่ง พลาดพลั้งและ ทำให้การมีส่วนร่วมของข้าในอาชญากรรมเป็นที่รู้กัน! อย่างน้อยข้าก็สามารถปลอบใจตัวเองได้ว่า [target.GetTitledFirstName] แย่กว่าข้า"
 murder_outcome.2001.no_awareness_1:0 "\n\nโชคดีที่การมีส่วนร่วมของข้าในอาชญากรรมยังคงไม่เป็นที่ทราบ"
 murder_outcome.2001.no_awareness_2:0 "\n\nข้าได้ปกปิดร่องรอยของข้าไว้อย่างดี และหากใครสงสัยว่าข้าอยู่เบื้องหลังการโจมตี ก็ไม่มีใครกล้าพูดออกมาดังๆ"
 murder_outcome.2001.a.discovered:0 "นักฆ่าของข้าอยู่ที่นั่นเพียงเพื่อปกป้อง [target.GetHerHim] จากฆาตกร #EMP ตัวจริง#! เท่านั้น! จริงๆ นะ!"
 murder_outcome.2001.a:0 "ข้าชอบการมาเยือนที่ไม่คาดคิดจริงๆ"

 murder_outcome.2001.memories:0 "\n\nข้าจำได้เมื่อ [bad_memory.GetDescription], [ROOT.Char.Custom('MurderMemoryEnding')]"

 
 murder_outcome.2002.t:0 "การเดินทางอันตราย"
 murder_outcome.2002.opening_1:0 "ขอบคุณแผนอันยอดเยี่ยมและอันธพาลรับจ้างของข้า [target.GetTitledFirstName] ตายในที่สุด!"
 murder_outcome.2002.opening_2:0 "พวกอันธพาลทำงานของพวกเขา และ [target.GetTitledFirstName] ก็ไม่อยู่อีกต่อไป!"
 murder_outcome.2002.opening_3:0 "[target.GetTitledFirstName] ได้จากโลกนี้ไปแล้ว ถูกส่งไปโดยคมดาบของโจร"
 murder_outcome.2002.heh:0 "\nเหอะ"
 murder_outcome.2002.no_save:0 "\n\nขณะที่คณะเดินทางหยุดพักค้างแรมในตอนเย็น พวกโจรก็กรูกันออกมาจากหมู่ไม้ ร้องเรียกเลือดและทองคำ! ทหารต่อสู้กลับ แต่โชคดีที่ไม่เพียงพอ [target.GetTitledFirstName] ถูกสังหารอย่างน่าเศร้าในการต่อสู้"
 murder_outcome.2002.owner_is_known_1:0 "\n\nน่าเสียดายที่โจรคนหนึ่งถูกจับได้ และเปิดเผยว่าข้าได้จ่ายเงินให้พวกเขาเพื่อรับประกันการตายของ [target.GetTitleTierNamePossessive]!"
 murder_outcome.2002.owner_is_known_2:0 "\n\nอย่างไรก็ตาม โจรคนหนึ่งต้องถูกจับได้แน่ๆ เพราะปรากฏว่าข้าอยู่เบื้องหลังการโจมตี!"
 murder_outcome.2002.no_awareness_1:0 "\n\nตอนนี้พวกโจรถูกตามล่าโดยทุกคน และไม่มีใครสงสัยการมีส่วนร่วมของข้าเลย!"
 murder_outcome.2002.no_awareness_2:0 "\n\nโชคดีที่โจรส่วนใหญ่ถูกสังหารในการต่อสู้ และคนตายพูดไม่ได้ ไม่มีใครจะรู้ถึงการมีส่วนร่วมของข้าเลย!"
 murder_outcome.2002.a.discovered:0 "อาชญากรรมเดียวของข้าคือการไว้ใจโจรชั้นต่ำ..."
 murder_outcome.2002.a:0 "ฮ่า! บางทีคนธรรมดาก็ไม่ได้ไร้ประโยชน์เสียทีเดียว?"
 murder_outcome.2002.a.less_arrogant:0 "ปัญหาสองอย่างของข้าแก้ปัญหากันเอง!"

 murder_outcome.2003.t:0 "นักกินเพื่อสุขภาพ"
 murder_outcome.2003.opening_1:0 "ขอบคุณเป็ดและขวดยาพิษ [target.GetTitledFirstName] ตายในที่สุด!"
 murder_outcome.2003.opening_2:0 "ยาพิษทำงานของมัน และ [target.GetTitledFirstName] ก็ไม่อยู่อีกต่อไป!"
 murder_outcome.2003.opening_3:0 "นกตัวนั้นกลายเป็นสิ่งสุดท้ายที่ [target.GetFirstName] เคยกิน!"
 murder_outcome.2003.owner_is_known_1:0 "\n\nอย่างไรก็ตาม ขณะที่ดูเหมือนจะสำลักกระดูก [target.GetTitledFirstName] ก็สามารถเปล่งเสียงชื่อข้าออกมาได้ สาปแช่งข้าว่าเป็นฆาตกรของ [target.GetHerHis]!"
 murder_outcome.2003.owner_is_known_2:0 "\n\nน่าเสียดายที่ยาพิษถูกค้นพบ และผู้ใช้ยาพิษก็รีบระบุชื่อข้าว่าเป็นผู้รับผิดชอบ!"
 murder_outcome.2003.owner_is_known_3:0 "\n\nอย่างไรก็ตาม คนรับใช้คนหนึ่งของ [target.GetTitledFirstNamePossessive] รู้สึกผิดอย่างรุนแรง และออกมาสารภาพ โดยระบุชื่อข้าว่าเป็นผู้จัดหายาพิษ"
 murder_outcome.2003.no_awareness_1:0 "\n\nดียิ่งกว่านั้น ในขณะที่ [target.GetHerHis] กำลังจะตาย กระดูกชิ้นหนึ่งติดคอของ [target.GetTitledFirstNamePossessive]! ตอนนี้จึงไม่ชัดเจนว่าอะไรฆ่า [target.GetHerHim] กันแน่!"
 murder_outcome.2003.no_awareness_2:0 "\n\nดูเหมือนว่าไม่มีสายลับคนใดของข้าตกเป็นผู้ต้องสงสัย ซึ่งหมายความว่าไม่มีใครสามารถสืบหายาพิษกลับมาถึงข้าได้!"
 murder_outcome.2003.a.discovered_1:0 "ข้าเพียงแค่พยายาม ทำให้งานเลี้ยงมีชีวิตชีวาขึ้นเท่านั้น!"
 murder_outcome.2003.a.discovered_2:0 "โอ้ ได้โปรด [target.GetSheHe|U] กำลังทำลายบรรยากาศอยู่แล้ว"
 murder_outcome.2003.a:0 "ต้องเป็นอะไรบางอย่างที่ [target.GetSheHe] กินเข้าไปแน่ๆ"

 murder_outcome.2004.opening_1:0 "[target.GetTitledFirstName] ตายแล้ว โดย [SCOPE.Custom('VenomousCreatureAttack')] อันร้ายแรงของ [SCOPE.Custom('VenomousCreature')]! [SCOPE.Custom('VenomousCreatureType')] โจมตีไม่นานหลังจากที่ [target.GetSheHe] กลับเข้าห้องบรรทมของ [target.GetHerHis] และ แม้ว่าจะมีการเรียกทหารยาม แต่ก็ไม่มีใครสามารถทำอะไรเพื่อช่วย [target.GetHerHim] ได้"
 murder_outcome.2004.owner_is_known_1:0 "\n\nน่าเสียดายที่ [target.GetSheHe] ตายพร้อมกับสาปแช่งชื่อข้า และข่าวลือเรื่องการมีส่วนร่วมของข้าก็แพร่กระจายไปไกลแล้ว"
 murder_outcome.2004.no_awareness_1:0 "\n\nโชคดีที่ [SCOPE.Custom('VenomousCreatureTypePlural')] พูดไม่ได้ ดังนั้นการโจมตีจึงไม่สามารถสืบย้อนกลับมาถึงข้าได้"
 murder_outcome.2004.no_awareness_1_beaked_mammal:0 "\n\nโชคดีที่สัตว์ เช่นนั้นพูดไม่ได้ — แน่นอนว่าพวกมันพูดไม่ได้ใช่ไหม? – ดังนั้นการโจมตีจึงไม่สามารถสืบย้อนกลับมาถึงข้าได้"
 murder_outcome.2004.a.discovered:0 "ถึงเวลา [SCOPE.Custom('VenomousCreatureMovement')] หนีไปเหมือน [SCOPE.Custom('VenomousCreatureType')]!"
 murder_outcome.2004.a:0 "เพื่อนตัวน้อยของข้าทำงานได้ดี"

 murder_outcome.2005.opening_1:1 "[target.GetTitledFirstName] ตายแล้ว ถูกทุบตีและเหยียบย่ำโดยไพร่ของ [target.GetHerHis] เอง!\n\nไพร่ที่ถูกปลุกปั่นคลั่งเมื่อเห็นนายเหนือหัวของพวกเขาขี่ม้าผ่านถนน และฉีกทั้ง [target.GetHerHim] และ $knight_culture_player_plural_no_tooltip_lowercase$ หลายคนของ [target.GetHerHis] ลงจากหลังม้า ทุบตีพวกเขาจนตาย!"
 murder_outcome.2005.owner_is_known_1:0 "\n\nไพร่หลายคนถูกแขวนคอ แต่น่าเศร้า ก่อนการประหารชีวิต ผู้ปลุกปั่นบางคนของข้าได้ระบุชื่อข้าว่าเป็นผู้กระทำผิด"
 murder_outcome.2005.no_awareness_1:0 "\n\nไพร่หลายคนถูกแขวนคอ รวมถึงผู้ปลุกปั่นของข้า ซึ่งหมายความว่ามันไม่สามารถสืบย้อนกลับมาถึงข้าได้!"
 murder_outcome.2005.a.discovered:0 "ไพร่ไม่สามารถไว้วางใจให้พิจารณาถึงประโยชน์ส่วนรวมของข้าได้เลย"
 murder_outcome.2005.a.discovered.less_arrogant:0 "ถูกทรยศ แม้กระทั่งโดยคนรับใช้ที่ต่ำต้อยของข้า!"
 murder_outcome.2005.a:0 "อย่าประเมินพลังของฝูงชนต่ำเกินไป"

 murder_outcome.2006.desc:0 "[target.GetTitledFirstName] ตายแล้ว ถูกก่อกำแพงปิดและในไม่ช้าก็จะถูกลืม!\n\n[target.GetSheHe|U] ตามข้ามาอย่างเต็มใจ เมามายด้วยความรื่นเริงและไวน์ เข้าไปในห้องใต้ดิน หลังจากดื่มไวน์ "ชั้นดี" หลายแก้ว [target.GetSheHe] ก็หลับไปอย่างง่ายดายและไม่ขยับตัวเลยขณะที่ข้านำเกรียงออกมาและก่ออิฐปิดทางออกอย่างเป็นระบบ\n\n"
 murder_outcome.2006.scheme_owner_known:0 "น่าเสียดายที่มีคนเห็นข้านำ [target.GetHerHim] เข้าไปในห้องใต้ดิน และภายในไม่กี่สัปดาห์ กำแพงที่สร้างขึ้นใหม่ก็ถูกทุบลงเพื่อเผยให้เห็นความน่าสะพรึงกลัวเบื้องหลัง"
 murder_outcome.2006.scheme_unknown:0 "โชคดีที่ดูเหมือนไม่มีใครสังเกตเห็นกำแพงใหม่ที่แปลกประหลาดในห้องใต้ดินของข้า..."
 murder_outcome.2006.a.discovered:0 "[target.GetSheHe|U] เมาและต้องการที่พัก!"
 murder_outcome.2006.a:0 "ขอให้ [target.GetSheHe] ไปสู่สุคติ!"

 murder_outcome.2007.desc:0 "[target.GetTitledFirstName] ตายแล้ว ถูกอ้อมกอดอันเย็นเยียบของมหาสมุทรพรากไป!\n\nธนูไฟที่ยิงโดยสายลับของข้าลุกโชนเป็นเส้นทางเพลิงข้ามท่าเรือ และเพียงชั่วครู่ต่อมา เรือทั้งลำก็ลุกเป็นไฟ"
 murder_outcome.2007.desc_lowborn:0 "ผู้โดยสารทุกคนลงเอยในน้ำ และเสื้อผ้าก็หนักมากเมื่อเปียก..."
 murder_outcome.2007.desc_highborn:0 "ผู้โดยสารทุกคนลงเอยในน้ำ และผ้าเนื้อดีก็หนักมากเมื่อเปียก..."
 murder_outcome.2007.scheme_owner_known:0 "\n\nน่าเสียดายที่มีคนเห็นนักธนู และเขาไม่ลังเลที่จะขายข้า!"
 murder_outcome.2007.scheme_unknown:0 "\n\n#EMP โชคดีที่#! ไม่พบนักธนู"
 murder_outcome.2007.a.discovered:0 "ข้า... ข้าคิดว่า [target.GetSheHe] ว่ายน้ำเป็น!"
 murder_outcome.2007.a:0 "ช่างเป็นโศกนาฏกรรม!"
 every_entourage_member:0 "สมาชิกทุกคนในคณะผู้ติดตามของ [target.GetTitledFirstNamePossessiveNoTooltip]:"

 murder_outcome.2008.desc_drunkard:0 "[target.GetTitledFirstName] ตายแล้ว ถูกฆ่าโดย [target.Custom('RegionalAlcoholicDrink')] ที่ [target.GetSheHe] รักมาก!"
 murder_outcome.2008.desc_not_drunkard:0 "[target.GetTitledFirstName] ตายแล้ว ถูกฆ่าโดยการดื่ม [target.Custom('RegionalDrink')] อย่างลึก!"
 murder_outcome.2008.desc:0 "\n\nสายลับของข้าใส่ยาพิษลงในถ้วยของ [target.GetHerHis] และเฝ้าดูมันละลายโดยไม่ทิ้งร่องรอย เพียงเมื่อคอของ [target.GetHerHis] บวมปิดเท่านั้นที่ [target.GetSheHe] ตระหนักว่ามีบางอย่างผิดปกติ แต่ตอนนั้นก็สายเกินไปแล้ว\n\n"
 murder_outcome.2008.scheme_owner_known:0 "น่าเสียดายที่มีคนเห็นสายลับของข้า และคนรับใช้ที่ถูกติดสินบนก็ไม่ลังเลที่จะเปิดเผยการมีส่วนร่วมของข้า!"
 murder_outcome.2008.scheme_unknown:0 "โชคดีที่สายลับของข้าหลบออกไปได้ดีก่อนที่ผลของยาพิษจะเปิดเผยว่ามีบางอย่างเกิดขึ้น!"
 murder_outcome.2008.a.discovered:0 "...[target.GetSheHe|U] ดูเหมือนกระหายน้ำ?"
 murder_outcome.2008.a:0 "ไชโย [target.GetTitledFirstNameNoTooltip]!"

 murder_outcome.2201.t:0 "ศพที่ถูกฉีกทึ้ง"
 murder_outcome.2201.opening:0 "[target.GetTitledFirstName] ตายแล้ว!\n\nการค้นหาดำเนินไปจนดึกก่อนที่จะถูกยกเลิกและเริ่มใหม่ในรุ่งเช้า ตอนนั้นเองที่พบศพ เปื้อนเลือด ถูกฉีกทึ้งและฉีกขาดหลังจากการโจมตีโดยสัตว์ร้ายที่ดุร้ายและหิวโหย อย่างน้อยข้าก็หวังว่ามันเป็นการกระทำของสัตว์ร้าย"
 murder_outcome.2201.scheme_owner_known:0 "\n\nหายนะยิ่งนัก สายลับของข้าสารภาพทันทีที่พบเด็ก ตอนนี้ทุกคนรู้ว่าข้าอยู่เบื้องหลังโศกนาฏกรรมนี้!"
 murder_outcome.2201.scheme_unknown:0 "\n\nโชคดีที่ทุกคนเห็นพ้องกันว่าเป็นโศกนาฏกรรมที่เลวร้าย และการมีส่วนร่วมของข้า — และการมีอยู่ของแผนการใดๆ — ยังคงไม่เป็นที่ทราบ"
 murder_outcome.2201.a.discovered:0 "การเผชิญกับอุปสรรคที่ไม่คาดฝันเป็นส่วนสำคัญของการเลี้ยงดูเด็กทุกคน!"
 murder_outcome.2201.a:0 "และพวกเขากล่าวว่าเด็กคืออนาคต"

 murder_outcome.2202.desc:0 "การกระทำเสร็จสิ้นแล้ว [target.GetTitledFirstName] จะไม่มีวันเติบโต หรือเข้าใจโลกรอบตัว [target.GetHerHim] เห็นได้ชัดว่ามันง่าย เข็มเหล็กแหลมคมแทงเข้าที่หู ทะลุผิวหนังและกระดูกอ่อนที่อ่อนนุ่มได้อย่างง่ายดาย"
 murder_outcome.2202.desc_sadistic:0 "ข้าให้ข้าราชสำนักบรรยายซ้ำถึงเสียงร้องไห้และเลือดที่ไหลทะลักอีกสองสามครั้งก่อนที่ความอยากรู้อยากเห็นของข้าจะพอใจ"
 murder_outcome.2202.desc_normal:0 "ข้าไล่ข้าราชสำนักไปก่อนที่จะได้รับรายละเอียดเพิ่มเติม"
 murder_outcome.2202.scheme_owner_known:0 "\n\nหายนะยิ่งนัก แม่นมถูกจับได้และระบุชื่อข้าว่าเป็นผู้กระทำผิดเบื้องหลังอาชญากรรมอันชั่วร้าย"
 murder_outcome.2202.scheme_unknown:0 "\n\nแม่นมถูกจับได้ แต่ถูกประหารชีวิตด้วยความโกรธก่อนที่เธอจะมีโอกาสสารภาพถึงการมีส่วนร่วมของข้าในอาชญากรรม"
 murder_outcome.2202.a:0 "ข้าต้องทำสิ่งนี้ ข้าต้องทำสิ่งนี้"
 murder_outcome.2202.a.tt:0 "#F ข้าต้องทำ!#!"
 murder_outcome.2202.a.sadistic:0 "อะไรต่อไปในรายการของข้าสำหรับวันนี้?"

 murder_outcome.2203.desc:0 "การกระทำเสร็จสิ้นแล้ว [target.GetTitledFirstName] จะไม่มีวันได้เติบโต จะไม่มีวันได้รู้จักความเจ็บปวดและความสุขของโลกนี้ เห็นได้ชัดว่าเป็นการตายอย่างรวดเร็ว พิษทำงานของมันแม้กระทั่งก่อนที่สายลับของข้าจะออกจากห้องไป\n\n"
 murder_outcome.2203.scheme_owner_known:0 "อย่างไรก็ตาม ทหารยามตามทันเขาอย่างรวดเร็ว และชายขี้ขลาดคนนั้นก็ซัดทอดข้าว่าเป็นผู้อยู่เบื้องหลังการกระทำอันชั่วร้าย"
 murder_outcome.2203.scheme_unknown:0 "อย่างไรก็ตาม ทหารยามก็รวดเร็ว เช่นกัน และในไม่ช้าพวกเขาก็จับสายลับของข้าใส่โซ่ตรวน เขาถูกประหารชีวิตอย่างเมตตาก่อนที่เขาจะสามารถเอ่ยถึงข้าว่าเป็นผู้อยู่เบื้องหลังอาชญากรรม"

 murder_outcome.2204.desc:0 "[target.GetTitledFirstName] ตายแล้ว; [target.GetSheHe] กลืนเหยื่อ [target.Custom('FavoriteTreat')] และทั้งหมด! ในเวลาไม่นาน [target.GetSheHe] ก็กุมคอของ [target.GetHerHis] หายใจหอบเพื่ออากาศ ก่อนที่จะล้มลงกองกับพื้นและไม่ลุกขึ้นอีกเลย"
 murder_outcome.2204.scheme_owner_known:0 "\n\nหายนะยิ่งนัก มีคนเห็นสายลับของข้าวางขนม และในไม่ช้าข้าก็ถูกเปิดโปงว่าเป็นผู้วางแผนเบื้องหลังเรื่องทั้งหมด!"
 murder_outcome.2204.scheme_unknown:0 "\n\nคนทำขนมปังทุกคนในพื้นที่ถูกสอบสวน แต่ไม่พบร่องรอยการกระทำผิด"

 murder_outcome.2205.t:0 "ร่วงหล่นจากที่สูง"
 murder_outcome.2205.desc_opening:0 "[target.GetTitledFirstName] ตายแล้ว! พวกเขาพบศพที่ถูกฉีกทึ้งของ [target.GetHerHis] บนพื้น,"
 murder_outcome.2205.desc_dog:0 "กอดร่างสุนัขขี้เรื้อนของ [target.GetHerHis] ไว้"
 murder_outcome.2205.desc_cat:0 "กอดร่างแมวผอมโซของ [target.GetHerHis] ไว้"
 murder_outcome.2205.desc_cat_alive:0 "แต่ไม่มีร่องรอยของแมวผอมโซของ [target.GetHerHis]"
 murder_outcome.2205.desc_toy:0 "กอด [target.Custom('child_favorite_toy')] ของ [target.GetHerHis] ไว้แนบอก"
 murder_outcome.2205.desc_nothing:0 "ลูกอมกระจายอยู่บนพื้นรอบตัว [target.GetHerHim]"
 murder_outcome.2205.desc:0 "ใบหน้าอ่อนเยาว์ของ [target.GetHerHis|U] บิดเบี้ยวอย่างถาวรด้วยความประหลาดใจและความหวาดกลัว"
 murder_outcome.2205.scheme_owner_known:0 "\n\nข้ารู้สึกถึงความรู้สึกที่สะท้อนออกมาบนใบหน้าของข้าเองเมื่อเห็นได้ชัดว่าสายลับของข้าถูกจับได้และไม่ลังเลที่จะเปิดเผยข้าเลย!"
 murder_outcome.2205.scheme_unknown:0 "\n\nอย่างน้อยทุกคนก็คิดว่า [target.GetSheHe] ตกลงมาโดยอุบัติเหตุ"

 murder_outcome.2301.t:0 "ถูกลืมในความมืด"
 murder_outcome.2301.opening_1:0 "ในที่สุด [target.GetTitledFirstName] ก็ตาย! [target.GetSheHe|U] เสียชีวิตด้วยน้ำมือของกลุ่มชายไม่ทราบชื่อในคุกใต้ดินของ [prison_owner.GetTitledFirstName] อดอยากครึ่งหนึ่ง มีเพียงเล็กน้อยที่ [target.GetSheHe] สามารถทำได้เพื่อป้องกัน [target.GetHerselfHimself] ขณะที่พวกเขาทำร้าย [target.GetHerHim] จนตาย"
 murder_outcome.2301.heh:0 "เหอะ"
 murder_outcome.2301.owner_is_known_1:0 "\n\nน่าเสียดาย ทันทีที่มีการตั้งคำถาม หนึ่งในผู้กระทำผิดก็แตกแถวและระบุชื่อข้าว่าเป็นผู้รับผิดชอบ"
 murder_outcome.2301.no_awareness_1:0 "\n\nแม้ว่าจะไม่ต้องสงสัยเลยว่าฆาตกรเป็นคนของราชสำนัก [prison_owner.GetTitledFirstNamePossessive] แต่พวกเขาก็ปิดปากเงียบและเก็บความลับเรื่องการมีส่วนร่วมของข้าไว้"
 murder_outcome.2301.a.discovered:0 "ท่านไม่สามารถทิ้งใครให้ตาย แล้วมาทำตกใจเมื่อพวกเขาตายจริงๆ ได้"
 murder_outcome.2301.a:0 "ข้าปลดปล่อยเจ้าแล้ว [target.GetFirstNameNoTooltip]"

 murder_outcome.2302.t:0 "แขกที่ไม่พึงประสงค์"
 murder_outcome.2302.opening_1:0 "[target.GetTitledFirstName] ตายแล้ว! ตามแผน คนรับใช้สามารถเข้าถึงห้องของ [target.GetHerHis] ได้ ไม่ต้องสงสัยเลยว่า [target.GetHerHis] ต้องสับสนอย่างมาก แน่นอน ความสับสนนั้นคงจะหายไปเมื่อคนรับใช้ชักกริชของ [dummy_gender.GetHerHis] ออกมา [target.GetFirstNameNoTooltip] อยู่ได้ไม่นาน"
 murder_outcome.2302.owner_is_known_1:0 "\n\nน่าเสียดายที่การฆาตกรรมถูกค้นพบก่อนที่คนรับใช้จะหลบหนีไปได้ และ [dummy_gender.GetSheHe] ก็ให้ชื่อข้าเพื่อแลกกับชีวิตของ [dummy_gender.GetHerHis]"
 murder_outcome.2302.no_awareness_1:0 "\n\nคนรับใช้หลบออกไปอีกครั้ง และหายไปนานก่อนที่ศพจะถูกค้นพบ ไม่มีใครรู้ถึงการมีส่วนร่วมของข้า"
 murder_outcome.2302.a.discovered:1 "อย่างน้อย [target.GetFirstNameNoTooltip] ก็จะไม่ได้ออกจากการถูกกักบริเวณในบ้านของ[target.GetHerHis]ในเร็วๆ นี้""
 murder_outcome.2302.a:0 "ง่ายเหมือนการมาเยี่ยมฉันมิตร!"

 murder_outcome.2401.opening_1:0 "[target.GetTitledFirstName] ได้จากโลกนี้ไปแล้ว แม้ว่าใครๆ ก็ต้องสงสัยว่านั่นไม่ใช่ความจริงมาสักพักแล้วหรือ [target.GetSheHe|U] ไม่ได้ดิ้นรนเลยขณะที่นักฆ่ากดหมอนทับใบหน้าของ [target.GetHerHis] [target.GetSheHe|U] เพียงแค่ส่งเสียงครวญครางเบาๆ ผ่านผ้า แล้วก็เงียบไป"
 murder_outcome.2401.owner_is_known_1:0 "\n\nน่าเสียดาย ทหารยามค้นพบนักฆ่า ซึ่งในไม่ช้าก็ยอมรับถึงการมีส่วนร่วมของข้าในการฆาตกรรม!"
 murder_outcome.2401.no_awareness_1:0 "\n\nนักฆ่าหนีไปได้ และเมื่อไม่มีพยานอื่น ดูเหมือนจะเป็นไปไม่ได้ที่การกระทำนั้นจะสืบย้อนกลับมาถึงข้าได้"
 murder_outcome.2401.a.discovered:0 "อย่าคิดว่าเป็นการฆาตกรรม แต่เป็นการปลดปล่อย!"
 murder_outcome.2401.a:0 "ไปสู่สุคติเสียที [target.GetFirstNameNoTooltip]"

 murder_outcome.4001.t:0 "นักฆ่า!"
 murder_outcome.4001.failure_declaration_1:0 "[target.GetTitledFirstName] หนีไปโดยไม่ได้รับบาดเจ็บ!"
 murder_outcome.4001.failure_declaration_2:0 "ความพยายามของข้าที่จะสังหาร [target.GetTitledFirstName] ถูกขัดขวาง!"
 murder_outcome.4001.failure_declaration_3:0 "ดูเหมือนว่า [target.GetTitledFirstName] จะรอดพ้นจากการพิพากษาของ [ROOT.Char.GetFaith.HighGodNamePossessive] อีกครั้ง"
 murder_outcome.4001.desc:0 "นักฆ่าเข้าไปใน [target.Custom('ResidenceBuilding')] ได้ แต่ไปไม่ถึงห้องของ [target.GetFirstNamePossessiveNoTooltip]"
