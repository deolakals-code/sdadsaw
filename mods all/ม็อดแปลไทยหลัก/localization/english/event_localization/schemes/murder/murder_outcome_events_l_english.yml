 murder_outcome.4002.exposed_scheme:0 "ที่แย่ไปกว่านั้น มีบางคนถูกจับเป็นและเปิดเผยว่าพวกเขาได้รับค่าจ้างสำหรับการโจมตี! ใช้เวลาไม่นานในการสืบหาการชำระเงินกลับมาถึงข้า"
 murder_outcome.4002.not_exposed_scheme:0 "อย่างน้อยพวกเขาก็ถูกสังหารจนหมดสิ้น เมื่อไม่มีใครเหลือให้พูด พวกเขาจึงถูกสันนิษฐานว่าเป็นเพียงโจรธรรมดา"
 murder_outcome.4002.a:0 "ท่านไม่สามารถไว้วางใจคนธรรมดาให้ทำอะไรถูกต้องได้..."
 murder_outcome.4002.a.less_arrogant:0 "งานง่ายๆ เช่นนี้ แต่กระนั้น..."
 murder_outcome.4002.a.discovered:0 "โจรทั่วไป พวกเขาจะพูดอะไรก็ได้ เพื่อให้พ้นผิดอย่างง่ายดาย"

 murder_outcome.4003.desc:0 "\n\nยาพิษไม่ได้ผลตามที่ตั้งใจไว้ เพียง แต่ ทำให้ [target.GetTitleTierName] ล้มป่วยอยู่บนเตียงเป็นเวลาหนึ่งสัปดาห์"
 murder_outcome.4003.exposed_scheme:0 "ที่แย่ไปกว่านั้น หมอสมุนไพรที่จัดหายาพิษถูกตามตัวพบ และตอนนี้ [target.GetFirstNameNoTooltip] รู้ว่าข้าอยู่เบื้องหลังแผนการ!"
 murder_outcome.4003.not_exposed_scheme:0 "โชคดีที่คิดว่าเป็นเพียงอาการป่วยทั่วไป และ [target.GetFirstName] ก็ไม่รู้เรื่องอะไรเลย"
 murder_outcome.4003.a:0 "ครั้งต่อไปข้าจะ ทำให้แน่ใจว่า [target.GetSheHe] สำลักมัน!"
 murder_outcome.4003.a.discovered:0 "ข้าเข้าใจว่านกตัวนั้นไม่ค่อยถูกใจ [target.GetFirstNamePossessiveNoTooltip] ใช่หรือไม่?"

 murder_outcome.4004.failure_declaration_1:0 "[target.GetTitledFirstName] รอดชีวิตจาก [SCOPE.Custom('VenomousCreatureAttack')] ของ [SCOPE.Custom('VenomousCreature')]!"
 murder_outcome.4004.failed_attempt_1:0 "แม้ว่า [SCOPE.Custom('VenomousCreatureType')] จะโจมตี แต่ก็มีการเรียกแพทย์อย่างรวดเร็วและสามารถหยุดพิษไม่ให้แพร่กระจายได้"
 murder_outcome.4004.scheme_owner_known:0 "\n\nหายนะยิ่งนัก คนรับใช้ที่วาง [SCOPE.Custom('VenomousCreatureType')] ถูกพบ และการมีส่วนร่วมของข้าก็ถูกเปิดเผยในไม่ช้า!"
 murder_outcome.4004.scheme_known:1 "\n\nการวาง [SCOPE.Custom('VenomousCreature')] ไว้ในเตียงของ [target.GetTitleAsNamePossessiveNoTooltip] นั้นแทบจะไม่เป็นการปกปิด แต่ อย่างน้อยก็ไม่มีใครรู้ว่าข้าอยู่เบื้องหลัง"
 murder_outcome.4004.scheme_unknown:0 "\n\nอย่างน้อย [SCOPE.Custom('VenomousCreatureAttack')] ก็ถูกกล่าวโทษว่าเกิดจากการเดินเตร่ของ [SCOPE.Custom('VenomousCreatureType')]s แทนที่จะเป็นข้า"
 murder_outcome.4004.a:0 "โชคของเจ้าจะยืดไปได้ไม่ไกลนักหรอก [target.GetFirstNameNoTooltip]!"

 murder_outcome.4005.failure_declaration_1:0 "[target.GetTitledFirstName] รอดชีวิตจากการโจมตีของฝูงไพร่!"
 murder_outcome.4005.failed_attempt_1:0 "\n\nผู้ปลุกปั่นของข้าปลุกระดมพวกเขาได้สำเร็จ แต่เมื่อม็อบเริ่มก่อจลาจล ทหารของ [target.GetFirstNamePossessive] ก็สังหารพวกเขา ผู้รอดชีวิตหนีไปด้วยความหวาดกลัวขณะที่ [target.GetTitleTierName] กลับไปยัง [target.Custom('ResidenceBuilding')] ของ [target.GetHerHis]"
 murder_outcome.4005.scheme_owner_known:0 "\n\nไพร่หลายคนถูกแขวนคอ และผู้ปลุกปั่นของข้าก็สารภาพถึงการมีส่วนร่วมของข้า!"
 murder_outcome.4005.scheme_known:0 "\n\nไพร่หลายคนถูกแขวนคอ และผู้ปลุกปั่นก็สารภาพถึงการมีส่วนร่วมของกองกำลังภายนอก โชคดีที่แม้ แต่พวกเขาก็ไม่รู้ว่าข้าอยู่เบื้องหลัง"
 murder_outcome.4005.scheme_unknown:0 "\n\nไพร่หลายคนถูกแขวนคอ แต่โชคดีที่ผู้ปลุกปั่นของข้าก็ เช่นกัน ซึ่งหมายความว่าการจลาจลไม่สามารถสืบย้อนกลับมาถึงข้าได้"
 murder_outcome.4005.a:0 "ความไร้ความสามารถนี้คือเหตุผลที่เราปกครอง และไพร่เหล่านี้ไม่ได้ปกครอง"
 murder_outcome.4005.a.discovered:0 "จงเชื่อใจฝูงชนเสมอว่าจะตัดสินใจผิด"

 murder_outcome.4006.desc:0 "[target.GetTitledFirstName] ตามข้าเข้าไปในห้องใต้ดินอย่างเต็มใจ เมามายด้วยความรื่นเริงและไวน์\n\nหลังจากดื่มไวน์ "ชั้นดี" หลายแก้ว [target.GetSheHe] ก็หลับไปอย่างง่ายดาย แต่ก่อนที่ข้าจะก่อกำแพงปิดทางออกเสร็จ คนรับใช้บางคนก็เดินเข้ามา\n\n"
 murder_outcome.4006.scheme_owner_known:0 ""[ROOT.Char.Custom('FormOfAddressForLiege')|U]! และ [target.GetTitledFirstNameNoTooltip]? และกำแพงที่สร้างยังไม่เสร็จกำลังปิดกั้น[target.GetHerHim]ไว้... โอ้ ไม่นะ""
 murder_outcome.4006.scheme_unkown:0 ""โอ้ ดูเหมือนว่า [target.GetTitledFirstNameNoTooltip] จะเผลอหลับไปกลางคันระหว่างโครงการของท่าน พวกเราช่วยท่านพา[target.GetHerHim]ไปยังห้องนอนได้หรือไม่ [ROOT.Char.Custom('FormOfAddressForLiege')]?""
 murder_outcome.4006.a.discovered:0 "ข้า... ข้าแค่กำลังปรับปรุงบางอย่าง!"
 murder_outcome.4006.a:0 "...ใช่ ขอบคุณสำหรับความช่วยเหลือ"

 murder_outcome.4007.opening:0 "ธนูไฟที่ยิงโดยสายลับของข้าลุกโชนเป็นเส้นทางเพลิงข้ามท่าเรือ เพียง แต่พลาดเรือไปนิดเดียว\n\nขณะที่ไฟดับลงในน้ำทะเลเย็น ผู้โดยสารบนเรือจ้องมองมันโดยไม่เข้าใจเป็นเวลาหลายวินาทีก่อนที่ความโกลาหลจะเกิดขึ้น\n\n"
 murder_outcome.4007.scheme_owner_known:0 "ที่แย่ไปกว่านั้น นักธนูถูกจับได้ และเปิดเผยข้าว่าเป็นผู้อยู่เบื้องหลังแผนโดยไม่ลังเล"
 murder_outcome.4007.scheme_unkown:0 "โชคดีที่นักธนูหนีไปได้และไม่พบร่องรอยการมีส่วนร่วมของข้า"
 murder_outcome.4007.a.discovered:0 "ข้าแค่อยากให้ [target.GetHerHim] ฝึกว่ายน้ำของ [target.GetHerHis]!"
 murder_outcome.4007.a:0 "มันจะยากแค่ไหนกันเชียวที่จะยิงเรือให้โดน?!"

 murder_outcome.4008.desc:0 "[target.GetTitledFirstName] รอดชีวิตจากยาพิษ!\n\nน่าเสียดายที่สาวใช้ในครัวคนหนึ่งของ [target.GetTitledFirstNamePossessive] ได้แอบจิบเครื่องดื่มนั้นก่อนที่จะนำไปถวายนายหญิง/นายท่าน [target.GetLadyLord] ของตน และดูเหมือนว่าคนรับใช้ที่ตายไปจะเป็นเครื่องยับยั้ง\n\n"
 murder_outcome.4008.scheme_owner_known:0 "และหากนั่นยังไม่แย่พอ คนรับใช้อีกคนก็ไม่ลังเลที่จะชี้ตัวข้าว่าเป็นผู้กระทำผิดเบื้องหลังความพยายาม!"
 murder_outcome.4008.scheme_unkown:0 "อย่างน้อยก็ไม่มีคนรับใช้คนใดสารภาพถึงการมีส่วนร่วมของข้า ความเมตตาเล็กน้อย"
 murder_outcome.4008.a.discovered:0 "ความหน้าด้านของคนรับใช้ของ [target.GetHerHis]!"
 murder_outcome.4008.a:0 "ครั้งต่อไปคนรับใช้ของ [target.GetHerHis] จะรู้ดีกว่าที่จะมายุ่ง!"

 murder_outcome.4201.t:0 "เส้นทางกลับบ้าน"
 murder_outcome.4201.opening:0 "\n\n[assassin.GetTitledFirstName] ทิ้ง [target.GetHerHim] ไว้กับชะตากรรมของ [target.GetHerHis] เพียงลำพังในถิ่นทุรกันดาร\n\nอย่างไรก็ตาม เมื่อกลับมายังราชสำนักเพื่อแจ้งข่าวร้ายเรื่องเด็กที่หายไป [target.GetFirstName] ก็รออยู่ในห้องโถงใหญ่แล้ว และถาม [assassin.GetFirstName] ว่าพวกเขาเล่นต่อได้อีกหรือไม่!"
 murder_outcome.4201.scheme_owner_known:0 "[assassin.GetFirstNameNoTooltip] ถูกสอบสวนอย่างรวดเร็ว และแผนของข้าก็ถูกเปิดเผย!"
 murder_outcome.4201.scheme_unknown:0 "กล่าวได้ว่า ตอนนี้ [assassin.GetFirstNameNoTooltip] ถูกจับตามองอย่างใกล้ชิด"
 murder_outcome.4201.a.discovered:0 "อืม... มันเป็นการพยายามฆ่า หรือการพยายาม #EMP เมตตา#!?"
 murder_outcome.4201.a:0 "มีดแทงข้างหลังน่าจะสำเร็จ"

 murder_outcome.4202.opening:0 "[target.GetTitledFirstName] ยังมีชีวิตอยู่! ดูเหมือนว่าแม่นมไม่สามารถบังคับตัวเองให้แทงทารกน้อยได้ และปล่อยให้โอกาสผ่านไป"
 murder_outcome.4202.scheme_owner_known:0 "\n\nที่แย่ไปกว่านั้น จิตสำนึกของเธอเอาชนะเธอได้ และเธอสารภาพทุกอย่าง แม้กระทั่งการมีส่วนร่วมของข้า!"
 murder_outcome.4202.scheme_known:0 "\n\nที่แย่ไปกว่านั้น จิตสำนึกของเธอเอาชนะเธอได้ และเธอสารภาพถึงแผนการ! อย่างน้อยการมีส่วนร่วมของข้าก็ยังคงเป็นความลับ"
 murder_outcome.4202.scheme_unkown:0 "\n\nอย่างน้อยเธอก็ฉลาดพอที่จะเงียบเกี่ยวกับแผน บางทีนี่อาจเป็นสิ่งที่ดีที่สุด..."
 murder_outcome.4202.a:0 "ข้าต้องคิดอย่างรอบคอบ"

 murder_outcome.4203.opening:0 "[target.GetTitledFirstName] ยังมีชีวิตอยู่! ดูเหมือนว่าพิษของ [SCOPE.Custom('VenomousCreatureType')] ไม่แรงพอ และ ทำให้เกิดผื่นเล็กน้อยกระจายไปทั่วผิวหนังของทารกเท่านั้น\n\n"
 murder_outcome.4203.scheme_owner_known:0 "ราวกับว่านั่นยังไม่แย่พอ สายลับขี้ขลาดของข้าถูกจับได้และสารภาพ โดยระบุชื่อข้าว่าเป็นผู้อยู่เบื้องหลังการกระทำ!"
 murder_outcome.4203.scheme_unkown:0 "ความเมตตาเล็กน้อยคือสายลับของข้าสามารถออกจากห้องไปได้โดยไม่ ทำให้เกิดสัญญาณเตือนใดๆ"

 murder_outcome.4204.desc_opening:0 "[target.GetTitledFirstName] ยังมีชีวิตอยู่! [target.GetSheHe|U] หยิบ [target.Custom('FavoriteTreat')] ขึ้นมา แต่ก่อนที่ [target.GetSheHe] จะกัดมัน สุนัขข้างถนนตัวหนึ่งก็ฉกมันไปจากมือของ [target.GetHerHis] และวิ่งหายไปตามถนน\n\n"
 murder_outcome.4204.scheme_unkown:0 "อย่างน้อยก็ไม่มีใครรู้ถึงเจตนาที่แท้จริงของข้า..."
 murder_outcome.4204.a:0 "นี่อาจเป็นสัญญาณหรือไม่?"

 murder_outcome.4205.desc_opening:0 "[target.GetTitledFirstName] ยังมีชีวิตอยู่! ขณะที่สายลับของข้าผลัก [target.GetHerHim] ตกจากขอบ เสื้อผ้าของ [target.GetHerHis] ก็เกี่ยวกับส่วนที่ยื่นออกมาของกำแพงด้านล่าง มันยึด [target.GetHerHim] ไว้นานพอที่ความช่วยเหลือจะมาถึงเพื่อช่วยทั้งเด็กและ"
 murder_outcome.4205.desc_dog:0 "สุนัขบ้าตัวนั้น..."
 murder_outcome.4205.desc_cat:0 "แมวบ้าตัวนั้น..."
 murder_outcome.4205.desc_toy:0 "[target.Custom('child_favorite_toy')] บ้าๆ นั่น..."
 murder_outcome.4205.desc_nothing:0 "ลูกอมบ้าๆ นั่น..."
 murder_outcome.4205.scheme_unkown:0 "อย่างน้อยสายลับของข้าก็หนีไปโดยไม่มีใครสังเกตเห็น และเด็กก็ตกใจเกินกว่าจะจำได้อย่างชัดเจนว่าเกิดอะไรขึ้น"

 murder_outcome.4302.t:0 "แขกที่ไม่พึงประสงค์"
 murder_outcome.4302.failure_declaration_1:0 "[target.GetTitledFirstName] ยังมีชีวิตอยู่!"
 murder_outcome.4302.failed_lack_of_planning:0 "บางทีข้าควรวางแผนเรื่องนี้ให้ดีกว่านี้ ทันทีที่ "เพื่อนเก่า" เข้าไปในห้องของ [target.GetHerHis] [target.GetSheHe] ก็เรียกทหารยาม [target.GetSheHe] ได้รับการเตือนหรือไม่?"
 murder_outcome.4302.failed_attempt_1:0 ""เพื่อนเก่า" ไม่ได้คล่องแคล่วในการปลอมตัวของ [dummy_gender.GetHerHis] ตามที่วางแผนไว้ และทันทีที่ [dummy_gender.GetSheHe] ชักกริชที่ซ่อนไว้ออกมา [target.GetFirstName] ก็เรียกทหารยาม"
 murder_outcome.4302.disastrous_attempt_1:0 "\n\nน่าเสียดาย ดูเหมือนว่าคนรับใช้ไม่มีความละอายใจที่จะเปิดเผยการมีส่วนร่วมของข้าในแผนการเพื่อช่วยชีวิตของ [dummy_gender.GetHerHis] เอง"
 murder_outcome.4302.something_is_known:0 "\n\nอย่างน้อยการมีส่วนร่วมของข้าในแผนการยังคงไม่เป็นที่ทราบ"
 murder_outcome.4302.unknown_so_far: "\n\nอย่างไรก็ตาม คนรับใช้ผู้นั้นก็หลบหนีไปได้ และท่าทีที่ [dummy_gender.GetSheHe] คว้าของมีค่าอย่างบ้าคลั่งระหว่างทางออกของ[dummy_gender.GetHerHis]ไป ทำให้ผู้คนสันนิษฐานว่าเป็นการปล้นที่วางแผนมาอย่างดี ไม่ใช่การลอบสังหาร!"
 murder_outcome.4302.a:0 "เวลาของเจ้าจะมาถึง [target.GetFirstNameNoTooltip]..."

 murder_outcome.4301.t:0 "ถูกลืมในความมืด"
 murder_outcome.4301.failure_declaration_1:0 "ดูเหมือนว่าแผนของข้าที่จะฆ่า [target.GetTitledFirstName] ล้มเหลว!"
 murder_outcome.4301.failed_lack_of_planning:0 "บางทีความพยายามควรได้รับการวางแผนที่ดีกว่านี้เล็กน้อย เพราะแก๊งนักฆ่าที่คาดหวังของข้าต้องหนีจากทหารยามที่กระตือรือร้นเกินไป และทำงานไม่สำเร็จ"
 murder_outcome.4301.failed_attempt_1: "แม้ว่านักฆ่าที่ข้าจ้างจะทุบตี [target.GetHerHim] จนเกือบถึงแก่ชีวิตของ[target.GetHerHis] แต่เศษเสี้ยวแห่งชีวิตนั้นก็เพียงพอให้ [target.GetSheHe] รอดมาได้"
 murder_outcome.4301.something_is_known:0 "\n\nแม้ว่าจะชัดเจนสำหรับทุกคนว่านี่เป็นการพยายามสังหาร [target.GetTitledFirstNamePossessive] แต่การมีส่วนร่วมของข้ายังคงไม่เป็นที่ทราบ"
 murder_outcome.4301.unknown_so_far:0 "\n\nอย่างน้อยมันก็ถูกกล่าวโทษว่าเป็นการต่อสู้ระหว่างนักโทษ ดังนั้นการมีส่วนร่วมของข้าจึงยังคงไม่เป็นที่ทราบ"
 murder_outcome.4301.disastrous_lack_of_planning:0 "\n\nบางทีข้าควรจะอดทนกว่านี้เล็กน้อย เพราะไม่เพียง แต่แก๊งนักฆ่าที่คาดหวังของข้าถูกขัดขวางในการทำงานโดยทหารยามที่กระตือรือร้นเกินไป แต่หลายคนยังซัดทอดข้าว่าเป็นผู้รับผิดชอบ!"
 murder_outcome.4301.disastrous_attempt_1:0 "\n\nไม่เพียง แต่แก๊งนักฆ่าที่คาดหวังของข้าถูกขัดขวางในการทำงานโดยทหารยามที่กระตือรือร้นเกินไป แต่หลายคนยังซัดทอดข้าว่าเป็นผู้รับผิดชอบ!"
 murder_outcome.4301.a.discovered:0 "มันดีกว่าจริงๆ หรือที่จะปล่อยให้ [target.GetHerHim] เน่าเปื่อย?"
 murder_outcome.4301.a:0 "ให้ตายสิ!"

 murder_outcome.4401.failure_declaration_1:0 "อย่างใดอย่างหนึ่ง #EMP อย่างใดอย่างหนึ่ง#! [target.GetTitledFirstName] ยังมีชีวิตอยู่!"
 murder_outcome.4401.failed_attempt_1:0 "นักฆ่าบุกเข้าไปในห้องของ [target.GetHerHis] แต่ไม่ว่าเขาจะกดหมอนทับใบหน้าของ [target.GetTitleTierName] นานแค่ไหน [target.GetWomanMan] ผู้นั้นก็ไม่ยอมตาย"
 murder_outcome.4401.disastrous_attempt_1:0 "\n\nในไม่ช้าทหารยามก็มาถึง และนักฆ่าก็สารภาพไม่เพียง แต่แผนการ แต่ยัง รวมถึงการมีส่วนร่วมของข้าในนั้นด้วย!"
 murder_outcome.4401.something_is_known:0 "\n\nในไม่ช้าทหารยามก็มาถึง และนักฆ่าต้องหลบหนีอย่างรวดเร็ว อย่างน้อยก็ไม่มีใครรู้ว่าข้าอยู่เบื้องหลังความพยายาม"
 murder_outcome.4401.unknown_so_far:0 "\n\nเมื่อทหารยามปรากฏตัว นักฆ่าของข้าต้องหลบหนีอย่างรวดเร็ว แต่อย่างน้อยเขาก็ไปโดยไม่มีใครสังเกตเห็น และไม่มีใครรู้ว่าเขาเคยอยู่ที่นั่น"
 murder_outcome.4302.a.discovered:0 "โอ้ ข้าจำวันที่ประหารชีวิตของ [target.GetHerHis] ผิดหรือ?"
 murder_outcome.4401.a:0 "มันเป็นเพียงเรื่องของเวลา [target.GetFirstNameNoTooltip]"

 murder_outcome.5001.t:0 "สลัดทิ้ง ซึ่งร่างกายนี้"
 murder_outcome.5001.poisoned_duck:0 "ข้ากำลังเพลิดเพลินกับเป็ดในงานเลี้ยงของข้า ทันใดนั้นข้ารู้สึกว่าคอบวมและแขนขาเริ่มเชื่องช้า ข้ารู้สึกได้ถึงสิ่งที่กำลังจะมาถึง แต่ข้าไม่สามารถทำอะไรเพื่อหยุดมันได้\n\nไม่นานนักที่การมองเห็นของข้ามืดลงและเสียงหัวเราะที่ห่างไกลกลายเป็นเสียงกรีดร้องด้วยความหวาดกลัว ค่อยๆ ลอยห่างจากข้าไป"
 murder_outcome.5001.gang_of_thugs:0 "เดินทางผ่านป่าพร้อมกับคณะผู้ติดตามของข้า เราถูกโจมตีโดยกลุ่มอันธพาล ในไม่ช้าพวกเขาก็พิสูจน์ให้เห็นว่าสนใจชีวิตของเรามากกว่าทองคำของเรา และ แม้ว่าคนของข้าจะต่อสู้อย่างกล้าหาญ แต่พวกโจรก็ได้เปรียบจากการจู่โจม\n\nข้าวิ่งเร็วที่สุดเท่าที่จะทำได้ จนกระทั่งข้าคิดว่าข้าปลอดภัยแล้ว จากนั้น เหนือเสียงการต่อสู้ ข้าได้ยินเสียงสายธนูดีดเพียงครั้งเดียว"
 murder_outcome.5001.hired_assassin:0 "ข้าตื่นขึ้นกลางดึกเพื่อเห็นร่างมืดในห้องของข้า ข้าไม่รู้ว่าเกิดอะไรขึ้นกับทหารยามของข้า แต่เมื่อข้าเห็นแสงจันทร์สะท้อนบนคมดาบ ข้ารู้ว่ามันสายเกินไปสำหรับข้าแล้ว\n\nกริชที่คมเพียงพอแทบไม่ส่งเสียงเมื่อแทงทะลุเนื้อ และท่ามกลางความเจ็บปวดทรมาน ข้าไม่สามารถบอกได้ว่าเสียงกรีดร้องของข้าดังกว่าหรือไม่"
 murder_outcome.5001.creepy_crawly_intro:0 "ทันทีที่ข้ารู้สึกว่ามีบางอย่างสัมผัสขาของข้า ข้าอดไม่ได้ที่จะตัวสั่นและโยนผ้าห่มทิ้งไป แต่การเคลื่อนไหวอย่างรวดเร็วกลับยิ่งกระตุ้นแขกที่ไม่ได้รับเชิญมากขึ้น"
 murder_outcome.5001.creepy_crawly_known:0 "แม้ในแสงจันทร์สลัว ข้าก็สามารถจดจำรูปร่างของ [ROOT.Char.Custom('VenomousCreature')] ได้"
 murder_outcome.5001.creepy_crawly_unknown:0 "เมื่อรู้สึกว่าถูกคุกคาม [ROOT.Char.Custom('VenomousCreatureType')] ก็เคลื่อนไหวอย่างรวดเร็ว และโจมตี"
 murder_outcome.5001.creepy_crawly_end:0 "[ROOT.Char.Custom('VenomousCreatureAttack')] แทบไม่รู้สึกเจ็บในตอนแรก แต่ในไม่ช้าร่างกายทั้งร่างของข้าก็ถูกครอบงำด้วยความเจ็บปวดแสบร้อน ข้าพยายามเรียกขอความช่วยเหลือ แต่เสียงของข้าอ่อนแอเกินไปขณะที่แขนขาชาและสติเลือนลาง"
 murder_outcome.5001.riled_up_mob:0 "ข้ากำลังขี่ม้าผ่านถนนของ [ROOT.Char.GetCurrentLocation.GetName] เมื่อฝูงไพร่ที่กรีดร้องและตะโกนเข้ามาล้อมคณะผู้ติดตามของข้า ก่อนที่ข้าจะรู้ว่าเกิดอะไรขึ้น คนธรรมดาก็ฉีกข้าลงจากหลังม้าและเริ่มทุบตีข้า ข้าได้ยินเสียงทหารยามตะโกน แต่ก่อนที่พวกเขาจะมาถึงข้า โลกก็เลือนหายไปจากสายตาของข้า"
 murder_outcome.5001.bricked:0 "เมื่อวานข้าใช้เวลายามเย็นอย่างเพลิดเพลิน เมามายด้วยความรื่นเริงและไวน์\n\nเมื่อข้าตื่นขึ้นในตอนเช้าพร้อมกับอาการเมาค้างอย่างหนักและจำไม่ได้ว่าข้าอยู่ที่ไหนและมาที่นี่ได้อย่างไร ข้าพบว่าตัวเองอยู่ในห้องใต้ดินที่ชื้นแฉะ ซึ่งดูเหมือนจะมีกำแพงที่สร้างขึ้นใหม่ปิดทางออกเพียงทางเดียว! เสียงร้องขอความช่วยเหลือของข้าถูกกลืนหายไปในกำแพงหนา และความหวังที่จะถูกพบก็ริบหรี่ลงทุกชั่วโมงที่นับไม่ได้ จากนั้นก็มีเพียงความรู้สึกอ่อนแอที่เพิ่มขึ้น... #EMP บางทีข้าแค่งีบหลับสักหน่อย...#!"
 murder_outcome.5001.sunken_boat:1 "ข้าอยู่บนเรือ เพลิดเพลินกับลมยามเย็น ทันใดนั้นธนูไฟก็พุ่งข้ามท้องฟ้ามาทางเรา!\n\nมันกระทบเรือด้วยเสียง #EMP ตุ้บ#! หนักๆ และเพียงชั่วครู่เรือทั้งลำก็ลุกเป็นไฟ และข้าก็โยนตัวเองลงไปในน้ำทะเลเย็น ขณะที่เสื้อผ้าหนักๆ ดึงข้าลงไปใต้ผิวน้ำ ข้าพยายามว่ายน้ำ ข้าพยายามเอื้อมหาบางสิ่งที่จะยึดเกาะ ข้าพยายาม #EMP หายใจ#!..."
 murder_outcome.5001.sunken_boat_travel:1 "ข้าอยู่บนเรือในทะเลเปิด ทันใดนั้นธนูไฟก็พุ่งข้ามท้องฟ้ามาทางเรา!\n\nมันกระทบเรือด้วยเสียง #EMP ตุ้บ#! หนักๆ และเพียงชั่วครู่เรือทั้งลำก็ลุกเป็นไฟ และข้าก็โยนตัวเองลงไปในน้ำทะเลเย็น ขณะที่เสื้อผ้าหนักๆ ดึงข้าลงไปใต้ผิวน้ำ ข้าพยายามว่ายน้ำ ข้าพยายามเอื้อมหาบางสิ่งที่จะยึดเกาะ ข้าพยายาม #EMP หายใจ#!..."
 murder_outcome.5001.poisoned_drink_alcohol:0 "ขณะที่ข้ากำลังเพลิดเพลินกับอาหารค่ำและ [ROOT.Char.Custom('RegionalAlcoholicDrink')] เต็มถ้วย ทันใดนั้นข้ารู้สึกถึงความรู้สึกแปลกๆ ในลำคอ"
 murder_outcome.5001.poisoned_drink_no_alcohol:0 "ขณะที่ข้ากำลังเพลิดเพลินกับอาหารค่ำและ [ROOT.Char.Custom('RegionalDrink')] เต็มถ้วย ทันใดนั้นข้ารู้สึกถึงความรู้สึกแปลกๆ ในลำคอ"
 murder_outcome.5001.poisoned_drink:0 "ใช้เวลาไม่นานก่อนที่ข้าจะ #EMP ข่วน#! คอของข้า พยายามหายใจ กรีดร้อง เพื่อให้อากาศใดๆ ผ่านลำคอที่บวมและมีเลือดออกของข้าไปได้ ขณะที่สติของข้าเลือนลาง ข้าเห็นว่ามีเลือดและผิวหนังอยู่ใต้เล็บของข้า ข้าจะต้องล้างมันออก ช่างไม่น่าดูเสียเลย..."
 murder_outcome.5001.assassin:0 "[assassin.GetFirstName] พาข้าเข้ามาในป่าเพื่อเล่น และเราสนุกกันมากวันนี้! อย่างไรก็ตาม [assassin.GetSheHe] ไปซ่อนนานมากแล้ว และข้าหา [assassin.GetHerHim] ไม่เจอ และมันเริ่มมืดและน่ากลัวเร็วมาก..."
 murder_outcome.5001.courtier:0 "ข้าราชสำนักบางคนพาข้าเข้ามาในป่าเพื่อเล่น และเราสนุกกันมากวันนี้! อย่างไรก็ตาม พวกเขาไปซ่อนนานมากแล้ว และข้าหาพวกเขาไม่เจอ และมันเริ่มมืดและน่ากลัวเร็วมาก..."
 murder_outcome.5001.lured_into_forest:0 "\n\nข้าพยายามหาทางกลับบ้าน แต่ต้นไม้ทุกต้นดูเหมือนกันหมดสำหรับข้า และในไม่ช้าข้าก็ได้ยินเสียงสัตว์ประหลาดกำลังมาหาข้า ข้าเริ่มวิ่ง แต่พวกมันเร็วกว่า ใหญ่กว่า และแข็งแรงกว่า... ข้าหลับตาและร้องหาแม่"
 murder_outcome.5001.stab_infant:0 "แสงสว่างเคลื่อนไหว ใบหน้าที่คุ้นเคย ใบหน้าที่ไม่คุ้นเคย เสียงที่ข้ารู้จัก และเสียงที่ข้าไม่รู้จัก เสียงแหลมเย็นเยียบ ทำให้หูข้าเจ็บปวด และข้าก็เริ่มร้องไห้\n\nข้ารู้สึกว่ามีคนจับศีรษะข้า ความเจ็บปวดอันเจิดจ้า แล้วก็ไม่มีอะไรเลย"
 murder_outcome.5001.infant_creepy_crawly:0 "เตียงนุ่มๆ ใต้ร่างข้าและผ้าห่มอุ่นๆ คลุมกายข้าคือทั้งหมดที่ข้าปรารถนา ข้าเกือบจะหลับแล้วเมื่อข้ารู้สึกถึงความรู้สึกประหลาด ราวกับมีบางสิ่งกำลังเคลื่อนไหวขึ้นมาบนตัวข้า ความเจ็บปวดพลันผลิบานที่แขนข้าและข้าก็เริ่มร้องไห้\n\nความเจ็บปวดมี แต่จะแผ่ขยายและรุนแรงขึ้น #EMP มันเจ็บปวดเหลือเกิน#! ความเจ็บปวดคือทั้งหมดที่โลกของข้ามีอยู่ จนกระทั่งไม่เหลือสิ่งใดเลย"
 murder_outcome.5001.poisoned_candy:0 "ข้ากำลังเล่นอยู่ข้างนอก รู้สึกหิวนิดหน่อย เมื่อคนรับใช้คนหนึ่งปรากฏตัวขึ้นจากที่ไหนก็ไม่รู้ นำของขวัญอันยิ่งใหญ่ที่สุดมาให้: [ROOT.Char.Custom('FavoriteTreat')] ที่น่ารับประทาน\n\nเพียงชั่วครู่ โลกก็เอียงไป ท้องข้าเริ่มกรีดร้อง และข้า #EMP หายใจไม่ออก#!! ข้าล้มลงกับพื้นขณะที่ [ROOT.Char.Custom('FavoriteTreat')] ที่ถูกกัดหลุดจากมือข้า"
 murder_outcome.5001.child_pushed_dog:0 "ข้ากำลังเล่นอยู่ข้างนอกเมื่อข้าได้ยินเสียงนั้น: เสียงร้องอย่างสิ้นหวังของ [ROOT.Char.Custom('DogStoryName')] สุนัขสุดที่รักของข้า! เมื่อมองขึ้นไป ข้าเห็น [ROOT.Char.Custom('DogStoryHerHim')] ห้อยอยู่ด้วยเชือกจากกำแพงสูง และข้าก็ไปอยู่ข้าง [ROOT.Char.Custom('DogStoryHerHis')] เร็วที่สุดเท่าที่จะทำได้\n\nขณะที่ข้าเอื้อมมือลงไปช่วย [ROOT.Char.Custom('DogStoryHerHim')] โลกก็พลิกกลับและข้ากำลังร่วงหล่น; พื้นดินกำลังลอยขึ้นมาหาข้า และข้าหลับตาลงและ–"
 murder_outcome.5001.child_pushed_cat:0 "ข้ากำลังเล่นอยู่ข้างนอกเมื่อข้าได้ยินเสียงนั้น: เสียงร้องอย่างสิ้นหวังของ [ROOT.Char.Custom('CatStoryName')] แมวสุดที่รักของข้า! เมื่อมองขึ้นไป ข้าเห็น [ROOT.Char.Custom('CatStoryHerHim')] ห้อยอยู่ด้วยเชือกจากกำแพงสูง และข้าก็ไปอยู่ข้าง [ROOT.Char.Custom('CatStoryHerHis')] เร็วที่สุดเท่าที่จะทำได้\n\nขณะที่ข้าเอื้อมมือลงไปช่วย [ROOT.Char.Custom('CatStoryHerHim')] โลกก็พลิกกลับและข้ากำลังร่วงหล่น; พื้นดินกำลังลอยขึ้นมาหาข้า และข้าหลับตาลงและ–"
 murder_outcome.5001.child_pushed_toy:0 "ข้ากำลังเล่นอยู่ข้างนอกเมื่อข้าเห็นมัน: [target.Custom('child_favorite_toy')] สุดที่รักของข้าห้อยอยู่ด้วยเชือกจากกำแพงสูง ข้าปีนบันไดขึ้นไปเร็วที่สุดเท่าที่จะทำได้ แต่ขณะที่ข้าเอื้อมมือลงไปช่วยมัน โลกก็พลิกกลับและข้ากำลังร่วงหล่น; พื้นดินกำลังลอยขึ้นมาหาข้า และข้าหลับตาลงและ–"
 murder_outcome.5001.child_pushed:0 "ข้ากำลังเล่นอยู่ข้างนอกเมื่อข้าเห็นมัน: รอยทางขนมหวานที่นำขึ้นไปยังบันไดบางแห่ง ที่ด้านบนข้าพบตะกร้าห้อยอยู่ที่ขอบ เต็มไปด้วยขนมหวาน! แต่ขณะที่ข้าเอื้อมมือลงไปหยิบมัน โลกก็พลิกกลับและข้ากำลังร่วงหล่น; พื้นดินกำลังลอยขึ้นมาหาข้า และข้าหลับตาลงและ–"
 murder_outcome.5001.beat_to_death_in_dungeon:0 "เมื่อประตูห้องขังในคุกใต้ดินของข้าเปิดออก ข้ากล้าหวังอยู่ชั่วครู่ว่าข้าจะได้รับการปล่อยตัว อย่างไรก็ตาม กลุ่มคนสวมเสื้อคลุมเข้ามา และข้ารู้ทันทีว่าอะไรรอข้าอยู่\n\nการทุบตีนั้นรุนแรงและโหดเหี้ยม ร่างกายที่อ่อนแอของข้าไม่อาจต้านทานได้ ขณะที่ข้านอนอยู่บนพื้นและรู้สึกว่าชีวิตกำลังหลุดลอยไป ข้าสังเกตอย่างเหม่อลอยว่าเลือดของข้าผสมกับน้ำบนพื้นชื้นแฉะ"
 murder_outcome.5001.unwelcome_guest_house_arrest:0 "ข้าไม่คุ้นเคยกับ[dummy_gender.GetWomanMan]ที่รออยู่ในห้องของข้า แม้ว่า[dummy_gender.GetSheHe]จะโน้มน้าวผู้คุมขังของข้าว่า[dummy_gender.GetSheHe]เป็นสหายเก่าของข้าก็ตาม\n\nเพียงเมื่อ[dummy_gender.GetSheHe]ชักกริชที่ซ่อนอยู่ออกมา ข้าจึงจำ[dummy_gender.GetHerHim]ได้ว่าเป็น[dummy_gender.Custom('GenderedLowlyServantType')]เก่าแก่จาก"
 murder_outcome.5001.unwelcome_guest_house_arrest.target_court:0 "ราชสำนักที่ [target_home.GetNameNoTier]"
 murder_outcome.5001.unwelcome_guest_house_arrest.no_court:0 "ราชสำนักเดิมของ[target.GetFirstNamePossessiveNoTooltip]"
 murder_outcome.5001.unwelcome_guest_house_arrest.end:0 "การโจมตีของ[dummy_gender.GetHerHis|U]รวดเร็วจนไม่อาจตอบโต้ได้ทัน"
 murder_outcome.5001.strangle_incapable:0 "โลกภายนอกยังคงอยู่หรือไม่? ข้าไม่รู้สึกถึงกาลเวลาที่ผ่านไป นั่นคือความเจ็บปวดที่... หน้าอก? หรือ... ลำคอ? นี่คือร่างกายของข้าเองหรือ? นั่นคือราตรีกาลที่กำลังคืบคลานเข้ามาในหมู่เมฆสีเทาแห่งจิตใจข้าหรือ? มันยากเหลือเกินที่จะตั้งสติ\n\nยาก... เหลือเกิน..."
 murder_outcome.5001.schemer_known:0 "\n\nไม่มีข้อสงสัยใดๆ ในใจข้าเลยว่าใครเป็นผู้นำพาสิ่งนี้มาสู่ข้า [owner.GetTitledFirstName]!"
 murder_outcome.5001.avenge_me:0 "เหล่าทายาทของข้า จงแก้แค้นให้กับการตายของข้า!"
 murder_outcome.5001.not_my_time:0 "ข้ายังมีอะไรอีกมากมายที่ต้องมีชีวิตอยู่เพื่อ!"
 murder_outcome.5001.option_incapable:0 "ในที่สุด ความตาย"
 
 murder_outcome.5002.t:0 "ความพยายามลอบสังหารข้า!"
 murder_outcome.5002.poisoned_duck:0 "ขณะที่ข้ากำลังจะกัดเป็ดชิ้นที่ดูชุ่มฉ่ำที่สุดเท่าที่ข้าเคยเห็น คนรับใช้คนหนึ่งของข้าก็ล้มลง กุมคอของเขา! เห็นได้ชัดว่า คนโง่เขลาผู้นั้นได้แอบชิมอาหารของข้า\n\nอย่างน้อยที่สุด เขาก็ทำหน้าที่เป็นเครื่องเตือนใจไม่ให้แตะต้องนกที่ปนเปื้อนนั้น ขณะเดียวกันก็ได้รับโทษทัณฑ์อันสาสมสำหรับความไม่รอบคอบของเขา"
 murder_outcome.5002.gang_of_thugs:0 "ขณะเดินทางผ่านป่า คณะผู้ติดตามของข้าถูกโจรปล้น! พวกมันไม่ได้ต้องการทองคำของข้า แต่โจมตีทันที — เร็วกว่าที่ข้าจะสั่งให้คนของข้าฆ่าพวกมัน ณ ที่นั้น การต่อสู้นั้นดุเดือดยิ่งกว่าที่คาดไว้ และที่แย่ไปกว่านั้น พวกอันธพาลมุ่งเป้ามาที่ข้าอย่างชัดเจน!\n\nโชคดีที่ไม่มีพวกมันเหลือรอดในท้ายที่สุด เพราะการโจมตีที่มุ่งร้ายของพวกมันเกือบจะเอาชนะข้าได้"
 murder_outcome.5002.hired_assassin:0 "เสียงคล้ายกับนักฆ่าสะดุดหม้อปัสสาวะปลุกข้าให้ตื่นจากการหลับใหลยามดึก เมื่อเห็นผู้ที่หมายจะสังหารข้า ข้าตะโกนเรียกทหารยามด้วยท่าทีสุขุมและสมเป็น[SCOPE.GetRootScope.GetCharacter.GetWomanMan] เมื่อพวกเขามาถึง การต่อสู้สั้นๆ ก็เกิดขึ้น ส่งผลให้ผู้บุกรุกเสียชีวิต"
 murder_outcome.5002.creepy_crawly_end:0 "พิษของ[SCOPE.Custom('VenomousCreatureType')]แผ่ซ่านไปทั่วร่างกายข้าพร้อมกับความรู้สึกแสบร้อน แต่ข้าเรียกหมอหลวงของข้าทันที มันเป็นความพยายามที่เจ็บปวด แต่เมื่อดวงอาทิตย์ขึ้น ความเจ็บปวดจากพิษก็คลายลงในที่สุด"
 murder_outcome.5002.riled_up_mob:0 "ข้ากำลังขี่ม้าไปตามถนนใน [home_province.GetNameNoTier] เมื่อฝูงชนชาวบ้านที่กรีดร้องและตะโกนโหวกเหวกเข้ามาล้อมคณะผู้ติดตามของข้า โชคดีที่ทหารยามของข้าไม่ลังเลที่จะเริ่มฟันพวกมันซ้ายขวา ขณะที่ข้าเดินทางกลับไปยัง[ROOT.Char.Custom('ResidenceBuilding')]"
 murder_outcome.5002.bricked:0 "เมื่อวานนี้ข้าเข้าร่วมงานเฉลิมฉลองในท้องถิ่นที่ [home_province.GetName] และใช้เวลายามเย็นอย่างเพลิดเพลิน เมามายด้วยความรื่นเริงและไวน์\n\nเมื่อข้าตื่นขึ้นในตอนเช้าพร้อมกับอาการเมาค้างอย่างหนักและจำไม่ได้ว่าข้าอยู่ที่ไหนและมาถึงที่นี่ได้อย่างไร ข้าพบว่าตัวเองอยู่ในห้องใต้ดินที่ชื้นแฉะ ซึ่งมีกำแพงที่สร้างขึ้นใหม่ #EMP เกือบจะ#! ปิดทางออกเพียงทางเดียว มีคนตั้งใจจะฝังข้าไว้ที่นี่!"
 murder_outcome.5002.sunken_boat:0 "ข้าอยู่บนเรือในท่าเรือที่ [province.GetNameNoTier] ทันใดนั้นลูกธนูเพลิงก็พุ่งข้ามท้องฟ้ามาทางพวกเรา!\n\nมันพลาดเรือไปเพียงเส้นยาแดงผ่าแปด และขณะที่ข้าก้มลงมองมันดับฟู่ในน้ำทะเลเย็น ข้าก็ได้กลิ่นที่ชัดเจนมาจากไม้ของเรือ: ไฟกรีก! นี่คือความพยายามลอบสังหารข้า"
 murder_outcome.5002.poisoned_drink:0 "ขณะกำลังรับประทานอาหารค่ำ คนรับใช้คนหนึ่งก็พรวดพราดเข้ามาในห้องและปัดถ้วยออกจากมือข้า #EMP ทันที#! ที่ข้ากำลังจะจิบ!\n\n"[ROOT.Char.Custom('FormOfAddressForLiege')|U] ยาพิษ! หนึ่งในสาวรับใช้ในครัว... อภัยให้นางด้วย นางจิบเข้าไป และนาง– นางตายแล้ว!""
 murder_outcome.5002.lured_into_forest:0 "[assassin.GetFirstName] ล่อข้าเข้าไปในป่าเพื่อเล่น แต่แล้ว [assassin.GetSheHe] ก็ซ่อนตัวและไม่เคยโผล่ออกมาอีกเลย!\n\nหลังจากร้องไห้ สะดุดกิ่งไม้ และตะโกนขอความช่วยเหลือจนคอข้าแหบแห้ง ทันใดนั้นข้าก็หาทางออกจากป่าและกลับบ้านได้อย่างปลอดภัย"
 murder_outcome.5002.stab_infant:0 "แสงสว่างเคลื่อนไหว ใบหน้าที่คุ้นเคย ใบหน้าที่ไม่คุ้นเคย เสียงที่ข้ารู้จัก และเสียงที่ข้าไม่รู้จัก เสียงแหลมเย็นเยียบ ทำให้หูข้าเจ็บปวด และข้าก็เริ่มร้องไห้\n\nจากนั้นข้าก็ได้ยินเสียงผู้หญิงสะอื้น เสียงดังและเป็นผู้ใหญ่ เสียงตะโกน ตื่นตระหนก จากนั้นข้าก็ถูกทิ้งให้อยู่ตามลำพัง"
 murder_outcome.5002.infant_creepy_crawly:0 "ผ้าห่มนุ่มๆ ใต้ร่างข้า และผ้าคลุมอุ่นๆ ข้าเกือบจะหลับแล้วเมื่อข้ารู้สึกถึงความรู้สึกประหลาด ราวกับมีบางสิ่งกำลังเคลื่อนไหวขึ้นมาบนตัวข้า ความเจ็บปวดพลันผลิบานที่แขนข้าและข้าก็เริ่มร้องไห้\n\nข้าได้ยินเสียงผู้ชายอยู่ใกล้ๆ และทันใดนั้นข้าก็ได้ยินเสียงมากมายดังขึ้นด้วยความตื่นตระหนก เมื่อเสียงเหล่านั้นจางหายไป ความเจ็บปวดที่แขนข้าก็ เช่นกัน และในไม่ช้าข้าก็หลับไป"
 murder_outcome.5002.poisoned_candy:0 "ข้ากำลังเล่นอยู่ข้างนอกเมื่อมันปรากฏขึ้นต่อหน้าข้า: [ROOT.Char.Custom('FavoriteTreat')] ที่น่ารับประทาน ไม่มีใครอยู่ใกล้ และไม่มีใครสังเกตเห็นถ้าข้าแอบกัดสักคำ...\n\nทันทีที่ข้ากำลังจะกัดขนม สุนัขข้างถนนขี้เรื้อนตัวหนึ่งก็ฉกมันไปจากมือข้า กลืนลงไปทั้งชิ้น และล้มลงตายกับพื้นทันที"
 murder_outcome.5002.child_pushed_dog:0 "ข้ากำลังออกไปเล่นเมื่อได้ยินเสียง: เสียงร้องโหยหวนของ [ROOT.Char.Custom('DogStoryName')] สุนัขสุดที่รักของข้า! เมื่อเงยหน้ามอง ข้าเห็น [ROOT.Char.Custom('DogStoryHerHim')] ถูกแขวนด้วยเชือกจากกำแพงสูง ข้ารีบไปอยู่ข้าง [ROOT.Char.Custom('DogStoryHerHis')] เร็วที่สุดเท่าที่จะทำได้\n\nขณะที่ข้าเอื้อมมือลงไปช่วย [ROOT.Char.Custom('DogStoryHerHim')] โลกรอบตัวก็หมุนคว้างและข้ากำลังร่วงหล่น; พื้นดินใกล้เข้ามาเรื่อยๆ ข้าหลับตาลงและ– ...พบว่าตนเองห้อยต่อง แต่งอยู่กับกำแพงโดยมีด้านหลังของ [ROOT.Char.Custom('GetUpperClothingArticle')] เกี่ยวไว้ #EMP เฮ้อ!#!"
 murder_outcome.5002.child_pushed_cat:0 "ข้ากำลังออกไปเล่นเมื่อได้ยินเสียง: เสียงร้องโหยหวนของ [ROOT.Char.Custom('CatStoryName')] แมวสุดที่รักของข้า! เมื่อเงยหน้ามอง ข้าเห็น [ROOT.Char.Custom('CatStoryHerHim')] ถูกแขวนด้วยเชือกจากกำแพงสูง ข้ารีบไปอยู่ข้าง [ROOT.Char.Custom('CatStoryHerHis')] เร็วที่สุดเท่าที่จะทำได้\n\nขณะที่ข้าเอื้อมมือลงไปช่วย [ROOT.Char.Custom('CatStoryHerHim')] โลกรอบตัวก็หมุนคว้างและข้ากำลังร่วงหล่น; พื้นดินใกล้เข้ามาเรื่อยๆ ข้าหลับตาลงและ– ...พบว่าตนเองห้อยต่อง แต่งอยู่กับกำแพงโดยมีด้านหลังของ [ROOT.Char.Custom('GetUpperClothingArticle')] เกี่ยวไว้ #EMP เฮ้อ!#!"
 murder_outcome.5002.child_pushed_toy:0 "ข้ากำลังออกไปเล่นเมื่อเห็นมัน: [target.Custom('child_favorite_toy')] สุดรักของข้าถูกแขวนด้วยเชือกจากกำแพงสูง ข้าปีนบันไดขึ้นไปเร็วที่สุดเท่าที่จะทำได้ แต่ขณะที่ข้าเอื้อมมือลงไปช่วยมัน โลกรอบตัวก็หมุนคว้างและข้ากำลังร่วงหล่น; พื้นดินใกล้เข้ามาเรื่อยๆ ข้าหลับตาลงและ– ...พบว่าตนเองห้อยต่อง แต่งอยู่กับกำแพงโดยมีด้านหลังของ [ROOT.Char.Custom('GetUpperClothingArticle')] เกี่ยวไว้ #EMP เฮ้อ!#!"
 murder_outcome.5002.child_pushed:0 "ข้ากำลังออกไปเล่นเมื่อเห็นมัน: ทางเดินที่โรยด้วยขนมหวานนำขึ้นไปยังบันได ที่ด้านบน ข้าพบตะกร้าใบหนึ่งห้อยอยู่ที่ขอบ เต็มไปด้วยลูกกวาด! แต่ขณะที่ข้าเอื้อมมือลงไปหยิบมัน โลกรอบตัวก็หมุนคว้างและข้ากำลังร่วงหล่น; พื้นดินใกล้เข้ามาเรื่อยๆ ข้าหลับตาลงและ– ...พบว่าตนเองห้อยต่อง แต่งอยู่กับกำแพงโดยมีด้านหลังของ [ROOT.Char.Custom('GetUpperClothingArticle')] เกี่ยวไว้ #EMP เฮ้อ!#!"
 murder_outcome.5002.beat_to_death_in_dungeon:0 "เมื่อประตูห้องขังของข้าเปิดออก ชั่วขณะหนึ่งข้ากล้าที่จะหวังว่าจะได้รับการปล่อยตัว อย่างไรก็ตาม กลุ่มคนสวมเสื้อคลุมที่เข้ามาในไม่ช้าก็ทำลายความหวังของข้า และเริ่มทุบตีข้าอย่างโหดเหี้ยม\n\nแม้ข้าจะไม่อยากกล่าว เช่นนั้น แต่เป็นเพียงการมาถึงโดยบังเอิญ— แต่ทันเวลา—ของทหารยามของข้าเท่านั้นที่ช่วยชีวิตข้าไว้"
 murder_outcome.5002.unwelcome_guest_house_arrest:0 "ว่ากันว่าสหายเก่ากำลังรออยู่ในห้องพักของข้า ข้าจึงประหลาดใจยิ่งนักเมื่อพบกับร่างในชุดคลุมมีฮู้ด—ร่างที่ไม่คุ้นเคยและน่าสงสัยอย่างยิ่ง\n\nดังนั้น ทันทีที่กริชที่ซ่อนไว้ปรากฏออกมา ข้าก็เตรียมพร้อมที่จะวิ่งไปที่ประตู ร้องเรียกทหารยาม พวกเขารออยู่ด้านนอกห้องพอดี ข้าจึงสันนิษฐานว่าพวกเขาก็ไม่ไว้วางใจคนต่างถิ่นผู้นี้ เช่นกัน นับเป็นโชคดีของข้า"
 murder_outcome.5002.strangle_incapable:0 "โลกภายนอกยังคงอยู่หรือไม่? ข้ารู้สึกไม่ได้ถึงกาลเวลาที่ผ่านไป ความเจ็บปวดนี้อยู่ที่...อก? หรือ...ลำคอ? นี่ใช่ร่างกายของข้าเองหรือ? นั่นคือราตรีกาลที่กำลังโรยตัวลงบนเมฆาสีเทาในจิตใจข้าหรือ? ช่างยากเหลือเกินที่จะตั้งสติ\n\nมีผู้ใดอยู่รอบกายข้าหรือไม่? ข้าไม่ได้ยิน แต่ #EMP รู้สึก#! ราวกับมีคนกำลังตะโกน จากนั้น อีกครั้ง มีเพียงความเงียบงัน"
 murder_outcome.5002.schemer_known:0 "\n\nนี่เป็นฝีมือของ [owner.Custom2('InsultAdjective', ROOT.Char)] [owner.Custom2('InsultNoun', ROOT.Char)] [owner_to_reveal.GetTitledFirstName] อย่างมิต้องสงสัย!"
 murder_outcome.5002.will_find_out:0 "ข้าจะสืบหาให้ได้ว่าผู้ใดอยู่เบื้องหลังเรื่องนี้!"
 murder_outcome.5002.revenge_will_be_had:0 "ข้าจะ ทำให้ [owner_to_reveal.GetHerHim] ต้องเสียใจกับการกระทำนี้!"
 murder_outcome.5002.child:0 "ผู้ใหญ่คนใดกันที่จะโหดร้ายถึงเพียงนี้?"
 murder_outcome.5002.infant:0 "ข้าร้องไห้ต่อไปอีก"
 murder_outcome.5002.option_incapable:0 "เกิดอะไรขึ้น?"

 murder_outcome.5002.memories_death:0 "\n\nขณะที่ข้าเลือนหายไป เสียงหนึ่งกล่าวอย่างเย็นชาว่า:\n#EMP \"งานเสร็จสิ้นแล้ว แก้แค้นสำหรับคราที่ [bad_memory.GetThirdPerspectiveDescription], เรียบร้อย ถึงเวลาไปรับทองแล้ว\"#!"
 murder_outcome.5002.memories:1 "\n\nพบกระดาษโน้ตยับยู่ยี่ใกล้ที่เกิดเหตุ: #EMP \"แนบค่าจ้างมาครบถ้วนแล้ว สัญญาจ้างออกให้สำหรับเมื่อคราที่ [bad_memory.GetThirdPerspectiveDescription]\"#!"
 # Family Feud
