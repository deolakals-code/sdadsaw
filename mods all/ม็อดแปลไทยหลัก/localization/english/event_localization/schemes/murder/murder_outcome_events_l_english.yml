 murder_outcome.4001.not_exposed_scheme: "เมื่อ [dummy_assassin_gender.GetSheHe] ถูกพบเห็นและสัญญาณเตือนดังขึ้น นักฆ่าก็ทำการหลบหนีของ[dummy_assassin_gender.GetHerHis]ไปทันที และไม่มีใครได้ยินข่าวคราวอีกเลย\n\nตอนนี้ [target.GetTitledFirstName] กำลังระวังตัวของ[target.GetHerHis]"
 murder_outcome.4001.a.discovered:0 "[dummy_assassin_gender.GetSheHe|U] อยู่ที่นั่นจริงๆ เพื่อไล่ฆาตกร #EMP ตัวจริง#! และทำสำเร็จ!"
 murder_outcome.4001.a:0 "เจ้าจะต้องชดใช้สักวัน [target.GetFirstNameNoTooltip]!"
 murder_outcome.4001.b:0 "หากครั้งแรกไม่สำเร็จ..."

