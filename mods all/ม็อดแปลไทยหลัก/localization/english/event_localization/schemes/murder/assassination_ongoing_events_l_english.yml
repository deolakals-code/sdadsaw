l_english: 
 do_not_execute_assassination_tooltip: "อย่าพยายามดำเนินการลอบสังหาร"

 assassination_ongoing.0001.t: "ผู้เห็นใจอย่างลับๆ"
 assassination_ongoing.0001.desc: "นักฆ่าของข้า [assassin.GetName] ได้ค้นพบว่า [secret_sympathizer.GetName] หนึ่งในข้าราชสำนักของ [target.GetNamePossessive] ค่อนข้างเห็นใจในอุดมการณ์ของเรา — หากมิได้นับถือศรัทธา [ROOT.Char.GetFaith.GetName] อย่างเปิดเผย\n\n\"[secret_sympathizer.GetSheHe|U] ยินดีที่จะช่วยเหลือเราในแผนการนี้\" [assassin.GetFirstNameNoTooltip] อธิบาย \"แต่เพื่อเป็นการตอบแทน [secret_sympathizer.GetSheHe] ต้องการได้รับพรและความโปรดปรานจากท่านในฐานะผู้สนับสนุนอันยิ่งใหญ่แห่ง [ROOT.Char.GetFaith.GetAdherentNameNoTooltip]\""
 assassination_ongoing.0001.a: "ข้าจะกล่าวถึง [secret_sympathizer.GetHerHim] เป็นอย่างดีต่อหน้า [ROOT.Char.GetFaith.HighGodNameAlternate]"
 assassination_ongoing.0001.b: "ข้าไม่สามารถอวยพรคนจรจัดสิ้นหวังทุกคนที่เจ้าพามาต่อหน้าข้าได้"
 fp3_sympathizer_might_betray_you.flavor: "[secret_sympathizer.GetFirstNameNoTooltip] อาจขัดขวางเรา แทนที่จะช่วยเหลือ..."

 assassination_ongoing.0002.t: "การเกลี้ยกล่อมผู้คลั่งศาสนา"
 assassination_ongoing.0002.desc: "[assassin.GetName] ดูเหมือนจะเคร่งเครียดในการเตรียมตัวสำหรับภารกิจของ [assassin.GetHerHis] แน่นอนว่าข้ารู้ว่าโอกาสที่จะตายอย่างทรมานไม่ได้ขัดขวาง [assassin.GetHerHim] ดังนั้นมันต้องเป็นอย่างอื่น เมื่อข้าถาม [assassin.GetSheHe] ก็เข้าประเด็นทันที\n\n\"ข้าต้องการผู้ร่วมงานเพิ่มเพื่อช่วยข้าปฏิบัติภารกิจนี้ต่อต้าน [target.GetTitledFirstName]\" [assassin.GetSheHe] บอกข้า \"ข้าพบบรรดาผู้ศรัทธา [ROOT.Char.GetFaith.GetAdherentNameNoTooltip] สองสามคนในถิ่นทุรกันดาร ที่ ซึ่งพวกเขาถูกเนรเทศโดย [Select_CString(ROOT.Char.IsFemale,'ท่านหญิง','ท่านลอร์ด')] ผู้เป็นปฏิปักษ์ต่ออุดมการณ์ของเรา พวกเขายินดีที่จะช่วย หากเราจัดหาอาวุธและชุดเกราะให้\""
 assassination_ongoing.0002.a: "ชายหญิงทุกคนในหมู่ผู้ศรัทธายินดีที่จะช่วยเหลือเรา!"
 assassination_ongoing.0002.b: "ข้าไม่อยากจะไว้วางใจคนพเนจรเหล่านี้..."

assassination_usury_event_title: "ทองคำและ [owner.GetFaith.HighGodNameAlternate]"
assassination_not_usury_event_title: "ถุงทองคำใบเล็ก"
assassination_ongoing.0003_opening: "[assassin.GetName] ดูเหมือนจะพบจุดอ่อนรอบตัว [target.GetName] ที่เราสามารถใช้ประโยชน์ได้\n\n\"แท้จริงแล้ว\" [assassin.GetSheHe] กล่าว \"ข้าได้สื่อสารอย่างลับๆ กับ "
assassination_usury_event_scullery_maid_desc: "สาวใช้ห้องล้างจานผู้ต่ำต้อย แต่เต็มไปด้วยความแค้น"
assassination_usury_event_guard_desc: "ยามผู้ฉ้อฉล"
assassination_usury_event_harem_slave_desc: "ทาสฮาเร็มผู้ทะเยอทะยาน"
assassination_usury_event_gardener_desc: "คนสวนผู้ไม่น่าสงสัย ซึ่งเคยเป็นหนึ่งใน [owner.GetFaith.GetAdherentNameNoTooltip]"
assassination_usury_event_minor_servant_desc: "คนรับใช้ชั้นผู้น้อยที่ไม่สำคัญ แต่มีทักษะยอดเยี่ยม"
assassination_ongoing.0003.outro: "— และพวกเขายินดีที่จะให้ข้อมูลแก่เรา แต่ต้องมีราคา เราต้องจ่ายเป็นทองคำ... อย่างลับๆ\"\n\nชั่วขณะหนึ่ง ข้าพเจ้าพบว่าตนเองเกิดความสงสัย ใช่ บริการสามารถซื้อได้ แต่ความภักดีและความไว้วางใจเล่า?"
assassination_ongoing.0003.a: "การผิดพลาดเป็นเรื่องของมนุษย์..."
assassination_ongoing.0003.b: "ข้าไม่เห็นเหตุผลที่จะลังเล!"
assassination_ongoing.0003.c: "ไม่ ข้าจะ #italic ได้รับ#! ความภักดีของผู้คน ไม่ใช่ซื้อมันมา"


assassination_ongoing.0004.t: "ชั่วขณะแห่งความสงสัย"
assassination_ongoing.0004_opening: "[assassin.GetName] ดูวิตกกังวลผิดปกติ บางทีอาจถึงขั้นสิ้นหวัง\n\n"ใช่แล้ว" [assassin.GetSheHe] สารภาพขณะที่ข้าเข้าไปใกล้ "ศรัทธาของข้ากำลังสั่นคลอน [ROOT.Char.Custom('FormOfAddressForLiege')] ข้าเริ่มสงสัยในพันธสัญญาถึงรางวัลอันยิ่งใหญ่ในปรโลก ข้าควรจะสละชีวิตเพื่อสังหาร [target.GetFirstName] [target.Custom2('InsultAdjective', SCOPE.sC('assassin'))] ผู้นั้นหรือ? จะเป็น เช่นไรหาก [assassin.GetFaith.HighGodNameAlternate] มิเห็นชอบกับการสังหารผู้ไร้ศรัทธา #EMP ทั้งหมด#!?"\n\nขณะที่ข้ามองดูหัวหน้านักฆ่าผู้สับสนของข้า ข้าตระหนักได้ว่าทั้งหมดที่[assassin.GetSheHe]ต้องการคือ "
assassination_doubt_event_hashish_desc: "การสงบสติอารมณ์ด้วยกัญชาบางส่วน เพื่อกลายเป็นภาชนะที่ว่างเปล่าสำหรับเจตจำนงของ [assassin.GetFaith.HighGodName]"
assassination_doubt_event_alcohol_desc: "การดื่มอย่างหนักจน [assassin.GetSheHe] อาจมองเห็นโลกที่อยู่พ้นไป"
assassination_doubt_event_food_desc: "การดื่มด่ำชั่วขณะกับความสุขที่มีเพียงอาหารดีๆ เท่านั้นที่มอบให้ได้"
assassination_doubt_event_confide_desc: "ใครสักคนที่จะรับฟัง [assassin.GetHerHim] และปลอบโยน [assassin.GetHerHim]"
assassination_doubt_event_orgy_desc: "ยามเย็นที่ยืนยันชีวิตกับเหล่านางสนม ซึ่งข้ายินดีจัดหาให้"
assassination_doubt_event_meditation_desc: "ชั่วขณะแห่งการปลอบประโลมและการสนทนาภายในกับ [assassin.GetFaith.HighGodName]"
assassin_doubt_event_nothing_else: "ให้ข้ายืนยันศรัทธาของ [assassin.GetHerHis] ใน [assassin.GetFaith.PositiveAfterLife3|U] อีกครั้ง"
assassination_console.success: "ท่านปลอบโยน [assassin.GetFirstNameNoTooltip]"
assassination_console.failure: "ท่านล้มเหลวในการปลอบโยน [assassin.GetFirstNameNoTooltip]"
assassination_console_toast.success: "[assassin.GetFirstNameNoTooltip] ทำให้ความตั้งใจของ [assassin.GetHerHis] แข็งแกร่งขึ้น"
assassination_console_toast.failure: "[assassin.GetFirstNameNoTooltip] ยังคงสงสัยต่อไป"
assassination_ongoing.0003.c_hashish: "มาเถิด กินเค้กกัญชากับข้า"
assassination_ongoing.0003.c_alcohol: "มาเถิด ดื่มกับข้า"
assassination_ongoing.0003.c_food: "มาเถิด ให้เรากินอาหารด้วยกัน"
assassination_ongoing.0003.c_confide: "มาเถิด ระบายความในใจกับข้า"
assassination_ongoing.0003.c_orgy: "มาเถิด ข้าจะจัดเตรียมตัวอย่างของ [assassin.GetFaith.PositiveAfterLife3|U] ให้..."
assassination_ongoing.0003.c_meditation: "มาเถิด ให้เราทำสมาธิด้วยกัน"
assassination_ongoing.0004.b: "เจ้าต้องไม่ลังเล จงวางใจในปัญญาของ [assassin.GetFaith.HighGodName]"
assassination_ongoing.0004.c: "บางทีเราควรพิจารณาการลอบสังหารนี้ใหม่..."
high_risk_of_dying.tt: "@warning_icon! #X [assassin.GetNameNoTooltip] อาจมีแนวโน้มที่จะเสียชีวิตระหว่างการลอบสังหารมากขึ้น!#!"

assassination_ongoing.0005.t: "ยาพิษหรือโรคระบาด"
assassination_ongoing.0005.desc: ""[ROOT.Char.GetTitleTierName] ของข้า" [assassin.GetName] กล่าว "เราจำเป็นต้องใช้ทุกข้อได้เปรียบที่เรามีเพื่อกำจัด [target.GetTitledFirstName] มียาพิษร้ายแรงชนิดหนึ่ง ซึ่งนักพรตตะวันออกบริโภคในปริมาณน้อย ที่ข้าสามารถใช้เคลือบคมดาบของข้าได้ แต่มันจะมีราคาแพงในการจัดหา...""
assassination_ongoing.0005.a_you: "ไม่จำเป็น ข้าสามารถสร้างยาพิษให้เจ้าได้!"
assassination_ongoing.0005.a_them: "เจ้าเป็นหมอสมุนไพรที่มีทักษะ ทำอะไรบางอย่างด้วยตัวเองสิ"
assassination_ongoing.0005.b: "ไม่มีราคาใดที่ข้าจะไม่จ่ายเพื่ออุดมการณ์!"
assassination_ongoing.0005.c: "แค่แช่คมดาบในส้วมหลุมข้ามคืน ก็น่าจะใช้ได้แล้ว"
assassination_ongoing.0005.d: "ไม่ นี่เป็นการเสียเวลา และต่ำต้อยเกินไปสำหรับเรา"

assassination_ongoing.0006.t: "นักฆ่าผู้หลบหนี"
assassination_ongoing.0006.desc: "มีความพยายามลอบสังหาร [target.GetNamePossessive] แต่อนิจจา ทันทีที่นักฆ่าเอกของข้า [assassin.GetName] เห็นช่องทาง หนึ่งในผู้ร่วมงานของ [assassin.GetHerHis] ก็ถูกครอบงำด้วยความกลัวตายและวิ่งหนีไป\n\nแผนการจึงต้องถูกยกเลิก โชคดีที่ [target.GetTitledFirstNameNoTooltip] ดูเหมือนจะไม่รู้เรื่อง และ [assassin.GetFirstNameNoTooltip] ได้รับรองกับข้าว่าความพยายามครั้งใหม่สามารถทำได้ในไม่ช้า อย่างไรก็ตาม นักฆ่าผู้หลบหนีอาจยังคงเป็นภาระ หากเราไม่สามารถหา [dummy_assassin_gender.GetHerHim] พบ"
assassination_ongoing.0006.a: "เราจะหา [dummy_assassin_gender.GetHerHim] ให้พบ — และปิดปาก [dummy_assassin_gender.GetHerHim] ให้สิ้นซาก"
assassination_ongoing.0006.b: "เราจะต้องอยู่กับความเสี่ยงนั้น"
assassination_hunted_down_toast.success: "ท่านปิดปากผู้ทรยศแล้ว"
assassination_hunted_down_toast.failure: "ท่านล้มเหลวในการหาผู้ทรยศ"
assassination_hunted_down.success: "นักฆ่าผู้ทรยศถูกตามล่าและสังหาร"
assassination_hunted_down.failure: "ท่านล้มเหลวในการตามล่า [dummy_assassin_gender.GetHerHim]"

assassination_ongoing.0007.t: "[target.GetWomanMan|U] ผู้ทรงคุณธรรม?"
assassination_ongoing.0007.desc: "\"ข้าทำไม่ได้\" นักฆ่าของข้า [assassin.GetFirstName] ประกาศขึ้นทันที ดูวิตกกังวลผิดปกติ\n\n\"แม้ว่า [target.GetSheHe] จะเป็นพวกนอกรีต แต่ [target.GetTitledFirstName] ก็ยังคงเป็น [target.GetWomanMan] ผู้มีคุณธรรมอันยิ่งใหญ่และศรัทธาอันแรงกล้าใน [assassin.GetFaith.HighGodName] [target.GetSheHe|U] เป็นที่รู้กันว่าไม่ทุจริตและไม่ อยุติธรรม หากข้าสังหาร [target.GetHerHim] ข้าเกรงกลัวพระพิโรธของ [assassin.GetFaith.HighGodNamePossessive] และการลงทัณฑ์อันน่าสะพรึงกลัวใน [ROOT.Char.GetFaith.NegativeAfterLife]\""
assassination_ongoing.0007.a: "เจ้าเป็น #italic นักฆ่า#!! ข้าไม่ได้จ้างเจ้ามาเพื่อลังเล!"
assassination_ongoing.0007.b: "บางทีเจ้าอาจจะถูก... เราจะหยุดไว้ก่อนสำหรับตอนนี้"
