 seduce_outcome.3902.desc:0 ""[ROOT.Char.Custom('FormOfAddressForLiege')|U], I have bad news! [owner.Custom2('YourCharacterIntroduction', ROOT.Char)|U] was just seen leaving the chambers of [target.Custom2('YourCharacterIntroductionNoComma', ROOT.Char)]!""
