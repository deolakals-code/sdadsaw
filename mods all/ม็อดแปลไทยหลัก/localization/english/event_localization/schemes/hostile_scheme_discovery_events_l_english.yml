l_english: 
 hostile_scheme_discovery.1001.t:1 "แผนการร้ายที่ [ROOT.Char.Custom('GetCourt')|U]"
 hostile_scheme_discovery.1001.close_relation:0 "[spymaster.GetCouncilTitle] ของข้ามาแจ้งข่าวร้ายแก่ข้า [spymaster.GetSheHe|U] มั่นใจว่า [agent.GetTitledFirstName] ซึ่งเป็น [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('agent'))] ของข้าเอง กำลังวางแผนการร้ายต่อข้า!"
 hostile_scheme_discovery.1001.close_relation_no_spymaster:0 "ข่าวร้ายมาถึงข้า [agent.GetTitledFirstName] ซึ่งเป็น [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('agent'))] ของข้าเอง กำลังวางแผนการร้ายต่อข้า!"
 hostile_scheme_discovery.1001.close_relation_spymaster_other_target:0 "[spymaster.GetCouncilTitle] ของข้ามาแจ้งข่าวร้ายแก่ข้า [spymaster.GetSheHe|U] มั่นใจว่า [agent.GetTitledFirstName] ซึ่งเป็น [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('agent'))] ของข้าเอง กำลังวางแผนการร้ายต่อ [spymaster.GetHerHim]!"
 hostile_scheme_discovery.1001.close_relation_other_target:0 "[spymaster.GetCouncilTitle] ของข้ามาแจ้งข่าวร้ายแก่ข้า [spymaster.GetSheHe|U] มั่นใจว่า [agent.GetTitledFirstName] ซึ่งเป็น [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('agent'))] ของข้าเอง กำลังวางแผนการร้ายต่อ [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('targeted_courtier'))] ของข้า [targeted_courtier.GetTitledFirstName]!"
 hostile_scheme_discovery.1001.close_relation_no_spymaster_other_target:0 "ข่าวร้ายมาถึงข้า [agent.GetTitledFirstName] ซึ่งเป็น [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('agent'))] ของข้าเอง กำลังวางแผนการร้ายต่อ [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('targeted_courtier'))] ของข้า [targeted_courtier.GetTitledFirstName]!"
 hostile_scheme_discovery.1001.desc:0 "[spymaster.GetCouncilTitle] ของข้ามาพร้อมกับการค้นพบ [spymaster.GetSheHe|U] มั่นใจว่า [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('agent'))] ของข้า [agent.GetTitledFirstName] กำลังวางแผนการร้ายต่อข้า!"
 hostile_scheme_discovery.1001.desc_no_spymaster:0 "ข่าวร้ายมาถึงข้า มีการค้นพบว่า [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('agent'))] ของข้า [agent.GetTitledFirstName] กำลังวางแผนการร้ายต่อข้า!"
 hostile_scheme_discovery.1001.desc_other_target_spymaster:0 "[spymaster.GetCouncilTitle] ของข้ามาพร้อมกับการค้นพบ [spymaster.GetSheHe|U] มั่นใจว่า [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('agent'))] ของข้า [agent.GetTitledFirstName] กำลังวางแผนการร้ายต่อ [spymaster.GetHerHim]!"
 hostile_scheme_discovery.1001.desc_other_target:0 "[spymaster.GetCouncilTitle] ของข้ามาพร้อมกับการค้นพบ [spymaster.GetSheHe|U] มั่นใจว่า [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('agent'))] ของข้า [agent.GetTitledFirstName] กำลังวางแผนการร้ายต่อ [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('targeted_courtier'))] ของข้า [targeted_courtier.GetTitledFirstName]!"
 hostile_scheme_discovery.1001.desc_no_spymaster_other_target:0 "ข่าวร้ายมาถึงข้า มีการค้นพบว่า [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('agent'))] ของข้า [agent.GetTitledFirstName] กำลังวางแผนการร้ายต่อ [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('targeted_courtier'))] ของข้า [targeted_courtier.GetTitledFirstName]!"
 hostile_scheme_discovery.1001.a:0 "จงให้ทุกคนรู้ถึงคนทรยศ"
 hostile_scheme_discovery.1001.b:0 "โยน [agent.GetHerHim] เข้าคุก!"
 hostile_scheme_discovery.1001.b.tt_not_your_courtier_or_vassal: "[agent.GetTitledFirstName] ไม่ใช่ [courtier|E] หรือ [vassal|E] ของท่าน"
 hostile_scheme_discovery.1001.c:0 "ไม่ว่าจริงหรือไม่ ข้าจะไม่กล่าวหา [agent.GetFirstNameNoTooltip]"
 hostile_scheme_discovery.1001.c.tt:0 "[agent.GetFirstNameNoTooltip] เป็นอิสระ"

 hostile_scheme_discovery.1002.t:0 "ผู้บงการถูกเปิดโปง!"
 hostile_scheme_discovery.1002.intro:0 "[spymaster.GetCouncilTitle] ของข้ามาแจ้งข่าวร้ายแก่ข้า: คือ [owner.Custom2('MyCharacterIntroduction', ROOT.Char)]"
 hostile_scheme_discovery.1002.intro_no_spymaster:0 "ข่าวร้ายมาถึงข้า: คือ [owner.Custom2('MyCharacterIntroduction', ROOT.Char)]"
 hostile_scheme_discovery.1002.murder:0 "ที่กำลังวางแผนสังหาร"
 hostile_scheme_discovery.1002.abduction:0 "ที่กำลังวางแผนลักพาตัว"
 hostile_scheme_discovery.1002.elope:0 "ที่กำลังวางแผนหนีตามไปกับ"
 hostile_scheme_discovery.1002.steal_back_artifact:0 "ที่กำลังวางแผนขโมยสิ่งประดิษฐ์จาก"
 hostile_scheme_discovery.1002.fallback:0 "ที่กำลังวางแผนการร้ายต่อ"
 hostile_scheme_discovery.1002.a:0 "เจ้าปีศาจ [owner.Custom2('InsultAdjective', ROOT.Char)]!"

 hostile_scheme_discovery.2001.intro:0 "[spymaster.GetCouncilTitle] ของข้ามาแจ้งข่าวร้ายแก่ข้า แม้เรายังไม่รู้ว่าเป็นใคร"
 hostile_scheme_discovery.2001.intro_no_spymaster:0 "ข่าวร้ายมาถึงข้า แม้ยังไม่ทราบว่าเป็นใคร"
 hostile_scheme_discovery.2001.murder:0 "มีคนกำลังวางแผนสังหาร"
 hostile_scheme_discovery.2001.abduction:0 "มีคนกำลังวางแผนลักพาตัว"
 hostile_scheme_discovery.2001.fallback:0 "มีคนกำลังวางแผนการร้ายต่อ"
 hostile_scheme_discovery.2001.elope:0 "มีคนกำลังวางแผนหนีตามไปกับ"
 hostile_scheme_discovery.2001.steal_back_artifact:1 "มีคนกำลังพยายามขโมยจาก"
 hostile_scheme_discovery.2001.depose: "มีคนกำลังวางแผนโค่นล้ม"
 hostile_scheme_discovery.2001.target_other:0 "[ROOT.Char.Custom2('RelationToMe', SCOPE.sC('target'))] ของข้า [target.GetTitledFirstName]!"
 hostile_scheme_discovery.2001.target_spymaster:0 "[target.GetHerHim]!\n\n"พวกมันไม่รู้ว่ากำลังต่อกรอยู่กับใคร [ROOT.Char.Custom('FormOfAddressForLiege')] พวกมันคิดว่าสามารถฆ่า #EMP ข้า#! ได้หรือ? ข้าจะแสดงให้พวกมันเห็น โอ้ แน่นอน ข้าจะแสดงให้เห็น""
 hostile_scheme_discovery.2001.target_me:0 "ข้า!"
 hostile_scheme_discovery.2001.a:0 "เราต้องหยุดคนชั่วที่อยู่เบื้องหลังเรื่องนี้!"

 hostile_scheme_discovery.3001.t:0 "สายลับถูกเปิดโปง!"
 hostile_scheme_discovery.3001.intro:0 "[agent.GetTitledFirstName] สายลับของข้าใน [scheme.GetName|l] ของ [court_owner.GetTitledFirstNamePossessive] ถูกเปิดโปงแล้ว!"
 hostile_scheme_discovery.3001.imprisoned:0 "\n\nบัดนี้ [court_owner.GetTitleAsName] ได้คุมขัง [agent.GetHerHim] ไว้แล้ว"
 hostile_scheme_discovery.3001.accused:0 "\n\nบัดนี้ [agent.GetSheHe] เป็นที่รู้กันว่าไม่น่าไว้วางใจ และไม่สามารถช่วยงานของข้าได้อีกต่อไป"
 hostile_scheme_discovery.3001.a:0 "สาปแช่ง [court_owner.GetTitledFirstNameNoTooltip] และ [spymaster.GetCouncilTitle] [court_owner.GetHerHis]!"

 hostile_scheme_discovery.3002.t:0 "แผนการถูกเปิดโปง"
 hostile_scheme_discovery.3002.desc:0 "การมีอยู่ของแผนการ [scheme.GetFullActionName] ของข้าถูกเปิดโปงแล้ว!\n\nแม้การมีส่วนร่วมของข้ายังไม่เป็นที่ทราบ แต่สิ่งนี้จะ ทำให้การนำแผนการของข้าไปสู่ความสำเร็จยากขึ้นมาก"
 hostile_scheme_discovery.3002.a:0 "ให้ตายสิ!"

 hostile_scheme_discovery.3003.t:0 "การมีส่วนร่วมถูกเปิดโปง"
 hostile_scheme_discovery.3003.desc:0 "[target.Custom2('MyCharacterIntroduction', ROOT.Char)|U] ได้ค้นพบว่าข้าคือผู้บงการเบื้องหลังแผนการ"
 hostile_scheme_discovery.3003.murder:0 "สังหาร [target.GetHerHim]!"
 hostile_scheme_discovery.3003.abduction:0 "ลักพาตัว [target.GetHerHim]!"
 hostile_scheme_discovery.3003.elope:0 "หนีตามไปกับ [target.GetHerHim]!"
 hostile_scheme_discovery.3003.steal_back_artifact:0 "ขโมยสิ่งประดิษฐ์จาก [target.GetHerHim]!"
 hostile_scheme_discovery.3003.fallback:0 "ต่อต้าน [target.GetHerHim]!"
 hostile_scheme_discovery.3003.a:0 "ต้องมีการเข้าใจผิดกันแน่!"

 hostile_scheme_discovery.4001.t:0 "แผนการถูกเปิดโปง!"
 hostile_scheme_discovery.4001.opening:0 "แผนการของข้าต่อ [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('target'))] ของข้า [target.GetTitledFirstName] ถูกเปิดโปงแล้ว!"
 hostile_scheme_discovery.4001.end:0 "\n\nแม้ แต่ [ROOT.Char.Custom('GetCourtierPlural')|l] ของข้าเองก็นินทาลับหลัง ความไว้วางใจหรือความรักใดๆ ที่พวกเขาอาจเคยมีต่อข้าได้แตกสลายไปจากการเปิดเผยครั้งนี้"
 hostile_scheme_discovery.4002.opening:0 "แผนการของข้าที่จะเห็น [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('target'))] ของข้าตายถูกเปิดโปงแล้ว! บัดนี้ทุกคนรู้ถึงแผนการสังหาร [target.GetTitledFirstName] ของข้า"
 hostile_scheme_discovery.4001.a:0 "ทั้งหมดนี้เป็นการเข้าใจผิดครั้งใหญ่!"
 hostile_scheme_discovery.4001.b:0 "โอ้ ข้าจะแสดงให้พวกมันเห็นว่าข้าไปได้ไกลแค่ไหน"
 
