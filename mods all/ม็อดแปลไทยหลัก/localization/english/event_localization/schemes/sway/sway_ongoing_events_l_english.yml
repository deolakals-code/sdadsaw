 sway_ongoing.5013.desc_expansion_success:0 "ทั้งหมดที่ต้องการคือความใส่ใจอย่างทุ่มเท – ในไม่ช้าข้าก็ ทำให้ห้องอาหารของ [target.GetTitledFirstNamePossessiveNoTooltip] ใกล้จะเสร็จสมบูรณ์แล้ว"
 sway_ongoing.5013.desc_expansion_failure:0 "แม้จะพยายามอย่างเต็มที่ ห้องอาหารของ [target.GetTitledFirstNamePossessiveNoTooltip] ดูเหมือนจะอยู่ในสภาพที่แย่ลงเมื่อข้าทำเสร็จกว่าตอนที่ข้าเริ่ม..."
 sway_ongoing.5013.desc_library_success:0 "หนังสือเข้าเล่ม เอกสารกระจัดกระจาย สันหนังสือตก แต่ง... หลังจากการจัดเรียงใหม่มากมาย ในที่สุดก็มีความเป็นระเบียบเรียบร้อยในความโกลาหลที่เป็นห้องสมุดของ [target.GetTitledFirstNamePossessiveNoTooltip]"
 sway_ongoing.5013.desc_library_failure:0 "หนังสือเข้าเล่ม เอกสารกระจัดกระจาย สันหนังสือตก แต่ง... ไม่ว่าข้าจะพยายามหนักแค่ไหน ข้าก็ไม่สามารถหาเหตุผลในความยุ่งเหยิงที่เป็นห้องสมุดของ [target.GetTitledFirstNamePossessiveNoTooltip] ได้ "
 sway_ongoing.5013.desc_gold_success:0 "ขณะที่ข้าอธิบายความเสี่ยงของการเก็บหีบทองคำไว้ในที่โล่งแจ้ง ดวงตาของ [target.GetTitledFirstNamePossessiveNoTooltip] ก็เบิกกว้างด้วยความเข้าใจ\n\n"โอ้ แน่นอน มันไม่ควรจะอยู่ข้างนอกนั่น! ขอบคุณท่าน [ROOT.Char.GetTitledFirstNameNoTooltip]""
 sway_ongoing.5013.desc_gold_failure:0 "ขณะที่ข้าพยายามอธิบายความเสี่ยงของการเก็บหีบทองคำไว้ในที่โล่งแจ้ง ข้าเห็นดวงตาของ [target.GetTitledFirstNamePossessive] หรี่ลง\n\n"และทำไม #EMP ท่าน#! ถึงได้จ้องมองทองคำของข้า?""
 sway_ongoing.5013.desc_steal_success:0 ""ทองของข้า! ทองของข้าหายไปไหน?!"\n\nข้าพบ [target.GetTitledFirstName] ที่กำลังทุกข์ใจยืนอยู่ในโถงทางเดิน หีบเปล่าอยู่ตรงหน้า [target.GetHerHim] "โอ้ ท่าน [ROOT.Char.GetTitledFirstNameNoTooltip] หากเพียง แต่ข้าเชื่อฟังท่าน!""
 sway_ongoing.5013.desc_end_good:0 "\n\nข้าได้ทำทุกอย่างในอำนาจเพื่อช่วย [target.GetHerHim] แล้ว"
 sway_ongoing.5013.desc_end_bad:0 "\n\nมันเป็นหนทางที่ขรุขระ แต่ข้าได้ทำทุกอย่างที่ทำได้เพื่อช่วย [target.GetHerHim] แล้ว"
 sway_ongoing.5013.desc_good:0 "\n\nสิ่งต่างๆ กำลังดูดี และยังมีด้านอื่นๆ ที่ข้ายังสามารถช่วย [target.GetHerHim] ได้อีก"
 sway_ongoing.5013.desc_bad:0 "\n\nสิ่งต่างๆ อาจจะไม่ค่อยดีนัก แต่ยังมีด้านอื่นๆ ที่ข้ายังสามารถช่วยได้!"
 sway_ongoing.5013.c:0 "ข้ารู้วิธี ทำให้ [target.GetHerHim] รับฟัง...!"
 sway_ongoing.5013.c.tt_intrigue:0 "จะเป็นอย่างไรหากมีบางอย่างเกิดขึ้นกับทองคำ [target.GetHerHis]..."
 sway_ongoing.5013.d:0 "#EMP ตอนนี้#! ถึงเวลาเข้านอนแล้ว"

 sway_ongoing.5014.desc_opening:0 "ข้าเห็น [target.GetTitledFirstName] อยู่ที่ทางเข้า รอส่งข้าในตอนเช้า ขณะที่ข้าเดินเข้าไป ข้าได้ยิน [target.GetHerHim] พึมพำกับ [target.GetHerselfHimself]\n\n"
 sway_ongoing.5014.desc_great:0 ""[ROOT.Char.GetSheHe|U] ยอดเยี่ยมมาก [target.Custom('ResidenceBuilding')] เหมือนใหม่เลย...""
