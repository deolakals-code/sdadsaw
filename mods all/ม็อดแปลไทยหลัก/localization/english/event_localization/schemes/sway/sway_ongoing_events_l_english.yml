l_english: 
 sway_ongoing.1001.t:0 "การโน้มน้าว: วัฒนธรรม [target.GetCulture.GetNameNoTooltip]"
 sway_ongoing.1001.desc:2 "สามัญชนผู้มีเชื้อสาย [target.GetCulture.GetNameNoTooltip] ถูกคุกคามบนท้องถนนใน [capital.GetNameNoTooltip] ด้วยความผิดเล็กน้อยบางประการ\n\nการกล่าวปกป้องพวกเขาอาจ ทำให้ [target.Custom2('MyCharacterIntroductionNoComma', ROOT.Char)] ซึ่งเป็นชาว [target.GetCulture.GetNameNoTooltip] เช่นกัน เชื่อมั่นในคุณงามความดีของข้าได้ แต่ข้าก็อาจเสี่ยงที่จะ ทำให้สหายร่วมตำแหน่งชาว [ROOT.Char.GetCulture.GetNameNoTooltip] ของข้าเหินห่าง..."
 sway_ongoing.1001.a:1 "ชาว [target.GetCulture.GetCollectiveNounNoTooltip] เป็นคนดี"
 sway_ongoing.1001.b:1 "ชาว [ROOT.Char.GetCulture.GetCollectiveNounNoTooltip] มีคุณธรรมสูงส่งกว่า!"

 sway_ongoing.1002.t:0 "การโน้มน้าว: คำชมเชย"
 sway_ongoing.1002.desc:0 "เพื่อให้ [target.Custom2('MyCharacterIntroductionNoComma', ROOT.Char)] คล้อยตามความพยายามเข้าหา [target.GetHerHim] ของข้าได้ง่ายขึ้น ข้าสามารถใส่คำชมเชยลงในสาส์นฉบับต่อไปที่จะส่งไปยังราชสำนัก [target.GetHerHis] ได้\n\nข้าจะกล่าวถึง [target.GetHerHis] อย่างแน่นอน..."
 sway_ongoing.1002.success.tt:0 "ขึ้นอยู่กับดุลยพินิจของ [friend.GetTitledFirstNameNoTooltip]:"
 sway_ongoing.1002.b:0 "ข้าจะเขียนให้สั้นและเป็นทางการ"

 sway_ongoing.1003.opening:0 "[target.Custom2('AppropriateGreeting', ROOT.Char)]"
 sway_ongoing.1003.desc:0 "การติดต่อทางสาส์นครั้งล่าสุดของเราเป็นแหล่งความสุขสำหรับข้า ข้าอดคิดไม่ได้ว่าเราทั้งคู่อาจได้รับประโยชน์จากการสื่อสารที่เพิ่มขึ้น"
 sway_ongoing.1003.a:0 "ยอดเยี่ยม!"

 sway_ongoing.1004.desc:0 "การติดต่อทางสาส์นครั้งล่าสุดของเรายังไม่เป็นที่น่าพอใจนัก โปรดงดเว้นการแสดงความคิดเห็นส่วนตัวในอนาคต"
 sway_ongoing.1004.a:0 "โอ้ ไม่นะ..."

 sway_ongoing.1005.t:0 "การโน้มน้าว: [target.GetTitleAsNameNoTooltip] ผู้ประเสริฐ"
 sway_ongoing.1005.desc:0 "ขณะที่ต้อนรับเหล่าขุนนางและสุภาพสตรีจากดินแดนใกล้ไกล ก็มีโอกาสบางประการที่จะวาดภาพ [target.Custom2('MyCharacterIntroductionNoComma', ROOT.Char)] ในแง่งามปรากฏขึ้น\n\n"[ROOT.Char.Custom('FormOfAddressForLiege')|U] โปรดบอกเถิดว่า ผู้ที่ [target.Custom('FormalComplimentAdjective')] ที่สุดเท่าที่ท่านเคยได้ยินมาคือผู้ใด?""
 sway_ongoing.1005.a:0 "[target.GetTitledFirstNameNoTooltip] อย่างไม่ต้องสงสัย!"
 sway_ongoing.1005.b:0 "ก็ข้าเองน่ะสิ แน่นอน!"

 sway_ongoing.1006.t:0 "การโน้มน้าว: ผู้แทรกซึม"
 sway_ongoing.1006.desc:0 "ข้าได้รับทราบมาว่าสามัญชนท้องถิ่นบางส่วนกำลังย้ายไปยัง [capital.GetNameNoTooltip] เมืองหลวงของ [target.Custom2('MyCharacterIntroductionNoComma', ROOT.Char)]\n\nคนท้องถิ่น ไม่ว่าจะเพิ่งตั้งรกรากใหม่หรือไม่ การที่พวกเขาสรรเสริญข้าย่อมไม่ส่งผลเสียต่อการรับรู้ [target.GetHerHis] ที่มีต่อข้าอย่างแน่นอน..."
 sway_ongoing.1006.a:0 ""รับทองนี้ไป และจง ทำให้แน่ใจว่ามีคนได้ยินเจ้า""
 sway_ongoing.1006.b:0 "มันไม่คุ้มค่า"

 sway_ongoing.5001.t:0 "การโน้มน้าว: เรื่องส่วนตัว"
 sway_ongoing.5001.desc:0 "ในการสื่อสารครั้งล่าสุดของเรา [target.Custom2('MyCharacterIntroductionNoComma', ROOT.Char)] แสดงความต้องการที่จะมุ่งเน้นไปที่ความทะเยอทะยานและความสนใจ [target.GetHerHis] มากขึ้น\n\nข้า #EMP อาจจะ#! ทำให้แน่ใจว่าจดหมายฉบับต่อไปของเราจะมีเนื้อหาเกี่ยวกับหัวข้อที่ใกล้ชิดกับใจ [target.GetHerHis] มากขึ้น..."
 sway_ongoing.5001.diplomacy_lifestyle:0 "ข้าคิดว่า [target.GetSheHe] ชอบที่จะมุ่งเน้นเรื่องการทูต"
 sway_ongoing.5001.martial_lifestyle:0 "ข้าได้ยินมาว่า [target.GetSheHe] ชื่นชมความสำเร็จทางการทหาร"
 sway_ongoing.5001.stewardship_lifestyle:0 "การปกครองอาณาจักรย่อมเป็นที่สนใจ [target.GetHerHim] อย่างแน่นอน"
 sway_ongoing.5001.intrigue_lifestyle:0 "[target.GetSheHe|U] ย่อมเพลิดเพลินกับเล่ห์อุบายและการชิงไหวชิงพริบอย่างแน่นอน"
 sway_ongoing.5001.learning_lifestyle:0 "ข้าเชื่อว่าไม่มีสิ่งใดดึงดูดใจ [target.GetHerHim] ได้เท่ากับหนังสือดีๆ สักเล่ม!"
 sway_ongoing.5001.a.tt:0 "ข้าจะแทรกหัวข้อนี้เข้าไปในจดหมายฉบับต่อไปอย่างแนบเนียน"
 sway_ongoing.5001.b:0 "ไม่ใช่หน้าที่ของข้า"

 sway_ongoing.5002.t:0 "เรื่องส่วนตัว"
 sway_ongoing.5002.desc_opening:0 "ในการติดต่อทางสาส์นครั้งล่าสุดของเรา [owner.Custom2('MyCharacterIntroductionNoComma', target)] ได้กล่าวถึงผ่านๆ เกี่ยวกับ"
 sway_ongoing.5002.desc_diplomacy:0 "บทสนทนาล่าสุดที่ [owner.GetSheHe] มี"
 sway_ongoing.5002.desc_martial:0 "สถานะกองทหาร [owner.GetHerHis]"
 sway_ongoing.5002.desc_stewardship:0 "การบริหารอาณาจักร [owner.GetHerHis]"
 sway_ongoing.5002.desc_intrigue:0 "ความละเอียดอ่อนของการชิงไหวชิงพริบในราชสำนัก"
 sway_ongoing.5002.desc_learning:0 "หนังสือที่ [owner.GetSheHe] เพิ่งอ่าน"
 sway_ongoing.5002.desc_fallback:0 "หัวข้อที่ไม่เกี่ยวข้องกับการสนทนาของเรา"
 sway_ongoing.5002.desc_success:0 "– ข้าไม่รู้เลยว่า [owner.GetSheHe] สนใจในหัวข้อนี้ด้วย!"
 sway_ongoing.5002.desc_failure:0 "– ราวกับว่าหัวข้อนั้นจะ ทำให้ข้าสนใจ!"
 sway_ongoing.5002.desc_ending:0 "\n\nจดหมายเหล่านี้ควรจะมีลักษณะทางการทูตอย่างเคร่งครัด แต่แน่นอนว่าบางครั้งก็หลุดเข้าไปในหัวข้อส่วนตัวมากขึ้น..."
 sway_ongoing.5002.a:0 "มาคุยเรื่องนี้กันต่อเถอะ!"
 sway_ongoing.5002.b:0 "โอ้ #EMP ได้โปรด#! เล่าให้ข้าฟังอีก!"
 sway_ongoing.5002.b.tt:0 "ข้าเดาว่าข้าจะตามใจ [owner.GetHerHim]..."
 sway_ongoing.5002.c:0 "ข้าจะขอบคุณมากหากเราจะคุยกันเฉพาะหัวข้อที่เกี่ยวข้อง"

 sway_ongoing.5003.desc_opening:0 "ในคำตอบ [target.GetHerHis] [target.Custom2('MyCharacterIntroductionNoComma', ROOT.Char)] สนับสนุนการที่ข้าออกนอกเรื่องไปสู่หัวข้อส่วนตัวมากขึ้นเล็กน้อย!"
 sway_ongoing.5003.desc_nonsense:0 "\n\nตอนนี้ข้าแค่ต้องแสร้งทำเป็นว่าข้ารู้อะไรเกี่ยวกับ [owner.Custom('LifestyleFocusTopic')] ต่อไป..."
 sway_ongoing.5003.desc:0 "\n\nช่างน่ายินดีอะไร เช่นนี้ ที่ [target.GetSheHe] ก็สนใจใน [owner.Custom('LifestyleFocusTopic')] ด้วย"
 sway_ongoing.5003.a:0 "มาคุยกันต่อเถอะ!"
 sway_ongoing.5003.b_diplomacy:0 ""แล้ว.. เรื่องข้าหลวงล่ะ หืม?""
 sway_ongoing.5003.b_martial:0 ""แล้ว... เรื่องดาบล่ะ หืม?""
 sway_ongoing.5003.b_stewardship:0 ""แล้ว... เรื่องทองล่ะ หืม?""
 sway_ongoing.5003.b_intrigue:0 ""แล้ว... เรื่องแผนการล่ะ หืม?""
 sway_ongoing.5003.b_learning:0 ""แล้ว... เรื่องจดหมายล่ะ หืม?""
 sway_ongoing.5003.b.tt:0 "ข้าหวังว่า [target.GetSheHe] จะเชื่อ!"
 sway_ongoing.5003.c:0 "ข้าทำ เช่นนี้ไม่ได้!"

 sway_ongoing.5004.desc:0 "ในคำตอบ [target.GetHerHis] [target.Custom2('MyCharacterIntroductionNoComma', ROOT.Char)] ขอให้ข้ายุติการสอบถามเรื่องส่วนตัวและกลับเข้าสู่หัวข้อที่กำลังสนทนา\n\n"ข้าไม่ชื่นชมความพยายามเบี่ยงเบนความสนใจเหล่านี้" [target.GetSheHe] กล่าว"
 sway_ongoing.5004.desc_nonsense:0 "\n\nบางทีมันอาจจะดีแล้วก็ได้... ข้าไม่รู้อะไรเกี่ยวกับ [owner.Custom('LifestyleFocusTopic')] มากนักอยู่แล้ว"
 sway_ongoing.5004.a:0 "มันก็คุ้มที่จะลอง!"

 sway_ongoing.5005.desc:0 "ในคำตอบล่าสุด [owner.GetHerHis] [owner.Custom2('MyCharacterIntroductionNoComma', ROOT.Char)] สารภาพว่า [owner.GetSheHe] จริงๆ แล้วไม่รู้อะไรเลยเกี่ยวกับหัวข้อ [owner.Custom('LifestyleFocusTopic')] และเพียงแค่แสร้งทำเพื่อประโยชน์ในการสนทนาของเรา!"
 sway_ongoing.5005.a:0 "ช่างเป็นคนโกหก! แต่ข้าจะไม่บอกหรอก ไม่ต้องกังวล"

 sway_ongoing.5006.desc:0 "ในคำตอบล่าสุด [target.GetHerHis] [target.Custom2('MyCharacterIntroductionNoComma', ROOT.Char)] สารภาพว่า [target.GetSheHe] จริงๆ แล้วไม่รู้อะไรเลยเกี่ยวกับหัวข้อ [target.Custom('LifestyleFocusTopic')] และเพียงแค่แสร้งทำเพื่อประโยชน์ในการสนทนาของเรา!"

 sway_ongoing.5007.desc:0 "จดหมายฉบับล่าสุดจาก [owner.Custom2('MyCharacterIntroductionNoComma', ROOT.Char)] มีเนื้อหาทั้งย่อหน้าเกี่ยวกับ [owner.Custom('LifestyleFocusTopic')]! ข้าไม่รู้เลยว่า [owner.GetSheHe] สนใจในเรื่อง เช่นนี้มากขนาดนี้...\n\nมันอาจจะเริ่มต้นจากการที่ข้าแค่ตามใจ [owner.GetHerHim] แต่ข้าอาจจะถลำลึกเกินไปที่จะถอยกลับแล้ว..."
 sway_ongoing.5007.b.tt:0 "ข้าหวังว่า [owner.GetSheHe] จะเชื่อ!"

 sway_ongoing.5009.desc_success:0 "หลังจากการสนทนาอันยาวนานกับ [target.Custom2('MyCharacterIntroductionNoComma', ROOT.Char)] เกี่ยวกับ [owner.Custom('LifestyleFocusTopic')] และการค้นคว้าที่ข้าต้องทำเพื่อเสแสร้งความเชี่ยวชาญ ข้าตระหนักว่าหัวข้อนี้ไม่ได้แปลกใหม่สำหรับข้าเหมือนเมื่อก่อนอีกต่อไป!"
 sway_ongoing.5009.desc_owner_discovered:0 "ในการติดต่อทางสาส์นครั้งล่าสุด [target.Custom2('MyCharacterIntroductionNoComma', ROOT.Char)] ได้แสดงความสงสัยอย่างชัดเจนเกี่ยวกับระดับความรู้ที่แท้จริงของข้าเกี่ยวกับ [owner.Custom('LifestyleFocusTopic')]\n\nขณะที่ข้าอ่านจดหมายฉบับล่าสุด ข้าตระหนักว่าอุบายของข้าถูกเปิดโปงแล้ว — [target.GetSheHe] พูดไม่หยุดเกี่ยวกับ "ความเข้าใจที่ขาดหายไปอย่างชัดเจน" และ "การแสดงความโง่เขลาอันน่าละอาย""
 sway_ongoing.5009.desc_target_discovered:0 "ในการติดต่อทางสาส์นครั้งล่าสุด [target.Custom2('MyCharacterIntroductionNoComma', ROOT.Char)] ได้แสดงความไม่เข้าใจอันน่าละอายเกี่ยวกับ [owner.Custom('LifestyleFocusTopic')]\n\nและถ้าแม้ แต่ข้ายังรู้ว่า [target.GetSheHe] กำลังพูดเรื่องไร้สาระ งั้นมันก็ #EMP แย่มาก!#!"
 sway_ongoing.5009.a:0 "ข้าได้เรียนรู้มากจริงๆ!"
 sway_ongoing.5009.b:0 "โอ๊ย"
 sway_ongoing.5009.c:0 "ไม่ต้องกังวล ข้าจะไม่บอกใคร"

 sway_ongoing.5010.desc_success:0 "หลังจากการสนทนาอันยาวนานกับ [owner.Custom2('MyCharacterIntroductionNoComma', ROOT.Char)] เกี่ยวกับ [owner.Custom('LifestyleFocusTopic')] และการค้นคว้าที่ข้าต้องทำเพื่อเสแสร้งความเชี่ยวชาญ ข้าตระหนักว่าหัวข้อนี้ไม่ได้แปลกใหม่สำหรับข้าเหมือนเมื่อก่อนอีกต่อไป!"
 sway_ongoing.5010.desc_target_discovered:0 "ในการติดต่อทางสาส์นครั้งล่าสุด [owner.Custom2('MyCharacterIntroductionNoComma', ROOT.Char)] ได้แสดงความสงสัยอย่างชัดเจนเกี่ยวกับระดับความรู้ที่แท้จริงของข้าเกี่ยวกับ [owner.Custom('LifestyleFocusTopic')]\n\nขณะที่ข้าอ่านจดหมายฉบับล่าสุด ข้าตระหนักว่าอุบายของข้าถูกเปิดโปงแล้ว — [owner.GetSheHe] พูดไม่หยุดเกี่ยวกับ "ความเข้าใจที่ขาดหายไปอย่างชัดเจน" และ "การแสดงความโง่เขลาอันน่าละอาย""
 sway_ongoing.5010.desc_owner_discovered:0 "ในการติดต่อทางสาส์นครั้งล่าสุด [owner.Custom2('MyCharacterIntroductionNoComma', ROOT.Char)] ได้แสดงความไม่เข้าใจอันน่าละอายเกี่ยวกับ [owner.Custom('LifestyleFocusTopic')]\n\nและถ้าแม้ แต่ข้ายังรู้ว่า [owner.GetSheHe] กำลังพูดเรื่องไร้สาระ งั้นมันก็ #EMP แย่มาก!#!"

 sway_ongoing.5011.t:0 "การโน้มน้าว: การเยี่ยมเยียน"
 sway_ongoing.5011.desc_opening:0 "ข้ากำลังเดินทางผ่าน [capital.GetNameNoTooltip] เมืองหลวงของ [target.Custom2('MyCharacterIntroductionNoComma', ROOT.Char)] เมื่อข้าได้รับคำเชิญให้ไปเยี่ยม [target.Custom('ResidenceBuilding')] [target.GetHerHis]\n\nเมื่อข้ามาถึง"
 sway_ongoing.5011.desc_friendly:0 "[target.GetSheHe] ต้อนรับข้าด้วยอ้อมแขนที่เปิดกว้าง"
 sway_ongoing.5011.desc_dislike:0 "[target.GetSheHe] ต้อนรับข้าด้วยใบหน้าที่บึ้งตึง"
 sway_ongoing.5011.desc_normal:0 "[target.GetSheHe] ต้อนรับข้าด้วยความเคารพ"
 sway_ongoing.5011.desc:0 "และพาชม สิ่งหนึ่งที่ ทำให้ข้าประทับใจคือสถานที่แห่งนี้เต็มไปด้วยโครงการที่ยังไม่เสร็จสิ้น..."
 sway_ongoing.5011.a:0 "ข้าจะพักอยู่ที่นี่สักพัก"
 sway_ongoing.5011.a.tt:0 "บางทีข้าอาจจะช่วย [target.GetHerHim] ได้"
 sway_ongoing.5011.b:0 "แค่พาข้าไปที่ห้องพัก"
 sway_ongoing.5011.b.tt:0 "ข้าจะออกเดินทาง แต่เช้าตรู่"

 sway_ongoing.5013.desc_opening:0 "ห้องสมุดที่หนังสือถูกกองไว้ตามมุม โครงการก่อสร้างที่ยังไม่เสร็จสิ้นทั่วทั้งสถานที่ – ที่เห็นได้ชัดที่สุดคือห้องอาหารทั้งห้อง – และหีบทองคำที่ตั้งอยู่กลางโถงทางเดิน...\n\n[target.Custom('ResidenceBuilding')] ของ [target.GetTitledFirstNamePossessive] รกมาก!"
 sway_ongoing.5012.a_trait:0 "ข้าจะซ่อมห้องอาหารให้เรียบร้อยทันที"
 sway_ongoing.5012.a:0 "ข้าคิดว่าข้าสามารถช่วยเรื่องห้องอาหารได้"
 sway_ongoing.5012.a.tt:0 "[target.GetTitledFirstNameNoTooltip] จะตอบสนองต่อการกระทำที่ท่านทำ"
 sway_ongoing.5012.a_success:0 "ข้าทำสำเร็จ"
 sway_ongoing.5012.a_failure:0 "ข้ามี แต่ ทำให้มันแย่ลง"
 sway_ongoing.5012.b_trait:0 "ข้าจะแค่จัดหนังสือพวกนี้ให้เรียบร้อย..."
