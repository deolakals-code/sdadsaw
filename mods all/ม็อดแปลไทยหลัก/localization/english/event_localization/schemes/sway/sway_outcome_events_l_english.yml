l_english: 
 sway_outcome.1001.t:0 "ชักจูงโน้มน้าว: โอกาส"
 sway_outcome.1001.desc:0 "ในความพยายามของข้าที่จะชักจูง [target.GetTitledFirstName] ให้คล้อยตามผลประโยชน์ของข้า ข้าได้พบโอกาส ข้าคิดว่าข้าสามารถโต้แย้งได้ว่าเป้าหมายของเรานั้น แท้จริงแล้วเป็นสิ่งเดียวกัน ขณะที่ข้าเขียนจดหมายฉบับต่อไป..."
 sway_outcome.1001.a:0 "...ข้าเน้นย้ำถึงผลประโยชน์ร่วมเหล่านั้น"
 sway_outcome.1001.a.success:0 "[target.GetFirstNameNoTooltip] เชื่อแล้ว"
 sway_outcome.1001.a.failure:0 "[target.GetFirstNameNoTooltip] มองทะลุความพยายามของข้า"
 sway_outcome.1001.b:0 "...ข้าพยายามรักษาความแนบเนียน"

 sway_outcome.1002.t:0 "ชักจูงโน้มน้าว: ความเชื่อทางศาสนา"
 sway_outcome.1002.same_faith:0 "ข้าได้ความคิดหนึ่งในความพยายามที่จะชักจูง [target.GetTitledFirstName] ให้คล้อยตามผลประโยชน์ของข้า\n\nด้วยข้อโต้แย้งที่เหมาะสม ข้าอาจสามารถโน้มน้าว[target.GetHerHim]ได้ว่าข้าไม่ได้กระทำการเพียงเพื่อผลประโยชน์ของตนเอง แต่เพื่อผลประโยชน์ของ [ROOT.Char.GetFaith.HighGodNameAlternate] [ROOT.Char.GetFaith.HighGodHerselfHimself]!"
 sway_outcome.1002.other_faith:0 "ข้าได้ความคิดหนึ่งในความพยายามที่จะชักจูง [target.GetTitledFirstName] ให้คล้อยตามผลประโยชน์ของข้า\n\nบางทีข้าอาจโต้แย้งได้ว่าเป็นการสมควรเพื่อผลประโยชน์ของชาว [target.GetFaith.GetAdherentNamePlural] ทั้งปวงที่จะสนับสนุนข้า แทนที่จะเป็นผู้ปกครองชาว [ROOT.Char.GetFaith.GetAdjective] อื่นใด?"
 sway_outcome.1002.a:0 "ข้าเชื่อว่าข้าสามารถสร้างข้อโต้แย้งที่น่าเชื่อถืออย่างยิ่งได้"
 sway_outcome.1002.b:0 "บางทีข้าควรรักษามารยาททางการทูตไว้"

 sway_outcome.1003.t:0 "ชักจูงโน้มน้าว: เสี่ยงโชค"
 sway_outcome.1003.desc:0 "ข้าอ่านจดหมายฉบับล่าสุดจาก [target.Custom2('MyCharacterIntroductionNoComma', ROOT.Char)] จบและยิ้ม – ดูเหมือนว่า[target.GetSheHe]จะเริ่มชอบข้าในที่สุด\n\nแม้ว่านี่จะเป็นความสำเร็จ ข้าก็อดไม่ได้ที่จะใช้โอกาสนี้พยายามเข้าใกล้ให้มากขึ้นอีก..."
 sway_outcome.1003.a:0 "ถึงเวลาทดสอบทักษะทางการทูตของข้าแล้ว!"
 sway_outcome.1003.a.success:0 "[target.GetSheHe|U] ชื่นชมความพยายาม"
 sway_outcome.1003.a.failure:0 "[target.GetSheHe|U] รู้สึกถูกดูหมิ่น"
 sway_outcome.1003.a_friend:0 "ข้าจะให้ [friend.GetFirstNameNoTooltip] จัดการเรื่องนี้"
 sway_outcome.1003.b:0 "ชัยชนะนี้ก็เพียงพอแล้ว"

 sway_outcome.2001.t:0 "ชักจูงโน้มน้าว: ความเข้าใจผิด"
 sway_outcome.2001.opening:0 "ดูเหมือนว่าการทาบทามทางการทูตของข้าต่อ [target.GetTitledFirstName] ได้ก่อให้เกิดความเข้าใจผิดครั้งใหญ่! ข้าได้รับจดหมายที่ ทำให้ชัดเจนว่า[target.GetSheHe]คิดว่าข้ากำลังไล่ตามเป้าหมายที่แตกต่างไปโดยสิ้นเชิง..."
 sway_outcome.2001.not_interested_relation:0 "\n\n"ข้าคือ[ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('target'))]ของท่านนะ เห็นแก่[target.GetFaith.HighGodNamePossessive]เถิด!""
 sway_outcome.2001.not_interested_romantically:0 "\n\n"แม้ข้าจะรู้สึกเป็นเกียรติ แต่ข้าพบว่าความสนใจของท่านไม่เหมาะสมสำหรับ[ROOT.Char.GetWomanMan]ในสถานะของท่าน""
 sway_outcome.2001.not_interested_horses:0 "\n\n"ข้าจะไม่ขายม้าพันธุ์แท้ของข้า ไม่ว่าท่านจะส่งจดหมายประจบสอพลอกี่ฉบับก็ตาม!""
 sway_outcome.2001.not_interested_toll_exemptions:0 "\n\n"ข้าไม่สามารถให้การยกเว้นค่าผ่านทางแก่ท่านได้ ไม่ว่าท่านจะสัญญาว่าจะค้าขายมากเพียงใดก็ตาม!""
 sway_outcome.2001.not_interested_friend:0 "\n\n"ฟังดูเหมือนว่าสิ่งที่ท่านต้องการอย่างแท้จริงคือเพื่อน และข้าเกรงว่าข้าไม่สามารถเป็น เช่นนั้นให้ท่านได้ อย่างไรก็ตาม ข้าสามารถแนะนำให้ท่าน—""
 sway_outcome.2001.not_interested_relics:0 "\n\n"ข้าจะไม่ให้วัตถุมงคลใด ๆ ของข้าแก่ท่าน ไม่ว่าท่านจะสวดภาวนาให้ข้ากี่ครั้งก็ตาม!""
 sway_outcome.2001.end:0 "\n\nข้าไม่จำเป็นต้องอ่านต่อ เพื่อให้เข้าใจประเด็น"
 sway_outcome.2001.a:0 "นี่เป็นความเข้าใจผิดครั้งใหญ่ทั้งหมด!"

 sway_outcome.2002.t:0 "ชักจูงโน้มน้าว: การวางแผนชั่วร้าย"
 sway_outcome.2002.desc:0 ""[ROOT.Char.Custom('FormOfAddressForLiege')|U]! [target.Custom2('MyCharacterIntroductionNoComma', ROOT.Char)] ได้ยุติการสนทนาทั้งหมดกับท่านแล้ว"\n\nเมื่อเห็นความสนใจอย่างกะทันหันของข้า และปริมาณจดหมายโต้ตอบ เป็นสัญญาณของแผนการอันชั่วร้าย ดูเหมือนว่า [target.GetSheHe] จะปักใจเชื่อว่าข้ากำลังวางแผนต่อต้าน [target.GetHerHim]!"
 sway_outcome.2002.a:0 "ข้าแค่พยายามสร้างความประทับใจที่ดี..."
