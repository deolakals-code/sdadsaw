l_english: 
 intrigue_scheme_ongoing.1001.t:0 "สินบนที่มาถูกเวลา"
 intrigue_scheme_ongoing.1001.desc:0 "ดูเหมือนว่าไม่ใช่ข้ารับใช้ทุกคนในราชสำนักของ [scheme.GetTargetCharacter.GetTitledFirstNamePossessive] จะภักดีอย่างมืดบอด... [agent.GetFirstName] รับรองกับข้าว่า [agent.GetSheHe] มีช่องทาง และเหรียญเพียงไม่กี่เหรียญในกระเป๋าที่ถูกต้องสามารถช่วยให้เรื่องคืบหน้าไปได้มาก"
 intrigue_scheme_ongoing.1001.elope.desc:0 "ดูเหมือนว่าไม่ใช่ข้ารับใช้ทุกคนในราชสำนักของ [scheme.GetTargetCharacter.GetTitledFirstNamePossessive] จะภักดีต่อ [scheme.GetTargetCharacter.GetLiege.GetTitledFirstName] อย่างมืดบอด... [agent.GetFirstName] รับรองกับข้าว่า [agent.GetSheHe] มีช่องทาง และเหรียญเพียงไม่กี่เหรียญในกระเป๋าที่ถูกต้องสามารถช่วยให้เรื่องคืบหน้าไปได้มาก"
 intrigue_scheme_ongoing.1001.a:0 "ทองเพียงเล็กน้อยจะเป็นไรไปเล่า?"
 intrigue_scheme_ongoing.1001.b:0 "มันเสี่ยงเกินไป!"

 intrigue_scheme_ongoing.1002.t:0 "ความยุติธรรมแห่งสวรรค์"
 intrigue_scheme_ongoing.1002.desc:0 "[ROOT.Char.Custom2('RelationToMe', SCOPE.sC('agent_in_question'))] ของข้า [agent_in_question.GetTitledFirstName] ได้ประณาม [scheme.GetTargetCharacter.GetTitledFirstName] สำหรับความผิด [scheme.GetTargetCharacter.GetHerHis] ที่มีต่อ [agent_in_question.GetFaith.HighGodName]\n\n[agent_in_question.GetSheHe|U] ถึงกับเรียกร้องให้ [agent_in_question.GetFaith.HighGodNameAlternate] สังหาร [scheme.GetTargetCharacter.GetFirstName] และบอกใบ้ถึงการลงโทษที่จะตามมา"
 intrigue_scheme_ongoing.1002.a:0 "อาจจะมองโลกในแง่ดีไปหน่อย แต่ข้าชอบใจในความมุ่งมั่น!"
 intrigue_scheme_ongoing.1002.a.success:0 "[agent_in_question.GetSheHe|U] ชักชวนชาว [agent_in_question.GetFaith.GetAdherentNamePlural] ในท้องถิ่นเข้าร่วมอุดมการณ์ของเรา"
 intrigue_scheme_ongoing.1002.a.failure:0 "[agent_in_question.GetFirstNameNoTooltip] เปิดเผยตนเอง [agent_in_question.GetHerselfHimself] ด้วยความกระตือรือร้น [agent_in_question.GetHerHis]"
 intrigue_scheme_ongoing.1002.b:0 "[agent_in_question.GetTitledFirstNameNoTooltip] จะหุบปาก หรือขอให้ [agent_in_question.GetFaith.HighGodName] ช่วยข้าด้วยเถิด"
 intrigue_scheme_ongoing.1002.c:0 "ข้าจะช่วย [agent_in_question.GetHerHim] ในแนวทางอันสูงส่ง [agent_in_question.GetHerHis]!"

 intrigue_scheme_ongoing.1004.t:0 "ช่างพูดเกินไป"
 intrigue_scheme_ongoing.1004.desc:0 "แม้ว่าความสามารถในการผูกมิตรของ [agent_in_question.GetFirstNamePossessive] จะมีค่าอย่างยิ่งในแผนการของข้า แต่ [agent_in_question.GetSheHe] ก็ไม่ได้ระมัดระวังตัวต่อหน้าผู้อื่นเท่าที่ควร\n\n[agent_in_question.GetSheHe|U] ชอบบอกใบ้คลุมเครือเกินไป และหากมีใครเริ่มตั้งคำถาม ก็ไม่อาจบอกได้ว่า [agent_in_question.GetSheHe] จะเปิดเผยอะไรออกมาบ้าง"
 intrigue_scheme_ongoing.1004.a:0 "สิ่งที่ [agent_in_question.GetSheHe] เรียนรู้มีค่าเกินกว่าจะให้ [agent_in_question.GetHerHim] หุบปาก"
 intrigue_scheme_ongoing.1004.a.success:0 "[agent_in_question.GetFirstNameNoTooltip] ยังคงไม่ถูกตรวจพบ"
 intrigue_scheme_ongoing.1004.a.failure:0 "[agent_in_question.GetFirstNameNoTooltip] ถูกค้นพบ"
 intrigue_scheme_ongoing.1004.b:0 "หาก [agent_in_question.GetSheHe] เก็บความลับไม่ได้ [agent_in_question.GetSheHe] ก็ต้องเงียบแทน!"
 intrigue_scheme_ongoing.1004.toast.success:0 "[agent_in_question.GetFirstNameNoTooltip] ยังคงไม่ถูกตรวจพบ"
 intrigue_scheme_ongoing.1004.toast.failure:0 "[agent_in_question.GetFirstNameNoTooltip] ถูกค้นพบ"

 intrigue_scheme_ongoing.1006.t:0 "เก็บกวาด"
 intrigue_scheme_ongoing.1006.desc:0 "แน่นอนว่าเจ้า [agent_in_question.Custom2('InsultAdjective', ROOT.Char)] [agent_in_question.GetTitledFirstName] นั่นต้องก่อปัญหา\n\n[agent_in_question.GetSheHe|U] ล้มเหลวในการระมัดระวังตัวอย่างเหมาะสมขณะเคลื่อนไหวในราชสำนักของ [scheme.GetTargetCharacter.GetTitledFirstNamePossessive] และ [scheme.GetTargetCharacter.GetTitleAsNameNoTooltip] ก็เริ่มสังเกตเห็นแล้ว คงอีกไม่นานก่อนที่ [agent_in_question.GetSheHe] จะถูกค้นพบ!"
 intrigue_scheme_ongoing.1006.elope.desc:0 "แน่นอนว่าเจ้า [agent_in_question.Custom2('InsultAdjective', ROOT.Char)] [agent_in_question.GetTitledFirstName] นั่นต้องก่อปัญหา\n\n[agent_in_question.GetSheHe|U] ล้มเหลวในการระมัดระวังตัวอย่างเหมาะสมขณะเคลื่อนไหวในราชสำนักของ [scheme.GetTargetCharacter.GetTitledFirstNamePossessive] และ [scheme.GetTargetCharacter.GetLiege.Custom2('HerHisCharacterIntroduction', scheme.GetTargetCharacter)] ก็เริ่มสังเกตเห็นแล้ว คงอีกไม่นานก่อนที่ [agent_in_question.GetFirstNameNoTooltip] จะถูกค้นพบ!"
 intrigue_scheme_ongoing.1006.a.success:0 "[agent_in_question.GetFirstNameNoTooltip] ยังคงไม่ถูกตรวจพบ"
 intrigue_scheme_ongoing.1006.a.failure:0 "[agent_in_question.GetFirstNameNoTooltip] ถูกค้นพบ"
 intrigue_scheme_ongoing.1006.a:1 "ร่องรอยของใครบางคนที่ลอบเข้ามาจะ ทำให้ [scheme.GetTargetCharacter.GetFirstNameNoTooltip] เครียดอย่างแน่นอน!"
 intrigue_scheme_ongoing.1006.b:0 "[agent_in_question.GetSheHe|U] ต้องใช้เวลา ทำให้ดีขึ้น"

 intrigue_scheme_ongoing.1007.t:0 "ความกังวลที่เปล่งออกมา"
 intrigue_scheme_ongoing.1007.desc:0 ""จะเป็นอย่างไรหาก [target.GetTitledFirstName] ค้นพบท่าน? เป็นการฉลาดหรือไม่ที่จะดำเนินความพยายามที่ใช้เวลานานนี้ต่อไป?"\n\n[caring_agent.GetTitledFirstName] [caring_agent.Custom('QuirkPresentPosOrNeg')] และ แม้ว่าข้าจะรู้ว่า [caring_agent.GetSheHe] จะทำตามคำสั่งของข้าในเรื่องนี้ ข้าก็บอกได้ว่าความกังวล [caring_agent.GetHerHis] ที่มีต่อข้านั้นเป็นของจริง"
 intrigue_scheme_ongoing.1007.a:0 "แผนการของข้าจะดำเนินต่อไป และข้าคาดหวังให้เจ้าทำงานหนัก!"
 intrigue_scheme_ongoing.1007.b:0 "เจ้าพูดถูก มันใช้เวลาของข้าไปมาก มาเถิด นั่งกับข้า"

 intrigue_scheme_ongoing.1008.t:0 "หายใจรดต้นคอ"
 intrigue_scheme_ongoing.1008.desc:0 "ดูเหมือนว่า [defender.GetTitledFirstName] กำลังกระชับการรักษาความปลอดภัยในราชสำนัก หวังว่าจะตามหาผู้สมรู้ร่วมคิดที่ทรยศ ผู้ร่วมแผนการของข้า [agent.GetTitledFirstName] กังวลว่า [agent.GetSheHe] อาจดึงดูดความสงสัยที่ไม่พึงประสงค์บางอย่าง"
 intrigue_scheme_ongoing.1008.a:0 "ข้าเชื่อมั่นในความสามารถของ [agent.GetFirstNamePossessiveNoTooltip]"
 intrigue_scheme_ongoing.1008.a.success:0 "[agent.GetFirstNameNoTooltip] ยังคงไม่ถูกตรวจพบ"
 intrigue_scheme_ongoing.1008.a.failure:0 "[agent.GetFirstNameNoTooltip] ถูกค้นพบ"
 intrigue_scheme_ongoing.1008.b:0 "ร่องรอย [agent.GetHerHis|U] ที่สาวมาถึงข้าต้องสิ้นสุดลง เดี๋ยวนี้"
 intrigue_scheme_ongoing.1008.c:1 "ขอบคุณ [ROOT.Char.GetFaith.HighGodNameAlternate] ที่ [councillor.GetTitledFirstNameNoTooltip] อยู่ที่นั่นและสามารถเข้าแทรกแซงได้"

 intrigue_scheme_ongoing.1009.t:0 "ความช่วยเหลือ"
 intrigue_scheme_ongoing.1009.desc:1 "[potential_agent.GetTitledFirstName] มาหาข้า ด้วยสีหน้ามุ่งมั่นในดวงตาของ [potential_agent.GetHerHis]\n\n"[potential_agent.Custom2('RelationToMe', ROOT.Char)] ของข้า ข้าลังเลที่จะเข้าร่วมแผนการของท่านต่อต้าน [potential_agent.Custom2('RelationToMe', SCOPE.sC('target'))] ของข้า [target.GetTitledFirstName] แต่ข้ารู้สึกว่าถึงเวลาแล้วที่ข้าจะเชื่อมั่นในการตัดสินใจของท่านในเรื่องนี้""
 intrigue_scheme_ongoing.1009.elope.desc:0 "[potential_agent.GetTitledFirstName] มาหาข้า ด้วยสีหน้ามุ่งมั่นในดวงตาของ [potential_agent.GetHerHis]\n\n"[potential_agent.Custom2('RelationToMe', ROOT.Char)] ของข้า ข้าลังเลที่จะเข้าร่วมแผนการของท่านที่จะหนีตามไปกับ [target.GetTitledFirstName] แต่บัดนี้ข้าเห็นแล้วว่าท่านห่วงใย [target.GetHerHim] อย่างแท้จริง""
 intrigue_scheme_ongoing.1009.a:0 "โปรดสนับสนุนอุดมการณ์ของข้าด้วยเถิด [potential_agent.GetFirstNameNoTooltip]"
 intrigue_scheme_ongoing.1009.b:0 "ข้าจะขอความช่วยเหลือจากท่านเพียงเล็กน้อยเท่านั้น..."

 intrigue_scheme_ongoing.2001.t:0 "ความไว้วางใจที่ผิดที่"
 intrigue_scheme_ongoing.2001.desc:0 "ธรรมชาติที่ไว้ใจคนง่ายของ [scheme.GetTargetCharacter.GetFirstNamePossessive] ทำให้ [agent_in_question.GetTitledFirstName] สามารถเอาอกเอาใจ [agent_in_question.GetHerselfHimself] กับ [scheme.GetTargetCharacter.GetTitleTierName] ได้ง่ายกว่าที่คาดไว้ – ขณะที่ [agent_in_question.GetFirstNameNoTooltip] เสนอคำแนะนำ [target.GetSheHe] ก็มีแนวโน้มที่จะรับฟังมากกว่าไม่ฟัง"
 intrigue_scheme_ongoing.2001.a:0 "[agent_in_question.GetSheHe|U] ต้องเสนอคำแนะนำที่ดีต่อไป จนกว่า..."
 intrigue_scheme_ongoing.2001.b:0 "[agent_in_question.GetSheHe|U] สามารถรับประกันได้ว่าสายลับคนอื่นๆ สามารถเข้าออกได้"

 intrigue_scheme_ongoing.2002.t:0 "เป้าหมายขี้เมา"
 intrigue_scheme_ongoing.2002.desc:0 "[target.GetTitledFirstName] ชอบดื่มมากเกินไป ซึ่ง ทำให้ [target.GetHerHim] ทำตัวไร้เหตุผลในบางครั้ง\n\nมันคงจะง่ายมากสำหรับ [agent_in_question.GetTitledFirstName] ที่จะตามใจ [target.GetHerHim] และ ทำให้แน่ใจว่านิสัยเหล่านี้ยังคงอยู่"
 intrigue_scheme_ongoing.2002.a:0 "ข้าจะช่วย [agent_in_question.GetFirstNameNoTooltip] นำเข้าเหล้าที่แรงที่สุด!"
 intrigue_scheme_ongoing.2002.b:1 "ทำให้ [target.GetHerHim] รู้สึกปลอดภัยในความมึนเมา [target.GetHerHis]"
 intrigue_scheme_ongoing.2002.c:0 "ฮ่า เจ้าคนโง่นั่นไม่รู้จุดอ่อน [target.GetHerHis] ของตัวเอง!"

 intrigue_scheme_ongoing.2003.t:0 "การสอดแนมโดยบังเอิญ"
 intrigue_scheme_ongoing.2003.bad_habits:0 "มันไม่ใช่สิ่งที่ [agent.GetTitledFirstName] หวังว่าจะพบจากการสอดแนมบทสนทนาลับ แต่การค้นพบความจริงเกี่ยวกับนิสัยผิดปกติของ [other_secret_target.GetTitledFirstNamePossessive] ก็ไม่เสียหาย..."
 intrigue_scheme_ongoing.2003.secret_relationships:0 "มันไม่ใช่สิ่งที่ [agent.GetTitledFirstName] คาดหวังว่าจะพบจากการสอดแนมบทสนทนาลับ แต่การค้นพบความสัมพันธ์ที่ผิดกฎหมายของ [other_secret_target.GetTitledFirstNamePossessive] ก็ไม่เสียหาย..."
 intrigue_scheme_ongoing.2003.bastardy:0 "มันไม่ใช่สิ่งที่ [agent.GetTitledFirstName] คาดหวังว่าจะพบจากการสอดแนมบทสนทนาลับ แต่การค้นพบความจริงเกี่ยวกับต้นกำเนิดของ [secret_target.GetTitledFirstNamePossessive] ก็ไม่เสียหาย..."
 intrigue_scheme_ongoing.2003.murder:0 "มันไม่ใช่สิ่งที่ [agent.GetTitledFirstName] คาดหวังว่าจะพบจากการสอดแนมบทสนทนาลับ แต่การเปิดโปงอาชญากรรมอันน่าสะพรึงกลัวของ [other_secret_target.GetTitledFirstNamePossessive] ก็ไม่เสียหาย..."
 intrigue_scheme_ongoing.2003.desc:0 "มันไม่ใช่สิ่งที่ [agent.GetTitledFirstName] หวังว่าจะพบจากการสอดแนมบทสนทนาลับ แต่การค้นพบความจริงเกี่ยวกับ [other_secret_target.GetTitledFirstName] ก็ไม่เสียหาย..."
 intrigue_scheme_ongoing.2003.a:0 "บางทีสิ่งนี้อาจช่วยความพยายามของข้าได้?"

 intrigue_scheme_ongoing.3001.t:0 "ความยุติธรรมและความลับ"
 intrigue_scheme_ongoing.3001.desc:0 "วิธีการที่ข้ากระทำอยู่ทุกวันนี้... ความลับและการวางแผนในเงามืด สิ่งนี้ไม่ถูกต้อง สิ่งนี้ไม่ยุติธรรม"
 intrigue_scheme_ongoing.3001.a:0 "ข้าทำในสิ่งที่ต้องทำ!"
 intrigue_scheme_ongoing.3001.b:0 "หากต้องทำ ก็ควร ทำให้ถูกต้อง"

 intrigue_scheme_ongoing.3002.t:0 "ความเครียดจากการโกหก"
 intrigue_scheme_ongoing.3002.desc:0 "แผนการลับและรูปแบบอันมืดมนเหล่านี้ทั้งหมด... มือเย็นเฉียบจับที่หัวใจของข้าทุกครั้งที่คิดถึงพวกมัน มันรู้สึกผิดมาก"
 intrigue_scheme_ongoing.3002.a:0 "นี่คือสิ่งที่ต้องทำ!"
 intrigue_scheme_ongoing.3002.b:0 "ข้าใช้เวลาคิดเรื่องนี้มากเกินไป"
 intrigue_scheme_ongoing.3002.c:0 "[ROOT.Char.GetFaith.HighGodName] โปรดอภัยให้ข้าด้วย ข้าทำอะไรลงไป?"
 intrigue_scheme_ongoing.3002.d:0 "ข้าต้องซื่อสัตย์ต่อเจตนาของข้า"

 # Map wilderness outside of target location
 intrigue_scheme_ongoing.3003.t:0 "ระหว่างทาง"
 intrigue_scheme_ongoing.start.3003.desc:0 "เมื่อถึงเวลา สายลับของข้าจะต้องมี"
 intrigue_scheme_ongoing.escape_route.3003.desc:0 "เส้นทางหลบหนีที่ปลอดภัยออกจาก [defender.Custom('ResidenceBuilding')] ของ [defender.GetTitledFirstNamePossessive] หากมีอะไรผิดพลาดเกิดขึ้น"
 intrigue_scheme_ongoing.leave_with_target.3003.desc:0 "เส้นทางที่ปลอดภัยในการขนส่ง [target.GetTitledFirstName] ออกจาก [defender.Custom('ResidenceBuilding')] ของ [defender.GetTitledFirstNamePossessive]"
 intrigue_scheme_ongoing.end.3003.desc:0 "แผนที่โดยละเอียดของ [scheme_location.Custom('TerrainTypeProvince')] ในท้องถิ่น พร้อมด้วยเส้นทางและถ้ำที่ซ่อนอยู่ทั้งหมด จะเป็นทรัพยากรที่ประเมินค่ามิได้"
 intrigue_scheme_ongoing.3003.a:0 "จ่ายเงินให้นายพรานจาก [scheme_location.GetNameNoTooltip] เพื่อวาดแผนที่"
 intrigue_scheme_ongoing.3003.a.success:0 "นายพราน [hunter.GetShortUIName] เก็บความลับได้"
 intrigue_scheme_ongoing.3003.a.failure:0 "นายพราน [hunter.GetShortUIName] โอ้อวดเกี่ยวกับความมั่งคั่งที่เพิ่งได้มา [hunter.GetHerHis]"
 intrigue_scheme_ongoing.3003.d:0 "ถามสหายของท่าน [hunter.GetTitledFirstNameNoTooltip]"
 intrigue_scheme_ongoing.3003.b:0 "สำรวจ [scheme_location.Custom('TerrainTypeProvince')] ด้วยตนเอง"
 intrigue_scheme_ongoing.3003.b.success:0 "ท่านวาดแผนที่บริเวณโดยรอบ [scheme_location.GetNameNoTooltip]"
 intrigue_scheme_ongoing.3003.b.soft_failure:0 "ท่านหลงทางใน [scheme_location.Custom('TerrainTypeProvince')]"
 intrigue_scheme_ongoing.3003.b.hard_failure:0 "ท่านหลงทางข้ามคืนใน [scheme_location.Custom('TerrainTypeProvince')]"
 intrigue_scheme_ongoing.3003.c:0 "ล้มเลิกความคิดนี้เสีย"
 intrigue_scheme_ongoing.3003.e:0 "ถาม $master_of_hunt_court_position$ ของท่าน [hunter.GetTitledFirstNameNoTooltip]"

 intrigue_scheme_ongoing.3004.t:0 "แผนที่"
 intrigue_scheme_ongoing.3004.desc:0 "สายลับของข้าแจ้งว่ามีนายพรานคนหนึ่งก่อความวุ่นวายที่โรงเตี๊ยมท้องถิ่น [hunter.GetWomanMan] ผู้นั้นใช้จ่ายทองคำจำนวนมากและโอ้อวดเสียงดังเกี่ยวกับข้อตกลงที่ยอดเยี่ยมที่ [hunter.GetSheHe] ทำกับ "[owner.GetLadyLord] ผู้หรูหราในชุดไข่มุกและผ้าไหม"\n\nเห็นได้ชัดว่า [hunter.GetSheHe] วาดแผนที่ของ [defender.Custom('TerrainType')] ในท้องถิ่นให้กับขุนนางที่ไม่รู้จัก [owner.GetWomanMan] สายลับคิดว่า [owner.GetLadyLord] ผู้นั้นต้องกำลังวางแผนการร้ายต่อข้าหรือข้าราชบริพารคนใดคนหนึ่งของข้า"
 intrigue_scheme_ongoing.3004.a:0 "ขอบคุณที่นำเรื่องนี้มาแจ้งให้ข้าทราบ"
 intrigue_scheme_ongoing.3004.b:0 "เจ้าคนโง่นั่นสมควรอยู่ในคุกใต้ดินของข้า!"
 intrigue_scheme_ongoing.3004.c:0 "นำ [hunter.GetHerHim] มาหาข้า ข้าคิดว่าข้าสามารถกระตุ้นความจำ [hunter.GetHerHis] ได้..."
 intrigue_scheme_ongoing.3004.c.tt:0 "[scheme_hostile|E] หรือ [scheme|E] ที่มุ่งร้ายอื่นๆ ถูกเปิดโปง"
 intrigue_scheme_ongoing.3004.toast:0 "แผนการถูกเปิดโปง"

 # MESSENGER PIGEON
 intrigue_scheme_ongoing.3005.t:0 "ผู้นำสารติดปีก"
 intrigue_scheme_ongoing.3005.desc:0 "ขณะที่แผนการของข้าใกล้จะบรรลุผล การสื่อสารที่รวดเร็วคือกุญแจสำคัญ ข้ามีนกพิราบที่ฉลาดเป็นพิเศษ ซึ่ง [pigeon_recipient.GetTitledFirstName] สามารถใช้ส่งข้อความเร่งด่วนมาให้ข้าที่นี่ใน [root_location.GetNameNoTooltip] ได้ หากมีความจำเป็นเกิดขึ้น\n\nแต่ข้าจะนำนกเข้าไปใน [defender.Custom('ResidenceBuilding')] ของ [target_location.GetNameNoTooltip] ได้อย่างไร?"
 intrigue_scheme_ongoing.3005.c.f:0 "ตัวเลือกนี้ใช้ได้ เนื่องจากสายลับของท่าน [elope_agent.GetShortUIName] เป็น [friend|E], [close_family_member|E] หรือคนรับใช้ [elope_agent.Custom('FemaleMale')] ของ [pigeon_recipient.GetShortUIName]"
 intrigue_scheme_ongoing.3005.a:0 "ผู้ฝึกนกในท้องถิ่นสามารถส่งมอบให้เป็น "ของขวัญ" ได้"
 intrigue_scheme_ongoing.3005.a.success:0 ""ของขวัญ" ไปถึง [pigeon_recipient.GetShortUIName]"
 intrigue_scheme_ongoing.3005.a.failure:0 "[defender.GetShortUIName|U] ไล่ผู้ฝึกนกไป"
 intrigue_scheme_ongoing.3005.b:0 "หากข้าส่ง "ของขวัญ" ด้วยตนเอง [defender.GetTitledFirstNameNoTooltip] คงปฏิเสธไม่ได้"
 intrigue_scheme_ongoing.3005.c:0 "ให้ [elope_agent.GetTitledFirstNameNoTooltip] ส่งมอบนก"
 intrigue_scheme_ongoing.3005.d:0 "มันเสี่ยงเกินไป"


 intrigue_scheme_ongoing.4001.t:0 "ผู้ใหญ่ที่รับผิดชอบ"
 intrigue_scheme_ongoing.4001.desc:0 "[agent_in_question.GetTitledFirstName] บอกข้าว่า [agent_in_question.GetSheHe] ถูกขอให้ดูแลกลุ่มเด็กที่กำลังเล่นอยู่ในราชสำนัก\nโชคดีที่ในกลุ่มนั้นมี [scheme.GetTargetCharacter.GetTitledFirstName] รวมอยู่ด้วย\n\nนี่เป็นโอกาสอันดีที่จะให้ [agent_in_question.GetTitledFirstName] ผลักดันเรื่องต่างๆ ให้คืบหน้า"
 intrigue_scheme_ongoing.4001.a:0 "สอนให้พวกเขามีนิสัยชอบเล่นห่างไกลจากสายตาที่จับจ้อง"
 intrigue_scheme_ongoing.4001.b:0 "พยายามผูกมิตรกับ [scheme.GetTargetCharacter.GetTitledFirstNameNoTooltip] ทำให้ [scheme.GetTargetCharacter.GetHerHim] เชื่อใจเจ้า"

 intrigue_scheme_ongoing.4002.t:0 "ความไร้เดียงสาของเด็ก"
 intrigue_scheme_ongoing.4002.desc:0 "[target.GetTitledFirstName] ไม่สามารถเข้าใจได้เลยว่าจะมีใครวางแผนที่ไม่ซื่อสัตย์ แม้จะมีราชสำนักที่วุ่นวายอยู่รอบตัว [target.GetHerHim]\n\nจากการพูดคุยกับ [scheme.GetTargetCharacter.GetHerHim] ดูเหมือนว่า [scheme.GetTargetCharacter.GetSheHe] จะไว้ใจข้าจริงๆ!"
 intrigue_scheme_ongoing.4002.a:0 "โอกาสที่จะได้ใกล้ชิดกับ [target.Custom2('RelationToMe', SCOPE.sC('parent'))] [target.GetHerHis]!"
 intrigue_scheme_ongoing.4002.b:0 "ที่ซ่อนลับหรือ? เจ้าช่วยพาข้าไปดูได้ไหม?"

 intrigue_scheme_ongoing.4003.t:0 "ความคิดที่สอง"
 intrigue_scheme_ongoing.4003.desc:0 "[agent_in_question.GetTitledFirstName] มาหาข้าด้วยความกังวลเกี่ยวกับแผนการที่ข้าให้ [agent_in_question.GetHerHim] เข้าไปเกี่ยวข้อง แม้ว่าข้าจะสั่งให้ [agent_in_question.GetHerHim] ผูกมิตรกับ [scheme.GetTargetCharacter.GetTitledFirstName] แต่ข้าไม่เคยตั้งใจให้พวกเขามีความผูกพันทางอารมณ์!\n\nตอนนี้ข้าพบว่าตนเองกำลังสงสัยว่าพวกเขาจะไว้ใจได้แค่ไหน..."
 intrigue_scheme_ongoing.4003.a:0 ""อย่า ทำให้ข้าต้องเตือนเจ้าว่าทำไมเจ้าถึงช่วยข้าตั้งแต่แรก!""
 intrigue_scheme_ongoing.4003.b:0 "ข้าจะลดการมีส่วนร่วมของพวกเขาในแผนการของข้าอย่างเงียบๆ"

 intrigue_scheme_ongoing.5001.t:0 "คันคะเยออยากหาเรื่องกวนใจ"
 intrigue_scheme_ongoing.5001.desc:0 "[servant.GetWomanMan] ผู้รับผิดชอบทำความสะอาดเสื้อผ้าของทหารยามของ [target.GetTitledFirstNamePossessive] ถูกนำตัวมาให้ข้า ไม่มีใครสังเกตเห็น [servant.GetHerHim] ไปยุ่งย่ามกับเสื้อผ้าของพวกเขา และหากสามารถปลูกฝังบางสิ่งที่ ทำให้ทหารยามวอกแวกได้...\n\n"ท่านต้องการสิ่งใดจากข้าหรือ [ROOT.Char.Custom('FormOfAddressForLiege')]?""
 intrigue_scheme_ongoing.5001.a:0 "ข้าต้องการให้เจ้าบดผลกุหลาบป่าให้ละเอียดจริงๆ..."
 intrigue_scheme_ongoing.5001.b:0 "ตัดรูบนเสื้อผ้าของพวกเขา ในบริเวณที่ไม่เหมาะสม"

 intrigue_scheme_ongoing.5002.t:0 "ลิขิตสวรรค์"
 intrigue_scheme_ongoing.5002.desc:0 "[target.GetTitleAsNameNoTooltip] ที่ต้อง ทำให้หวาดกลัว ผู้หยั่งรู้ท้องถิ่น [local_mystic.GetName] ที่มีศีลธรรมน่าสงสัย และลางบอกเหตุที่กุขึ้น... สมบูรณ์แบบ\n\nก่อนที่ผู้หยั่งรู้จะออกเดินทางไปยังราชสำนักของ [target.GetTitledFirstNamePossessive] มีคำถามเพียงข้อเดียว — ลางบอกเหตุปลอมของข้าจะเป็นลางดี หรือลางร้าย?"
 intrigue_scheme_ongoing.5002.a:0 "ลางร้ายสำหรับ [target.GetTitleAsNameNoTooltip] ที่ชั่วร้าย!"
 intrigue_scheme_ongoing.5002.a.tt:0 "ข้าเชื่อว่า [target.GetFirstNameNoTooltip] ได้รับผลกระทบจากข่าวร้ายได้ง่ายกว่า"
 intrigue_scheme_ongoing.5002.a.success:0 "[target.GetSheHe|U] ใช้เวลาหลายคืนนอนไม่หลับด้วยความกังวล"
 intrigue_scheme_ongoing.5002.a.failure:1 "[target.GetSheHe|U] มี แต่จะระแวดระวังมากขึ้น"
 intrigue_scheme_ongoing.5002.b:0 "ลางดี เพื่อกล่อม [target.GetHerHim] ด้วยความปลอดภัยจอมปลอม"
 intrigue_scheme_ongoing.5002.b.tt:0 "ข้าเชื่อว่า [target.GetFirstNameNoTooltip] มีแนวโน้มที่จะเชื่อข่าวดีมากกว่า"
 intrigue_scheme_ongoing.5002.b.success:0 "[target.GetSheHe|U] ลดการป้องกัน [target.GetHerHis] ลง"
 intrigue_scheme_ongoing.5002.b.failure:0 "[target.GetSheHe|U] ระแวดระวังมากขึ้น"

 intrigue_scheme_ongoing.5003.t:0 "ลางบอกเหตุ"
 intrigue_scheme_ongoing.5003.desc_opening:0 "ผู้หยั่งรู้ท้องถิ่น [local_mystic.GetName] ยืนกรานที่จะพบข้า และเมื่อถูกนำตัวมาต่อหน้าข้า [local_mystic.GetSheHe] ก็เริ่มคร่ำครวญ และ... นั่นเลือดบนมือ [local_mystic.GetHerHis] หรือ?\n\n"
 intrigue_scheme_ongoing.5003.desc:1 ""สัญญาณ! สัญญาณไม่เป็นใจแก่ท่าน ท่าน [target.GetLadyLord] ของข้า ข้าผ่าไส้ไก่ และเลือดแสดงให้ข้าเห็นอนาคตของท่าน – มันมืดมนและเต็มไปด้วยความตาย!""
 intrigue_scheme_ongoing.5003.a:0 "ช่างเป็นลางร้ายเสียนี่กระไร...!"

 intrigue_scheme_ongoing.5004.desc:1 ""สัญญาณ! สัญญาณเป็นใจแก่ท่าน ท่าน [target.GetLadyLord] ของข้า ข้าผ่าไส้ไก่ และเลือดแสดงให้ข้าเห็นอนาคตของท่าน – มันรุ่งโรจน์ยิ่งนัก!""
 intrigue_scheme_ongoing.5004.a:0 "เอ่อ... ขอบคุณ?"

 intrigue_scheme_ongoing.5005.t:0 "ทุกสิ่งที่แวววาว"
 intrigue_scheme_ongoing.5005.desc:0 "[spymaster.GetCouncilTitle] ของข้า [spymaster.GetTitledFirstName] เข้ามาหาข้าพร้อมกับรอยยิ้มอันชั่วร้าย\n\n"[ROOT.Char.Custom('FormOfAddressForLiege')|U] ถุงใบนี้บรรจุผงแป้งอันชั่วร้ายอย่างยิ่ง หากโรยลงบนบางสิ่ง — สมมติว่าเป็นของขวัญสำหรับ [target.GetTitledFirstName] – มันจะไม่ทิ้งร่องรอยใดๆ แต่จะ ทำให้ผู้ใดก็ตามที่สัมผัสต้องทนทุกข์ด้วยความอ่อนแอและอารมณ์ร้าย""
 intrigue_scheme_ongoing.5005.a:0 "เอ่อ เอ่อ เอ่อ... ข้าว่า [target.GetSheHe] สมควรได้รับของขวัญ"
 intrigue_scheme_ongoing.5005.b:0 "[target.GetSheHe|U] จะไม่ได้ทองของข้าไป!"

 intrigue_scheme_ongoing.5006.t:0 "ของขวัญ"
 intrigue_scheme_ongoing.5006.desc:0 "[owner.GetTitledFirstName] ส่งของขวัญมาให้ข้า เป็นกล่องที่ตก แต่งอย่างหรูหราเต็มไปด้วยทองคำ ขณะที่ข้าใช้มือลูบไล้เหรียญ ข้ารู้สึกราวกับว่าห้องเริ่มหมุนรอบตัวข้าและหายใจหอบ"
 intrigue_scheme_ongoing.5006.a:0 "ช่างไม่คาดคิด! และช่างเป็นผลกระทบที่น่าประหลาด"

 intrigue_scheme_ongoing.5007.t:0 "ทองคำปนเปื้อน"
 intrigue_scheme_ongoing.5007.desc_opening:0 "[ROOT.Char.Custom2('RelationToMe', SCOPE.sC('poisoned'))] ของข้า [poisoned.GetTitledFirstName] เข้ามาหาข้าพร้อมเหงื่อที่ผุดบนหน้าผาก [poisoned.GetHerHis] และใบหน้าที่ซีดเผือด\n\n"
 intrigue_scheme_ongoing.5007.desc:0 ""[ROOT.Char.GetMotherFather] มีบางอย่างผิดปกติ อารมณ์ของข้าไม่สมดุลเลยนับตั้งแต่ข้าช่วยท่านห่อของขวัญนั้นสำหรับ [target.GetTitledFirstName]...""
 intrigue_scheme_ongoing.5007.a:0 "อะไรจะ... ทองคำอาบยาพิษ!"
 intrigue_scheme_ongoing.5007.a.tt:0 "[ROOT.Char.GetFaith.HighGodName] โปรดช่วย [poisoned.GetHerHim] ด้วยเถิด!"

 intrigue_scheme_ongoing.5008.desc:0 ""[ROOT.Char.Custom('FormOfAddressForLiege')|U] อารมณ์ของข้าแปรปรวนนับตั้งแต่ที่ข้าช่วยท่านห่อของขวัญชิ้นนั้นสำหรับ [target.GetTitledFirstName]... ข้าเกรงว่ามลทินจากทองคำจะส่งผลกระทบต่อข้า เช่นกัน""
 intrigue_scheme_ongoing.5008.a:0 "ให้ตายสิ"

 intrigue_scheme_ongoing.5009.t:0 "อุโมงค์"
 intrigue_scheme_ongoing.5009.desc:0 "รายงานมาถึงข้าเกี่ยวกับหนูจำนวนมากที่อยู่รอบๆ [target.Custom('ResidenceBuilding')] ของ [target.GetTitledFirstNamePossessive] และ เนื่องจากข้ามีความสามารถพิเศษกับสัตว์ ข้าจึงออกไปตรวจสอบ\n\nเมื่อข้าไปถึงบริเวณนั้น หนูทั้งหลายก็มารวมตัวกันที่ข้า ต้อนรับข้า และนำข้าไปยังอุโมงค์มืดที่อยู่ห่างจาก [target.Custom('ResidenceBuilding')] พอสมควร"
 intrigue_scheme_ongoing.5009.a:0 "นำทางข้าไปเถิด สหายข้า!"
 intrigue_scheme_ongoing.5009.a.tt:1 "ข้าสงสัยว่าเจ้า #EMP สัตว์ฟันแทะ#! พวกนี้จะไปที่ไหน"
 intrigue_scheme_ongoing.5009.b:0 "อี๋ ข้าไม่เข้าไปหรอก"

 intrigue_scheme_ongoing.5010.desc:0 "มันมืด และเสียงวิ่งของเท้าเล็กๆ สะท้อนอยู่ในอากาศที่อบอวลไปด้วยกลิ่นเหม็นของขยะ\n\nทันใดนั้น ลมหายใจสดชื่นก็พัดมาถึงข้า และข้าเห็นแสงลอดผ่านตะแกรงด้านหน้า หนูนำข้าไปยังอุโมงค์ที่ตรงเข้าไปใน [target.Custom('ResidenceBuilding')] ของ [target.GetTitledFirstNamePossessive]!"
 intrigue_scheme_ongoing.5010.a:0 "ขอบคุณ สหายข้า!"
 intrigue_scheme_ongoing.5010.b:0 "*ไอ* ขอบคุณ สหายข้า! แต่กลิ่นเหม็นนี่...!"

 intrigue_scheme_ongoing.5011.t:0 "สัตว์ร้าย"
 intrigue_scheme_ongoing.5011.desc:0 "สัตว์มีพิษหลากหลายชนิดต้อนรับข้าที่แผงขายของพ่อค้า และข้าก็เกิดความคิดขึ้นมา สัตว์ที่งดงามเหล่านี้ตัวหนึ่งจะไม่เป็นของขวัญที่สมบูรณ์แบบสำหรับ [target.GetTitledFirstName] หรือ?"
 intrigue_scheme_ongoing.5011.a:0 "ขอตัวที่อันตรายที่สุด– น่าสนใจที่สุดของท่านตัวหนึ่ง โปรด"
 intrigue_scheme_ongoing.5011.a.tt:0 "[target.GetSheHe|U] จะไม่มีวันรู้ตัว!"
 intrigue_scheme_ongoing.5011.b:0 "ขอ [SCOPE.Custom('VenomousCreature')] นั่นให้ข้าเพื่อการศึกษา"

 intrigue_scheme_ongoing.5012.desc:0 "พ่อค้าวาง [SCOPE.Custom('VenomousCreature')] ลงในตะกร้าสานโดยไม่ถามคำถามใดๆ ระหว่างทางกลับบ้าน ข้าเปิดฝาออก แต่ต้องประหลาดใจที่พบว่ามันว่างเปล่า..."
 intrigue_scheme_ongoing.5012.a:0 "มันหายไปไหน...? ไหน– อ๊าก!"

 intrigue_scheme_ongoing.5013.desc:0 "\n\n"ดูสิ แม่ ดูสิ! [ROOT.Char.GetWomanMan] คนนั้นกำลังทรงตัวสัตว์ไว้บนหัว [ROOT.Char.GetHerHis]!" เสียงที่ยินดีดังขึ้นจากด้านหลังข้า และเมื่อข้าหันไป ข้าเห็นว่าฝูงชนได้รวมตัวกัน"
 intrigue_scheme_ongoing.5013.a:0 "...แท่น แทน แท๊น! ทีนี้เอามันออกไป เอามัน #EMP ออกไป#!!"
 intrigue_scheme_ongoing.5013.a.tt:0 "ข้าทำสัตว์หายไป แต่อย่างน้อยข้าก็ไม่เสียชีวิต..."

 intrigue_scheme_ongoing.5014.t:0 "พรมหนานุ่มและแปลกตา"
 intrigue_scheme_ongoing.5014.t_persian: "$persian_has_plush_carpet_modifier$"
 intrigue_scheme_ongoing.5014.desc:0 "หนานุ่ม มีชีวิตชีวา และอ่อนนุ่มดุจแสงแรกแห่งรุ่งอรุณ — พ่อค้าคนหนึ่งนำเสนอพรมอันงดงามให้ข้าโดยหวังความสัมพันธ์ที่ดีในอนาคต\n\nขณะที่ข้าชื่นชมการทออันประณีต ข้าก็เกิดความคิดขึ้นมา พรม เช่นนี้จะไม่ช่วยลดเสียงฝีเท้าหรือ? แม้กระทั่งปกปิดรอยเท้าของสายลับที่ซุ่มซ่าม...?"
 intrigue_scheme_ongoing.5014.a:0 "[target.GetTitledFirstNameNoTooltip] จะได้รับเกียรติจากของขวัญ เช่นนี้"
 intrigue_scheme_ongoing.5014.a.success:0 "[target.GetSheHe|U] รับของขวัญ"
 intrigue_scheme_ongoing.5014.a.failure:0 "[target.GetSheHe|U] สงสัยว่ามีบางอย่างผิดปกติ"
 intrigue_scheme_ongoing.5014.b:0 "แต่มันจะดู #EMP เยี่ยม#! ในห้องของข้านะ..."

 intrigue_scheme_ongoing.5015.desc:0 "พรมหนานุ่ม มีชีวิตชีวา และอ่อนนุ่ม มาถึงเป็นของขวัญจาก [owner.GetTitledFirstName]\n\nทำไม [owner.GetSheHe] ถึงส่งของขวัญอันงดงาม เช่นนี้มาให้ข้า ข้าไม่ทราบ แต่การทออันประณีตของพรมนั้นน่าสัมผัสราวกับผิวของคนรัก"
 intrigue_scheme_ongoing.5015.a:0 "พรมนี้จะปูพื้นในห้องของข้า!"
 intrigue_scheme_ongoing.5015.b:0 "ข้าคิดว่าข้าควรจะกำจัดมันทิ้งเสียดีกว่า..."

 intrigue_scheme_ongoing.5016.t:0 "พลังแห่งคำพูด"
 intrigue_scheme_ongoing.5016.desc:0 "[servant.GetTitledFirstName] ยืนอยู่เบื้องหน้าข้า คนรับใช้ของ [target.GetTitledFirstName] ผู้ [target.Custom2('InsultAdjective', ROOT.Char)]\n\n"เอาล่ะ ข้าต้องการให้เจ้าทำบางสิ่งเพื่อข้า... และแน่นอนว่าเจ้าจะได้รับค่าตอบแทนอย่างสมเหตุสมผล""
 intrigue_scheme_ongoing.5016.a:0 "คำกระซิบสามารถโค่นล้ม [target.GetTitleAsNameNoTooltip] ได้!"
 intrigue_scheme_ongoing_5016_every_courtier:0 "ข้าราชบริพารและแขกทุกคนที่ไม่ใช่สายลับ"
 intrigue_scheme_ongoing.5016.b:0 "เปิดประตู [target.Custom('ResidenceBuilding')] ไว้ให้ข้า"
 intrigue_scheme_ongoing.5016.c_man:0 "ช่างเถอะ วิ่งกลับไปหานายของเจ้า"
 intrigue_scheme_ongoing.5016.c_woman:0 "ช่างเถอะ วิ่งกลับไปหานายหญิงของเจ้า"

 intrigue_scheme_ongoing.5017.t:0 "[target.Custom2('RelationToMe', SCOPE.sC('spouse'))|U] ผู้หลอกง่าย"
 intrigue_scheme_ongoing.5017.desc:0 "ข้าแทบจะกลั้นความยินดีไว้ไม่อยู่เมื่อพบ [spouse.GetTitledFirstName] [target.Custom2('RelationToMe', SCOPE.sC('spouse'))] ของ [target.GetTitledFirstNamePossessive] กำลังรอข้าอยู่พร้อมกับขบวนเล็กๆ หากข้าสามารถให้ #EMP [spouse.GetHerHim]#! ช่วยข้าในแผนการนี้ได้...\n\n"ท่านส่งข่าวว่าต้องการพบข้าหรือ [ROOT.Char.Custom('FormOfAddressForLiege')]?""
 intrigue_scheme_ongoing.5017.a:1 "[spouse.Custom2('RelationToMe', SCOPE.sC('target'))] ของท่านเรียกท่านว่า [spouse.Custom2('InsultAdjectiveArticle', ROOT.Char)] [spouse.Custom2('InsultNoun', ROOT.Char)]"
 intrigue_scheme_ongoing.5017.a.success:0 "[spouse.GetTitledFirstNameNoTooltip] เชื่อข้า"
 intrigue_scheme_ongoing.5017.a.failure:0 "[target.GetTitleAsNameNoTooltip] โน้มน้าว [spouse.GetHerHim] ว่าเป็นเรื่องโกหก"
 intrigue_scheme_ongoing.5017.b:0 "โปรดเถิด เล่าให้ข้าฟังเกี่ยวกับ [target.Custom('ResidenceBuilding')] ของท่าน!"

 intrigue_scheme_ongoing.5018.t:0 "ผู้ติดตามค่าย"
 intrigue_scheme_ongoing.5018.desc:0 "[target.GetTitledFirstName] ผู้ [target.Custom2('InsultAdjective', ROOT.Char)] กำลังทำสงคราม\n\nปัจจุบัน [target.GetSheHe|U] ตั้งค่ายอยู่ใน [location.GetName] และแหล่งข่าวบอกข้าว่า [target.GetSheHe] จะรับผู้ติดตามเข้าค่ายเพิ่มในไม่ช้า — เป็นโอกาสอันดีที่จะส่งคนของข้าบางส่วนเข้าไปในค่าย!"
 intrigue_scheme_ongoing.5018.a:0 "พวกเขาจะรายงานให้ข้าทราบโดยไม่มีใครเห็นในฝูงชน"
 intrigue_scheme_ongoing.5018.b:0 "แป้งสาลี ข้าวสาลี เนื้อ... เผามันซะ"
 intrigue_scheme_ongoing.5018.msg.t:0 "เสบียงถูกเผาในอุบัติเหตุ"

 intrigue_scheme_ongoing.5019.t:0 "อุโมงค์ลับ"
 intrigue_scheme_ongoing.5019.desc:1 "สายลับของข้า [agent.GetTitledFirstName] เข้ามาหาข้าพร้อมกับม้วนกระดาษหนังในมือ [agent.GetHerHis]\n\n"ข้าพบแบบร่างสถาปัตยกรรมเก่าของ [target.Custom('ResidenceBuilding')] ของ [target.GetTitleAsNamePossessive]! มันอาจจะเก่าไปหน่อย แต่ดูนี่สิ...""
 intrigue_scheme_ongoing.5019.a:0 "นั่นดูเหมือนอุโมงค์ที่เราใช้ได้!"
 intrigue_scheme_ongoing.5019.b:1 "หากเพียง แต่ข้ามีที่ซ่อนมากมาย เช่นนี้... เรียกสถาปนิกของข้ามา"
 intrigue_scheme_ongoing.5019.b.tt:0 "[ROOT.Char.Custom2('RelationToMe', SCOPE.sC('architect'))|U] ของท่าน [architect.GetFirstNameNoTooltip] จะดูแลงานก่อสร้าง"

 intrigue_scheme_ongoing.5021.t:0 "ความหมกมุ่นที่เสี่ยงภัย"
 intrigue_scheme_ongoing.5021.desc:0 "ข้าไปหา [owner.GetTitledFirstName] [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('owner'))] ของข้า ในห้องพัก [owner.GetHerHis] แต่กลับพบเพียง [owner.Custom('GetChamber')] ที่ว่างเปล่า\n\nขณะที่พลิกดูเอกสาร [owner.GetHerHis] อย่างสบายๆ ข้าก็เจอเข้ากับบางอย่าง — แผนการ อย่างไม่ต้องสงสัย ต่อ [target.Custom2('MyCharacterIntroduction', ROOT.Char)]!"
 intrigue_scheme_ongoing.5021.a:0 "นี่มันหมายความว่าอย่างไร [owner.GetFirstNameNoTooltip]?!"
 intrigue_scheme_ongoing.5021.a.success:0 "[owner.GetSheHe|U] กำลังวางแผนสังหารจริงๆ"
 intrigue_scheme_ongoing.5021.a.success.tt:0 "แผนการถูกเปิดโปง"
 intrigue_scheme_ongoing.5021.a.failure:0 "[owner.GetSheHe|U] ถูกดูหมิ่น"
 intrigue_scheme_ongoing.5021.b:0 "ข้าไม่เห็น #EMP อะไร#! ทั้งนั้น"

 intrigue_scheme_ongoing.5022.t:0 "ข้อกล่าวหา"
 intrigue_scheme_ongoing.5022.desc:0 ""ท่านกำลังวางแผนสังหารใครบางคนหรือ?!"\n\n[family_member.GetTitledFirstName] [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('family_member'))] ของข้า เผชิญหน้ากับข้าด้วยสีหน้าตกตะลึงบนใบหน้า [family_member.GetHerHis] ในมือ [family_member.GetHerHis] [family_member.GetSheHe] กำลังกำกระดาษที่มีบันทึกเกี่ยวกับแผนการสังหาร [target.GetTitledFirstName] ของข้า – กระดาษที่ข้ารู้ว่าข้าทิ้งไว้ในห้องทำงานส่วนตัว"
 intrigue_scheme_ongoing.5022.a:0 "ข้าจะ #EMP ไม่มีวัน#!!"
 intrigue_scheme_ongoing.5022.a.success:0 "[family_member.GetSheHe|U] เชื่อท่าน"
 intrigue_scheme_ongoing.5022.a.failure:0 "[family_member.GetSheHe|U] ไม่เชื่อข้อโต้แย้งของท่าน"
 intrigue_scheme_ongoing.5022.b:0 "มันเป็นสิ่งที่ดีที่สุด ฟังข้าตอนนี้..."
 intrigue_scheme_ongoing.5022.b.success:0 "[family_member.GetSheHe|U] รับฟังข้อโต้แย้งของท่าน"
 intrigue_scheme_ongoing.5022.b.failure:0 "[family_member.GetSheHe|U] ไม่คล้อยตาม"
 intrigue_scheme_ongoing.5022.c:0 "ดูเหมือนแผนการของข้าจะบานปลายขึ้น"

 intrigue_scheme_ongoing.5023.desc:0 ""เจ้าไม่ควรเห็นสิ่งนั้น"\n\nเสียงของ [owner.GetTitledFirstNamePossessive] เบา แต่ข้าได้ยินความโกรธในนั้น ขณะที่ [owner.GetSheHe] เอื้อมมือไปที่เข็มขัด [owner.GetHerHis] ข้าถอยหลังไปก้าวหนึ่ง แต่ก่อนที่ข้าจะมีเวลาทำอะไร [owner.GetSheHe] ก็เข้ามาประชิดตัวข้า พร้อมมีดในมือ"
 intrigue_scheme_ongoing.5023.a:0 "[ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('owner'))|U] โปรด– อั่ก!"

 intrigue_scheme_ongoing.5024.t:0 "การเฉลิมฉลองใน [province.GetNameNoTooltip|U]"
 intrigue_scheme_ongoing.5024.desc:0 "[agent.GetTitledFirstName] บอกข้าว่างานเฉลิมฉลองท้องถิ่นใน [province.GetName] บ้านเกิดของ [target.GetTitledFirstName] กำลังประสบปัญหาด้านการเงิน\n\n"หากจัดขึ้น มันจะดึงดูดผู้คนจำนวนมาก ทั้งสูงและต่ำ มายังพื้นที่นี้ เป็นโอกาสอันดีสำหรับการแทรกซึม!""
 intrigue_scheme_ongoing.5024.a:0 "นี่ รับไป ทำให้แน่ใจว่ามันถูกจัดขึ้น"
 intrigue_scheme_ongoing.5024.b:0 "ข้าจะไม่เสียเงินไปกับ [target.GetHerHim]!"

 intrigue_scheme_ongoing.5026.t:0 "มือที่ช่วยเหลือ"
 intrigue_scheme_ongoing.5026.desc:0 "เช่นเดียวกับชาว [target.GetFaith.GetAdherentNamePluralNoTooltip] ทั้งหมด [target.Custom2('MyCharacterIntroduction', ROOT.Char)] แบ่งปันเรื่องราวกับ [target.GetFaith.HighGodName] มากกว่า และโดยนัยคือกับ [court_chaplain.GetTitledFirstName] มากกว่าที่ [target.GetSheHe] แบ่งปันกับมนุษย์ส่วนใหญ่\n\nหากเพียง แต่ข้าสามารถให้ [court_chaplain.GetCouncilTitle] ถ่ายทอดความกลัวและแผนการบางอย่างของ [target.GetTitledFirstNamePossessiveNoTooltip] มาให้ข้าได้...!"
 intrigue_scheme_ongoing.5026.a:0 ""มันเพื่อประโยชน์ของศรัทธา!""
 intrigue_scheme_ongoing.5026.a.success:0 "[court_chaplain.GetSheHe|U] ช่วยข้า"
 intrigue_scheme_ongoing.5026.a.failure:0 "[court_chaplain.GetSheHe|U] ปฏิเสธ"
 intrigue_scheme_ongoing.5026.a_gregarious:0 ""ไปเดินเล่นกันเถอะ""
 intrigue_scheme_ongoing.5026.a_gregarious_tt:0 "[court_chaplain.GetSheHe|U] จะไม่ทันสังเกตด้วยซ้ำว่า [court_chaplain.GetSheHe] บอก #EMP ทุกอย่าง#! กับข้า"
 intrigue_scheme_ongoing.5026.b_agent:0 ""ท่านตกลงที่จะช่วยข้าแล้ว ดังนั้น...""
 intrigue_scheme_ongoing.5026.b:0 ""แต่ตามที่ [target.GetFaith.HighGodName] กล่าวไว้...""
 intrigue_scheme_ongoing.5026.b_scholar:0 ""มาดูกันว่า [target.GetFaith.HighGodName] ต้องการอะไร""
 intrigue_scheme_ongoing.5026.b_scholar_tt:1 "ช่างบังเอิญอะไร เช่นนี้ที่มันจะเป็นสิ่งเดียวกับที่ข้าต้องการ!"
 intrigue_scheme_ongoing.5026.c:0 "นั่นเป็นเรื่องระหว่าง [target.GetHerHim] กับ [target.GetFaith.PantheonTerm]"

 intrigue_scheme_ongoing.3010.t:0 "[scheme.GetNameNoTooltip]: ความลับภาษา [target.GetCulture.GetLanguage.GetNameNoTooltip]"
 intrigue_scheme_ongoing.3010.desc:0 "ในฐานะส่วนหนึ่งของแผนการต่อเนื่องของข้าที่จะ [scheme.GetNameNoTooltip|l] [target.GetTitledFirstName] ลูกน้องบางคนของข้าดักจับจดหมาย [target.GetHerHis] เป็นประจำ เนื่องจากความเข้าใจภาษา [target.GetCulture.GetLanguage.GetName] อย่างเชี่ยวชาญของข้า ข้าสามารถอ่านมันด้วยตนเองได้ แทนที่จะต้องพึ่งพาการแปลมือสอง แม้ว่ามันจะกินเวลาจากหน้าที่บางอย่างของข้าไปอย่างแน่นอน\n\nบางทีข้าอาจจะได้รับข้อมูลเชิงลึกอันมีค่าด้วยวิธีนี้?"
 intrigue_scheme_ongoing.3010.a:0 "ข้าจะแปลภาษา [target.GetCulture.GetLanguage.GetNameNoTooltip] ด้วยตนเอง"
 intrigue_scheme_ongoing.3010.b:0 "ฟังดูเหมือนเป็นงานที่หนักเกินไปสำหรับข้า"

 intrigue_scheme_ongoing.3011.t:0 "[scheme.GetNameNoTooltip]: รหัส [language_culture.GetLanguage.GetNameNoTooltip]-[language_culture_2.GetLanguage.GetNameNoTooltip]-[multilingual_agent.GetCulture.GetLanguage.GetNameNoTooltip]"
 intrigue_scheme_ongoing.3011.desc:0 "ในแผนการของข้าที่จะ [scheme.GetNameNoTooltip|l] [target.GetTitledFirstName] ข้าได้ขอความช่วยเหลือจาก [multilingual_agent.GetName] ซึ่งปรากฏว่าเป็นเหมือนสารานุกรมในเรื่องภาษา [multilingual_agent.GetSheHe] ใช้ความรู้ [multilingual_agent.GetHerHis] อันกว้างขวางเกี่ยวกับภาษาถิ่นหลายภาษา สร้างรหัส ซึ่ง [multilingual_agent.GetSheHe] อ้างว่า 'ถอดไม่ได้'\n\n"ไม่เพียง แต่จะต้องใช้นักถอดรหัสระดับปรมาจารย์เท่านั้น: พวกเขายังต้องเข้าใจความละเอียดอ่อนของไวยากรณ์ภาษา [language_culture_2.GetLanguage.GetNameNoTooltip] รายละเอียดของสุภาษิตภาษา [language_culture.GetLanguage.GetNameNoTooltip] ทั้งหมดนี้โดยคำนึงถึงโครงสร้างคำภาษา [multilingual_agent.GetCulture.GetLanguage.GetNameNoTooltip]""
 intrigue_scheme_ongoing.3011.a:0 "ความคิดริเริ่มที่ยอดเยี่ยม"
 intrigue_scheme_ongoing.3011.b:0 "ดูเหมือนเป็นการเสียเวลา"
