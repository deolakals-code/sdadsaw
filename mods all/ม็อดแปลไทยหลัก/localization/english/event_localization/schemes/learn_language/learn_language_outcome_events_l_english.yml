l_english: 
 learn_language_outcome.1000.t:1 "$learn_language$: สำเร็จ!"
 learn_language_outcome.1000.desc:3 "หลังจากพากเพียรอย่างหนัก ในที่สุดข้าก็เรียนรู้ภาษา [scheme.GetTargetCharacter.GetCulture.GetLanguage.GetName] ได้สำเร็จ! ชั่วโมงอันไม่รู้จบในการฝึกฝนการเน้นเสียง คืนที่อดนอนเพื่อเลียนแบบการผันเสียง บทเรียนนับไม่ถ้วนในการฝึกฝนการออกเสียงสูงต่ำ... ทั้งหมดนี้คุ้มค่าในท้ายที่สุด\n\nในระหว่างความพยายาม ข้าได้พยายามเลียนแบบสำเนียงของ[target.GetTitledFirstNamePossessive] — ข้ามั่นใจว่า[target.GetSheHe]จะต้องประทับใจกับผลลัพธ์ของข้า!\n\nและแน่นอนว่า บัดนี้เหล่าไพร่ชาว[target.GetCulture.GetNameNoTooltip]ก็เคารพข้ามากขึ้นอย่างมาก"
 learn_language_outcome.1000.a:0 "ข้ารู้สึกสำเร็จลุล่วง!"
 learn_language_outcome.1000.b:3 "บางทีข้าควรส่งจดหมายเป็นภาษา [scheme.GetTargetCharacter.GetCulture.GetLanguage.GetNameNoTooltip] ไปให้ [target.GetFirstNameNoTooltip]?"
 learn_language_outcome.1000.b.success:4 "ข้าสร้างความประทับใจให้ [target.GetFirstNameNoTooltip] ด้วยความรู้ของข้า"
 learn_language_outcome.1000.b.failure:4 "จดหมายของข้าถูกมองว่าเป็นการเยาะเย้ยที่ไม่จริงใจ"
 target_responds:0 "[target.GetTitledFirstName] ตอบจดหมายของท่าน"
 
 learn_language_outcome.1001.opening:0 "[owner.Custom2('AppropriateGreetingPositive', target)]"
 learn_language_outcome.1001.desc:5 "ข้าได้ศึกษาภาษา [target.GetCulture.GetLanguage.GetName] มาหลายเพลาแล้ว ข้าได้เขียนสาส์นฉบับนี้ด้วยตนเองโดยใช้อักษร [target.GetCulture.GetLanguage.GetNameNoTooltip] — จดหมายแห่งมิตรภาพจากผู้พูดภาษา [owner.GetCulture.GetLanguage.GetName]!\n\nข้าปรารถนาให้การทูตในอนาคตของเราเป็นประโยชน์อย่างยิ่งต่อเราทั้งสองฝ่าย!"
 learn_language_outcome.1001.a:4 "[owner.GetSheHe|U] เรียนรู้ภาษา [target.GetCulture.GetLanguage.GetNameNoTooltip] รึ? น่าประทับใจ ส่งความนับถือของข้าไปด้วย!"
 learn_language_outcome.1001.b:0 "ฮ่า! ความพยายามอันไร้สาระของ[owner.GetHerHis|U]ในการแสวงหาชื่อเสียงช่างน่าหัวเราะ!"
 
 learn_language_outcome.2000.t:1 "$learn_language$: ล้มเหลว"
 learn_language_outcome.2000.desc:3 "หลังจากพากเพียรอย่างหนัก... ไม่มีอะไรเลย! มัน #EMP เป็นไปไม่ได้#! ที่จะเรียนรู้ภาษา [scheme.GetTargetCharacter.GetCulture.GetLanguage.GetName] ไม่ว่าข้าจะพยายามหนักเพียงใด ข้าก็พูดเหมือนทารกที่เพิ่งหย่านมและเขียนเหมือนทาสติดที่ดินตาบอดที่ไม่รู้หนังสือ ซึ่งนิ้วขาดหายไปเกือบหมด!\n\nบาห์! นี่เป็นการเสียเวลาเปล่า..."
 learn_language_outcome.2000.a:3 "ข้ายอมรับความพ่ายแพ้... ภาษา [scheme.GetTargetCharacter.GetCulture.GetLanguage.GetNameNoTooltip] เกินความสามารถของข้า"
 learn_language_outcome.2000.b:0 "ไม่! ข้าต้องเริ่มต้นใหม่ และ ทำให้ถูกต้องในครั้งนี้"
 learn_language_outcome.2000.c:0 "เอาล่ะ อย่างน้อยข้าก็ได้เรียนรู้มารยาทที่มีประสิทธิภาพมาก!"
 scheme_loses_half_progress:0 "[scheme|E] สูญเสียความคืบหน้าไปครึ่งหนึ่ง แต่ยังคงดำเนินต่อไป"
 
 learn_language_outcome.3000.t:1 "$learn_language$: เริ่มศึกษาต่อหรือไม่?"
 learn_language_outcome.3000.desc:4 "น่าเสียดายที่ [target.GetTitledFirstName] ไม่อยู่แล้ว ช่างน่าเสียดาย ข้ากำลังมองหา[target.GetHerHim]เพื่อเป็นแบบอย่างในการออกเสียงสำเนียงขณะเรียนภาษา [target.GetCulture.GetLanguage.GetName]\n\nอย่างไรก็ตาม ไม่จำเป็นต้องหยุดการศึกษาของข้า — ข้าเพียงแค่ต้องหาคนอื่นมาเลียนแบบ!"
 learn_language_outcome.3000.a:0 "[potential_continuation_target_1.GetTitledFirstNameNoTooltip] มีสำเนียงที่ไพเราะ!"
 learn_language_outcome.3000.b:0 "บางทีอาจจะเป็น [potential_continuation_target_2.GetTitledFirstNameNoTooltip]? สำเนียงถิ่นของ[potential_continuation_target_2.GetHerHis|U]น่าสนใจ"
 learn_language_outcome.3000.c:0 "อาจจะเป็น [potential_continuation_target_3.GetTitledFirstNameNoTooltip]?"
 learn_language_outcome.3000.d:0 "อา ข้ากำลังหาเหตุผลที่จะหยุดเรียนอยู่พอดี! ไชโย!"
 scheme_retains_progress:0 "[scheme|E] ยังคงรักษาความคืบหน้าก่อนหน้านี้ทั้งหมดไว้"
 
 child_learned_language_title:0 "[owner.Custom('GetDaughterSon')|U] เรียนรู้ภาษาสำเร็จ!"
 child_learned_language_desc:0 "[owner.Custom('GetDaughterSon')]ของท่านเรียนรู้ภาษา [target.GetCulture.GetLanguage.GetName] [language|E] สำเร็จแล้ว"
 child_learned_language_fail_title:0 "[owner.Custom('GetDaughterSon')|U] ล้มเหลวในการเรียนรู้ภาษา"
 child_learned_language_fail_desc:0 "[owner.Custom('GetDaughterSon')]ของท่านล้มเหลวในการเรียนรู้ภาษา [target.GetCulture.GetLanguage.GetName] [language|E]"
 child_learned_language_invalidated_title:0 "แผนการเรียนรู้ภาษาของบุตรหลานท่านถูก ทำให้เป็นโมฆะ"
 child_learned_language_invalidated_desc:0 "แผนการ [GetScheme('learn_language').GetTypeName] [scheme|E] ของบุตรหลานท่านถูก ทำให้เป็นโมฆะ"
