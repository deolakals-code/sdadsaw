l_english: 
 learn_language_ongoing.1200.t:1 "$learn_language$: ปัญหาจากเจ้าสี่ขา"
 learn_language_ongoing.1200.desc:3 "ในความพยายามของข้าพเจ้าที่จะเรียนรู้ภาษา [scheme.GetTargetCharacter.GetCulture.GetLanguage.GetNameNoTooltip] ข้าพเจ้าจดบันทึกไว้มากมาย เนื่องจากมันมักจะมากเกินกว่าจะจำไว้ในหัวได้หมด แต่บัดนี้ เมื่อข้าพเจ้าต้องการมัน ข้าพเจ้ากลับหามันไม่พบอีกต่อไป! การค้นหาอย่างรวดเร็ว ทำให้ข้าพเจ้าไม่รู้เลยว่ามันอยู่ที่ใด\n\nขณะที่ข้าพเจ้าหันกลับไป ข้าพเจ้าพบว่าตนเองกำลังมองลงไปยัง [ROOT.Char.Custom('DogStoryName')] ซึ่งกำลังกระดิกหางของ [ROOT.Char.Custom('DogStoryHerHis')] และมีความสุขราวกับ [ROOT.Char.Custom('GetAnimalType')] ข้าพเจ้าใช้เวลาครู่หนึ่งก่อนที่จะตระหนักว่า [ROOT.Char.Custom('DogStorySheHe')] กำลังคาบบันทึกทั้งหมดของข้าพเจ้าไว้อย่างแน่นหนาในระหว่างฟันของ [ROOT.Char.Custom('DogStoryHerHis')]..."
 learn_language_ongoing.1200.a:0 "ข้าพเจ้าโกรธเจ้าไม่ลงจริงๆ!"
 learn_language_ongoing.1200.b:0 "เจ้าอยากไปเดินเล่นหรือไม่? มาสิ"
 learn_language_ongoing.1200.c:0 "นั่นไม่ใช่ของเล่น! #EMP แย่#! มาก เจ้าหมา!"
