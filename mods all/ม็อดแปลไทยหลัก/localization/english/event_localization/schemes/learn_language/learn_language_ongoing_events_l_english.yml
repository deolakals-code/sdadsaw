 own_court_language_scheme_key_no_tt:1 "[ROOT.GetScheme.GetOwner.GetCourtLanguage.GetNameNoTooltip]"
 liege_court_language_scheme_key_no_tt:1 "[ROOT.GetScheme.GetOwner.GetLiege.GetCourtLanguage.GetNameNoTooltip]"
 target_character_language_scheme_key_no_tt:1 "[ROOT.GetScheme.GetTargetCharacter.GetCulture.GetLanguage.GetNameNoTooltip]"

 learn_language_ongoing.1000.t:1 "$learn_language$: ความง่ายดายแห่งวัยเยาว์"
 learn_language_ongoing.1000.desc:3 "การศึกษาภาษา [scheme.GetTargetCharacter.GetCulture.GetLanguage.GetName] ของข้าก้าวหน้าไปอย่างน่าอัศจรรย์ — ข้ารู้สึกราวกับว่าข้ามีสมาธิและพลังงานทั้งหมดในโลก!\n\n"ข้า... ชื่อ... คือ... [fast_learner.GetFirstNameNoTooltip]!"\n\n"ข้า... ชอบ... กิน... [fast_learner.Custom('FavoriteTreatDemand')]!"\n\nหากข้าเพียงแค่ #EMP ตั้งใจให้มากขึ้น#! ข้าจะพูดได้อย่างคล่องแคล่วในไม่ช้า!"
 learn_language_ongoing.1000.a:0 "ข้าจะอุทิศเวลา #EMP ทั้งหมด#! ให้กับสิ่งนี้!"
 learn_language_ongoing.1000.b:0 "ข้าอยากใช้เวลาไปกับเรื่องอื่นมากกว่า..."
 
 learn_language_ongoing.1010.t:1 "$learn_language$: ความเข้าใจผิดเชิงชู้สาว"
 learn_language_ongoing.1010.desc:4 ""-และ ดังนั้น [ROOT.Char.GetTitleTierName] จึงหารือเรื่อง [ROOT.Char.Custom('education_conversation_subject')] กับสภา ในขณะที่ [scheme.GetTargetCharacter.GetCouncillorPosition( 'councillor_steward' ).GetPositionName] ดำเนินการต่อไป..."\n\nข้าเงยหน้าขึ้นอย่างตกใจจากหนังสือภาษา [scheme.GetTargetCharacter.GetCulture.GetLanguage.GetName] เพียงเพื่อสังเกตเห็น [lover_target.GetFirstName] หน้าแดงก่ำกำลังโน้มตัวอยู่เหนือข้า\n\n"โอ้ พระเจ้า นั่นท่านกำลังพูดภาษา #EMP [scheme.GetTargetCharacter.GetCulture.GetLanguage.GetNameNoTooltip]#! หรือ?" [lover_target.GetSheHe] กล่าว\n"ท่านรู้ไหม... ภาษา [scheme.GetTargetCharacter.GetCulture.GetLanguage.GetNameNoTooltip] คือภาษาแห่งรัก — และหากข้าไม่ได้ยินผิดไป ท่านเพิ่งเรียกข้าว่า [lover_target.Custom('RomanticComplimentNoun')] [lover_target.Custom('RomanticComplimentAdjective')] ใช่หรือไม่? ท่านนี่ช่างเป็น [ROOT.Char.Custom('RomanticComplimentNoun')] เสียจริง!""
 learn_language_ongoing.1010.a:0 "...ใช่ ใช่ แน่นอนข้าทำ! นั่นคือสิ่งที่ข้าตั้งใจจะพูด!"
 learn_language_ongoing.1010.b:0 "ไม่ ไม่! ทั้งหมดนี้เป็นความเข้าใจผิด!"
 learn_language_ongoing.1010.c:0 "ไปให้พ้น [lover_target.Custom2('InsultNounSexual', ROOT.Char)] ข้าต้องมีสมาธิ!"
 
 outside_help_modifier:0 "ความช่วยเหลือจากภายนอก"
 learn_language_ongoing.1020.c.success:0 "ท่านเกลี้ยกล่อมให้ [language_helper.GetFirstNameNoTooltip] ช่วยเหลือท่าน"
 learn_language_ongoing.1020.c.failure:0 "[language_helper.GetFirstNameNoTooltip] มองทะลุกลอุบายของท่าน"
 learn_language_ongoing.1020.t_hash_collision:1 "$learn_language$: ความช่วยเหลือจากภายนอก"
 learn_language_ongoing.1020.desc:3 "ดูเหมือนว่าการศึกษาภาษา [scheme.GetTargetCharacter.GetCulture.GetLanguage.GetName] ของข้าได้ไปถึงหูของ [language_helper.GetTitledFirstName] แล้ว [language_helper.GetSheHe|U] เป็นเจ้าของภาษา และเสนอที่จะช่วยข้าในการศึกษา\n\n"ข้าขอเพียงรางวัลเล็กน้อยสำหรับความพยายามของข้า [ROOT.Char.GetTitleTierName]" [language_helper.GetSheHe|U] กล่าว [language_helper.Custom('quirk_pos_pp')]"
 learn_language_ongoing.1020.a:0 "หากท่านช่วย ทองคำนี้จะเป็นของท่าน"
 learn_language_ongoing.1020.b:0 "บุญคุณต้องทดแทน?"
 learn_language_ongoing.1020.c:0 "โอ้ ท่านช่าง #EMP ไม่เห็นแก่ตัว#! ที่เสนอจะช่วยข้า โดยไม่คิดค่าตอบแทน!"
 learn_language_ongoing.1020.d:0 "ขอบคุณ แต่ข้าจัดการเองได้"
 
 learn_language_ongoing.1020.b.success:0 "[chosen_peasant.GetFirstName] รับข้อตกลง"
 learn_language_ongoing.1020.b.failure:0 "[chosen_peasant.GetFirstName] รู้สึกขุ่นเคืองกับข้อเสนอของท่าน"
 gain_artifact_tt:0 "ท่านได้รับ [newly_created_artifact.GetName] [artifact|E]"
 steal_artifact_tt:0 "ท่านขโมย [newly_created_artifact.GetName] [artifact|E]"
 learn_language_ongoing.1030.t:1 "$learn_language$: คู่มือเก่าคร่ำคร่า"
 learn_language_ongoing.1030.desc:3 "[chosen_peasant.GetTitledFirstName] เข้ามาหาข้า [chosen_peasant.Custom('quirk_pos_pp')]\n\n"[ROOT.Char.Custom('FormOfAddressForLiege')|U] ข้าได้ยินมาว่าท่านกำลังศึกษาภาษา[scheme.GetTargetCharacter.GetCulture.GetLanguage.GetName] บิดาของข้าเคยเป็นพ่อค้า และเขาสามารถเรียนรู้ภาษาใดก็ได้ในเวลาอันรวดเร็ว!" [chosen_peasant.GetSheHe] กล่าว\n\n"เคล็ดลับของเขาอยู่ในคู่มือเล่มนี้ ข้ามิได้ใช้ประโยชน์อันใดจากมัน เพราะข้าอ่านไม่ออก ข้ายินดีจะขายมันให้ในราคายุติธรรม""
 learn_language_ongoing.1030.a:0 "น่าสนใจ ข้ายินดีจ่าย"
 learn_language_ongoing.1030.b:0 "บางทีสิ่งที่ท่านขอก็... สูงไปหน่อย"
 learn_language_ongoing.1030.c:0 "ของขวัญชั้นดี! ทหาร จง ทำให้ [chosen_peasant.GetHerHim] ส่งมอบมันมา"
 learn_language_ongoing.1030.d:0 "ไร้สาระ! ออกไปให้พ้น เจ้าคนหลอกลวง!"
 
 learn_language_ongoing.1040.t:1 "$learn_language$: ความชื่นชม"
 learn_language_ongoing.1040.desc:3 "[target.GetTitledFirstName] ผู้ ซึ่งข้าพยายามเอาเยี่ยงอย่างในการเรียนรู้ภาษา [scheme.GetTargetCharacter.GetCulture.GetLanguage.GetName] ได้เริ่มส่งจดหมายโต้ตอบมาหาข้าเมื่อไม่นานมานี้\n\nข้าได้รับจดหมายหลายฉบับที่ [target.GetSheHe] ยกย่องความพยายามของข้าในการเรียนรู้ภาษาของ [target.GetHerHis] โดยเรียกมันว่าน่าเคารพและน่าชื่นชม!\n\nรู้สึกดีที่ได้รับการยอมรับในความพยายามอย่างหนักของข้า!"
 learn_language_ongoing.1040.a:0 "อาลักษณ์! ส่งข่าวตอบกลับแสดงความขอบคุณของข้า"
 learn_language_ongoing.1040.b:0 "ลายมือของ [target.GetFirstNamePossessiveNoTooltip] น่าสนใจ..."
 learn_language_ongoing.1040.c:0 "บ๊ะ! ข้าไม่ต้องการการยอมรับจากใครนอกจาก #EMP ตัวข้าเอง!#!"
 
 extra_success_chance_modifier:0 "เพิ่มโอกาสสำเร็จ"
 massive_extra_success_chance_modifier: "เพิ่มโอกาสสำเร็จอย่างมหาศาล"
 tutorial_success_chance_modifier: "$extra_success_chance_modifier$"
 learn_language_ongoing.1050.t:1 "$learn_language$: รอยตีนกา"
 learn_language_ongoing.1050.desc:3 "บันทึกภาษา [scheme.GetTargetCharacter.GetCulture.GetLanguage.GetName] อันล้ำค่าของข้ากระจัดกระจายไปทั่วห้องทำงาน และอีกาที่เปียกโชกไปด้วยหมึกก็ #EMP ยังคง#! กระพือปีกไปทั่ว! มันเข้ามาได้อย่างไร? #EMP ใครเอามันไปชุบหมึก!?#!\n\n"จดหมายถึงท่าน [ROOT.Char.GetTitleTierName]" ข้าหันกลับไปและฉวยข้อความจากมือคนรับใช้\n\n"น่าเสียดายจริงๆ กับสิ่งที่เกิดขึ้นกับบันทึกของท่าน — แต่ในแง่ดี ลายมือของท่านก็คล้ายกับรอยตีนกาอยู่แล้ว! ด้วยความเคารพ [sabotage_rival.GetTitledFirstName]""
 learn_language_ongoing.1050.a:0 "บันทึกของข้า... ไม่! งานหนักมากมาย สูญเปล่า!"
 learn_language_ongoing.1050.b:0 "[sabotage_rival.GetTitledFirstNameNoTooltip] สมควร #EMP ตาย!#!"
 learn_language_ongoing.1050.c:0 "ฮ่า-ฮ่า! ข้าเก็บ #EMP บันทึกสำรอง#! ไว้เสมอ!"
 
 learn_language_ongoing.1060.t:1 "$learn_language$: สูญหายในการแปล"
 learn_language_ongoing.1060.desc:3 "...นักเล่นแร่แปรธาตุเอื้อมมือไปหยิบ [target.Custom('RandomWeirdObject')] ขณะที่ [target.Custom('lowly_servant_type')] มองดูด้วยความหวาดกลัว จากนั้น-" ทันใดนั้นข้าก็ถูกขัดจังหวะโดย [offended_character.GetTitledFirstName] ที่กำลังเดือดดาล\n\n"เจ้าเพิ่งเรียก [offended_character.Custom('MotherFather')] อันเป็นที่รักของข้าว่า [offended_character.Custom2('InsultNoun', SCOPE.sC('offended_character'))] และ [offended_character.Custom2('InsultNounSexual', SCOPE.sC('offended_character'))] รึ!?" [offended_character.GetSheHe] กรีดร้อง "ข้าต้องการค่าชดเชยสำหรับการดูหมิ่นอันร้ายแรงนี้!"\n\nบางทีภาษา[scheme.GetTargetCharacter.GetCulture.GetLanguage.GetName]ของข้าคงต้องฝึกฝนเพิ่มเติมเสียแล้ว..."
 learn_language_ongoing.1060.a:0 "ข้าขออภัยอย่างสุดซึ้ง! หวังว่านี่จะเพียงพอ"
 learn_language_ongoing.1060.b:2 "โอ้ ท่านฟังผิดไป! ข้าเรียก [offended_character.GetHerHim] ว่า #EMP [offended_character.Custom('RomanticComplimentNoun')]#! #EMP [offended_character.Custom('ComplimentAdjective')]#! ต่างหาก!"
 learn_language_ongoing.1060.c:0 "ฮ่า! ใช่ ข้าพูด และ[offended_character.GetSheHe]ยังเป็น#[offended_character.Custom2('InsultAdjective', ROOT.Char)]!#! อีกด้วย!"
 learn_language_ongoing.1060.d:4 "ข้าแค่กำลังฝึกภาษา [scheme.GetTargetCharacter.GetCulture.GetLanguage.GetNameNoTooltip]! ข้าพูดผิดไป!"
 extra_careful_modifier:0 "ระมัดระวังเป็นพิเศษ"
 carefully_chosen_words_modifier:0 "ถ้อยคำที่เลือกสรรมาอย่างดี"
 learn_language_ongoing.1060.b.success:0 "ท่านหลอกให้ [offended_character.GetHerHim] คิดว่าท่าน #EMP ยกย่อง#! [offended_character.Custom('MotherFather')] ของ [offended_character.GetHerHis]"
 learn_language_ongoing.1060.b.failure:0 "[offended_character.GetFirstNameNoTooltip] มองทะลุคำโกหกของท่าน"
 learn_language_ongoing.1060.d.success:0 "ท่านอธิบายได้สำเร็จว่าเป็นความเข้าใจผิด"
 learn_language_ongoing.1060.d.failure:0 "[offended_character.GetFirstNameNoTooltip] ไม่เชื่อท่าน"
 
 learn_language_ongoing.1070.t:1 "$learn_language$: วรรณกรรมเสเพล"
 learn_language_ongoing.1070.desc:3 "ขณะที่ข้ากำลังอ่านออกเสียงจากหนังสือภาษา[scheme.GetTargetCharacter.GetCulture.GetLanguage.GetName] ที่ [target.GetTitledFirstName] ส่งมาให้ข้าเมื่อครู่ ข้าสังเกตเห็นเหล่าคนรับใช้พากันหัวเราะคิกคัก...\n\n"ได้โปรด อย่าหยุดอ่าน!" เหล่าคนรับใช้หัวเราะร่วน\n"[ROOT.Char.GetSheHe|U] กำลังจะแสดง [ROOT.Char.Custom('ObjectifiedFeature')] ของ[ROOT.Char.GetHerHis] แล้ว! พวกเราต้องรู้ให้ได้ว่า [ROOT.Char.GetTitleTierName] กับ [target.Custom('lowly_servant_type')] จะได้ลงเอยกันหรือไม่ หรือว่า[target.Custom2('InsultNounSexual', ROOT.Char)]นั่นจะเข้ามาขวางระหว่างพวกเขอีก!"\n\nนี่ข้ากำลังอ่าน... #EMP เรื่องลามกอนาจาร?#! [ROOT.Char.Custom('CulturalCurse')|U]"
 learn_language_ongoing.1070.a:0 "ทหาร กำจัดหนังสือบ้าๆ นี่ให้พ้นจากข้า!"
 learn_language_ongoing.1070.b:0 "เจ้ากล้าหัวเราะเยาะข้ารึ!? #EMP เฆี่ยนพวกมันทั้งหมด.#!"
 learn_language_ongoing.1070.c:0 "โอ้ เอาเถอะ ข้าคิดว่ามัน #EMP ก็#! ให้ความรู้ ในแง่หนึ่ง..."
 erotic_novel_connoisseur_modifier:0 "ผู้เชี่ยวชาญนวนิยายอีโรติก"
 lauded_loud_reader_modifier:0 "นักอ่านเสียงดังผู้ได้รับการยกย่อง"
 lauded_loud_reader_modifier_desc:0 "ตัวละครนี้ได้ให้ความบันเทิงแก่ราชสำนักด้วยการอ่านออกเสียงที่ 'น่าสนใจ'"
 
 learn_language_ongoing.1080.t:1 "$learn_language$: ได้รับบทเรียน"
 learn_language_ongoing.1080.desc:5 "พระอาจารย์ในราชสำนักของข้า [court_tutor.GetFirstName] ได้ช่วยเหลือข้าทั้งวันทั้งคืนในความพยายามที่จะเรียนรู้ภาษา [scheme.GetTargetCharacter.GetCulture.GetLanguage.GetName]\n\nความทุ่มเทของ [court_tutor.GetHerHis|U] ต่องานสอนนั้นเป็นแรงบันดาลใจ — ไม่มีวันใดที่ข้าจะไม่ได้รับจดหมายภาษา [scheme.GetTargetCharacter.GetCulture.GetLanguage.GetNameNoTooltip] มาอ่าน ได้สนทนากับ [ROOT.Char.GetWomanMan] ผู้มีการศึกษาชาว [scheme.GetTargetCharacter.GetCulture.GetNameNoTooltip] หรือได้รับบทกลอนช่วยจำที่ไม่ธรรมดา\n\nแท้จริงแล้ว ข้าคงไม่ก้าวหน้ามาถึงเพียงนี้หากปราศจากความช่วยเหลือของ [court_tutor.GetFirstNamePossessiveNoTooltip]"
 learn_language_ongoing.1080.a:0 "[court_tutor.GetFirstNameNoTooltip] ท่านสมควรได้รับรางวัล!"
 learn_language_ongoing.1080.b:0 "[court_tutor.GetSheHe|U] ทำหน้าที่ของ [court_tutor.GetHerHis] ได้ดี"
 attended_by_tutor_modifier:0 "ดูแลโดยพระอาจารย์ในราชสำนัก"
 court_tutor_child_language_rank_1_modifier:0 "$attended_by_tutor_modifier$"
 court_tutor_child_language_rank_2_modifier:0 "$attended_by_tutor_modifier$"
 court_tutor_child_language_rank_3_modifier:0 "$attended_by_tutor_modifier$"
 court_tutor_child_language_rank_4_modifier:0 "$attended_by_tutor_modifier$"
 court_tutor_child_language_rank_5_modifier:0 "$attended_by_tutor_modifier$"
 
 learn_language_ongoing.1090.t:1 "$learn_language$: ไม่มีที่ว่างเหลือ"
 learn_language_ongoing.1090.desc:3 "การเรียนรู้ภาษา [scheme.GetTargetCharacter.GetCulture.GetLanguage.GetName] นั้นยาก ยากจริงๆ\n\nข้ารู้สึกเหมือนไม่มีที่ว่างเหลือในหัวข้าอีกแล้ว มันเต็มไปหมด ทันทีที่คำหนึ่งเข้ามาในใจ อีกคำหนึ่งก็ตกลงไปในห้วงแห่งความหลงลืม ข้าดิ้นรนกับทุกบทเรียน ข้าไม่ก้าวหน้าเลยแม้ แต่น้อย"
 learn_language_ongoing.1090.friend.desc:0 "\n\nโชคดีที่ [helpful_friend.GetTitledFirstName] อยู่เคียงข้างข้าเสมอ\n"สู้ต่อไป สหาย [ROOT.Char.Custom('ComplimentAdjective')] ของข้า ข้าเชื่อในตัวท่าน!" [helpful_friend.GetSheHe] กล่าวอยู่เสมอ ข้าช่างโชคดีจริงๆ"
 learn_language_ongoing.1090.no_friend.desc:0 "\n\nบางทีข้าอาจต้องการพักผ่อน?"
 learn_language_ongoing.1090.a:0 "ข้าสามารถพึ่งพา [helpful_friend.GetFirstNameNoTooltip] เพื่อรับการสนับสนุนได้เสมอ!"
 learn_language_ongoing.1090.b:0 "ไม่ว่าจะยากเพียงใด ข้าต้องอดทน!"
 learn_language_ongoing.1090.c:0 "ข้าต้องการพักผ่อน..."
 encouraged_by_friend_modifier:0 "ได้รับการสนับสนุนจากสหาย"
 learn_language_ongoing.1100.t:1 "$learn_language$: [ROOT.Char.GetTitleTierName] ผู้ใส่ใจ"
 learn_language_ongoing.1100.desc:3 "ไม่ใช่ความลับที่ข้ากำลังทำงานอย่างหนักเพื่อเรียนรู้ภาษา [scheme.GetTargetCharacter.GetCulture.GetLanguage.GetName] และดูเหมือนว่ามันกำลังกลายเป็นที่รู้กันทั่วไปในหมู่ชาวนา [target.GetCulture.GetNameNoTooltip]\n\nพวกเขาเรียกข้าว่า '[ROOT.Char.GetTitleTierName] ผู้ใส่ใจ' ซึ่งเป็นเรื่องที่น่าปลาบปลื้มอย่างแท้จริง แม้ แต่ขุนนางระดับล่างก็ยังยกย่องความพยายามของข้า!\n\nข้ารู้สึกว่าความพยายามของข้าได้นำพา [ROOT.Char.GetCulture.GetCollectiveNounNoTooltip] และ [target.GetCulture.GetCollectiveNounNoTooltip] ให้ใกล้ชิดกันมากขึ้น"
 learn_language_ongoing.1100.a:3 "บางทีข้าควรกล่าวสุนทรพจน์ #EMP ทั้ง#! ภาษา [scheme.GetTargetCharacter.GetCulture.GetLanguage.GetNameNoTooltip] และ [ROOT.Char.GetCulture.GetLanguage.GetNameNoTooltip]?"
 learn_language_ongoing.1100.b:0 "ทำให้พวกเขาลืมข้าเสีย ข้าไม่สามารถเสียสมาธิได้"
 learn_language_ongoing.1100.c:0 "นี่เป็นโชคดีอย่างยิ่ง!"
 learn_language_ongoing.1100.a.success:0 "ท่านกล่าวสุนทรพจน์ได้อย่างยอดเยี่ยม"
 learn_language_ongoing.1100.a.failure:0 "ท่าน ทำให้ตัวเองกลายเป็นตัวตลก"
 
 learn_language_ongoing.1110.t:1 "$learn_language$: เสน่ห์แห่งบทกวี"
 learn_language_ongoing.1110.desc:3 "อา '[target.Custom('RegionalDrink')|U] ริมทะเลสาบ' โดย [the_poet.GetFirstName] แห่ง [poet_location.GetNameNoTierNoTooltip] ช่างเป็นรวมบทกวีภาษา [scheme.GetTargetCharacter.GetCulture.GetLanguage.GetName] ที่ยอดเยี่ยมจริงๆ!\n\n#POE [ROOT.Char.Custom('GeneratePoem_Title')]#!\n[ROOT.Char.Custom('GeneratePoem_Intro_Rhyming')]\n[ROOT.Char.Custom('GeneratePoem_Outro_Rhyming')]\n\nบางทีข้าควรลอง แต่งบทกวีดูบ้าง?"
 learn_language_ongoing.1110.a:0 "ข้าคิดว่าข้าจะลอง!"
 learn_language_ongoing.1110.b:0 "บางทีข้าควรท่องบทกวี #EMP โรแมนติก#! ให้ [lover_to_be.GetFirstNameNoTooltip] ฟัง?"
 learn_language_ongoing.1110.c:0 "ไม่ ข้ากำลัง #EMP ศึกษา#! ข้าไม่มีเวลาสำหรับกิจกรรมไร้สาระ!"
 poetry_collector_modifier:0 "นักสะสมบทกวี"
 learn_language_ongoing.1110.a.success:0 "ท่านพบว่าตัวเองค่อนข้างมีพรสวรรค์"
 learn_language_ongoing.1110.a.failure:0 "ท่านไม่สามารถสัมผัสคำได้เลยแม้ แต่น้อย"
 
 learn_language_ongoing.1120.t:1 "$learn_language$: นิทานเด็กน้อย"
 learn_language_ongoing.1120.desc:3 ""[ROOT.Char.Custom('GetAnimalType')|U] ผู้ชาญฉลาดจึงกล่าวกับ [ROOT.Char.Custom('GirlBoy')] น้อยว่า — ระวังให้ดี เพราะมี..." ทันใดนั้นข้าก็ถูกขัดจังหวะ\n\n"อะไรนะ!? [ROOT.Char.GetTitleTierName] ผู้ยิ่งใหญ่กำลังอ่าน #EMP นิทานเด็ก!#! ท่านไม่มีศักดิ์ศรีหรือ?" [insensitive_asshole.GetTitledFirstName] อุทาน\n"นี่เป็นสิ่งที่ยอมรับไม่ได้! หากศัตรูของท่านพบเรื่องนี้ พวกเขาจะคิดว่าท่านปัญญาอ่อน!"\n\nบางทีการเลือกวรรณกรรมภาษา [scheme.GetTargetCharacter.GetCulture.GetLanguage.GetName] ของข้าอาจจะ... ไม่น่าประทับใจนัก ในสายตาของ [ROOT.Char.Custom('GetCourt')]"
 learn_language_ongoing.1120.a:0 "ไม่! นี่คือ... #EMP วรรณกรรมคลาสสิก [target.GetCulture.GetNameNoTooltip] อันทรงเกียรติ!#! ใช่แล้ว!"
 learn_language_ongoing.1120.b:0 "เจ้ากล้าดูหมิ่นข้ารึ!? ข้าจะแสดงให้เจ้าเห็น!"
 learn_language_ongoing.1120.c:0 "ท่านพูดถูก พวกมันไม่เหมาะกับ [ROOT.Char.GetTitleTierName]"
 learn_language_ongoing.1120.d:0 "ปล่อยให้คนคิดไปตามใจชอบ เรื่องราวเหล่านี้ให้ความรู้!"
 learn_language_ongoing.1120.a.success:0 "ท่านหลอกให้ [insensitive_asshole.GetFirstNameNoTooltip] คิดว่านิทานเหล่านั้นเป็นงานคลาสสิก"
 learn_language_ongoing.1120.a.failure:0 "ท่านเสียสถานะเมื่อการอ่านนิทานของท่านกลายเป็นที่รู้กันทั่วไป"
 easily_read_fables_modifier:0 "นิทานอ่านง่าย"
 seemingly_feeble_minded_modifier:0 "ดูเหมือนปัญญาอ่อน"
 seemingly_feeble_minded_modifier_desc:0 "ตัวละครนี้มักถูกพบเห็นว่ากำลังอ่านนิทานเด็ก ทำให้ดูเหมือนว่าจิตใจของพวกเขายังไม่เติบโตเต็มที่"
 learn_language_ongoing.1120.b.tt:0 "#V ประลอง#! กับ [insensitive_asshole.GetFirstName] เพื่อลงโทษ [insensitive_asshole.GetHerHim] สำหรับความโอหังของ [insensitive_asshole.GetHerHis]!\n#weak การประลองนี้ #EMP ไม่ใช่#! การต่อสู้ถึงตาย#!\nหากท่านชนะ ท่านจะได้รับ [prestige_i] [prestige|E] และ [modifier|E] สำหรับ [scheme|E] หากท่านแพ้ ท่านจะถูกเยาะเย้ย\n\n[prowess|E] ของท่าน: [prowess_i]#V [root_for_loc.GetProwess]#!\n[prowess|E] ของ [insensitive_asshole.GetFirstNamePossessive]: [prowess_i]#V [insensitive_asshole.GetProwess]#!"
 learn_language_ongoing.1121.trigger_failure:0 "การประลองของข้ากับ [insensitive_asshole.GetFirstNameNoTooltip] ถูก ทำให้เป็นโมฆะ"
 learn_language_ongoing.1123.t:0 "$learn_language_ongoing.1120.t$"
 learn_language_ongoing.1123.desc:0 ""ข้ายอมแพ้! โปรดยกโทษให้ข้าด้วย ท่านไม่ได้ปัญญาอ่อนเลย! เพียงไว้ชีวิตข้า!" [insensitive_asshole.GetTitledFirstName] อุทาน\n\nนั่นจะสอนให้ [insensitive_asshole.GetHerHim] รู้ว่าอย่าดูหมิ่น #EMP ข้า#!."
 learn_language_ongoing.1123.a:0 "ดังที่ [ROOT.Char.Custom('GetAnimalType')|U] ผู้ชาญฉลาดเคยกล่าวไว้: "อย่าดูหมิ่นผู้ที่เหนือกว่า!""
 learn_language_ongoing.1123.b:0 "เจ้าจะต้องเน่าเปื่อยในคุกใต้ดินสำหรับความโอหังของเจ้า!"
 learn_language_ongoing.1124.t:0 "$learn_language_ongoing.1120.t$"
 learn_language_ongoing.1124.desc:0 "[insensitive_asshole.GetTitledFirstName] ถ่มน้ำลายลงข้างๆ ที่ท่านนอนอยู่บนพื้น\n\n"เจ้าเป็นข้ออ้างที่อ่อนแอและน่าสมเพชสำหรับ [ROOT.Char.GetTitleTierName] บัดนี้ข้าจะช่วยเจ้าและกำจัดหนังสือไร้สาระเหล่านี้ให้พ้นไป" [insensitive_asshole.GetSheHe] กล่าว"
 learn_language_ongoing.1124.a:0 "ความพ่ายแพ้ในการศึกษาของข้า..."
 
 learn_language_ongoing.1130.t:1 "$learn_language$: รักศัพท์"
 learn_language_ongoing.1130.desc:4 ""โอ้ [ROOT.Char.GetFirstNameNoTooltip] ที่รักของข้า! ท่านกำลังเรียนภาษา [scheme.GetTargetCharacter.GetCulture.GetLanguage.GetName] อันเป็นที่รักของข้าจริงๆ หรือ? ข้ารู้สึกซาบซึ้งใจยิ่งนัก ท่านพยายามอย่างยิ่งที่จะเข้าใจข้า!" [lover_to_help.GetTitledFirstName] กล่าว [lover_to_help.Custom('quirk_pos_pp')]\n\n"ข้าช่วยอะไรท่านได้บ้างไหม? สอนคำศัพท์ให้ท่านบ้าง บางที?" [lover_to_help.GetSheHe] กล่าว"
 learn_language_ongoing.1130.a:0 "ข้ารับความช่วยเหลือทุกอย่างที่ข้าจะได้รับ!"
 learn_language_ongoing.1130.b:0 "ท่านพูดว่า: "พบข้าในห้องนอนของข้า เปลือยกาย" อย่างไร?"
 learn_language_ongoing.1130.c:0 "ขอบคุณ แต่ข้าสบายดี"
 motivated_by_love_modifier:0 "มีแรงจูงใจจากความรัก"
 learn_language_ongoing.1130.a.success:0 "[lover_to_help.GetFirstNameNoTooltip] เป็นครูที่ดี แม้จะเจ้าชู้ไปบ้าง"
 learn_language_ongoing.1130.a.failure:0 "[lover_to_help.GetFirstNameNoTooltip] คิดว่าเป็นการเหมาะสมที่จะ #EMP เริ่ม#! บทเรียนของท่านด้วยคำศัพท์ เช่น 'เกี่ยวกับการเต้นรำ', 'แปลงร่าง' และ 'เศร้าโศก'"
 
 learn_language_ongoing.1140.t:1 "$learn_language$: มือช่วยเหลือ"
 learn_language_ongoing.1140.desc:4 ""ท่านกำลังเรียนภาษา [scheme.GetTargetCharacter.GetCulture.GetLanguage.GetName] ข้าเห็นแล้ว — เป็นทางเลือกที่ดี การพูดภาษานี้จะช่วยเสริมความแข็งแกร่งให้กับตำแหน่งของท่านในฐานะ [ROOT.Char.GetTitleTierName] อย่างแน่นอน" [SCOPE.sC('root_for_loc').Custom2('RelationToMeShort', SCOPE.sC('close_one_to_help'))] ของข้า [close_one_to_help.GetFirstName] อุทาน [close_one_to_help.Custom('quirk_pos_pp')]\n\n"ข้าพูดภาษา [target.GetCulture.GetNameNoTooltip] เป็นภาษาแม่ บางทีข้าอาจจะช่วยเหลือได้ [SCOPE.sC('close_one_to_help').Custom2('RelationToMeShort', SCOPE.sC('root_for_loc'))]?" [close_one_to_help.GetSheHe] กล่าว"
 learn_language_ongoing.1140.a:0 "ท่านช่วยข้าทำความเข้าใจประโยคนี้ได้หรือไม่?"
 learn_language_ongoing.1140.b:0 "ท่านต้องการเข้าร่วมบทเรียนของข้า ตั้งแต่นี้ไปหรือไม่?"
 helpful_assistance_modifier:0 "ความช่วยเหลือที่เป็นประโยชน์"

 learn_language_ongoing.1300.t:0 "$learn_language$: การพูดคุยที่น่าพอใจ"
 learn_language_ongoing.1300.desc:0 "ขณะที่เราผ่าน [ROOT.Char.GetCurrentLocation.GetTitle.GetName] ชาวบ้านที่ร่าเริงคนหนึ่งเข้ามาหาคณะผู้ติดตามของข้า รอยยิ้มของ [interlocutor.GetHerHis] กว้างจนถึงหู ข้าพอจะเข้าใจได้ว่า [interlocutor.GetSheHe] กำลังกล่าวต้อนรับอย่างอบอุ่น แต่รายละเอียดปลีกย่อยในคำพูดของ [interlocutor.GetHerHis] นั้นน่าเสียดายที่ข้าไม่เข้าใจ\n\nถึงกระนั้น ข้าก็โบกมือให้สหายผู้เอาใจใส่ของข้าออกไปและตอบรับคำทักทายอันสนุกสนานของ [interlocutor.GetHerHis] — ข้าแทบจะนึกภาพโอกาสที่ดีกว่านี้ในการฝึกฝนภาษา [interlocutor.GetCulture.GetLanguage.GetName] ของข้าไม่ออก!"
 learn_language_ongoing.1300.a:0 "ให้เราสนทนากันอย่างน่าพอใจเถิด"
 learn_language_ongoing.1300.a.flavor:0 "ท่านพยายามสนทนาเกี่ยวกับความคล้ายคลึงและความแตกต่างระหว่างภาษา [ROOT.Char.GetCulture.GetLanguage.GetNameNoTooltip] และ [interlocutor.GetCulture.GetLanguage.GetNameNoTooltip]"
 learn_language_ongoing.1300.b:0 "วันนี้ข้ารู้สึก #EMP อยากโต้เถียง#! เป็นพิเศษ..."
 learn_language_ongoing.1300.b.flavor:0 "ท่านพยายามชวน [interlocutor.GetFirstNameNoTooltip] โต้เถียงอย่างเป็นมิตร"
 learn_language_ongoing.1300.b.success:0 "ท่านมีการโต้เถียงที่น่าสนใจกับ [interlocutor.GetFirstNameNoTooltip]"
 learn_language_ongoing.1300.b.failure:0 "ท่านสื่อสารกับ [interlocutor.GetFirstNameNoTooltip] ไม่สำเร็จ"
 learn_language_ongoing.1300.c:0 ""ร่วมเดินทางกับเราไปยัง [next_destination.GetNameNoTooltip]!""
 learn_lang_cult_acceptance_gain_debate:0 "เข้าร่วมการโต้เถียงอย่างเป็นมิตรขณะเดินทาง"
 interlocutor_entourage_member:0 "คู่สนทนาเข้าร่วมคณะผู้ติดตาม"
