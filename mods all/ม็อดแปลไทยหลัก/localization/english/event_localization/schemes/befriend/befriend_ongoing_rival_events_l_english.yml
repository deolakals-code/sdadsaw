l_english: 
 befriend_ongoing_rival.3000.t:0 "ผูกมิตร: ความสมดุลอันละเอียดอ่อน"
 befriend_ongoing_rival.0001.t:0 "ผูกมิตร: ส่งคืนผู้ส่ง"
 befriend_ongoing_rival.0001.desc:0 "ข้าชั่งน้ำหนักทุกถ้อยคำอย่างระมัดระวังขณะเขียนจดหมายถึง [target.GetTitledFirstName] แม้เมื่อข้าวางปากกาขนนกลงและกลับไปยังห้องพัก ข้าก็มิอาจหยุดคิดถึงวลีและความหมายแฝงที่อาจก่อให้เกิดความขุ่นเคืองได้\n\nข้าหวังเป็นอย่างยิ่งว่าจดหมายของข้าจะเป็นจุดเปลี่ยนในความพยายามของข้า แต่ข้าคิดผิดอย่างมหันต์ วันนี้สาส์นถูกส่งคืนโดยมิได้เปิดอ่าน!"
 befriend_ongoing_rival.0001.a:0 "ช่างเป็น[target.Custom2('InsultNoun', ROOT.Char)]ที่อกตัญญูเสียจริง!"
 befriend_ongoing_rival.0002.t:0 "ผูกมิตร: อย่างดุเดือด"
 befriend_ongoing_rival.0002.desc:0 "ข้าใช้เวลาใกล้ชิดกับ [target.GetTitledFirstNamePossessive] มากพอที่จะรู้ว่า [target.GetSheHe] สามารถพูดคุยเกี่ยวกับ [target.Custom('herhis_subject_of_interest')] ได้เป็นเวลาหลายชั่วโมง ข้าได้ทำการค้นคว้าและเตรียมคำถามสองสามข้อสำหรับสิ่งที่ข้าหวังว่าจะเป็นการสนทนาที่มีประโยชน์\n\nอนิจจา ข้าคิดผิดอย่างมหันต์ ภายในไม่กี่นาที เราก็พบเรื่องที่จะไม่เห็นพ้องกันและตกอยู่ในการแข่งขันตะโกนโหวกเหวกอย่างบ้าคลั่ง"
 befriend_ongoing_rival_0002.a:0 "ข้าจะกล้ำกลืนความภาคภูมิใจและสนับสนุนจุดยืนของ [target.GetHerHis]"
 befriend_ongoing_rival_0002.b:0 "หากเพียง แต่ข้าจะ ทำให้ [target.GetHerHim] เข้าใจได้..."
 befriend_ongoing_rival_0002.b.tt:0 "ความคืบหน้าของแผนการข้าจะได้รับผลกระทบในทางบวกหรือลบขึ้นอยู่กับผลลัพธ์"
 befriend_ongoing_rival_0002.c:0 "ข้าไม่มีวันเห็นด้วยกับความคิดเห็นที่ไร้สาระ เช่นนี้ได้!"
 befriend_ongoing_rival.0003.t:0 "ผูกมิตร: เห็นพ้องต้องกัน"
 befriend_ongoing_rival.0003.desc:0 "ต้องใช้การทะเลาะวิวาทและคำสาปแช่งพอสมควรจึงจะมาถึงจุดนี้ แต่ในท้ายที่สุด ดูเหมือนว่า [target.GetTitledFirstName] และข้าได้พบจุดร่วมบางอย่างในคำถามนี้\n\nเราอาจจะไม่ได้จากกันในฐานะเพื่อน แต่ข้ารู้สึกว่าเรากำลังมีความคืบหน้า"
 befriend_ongoing_rival_0003.a:0 "บางทีอาจจะยังพอมีความหวังสำหรับเราอยู่บ้าง"
 befriend_ongoing_rival.0004.t:0 "ผูกมิตร: ความผิดพลาดอันโง่เขลา"
 befriend_ongoing_rival.0004.desc:0 "ข้าพยายามอย่างยิ่งที่จะอธิบายความคิดเห็นของข้าในลักษณะที่จะสมเหตุสมผลจากมุมมองของ [target.GetTitledFirstNamePossessive] แต่ข้ากลับ ทำให้ตัวเองพัวพันกับข้อโต้แย้งของตัวเอง\n\nสิ่งนี้ ทำให้ [target.GetHerHim] มีช่องทางมากมายที่จะโจมตีข้า และข้าก็ออกมาจากการโต้เถียงดูเหมือนคนโง่เขลา"
 befriend_ongoing_rival_0004.a:0 "[target.GetTitledFirstNameNoTooltip] อาจจะชนะในครั้งนี้..."
 befriend_ongoing_rival.0005.t:0 "ผูกมิตร: ในแง่ร้าย"
 befriend_ongoing_rival.0005.desc:0 "เมื่อ [spymaster.GetTitledFirstName] แจ้งข้าถึงข่าวลืออันโสมมเกี่ยวกับตัวข้าที่แพร่สะพัดในราชสำนัก ข้ารู้สึกได้ถึงโทสะที่พลุ่งพล่าน ข้าให้[spymaster.GetHerHim]สืบหาที่มา และก็ไม่น่าประหลาดใจนัก ดูเหมือนว่าตัวการที่แท้จริงหาใช่ใครอื่นนอกจาก [target.GetTitledFirstName] \n\n[ROOT.Char.GetFaith.HighGodName] เหตุใด[target.Custom2('InsultNoun', ROOT.Char)]จอมโกหกนั่นถึงไม่หยุดเรื่องไร้สาระนี้เสียที?!"
 befriend_ongoing_rival_0005.a:0 "ข้าต้องปกป้องตนเองจากคำโกหกอันสกปรกของ [target.GetFirstNamePossessiveNoTooltip]!"
 befriend_ongoing_rival_0005.b:0 "ในเวลานี้ อาจเป็นการดีที่สุดที่จะปล่อยให้มันเป็นไปตามครรลอง"
 befriend_ongoing_rival.2000.t:0 "ผูกมิตร: การเยินยออัตตาของ [target.GetHerHis|U]"
 befriend_ongoing_rival.2000.desc:0 "ข้าดูเหมือนจะมุ่งเน้นไปที่ด้านลบของ [target.GetTitledFirstNamePossessive] อยู่เสมอ ซึ่งค่อนข้างไร้ประโยชน์เมื่อคำนึงถึงเป้าหมายปัจจุบันของข้า แน่นอนว่า [target.GetSheHe] ก็ต้องมีจุดแข็งที่น่าชื่นชม เช่นกัน\n\nคำชมที่สุขุม แต่รอบคอบ ซึ่งยอมรับคุณธรรมอย่างหนึ่งของ [target.GetHerHis] อาจเป็นความคิดที่ดี"
 befriend_ongoing_rival_2000.a:0 "แม้ว่าเราจะเคยมีเรื่องบาดหมางกัน [target.GetFirstNameNoTooltip] ก็เป็นคนจิตใจดี"
 befriend_ongoing_rival_2000.b:0 "[target.GetSheHe|U] มีบุคลิกที่น่าเกรงขามทีเดียว"
 befriend_ongoing_rival_2000.c:0 "เมื่อข้าคิดดูแล้ว [target.GetSheHe] เป็นคนเข้ากับผู้คนได้ดี"
 befriend_ongoing_rival_2000.d:0 "[target.GetFirstNameNoTooltip] มักจะสุขุมเยือกเย็นอยู่เสมอ"
 befriend_ongoing_rival_2000.tt:0 "#F คำชมที่จริงใจจะช่วยให้แผนการของข้าคืบหน้า แต่คำชมที่ผิดอาจทำให้ [target.GetHerHim] ขุ่นเคืองได้#! "
 befriend_ongoing_rival_2000.a.tt:0 "ยกย่อง [target.GetFirstName] ในความมีเมตตา"
 befriend_ongoing_rival_2000.b.tt:0 "ยกย่อง [target.GetFirstName] ในความกล้าแสดงออก"
 befriend_ongoing_rival_2000.c.tt:0 "ยกย่อง [target.GetFirstName] ในความเป็นมิตร"
 befriend_ongoing_rival_2000.d.tt:0 "ยกย่อง [target.GetFirstName] ในความสุขุมเยือกเย็น"
 befriend_ongoing_rival.2001.t:0 "ผูกมิตร: พลังแห่งการยอมรับ"
 befriend_ongoing_rival.2001.intro:0 "ข้าแน่ใจว่า [target.GetTitledFirstName] อยู่ในระยะที่ได้ยินเมื่อข้ากล่าวถึง"
 befriend_ongoing_rival.2001.benevolent:0 "ว่าข้าคิดเสมอมาว่าความเอื้อเฟื้อเผื่อแผ่ของ [target.GetHerHis] เป็นแบบอย่างอันมีค่าแก่ผู้อื่นอย่างไร"
 befriend_ongoing_rival.2001.dominant:0 "ว่า [target.GetSheHe] ดึงดูดความสนใจของทุกคนเสมอเมื่อ [target.GetSheHe] เข้ามาในห้องอย่างไร"
 befriend_ongoing_rival.2001.extroverted:0 "ว่า [target.GetSheHe] เป็นที่รู้จักอย่างกว้างขวางว่าเป็นแขกยอดนิยม เป็นสีสันของงานเลี้ยงเสมอ"
 befriend_ongoing_rival.2001.levelheaded:0 "ว่าแม้เราจะไม่เห็นพ้องกันหลายครั้ง ข้าก็ชื่นชมความสามารถของ [target.GetHerHis] ในการรักษาความสุขุมเยือกเย็นเสมอมา"
 befriend_ongoing_rival.2001.end:0 "\n\nภายหลังข้าได้รับการยืนยันว่า [target.GetSheHe] พยายามอย่างยิ่งที่จะซ่อนรอยยิ้มพึงพอใจเมื่อได้ยินคำพูดของข้า"
 befriend_ongoing_rival_2001.a:0 "คำชมจากใจจริงสามารถสร้างปาฏิหาริย์ได้อย่างแท้จริง"
 befriend_ongoing_rival.2002.t:0 "ผูกมิตร: ความเข้าใจผิดอย่างร้ายแรง"
 befriend_ongoing_rival.2002.end:0 "\n\nหลังจากนั้น เมื่อ [target.GetSheHe] เข้ามาหาข้า ข้าคิดว่า [target.GetSheHe] จะมาขอบคุณ! อย่างน้อยก็ จนกระทั่งข้าเห็นสีหน้าโกรธเกรี้ยวของ [target.GetHerHis]... ปรากฏว่า [target.GetSheHe] ตีความความพยายามชมเชยของข้าว่าเป็นการเยาะเย้ยถากถาง"
 befriend_ongoing_rival_2002.a:0 "ข้าไม่น่าเปิดปากเลย..."
 befriend_ongoing_rival.2003.t:0 "ผูกมิตร: ช่างน่าอึดอัดใจ"
 befriend_ongoing_rival.2003.end:0 "\n\nเมื่อข้าเหลือบมองไปที่ [target.GetTitledFirstNameNoTooltip] ข้าคาดหวังว่าจะเห็นร่องรอยความพึงพอใจเล็กน้อยเป็นอย่างน้อย แต่ [target.GetSheHe] กลับดูสับสนงุนงง บางทีอาจจะรำคาญเล็กน้อยด้วยซ้ำ"
 befriend_ongoing_rival_2003.a:0 "บางทีข้าควรจะคิดเรื่องนี้ให้มากกว่านี้..."
