l_english: 
 befriend_ongoing_dislike.0001.t:0 "ผูกมิตร: ของขวัญอันเป็นที่รัก"
 befriend_ongoing_dislike.0001.desc:0 "ข้าต้องการให้ [target.Custom2('MyCharacterIntroductionNoComma', ROOT.Char)] ชอบข้ามากขึ้น และใครบ้างเล่าจะไม่ชอบของขวัญ?"
 befriend_ongoing_dislike.0001.a:0 "[target.GetSheHe|U] จะต้องประทับใจอย่างยิ่งกับสิ่งนี้!"
 befriend_ongoing_dislike.0001.b:0 "เมื่อพิจารณาถึงความสัมพันธ์ของเรา การแสดงความยับยั้งชั่งใจจึงเป็นการรอบคอบ"
 befriend_ongoing_dislike.0001.c:0 "ของขวัญมิใช่วิถีทางที่ควร"

 befriend_ongoing_dislike.0002.t:0 "ผูกมิตร: เผชิญหน้ากับความเป็นอริ"
 befriend_ongoing_dislike.0002.desc:0 "[target.Custom2('MyCharacterIntroductionNoComma', ROOT.Char)|U] ยังคงหลีกเลี่ยงความพยายามของข้าที่จะผูกมิตรกับ [target.GetHerHim]\n\n[target.GetSheHe|U] แสดงให้เห็นชัดเจนว่า [target.GetSheHe] คิดว่า [target.GetSheHe] จะไม่มีวันเห็นคุณค่าข้าเลย หรือแม้ แต่ดีกว่าไส้เดือนดิน"
 befriend_ongoing_dislike.0002.a:0 "นี่เป็นเรื่องยากลำบาก..."
 
 befriend_ongoing_dislike.0003.t:0 "ผูกมิตร: คุณค่าของการยืนกราน"
 befriend_ongoing_dislike.0003.desc:0 "จดหมายและของขวัญที่ข้ากังวล ดูเหมือนจะไปถึง [target.Custom2('MyCharacterIntroductionNoComma', ROOT.Char)] ทั้งหมด เพราะในที่สุด [target.GetSheHe] ก็ตอบกลับมา!\n\nทว่า เป็นการตอบกลับมาว่าการยืนกรานของข้ารบกวน [target.GetHerHim]"
 befriend_ongoing_dislike.0003.a:0 "อย่างน้อยข้าก็สร้างความประทับใจได้บ้าง!"
 
 befriend_ongoing_dislike.0004.t:0 "ผูกมิตร: ส่งคืนผู้ส่ง"
 befriend_ongoing_dislike.0004.desc:1 "ดูเหมือนว่าจดหมายฉันมิตรสองสามฉบับที่ข้าส่งไปยัง [target.Custom2('MyCharacterIntroductionNoComma', ROOT.Char)] จะถูกส่งคืนมาพร้อมกับผู้ส่งสารของข้า โดยที่ยังไม่ได้เปิดผนึก\n\nเหตุใด [target.GetSheHe] จึงไม่เข้าใจว่าข้าเพียงพยายาม ทำให้สิ่งต่างๆ ดีขึ้นเท่านั้น?"
 befriend_ongoing_dislike.0004.a:0 "ข้าเพียงต้องการให้ [target.GetHerHim] ชอบข้า"
 befriend_ongoing_dislike.0004.b:0 "ข้าจะให้ราชมัลส่งสารของข้าด้วยตนเอง!"
 
 befriend_ongoing_dislike.0005.t:0 "ผูกมิตร: ท่าทีที่อ่อนลง"
 befriend_ongoing_dislike.0005.desc:0 "ความพยายามของข้าที่จะปรับปรุงสถานะของตนในสายตาของ [target.Custom2('MyCharacterIntroductionNoComma', ROOT.Char)] เผชิญกับความท้าทายอย่างแน่นอน แต่ผู้ส่งสารของข้ารายงานว่าจดหมายของข้าไม่ได้รับการตอบรับด้วยเสียงครางอย่างผิดหวัง เช่นเดิมอีกต่อไป\n\nบัดนี้ ใบหน้าของ [target.GetHerHis|U] แสดงออกถึงบางสิ่งที่อาจเป็น... ความสนใจ"
 befriend_ongoing_dislike.0005.a:0 "ฮ่า ข้าจะต้องได้ใจ [target.GetHerHim] จนได้!"
 
 befriend_ongoing_dislike.2001.t:0 "ผูกมิตร: ไม่ได้รับเชิญ"
 befriend_ongoing_dislike.2001.desc:0 "[target.Custom2('MyCharacterIntroductionNoComma', ROOT.Char)|U] เป็นที่รู้จักกันดีว่าเป็น [target.GetWomanMan] ที่ชอบเข้าสังคมและเป็นมิตร กระตือรือร้นที่จะเลี้ยงฉลองและเฉลิมฉลองกับผู้อื่น\n\nแต่ [target.GetSheHe] กลับไม่เชิญข้าไปงานเลี้ยงล่าสุดของ [target.GetHerHis] ที่คฤหาสน์ของบารอน ทั้งที่มันอยู่ใกล้กับดินแดนของข้ามาก ทำให้ข้าเป็นแขกโดยธรรมชาติ!"
 befriend_ongoing_dislike.2001.a:0 "นี่เป็นการดูหมิ่นอย่างร้ายแรง!"
 befriend_ongoing_dislike.2001.b:0 "เป็นโอกาสที่พลาดไป แต่ข้าไม่อาจตีความไปไกลกว่านั้นได้"
 
 befriend_ongoing_dislike.2002.t:0 "ผูกมิตร: เข้าใกล้"
 befriend_ongoing_dislike.2002.desc:0 "เป็นที่ทราบกันดีว่า [target.Custom2('MyCharacterIntroductionNoComma', ROOT.Char)] ค่อนข้างขี้อาย ไม่ค่อยกระตือรือร้นที่จะใช้เวลากับผู้คนนานกว่าที่ [target.GetSheHe] เห็นว่าจำเป็น\n\nบัดนี้ [target.GetSheHe] หยุดตอบสารของข้าแล้ว และข้าไม่แน่ใจว่าจะดำเนินการต่อไปอย่างไร"
 befriend_ongoing_dislike.2002.a:0 "ข้าต้องให้เวลา [target.GetHerHim]"
 befriend_ongoing_dislike.2002.b:0 "ข้าจะ ทำให้แน่ใจว่า [target.GetHerHim] ได้รับข่าวสารจากข้า อย่างมาก!"
 
 befriend_ongoing_dislike.5001.t:0 "ผูกมิตร: ผู้มองโลกในแง่ร้ายและผู้คลั่งศาสนา"
 befriend_ongoing_dislike.5001.desc:0 "ความพยายามของข้าที่จะคลี่คลายความตึงเครียดระหว่าง [target.Custom2('MyCharacterIntroductionNoComma', ROOT.Char)] กับตัวข้าถูกขัดขวางโดยความหมกมุ่นไร้สาระของ [target.GetHerHis] เกี่ยวกับการขาดความศรัทธาของข้า \n\nแต่ถึงแม้ [target.GetHerHis] จะบ่นว่าอย่างไร [target.GetTitledFirstName] ก็ยังคงล้มเหลวที่จะอธิบายว่าเหตุใดจึงควรใส่ใจ [ROOT.GetCharacter.GetFaith.HighGodName] มากกว่าที่ข้าทำอยู่แล้ว แน่นอน"
 befriend_ongoing_dislike.5001.a:0 "ข้าคิดว่าข้าอาจไปเยือน [ROOT.Char.GetFaith.HouseOfWorship] บ่อยขึ้นได้"
 befriend_ongoing_dislike.5001.b:0 "เราคงต้องจัดการกันไปตามนี้"
 befriend_ongoing_dislike.5001.c:0 "ใครจะสนใจความสงสัยที่ข้ามีอยู่แล้วเล่า!"
 befriend_ongoing_dislike.5002.t:0 "ผูกมิตร: ความไว้วางใจและความไม่ไว้วางใจ"
 befriend_ongoing_dislike.5002.desc:0 "มันคงจะง่ายกว่ามากที่จะ ทำให้ [target.Custom2('MyCharacterIntroductionNoComma', ROOT.Char)] ชอบข้ามากขึ้น หาก [target.GetSheHe] เพียงแค่เชื่อในความจริงใจของความพยายามของข้า! แต่ [target.GetSheHe] กลับเยาะเย้ยข้า และสงสัยว่าข้าหวังจะได้อะไรจากความเมตตาของข้า"
 befriend_ongoing_dislike.5002.a:0 "ข้าจะยืนกราน แต่จะไม่โกหกเกี่ยวกับตัวตนของข้า"
 befriend_ongoing_dislike.5002.b:0 "อืม ใช่ บางทีข้าอาจกำลังพยายามได้บางสิ่งบางอย่าง..."
 befriend_ongoing_dislike.5003.t:0 "ผูกมิตร: รู้สึกหดหู่"
 befriend_ongoing_dislike.5003.desc:0 "ทั้งหมดที่ข้าต้องการคือ ทำให้ [target.Custom2('MyCharacterIntroductionNoComma', ROOT.Char)] เห็นความสุขของการอยู่ท่ามกลางผู้คนอื่น! อย่างไรก็ตาม [target.GetSheHe] ดูเหมือนจะเก็บตัว [target.GetHerselfHimself] อยู่เสมอ และไม่ค่อยต้องการออกจากห้องของ [target.GetHerHis] เว้น แต่จำเป็นจริง ๆ"
 befriend_ongoing_dislike.5003.a:0 "[target.GetSheHe|U] ควรจะก้าวข้ามมันไปได้แล้ว!"
 befriend_ongoing_dislike.5003.b:0 "หาก [target.GetSheHe] ต้องการพื้นที่ส่วนตัว ข้าจะให้ [target.GetHerHim]"
 befriend_ongoing_dislike.5004.t:0 "ผูกมิตร: ของขวัญอันน่าอัศจรรย์กลับน่าผิดหวัง"
 befriend_ongoing_dislike.5004.desc:0 "ข้าปรารถนาที่จะแสดงเจตนาดีต่อ [target.Custom2('MyCharacterIntroductionNoComma', ROOT.Char)] โดยการจัดเตรียมงานเลี้ยงอันยิ่งใหญ่และส่งไปยัง [target.Custom('ResidenceBuilding')] ของ [target.GetHerHis] แต่ข้าเพิ่งได้ยินข่าวว่า [target.GetSheHe] คาดว่าจะไม่ได้แตะต้องแม้ แต่ส่วนที่เล็กที่สุดของมันเลย!\n\n ข้าคิดว่ามีบางอย่างผิดปกติ แต่เห็นได้ชัดว่า ไม่ใช่ทุกคนที่ชื่นชอบอาหารกองเท่าภูเขามากเท่าข้า"
 befriend_ongoing_dislike.5004.a:0 "ข้าจะขออภัยในความเกินพอดีของข้า"
 befriend_ongoing_dislike.5004.b:0 "[target.GetSheHe|U] ก็ดูอาหารของ [target.GetHerHis] เน่าไปเถอะ"
 befriend_ongoing_dislike.5005.t:0 "ผูกมิตร: เรียกร้องให้ลงมือ"
 befriend_ongoing_dislike.5005.desc:0 "ข้ากำลังพยายาม ทำให้ [target.Custom2('MyCharacterIntroductionNoComma', ROOT.Char)] เข้าใจข้ามากขึ้น แต่ผลลัพธ์ทั้งหมดคือข้าเข้าใจ [target.GetHerHim] น้อยลงเรื่อย ๆ แรงผลักดันของ [target.GetHerHis] ความทะเยอทะยานของ [target.GetHerHis] อยู่ที่ไหน? ดูเหมือนว่า [target.GetSheHe] จะไม่สนใจเลยหากสิ่งต่าง ๆ ยังคงเป็นเหมือนเดิมทุกประการ"
 befriend_ongoing_dislike.5005.a:0 "เช่นนั้น ข้าจะพยายามยอมรับสิ่งนี้ตามที่เป็นอยู่ไปก่อน"
 befriend_ongoing_dislike.5005.b:0 "คน เช่นนั้นควรค่าแก่การรู้จักด้วยหรือ?"
 befriend_ongoing_dislike.5005.c:0 "พวกเขากำลังซ่อนความทะเยอทะยานประเภทใดไว้เป็นความลับกันแน่?!"
