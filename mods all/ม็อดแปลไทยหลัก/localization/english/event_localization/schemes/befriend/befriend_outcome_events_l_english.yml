l_english: 
 befriend_outcome.1001.t:0 "ผูกมิตร: ยามค่ำคืน"
 befriend_outcome.1001.desc:0 "หลังจากทราบว่า [target.GetTitledFirstName] จะมาเป็นแขกที่คฤหาสน์ใน [barony.Custom('BaronyTownType')] แห่ง [barony.GetNameNoTier] ข้าตระหนักว่านี่เป็นโอกาสอันสมบูรณ์แบบที่จะได้พบกับ [target.GetHerHim]\n\n"
 befriend_outcome.1002.t:0 "ผูกมิตร: ณ งานเต้นรำ"
 befriend_outcome.1002.desc:0 "หลังจากทราบว่า [target.GetTitledFirstName] จะเข้าร่วมงานเต้นรำใน [barony.Custom('BaronyTownType')] แห่ง [barony.GetNameNoTier] ข้าตัดสินใจว่านี่เป็นโอกาสอันสมบูรณ์แบบที่จะแวะไป เพื่อให้แน่ใจว่าข้าจะได้ใช้เวลาเผชิญหน้ากับ [target.GetHerHim]!\n\n"
 befriend_outcome.1201.t:0 "ผูกมิตร: การพบปะอย่างเป็นทางการ"
 befriend_outcome.1201.desc:0 "แม้ว่าเราจะเคยมีความขัดแย้งกันมาก่อน ที่ปรึกษาของ [target.GetTitledFirstNamePossessive] ได้เสนอให้มีการพบปะเพื่อเป็นโอกาสในการคลี่คลายความแตกต่างของเราและทิ้งความบาดหมางไว้เบื้องหลัง\n\n"

 befriend_outcome.1301.t:0 "ผูกมิตร: ที่ดิน"
 befriend_outcome.1301.desc:0 "หลังจากครุ่นคิดอยู่นาน ในที่สุดข้าก็ตัดสินใจเชิญ [target.GetTitledFirstName] มาเยี่ยมชมที่ดินแห่งหนึ่งของข้าใน [barony.GetNameNoTier]"

 befriend_outcome.2001.t:0 "ผูกมิตร: ค่ำคืนอันน่ารื่นรมย์"
 befriend_outcome.2001.desc:0 "ตามคำขอของข้า ข้าได้นั่งถัดจาก [target.GetHerHim] ตลอดมื้อค่ำ และเราทั้งคู่ก็มีช่วงเวลาที่ดีเยี่ยม! ข้าประหลาดใจที่เรามีเรื่องพูดคุยกันมากมาย"
 befriend_outcome.2001.a:0 "ช่างเป็น [target.GetWomanMan] ที่น่าพอใจเสียนี่กระไร!"

 befriend_outcome.2002.t:0 "ผูกมิตร: งานเต้นรำ"
 befriend_outcome.2002.desc:0 "งานเลี้ยงเต้นรำนั้นงดงามยิ่งนัก และ [target.GetTitledFirstName] ก็แสดงได้อย่างยอดเยี่ยม! หลังจากนั้น ข้าบอก [target.GetHerHim] ว่าข้าประทับใจเพียงใด และเราก็ได้พูดคุยกัน"
 befriend_outcome.2002.a:0 "ช่างเป็นวันที่ดีอะไร เช่นนี้!"

 befriend_outcome.2003.t:0 "ผูกมิตร: สหายร่วมค่ำคืน"
 befriend_outcome.2003.opening:0 "หลังจากการเตรียมการอย่างอุตสาหะ ในที่สุดข้าก็ได้ใช้เวลายามค่ำคืนตามลำพังกับ [target.GetTitledFirstName] เพื่อ"
 befriend_outcome.2004.opening:0 "หลังจากการเตรียมการอย่างอุตสาหะ ในที่สุดข้าก็ได้ใช้เวลาตามลำพังกับ [target.GetTitledFirstName]"
 befriend_outcome.2003.same_fame:0 "ผูกพันกับช่วงเวลาที่ผ่านไป การกระทำในอดีต และโลกอันแปลกประหลาดที่เราอาศัยอยู่"
 befriend_outcome.2003.same_lifestyle:0 "พูดคุยเกี่ยวกับสิ่งที่ ทำให้ชีวิตมีค่า และแบ่งปันเรื่องราวดีๆ สองสามเรื่อง"
 befriend_outcome.2003.same_education:0 "สนทนาเกี่ยวกับ [ROOT.GetCharacter.Custom('education_conversation_subject')]"
 befriend_outcome.2003.deceitful:0 "ในที่สุดข้าก็สามารถใช้เวลากับ [target.GetTitledFirstName] และสนทนาเกี่ยวกับ [target.Custom('education_conversation_subject')] ได้ โชคดีที่ [target.GetSheHe] ไม่ได้สังเกตว่าข้ามีความเข้าใจน้อยมากเกี่ยวกับสิ่งที่ข้ากำลังพูดถึง"
 befriend_outcome.2003.fallback:0 "แบ่งปันเรื่องราวสองสามเรื่องและค้นพบความสนใจร่วมกันของเรา"
 befriend_outcome.2003.great_time:0 "\n\nเมื่อข้าจากไป [target.GetTitledFirstName] บอกข้าว่าเป็นการดีที่ได้พูดคุยกับคนที่เข้าใจ [target.GetHerHim] อย่างแท้จริง ข้าเห็นด้วยอย่างสุดใจ"
 befriend_outcome.2003.a:0 "เราใกล้ชิดกันยิ่งกว่าเดิม"

 befriend_outcome.2201.t:0 "ผูกมิตร: การทูตอันบังเกิดผล"
 befriend_outcome.2201.desc:0 "หลังจากนั่งลงกับ [target.GetTitledFirstName] ในฐานะเท่าเทียมกันมากกว่าศัตรู ข้ารู้สึกว่าข้าได้เรียนรู้มากมายเกี่ยวกับ [target.GetHerHim] [target.GetSheHe|U] ก็เห็น เช่นกันว่าเมื่อเวลาผ่านไป เราสามารถเห็นพ้องต้องกันได้"
 befriend_outcome.2201.a:0 "[target.GetSheHe|U] ถึงกับยิ้มให้ข้าก่อนที่ข้าจะจากไป"

 befriend_outcome.2301.desc:0 "\n\nการเยี่ยมเยียนกลายเป็นความคิดที่ดีกว่าที่ข้าคาดไว้ ไม่เพียง แต่ [target.GetTitledFirstName] จะให้ข้อมูลเชิงลึกที่ไม่คาดคิดเกี่ยวกับเรื่องที่ดินเท่านั้น แต่ [target.GetSheHe] ยัง ทำให้อารมณ์ของข้าสดใสตลอดเวลาอีกด้วย"
 befriend_outcome.2301.increase_opinion:0 "ข้ารู้สึกเหมือนเรารู้จักกันในแบบที่เราไม่เคยเป็นมาก่อน"
 befriend_outcome.2301.a:0 "การเดินทางครั้งนี้คุ้มค่ากับความพยายาม"
 befriend_outcome.4001.t:0 "ผูกมิตร: มื้ออาหารอันน่าอึดอัด"
 befriend_outcome.4001.desc:0 "เมื่อถึงเวลา ข้าได้นั่งติดกับ [target.GetTitledFirstName] ตลอดมื้อค่ำ แต่ข้าพบว่าตัวเองไม่สามารถพูดอะไรที่น่าสนใจได้เลย!"
 befriend_outcome.4001.b:0 "อ๊าก ข้ายอมแพ้!"

 befriend_outcome.4002.t:0 "ผูกมิตร: งานเต้นรำ"
 befriend_outcome.4002.desc:0 "วันงานเต้นรำถูกบดบังด้วยท้องฟ้าสีเทา และไม่เหมือนกับงานรื่นเริงที่ข้าคาดหวัง บรรยากาศกลับหม่นหมอง"
 befriend_outcome.4002.a:0 "ไว้คราวหน้าที่ข้าพบ [target.GetHerHim] ก็แล้วกัน!"
 befriend_outcome.4002.b:0 "นี่มันสิ้นหวัง..."

 befriend_outcome.4003.t:0 "ผูกมิตร: ความผิดพลาด"
 befriend_outcome.4003.same_fame:0 "เนื่องจากมีชื่อเสียงในเรื่องเดียวกันหลายอย่าง ข้าคิดว่า [target.GetTitledFirstName] และข้าจะมีจุดร่วมมากมาย แต่ถึงแม้จะมี ข้าก็หามันไม่เจอ"
 befriend_outcome.4003.same_lifestyle:0 "ข้ามั่นใจมากว่า [target.GetTitledFirstName] และข้าใช้ชีวิตในลักษณะที่คล้ายคลึงกันมาก แต่หลังจากได้พูดคุยกับ [target.GetHerHim] เป็นเวลาสองสามชั่วโมง ข้าก็ไม่แน่ใจอีกต่อไป..."
 befriend_outcome.4003.same_education:0 "ข้าเชื่ออย่างแท้จริงว่า [target.GetTitledFirstName] และข้ามองโลกในแบบเดียวกัน แต่หลังจากใช้เวลาหลายชั่วโมงทะเลาะกันเรื่อง [target.Custom('education_conversation_subject')] โดยไม่เคยพบจุดร่วมใดๆ ข้าก็ถูกบังคับให้ยอมรับว่าข้าคิดผิดอย่างมหันต์"
 befriend_outcome.4003.deceitful:0 "ข้าคิดว่าข้าสามารถแสร้งทำเป็นรู้เกี่ยวกับทุกสิ่งที่ [target.GetTitledFirstName] อาจต้องการสนทนาได้ แต่เมื่อถึงชั่วโมงที่สามของ [target.Custom('education_conversation_subject')] ความพยายามในการเข้าสังคมของข้าก็ล้มเหลวโดยสิ้นเชิง"
 befriend_outcome.4003.fallback:0 "แม้ว่าข้าจะคิดในตอนแรก แต่ข้าก็ไม่สามารถหาอะไรที่ [target.GetTitledFirstName] และข้ามีเหมือนกันเพื่อสร้างความผูกพันได้"
 befriend_outcome.4003.bad_time:0 "\n\nข้าจากไปด้วยความท้อแท้ และดูเหมือนว่า [target.GetSheHe] จะดีใจที่เห็นข้าไป"
 befriend_outcome.4003.b:0 "มิตรภาพของเราคงไม่ได้ถูกกำหนดมาให้เป็น เช่นนั้น"

 befriend_outcome.4201.t:0 "ผูกมิตร: การพบปะอันเย็นชา"
 befriend_outcome.4201.desc:0 "น่าเสียดาย แม้ว่าจะมีเจตนาดี การเผชิญหน้าของเรากลับไม่ได้ทำอะไรมากไปกว่าการเตือนข้าว่าทำไมเราถึงเข้ากันไม่ได้"
 befriend_outcome.4201.b:0 "ข้าไม่ควรพยายามทำสิ่งนี้เลย"

 befriend_outcome.4301.desc:0 "\n\nน่าเสียดาย การเดินทางกลายเป็นความคิดที่หายนะ [target.GetTitledFirstName] ไม่ได้เตรียมตัวมาอย่างดี และทุกครั้งที่ข้าพยายาม ทำให้อารมณ์ดีขึ้น [target.GetSheHe] ก็ตอบสนองด้วยความไม่พอใจอย่างลับๆ เท่านั้น"
 befriend_outcome.4301.b:0 "หลังจากทั้งหมดนี้ ข้ายอมแพ้"

 befriend_outcome.6001.begin_friendship:0 "\n\nเมื่อถึงเวลาที่ข้าจากไป รู้สึกราวกับว่าเรารู้จักกันมาทั้งชีวิตแล้ว"

 befriend_outcome.6301.begin_friendship:0 "\n\n[target.GetSheHe|U] ไม่เพียง แต่เป็น [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('target'))] ของข้า แต่ยังเป็นเพื่อนของข้าด้วย"
 
 befriend_outcome.8001.disastrous_time:0 "\n\nเมื่อข้าจากไป ข้าสาบานได้ว่า [target.GetSheHe] ส่งสายตาที่ชั่วร้ายที่สุดเท่าที่ข้าเคยเห็นมาให้ข้า"
 
 befriend_outcome.8201.disastrous_time:0 "\n\nมีอยู่ครั้งหนึ่ง ข้าเผลอดูถูกทั้งมารดาของ [target.GetHerHis] #EMP และ#! ม้าตัวโปรดของ [target.GetHerHis]"
 
 befriend_outcome.8301.disastrous_time:0 "\n\nหลังจากเรากลับมา [target.GetSheHe] แทบไม่อยากพูดกับข้าเลย!"
 
 befriend_outcome.9800.t:0 "ผูกมิตร: ความเศร้าที่แบ่งปันคือความเศร้าครึ่งหนึ่ง"
 befriend_outcome.9800.desc:0 "เมื่อสายลับของข้าบอกข้าเกี่ยวกับการเยี่ยมเยียนประจำปีของ [target.GetTitledFirstNamePossessive] ที่"
 befriend_outcome.9800.desc_same_parent.our_parent:0 "หลุมศพของ [target_dead_parent.Custom('MotherFather')] ของเรา,"
 befriend_outcome.9800.desc_strangers.their_parent:0 "หลุมศพของ [target_dead_parent.Custom('MotherFather')] ของ [target.GetHerHis],"
 befriend_outcome.9800.mid.desc:0 "ข้าตระหนักได้ทันทีว่านี่เป็นโอกาสที่ดีที่สุดที่จะเชื่อมช่องว่างระหว่างเรา\n\nเมื่อวันนั้นมาถึง ข้าพบ [target.GetTitledFirstNameNoTooltip] คุกเข่าอยู่หน้าป้ายหลุมศพ จมอยู่ในความคิด\n\n"ขออภัยที่รบกวน" ข้าพูดด้วยเสียงเบา"
 befriend_outcome.9800.desc_same_parent.dialogue:0 ""ข้ารู้ว่า [target_dead_parent.GetSheHe] มีความหมายต่อท่านมาก ข้าก็คิดถึง [target_dead_parent.GetHerHim] เช่นกัน""
 befriend_outcome.9800.desc_strangers.dialogue:0 ""ข้าต้องการแสดงความเสียใจ ข้าเองก็รู้ว่าการสูญเสียบุพการีเป็นอย่างไร""
 befriend_outcome.9800.end:0 "\n\nเราลงเอยด้วยการแบ่งปันเรื่องราวเกี่ยวกับบุคคลอันเป็นที่รักที่จากไปเป็นเวลาหลายชั่วโมง ในที่สุดเมื่อเราจากกัน ข้ารู้สึกราวกับว่าภาระหนักได้ถูกยกออกจากบ่าของข้า"

 befriend_outcome.9800.a:0 "ความเศร้าโศกของเรา ทำให้เราเป็นหนึ่งเดียวกัน"

 befriend_outcome.9900.t:0 "ผูกมิตร: ความรู้สึกท่วมท้น"
 befriend_outcome.9900.end: "โชคไม่ดี ทันทีที่ [target.GetTitledFirstName] เห็นข้า [target.GetSheHe] ก็ลุกพรวดขึ้นยืนบนเท้าของ[target.GetHerHis] และพุ่งเข้าใส่ข้าด้วยความโกรธเกรี้ยว"
 befriend_outcome.9900.b:0 "...นี่เป็นเวลาที่ไม่เหมาะสมหรือ?"

 befriend_outcome.0002.t:0 "มิตรภาพของ [owner.GetTitledFirstNamePossessiveNoTooltip]"
 befriend_outcome.0002.critsucc.desc:0 "เป็นที่ชัดเจนมาระยะหนึ่งแล้วว่า [owner.GetTitledFirstName] พยายามที่จะ[GetScheme('befriend').GetTypeName|l]ข้า\n\nในหลายโอกาส [owner.GetSheHe] ได้พิสูจน์ให้เห็นว่า[owner.GetHerselfHimself]เป็น[owner.GetWomanMan]ที่พึ่งพาได้และตรงไปตรงมา โดยมุ่งหวังเพียงผลประโยชน์ที่ดีที่สุดของข้า"
 befriend_outcome.0002.succ.desc:0 "เป็นที่ชัดเจนมาระยะหนึ่งแล้วว่า [owner.GetTitledFirstName] พยายามที่จะ[GetScheme('befriend').GetTypeName|l]ข้า\n\nข้าเริ่มตระหนักแล้วว่า [owner.GetTitledFirstName] และข้ามีสิ่งใดที่เหมือนกันมากเพียงใด และ[owner.GetSheHe]ได้พิสูจน์ให้เห็นแล้วว่า[owner.GetHerselfHimself]เป็นคนที่พึ่งพาได้มากเพียงใดในช่วงไม่กี่เดือนที่ผ่านมา"
 befriend_outcome.0002.fail.desc:1 "เป็นที่ชัดเจนมาระยะหนึ่งแล้วว่า [owner.GetTitledFirstName] พยายามที่จะ[GetScheme('befriend').GetTypeName|l]ข้า\n\nข้าอดรู้สึกหงุดหงิดไม่ได้ที่จู่ๆ [owner.GetTitledFirstNamePossessive] ก็หันมาสนใจข้า และข้าก็สลัดความรู้สึกที่ว่าเจตนาของ[owner.Custom('WomanManPossessive')]นั้นไม่บริสุทธิ์ทิ้งไปไม่ได้..."
 befriend_outcome.0002.critfail.desc:1 "เป็นที่ชัดเจนมาระยะหนึ่งแล้วว่า [owner.GetTitledFirstName] พยายามที่จะ[GetScheme('befriend').GetTypeName|l]ข้า\n\nข้าอดรู้สึกหงุดหงิดไม่ได้ที่จู่ๆ [owner.GetTitledFirstNamePossessive] ก็หันมาสนใจข้า และยิ่งไปกว่านั้น ความพยายามอย่างเอาเป็นเอาตายของ[owner.GetHerHis]ที่จะทำให้ข้าประทับใจ รวมถึงการแสดงความรักจอมปลอมอย่างเงอะงะ ยิ่งทำให้ข้าเกลียดชัง[owner.GetHerHim]มากขึ้น"
 befriend_outcome.0002.a:0 "ช่างหาได้ยากยิ่งที่จะพบเพื่อนแท้"
 befriend_outcome.0002.b.success:0 "เราควรใช้เวลาอยู่ด้วยกันมากขึ้น!"
 befriend_outcome.0002.b.failure:0 "แต่ [owner.GetSheHe] ก็ยังมีเสน่ห์บางอย่าง..."
 befriend_outcome.0002.c.success:0 "ข้ายังไม่มั่นใจ"
 befriend_outcome.0002.c.failure:0 "ทำไม [owner.GetSheHe] ถึงไม่ปล่อยให้ข้าอยู่อย่างสงบเสียที?"
 befriend_outcome.0002.d:0 "ข้าไม่อยากเห็นหน้า [owner.GetHerHis] อีกเลย!"

 befriend_outcome.2004.t:0 "ผูกมิตร: จิตใจที่คล้ายคลึงกัน"
 befriend_outcome.2004.spouse:0 "\n\nเมื่อเรากลับไปที่ห้องพักของเราในตอนเย็น ข้ารู้สึกได้ว่า [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('target'))] ของข้าดูสบายใจและเห็นด้วยกับข้ามากขึ้น"
 befriend_outcome.2004.relative:0 "\n\nข้ายินดีที่ได้มีโอกาสกระชับความสัมพันธ์ในครอบครัวของเรา และตัดสินจากท่าทีของ [ROOT.Char.Custom2('RelationToMePossessive', SCOPE.sC('target'))] ของข้าในตอนเย็น [target.GetSheHe] ก็ เช่นกัน"
 befriend_outcome.2004.vassal:0 "\n\nในตอนท้ายของมื้อค่ำ [target.GetTitledFirstNameNoTooltip] บอกข้าว่า [target.GetSheHe] รู้สึกขอบคุณเพียงใดที่มีเจ้าเหนือหัวที่ มีน้ำใจต้อนรับ และเป็นมิตร เช่นนี้ และ [target.GetSheHe] หวังว่าจะมีโอกาสตอบแทนความเมตตาของข้าในอนาคต"
 befriend_outcome.2004.liege:0 "\n\nเพื่อเป็นการแสดงความขอบคุณ เพียงไม่กี่วันหลังจากการพบปะส่วนตัวของเรา [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('target'))] ของข้าตัดสินใจยกย่องความ มีน้ำใจต้อนรับ ของข้าต่อหน้าทั้งราชสำนัก โดยกล่าวว่า [target.GetSheHe] โชคดีที่มีข้าหลวงที่ภักดีและให้การต้อนรับ เช่นข้าอยู่ภายใต้การคุ้มครองของ [target.GetHerHis]"
 befriend_outcome.2004.outsider:0 "\n\nในท้ายที่สุด ระยะทางก็ไม่ใช่อุปสรรคใหญ่หลวงสำหรับข้าที่จะเอาชนะเพื่อได้รับความไว้วางใจและมิตรภาพจาก [target.GetTitledFirstNamePossessiveNoTooltip] ข้าได้ แต่หวังว่าสายสัมพันธ์ที่เราสร้างขึ้นในวันนี้จะแข็งแกร่งขึ้นในอีกหลายปีข้างหน้า"
 befriend_outcome.2004.fallback:0 "\n\nข้าได้เรียนรู้มากมายเกี่ยวกับ [target.GetTitledFirstNameNoTooltip] ในระหว่างการเผชิญหน้าของเรา และข้ามั่นใจว่า [target.GetHerHim] ก็ เช่นกัน ข้าคิดว่าค่ำคืนที่ใช้เวลาร่วมกันนี้ช่วยให้เราพัฒนาความไว้วางใจ ซึ่งกันและกันได้มาก"


 befriend_outcome.6004.spouse:0 "\n\nเมื่อเรากลับไปที่ห้องพักของเราในตอนเย็น ข้ามั่นใจว่าข้าจะสามารถไว้วางใจ [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('target'))] ของข้าได้อย่างสมบูรณ์ และรู้ว่า [target.GetSheHe] ก็รู้สึก เช่นเดียวกันกับข้า"
 befriend_outcome.6004.relative:0 "\n\nข้ายินดีที่ได้มีโอกาสกระชับความสัมพันธ์ในครอบครัวของเรา และเมื่อสิ้นสุดมื้อค่ำ ข้ามั่นใจอย่างยิ่งว่า [ROOT.Char.Custom2('RelationToMePossessive', SCOPE.sC('target'))] ของข้ารู้สึก เช่นเดียวกัน"
 befriend_outcome.6004.vassal:0 "\n\nเมื่อสิ้นสุดมื้อค่ำ [target.GetTitledFirstNameNoTooltip] ก็มั่นใจพอๆ กันว่าข้าคำนึงถึงผลประโยชน์สูงสุดของ [target.GetHerHis] เช่นเดียวกับที่ข้ามั่นใจว่า [target.GetSheHe] คำนึงถึงผลประโยชน์ของข้า ด้วยความพยายามของข้า เราได้สร้างสายสัมพันธ์แห่งความไว้วางใจและความภักดี ซึ่งหาได้ยากยิ่งระหว่างเจ้าเหนือหัวและข้าหลวง"
 befriend_outcome.6004.liege:0 "\n\nเพื่อเป็นการแสดงความขอบคุณ เพียงไม่กี่วันหลังจากการพบปะส่วนตัวของเรา [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('target'))] ของข้าตัดสินใจยกย่องความ มีน้ำใจต้อนรับ ของข้าต่อหน้าทั้งราชสำนัก โดยกล่าวว่า [target.GetSheHe] โชคดีที่มีข้าหลวงที่ภักดีและให้การต้อนรับ เช่นข้าอยู่ภายใต้การคุ้มครองของ [target.GetHerHis] และ [target.GetSheHe] ภูมิใจที่เรียกข้าว่าเป็นเพื่อนของ [target.GetHerHis]"
 befriend_outcome.6004.outsider:0 "\n\nในท้ายที่สุด ระยะทางก็ไม่ใช่อุปสรรคใหญ่หลวงสำหรับข้าที่จะเอาชนะเพื่อได้รับความไว้วางใจและมิตรภาพจาก [target.GetTitledFirstNamePossessiveNoTooltip] เราทั้งคู่ได้เรียนรู้มากมายเกี่ยวกับกันและกันในระหว่างการเผชิญหน้าของเรา มากเสียจนเราจากกันในฐานะเพื่อน"

 befriend_outcome.4004.t:0 "ผูกมิตร: ความแตกต่างที่ไม่อาจประนีประนอมได้"
 befriend_outcome.4004.spouse:0 "แม้ว่าข้าจะพยายามอย่างดีที่สุดเพื่อสร้างความประทับใจให้ [target.GetTitledFirstName] แต่ [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('target'))] ของข้าก็ยังคงปฏิบัติต่อข้าด้วยความไม่ไว้วางใจและห่างเหิน"
 befriend_outcome.4004.relative:0 "ข้าคิดว่าการกระชับความสัมพันธ์ระหว่าง [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('target'))] ของข้ากับข้าจะเป็นเรื่องง่าย... ข้าคิดผิดไปมาก แม้ว่าข้าจะพยายามอย่างดีที่สุด [target.GetTitledFirstName] ดูเหมือนจะไม่สนใจที่จะใช้เวลากับข้าหรือเรียนรู้เพิ่มเติมเกี่ยวกับความสนใจของข้าเลย"
 befriend_outcome.4004.vassal: "แม้ว่าข้าจะพยายามหลายครั้งเพื่อได้รับความไว้วางใจจาก [target.GetTitledFirstNamePossessive] [target.GetSheHe] ก็ยังคงรักษาระยะห่างของ[target.GetHerHis]เมื่อพูดคุยกับข้า ความแตกต่างทางยศศักดิ์ของเราดูเหมือนจะเป็นอุปสรรคที่ยิ่งใหญ่เกินกว่าที่ [target.GetHerHim] จะก้าวข้ามได้"
 befriend_outcome.4004.liege:0 "[target.GetTitledFirstName] ไม่ได้ประทับใจเลยกับความพยายามมากมายของข้าที่จะได้รับความไว้วางใจจาก [target.GetHerHis] เมื่อได้ยินข่าวลือที่แพร่สะพัดในราชสำนักของ [target.GetHerHis] ข้าตระหนักว่า [target.GetSheHe] มองข้าเป็นเพียงคนประจบสอพลอที่ต้องการได้รับความโปรดปรานจาก [target.GetHerHis]"
 befriend_outcome.4004.outsider:0 "น่าเสียดาย ดูเหมือนว่าความแตกต่างและระยะห่างระหว่าง [target.GetTitledFirstName] กับข้านั้นใหญ่เกินกว่าจะเอาชนะได้ ไม่ว่าข้าจะมุ่งมั่นเพียงใดก็ตาม หลังจากเวลาทั้งหมดที่ข้าใช้ไปในการพยายามได้รับความไว้วางใจจาก [target.GetHerHis] [target.GetTitledFirstNameNoTooltip] ก็ไม่ได้แสดงการเปลี่ยนแปลงใดๆ ในทัศนคติที่มีต่อข้า"
 befriend_outcome.4004.ending:0 "\n\nข้าเกรงว่าจะไม่มีอะไรเหลือให้ข้าทำได้อีกมากนักเพื่อเชื่อมช่องว่างระหว่างเรา ณ จุดนี้"
 
 befriend_outcome.8005.desc:0 "ข้าช่างโง่เขลาที่หวังว่าจะเปลี่ยนใจ [target.GetTitledFirstNamePossessive] ที่มีต่อข้าได้ \n\n[target.GetSheHe|U] เอา แต่ฉวยโอกาสจากความเปิดเผยและความเป็นมิตรของข้าที่มีต่อ [target.GetHerHim] เมื่อเร็วๆ นี้ เพื่อเยาะเย้ยข้าอย่างเปิดเผย โดยอ้างว่าข้าเป็นเพียง [owner.GetWomanMan] ที่น่าสมเพชไร้เพื่อนฝูง กระตือรือร้นที่จะขายหน้า [owner.GetHerselfHimself] เพียง เพราะกลัวความเหงา"
 befriend_outcome.8005.a:0 "ข้าควรจะคาดหวังสิ่งนี้จาก [target.GetHerHim]"
 befriend_outcome.2005.t:0 "ผูกมิตร: ยุติความขัดแย้ง"
 befriend_outcome.2005.relative:0 "ไม่ใช่เรื่องง่ายที่จะโน้มน้าว [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('target'))] ของข้าถึงความจริงใจในเจตนาของข้าในตอนแรก แต่ทีละเล็กทีละน้อย ข้าก็สามารถ ทำให้ [target.GetHerHim] เข้าใจได้ว่าข้าพร้อมที่จะยุติความเป็นปฏิปักษ์ของเราเพื่อประโยชน์ของทั้งสองฝ่าย"
 befriend_outcome.2005.vassal:0 "ไม่ใช่สัญญาณที่ดีเลยเมื่อเจ้าเหนือหัวขัดแย้งกับข้าหลวงของ [owner.GetHerHis] เอง ด้วยความพยายามทางการทูตของข้า ข้าสามารถยุติความขัดแย้งที่ข้ามีกับ [target.GetTitledFirstName] ได้\n\nหากโชคดี เราจะสามารถเรียนรู้ที่จะไว้วางใจ ซึ่งกันและกันมากขึ้นเมื่อเราก้าวไปข้างหน้า สำหรับตอนนี้ ข้าเพียงดีใจที่ไม่ถือว่า [target.GetHerHim] เป็นศัตรูอีกต่อไป"
 befriend_outcome.2005.liege:0 "ความมั่นคงของอาณาจักรใดๆ ขึ้นอยู่กับข้อตกลงที่เคารพ ซึ่งกันและกันระหว่างเจ้าเหนือหัวและข้าหลวงของ [target.GetHerHis] ข้ายินดีที่สามารถโน้มน้าว [target.GetTitledFirstName] ได้ว่าความขัดแย้งระหว่างเราจะนำมา ซึ่งความทุกข์ทรมานที่ไม่จำเป็นแก่ราษฎรของเราเท่านั้น\n\nทำให้ข้ารู้สึกโล่งใจอย่างยิ่งที่รู้ว่าในที่สุดเราก็ได้ยุติความแตกต่างของเราแล้ว"
 befriend_outcome.2005.fallback:0 "ไม่ใช่เรื่องง่ายที่จะโน้มน้าวให้ [target.GetTitledFirstName] พบข้าเพื่อยุติความแตกต่างของเรา แต่เมื่อในที่สุดข้าสามารถนั่งลงกับ [target.GetHerHim] และอธิบายเหตุผลของข้าสำหรับความขัดแย้งในอดีตของเรา ข้าพบว่า [target.GetHerHim] มีเหตุผลมากกว่าที่ข้ากลัวไว้มาก"
 befriend_outcome.2005.a:0 "ในที่สุดเราก็สามารถเริ่มต้นใหม่ได้"
 befriend_outcome.8006.t:0 "ผูกมิตร: การเมืองที่ไม่อาจประนีประนอมได้"
 befriend_outcome.8006.desc:0 "ข้าใช้เวลาสัปดาห์ที่แล้วพบปะกับ [target.GetTitledFirstName] พยายาม ทำให้ [target.GetHerHim] เข้าใจว่าไม่มีความจำเป็นที่เราจะต้องเป็นศัตรูกัน\n\nน่าเสียดาย ดูเหมือนว่าความพยายามของข้าที่จะเอาใจฝ่ายของ [target.GetHerHis] มี แต่จะกระตุ้นให้มันแข็งแกร่งขึ้น"
 befriend_outcome.8006.everyfactionmember.custom:0 "สมาชิกทุกคนของ [faction|E] ของ [target.GetTitledFirstNamePossessive]"
 befriend_outcome.8006.a:0 "ข้าไม่ควรไว้ใจ [target.GetWomanMan] คนนั้นเลย"
 befriend_outcome.8007.t:0 "ผูกมิตร: ราคาของความไว้วางใจ"
 befriend_outcome.8007.desc:0 "เมื่อคืนนี้ ในความพยายามครั้งสุดท้ายที่จะได้รับความรักจาก [ROOT.Char.Custom2('RelationToMePossessive', SCOPE.sC('target'))] ของข้า ข้าตัดสินใจเปิดเผยความลับที่น่าอับอายที่สุดอย่างหนึ่งของข้าให้ [target.GetHerHim] ทราบ ข้าหวังว่าความซื่อสัตย์ของข้าจะช่วยลดช่องว่างระหว่างเรา แต่ข้าคิดผิดอย่างมหันต์\n\n[target.GetSheHe|U] กำลังขู่ว่าจะเปิดโปงความลับของข้าต่อทั้งราชสำนัก เว้น แต่ข้าจะยอมทำตามข้อเรียกร้องของ [target.GetHerHis]!"
 befriend_outcome.8007.a:0 "ก็ได้! ท่านต้องการเท่าไหร่?"
 befriend_outcome.8007.b:0 "อะไรก็ได้ที่ท่านพูด ที่รัก!"
 befriend_outcome.8007.c:0 "ข้าจะไม่ถูกแบล็กเมล์โดย [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('target'))] ของข้าเอง!"
 befriend_outcome.8008.t:0 "ผูกมิตร: ความขัดแย้งทางศาสนา"
 befriend_outcome.8008.desc:0 "น่าเสียดาย ดูเหมือนว่า [target.GetTitledFirstName] เชื่อว่าความพยายามของข้าที่จะได้รับความไว้วางใจจาก [target.GetHerHis] เป็นเพียงอุบาย เพื่อให้ได้รับการอภัยบาปในสายพระเนตรของ [ROOT.Char.GetFaith.HighGodNameAlternate]\n\nราวกับว่าการปฏิเสธข้อเสนอเป็นเพื่อนของข้ายังไม่พอ [target.GetTitledFirstNameNoTooltip] ได้เริ่ม ทำให้ชื่อเสียงของข้าเสื่อมเสียเมื่อเทศนาแก่ผู้คนใน [owner.GetPrimaryTitle.GetName]!"
 befriend_outcome.8008.a:0 "พอแล้ว! ข้ายอมแพ้!"
 befriend_outcome.8009.t:0 "ผูกมิตร: การประจบสอพลอที่ไม่เหมาะสม"
 befriend_outcome.8009.desc:0 "ข้ามั่นใจว่าการยกย่องคุณสมบัติมากมายและความเป็นผู้นำที่มีความสามารถของ [target.GetTitledFirstNamePossessive] ต่อสาธารณะจะช่วยให้ข้าได้รับความโปรดปรานจาก [target.GetHerHis] น่าเศร้า ข้าคิดผิดอย่างมหันต์\n\nทันทีที่ข้ากล่าวสุนทรพจน์จบ [target.GetTitledFirstNameNoTooltip] ก็เยาะเย้ยข้าต่อหน้าทั้งราชสำนัก โดยอ้างว่าข้าเป็นเพียงคนประจบสอพลอไร้กระดูกสันหลังที่พยายามยกระดับสถานะของ [owner.GetHerHis] โดยการเลียรองเท้าของผู้ที่ดีกว่า [owner.GetHerHis]"
 befriend_outcome.8009.everycourtier.custom:0 "สมาชิกทุกคนในราชสำนักของ [target.GetTitledFirstNamePossessive]"
 befriend_outcome.8009.a:0 "แต่ข้าหมายความตามนั้นทุกคำ!"
 befriend_outcome.2006.t:0 "ผูกมิตร: ความเข้าใจ ซึ่งกันและกัน"
 befriend_outcome.2006.desc:0 "ในที่สุดข้าก็โน้มน้าวให้ [target.GetTitledFirstName] ละทิ้งการสนับสนุนที่ผิดพลาดของ [target.GetHerHis] ต่อ [targeting_faction.GetName]\n\nปรากฏว่าเรามีอะไรเหมือนกันมากกว่าที่เราทั้งคู่คิดในตอนแรก"
 befriend_outcome.2006.a:0 "เป็นการดีเสมอที่ได้เห็นเหตุผลมีชัย"
 befriend_outcome.6006.t:0 "ผูกมิตร: การประนีประนอมทางการเมือง"
 befriend_outcome.6006.desc:0 "ด้วยทักษะทางการทูตอันเฉียบแหลมของข้า ข้าสามารถโน้มน้าว [target.GetTitledFirstName] ไม่เพียง แต่ให้ละทิ้งการเป็นผู้นำของ [scoped_faction.GetName] แต่ยังยุบมันทั้งหมด ซึ่งเป็นการหลีกเลี่ยงความเสี่ยงของสงครามกลางเมือง"
 befriend_outcome.6007.desc:0 "ข้าไม่อาจหยั่งรู้ได้ว่าอย่างไร แต่ [owner.GetTitledFirstName] ได้โน้มน้าวให้ [target.GetTitledFirstName] ยุบฝ่ายของ [target.GetHerHis]\n\n[target.GetSheHe|U] รวบรวมสมาชิกทั้งหมดเมื่อคืนนี้ ประกาศว่า [target.GetSheHe] เข้าใจผิดในการต่อต้าน [owner.GetTitledFirstNameNoTooltip] และ [target.GetSheHe] ปรารถนาที่จะแก้ไขความขัดแย้งของเราอย่างสันติ"
 befriend_outcome.6007.a.a:0 "[target.GetTitledFirstNameNoTooltip] ทรยศเรา!"
 befriend_outcome.6007.a.b:0 "บางที [target.GetSheHe] อาจมีเหตุผล..."

 # Travel Befriend Success Outcome
 befriend_outcome.2007.opening_travel:0 "เป็นที่น่ายินดียิ่งนัก ผู้ส่งสารคนหนึ่งของ [target.GetTitledFirstNamePossessive] ได้พบข้าที่นี่ใน [current_location.GetName] ขณะที่ข้าและคณะกำลังเดินทางไปยัง [next_destination.GetName]\n\n"
 befriend_outcome.2007.opening_no_travel:0 "เป็นที่น่ายินดียิ่งนัก ผู้ส่งสารคนหนึ่งของ [target.GetTitledFirstNamePossessive] ได้มาถึงที่นี่ ณ [ROOT.Char.Custom('FortifiedBuilding')] ของข้าใน [ROOT.Char.GetCurrentLocation.GetName]\n\n"
 befriend_outcome.2007.desc:0 "[courier.GetSheHe|U] นำข่าวดีมาให้ เพราะ [target.GetFirstNameNoTooltip] ปรารถนาที่จะ ทำให้มิตรภาพของเราเป็นทางการ! ข้าไม่เคยคาดคิดว่าเราจะสนิทสนมกันถึงเพียงนี้ แต่ [target.GetSheHe] ได้พิสูจน์ [target.GetHerselfHimself] ว่าเป็น [target.GetWomanMan] ที่น่าเชื่อถือและตรงไปตรงมา โดยคำนึงถึงผลประโยชน์สูงสุดของข้าเท่านั้น"
