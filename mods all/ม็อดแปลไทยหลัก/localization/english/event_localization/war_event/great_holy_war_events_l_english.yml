l_english: 
 #
 great_holy_war.0011.christian.t:0 "ราชาครูเสด"
 great_holy_war.0011.muslim.t:0 "การฟื้นฟูญิฮาด"
 great_holy_war.0011.pagans.t:0 "พระพิโรธแห่งทวยเทพโบราณ"
 great_holy_war.0011.fallback.t:0 "เหล่านักรบ [awakening_faith.GetAdherentNamePlural]"
 great_holy_war.0011.catholic.rome.desc:0 "โรม นครแห่งนักบุญเปโตรและศูนย์กลางแห่งสันตะสำนัก บัดนี้ตกอยู่ในเงื้อมมือของผู้ไร้ศรัทธา ด้วยเหตุนี้ พระสันตะปาปาผู้ลี้ภัย ใต้ฝ่าพระบาท [ghw_first_sponsor.GetTitledFirstName] จึงได้ประกาศเจตจำนงของ[ghw_first_sponsor.GetHerHis]ที่จะสร้างพันธมิตรแห่งเหล่าขุนนางคริสเตียนเพื่อทวงคืนนครนิรันดร์"
 great_holy_war.0011.christian.europe.desc:0 "ดินแดนใจกลางของคริสต์ศาสนาตะวันตกกำลังถูกล้อมโดยผู้ไร้ศรัทธา! เหล่าขุนนางคริสเตียนผู้สิ้นหวังได้โน้มน้าวใต้ฝ่าพระบาท [ghw_first_sponsor.GetTitledFirstName] ให้ประกาศเจตจำนงของ[ghw_first_sponsor.GetHerHis]ที่จะสร้างพันธมิตรอันชอบธรรมเพื่อขับไล่คนนอกศาสนาในนามแห่ง [awakening_faith.WarGodName]"
 great_holy_war.0011.christian.byzantion.desc:0 "จักรวรรดิโรมันตะวันออก ไบแซนไทน์—ปราการอันแข็งแกร่งของคริสต์ศาสนาต่อต้านพวกนอกรีตโมฮัมเหม็ดแห่งตะวันออก—กำลังล่มสลาย สถานการณ์อันเลวร้ายได้โน้มน้าว [ghw_first_sponsor.GetHerHis|U] ผู้ทรงความศักดิ์สิทธิ์ [ghw_first_sponsor.GetTitledFirstName] ให้ยอมรับความเป็นไปได้ของการรุกรานอย่างเต็มรูปแบบโดยกองกำลังคริสเตียนร่วม"
 great_holy_war.0011.catholic.jerusalem.desc:0 "ผู้แสวงบุญชาวคริสต์ไปยังดินแดนศักดิ์สิทธิ์ต้องทนทุกข์ทรมานจากการถูกข่มเหงทุกรูปแบบ และเส้นทางของพวกเขาก็เต็มไปด้วยอันตราย\n\nเพื่อปกป้องผู้แสวงบุญและรักษาเยรูซาเล็มไว้เพื่อพระคริสต์และผู้ศรัทธา [ghw_first_sponsor.GetHerHis|U] ผู้ทรงความศักดิ์สิทธิ์ [ghw_first_sponsor.GetTitledFirstName] ได้ยอมรับความเป็นไปได้ของการรุกรานอย่างเต็มรูปแบบโดยกองกำลังคริสเตียนร่วม"
 great_holy_war.0011.christian.fallback.desc:0 "นานเกินไปแล้วที่เหล่าผู้ศรัทธา [awakening_faith.GetAdjective] ถูกกระทำทารุณโดยพวกนอกรีตและผู้ไร้ศรัทธา เราจักไม่ทนให้สถานที่ศักดิ์สิทธิ์ของเราถูกทำลายโดยผู้หมิ่นประมาทศาสนาอีกต่อไป ความเชื่อของเราถูกเยาะเย้ยโดยศาสดาจอมปลอม ถึงเวลาแล้วที่เหล่าสาวกที่แท้จริงของ [awakening_faith.WarGodName] จะรวมตัวกันและตอบโต้เหล่าผู้ไม่เชื่อ!"
 great_holy_war.0011.muslim.mecca.desc:0 "สิ่งที่คาดไม่ถึงได้เกิดขึ้นแล้ว! นครศักดิ์สิทธิ์เมกกะได้ตกอยู่ใต้อำนาจของพวกนอกรีต และบัดนี้กะอ์บะฮ์กำลังถูก ทำให้มัวหมองด้วยการปรากฏตัวของพวกเขา [ghw_first_sponsor.GetHerHis|U] ผู้ทรงอำนาจ [ghw_first_sponsor.GetTitledFirstName] ได้ประกาศว่ายุคแห่งการญิฮาดครั้งใหม่ได้มาถึงโลกแล้ว นครศักดิ์สิทธิ์จะต้องถูกยึดคืนมาให้ได้ไม่ว่าจะต้องแลกด้วยอะไรก็ตาม ผู้ศรัทธามุสลิมผู้ชอบธรรมทุกคนควรเตรียมพร้อมที่จะเข้าร่วมกองทัพมุญาฮิดีนสำหรับการต่อสู้ที่กำลังจะมาถึง"
 great_holy_war.0011.muslim.jerusalem.desc:0 "นครศักดิ์สิทธิ์เยรูซาเล็ม ที่ ซึ่งศาสดาถูกนำขึ้นสู่สวรรค์ ได้ตกอยู่ใต้อำนาจของพวกนอกรีตแล้ว! [ghw_first_sponsor.GetHerHis|U] ผู้ทรงอำนาจ [ghw_first_sponsor.GetTitledFirstName] จะไม่ยอมให้สิ่งนี้เกิดขึ้นและได้ประกาศว่ายุคแห่งการพิชิตครั้งใหญ่ได้มาถึงเราอีกครั้ง เช่นเดียวกับในสมัยของเคาะลีฟะฮ์องค์แรกๆ ดินแดนอิสลามต้องได้รับการปกป้อง! ผู้ศรัทธามุสลิมผู้ชอบธรรมทุกคนควรเตรียมพร้อมที่จะเข้าร่วมกองทัพมุญาฮิดีนสำหรับการต่อสู้ที่กำลังจะมาถึง"
 great_holy_war.0011.muslim.arabia.desc:0 "ประชาชาติอิสลามกำลังตกอยู่ภายใต้ภัยคุกคามร้ายแรงจากการรุกรานของ [ghw_first_sponsor.Custom('GetDerogatoryNonbelieverPlural')] ณ ใจกลางดินแดน เพื่อการตอบโต้ องค์[ghw_first_sponsor.GetHerHis|U]ผู้ทรงเกียรติ [ghw_first_sponsor.GetTitledFirstName] ได้ประกาศว่ายุคแห่งการญิฮาดครั้งใหม่ได้บังเกิดขึ้นบนโลกหล้า ดินแดนหลักแห่งดารุลอิสลามจักต้องถูกยึดกลับคืนมาไม่ว่าจะต้องแลกด้วยสิ่งใด เหล่าผู้ศรัทธาชาวมุสลิมผู้เที่ยงธรรมทั้งปวงพึงเตรียมพร้อมเข้าร่วมในแถวทัพแห่งมุญาฮิดีนสำหรับการต่อสู้ อันจะมาถึงนี้"
 great_holy_war.0011.muslim.africa.desc:0 "ประชาชาติอิสลามกำลังตกอยู่ภายใต้ภัยคุกคามร้ายแรงจากการรุกรานของ [ghw_first_sponsor.Custom('GetDerogatoryNonbelieverPlural')] ในแอฟริกา เพื่อการตอบโต้ องค์[ghw_first_sponsor.GetHerHis|U]ผู้ทรงเกียรติ [ghw_first_sponsor.GetTitledFirstName] ได้ประกาศว่ายุคแห่งการญิฮาดครั้งใหม่ได้บังเกิดขึ้นบนโลกหล้า ดินแดนฟากตะวันตกแห่งประชาชาติอุมมะฮ์จักต้องถูกยึดกลับคืนมาไม่ว่าจะต้องแลกด้วยสิ่งใด เหล่าผู้ศรัทธาชาวมุสลิมผู้เที่ยงธรรมทั้งปวงพึงเตรียมพร้อมเข้าร่วมในแถวทัพแห่งมุญาฮิดีนสำหรับการต่อสู้ อันจะมาถึงนี้"
 great_holy_war.0011.muslim.fallback.desc:0 "บ้านแห่งอิสลามกำลังตกอยู่ภายใต้ภัยคุกคามร้ายแรงจากผู้ไร้ศรัทธาและผู้ละทิ้งศาสนา เหล่าผู้ศรัทธา [awakening_faith.GetAdjective] ผู้ชอบธรรมทั้งปวงพึงเตรียมพร้อมเข้าร่วมกองทัพมุญาฮิดีนสำหรับการต่อสู้ที่กำลังจะมาถึง นี่เป็นสัญญาณของยุคแห่งการขยายตัวของอิสลามครั้งใหม่"
 great_holy_war.0011.generic.fallback.head.desc:0 "เมื่อเหล่าผู้ศรัทธา [awakening_faith.GetReligion.GetAdjective] ถูกรุมล้อมจากทุกทิศทางโดยผู้หมิ่นประมาทศาสนา [ghw_first_sponsor.GetTitledFirstName] ได้ตัดสินใจว่าถึงเวลาแล้วที่เหล่านักรบทั้งปวงของ [awakening_faith.WarGodName] จะจับอาวุธขึ้นปกป้องดินแดนศักดิ์สิทธิ์ของตนโดยการวางแผนการทัพอันยิ่งใหญ่เพื่อการพิชิตทางศาสนา"
 great_holy_war.0011.generic.fallback.desc:0 "เรามิอาจนิ่งเฉยดูดายได้อีกต่อไปเมื่อผู้หมิ่นประมาทศาสนารุมล้อมเราจากทุกด้าน ทำลายล้างสถานที่ศักดิ์สิทธิ์ของเราและกระทำทารุณต่อพี่น้องของเรา ถึงเวลาแล้วที่เหล่านักรบแห่ง [awakening_faith.WarGodName] จะจับอาวุธขึ้น รวมเป็นหนึ่งภายใต้จุดประสงค์เดียวกัน"
 great_holy_war.0011.generic.ending.positive:0 "\n\nนี่เป็นสัญญาณแห่งการเริ่มต้นยุคใหม่ของสงครามศักดิ์สิทธิ์อันยิ่งใหญ่ของ [awakening_faith.GetReligion.GetAdjective] — [awakening_faith.GHWNamePlural]"
 great_holy_war.0011.generic.ending.negative:0 "\n\nนี่อาจเป็นการเริ่มต้นของการรุกรานอย่างไม่เคยปรากฏมาก่อนของ [awakening_faith.GetReligion.GetAdjective]"
 great_holy_war.0011.generic.ending.coreligionist.head:0 "\n\nผลกระทบทางเทววิทยาของข่าวนี้กำลังถูกหารือโดย [other_pope.GetTitleTierName] และสมาชิกคนสำคัญอื่นๆ ในคณะสงฆ์ของเรา ผู้ ซึ่งกระตือรือร้นที่จะปฏิบัติตามแบบอย่างของ [awakening_faith.GetAdherentNamePluralNoTooltip] และเริ่มต้นยุคใหม่ของสงครามศาสนาในนามแห่ง [ROOT.Char.GetFaith.GetNameNoTooltip]"
 great_holy_war.0011.generic.ending.coreligionist.autonomous:0 "\n\nผลกระทบทางเทววิทยาของข่าวนี้กำลังถูกหารือโดยสมาชิกคนสำคัญหลายคนในคณะสงฆ์ของเรา ผู้ ซึ่งกระตือรือร้นที่จะปฏิบัติตามแบบอย่างของ [awakening_faith.GetAdherentNamePluralNoTooltip] และเริ่มต้นยุคใหม่ของสงครามศาสนาในนามแห่ง [ROOT.Char.GetFaith.GetNameNoTooltip]"
 great_holy_war.0011.directed.a:0 "กองทัพของข้าจักเข้าร่วมการทัพทันที!"
 great_holy_war.0011.directed.b:0 "ข้าจักปกป้องเพื่อนร่วมศรัทธา [ROOT.Char.GetFaith.GetAdherentNamePluralNoTooltip] ของข้า!"
 great_holy_war.0011.a:1 "พระเจ้าทรงประสงค์!"
 great_holy_war.0011.b:0 "อัลลอฮุอักบัร!"
 great_holy_war.0011.c:1 "[ROOT.Char.GetFaith.WarGodName|U] สถิตอยู่กับเรา!"
 great_holy_war.0011.d:1 "[ROOT.Char.GetFaith.WarGodName|U] โปรดคุ้มครองเรา!"
 great_holy_war.0011.e:0 "หากพวกเขาว่า เช่นนั้น..."
 great_holy_war.0011.tooltip.effect:0 "[faiths|E] [awakening_faith.GetReligion.GetAdjective] บัดนี้สามารถเข้าถึง [awakening_faith.GHWNamePlural] ได้แล้ว"
 great_holy_war.0015.opening:0 "[scoped_pope.Custom2('AppropriateGreeting', ROOT.Char)]"
 great_holy_war.0016.custom:0 "ข้าหลวง [theocratic|E] [scoped_pope.GetFaith.GetAdjective] ทุกคน"
 great_holy_war.0015.desc:0 "ด้วยการให้คำมั่นว่าจะสนับสนุนการต่อสู้อันชอบธรรมต่อต้านผู้ไร้ศรัทธา ท่านได้ไถ่บาปตนเองในสายพระเนตรของ [scoped_pope.GetFaith.WarGodName] แล้ว ด้วยเหตุนี้ เราจึงเห็นว่าท่านคู่ควรที่จะเข้าร่วมพิธีมหาสนิทศักดิ์สิทธิ์อีกครั้ง"
 great_holy_war.0015.a:0 "ถึงเวลาเสียที..."
 great_holy_war.0015.b:0 "แท้จริงแล้ว [scoped_pope.GetFaith.WarGodName] ทรงเปี่ยมเมตตา!"
 great_holy_war.0016.desc.a:1 "เราผิดหวังอย่างยิ่งต่อการตัดสินใจของท่านที่จะละทิ้งอุดมการณ์อันชอบธรรมแห่ง [scoped_pope.GetFaith.GHWName] ของเรา เราจักไม่ลืมการดูหมิ่นของท่านต่อ [scoped_pope.GetFaith.WarGodName] และ [scoped_pope.GetFaith.WarGodSheHe|U] ก็ เช่นกัน"
 great_holy_war.0016.desc.b:0 "เราผิดหวังและไม่สบายใจอย่างยิ่งที่ได้ทราบถึงการตัดสินใจของท่านที่จะละทิ้งอุดมการณ์อันชอบธรรมแห่ง [scoped_pope.GetFaith.GHWName] ของเรา ท่านได้ ทำให้ตนเองเสื่อมเสียเกียรติต่อหน้าสายพระเนตรของ [scoped_pope.GetFaith.WarGodName] ด้วยการหมิ่นประมาทศาสนานี้"
 great_holy_war.0016.desc.c:0 "เราจักไม่ทนต่อพฤติกรรมหมิ่นประมาทศาสนาของท่าน การปฏิเสธที่จะให้คำมั่นว่าจะสนับสนุน [scoped_pope.GetFaith.GHWName] อันศักดิ์สิทธิ์ของเรา ทำให้เราไม่มีทางเลือกอื่นนอกจากขับไล่ท่าน นับจากนี้ไป ท่านถูกห้ามมิให้เข้าร่วมพิธีมหาสนิทศักดิ์สิทธิ์"
 great_holy_war.0016.a:0 "ข้ามีเรื่องอื่นที่สำคัญกว่าให้กังวล"
 great_holy_war.0016.b:0 "ข้าทำอะไรลงไป?!"
 great_holy_war.0017.title:0 "การละทิ้ง [scoped_pope.GetFaith.GHWName]"
 great_holy_war.0017.desc.a:0 "การละทิ้งคำมั่นสัญญาของข้าต่อ [scoped_pope.GetFaith.GHWName] จะลดทอนสถานะของข้าในสายตาของคณะสงฆ์อย่างแน่นอน และอาจก่อให้เกิดพระพิโรธแห่งสันตะสำนัก \n\nข้าควรพิจารณาผลที่อาจตามมาของการกระทำนี้อย่างจริงจังก่อนที่จะตัดสินใจ เนื่องจากข้าเสี่ยงที่จะถูกตราหน้าว่าเป็นพวกนอกรีตในสายตาของศาสนจักร"
 great_holy_war.0017.desc.b:0 "การละทิ้งคำมั่นสัญญาของข้าต่อ [scoped_pope.GetFaith.GHWName] จะลดทอนสถานะของข้าในสายตาของคณะสงฆ์อย่างแน่นอน และอาจก่อให้เกิดความโกรธเคืองของ [scoped_pope.GetTitledFirstName] ข้าควรพิจารณาผลที่อาจตามมาของการกระทำนี้อย่างจริงจังก่อนที่จะตัดสินใจ เนื่องจากข้าเสี่ยงที่จะถูกตราหน้าว่าเป็นผู้หมิ่นประมาทศาสนา"
 great_holy_war.0017.a:0 "ข้าไม่ใส่ใจ"
 great_holy_war.0017.b:0 "บางทีข้าอาจจะรีบร้อนเกินไป..."
 great_holy_war.0018.desc:0 "หากข้าให้คำมั่นสัญญาต่อ [scoped_pope.GetFaith.GHWName] ข้าจักต้องระดมกองทัพและเดินทัพต่อสู้ศัตรูแห่งศรัทธาเมื่อถึงเวลา \n\nเนื่องจากการกลับคำอาจก่อให้เกิดความโกรธเคืองของ [scoped_pope.GetTitledFirstName] ข้าควรพิจารณาการตัดสินใจนี้อย่างจริงจังก่อนที่จะนำอาณาจักรของข้าเข้าสู่การต่อสู้"
 great_holy_war.0018.a:0 "ข้าจักเข้าร่วมกองทัพแห่ง [scoped_pope.GetFaith.WarGodName]!"
 great_holy_war.0018.b:0 "ข้าต้องขบคิดเรื่องนี้อีกสักหน่อย..."
 great_holy_war.0003.title:0 "เหล่าผู้ศรัทธาเตรียมพร้อมสำหรับสงคราม"
 great_holy_war.0003.catholic.desc:1 "ทูตของพระสันตะปาปาได้มาถึงราชสำนักของข้า นำข่าวสารจากวาติกันมาแจ้ง [ghw_sponsor.GetTitledFirstName] ได้ออกประกาศเรียกระดมพลแก่ผู้ปกครองคริสเตียนผู้ชอบธรรมทั้งปวง ในฐานะ [ROOT.Char.GetTitleAsNameNoTooltip] ผู้เป็น [ROOT.Char.GetFaith.GetAdherentNameNoTooltip] ข้าถูกคาดหวังให้เตรียมกำลังพลเพื่อสนับสนุนอุดมการณ์อันศักดิ์สิทธิ์ยิ่งนี้ ซึ่งได้รับการสนับสนุนจากศาสนจักรสากลเอง\n\nสำหรับทุกคนที่จะเข้าร่วมการต่อสู้กับ [target_character.Custom('GetUnbelieverNamePlural')] อันชั่วร้ายที่กำลังทำลายล้างดินแดนศักดิ์สิทธิ์แห่ง [target_kingdom.GetBaseNameNoTier] สันตะสำนักสัญญาว่าจะให้อภัยบาปทั้งปวงอย่างสมบูรณ์และรับประกันตำแหน่งในสรวงสวรรค์"
 great_holy_war.0003.fallback.desc:0 "ข่าวอันรุ่งโรจน์ได้มาถึงราชสำนักของข้า [ghw_sponsor.GetTitledFirstName] ได้ตัดสินใจว่าถึงเวลาแล้วที่ [ghw_sponsor.GetFaith.GetAdherentNamePluralNoTooltip] ผู้ชอบธรรมทั้งปวงจะรวมตัวกันภายใต้ธงผืนเดียวและเดินทัพต่อสู้ศัตรูแห่งศรัทธาใน [ghw_sponsor.GetFaith.GHWName] เพื่อเกียรติภูมิแห่ง [ghw_sponsor.GetFaith.WarGodName]\n\nสำหรับทุกคนที่จะเข้าร่วมภารกิจอันศักดิ์สิทธิ์นี้ [ghw_sponsor.GetTitleTierName] รับประกันตำแหน่งใน [ghw_sponsor.GetFaith.DivineRealm]"
 great_holy_war.0003.a:0 "นักรบของข้าจักพร้อมรบ!"
 great_holy_war.0003.a.tt:0 "ให้คำมั่นว่าจะเข้าร่วม [ghw_sponsor.GetFaith.GHWName] ที่เรียกโดย [ghw_sponsor.GetTitledFirstName] ทันทีที่เริ่ม"
 great_holy_war.0003.b:0 "ข้ายินดีช่วยสนับสนุนทางการเงินแก่อุดมการณ์อันศักดิ์สิทธิ์นี้"
 great_holy_war.0003.c:0 "บางทีข้าควรพิจารณาเข้าร่วม..."
 great_holy_war.0003.a.lifted_excommunication:0 "[excommunication|E] ของข้าจักถูกยกเลิก"
 great_holy_war.0023.desc:0 "เราได้รับแจ้งว่าท่านยังไม่ได้ให้คำมั่นว่าจะสนับสนุน [scoped_pope.GetFaith.GHWName] ที่กำลังจะมาถึง ข้าต้องเตือนท่านหรือไม่ว่ามันเป็นหน้าที่อันศักดิ์สิทธิ์ของท่านในฐานะ [ROOT.GetCharacter.GetTitleTierName] [scoped_pope.GetFaith.GetAdjectiveNoTooltip] ที่จะต้องทำสงครามกับผู้ไม่เชื่อและ [target_character.Custom('GetUnbelieverNamePlural')]?"
 great_holy_war.0023.desc.hooked:0 "เราได้รับแจ้งว่าท่านยังไม่ได้ให้คำมั่นว่าจะสนับสนุน [scoped_pope.GetFaith.GHWName] ที่กำลังจะมาถึง นี่เป็นสิ่งที่ยอมรับไม่ได้! ข้าเรียกร้องให้ท่านเข้าร่วมสงครามอันยิ่งใหญ่ของเราต่อต้านผู้ไม่เชื่อและ [target_character.Custom('GetUnbelieverNamePlural')] ทันที"
 great_holy_war.0003.a.hooked:0 "ข้าไม่มีทางเลือกมากนัก ข้าเข้าใจถูกไหม?"
 great_holy_war.0023.c:0 "ข้ากำลังทำหน้าที่ของข้าในการต่อสู้กับ [target_character.Custom('GetUnbelieverNamePlural')] อยู่แล้ว!"
 great_holy_war.0023.d:0 "นี่ไม่ใช่สงครามของข้า"
 great_holy_war.0024.dead.recipient.title:0 "[ghw_claimant.GetFirstNameNoTooltip] สิ้นชีพ"
 great_holy_war.0024.dead.recipient.replaced:0 "บัดนี้ [ghw_claimant.GetTitledFirstName] คือผู้มีสิทธิ์อันชอบธรรมคนใหม่ของ [the_faith.GHWName] นี้"
 great_holy_war.0024.dead.recipient.open:2 "[former_recipient.GetTitledFirstName] สิ้นชีพ ทำให้ [target_kingdom.GetBaseNameNoTier] ว่างลง เพื่อให้นักรบผู้ศักดิ์สิทธิ์ที่สุดอ้างสิทธิ์"
 great_holy_war.0028.dead.beneficiary_title:0 "ผู้รับผลประโยชน์สิ้นชีพ"
 great_holy_war.0028.dead.beneficiary:0 "ด้วยการจากไปของ [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('former_beneficiary'))] [former_beneficiary.GetFirstName] ของข้า ข้าต้องเลือกผู้รับผลประโยชน์คนใหม่สำหรับ [ROOT.Char.GetFaith.GHWName] ที่กำลังดำเนินอยู่"
 great_holy_war.0029.invalid.beneficiary_title:0 "ผู้รับผลประโยชน์ไม่ถูกต้อง"
 great_holy_war.0029.converted.beneficiary:0 "การเปลี่ยนศาสนาอันโชคร้ายของ [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('former_beneficiary'))] [former_beneficiary.GetFirstName] ของข้า ทำให้ [former_beneficiary.GetHerHim] ไม่เหมาะสมที่จะได้รับดินแดนใดๆ จาก [ROOT.Char.GetFaith.GHWName]"
 great_holy_war.0030.incapable.beneficiary:0 "โชคร้ายที่ [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('former_beneficiary'))] [former_beneficiary.GetFirstName] ของข้า ไม่อยู่ในสภาพที่จะเป็นผู้รับผลประโยชน์ของข้าได้อีกต่อไป หรือทำสิ่งอื่นใดได้เลยจริงๆ"
 great_holy_war.0030.excommunicated.beneficiary:0 "[ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('former_beneficiary'))] [former_beneficiary.GetFirstName] ของข้า ถูกขับออกจากศาสนา ด้วยเหตุนี้ [former_beneficiary.GetSheHe] จึงไม่เหมาะสมที่จะเป็นผู้รับผลประโยชน์ของข้าใน [ROOT.Char.GetFaith.GHWName] ที่กำลังดำเนินอยู่อีกต่อไป"
 great_holy_war.0030.devoted.beneficiary:0 "เนื่องจาก [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('former_beneficiary'))] [former_beneficiary.GetFirstName] ของข้า ได้ตัดสินใจปฏิญาณตนเข้ารับศีล ข้าจึงต้องเลือกผู้อื่นมาเป็นผู้รับผลประโยชน์ของข้าใน [ROOT.Char.GetFaith.GHWName] ที่กำลังดำเนินอยู่"
 great_holy_war.0030.sick.beneficiary:0 "[ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('former_beneficiary'))] [former_beneficiary.GetFirstName] ของข้า อ่อนแอและป่วยเกินไปที่จะเป็นผู้รับผลประโยชน์ของข้า ข้าต้องเลือกผู้อื่น"
 great_holy_war.0030.ruler.beneficiary:0 "เนื่องจากได้กลายเป็นผู้ปกครองที่มีภาระหน้าที่ของ [former_beneficiary.GetHerHis] เอง [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('former_beneficiary'))] [former_beneficiary.GetFirstName] ของข้า จึงไม่เหมาะสมที่จะเป็นผู้รับผลประโยชน์ของข้าอีกต่อไป"
 great_holy_war.0030.heir.beneficiary:0 "เนื่องจากได้กลายเป็นผู้สืบทอดลำดับถัดไปที่จะได้รับตำแหน่งของ [former_beneficiary.GetHerHis] เอง [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('former_beneficiary'))] [former_beneficiary.GetFirstName] ของข้า จึงไม่เหมาะสมที่จะเป็นผู้รับผลประโยชน์ของข้าอีกต่อไป"
 great_holy_war.0040.desc:0 "หีบสงครามแสดงถึงยอดรวมของการบริจาคทั้งหมดที่ทำโดยผู้สนับสนุน [ROOT.Char.GetFaith.GHWName] นี้ \n\nส่วนหนึ่งของทองคำนี้จะถูกแบ่งปันให้กับผู้เข้าร่วมเมื่อสิ้นสุดระยะเตรียมการ ในขณะที่ส่วนที่เหลือจะถูกแบ่งให้กับผู้ชนะตามการมีส่วนร่วมของพวกเขา"
 great_holy_war.0040.a:0 "ข้าจักเทคลังสมบัติเพื่ออุดมการณ์นี้!"
 great_holy_war.0040.b:0 "ข้าจักบริจาคอย่างใจกว้าง"
 great_holy_war.0040.c:0 "ข้าพอจะแบ่งเหรียญเล็กน้อยสำหรับความพยายามนี้ได้"
 great_holy_war.0040.d:0 "ข้าจักพิจารณาอย่างจริงจัง"

 great_holy_war.0050.title:1 "[the_faith.GHWName] เพื่อ [target_kingdom.GetBaseNameNoTierNoTooltip]"
 great_holy_war.0050.base.desc:0 "เหล่าผู้ปกครอง [the_faith.GetAdjectiveNoTooltip] ซึ่งได้รับแรงกระตุ้นจากการเรียกระดมพลของ [ghw_sponsor.GetTitledFirstName] ได้เริ่มรวบรวมกองทัพผู้คลั่งศาสนาขนาดใหญ่เพื่อทำ [the_faith.GHWName] ต่อต้านศัตรูทั้งปวงของ [the_faith.ReligiousSymbol] ใน [target_kingdom.GetBaseNameNoTierNoTooltip] ผู้คลั่งศาสนาจำนวนมากขึ้นเรื่อยๆ ถูกดึงดูดเข้ามาทุกวันในสิ่งที่จะกลายเป็นกองทัพอันยิ่งใหญ่ของ [the_faith.ReligiousSymbol] ในไม่ช้า ซึ่งรวมตัวกันเพื่อนำสงครามมาสู่ดินแดนของเรา"
 great_holy_war.0050.defender.desc:0 "\n\nภาระหน้าที่ตกอยู่กับข้าที่จะต้องรวบรวมเหล่าผู้ปกครอง [ROOT.Char.GetFaith.GetAdjectiveNoTooltip] ร่วมศรัทธาในภูมิภาคและเตรียมพร้อมรับมือกับกระแส [ghw_sponsor.Custom('GetUnbelieverNamePlural')] ที่กำลังจะมาถึงก่อนที่จะสายเกินไป"
 great_holy_war.0050.others.desc:1 "\n\nเราทำได้เพียงสวดภาวนาให้ [ROOT.Char.GetFaith.WarGodName] ประทานความกล้าหาญและความทรหดอดทนแก่ [target_character.GetTitledFirstName] เพื่อยืนหยัดต่อสู้กับกระแส [ghw_sponsor.Custom('GetUnbelieverNamePlural')]"
 great_holy_war.0050.a:0 "[ROOT.Char.GetFaith.WarGodName] โปรดคุ้มครองเราจาก [ghw_sponsor.Custom('GetUnbelieverNamePlural')] เหล่านี้!"
 great_holy_war.0051.catholic.attackers.desc:0 "ในที่สุดก็ถึงเวลาที่จะนำพระพิโรธอันศักดิ์สิทธิ์ของ [the_faith.WarGodNamePossessive] มาสู่ [ghw_defender.Custom('GetUnbelieverNamePlural')] อันชั่วร้ายแห่ง [target_kingdom.GetBaseNameNoTier]\n\nด้วยความโกรธแค้นอันชอบธรรมและความมุ่งมั่นอันไม่ย่อท้อ กองทัพครูเสดอันยิ่งใหญ่ที่รวบรวมโดย [ghw_sponsor.GetTitledFirstName] จึงออกเดินทางเพื่อมอบความยุติธรรมแห่งสวรรค์แก่คนชั่วและได้รับตำแหน่งของพวกเขาใน [the_faith.DivineRealm]"
 great_holy_war.0051.generic.attackers.desc:0 "ในที่สุดก็ถึงเวลาที่จะชำระล้างผืนดินแห่ง [target_kingdom.GetBaseNameNoTier] ด้วยเลือดของ [ghw_defender.Custom('GetUnbelieverNamePlural')] และอ้างสิทธิ์ในดินแดนนี้เพื่อเกียรติภูมิแห่ง [the_faith.WarGodName]\n\nนักรบศักดิ์สิทธิ์ของเราเดินทัพด้วยความมั่นใจว่า ไม่ว่าพวกเขาจะได้รับชัยชนะหรือตายในการต่อสู้กับผู้ไม่เชื่อ ความทุ่มเทของพวกเขาจะ ทำให้พวกเขาได้รับตำแหน่งใน [the_faith.PositiveAfterLife]"
 great_holy_war.0051.generic.defenders.desc:0 "ฝูงชน [ghw_sponsor.Custom('GetUnbelieverNamePlural')] ที่รวมตัวกันโดย [ghw_sponsor.GetTitledFirstName] ได้เริ่มเดินทัพมายัง [target_kingdom.GetBaseNameNoTier] แล้ว \n\nนักรบป่าเถื่อนเหล่านี้ ซึ่งได้รับแรงบันดาลใจจาก [ROOT.Char.GetFaith.DevilName] อย่างชัดเจน จักทำลายล้างดินแดนของเราและสังหารผู้คนของเราอย่างไร้ความปรานีหากเราไม่หยุดยั้งพวกเขา! เพื่อประโยชน์สุขของเหล่าผู้ศรัทธา [ghw_defender.GetFaith.GetAdjective] ทั้งปวงใน [target_kingdom.GetBaseNameNoTierNoTooltip] เราต้องได้รับชัยชนะ!"
 great_holy_war.0051.generic.start.tt:0 "[the_faith.GHWName] สำหรับ [target_kingdom.GetBaseNameNoTierNoTooltip] เริ่มต้นขึ้นทันที!"
 great_holy_war.0052.title.winners:0 "[the_faith.GHWName] อันมีชัย"
 great_holy_war.0052.title.losers:0 "พระพิโรธแห่ง [the_faith.ReligiousSymbol|U]"
 great_holy_war.0052.generic.attackers.desc:0 "[the_faith.WarGodName] ได้ประทานชัยชนะแก่ [title_recipient.GetShortUIName] ใน [the_faith.GHWName] เพื่อ [target_kingdom.GetBaseNameNoTier] หลังจากเอาชนะ [ghw_defender.GetTitledFirstName] และเหล่า [ROOT.Char.Custom('GetDerogatoryNonbelieverPlural')] ของ[ghw_defender.GetHerHis]ได้หลายครา เหล่านักรบของเราได้บีบให้เหล่าศัตรูแห่งศรัทธายอมรับความพ่ายแพ้อันน่าอดสู\n\nบัดนี้ดินแดนที่ยึดได้อยู่ภายใต้การนำของผู้นำผู้เคร่งครัดใน [the_faith.GetAdjectiveNoTooltip] อย่างมั่นคงแล้ว เราจึงวางใจได้ว่าเจตจำนงอันศักดิ์สิทธิ์ของ [the_faith.WarGodName] ได้บังเกิดผลแล้ว นี่คือวันอันรุ่งโรจน์สำหรับเหล่าสาวกที่แท้จริงแห่ง [the_faith.ReligiousSymbol|U] ทั้งปวง!"
 great_holy_war.0052.generic.defenders.desc:1 "[ghw_defender.GetFaith.WarGodName] คงจะทอดทิ้ง [ghw_defender.GetTitledFirstName] ไปแล้ว จึงปล่อยให้กองทัพของ[ghw_defender.GetHerHis]พ่ายแพ้อย่างราบคาบต่อทหารของ [the_faith.ReligiousSymbol|U]\n\nหลังจาก [the_faith.GHWName] ที่ประสบความสำเร็จของพวกเขา [ROOT.Char.Custom('GetUnbelieverNamePlural')] ได้เข้ายึดครอง [target_kingdom.GetBaseNameNoTier] และอ้างสิทธิ์ในดินแดนโดยรอบว่าเป็นดินแดน [the_faith.GetAdjectiveNoTooltip] อันชอบธรรม"
 great_holy_war.0052.generic.outsiders.desc:0 "[the_faith.GHWName] ของ [the_faith.GetAdjectiveNoTooltip] ต่อต้าน [target_kingdom.GetBaseName] ประสบความสำเร็จอย่างกึกก้อง นักรบศักดิ์สิทธิ์ที่ถูกปลุกเร้าโดยการเรียกระดมพลของ [ghw_sponsor.GetTitledFirstNamePossessive] ได้เอาชนะศัตรูของพวกเขาครั้งแล้วครั้งเล่า เข้ายึดครองดินแดนของพวกเขาอย่างถาวร\n\nเป็นการยากที่จะบอกว่าการปกครองของพวกเขาจะคงอยู่นานเพียงใด และหากเหล่าสาวกของ [ghw_defender.GetFaith.WarGodName] จะตอบโต้กลับหลังจากการถูกหยามเกียรติครั้งนี้ แต่ อย่างน้อยในตอนนี้ ผู้คนแห่ง [target_kingdom.GetBaseNameNoTierNoTooltip] จะต้องเรียนรู้ที่จะอยู่ภายใต้ร่มเงาของ [the_faith.ReligiousSymbol|U]"
 great_holy_war.0052.a:0 "[the_faith.WarGodName] สถิตอยู่กับเรา!"
 great_holy_war.0052.b:0 "[ROOT.Char.GetFaith.WarGodName] เหตุใดท่านจึงลงโทษเรา?!"
 great_holy_war.0052.c:0 "การทะเลาะวิวาทของ [ghw_sponsor.Custom('GetUnbelieverNamePlural')] ไม่ใช่เรื่องที่เราต้องกังวล"
 great_holy_war.0053.title:0 "[the_faith.ReligiousSymbol|U] ที่แตกสลาย"
 great_holy_war.0053.generic.attackers.desc:0 "เหล่านักรบแห่ง [the_faith.WarGodName] พบเพียงความตายและความอัปยศอดสูที่ประตูเมือง [target_kingdom.GetBaseNameNoTier]\n\n[the_faith.GHWName] ที่ [ghw_sponsor.GetTitledFirstName] เรียกร้องและสนับสนุนอย่างกระตือรือร้น จบลงด้วยความพ่ายแพ้อย่างหายนะ ซึ่งมี แต่จะทำร้ายอุดมการณ์ของผู้ศรัทธา สิ่งนี้จะกระตุ้นให้ผู้หมิ่นประมาทศาสนาและผู้ไร้ศรัทธาออกห่างจาก [the_faith.GetName] มากขึ้นอย่างแน่นอน"
 great_holy_war.0053.generic.defenders.desc:0 "ทหารอันน่าสมเพชของ [the_faith.WarGodName] ไม่คู่ควรกับนักรบของเราเลย \n\nภายใต้การนำอันชาญฉลาดและเคร่งศาสนาของ [ghw_defender.GetTitledFirstName] เหล่าผู้ศรัทธา [ghw_defender.GetFaith.GetAdjective] ได้ขับไล่ผู้รุกรานและยืนยันสิทธิ์ของตนเหนือ [target_kingdom.GetBaseNameNoTier] อีกครั้ง บางทีครั้งต่อไป [ghw_sponsor.GetTitleTierName] [the_faith.GetAdjective] อาจจะไม่กระตือรือร้นที่จะโยนชีวิตสาวกของ[ghw_sponsor.GetHerHis]ทิ้งไปในความพยายามอันไร้ผลที่จะทดสอบพลังอำนาจของ [ghw_defender.GetFaith.WarGodName]"
 great_holy_war.0053.generic.outsiders.desc:0 "หลังจากความพ่ายแพ้หลายครั้งและความปราชัยอันน่าอดสู [the_faith.GHWName] ที่ [ghw_sponsor.GetTitledFirstName] เรียกร้องเพื่อพิชิต [target_kingdom.GetBaseNameNoTier] ได้จบลงด้วยความล้มเหลวอย่างสิ้นเชิง\n\nเหล่าผู้ศรัทธา [ghw_defender.GetFaith.GetAdjective] ภายใต้ธงของ [ghw_defender.GetTitledFirstNamePossessive] ได้ขับไล่ผู้รุกรานทั้งหมดและบังคับให้ผู้นำของพวกเขายอมจำนน"
 great_holy_war.0053.a:0 "[the_faith.WarGodName] ได้ทอดทิ้งเราแล้ว!"
 great_holy_war.0053.b:1 "[attacker.Custom('GetUnbelieverNamePlural')] ได้ลิ้มรสพระพิโรธของ [ghw_defender.GetFaith.WarGodName] แล้ว!"
 great_holy_war.0056.title:0 "[the_faith.GHWName] ล้มเหลว"
 great_holy_war.0056.desc:0 "ดูเหมือนว่าคำวิงวอนอันแรงกล้าของ [ghw_sponsor.GetTitledFirstNamePossessive] ที่จะเข้าร่วมต่อต้านศัตรูของ [the_faith.ReligiousSymbol] นั้นโน้มน้าวใจได้น้อยกว่าที่ [ghw_sponsor.GetSheHe] คาดไว้ มีผู้ศรัทธาเพียงไม่กี่คนที่ตัดสินใจตอบรับการเรียกระดมพลของ[ghw_sponsor.GetHerHis] น้อยเกินไปที่จะจัดตั้งกองทัพที่เหมาะสมได้\n\nเมื่อไม่มีทางเลือกอื่น [ghw_sponsor.GetTitleTierName] จึงถูกบังคับให้ยกเลิก [the_faith.GHWName] และประณามผู้ปกครอง [the_faith.GetAdjective] ทั้งหมดสำหรับความขี้ขลาดและความชั่วร้ายของพวกเขา"
 great_holy_war.0056.a:0 "เราหลงทางไปไกลจากคำชี้แนะของ [the_faith.WarGodNamePossessive] ได้อย่างไร?"
 great_holy_war.0056.b:0 "น่าสมเพช"
 great_holy_war.0056.c:0 "ทำไมเรื่องนี้ถึงเกี่ยวกับข้าอีกแล้ว?"
 great_holy_war.0057.title:0 "ทหารแห่ง [the_faith.ReligiousSymbol|U]"
 great_holy_war.0057.crusader.desc:0 "กองทัพของเราเตรียมพร้อมแล้วที่จะเข้าร่วมใน [the_faith.GHWName] เพื่อ [target_kingdom.GetBaseNameNoTier] หาก [the_faith.WarGodName] ทรงประสงค์ เราจักได้รับชัยชนะในไม่ช้า ด้วยโลหิตของ [ROOT.Char.Custom('GetDerogatoryNonbelieverPlural')] ที่จะย้อมผืนดินให้เป็นสีแดงฉาน"
 great_holy_war.0057.mujahid.desc:0 "การต่อสู้อันยิ่งใหญ่ของเรามาถึงแล้วในที่สุด กองทัพของเราพร้อมที่จะเผชิญหน้ากับผู้ไร้ศรัทธาในการรบ และด้วยพรจาก [the_faith.WarGodName] ในไม่ช้าพวกเขาจักยืนหยัดอย่างผู้มีชัยบนกำแพงเมือง [target_kingdom.GetBaseNameNoTier]"
 great_holy_war.0057.generic.outsiders.desc:0 "กองทัพของเราเตรียมพร้อมที่จะเข้าร่วมใน [the_faith.GHWName] เพื่อ [target_kingdom.GetBaseNameNoTier] เมื่อมี [the_faith.WarGodName] อยู่เคียงข้างเรา เรามั่นใจว่าจะได้รับชัยชนะ!"
 great_holy_war.0057.a:0 "ขอ [the_faith.WarGodName] นำเราไปสู่ชัยชนะ!"
 great_holy_war.0058.title:0 "การแสดงความขี้ขลาด"
 great_holy_war.0058.base.desc:0 "ในขณะที่เหล่านักรบผู้ทรงคุณธรรมกว่ายังคงเดินทัพสู่ [target_kingdom.GetBaseNameNoTier] ข้ากลับละทิ้งกองทัพของตนเพื่อหาที่หลบภัย ขณะที่พวกเขากำลังทำสงครามอย่างไม่ลดละกับเหล่า [ROOT.Char.Custom('GetDerogatoryNonbelieverPlural')] อันชั่วช้า ข้ากลับ ทำให้ชื่อของตนต้องมัวหมองและ ทำให้ความมุ่งมั่นของข้าเป็นที่กังขาในการดำเนิน [the_faith.GHWName] นี้ต่อไป"
 great_holy_war.0058.a:0 "ข้าไม่ควรละทิ้งสนามรบ..."
 great_holy_war.0061.title:0 "ได้รับรางวัล"
 great_holy_war.0061.notification:0 "[scoped_beneficiary.GetFirstName] ได้รับรางวัลสำหรับการมีส่วนร่วมของครอบครัว[scoped_beneficiary.GetHerHis]ใน [scoped_beneficiary.GetFaith.GHWName] ครั้งล่าสุด"
 great_holy_war.0070.title:0 "ราชอาณาจักรใหม่"
 great_holy_war.0070.base.desc:0 "ด้วยการสถาปนา [title_recipient.GetTitleTierName] [the_faith.GetAdjective] ที่เหมาะสมใน [target_kingdom.GetBaseNameNoTier] เหล่าผู้ศรัทธาก็สามารถพักผ่อนได้อย่างสบายใจ โดยรู้ว่า [the_faith.WarGodName] กำลังยิ้มให้กับผลงานที่ดีของเรา การที่ผู้ปกครองคนใหม่ของ [target_kingdom.GetBaseNameNoTier] เป็นสมาชิกในราชวงศ์ของข้า เป็นเพียงข้อพิสูจน์เพิ่มเติมถึงความโปรดปรานจากสวรรค์ของเรา"
 great_holy_war.0070.a:0 "ข้าสงสัยว่า [title_recipient.GetSheHe] จักเป็นผู้ปกครองแบบใด..."
 great_holy_war.0070.b:0 "ถึงเวลากลับมาให้ความสำคัญกับอาณาจักรของข้าแล้ว"
 great_holy_war.0071.generic.attackers.desc:0 "[attacker.GetTitledFirstName] ได้เรียกร้อง [attacker.GetFaith.GHWName] เพื่อรวม [attacker.GetFaith.GetAdherentNamePlural] ที่แท้จริงทั้งหมดภายใต้ธงผืนเดียวและนำพวกเขาต่อสู้กับศัตรูแห่งศรัทธา \n\nในที่สุดก็ถึงเวลาที่จะชำระล้างผืนดินแห่ง [target_kingdom.GetBaseNameNoTier] ด้วยเลือดของ [ghw_defender.Custom('GetUnbelieverNamePlural')] และอ้างสิทธิ์ในดินแดนนี้เพื่อเกียรติภูมิแห่ง [the_faith.WarGodName]"
 great_holy_war.0071.generic.defenders.desc:0 "[attacker.GetTitledFirstName] อันชั่วร้ายได้เรียกร้อง [attacker.GetFaith.GHWName] ต่อต้านผู้บริสุทธิ์แห่ง [defender.GetPrimaryTitle.GetBaseNameNoTier]\n\nเราต้องรวมตัวกันต่อต้านฝูงชนผู้คลั่งศาสนาอันโหดเหี้ยมภายใต้คำสั่งของ[attacker.GetHerHis]หากเราต้องการอยู่รอด"
 great_holy_war.0081.title:0 "[actor.GetFaith.GHWName] ใหม่"
 great_holy_war.0081.desc:0 "ด้วยเหตุผลบางประการ [actor.GetFaith.GHWName] ได้หันเหจากเป้าหมายเดิมและมุ่งหน้าไปยัง [secondary_recipient.GetPrimaryTitle.GetBaseNameNoTier]\n\nดูเหมือนว่าดินแดนของเราจะรอดพ้นจากความโหดร้ายของนักรบ [actor.GetFaith.GetAdjective] อย่างน้อยก็ในตอนนี้"
 great_holy_war.0081.a:0 "อย่างน้อยเราก็ปลอดภัย"
 great_holy_war.0082.desc:0 "เป็นเวลาสักพักแล้วที่ศรัทธา [actor.GetFaith.GetAdjective] ได้รวบรวมกำลังพลสำหรับ [actor.GetFaith.GHWName] \n\nทว่า ด้วยชะตากรรมที่พลิกผันอย่างไม่คาดคิด เหล่าผู้คลั่งศาสนาที่นำกองทัพอันยิ่งใหญ่นี้ได้ตัดสินใจเปลี่ยนแผนเดิมและเดินทัพไปยัง [secondary_recipient.GetPrimaryTitle.GetBaseNameNoTier]!"
 great_holy_war.0082.a:0 "เรามีเวลาเตรียมตัวเพียงเล็กน้อย!"
 great_holy_war.0085.toast:0 "การเปลี่ยนศาสนาของ [converter.GetTitledFirstNamePossessive] บังคับให้ข้าต้องละทิ้งคำมั่นสัญญา"
