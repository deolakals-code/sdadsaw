l_english: 

 designated_sacrifice_died.t:0 "เครื่องสังเวยที่หมายไว้สิ้นชีพ"
 designated_sacrifice_died.desc:0 "[dead_designated_sacrifice.GetShortUIName|U] สิ้นชีพไปเสียก่อนที่ข้าจะทันได้บูชายัญ [dead_designated_sacrifice.GetHerHim] แด่ [ROOT.Char.GetFaith.HighGodName] เหล่า [ROOT.Char.GetFaith.AltPriestTermPlural] ของข้าและผู้คนต่างไม่พอใจ"
 designated_sacrifice_release.t:0 "เครื่องสังเวยที่หมายไว้ถูกปล่อยตัว"
 designated_sacrifice_released.desc:0 "[released_designated_sacrifice.GetShortUIName|U] ได้รับการปล่อยตัวแทนที่จะถูกบูชายัญแด่ [ROOT.Char.GetFaith.HighGodName] เหล่า [ROOT.Char.GetFaith.AltPriestTermPlural] ของข้าและผู้คนต่างไม่พอใจ"
 designated_human_sacrifice_modifier:0 "ผู้ถูกหมายไว้เพื่อบูชายัญมนุษย์"
 designated_human_sacrifice_modifier_desc:0 "ตัวละครนี้ถูกหมายไว้โดยเทพเจ้าเพื่อการบูชายัญมนุษย์ อย่างน้อยก็ตามคำกล่าวของผู้จับกุม"
 human_sacrifice.0001.t:0 "เทพเจ้าผู้กระหาย"
 human_sacrifice.0001.desc:0 "เป็นเวลาหลายปีแล้วที่ข้าได้ทำสงครามบุปผาในนามของ [ROOT.Char.GetFaith.HighGodName] แต่ข้ายังไม่ได้บูชายัญเชลยศึกสูงศักดิ์ทั้งหมดที่จับมาได้เมื่อความขัดแย้งสิ้นสุดลง เหล่า [ROOT.Char.GetFaith.AltPriestTermPlural] ของข้าเริ่มหมดความอดทน และสามัญชนต่างกระซิบกันว่า [ROOT.Char.GetFaith.WarGodName] ได้เบือนพระพักตร์ [ROOT.Char.GetFaith.WarGodHerHis] ไปจากข้าแล้ว"
 human_sacrifice.0001.a:0 "รอเดี๋ยว การบูชายัญที่ล่าช้าคงจะใช้ได้กระมัง?"
 human_sacrifice.0001.b:0 "ข้าแบกรับการดูถูกของพวกเขาอย่างสงบนิ่ง"
 human_sacrifice.0001.c:0 "ความป่าเถื่อนนี้ไม่เหมาะกับข้าเลย"
 human_sacrifice_coward_modifier:0 "ทำให้เทพเจ้าผู้กระหายขุ่นเคือง"
 human_sacrifice_coward_modifier_desc:0 "ตัวละครนี้เป็นที่รู้กันว่าชอบหมอบคลานและแก้ตัวต่อหน้าสิ่งศักดิ์สิทธิ์"
 flowery_war_cb_ended_invalid.t:0 "สงครามเป็นโมฆะ"
 flowery_war_cb_ended_invalid.desc_other_sacrifices_attacker:0 "[war.GetName] ได้สิ้นสุดลง: ข้าได้เครื่องสังเวยจากที่อื่นแล้ว"
 flowery_war_cb_ended_invalid.desc_other_sacrifices_defender:0 "[war.GetName] ได้สิ้นสุดลง: [attacker.GetShortUIName] ได้เครื่องสังเวยที่เหมาะสมจากที่อื่นแล้ว"
 flowery_war_cb_ended_invalid.desc_no_sacrificers:0 "[war.GetName] ได้สิ้นสุดลง: ไม่มีผู้เข้าร่วมหลักคนใดประกอบพิธีบูชายัญมนุษย์อย่างเปิดเผย"
