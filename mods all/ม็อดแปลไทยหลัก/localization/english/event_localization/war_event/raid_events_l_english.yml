l_english: 
 raiding.0002.t:0 "ไฟและโลหิต"
 raiding.0002.desc:0 "นิคม [sacked_barony.GetNameNoTierNoTooltip] อันเป็นป้อมปราการสำคัญในเขต [sacked_county.GetNameNoTierNoTooltip] อันกว้างใหญ่ ได้ตกเป็นของเหล่านักปล้นของข้าแล้ว บัดนี้เราครอบครองผืนดินอันกว้างใหญ่ไพศาล และเหล่าไพร่ฟ้าข้าแผ่นดินผู้ตัวสั่นงันงก ตลอดจนทรัพย์สมบัติอันเปล่งประกายของ [sacked_county_owner.GetTitledFirstName] ให้เลือกสรร\n\nเหล่าทหารยืนหยัดเตรียมพร้อม รอรับคำบัญชาจากข้าเพื่อชี้ทิศทาง"
 raiding.0002.a:0 "จับทาสผู้มีฝีมือมายัง [raider_capital.GetNameNoTooltip]!"
 raiding.0002.a_nomad: "จงกวาดต้อนแม่แกะแม่ม้ามาให้สิ้น!"
 stolen_ewes_and_mares_modifier: "แม่แกะและแม่ม้าที่ถูกปล้นมา"
 stolen_ewes_and_mares_modifier_desc: "เคาน์ตีนี้กำลังเจริญรุ่งเรือง ขับเคลื่อนด้วยแม่พันธุ์แกะและแม่ม้าชั้นเลิศจำนวนมากที่เพิ่มขึ้นอย่างรวดเร็ว อันได้มาเป็นของเชลยจากการบุกปล้นครั้งล่าสุด"
 raiding.0002.b:0 "นำทรัพย์สินอันอุดมมาให้ข้า!"
 raiding.0002.c:0 "เรายึดมามากพอแล้ว"
 raiding.0003.t_spared:0 "[sacked_county.GetNameNoTierNoTooltip] ได้รับการละเว้น"
 raiding.0003.t_attacked:0 "การปล้นสะดม [sacked_county.GetNameNoTierNoTooltip]"
 raiding.0003.desc.admin_plundered_independent:0 "หลังจากพังประตูเข้าไปในนิคม [sacked_barony.GetNameNoTierNoTooltip] แล้ว [raider.GetTitledFirstName] ก็มีอำนาจเต็มที่ในพื้นที่ส่วนใหญ่ของ [sacked_county.GetNameNoTierNoTooltip] และได้ใช้โอกาสของ [raider.GetHerHis] ในการลักพาตัวและจับข้าราชการผู้มีการศึกษาและคนงานที่มีทักษะมาเป็นทาสให้มากที่สุดเท่าที่จะทำได้ ชาวบ้านต่างทึ้งผมและร่ำไห้ให้กับสมาชิกในครอบครัวที่สูญหายไป"
 raiding.0003.desc.gold_plundered_independent:0 "หลังจากการล้อมอันตึงเครียด [raider.GetTitledFirstName] ก็สามารถบุกทะลวงนิคมอันแข็งแกร่งแห่ง [sacked_barony.GetNameNoTierNoTooltip] ได้สำเร็จ และสั่งให้ทหารของ[raider.GetHerHis]ปล้นสะดมทุกสิ่งที่มีค่า ในไม่ช้า พวกมันก็จะกวาดทรัพย์สินไปครึ่งหนึ่งของเขต [sacked_county.GetNameNoTierNoTooltip] อันกว้างใหญ่!"
 raiding.0003.desc.spared_plundered_independent:0 "แม้ว่านิคม [sacked_barony.GetNameNoTierNoTooltip] จะยอมจำนนต่อกองทัพของ[raider.GetHerHis] [raider.GetTitledFirstName] ก็ได้ละเว้นชาวเมืองในเขต [sacked_county.GetNameNoTierNoTooltip] อันกว้างใหญ่จากการปล้นสะดมเพิ่มเติม แต่ ทว่า ดูเหมือน[raider.GetSheHe]จะมุ่งหมายที่จะชิงทรัพย์สินของ[raider.GetHerHis]จาก #EMP ข้า#!!"
 raiding.0003.desc.admin_plundered_vassal:0 "เจ้าเหนือหัวของข้าล้มเหลวในการปกป้องนิคม [sacked_barony.GetNameNoTierNoTooltip] จากการทำลายล้างของ [raider.GetTitledFirstName] และการล่มสลายของมันก็ ทำให้ป้อมปราการสำคัญสำหรับเขต [sacked_county.GetNameNoTierNoTooltip] อันกว้างใหญ่ต้องสูญเสียไป แม้กระทั่งบัดนี้ กองทหารของ[raider.GetTitledFirstNamePossessiveNoTooltip]ก็ยังคงกระจายกำลังไปทั่วชนบท จับกุมและกดขี่แรงงานมีฝีมือและผู้ฝึกหัดทุกคนที่พวกมันพบเจอ"
 raiding.0003.desc.gold_plundered_vassal:0 "เมื่อปราศจากความช่วยเหลือจากเจ้าเหนือหัว [sacked_barony.GetNameNoTierNoTooltip] ก็แทบไม่มีโอกาสรอด เหล่านักปล้นที่ติดตาม [raider.GetTitledFirstName] ได้เข้าปล้นสะดมนิคม และไอ้พวกสารเลวนั่นก็เอาไปทุกอย่าง ตั้งแต่ข้าวของทางโลกของชาวนาไปจนถึงถ้วยนำโชคของข้า\n\nครึ่งหนึ่งของเขต [sacked_county.GetNameNoTierNoTooltip] อันกว้างใหญ่กำลังลุกเป็นไฟจากการปล้นสะดมของพวก[raider.GetPrimaryTitle.GetAdjectiveNoTooltip] และ [raider.GetTitledFirstNameNoTooltip] ก็อยู่ที่ไหนสักแห่งข้างนอกนั่น กำลังดื่มจากถ้วยส่วนตัวของข้า"
 raiding.0003.desc.spared_plundered_vassal:0 "แม้ว่าเจ้าเหนือหัวของข้าจะล้มเหลวในการทำลายการล้อม [sacked_barony.GetNameNoTierNoTooltip] [raider.GetTitledFirstName] ก็ยังคงควบคุมกองทหารของ[raider.GetHerHis]อย่างเข้มงวด\n\nดังนั้นพื้นที่ชนบทส่วนใหญ่จึงรอดพ้นจากการปล้นสะดมที่มากกว่าปกติ แต่สายตาอันหิวโหยของพวก[raider.GetPrimaryTitle.GetAdjectiveNoTooltip]ก็หันไปทางอื่น..."
 raiding.0003.a:0 "เจ้าปีศาจร้ายนั่น!"
 raiding.0003.b:0 "ข้า #EMP จะต้อง#! ล้างแค้นความอัปยศนี้ให้ได้"
 raiding.0003.c:0 "เราจะสร้าง [sacked_county.GetNameNoTierNoTooltip] ขึ้นมาใหม่"
 raiding.0004.desc.admin_plundered:0 "[sacked_county_owner.GetTitledFirstName] ต้องชดใช้ให้กับความโลภของ[raider.GetTitledFirstNamePossessive] ด้วยการล่มสลายของนิคม [sacked_barony.GetNameNoTierNoTooltip] พื้นที่อันกว้างใหญ่ของเขต [sacked_county.GetNameNoTierNoTooltip] จึงไร้การป้องกัน \n\nเมื่อไร้ผู้ต่อต้าน เหล่านักปล้นชาว[raider.GetPrimaryTitle.GetAdjectiveNoTooltip]จึงอาละวาดไปทั่ว ลักพาตัวและจับแรงงานมีฝีมือทุกคนที่พวกมันพบเจอมาเป็นทาส"
 raiding.0004.desc.gold_plundered:0 "ด้วยการล่มสลายของนิคม [sacked_barony.GetNameNoTierNoTooltip] ให้แก่ [raider.GetTitledFirstNameNoTooltip] พื้นที่ส่วนใหญ่ของเขต [sacked_county.GetNameNoTierNoTooltip] อันกว้างใหญ่จึงถูกเปิดโล่งให้กับเหล่านักปล้นชาว[raider.GetPrimaryTitle.GetAdjectiveNoTooltip]ที่กำลังอาละวาด\n\nเนื่องจากมีป้อมปราการท้องถิ่นขนาดใหญ่เหลืออยู่น้อยที่จะต่อต้านพวกมันได้ เหล่านักปล้นจึงได้ขนเอาของมีค่าทุกชิ้นและเศษเงินทุกก้อนที่พวกมันหาเจอไป"
 raiding.0004.desc.spared_plundered:0 "แม้จะประสบความสำเร็จในการล้อมนิคม [sacked_barony.GetNameNoTierNoTooltip] ซึ่งเป็นป้อมปราการที่ปกป้องพื้นที่อันกว้างใหญ่ของเขต [sacked_county.GetNameNoTierNoTooltip] [raider.GetTitledFirstName] ก็ได้ยับยั้งกองทหารของ[raider.GetHerHis] การปล้นสะดมที่ตามมาจึงเกิดขึ้นเพียงประปรายและไม่ต่อเนื่อง\n\nแม้ว่าข้าหลวงของท่านจะได้รับการละเว้น แต่พวก[raider.GetPrimaryTitle.GetAdjectiveNoTooltip]ก็จับจ้องดินแดนส่วนตัวของท่านด้วยความหิวโหย..."
 raiding.0004.a:0 "ข้าขอสาปแช่งพวกคนเถื่อนเจ้าปัญหานี่!"
 raiding.0004.a.tribal:0 "สาปแช่งไอ้พวกสุนัข[raider.GetPrimaryTitle.GetAdjectiveNoTooltip]นั่น!"
 raiding.0004.b:0 "จ่ายค่าเวียร์เกลด์สำหรับผู้สูญหาย"
 raiding.0004.c:0 "ช่วยพวกเขาในการสร้างใหม่"
 raiding.0004.c.architect:0 "ท่านส่ง [architect.GetTitledFirstNameNoTooltip] [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('architect'))] ของท่าน ไปดูแลการซ่อมแซม"
 recently_sacked_modifier:0 "เพิ่งถูกปล้นสะดม"
 recently_sacked_modifier_desc:0 "เหล่านักปล้นจะไม่พบสิ่งใดให้เอาไปได้อีกที่นี่ ขณะที่ความกลัวว่าพวกมันจะกลับมา ทำให้เหล่าชาวนาอยู่ในระเบียบ"
 rebuilding_after_sacking_modifier:0 "กำลังสร้างใหม่หลังการปล้น"
 rebuilding_after_sacking_modifier_desc:0 "ผู้อุปถัมภ์ผู้มั่งคั่งกำลังช่วยเหลือคนท้องถิ่นซ่อมแซมนิคมที่เสียหายของพวกเขา"
 raiding.0004.c.feed.t:0 "เจ้าเหนือหัวจ่ายค่าซ่อมแซม"
 raiding.0004.c.feed.desc:0 "เจ้าเหนือหัวของข้าได้จ่ายเงินให้ทีมสถาปนิกและผู้ดูแลเพื่อช่วยซ่อมแซม [sacked_county.GetNameNoTierNoTooltip]"
 raiding.0004.c.feed.desc2:0 "เจ้าเหนือหัวของข้าได้ส่งสถาปนิกหลวงมานำทีมสถาปนิกและผู้ดูแลเพื่อช่วยซ่อมแซม [sacked_county.GetNameNoTierNoTooltip]"
 raiding.0011.t:0 "ทรัพย์สินจากการปล้นถูกส่งมอบแล้ว"
 raiding.0011.desc:0 "นักปล้นของท่านนำทรัพย์สิน [ROOT.Var('raid_loot').GetValue|V0] [gold_i] และชื่อเสียง [ROOT.Var('raid_loot').GetValue|V0] [prestige_i] กลับมา"
 raiding.0011.desc_non_tribal:0 "นักปล้นของท่านนำทรัพย์สิน [ROOT.Var('raid_loot').GetValue|V0] [gold_i] กลับมา ซึ่ง ทำให้ท่านเสียชื่อเสียง [SCOPE.ScriptValue('non_tribal_loot_value')|V0] [prestige_i]"
 raiding.0012.a.t:0 "สูญเสียทรัพย์สินจากการปล้น"
 raiding.0012.a.desc:0 "[recipient.GetTitledFirstName] ได้ชิง [loot_i][ROOT.Var('raid_loot').GetValue|V0] ไปจากเรา!\nชัยชนะครั้งนี้ ทำให้ [recipient.GetHerHim] ได้รับ [ROOT.Var('raid_prestige').GetValue|V0] [prestige_i]"
 raiding.0012.b.t:0 "ได้ทรัพย์สินจากการปล้นคืนมา"
 raiding.0012.b.desc:0 "ท่านได้ยึด [loot_i][ROOT.Var('raid_loot').GetValue|V0] มาจาก [raider.GetTitledFirstName]!\nชัยชนะครั้งนี้ ทำให้ท่านได้รับ [ROOT.Var('raid_prestige').GetValue|V0] [prestige_i]"
 raiding.0023.t:0 "ความน่าสะพรึงกลัวจาก [capital_province.GetNameNoTooltip]"
 raiding.0023.desc:0 "เป็นเวลาหลายปี ที่ข้าได้ออกปล้นสะดมอย่างทำลายล้าง นำพาความพิโรธอันเต็มเปี่ยมของ [raid_leader.GetFaith.HighGodName] มาสู่โลกอันสั่นสะท้าน เพราะแน่นอนว่าหาก [raid_leader.GetFaith.HighGodNameSheHe|U] ไม่พอพระทัย [raid_leader.GetFaith.HighGodNameSheHe|U] คงจะลงทัณฑ์ข้าไปแล้วมิใช่หรือ?\n\nแต่ ทว่า คนในครัวเรือนของข้ากลับนอนหลับท่ามกลางเครื่องประดับหรูหราที่ขโมยมาจากผู้ปกครองต่างแดน และทาสต่างแดนผู้แปลกตาคอยปรนนิบัติข้าบนเตียงนอน\n\nแท้จริงแล้ว ทั้งขุนนางและชาวนาต่างหวาดหวั่นเมื่อข้าเข้าใกล้ และพ่อแม่ต่าง ทำให้เด็กร้องไห้เงียบลงด้วยการขู่ว่าข้าจะไปหา"
 raiding.0023.a:0 "ฮ่า! ปล่อยให้พวกมันร่ำไห้เมื่อได้ยินชื่อข้า!"
