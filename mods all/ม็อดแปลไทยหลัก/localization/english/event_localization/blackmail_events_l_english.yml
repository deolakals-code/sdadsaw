l_english: 
 blackmail.0001.t:0 "การขู่กรรโชกถูกปฏิเสธ!"
 blackmail.0001.desc:0 "อาจเป็น เพราะความทะนงตนอันผิดพลาด หรือความหวาดหวั่นต่อการตอบโต้ที่ร้ายแรงกว่า [recipient.GetTitledFirstName] จึงกล่าวอ้างว่าข้ามิอาจควบคุม[recipient.GetHerHim]ได้!"
 blackmail.0001.a:0 "เมื่อได้ลั่นวาจาข่มขู่ไปแล้ว ผลลัพธ์ย่อมมีได้เพียงสถานเดียว..."
 blackmail.0001.b:0 "ข้าไม่อยากยอมรับเลย แต่ข้ามิอาจเปิดโปงความลับนี้ได้"

 blackmail.1001.t:0 "ความหวาดหวั่นต่อสิ่งเร้นลับ"
 blackmail.1001.desc:0 "เหล่าข้าหลวงของข้าหารู้เรื่องการขู่กรรโชกของข้าไม่ แต่พวกเขาสังเกตเห็นท่าทีของเหยื่อข้า [blackmail_target.GetTitledFirstName] ยามอยู่ต่อหน้าข้า พวกเขาเห็นแววตาหวาดหวั่นของ[blackmail_target.GetHerHis]..."
 blackmail.1001.a:0 "พวกมัน#EMP ทั้งหมด#!ควรหวาดหวั่นข้า..."
 blackmail.1001.b:0 ""ข้ารับรองท่านทั้งหลาย หามีสิ่งใดไม่ชอบมาพากลเกิดขึ้นไม่!""

 blackmail.1002.t:0 "เงามืดที่ทอดทาบทับ"
 blackmail.1002.desc:0 "ภัยจากการถูกเปิดโปงวนเวียนอยู่ในความคิดข้ามิได้หยุด [blackmailer.GetTitledFirstName] รู้เรื่องของข้ามากเกินไป และผลของการปฏิเสธข้อเรียกร้องใดๆ ของ[blackmailer.GetHerHis]นั้นร้ายแรงเกินกว่าจะคาดคิด\n\nข้าจะปลอดภัยหรือไม่ แม้หากข้ายอมทำตาม?"
 blackmail.1002.a:0 "ยามราตรีข้านอนมิหลับด้วยความวิตก"
 blackmail.1002.b:0 "ทุกอย่างจักเรียบร้อยดี [blackmailer.GetFirstNameNoTooltip] บอกข้าไว้ เช่นนั้น!"
 blackmail.0001.toast_puppeteer:0 "[recipient.GetShortUIName] refused [puppet_or_actor.GetShortUINamePossessive] blackmail"
