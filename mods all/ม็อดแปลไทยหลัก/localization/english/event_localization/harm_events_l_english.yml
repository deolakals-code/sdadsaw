 ##################################################
 # #Misc Keys
 aging_gracefully_modifier:0 "ชราภาพอย่างสง่างาม"
 aging_gracefully_modifier_desc:0 "ตัวละครนี้เริ่มเสื่อมถอย แต่กาลเวลาดูเหมือนจะส่งผลกระทบต่อพวกเขาน้อยกว่าคนส่วนใหญ่เล็กน้อย"

 thick_skulled_modifier:0 "หัวแข็ง"
 thick_skulled_modifier_desc:0 "เห็นได้ชัดว่าศีรษะของตัวละครนี้สามารถทนทานต่อการทุบตีได้ดี"

 strong_willed_modifier:0 "ใจแข็ง"
 strong_willed_modifier_desc:0 "ตัวละครนี้คุ้นเคยกับการต่อสู้ฝ่าฟันแม้กระทั่งความเจ็บปวดที่รุนแรงที่สุด"

 harm.0000.tt.spared_for_now:0 "ท่านรอดพ้นไปได้ สำหรับตอนนี้"
 harm.0000.tt.no_permanent_damage:0 "ท่านไม่ได้รับความเสียหายถาวร"

 harm.0000.tt.physician:0 "#EMP [ROOT.Char.Custom('GetRandomCourtMedic')|U]! [medic.GetFirstNameNoTooltip]!#!"
 harm.0000.tt.incapable.success:0 "ท่านไม่ได้รับบาดเจ็บถาวร"
 harm.0000.tt.incapable.failure:0 "ประสบการณ์นี้ ทำให้ท่านอ่อนแอลง"
 harm.0000.tt.death.success:0 "ท่านรอดชีวิต"
 harm.0000.tt.death.failure:0 "ท่านสิ้นชีพ"











 ##################################################
 # #Responsive Incapability Events
 harm.0001.t.pre_title:0 "เจ็บป่วยด้วยวัยชรา"

 harm.0001.t:0 "$harm.0001.t.pre_title$: อ่อนแอลง"
 harm.0001.desc:0 "ข้าตื่นขึ้นมาไอและสำลัก จิตใจข้ามัวซัว ศีรษะข้าเต้นตุบๆ แทบจะอาเจียน ข้าพยายามยันกายลุกจากเตียง แต่การจับโครงเตียงของข้าช่างเปราะบาง อ่อนแอราวทารกแรกเกิด\n\nด้วยความพยายามสุดกำลัง ข้าสั่นเทาลุกขึ้นยืนและโซเซไปยังอ่างล้างหน้า ด้วยเดชแห่ง [ROOT.Char.GetFaith.HealthGodName] ความอ่อนแอนี้มาจากไหนกัน? ข้า... ข้ารู้สึกป่วยไข้ยิ่งนัก\n\nน้ำเย็นหาได้ช่วยให้ข้าสดชื่นขึ้นไม่ ด้วยดวงตาพร่ามัว ข้าจ้องมองเงาสะท้อนอันมืดมนเลือนรางในกระจกเงินขัดเงาของข้า [ROOT.Char.GetWomanMan] ที่จ้องตอบกลับมานั้นดูชราภาพยิ่งนัก"
 harm.0001.a:0 "ข้าจะยังอยู่ไปอีกนานปี ข้ามั่นใจ!"
 harm.0001.a.tt.success:0 "ร่างกายของท่านแข็งแรง จิตใจของท่านแจ่มใส"
 harm.0001.a.tt.failure:0 "ท่านไม่ได้แข็งแรงอย่างที่คิด"
 harm.0001.b:0 "บางทีข้าอาจจะใช้ชีวิตให้สะอาดขึ้นอีกหน่อย..."
 harm.0001.b.tt.success:0 "ท่านทำการเปลี่ยนแปลงที่จำเป็นบางอย่าง"
 harm.0001.b.tt.failure:0 "ไม่มีสิ่งใดหยุดยั้งการเดินของกาลเวลาได้"
 harm.0001.c:0 "ข้าจะไปเมื่อข้าพร้อมแล้วเท่านั้น [ROOT.Char.GetFaith.DeathDeityName] ไม่ใช่ก่อนหน้านั้น"
 harm.0001.d:0 "ข้าไม่ใช่หนุ่มสาวเหมือนเมื่อก่อนแล้ว"
 harm.0001.d.tt.success:0 "กาลเวลาปรานีท่าน"
 harm.0001.d.tt.failure:0 "ร่างกายของท่านป่วยไข้ไปตามวัย"

 harm.0002.t:0 "$harm.0001.t.pre_title$: สับสนมึนงง"
 harm.0002.desc:0 "ข้ากำลังจะไปไหน? เหตุใดข้าจึงเข้ามาในนี้? ข้าสาบานได้ว่า... ใช่แล้ว ข้ากำลังมองหา. หา. หาบางอย่าง\n\nมันเร่งด่วนหรือไม่? ข้าต้องกลับไปหา #EMP ใครบางคน#! โดยเร็ว! สัปดาห์หน้า? ใช่ ข้าคิดว่าอย่างนั้น\n\nอ้าฮ่า! อยู่นั่นไง นั่นคือสิ่งที่ข้าต้องการ ข้าต้องการสิ่งนั้นเพื่อ... เพื่อ..."
 harm.0002.a:0 "ข้ากำลังคิดอะไรอยู่?"
 harm.0002.a.tt:0 "จิตใจของท่านไม่ว่องไวเหมือนเมื่อก่อนแล้ว..."

 harm.0003.t:0 "$harm.0001.t.pre_title$: ปวดเมื่อย"
 harm.0003.desc.intro:0 "ด้วยพระประสงค์ของ [ROOT.Char.GetFaith.HealthGodName] เหตุใดข้าจึง #EMP เจ็บปวด#! เช่นนี้? ข้านอนหลับสบาย เหมือนที่ข้านอนตามปกติ แต่เมื่อใดก็ตามที่ข้ายืดตัว ข้ารู้สึกได้ถึงกระดูกของข้าแทบจะเสียดสีกัน\n\n"
 harm.0003.desc.sighted:0 "ข้าจ้องมองลงไปที่ [ROOT.Char.Custom('HandHands')] ของข้า สังเกตเล็บอย่างใกล้ชิด เหลืองไปตามวัย บนผิวหนังที่เหี่ยวย่นมากกว่าที่ข้าต้องการ"
 harm.0003.desc.blind:0 "ข้าลูบ [ROOT.Char.Custom('HandHands')] ไปตามผิวหนัง สัมผัสได้ถึงเนื้อสัมผัสที่เหมือนกระดาษและสิ่งที่ดูเหมือนรอยเหี่ยวย่นที่หนาเกินไปอุดตันผิวหนังของข้า"
 harm.0003.desc.outro:0 "เป็นการยากที่จะจินตนาการว่าครั้งหนึ่งความเยาว์วัยเคยพลุ่งพล่านผ่านเนื้อหนังนี้ ร้อนแรงและมีชีวิตชีวา"
 harm.0003.a:0 "อ๊าก ข้อต่อของทุกคน #EMP ลั่น#! แบบนี้หรือเปล่า?"
 harm.0003.a.tt:0 "ร่างกายของท่านเริ่มเชื่องช้าลง..."

 harm.0011.t:0 "แตกหักจากการรบ"
 harm.0011.desc.default_body:0 "เมื่อความขัดแย้งใน [battle_location.GetName] สิ้นสุดลง ผู้บาดเจ็บและพิการก็เดินกะโผลกกะเผลกออกจากสมรภูมิ ขณะที่ผู้เสียชีวิตที่โดดเด่นที่สุดถูกเพื่อนและผู้ติดตามแบกออกไป\n\nส่วนตัวข้าเอง ข้าติดอยู่ในการต่อสู้ที่ดุเดือดที่สุดบางส่วน — แทบไม่มีชั้นเชิง มีเพียงการฟัน การกรีดร้อง และการฆ่า ศีรษะข้ายังคงหมุนจากแรงกระแทกและอะดรีนาลีน ความกลัว ความโกรธ ความปิติยินดีที่พลุ่งพล่าน และ...\n\nหมุ-หมุน ศีรษะข้ากำลังหมุน การมองเห็นของข้าพร่ามัว จากนั้นก็ซ้อนกัน และข้าเริ่มโซเซลงไปใน [ROOT.Char.Custom('GritType')]\n\n"ไปตาม [ROOT.Char.Custom('GetRandomBattlefieldMedic')|U] มา ท่าน [ROOT.Char.GetTitleAsNameNoTooltip] ถูกโจมตี!" เสียงร้องดังขึ้น"
 harm.0011.desc.medic_present:0 "และสิ่งสุดท้ายที่ข้าเห็นคือ [medic.GetTitledFirstName] กำลังฝ่าฝูงชนเข้ามา"
 harm.0011.desc.no_medic:0 "แต่ไม่มีใครตอบ ไม่มีใครเลย"
 harm.0011.a:0 "ข้าไม่เป็นไร! ข-ข้าไม่เป็นไร..."
 harm.0011.a.tt.success:0 "ท่านฟื้นตัว เมื่อเวลาผ่านไป"
 harm.0011.a.tt.success.bone:0 "กะโหลกหนาของท่านช่วยชีวิตท่านไว้"
 harm.0011.a.tt.success.brain:0 "พลังใจอันแน่วแน่ช่วยให้ท่านผ่านพ้นไปได้"
 harm.0011.a.tt.failure:0 "ท่านไม่เป็นไร"
 harm.0011.b:0 "[medic.GetFirstNameNoTooltip] ได้โปรด ศี- #EMP ศีรษะข้า#!."
 harm.0011.b.tt.success:0 "ด้วยความช่วยเหลือของ [medic.GetHerHis] ท่านผ่านพ้นไปได้"
 harm.0011.b.tt.failure:0 "ความพยายามอย่างดีที่สุดของ [medic.GetFirstNamePossessive|U] ยังไม่ดีพอ"











 ##################################################
 # #Random Incapability Events
 harm.0501.t.prefix:0 "บาปของตระกูล"
 harm.0501.t:0 "$harm.0501.t.prefix$: ดีที่สุดในสายเลือด"
 harm.0501.desc:0 "ทั้งร่างของข้าลุกเป็นไฟ — ราวกับว่าวิญญาณของข้ากำลังลุกไหม้และเผาผลาญจากภายใน ข้ากำลังจะไปไหน... เหตุใดข้าจึงมาอยู่ที่นี่? เหตุใดมันจึง #EMP เจ็บปวดเช่นนี้#!?\n\nเส้นประสาทต่อเส้นประสาท ความเจ็บปวดอันแผดเผากระจายไปทั่วร่างอันน่าสังเวชของข้า ลามเลียเป็นระลอกก่อนจะลดลง ข้าร้อน แต่ก็หนาวเหลือเกิน เต็มไปด้วยความเจ็บปวดที่แล่นแปลบปลาบ\n\nในช่วงเวลาแห่งความกระจ่างแจ้งอันแผดเผาเพียงชั่วขณะ แหล่งที่มาของความทุกข์ทรมานของข้าก็ปรากฏชัดเจน ร่างกายของข้ากำลังทนทุกข์จากความบกพร่องของสายเลือด"
 harm.0501.a:0 "ที่... ที่ไหน?"
 harm.0501.a.tt.success:0 "$harm.0000.tt.incapable.success$"
 harm.0501.a.tt.failure:0 "$harm.0000.tt.incapable.failure$"
 harm.0501.b:0 "ข้า #EMP ควบคุมตนเอง#! ได้"
 harm.0501.c:0 "จิตใจของข้าเฉียบแหลมกว่านี้"
 harm.0501.c.tt.success:0 "$harm.0000.tt.incapable.success$"
 harm.0501.c.tt.failure:0 "$harm.0000.tt.incapable.failure$"

 harm.0502.t:0 "$harm.0501.t.prefix$: ดาวตก"
 harm.0502.desc:0 "ขณะรีบข้าม [ROOT.Char.Custom('GetCourtyard')] ไปทำธุระเล็กน้อย ข้ารู้สึกเจ็บแปลบที่ขาอย่างกะทันหัน จากนั้นก็อีกครั้งที่แขน นี่... มือข้าสั่นหรือ? เหตุใดศีรษะข้าจึงปวดตุบๆ? มาจากไหน...\n\nชั่วครู่หนึ่ง ข้าสะดุด แทบล้มลงกับพื้น แล้วข้าก็ทรงตัวได้และเดินต่อไป\n\nข้า... ข้าไม่รู้ว่านั่นคืออะไร"
 harm.0502.a:0 "นี่คือโรคร้ายประหลาดอันใด?"
 harm.0502.a.tt:0 "#WEAK ความเจ็บปวดจางหายไปอีกครั้ง...#!"

 harm.0511.t.prefix:0 "ลิ้มรสพื้นดิน"
 harm.0511.t:0 "$harm.0511.t.prefix$: การล้มเล็กน้อย"
 harm.0511.desc:0 "คณะผู้ติดตามของข้าและข้ากำลังเพลิดเพลินกับการขี่ม้าชมทิวทัศน์อันยาวนานและสบายๆ ใกล้ [ROOT.Char.GetCurrentLocation.GetName] — ภารกิจของเราสำหรับวันนี้เสร็จสิ้นแล้ว เราเดินทางกลับบ้านให้ทันเวลาอาหารเย็น\n\nดวงอาทิตย์เพิ่งเริ่มคล้อยต่ำลงสู่ขอบฟ้า สาดแสงสีแดงฉานผ่านกลุ่มของเรา เมื่อม้าของข้าพยศขึ้นมากะทันหัน การเคลื่อนไหวนั้นรุนแรงและเร็วเกินกว่าที่ข้าจะควบคุมได้ ทำให้ข้ากระเด็นออกจากอาน"
 harm.0511.a:0 "เดี๋ยว ก-!"
 harm.0511.a.tt.success:0 "$harm.0000.tt.incapable.success$"
 harm.0511.a.tt.failure:0 "$harm.0000.tt.incapable.failure$"
 harm.0511.b:0 "ก้มตัวและม้วนตัว"
 harm.0511.c:0 "รับแรงกระแทกที่ไหล่"
 harm.0511.c.tt.success:0 "$harm.0000.tt.incapable.success$"
 harm.0511.c.tt.failure:0 "$harm.0000.tt.incapable.failure$"

 harm.0512.t:0 "$harm.0511.t.prefix$: เกือบไปแล้ว"
 harm.0512.desc:0 "การขี่ม้าในป่าใกล้ [ROOT.Char.GetCurrentLocation.GetName] เป็นส่วนหนึ่งของชีวิตที่เรียบง่ายและน่าเพลิดเพลินในฐานะ [ROOT.Char.GetTitleAsNameNoTooltip] แห่ง [ROOT.Char.GetPrimaryTitle.GetNameNoTier] สิ่งที่ข้าสามารถเพลิดเพลินได้ ไม่ว่าจะอยู่ตามลำพังหรือกับคณะผู้ติดตาม เมื่อภาระหน้าที่ประจำวันของการเป็นผู้นำหนักหนาเกินไป\n\nขณะกำลังเหม่อลอย ข้าเกือบไม่ทันสังเกตเห็นเมื่อม้าของข้าเห็นสัตว์เลื้อยคลานเล็กๆ ที่ดูน่ากลัวและกำลังจะพยศ ข้ารีบจับบังเหียนให้แน่นขึ้นและ ทำให้มันสงบลง\n\nการเดินทางของเราดำเนินต่อไป"
 harm.0512.a:0 "เหอะ ไม่ยอมให้ #EMP นั่น#! เกิดขึ้นอีกแน่"
 harm.0512.a.tt:0 "#WEAK ม้าของท่านยังคงตื่นตระหนกตลอดการเดินทางที่เหลือ...#!"

 harm.0521.t.prefix:0 "คลื่นแล้วคลื่นเล่า"
 harm.0521.t:0 "$harm.0521.t.prefix$: กลืนน้ำและตะเกียกตะกาย"
 harm.0521.desc.sea:0 "ข้าชื่นชมเสมอเมื่อได้อยู่กลางทะเล แม้ในวันที่พายุโหมกระหน่ำ เช่นวันนี้ มันก็มีความงามอันดิบเถื่อน ความรู้สึกเปราะบาง ของ—"
 harm.0521.desc.river:0 "แม่น้ำใกล้ [ROOT.Char.GetCurrentLocation.GetName] ปกติไม่เชี่ยวกราก เช่นนี้ แต่ข้าก็ยังคงเพลิดเพลินกับการเดินทาง มันสงบ มัน—"
 harm.0521.desc.coastal:0 "ชายฝั่งที่ถูกพายุซัดกระหน่ำของ [ROOT.Char.GetCurrentLocation.GetName] ทำให้การเดินทางอันตรายในบางครั้ง แต่ข้าก็ยังคงเพลิดเพลินกับการล่องเรือ พวกมัน ทำให้ข้ารู้สึก—"
 harm.0521.desc.outro:0 "\n\nเรือโคลงเคลงไปด้านข้าง และข้าถูกเหวี่ยงลงไปในน้ำ แรงกระแทก ทำให้ลมหายใจออกจากปอด การเปลี่ยนแปลงอุณหภูมิอย่างกะทันหัน ทำให้ร่างกายข้าตกตะลึง\n\nเมื่อข้าฟื้นคืนสติ ไอและสำลักใต้น้ำ ร่างกายและสมองของข้าลุกเป็นไฟโดยสิ้นเชิง สติสัมปชัญญะของข้ากำลังเลือนหายไปอีกครั้ง สมองของข้าขาดอากาศหายใจและมืดมัวลงทุกวินาที"
 harm.0521.a:0 "เชือก ตาข่าย แผ่นไม้ โยนอะไรมาให้ข้าที!"
 harm.0521.a.tt.success:0 "มือของท่านคว้าบางอย่างได้"
 harm.0521.a.tt.failure:0 "ท่านอยู่ใต้น้ำนานเกินไป"
 harm.0521.b:0 "พุ่งขึ้นสู่ผิวน้ำ!"
 harm.0521.b.tt.unlocked_by_cultrad:0 "ตัวเลือกนี้ปลดล็อกโดย [traditions|E] [culture_possessive|E] ของท่าน"
 harm.0521.c:0 "ว่ายน้ำ #EMP ว่ายน้ำ#!!"
 harm.0521.c.tt.success:0 "ท่านขึ้นสู่ผิวน้ำได้ทันเวลา"
 harm.0521.c.tt.failure:0 "ท่านใช้เวลานานเกินไป"

 harm.0522.t:0 "$harm.0521.t.prefix$: โฉมหน้าแห่งความสงบ"
 harm.0522.desc.sea:0 "จะมีสิ่งใดให้ความรู้สึกสดชื่นเท่าทะเลอีกหรือไม่? กลิ่นเค็ม บางครั้งเสียงร้องของนกนางนวลเมื่อผ่านแผ่นดิน เสียงน้ำกระทบกับลำเรือเบาๆ"
 harm.0522.desc.river:0 "แม่น้ำใกล้ [ROOT.Char.GetCurrentLocation.GetName] เป็นแหล่งการเดินทางที่สะดวกสบายอย่างน่าอัศจรรย์ ซึ่งข้ามีเหตุให้ต้องใช้เป็นครั้งคราว ดัง เช่นวันนี้\n\nมันช่างให้ความรู้สึกสดชื่นจริงๆ การฟังเสียงฮึดฮัดและเสียงร้องของฝีพายที่พาเราล่องไปตามกระแสน้ำ การเฝ้ามองทิวทัศน์เคลื่อนผ่านไปแม้ข้าจะยังคงนิ่งสนิท"
 harm.0522.desc.coastal:0 "เป็นปีที่หาได้ยากที่ข้า #EMP ไม่#! มีเหตุให้ต้องใช้การขนส่งทางทะเล ด้วยความใกล้ชิดกับ [ROOT.Char.GetCurrentLocation.GetName] ข้าคงเป็นคนโง่หากไม่ใช้ประโยชน์จากมัน\n\nการเดินทางในวันนี้รวดเร็ว การปรากฏตัวของข้าจำเป็นเพื่อตัดสินข้อพิพาทเล็กน้อย ทำให้ข้าได้เพลิดเพลินกับความรู้สึกสงบของการถูกพาตัวกลับบ้าน — เฝ้ามองแนวชายฝั่งเคลื่อนผ่านไปโดยปราศจากความกังวลใดๆ ในโลก"
 harm.0522.desc.outro:0 "\n\nยืนอยู่บนดาดฟ้าเรือ เอนตัวพิงกราบเรือ ข้ารู้สึกสงบยิ่งนัก"
 harm.0522.a:0 "ผืนน้ำช่างชวนให้หลงใหล..."
 harm.0522.a.tt:0 "#WEAK เกือบ... ชวนให้หลงใหล...#!"

 harm.0531.t.prefix:0 "ปัญหาสุขภาพภายใน"
 harm.0531.t:0 "$harm.0531.t.prefix$: โลกกำลังเลือนหาย"
 harm.0531.desc:0 "ข้ารู้สึก. ชา. เกิดอะไร... ขึ้น...\n\nยืนตรงไม่ได้. จดจ่อไม่ได้. รู้สึกไม่ได้. ยกเว้นความเจ็บปวดที่แล่นแปลบและ—\n\nช่วยด้วย.\n\nอย่างไรก็ตาม.\n\nใครก็ได้.\n\nได้โปรด.\n\n#EMP ได้โปรด#!."
 harm.0531.a:0 "จิตใจข้า... กำลัง #EMP ลุกเป็นไฟ#!..."
 harm.0531.a.tt.success:0 "ความว่างเปล่าถอยห่างออกไป"
 harm.0531.a.tt.failure:0 "ท่านยอมจำนนต่อโรคหลอดเลือดสมองครั้งใหญ่"
 harm.0531.b:0 "ข้ารู้จักตนเองดี และสิ่งนี้จะผ่านไป"
 harm.0531.c:0 "[ROOT.Char.GetFaith.HealthGodName] โปรดประทานกำลังให้ข้าด้วยเถิด"
 harm.0531.c.tt.success:0 "$harm.0531.a.tt.success$"
 harm.0531.c.tt.failure:0 "$harm.0531.a.tt.failure$"

 harm.0532.t:0 "$harm.0531.t.prefix$: คิดไม่ออก"
 harm.0532.desc:0 "ช่วงหลังมานี้ ข้าถูกรบกวนด้วยอาการปวดศีรษะไมเกรนที่น่าสะพรึงกลัวที่สุด พวกมันฉีกทึ้งจิตใจและข่วนร่างกายข้า ส่งเศษเสี้ยวแห่งความทรมานอันแหลมคมสะท้อนไปทั่วกะโหลกศีรษะข้า\n\nเมื่อเวลาผ่านไป แต่ละครั้ง #EMP ก็#! ผ่านไป แต่ไม่เคยเร็วพอสำหรับความชอบของข้า"
 harm.0532.a:0 "อาการปวดหัวอันร้ายกาจเหล่านี้ จะไม่มีวันหยุดเลยหรือ?"
 harm.0532.a.tt:0 "#WEAK พวกมันจะ... อาจจะ...#!"

 harm.0541.t.prefix:0 "โรคภัยไข้เจ็บกลางฤดูหนาว"
 harm.0541.t:0 "$harm.0541.t.prefix$: เงียบและนิ่ง"
 harm.0541.desc.baby:0 "...\n\nข้าสงสัย. ข้าสงสัยว่าชีวิตจะเป็นอย่างไร\n\n..."
 harm.0541.desc.fallback:0 "ดึงผ้าห่มให้แน่นขึ้น. เก็บแขนขาให้ชิดขึ้น. กัดฟันที่แข็งทื่อสู้กับความหนาวเย็น\n\nฝันร้ายอันหนาวเหน็บของฤดูหนาวนี้ดูเหมือนจะดูดซับสุขภาพทุกอณูออกจากร่างกายข้า ทิ้งให้ข้าเป็นคนน่าสังเวชที่แทบจะไอไม่ได้ ข้าจะไม่ยอมแพ้\n\nข้าจะไม่..."
 harm.0541.a:0 "..."
 harm.0541.a.tt.success:0 "$harm.0000.tt.incapable.success$"
 harm.0541.a.tt.failure:0 "ความหนาวเย็นทำงานชั่วร้ายของมัน"
 harm.0541.b:0 "ข้าเคยเผชิญสิ่งที่เลวร้ายกว่านี้"
 harm.0541.c:0 "ข้าจะไม่ถูกล้มลงด้วย #EMP ความหนาวเย็น#!!"
 harm.0541.c.tt.success:0 "$harm.0000.tt.incapable.success$"
 harm.0541.c.tt.failure:0 "$harm.0541.a.tt.failure$"

 harm.0542.t:0 "$harm.0541.t.prefix$: หนาวเข้ากระดูก"
 harm.0542.desc.baby:0 "โลกใบเล็กของข้าช่างแปลกประหลาด ความรู้สึกนี้คืออะไร? เหตุใดข้าจึงไม่อบอุ่น?\n\nมันไม่ได้เป็น เช่นนี้เสมอไป แต่ตอนนี้มันเป็น ข้าไม่เข้าใจ ข้าพยายามร้องออกมา เพื่อเรียกผู้ดูแลมาช่วย แต่ปอดข้าทำได้เพียงไอเบาๆ"
 harm.0542.desc.fallback:0 "ไม่ว่าข้าจะดึงผ้าห่มกลางคืนพันรอบตัวแน่นแค่ไหน ข้าก็ยังรู้สึกหนาวเย็นยิ่งนัก ความหนาวเหน็บอันขมขื่นของฤดูหนาวนี้เกาะติดข้าราวกับเนื้อติดกระดูก ห่อหุ้มข้าไว้ในอ้อมกอดอันกัดกินของมัน\n\nข้าหลับตาแน่น — เช้าจะมาถึงในไม่ช้า และพร้อมกับแสงสว่างและชีวิตของดวงอาทิตย์และเตาผิง"
 harm.0542.a:0 "ข้าหวังเหลือเกินว่ามันจะอุ่นกว่านี้..."
 harm.0542.a.tt:0 "#WEAK ไฟ... ท่านต้องการไฟอีกกอง...#!"

 harm.0551.t.prefix:0 "เล่นสูง"
 harm.0551.t:1 "$harm.0551.t.prefix$: เสียงตุ้บและเสียงหัก"
 harm.0551.desc:1 "ด้วยเดชแห่ง [ROOT.Char.GetFaith.FateGodName] ข้ารักการได้สำรวจ [ROOT.Char.GetCurrentLocation.GetName]! หากไม่ใช่ เพราะเส้นทางลับของข้าผ่านกำแพง ข้าคงไม่มีโอกาสได้ใช้เวลาห่างจากผู้ดูแลที่จู้จี้ของข้า นับประสาอะไรกับการเล่นคนเดียว เช่นนี้\n\nข้าจะมีโอกาสเจอต้นไม้ใหญ่เท่านี้ได้อย่างไร นับประสาอะไรกับการปีนมัน? พวกคนจุ้นจ้านเหล่านั้นคงไม่ยอมให้ข้า... ไม่ยอมให้ข้า...\n\nนี่เป็นต้นไม้ที่สูงทีเดียว ใช่ไหม?"
 harm.0551.a:1 "แค่... ต้องระวัง..."
 harm.0551.a.tt.success:1 "ท่านสามารถปีนลงมาได้"
 harm.0551.a.tt.failure:1 "เสียงตุ้บและเสียงหัก"
 harm.0551.b:1 "ช่วยด้วย ช่วยด้วย! ช่วยด้วย!"
 harm.0551.c:0 "มันดูไม่ #EMP สูง#! ขนาดนั้น..."
 harm.0551.c.tt.success:1 "$harm.0551.a.tt.success$"
 harm.0551.c.tt.failure:1 "$harm.0551.a.tt.failure$"

 harm.0552.t:0 "$harm.0551.t.prefix$: เส้นทางลับ"
 harm.0552.desc:0 "ในฐานะ [ROOT.Char.GetTitleAsNameNoTooltip] ข้าไม่ค่อยมีเวลาอยู่ตามลำพังมากนัก ผู้ดูแลและทหารยามอยู่ทุกหนทุกแห่ง คอยปกป้องข้าจากทั้งอันตรายและความสนุกสนานใดๆ\n\nในที่สุด ข้าก็จัดการได้ทั้งหมด! ต้องใช้ความกล้าหาญเล็กน้อย แต่พวกเขาไม่รู้เส้นทางผ่านกำแพงที่ #EMP ข้า#! รู้\n\nข้าใช้มันบ่อยไม่ได้ แต่เมื่อข้าใช้ [ROOT.Char.GetCurrentLocation.GetName] ทั้งหมดก็ทอดยาวอยู่เบื้องหน้าข้า อิสรภาพ"
 harm.0552.a:0 "สนุกอะไรอย่างนี้!"
 harm.0552.a.tt:0 "#WEAK แน่นอนว่าไม่มีใครจะหาท่านเจอด้วยวิธีนี้...#!"

 harm.0561.t.prefix:0 "ไม่หนุ่มสาวนัก"
 harm.0561.t:0 "$harm.0561.t.prefix$: การตกต่ำ"
 harm.0561.desc_adventurer: "อีกครั้ง ข้าพบว่าตนเองกำลังมองข้ามกองโคลนและเชือกเต็นท์ และสงสัยว่าข้าต้องการผู้ดูแลหรือไม่\n\nมันควรจะง่าย ข้าเป็น [ROOT.Char.GetWomanMan] ที่โตแล้ว และข้ารู้วิธีข้ามค่ายโดยไม่คอหัก ให้ตายสิ\n\nมันควรจะง่ายมากๆ #EMP มากๆ#! เลยทีเดียว\n\nและถึงกระนั้น..."
 harm.0561.desc:0 "อีกครั้ง ข้าพบว่าตนเองกำลังมองบันไดลงจากห้องของข้า และสงสัยว่าข้าต้องการผู้ดูแลหรือไม่\n\nมันควรจะง่าย ข้าเป็น [ROOT.Char.GetWomanMan] ที่โตแล้ว และข้ารู้วิธีใช้บันไดโดยไม่คอหัก ให้ตายสิ\n\nมันควรจะง่ายมากๆ #EMP มากๆ#! เลยทีเดียว\n\nและถึงกระนั้น..."
 harm.0561.a:0 "โอ้ — เดี๋ยว — ไม่-"
 harm.0561.a.tt.success:0 "$harm.0000.tt.incapable.success$"
 harm.0561.a.tt.failure:0 "$harm.0000.tt.incapable.failure$"
 harm.0561.b:0 "ก้าวเท้าทีละก้าว ใจเย็นๆ"
 harm.0561.c:0 "มันก็แค่ #EMP บันได#!."
 harm.0561.c.adventurer:0 "มันก็แค่ #EMP เต็นท์#!."
 harm.0561.c.tt.success:0 "$harm.0000.tt.incapable.success$"
 harm.0561.c.tt.failure:0 "$harm.0000.tt.incapable.failure$"

 harm.0562.t:0 "$harm.0561.t.prefix$: ความเปราะบางที่เพิ่มขึ้น"
 harm.0562.desc_adventurer: "ลุกขึ้นจากเตียง ก้าวออกไปสู่ความวุ่นวายของค่าย ข้าพบว่าตนเองแทบจะเกาะเสาเต็นท์ไว้\n\nนี่... นี่ควรจะง่าย ทว่ามันดูยากเหลือเกิน ลางร้ายเหลือเกิน ความยุ่งเหยิงของโคลน เชือกเต็นท์ และสัมภาระทอดยาวอยู่เบื้องหน้าข้าราวกับนิรันดร์...\n\nไม่ ไม่ ข้ากำลังทำตัวเกินจริง ข้าคือ #EMP [ROOT.Char.GetTitleAsNameNoTooltip]#! และข้าสามารถข้ามค่ายของข้าได้โดยไม่ต้องมีผู้ช่วย"
 harm.0562.desc:0 "ปีนบันไดลงจากห้องนอน ข้าพบว่าตนเองแทบจะเกาะผนังไว้\n\nนี่... นี่ควรจะง่าย ทว่ามันดูยากเหลือเกิน ลางร้ายเหลือเกิน บันไดแคบๆ ทอดยาวอยู่เบื้องหน้าข้าราวกับนิรันดร์...\n\nไม่ ไม่ ข้ากำลังทำตัวเกินจริง ข้าคือ #EMP [ROOT.Char.GetTitleAsNameNoTooltip]#! และข้าสามารถออกจาก [ROOT.Char.Custom('GetRoom')|l] ของข้าได้โดยไม่ต้องมีผู้ช่วย"
 harm.0562.rump: ""
 harm.0562.a:0 "น่ากังวล"
 harm.0562.a.tt:0 "#WEAK เมื่อไหร่สิ่งนี้กลายเป็นปัญหาสำหรับท่าน?#!"

 harm.0571.t.prefix:0 "การฝึกที่จำเป็น"
 harm.0571.t:0 "$harm.0571.t.prefix$: การโจมตีโดยบังเอิญ"
 harm.0571.desc:0 "การฝึก [sparring_partner.GetTitledFirstName] ให้เป็นนักสู้ที่ดีขึ้นเป็นหนึ่งในหน้าที่ที่หนักหนาสาหัสกว่าของข้า แต่ก็ยังเป็นสิ่งที่จำเป็นในฐานะ [ROOT.Char.GetTitleAsName]\n\nการประลองในวันนี้น่าหงุดหงิดเป็นพิเศษ โดย [sparring_partner.GetFirstNamePossessiveNoTooltip] แสดงฝีมือได้แย่กว่าที่เคย ข้าสงสัยบางครั้งว่า—\n\nความเจ็บปวดเบ่งบานไปทั่วกะโหลกศีรษะข้า ข้า... [sparring_partner.GetSheHe] โจมตีข้า #EMP ที่ขมับ#! หรือ? ช่างเป็น #EMP คนโง่#! ประเภทไหนกัน..."
 harm.0571.a:0 "ด้วยเดชแห่ง [ROOT.Char.GetFaith.TricksterGodName] เจ้าคนโง่ นั่นหัวข้านะ!"
 harm.0571.a.tt.success:0 "$harm.0000.tt.incapable.success$"
 harm.0571.a.tt.failure:0 "$harm.0000.tt.incapable.failure$"
 harm.0571.b:0 "แค่รอยขีดข่วนเล็กน้อย"
 harm.0571.c:0 "หายใจเข้า — มันอาจจะแย่กว่านี้"
 harm.0571.c.tt.success:0 "$harm.0000.tt.incapable.success$"
 harm.0571.c.tt.failure:0 "$harm.0000.tt.incapable.failure$"

 harm.0572.t:0 "$harm.0571.t.prefix$: แค่อุบัติเหตุ"
 harm.0572.desc:0 "ประลองกันใน [ROOT.Char.Custom('GetCourtyard')] ของข้า [sparring_partner.GetTitledFirstName] และข้าประสานดาบฝึกซ้อมเข้าด้วยกันในการร่ายรำที่หากอยู่บนสมรภูมิแล้ว น่าจะ ส่งผลให้ [sparring_partner.GetHerHim] ตายไปนับพันครั้ง\n\n[sparring_partner.GetSheHe|U] ไม่ใช่นักรบอย่างข้า\n\nถึงกระนั้น มันก็เป็นการฝึกที่จำเป็นสำหรับคนที่ควรจะเป็นตัวแทนข้าในสนามรบ ดังนั้นข้าจึงสละเวลา—\n\nด้วยเดชแห่ง [ROOT.Char.GetFaith.WarGodName]! การโจมตีนั้นเกือบโดนกะโหลกข้า!"
 harm.0572.a:0 "ระวังหน่อย เจ้าคนหยาบคาย!"
 harm.0572.a.tt:0 "#WEAK ท่านอาจจะบาดเจ็บหนักกว่านี้มาก..."

 harm.0581.t.prefix:0 "ความสันโดษที่หาได้ยาก"
 harm.0581.t:0 "$harm.0581.t.prefix$: การก้าวพลาด"
 harm.0581.desc:0 "การได้เพลิดเพลินกับการอาบน้ำตามลำพังที่หาได้ยาก ห่างจากคนรับใช้และผู้ติดตามที่ชอบบ่น เป็นความสุขที่น่ายินดีสำหรับข้า เป็นเรื่องยากเหลือเกินที่จะมีเวลาอยู่ตามลำพังโดยสิ้นเชิง และข้าก็ดื่มด่ำกับทุกช่วงเวลาของมัน\n\nถึงกระนั้น ทุกสิ่งที่ดีงามย่อมมีวันสิ้นสุด และข้าเริ่มยันตัวออกจากอ่างอาบน้ำ\n\nแต่— แต่การจับของข้าไม่มั่นคงอย่างที่คิด เท้าข้าลื่น และข้าเริ่มไถลอย่างรวดเร็วและไม่คาดคิด"
 harm.0581.a:0 "เดี๋ยว [ROOT.Char.GetFaith.TricksterGodName] ม—"
 harm.0581.a.tt.success:0 "$harm.0000.tt.incapable.success$"
 harm.0581.a.tt.failure:0 "$harm.0000.tt.incapable.failure$"
 harm.0581.b:0 "ค่อยๆ ทำ ค่อยๆ ปลอดภัย"

 harm.0582.t:0 "$harm.0581.t.prefix$: ลื่นเมื่อเปียก"
 harm.0582.desc:0 "การอาบน้ำคนเดียวเป็นความสุขที่หาได้ยากสำหรับข้า ในฐานะ [ROOT.Char.GetTitleAsNameNoTooltip] เป็นการยากที่จะหาช่วงเวลาที่ไม่ถูกรบกวนโดยคนรับใช้หรือ [ROOT.Char.Custom('GetCourtier')|l] ที่ต้องการจะพูดคุยเงียบๆ โดยไม่มีการขัดจังหวะ — แม้กระทั่งสิ่งที่ใกล้ชิดอย่างการทำความสะอาดตัวเองก็ยังต้องเผชิญกับสิ่งนั้น\n\nค่อยๆ ยันร่างอันอ่อนระทวยของข้าออกจากอ่างอาบน้ำ ข้าจับขอบอ่างและก้าวไปยังกองผ้าขนหนูที่พับรออยู่\n\nยกเว้น... ไม่เชิง\n\nเท้าข้า ซึ่งยังเปียกอยู่ ลื่น และเป็นเพียงปฏิกิริยาตอบสนองของข้าเท่านั้นที่หยุดข้าไม่ให้ล้มลงกับพื้น"
 harm.0582.a:0 "ข้าควรจะระวังมากกว่านี้ ข้าเดา"
 harm.0582.a.tt:0 "#WEAK ไม่ใช่ว่าท่านอาบน้ำโดยไม่มีผู้ดูแลบ่อยนัก..."

 harm.0591.t.prefix:0 "ปราศจากความระมัดระวัง"
 harm.0591.t:0 "$harm.0591.t.prefix$: ความตายจากเบื้องบน"
 harm.0591.desc:0 "ธุระเล็กน้อยในเมือง ทำให้ข้าเสียเวลานานกว่าที่ต้องการ แต่ในที่สุด คณะผู้ติดตามของข้าและข้าก็มุ่งหน้ากลับบ้าน\n\nชาวเมือง [ROOT.Char.GetCurrentLocation.GetBaronyNameExplicitly] เดินขวักไขว่ไปตามถนนในเมืองที่ใหญ่ที่สุดของมัน แต่ละคนดำเนินชีวิตอันต่ำต้อยของตนโดยแทบไม่คิดถึง [ROOT.Char.GetTitleAsNameNoTooltip] ที่ขี่ม้าผ่านถนนของพวกเขา\n\nความตระหนักรู้อันแผดเผากะทันหันเผาไหม้เข้าสู่จิตสำนึกของข้า: #EMP อันตราย#!. มีบางอย่างอยู่เหนือข้าโดยตรง กำลังตกลงมาอย่างรวดเร็ว"
 harm.0591.a:0 "โยนตัวไปด้านข้าง"
 harm.0591.a.tt.success:0 "ท่านปลอดภัย"
 harm.0591.a.tt.failure:0 "หม้อของชาวเมืองกระแทกขมับท่าน"
 harm.0591.b:0 "#EMP ข้าไม่เคยปลอดภัยเลยหรือ?!#!"
 harm.0591.b.tt:0 "ท่านตอบสนองด้วยความเร็วที่เกิดจากความหวาดระแวง"
 harm.0591.c:0 "ข้ากำลังเคลื่อนไหวอยู่แล้ว"
 harm.0591.c.tt.success:0 "$harm.0591.a.tt.success$"
 harm.0591.c.tt.failure:0 "$harm.0591.a.tt.failure$"

 harm.0592.t:0 "$harm.0591.t.prefix$: การกำจัด"
 harm.0592.desc:0 "ขี่ม้าไปตามถนนของ [ROOT.Char.GetCurrentLocation.GetBaronyNameExplicitly] หลังจากจัดการธุระเล็กน้อยในเมืองเสร็จแล้ว คณะผู้ติดตามของข้าและข้าได้ยินเสียงดังโครม\n\nการสืบสวนเล็กน้อยแสดงให้เห็นว่าเป็นชาวเมืองคนใดคนหนึ่งโยนหม้อดินเหนียวลงมาจากหน้าต่าง โดยไม่สนใจว่ามันอาจจะโดนใครข้างล่าง\n\nใจดำ ใช่ แต่ท่านจะคาดหวังอะไรได้?\n\nอย่างไรก็ตาม มันแทบไม่ใช่เรื่องที่ควรค่าแก่การคิดต่อไปมากนัก"
 harm.0592.a:0 "พวก #EMP ไพร่#! เหล่านี้"
 harm.0592.a.tt:0 "#WEAK นั่นอาจจะทำร้ายใครบางคนได้..."

 harm.0601.t.prefix:0 "การเล่นที่รุนแรง"
 harm.0601.t:0 "$harm.0601.t.prefix$: ผลที่ตามมา"
 harm.0601.desc:0 "ดังที่เราทำบ่อยๆ [playmate.GetFirstName] และข้ากำลังเล่นกันอยู่ในส่วนที่ไม่ได้ใช้งานของวังของข้า\n\nในฐานะเพื่อนสนิท เราสามารถ #EMP หา#! วิธีสร้างความบันเทิงให้ตนเองได้เสมอ และเป็นการดีที่มีคนที่ไม่ใช่ทหารยามหรือผู้ดูแลอยู่ใกล้ๆ บ้าง\n\nวันนี้ เรากำลังเล่นมวยปล้ำจำลองกันห่างไกลจากผู้ดูแลที่น่าอึดอัด ซึ่งปกติจะเข้ามาแทรกแซง มันสนุกมาก! ยกเว้น... ยกเว้นว่าการรัดคอครั้งสุดท้ายนั้น ทำให้ข้ารู้สึกเวียนหัวเล็กน้อยและ... #DIE1 และ...#!"
 harm.0601.a:0 "ข้า... รู้สึกไม่ค่อยดี..."
 harm.0601.a.tt.success:0 "$harm.0000.tt.incapable.success$"
 harm.0601.a.tt.failure:0 "$harm.0000.tt.incapable.failure$"

 harm.0602.t:0 "$harm.0601.t.prefix$: มีอะไรเสียหาย?"
 harm.0602.desc:0 "ข้ารักการเล่นกับ [playmate.GetFirstName] [playmate.GetSheHe] รู้เสมอว่าเราจะทำอะไรให้สนุกได้!\n\nปีนตึก แกล้งสัตว์ หลอกข้าราชบริพารของข้า... มันก็แค่เรื่องตลกเล็กน้อย และมัน ทำให้ราชสำนักมีชีวิตชีวาขึ้น ข้าแค่อยากสนุกกับ [playmate.GetHerHim] ตลอดไป"
 harm.0602.a:0 "เราควรเล่นกันทุกวัน!"
 harm.0602.a.tt:0 "#WEAK พวกท่านทั้งคู่ก็แค่เด็กๆ เท่านั้นเอง..."

 harm.0611.t.prefix:0 "ไกลเกินไป เร็วเกินไป"
 harm.0611.t:0 "$harm.0611.t.prefix$: ความสูงที่น่าเวียนหัว"
 harm.0611.desc.intro:0 "หลังจากตอบจดหมายอย่างวุ่นวายอีกเย็นหนึ่ง ข้าขยับตัวเพื่อยืน อาหารเย็นเรียกหา และข้าปรารถนา— ด้วยเดชแห่ง [ROOT.Char.GetFaith.HealthGodName] นี่คือ #EMP การพลุ่งพล่าน#! อะไร? เหตุใดข้าจึงหน้ามืด เช่นนี้?\n\nอยู่ที่ไหน... ข้าอยู่ที่ไหน? เกิดอะไรขึ้น?\n\n"
 harm.0611.desc.blind:0 "ราวกับว่าข้าได้พุ่งขึ้นไปบนก้อนเมฆเอง ข้าไม่ได้ยินอะไรเลย ข้ารู้สึกไม่ได้เลย เพียงแค่ความรู้สึกห่างไกล ความสูงที่น่าเวียนหัว และเสียงเลือดเต้นตุบๆ ในเส้นเลือดของข้า"
 harm.0611.desc.fallback:0 "การมองเห็นของข้าเริ่มแคบลง การมองเห็นและเสียงถูกแทนที่ด้วยความมืดที่ถาโถมเข้ามาและความคาดหวังถึงจุดจบอันรวดเร็ว"
 harm.0611.a:0 "เดี๋ยว.. อะ... ของข้า..."
 harm.0611.a.tt.success:0 "$harm.0000.tt.incapable.success$"
 harm.0611.a.tt.failure:0 "$harm.0000.tt.incapable.failure$"
 harm.0611.b:0 "กัดฟันสู้กับอาการหน้ามืด"
 harm.0611.c:0 "ตั้งสติ ความชัดเจน #EMP ตั้งสติ#!."
 harm.0611.c.tt.success:0 "$harm.0000.tt.incapable.success$"
 harm.0611.c.tt.failure:0 "$harm.0000.tt.incapable.failure$"

 harm.0612.t:0 "$harm.0611.t.prefix$: อาการหน้ามืด"
 harm.0612.desc:0 "นั่นคือฉบับสุดท้ายแล้ว จดหมายร้อยเอ็ดฉบับ หรือรู้สึกเหมือนอย่างนั้น จากข้าราชการต่างๆ ที่ ทำให้ [ROOT.Char.Custom('GetRealmOrDomicile')|l] ของข้าดำเนินต่อไป — ไม่ต้องพูดถึงทั้งเย็นที่เสียไปกับการตอบ แต่ละฉบับ\n\nตอนนี้ ข้าคิดว่า อาหารมื้อเล็กๆ ก่อนนอน\n\nดันเก้าอี้ออก ข้าลุกขึ้นยืนอย่างรวดเร็วและ... และ... ช่าง... เวียนหัว เลือดเต้นตุบๆ ในเส้นเลือด\n\nตั้งสติ\n\n#EMP ตั้งสติ#!.\n\nอึก นั่นมัน #EMP อะไร#!?"
 harm.0612.a:0 "ข้ายังเวียนหัวอยู่"
 harm.0612.a.tt:0 "#WEAK ร่างกายของท่านอ่อนแอขนาดนี้เชียวหรือ?#!"

 harm.0621.t.prefix:0 "หมักดอง"
 harm.0621.t:0 "$harm.0621.t.prefix$: ช่วงเวลาแห่งความสุข"
 harm.0621.desc:0 "อีกคืน อีกไพนต์ นั่นคือสิ่งที่ข้าพูดเสมอ! และมี #EMP เสมอ#! อีกคืน!\n\nโรงเตี๊ยมเล็กๆ ใน [ROOT.Char.GetCurrentLocation.GetName] หมุนรอบตัวข้า ภาพใบหน้าและการกระทำที่พร่ามัว อีก! อีก... นี่... โต๊ะนี้ยากที่จะลุกออกไป ข้าจะยืนได้อย่างไร?\n\nข้าจะ... อุ๊ปส์ ล้มลง—อ๊าก ด้วยเดชแห่ง [ROOT.Char.GetFaith.HealthGodName] หัวข้า..."
 harm.0621.a:0 "*เอิ๊ก*... *เอิ๊ก*... ..."
 harm.0621.a.tt.success:0 "$harm.0000.tt.incapable.success$"
 harm.0621.a.tt.failure:0 "$harm.0000.tt.incapable.failure$"
 harm.0621.b:0 "ฮิฮิ เดาว่าข้าคงจะรู้สึกถึงมันในตอนเช้า"
 harm.0621.c:0 "อุ๊ฟ หัวข้า นั่นมันแย่มากเลยใช่ไหม?"
 harm.0621.c.tt.success:0 "$harm.0000.tt.incapable.success$"
 harm.0621.c.tt.failure:0 "$harm.0000.tt.incapable.failure$"

 harm.0622.t:0 "$harm.0621.t.prefix$: นิสัยที่ไม่ดี"
 harm.0622.desc:0 ""เจ้าของร้าน อีกรอบ!" ข้าร้องตะโกน ท่ามกลางเสียงโห่ร้องและตะโกนมากมาย\n\nขณะที่เสียงเชียร์ดังขึ้นจากผู้ร่วมดื่มในโรงเตี๊ยม-*เอิ๊ก*-คนอื่นๆ ข้ายิ้ม ครึ่งหนึ่งของ [ROOT.Char.GetCurrentLocation.GetName] ต้องอยู่ในนี้แล้วตอนนี้ ทุกคนเชียร์และโห่ร้องให้ข้า\n\nท้ายที่สุดแล้ว ใครจะดื่มไพนต์ได้เหมือน #EMP ข้า#!?"
 harm.0622.a:0 "ชีวิตช่างดี"
 harm.0622.a.tt:0 "#WEAK และดีขึ้นเมื่อมีเครื่องดื่มมากขึ้น!#!"

 harm.0631.t.prefix:0 "ความสุขสม"
 harm.0631.t:0 "$harm.0631.t.prefix$: ช่วงเวลาแห่งความสุขสุดเหวี่ยง"
 harm.0631.desc:0 "[bonker.GetFirstName] ทำให้ข้ารู้สึกเหมือนเป็น [ROOT.Char.GetWomanMan] ที่โชคดีที่สุดในโลก ในเย็น เช่นนี้ เมื่อความรักของเราสามารถแสดงออกทางกายได้ ความรักของ [bonker.GetHerHis] ก็ปรากฏชัดเจนในตัวเอง\n\nนิ้วข้าจิกเกร็ง ตาข้าเหลือก และข้าพุ่งเข้าหาคนรักที่กระตือรือร้นที่สุดในชีวิตข้า\n\nเลือดสูบฉีด ข้าแทบจะจดจ่อไม่ได้ เลือด เลือด... สูบฉีด... นี่คือ... นี่ไม่ใช่..."
 harm.0631.a:0 "เดี๋ยว — ข้าทำไม่ได้ — หน้าอกข้า!"
 harm.0631.a.tt.success:0 "$harm.0000.tt.incapable.success$"
 harm.0631.a.tt.failure:0 "$harm.0000.tt.incapable.failure$"
 harm.0631.b:0 "ม-ไม่ เจ้าทำไม่ได้ หัวใจ ไม่ใช่ #EMP ตอนนี้#!..."
 harm.0631.c:0 "ข้าแค่ต้องผ่านมันไปให้ได้"
 harm.0631.c.tt.success:0 "$harm.0000.tt.incapable.success$"
 harm.0631.c.tt.failure:0 "$harm.0000.tt.incapable.failure$"

 harm.0632.t:0 "$harm.0631.t.prefix$: ดนตรีอันไพเราะ"
 harm.0632.desc:0 "ด้วยดวงดาวทั้งหมดเบื้องบน [bonker.GetFirstName] ดึงไฟรักอันร้อนแรงที่สุดในตัวข้าออกมา ไม่มี [bonker.GetWomanMan] คนใดสามารถมอบประสบการณ์อันโลดโผนให้ข้าได้ คืนอันแสนสุขเท่า [bonker.GetSheHe] และในขณะนี้ ข้าคิดไม่ออกเลยว่ามี—\n\n...\n\n—คนที่ข้าอยากอยู่ด้วยมากกว่า"
 harm.0632.a:0 "[bonker.GetFirstNameNoTooltip] ทำให้ข้ารู้สึก #EMP มีชีวิตชีวา#! เหลือเกิน"
 harm.0632.a.tt:0 "#WEAK มีชีวิตชีวามากๆ...#!"

 harm.0641.t.prefix:0 "การบริโภคของเหลว"
 harm.0641.t:0 "$harm.0641.t.prefix$: อาการบวมเล็กน้อย"
 harm.0641.desc:0 "ให้ตายสิ โรคบวมน้ำอันร้ายกาจนี้ ข้าจะมีความสงบสุขไม่ได้เลยหรือ? เนื้อหนังข้า... #EMP บวม#! ด้วยความเสื่อมทรามนี้ ของเหลวสีซีดและเนื้อเยื่อสีซีดค่อยๆ ยื่นออกมาเกินกว่าที่ควรจะเป็น\n\nร่างอันอ้วนฉุ บวมเป่งของข้าถูกทรมานด้วยความเจ็บปวด และข้าก็ เช่นกัน\n\nข้าคิดอะไรไม่ออก\n\nข้าทำได้เพียงทนทุกข์\n\nทนทุกข์ ทนทุกข์ และคร่ำครวญ..."
 harm.0641.a:0 "เกิดอะไร... ผิดปกติกับข้า..."
 harm.0641.a.tt.success:0 "$harm.0000.tt.incapable.success$"
 harm.0641.a.tt.failure:0 "$harm.0000.tt.incapable.failure$"
 harm.0641.b:0 "สิ่งนี้จะผ่านไป"
 harm.0641.c:0 "แน่นอนว่าสิ่งนี้ต้องรักษาได้?"
 harm.0641.c.tt.success:0 "$harm.0000.tt.incapable.success$"
 harm.0641.c.tt.failure:0 "$harm.0000.tt.incapable.failure$"

 harm.0642.t:0 "$harm.0641.t.prefix$: ความไวต่อความรู้สึก"
 harm.0642.desc: "ช่วงหลังมานี้ ข้อต่อของข้าปวดเมื่อยเหลือเกิน\n\nมีอาการ... ช้ำ? อักเสบ? อย่างน้อยที่สุด มีการสะสมของน้ำรอบๆ ส่วนที่เคลื่อนไหวได้ของแขนขาข้า ซึ่ง ทำให้ข้าทุกข์ทรมานไม่น้อย\n\nข้ามีเพียงความหวังว่ามันจะทุเลาลง เมื่อเวลาผ่านไปและได้พักผ่อน"
 harm.0642.a:0 "อ๊าก นั่นเจ็บเล็กน้อย"
 harm.0642.a.tt:0 "#WEAK มันจะผ่านไปแน่นอน..."












 ##################################################
 # #Random Death Events
 harm.1001.t.prefix:0 "อาหารเย็น"
 harm.1001.t:0 "$harm.1001.t.prefix$: สำลักตาย"
 harm.1001.desc:0 "อาหารเย็นคืนนี้เป็นการผสมผสานของอาหารจานโปรดหลายอย่างของข้า — ช่วงหลังมานี้อาหารที่ผลิตออกมาอร่อยอย่างไม่คาดคิด และข้าก็กินมันอย่างเอร็ดอร่อย\n\nยกเว้น ยกเว้นมีบางอย่างไม่... คอข้า มีบางอย่างติดอยู่ในคอข้า!\n\nอากาศ หายใจไม่ออก— #EMP อากาศ#!."
 harm.1001.a:0 "พยายามไอเอามันออกมา"
 harm.1001.a.tt.success:0 "$harm.0000.tt.death.success$"
 harm.1001.a.tt.failure:0 "$harm.0000.tt.death.failure$"
 harm.1001.b:0 "ใจเย็นๆ หายใจเข้า"
 harm.1001.c:0 "ทุบหน้าอกและปอด"
 harm.1001.c.tt.success:0 "$harm.0000.tt.death.success$"
 harm.1001.c.tt.failure:0 "$harm.0000.tt.death.failure$"

 harm.1002.t:0 "$harm.1001.t.prefix$: เกือบติดคอ"
 harm.1002.desc:0 "ด้วยอาการไอและสำลัก ข้าเคลียร์ทางเดินหายใจตามสัญชาตญาณ อาหารเย็นน่าอร่อย แต่บางที... #EMP อร่อยเกินไป#! เพราะข้าสำลักมันเร็วไปหน่อย\n\nใจเย็นๆ ข้าบอกตัวเอง\n\nไม่มีเหตุผลให้ต้องรีบร้อน"
 harm.1002.a:0 "ข้าแค่กำลังเพลิดเพลินกับอาหารมากเป็นพิเศษช่วงนี้"
 harm.1002.a.tt:0 "#WEAK มันเป็นความสุขที่ไม่เป็นอันตราย..."

 harm.1011.t.prefix:0 "ตื่นตกใจ"
 harm.1011.t:0 "$harm.1011.t.prefix$: ขี่หรือตาย"
 harm.1011.desc:0 "ขณะที่คณะผู้ติดตามของข้าและข้ากลับจากทำธุระในชนบทของ [ROOT.Char.GetCurrentLocation.GetName] มีบางสิ่งที่เล็กและดุร้ายคลานออกมาจากใต้ก้อนหินและขู่ฟ่อม้าของข้า\n\nโดยไม่คาดคิด ม้าตื่นตระหนก เตะเข้าสู่การพุ่งชนที่ดุเดือดและไม่มั่นคง และพุ่งออกไปด้วยความเร็วสูง\n\nด้วยความหวาดกลัวจากปฏิกิริยาตามสัญชาตญาณของมันเองพอๆ กับสิ่งอื่นใด สัตว์ร้ายพยศและเตะขณะวิ่ง เกือบจะล้มลงเอง นับประสาอะไรกับข้า"
 harm.1011.a:0 "เกาะไว้แน่นเพื่อชีวิต"
 harm.1011.a.tt.success:0 "$harm.0000.tt.death.success$"
 harm.1011.a.tt.failure:0 "$harm.0000.tt.death.failure$"
 harm.1011.b:0 "ก้มหัวลง เกาะแน่น"
 harm.1011.c:0 "นี่ไม่ใช่ครั้งแรกที่ข้าเจอม้าตื่นตกใจ"
 harm.1011.c.tt.success:0 "$harm.0000.tt.death.success$"
 harm.1011.c.tt.failure:0 "$harm.0000.tt.death.failure$"

 harm.1012.t:0 "$harm.1011.t.prefix$: ระหว่างทางกลับ"
 harm.1012.desc:0 "เช่นเดียวกับผู้นำทุกคน เป็นที่คาดหวังว่าข้าจะสามารถขี่ม้าได้ ทั้งบ่อยครั้งและดี ข้าคงไม่สามารถจัดการ [ROOT.Char.Custom('GetRealmOrDomicile')|l] ของข้าได้หากข้าทำไม่ได้ ท้ายที่สุดแล้ว\n\nธุระในวันนี้เป็นงานเล็กน้อยในชนบทของ [ROOT.Char.GetCurrentLocation.GetBaronyNameExplicitly] สิ่งที่คณะผู้ติดตามของข้าและข้าสามารถแก้ไขได้อย่างรวดเร็วและด้วยตนเอง—\n\nโดยไม่มีการเตือน ม้าของข้าพยศ ตื่นตกใจจากสัตว์เล็กๆ บางตัวบนเส้นทาง ข้าเกือบถูกเหวี่ยงอย่างแรง เพียงแค่ควบคุมกลับมาได้ในวินาทีสุดท้าย"
 harm.1012.a:0 "โว้ว นั่นไง สาวน้อย ใจเย็นๆ..."
 harm.1012.a.tt:0 "#WEAK นั่นอาจจะแย่มาก..."

 harm.1021.t.prefix:0 "ท้องอิ่ม"
 harm.1021.t:0 "$harm.1021.t.prefix$: มากเกินไป"
 harm.1021.desc:0 "อาหารเย็น อาหารที่ดีที่สุด ไม่ต้องพูดถึงมื้อใหญ่ที่สุดของวัน!\n\nอาาา ช่างเป็นช่วงเวลาที่น่ารื่นรมย์ที่จะมีชีวิตอยู่: มีเนื้อสัมผัสมากมายให้ลิ้มลอง มีรสชาติมากมายให้ซึมซับ มีรสชาติเข้มข้นมากมายให้— ให้—\n\nมีก้อนในท้องข้า\n\nเนื้องอกแห่งความเจ็บปวดที่เบ่งบาน ดูดท้องข้าแม้ขณะที่มันลากนิ้วเย็นเฉียบแห่งความทรมานไปทั่วอวัยวะส่วนที่เหลือของข้า ไม่ใช่ยาพิษร้ายแรง เพียงแค่การบรรจบกันอันน่าสะพรึงกลัวของอาหารรสเลิศที่ฉีกทึ้งภายในข้า\n\nข้ากินอะไรเข้าไป... #DIE1 ข้า#!... #DIE2 อึก#!..."
 harm.1021.a:0 "ข้า... รู้สึกไม่ค่อยดี..."
 harm.1021.a.tt.success:0 "$harm.0000.tt.death.success$"
 harm.1021.a.tt.failure:0 "$harm.0000.tt.death.failure$"
 harm.1021.b:0 "เอาน้ำเย็นมาให้ข้า — ข้าต้องนอนลง เดี๋ยวนี้"
 harm.1021.c:0 "เราต้องมียาบางชนิดในคลังสำหรับเรื่องนี้!"
 harm.1021.c.tt.success:0 "$harm.0000.tt.death.success$"
 harm.1021.c.tt.failure:0 "$harm.0000.tt.death.failure$"

 harm.1022.t:0 "$harm.1021.t.prefix$: ไม่เพียงพอ"
 harm.1022.desc:0 "ด้วยเดชแห่ง [ROOT.Char.GetFaith.HouseholdGodName] ข้า #EMP อิ่ม#! แล้ว เอนกายบนเก้าอี้หลังอาหารเย็น ฟัง [ROOT.Char.Custom('GetCourtierPlural')] ของข้าพูดคุยกัน โลกรู้สึกถูกต้องเป็นครั้งแรก\n\nข้ารอคอยอาหารเย็นมากขึ้นเรื่อยๆ จริงๆ ช่วงนี้ ภาพ รสชาติ เสียง... แค่ความรู้สึกของน้ำผลไม้เข้มข้นและซอสครีมที่หยดลงบนคางข้า\n\nอย่างน้อย จนกระทั่งท้องข้าร้องครวญครางด้วยความพยายามของอาหารรสเลิศทั้งหมดนี้ และอาการปั่นป่วนเล็กน้อยขู่ว่าจะ ทำให้ลำไส้ข้าทะลักออกมา\n\nถึงกระนั้น มันก็หายไปเร็วเท่ากับที่มันมา ส่วนใหญ่ในตอนเย็น"
 harm.1022.a:0 "ข้าดีใจที่มันผ่านไปอย่างรวดเร็ว"
 harm.1022.a.tt:0 "#WEAK กลับไปทานอาหารเย็น..."

 harm.1031.t.prefix:0 "คออุดตัน"
 harm.1031.t:0 "$harm.1031.t.prefix$: การขาดอากาศหายใจ"
 harm.1031.desc:0 "ไฟร้อนแดงในเส้นเลือด ทำให้ข้าตกใจตื่น เสียงกรีดร้องอันแผดเผาของเนื้อหนังที่ร้องหาอากาศ หาความบรรเทา หาบางสิ่ง\n\nปากข้า... คอข้า... อุดตัน? ไม่ได้ยัด แต่ถูกปิดกั้นด้วยบางสิ่งที่น่ารังเกียจที่พุ่งขึ้นมาจากภายใน\n\nข้าขากก้อนหนองสีเหลืองข้นหวานออกมา กลิ่นเหม็นของความตายและเนื้อเน่าเปื่อยห้อยลงมาจากเสมหะเหนียว แต่ละสาย แต่มันก็ยังคงออกมาเรื่อยๆ\n\nช่วยด้วย ข้าต้องการ #EMP ช่วย#!."
 harm.1031.a:0 "หายใจ... ไม่ออก..."
 harm.1031.a.tt.success:0 "$harm.0000.tt.death.success$"
 harm.1031.a.tt.failure:0 "$harm.0000.tt.death.failure$"
 harm.1031.b:0 "´แค่ต้องควบคุม หายใจ จนกว่าจะหา แพทย์เจอ"
 harm.1031.c:0 "ใจเย็นๆ หายใจเบาๆ ไปหาแพทย์"
 harm.1031.c.tt.success:0 "$harm.0000.tt.death.success$"
 harm.1031.c.tt.failure:0 "$harm.0000.tt.death.failure$"

 harm.1032.t:0 "$harm.1031.t.prefix$: หายใจลำบาก"
 harm.1032.desc:0 "ด้วยเดชแห่ง [ROOT.Char.GetFaith.HealthGodName] ครั้งนี้เจ็บปวดมาสอง #EMP วัน#! แล้ว\n\nขากรรไกรข้าปวด คอข้าแหบและระคายเคือง และข้างในปากข้ารู้สึก... บวม? เจ็บเวลากิน เจ็บเวลากลืน เจ็บแม้กระทั่ง #EMP เคี้ยว#!.\n\nเภสัชกรรับรองกับข้าว่าไม่น่ามีอะไรต้องกังวล เป็นเพียงความไม่สมดุลตามธรรมชาติที่จะหายไปเองเมื่อเวลาผ่านไป\n\nข้า... ข้าหวังว่าอย่างนั้น"
 harm.1032.a:0 "สิ่งเหล่านี้มักจะผ่านไป"
 harm.1032.a.tt:0 "#WEAK ความบรรเทาจะมาถึงในไม่ช้า..."

 harm.1041.t.prefix:0 "ผืนน้ำอันสงบ"
 harm.1041.t:0 "$harm.1041.t.prefix$: อุบัติเหตุที่หลีกเลี่ยงไม่ได้"
 harm.1041.desc:0 "เมื่อทหารยามของข้าถูกปลดออกไปอย่างปลอดภัยพ้นสายตา แต่อยู่ในระยะได้ยิน ข้ากำลังเพลิดเพลินกับความสันโดษเล็กน้อยที่ [ROOT.Char.Custom('IndefiniteBodyOfWater_Static')] ที่ข้าเคยขี่ม้าผ่านมาก่อน\n\nจุ่มเท้าลงไปในน้ำเย็น ข้าปิติยินดีกับความรู้สึกสะอาดที่ชะล้างฝุ่นผงของวันไปแล้ว นี่จะเป็นการอาบน้ำแห่งยุคสมัย!\n\nโดยไม่ทันคิด เท้าข้าไถล และข้าสะดุดและล้มหน้าคว่ำลงไปในน้ำ ศีรษะข้ากระแทกกับบางสิ่งที่แข็ง ทำให้ข้ามึนงง\n\nนี่... นี่ลึกกว่าที่ข้าคิด ข้ากำลังถูกดึงลงไป ลงไปสู่ความมืด..."
 harm.1041.a:0 "ต้อง... ขยับ... หายใจ... ไม่ออก..."
 harm.1041.a.tt.success:0 "$harm.0000.tt.death.success$"
 harm.1041.a.tt.failure:0 "$harm.0000.tt.death.failure$"
 harm.1041.b:0 "#EMP ข้าต้องมีชีวิตอยู่!#!"

 harm.1042.t:0 "$harm.1041.t.prefix$: น่าจะปลอดภัย"
 harm.1042.desc:0 "เป็นเรื่องยากพอที่ข้าจะมีเวลาอยู่ตามลำพังใน [ROOT.Char.GetCurrentLocation.GetName] แต่มันก็เกิดขึ้น ค่อนข้างตามลำพัง นั่นคือ — ผู้ดูแลของข้าอยู่ในระยะได้ยิน แต่ไกลพอที่จะให้พื้นที่เล็กน้อยแก่ข้าขณะที่ข้าขี่ม้าผ่านดินแดนของข้า\n\nชั่วขณะหนึ่ง ข้าหยุดข้าง [ROOT.Char.Custom('IndefiniteBodyOfWater_Static')] จุดที่เงียบสงบ ข้าไม่คิดว่าข้าเคยขี่ม้าผ่านที่นี่มาก่อน... มันสงบ ผืนน้ำไหลลึกอย่างชัดเจน แม้ว่ากระแสน้ำวนเล็กน้อยบนพื้นผิวจะบ่งบอกว่าพวกมันไหลไปยังที่ที่ใหญ่กว่าในบริเวณใกล้เคียง\n\nบางทีข้าอาจจะกลับมาที่นี่อีกในไม่ช้า"
 harm.1042.a:0 "จุดที่ดีนะ ที่นี่"
 harm.1042.a.tt:0 "#WEAK คุ้มค่าแก่การกลับมาเยี่ยมชมแน่นอน..."

 harm.1051.t.prefix:0 "เปลวไฟริบหรี่"
 harm.1051.t:0 "$harm.1051.t.prefix$: นรก"
 harm.1051.desc:0 "ข้าถูกปลุกให้ตื่นด้วยเสียงกรีดร้องของ "[ROOT.Char.GetTitledFirstNameNoTooltip]!" จากข้างนอก เสียงร้องเตือนของคนรับใช้ที่หวาดกลัว\n\nขณะที่ข้าตื่นขึ้นมาอย่างกะทันหัน ข้ารู้สึกถึงเหงื่อที่ชุ่มร่างกาย ตามมาติดๆ ด้วยความร้อนที่แผดเผา [ROOT.Char.Custom('GetRoom')] กำลังลุกเป็นไฟ ผิวหนังข้าพุพองไปครึ่งหนึ่งแล้วจากเปลวไฟ!\n\nข้าต้-*ไอ*-องออกไปจากที่นี่ นี่มันเกิดขึ้นได้อย่างไร... #EMP เทียนบ้า#!?\n\nไฟกำลังปิดกั้นทางเข้า และมันก็ยิ่งเลวร้ายลงเรื่อยๆ"
 harm.1051.a:0 "ทางออกเดียวคือฝ่าออกไป!"
 harm.1051.a.tt.success:0 "$harm.0000.tt.death.success$"
 harm.1051.a.tt.failure:0 "$harm.0000.tt.death.failure$"
 harm.1051.b:0 "ออกทางหน้าต่าง นั่นคือเส้นทางที่เร็วที่สุด!"

 harm.1052.t:0 "$harm.1051.t.prefix$: ด้วยแสงเทียน"
 harm.1052.desc:0 "ด้วยความตกใจ ข้าตื่นขึ้น สะบัดมือออกจากเทียนที่จุดอยู่ ซึ่งมันเลื่อนไปโดน ด้วยความทรมานมากมายของ [ROOT.Char.GetFaith.random_EvilGodNames] นั่นแสบ!\n\nด้วยตาที่พร่ามัว ข้ามองไปรอบๆ [ROOT.Char.Custom('GetRoom')|l] ข้าคงเผลอหลับไปโดยไม่ได้ดับเทียน — โชคดีที่มือข้าไปโดนมัน\n\nถ้ามันล้มลงบนเตียง..."
 harm.1052.a:0 "ข้าต้องระวังเทียนเหล่านี้ให้มากขึ้น"
 harm.1052.a.tt:0 "#WEAK นั่นอาจจะแย่กว่านี้มาก..."

 harm.1061.t.prefix:0 "ช่างเป็นทิวทัศน์"
 harm.1061.t:0 "$harm.1061.t.prefix$: ร่วงหล่นลงมา"
 harm.1061.desc:0 "ดังที่ข้าพยายามทำทุกวัน ข้าเริ่มต้นเช้าวันใหม่ด้วยการดื่มด่ำกับภาพและเสียงของโลกนอกหน้าต่างห้องนอนข้า\n\nทุกสิ่งช่างมีชีวิตชีวาเหลือเกินข้างนอกนั่น เต็มไปด้วยแสงสว่างและชีวิต การสร้างสรรค์ดูสมบูรณ์แบบเพียงใด โอ้ ขอเพียงแค่มุมมองจากมุมสูงอีกสักหน่อย ขอเพียงแค่—\n\n#EMP บ้า#! ไกลเกินไป #EMP ลื่น!#!"
 harm.1061.a:0 "คว้ากรอบหน้าต่าง"
 harm.1061.a.tt.success:0 "$harm.0000.tt.death.success$"
 harm.1061.a.tt.failure:0 "$harm.0000.tt.death.failure$"
 harm.1061.b:0 "คว้า-#EMP คว้า#!-คว้า!"
 harm.1061.c:0 "เอนตัวไปข้างหลัง"
 harm.1061.c.tt.success:0 "$harm.0000.tt.death.success$"
 harm.1061.c.tt.failure:0 "$harm.0000.tt.death.failure$"

 harm.1062.t:0 "$harm.1061.t.prefix$: การชื่นชมที่ไม่เป็นอันตราย"
 harm.1062.desc:0 "โอ้ ช่างเป็นวันที่น่าทึ่งข้างนอก!\n\nยืนอยู่ที่หน้าต่างห้องของข้า ข้ารู้สึกดีใจเหลือเกินที่ได้มีชีวิตอยู่ มองลงไปยังผู้คนที่เคลื่อนไหวอยู่เบื้องล่างและถิ่นทุรกันดารอันห่างไกลภายนอก ด้วยความสดชื่น ข้าพร้อมที่จะเริ่มกิจธุระของวันแล้ว\n\nถึงกระนั้น... อีกสักหน่อยก็ไม่เสียหาย ด้วยความกระตือรือร้นที่จะดื่มด่ำกับทุกสิ่ง ข้ายื่นศีรษะออกไปข้างนอก ดื่มด่ำกับอากาศบริสุทธิ์ที่พัดผ่านห้องอันสูงส่ง\n\nและนั่นก็เพียงพอแล้ว"
 harm.1062.a:0 "น่าทึ่ง!"
 harm.1062.a.tt:0 "#WEAK วิธีเริ่มต้นเช้าวันที่น่ารักและไม่เป็นอันตราย..."

 harm.1071.t.prefix:0 "อาชญากรรมจากแรงรักแรงหึง"
 harm.1071.t:0 "$harm.1071.t.prefix$: การลงมือ"
 harm.1071.desc:0 "[ROOT.Char.Custom('GetDoor')] แทบจะพังทลายลงขณะที่ข้าเดินผ่านไป [other.GetTitledFirstName] กำลังหนีสุดชีวิตเท่าที่ [other.GetSheHe] จะทำได้ ทำให้ข้าหงายหลังลงไป\n\nข้าเห็นแสงวาบของเหล็กสีเงินอยู่ข้างหลัง [other.GetHerHim] และเสียงคำรามของ [killer.GetTitledFirstName] ขณะที่ [killer.GetSheHe] ไล่ตาม มีดพุ่งเข้าหาข้าแล้ว — ความโกรธชะงักงันเมื่อ [killer.GetWomanMan] ตระหนักว่าข้า #EMP ไม่ใช่#! เหยื่อที่ตั้งใจไว้ แต่การพุ่งเข้าใส่ที่ไม่สามารถควบคุมได้ของ [killer.GetHerHis] เคลื่อนที่เร็วเกินกว่าจะหยุดได้\n\nปลายมีดพุ่งเข้าหาคอข้า"
 harm.1071.a:0 "หลบมีด"
 harm.1071.a.tt.success:0 "$harm.0000.tt.death.success$"
 harm.1071.a.tt.failure:0 "$harm.0000.tt.death.failure$"
 harm.1071.b:0 "หลบใบมีดไปด้านข้างได้อย่างง่ายดาย"
 harm.1071.c:0 "พึ่งพาปฏิกิริยาตอบสนองของท่าน"
 harm.1071.c.tt.success:0 "$harm.0000.tt.death.success$"
 harm.1071.c.tt.failure:0 "$harm.0000.tt.death.failure$"

 harm.1072.t:0 "$harm.1071.t.prefix$: ความขัดแย้งเล็กน้อย"
 harm.1072.desc:0 ""แล้วอีกอย่างนะ เจ้า [other.Custom2('InsultAdjective', SCOPE.sC('killer'))] [other.Custom2('InsultNoun', SCOPE.sC('killer'))]" [killer.GetTitledFirstName] กรีดร้อง โถมเข้าใส่ [other.GetTitledFirstName] ซึ่งนับเป็นการโต้เถียงเสียงดังครั้งที่สามของวันเห็นจะได้\n\nข้าเมินเฉยต่อการทะเลาะของพวกเขาทั้งที่เสียงดัง และเดินผ่านไป ทั้งคู่เถียงกันตลอดเวลา และแม้จะเสียงดัง แต่ท้ายที่สุดก็ไม่มีพิษมีภัย\n\nข้ามีเรื่องใหญ่ให้กังวลมากกว่าการทะเลาะกันเล็กน้อยระหว่าง [ROOT.Char.Custom('GetCourtierPlural')|l] ของข้า"
 harm.1072.a:0 "แค่อีกวันที่น่าตื่นเต้นที่ [ROOT.Char.Custom('GetCourt')|l] ใช่ไหม?"
 harm.1072.a.tt:0 "#WEAK นั่นเป็นเรื่องของพวกเขา..."

 harm.1081.t.prefix:0 "สภาพอากาศแปรปรวน"
 harm.1081.t:0 "$harm.1081.t.prefix$: ความพิโรธของพายุ"
 harm.1081.desc:0 "ให้ตายสิ วิญญาณอันแปรปรวนของ [ROOT.Char.GetFaith.WaterGodName] [ROOT.Char.GetFaith.WaterGodSheHe] ได้สาปแช่งคณะผู้ติดตามของข้าและข้าให้ตายในพายุอันเลวร้ายนี้!\n\nสิ่งที่ควรจะเป็นธุระเล็กน้อยไปยังหมู่บ้านท้องถิ่นกลับกลายเป็นวันที่มืดมนและยากจน จากวันที่แจ่มใสสว่างไสว การเดินทางฝ่าลมพายุที่พัดกระหน่ำ ถูกกระแทกด้วยฝนที่หนักราวกับก้อนกรวด และถูกคุกคามด้วยฟ้าผ่าและฟ้าร้องคำราม\n\nหากเราไม่ไปถึงที่กำบังในไม่ช้า ความหนาวเย็นและความเปียกชื้นจะคร่าชีวิตเราไปอย่างแน่นอน เช่นเดียวกับคมดาบใดๆ"
 harm.1081.a:0 "หากเราขี่ม้าเร็วพอ เราจะไปถึงบ้านได้"
 harm.1081.a.tt.success:0 "$harm.0000.tt.death.success$"
 harm.1081.a.tt.failure:0 "$harm.0000.tt.death.failure$"
 harm.1081.b:0 "โพรงนั้น เราสามารถหลบภัยที่นั่นได้!"
 harm.1081.c:0 "ข้า — ข้าคิดว่าข้าอาจจะมีที่ซ่อนอยู่ใกล้ๆ?"
 harm.1081.c.tt.success:0 "$harm.0000.tt.death.success$"
 harm.1081.c.tt.failure:0 "$harm.0000.tt.death.failure$"

 harm.1082.t:0 "$harm.1081.t.prefix$: เสียงฟ้าร้องคำรามจากระยะไกล"
 harm.1082.desc:0 "ข้าเฝ้าดูพายุที่รุนแรงผิดปกติคำรามไปทั่วภูมิประเทศ เสียงฟ้าร้องคำรามจากระยะไกลจากกลุ่มเมฆที่อยู่ห่างออกไปเพียงไม่กี่ไมล์\n\nฝนที่ตกหนักสร้างปัญหา — ฝนบ่งบอกถึงปัญหาจากสวรรค์บางอย่างที่ข้าล้มเหลวในการกำหนด หรือเป็นเพียงการเคลื่อนไหวแบบสุ่มของลม?\n\nไม่ว่าจะด้วยวิธีใด ข้าไม่มีความปรารถนาที่จะติดอยู่ในนั้น"
 harm.1082.a:0 "ข้าหวังว่า [ROOT.Char.GetFaith.FateGodName] จะไม่ได้ส่งสัญญาณอะไรบางอย่าง"
 harm.1082.a.tt:0 "#WEAK ไม่ใช่เวลาที่ดีที่จะอยู่ข้างนอก..."

 harm.1091.t.prefix:0 "หัวใจเต้นรัว"
 harm.1091.t:0 "$harm.1091.t.prefix$: ความคิดอันแผดเผา"
 harm.1091.desc:0 "#EMP [ROOT.Char.GetFaith.HighGodName] ผู้ทรงเมตตา โปรดช่วยข้าให้พ้นจากภัยพิบัตินี้ด้วยเถิด#!!\n\nความเจ็บปวดอันรุนแรงนี้คืออะไรที่ทุบกะโหลกศีรษะข้าเป็นริ้วๆ เลือดๆ ชีพจรที่แผดเผานี้เต้นตุบๆ ในเส้นเลือดข้าตามจังหวะกลองของ [ROOT.Char.GetFaith.DevilNamePossessive]...\n\nข้า— ข้าสบายดี แล้วข้าก็... กลั้นอาเจียน โดยไม่มีการเตือน แล้วข้าก็... #EMP อ๊ากกก#! ทำให้มันหยุด ทำให้มันหยุด #BER ทำให้มันหยุด#!!\n\nป-โปรด #DIE1 ทำให้มัน#! #DIE2 หยุด#!."
 harm.1091.a:0 "#EMP จิตใจข้า?!#!"
 harm.1091.a.tt.success:0 "$harm.0000.tt.death.success$"
 harm.1091.a.tt.failure:0 "$harm.0000.tt.death.failure$"
 harm.1091.b:0 "ข้า. จะ. อดทน."
 harm.1091.c:0 "ความชัดเจน ความชัดเจน ข้าต้องการ #EMP ความชัดเจน#!."
 harm.1091.c.tt.success:0 "$harm.0000.tt.death.success$"
 harm.1091.c.tt.failure:0 "$harm.0000.tt.death.failure$"

 harm.1092.t:0 "$harm.1091.t.prefix$: จิตใจที่ปวดร้าว"
 harm.1092.desc.intro:0 "สองสัปดาห์ที่ผ่านมา ข้าได้รับความทุกข์ทรมานจาก... #EMP การเต้นตุบๆ#! ของไมเกรน\n\n"
 harm.1092.desc.blind:0 "ข้าคิดไม่ได้ ข้าจดจ่อไม่ได้ ข้าแทบไม่ได้ยิน — เสียงดูเหมือนจะหายไปโดยสิ้นเชิง เว้นแต่จะสูงมากหรือต่ำมาก\n\n[ROOT.Char.GetFaith.HealthGodName|U] ต้องคิดว่ามันเป็นการล้อเล่นที่โหดร้ายอย่างยิ่งที่จะสาปแช่งข้าด้วยอาการปวดหัวที่กรองทุกสิ่งออกไปยกเว้นเสียงกรีดร้องของทารกและเสียงร้องของม้า"
 harm.1092.desc.fallback:0 "เมื่อพวกมันโจมตี การมองเห็นของข้าดูเหมือนจะหดตัวลง การมองเห็นและแสงสว่างทั้งหมดหายไปจนเหลือเพียงมุมเล็กๆ ของโลกสำหรับข้า อยู่ที่ขอบของการโฟกัสเสมอและถูกเน้นย้ำด้วยบ่อน้ำแห่งความเจ็บปวด\n\n[ROOT.Char.GetFaith.HealthGodName|U] เห็นได้ชัดว่าพบว่าความทุกข์ทรมานของข้าน่าขบขัน เพราะการโจมตีนั้นเกิดขึ้นเป็นประจำอย่างน่าตกใจ"
 harm.1092.a:0 "อึก หัวข้า..."
 harm.1092.a.tt:0 "#WEAK บางทีท่านควรจะพักผ่อน..."

 harm.1101.t.prefix:0 "การตั้งถิ่นฐานที่พลุกพล่าน"
 harm.1101.t:0 "$harm.1101.t.prefix$: ระวัง!"
 harm.1101.desc:0 "ข้าควบม้าไปตามท้องถนนแห่ง [ROOT.Char.GetCurrentLocation.GetName] อีกครั้ง โดยมีคณะผู้ติดตามชูธงของข้าตามมาเบื้องหลังอย่างภาคภูมิใจ ธุระเล็กน้อยในเมืองทำให้ข้าต้องเสียเวลาไปทั้งวัน ทว่าข้าโหยหาความสะดวกสบายของบ้านใจจะขาด\n\nเมื่อเรามาถึงทางแยก ข้าถูกดึงดูดความสนใจด้วยเสียงหัวเราะคิกคักของกลุ่มคนหนุ่มสาวที่กำลังประทับใจ จนไม่ได้ยินเสียงรถม้าที่วิ่งด้วยความเร็วและสั่นคลอนพุ่งตรงมาทางข้า จนกระทั่งคนขับกรีดร้องด้วยความตกใจ"
 harm.1101.a:0 "พยายามกระโดดหลบ"
 harm.1101.a.tt.success:0 "เสียงชนดังสนั่นและเสียงร้องโหยหวนของม้าอยู่ข้างหลังท่าน"
 harm.1101.a.tt.failure:0 "โลกคือภาพเบลอของไม้ที่แตกหักและแขนขาที่หัก"
 harm.1101.b:0 "ขับม้าของท่านให้ชิดกำแพงมากยิ่งขึ้น"
 harm.1101.c:0 "โยนตัวไปข้างหน้าและหวัง"
 harm.1101.c.tt.success:0 "$harm.0000.tt.death.success$"
 harm.1101.c.tt.failure:0 "$harm.0000.tt.death.failure$"

 harm.1102.t:0 "$harm.1101.t.prefix$: ความปลอดภัยบนท้องถนน"
 harm.1102.desc:0 "ขี่ม้าพร้อมคณะผู้ติดตามไปตามถนนของ [ROOT.Char.GetCurrentLocation.GetName] ข้ารักษาท่าทีที่เคร่งขรึม เป็นสิ่งสำคัญที่จะต้องปรากฏตัวให้เห็นในบางครั้ง แต่ก็สำคัญไม่แพ้กันที่จะยังคงเป็นบุคคลที่มีอำนาจบางอย่าง\n\nเราหยุดนิ่งเมื่อรถเข็นคันหนึ่งวิ่งผ่านเราไปที่สี่แยกที่พลุกพล่าน เร็วเกินไปที่จะปลอดภัยเลย\n\nโชคดีสำหรับคนขับด้วย — ไม่ฉลาดที่จะตัดหน้า [ROOT.Char.GetTitleAsNameNoTooltip] แต่ม้าของพวกเขาพาพวกเขาไปเร็วเกินกว่าจะมองเห็น นับประสาอะไรกับการหยุด"
 harm.1102.a:0 "สามัญชนจำเป็นต้องเห็น [ROOT.Char.GetTitleAsNameNoTooltip] ของพวกเขา"
 harm.1102.a.tt:0 "#WEAK แม้ว่าจะเป็นเพียงขณะขี่ม้าผ่านที่อยู่อาศัยของพวกเขาก็ตาม..."

 harm.1111.t.prefix:0 "รัชสมัยแห่งความหวาดกลัว"
 harm.1111.t:0 "$harm.1111.t.prefix$: ความยุติธรรมของประชาชน"
 harm.1111.desc:0 "เดินทางผ่าน [ROOT.Char.Custom('GetCourt')] ของข้า ข้าถูกขนาบข้างด้วยทหารยามเพื่อความปลอดภัยของข้าเสมอ ยังมีอีกมากที่เฝ้าทางเข้า ไม่ต้องพูดถึง [ROOT.Char.Custom('GetChamber')] ของข้า เพียงพอที่จะหยุดผู้บุกรุกใดๆ แต่เห็นได้ชัดว่าไม่เพียงพอที่จะหยุดคนรับใช้ที่ถูกสาปแช่งจากการชนกับข้าและ —\n\nความเจ็บปวด การแทงที่แหลมคมตามตัวอักษร เลือดพุ่งออกมาจากท้องข้าแล้วขณะที่ข้าโซเซถอยหลัง มีดของคนรับใช้ยื่นออกมาจากตัวข้า\n\nองครักษ์ของข้าเข้าถึง [killer.GetHerHim] ในไม่กี่วินาที ฟันนักฆ่าลงกับพื้น ยิ้มเยาะอย่างพึงพอใจแม้ขณะที่ [killer.GetSheHe] ตาย — ไม่ต้องสงสัยเลยว่านี่เป็นเรื่องส่วนตัวโดยสิ้นเชิง\n\nทุกคนอยากตายอย่างวีรบุรุษ"
 harm.1111.a:0 "อ๊าก ข้าถูกทำลายแล้ว!"
 harm.1111.a.tt.success:0 "$harm.0000.tt.death.success$"
 harm.1111.a.tt.failure:0 "$harm.0000.tt.death.failure$"
 harm.1111.b:0 "ต้องมากกว่านั้นถึงจะฆ่า #EMP ข้า#! ได้"
 harm.1111.c:0 "#EMP อีก#! นักฆ่า? น่าสมเพช!"
 harm.1111.c.tt.dread:0 "ตัวเลือกนี้ปลดล็อกโดย [dread|E] สูงของท่าน"
 harm.1111.c.tt.success:0 "$harm.0000.tt.death.success$"
 harm.1111.c.tt.failure:0 "$harm.0000.tt.death.failure$"

 harm.1112.t:0 "$harm.1111.t.prefix$: การยอมจำนนด้วยความกลัว"
 harm.1112.desc:0 "ขณะที่ข้าเลี้ยวหัวมุม ทหารยามของข้าตามหลังข้าอย่างภักดี คนรับใช้คนหนึ่งแทบจะชนเข้ากับข้าขณะถือชาม\n\nในวินาทีสุดท้าย พวกเขาหมุนตัวออกไป แทบจะไม่ทำซุปร้อนลวกหกใส่หน้าข้า\n\n"ดูทางหน่อย!" หนึ่งในผู้คุ้มกันของข้าคำราม\n\nคนรับใช้พยักหน้าอย่างแรง กลัวเกินกว่าจะพูด ก่อนจะวิ่งหนีไปในทิศทางตรงกันข้าม วิธีการที่เหมาะสมที่จะทำหลังจากความผิดพลาดร้ายแรง เช่นนี้"
 harm.1112.a:0 "อาจจะแย่กว่านี้ ข้าเดา"
 harm.1112.a.tt:0 "#WEAK ท่านแค่หาคนช่วยไม่ได้ในสมัยนี้..."











 ##################################################
 # #Random Death Battle Events
 harm.2001.t:0 "ไข้ค่าย"
 harm.2001.desc:0 "ให้ตายสิ [ROOT.Char.GetCurrentLocation.GetName] ทั้งหมด! ช่างเป็นเรื่องตลกร้ายอันใด ที่ แม้ว่าการล้อมเมืองจะเป็นเรื่องของการ ทำให้ผู้ป้องกันอ่อนแอลง แต่ค่าย #EMP ล้อม#! กลับเป็นบ่อโสโครกและโรคภัยไข้เจ็บ?\n\nเมื่อข้าตื่นขึ้นเช้านี้ มันคืออาการปั่นป่วนในท้องและไฟเหลวไหลผ่านท้องข้า ข้าหยุดถ่ายออกจากทุกทวารไม่ได้ ข้ายืนไม่ได้อีกต่อไป\n\nข้าไม่เคยอยากตาย เช่นนี้"
 harm.2001.a:0 "ท้อง — ท้องไส้ข้า... อึก... "
 harm.2001.a.tt.success:0 "$harm.0000.tt.death.success$"
 harm.2001.a.tt.failure:0 "$harm.0000.tt.death.failure$"
 harm.2001.b:0 "ข้าจะไม่จบสิ้นที่นี่"
 harm.2001.c:0 "ข้ารู้ว่าข้าต้องการอะไร เอา... เอามาให้ข้า..."
 harm.2001.c.tt.success:0 "$harm.0000.tt.death.success$"
 harm.2001.c.tt.failure:0 "$harm.0000.tt.death.failure$"

 harm.2011.t:0 "ความเจ็บป่วยจากการเดินทัพ"
 harm.2011.desc:0 "ความเจ็บปวดทรมานข้ามาเกือบสัปดาห์แล้ว — เหงื่อออกตอนกลางคืนและไข้สูง ท้องไส้ปั่นป่วนและมือสั่น ข้าไม่รู้ว่าข้าติดอะไรมา แต่มันชัดเจนว่าเป็นอาการป่วยที่ไม่คาดคิดบางอย่างที่เกิดจากสภาพการเดินทัพและในค่ายพักแรมยามค่ำคืนของเรา\n\nแม้ แต่ตอนนี้ การมองเห็นของข้าก็เริ่มพร่ามัว แต่ข้าต้องเดินหน้าต่อไป\n\nต้อง. เดินต่อไป. เราต้อง... เดิน..."
 harm.2011.a:0 "ทำไม... อะไร..."
 harm.2011.a.tt.success:0 "$harm.0000.tt.death.success$"
 harm.2011.a.tt.failure:0 "$harm.0000.tt.death.failure$"
 harm.2011.b:0 "ทหารของข้าทนทุกข์ได้เท่าที่ข้าทนได้เท่านั้น"
 harm.2011.c:0 "ข้าเคยทนสิ่งที่เลวร้ายกว่านี้มาแล้ว ใช่ไหม?"
 harm.2011.c.tt.success:0 "$harm.0000.tt.death.success$"
 harm.2011.c.tt.failure:0 "$harm.0000.tt.death.failure$"

 harm.2021.t:0 "หนาว... เหลือเกิน..."
 harm.2021.desc:0 "มันไม่ถูกต้องที่จะออกรบในความหนาวเย็น เช่นนี้ ไม่ถูกต้อง ทุกเย็นที่ค่ายพัก เราขุดหลุมศพใหม่สำหรับความสูญเสียที่เราจะพบในตอนเช้า สำหรับผู้ที่ต้องถูกทิ้งไว้ข้างหลัง แต่ไม่ควรตกเป็นเหยื่อของฝูงกาใจดำ\n\nข้าเกือบจะอิจฉาพวกเขา สำหรับพวกเขา การต่อสู้สิ้นสุดลงแล้ว พวกเขาไม่ต้องเผชิญกับ #EMP ความหนาวเย็น#! ที่ไร้สตินี้\n\nความหนาวเย็นของฤดูหนาวกัดกินข้าถึงไขกระดูก ขัดขวางความคิดข้าอย่างต่อเนื่องด้วยความเจ็บปวดที่ ทำให้ชา ปฏิเสธการพักผ่อน ปฏิเสธการจดจ่อ\n\nบางที... บางทีมันอาจจะดีกว่าถ้า..."
 harm.2021.a:0 "..."
 harm.2021.a.tt.success:0 "$harm.0000.tt.death.success$"
 harm.2021.a.tt.failure:0 "$harm.0000.tt.death.failure$"
 harm.2021.b:0 "ข้า. มี. ชะตากรรม. ที่สูงส่งกว่า."
 harm.2021.c:0 "ข้า. จะไม่. จบสิ้น."
 harm.2021.c.tt.success:0 "$harm.0000.tt.death.success$"
 harm.2021.c.tt.failure:0 "$harm.0000.tt.death.failure$"

 harm.2031.t:0 "ร้อน... เหลือเกิน..."
 harm.2031.desc:0 "ดวงอาทิตย์เคยสว่างเท่านี้หรือไม่? ร้อนเท่านี้? กดขี่เท่านี้?\n\nข้าไม่รู้ด้วยซ้ำว่าเราอยู่ในดินแดนที่ [ROOT.Char.GetFaith.HealthGodName]-ทอดทิ้งนี้มานานแค่ไหนแล้ว ขาดการเข้าถึงน้ำดีได้ง่าย และถูกบังคับให้เดินทางต่อไป\n\nการทัพต้องการให้เราดำเนินต่อไป แต่ละวันดูดซับกำลังของเราไปทีละน้อย ทีละน้อย เหงื่อออกและหยดลงบนพื้นดินที่กระหายน้ำอยู่เสมอ ทีละน้อย ตัวตนของเราสูญหายไปตลอดกาลกับความร้อนที่ไร้สติ\n\nทุกๆ วัน"
 harm.2031.a:0 "ทรราชแห่งแสงสว่างและความกระหายทำลายเรา..."
 harm.2031.a.tt.success:0 "$harm.0000.tt.death.success$"
 harm.2031.a.tt.failure:0 "$harm.0000.tt.death.failure$"
 harm.2031.b:0 "ข้า. มี. ชะตากรรม. ที่สูงส่งกว่า."
 harm.2031.c:0 "ข้าไม่ใช่คนโง่ของ [ROOT.Char.GetFaith.DeathDeityNamePossessive]"
 harm.2031.c.tt.success:0 "$harm.0000.tt.death.success$"
 harm.2031.c.tt.failure:0 "$harm.0000.tt.death.failure$"

 harm.2041.t:0 "เพื่ออาณาจักร"
 harm.2041.desc:0 "แม้ แต่ข้าก็แทบจะจำไม่ได้แล้วว่าเราทำสงครามกันมากี่ปีแล้ว เส้นทางการทัพนั้นยากลำบากสำหรับเราทุกคน พรากไปทีละน้อยใน แต่ละวัน และให้การพักผ่อนเพียงเล็กน้อยใน แต่ละค่ายพักแรมยามเย็น\n\nเดินทางกลับไปยังเต็นท์ของข้าหลังจากการสนทนากับนายทหารพลาธิการ ข้าพบว่าสถานที่นั้นร้างผู้คนอย่างน่าประหลาด ไม่มีทหารยามที่เหนื่อยล้า ไม่มีทหารรับจ้างที่ขมขื่น ไม่มีทหารเกณฑ์ที่คิดถึงบ้าน ร้างผู้คน นั่นคือ จนกระทั่งทหารติดอาวุธและสวมเกราะครึ่งโหลเลื่อนออกมาจากเงามืดทุกด้านของข้า\n\n"[ROOT.Char.GetTitledFirstNameNoTooltip]" หัวหน้ากบฏถ่มน้ำลาย "สงครามอันโง่เขลาของเจ้า ทำให้เราทุกคนต้องสูญเสียมากเกินไป ครั้งนี้ #EMP เจ้า#! จะต้องชดใช้""
 harm.2041.a:0 "คนทรยศ! คนทรยศ!"
 harm.2041.a.tt.success:0 "$harm.0000.tt.death.success$"
 harm.2041.a.tt.failure:0 "$harm.0000.tt.death.failure$"
 harm.2041.b:0 "แค่หกคน? มาเลย พวกขี้ขลาด!"
 harm.2041.c:0 "#BER ข้าจะทำให้พวกเจ้าเลือดตกยางออกเพราะเรื่องนี้!#!"
 harm.2041.c.tt.success:0 "$harm.0000.tt.death.success$"
 harm.2041.c.tt.failure:0 "$harm.0000.tt.death.failure$"

 harm.2051.t:0 "ความอดอยาก"
 harm.2051.desc:0 "มีเพียงไม่กี่สิ่งที่ทำลายกองทัพได้อย่างทั่วถึงเท่าความหิวโหย — ไม่มีโล่ใดป้องกันได้ ไม่มีดาบใดปัดป้องได้ ไม่มีเกราะใดบรรเทาความเจ็บปวดของมันได้\n\nปราศจากอาหาร ปราศจากน้ำ ปราศจากสิ่งใดที่จะ ทำให้เราดำเนินต่อไปได้ ยกเว้นสัตว์บรรทุกที่กระตุ้นความก้าวหน้าของเรา กองทหารของข้ากำลังค่อยๆ หยุดชะงักลง\n\nแม้... แม้ แต่ข้า... ก็กำลังเหี่ยวเฉาโดยปราศจากปัจจัยยังชีพ..."
 harm.2051.a:0 "ผิวหนังข้า... เหมือนกระดาษ..."
 harm.2051.a.tt.success:0 "$harm.0000.tt.death.success$"
 harm.2051.a.tt.failure:0 "$harm.0000.tt.death.failure$"
 harm.2051.b:0 "สถานการณ์ยังคงกอบกู้ได้"
 harm.2051.c:0 "เรามีเสบียงสำรอง เรา #EMP ต้อง#! มีเสบียงสำรอง!"
 harm.2051.c.tt.success:0 "$harm.0000.tt.death.success$"
 harm.2051.c.tt.failure:0 "$harm.0000.tt.death.failure$"

 harm.2061.t:0 "ถูกก่อกวนทุกย่างก้าว"
 harm.2061.desc:0 "ขณะที่กองทัพของข้าหนีออกจากสมรภูมิ [ROOT.Char.GetCurrentLocation.GetName] กลุ่มทหารกำลังปะทะกัน วิ่งหนี หรือไล่ตามเป็นระยะทางหลายลีกในทุกทิศทาง คณะผู้ติดตามของข้ากระจัดกระจาย ทหารยามของข้าตายหรือหนีไป และข้าก็กระจัดกระจายไปกับพวกเขา\n\nหากเราสามารถรวมกลุ่มกันได้ หากเราสามารถ—\n\nข้าเลี่ยงก้อนหินใหญ่ เพียงเพื่อจะปรากฏตัวเต็มๆ ต่อหน้ากลุ่มทหารที่สวมเครื่องแบบของศัตรู\n\nแยกเขี้ยว พวกเขาพุ่งเข้าใส่พร้อมเสียงกรีดร้อง"
 harm.2061.a:0 "ออกไปจากข้า พวกเจ้าสารเลว!"
 harm.2061.a.tt.success:0 "$harm.0000.tt.death.success$"
 harm.2061.a.tt.failure:0 "$harm.0000.tt.death.failure$"
 harm.2061.b:0 "หนี!"
 harm.2061.c:0 "เป่าแตร ท่าน [ROOT.Char.GetTitleAsNameNoTooltip] ต้องการความช่วยเหลือ!"
 harm.2061.c.tt.success:0 "$harm.0000.tt.death.success$"
 harm.2061.c.tt.failure:0 "$harm.0000.tt.death.failure$"

 harm.2071.t:0 "ชัยชนะอันหายนะ"
 harm.2071.desc:0 "กองทัพที่ได้รับชัยชนะของข้ากวาดล้างสมรภูมิที่ [ROOT.Char.GetCurrentLocation.GetName] ทุกหนทุกแห่ง ได้ยินเสียงโห่ร้องและตะโกนอย่างมีชัยของกองทหารของข้าขณะที่เราไล่ล่าศัตรู\n\nแม้ แต่คณะผู้ติดตามของข้าและข้าก็ยังดื่มด่ำกับการสังหารหมู่ที่ได้ผล ดื่มด่ำกับชัยชนะของเรา มัน ทำให้เรากระจัดกระจายเล็กน้อย ใช่ แต่ศัตรูพ่ายแพ้แล้วและไม่สามารถ—\n\nทหารยามของข้าอยู่ที่ไหน? ทหารรอบตัวข้า... พวกเขาถือธงของ [actor.GetPrimaryTitle.GetNameNoTier]! ความเกลียดชังในดวงตาและเลือดบนฟันของพวกเขา ศัตรูที่พ่ายแพ้พุ่งเข้าหาข้า พร้อมสำหรับจุดจบของข้า"
 harm.2071.a:0 "เจ้าจะยังไม่เอาข้าไป [ROOT.Char.GetFaith.DeathDeityName]!"
 harm.2071.a.tt.success:0 "$harm.0000.tt.death.success$"
 harm.2071.a.tt.failure:0 "$harm.0000.tt.death.failure$"
 harm.2071.b:0 "หนี!"
 harm.2071.c:0 "รวมพล! รวมพลที่ท่าน [ROOT.Char.GetTitleAsNameNoTooltip]!"
 harm.2071.c.tt.success:0 "$harm.0000.tt.death.success$"
 harm.2071.c.tt.failure:0 "$harm.0000.tt.death.failure$"
