l_english: 
 clan.1001.t:0 "บุตรแห่งสัญญา"
 clan.1001.desc:0 "[vassal.Custom2('MyCharacterIntroduction', ROOT.Char)|U] และ [vassal_child.Custom('GetDaughterSon')] ของ [vassal.GetHerHis] [vassal_child.GetTitledFirstName] เข้ามาหาข้า\n\n"การที่เราขาดพันธมิตรระหว่างกันนั้นช่างน่าละอายยิ่ง [ROOT.Char.Custom('FormOfAddressForLiege')] ให้ [child.GetTitledFirstName] แต่งงานกับ [vassal_child.Custom('GetDaughterSon')] ของข้า และสะสางเรื่องนี้ให้ถูกต้องเถิด!""
 clan.1001.a:0 "ท่านพูดถูก – พวกเขาจะ แต่งงานกัน!"
 clan.1001.b:0 "เรื่องนั้นจะไม่มีวันเกิดขึ้น"

 clan.1002.desc:0 ""[ROOT.Char.GetTitledFirstNameNoTooltip] นี่มันหมายความว่ากระไร?!"\n\n[vassal.Custom2('MyCharacterIntroduction', ROOT.Char)|U] บุกเข้ามาในห้อง, โดยมี [vassal_child.Custom('GetDaughterSon')] ของ [vassal.GetHerHis] [vassal_child.GetTitledFirstName] ตามมาด้วย\n\n"เหตุใดท่านจึงทำลายการหมั้นหมายระหว่าง [child.Custom('GetDaughterSon')] ของท่านกับ [vassal_child.GetTitledFirstNameNoTooltip]?""
 clan.1002.a:0 "มันเป็นความผิดพลาด ข้าสัญญา!"
 clan.1002.b:0 "มิใช่กงการใดของท่าน"

 clan.1011.t:0 "ไร้ ซึ่งพันธมิตร"
 clan.1011.desc_opening:0 ""ข้าอดสังเกตมิได้ถึงการเล่นพรรคเล่นพวกที่ท่านปฏิบัติต่อ [allied_vassal.Custom2('YourCharacterIntroduction', ROOT.Char)], เจ้าเหนือหัวของข้า"\n\n[vassal.Custom2('MyCharacterIntroduction', ROOT.Char)|U] ได้เข้ามาพบข้า, เพื่อจัดการกับสิ่งที่ [vassal.GetSheHe] มองว่าเป็นการดูแคลน; การที่ข้าไม่มีพันธมิตรกับ [vassal.GetHerHim]\n\n"การผ่อนปรนจากท่านจะช่วยบรรเทาโทสะของข้าได้ กล่าวคือ...""
 clan.1011.desc_army:0 "ความเชี่ยวชาญของ [councillor.GetCouncilTitle] [councillor.GetTitledFirstName] ของท่านสักสองสามปี!""
 clan.1011.desc_prestige:0 "คำพูดดี ๆ ให้เข้าหูคนที่เหมาะสม""
 clan.1011.desc_diplomacy:0 "บทเรียนในศิลปะแห่งการทูต""
 clan.1011.desc_prowess:0 "คำแนะนำในการต่อสู้!""
 clan.1011.desc_fallback:0 "ทองคำ""
 clan.1011.army:0 "[councillor.GetCouncilTitle] [councillor.GetFirstNameNoTooltip] ของข้าจะสอนท่าน"
 clan.1011.tt:0 "#F จะรับหรือไม่รับก็แล้วแต่#!"
 clan.1011.prestige:0 "ข้าจะกล่าวถึงท่านในทางที่ดี"
 clan.1011.diplomacy:0 "ท่านควรฝึกฝนคารมคมคายของท่านให้ดีขึ้น!"
 clan.1011.prowess:0 "เช่นนั้นก็มาสู้กัน แล้วข้าจะสอนท่าน"
 clan.1011.fallback:0 "รับสิ่งนี้ไปและปล่อยข้าไว้ตามลำพัง"
 clan.1011.b:0 "ท่านจะไม่ได้สิ่งใด เช่นนั้น"

 clan.1101.t:0 "ดุลแห่งอำนาจ"
 clan.1101.desc:0 "[vassal.Custom2('MyCharacterIntroduction', ROOT.Char)|U] ได้มาร้องเรียนต่อข้า "สมาชิกในครอบครัวของท่านมีอำนาจมากเกินไปใน [ROOT.Char.GetPrimaryTitle.GetNameNoTooltip] ไม่ว่าข้าหลวง เช่นข้าจะทำงานหนักเพียงใด เราก็ไม่มีวันเทียบเท่าพวกเขาได้เลย!\n\nข้าขอวิงวอนให้ท่านแก้ไขความอยุติธรรมนี้ ท้ายที่สุดแล้ว แม้เพียงการแสดงออกถึงการเล่นพรรคเล่นพวกก็สามารถก่อให้เกิดความไม่พอใจในหมู่ข้าหลวงของท่านได้...""
 clan.1101.a:0 "ข้ารับฟังข้อกังวลของท่าน และจะนำไปพิจารณา"
 clan.1101.a.flavor: "ท่านพูดเลี่ยงที่จะดำเนินการใด ๆ อย่างมีความหมาย แต่ยังคง ทำให้ [vassal.GetFirstNameNoTooltip] สบายใจได้"
 clan.1101.b:0 "ท่านพูดถูก ข้าจะดำเนินการแก้ไขปัญหานี้ทันที!"
 clan.1101.b.custom:0 "สมาชิก [dynasty|E] ทุกคนที่ดำรงตำแหน่ง [vassal|E]"
 clan.1101.b.tt:0 "ได้รับ [revoke_title_reason|E]"
 clan.1101.c:0 "โอ้ ข้าจะให้บางสิ่งแก่ท่านเพื่อก่อให้เกิดความไม่พอใจ..."
 clan.1101.d:0 "มิใช่ความผิดของข้าที่ท่านไม่ได้เกิดมาในครอบครัวของข้า!"
 clan.1101.d.custom:0 "[vassal|E] ทุกคนที่ไม่ใช่สมาชิก [dynasty|E]"

 clan.1201.t:0 "ไร้ผู้แทน"
 clan.1201.desc:0 "[petitioner.GetWomanMan] ชาว [culture.GetNameNoTooltip] จาก [target_title.GetNameNoTier] ได้มายื่นคำร้องต่อข้าเพื่อขอมีตัวแทนเพิ่มขึ้นในรัฐบาลของข้า\n\n"[ROOT.Char.Custom('FormOfAddressForLiege')|U] พวกเราคือข้าแผ่นดินผู้ภักดีของพระองค์ ทว่าพวกเรากลับไม่มีสิทธิ์มีเสียงในการปกครองชุมชนของตนเองเลย จะเป็นไรไปหากจะขอให้คนของเราสักคนมีตำแหน่งในคณะบริหารของพระองค์?""
 clan.1201.a:0 "ดีมาก ท่านจะปกครอง [target_title.GetNameNoTierNoTooltip] นับจากนี้ไป!"
 clan.1201.b:0 "ข้าอาจผ่อนปรนการควบคุม เพื่อแลกกับการรับใช้ของท่าน..."
 clan.1201.c:0 "ไม่มีทางเกิดขึ้น"
