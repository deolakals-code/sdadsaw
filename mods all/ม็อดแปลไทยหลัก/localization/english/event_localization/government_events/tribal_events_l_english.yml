l_english: 
 tribal.1001.t:0 "ผู้ท้าชิง"
 tribal.1001.desc_old:0 ""ท่านแก่ชราและอ่อนแอลงแล้ว, [ROOT.Char.GetTitledFirstNameNoTooltip];""
 tribal.1001.desc_weak:0 ""ท่าน #EMP อ่อนแอ#!, [ROOT.Char.GetTitledFirstNameNoTooltip];""
 tribal.1001.desc_meak:0 ""ท่านไร้กระดูกสันหลังดุจปลาไหล, [ROOT.Char.GetTitledFirstNameNoTooltip];""
 tribal.1001.desc_fallback:0 ""ท่านไม่เหมาะที่จะปกครอง, [ROOT.Char.GetTitledFirstNameNoTooltip];""
 tribal.1001.desc:0 "ถึงเวลาแล้วที่ท่านจะลงจากตำแหน่ง!"\n\n[challenger.Custom2('MyCharacterIntroduction', ROOT.Char)|U] เข้ามาหาข้าต่อหน้าเผ่าทั้งหมด ประกาศคำท้าทายของ [challenger.GetHerHis] ให้ทุกคนได้ยิน\n\n"ข้าจะปกครอง [ROOT.Char.GetPrimaryTitle.GetName] นับ แต่วันนี้เป็นต้นไป""
 tribal.1001.a_child:0 "จงใช้เหล็กกล้าหนุนคำพูดของเจ้า, [challenger.Custom('GirlBoy')]!"
 tribal.1001.a:0 "จงใช้เหล็กกล้าหนุนคำพูดของเจ้า!"
 tribal.1001.a_champion:0 "[liege_champion.GetTitledFirstName] จะสู้แทนข้า\n"
 tribal.1001.a_success:0 "ข้าชนะการต่อสู้"
 tribal.1001.a_failure:0 "ข้าแพ้การต่อสู้"
 tribal.1001.a_champion_success:0 "[liege_champion.GetFirstNameNoTooltip] ชนะการต่อสู้"
 tribal.1001.a_champion_failure:0 "[liege_champion.GetFirstNameNoTooltip] แพ้การต่อสู้"
 tribal.1001.b:0 "ก็ต่อเมื่อเจ้าเอาชนะข้าในการประชันคำด่าได้!"
 tribal.1001.b_success:0 "ข้ามีคำด่าที่ดีกว่า"
 tribal.1001.b_failure:0 "[challenger.GetSheHe|U] เอาชนะข้าได้"
 tribal.1001.c:0 "ข้าจะไม่สู้กับเจ้าในเรื่องนี้..."

 tribal.1002.desc:0 "ข้ากลัวว่าวันนี้จะมาถึง ข้าไม่อาจสู้กับเจ้าในเรื่องนี้ได้, [liege_to_challenge.Custom2('RelationToMeShort', SCOPE.sC('challenger'))] ของข้า"\n\n[liege_to_challenge.GetFirstName] สละการปกครองของ [liege_to_challenge.GetHerHis] ให้แก่ข้าโดยไม่มีการต่อต้าน และหลังจากความสับสนชั่วครู่ เผ่าก็เฉลิมฉลองชัยชนะของข้า"
 tribal.1002.a:0 "ข้า... เอ่อ... ขอบใจ"

 tribal.1003.desc_opening:0 ""เช่นนั้นเจ้ารึจะท้าทายสิทธิ์ในการปกครองของข้า?!""
 tribal.1003.desc_old:0 "เจ้าควรจะใช้เหล็กกล้าหนุนคำพูดของเจ้าให้ได้, [challenger.Custom('GirlBoy')]!""
 tribal.1003.desc_young:0 "เจ้าควรจะใช้เหล็กกล้าหนุนคำพูดของเจ้าให้ได้!""
 tribal.1003.desc:0 "\n\n[liege_to_challenge.Custom2('MyCharacterIntroduction', ROOT.Char)|U] [liege_to_challenge.Custom('SignatureWeaponActionThirdPerson')] [liege_to_challenge.GetHerHis] [liege_to_challenge.Custom('signature_weapon')] และก้าวเข้ามาหาข้า เผ่าทั้งหมดรวมตัวกันรอบตัวเรา ความตื่นเต้นและความกลัวอบอวลอยู่ในอากาศ ขณะที่ข้ากางขาออกและ..."
 tribal.1003.desc_liege_champion:0 "\n\nตัวแทนที่ [liege_to_challenge.GetTitledFirstNamePossessive] [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('liege_to_challenge'))] ของข้าเลือก, [liege_champion.GetTitledFirstName], [liege_champion.Custom('SignatureWeaponActionThirdPerson')] [liege_champion.GetHerHis] [liege_champion.Custom('signature_weapon')] และก้าวเข้ามาหาข้า เผ่าทั้งหมดรวมตัวกันรอบตัวเรา ความตื่นเต้นและความกลัวอบอวลอยู่ในอากาศ ขณะที่ข้ากางขาออกและ..."
 tribal.1003.a:0 "...ชู [ROOT.Char.Custom('signature_weapon')] ของข้าขึ้น"
 tribal.1003.b:0 "...ยกมือขึ้นและหัวเราะอย่างเก้อเขิน"

 tribal.1004.desc_opening:0 "[challenger.GetFirstName] [liege_to_challenge.Custom2('RelationToMeShort', SCOPE.sC('challenger'))] ของข้า [challenger.Custom('SignatureWeaponActionThirdPerson')] [challenger.GetHerHis] [challenger.Custom('signature_weapon')] และก้าวเข้ามาหาข้า เผ่าทั้งหมดรวมตัวกันรอบตัวเรา ความตื่นเต้นและความกลัวอบอวลอยู่ในอากาศ\n\n"
 tribal.1004.desc:0 "ข้าชู [ROOT.Char.Custom('signature_weapon')] ของข้าขึ้นและโจมตี #EMP หลบ, กดดัน, ล่อหลอก— อั่ก!#! ด้วย [challenger.Custom('SignatureWeaponActionReaction')] [challenger.GetFirstNameNoTooltip] [challenger.Custom('SignatureWeaponCriticalPresent')] ขาของข้า และขณะที่ข้าโซเซ ข้าก็ตระหนักว่ามันจบแล้ว เผ่าไม่ได้โห่ร้องให้ข้าอีกต่อไป"
 tribal.1004.a:0 "สาปแช่งเจ้า!"

 tribal.1005.desc:0 "ข้าชู [ROOT.Char.Custom('signature_weapon')] ของข้าขึ้นและโจมตี\n\n#EMP หลบ, กดดัน, ล่อหลอก...#! ด้วย [ROOT.Char.Custom('SignatureWeaponActionReaction')] ข้า [ROOT.Char.Custom('SignatureWeaponCritical')] ขาของ [challenger.GetHerHis] และขณะที่ [challenger.GetSheHe] โซเซ ข้ารู้ว่ามันจบแล้ว"
 tribal.1005.a:0 "หวังว่าเจ้าคงได้เรียนรู้บทเรียนแล้ว!"

 tribal.1014.desc_opening:0 "[challenger.GetFirstName] [liege_to_challenge.Custom2('RelationToMeShort', SCOPE.sC('challenger'))] ของข้า [challenger.Custom('SignatureWeaponActionThirdPerson')] [challenger.GetHerHis] [challenger.Custom('signature_weapon')] และก้าวเข้าหา [liege_champion.GetTitledFirstName] เผ่าทั้งหมดรวมตัวกันรอบตัวเรา ความตื่นเต้นและความกลัวอบอวลอยู่ในอากาศ\n\n"
 tribal.1014.desc:0 "[liege_champion.GetTitledFirstName] ชู [liege_champion.GetHerHis] [liege_champion.Custom('signature_weapon')] ขึ้นและโจมตี #EMP หลบ, กดดัน, ล่อหลอก— อั่ก!#! ด้วย [challenger.Custom('SignatureWeaponActionReaction')] [challenger.GetFirstNameNoTooltip] [challenger.Custom('SignatureWeaponCriticalPresent')] ขาของ [liege_champion.GetFirstNamePossessive] และขณะที่ [liege_champion.GetSheHe] โซเซ ข้าก็ตระหนักว่ามันจบแล้ว เผ่าไม่ได้โห่ร้องให้ข้าอีกต่อไป"
 tribal.1014.a:0 "สาปแช่งเจ้า!"

 tribal.1015.desc:0 "[liege_champion.GetTitledFirstName] ชู [liege_champion.GetHerHis] [liege_champion.Custom('signature_weapon')] ขึ้นและโจมตี\n\n#EMP หลบ, กดดัน, ล่อหลอก...#! ด้วย [liege_champion.Custom('SignatureWeaponActionReaction')] [liege_champion.GetSheHe] [liege_champion.Custom('SignatureWeaponCriticalPresent')] ขาของ [challenger.GetTitledFirstNamePossessive] และขณะที่ [challenger.GetSheHe] โซเซ ข้ารู้ว่ามันจบแล้ว"
 tribal.1015.a:0 "หวังว่าเจ้าคงได้เรียนรู้บทเรียนแล้ว!"

 tribal.1006.desc_old:0 "เจ้าควรจะใช้ทักษะอ้างสิทธิ์ของเจ้าให้ได้, [challenger.Custom('GirlBoy')]!""
 tribal.1006.desc_young:0 "เจ้าควรจะใช้ทักษะอ้างสิทธิ์ของเจ้าให้ได้!""
 tribal.1006.desc:1 "ทันทีที่ [liege_to_challenge.Custom2('MyCharacterIntroduction', ROOT.Char)|U] ประกาศการประชันฝีปาก ทั้งเผ่าก็เข้ามาใกล้เพื่อเป็นสักขีพยานในการแข่งขัน\n\nความเงียบเข้าปกคลุมเมื่อ [liege_to_challenge.GetFirstNameNoTooltip] ก้าวไปข้างหน้าและกระแอมในลำคอของ [liege_to_challenge.GetHerHis]\n"
 tribal.1006.a:0 "เจ้านั่นเรียกว่าคำด่ารึ? ข้าจะแสดงให้เจ้าดู!"
 tribal.1006.a_success:0 "ท่านชนะการประชันคำด่า"
 tribal.1006.a_failure:0 "ท่านแพ้การประชันคำด่า"
 tribal.1006.b:0 "นี่... นี่มันเป็นความผิดพลาด"

 tribal.1007.desc_ending:1 "\n\nเสียงโห่ร้องที่ตามมาดังสนั่นหวั่นไหว และข้ารู้ว่าข้าแพ้แล้ว"
 tribal.1007.a:0 "ให้ตายสิเจ้า!"

 tribal.1008.desc:1 "เผ่ารวมตัวกันเพื่อเป็นสักขีพยานในการประชันฝีปากระหว่างข้ากับ [liege_to_challenge.Custom2('RelationToMeShort', SCOPE.sC('challenger'))] ของข้า [challenger.GetFirstName] เสียงพึมพำอย่างตื่นเต้นดังขึ้นเมื่อ [challenger.GetFirstNameNoTooltip] ก้าวไปข้างหน้าและกระแอมในลำคอของ [challenger.GetHerHis]\n"
 tribal.1008.desc_ending:1 "\n\nสิ่งที่ตามมาคือความเงียบที่น่าตกใจและน่าอึดอัด"
 tribal.1008.a:0 "เจ้านั่นเรียกว่าคำด่ารึ? ออกไปให้พ้น"

 tribal.1010.desc:0 "เผ่าทั้งหมดรวมตัวกันเพื่อเป็นสักขีพยานในการประลองระหว่างข้ากับ [challenger.GetFirstName] [liege_to_challenge.Custom2('RelationToMeShort', SCOPE.sC('challenger'))] ของข้า แต่ทันทีที่ [challenger.GetSheHe] ปรากฏตัว [challenger.GetSheHe] ก็เริ่มแก้ตัว\n\n"มัน... มันเป็นความผิดพลาดทั้งหมด ข้าไม่กล้าท้าทายท่าน โปรดยกโทษให้ข้าด้วย""
 tribal.1010.a:0 "เจ้าคนขี้ขลาด"

 tribal.1022.trigger_failure.challenger:0 "[single_combat_duel|E] ของข้ากับ [liege_to_challenge.GetFirstNameNoTooltip] เป็นโมฆะแล้ว"
 tribal.1022.trigger_failure.liege_to_challenge:0 "[single_combat_duel|E] ของข้ากับ [challenger.GetFirstNameNoTooltip] เป็นโมฆะแล้ว"

 tribal.1101.t:0 "โฮล์มกัง"
 tribal.1101.desc:0 "คู่ปรับของข้า [rival.GetTitledFirstName] เงยหน้าขึ้นเมื่อข้าเข้าไปในโถงทางเดิน [victim.GetTitledFirstName] – #EMP [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('victim'))]#! ของข้าเอง – นอนจมกองเลือดอยู่ที่เท้าของ [rival.GetHerHis]\n\n"อ่า, [ROOT.Char.GetFirstNameNoTooltip] ข้ากำลังจะฝากข้อความถึงท่านพอดี!"\n\n[victim.GetFirstNameNoTooltip] ยังมีชีวิตอยู่ หากเสียงครวญครางด้วยความเจ็บปวดของ [victim.GetHerHis] เป็นสิ่งบ่งชี้ แต่ใครจะรู้ว่า [rival.GetFirstNameNoTooltip] จะทำไปถึงไหนหากข้าไม่เข้ามาขัดจังหวะ?"
 tribal.1101.a:0 "เจ้า [rival.Custom2('InsultNoun', ROOT.Char)] อันชั่วช้า! ข้าขอท้าเจ้าประลองโฮล์มแกง!"
 tribal.1101.a_success:0 "ท่านชนะ"
 tribal.1101.a_failure:0 "[rival.GetSheHe|U] ชนะ"
 tribal.1101.b:0 "เจ้าจะต้องเผชิญหน้ากับ [friend.GetFirstNameNoTooltip] ในโฮล์มกัง!"
 tribal.1101.b_success:0 "[friend.GetFirstNameNoTooltip] ชนะ"
 tribal.1101.b_failure:0 "[rival.GetFirstNameNoTooltip] ชนะ"
 tribal.1101.c:0 "ปล่อยให้... เรื่องที่แล้วก็แล้วไปเถอะนะ?"

 tribal.1102.desc_opening:0 "ผู้คนจำนวนมากรวมตัวกันเพื่อดูโฮล์มกังระหว่าง [rival.GetTitledFirstName] กับตัวข้า พวกเขาห้อมล้อมเราด้วยฝูงชนขนาดใหญ่ที่ส่งเสียงดังและชูกำปั้น\n\nข้าจับ [ROOT.Char.Custom('signature_weapon')] ของข้าและบุกเข้าใส่ — ในไม่ช้าเราก็พัวพันอยู่กับการปะทะของเหล็กกล้าและเลือด\n\n"
 tribal.1102.desc:0 "แต่ตรงนั้น! ช่องว่างในการป้องกันของ [rival.GetTitledFirstNamePossessiveNoTooltip] ข้า [ROOT.Char.Custom('SignatureWeaponAction')] [ROOT.Char.Custom('signature_weapon')] ของข้า กัดฟัน และด้วย [ROOT.Char.Custom('SignatureWeaponActionReaction')] ข้า [ROOT.Char.Custom('SignatureWeaponCritical')] ซี่โครงของ [rival.GetHerHis] [rival.GetSheHe|U] ตายก่อนที่ [rival.GetSheHe] จะล้มลงถึงพื้น"
 tribal.1102.a:0 "นี่คือสิ่งที่รอคอยทุกคนที่ท้าทายข้า!"

 tribal.1103.desc_opening:0 "ฝูงชนรวมตัวกันเพื่อดูโฮล์มกังระหว่าง [rival.GetTitledFirstName] และ [friend.GetTitledFirstName] ท่ามกลางเสียงโห่ร้องและกำปั้นที่ชูขึ้น ข้าตะโกนดังที่สุดในบรรดาพวกเขาทั้งหมด\n\n[friend.GetTitledFirstNameNoTooltip] จับ [friend.GetHerHis] [friend.Custom('signature_weapon')] และบุกเข้าใส่ – ในไม่ช้าพวกเขาก็พัวพันอยู่กับการปะทะของเหล็กกล้าและเลือด\n\n"
 tribal.1103.desc:0 "ทันใดนั้น [friend.GetFirstNameNoTooltip] [friend.Custom('SignatureWeaponActionThirdPerson')] [friend.GetHerHis] [friend.Custom('signature_weapon')] และด้วย [friend.Custom('SignatureWeaponActionReaction')], [friend.Custom('SignatureWeaponCriticalPresent')] ซี่โครงของ [rival.GetTitledFirstNamePossessiveNoTooltip] [rival.GetSheHe|U] ตายก่อนที่ [rival.GetSheHe] จะล้มลงถึงพื้น"

 tribal.1104.desc:0 "ทันใดนั้น [rival.GetTitledFirstNameNoTooltip] [rival.Custom('SignatureWeaponActionThirdPerson')] [rival.GetHerHis] [rival.Custom('signature_weapon')] และก่อนที่ข้าจะป้องกันได้ [rival.GetSheHe] [rival.Custom('SignatureWeaponCriticalPresent')] ไหล่ของข้า ความเจ็บปวด... ข้าคงหมดสติไป เพราะทันใดนั้น [rival.GetSheHe] ก็ยืนอยู่เหนือข้า\n\n"ยอมแพ้""
 tribal.1104.a:0 "ข้า... ข้ายอมแพ้"

 tribal.1105.desc:0 "ทันใดนั้น [rival.GetTitledFirstNameNoTooltip] [rival.Custom('SignatureWeaponActionThirdPerson')] [rival.GetHerHis] [rival.Custom('signature_weapon')] และก่อนที่ [friend.GetFirstNameNoTooltip] จะป้องกันได้ [rival.GetSheHe] [rival.Custom('SignatureWeaponCriticalPresent')] ไหล่ของ [friend.GetFirstNamePossessiveNoTooltip] สหายของข้าล้มลงกับพื้น กรีดร้องด้วยความเจ็บปวด และ [rival.GetFirstNameNoTooltip] จ้องมองข้าเขม็ง\n\n"ยอมแพ้""
 tribal.1105.a:0 "เรา... เรายอมแพ้"

 tribal.1201.t:0 "การแข่งขัน"
 tribal.1201.desc_opening:0 "การเตรียมการสำหรับการแข่งขันครั้งใหญ่ดำเนินมาหลายสัปดาห์แล้ว และในที่สุดก็ถึงเวลาแข่งขัน!\n\n"
 tribal.1201.desc_warhorse:0 "ข้ามาถึงบน [ROOT.Char.Custom('HorseStoryMareStallion')] คู่ใจของข้า [ROOT.Char.Custom('WarhorseStoryName')],"
 tribal.1201.desc:0 "ข้ามาถึงบนม้าที่เร็วที่สุดตัวหนึ่งของข้า,"
 tribal.1201.desc_ending:0 "และพบว่าทั้ง [racer.Custom2('MyCharacterIntroduction', ROOT.Char)] และ [villain_racer.Custom2('MyCharacterIntroduction', ROOT.Char)] จะเข้าร่วมการแข่งขันด้วย"
 tribal.1201.a:0 "แน่นอน ข้าจะเข้าร่วมด้วย!"
 tribal.1201.a.tt:0 "การแข่งขันนำมา ซึ่งเกียรติภูมิ แต่ก็มีความเสี่ยง เช่นกัน!"
 tribal.1201.b:0 "ข้าจะแค่ชมการแข่งขัน"

 tribal.1202.desc:0 "เต้นรำ, ร้องเพลง, โห่ร้อง... ฝูงชนตื่นเต้นดีใจก่อนที่การแข่งขันจะเริ่มเสียอีก!\n\nข้าเคลื่อนตัวผ่านฝูงชน เหลือเวลาอีกเพียงไม่กี่นาทีก่อนที่นักขี่อย่างเราจะต้องขึ้นม้า เมื่อข้าเห็น [villain_racer.GetTitledFirstName] [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('villain_racer'))] ของข้าอยู่ข้างม้าพร้อมกับของมีคมบางอย่างในมือของ [villain_racer.GetHerHis]..."
 tribal.1202.a:0 ""เฮ้! เจ้ากำลังทำอะไร?!""
 tribal.1202.b:0 "ไม่ใช่ธุระของข้า"
 tribal.1202.b.tt:0 "อะไรจะเกิดก็ต้องเกิด..."
 tribal.1202.c:0 "เช่นนั้น [villain_racer.GetFirstNameNoTooltip] ก็ทิ้งม้าของ [villain_racer.GetHerHis] ไว้โดยไม่มีใครดูแล..."
 tribal.1202.c.success:0 "ข้า ทำให้บังเหียนของ [villain_racer.GetHerHis] เกือบจะขาด"
 tribal.1202.c.tt:0 "คงจะน่าเสียดายหากมีบางอย่าง #EMP ขาด#! ระหว่างการแข่งขัน..."
 tribal.1202.c.failure:0 "[villain_racer.GetSheHe|U] สังเกตเห็นว่ามีคนมายุ่งกับบังเหียนของ [villain_racer.GetHerHis]"

 tribal.1203.desc_opening:0 "ข้าควบม้าข้ามทุ่งหญ้าสเตปป์ รักษาความเร็วให้ทันกับเมฆเบื้องบนและนักขี่ข้างกาย\n\n"
 tribal.1203.desc_sabotaged_you:0 "#EMP *แคว่ก!*#!\n\nทันใดนั้นทุกอย่างก็พลิกกลับ พื้นดินอยู่เบื้องบนและท้องฟ้าอยู่เบื้องล่าง ข้าพยายามทรงตัวอยู่บนอานม้าเมื่อตระหนักว่ามันเหวี่ยงไปอยู่ใต้ม้า! แต่ขาของข้าหมดแรงยึด... ข้ากระแทกพื้นอย่างแรง – ข้าไม่มีแม้ แต่ลมหายใจจะร้องออกมา"
 tribal.1203.desc_sabotaged_racer:0 "ขณะที่ข้าควบม้ามาข้าง [villain_racer.GetTitledFirstName], [villain_racer.GetSheHe] ก็เบนเข้ามาหาข้าทันที และในขณะเดียวกันข้าก็ได้ยินเสียง [racer.GetTitledFirstName] [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('racer'))] ของข้ากรีดร้องด้วยความเจ็บปวด ข้าหันกลับไปบนอานม้าเพื่อดู [racer.GetHerHim] นอนจมกองเลือดอยู่บนพื้น ม้าของ [racer.GetHerHis] กำลังดิ้นรนอย่างสิ้นหวังกับอานที่ไม่ได้อยู่บนหลังอีกต่อไป แต่ห้อยต่อง แต่งอยู่ใต้ท้องของมัน"
 tribal.1203.desc_sabotaged_villain:0 "ทันใดนั้นข้าก็ได้ยินเสียง [villain_racer.GetTitledFirstName] [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('villain_racer'))] ของข้ากรีดร้องด้วยความเจ็บปวด ข้าหันกลับไปบนอานม้าเพื่อดู [villain_racer.GetHerHim] นอนจมกองเลือดอยู่บนพื้น เศษซากบังเหียนที่ขาดของ [villain_racer.GetHerHis] อยู่ในมือ"
 tribal.1203.desc:0 "ไม่มีอะไรเหมือนสิ่งนี้! สายลม, เสียงกีบม้า, เสียง– ขณะที่ข้าควบม้ามาข้าง [villain_racer.GetTitledFirstName], [villain_racer.GetSheHe] ก็เบนเข้ามาหาข้าทันที เกือบ ทำให้ม้าของข้าเสียหลัก!"
 tribal.1203.a:1 "ข้าต้องหันกลับไปช่วย [villain_racer.GetHerHim]!"
 tribal.1203.b_nothing_sabotaged:0 "แค่สิ่งรบกวนสมาธิ"
 tribal.1203.b:0 "เยี่ยม! คู่แข่งน้อยลง"
 tribal.1203.b.tt:0 "ท่านมุ่งเน้นไปที่การแข่งขัน"
 tribal.1203.c:0 "อย่างน้อยม้าก็ไม่ได้ล้มทับข้า..."
 tribal.1203.d:0 "โอ้ เอาล่ะสิทีนี้, [villain_racer.GetFirstNameNoTooltip]!"
 tribal.1203.d.success:0 "ข้า #EMP บังเอิญ#! ชนกับม้าของ [villain_racer.GetHerHis] แรงไปหน่อย"
 tribal.1203.d.failure:0 "ข้าช้าลงชั่วคราว"
 tribal.1203.d.failure.tt:0 "ข้าอาจได้อันดับแย่ลงในการแข่งขัน"
 tribal.1203.e:0 "ข้าควรจะอยู่ใกล้พอที่จะกระโดด..."
 tribal.1203.success:0 "ข้าสามารถเหวี่ยง [villain_racer.GetHerHim] ตกจากม้าของ [villain_racer.GetHerHis] ได้"
 tribal.1203.failure:0 "ข้าเป็นฝ่ายถูกเหวี่ยงกระเด็นไป"

 tribal.1204.desc_slow:0 "ใช้เวลาหลายนาที แต่ในที่สุดข้าก็ข้ามเส้นชัยได้\n\n"
 tribal.1204.desc_fast:0 "ข้าได้รับการต้อนรับด้วยเสียงโห่ร้องของฝูงชนขณะที่ข้าควบม้าข้ามเส้นชัย\n\n"
 tribal.1204.desc_racer:0 "[racer.GetTitledFirstName] [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('racer'))] ของข้ากำลังเฉลิมฉลองชัยชนะของ [racer.GetHerHis] อยู่แล้ว รายล้อมไปด้วยผู้คนและของขวัญมากมาย และ [racer.GetSheHe] ก็โบกมือให้ข้าอย่างมีความสุข"
 tribal.1204.desc_villain:0 "[villain_racer.GetTitledFirstName] [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('villain_racer'))] ของข้ากำลังเฉลิมฉลองชัยชนะของ [villain_racer.GetHerHis] อยู่แล้ว รายล้อมไปด้วยผู้คนและของขวัญมากมาย และ [villain_racer.GetSheHe] ก็ยิ้มเยาะและโบกมือทันทีที่ [villain_racer.GetSheHe] เห็นข้า"
 tribal.1204.desc_you:0 "ผู้คนรีบเข้ามาแสดงความยินดีกับข้า เอื้อมมือมาสัมผัสม้าของข้า เต้นรำ... แทบไม่มีใครสังเกตเห็น [racer.GetTitledFirstName] และ [villain_racer.GetTitledFirstName] เข้าเส้นชัย ฝูงชนมัว แต่เฉลิมฉลองกับข้า!"
 tribal.1204.desc_you_jumped_horses:0 "ผู้คนเข้ามาแสดงความยินดีกับข้า แต่เกิดความสับสนขึ้นเมื่อพวกเขาเห็นว่าข้าอยู่บนม้าของ [villain_racer.GetTitledFirstNamePossessive] และจูงม้าของข้าเอง อย่างไรก็ตามมีการเต้นรำและการเฉลิมฉลอง และแทบไม่มีใครสังเกตเห็น [racer.GetTitledFirstName] และ [villain_racer.GetTitledFirstNameNoTooltip] เข้าเส้นชัย โดยคนหลังเดินเท้ามา"
 tribal.1204.a:0 "ใช่แล้ว ข้าเร็วมาก ขอบใจ!"
 tribal.1204.b:0 "ข้าจะชนะในครั้งหน้า!"

 tribal.1301.t:0 "การเผชิญหน้าอันตราย"
 tribal.1301.desc:0 "ข้ากำลังเยี่ยมชมแม่น้ำสายเล็กๆ ใกล้กับ [capital.GetName] ขณะที่ข้ากำลังจะดับกระหาย [peasant.GetWomanMan] ชาวบ้านในพื้นที่ก็มายืนขวางตัว[peasant.GetHerselfHimself] ระหว่างข้ากับแม่น้ำอย่างเด็ดเดี่ยว — ช่างกล้านัก!\n\nทันทีที่ข้ากำลังจะสั่งให้ลาก [peasant.GetHerHim] ออกไป [peasant.GetSheHe] ก็พูดขึ้น "มีจระเข้อยู่ในน้ำ [ROOT.Char.Custom('FormOfAddressForLiege')]"\n\n[peasant.GetSheHe|U]... [peasant.GetSheHe|U] #EMP กำลังปกป้อง#! ข้าหรือ?"
 tribal.1301.a:0 "ขอบใจ! นี่ สำหรับหมู่บ้านของเจ้า"
 tribal.1301.b:0 "ข้าต้องการ [peasant.GetWomanMan] เช่นเจ้า"
 tribal.1301.c:0 "จระเข้รึ? หึ! ข้าไม่เห็นจระเข้สักตัว"
 tribal.1301.d:0 "อืม... ขอบใจ ตอนนี้ไปได้แล้ว"
 tribal.1301.d.tt:0 "ข้าฟังคำเตือนของ [peasant.GetHerHis]"

 tribal.1302.desc:0 "ข้าเข้าใกล้น้ำ ไม่สนใจ [peasant.GetWomanMan] และก้มลงไปวักน้ำเย็นในมือ ไม่มีสัญญาณของสิ่งมีชีวิตใดๆ นอกจากแมลง!\n\nขณะที่ข้าเอื้อมมือไปวักน้ำคำที่สอง ข้าได้ยินบางอย่างรบกวนผิวน้ำ และจากนั้น... #EMP ความเจ็บปวด#! เจ็บปวดเหลือเกิน ข้ามองลงไป และมีปากขนาดใหญ่ปิดอยู่รอบขาของข้า เลือดไหลซึมออกมาจากรอบๆ ฟันที่หยัก"
 tribal.1302.a:0 "อ๊ากกก!! เอามันออกไป!"

 tribal.1303.t:0 "โอเอซิส"
 tribal.1303.desc:0 ""[ROOT.Char.Custom('FormOfAddressForLiege')|U]" [councillor.Custom2('MyCharacterIntroduction', ROOT.Char)] เข้ามาหาข้า "มีการค้นพบโอเอซิสใกล้กับ [capital.GetName] ท่านประสงค์ให้ข้าทำสิ่งใด?"\n\nโอเอซิส! แหล่งน้ำและชีวิต... หรือเงินตรา"
 tribal.1303.a:0 "มันจะนำความเจริญรุ่งเรืองมา – การชลประทาน!"
 tribal.1303.b:0 "ใช้มันเพื่อการชลประทาน แต่ไม่ใช่ฟรี"
 tribal.1303.c:0 "ให้ชาวบ้านใช้ประโยชน์จากมันให้ดีที่สุดเท่าที่จะทำได้"
