 ## Desperate faction vassals attempt a coup by Isabella Welch
 yearly.7001.t:0 "วันสุดท้าย"
 yearly.7001.desc:0 "[marshal.GetCouncilTitle|U]ของข้า, [marshal.GetTitledFirstNameNoTooltip], ยื่น[ROOT.Char.Custom('signature_weapon')]ชิ้นโปรดให้ข้า มันถูกลับคมและขัดเงา จนข้าเห็นเสี้ยวหนึ่งของใบหน้าตนเองสะท้อนอยู่ในนั้น\n\n"ท่านควรพกสิ่งนี้ไว้เพื่อความปลอดภัยของท่านเอง เหล่าผู้เห็นต่างกำลังวิ่งพล่านอยู่ในราชสำนักของท่านเหมือนหนูติดโรค และทุกครั้งที่เราเข้าร่วมงานสาธารณะ ข้าสงสัยว่ามันจะเป็นครั้งสุดท้ายของเราหรือไม่"\n\n[marshal.GetSheHe|U]จ้องมองออกไปนอกหน้าต่าง "บางทีเราควรเพิ่มการลาดตระเวนของยาม... อากาศยามเช้านี้มีรสชาติขมขื่น และข้าเกรงกลัว""
 yearly.7001.a:0 "มันจะ ทำให้แขกหวาดกลัว! นี่เป็นเพียงความหวาดระแวง"
 yearly.7001.b:0 "เพิ่มการลาดตระเวนอีกสักหน่อยเพื่อความโชคดี"
 yearly.7001.c:0 "ท่าน#EMP รู้#!อะไรบางอย่างรึ, [marshal.GetTitledFirstNameNoTooltip]?"
 yearly.7001.c.tt:0 "[marshal.GetTitledFirstNameNoTooltip]บอกท่านเพิ่มเติมเกี่ยวกับความสงสัยของ[marshal.GetHerHis]"
 yearly.7001.tt:0 "[marshal.GetTitledFirstNameNoTooltip]ปัดคำถามของท่านทิ้งไป"
 yearly.7001.d:0 "อัดแน่น[ROOT.GetCharacter.Custom('FortifiedBuilding')]ด้วยยาม อย่าให้ห้องใดไร้การเฝ้าระวัง!"
 yearly.7001.d.tt:0 "ท่าน ทำให้ทุกคนที่มายังราชสำนักหวาดกลัว"
 yearly.7001.d.win.tt:0 "ท่าน ทำให้กลุ่มอิทธิพลที่มุ่งเป้ามายังท่านหวาดกลัว"
## Letter of warning from your marshal who is a sympathizer
 yearly.7002:0 "ท่านกำลังตกอยู่ในภยันตรายอันใกล้ [ROOT.Char.Custom('FormOfAddressForLiege')]"
 yearly.7002.d:0 "ข้ารู้สึกละอายใจอย่างยิ่งขณะเขียนถ้อยคำเหล่านี้ [coup_leader.GetTitledFirstName]ใช้เวลาหลายเดือนติดสินบนยามของท่าน [coup_leader.GetSheHe|U]วางแผนที่จะโจมตีชีวิตท่านต่อหน้าราชสำนัก... ข้าปรารถนาให้ชีวิตท่านรอดพ้น แต่ไม่ว่าจะพยายามเพียงใด ข้าก็มิอาจหยุดยั้งหัวใจที่หลั่งเลือดเพื่ออุดมการณ์ของ[coup_faction.GetName]ได้\n\nข้าได้หลบหนีไปลี้ภัยแล้ว เราคงไม่ได้พบกันอีก"
 yearly.7002.a:0 "ข้าเชื่อใจใครไม่ได้เลย!"
 yearly.7002.b:0 "ข้าต้องเชื่อใจ[ROOT.Char.Custom('KnightCulturePluralNoTooltipLowercase')]ที่ใกล้ชิดที่สุดบางคนให้คุ้มกันข้า!"
 yearly.7002.b.tt:0 "[knight_1.GetTitledFirstName]และ[knight_2.GetTitledFirstName]คือยอดนักรบของข้าบางส่วน ข้าต้องหวังว่าพวกเขาจะปกป้องข้า"
 yearly.7002.c:0 "ข้าป้องกันตัวเองได้!"
 yearly.7002.b.tt.2:0 "ท่านไว้วางใจยามสองคนของท่าน"
 yearly.7002.c.tt:0 "ท่านเก็บเรื่องนี้เป็นความลับ"
#### Traitor knights carry you off in a sack
 yearly.7004.desc:0 ""เร็วเข้า! [ROOT.GetCharacter.GetSheHe|U]กำลังจะตื่น!"\n\nขณะที่ข้าตื่นขึ้น หมอนของข้ารู้สึกหยาบกว่าปกติ ศีรษะของข้าหมุนติ้ว แต่ร่างกายส่วนที่เหลือก็เคลื่อนตามไปด้วยและทุกอย่างยังคงมืดมิด ข้าไม่ได้อยู่บนเตียง แต่กำลังถูกลากไปตามพื้นในกระสอบ\n\n"[ROOT.GetCharacter.GetSheHe|U]ดิ้นมากเกินไป! ข้าจับหลุดมือตลอด"\n\nขณะที่เสียงเหล่านั้นโต้เถียงกัน ข้าดิ้นรนอย่างง่ายดายพอที่จะ ทำให้พวกเขาทำกระสอบหล่น เมื่อข้าคลานออกมา ข้าตระหนักว่าพวกเขาแทบจะไม่ได้ไปไกลเกินสวนของ[ROOT.GetCharacter.Custom('FortifiedBuilding')]เลย"
 yearly.7004.tt:0 "แผนการของกลุ่มอิทธิพลถูกขัดขวาง"
 yearly.7004.a:0 "เจ้าเรียกนี่ว่าการลักพาตัวรึ? อย่างน้อยข้าก็คาดหวังให้เจ้าไปถึง[neighbor_county.GetNameNoTier]"
 yearly.7004.b:0 "คนทรยศ! เจ้าทั้งสองจะต้องเน่าเปื่อยในกระสอบในคุกใต้ดินของข้า!"
 yearly.7004.c:0 "แบกข้ากลับไปที่เตียงเดี๋ยวนี้!"
 yearly.7004.c.tt:0 "ท่านถูกนำกลับเข้าไปในกระสอบและพาไปยังห้องบรรทมของท่าน"
#### Assassination attempt
 yearly.7005.preparation:0 "มันช่างน่าตื่นเต้นเหลือเกิน ที่ได้นั่งรอให้[coup_faction.GetName]ลงมือ"
 yearly.7005.preparation_poor:1 "ข้าตัดสินใจที่จะไม่เชื่อใจสหายใดนอกจาก[ROOT.Char.Custom('SignatureWeaponNameOrType')]ของข้า และเราจะไปยัง[ROOT.Char.Custom('GetAfterLifeDestination')]ด้วยกัน หากจำเป็น"
 yearly.7005.preparation_good:0 "มันน่าหัวเราะที่พวกเขาคิดว่าแค่นักฆ่าจะสังหารข้าได้"
 yearly.7005.knight_support:0 "[knight_1.GetTitledFirstName]และ[knight_2.GetTitledFirstName]พร้อมที่จะตายเพื่อข้า แต่ข้าสงสารใครก็ตามที่อาจต้องเผชิญหน้ากับคมดาบของพวกเขา"
 yearly.7005.single_knight_support:0 "อย่างไรเสีย ข้าก็เชื่อใจ[ROOT.Char.Custom('KnightCulturePluralNoTooltipLowercase')]ของข้าว่าจะสนับสนุนข้า"
 yearly.7005.decreased_security:1 "แขกทุกคนใน[ROOT.GetCharacter.Custom('FortifiedBuilding')]ของข้าจิบ[ROOT.Char.Custom('RegionalDrink')]และหมกมุ่นอยู่กับการนินทาโดยไม่สนใจสิ่งใด"
 yearly.7005.increased_security:1 "[ROOT.GetCharacter.Custom('FortifiedBuilding')]เงียบสงัด มีเพียงไม่กี่กลุ่มที่กระซิบกระซาบกัน ทุกคนต่างตื่นตระหนกเมื่อเห็นห้องบัลลังก์ของข้าเรียงรายไปด้วยยาม"
 yearly.7005.throne_approach:0 "[coup_leader.GetTitledFirstName]เข้าใกล้บัลลังก์ของข้า"
 yearly.7005.liberty_faction:0 ""ดูเหมือนว่าหนทางเดียวที่จะทำลายโซ่ตรวนรอบคอของเราคือการเชือดคอทั้งของข้าและของท่าน""
 yearly.7005.independence_faction:0 "\n\n"หากข้ามิอาจมีรัฐของตนเองได้ อย่างน้อยข้าก็ต้องเป็นวีรบุรุษในโศกนาฏกรรมของตนเอง""
 yearly.7005.claimant_faction:1 ""ท่านไม่มีสิทธิ์ที่จะนั่งอยู่บนบัลลังก์นั้น ข้ายอมตายเสียดีกว่าที่จะเห็นท่านออกพระราชกฤษฎีกาจอมปลอมจากมันอีกแม้ แต่ครั้งเดียว""
 yearly.7005.populist_faction:0 ""ข้าเสียใจ ข้าสาบาน ว่าข้ามิอาจมอบความตายที่ยุติธรรมให้ท่านได้มากไปกว่าความทุกข์ทรมานของทุกคนที่ถูกบดขยี้ภายใต้เท้าของท่าน อย่างน้อยจุดจบของข้าก็จะเป็นของวีรบุรุษ""
 yearly.7005.weapon:1 "\n\n[coup_leader.GetSheHe|U]ดึงกริชที่ซ่อนไว้ออกมาและพุ่งเข้ามา"
 yearly.7005.single_death:0 "ในชั่วพริบตาอันน่าสะพรึงกลัว [coup_leader.GetSheHe]โจมตี[first_character_kill.GetTitledFirstName]"
 yearly.7005.double_death:0 "ในการปะทุสองครั้ง [coup_leader.GetSheHe]โจมตี[first_character_kill.GetTitledFirstName]และ[second_character_kill.GetTitledFirstName]"
 yearly.7005.triple_death:0 "ท่ามกลางความสยดสยองของทุกคน [coup_leader.GetSheHe]ฟาดฟันใส่[first_character_kill.GetTitledFirstName], [second_character_kill.GetTitledFirstName] และ [third_character_kill.GetTitledFirstName]"
 yearly.7005.coup_ruler_strike:0 "ก่อนที่จะพุ่งเข้ามาโจมตีข้า"
 yearly.7005.no_death:0 "ความบ้าคลั่งอันหุนหันพลันแล่นนี้จบลงอย่างรวดเร็วเมื่อ[ROOT.Char.Custom('KnightCulturePluralNoTooltipLowercase')]ของข้ารีบเข้าล้อม[coup_leader.GetHerHim]"
 yearly.7005.failure:0 "ขณะที่ทหารยามจับกุม [coup_leader.GetHerHim] ข้าตระหนักว่า [coup_leader.GetSheHe] กำลังพยายามอย่างบ้าคลั่งที่จะแทงดาบเข้าที่หัวใจของ [coup_leader.GetHerHis] เอง แทนที่จะถูกจับ"
 yearly.7005.ruler_death:1 "ในไม่ช้าเลือดของพวกเขาก็ปะปนกับเลือดของข้าเอง ขณะที่ข้ารู้สึกถึง[coup_leader.Custom('SignatureWeaponNameOrType')]แทงเข้าที่หน้าอกของข้า"
 yearly.7005.success:1 "มันเป็นเรื่องโง่เขลาที่จะคิดว่า [coup_leader.GetSheHe] สามารถยึดบัลลังก์ของข้าได้ในการก่อรัฐประหารเล็กๆ นี้ แต่ขณะที่ [coup_leader.GetSheHe] หันดาบไปที่คอของ [coup_leader.GetHerHis] เอง ข้าตระหนักว่านี่ไม่ใช่สิ่งที่ [coup_leader.GetSheHe] ต้องการเลย"
 yearly.7005.a:0 "ยาม, จับกุม[coup_leader.GetHerHim]ไว้ [coup_leader.GetSheHe]จะกลายเป็นมรณสักขีให้พวกผู้เห็นต่างไม่ได้"
 yearly.7005.b:0 "ปล่อยให้[coup_leader.GetHerHim]ทำไป"
 yearly.7005.c:0 "เจ้าสมควรได้รับชะตากรรมที่เลวร้ายกว่าการตายที่นี่!"
 yearly.7005.c.tt:0 "ท่าน ทำให้[coup_leader.GetTitledFirstName]ตาบอดและจองจำ"
 yearly.7005.d:0 "เนรเทศ[coup_leader.GetHerHim]ไป เพื่อบอกเล่าเรื่องราวว่าข้าฆ่ายากเพียงใด"
 yearly.7005.d.tt:0 "ท่านจะได้รับบรรดาศักดิ์และข้าหลวงทั้งหมดของ[coup_leader.GetTitledFirstNamePossessive]"
 yearly.7005.devout.e:0 "เจ้าจะไม่มีวันได้ร่วมกับข้าใน[ROOT.Char.GetFaith.PositiveAfterLife], เจ้าคนเลวทราม!"
 yearly.7005.e:0 "ข้าจะสังหารเจ้าใน[ROOT.Char.GetFaith.NegativeAfterLife], ไอ้สารเลว!"
 ##Participate in a football game,
 #Set up event
 yearly.7010.t:0 "เกมอันงดงาม"
 yearly.7010.desc:0 "การเดินทางไปยังหมู่บ้านแห่งหนึ่งในที่ดินของท่านได้นำข้ามาสู่สถานการณ์ที่น่าสนใจ สิ่งที่ดูเหมือนจะเป็นชาวบ้านส่วนใหญ่ได้ออกมารวมตัวกันที่จัตุรัสตลาด และมีผู้คนสองกลุ่มที่ดูแตกต่างกันรวมตัวกันอยู่\n\nห่างจากทั้งสองกลุ่มเท่าๆ กัน – มองเห็นได้จากตำแหน่งของข้าเพียง เพราะชาวบ้านที่ดูวิตกกังวลคนหนึ่งกำลังถือมันอยู่ – ดูเหมือนจะเป็นกระเพาะปัสสาวะหมูที่พองลม\n\nบางทีอาจสังเกตเห็นสีหน้าสงสัยของข้า คนรับใช้ส่วนตัวคนหนึ่งรีบอธิบายสถานการณ์: ปรากฏว่านี่คือรูปแบบหนึ่งของเกมยอดนิยม!"
 yearly.7010.a:0 "น่าทึ่งมาก! กติกาคืออะไร?"
 yearly.7010.b:0 "เอาล่ะ เราควรปล่อยให้พวกเขาเล่นกันไป"
 yearly.7010.tt.yes:0 "สืบสวนเรื่องราวที่เกิดขึ้น"
 yearly.7010.tt.win:0 "นี่อาจช่วยให้ท่านชนะ!"
 yearly.7010.tt.lose:0 "การเลือกสิ่งนี้อาจลดโอกาสในการชนะของท่าน!"
 #Valet explains game
 yearly.7011.t:0 "เกมอันงดงาม: ชั่งน้ำหนักความเสี่ยง"
 yearly.7011.desc:0 "ด้วยความวิตกกังวลบางประการ คนรับใช้ส่วนตัวที่ไว้ใจได้ของข้าแจ้งให้ข้าทราบถึงกฎและข้อบังคับของเหตุการณ์ที่จะเกิดขึ้น ปรากฏว่า เกมที่เรียกว่า #EMP 'การละเล่นเตะลูกหนัง' #! นี้มีการเล่นกันอย่างแพร่หลาย และครอบคลุมผู้คนทุกประเภท\n\nว่ากันว่า ทั้งสองฝ่ายพยายามที่จะเคลื่อน 'ลูกบอล' – ตามที่เรียกกระเพาะปัสสาวะหมู – ไปยังฝั่งของหมู่บ้านที่กลุ่มของตนไม่ได้ป้องกันอยู่ #EMP โดยไม่เลือกวิธีการ #!\n\nส่วนสุดท้ายนั้นถูกเน้นเสียงด้วยความจริงจังอย่างมีนัยสำคัญ และคำอธิบายก็รวดเร็ว: แม้ความตายจะเกิดขึ้นได้ยาก แต่การบาดเจ็บนั้นไม่ใช่"
 yearly.7011.a:0 "เจ้าคิดว่ามีที่ว่างสำหรับข้าหรือไม่?"
 yearly.7011.b:0 "งานอดิเรกของชาวบ้านทั่วไป ปล่อยพวกเขาไปเถอะ"
 yearly.7011.tt:0 "เอารองเท้าบูทมาให้ข้า!"
 #Pre-game: Literal Under Armour
 yearly.7012.t:0 "เกมอันงดงาม: อุปกรณ์ครบครัน..."
 yearly.7012.desc:0 "ขณะที่ข้ายืนอยู่ท่ามกลางชาวเมือง ข้าเหลือบเห็น[dummy_gender.GetWomanMan]วัยกลางคนคนหนึ่งกำลังปรับสายรัดหนังบางอย่างใต้เสื้อคลุมยาวของ[dummy_gender.GetHerHis] เมื่อข้าสังเกตเห็น อันที่จริงแล้ว ลำตัวช่วงกลางทั้งหมดของ[dummy_gender.GetHerHis]ดูเทอะทะเกินไปสำหรับคนที่มีรูปร่างค่อนข้างผอมบางอย่าง[dummy_gender.GetHerHis] หน้าอกและท้องของ[dummy_gender.GetHerHis]ดูตึงอยู่บ้างภายใต้เสื้อผ้าที่คับแคบ สังเกตเห็นความสนใจของข้า [dummy_gender.GetSheHe]ยิ้ม กวักมือเรียกข้าเข้ามาใกล้ และเปิดผ้าขึ้น\n\nใต้เสื้อคลุมยาวของ[dummy_gender.GetHerHis] พันรอบร่างกายของ[dummy_gender.GetHerHis] คือแผ่นไม้ระแนงหยาบๆ หลายชั้นที่ทำเลียนแบบเกราะ\n\n“ข้าเรียกมันว่า #EMP ‘เกราะซ่อน’#!!” [dummy_gender.GetSheHe]พูดอย่างภาคภูมิใจ พร้อมกับขยิบตาประกอบ"
 yearly.7012.a:0 "เจ้าต้องการเท่าไหร่สำหรับมัน?"
 yearly.7012.b:0 "ช่างเป็นความคิดที่ไร้สาระสิ้นดี"
 #Pre-game: Wealthy merchant buys your best player
 yearly.7013.t:0 "เกมอันงดงาม: การเซ็นสัญญาครั้งใหญ่"
 yearly.7013.desc:0 "เมื่อสังเกตฝูงชน ข้าเห็น[dummy_gender.GetWomanMan]คนหนึ่งที่ดูแปลกแยกอย่างน่าสงสัย สวมใส่เสื้อผ้าขนสัตว์ราคาแพงและมีผู้ติดตามกลุ่มเล็กๆ [dummy_gender.GetSheHe]กำลังสนทนาอย่างมีชีวิตชีวากับ[dummy_gender.GetWomanMan]อีกคนหนึ่งที่ตัวใหญ่กว่าอย่างเห็นได้ชัด เมื่อข้าแหวกฝูงชนเข้าไป ข้าไปถึงบริเวณใกล้เคียงกับพวกเขาทันเวลาพอดีที่จะเห็นพ่อค้าผู้มั่งคั่งหย่อนถุงเงินเล็กๆ ลงในมือของอีกฝ่าย\n\n”...ยินดีที่ได้ทำธุรกิจกับท่าน ตอนนี้ ทำให้แน่ใจว่าการเดิมพันของข้าปลอดภัย!” พ่อค้าแก้มยุ้ยยิ้มเยาะ\n\nขณะที่[dummy_gender.GetWomanMan]ร่างใหญ่เริ่มเดินไปยังกลุ่มของทีมตรงข้าม ดูเหมือนว่าบางคนไม่สนใจความศักดิ์สิทธิ์ของเกม..."
 yearly.7013.a:0 "เดี๋ยวก่อน! ไม่ว่า[dummy_gender.GetSheHe]จะจ่ายให้เจ้าเท่าไหร่ ข้าจะให้สองเท่า!"
 yearly.7013.b:0 "น่าขยะแขยง ไม่เคยเกิดขึ้นในสมัยของข้า!"
 yearly.7013.c:0 "ดูเหมือนว่าเราจะต้องชนะโดยไม่มี[dummy_gender.GetHerHim]!"
 #Pre-game: Messing with pies
 yearly.7014.t:0 "เกมอันงดงาม: จับตาดูพาย"
 yearly.7014.desc:1 "คนทำขนมปังท้องถิ่นผู้มีหัวการค้าได้สังเกตเห็นฝูงชนที่รวมตัวกันอย่างชัดเจน และรถเข็นโยกเยกสองคันของ[dummy_gender.GetHerHis]ที่เต็มไปด้วยพายอบสดใหม่กำลังเป็นที่ต้องการอย่างสูง\n\nเมื่อเดินเตร่ไปยังรถเข็นที่ทีมฝ่ายตรงข้ามกำลังรุมล้อมอยู่ ข้าสังเกตเห็นซี่ล้อหนึ่งของล้อเกือบจะแตกเป็นเสี่ยงๆ ทันทีที่ความคิดนั้นผุดขึ้นในใจ โอกาสที่จะนำไปปฏิบัติก็เกิดขึ้น เมื่อเสียงดังสนั่นของบางอย่างที่ตกลงมาทางฝั่งตรงข้ามของจัตุรัส ทำให้ทุกคนหันไปมองอย่างตกตะลึง\n\nเตะซี่ล้อนั้นอย่างรวดเร็ว และ..."
 yearly.7014.desc.1:0 "คนทำขนมปังท้องถิ่นผู้มีหัวการค้าได้สังเกตเห็นฝูงชนที่รวมตัวกันอย่างชัดเจน และรถเข็นโยกเยกสองคันของ[dummy_gender.GetHerHis]ที่เต็มไปด้วยพายเนื้ออบสดใหม่กำลังเป็นที่ต้องการอย่างสูง\n\nเมื่อเดินเตร่ไปยังรถเข็นที่ทีมฝ่ายตรงข้ามกำลังรุมล้อมอยู่ ข้าเหลือบมองไปที่ชั้นวางขนมอบร้อนๆ ทันทีที่ความคิดนั้นผุดขึ้นในใจ โอกาสที่จะนำไปปฏิบัติก็เกิดขึ้น เมื่อเสียงดังสนั่นของบางอย่างที่ตกลงมาทางฝั่งตรงข้ามของจัตุรัส ทำให้ทุกคนหันไปมองอย่างตกตะลึง\n\nมือของข้าเอื้อมไปที่ถุงเล็กๆ ใส่เฮมล็อกที่เอวของข้า..."
 yearly.7014.a:0 "มาดูกันว่าตอนนี้เจ้าจะเล่นได้ดีแค่ไหน..."
 yearly.7014.b:0 "โอ้ ไม่นะ พายทั้งหมดตกลงไปในดิน!"
 yearly.7014.c:0 "ข้าไม่ควรทำดีกว่า"
 yearly.7014.hemlock:0 "โรยส่วนผสมพิเศษเล็กน้อยลงบนพาย..."
 #Pre-game: Performance-Enhancing Draughts
 yearly.7015.t:0 "เกมอันงดงาม: ยาเพิ่มสมรรถนะ"
 yearly.7015.desc:0 "ขณะที่ข้าเตรียมพร้อมสำหรับการออกแรงที่กำลังจะมาถึง ข้าเหลือบเห็น[dummy_gender.GetWomanMan]คนหนึ่งที่ขอบฝูงชนกำลังยกขวดเหล้าแบนขึ้นดื่ม ดวงตาของ[dummy_gender.GetHerHis]เหลือบมองไปรอบๆ ระหว่างการกลืน แต่ละครั้ง ปกติแล้วนี่จะไม่น่าสงสัยเกินไป แต่ท่าทางลับๆ ล่อๆ ของ[dummy_gender.GetHerHis]นั้นน่าสงสัย และยิ่งน่าสงสัยมากขึ้นไปอีกเมื่อ[dummy_gender.GetSheHe]ตัวสั่นเมื่อข้าแตะไหล่เพื่อสอบถาม\n\nไม่ว่า[dummy_gender.GetSheHe]กำลังดื่มอะไรอยู่ มันไม่ใช่น้ำ: ของเหลวนั้นค่อนข้างขุ่น และเห็นได้ชัดจากสีหน้าเหยเกของ[dummy_gender.GetHerHis]ทุกครั้งที่ริมฝีปากสัมผัสกับมันว่ารสชาติคงไม่น่าพอใจนัก โชคดีที่[dummy_gender.GetSheHe]เกือบจะกระตือรือร้นที่จะเปิดเผยความลับของ[dummy_gender.GetHerHis]เมื่อถูกกระตุ้นเบาๆ\n\n'เพิ่มสมรรถนะ' เจ้าว่ารึ?"
 yearly.7015.a:0 "...เจ้าต้องการเท่าไหร่สำหรับนั่น?"
 yearly.7015.b:0 "เจ้าควรละอายใจตัวเอง!"
 #Game starts!
 yearly.7020.t:0 "เกมอันงดงาม: เริ่มการแข่งขัน"
 yearly.7020.desc:0 "เมื่อจัดการเรื่องหยุมหยิมก่อนเกมเรียบร้อยแล้ว สิ่งที่เหลืออยู่คือการเริ่มการแข่งขัน ผู้ป่าวประกาศประจำเมือง โน้มตัวออกมาอย่างอันตรายจากหน้าต่างชั้นหนึ่งของบ้านที่มองเห็นจัตุรัส โยนกระเพาะปัสสาวะหมูผ่านกรอบหน้าต่าง\n\nฝูงชนเงยหน้ามองอย่างคาดหวัง และหลังจากหยุดชั่วครู่ 'ลูกบอล' ก็ลอยขึ้นไปในอากาศ\n\nการวิ่งกรูกันเริ่มต้นขึ้น"
 yearly.7020.a:0 "ตามข้ามา ทีม!"
 yearly.7020.b:0 "อ๊ากกกกกกกกก!"
 #First half: A villager comes at you with a rock!
 yearly.7021.t:0 "เกมอันงดงาม: ร็อคแอนด์โรล"
 yearly.7021.desc:0 "สิ่งที่เรียกว่า 'เกม' นั้นหนักหนาสาหัสกว่าที่ท่านคาดคิดไว้มาก ชื่อเสียงด้านความรุนแรงก็ไม่ได้เกินจริง เช่นกัน\n\nทางซ้ายของท่าน [dummy_gender.GetWomanMan]คนหนึ่งกำลังล็อกคออีกคนหนึ่งด้วยท่าล็อกคอแบบบ้านๆ ทั้งคู่โซซัดโซเซผ่านการชกต่อยกันอย่างเต็มรูปแบบระหว่าง - ดูเหมือนว่า - คนสี่คนพร้อมกัน\n\nขณะที่ข้าถอยห่างจากการต่อสู้ระยะประชิดนั้น ชาวบ้านอีกคน - ตาเบิกโพลงภายใต้หน้ากากเลือดที่ไหลลงมาจากแผลที่หน้าผาก - เข้ามาหาข้าพร้อมก้อนหินในมือ"
 yearly.7021.a:0 "เฮ้! นั่นมันผิดกติกา!"
 yearly.7021.b:0 "ข้าจะ ทำให้เจ้ากินหินก้อนนั้น!"
 yearly.7021.c:0 "ได้เวลาหนีออกจากที่นี่แล้ว!"
 yearly.7021.a.tt.win:0 "ท่านปัดก้อนหินออกไป!"
 yearly.7021.a.tt.lose:0 "ท่านไม่สามารถป้องกันตัวเองได้"
 yearly.7021.c.tt.escape:0 "ท่านหนีรอดไปได้อย่างปลอดภัย"
 yearly.7021.c.tt.escapefail:0 "ท่านไม่สามารถหนีรอดไปได้"
 #First half: Player is getting seduced by a winsome lad/lass
 yearly.7022.t:0 "เกมอันงดงาม: ผู้ชมเจ้าเสน่ห์"
 yearly.7022.desc:0 "ทีมฝ่ายตรงข้ามได้บอล! ผู้ถือบอลเป็น[dummy_gender.GetWomanMan]หนุ่มสาวหน้าตาดี และเห็นได้ชัดว่าเป็นคนเจ้าเล่ห์ด้วย หลังจากได้บอลแล้ว [dummy_gender.GetSheHe]กำลังปีนบ้านหลังหนึ่งเพื่อหนีจากฝูงชนที่โห่ร้องอยู่ด้านล่าง\n\nแม้ว่าแผนของ[dummy_gender.GetHerHis]ในตอนแรกจะดูรัดกุม แต่ดูเหมือนว่า[dummy_gender.GetSheHe]จะคำนึงถึงความปรารถนาพื้นฐานของ[dummy_gender.GetHerHis]ไม่เพียงพอ: ขณะที่ข้าดึงตัวเองขึ้นไปยังระดับเดียวกับ[dummy_gender.GetHerHis]บนผนังบ้าน [dummy_gender.GetSheHe]เห็นได้ชัดว่ากำลังเสียสมาธิกับ[same_gender.GetWomanMan]เจ้าเสน่ห์คนหนึ่งที่หน้าต่าง\n\nทั้งสองดูเหมือนจะหลงใหล ซึ่งกันและกัน ข้าอยู่ห่างแค่เอื้อมมือ..."
 yearly.7022.a:0 "ฉกมาเลย!"
 yearly.7022.b:0 "อา รักแรกแย้ม!"
 yearly.7022.c:0 "ฮ่า! ข้าจะแสดงให้เจ้าเห็นว่า[ROOT.Char.GetWomanMan]ตัวจริงเป็นอย่างไร!"
 #First half: Punching a priest
 yearly.7023.t:0 "เกมอันงดงาม: หัตถ์แห่ง[ROOT.Char.GetFaith.HighGodName]"
 yearly.7023.desc:0 "กระเพาะปัสสาวะหมูหลุดมือ! มือคู่หนึ่งที่ประหม่าทำมันหลุด และมันกระดอนหนึ่งครั้งก่อนที่จะถูกคว้าโดย... สมาชิกของ[ROOT.Char.GetFaith.AltPriestTermPlural]?\n\n[dummy_clergy_gender.GetSheHe|U]ยิ้มและเดินโซเซไปข้างหน้า ฝูงชนแหวกทางอย่างไม่แน่ใจต่อหน้า[dummy_clergy_gender.GetHerHim] ไม่มีใครแน่ใจว่าจะทำอย่างไรกับนักบวชผู้นี้ที่เล่นเกมรุนแรง เช่นนี้ และยิ่งไปกว่านั้น ดูเหมือนจะรอดพ้นไปได้!\n\nข้าก้าวไปข้างหน้าอย่างลังเล..."
 yearly.7023.a:0 "...และต่อย[dummy_clergy_gender.GetHerHim]เข้าที่ใบหน้าเต็มๆ"
 yearly.7023.b:0 "...และหลีกทาง ให้คนอื่นจัดการกับ[dummy_clergy_gender.GetHerHim]"
 #First half: Damaging a local building
 yearly.7024.t:0 "เกมอันงดงาม: หลังคาหญ้าคาแห่งความวุ่นวาย"
 yearly.7024.desc:0 "ฝูงชนถาโถมและกระแทกเข้ากับผนังบ้านใกล้เคียงเหมือนคลื่น ขณะที่กลุ่มถอยห่างจากกำแพง หลายคนเกาะติดกับส่วนที่ยื่นออกมาเท่าที่จะทำได้ ขณะที่คนอื่นๆ พยายามดึงพวกเขาออกไปเพื่อไปยังผู้ถือบอล\n\nเสียงไม้แตกและกิ่งไม้สานหักดังไปทั่วจัตุรัสตลาด และขณะที่ฝูงชนถอยกลับ ส่วนต่างๆ ของหลังคาหญ้าคาของบ้านก็ร่วงหล่นลงสู่พื้น"
 yearly.7024.a:0 "ข้าจะจ่ายค่าซ่อมแซมให้!"
 yearly.7024.b:0 "ทุกอย่างยุติธรรมในความรักและฟุตบอล!"
 #Second half: Diving scum
 yearly.7030.t:0 "เกมอันงดงาม: ไม่เคยเป็นจุดโทษ"
 yearly.7030.desc:0 "ขณะที่เกมดำเนินไป ชาวบ้านจำนวนมากขึ้นเรื่อยๆ ต้องออกจากการแข่งขัน มีคนหนึ่งเดินโซเซผ่านข้าไป รอยฟกช้ำปรากฏชัดบนศีรษะแล้ว\n\nทันใดนั้น ชายอีกคนจากกลุ่มก็ล้มลงที่เท้าข้าพร้อมกับเสียงกรีดร้องที่ดังแสบแก้วหู เสียงดังพอที่จะ ทำให้ผู้เข้าร่วมคนอื่นๆ เสียสมาธิได้ และทั้งฝูงชนและข้าต่างถอยห่างจากร่างที่บิดเบี้ยวของเขา - แม้ว่าข้าจะ#EMP สาบาน#!ได้ว่าข้าเห็นตาข้างหนึ่งเปิดอยู่...\n\nทันทีที่มีแสงสว่างเพียงพอส่องผ่านฝูงชน ชายที่ 'บาดเจ็บ' ก็กระโดดลุกขึ้นยืนและคว้าลูกบอล วิ่งตรงมาหาข้าข้ามจัตุรัส!"
 yearly.7030.a:0 "ข้า-... เอ่อ-... #EMP กรรมการ!#!"
 yearly.7030.b:0 "คนขี้โกง! ข้าจะจับเขาให้ได้!"
 yearly.7030.c:0 "โอ้ ดีใจที่เห็นเขาฟื้นตัวเร็ว!"
 yearly.7030.b.win:0 "ท่านจับคนเจ้าเล่ห์ได้"
 yearly.7030.b.lose:0 "ท่านพลาดคนโกงไป"
 #Second half: Bladed boots
 yearly.7031.t:0 "เกมอันงดงาม: นักกัดข้อเท้า"
 yearly.7031.desc:0 "เกมดำเนินต่อไป และข้าสังเกตเห็นว่าจำนวนสมาชิกในทีมของข้าเริ่มลดน้อยลง ผู้เข้าร่วมหลายคนนอนเกลื่อนกลาดอยู่ทั่วจัตุรัสตลาด ทุกคนต่างกุมข้อเท้าที่บาดเจ็บ #EMP ร้ายแรง#! ดูจากสภาพแล้ว ขณะที่ข้าต่อสู้กับคนรอบข้าง แสงแวววาวใกล้พื้นก็สะดุดตาข้า และข้าตระหนักด้วยความสยดสยองว่าชะตากรรมใดที่เกิดขึ้นกับสหายของข้า\n\nชาวบ้านผู้กระหายเลือดบางคนได้เย็บใบมีดเล็กๆ เข้ากับรองเท้าของพวกเขา และแม้ขณะที่ข้ามองดู พวกเขาก็กวาดมันเข้าที่หน้าแข้งของอีกคนอย่างโหดเหี้ยม ข้าพิจารณาที่จะผลักดันไปข้างหน้าเพื่อเผชิญหน้ากับพวกเขา"
 yearly.7031.a:0 "ถอดรองเท้าพวกนั้นออกจากพวกเขา!"
 yearly.7031.b:0 "ข้าชอบหน้าแข้งของข้าอย่างที่มันเป็น!"
 yearly.7031.c:0 "ช่างเป็นความคิดที่แปลกใหม่..."
 yearly.7031.a.win:0 "ท่านปล้ำถอดรองเท้าออกจากพวกเขาได้"
 yearly.7031.a.lose:0 "พวกเขาเตะหน้าแข้งท่าน!"
 #Second half: Drinks break
 yearly.7032.t:0 "เกมอันงดงาม: พักดื่มน้ำ"
 yearly.7032.desc:0 "ฝูงชนเซไปด้านข้าง ผลักข้าออกจากใจกลางด้วยแรงพอสมควร เมื่อเดินโซเซไปที่กำแพงเพื่อตั้งหลักและพักหายใจ ข้าเหลือบเห็นพ่อค้าสองสามคนแบกเครื่องดื่มต่างๆ พวกเขาคงทำธุรกิจได้ดีทีเดียว เมื่อพิจารณาว่านี่เป็นงานหนักแค่ไหน!\n\nข้าต้องการอาหารบำรุงกำลังเหมือนกัน ข้าสงสัยว่าพวกเขามีอะไรขายบ้าง?"
 yearly.7032.a:0 "น้ำเปล่าสดชื่น! เยี่ยมเลย!"
 yearly.7032.b:0 "เบียร์สักไพน์คงจะดีสำหรับข้า!"
 yearly.7032.c:0 "ท่านพอจะมี[ROOT.Char.Custom('RegionalDrink')]บ้างไหม?"
 yearly.7032.d:0 "เค้กกัญชาพวกนั้นมีไว้ขายรึเปล่า?"
 #Second half: Bowyer and dyer fight
 yearly.7033.t:0 "เกมอันงดงาม: ย้อมใจ"
 yearly.7033.desc:0 "การต่อสู้กับฝ่ายตรงข้ามระหว่างเกมเหล่านี้เป็นเรื่องปกติอย่างยิ่ง แต่ด้วยความสับสนบางประการ ข้าเห็นสิ่งที่ดูเหมือนจะเป็นเพื่อนร่วมทีมสองคนกำลังต่อสู้#EMP! กันเอง#! ท่านจำ แต่ละคนได้ คนหนึ่งคือช่างทำคันธนูท้องถิ่น อีกคนคือช่างย้อมสิ่งทอ ทั้งสองกำลังต่อสู้อย่างดุเดือด จนเพื่อนร่วมทีมของพวกเขาเริ่มสังเกตเห็น\n\nข้อพิพาทเล็กน้อยนี้เริ่มผูกมัดส่วนสำคัญของทีมข้า และฝูงชนเริ่มเคลื่อนตัวไปยังฝั่งของหมู่บ้านที่เรากำลังป้องกัน..."
 yearly.7033.a:0 "เอาล่ะ แยกย้ายกันไป!"
 yearly.7033.b:0 "ข้าขี้เกียจที่จะยุติการทะเลาะวิวาทเล็กน้อย"
 yearly.7033.a.win:0 "ท่านแยกนักสู้ทั้งสองออกจากกันได้สำเร็จ"
 yearly.7033.a.lose:0 "การทะเลาะวิวาทบานปลาย"
 #Match resolution holding event
 yearly.7040.t:0 "เกมอันงดงาม: คะแนนสุดท้าย"
 yearly.7040.desc:0 "ขณะที่วันดำเนินไป การรุกและรับของเกมก็มาถึงจุดสุดยอด ทั้งสองฝ่ายพุ่งเข้าหาลูกบอล และข้าติดอยู่กลางกระแสผู้คนนั้น\n\nข้าล้มลง ปกป้องศีรษะจากเท้าที่กระทืบ เพียงเพื่อจะคลานลุกขึ้นนั่งคุกเข่าและพบว่าความสงบผิดปกติเข้าปกคลุมจัตุรัสตลาด\n\nดูเหมือนว่าเกมจะจบลงแล้ว"
 yearly.7040.a:0 "เรา... เราชนะรึเปล่า?"
 #Glorious victory
 yearly.7041.t:0 "เกมอันงดงาม: ชัยชนะอันรุ่งโรจน์!"
 yearly.7041.desc:0 "ทีมของข้ายกตัวข้าขึ้นสู่ท่ายืน และเสียงเชียร์ของพวกเขา ทำให้หัวใจข้าพองโตจนแทบระเบิด! มันไม่ใช่แค่ชัยชนะ มันคือ#EMP การถล่มทลาย#! และท่านก็มีส่วนสำคัญในนั้น!\n\nคู่ต่อสู้ของเราเริ่ม "
 yearly.7041.a:0 "ช่างเป็นเกมที่น่าตื่นเต้นอะไร เช่นนี้!"
 yearly.7041.b:0 "ข้าจะสั่งทำของที่ระลึก!"
 yearly.7041.desc.ending:0 "ค่อยๆ เคลื่อนออกจากบริเวณนั้นอย่างสิ้นหวัง แต่งานเลี้ยงสำหรับผู้ชนะเพิ่งจะเริ่มต้นขึ้นเท่านั้น ถัง [ROOT.Char.Custom('RegionalDrink')] ขนาดใหญ่ได้ถูกนำมาตั้งไว้เป็นจุดสนใจแล้ว และเครื่องดื่มก็ถูกรินอย่างอิสระเพื่อการเฉลิมฉลองที่จะดำเนินไปจนถึงค่ำอย่างไม่ต้องสงสัย"
 #Victory
 yearly.7042.t:0 "เกมอันงดงาม: ชัยชนะ!"
 yearly.7042.desc:0 "ข้าโซเซยืนขึ้นและพยายามเพ่งมองอย่างมัวๆ ขณะที่ผู้คนเดินผ่านไปรอบๆ ตัวข้า ที่ใจกลางจัตุรัส กลุ่มหนึ่งกำลังเฉลิมฉลอง ข้าใช้เวลาหลายวินาทีกว่าจะรู้ว่าพวกเขาคือทีมของข้าจริงๆ!\n\nคู่ต่อสู้ของเราเริ่ม "
 yearly.7042.a:0 "ช่างเป็นเกมที่น่าตื่นเต้นอะไร เช่นนี้!"
 yearly.7042.b:0 "ข้าจะสั่งทำของที่ระลึก!"
 #Draw
 yearly.7043.t:0 "เกมอันงดงาม: เสมอ"
 yearly.7043.desc:0 "เมื่อโซเซยืนขึ้น ข้าพบว่าตัวเองยังคงถูกรายล้อมไปด้วยผู้คนจำนวนมาก ความแตกต่างดูเหมือนจะเป็นความเร่งรีบในการเคลื่อนไหวของทุกคน เนื่องจากผู้เล่นดูเหมือนจะเดินออกจากพื้นที่อย่างเซื่องซึม\n\nเมื่อดวงอาทิตย์คล้อยต่ำลงบนท้องฟ้า ดูเหมือนว่าเกมจะจบลงโดยไม่มีผลการตัดสินที่ชัดเจน"
 yearly.7043.a:0 "ไม่เป็นไร คราวหน้าเราจะเอาชนะพวกเขาให้ได้!"
 #Defeat
 yearly.7044.t:0 "เกมอันงดงาม: พ่ายแพ้!"
 yearly.7044.desc:0 "ข้าโซเซยืนขึ้นและพยายามเพ่งมองอย่างมัวๆ ขณะที่ผู้คนเดินผ่านไปรอบๆ ตัวข้า ที่ใจกลางจัตุรัส กลุ่มหนึ่งกำลังเฉลิมฉลอง ข้าใช้เวลาหลายวินาทีกว่าจะรู้ว่า... นั่นคือทีมฝ่ายตรงข้าม\n\nทีมของข้าเริ่ม "
 yearly.7044.a:0 "ขอแสดงความยินดีกับผู้ชนะ!"
 yearly.7044.b:0 "บ๊ะ! เราน่าจะชนะ!"
 yearly.7044.c:0 "อย่างไรเสีย ข้าก็สมควรได้รับถ้วยรางวัล!"
 #Heavy Defeat
 yearly.7045.t:0 "เกมอันงดงาม: พ่ายแพ้ยับเยิน!"
 yearly.7045.desc:0 "เสียงฝีเท้ากระทืบดังสนั่นผ่านไป และข้าพยายามลุกขึ้นยืนเพื่อดูว่าทำไม ที่ระยะห่างสั้นๆ ในจัตุรัส ทีมฝ่ายตรงข้ามชูบอลขึ้นอย่างมีชัยและโห่ร้อง มันไม่ใช่แค่การแพ้ มันคือการถูกทำลายล้างอย่างสิ้นเชิง\n\nทีมของข้าเริ่ม "
 yearly.7045.a:0 "ขอแสดงความยินดีกับผู้ชนะ!"
 yearly.7045.b:0 "บ๊ะ! เราน่าจะชนะ!"
 yearly.7045.c:0 "อย่างไรเสีย ข้าก็สมควรได้รับถ้วยรางวัล!"
 ##Foggy Hill
 #There used to be a hole here
 yearly.7050.t:0 "รูอยู่ไหน?"
 yearly.7050.desc:0 "ข้าพบ[unfortunate_soul.GetTitledFirstName]ในโถงทางเดิน กำลังจ้องมองผนังอย่างตั้งใจ ข้าสอบถามอย่างสงสัยว่า[unfortunate_soul.GetSheHe]กำลังทำอะไรอยู่\n\nสายตาของ[unfortunate_soul.GetHerHis|U]จับจ้องมาที่ข้าพร้อมกับการกระตุกที่น่ากลัว: "เคยมีรูอยู่ที่นี่ ท่านรู้ไหม" [unfortunate_soul.GetTitledFirstNameNoTooltip]อุทานด้วยความเชื่อมั่นอย่างแน่วแน่\n\nข้ามองไปที่ผนังตรงหน้า[unfortunate_soul.GetHerHim] — ไม่สามารถหาร่องรอยใดๆ ของรูที่กำลังถูกกล่าวถึงได้"
 yearly.7050.a:0 "รู... อยู่ที่ไหน?"
 yearly.7050.a_paranoid:0 "ข้าต้องรู้ให้มากขึ้น"
 yearly.7050.a.flavor:0 "ช่างเป็นความคิดที่น่าสนใจ"
 yearly.7050.b:0 "นี่มันไร้สาระ"
 yearly.7050.b.flavor:0 "[unfortunate_soul.GetShortUIName]ต้องเพ้อเจ้อแน่ๆ"
 yearly.7050.c:0 "หยุดเสียเวลาข้า!"
 #A bad dream?
 yearly.7051.t:0 "เนินเขามีหมอก"
 yearly.7051.desc:0 "หมอกหนาทึบจนแทบจะตัดด้วยมีดได้ และข้ามองไปรอบๆ อย่างอ่อนแรงเพื่อพยายามหาทิศทาง ข้าเคยมาที่นี่มาก่อนหรือไม่? นี่คือ... สมรภูมิรึ?\n\nมือของข้าสั่นขณะที่พยายามทำความเข้าใจสถานการณ์ และข้าก้าวไปข้างหน้าสองสามก้าว ข้าได้ยินเสียงจากระยะไกล เสียงเรียก: "ท่านเห็นเด็กชายตัวเล็กๆ บ้างไหม?"\n\nทันใดนั้นข้าก็เริ่มเห็นใบหน้าในหมอก นั่นคือ... คนที่ข้าเคยฆ่ารึ? พวกเขาดูเหมือนแข็งทื่อด้วยใบหน้าบิดเบี้ยวอันน่าสะพรึงกลัว"
 yearly.7051.a:0 "มันเป็นความผิดของข้าทั้งหมด..."
 yearly.7051.a.flavor:0 "ท่านยอมรับความรับผิดชอบ"
 yearly.7051.b:0 "พวกเขาสมควรได้รับมัน พวกเขาทุกคน"
 yearly.7051.b_conviction.desc:0 "ท่านสามารถโน้มน้าวตัวเองได้"
 yearly.7051.b_unconvinced.desc:0 "ท่านเสียสติ"
 #Waking up
 yearly.7052.t:0 "เหมือนฝัน"
 yearly.7052.desc_unconvinced:0 "ข้าตื่นขึ้น อาบไปด้วยเหงื่อ นั่นเป็นฝันที่เลวร้ายที่สุด หรือไม่ก็เป็นหนึ่งในฝันที่แย่ที่สุดที่ข้าเคยฝันในช่วงหลังๆ นี้\n\nมือของข้ายังคงสั่นจากความเครียดที่เกิดจากความฝัน ขณะที่ข้ารำลึกถึงเนื้อหาของมัน "เรื่องต่างๆ คงไม่เลวร้ายไปกว่านี้แล้ว" ข้าพึมพำ ขณะที่พลิกตัวอย่างน่าสมเพชเพื่อพยายามหลับต่อ"
 yearly.7052.desc:0 "ข้าตื่นขึ้น สงบอย่างน่าประหลาดใจ นั่นเป็นฝันที่น่าสนใจ — แม้จะไม่น่าพอใจนัก แต่ข้าก็เคยฝันร้ายกว่านี้ในชีวิต\n\nข้าครุ่นคิดถึงเนื้อหาของมันอย่างรอบคอบ แล้วพลิกตัวไปอีกด้าน ขณะที่ข้าหลับใหลไปอีกครั้งอย่างผ่อนคลายในไม่ช้า"
 yearly.7052.a:0 "มันเป็นแค่ฝันร้าย"
 yearly.7052.a_positive:0 "ช่างเป็นฝันที่แปลกประหลาด"
 #Denial
 yearly.7053.t:0 "รูอะไรกัน?"
 yearly.7053.desc:0 "โถงทางเดินอาบแสงแดด ขณะที่ข้ามุ่งหน้าไปยังห้องครัว ทันใดนั้น ที่หางตาของข้า — มี#EMP รู#! อยู่ในกำแพง\n\nข้าแข็งทื่อขณะจ้องมองรูนั้นด้วยสายตาที่สงสัย แต่พินิจพิเคราะห์ มันไม่ใช่รูขนาดใหญ่ อาจจะเท่าแขน แต่มันมืดสนิท\n\nข้าเข้าใกล้รูอย่างระมัดระวังและพยายามมองเข้าไปข้างใน สับสนเกี่ยวกับที่มาและจุดประสงค์ของมัน"
 yearly.7053.a:0 "คนดูแลพื้นที่น่าจะรู้เรื่องนี้ดีกว่า"
 yearly.7053.b:0 "ข้าคิดว่าข้าเห็นบางอย่าง..."
 yearly.7053.b_pouch.desc:0 "ท่านดึงถุงเหรียญทองออกมาจากรู"
 yearly.7053.b_scratch.desc:0 "บางอย่างข่วนแขนท่าน"
 #Coming to
 yearly.7054.t:0 "การปลุกที่กระฉับกระเฉง"
 yearly.7054.intro: "ข้าถูกคนรับใช้คนหนึ่งเขย่าปลุกอย่างระมัดระวัง [7054_servant.GetSheHe|U] มองข้าอย่างกังวลและอุทานว่า: "[ROOT.Char.Custom('FormOfAddressForLiege')|U]! ท่านไม่เป็นไรนะ?" ขณะที่ข้ามองไปรอบๆ ทางเดินอย่างมึนงง\n\nข้าหมดสติไปหรือ?"
 yearly.7054.desc_pouch:0 "ยังคงอยู่ในมือข้า ข้ากำถุงทองคำที่ข้าสามารถดึงออกมาจาก... รู?"
 yearly.7054.desc_scratch:0 "มีความรู้สึกแสบร้อนที่แขนของข้า แขนข้างที่ข้าใส่เข้าไปใน... รู?"
 yearly.7054.desc:0 "ข้าจำได้ลางๆ เกี่ยวกับการสนทนาที่ข้าควรจะมีกับคนดูแลพื้นที่... เกี่ยวกับรู?"
 yearly.7054.outro:0 "\n\nเมื่อรีบลุกขึ้นยืน ข้าจ้องมองไปที่กำแพง "เคยมีรูอยู่ที่นี่" ข้าพึมพำขณะที่สายตากวาดไปทั่วผนังที่สว่างไสวของโถงทางเดิน"
 yearly.7054.a:0 "... ข้าคงจะคิดไปเอง"
 yearly.7054.a.flavor_pouch:0 "ข้ากำถุงแน่น"
 yearly.7054.a.flavor_scratch:0 "ความแสบร้อนที่แผ่ออกมาจากรอยขีดข่วนบนแขนของข้ารุนแรงขึ้น"
 yearly.7054.a.flavor:0 "ข้าสังเกตเห็นคนรับใช้ ซึ่งตอนนี้ระมัดระวัง กำลังสังเกตการณ์ข้าอยู่"
 #It was the dog all along
 yearly.7055.t:0 "ที่พักพิงสำหรับสุนัข"
 yearly.7055.desc:0 "ขณะที่ข้าข้ามลานกว้าง หมาพันทางตัวหนึ่งวิ่งออกมาจากไหนไม่รู้และหยุดอยู่ตรงหน้าข้า มีชิ้นส่วนโลหะแปลกๆ ติดอยู่ที่ปลอกคอของมัน\n\nสุนัขมองข้าอย่างคาดหวังขณะที่ข้าก้มลงมองเข้าไปในดวงตาสีน้ำตาลของมัน รำคาญเล็กน้อยกับการขัดจังหวะ ความรำคาญของข้าจางหายไปอย่างรวดเร็ว และข้ารู้สึกแปลกๆ ว่าสุนัขกำลังควบคุม... สิ่งต่างๆ?\n\nข้าเสียสติไปแล้วจริงๆ ข้าคิด ขณะที่จับปลอกคอสุนัขและถอดชิ้นส่วนโลหะที่น่าหัวเราะออก เมื่อข้าหันหลังกลับ สุนัขมองข้าอย่างเคร่งขรึม ข้าเดาว่า... ตอนนี้มันเป็นของข้าแล้ว?"
 yearly.7055.a:0 "มานี่ เจ้าหมา"
 yearly.7055.b:0 "ไป#EMP ให้พ้น#! เจ้าหมาขี้เรื้อน!"
 yearly.7055.b.flavor:0 "สุนัขมองท่านด้วยแววตาเจ็บปวด"
