l_english: 
 bp1_yearly.7000.t:0 "ละศีลอดกับสหาย"
 bp1_yearly.7000.desc:1 "ข้ากำลังเดินทางไปยัง [ROOT.Char.GetFaith.HouseOfWorship] เมื่อข้าบังเอิญพบกับ [distraction_friend.GetTitledFirstName] [ROOT.Char.Custom2('RelationToMeShort', distraction_friend)] ของข้า ผู้ ซึ่งกำลังถือถุงใบเล็กอยู่ หลังจากเหลียวมองรอบๆ [distraction_friend.GetSheHe] ก็เปิดมันออกอย่างมีลับลมคมใน เผยให้เห็นอาหารและเครื่องดื่มนานาชนิด\n\n"ช่างเป็นวันที่อากาศดีเสียจริง มาร่วมปิกนิกยามเช้ากับข้าข้างนอกเถิด" [distraction_friend.GetSheHe|U] เอ่ยขึ้น\n\nขณะที่ข้าเริ่มท้วงว่ากำลังจะไป [ROOT.Char.GetFaith.HouseOfWorship] [distraction_friend.GetFirstNameNoTooltip] ก็พูดขัดขึ้นมาว่า: \n\n"[ROOT.Char.GetFaith.HighGodName] ยังคงอยู่ที่นั่นในภายหลัง แต่ [ROOT.Char.Custom('GetExpensiveDessert')] เหล่านี้จะไม่รอ" "
 bp1_yearly.7000.a:0 "[ROOT.Char.GetFaith.HighGodName] สำคัญกว่าอาหารเช้า"
 bp1_yearly.7000.b:0 "บาปที่แท้จริงคือการปล่อยให้โอกาสนี้ผ่านไป"
 
 lovely_picnic_modifier:0 "การสังสรรค์กลางแจ้งอันน่ารัก"
 lovely_picnic_modifier_desc:0 "ได้ไปสังสรรค์กลางแจ้งอันน่ารัก"
 
 bp1_yearly.7001.t:0 "ไปตกปลา"
 bp1_yearly.7001.desc:1 "[ROOT.Char.Custom2('RelationToMeShort', fishing_friend)] [fishing_friend.GetFirstName] ของข้าเข้ามาทักทาย ยิ้มกว้างจนเห็นฟัน ในมือของ[fishing_friend.GetHerHis]มีคันเบ็ดสองคัน\n\n\"ไปตกปลากับข้าวันนี้เถิด [fishing_friend.Custom2('RelationToMeShort', ROOT.Char)] ที่รัก ข้ารับรองว่าท่านจะชอบมัน!\" [fishing_friend.GetSheHe|U] อุทาน\n\nนานแล้วที่ข้าไม่ได้หยุดพักและหลีกหนีจากความวุ่นวายของ [ROOT.Char.Custom('FortifiedBuilding')]..."
 bp1_yearly.7001.a:0 "ข้าจักจับปลาคาร์ปขาวในตำนานให้ได้!"
 bp1_yearly.7001.b:0 "[ROOT.Char.GetTitleAsNameNoTooltip] ไม่ #EMP 'ตกปลา'#! หรอก"
 
