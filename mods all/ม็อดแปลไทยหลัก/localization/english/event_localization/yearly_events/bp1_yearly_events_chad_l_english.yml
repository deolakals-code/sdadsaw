l_english: 

 # bp1_yearly_events_chad
 bp1_yearly.3001.t:0 "สหายแท้"
 bp1_yearly.3001.desc:0 "ช่วงนี้สถานการณ์ที่[ROOT.Char.Custom( 'FortifiedBuilding' )]ค่อนข้างฝืดเคือง ไม่ว่าข้าจะเก็บภาษีได้มากเพียงใด ก็ยังไม่สามารถ ทำให้เพียงพอต่อรายจ่ายได้!\n\n[friend.GetTitledFirstNameNoTooltip], [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('friend'))]ผู้ซื่อสัตย์เสมอมา ได้มาเยี่ยมข้าในช่วงโชคร้ายนี้ ขณะที่เรากำลังหารือเกี่ยวกับปัญหาปัจจุบันของข้า [friend.GetSheHe]ก็เสนอที่จะเติมเต็มคลังของข้าด้วยเงินช่วยเหลือจำนวนมาก\n\n[friend.GetFirstNameNoTooltip]กุมมือข้าและกล่าวเบาๆ ว่า "ให้ข้าช่วยท่านเถิด [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('friend'))]ของข้า ข้ารู้ว่าท่านก็จะทำ เช่นเดียวกันเพื่อข้า""
 bp1_yearly.3001.a:0 "สรรเสริญ[ROOT.Char.GetFaith.WealthGodName]สำหรับความประหลาดใจอันรุ่งโรจน์นี้!"
 bp1_yearly.3001.b:0 "ข้าไม่อาจรบกวนสหายได้"
 bp1_yearly.3001.c:0 "สิ่งที่ข้าต้องการจริงๆ คือเครื่องดื่มสักสองสามแก้ว..."
 bp1_yearly.3001.c.tt:0 "ท่านและ [friend.GetFirstNameNoTooltip] ผลาญเงินเพื่อมิตรภาพและความรื่นเริง"
 bp1_yearly.3001.d:0 ""ท่านพอจะแบ่งให้ข้าอีกสักหน่อยได้หรือไม่?""

 bp1_yearly.3002.t:0 "สหายผู้ต้องการความช่วยเหลือ"
 bp1_yearly.3002.desc:0 "ขณะที่ข้าไปเยี่ยม[ROOT.Char.Custom2('RelationToMe', SCOPE.sC('friend'))]ของข้า, [friend.GetTitledFirstNameNoTooltip], ข้าสังเกตเห็นว่าสิ่งต่างๆ แตกต่างไปจากครั้งสุดท้ายที่ข้ามาที่นี่ใน[friend.GetCapitalLocation.GetTitle.GetNameNoTierNoTooltip]อย่างมาก\n\n[friend.GetSheHe|U]เคยจัดเตรียม[friend.Custom('GetExpensiveDrink')]และ[friend.Custom('GetExpensiveDessert')]ให้เราเสมอเมื่อข้ามาเยี่ยม แต่ในวันนี้แทบไม่มีเศษอาหารให้เห็นเลยและมีเพียงน้ำเปล่าเท่านั้นที่วางอยู่บนโต๊ะ\n\nข้าถาม[friend.GetFirstNameNoTooltip]ว่า[friend.GetSheHe]กำลังตกอยู่ในช่วงเวลาที่ยากลำบากหรือไม่ [friend.GetSheHe]ตอบอย่างเศร้าสร้อยและหดหู่ว่า: "ท่านยังไม่รู้แม้ แต่ครึ่งหนึ่งของเรื่องราวเลย...""
 bp1_yearly.3002.a:0 "ข้าควรช่วยเท่าที่ข้าสามารถทำได้"
 bp1_yearly.3002.b:0 ""เอ่อ ข้าควรจะไปได้แล้ว...""
 bp1_yearly.3002.b.tt:0 "ท่านเพิกเฉยต่อ[ROOT.Char.Custom2('RelationToMe', SCOPE.sC('friend'))]ของท่านในยามที่[friend.GetHerHis]ต้องการความช่วยเหลือ"
 bp1_yearly.3002.c:0 "ค่ำคืนแห่งความรื่นเริงจะช่วย[friend.GetHerHim]ได้อย่างน่าอัศจรรย์!"
 bp1_yearly.3002.c.tt:0 "ท่านและ [friend.GetFirstNameNoTooltip] เข้าร่วมในค่ำคืนแห่งการเสเพล"
 bp1_yearly.3002.d:0 "ขอดูบัญชีของท่านหน่อย..."
 bp1_yearly.3002.d.tt:0 "บันทึกทางการเงินถูกเรียกมาเพื่อการตรวจสอบของท่าน"

 bp1_yearly.3003.desc:0 "ข้าเริ่มตรวจสอบค่าใช้จ่ายล่าสุดของ[ROOT.Char.Custom2('RelationToMe', SCOPE.sC('friend'))] [friend.GetFirstNamePossessiveNoTooltip] พยายามอย่างสุดความสามารถเพื่อดูว่าสิ่งใดที่อาจนำ[friend.GetHerHim]ไปสู่สถานการณ์ที่เลวร้าย เช่นนี้ได้ ข้าพบปัญหาทันที:\n\nทหารประจำการ: -1.8\nสิ่งอำนวยความสะดวกใน[friend.Custom('GetCourt')]: -3.2\n$court_physician_court_position$ใหม่: -50\n#difficulty_hard เทียน: -360 #!\nของขวัญสำหรับ[friend.Custom('GetCourtierPlural')|U]: -15\n\n"เทียนรึ? ท่านเป็นหนี้ เพราะ#EMPเทียนเนี่ยนะ?!#!"\n\n[friend.GetSheHe|U]ตอบอย่างเขินอายว่า "[ROOT.Char.Custom2('RelationToMe', SCOPE.sC('friend'))]ของข้า ท่านช่างหลักแหลมในเรื่องการคลัง โปรดช่วยข้าด้วย!""
 bp1_yearly.3003.a:0 ""ข้าจะช่วยท่าน แต่เพียงครั้งนี้เท่านั้น...""
 bp1_yearly.3003.b:0 ""ใช้จ่ายเรื่องเทียนให้น้อยลง""
 
 bp1_yearly.3004.t:0 "เสียงประหลาด"
 bp1_yearly.3004.desc:0 "ข้ากลับมาถึง[ROOT.Char.Custom('FortifiedBuilding')]ของข้าหลังจากการเดินอันยาวนานและเปล่าเปลี่ยว อีกปีที่ผ่านไป อีกปีที่แก่ขึ้น...\n\nข้าเกิดในวันนี้เมื่อ [ROOT.Char.GetAge] ปีก่อน ยิ่งข้าแก่ตัวลง ข้าก็ยิ่งทะนุถนอมความสัมพันธ์ที่ข้าได้สร้างขึ้นมาตลอดหลายปี... "
 bp1_yearly.3004.spouse:0 "ดังนั้นจึงเป็นเรื่องน่าเศร้าที่ข้าไม่ได้รับการติดต่อจาก[ROOT.Char.Custom2('RelationToMe', ROOT.Char.GetPrimarySpouse)]ของข้า, [ROOT.Char.GetPrimarySpouse.GetFirstName], หรือสหายคนใดของข้าเลยในวันนี้\n\n"
 bp1_yearly.3004.friends:0 "ดังนั้นจึงเป็นเรื่องน่าเศร้าที่ข้าไม่ได้รับการติดต่อจาก[friend1.GetTitledFirstName], [friend2.GetTitledFirstName], หรือสหายคนอื่นๆ ของข้าเลยในวันนี้\n\n"
 bp1_yearly.3004.end:0 "ข้าเดินอย่างเหนื่อยอ่อนไปยังห้องส่วนตัว ความเหงาถ่วงเท้าอันเกียจคร้านของข้า เมื่อข้าได้ยินเสียง#EMPดังแคร๊ง#!และเสียงกระซิบแผ่วเบาจากปลายโถงทางเดิน"
 bp1_yearly.3004.a:0 ""นั่นอาจเป็นอะไรในเวลานี้?""
 bp1_yearly.3004.b:0 ""ทางหนีที่เร็วที่สุดคืออะไร? โรยตัวลงจากหน้าต่าง!""

 bp1_yearly.3005.t:0 "สุขสันต์วันเกิด!"
 bp1_yearly.3005.desc:1 "ช่างน่าประหลาดใจ! สหายที่ใกล้ชิดและเป็นที่รักที่สุดของข้าทุกคนมารวมตัวกันเพื่ออวยพรให้ข้าโชคดีเมื่อข้าเริ่มต้นปีต่อไปของชีวิต มีแม้กระทั่งโต๊ะทั้งตัวที่เต็มไปด้วย[ROOT.Char.Custom('GetExpensiveDessert')], #EMPของโปรดของข้า!#! ข้าคิดไปแล้วว่าทุกคนลืมข้าไปเสียแล้ว\n\nข้าไม่อยากจะเชื่อเลยว่า [party_host.GetFirstName] จะลำบากจัดการเรื่องนี้อย่างลับๆ ข้าไม่รู้เลยว่ามีการวางแผนเซอร์ไพรส์ที่รอบคอบ เช่นนี้อยู่\n\nสหายของข้า [friend2.GetFirstName] เข้ามาหาข้า พยายามแบกห่อของขวัญที่ห่ออย่างสวยงามสามห่อ [friend2.GetSheHe]ผู้ขี้เล่นเสมอ กล่าวว่า "ข้ามีของขวัญสามชิ้นให้เลือกที่นี่ ชิ้นหนึ่งจะเป็นของท่าน แต่จะเป็นชิ้นไหนกัน?""
 bp1_yearly.3005.a:0 ""ข้าจะเอาชิ้นใหญ่ที่สุด!""
 bp1_yearly.3005.b:0 ""ชิ้นขนาดกลางจะสมบูรณ์แบบ""
 bp1_yearly.3005.c:0 ""ของดีมักมาในห่อเล็กๆ""
 bp1_yearly.3005.a.tt:0 "ท่านได้รับของขวัญชิ้นใหญ่"
 bp1_yearly.3005.b.tt:0 "ท่านได้รับของขวัญขนาดกลาง"
 bp1_yearly.3005.c.tt:0 "ท่านได้รับของขวัญชิ้นเล็ก"
 bp1_yearly.3005.t.gift:0 "ได้รับของขวัญวันเกิด"
 bp1_yearly.3005.opinion.tt:0 "ท่านได้รับ #P 30#! [opinion|E] จาก[friend|E]ทุกคน"

 bp1_yearly.3006.t:0 "รำลึกถึงวันเกิดในอดีต"
 bp1_yearly.3006.desc:0 "เมื่อข้ามีอายุมากขึ้นอีกปีในวันนี้ ข้าก็นึกถึงงานเลี้ยงวันเกิดอันงดงามที่สหายของข้า [friend1.GetFirstName] และ [friend2.GetFirstName] จัดให้ข้าเมื่อหลายปีก่อน ช่างเป็นความสุขที่ได้สัมผัสถึงความเมตตาและความอบอุ่นของมิตรภาพของเราที่แสดงออกมาอย่างชัดเจน!\n\n"
 bp1_yearly.3006.desc.friend1_dead:0 "[friend1.GetFirstName]ได้จากไปแล้วและข้าเสียใจกับการสูญเสียสหายผู้ยิ่งใหญ่ เช่นนี้ [friend1.GetSheHe|U]อยู่เคียงข้างข้าทั้งในยามทุกข์และสุข ไม่เคยล้มเหลวที่จะนำรอยยิ้มมาสู่ใบหน้าของข้าในยามเศร้า\n\n"
 bp1_yearly.3006.desc.friend2_dead:0 "[friend2.GetFirstNameNoTooltip]ได้จากไปแล้วและข้าเสียใจกับการสูญเสียสหายผู้ยิ่งใหญ่ เช่นนี้ [friend2.GetSheHe|U]อยู่เคียงข้างข้าทั้งในยามสุขและยามทุกข์ ไม่เคยล้มเหลวที่จะนำรอยยิ้มมาสู่ใบหน้าของข้าในยามเศร้า แม้ว่า[friend2.GetFirstNameNoTooltip]จะจากไปแล้ว ข้าก็ยังคงทะนุถนอมความทรงจำที่ข้ามีต่อ[friend2.GetHerHim]\n\n"
 bp1_yearly.3006.desc.artifact_positive:0 "ข้าจำได้ราวกับว่ามันเพิ่งเกิดขึ้นเมื่อวาน: เราเลี้ยงฉลองและเต้นรำ และพวกเขายังมอบของขวัญอันยอดเยี่ยมให้ข้าอีกด้วย!\n\n"
 bp1_yearly.3006.desc.artifact_negative:0 "ข้าจำได้ราวกับว่ามันเพิ่งเกิดขึ้นเมื่อวาน: เราเลี้ยงฉลองและเต้นรำ และพวกเขายังมอบของขวัญให้ข้าด้วย นั่นเป็นก่อนที่ทุกอย่างจะเลวร้ายลงระหว่างเรา อย่างไรก็ตาม บัดนี้ความทรงจำของข้าแปดเปื้อนไปด้วยการทรยศของ[friend2.GetFirstNamePossessive]\n\n"
 bp1_yearly.3006.desc.artifact_exists:0 "ข้าคิดว่าข้ายังคงมี[old_bday_gift.GetName]ของข้าเก็บไว้อยู่ที่ไหนสักแห่ง.."
 bp1_yearly.3006.a:0 "ช่างหอมหวานที่ได้รำลึกถึงวันเก่าๆ"
 bp1_yearly.3006.b:0 "ข้าจะไม่มีวันลืมท่าน สหายของข้า"
 bp1_yearly.3006.c:0 "เผาสิ่งนั้นทิ้งเสียและให้ข้าลืมเจ้าคนสารเลวนั่น!"
 bp1_yearly.3006.d:0 "สาปแช่งมัน ข้าหวังว่ามันจะเน่าเปื่อยในนรก"

 bp1_yearly.3007.t:0 "งานฝีมือของครอบครัว"
 bp1_yearly.3007.desc:0 "ข้าเพิ่งเสร็จสิ้นภารกิจประจำวันใน[ROOT.Char.Custom('GetChamber')]ของข้า เมื่อ[ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('spouse'))]ของข้า [spouse.GetTitledFirstName] เดินทอดน่องเข้ามาพร้อมกับ[spouse.Custom2('RelationToMeShort',SCOPE.sC('inspired_family_member'))]ของ[spouse.GetHerHis] [inspired_family_member.GetFirstName] ที่ตามติดส้นเท้าของ[spouse.GetHerHis]อย่างกระตือรือร้น ข้าวางบัญชีที่เพิ่งอ่านลง รู้ดีว่าไม่มีอะไรดีๆ เกิดขึ้นจากการมาเยือนที่ไม่คาดคิดนี้\n\n"
 bp1_yearly.3007.desc.tapestry:0 "[spouse.GetFirstNameNoTooltip]กล่าวถึงเครื่องเรือนใน[ROOT.Char.Custom('GetRoom')]อย่างลังเล\n"กำแพงโล่งๆ เหล่านี้ไม่ ทำให้ท่านรู้สึกบ้าไปบ้างหรือ? ข้ารู้ดีว่า[ROOT.Char.Custom('GetRoom')]นี้ต้องการอะไร: #EMPพรมแขวนผนัง!#!"\n\n"[spouse.Custom2('RelationToMeShort',SCOPE.sC('inspired_family_member'))]ของข้า#EMPยอดเยี่ยม#!เรื่องเข็มและด้าย "
 bp1_yearly.3007.desc.regalia:0 "[spouse.GetFirstNameNoTooltip]กล่าวถึงรูปลักษณ์ของข้าอย่างลังเล\n"[spouse.Custom2('RelationToMeShort', ROOT.Char)]ของข้า ท่านคือ[ROOT.GetCharacter.GetTitleAsNameNoTooltip|l]ผู้ยิ่งใหญ่และทรงพลัง แต่บางคนยังไม่ให้ความเคารพที่ท่านสมควรได้รับ ท่านต้องการบางสิ่งเพื่อแสดงอำนาจของท่าน!"\n\n"[spouse.Custom2('RelationToMeShort',SCOPE.sC('inspired_family_member'))]ของข้าสามารถตีเครื่องราชกกุธภัณฑ์#EMPชั้นดี#!ที่จะสะท้อนสถานะของท่านได้ "
 bp1_yearly.3007.desc.conc:0 "สนับสนุน[inspired_family_member.GetHerHim]แล้วดูว่าผลงานสร้างสรรค์ของ[inspired_family_member.GetHerHis]จะ ทำให้อารมณ์ของท่านดีขึ้นได้อย่างไร!""
 bp1_yearly.3007.a.tapestry:0 ""ข้าก็คิด เช่นเดียวกัน! มันน่ากลัวในนี้!""
 bp1_yearly.3007.a.regalia:0 ""ถึงเวลาแล้วที่ข้าจะได้รับความเคารพ!""
 bp1_yearly.3007.b:0 ""เราไม่มีเงินสักเพนนีที่จะใช้จ่ายกับความฟุ่มเฟือย เช่นนี้...""

 bp1_yearly.3100.t:0 "ข้าราชสำนักระหว่างสหาย"
 bp1_yearly.3100.desc:0 "[ROOT.Char.Custom2('RelationToMe', SCOPE.sC('3100_courtier_liege'))]ของข้า [3100_courtier_liege.GetTitledFirstName] ให้เกียรติมาเยี่ยมข้าและได้นำ[3100_courtier_liege.Custom('GetCourtierPlural')]คนหนึ่งของ[3100_courtier_liege.GetHerHis]มาด้วย [3100_courtier_liege.GetFirstNameNoTooltip] เข้ามาหาข้าอย่างตื่นเต้น:\n\n"ยินดีที่ได้พบ, [ROOT.Char.GetTitledFirstNameNoTooltip]! ข้ายินดีที่เห็นท่านเจริญรุ่งเรืองที่นี่ใน[ROOT.Char.GetCapitalLocation.GetName] ข้าคิดว่า [3100_target_courtier.GetFirstName] ที่นี่อาจมีประโยชน์ใน[ROOT.Char.Custom('GetCourt')]ของท่าน "
 bp1_yearly.3100.desc.diplomacy:0 "[3100_target_courtier.GetSheHe|U]เป็นนักการทูตที่มีพรสวรรค์อย่างเหลือเชื่อ — พูดจาคมคายหาตัวจับยาก! "
 bp1_yearly.3100.desc.intrigue:0 "[3100_target_courtier.GetSheHe|U]มีสายอิทธิพลมากมายและวิธีการจัดการเรื่องต่างๆ... #EMPอย่างเงียบๆ#! "
 bp1_yearly.3100.desc.martial:0 "[3100_target_courtier.GetSheHe|U]เป็นนักยุทธศาสตร์ที่มีพรสวรรค์อย่างเหลือเชื่อ! จิตใจของ[3100_target_courtier.GetHerHis|U]หมุนวนคิดกลยุทธ์ที่เป็นไปได้อยู่เสมอ "
 bp1_yearly.3100.desc.stewardship:0 "[3100_target_courtier.GetSheHe|U]เป็นผู้ดูแลที่มีพรสวรรค์อย่างเหลือเชื่อ — ราวกับได้รับการสัมผัสจากไมดาส! "
 bp1_yearly.3100.desc.learning:0 "[3100_target_courtier.GetSheHe|U]เป็นนักวิชาการที่มีพรสวรรค์อย่างเหลือเชื่อ — ผู้ที่ฉลาดที่สุดเท่าที่ข้าเคยเรียนรู้มา! "
 bp1_yearly.3100.desc.prowess:0 "[3100_target_courtier.GetSheHe|U]แข็งแกร่งดุจหมีและทรงพลังยิ่งกว่า! "
 bp1_yearly.3100.desc.conc:0 "ข้าอยากจะใช้ประโยชน์จาก[3100_target_courtier.GetHerHim]ด้วยตนเอง แต่โชคไม่ดีที่ดูเหมือนจะเป็นไปไม่ได้\n\nข้าไม่อยากเห็นพรสวรรค์อันยิ่งใหญ่ของ[3100_target_courtier.GetHerHis]ต้องสูญเปล่า ท่านจะไม่รับ[3100_target_courtier.GetHerHim]ไว้และปลดปล่อยศักยภาพของ[3100_target_courtier.GetHerHis]หรือ?""
 bp1_yearly.3100.a:0 "ข้ารู้ที่ที่เหมาะสมสำหรับ[3100_target_courtier.GetHerHim]แล้ว!"
 bp1_yearly.3100.b:0 "ข้าต้องขอปฏิเสธอย่างสุภาพ"
 bp1_yearly_3100_courtier_gained:0 "รับสมัคร[ROOT.Char.Custom('GetCourtier')]ผู้มีทักษะแล้ว"

 bp1_yearly.3101.t:0 "เคาน์ตีระหว่างสหาย"
 bp1_yearly.3101.desc:0 "[target_title_holder.GetTitledFirstName] มาหาข้าพร้อมข้อเสนออันยิ่งใหญ่ [target_title_holder.GetSheHe|U] รู้ว่าข้ามีสิทธิ์อันชอบธรรมใน [target_title.GetName] และได้เลือกที่จะยอมรับมันในที่สุด\n\n"สหายของข้า" เขากล่าว "ข้าปรารถนาอย่างยิ่งที่จะมอบ [target_title.GetNameNoTierNoTooltip] ให้แก่ท่าน เพราะมันเป็นของท่าน อย่างไรก็ตาม ข้าไม่สามารถทำ เช่นนั้นได้หากไม่ได้รับสิ่งตอบแทน มิฉะนั้นข้าจะกลับไปหาประชาชนของข้ามือเปล่า"\n\n"มอบบางสิ่งให้ข้าเพื่อแสดงต่อประชาชนของข้าเมื่อข้ากลับไปยัง [target_title_holder.GetCapitalLocation.GetName] และ [target_title.GetNameNoTierNoTooltip] จะเป็นของท่าน""
 bp1_yearly.3101.a:0 ""ข้ายอมรับด้วยความยินดี! นี่น่าจะเพียงพอ...""
 bp1_yearly.3101.b:0 ""ข้าไม่อาจยอมรับ[target_title.GetNameNoTierNoTooltip]ด้วยวิธีนี้ได้""

 bp1_yearly.3201.opening:0 "[host.Custom2('AppropriateGreeting', ROOT.Char)]"
 bp1_yearly.3201.desc:0 "ข้าขอเชิญท่านมาร่วมงานเลี้ยงที่ราชสำนักของข้าใน[host.GetCapitalLocation.GetTitle.GetNameNoTier]! มันจะเป็นงานที่ยิ่งใหญ่ พร้อมด้วยอาหารเลิศรสและความบันเทิง"

 bp1_yearly.3202.t:0 "งานเลี้ยงของคนโง่"
 bp1_yearly.3202.desc:0 "ข้าเดินเข้าไปใน[host.Custom( 'FortifiedBuilding' )]ของ[host.GetTitledFirstNamePossessiveNoTooltip]โดยคาดหวังงานเลี้ยงอันยิ่งใหญ่และสนุกสนานตามคำเชิญที่ข้าได้รับ แต่กลับไม่มีใครเลย! หลังจากค้นหาสักพัก ข้าก็พบ[host.GetFirstNameNoTooltip]และ[ROOT.Char.Custom2('RelationToMe', SCOPE.sC('enemy'))]ของข้า [enemy.GetFirstNameNoTooltip] กำลังสนทนากันเรื่องอะไรก็ไม่รู้ที่[ROOT.GetCharacter.GetFaith.HighGodName]ทรงทราบ\n\n[host.GetFirstNameNoTooltip]ประหลาดใจกับการปรากฏตัวอย่างกะทันหันของข้า หันมาหาข้าและถามว่าเหตุใดข้าจึงมาโดยไม่ได้แจ้งล่วงหน้า\n\n"ข้าคิดว่า... ท่านเชิญข้ามางานเลี้ยงวันนี้... ?"\n\n[host.GetSheHe|U]อธิบายว่าข้าเข้าใจผิดและเริ่มสั่งสอนข้าเกี่ยวกับมารยาทในราชสำนัก ในขณะเดียวกัน [enemy.GetFirstNameNoTooltip]ก็อดหัวเราะคิกคักกับ[enemy.GetHerselfHimself]ไม่ได้ขณะที่ข้าถูก ทำให้ขายหน้าอย่างที่สุดโดย[ROOT.Char.Custom2('RelationToMe', SCOPE.sC('host'))]ของข้า"
 bp1_yearly.3202.a:0 ""ขออภัย [host.GetTitledFirstNameNoTooltip]...""
 bp1_yearly.3202.a.liege:0 ""ขออภัย [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('host'))]ของข้า...""
 bp1_yearly.3202.b:0 ""ท่านต้องเชื่อว่า [enemy.GetFirstNameNoTooltip] วางแผนใส่ร้ายข้า!""
 bp1_yearly.3202.b.success:0 "ท่านโน้มน้าว [host.GetTitledFirstNameNoTooltip] ถึงการกระทำผิดของ[enemy.GetFirstNamePossessiveNoTooltip]ได้สำเร็จ"
 bp1_yearly.3202.b.failure:0 "ท่านโน้มน้าว [host.GetTitledFirstNameNoTooltip] ถึงการกระทำผิดของ[enemy.GetFirstNamePossessiveNoTooltip]ไม่สำเร็จ"
 bp1_yearly.3202.c:0 ""ถึงเวลาแล้วที่เราจะหยุดเล่นเกมเหล่านี้เสียที, [enemy.GetFirstNameNoTooltip]""
 bp1_yearly.3202.c.tt:0 "#V ประลองฝีมือ#!กับ [enemy.GetFirstName]\n#weak การประลองนี้ไม่ถึงตาย แม้ว่าอาจถึงแก่ชีวิตได้ก็ตาม#!\nหากท่านชนะ ความจริงของสิ่งที่เกิดขึ้นที่นี่จะถูกเปิดเผย หากท่านแพ้ [enemy.GetFirstNameNoTooltip] จะเอาชนะท่านได้อย่างแท้จริง\n\n[prowess|E]ของท่าน: [prowess_i]#V [root_for_loc.GetProwess]#!\n[prowess|E]ของ[enemy.GetFirstNamePossessive]: [prowess_i]#V [enemy.GetProwess]#!"
 bp1_yearly.3203.sc_result_won:0 "ท่านชนะในการประลองกับ [sc_loser.GetTitledFirstNameNoTooltip]"
 bp1_yearly.3203.sc_result_lost:1 "ท่านแพ้ในการประลองกับ [sc_victor.GetTitledFirstNameNoTooltip]"
 bp1_yearly.3204.sc_invalid:0 "การประลองของท่านกับ [enemy.GetTitledFirstNameNoTooltip] ถูก ทำให้เป็นโมฆะ"

 bp1_yearly.3300.t:0 "ใคร่ครวญถึง[ROOT.Char.GetFaith.HighGodName]"
 bp1_yearly.3300.desc:0 "ขณะที่ข้านั่งทำสมาธิและใคร่ครวญถึงประเด็นปลีกย่อยของ[ROOT.Char.GetFaith.GetName] ข้าอดไม่ได้ที่จะนึกย้อนไปถึงเมื่อครั้ง[pilgrimage_memory.GetDescription] การเดินทางครั้งนี้ห่างไกลจากความสะดวกสบายในชีวิตประจำวันของข้าในฐานะ[ROOT.Char.GetTitleAsNameNoTooltip|l] แต่ความโล่งใจที่ข้ารู้สึกเมื่อไปถึง[pilgrimage_destination.GetName] ทำให้ความลำบากทั้งหมดนั้นคุ้มค่า"
 bp1_yearly.3300.a:0 "ข้าเชื่อว่าข้าจะรู้สึกใกล้ชิดกับ[ROOT.Char.GetFaith.HighGodName]ตลอดไป"

 bp1_yearly.3301.desc:0 "ขณะที่ข้านั่งทำสมาธิและใคร่ครวญถึงประเด็นปลีกย่อยของ[ROOT.Char.GetFaith.GetName] ข้าอดไม่ได้ที่จะนึกย้อนไปถึงเมื่อครั้ง[pilgrimage_memory.GetDescription] การเดินทางครั้งนี้ห่างไกลจากความสะดวกสบายในชีวิตประจำวันของข้าในฐานะ[ROOT.Char.GetTitleAsNameNoTooltip|l] แต่ความโล่งใจที่ข้ารู้สึกเมื่อไปถึง[pilgrimage_destination.GetName] ทำให้ความลำบากทั้งหมดนั้นคุ้มค่า\n\nการได้ใกล้ชิดกับ[pilgrimage_friend.GetFirstName]มากขึ้นเป็นประโยชน์เพิ่มเติมอย่างแน่นอน เรามีความสุขกับช่วงเวลาดีๆ ร่วมกันในการจาริกแสวงบุญครั้งนั้นอย่างแท้จริง"
 bp1_yearly.3301.a:0 "ข้าจะรู้สึกใกล้ชิดกับทั้ง[ROOT.Char.GetFaith.HighGodName]และ[pilgrimage_friend.GetFirstNameNoTooltip]ตลอดไป"
