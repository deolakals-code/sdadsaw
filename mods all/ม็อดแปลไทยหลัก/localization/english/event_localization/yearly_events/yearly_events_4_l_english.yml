l_english: 
 yearly.4001.opening:0 "[neighboring_ruler.Custom2('AppropriateGreeting', ROOT.Char)]"
 yearly.4001.desc:0 "[vassal.Custom2('YourCharacterIntroduction', ROOT.Char)|U], "
 yearly.4001.desc_opinion:0 "ได้สบประมาทข้าอย่างร้ายแรง [vassal.GetSheHe|U] ช่างกล้าบังอาจเรียกข้าว่า [neighboring_ruler.Custom2('InsultAdjectiveArticle', SCOPE.sC('vassal'))] [neighboring_ruler.Custom2('InsultNoun', SCOPE.sC('vassal'))] ต่อหน้าธารกำนัลในราชสำนักของข้า"
 yearly.4001.desc_lover:0 "บังอาจชักนำ [neighboring_ruler.Custom2('RelationToMeShort', SCOPE.sC('neighboring_ruler_secondary'))] ของข้า [neighboring_ruler_secondary.GetTitledFirstName] ให้ประกอบบาปทางเนื้อหนัง"
 yearly.4001.desc_murder:0 "ได้สังหาร [neighboring_ruler.Custom2('RelationToMeShort', SCOPE.sC('neighboring_ruler_secondary'))] ของข้า [neighboring_ruler_secondary.GetTitledFirstName] ในการวิวาทอันมิชอบ"
 yearly.4001.desc_rival:1 "ข้าไม่ควรคาดหวังสิ่งที่ดีกว่านี้จากผู้ที่ข้องเกี่ยวกับ #EMP ท่าน#! แต่นี่เป็นเรื่องที่ยอมรับมิได้!"
 yearly.4001.desc_end:0 "ข้าต้องการการชดเชยสำหรับการดูหมิ่นครั้งนี้!"
 yearly.4001.a:0 "ไม่ว่าจะต้องทำสิ่งใด เพื่อให้เรื่องนี้คลี่คลาย!"
 yearly.4001.b:0 "[vassal.GetFirstNameNoTooltip] จักต้องขอขมาท่านต่อหน้าสาธารณชน"
 yearly.4001.c:0 "ฮ่า ช่างกล้านัก [vassal.GetFirstNameNoTooltip]!"

 yearly.4011.t:0 "สหายสนิทร่วมใจ"
 yearly.4011.desc:0 "ระยะหลังนี้ ข้าเห็น [heir.Custom2('MyCharacterIntroduction', ROOT.Char)] และ [vassal.Custom2('MyCharacterIntroduction', ROOT.Char)] อยู่แถว [ROOT.Char.Custom('ResidenceBuilding')] สนทนากันอย่างลึกซึ้งอยู่บ่อยครั้ง ดูเหมือนว่าทั้งสองเข้ากันได้ดีอย่างแท้จริง!"
 yearly.4011.a:0 "เมื่อเห็นมิตรภาพ เช่นนี้เติบโต... ข้าจะช่วยให้มันเบ่งบาน!"
 yearly.4011.b:0 "พวกเขาคงมิได้คิดการดีเป็นแน่ เรื่องนี้ต้องจบลงเดี๋ยวนี้"
 yearly.4011.c:0 "เอ่อ... พวกท่านกำลังสนทนาเรื่องใดกันหรือ?"
 yearly.4011.c.success:0 "การร่วมวงของข้าเป็นที่ชื่นชม"
 yearly.4011.c.toast.success:0 "การร่วมวงของข้าได้รับการชื่นชม"
 yearly.4011.c.failure:0 "ข้ากลับดูเป็นคนสอดรู้สอดเห็น"
 yearly.4011.c.toast.failure:0 "ข้ากลับดูเป็นคนสอดรู้สอดเห็น"

 yearly.4021.t:0 "การเล่นรุนแรง"
 yearly.4021.desc:0 "โอ้ อนิจจา! การเล่นร่วมกันระหว่าง [child.Custom2('MyCharacterIntroduction', ROOT.Char)] และ [vassal.Custom2('RelationToMeShort', SCOPE.sC('vassal_kid'))] ของ [vassal.GetTitledFirstNamePossessive] [vassal_kid.GetTitledFirstName] ต้องจบลงอย่างกะทันหัน เมื่อ [vassal_kid.GetFirstNameNoTooltip] สิ้นใจในอุบัติเหตุอันน่าสยดสยอง!\n\n"ข้าสาบาน [child.Custom2('RelationToMeShort', ROOT.Char)] มันเป็นเพียงการเล่นเท่านั้น!" [child.GetTitledFirstNameNoTooltip] ยืนยันกับข้า ขณะที่ [vassal.GetTitleAsNameNoTooltip] เรียกร้องความยุติธรรม"
 yearly.4021.a:0 "เจ้าจะแตะต้องบุตรของข้ามิได้!"
 yearly.4021.b:0 "ไม่มีผู้ใดหนีผลกรรมจากการกระทำของตนได้"
 yearly.4021.c:0 "ข้าสัญญาว่าจะอบรมสั่งสอน [child.GetHerHim]!"
 yearly.4021.c_success:0 "[child.GetTitledFirstNameNoTooltip] รับฟังและเรียนรู้"
 yearly.4021.c_failure:0 "[child.GetTitledFirstNameNoTooltip] เรียนรู้ว่าการกระทำของ [child.GetHerHis] ไม่ส่งผลใดๆ"
 yearly.4021.d:0 "ท่านต้องอภัยให้ [child.GetHerHim]! ได้โปรด ข้ายอมทำทุกอย่าง..."

 yearly.4022.t:0 "ผู้กลับมา"
 yearly.4022.desc:0 ""สวัสดี [child.Custom2('RelationToMeShort', ROOT.Char)]" [ROOT.Char.Custom2('MyCharacterIntroduction', SCOPE.sC('child'))] ดูซูบผอมไปบ้างหลังจากใช้เวลาอยู่ในคุกของ [actor.GetTitledFirstNamePossessive] แต่รอยยิ้มอัน [child.Custom('quirk_neg_adjective')] ที่ปรากฏบนใบหน้าของ [child.GetHerHis] ทำให้ [child.GetHerHim] ดูมีชีวิตชีวายิ่งกว่าเคย\n\n"ข้าแทบรอไม่ไหวที่จะขอบคุณท่านสำหรับบทเรียนที่ท่านสอนข้าเกี่ยวกับการชดใช้กรรม""
 yearly.4022.a:0 "ยินดีต้อนรับกลับบ้าน [child.GetFirstNameNoTooltip]"

 yearly.4031.t:0 "ฆาตกรในหมู่เรา"
 yearly.4031.desc_opening:0 "กลิ่นปะทะจมูกข้าก่อนที่ประตูจะเปิดออก กลิ่นคาวเลือดหนักอึ้งคละคลุ้งไปทั่วบริเวณ มันคือกลิ่นสาบของคนตายใหม่\n\n"
 yearly.4031.desc_physician:0 ""มีการฆาตกรรมอีกแล้ว [ROOT.Char.Custom('FormOfAddressForLiege')]" [physician.GetTitledFirstName] เช็ดมือที่เปื้อนเลือดของ[physician.GetHerHis]กับผ้ากันเปื้อน ขณะที่ [physician.GetSheHe] ลุกขึ้นยืนหลังจากตรวจดูศพ "เราต้องหยุดฆาตกรไร้สตินี่ให้ได้!""
 yearly.4031.desc:0 "มีผู้พบศพอีกแล้ว... โชคดีที่พวกเขาทั้งหมดเป็นเพียงคนไม่สำคัญ ขอบคุณ [ROOT.Char.GetFaith.HighGodName] แต่คนในราชสำนักเริ่มหวาดวิตกแล้ว"
 yearly.4031.a:0 "ข้าจะค้นหาฆาตกรผู้นี้ให้ทั่ว [ROOT.Char.Custom('ResidenceBuilding')]!"
 yearly.4031.tt:0 "การสืบสวนได้เริ่มขึ้นแล้ว"
 yearly.4031.b:0 "จงนำศพไปฝังเสีย แล้วลืมเรื่องน่าอดสูนี้ไป"
 yearly.4031.b_every_courtier:0 "ข้าราชสำนักทุกคน"
 yearly.4031.c:0 "ในฐานะแพทย์หลวงของข้า ท่านควรศึกษาศพเหล่านี้"

 yearly.4061.t:0 "คนเขลาผู้ปราดเปรื่อง"
 yearly.4061.desc_opening:0 ""ข้านามว่า [hodja.GetTitledFirstName] [ROOT.Char.Custom('FormOfAddressForLiege')] ข้ามาเข้าเฝ้าท่านเพื่อเสนอสติปัญญาของข้า"\n\n"
 yearly.4061.desc_guard:0 "[guard.Custom2('MyCharacterIntroduction', ROOT.Char)|U] ผู้ ซึ่งนำชายผู้นี้มาต่อหน้าข้า ดูมีท่าทีกังขา"
 yearly.4061.desc:0 "ทหารยามที่นำชายผู้นี้มาต่อหน้าข้า ดูมีท่าทีกังขา"
 yearly.4061.desc_ending:0 ""เขาเข้าใกล้ [ROOT.Char.Custom('ResidenceBuilding')] โดยขี่ลามา [ROOT.Char.Custom('FormOfAddressForLiege')] แบบหันหลัง""
 yearly.4061.a:0 "ได้โปรด แบ่งปันปัญญาของท่านแก่ข้า"
 yearly.4061.a_success:0 "ท่านได้รับข้อมูลเชิงลึกบางอย่าง"
 yearly.4061.a_failure:0 "เรื่องราวของเขามี แต่จะ ทำให้ท่านสับสน"
 yearly.4061.b:0 "ขอให้ความรู้ของท่านอำนวยพรแก่ราชสำนักทั้งปวง!"
 yearly.4061.c:0 "ข้าไม่มีเวลาให้คนเขลา"
 yearly.4061.c.tt:0 "ท่านไล่ชายผู้นั้นไป"
 yearly.4061.d:0 "น่าขบขัน! ให้เขาไปสร้างความบันเทิงแก่ฝูงชน เช่นกัน"
 yearly.4061.d.tt:0 "แห่ประจานเขาไปตามถนนในฐานะคนเขลา"

 yearly.4071.t:0 "การแสวงหาความรู้"
 yearly.4071.desc:0 "[councillor.Custom2('MyCharacterIntroduction', ROOT.Char)|U] เข้ามาหาข้าพร้อมหนังสือกองหนึ่งในอ้อมแขนของ [councillor.GetHerHis]\n\n"ข้าสังเกตเห็นความกระหายความรู้ของท่าน [councillor.Custom2('RelationToMe', ROOT.Char)] ของข้า"
 yearly.4071.desc_focus:0 "โดยเฉพาะอย่างยิ่งการที่ท่านเพิ่งศึกษาเรื่องที่เกี่ยวข้องกับ [ROOT.Char.Custom('LifestyleFocus')]!"
 yearly.4071.desc_no_focus:0 "ยังไม่นับรวมการศึกษาเรื่อง [ROOT.Char.Custom('education_conversation_subject')] ก่อนหน้านี้ของท่าน!"
 yearly.4071.desc_ending:0 "บางทีหนังสือเหล่านี้อาจเป็นที่สนใจของท่าน?""
 yearly.4071.a:0 "ข้าจะศึกษามันทั้งหมด ในนามแห่ง [ROOT.Char.GetFaith.ReligiousText]!"
 yearly.4071.b:0 "จงแจกจ่ายหนังสือเหล่านี้ในหมู่ [ROOT.Char.Custom('GetCourtierPlural')] ของข้า"

 yearly.4081.t:0 "การแปล"
 yearly.4081.desc:0 ""เหล่านักปราชญ์ท้องถิ่นต้องการผู้อุปถัมภ์ในความพยายามแปลตำราจากภาษากรีกเป็นภาษาอาหรับ [ROOT.Char.Custom('FormOfAddressForLiege')] – ความพยายามที่จะเป็นประโยชน์ต่อโลกอาหรับทั้งมวล!"\n\n[councillor.Custom2('MyCharacterIntroduction', ROOT.Char)|U] ได้นำรายชื่อนักปราชญ์ที่ข้าสามารถอุปถัมภ์ได้มาให้ พร้อมด้วยตำราที่พวกเขากำลังแปลอยู่"
 yearly.4081.a:0 "#EMP เด มาเตริอา เมดิกา#!... ฟังดูน่าสนใจ!"
 yearly.4081.a.tt:0 "ท่านอุปถัมภ์การแปลตำราทางการแพทย์"
 yearly.4081.b:0 "โอ้ เล่มนี้! #EMP ออน อัสเซนชันส์#!."
 yearly.4081.b.tt:0 "ท่านอุปถัมภ์การแปลตำราทางดาราศาสตร์"
 yearly.4081.c:0 "#EMP เอเลเมนส์#! ฟังดูคุ้มค่าที่สุด"
 yearly.4081.c.tt:0 "ท่านอุปถัมภ์การแปลตำราทางคณิตศาสตร์"
 yearly.4081.d:0 "ข้ามีเรื่องอื่นที่ควรใช้จ่ายเงินมากกว่านี้"
 yearly.4081.d.tt:0 "ท่านไม่ได้อุปถัมภ์นักปราชญ์คนใด"
 yearly.4081.toast:0 "ตำราได้รับการแปลแล้ว"
 yearly.4081.e:0 "#EMP ออน เดอะ โซล#!? น่าทึ่ง..."
 yearly.4081.e.tt:0 "ท่านอุปถัมภ์การแปลตำราเกี่ยวกับแรงจูงใจ"
 yearly.4081.f:0 "นี่คืออะไร... #EMP ทิวซิดิดีส#!?"
 yearly.4081.f.tt:0 "ท่านอุปถัมภ์การแปลตำราเกี่ยวกับประวัติศาสตร์การทหาร"
 yearly.4081.g:0 "#EMP พลูทาร์ก#! เล่มนี้น่าสนใจสำหรับข้า"
 yearly.4081.g.tt:0 "ท่านอุปถัมภ์การแปลตำราชีวประวัติ"
 yearly.4081.tt:0 "ท่านจะได้รับตำรา"

 yearly.4091.t:0 "นักปราชญ์แห่งแบกแดด"
 yearly.4091.desc_opening:0 "[ward.Custom2('MyCharacterIntroduction', ROOT.Char)|U] และข้ากำลังเดินเล่นอยู่ในแบกแดดเมื่อเราพบกับ"
 yearly.4091.desc_house:0 "บัยตุลฮิกมะฮ์"
 yearly.4091.desc_no_house:0 "นักปราชญ์ท้องถิ่นบางคน"
 yearly.4091.desc:0 "\n\n"ขอคารวะ [ROOT.Char.GetTitledFirstNameNoTooltip] ขอคารวะ ท่านผู้เยาว์ [ward.GetLadyLord] มีที่นั่งว่างในการสนทนาที่กำลังดำเนินอยู่ ท่านใดท่านหนึ่งสนใจเข้าร่วมหรือไม่?""
 yearly.4091.a:0 "เชิญเลย [ward.GetFirstNameNoTooltip]"
 yearly.4091.a.tt:0 "นี่จะเป็นการส่งเสริมการศึกษาของ [ward.GetFirstNamePossessiveNoTooltip]"
 yearly.4091.b:0 "ข้าประสงค์จะเข้าร่วม ใช่"
