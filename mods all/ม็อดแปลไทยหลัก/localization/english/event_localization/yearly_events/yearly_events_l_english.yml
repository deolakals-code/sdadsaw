l_english: 
 yearly.0001.opening:0 "[mentor.Custom2('AppropriateGreeting', ROOT.Char)]"
 yearly.0001.desc.default:0 "เป็นเวลาหลายปีที่ทักษะของข้าในด้าน [ROOT.Char.Custom('YearlyEvent0001Skill')] ได้รับใช้ข้าเป็นอย่างดี และข้าตระหนักว่าความรู้นี้อาจเป็นประโยชน์ต่อท่าน เช่นกัน ข้ายินดีที่จะแบ่งปันสิ่งที่ข้ารู้"
 yearly.0001.desc.arrogant:0 "ดังที่ท่านคงสังเกตเห็นแล้วอย่างไม่ต้องสงสัย ข้ามีความเชี่ยวชาญอย่างยิ่งในเรื่อง [ROOT.Char.Custom('YearlyEvent0001Skill')] ข้ายินดีที่จะแบ่งปันความรู้ของข้าในหัวข้อเหล่านี้แก่ท่าน"
 yearly.0001.desc.councillor:0 "ในการรับใช้ในฐานะ [mentor.Custom('CouncilPosition')] ของท่าน ข้าได้เรียนรู้มากมายเกี่ยวกับ [ROOT.Char.Custom('YearlyEvent0001Skill')] ข้ายินดีที่จะสอนท่านในหัวข้อเหล่านี้"
 yearly.0001.desc.nofavor:0 "เพื่อที่จะได้รับความโปรดปรานจากท่าน"
 yearly.0001.desc.favor:0 "เพื่อตอบแทนความช่วยเหลือที่ท่านได้มอบให้แก่ข้าในอดีต"
 yearly.0001.desc.friend:0 "[ROOT.Char.Custom('YearlyEvent0001Skill')|U] เป็นจุดแข็งของข้ามาโดยตลอด และข้าปรารถนาที่จะแบ่งปันความเชี่ยวชาญของข้าในหัวข้อเหล่านี้กับท่าน หากท่านมีเวลาว่างสำหรับบทเรียนบ้าง ข้ายินดีที่จะสอนสิ่งที่ข้ารู้แก่ท่าน"
 yearly.0001.a:0 "ความช่วยเหลือของท่านเป็นที่ซาบซึ้งอย่างยิ่ง"
 yearly.0001.a.success:0 "ข้าจดจำบทเรียนของ [mentor.GetFirstNamePossessiveNoTooltip] ไว้ในใจ"
 yearly.0001.a.failure:0 "[mentor.GetFirstNameNoTooltip] ให้คำแนะนำแก่ข้าเกี่ยวกับสถานการณ์ปัจจุบันของข้า"
 yearly.0001.b:0 "เป็นข้อเสนอที่เอื้อเฟื้อยิ่ง แต่จะเป็นอย่างไรหากข้าช่วยท่านแทน?"
 yearly.0001.b.success:0 "[mentor.GetFirstNameNoTooltip] จดจำบทเรียนของข้าไว้ในใจ"
 yearly.0001.b.failure:0 "ข้าให้คำแนะนำแก่ [mentor.GetFirstNameNoTooltip] เกี่ยวกับสถานการณ์ปัจจุบันของ [mentor.GetHerHis]"
 yearly.0001.c:0 "เราทั้งคู่จะได้รับประโยชน์หากเรารวบรวมความรู้ของเราเข้าด้วยกัน!"
 yearly.0001.d:0 "ข้าสามารถจัดการได้ดีด้วยตนเอง"

 yearly.0002.t:0 "ที่ปรึกษาผู้ไม่รอบคอบ"
 yearly.0002.desc:0 "เนื่องจากได้รับใช้ข้าอย่างซื่อสัตย์ในฐานะ [ROOT.GetCharacter.Custom2('RelationToMeShort', SCOPE.sC('councillor') )] ของข้า ข้าจึงไว้วางใจให้ [councillor.GetTitledFirstName] สามารถเดินทางได้อย่างอิสระภายใน [ROOT.Char.Custom('GetCourt')] ของข้า\n\nอย่างไรก็ตาม บัดนี้ข้าได้ทราบว่า [councillor.GetSheHe] ได้ฉวยโอกาสจากการต้อนรับของข้าโดยประพฤติตนไม่เหมาะสมกับ [ROOT.GetCharacter.Custom2('RelationToMeShort', SCOPE.sC('child') )] ของข้า [child.GetFirstName]!"
 yearly.0002.a:0 "พวกเขาต้อง แต่งงานกันเพื่อลบล้างความผิดของพวกเขา"
 yearly.0002.c:0 "ข้าจะ ทำให้ [councillor.GetFirstNameNoTooltip] เน่าตายในคุกฐานที่ล่วงเกินข้า!"
 yearly.0002.d:0 "คงจะเป็นเรื่องน่าอับอายหากเรื่องนี้แพร่งพรายออกไป..."

 yearly.0003.t:0 "รักต้องห้าม"
 yearly.0003.start.desc:0 "ทีแรก ข้าคิดว่าเป็นเรื่องตลก — [ROOT.GetCharacter.Custom2('RelationToMeShort', SCOPE.sC('child'))] ของข้า [child.GetFirstName] และ [relative.Custom2('HerHisCharacterIntroductionNoComma', SCOPE.sC('child'))] จะเป็นชู้รักกันได้อย่างไร?! ทว่าจดหมายที่สายลับของข้าสกัดกั้นได้"
 yearly.0003.dislikes_incest.desc:0 "บรรยายถึงการพบปะที่ [child.GetWomanMan] ไม่ควรมีกับ [child.Custom2('RelationToMeShort', SCOPE.sC('relative'))] ของ [child.GetHerHis] เลย..."
 yearly.0003.likes_incest.desc:0 "ลงรายละเอียด #EMP อันน่าหลงใหล#! เกี่ยวกับความสัมพันธ์ทางเนื้อหนังของพวกเขา..."
 yearly.0003.b:0 "พยายามปกปิดความสัมพันธ์ลับของพวกเขา"
 yearly.0003.a:0 "โลกจะได้รู้ถึงอาชญากรรมของพวกเขาต่อ [ROOT.Char.GetFaith.PantheonTerm]!"
 yearly.0003.c:0 "จองจำพวกเขาฐาน ทำให้ตระกูล [ROOT.Char.GetHouse.GetNameNoTooltip] เสื่อมเสียชื่อเสียง!"
 yearly.0003.d:0 "เชิญพวกเขามาที่ [ROOT.Char.Custom('GetChamber')] ของข้าเพื่อ "เวลาของครอบครัว" สักหน่อย"

 yearly.0011.t:0 "พบดาวหาง!"
 yearly.0011.desc:0 "การปรากฏของดาวหางบนท้องฟ้า ทำให้มรรตัยทั้งหลายต้องหยุดชะงัก ปรากฏการณ์ประหลาดนี้หมายความว่ากระไรกันแน่ ที่โคจรข้ามฟากฟ้าของเราอย่างไม่คาดฝัน?\n\n[ROOT.Char.GetWomenMen] ผู้ปราดเปรื่องกว่าข้าใช้เวลาทั้งชีวิตครุ่นคิดเรื่องที่เล็กน้อยกว่านี้ แต่ชาวนาหัวสูงทุกคนใน [ROOT.Char.GetPrimaryTitle.GetNameNoTierNoTooltip] ดูเหมือนจะมีทฤษฎีที่คิดไม่รอบคอบเป็นของตนเอง..."
 yearly.0011.gain_stress:0 "ดาวหาง ทำให้ไพร่ฟ้าข้าแผ่นดินจำนวนนับไม่ถ้วนตื่นตระหนก"
 yearly.0011.lose_stress:0 "ดาวหาง ทำให้ผู้ก่อความวุ่นวายจำนวนมากหวาดกลัว"
 gain_rock_artifact_tt: "ท่านได้รับ $artifact_pedestal_rock_name$ [artifact|e]"
 yearly.0011.new_friends:0 "บางทีมันอาจนำพาสหายใหม่มา?"
 yearly.0011.lustful:0 "เร็วเข้า ใครสักคนกอดข้าให้แน่น!"
 yearly.0011.chaste:0 "พวกผิดประเวณีนำสิ่งนี้มาสู่เรา!"
 yearly.0011.gluttonous:0 "ความตายมาเยือน! จงเติมเสบียงให้เต็มคลัง!"
 yearly.0011.temperate:0 "นี่คือการพิพากษาสำหรับการฟุ่มเฟือยของเรา!"
 yearly.0011.greedy:1 "ข้าสงสัยว่าความมั่งคั่งแปลกประหลาดใดมาจากดาวหาง..."
 yearly.0011.generous:0 "สิ่งนี้ #EMP พิสูจน์#! ว่าเราทุกคนเห็นแก่ตัวเกินไป!"
 yearly.0011.lazy:0 "ช่างมันเถิด ข้าจะกลับไปนอน"
 yearly.0011.diligent:0 "มันจะรบกวนเราน้อยลงหากเรากำลังทำงาน"
 yearly.0011.wrathful:0 "ข้าจะฉีกไอ้สิ่งอัปรีย์นั่นออกจากท้องฟ้า!"
 yearly.0011.calm:0 "สิ่งนี้ก็จะผ่านไป เช่นกัน"
 yearly.0011.patient:0 "เราจะไขปริศนาสัญลักษณ์นี้ได้ในที่สุด"
 yearly.0011.impatient:0 "มันหมายความว่ากระไรกันใน [ROOT.Char.GetFaith.NegativeAfterLife]?!"
 yearly.0011.arrogant:0 "ลางดีสำหรับตระกูลของข้า ข้าคิดว่านะ"
 yearly.0011.humble:0 "เราทุกคนล้วนเป็นเพียงธุลีต่อหน้าการสร้างสรรค์"
 yearly.0011.deceitful:0 "ข้าสงสัยว่าคำอธิบายใดจะเป็นประโยชน์ต่อข้ามากที่สุด..."
 yearly.0011.honest:0 "สำหรับข้า มันดูเหมือนก้อนหินธรรมดา?"
 yearly.0011.craven:0 "#EMP ทุกคนตื่นตระหนก!#!"
 yearly.0011.brave:0 "ไม่ว่ามันจะหมายความว่าอะไร เราจะเผชิญหน้ากับมันโดยตรง!"
 yearly.0011.shy:0 "บางทีข้าอาจจะปลอดภัยกว่าในหอคอยของข้า..."
 yearly.0011.gregarious:0 "หากนี่คือจุดจบ ขอให้เราเฉลิมฉลองกับสหาย!"
 yearly.0011.ambitious:0 "ดาวหางเป็นลางบอกเหตุถึงการกระทำอันยิ่งใหญ่และ [ROOT.Char.GetWomenMen] ผู้ยิ่งใหญ่!"
 yearly.0011.content:0 "ไม่ว่ามันจะหมายความว่าอะไร มันถูกกำหนดมาแล้ว"
 yearly.0011.arbitrary:0 "มันหมายความตามที่ข้าบอกว่ามันหมายความ!"
 yearly.0011.just:0 "โอ้ ดาวหาง โอ้ ลางบอกเหตุแห่งความยุติธรรมอันศักดิ์สิทธิ์!"
 yearly.0011.cynical:0 "มันคงเป็นแค่ก๊าซชาวนาที่จับตัวกัน"
 yearly.0011.zealous:0 "จุดจบใกล้เข้ามาแล้ว! จงสำนึกผิด!"
 yearly.0011.paranoid:0 "ศัตรูของข้าหันสวรรค์มาต่อต้านข้า!"
 yearly.0011.trusting:0 "บ-บางทีมันอาจจะไม่ได้หมายความอะไรเลย?"
 yearly.0011.compassionate:0 "ข้าหวังว่ามันจะไม่ตกใส่ใคร..."
 yearly.0011.callous:0 "ตราบใดที่มันไม่ตกใส่ข้า ใครจะสน?"
 yearly.0011.sadistic:0 "ข้าหวังว่ามันจะตกใส่ศัตรู!"
 yearly.0011.stubborn:0 "ข้าไม่ขยับเขยื้อนเพื่อสิ่งใดที่น้อยไปกว่าสวรรค์ #EMP และ#! โลก"
 yearly.0011.fickle:0 "ข้าตัดสินใจเรื่องนี้ไม่ได้..."
 yearly.0011.vengeful:0 "ฮ่า ใครบางคนจะได้รับสิ่งที่พวกเขาสมควรได้รับ!"
 yearly.0011.forgiving:0 "ข้า แต่ [ROOT.GetCharacter.GetFaith.HighGodName] ผู้ยิ่งใหญ่ โปรดอภัยบาปให้แก่เรา!"

#Abandoned inn
 yearly.0025.t.chain_title: "กิจการโรงเตี๊ยม"
 yearly.0025.t: "$yearly.0025.t.chain_title$: เก่าแก่และถูกลืมเลือน"
 yearly.0025.desc: "ขณะเดินเล่นไปตามถนนเปลี่ยวสายหนึ่งของ[county.GetBaseNameNoTier]พร้อมคณะผู้ติดตาม ข้าเห็นเงาดำทมึนก่อตัวขึ้น แต่ไกล ค่อยๆ เคลื่อนเข้ามาใกล้ตามจังหวะฝีเท้าของข้า\n\nยิ่งเข้าใกล้ ข้าก็ยิ่งเห็นชัดเจน — นี่คือโรงเตี๊ยมเก่าแก่ที่ถูกทอดทิ้งและถูกลืมเลือน หากใส่ใจดูแลรูปโฉมภายนอกที่เก่าแก่นี้สักหน่อย ก็สามารถกลายเป็นโรงเตี๊ยมเล็กๆ ที่น่ารื่นรมย์ได้อย่างง่ายดาย\n\nข้าสุดจะคาดเดาได้ว่าเหตุใดสถานที่แห่งนี้จึงทรุดโทรมถึงเพียงนี้ ที่ตั้งของมันก็อยู่ใกล้หมู่บ้านหลายแห่ง ประตูทางเข้าก็ดูเชื้อเชิญ โดยรวมแล้ว ดูเหมือนว่ามันควรจะทำเงินได้อย่างเป็นกอบเป็นกำ\n\nเมื่อมีที่ดินดีๆ เช่นนี้แล้ว ท่าน[ROOT.Char.GetLadyLord] (ย่อมเห็นโอกาส)"
 yearly.0025.a: "ข้าจะ ทำให้สถานที่แห่งนี้เจริญรุ่งเรือง!"
 yearly.0025.a.tt.progress: "ลงทุนทรัพยากรเพื่อฟื้นฟูโรงเตี๊ยม อาจได้ผลลัพธ์และรางวัลในระดับ#Nแย่#! #Mปานกลาง#! หรือ#Pดี#!"
 yearly.0025.b: "เดินทางต่อไปเถิด เสี่ยงเกินไป"

#Refurbishment
 yearly.0026.t: "$yearly.0025.t.chain_title$: การบูรณะ"
 yearly.0026.desc: "เมื่อก้าวเข้าไปในซากอาคารนี้ ข้าพลันตระหนักได้ทันทีว่าเหตุใดมันจึงถูกทอดทิ้งและถูกลืมเลือนตั้งแต่แรก\n\nมีกลิ่นจางๆ ของบางสิ่งที่ข้าไม่รู้จัก คลุ้งรวมกับรอยรั่วบนเพดานที่หยดน้ำลงมาแผ่วๆ บนพื้นโคลนเลนเฉอะแฉะในร่มที่ใช้แทนพื้นห้อง\n\nการซ่อมแซมคงไม่#EMPยาก#!เกินไปนัก แต่มันดูน่าหงุดหงิดและสิ้นเปลือง อย่างไรก็ตาม ผู้คนแห่ง[county.GetNameNoTier]จะต้องแห่กันมาที่นี่อย่างแน่นอน — ธุรกิจใหม่ที่ได้รับการสนับสนุนจาก[ROOT.Char.GetTitleAsNameNoTooltip]ย่อมมีความแปลกใหม่ดึงดูดใจ"
 yearly.0026.a: "ก็แค่... โยนฟางลงบนโคลนก็พอ"
 yearly.0026.a.tt.success: "ข้าทำเท่าที่ข้ามี"
 yearly.0026.a.tt.failure: "ข้าหาทางออกที่ดีไม่ได้"
 yearly.0026.b: "บางส่วนสามารถซ่อมแซมได้ แต่ก็มีกำหนดเวลาที่ต้องคำนึงถึง"
 yearly.0026.c: "เราจะปรับปรุงใหม่#EMPทั้งหมด!#!"

 yearly.0026.tt.bad: "โรงเตี๊ยมดีขึ้น#Nเล็กน้อย#!"
 yearly.0026.tt.average: "โรงเตี๊ยมดีขึ้น#Mพอสมควร#!"
 yearly.0026.tt.good: "โรงเตี๊ยมดีขึ้น#Pมาก#!"

#Edibles
 yearly.0027.t: "$yearly.0025.t.chain_title$: งานเลี้ยงเยี่ยง[ROOT.Char.Custom('GetQueenKing')|U]"
 yearly.0027.desc: "ข้าเริ่มเคลิ้มหลับไป พลางคิดถึงศักยภาพของสถานที่แห่งนี้และความทรงจำทั้งหลายที่จะเกิดขึ้นภายใน\n\nแน่นอนว่า มีเพียงไม่กี่สิ่งที่ช่วยเสริมค่ำคืนอันดีงามได้เท่าอาหารมื้อหนัก และไม่มีสิ่งใดช่วยปัดเป่าความเศร้าโศกได้เร็วกว่าเอลชั้นดีสักเหยือก เนื้อติดมันชิ้นโตๆ คนเมาสลบไสลบนม้านั่ง สหายใหม่หน้าตาพร่าเลือน — ทั้งหมดนี้คือองค์ประกอบของช่วงเวลาดีๆ!\n\nคำถามที่แท้จริงคือ ข้าควรจะให้แขกได้เพลิดเพลินกับสิ่งใด: เบียร์ ไวน์ หรือสุรากลั่น..."
 yearly.0027.a: "ใครจะสน#EMPเครื่องดื่ม#! ข้าจะไปที่นั่น!"
 yearly.0027.a.tt.success: "เสน่ห์ของข้าโน้มน้าวใจได้"
 yearly.0027.tt.good: "$yearly.0026.tt.good$"
 yearly.0027.a.tt.failure: "ข้าไม่ได้มีเสน่ห์อย่างที่คิด"
 yearly.0027.tt.bad: "$yearly.0026.tt.bad$"
 yearly.0027.b: "หัวผักกาดเค็มสำหรับทุกคน"
 yearly.0027.c: "ข้าจะ ทำให้ไพร่พวกนี้รู้สึกเหมือนเป็นราชาและราชินี"

 innkeeper_bad_edibles_char_modifier: "เจ้าภาพผู้มัธยัสถ์"
 innkeeper_bad_edibles_char_modifier_desc: "อาหารที่คัดสรรมาในโรงเตี๊ยมของตัวละครนี้มีรามากกว่าเนื้อ"
 innkeeper_neutral_edibles_char_modifier: "อาหารที่สมดุล"
 innkeeper_neutral_edibles_char_modifier_desc: "ตัวละครนี้มีตัวเลือกน้อยเกินไปในคืนเปิดโรงเตี๊ยมที่เพิ่งซื้อมาใหม่"
 innkeeper_fancy_edibles_char_modifier: "ความฟุ่มเฟือยเกินควร"
 innkeeper_fancy_edibles_char_modifier_desc: "มีการคัดสรรอาหารและเครื่องดื่มอย่างหรูหราในคืนเปิดโรงเตี๊ยม"

#Entertainment
 yearly.0028.t: "$yearly.0025.t.chain_title$: เริ่มการแสดง!"
 yearly.0028.desc: "โรงเตี๊ยมคงจะไม่สมบูรณ์แบบหากขาดความบันเทิงสำหรับฝูงชน\n\nจะเป็นนักขับลำนำที่ขับขานถึงความรักและสงครามดีหรือไม่? หรือบางทีอาจจะเป็นกวี ผู้สามารถสร้างแรงบันดาลใจให้ผู้อื่นเกี่ยวกับพลังของถ้อยคำ? หรือทำไมจะไม่เป็นตัวตลกผู้คล่องแคล่ว ที่จะ ทำให้ท่านร่ำไห้ด้วยความสุขและปัดเป่าความเศร้าโศกของท่านไป — แม้เพียงชั่วคืน?\n\nข้าต้องพิจารณาว่าการแสดงประเภทใดที่จำเป็น เพื่อให้ลูกค้ายังคงหลงใหล ยิ่งพวกเขาอยู่ที่นี่นานเท่าไร พวกเขาก็จะยิ่งดื่มมากขึ้นเท่านั้น"
 yearly.0028.a: "จ้างนักขับลำนำผู้มีวาทศิลป์"
 yearly.0028.b: "หากวีผู้มีพรสวรรค์"
 yearly.0028.c: "นำตัวตลกผู้คล่องแคล่วมาให้ข้า"
 yearly.0028.a.gain.bard: "มีโอกาสที่จะ#Pได้#!นักขับลำนำมายังราชสำนักของท่านในตอนท้าย"
 yearly.0028.b.gain.poet: "มีโอกาสที่จะ#Pได้#!กวีมายังราชสำนักของท่านในตอนท้าย"
 yearly.0028.c.gain.jester: "มีโอกาสที่จะ#Pได้#!ตัวตลกมายังราชสำนักของท่านในตอนท้าย"
 yearly.0028.tt.minor_xp_gain: "ทักษะการต่อรองของท่านมีประโยชน์อยู่บ้าง"
 yearly.0028.tt.major_xp_gain: "ทักษะการต่อรองของท่านมีประโยชน์อย่างยิ่ง"

#Conclusion
 yearly.0029.t: "$yearly.0025.t.chain_title$: คืนเปิดกิจการ"
 yearly.0029.conclusion_intro: "ช่างเป็นค่ำคืนที่ยาวนานและเหน็ดเหนื่อยสำหรับการเปิดตัวโรงเตี๊ยมครั้งแรก — เต็มไปด้วยทั้งเรื่องดีและเรื่องร้าย เป็นสิ่งที่คาดการณ์ได้ แต่ถึงกระนั้นก็ยังเหนื่อยล้า"
 yearly.0029.refurbishment_bad.1: "โรงเตี๊ยมใหม่ของข้าคงเคยเห็นวันที่ดีกว่านี้ แต่วันนี้ไม่ใช่วันนั้น\n\n"
 yearly.0029.refurbishment_bad.2: "ข้าหวังว่ารอยรั่วจะทนได้ อนิจจา มีฝนรั่วลงบนเคาน์เตอร์บาร์มากกว่าเบียร์เสียอีก\n\n"
 yearly.0029.refurbishment_bad.3: "กลิ่นเหม็นนั้นไม่ยอมจางหายไปเลย ข้าเกรงว่ามันจะตามหลอกหลอนในความฝันของข้าไปชั่วนิรันดร์\n\n"
 yearly.0029.refurbishment_average.1: "ม้านั่งเตี้ยๆ สองสามตัวถูกขโมยไป แม้ว่ามันจะเป็นข้ออ้างให้ลงทุนซื้อเพิ่มก็ตาม\n\n"
 yearly.0029.refurbishment_average.2: "มีรอยขีดเขียนหยาบๆ สองสามรอยบนโต๊ะ แต่ก็ไม่มีอะไรน่าสังเกต\n\n"
 yearly.0029.refurbishment_average.3: "โชคดีที่การซ่อมแซมของเรายังคงทนอยู่ได้ แม้จะมีเสียงหลังคาลั่นเอี๊ยดอ๊าดน่าหวาดเสียวก็ตาม\n\n"
 yearly.0029.refurbishment_good.1: "เป็นการลงทุนที่คุ้มค่าที่ได้ซ่อมแซมเหล่านั้น\n\n"
 yearly.0029.refurbishment_good.2: "มีที่นั่งเพิ่มอีกสักหน่อยก็ไม่เสียหาย\n\n"
 yearly.0029.refurbishment_good.3: "โชคดีที่ลูกค้ารายสุดท้ายเพิ่งจากไปด้วยรอยยิ้มบนใบหน้า\n\n"
 yearly.0029.edibles_bad.1: "อาหารนั้นย่อยยาก... ส่วนใหญ่รั่วไหลระหว่างแผ่นไม้กระดานพื้น\n\n"
 yearly.0029.edibles_bad.2: "ลูกค้าเพียงไม่กี่รายที่กล้าสั่งอาหารกลับไม่กล้าแม้ แต่จะกัดสักคำ\n\n"
 yearly.0029.edibles_bad.3: "ถาดอาหารทุกใบที่ไม่มีใครดูแลกลายเป็นงานเลี้ยงย่อยๆ สำหรับหนูท้องถิ่น ฝูงแล้วฝูงเล่าของ#EMPหนู!#!\n\n"
 yearly.0029.edibles_average.1: "ลูกค้าดูเหมือนจะเพลิดเพลินกับอาหารส่วนใหญ่ แม้จะต้องปัดป้องหนูผู้กล้าหาญสองสามตัวก็ตาม\n\n"
 yearly.0029.edibles_average.2: "แขกบางคนตั้งคำถามถึงเบียร์ที่พวกเขาได้รับ ทำหน้าบึ้งหลังจากดมกลิ่น ก่อนจะเทเข้าปากโดยไม่สนใจ\n\n"
 yearly.0029.edibles_average.3: "แม้ว่าทั้งอาหารและเบียร์จะไม่ได้วิเศษเลิศเลอ แต่อย่างใด แต่เหล่านักพนันก็ดูจะครึกครื้นเป็นอย่างยิ่ง หลายคนครึกครื้นตามตัวอักษรจริงๆ\n\n"
 yearly.0029.edibles_good.1: "เจ้าของโรงเตี๊ยมแทบจะรับมือกับความต้องการไม่ไหว เมื่อลูกค้าแทบจะไม่ได้นั่งลงก็สั่งรอบต่อไปแล้ว\n\n"
 yearly.0029.edibles_good.2: "เสียงโห่ร้องยินดีทั้งหมดเกือบจะ ทำให้ข้าหูหนวก มันดังยาวนานและกึกก้องเหลือเกิน\n\n"
 yearly.0029.edibles_good.3: "ไม่มีจานอาหารใดที่เสิร์ฟไปแล้วกลับมาพร้อมเศษอาหารแม้ แต่น้อย\n\n"
 yearly.0029.entertainment_bard_bad: "เมื่อนักขับลำนำขึ้นเวที [entertainer.GetSheHe]ดู...ประหม่า ราวกับว่า[entertainer.GetSheHe]ไม่เคยเล่นต่อหน้าฝูงชนมาก่อน ดวงตาเบิกกว้างด้วยความหวาดกลัวราวกับ[entertainer.GetSheHe]ได้ลงสนามรบ [entertainer.GetSheHe]กรีดร้องออกมาเพียงครั้งเดียวอย่างแหลมคม — แล้วก็วิ่งหนีไป\n\n"
 yearly.0029.entertainment_bard_average: "นักขับลำนำเดินขึ้นเวทีด้วยท่าทางค่อนข้างมั่นใจ ดึงม้านั่งเตี้ยๆ ตัวหนึ่งขึ้นจากพื้นแล้วกระแทกลงพร้อมกับวางรองเท้าบูทหนักๆ ข้างหนึ่งของ[entertainer.GetHerHis]ไว้บนนั้น ทันทีที่[entertainer.GetSheHe]หยิบพิณลูทของ[entertainer.GetHerHis]ขึ้นมา ความมั่นใจในท่าทางก่อนหน้านี้ของ[entertainer.GetHerHis]ก็เลือนหายไป ฝูงชนได้รับการต้อนรับด้วยเพลงบัลลาดเสียงสั่นเครือแหลมสูง ชนิดที่แม้ แต่ปู่ย่าตา ยายที่กำลังจะตายและหูหนวกก็ยังมิอาจชื่นชมได้\n\n"
 yearly.0029.entertainment_bard_good: "ในช่วงแรก มีท่วงทำนองแผ่วเบาแว่วมาจากความมืดสลัวภายนอก ค่อยๆ ดึงดูดความสนใจของนักดื่มทุกคน ความเงียบเข้าปกคลุมฝูงชน และทุกสายตาจับจ้องไปยังทางเข้า เพลงดังขึ้น ดังขึ้นอีก จนกระทั่งประตูเปิดออกพร้อมกับนักขับลำนำรูปงามก้าวเข้ามา บทเพลงของ[entertainer.GetHerHis|U]ไต่ระดับขึ้นสู่จุดสูงสุด แล้วก็ลดระดับลงเป็นท่วงทำนองที่สนุกสนานและเสียงโห่ร้องกึกก้อง — เป็นครั้งแรกของอีกหลายครั้งที่จะตามมา\n\n"
 yearly.0029.entertainment_poet_bad: "กวีเดินขึ้นเวทีพร้อมเศษกระดาษหนังในมือของ[entertainer.GetHerHis] พยายามอย่างสุดความสามารถที่จะดึงดูดความสนใจของฝูงชนก่อนที่จะเริ่ม แต่ก็ไม่เป็นผล [entertainer.GetSheHe]มองดูบันทึกของ[entertainer.GetHerHis]ใกล้ๆ พยายามเปล่งเสียงสองสามบรรทัดออกมาโดยตรง — แต่ก็ถูกกลบด้วยเสียงโห่ไล่ และวิ่งหนีร้องไห้หายไปในความมืด\n\n"
 yearly.0029.entertainment_poet_average: "รัศมีอันเจิดจ้าของกวีดึงดูดสายตาทันทีที่[entertainer.GetSheHe]เข้ามา ทำให้แม้ แต่ลูกค้าน่าเบื่อที่สุดก็ยังเงยหน้าขึ้นจากเหยือกเบียร์ด้วยความสนใจ ทันทีที่กวีเริ่มท่องบทกวี มนตร์สะกดก็สลายไป: เมื่อมีเพียงเพลงโศกเพื่อดึงดูดพวกเขา ฝูงชนที่ไม่รู้อิโหน่อิเหน่ก็หมดความสนใจอย่างรวดเร็วและกลับไปดื่มเอลของตนต่อ\n\n"
 yearly.0029.entertainment_poet_good: "กวีเดินขึ้นเวทีอย่างสง่างาม ท่องบทกวีของ[entertainer.GetHerHis]ด้วยอารมณ์อันเร่าร้อนจนไม่มีหัวใจดวงใดในที่นั้นที่ไม่หวั่นไหว ถ้อยคำของ[entertainer.GetHerHis|U]ดังก้องกังวานในใจเราอย่างหนักแน่น จนอารมณ์ความรู้สึกก่อนหน้านี้ทั้งหมดดู...เบาหวิวไปเลยเมื่อเทียบกัน ไม่มีวิญญาณดวงใดออกจากสถานประกอบการในวันนั้นโดยไม่มีน้ำตาคลอเบ้า — ไม่ว่าจะเป็นน้ำตาแห่งความสุขหรือความเศร้า\n\n"
 yearly.0029.entertainment_jester_bad: "ข้าถูกตัวตลกหลอกเสียแล้วที่เชื่อว่า[entertainer.GetSheHe]จะมาปรากฏตัวในค่ำคืนนี้ ทั้งที่ในความเป็นจริงแล้วไม่มีร่องรอยใดที่จะนำกลับไปหา[entertainer.GetHerHim]ได้เลย ความคาดหวังสำหรับความบันเทิงในค่ำคืนนี้กลับกลายเป็นความผิดหวังอย่างรวดเร็ว ฝูงชนที่ไม่พอใจต่างบ่นพึมพำด้วยความไม่เชื่อในข้อแก้ตัวอันขี้เหนียวของข้า\n\n"
 yearly.0029.entertainment_jester_average: "ตัวตลกสามารถ ทำให้บรรยากาศในโรงเตี๊ยมเบาลงได้บ้าง แต่ก็ต้องแลกมาด้วยความเงียบงันที่น่าอึดอัดเป็นครั้งคราวและมุกตลกที่เหล่าไพร่ผู้ซื่อบื้อ — และมึนเมาอย่างแท้จริง — ไม่เข้าใจ\n\n"
 yearly.0029.entertainment_jester_good: "ตัวตลกกระโดดขึ้นเวทีพร้อมเสียงตะโกนและตีลังกาท่าล้อเกวียน ทั้งโรงเตี๊ยมโห่ร้องปรบมือเมื่อ[entertainer.GetSheHe]หมุนตัวกลางอากาศอย่างสง่างาม กระโดดข้ามโต๊ะ ม้านั่งเตี้ยๆ และลูกค้าไปมา การแสดงผาดโผน แต่ละครั้งยังสอดแทรกด้วยคำคมหลักแหลม (แม้ขณะหอบหายใจ) ทำให้ตัวตลกผู้น่าสงสารหมดเรี่ยวแรงเมื่อสิ้นสุดค่ำคืน มันกลายเป็นค่ำคืนที่น่าทึ่งสำหรับทุกคนที่เกี่ยวข้อง\n\n"
 yearly.0029.conclusion_outro: "งานของข้าที่นี่เสร็จสิ้นแล้ว"
 yearly.0029.a: "ช่างเป็นค่ำคืนที่วิเศษ!"
 
