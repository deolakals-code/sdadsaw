l_english: 
 #[Faith] Traders in [County]
 yearly_saharan.0001.t:0 "วานิชชาว[source_county.GetProvince.GetCounty.GetFaith.GetAdherentNameNoTooltip]ใน[target_county.GetNameNoTierNoTooltip]"
 yearly_saharan.0001.desc:0 "การค้าข้ามทะเลทรายซาฮาราได้ผ่านดินแดนเหล่านี้มาโดยตลอด นำมา ซึ่งความมั่งคั่ง แนวคิด และอุดมการณ์ โดยปกติแล้ว ผู้ปกครอง เช่นข้าเพียงแค่เก็บส่วนแบ่งอันชอบธรรม และนอกเหนือจากนั้นเส้นทางการค้าก็ดำเนินไปเอง\n\nอย่างไรก็ตาม เมื่อเร็วๆ นี้ วานิชชาว[source_county.GetProvince.GetCounty.GetFaith.GetAdherentNameNoTooltip]จำนวนมากขึ้นเรื่อยๆ ได้เดินทางผ่าน[target_county.GetNameNoTier] นำศรัทธาและเหรียญตราของพวกเขามาด้วย\n\nกลุ่มวานิชกลุ่มหนึ่งกำลังขออนุญาตจากข้าเพื่อตั้งถิ่นฐานและซื้อทรัพย์สิน และได้รวบรวมของกำนัลอันหนักอึ้งเพื่อหวังให้ข้าพึงพอใจ"
 yearly_saharan.0001.a:0 "ข้าตอบรับเครื่องบรรณาการนี้ด้วยความยินดี"
 yearly_saharan.0001.a.tt:0 "#WEAK สิ่งนี้อาจส่งผลต่อคนท้องถิ่นในภายหลัง...#!"
 yearly_saharan.0001.b:0 "พวกเจ้าอาจเดินทางผ่านไปได้ แต่เพียงเท่านั้น"
 yearly_saharan.0001.c:0 "ห้าม[source_county.GetProvince.GetCounty.GetFaith.GetAdherentNamePluralNoTooltip]เข้า[target_county.GetNameNoTierNoTooltip] สินค้าของพวกเขา #EMP ถูกริบ!!#"
 yearly_saharan.0001.c.list:0 "ทุก [counties|E] ใน [realm|E] เดียวกันที่อยู่ติดกับ [target_county.GetNameNoTierNoTooltip]"
 
 yearly_saharan.0003.t:0 "$yearly_saharan.0001.t$: การหลอมรวม"
 yearly_saharan.0003.desc_initial:0 "วานิชชาว[source_county.GetProvince.GetCounty.GetFaith.GetAdherentNameNoTooltip]ที่ข้าอนุญาตให้ตั้งถิ่นฐานใน[target_county.GetNameNoTier]ได้อยู่ที่นั่นมาหลายปีแล้ว"
 yearly_saharan.0003.desc_current:0 "เป็นเวลาหลายปีแล้วที่ชาว[source_county.GetProvince.GetCounty.GetFaith.GetAdherentNamePluralNoTooltip]จาก[source_county.GetNameNoTier]ได้อาศัยอยู่ใน[target_county.GetNameNoTier]"
 yearly_saharan.0003.desc:0 "และดูเหมือนว่าพวกเขาได้หลอมรวมเข้ากับชุมชนที่มีอยู่เดิมได้ค่อนข้างดี\n\nเป็นผลให้ การค้าหลั่งไหลเข้ามาในพื้นที่ รายได้สูงเป็นประวัติการณ์ และแม้ แต่ชาวไร่ชาวนาก็คุ้นเคยกับเสียงกระทบกันของเหรียญทอง!"
 yearly_saharan.0003.a:0 "ช่างเป็นลาภลอยที่น่ายินดี!"
 yearly_saharan.0003.b:0 "เก็บภาษีพวกเขาจนสิ้นเนื้อประดาตัว"
 
 yearly_saharan.0004.t:0 "$yearly_saharan.0001.t$: ความเฟื่องฟูทางการค้า"
 yearly_saharan.0004.desc_initial:0 "$yearly_saharan.0003.desc_initial$"
 yearly_saharan.0004.desc_current:0 "$yearly_saharan.0003.desc_current$"
 yearly_saharan.0004.desc:0 "และการค้าและความมีชีวิตชีวาที่พวกเขานำมาสู่พื้นที่ดูเหมือนจะไร้ขีดจำกัด!\n\nผู้คนหลั่งไหลไปยังตลาด: เกวียนบรรทุกทองคำเดินทางขึ้นเหนือ เกวียนบรรทุกเกลือหลั่งไหลลงใต้ และทั้งหมดจ่ายภาษีทั้งขาเข้าและขาออก! แท้จริงแล้ว นี่คือมุมที่รุ่งเรืองของอาณาจักร!"
 yearly_saharan.0004.a.tt:0 "ท่านพยายามปรับปรุง[stewardship|E]ของท่าน"
 yearly_saharan.0004.a:0 "ข้าคิดว่าข้าอาจเรียนรู้สักหนึ่งหรือสองสิ่งจากวานิชเหล่านี้ได้!"
 yearly_saharan.0004.a.tt.outcome_1:0 "การดูแลเพิ่มขึ้น"
 yearly_saharan.0004.a.tt.outcome_2:0 "$yearly_saharan.0004.a.tt.outcome_1$"
 yearly_saharan.0004.a.tt.outcome_3:0 "$yearly_saharan.0004.a.tt.outcome_1$"
 yearly_saharan.0004.b:0 "ข้าได้ยินเสียงอัตราภาษีที่สูงขึ้นหรือไม่?"
 yearly_saharan.0004.c:0 "แน่นอน เราจะต้องเรียกเก็บภาษีย้อนหลังบ้าง..."
 
 yearly_saharan.0005.t:0 "$yearly_saharan.0001.t$: การเปลี่ยนศรัทธา"
 yearly_saharan.0005.desc_initial:0 "$yearly_saharan.0003.desc_initial$"
 yearly_saharan.0005.desc_current:0 "$yearly_saharan.0003.desc_current$"
 yearly_saharan.0005.desc:0 "และศรัทธาของพวกเขาได้หยั่งรากลึกในหัวใจของคนท้องถิ่น มากเสียจนตอนนี้มีผู้คนจำนวนมากติดตาม [target_county.GetProvince.GetCounty.GetFaith.HighGodName] มากกว่าสวดภาวนาต่อ [target_county_old_faith.HighGodName]!\n\nการเปลี่ยนศรัทธาเป็นไปอย่างสันติ และผู้คนดูว่าง่ายและพอใจกับความเชื่อใหม่ของพวกเขา แต่วิถีเก่าแก่ได้เลือนหายไปเกือบหมดสิ้นแล้ว"
 yearly_saharan.0005.a:0 "ยินดีต้อนรับสู่แสงสว่างแห่ง [ROOT.GetCharacter.GetFaith.HighGodName]!"
 yearly_saharan.0005.b:0 "หืม อย่างน้อยพวกเขาก็มีความสุขกับมัน"
 yearly_saharan.0005.c:0 "ไม่ได้ ตราบใดที่ข้ายังเป็น [ROOT.GetCharacter.GetTitleAsNameNoTooltip]!"

 #[Culture] Nomads Flock to [County]
 yearly_saharan.0021.t:0 "ชนเผ่าเร่ร่อนชาว[nomad_leader.GetCulture.GetNameNoTooltip]หลั่งไหลสู่[target_county.GetNameNoTierNoTooltip]"
 yearly_saharan.0021.desc:0 "แม้ว่าข้าจะเป็น[ROOT.GetCharacter.GetTitleAsNameNoTooltip]ผู้สูงศักดิ์ แต่ก็มีสถานที่ห่างไกลเกินกว่าที่แม้ แต่ชื่อของข้าจะมีอิทธิพลมากนัก สถานที่ที่ข้าไม่อาจหวังว่าจะปกครองได้อย่างแท้จริง\n\nปรากฏตัวจากสถานที่ เช่นนั้นลึกเข้าไปในทะเลทรายซาฮารา ชนเผ่าเร่ร่อนชาว[nomad_leader.GetCulture.GetCollectiveNounNoTooltip]ได้รุกล้ำเข้ามาใน[target_county.GetNameNoTier]เมื่อไม่นานมานี้ เข้าครอบครองช่องว่างและดินแดนที่ผู้ตั้งถิ่นฐานชาว[target_county.GetProvince.GetCounty.GetCulture.GetNameNoTooltip]ท้องถิ่นทิ้งไว้อย่างง่ายดาย\n\nผู้นำคนหนึ่งของพวกเขาถึงกับมาหาข้าเพื่อขออนุญาตนำสมาพันธ์ที่กว้างขวางกว่าของ[nomad_leader.GetHerHis]เข้ามาเพื่อยึดครองพื้นที่ในนามของข้า"
 yearly_saharan.0021.a:0 "ข้าจะให้เจ้าปกครองมันด้วยซ้ำ!"
 yearly_saharan.0021.b:0 "ผู้คนชาว[nomad_leader.GetCulture.GetNameNoTooltip]ได้รับการต้อนรับในอาณาจักรของข้าเสมอ"
 yearly_saharan.0021.c:0 "บางทีเจ้าอาจจะเข้าร่วมกับข้าในฐานะข้ารับใช้แทน?"
 yearly_saharan.0021.d:0 "เหลวไหลสิ้นดี! ไปให้พ้น!"

 #Slave Raid against [Realm] Escalates
 yearly_saharan.0031.t:0 "การปล้นทาสต่อต้าน[affected_sub_realm.GetNameNoTierNoTooltip]ทวีความรุนแรงขึ้น"
 yearly_saharan.0031.desc:0 "การปล้นทาส และการค้ามนุษย์ที่เป็นผลตามมา มักเป็นความจริงอันโหดร้ายของชีวิตสำหรับผู้ที่อยู่ในหรือใกล้กับซาเฮล เงินที่ได้จากการปล้น เช่นนี้นั้นให้ผลกำไรงามเกินกว่าจะละทิ้ง และการตั้งถิ่นฐานหลายแห่งก็ปล้นสะดม ซึ่งกันและกันเป็นครั้งคราว\n\nอย่างไรก็ตาม เมื่อเร็วๆ นี้ ผู้ปล้นทาสจาก[slave_raider_county.GetNameNoTier]ได้มุ่งเป้าโจมตี[raided_county.GetNameNoTier]ที่อยู่ใกล้เคียงอย่างร้อนแรง และพ่อค้าคนสำคัญหลายคนกำลังวางแผนการโจมตีครั้งใหญ่ โดยมี[raided_character_marshal.GetCouncilTitle] [raided_character_marshal.GetFirstName]คัดค้าน"
 yearly_saharan.0031.a:0 "ช่างได้กำไรงาม! ส่งทหารไปร่วมกับพวกเขา!!"
 yearly_saharan.0031.a.tt_success:0 "[raided_county.GetNameNoTierNoTooltip] ถูกปล้นอย่างหนักเพื่อจับทาส"
 yearly_saharan.0031.a.tt_fail:0 "[raided_character_marshal.GetTitledFirstNameNoTooltip] ขับไล่ผู้ปล้นทาสกลับไป"
 yearly_saharan.0031.b:0 "หยุดความป่าเถื่อนนี้!"
 yearly_saharan.0031.c:0 "เรื่องนี้ไม่เกี่ยวกับข้าจริงๆ"
 yearly_saharan.0031.c.raided_hurt:0 "[raided_county.GetNameNoTierNoTooltip] ถูกปล้นสะดม"
 yearly_saharan.0031.c.raiders_hurt:0 "ผู้ปล้นชาว[slave_raider_county.GetAdjectiveNoTooltip]จำนวนมากได้รับบาดเจ็บ"

 #Marauding Slavers from [Realm]
 yearly_saharan.0032.t:0 "ผู้ปล้นทาสที่เที่ยวปล้นสะดมจาก[hostile_sub_realm.GetNameNoTierNoTooltip]"
 yearly_saharan.0032.desc:0 "ผู้ปล้นทาสจากซาเฮล โชคไม่ดีที่เป็นภัยคุกคามที่ผู้คนจำนวนมากในดินแดนนี้ต้องเผชิญ สิ่งล่อใจแห่งความมั่งคั่งที่ได้จากการส่งเพื่อนมนุษย์ไปยังสุดขอบโลกนั้น สำหรับบางคนแล้วมันช่างรุนแรงเกินต้านทาน\n\nโดยปกติแล้ว การปล้น เช่นนี้จะกระจัดกระจายและไม่ต่อเนื่อง แต่ผู้ปล้นทาสจาก[slave_raider_county.GetNameNoTier]ได้เริ่มทำการโจมตีที่ประสานงานกันต่อต้าน[raided_county.GetNameNoTier] ผู้ปล้นสะดมล่ามโซ่ทั้งหมู่บ้าน นำโดยทหารของ[slave_raider_county.GetHolder.GetTitledFirstName] [slave_raider_county.GetHolder.GetHerHim]self!"
 yearly_saharan.0032.a:0 "จับอาวุธต่อสู้กับเดนมนุษย์เหล่านี้!"
 yearly_saharan.0032.a.tt_success:0 "ท่านเอาชนะและปล้นทรัพย์สินจากผู้ปล้นทาส"
 yearly_saharan.0032.a.tt_fail:0 "ผู้ปล้นของ[slave_raider_county.GetHolder.GetFirstNamePossessiveNoTooltip]ทำลายล้าง[raided_county.GetNameNoTierNoTooltip]"
 yearly_saharan.0032.b:0 "เจ้ารู้ไหม พวกเขาควรจะจ่ายภาษีสำหรับเรื่องนี้จริงๆ..."
 yearly_saharan.0032.c:0 "ข้าไม่สนใจเลยแม้ แต่น้อย"

 #Modifiers
 foreign_trader_enclaves_saharan_modifier:0 "ชุมชนวานิชนอกรีต"
 foreign_trader_enclaves_saharan_modifier_desc:0 "วานิชนอกรีตได้ตั้งถิ่นฐานที่นี่"
 respects_local_traditions_saharan_modifier:0 "เคารพประเพณีท้องถิ่น"
 respects_local_traditions_saharan_modifier_desc:0 "ตัวละครนี้เป็นที่รู้จักว่าให้คุณค่าแก่ประเพณีของบรรพบุรุษมากกว่าทองคำต่างแดน"
 foreign_traders_unable_to_root_saharan_modifier:0 "วานิชนอกรีตชั่วคราว"
 foreign_traders_unable_to_root_saharan_modifier_desc:0 "ห้ามวานิชนอกรีตครอบครองทรัพย์สิน หรือพำนักอยู่นานที่นี่"
 local_recession_epicentre_saharan_modifier:0 "ความซบเซาทางเศรษฐกิจท้องถิ่น"
 local_recession_epicentre_saharan_modifier_desc:0 "การขับไล่วานิชนอกรีต ทำให้เศรษฐกิจท้องถิ่นเป็นอัมพาต"
 local_recession_ripple_saharan_modifier:0 "ผลกระทบความซบเซาทางเศรษฐกิจท้องถิ่น"
 local_recession_ripple_saharan_modifier_desc:0 "การยกเลิกเส้นทางการค้าใกล้เคียงได้สร้างความเสียหายต่อเศรษฐกิจของเคาน์ตีนี้"
 integrated_foreign_trader_enclaves_saharan_modifier:0 "วานิชนอกรีตที่หลอมรวมแล้ว"
 integrated_foreign_trader_enclaves_saharan_modifier_desc:0 "วานิชนอกรีตได้กลายเป็นส่วนหนึ่งของสังคมท้องถิ่นที่นี่"
 overtaxed_merchant_enclaves_saharan_modifier:0 "วานิชนอกรีตที่ถูกเก็บภาษีเกินควร"
 overtaxed_merchant_enclaves_saharan_modifier_desc:0 "วานิชนอกรีตถูกเก็บภาษีอย่างโหดเหี้ยมในเคาน์ตีนี้ ทำให้คู่ค้าของพวกเขาไม่พอใจ"
 ecstatic_converts_saharan_modifier:0 "ผู้เปลี่ยนศรัทธาที่ปิติยินดี"
 ecstatic_converts_saharan_modifier_desc:0 "มวลชนที่ร่าเริงยินดีของเคาน์ตีนี้มีความสุขกับการไถ่บาปของพวกเขา"
 persecuted_converts_saharan_modifier:0 "ผู้เปลี่ยนศรัทธาที่ถูกกดขี่"
 persecuted_converts_saharan_modifier_desc:0 "มวลชนที่ก่อความไม่สงบของเคาน์ตีนี้วางแผนที่จะหลบหนีจากเจ้านายที่โหดร้ายของพวกเขา"
 enthusiastic_nomad_settlement_saharan_modifier:0 "การตั้งถิ่นฐานของชนเผ่าเร่ร่อนอย่างกระตือรือร้น"
 enthusiastic_nomad_settlement_saharan_modifier_desc:0 "ชนเผ่าทะเลทรายกำลังหลั่งไหลมายังเคาน์ตีนี้เป็นจำนวนมาก"
 nomad_settlement_saharan_modifier:0 "การตั้งถิ่นฐานของชนเผ่าเร่ร่อน"
 nomad_settlement_saharan_modifier_desc:0 "ชนเผ่าทะเลทรายกำลังหลั่งไหลมาตั้งถิ่นฐานในเคาน์ตีนี้"
 upset_local_nomads_saharan_modifier:0 "ชนเผ่าเร่ร่อนที่แข็งข้อ"
 upset_local_nomads_saharan_modifier_desc:0 "ชนเผ่าทะเลทรายท้องถิ่นกำลังปล้นสะดมตามเส้นทางและสร้างความเดือดร้อนอย่างยิ่ง"
 lord_defeated_slavers_modifier:0 "เจ้าเหนือหัวเอาชนะผู้ปล้นทาส"
 lord_defeated_slavers_modifier_desc:0 "เจ้าเหนือหัวผู้กล้าหาญของเคาน์ตีนี้ได้เอาชนะกลุ่มผู้ปล้นทาสที่เที่ยวปล้นสะดม!"
 lord_complicit_with_slavers_modifier:0 "เจ้าเหนือหัวสมรู้ร่วมคิดกับผู้ปล้นทาส"
 lord_complicit_with_slavers_modifier_desc:0 "เจ้าเหนือหัวผู้ละโมบของเคาน์ตีนี้ขายคนท้องถิ่นให้กับผู้ปล้นทาสที่เที่ยวปล้นสะดม"
 utterly_unphased_modifier:0 "ไม่สะทกสะท้านโดยสิ้นเชิง"
 utterly_unphased_modifier_desc:0 "ไม่ว่าเรื่องเลวร้ายใดๆ จะเกิดขึ้นกับไพร่ฟ้าข้าแผ่นดิน ตัวละครนี้ก็ไม่ปล่อยให้สิ่งต่างๆ มารบกวนจิตใจ"
