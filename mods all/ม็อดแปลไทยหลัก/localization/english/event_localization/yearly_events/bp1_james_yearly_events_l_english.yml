l_english: 
 bp1_yearly.9001.t:0 "สหายไม้"
 bp1_yearly.9001.opening:0 "เหล่าสหายนั้นมักโลเลนักและง่ายต่อการทรยศหักหลัง ทว่าสหายผู้เป็นที่รักยิ่งของข้าหาเคยกระทำการ เช่นนั้นไม่ ของเล่นชิ้นโปรดนี้มีความหมายต่อข้ายิ่งกว่าเป็นเพียงของเล่น [ROOT.Char.GetSheHe] คือสหายรักที่สุดของข้า\n\n"
 bp1_yearly.9001.desc.bully:0 "อย่างไรก็ดี [bp1_yearly_9001_toy_hater.Custom2('MyCharacterIntroduction', ROOT.Char)] คอยกลั่นแกล้งรังแกข้าไม่หยุดหย่อนต่อหน้าเด็กคนอื่น กล่าวหาว่าข้าน่าสมเพชถึงเพียงนั้นเชียวหรือจึงมิอาจหาสหายที่เป็นคนจริงๆ ได้ หากข้าโยนของเล่นชิ้นโปรดทิ้งไป การรังแกนี้ย่อมต้องหยุดลงเป็นแน่ แต่นั่นหมายถึงการทอดทิ้งสหายรักที่สุดของข้า!"
 bp1_yearly.9001.desc.mentor:0 "อย่างไรก็ตาม [bp1_yearly_9001_toy_hater.Custom2('MyCharacterIntroduction', ROOT.Char)] พยายามยืนกรานให้ข้าทิ้งสหายรักของข้าไปเสีย แล้วใช้เวลาอยู่กับเด็ก "จริงๆ" และคบค้าสมาคมให้เหมาะสม แต่ [bp1_yearly_9001_toy_hater.GetSheHe] หามีความเข้าใจไม่ว่าของเล่นอันเป็นที่รักนี้มีความหมายต่อข้าเพียงใด!"
 bp1_yearly.9001.a:0 "ข้าคงจะโตเกินไปสำหรับ [ROOT.Char.GetHerHim] แล้วกระมัง"
 bp1_yearly.9001.b:0 "ข้าจะไม่มีวันทอดทิ้งสหายรักของข้า!"

 bp1_yearly.9002.desc.opening:0 "ทุกวันข้าเห็น [bp1_yearly_9001_shy_kid.Custom2('MyCharacterIntroduction', ROOT.Char)] วิ่งเล่นไปทั่ว [ROOT.Char.Custom('GetCourt')] โดยมีของเล่นชิ้นโปรดอยู่ในมือ ข้ากระทั่งเห็น [bp1_yearly_9001_shy_kid.GetHerHim] แอบซ่อนตัวอยู่บางครั้ง พูดคุยกับมันราวกับว่ามันคือสหายรักที่สุดของ [bp1_yearly_9001_shy_kid.GetHerHis]!\n\n"
 bp1_yearly.9002.desc.bully:0 "ช่างน่าสมเพชโดยแท้ และข้าคิดว่าถึงเวลาแล้วที่ [bp1_yearly_9001_shy_kid.GetSheHe] จะได้เรียนรู้ว่ามิตรภาพ เช่นนี้มันเปราะบางเพียงใด"
 bp1_yearly.9002.desc.mentor:0 "ข้าพบว่ามันออกจะพิกลอยู่ และกังวลว่าหากมิได้สอดแทรก [bp1_yearly_9001_shy_kid.GetSheHe] จะเติบใหญ่ขึ้นเป็นผู้มีวุฒิภาวะทางอารมณ์บกพร่องในร่างของ [bp1_yearly_9001_shy_kid.GetWomanMan] ทว่า [bp1_yearly_9001_shy_kid.GetSheHe] ก็ได้ปฏิเสธทุกคำขออันสมเหตุสมผลที่จะให้วางของเล่นนั้นลงเสียแล้ว"
 bp1_yearly.9002.a:0 "ข้าจะทำลายมันเสีย!"
 bp1_yearly.9002.b:0 "บางทีข้าควรปล่อย [bp1_yearly_9001_shy_kid.GetHerHim] ไว้ตามลำพัง"
 bp1_yearly.9002.c:0 "ข้าจะทำลายมันและภาวนาให้ [bp1_yearly_9001_shy_kid.GetSheHe] อภัยให้ข้า"
 
 bp1_yearly.9003.desc.child:0 "โชคดีเหลือเกินที่ [bp1_yearly_9001_toy_hater.GetName] ตัดสินใจละเว้นสหายรักของข้า และปล่อยให้ข้าเล่นและพูดคุยกับ [ROOT.Char.GetHerHim] ได้ทั้งวัน!\n\nมีชั่วขณะหนึ่งที่ดูเหมือนว่า [bp1_yearly_9001_toy_hater.GetSheHe] ตั้งใจจะสังหารสหายรักของข้า แต่ดูเหมือนว่าสหายของข้าจะมีชีวิตรอดไปได้อีกวัน"
 bp1_yearly.9003.desc.mentor:0 "เจ้าหนู [bp1_yearly_9001_shy_kid.Custom2('MyCharacterIntroduction', ROOT.Char)] ผู้น่ารัก มาหาข้าในวันนี้พร้อมน้ำตาแห่งความปิติยินดีในดวงตาของ [bp1_yearly_9001_shy_kid.GetHerHis] เล่าว่าของเล่นชิ้นโปรดของ [bp1_yearly_9001_shy_kid.GetHerHis] เกือบถูกทำลายโดย [bp1_yearly_9001_toy_hater.GetName] แต่ก็ได้รับการละเว้น\n\nปฏิกิริยานั้นออกจะเกินเลยไปหน่อยสำหรับสิ่งที่เทียบเท่ากับก้อนไม้ที่ไม่ถูกเด็กอีกคนทุบทิ้ง แต่นี่ก็ถือเป็นโอกาสในการเรียนรู้อยู่ดี"
 bp1_yearly.9003.a.child:0 "ข้าว่า [bp1_yearly_9001_toy_hater.GetSheHe] ก็ไม่ได้แย่นักนี่นา"
 bp1_yearly.9003.a.mentor:0 "เห็นไหม แม้ แต่คนพาลก็ยังมีช่วงเวลาดีๆ ได้"
 bp1_yearly.9003.b.child:0 "ทีนี้ข้าก็ไม่ต้องการใครอื่นอีกแล้ว!"
 bp1_yearly.9003.b.mentor:0 "แต่ [bp1_yearly_9001_toy_hater.GetSheHe] #EMP น่าจะ #! ทำลายมันไปแล้ว!"
 
 bp1_yearly.9004.t:0 "มิตรภาพที่แตกสลาย"
 bp1_yearly.9004.desc:0 "ข้าไม่อยากจะเชื่อเลย ชั่วขณะหนึ่ง สหายรักของข้ายังอยู่ในอ้อมแขนข้าอย่างปลอดภัย ถัดมา [ROOT.Char.GetSheHe] ก็ถูกฉุดกระชากเข้าไปอยู่ในอุ้งมือหยาบกระด้างของ [bp1_yearly_9001_toy_hater.GetNamePossessive]! ดุจดัง [ROOT.Char.GetFaith.DevilName] [ROOT.Char.GetFaith.DevilHerselfHimself] [bp1_yearly_9001_toy_hater.GetSheHe] หัวเราะลั่นแล้วชู [ROOT.Char.GetHerHim] ขึ้นไปในอากาศ ก่อนจะฟาด [ROOT.Char.GetHerHim] ลงกับพื้นอย่างรวดเร็ว ทิ้ง [ROOT.Char.GetHerHim] ไว้เป็นเพียงเศษไม้แตกกระจายบนพื้น ข้าร่ำไห้ให้กับสหายอันเป็นที่รัก พยายามอย่างบ้าคลั่งที่จะประกอบ [ROOT.Char.GetHerHim] กลับคืนดังเดิม แต่ก็เปล่าประโยชน์ ข้าเพิ่งได้เห็นเหตุฆาตกรรม"
 bp1_yearly.9004.a:0 "สักวันหนึ่ง ข้าจะทำ เช่นเดียวกันกับ [bp1_yearly_9001_toy_hater.GetHerHim]!"
 bp1_yearly.9004.b:0 "มันยากยิ่งนัก แต่ข้าต้องให้อภัย [bp1_yearly_9001_toy_hater.GetHerHim]"
 bp1_yearly.9004.c:0 "ข้าจะไม่ออกไปข้างนอกอีกแล้ว!"
 
 bp1_yearly.9005.t:0 "มิอาจให้อภัย"
 bp1_yearly.9005.desc.imprisoned:0 "ในที่สุดข้าก็ได้จับ [bp1_yearly_9001_toy_hater.Custom2('MyCharacterIntroduction', ROOT.Char)] ขังไว้ในคุกใต้ดินที่ ซึ่ง [bp1_yearly_9001_toy_hater.GetSheHe] สมควรอยู่! [bp1_yearly_9001_toy_hater.SheHe|U] อาจจะลืมไปแล้วว่า [bp1_yearly_9001_toy_hater.GetSheHe] ได้ทำลายของเล่นล้ำค่า สหายรักของข้า เมื่อหลายปีก่อน แต่ข้าไม่เคยลืม ข้าไม่เคยลืมและแทบจะไม่ให้อภัยเลย\n\n"
 bp1_yearly.9005.desc.guest:0 "ทันทีที่ข้าคิดว่าจะได้พบกับความสงบสุขสักครู่ ข้าก็เห็น [bp1_yearly_9001_toy_hater.Custom2('MyCharacterIntroduction', ROOT.Char)] มาถึงในฐานะแขกในราชสำนักของข้า! ข้าเห็น [bp1_yearly_9001_toy_hater.GetHerHim] ทุกวัน กินอาหารของข้า นอนบนเตียงของข้า ประหนึ่งว่า [bp1_yearly_9001_toy_hater.GetSheHe] เป็นเจ้าของสถานที่แห่งนี้ และข้าสุดจะทนทานได้อีกต่อไป!\n\n"
 bp1_yearly.9005.desc.outro:0 "คำถามยังคงอยู่ บัดนี้เมื่อ [bp1_yearly_9001_toy_hater.GetSheHe] อยู่ในกำมือของข้าแล้ว ข้าจะทำอย่างไรกับ [bp1_yearly_9001_toy_hater.GetHerHim] ดี? จะบรรลุ ซึ่งความยุติธรรมสำหรับอาชญากรรมอันร้ายแรง เช่นนี้ได้อย่างไรกันแน่?"
 bp1_yearly.9005.a:0 "ถึงเวลาชำระแค้น!"
 bp1_yearly.9005.b:0 "ถึงเวลาสังหาร!"
 bp1_yearly.9005.c:0 "ถึงเวลาให้อภัย"
 may_lead_to_vengeful:0 "อาจนำไปสู่ [trait|E] [GetTrait('vengeful').GetName( GetNullCharacter )|LV]"
 may_lead_to_forgiving:0 "อาจนำไปสู่ [trait|E] [GetTrait('forgiving').GetName( GetNullCharacter )|LV]"
 may_lead_to_shy:0 "อาจนำไปสู่ [trait|E] [GetTrait('shy').GetName( GetNullCharacter )|LV]"
 bp1_living_as_peasant_modifier:0 "ใช้ชีวิตเยี่ยงไพร่"
 bp1_living_as_peasant_modifier_desc:0 "ตัวละครนี้กำลังใช้เวลาส่วนใหญ่อยู่ท่ามกลางชาวบ้านในท้องถิ่นเพื่อหลีกหนีจากแรงกดดันของการปกครอง"
 
 bp1_yearly.9006.t:0 "ข้อพิจารณาอันชั่วร้าย"
 bp1_yearly.9006.desc.intro:0 "ขณะที่ข้าเดินทางกลับจาก [ROOT.Char.GetFaith.HouseOfWorship] [bp1_yearly_9006_sinful_courtier.GetNameNoTooltip] ก็เข้ามาหาข้าพร้อมรอยยิ้มราคะ\n\n"[ROOT.Char.GetFirstNameNoTooltip] ข้ารู้ว่าท่านและข้าต่างก็"
 bp1_yearly.9006.desc.lustful:0 "เสพสมความสุขทางเนื้อหนัง ซึ่งเหล่า [ROOT.Char.GetFaith.PriestNeuterPlural] อยากให้เราปฏิเสธ!"
 bp1_yearly.9006.desc.gluttonous:0 "มีความหลงใหลในรสชาติและเนื้อสัมผัสนับไม่ถ้วนที่โลกนี้มอบให้เราผ่านศาสตร์อันน่าอัศจรรย์แห่งการปรุงอาหาร โลกถูกสร้างขึ้นพร้อมอาหารเลิศรสมากมาย บาปที่แท้จริงคือการไม่ลิ้มลองมันทั้งหมดต่างหาก!"
 bp1_yearly.9006.desc.vengeful:0 "ชื่นชมยินดีเมื่อศัตรูของเราได้รับผลกรรมที่สาสม แม้เหล่า [ROOT.Char.GetFaith.PriestNeuterPlural] จะเรียกความยินดีในความทุกข์ของศัตรูว่า "บาป" ข้าเชื่อว่าเราเป็นเพียงผู้ส่งมอบความยุติธรรมจากสวรรค์"
 bp1_yearly.9006.desc.sadistic:0 "ลิงโลดไปกับเสียงกรีดร้องโหยหวนของผู้บริสุทธิ์และผู้ถูกสาปแช่ง! หากพวกเขาจะต้องตายอยู่แล้ว ไยไม่หาความสุขกับพวกเขาก่อนที่พวกเขาจะจากไปเล่า?"
 bp1_yearly.9006.desc.craven:0 "เหนื่อยหน่ายกับการป่าวประกาศการกระทำอัน "กล้าหาญ" ที่พวกคนเถื่อนเหล่านี้โอ้อวดนักหนา แล้วอย่างไรเล่าหากพวกเขาสังหาร [ROOT.Char.Custom('GetAnimalType')] ได้? นั่นมันก็แค่ความเสี่ยงที่ไม่จำเป็น!"
 bp1_yearly.9006.desc.arbitrary:0 "รู้ว่าความยุติธรรมเป็นเพียงคำศัพท์เพื่อรับรองความต้องการของผู้อื่น และแท้จริงแล้วไม่มีใครรู้ว่าอะไรคือความยุติธรรม สิ่งใดเล่า ทำให้เจตจำนงของเราเป็นการตามอำเภอใจ แต่เจตจำนงของเหล่า [ROOT.Char.GetFaith.PriestNeuterPlural] กลับเป็นธรรม?"
 bp1_yearly.9006.desc.deceitful:0 "รู้ว่า "ความจริง" นั้นช่างน่าบันเทิงใจที่สามารถดิ้นได้ และผู้ที่โง่เขลาพอที่จะตกหลุมพรางการหลอกลวงก็สมควรได้รับผลที่ตามมา"
 bp1_yearly.9006.desc.chaste:0 "เบื่อหน่ายในกามสุขที่ศาสนจักรอยากให้เราหมกมุ่นดุจสัตว์ชั้นต่ำ การได้ใช้ค่ำคืนอันเงียบสงบเพื่อความบันเทิงและการใคร่ครวญไตร่ตรอง ไม่สงบสุขกว่าการเข้าร่วมกองร่างชุ่มเหงื่อเหม็นเน่าอีกกองหนึ่งหรอกหรือ?"
 bp1_yearly.9006.desc.greedy:0 "รู้ว่าเราต้องยึดมั่นในสิ่งที่เป็นของเรา และไม่ให้อะไรแก่คนจนและ "ผู้ขัดสน"! หากพวกเขาปรารถนาความมั่งคั่งของเรา บางทีพวกเขาไม่ควรผลาญทรัพย์สินของตนเอง"
 bp1_yearly.9006.desc.wrathful:0 "ไม่ปิดบังอารมณ์ของเรา และปล่อยให้ความเกลียดชังและความโกรธไหลเวียนผ่านร่างกายอย่างอิสระและไร้การควบคุม พวกเขาบอกเราไม่ให้รู้สึกถึงความรู้สึกของเราและยับยั้งสิ่งที่อยู่ภายใน แล้วเรียกการกระทำ เช่นนั้นว่าเป็นคุณธรรม"
 bp1_yearly.9006.desc.cynical:0 "ตั้งคำถามต่ออำนาจของศาสนจักรทางโลกในเรื่องทางจิตวิญญาณ [ROOT.Char.GetFaith.PriestNeuter] รู้เรื่อง [ROOT.Char.GetFaith.DivineRealm] ที่เราไม่รู้ได้อย่างไรกัน?"
 bp1_yearly.9006.desc.ambitious:0 "ปรารถนาสิ่งที่มากกว่าเศษเสี้ยวที่เราได้รับจาก [ROOT.Char.GetFaith.PantheonTerm] เมื่อแรกเกิด เราไม่อาจพอใจกับสิ่งที่เราได้รับเมื่อเรารู้ว่าเราถูกกำหนดมาเพื่อสิ่งที่ยิ่งใหญ่กว่านี้มาก!"
 bp1_yearly.9006.desc.shy:0 "พบว่าการอยู่ร่วมกับผู้อื่นนั้นเหนื่อยล้าอย่างที่สุด เราถูกคาดหวังให้พูดคุยกับผู้คนมากมาย แต่พวกเขากลับไม่มีอะไรน่าสนใจจะพูด และเราก็ไม่มีอะไรน่าสนใจจะพูดตอบ เหตุใดต้องเสียเวลากับพวกเขา ในเมื่อเราสามารถมีความสุขมากกว่าเมื่ออยู่ตามลำพัง?"
 bp1_yearly.9006.desc.callous:0 "ไม่ใส่ใจแม้สักกระผีกต่อความทุกข์ของผู้อื่น เราจะถูกคาดหวังให้ใส่ใจความรู้สึกอันเลื่อนลอยของผู้อื่นได้อย่างไร ในเมื่อความสุขที่ไม่ถูกรบกวนของเราเองกำลังตกอยู่ในความเสี่ยง?"
 bp1_yearly.9006.desc.generic:0 "ซื่อสัตย์ต่อตนเอง ไม่ว่าเหล่า [ROOT.Char.GetFaith.PriestNeuterPlural] จะพล่ามเรื่องไร้สาระใดก็ตาม"
 bp1_yearly.9006.desc.outro:0 "ท้ายที่สุดแล้ว ใครเล่าจะบอกเราได้ว่า [ROOT.Char.GetFaith.HighGodName] ต้องการให้เราดำเนินชีวิตอย่างไร?"\n\n"เห็นได้ชัดว่าเรามีอะไรที่เหมือนกันมากกว่าต่างกัน และข้าคิดว่าท่านกับข้าควรใช้เวลาร่วมกันให้มากขึ้น ห่างไกลจากสมองอันผุพังของคนธรรมดา ท่านว่าอย่างไร?""
 bp1_yearly.9006.a:0 "เป็นความคิดที่ยอดเยี่ยม ข้าเห็นด้วย!"
 bp1_yearly.9006.b:0 "ความคิดอันเป็นบาปของข้าไม่ใช่สิ่งที่จะน่าภาคภูมิใจ!"
 
 bp1_yearly.9007.t:0 "เงาสะท้อนในโคลนตม"
 bp1_yearly.9007.desc:0 "ขณะที่ข้าตรวจตราท้องถนนใน [ROOT.Char.GetCapitalLocation.GetTitle.GetNameNoTierNoTooltip] แวดล้อมด้วยคณะผู้ติดตามตามปกติทั้งองครักษ์และข้าราชบริพาร ข้าก็เห็นบางสิ่งที่ ทำให้ข้าต้องหยุดและอ้าปากค้าง\n\nขอทานชาวไพร่ผู้ไม่มีสิ่งใดปกป้อง [bp1_yearly_9007_doppelganger.GetHerselfHimself] จากดินฟ้าอากาศนอกจากโคลนและผ้าขี้ริ้ว จ้องมองกลับมาที่ข้าด้วยแววตาอ้อนวอนอย่างสิ้นหวัง ข้าคงจะเดินต่อไปแล้ว แต่มีบางอย่างที่คุ้นเคยอย่างประหลาดเกี่ยวกับคนชั้นต่ำผู้นี้\n\nจากนั้นสมาชิกในขบวนของข้าก็ชี้ให้เห็นว่า [bp1_yearly_9007_doppelganger.GetSheHe] เหมือนข้าราวกับแกะ! ช่างน่าสลดใจนักที่ได้เห็นเงาสะท้อนของตัวเองเกลือกกลั้วอยู่ในความโสโครก แต่บางทีข้าอาจทำบางสิ่งเพื่อแก้ไขความอยุติธรรมแห่งโชคชะตานี้ได้"
 bp1_yearly.9007.a:0 "[bp1_yearly_9007_doppelganger.GetSheHe|U] จะเข้าร่วมกับข้าในราชสำนัก!"
 bp1_yearly.9007.b:0 "จงกำจัดร่างแฝดอันน่าชิงชังนี้เสีย"
 bp1_yearly.9007.c:0 "เดินหน้าต่อไปและลืมสิ่งมีชีวิตอันน่าพิศวงนี้เสีย"
 
 bp1_yearly.9008.t:0 "ใช้ชีวิตเยี่ยงอีกครึ่งหนึ่งของข้า"
 bp1_yearly.9008.desc:0 "เป็นเวลาพอสมควรแล้วนับตั้งแต่ข้านำ [bp1_yearly_9007_doppelganger.GetName] เข้ามาในราชสำนัก และช่างเป็นเรื่องน่ายินดีที่ได้เห็นคนหน้าเหมือนของข้าได้ใช้ชีวิตอย่างชนชั้นสูง ไม่ต้องเกลือกกลั้วอยู่ในความสกปรกและความยากจนอีกต่อไป\n\n[bp1_yearly_9007_doppelganger.GetSheHe|U] เข้ามาหาข้าพร้อมประกายในดวงตาของ [bp1_yearly_9007_doppelganger.GetHerHis] และยื่นข้อเสนออันน่าสนใจยิ่ง "ไม่มีใครที่บ้านเกิดรู้หรอกขอรับ/เจ้าค่ะ ว่าข้ามาอยู่กับชนชั้นสูง ข้าคิดว่าเราน่าจะลองสลับตัวกันดูนะขอรับ/เจ้าค่ะ ใต้เท้า [ROOT.Char.GetLadyLord] ข้าจะทำหน้าที่แทนท่านในฐานะ [ROOT.Char.GetTitleAsNameNoTooltip] ส่วนท่านก็จะได้ใช้ชีวิตสักวันเหมือนพวกเราคนธรรมดา!""
 bp1_yearly.9008.a:0 "ผู้ปกครองจักกลายเป็นผู้ถูกปกครองสักวัน!"
 bp1_yearly.9008.b:0 "ช่างเป็นข้อเสนอที่ดูหมิ่นกันยิ่งนัก"
 
 bp1_yearly.9009.t:0 "ชู้อีกคน"
 bp1_yearly.9009.desc.intro:0 "ข้าเข้าใกล้ห้องบรรทมของข้า และได้ยินเสียงอันน่าตกใจที่ฟังดูเหมือนการต่อสู้อันรุนแรง! เสียงกระแทกดังสนั่น เสียงทุบตี และ... เสียงกรีดร้องของ [bp1_yearly_9009_lover.Custom2('MyCharacterIntroduction', ROOT.Char)]!\n\nเมื่อข้าพังเข้าไปในห้องนอน ข้าเห็นคนหน้าเหมือนของข้า [bp1_yearly_9007_doppelganger.GetNameNoTooltip] เปลือยกายล่อนจ้อนอยู่กับ [bp1_yearly_9009_lover.GetNameNoTooltip] กำลังกระทำการอันมิอาจเอ่ย!"
 bp1_yearly.9009.desc.lustful:0 "[bp1_yearly_9009_lover.GetSheHe|U] ร่ำไห้ "ข้าขอโทษ ที่รัก มันเป็นเพียง เพราะ [bp1_yearly_9007_doppelganger.GetNameNoTooltip] เป็นเพียงร่างของท่านที่งามกว่าเล็กน้อย! อกข้าสั่นระรัวเพื่อ [bp1_yearly_9007_doppelganger.GetHerHim]!""
 bp1_yearly.9009.desc:0 "[bp1_yearly_9009_lover.GetSheHe|U] ยืนกรานว่า [bp1_yearly_9009_lover.GetSheHe] ไม่รู้เลยว่านั่นไม่ใช่ข้า แต่ข้าไม่แน่ใจว่าจะเชื่อ [bp1_yearly_9009_lover.GetHerHim]"
 bp1_yearly.9009.a:0 "ไปให้พ้นหน้าข้า ทั้งคู่!"
 bp1_yearly.9009.b:0 "จงจำคุกเจ้าคนงามน่าชังนี่เสีย"
 bp1_yearly.9009.c:0 "ข้ามิอาจขวางทางรักแท้ได้"
 bp1_yearly.9009.d:0 "บัดนี้ข้าตระหนักแล้ว ข้าห่วงใยพวกเขาทั้งคู่!"
 
 bp1_yearly.9010.t:0 "สอง [ROOT.Char.GetTitleAsNameNoTooltip]"
 bp1_yearly.9010.desc.intro:0 "[bp1_yearly_9007_doppelganger.GetName] พรวดพราดเข้ามาในห้องบัลลังก์ของข้า"
 bp1_yearly.9010.desc.drunk:0 "กลิ่น [ROOT.Char.Custom('RegionalDrink')] โชยตลบอบอวลจากร่างของ [bp1_yearly_9007_doppelganger.GetHerHis] [bp1_yearly_9007_doppelganger.GetSheHe|U] เดินโซซัดโซเซมาหาข้าด้วยความเดือดดาลในแววตา\n\n"เจ้าตัวปลอม! ไอ้ *#EMP อึก#!*"
 bp1_yearly.9010.desc.stoner:0 "เหม็นกลิ่นควันกัญชาและเหงื่อ [bp1_yearly_9007_doppelganger.GetHerHis|U] ดวงตาแดงก่ำเลื่อนลอยจ้องเขม็งมายังบริเวณรอบศีรษะข้าขณะที่ [bp1_yearly_9007_doppelganger.GetSheHe] เดินโซเซอย่างเกียจคร้านเข้ามาหา หัวเราะราวกับคนบ้า [bp1_yearly_9007_doppelganger.GetWomanMan] ตลอดทาง\n\n"เจ้าตัวปลอม! ไอ้ *#EMP แค่ก#!*"
 bp1_yearly.9010.desc.outro:0 "ไอ้ [ROOT.Char.Custom2('InsultAdjective', SCOPE.sC('bp1_yearly_9007_doppelganger'))] [ROOT.Char.Custom2('InsultNoun', SCOPE.sC('bp1_yearly_9007_doppelganger'))] นั่นไม่ใช่ [ROOT.Char.GetNameNoTooltip]! ข้าคือ [ROOT.Char.GetNameNoTooltip] ตัวจริง!"\n\nแม้จะเป็นคำโกหกที่ชัดเจน ราชสำนักของข้าดูเหมือนจะปักใจเชื่อว่าตัวตนที่แท้จริงของข้ากำลังเป็นที่ถกเถียง! ขณะที่ [bp1_yearly_9007_doppelganger.GetNameNoTooltip] ชักอาวุธของ[bp1_yearly_9007_doppelganger.GetHerHis]ออกมา ก็เป็นที่ประจักษ์แล้วว่าความรุนแรงคือคำตอบเดียว"
 bp1_yearly.9010.a:0 "มีได้เพียงหนึ่งเดียวเท่านั้น!"
 bp1_yearly.9010.a_tt: "เริ่ม [single_combat_duel|E] กับ [bp1_yearly_9007_doppelganger.GetShortUIName]"
 bp1_yearly.9010.b:0 "ทหาร จับกุมเจ้าตัวปลอมนี่!"
 
 bp1_yearly.9012.t:0 "ปัญหาซ้อนปัญหา"
 bp1_yearly.9012.desc:0 ""ชัยชนะ! เห็นไหม มีเพียง [ROOT.Char.GetNameNoTooltip] ตัวจริงเท่านั้นที่จะชนะในการต่อสู้อันยุติธรรม!"\n\nคนหน้าเหมือนของข้าประกาศชัยชนะ และ แม้ว่าหลายคนดูเหมือนจะไม่เชื่อ แต่คนอื่นๆ ดูเหมือนจะคล้อยตามกับการแสดงความสามารถนี้และเริ่มประกาศว่าข้าน่าสงสัยแล้ว มีการลงคะแนนเสียงเล็กๆ ในหมู่ขุนนาง และข้าก็ยังคงได้รับการประกาศว่าเป็น [ROOT.Char.GetNameNoTooltip] ตัวจริง แม้ว่าจะด้วยคะแนนเสียงข้างมากเพียงเล็กน้อยก็ตาม\n\nแม้ว่าคนส่วนใหญ่จะยังเชื่อว่าข้าคือคนที่ข้าอ้างว่าเป็น แต่ก็มีคนจำนวนมากพอที่เชื่อว่า [bp1_yearly_9007_doppelganger.GetNameNoTooltip] คือ [ROOT.Char.GetNameNoTooltip] ตัวจริง ทำให้ [bp1_yearly_9007_doppelganger.GetSheHe] เดินจากเหตุการณ์นี้ไปพร้อมกับสิทธิ์ในการอ้างสิทธิ์ในตำแหน่งของข้าและผู้คนจำนวนมากที่เชื่อว่า [bp1_yearly_9007_doppelganger.GetSheHe] คือข้า!"
 bp1_yearly.9012.a:0 "ข้ากำลังเสียสติหรือคนอื่นกันแน่?"
 
 bp1_yearly.9013.desc:0 "เมื่อชัยชนะของข้าเหนือตัวปลอมได้รับการประกาศ ผู้ใดก็ตามที่เคยสงสัยในตัวตนที่แท้จริงของข้าดูเหมือนจะเงียบเสียงลง ทหารองครักษ์ของข้าเข้าควบคุมตัว [bp1_yearly_9007_doppelganger.GetNameNoTooltip] ผู้ ซึ่งยังคงขู่ฟ่อและเย้ยหยันข้า กรีดร้องเกี่ยวกับอาณาจักรที่พวกเขาถูกปฏิเสธ\n\nแม้ว่า [bp1_yearly_9007_doppelganger.GetNameNoTooltip] จะยังคงอ้างว่าเป็นตัวข้าจริง แต่จะมีเพียงไม่กี่คนที่จะรับฟัง [bp1_yearly_9007_doppelganger.GetHerHim] จากภายในคุกใต้ดินของข้า"
 bp1_yearly.9013.a:0 "ข้าดีใจที่เรื่องนี้จบลงเสียที"
 
 bp1_yearly.9014.t:0 "มากกว่าเพียงรูปงาม"
 bp1_yearly.9014.desc.soulmate:0 "ขณะที่ข้านอนอยู่บนเตียงกับคนรักรูปงามของข้า [bp1_yearly_9007_doppelganger.GetNameNoTooltip] ข้าพบว่าเรามีอะไรที่เหมือนกันมากกว่าแค่รูปลักษณ์ภายนอก [bp1_yearly_9007_doppelganger.GetSheHe|U] เป็นอัจฉริยะและนักปราชญ์ มักสะท้อนความรู้สึกที่ข้าเคยมีอยู่บ่อยครั้ง แต่ไม่สามารถหาคำมาอธิบายได้! ราวกับว่าจิตใจของเราเป็นหนึ่งเดียวและเราสามารถเติมเต็มความคิดของกันและกันได้ ความสัมพันธ์ เช่นนี้มีความหมายได้อย่างเดียวเท่านั้น: ความรัก!\n\nแต่ข้าหลงตัวเองถึงขนาดที่จะเรียกคนหน้าเหมือนของข้าว่ามากกว่าแค่คนรัก แต่เป็น... สหายร่วมวิญญาณ เชียวหรือ?"
 bp1_yearly.9014.desc.lover:0 "ข้าพบว่าตัวเองใช้เวลากับ [bp1_yearly_9007_doppelganger.GetName] ผู้อ่อนหวานและงดงามมากขึ้นเรื่อยๆ แม้ว่าครั้งหนึ่งข้าเคยมอง [bp1_yearly_9007_doppelganger.GetHerHim] ว่าเป็นเพียงเงาสะท้อนอันน่าหดหู่ของตัวเอง ข้าก็ได้พบว่าการอยู่ใกล้ [bp1_yearly_9007_doppelganger.GetHerHis] นั้นน่าเพลิดเพลินและปลอบประโลมใจ ขณะที่เราเดินเล่นด้วยกันในราชสำนัก เราทั้งคู่ต่างหยุดชะงักเมื่อมือของเราสัมผัสกัน\n\nแม้จะเป็นเพียงชั่วครู่ แต่ช่วงเวลาอันสั้นของการสัมผัสเนื้อแนบเนื้อนั้น ทำให้แก้มของข้าร้อนผ่าวราวกับกุหลาบไฟ และเมื่อข้าหันสายตาไปยัง [bp1_yearly_9007_doppelganger.GetNameNoTooltip] อย่างกระวนกระวาย ดูเหมือนว่า [bp1_yearly_9007_doppelganger.GetSheHe] ก็รู้สึก เช่นเดียวกัน\n\nข้าหลงตัวเองถึงขนาดที่จะพิจารณาเรียกคนหน้าเหมือนของข้าว่า... คนรัก เชียวหรือ?"
 bp1_yearly.9014.a:0 "แน่นอน ข้าเป็น เช่นนั้น!"
 bp1_yearly.9014.a.arrogant:0 "ข้ารักข้า- เอ่อ ข้าหมายถึง ท่าน มาก!"
 bp1_yearly.9014.b:0 "ม-ไม่! เราทำไม่ได้!"
 
 bp1_yearly.9015.t:0 "ต้องมีสอง"
 bp1_yearly.9015.desc:0 "นับตั้งแต่ข้าเริ่มใช้เวลากับ [bp1_yearly_9007_doppelganger.GetName] ผู้มีเสน่ห์และงดงาม [bp1_yearly_9015_living_parent.Custom2('MyCharacterIntroduction', ROOT.Char)] ก็ดูครุ่นคิดและกระสับกระส่าย บางที [bp1_yearly_9015_living_parent.GetSheHe] อาจไม่เห็นด้วยกับความสัมพันธ์ของเรา?\n\nด้วยแรงกดดันบางอย่าง [bp1_yearly_9015_living_parent.GetNameNoTooltip] ก็ระเบิดคำสารภาพทั้งน้ำตา "เจ้าเป็นฝาแฝด [ROOT.Char.GetFirstNameNoTooltip]! เมื่อเจ้าเกิด ข้าไม่ต้องการให้การสืบทอดตำแหน่งของเจ้าถูกท้าทาย ข้าจึงแยกเจ้าทั้งสองออกจากกัน ข้าไม่เคยคิดว่าพวกเจ้าจะได้พบกัน!"\n\nเป็นคำสารภาพที่น่าตกใจอย่างยิ่ง แต่ข้าจะทำอย่างไรกับข้อมูลนี้ได้?"
 bp1_yearly.9015.a:0 "กอดข้าที [bp1_yearly_9007_doppelganger.Custom('SisterBrother')]!"
 bp1_yearly.9015.b:0 "ต้องไม่มีใครรู้เรื่องนี้"
 
 bp1_yearly.9016.t:0 "[bp1_yearly_9016_uppity_child.GetWomanMan|U] ผู้หมายปองจะเป็น [ROOT.Char.GetTitleAsNameNoTooltip]"
 bp1_yearly.9016.desc.intro:0 "สิ่งที่เริ่มต้นเป็นการรวมญาติปกติในห้องอาหารของ [ROOT.Char.GetCapitalLocation.GetTitle.GetNameNoTierNoTooltip] ได้ปะทุกลายเป็นการโต้เถียงอย่างดุเดือดระหว่าง [bp1_yearly_9016_heir.Custom2('MyCharacterIntroduction', ROOT.Char)] และ [bp1_yearly_9016_uppity_child.Custom2('MyCharacterIntroduction', ROOT.Char)] อย่างรวดเร็ว!\n\n[bp1_yearly_9016_uppity_child.GetSheHe|U] ยืนกรานว่า [bp1_yearly_9016_heir.GetNameNoTooltip] ไม่คู่ควรที่จะเป็นทายาทของข้าเลยแม้ แต่น้อย\n\n"
 bp1_yearly.9016.desc.not_a_child:0 ""[bp1_yearly_9016_heir.GetSheHe|U] ไม่ใช่แม้ แต่ [bp1_yearly_9016_heir.Custom('GetDaughterSon')] ของท่านด้วยซ้ำ! [bp1_yearly_9016_heir.GetSheHe] มีสิทธิ์อันใดที่จะสืบทอดต่อจากข้าเมื่อท่านจากไปยัง [ROOT.Char.GetFaith.PositiveAfterLife]?"
 bp1_yearly.9016.desc.bastard:0 ""[bp1_yearly_9016_heir.GetSheHe|U] ไม่ใช่ [bp1_yearly_9016_heir.Custom('GetDaughterSon')] ที่ชอบธรรมของตระกูลนี้ ข้าเกิดมาอย่างถูกต้องภายใต้ขอบเขตของการสมรสของบิดามารดาข้า เหตุใดบุตรนอกกฎหมายผู้นี้จึงควรได้ครองบัลลังก์?"
 bp1_yearly.9016.desc.child_of_concubine:0 ""[bp1_yearly_9016_heir.GetSheHe|U] เกิดจากนางสนมต่ำต้อย! ข้าคือผลผลิตจาก [bp1_yearly_9016_uppity_child.Custom('GetCulturallyAppropriateMarriageReference')] ระหว่างท่านกับ [bp1_yearly_9016_uppity_child.GetMother.GetName] และบัลลังก์ย่อมเป็นของข้าโดยสิทธิ์ แต่กำเนิด!"
 bp1_yearly.9016.desc.rival:0 ""[bp1_yearly_9016_heir.GetSheHe|U] ทรยศท่านมานับพันครั้งแล้ว ในขณะที่ข้ายังคงภักดีต่อท่าน! เราจะไว้วางใจสัตว์ร้ายมักมากในกามผู้นี้ให้ดูแล [ROOT.Char.GetPrimaryTitle.GetNameNoTierNoTooltip] ได้อย่างไรเมื่อท่านจากไป ในเมื่อ [bp1_yearly_9016_heir.GetSheHe] ไม่สามารถแม้ แต่จะดูแลท่าน ในขณะที่ท่านยังอยู่ที่นี่?"
 bp1_yearly.9016.desc.fallback:0 ""[bp1_yearly_9016_heir.GetSheHe|U] ไม่คู่ควรกับมงกุฎโดยสิ้นเชิง และไม่สมควรได้รับอะไรมากไปกว่าการเป็นตัวตลกหลวงของข้าเมื่อข้าสืบทอดตำแหน่ง! คนชั่วผู้นี้อยู่ในอันดับแรกสำหรับมงกุฎมานานพอแล้ว และสมควรถูกสั่งสอนให้รู้ที่ต่ำที่สูงของ [bp1_yearly_9016_heir.GetHerHis]"
 bp1_yearly.9016.desc.outro:0 "ข้าขอท้าประลองกับเจ้า [bp1_yearly_9016_heir.GetNameNoTooltip]! การประลองเพื่อชิงบัลลังก์!""
 bp1_yearly.9016.a:0 "โอ้ เรื่องนี้ต้องสนุกแน่"
 bp1_yearly.9016.b:0 "นั่งลงเสีย เจ้าคนโง่!"
 9016_uppity_child_wins:0 "[bp1_yearly_9016_uppity_child.GetName] ชนะการประลอง"
 9016_heir_wins:0 "[bp1_yearly_9016_heir.GetName] ชนะการประลอง"
 
 bp1_yearly.9017.t.culture:0 "[bp1_yearly_9017_uppity_child.Custom('GetPrincessPrince')] ต่างถิ่น"
 bp1_yearly.9017.t.faith:0 "[bp1_yearly_9017_uppity_child.Custom('GetPrincessPrince')] นอกรีต"
 bp1_yearly.9017.desc.intro:0 "ข้างกองไฟยามค่ำคืน ข้าเห็น [bp1_yearly_9017_uppity_child.Custom2('MyCharacterIntroduction', ROOT.Char)] นั่งหน้าเคร่งเครียดด้วยความเข้มข้นดุจ [ROOT.Char.GetFaith.KnowledgeGodName] ข้าถาม [bp1_yearly_9017_uppity_child.GetHerHim] ว่าสิ่งใดรบกวนจิตใจ [bp1_yearly_9017_uppity_child.GetHerHim] นัก และ [bp1_yearly_9017_uppity_child.GetSheHe] หันมาหาข้าด้วยความโกรธและความละอายที่แผดเผาในดวงตาของ [bp1_yearly_9017_uppity_child.GetHerHis]\n\n"
 bp1_yearly.9017.desc.culture:0 ""ข้าแตกต่างจากพวกท่านที่เหลือ! ข้าไม่รู้จักขนบธรรมเนียมและประเพณีของ [ROOT.Char.GetCulture.GetName] ข้ารู้สึกโดดเดี่ยวที่นี่ เป็น [bp1_yearly_9017_uppity_child.GetWomanMan] ชาว [bp1_yearly_9017_uppity_child.GetCulture.GetName] ที่อาศัยอยู่ท่ามกลาง [ROOT.Char.GetCulture.GetCollectiveNoun] ในราชสำนักราวกับว่าข้ามีสิทธิ์ใดๆ ที่จะเรียกตัวเองว่าเป็นหนึ่งในพวกเขา"
 bp1_yearly.9017.desc.faith:0 ""ข้าไม่เหมือนพวกเขา! ข้าไม่ได้สวดภาวนาและบูชาในแบบเดียวกับที่พวกท่าน [ROOT.Char.GetFaith.GetAdherentNamePluralNoTooltip] ทำ! ข้าเป็น [bp1_yearly_9017_uppity_child.GetFaith.GetAdherentNameNoTooltip] ที่ถูกกำหนดให้สืบทอด [ROOT.Char.GetPrimaryTitle.GetTierAsNameNoTooltip|L] ของพวกนอกศาสนา"
 bp1_yearly.9017.desc.outro:0 "ข้าคือตัวปลอมและข้าไม่สามารถเป็นทายาทของท่านได้อีกต่อไป!""
 bp1_yearly.9017.a:0 "ความแตกต่างของเราควรได้รับการเฉลิมฉลอง [ROOT.Char.Custom2('RelationToMe', bp1_yearly_9017_uppity_child)] ของข้า!"
 bp1_yearly.9017.b.culture:0 "จะเป็น [bp1_yearly_9017_uppity_child.GetCulture.GetName] หรือ [ROOT.Char.GetCulture.GetName] เจ้าก็ยังคงเป็น [ROOT.Char.Custom2('RelationToMe', bp1_yearly_9017_uppity_child)] ของข้า"
 bp1_yearly.9017.b.faith:0 "จะเป็น [bp1_yearly_9017_uppity_child.GetFaith.GetAdherentNameNoTooltip] หรือ [ROOT.Char.GetFaith.GetAdherentNameNoTooltip] เจ้าก็ยังคงเป็น [ROOT.Char.Custom2('RelationToMe', bp1_yearly_9017_uppity_child)] ของข้า"
 bp1_yearly.9017.c:0 "ความคิดยอดเยี่ยม เจ้าถูกถอดถอนสิทธิ์ทายาท!"
 cultural_acceptance_embraced_child:0 "การเฉลิมฉลองทางวัฒนธรรม"
 cultural_acceptance_rejected_child:0 "การกีดกันทางวัฒนธรรม"
 
 bp1_yearly.9018.t:0 "ตัณหาหรือความบริสุทธิ์"
 bp1_yearly.9018.desc.intro:0 "ในชั่วขณะที่อ่อนแอ [bp1_yearly_9018_illegitimate_child.Custom2('MyCharacterIntroduction', ROOT.Char)] วิ่งมาหาข้า โอบแขนของ [bp1_yearly_9018_illegitimate_child.GetHerHis] รอบขาข้า ป้ายทั้งน้ำตาและน้ำมูกใส่ข้า\n\n"
 bp1_yearly.9018.desc.bastard:0 ""ท่าน [ROOT.Char.GetMotherFather|U]! มันช่าง *#EMP สะอื้น#!* เลวร้ายนัก ข้าทนต่อไปไม่ไหวแล้ว! [bp1_yearly_9018_bully.GetName|U] ล้อเลียนข้าไม่หยุดหย่อน กล่าวว่าข้าเกิดมาไร้ศีลธรรมและไม่คู่ควรแก่ความรักของท่าน บอกข้าทีว่ามันไม่จริง!"\n\n"
 bp1_yearly.9018.desc.child_of_concubine: "\"[ROOT.Char.GetMotherFather|U]! [bp1_yearly_9018_bully.GetName|U] บอกว่าลูกของนางสนมไม่บริสุทธิ์! [bp1_yearly_9018_bully.GetSheHe|U] เอา แต่บีบจมูกของ[bp1_yearly_9018_bully.GetHerHis]แล้วบอกว่าข้าเหม็นกลิ่นเลือดของนางสนม บอกข้าทีว่าท่านรักข้า [ROOT.Char.GetMotherFather]!\"\n\n"
 bp1_yearly.9018.desc.outro.callous:0 "ณ จุดนี้ ข้าคงจะบอกอะไรก็ได้แก่เจ้าตัวเล็กนี่ เพื่อให้มันไปพ้นๆ เสีย แต่ข้าควรจะพูดอะไรดี?"
 bp1_yearly.9018.desc.outro:0 "นี่เป็นช่วงเวลาที่ละเอียดอ่อนอย่างยิ่งสำหรับ [bp1_yearly_9018_illegitimate_child.Custom('GirlBoy')] ผู้นี้ แต่ควรจะพูดอะไรดีเล่า?"
 bp1_yearly.9018.a:0 "บางทีอาจถึงเวลาที่เราสามคนต้องคุยกัน"
 bp1_yearly.9018.b:0 "[bp1_yearly_9018_bully.Custom('GirlBoyPlural')|U] ก็ยังคงเป็น [bp1_yearly_9018_bully.Custom('GirlBoyPlural')] วันยังค่ำ!"
 bp1_yearly.9018.c:0 "เหตุใดเจ้าร้องไห้? เรื่องนี้แก้ไขได้ด้วยความรุนแรงอย่างชัดเจน"
 9018_uppity_child_wins:0 "[bp1_yearly_9018_illegitimate_child.GetName] ชนะการประลอง"
 9018_bully_child_wins:0 "[bp1_yearly_9018_bully.GetName] ชนะการประลอง"
 
 bp1_yearly.9019.t:0 "[bp1_yearly_9019_lover.GetWomanMan|U] ในเตียงของเรา"
 bp1_yearly.9019.desc.intro.gay:0 "เวลาที่ข้าหวั่นเกรงมาถึงแล้ว ข้าหน้าเบ้เล็กน้อยและเดินเขย่งเท้าเข้าไปใน [ROOT.Char.Custom('GetChamber')] ของข้า โดยรู้ว่า [bp1_yearly_9019_spouse.Custom2('MyCharacterIntroduction', ROOT.Char)] กำลังรออยู่ข้างใน คาดหวังค่ำคืนแห่งการร่วมรักอันไร้รักใคร่"
 bp1_yearly.9019.desc.intro.bi:0 "ถึงเวลาแล้วที่จะต้องเข้าสู่ [ROOT.Char.Custom('GetChamber')] ของข้าอีกครั้ง และพยายามสร้างทายาทกับ [bp1_yearly_9019_spouse.Custom2('MyCharacterIntroduction', ROOT.Char)]"
 bp1_yearly.9019.desc.bridge:1 "ทว่า สิ่งที่น่าประหลาดใจคือ ข้าเห็น [bp1_yearly_9019_spouse.GetHerHim] แต่งกายเต็มยศอยู่ข้าง [bp1_yearly_9019_lover.GetWomanMan] เปลือยกาย! ข้าเรียกร้องคำอธิบาย ทำให้รอยยิ้มอย่างรู้ทันปรากฏขึ้นบนใบหน้าของ [bp1_yearly_9019_spouse.GetHerHis]\n\n"
 bp1_yearly.9019.desc.bridge.gay:0 ""ข้ารู้มาสักพักแล้วว่าสัมผัสของ [bp1_yearly_9019_spouse.GetWomanMan] มิอาจจุดไฟปรารถนาในกายท่านได้"
 bp1_yearly.9019.desc.bridge.bi:0 ""ข้ารู้มาสักพักแล้วว่าท่านโหยหาสัมผัสของ [bp1_yearly_9019_lover.GetWomanMan] เช่นเดียวกัน"
 bp1_yearly.9019.desc.compassionate:0 "ข้ามิได้ขุ่นเคืองหรืออิจฉา ข้าเพียงต้องการให้ท่านมีความสุข ดังนั้นบางทีการร่วมรักของเราอาจจะเปี่ยมด้วยรักมากขึ้นหากเราให้สหาย [bp1_yearly_9019_lover.GetWomanMan] ของท่านเข้าร่วมด้วย!""
 bp1_yearly.9019.desc.lustful:0 "สำหรับข้าแล้วไม่ต่างกัน ข้าเพียงปรารถนาค่ำคืนแห่งตัณหา! บางทีมันอาจจะน่าเพลิดเพลินยิ่งขึ้นสำหรับเราทั้งคู่หากเราให้สหายของเราผู้นี้เข้าร่วมในการร่วมรักของเรา""
 bp1_yearly.9019.desc.cynical:0 "พูดตามตรง ข้าไม่สนใจว่าท่านต้องการจะร่วมสังวาสกับใครหรือสิ่งใด ข้าเพียงปรารถนาทายาทที่แท้จริงของข้าเอง ซึ่งเกิดจากการสมรสของเรา""
 bp1_yearly.9019.desc.lover:0 "\n\nข้าสงสัยว่า [bp1_yearly_9019_spouse.GetSheHe] รู้หรือไม่ว่า [bp1_yearly_9019_lover.GetName] และข้าต่างคุ้นเคยกับร่างกายของกันและกันเป็นอย่างดีอยู่แล้ว แต่ไม่ว่าจะอย่างไร นี่เป็นเรื่องน่าประหลาดใจที่ไม่คาดฝันอย่างยิ่ง!"
 bp1_yearly.9019.desc.friend:0 "\n\nแม้ข้าไม่เคยคาดคิดว่าจะได้เห็นสหายรักของข้าอยู่ในสภาพล่อแหลม เช่นนี้ แต่ข้าก็มิอาจกล่าวตามสัตย์จริงได้ว่าข้าไม่ชอบสิ่งที่ข้าเห็น"
 bp1_yearly.9019.desc.stranger:0 "\n\nข้าสงสัยนักว่า [bp1_yearly_9019_spouse.GetSheHe] ไปพบ [bp1_yearly_9019_lover.GetWomanMan] ผู้น่าสงสารนี้มาจากไหน แต่ [bp1_yearly_9019_lover.GetSheHe] ดูท่าทางกระตือรือร้นยิ่งนัก"
 bp1_yearly.9019.desc.outro:0 ""
 bp1_yearly.9019.a:0 "สาบานต่อ [ROOT.Char.GetFaith.FertilityGodName] ความปรารถนาทั้งหมดของข้าเป็นจริงแล้วหรือ?"
 bp1_yearly.9019.b:0 "เงียบนะ เจ้า [bp1_yearly_9019_spouse.Custom2('InsultNoun', ROOT.Char)]! ข้าจะนอนกับ [bp1_yearly_9019_lover.GetHerHim] แต่เพียงผู้เดียว!"
 bp1_yearly.9019.c:0 "อะไรนะ? ไม่ ข้าทำ เช่นนั้นไม่ได้!"
 
 bp1_yearly.9020.t:0 "คำขออันพิลึก"
 bp1_yearly.9020.desc.intro:0 "ถึงเวลาอีกครั้งที่ข้าจะต้องพยายามมีบุตรกับ [bp1_yearly_9020_spouse.Custom2('MyCharacterIntroduction', ROOT.Char)] แต่ขณะที่ข้าเตรียมตัวสำหรับค่ำคืนแห่งการร่วมรักอันไร้ ซึ่งความปรารถนาอีกครั้ง [bp1_yearly_9020_spouse.GetSheHe] ก็จ้องมองข้าด้วยแววตาที่น่าสะพรึงกลัวในดวงตาของ [bp1_yearly_9020_spouse.GetHerHis]\n\n"การร่วมรักแบบเดิมๆ ช่างน่าเบื่อ ท่านไม่เห็นด้วยหรือ? ท่านเคยพิจารณาบ้างไหม"
 bp1_yearly.9020.desc.goat:0 "คนเราจะทำอะไรกับแพะได้บ้าง? เขานั่น เคราแพะรุงรังนั่น ลักษณะที่ไม่เลือกกินของมัน เหตุใดเล่า หากเราสามารถนำมันเข้ามาใน [ROOT.Char.Custom('GetChamber')] ได้ กลิ่นแรงของมันเพียงอย่างเดียวก็เพียงพอที่จะปลุกเร้าอารมณ์ข้าให้ลุกโชนได้แล้ว!""
 bp1_yearly.9020.desc.vegetable:0 "ความเร้าอารมณ์ตามธรรมชาติของผักหัว? เพียงจินตนาการว่ามันจะรู้สึกอย่างไรที่ได้มีของขวัญจากผืนดินของ [ROOT.Char.GetFaith.CreatorNamePossessive] ชิ้นหนึ่งแนบชิดกับผิวของท่านในจุดที่บอบบางที่สุด?""
 bp1_yearly.9020.desc.bondage:0 "มันรู้สึกอย่างไรที่ได้เป็นหนึ่งในนักโทษของเรา? ถูกพันธนาการด้วยโซ่ตรวน อยู่ภายใต้อำเภอใจของผู้คุมอันโหดร้ายที่มีความคันอยากจะ ทำให้ท่านกรีดร้อง เพียงพิจารณาดูว่ามันง่ายเพียงใดที่จะหาโซ่และ... อุปกรณ์บางอย่างจาก [ROOT.Char.Custom('GetDungeon')]""
 bp1_yearly.9020.desc.feet:0 "มันรู้สึกอย่างไรที่ได้เป็นพื้นดินใน [ROOT.Char.Custom('GetChamber')] ของเรา? เท้าเปล่าเหล่านั้นกดลงบนตัวตนของท่าน เป็นเพียงวัตถุที่จะถูกใช้และเหยียบย่ำโดยผู้อื่น เพียงแค่คิดถึงมันก็ ทำให้กายข้าร้อนรุ่มแล้ว!""
 bp1_yearly.9020.desc.hof:0 "มันจะเป็น เช่นไรหากได้นอนกับ [ROOT.Char.ReligiousHeadTitleName]? ตลอดเวลา นิ้วมือของ [ROOT.Char.ReligiousHeadTitleName] พลิกผ่านคัมภีร์ศักดิ์สิทธิ์ ลองจินตนาการดูสิว่ามันต้องรู้สึกอย่างไร! จงเป็น [ROOT.Char.ReligiousHeadTitle] ของข้า และ ทำให้ข้าเป็น [ROOT.Char.GetFaith.ReligiousText] ของท่าน!""
 bp1_yearly.9020.desc.outro:0 "\n\nข้าหมดคำจะกล่าวถึงสิ่งที่ข้าเพิ่งได้ยิน แต่ในฐานะ [ROOT.Char.GetTitleAsNameNoTooltip] เป็นหน้าที่ของข้าที่จะต้อง ทำให้ [bp1_yearly_9020_spouse.GetTitleAsNameNoTooltip] พอใจและนำบุตรที่เกิดโดยชอบธรรมมาสู่โลกนี้มากขึ้น ไม่ว่าจะต้องแลกด้วยอะไรก็ตาม ใครจะรู้? บางทีข้าอาจจะชอบมันก็ได้"
 bp1_yearly.9020.a:0 "อะไรก็ได้เพื่อ ทำให้ท่านพอใจ"
 bp1_yearly.9020.b:0 "ไม่! อะไรก็ได้ที่ไม่ใช่สิ่งนั้น!"
 bp1_yearly.9020.c:0 "ทุกคนจะได้รู้ถึงความวิปริตอันชั่วร้ายของท่าน"
 
 bp1_yearly.9021.t:0 "[ROOT.Char.GetFaith.DevilName|U] ในเตียงข้า"
 bp1_yearly.9021.desc:0 "มิมีถ้อยคำใดจะสรรหามาอธิบายความเกลียดชังอันบริสุทธิ์ในใจข้าที่มีต่อ [bp1_yearly_9021_rival_spouse.Custom2('MyCharacterIntroduction', ROOT.Char)] ได้ แต่โอย... หน้าที่ในฐานะ [ROOT.Char.GetTitleAsNameNoTooltip] ของข้าเรียกร้องให้ข้ามองข้ามความรู้สึกส่วนตน และ "ร่วมรัก" กับ [bp1_yearly_9021_rival_spouse.Custom2('InsultAdjective', ROOT.Char)] [bp1_yearly_9021_rival_spouse.Custom2('InsultNoun', ROOT.Char)] ผู้นี้\n\nข้าคาดหวังว่าจะเกลียดทุกชั่วขณะของมัน แต่เมื่อเราเริ่มการร่วมเพศอันอ่อนปวกเปียก ข้ากลับรู้สึกถึงเปลวไฟที่ลุกโชนในกายอย่างที่ไม่เคยรู้สึกมาก่อน เมื่อมองไปยังความอาฆาตและเกลียดชังในดวงตาของ [bp1_yearly_9021_rival_spouse.GetHerHis] ข้ารู้สึกว่าหัวใจเต้นรัวและส่วนลับก็ตื่นตัว ข้าบอกได้เลยว่า [bp1_yearly_9021_rival_spouse.GetSheHe] ก็รู้สึก เช่นกัน จากท่าทีที่ [bp1_yearly_9021_rival_spouse.GetSheHe] กดข้าลง และลูบไล้มือของ [bp1_yearly_9021_rival_spouse.GetHerHis] ไปทั่วร่างข้าด้วยความดูแคลนและแรงปรารถนาที่เท่าเทียมกัน ความรู้สึกนี้คือสิ่งใด? ความรัก? ความเกลียดชัง? หรือส่วนผสมอันน่ารังเกียจของทั้งสอง?\n\nไม่ว่าความรู้สึกนี้จะเป็นสิ่งใด มันอาจจะเป็นบาป แต่การร่วมรักอันเร่าร้อนระหว่างคู่สมรสที่ แต่งงานกันในสายพระเนตรของ [ROOT.Char.GetFaith.HighGodName] จะเป็นบาปได้ฤๅ? แม้ว่าเราจะเกลียดชังกัน นั่นหมายความว่าเราไม่สามารถเพลิดเพลินกับการเสพสมตามหน้าที่ของเราได้กระนั้นหรือ?"
 bp1_yearly.9021.a:0 "ข้าเกลียดท่าน ที่รัก! กอดข้าให้แน่นขึ้น"
 bp1_yearly.9021.b:0 "ข้าคงจินตนาการไปเองว่ามีคมดาบจ่ออยู่ที่ลำคออันบอบบางนั่น"
 
 bp1_yearly.9022.t:0 "การตักเตือนฉันมิตร"
 bp1_yearly.9022.desc.intro:0 "ข้ากลับไปที่ [ROOT.Char.Custom('GetChamber')] ของข้าหลังจากวันอันยากลำบากอีกวันของการเป็น [ROOT.Char.GetTitleAsNameNoTooltip] แต่ข้าก็พบอย่างรวดเร็วว่าข้าไม่ได้อยู่คนเดียว ข้าเห็น [bp1_yearly_9022_friend.Custom2('MyCharacterIntroduction', ROOT.Char)] ยืนอยู่ด้วยสีหน้าที่ไม่ค่อยพอใจนักบนใบหน้าของ [bp1_yearly_9022_friend.GetHerHis]\n\n"[ROOT.Char.GetFirstNameNoTooltip],"
 bp1_yearly.9022.desc.hashishiyah:0 "เราทุกคนต่างก็เพลิดเพลินกับเค้กกัญชาดีๆ เป็นครั้งคราว แต่เมื่อข้าพูดคุยกับท่าน ราวกับว่าข้าพูดอยู่กับกัญชาเท่านั้น แทบไม่เหลือความเป็น [ROOT.Char.GetFirstNameNoTooltip] ที่ข้ารู้จักในตัวท่านที่อยู่ในอาการมึนเมากึ่งหลับกึ่งตื่นเกือบจะถาวรนี้เลย และข้าโหยหาการสนทนาที่สมเหตุสมผลสำหรับคนที่มีสติ"
 bp1_yearly.9022.desc.drunkard:0 "ทุกครั้งที่เราพูดคุยกัน สิ่งที่ข้าได้กลิ่นคือ [ROOT.Char.Custom('RegionalDrink')] จากลมหายใจของท่าน และคำพูดของคนขี้เมาไร้สมองที่หลุดออกมาจากปากท่านอย่างไม่ใส่ใจ มันสนุกที่จะดื่มด่ำกับเครื่องดื่มเป็นครั้งคราว แต่บอกตามตรง ข้าแทบจำไม่ได้เลยว่าครั้งสุดท้ายที่ข้าเห็นท่านมีสติคือเมื่อใด"
 bp1_yearly.9022.desc.rakish:0 "การเสพติดหญิงโสเภณีและซ่องนางโลมอย่างช่วยไม่ได้ของท่านกำลังนำภัยพิบัติร้ายแรงมาสู่ร่างกายและจิตวิญญาณของท่าน ท่านมีคู่นอนที่ไม่รู้จักมากมายเสียจนหากท่านเป็นปศุสัตว์ ข้าคงสั่งฆ่าท่านเพื่อเป็นการป้องกันและเมตตาแล้ว"
 bp1_yearly.9022.desc.comfort_eater:0 "มีสักครู่ไหมที่ท่านไม่ได้เคี้ยวอะไรอยู่? อาหารเป็นของขวัญตามธรรมชาติที่ [ROOT.Char.GetFaith.CreatorName] มอบให้เรา แต่เมื่อข้าเห็นท่านกิน เป็นที่ชัดเจนว่าไม่มีความสุขในนั้น ต้องใช้อาหารมากเท่าใดจึงจะเติมเต็มหลุมในจิตวิญญาณของท่านได้?"
 bp1_yearly.9022.desc.inappetetic:0 "ครั้งสุดท้ายที่ท่านกินอะไรคือเมื่อใด? ท่านเริ่มดูเหมือนซากศพ ผิวหนังของท่านเป็นถุงหุ้มโครงกระดูกเดินได้ เมื่อข้าเห็นท่าน สัญชาตญาณการดูแลของข้าก็ทำงานและข้าเพียงต้องการเห็นท่านเติมเต็มด้วยบางสิ่งที่อุดมสมบูรณ์และบำรุงร่างกาย จะต้องใช้เวลานานเท่าใดก่อนที่ท่านจะผ่ายผอมไปจนกลายเป็นฝุ่น?"
 bp1_yearly.9022.desc.flagellant:0 "เหตุใดท่านต้องทำร้ายตัวเอง เช่นนั้น? เมื่อท่านทำร้ายตัวเอง นั่นเพื่อ [ROOT.Char.GetFaith.HighGodName] จริงๆ หรือเป็นการร้องขออย่างสิ้นหวังให้ใครสักคนสังเกตเห็นความเจ็บปวดที่ท่านรู้สึกในจิตวิญญาณ? มาเถิด พูดคุยกับข้า ข้าทนเห็นรอยแผลเป็นอีกรอยปรากฏบนร่างกายของสหายรักของข้าไม่ได้"
 bp1_yearly.9022.desc.reclusive:0 "ข้าต้องสะกดรอยตามท่าน เพื่อที่จะได้คุยกับท่านสักคำหรือ? ครั้งสุดท้ายที่ท่านพบใครสักคนด้วยเหตุผลอื่นนอกเหนือจากหน้าที่ของท่านคือเมื่อใด? ข้าทนไม่ได้ที่จะนั่งอยู่ข้างสนาม วิงวอนขอแม้เพียงเศษเสี้ยวความสนใจจากท่าน"
 bp1_yearly.9022.desc.outro:0 "ให้ข้าช่วยท่านเถิด [ROOT.Char.GetFirstNameNoTooltip]"\n\nข้าตกตะลึงอย่างสิ้นเชิง [bp1_yearly_9022_friend.GetSheHe] เป็นใครกันถึงมาตัดสินวิถีชีวิตของข้า?\n\n"ใช้เวลาของท่านไปเถิด ข้าจะไม่ไปไหน""
 bp1_yearly.9022.a:0 "ท่านพูดถูก ข้าต้องการความช่วยเหลือ"
 bp1_yearly.9022.b:0 "ออกไป! ออกไปเดี๋ยวนี้!"
 
 bp1_yearly.9023.t:0 "อุปสรรคทางภาษา"
 bp1_yearly.9023.desc:0 "ข้ารักการใช้เวลากับ [bp1_yearly_9023_friend.Custom2('MyCharacterIntroduction', ROOT.Char)] ยิ่งนัก แม้ว่าปกติจะต้องมีล่ามก็ตาม โดยปกติแล้วอุปสรรคทางภาษาไม่ใช่ปัญหา แต่วันนี้ดูเหมือนข้าจะ ทำให้สหายรักของข้าขุ่นเคืองด้วยบางสิ่งที่ข้าพูดไป\n\n[bp1_yearly_9023_friend.GetSheHe|U] พูดบางอย่างที่ฟังดูเหมือนเรื่องตลก และข้าก็หัวเราะตามมารยาท แต่แล้ว [bp1_yearly_9023_friend.GetSheHe] ก็ถลึงตาใส่ข้า ซึ่งสื่อความหมายได้นับพันคำ ขณะที่ข้ารู้สึกว่าสายตานั้นแทงทะลุจิตวิญญาณข้า ข้าก็เห็นมิตรภาพของเรา ซึ่งอยู่เหนือภาษากำลังเลือนหายไป\n\nข้าจะทำอย่างไรเพื่อแก้ไขสถานการณ์นี้และรักษามิตรภาพนี้ไว้ได้?"
 bp1_yearly.9023.a:0 "พึมพำบางอย่างที่ฟังดูเหมือนภาษา [bp1_yearly_9023_friend.GetCulture.GetLanguage.GetNameNoTooltip] และหวังว่าจะดีที่สุด"
 bp1_yearly.9023.b:0 "บางทีข้าควรเรียนภาษา [bp1_yearly_9023_friend.GetCulture.GetLanguage.GetNameNoTooltip]"
 bp1_yearly.9023.c:0 "[bp1_yearly_9023_friend.GetNameNoTooltip] ควรเรียนภาษา [ROOT.Char.GetCulture.GetLanguage.GetNameNoTooltip]!"
 
 bp1_yearly.9024.t:0 "มือที่ห่วงใย"
 bp1_yearly.9024.desc:0 "ความเจ็บป่วยนี้กำลังสูบฉีดชีวิตไปจากข้า แต่โชคดีที่ข้ามี [bp1_yearly_9024_friend.Custom2('MyCharacterIntroduction', ROOT.Char)] คอยดูแลข้าเป็นอย่างดี ในขณะที่ข้าพักฟื้น\n\n[bp1_yearly_9024_friend.GetSheHe|U] ทำให้ข้ารู้สึกได้รับการปรนนิบัติอย่างแท้จริงแม้จะมีอาการป่วยอยู่ ทั้งทำอาหาร ซักเสื้อผ้า ดูแลข้าราวกับว่า [bp1_yearly_9024_friend.GetSheHe] ไม่ได้เป็นอะไรมากไปกว่าคนรับใช้ชั้นต่ำ!"
 bp1_yearly.9024.a:0 "เป็นการดีที่มีสหายที่ห่วงใย เช่นนี้"
 bp1_yearly.9024.b:0 "ข้าดูแลตัวเองได้!"
 bp1_sickness_being_doted_on:0 "ได้รับการดูแลเอาใจใส่"
 bp1_sickness_being_doted_on_desc:0 "ตัวละครนี้ได้รับการดูแลทุกความต้องการ ในขณะที่พวกเขากำลังป่วย"
 
 bp1_yearly.9025.t:0 "บัดนี้ข้ารู้จักเจ้าแล้ว"
 bp1_yearly.9025.desc:0 "ในที่สุด ข้าและ [bp1_yearly_9025_friend.Custom2('MyCharacterIntroduction', ROOT.Char)] ก็พูดภาษาเดียวกันได้ และได้สนทนาโต้ตอบกันมาระยะหนึ่งแล้ว\n\nปัญหาเดียวก็คือ ข้าเพิ่งตระหนักได้อย่างรวดเร็วว่า ข้ารังเกียจทุกถ้อยคำเน่าเฟะที่หลุดออกมาจากปากของ [bp1_yearly_9025_friend.Custom2('InsultAdjective', ROOT.Char)] [bp1_yearly_9025_friend.Custom2('InsultNoun', ROOT.Char)] ผู้นี้อย่างที่สุด เว้น แต่จะมีการเข้าใจผิดบางอย่าง ข้าเริ่มสงสัยแล้วว่าจะมีผู้ใดเรียก [bp1_yearly_9025_friend.GetWomanMan] ผู้นี้ว่าสหายได้อย่างจริงใจ\n\nนี่มันหายนะชัดๆ และข้าโหยหาวันเวลาที่ข้าสามารถนั่งเงียบๆ อยู่ต่อหน้า [bp1_yearly_9025_friend.GetHerHis] อันน่าอบอุ่นใจ โดยไม่รู้อะไรเลยเกี่ยวกับความเน่าเฟะในใจของ [bp1_yearly_9025_friend.GetHerHis]"
 bp1_yearly.9025.a:0 "ไปให้พ้นหน้าข้าเดี๋ยวนี้"
 bp1_yearly.9025.b:0 "บางทีข้าอาจจะยัง ทำให้เรื่องนี้ดำเนินต่อไปได้"
 
 bp1_yearly.9026.t:0 "ใบหน้าจากกาลก่อน"
 bp1_yearly.9026.desc.intro:0 "ข้าเอนกายลงบนเตียง อบอุ่นและสบายราวทารกน้อยระหว่างอกมารดา แต่ทันทีที่ดวงตาอันหนักอึ้งของข้าปิดลงเพื่อพักผ่อน ข้าก็ผุดลุกขึ้นนั่งบนเตียงเมื่อเห็นร่างหนึ่งนั่งลงข้างๆ ข้า!\n\nสิ่งที่น่าสะพรึงกลัวคือ ร่างนั้นไม่ใช่ใครอื่นนอกจากสหายผู้ล่วงลับของข้า [bp1_yearly_9026_dead_friend.GetFullName]! [bp1_yearly_9026_dead_friend.GetSheHe|U] หัวเราะอย่างเย็นชาใส่ข้าขณะที่ข้ากรีดร้องด้วยความหวาดผวา\n\n"มานี่เถิด [ROOT.Char.GetFirstNameNoTooltip] นั่นเป็นวิธีการทักทายสหายเก่าหรือ? ข้ามาหาเจ้าพร้อมคำเตือน,"
 bp1_yearly.9026.desc.secret_murderer:0 "เรารู้ว่าเจ้าทำอะไรกับ [bp1_yearly_9026_murder_victim.GetName] สหายข้า"
 bp1_yearly.9026.desc.murderer:0 "เจ้าอาจไม่มีวันได้รับการอภัยโทษสำหรับการฆาตกรรม [bp1_yearly_9026_murder_victim.GetName]"
 bp1_yearly.9026.desc.killer:0 "เจ้าคือเหตุผลที่ [bp1_yearly_9026_murder_victim.GetFullName] บัดนี้อยู่ใน [ROOT.Char.GetFaith.PositiveAfterLife|U]"
 bp1_yearly.9026.desc.greedy:0 "ผู้อยู่ในอุปการะของเจ้ากำลังแบกรับน้ำหนักจากความโลภและความละโมบอันไม่สำนึกผิดของเจ้า"
 bp1_yearly.9026.desc.wrathful:0 "ไม่มีจิตวิญญาณใดที่ไม่หวาดกลัวอารมณ์ร้ายอันน่าสะพรึงกลัวของเจ้า"
 bp1_yearly.9026.desc.torturer:0 "ความเจ็บปวดที่เจ้าสร้างอย่างยินดีต่อเพื่อน [ROOT.Char.GetWomanMan] ของเจ้านั้นเป็นอาชญากรรมต่อสามัญสำนึกพื้นฐานของมนุษย์ และทุกรูที่เจ้าเจาะลงบนผิวหนังของคนเคราะห์ร้ายผู้น่าสงสารก็ยิ่งเจาะรูลึกลงไปในหัวใจของเจ้า"
 bp1_yearly.9026.desc.arbitrary:0 "การที่เจ้าไม่สามารถเข้าใจแนวคิดเรื่องความยุติธรรมและศีลธรรมได้ ทำให้ทุกคนตัวสั่นด้วยความกลัวต่อการตัดสินใจอันย่ำแย่ของเจ้า"
 bp1_yearly.9026.desc.callous:0 "การขาดความใส่ใจและความเห็นอกเห็นใจพื้นฐานต่อความทุกข์ทรมานของผู้อื่น ทำให้การตัดสินใจของเจ้าไร้น้ำหนัก แต่หัวใจของเจ้าหนักอึ้งราวอิฐจากทุกการกระทำอันชั่วช้าที่เจ้าก่อขึ้น"
 bp1_yearly.9026.desc.sadistic:0 "แต่ละครั้งที่เจ้าสร้างความเจ็บปวดแก่ผู้อื่นอย่างยินดี เจ้ากำลังบีบรัดเชือกให้แน่นขึ้นรอบคอของจิตวิญญาณเจ้า"
 bp1_yearly.9026.desc.vengeful:0 "แต่ละครั้งที่เจ้าชำระแค้นต่อผู้ที่ทำผิดต่อเจ้า เจ้าก็ยิ่งก้าวห่างจาก [ROOT.Char.GetFaith.HighGodName|U] มากขึ้นไปอีก พวกเขามีค่าควรแก่การนั้นหรือ?"
 bp1_yearly.9026.desc.deceitful:0 "การวางแผนและการโกหกที่ไม่สิ้นสุดที่เจ้ามีส่วนร่วม เพื่อให้ได้ในสิ่งที่ต้องการ จะเป็นจุดจบของเจ้าในที่สุด เมื่อใดเล่าความจริงจะเพียงพอ? เจ้ายังรู้หรือไม่ว่าอะไรคือเรื่องจริงอีกต่อไป?"
 bp1_yearly.9026.desc.impatient:0 "การขาดความอดทนของเจ้ากำลังเปลี่ยนเจ้าให้กลายเป็นอสูรร้าย คอย แต่จะกระโจนไปยังสิ่งถัดไปและไม่เหลือที่ว่างให้แก่ผู้ที่จะ 'ทำให้เจ้าเสียเวลา'"
 bp1_yearly.9026.desc.arrogant:0 "ความรักที่เจ้ารู้สึกต่อตัวเอง ทำให้เจ้าชาชินต่อความรักของเพื่อนมนุษย์ ความรักที่มีประโยชน์อันใดเล่าหากมันอยู่ แต่เพียงภายใน?"
 bp1_yearly.9026.desc.craven:0 "ความขี้ขลาดของเจ้ากำลังทิ้งรอยด่างพร้อยไว้ในมโนธรรมของเจ้ายิ่งกว่าเลือดจากการรบใดๆ จะทำได้ มีนักรบผู้กล้าหาญกี่คนที่ตายแทนเจ้า?"
 bp1_yearly.9026.desc.ambitious:0 "ความทะเยอทะยานอันไม่สิ้นสุดของเจ้า ทำให้เจ้าใจดำต่อความทุกข์ทรมานของทุกคนที่ขวางทางในสิ่งที่เจ้าต้องการ เจ้าต้องครอบครองตำแหน่งกี่ตำแหน่ง? เจ้าต้องชนะการรบกี่ครั้งก่อนที่เจ้าจะพอใจ?"
 bp1_yearly.9026.desc.lazy:0 "ความเพิกเฉยของเจ้ากำลังปล่อยให้เจตจำนงของ [ROOT.Char.GetFaith.DevilName|U] ดำเนินต่อไปโดยไม่ถูกตรวจสอบ เจ้าคิดว่าตัวเองอยู่เหนือหน้าที่ในฐานะ [ROOT.Char.GetTitleAsNameNoTooltip] หรือ? แล้วหน้าที่ของเจ้าในฐานะ [ROOT.Char.GetWomanMan] ต่อเพื่อนมนุษย์เล่า?"
 bp1_yearly.9026.desc.cynical:0 "ความสงสัยของเจ้าในเจตจำนงของ [ROOT.Char.GetFaith.HighGodName|U] กำลัง ทำให้เจ้ากลายเป็นผู้รับใช้ของ [ROOT.Char.GetFaith.DevilName|U]!"
 bp1_yearly.9026.desc.shy:0 "การปฏิเสธที่จะมีส่วนร่วมกับเพื่อนร่วมเดินทางในชีวิตนี้ของเจ้ากำลัง ทำให้เจ้ามีความเป็นมนุษย์น้อยลงทุกวัน เจ้าคิดว่าตัวเองอยู่เหนือพวกเขาหรือ?"
 bp1_yearly.9026.desc.gluttonous:0 "การหมกมุ่นในอาหารของเจ้า ในขณะที่มีผู้ที่ไม่มีอะไรจะกินนั้นเป็นเรื่องน่าอับอาย เหตุใดจึงต้องมีจานที่สองในเมื่อมีผู้ที่จะไม่มีแม้ แต่จานแรก?"
 bp1_yearly.9026.desc.lustful:0 "ความใคร่ทางเนื้อหนังของเจ้า ทำให้เจ้าไขว้เขวจากเส้นทางที่แท้จริงสู่ [ROOT.Char.GetFaith.PositiveAfterLife|U] ไม่ว่าการร่วมสังวาสปริมาณเท่าใดก็มิอาจเทียบได้กับความรักของสวรรค์!"
 bp1_yearly.9026.desc.temperate:0 "[ROOT.Char.GetFaith.CreatorName|U] สร้างโลกนี้และอาหารทั้งหมดในนั้น เพื่อให้เจ้าได้เพลิดเพลิน แต่เจ้ากลับปฏิเสธของประทานจาก [ROOT.Char.GetFaith.CreatorHerHis|U]"
 bp1_yearly.9026.desc.chaste:0 "[ROOT.Char.GetFaith.CreatorName|U] สร้างมนุษยชาติ เพื่อให้เจ้าร่วมสังวาสด้วย แต่เจ้ากลับยังคงบริสุทธิ์ต่อความสุขและความปรารถนามากมาย"
 bp1_yearly.9026.desc.honest:0 "เจ้าคิดว่าความจริงจะ ทำให้เจ้าเป็นอิสระ ทว่าบ่อยครั้งคำโกหกกลับเป็นหนทางเดียวที่จะปกป้องผู้ที่เรารัก"
 bp1_yearly.9026.desc.fallback:0 "ทุกบาปที่เจ้าได้ก่อขึ้นในชั่วชีวิตของเจ้าได้รับการเป็นพยานโดย [ROOT.Char.GetFaith.PantheonTerm] และไม่มีสิ่งใดถูกลืมเลือน"
 bp1_yearly.9026.desc.outro:0 "เจ้าต้องสำนึกผิดในสิ่งที่เจ้าได้ทำลงไป ข้าเรียนรู้ด้วยวิธีที่เจ็บปวดว่าทุกบาปที่เราก่อขึ้นนั้นก่อหนี้ต่อ [ROOT.Char.GetFaith.HighGodName|U] สหายข้า และ [ROOT.Char.GetFaith.HighGodNameSheHe|U] ไม่ทรงให้อภัยแก่ลูกหนี้ของ [ROOT.Char.GetFaith.HighGodHerHis|U]""
 bp1_yearly.9026.a:0 "ข้าสำนึกผิด! ไม่ว่าจะต้องแลกด้วยอะไร ข้าสำนึกผิด!"
 bp1_yearly.9026.b:0 "ข้าเห็นภาพหลอนแน่ๆ! ไปให้พ้น วิญญาณร้าย!"
 
 bp1_yearly.9027.t:0 "เหล่าไพร่ผู้น่าสงสาร"
 bp1_yearly.9027.desc.intro:0 "เป็นเวลาพอสมควรแล้วนับตั้งแต่ข้าได้รับการมาเยือนจากผีของสหายเก่า [bp1_yearly_9027_dead_friend.GetName] แต่บัดนี้เริ่มต้นเส้นทางสู่การไถ่บาปของข้า ในฐานะ [ROOT.Char.GetTitleAsNameNoTooltip] บัดนี้ข้าตระหนักว่าหน้าที่ของข้าคือต่อประชาชนของข้า ดังนั้นท่ามกลางประชาชนข้าจึงเดินไปและถามพวกเขาว่าพวกเขาปรารถนาสิ่งใดจากข้า\n\n[bp1_yearly_9027_peasant_begger.GetWomanMan] ยากจนในผ้าขี้ริ้วเข้ามาหาข้าและวิงวอนให้ข้าช่วยเหลือคนยากจนและคนป่วยใน [ROOT.Char.GetCapitalLocation.GetTitle.GetNameNoTierNoTooltip] ผู้ที่ไม่มีปัญญาจะดูแลตัวเองได้"
 bp1_yearly.9027.desc.greedy:0 "สิ่งที่ [bp1_yearly_9027_peasant_begger.GetSheHe] ขอจากข้านั้นเป็นจำนวนเงินที่สูงลิ่ว,"
 bp1_yearly.9027.desc.fallback:0 "[bp1_yearly_9027_peasant_begger.GetSheHe|U] ขอเพียงพอให้ผู้คนของ [bp1_yearly_9027_peasant_begger.GetHerHis] พอประทังชีวิตไปได้,"
 bp1_yearly.9027.desc.outro:0 "แต่มีราคาค่าเข้าสู่ [ROOT.Char.GetFaith.PositiveAfterLife|U] จริงๆ หรือ?"
 bp1_yearly.9027.a:0 "เจ้าจะได้ทุกสิ่งที่เจ้าต้องการ"
 bp1_yearly.9027.b:0 "คนเหล่านี้ยากจนนัก พวกเขายอมรับข้อเสนอใดๆ ที่ข้ายื่นให้แน่!"
 bp1_yearly.9027.c:0 "เจ้าต้องการเท่าไหร่กันนะ?"
 
 bp1_yearly.9028.t:0 "ผีแห่งความบาดหมางในอดีต"
 bp1_yearly.9028.desc.intro:0 "ข้าสะดุ้งตื่นด้วยความรู้สึกเย็นเยียบที่คุ้นเคยไปทั่วร่าง ข้ามองไปรอบๆ เหมือน เช่นเคย และครั้งนี้ข้าเห็นปรปักษ์ที่ตายไปนานแล้วของข้า [bp1_yearly_9028_dead_rival.GetFullName]!\n\n"
 bp1_yearly.9028.desc.murderer:0 ""เจ้าฆาตกร!""
 bp1_yearly.9028.desc.murderer.fallback:0 ""เจ้า [ROOT.Char.Custom2('InsultNoun', SCOPE.sC('bp1_yearly_9028_dead_rival'))]!""
 bp1_yearly.9028.desc.bridge:0 "[bp1_yearly_9028_dead_rival.GetSheHe|U] ร่ำไห้ "ข้า [bp1_yearly_9028_dead_rival.GetDeathReason] และบัดนี้วิญญาณของข้าเร่ร่อนอยู่บนโลกนี้เพื่อตามหาเจ้า! สิ่งที่เจ้าทำกับข้าได้ทิ้งรอยด่างพร้อยไว้บนวิญญาณของเจ้า และเจ้าต้องวิงวอนขอการอภัยโทษจากครอบครัวผู้ล่วงลับของข้า!"\n\n"
 bp1_yearly.9028.desc.callous:0 "อันที่จริง ข้ารู้สึกว่าไม่มีสิ่งใดที่ข้าต้องสำนึกผิด เจ้า [bp1_yearly_9028_dead_rival.Custom2('InsultNoun', ROOT.Char)] นั่นสมควรโดนแล้ว"
 bp1_yearly.9028.desc.fallback:0 "ข้ารู้สึกถึงรอยด่างพร้อยนั้นกำลังจมลึกลงไปในจิตวิญญาณข้า จะมีการสำนึกผิดปริมาณเท่าใดเล่าที่จะเพียงพอ?"
 bp1_yearly.9028.desc.outro:0 "ข้าได้รับคำสั่งจากปรโลกแล้ว ข้าจะดำเนินการอย่างไรดี?"
 bp1_yearly.9028.a:0 "ข้าจะทำทุกอย่างเพื่อการไถ่บาป!"
 bp1_yearly.9028.b:0 "ข้าจะไม่มีวันยอมลดตัวลงขอขมา"
 
 bp1_yearly.9029.t:0 "[bp1_yearly_9029_dead_parent.Custom2('RelationToMe', ROOT.Char)|U]!"
 bp1_yearly.9029.desc.intro:0 "เป็นเวลาพอสมควรแล้วนับ แต่การมาเยือนของภูตผีครั้งแรก และข้าเตรียมพร้อมอย่างเต็มที่สำหรับครั้งต่อไป สิ่งที่ข้ามิได้เตรียมพร้อมคือใบหน้าที่เต็มไปด้วยความดูถูกเหยียดหยามของ [bp1_yearly_9029_dead_parent.Custom2('RelationToMe', ROOT.Char)] ซึ่งอยู่ห่างจากใบหน้าข้าเพียงไม่กี่นิ้ว!\n\n"เจ้าเด็กชั่วร้าย!"
 bp1_yearly.9029.desc.rival_sibling:0 "เจ้าไม่เห็นหรือว่าความบาดหมางระหว่างสายเลือดของข้านี้ นำพาครอบครัวทั้งหมดนี้เข้าใกล้ [bp1_yearly_9029_dead_parent.GetFaith.NegativeAfterLife] มากขึ้นเพียงใด?"
 bp1_yearly.9029.desc.rival_sibling_unrelated:0 "แม้ว่า [bp1_yearly_9029_rival.GetName] จะไม่ใช่ [bp1_yearly_9029_rival.Custom('GetDaughterSon')] ของข้า แต่ [bp1_yearly_9029_rival.GetSheHe] ก็ยังคงเป็น [bp1_yearly_9029_rival.Custom('SisterBrother')] ของเจ้า และความเป็นอริของพวกเจ้านำพาครอบครัวทั้งหมดเข้าใกล้ [bp1_yearly_9029_dead_parent.GetFaith.NegativeAfterLife] มากขึ้น!"
 bp1_yearly.9029.desc.rival:0 "ความเกลียดชังคือเส้นทางที่แน่นอนสู่ [bp1_yearly_9029_dead_parent.GetFaith.NegativeAfterLife] [ROOT.Char.Custom('GetDaughterSon')] ของข้า และเจ้าต้องยุติความเป็นอริของเจ้าหากเจ้าจะเปลี่ยนชะตากรรมของตน"
 bp1_yearly.9029.desc.outro:0 "เจ้าต้องพยายามยุติความเป็นอริกับ [bp1_yearly_9029_rival.GetName] จงหมอบคลานและรับใช้ [bp1_yearly_9029_rival.GetHerHim] หากนั่นคือสิ่งที่ต้องทำ!""
 bp1_yearly.9029.a:0 "เช่นนั้นข้าจะหมอบคลานและรับใช้"
 bp1_yearly.9029.b:0 "ไปสู่ [ROOT.Char.GetFaith.NegativeAfterLife] พร้อมกับ [bp1_yearly_9029_rival.GetFirstNameNoTooltip] เสียเถิด!"
 
 bp1_yearly.9030.t:0 "การมาเยือนครั้งที่สองของ [bp1_yearly_9026_dead_friend.GetNamePossessive]"
 bp1_yearly.9030.desc.intro:0 "ข้ารู้สึกถึงอาการชาไปทั้งตัวขณะที่ [bp1_yearly_9026_dead_friend.GetFullName] ปรากฏตัวต่อหน้าข้าอีกครั้ง\n\n"บอกข้าทีเถิด วิญญาณ ข้าต้องทำสิ่งใดอีกเพื่อรับรองที่ทางของข้าใน [ROOT.Char.GetFaith.PositiveAfterLife]"\n\n"ดีแล้วที่เจ้าถาม สหายเก่าของข้า"
 bp1_yearly.9030.desc.pilgrimage:0 "จงเดินทางไปยังดินแดนศักดิ์สิทธิ์ ที่นั่นเจ้าจะพบการไถ่บาปที่เจ้าแสวงหา อย่ารอช้า [ROOT.Char.GetFaith.HighGodName] กำลังรอเจ้าอยู่ที่นั่น""
 bp1_yearly.9030.desc.fallback:0 "การกุศล! ข้าต้องพูดอีกกี่ครั้ง? การกระทำเพียงครั้งเดียวไม่เพียงพอ เจ้าต้องสร้างนิสัยในการแจกจ่ายความมั่งคั่งของเจ้า!""
 bp1_yearly.9030.a:0 "ข้าจะทำในสิ่งที่ต้องทำ"
 bp1_yearly.9030.a.tt_pilgrimage:0 "[pilgrimage|E] ครั้งต่อไปของท่านจะถูกลง"
 bp1_yearly.9030.b:0 "ข้ามิอาจทำได้มากกว่านี้แล้ว"
 
 bp1_yearly.9031.t:0 "โปรดอภัยให้ข้า"
 bp1_yearly.9031.desc.intro:0 "ในที่สุดข้าก็สามารถพบ [bp1_yearly_9031_rival_family.Custom2('MyCharacterIntroduction', bp1_yearly_9031_rival)] ในช่วงเวลาว่างได้ ด้วยความคลั่งไคล้ในความสิ้นหวังที่จะได้รับการอภัยโทษ ข้าทรุดตัวลงคุกเข่าและวิงวอนขอให้ได้รับการอภัยสำหรับทุกสิ่งที่ข้าได้ทำต่อ [bp1_yearly_9031_rival.GetFirstNameNoTooltip]"
 bp1_yearly.9031.desc.flagellant:0 "รอยยิ้มอันน่าสะอิดสะเอียนปรากฏขึ้นบนใบหน้าของ [bp1_yearly_9031_rival_family.GetHerHis]\n\n"เราทั้งคู่ต่างรู้ว่าเป็นการอภัยโทษจาก [bp1_yearly_9031_rival_family.GetFaith.HighGodNamePossessive] ที่เจ้าแสวงหา และการโบยตีตนเองเป็นหนทางเดียวที่จะบรรลุเป้าหมายนี้ จงทำเสีย ทำแรงๆ แล้วข้าจะให้อภัยเจ้า และเจ้าควรหวังว่า [bp1_yearly_9031_rival_family.GetFaith.HighGodNameSheHe|U] จะทรงทำ เช่นนั้นด้วย""
 bp1_yearly.9031.desc.debate:0 "[bp1_yearly_9031_rival_family.GetNameNoTooltip] แค่นเสียงมองลงมาที่ข้าทางปลายจมูกของ [bp1_yearly_9031_rival_family.GetHerHis]\n\n"ดีแล้วที่เจ้ารู้สำนึกในวิถีอันเป็นบาปของเจ้าเสีย แต่บัดนี้ แต่ข้าเกรงว่าข้ามิอาจให้อภัยเจ้าสำหรับอาชญากรรมต่อ [bp1_yearly_9031_rival_family.GetFaith.ReligiousText] ได้ เว้น แต่เจ้าจะสามารถโน้มน้าวข้าได้ในการโต้วาที""
 bp1_yearly.9031.desc.cleanup:0 "ข้าเห็นความคิดก่อตัวขึ้นในหัวอันเชื่องช้าสกปรกของ [bp1_yearly_9031_rival_family.GetNamePossessiveNoTooltip]\n\n"โอ้ ตั้งแต่ [bp1_yearly_9031_rival.GetFirstNameNoTooltip] จากไป ข้าต้องลดจำนวนคนรับใช้ทำความสะอาดในการจ้างงานของเรา หากใครสักคนสามารถช่วยทำความสะอาดที่พำนักของข้าได้ นั่นย่อมจะ ทำให้ข้าให้อภัยได้อย่างแน่นอน""
 bp1_yearly.9031.desc.unconditional:0 "[bp1_yearly_9031_rival_family.GetSheHe|U] ยิ้มและลดตัว [bp1_yearly_9031_rival_family.GetHerselfHimself] ลงเพื่อพบข้า\n\n"ยืนขึ้นเถิด สหาย สิ่งที่ข้าต้องการได้ยินทั้งหมดคือท่านเสียใจกับมัน เราทุกคนล้วนเป็นเพียงเด็กในสายพระเนตรของ [bp1_yearly_9031_rival_family.GetFaith.HighGodName] ท้ายที่สุดแล้ว เราทุกคนต่างก็ทำผิดพลาดได้""
 bp1_yearly.9031.desc.fallback:0 "[bp1_yearly_9031_rival_family.GetSheHe|U] มองข้าด้วยดวงตาคลอน้ำตา\n\n"ให้อภัยเจ้าน่ะหรือ? ไม่ ข้าจะ #EMP ไม่มีวัน#! ให้อภัยเจ้า มันน่าสะอิดสะเอียนที่ได้ยินเจ้าเอ่ยชื่อของ [bp1_yearly_9031_rival.GetHerHis] เสียด้วยซ้ำ! การกระทำใดเล่าที่ข้าจะเรียกร้องเป็นการชดใช้บาปสำหรับสิ่งที่เจ้าได้ทำลงไป?""
 bp1_yearly.9031.a.forgiven:0 "ข้านอบน้อมรับ"
 bp1_yearly.9031.a:0 "ข้าจะทำทุกอย่างที่ท่านขอ"
 bp1_yearly.9031.b.forgiven:0 "ข้าขอถอนคำพูดทั้งหมด!"
 bp1_yearly.9031.b:0 "ข้าจะไม่ยอมถูกลดเกียรติ"
 
 bp1_yearly.9032.t:0 "การแก้ไขความผิด"
 bp1_yearly.9032.desc:0 "ตามที่ข้าถูกขอ ข้าได้ตามหา [bp1_yearly_9032_rival.GetName] และทรุดตัวลงคุกเข่าทันที วิงวอนขอการอภัยโทษจาก [bp1_yearly_9032_rival.GetHerHis]\n\n"สาบานต่อ [bp1_yearly_9032_rival.GetFaith.PantheonTerm|U] นี่มันดีเกินไปแล้ว! เจ้ามาอยู่ที่เท้าข้า ฮ่า! ข้าฝันถึงวันนี้มานานแค่ไหน"\n\nขณะที่สีหน้าของข้ายังคงไม่หวั่นไหวราวหินผา น้ำเสียงของ [bp1_yearly_9032_rival.GetHerHis] ก็เริ่มเปลี่ยนไป\n\n"เจ้าจริงจังหรือนี่? อืม ข้าคิดว่ามีบางสิ่งที่เจ้าสามารถทำได้เพื่อแลกกับการอภัยโทษจากข้า...""
 bp1_yearly.9032.a:0 "ข้าจะทำทุกอย่าง"
 bp1_yearly.9032.b:0 "ฉวยโอกาสนี้แล้ว ทำให้ [bp1_yearly_9032_rival.GetHerHim] สะดุดล้ม!"
 
 bp1_yearly.9033.t:0 "ค่ำคืนสุดท้าย"
 bp1_yearly.9033.desc.intro:0 "ในที่สุด [bp1_yearly_9026_dead_friend.GetFullName] ก็มาหาข้าอีกครั้ง และหวังว่าจะเป็นครั้งสุดท้าย ข้าลุกขึ้นจากนิทราและสอบถามว่าข้าทำได้ดีเพียงใดในการหลีกเลี่ยงชะตากรรมของข้า\n\n"
 bp1_yearly.9033.desc.did_well:0 ""โอ้ สหาย เจ้าได้ทำงานอันน่าทึ่ง! แม้ว่าอนาคตของเจ้าจะยังไม่แน่นอน แต่มันก็อยู่ในสถานะที่ดีกว่ามากเมื่อเทียบกับตอนที่ข้ามาเยี่ยมเจ้าครั้งแรก! น้ำหนักบนวิญญาณของเจ้าถูกยกออกไปแล้ว และข้าสามารถกลับไปสู่การลงทัณฑ์ชั่วนิรันดร์ของข้าได้ โดยมั่นใจว่าข้าได้ทำทุกอย่างที่ทำได้เพื่อช่วยเจ้าให้รอดพ้นจากชะตากรรมเดียวกัน""
 bp1_yearly.9033.desc.did_bad:0 ""ทำได้ดีเพียงใดรึ? ทำได้ดีเพียงใดรึ? ถึงคราวเคราะห์แล้ว [ROOT.Char.GetFirstNameNoTooltip]! เจ้าถึงคราวเคราะห์ที่จะต้องไปสู่ [ROOT.Char.GetFaith.NegativeAfterLife] ชั่วนิรันดร์! อนาคตของเจ้าคือพรมแห่งความสยดสยองและโศกนาฏกรรมที่ถักทอด้วยมือเปื้อนเลือดของเจ้าเอง! ข้ากลับไปพักผ่อน ข้าได้ทำทุกอย่างที่ทำได้เพื่อช่วยวิญญาณของเจ้าแล้ว""
 bp1_yearly.9033.desc.did_okay:0 ""อืม ข้าจะว่ากระไรได้? เจ้าได้รับโอกาสในการไถ่บาปและเจ้าก็โยนมันทิ้งไป แม้ว่าเจ้าจะก้าวไปข้างหน้าบ้าง แต่เจ้าก็ได้ก้าวถอยหลังไปมากกว่านั้นมาก ข้าหวังว่าเจ้าจะสามารถทำอะไรได้มากกว่านี้เพื่อเปลี่ยนแปลง สหายข้า สำหรับตอนนี้ ข้าต้องกลับไปสู่การลงทัณฑ์ชั่วนิรันดร์ของข้า และข้าหวังว่าจะไม่ได้พบเจ้าที่นั่นกับข้า""
 bp1_yearly.9033.desc.outro:0 "\n\n[bp1_yearly_9026_dead_friend.GetFirstNameNoTooltip] หายตัวไปอีกครั้ง และครั้งนี้ข้าสงสัยว่าจะได้เห็น [bp1_yearly_9026_dead_friend.GetHerHim] อีกหรือไม่"
 bp1_yearly.9033.a:0 "ข้ารอดแล้ว!"
 bp1_yearly.9033.b:0 "บางที [ROOT.Char.GetFaith.NegativeAfterLife] อาจไม่ได้แย่นักก็ได้"
 bp1_yearly.9033.c:0 "ข้าคือ [ROOT.Char.GetWomanMan] คนใหม่แล้ว"
 end_marley_ghost_story_tt:0 "ท่านจะไม่ได้รับการมาเยือนจากภูตผีอีก"
 bp1_increase_good_deeds_tt:0 "#EMP เหล่าวิญญาณจะพึงพอใจ#!"
 bp1_decrease_good_deeds_tt:0 "#EMP เหล่าวิญญาณจะโกรธเกรี้ยวอย่างยิ่ง#!"
 
 bp1_yearly.9034.t:0 "แม่มดวารี"
 bp1_yearly.9034.desc.intro:0 "ข้ากำลังเล่นสนุกอยู่ในหนองบึงของ [bp1_yearly_9034_swampy_location.GetNameNoTooltip] กับสหายของข้า [bp1_yearly_9034_friend.GetName] เรามัว แต่เล่นกันจนไม่ทันสังเกตว่าเราพลัดหลงจาก [bp1_yearly_9034_guardian.GetName] เสียแล้ว!\n\nทันใดนั้น เราเห็นแม่มดหนองน้ำโผล่ขึ้นมาจากโคลนเลน ร่างกายเคลือบด้วยโคลน [bp1_yearly_9034_witch.GetSheHe|U] จ้องมองมาที่เรา และก่อนที่ข้าจะทันรู้ตัว [bp1_yearly_9034_friend.GetName] ก็วิ่งหนีไปแล้ว!"
 bp1_yearly.9034.desc.giant:0 "[bp1_yearly_9034_witch.GetSheHe|U] เดินอุ้ยอ้ายเข้ามาหาข้า ร่างสูงใหญ่ของ [bp1_yearly_9034_witch.GetHerHis] ทำให้ [bp1_yearly_9034_witch.GetHerHim] สะดุดล้มลงด้วยน้ำหนักตัวของ [bp1_yearly_9034_witch.GetHerHis] เอง!"
 bp1_yearly.9034.desc.hunchbacked:0 "[bp1_yearly_9034_witch.GetSheHe|U] เดินอุ้ยอ้ายเข้ามาหาข้า ร่างกายทั้งหมดของ [bp1_yearly_9034_witch.GetHerHis] งองุ้มอย่างผิดธรรมชาติราวกับว่า [bp1_yearly_9034_witch.GetSheHe] ทำให้ [bp1_yearly_9034_witch.GetHerHis] กลายเป็นปม"
 bp1_yearly.9034.desc.beauty_bad:0 "ข้าไม่เคยเห็นสิ่งมีชีวิตใดน่าเกลียดเท่านี้มาก่อน แม้จะมองจากระยะนี้ก็ตาม ก่อนที่ข้าจะมีโอกาสพิจารณา [bp1_yearly_9034_witch.GetSheHe] ก็เริ่มวิ่งเข้ามาหาข้า!"
 bp1_yearly.9034.desc.albino:0 "ระหว่างคราบโคลน ข้าเห็นผิวหนังและเส้นผมของ [bp1_yearly_9034_witch.GetHerHis] เป็นสีขาวน้ำนม และดวงตาสีแดงคู่นั้นเต็มไปด้วยความโกรธเกรี้ยว ก่อนที่ข้าจะมีโอกาสพิจารณา [bp1_yearly_9034_witch.GetSheHe] ก็เริ่มวิ่งเข้ามาหาข้า!"
 bp1_yearly.9034.desc.scaly:0 "ผิวหนังของ [bp1_yearly_9034_witch.GetHerHis|U] คล้ายกับกิ้งก่า เต็มไปด้วยตุ่มและรอยพับ ก่อนที่ข้าจะมีโอกาสพิจารณา [bp1_yearly_9034_witch.GetSheHe] ก็เริ่มวิ่งเข้ามาหาข้า!"
 bp1_yearly.9034.desc.outro:0 "\n\nเมื่อสหายและผู้ดูแลของข้าอยู่ห่างไกล เหลือเพียงข้ากับแม่มด แต่ข้าจะทำอย่างไรดี?"
 bp1_yearly.9034.a:0 "วิ่งหนี!"
 bp1_yearly.9034.b:0 "มาดูกันว่า [bp1_yearly_9034_witch.GetSheHe] ต้องการอะไร"
 9034_escaped_witch:0 "ท่านหนีแม่มดรอด!"
 9034_failed_to_escape:0 "ท่านได้รับบาดเจ็บระหว่างการหลบหนี"
 
 bp1_yearly.9035.t:0 "แม่มดใจดีแห่งหนองบึง"
 bp1_yearly.9035.desc:0 "เมื่อแม่มดเข้ามาใกล้ในที่สุด [bp1_yearly_9034_witch.GetSheHe] ก็ปัดแมลงบนใบหน้าข้าและเช็ดมันบนเสื้อคลุมของ [bp1_yearly_9034_witch.GetHerHis]\n\n"ระวังตัวแถวนี้ด้วยนะ เจ้าหนู แม้ แต่สัตว์ตัวเล็กๆ ก็ทำร้ายเจ้าได้หากไม่ระวัง ข้ารู้ดี ข้ารักษาแก้มบวมๆ ของนักเดินทางที่หลงทางมามากพอแล้ว"\n\nเห็นได้ชัดว่าไม่ใช่อสูรร้ายอย่างที่ข้าคิดในตอนแรก [bp1_yearly_9034_witch.GetSheHe] แนะนำ [bp1_yearly_9034_witch.GetHerselfHimself] ว่าเป็นหมอและนักเวทมนตร์ท้องถิ่น เชี่ยวชาญด้านยาสมุนไพรและพิธีกรรมเพื่อขับไล่วิญญาณออกจากผู้คนและวัตถุ บางที [bp1_yearly_9034_witch.GetWomanMan] ผู้นี้อาจรับใช้จุดประสงค์อันสูงส่งกว่านี้ได้"
 bp1_yearly.9035.a:0 "หมอหรือ? ข้าอาจต้องการแพทย์หลวงคนใหม่..."
 bp1_yearly.9035.b:0 "สอนวิชาของท่านแก่ข้าเถิด โอ้ ท่าน [bp1_yearly_9034_witch.GetWomanMan] ผู้ปราดเปรื่อง"
 bp1_yearly.9035.c:0 "ใครถามกัน?"
 
 bp1_yearly.9036.t:0 "แม่มดใจร้ายแห่งหนองบึง"
 bp1_yearly.9036.desc:0 "นางแม่มด [bp1_yearly_9034_witch.Custom2('InsultAdjective', ROOT.Char)] คว้าตัวข้าไว้ด้วยนิ้วมืออันเหี่ยวย่นยาวเหยียดของ[bp1_yearly_9034_witch.GetHerHis] บีบข้าแน่นจนรู้สึกได้ว่าโลหิตในแขนหยุดนิ่ง\n\n"ในนามแห่ง [bp1_yearly_9034_witch.GetFaith.WitchGodName] เจ้าเข้ามาทำอะไรในบึงของข้า ไอ้ [ROOT.Char.Custom2('InsultAdjective', SCOPE.sC('bp1_yearly_9034_witch'))] [ROOT.Char.Custom2('InsultNoun', SCOPE.sC('bp1_yearly_9034_witch'))]? เจ้ารู้หรือไม่ว่ามีวิญญาณชั่วร้ายตนใดอยู่ในที่แห่งนี้? เจ้าเด็กเลว!"\n\nข้าพยายามอธิบายให้ [bp1_yearly_9034_witch.GetHerHim] ฟังว่าข้าคือ [ROOT.Char.GetTitleAsNameNoTooltip|U] แต่ [bp1_yearly_9034_witch.GetSheHe] ก็ไร้เหตุผลโดยสิ้นเชิงในตอนนี้ ข้ารู้สึกว่าร่างกายกำลังอ่อนปวกเปียกและผิวหนังเริ่มปริ เมื่อข้าเห็น [bp1_yearly_9034_guardian.Custom2('MyCharacterIntroduction', ROOT.Char)] ปรากฏตัว"
 bp1_yearly.9036.a:0 "[bp1_yearly_9034_guardian.GetNameNoTooltip] ช่วยข้าด้วย!"
 bp1_yearly.9036.guardian_wins:0 "[bp1_yearly_9034_guardian.GetNameNoTooltip] มีชัย"
 bp1_yearly.9036.guardian_loses:0 "[bp1_yearly_9034_guardian.GetNameNoTooltip] ไม่สามารถช่วยข้าจากการบาดเจ็บได้"
 bp1_yearly_9034_witchy_goodbad_tt:0 "#EMP แม่มดอาจกลายเป็นสิ่งที่แตกต่างจากที่ท่านคาดคิด...#!"
 
 bp1_yearly.9037.t:0 "ศพในหนองบึง"
 bp1_yearly.9037.desc:1 "ข้าถูกพาออกมายังหนองบึงของ [bp1_yearly_9037_swampy_location.GetNameNoTierNoTooltip] โดย [bp1_yearly_9037_guardian.Custom2('MyCharacterIntroduction', ROOT.Char)] และมันเป็นสถานที่ที่ยอดเยี่ยมจริงๆ!\n\nข้าวิ่งเล่น เตะน้ำเน่าเหม็นไปรอบๆ และโยนก้อนหินลงไปในโคลน ใช้ชีวิตที่ดีที่สุดของ [ROOT.Char.GetTitleAsNameNoTooltip] อย่างแท้จริง เมื่อข้าเห็นบางสิ่งค่อยๆ คลานเข้ามาหาข้า\n\nเมื่อแหวกพงหญ้าออกคือใบหน้าของศพประหลาด ดวงตาของ [bp1_yearly_9037_corpse.GetHerHis] ที่เบิกกว้างด้วยความหวาดกลัวอย่างสุดขีด ถูกรักษาสภาพไว้อย่างสมบูรณ์โดยแร่ธาตุในน้ำของหนองบึง"
 bp1_yearly.9037.a:0 "[bp1_yearly_9037_guardian.GetNameNoTooltip] ดูสิว่าข้าเจออะไร!"
 bp1_yearly.9037.custom:0 "ผู้ดูแลของข้า [bp1_yearly_9037_guardian.GetName] คงจะรู้ว่าต้องทำอย่างไร..."
 bp1_yearly.9037.b:0 "วิ่งหนีและกรีดร้อง!"
 
 bp1_yearly.9038.t:0 "ความลับถูกเปิดเผย"
 bp1_yearly.9038.desc.intro:0 "ขณะที่ [bp1_yearly_9037_guardian.Custom2('MyCharacterIntroduction', ROOT.Char)] เข้ามาใกล้ ใบหน้าของ [bp1_yearly_9037_guardian.GetHerHis] ก็บิดเบี้ยวเป็นสีหน้าของความอึดอัดและสยดสยองเมื่อเห็นใบหน้าของศพในหนองบึง\n\n"นี่คือ [bp1_yearly_9037_corpse.GetNameNoTooltip]... ข้าฆ่า [bp1_yearly_9037_corpse.GetHerHim] เอง"
 bp1_yearly.9038.desc.killer:0 "เจ้าเข้าใจใช่ไหม [ROOT.Char.GetTitleAsNameNoTooltip] น้อยของข้า ข้าคงปล่อยให้เจ้าวิ่งไปบอกทุกคนถึงสิ่งที่เจ้าเห็นที่นี่ไม่ได้ สิ่งที่สนุกเกี่ยวกับสถานที่ เช่นนี้คือมันห่างไกลและอันตรายมาก ไม่มีใครคิดจะมาตามหาเจ้าที่นี่หรอก เจ้าว่ายน้ำเก่งไหม [ROOT.Char.GetTitleAsNameNoTooltip] ของข้า?""
 bp1_yearly.9038.desc.not_killer:0 "ข้าไม่เคยตั้งใจจะบอกใครเลย แต่ตอนนี้ไม่มีประโยชน์ที่จะปิดบังมันอีกต่อไป ข้าไม่ภูมิใจในสิ่งที่ข้าทำ [ROOT.Char.GetFirstNameNoTooltip] ข้าเพียงหวังว่าเจ้าจะให้อภัยข้าในฐานะพี่เลี้ยงที่รักของเจ้า""
 bp1_yearly.9038.a:0 "ข้าไม่รู้จะพูดอะไร"
 bp1_yearly.9038.b:0 "วิ่งหนีไปบอกทุกคน!"
 bp1_yearly.9038.c:0 "ผลัก [bp1_yearly_9037_guardian.GetHerHim] แรงๆ ลงไปในหนองบึง"
 9038_killed_guardian:0 "ท่านผลัก [bp1_yearly_9037_guardian.GetName] ลงไปในหนองบึงได้สำเร็จ"
 9038_guardian_kills_you:0 "ท่านถูก [bp1_yearly_9037_guardian.GetName] เอาชนะ"
 
 bp1_yearly.9039.t:0 "ศพสภาพสมบูรณ์"
 bp1_yearly.9039.desc:0 "[bp1_yearly_9037_guardian.GetName] ดูตกใจและสยดสยองพอๆ กับข้าที่เห็นศพนี้ในหนองบึง แต่สีหน้าสยดสยองของ [bp1_yearly_9037_guardian.GetHerHis] ก็ค่อยๆ เปลี่ยนเป็นความทึ่ง\n\n"[ROOT.Char.Custom('GirlBoy')] ของข้า ท่านจำเสื้อผ้าเหล่านี้ได้หรือไม่? นี่เป็นแฟชั่นของชาวไพร่อย่างไม่ต้องสงสัยเมื่อสามร้อยปีก่อน! ไม่ต้องสงสัยเลย ศพนี้ได้รับการรักษาสภาพอย่างที่ไม่เคยเห็นมาก่อน! เหตุใดเล่า นี่คือปาฏิหาริย์จาก [bp1_yearly_9037_guardian.GetFaith.HighGodName|U]! ไม่ต้องสงสัยเลยในเรื่องนั้น! อนุญาตให้ข้าเก็บกระดูกเหล่านี้และทำเป็นของขวัญชั้นดีให้ท่าน"\n\n[bp1_yearly_9037_guardian.GetFaith.HighGodName|U] ดูเหมือนจะมีวิธีแสดง 'ปาฏิหาริย์' ที่แปลกประหลาด แต่ถ้า [bp1_yearly_9037_guardian.GetNameNoTooltip] บอกว่าเป็น เช่นนั้น มันก็คงต้องเป็น เช่นนั้น"
 bp1_yearly.9039.a:0 "ช่างเป็นของขวัญที่... ประหลาดเสียจริง"
 bp1_yearly.9039.b:0 "ไม่ ข้ามั่นใจว่านี่คือผีร้าย"
 ghost_stories_modifier:0 "เรื่องผี"
 ghost_stories_modifier_desc:0 "เคาน์ตีนี้ถูกกล่าวหาว่าเป็นที่อยู่ของวิญญาณร้าย"
 box_of_boggy_bones:0 "กล่องกระดูกหนองบึง"
 box_of_boggy_bones_desc:0 "กระดูกของศพอายุหลายร้อยปีที่ได้รับการรักษาสภาพอย่างสมบูรณ์ในน้ำหนองบึง บัดนี้ถูกย้ายมาอยู่ในกล่องที่สะดวกสบาย"
 bp1_withholding_ghost_sex:0 "ต่อต้านความฝันอันเร่าร้อน"
 bp1_withholding_ghost_sex_desc:0 "ตัวละครนี้กำลังฝันถึงคนรักที่ตายไปนานแล้ว แต่ปฏิเสธการทาบทามทางเพศของพวกเขา"
 bp1_indulging_ghost_sex:0 "ความฝันอันเร่าร้อน"
 bp1_indulging_ghost_sex_desc:0 "ตัวละครนี้กำลังฝันถึงคนรักที่ตายไปนานแล้ว และกำลังยอมรับประสบการณ์ทางเพศเหนือธรรมชาตินั้นอย่างเต็มที่"
 
 bp1_yearly.9040.t:0 "การมาเยือนของคนรัก"
 bp1_yearly.9040.desc:0 "ข้านอนอย่างสบายอยู่บนเตียงเมื่อรู้สึกถึงสัมผัสที่คุ้นเคยลูบไล้ไปทั่วหน้าอกเปลือยของข้า ตอนแรกข้าไม่ได้คิดอะไร แต่เมื่อดวงตาของข้าพยายามลืมขึ้น ข้าก็เห็นว่าเป็น [bp1_yearly_9040_dead_lover.GetName] ผู้ล่วงลับอันเป็นที่รักของข้านั่งอยู่ข้างๆ!\n\n"โอ้ [ROOT.Char.Custom('LoverPetName')] ของข้า มันนานมากแล้วใช่ไหม? แต่เมื่อข้ากอดเจ้าและจูบเจ้า ความรักไม่กลับคืนสู่หัวใจของเจ้าราวกับว่าทุกอย่างเพิ่งเกิดขึ้นเมื่อวานนี้หรือ? กอดข้าเถิด [ROOT.Char.Custom('LoverPetName')] ของข้า รักข้าอีกครั้ง!"\n\nข้าไม่อยากจะเชื่อ แต่ข้าเห็น [bp1_yearly_9040_dead_lover.GetHerHim] และรู้สึกถึง [bp1_yearly_9040_dead_lover.GetHerHim]! แม้ข้าจะรู้ว่านี่เป็นความฝัน แต่มันช่างชัดเจนเสียจนข้ามิอาจต้านทานได้"
 bp1_yearly.9040.a:0 "โอ้ กอดข้าเหมือนที่เราเคยทำเมื่อนานมาแล้ว!"
 bp1_yearly.9040.b:0 "ไปให้พ้น วิญญาณ"
 
 bp1_yearly.9041.t:0 "ความทรงจำถึง [bp1_yearly_9041_parent.GetMotherFather|U]"
 bp1_yearly.9041.desc:0 "ข้าพบ [bp1_yearly_9041_sibling.Custom2('MyCharacterIntroduction', ROOT.Char)] นั่งซึมอยู่ที่มุมห่างไกลของ [ROOT.Char.GetCapitalLocation.GetTitle.GetNameNoTierNoTooltip] กำลังร้องไห้เบาๆ เมื่อ [bp1_yearly_9041_sibling.GetSheHe] สังเกตเห็นข้าเข้ามาใกล้ [bp1_yearly_9041_sibling.GetSheHe] ก็ลุกขึ้นและพยายามเช็ดน้ำตาของ [bp1_yearly_9041_sibling.GetHerHis] อย่างเปล่าประโยชน์\n\n"โอ้ [ROOT.Char.Custom('SisterBrother')] ข้าขอโทษ ข้าไม่ควรร้องไห้ ท้ายที่สุดแล้ว ท่านมีเหตุผลที่จะคิดถึง [bp1_yearly_9041_parent.GetMotherFather] ของเรามากกว่าข้า ข้าจะหลีกทางให้ท่าน"\n\nตามจริงแล้ว ข้าไม่มีเวลาคิดถึง [bp1_yearly_9041_parent.GetMotherFather] เลยนับตั้งแต่ขึ้นครองบัลลังก์ แต่ [bp1_yearly_9041_sibling.GetNameNoTooltip] ดูเหมือนจะเสียใจอย่างสุดซึ้ง"
 bp1_yearly.9041.a:0 "ระบายออกมาเถิด ข้าอยู่ที่นี่"
 bp1_yearly.9041.b:0 "ฮ่าฮ่า! ช่างเป็นเด็กขี้แยตัวโตเสียนี่กระไร!"
 
 bp1_yearly.9042.t:0 "ใบหน้าของ [ROOT.Char.GetFaith.HealthGodName]"
 bp1_yearly.9042.desc:0 "อีกวันหนึ่งของการนำ [ROOT.Char.GetPrimaryTitle.GetTierAsNameNoTooltip|L] ของข้าแทบไม่มีเรื่องน่าประหลาดใจ เว้น แต่ [bp1_yearly_9042_chaplain.Custom2('MyCharacterIntroduction', ROOT.Char)] พรวดพราดเข้ามาในห้องบัลลังก์ของข้า โบกถุงขนมหวานใส่หน้าข้าอย่างกระตือรือร้น\n\n"นายท่าน/นายหญิงของข้า [ROOT.Char.GetTitleAsNameNoTooltip]! นายท่าน/นายหญิงของข้า [ROOT.Char.GetTitleAsNameNoTooltip]! โอ้ มันเป็นปาฏิหาริย์! ข้ากำลังตรวจสอบอาหารของพ่อครัวสำหรับท่านในเย็นนี้ เมื่อข้าตระหนักว่าของเหล่านี้มีลักษณะคล้ายกับใบหน้าของใครอื่นนอกจาก [ROOT.Char.GetFaith.HealthGodName]!"\n\nเมื่อตรวจสอบแล้ว ข้าต้องยอมรับว่าความคล้ายคลึงนั้นน่าทึ่ง แต่แน่นอนว่านี่ต้องเป็นพวกนอกรีต"
 bp1_yearly.9042.a:0 "ท่านช่างพูดถูกยิ่งนัก!"
 bp1_yearly.9042.b:0 "นี่เป็นการลบหลู่สิ่งศักดิ์สิทธิ์อย่างแน่นอน"
 bp1_yearly.9042.c:0 "ช่างเป็นปาฏิหาริย์ ข้าต้องบริโภคมัน!"
 9042_you_win:0 "ท่านชนะการโต้วาที"
 9042_you_lose:0 "ท่านแพ้การโต้วาที"
 dessert_looks_like_god:0 "ใบหน้าอันโอชะของ [ROOT.Char.GetFaith.HealthGodName]"
 dessert_looks_like_god_desc:0 "ชุด [ROOT.Char.Custom('GetExpensiveDessert')] ที่มีความคล้ายคลึงกับ [ROOT.Char.GetFaith.HealthGodName]"
 full_of_jesus_modifier:0 "เปี่ยมด้วยจิตวิญญาณ"
 full_of_jesus_modifier_desc:0 "ตัวละครนี้บริโภคขนมหวานที่มีความคล้ายคลึงกับ [ROOT.Char.GetFaith.HealthGodName]"
 
 bp1_yearly.9043.t:0 "[ROOT.Char.GetFaith.BishopNeuter|U] ผู้กินทารก"
 bp1_yearly.9043.desc:0 "เป็นอีกวันที่น่ารักของการสวดมนต์และรับใช้จาก [ROOT.Char.GetCouncillorPosition( 'councillor_court_chaplain' ).GetPositionName] ที่ยอดเยี่ยมของข้า และขณะที่ข้าเตรียมจะจากไป [bp1_yearly_9043_chaplain.GetName] ก็ขวางทางข้า [bp1_yearly_9043_chaplain.GetSheHe|U] รอ จนกระทั่งคนอื่นๆ จากไปหมดแล้วจึงโน้มตัวเข้ามาใกล้หูข้า\n\n"นายท่าน/นายหญิงของข้า [ROOT.Char.GetTitleAsNameNoTooltip] ข้าต้องบอกท่านว่า ข้าไม่ใช่คนแปลกหน้าสำหรับความสุขในชีวิต ไม่มีรูปแบบของความวิปริตใดที่เลวร้ายเกินไปสำหรับข้า: สัตว์ พืช หรือแร่ธาตุ พูดตามตรง ข้าจะทำอะไรกับอะไรก็ได้ และไม่มีความสุขใดในชีวิตนี้จะดีไปกว่าการบริโภคเนื้อของเด็กๆ ท่านยังไม่ได้ใช้ชีวิตจนกว่าจะได้ลิ้มรสเนื้อคน นายท่าน/นายหญิงของข้า [ROOT.Char.GetTitleAsNameNoTooltip] และข้าไม่มีอะไรจะสุขใจไปกว่าการได้ทานท่านเป็นอาหารเย็นในคืนนี้!"\n\nความประหลาดใจยังไม่เริ่มอธิบายสิ่งที่ข้ารู้สึกเมื่อได้ยินสิ่งนี้ แต่ข้าควรจะพูดอะไรในโลกนี้?"
 bp1_yearly.9043.a:0 "ท่านกินทารกรึ? ฟังดูน่าสนุก!"
 bp1_yearly.9043.b:0 "#EMP ทหาร!#!"
 bp1_yearly.9043.c:0 "แค่ยิ้มแล้วเดินต่อไป"
 
 bp1_yearly.9044.t:0 "การประหารชีวิต"
 bp1_yearly.9044.desc:0 "ข้าหวังว่าข้าจะสามารถห้ามใจตัวเองไม่ให้เข้าร่วมการประหารชีวิตของ [recipient.GetNamePossessive] ได้ แต่เห็นได้ชัดว่าข้าอดไม่ได้ที่จะกล่าวคำอำลา\n\nข้าห่วงใย [recipient.GetHerHim] อย่างแท้จริงในแบบที่ไม่มีใครเข้าใจ แต่เหตุการณ์ที่นำไปสู่การจำคุกของ [recipient.GetHerHis] นั้นเป็นการกระทำของ [recipient.GetHerHis] เอง และข้าไม่สามารถยกเว้นความยุติธรรมได้\n\n[recipient.GetFirstNameNoTooltip] ใช้เวลาช่วงสุดท้ายจ้องมองข้าด้วยแววตาทรยศในดวงตาที่คลอน้ำตา ก่อนที่เสียง #EMP แกร็ก#! ครั้งสุดท้าย และ [recipient.GetSheHe] ก็สิ้นลมหายใจ ข้าอยู่กับร่างไร้ชีวิตของ [recipient.GetHerHis] สักพัก และรำลึกถึงช่วงเวลาดีๆ ทั้งหมดที่เราเคยมีร่วมกันในชีวิต"
 bp1_yearly.9044.desc.outro.memory:0 "ข้าชอบเป็นพิเศษตอนที่ [bp1_yearly_9044_memory_scope.GetDescription] และข้าเสียใจที่เราจะไม่มีช่วงเวลาดีๆ เช่นนี้ร่วมกันอีก"
 bp1_yearly.9044.desc.outro.no_memory:0 "ข้าได้ แต่หวังว่าจะได้พบ [recipient.GetHerHim] อีกครั้งใน [ROOT.Char.GetFaith.PositiveAfterLife] หาก [recipient.GetSheHe] จะให้อภัยข้า"
 bp1_yearly.9044.a.indifferent:0 "มันไม่ใช่เรื่องส่วนตัว"
 bp1_yearly.9044.a.guilty:0 "ข้าเสียใจที่ต้องจบลง เช่นนี้"
 
 bp1_yearly.9045.t:0 "การประหารชีวิต"
 bp1_yearly.9045.desc.intro:0 "ครู่หนึ่งหลังจากข้าออกคำสั่งให้ประหารชีวิต [recipient.GetName] [bp1_yearly_9045_guardian.Custom2('MyCharacterIntroduction', ROOT.Char)] ก็พาข้าลงไปที่ตะแลงแกง โดยสัญญาว่าสิ่งที่ข้าจะได้เห็นจะเป็นโอกาสในการเรียนรู้ที่มีค่า\n\n"
 bp1_yearly.9045.desc.zealous:0 "ข้าเห็น [recipient.GetName] เดินเข้าไปหาเพชฌฆาตพร้อมกับดวงตาที่ปิดสนิท ในความเงียบสงัดของลานประหาร ข้าได้ยิน [recipient.GetHerHim] พึมพำบทสวดและบทสวดที่ไม่เข้าใจในมือของ [recipient.GetHerHis] ราวกับว่ามีความหวังว่า [recipient.GetFaith.HighGodName|U] จะเต็มใจมาและป้องกันการตายก่อนวัยอันควรของ [recipient.GetHerHis]"
 bp1_yearly.9045.desc.brave:0 "[recipient.GetFirstNameNoTooltip] จ้องหน้าเพชฌฆาตและดูพร้อมที่จะถ่มน้ำลายใส่เมื่อในที่สุด [recipient.GetSheHe] ก็สังเกตเห็นข้ามองอยู่ ดวงตาของ [recipient.GetHerHis|U] ไม่เคยละไปจากข้าเลยแม้ แต่วินาทีเดียว จ้องมองลึกเข้าไปในดวงตาและจิตวิญญาณของข้าด้วยความเกลียดชังและความดูหมิ่นอย่างแท้จริง"
 bp1_yearly.9045.desc.fallback:0 "ดวงตาของ [recipient.GetNamePossessiveNoTooltip] แดงก่ำจากน้ำตาของ [recipient.GetHerHis] ขณะที่ [recipient.GetSheHe] ก้าวเข้าไปหาเพชฌฆาต [recipient.GetSheHe] พยายามที่จะเงียบ แต่ก็อดไม่ได้ที่จะครวญครางเบาๆ และสำลักขณะที่ [recipient.GetSheHe] ใคร่ครวญถึงความตายที่กำลังจะมาถึงของ [recipient.GetHerHis]"
 bp1_yearly.9045.desc.outro:0 "\n\nไม่ว่าภาพอันน่าสลดนี้จะ ทำให้ข้ารู้สึกอย่างไร มันจบลงเร็วเกินไปสำหรับข้าที่จะมีโอกาสเรียกยกเลิกการกระทำเสียด้วยซ้ำ เมื่อการกระทำเสร็จสิ้นและหัวใจของ [recipient.GetNamePossessiveNoTooltip] หยุดเต้น [bp1_yearly_9045_guardian.GetNameNoTooltip] ก็ทิ้งข้าไว้ตามลำพังกับศพเพื่อใคร่ครวญถึงสิ่งที่ข้าได้ทำลงไป"
 bp1_yearly.9045.a.indifferent:0 "ข้ากลับบ้านได้หรือยัง?"
 bp1_yearly.9045.a.sadistic:0 "ช่างเป็นการแสดงที่ยอดเยี่ยม!"
 bp1_yearly.9045.a.guilty:0 "เหตุใดท่านจึงให้ข้าดูสิ่งนั้น?"
 
 bp1_yearly.9046.t:0 "การตั้งชื่อสีน้ำตาล"
 bp1_yearly.9046.desc.intro:0 "ในที่สุดก็ถึงเวลาที่ [bp1_yearly_9046_poopy_child.GetName] ทารกแรกเกิดอันเป็นที่รักของข้าจะได้รับการตั้งชื่อในสายพระเนตรของ [ROOT.Char.GetFaith.HighGodName] และชายหญิงคนสำคัญทั้งหมดของ [ROOT.Char.GetPrimaryTitle.GetNameNoTierNoTooltip] ได้มารวมตัวกันเพื่อเป็นสักขีพยานในวันอันศักดิ์สิทธิ์นี้ ขณะที่ [bp1_yearly_9046_chaplain.GetName] ปฏิบัติหน้าที่อันศักดิ์สิทธิ์ของ [bp1_yearly_9046_chaplain.GetHerHis] ข้าก็รู้สึกถึงกลิ่นเหม็นเข้าจมูก\n\n"
 bp1_yearly.9046.desc.christian:1 "อ่างศีลจุ่มบัดนี้กลายเป็นสีน้ำตาลเข้มด้วยอุจจาระของทารกน้อยของข้า ศีรษะของ [bp1_yearly_9046_poopy_child.GetHerHis|U] ถูกจุ่มลงในน้ำศักดิ์สิทธิ์เพื่อพระบิดาไปแล้ว และข้าทำได้เพียงเฝ้าดูขณะที่มันถูกจุ่มลงไปอีกสองครั้งเพื่อพระบุตรและพระจิต"
 bp1_yearly.9046.desc.not_christian:0 "จากของเหลวสีน้ำตาลที่หยดอยู่ระหว่างมือของ [bp1_yearly_9046_chaplain.GetNamePossessiveNoTooltip] เป็นที่ชัดเจนว่า [bp1_yearly_9046_poopy_child.GetNameNoTooltip] ที่รักของข้าไม่สามารถกลั้นไว้เพื่อ [ROOT.Char.GetFaith.HighGodName] ได้"
 bp1_yearly.9046.desc.outro:0 "แม้จะมีกลิ่นเหม็นและการเย้ยหยันของผู้เข้าร่วมพิธี [bp1_yearly_9046_chaplain.GetNameNoTooltip] ก็ยังคงความเป็นมืออาชีพ\n\nข้ามีความรู้สึกว่าเหตุการณ์นี้อาจหลอกหลอนทารกแรกเกิดของข้าไปตลอดชีวิตของ [bp1_yearly_9046_poopy_child.GetHerHis] และชื่อ [bp1_yearly_9046_poopy_child.GetFirstNameNoTooltip] อาจจะเกี่ยวข้องกับสิ่งปฏิกูลของทารกตลอดไป"
 bp1_yearly.9046.a.indifferent:0 "ฮ่า! ช่างเป็นการแสดงเสียจริง!"
 bp1_yearly.9046.a:0 "อืม ไม่มีอะไรที่ข้าทำได้"
 bp1_yearly.9046.b:0 "เหตุการณ์นี้ต้องไม่แพร่งพรายออกจากห้องนี้"
 
 bp1_yearly.9047.t:0 "ปอยผมแห่งรัก"
 bp1_yearly.9047.desc:0 "ข้ากำลังพูดคุยบนเตียงกับ [bp1_yearly_9047_lover.GetName] ที่รักของข้าตามปกติ พันเส้นผมอันน่ารักของ [bp1_yearly_9047_lover.GetHerHis] รอบนิ้วข้า\n\n"ท่านรักผมของข้ามาก เช่นนั้นหรือ [ROOT.Char.Custom('LoverPetName')] ของข้า? บางทีท่านควรพกมันติดตัวไปด้วยเสมอขณะปฏิบัติหน้าที่ในฐานะ [ROOT.Char.GetTitleAsNameNoTooltip] เช่นนั้นแล้วทุกคนจะได้เห็นว่าท่านและข้าเป็นหนึ่งเดียวกัน"\n\nตอนแรกข้าคิดว่า [bp1_yearly_9047_lover.GetSheHe] พูดเล่น แต่มันก็ชัดเจนขึ้นอย่างรวดเร็วว่า [bp1_yearly_9047_lover.GetSheHe] ตั้งใจให้ข้าสวมใส่ผมของ [bp1_yearly_9047_lover.GetHerHis] เป็นเครื่องประดับให้ทุกคนได้เห็นจริงๆ!"
 bp1_yearly.9047.a:0 "ข้าจะสวมใส่มันจนกว่าข้าจะตาย"
 bp1_yearly.9047.b:0 "อะไรนะ? นั่นมันน่าขยะแขยง!"
 
 bp1_yearly.9048.t:0 "ปล้ำกับอสูร"
 bp1_yearly.9048.desc:0 "[bp1_yearly_9048_nemesis.GetName] ไม่เคยพลาดที่จะโผล่ใบหน้าอันน่าเกลียดของ [bp1_yearly_9048_nemesis.GetHerHis] มาในจังหวะที่เหมาะเหม็งเพื่อมาทำลายวันของข้าอย่างแท้จริง ครั้งนี้ [bp1_yearly_9048_nemesis.GetSheHe] ดูเหมือนจะเต็มไปด้วยความโกรธเกรี้ยวเป็นพิเศษ ขณะที่ [bp1_yearly_9048_nemesis.GetSheHe] เข้ามาหาข้าใน [ROOT.Char.Custom('GetCourt')] ของข้าด้วยแววตาดั่งเปลวเพลิง\n\n"ไอ้ [ROOT.Char.Custom2('InsultNoun', SCOPE.sC('bp1_yearly_9048_nemesis'))]! ไอ้ [ROOT.Char.Custom2('InsultNoun', SCOPE.sC('bp1_yearly_9048_nemesis'))] ตัวพ่อ! ไอ้ [ROOT.Char.Custom2('InsultAdjective', SCOPE.sC('bp1_yearly_9048_nemesis'))] [ROOT.Char.Custom2('InsultNoun', SCOPE.sC('bp1_yearly_9048_nemesis'))]! ทุกลมหายใจในปอดของเจ้ามันช่างสูญเปล่าและเป็นการดูหมิ่นต่อทุกสรรพสิ่ง ข้าเบื่อหน่ายที่จะมองดูสิ่งที่บิดเบี้ยววิปริตจากการสร้างสรรค์ของ [bp1_yearly_9048_nemesis.GetFaith.CreatorNamePossessive] และข้าต้องการการชดใช้ เรื่องระหว่างเราต้องจบลงเดี๋ยวนี้! สู้กับข้า!"\n\nก่อนที่ข้าจะมีโอกาสโต้ตอบ [bp1_yearly_9048_nemesis.GetName] ก็ตั้งท่าพร้อมที่จะปล้ำกับข้าแล้ว!"
 bp1_yearly.9048.a:0 "โลกใบนี้จะเหลือ [bp1_yearly_9048_nemesis.Custom2('InsultAdjective', ROOT.Char)] [bp1_yearly_9048_nemesis.Custom2('InsultNoun', ROOT.Char)] น้อยลงหนึ่งตนเมื่อข้าจัดการเสร็จ!"
 bp1_yearly.9048.b:0 "โอ้ ไปให้พ้น เจ้า [bp1_yearly_9048_nemesis.Custom2('InsultNoun', ROOT.Char)]"
 9048_you_lose:0 "ท่านพ่ายแพ้ในการต่อสู้"
 
 bp1_yearly.9049.t:0 "ผลกรรมที่สาสม?"
 bp1_yearly.9049.desc:0 "[bp1_yearly_9048_nemesis.GetName] ล้มลงแทบเท้าข้า อาบเลือดและบอบช้ำจากความพยายามอันน่าสมเพชที่จะเอาชนะข้า การต่อสู้จบลงแล้วและข้าคือผู้ชนะที่ชัดเจน แต่ข้ายังรู้สึกถึงไฟที่ลุกโชนในใจ หมัดของข้าไม่ต้องการสิ่งใดมากไปกว่าการอัด [bp1_yearly_9048_nemesis.Custom2('InsultAdjective', ROOT.Char)] [bp1_yearly_9048_nemesis.Custom2('InsultNoun', ROOT.Char)] ผู้นี้ให้จมดิน จนกว่าจะไม่เหลือสิ่งใดนอกจากรอยเลือด\n\n[bp1_yearly_9048_nemesis.GetNameNoTooltip] ยกมือขึ้นป้องใบหน้าของ [bp1_yearly_9048_nemesis.GetHerHis] อย่างอ่อนแรง ดวงตาเต็มไปด้วยความหวาดกลัวของ [ROOT.Char.Custom('GetAnimalType')] ที่รู้ว่าการล่าสิ้นสุดลงแล้ว"
 bp1_yearly.9049.a:0 "ข้าจะกัดเนื้อเจ้าออกมาสักชิ้น!"
 bp1_yearly.9049.b:0 "เรื่องนี้จบแล้ว"
 bp1_yearly.9049.c:0 "$bp1_yearly.9049.b$.. สำหรับเจ้า!"
 
 bp1_yearly.9050.t:0 "เรื่องราวสงคราม"
 bp1_yearly.9050.desc:0 "สิ่งหนึ่งที่ [bp1_yearly_9050_friend.GetNamePossessive] ชอบทำกับข้ามากที่สุดคือการนั่งข้างกองไฟและแลกเปลี่ยนเรื่องราวสงครามในคืนที่สวยงาม และคืนนี้เราได้รำลึกความหลังตั้งแต่พระอาทิตย์ขึ้นจนถึงพระจันทร์ตกจนถึงพระอาทิตย์ขึ้นอีกครั้ง!\n\nข้าเริ่มต้นด้วยการเล่าถึงช่วงเวลาที่ [bp1_yearly_9050_my_memory.GetDescription] ทำให้ [bp1_yearly_9050_friend.GetFirstNameNoTooltip] ประสานมือของ [bp1_yearly_9050_friend.GetHerHis] และหัวเราะ\n\n"เป็นเรื่องเล่าที่ดี! แต่จริงๆ แล้ว ข้าบอกท่าน สหาย ไม่มีเหตุการณ์ใดที่รุ่งโรจน์ไปกว่าในประวัติศาสตร์ทั้งหมดเท่ากับเมื่อ [bp1_yearly_9050_friend_memory.GetDescription]! ฮ่า! ช่างเป็นวันที่รุ่งโรจน์ที่เราเคยมี และข้าภาวนาขอให้มีความรุ่งโรจน์อีกมากมายที่จะมาถึง!""
 bp1_yearly.9050.a:0 "ไม่มีใครเล่าเรื่องได้เก่งเท่า [bp1_yearly_9050_friend.GetFirstNameNoTooltip]!"
 bp1_yearly.9050.b:0 "#EMP เรื่องของข้า#! ชัดเจนว่าดีกว่า!"
 exploitative_lord_modifier:0 "เจ้าผู้ขูดรีด"
 exploitative_lord_modifier_desc:0 "ตัวละครนี้แสวงหาประโยชน์แม้กระทั่งจากไพร่ที่ยากจนข้นแค้นที่สุด หากมีเหรียญให้ฉกฉวยได้"
