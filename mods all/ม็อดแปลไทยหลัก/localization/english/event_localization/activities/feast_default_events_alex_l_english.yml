l_english: 
 feast_default_alex.100.t: "ความทรงจำร่วมกัน"
 feast_default_alex.100.desc: "[root_scope.Custom2('RelationToMeShort', SCOPE.sC('guest'))] ของข้า, [guest.GetTitledFirstName], [guest.Custom('quirk_pos_present')] ขณะที่ [guest.GetSheHe] ขยับเข้ามาใกล้ข้า\n\n"[guest.Custom2('RelationToMeShort', SCOPE.sC('root_scope'))] ผู้ [root_scope.Custom('ComplimentAdjective')] ของข้า! ช่างเป็นเวลาที่เราได้มีร่วมกัน! ช่างเป็นความทรงจำ!" [guest.GetSheHe|U] หัวเราะ "เช่นเคย มันเป็นวันที่เปี่ยมสุขนักเมื่อข้าได้รับพรให้อยู่ในความสำราญของท่าน"\n\n"อา ใช่แล้ว!" [other_guest.GetTitledFirstName] ที่อยู่ใกล้ ๆ แทรกขึ้นอย่างกระตือรือร้น "ผู้คนต่างเล่าขานถึงอดีตของท่าน: เมื่อครั้งที่ [guest_memory.GetThirdPerspectiveDescription]!""
 feast_default_alex.100.aa: ""ข้าจำสิ่งใดอันเป็นสาระสำคัญมิได้""
 feast_default_alex.100.a: ""ขอให้เรามีความทรงจำดี ๆ ต่อไปเถิด, [guest.GetFirstNameNoTooltip]""
 feast_default_alex.100.b: "อา, ช่างเป็นวันที่วิเศษโดยแท้!"
 feast_default_alex.200.t: "ข่าวลือดั่งโรคระบาด"
 feast_default_alex.200.desc: ""ท่าน[guest.Custom2('RelationToMeShort', SCOPE.sC('root_scope'))]ของข้า, ข้าได้ยินข่าวลือถึงโรคระบาดที่เรียกขานว่า [epidemic.GetName]..." [guest.GetTitledFirstName] เอ่ยด้วยความกังวล\n\n"ว่ากันว่ามันกำลังลุกลามหนักใน [afflicted_top_liege.GetPrimaryTitle.GetBaseName], โดยเหยื่อนั้น [sick_peasant.Custom('disease_desc_short')]... แม้ แต่ [root_scope.Custom('GetExpensiveMeal')] ก็มิอาจ ทำให้ข้าคลายกังวลได้""
 feast_default_alex.200.a: "อืม, เราควรเตรียมพร้อมที่ [root_scope.GetCapitalLocation.GetTitle.GetNameNoTierNoTooltip]..."
 feast_default_alex.200.b: "มานี่เถิด, ทำใจให้สงบก่อน"
 feast_default_alex.200.c: "พวกเรามาสวดภาวนาให้ [afflicted_top_liege.GetPrimaryTitle.GetBaseNameNoTierNoTooltip] กันเถิด"
 feast_default_alex.200.d: "อย่าได้กังวลเลย, มันไม่มีทางมาถึงที่นี่ดอก!"
 plague_preparations_modifier: "การเตรียมพร้อมรับมือโรคระบาด"
 plague_preparations_modifier_desc: "สถานที่แห่งนี้เตรียมพร้อมอย่างดีเพื่อรับมือโรคระบาดใดๆ ที่จะมาถึง"
