l_english: 
  
 ### OPTIONS
 feast_option_type:0 "เหตุผลสำหรับงานเลี้ยง"
 feast_type_generic:0 "งานเลี้ยง"
 feast_type_generic_desc:1 "$EFFECT_LIST_BULLET$ เหตุการณ์จะนำไปสู่โอกาสในการได้รับ [opinion|E]\n$EFFECT_LIST_BULLET$ ตัวเลือกบางอย่างจะช่วยให้สูญเสีย [stress|E] ได้\n\n#weak งานเลี้ยง #EMP จำเป็นต้อง#! มีเหตุผลด้วยหรือ?!#"
 feast_type_murder:0 "งานเลี้ยงสังหาร"
 feast_type_murder_desc:3 "$EFFECT_LIST_BULLET$ ท่านจะเลือกวิธีสังหารแขกผู้มีเกียรติและคณะผู้ติดตามของพวกเขา\n\n#weak ท่านไม่ได้เชิญแขก ท่านกำลังล่อลวงเหยื่อ!#!\n\n@warning_icon! #X ท่านจะไม่สามารถจัด [GetActivityType('activity_feast').GetName] สังหารได้เป็นเวลา 15 ปี#!\n@warning_icon! #X การตั้งเป้าหมายไปที่ [liege|E] หรือ [head_of_faith|E] ของท่านจะมีบทลงโทษที่รุนแรงกว่า#!\n\n@alert_icon! #alert_trial ตัวละครที่มีลักษณะนิสัย [GetTrait('just').GetName( GetNullCharacter )], [GetTrait('compassionate').GetName( GetNullCharacter )] และ [GetTrait('calm').GetName( GetNullCharacter )] จะได้รับ [stress|E]#!"
 feast_option_food:1 "ความซับซ้อนของอาหาร"
 feast_food_bad:1 "จานไม้เรียบง่าย"
 feast_food_bad_desc:2 "$EFFECT_LIST_BULLET$ ลดการได้รับ [prestige|E]\n\n#weak ขุนนางทุกคนย่อมชื่นชมอาหารเรียบง่ายที่ดีในปริมาณมาก มากกว่าอาหารหรูหราเหล่านั้นแน่นอน ใช่ไหม?!#"
 feast_food_normal:1 "อาหารเลิศรสแปลกใหม่"
 feast_food_normal_desc:2 "$EFFECT_LIST_BULLET$ ได้รับ [prestige|E] ปานกลาง\n\n#weak งานเลี้ยงใดๆ ที่น่าจดจำย่อมต้องเสริมความหรูหราตามปกติที่ชนชั้นสูงคาดหวังด้วยอาหารที่แปลกและเลิศรสยิ่งกว่า ท้ายที่สุดแล้ว!#"
 feast_food_good:1 "ศิลปะการทำอาหาร"
 feast_food_good_desc:2 "$EFFECT_LIST_BULLET$ เพิ่มการได้รับ [prestige|E] อย่างมาก\n\n#weak ยัด #EMP สิ่งนี้#! เข้าไปใน #EMP สิ่งนั้น#! แล้วตรึงกลับเข้าไปให้ดูเหมือนเหยี่ยวทะยานฟ้า! อาหารที่ไม่มีเรื่องราวก็ไม่ต่างอะไรกับ #EMP น้ำล้างจาน#!.#!"

 feast_option_courses:0 "จำนวนคอร์สอาหาร"
 feast_courses_bad:0 "น่าพอใจ"
 feast_courses_bad_desc:2 "$EFFECT_LIST_BULLET$ ได้รับ [opinion|E] เล็กน้อย\n$EFFECT_LIST_BULLET$ ได้รับ [opinion|E] จาก [vassal|E] [GetVassalStance( 'courtly' ).GetTextIcon][GetVassalStance( 'courtly' ).GetName] น้อยมาก\n\n#weak ด้วยอาหารไม่ถึงครึ่งโหล แขกที่นี่คงจะอิ่มแน่นอน หากไม่ประทับใจเป็นพิเศษ!#"
 feast_courses_normal:0 "เหมาะสม"
 feast_courses_normal_desc:3 "$EFFECT_LIST_BULLET$ ได้รับ [opinion|E] ปานกลาง\n$EFFECT_LIST_BULLET$ ได้รับ [opinion|E] จาก [vassal|E] [GetVassalStance( 'courtly' ).GetTextIcon][GetVassalStance( 'courtly' ).GetName] ปานกลาง\n\n#weak งานเลี้ยงต้องการความฟุ่มเฟือยในระดับหนึ่ง และสิ่งนี้จะตอบสนองความคาดหวังนั้น!#"
 feast_courses_good:0 "ฟุ่มเฟือย"
 feast_courses_good_desc:2 "$EFFECT_LIST_BULLET$ ได้รับ [opinion|E] อย่างมาก\n$EFFECT_LIST_BULLET$ ได้รับ [opinion|E] จาก [vassal|E] [GetVassalStance( 'courtly' ).GetTextIcon][GetVassalStance( 'courtly' ).GetName] มากขึ้น\n\n#weak อาหารกว่าสองโหลคอร์สจากดินแดนใกล้และไกล! อาหารพื้นเมือง! อาหารแปลกใหม่! ซุป! ของล้างปาก! ของหวาน อาหารจานหลัก และอื่นๆ อีกมากมาย!#!"

 ### PHASES
 feast_phase_meal:0 "งานเลี้ยง"
 feast_phase_toast:0 "การดื่มอวยพรครั้งสุดท้าย"

 ### INTENTS

 every_guest_scope_tt:0 "แขกทุกคน"

 feast.0010.desc:0 "เหตุใดท่านจึงตอบรับคำเชิญของข้าพเจ้าเพียงเพื่อไปร่วมงานเลี้ยงของ [other_host.GetTitledFirstNamePossessive] แทน ข้าพเจ้าไม่ทราบ แต่จงรู้ไว้ว่าข้าพเจ้าจะจดจำสิ่งนี้ไว้"
 feast.0010.a:0 "โชคร้าย"

 feast.1501.opening:0 "[sender.Custom2('AppropriateGreeting', ROOT.Char)]"
 feast.1501.opening_desc:0 "ข้าพเจ้าขอเชิญท่านเข้าร่วมงานเลี้ยง ณ ราชสำนักของข้าพเจ้าใน [barony.GetNameNoTier]!"
 feast.1501.host_likes_me:0 "ข้าพเจ้าหวังว่าท่านจะเข้าร่วม เพราะหากท่านไม่มาคงจะเป็นที่คิดถึงอย่างยิ่ง"
 feast.1501.host_gets_along_with_me:0 "ในฐานะ [ROOT.Char.GetTitleTierName] ที่โดดเด่น ข้าพเจ้าจะรู้สึกเป็นเกียรติอย่างยิ่งหากท่านเข้าร่วม"
 feast.1501.host_dislikes_me:0 "ข้าพเจ้าคาดหวังว่าทุกคนที่มีความสำคัญจะอยู่ที่นั่น ซึ่งน่าเสียดายที่ รวมถึงท่านด้วย"
 feast.1501.a:0 "แน่นอน ข้าพเจ้าจะเข้าร่วม"
 feast.1501.b:0 "ข้าพเจ้าจะเข้าร่วม อย่างไม่เต็มใจ"
 feast.1501.c:0 "ข้าพเจ้าเสียใจที่ต้องกล่าวว่าข้าพเจ้าไม่ว่าง"
 feast.1501.d:0 "ไม่ ข้าพเจ้าปฏิเสธ!"

 feast.1502.desc:0 "ข้าพเจ้าขอเชิญท่านเข้าร่วมงานเลี้ยง ณ ราชสำนักของข้าพเจ้าใน [barony.GetNameNoTier]! มันจะเป็นงานที่ยิ่งใหญ่ คู่ควรกับการปรากฏตัวอันทรงเกียรติของท่าน"
 feast.1502.a:0 "ด้วยความยินดีอย่างยิ่ง"
 feast.1502.b:0 "ข้าพเจ้ามีเรื่องสำคัญกว่าที่ต้องจัดการ"

 feast.1503.desc:0 "ข้าพเจ้าขอเชิญท่านเข้าร่วมงานเลี้ยง ณ ราชสำนักของข้าพเจ้าใน [barony.GetNameNoTier]! มันจะเป็นงานที่ยิ่งใหญ่ พร้อมด้วยอาหารเลิศรสและความบันเทิง"
 feast.1503.a:0 "ด้วยความยินดีอย่างยิ่ง"
 feast.1503.b:0 "ข้าพเจ้ามีเรื่องสำคัญกว่าที่ต้องจัดการ"

 feast.2001.t:0 "การรวมตัวอันรื่นเริง"
 feast.2001.t_murder:0 "การรวมตัวอันชั่วร้าย"
 feast.2001.desc_intro:0 "แขกเหรื่อมารวมตัวกันในห้องโถงใหญ่ เหล่าลอร์ดและเลดี้จากดินแดนใกล้ไกลของอาณาจักร"
 feast.2001.desc_fallback:0 "$feast.2001.desc_intro$$feast.2001.desc_outro$"
 feast.2001.desc_gregarious:0 "$feast.2001.desc_intro$ ข้าพเจ้า #EMP ปรารถนา#! โอกาส เช่นนี้มานานแล้ว$feast.2001.desc_outro$"
 feast.2001.desc_shy:0 "$feast.2001.desc_intro$ ข้าพเจ้าจัดเสื้อผ้าให้เข้าที่ นี่ไม่ใช่ #EMP ความคิด#! ของข้าพเจ้าเกี่ยวกับค่ำคืนที่สมบูรณ์แบบนัก แต่มันก็คงต้องเป็นไป$feast.2001.desc_outro$"
 feast.2001.desc_ambitious:0 "$feast.2001.desc_intro$ อา หนึ่งในสิ่งที่ข้าพเจ้าชอบคือการเฝ้าดูผู้คนมึนเมา... และได้ยินพวกเขาพูดมากกว่าที่ควร$feast.2001.desc_outro$"
 feast.2001.desc_nerd:0 "$feast.2001.desc_intro$ ปกติข้าพเจ้าชอบอยู่กับหนังสือมากกว่าผู้คน แต่หน้าที่ก็คือหน้าที่$feast.2001.desc_outro$"
 feast.2001.desc_martial:0 "$feast.2001.desc_intro$ ข้าพเจ้าต้องยอมรับว่าการไม่สามารถนำอาวุธเข้ามาได้ลดทอนความน่าดึงดูดของการเฉลิมฉลอง$feast.2001.desc_outro$"
 feast.2001.desc_lustful:0 "$feast.2001.desc_intro$ มี... #EMP ของน่าลิ้มลอง#! ให้เลือกมากมาย$feast.2001.desc_outro$"
 feast.2001.desc_outro:0 "\n\nบรรยากาศสดใส และจิตใจเบิกบานเมื่องานเลี้ยงเริ่มต้นขึ้น!"
 feast.2001.desc_murder_feast:1 "ขณะที่แขกเดินเข้ามาในห้องโถงใหญ่ ข้าพเจ้าเห็นพวกเขาทีละคน [honorary_guest.GetTitledFirstName]... กล้าดียังไง [honorary_guest.GetSheHe] ถึงย่างกรายเข้ามาในบ้านของข้าพเจ้า? และคณะผู้ติดตามของ [honorary_guest.GetHerHis]... ล้วนเป็นศัตรูของข้าพเจ้า — ศัตรูของอาณาจักร!\n\nขณะที่คนรับใช้จุดไฟในเตาผิงใหญ่ ข้าพเจ้าก็เกิดความคิดขึ้นมาทันที จะเป็นอย่างไรหากภัยพิบัติจากการดำรงอยู่ของพวกเขาสามารถถูกชำระล้างได้ในคราวเดียว?"
 feast.2001.a:0 "ยินดีต้อนรับ สหายทั้งหลาย!"
 feast.2001.a.tt:0 "งานเลี้ยงเริ่มต้นขึ้น"
 feast.2001.b:1 "[honorary_guest.GetFirstNameNoTooltip] และคณะผู้ติดตามของ [honorary_guest.GetHerHis] ข้าพเจ้าต้องการให้พวกเขาทั้งหมดหายไป"
 feast.2001.c:1 "ข้าพเจ้าต้องการเพียงให้ [honorary_guest.GetFirstNameNoTooltip] ตาย"
 feast.2001.d:2 "[honorary_guest.GetFirstNameNoTooltip] ต้องตาย แต่ #EMP ห้ามใคร#! สงสัยข้าพเจ้า"
 feast.2001.d.tt:1 "ความพยายามลอบสังหารอาจล้มเหลว"
 feast.2001.e:0 "พวกเขาทั้งหมดเป็นแขกในบ้านของข้าพเจ้า จะไม่มีอันตรายใดๆ เกิดขึ้นกับพวกเขา"
 feast.2001.c.people_to_spare:0 "ทุกคนที่ข้าพเจ้ารักจะได้รับการเตือน"
 feast.2001.e.tt:0 "งานเลี้ยงเริ่มต้นขึ้น — และจะไม่มีใครได้รับอันตราย"

 feast.2002.t:0 "$feast_header$ ละทิ้งหน้าที่"
 feast.2002.desc:1 "ช่างเป็นหายนะ!\n\nหลังจากการเตรียมการทั้งหมดของข้าพเจ้า แขกของข้าพเจ้ามาถึงงานเลี้ยงที่ไม่มีเจ้าภาพ! พวกเขากลับบ้านไปแล้ว และข้าพเจ้าได้ทิ้งความประทับใจอันเลวร้ายไว้กับพวกเขา"
 feast.2002.a:0 "ข้าพเจ้าอาจจะต้องเสียใจกับเรื่องนี้"
 
 feast.2003.t:0 "$feast_header$ การเฉลิมฉลองที่น่าสมเพช"
 feast.2003.desc:0 "ข้าพเจ้าไม่อยากจะเชื่อเลย แม้จะมีคำเชิญและการเตรียมการของข้าพเจ้า แต่ไม่มีแขกแม้ แต่คนเดียวมาที่งานเลี้ยงของข้าพเจ้า\n\nไม่เป็นไร! ข้าพเจ้าจะเพลิดเพลินกับอาหารและไวน์ทั้งหมดนี้ด้วยตัวเอง และเสียงสะท้อนของฝีเท้าในห้องโถงใหญ่ของข้าพเจ้าคือเพื่อนทั้งหมดที่ข้าพเจ้าต้องการ!"
 feast.2003.a:0 "ข้าพเจ้าโดดเดี่ยวถึงเพียงนี้เชียวหรือ?"
 feast.2003.b:0 "ข้าพเจ้ารู้สึกโล่งใจเล็กน้อย"
 
 feast.2010.t:0 "$feast_header$ โชคดีโดยบังเอิญ?"
 feast.2010.desc:0 "ข่าวมาถึงข้าพเจ้าว่าแขก #EMP คนพิเศษสุด#! ของข้าพเจ้า [ROOT.Var('murder_guest_host_var').GetCharacter.GetTitledFirstName] ได้พบจุดจบของ [ROOT.Var('murder_guest_host_var').GetCharacter.GetHerHis] เร็วกว่าที่คาดไว้เล็กน้อย เราทุกคนจะไว้อาลัยต่อการตายของ [ROOT.Var('murder_guest_host_var').GetCharacter.GetHerHis] และยกเลิกงานเลี้ยงเพื่อเป็นการระลึกถึง [ROOT.Var('murder_guest_host_var').GetCharacter.GetHerHis]\n\n#EMP ข้าพเจ้าเพียงหวังว่ามันจะเป็นฝีมือของข้าพเจ้า!#!"
 feast.2010.a:0 "น่าเสียดายจริงๆ"
 feast.2010.a.tt:0 "งานเลี้ยงสังหารถูกยกเลิก"
 
 feast.2011.t:0 "$feast_header$ การตายที่ไม่คาดฝัน"
 feast.2011.desc:0 "การตายอย่างกะทันหันของ [host.Var('murder_guest_host_var').GetCharacter.GetTitledFirstName] ทำให้เราทุกคนประหลาดใจ และ [host.GetTitledFirstName] ได้ตัดสินใจยกเลิกงานเลี้ยงเพื่อเป็นการระลึกถึง [host.Var('murder_guest_host_var').GetCharacter.GetHerHis] ท้ายที่สุดแล้ว ทั้งหมดนี้ก็เพื่อเป็นเกียรติแก่ [host.Var('murder_guest_host_var').GetCharacter.GetHerHis]"
 feast.2011.a:0 "$feast.2010.a$"
 feast.2011.a.tt:0 "งานเลี้ยงถูกยกเลิก"
 
 feast.2020.t:0 "$feast_header$ ปฏิเสธคำเชิญ"
 feast.2020.desc:0 "ข้าพเจ้าไม่อยากจะเชื่อเลย! [ROOT.Var('murder_guest_host_var').GetCharacter.GetTitledFirstName] ปฏิเสธคำเชิญเข้าร่วมงานเลี้ยงที่ไม่น่าสงสัยอย่างสมบูรณ์แบบของข้าพเจ้า! แม้จะเป็นแขก #EMP คนพิเศษสุด#! ของข้าพเจ้าก็ตาม รับไม่ได้โดยสิ้นเชิง!"
 feast.2020.a:0 "ข้าพเจ้าจะจัดการเจ้าไม่ช้าก็เร็ว [ROOT.Var('murder_guest_host_var').GetCharacter.GetFirstNameNoTooltip]..."
 feast.2020.a.tt:0 "$feast.2010.a.tt$"
 
 feast.2021.t:0 "$feast.2020.t$"
 feast.2021.desc:0 "ช่างน่าอัปยศ! [host.Var('murder_guest_host_var').GetCharacter.GetTitledFirstName] ปฏิเสธคำเชิญของ [host.GetTitledFirstNamePossessive] ในฐานะแขกพิเศษสำหรับงานเลี้ยง! และตอนนี้ [host.GetSheHe] กำลังส่งเราทุกคนกลับบ้าน! หากเป็นข้าพเจ้า ข้าพเจ้าจะ #EMP ไม่มีวัน#! ฟื้นตัวจากเรื่อง เช่นนี้ได้..."
 feast.2021.a:0 "$feast.2010.a$"
 feast.2021.a.tt:0 "$feast.2011.a.tt$"
 
 feast.2501.t:0 "การต้อนรับอันอบอุ่น"
 feast.2501.likes_host:0 "แขกทุกคนมารวมตัวกันในห้องโถงใหญ่ และเจ้าภาพผู้มีเมตตาของเรา [host.GetTitledFirstName] ได้ต้อนรับเราทุกคนสู่งานเลี้ยง!"
 feast.2501.dislikes_host:0 "แขกเหรื่อทุกคนมารวมตัวกันในโถงแล้ว, และเจ้าภาพ [host.Custom2('InsultAdjective', ROOT.Char)] ของเรา, [host.GetTitledFirstName], ก็ได้กล่าวต้อนรับเราทุกคนสู่งานเลี้ยงในที่สุด"
 feast.2501.a.gluttonous:0 "ข้าพเจ้าได้กลิ่นครัวจากที่นี่!"
 feast.2501.a.drunkard:0 "[ROOT.Char.Custom('RegionalAlcoholicDrink')] อยู่ที่ไหน!"
 feast.2501.a.gregarious:0 "ข้าพเจ้ารอไม่ไหวที่จะคุยกับทุกคน!"
 feast.2501.a.shy:0 "มีคนอยู่ที่นี่เยอะมาก..."
 feast.2501.a:0 "ข้าพเจ้ารอคอยสิ่งนี้!"
 feast.2501.b:0 "นี่ควรจะคุ้มค่ากับเวลาของข้าพเจ้า"

 feast.5003.t:0 "สิ้นสุดงานรื่นเริง"
 feast.3601.desc:1 "ด้วยการจากไปของ [host.Custom2('MyCharacterIntroduction', ROOT.Char)] งานเลี้ยงของ [host.GetHerHis] ก็สิ้นสุดลง\n\nขณะที่แขกผู้โศกเศร้าจากไป ข้าพเจ้าสวดภาวนาขอให้ [ROOT.Char.GetFaith.HighGodNameAlternate] ต้อนรับ [host.GetFirstName] อย่างอบอุ่นสู่ [ROOT.Char.GetFaith.PositiveAfterLife] เช่นเดียวกับที่ [host.GetSheHe] ต้อนรับเราสู่ห้องโถงของ [host.GetHerHis]"
 feast.3601.a:0 "มันเป็นงานเลี้ยงที่สนุกมาก!"
 feast.3601.a.tt:1 "#F ท่านรู้ไหม... จนกระทั่ง [host.GetSheHe] ตาย#!."

 feast.5004.desc:0 "เนื่องจากตอนนี้ข้าพเจ้าติดอยู่ในคุก งานเลี้ยงใหญ่ของข้าพเจ้าจะถูกยกเลิก โอ้ เวลาทั้งหมดที่ข้าพเจ้าใช้เตรียมมัน... สูญเปล่า!"
 feast.5002.a:1 "ไม่มีเจ้าภาพ ไม่มีงานเลี้ยง"

 feast.5005.desc:0 "[host.Custom2('MyCharacterIntroduction', ROOT.Char)|U] ถูกคุมขัง และงานเลี้ยงใหญ่ของ [host.GetHerHis] ก็สิ้นสุดลง ช่างเป็นช่วงเวลาที่โชคร้าย!"

 feast.0050.t:0 "ศิลปะแห่งการรื่นเริง"
 feast.0050.desc:0 "ไวน์ เอล และอาหารชั้นเลิศ! จะมีอะไรบรรเทาความทุกข์ของโลกได้ดีไปกว่าค่ำคืนแห่งการเฉลิมฉลอง?\n\nเมื่องานเลี้ยง แต่ละครั้งสิ้นสุดลง ข้าพเจ้าพบว่าตัวเองกำลังวางแผนงานเลี้ยงครั้งต่อไป!"
 feast.0050.a:0 "ข้าพเจ้าสงสัยว่าใครจะมา!"
 feast.0050.b:0 "แต่ข้าพเจ้ามีเรื่องอื่นที่ต้องทำ..."
 
 feast.7002.t:0 "การใช้เวลา"
 feast.7002.desc_intro:0 "คนรับใช้วิ่งข้ามห้องโถง นำของตก แต่งชิ้นสุดท้ายมา แขกบางคนยังมาไม่ถึง และข้าพเจ้าดื่มด่ำกับเครื่องดื่มแสนอร่อยข้างกองไฟ"
 feast.7002.dislikes_host:0 "ข้ารอแทบไม่ไหวที่จะเห็น [host.Custom2('InsultNoun', ROOT.Char)] นั่นทำตัวขายหน้า [host.GetHerselfHimself]"
 feast.7002.likes_host:0 "ไม่มีที่ไหนที่ข้าพเจ้าอยากอยู่มากกว่านี้"
 feast.7002.neutral:0 "#EMP โอ้.#! ดูเหมือนข้าพเจ้าจะเห็น [ROOT.Char.Custom('GetExpensiveMeal')] บ้างแล้ว..."
 feast.7002.intent_arrived:0 "\n\nข้าพเจ้าเห็น [ROOT.Char.GetIntentTarget.GetTitledFirstName] ท่ามกลางฝูงชน โดยไม่รู้เลยถึงแผนการของข้าพเจ้าที่จะ [ROOT.Char.GetInvolvedActivityIntent.GetName|l] [ROOT.Char.GetIntentTarget.GetHerHim]"
 feast.7002.intent:0 "\n\nข้าพเจ้ายังหา [ROOT.Char.GetIntentTarget.GetTitledFirstName] ไม่เจอเลย ข้าพเจ้ารอไม่ไหวที่ [ROOT.Char.GetIntentTarget.GetHerHim] จะมาถึง เพื่อที่แผนการของข้าพเจ้าที่จะ [ROOT.Char.GetInvolvedActivityIntent.GetName|l] [ROOT.Char.GetIntentTarget.GetHerHim] จะได้เริ่มต้นเสียที"
 feast.7002.a.good:0 "เรามีช่วงเวลาที่น่ารักรออยู่ข้างหน้า!"
 feast.7002.a.bad:0 "ข้าพเจ้ารอไม่ไหวที่จะกลับบ้าน"
 
 feast.7101.t:0 "สิ้นสุดการเฉลิมฉลอง"
 feast.7101.desc:0 "เทียนเพียงไม่กี่เล่มที่ยังคงอยู่หลังจากแขกคนสุดท้ายจากไป ข้าพเจ้าได้ยินเสียงคนรับใช้คู่หนึ่งถอนหายใจอย่างโล่งอกหลังจากประตูปิดลง อาหารยังคงอุ่นอยู่บนจานเซรามิก\n\nในไม่ช้า ข่าวจะไปถึงทุกมุมของอาณาจักร และขุนนางทุกคนที่คู่ควรจะรู้ว่าความยิ่งใหญ่ของข้าพเจ้านั้นไม่มีใครเทียบได้"
 feast.7101.a:0 "และด้วยเหตุนี้ ทุกอย่างก็เสร็จสิ้น"
 
 feast.7110.t:0 "ตอนจบที่มีความสุข"
 feast.7110.desc.entourage:2 "แสงเทียน ทำให้เลือดดูเหมือนพรมกำมะหยี่ แผ่กระจายลงบนพื้น ข้าพเจ้าหายใจอีกครั้งเมื่อเห็น $knight_culture_player_plural_no_tooltip$ คนสุดท้ายของข้าพเจ้าเช็ดดาบของ [my_knight.GetHerHis] — [my_knight.GetSheHe] พยักหน้าให้ข้าพเจ้าอย่างเงียบๆ\n\nข้าพเจ้าส่งสัญญาณให้ [my_knight.GetWomenMen] คนหนึ่งปิดประตู ข้าพเจ้ากล่าวลาแขกของข้าพเจ้า "น่าเสียดายจริงๆ...""
 feast.7110.a:0 "งานสำเร็จลุล่วงไปด้วยดี"
 feast.7110.a.failure:0 "ครั้งหน้าข้าพเจ้าจะจัดการ [honorary_guest.GetHerHim]..."
 feast.7110.desc.target_intro:0 ""ช่างเป็นเหตุการณ์ที่โชคร้าย!" ข้าพเจ้าคร่ำครวญเสียงดังขณะกล่าวลาแขกของข้าพเจ้า "น่าเสียดายจริงๆ" อีกคนเห็นด้วยขณะที่นางจากไป "ช่างโชคร้ายจริงๆ" ข้าพเจ้าได้ยิน ขณะที่คู่สมรสของนางตามไปในไม่ช้า\n\n"
 feast.7110.desc.target:0 "$feast.7110.desc.target_intro$"ใครกันที่ทำ เช่นนี้? ทำลายงานเลี้ยงด้วยวิธีนี้... ผู้สมรู้ร่วมคิดมีอยู่ทุกหนทุกแห่ง" ข้าราชบริพารคนหนึ่งพึมพำ และข้าพเจ้าหันไปหาคนรับใช้ของข้าพเจ้าอย่างรวดเร็ว "ถึงเวลาปิดประตูแล้ว""
 feast.7110.desc.sneaky:0 "$feast.7110.desc.target_intro$ "ช่างเป็นวิธีตายที่น่าสยดสยอง!" คนสุดท้ายกล่าว เรียกคนรับใช้มาช่วย "ขาดอากาศหายใจ!" "ไม่ใช่คนแรกที่ตายแบบนี้ — และแน่นอนไม่ใช่คนสุดท้าย" คนรับใช้พึมพำขณะที่ข้าราชบริพารจากไป ประตูปิดตามหลังพวกเขา"
 feast.7110.desc.failed:0 ""ขอบคุณสำหรับงานเลี้ยงอันงดงาม!" แขกบางคนล้อมรอบข้าพเจ้าและต้องการแสดงความขอบคุณอย่างชัดเจนก่อนที่พวกเขาจะจากไป "เป็นช่วงเวลาที่ยอดเยี่ยมที่สุด!" ข้าพเจ้าไม่สามารถแยกแยะได้ว่าใครกำลังพูด เพราะหัวใจของข้าพเจ้ามีเพียงเรื่องเดียวที่ต้องใส่ใจ\n\nข้าพเจ้าพบ [honorary_guest.GetTitledFirstName] ข้างทางออก รอยยิ้มของ [honorary_guest.GetHerHis|U] ทำให้ข้าพเจ้าโกรธจัดได้เท่านั้นขณะที่ [honorary_guest.GetSheHe] โบกมือลา"
 murder_feast_family_opinion:0 "สังหารครอบครัวในงานเลี้ยง"
 bloody_wedding_family_opinion:0 "ครอบครัวเสียชีวิตในงาน แต่งงานเลือด"
 murder_feast_murderer_modifier:0 "เจ้าภาพนักวางแผน"
 murder_feast_great_murderer_modifier:1 "อาหารค่ำอันน่าสะพรึงกลัว"
 murder_feast_murderer_modifier_desc:1 "ตัวละครนี้ล้มเหลวในการปกป้อง $honorary_guest$ ในงานเลี้ยงของพวกเขา"
 murder_feast_great_murderer_modifier_desc:0 "$murder_feast_murderer_modifier_desc$"
 feast_every_guest:0 "แขกทุกคน"
 
 feast.7102.opening:0 "[avenging_family.Custom2('AppropriateGreeting', ROOT.Char)]"
 feast.7102.desc:0 "ข้ารู้ว่าเจ้าทำอะไรลงไป"
 feast.7102.a:0 "จงถือว่าเจ้าโชคดีที่ไม่ได้อยู่ที่นั่น"
 feast.7102.a.tt:0 "สมาชิกครอบครัวใกล้ชิดทุกคนของ [murder_guest.GetShortUIName]"

 feast.7151.t:0 "ได้เวลาไป"
 feast.7151.desc:0 "แสงแดดสาดส่องผ่านหน้าต่าง และในชั่วพริบตา ห้องโถงทั้งห้องก็สว่างไสว ที่นั่งส่วนใหญ่ว่างเปล่าแล้ว คนรับใช้บางคนยื่นอาวุธให้ข้าพเจ้าและจากไปด้วยการโค้งคำนับอย่างร่าเริง\n\n"เป็นความยินดีอย่างยิ่งที่ได้ท่านอยู่กับเรา" [host.GetTitledFirstName] ยิ้มให้ข้าพเจ้า"
 feast.7151.desc.desc_roughed_up: "แสงแดดสาดส่องผ่านหน้าต่าง และในชั่วพริบตา ห้องโถงทั้งห้องก็สว่างไสว ที่นั่งส่วนใหญ่ว่างเปล่าแล้ว อาจไม่น่าแปลกใจเมื่อเห็นสิ่งที่ข้าพเจ้าทำกับสถานที่แห่งนี้!\n\n"ข้าพเจ้าเกลียดชังท่านอย่างที่สุด ดูสิ่งที่ท่านทำกับบ้านของข้าพเจ้าสิ!" [host.GetTitledFirstName] ขมวดคิ้วใส่ข้าพเจ้า"
 feast.7151.a:0 "แต่ตอนนี้ข้าพเจ้าจะจากไป"

 feast.7201.t:0 "ดื่มอวยพรแด่..."
 feast.7201.desc:0 "งานเลี้ยงเริ่มใกล้จะสิ้นสุดลงแล้ว และแขกของข้าพเจ้าคงคาดหวังให้ข้าพเจ้าให้ความสนใจเล็กน้อยแก่ [goh.GetTitledFirstName] แขกผู้มีเกียรติของเรา\n\nตามธรรมเนียมแล้ว การดื่มอวยพรชมเชยและการดื่ม [host.Custom('RegionalDrink')] อย่างลึกซึ้งก็ใช้ได้ผล แต่แล้วอีกครั้ง ทั้งหมดที่ [goh.GetFirstNameNoTooltip] ทำคือมาปรากฏตัว งานเลี้ยงนี้เป็นความคิดของข้าพเจ้า ข้าพเจ้าจ่ายทุกอย่าง และข้าพเจ้าเป็นเจ้าภาพให้ทุกคน หืม"
 feast.7201.a:0 "และตอนนี้ ดื่มอวยพร! แด่ [goh.GetTitledFirstNameNoTooltip]!"
 feast.7201.b:0 "เรามากล่าวถึง #EMP [goh.Custom2('InsultNoun', ROOT.Char)]#! ที่เป็นหัวข้อหลักในยามนี้กันเถอะ..."
 feast.7201.b.tt:0 "ท่านดูถูก [goh.GetFirstNameNoTooltip] แทนที่จะให้เกียรติ [goh.GetHerHim]"
 feast.7201.c:0 "และพวกท่านทุกคน #EMP ยินดีอย่างยิ่ง#! สำหรับการต้อนรับของข้าพเจ้า"
 feast.7201.d: "ดื่มอวยพรแด่รัชสมัยของข้าพเจ้า!"

 feast.7202.t:0 "$feast.7201.t$"
 feast.7202.desc.intro:0 "เมื่องานเลี้ยงดำเนินไปสู่บทสรุปที่หลีกเลี่ยงไม่ได้ ยังมีเหตุการณ์หนึ่งเหลืออยู่ที่ทุกคนคาดหวัง และนั่นคือการดื่มอวยพรของ [host.GetTitledFirstNamePossessive] แด่แขกผู้มีเกียรติ:"
 feast.7202.desc.honoured:0 "ข้าพเจ้า\n\nเป็นช่วงเวลาที่น่ารัก เป็นช่วงเวลาที่ข้าพเจ้ารอคอยมาตลอดทั้งเย็น และมันก็มาถึงและผ่านไปเร็วเหลือเกิน"
 feast.7202.desc.slagged_off:0 "ข้าพเจ้า\n\nอย่างไรก็ตาม แทนที่จะยกย่องข้าพเจ้าเหมือนที่ [host.GetSheHe] สัญญาไว้ในคำเชิญ [host.GetFirstNameNoTooltip] กลับเริ่มกล่าวสุนทรพจน์ที่เผ็ดร้อน ตั้งคำถามถึงลักษณะนิสัย สติปัญญา และสุขอนามัยส่วนบุคคลของข้าพเจ้า อย่าง #EMP ยืดยาว#!."
 feast.7202.desc.bragged:0 "ข้าพเจ้า\n\nน่าเสียดาย ที่ [host.GetSheHe] เป็นคนขี้โม้ [host.GetFirstNameNoTooltip] ข้ามข้าพเจ้าไปเลยและเลือกที่จะเทคำชมเชยใส่ #EMP [host.GetHerselfHimself]#! สำหรับการจัดงานเลี้ยงบ้าๆ นี้ ข้าพเจ้าน่าจะรู้"
 feast.7202.a:0 "เป็นการดีที่ได้รับการชื่นชม"
 feast.7202.b:0 "ท่านทำ เช่นนี้กับข้าพเจ้าได้อย่างไร?"
 feast.7202.c:0 "ข้าพเจ้าจะจดจำสิ่งนี้ไว้"
 feast.7202.adventurer_loot: "อะไรกัน..? #EMP ทำร้าย [host.GetHerHim] ขโมย [host.Custom('GetExpensiveMeal')]!#!"
 feast.7202.c.tt:0 "[goh.GetFirstNameNoTooltip] ถือเป็นเรื่องส่วนตัว"

 feast.7203.t:0 "$feast.7201.t$"
 feast.7203.desc.intro:0 "$feast.7202.desc.intro$"
 feast.7203.desc.honoured:0 "[goh.GetTitledFirstName]\n\nเป็นสุนทรพจน์ที่ดี หากจะยืดยาวไปบ้าง แต่นั่นคือสิ่งที่มักจะเป็นไป แขกที่มารวมตัวกันปรบมือและโห่ร้องอย่างสุภาพเมื่อสิ้นสุดลง บางคนกระตือรือร้นมากกว่าคนอื่นๆ"
 feast.7203.desc.slagged_off:0 "[goh.GetTitledFirstName]\n\nน่าตกใจ เมื่อ [host.GetFirstNameNoTooltip] หันไปหาแขกของ [host.GetHerHis] แทนที่จะยกย่อง [goh.GetHerHim] [host.GetSheHe] กลับเริ่มกล่าวสุนทรพจน์ที่เสียงดังและตรงไปตรงมาอย่างน่าทึ่ง ตั้งคำถามถึงสติปัญญา ลักษณะทางศีลธรรม และกลิ่นโดยทั่วไปของ [goh.GetFirstNamePossessiveNoTooltip] พวกเราในกลุ่มผู้ฟังต่างตกตะลึงจนพูดไม่ออก"
 feast.7203.desc.bragged:0 "[goh.GetTitledFirstName]\n\nน่าประหลาดใจ แต่ก็ไม่น่าแปลกใจเกินไป [host.GetFirstNameNoTooltip] ส่วนใหญ่มองข้ามแขกของ [host.GetHerHis] และกลับยกย่อง #EMP [host.GetHerselfHimself]#! สำหรับคุณภาพของงานเลี้ยงที่จัดขึ้น อย่างดีที่สุดก็ถือว่าหยาบคายเล็กน้อย และจำนวนการปรบมือก็สะท้อนให้เห็น เช่นนั้น"
 feast.7203.a:0 "ไชโย! ไชโย!"
 feast.7203.b.goh_honoured:0 "ข้าพเจ้าไม่เคยชอบ [goh.GetFirstNameNoTooltip] มากนัก พูดตามตรง"
 feast.7203.b.goh_dishonoured:0 "นั่นไม่เหมาะสม"
 
 feast.0800.t:1 "$feast_header$ งานเลี้ยงที่ถูกตัดให้สั้นลง"
 feast.0800.desc:0 "บรรพบุรุษของข้า [host.GetNameRegnal] ได้ละสังขาร [host.GetHerHis] ขณะจัดงานเลี้ยง น่าเศร้าที่ [host.GetSheHe] [host.GetDeathReason]\n\n"
 feast.0800.desc.entourage:0 "$activity_system.1010.desc.entourage$"
 feast.0800.desc.ruler:0 "[host.GetTitleAsName] ผู้ล่วงลับไม่สมควรตาย เช่นนี้"
 feast.0800.a:0 "$activity_system.1010.a$"
 feast.0800.tt:0 "[GetActivityType('activity_feast').GetName] ของ [host.GetShortUINamePossessiveNoTooltip] ถูกยกเลิก"
 
 feast_events_flavor.0001.t: "ข้าเคยได้ยินชื่อเสียงของท่าน"
 feast_events_flavor.0001.desc.intro: ""[ROOT.Char.GetTitledFirstName]!" [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('guest'))] ของข้า [guest.GetTitledFirstName|U] เอ่ยชื่อข้า\n\n"
 feast_events_flavor.0001.desc.good: ""[guest.Custom2('RelationToMeShort', SCOPE.sC('relation_target'))] [relation_target.GetFirstName] ที่รักของข้า พูดถึงท่านอย่างชื่นชม" [guest.GetSheHe|U] กล่าวอย่างภาคภูมิใจ, พร้อมกับจิบ [guest.Custom('RegionalDrink')] ของ [guest.GetHerHis] "ข้าตั้งตารอที่จะได้ร่วมงานเลี้ยงกับท่าน""
 feast_events_flavor.0001.desc.bad: ""[guest.Custom2('RelationToMeShort', SCOPE.sC('relation_target'))] [relation_target.GetFirstName] ที่รักของข้า บอกข้าว่าท่านคือ [ROOT.Char.GetWomanMan] #EMP [ROOT.Char.Custom2('InsultAdjective', SCOPE.sC('relation_target'))]#! ข้าหวังเป็นอย่างยิ่งว่าข่าวลือนั้นจะเป็นเท็จ และเป็นเพียงเรื่องเข้าใจผิด""
 feast_events_flavor.0001.aa: ""ขอให้ตระกูล [ROOT.Char.GetDynasty.GetBaseNameNoTooltip] และ [guest.GetDynasty.GetBaseNameNoTooltip] จงผนึกกำลังกัน!""
 feast_alliance_effect_tooltip: "[guest.GetTitledFirstName] และข้าเข้าสู่ [alliance|E] ร่วมกัน"
 feast_events_flavor.0001.a: ""มาดื่มอวยพรให้ [relation_target.GetFirstNameNoTooltip]! และแด่ [guest.GetDynasty.GetBaseNameNoTooltip]!""
 feast_events_flavor.0001.b: ""และข้าก็มีเพียงคำพูดที่ชื่นชมไม่แพ้กันสำหรับ [relation_target.GetHerHim]""
 feast_events_flavor.0001.c: ""ข้าจะไม่มีวันไว้ใจ [guest.GetDynasty.GetBaseNameNoTooltip]""
 feast_events_flavor.0001.d: ""ข้าขออภัยสำหรับความผิดพลาดในอดีตของข้า""
 feast_events_flavor.0001.e: ""ข้าไม่ได้มาที่นี่เพื่อพูดถึง [relation_target.GetHerHim]!""

 feast_events_flavor.0002.t: "การให้อภัย, คือสิ่งศักดิ์สิทธิ์"
 feast_events_flavor.0002.desc: "[ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('former_rival'))] และ [Concept('rival','once-rival')|E] ของข้า, [former_rival.GetTitledFirstName] เดินมาที่โต๊ะของข้า, ในมือถือถ้วยสองใบ, [former_rival.Custom('quirk_pos_pp')] ก่อนที่ [former_rival.GetSheHe] จะ [former_rival.Custom('quirk_pos_adverb')] ทรุดตัวลงนั่งบนเก้าอี้ว่างข้างข้า ไม่นานเราทั้งคู่ก็สนทนากันอย่างออกรส, หวนรำลึกถึงความบาดหมางในอดีตของเรา"
 feast_events_flavor.0002.a: "ข้าไม่ได้คิดถึงการยั่วยุของเจ้าเสียทั้งหมดหรอกนะ, [former_rival.GetTitledFirstName] ที่รัก..."
 feast_events_flavor.0002.b: "เคยเป็นปรปักษ์กัน, บัดนี้ขอให้เราใกล้ชิดกันยิ่งกว่าเดิม!"
 feast_events_flavor.0002.c: "ขอบใจที่เตือนความจำข้า - ไปให้พ้น, เจ้า [former_rival.Custom2('InsultAdjective', ROOT.Char)] [former_rival.Custom2('InsultNoun', ROOT.Char)]!"
 feast_events_flavor.0002.c.vengeful_sinful.tt: "ท่านจะสูญเสีย [piety|E] เพราะ [faith|E] [THIS.GetCharacter.GetFaith.GetAdjective] ของท่านถือว่า [trait|E] [GetTrait('forgiving').GetName( GetNullCharacter )] เป็น [virtuous|E] หรือ [GetTrait('vengeful').GetName( GetNullCharacter )] เป็น [sinful|E]"
 feast_events_flavor.0002.c.forgiving_sinful.tt: "ท่านจะได้รับ [piety|E] เพราะ [faith|E] [THIS.GetCharacter.GetFaith.GetAdjective] ของท่านถือว่า [trait|E] [GetTrait('vengeful').GetName( GetNullCharacter )] เป็น [virtuous|E] หรือ [GetTrait('forgiving').GetName( GetNullCharacter )] เป็น [sinful|E]"
 feast_events_flavor.0002.d: "ขอ [former_rival.Custom('RegionalAlcoholicDrink')] เพิ่มให้ [former_rival.Custom2('InsultNoun', ROOT.Char)] [former_rival.Custom('ComplimentAdjective')] ผู้นี้!"
 feast_events_flavor.0002.d.virtuous: "การหันแก้มอีกข้างให้ช่างเป็นวิถี [ROOT.Char.GetFaith.GetReligion.GetAdjective] อย่างแท้จริง!"
 feast_events_flavor.0002.d.virtuous.tt: "ตัวเลือกนี้มีให้ เนื่องจาก [faith|E] [THIS.GetCharacter.GetFaith.GetAdjective] ของท่านถือว่า [trait|E] [GetTrait('forgiving').GetName( GetNullCharacter )] เป็น [virtuous|E] หรือ [GetTrait('vengeful').GetName( GetNullCharacter )] เป็น [sinful|E]"
 feast_turning_the_other_cheek_modifier: "การหันแก้มอีกข้างให้"
 feast_turning_the_other_cheek_modifier_desc: "ตัวละครนี้มีชื่อเสียงในด้านความสามารถที่จะก้าวข้ามความขุ่นเคืองในอดีต"
 
 every_ruler_guest_scope_tt: "Every guest [ruler|E]"
 feast.7201.f: "A toast to [goh.GetTitledFirstNameNoTooltip] — and to the bond between us!"
 feast.7201.f.flavor: "The rites of hospitality bind host and guest. You honor [goh.GetFirstNameNoTooltip] as one of your own."
 feast.7201.e: "A toast to the #EMP final#! course: [goh.GetFirstNameNoTooltip]!"
 feast.7201.e.flavor: "You raise a glass to a delicious meal: your Guest of Honor."
 feast.7201.e.warning.tt: "@death_icon! #high You#! will ritually kill and devour [goh.GetFirstName]. Attending guests are free to partake or abstain"
 feast.7201.e.warning.escape.tt: "@death_icon! #high You#! will attempt to ritually kill and devour [goh.GetFirstName], but [goh.GetSheHe] may escape. Attending guests may choose whether to partake if [goh.GetSheHe] is caught"
 feast.7201.e.toast: "A Delicious Meal"
 feast.7201.e.toast.tt: "You ritually devoured [goh.GetFirstName]"
 feast.7201.e.escape.toast: "The Meal Gets Away"
 feast.7201.e.escape.toast.tt: "[goh.GetFirstName] escaped before the ritual sacrifice could begin"
 feast.7206.t: "A Special Meal"
 feast.7206.desc: "By the end of [host.GetTitledFirstNamePossessive] final toast, I catch only a few words... something about a final course? How #EMP exciting#!!\n\nEvery guest has turned towards me. [host.GetFirstNameNoTooltip] raises [host.GetHerHis] glass, smiling through flesh-speckled teeth."
 feast.7206.desc.alcohol: "Plied the night long with beverages, [host.GetTitledFirstNamePossessive] final toast seems to me a little blurry and mysterious. I catch only the end of the speech... something about one last course? How #EMP exciting#!!\n\nAll the guests have turned to face me. [host.GetFirstNameNoTooltip] lifts [host.GetHerHis] glass, smiling through flesh-speckled teeth."
 feast.7206.a: "Wait... what?"
 feast.7206.a.cannibal: "How ironic."
 feast.7206.a.flavor: "[host.GetTitledFirstName] intends to serve you as the ritual meal; attending guests may choose to partake."
 feast.7206.b: ""I think it is getting late.""
 feast.7206.b.flavor: "You try to slip away while they prepare the tables."
 feast.7206.b.success: "You escape, #EMP narrowly#!"
 feast.7206.b.success.tt: "You slip away before the meal can begin"
 feast.7206.b.failure: "The guards catch you"
 feast.7207.t: "Toast Mortem"
 feast.7207.desc.devoured.guest: "My [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('goh'))] [goh.GetTitledFirstName] has been missing from the high table for some time. I am about to inquire where [goh.GetSheHe] went when a steaming portion of rich red meat arrives on my plate.\n\n"I have always wondered how [goh.GetFirstNameNoTooltip] tastes," [ritual_neighbor.GetTitledFirstName] says around a mouthful of meat."
 feast.7207.b.devoured: "Well, I can't say no to a sacred meal."
 feast.7207.b.devoured.flavor: "I take up my knife and join the host's holy feast."
 feast.7207.c.devoured: "I cannot stomach this."
 feast.7207.c.devoured.flavor: "I leave the plate untouched, whatever offense that gives."
 feast_refused_ritual_meal_opinion: "Did Not Partake in Religious Ceremony"
