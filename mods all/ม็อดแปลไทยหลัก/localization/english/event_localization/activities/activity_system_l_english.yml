 activity_system.0500.t: "จุดจบอันน่าสลด"
 activity_system.0500.desc: "ข้าได้รับข่าวว่าเจ้าภาพของเรา [host.GetNameNoTooltip] ได้ถึงแก่กรรมแล้ว เนื่องจากสถานการณ์ที่ไม่คาดฝันเหล่านี้ กิจกรรมของ [host.GetHerHis] จึงถูกยกเลิก"
 activity_system.0500.a: "ช่างเป็นโศกนาฏกรรมอย่างแท้จริง"

 activity_system.0501.t: "ดวงวิญญาณที่จากไป"
 activity_system.0501.desc: "เสียงอึกทึกดังไปทั่วโถงสอบ เหล่าบัณฑิตและพระสงฆ์ต่างวิ่งกันอลหม่าน ฝูงชนรวมตัวกันที่ลานกลาง และมีเสียงร่ำไห้ดังมาจากที่นั่น\n\n[ROOT.Char.GetTopLiege.Custom('GetDaughterSon')] แห่งสวรรค์สิ้นแล้ว"
 activity_system.0501.a: "ข้าไม่อยากจะเชื่อเลย..."

 activity_system.0550.t: "แผนการที่ล้มเหลว"
 activity_system.0550.desc: "เนื่องจากการถูกจองจำอย่างกะทันหันและไม่คาดฝัน ข้าพบว่าตัวเองไม่สามารถเข้าร่วมกิจกรรมของข้าต่อไปได้ และต้องถูกยกเลิก\n\nเวลาทั้งหมดที่ข้าใช้ไปกับการวางแผน..."
 activity_system.0550.a: "นี่ไม่ได้อยู่ในแผนของข้า..."

 activity_system.0551.t: "เจ้าภาพถูกจองจำ"
 activity_system.0551.desc: "เนื่องจากการถูกจองจำอย่างกะทันหันและไม่คาดฝันของเจ้าภาพของข้า [host.GetNameNoTooltip] กิจกรรมที่ข้ากำลังเข้าร่วมจึงถูกยกเลิก"
 activity_system.0551.a: "ถึงเวลามองหาทางกลับบ้านแล้ว"

 activity_system.0552.t: "คำท้าที่ไม่ได้รับการตอบสนอง"
 activity_system.0552.desc: "นี่มันหมายความว่ากระไร? ดูเหมือนจะไม่มีสำนักใดกล้ารับคำท้าของ [GetPlayer.Custom('GetMyMovementNoTooltip')]\n\nเมื่อไม่มีผู้ใดมาโต้แย้ง การโต้วาทีจึงถูกยกเลิกไป"
 activity_system.0552.a: "ไว้โอกาสหน้าก็แล้วกัน..."

 activity_system.0554.opening: "[host.Custom2('AppropriateGreeting', ROOT.Char)]"
 activity_system.0554.a: "ข้าจำต้องรับคำท้านี้"
 activity_system.0554.b: "ข้าจะหาข้ออ้างดี ๆ สักข้อ"
