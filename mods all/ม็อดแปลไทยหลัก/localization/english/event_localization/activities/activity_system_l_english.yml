l_english: 
 ACTIVITY_LOG_ENTRY_EFFECT:1 "#S ผลกระทบ#!\n$EFFECT$"
 activity_tournament_province_desc:2 "ท่านจัดการประลองยุทธ์ใน [ROOT.Province.GetName]\nมณฑลที่มีสิ่งปลูกสร้างที่เหมาะสมจะมอบส่วนลด [gold_i][gold|E]"
 activity_feast_guest_desc:0 "$BULLET_WITH_TAB$ผู้เข้าร่วมอาจได้รับ [opinion|E] จากตัวละครที่เข้าร่วม\n$BULLET_WITH_TAB$ผู้เข้าร่วมอาจสูญเสีย [stress_loss_i][stress|E]\n$BULLET_WITH_TAB$ผู้เข้าร่วมอาจได้รับ [trait|E] [GetTrait('lifestyle_reveler').GetName( GetNullCharacter )]"
 activity_tournament_guest_desc:1 "#weak หากท่านมีสิทธิ์ การเข้าร่วมการประลองยุทธ์จะมอบโอกาสในการชนะการแข่งขันและได้รับรางวัล รวมถึงการผ่อนคลายและเพลิดเพลินกับภาพและเสียงต่างๆ นอกจากนี้ยังเป็นโอกาสให้ท่านได้ฝึกฝนทักษะการต่อสู้ให้เฉียบคมยิ่งขึ้น#! "

 guest_friendship_title:0 "$activity_pulse_action_guest_friendship$"
 activity_pulse_action_guest_friendship:0 "[second.GetShortUINameNoTooltip|U] ชมเชย [first.GetShortUINameNoTooltip|U]"
 guest_insulted_title:0 "$activity_pulse_action_guest_insulted$"
 activity_pulse_action_guest_insulted:0 "[second.GetShortUINameNoTooltip|U] ดูหมิ่น [first.GetShortUINameNoTooltip|U]"

 # Tournament - Activity Invalidated
 activity_system.0040.t:1 "การประลองยุทธ์สิ้นสุดลง"
 activity_system.0040.desc:1 "อนิจจา! ด้วยสถานการณ์ใหม่ที่เกี่ยวข้องกับการประลองยุทธ์ การพูดคุยอย่างรวดเร็วกับผู้จัดงานยืนยันความกลัวของท่าน: การประลองยุทธ์ต้องถูกยกเลิก\n\nฝูงชนที่สิ้นหวังเดินผ่านไป เด็กๆ ที่สะอื้นและผิดหวังกำมือพ่อแม่ของตนไว้แน่น หวังว่าในอนาคตอันใกล้ อาจมีโอกาสอีกครั้งที่งานรื่นเริงเหล่านี้จะกลับมาจัดได้อีก"
 activity_system.0040.a:1 "น่าเสียดายอย่างแท้จริง"

 # New Host after Character Death
 activity_system.0080.t:1 "เจ้าภาพคนใหม่"
 activity_system.0080.desc:2 "ด้วยการเสียชีวิตของเจ้าภาพคนก่อน เสียงกระซิบกระซาบอย่างเร่งรีบในหมู่ผู้จัดงานที่เกี่ยวข้องก็ดังขึ้น ผู้เข้าร่วมทุกคนเดินเตร็ดเตร่อย่างมีความสุข โดยไม่รู้ถึงความตื่นตระหนกที่เกิดขึ้นเบื้องหลัง\n\nในที่สุด ข้อตกลงก็บรรลุผล"
 activity_system.0080.desc_other:0 "งานรื่นเริงจะดำเนินต่อไป แต่บัดนี้มี [host.GetTitledFirstName] เป็นผู้นำ!"
 activity_system.0080.desc_me:0 "งานรื่นเริงจะดำเนินต่อไป และข้าจะเป็นผู้นำ!"
 activity_system.0080.a:0 "กลับไปสนุกกันต่อเถอะ"

 #Pilgrimages: New Host after Character Death
 activity_system.0081.t:1 "จุดหมายปลายทางสุดท้าย"
 activity_system.0081.desc.relation_family_liked:0 "[ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('old_host'))] ที่รักของข้า [old_host.GetTitledFirstName] ได้จากโลกนี้ไปอย่างน่าเสียดาย และ,"
 activity_system.0081.desc.relation_liked:0 "[old_host.GetTitledFirstName] ที่รักของข้า ได้จากโลกนี้ไปอย่างน่าเสียดาย และ,"
 activity_system.0081.desc.relation_family:0 "[ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('old_host'))] ของข้า [old_host.GetTitledFirstName] ได้จากโลกนี้ไปอย่างน่าเสียดาย และ,"
 activity_system.0081.desc.relation_neutral:0 "น่าเสียดายที่ [old_pilgrimage_host.GetTitledFirstName] ได้จากโลกนี้ไป และ,"
 activity_system.0081.desc.outro:0 "ในฐานะทายาทของ [old_host.GetHerHis] ข้าจึงต้องรับผิดชอบ\n\nดังนั้น ไม่ว่าความรู้สึกส่วนตัวของข้าจะเป็น เช่นไร ข้าจำเป็นต้องตัดสินใจว่าเราควรจัดการกับร่างของ [old_host.GetHerHis] และพิธีศพสุดท้ายอย่างไร"
 activity_system.0081.a:0 "[ROOT.Char.GetTravelPlan.GetData.GetFinalDestination.GetProvince.GetNameNoTooltip] คือบ้านของ [old_host.GetHerHis]"
 activity_system.0081.a.tt:0 "[old_host.GetShortUIName] จะถูกนำไปพักผ่อนใน [THIS.Char.GetTravelPlan.GetData.GetFinalDestination.GetProvince.GetNameNoTooltip]"
 activity_system.0081.b:0 "[old_host.GetSheHe|U] สมควรได้พักผ่อนในความศักดิ์สิทธิ์ของ [ROOT.Char.GetTravelPlan.GetData.GetNextDestination.GetProvince.GetNameNoTooltip]"
 activity_system.0081.b.tt:0 "[old_host.GetShortUIName] จะถูกนำไปพักผ่อนใน [THIS.Char.GetTravelPlan.GetData.GetNextDestination.GetProvince.GetNameNoTooltip]"
 activity_system.0081.c:0 "เรานำ [old_host.GetHerHim] ไปยัง [ROOT.Char.GetTravelPlan.GetData.GetNextDestination.GetProvince.GetNameNoTooltip] แล้วจึงกลับบ้าน"
 activity_system.0081.c.tt:0 "[THIS.Char.GetInvolvedActivity.GetName] จะดำเนินต่อไป และ [old_host.GetShortUIName] จะถูกนำไปพักผ่อนใน [THIS.Char.GetTravelPlan.GetData.GetFinalDestination.GetProvince.GetNameNoTooltip]"

 # Intent Invalidated
 activity_system.0090.t:0 "เจตนาถูก ทำให้ใช้ไม่ได้"
 activity_system.0090.desc:1 "ด้วยการเปลี่ยนแปลงของสถานการณ์ปัจจุบัน เป็นที่ชัดเจนว่าเจตนาเดิมของข้าไม่สามารถดำเนินต่อไปได้ คนอื่นๆ เดินผ่านข้าไปอย่างมีความสุขขณะที่ข้าครุ่นคิดถึงสถานการณ์ของตน โดยไม่รู้ถึงความขุ่นเคืองเล็กน้อยของข้าเลย\n\nหัวใจของข้าปรารถนาสิ่งใดอีกเล่า? บางทีข้าควรจะผ่อนคลายสักหน่อยแทน?"
 activity_system.0090.a:1 "ถึงเวลาหันเหความสนใจไปที่อื่นแล้ว"

 # Intent Target Invalidated
 activity_system.0091.t:1 "เป้าหมายของเจตนาถูก ทำให้ใช้ไม่ได้"
 activity_system.0091.desc:1 "ด้วยการเปลี่ยนแปลงของสถานการณ์ปัจจุบัน เป็นที่ชัดเจนว่าเป้าหมายเจตนาเดิมของข้าไม่เกี่ยวข้องกับเป้าหมายของข้าอีกต่อไป คนอื่นๆ เดินผ่านข้าไปอย่างมีความสุขขณะที่ข้าครุ่นคิดถึงสถานการณ์ของตน โดยไม่รู้ถึงความขุ่นเคืองเล็กน้อยของข้าเลย\n\nข้าควรจะมุ่งความสนใจไปที่ใครอื่นอีก? บางทีข้าควรจะมุ่งความสนใจไปที่ตัวเองเท่านั้น?"
 activity_system.0091.a:1 "เอาล่ะ ถึงเวลาหาแรงบันดาลใจใหม่แล้ว..."

 # Activity Conclusion
 activity_system.0100.t:2 "การเฉลิมฉลองที่น่าสมเพช"
 activity_system.0100.desc:0 "เหลือเชื่ออย่างที่สุด! แม้ว่าข้าจะส่งคำเชิญและเตรียมการมากมาย แต่ไม่มีใครมาที่ [activity_type.GetNameNoTooltip()] ของข้าเลย บางทีถนนสู่ [location.GetName] อาจเต็มไปด้วยอันตรายมากกว่าที่ข้าคาดไว้\n\n"
 activity_system.0100.outro_away:0 "ข้าคิดว่าถึงเวลาที่จะเริ่มเดินทางกลับบ้านที่ [ROOT.Char.GetCapitalLocation.GetName] แล้ว"
 activity_system.0100.outro_home:0 "อย่างน้อยข้าก็ไม่ต้องลำบากเดินทางออกจากบ้าน"
 activity_system.0100.a:1 "แต่ทำไม... ทำไมไม่มีใครมาเลย?"

 activity_system.1010.t:0 "การเดินทางที่สั้นลง"
 activity_system.1010.desc:0 "บรรพบุรุษของข้า [host.GetNameRegnal] ได้ละสังขารขณะเดินทางประพาสอาณาจักร น่าเศร้าที่ [host.GetSheHe] [host.GetDeathReason]\n\n"
 activity_system.1010.desc.entourage:0 "คณะผู้ติดตามของ [host.GetFirstNamePossessiveNoTooltip] จะต้องเริ่มการเดินทางกลับบ้านอันโศกเศร้า พร้อมกับร่างของ [ROOT.Char.Custom2('RelationToMePossessive',SCOPE.sC('host'))] ของข้าอย่างแน่นอน"
 activity_system.1010.desc.ruler:0 "[host.GetTitleAsName] ผู้ล่วงลับไม่สมควรตายไกลบ้าน เช่นนี้"
 activity_system.1010.a:0 "ขอให้ไปสู่สุคติเถิด [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('host'))]"
 activity_system.1010.tt:0 "[activity|E] ของ [host.GetShortUINamePossessiveNoTooltip] ถูกยกเลิกแล้ว"

 activity_system.1011.desc:0 "เจ้าเหนือหัวของข้า [host.GetNameRegnal] ได้ละสังขารขณะเดินทางประพาสอาณาจักร น่าเศร้าที่ [host.GetSheHe] [host.GetDeathReason]\n\nการเดินทางประพาสที่เหลือถูกยกเลิก เนื่องจากคณะผู้ติดตามของ [host.GetFirstNamePossessiveNoTooltip] เริ่มการเดินทางกลับบ้านอันโศกเศร้า พร้อมนำร่างของ [host.GetHerHis] ไปยังที่พำนักสุดท้าย"

# Host has joined a war and has the opportunity to cancel the activity 
 activity_system.0300.t:0 "สงครามไม่รอ [ROOT.Char.GetWomanMan|U]"
 activity_system.0300.desc.intro.traveling:0 "เสียงแตรสงครามดังมาถึงข้าแม้กระทั่งที่นี่ใน [target_activity_location.GetName] ขณะที่ข้ากำลังเดินทางไปเข้าร่วม [target_activity_type.GetNameNoTooltip] ของข้าใน [target_activity_location.GetName] "
 activity_system.0300.desc.intro.activity:0 "เสียงแตรสงครามดังมาถึงข้าแม้กระทั่งที่นี่ใน [target_activity_location.GetName] ขณะที่ข้ากำลังจัด [target_activity_type.GetNameNoTooltip] อยู่ "
 activity_system.0300.desc.attacker:1 "ข้าได้เข้าร่วมการต่อสู้กับ [war_opponent.GetNameRegnal|U]"
 activity_system.0300.desc.defender:0 "ไอ้ [war_opponent.Custom2('InsultNoun', ROOT.Char)] [war_opponent.GetNameRegnal|U] นั่น มันประกาศสงครามกับข้า!\n\n"
 activity_system.0300.desc.outro:0 "มีการวางแผนมากมายในการเตรียมจัด [target_activity_type.GetNameNoTooltip] นี้ และข้าไม่เต็มใจที่จะส่งแขกกลับบ้าน อย่างไรก็ตาม ความสำคัญของความขัดแย้งนี้ไม่ควรมองข้าม\n\nบางทีอาจเป็นการดีที่สุดที่จะทุ่มเทความพยายามทั้งหมดในการเตรียมพร้อมสำหรับสงคราม..."
 activity_system.0300.a:0 "ข้าสามารถจัดการเรื่องต่างๆ จากที่นี่ได้"
 activity_system.0300.a.tt:0 "[target_activity_type.GetNameNoTooltip] จะดำเนินต่อไป"
 activity_system.0300.b:0 "สงครามนี้ต้องการความสนใจทั้งหมดของข้า"
 activity_system.0300.b.tt:0 "[target_activity_type.GetNameNoTooltip] จะถูกยกเลิก และผู้เข้าร่วมทั้งหมดจะเริ่มเดินทางกลับบ้าน"
 activity_system.0300.b.tt.cost:0 "อาจได้รับค่าใช้จ่ายบางส่วนคืน"

 activity_system.0301.t:0 "[target_activity_type.GetNameNoTooltip] ถูกยกเลิก"
 activity_system.0301.desc:0 "#EMP "สู่สงคราม! สู่สงคราม!"#! เสียงเรียกของเหล่า [knights|l] ของ [target_activity_host.GetTitledFirstNamePossessive] ดังขึ้นขณะที่พวกเขาวิ่งผ่านไป เสียงแตรดังสนั่นและธงทิวปลิวไสวตัดกับท้องฟ้า\n\nดูเหมือนว่า [war_opponent.Custom('InsultNoun')] ผู้นั้น [war_opponent.GetNameRegnal] จะไม่สนใจ [target_activity_type.GetNameNoTooltip] ของเราเลย! กิจกรรมจะต้องถูกยกเลิก เนื่องจาก [target_activity_host.GetTitleAsNameNoTooltip] ส่งคนไปเกณฑ์ไพร่พลและสวดภาวนาต่อ [target_activity_host.GetFaith.WarGodName] เพื่อชัยชนะ\n\n[target_activity_type.GetNameNoTooltip] เป็นความบันเทิงอันสูงส่งและมีค่า แต่เสียงเรียกร้องสู่สงครามนั้นดังกว่าสิ่งอื่นใด"
 activity_system.0301.a:0 "ช่างเป็นโศกนาฏกรรม..."

 activity_system.0310.desc.intro:0 "เสียงแตรเขาสัตว์อันกึกก้องได้ดังมาถึงข้า ณ [target_activity_location.GetName] นี้ ขณะที่ข้ากำลังเข้าร่วม [target_activity_type.GetNameNoTooltip] ของ [target_activity_host.GetNamePossessive|U]\n\n"
 activity_system.0310.desc.primary_defender: "[attacker.GetTitledFirstName|U] ผู้ชั่วช้าได้ประกาศสงครามกับข้า!"
 activity_system.0310.desc.random_defender: "ข้าถูกเรียกตัวให้ไปช่วยรบในสงครามระหว่าง [attacker.GetTitledFirstName|U] และ [defender.GetTitledFirstName|U]"
 activity_system.0310.a.tt:0 "ท่านยังคงเข้าร่วมใน [target_activity_type.GetNameNoTooltip] ต่อไป"
 activity_system.0310.b.tt:0 "ท่านออกจาก [target_activity_type.GetNameNoTooltip] และเริ่มเดินทางกลับบ้าน"
 
 activity_system.0320.t:0 "บทสรุปที่ไม่คาดคิด"
 activity_system.0320.desc:1 "เจ้าภาพของเรา [host.GetName] ได้สูญเสียที่ดินที่ถือครองของ [host.GetHerHis] ไป และ ดังนั้น [activity_type.GetNameNoTooltip()] จึงต้องจบลงอย่างกะทันหัน\n\nนี่มิใช่บทสรุปที่ข้าคาดหวังไว้เลย หลังจากการเชื้อเชิญและการเตรียมงานอันใหญ่โต ข้าคาดว่าสิ่งที่เหลืออยู่คือข้าและคณะผู้ติดตามคงต้องเดินทางกลับบ้านที่ [ROOT.Char.GetCapitalLocation.GetNameNoTooltip]..."
 activity_system.0320.a:0 "อะไรจะเกิดก็ต้องเกิด"

 # If you have gained the incapable trait 
 activity_system.0330.t:0 "ไร้ความสามารถ"
 activity_system.0330.desc.intro:0 "ข้าถูกตัดสินว่าไร้ความสามารถและถูกมองว่าไม่เหมาะสมอย่างยิ่งที่จะจัดการเรื่องของตัวเอง รวมถึง [activity_type.GetNameNoTooltip()] ของข้าด้วย!\n\n"
 activity_system.0330.desc.memory:0 "อนิจจา [incapable_memory.GetDescription]\n\n"
 activity_system.0330.desc.outro:0 "ไม่มีอะไรเหลือให้ทำนอกจากกลับบ้านที่ [home.GetName]"
 activity_system.0330.a:0 "ขอให้แขกของข้ากลับบ้านอย่างปลอดภัย"

 activity_system.0331.t:0 "ไร้ความสามารถ"
 activity_system.0331.desc:0 "เจ้าภาพของเรา [host.GetName] ถูกคนรอบข้าง [host.GetHerHim] มองว่าไร้ความสามารถ และถูกมองว่าไม่เหมาะสมอย่างยิ่งที่จะจัดการเรื่อง [host.GetHerHis] ของตนเอง รวมถึง [activity_type.GetNameNoTooltip()] [host.GetHerHis] ด้วย!\n\nอนิจจา เราทุกคนต้องกลับบ้านมือเปล่า "
 activity_system.0331.a:0 "น่าเสียดายจริงๆ"

 # Late to the activity
 activity_system.0400.t:0 "ล่าช้ากว่ากำหนด"
 activity_system.0400.desc_leader:0 "เมื่อ [travel_leader.Custom2('MyCharacterIntroduction', ROOT.Char)] เข้ามาหาข้าด้วยสีหน้าที่เต็มไปด้วยความละอายและความกังวลเขียนอยู่เต็มใบหน้า [travel_leader.GetHerHis] ข้ารู้ว่า [travel_leader.GetSheHe] นำข่าวร้ายมา\n\n"ข้าเสียใจที่ต้องรายงานว่าเราล่าช้ากว่ากำหนดประมาณ [GetTimeBetweenDates(ROOT.Char.GetInvolvedActivity.GetActiveStartDate.Self, ROOT.Char.GetTravelPlan.GetData.GetNextDestination.GetEstimatedArrivalDate)] ท่าน [ROOT.Char.GetTitleAsNameNoTooltip] และเราอาจไปไม่ถึงจุดหมายปลายทางทันเวลา""
 activity_system.0400.desc_no_leader:0 "ข้าประเมินท้องฟ้าและแผนที่ทั้งหมดที่ข้ามีอยู่ตลอดเวลา แต่เป็นที่ชัดเจนว่าการคำนวณไม่ถูกต้อง\n\nเราล่าช้ากว่ากำหนดประมาณ [GetTimeBetweenDates(ROOT.Char.GetInvolvedActivity.GetActiveStartDate.Self, ROOT.Char.GetTravelPlan.GetData.GetNextDestination.GetEstimatedArrivalDate)] และหากเรายังคงเคลื่อนที่ด้วยความเร็วปัจจุบันตามเส้นทางปัจจุบัน เราจะไปไม่ถึงจุดหมายทันเวลา"
 activity_system.0400.a:0 "เร่งมือกันเถอะ"
 activity_system.0400.a.tt:0 "ท่านหวังว่าจะเร่งความเร็วได้ระหว่างทาง"
 activity_system.0400.b:0 "มันไม่คุ้มค่าจริงๆ"
 activity_system.0401.t:0 "สายเกินไป"
 activity_system.0401.desc_leader:0 "[travel_leader.Custom2('MyCharacterIntroduction', ROOT.Char)|U] เข้ามาหาข้าพเจ้าด้วยสีหน้าเคร่งขรึมบนใบหน้าของ [travel_leader.GetHerHis]\n\n"ข้าพเจ้าเสียใจที่ต้องรายงานว่าพวกเราไปไม่ทันเวลา ท่าน [ROOT.Char.GetTitleAsNameNoTooltip] ของข้า กิจกรรมเริ่มขึ้นแล้วในวันนี้ และพวกเราก็มิได้อยู่ที่นั่น""
 activity_system.0401.desc_no_leader:0 "วันนี้คือวันนั้น กิจกรรมเริ่มวันนี้ แต่ แม้ว่าข้าจะพยายามอย่างเต็มที่แล้ว เราก็ไม่ได้อยู่ที่นั่น\n\nไม่มีอะไรเหลือให้ทำนอกจากหันหลังกลับและมุ่งหน้ากลับบ้าน"
 activity_system.0401.a:0 "น่าผิดหวัง"

