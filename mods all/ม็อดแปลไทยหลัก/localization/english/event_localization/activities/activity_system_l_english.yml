 activity_system.0321.desc.intro: "Our host, [host.GetName],"
 activity_system.0321.desc.no_christian: "has declared that [host.GetSheHe] no longer believes in [ROOT.Char.GetFaith.GetName]. Instead, [host.GetSheHe] has shockingly revealed [host.GetHerHis] passion for the [host.GetFaith.GetName] faith."
 activity_system.0321.desc.no_hof: "is no longer the head of the [ROOT.Char.GetFaith.GetName] Church.\n\nAs this shocking revelation reaches the guests, we are urged to make our way back home."
 activity_system.0321.a: "I cannot believe it."
 activity_system.0340.desc.host: "Due to unexpected [host.Custom('GetIsolationReason')], the [activity_type.GetNameNoTooltip()] in [location.GetName] is no longer safe. For the sake of the attendees, I have to cancel my [activity_type.GetNameNoTooltip()]."
 activity_system.0340.desc.guest: "Due to unexpected [host.Custom('GetIsolationReason')], the [activity_type.GetNameNoTooltip()] in [location.GetName] is no longer safe. For the sake of the attendees, [host.GetTitledFirstName] have cancelled [host.GetHerHis] [activity_type.GetNameNoTooltip()]."
 activity_system.0340.a: "Go somewhere safe!"
