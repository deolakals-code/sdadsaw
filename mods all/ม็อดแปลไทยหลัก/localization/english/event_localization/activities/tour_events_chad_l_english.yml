 tour_grounds_events.6300.desc:0 "ขณะที่ [stop_host_scope.GetTitledFirstName] กำลังนำข้าชมรอบ [event_location.GetName], พวกเราก็มาถึงลานฝึกทหาร เหล่าทหารประจำการทั้งปวงของ [stop_host_scope.GetHerHis] ได้มาชุมนุมกัน และบรรยากาศก็อบอวลไปด้วยความคาดหวัง [stop_host_scope.GetFirstNameNoTooltip] ฉีกยิ้มกว้างเห็นฟัน\n\n"[ROOT.Char.Custom('FormOfAddressForLiege')|U], พวกข้าได้ยินเรื่องราวมากมายเกี่ยวกับความเก่งกาจอันยิ่งใหญ่ของท่าน ข้าคงจะบกพร่องในหน้าที่นักหากพลาดโอกาสที่จะแสดงให้เหล่าทหารเหล่านี้ได้เห็นว่าการประลองยุทธ์ที่ #EMP แท้จริง#! นั้นเป็น เช่นไร! ท่านจะกรุณาประลองยุทธ์กับ [target_knight.GetFirstName] เพื่อประโยชน์สุขแห่งอาณาจักรหรือไม่?""
