l_english: 
 
 tour_grounds_events.6000.t:0 "การพบปะโดยบังเอิญ"
 tour_grounds_events.6000.desc:0 "การพักอยู่กับข้าหลวงและการเปลี่ยนบรรยากาศเป็นเรื่องที่ดี แต่ผังที่เปลี่ยนแปลงตลอดเวลากลับสร้างความสับสนมากขึ้นเรื่อยๆ เมื่อปล่อยให้อยู่ตามลำพัง ข้าพเจ้าแทบไม่รู้ว่าจะหาสิ่งจำเป็นทั่วไปได้ที่ไหน... เช่น ข้าพเจ้าจะหาของว่างยามดึกได้ที่ใด\n\nขณะเดินสะเปะสะปะไปทั่ว[stop_host_scope.Custom('FortifiedBuilding')]ของ[stop_host_scope.GetTitledFirstNamePossessive] ข้าพเจ้าบังเอิญเปิดประตูเข้าไปพบ "
 tour_grounds_events.6000.desc.three_consorts:0 "[stop_host_scope.GetFirstNameNoTooltip] และเหล่าชายาของ[stop_host_scope.GetHerHis] ได้แก่ [orgy_consort_1.GetFirstNameNoTooltip], [orgy_consort_2.GetFirstNameNoTooltip] และ [orgy_consort_3.GetFirstNameNoTooltip] กำลังยืนใกล้ชิดกันอย่างหมิ่นเหม่ ดูเหมือนกำลังจะเข้าสู่บางสิ่งที่ #EMP ลึกซึ้งใกล้ชิดกันยิ่งนัก#!\n\n"
 tour_grounds_events.6000.desc.one_consort:0 "[stop_host_scope.GetFirstNameNoTooltip] และ[stop_host_scope.Custom2('RelationToMeShort',orgy_consort_1)]ของ[stop_host_scope.GetHerHis] กำลังยืนใกล้ชิดกันอย่างหมิ่นเหม่ ดูเหมือนกำลังจะเข้าสู่บางสิ่งที่ #EMP ลึกซึ้งใกล้ชิดกันยิ่งนัก#! แสงเทียนส่องสว่างนวลตาในห้อง และกลิ่นหอมหวานของลาเวนเดอร์อบอวลไปทั่ว\n\n"
 tour_grounds_events.6000.desc.outro:0 "ข้าหลวงของข้าเผยรอยยิ้มเจ้าเล่ห์และกวักมือเรียกข้าให้เข้าไปใกล้"
 tour_grounds_events.6000.a:0 "สิ่งยั่วยวนนั้นช่างแรงกล้าเกินไป..."
 tour_grounds_events.6000.b:0 ""ข้าคิดว่าท่านจะไม่เอ่ยปากเสียแล้ว!""
 tour_grounds_events.6000.c:0 "ข้าจะไม่แปดเปื้อนตนเองในความโสมม เช่นนี้!"

 tour_grounds_events.6100.t:0 "[tour_grounds_event_location.Custom('GetSpecialBuildingNameFromProvince')]"
 tour_grounds_events.6100.desc.intro:0 ""และนี่ ฝ่าบาท คือ [tour_grounds_event_location.Custom('GetSpecialBuildingNameFromProvince')]!" [stop_host_scope.GetTitledFirstName] อุทานขึ้นขณะที่เรามองเห็น[stop_host_scope.Custom('GetFaithGrandTemple')]อันน่าประทับใจ\n\n"
 tour_grounds_events.6100.desc.cynical:0 "ข้าพเจ้ารู้สึกหวาดหวั่นกับการเดินทางที่วางแผนไว้นี้ตลอดเวลาที่อยู่ที่นี่ใน [tour_grounds_event_location.GetName] ข้าพเจ้าไม่ได้มีความสัมพันธ์ใกล้ชิดกับ[ROOT.Char.GetFaith.HighGodName] และข้าพเจ้าก็ไม่ได้ตั้งใจจะสร้างความสัมพันธ์นั้นขึ้นมาในตอนนี้ อย่างไรก็ตาม มันดู #EMP น่าประทับใจ#! จริงๆ\n\nบางทีข้าพเจ้าอาจเรียนรู้อะไรบางอย่างจากสิ่งนี้ได้ แต่ต้องคิดหาอะไรพูด..."
 tour_grounds_events.6100.desc.zealous:0 "ข้าพเจ้ายืนตะลึงในความมหัศจรรย์แห่งผลงานของ[ROOT.Char.faith.HighGodNamePossessive]ในโลกนี้ อาคารหลังนี้คือความเป็นทิพย์ที่ปรากฏเป็นรูปธรรม"
 tour_grounds_events.6100.desc:0 "ข้าพเจ้ายืนตะลึงในสิ่งก่อสร้างอันน่าอัศจรรย์ เช่นนี้ รายละเอียดที่ประดิษฐ์ประดอยในทุกมุมตัดกันอย่างงดงามกับความสงบที่รู้สึกได้ในใจ นี่คือสถานที่พิเศษอย่างแท้จริงสำหรับการสักการะ[ROOT.Char.GetFaith.HighGodName]"
 tour_grounds_events.6100.a:0 "ข้าพเจ้าควรจุดเทียนเพื่อ[ROOT.Char.Custom2('RelationToMe', tour_grounds_6100_beloved_char)]อันเป็นที่รักของข้า [tour_grounds_6100_beloved_char.GetFirstNameNoTooltip]"
 tour_grounds_events.6100.a.tt:0 "ท่านให้เกียรติความทรงจำของ[ROOT.Char.Custom2('RelationToMe', tour_grounds_6100_beloved_char)]ของท่านอย่างเปี่ยมศรัทธาด้วยการจุดเทียน"
 tour_grounds_events.6100.b:0 "ข้าพเจ้าควรสวดภาวนาเพื่อ[ROOT.Char.Custom2('RelationToMe', tour_grounds_6100_beloved_char)]อันเป็นที่รักของข้า [tour_grounds_6100_beloved_char.GetFirstNameNoTooltip]"
 tour_grounds_events.6100.b.tt:0 "ท่านให้เกียรติความทรงจำของ[ROOT.Char.Custom2('RelationToMe', tour_grounds_6100_beloved_char)]ของท่านในการสวดภาวนา"
 tour_grounds_events.6100.c:0 ""สิ่งมหัศจรรย์นี้สร้างขึ้นได้อย่างไร?""
 tour_grounds_events.6100.d:0 "ข้าพเจ้าต้องพยายามแสร้งทำเป็นสนใจให้นานที่สุด"
 tour_grounds_events.6100.d.success:0 "[stop_host_scope.GetFirstNameNoTooltip] ไม่ทันสังเกตเห็นความเห็นถากถางของท่าน"
 tour_grounds_events.6100.d.failure:0 "[stop_host_scope.GetFirstNameNoTooltip] ไม่พอใจในความเห็นถากถางของท่าน"

 tour_grounds_events.6200.t:0 "การเก็บเกี่ยวอันอุดมสมบูรณ์"
 tour_grounds_events.6200.desc:0 "ข้าหลวงของข้า [stop_host_scope.GetTitledFirstName] ได้พาข้าออกไปดู [stop_host_scope.GetHerHis] ที่ดูแลอย่างดี "
 tour_grounds_events.6200.desc.pastures:0 "ทุ่งหญ้าเลี้ยงสัตว์ ปศุสัตว์มากมายเดินเตร่อยู่ในดินแดนเหล่านี้ "สัตว์เหล่านี้ผลิตผลผลิตมากกว่าที่เราจะรู้ว่าต้องทำอย่างไรกับมัน! "
 tour_grounds_events.6200.desc.orchard:0 "สวนผลไม้ "ต้นไม้ของเราออกผลดกและผลไม้รสเลิศตามฤดูกาล"
 tour_grounds_events.6200.desc.cereal_fields:0 "พืชผล "ผู้คนของเราหมดความกังวลเรื่องความอดอยากหรือการขาดแคลนอาหารไปนานแล้ว"
 tour_grounds_events.6200.desc.hill_farms:0 "ฟาร์มบนเนินเขา "เราพยายามอย่างเต็มที่เพื่อเพิ่มพื้นที่จำกัดสำหรับการทำฟาร์มบนเนินเขาเหล่านี้ — ซึ่งได้ผลดีมาก ข้าขอบอก"
 tour_grounds_events.6200.desc.plantations:0 "สวนปาล์ม "อินทผลัมที่เราผลิตที่นี่คือความภาคภูมิใจและความสุขของเรา พวกมันยังเป็นที่ต้องการ #EMP อย่างสูง#! ของพ่อค้าอีกด้วย"
 tour_grounds_events.6200.outro:0 "เราได้รับพรอย่างแท้จริงที่นี่ใน [tour_grounds_event_location.GetName]" [stop_host_scope.GetSheHe] กล่าวพร้อมรอยยิ้มพึงพอใจ\n\nดูเหมือนว่าข้าหลวงที่รักของข้าจะเก็บงำความลับแห่งความสำเร็จของเขาไว้จากข้า"
 tour_grounds_events.6200.a:0 "[stop_host_scope.GetSheHe|U] ควรมีส่วนร่วมกับอาณาจักรมากกว่านี้!"
 tour_grounds_events.6200.a.tt:0 "ท่านพยายามเพิ่มการมีส่วนร่วมของ[stop_host_scope.GetTitledFirstNamePossessiveNoTooltip]ต่ออาณาจักร"
 tour_grounds_events.6200.b:0 ""ข้าต้องนำความรู้นี้กลับไปยัง [root_capital_scope.GetNameNoTooltip]""
 tour_grounds_events.6200.c:0 ""ข้าพเจ้ารู้สึกอบอุ่นใจที่ได้เห็นผู้คนของข้าเจริญรุ่งเรือง""

 tour_grounds_events.6201.t:0 "$tour_grounds_events.6200.t$"
 tour_grounds_events.6201.desc:1 "ขณะที่ข้าพเจ้ากำลังพา [visiting_liege.GetTitledFirstName] ชมรอบๆ [tour_grounds_event_location.GetName] และความอุดมสมบูรณ์อันน่าอัศจรรย์ที่เราผลิตขึ้นอย่างภาคภูมิใจที่นี่ [visiting_liege.GetSheHe] ก็เริ่มทำตัวห่างเหิน หลังจากเงียบไปหลายนาที [visiting_liege.GetSheHe] ก็เอ่ยปากในที่สุด:\n\n"ข้าเห็นว่าท่านกำลังเจริญรุ่งเรืองที่นี่และดูแล [tour_grounds_event_location.GetNameNoTooltip] เป็นอย่างดี ข้าเชื่อว่าถึงเวลาแล้วที่เราจะทบทวนข้อตกลงของเรา ด้วยเกียรติของท่าน ส่วนหนึ่งของผลกำไรจากกิจการของท่านนั้นสมควรเป็นของราชบัลลังก์โดยชอบธรรม""
 tour_grounds_events.6201.a:0 "การเพิ่มภาษีดูเหมือนจะพอรับได้..."
 tour_grounds_events.6201.a.tt:0 "ข้าหลวงยอมรับการเพิ่มภาษี"
 tour_grounds_events.6201.b:0 "การแบ่งปันผลกำไรเพียงครั้งเดียวก็น่าจะเพียงพอ"
 tour_grounds_events.6201.b.tt:0 "ข้าหลวงแบ่งปันผลกำไร"
 tour_grounds_events.6201.c:0 "ผลกำไรจากแรงงานของข้าเป็นของข้า แต่เพียงผู้เดียว!"
 tour_grounds_events.6201.c.tt:0 "ข้าหลวงปฏิเสธที่จะแบ่งปันผลกำไร"

 tour_grounds_events.6202.t:0 "มือเหนียว (หัวขโมย)"
 tour_grounds_events.6202.desc:0 "[stop_host_scope.GetTitledFirstName] และข้าพเจ้ากำลังเดินเล่นสบายๆ ผ่านท่าเรือการค้าของ [event_location.GetName] ข้าหลวงของข้าชี้ให้เห็นพ่อค้าต่างๆ มากมายที่[stop_host_scope.GetSheHe]ได้นำมายังท่าเรือและสินค้าชั้นดีที่ขายอยู่ที่นี่ ขณะที่เรากำลังสนทนาอย่างมีสาระเกี่ยวกับการพาณิชย์ทางทะเล เด็กคนหนึ่งก็เดินเฉียดข้าพเจ้าไปและวิ่งเข้าไปในฝูงชนของนักช้อปและกะลาสี\n\nตอนแรก ข้าพเจ้าคิดว่ามันเป็นเพียงเด็กที่ยังไม่ได้รับการอบรมมารยาท แต่ไม่นานข้าพเจ้าก็ตระหนักว่าถุงทองของข้า... #EMP หายไปแล้ว!#!"
 tour_grounds_events.6202.a:0 ""[stop_host_scope.GetFirstNameNoTooltip]! #EMP ทำอะไรสักอย่างสิ!#!""
 tour_grounds_events.6202.a.tt:0 "ท่านมอบหมายให้ข้าหลวงของท่านจับหัวขโมย"
 tour_grounds_events.6202.a.success:0 "[stop_host_scope.GetFirstNameNoTooltip] ทำสำเร็จ"
 tour_grounds_events.6202.a.failure:0 "[stop_host_scope.GetFirstNameNoTooltip] ล้มเหลว"
 tour_grounds_events.6202.b:0 "ไม่มีใครขโมยของจากข้าได้!"
 tour_grounds_events.6202.b.success:0 "จับหัวขโมยเด็กได้"
 tour_grounds_events.6202.b.failure:0 "หัวขโมยเด็กหายไปในฝูงชน"
 tour_grounds_events.6202.c:0 "เด็กคนนั้นคงต้องการมันมากกว่าข้า..."

 tour_grounds_events.6203.t:1 "$tour_grounds_events.6202.t$"
 tour_grounds_events.6203.desc:0 "[visiting_liege.GetTitledFirstName] และข้าพเจ้ากำลังเดินเล่นสบายๆ ผ่านท่าเรือการค้าของ [event_location.GetName] ข้าพเจ้าชี้ให้เห็นพ่อค้าต่างๆ มากมายที่ข้าพเจ้าได้นำมายังท่าเรือและสินค้าชั้นดีที่ขายอยู่ที่นี่ ขณะที่เรากำลังสนทนาอย่างมีสาระเกี่ยวกับการพาณิชย์ทางทะเล เด็กคนหนึ่งก็เดินเฉียดฝ่าบาทของข้าไปและวิ่งเข้าไปในฝูงชนของนักช้อปและกะลาสี\n\nตอนแรก [visiting_liege.GetTitledFirstNameNoTooltip] ปัดมันทิ้งไปเหมือนไม่มีอะไร แต่ไม่นาน[visiting_liege.GetSheHe]ก็ตระหนักว่าเด็กคนนั้นได้ขโมยทองคำของ[visiting_liege.GetHerHis]ไป!\n\n"ทำอะไรสักอย่างกับเรื่องนี้ #EMP เดี๋ยวนี้#!, [ROOT.Char.GetFirstNameNoTooltip]!" [visiting_liege.GetSheHe] ตะโกนอย่างเดือดดาล..."
 tour_grounds_events.6203.a:0 "การชดใช้สิ่งที่ถูกขโมยไปนั้นง่ายที่สุด"
 tour_grounds_events.6203.toast:0 "[stop_host_scope.GetShortUINameNoTooltip] ชดใช้ทองคำที่ถูกขโมยไป"
 tour_grounds_events.6203.b:0 ""ตามหัวขโมยตัวน้อยนั่นไป!""
 tour_grounds_events.6203.c:0 "นี่ไม่ใช่ปัญหาของข้า"

 tour_grounds_events.6204.t:1 "$tour_grounds_events.6202.t$: จับได้"
 tour_grounds_events.6204.desc.caught_by_liege:0 "ข้าพเจ้าวิ่งไล่ตามหัวขโมยตัวน้อยอย่างรวดเร็ว ชนรถเข็นล้มและผลักทุกคนที่ขวางทาง ข้าพเจ้ามุ่งมั่นที่จะเอาทองคำที่ถูกขโมยไปคืนมา ไม่ว่าจะเกิดอะไรขึ้นก็ตาม\n\nข้าพเจ้าจับตาดู[tiny_thief.Custom('GirlBoy')]ไว้ไม่ให้คลาดสายตา และไล่ตาม[tiny_thief.GetHerHim]ทันอย่างรวดเร็ว แม้ว่า[tiny_thief.GetSheHe]จะสามารถมุดลอดใต้โต๊ะพ่อค้ามากมายและหลบหลีกฝูงชนได้อย่างรวดเร็ว\n\nอย่างไรก็ตาม ในไม่ช้า ข้าพเจ้าก็สามารถต้อนหัวขโมยตัวน้อยจนมุมที่ขอบท่าเรือได้ การไล่ล่าสิ้นสุดลงแล้ว"
 tour_grounds_events.6204.desc.caught_by_vassal:0 "หลังจากตะโกนใส่ [stop_host_scope.GetFirstName] ให้ทำอะไรสักอย่างกับเจ้าเด็กเหลือขอที่ขโมยทองคำของข้าไป [stop_host_scope.GetSheHe] ก็วิ่งไล่ตาม[tiny_thief.GetHerHim]ไป\n\nข้าพเจ้าเห็น [stop_host_scope.GetFirstNameNoTooltip] กลับมาอย่างผู้มีชัยพร้อมกับหัวขโมยตัวน้อยที่ห้อยต่อง แต่งอยู่ในกำมืออันแข็งแกร่งของ[stop_host_scope.GetHerHis]\n\n"ขออภัยพ่ะย่ะค่ะ/เพคะ ฝ่าบาท ข้าพเจ้ารู้สึกอับอายที่เรื่อง เช่นนี้เกิดขึ้นกับฝ่าบาทภายใต้การคุ้มครองของข้าพเจ้า ข้าพเจ้าพบ[tiny_thief.Custom('GirlBoy')]แล้วพร้อมกับทองคำของฝ่าบาท ข้าพเจ้านำทั้งสองมาให้ฝ่าบาทเพื่อทรงจัดการตามพระประสงค์""
 tour_grounds_events.6204.a:0 ""ข้าจะเอาทองคำของข้าคืนและไปตามทางของข้า""
 tour_grounds_events.6204.b:0 ""ข้ามีแผนการอันยิ่งใหญ่สำหรับ #EMP ทักษะ...#! ของเจ้า""

 tour_grounds_events.6205.t:1 "$tour_grounds_events.6202.t$: หนีไปได้"
 tour_grounds_events.6205.desc:0 "หลังจากตะโกนใส่ [stop_host_scope.GetFirstName] ให้ทำอะไรสักอย่างกับเจ้าเด็กเหลือขอที่ขโมยทองคำของข้าไป [stop_host_scope.GetSheHe] ก็วิ่งไล่ตาม[tiny_thief.GetHerHim]ไป\n\nข้าพเจ้าเห็น [stop_host_scope.GetFirstNameNoTooltip] ค่อยๆ เดินกลับมาอย่างหงุดหงิด แต่ไม่เห็นหัวขโมยตัวน้อย ด้วยความกลัวในดวงตาของ[stop_host_scope.GetHerHis]และมือที่สั่นเทา ข้าหลวงของข้าพูดตะกุกตะกักว่า:\n\n"ข้าพเจ้าเสียใจอย่างสุดซึ้งพ่ะย่ะค่ะ/เพคะ ฝ่าบาท แต่เด็กคนนั้นหนีไปได้แล้ว ทั้งทหารยามของข้าและตัวข้าเองก็หา[tiny_thief.GetHerHim]ไม่พบ ข้าพเจ้าเกรงว่าทองคำของฝ่าบาทจะหายไปแล้ว""
