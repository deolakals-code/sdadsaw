 ### PHASES
 pilgrimage_phase_solo:0 "การจาริกแสวงบุญ"
 pilgrimage_phase_solo_desc:0 "การจาริกแสวงบุญคือการเดินทางทางจิตวิญญาณสู่ความเชื่อส่วนบุคคล ความสำเร็จของการจาริกแสวงบุญขึ้นอยู่กับการตัดสินใจระหว่างการเดินทางพอๆ กับการตัดสินใจ ณ จุดหมายปลายทาง"
 activity_pilgrimage_guest_desc:0 "$BULLET_WITH_TAB$ผู้เข้าร่วมอาจได้รับ [piety|E]\n$BULLET_WITH_TAB$ผู้เข้าร่วมอาจได้รับ [legitimacy_i] [legitimacy|E]\n$BULLET_WITH_TAB$ผู้เข้าร่วมอาจสูญเสีย [stress_loss_i][stress|E]\n$BULLET_WITH_TAB$ผู้เข้าร่วมอาจได้รับ [trait|E] [GetTrait('pilgrim').GetName( GetNullCharacter )]"

 ### OPTIONS
 #Type of Pilgrimage [Special Type] Option
 pilgrimage_type_pious:0 "การจาริกแสวงบุญอันเปี่ยมศรัทธา"
 pilgrimage_type_pious_desc:1 "$EFFECT_LIST_BULLET$ ตัวเลือกเหตุการณ์บางอย่างจะอนุญาตให้มีการกระทำที่เคร่งศาสนาเป็นพิเศษ\n$EFFECT_LIST_BULLET$ การเลือกตัวเลือกเหล่านี้จะได้รับ [piety|E] เพิ่มเติมเมื่อเสร็จสิ้น\n\n#weak จุดประสงค์ของการจาริกแสวงบุญคือการแสดงความเคารพต่อสิ่งศักดิ์สิทธิ์ เพื่อเชื่อมโยงกับแก่นแท้แห่งจิตวิญญาณของท่านอย่างแท้จริง#!"
 pilgrimage_type_worldly:0 "การจาริกแสวงบุญทางโลก"
 pilgrimage_type_worldly_desc:1 "$EFFECT_LIST_BULLET$ ตัวเลือกเหตุการณ์บางอย่างจะอนุญาตให้มีการเที่ยวชมสถานที่\n$EFFECT_LIST_BULLET$ การเลือกตัวเลือกเหล่านี้จะได้รับตัวปรับ แต่งความหลากหลายทางวัฒนธรรมแบบแบ่งระดับเมื่อเสร็จสิ้น\n\n#weak การได้สูดกลิ่นอายอันหอมหวานแปลกประหลาดของอากาศต่างแดน การถอดรหัสความแปลกประหลาดของภาษาต่างถิ่น — จะมีอะไรดีไปกว่านี้อีกเล่า?#!"
 pilgrimage_type_hajj:0 "ฮัจญ์"
 pilgrimage_type_hajj_desc:0 "$EFFECT_LIST_BULLET$ ชาวมุสลิมที่มีความสามารถทุกคนต้องประกอบพิธีฮัจญ์อย่างน้อยหนึ่งครั้ง\n$EFFECT_LIST_BULLET$ ประเภทอื่นๆ จะมีให้เลือกหลังจากได้รับ [trait|E] [GetTrait('hajjaj').GetName(GetNullCharacter)]\n\n#weak พึงระลึกไว้ — ฮัจญ์ไม่ใช่ภาระผูกพัน แต่เป็นโอกาส สำหรับการยอมจำนน สำหรับความอ่อนน้อมถ่อมตน สำหรับการให้อภัย อินชาอัลลอฮ์!#!"
 #Fidelity Option
 pilgrimage_option_fidelity:0 "ความมุ่งมั่น"
 pilgrimage_fidelity_obligatory:0 "ตามหน้าที่"
 pilgrimage_fidelity_obligatory_desc:1 "$EFFECT_LIST_BULLET$ ความเร็ว [travel|E] เพิ่มขึ้น #positive_value 50%#!\n$EFFECT_LIST_BULLET$ ท่านจะได้รับ [piety|E] #EMP น้อยลง#! เมื่อเสร็จสิ้น\n\n#weak ใช่ ใช่ การเติมเต็มทางจิตวิญญาณ ภาระผูกพันทางศีลธรรม ชะตากรรมแห่งแก่นแท้อมตะของข้า ฯลฯ เราไปต่อกันได้หรือยัง?#!"
 pilgrimage_fidelity_pilgrim:0 "ผู้แสวงบุญ"
 pilgrimage_fidelity_pilgrim_desc:0 "$EFFECT_LIST_BULLET$ ความเร็ว [travel|E] ไม่ได้รับผลกระทบ\n$EFFECT_LIST_BULLET$ รางวัล [piety|E] เมื่อเสร็จสิ้นไม่ได้รับผลกระทบ\n\n#weak ด้วยใจยินดีและเจตนาดี เราออกเดินทางเพื่อชมสถานที่ศักดิ์สิทธิ์ของโลกนี้#!"
 pilgrimage_fidelity_contemplative:0 "การใคร่ครวญ"
 pilgrimage_fidelity_contemplative_desc:1 "$EFFECT_LIST_BULLET$ ความเร็ว [travel|E] ลดลง #negative_value 50%#!\n$EFFECT_LIST_BULLET$ ท่านจะได้รับ [piety|E] มากขึ้นเมื่อเสร็จสิ้น\n\n#weak หากจุดประสงค์ของการจาริกแสวงบุญคือการครุ่นคิด แล้วจะรีบร้อนไปเพื่ออะไร? การเดินทางก็มีความสำคัญครึ่งหนึ่งอยู่แล้ว#!"
#Pomp Option
 pilgrimage_option_pomp:0 "ความโอ่อ่า"
 pilgrimage_pomp_humble:0 "สมถะ"
 pilgrimage_pomp_humble_desc:1 "$EFFECT_LIST_BULLET$ ไม่นำใครจาก [court|E] ของท่านไปด้วย ทำให้ [travel|E] อันตราย\n$EFFECT_LIST_BULLET$ ท่านเข้าร่วมขบวนผู้แสวงบุญแบบสุ่ม [EmptyScope.ScriptValue('pilgrimage_entourage_pomp_humble_max_value')] คน\n$EFFECT_LIST_BULLET$ ได้รับ [piety|E] มากขึ้นเมื่อเสร็จสิ้น\n\n#weak การจาริกแสวงบุญเป็นช่วงเวลาสำหรับการใคร่ครวญอย่างเงียบสงบ ขบวนผู้แสวงบุญธรรมดากับคนแปลกหน้าเป็นสถานที่ที่ดีที่สุดสำหรับสิ่งนั้น#!"
 pilgrimage_pomp_appropriate:0 "เหมาะสม"
 pilgrimage_pomp_appropriate_desc:0 "$EFFECT_LIST_BULLET$ ท่านนำองครักษ์หรืออัศวินฝีมือดีไปด้วย และอาจมีสหายร่วมทาง\n$EFFECT_LIST_BULLET$ ผู้แสวงบุญแบบสุ่มสูงสุด [EmptyScope.ScriptValue('pilgrimage_entourage_pomp_appropriate_max_value')] คนเข้าร่วมขบวนของท่าน\n$EFFECT_LIST_BULLET$ รางวัล [piety|E] เมื่อเสร็จสิ้นไม่ได้รับผลกระทบ\n\n#weak ถนนหนทางอันตรายและการเดินทางยาวนาน ความบริสุทธิ์ทางจิตวิญญาณเป็นเรื่องหนึ่ง การกระทำที่บ้าบิ่นเป็นอีกเรื่องหนึ่ง#!"
 pilgrimage_pomp_ceremonial:0 "ตามพิธีการ"
 pilgrimage_pomp_ceremonial_desc:0 "$EFFECT_LIST_BULLET$ ท่าน #EMP ยัง#! นำผู้ติดตามและผู้เลื่อมใสไปด้วย\n$EFFECT_LIST_BULLET$ ผู้แสวงบุญแบบสุ่มสูงสุด [EmptyScope.ScriptValue('pilgrimage_entourage_pomp_ceremonial_max_value')] คนเข้าร่วมขบวนของท่าน\n$EFFECT_LIST_BULLET$ ได้รับ [piety|E] มากขึ้นเมื่อเสร็จสิ้น\n\n#weak ศรัทธาเรียกร้องความเป็นทางการ แม้จะอยู่ไกลบ้าน และเราจะเป็นทางการได้อย่างไรหากไม่มีผู้ติดตาม?#!"
 pilgrimage_pomp_throng:0 "ขบวนใหญ่"
 pilgrimage_pomp_throng_desc:0 "$EFFECT_LIST_BULLET$ [character|E] ทุกคนที่สนใจใน [court|E] เข้าร่วมกับท่าน\n$EFFECT_LIST_BULLET$ ผู้แสวงบุญแบบสุ่มสูงสุด [EmptyScope.ScriptValue('pilgrimage_entourage_pomp_throng_max_value')] คนเข้าร่วมขบวนของท่าน\n$EFFECT_LIST_BULLET$ ได้รับ [piety|E] มากขึ้นอย่างมากเมื่อเสร็จสิ้น\n\n#weak ผู้ศรัทธาทุกคนควรได้เห็นสถานที่ศักดิ์สิทธิ์ของเรา... และข้าตั้งใจจะช่วยพวกเขา#!"
 

