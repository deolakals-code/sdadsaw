 activity_pilgrimage_selection_tooltip:1 "จาริก [pilgrimage|E] เพื่อพิสูจน์ความทุ่มเทของท่านต่อ [GetPlayer.GetFaith.PantheonTerm]\n\nรางวัลที่คาดหวัง:\n$BULLET_WITH_TAB$[piety_i] ได้รับ [piety|E]\n$BULLET_WITH_TAB$[legitimacy_i] ได้รับ [legitimacy|E]\n$BULLET_WITH_TAB$[stress_loss_i] [stress_loss|E]"
 activity_pilgrimage_destination_selection:0 "ยิ่งจุดหมายปลายทางอยู่ห่างจากเมืองหลวงของท่านมากเท่าใด ท่านยิ่งพิสูจน์ความทุ่มเทต่อ [GetPlayer.GetFaith.PantheonTerm] และได้รับ [piety|E] เพิ่มเติมมากขึ้นเท่านั้น"
 activity_pilgrimage_owner:0 "ผู้แสวงบุญ"
 activity_pilgrimage_name:0 "การจาริกแสวงบุญ"

 #Province Description
 activity_pilgrimage_province_unvisited_desc:0 "\n#positive_value + สถานที่ศักดิ์สิทธิ์ที่ไม่เคยเยี่ยมชม#!"
 activity_pilgrimage_province_unique_desc:0 "\n#positive_value + สถานที่ศักดิ์สิทธิ์ [GetPlayer.GetFaith.GetReligion.GetAdjectiveNoTooltip] ที่เป็นเอกลักษณ์#!"
 activity_pilgrimage_province_desc_inspection_modifier: "\n#positive_value ++ สถานที่ศักดิ์สิทธิ์ที่ได้รับการคุ้มครอง #!"
 #Pros/Cons + Cost at the end
 activity_pilgrimage_province_desc:1 "ท่านเริ่มการจาริกแสวงบุญไปยัง [ROOT.Province.GetName]\nระยะทางส่งผลต่อค่าใช้จ่ายและรางวัล"
 activity_pilgrimage_province_very_short_desc:0 "\n#positive_value + ระยะทางใกล้มาก#!\n\nค่าใช้จ่ายเพิ่มเติม: ไม่มี"
 activity_pilgrimage_province_pretty_short_desc:0 "\n#positive_value + ระยะทางใกล้#!\n#negative_value - ค่าใช้จ่ายเพิ่มขึ้นเล็กน้อย#!\n\nค่าใช้จ่ายเพิ่มเติม: [gold_i][SCOPE.ScriptValue('pilgrimage_length_cost_tier_1')|0]"
 activity_pilgrimage_province_short_desc:0 "\n#positive_value ++ ระยะทางค่อนข้างใกล้#!\n#negative_value -- ค่าใช้จ่ายเพิ่มขึ้นเล็กน้อย#!\n\nค่าใช้จ่ายเพิ่มเติม: [gold_i][SCOPE.ScriptValue('pilgrimage_length_cost_tier_2')|0]"
 activity_pilgrimage_province_intermediate_desc:0 "\n#positive_value ++ ระยะทางปานกลาง#!\n#negative_value -- ค่าใช้จ่ายปานกลาง#!\n\nค่าใช้จ่ายเพิ่มเติม: [gold_i][SCOPE.ScriptValue('pilgrimage_length_cost_tier_3')|0]"
 activity_pilgrimage_province_respectably_desc:0 "\n#positive_value ++ ระยะทางน่านับถือ#!\n#negative_value -- ค่าใช้จ่ายสูง#!\n\nค่าใช้จ่ายเพิ่มเติม: [gold_i][SCOPE.ScriptValue('pilgrimage_length_cost_tier_4')|0]"
 activity_pilgrimage_province_quite_far_desc:0 "\n#positive_value +++ ค่อนข้างไกล#!\n#negative_value --- ค่อนข้างแพง#!\n\nค่าใช้จ่ายเพิ่มเติม: [gold_i][SCOPE.ScriptValue('pilgrimage_length_cost_tier_5')|0]"
 activity_pilgrimage_province_very_far_desc:0 "\n#positive_value +++ ไกลมาก#!\n#negative_value --- แพง#!\n\nค่าใช้จ่ายเพิ่มเติม: [gold_i][SCOPE.ScriptValue('pilgrimage_length_cost_tier_6')|0]"
 activity_pilgrimage_province_extraordinarily_far_desc:0 "\n#positive_value +++ ไกลเป็นพิเศษ#!\n#negative_value --- แพงมาก#!\n\nค่าใช้จ่ายเพิ่มเติม: [gold_i][SCOPE.ScriptValue('pilgrimage_length_cost_tier_7')|0]"
 activity_pilgrimage_imaginary_friend_location_desc: "\n#positive_value +++ ให้เกียรติเพื่อนในจินตนาการของท่าน#!"
 #Effects
 activity_pilgrimage_province_medium_mult_desc:0 "\n\n#bold ผลกระทบจากการจัด [GetActivityType('activity_pilgrimage').GetName] ที่นี่#!\n$BULLET_WITH_TAB$[piety_i|E][piety|E] รางวัลกิจกรรม: #p +[EmptyScope.ScriptValue('medium_pilgrimage_piety_multiplier')|0]%#!"
 activity_pilgrimage_province_long_mult_desc:0 "\n\n#bold ผลกระทบจากการจัด [GetActivityType('activity_pilgrimage').GetName] ที่นี่#!\n$BULLET_WITH_TAB$[piety_i|E][piety|E] รางวัลกิจกรรม: #p +[EmptyScope.ScriptValue('long_pilgrimage_piety_multiplier')|0]%#!"
 activity_pilgrimage_province_very_long_mult_desc:0 "\n\n#bold ผลกระทบจากการจัด [GetActivityType('activity_pilgrimage').GetName] ที่นี่#!\n$BULLET_WITH_TAB$[piety_i|E][piety|E] รางวัลกิจกรรม: #p +[EmptyScope.ScriptValue('very_long_pilgrimage_piety_multiplier')|0]%#!"
 

