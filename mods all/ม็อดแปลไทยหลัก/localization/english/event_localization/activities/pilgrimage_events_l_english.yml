 ### SYSTEM EVENTS
 #Invalidation Event
 pilgrimage.0040.t:1 "$pilgrimage_header$ จุดสิ้นสุดของการเดินทาง"
 pilgrimage.0040.desc:0 "และแล้วการเดินทางทางจิตวิญญาณของข้าก็มาถึงจุดสิ้นสุดอย่างกะทันหัน อย่างไรก็ตาม เช่นเดียวกับใบไม้ที่ร่วงหล่นลงสู่แม่น้ำที่เชี่ยวกราก เราทำได้เพียงรอดูว่าสถานการณ์ใหม่จะนำพาเราไปที่ใด"
 pilgrimage.0040.desc_moved_capital:0 "บัดนี้เมืองหลวงของข้าคือสถานที่อันรุ่งโรจน์แห่ง [ROOT.Char.GetCapitalLocation.GetTitle.GetNameNoTierNoTooltip] แล้ว การเดินทาง [GetActivityType('activity_pilgrimage').GetNameNoTooltip] ต่อไปของข้าจึงไม่มีประโยชน์มากนัก\n\nข้าควรจะมุ่งเน้นไปที่การสรุปการเดินทางที่นั่นและลองเสี่ยงโชคกับสถานที่ศักดิ์สิทธิ์อื่น"
 pilgrimage.0040.a:0 "ข้าคือใบไม้ในแม่น้ำ"
 pilgrimage.0040.a_moved_capital:0 "ลงมือกันเถอะ"
 #Illness Event - used in health.1001
 pilgrimage.0041.t:0 "$pilgrimage.0040.t$?"
 pilgrimage.0041.desc:0 "อนิจจา เนื้อหนังกำลังทรุดโทรม แต่จิตวิญญาณยังคงแข็งแกร่ง ข้าควรจะมอบชีวิตไว้ในพระหัตถ์ของ [ROOT.Char.GetFaith.HealthGodName] และเดินทางต่อไปยัง [ROOT.Char.GetTravelPlan.GetData.GetNextDestination.GetProvince.GetNameNoTooltip] หรือไม่?"
 pilgrimage.0041.a:0 "ข้า #EMP ได้รับ#! พรจาก [ROOT.Char.GetFaith.HighGodName]"
 pilgrimage.0041.a.tt:0 "[THIS.Char.GetInvolvedActivity.GetName] ของท่านจะดำเนินต่อไป"
 pilgrimage.0041.b:0 "ไม่ นี่อันตรายเกินไป"
 #Invalidation because you bury old host back home
 pilgrimage.0042.t:0 "$pilgrimage_header$ การฝังศพที่บ้านเกิด"
 pilgrimage.0042.desc:0 "การเดินทางของเราถูกตัดให้สั้นลง และเราจะเริ่มเดินทางกลับไปยัง [ROOT.Char.GetCapitalLocation.GetTitle.GetNameNoTierNoTooltip] เพื่อนำ [old_pilgrimage_host.GetTitledFirstName] ไปสู่การพักผ่อนครั้งสุดท้ายของ [old_pilgrimage_host.GetHerHis]"
 pilgrimage.0042.a:0 "นี่คือสิ่งที่ [old_pilgrimage_host.GetSheHe] ต้องการ"
 #Promise your religious relative to go on a Pilgrimage
 pilgrimage.0500.t:0 "ความตายของผู้แสวงบุญ"
 pilgrimage.0500.desc:0 ""[first_holy_site.GetProvince.GetNameNoTooltip] [second_holy_site.GetProvince.GetNameNoTooltip] อา [second_holy_site.GetProvince.GetNameNoTooltip]...," ร่างกายอันบอบบางของ [ROOT.Char.Custom2('RelationToMe' , SCOPE.sC('pilgrimage_dying_relative'))] ของข้า [pilgrimage_dying_relative.GetTitledFirstName] นอนอยู่บนเตียงของ [pilgrimage_dying_relative.GetHerHis] เป็นเพียงซากของตัวตนในอดีตของ [pilgrimage_dying_relative.GetHerHis] ขณะที่ข้าขยับเข้าไปใกล้เตียง [pilgrimage_dying_relative.GetSheHe] พยายามเพ่งสายตาที่พร่ามัวมาที่ข้า\n\n"[pilgrimage_dying_relative.Custom2('RelationToMe' , ROOT.Char)|U]... สิ่งที่เจ้าเสียใจไม่ใช่สิ่งที่เจ้าทำ แต่เป็นสิ่งที่เจ้าไม่ได้ทำ" ข้าโน้มตัวเข้าไปใกล้ และได้กลิ่นความเสื่อมสลายจากลมหายใจของ [pilgrimage_dying_relative.GetHerHis] ขณะที่ [pilgrimage_dying_relative.GetSheHe] พูดต่อ: "อย่าให้กับดักในชีวิตประจำวันขัดขวางเจ้าจากเส้นทางที่แท้จริงสู่ [ROOT.Char.GetFaith.HighGodName]"\n\nสีหน้าเจ็บปวดปรากฏขึ้นบนใบหน้าของ [pilgrimage_dying_relative.GetHerHis] และข้าเข้าใจว่าการสนทนาสิ้นสุดลงแล้ว"
 pilgrimage.0500.a:0 "ใช่ แน่นอน"
 pilgrimage.0500.a.flavor:0 "หากมันจะ ทำให้ [pilgrimage_dying_relative.GetHerHim] พักผ่อนอย่างสงบ"
 pilgrimage.0500.a.tt_pilgrimage:0 "[pilgrimage|E] ครั้งต่อไปของท่านจะมีค่าใช้จ่ายถูกลง"
 pilgrimage.0500.b:0 "ข้าเป็น [ROOT.Char.GetWomanMan] ที่มีธุระยุ่งในช่วงนี้ [ROOT.Char.Custom2('RelationToMe' , SCOPE.sC('pilgrimage_dying_relative'))]"
 pilgrimage.0500.b.flavor:0 "ข้าไม่อยากทำเลยจริงๆ"


 ###Generic Pilgrimage Journey Events
 # St. Elmo's Fire
 pilgrimage.1100.t.greek:0 "$pilgrimage_header$ เฮเลนเพลิง"
 pilgrimage.1100.t.christian:0 "$pilgrimage_header$ ไฟนักบุญเอลโม"
 pilgrimage.1100.t.pagan:0 "$pilgrimage_header$ เปลวไฟแห่ง [ROOT.Char.GetFaith.DivineRealm]"
 pilgrimage.1100.t:0 "$pilgrimage_header$ เปลวไฟศักดิ์สิทธิ์"
 pilgrimage.1100.desc:0 "พายุทะเลถาโถมเข้าใส่เราโดยไม่ทันตั้งตัว ท้องฟ้าที่เต็มไปด้วยสายฟ้าเริ่มโปรยปรายฝนลงมา — และด้วยแสงวาบพร้อมเสียงฟ้าร้องกึกก้อง หัวเสากระโดงเรือก็ลุกโชนเป็นเปลวไฟสีน้ำเงิน ห่อหุ้มเรือไว้ในแสงสว่างอันน่าพิศวง\n\n"
 pilgrimage.1100.companion:0 ""นี่คือสัญญาณ!" [ROOT.Char.Custom2('RelationToMeShort', panicked_pilgrim)] ของข้า [panicked_pilgrim.GetTitledFirstName] ที่ตื่นตระหนกร้องไห้ กอดเชือกเสากระโดงเรือไว้แน่น และแทบไม่ได้ยินเสียงท่ามกลางใบเรือที่สะบัดอย่างรุนแรง "เรา #EMP ต้อง#! หันหลังกลับ! ก่อนที่จะสายเกินไป!"\n\n"
 pilgrimage.1100.alone:0 "เรือดูเหมือนจะลอยอยู่เหนือดาดฟ้า ไม่ถูกแตะต้อง เหนือคลื่นลมแรง นำทางอย่างปลอดภัยโดยพลังศักดิ์สิทธิ์บางอย่างผ่านพายุ"
 pilgrimage.1100.a:0 "[ROOT.Char.GetFaith.HighGodNameAlternate|U] นำทางเรา! สรรเสริญพระองค์!"
 pilgrimage.1100.a.flavor:0 "รักษาทิศทางไว้ พนักงานถือท้ายเรือ!"
 pilgrimage.1100.b:0 "ข้าจะปีนขึ้นไปพบท่าน [ROOT.Char.GetFaith.HighGodName]!"
 pilgrimage.1100.b.success.t:0 "ไฟศักดิ์สิทธิ์"
 pilgrimage.1100.b.wounded.t:0 "บาดเจ็บ"
 pilgrimage.1100.b.flavor:0 "ให้ข้าได้สัมผัสอ้อมกอดแห่ง [ROOT.Char.GetFaith.random_DivineRealm]!"
 pilgrimage.1100.c:0 "[ROOT.Char.GetFaith.WaterGodName] ต้องการเครื่องสังเวย!"
 pilgrimage.1100.c.flavor:0 "เราต้องรอให้พายุฝนฟ้าคะนองนี้สงบลง!"
 pilgrimage.1100.d:0 "หันหลังกลับ เจ้าพวกโง่!"
 pilgrimage.1100.d.flavor:0 "$pilgrimage.1100.c.flavor$"
 every_family_member_tt:0 "สมาชิกครอบครัวทุกคน"
 pilgrimage.1100.success:0 "ท่านได้รับการนำทางอย่างปลอดภัยต่อไป"
 pilgrimage.1100.failure:0 "พายุพัดพาท่านออกนอกเส้นทาง"
 pilgrimage_random_pilgrim_tt:0 "ผู้แสวงบุญแบบสุ่มคนหนึ่งจะตาย ทำให้สมาชิก [family|E] ใดๆ เสียใจ"
 pilgrimage_fell_overboard_tt:0 "[victim_pilgrim.GetFirstName] ตกจากเรือ"
 # Heathen Raiders
 #pilgrimage_joe_0200_army: "[ROOT.Char.GetFaith.WarGodPossessive] Fury"
 pilgrimage.1110.t:0 "$pilgrimage_header$ การปล้นสะดมของ [ROOT.Char.Custom2('GetUnbelieverTerm', heathen_raider)|U]"
 pilgrimage.1110.desc:0 "ขณะข้าม [ROOT.Char.GetCurrentLocation.Custom('GetTerrainTypePlural')] ของ [heathen_raider_county.GetNameNoTierNoTooltip] เราเห็นธงของกองกำลังเล็กๆ ประดับด้วย [heathen_raider.GetFaith.ReligiousSymbol] [heathen_raider.GetFaith.GetAdjective] พวกเขาเป็นคนจรจัดที่ขาดรุ่งริ่ง คอยดักปล้นผู้แสวงบุญที่มุ่งหน้าไปยัง [ROOT.Char.GetInvolvedActivity.GetCurrentPhase.GetLocation.GetName]\n\nผู้นำรีบขวางเส้นทางของเรา ชักม้า [ROOT.Char.GetHerHis] ขึ้นและประกาศตน [heathen_raider.GetHerselfHimself] ว่าเป็น [heathen_raider.GetFirstName]"
 pilgrimage.1110.shared_target_heathen_hajj:0 ""หยุด [ROOT.Char.Custom2('GetUnbelieverTerm', heathen_raider)]! โดย [ROOT.Char.GetFaith.HighGodName] [ROOT.Char.GetFaith.GetAdherentNamePlural] ต้องจ่ายค่าผ่านทางกะอ์บะฮ์""
 pilgrimage.1110.shared_target_controlled_hajj:0 ""การจ่ายเงินเล็กน้อยเพื่อดูกะอ์บะฮ์คือทั้งหมดที่ข้าขอจากผู้ดูแล [heathen_raider.Custom2('GetUnbelieverTermAdjective', ROOT.Char)] [ROOT.Char.GetFaith.GetAdjective]""
 pilgrimage.1110.shared_target_heathen_jerusalem:0 ""อย่ากลัวไปเลย [heathen_raider.Custom2('GetUnbelieverTermPlural', ROOT.Char)] ความมหัศจรรย์ของนครศักดิ์สิทธิ์ของเรารออยู่ เพียงจ่ายค่าธรรมเนียมเล็กน้อย""
 pilgrimage.1110.shared_target_controlled_jerusalem:0 ""หากท่านต้องการเห็นนครศักดิ์สิทธิ์ที่ท่านปรารถนาจริงๆ ค่าธรรมเนียมเล็กน้อยของข้าก็ไม่เป็นอุปสรรค""
 pilgrimage.1110.shared_target_heathen:0 ""เจ้าพวกสุนัข [ROOT.Char.GetFaith.GetAdjective] ไม่รู้หรือ? [ROOT.Char.Custom2('GetUnbelieverTermPlural', heathen_raider)|U] ต้องถวายเครื่องบรรณาการเพื่อชม [heathen_raider.GetFaith.HouseOfWorshipPlural] อันศักดิ์สิทธิ์""
 pilgrimage.1110.shared_target_controlled:0 ""[ROOT.Char.GetFaith.HouseOfWorshipPlural] ของท่านจะยังคงอยู่ที่นั่นเมื่อท่านจ่ายค่าผ่านทางอันสมถะของเรา""
 pilgrimage.1110.shared_heathen_controlled:0 ""[heathen_raider.GetFaith.HouseOfWorshipPlural] ของเรานั้นน่าอัศจรรย์ใจที่จะได้เห็น ดังที่ท่านจะพบเมื่อท่านจ่ายค่าธรรมเนียม""
 pilgrimage.1110.fallback:0 ""หยุด [ROOT.Char.Custom2('GetUnbelieverTerm', heathen_raider)] ข้ารักษาความสงบเรียบร้อยบนเส้นทางเหล่านี้ และเจ้าต้องจ่ายเหมือนคนอื่นๆ""
 pilgrimage.1110.a:0 "ถ้าเจ้าต้องการทองของข้า ก็มาเอามันไป"
 pilgrimage.1110.a.fled:0 "พวกโจรคิดใหม่"
 pilgrimage.1110.a.skirmish:0 "ท่านป้องกันการโจมตีระลอกแรกได้"
 pilgrimage.1110.a.beaten:0 "สำหรับการดูหมิ่นของท่าน พวกมันเอาไปทุกอย่าง"
 pilgrimage.1110.b.religion:0 "มาเถิด [heathen_raider.Custom('SisterBrother')] เราทั้งคู่ติดตาม [ROOT.Char.GetFaith.HighGodName]"
 pilgrimage.1110.b.unreformed:0 "มาเถิด ยังไม่สายเกินไปสำหรับ [ROOT.Char.GetFaith.ReligiousText]"
 pilgrimage.1110.b:0 "ไม่จำเป็นต้องใช้ความรุนแรง มาคุยกันเถอะ"
 pilgrimage.1110.c:0 "เจ้าถูกหลอกลวง จงฟังความจริงของ [ROOT.Char.GetFaith.GetAdjectiveNoTooltip]"
 pilgrimage.1110.c.success:0 "คำพูดของท่านดังเป็นความจริง"
 pilgrimage.1110.c.failure:0 "โจรไม่ขบขัน"
 pilgrimage.1110.d:0 "เอาทองของเจ้าไป โจร"
 two_entourage_members_wounded_tt:0 "สมาชิกขบวนสูงสุดสองคนอาจ [GetTrait('wounded_1').GetName( GetNullCharacter )]"
 one_entourage_members_wounded_tt:0 "สมาชิกขบวนคนหนึ่งอาจ [GetTrait('wounded_1').GetName( GetNullCharacter )]"
 two_entourage_members_die_tt:0 "สมาชิกขบวนสูงสุดสองคนอาจตาย"
 one_entourage_members_die_tt:0 "สมาชิกขบวนคนหนึ่งอาจตาย"
 # Tour Church
 pilgrimage.1120.t:0 "$pilgrimage_header$ สถาปัตยกรรม [temple_province.GetCounty.GetFaith.GetReligion.GetAdjectiveNoTooltip]"
 pilgrimage.1120.desc:0 "ขณะผ่าน [temple_province.GetTitle.GetDeJureLiege.GetNameNoTooltip] เราใช้โอกาสเยี่ยมชม [ROOT.Char.GetFaith.HouseOfWorship] แห่ง [temple_province.GetName] ศูนย์กลางอำนาจและการสักการะ [temple_province.GetCounty.GetFaith.GetAdjective] ของ [temple_liege.GetPrimaryTitle.GetAdjectiveNoTooltip]\n\n[temple_person.GetName] [temple_person.GetFaith.PriestNeuter] ชั้นผู้น้อยในท้องถิ่น พาเราชมบริเวณและอาคารต่างๆ [temple_person.GetSheHe|U] เล่าประวัติศาสตร์ และชี้ให้เห็นงานศิลปะที่สร้างสรรค์โดย [temple_province.GetCounty.GetFaith.DevoteeNeuterPlural] ในท้องถิ่น ซึ่งขณะนี้กำลังรวมตัวกันสวดมนต์ตอนเที่ยง"
 pilgrimage.1120.a:0 "นี่ ทำให้ข้าเกิดความคิด..."
 pilgrimage.1120.b:0 "นี่ #EMP แหละ#! คือสิ่งที่เราต้องการใน [ROOT.Char.GetPrimaryTitle.GetNameNoTierNoTooltip]!"
 pilgrimage.1120.c:0 "ช่างเป็นข้ออ้างที่น่าสมเพชสำหรับ [ROOT.Char.GetFaith.HouseOfWorship]"
 pilgrimage.1120.d:0 "ใช่ ใช่ พอแล้ว ขอบคุณ"
 pilgrimage.1120.e:0 "ข้าจะเข้าร่วมสวดมนต์ต่อ [ROOT.Char.GetFaith.HighGodName]"
 pilgrimage.1120.f:0 "นี่ #EMP แหละ#! คือสิ่งที่เราต้องการใน [ROOT.Char.GetPrimaryTitle.GetNameNoTierNoTooltip]!"
 # Roadside Shrine
 pilgrimage.1130.t:0 "$pilgrimage_header$ ศาลเจ้าริมทาง"
 pilgrimage.1130.desc:0 "ณ ทางแยกนอก [shrine_province.GetName] ศาลเจ้า [shrine_province.GetCounty.GetFaith.GetAdjective] ที่ถูกทอดทิ้ง ซึ่งมีเครื่องหมาย [shrine_province.GetCounty.GetFaith.ReligiousSymbol] ตั้งอยู่อย่างโดดเดี่ยวท่ามกลาง [shrine_province.Custom('GetProvinceGroundDesc')]\n\nช่องเว้าเป็นที่พักพิงของเครื่องเซ่นไหว้อันสมถะที่นักเดินทางและชาวบ้านทิ้งไว้ ล้อมรอบด้วยซากเทียนนับไม่ถ้วนที่ดับไปแล้ว"
 pilgrimage.1130.both:0 "\n\n[ROOT.Char.Custom2('RelationToMeShort', shrine_faithist)] [shrine_faithist.GetName] ของข้า หยุดสวดมนต์ ขณะที่ [ROOT.Char.Custom2('RelationToMeShort', shrine_mocker)] [shrine_mocker.GetName] ของข้า กลอกตา [shrine_mocker.GetHerHis] พลางทำเสียงจุปากดังๆ"
 pilgrimage.1130.faithist:0 "\n\n[ROOT.Char.Custom2('RelationToMeShort', shrine_faithist)] ของข้า [shrine_faithist.GetName] หยุดสวดมนต์ เพิ่มเครื่องเซ่นเล็กๆ ของ [shrine_faithist.GetHerHis] ลงในกอง"
 pilgrimage.1130.mocker:0 "\n\n[ROOT.Char.Custom2('RelationToMeShort', shrine_mocker)] ของข้า [shrine_mocker.GetName] เยาะเย้ยเมื่อเห็นมัน พึมพำเกี่ยวกับ [shrine_mocker.GetFaith.NegativeAfterLife]"
 pilgrimage.1130.a:0 "ข้าพอจะแบ่งปันบางอย่างได้"
 pilgrimage.1130.b:0 "ไม่ว่ากันถ้าข้าจะเอา..."
 pilgrimage.1130.b.flavor:0 "มีประโยชน์กับข้ามากกว่าอยู่แล้ว!"
 every_root_faith_entourage_member_tt:0 "สมาชิกขบวน [shrine_visitor.GetFaith.GetAdjective] ทุกคน"
 every_province_faith_entourage_member_tt:0 "สมาชิกขบวน [shrine_province.GetCounty.GetFaith.GetAdjective] ทุกคน"
 every_zealous_root_faith_entourage_member_tt:0 "สมาชิกขบวน [shrine_visitor.GetFaith.GetAdjective] ที่ [GetTrait('zealous').GetName( GetNullCharacter )] ทุกคน"
 pilgrimage.1130.c:0 "รื้อถอนความโง่เขลา [shrine_province.GetCounty.GetFaith.GetAdjectiveNoTooltip] นี้ทิ้งไป!"
 pilgrimage.1130.c.flavor:0 "นั่นจะแสดงให้พวกเขาเห็น!"
 pilgrimage.1130.d:0 "[shrine_faithist.GetFaith.HighGodName] จะไม่ได้รับสิ่งนั้นหรอกนะ"
 pilgrimage.1130.d.flavor:0 "เพราะ [shrine_faithist.GetFaith.HighGodName] ไม่มีอยู่จริง!"
 pilgrimage.1130.e:0 "หุบปากของเจ้าเสีย [ROOT.Char.Custom2('GetUnbelieverTerm', shrine_mocker)]"
 pilgrimage.1130.f:0 "มาเถอะ อย่าโอ้เอ้"
 pilgrimage.1130.f.other:0 "[ROOT.Char.GetFaith.HighGodName] ไม่รอ [shrine_province.GetCounty.GetFaith.GetAdherentNameNoTooltip] หรอกนะ"
 # Strength in Numbers
 pilgrimage.1140.t:0 "$pilgrimage_header$ ความปลอดภัยในหมู่มาก"
 pilgrimage.1140.desc:0 "ขณะที่เราเดินทางผ่าน [ROOT.Char.GetCurrentLocation.GetCounty.GetTitle.GetNameNoTier] เราได้รับการทักทายจากสามัญชนชาว [group_leader.GetCulture.GetName] ที่อ้างว่าเป็นผู้นำกลุ่มผู้แสวงบุญ [ROOT.Char.GetFaith.GetAdjective]\n\n"ท่าน [ROOT.Char.GetTitleAsNameNoTooltip] ที่เคารพ เราเดินทางไปยัง [destination.GetName] มาหลายสัปดาห์แล้ว แต่ถนนหนทางอันตรายเกินไป และตอนนี้เราขาดเสบียง"\n\n"เราจะขอบคุณการสนับสนุนของท่านตลอดไป""
 pilgrimage.1140.a:0 "ยิ่งมากยิ่งสนุก!"
 pilgrimage.1140.a.tt:1 "[group_leader.GetFirstName] และคนอื่นๆ อีกสูงสุดสามคนจะเข้าร่วม [ROOT.Char.GetInvolvedActivity.GetName] ของท่าน"
 pilgrimage.1140.b:0 "[group_leader.GetCulture.GetNameNoTooltip]? ไม่มีทาง"
 pilgrimage.1140.b.flavor:0 "อย่าไว้ใจ [group_leader.GetCulture.GetNameNoTooltip] เด็ดขาด"
 pilgrimage.1140.c:0 "เอาเหรียญไปบ้าง สำหรับความลำบากของพวกเจ้า"
 pilgrimage.1140.d:0 "ไม่มีทาง ชาวบ้าน"
 pilgrimage.1140.d.flavor:0 "ไปเลย! ไป!"
 grateful_pilgrims_title:0 "ผู้แสวงบุญผู้กตัญญู"
 cultural_acceptance_rejected_pilgrims:0 "ผู้แสวงบุญที่ถูกปฏิเสธ"
 #Heathen-hating adherent challenges you
 pilgrimage.2002.t:0 "$pilgrimage_header$ รักเพื่อนบ้านของท่าน"
 pilgrimage.2002.desc:1 "ในหมู่ผู้แสวงบุญร่วมทางของข้า มี [heathen_hater.GetWomanMan] ผู้หนึ่งที่เทศนาถึงความเมตตาและความเป็นพี่น้อง — จนกระทั่ง [heathen_hater.GetSheHe] เอ่ยถึงหัวข้อ [ROOT.Char.Custom('GetDerogatoryNonbelieverPlural')]\n\nเย็นวันหนึ่งรอบกองไฟ [heathen_hater.GetSheHe] ประกาศก้องว่าพวกนั้นคือ \"อสุรกายที่น่าชิงชังในสายพระเนตรของ [ROOT.Char.GetFaith.PantheonTerm]! พวกวิปลาสและฆาตกรฆ่าเด็กทั้งสิ้น!\" ผู้คนส่วนใหญ่หลบสายตาเมื่อ [heathen_hater.GetSheHe] มองพวกเขา ค่ำคืนนี้ ข้าหลบไม่เร็วพอ \"ท่านไม่เห็นด้วยหรือ ท่าน [ROOT.Char.GetTitleAsNameNoTooltip]?\""
 pilgrimage.2002.a:0 "พวกเขาไม่ได้ #EMP เลวร้าย#! ขนาดนั้นทั้งหมดหรอก"
 pilgrimage.2002.b:0 "ข้าเห็นด้วย และข้าจะไม่ไว้ใจใครก็ตามที่มาปกป้องพวกเขา!"
 pilgrimage.2002.c:0 "จริงแท้! พวกเขาถ่มน้ำลายรดพระพักตร์ [ROOT.Char.GetFaith.HighGodName]!"
 #Companions are running low
 pilgrimage.2003.t:1 "$pilgrimage_header$ เรื่องของความปลอดภัย"
 pilgrimage.2003.desc:1 "ข้ารู้สึกกังวลใจมาระยะหนึ่งแล้ว การจาริกแสวงบุญของข้ากลับกลายเป็นอันตรายกว่าที่คาดไว้ — หรือบางทีข้าอาจยังไม่ได้อดทนต่อการทดลองมากพอที่จะพิสูจน์ตัวเองว่าคู่ควรกับการคุ้มครองของ [ROOT.Char.GetFaith.HighGodNameAlternatePossessive]\n\nอย่างไรก็ตาม ข้า #EMP ได้#! สังเกตเห็นบุคคลที่น่าประทับใจสองสามคนในถิ่นฐานท้องถิ่นของ [ROOT.Char.GetCurrentLocation.GetNameNoTooltip] ซึ่งแน่นอนว่าจะช่วยเพิ่มความปลอดภัยให้กับการจาริกแสวงบุญ — ในลักษณะที่ลงมือปฏิบัติจริง"
 pilgrimage.2003.a:1 "ข้าควรจ้างพวกเขาสองสามคนสำหรับการจาริกแสวงบุญของข้า"
 pilgrimage.2003.b:1 "[2002_local_warrior.GetTitledFirstNameNoTooltip] ดูเหมือนจะเป็นตัวอย่างที่ดี"
 pilgrimage.2003.c:0 "ไม่ ข้าศรัทธาใน [ROOT.Char.GetFaith.PantheonTerm]"
 #Run into a Potential Friend
 pilgrimage.2004.t:0 "$pilgrimage_header$ การเผชิญหน้าที่ไม่คาดคิด"
 pilgrimage.2004.desc:1 "ขณะที่ข้าเข้าใกล้ [ROOT.Char.GetTravelPlan.GetData.GetNextDestination.GetProvince.GetNameNoTooltip] มากขึ้น ข้าได้พบกับเพื่อนผู้แสวงบุญมากขึ้นเรื่อยๆ จากทุกสารทิศ\n\nหนึ่งในผู้แสวงบุญเหล่านี้จำข้าได้ แต่ไกล: "[ROOT.Char.GetTitledFirstNameNoTooltip]?! นั่นท่านหรือ?"\n\nไม่ใช่ใครอื่นนอกจาก [potential_friend.Custom2('MyCharacterIntroduction', ROOT.Char)]!"
 pilgrimage.2004.a:0 "เราถูกนำมาพบกันโดย [ROOT.Char.GetFaith.PantheonTerm]!"
 pilgrimage.2004.b:0 "เป็นการพบปะที่เป็นมงคล แต่ข้าต้องสวดมนต์ตามลำพัง"
 #A peasant inadvertedly insults you
 pilgrimage.2005.t:0 "$pilgrimage_header$ เรื่องราวหยาบคาย"
 pilgrimage.2005.desc:3 "ขณะเดินผ่านกองไฟ ผู้แสวงบุญจากขบวนอื่นกำลังเล่าเรื่องที่ [rude_pilgrim.GetSheHe] เคยได้ยินเกี่ยวกับ [ROOT.Char.GetTitleAsNameNoTooltip]"
 pilgrimage.2005.desc_close:1 "แห่งดินแดนเหล่านี้"
 pilgrimage.2005.desc_far:2 "แห่งสถานที่ห่างไกลบางแห่งที่เรียกว่า [ROOT.Char.GetPrimaryTitle.GetNameNoTierNoTooltip]"
 pilgrimage.2005.outro:0 "ท่ามกลางเสียงหัวเราะดังลั่น\n\nขณะที่ [rude_pilgrim.GetSheHe] สังเกตเห็นความลังเลของข้า นักเล่าเรื่องก็มองมาที่ข้าอย่างปลอบโยน: \"อย่ากังวลไปเลย [ROOT.Char.Custom('FormOfAddressForLiege')] — นี่คงเป็นเรื่องของขุนนางผู้สูงศักดิ์ #EMP คนอื่น#! ที่หยิ่งยโส[ROOT.Char.GetWomanMan]!\""
 pilgrimage.2005.a:0 ""จริงหรือ? เล่าเรื่อง [ROOT.Char.GetTitleAsNameNoTooltip] ผู้นี้ให้ข้าฟังอีกสิ""
 pilgrimage.2005.a.flavor:0 "ข้านั่งลงข้างกองไฟ"
 pilgrimage.2005.b:0 ""ทหาร! เอาแส้ของข้ามา""
 pilgrimage.2005.c:0 "บางทีถึงเวลาที่ข้าต้องหาคนอื่นร่วมเดินทางด้วยแล้ว"
 #You have gotten lost
 pilgrimage.2006.t:1 "$pilgrimage_header$ เส้นทางชมวิว"
 pilgrimage.2006.intro:1 "การเดินทางทางจิตวิญญาณหยุดชะงักลงอย่างแท้จริง"
 pilgrimage.2006.desc_alone:0 "ข้าเบิกตากว้าง พยายามจดจำเส้นทางข้างหน้า — แต่กลับนึกอะไรไม่ออก — และเริ่มกังวลเล็กน้อย มัน #EMP เคย#! เป็นทางนี้ไม่ใช่หรือ...? ข้ามองอย่างลังเลไปยังชาวบ้านคนหนึ่งที่กำลังทำงานบ้านอยู่ไกลออกไปเล็กน้อย"
 pilgrimage.2006.desc_travel_leader:1 "$travel_leader_court_position$ [caravan_master.GetTitledFirstName] ของข้ากำลังมองไปรอบๆ ค้นหาเส้นทางไปข้างหน้าอย่างบ้าคลั่ง และผู้คนเริ่มสังเกตเห็น\n\nใบหน้าของ [caravan_master.GetTitledFirstNamePossessiveNoTooltip] เปลี่ยนเป็นสีเทาขณะที่ [caravan_master.GetSheHe] หันสายตา [caravan_master.GetHerHis] มาทางข้า มองหาคำตอบว่าจะทำอย่างไรต่อไป"
 pilgrimage.2006.a:1 "ข้ารู้เส้นทางไป [ROOT.Char.GetTravelPlan.GetData.GetNextDestination.GetProvince.GetNameNoTooltip] เหมือนหลังมือของข้า!"
 pilgrimage.2006.a_pious:0 "เราจะให้ [ROOT.Char.GetFaith.HighGodNameAlternate] นำทาง"
 pilgrimage.2006.b:1 "ให้เราเพลิดเพลินกับการสร้างสรรค์ของ [ROOT.Char.GetFaith.CreatorNamePossessive] อีกสักครู่"
 pilgrimage.2006.b_cynical:0 "ข้าคิดว่ามันไม่ใช่จุดจบของโลกหรอกนะ"
 pilgrimage.2006.c:0 "ข้าเดาว่าข้าคงต้องถามทางจากชาวบ้าน..."
 pilgrimage.2006.c_caravan_master:0 "ตอนนี้ #EMP เจ้า#! ไปถามทางได้แล้ว"
 #Fall ill
 pilgrimage.2008.t:0 "$pilgrimage_header$ ความเจ็บป่วย"
 pilgrimage.2008.desc:1 "ดูเหมือนว่าข้าจะไม่ค่อยสบายกับการเดินทางทั้งหมดนี้ บางทีอาจเป็น เพราะดินแดนแปลกประหลาดที่เต็มไปด้วยอากาศที่ไม่คุ้นเคย หรือบางทีขนสัตว์ของข้าอาจไม่เพียงพอที่จะให้ความอบอุ่น\n\nไม่ว่าจะด้วยวิธีใด อาการไอของข้ายังคงอยู่เป็นเวลาหลายสัปดาห์ และเช้านี้ข้าแทบไม่มีแรงลุกจากเตียง"
 pilgrimage.2008.a:1 "หากนี่คือพระประสงค์ของ [ROOT.Char.GetFaith.HighGodNameAlternatePossessive]"
 pilgrimage.2008.a.tt:0 "การเดินทางขณะ [GetTrait('ill').GetName( GetPlayer )] มีความเสี่ยงต่อสุขภาพมากขึ้น"
 pilgrimage.2008.whole_of_body:0 "โอ้ อาการไอเล็กน้อยนี้จะหายไปอย่างรวดเร็ว"
 pilgrimage.2008.court_physician:0 "[traveling_court_physician.GetTitledFirstNameNoTooltip|U] ปรุงยาอะไรให้ข้าหน่อย"
 #Develop pneumonia
 pilgrimage.2009.t:0 "$pilgrimage_header$ อาการไอแหบแห้ง"
 pilgrimage.2009.desc:0 "การเดินทางไม่ดีต่อข้าเลย สุขภาพของข้าไม่ได้ดีขึ้นจากการแสวงหาพระคุณของ [ROOT.Char.GetFaith.PantheonTerm] มันแย่ลงมาก มาก ข้าจำไม่ได้แล้วว่าการหายใจโดยไม่ลำบากเป็นอย่างไร"
 pilgrimage.2009.a:1 "ขอ [ROOT.Char.GetFaith.HighGodNameAlternate] ทรงเมตตา"
 pilgrimage.2009.a.tt:0 "การเดินทางขณะ [GetTrait('pneumonic').GetName( GetPlayer )] มีความเสี่ยงต่อสุขภาพอย่างอันตราย"
 #Meet a mystic
 pilgrimage.2010.t:0 "$pilgrimage_header$ ผู้ทรงญาณ"
 pilgrimage.2010.desc:1 "[2010_mystic.GetTitledFirstName] เป็นหนึ่งในคนที่แปลกประหลาดที่สุดที่ข้าเคยพบบนการเดินทางนี้ [2010_mystic.GetSheHe|U] ดูเหมือนจะเป็นผู้ศรัทธาที่มั่นคง แต่ยังอธิบายถึงธรรมชาติที่แท้จริงของ [ROOT.Char.GetFaith.HighGodName] และความหมายทั้งหมด ในเวลากลางคืน กระโจมของ [2010_mystic.GetHerHis] สว่างไสวด้วยแสงเทียนภายใน และบางครั้งก็มีเสียงสวดมนต์แปลกๆ และกลิ่นธูปที่ไม่ธรรมดาลอยออกมา\n\nข้าไม่พร้อมเลยเมื่อ [2010_mystic.GetFirstNameNoTooltip] เชิญให้ข้าเข้าไป"
 pilgrimage.2010.a:0 "ข้าค่อนข้างอยากรู้อยากเห็น..."
 pilgrimage.2010.a.tt:0 "ท่านเข้าไปในกระโจม"
 pilgrimage.2010.b:0 "ไม่ ขอบคุณ ทั้งหมดนี้มีกลิ่นอายของพวกนอกรีตสำหรับข้า!"
 #The Mystic has a lot to say about your faith
 pilgrimage.2011.desc:1 "ภายในกระโจมของ [2010_mystic.GetTitledFirstNamePossessive] ข้าได้รับการต้อนรับด้วยกลิ่นที่รุนแรงและอากาศที่ร้อนอบอ้าวและหนักอึ้ง "เป็นสิ่งสำคัญที่เราต้องหันสายตาเข้าหาตัวเอง" [2010_mystic.GetSheHe] อธิบายและนั่งลง\n\n"ข้าต้องการให้เจ้าหลับตาและตั้งสมาธิ เหมือนที่ข้าทำ ให้ [ROOT.Char.GetFaith.PantheonTerm] ไหลผ่านตัวเจ้า เอื้อมไปสู่ความปีติยินดีแห่งความเป็นทิพย์!""
 pilgrimage.2011.a:0 "ใช่! ข้ารู้สึกถึงความเชื่อมโยงกับ [ROOT.Char.GetFaith.HighGodNameAlternate]!"
 pilgrimage.2011.a.tt:0 "ท่านประสบกับความปีติยินดีแห่งความเป็นทิพย์"
 pilgrimage.2011.b:0 "นี่สบายมาก ข้าอาจจะเผลอหลับไป..."
 pilgrimage.2011.b.tt:0 "ท่านได้งีบหลับอย่างสบาย"
 pilgrimage.2011.c:0 "บอกข้าที นี่เกี่ยวข้องกับ [ROOT.Char.GetFaith.HighGodName] อย่างไร?"
 pilgrimage.2011.c.tt:0 "ท่านเข้าร่วมการโต้แย้งกับผู้ทรงญาณ"
 #Fallback in case something happened in between events
 pilgrimage.2012.desc:1 "ข้าจำไม่ได้แน่ชัดว่าเกิดอะไรขึ้นหลังจากข้าเข้าไปในกระโจมของผู้ทรงญาณ ทั้งหมดที่ข้าจำได้คือภาพเลือนรางและความรู้สึกมึนงง\n\nตอนนี้ข้าถามตัวเองว่า [2010_mystic.GetSheHe] เคยอยู่ที่นี่จริงหรือไม่..."
 pilgrimage.2012.a:1 "[2010_mystic.GetSheHe|U] มีความคิดแปลกๆ มากมาย"
 #Outcome of engaging
 pilgrimage.2013.desc:1 "หลังจากทำตามคำแนะนำของ [2010_mystic.GetTitledFirstNamePossessive] ข้าสามารถเห็นทุกอย่างชัดเจนขึ้นมาก ข้าสามารถ #EMP รู้สึก#! ได้ [ROOT.Char.GetFaith.PantheonTerm|U] โลก ทั้งหมดไหลผ่านร่างกายของข้า ผ่านจิตวิญญาณของข้า\n\nเมื่อข้าออกมาจากกระโจมหลายชั่วโมงต่อมา ข้ามีความเข้าใจใหม่เกี่ยวกับตัวเอง และเกี่ยวกับชีวิต"
 pilgrimage.2013.a:0 "ข้าเคยตาบอดมาก่อน และตอนนี้ข้ามองเห็นแล้ว"
 #Outcome of sleeping
 pilgrimage.2014.desc:1 "เมื่อข้าตื่นขึ้นจากการหลับในกระโจมของ [2010_mystic.GetTitledFirstNamePossessive] กระโจมนั้นหายไปแล้ว คนรับใช้ของข้ากำลังปลุกข้าจากเสื่อที่ข้าหลับไป แต่ไม่มีร่องรอยอื่นใดของผู้ทรงญาณ\n\nอย่างน้อยการนอนหลับก็ ทำให้สดชื่น!"
 pilgrimage.2014.a:0 "ทำไมกระเป๋าเงินของข้าถึงรู้สึกเบาผิดปกติ?"
 pilgrimage.2014.pilfered.t:0 "ถูกขโมย"
 pilgrimage.2014.pilfered.desc:0 "มีคนมายุ่งกับข้าวของของท่าน"
 pilgrimage.2014.restful.t:0 "พักผ่อนอย่างเต็มที่"
 pilgrimage.2014.restful.desc:0 "ท่านนอนหลับอย่างปลอดภัยและสบาย"
 pilgrimage.2014.a_restful:0 "นั่นเป็นการพักผ่อนที่ดี"
 #Outcome of debating
 pilgrimage.2015.desc:1 "ข้าจะพูดตามตรง ข้าไม่เคยคาดคิดว่า [2010_mystic.GetTitledFirstName] จะสามารถตอบคำถามเกี่ยวกับการปฏิบัติแปลกๆ ของ [2010_mystic.GetHerHis] ได้ดีเท่าที่ [2010_mystic.GetSheHe] ทำ\n\nข้ายังคงสงสัยเกี่ยวกับ... อะไรก็ตามที่ [2010_mystic.GetSheHe] กำลังทำอยู่ แต่ข้าได้รับมุมมองใหม่ๆ ที่น่าพิจารณาอย่างแน่นอน!"
 pilgrimage.2015.a:0 "ท่านจะเข้าใกล้ [ROOT.Char.GetFaith.PantheonTerm] ได้ #EMP อย่างไร#?"
 pilgrimage.2015.learning.t:0 "การเรียนรู้เพิ่มขึ้น"
 pilgrimage.2015.learning.desc:0 "ท่านเรียนรู้บางอย่างจากการโต้แย้งกับผู้ทรงญาณ"
 pilgrimage.2015.piety.t:0 "ได้รับศรัทธา"
 pilgrimage.2015.piety.desc:0 "ท่านได้รับศรัทธาจากการโต้แย้งเกี่ยวกับความเชื่อของท่าน"
 #Pilgrimage thieves
 pilgrimage.2020.t:0 "$pilgrimage_header$ โจร"
 pilgrimage.2020.desc:0 "ข้าตื่นจากการหลับใหลเมื่อมีคนในค่ายทำกระทะเหล็กหล่น เมื่อข้ามองไปรอบๆ ดูเหมือนว่าคนสองคนที่ แต่งตัวเหมือนผู้แสวงบุญกำลังรื้อค้นเสบียงของเราเพื่อหาสิ่งของมีค่าที่จะขโมย"
 pilgrimage.2020.desc_adult:0 "\n\nหนึ่งในนั้นเห็นข้าตื่นและหยุดนิ่ง ขณะที่โจรอีกคนหันหลังวิ่งหนีไป"
 pilgrimage.2020.desc_child:0 "\n\nคนตัวเล็กกว่าในสองคน ดูเหมือนจะเป็นเด็กที่ทุกข์ทรมาน เห็นข้าตื่นและหยุดนิ่ง ขณะที่โจรอีกคนหันหลังวิ่งหนีไป"
 pilgrimage.2020.a:0 "เจ้าควรเข้าร่วมกับเราไปยัง [ROOT.Char.GetTravelPlan.GetData.GetNextDestination.GetProvince.GetNameNoTooltip]"
 pilgrimage.2020.a_child:0 "นั่งลงข้างกองไฟเถิด เจ้าหนู"
 pilgrimage.2020.a.flavor:0 "[thief_to_convert.GetSheHe|U] เป็นสิ่งมีชีวิตที่โชคร้ายอย่างเห็นได้ชัด"
 pilgrimage.2020.b:0 "นี่ไม่ใช่ชีวิตที่ [ROOT.Char.GetFaith.HighGodName] ต้องการสำหรับเจ้า"
 pilgrimage.2020.b.success.desc:0 "ท่านโน้มน้าวเด็กน้อยได้สำเร็จ"
 pilgrimage.2020.b.success.tt:0 "เด็กน้อยต้องการคำแนะนำเพิ่มเติม"
 pilgrimage.2020.b.failure.t:0 "โจรวิ่งหนีไป"
 pilgrimage.2020.b.failure.desc:0 "ท่านไม่สามารถโน้มน้าวเด็กน้อยได้"
 pilgrimage.2020.c:0 "เราทุกคนทำในสิ่งที่ต้องทำ"
 pilgrimage.2020.c_cynical:0 "นี่ #EMP คือ#! พระประสงค์ของ [ROOT.Char.GetFaith.HighGodNamePossessive] สินะ"
 pilgrimage.2020.c.flavor:0 "ข้าเป็นใครที่จะไปยุ่งเกี่ยวกับแผนการของ [ROOT.Char.GetFaith.HighGodNamePossessive]"
 #Pilgrimage thief wants to repent
 pilgrimage.2021.t:0 "$pilgrimage_header$ การสำนึกผิด"
 pilgrimage.2021.desc:0 "ข้าประสบความสำเร็จในการโน้มน้าว [thief_to_convert.GetTitledFirstName] ให้เปลี่ยนวิถีทางของ [thief_to_convert.GetHerHis] [thief_to_convert.GetSheHe|U] ยืนอยู่ตรงหน้าข้า น้ำหนักของความละอายของ [thief_to_convert.GetHerHis] ทำให้ไหล่ของ [thief_to_convert.GetHerHis] ตก ขณะที่ [thief_to_convert.GetSheHe] หลีกเลี่ยงที่จะสบตาข้า\n\n"ชีวิตนี้ไม่ใช่ทางเลือกของข้า" [thief_to_convert.GetFirstNameNoTooltip] พูดช้าๆ "ข้าควรทำอย่างไรเพื่อสำนึกผิดบาปของข้า?""
 pilgrimage.2021.a:0 "เผยแพร่พระวจนะของ [ROOT.Char.GetFaith.GetReligion.GetNameNoTooltip]"
 pilgrimage.2021.b:0 "การลงโทษตัวเอง ทำให้ #EMP ข้า#! รู้สึกดีขึ้นเสมอ..."
 pilgrimage.2021.c:0 "การทำงานหนักแก้ปัญหาทุกอย่างได้"
 pilgrimage.2021.c.flavor:0 "[thief_to_convert.GetSheHe|U] จะทำงานชดใช้บาปของ [thief_to_convert.GetHerHis] ให้ #EMP ข้า#!."
 #Sea: Encounter a massive rainbow
 pilgrimage.2030.t:0 "$pilgrimage_header$ ปรากฏการณ์สภาพอากาศ"
 pilgrimage.2030.desc:0 "ขณะเดินทางข้ามทะเลไปยังจุดหมายปลายทางของเราใน [ROOT.Char.GetTravelPlan.GetData.GetNextDestination.GetProvince.GetNameNoTooltip] ข้าทึ่งในความกว้างใหญ่และอารมณ์ [ROOT.Char.Custom('GetWickedDangerous')] ของมันอยู่ตลอดเวลา\n\nหลังจากเพิ่งฝ่าพายุเมื่อคืนก่อน เช้านี้เราได้รับการต้อนรับด้วยรุ้งกินน้ำอันงดงามที่ทอดยาวจากขอบฟ้าหนึ่งไปยังอีกขอบฟ้าหนึ่ง\n\nข้าได้ยินผู้แสวงบุญคนอื่นๆ กำลังครุ่นคิดถึงความยิ่งใหญ่ของมัน เช่นกัน โดยเรียกภาพที่เห็นนี้ว่า #EMP ศักดิ์สิทธิ์#! และ #EMP เป็นสัญญาณจาก [ROOT.Char.GetFaith.HighGodName]#!."
 pilgrimage.2030.a:0 "#EMP อันที่จริง...#!"
 pilgrimage.2030.a.flavor:0 "สิ่งศักดิ์สิทธิ์อาจสร้างฝนขึ้นมา แต่รุ้งกินน้ำเป็นปรากฏการณ์สภาพอากาศ อย่างแรกและสำคัญที่สุด"
 pilgrimage.2030.b:0 "ใช่! สัมผัสถึงการประทับอยู่ของ [ROOT.Char.GetFaith.HighGodName]!"
 pilgrimage.2030.b.flavor:0 "แน่นอนว่าสิ่งที่สวยงาม เช่นนี้ #EMP ต้อง#! เป็นสิ่งศักดิ์สิทธิ์!"
 pilgrimage.2030.c:0 "น่าทึ่งที่ธรรมชาติและสิ่งศักดิ์สิทธิ์ทำงานร่วมกัน"
 pilgrimage.2030.d:0 "มัน #EMP น่า#! ประทับใจมาก ข้าเดาว่านะ"
 #Sea: Go fish
 pilgrimage.2040.t:0 "$pilgrimage_header$ ตกปลา"
 pilgrimage.2040.desc:0 "ขณะที่เราใช้เวลาทั้งวันทั้งคืนบนเรือลำนี้ ข้าพยายามเติมเต็มเวลาด้วยการสนทนาที่น่าสนใจ การสวดมนต์ การใคร่ครวญถึงการเดินทาง หรือเพียงแค่วางแผนการเดินทางต่อไป\n\nอย่างไรก็ตาม เมื่อเร็วๆ นี้ข้าเห็นผู้แสวงบุญบางคนในขบวนของข้าใช้เวลาไปกับงานที่ค่อนข้างธรรมดาอีกอย่างหนึ่ง — การตกปลา\n\nพวกเขาทั้งหมดดูค่อนข้างไร้กังวลและกิจกรรมนั้นเองก็มีแง่มุมที่ผ่อนคลาย"
 pilgrimage.2040.a:0 "ข้าจะเข้าร่วม!"
 pilgrimage.2040.a.flavor:0 "การเป็นชาวประมง [ROOT.Char.GetWomanMan] เป็นอาชีพที่สูงส่งและเรียบง่าย ท้ายที่สุดแล้ว"
 pilgrimage.2040.a.success.t:0 "ปลาตัวใหญ่"
 pilgrimage.2040.a.success.desc:0 "ท่านจับปลาตัวใหญ่ได้"
 pilgrimage.2040.a.less_success.t:0 "ปลาตัวเล็ก"
 pilgrimage.2040.a.less_success.desc:0 "ท่านจับปลาตัวเล็กได้"
 pilgrimage.2040.b:0 "#EMP พวกไร้อารยธรรม#! ข้าควรใช้เวลาสวดมนต์แทน"
 pilgrimage.2040.c:0 "งีบหลับสักหน่อยเป็นไง?"
 pilgrimage.2040.d:0 "ไม่ล่ะ ไปทำอย่างอื่นกันเถอะ"
 #Sea: Shipwrecked pilgrims
 pilgrimage.2050.t:0 "$pilgrimage_header$ ถูกซัดขึ้นฝั่ง"
 pilgrimage.2050.desc:0 "ก่อนพลบค่ำ เราได้ยินเสียงร้องขอความช่วยเหลือ และเมื่อข้ามองข้ามราวบันไดออกไปยังผืนน้ำอันกว้างใหญ่ ข้าสังเกตเห็นเรือลำเล็กที่มีรูปร่างคล้ายมนุษย์สามคน\n\nดูเหมือนพวกเขาจะลอยข้ามทะเลไปอย่างไร้จุดหมาย ไปตามที่คลื่นพัดพา\n\nข้าพยายามมองให้ออกว่าพวกเขาเป็นใคร และจากความรู้ที่จำกัดของข้า พวกเขาดูเหมือนจะเป็นผู้ประสบภัยเรือแตก... ชาว [first_pilgrim.GetCulture.GetCollectiveNounNoTooltip]? พวกเขามาทำอะไรกันที่นี่?"
 pilgrimage.2050.a:0 "ขึ้นเรือมา!"
 pilgrimage.2050.a.tt:0 "ท่านส่งผู้แสวงบุญขึ้นฝั่งที่ใกล้ที่สุด"
 pilgrimage.2050.b:0 "ท่านเคยได้ยินเกี่ยวกับพระคุณของ [ROOT.Char.GetFaith.HighGodName] หรือไม่?"
 pilgrimage.2050.b.success.t:0 "การเปลี่ยนศาสนา"
 pilgrimage.2050.b.success.desc:0 "ท่านเปลี่ยนศาสนาของผู้แสวงบุญเป็น [ROOT.Char.GetFaith.GetNameNoTooltip]"
 pilgrimage.2050.b.failure.t:0 "ไม่เชื่อ"
 pilgrimage.2050.b.failure.desc:0 "ผู้แสวงบุญไม่เชื่อ แต่ท่านช่วยพวกเขาขึ้นฝั่ง"
 pilgrimage.2050.c:0 "ไปกันเถอะ..."

 ###BP1 Events
 #Sneaking off to a tavern with your pal
 pilgrimage.6001.t:0 "ยิ่งมากยิ่งสนุก"
 pilgrimage.6001.desc:1 "ข้ากำลังเดินอย่างเหนื่อยหน่ายในขบวนแห่อันยาวเหยียดนี้ไปยัง [ROOT.Char.GetTravelPlan.GetData.GetNextDestination.GetProvince.GetNameNoTooltip] และนึกถึงความสะดวกสบายที่ข้าทิ้งไว้เบื้องหลังใน [ROOT.Char.GetCapitalLocation.GetTitle.GetNameNoTierNoTooltip] เมื่อข้าได้ยินชื่อของข้าถูกตะโกนมาจากด้านหลัง\n\nสหายของข้า [friend.GetFirstNameNoTooltip] วิ่งมาหาข้าและอุทานว่า "[ROOT.Char.GetTitledFirstNameNoTooltip]! โชคดีอะไร เช่นนี้ที่เราเดินทางไปยังสถานที่ศักดิ์สิทธิ์แห่งเดียวกัน! ท่านต้องการเพื่อนร่วมทางบนเส้นทางอันยาวไกลและเปล่าเปลี่ยวนี้ไปยัง [ROOT.Char.GetTravelPlan.GetData.GetNextDestination.GetProvince.GetNameNoTooltip] หรือไม่?""
 pilgrimage.6001.a:0 "หูของข้าเปิดรับสหายเสมอ"
 pilgrimage.6001.b:0 "ข้าคิดว่าข้าอยากอยู่คนเดียวมากกว่า ขอบคุณ"
 pilgrimage.6001.c:0 "น่าละอายใจนัก เรามาที่นี่เพื่อมุ่งเน้นไปที่ศรัทธาของเรา!"
 #Tavern, Suggestion
 pilgrimage.6002.desc:0 "[friend.GetFirstNameNoTooltip|U] และข้าใช้เวลาที่เหลือของการเดินทางในวันนั้นพูดคุยเรื่องนั้นเรื่องนี้ เรื่องเล่ห์เหลี่ยมและเรื่องตลก การต่อสู้และคนรัก เพื่อนเก่าและเพื่อนใหม่ เรากำลังอยู่ท่ามกลางการสนทนาที่น่าตื่นเต้นเมื่อเสียงตะโกนที่เหนื่อยล้าดังมาจากหัวขบวน: "เราตั้งค่ายที่นี่!"\n\n[friend.GetFirstNameNoTooltip|U] มองมาที่ข้าพร้อมรอยยิ้มเจ้าเล่ห์บนใบหน้าของ [friend.GetHerHis] และพูดว่า "ในที่สุด! แต่ว่า แวะไปที่อื่นสักครู่ก่อนตั้งค่ายเป็นอย่างไร? การเดินทางที่ยาวนานทั้งวันสามารถ ทำให้ [friend.GetWomanMan] กระหายน้ำได้...""
 pilgrimage.6002.a:0 "เครื่องดื่มฟังดูศักดิ์สิทธิ์!"
 pilgrimage.6002.a_tt:0 "เยี่ยมชมโรงเตี๊ยมท้องถิ่น"
 pilgrimage.6002.b:1 "ท่านไปก่อนเถอะ..."
 pilgrimage.6002.b_tt:0 "ท่านเดินทางต่อไป"
 pilgrimage.6002.c:1 "[ROOT.Char.Custom('GetHeathenMiscreant')] ใดกันจะไปเยือนโรงเตี๊ยมระหว่างการจาริกแสวงบุญ?"
 #Tavern, beginning
 pilgrimage.6003.desc:0 "เราเดินทางเข้าไปในโรงเตี๊ยมที่แออัดและ [friend.GetFirstNameNoTooltip] สั่ง [ROOT.Char.Custom('RegionalDrink')] ให้เราสองแก้วทันที เรานั่งฟังนิทานของนักดนตรีและเพลิดเพลินกับเครื่องดื่มของเรา พูดคุยกันเป็นระยะๆ เกี่ยวกับความทุกข์และความสำเร็จของชีวิต\n\nโดย [ROOT.Char.GetFaith.HighGodName] นี่ช่างสดชื่นหลังจากวันที่ยาวนานของการเสียเหงื่อและทำงานหนักบนท้องถนน ข้ายกแก้วขึ้นและตะโกนว่า: "ดื่มอวยพรให้สุขภาพของสหายข้า [friend.GetFirstNamePossessiveNoTooltip] ที่แนะนำการพักผ่อนอันยอดเยี่ยม เช่นนี้หลังจากการเดินทางของวันนี้!"\n\nโรงเตี๊ยมยกแก้วขึ้นเพื่อเฉลิมฉลองสหายที่ดีของข้าและทุกคนดื่มอย่างเต็มที่"
 pilgrimage.6003.a:0 ""รอบต่อไปข้าเลี้ยงเอง!""
 pilgrimage.6003.a_tt:0 "สนุกสนานต่อไปกับ [friend.GetShortUIName]"
 pilgrimage.6003.b:0 "เราควรกลับไปที่ค่าย เกรงว่าจะมีคนคิดถึงเรา"
 pilgrimage.6003.b.tt:1 "ท่านและ [friend.GetFirstNameNoTooltip] ยุติค่ำคืนและมุ่งหน้ากลับไปที่ค่าย"
 #Tavern, crash
 pilgrimage.6004.desc:0 "หลังจากดื่ม [ROOT.Char.Custom('RegionalDrink')] ไปหลายรอบเกินไป [friend.GetFirstNameNoTooltip] และข้าก็สร้างแรงบันดาลใจให้เพื่อนร่วมโรงเตี๊ยมของเราร้องเพลงดื่มพร้อมกันขณะที่เราเคาะจังหวะบนโต๊ะ\n\nด้วยเสียง #EMP โครม#! และเศษไม้มากกว่าที่ข้าอยากจะนับ เราก็ร่วงทะลุพื้นลงไปในห้องเก็บไวน์ ผจญภัยอย่างกล้าหาญไปยังที่ที่ [ROOT.Char.GetWomenMen] น้อยคนเคยไปมาก่อน\n\nเพื่อนร่วมสนุกของเราทุกคนจ้องมองลงมาที่เราจากชั้นหลักด้วยอารมณ์ที่หลากหลายทั้งความกังวลและความสะใจ พวกเขาเห็นได้ชัดว่ากำลังรอรายงานจากห้องเก็บไวน์"
 pilgrimage.6004.a:0 ""[ROOT.Char.Custom('RegionalDrink')|U] สำหรับทุกคน!""
 pilgrimage.6004.a.tt:1 "ท่านเปิดถังที่เพิ่งค้นพบและแบ่งปันของที่ได้มากับฝูงชน"
 pilgrimage.6004.b:0 ""ข้าเชื่อว่าเราอยู่เกินเวลาที่ควรแล้ว...""
 #Returning to camp
 pilgrimage.6005.desc:0 "เราเดินทางกลับค่ายอย่างไม่เงียบนัก สวดอ้อนวอนอย่างจริงจังว่าทุกคนคงเข้านอนไปนานแล้ว เมื่อมาถึงกระโจมของเรา เราเห็นไฟยังคงลุกโชนอยู่ "
 pilgrimage.6005.desc.bad:1 "และสมาชิกทุกคนในขบวนแสวงบุญของเราหันมาจ้องมองเรา\n\nเราแทบจะไม่สามารถควบคุมตัวเองได้ เนื่องจากปริมาณ [ROOT.Char.Custom('RegionalDrink')] จำนวนมากในท้องของเรา\n\nขณะที่เราเล่าเรื่องการผจญภัยในตอนเย็นของเราให้ใครก็ตามที่ยอมฟัง สมาชิกที่เคร่งศาสนาเป็นพิเศษคนหนึ่งในค่ายแสวงบุญมองข้าอย่างเข้มงวดและยืนกรานว่าเราต้องจ่ายค่าเสียหายที่โรงเตี๊ยมใกล้เคียง"
 pilgrimage.6005.desc.good:1 "แต่ไม่มีสิ่งใดเคลื่อนไหวเลย\n\nดูเหมือนว่าไฟกองจะถูกเติมเชื้อเพลิงก่อนนอนเพื่อไล่ความหนาวเย็นออกจากเตียงของเรา"
 pilgrimage.6005.a:0 "ช่างเป็นเพื่อนร่วมเดินทางที่ใจดีและมีน้ำใจอะไร เช่นนี้!"
 pilgrimage.6005.b:0 ""เราควรจ่ายค่าความโชคร้ายของเรา!""
 pilgrimage.6005.c:0 ""การมีความสุขเป็นอาชญากรรมหรือ?""
 #You find out your friend is a Non-Believer
 pilgrimage.6006.desc:0 "[friend.GetFirstName] และข้าใกล้จะสิ้นสุดการเดินทางของวันนี้แล้ว เรากำลังค่อยๆ เดินทางไปยังจุดหยุดพักที่กำหนดไว้ ทันใดนั้นมีคนข้างหน้าตะโกนว่า "ดูสิ! ช่างเป็นพระอาทิตย์ตกที่ #EMP งดงาม#! อะไร เช่นนี้!"\n\nทุกคนพุ่งไปข้างหน้าด้วยเรี่ยวแรงสุดท้ายเพื่อชมภาพอันงดงาม "ช่างเป็นสิ่งมหัศจรรย์ที่เราได้รับสิทธิพิเศษให้เห็นในชีวิตนี้! นี่เป็นเวลาที่สมบูรณ์แบบที่จะใคร่ครวญถึงศรัทธาของเรา" ข้าพูดกับ [friend.GetFirstNameNoTooltip] แต่ [friend.GetSheHe] ดูเหมือนจะไม่ประทับใจเลย ปล่อยเสียงเยาะเย้ยที่รุนแรงออกมาจากริมฝีปากของ [friend.GetHerHis]\n\n"มันก็แค่พระอาทิตย์ตก!" [friend.GetSheHe] ตะโกน "ทุกสิ่งที่เราทำในการเดินทางครั้งนี้ต้องเกี่ยวข้องกับ [ROOT.Char.GetFaith.HighGodName] หรือ? ข้าแค่อยากเดินทางและเห็นโลก — ข้าไม่แน่ใจด้วยซ้ำว่า [ROOT.Char.GetFaith.HighGodName] มีอยู่จริง #EMP หรือไม่!#!""
 pilgrimage.6006.a:0 ""ความลับของเจ้าปลอดภัยกับข้า สหาย""
 pilgrimage.6006.b:0 ""ข้าจะไม่ทนกับสหายที่ไม่เชื่อ""
 pilgrimage.6006.c:0 ""เจ้าพูดมีเหตุผล...""
 #You and a friend are on a pilgrimage and your friend is healed in a miracle performed by a wandering priest
 pilgrimage.6007.t:0 "ดำรงอยู่ด้วยคำอธิษฐาน"
 pilgrimage.6007.desc:1 "[ROOT.Char.Custom2('RelationToMe' , SCOPE.sC('friend'))] ของข้า [friend.GetFirstName] ซึ่งทนทุกข์ทรมานจากความเจ็บป่วยของ [friend.GetHerHis] พยายามดิ้นรน เพื่อให้ทันกับเราในการจาริกแสวงบุญ ดังนั้น ข้าจึงเดินเคียงข้าง [friend.GetHerHim] และอยู่เป็นเพื่อน [friend.GetHerHim] [ROOT.Char.GetFaith.PriestNeuter] พเนจรคนหนึ่งเดินทางกับเรามาระยะหนึ่งแล้วและสังเกตเห็นความยากลำบากของ [friend.GetFirstNamePossessiveNoTooltip]\n\n"เจ้าผู้น่าสงสาร ลูกของ [ROOT.Char.GetFaith.HighGodName] ไม่ควรลำบาก เช่นนี้ระหว่างทางไปยัง [ROOT.Char.GetTravelPlan.GetData.GetNextDestination.GetProvince.GetNameNoTooltip]" เขากล่าว "บางที [ROOT.Char.GetFaith.HealthGodName] อาจประทานพลังให้ข้ารักษาความเจ็บป่วยของเจ้าได้ เจ้าจะอนุญาตให้ข้าลองหรือไม่?"\n\n[ROOT.Char.Custom2('RelationToMe' , SCOPE.sC('friend'))] ของข้าหันมาหาข้า ขอคำแนะนำจากข้า "เจ้าคิดว่าอย่างไร [ROOT.Char.GetFirstName]?""
 pilgrimage.6007.a:0 "[ROOT.Char.GetFaith.HighGodName] ทรงเฝ้าดูเราอย่างแท้จริง"
 pilgrimage.6007.a.success:0 "[friend.GetFirstNameNoTooltip] ได้รับการรักษา"
 pilgrimage.6007.a.failure:0 "อาการของ [friend.GetFirstNamePossessiveNoTooltip] แย่ลง"
 pilgrimage.6007.b:0 "[6007_healer.GetWomanMan] ผู้นี้ไม่คู่ควรแก่ความไว้วางใจของเรา"
 
 ###'Temptation/Virtue' Journey Events
 #Rakish or Lustful character considers making a pit stop, or perhaps, a detour to the local brothels
 pilgrimage.2101.t:0 "$pilgrimage_header$ ความปรารถนาในความใกล้ชิด"
 pilgrimage.2101.desc:1 "นานแค่ไหนแล้วที่ข้าไม่ได้สัมผัสความอบอุ่นของผู้อื่นแนบชิดผิวกาย? การจาริกแสวงบุญครั้งนี้นำพาข้ามาไกลจากบ้าน เช่นเดียวกับความสะดวกสบายของข้า\n\nโอ้ ข้าปรารถนาความต้องการทางเนื้อหนังเพียงใด จินตนาการเหล่านี้ไม่หยุดท่วมท้นในใจข้า และข้ารู้สึกถูกล่อลวงให้ยอมจำนนต่อความปรารถนาของข้า เพื่อที่ข้าจะได้มีสมาธิ"
 pilgrimage.2101.desc.lust_vice:0 "\n\n[ROOT.Char.GetFaith.HighGodName] ข้ารู้ว่าความรู้สึกนี้เป็นบาป! เหตุใดพระองค์จึงทดสอบข้าอย่างรุนแรง เช่นนี้? การจาริกแสวงบุญของข้าไม่เพียงพอที่จะพิสูจน์ความทุ่มเทของข้าหรือ?"
 pilgrimage.2101.desc.lust_virtue:0 "\n\nแน่นอนว่านี่ต้องเป็นส่วนหนึ่งของการทดลองของ [ROOT.Char.GetFaith.HighGodNamePossessive]! ข้าจะยังคงรักษาคุณธรรมไว้ได้หรือไม่โดยไม่ตกเป็นเหยื่อของศัตรูที่เป็นไปได้ของศรัทธาขณะจาริกแสวงบุญ?"
 pilgrimage.2101.desc.lust_neutral:0 "ความรู้สึกจู้จี้นี้เป็นความรำคาญที่ข้าต้องกำจัดให้หมดไป! แต่แน่นอนว่ามันไม่ใช่ปราศจากความเสี่ยง เหล่านี้เป็นดินแดนที่แตกต่างจากบ้านของข้า และข้าอาจถูกเอาเปรียบในช่วงเวลาแห่งความอ่อนแอนี้"
 pilgrimage.2101.a:0 "เพียงคืนเดียวแห่งความสบาย..."
 pilgrimage.2101.b:0 "ทำไมต้องจำกัดตัวเองอยู่แค่ซ่องเดียว? ไปเยี่ยมให้มากที่สุดเท่าที่จะทำได้!"
 pilgrimage.2101.c:0 "ข้าต้องเข้มแข็งและมุ่งเน้นไปที่การจาริกแสวงบุญของข้า!"
 #Persistent Beggar
 pilgrimage.2501.t:0 "$pilgrimage_header$ ขอทานผู้น่าสงสาร"
 pilgrimage.2501.desc.opening:1 "ขณะที่ขบวนของข้าเดินทางผ่านเมืองเล็กๆ ข้ารู้สึกถึงแรงดึงที่ชายเสื้อผ้า เมื่อหันไปมอง ข้าเห็น [beggar.GetWomanMan] ผอมโซ แต่งกายซอมซ่อ จ้องมองมาที่ข้า\n\n"โอ้ ท่าน [ROOT.Char.GetLadyLord] ผู้ยิ่งใหญ่ ข้าขอร้องท่าน โปรดเมตตาเหรียญให้ขอทานผู้น่าสงสารคนนี้ได้หรือไม่? ข้ากำลังหิวโหย และไม่มีชาวบ้านคนใดช่วยเหลือข้าเลย""
 pilgrimage.2501.desc.virtue.generous:0 "\n\nแม้ว่าความเอื้อเฟื้อเผื่อแผ่จะไม่ใช่นิสัยของข้า แต่การจาริกแสวงบุญเตือนข้าว่าการกุศลเป็นสิ่งที่คาดหวังจาก [ROOT.Char.GetFaith.GetAdherentNamePluralNoTooltip] ผู้ศรัทธาทุกคน..."
 pilgrimage.2501.desc.virtue.compassionate:0 "\n\nแม้ว่าข้าจะไม่แยแสต่อชะตากรรมของ [beggar.GetHerHis] แต่การจาริกแสวงบุญเตือนข้าว่าความเมตตาต่อผู้ด้อยโอกาสเป็นสิ่งที่คาดหวังจาก [ROOT.Char.GetFaith.GetAdherentNamePluralNoTooltip] ผู้ศรัทธาทุกคน..."
 pilgrimage.2501.desc.sin.generous:0 "\n\nแม้ว่าผู้เคราะห์ร้ายผู้นั้นจะดูน่าเวทนาเพียงใด ข้าก็ระลึกได้ว่า [ROOT.Char.GetFaith.PantheonTerm] ถือว่าการกุศลเป็น [ROOT.Char.Custom('GetSinMisdeed')] ร้ายแรง..."
 pilgrimage.2501.a.virtue:0 "ในพระนามของ [ROOT.Char.GetFaith.HighGodNamePossessive] ข้าเดาว่าเจ้าเอาเหรียญเหล่านี้ไปได้..."
 pilgrimage.2501.a.sin:0 "ข้าไม่สามารถปฏิเสธได้!"
 pilgrimage.2501.b:0 "บา! ไปหางานจริงๆ ทำ หาเลี้ยงชีพซะ!"
 pilgrimage.2501.c.arrogant:0 "เจ้ากล้าแตะต้องเสื้อผ้าของข้าหรือ ชาวบ้าน!?"
 #Beggar wants another favor for their sister
 pilgrimage.2502.t:0 "$pilgrimage.2501.t$"
 pilgrimage.2502.desc.gave:0 ""ใช่! ใช่ ขอบคุณท่าน [ROOT.Char.Custom('LadyLordWomanMan')] ขอบคุณ... [ROOT.Char.GetFaith.HighGodName] ใช่ไหม? ขอบคุณพวกเขาด้วย! แต่ โอ้ ท่าน [ROOT.Char.Custom('LadyLordWomanMan')] ผู้ใจบุญ หากข้าจะขอความกรุณาอีกอย่างได้หรือไม่?"
 pilgrimage.2502.desc.refused:0 ""ไม่! ไม่ ท่าน [ROOT.Char.Custom('LadyLordWomanMan')] ของข้า โปรดเมตตาด้วย!"
 pilgrimage.2502.desc.end:0 "น้องสาวของข้าป่วย และต้องการยาอย่างยิ่ง! เงินของท่านสามารถช่วยชีวิตนางได้ โปรดเถิด! เราจะขอบคุณท่านอย่างที่สุด!""
 pilgrimage.2502.a:0 "เอ่อ... ใช่ โอเค สำหรับยา"
 pilgrimage.2502.b:0 "ไม่ ข้าทำไม่ได้! มันไม่ #EMP ถูกต้อง#!!"
 pilgrimage.2502.c.gave:0 "ไม่ ข้าทำหน้าที่ของข้าแล้ว!"
 pilgrimage.2502.c.refused:0 "ข้าบอกว่า #EMP ไม่#!! ทีนี้ไปให้พ้น!"
 #Beggar wants favor for sisters children
 pilgrimage.2503.t:0 "$pilgrimage.2501.t$"
 pilgrimage.2503.desc:0 ""ยอดเยี่ยม! ขอให้นางหายจากอาการป่วยในเร็ววัน แต่ถ้าข้าจะขอความกรุณาอีกอย่างเดียวได้หรือไม่? น้องสาวของข้า นางมีลูก และก็อย่างที่ท่านรู้ เด็กๆ น่ะ พวกเขากินจุมาก! หากท่านจะจัดหาอาหารให้พวกเขาด้วย...?""
 pilgrimage.2503.a:0 "ก็ได้ ใช่ ไม่มีเด็กคนไหนควรหิวโหย"
 pilgrimage.2503.b:0 "ข้าคิดว่าข้าให้เพียงพอแล้ว"
 #Happy beggar
 pilgrimage.2504.t:0 "$pilgrimage.2501.t$"
 pilgrimage.2504.desc:0 "ขอบคุณท่าน [ROOT.Char.Custom('LadyLordWomanMan')] ของข้าอย่างมากมาย! ข้าขอบคุณชั่วนิรันดร์ เพราะข้าเป็นหนี้ท่านในสิ่งที่ข้าไม่สามารถชดใช้ได้!\n\nความเอื้อเฟื้อของ [ROOT.Char.GetFaith.HighGodNamePossessive] นั้นยิ่งใหญ่แท้จริง ข้าจะสรรเสริญพระนามของ [ROOT.Char.GetFaith.HighGodHerHis] จนสิ้นอายุขัย!"
 pilgrimage.2504.a:0 "เจ้าลืมไป ข้าให้สิ่งเหล่านี้ด้วย"
 pilgrimage.2504.a.flavor:0 "เจ้าจะทิ้งสิ่งที่ดีที่สุดไว้เบื้องหลังหรือ?"
 pilgrimage.2504.b:0 "เป็นหนี้ข้า เจ้าว่าอย่างนั้นหรือ? หืม..."
 pilgrimage.2504.c.virtue:0 "ยินดีเสมอ ตอนนี้ไปเถิด ด้วยพรของ [ROOT.Char.GetFaith.HighGodNamePossessive]"
 pilgrimage.2504.c.sin:0 "ใช่ ใช่ ได้โปรด... ไปเถอะ"
 #Cocky Lordling
 pilgrimage.2511.t:0 "$pilgrimage_header$ ลอร์ดน้อยจองหอง"
 pilgrimage.2511.desc.start:1 "[ROOT.Char.GetTravelPlan.GetData.GetNextDestination.GetProvince.GetNameNoTooltip] ดึงดูดผู้แสวงบุญจากทั่วโลก [ROOT.Char.GetFaith.GetAdjectiveNoTooltip] ดังนั้นจึงไม่ใช่เรื่องแปลกที่ข้าจะได้พบกับ [lordling.Custom2('MyCharacterIntroduction', ROOT.Char)] ในการเดินทางของข้า\n\nสิ่งที่ #EMP แปลก#! คือท่าทีอวดดีที่ [lordling.GetSheHe] ปฏิบัติต่อข้า โดยการขี่ม้าของ [lordling.GetHerHis] ตัดหน้าขบวนของข้าและเรียกข้าว่า [ROOT.Char.Custom2('InsultNoun', SCOPE.sC('lordling'))]... #EMP ต่อหน้าข้า#! ทีเดียว!"
 pilgrimage.2511.desc.wrathful:0 "\n\nเลือดของข้าเดือดพล่าน บรรเทาลงได้เพียงด้วยความรู้ที่ว่า [ROOT.Char.GetFaith.PriestNeuterPlural] บอกให้เราใช้ความยับยั้งชั่งใจและไม่ปล่อยให้อารมณ์เข้าควบคุม"
 pilgrimage.2511.desc.vengeful:0 "\n\nเป็นช่วงเวลา เช่นนี้ที่ข้าได้รับการเตือนว่า [ROOT.Char.GetFaith.PantheonTerm] บัญชาให้เราให้อภัยผู้ที่ทำผิดต่อเรา"
 pilgrimage.2511.desc.vengeful.christian:0 "\n\nเป็นช่วงเวลา เช่นนี้ที่ข้าได้รับการเตือนว่าพระเยซูทรงบัญชาให้เราหันแก้มอีกข้างให้..."
 pilgrimage.2511.a:0 "ให้ตายสิ ข้าจะสอนบทเรียนให้เจ้าเด็กนั่น!"
 pilgrimage.2511.b:0 "หายใจเข้า... หายใจออก..."
 pilgrimage.2511.c:0 "มัน #EMP ต้อง#! มีวิธีที่ดีกว่าในการจัดการกับความโกรธนี้"

 ###Christian Pilgrimage Journey Events
 #Zealous priest giving sermon in freezing rains
 pilgrimage.3001.t:0 "$pilgrimage_header$ น้ำตาแห่ง [ROOT.Char.GetFaith.WaterGodName]"
 pilgrimage.3001.desc:0 "แม้จะอยู่ระหว่างการจาริกแสวงบุญ นักบวชก็ยังคงประกอบพิธีมิสซาทุกวันอาทิตย์ พิธีจัดขึ้นในที่โล่งเมื่อไม่มีโบสถ์อยู่ใกล้ๆ แต่เช้าตรู่วันนี้ พายุพัดเข้ามาและยังไม่หยุด\n\n[ROOT.Char.Custom('DefaultPriestTitle')] ผู้เคร่งศาสนาคนหนึ่งยืนอยู่ท่ามกลางสายฝนที่เทกระหน่ำอย่างไม่ย่อท้อ กำลังเทศนาเกี่ยวกับความเพียรพยายามเมื่อเผชิญกับความทุกข์ยาก อย่างไรก็ตาม ขนาดของผู้ฟังของ [zealous_priest.GetHerHis] กำลังลดลงอย่างรวดเร็ว เนื่องจากผู้ศรัทธาที่ท้อแท้แสวงหาที่หลบภัยจากฝนที่ตกหนัก"
 pilgrimage.3001.a:0 "ฝนเล็กน้อยมีความหมายอะไรต่อ [ROOT.Char.GetFaith.GetAdherentNameNoTooltip] ผู้ศรัทธา?"
 pilgrimage.3001.a.tt:0 "$pilgrimage.2008.a.tt$"
 pilgrimage.3001.b:0 "ลืมความบ้าคลั่งนี้ไปเสีย ข้าจะอยู่ในกระโจมของข้า"
 #Naked preacher claiming to have reclaimed the lost innocence of Adam & Eve
 pilgrimage.3002.t:0 "$pilgrimage_header$ ความบริสุทธิ์ของอาดัม"
 pilgrimage.3002.desc:0 "ขณะที่คณะของข้าเตรียมเก็บค่าย ข้าสังเกตเห็นความโกลาหลครั้งใหญ่ในบริเวณใกล้เคียง — [naked_preacher.GetWomanMan] เปลือยกายคนหนึ่งปีนขึ้นไปบนก้อนหินใหญ่และกำลังเทศนาต่อฝูงชนที่รวมตัวกัน\n\n"บาปกำเนิดยังคงเปื้อนจิตวิญญาณของเราเพื่อนเอ๋ย แต่นั่นไม่จำเป็นต้องเป็น เช่นนั้น! หากเราสลัดเสื้อผ้าของเราออก เราจะสามารถฟื้นคืนความบริสุทธิ์ที่สูญหายไปของอาดัมและเอวาได้หรือไม่... จากนั้น และ #EMP เพียง#! เท่านั้น พระวิญญาณบริสุทธิ์จะทรงเห็นสมควรที่จะสัมผัสเราและแสดงให้เราเห็นถึงความรักที่แท้จริงของพระเจ้า!""
 pilgrimage.3002.a:0 "[naked_preacher.GetSheHe|U] มีความคิดที่ถูกต้อง! ข้าไม่เคยรู้สึกใกล้ชิดกับ [ROOT.Char.GetFaith.HighGodName] เท่านี้มาก่อน!"
 pilgrimage.3002.b:0 "คนนอกรีต! เอา [naked_preacher.GetHerHim] ลงมาจากที่นั่น!"
 pilgrimage.3002.c:0 "ท้าทาย [naked_preacher.GetHerHim] ในการโต้แย้งทางเทววิทยา"
 pilgrimage.3002.c.success:0 "ท่านโน้มน้าวให้นักเทศน์เห็นถึงความโง่เขลาของ [naked_preacher.GetHerHis]"
 pilgrimage.3002.c.success.tt:0 "ท่านตัดสินใจว่าจะเกิดอะไรขึ้นต่อไป"
 pilgrimage.3002.c.failure:0 "ท่านไม่สามารถโต้แย้งข้อโต้แย้งของนักเทศน์ได้"
 pilgrimage.3002.d:0 "เพิกเฉยต่อ [naked_preacher.GetHerHim] และเดินทางต่อไป"
 #You convinced the naked preacher
 pilgrimage.3003.t:1 "$pilgrimage_header$ ความผิดของอาดัม"
 pilgrimage.3003.desc:1 "หลังจากพ่ายแพ้ในการโต้แย้งทางเทววิทยา [naked_preacher.GetWomanMan] ได้ปีนลงมาจากก้อนหินและตอนนี้ยืนอยู่ตรงหน้าข้า ตกตะลึงกับสถานการณ์\n\n"... ข้าเชื่อจริงๆ ว่ากุญแจสำคัญอยู่ที่เสื้อผ้า" [naked_preacher.GetSheHe] กระซิบอย่างเศร้าสร้อย "แต่มุมมองของท่านช่างให้ความกระจ่างอย่างแท้จริง"\n\n[naked_preacher.GetSheHe|U] กระพริบตา นึกถึงฝูงชนและความเปลือยเปล่าของ [naked_preacher.GetHerHis] ขึ้นมาทันที แต่ยังคงรักษาท่าทีที่กล้าหาญ: "อย่างไรก็ตาม ข้าควรจะก้าวหน้าต่อไปอย่างไร..."
 pilgrimage.3003.a:1 "ท่านสามารถสวมสิ่งเหล่านี้และเข้าร่วมกับเราไปยัง [ROOT.Char.GetTravelPlan.GetData.GetNextDestination.GetProvince.GetNameNoTooltip]"
 pilgrimage.3003.a.flavor:1 "ท่านยื่นเสื้อผ้าให้ [naked_preacher.GetWomanMan] ที่เปลือยเปล่า"
 pilgrimage.3003.b:1 "จงไปและเผยแพร่พระวจนะที่ #EMP ถูกต้อง#!"
 #Doomsayer claiming the end is nigh!
 pilgrimage.3004.t:0 "$pilgrimage_header$ จุดจบใกล้เข้ามาแล้ว"
 pilgrimage.3004.desc:0 "ขณะที่คณะของข้าผ่านเมืองเล็กๆ ข้าสังเกตเห็นฝูงชนจำนวนมากเต็มจัตุรัสตลาด ที่ศูนย์กลาง [doomsayer.GetWomanMan] คนหนึ่งยืนอยู่บนรถเข็นปลาที่คว่ำ ตะโกนอย่างบ้าคลั่งให้ทุกคนที่ยอมฟัง\n\n"วันพิพากษาใกล้เข้ามาแล้ว! สำนึกผิด! สำนึกผิด ข้าขอบอก หรือเจ้าจะถูกสาปแช่งชั่วนิรันดร์!\n\nชาวเมืองที่ดูกังวลกระซิบกันอย่างประหม่า กลัวคำพูดของผู้ทำนายวันสิ้นโลก"
 pilgrimage.3004.a:0 ""แต่วันและเวลานั้นไม่มีใครรู้!""
 pilgrimage.3004.a.flavor:0 "พระคัมภีร์ชัดเจน ไม่มีมนุษย์คนใดรู้ว่าวันนั้นจะเป็นเมื่อใด!"
 pilgrimage.3004.b:0 "ข้าดีใจจริงๆ ที่การจาริกแสวงบุญครั้งนี้มาพร้อมกับใบไถ่บาป!"
 pilgrimage.3004.c:0 "[doomsayer.GetWomanMan] ผู้นั้น #EMP ไม่ใช่#! นักบวช! โยน [doomsayer.GetHerHim] ลงไป!"

 ###Muslim Pilgrimage Journey Events
 #Ziyarat - Why am I taking this pilgrimage?
 pilgrimage.3102.t:0 "$pilgrimage_header$ ซิยาเราะห์"
 pilgrimage.3102.desc:1 "แม้ว่าฮัจญ์จะเป็นข้อบังคับสำหรับชาวมุสลิมทุกคน แต่การจาริกแสวงบุญไปยังสถานที่อื่นนั้นพบได้น้อยกว่ามาก เนื่องจากการซิยาเราะห์เหล่านี้ไม่จำเป็นตามหลักคำสอนของศาสนาอิสลาม ชาวมุสลิมที่เลือกที่จะดำเนินการดังกล่าวจึงอาจมีแรงจูงใจที่หลากหลายในการทำ เช่นนั้น\n\nขณะที่เราเดินทางไปตามถนนสู่ [ROOT.Char.GetTravelPlan.GetData.GetNextDestination.GetProvince.GetNameNoTooltip] ข้าพบว่าตัวเองกำลังคิดถึงสิ่งที่ ทำให้ข้าต้องการเดินทางครั้งนี้โดยเฉพาะ..."
 pilgrimage.3102.a:0 "ข้าต้องการเห็นการสร้างสรรค์อันรุ่งโรจน์ทั้งหมดของอัลลอฮ์"
 pilgrimage.3102.b:0 "ความกระตือรือร้นของข้าเผาไหม้ร้อนแรงจนข้าปรารถนาที่จะทำมากกว่าแค่ฮัจญ์"
 pilgrimage.3102.c:0 "ความสงสัยที่ข้ามีอยู่กระตุ้นให้ข้ามองหาคำตอบในดินแดนอันห่างไกล"

 ###Hindu Pilgrimage Journey Events
 #Ritual purification in a river
 pilgrimage.3201.t:0 "$pilgrimage_header$ การชำระล้างตามพิธีกรรม"
 pilgrimage.3201.desc:0 "การชำระล้างตามพิธีกรรมเป็นส่วนสำคัญของการเดินทางของผู้แสวงบุญชาวฮินดูทุกคน รูปแบบทั่วไปของสิ่งนี้คือการชำระล้างตนเองในน่านน้ำของทางข้ามแม่น้ำศักดิ์สิทธิ์\n\nมีทางข้ามดังกล่าวอยู่ข้างหน้า แต่ข้าอดไม่ได้ที่จะสังเกตเห็นว่ามัน #EMP เต็ม#! ไปด้วยสามัญชนที่มาจาริกแสวงบุญ เช่นกัน..."
 pilgrimage.3201.a:0 "เข้าร่วมกับผู้ศรัทธาคนอื่นๆ ในน่านน้ำศักดิ์สิทธิ์"
 pilgrimage.3201.b:0 "ข้าจะไม่ อาบน้ำ กับ #EMP ชาวบ้าน#!!"
 #Contemplating the universe
 pilgrimage.3202.t:0 "$pilgrimage_header$ ความศักดิ์สิทธิ์ของป่า"
 pilgrimage.3202.desc.hinduism:0 "ในขณะที่เจ็ดนครศักดิ์สิทธิ์เป็นสถานที่ศักดิ์สิทธิ์ที่สุด แต่ถิ่นทุรกันดารเองก็มีความศักดิ์สิทธิ์ในแบบของตัวเอง "
 pilgrimage.3202.desc.buddhism:0 "พระโคตมพุทธเจ้าทรงสอนเราว่าทุกชีวิตศักดิ์สิทธิ์ ในขณะที่สิ่งมีชีวิตที่มีความรู้สึกเป็นรูปแบบสูงสุดของชีวิต แม้ แต่ใบหญ้าที่เล็กที่สุดก็ยังสมควรได้รับความเคารพ"
 pilgrimage.3202.desc.jainism:0 "อหิงสา หรือการไม่ใช้ความรุนแรง เป็นหนึ่งในหลักธรรมสำคัญของศาสนาเชน แม้ แต่ความรุนแรงต่อพืชก็เป็นสิ่งต้องห้าม ยกเว้นขั้นต่ำที่จำเป็นต่อการดำรงชีวิต"
 pilgrimage.3202.desc.nature:0 "ความเย่อหยิ่งของมนุษย์ ทำให้หลายคนเชื่อว่าตนอยู่เหนือธรรมชาติ แต่พวกเขาคิดผิด โลกธรรมชาติมีอยู่ในสภาวะที่เป็นจริงและบริสุทธิ์ที่สุด"
 pilgrimage.3202.desc.end:0 "\n\nขณะที่เราผ่านทุ่งโล่งในป่าที่เรียบง่าย มัน ทำให้ข้าตระหนักว่ามันเงียบสงบและเงียบงันเพียงใด ไม่มีการต่อสู้ ไม่มีความขัดแย้ง... มีเพียงความสงบสุขที่เรียบง่าย ซึ่งต้นไม้และพุ่มไม้ได้รับ"
 pilgrimage.3202.a:0 "ให้เราใช้เวลาที่นี่ และใคร่ครวญถึงจักรวาล"
 pilgrimage.3202.a.tt:1 "[THIS.Char.GetInvolvedActivity.GetName] ของท่านจะ #N ล่าช้าไปหลายเดือน#!"
 pilgrimage.3202.b:0 "รีบเข้า ให้เราไปต่อกันเถอะ!"
 pilgrimage.3202.b.tt:0 "ท่านจะไปถึงจุดหมายปลายทาง #P เร็วขึ้นหลายสัปดาห์#!"

 ###Buddhist Pilgrimage Journey Events
 #Critical Wanderer
 pilgrimage.3301.t:0 "$pilgrimage_header$ ภิกษุผู้ช่างวิจารณ์"
 pilgrimage.3301.desc:0 "ตามเส้นทางของผู้แสวงบุญ ข้าเห็นนักพรตพเนจรมากมาย ผู้ที่ละทิ้งโลกและปลดปล่อยตนเองจากพันธนาการทางโลกทั้งหมด\n\nวันนี้ นักพรตพเนจรสูงวัยคนหนึ่งมองดูขบวนของข้าขณะที่ [wanderer.GetSheHe] เดินเคียงข้างข้า "ท่านนำสิ่งของมามากเกินไป เพื่อบรรลุนิพพาน ท่านต้องละทิ้งสมบัติทางโลกของท่าน เช่นข้า และเดินทางด้วยจีวรเรียบง่ายเท่านั้น""
 pilgrimage.3301.a:0 "ข้าสามารถจัดการได้ อย่างน้อยก็สำหรับการเดินทางครั้งนี้"
 pilgrimage.3301.b:0 "แต่กระโจมของข้า ผ้าห่มของข้า? มันมากเกินไป ข้ายังไม่พร้อม!"
 pilgrimage.3301.c:0 "อา แต่มันขัดต่อฤตะสำหรับ [ROOT.Char.GetTitleAsNameNoTooltip] ที่จะเดินทางอย่างสมถะ"

#The Wisdom of Goats
 pilgrimage.3302.t: "$pilgrimage_header$ ปัญญาจากแพะ"
 pilgrimage.3302.desc: "เมื่อแรกที่ย่างเข้าสู่ [ROOT.Char.GetCurrentLocation.Custom('GetTerrainTypePlural')] อันป่าเถื่อนแห่ง [ROOT.Char.GetCurrentLocation.GetCounty.GetTitle.GetNameNoTier] ข้าคิดว่าการเดินทางผ่านช่องเขาของเราจะราบรื่นไร้ความเจ็บปวด หลังจากการปีนป่ายอันยากลำบากนานหลายชั่วโมง ข้าก็ตระหนักได้ว่าข้าควรน้อมรับบททดสอบแห่งยาตราของข้า\n\nข้าหยุดเพื่อเช็ดเหงื่อจากหน้าผากและต้องตะลึงกับภาพแพะป่าที่ยืนอยู่บนด้าน [ROOT.Char.GetCurrentLocation.Custom('GetTerrainType')] ที่เกือบจะตั้งฉาก\n\n[mountain_local.GetWomanMan] ท้องถิ่นผู้เหี่ยวย่นหันมาหาข้า\n\n\"แพะละโมบพวกนั้นเพียงแค่ปีนขึ้นไปเลียเกลือเท่านั้น\""
 pilgrimage.3302.a: "พวกมันควรละทิ้งการแสวงหาความพึงพอใจ!"
 pilgrimage.3302.b: "หากเพียง แต่ข้าจะแน่วแน่ในการปีนป่ายของข้าได้ เช่นนี้..."
 pilgrimage.3302.c: "เกลือนั่นควรเป็นของข้า!"
 pilgrimage.3302.c.flavor: "ท่านเก็บเกี่ยวเกลือเพื่อการค้า"

 #Kalama Sutta
 pilgrimage.3303.t: "$pilgrimage_header$ [place_to_teach.GetBaronyNameExplicitlyNoTooltip] สูตร"
 pilgrimage.3303.desc: "เมื่อเดินทางผ่าน [place_to_teach.GetBaronyNameExplicitlyNoTooltip] ชาวบ้านบางคน นำโดย [wisdom_seeker.GetName] เดินเข้ามา ใบหน้าของพวกเขาเต็มไปด้วยความสับสน\n\n“ท่าน [ROOT.Char.GetTitleAsName] ผู้ควรแก่การเคารพ มี [place_to_teach.GetCounty.GetFaith.PriestNeuterPlural] ที่มาเยือน [place_to_teach.GetBaronyNameExplicitlyNoTooltip] พวกเขายกย่องคุณธรรมแห่งหลักคำสอนของตน ในขณะที่ต่อความเชื่อของผู้อื่น พวกเขากลับดูเหมือน [ROOT.Char.Custom('RegionalOnlyFerociousAnimalPlural')] และฉีกทึ้งพวกเขาเป็นชิ้นๆ จากนั้น [place_to_teach.GetCounty.GetFaith.PriestNeuterPlural] คนอื่นๆ ก็จะมาเยือน และในทางกลับกัน พวกเขาก็ดูถูกและเหยียดหยามหลักคำสอนของกลุ่มก่อนหน้า\n\nพวกเราเต็มไปด้วยความไม่แน่นอน ความสงสัยมาเยือนหน้าประตูบ้านเราทุกวัน [place_to_teach.GetCounty.GetFaith.PriestNeuterPlural] ที่น่าเคารพเหล่านั้นคนใดพูดความจริงและคนใดพูดเท็จ?”"
 pilgrimage.3303.a: "อย่าปฏิบัติตามเหตุผลที่ดูเหมือนจะถูกต้อง แต่จงปฏิบัติตามวิถีแห่ง [ROOT.Char.GetFaith.HighGodName]!"
 pilgrimage.3303.b: "ในบรรดาแหล่งน้ำที่ท่านดื่ม แห่งใดที่ให้ความแข็งแกร่งแก่ท่าน?"
 pilgrimage.3303.b.flavor: "[ROOT.Char.GetCurrentLocation.GetBaronyNameExplicitlyNoTooltip] จะค้นพบหนทางแห่งความคิดที่ถูกต้องในไม่ช้า"

### Dharmic Pilgrimage Journey Events
#Brahmacharya Challenged
 pilgrimage.3401.t: "$pilgrimage_header$ พรหมจรรย์ถูกท้าทาย"
 pilgrimage.3401.desc: "ยาตราของเราได้นำเรามาสู่ชายฝั่ง [body_of_water.GetName] ผืนน้ำส่องประกายระยิบระยับดั่งเศษทองคำเปลวในแสงตะวันยามบ่ายแก่ เชื้อเชิญให้เราลงอาบ\n\nสายตาของข้าเหลือบไปเห็นหนึ่งในสหายยาตรี [bather.GetName] ร่างกายเปลือยเปล่าของ [bather.GetHerHis] มีเพียงประกายแสงของผืนน้ำห่มคลุม\n\nขณะอยู่ระหว่าง [ROOT.Char.GetInvolvedActivity.GetShortName] เราควรต้องยึดถือ [Glossary('พรหมจรรย์', 'BRAHMACHARAYA_GLOSS')] ดั่งนักบวช โดยละเว้นจากความคิดและแรงกระตุ้นอันใฝ่ในกาม..."
 pilgrimage.3401.a: "โดยมีตัณหาเป็นเครื่องนำทาง ข้าอาบยลความงามของ [bather.GetFirstNamePossessiveNoTooltip]"
 pilgrimage.3401.b: "ข้าก้าวลงไปในน้ำเย็น ความปรารถนาของข้าดับมอดลง"
 pilgrimage.3401.b.flavor: "เข้าใกล้นิพพานอีกก้าว"
 BRAHMACHARAYA_GLOSS: "ภาษาสันสกฤตหมายถึง 'การมีส่วนร่วมในการปฏิบัติของพรหมัน' หรือการดำเนินชีวิตที่เอื้อต่อการแสวงหาความรู้อันศักดิ์สิทธิ์และการหลุดพ้นทางจิตวิญญาณ สิ่งนี้สำเร็จได้ส่วนหนึ่งโดยการมุ่งมั่นไปสู่สภาวะที่ปราศจากความปรารถนา"
 ###Hajj Arrival Event
 #Entering state of Ihram
 pilgrimage.3101.t:1 "อิห์รอม"
 pilgrimage.3101.desc:1 "ขณะที่ข้าเข้าใกล้มักกะฮ์ ข้าพบว่าตัวเองกำลังยืนอยู่หน้ามีกอต เขตแดนระหว่างพื้นที่ศักดิ์สิทธิ์ของมักกะฮ์และโลกภายนอก\n\nจากจุดนี้เป็นต้นไป ข้าต้องเข้าสู่สภาวะอิห์รอม ผ่านการชำระล้างตามพิธีกรรมและสวมใส่เพียงเครื่อง แต่งกายที่กำหนด ข้าต้องละเว้นจากการกระทำทางเพศ การสบถ และความคิดที่หยิ่งยโสหรือหยาบคายด้วย"
 pilgrimage.3101.a:0 "ข้าจะปฏิบัติตามอิห์รอมด้วยความทุ่มเทสูงสุด"
 pilgrimage.3101.b:0 "เอ่อ... ไม่ใช่ว่าจะมีใครรู้ถ้าข้าพลาดพลั้งไป"

 ###Generic Pilgrimage Destination Events
 #Standard arrival
 pilgrimage.4001.t:0 "การมาถึง"
 pilgrimage.4001.desc:1 "ในที่สุดข้าก็มาถึงที่นี่ ทั้งร่างกายและจิตวิญญาณ ณ [ROOT.Char.GetFaith.HouseOfWorship] อันยิ่งใหญ่แห่ง [ROOT.Char.GetCurrentLocation.GetNameNoTooltip]\n\nขณะที่ [ROOT.Char.GetFaith.BishopNeuter] ให้พรแก่ข้า ข้าใคร่ครวญถึงทุกสิ่งที่ต้องเกิดขึ้น เพื่อให้ [ROOT.Char.GetFaith.PantheonTerm] นำข้ามาที่นี่ ในช่วงเวลานี้"
 pilgrimage.4001.cynical_end:0 "\n\nการเดินมากมาย"
 pilgrimage.4001.a:0 "ข้าได้เดินบนเส้นทางศักดิ์สิทธิ์แล้ว"
 pilgrimage.4001.a_dead:0 "เราได้เดินบนเส้นทางศักดิ์สิทธิ์แล้ว"
 pilgrimage.4001.a_cynical:0 "สิ่งที่สำคัญคือข้าถูกมองเห็นและได้ยินที่นี่"
 #The Mystic is there!
 pilgrimage.4002.desc:1 "ในที่สุดข้าก็มาถึงที่นี่ ทั้งร่างกายและจิตวิญญาณ ณ จุดสิ้นสุดของการจาริกแสวงบุญอันยิ่งใหญ่ของข้า และใครเล่าจะมาพบข้าที่นั่นนอกจาก [2010_mystic.GetTitledFirstName] ผู้แสวงหาความรู้ที่แท้จริงแห่งความเป็นทิพย์?\n\n"มองไปรอบๆ สิ [ROOT.Char.GetFirstNameNoTooltip]!" [2010_mystic.GetSheHe] กล่าว "ความรุ่งโรจน์นี้ไม่เป็นดังที่ข้ากล่าวไว้หรือ?""
 pilgrimage.4002.a:0 "แท้จริงแล้ว สหายข้า!"
 pilgrimage.4002.a_cynical:0 "มัน... ก็เป็นอะไรบางอย่างล่ะนะ"
 pilgrimage.4002.b:1 "โอ้ ใช่ ข้าชอบสิ่งที่ข้าเห็น"
 #Obligatory Pilgrimage Skip Destination Event
 pilgrimage.4010.t:0 "เคยไปแล้ว"
 pilgrimage.4010.desc:0 "ด้วยการตัดมุมและเร่งรีบขบวน ในที่สุดเราก็มาถึง [ROOT.Char.GetCurrentLocation.GetNameNoTooltip]\n\nไม่ต้องการโอ้เอ้ ทันทีที่หน้าที่อันศักดิ์สิทธิ์สำหรับ [ROOT.Char.GetInvolvedActivity.GetCurrentPhase.GetPhase.GetName] ของเราเสร็จสิ้น คนรับใช้ท้องถิ่นแจ้งข้าว่าการเดินทางของเราพร้อมแล้วสำหรับการเดินทางกลับ"
 pilgrimage.4010.a:0 "ข้า... ข้าเปลี่ยนใจแล้ว นี่รู้สึกผิด"
 pilgrimage.4010.a.flavor:0 "การหันหลังกลับตอนนี้จะเป็นการลบหลู่!"
 pilgrimage.4010.a.tt:0 "ท่านจะสำรวจจุดหมายปลายทางและยังคงอยู่ที่ [THIS.Char.GetCurrentLocation.GetCounty.GetTitle.GetNameNoTierNoTooltip] ตามระยะเวลาปกติ\n$EFFECT_LIST_BULLET$บทสรุปและรางวัล [THIS.Char.GetInvolvedActivity.GetName] ของท่านจะยังคงได้รับผลกระทบในทางลบ"
 pilgrimage.4010.b:0 "ใช่ ให้เราออกเดินทางไปยัง [ROOT.Char.GetTravelPlan.GetData.GetFinalDestination.GetProvince.GetNameNoTooltip]"
 pilgrimage.4010.b.flavor:0 "ไปกันเถอะ..."
 pilgrimage.4010.b.tt:0 "[THIS.Char.GetInvolvedActivity.GetName] ของท่านจะสิ้นสุดลงและท่านเริ่มเดินทางกลับทันที"
 #Bury old host at Destination
 pilgrimage.4020.t:0 "ระลึกถึงความตาย"
 pilgrimage.4020.desc.intro:0 "ทันทีที่เรามาถึง [ROOT.Char.GetCurrentLocation.GetNameNoTooltip] ข้าเริ่มจัดพิธีสำหรับ"
 pilgrimage.4020.desc.relation_family_liked:0 "[ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('old_pilgrimage_host'))] ที่รักผู้ล่วงลับของข้า\n\n"
 pilgrimage.4020.desc.relation_liked:0 "[old_pilgrimage_host.GetFirstName] ที่รักของข้า\n\n"
 pilgrimage.4020.desc.relation_family:0 "[ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('old_pilgrimage_host'))] ผู้ล่วงลับของข้า\n\n"
 pilgrimage.4020.desc.relation_neutral:0 "[old_pilgrimage_host.GetTitledFirstName]\n\n"
 pilgrimage.4020.desc.liked:0 "ข้าพยายามควบคุมอารมณ์ขณะมองหาหนึ่งใน [ROOT.Char.GetFaith.AltPriestTermPlural] พร้อมที่จะช่วยเหลือเราผ่านการจากลาครั้งสุดท้ายนี้\n\nหลังจากนั้นข้าพบความสงบสุขเมื่อรู้ว่าเรามาถึง [ROOT.Char.GetCurrentLocation.GetNameNoTooltip] และ [old_pilgrimage_host.GetFirstName] จะได้พักผ่อนชั่วนิรันดร์ ใกล้ชิดกับ [ROOT.Char.GetFaith.HighGodNameAlternate] มากขึ้น ในสถานที่ศักดิ์สิทธิ์แห่งนี้"
 pilgrimage.4020.desc.neutral:0 "ขบวนแห่สงบและสมเกียรติ และ [ROOT.Char.GetFaith.AltPriestTermPlural] ในท้องถิ่นรับรองกับข้าว่า [old_pilgrimage_host.GetSheHe] อยู่ในภพภูมิที่ดีขึ้นแล้ว บัดนี้ [old_pilgrimage_host.GetSheHe] ได้พักผ่อนที่นี่ใน [ROOT.Char.GetCurrentLocation.GetNameNoTooltip] ใกล้ชิดกับ [ROOT.Char.GetFaith.HighGodName] มากขึ้น"
 pilgrimage.4020.a:0 "นี่เป็นการตัดสินใจที่ถูกต้อง"
 pilgrimage.4020.a.flavor:0 "ขอให้ [old_pilgrimage_host.GetSheHe] ไปสู่สุคติ"

 ###Specific Pilgrimage Destination Events
 ###Christian
 #Rome
 pilgrimage.5001.t:0 "ทุกเส้นทางมุ่งสู่โรม"
 pilgrimage.5001.desc:0 "ผู้แสวงบุญหลั่งไหลมายังโรมจากทั่วโลกคริสเตียน บางคนเดินตามเส้นทางฟรันซีเจนา บางคนใช้เส้นทางที่ไม่ค่อยมีคนรู้จัก ในที่สุด เราทุกคนก็มาบรรจบกันที่นี่ ณ มหาวิหารนักบุญเปโตร ที่ ซึ่งบุรุษผู้ยิ่งใหญ่ผู้นั้นได้พักผ่อน\n\nเมื่อยืนอยู่ที่นี่กับผู้แสวงบุญคนอื่นๆ ข้ารู้สึกถึงความสามัคคีและความเป็นพี่น้องอันเคร่งขรึมที่แบ่งปันกันในหมู่ผู้ที่รวมตัวกัน ทุกคนต่างเอาชนะการทดลองและความยากลำบากต่างๆ ตลอดการเดินทาง"
 #Jerusalem
 pilgrimage.5011.t:0 "โอ เยรูซาเล็ม เยรูซาเล็ม!"
 pilgrimage.5011.desc.beginning:0 "ไม่มีเมืองอื่นใดในโลกที่มีประวัติศาสตร์เหมือนเยรูซาเล็ม นอกจากสถานที่ศักดิ์สิทธิ์อื่นๆ อีกมากมายแล้ว เมืองนี้ยังมี "
 pilgrimage.5011.desc.christian:0 "โบสถ์พระคูหาศักดิ์สิทธิ์ ซึ่งสร้างขึ้นครอบคลุมสถานที่รวมที่พระเยซูทรงถูกตรึงกางเขน ฝัง และฟื้นคืนพระชนม์"
 pilgrimage.5011.desc.muslim:0 "ฮะรอมอัชชะรีฟ สถานที่ที่มุฮัมมัดเสด็จขึ้นสู่สวรรค์หลังจากช่วงเวลาของท่านบนโลก"
 pilgrimage.5011.desc.jewish:0 "เนินพระวิหาร ที่ตั้งของอภิสุทธิสถาน และสถานที่ ซึ่งมีการพยากรณ์ว่าจะมีการสร้างพระวิหารหลังที่สามขึ้นใหม่"
 pilgrimage.5011.desc.end:0 "\n\nเมื่อยืนอยู่นอกเนินพระวิหาร โดยวางมือบนกำแพงตะวันตก ข้าพบว่าตัวเองกำลังใคร่ครวญถึงทุกสิ่งที่เกิดขึ้นในการเดินทางของข้ามายังเมืองในตำนานแห่งนี้"
 #Constantinople
 pilgrimage.5021.t:0 "นครแห่งความปรารถนาของโลก!"
 pilgrimage.5021.desc:0 "ในที่สุดข้าก็ยืนอยู่บนเนินเขานอกกรุงคอนสแตนติโนเปิล อัญมณีแห่งอารยธรรมที่ส่องประกายระยิบระยับ ซึ่งสะท้อนถึงความรุ่งโรจน์ของจักรวรรดิโรมัน ช่างเป็นภาพที่น่าชมอย่างแท้จริง!\n\nใกล้ใจกลางเมืองข้าสามารถเห็นฮาเกียโซเฟีย ศูนย์กลางการสักการะอันยิ่งใหญ่ ซึ่งมักถือเป็นสุดยอดสถาปัตยกรรมไบแซนไทน์\n\nแต่มันไม่ใช่สิ่งมหัศจรรย์เพียงแห่งเดียวที่นี่ และขณะที่ข้ามองออกไปทั่วเมือง ข้าก็ทึ่งในความรุ่งโรจน์แห่งการสร้างสรรค์ของ [ROOT.Char.GetFaith.CreatorNamePossessive]"
 #Alexandria
 pilgrimage.5031.t:0 "อเล็กซานเดรีย!"
 pilgrimage.5031.desc:0 "ในที่สุดข้าก็มาถึงอเล็กซานเดรีย บ้านเกิดของนักพรตคริสเตียน นักพรตและฤาษีคนแรกๆ เริ่มต้นการเดินทางในถ้ำทะเลทรายรอบเมือง ซึ่งยังคงใช้งานอยู่ในปัจจุบัน\n\nแม้จะไม่โด่งดังเท่าเยรูซาเล็มหรือโรม อเล็กซานเดรียก็มีประวัติศาสตร์อันยาวนานในฐานะศูนย์กลางเทววิทยาและการเรียนรู้ แม้จะอยู่ภายใต้การยึดครองของอิสลามมาหลายศตวรรษ กลุ่มชาวคริสต์ที่อาศัยอยู่ในเมืองก็ยังคงรักษาศรัทธาของตนไว้อย่างเข้มแข็ง"
 ###Jewish
 #Mount Sinai
 pilgrimage.5101.t:0 "ซีนายและโฮเรบ"
 pilgrimage.5101.desc:1 "[ROOT.Char.GetFaith.HighGodName] ตรัสกับโมเสสครั้งแรกบนยอดเขาซีนาย โดยทรงปรากฏในรูปพุ่มไม้ที่ลุกเป็นไฟ ต่อมา บนภูเขาเดียวกัน [ROOT.Char.GetFaith.HighGodNameSheHe|U] ได้ประทานบัญญัติสิบประการแก่เขา ซึ่งได้ก่อตั้งรากฐานของหลักคำสอนอับราฮัมทั้งหมด\n\nไม่ต้องสงสัยเลยว่า [ROOT.Char.GetFaith.HighGodName] โปรดปรานสถานที่แห่งนี้ และข้าพบว่าตัวเองกำลังสงสัยว่า [ROOT.Char.GetFaith.HighGodNameSheHe|U] กำลังมองลงมาที่ข้าหรือไม่ขณะที่ข้ายืนอยู่บนเนินเขาศักดิ์สิทธิ์เหล่านี้..."
 ###Muslim
 #Medina
 pilgrimage.5201.t:0 "ฮิจเราะห์"
 pilgrimage.5201.desc:0 "มุฮัมมัดไม่ได้เป็นที่รักเสมอไป และในยุคแรกๆ ของศาสนาอิสลาม หลายคนปฏิเสธท่านและคำสอนของท่าน\n\nหลังจากได้รับคำเตือนถึงแผนการลอบสังหาร ท่านออกจากมักกะฮ์เพื่อเดินทางไปยังยัษริบ ที่ ซึ่งกลุ่มชาวมุสลิมที่กำลังเติบโตต้อนรับท่านด้วยอ้อมแขนที่เปิดกว้าง การเดินทางครั้งนี้เรียกว่าฮิจเราะห์ และในบ้านใหม่ของท่าน มุฮัมมัดสามารถรวบรวมชนเผ่าที่ทำสงครามกันรอบตัวท่านให้ยอมจำนนต่ออัลลอฮ์\n\nยัษริบจะถูกเปลี่ยนชื่อเป็นมะดีนะฮ์ นครแห่งศาสดา เพื่อเป็นเกียรติแก่สิ่งนี้ บัดนี้ข้าอยู่ที่นี่ พร้อมที่จะให้เกียรติการเดินทางของท่านด้วยตัวเอง"
 ###Hindu
 #Varanasi
 pilgrimage.5301.t:0 "พาราณสี"
 pilgrimage.5301.desc:0 "ในที่สุดข้าก็มาถึงพาราณสี ก่อตั้งโดยพระศิวะในสมัยโบราณกาล นครอันยิ่งใหญ่ดึงดูดผู้แสวงบุญจากแดนไกล\n\nไม่ใช่แค่ผู้แสวงบุญชาวฮินดูเท่านั้นที่เดินทางมาที่นี่ เนื่องจากเมืองนี้อยู่ใกล้กับสถานที่ ซึ่งพระโคตมพุทธเจ้าทรงสอนสาวกของท่านเป็นครั้งแรก\n\nการได้เห็นการผสมผสานของผู้ศรัทธาโดยตรง และความรู้และการสนทนาที่ไหลเวียนออกมาจากสิ่งนั้น ทำให้ข้าตระหนักรู้ใหม่ว่าเราทุกคนอาศัยอยู่ในโลกนี้ร่วมกันอย่างไร"
 #Ayodhya
 pilgrimage.5311.t:0 "อโยธยา"
 pilgrimage.5311.desc:1 "ในที่สุดข้าก็มาถึงอโยธยา สถานที่ประสูติของพระรามและฉากของมหากาพย์รามายณะอันยิ่งใหญ่ ในฐานะอวตารของพระวิษณุ การประสูติและพระชนม์ชีพของพระรามถือเป็นตัวอย่างที่ส่องสว่างของธรรมะในการปฏิบัติ\n\nในฐานะเรื่องราวที่สร้างแรงบันดาลใจให้ชาวฮินดูหลายชั่วอายุคน การได้มาอยู่ในสถานที่แห่งรามายณะ ทำให้ข้าสงสัยว่ามรดกของข้าเองจะทิ้งร่องรอยใดไว้ในประวัติศาสตร์..."
 #Mathura
 pilgrimage.5321.t:0 "มถุรา"
 pilgrimage.5321.desc:0 "ในที่สุดข้าก็มาถึงจุดหมายปลายทาง มถุรา ที่นี่คือสถานที่ประสูติของพระกฤษณะ เทพเจ้าแห่งความเมตตา ความรัก และความอ่อนโยน\n\nเมื่อมองไปรอบๆ ข้าสามารถเห็นแง่มุมเหล่านั้นทั้งหมดแสดงออกโดยผู้แสวงบุญที่หลั่งไหลมาที่นี่เพื่อสักการะที่กฤษณะจันมสถานเทวาลัย หนึ่งในสถาปัตยกรรมทางศาสนาที่งดงามและยิ่งใหญ่ที่สุดที่สร้างขึ้นจนถึงปัจจุบัน"
 #Haridwar
 pilgrimage.5331.t:0 "หริทวาร"
 pilgrimage.5331.desc:0 "ในที่สุดข้าก็มาถึงต้นกำเนิดของแม่น้ำคงคาอันศักดิ์สิทธิ์ หริทวาร\n\nเมืองนี้สร้างขึ้นบนสถานที่ ซึ่งพระแม่คงคาเสด็จลงมาเมื่อพระศิวะทรงปล่อยแม่น้ำอันยิ่งใหญ่ออกจากมวยผมของพระองค์\n\nเป็นที่รู้จักกันว่าสามารถชำระล้างบาปได้ ผู้แสวงบุญจากทั่วโลกหลั่งไหลมาที่นี่เพื่ออาบน้ำในแม่น้ำ บัดนี้ข้าจะเป็นหนึ่งในนั้น"
 #Kanchipuram
 pilgrimage.5341.t:0 "กาญจีปุรัม"
 pilgrimage.5341.desc:1 "ในที่สุดข้าก็มาถึงกาญจีปุรัม บ้านของกามักชีอัมมันเทวาลัย\n\nอุทิศให้กับพระแม่เจ้า เทวาลัยแห่งนี้เป็นที่รู้จักในฐานะสถานที่แห่งสันติภาพและความเจริญรุ่งเรือง และยังคงเป็นหนึ่งในเจ็ดสถานที่ศักดิ์สิทธิ์ที่สุดในศาสนาฮินดู "
 #Ujjayini
 pilgrimage.5351.t:0 "อุชเชนี"
 pilgrimage.5351.desc:0 "เมื่อมาถึงเมืองโบราณอุชเชนี ข้าเริ่มเดินทางไปยังมหากาเลศวร ชโยติรลึงค์\n\nอุทิศให้กับพระศิวะในอวตารของพระองค์ในฐานะมหากาเลศวร เมืองนี้เป็นทั้งศูนย์กลางการจาริกแสวงบุญและการปกครองมานาน สร้างมหานครที่คึกคักอันยิ่งใหญ่ ซึ่งเต้นเป็นจังหวะด้วยชีวิตของผู้ศรัทธา\n\nหลังจากมาถึงเทวาลัยอันยิ่งใหญ่ ข้าแสวงหาพรจาก [ROOT.Char.GetFaith.BishopNeuter] ชำระล้างจิตวิญญาณของข้าจากบาป"
 #Dwarka
 pilgrimage.5361.t:0 "ทวารกา"
 pilgrimage.5361.desc:0 "ในที่สุดข้าก็อยู่บนธรณีประตูของนครประตูชัย ทวารกา หนึ่งในสถานที่ที่ยิ่งใหญ่ที่สุดในศาสนาฮินดู\n\nตามตำนาน อวตารของพระวิษณุคือพระกฤษณะได้ทวงคืนผืนดินอันกว้างใหญ่จากทะเล เพื่อให้เมืองนี้สามารถสร้างขึ้นที่นี่ได้ ตั้งแต่นั้นมา เมืองนี้ก็เติบโตขึ้นอย่างมาก กลายเป็นศูนย์กลางทางศาสนาและเศรษฐกิจที่ดึงดูดผู้แสวงบุญจากทั่วทุกสารทิศ... รวมถึงตัวข้าด้วย"
 ###Buddhism
 #Bodh Gaya
 pilgrimage.5401.t:0 "พุทธคยา"
 pilgrimage.5401.desc:0 "ข้ามาถึงสถานที่ศักดิ์สิทธิ์ที่สุดในโลกสำหรับชาวพุทธแล้ว พุทธคยาคือสถานที่ ซึ่ง [ROOT.Char.GetFaith.HighGodName] [ROOT.Char.GetFaith.HighGodHerselfHimself] ตรัสรู้ภายใต้ต้นพระศรีมหาโพธิ์\n\nตั้งแต่นั้นมา มหาโพธิวิหารอันประณีตก็ถูกสร้างขึ้นรอบต้นไม้ศักดิ์สิทธิ์ และผู้แสวงบุญจากทั่วโลกหลั่งไหลมาที่นี่เพื่อเรียนรู้เพิ่มเติมเกี่ยวกับเรื่องราวของ [ROOT.Char.GetFaith.HighGodNameAlternatePossessive] และเฉลิมฉลองพระชนม์ชีพของ [ROOT.Char.GetFaith.HighGodHerHis]"
 #Kushinagar
 pilgrimage.5411.t:0 "กุสินารา"
 pilgrimage.5411.desc:0 "ในที่สุดข้าก็มาถึงกุสินารา ที่ ซึ่งกล่าวกันว่า [ROOT.Char.GetFaith.HighGodName] เสด็จดับขันธปรินิพพานจากโลกมนุษย์\n\nเมื่อทรงบรรลุนิพพานในพระชนม์ชีพ การปรินิพพานของ [ROOT.Char.GetFaith.HighGodHerHis] จึงควรได้รับการเฉลิมฉลอง เนื่องจาก [ROOT.Char.GetFaith.HighGodNameSheHe] ทรงบรรลุปริินิพพานหลังจากดับขันธ์และหลุดพ้นจากโซ่ตรวนแห่งการเวียนว่ายตายเกิด โมกษะ หรือการหลุดพ้นนี้ เป็นเป้าหมายสูงสุดของชาวพุทธผู้ศรัทธา"
 #Sarnath
 pilgrimage.5421.t:0 "สารนาถ"
 pilgrimage.5421.desc:0 "การเดินทางของข้าในที่สุดก็นำข้ามาสู่สารนาถ สถานที่ ซึ่ง [ROOT.Char.GetFaith.HighGodName] ทรงสอนอริยสัจสี่แก่สาวกของ [ROOT.Char.GetFaith.HighGodHerHis] เป็นครั้งแรก รวมถึงคำสอนที่เกี่ยวข้อง\n\nที่นี่คือที่ ซึ่งโรงเรียนพุทธแห่งแรกก่อตั้งขึ้น ซึ่งแม้ในปัจจุบันก็ยังดึงดูดผู้แสวงบุญจากทั่วโลก"

 ###Dharmic
 #Parikrama
pilgrimage.5445.t: "ปริกรม"
pilgrimage.5445.desc: "ข้าชื่นชม [ROOT.Char.GetCurrentLocation.Custom('GetTerrainType')] อันตระการตาของ [ROOT.Char.GetCurrentLocation.GetCounty.GetTitle.GetNameNoTier] และดำเนินสู่ช่วงต่อไปของ [Glossary('ยาตรา', 'YATRA_GLOSS')] ข้าแสดงความเคารพบูชาต่อ [ROOT.Char.GetFaith.HighGodName] ผ่าน [Glossary('บูชา', 'PUJA_GLOSS')] จากนั้นข้าเข้าร่วมกับฝูงชนบนเส้นทาง [Glossary('ประทักษิณ', 'PRADAKSHINA_GLOSS')] เดินเวียนขวารอบศาล"
pilgrimage.5445.a: "$pilgrimage.4001.a$"
pilgrimage.5445.a_dead: "$pilgrimage.4001.a_dead$"
pilgrimage.5445.a_cynical: "$pilgrimage.4001.a_cynical$"
PUJA_GLOSS: "ปูชา คือการแสดงความเคารพ การบูชา และความเลื่อมใสศรัทธาที่แสดงออกโดยชาวฮินดูและชาวพุทธ"
PRADAKSHINA_GLOSS: "ภาษาสันสกฤตหมายถึง \"ไปทางขวา\" หมายถึงเส้นทางที่ใช้ในการเดินเวียนขวา (ตามเข็มนาฬิกา) รอบศาลในพิธีกรรมของชาวฮินดูและชาวพุทธ กระทำ เช่นนี้เพื่อประกันการเกิดใหม่ในภพภูมิที่ดี"
 ###Jainism
 #Shikharj
 pilgrimage.5501.t:0 "ศิขรจี"
 pilgrimage.5501.desc:1 "ตามนิรวาณกัณฑ์ ตีรถังกรเชนยี่สิบในยี่สิบสี่องค์บรรลุโมกษะที่นี่บนภูเขาศิขรจี ประวัติศาสตร์อันยาวนาน เช่นนี้ ทำให้สถานที่แห่งนี้เป็นสถานที่จาริกแสวงบุญที่สำคัญที่สุดในชุมชนเชน และขณะที่สายตาของข้ากวาดมองจากยอดเขาสูงสุดไปยังหุบเขาเบื้องล่าง ข้าพบว่าตัวเองกำลังใคร่ครวญถึงการเดินทางของข้ามาที่นี่และความหมายที่มีต่อชีวิตของข้า"
 ###Zoroastrian
 #Ushi-darena
 pilgrimage.5601.t:0 "จิตสำนึกอันศักดิ์สิทธิ์"
 pilgrimage.5601.desc:0 "ขณะที่ข้ายืนอยู่บนเนินเขาอุชิดาเรนา ทิวทัศน์ของหุบเขาเบื้องล่างแผ่กว้างอยู่ตรงหน้าข้า เมื่อเผชิญกับภาพอันน่าเกรงขาม ข้าอดไม่ได้ที่จะคิดถึงวิธีที่โซโรอัสเตอร์บรรลุการรู้แจ้งที่นี่ ได้รับความรู้ของอหุระ มาซดะเพื่อเผยแพร่สู่โลกเบื้องล่าง เช่นเดียวกับผู้แสวงบุญส่วนใหญ่ที่นี่ ข้าไม่รู้สึกถึงประกายแห่งการพยากรณ์อันศักดิ์สิทธิ์ แต่ถึงกระนั้นข้าก็อดไม่ได้ที่จะทึ่งในสิ่งที่อยู่ตรงหน้าข้า"
 ###Norse Germanic
 #Paderborn
 pilgrimage.5901.t:0 "พาเดอร์บอร์น!"
 pilgrimage.5901.desc:0 "ลึกเข้าไปในป่าพาเดอร์บอร์นเคยมีเอียร์มินซูล เสาหลักอันยิ่งใหญ่ตั้งอยู่ สร้างขึ้นเพื่อเป็นเกียรติแก่โอดิน อนุสาวรีย์ถูกทำลายโดยชาร์เลอมาญระหว่างสงครามแซกซอน แต่ผู้คนของเรายังคงหลั่งไหลไปยังสถานที่ที่มันเคยตั้งอยู่เพื่อเป็นเกียรติแก่ความทรงจำ บัดนี้ข้าสามารถกล่าวได้ว่า ข้าเองก็ได้จาริกแสวงบุญไปยังสถานที่ศักดิ์สิทธิ์แล้ว"
 ###Tengri
 #Open Blue Skies
 pilgrimage.5911.t:0 "ท้องฟ้าสีครามอันกว้างใหญ่"
 pilgrimage.5911.desc:1 "โลกคือวิหารของ [ROOT.Char.GetFaith.HighGodNamePossessive] ท้องฟ้าสีครามอันยิ่งใหญ่กว้างใหญ่กว่าเพดานของมัสยิดหรือโบสถ์ใดๆ ที่นี่ในทุ่งหญ้าสเตปป์อันกว้างใหญ่ของ [ROOT.Char.GetCurrentLocation.GetNameNoTooltip] ข้ารู้สึกใกล้ชิดกับ [ROOT.Char.GetFaith.PantheonTerm] เป็นพิเศษ และพบว่าตัวเองกำลังใคร่ครวญถึงการเดินทางของข้าเพื่อมาถึงสถานที่ศักดิ์สิทธิ์แห่งนี้"
 ###Sanctity of Nature
 #Sacred Groves
 pilgrimage.5921.t:0 "ป่าศักดิ์สิทธิ์"
 pilgrimage.5921.desc:1 "ในที่สุดข้าก็มาถึง [ROOT.Char.GetCurrentLocation.GetNameNoTooltip] แล้ว ในขณะที่บางคนสักการะในโบสถ์หรือมัสยิด ข้ารู้ว่าสถานที่ศักดิ์สิทธิ์ที่สุดอยู่ในป่าเปิดที่เท้าเปล่าสัมผัสกับผืนดินที่อ่อนนุ่มและหล่อเลี้ยง\n\nป่าเก่าแก่ที่นี่มีความน่าเคารพนับถือเป็นพิเศษ และข้าพบว่าตัวเองกำลังสงสัยเกี่ยวกับตำแหน่งของข้าในโลกธรรมชาติขณะที่ข้ายืนอยู่ท่ามกลางต้นไม้อันยิ่งใหญ่"

 ###Remaining at a Holy Site events
 #Appreciation
 pilgrimage.6500.t:1 "ความซาบซึ้ง"
 pilgrimage.6500.desc:1 "[pilgrimage_member.GetTitledFirstName] [ROOT.Char.Custom2('RelationToMe', pilgrimage_member)] ของข้า มองออกไปเหนือสถานที่ศักดิ์สิทธิ์อันกว้างใหญ่ของ [ROOT.Char.GetCurrentLocation.GetCounty.GetTitle.GetNameNoTier] ขณะที่เราเดินทางผ่านฝูงชน:\n\n"[ROOT.Char.GetCurrentLocation.GetCounty.GetTitle.GetNameNoTierNoTooltip] เป็นภาพที่น่าชมอย่างแท้จริง! สถานที่ที่วัฒนธรรมมาบรรจบกันและศรัทธามารวมกันเพื่อสักการะ เราไม่ได้รับพรหรือที่ได้สัมผัสกับความคุ้นเคยและความเป็นเพื่อน เช่นนี้?"\n\n[pilgrimage_member.GetSheHe|U] มองมาที่ข้าอย่างคาดหวัง"
 pilgrimage.6500.a:1 "ข้า #EMP รู้!#! ให้เราเพลิดเพลินกับสิ่งนี้!"
 pilgrimage.6500.a.tt:0 "วัฒนธรรมของท่านไม่มีธรรมเนียม [GetCultureTradition('tradition_xenophilic').GetName]"
 pilgrimage.6500.b:0 "ความสำเร็จที่จิตวิญญาณสามารถทำได้!"
 pilgrimage.6500.c:0 "มนุษย์สร้างสถานที่นี้ ไม่ใช่เทพเจ้า"
 #Lost in Translation
 pilgrimage.6510.t:1 "สูญหายในการแปล"
 pilgrimage.6510.desc:1 "ขณะที่ข้าเดินเล่นไปตามถนนของ [ROOT.Char.GetCurrentLocation.GetNameNoTooltip] ข้าหยุดอยู่หน้า [ROOT.Char.GetFaith.HouseOfWorship] เล็กๆ แห่งหนึ่ง อาคารค่อนข้างเรียบง่ายและสมถะ แต่มีผู้แสวงบุญกลุ่มเล็กๆ รวมตัวกันอยู่ข้างหน้า\n\nเมื่อข้าเข้าไปใกล้ ข้าตระหนักว่าพวกเขากำลังเกาหัวพยายามทำความเข้าใจแผ่นจารึกข้างรูปปั้นผู้พิทักษ์รูปหนึ่ง ซึ่งเขียนด้วยภาษาต่างประเทศ\n\nนี่อาจเป็นโอกาสที่จะให้บริการเพื่อนผู้แสวงบุญของข้า!"
 pilgrimage.6510.a:1 "#EMP ข้า#! จะแปลให้พวกท่านทุกคนฟัง!"
 pilgrimage.6510.a.flavor:0 "ข้าไม่อยากจะเชื่อเลยว่าแผ่นจารึกนี้มี #EMP คำสะกดผิด!#!"
 pilgrimage.6510.b:0 "แผ่นจารึกนั้นเขียนว่าอะไร...?"
 pilgrimage.6510.b_success.t:0 "ถอดรหัสแผ่นจารึกแล้ว"
 pilgrimage.6510.b_success.desc:0 "ถอดรหัสแผ่นจารึก"
 pilgrimage.6510.b_failure.t:0 "แผ่นจารึกอ่านไม่ออก"
 pilgrimage.6510.b_failure.desc:0 "แผ่นจารึกยังคงเป็นปริศนา"
 pilgrimage.6510.c:0 "เอ่อ นี่ดูไม่ค่อยคุ้มค่าเลย"
 #Time To Go Home Soon?
 pilgrimage.6520.t:0 "ใกล้ถึงเวลากลับบ้านหรือยัง?"
 pilgrimage.6520.desc:1 "[impatient_pilgrim.GetTitledFirstName] เดินไปมากับกลุ่มแสวงบุญของเรา ถอนหายใจเสียงดังและลากเท้าของ [impatient_pilgrim.GetHerHis]: "รู้สึกเหมือนเราอยู่ที่นี่มานานแล้ว ไม่ใช่เวลาที่จะเริ่มกลับบ้านเร็วๆ นี้หรือ?" [impatient_pilgrim.GetSheHe] พึมพำอย่างไม่อดทน\n\nข้าเหลือบมอง [impatient_pilgrim.GetHerHim] และ"
 pilgrimage.6520.desc_forgiving:0 "รู้สึกสงสาร [impatient_pilgrim.GetHerHim] เล็กน้อย มันไม่สนุกเลยที่ถูกลากไปด้วย"
 pilgrimage.6520.desc_nonforgiving:0 "ไม่อยากจะเชื่อ #EMP ความกล้า#! ของ [impatient_pilgrim.GetHerHim] เลย ข้ากำหมัดแน่น"
 pilgrimage.6520.a:1 "เจ้า #EMP กล้า#! อวดดี เช่นนี้ได้อย่างไร!"
 pilgrimage.6520.b:0 "มาเถิด ให้ข้าพาเจ้าไปดูรูปปั้นอันงดงามนั่น"
 pilgrimage.6520.c:0 "ข้าเข้าใจสิ่งที่เจ้าหมายถึง"
 #Fishy local guide?
 pilgrimage.6530.t:0 "ประสบการณ์ใหม่"
 pilgrimage.6530.desc_intro:0 "ขณะที่เราเดินผ่านแผงลอยในตลาด [ROOT.Char.GetCurrentLocation.GetCounty.GetTitle.GetNameNoTierNoTooltip] เราได้รับการทักทายจาก"
 pilgrimage.6530.desc_adult:0 "[local_guide.GetWomanMan] ท้องถิ่นที่ดูแปลกประหลาด [local_guide.GetSheHe|U] เอ่ยกับเราอย่างไม่สะทกสะท้าน:\n\n\"[ROOT.Char.Custom('FormOfAddressForLiege')|U] ท่านดูเป็น[ROOT.Char.GetWomanMan]ผู้สูงศักดิ์ที่ละเอียดอ่อน! ข้ารู้จักประสบการณ์ที่ #EMP ศักดิ์สิทธิ์#! อย่างแท้จริง ซึ่งอยู่ไม่ไกลจาก [ROOT.Char.GetCurrentLocation.GetCounty.GetTitle.GetNameNoTierNoTooltip] ซึ่งแน่นอนว่าน่าสนใจสำหรับผู้แสวงบุญที่ทุ่มเท!\""
 pilgrimage.6530.desc_child:0 "เด็กน้อยที่มีดวงตากลมโตสดใส [local_guide.GetSheHe|U] เงยหน้ามองเราขณะที่ [local_guide.GetSheHe] อุทานว่า:\n\n"ข้ารู้จักสถานที่ลับที่ [ROOT.Char.GetFaith.HighGodName] อาศัยอยู่!" [local_guide.GetSheHe] ทำหน้ามุ่งมั่นขณะที่ [local_guide.GetSheHe] พูดต่อ: "ข้าสามารถพาเจ้าไปได้ถ้าเจ้าต้องการ?""
 pilgrimage.6530.desc_warning:0 "\n\n[warning_character.GetTitledFirstName] ทางขวาของข้า ขมวดคิ้วและส่ายศีรษะ [warning_character.GetHerHis] อย่างสุขุม คำเตือนหรือ?"
 pilgrimage.6530.desc_learned:0 "\n\nจากการศึกษาแผนที่ ข้าบังเอิญรู้ว่าไม่มีอะไรอยู่ทางด้านนั้นของ [ROOT.Char.GetCurrentLocation.GetCounty.GetTitle.GetNameNoTierNoTooltip] นอกจากพื้นที่รกร้างอันตราย"
 pilgrimage.6530.a:0 "ทำให้ข้าสนใจ"
 pilgrimage.6530.a_child.tt:0 "ท่านตามเด็กไป"
 pilgrimage.6530.divinity.desc:0 "[local_guide.GetShortUIName] แสดงประสบการณ์อันศักดิ์สิทธิ์อย่างแท้จริงให้ท่านเห็น"
 pilgrimage.6530.dangerous.desc:0 "ท่านถูกหลอกลวงเข้าสู่สถานการณ์อันตราย"
 pilgrimage.6530.b:0 "[ROOT.Char.GetFaith.HighGodName] จะยิ้มให้กับ [local_guide.GetWomenMen] ที่หลอกลวงด้วย"
 pilgrimage.6530.b_child:0 "การโกหกไม่เหมาะกับเจ้าเลย ลูกข้า"
 pilgrimage.6530.b.flavor:0 "[local_guide.GetShortUIName] วิ่งหนีไปอย่างรวดเร็ว"
 pilgrimage.6530.c:0 "ให้เหตุผลข้าข้อหนึ่งที่จะไม่ส่งตัวเจ้า"
 pilgrimage.6530.c.flavor:0 "เราทุกคนชดใช้บาปของเรา"
 pilgrimage.6530.d:0 "เจ้ากำลังพยายามหลอก #EMP ข้า#! หรือ ชาวบ้าน?!"
 pilgrimage.6530.d.flavor:0 "ข้าจะเฆี่ยนความซื่อสัตย์ออกมาจาก [local_guide.GetHerHim]!"
 pilgrimage.6530.e:0 "ข้าขอผ่าน"
 #Fishy guide not so fishy actually
 pilgrimage.6531.t:0 "ความศักดิ์สิทธิ์ที่ซ่อนเร้น"
 pilgrimage.6531.desc_wellspring:0 "ค่อนข้างไกลจาก [ROOT.Char.GetCurrentLocation.GetCounty.GetTitle.GetNameNoTierNoTooltip] เราหยุดกะทันหัน ผู้นำทางของเรา [local_guide.GetTitledFirstName] แสดงทางลับให้เราเห็น และเราลงเอยในถ้ำเล็กๆ ที่สว่างไสวด้วยแสงแดดที่ส่องผ่านรูบนหลังคา\n\nผ่านรูเดียวกันนั้น น้ำพุที่น่าทึ่งอย่างแท้จริงก็ไหลรินออกมาอย่างสงบ น้ำที่ไหลเรืองรองด้วยความงดงามอันศักดิ์สิทธิ์และรุ้งกินน้ำจางๆ แต่งแต้มอากาศรอบๆ"
 pilgrimage.6531.desc_crystal_cavern:0 "ขณะที่ข้าเริ่มสงสัยว่าเราจะมาถึงหรือไม่ ผู้นำทางของเรา [local_guide.GetTitledFirstName] ก็เลี้ยวซ้ายกะทันหัน และก่อนที่เราจะรู้ตัว เราก็เข้าไปในถ้ำที่ซ่อนอยู่ในชนบท\n\nแสงเรืองรองจางๆ ที่ค่อยๆ แรงขึ้น เริ่มสะท้อนบนอุปกรณ์ของเราขณะที่เราเดินโซเซเข้าไปในถ้ำขนาดใหญ่ที่ปกคลุมไปด้วยคริสตัลหลายร้อยเม็ด คริสตัลจับแสงจากรูบนเพดาน และขบวนแห่ รวมถึงตัวข้าเอง ต่างชื่นชมด้วยความประหลาดใจเมื่อเห็นภาพนั้น"
 pilgrimage.6531.desc_non_cynical:0 "\n\nข้าไม่เคยรู้สึกถึงการประทับอยู่ของ [ROOT.Char.GetFaith.HighGodNamePossessive] แรงกล้าเท่าในจุดนี้มาก่อน"
 pilgrimage.6531.desc_cynical:0 "\n\nนี่เป็นความสำเร็จทางธรรมชาติที่น่าประทับใจมาก ข้ายอมรับ"
 pilgrimage.6531.a:0 "ช่างน่าอัศจรรย์!"
 #Fishy guide _was_ fishy!
 pilgrimage.6532.t:0 "เหยื่อแสวงบุญ!"
 pilgrimage.6532.desc:0 "เสียงผิวปากอย่างสบายใจของผู้นำทางของเรา [local_guide.GetTitledFirstNamePossessive] เป็นสิ่งสุดท้ายที่เราได้ยินก่อนที่พวกอันธพาลจะเข้ามาหาเรา ดูเหมือนจะมาจากไหนก็ไม่รู้ ค่อนข้างไกลจาก [ROOT.Char.GetCurrentLocation.GetCounty.GetTitle.GetNameNoTierNoTooltip] นี่เป็นการจัดฉาก และตอนนี้เราโดดเดี่ยวโดยไม่มีความหวังว่าจะมีการแทรกแซง\n\nชีพจรของข้าเต้นเร็วขณะที่ข้าพยายามคิดหาทางเคลื่อนไหวต่อไป พวกมันกล้าดียังไงมาปล้นผู้แสวงบุญ?"
 pilgrimage.6532.a:0 "[6532_protector.GetTitledFirstNameNoTooltip]! จัดการพวกมัน!"
 pilgrimage.6532.a_success.t:0 "ขับไล่คนร้ายสำเร็จ"
 pilgrimage.6532.a_success.desc:0 "[6532_protector.GetShortUIName] ขับไล่คนร้ายสำเร็จ"
 pilgrimage.6532.a_failure.t:0 "บาดเจ็บ"
 pilgrimage.6532.a_failure.desc:0 "[6532_protector.GetShortUIName] ได้รับบาดเจ็บในการต่อสู้"
 pilgrimage.6532.b:0 "#EMP พลังแห่ง [ROOT.Char.GetFaith.HighGodNameAlternate] บังคับเจ้า!#!"
 pilgrimage.6532.c:0 "นี่คือสถานที่ศักดิ์สิทธิ์! พวกเจ้าไม่เกรงกลัวพระเจ้าหรือ?!"
 pilgrimage.6532.c_success.t:0 "ขับไล่คนร้ายสำเร็จ"
 pilgrimage.6532.c_success.desc:0 "ท่านขับไล่คนร้ายสำเร็จ"
 pilgrimage.6532.c_failure.t:0 "ถูกปล้น"
 pilgrimage.6532.c_failure.desc:0 "ท่านถูกปล้น"
 #Fishy child breaks down
 pilgrimage.6533.t:0 "ยามคับขัน"
 pilgrimage.6533.desc:0 "ห่างจาก [ROOT.Char.GetCurrentLocation.GetCounty.GetTitle.GetNameNoTierNoTooltip] ออกมาพอสมควร ขณะที่เราเลี้ยวหัวมุมอีกครั้ง ผู้นำทางเด็กของเรา [local_guide.GetTitledFirstName] ก็หยุดนิ่งอยู่กับรอยเท้า [local_guide.GetHerHis] ร่างเล็ก ๆ เริ่มสั่นเทาและข้าได้ยินเสียงสะอื้นที่ถูกกลั้นไว้ขณะที่ [local_guide.GetSheHe] พยายามซ่อนความจริงว่า [local_guide.GetSheHe] กำลังร้องไห้\n\n"ข้า... ขออภัย ท่าน [ROOT.Char.GetLadyLord] พวกเขาบังคับให้ข้าทำ น้องสาวคนเล็กของข้าป่วยและเราไม่ได้กินอะไรมาหลายวันแล้ว... ," [local_guide.GetSheHe] มองไปทางนั้น ดวงตาโตสดใสพลันหวาดกลัว "เราควรกลับไป" [local_guide.GetSheHe] กระซิบอย่างระมัดระวัง"
 pilgrimage.6533.a:0 "ลูกรัก ความซื่อสัตย์ของเจ้า ทำให้ใจข้าอบอุ่น"
 pilgrimage.6533.a.flavor:0 "มาช่วยเด็กน่าสงสารคนนี้กันเถอะ"
 pilgrimage.6533.b:0 "ช่างเป็นการกระทำที่ #EMP น่ารังเกียจ#! อะไร เช่นนี้"
 pilgrimage.6533.b.flavor:0 "อาชญากรโดยการสมรู้ร่วมคิด!"
 #Find some exotic wares
 pilgrimage.6540.t:0 "ข้าขอเสนอ..."
 pilgrimage.6540.desc:0 "ขณะที่ข้าเดินไปตามถนนของ [ROOT.Char.GetCurrentLocation.GetCounty.GetTitle.GetNameNoTier] สินค้าในตลาดท้องถิ่นก็ดึงดูดความสนใจของข้า\n\nพ่อค้ายิ้มให้ข้าและประกาศว่า: \"ข้ามีสินค้า หาก [ROOT.Char.GetLadyLord] ของข้ามีเหรียญ!\"\n\nสินค้าแปลกตาเหล่านี้สามารถทำกำไรได้งามเมื่อกลับถึงบ้าน... หรือบางทีอาจคุ้มค่าที่จะเก็บไว้เป็นของขวัญ"
 pilgrimage.6540.a:0 "กองนี้ดูเหมือนเป็นการลงทุนที่ชาญฉลาด!"
 pilgrimage.6540.a.flavor:0 "ข้าควรจะทำกำไรได้สองเท่าอย่างง่ายดาย"
 pilgrimage.6540.a.tt:0 "ท่านซื้อสินค้าแปลกถิ่น"
 pilgrimage.6540.b:0 "ของเหล่านี้ดูน่าสนใจ"
 pilgrimage.6540.b.flavor:0 "ข้าควรจะทำกำไรได้สามเท่าอย่างง่ายดาย"
 pilgrimage.6540.c:0 "สมบัติทางโลก? ช่างน่าเบื่อ"
 #Repentance
 pilgrimage.6750.t:0 "การสำนึกผิดใน [ROOT.Char.GetCurrentLocation.GetCounty.GetTitle.GetNameNoTierNoTooltip]"
 pilgrimage.6750.desc.intro:0 "ขณะที่ข้าเดินเข้าไปใน [ROOT.Char.GetFaith.HouseOfWorship] ความรู้สึกผิดอันใหญ่หลวงก็เข้ามาครอบงำข้า แสงสว่าง — ส่องสว่างแท่นบูชาราวกับวันฤดูร้อนที่มีแดดจ้า — หนาแน่นจนข้ารู้สึกเหมือนจะสัมผัสได้\n\nข้าใช้ชีวิตแบบไหนกัน? ข้าจะเป็น [ROOT.Char.GetTitleAsNameNoTooltip] แบบไหนได้? หรือ [ROOT.Char.GetMotherFather]? หรือ [ROOT.Char.Custom('GetDaughterSon')]?\n\nหากข้าไม่เปลี่ยน"
 pilgrimage.6750.desc.secret:0 "[repent_trait.GetNameNoTooltip]"
 pilgrimage.6750.desc.drunkard:0 "[GetTrait('drunkard').GetName( ROOT.Char )]"
 pilgrimage.6750.desc.hashishiyah:0 "[GetTrait('hashishiyah').GetName( ROOT.Char )]"
 pilgrimage.6750.desc.rakish:0 "[GetTrait('rakish').GetName( ROOT.Char )]"
 pilgrimage.6750.desc.irritable:0 "[GetTrait('irritable').GetName( ROOT.Char )]"
 pilgrimage.6750.desc.flagellant:0 "[GetTrait('flagellant').GetName( ROOT.Char )]"
 pilgrimage.6750.desc.contrite:0 "[GetTrait('contrite').GetName( ROOT.Char )]"
 pilgrimage.6750.desc.profligate:0 "[GetTrait('profligate').GetName( ROOT.Char )]"
 pilgrimage.6750.desc.comfort_eater:0 "[GetTrait('comfort_eater').GetName( ROOT.Char )]"
 pilgrimage.6750.desc.inappetetic:0 "[GetTrait('inappetetic').GetName( ROOT.Char )]"
 pilgrimage.6750.desc.outro:0 "ธรรมชาติของข้า แสงสว่างเดียวที่ข้าจะได้เห็นคือแสงจากไฟแห่ง [ROOT.Char.GetFaith.NegativeAfterLife]"
 pilgrimage.6750.a:0 ""ที่นี่ ข้าเกิดเป็น [ROOT.Char.GetWomanMan] คนใหม่""
 pilgrimage.6750.b:0 ""ถ้า เช่นนั้น ข้าก็ควรจะสนุกกับมันไปก่อน""
 #Theological Debate
 pilgrimage.6760.t:0 "การโต้แย้งแห่ง [ROOT.Char.GetCurrentLocation.GetNameNoTooltip]"
 pilgrimage.6760.desc.intro:0 "ขณะที่เราฟังคำสวดมนต์ตอนเช้า [bishop_pilgrim.GetTitledFirstName] และข้ามีการสนทนาที่มีชีวิตชีวา ซึ่งเบี่ยงเบนไปสู่เรื่องเทววิทยาอย่างรวดเร็ว\n\n"
 pilgrimage.6760.desc.christian:0 ""คงจะเป็นการโง่เขลาที่จะกล่าวว่า 'การบังเกิดเป็นเนื้อหนัง' หมายความว่าพระคริสต์ทรงกลายเป็นมนุษย์จากพระวจนะอย่างอธิบายไม่ได้และเข้าใจไม่ได้ โดยทรงรวมกันเป็นหนึ่งเดียวตามหลักสมมติฐาน"\n\n"แต่ ดังที่เนสโตริอุสเองกล่าวไว้" [bishop_pilgrim.GetTitledFirstName] โต้แย้ง "พระคริสต์ผู้เป็นมนุษย์ก็สามารถถูก ทำให้เป็นพระเจ้าได้ เป็นบุตรโดยพระคุณ ไม่ใช่โดยธรรมชาติ""
 pilgrimage.6760.a:0 ""ข้าจะไม่ฟังเรื่องไร้สาระที่ดูหมิ่นศาสนานี้!""
 pilgrimage.6760.b:1 ""และท่านก็รู้ว่าสภาเอเฟซัสดำเนินไปอย่างไรสำหรับ #EMP เขา#!""
 pilgrimage.6760.b.success:0 "[bishop_pilgrim.GetShortUIName] เชื่อแล้ว"
 pilgrimage.6760.b.failure:0 "[bishop_pilgrim.GetShortUIName] ยังคงยืนหยัดในตำแหน่งของ [bishop_pilgrim.GetHerHis]"
 pilgrimage.6760.c:0 ""พูดได้ดี สหาย ไปเดินเล่นกันเถอะ""
 #Do you wanna buy a cool relic?
 pilgrimage.6770.t:0 "วัตถุมงคลที่แท้จริง"
 pilgrimage.6770.desc.intro:0 "ขณะที่ข้าเดินไปตามแผงลอยในตลาด — หลีกเลี่ยงอาหารท้องถิ่นให้มากที่สุดเท่าที่จะทำได้ คลื่นผู้คนพยายามลากข้าเข้าไปในบ้านของพวกเขา — ข้าสังเกตเห็นการรวมตัวที่ใหญ่ขึ้นรอบๆ พ่อค้าคนหนึ่งโดยเฉพาะ\n\n"มาซื้อวัตถุมงคลที่แท้จริงในราคาที่จะ ทำให้ [ROOT.Char.GetFaith.WealthGodName] หัวเราะไปอีกหลายทศวรรษ"
 pilgrimage.6770.desc.christian:0 "[SCOPE.Custom('ChristianRelicName')|U]!"
 pilgrimage.6770.desc.islam:0 "[SCOPE.Custom('IslamRelic')|U]!"
 pilgrimage.6770.desc.buddhist:0 "[SCOPE.Custom('BuddhismRelicName')|U]!"
 pilgrimage.6770.desc.judaism:0 "[SCOPE.Custom('JudaismRelicName')|U]!"
 pilgrimage.6770.desc.fallback:0 "[merchant_relic.GetName|U]!"
 pilgrimage.6770.desc.outro:0 "พบในศาลเจ้าศักดิ์สิทธิ์แห่งนี้เมื่อไม่กี่วันก่อน!""
 pilgrimage.6770.a:0 "มัน #EMP ต้อง#! เป็นของข้า"
 pilgrimage.6770.b:0 ""ข้ามั่นใจว่าท่านคงไม่อยากขายวัตถุมงคลในราคาที่โลภมาก...""
 pilgrimage.6770.b.success:0 "[relic_merchant.GetShortUIName] ลดราคา"
 pilgrimage.6770.b.failure:0 "[relic_merchant.GetShortUIName] รู้สึกขุ่นเคืองกับข้อเสนอของท่าน"
 pilgrimage.6770.c:0 ""ข้ามีสิ่งที่ดีกว่าที่จะใช้ทองคำ""
 pilgrimage.6770.d:0 ""นี่ดูไม่ค่อยน่าเชื่อถือ...""
 #Recruit skillful local
 pilgrimage.6780.t:0 "ข้าราชบริพารผู้มีทักษะ"
 pilgrimage.6780.desc:0 "มีเพียงเท่านี้ที่ [ROOT.Char.GetWomanMan] สามารถสวดมนต์ได้โดยไม่มองหาวิธีอื่นที่สำคัญเท่าเทียมกันในการใช้เวลา และ [current_employer.GetTitledFirstName] มีที่พักที่น่ารัก ซึ่ง [current_employer.GetSheHe] กรุณาอนุญาตให้ข้าเยี่ยมชม\n\nข้าได้ยินเสียงบางอย่างมาจากห้องหนึ่ง "...และในการทำ เช่นนี้ ท่านจะบรรลุเทคนิคที่ยิ่งใหญ่ที่สุด" ข้าแอบมองเข้าไปข้างในและเห็น [stolen_courtier.GetTitledFirstName] กำลังอธิบายฝีมือของ [stolen_courtier.GetHerHis] ให้กับกลุ่มข้าราชบริพารที่สนใจ ซึ่งติดตามคำสอนของ [stolen_courtier.GetHerHis] อย่างกระตือรือร้น"
 pilgrimage.6780.a:0 "ช่างเป็นปรมาจารย์ผู้ประสบความสำเร็จอะไร เช่นนี้ บางทีข้าควรจ้าง [stolen_courtier.GetHerHim]"
 pilgrimage.6780.b:0 ""ผู้เชี่ยวชาญ เช่นนี้รู้สึกสูญเปล่าในราชสำนัก เช่นนี้...""
 pilgrimage.6780.b.success.t:0 "รับสมัครข้าราชบริพารแล้ว"
 pilgrimage.6780.b.success.desc:0 "[stolen_courtier.GetShortUIName] เข้าร่วมราชสำนักของท่าน"
 pilgrimage.6780.b.failure.t:0 "ข้อเสนอถูกปฏิเสธ"
 pilgrimage.6780.b.failure.desc:0 "[stolen_courtier.GetShortUIName] ปฏิเสธข้อเสนอของท่าน"
 pilgrimage.6780.c:0 "คนคนเดียวไม่คุ้มที่จะเสี่ยงกับความโกรธเกรี้ยวของ [current_employer.GetTitledFirstNameNoTooltip]"
 obligation_hook_salary:0 "เงินเดือนตามข้อผูกมัด"
 obligation_hook_tt:0 "#EMP ข้อผูกมัด#! [hooks|E] ลดเงินเดือน [court_position|E] ลง [gold_i]#P -50%#!"
 generic_cp_discount: "การลดตามสัญญา"
 #Meet local guru - trait flipping event
 pilgrimage.6790.t:0 "การตื่นรู้ทางจิตวิญญาณใน [ROOT.Char.GetCurrentLocation.GetCounty.GetTitle.GetNameNoTierNoTooltip]"
 pilgrimage.6790.desc:0 ""[spiritual_mentor.GetSheHe|U] เป็น [spiritual_mentor.GetWomanMan] ที่ดีที่สุดทั่วทั้งปฐพี [spiritual_mentor.GetSheHe|U] ใช้เวลาทุกวันเฝ้าดูสถานที่ศักดิ์สิทธิ์ ทุกครั้งที่เฝ้ายาม [spiritual_mentor.GetSheHe] กลับไปที่ค่ายของ [spiritual_mentor.GetHerHis] นอกเมือง และสวดมนต์จนรุ่งเช้าและดวงจันทร์ลับหายไป"\n\nข้าสูดหายใจลึกๆ ก่อนเข้าใกล้กองไฟที่ [spiritual_mentor.GetSheHe] พักผ่อน หลังจากได้ยินเกี่ยวกับอัจฉริยภาพของ [spiritual_mentor.GetHerHis]\n\n"ข้ารอเจ้าอยู่" [spiritual_mentor.GetSheHe] กล่าว มองมาที่ข้าโดยตรง "และ [spiritual_mentor.GetFaith.HighGodName] ก็ เช่นกัน เจ้าพร้อมที่จะละทิ้งวิถี [ROOT.Char.Custom('SinfulTrait')|l] ของเจ้าแล้วหรือยัง?""
 pilgrimage.6790.a:0 ""ข้าพร้อม ข้า #EMP พร้อม#!""
 pilgrimage.6790.b:0 ""ข้าสนใจคำสอนของท่านมากกว่า""
 pilgrimage.6790.c:0 ""ข้าไม่จำเป็นต้องเปลี่ยน #EMP อะไร#! เกี่ยวกับตัวเอง""
 #Entourage member feels The Calling
 pilgrimage.6800.t:0 "เสียงเรียก"
 pilgrimage.6800.desc:0 "เมื่อข้าเข้าไปในบริเวณศักดิ์สิทธิ์ ข้าพบ [called_member.GetTitledFirstName] กำลังจ้องมองแท่นบูชาด้วยท่าทางเหม่อลอย\n\n\"[ROOT.Char.Custom('FormOfAddressForLiege')|U]\" [called_member.GetSheHe] กล่าวอย่างไม่สะทกสะท้าน \"ข้ามีบางอย่างจะบอกท่าน [called_member.GetFaith.HighGodName] ได้ตรัสกับข้า และเสียงของ [called_member.GetFaith.HighGodHerHis] ก็ชัดเจน รุนแรง และแม่นยำ\"\n\n\"หากข้าสามารถอยู่ที่นี่ได้ ข้าปรารถนาที่จะอุทิศชีวิตให้กับศรัทธา [called_member.GetFaith.GetName] และกลายเป็น [GetTrait('devoted').GetName( called_member )]\""
 pilgrimage.6800.a:0 ""ข้าเข้าใจ เจ้าต้องทำในสิ่งที่เจ้าต้องทำ""
 pilgrimage.6800.b:0 ""เราไม่มี [ROOT.Char.GetFaith.HouseOfWorshipPlural] ที่บ้านหรือ?""
 pilgrimage.6800.c:0 ""ทิ้งเรื่องไร้สาระนั้นไปเสียทันที""
 pilgrimage.6800.d:0 ""อยู่ต่อ? เพื่อ #EMP วางแผน#! ต่อต้านข้า? ไม่มีทาง!""
 pilgrimage.6800.e:0 ""น่ายินดี! ข้าจะบริจาคด้วย!""
 pilgrimage.6800.e.tt:0 "นักบวชท้องถิ่นจะซาบซึ้งในท่าทีนี้อย่างมาก"
 #Do you wanna buy an indulgence?
 pilgrimage.6810.t:0 "การไถ่บาป"
 pilgrimage.6810.desc:0 ""...ตอนนี้เจ้าไปได้แล้ว ลูกเอ๋ย" ข้าได้ยิน [bishop_pilgrim.GetTitledFirstName] พึมพำเมื่อข้าเข้าไปใน [ROOT.Char.GetFaith.HouseOfWorship] ผู้แสวงบุญโค้งคำนับก่อนจากไป และข้าเห็นมือของนักบวชเป็นประกายด้วยทองคำ\n\n"อา ท่าน [ROOT.Char.GetTitleAsNameNoTooltip] ที่รัก ท่านต้องการล้างบาปของท่านด้วยหรือไม่? [religious_head_scope.GetTitledFirstName] ได้ออกคำสั่งให้มอบใบไถ่บาปแก่ผู้แสวงบุญทุกคนที่มาเยือน [ROOT.Char.GetCurrentLocation.GetNameNoTooltip] — ในราคาที่เหมาะสม แน่นอน""
 pilgrimage.6810.a:0 ""โปรดวิงวอนต่อ [ROOT.Char.GetFaith.HighGodName] แทนข้าด้วย""
 pilgrimage.6810.b:0 "คงจะเป็นประโยชน์ที่จะได้ใบหนึ่งสำหรับ [my_heir.GetFirstNameNoTooltip]"
 pilgrimage.6810.c:0 ""คนเราจะซื้อทางเข้าสู่ [ROOT.Char.GetFaith.DivineRealm] ได้อย่างไร?""
 #Do you wanna buy a pilgrim's guide?
 pilgrimage.6820.t:0 "คู่มือผู้แสวงบุญ"
 pilgrimage.6820.desc:0 "ตลาดของ [ROOT.Char.GetCurrentLocation.GetNameNoTooltip] คึกคักไปด้วยพ่อค้าตะโกนเป็นภาษาที่ข้าไม่เคยได้ยิน และขายเครื่องเทศที่ข้าไม่เคยลิ้มรส\n\n"คู่มือของผู้แสวงบุญ! เรียนรู้เส้นทางที่ปลอดภัยที่สุด ค้นพบความมหัศจรรย์ของ [ROOT.Char.GetCurrentLocation.GetNameNoTooltip]!" หนึ่งในนั้นตะโกน โบกหนังสือเล่มเล็กๆ มาทางข้า"
 pilgrimage.6820.a:0 ""ข้าเอาเล่มหนึ่ง!""
 pilgrimage.6820.b:0 ""ให้ข้าดูหน่อย — อา! และถ้าท่านเลี้ยวทางนี้...""
 pilgrim.6820.b.flavor:0 "ข้ามั่นใจว่าข้าเคยเห็นหนังสือเล่มนี้มาก่อน..."
 pilgrimage.6820.c:0 "[ROOT.Char.GetFaith.HighGodName] จะนำทางข้า"
 pilgrim_guide_artifact:0 "คู่มือผู้แสวงบุญ"
 pilgrim_guide_artifact_desc:0 "หนังสือที่อธิบายเส้นทางที่ปลอดภัยที่สุดสำหรับผู้แสวงบุญ รวมถึงจุดที่น่าสนใจ ณ สถานที่ศักดิ์สิทธิ์"
 #Admire the holy site in a religious way
 pilgrimage.6830.t:0 "ความเงียบ"
 pilgrimage.6830.desc:0 "เสียงสะท้อนของฝีเท้าของข้าเองเป็นเสียงเดียวใน [ROOT.Char.GetFaith.HouseOfWorship] ข้าอยู่คนเดียว สิ่งสุดท้ายที่ข้าจำได้จากโลกภายนอกคือใบหน้าของขอทานเหล่านั้นใกล้ประตู และท้องฟ้าสีฟ้าคราม ช่างห่างไกลเหลือเกินตอนนี้\n\nข้าเดินไปยังแท่นบูชาโดยรู้ว่ามีเพียงข้าเท่านั้น แต่ข้ารู้สึกเหมือนถูกจับตามองอย่างไม่ลดละ — ดวงตาอันเคร่งขรึมของ [ROOT.Char.GetFaith.HighGodName] เปิดกว้างอยู่เสมอ"
 pilgrimage.6830.a:0 "ถึงเวลาสวดมนต์"
 pilgrimage.6830.b:0 "ดูซุ้มประตูเหล่านั้นสิ... สวยงาม"
 pilgrimage.6830.c:0 "ข้าควรจะถวายเครื่องบูชา"
 pilgrimage.6830.c.tt:0 "ท่านจะสูญเสีย [votive_artifact.GetName]"
 #Ask a local priest to bless your artifact
 pilgrimage.6840.t:0 "พรทางวัตถุ"
 pilgrimage.6840.desc:0 "ผู้แสวงบุญวางตุ๊กตาบูชาลงหน้าแท่นบูชา ก้มศีรษะลง ข้าเห็น [blessed_bishop.GetTitledFirstName] ให้พรนางและพึมพำบางอย่างในหูนาง: "...ศักดิ์สิทธิ์" ข้าพอจะได้ยิน\n\n[blessed_bishop.GetFaith.BishopNeuter] ทำท่าทาง "ท่านนำบางสิ่งมาให้รับพรด้วยหรือไม่ ท่าน [ROOT.Char.GetTitleAsNameNoTooltip] ที่รัก?""
 pilgrimage.6840.a:0 ""โปรด ทำให้ [blessed_artifact.GetNameNoTooltip] ของข้าศักดิ์สิทธิ์ยิ่งขึ้น!""
 pilgrimage.6840.b:0 ""ให้ทุกคนเห็นชื่อเสียงของ [blessed_artifact.GetNameNoTooltip] ของข้า!""
 pilgrimage.6840.c:0 "ข้ามีสิ่งที่ดีกว่าที่จะใช้ทองคำ"
 pilgrimage.6840.a.tt:0 "ได้รับ [piety_i|E]#positive_value +2%#! [piety|E] รายเดือน"
 pilgrimage.6840.b.tt:0 "ได้รับ [prestige_i|E]#positive_value +0.5%#! [prestige|E] รายเดือน"
 blessed_artifact_desc:0 "[blessed_artifact.GetDesc]\n\nมันส่องประกายด้วยรัศมีอันบริสุทธิ์หลังจากได้รับพรในสถานที่ศักดิ์สิทธิ์แห่ง [holy_site_scope.GetNameNoTooltip]"

# A Master Thief
# by Laurence Kennedy
pilgrimage.6850.t: "จอมโจร"
pilgrimage.6850.desc: "ข้าตื่นจากการพักผ่อนที่ไม่สงบ และเบื้องหน้าข้าในความมืดมีร่างหนึ่งปรากฏขึ้น ขณะที่ข้ากำลังคิดถึงชีวิตหน้าของข้า [wise_priest.GetName] ก็โผล่ออกมาจากเงามืด ใบหน้าของ [wise_priest.GetHerHis] สว่างไสวด้วยรอยยิ้มบิดเบี้ยว\n\n“ท่าน [ROOT.Char.GetTitleAsNameNoTooltip] ผู้สูงศักดิ์ โปรดอภัยที่พวกเรารบกวน บทเรียนบางอย่างต้องสัมผัสด้วยตนเองจึงจะเข้าใจ\n\nโจรใช้เงา จุดบอด และเจ้าหน้าที่ทุจริตเพื่อช่วยในการก่ออาชญากรรมของ [fake_thief.GetHerHis] ในทำนองเดียวกัน [ROOT.Char.GetFaith.PriestNeuter] ที่ชั่วร้ายก็มักประพฤติตนเสเพลในเงามืด เทศนาหลักคำสอนเท็จในจุดบอดของท่าน และได้รับการยกย่องสู่ตำแหน่งสูงโดยเจ้าหน้าที่ทุจริต”"
pilgrimage.6850.a: "ข้าจะส่องแสงสว่างในที่ที่มีเงา"
pilgrimage.6850.b: "หากข้าตาบอด [ROOT.Char.GetCouncillorPosition( 'councillor_spymaster' ).GetPositionName] ของข้าจะเป็นดวงตาให้ข้า"
pilgrimage.6850.c: "ข้ารู้จักเจ้าหน้าที่ทุจริตคนหนึ่งที่เป็น [ROOT.Char.GetFaith.PriestNeuter] ที่ชั่วร้าย"
pilgrimage.6850.c.flavor: "ท่านจำคุก [ROOT.Char.GetCouncillorPosition( 'councillor_court_chaplain' ).GetPositionName] ของท่าน"
 ###Conclusion events
 #Summarizing our activity
 pilgrimage.7000.t:0 "บทสรุป"
 pilgrimage.7000.t_hajj:0 "$pilgrimage_header$ เฏาะวาฟวะดาอ์"
 pilgrimage.7000.t_obligatory:0 "[ROOT.Char.GetCurrentLocation.GetCounty.GetTitle.GetNameNoTierNoTooltip]: ... ทำแล้ว"
 pilgrimage.7000.desc_obligatory:0 "หลังจากรีบเร่งผ่านการเยี่ยมชมที่นี่ ความกังวลหลักของข้าคือการกลับบ้าน เพื่อที่ข้าจะได้ดำเนินกิจการตามปกติของข้าต่อไป\n\nหวังว่า [ROOT.Char.GetFaith.HighGodNameAlternate] จะเข้าใจว่าข้ามีเวลาน้อย แต่ข้าอาจยังคงได้รับความพึงพอใจจาก [ROOT.Char.GetFaith.HighGodHerHis] เกี่ยวกับ [ROOT.Char.GetInvolvedActivity.GetCurrentPhase.GetPhase.GetName] ของข้า\n\n[ROOT.Char.GetFaith.AltPriestTermPlural] ของข้าไม่ควรมีข้อร้องเรียนใดๆ ไม่ว่าในกรณีใด"
 pilgrimage.7000.intro:0 "ขณะที่เวลาของเรา ณ สถานที่ศักดิ์สิทธิ์แห่งนี้ใกล้จะสิ้นสุดลง"
 pilgrimage.7000.intro_hajj:0 "จุดสิ้นสุดของฮัจญ์ปีนี้ใกล้เข้ามาแล้ว หลังจากสองวันของการประกอบพิธีรอมีย์ อัล-ญะมะรอต หรือ 'การขว้างเสาหินใส่ชัยฏอน' ข้าพร้อมที่จะประกอบพิธีกรรมสุดท้ายคือเฏาะวาฟวะดาอ์และกล่าวอำลามักกะฮ์\n\n"
 pilgrimage.7000.desc_perfect_pious:0 "ข้าปลาบปลื้มใจที่การจาริกแสวงบุญครั้งนี้เป็นหนึ่งใน หากไม่ใช่ #EMP การจาริกแสวงบุญ#! ที่ทุ่มเทที่สุดตลอดกาล [ROOT.Char.GetFaith.HighGodNameAlternate] กำลังยิ้มให้ข้า"
 pilgrimage.7000.desc_high_pious:0 "ข้าพอใจที่รู้ว่าการตัดสินใจส่วนใหญ่ หากไม่ใช่ทั้งหมด ตลอดการเดินทาง [activity.Custom('PilgrimageLength')] ของเราได้ทำไปเพื่อพิสูจน์ความทุ่มเทของข้าต่อ [ROOT.Char.GetFaith.HighGodNameAlternate] และ [ROOT.Char.GetFaith.GetReligion.GetNameNoTooltip]"
 pilgrimage.7000.desc_mid_pious:0 "ข้ารู้สึกมั่นใจว่าแม้ข้าอาจไม่ใช่ผู้แสวงบุญที่เคร่งศาสนาที่สุด แต่ข้าได้พิสูจน์ความทุ่มเทของข้าต่อ [ROOT.Char.GetFaith.HighGodNameAlternate] ในหลายๆ ด้าน"
 pilgrimage.7000.desc_low_pious:0 "ข้ากังวลเล็กน้อยที่ข้าไม่ได้รับโอกาสพิสูจน์ความศรัทธาของข้าต่อ [ROOT.Char.GetFaith.HighGodName] มากเท่าที่ข้าอาจต้องการ"
 pilgrimage.7000.desc_perfect_worldly:0 "ข้าปลาบปลื้มใจกับการจาริกแสวงบุญครั้งนี้ สิ่งที่ข้าได้เห็นและประสบการณ์ที่ข้าได้รับ — นี่คือความสำเร็จอย่างแท้จริง!"
 pilgrimage.7000.desc_high_worldly:0 "ข้าพอใจที่รู้ว่าการเดินทาง [activity.Custom('PilgrimageLength')] ของเราได้ตอบสนองแง่มุมทางโลกของ [ROOT.Char.GetFaith.GetReligion.GetNameNoTooltip] และโดยนัยแล้ว ตัวข้าเองด้วย"
 pilgrimage.7000.desc_mid_worldly:0 "ข้าอาจพลาดโอกาสทางโลกไปบ้าง แต่โดยรวมแล้วข้ามีความสุขกับประสบการณ์นี้"
 pilgrimage.7000.desc_low_worldly:0 "ข้ากังวลเล็กน้อยที่ข้าไม่ได้รับประสบการณ์เกี่ยวกับวัฒนธรรมและสถานที่ท่องเที่ยวอื่นๆ มากเท่าที่ข้าอาจต้องการ"
 pilgrimage.7000.outro_buried_predecessor_here:0 "\n\nแม้จะมีเหตุการณ์โชคร้ายที่นำไปสู่การสิ้นพระชนม์ของบรรพบุรุษของข้า [old_pilgrimage_host.GetTitledFirstNamePossessive] และความโศกเศร้าที่เห็นได้ชัด ซึ่ง แต่งแต้มการเดินทางครั้งนี้ — การจาริกแสวงบุญเองกลับกลายเป็นประสบการณ์ที่น่าสนใจ ซึ่งข้าจะจดจำไว้อย่างรักใคร่"
 pilgrimage.7000.outro_bury_predecessor_home:0 "\n\nบัดนี้เราได้ทำสิ่งที่สมเกียรติและกำลังสรุปการจาริกแสวงบุญของ [old_pilgrimage_host.GetTitledFirstNamePossessive] ไปยังสถานที่แห่งนี้แล้ว สิ่งที่เหลืออยู่คือการกลับบ้านอย่างปลอดภัยและนำ [old_pilgrimage_host.GetHerHim] ไปสู่การพักผ่อนครั้งสุดท้ายของ [old_pilgrimage_host.GetHerHis]"
 pilgrimage.7000.outro_first:0 "\n\nนี่เป็นการจาริกแสวงบุญครั้งแรกของข้า — และ ในขณะที่ไม่มีการจาริกแสวงบุญใดเหมือนกันทุกประการ — ข้ารู้สึกมั่นใจว่าข้าคุ้นเคยกับสิ่งที่คาดหวังจากการเดินทางทางจิตวิญญาณประเภทนี้ในอนาคตมากขึ้น"
 pilgrimage.7000.outro_second:0 "\n\nนี่เป็นการจาริกแสวงบุญครั้งที่สองของข้า ข้าอดไม่ได้ที่จะเปรียบเทียบกับการเยี่ยมชมครั้งก่อนของข้าที่ [first_pilgrimage_memory.MakeScope.Var('pilgrimage_destination').GetProvince.GetNameNoTooltip] ในความศักดิ์สิทธิ์ทั้งหมดของมัน"
 pilgrimage.7000.outro_second_revisit:0 "\n\nการจาริกแสวงบุญครั้งนี้เป็นการมาครั้งที่สองของข้า แต่ยังเป็นการกลับมาเยี่ยมชมสถานที่ศักดิ์สิทธิ์ [ROOT.Char.GetCurrentLocation.GetNameNoTooltip] อีกครั้ง ข้าไม่เสียใจที่มาที่นี่อีกครั้งและทึ่งในความศักดิ์สิทธิ์และความงดงามของมัน"
 pilgrimage.7000.outro_multi:0 "\n\nจากการจาริกแสวงบุญ [ROOT.Char.Custom('PilgrimageAmount')] ครั้งทั้งหมดของข้า ครั้งนี้เป็นการให้ความกระจ่างมากที่สุดเท่าที่เคยมีมา"
 pilgrimage.7000.outro_first_hajj:0 "\n\nนี่เป็นฮัจญ์ครั้งแรกของข้า ข้ายินดีที่ได้เดินทางมาที่นี่ เข้าร่วมในพิธีกรรมและพบปะสหายร่วมศรัทธา อย่างแท้จริง ข้ารู้สึกว่าจิตวิญญาณของข้าได้รับการยกระดับและใกล้ชิดกับ [ROOT.Char.GetFaith.HighGodName] มากขึ้นกว่าเดิม"
 pilgrimage.7000.outro_second_hajj:0 "\n\nนี่เป็นฮัจญ์ครั้งที่สองของข้า ข้าได้พบทั้งเพื่อนใหม่และได้ทำความคุ้นเคยกับใบหน้าที่คุ้นเคยจากการเยี่ยมชมครั้งล่าสุดของข้าอีกครั้ง"
 pilgrimage.7000.outro_multi_hajj:0 "\n\nเคยมาที่นี่หลายครั้งแล้ว เป็นความยินดีอย่างแท้จริงเสมอที่ได้ประกอบพิธีฮัจญ์ เรารวมกันเป็นหนึ่งภายใต้ศรัทธาของเรา และเราเป็นประชากรของ [ROOT.Char.GetFaith.HighGodNamePossessive] อย่างแท้จริง"
 pilgrimage.7000.outro_new_holy_site:0 "\n\nข้ายังตื่นเต้นกับความคิดที่ได้เยี่ยมชมสถานที่ศักดิ์สิทธิ์แห่งใหม่!"
 pilgrimage.7000.a:0 "[ROOT.Char.GetCurrentLocation.GetCounty.GetTitle.GetNameNoTierNoTooltip] เป็นเกียรติอย่างยิ่ง"
 pilgrimage.7000.a_cynical:0 "แม้จะน่าสนใจ แต่ข้าก็ตั้งตารอที่จะได้นอนในเตียงของตัวเอง"
 pilgrimage.7000.a_hajj:0 "ขอให้ข้าได้เห็นกำแพงของท่านอีกครั้ง!"
 pilgrimage.7000.a_hajj_cynical:0 "แม้จะสงสัย แต่มัน #EMP ก็#! ยิ่งใหญ่มาก"
 pilgrimage.7000.a.tt:0 "ถึงเวลาเริ่มเดินทางกลับบ้าน"
 cultural_acceptance_gain_worldly_pilgrimage:0 "การจาริกแสวงบุญทางโลกเปลี่ยนแปลงการยอมรับทางวัฒนธรรม"
 pilgrimage.7000.b: "ข้าสำนึกผิด!"

 ###Generic Pilgrimage Return Events
 #Nice spiritual journey
 pilgrimage.9001.t:0 "$pilgrimage_header$ การกลับมา"
 pilgrimage.9001.desc_intro:0 "การเดินทางของข้ายาวนาน แต่ในที่สุดข้าก็กลับมาถึงบ้านอีกครั้ง "
 pilgrimage.9001.desc_invalidated:0 "\n\nเนื่องจากเหตุการณ์โชคร้าย การจาริกแสวงบุญของข้าจึงถูกตัดให้สั้นลง และน่าเสียดายที่ข้าไม่ได้ไปเยี่ยมชม [missed_holy_site.GetNameNoTooltip] มันกวนใจข้า แต่น้อยลงทุกวัน\n\nข้าทำได้เพียงสันนิษฐานว่าทั้งหมดนี้เป็นส่วนหนึ่งของแผนการของ [ROOT.Char.GetFaith.HighGodNameAlternatePossessive]"
 pilgrimage.9001.desc_buried_there:0 "ด้วยความตั้งใจที่จะเสร็จสิ้นการจาริกแสวงบุญของ [old_pilgrimage_host.GetTitledFirstNamePossessive] บัดนี้ข้าพักผ่อนอย่างสบายใจเมื่อรู้ว่า [old_pilgrimage_host.GetSheHe] มีสถานที่พักผ่อนสุดท้ายของ [old_pilgrimage_host.GetHerHis] ในความศักดิ์สิทธิ์ของ [burial_location.GetNameNoTierNoTooltip]\n\nและ ในขณะที่หลายสิ่งยังคงเหมือนเดิม [ROOT.Char.GetFaith.AltPriestTermPlural] ของข้ายืนยันว่าการเดินทางอันศักดิ์สิทธิ์นี้ได้เปลี่ยนแปลงบางอย่างเกี่ยวกับข้า ไม่ว่าข้าจะเห็นด้วยตัวเองหรือไม่ก็ตาม"
 pilgrimage.9001.desc:1 "แม้ว่าหลายสิ่งหลายอย่างจะยังคงเหมือนเดิม แต่บางสิ่งก็เปลี่ยนไปในวิธีที่เหล่า [ROOT.Char.GetFaith.PriestNeuterPlural] ปฏิบัติต่อข้า\n\nข้าได้ผ่านการเดินทางของ[ROOT.Char.GetWomanMan]ผู้ศักดิ์สิทธิ์ และพวกเขายืนกรานว่ามันได้เปลี่ยนแปลงบางอย่างเกี่ยวกับตัวข้า ไม่ว่าข้าจะมองเห็นมันด้วยตนเองหรือไม่ก็ตาม"
 pilgrimage.9001.a:0 "เป็นการดีที่ได้กลับบ้าน"
 pilgrimage.9001.a_invalidated:0 "ให้มันเป็นไปตามที่มันจะเป็น"
 pilgrimage.9001.a.tt:0 "การเดินทางของท่านสิ้นสุดลงแล้ว"
 #Bury old host back home
 pilgrimage.9010.t:0 "$pilgrimage_header$ การกลับบ้าน"
 pilgrimage.9010.desc.relation_family:0 "เรามาถึง [ROOT.Char.GetCurrentLocation.GetNameNoTooltip] ในช่วงบ่ายแก่ๆ และคนรับใช้ #EMP คนรับใช้ของข้า#! ก็เริ่มจัดการที่จำเป็นทันทีเพื่อนำ [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('old_pilgrimage_host'))] ของข้าไปสู่การพักผ่อนครั้งสุดท้ายของ [old_pilgrimage_host.GetHerHis]\n\n"
 pilgrimage.9010.desc.relation_liked:0 "เรามาถึง [ROOT.Char.GetCurrentLocation.GetNameNoTooltip] ในช่วงบ่ายแก่ๆ และคนรับใช้ #EMP คนรับใช้ของข้า#! ก็เริ่มจัดการที่จำเป็นทันทีเพื่อนำ [old_pilgrimage_host.GetFirstName] ที่รักไปสู่การพักผ่อนครั้งสุดท้ายของ [old_pilgrimage_host.GetHerHis]\n\n"
 pilgrimage.9010.desc.relation_neutral:0 "เรามาถึง [ROOT.Char.GetCurrentLocation.GetNameNoTooltip] ในช่วงบ่ายแก่ๆ และคนรับใช้ #EMP คนรับใช้ของข้า#! ก็เริ่มจัดการที่จำเป็นทันทีเพื่อนำ [old_pilgrimage_host.GetTitledFirstName] ไปสู่การพักผ่อนครั้งสุดท้ายของ [old_pilgrimage_host.GetHerHis]\n\n"
 pilgrimage.9010.desc.turned_back_liked:0 "ด้วยใจที่หนักอึ้ง ข้าดูแลพิธีกรรม และพยายามหาความสบายใจในความจริงที่ว่า [ROOT.Char.GetFaith.HighGodName] ต้องอยู่กับ [old_pilgrimage_host.GetHerHim] อย่างแท้จริงเมื่อ [old_pilgrimage_host.GetSheHe] เสียชีวิต ระหว่างทางไปยังสถานที่ศักดิ์สิทธิ์แห่ง [previous_holy_site.GetNameNoTierNoTooltip]\n\nท้ายที่สุดแล้ว [ROOT.Char.GetFaith.HighGodNameAlternate] ควรจะเฝ้าดูใครหากไม่ใช่ผู้แสวงบุญ?"
 pilgrimage.9010.desc.turned_back_neutral:0 "ในขณะที่ข้ายังคงคุ้นเคยกับ [ROOT.Char.Custom('GetRealmOrDomicile')|l] ใหม่ของข้า โดยมี [ROOT.Char.Custom('GetCourtierPlural')|l] รีบมาอยู่ข้างกายข้าเพื่อพยายามเอาใจข้า การนำร่างของ [old_pilgrimage_host.GetTitledFirstName] กลับมาช่วยตอกย้ำความจริงที่ว่า [old_pilgrimage_host.GetSheHe] จะไม่กลับมาและ #EMP ข้า#! คือ [ROOT.Char.GetTitleAsNameNoTooltip] คนใหม่"
 pilgrimage.9010.desc.there_and_back_liked:0 "ขณะที่โศกเศร้าต่อการจากไปของ [old_pilgrimage_host.GetHerHis] ข้าพบความปลอบใจในความจริงที่ว่าข้าได้ทำตามความปรารถนาของ [old_pilgrimage_host.GetHerHis] และเสร็จสิ้นการจาริกแสวงบุญของเราไปยัง [previous_holy_site.GetNameNoTierNoTooltip]\n\nอย่างแท้จริง [old_pilgrimage_host.GetSheHe] ต้องพอใจไม่ว่าจะอยู่ที่ใด และนั่น ทำให้รอยยิ้มที่ไม่แน่นอนปรากฏบนใบหน้าของข้า"
 pilgrimage.9010.desc.there_and_back_neutral:0 "การเดินทางไปยัง [previous_holy_site.GetNameNoTierNoTooltip] และกลับมาเพื่อเป็นเกียรติแก่ความปรารถนาของ [old_pilgrimage_host.GetTitledFirstNamePossessive] ทำให้ข้าได้รับความน่าเชื่อถือจาก [ROOT.Char.Custom('GetCourtierPlural')|l] ของ [old_pilgrimage_host.GetHerHis] #EMP ข้าราชบริพารของข้า#! และข้าเริ่มคุ้นเคยกับการเป็น [ROOT.Char.GetTitleAsNameNoTooltip] คนใหม่ที่นี่"
 pilgrimage.9010.desc.invalidated_pilgrimage_liked:0 "ข้าโศกเศร้าต่อการจากไปของ [old_pilgrimage_host.GetHerHis] และรู้สึกเสียใจอย่างยิ่งที่ข้าไม่ได้นำ [old_pilgrimage_host.GetHerHim] ไปพักผ่อนที่ [previous_holy_site.GetNameNoTierNoTooltip]"
 pilgrimage.9010.desc.invalidated_pilgrimage_neutral:0 "ข้าหงุดหงิดเล็กน้อยที่ข้าไม่ได้รับโอกาสนำ [old_pilgrimage_host.GetHerHim] ไปพักผ่อนที่ [previous_holy_site.GetNameNoTierNoTooltip] แต่โดยรวมแล้ว [old_pilgrimage_host.GetSheHe] ก็ได้พักผ่อนอย่างสงบในที่สุด"
 pilgrimage.9010.a:0 "[ROOT.Char.GetCurrentLocation.GetNameNoTooltip] หนึ่งใจ หนึ่งบ้าน"
 pilgrimage.9010.a_interrupted:0 "อย่างน้อยเราก็กลับบ้านและปลอดภัยดี"
 pilgrimage.9010.a_adventurer: "อย่างน้อยเราก็กลับมาอย่างปลอดภัย"
 pilgrimage.9010.a.flavor:0 "$pilgrimage.4020.a.flavor$"
 #Follow-up to exotic wares event
 pilgrimage.9100.t:0 "$pilgrimage_header$ สินค้าแปลกถิ่น"
 pilgrimage.9100.desc_intro:0 "หลังจากแบกสินค้าแปลกถิ่นของข้ามาตลอดทางจาก [ROOT.Var('6540_exotic_wares_location').GetProvince.GetName]"
 pilgrimage.9100.desc:0 "ตอนนี้ข้าต้องตัดสินใจว่าจะทำอย่างไรกับมัน\n\nข้าควรจะขายมันเพื่อทำกำไร หรือบางทีอาจเก็บไว้เป็นของขวัญสำหรับแผนการส่วนตัวครั้งต่อไปของข้า... ?"
 pilgrimage.9100.desc_has_gift:0 "ถึงเวลาเก็บเกี่ยวผลตอบแทนและขายมันเพื่อทำกำไรแล้ว"
 pilgrimage.9100.a:0 "เหรียญพูดกับข้า"
 pilgrimage.9100.a_double.tt:0 "ท่านขายสินค้าได้กำไรสองเท่า"
 pilgrimage.9100.a_triple.tt:0 "ท่านขายสินค้าได้กำไรสามเท่า"
 pilgrimage.9100.a_has_gift:0 "ไม่ว่ากันถ้าข้าจะเอา!"
 pilgrimage.9100.b:0 "คงจะฉลาดกว่าที่จะเก็บสิ่งเหล่านี้ไว้"
 pilgrimage.9100.b.tt:0 "ท่านจะได้รับโอกาสใช้สินค้าเพื่อเพิ่มพลังแผนการและโอกาสสำเร็จของ [personal_scheme|E] ครั้งต่อไปของท่าน"
 
 pilgrimage_seasia.100.t: "$pilgrimage_header$ นักงมมุก"
 pilgrimage_seasia.100.desc: "ขณะที่ [Glossary( 'จง', 'DJONG_GLOSS' )] ของเราแล่นเลียบขอบของ [background_terrain_scope.GetName] เราตัดสินใจหยุดพักชั่วครู่ใน [background_terrain_scope.Custom('TerrainTypeProvince')] ชายฝั่ง [background_terrain_scope.Custom('TerrainTypeProvincePrefix')]\n\nร่างหนึ่งปรากฏขึ้นจากผืนน้ำ เป็นเด็ก\n\n\"วิญญาณของหอยมือเสือยักษ์บอกข้าให้นำสมบัติของมันมามอบเป็นของขวัญแก่ [ROOT.Char.GetTitleAsName] ที่รออยู่เบื้องบน\" เด็กน้อยยื่นมือของ [pearl_diver_child.GetHerHis] ออกมา มีไข่มุกวางอยู่ภายใน"
 pilgrimage_seasia.100.a: "วิญญาณสื่อสารกับเด็กคนนี้ ข้าต้องดูแล [pearl_diver_child.GetHerHim]"
 pilgrimage_seasia.100.b: "นี่คือลางบอกเหตุจาก [ROOT.Char.GetFaith.HighGodName]!"
 pilgrimage_seasia.100.c: "ของประดับที่สวยงาม ขอบใจนะ เด็กน้อย"
 DJONG_GLOSS: "เรือเดินทะเลของชวาในยุคกลาง สร้างจากไม้สักและยึดเข้าด้วยกันโดยไม่ใช้เหล็ก"
 
 pilgrimage_seasia.200.t: "$pilgrimage_header$ วิญญาณป่าชายเลน"
 pilgrimage_seasia.200.desc: "ขณะที่ข้าสำรวจทิวทัศน์ [background_terrain_scope.Custom('TerrainTypeProvincePrefix')] ของ [background_terrain_scope.GetName] ชายฝั่งของมันก็ถูกขัดจังหวะด้วยพงป่าชายเลน\n\n[Glossary( 'จง', 'DJONG_GLOSS' )] ของเราแล่นช้าๆ เข้าไปในกลุ่มเรือเล็กๆ ชาวประมงกำลังโปรยข้าวสารลงไปในน้ำที่เต็มไปด้วยโคลน\n\n\"ของถวายแด่วิญญาณ ท่าน [ROOT.Char.GetTitleAsName]\" [local_character.GetWomanMan]ชาวประมงคนหนึ่งกล่าว \"มันช่วยให้เราปลอดภัยจากอันตราย\""
 pilgrimage_seasia.200.a: "ขอให้[local_character.GetWomenMen]ชาวประมงเข้าร่วมเป็นผู้นำทาง"
 pilgrimage_seasia.200.b: "โยนข้าวสารลงไปเล็กน้อย"
 pilgrimage_seasia.200.c: "นี่มันน่าขนลุก... รีบไปกันเถอะ"
 local_fishermen_modifier: "ชาวประมงท้องถิ่น"
 local_fishermen_modifier_desc: "คณะเดินทางนี้มีกลุ่มชาวประมงท้องถิ่นร่วมทางไปด้วย"
 
 pilgrimage_seasia.300.t: "$pilgrimage_header$ คำทำนายที่ดี"
 pilgrimage_seasia.300.desc: "คลื่นของ [background_terrain_scope.GetName] กระทบกับลำเรืออย่างแผ่วเบา — [ROOT.Char.Custom('GetRandomRegionalWildDaytimeBird')] ตัวหนึ่งบินวนอยู่เหนือเสากระโดงเรือ โต้ลมที่กำลังแรงขึ้นเรื่อยๆ\n\nคำทำนายที่ดีที่ข้าได้รับนั้นเป็นจริง เราจะไปถึง [destination.GetName] ในไม่ช้า!"
 pilgrimage_seasia.300.a: "ขอให้ลมนี้จงพัดต่อไป!"
 good_prophecy_travel_modifier: "คำทำนายที่ดี"
 good_prophecy_travel_modifier_desc: "คำทำนายที่ตัวละครนี้ได้รับเป็นจริง ช่วยเร่งการเดินทางของพวกเขา"
 
 pilgrimage_seasia.400.t: "$pilgrimage_header$ ศาลลอยน้ำ"
 pilgrimage_seasia.400.desc: "ขณะที่ชายฝั่งของ [background_terrain_scope.GetName] ปรากฏสู่สายตา เรือขนาดใหญ่ที่บรรทุกศาล [local_character.GetFaith.GetAdjective] ไว้บนดาดฟ้าก็ปรากฏขึ้น เช่นกัน เมื่อเข้าใกล้ เราได้รับการต้อนรับจากร่างต่างๆ บนเรือ — [GetTrait('devoted').GetName( local_character )]ตาบอด ประสานมือสวดมนต์อย่างแรงกล้า\n\n\"ยินดีต้อนรับ ท่าน [ROOT.Char.GetTitleAsName]\" ผู้นำในหมู่พวกเขากล่าว \"มีสิ่งใดที่เราพอจะช่วยเหลือท่านได้บ้าง เหล่านักเดินเรือผู้เหนื่อยล้า?\""
 pilgrimage_seasia.400.a: "บอกข้าถึงความจริงของ [local_character.GetFaith.GetNameNoTooltip]"
 pilgrimage_seasia.400.b: "ท่านผู้มีปัญญา การเดินทางข้างหน้าเป็นอย่างไรบ้าง?"
 pilgrimage_seasia.400.c: "ได้โปรด อวยพรให้พวกเราด้วย"
 a_good_prophecy_tt: "ท่านได้รับคำทำนายที่เป็นมงคลสำหรับการเดินทางข้างหน้า... หรือบางทีอาจเป็นเพียงคำพูดที่ว่างเปล่า?"
 
 pilgrimage_seasia.500.t: "$pilgrimage_header$ ชาวประมงแห่ง [background_terrain_scope.GetNameNoTooltip]"
 pilgrimage_seasia.500.desc: "น่านน้ำชายฝั่งของ [background_terrain_scope.GetName] เต็มไปด้วยชาวประมง กำลังเหวี่ยง [Glossary('จาลาส', 'JALA_GLOSS')] และลาก [Glossary('บูบัส', 'BUBU_GLOSS')] ขึ้นมา จากนั้นทันใดนั้น — ความโกลาหลก็บังเกิด!\n\n\"นั่นคือ [ROOT.Char.GetTitleAsNameNoTooltip]!\" เสียงของ[local_character.GetWomanMan]คนหนึ่งดังขึ้น \"เร็วเข้า ทุกคน เราต้องอาบแสงแห่งการสถิตอันศักดิ์สิทธิ์ของ [ROOT.Char.GetHerHis]!\" ในชั่วพริบตา [Glossary( 'จง', 'DJONG_GLOSS' )] ของเราก็ถูกห้อมล้อมด้วยเรือประมงที่กระตือรือร้น"
 pilgrimage_seasia.500.a: "มาเถิด ทุกคน และชื่นชมในความเมตตาของข้า!"
 pilgrimage_seasia.500.b: "แยกย้ายกันไป ราษฎรของข้า และบอกเล่าเรื่องราวของ [local_character.GetFaith.GetNameNoTooltip] ให้ทุกคนฟัง"
 pilgrimage_seasia.500.c: "มาร่วมกับข้าเถิด โอ้ ราษฎรผู้ [local_character.Custom('RandomPositiveShallowAdjective')] ที่สุดของข้า!"
 pilgrimage_seasia.500.d: "รีบออกไปจากที่นี่กันเถอะ..."
 coastal_ruler_visit_travel_modifier: "การเยือนของผู้ปกครองชายฝั่ง"
 coastal_ruler_visit_travel_modifier_desc: "ผู้ปกครองของเคาน์ตีนี้ได้แสดงความเมตตาต่อประชากรชายฝั่ง"
 JALA_GLOSS: "แหทรงกลมที่มีตะกั่วถ่วงรอบขอบ เหวี่ยงด้วยมืออย่างชำนาญจากเรือหรือชายฝั่ง"
 BUBU_GLOSS: "กับดักปลาที่ทำจากไม้ไผ่อย่างประณีต มักวางไว้ในบริเวณปากแม่น้ำและสามเหลี่ยมปากแม่น้ำป่าชายเลน"
 
 pilgrimage_seasia.600.t: "$pilgrimage_header$ เครื่องเซ่นไหว้จากข้าว"
 pilgrimage_seasia.600.desc: "ข้ามองออกไปทั่ว [background_terrain_scope.GetName] ขณะที่ [ROOT.Char.Custom2('RelationToMeShort', entourage_character)] ของข้า [entourage_character.GetFirstNameNicknamed] ยืนพิงอยู่ข้างๆ [entourage_character.GetSheHe|U] โปรยข้าวสารหนึ่งกำมือลงไปในทะเล\n\n\"[entourage_character.Custom2('RelationToMeShort', root_scope)] ของข้า ข้าวสารนี้ไม่ใช่สำหรับปลา — แต่เพื่อเตือนเหล่าวิญญาณว่าเราเป็นแขกที่มาเยือน\" [entourage_character.GetSheHe|U] ยื่นถุงให้ข้า \"เพื่อการเดินทางที่ปลอดภัย\""
 pilgrimage_seasia.600.a: "สีของท้องฟ้า... เป็นลางบอกเหตุหรือ?"
 pilgrimage_seasia.600.b: "มาเอาใจเหล่าวิญญาณด้วยกันเถอะ สหาย"
 pilgrimage_seasia.600.c: "ข้าว่าข้าจะกินข้าวเป็นอาหารเย็น"
 
 pilgrimage_seasia.700.t: "$pilgrimage_header$ เหยื่อของนาค"
 pilgrimage_seasia.700.desc: "แม้สายฝนจะบดบังทัศนวิสัย ข้าก็มองเห็น [local_character.GetWomanMan] ผู้หนึ่งเกาะเศษไม้ที่ลอยอยู่ คนของข้าดึง [local_character.GetHerHim] ขึ้นเรือทันที\n\n\"ผู้ช่วยชีวิตที่ [ROOT.Char.Custom('ComplimentAdjective')|U] ข้าเป็นหนี้ชีวิตท่าน!\" [local_character.GetSheHe] หอบหายใจ \"[Glossary('สำปั้น', 'SAMPAN_GLOSS')] ของข้าถูก [Glossary('นาค', 'NAGA_GLOSS')] ที่ชั่วร้ายลากลงไป ข้าน่าจะรู้ดีกว่านี้ว่าไม่ควรออกมาในวันที่โชคร้าย...\""
 pilgrimage_seasia.700.a: "โชคของเจ้าเปลี่ยนแล้ว ตอนนี้เจ้าอยู่กับข้า"
 pilgrimage_seasia.700.b: "เจ้าต้องคำสาป และต้องจากไปในไม่ช้า"
 SAMPAN_GLOSS: "เรือท้องแบนขนาดเล็กที่พบได้ทั่วไปในแม่น้ำและน่านน้ำชายฝั่งของเอเชียตะวันออกเฉียงใต้ โดยทั่วไปทำจากไม้และพายหรือถ่อ ใช้สำหรับตกปลา เดินทาง และค้าขายทางแม่น้ำ"
 NAGA_GLOSS: "จิตวิญญาณพญานาค (งู) ที่เป็นที่เคารพนับถือในเอเชียใต้และตะวันออกเฉียงใต้ มักถูกมองว่าเป็นผู้พิทักษ์น้ำ ความอุดมสมบูรณ์ และโลกบาดาล นาคไม่เป็นเทพโดยสมบูรณ์หรือเป็นมรรตัย จึงเป็นที่ยำเกรงและเคารพบูชาในเวลาเดียวกัน"
 
 pilgrimage_seasia.800.t: "$pilgrimage_header$ เงาในผืนน้ำ"
 pilgrimage_seasia.800.desc: "ผืนน้ำอันบริสุทธิ์ของ [background_terrain_scope.GetNameNoTooltip] ปั่นป่วนเมื่อเงาขนาดมหึมาพุ่งผ่านไปเบื้องล่าง จากนั้นก็อีกเงา และอีกเงา จนรู้สึกเหมือน [Glossary( 'จง', 'DJONG_GLOSS' )] กำลังโคลงเคลงจากการเคลื่อนผ่านของพวกมัน\n\nข้ากำฉมวกแน่นขณะที่ลูกเรือเริ่มตะโกน ในท่ามกลางความโกลาหล ข้าจับคำที่ตื่นตระหนกได้คำหนึ่ง: #EMP \"[Glossary('พญานาค!', 'NAGA_GLOSS')]\"#!"
 pilgrimage_seasia.800.a: "เป็นลางบอกเหตุที่ดี พวกเขากำลังนำทางเราหรือ?"
 pilgrimage_seasia.800.b: "เร็วเข้า เราต้องถวายเครื่องเซ่นไหว้!"
 pilgrimage_seasia.800.c: "มันคือปลา... หยิบฉมวกมา"
 a_good_omen_tt: "บางทีนี่อาจเป็นลางดีสำหรับอนาคต..."
 
 pilgrimage_seasia.900.t: "$pilgrimage_header$ โจรสลัดเรือสำปั้น"
 pilgrimage_seasia.900.desc: "ขณะที่เราเข้าใกล้ชายฝั่งป่าชายเลนของ [background_terrain_scope.GetNameNoTooltip] [Glossary('สำปั้น', 'SAMPAN_GLOSS')] ก็พุ่งออกมาจากที่ซ่อน — โจรสลัดตะโกนโหวกเหวกและเหวี่ยงตะขอเกี่ยว พวกมันปีนขึ้น [Glossary( 'จง', 'DJONG_GLOSS' )] อย่างรวดเร็ว และข้าก็เผชิญหน้ากับหัวหน้าของพวกมัน\n\n\"ส่งทองของพวกเจ้ามา ไอ้พวกชาติหมา หรือข้าจะ...\" [local_character.GetSheHe] หยุดนิ่ง ทำ [Glossary('ปิดัง', 'PEDANG_GLOSS')] ของ [local_character.GetHerHis] หล่น \"อภัยให้เราด้วย ท่าน [ROOT.Char.GetTitleAsNameNoTooltip] ผู้ศักดิ์สิทธิ์! เราไม่ได้ตั้งใจจะทำอันตราย!\""
 pilgrimage_seasia.900.a: "อย่ากลัวเลย ความเมตตาของข้ายิ่งใหญ่นัก"
 pilgrimage_seasia.900.b: "พวกเจ้าเป็นทหารที่มีความสามารถ มาร่วมกับข้าสิ"
 pilgrimage_seasia.900.c: "[ROOT.Char.GetTitleAsNameNoTooltip] ต้องการเดินทางผ่านอย่างปลอดภัย!"
 PEDANG_GLOSS: "ดาบตรง คมเดียว ที่ใช้โดยนักรบชาวมลายูและชวา"
 
 pilgrimage_seasia.1000.t: "$pilgrimage_header$ พ่อค้าจากตานะห์ มักกะฮ์"
 pilgrimage_seasia.1000.desc: "ขณะที่เราแล่นเรือใน [background_terrain_scope.GetNameNoTooltip] เรือสินค้าขนาดมหึมาลำหนึ่งแล่นตัดผ่าน [Glossary('สำปั้น', 'SAMPAN_GLOSS')] และเข้ามาเทียบข้าง [local_character.GetWomanMan] ที่ แต่งกายอย่างมั่งคั่ง ซึ่งดูเหมือนจะมาจาก [Glossary('ดินแดนมักกะฮ์', 'TANAH_MAKKAH_GLOSS')] ปีนขึ้นมาบนเรือ\n\n\"ขอคารวะ ท่าน [ROOT.Char.GetTitleAsNameNoTooltip] ข้าคือ [local_character.GetFirstNameNicknamed] มาจาก [merchant_home.GetNameNoTier]\" [local_character.GetSheHe] โค้งคำนับ \"พวกเราคือพ่อค้าชาว [local_character.GetFaith.GetReligion.GetAdherentName] ที่กำลังมองหาท่าเรือเพื่อสร้าง [local_character.GetFaith.HouseOfWorship]\"\n\n\"แน่นอนว่าเรายินดีจ่ายอย่างงาม\""
 pilgrimage_seasia.1000.a: "[local_character.GetFaith.HighGodName] จะยอมรับพวกเราหรือไม่?"
 pilgrimage_seasia.1000.b: "[local_character.GetFaith.HighGodName]? ให้ข้าอธิบายถึงความศักดิ์สิทธิ์ของ [ROOT.Char.GetFaith.HighGodName] เถอะ"
 pilgrimage_seasia.1000.c: "พวกเจ้าอาจสร้าง [local_character.GetFaith.HouseOfWorship] ใน [mosque_location.GetNameNoTooltip] ได้"
 pilgrimage_seasia.1000.d: "ตกลงค้าขายเล็กน้อยแล้วเดินทางต่อ"
 TANAH_MAKKAH_GLOSS: "ในเอเชียตะวันออกเฉียงใต้ เมกกะ (มักกะฮ์) กลายเป็นคำเรียกโดยย่อของอาระเบียโดยรวม \"ตานะห์ มักกะฮ์\" (ดินแดนมักกะฮ์) แปลว่า \"ดินแดนแห่งเมกกะ\" และปรากฏในเอกสารโบราณของศาสนาอิสลามในภูมิภาคนี้"
 zealotry_intent_tt: "ท่านไม่มีเจตนาคลั่งศาสนา"
 
 pilgrimage_seasia.1100.t: "$pilgrimage_header$ กับดักหวาย"
 pilgrimage_seasia.1100.desc: "ขณะที่เราเดินไปตามเส้นทางแคบๆ ผ่าน [background_terrain_scope.Custom('TerrainTypeProvince')] [background_terrain_scope.Custom('TerrainTypeProvincePrefix')] ของ [background_terrain_scope.GetNameNoTooltip] เสียงหนึ่งก็ร้องเรียกจากเบื้องบน [local_character.GetWomanMan] ผู้หนึ่งห้อยหัวกลับหัว ติดอยู่ในกับดัก [Glossary('หวาย', 'RATTAN_GLOSS')]\n\n\"ช่วยด้วย! ข้าเหยียบกับดักหมูและต้องการผู้ช่วยชีวิตที่ [ROOT.Char.Custom('FormalComplimentAdjective')]!\" [local_character.GetSheHe] ตะโกน \"ข้าสาบานว่าข้าเป็นผู้นำทางที่ยอดเยี่ยม — ปล่อยข้า แล้วข้าจะร่วมทางไปกับท่าน!\""
 pilgrimage_seasia.1100.a: "เจ้าอาจร่วมทางไปกับเราได้"
 pilgrimage_seasia.1100.b: "จงบอกหมู่บ้านของเจ้าถึงความศรัทธาของข้า"
 pilgrimage_seasia.1100.c: "เหอะ ปล่อย [local_character.GetHerHim] ห้อยอยู่อย่างนั้นแหละ"
 RATTAN_GLOSS: "ปาล์มไม้เลื้อยที่เป็นที่ต้องการ เนื่องจากความแข็งแรงและความยืดหยุ่น ใช้สานตะกร้า ทำเครื่องผูกมัด และกับดัก หวายเป็นเครื่องมือทั่วไปในชีวิตป่าที่ใช้โดยนายพราน พ่อค้า และชาวบ้าน"
 
 pilgrimage_seasia.1200.t: "$pilgrimage_header$ ผู้พเนจรจากนาลันทา"
 pilgrimage_seasia.1200.desc: "ขณะเดินทางไปตามเส้นทางที่คดเคี้ยว เราพ [GetTrait('devoted').GetName( local_character )] ผู้หนึ่งตั้งแคมป์อยู่ข้าง [background_terrain_scope.Custom('GetRandomRegionalDangerSingular')] ใน [background_terrain_scope.Custom('TerrainTypeProvince')]\n\n\"ขอคารวะ เหล่าผู้แสวงบุญ\" [local_character.GetWomanMan] ผู้นั้นกล่าวอย่างแผ่วเบา \"ข้าคือบัณฑิต [local_character.GetFaith.GetAdjective] ผู้คงแก่เรียนจาก [GetBuilding('nalanda_university').GetName] กำลังมองหาสถานที่ที่สงบที่สุดใน [exploration_target.GetBaseNameNoTier] เพื่อการทำสมาธิ พวกท่านพอจะแบ่งปันความรู้เกี่ยวกับดินแดนนี้ได้หรือไม่?\""
 pilgrimage_seasia.1200.a: "หากท่านบอกข้าเกี่ยวกับศรัทธา [local_character.GetFaith.GetAdjectiveNoTooltip] ของท่าน!"
 pilgrimage_seasia.1200.b: "ได้ หากท่านอวยพร [blessed_artifact.GetNameNoTooltip] ของข้า?"
 pilgrimage_seasia.1200.c: "[other_barony.GetBaseNameNoTierNoTooltip] นั้นสงบที่สุดสำหรับการทำสมาธิ"
 improved_artifact_tt: "[blessed_artifact.GetName] จะได้รับตัวปรับ แต่งแบบสุ่ม"
 
 pilgrimage_seasia.1300.t: "$pilgrimage_header$ สระน้ำเสียงกบ"
 pilgrimage_seasia.1300.desc: "หลังจากลุยผ่าน [background_terrain_scope.Custom('GetRandomRegionalDangerSingular')] เราก็มาพบกับภาพที่หาได้ยาก — สระน้ำทรงกลมสมบูรณ์แบบที่ส่องสว่าง กบเรียงรายอยู่ริมฝั่งเหมือนพระตัวเล็กๆ ส่งเสียงร้องเป็นจังหวะราวกับกำลังสวดสรรเสริญ\n\nข้าวสาร ดอกไม้ และ [Glossary('ใบพลู', 'BETEL_LEAVES_GLOSS')] ลอยอยู่บนผิวน้ำ เป็นสัญญาณของเครื่องเซ่นไหว้ที่ถูกถวาย"
 pilgrimage_seasia.1300.a: "พักอยู่ที่นี่และไตร่ตรองสักหน่อย"
 pilgrimage_seasia.1300.b: "เรามาถวายข้าวสารกันเถอะ"
 pilgrimage_seasia.1300.c: "สวยงาม แต่เราต้องไปแล้ว"
 BETEL_LEAVES_GLOSS: "ใบไม้เงามันของเถาพลู เคี้ยวร่วมกับหมากและปูนขาว เป็นธรรมเนียมปฏิบัติที่พบได้ทั่วไปในเอเชียใต้และตะวันออกเฉียงใต้ มักใช้ในพิธีกรรมหรือการค้า"
 
 pilgrimage_seasia.1400.t: "$pilgrimage_header$ ใบหน้าของเทพ"
 pilgrimage_seasia.1400.desc: "ขณะที่เราเดินทัพผ่าน [background_terrain_scope.Custom('TerrainTypeProvince')] ที่เต็มไปด้วยหมอกของ [background_terrain_scope.GetName] รูปร่างหินขนาดมหึมาก็ปรากฏขึ้นเบื้องหน้า — ห่อหุ้มด้วยผ้าขาดรุ่งริ่ง พันกันยุ่งเหยิงด้วยเถาวัลย์ ข้าได้มาเผชิญหน้ากับเศียรของเทพ [character_faith.GetReligion.GetAdherentName] ดวงตาโบราณจ้องมองลึกเข้ามาในจิตวิญญาณของข้า\n\nนี่คือเทพองค์ใด... และข้า #EMP ถูกกำหนด#! ให้มาพบสิ่งนี้หรือไม่?"
 pilgrimage_seasia.1400.a: "คือ [character_faith.CreatorName] ผู้สร้าง"
 pilgrimage_seasia.1400.b: "คือ [character_faith.WealthGodName] ผู้ละโมบ"
 pilgrimage_seasia.1400.c: "คือ [character_faith.WarGodName] ผู้พิชิต"
 pilgrimage_seasia.1400.d: "คือ [character_faith.HighGodName]! ข้าถูกเรียกสู่ [character_faith.GetNameNoTooltip]!"
 pilgrimage_seasia.1400.e: "ไม่ต้องสงสัยเลย นี่คือเทพแห่งการเดินทาง"
 
 pilgrimage_seasia.1500.t: "$pilgrimage_header$ ปาวัง"
 pilgrimage_seasia.1500.desc: "ขณะฝ่าฟันผ่าน [background_terrain_scope.Custom('TerrainTypeProvince')] ของ [background_terrain_scope.GetName] ลมและฝนสาดซัดใบหน้าของเราดั่งลูกศรนับพัน ทันใดนั้น พายุก็สงบลง — ลมหยุดนิ่ง ฝนซาลง และดวงอาทิตย์ก็ปรากฏ\n\n\"ข้า ทำให้พายุสงบลงขณะที่ท่านเข้ามาใกล้\" [local_character.GetWomanMan] ผู้หนึ่งกล่าวด้วยน้ำเสียงที่เงียบขรึม แต่ทรงอำนาจ \"ข้าคือ [local_character.GetFirstNameNicknamed] เป็น [Glossary('ปาวัง', 'PAWANG_GLOSS')] พวกเขาเกรงกลัวข้าในแถบนี้\""
 pilgrimage_seasia.1500.a: "ข้าต้องการคน เช่นเจ้า"
 pilgrimage_seasia.1500.b: "ท่านช่วยอวยพรสภาพอากาศได้หรือไม่?"
 pilgrimage_seasia.1500.c: "ไร้สาระ อากาศก็แค่แปรปรวนเท่านั้น"
 PAWANG_GLOSS: "นักทำพิธีกรรมที่กล่าวกันว่าสามารถควบคุมสภาพอากาศ สัตว์ป่า และวิญญาณได้ เป็นที่ยำเกรงและเคารพนับถือในระดับที่เท่าเทียมกัน"
 good_weather_modifier: "อากาศดี"
 good_weather_modifier_desc: "อากาศที่ดีอวยพรแก่คณะเดินทางนี้"
