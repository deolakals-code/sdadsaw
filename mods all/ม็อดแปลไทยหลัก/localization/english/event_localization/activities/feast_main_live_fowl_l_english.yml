l_english: 
 feast_main_live_fowl.0002.t:1 "เรื่องสัตว์ปีกของ [fowl_dinner_target.GetFirstNamePossessive]"
 feast_main_live_fowl.0002.entremets_served:0 "คนรับใช้ยกอาหารคั่นเวลาที่ตก แต่งอย่างน่าประทับใจออกมา: [ROOT.GetCharacter.Custom('exotic_fowl_type')] หลายตัว ถูกถลกหนัง ปรุงสุกและยัดไส้ จากนั้น แต่งตัวใหม่ด้วยขนนกอันงดงาม อย่างไรก็ตาม ขณะที่ [fowl_dinner_target.GetTitledFirstName] นำมีด [fowl_dinner_target.GetHerHis] เข้าใกล้ตัวหนึ่ง สัตว์ปีกตัวนั้นก็ฟื้นขึ้นมาพร้อมกับเสียงกรีดร้อง! ตัวนี้ยังไม่ได้ปรุงสุกเลย! มันจิกจมูกของ [fowl_dinner_target.GetFirstNamePossessive] ก่อนจะพุ่งออกมาท่ามกลางแขกที่กรีดร้องและหัวเราะ"
 feast_main_live_fowl.0002.bird_killed:0 "\n\nการหลบหนีของ [ROOT.GetCharacter.Custom('exotic_fowl_type')] สิ้นสุดลงในไม่ช้า เมื่อ [fowl_bird_killer.GetTitledFirstName] ลุกขึ้นจากที่นั่ง [fowl_bird_killer.GetHerHis] และจับคอของมันอย่างเยือกเย็นและมีประสิทธิภาพ ด้วยการบิดมือ [fowl_bird_killer.GetHerHis] เสียงดังแคร็ก ทำให้ทั้งห้องโถงเงียบกริบ ความเงียบถูกทำลายลงด้วยเสียงครวญครางด้วยความเจ็บปวดของ [fowl_dinner_target.GetFirstNamePossessive] ขณะที่ [fowl_dinner_target.GetSheHe] กุมจมูก [fowl_dinner_target.GetHerHis] ที่มีเลือดออก"
 feast_main_live_fowl.0002.bird_chased_by_character:0 "\n\nขณะที่นกวิ่งพล่าน [fowl_bird_chaser.GetTitledFirstName] ก็ลุกขึ้นรับคำท้าทาย มันกลายเป็นการแสดงความบันเทิงอันยอดเยี่ยมที่ได้เห็น [fowl_bird_chaser.GetHerHim] ไล่ตามสัตว์คลุ้มคลั่งอย่างสิ้นหวังข้ามโต๊ะ ในที่สุด [fowl_bird_chaser.GetSheHe] ก็สามารถไล่ [ROOT.GetCharacter.Custom('exotic_fowl_type')] ไปทางประตูห้องโถงใหญ่ได้สำเร็จ ที่ ซึ่งมันหนีออกไปสู่อากาศบริสุทธิ์ท่ามกลางดวงดาวที่แจ่มชัด"
 feast_main_live_fowl.0002.bird_chased_away:0 "\n\nขณะที่ [ROOT.GetCharacter.Custom('exotic_fowl_type')] วิ่งพล่าน คนรับใช้จำนวนมากพยายามกันไม่ให้มันคว่ำอาหารจานอื่น ความบันเทิงที่ดีที่สุดมาในรูปแบบของพ่อครัวที่ไล่ตามมันด้วยทัพพี ซึ่งในที่สุดก็ไล่นกออกไปทางประตูห้องโถงใหญ่ ที่ ซึ่งมันหนีหายไปในยามค่ำคืน"
 feast_main_live_fowl.0002.a:0 "ช่างโกลาหลเสียจริง!"
 feast_main_live_fowl.0003.t:1 "เรื่องสัตว์ปีกของ [fowl_dinner_target.GetFirstNamePossessive]"
 feast_main_live_fowl.0003.entremets_served:0 "คนรับใช้กำลังยกอาหารคั่นเวลาที่ตก แต่งอย่างน่าประทับใจออกมา: [ROOT.GetCharacter.Custom('exotic_fowl_type')] ที่สง่างามหลายตัว ถูกถลกหนัง ปรุงสุกและยัดไส้ จากนั้น แต่งตัวใหม่ด้วยขนนกอันงดงาม อย่างไรก็ตาม ขณะที่ [fowl_dinner_target.GetTitledFirstName] นำมีด [fowl_dinner_target.GetHerHis] เข้าใกล้ตัวหนึ่ง สัตว์ปีกตัวนั้นก็ฟื้นขึ้นมาพร้อมกับเสียงกรีดร้อง! ตัวนี้ยังไม่ได้ปรุงสุกเลย! มันจิกจมูกของ [fowl_dinner_target.GetFirstNamePossessive] ก่อนจะพุ่งออกมาท่ามกลางแขกที่กรีดร้องและหัวเราะ"
 feast_main_live_fowl.0003.bird_killed:0 "\n\nการหลบหนีของ [ROOT.GetCharacter.Custom('exotic_fowl_type')] สิ้นสุดลงในไม่ช้า เมื่อ [fowl_bird_killer.GetTitledFirstName] ลุกขึ้นจากที่นั่ง [fowl_bird_killer.GetHerHis] และจับคอของมันอย่างเยือกเย็นและมีประสิทธิภาพ ด้วยการบิดมือ เสียงดังแคร็ก ทำให้ทั้งห้องโถงเงียบกริบ\n\nความเงียบถูกทำลายลงด้วยเสียงครวญครางด้วยความเจ็บปวดของ [fowl_dinner_target.GetFirstNamePossessive] ขณะที่ [fowl_dinner_target.GetSheHe] กุมจมูก [fowl_dinner_target.GetHerHis] ที่มีเลือดออก"
 feast_main_live_fowl.0003.bird_chased_by_character:0 "\n\nขณะที่นกวิ่งพล่าน [fowl_bird_chaser.GetTitledFirstName] ก็ลุกขึ้นรับคำท้าทาย มันกลายเป็นการแสดงความบันเทิงอันยอดเยี่ยมที่ได้เห็น [fowl_bird_chaser.GetHerHim] ไล่ตามสัตว์คลุ้มคลั่งอย่างสิ้นหวังข้ามโต๊ะ ในที่สุด [fowl_bird_chaser.GetSheHe] ก็สามารถไล่ [ROOT.GetCharacter.Custom('exotic_fowl_type')] ไปทางประตูห้องโถงใหญ่ได้สำเร็จ ที่ ซึ่งมันหนีหายไปในยามค่ำคืน"
 feast_main_live_fowl.0003.bird_chased_away:0 "ขณะที่ [ROOT.GetCharacter.Custom('exotic_fowl_type')] วิ่งพล่าน คนรับใช้จำนวนมากพยายามกันไม่ให้มันคว่ำอาหารจานอื่นและทำลายมื้ออาหาร ความบันเทิงที่ดีที่สุดมาในรูปแบบของพ่อครัวที่ไล่ตามมันด้วยทัพพี ซึ่งในที่สุดก็ไล่นกออกไปทางประตูห้องโถงใหญ่ ที่ ซึ่งมันหนีหายไปในยามค่ำคืน"
 feast_main_live_fowl.0003.a:0 "อา ไม่มีงานเลี้ยงใดจะสมบูรณ์หากปราศจากการเล่นตลก"
 feast_main_live_fowl.0004.t:1 "เรื่องสัตว์ปีกของ [fowl_dinner_target.GetFirstNamePossessive]"
 feast_main_live_fowl.0004.entremets_served:1 "ระหว่างมื้ออาหาร เหล่าคนรับใช้ยกอาหารคั่นรายการอันประดับประดาอย่างน่าประทับใจออกมา แสดงฝีมือของพ่อครัวของเจ้าภาพ หนึ่งในอาหารจานเด่นคือ [ROOT.GetCharacter.Custom('exotic_fowl_type')] หลายตัว ถูกถลกหนัง ปรุงสุก และยัดไส้ จากนั้นจึง แต่งกายด้วยขนนกอันงดงามอีกครั้ง\nขณะที่ข้าพเจ้านำมีดเข้าใกล้ สัตว์ปีกตัวนั้นก็กลับมีชีวิตชีวาขึ้นมาพร้อมเสียงกรีดร้อง! [ROOT.GetCharacter.Custom('exotic_fowl_type')] ตัวหนึ่งยังไม่ได้ปรุงสุกเลย! มันจิกเข้าที่จมูกของข้าพเจ้า ก่อนจะพุ่งออกมาท่ามกลางแขกที่กรีดร้องและหัวเราะ"
 feast_main_live_fowl.0004.bird_killed:0 "\n\nการหลบหนีของ [ROOT.GetCharacter.Custom('exotic_fowl_type')] สิ้นสุดลงในไม่ช้า เมื่อ [fowl_bird_killer.GetTitledFirstName] ลุกขึ้นจากที่นั่งของ [fowl_bird_killer.GetHerHis] และคว้าคอมันด้วยความเยือกเย็นอย่างมีประสิทธิภาพ ด้วยการบิดมือ เสียงดังแกร๊บ ทำให้ทั้งห้องโถงเงียบสงัด\n\nข้าพเจ้านั่งครวญครางด้วยความเจ็บปวด กุมจมูกที่เลือดไหลและสาปแช่งนามของเจ้าภาพของเรา"
 feast_main_live_fowl.0004.bird_chased_by_character:1 "\n\nขณะที่นกวิ่งพล่าน [fowl_bird_chaser.GetTitledFirstName] ก็ลุกขึ้นรับคำท้าทายและไล่ตามสัตว์คลุ้มคลั่งอย่างสิ้นหวัง ในที่สุด [fowl_bird_chaser.GetSheHe] ก็สามารถไล่ [ROOT.GetCharacter.Custom('exotic_fowl_type')] ไปทางประตูห้องโถงใหญ่ได้สำเร็จ ที่ ซึ่งมันหนีไป\n\nข้าพเจ้านั่งครวญครางด้วยความเจ็บปวด กุมจมูกที่เลือดไหลและสาปแช่งนามของเจ้าภาพของเรา"
 feast_main_live_fowl.0004.bird_chased_away:0 "\n\nขณะที่ [ROOT.GetCharacter.Custom('exotic_fowl_type')] วิ่งพล่าน คนรับใช้จำนวนมากพยายามกันไม่ให้มันคว่ำอาหารจานอื่น ความบันเทิงที่ดีที่สุดเกิดขึ้นเมื่อพ่อครัวไล่ตามมันด้วยทัพพี ซึ่งในที่สุดก็ไล่นกออกไปทางประตูห้องโถงใหญ่ ที่ ซึ่งมันหนีหายไปในยามค่ำคืน\nข้าพเจ้านั่งครวญครางด้วยความเจ็บปวด กุมจมูกที่เลือดไหลและสาปแช่งนามของเจ้าภาพของเรา"
 feast_main_live_fowl.0004.a:0 "นกแข็งแรงกว่าที่ท่านคิดมาก..."
 feast_main_live_fowl.0005.t:1 "เรื่องสัตว์ปีกของ [fowl_dinner_target.GetFirstNamePossessive]"
 feast_main_live_fowl.0005.entremets_served:0 "คนรับใช้กำลังยกอาหารคั่นเวลาที่ตก แต่งอย่างน่าประทับใจออกมา: [ROOT.GetCharacter.Custom('exotic_fowl_type')] หลายตัว ถูกถลกหนัง ปรุงสุกและยัดไส้ จากนั้น แต่งตัวใหม่ด้วยขนนกอันงดงาม อย่างไรก็ตาม ขณะที่ [fowl_dinner_target.GetTitledFirstName] นำมีด [fowl_dinner_target.GetHerHis] เข้าใกล้ตัวหนึ่ง สัตว์ปีกตัวนั้นก็ฟื้นขึ้นมาพร้อมกับเสียงกรีดร้อง! มันจิกจมูกของ [fowl_dinner_target.GetFirstNamePossessive] ก่อนจะพุ่งออกมาท่ามกลางแขกที่กรีดร้องและหัวเราะ"
 feast_main_live_fowl.0005.bird_killed:0 "\n\nในที่สุดข้าพเจ้าก็ทนไม่ไหว และเมื่อมันผ่านเข้ามาใกล้ ข้าพเจ้าก็คว้าคอมันไว้ ห้องโถงเงียบสงัดขณะที่ข้าพเจ้าบิดคอของมันจนหัก ซากขนนกยับยู่ยี่กองอยู่บนพื้น จนกระทั่งมื้ออาหารสิ้นสุดลง"
 feast_main_live_fowl.0005.a:0 "อา สัมผัสแห่งชีวิตที่ดับสิ้นในมือท่าน..."
 feast_main_live_fowl.0006.t:1 "เรื่องสัตว์ปีกของ [fowl_dinner_target.GetFirstNamePossessive]"
 feast_main_live_fowl.0006.entremets_served:0 "คนรับใช้กำลังยกอาหารคั่นเวลาที่ตก แต่งอย่างน่าประทับใจออกมา: [ROOT.GetCharacter.Custom('exotic_fowl_type')] หลายตัว ถูกถลกหนัง ปรุงสุกและยัดไส้ จากนั้น แต่งตัวใหม่ด้วยขนนกอันงดงาม อย่างไรก็ตาม ขณะที่ [fowl_dinner_target.GetTitledFirstName] นำมีด [fowl_dinner_target.GetHerHis] เข้าใกล้ตัวหนึ่ง สัตว์ปีกตัวนั้นก็ฟื้นขึ้นมาพร้อมกับเสียงกรีดร้อง! มันจิกจมูกของ [fowl_dinner_target.GetFirstNamePossessive] ก่อนจะพุ่งออกมาท่ามกลางแขกที่กรีดร้องและหัวเราะ"
 feast_main_live_fowl.0006.bird_chased_by_character:0 "\n\nข้าพเจ้าฉวยโอกาสสร้างความประทับใจให้แขกคนอื่นๆ ทันที ข้าพเจ้าใช้ท่าทางที่ดูมีอำนาจที่สุดเพื่อสั่งให้นกไปทางออก แม้ว่ามันจะเลือกเส้นทางข้ามโต๊ะหลายตัว และ แม้ว่าข้าพเจ้าอาจจะไล่ตามมันด้วยความกระตือรือร้นมากเกินไปเล็กน้อย แต่ข้าพเจ้าก็ได้แสดงการแสดงที่น่าประทับใจ ขณะที่มังกรน้อยหายลับไปในอากาศยามค่ำคืนอันสดชื่น ข้าพเจ้ารู้สึกราวกับว่าเราได้สร้างความผูกพันบางอย่างขึ้นมา"
 feast_main_live_fowl.0006.a:0 "เดี๋ยวก่อนนะ ผู้คนกำลังหัวเราะเยาะข้าพเจ้าหรือ?"
 feast_main_live_fowl.1001.t:1 "งานเลี้ยงสัตว์ปีก: ความทรงจำอันเจ็บปวด"
 feast_main_live_fowl.1001.desc:1 "นกบ้านั่นในงานเลี้ยง! ข้าพเจ้าคิดว่าบาดแผลที่มันทิ้งไว้จะหายสนิท แต่กลับทิ้งรอยแผลเป็นน่าเกลียดไว้บนใบหน้าของข้าพเจ้า!"
 feast_main_live_fowl.1001.a:0 "มันจะคอยเตือนข้าพเจ้าถึงคู่ปรับตัวฉกาจที่แท้จริงของข้าพเจ้าตลอดไป..."
 fowl_dinner_peacock:0 "นกยูง"
 fowl_dinner_child:0 "นกสีสันสดใส"
 feast_main_live_fowl.9001.t:2 "จุดจบของนก"
 feast_main_live_fowl.9001.bird_killer:0 "งานเลี้ยงของ [host_saying_goodbye.GetTitledFirstNamePossessive] ใกล้จะสิ้นสุดลงแล้ว\n\nแขกส่วนใหญ่ดูเหมือนจะพอใจ อาจจะยกเว้น [fowl_dinner_target.GetFirstName] ที่ยังคงกุมจมูก [fowl_dinner_target.GetHerHis] ที่ [ROOT.GetCharacter.Custom('exotic_fowl_type')] ทำเครื่องหมายไว้ [fowl_dinner_target.GetHerHim]\n\nดูเหมือนว่าจะไม่มีใครอยากนั่งใกล้ [fowl_bird_killer.GetFirstName] หลังจากที่ [fowl_bird_killer.GetHerHis] กำจัดนกอย่างโหดเหี้ยม"
 feast_main_live_fowl.9001.no_bird_killer:0 "งานเลี้ยงของ [host_saying_goodbye.GetTitledFirstNamePossessive] ใกล้จะสิ้นสุดลงแล้ว\n\nแขกส่วนใหญ่ดูเหมือนจะพอใจ อาจจะยกเว้น [fowl_dinner_target.GetFirstName] ที่ยังคงกุมจมูก [fowl_dinner_target.GetHerHis] ที่ [ROOT.GetCharacter.Custom('exotic_fowl_type')] ทำเครื่องหมายไว้ [fowl_dinner_target.GetHerHim]"
 feast_main_live_fowl.9001.a:1 "เราควรทำ เช่นนี้บ่อยขึ้นนะ [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('host_saying_goodbye'))] ของข้าพเจ้า!"
 feast_main_live_fowl.9002.t:2 "จุดจบของนก"
 feast_main_live_fowl.9002.bird_killer:2 "หลังจากหลายวันหลายคืนของการสังสรรค์อย่างสนุกสนาน งานเลี้ยงของข้าก็ใกล้จะสิ้นสุดลงแล้ว!\n\nแขกส่วนใหญ่ดูเหมือนจะพอใจ ยกเว้นบางที [fowl_dinner_target.GetFirstName] ที่ยังคงกุมจมูก [fowl_dinner_target.GetHerHis] ที่ [ROOT.GetCharacter.Custom('exotic_fowl_type')] ทำเครื่องหมายไว้ [fowl_dinner_target.GetHerHim]\n\nดูเหมือนว่าจะไม่มีใครอยากนั่งใกล้ [fowl_bird_killer.GetFirstName] หลังจากที่ [fowl_bird_killer.GetHerHis] กำจัดนกอย่างโหดเหี้ยม"
 feast_main_live_fowl.9002.no_bird_killer:1 "หลังจากหลายวันหลายคืนของการสังสรรค์อย่างสนุกสนาน งานเลี้ยงของข้าก็ใกล้จะสิ้นสุดลงแล้ว!\n\nแขกส่วนใหญ่ดูเหมือนจะพอใจ ยกเว้นบางที [fowl_dinner_target.GetFirstName] ที่ยังคงกุมจมูก [fowl_dinner_target.GetHerHis] ที่ [ROOT.GetCharacter.Custom('exotic_fowl_type')] ทำเครื่องหมายไว้ [fowl_dinner_target.GetHerHim]"
 feast_main_live_fowl.9002.a:1 "เราควรทำ เช่นนี้บ่อยขึ้น!"
 feast_main_live_fowl.9003.bird_killer:0 "ในที่สุดงานเลี้ยงก็ใกล้จะสิ้นสุดลงแล้ว!\n\nทุกคนดูเหมือนจะมีช่วงเวลาที่สนุกสนาน ในขณะที่ข้าพเจ้าต้องทนความเจ็บปวดที่เกิดจาก [ROOT.GetCharacter.Custom('exotic_fowl_type')] บ้าๆ นั่น!\n\nข้าพเจ้าควรจะขอบคุณ [fowl_bird_killer.GetFirstName] ที่กำจัดสัตว์นรกที่ดุร้ายนั่นอย่างมีประสิทธิภาพ ข้าพเจ้าแค่กังวลเล็กน้อยเกี่ยวกับการเข้าใกล้ [fowl_bird_killer.GetHerHim] มากเกินไป"
 feast_main_live_fowl.9003.no_bird_killer:1 "ในที่สุดงานเลี้ยงก็ใกล้จะสิ้นสุดลงแล้ว!\n\nทุกคนดูเหมือนจะมีช่วงเวลาที่สนุกสนาน ในขณะที่ข้าพเจ้าต้องทนความเจ็บปวดที่เกิดจาก [ROOT.GetCharacter.Custom('exotic_fowl_type')] บ้าๆ นั่น! ข้าพเจ้าคาดหวังการปฏิบัติที่ดีกว่านี้จาก [host_saying_goodbye.GetTitledFirstName]\n\nไม่เป็นไร ข้าพเจ้าจะแสดงให้พวกเขาทุกคนเห็นในงานเลี้ยงครั้งต่อไป!"
 feast_main_live_fowl.9003.a:1 "ใช่ ใช่ ในไม่ช้ามันจะจบลง"
 feast_main_live_fowl.9004.desc:1 "งานเลี้ยงของ [host_saying_goodbye.GetTitledFirstNamePossessive] ใกล้จะสิ้นสุดลงแล้ว ผู้คนหัวเราะ จนกระทั่งเห็นข้าพเจ้าและเงียบไปทันที ข้ารู้ว่าภาพข้าพเจ้าหักคอนกตัวนั้นฝังอยู่ในความทรงจำของพวกเขา ข้ารู้ว่าข้าพเจ้าจำความรู้สึกของชีวิตที่หนีออกจากร่างที่ช่วยเหลือตัวเองไม่ได้นั้นได้เป็นอย่างดี\n\nรู้สึกดีที่รู้ว่าพวกเขาทุกคนกังวลอยู่บ้างเล็กน้อย"
 feast_main_live_fowl.9004.a:1 "นี่ไม่ใช่งานเลี้ยงที่แย่นัก"
 feast_main_live_fowl.9005.desc:0 "งานเลี้ยงของ [host_saying_goodbye.GetTitledFirstNamePossessive] ใกล้จะสิ้นสุดลงแล้ว ดูเหมือนแขกส่วนใหญ่จะมีช่วงเวลาที่ดี แม้ว่าข้าพเจ้าจะหวังว่าการรำลึกถึงความหลังของพวกเขาจะเกี่ยวกับข้าพเจ้าวิ่งข้ามโต๊ะน้อยลงเล็กน้อยก็ตาม\nอย่างน้อย [fowl_dinner_target.GetFirstName] ก็ขอบคุณข้าพเจ้าที่ไล่นกไปหลังจากที่มันโจมตี [fowl_dinner_target.GetHerHim]"
 feast_main_live_fowl.9005.a:0 "งานเลี้ยงครั้งหน้าข้าพเจ้าจะสุขุมกว่านี้เล็กน้อย"
 feast_live_fowl_log_title:0 "การโจมตีของนก"
 feast_live_fowl_log:0 "[TARGET_CHARACTER.GetTitledFirstName] ถูกทำร้ายโดยนกมีชีวิตที่โต๊ะอาหารเย็น"
