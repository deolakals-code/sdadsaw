l_english: 

feast_default_jason.100.t: "งานรื่นเริงยามสงคราม"
feast_default_jason.100.desc: ""พวกเรามัวกังวล" [soldier.GetFirstName] [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('soldier'))] ของข้าเอ่ยถาม "ถึงเหตุแห่ง [ROOT.Char.GetPrimaryTitle.GetAdjective] ใน [war.GetName] กันอยู่หรือ...? ข้าเห็นสีหน้าเคร่งเครียดรอบโต๊ะนี้ — เคร่งเครียดราวกับว่ากองทัพ [foe.GetPrimaryTitle.GetAdjective] ของ [foe.GetTitledFirstNamePossessive] มาจ่ออยู่ที่ประตู!"\n\n"อย่าได้กังวลกับกองกำลังของท่านใน [army_location.GetTerrain.GetNameNoTooltip|l] แห่ง [army_location.GetName] ให้มากนักเลย ท่าน [ROOT.Char.GetTitleAsName] ผู้สูงศักดิ์" [other_ruler.GetFirstName] [other_ruler.GetTitleAsNameNoTooltip] แห่ง [other_ruler.GetPrimaryTitle.GetNameNoTier] ยิ้ม "โชคชะตาย่อมเข้าข้างพวกเขาเป็นแน่""
feast_default_jason.100.a: ""จะมีโชคชะใดดีไปกว่า... ความช่วยเหลือจากท่านเล่า?""
feast_default_jason.100.b: ""จงจำคำเหล่านี้ไว้: ชัยชนะของข้าแน่นอนแล้ว!""
feast_default_jason.100.c: "มาดื่มกันจนกว่าโลกจะเลือนหายไป..."
feast_default_jason.100.c_hungee: "ปากที่กำลังพร่ามกังวลเหล่านี้ควรถูกอุดด้วยอาหาร"
 
boasted_of_victories_modifier: "ป่าวประกาศชัยชนะอย่างกว้างขวาง"
victories_reduce_stress_add_prestige_desc: "การชนะ [battles|E] จะลด @stress_icon![stress|E] และมอบ @prestige_icon![prestige|E] แต่การพ่ายแพ้จะเพิ่ม @stress_icon![stress|E] และต้องเสีย @prestige_icon![prestige|E]"
victories_reduce_stress_add_prestige_tt: "ขณะที่ [modifier|E] นี้มีผล ท่านจะได้รับ @prestige_icon![prestige|E] และสูญเสีย @stress_icon![stress|E] จากการชนะ [battles|E] แต่การพ่ายแพ้จะต้องเสีย @prestige_icon![prestige|E] และเพิ่ม @stress_icon![stress|E]"
feast_default_jason.100.b_exalt_the_crown: "#low ระยะเวลาของ [modifier|E] ถูกขยายโดย [intent|e] [THIS.Char.GetInvolvedActivityIntent.GetName] ของท่าน#!"
