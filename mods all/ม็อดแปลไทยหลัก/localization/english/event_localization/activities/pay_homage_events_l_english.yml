l_english: 
 # General Loc Strings
 pay_homage_header:0 "การถวายบังคม:"

 # Activity Start: Liege decides whether or not to hear petition
 pay_homage.0001.opening:0 "[homage_vassal.Custom2('AppropriateGreetingPositive', ROOT.Char )]"
 pay_homage.0001.desc:0 "ข้าพเจ้ามาถึง [homage_liege.GetCapitalLocation.GetTitle.GetNameNoTierNoTooltip] เพื่อถวายบังคมแด่ท่าน [homage_liege.GetTitleAsNameNoTooltip] ผู้รุ่งโรจน์ เพื่อแสดงความจงรักภักดีของข้าพเจ้า \n\n"
 pay_homage.0001.desc.submission:0 "ข้าพเจ้าหวังว่าคำปฏิญาณสวามิภักดิ์ของข้าพเจ้าเพียงอย่างเดียวก็เป็นหลักฐานเพียงพอถึงเกียรติของข้าพเจ้าแล้ว"
 pay_homage.0001.desc.gold:0 "ข้าพเจ้านำของกำนัลอันล้ำค่าคู่ควรแก่พระบรมเดชานุภาพของท่านมาถวาย เพื่อเป็นเครื่องหมายแห่งความปรารถนาดีและความเป็นข้ารับใช้ของข้าพเจ้า"
 pay_homage.0001.desc.hook:0 "ท่านมีคำมั่นสัญญาของข้าพเจ้าว่าข้าพเจ้าจะทำทุกสิ่งที่ท่านปรารถนา นายท่าน/นายหญิงของข้าพเจ้า [homage_liege.GetLadyLord]"
 pay_homage.0001.desc.contract:0 "เพื่อเป็นเครื่องหมายแห่งอำนาจปกครองของท่านและความจงรักภักดีของข้าพเจ้าที่มีต่อท่าน ข้าพเจ้าจะปฏิญาณตนรับพันธกรณีที่ยิ่งใหญ่ขึ้นในฐานะข้าหลวงของท่าน"
 pay_homage.0001.a:0 "ให้ [homage_vassal.GetTitledFirstNameNoTooltip] เข้ามาทันที"
 pay_homage.0001.a.tt:0 "ท่านรับ [homage_vassal.GetTitledFirstName]"
 pay_homage.0001.b:0 "การประจบประแจงของ [homage_vassal.GetHerHis|U] ไม่มีความหมายใดต่อข้า"
 pay_homage.0001.b.tt:0 "ท่านส่ง [homage_vassal.GetTitledFirstName] กลับไป"

# Activity End: Vassal learns that liege refuses to hear petition
 pay_homage.0009.opening:1 "[homage_liege.Custom2('AppropriateGreeting', ROOT.Char )]"
 pay_homage.0009.desc:0 "ข้าไม่หลงกลการเสแสร้ง [homage_vassal.Custom2('InsultAdjective', SCOPE.sC('homage_liege'))] ของเจ้าดอก คำสัตย์ปฏิญาณแสดงความจงรักภักดีจากเจ้านั้นหามีความหมายใดต่อข้าไม่"
 pay_homage.0009.a:1 "ช่างน่าโมโห!"

 # Liege Event: Liege receives homage from vassal
 pay_homage.0101.t:0 "$pay_homage_header$ การคุกเข่า"
 pay_homage.0101.t.language:0 "$pay_homage_header$ คำพูดสองแง่สองง่าม"
 pay_homage.0101.t.clumsy:0 "$pay_homage_header$ อับอายขายหน้า"
 pay_homage.0101.t.infatuation:0 "$pay_homage_header$ ตกเป็นเป้าสายตา"
 pay_homage.0101.t.delivery:0 "$pay_homage_header$ ลิ้นพันกัน"
 pay_homage.0101.desc:0 "ข้ารอคอยอย่างอดทนบนบัลลังก์เพื่อการมาถึงของ [homage_vassal.GetTitledFirstName] ซึ่งในไม่ช้าก็ได้รับการประกาศชื่อและนำเข้ามาเบื้องหน้าข้า \n\n"
 pay_homage.0101.desc.submission:0 "[homage_vassal.GetSheHe|U] คุกเข่าลงด้วยความเคารพยำเกรง ไม่ได้ถวายสิ่งใดนอกจากคำสัตย์ปฏิญาณของ[homage_vassal.GetHerHis]ว่าจะรับใช้อย่างซื่อสัตย์ในฐานะข้าหลวงแห่ง[homage_liege.GetPrimaryTitle.GetTierAsNameNoTooltip]\n\n"
 pay_homage.0101.desc.gold:0 "[homage_vassal.GetSheHe|U] คุกเข่าลงด้วยความเคารพยำเกรง ขณะที่ผู้ติดตามนำของกำนัลเป็นเหรียญกษาปณ์และของมีค่าของ[homage_vassal.GetHerHis]เข้ามาถวาย มีการกล่าวคำสัตย์ปฏิญาณ และอาลักษณ์บันทึกคำปฏิญาณของ[homage_vassal.GetHerHis]ที่จะรับใช้[homage_liege.GetPrimaryTitle.GetNameNoTooltip]\n\n"
 pay_homage.0101.desc.hook:0 "[homage_vassal.GetSheHe|U] คุกเข่าลงด้วยความเคารพยำเกรง และท่ามกลางคำสัตย์ปฏิญาณอื่นๆ ของ[homage_vassal.GetHerHis]ที่จะรับใช้[homage_liege.GetPrimaryTitle.GetNameNoTooltip] ได้มอบ[homage_vassal.GetHerselfHimself]ให้ข้าพเจ้าใช้สอยและเป็นหนี้บุญคุณข้าพเจ้า\n\n"
 pay_homage.0101.desc.contract:0 "[homage_vassal.GetSheHe|U] คุกเข่าลงด้วยความเคารพยำเกรง และท่ามกลางคำสัตย์ปฏิญาณอื่นๆ ของ[homage_vassal.GetHerHis]ที่จะรับใช้[homage_liege.GetPrimaryTitle.GetNameNoTooltip] ได้เสนอที่จะสนับสนุนข้าพเจ้ามากขึ้นในฐานะข้าหลวงแห่ง[homage_liege.GetPrimaryTitle.GetTierAsNameNoTooltip]\n\n"
 pay_homage.0101.desc.language:3 "แม้ว่า[homage_vassal.GetTitleAsNameNoTooltip]จะฝึกฝนคำปฏิญาณภาษา[homage_liege.GetCourtLanguage.GetNameNoTooltip]มาอย่างชัดเจน แต่[homage_vassal.GetSheHe]ก็ออกเสียงผิดหลายช่วง ทำให้ความหมายเปลี่ยนไปอย่างน่าขบขัน และ ทำให้ข้าราชบริพารของข้าพเจ้าต้องกลั้นหัวเราะคิกคัก"
 pay_homage.0101.desc.clumsy:0 "ขณะที่ [homage_vassal.GetTitledFirstNameNoTooltip] ยืนขึ้น [homage_vassal.GetSheHe] ก็สะดุดอย่างงุ่มง่าม ราชสำนักสูดหายใจพร้อมกันเมื่อ [homage_vassal.GetSheHe] ล้มลง นอนแผ่อยู่ที่เท้าของข้าพเจ้า แก้มแดงก่ำด้วยความอับอาย"
 pay_homage.0101.desc.infatuation:0 "[homage_vassal.GetTitledFirstNameNoTooltip] ลุกขึ้นยืน ดูเก้งก้าง หางตาของข้าพเจ้าสังเกตเห็น [SCOPE.sC('homage_liege').Custom2('RelationToMeShort', SCOPE.sC('homage_infatuation'))] ของข้าพเจ้า [homage_infatuation.GetFullName] กำลังเคลิบเคลิ้ม เห็นได้ชัดว่าหลงใหลในตัว[homage_vassal.GetTitleAsNameNoTooltip]!"
 pay_homage.0101.desc.delivery:0 "เรื่องราวไม่ราบรื่นตั้งแต่ต้น [homage_vassal.Custom('GetHomageDeliveryDescLiege')]"
 pay_homage.0101.desc.success:0 "ในที่สุดข้าพเจ้าก็บอกให้[homage_vassal.GetTitleAsNameNoTooltip]ลุกขึ้น ยืนยันความพึงพอใจของข้าพเจ้า และสิทธิ์ของ[homage_vassal.GetFirstNamePossessiveNoTooltip]ในดินแดนที่[homage_vassal.GetSheHe]ปกครองแทนข้าพเจ้า"
 pay_homage.0101.smooth.submission:0 ""จงรับใช้ข้าให้ดี [homage_vassal.GetTitledFirstNameNoTooltip]""
 pay_homage.0101.smooth.gold:0 ""ข้ารับของกำนัลอันใจกว้างของท่าน [homage_vassal.GetTitledFirstNameNoTooltip]""
 pay_homage.0101.smooth.hook:0 ""ข้ายินดีที่รู้ว่าข้าสามารถเรียกใช้ท่านได้ [homage_vassal.GetTitledFirstNameNoTooltip]""
 pay_homage.0101.smooth.contract:0 ""การรับใช้ของท่านมีค่ายิ่งนัก [homage_vassal.GetTitledFirstNameNoTooltip]""
 pay_homage.0101.faux_pas.language:0 ""พยายามได้ดี [homage_vassal.GetFirstNameNoTooltip] มันไม่ใช่ภาษาที่ง่าย""
 pay_homage.0101.faux_pas.clumsy:0 ""คำสัตย์ปฏิญาณของท่านคือทั้งหมดที่มีความหมายต่อข้า""
 pay_homage.0101.faux_pas.infatuation:0 ""อะแฮ่ม... ข้าคิดว่าเราเสร็จธุระกันแล้ว""
 pay_homage.0101.faux_pas.delivery:0 ""ความภักดีของท่านต่างหากที่มีความหมาย ไม่ใช่ลิ้นของท่าน""
 pay_homage.0101.insult.language:0 ""เจ้ารู้ตัว#EMP บ้างไหม#! ว่าเจ้าเพิ่งพูดอะไรออกไป?""
 pay_homage.0101.insult.clumsy:0 ""ช่างน่าสมเพชสิ้นดี""
 pay_homage.0101.insult.infatuation:0 ""บังอาจ#EMP นัก#!? ออกไป!""
 pay_homage.0101.insult.delivery:0 ""นั่นมัน#EMP อะไรกัน#!?""

 # Vassal Event: Vassal hears how it went
 pay_homage.0201.desc:0 "เหล่าข้ารับใช้นำทางข้าเข้าไปยังห้องโถงใหญ่ของ [homage_liege.GetTitledFirstNamePossessiveRegnal] ใน [homage_liege.GetCapitalLocation.GetBaronyNameExplicitlyNoTooltip] ที่ ซึ่ง [homage_liege.GetSheHe] ประทับบนบัลลังก์ของ [homage_liege.GetHerHis] เพื่อรอฟังคำสัตย์ปฏิญาณของข้า\n\n"
 pay_homage.0201.desc.language:2 "ข้าพเจ้าคุกเข่าลงเบื้องหน้า[homage_liege.GetHerHim]และท่องคำสัตย์ปฏิญาณภาษา[homage_liege.GetCourtLanguage.GetNameNoTooltip]ที่ข้าพเจ้าได้ฝึกฝนมา แต่เสียงหัวเราะคิกคักที่ซ่อนเร้นของราชสำนัก ทำให้ชัดเจนว่าลิ้นของข้าพเจ้าต้องการการฝึกฝนภาษาในราชสำนักของเจ้าเหนือหัวของข้าพเจ้ามากกว่านี้...\n\n"
 pay_homage.0201.desc.clumsy:0 "ข้าพเจ้ากำลังจะคุกเข่าลงเบื้องหน้า[homage_liege.GetHerHim] แต่ด้วยความรีบร้อน ข้าพเจ้ากลับสะดุดล้มลงกองกับพื้นอย่างงุ่มง่ามที่เท้าของ[homage_liege.GetHerHis] ข้าพเจ้าพยุงตัวเองขึ้นและกล่าวคำสัตย์ปฏิญาณต่อไป แก้มแดงก่ำต่อหน้าราชสำนักที่มาชุมนุมกัน...\n\n"
 pay_homage.0201.desc.infatuation:0 "ข้าพเจ้าคุกเข่าลงเบื้องหน้า[homage_liege.GetHerHim]และเริ่มกล่าว ขณะที่ข้าพเจ้าท่องคำสัตย์ปฏิญาณ ข้าพเจ้าสบตากับ [homage_infatuation.GetFullName] [SCOPE.sC('homage_liege').Custom2('RelationToMeShort', SCOPE.sC('homage_infatuation'))] ของ [homage_liege.GetFirstNameNoTooltip] ซึ่งยิ้มอย่างเชื้อเชิญพร้อมขยิบตาอย่างจงใจ เมื่อมองกลับไปที่เจ้าเหนือหัวของข้าพเจ้า ข้าพเจ้าก็พบกับสายตาที่จ้องมองอย่างโกรธเคืองของ[homage_liege.GetHerHis]! ข้าพเจ้ารีบกล่าวสุนทรพจน์ให้จบ หลบสายตาขณะที่ราชสำนักซุบซิบนินทากัน...\n\n"
 pay_homage.0201.desc.delivery:0 "ข้าพเจ้าคุกเข่าลงเบื้องหน้า[homage_liege.GetHerHim]และเริ่มกล่าวคำสัตย์ปฏิญาณ แต่สิ่งต่างๆ ก็พังทลายลงอย่างรวดเร็ว [homage_vassal.Custom('GetHomageDeliveryDescVassal')]\n\n"
 pay_homage.0201.desc.success:0 "ข้าพเจ้าคุกเข่าลงที่พระบาทของนายท่าน/นายหญิง[homage_liege.GetLadyLord]ของข้าพเจ้าและกล่าวคำสัตย์ปฏิญาณถวายบังคมหลายประการ ขณะที่อาลักษณ์ของ[homage_liege.GetHerHis]บันทึกเหตุการณ์\n\n"
 pay_homage.0201.desc.submission:0 "ด้วยเหตุนี้ พิธีจึงเสร็จสมบูรณ์ ข้าพเจ้าไม่มีสิ่งใดจะถวายแด่[homage_liege.GetTitleAsNameNoTooltip]ของข้าพเจ้า นอกจากคำมั่นสัญญาว่าจะรับใช้อย่างซื่อสัตย์ในฐานะข้าหลวงแห่ง[homage_liege.GetPrimaryTitle.GetTierAsNameNoTooltip]\n\n"
 pay_homage.0201.desc.gold:0 "จากนั้นผู้ติดตามของข้าพเจ้าก็ตามมา นำเสนอของกำนัลอันล้ำค่าของข้าพเจ้าแด่[homage_liege.GetTitleAsNameNoTooltip]ต่อหน้าราชสำนักที่มาชุมนุมกัน\n\n"
 pay_homage.0201.desc.hook:0 "จากนั้นก็ถึงคำมั่นสัญญาของข้าพเจ้า ว่า[homage_liege.GetSheHe]อาจเรียกใช้ข้าพเจ้าเพื่อขอความช่วยเหลือใดๆ ก็ได้ ในฐานะผู้สนับสนุนที่ภักดีต่อ[homage_liege.GetTitleAsNameNoTooltip]ในทุกกิจการของ[homage_liege.GetHerHis]\n\n"
 pay_homage.0201.desc.contract:0 "จากนั้นก็ถึงของกำนัลของข้าพเจ้า ข้าพเจ้ายืนยันว่าจะเพิ่มการสนับสนุนของข้าพเจ้าต่อ[homage_liege.GetPrimaryTitle.GetTierAsNameNoTooltip]เพื่อเป็นเครื่องหมายแห่งความภักดีและเพื่อประโยชน์ของราชบัลลังก์\n\n"
 pay_homage.0201.desc.insult_language:1 "[homage_liege.GetFirstNameNoTooltip] มองข้าพเจ้าอย่างเข้มงวด จากนั้นก็ระเบิดเสียงหัวเราะออกมา พูดเลียนแบบคำปฏิญาณที่ออกเสียงผิดของข้าพเจ้าด้วยสำเนียงภาษา[homage_vassal.GetCulture.GetLanguage.GetNameNoTooltip]ที่ไม่ดีนัก..."
 pay_homage.0201.desc.insult_clumsy:0 "[homage_liege.GetFirstNameNoTooltip] ยิ้มกว้างอยู่หลังมือของ[homage_liege.GetHerHis] ขณะที่ราชสำนักค่อยๆ เต็มไปด้วยเสียงหัวเราะ นี่คือสิ่งที่ข้าพเจ้าจะถูกจดจำ..."
 pay_homage.0201.desc.insult_infatuation:0 "[homage_liege.GetFirstNameNoTooltip] มอง [SCOPE.sC('homage_liege').Custom2('RelationToMeShort', SCOPE.sC('homage_infatuation'))] ของ[homage_liege.GetHerHis]อย่างโกรธเคือง และไล่ข้าพเจ้าออกจากห้องโถงโดยไม่ยอมรับ"
 pay_homage.0201.desc.insult_delivery:0 "[homage_liege.GetFirstNameNoTooltip] งอตัวหัวเราะเสียงดังขณะที่[homage_liege.GetSheHe]เล่าส่วนต่างๆ ของสุนทรพจน์ของข้าพเจ้าอย่างละเอียด..."
 pay_homage.0201.desc.brush_off:0 "ข้าพเจ้าประหลาดใจที่[homage_liege.GetFirstNameNoTooltip]ทำราวกับว่าไม่มีอะไรเกิดขึ้น และยอมรับการถวายบังคมของข้าพเจ้าด้วยความเมตตา\n\n"
 pay_homage.0201.desc.outro:0 "[homage_liege.GetFirstNameNoTooltip] บอกให้ข้าพเจ้าลุกขึ้น และยืนยันความพึงพอใจของ[homage_liege.GetHerHis] พร้อมกับสิทธิ์ของข้าพเจ้าในดินแดนที่ข้าพเจ้าปกครองแทน[homage_liege.GetHerHis]"
 pay_homage.0201.smooth.submission:0 "ทรงพระเจริญ [homage_liege.GetTitleAsNameNoTooltip]"
 pay_homage.0201.smooth.gold:0 "ราคาของความจงรักภักดี..."
 pay_homage.0201.smooth.hook:0 "หวังว่าจะเป็นบุญคุณเล็กน้อย..."
 pay_homage.0201.smooth.contract:0 "ภาระของการรับใช้..."
 pay_homage.0201.faux_pas:0 "ช่างเป็นเจ้าเหนือหัวที่ยุติธรรมเสียจริง"
 pay_homage.0201.insult:0 "ข้าไม่น่ามาเลย"

 # Custom
 homage_delivery_stutter_liege:1 "[ROOT.Char.GetTitledFirstNamePossessiveNoTooltip] แทบจะพูดไม่ถึงครึ่งประโยคก่อนที่อาการพูดติดอ่างของ[ROOT.Char.GetHerHis]จะตัดบท[ROOT.Char.GetHerHim]เสียก่อน ข้าราชบริพารที่เจ็บปวดของข้าพเจ้าเฝ้าดูความพยายามอย่างกล้าหาญของ[ROOT.Char.GetHerHis]ที่จะเอาชนะเสียงของ[ROOT.Char.GetHerHis]"
 homage_delivery_lisp_liege:1 "สุนทรพจน์ของ[ROOT.Char.GetTitledFirstNamePossessiveNoTooltip]นั้น... น่าจดจำ การพูด ส ซ ไม่ชัดของ[ROOT.Char.GetHerHis]ลดทอนความขึงขังลง ขณะที่[ROOT.Char.GetSheHe]พยายามออกเสียงเสียดแทรกจำนวนมาก และพยายามไม่สนใจเสียงหัวเราะคิกคักของข้าราชบริพารที่ไม่ค่อยมีเมตตาของข้าพเจ้า"
 homage_delivery_wheeze_liege:1 "[ROOT.Char.GetTitledFirstNameNoTooltip] เป็นคนที่น่าสนใจ เห็นได้ชัดว่าประหม่ากับภาพที่เห็น และตื่นเต้นกับการมาถึงอย่างเร่งรีบ [ROOT.Char.GetSheHe] ดูเหมือนจะหายใจลำบาก หอบหายใจผ่านคำพูดระหว่างพักหายใจ"
 homage_delivery_slow_liege:1 "สุนทรพจน์ของ[ROOT.Char.GetTitledFirstNamePossessiveNoTooltip]นั้น... ไม่ดีเลย [ROOT.Char.GetSheHe] ลืมสิ่งที่[ROOT.Char.GetHerHis]จะพูดหลายครั้ง พูดนอกเรื่องไปเรื่อย และเข้าใจผิดหรือออกเสียงคำที่สำคัญที่สุดบางคำผิด"
 homage_delivery_inconceivable_liege:1 "สุนทรพจน์ของ[ROOT.Char.GetTitledFirstNamePossessiveNoTooltip]นั้น... น่าสนใจ [ROOT.Char.GetSheHe|U] แทรกภาษาโบราณและถ้อยคำที่ดูมีน้ำหนัก ซึ่ง[ROOT.Char.GetSheHe]เห็นได้ชัดว่าไม่รู้ความหมายที่แท้จริง ทำให้สุนทรพจน์ยาวขึ้นเป็นสองเท่าและ ทำให้ข้าราชบริพารที่คงแก่เรียนของข้าพเจ้างอตัวหัวเราะ"
 homage_delivery_stutter_vassal:0 "ข้าพเจ้าแทบจะเริ่มคำปฏิญาณแรกไม่ทันไร อาการพูดติดอ่างก็ตัดบทข้าพเจ้าเสียก่อน ในที่สุดข้าพเจ้าก็พูดต่อไปขณะที่ราชสำนักเฝ้าดูด้วยความขบขันและอับอาย แต่วันนี้ถูกจดจำด้วยอาการของข้าพเจ้า"
 homage_delivery_lisp_vassal:0 "สุนทรพจน์ของข้าพเจ้าถูกขัดจังหวะด้วยเสียงหัวเราะคิกคักที่กลั้นไว้ ขณะที่ข้าพเจ้าพยายามอย่างเต็มที่ที่จะออกเสียงให้ชัดเจนแม้จะพูด ส ซ ไม่ชัด ซึ่งลดทอนความสำคัญของพิธีและคำปฏิญาณของข้าพเจ้า"
 homage_delivery_wheeze_vassal:0 "ข้าพเจ้าหายใจลำบากขณะที่หัวใจเต้นเร็วขึ้น และการรีบพูดสุนทรพจน์ให้จบยิ่ง ทำให้สถานการณ์แย่ลง มันไม่ใช่สุนทรพจน์ที่น่าจดจำ"
 homage_delivery_slow_vassal:0 "ข้าพเจ้าทำดีที่สุดแล้ว แต่การเลิกคิ้วและสีหน้าของเจ้าเหนือหัวและราชสำนักบอกข้าพเจ้าว่าความพยายามของข้าพเจ้านั้นน่าขบขันมากกว่าที่จะยิ่งใหญ่"
 homage_delivery_inconceivable_vassal:0 "ข้าพเจ้าทุ่มสุดตัว รับมือกับสถานการณ์และสร้างความประทับใจให้ราชสำนักด้วยคำศัพท์อันยอดเยี่ยมของข้าพเจ้า ถึง แม้ว่า... ปฏิกิริยาจะไม่เป็นไปตามที่ข้าพเจ้าหวังไว้ก็ตาม"
