l_english: 
 activity_funeral: "พิธีศพ"
 activity_funeral_desc: "รวบรวมอาณาจักรที่โศกเศร้าเพื่อประกอบ $activity_funeral$ โอกาสในการส่งสมาชิกผู้สูงศักดิ์ที่เคารพนับถือเป็นครั้งสุดท้ายอย่างเหมาะสม"
 activity_funeral_province_desc: "ท่านจัดพิธีศพใน [ROOT.Province.GetName]\nจังหวัดที่มีคะแนนสูงจะมอบ [piety_i][piety|E] ที่เพิ่มขึ้น การสูญเสีย [stress_loss_i][stress|E] และ [legitimacy|E]\n"
 activity_funeral_guest_help_text: "[activity_guests|E] ที่ได้รับเชิญจะมีโอกาสในการเพิ่ม [opinion|E] ที่มีต่อท่าน\nพิธีศพยังเป็นโอกาสในการปลดปล่อยภาระทางอารมณ์ของท่าน และลด [stress|E] รวมถึงได้รับ [piety|E]"
 activity_funeral_selection_tooltip: "จัดพิธีศพเพื่อส่งดวงวิญญาณของญาติผู้ล่วงลับ\n\nรางวัลที่คาดว่าจะได้รับ:\n$BULLET_WITH_TAB$[opinion_i] [opinion|E]\n$BULLET_WITH_TAB$[legitimacy_i] ได้รับ [legitimacy|E]\n$BULLET_WITH_TAB$[stress_loss_i] [stress_loss|E]\n$BULLET_WITH_TAB$[piety_i] ได้รับ [piety|E]"
 activity_funeral_destination_selection: "ร่างจะต้องถูกฝัง ณ ที่ใดที่หนึ่งภายในอาณาจักรของท่าน สถานที่ศักดิ์สิทธิ์และอาคารทางศาสนาจะช่วยปรับปรุงคุณภาพของพิธี"
 activity_funeral_major_religious_building: "#P +++ อาคารทางศาสนาที่สำคัญ#!\n"
 activity_funeral_tos: "#P ++ $building_type_tower_of_silence_01$#!\n"
 activity_funeral_wavel: "#P ++ $building_type_wawel_cathedral_01$#!\n"
 activity_funeral_holy_site: "#P ++ สถานที่ศักดิ์สิทธิ์#!\n"
 activity_funeral_mountain: "#P ++ ภูเขา#!\n"
 activity_funeral_temple: "#P ++ วัด#!\n"
 activity_window_character_body: "$body_to_bury_for_host$"

 deceased_selection_widget_header: "เลือกศพที่จะฝัง"

 has_someone_to_bury_tt: "ท่านต้องเพิ่งประสบกับการสูญเสียบุคคลอันเป็นที่รัก"
 has_someone_selected_to_bury: "ท่านยังไม่ได้เลือกศพที่จะฝัง"
 body_to_bury_for_host: "ผู้ล่วงลับ"
 body_to_bury_desc_for_host: "ร่างที่จะถูกส่งไปยังปรโลก"
 body_to_bury_desc_for_host_required_tt: "#T แขกพิเศษที่จำเป็น\n#!@warning_icon! #X กิจกรรมนี้ต้องการ $body_to_bury_for_host$ เพื่อฝัง#!"
 body_to_bury_selection_info: "เลือกผู้ที่เพิ่งจากไปเพื่อส่งไปยังปรโลก"
 activity_funeral_host_desc: "$BULLET_WITH_TAB$[opinion_i] [opinion|E]\n$BULLET_WITH_TAB$[stress_loss_i] [stress_loss|E]\n$BULLET_WITH_TAB$[piety_i] ได้รับ [piety|E]\n$BULLET_WITH_TAB$[legitimacy_i] ได้รับ [legitimacy|E]"
 activity_funeral_guest_desc: "$BULLET_WITH_TAB$ ผู้เข้าร่วมอาจได้รับ [opinion|E] จากตัวละครที่เข้าร่วม\n$BULLET_WITH_TAB$ ผู้เข้าร่วมอาจสูญเสีย [stress_loss_i][stress|E]"
 activity_funeral_conclusion_desc: "[GetActivityType( 'activity_funeral' ).GetName] ได้สิ้นสุดลงแล้ว"
 funeral_phase_wake: "[GetPlayer.Custom('WakeName')]"
 funeral_phase_wake_desc: "[GetPlayer.Custom('WakeDesc')]"
 funeral_phase_ceremony: "[GetPlayer.Custom('CeremonyName')]"
 funeral_phase_ceremony_desc: "[GetPlayer.Custom('CeremonyDesc')]"
 funeral_option_ceremony: "พิธีการ"
 funeral_ceremony_bad: "พิธีการแบบเรียบง่าย"
 funeral_ceremony_bad_desc: "$EFFECT_LIST_BULLET$ ได้รับ [piety|E] เล็กน้อย\n$EFFECT_LIST_BULLET$ ได้รับ [legitimacy|E] เล็กน้อย\n$EFFECT_LIST_BULLET$ สูญเสีย [stress|E] เล็กน้อย\n\n#weak ความตายไม่ใช่เวลาสำหรับความฉูดฉาดและความโอ่อ่า แต่เป็นเวลาที่จะรวมตัวกันและแสดงความเคารพอย่างถ่อมตนของเรา#!"
 funeral_ceremony_normal: "พิธีการอันทรงเกียรติ"
 funeral_ceremony_normal_desc: "$EFFECT_LIST_BULLET$ ได้รับ [piety|E]\n$EFFECT_LIST_BULLET$ ได้รับ [legitimacy|E]\n$EFFECT_LIST_BULLET$ สูญเสีย [stress|E]\n\n#weak ความตายได้มาเยือนอาณาจักรแล้ว และบัดนี้ถึงเวลาจัดพิธีอันหรูหราเพื่อผู้ล่วงลับ#!"
 funeral_ceremony_good: "พิธีการอันหรูหราฟุ่มเฟือย"
 funeral_ceremony_good_desc: "$EFFECT_LIST_BULLET$ ได้รับ [piety|E] อย่างมาก\n$EFFECT_LIST_BULLET$ ได้รับ [legitimacy|E] อย่างมาก\n$EFFECT_LIST_BULLET$ สูญเสีย [stress|E] อย่างมาก\n\n#weak ความตายได้มาเยือนบุคคลผู้ยิ่งใหญ่แห่งอาณาจักรแล้ว พวกเขาสมควรได้รับทุกสิ่งที่เราสามารถมอบให้มิใช่หรือ? จะไม่มีการประหยัดค่าใช้จ่ายใดๆ สำหรับพิธีศพ และทุกคนจะได้รู้ถึงโศกนาฏกรรมอันยิ่งใหญ่ที่เกิดขึ้นกับอาณาจักร#!"
 mourn_intent: "ไว้ทุกข์"
 mourn_intent_desc: "นี่คือเวลาแห่งการไว้ทุกข์ให้แก่ผู้ตาย เป็นช่วงเวลาสำคัญในการแสดง [piety|E]"
 wakename_offering_of_libations: "การถวายเครื่องดื่มบูชา"
 wakedesc_offering_of_libations: "บัดนี้ถึงเวลาถวายอาหารและน้ำของเราแด่ผู้ตาย ร่างจะถูกชำระโดยบุคคลศักดิ์สิทธิ์และดองไว้สำหรับผู้ไว้ทุกข์ในวันต่อๆ ไป"
 wakename_sky_burial: "ให้เกียรติผู้ตาย"
 wakedesc_sky_burial: "นี่ไม่ใช่เวลาสำหรับการระเบิดอารมณ์ แต่เป็นเวลาสำหรับความโศกเศร้าอย่างสงบเสงี่ยมและอ่อนโยน นี่เป็นโอกาสสำหรับแขกที่จะมอบความปลอบโยนแก่ครอบครัวผู้สูญเสีย"
 wakename_mummification: "การทำมัมมี่"
 wakedesc_mummification: "ผู้ไว้ทุกข์รวมตัวกันด้วยความคาดหวังขณะที่ร่างถูกดองและทำมัมมี่ เพื่อเก็บรักษาไว้ชั่วนิรันดร์"
 wakename_wake: "การเฝ้าศพ"
 wakedesc_wake: "นี่คือเวลาเฝ้าร่างของผู้ล่วงลับ เป็นโอกาสสุดท้ายในการแสดงความคิดและความรู้สึกกับผู้ตายก่อนที่ร่างของพวกเขาจะถูกส่งไปยังชีวิตหลังความตาย"
 wakename_bathing: "การอาบน้ำศพ"
 wakedesc_bathing: "ผู้ไว้ทุกข์รวมตัวกันเพื่ออาบน้ำศพของผู้ล่วงลับและห่อหุ้มพวกเขาด้วยผ้าลินินสีขาวทั้งหมด"
 ceremonyname_public_bewailment: "การคร่ำครวญในที่สาธารณะ"
 ceremonydesc_public_bewailment: "การคร่ำครวญในที่สาธารณะเป็นเวลาที่จะปลดปล่อยอารมณ์ การร้องไห้ การคร่ำครวญ การโอดครวญรอบร่างของผู้ล่วงลับก่อนที่จะมอบร่างคืนสู่ผืนดิน"
 ceremonyname_sky_burial: "การฝังศพบนฟ้า"
 ceremonydesc_sky_burial: "ร่างจะถูกส่งไปยังชีวิตหลังความตายในท้องของนก เพื่อให้ผู้ล่วงลับได้เลี้ยงดูโลกดังที่โลกเคยเลี้ยงดูพวกเขา"
 ceremonyname_ground_burial: "การฝังศพ"
 ceremonydesc_ground_burial: "ร่างถูกมอบคืนสู่ผืนดินและมีการสวดภาวนาร่วมกันในหมู่ผู้ไว้ทุกข์ แม้ว่าวิญญาณนิรันดร์จะยังคงอยู่ แต่ร่างก็นอนอยู่ในที่พำนักสุดท้าย"
 ceremonyname_cremation: "การเผาศพ"
 ceremonydesc_cremation: "ร่างถูกเผาบนกองฟอนขนาดใหญ่"
 ceremonyname_mummification: "การบรรจุศพในสุสาน"
 ceremonydesc_mummification: "ร่างมัมมี่ถูกนำไปไว้ในสุสานที่ ซึ่งสามารถปล่อยให้พักผ่อนได้"
 ceremonyname_ceremony: "พิธี"
 ceremonydesc_ceremony: "ร่างจะถูกส่งไปยังปรโลกในพิธีตามประเพณีและ [pious|E]"
 activity_funeral_predicted_cost: "ค่าใช้จ่ายของพิธีศพได้รับผลกระทบจาก [activity_options|E] ที่ท่านเลือกและหลักปฏิบัติเกี่ยวกับงานศพ [doctrine|E] ของ [faith|E] ของท่าน"
 funeral_cost_increase_great_temple: "มีวัดใหญ่อยู่ที่นี่"
 funeral_cost_increase_mummification: "การทำมัมมี่"
 funeral_cost_discount_cremation: "การเผาศพ"
 funeral_activity_cost_desc: "ค่าใช้จ่ายพื้นฐาน"
 building_funeral_effect_desc:1 "$unlocks_building_desc$เพิ่มการได้รับ [legitimacy|E] และการได้รับ [piety|E] สำหรับ [GetActivityType('activity_funeral').GetTextIcon][GetActivityType('activity_funeral').GetName] [activities|E] ที่จัดขึ้นใน [holding|E] นี้"
 building_funeral_wavel_effect_desc:1 "$unlocks_building_desc$เพิ่มการได้รับ [legitimacy|E] และการได้รับ [piety|E] อย่างมากสำหรับ [GetActivityType('activity_funeral').GetTextIcon][GetActivityType('activity_funeral').GetName] [activities|E] ที่จัดขึ้นใน [holding|E] นี้"

 # Events
 funeral.0001.t: "ความตายในงานศพ"
 funeral.0001.desc: "เหตุผลอีกประการหนึ่งที่ต้องโศกเศร้าได้เกิดขึ้นกับเราในวันนี้ เมื่อเจ้าภาพของเรา [host.GetName] ได้ขึ้นสู่ [host.GetFaith.PositiveAfterLife]\n\nแม้ว่าสิ่งนี้จะ ทำให้พิธีการปัจจุบันสั้นลง แต่ก็บ่งชี้ว่าอาจมีงานศพเพิ่มขึ้นเร็วกว่าที่คาดไว้"
 funeral.0001.a: "ช่างโชคร้ายเสียนี่กระไร"
 funeral.0001.a.tt: "[host.GetName] ได้เสียชีวิตแล้ว"
 funeral.0002.t: "ความตายในงานศพ"
 funeral.0002.desc: "เหตุผลอีกประการหนึ่งที่ต้องโศกเศร้าได้เกิดขึ้นกับเราในวันนี้ เมื่อเจ้าภาพของเรา [host.GetName] ได้ขึ้นสู่ [host.GetFaith.PositiveAfterLife] ในฐานะทายาทของ [host.GetHerHis] หน้าที่การเป็นเจ้าภาพของ [host.GetHerHis] ได้ตกทอดมาถึงข้าพเจ้า\n\nแม้ว่าสิ่งนี้จะไม่ได้หมายถึงจุดสิ้นสุดของพิธีอันเรียบง่ายของเรา แต่ก็บ่งชี้ว่าอาจมีงานศพเพิ่มขึ้นเร็วกว่าที่คาดไว้"
 funeral.0002.a: "ข้าพเจ้าจะทำในสิ่งที่ต้องทำ"
 funeral.0002.a.tt: "หน้าที่การเป็นเจ้าภาพงานศพได้ตกทอดมาถึงท่านแล้ว"
 funeral.0010.t: "การมาถึง"
 funeral.0010.desc_intro: "[ROOT.Char.GetInvolvedActivity.GetCurrentPhase.GetLocation.GetBaronyNameExplicitly] จะเป็นที่พำนักสุดท้ายของ [deceased.GetFirstNamePossessive] และข้าก็"
 funeral.0010.self: "ถูกทิ้งให้อยู่ตามลำพังเพื่อรวบรวมความคิดและเตรียมพร้อมสำหรับการมาถึงของผู้ไว้ทุกข์ผู้ทรงเกียรติ"
 funeral.0010.dislikes_host: "ได้รับการต้อนรับจาก [host.GetName] ผู้เป็น [host.Custom2('InsultAdjective', ROOT.Char)] [host.Custom2('InsultNoun', ROOT.Char)] แม้ข้าจะรังเกียจที่ต้องอยู่ร่วมกับ [host.GetHerHis] แต่แท้จริงแล้วข้ามาเพื่อ [deceased.GetName] นี่คือโอกาสของข้าที่จะ"
 funeral.0010.likes_host: "ได้รับการต้อนรับจาก [host.GetName] ผู้มีน้ำใจงาม นอกเหนือจากการได้เพลิดเพลินกับการอยู่ร่วมกับ [host.GetHerHis] แล้ว ข้าพเจ้ายังมาที่นี่เพื่อ [deceased.GetName] ด้วย นี่จะเป็นโอกาสสุดท้ายของข้าพเจ้าที่จะ"
 funeral.0010.neutral: "ได้รับการต้อนรับจาก [host.GetName] แม้ว่าข้าพเจ้าจะไม่ค่อยสนใจการอยู่ร่วมกับ [host.GetHerHis] แต่วันนี้เป็นเรื่องของ [deceased.GetName] จริงๆ และนี่เป็นโอกาสของข้าพเจ้าที่จะ"
 funeral.0010.disrespect: "หัวเราะเยาะเจ้าคนน่ารังเกียจนั้นเป็นครั้งสุดท้าย"
 funeral.0010.respect: "กล่าวคำอำลาครั้งสุดท้ายแก่ [deceased.GetHerHim]\n\n"
 funeral.0010.intent_arrived: "\n\nข้าพเจ้าเห็น [ROOT.Char.GetIntentTarget.GetTitledFirstName] ในหมู่ผู้ไว้ทุกข์ โดยไม่รู้เลยถึงแผนการของข้าพเจ้าที่จะ [ROOT.Char.GetInvolvedActivityIntent.GetName|l] [ROOT.Char.GetIntentTarget.GetHerHim]"
 funeral.0010.intent: "\n\nข้าพเจ้ายังหา [ROOT.Char.GetIntentTarget.GetTitledFirstName] ไม่พบ ข้าพเจ้ารอคอยการมาถึงของ [ROOT.Char.GetIntentTarget.GetHerHis] อย่างใจจดใจจ่อ เพื่อให้แผนการของข้าพเจ้าที่จะ [ROOT.Char.GetInvolvedActivityIntent.GetName|l] [ROOT.Char.GetIntentTarget.GetHerHim] สามารถเริ่มต้นได้ในที่สุด"
 funeral.0010.a.bad: "ตามความเห็นของข้าพเจ้า นี่คือเวลาแห่งการเฉลิมฉลอง"
 funeral.0010.a.good: "ข้าพเจ้าจะไม่มีวันลืม [deceased.GetHerHim]"
 funeral.0100.t: "ธุลีสู่ธุลี"
 funeral.0100.desc.intro: "บัดนี้ถึงเวลาประกอบพิธีกรรมสุดท้ายของ [deceased.GetNamePossessive] ก่อนการเดินทาง [deceased.GetHerHis] ครั้งสุดท้ายสู่โลกหน้า\n\n"
 funeral.0100.desc.intro2.burial: "ร่างที่ห่อหุ้มของ [deceased.GetFirstNamePossessive|U] ถูกแขวนอยู่เหนือหลุมศพที่เปิดอยู่ ล้อมรอบด้วยเพื่อนสนิทและครอบครัว ยืนอยู่ที่ศีรษะของ [deceased.GetHerHis] คือ [host.GetNameOrMe] สถานที่ไว้ทุกข์อันทรงเกียรติ ซึ่งสงวนไว้สำหรับเจ้าภาพผู้มีน้ำใจงามเท่านั้น"
 funeral.0100.desc.intro2.sky_burial: "ร่างของ [deceased.GetFirstNamePossessive|U] ถูกนำไปยังจุดสูงสุดใน [ROOT.Char.GetInvolvedActivity.GetCurrentPhase.GetLocation.GetBaronyNameExplicitly] พร้อมขบวนผู้ไว้ทุกข์ ก่อนถึงยอดเขา ร่างถูกทิ้งไว้ให้ [host.GetNameOrMe] นำไปสู่ช่วงสุดท้ายของการเดินทางโดยเฉพาะ"
 funeral.0100.desc.intro2.mummification: "ร่างที่เก็บรักษาไว้อย่างสมบูรณ์แบบของ [deceased.GetFirstNamePossessive|U] วางเปิดให้ทุกคนได้เห็น ผลงานอันยอดเยี่ยมของนักดองศพ ทำให้ [deceased.GetHerHim] ดูเหมือน [deceased.GetSheHe] สามารถลุกขึ้นเดินได้อีกครั้ง และก่อนที่ร่างจะถูกบรรจุในสุสานเป็นการถาวร มันถูกทิ้งให้อยู่ตามลำพังกับ [host.GetNameOrMe] เพียงครู่หนึ่ง"
 funeral.0100.desc.intro2.cremation: "[deceased.GetFirstName] นอนห่อด้วยผ้าขาวเนื้อดีบนกองฟอนสูงตระหง่าน [host.GetFaith.PriestNeuter] ยืนอยู่ข้าง [host.GetNameOrMe] พร้อมคบเพลิง แสงไฟริบหรี่ในสายลม"
 funeral.0100.desc.mid.hate: "\n\nเผชิญหน้ากับร่างของ [deceased.GetHerHis] ที่ไร้ชีวิต ข้าพเจ้าหัวเราะเบาๆ กับตัวเอง ข้าพเจ้าจะเป็นผู้มอบซากศพอันน่าสังเวชของ [deceased.GetHerHis] เป็นครั้งสุดท้าย"
 funeral.0100.desc.mid.love: "\n\nข้าพเจ้าแทบไม่อาจมองดู [deceased.GetHerHim] ได้ และแม้กระทั่งตอนนี้ ข้าพเจ้าก็ยังยากที่จะเชื่อว่านี่คือช่วงเวลาสุดท้ายของเราด้วยกันจริงๆ"
 funeral.0100.desc.mid.spouse: "\n\nข้าพเจ้าจ้องมอง [deceased.Custom('WifeHusband')] ที่จากไปเป็นครั้งสุดท้าย และอดไม่ได้ที่จะจินตนาการถึงเวลาทั้งหมดที่เราถูกปฏิเสธ หลานทั้งหมดที่เราไม่เคยเลี้ยงดู คืนแห่งความโรแมนติกทั้งหมดที่เราไม่เคยแบ่งปัน"
 funeral.0100.desc.mid.child: "\n\nข้าพเจ้ามองดูร่างไร้ชีวิตของ [deceased.Custom('GetDaughterSon')] ของข้าพเจ้าและคร่ำครวญ ไม่มี [ROOT.Char.GetMotherFather] คนใดควรมีชีวิตอยู่เพื่อเห็นลูกๆ ของ [ROOT.Char.GetHerHis] ถูกพรากไปอย่างโหดร้าย เช่นนี้"
 funeral.0100.desc.mid.predecessor: "\n\nการได้เห็น [deceased.GetHerHim] รายล้อมไปด้วยผู้ไว้ทุกข์มากมายและได้รับการฝังศพตามแบบ [ROOT.Char.GetFaith.GetAdjective] อย่างเหมาะสม ทำให้ข้าพเจ้ามีความหวังว่าบางทีข้าพเจ้าก็จะถูกจดจำอย่างรักใคร่ เช่นนี้ในฐานะ [ROOT.Char.GetTitleAsNameNoTooltip|U]"
 funeral.0100.desc.mid.young: "\n\nช่างเป็นโศกนาฏกรรมที่คนหนุ่มสาว เช่นนี้ต้องถูกพรากชีวิต [deceased.GetHerHis] ไปจาก [deceased.GetHerHim] ต่อหน้าต่อตาข้า"
 funeral.0100.desc.mid.old: "\n\nข้าพเจ้าทำได้เพียงปลอบใจตนเองเมื่อเห็นคนชรา เช่นนี้ในสภาพนี้ ชีวิตที่ยืนยาวและรุ่งโรจน์ เช่นนี้เป็นที่อิจฉาของหลายๆ คน และการถูกรายล้อมไปด้วยผู้ไว้ทุกข์มากมายคือทั้งหมดที่ [ROOT.Char.GetWomanMan] ทุกคนสามารถหวังได้"
 funeral.0100.desc.mid.fallback: "\n\nพิธีกรรมสุดท้ายของร่าง [deceased.GetHerHis] ถูกทิ้งไว้ให้ข้าพเจ้า และน้ำหนักของความรับผิดชอบ เช่นนี้ก็หนักอึ้งอยู่ในใจข้าพเจ้า"
 funeral.0100.desc.outro.burial: "ในที่สุด ร่างของ [deceased.GetHerHis] ก็ถูกหย่อนลงสู่พื้นดิน และพิธีศพก็เสร็จสิ้นอย่างเป็นทางการด้วยการสวดภาวนา"
 funeral.0100.desc.outro.sky_burial: "มีการกรีดตามพิธีกรรมเพื่อช่วยให้นกกินซากเข้าถึงเนื้อได้ และพิธีก็เสร็จสิ้นสำหรับตอนนี้ สิ่งที่เหลืออยู่คือการกลับมาในอีกไม่กี่วันเพื่อเก็บกระดูก"
 funeral.0100.desc.outro.mummification: "ซากมัมมี่ถูกทิ้งไว้ให้ข้าพเจ้าพร้อมกับโถใส่อวัยวะบางส่วน สุสานอาจเป็นที่เก็บของอย่างใดอย่างหนึ่ง แต่ราชสำนักของข้าพเจ้าก็เป็นสุสานที่เหมาะสมไม่แพ้กัน"
 funeral.0100.desc.outro.cremation: "ข้าพเจ้าลดคบเพลิงลงที่เชื้อไฟและเฝ้าดูขณะที่กองไม้ลุกโชน สิ่งที่เหลืออยู่ตอนนี้คือรอให้ [deceased.GetFirstNameNoTooltip] กลับคืนสู่เถ้าถ่าน"
 funeral.0100.a: "งดงาม"
 funeral.0100.b: "บัดนี้ [deceased.GetSheHe] มีชีวิตอยู่ตลอดไปในราชสำนัก"
 funeral.0100.c: "ข้าพเจ้าจะเก็บ [deceased.GetHerHim] ไว้กับตัวเสมอ"
 funeral.0100.d: "ทั้งหมดควรอยู่ในสุสาน"
 funeral.0101.t: "$funeral.0100.t$"
 funeral.0101.desc.intro: "$funeral.0100.desc.intro$"
 funeral.0101.desc.intro2.burial: "$funeral.0100.desc.intro2.burial$"
 funeral.0101.desc.intro2.sky_burial: "$funeral.0100.desc.intro2.sky_burial$"
 funeral.0101.desc.intro2.mummification: "$funeral.0100.desc.intro2.mummification$"
 funeral.0101.desc.intro2.cremation: "$funeral.0100.desc.intro2.cremation$"
 funeral.0101.desc.outro.burial: "\n\nเราได้รับบทสวดภาวนาตามประเพณีสำหรับผู้ล่วงลับ จากนั้นร่างของ [deceased.GetHerHis] ก็ค่อยๆ ถูกหย่อนลงในหลุมศพของ [deceased.GetHerHis] ที่ ซึ่ง [deceased.GetSheHe] อาจพักผ่อนในสรวงสวรรค์ชั่วนิรันดร์"
 funeral.0101.desc.outro.sky_burial: "\n\nมีการกรีดตามประเพณีทั่วร่าง และนกที่หิวโหยก็บินอยู่เหนือศีรษะแล้ว พร้อมที่จะกินเนื้อ สิ่งที่เหลืออยู่ตอนนี้คือปล่อยให้พวกมันทำงาน และ [host.GetFaith.PriestNeuterPlural] จะกลับมาในอีกไม่กี่วันเพื่อเก็บกระดูก"
 funeral.0101.desc.outro.mummification: "\n\nบัดนี้ซากศพพร้อมกับอวัยวะในโถของ [deceased.GetHerHis] ถูกนำไปโดย [host.GetName] เพื่อเก็บรักษาไว้ชั่วนิรันดร์"
 funeral.0101.desc.outro.cremation: "คบเพลิงถูกลดลงที่เชื้อไฟและข้าพเจ้าเฝ้าดูขณะที่กองไม้ลุกโชน สิ่งที่เหลืออยู่ตอนนี้คือรอให้ [deceased.GetFirstNameNoTooltip] กลับคืนสู่เถ้าถ่าน"
 funeral.0101.a: "$funeral.0100.a$"
 funeral.1000.t: "ข้าพเจ้าจำ [deceased.GetHerHim|U] ได้"
 funeral.1000.desc: "ในมุมเงียบๆ ของ [host.GetFaith.HouseOfWorship] ข้าพเจ้าได้ยิน [random_attendee.GetName] พูดคุยกับกลุ่มผู้ไว้ทุกข์ [random_attendee.GetSheHe|U] กวักมือเรียกข้าพเจ้าอย่างเศร้าสร้อย\n\n"เราทุกคนมีความทรงจำที่ดีเกี่ยวกับ [deceased.GetName] ข้าพเจ้าเพิ่งพูดถึงตอนที่ [attendee_memory.GetDescription] บอกข้าพเจ้าหน่อย ท่านมีความทรงจำใดจะแบ่งปันหรือไม่?""
 funeral.1000.a: "ความทรงจำนั้นเจ็บปวดเกินไป"
 funeral.1000.b: "อ-อา ใช่ ข้าพเจ้ารู้จัก [deceased.GetHerHim] ดี"
 funeral.1000.b.success: "ท่านโกหกจนรอดไปได้"
 funeral.1000.b.failure: "ไม่มีใครเชื่อท่าน"
 funeral.1000.c: "ข้าพเจ้ายอมรับ ข้าพเจ้าไม่มีอะไรเลย"
 funeral.1000.d: "ข้าพเจ้าจะลืมได้อย่างไร?"
 funeral.1000.d.success: "ความทรงจำของท่าน ทำให้น้ำตาไหล"
 funeral.1000.d.failure: "ท่านอธิบายได้ไม่ดีพอ"
 funeral.1000.e: "นี่ไม่ใช่การแข่งขัน"
 funeral.1010.t: "เครื่องบูชาในหลุมศพ"
 funeral.1010.desc: "ขุนนางคนสำคัญจำนวนมากเกินกว่าจะเอ่ยนามได้เดินผ่านร่างที่ห่อหุ้มของ [deceased.GetName] มอบให้ [deceased.GetHerHim] เพียงแค่การโค้งคำนับหรือพยักหน้าเล็กน้อย ราวกับว่าท่าทาง เช่นนั้นเพียงพอที่จะแสดงความเคารพต่อชีวิต หัวใจของข้าพเจ้าหนักอึ้งเท่ากับกระเป๋าของข้าพเจ้า ซึ่งเต็มไปด้วยของกระจุกกระจิกและความทรงจำของ [deceased.GetFirstNameNoTooltip]\n\nข้าพเจ้าอดสงสัยไม่ได้ว่าทำไมข้าพเจ้าควรจะได้กักตุนสิ่งของที่เป็นของ [deceased.GetHerHim] อย่างถูกต้องตามกฎหมาย"
 funeral.1010.a: "[common_grave_good.GetNameNoTooltip] ไม่ใช่ของที่ข้าพเจ้าจะถือครอง"
 funeral.1010.b: "[masterwork_grave_good.GetNameNoTooltip] เป็นของ [ROOT.Char.GetFaith.PositiveAfterLife]"
 funeral.1010.c: "[famed_grave_good.GetNameNoTooltip] จะถูกมอบให้"
 funeral.1010.d: "ไม่มีสิ่งใดน้อยไปกว่า [illustrious_grave_good.GetNameNoTooltip] ที่คู่ควร"
 funeral.1010.e: "เลิกคิดเสียเถิด"
 funeral.1020.t: "[host.GetTitleAsNameNoTooltip|U] จอมปลอม"
 funeral.1020.desc: "เหล่าผู้ไว้ทุกข์ห้อมล้อม [host.GetName] กล่าวแสดงความเคารพและอวยพรต่อผู้ที่เรียกตนเองว่า '[host.GetTitleAsNameNoTooltip|U]' ไม่มีผู้ใดแสดงความเคารพ เช่นเดียวกันนั้นต่อข้า แม้สถานะของข้าจะเด่นชัด\n\n[deceased.GetName] ต้องการให้ [host.GetFirstNameNoTooltip] เป็นผู้สืบทอดของ [deceased.GetHerHis] อย่างแท้จริงหรือ"
 funeral.1020.c: "[deceased.GetFirstNameNoTooltip] คงต้องการให้ข้าพเจ้าสนับสนุน [host.GetHerHim]"
 funeral.1020.a: "ทุกคนต้องรู้ถึงสิทธิ์อันชอบธรรมของข้าพเจ้า!"
 funeral.1020.b: "ยังไม่ถึงเวลา"
 funeral.1021.t: "$funeral.1020.t$"
 funeral.1021.desc: "ข้าจ้องมอง [deceased.GetName] พลางครุ่นคิดอย่างเงียบงัน ถูกขัดจังหวะเป็นครั้งคราวโดยผู้ที่มาอวยพร ซึ่งมาแสดงความเห็นใจ\n\n\"[ROOT.Char.Custom2('InsultNoun', SCOPE.sC('claimant'))|U]! [ROOT.Char.Custom2('InsultNoun', SCOPE.sC('claimant'))|U]! [ROOT.Char.Custom2('InsultNoun', SCOPE.sC('claimant'))|U]! เจ้ากล้าเรียกตนเองว่า [ROOT.Char.GetTitleAsNameNoTooltip|U] รึ\" [claimant.Custom2('MyCharacterIntroduction', ROOT.Char)|U] พุ่งตัว [claimant.GetHerselfHimself] เข้ามาหาข้า นิ้วชี้กราดเกรี้ยวชี้ห่างจากใบหน้าข้าเพียงไม่กี่นิ้ว \"[deceased.GetNameNoTooltip|U] ได้หมายตา #EMP ข้า#! ให้เป็นผู้นำแทนที่ [deceased.GetHerHis] ต่างหาก! เจ้าคนชั่วร้าย!\""
 funeral.1021.a: ""ออกไป!""
 funeral.1021.a.toast: "ท่านถูกนำตัวออกจากงานศพ"
 funeral.1021.b: ""ข้าพเจ้าไม่สนใจ""
 funeral.1021.b.toast: "การระเบิดอารมณ์ของท่านถูกเพิกเฉย"
 funeral.1030.t: "หากต้องใช้เวลานานชั่วนิรันดร์"
 funeral.1030.desc: "ข้าพเจ้าเฝ้าดูผู้มาและผู้ไปจำนวนมากปฏิบัติหน้าที่อันน่าเบื่อหน่ายของตนไปมา อย่างไรก็ตาม มีผู้มาเยือนคนหนึ่งนอนนิ่งไม่ไหวติงอยู่ข้าง [deceased.GetFirstName] ที่จากไป\n\nเป็นเวลาหลายชั่วโมงที่มันยังคงอยู่ ราวกับจะอยู่ที่นั่นชั่วนิรันดร์ สุนัขล่าเนื้อผู้ซื่อสัตย์ของ [ROOT.Char.Custom2('RelationToMeShort', deceased)] ของข้าพเจ้าคร่ำครวญและหอนหา [deceased.GetWomanMan] ที่ [ROOT.Char.GetFaith.HighGodName] ได้ตั้งให้เป็นนายของมัน มันนอนรอและไม่ทำอะไรเลยนอกจากนั้น และหากข้าพเจ้าไม่ขัดจังหวะ มันอาจตามร่างไปสู่ปรโลก"
 funeral.1030.a: ""มาเถิด มาอยู่ข้างข้าพเจ้าในการไว้ทุกข์""
 funeral_1030_adopt_tt: "ท่านรับเลี้ยงสุนัขของ [deceased.GetFirstNamePossessiveNoTooltip]"
 funeral.1030.b: ""จงออกไปจากนายที่ไม่เคลื่อนไหวของเจ้า!""
 funeral.1030.c: "จงไว้ทุกข์ให้จมูกของเจ้า เพราะมันจะได้พบกับรองเท้าบู๊ตของข้าพเจ้า!"
 funeral.1040.t: "ไม่เน่าเปื่อย"
 funeral.1040.desc: "ร่างของ [ROOT.Char.Custom2('RelationToMeShort', deceased)] ที่ข้าพเจ้าสูญเสียไป บัดนี้ไร้ชีวิตมาหลายวันแล้ว แต่ดวงตาของ [deceased.GetHerHis] ยังคงมีชีวิตชีวาอยู่ เป็นสายตาของพระเจ้า [ROOT.Char.GetFaith.HighGodNamePossessive|U] ปกป้องร่างจากการเน่าเปื่อยและการเสื่อมสลาย ราวกับรักษา [deceased.GetHerHim] ไว้ในความฝันระหว่างความเป็นและความตาย\n\nฝูงชนที่โห่ร้องได้ประกาศว่าร่างนี้ไม่เน่าเปื่อย ได้รับเลือกให้ขึ้นสู่สวรรค์เพื่อเป็น [GetTrait('saint').GetName( deceased )]"
 funeral.1040.a: "ปาฏิหาริย์ต่อหน้าต่อตาข้าพเจ้า"
 funeral.1040.b: "ข้าพเจ้าต้องทำหน้าที่เป็นทนายของ [ROOT.Char.GetFaith.DevilNamePossessive]"
 funeral.1040.b.success: "การแก้ต่างของท่านเป็นไปด้วยดี"
 funeral.1040.b.failure: "การแก้ต่างของท่านถูกเพิกเฉย"
 funeral.1040.c: "สิ่งเดียวกันจะเกิดขึ้นกับข้าพเจ้า ไม่ต้องสงสัย"
 funeral.1050.t: "ช่วงเวลาของเรา"
 funeral.1050.desc: "ในบรรดาบุคคลที่เคารพนับถือและชั่วร้ายทั้งหมด ไม่มีใครเป็นที่ต้องการมากไปกว่า [deceased.GetName] ผู้ล่วงลับของเรา เมื่อฝูงชนผู้ร้องไห้และผู้มุงดูของ [deceased.GetHerHis] พบหัวข้ออื่นเพื่อสนองความหลงใหลของพวกเขา ในที่สุดข้าพเจ้าก็เหลือช่วงเวลาแห่งความปลอบใจระหว่างตัวข้าพเจ้ากับ [ROOT.Char.Custom2('RelationToMeShort', deceased)] ของข้าพเจ้า"
 funeral.1050.witch: "ข้าพเจ้าจะเอาผมไปบ้าง"
 funeral.1050.a: "เวลาสำหรับการสวดภาวนาอย่างเงียบๆ"
 funeral.1050.b: "อนุญาตให้ตัวเองมีช่วงเวลาแห่งความโศกเศร้า"
 funeral.1050.c: "ปล่อยมันออกมาให้หมด"
 funeral.1050.d: "ข้าพเจ้าสัญญาว่าจะเป็น [ROOT.Char.GetTitleAsNameNoTooltip|U] ที่ดีขึ้น"
 funeral.1060.t: "ดาวแห่งการไว้ทุกข์"
 funeral.1060.desc: "ทุกสายตาจับจ้องไปที่ [other_mourner.GetName] ขณะที่ [other_mourner.GetSheHe] ล้มลงกับพื้นด้วยความคร่ำครวญ มือปิดบังดวงตาที่แดงก่ำของ [other_mourner.GetHerHis] จากสายตา เสียงสะอื้นและสำลักอันน่าเศร้าของ [other_mourner.GetNamePossessiveNoTooltip|U] ทำให้เพื่อนผู้ไว้ทุกข์ของ [other_mourner.GetHerHis] แทบหยุดหายใจ และหลายคนมอบความปลอบโยนและความเคารพแก่ [other_mourner.GetHerHim] ราวกับว่า [other_mourner.GetHerHim] คือผู้ที่จะถูกส่งไปยังปรโลก"
 funeral.1060.a: "สายตาต้องจับจ้องมาที่ข้าพเจ้าเท่านั้น"
 funeral.1060.a.success: "ทุกสายตาจับจ้องมาที่ท่าน"
 funeral.1060.a.failure: "ท่าน ทำให้ตัวเองดูโง่เขลา"
 funeral.1060.b: "ข้าพเจ้าทำได้เพียงไว้ทุกข์ในแบบของข้าพเจ้าเอง"
 funeral.1060.c: "ข้าพเจ้ามอบความปลอบโยน"
 funeral.1070.t: "ความตายคืออะไร?"
 funeral.1070.desc: "ความตาย รอบตัวข้า มี แต่การพูดถึงความตาย [ROOT.Char.GetFaith.PositiveAfterLife] และ [ROOT.Char.GetFaith.NegativeAfterLife] มันดังก้องอยู่ในใจข้า ความคิดถึงใบหน้าของ [deceased.GetFirstNamePossessive] การไม่ได้เห็นมันอีกต่อไป แต่ถึงกระนั้นความตายและความหมายของมันก็หลุดลอยไปจากความเข้าใจของข้าราวกับทรายที่รอดผ่านนิ้วมือที่กางออก\n\nชะตากรรมนี้ ไม่ว่าจะโหดร้ายหรือเมตตา ก็ ทำให้แม้ แต่ผู้ใหญ่ที่เข้มแข็งที่สุดต้องหลั่งน้ำตา ไม่ว่าจะในความเงียบหรือร้องไห้โฮ แล้วมันคืออะไรกันแน่? บางที [other_mourner.GetName] อาจให้คำตอบง่ายๆ แก่ข้าได้"
 funeral.1070.a: "ทำไมทุกคนถึงเศร้าโศก เช่นนี้?"
 funeral.1070.b: "ข้าพเจ้าควรจะทำตามที่คนอื่นทำ..."
 funeral.1071.t: "ความเยาว์วัยอันไม่เที่ยง"
 funeral.1071.desc: "ข้าพเจ้ารู้สึกถึงความสงบเงียบที่แผ่ซ่านไปทั่วตัวข้าพเจ้า ขณะมองไปรอบๆ ห้องของผู้ไว้ทุกข์ บางดวงตาแดงก่ำ คนอื่นๆ อาจมองว่านี่เป็นเหมือนเหตุผลอื่นใดสำหรับการรวมตัว อย่างไรก็ตาม มีวิญญาณดวงหนึ่งมองมาที่ข้าพเจ้าด้วยความไม่แน่ใจขณะที่ [confused_child.GetSheHe] ดึงข้างตัวข้าพเจ้า\n\n[confused_child.Custom2('MyCharacterIntroduction', ROOT.Char)|U] ไม่ได้ร้องไห้ออกมา แต่ดูเหมือนจะไม่สะทกสะท้านเหมือนเด็กคนอื่นๆ หลายคน "[ROOT.Char.GetNameNoTooltip] เกิดอะไรขึ้นกับ [deceased.GetFirstName]? ทำไมทุกคนถึงเศร้า?""
 funeral.1071.a: ""อย่ากังวลไปเลย เด็กน้อย""
 funeral.1071.a.tt: "[other_mourner.GetFirstName] มอบความปลอบโยนแก่ท่าน"
 funeral.1071.b: ""ตอนนี้ [deceased.GetSheHe|U] อยู่ใน [ROOT.Char.GetFaith.PositiveAfterLife] แล้ว""
 funeral.1071.b.reincarnation: ""[deceased.GetSheHe|U] ยังคงเดินทางต่อไปในการเวียนว่ายตายเกิดของ [deceased.GetHerHis]""
 funeral.1071.b.taoism: ""ตอนนี้ [deceased.GetSheHe|U] ได้กลับคืนสู่จักรวาลแล้ว""
 funeral.1071.a.success: "เด็กได้รับการปลอบโยน"
 funeral.1071.a.success.child: "ท่านได้รับการปลอบโยนจากความคิดเกี่ยวกับปรโลก"
 funeral.1071.a.failure: "เด็กได้รับความบอบช้ำทางจิตใจ"
 funeral.1071.a.failure.child: "ท่านตระหนักถึงความตายของตนเอง"
 funeral.1080.t: "ความโศกเศร้าของ [other_mourner.Custom2('RelationToMeShort', deceased)|U]"
 funeral.1080.desc: "นั่งงอตัวอยู่ข้างข้าพเจ้า ปราศจากท่าทีเสแสร้งของความเหมาะสม [other_mourner.GetFirstName] ผู้ไม่อาจปลอบโยนได้ จ้องมองออกไปในความว่างเปล่าเบื้องหน้า [other_mourner.GetHerHim] ไม่มีน้ำตาสักหยดไหลจากดวงตาของ [other_mourner.GetHerHis] ไม่มีคำพูดใดผ่านปากของ [other_mourner.GetHerHis] จนกระทั่ง [other_mourner.GetSheHe] หันมาหาข้าพเจ้า\n\n"[other_mourner.GetFaith.HighGodName|U] ช่างโหดร้ายเสียจริง ทำไมลมยังคงพัดอยู่? ทำไมทะเลยังคงซัดเข้าหาฝั่ง? ทำไมร่างกายของข้าพเจ้าถึงปวดร้าว เพราะความหิวและกระหายน้ำ? [other_mourner.Custom('apocalypse_name')|U] อยู่ใกล้แค่เอื้อมแล้ว [other_mourner.Custom2('RelationToMeShort',deceased)] ของข้าพเจ้าตายแล้ว""
 funeral.1080.a: ""ความรู้สึกของข้าพเจ้าก็ เช่นเดียวกัน""
 funeral.1080.b: ""ทีนี้ จำไว้ เราต้องไม่ปล่อยให้ความโศกเศร้าครอบงำเรา""
 funeral.1080.c: ""ตราบใดที่ยังมีชีวิต ก็ยังมีความหวังเสมอ""
 funeral.1080.c.success: "[other_mourner.GetSheHe] ได้รับการปลอบโยน"
 funeral.1080.c.failure: "[other_mourner.GetSheHe] รู้สึกถูกดูหมิ่น"
 funeral.1080.d: "พยักหน้าอย่างเงียบๆ"
 funeral.1090.t: "โอกาสสุดท้าย"
 funeral.1090.desc: "แถวอันน่าเศร้าเคลื่อนไปข้างหน้า แถวที่จะได้มีช่วงเวลาสุดท้ายกับ [deceased.GetName] เสียงกระซิบสุดท้าย คำอำลายาวนานสุดท้าย ความว่างเปล่าสุดท้าย ณ สถานที่สุดท้ายที่ใครๆ จะได้เห็น [deceased.GetHerHim] อีกครั้ง ช่างเป็นสิทธิพิเศษจริงๆ ที่ได้มาอยู่ที่นี่\n\nแถวพาข้าพเจ้าเข้าใกล้มากขึ้นเรื่อยๆ จนกระทั่งในที่สุดร่างที่อยู่ข้างหน้าข้าพเจ้าก็แยกออก และไม่มีอะไรนอกจากม่านกั้นระหว่างข้าพเจ้ากับ [deceased.GetHerHim]"
 funeral.1090.a: "ทุกคนจะได้ยินเสียงความโศกเศร้าของข้าพเจ้า"
 funeral.1090.b: "โค้งคำนับอย่างเงียบๆ แล้วข้าพเจ้าก็จากไป"
 funeral.1090.c: ""ในที่สุด ข้าพเจ้าก็ชนะ""
 funeral.1090.d: "กล่าวสุนทรพจน์สัญญาว่าจะปกครองเพื่อเป็นเกียรติแก่ [deceased.GetHerHis]"
 funeral.1090.d.success: "ฝูงชนรู้สึกประทับใจ"
 funeral.1090.d.failure: "ท่าน ทำให้ตัวเองดูโง่เขลา"
 funeral.1090.e: "พูดถึงคุณธรรมของ [deceased.GetHerHis]"
 funeral.1100.t: "หนึ่งในผู้ยิ่งใหญ่"
 funeral.1100.desc: "เบื้องหน้าข้าพเจ้าคือโต๊ะเลี้ยงที่เต็มไปด้วยอาหารและเครื่องดื่มทุกประเภท ราวกับว่า [deceased.GetName] กำลังพยายามแสดงความมีน้ำใจงามเป็นครั้งสุดท้ายก่อนจากไป\n\nอย่างไรก็ตาม [other_mourner.GetName|U] ปฏิเสธที่จะแตะต้องงานเลี้ยงนี้เลยแม้ แต่น้อย แกว่งแก้วของ [other_mourner.GetHerHis] ไปมาด้วยความปลอบใจอย่างเกียจคร้าน สายตาระยะกลางของ [other_mourner.GetHerHis|U] ตกกระทบมาที่ข้าพเจ้าอย่างเหนื่อยล้า และด้วยการพยักหน้าอย่างเงียบๆ [other_mourner.GetSheHe] ก็ยกเครื่องดื่มของ [other_mourner.GetHerHis] ขึ้นสูง\n\n"แด่ [deceased.GetNameNoTooltip] หนึ่งในผู้ยิ่งใหญ่อย่างแท้จริง""
 funeral.1100.a: ""ยิ่งใหญ่จริงๆ และข้าพเจ้าจะยิ่งใหญ่กว่านั้นอีก""
 funeral.1100.a.success: "ฝูงชนรู้สึกประทับใจ"
 funeral.1100.a.failure: "ความคิดเห็นของท่านก่อให้เกิดการดูหมิ่นอย่างรุนแรง"
 funeral.1100.b: ""แด่ [deceased.GetNameNoTooltip]!""
 funeral.1100.c: ""บอกเราว่า [deceased.GetSheHe] มีความหมายต่อท่านอย่างไรจริงๆ""
 funeral.1100.d: "สวดภาวนาอย่างเงียบๆ"
 funeral.1110.t: "เวลาแห่งการไว้ทุกข์"
 funeral.1110.desc: "เงาของผู้ไว้ทุกข์ไม่ทอดทับข้าพเจ้าอีกต่อไป และในที่สุดข้าพเจ้าก็ได้รับช่วงเวลาอยู่ตามลำพัง ช่างเป็นความปลอบใจอันเงียบสงบที่ข้าพเจ้าจะได้รับในช่วงเวลา เช่นนี้ โดยปราศจากเสียงอึกทึกและเสียงพูดพล่ามของแขกคนอื่นๆ ในหูของข้าพเจ้า มีเพียงข้าพเจ้าและความคิดของข้าพเจ้าเกี่ยวกับ [deceased.GetName]"
 funeral.1110.a: "รู้สึก... ดี"
 funeral.1120.t: "การถวายเครื่องดื่มบูชา"
 funeral.1120.desc: "ข้าพเจ้าและผู้ไว้ทุกข์คนอื่นๆ พักจากความโศกเศร้าเพื่อเพลิดเพลินกับอาหารมากมาย [other_mourner.GetName|U] ซึ่งปกติแล้วเป็นชีวิตชีวาของงานเลี้ยงใดๆ บัดนี้นั่งอยู่ตรงข้ามข้าพเจ้าด้วยดวงตาที่คลอไปด้วยน้ำตาพร้อมแก้วที่ยังไม่ได้แตะต้องอยู่ข้าง [other_mourner.GetHerHis]\n\n"เราจะ ทำให้อ้วนพีและร่าเริงในเวลา เช่นนี้ได้อย่างไร? เราจะสนองความต้องการทางกามารมณ์ของเรา ในขณะที่ [deceased.GetFirstName] ไม่มีเลยหรือ? มาร่วมกับข้าพเจ้า! เทแก้วของท่านเพื่อเป็นการถวายเครื่องดื่มบูชา!"\n\nแขกดูเหมือนจะเห็นด้วย มีปัญญาอยู่ในความคร่ำครวญอันโง่เขลาของ [other_mourner.GetFirstNamePossessiveNoTooltip]"
 funeral.1120.aniconist: ""เจ้าคนโง่เขลาบูชารูปเคารพ!""
 funeral.1120.a: "เข้าร่วมในการถวาย"
 funeral.1120.b: "เครื่องดื่มรอบหนึ่งสำหรับทุกคน!"
 funeral.1120.c: "ข้าพเจ้าจะจดจำ [deceased.GetHerHim] ในแบบของข้าพเจ้าเอง"
 funeral.1130.t: "ช่วงเวลาแห่งการไว้ทุกข์"
 funeral.1130.desc.intro: "ผู้ไว้ทุกข์เคลื่อนผ่านห้องโถง ร้องไห้คร่ำครวญราวกับการเต้นรำอันน่าสยดสยอง ทั้งหมดเพื่อ [deceased.GetName]"
 funeral.1130.desc.bewailment: "ห้องหนาแน่นไปด้วยเสียงร้องไห้คร่ำครวญของผู้ไว้ทุกข์ในเสียงประสานแห่งความทุกข์ทรมาน และข้าพเจ้านั่งอยู่ท่ามกลางทั้งหมดนั้น หูอื้อและจิตวิญญาณปวดร้าว"
 funeral.1130.desc.stoic: "ความเงียบอันน่าอึดอัดของผู้คนที่กลั้นสิ่งที่พวกเขาปรารถนาจะทำอย่างยิ่ง เสียงกรีดร้องเงียบๆ ที่ไม่เคยหลุดออกจากริมฝีปาก การต่อสู้อย่างหนักกับน้ำตาที่กำลังพ่ายแพ้ ละอายใจในความโศกเศร้าของตนเอง"
 funeral.1130.desc.outro: "\n\nข้าพเจ้าลุกขึ้นยืนและปล่อยให้ตัวเองหลงไปกับการเต้นรำกับเพื่อนผู้ไว้ทุกข์"
 funeral.1130.a: "ข้าพเจ้าต้องการให้โลกรู้ว่ารู้สึกอย่างไร"
 funeral.1130.b: "ข้าพเจ้าต้องเข้มแข็งไว้"
 funeral.1140.t: "ไปด้วยกันหรือไม่ไปเลย"
 funeral.1140.desc: "ข้าพเจ้าพักจากความโศกเศร้าท่ามกลางวิญญาณมากมายที่มาแสดงตนต่อ [deceased.GetName] ไกลออกไปจากเสียงคร่ำครวญอันน่าเศร้า ข้าพเจ้าได้ยินเสียงร้องโหยหวนที่ไม่ใช่ของโลกนี้ดังก้องไปทั่วความว่างเปล่าของห้องโถง\n\nณ แหล่งกำเนิดเสียง ข้าพเจ้าพบ [soulmate.GetName] อยู่ตามลำพังในห้องมืด เสียงร้องไห้ของ [soulmate.GetHerHis] เงียบลงอย่างรวดเร็วขณะที่ [soulmate.GetSheHe] มองมาที่ข้าพเจ้าด้วยดวงตาที่ไร้ความรู้สึก ในมือของ [soulmate.GetHerHis] คือขวดที่น่าสะพรึงกลัวไม่มีเครื่องหมาย\n\n"อีกไม่นานก็จะถึงวัน แต่งงานของเราแล้ว""
 funeral.1140.a: ""นี่คือสิ่งที่ [deceased.GetSheHe] ต้องการจริงๆ หรือ?""
 funeral.1140.a.success: "ท่านช่วยชีวิต [soulmate.GetHerHis] ไว้"
 funeral.1140.a.failure: "ท่านล้มเหลวในการช่วยชีวิต [soulmate.GetHerHis]"
 funeral.1140.b: "ทุบขวดทิ้ง"
 funeral.1140.c: "ปิดประตูอย่างเงียบๆ"

