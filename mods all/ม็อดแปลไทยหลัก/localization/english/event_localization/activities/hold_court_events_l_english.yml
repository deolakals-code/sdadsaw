l_english: 
 hold_court_placeholder_gain_cgv:0 "ท่านได้รับ #P 10#! ความยิ่งใหญ่ของราชสำนัก"
 hold_court_placeholder_lose_cgv:0 "ท่านสูญเสีย #N 10#! ความยิ่งใหญ่ของราชสำนัก"
 hold_court_start_activity:0 "ท่านรับฟังคำร้องจากผู้ยื่นคำร้องคนแรก"

 hold_court_header:0 "ว่าราชการ:"

 # Activity Start
 hold_court.0001.t:0 "$hold_court_header$ การเริ่มต้น"
 hold_court.0001.desc:0 "ขณะประทับบนบัลลังก์ ข้าส่งสัญญาณให้ทหารรักษาพระองค์เปิดประตูห้องโถง ผู้คนหลั่งไหลเข้ามา บ้างเข้าแถวหน้าบัลลังก์ของข้า บ้างหลีกทางไปเพื่อสังเกตการณ์\n\nครู่ต่อมา ความเคลื่อนไหวทั้งหมดในห้องก็หยุดลง ทุกใบหน้าจับจ้องมาที่ข้าอย่างคาดหวัง เบื้องหน้าข้า ข้านับผู้ยื่นคำร้องได้ [ROOT.Var('num_petitioners').GetValue|V0] คน เข้าแถวอย่างเป็นระเบียบ รอให้ข้าเรียกตัว"
 hold_court.0001.a:0 "ส่งสัญญาณให้คนแรกในแถวเข้ามา"
 hold_court.0001.b:0 "คิดดูอีกที วันนี้อากาศข้างนอกช่างดีเหลือเกิน..."
 hold_court.0001.b.tooltip:0 "การเข้าเฝ้าของท่านสิ้นสุดลง และท่านส่งผู้ยื่นคำร้องกลับบ้าน"

 # Guest offers to share rumors from a nearby foreign realm.
 hold_court.1001.t:0 "การจารกรรมทางอ้อม"
 hold_court.1001.desc:0 "แขกของข้า [rumormonger.GetTitledFirstName] เข้ามาใกล้บัลลังก์พร้อมรอยยิ้มเจ้าเล่ห์บนใบหน้าของ [rumormonger.GetHerHis] และโค้งคำนับอย่างลึกซึ้ง\n\n"ถวายบังคมฝ่าบาท ในระหว่างการเดินทางครั้งล่าสุดของข้าพเจ้าไปยัง [neighboring_realm.GetName] ข้าพเจ้าได้เรียนรู้เกร็ดเล็กเกร็ดน้อยที่ #EMP น่าทึ่ง#! เกี่ยวกับข้าราชบริพารหลายคนของ [neighboring_ruler.GetTitledFirstNamePossessive] ข้าพเจ้ายินดีที่จะแบ่งปันสิ่งเหล่านี้กับฝ่าบาท... หากมีค่าตอบแทน""
 hold_court.1001.a:0 "เป็นจำนวนเงินที่มากโข แต่ข้าไม่อาจปล่อยให้ตนเองไม่รู้เรื่องราวได้"
 hold_court.1001.a.seducer:0 "บางทีเราอาจตกลงกันด้วยวิธีอื่นได้?"
 hold_court.1001.a.success:0 "ข้อมูลของ [rumormonger.GetTitledFirstNamePossessive] มีเนื้อหาที่ใช้แบล็กเมล์ได้อย่างมีค่า"
 hold_court.1001.a.success.tt:0 "[rumormonger.GetTitledFirstName] เปิดเผย [secret|E] ที่เกี่ยวข้องทุกอย่างที่ [rumormonger.GetSheHe] รู้แก่ท่าน"
 hold_court.1001.a.failure:0 "ข้อมูลของ [rumormonger.GetTitledFirstNamePossessive] เป็นเพียงเรื่องซุบซิบนินทาไร้สาระ"
 hold_court.1001.a.failure.tt:0 "อันที่จริง [rumormonger.GetTitledFirstName] ไม่รู้ [secrets|E] ที่เกี่ยวข้องใดๆ เลย"
 hold_court.1001.b:0 "ไม่มีใครขู่กรรโชกข้าต่อหน้าข้าราชสำนักของข้าได้! ทหาร จับตัว [rumormonger.GetHerHim]!"
 hold_court.1001.c:0 "ไปให้พ้น เจ้าคนปล่อยข่าวลือ! ราชสำนักของข้าไม่มีที่สำหรับคน เช่นเจ้า!"

 # Wandering claimant asks you to press their claim NOW!!
 hold_court.1011.t:1 "สิทธิ์ในการทำสงคราม"
 hold_court.1011.desc:0 ""โอ้ [ROOT.Char.GetTitledFirstNameNoTooltip] ผู้ทรงพระกรุณา ข้าคือ [claimant_guest.GetFirstName] และข้าเดินทางมาไกลเพื่อขอความช่วยเหลือจากท่านในการแก้ไขความอยุติธรรมอันใหญ่หลวง!"\n\n[claimant_guest.GetWomanMan] เบื้องหน้าข้าโค้งคำนับอย่างลึกซึ้งก่อนจะกล่าวคำร้องที่เตรียมมาอย่างดีของ [claimant_guest.GetHerHis] ต่อไป "[target_character.Custom2('MyCharacterIntroduction', claimant_guest)|U] กำลังครองบัลลังก์แห่ง [target_title.GetNameNoTier] อยู่ในขณะนี้ แต่ข้าคือผู้ปกครองที่แท้จริงและโดยชอบธรรมของดินแดนเหล่านั้น!"\n\n"หากท่านช่วยข้าในการกดดันสิทธิ์ของข้า ข้าจะสาบานความภักดีต่อท่าน และรับใช้ท่านอย่างซื่อสัตย์จนสิ้นอายุขัย""
 hold_court.1011.a:1 "ข้าจะกดดันสิทธิ์ของเจ้าภายในปีนี้!"
 hold_court.1011.b:0 "โปรดจากไปทันที — ข้าไม่อาจเสี่ยง ทำให้ [target_character.GetTitleAsNameNoTooltip] ขุ่นเคืองได้"
 hold_court.1011.c:0 "ข้าช่วยเจ้าไม่ได้ แต่โปรดเพลิดเพลินกับการต้อนรับของข้าเถิด"

 # Peasant begs for relief after a drought/early frost/etc.
 hold_court.1021.t:0 "ธุลีสู่ธุลี"
 hold_court.1021.desc:0 "ชาวนาผอมโซมอมแมมผู้หนึ่งยืนอยู่เบื้องหน้าข้า ตะลึงลานในความหรูหราของห้องบัลลังก์ข้า เห็นได้ชัดว่า [peasant.GetHerHis] สติไม่อยู่กับตัว ข้าจึงเรียก [peasant.GetHerHim] เพื่อเรียกสติ\n\n"โอ้ ขออภัย [ROOT.Char.Custom('FormOfAddressForLiege')] ข้า เอ่อ... หมู่บ้านของข้าใน [county.GetNameNoTier] ประสบภัยโรคระบาดพืชในปีนี้ เราไม่เพียงเสียพืชผล แต่ยังเสียเมล็ดพันธุ์ด้วย เราไม่เหลือสิ่งใด เราจะอดตายหากไร้ความช่วยเหลือ!"\n\n[peasant.GetSheHe] เหลือบมองรอบห้องบัลลังก์ข้าอีกครั้ง แล้วเอ่ยเสริมว่า "แน่นอนว่าท่านย่อมมีทรัพย์สมบัติเหลือเฟือ""
 hold_court.1021.a:0 "เจ้าจะได้รับเงินทุนที่จำเป็นในการฟื้นฟู"
 hold_court.1021.a.stewardship:0 "ให้เราจัดตั้งระบบแบ่งปันพืชผลกับหมู่บ้านใกล้เคียง"
 hold_court.1021.b:1 "การรับใช้ของเจ้าจะเป็นการชดใช้หนี้สิน"
 hold_court.1021.c:0 "หากทุ่งนาแห้งแล้ง เจ้าก็จงจับดาบเสีย"
 county_or_15_dev: "[county.GetName] และทุก [county|E] ใน [realm|E] ที่มี [development|E] 15 หรือน้อยกว่า"

 # Activity End
 hold_court.0021.t:0 "$hold_court_header$ บทสรุป"
 hold_court.0021.desc:0 "ขณะที่ผู้ยื่นคำร้องคนสุดท้ายจากไป ข้าราชบริพารต่างๆ ก็ตามพวกเขาออกจากห้องไปเพื่อทำธุระที่อื่น ส่วนคนอื่นๆ ยังคงอยู่ พูดคุยกันเองเกี่ยวกับเรื่องราวที่เพิ่งเกิดขึ้น\n\nไม่นานความเป็นทางการตามพิธีการก็หายไปโดยสิ้นเชิง ถูกแทนที่ด้วยเสียงจอแจและความวุ่นวายของชีวิตในราชสำนักตามปกติ"
 hold_court.0021.a:0 "ธุระของข้าที่นี่เสร็จสิ้นแล้ว"
 hold_court.0021.arrogant:0 "เป็นการดีที่ให้ข้าราชบริพารของข้าได้ชื่นชมบารมีของข้า"
 hold_court.0021.shy:0 "ข้ารอไม่ไหวที่จะกลับไปยังห้องส่วนตัวของข้า..."
 hold_court.0021.gregarious:0 "นี่ดูเหมือนเป็นโอกาสอันดีที่จะได้คลุกคลีกับราชสำนักของข้า"
 hold_court.0021.every_guest_and_courtier:0 "แขกและข้าราชบริพารทุกคน:"
 hold_court_1001_pool_tt: "[rumormonger.GetShortUIName] ออกจาก [court|E] ของท่าน"
