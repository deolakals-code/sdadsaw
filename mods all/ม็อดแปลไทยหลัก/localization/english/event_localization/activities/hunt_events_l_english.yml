 hunt.1337.t: "สิทธิ์ในการล่า"
 hunt.1337.desc: "ข้าไม่มีสิทธิ์ล่าสัตว์ที่นี่ใน [host.GetCurrentLocation.Custom('GetTerrainTypePlural')] ของ [barony_holder.GetTitledFirstNamePossessive] ข้าต้องซื้อสิทธิ์ในการทำ เช่นนั้น เว้น แต่ข้าต้องการถูกมองว่าเป็นคนนอกกฎหมายและผู้ลักลอบล่าสัตว์\n\nแน่นอน แม้ว่าข้าจะได้รับสิทธิ์ ข้าก็ไม่ได้รับอนุญาตให้ล้มสัตว์ทุกตัวที่ข้าต้องการ..."
 hunt.1337.a: "[favor_to_call_in.GetTitledFirstNameNoTooltip] จะต้องอนุญาตให้ข้าล่าอย่างแน่นอน!"
 hunt.1337.b: "ช่างหัว #EMP 'สิทธิ์'#! พวกนี้สิ ข้าจะล่าที่ไหนก็ได้ที่ข้าต้องการ!"
 hunt.1337.c: "ข้าจะซื้อสิทธิ์"
 hunt.1337.d: "บาห์ กลับค่ายกันเถอะ..."
 hunt.1337.e: "โชคดีที่ข้าจ่ายค่าสิทธิ์ไปแล้ว!"
 
 mpo_hunt.0001.t: "บทเรียนแรกแห่งพงไพร"
 mpo_hunt.0001.desc: "เราเคลื่อนพลผ่าน [ROOT.Char.GetCurrentLocation.Custom('GetTerrainType')] เพื่อค้นหาเหยื่อ บุตรของข้า, [child.GetFirstName], ได้แสดงให้เห็นถึงความทรหดกว่าที่ข้าคิดไว้ว่า [child.GetHerHim] จะเป็น โดยถือคันธนูของ [child.GetHerHis] ไว้แน่น\n\n"หยุด" ข้าพึมพำ สังเกตเห็นบางสิ่งเคลื่อนไหวในพงหญ้า [ROOT.Char.Custom('SmallAnimal')] ตัวเล็กกำลังกัดกินรากไม้ โดยมิได้ตระหนักถึงการมาของเรา"
 mpo_hunt.0001.a: "ตัวนี้เป็นของข้า!"
 mpo_hunt.0001.b: "เจ้าทำได้ [child.GetFirstNameNoTooltip]!"
 mpo_hunt.0001.c: "เจ้าจับมันแบบนี้ แล้วก็..."
 mpo_hunt.0001.c.tt.crit_success: "[child.GetFirstNameNoTooltip] ทำให้ทุกคนประทับใจ"
 mpo_hunt.0001.b.tt.success: "[child.GetFirstNameNoTooltip]ได้สัตว์ตัวนั้น"
 mpo_hunt.0001.b.tt.failure: "[child.GetFirstNameNoTooltip]ล้มเหลว"
 mpo_hunt.0001.d: "ปล่อยมันไปเถิด"

 mpo_hunt.0010.t: "จากเบื้องบน"
 mpo_hunt.0010.desc: ""...ข้าเพลิดเพลินกับส่วนนี้ของ[ROOT.Char.GetCurrentLocation.Custom('GetTerrainType')]เสมอ" [target.GetTitledFirstName]กล่าว ขณะที่เราเดินทัพไปด้วยกัน "บิดาของข้าเคยพาพวกเรามาล่าสัตว์ที่นี่"\n\nก่อนที่ข้าจะได้ทันตอบ [ROOT.Char.Custom('GetRegionalEagleType')]ตัวหนึ่งก็โฉบลงมาที่[target.GetHerHim] กรีดร้องราวกับทารกแรกเกิด\n\n"ช่วยด้วย!" [target.GetSheHe]ตะโกน"
 mpo_hunt.0010.a: "ข้ารู้วิธีจัดการกับพวกนี้"
 mpo_hunt.0010.b: "ถึงเวลาข้าแสดงฝีมือแล้ว!"
 mpo_hunt.0010.b.tt.success: "ท่านยิงนกตัวนั้น"
 mpo_hunt.0010.b.tt.failure: "ท่าน ทำให้ตัวเองขายหน้า"
 mpo_hunt.0010.b.tt.crit_failure: "นกทำร้ายท่าน"
 mpo_hunt.0010.c: ""มาอยู่ข้างหลังข้า [target.GetFirstNameNoTooltip]!""
 mpo_hunt.0010.c.tt.success: "[target.GetFirstNameNoTooltip]ประทับใจ"
 mpo_hunt.0010.d: "มันไม่คุ้มค่าหรอก"
 
 mpo_hunt.0020.t: "รักของแม่"
 mpo_hunt.0020.desc.intro: ""เริ่มมืดแล้ว" [companion.GetTitledFirstName] [companion.Custom('quirk_pos_present')] "เราควรหาที่พัก..."\n\nแต่ประโยคของ[companion.GetHerHis]ก็ถูกขัดจังหวะอย่างกะทันหัน:"
 mpo_hunt.0020.desc.zud: "หมาป่าตัวหนึ่งนอนตายอยู่บนหิมะ ลูกของมันกำลังใช้หัวดันท้องที่ไร้ชีวิตของแม่"
 mpo_hunt.0020.desc.normal: "หมาป่าตัวเมียคำรามมาทางเรา ร่างใหญ่ของมันปกป้องลูกน้อยตัวเล็กๆ"
 mpo_hunt.0020.a: "อากาศหนาวคงฆ่าแม่ของมัน..."
 mpo_hunt.0020.b: "เราต้องฆ่าแม่มัน!"
 mpo_hunt.0020.b.tt.success: "ท่านฆ่าหมาป่า"
 mpo_hunt.0020.b.tt.failure: "แม่หมาป่าโจมตีท่าน"
 mpo_hunt.0020.c: "เราแอบย่องผ่านมันไปได้..."
 mpo_hunt.0020.c.tt.success: "ท่านแอบย่องผ่านแม่หมาป่าไปได้"
 mpo_hunt.0020.d: "อย่าหยุด"
 artifact_wolf_pelt_name: "หนังหมาป่า"
 artifact_wolf_pelt_desc: "ได้มาจากแม่หมาป่าที่กำลังจะตาย"
 
 mpo_hunt.0030.t: "ผู้ถูกเนรเทศ"
 mpo_hunt.0030.desc: "เสียงครวญครางเรียกความสนใจของเราขณะที่เราเดินทาง นักรบบาดเจ็บผู้หนึ่งนอนพักอยู่บนโขดหิน เสื้อผ้าของ[warrior.GetHerHis]ขาดวิ่นและกรามของ[warrior.GetHerHis]บวมเป่ง\n\n"คารวะ ท่านผู้เป็นที่น่าเกรงขาม นายเหนือหัวของข้า [other_ruler.GetTitledFirstName] ได้เนรเทศข้าออกจากอาณาจักรของ[other_ruler.GetHerHis] เหล่าศัตรูของข้าได้วางกับดักข้า และบัดนี้ข้าจำต้องร่อนเร่ไปอย่างไร้จุดหมาย""
 mpo_hunt.0030.a: ""มันต้องมีเหตุผลสิ""
 mpo_hunt.0030.b: ""นักรบผู้มีความสามารถย่อมเป็นที่ต้องการเสมอ!""
 mpo_hunt.0030.c: ""ความเมตตาของข้าเป็นที่รู้จักกันดี""
 mpo_hunt.0030.d: ""มีเพียงผู้แข็งแกร่งเท่านั้นที่จะอยู่รอด""
 
 mpo_hunt.0040.t: "อาชาผอมเพรียวดุจกวาง"
 mpo_hunt.0040.desc: "ใน[root_location.GetTerrain.GetNameNoTooltip|l]อันแสนทารุณแห่ง[root_location.GetName] การไล่ล่าช่างยาวนาน เราควบม้าต่อไป ทิ้งเหล่าพลขี่ม้าที่ด้อยกว่าและม้าที่อ่อนแอกว่าไว้เบื้องหลัง... แต่บัดนี้ แม้ แต่ม้าตอนที่แข็งแกร่งก็เริ่มผ่ายผอมลง\n\nอาชาอันสูงศักดิ์ของเราสามารถพาเราผ่านการล่านี้ไปได้ แต่หากยังคงรักษาระดับความเร็วนี้ไว้ เหล่าม้าจะกลับบ้านด้วยสภาพผอมโซและไม่พร้อมรบ"
 mpo_hunt.0040.a: "เหยื่อที่ถูกย่องตามอย่างช้าๆ จะไม่หนีเตลิดไป เช่นนั้น"
 mpo_hunt.0040.b: "ด้วยของเล็กๆ น้อยๆ ชาวบ้านคงจะยอมแบ่งม้าสดๆ ให้บ้าง"
 mpo_hunt.0040.c: "ปล่อยให้ม้าอดตายไป! เราต้องไม่ล้มเหลว"
 mpo_hunt.0040.d: "ลดความเร็วลง"

 mpo_hunt.0050.t: "นักล่าแห่ง[root_location.GetNameNoTooltip]"
 mpo_hunt.0050.desc: "ขณะที่เราควบม้าตามรอยนักแกะรอยของเรา กลุ่มพลขี่ม้าที่ไม่คุ้นหน้าก็เข้ามาใกล้ พวกเขาเป็นคนท้องถิ่น บนหลังม้าที่ชุ่มเหงื่อของพวกเขามีหนังสัตว์ดิบวางพาดอยู่\n\n"[hunter.GetFaith.FertilityGodName]ประทานชีวิตแก่[root_location.GetTerrain.GetNameNoTooltip|l]" ผู้นำของพวกเขากล่าว [hunter.GetName] "เราได้เหยื่อของเราแล้ว แต่หากท่านสนใจจะตกลง — เราอาจช่วยท่านในการไล่ล่าด้วยก็ได้?""
 mpo_hunt.0050.a: "นักล่าผู้นี้สมควรอยู่กับ[ROOT.Char.GetDomicile.GetCulture.GetCollectiveNounNoTooltip]ของข้า"
 mpo_hunt.0050.b: "ข้าจะแลกม้ากับร่องรอยเหยื่อของข้า"
 mpo_hunt.0050.c: ""เรากำลังล่าสัตว์อยู่ คนแปลกหน้า และเจ้าก็มีหนังสัตว์ดีๆ เสียด้วย!""
 mpo_hunt.0050.c.flavor: "ลูกธนูของท่านพุ่งเข้าใส่นักล่าท้องถิ่น และกลุ่มของพวกเขาก็ยิงตอบโต้กลับมา!"
  mpo_hunt.0050.c.tt.success: "ท่านได้เหยื่อของท่าน"
  mpo_hunt.0050.c.tt.failure: "คนแปลกหน้ายิงแม่นกว่า"
 mpo_hunt.0050.d: ""หากเจ้าอยากมีชีวิตอยู่ นักล่า... จงไปเสีย""
 mpo_lean_horses_hunt_modifier: "ม้าตอนผอมโซ"
 mpo_lean_horses_hunt_modifier_desc: "การล่าสัตว์อย่างหนักและยาวนาน ทำให้ม้าของชนเผ่าเร่ร่อนนี้ผอมลงจำนวนมาก ทำให้พวกมันไม่เหมาะกับการรบ"

 mpo_hunt.0060.t: "ขนในพงหญ้า"
 mpo_hunt.0060.desc: "มีบางสิ่งเคลื่อนไหวอย่างรวดเร็วในพุ่มไม้ แล้วก็อีกสิ่งหนึ่งที่ว่องไว — และอีกตัว! ร่างอ้วนกลมขนสีน้ำตาลเล็กๆ ราวกับก้อนหินที่อ่อนนุ่ม พากันวิ่งหนีหายไปในพงหญ้า\n\nสหายร่วมล่าของข้าอยู่บนหลังม้า เตรียมลูกธนูขึ้นสาย พร้อมยิงทันทีที่ได้รับคำสั่ง — แต่ข้าควรจะออกคำสั่งนั้นหรือไม่? ขนมาร์มอตเป็นสินค้ามีค่าสำหรับการค้า แต่เวลาที่ใช้ในการถลกหนังพวกมันคือเวลาที่เราละเลยการไล่ล่าหลัก..."
 mpo_hunt.0060.a: "ข้ารู้จักพ่อค้าที่จะขายขนพวกนี้ได้#EMPพอดี#!"
 mpo_hunt.0060.b: ""#EMP ยิง! ยิง!#! เพื่อขนสัตว์มากมาย!""
 mpo_hunt.0060.c: ""อย่าไปสนใจพวกมัน! #EMPตามล่าต่อไป!#!""

 


 tgp_hunt.0002.t: "ไม่ต่างกันนัก"
 tgp_hunt.0002.desc: "ขณะที่กำลังไล่ตาม [activity.Custom('GetAnimalType')] ข้าบังเอิญพบแม่น้ำสายเล็ก ๆ ที่นั่น หลังพงกก มิใช่เหยื่อของข้า แต่เป็นเป็ดคู่รักสง่างาม คอของมันพันเกี่ยวกันด้วยความรัก\n\nข้าจ้องมองนกคู่รักอย่างเคลิบเคลิ้ม พลันเหยี่ยวของข้าก็โฉบลงมา! เหลือเป็ดเพียงตัวเดียว มีเลือดและขนนกแทนที่คู่ของมัน นกที่เหลือกรีดร้องด้วยความเจ็บปวดใจสลาย สยายปีกอย่างสิ้นหวังราวกับจะย้อนเวลา"
 tgp_hunt.0002.a: "ช่างเป็นภาพที่น่าอัศจรรย์ใจโดยแท้"
 tgp_hunt.0002.a.flavor: "เอาอีกตัวมาด้วย!"
 tgp_hunt.0002.b: "บางที สัตว์ก็ไม่ต่างจากเรานัก"
 tgp_hunt.0002.b.flavor: "ชีวิตก็เป็น เช่นนี้"
 tgp_hunt.0002.c: "ข้ามิอาจทนเห็นภาพอันน่าเวทนา เช่นนี้ในดินแดนของข้าได้"
 tgp_hunt.0002.c.flavor: "หากจะมีการเปลี่ยนแปลง - การกระทำของข้าจะเป็นตัวเร่ง"
 hunt_invalidated_warning_ban_tt: "@warning_icon! #X ท่านจะไม่สามารถเป็นเจ้าภาพ [GetActivityType( 'activity_hunt' ).GetName] [activity|E] ได้อีก ตลอดช่วงชีวิตของ [host.GetName]"
