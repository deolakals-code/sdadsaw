l_english: 
 hunt.0050.t:0 "เสียงเพรียกแห่งพงไพร"
 hunt.0050.desc:0 "การหลบหลีก, สัตว์อ่อนวัย, โพรงกระต่าย! การล่าสัตว์นั้นมีสิ่งให้เรียนรู้และเพลิดเพลินมากมาย ทั้งความเชี่ยวชาญในธรรมชาติ, มิตรภาพและพิธีกรรม และแน่นอน, ความตื่นเต้นเร้าใจ!\n\nหลายคนก่อนหน้าข้าได้เข้าร่วมกิจกรรมอันสูงศักดิ์ หาก แต่เปื้อนเลือดเหล่านี้ ข้าเริ่มเข้าใจแล้วว่าเหตุใด..."
 hunt.0050.a:0 "ข้ารอคอยครั้งต่อไปแทบไม่ไหวแล้ว!"
 hunt.0050.b:0 "เป็นเพียงเรื่องหยุมหยิมที่เบี่ยงเบนความสนใจ..."
 # Maintenance Events
 hunt.0080.t:1 "การสิ้นสุดก่อนเวลาอันควร"
 hunt.0080.t.inheritor:1 "เหยื่อแห่งพงไพร"
 hunt.0080.imprisoned_self:1 "ด้วยถูกจองจำไว้อย่างปลอดภัยโดย [ROOT.Char.GetImprisonedBy.GetTitledFirstNamePossessive] การล่าสัตว์ของข้าดูเหมือนจะจบสิ้นลงแล้ว..."
 hunt.0080.imprisoned:0 "เมื่อ [host.GetTitledFirstName] ถูกจองจำไว้อย่างปลอดภัยโดย [ROOT.Char.GetImprisonedBy.GetTitledFirstNamePossessive] ดูเหมือนว่าพวกเราจะต้องกลับบ้านมือเปล่า..."
 hunt.0080.wounded_self:0 "เนื่องจากอาการบาดเจ็บของข้า จึงมีการตัดสินใจให้ยกเลิกการล่าสัตว์และคณะจะเดินทางกลับบ้าน"
 hunt.0080.wounded:0 "เนื่องจากอาการบาดเจ็บที่ [invalidated_flavor.GetTitledFirstName] ได้รับ จึงมีการตัดสินใจให้ยกเลิกการล่าสัตว์และคณะจะเดินทางกลับบ้าน"
 hunt.0080.assassination:1 "วันดำเนินไปด้วยดี จนกระทั่ง [invalidated_flavor.GetTitledFirstName] ยืนกรานให้เรายกเลิกการล่าสัตว์ โดยอ้างว่า [invalidated_flavor.GetSheHe] หวาดกลัวต่อชีวิตของ [invalidated_flavor.GetHerHis] หลังจากเผชิญเหตุการณ์เฉียดตาย ข่าวลือเรื่องความพยายามลอบสังหารแพร่สะพัดไปทั่ว"
 hunt.0080.abduction_attempt:1 "ขณะที่คณะเข้าใกล้สัตว์ป่า เสียงกรีดร้องอันแหลมสูงของ [invalidated_flavor.GetWomanMan] ดังแทรกผ่านแม้กระทั่งเสียงเห่าที่ไม่หยุดหย่อนของสุนัข\n\n[invalidated_flavor.GetTitledFirstName] ในสภาพยุ่งเหยิงวิ่งฝ่า [ROOT.Char.GetCurrentLocation.Custom('GetProvinceFoliageDesc')] ออกมาพลางร้องขอความช่วยเหลือ ร้องไห้ว่ามีคนพยายามลักพาตัว [invalidated_flavor.GetHerHim]!\n\n"
 hunt.0080.abduction:0 "การล่าสัตว์ดูเหมือนจะดำเนินไปด้วยดี จนกระทั่งมีคนสังเกตเห็นว่า [invalidated_flavor.GetTitledFirstName] ไม่ได้อยู่กับคณะอีกต่อไป และจากนั้นก็หาตัวไม่พบ\n\nขณะที่เราค้นหาไปทั่ว [ROOT.Char.GetCurrentLocation.Custom('GetTerrainTypePlural')] เราพบร่องรอยการต่อสู้บน [ROOT.Char.GetCurrentLocation.Custom('GetProvinceGroundDesc')]"
 hunt.0080.assassination_culprit:1 "เราเกือบจะถึงตัวเหยื่อแล้วเมื่อ [invalidated_flavor.GetTitledFirstName] ที่ดูน่าสะพรึงกลัวปรากฏตัวขึ้นมาอย่างกะทันหัน — การหายตัวไปของ [invalidated_flavor.GetHerHis] จนถึงบัดนี้ไม่มีใครสังเกตเห็น\n\nระหว่างที่หอบหายใจ [invalidated_flavor.GetSheHe] อ้างว่าหนีรอดจากความพยายามลอบสังหารชีวิตของ [invalidated_flavor.GetHerHis] มาได้อย่างหวุดหวิด! ที่น่าตกใจยิ่งกว่าคือเป้าหมายที่ [invalidated_flavor.GetHerHis] กล่าวหา: [invalidated_culprit.GetTitledFirstName]!\n\n[invalidated_culprit.GetWomanMan] ผู้นั้นหาตัวไม่พบ ดูเหมือนจะหลบหนีไปจากที่เกิดเหตุแล้ว..."
 hunt.0080.abduction_attempt_culprit:0 "\n\n[invalidated_flavor.GetSheHe|U] ทำให้ผู้คนเลิกคิ้วด้วยการชี้ตัวไปที่ [invalidated_culprit.GetTitledFirstName] แต่การหายตัวไปอย่างกะทันหันของ [invalidated_culprit.GetHerHis] ยิ่งเพิ่มน้ำหนักให้กับข้อกล่าวหา..."
 hunt.0080.abduction_culprit:0 "\n\nเมื่อ [invalidated_culprit.GetTitledFirstName] ก็หายตัวไปอย่างน่าประหลาด เช่นกัน ข้อสรุปบางอย่างจึงถูกด่วนตัดสินไปตามธรรมชาติ..."
 hunt.0080.death_inheritor:1 "ข้าเพิ่งได้รับแจ้งว่า [host.GetTitledFirstName] สิ้นชีพแล้ว! ดูเหมือนว่า [host.GetSheHe] [host.GetDeathReason] ขณะล่าสัตว์"
 hunt.0080.death_inheritor_killer:1 "ในที่สุด [host.Custom2('InsultNoun', ROOT.Char)] ที่น่ารังเกียจผู้นั้น [host.GetTitledFirstName] ก็พ้นทางไปเสียที และด้วยน้ำมือของข้าเอง"
 hunt.0080.death:0 "ด้วยการตายอันน่าเศร้าสลดของ [invalidated_flavor.GetTitledFirstName] ผู้ ซึ่ง [invalidated_flavor.GetDeathReasonHideKiller] จึงมีการตัดสินใจให้ยกเลิกการล่าสัตว์และคณะจะเดินทางกลับบ้าน"
 hunt.0080.desc_inheritor:0 "\n\nในฐานะ [ROOT.Char.GetTitleAsNameNoTooltip] คนใหม่แห่ง [ROOT.Char.GetPrimaryTitle.GetNameNoTier] มีหลายสิ่งที่ต้องจัดการภายหลังเหตุการณ์พลิกผันที่ไม่คาดฝันนี้..."
 hunt.0080.desc:0 "\n\nเราคงต้องรอคอยครั้งต่อไป..."
 hunt.0080.a:0 "ช่างเป็นงานอดิเรกที่อันตรายยิ่งนัก"
 hunt.0080.b:0 "ข้าต้องการหัวของสัตว์ร้ายตัวนั้นมาประดับผนัง!"
 hunt.0081.t:1 "การเปลี่ยนแปลงแผน"
 hunt.0081.sick:1 "ในสภาพปัจจุบันของข้า บางทีอาจเป็นการดีที่สุดหากข้ากลับบ้าน กลับไปยังเตาผิงและเตียงอันอบอุ่นของข้า"
 hunt.0081.wounded:1 "ความเจ็บปวด ทำให้ขี่ยาก และการฝืนตัวเองในสภาพนี้ย่อมส่งผลร้ายแน่นอน"
 hunt.0081.host:0 "\n\nข้าไม่อยาก ทำให้ทุกคนผิดหวัง แต่คนเราต้องดูแลสุขภาพของตนเอง..."
 hunt.0081.guest:0 "\n\nคงน่าเสียดายหากพลาดการล่าสัตว์ที่เหลือของ [host.GetTitledFirstNamePossessive] แต่มันคุ้มค่ากับความเสี่ยงหรือไม่?"
 hunt.0081.a:0 "ข้าคิดว่าข้าพอแล้ว"
 hunt.0081.b:0 "ข้าจะไม่เป็นไร..."
 hunt.0082.t:0 "ถูกตัดบท"
 hunt.0082.a:0 "น่าสะพรึงกลัว!"
 hunt_wounded_guest_leaves_toast:0 "แขกผู้บาดเจ็บ"
 # Invitation Events
 hunt.0100.opening_desc:0 "ข้าขอเชิญท่านเข้าร่วมการล่าสัตว์ครั้งใหญ่ใน [barony.GetNameNoTier]!"
 hunt.0101.desc:0 "ข้าขอเชิญท่านเข้าร่วมการล่าสัตว์ใน [barony.GetNameNoTier]! มันจะเป็นงานที่ยิ่งใหญ่ คู่ควรแก่การมาเยือนอันทรงเกียรติของท่าน"
 hunt.0102.desc:0 "ข้าขอเชิญท่านเข้าร่วมการล่าสัตว์ใน [barony.GetNameNoTier]! มันจะเป็นงานที่ยิ่งใหญ่ พร้อมด้วยกีฬาชั้นยอดและมิตรสหาย"
 hunt.0110.t:0 "ผู้เข้าร่วมน้อยกว่าที่คาด"
 hunt.0110.desc:0 "ข้าไม่อยากจะเชื่อเลย แม้ว่าข้าจะส่งคำเชิญและเตรียมการแล้ว แต่ไม่มีแขกแม้ แต่คนเดียวมาปรากฏตัวในการล่าสัตว์ของข้า\n\nไม่เป็นไร! ข้าจะเพลิดเพลินกับกีฬาด้วยตัวเอง เกียรติยศทั้งหมดจะได้เป็นของข้า แต่เพียงผู้เดียว!"
 hunt.0120.desc:0 "เหตุใดท่านจึงตอบรับคำเชิญของข้าเพียงเพื่อไปเข้าร่วมการล่าสัตว์ของ [other_host.GetTitledFirstNamePossessive] แทน ข้าไม่ทราบ แต่จงรู้ไว้ว่าข้าจะจดจำเรื่องนี้"
 # Start Events
 hunt.0500.t.sighting:2 "การสะกดรอย [activity.Custom('GetAnimalType')|U]"
 hunt.0500.t.boar:1 "หมูป่าทรงพลัง"
 hunt.0500.t.hart:1 "สัตว์ป่าสูงศักดิ์"
 hunt.0500.t.large:1 "โอกาสดี"
 hunt.0500.t.small:1 "หาได้ยาก"
 hunt_start_tt:1 "[host.GetShortUIName|U] จะแสวงหา #V [activity.Custom('GetAnimalType')]#!"
 hunt_opening_master_of_hunt:0 "[hunt_participant.GetTitledFirstName] [ROOT.Char.Custom('GetHuntMasterDesc')] ของ [host.GetShortUINamePossessiveNoFormat] เรียกคณะให้มารวมตัวกันเมื่อแสงแรกมาถึง"
 hunt_opening_hunt_leader:1 "[hunt_participant.GetTitledFirstName] รวบรวมคณะเมื่อดวงอาทิตย์ขึ้นเหนือ"
 hunt_opening:0 "คณะถูกเรียกให้มารวมตัวกันเมื่อรุ่งอรุณมาถึงเหนือ"
 hunt_opening_rural:1 "ค่ายพักใน [host.GetCurrentLocation.Custom('GetTerrainTypePlural')] ใกล้ [host.GetCurrentLocation.GetNameNoTooltip]"
 hunt_opening_hunting_grounds:1 "พื้นที่ล่าสัตว์ที่ตั้งอยู่ใน [activity.GetCurrentPhase.GetLocation.GetTitle.GetBaseNameNoTierPossessiveNoTooltip] [host.GetCurrentLocation.Custom('GetTerrainTypePlural')]"
 hunt_opening_royal_reserves:1 "เขตป่าสงวนหลวงท่ามกลาง [activity.GetCurrentPhase.GetLocation.GetTitle.GetBaseNameNoTierPossessiveNoTooltip] [host.GetCurrentLocation.Custom('GetTerrainTypePlural')]"
 hunt_opening_entourage_few:1 "หลังจากรวบรวมข้อมูลจากผู้ดูแลป่าล่าสัตว์ในท้องถิ่นเพียงไม่กี่คน ก็มีการพูดคุยกันบ้างเกี่ยวกับร่องรอยและกลิ่นสาบในบริเวณใกล้เคียง"
 hunt_opening_entourage_normal:1 "ผู้ดูแลป่าล่าสัตว์ในท้องถิ่นได้สำรวจบริเวณใกล้เคียงเพื่อหาร่องรอยและกลิ่นสาบล่าสุด"
 hunt_opening_entourage_many:1 "ผู้ดูแลป่าล่าสัตว์และคนไล่สัตว์จำนวนมากของข้าได้ตรวจสอบพื้นที่อย่างละเอียดเพื่อหาร่องรอยและกลิ่นสาบ"
 hunt.0500.boar:0 "มีหมูป่าตัวเขื่องป้วนเปี้ยนอยู่ในละแวกนี้อย่างแน่นอน — อันตรายยิ่ง ทว่าเป็นเหยื่อที่คู่ควร"
 hunt.0500.hart:0 "ดูเหมือนว่าจะมีกวางฮาร์ทร่างยักษ์อยู่ในบริเวณนี้ - เป็นเหยื่อที่คู่ควรยิ่งนัก!"
 hunt.0500.roe:1 "เห็นได้ชัดว่ามีกวาง [activity.Custom('GetAnimalType')] ตัวผู้ขนาดเล็กอยู่ใกล้ๆ แต่ไม่มีร่องรอยของสัตว์ป่าขนาดใหญ่กว่าเมื่อเร็วๆ นี้"
 hunt.0500.buck:0 "มีกวางตัวผู้กำยำอยู่ในบริเวณนี้อย่างแน่นอน และสภาพแวดล้อมก็เหมาะอย่างยิ่งสำหรับการล่ามัน!"
 hunt.0500.bison:1 "ฝูง [activity.Custom('GetAnimalType')] อยู่ใกล้แค่เอื้อม และมีตัวผู้ทรงพลังอยู่ท่ามกลางพวกมันด้วย!"
 hunt.0500.no_bison:1 "ข้าได้รับแจ้งว่าไม่มีสัญญาณของกวางตัวผู้หรือฝูงไบซันในบริเวณใกล้เคียง แม้ว่าพื้นที่ #EMP จะ#! เหมาะสมสำหรับการล่า [activity.Custom('GetAnimalType')]"
 hunt.0500.no_deer:1 "แม้ว่าน่าเศร้าที่จะไม่มีสัญญาณของกวางตัวผู้ในบริเวณนี้ แต่เห็นได้ชัดว่ามี [activity.Custom('GetAnimalPlural')] อยู่มากมาย"
 hunt.0500.desc_prestigious:0 "\n\n[hunt_participant.GetFirstNameNoTooltip] ยิ้มกว้าง "เรามีการล่าสัตว์ที่ยอดเยี่ยมรออยู่ข้างหน้า!""
 hunt.0500.desc_large:0 "\n\n[hunt_participant.GetFirstNameNoTooltip] ยิ้มกว้าง "นี่น่าจะสนุกดี!""
 hunt.0500.desc_small:1 "\n\n[hunt_participant.GetFirstNameNoTooltip] ยักไหล่ "ไม่เป็นไร [activity.Custom('GetAnimalType')] ที่ [activity.Custom('GetAnimalAdjective')] ก็ยังให้ความสนุกสนานในการล่าได้ดีเยี่ยม!""
 hunt_opening_sighting:1 "\n\nมาดูกันว่าข่าวลือเป็นจริงหรือไม่..."
 hunt.0500.guest:1 "\n\nท้ายที่สุด [host.GetTitledFirstName] ตัดสินใจว่า [host.GetSheHe] ต้องการล่า [activity.Custom('GetAnimalType')] ในวันนี้"
 hunt.0500.a:0 "ออกไปลุยกันเถอะ!"
 hunt.0500.b:0 "ข้าอยากจะไล่สุนัขจิ้งจอกมากกว่า"
 hunt.0500.c:0 "เราจะต้อนกระต่ายป่าเจ้าเล่ห์แทน"
 hunt.0500.d:2 "ข้ามาเพื่อล่า [host.Custom('GetRegionalDeerType')]!"
 hunt.0500.f:0 "ข้าต้องการล่าบางสิ่งที่เปี่ยมพลัง!"

 hunt.0510.t:0 "[activity.Custom('GetAnimalType')|U] [activity.Custom('GetLegendaryColor')|U] ในตำนาน"
 hunt.0510.desc:0 "\n\nพวกเขาไม่พบอะไรเลย แต่ข้ารู้สึกได้: สัตว์ที่ยากจะพบเจอตัวนั้นอยู่ข้างนอกนั่น ที่ไหนสักแห่งใกล้ๆ นี้... "
 hunt.0510.a:0 "สัตว์ร้ายตัวนั้นจะเป็นของข้า!"

 hunt.0520.t.sighting:0 "[activity.Custom('GetAnimalType')|U] ที่สร้างปัญหา"
 hunt.0520.t.tiger:0 "เฟลิส ฮอร์ริบิลิส (เสือร้าย)"
 hunt.0520.t.lion:0 "สิงโตขนทอง"
 hunt.0520.t.leopard:0 "เหยื่อลายจุด"
 hunt.0520.t.lynx:0 "เหยื่อสง่างาม"
 hunt.0520.t.bear:0 "หาทิศทางหมี"
 hunt.0520.t.hyena:0 "ใครหัวเราะทีหลัง?"
 hunt.0520.t.wolf:0 "ฝูงสัตว์รบกวน"
 hunt.0520.b:0 "นำ [ROOT.Char.Custom('GetAnimalTypeCaptive')] ของข้าออกมา! เราจะล่า!"
 hunt.0520.c:0 "แน่นอนว่าต้องมี [ROOT.Char.Custom('GetRegionalWolfPlural')] อยู่แถวนี้บ้าง"

 hunt.0530.t.sighting:0 "การไล่ล่า [activity.Custom('GetAnimalPlural')|U]"
 hunt.0530.t.rare:0 "นกหายาก"
 hunt.0530.t.common:0 "ล่าสัตว์ปีก"
 hunt.0530.b:0 "ข้าคิดว่า [activity.Custom('GetAnimalTypeWaterfowl')] ก็เพียงพอแล้ว"
 hunt.0530.c:0 "มี [activity.Custom('GetAnimalTypeGamebird')] ให้จับเสมอ"
 hunt.0530.d:0 "ข้าอยากเห็น [activity.Custom('GetRaptorType')] ของข้าจับกระต่ายป่า"

 hunt_opening_falconry_sighting:0 "\n\nหวังว่ารายงานนั้นจะเชื่อถือได้"
 hunt_opening_falconry:1 "หากโชคดี เราจะพบ [activity.Custom('GetAnimalGroup')] ของ [activity.Custom('GetAnimalPlural')] และ [activity.Custom('GetRaptorPlural')] ของเราจะได้สนุกกับการล่าอย่างเต็มที่"
 hunt_opening_entourage_few_falconry:0 "\n\nคนตีพุ่มไม้ไม่กี่คนที่เรานำมาพร้อมกับสุนัขของพวกเขา และได้พบเส้นทางที่เหมาะสมแล้ว"
 hunt_opening_entourage_normal_falconry:0 "\n\nทีมคนตีพุ่มไม้พร้อมกับสุนัขล่าเนื้อของพวกเขา และได้เลือกจุดที่เหมาะสมแล้ว"
 hunt_opening_entourage_many_falconry:0 "\n\nคนตีพุ่มไม้ของข้าไม่น่าจะมีปัญหาในการไล่นกออกจากที่ซ่อน และได้สังเกตเห็นจุดสองสามแห่งที่น่าจะให้ผลดี"
 
 hunt_opening_standard_sighting:1 "\n\nคนของข้าได้รวบรวมการพบเห็น [activity.Custom('GetAnimalType')] ที่ท่องไปในพื้นที่ท้องถิ่น"
 hunt_opening_dangerous_sighting:0 "\n\nคนของข้าได้รวบรวมการพบเห็น [activity.Custom('GetAnimalType')] ที่กำลังสร้างความหวาดกลัวในพื้นที่ท้องถิ่น"
 hunt_opening_dangerous:0 "\n\nบังเอิญว่ามี [activity.Custom('GetAnimalType')] อุกอาจตัวหนึ่งกำลังสร้างความหวาดกลัวในพื้นที่ท้องถิ่นเมื่อเร็วๆ นี้"

 hunt.0520.cat:0 "สัตว์ร้ายตัวนี้ได้คร่าชีวิตชาวบ้านไปหลายคนแล้ว และยิ่งอุกอาจมากขึ้นทุกวันที่ปล่อยให้มันท่องไปอย่างอิสระ"
 hunt.0520.bear:0 "มันย่องไปใน [ROOT.Char.GetCurrentLocation.Custom('GetTerrainTreePlural')] ฉกฉวยปศุสัตว์จากหมู่บ้านใกล้เคียงและสร้างความหวาดกลัวให้กับคนหาของป่า"
 hunt.0520.wolf:0 "[activity.Custom('GetAnimalGroup')] เป็นตัวก่อความรำคาญ คุ้ยหาของกินจากฟาร์มและล่าถอยลึกเข้าไปใน [ROOT.Char.GetCurrentLocation.Custom('GetTerrainTreePlural')]"

 hunt_opening_entourage_few_dangerous:0 "อาจเป็นเรื่องยากเมื่อมีคนน้อย แต่หากโชคดี เราจะพบสัตว์ร้ายและยุติช่วงเวลาแห่งความหวาดกลัวของมัน"
 hunt_opening_entourage_normal_dangerous:0 "พวกเรา #EMP น่าจะ#! มีจำนวนมากพอที่จะค้นหาและต้อนสัตว์ร้ายเข้ามุมได้โดยไม่มีปัญหามากนัก"
 hunt_opening_entourage_many_dangerous:0 "เรามีสายตาหลายคู่ ไม่ต้องพูดถึงหอก — ช่วงเวลาแห่งความหวาดกลัวของสัตว์ร้ายสิ้นสุดลงในวันนี้!"

 hunt.0520.a:0 "ไม่มีเวลาให้เสียแล้ว"

 hunt_header: "[ROOT.Char.Custom('HuntHeader')]:"
 hunt.1001.t:4 "การต้อน [activity.Custom('GetAnimalType')|U] เข้ามุม"
 hunt.1001.desc_opening_courtier:1 "[ROOT.Char.Custom2('RelationToMeShort', hunt_participant)] ของข้า [hunt_participant.GetTitledFirstName] เป็นคนแรกที่เห็น [activity.Custom('GetAnimalFeature')] ของมัน"
 hunt.1001.desc_opening:1 "เมื่อมองข้ามทิวทัศน์ไป ข้าก็ชะงักมองซ้ำ นั่นไง มันอยู่ตรงนั้น ทั้ง [activity.Custom('GetAnimalFeature')] และทุกอย่าง!"
 hunt.1001.desc_opening_courtier_plural:1 "[ROOT.Char.Custom2('RelationToMeShort', hunt_participant)] ของข้า [hunt_participant.GetTitledFirstName] เป็นคนแรกที่เห็น [activity.Custom('GetAnimalGroup')]"
 hunt.1001.desc_opening_plural:1 "เมื่อมองข้ามทิวทัศน์ไป ข้าก็ชะงักมองซ้ำ นั่นไง [activity.Custom('GetAnimalGroup')]!"
 hunt.1001.bison:1 "\n\nจัดวางตำแหน่งคณะอย่างระมัดระวัง เราบุกเข้าใส่ฝูงสัตว์ที่ [activity.Custom('GetAnimalSoundParticiple')] แยก [activity.Custom('GetAnimalMale')] ที่คู่ควรออกมาจากกลุ่มที่ตื่นตระหนก\n\n"
 hunt.1001.desc:2 "\n\n[activity.Custom('GetAnimalMale')] ที่ [activity.Custom('GetAnimalAdjective')] นั้นยากที่จะแยกแยะ แต่ไม่ต้องสงสัยเลยว่ามันอยู่ที่นั่น สังเกตการณ์พวกเราผ่าน [host.GetCurrentLocation.Custom('GetProvinceFoliageDesc')]\n\n"
 hunt.1001.closing_chase:0 "[host.GetTitledFirstName] วิ่งตามสัตว์ร้ายไป ร้องว่า: "มาเร็ว มันกำลังหนีไป!""
 hunt.1001.closing_ambush:0 "[host.GetTitledFirstName] คิดอยู่ครู่หนึ่ง ก่อนจะชี้ไปทางซ้าย "มาเร็ว เราจะตัดหน้ามัน!""
 hunt.1001.closing_herd:1 "เรารวมตัวกันระหว่าง [activity.Custom('GetAnimalType')] ที่โดดเดี่ยวกับ [activity.Custom('GetAnimalGroup')] ที่กำลังหนี ตอนนี้การไล่ล่าที่แท้จริงได้เริ่มขึ้นแล้ว!"
 hunt.1001.closing:1 "มันสบตากับข้าและ — ราวกับว่าสัตว์ตัวนั้นสัมผัสได้ถึงเจตนาของข้า — ก็วิ่งหนีไปในพริบตาด้วยขนสี [activity.Custom('GetAnimalColor')]!"
 hunt.1001.desc_opening_courtier_dangerous:0 "[ROOT.Char.Custom2('RelationToMeShort', hunt_participant)] ของข้า [hunt_participant.GetTitledFirstName] พบเห็น [activity.Custom('GetAnimalType')] กำลังเฝ้ามองพวกเราจากระยะไกล ร่างกายของมันเกร็ง — พร้อมที่จะวิ่งหนี"
 hunt.1001.desc_opening_dangerous:0 "ขณะสำรวจ [host.GetCurrentLocation.Custom('GetTerrainType')] ข้าก็เห็นมันในทันใด ราวกับว่ามันอยู่ที่นั่นมาตลอด: [activity.Custom('GetAnimalType')]!"
 hunt.1001.desc_opening_courtier_plural_dangerous:0 "[ROOT.Char.Custom2('RelationToMeShort', hunt_participant)] ของข้า [hunt_participant.GetTitledFirstName] ส่งสัญญาณข้าม [host.GetCurrentLocation.Custom('GetTerrainType')] — ทั้ง [activity.Custom('GetAnimalGroup')] ของ [activity.Custom('GetAnimalType')] หมอบอยู่ในแอ่งไม่ไกลนัก"
 hunt.1001.desc_opening_plural_dangerous:0 "ขณะสำรวจ [host.GetCurrentLocation.Custom('GetTerrainType')] ข้าก็เห็นพวกมันในทันใด ราวกับว่าพวกมันอยู่ที่นั่นมาตลอด: [activity.Custom('GetAnimalGroup')]!"
 hunt.1001.wolf:0 "\n\nฝูงสัตว์ร้ายวิ่งพรวดขึ้นมาเมื่อเราเข้าใกล้ [activity.Custom('GetAnimalSoundParticiple')] เตือนภัยขณะที่พวกมันล่าถอยเข้าไปใน [host.GetCurrentLocation.Custom('GetProvinceFoliageDesc')] [activity.Custom('GetAnimalDanger')] คำรามขู่\n\n"
 hunt.1001.desc_dangerous:0 "\n\nสัตว์ร้ายที่ [activity.Custom('GetAnimalAdjective')] เป็นภาพที่น่าจับตามอง ม้าเริ่มตื่นตกใจเมื่อ แต่ละตัวเห็น [activity.Custom('GetAnimalFeature')] ของมันท่ามกลาง [host.GetCurrentLocation.Custom('GetProvinceFoliageDesc')]\n\n"
 hunt.1001.closing_plural_dangerous:0 "เราไล่ตามสัตว์ร้ายสี [activity.Custom('GetAnimalColor')] ที่กำลังหนี โดยมุ่งเน้นไปที่ตัวที่ใหญ่ที่สุดในกลุ่ม ตอนนี้การไล่ล่าที่แท้จริงได้เริ่มขึ้นแล้ว!"
 hunt.1001.closing_dangerous:0 "โดยไม่มีการเตือน มัน [activity.Custom('GetAnimalChargePresent')] หนีไปในพริบตาด้วยขนสี [activity.Custom('GetAnimalColor')] หายลับไปหลังเนิน!"
 hunt.1001.a:1 "ตามมันไป! เราขี่ม้า!"
 hunt.1001.a.flavor_1:0 "#EMP เสียงโห่ร้องบอกสัญญาณ!#!"
 hunt.1001.a.flavor_2:0 "#EMP เสียงกระตุ้นสุนัข!#!"
 hunt.1001.a.flavor_3:0 "#EMP เสียงโห่ร้อง!#!"
 hunt.1001.a.flavor_4:0 "#EMP ไปให้พ้น!#!"
 hunt.1001.a.tt:0 "อุบัติเหตุมีแนวโน้มที่จะเกิดขึ้นมากขึ้น"
 hunt.1001.b:1 "ระวัง! ระวัง [host.GetCurrentLocation.Custom('GetRandomRegionalDanger')]!"
 hunt.1001.b.flavor:0 "#EMP ปลอดภัยไว้ก่อน!#!"
 hunt.1001.c:1 "ทางนี้ เราดักหน้ามัน!"
 hunt.1001.c.flavor:1 "#EMP เหล่าพราน จงนำมันมายังแนวธนูของเรา!#!"
 hunt.1001.d:0 "ไปกันเถอะ!"

 hunt.1002.desc:2 "โลกของข้าแคบลงเหลือเพียงธรรมชาติรอบตัวขณะที่เราตามสุนัขข้ามพื้นดินขรุขระตามกลิ่นของ [activity.Custom('GetAnimalType')] ที่กำลังหนี\n\n"
 hunt.1002.courtier:0 "ขี่ม้าเคียงข้าง [hunt_participant.GetTitledFirstName] สิ่งที่ข้าได้ยินทั้งหมดคือเสียงกีบม้าดังกึกก้อง เสียงสุนัขเห่า เสียงคนตะโกน...\n\nความตื่นเต้นไหลผ่านตัวข้าขณะที่เราค่อยๆ ตามทันเหยื่อของเรา!"
 hunt.1002.alone:0 "มุ่งหน้าไปตามเส้นทาง สิ่งที่ข้าได้ยินทั้งหมดคือเสียงกีบม้าดังกึกก้อง เสียงสุนัขเห่า เสียงคนตะโกน...\n\nความตื่นเต้นไหลผ่านตัวข้าขณะที่เราค่อยๆ ตามทันเหยื่อของเรา!"
 hunt.1002.a:1 "มาเร็ว [hunt_participant.GetFirstNameNoTooltip] เร็วขึ้นอีก!"
 hunt.1002.a.alone:0 "ใกล้เข้ามาแล้ว ข้าเกือบจะได้ตัวเจ้าแล้ว!"

 hunt.1003.desc:1 "หลังจากขี่ม้ามาหลายชั่วโมง ในที่สุดเราก็กำลังต้อนสัตว์เจ้าเล่ห์เข้ามุม — การไล่ล่าของเราไม่สูญเปล่า!\n\n"
 hunt.1003.bay:1 "สัตว์ที่หมดแรงและตื่นตระหนกได้หันมาจนมุม พยายามดิ้นรนที่จะยืนและ [activity.Custom('GetAnimalSoundParticiple')] ด้วยความตื่นตระหนก"
 hunt.1003.dogs:1 "[activity.Custom('GetAnimalMale')] ที่เหนื่อยล้าหมดแรงแล้ว: ถูกสุนัขล่าเนื้อกัดแล้ว มันหมอบลงด้วยความหวาดกลัวขณะที่สุนัขเข้ามาใกล้ ถูกควบคุมโดยเหล่าผู้ดูแลสุนัข"
 hunt.1003.dangerous:0 "ไม่ว่าจะเหนื่อยหรือท้าทาย ในที่สุด [activity.Custom('GetAnimalType')] ก็หยุด หันมาทางพวกเรา และส่งเสียง [activity.Custom('GetAnimalSound')] ดังสนั่น"
 hunt.1003.injured:1 "\n\n[wounded_courtier.GetTitledFirstName] จะต้องโกรธจัดแน่ที่ [wounded_courtier.GetSheHe] พลาดสิ่งนี้!"
 hunt.1003.bison:1 "\n\nการเผชิญหน้ากับ [activity.Custom('GetAnimalType')] ทรงพลังในระยะใกล้ เช่นนี้ โดยเฉพาะตัวที่กำลัง [activity.Custom('GetAnimalStrikeParticiple')] อย่างรุนแรง ก็เพียงพอที่จะ ทำให้แม้ แต่ [ROOT.Char.GetWomanMan] ที่กล้าหาญที่สุดหวาดกลัว แต่สุนัขและนักล่าก็ล้อมรอบมันไว้ตามหน้าที่"
 hunt.1003.boar:1 "\n\n[activity.Custom('GetAnimalType')] ที่หยิ่งผยองร้องเสียงหลง เขี้ยวแหลมคมพร้อมที่จะผ่าทุกคนที่เข้าใกล้เป็นสองซีก ขณะที่มันถูกล้อมรอบด้วยสุนัขล่าเนื้อและนายพรานที่ดูประหม่า"
 hunt.1003.hart:1 "\n\n[activity.Custom('GetAnimalType')] อันยิ่งใหญ่ กิ่งเขาที่ชี้ชัน ยังคงมีแรงต่อสู้ [activity.Custom('GetAnimalSoundParticiple')] ขณะที่สุนัขและหอกล้อมรอบมัน"
 hunt.1003.deer:1 "\n\nอากาศดังก้องไปด้วยเสียงเป่าแตรเขาสัตว์ เสียงสุนัขเห่า และเสียงร้องของคณะขณะที่วงล้อมปิดล้อมรอบ [activity.Custom('GetAnimalMale')] ที่ดื้อรั้น"
 hunt.1003.fox:1 "\n\n[activity.Custom('GetAnimalType')] ที่หวาดกลัวกำลังตระหนักว่าไม่สามารถหลบหนีได้ ขณะที่สุนัขล่าเนื้อและนายพรานจัดเรียงรายล้อมมัน"
 hunt.1003.hare:1 "\n\nมัน ทำให้เรา โดยเฉพาะอย่างยิ่งสุนัข ได้ไล่ล่าอย่างสนุกสนาน วิ่งซิกแซก ใช้เล่ห์เหลี่ยม และซ่อนตัวอยู่ระหว่างทุกหลุมบ่อและพุ่มไม้เตี้ยของ [host.GetCurrentLocation.Custom('GetTerrainType')] — แต่ในที่สุดเราก็จับมันได้!"
 hunt.1003.claws:1 "\n\nเหล่านายพรานล้อมรอบมันอย่างประหม่าด้วยหอกของพวกเขาขณะที่มันตวัดกรงเล็บอันตราย"
 hunt.1003.fangs:0 "\n\nเหล่านายพรานรีบล้อมรอบสัตว์ที่กำลังคำราม ซึ่งจ้องเขม็งมาที่ข้า เขี้ยวที่แยกออกมีฟองฟอดและน้ำลายหยด"
 hunt.1003.a:1 "ข้าจะยิงมัน"
 hunt.1003.a.small:0 "รอก่อน! ข้าต้องการฝึกเล็งเป้า"
 hunt.1003.a.flavor:0 "$hunt.1012.a.tt$"
 hunt.1003.b:2 "ข้าจะล้มมันด้วยตัวเอง!"
 hunt.1003.b.small:1 "ข้าจะจัดการมันเอง"
 hunt.1003.b.flavor:0 "#EMP รับนี่ไป ไอ้สัตว์ร้าย!#!"
 hunt.1003.c:0 "[hunt_participant.GetFirstNameNoTooltip] การยิงเป็นของท่าน"
 hunt.1003.d:0 "[ROOT.Char.Custom2('RelationToMeShort', hunt_participant)|U] ให้เราได้เห็นท่านสังหารมัน!"
 hunt.1003.d.good:0 "ข้าให้เกียรติแก่ [intentee.GetFirstNameNoTooltip]"
 hunt.1003.d.bad:0 "[intentee.GetFirstNameNoTooltip]! มันเป็นของเจ้าทั้งหมด!"
 hunt.1003.d.small:0 "ระวังตัวนี้ให้ดี [ROOT.Char.Custom2('RelationToMe', hunt_participant)]!"
 hunt.1003.e:0 "เตรียมหอก! บุก!"
 hunt.1003.e.flavor:1 "#EMP สองคนทางซ้าย สองคนทางขวา!#!"
 hunt.1003.f:1 "ปล่อยสุนัข!"
 hunt.1003.f.flavor:0 "#EMP พวกมันสมควรได้รับมัน!#!"
 hunt.1003.f.success:0 "สุนัขล้มมันลงได้"
 hunt.1003.f.killed:0 "... แต่ก็ถูกทำร้ายสาหัส"
 hunt.1003.g:0 "หยุด! ปล่อยสัตว์น่าสงสารตัวนั้นไป"
 hunt.1003.g.flavor:0 "#EMP เราล่ามันแล้ว ไม่จำเป็นต้องทำให้เลือดมันตกยางออก...#!"
 hunt.1003.h:0 "บุกไป เหล่าพราน ฆ่ามัน!"
 hunt.1003.h.flavor:0 "#EMP ข้าจะ... ทำให้แน่ใจว่ามันจะไม่ผ่านพวกเจ้าไป...#!"
 hunt.1003.i:1 "เร็วเข้า [murder_target.GetFirstNameNoTooltip] มากับข้า ก่อนที่มันจะหนีไป!"
 hunt.1003.i.flavor:0 "#EMP คงจะน่าเสียดายหากหอกของข้าพลาดพลั้งไป...#!"
 hunt.1003.j:0 "ข้าต้องการมัน #EMP ทั้งเป็น#!!"

 hunt.1004.desc:1 "เราแทบจะตามสัตว์ร้ายบ้านี่ไม่ทันขณะที่มันวิ่งซิกแซกหลบหลีกไปมาผ่าน [host.GetCurrentLocation.Custom('GetProvinceFoliageDesc')] [activity.Custom('GetAnimalSoundParticiple')] อย่างบ้าคลั่ง\n\nเมื่อปีนขึ้นเนินและหายลับเข้าไปในพงไม้ทึบ [activity.Custom('GetAnimalType')] ก็หายไปเร็วเท่ากับที่มันปรากฏตัว เหลือไว้เพียงสุนัขที่หอบหายใจและม้าที่เหงื่อท่วม"
 hunt.1004.wounded:0 "\n\n"บางทีการรอ [hunt_participant.GetTitledFirstName] อาจไม่ใช่ความคิดที่ฉลาด..."
 hunt.1004.wounded_host:0 "\n\nช่างเป็นโชคชะตาที่เลวร้าย- *อ๊าก*... บางทีข้าควรจะกลับไปที่ค่าย..."
 hunt.1004.a:0 "ไอ้ตัวบ้านั่นหายไปแล้ว!"
 hunt.1004.a.tt:0 "คอยดูเถอะ!"
 hunt.1004.b:1 "[wounded_guest.GetFirstNameNoTooltip] ทำให้เราช้าลง ไอ้คนโง่!"

 hunt.1005.t:1 "หอกสำหรับ [murder_target.GetFirstNameNoTooltip]"
 hunt.1005.opening:1 "เราล้อมรอบ [activity.Custom('GetAnimalType')] ที่ [activity.Custom('GetAnimalSoundParticiple')] หอกชี้ชัน แต่สายตาของข้าจับจ้องไปที่ [ROOT.Char.Custom2('RelationToMe', murder_target)] ของข้า [murder_target.GetFirstName] มองหาโอกาส...\n\n"
 hunt.1005.opportunity:1 "เมื่อ [activity.Custom('GetAnimalMale')] ที่ตื่นตระหนก [activity.Custom('GetAnimalStrikePresent')] อย่างกะทันหัน"
 hunt.1005.desc:1 "ข้าล้มลงบน [ROOT.Char.GetCurrentLocation.Custom('GetProvinceGroundDesc')] อย่างคล่องแคล่ว หอกที่ 'ควบคุมไม่ได้' ของข้าบาดเฉือนขวางลำคอของ [murder_target.GetFirstNamePossessiveNoTooltip] เร็วเกินกว่าจะหลบหลีกได้ — แทบจะมองไม่ทันด้วยซ้ำ\n\nคณะที่ตกตะลึงหยุดนิ่งอยู่กับที่ขณะที่ [hunt_participant.GetFirstNameNoTooltip] กุมบาดแผลของ [hunt_participant.GetHerHis] ด้วยความตกใจ "ช่วยด้วย!" ข้าร้อง "[murder_target.GetFirstNameNoTooltip] บาดเจ็บ!" ก่อนจะก้าวไปขวางระหว่าง [murder_target.GetHerHim] กับ [activity.Custom('GetAnimalType')]\n\nเมื่อเรื่องสงบลง ทุกคนต่างเชื่อว่าเป็นเพียงอุบัติเหตุอันน่าเศร้า..."
 hunt.1005.a:0 "#EMP นี่มัน#! เกิดขึ้นได้อย่างไร...?"
 hunt.1006.desc:2 "ข้าแสร้งทำเป็นเซถลาไปด้านข้างอย่างแนบเนียน เพื่อหลบการโจมตีของมัน แล้วพุ่งหอกเข้าเสียบสีข้างของ [murder_target.GetFirstNamePossessive] ที่กำลังร้องโหยหวนอย่างเต็มแรง!\n\nแม้จะไม่ถึงตายอย่างที่หวังไว้ แต่หากโชคดี บาดแผลนั้นคงสร้างความทรมานได้ไม่น้อย เราจัดการปลิดชีพ[activity.Custom('GetAnimalMale')]ตัวนั้น ขณะที่[murder_target.GetSheHe]ถูกลากตัวออกไป..."
 hunt.1006.a:1 "ไอ้สารเลวโชคดี! เจ้าควรจะตายไปแล้ว!"
 hunt.1006.b:1 "ขออภัย! [participant_to_blame.GetFirstNameNoTooltip] ผลักข้า!"
 hunt.1006.c:0 "คราวหน้าอย่ามาขวางทางข้า ไอ้คนโง่!"
 hunt.1007.desc:2 "ข้าแสร้งทำเป็นเสียหลัก ส่งหอกของข้าลากผ่านสีข้างของ [murder_target.GetHerHis] ขณะที่ [murder_target.GetSheHe] ร้องด้วยความเจ็บปวด\n\nเห็นได้ชัดทันทีว่าข้าเพียงแค่บาด [murder_target.GetHerHim] เล็กน้อย แต่การจ้องมองอย่างตกตะลึงของ [murder_target.GetHerHis] และการเลิกคิ้วของนักล่าคนอื่นๆ เรียกร้องคำตอบหลังจากที่เราสังหาร [activity.Custom('GetAnimalMale')] แล้ว..."
 hunt.1007.a:0 "อุ๊ย! #weak *ยักไหล่*#!"
 hunt.1007.a.success:1 "[murder_target.GetFirstNameNoTooltip] สงสัย"
 hunt.1007.a.failure:1 "[murder_target.GetFirstNameNoTooltip] เชื่อใจท่าน"
 hunt.1007.b:0 "จงถือว่าโชคดีแล้วที่ไม่แย่ไปกว่านี้"
 hunt.1007.c:0 "ให้ตายสิ ให้เจ้าหลบ #EMP นี่#! ให้ได้สิ ไอ้สารเลว!"
 hunt.1007.d:1 "ข้าขอโทษจริงๆ [murder_target.GetFirstNameNoTooltip]!"
 hunt.1007.e:0 "ข้าเดาว่าเจ้าไม่ได้ติดค้างอะไรข้าอีกแล้ว"
 hunt.1008.desc:1 "ข้าพยายามเคลื่อนที่ไปยังตำแหน่งที่สามารถแทงอย่างรวดเร็ว "โดยบังเอิญ" ได้ แต่ [murder_target.GetFirstNameNoTooltip] ไม่ยอมอยู่นิ่งๆ เลย...\n\nก่อนที่ข้าจะรู้ตัว คณะก็ได้ ทำให้ [activity.Custom('GetAnimalMale')] บาดเจ็บสาหัสถึงตายไปแล้ว และ "อุบัติเหตุ" ก็จะดูน่าขันเกินกว่าจะเชื่อได้..."
 hunt.1008.a:0 "ชิ..."

 hunt.1009.desc:3 "ขณะที่ [activity.Custom('GetAnimalType')] หายลับเข้าไปใน [host.GetCurrentLocation.Custom('GetTerrainType')] ข้ารู้ว่าเหยื่อหนีรอดไปได้แล้ว"
 hunt.1009.desc_injured:2 "\n\nเป็นเรื่องน่าเสียใจที่ [hunt_participant.GetTitledFirstName] ต้องบาดเจ็บ เพราะ [activity.Custom('GetAnimalType')] ที่หนีไป แต่ความเสี่ยง เช่นนี้เป็นส่วนหนึ่งของความตื่นเต้น"
 hunt.1009.desc_uninjured:1 "\n\nเราลงจากหลังม้า เพื่อให้ม้าได้พัก และ [hunt_participant.GetTitledFirstName] ก็พยักหน้า [hunt_participant.GetHerHis] ด้วยความเห็นใจ"

 hunt.1011.t:2 "ข้าหลวงผู้หยาบคาย"
 hunt.1011.desc_horse:2 "ทันทีที่ [ROOT.Char.Custom2('RelationToMe', nice_courtier)] ของข้า [nice_courtier.GetTitledFirstName] เริ่มลงจากม้า ขายังคงห้อยอยู่บนอาน [ROOT.Char.Custom2('DescriptorNegative', murder_target)] [ROOT.Char.Custom2('RelationToMe', murder_target)] ของข้า [murder_target.GetTitledFirstName] ก็จงใจชนเข้ากับม้าของ [nice_courtier.GetHerHis] ทำให้ [nice_courtier.GetHerHim] กลิ้งตกลงไปที่พื้น"
 hunt.1011.desc_talk:2 "ขณะที่เราเดินทอดน่องกันเป็นกลุ่ม ข้าได้ยินเสียง [murder_target.GetTitledFirstName] จากด้านหลัง ส่งเสียงเย้ยหยันมาจากบนม้าล่าสัตว์ของ [murder_target.GetHerHis]:\n\n"ดู [nice_courtier.Custom2('InsultNoun', SCOPE.sC('murder_target'))] [nice_courtier.Custom2('InsultAdjective', SCOPE.sC('murder_target'))] นั่นสิ!"\n\n[murder_target.GetSheHe|U] ชี้ไปที่ [ROOT.Char.Custom2('RelationToMe', nice_courtier)] ของข้า [nice_courtier.GetTitledFirstName] ผู้ดูเหมือนจะทนรับคำสบประมาทได้ยากลำบาก"
 hunt.1011.a:1 "เจ้าทำตัวเหมือนเด็ก และจะถูกลงโทษเหมือนเด็ก"
 hunt.1011.b:1 "นี่ไม่ใช่วิธีที่ [murder_target.GetTitleTierName] ควรจะทำ"
 hunt.1011.c:0 "ฮ่า [nice_courtier.GetFirstNameNoTooltip] หน้าแดงก่ำไปหมดแล้ว!"

 hunt.1012.t:1 "ลูกธนูสำหรับ [murder_target.GetFirstNameNoTooltip]"
 hunt.1012.opening:1 "ธนูในมือ ก้าวอย่างเงียบเชียบ สายตาจับจ้องไปที่ [host.GetCurrentLocation.Custom('GetProvinceFoliageDesc')] ขณะที่ข้ารอคอย [activity.Custom('GetAnimalType')]... สูดหายใจลึกๆ และ — นั่น [murder_target.GetTitledFirstName] หรือ?\n\n"
 hunt.1012.desc:2 "[ROOT.Char.Custom2('DescriptorNegative', murder_target)] [ROOT.Char.Custom2('RelationToMe', murder_target)] ของข้าหมอบอยู่ใน [host.GetCurrentLocation.Custom('GetProvinceFoliageDesc')] ข้างหน้าข้า จดจ่ออยู่กับ [activity.Custom('GetAnimalMale')] ที่กำลังเข้ามาใกล้\n\n"
 hunt.1012.accomplice:0 "ข้าเหลือบมองไปที่ [accomplice.GetFirstName] ซึ่งพยักหน้าแทบไม่รู้สึก คิ้วขมวดด้วยความมุ่งมั่น รอสัญญาณจากข้า"
 hunt.1012.alone:1 "ข้าเหลือบมองไปรอบๆ อย่างลับๆ ล่อๆ — นี่อาจเป็นโอกาสที่ดีที่สุดที่ข้าจะได้รับ..."
 hunt.1012.closing:1 "[activity.Custom('GetAnimalMale')] เข้ามาใกล้ มันเกือบจะถึงตัวเราแล้ว..."
 hunt.1012.a:2 "น่าเสียดายจริงๆ ที่ข้ามองไม่เห็น [murder_target.GetHerHim]..."
 hunt.1012.a.accomplice:1 "น่าเสียดายจริงๆ ที่เรามองไม่เห็น [murder_target.GetHerHim]..."
 hunt.1012.a.tt:0 "#EMP แผลงศร!#!"
 hunt.1012.b:1 "ไม่ นี่ไม่ใช่เวลา..."
 hunt.1012.b.flavor:1 "#EMP เวลาของ [murder_target.GetHerHis|U] จะต้องมาถึง...#!"

 hunt.1013.desc:2 ""ข้า #EMP พยายาม#! เข้าไปขัดขวาง แต่ก่อนที่ข้าจะรู้ตัว [activity.Custom('GetAnimalType')] ก็เหยียบย่ำ [murder_target.GetHerHim] ไปแล้ว! อย่างน้อย [murder_target.GetSheHe] ก็ไม่ต้องตายอย่างโดดเดี่ยว..."\n\nโชคดีที่คนอื่นๆ ไม่ได้ซักไซ้เรื่องราวการจากไปอันน่าเศร้าของ [murder_target.GetTitledFirstNamePossessive] ที่ข้าเล่า\n\n"ข้าเพียงหวังว่าข้าจะทำอะไรได้มากกว่านี้...""
 hunt.1013.a:1 "เหลือเชื่อ! การล่านี้จบลงแล้ว!"
 hunt.1013.b:1 "โศกนาฏกรรม แล้ว [activity.Custom('GetAnimalType')] ตัวนั้นอยู่ที่ไหน?"

 hunt.1014.desc:2 "ขณะที่ [murder_target.GetTitledFirstName] เดินโซเซออกมาจาก [host.GetCurrentLocation.Custom('GetProvinceFoliageDesc')] กุมแขนที่เลือดไหลของ [murder_target.GetHerHis] ข้ามองขึ้นมาจากถุงหนังใส่น้ำของข้าและสูดหายใจเฮือกอย่างน่าเชื่อถือ\n\n"#EMP ใคร#! กันที่ยังต้องเรียนรู้อีกว่า #EMP สัตว์ร้ายคือสิ่งที่เราควรจะยิง#!?" [murder_target.GetSheHe] ตะโกนอย่างโกรธเคืองขณะที่ [murder_target.GetSheHe] เข้ามาใกล้"
 hunt.1014.a:1 "ถ้า เช่นนั้นมันก็เป็นการยิงที่สมบูรณ์แบบ มิใช่หรือ?"
 hunt.1014.all_honorable_hunt_participants:3 "ผู้เข้าร่วม [activity.GetShortName] ผู้ทรงเกียรติ:"
 hunt.1014.all_who_dislike_or_are_evil:3 "ผู้เข้าร่วม [activity.GetShortName] ที่ไม่ชอบ [murder_target.GetShortUIName] หรือเพลิดเพลินกับความทุกข์ทรมาน:"
 hunt.1014.b:2 "[participant_to_blame.GetFirstNameNoTooltip] ไม่ได้อยู่ข้างหลังท่านหรือ...?"
 hunt.1014.c:1 "ท่านหมายจะโทษความซุ่มซ่ามของตัวเองให้พวกเราหรือ?"

 hunt.1015.desc:2 ""[ROOT.Char.GetTitledFirstNameNoTooltip]?! อ๊าก! นั่นท่านหรือ [ROOT.Char.Custom('FormOfAddressForLiege')]?"\n\n[murder_target.GetTitledFirstName] เหลือบมองตาโตสลับระหว่างคันธนูในมือข้ากับลูกธนูที่ปักอยู่บนแขนของ [murder_target.GetHerHis]\n\n"ท่านคิดอะไรอยู่กันแน่!""
 hunt.1015.a:2 "โอ้ คุณพระช่วย! ไปดูแขนนั้นกันเถอะ!"
 hunt.1015.b:2 "ท่านควรจะ #EMP ลืม#! เรื่องทั้งหมดนี้ไปเสีย"
 hunt.1015.c:0 "ข้าไม่เคยพลาดซ้ำสอง"
 hunt.1015.d:1 "นี่เป็น... อุบัติเหตุที่โชคร้าย"
 hunt.1015.e:2 "ข้ามีวิธี ทำให้ [murder_target.GetHerHim] ลืม"

 hunt.1016.desc:2 ""[ROOT.Char.GetTitledFirstNameNoTooltip] นั่น #EMP ท่าน#! รึ?!"\n\n[murder_target.GetTitledFirstName] มองจากคันธนูของข้าไปยังลูกธนูที่ปักอยู่บนพื้นตรงเท้าของ [murder_target.GetHerHis] แล้วมองกลับมาอีกครั้ง\n\n"ฮ่า! ยังคงเล็งไม่แม่นเหมือนเคยสินะ [ROOT.Char.Custom('FormOfAddressForLiege')]?""
 hunt.1016.a:1 "คอยดูเถอะ [murder_target.GetFirstNameNoTooltip]..."

 hunt.1021.t:3 "ห่างไกลผู้คน"
 hunt.1021.desc:1 "เมื่อแยกจากผู้อื่น ข้าพบบกระท่อมหลังหนึ่ง ซึ่งเป็นที่อาศัยของหนึ่งในผู้คนที่งดงามที่สุดเท่าที่ข้าเคยพบเห็น\n\n[beautiful_peasant.GetSheHe|U] ได้เชิญชวนให้ข้าพักผ่อน และข้าประหลาดใจนักที่ข้ามีอะไรเหมือนกันมากมายกับชาวนาธรรมดา\n\n"ท่านต้องกลับไปล่าสัตว์เร็วเพียงนี้หรือ [ROOT.Char.Custom('FormOfAddressForLiege')] ข้าไม่เคยพบ [ROOT.Char.GetWomanMan] เช่นท่านมาก่อนเลย...""
 hunt.1021.a:2 "บางทีข้าอาจจะอยู่ต่ออีก #EMP สักหน่อย#! ก็ได้..."
 hunt.1021.b.thrill:0 "มีเหยื่อที่น่าตื่นเต้นกว่ารอข้าอยู่!"
 hunt.1021.b.purpose:0 "ข้ามาที่นี่เพื่อล่าสัตว์ ไม่มีอะไรมากไปกว่านั้น"
 hunt.1021.b.appropriate:0 "นั่นคงไม่เหมาะสมอย่างยิ่ง!"
 hunt.1021.b.cruel:0 "อยู่กับเจ้า ชาวบ้านสกปรกเนี่ยนะ?!"
 hunt.1021.c:1 "ได้โปรด [beautiful_peasant.GetFirstNameNoTooltip] ให้ข้าจัดหาที่พำนักให้ท่านที่ [ROOT.Char.Custom('GetCourt')]"
 hunt.1021.c.success:0 "ชีวิตที่ [ROOT.Char.Custom('GetCourt')|U]"
 hunt.1021.c.failure:0 "ชีวิตที่เรียบง่าย"
 hunt.1021.c.failure_tt:0 "[beautiful_peasant.GetFirstNameNoTooltip] ยังคงอยู่ในป่า"
 hunt.1021.d:1 "ได้โปรด [beautiful_peasant.GetFirstNameNoTooltip] ให้ข้าจัดหาที่พำนักให้ท่านที่ [ROOT.Char.Custom('GetCourt')]"
 every_consort_tt:0 "ทุก [spouse|E] และ [lover|E]"

 hunt.1022.t:2 "รุ่งอรุณในที่สงัด"
 hunt.1022.desc:1 "ขณะที่ข้าเตรียมตัวจะจากไป ความทรงจำเกี่ยวกับใบหน้าที่งดงามของ [beautiful_peasant.GetHerHis] ซึ่งบิดเบี้ยวด้วยกิเลสตัณหา ยังคงอ้อยอิ่งอยู่ในใจข้า [beautiful_peasant.GetSheHe|U] ลูบไล้หนังสัตว์ที่เรานอนทับขณะที่ [beautiful_peasant.GetSheHe] เฝ้ามองข้า\n\n"นี่ไม่จำเป็นต้องเป็นคืนเดียวที่เราใช้เวลาร่วมกัน" [beautiful_peasant.GetSheHe] พูดเสียงออดอ้อน"
 hunt.1022.a:1 "ข้าเกรงว่ามันจำเป็น..."
 hunt.1022.a.tt:2 "#EMP ข้าคงจะไม่ได้เห็น [beautiful_peasant.GetHerHim] อีกแล้วอย่างแน่นอน...#!"
 hunt.1022.b:1 "มาอยู่กับข้า ที่ [ROOT.Char.Custom('GetCourt')]"

 hunt.1023.t:2 "สุนัขล่าสัตว์"
 hunt.1023.desc:2 "[ROOT.Char.Custom('DogStoryName')] วิ่งเหยาะๆ ตามข้างข้า เห็นได้ชัดว่า [ROOT.Char.Custom('DogStoryHerHis')] กำลังเพลิดเพลินกับเวลาที่อยู่ข้างนอก\n\nทันใดนั้น [ROOT.Char.Custom('DogStorySheHe')] ก็หยุดนิ่งและเริ่มเห่า และอีกสองสามวินาทีต่อมาก็ได้ยินเสียงบางอย่างเคลื่อนไหวผ่านพุ่มไม้เตี้ย บางอย่างที่ใหญ่โต\n\nเสียงเห่าของ [ROOT.Char.Custom('DogStoryHerHis')|U] กลายเป็นเสียงคำรามขู่ทันทีที่ [host.Custom('GetAnimalType')|l] พรวดพราดออกมาขวางทางเรา!"
 hunt.1023.a:0 "มาเร็ว [ROOT.Char.Custom('DogStoryName')] จัดการมัน!"
 hunt.1023.a.good:2 "[ROOT.Char.Custom('DogStoryName')] ล้ม [host.Custom('GetAnimalType')|l] ลงได้"
 hunt.1023.a.bad:0 "[ROOT.Char.Custom('DogStoryName')] ตายในการต่อสู้"
 hunt.1023.b:2 "ข้าจะล้มมันเอง [ROOT.Char.GetWomanMan] ต่อ [host.Custom('GetAnimalType')|l]"

 hunt.1030.t:1 "การซุ่มรอ"
 hunt.1030.desc:1 "นายพรานของข้าได้ชี้ให้เห็นที่โล่งอันเงียบสงัดแห่งหนึ่ง ซึ่งอยู่ใต้ลมจากที่ซ่อนของสัตว์ร้าย เป็นสถานที่ที่สมบูรณ์แบบในการจัดแนวธนูของเราและรอคอย [activity.Custom('GetAnimalType')] ที่ถูกไล่ต้อนมาโดยทีมสุนัขล่าเนื้อ\n\nมันจะเป็นโอกาสอันดีที่จะได้ฝึกฝนการยิงธนูของเรากับเป้าเคลื่อนที่จริง"
 hunt.1030.guest:0 "นายพรานของ [host.GetTitledFirstNamePossessive] ได้ชี้ให้เห็นที่โล่งอันเงียบสงัดแห่งหนึ่ง ซึ่งอยู่ใต้ลมจากที่ซ่อนของสัตว์ร้าย เป็นสถานที่ที่สมบูรณ์แบบในการจัดแนวธนูของเราและรอคอย [activity.Custom('GetAnimalType')] ที่ถูกไล่ต้อนมาโดยทีมสุนัขล่าเนื้อ\n\n"
 hunt.1030.ambush:0 "เจ้าภาพของเราคิดอยู่ครู่หนึ่ง ก่อนจะพยักหน้า "ใช่ เราจะมีการซุ่มโจมตีเล็กน้อย!""
 hunt.1030.a:0 "เป็นข้อเสนอแนะที่ยอดเยี่ยม"
 hunt.1030.b:0 "ไม่ ข้าต้องการต้อนมันเข้ามุม!"
 hunt.1030.c:0 "ไปกันเถอะ!"

 hunt.1032.opening:1 "เราเฝ้ามอง [activity.Custom('GetAnimalType')] จากแนวธนูที่ซ่อนอยู่ของเรา เกร็งตัวด้วยความคาดหวังขณะที่เสียงร้องของคนไล่สัตว์และเสียงเห่าหอนของสุนัขดังขึ้นเรื่อยๆ\n\n"
 hunt.1032.desc:1 "[activity.Custom('GetAnimalMale')] สี [activity.Custom('GetAnimalColor')] กระโจนเข้ามาในที่โล่งข้างหน้าอย่างกะทันหัน [activity.Custom('GetAnimalDanger')] แกว่งไปมา [activity.Custom('GetAnimalChargeParticiple')] ตรงมาทางเราด้วยความหวาดกลัว"
 hunt.1032.a:0 "หยุด! มันเป็น #EMP ของข้า#!!"
 hunt.1032.b:0 "หยุด มันเป็นของ [hunt_participant.GetFirstNamePossessiveNoTooltip]!"
 hunt.1032.e:0 "ตอนนี้! ทุกคน! #EMP ยิง!!#!"
 hunt.1032.e.tt:1 "[activity.Custom('GetAnimalType')] ซีดเผือดภายใต้ห่าธนู"
 hunt.1032.f:0 "#EMP หนีไป!!!#!"

 hunt.1033.desc:1 "แผนการของเราเปล่าประโยชน์ สัตว์ร้ายสัมผัสได้ถึงกับดักของเราจากลมหรือเล่ห์เหลี่ยม และปฏิเสธที่จะถูกคนไล่สัตว์นำเข้าไปในการซุ่มโจมตีของเรา\n\nในที่สุด มันก็หลุดรอดเงื้อมมือของพวกเขาไปโดยสิ้นเชิง หายลับเข้าไปใน [host.GetCurrentLocation.Custom('GetTerrainTypePlural')]..."
 hunt.1033.a:0 "เจ้าตัวฉลาด..."
 hunt.1033.b:0 "ทั้งหมดเป็นความผิดของ [hunt_participant.GetFirstNamePossessiveNoTooltip]!"

 hunt.1040.t:1 "อย่างเงียบเชียบ"
 hunt.1040.desc:0 "นายพรานของข้าบอกว่าพวกเขารู้ตำแหน่งที่ซ่อนของสัตว์ร้าย และแอ่งน้ำและทุ่งหญ้าใกล้เคียงที่ [activity.Custom('GetAnimalType')] แวะเวียนไปเป็นประจำ\n\nแม้ว่าจะไม่ใช่เรื่องง่ายเลยที่จะทำ แต่หากเราค่อยๆ ย่องเข้าใกล้ [activity.Custom('GetAnimalMale')] อย่างระมัดระวัง เราอาจจะจับมันได้โดยไม่รู้ตัวด้วยธนูของเรา"
 hunt.1040.guest:0 "นายพรานของ [host.GetTitledFirstNamePossessive] บอกว่าพวกเขารู้ตำแหน่งที่ซ่อนของสัตว์ร้าย และแอ่งน้ำและทุ่งหญ้าใกล้เคียงที่ [activity.Custom('GetAnimalType')] แวะเวียนไปเป็นประจำ\n\n"
 hunt.1040.stealth:0 "เจ้าภาพของเราคิดอยู่ครู่หนึ่ง ก่อนจะตกลงว่าเราควรย่องเข้าใกล้สัตว์ร้ายที่ไม่รู้ตัว"
 hunt.1040.chase:0 "เจ้าภาพของเราคิดอยู่ครู่หนึ่ง ก่อนจะพูดอย่างดูถูก "ข้ามาเพื่อการล่าที่แท้จริง! เราจะล่าด้วยกำลัง ไม่ใช่การลอบเร้น!""
 hunt.1040.a:0 "เราจะดำเนินการโดยการลอบเร้น!"
 hunt.1040.a.flavor:0 "#EMP ให้สุนัขเงียบ! จุ๊ๆ!#!"
 hunt.1040.b:0 "ปัดโธ่! นักล่าที่แท้จริงต้องต้อนเหยื่อเข้ามุม!"
 hunt.1040.b.flavor:0 "#EMP คนสุดท้ายที่ไปถึงต้องล้างคอกหมา!#!"
 hunt.1040.c:0 "ตกลงตามนั้น"

 hunt.1043.desc:1 "แม้ว่าเราจะพยายามอย่างเต็มที่แล้ว แต่เราก็ไม่สามารถเข้าใกล้ [activity.Custom('GetAnimalGroup')] ของ [activity.Custom('GetAnimalType')] ได้: พวกมันสัมผัสได้ถึงเราทุกครั้งที่เราเข้าใกล้ วิ่งหนีและหลบซ่อน\n\nเกือบจะมืดเกินไปที่จะดำเนินการต่อ เราจะต้องยอมแพ้ต่อ [activity.Custom('GetAnimalPlural')]..."
 hunt.1043.a:0 "ท่านไม่สามารถชนะได้ทุกครั้ง..."
 hunt.1043.b:0 "ช่างเป็นความเละเทะจริงๆ [hunt_participant.GetFirstNameNoTooltip]!"

 hunt.1060.t:0 "การโบยบิน"
 hunt.1060.desc_opening_courtier:0 "[ROOT.Char.Custom2('RelationToMeShort', hunt_participant)] ของข้า [hunt_participant.GetTitledFirstName] ส่งสัญญาณให้คณะเงียบ: เรามาถึงจุดปล่อยนกที่ผู้ควบคุมการล่ากำหนดไว้แล้ว"
 hunt.1060.desc_opening:0 "ผู้ควบคุมการล่าของข้าส่งสัญญาณให้คณะเงียบ: เรามาถึงจุดปล่อยนกแล้ว"
 hunt.1060.desc_guest:0 "ผู้ควบคุมการล่าของ [host.GetTitledFirstNamePossessive] ส่งสัญญาณให้คณะเงียบ: เรามาถึงจุดปล่อยนกแล้ว"
 hunt.1060.exotic:0 "\n\nไม่ไกลนัก [activity.Custom('GetAnimalGroup')] ของ [activity.Custom('GetAnimalPlural')] สี [activity.Custom('GetAnimalColor')] กำลังบินผ่านท้องฟ้า เสียง [activity.Custom('GetAnimalSoundParticiple')] อันห่างไกลของพวกมันประกาศถึงกีฬาของเรา!"
 hunt.1060.water:0 "\n\nมีแนวสายตาที่ชัดเจนไปยัง [activity.Custom('GetAnimalGroup')] ของ [activity.Custom('GetAnimalPlural')] สี [activity.Custom('GetAnimalColor')] กำลังดื่มน้ำอยู่ในสระน้ำข้างหน้า"
 hunt.1060.ground:0 "\n\nจากจุดที่ได้เปรียบของเรา เราสามารถเห็น [activity.Custom('GetAnimalPlural')] สี [activity.Custom('GetAnimalColor')] หลายตัวกำลังเดินวางท่าอยู่ใน [host.GetCurrentLocation.Custom('GetProvinceFoliageDesc')] ข้างหน้า"
 hunt.1060.hare:0 "\n\nจากจุดที่ได้เปรียบของเรา เราสามารถเห็น [activity.Custom('GetAnimalPlural')] สี [activity.Custom('GetAnimalColor')] หลายตัวอยู่ใน [host.GetCurrentLocation.Custom('GetTerrainType')] ข้างหน้า"
 hunt.1060.closing:0 "\n\nคณะหยุดลงขณะที่เราเตรียมถอดผ้าคลุมหัวนกของเราและปล่อยพวกมันทีละตัวเพื่อเริ่มการล่า!"
 hunt.1060.beaters:0 "คนตีพุ่มไม้จะเข้าประจำตำแหน่งในไม่ช้า พร้อมที่จะ ทำให้สัตว์ตื่นตกใจบินหนี"
 hunt.1060.a:0 "บินตรงเป้านะ เจ้าตัวน้อย"
 hunt.1060.b:0 "ข้าแค่อยากจะดู"
 hunt.1060.b.flavor:0 "#EMP ปลอดภัยไว้ก่อน!#!"
 hunt.1060.d:0 "ถึงเวลาแล้ว!"

 hunt.1062.t.hare:0 "กระต่ายป่าในกำมือ"
 hunt.1062.t:0 "นกในกำมือ"
 hunt.1062.desc:0 "ข้าเฝ้าดูอย่างตื่นเต้นขณะที่ [activity.Custom('GetRaptorType')] ของข้าระบุเป้าหมายและโบยบินขึ้นจากจุดเฝ้าดู ทะยานขึ้นสูงไปในอากาศ"
 hunt.1062.guest:0 "[host.GetTitledFirstName] เฝ้าดูอย่างตื่นเต้นขณะที่ [activity.Custom('GetRaptorType')] ของ [host.GetHerHis] ระบุเป้าหมายและโบยบินขึ้นจากจุดเฝ้าดู ทะยานขึ้นสูงไปในอากาศ"
 hunt.1062.exotic:0 "\n\nปีนขึ้นสู่ตำแหน่งในการไล่ตาม [activity.Custom('GetAnimalGroup')] ของ [activity.Custom('GetAnimalType')] [activity.Custom('GetRaptorType')] กำลังทำทุกอย่างถูกต้อง! เหยื่อที่ตื่นตระหนกแตกกระเจิง [activity.Custom('GetAnimalSoundParticiple')] เตือนภัย แต่มันสายเกินไปแล้ว!"
 hunt.1062.water:0 "\n\nคนตีพุ่มไม้ได้ ทำให้ [activity.Custom('GetAnimalPlural')] สี [activity.Custom('GetAnimalColor')] ที่ [activity.Custom('GetAnimalSoundParticiple')] แตกกระเจิง ซึ่งตอนนี้เติมเต็มอากาศด้วยเสียงกระพือปีกอันอึกทึก"
 hunt.1062.ground:0 "\n\n[activity.Custom('GetAnimalPlural')] ไม่รู้เรื่องรู้ราว ขณะที่ [activity.Custom('GetRaptorType')] ของข้าสอดส่องพื้นดินจากเบื้องบน"
 hunt.1062.sky:0 "\n\nมันโฉบลงมาราวกับสายฟ้าฟาด: เสียงปะทะที่ได้ยินดังตามมาในอีกครู่ต่อมาขณะที่เหยื่อร่วงหล่นจากท้องฟ้า!"
 hunt.1062.floor:0 "\n\nมันโฉบลงมาราวกับสายฟ้าฟาด: เหยื่อตะเกียกตะกายหาที่กำบัง แต่มันสายเกินไปแล้ว!!"
 hunt.1062.a:0 "#EMP ใช่เลย!!#!"
 hunt.1062.a.flavor:0 "[activity.Custom('GetRaptorType')] ของข้าจะได้ลิ้มรสในวันนี้!"
 hunt.1062.b:0 "ทำได้ดีมาก!"

 hunt.1063.t:0 "สองตัวในพุ่มไม้ (นกล่าพลาด)"
 hunt.1063.desc:0 "ครั้งแล้วครั้งเล่าที่ [activity.Custom('GetRaptorType')] ของข้าโฉบลงมาเพื่อสังหาร แต่พลาด ถอยกลับ หรือเพียงแค่เฉี่ยวเป้าหมาย"
 hunt.1063.desc_guest:0 "ครั้งแล้วครั้งเล่าที่ [activity.Custom('GetRaptorType')] ของ [host.GetTitledFirstNamePossessive] โฉบลงมาเพื่อสังหาร แต่พลาด ถอยกลับ หรือเพียงแค่เฉี่ยวเป้าหมาย"
 hunt.1063.closing:0 "\n\nหลังจากพยายามมาหลายชั่วโมง สัตว์ป่าก็หายไปเกือบหมด [activity.Custom('GetRaptorType')] ใกล้จะหมดแรง และแสงก็กำลังจางหายไป..."
 hunt.1063.a:0 "ยังมีครั้งหน้าเสมอ"
 hunt.1063.a.flavor:0 "เจ้านกบ้านี่..."
 hunt.1063.d:0 "น่าเสียดาย"

 hunt.1080.t.bodyguard:0 "ไม่ได้อยู่ลำพังเสียทีเดียว"
 hunt.1080.t:0 "อยู่ตามลำพังโดยแท้"
 hunt.1080.opening_lone:0 "[ROOT.Char.Custom2('RelationToMeShort', murderer)] ของข้า [murderer.GetTitledFirstName] และข้าอยู่ข้างหน้าคนอื่นๆ"
 hunt.1080.opening_accomplice:0 "[ROOT.Char.Custom2('RelationToMeShort', murderer)] ของข้า [murderer.GetTitledFirstName] [ROOT.Char.Custom2('RelationToMeShort', accomplice)] ของข้า [accomplice.GetTitledFirstName] และข้าอยู่ข้างหน้าคนอื่นๆ"
 
 hunt.1080.chase:0 "ถูกกระตุ้นโดยเสียงร้องและกวักมือเรียกที่ไม่หยุดหย่อนของ [murderer.GetFirstNamePossessiveNoTooltip] ให้เร่งตาม [activity.Custom('GetAnimalType')] ที่กำลังหนี\n\nข้าเพิ่งนึกขึ้นได้ว่าเส้นทางนี้เงียบสงัดและเปลี่ยวเพียงใด — เสียงของคณะที่เหลือค่อยๆ จางหายไป และมองไม่เห็นพวกเขาเลย\n\n"
 hunt.1080.bow:0 "ถูกกระตุ้นโดยเสียงร้องที่ไม่หยุดหย่อนของ [murderer.GetHerHis] ให้เร่งตาม [activity.Custom('GetAnimalType')] ที่กำลังหนี\n\nเส้นทางนี้เงียบสงัดและเปลี่ยว และข้านึกขึ้นได้: เสียงของคณะที่เหลือค่อยๆ จางหายไป — มองไม่เห็นคนอื่นๆ เลย\n\n"

 hunt.1080.falconry:0 "ถูกชักชวนให้ออกนอกเส้นทางอย่างแข็งขันโดยการอ้างว่าเห็น [activity.Custom('GetAnimalPlural')] ที่น่าสงสัย แต่ยืนกรานของ [murderer.GetFirstNamePossessiveNoTooltip]\n\nข้าเพิ่งนึกขึ้นได้ว่าเส้นทางนี้เงียบสงัดและเปลี่ยว — เสียงของคณะที่เหลือค่อยๆ จางหายไป และมองไม่เห็นคนอื่นๆ เลย\n\n"

 hunt.1080.closing_lone:0 "เมื่อหันกลับไป ข้าเห็น [murderer.GetFirstNameNoTooltip] เข้ามาใกล้อย่างรวดเร็ว มีดของ [murderer.GetHerHis] ถูกชักออกมา ประกายตาอันน่าสะพรึงกลัว"
 hunt.1080.closing_accomplice:0 "เมื่อหันกลับไป ข้าเห็น [murderer.GetFirstNameNoTooltip] และ [accomplice.GetFirstNameNoTooltip] เข้ามาใกล้อย่างรวดเร็ว มีดถูกชักออกมา ประกายตาอันน่าสะพรึงกลัว"
 hunt.1080.closing_bow:0 "เมื่อหันกลับไปที่เส้นทาง ข้าเห็น [murderer.GetFirstNameNoTooltip] เข้ามาใกล้อย่างรวดเร็ว มีดของ [murderer.GetHerHis] ถูกชักออกมา ประกายตาอันน่าสะพรึงกลัว"
 hunt.1080.closing_bow_accomplice:0 "เมื่อหันกลับไปที่เส้นทาง ข้าเห็น [murderer.GetFirstNameNoTooltip] และ [accomplice.GetFirstNameNoTooltip] เข้ามาใกล้อย่างรวดเร็ว มีดของพวกเขาถูกชักออกมา ประกายตาอันน่าสะพรึงกลัว"

 hunt.1080.desc:0 "อย่างน้อย ข้าก็คิดว่าเราเป็น เช่นนั้น เมื่อข้าหันกลับไป คณะที่เหลือของข้าก็มองไม่เห็นเลย"
 hunt.1080.bodyguard_betray:0 "\n\n[bodyguard_betray.GetFirstNameNoTooltip] เจ้ากำลังทำอะไร?! หยุดนะ!"
 hunt.1080.bodyguard_appears:0 "\n\nข้าได้ยินเสียงตะโกนข้างหลัง: องครักษ์ของข้า [bodyguard.GetFirstName] กำลังวิ่งมาตามเส้นทาง "#EMP [ROOT.Char.GetTitleAsNameNoTooltip] ระวัง!#!""
 hunt.1080.bodyguard:0 "\n\nองครักษ์ของข้า [bodyguard.GetFirstName] อยู่ที่ไหนเมื่อข้าต้องการ [bodyguard.GetHerHim]? ไอ้คนโง่!"
 hunt.1080.dog_appears:0 "\n\nเสียงเห่าดังขึ้น: ข้าหันไปเห็นสุนัขสุดที่รักของข้า [ROOT.Char.Custom('DogStoryName')] วิ่งปราดเข้ามาหาข้าอย่างปกป้อง ส่งเสียงดังประกาศการมาถึงของ [ROOT.Char.Custom('DogStorHerHis')]"
 hunt.1080.a.bodyguard:0 "[bodyguard.GetFirstNameNoTooltip]! เร็วเข้า!"
 hunt.1080.a.dog:0 "[ROOT.Char.Custom('DogStoryName')]! ใช่แล้ว [ROOT.Char.Custom('DogStoryGirlBoy')]!"
 hunt.1080.a.accomplice:0 "เอ่อ [murderer.GetFirstNameNoTooltip]? [accomplice.GetFirstNameNoTooltip]?!"
 hunt.1080.a:0 "เอ่อ [murderer.GetFirstNameNoTooltip]?"
 hunt.1080.a.duel_success_accomplice:0 "ท่านเอาชนะ [murderer.GetFirstNameNoTooltip] และ [accomplice.GetFirstNameNoTooltip] ได้"
 hunt.1080.a.duel_failure_accomplice:0 "[murderer.GetFirstNameNoTooltip] และ [accomplice.GetFirstNameNoTooltip] เอาชนะท่านได้"
 hunt.1080.a.duel_success:0 "ท่านเอาชนะ [murderer.GetFirstNameNoTooltip] ได้"
 hunt.1080.a.duel_failure:0 "[murderer.GetFirstNameNoTooltip] เอาชนะท่านได้"
