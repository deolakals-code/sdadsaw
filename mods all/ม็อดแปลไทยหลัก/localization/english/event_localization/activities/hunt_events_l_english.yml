 hunt.1090.desc:0 "หลังจากขี่ม้ามาหลายชั่วโมง ค้นหาทุกซอกทุกมุมของ [host.GetCurrentLocation.Custom('GetTerrainTypePlural')] ข้าจำต้องยอมแพ้ต่อแสงที่กำลังจางหายไป\n\n[activity.Custom('GetAnimalType')] สี [activity.Custom('GetLegendaryColor')] ในตำนานหายไปราวกับวิญญาณทันทีที่เราเห็น ดูเหมือนจะไม่ทิ้งร่องรอยกลิ่นหรือรอยเท้าไว้เลย...\n\nขณะที่ข้าหันหลังกลับไปยังค่ายพัก เสียงร้องอันห่างไกลของ [activity.Custom('GetAnimalType')] เยาะเย้ยข้าข้ามทิวทัศน์ที่มืดลง"
