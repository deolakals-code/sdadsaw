 hunt.1081.desc:0 "ข้าชักมีดล่าสัตว์ ร้องขอความช่วยเหลือขณะที่ [murderer.GetFirstName] เร่งฝีเท้าของ [murderer.GetHerHis] ถูกขับเคลื่อนด้วยเจตนาอันดุร้ายน่าสะพรึงกลัว ช่วงเวลาต่อมาเป็นภาพเลือนราง...\n\n"
 hunt.1081.desc_accomplice:0 "ข้าชักมีดล่าสัตว์ ร้องขอความช่วยเหลือขณะที่ [murderer.GetFirstName] และ [accomplice.GetFirstName] รุมเข้าใส่ข้า ทำหน้าบิดเบี้ยวด้วยเจตนาอันน่ากลัว ช่วงเวลาต่อมาเป็นภาพเลือนราง...\n\n"
