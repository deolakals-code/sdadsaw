 hunt.1201.critical:0 "\n\nขณะที่ [animal_slayer.GetTitledFirstNameNoTooltip] แทงคมมีดของ [animal_slayer.GetHerHis] เข้าไป สัตว์ร้ายโจมตีอย่างดุร้ายด้วย [activity.Custom('GetAnimalStrike')] ทำให้ [animal_slayer.GetHerHim] ดิ้นทุรนทุรายด้วยบาดแผลอันน่ากลัว!"
