 hunt.1202.failure_self:0 "\n\nเราค่อยๆ ล้อมรอบมัน หอกชี้ชัน แต่ [injury_target.GetFirstName] ได้รับ [activity.Custom('GetAnimalStrike')] ก่อนที่เราจะ ทำให้สัตว์ที่ [activity.Custom('GetAnimalSoundParticiple')] พ้นทุกข์"
 hunt.1202.failure:0 "\n\nเหล่านักล่าค่อยๆ ล้อมรอบมัน หอกชี้ชัน แต่ [injury_target.GetFirstName] ได้รับ [activity.Custom('GetAnimalStrike')] ก่อนที่เราจะ ทำให้สัตว์ที่ [activity.Custom('GetAnimalSoundParticiple')] พ้นทุกข์"
 hunt.1202.critical_self:0 "\n\nเราค่อยๆ ล้อมรอบมัน หอกชี้ชัน แต่ [injury_target.GetFirstName] ได้รับ [activity.Custom('GetAnimalStrike')] อันน่าสะพรึงกลัวก่อนที่เราจะ ทำให้สัตว์ที่ [activity.Custom('GetAnimalSoundParticiple')] พ้นทุกข์!"
 hunt.1202.critical:0 "\n\nเหล่านักล่าค่อยๆ ล้อมรอบมัน หอกชี้ชัน แต่ [injury_target.GetFirstName] ได้รับ [activity.Custom('GetAnimalStrike')] อันน่าสะพรึงกลัวก่อนที่เราจะ ทำให้สัตว์ที่ [activity.Custom('GetAnimalSoundParticiple')] พ้นทุกข์!"
 hunt.1202.a.self:0 "รับนี่ไป!"
 hunt.1202.a:0 "การสังหารที่ยอดเยี่ยม!"
