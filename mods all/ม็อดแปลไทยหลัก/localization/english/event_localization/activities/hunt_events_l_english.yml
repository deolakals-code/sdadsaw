 hunt_showed_remorse_log: "[CHARACTER.GetShortUIName|U] แสดงความสำนึกผิดระหว่างการล่าสัตว์"

 tgp_hunt.0003.t: "จุดจบที่มิคาดคิด"
 tgp_hunt.0003.desc: "เมื่อข้ากลับมายังค่าย ข้าได้รับแจ้งข่าวที่น่าประหลาดใจอย่างยิ่ง - [host.GetName] ได้ยกเลิกการล่า บอกให้ทุกคนแยกย้ายทันที!\n\nมีข่าวลือว่า [host.GetName] รู้สึกถึงแรงกระตุ้นแห่งความเมตตาแบบ [GetReligionByKey('buddhism_religion').GetAdjective] หลังจากที่เหยี่ยวของ [host.GetHerHis] ฆ่าเป็ด"
 tgp_hunt.0003.a: "แต่ข้าเพิ่งจะเริ่มเท่านั้น!"
 tgp_hunt.0003.a.flavor: "เพียงแค่... เพราะเหตุใด?"

 tgp_hunt.0004.t: "การเผชิญหน้า [activity.GetCurrentPhase.GetLocation.Custom('GetReligiousFigurineName')]"
 tgp_hunt.0004.desc_common: "ขณะที่กำลังสอดส่องหา [activity.Custom('GetAnimalType')] ข้าได้พบ [activity.GetCurrentPhase.GetLocation.Custom('GetReligiousFigurineName')] ตั้งอยู่บนก้อนหินข้างทาง\n\n"
 tgp_hunt.0004.desc_true: "$tgp_hunt.0004.desc_common$เป็นโอกาสอันดียิ่งที่จะสักการะ [ROOT.Char.Custom('GetAppropriateGodname')]"
 tgp_hunt.0004.desc_astray: "$tgp_hunt.0004.desc_common$ข้าเดาว่าชาวบ้านแถบนี้สักการะ [local_faith.HighGodName]!"
 tgp_hunt.0004.desc_evil_hostile: "$tgp_hunt.0004.desc_common$สัญลักษณ์อันชั่วช้าแห่ง [local_faith.GetName] ท้องถิ่นนี้กำลังเย้ยหยันข้าอย่างโจ่งแจ้ง"
 tgp_hunt.0004.a: "ยังมีเรื่องสำคัญกว่าที่ต้องทำ"
 tgp_hunt.0004.a.flavor: "บางทีคงเป็นโอกาสหน้า"
 tgp_hunt.0004.b: "สวดภาวนาที่รูปปั้น"
 tgp_hunt.0004.b.flavor: "ความสงบทางใจ"
 tgp_hunt.0004.c: "ความเชื่อของ [local_faith.GetAdherentNamePluralNoTooltip] สอดคล้องกับพวกเรา [ROOT.Char.GetFaith.GetAdherentNamePluralNoTooltip]"
 tgp_hunt.0004.c.flavor: "$tgp_hunt.0004.b.flavor$"
 tgp_hunt.0004.d: "ศรัทธา [local_faith.GetAdjectiveNoTooltip] ยังคงหลงผิด"
 tgp_hunt.0004.d.flavor: "ข้าต้องทำลายมัน!"
 tgp_hunt.0004.e: "พวกเขาควรสักการะ [ROOT.Char.GetFaith.HighGodName]!"
 tgp_hunt.0004.e.flavor: "$tgp_hunt.0004.d.flavor$"
