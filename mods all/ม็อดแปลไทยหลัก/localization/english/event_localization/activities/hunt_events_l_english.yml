 hunt_poem_dedication: "การอุทิศบทกวีการล่า"
 hunt_convinced_fellow_hunter_to_stay: "โน้มน้าวเพื่อนนักล่าให้อยู่ต่อ"
 
 tgp_hunt.0007.t: "กระต่ายป่าที่รอให้จับ"
 tgp_hunt.0007.desc: "เมื่อข้ากลับมายังค่าย ข้าได้ยินเสียงร้องจากพุ่มไม้\n\nเสียงร้องอันเจ็บปวดเผยให้เห็นกระต่ายป่าในบ่วงแร้วของพวกลักลอบล่าสัตว์ [target_character.GetFirstName] เข้ามาและยกสัตว์ที่ติดกับขึ้น เลียริมฝีปากของ [target_character.GetHerHis]..."
 tgp_hunt.0007.a: "ความสูญเสียของพวกลักลอบล่า คือกำไรของเรา"
 tgp_hunt.0007.a.flavor: "การล่าดำเนินไปด้วยดีจริง ๆ!"
 tgp_hunt.0007.b: "เราไม่ได้สิ่งนี้มาอย่างคู่ควร! ข้าขอเสนอให้ปล่อยมันไปเพื่อเมตตา"
 tgp_hunt.0007.b.flavor: "[target_character.GetFirstNameNoTooltip] เป็น [target_character.GetWomanMan] ที่มีเกียรติหรือไม่?"
 tgp_hunt.0007.b.success: "[target_character.GetFirstName] เห็นด้วยกับท่าน"
 tgp_hunt.0007.b.failure: "[target_character.GetFirstName] ผิดหวัง"
 hunt_found_rabbit_in_a_trap_log_title: "$tgp_hunt.0007.t$"
 hunt_found_rabbit_in_a_trap_log: "[CHARACTER.GetShortUIName|U] พบกระต่ายป่าในกับดัก"
 hunt_released_rabbit_from_trap_log_title: "$tgp_hunt.0007.t$"
 hunt_released_rabbit_from_trap_log: "[CHARACTER.GetShortUIName|U] ปล่อยกระต่ายป่า"

 hunt_active_participation: "การมีส่วนร่วมอย่างแข็งขัน"
 hunt_released_someones_catch: "ปล่อยสัตว์ที่จับได้"

 tgp_hunt.0008.t: "การเปลี่ยนวิถีชีวิต"
 tgp_hunt.0008.desc: "ขณะกำลังย่องตามเหยื่อ ข้าพบ [target_character.GetName] ที่กำลังเศร้าโศก พร้อมกับคันธนูของ[target_character.GetHerHis]หักเป็นสองท่อน\n\nข้าเสนอให้ยืมอันหนึ่งของข้า แต่ [target_character.GetSheHe] ประกาศว่า\n\n\"ข้าขอละทิ้งกีฬาเปื้อนเลือดแห่งการล่า แม้ว่าข้าจะขอบคุณที่มันได้เผยหนทางของข้าในฐานะนักบวช ต่อ แต่นี้ แทนที่จะหลั่งเลือด ข้าจะสักการะ [target_character.GetFaith.HighGodName]\""
 tgp_hunt.0008.a: "พยายามโน้มน้าว [target_character.GetFirstNameNoTooltip] ให้เปลี่ยนใจ"
 tgp_hunt.0008.a.flavor: "ไม่มีสิ่งใดที่คำพูดเล็กน้อยจะทำไม่ได้"
 tgp_hunt.0008.a.success: "ท่านโน้มน้าว [target_character.GetFirstName] ให้กลับไปใช้วิถีชีวิตเดิมได้สำเร็จ"
 tgp_hunt.0008.a.failure: "[target_character.GetFirstName] ยังคงดื้อดึง"
 tgp_hunt.0008.b: "นั่นคือทางเลือกของ [target_character.GetHerHis]"
 tgp_hunt.0008.b.flavor: "ไร้ประโยชน์ที่จะหาเหตุผลกับคนที่ตัดสินใจแน่วแน่แล้ว"
 hunt_character_became_a_buddhist_monk_log_title: "$tgp_hunt.0008.t$"
 hunt_character_became_a_buddhist_monk_log: "[target_character.GetShortUIName] ได้เป็นนักบวช [GetReligionByKey('buddhism_religion').GetAdjective]"
 hunt_character_got_talked_out_of_becoming_monk_log_title: "$tgp_hunt.0008.t$"
 hunt_character_got_talked_out_of_becoming_monk_log: "[CHARACTER.GetShortUIName|U] พูดเกลี้ยกล่อม [target_character.GetShortUIName] ให้เลิกเป็นนักบวช [GetReligionByKey('buddhism_religion').GetAdjective]"
 

 tgp_hunt.0009.t: "ฤๅษี [target_faith.GetReligion.GetAdjectiveNoTooltip]"
 tgp_hunt.0009.desc: "ขณะไล่ตามเหยื่อ ข้าบังเอิญพบนักพรตผู้หนึ่งกำลังเลี้ยงเหยี่ยว\n\n"ชื่นชมความงามของนกข้าสิ!"\n\n"ท่านคงเป็นนายพรานที่เก่งกาจ" ข้าตอบ ใคร่รู้เรื่องราวการผจญภัยของ [buddhist_hermit.GetHerHis]\n\n"หาไม่ ห่างไกลนัก นกเหล่านี้ไม่เคยถูกปล่อยไปฆ่า มันขัดต่อคำสอนของ [buddhist_hermit.GetFaith.HighGodName]" มันยุติธรรมหรือที่จะขัดขวางวิถีตามธรรมชาติ?"
 tgp_hunt.0009.a: "หลอกลวงนักบวช"
 tgp_hunt.0009.a.flavor: "ข้าจะไม่ปล่อยเหยี่ยวบิน, เชื่อใจข้าเถิด"
 tgp_hunt.0009.b: "ยื่นข้อเสนอดี ๆ ให้ [buddhist_hermit.GetHerHim]"
 tgp_hunt.0009.b.flavor: "ทองคำที่มากพอสามารถโน้มน้าวได้ทุกคน"
 tgp_hunt.0009.c: "ชิ! ข้าจะไปล่ากับคนอื่นแทน"
 tgp_hunt.0009.c.flavor: "จะเสียเวลากับคนนอกคอก เช่นนี้ใย?"
 tgp_hunt.0009.d: "ข้าชื่นชมในหลักการของ [buddhist_hermit.GetHerHis]"
 tgp_hunt.0009.d.flavor: "ความเชื่อ เช่นนี้น่ายกย่อง"
 hunt_deceives_a_monk_title: "$tgp_hunt.0009.t$"
 hunt_deceives_a_monk: "[CHARACTER.GetShortUIName|U] พยายามหลอกลวง [buddhist_hermit.GetShortUIName]"
 tgp_hunt.0009.a.success: "[buddhist_hermit.GetFirstName] เชื่อ"
 tgp_hunt.0009.a.failure: "[buddhist_hermit.GetFirstName] จับได้ว่าข้าโกหก"
 tgp_hunt.0009.b.success: "ทองคำมากพอที่จะซื้อหลักการของ [buddhist_hermit.GetFirstNamePossessive]"
 tgp_hunt.0009.b.failure: "[buddhist_hermit.GetFirstName] ยังคงยึดมั่นในความเชื่อของ [buddhist_hermit.GetHerHis]"
 hunt_buys_a_falcon_title: "$tgp_hunt.0009.t$"
 hunt_buys_a_falcon: "[CHARACTER.GetShortUIName|U] ซื้อเหยี่ยว"
 hunt_wanders_title: "$tgp_hunt.0009.t$"
 hunt_wanders: "[CHARACTER.GetShortUIName|U] ช่วยล่อสัตว์"
 hunt_admires_buddhist_principles_title: "$tgp_hunt.0009.t$"
 hunt_admires_buddhist_principles: "[CHARACTER.GetShortUIName|U] ตีความว่าเป็นการแทรกแซงจากสวรรค์"

 tgp_hunt.0010.t: "นกกระเรียนมงกุฎแดง"
 tgp_hunt.0010.desc_common: "\n\nขณะที่เราเร่งรุดไปยังที่ที่พบ [activity.Custom('GetAnimalType')] ครั้งสุดท้าย เราพบเห็นบางสิ่งที่งดงามตระการตากว่ามาก: ฝูงนกกระเรียนมงกุฎแดง\n\nสัญลักษณ์แห่งอายุอันยืนยาวและความเป็นอมตะเหล่านี้บังคับให้ข้าต้องไตร่ตรอง..."
 tgp_hunt.0010.desc_master_of_the_hunt: "ขณะพักที่ค่าย นายพรานของข้าวิ่งมาบอกข้าว่าพบ [activity.Custom('GetAnimalType')] ทางทิศตะวันออก $tgp_hunt.0010.desc_common$"
 tgp_hunt.0010.desc_fallback: "ขณะพักที่ค่าย สหายนักล่า [target_character.GetFirstName] รีบมาบอกข้าว่าพบ [activity.Custom('GetAnimalType')] ทางทิศตะวันออก $tgp_hunt.0010.desc_common$"
