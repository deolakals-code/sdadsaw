 hunt.1202.c:0 "โศกนาฏกรรม..."

 hunt.2000.t:0 "พ่อค้าสุนัข"
 hunt.2000.opening_master:0 "[ROOT.Char.Custom('GetHuntMasterDesc')] ของข้า [m_hunt.GetTitledFirstName] ได้นำ [dog_salesman.GetWomanMan] ผู้หนึ่งมาหาข้า ซึ่งอ้างว่าขายสุนัขล่าเนื้อชั้นดี\n\n"
 hunt.2000.opening_hunter:0 "[ROOT.Char.Custom2('RelationToMe', m_hunt)] ของข้า [m_hunt.GetTitledFirstName] นักล่าตัวยง ได้นำ [dog_salesman.GetWomanMan] ผู้หนึ่งมาหาข้า ซึ่งขายสุนัขล่าเนื้อชั้นดี\n\n"
 hunt.2000.opening:0 "[dog_salesman.GetWomanMan] ผู้หนึ่ง ซึ่งขายสุนัขล่าเนื้อชั้นดีได้มาถึง [ROOT.Char.GetCurrentLocation.GetNameNoTooltip] ดูเหมือนหวังว่าจะหาลูกค้าใหม่\n\n"
 hunt.2000.desc:0 ""ข้าขาย แต่สุนัขล่าเนื้อที่ดีที่สุดเท่านั้น ฝึกฝนมาแล้วและพร้อมที่จะเข้าร่วมทีมล่าสัตว์ใดๆ โดยไม่มีปัญหา ท่านจะไม่พบสุนัขที่ดีกว่านี้ที่ใดใน [ROOT.Char.GetTopLiege.GetPrimaryTitle.GetDefinitiveNameNoTooltip] [ROOT.Char.GetTitleAsNameNoTooltip]!"\n\nเบื้องหน้าข้าคือแถวของสุนัขที่ถูกล่ามไว้หลายขนาดและรูปร่าง นั่งอย่างสงบรอการประเมินจากข้า"
 hunt.2000.a:0 "สุนัขดมกลิ่นที่ดีมีค่าดั่งทองคำ"
 hunt.2000.b:0 "ตัวนี้สามารถล้มหมูป่าได้ด้วยตัวเอง!"
 hunt.2000.b.tt:0 "ท่านจะไม่ได้รับเหตุการณ์ [hunt_sighting_no_prefix|E] จนกว่าท่านจะจัด [GetActivityType('activity_hunt').GetName]"
 hunt.2000.c:1 "น่าประทับใจ เจ้าจะดูแลคอกสุนัขของข้าหรือไม่ [dog_salesman.GetFirstNameNoTooltip]?"
 hunt.2000.d:0 "ข้าไม่ต้องการสุนัขเพิ่ม"
 
 hunt.2001.t:0 "พ่อค้าเหยี่ยว"
 hunt.2001.opening_master:0 "[ROOT.Char.Custom('GetHuntMasterDesc')] ของข้า [m_hunt.GetTitledFirstName] ได้นำ [falcon_salesman.GetWomanMan] ผู้หนึ่งมาหาข้า ซึ่งอ้างว่าขายเหยี่ยวล่าสัตว์ที่ฝึกแล้ว\n\n"
 hunt.2001.opening_hunter:0 "[ROOT.Char.Custom2('RelationToMe', m_hunt)] ของข้า [m_hunt.GetTitledFirstName] นักล่าตัวยง ได้นำ [falcon_salesman.GetWomanMan] ผู้หนึ่งมาหาข้า ซึ่งขายเหยี่ยวล่าสัตว์ที่ฝึกแล้ว\n\n"
 hunt.2001.opening:0 "[falcon_salesman.GetWomanMan] ผู้หนึ่ง ซึ่งขายเหยี่ยวล่าสัตว์ที่ฝึกแล้วได้มาถึง [ROOT.Char.GetCurrentLocation.GetNameNoTooltip] ดูเหมือนหวังว่าจะหาลูกค้าใหม่\n\n"
 hunt.2001.desc:0 ""นี่คือนกที่ดีที่สุด ข้าเลี้ยงพวกมันมาตั้งแต่ยังเป็นลูกนกด้วยตัวเอง พวกมันจะไม่ ทำให้ท่านผิดหวัง [ROOT.Char.GetTitleAsNameNoTooltip]!"\n\nเหยี่ยวฮอว์กและเหยี่ยวฟอลคอนหลากหลายขนาดนั่งอย่างสงบบนราวเกาะนกเบื้องหน้าข้า"
 hunt.2001.a:0 "นี่เป็นตัวอย่างที่ยอดเยี่ยม!"
 hunt.2001.a.flavor:0 "ข้าจะเอามัน!"
 hunt.2001.c:0 "ในที่สุด [falcon_salesman.GetFirstNameNoTooltip]! คนที่จะมาดูแลโรงเลี้ยงเหยี่ยวของข้า!"
 hunt.2001.d:0 "ดีมาก แต่ข้าไม่สนใจ..."

 hunt.2500.t:1 "[sighting_province.GetTitle.GetDeJureLiege.Custom('GetAnimalPlural')|U] แห่ง [sighting_province.GetNameNoTooltip]"
 hunt.2500.opening_master:0 "[ROOT.Char.Custom('GetHuntMasterDesc')] ของข้า [sighting_character.GetTitledFirstName] นำข่าวเรื่องสัตว์ร้ายที่พบเห็นในอาณาจักรของข้ามาแจ้ง\n\n"
 hunt.2500.opening_hunter:0 "[ROOT.Char.Custom2('RelationToMe', sighting_character)] [sighting_character.GetTitledFirstName] ของข้า ซึ่งเป็นที่รู้จักในด้านความสนใจ [sighting_character.GetHerHis] ในการล่าสัตว์ นำข่าวลือเกี่ยวกับสัตว์ร้ายที่พบเห็นในอาณาจักรของข้ามา\n\n"
 hunt.2500.opening_fallback:0 "คนเรามักได้ยินข่าวลือทุกประเภทบนถนนกว้างใหญ่ของ [ROOT.Char.GetCurrentLocation.GetCounty.GetTitle.GetDeJureLiege.GetNameNoTierNoTooltip] และวันนี้ นักล่าช่างพูดคนหนึ่งได้มาพูดให้ข้ารำคาญหู\n\n"
 hunt.2500.opening:0 "[ROOT.Char.Custom2('RelationToMe', sighting_character)] ของข้า [sighting_character.GetTitledFirstName] ได้ส่งข่าวเรื่องสัตว์ร้ายที่พบเห็นในอาณาจักรของข้า\n\n"
 hunt.2500.desc:1 ""ข้าได้ยินเรื่องราวมากมายจาก [sighting_county.GetName]: ว่ากันว่ามีโอกาสดีเยี่ยมสำหรับการล่าสัตว์แถวนั้น โดยมี [sighting_county.Custom('GetAnimalType')] ที่คู่ควรหลายตัวถูกพบเห็นท่องไปใน [sighting_province.Custom('GetTerrainTypePlural')]!""
 hunt.2500.a:0 "น่าสนใจ..."
 hunt.2500.b:0 "อย่ามารบกวนข้าด้วยเรื่องนี้"
 hunt.2500.c: "ข้าต้องการนักล่าที่ดี"
 
 hunt.2510.t:0 "[sighting_county.Custom('GetAnimalType')|U] [sighting_county.Custom('GetLegendaryColor')|U] ในตำนาน"
 hunt.2510.opening_master:0 "[ROOT.Char.Custom('GetHuntMasterDesc')] ของข้า [sighting_character.GetTitledFirstName] เข้ามาในห้องของข้าด้วยความตื่นเต้นอย่างเปี่ยมล้น\n\n"
 hunt.2510.opening_hunter:0 "[ROOT.Char.Custom2('RelationToMe', sighting_character)] [sighting_character.GetTitledFirstName] ของข้า ซึ่งเป็นที่รู้จักในด้านความสนใจ [sighting_character.GetHerHis] ในการล่าสัตว์ เข้ามาในห้องของข้าด้วยความตื่นเต้น\n\n"
 hunt.2510.opening:0 "[ROOT.Char.Custom2('RelationToMe', sighting_character)] ของข้า [sighting_character.GetTitledFirstName] เข้ามาในห้องของข้าด้วยความตื่นเต้นอย่างเปี่ยมล้น\n\n"
 hunt.2510.desc:0 ""ข้าได้ยินเรื่องแปลกๆ จากผู้ดูแลป่าล่าสัตว์แห่ง [sighting_county.GetNameNoTier]: พวกเขาเล่าถึงการเห็นแวบๆ ของ [sighting_county.Custom('GetAnimalType')] ที่มี"
 hunt.2510.desc.knight_errant: ""ข้าได้ยินเรื่องแปลกๆ จากผู้ดูแลป่าล่าสัตว์แห่ง [sighting_county.GetName]: พวกเขาเล่าถึงการเห็นแวบๆ ของ [sighting_county.Custom('GetAnimalType')] ที่มี"
 hunt.2510.story:0 ""ผู้ดูแลป่าล่าสัตว์แห่ง [sighting_county.GetNameNoTier] ส่งรายงานที่น่าเชื่อถือ: ดูเหมือนว่า [sighting_county.Custom('GetAnimalType')] ของท่านถูกพบเห็นที่นั่น สัตว์ร้ายที่มี"
 hunt.2510.black:0 "ขนสีดำสนิท""
 hunt.2510.white:0 "ขนสีขาวราวหิมะ""
 hunt.2510.closing:0 "\n\n"ว่ากันว่ามันท่องไปใน [sighting_province.Custom('GetTerrainTypePlural')] แม้ว่าจะไม่มีใครเข้าใกล้มันได้ มีตำนานเกี่ยวกับสัตว์ร้าย เช่นนี้อยู่จริง...""
 hunt.2510.knight_errant_closing: "\n\n"มีเพียง $knight_culture_player_no_tooltip$ ผู้เลื่องชื่อ เช่นท่านเท่านั้นที่จะปราบมันได้ [ROOT.Char.Custom('FormOfAddressForLiege')]""
 hunt.2510.a:0 "#EMP [sighting_county.Custom('GetLegendaryColor')|U]#! ท่านว่าอย่างนั้นหรือ?"
 hunt.2510.a.existing:0 "ข้า #EMP จะ#! พบมันให้ได้ สักวันหนึ่ง!"
 hunt.2510.b:0 "อย่ามารบกวนข้าด้วยเรื่องเพ้อฝันไร้สาระเหล่านี้"
 hunt.2510.c: "นำค่ายไปตั้งที่ [sighting_county.GetNameNoTierNoTooltip] — โดยทันที"

 hunt.2520.t:0 "[sighting_province.GetTitle.GetDeJureLiege.Custom('GetAnimalType')|U] ที่ [sighting_province.GetTitle.GetDeJureLiege.Custom('GetAnimalAdjective')|U] แห่ง [sighting_county.GetNameNoTierNoTooltip]"
 hunt.2520.desc:1 ""ข้าได้ยินเรื่องราวมากมายจาก [sighting_county.GetNameNoTier]: ว่ากันว่า [sighting_county.Custom('GetAnimalType')] ชั่วร้ายตัวหนึ่งได้สร้างความหวาดกลัวให้กับหมู่บ้านในท้องถิ่น ฉกฉวยปศุสัตว์ก่อนจะหายลับเข้าไปใน [sighting_province.Custom('GetTerrainTypePlural')]!""

 hunt.2530.t:0 "[sighting_province.GetTitle.GetDeJureLiege.Custom('GetAnimalPlural')|U] แห่ง [sighting_county.GetNameNoTierNoTooltip]"
 hunt.2530.opening_master:0 "นายพรานเหยี่ยวหลวงของข้า [sighting_character.GetTitledFirstName] เข้ามาในห้องของข้าด้วยความตื่นเต้นอย่างเปี่ยมล้น\n\n"
 hunt.2530.opening_falconer:0 "[ROOT.Char.Custom2('RelationToMe', sighting_character)] [sighting_character.GetTitledFirstName] ของข้า ซึ่งเป็นที่รู้จักในด้านความสนใจ [sighting_character.GetHerHis] ในการล่าเหยี่ยว เข้ามาในห้องของข้าด้วยความตื่นเต้น\n\n"
 hunt.2530.desc:0 ""ข้าได้ยินเรื่องราวมากมายจาก [sighting_county.GetNameNoTier]: ว่ากันว่ามีโอกาสดีเยี่ยมสำหรับการล่าสัตว์แถวนั้น โดยมี [sighting_county.Custom('GetAnimalType')] ที่คู่ควรหลายตัวถูกพบเห็นท่องไปใน [sighting_province.Custom('GetTerrainTypePlural')]!""

 hunt.2540.t:0 "จากที่นี่ไปยังที่นั่น"
 hunt.2540.desc:1 ""[ROOT.Char.Custom('FormOfAddressForLiege')|U] พรานหลวงของท่านรายงานว่า ฝูง [sighting_county.Custom('GetAnimalPlural')] อันอุดมสมบูรณ์แห่ง [old_sighting_county.GetBaseNameNoTier] ดูเหมือนจะย้ายออกจากพื้นที่เหล่านั้นและเข้าไปใน [sighting_county.GetName] แล้ว!""
 hunt.2540.legendary:0 ""[ROOT.Char.Custom('FormOfAddressForLiege')|U] พรานหลวงของท่านรายงานว่า [sighting_county.Custom('GetAnimalType')] [sighting_county.Custom('GetLegendaryColor')] แห่ง [old_sighting_county.GetBaseNameNoTier] หายตัวไปชั่วขณะ ก่อนจะถูกพบเห็นใน [sighting_county.GetBaseNameNoTier] ที่อยู่ใกล้เคียง!""
 hunt.2540.closing:1 "\n\n"บางทีท่านควรจะจัดการล่าสัตว์ก่อนที่มันจะสายเกินไป""
 hunt.2540.white:0 "พวกเขาบอกว่ามันส่องสว่างดุจแสงทิพย์ในหมอกยามเช้า...""
 hunt.2540.black:0 "พวกเขาบอกว่ามันปรากฏตัวราวกับผู้แจ้งข่าวแห่งยามเย็น หลุมดำในทิวทัศน์...""
 hunt.2540.a:0 "พวกมันวิ่งหนีได้ แต่ซ่อนตัวไม่ได้"
 hunt.2540.a.legendary:0 "มันพยายาม ทำให้ข้าสับสน!"
 hunt.2540.b:0 "ข้าเบื่อหน่ายกับข่าวสารเหล่านี้แล้ว [sighting_character.GetFirstNameNoTooltip]..."

 hunt.3020.t:1 "สัตว์เจ้าเล่ห์"
 hunt.3020.t.deer:0 "ไม่รู้เลย"
 hunt.3020.opening:0 "เช่นเดียวกับสัตว์ป่าทุกชนิด [activity.Custom('GetAnimalType')] ที่หลบหลีกเก่งมีเล่ห์เหลี่ยม การหลบหลีก และกลอุบายมากมายที่สามารถหลอกลวงได้แม้กระทั่งนักล่าผู้มีประสบการณ์\n\n"
 hunt.3020.doubling:0 "[activity.Custom('GetAnimalType')] เจ้าเล่ห์ได้วิ่งย้อนกลับไปมา ย้อนรอยเท้าและวิ่งตามเส้นทางเพื่อสลัดการตามรอยของเรา"
 hunt.3020.beating:1 "[activity.Custom('GetAnimalMale')] ได้วิ่งทวนน้ำและตามน้ำในลำธารเล็กๆ ของ [host.GetCurrentLocation.Custom('GetTerrainType')] พยายามที่จะสลัดกลิ่นของมัน"
 hunt.3020.squatting:0 "[activity.Custom('GetAnimalMale')] ได้ยืนนิ่งสนิทอยู่ใน [host.GetCurrentLocation.Custom('GetProvinceFoliageDesc')] อย่างไม่สะทกสะท้าน เคลื่อนที่ไปอยู่ข้างหลังเรา แม้จะอยู่ใต้จมูกของสุนัข"
 hunt.3020.rusing:0 "[activity.Custom('GetAnimalMale')] ได้ใช้กลอุบายสลับกันไป วิ่งไปๆ มาๆ ในรูปแบบที่บ้าคลั่งเพื่อ ทำให้กลิ่นสับสนและขัดขวางความพยายามที่จะตามรอย"
 hunt.3020.desc_courtier:0 "[ROOT.Char.Custom2('RelationToMe', hunt_participant)] ของข้า [hunt_participant.GetTitledFirstName] ได้สั่งให้คณะหยุด:"
 hunt.3020.desc_fallback:0 "[ROOT.Char.Custom('GetGameKeepers')] ของข้าได้หยุดอยู่ข้างหน้า:"
 hunt.3020.desc:1 "ร่องรอยเริ่มสับสน: [activity.Custom('GetAnimalType')] เจ้าเล่ห์ได้วิ่งย้อนกลับไปมา ย้อนรอยเท้าเพื่อสลัดการตามรอยของเรา"
 hunt.3020.closing:0 "\n\nไม่มีความเห็นพ้องต้องกันว่าจะตามเส้นทางใด และทุกขณะที่เราโอ้เอ้ก็ยิ่ง ทำให้เราห่างไกลจากรางวัลของเรามากขึ้น"
 hunt.3020.a:0 "อดทนไว้ เรื่องนี้น่าจะแก้ไขได้ง่าย"
 hunt.3020.a.perfect:0 "ท่านพบกลิ่นได้อย่างรวดเร็ว"
 hunt.3020.a.success:0 "ท่านพบกลิ่นในไม่ช้า"
 hunt.3020.a.failure:0 "ท่านคิดว่าท่านพบกลิ่น"
 hunt.3020.b:0 "อา ใช่ ข้าเคยได้ยินเกี่ยวกับกลอุบายนี้"
 hunt.3020.b.success:0 "คำแนะนำของท่านได้ผล"
 hunt.3020.b.failure:0 "คำแนะนำของท่านไร้ประโยชน์"
 hunt.3020.c:0 "ข้าเชื่อใจ [hunt_participant.GetFirstNameNoTooltip] ในเรื่องนี้"
 hunt.3020.c.perfect:0 "[hunt_participant.GetFirstNameNoTooltip] พบกลิ่นได้อย่างรวดเร็ว"
 hunt.3020.c.success:0 "[hunt_participant.GetFirstNameNoTooltip] พบกลิ่นในไม่ช้า"
 hunt.3020.c.failure:0 "[hunt_participant.GetFirstNameNoTooltip] นำเราหลงทาง"
 hunt.3020.d:0 "ถ้าข้าเป็นมัน ข้าคงจะไปทางนี้..."
 hunt.3020.e:0 "ทางนี้ ไม่! ทางนั้น!"
 hunt.3020.e.success:0 "ท่านไปถูกทาง"
 hunt.3020.e.failure:0 "ท่านไปผิดทาง"
 hunt.3020.f:0 "ผู้ดูแลป่าล่าสัตว์ในท้องถิ่นคิดว่าอย่างไร?"
 hunt.3020.f.flavor:0 "#EMP ปรึกษาผู้เชี่ยวชาญกันเถอะ...#!"
 hunt.4001.t:2 "การยิง"
 hunt.4001.opening:1 "มีบางอย่างที่สง่างามเกี่ยวกับวิธีที่ [activity.Custom('GetAnimalType')] จ้องมองข้ามทิวทัศน์ ซ่อนตัวอยู่ใน [host.GetCurrentLocation.Custom('GetProvinceFoliageDesc')] ข้ายกธนูขึ้น\n\n"
 hunt.4001.desc_1:1 "ข้าเหลือบมองไปที่ [ROOT.Char.Custom2('RelationToMe', hunt_participant)] ของข้า [hunt_participant.GetTitledFirstName] อย่างเงียบๆ ซึ่งหมอบอยู่บน [host.GetCurrentLocation.Custom('GetProvinceGroundDesc')] ซึ่งก็ทำ เช่นเดียวกัน"
 hunt.4001.desc_2:2 "ประเมินระยะทางไปยัง [activity.Custom('GetAnimalType')] อย่างระมัดระวัง โดยมีหอกซัดของข้าสมดุลอย่างสมบูรณ์แบบในมือ...\n\n[ROOT.Char.Custom2('RelationToMe', hunt_participant)] ของข้า [hunt_participant.GetTitledFirstName] กำลังหมอบอยู่ข้างๆ ข้า ยกหอกของ [hunt_participant.GetHerHis] ขึ้น"
 hunt.4001.desc_3:0 "หายใจ... เล็ง..."
 hunt.4001.a:1 "#EMP ไม่! มันเป็นของข้า!#!"
 hunt.4001.a.kill:1 "ท่านล้ม [activity.Custom('GetAnimalType')] ลงได้"
 hunt.4001.a.stolen:1 "[hunt_participant.GetFirstNameNoTooltip] ล้ม [activity.Custom('GetAnimalType')] ลงได้"
 hunt.4001.a.both:1 "ท่าน ทำให้ [activity.Custom('GetAnimalType')] ตกใจหนีไป"
 hunt.4001.b:1 "ยิงให้เข้าเป้า [hunt_participant.GetFirstNameNoTooltip]"
 hunt.4001.c:2 "ตอนนี้เลย [hunt_participant.GetFirstNameNoTooltip] ก่อนที่ [activity.Custom('GetAnimalType')] จะเห็นเรา!"
 hunt.4001.c.tt:3 "หากข้าเหยียบกิ่งไม้นี้ [activity.Custom('GetAnimalType')] จะต้องตกใจอย่างแน่นอน..."
 hunt.4001.d:0 "ดูนี่นะ"

 hunt.4002.t:2 "ข่าวลือ"
 hunt.4002.desc:3 "เสียงของคนอื่นๆ จางหายไปขณะที่ [ROOT.Char.Custom2('RelationToMe', secret_sharer)] ของข้า [secret_sharer.GetTitledFirstName] และข้าย่องเข้าใกล้ [activity.Custom('GetAnimalType')]\n\nเราเกือบจะอยู่ในระยะโจมตีแล้วเมื่อ [secret_sharer.GetFirstNameNoTooltip] กระซิบ: "ตอนนี้เราอยู่ตามลำพังในที่สุด มีบางอย่างที่ข้าต้องบอกท่าน — เกี่ยวกับ [secret_owner.GetTitledFirstName]...""
 hunt.4002.a:1 "ค่อยคุยกันทีหลัง [ROOT.Char.Custom2('RelationToMe', secret_sharer)]!"
 hunt.4002.a.flavor:1 "[activity.Custom('GetAnimalType')] ตัวนั้นเป็นของข้า!"
 hunt.4002.b:1 "อะไรนะ? บอกข้ามา..."
 hunt.4002.b.tt:3 "[activity.Custom('GetAnimalType')] หนีไป"
 hunt.4002.b.reveal:0 "ข้าได้เรียนรู้ความลับของ [secret_owner.GetFirstNamePossessiveNoTooltip]"

 hunt.4003.t:2 "เหยื่อผิดกฎหมาย"
 hunt.4003.desc:2 "พวกล่าสัตว์ผิดกฎหมาย ที่นี่ใน [host.GetCurrentLocation.Custom('GetTerrainType')] ของ [land_owner.GetTitleTierName]? พวกเขาจับกลุ่มกันขณะที่ข้าขี่ม้าเข้าไปพร้อมกับองครักษ์ พยายามซ่อน [host.Custom('GetRegionalDeerType')] ที่ตายแล้วไว้ข้างหลังอย่างไม่แนบเนียน\n\n"พวกเราไม่ได้ทำสิ่งนี้! ได้โปรด เมตตาด้วยเถิด [ROOT.Char.GetTitleAsNameNoTooltip] ผู้รุ่งโรจน์!" คมดาบและธนูของพวกเขาขัดแย้งกับคำพูด"
 hunt.4003.adventurer: "เข้าร่วมค่ายของข้า [land_owner.GetTitleTierName] จะไม่มีวันหาพวกเจ้าเจอ"
 hunt.4003.a:0 "พวกเขาจะถูกแขวนคอ และหมู่บ้านของพวกเขาจะต้องชดใช้"
 hunt.4003.b:0 ""พวกเจ้าทุกคนดูเหมือนจะเป็นนักยิงธนูที่ยอดเยี่ยม...""
 hunt.4003.c:0 "สัตว์เป็นของข้า พร้อมกับค่าปรับสำหรับชีวิตของพวกเขา"
 hunt.4003.c.tt_success:0 "เจ้าหน้าที่ฝ่ายปกครองท้องถิ่นยินยอม"
 hunt.4003.c.tt_failure:0 "ความโกรธแค้นของประชาชน"
 hunt.4003.d:0 ""ข้าจะสนใจสัตว์ป่าของ [land_owner.GetTitledFirstNamePossessiveNoTooltip] ไปทำไม?""
 hunt.4003.d.own:0 "ออกไปจาก [host.GetCurrentLocation.Custom('GetTerrainType')] ของข้า!"
 hunt.4003.d.vassal:0 "ออกไปจาก [host.GetCurrentLocation.Custom('GetTerrainType')] ของ [land_owner.GetTitledFirstNamePossessiveNoTooltip]!"
 hunt.4003.d.rival:0 "เอาไปให้มากเท่าที่เจ้าต้องการจาก [land_owner.GetTitledFirstNameNoTooltip]"
 hunt.4003.e:0 "ในที่สุด นักล่าที่ดี!"

 hunt.4004.t:2 "การโค่นล้มสัตว์ร้าย"
 hunt.4004.desc:2 "ท่านอาจคิดว่ามันเป็นสัตว์จากเทพนิยาย บางทีอาจเป็นเทพเจ้าปลอมตัวมาในร่างสัตว์ มันเป็น [activity.Custom('GetAnimalType')] ที่ใหญ่ที่สุดที่ข้าเคยเห็น\n\nแม้หลังจากที่สัตว์ร้ายบาดเจ็บ การไล่ล่าก็ยังคงดำเนินต่อไปครึ่งวัน\n\nมันยังคงเป็นภาพที่น่าเกรงขาม นอนตายอยู่เบื้องหน้าข้า"
 hunt.4004.credit_receiver:1 "[credit_taker.GetTitledFirstName] ก็ตกตะลึง เช่นกัน "ข้าไม่เคยเห็นสิ่งใด เช่นนี้มาก่อน [ROOT.Char.Custom('FormOfAddressForLiege')]""
 hunt.4004.a:0 "หัวของมันจะดูสวยงามในห้องโถงใหญ่ของข้า!"
 hunt.4004.b:1 "มันจะเป็นของรางวัลสำหรับ [ROOT.Char.Custom2('RelationToMeShort', trophy_recipient)] ของข้า"
 hunt.4004.c:0 "มันจะทำเป็นเสื้อคลุมที่งดงาม!"
 hunt.4004.c.tt:0 "ไม่ มัน #EMP ไม่#! ฉูดฉาด!"
 hunt.4004.every_arrogant_vassal:0 "ข้าหลวงผู้หยิ่งยโสทุกคน"
 hunt.4004.every_restrained_vassal:0 "ข้าหลวงที่ถูกควบคุมอย่างเข้มงวดทุกคน"
 hunt.4004.every_other_vassal:0 "ข้าหลวงที่ไม่หยิ่งยโสและไม่ถูกควบคุม"
 hunt.4004.d:1 "ข้าคิดว่า [credit_taker.GetTitledFirstNameNoTooltip] สมควรได้รับความดีความชอบสำหรับสิ่งนี้"
 hunt.4004.e:0 "เรากินมันที่นี่และเดี๋ยวนี้!"
 hunt.4004.f:0 "กะโหลกของมันจะทำเป็นมงกุฎชั้นดี"

 hunt.4005.t:2 "การโค่นล้มสัตว์ร้าย"
 hunt.4005.a:0 "ตัวนี้จะขายได้ราคาดี"
 hunt.4005.b:1 "ข้าจะให้ทำของรางวัลที่สวยงามสำหรับ [ROOT.Char.Custom2('RelationToMeShort', trophy_recipient)] ของข้า"
 hunt.4005.c:0 "มันจะถูกสตัฟฟ์และส่งไปยัง [ROOT.Char.GetFaith.ReligiousHeadName]!"

 hunt.4006.t:2 "คนหาของป่า"
 hunt.4006.desc:2 "[host.GetCurrentLocation.Custom('GetTerrainTree')] เป็น 'สิ่งหล่อเลี้ยงคนจน' อย่างแท้จริง แต่ขณะที่ [activity.Custom('GetAnimalType')] หนีด้วยความตื่นตระหนกจากชาวบ้านที่หาของป่า ข้ารู้สึกว่าความอดทนของข้าเริ่มหมดลง\n\nแน่นอนว่าต้องมีสิ่งที่ดีกว่าให้ทำใน [host.GetCurrentLocation.GetNameNoTooltip] วันนี้ มากกว่าการเก็บรากไม้และเห็ด!"
 hunt.4006.adventurer: "เก็บรากไม้และเห็ด... นั่นเป็นความคิดที่ดี"
 hunt.4006.a:1 "ขับไล่ฝูงชนชั้นต่ำนี้ออกจากพื้นที่ล่าสัตว์ #EMP ของข้า#! "
 hunt.4006.b:0 "เรามาที่นี่เพื่อล่าสัตว์ มิใช่หรือ?"
 hunt.4006.special_interest:0 "เนื่องจากความสนใจที่ไม่ธรรมดาของ [county_owner.GetHerHis]:"
 hunt.4006.c:0 "โอ้ เหยื่อนี้ใช้ได้ทีเดียว..."
 hunt.4006.d:0 "การบริจาคอย่างใจกว้างน่าจะ ทำให้พวกเขาอยู่ห่างๆ ได้นานพอ"
 hunt.4006.e:0 "นี่ #EMP เป็น#! สิทธิดั้งเดิมของพวกเขา ข้าเดาว่า..."

 hunt.4007.t:3 "[host.Custom('GetAnimalType')|U] ที่กำลังอาละวาด"
 hunt.4007.desc_befriend:0 "ลมอ่อนๆ กำลังพัด และ [ROOT.Char.Custom2('RelationToMeShort', similar_participant)] ของข้า [similar_participant.GetTitledFirstName] และข้ากำลังสัปหงกอยู่ในดงไม้ที่เงียบสงบเมื่อเราได้ยินมัน"
 hunt.4007.desc_lazy:1 "ลมอ่อนๆ กำลังพัด และ [ROOT.Char.Custom2('RelationToMeShort', similar_participant)] ของข้า [similar_participant.GetTitledFirstName] และข้ากำลังสัปหงกอยู่ในดงไม้ที่เงียบสงบเมื่อเราได้ยินมัน"
 hunt.4007.desc_lustful:1 "[ROOT.Char.Custom2('RelationToMeShort', similar_participant)] ของข้า [similar_participant.GetTitledFirstName] ดูโดดเด่นในชุดล่าสัตว์ของ [similar_participant.GetHerHis] และข้าสาปแช่งสิ่งที่มารบกวน ซึ่งดึงความสนใจของข้าไปจาก [similar_participant.GetHerHim]"
 hunt.4007.desc_fallback:1 "ขณะที่ [ROOT.Char.Custom2('RelationToMeShort', similar_participant)] ของข้า [similar_participant.GetTitledFirstName] และข้าขึ้นไปถึงยอดเนิน เราได้ยินมัน"
 hunt.4007.desc_ending:2 "\n\nเสียงกิ่งไม้หัก เสียงใบไม้เสียดสี และเสียงนกร้องด้วยความตกใจประกาศการมาถึงของ [host.Custom('GetAnimalType')|l] ที่โกรธจัด และมันกำลังมุ่งตรงมาทางเรา!\n\n[similar_participant.GetSheHe|U] อุทาน: "ดูขนาดของ #EMP [host.Custom('GetAnimalDanger')]#!! นั่นสิ!""
 hunt.4007.a:0 "เส้นทางของมันสิ้นสุดที่นี่ กับข้า"
 hunt.4007.a.non_martial:0 "เร็วเข้า! มาหลบข้างหลังข้า [similar_participant.GetFirstNameNoTooltip]!"
 hunt.4007.a.non_martial_self:0 "เอามีดของเจ้ามา! ข้าจะทำเอง!"
 hunt.4007.a.success:0 "ข้าสังหารสัตว์ร้าย"
 hunt.4007.a.failure:0 "ข้าได้รับบาดเจ็บ"
 hunt.4007.a.critical_failure:0 "ข้าถูกสังหาร"
 hunt.4007.b:1 "[similar_participant.GetFirstNameNoTooltip] ทำอะไรสักอย่างสิ!"
 hunt.4007.b.non_martial:0 "ช่วยด้วย! ใครก็ได้!"
 hunt.4007.b.success:0 "[THIS.Char.GetTitledFirstNameNoTooltip] สังหารสัตว์ร้าย"
 hunt.4007.b.failure:0 "[THIS.Char.GetTitledFirstNameNoTooltip] ได้รับบาดเจ็บ"
 hunt.4007.b.critical_failure:0 "[THIS.Char.GetTitledFirstNameNoTooltip] ถูกสังหาร"
 hunt.4007.c:0 "รับมือไม่ยากไปกว่าข้าราชสำนักที่ถูกทอดทิ้ง!"
 hunt.4007.d:0 "[bodyguard.GetFirstNameNoTooltip]! มาหาข้า!"
 hunt.4007.e:0 "#EMP ไปให้พ้น เจ้าสัตว์ร้ายน่ารังเกียจ!#!"
 hunt.4007.f:0 "#EMP หนีไป!#!"
 
 hunt.4900.t:1 "[activity.Custom('GetAnimalTypeKill')|U] ที่กำลังอาละวาด"
 hunt.4900.desc:1 "สัตว์ร้ายตัวใหญ่หยุดลงก่อนจะถึงตัวเรา [activity.Custom('GetAnimalSoundParticipleKill')] และ [activity.Custom('GetAnimalStrikeParticipleKill')] อย่างบ้าคลั่ง"
 hunt.4900.hunter:1 "\n\nข้าชักมีดออกจากเข็มขัดและเอาตัวเองเข้าขวางระหว่าง [activity.Custom('GetAnimalTypeKill')] กับ [similar_participant.GetFirstName] ก่อนที่สัตว์จะ [activity.Custom('GetAnimalChargePresentKill')] ไปข้างหน้าอย่างกะทันหัน\n\nคมมีดของข้าแทงเข้าหัวใจของมัน"
 hunt.4900.hunter_wound:1 "แต่ไม่ใช่ก่อนที่ข้าจะถูกกระแทกจนล้ม หลบ [activity.Custom('GetAnimalDangerKill')] ของมันได้อย่างหวุดหวิด..."
 hunt.4900.hunter_dead:1 "แต่ เมื่อมองลงไป [activity.Custom('GetAnimalDangerKill')] ของมันได้แทงเข้าที่ข้า\n\nแสงสว่างริบหรี่ลงขณะที่ข้านอนอยู่ในกองขนสัตว์ เนื้ออุ่นๆ และเลือดที่พันกันยุ่งเหยิง โดยมี [similar_participant.GetFirstNameNoTooltip] เรียกชื่อข้า..."
 hunt.4900.hunter_kill:1 "[activity.Custom('GetAnimalDangerKill')] ของมันเฉี่ยวข้าไปอย่างหวุดหวิด และมันก็ล้มลงกับพื้นเป็นกอง..."
 hunt.4900.assist:1 "\n\n[similar_participant.GetFirstName] ชักมีดของ [similar_participant.GetHerHis] ออกจากเข็มขัดของ [similar_participant.GetHerHis] กระโจนเข้าปฏิบัติการระหว่างข้ากับ [activity.Custom('GetAnimalTypeKill')] เขาร้อง "ถอยไป [ROOT.Char.GetTitleAsNameNoTooltip]!" ขณะที่สัตว์ [activity.Custom('GetAnimalChargePresentKill')] ไปข้างหน้าอย่างกะทันหัน\n\nเวลาดูเหมือนจะหยุดนิ่งขณะที่ [similar_participant.GetSheHe] สกัดกั้นภาพเบลอของ [activity.Custom('GetAnimalFeatureKill')]\n\nเมื่อฝุ่นจางลง [activity.Custom('GetAnimalTypeKill')] ก็นอนตาย"
 hunt.4900.assist_wound:0 "แต่ [similar_participant.GetFirstNameNoTooltip] บาดเจ็บอย่างเห็นได้ชัด..."
 hunt.4900.assist_dead:0 "แต่ [similar_participant.GetFirstNameNoTooltip] ก็ เช่นกัน..."
 hunt.4900.assist_kill:0 "และ [similar_participant.GetFirstNameNoTooltip] ยืนคร่อมมันอย่างพึงพอใจ เช็ดคมมีดของ [similar_participant.GetHerHis]..."
 hunt.4900.befriend:2 "\n\nข้ายื่นมือออกไปอย่างใจเย็น [activity.Custom('GetAnimalTypeKill')] ผ่อนคลายลง สับสน ก่อนจะหยุดลงอย่างลังเลห่างออกไปเล็กน้อย ดมกลิ่นนิ้วมือของข้าอย่างสงสัย"
 hunt.4900.befriend_success:1 "\n\nดูเหมือนจะพอใจ มันหาวกว้าง ก่อนจะนอนลงแทบเท้าข้า ราวกับจะหลับ"
 hunt.4900.befriend_wound:1 "\n\nโดยไม่มีการเตือน มันพุ่งไปข้างหน้าอีกครั้ง ชนข้าล้มลงกับพื้นอย่างแรง ก่อนจะวิ่งหนีลับสายตาไป"
 hunt.4900.befriend_dead:1 "\n\nสัตว์ร้ายเกร็งตัวขึ้นทันใด ดูเหมือนจะทำหน้าบิดเบี้ยว ข้ายืนแข็งทื่อ หลับตาขณะที่สัตว์ร้ายพุ่งไปข้างหน้า [activity.Custom('GetAnimalSoundParticipleKill')] อย่างน่าสะพรึงกลัว"
 hunt.4900.bodyguard:1 "\n\nองครักษ์ของข้า [bodyguard.GetFirstName] พุ่งเข้าปฏิบัติการ ชักดาบออกมาขณะที่ [bodyguard.GetSheHe] กวักมือเรียกข้าไปอยู่ด้านหลัง [bodyguard.GetHerHim] ด้วยแขนอีกข้างของ [bodyguard.GetHerHis] "ถอยไป [ROOT.Char.Custom('FormOfAddressForLiege')]!\n\nสัตว์ร้ายพุ่งเข้ามา"
 hunt.4900.bodyguard_wound:1 "และข้าแทบจะทนดูไม่ได้ขณะที่ [bodyguard.GetSheHe] ถูกสัตว์ร้ายทำร้าย แม้ว่า [bodyguard.GetFirstNameNoTooltip] จะล้มมันลงได้ในกระบวนการนั้น..."
 hunt.4900.bodyguard_dead:1 "และข้าแทบจะทนดูไม่ได้ขณะที่ [bodyguard.GetSheHe] ถูกเหวี่ยงทิ้งเหมือนตุ๊กตาผ้า แม้ว่าจะ ทำให้สัตว์ร้ายบาดเจ็บก็ตาม สัตว์ร้ายที่บาดเจ็บหนีลับสายตาไปขณะที่ [bodyguard.GetFirstNameNoTooltip] ทรุดลงบน [host.GetCurrentLocation.Custom('GetProvinceGroundDesc')]!"
 hunt.4900.bodyguard_saved:0 "และข้าแทบจะทนดูไม่ได้ขณะที่มันถูกแทงทะลุร่างด้วยคมดาบที่ [bodyguard.GetFirstNamePossessiveNoTooltip] กวัดแกว่งอย่างชำนาญ!"
 hunt.4900.scare:1 "\n\nมันเปลี่ยนใจอย่างรวดเร็ว ถอยห่างออกไปขณะที่ข้าค่อยๆ เดินไปข้างหน้า โบกไม้โบกมือและตะโกนด่าทอ ในที่สุดมันก็หันหลังหนีและหายลับสายตาไป"
 hunt.4900.flee:1 "\n\nข้าหันหลังและวิ่งให้เร็วที่สุดเท่าที่จะทำได้ เสียงหอบแหบๆ ของ [similar_participant.GetFirstNamePossessive] ที่หอบหายใจอย่างตื่นตระหนกอยู่ข้างหลังข้า\n\nในไม่ช้าเราก็ไปถึงคนอื่นๆ ที่ ซึ่งเราเค้นคำพูดออกมา "#EMP [ROOT.Char.Custom('GetAnimalType')]#!" และ "#EMP [ROOT.Char.Custom('GetAnimalDanger')]#!" ระหว่างช่วงที่หอบหายใจ สัตว์ร้ายมองไม่เห็นเลย"
 hunt.4900.a.hunter:1 "#EMP นั่น#! คือวิธีสังหาร [ROOT.Char.Custom('GetAnimalType')]"
 hunt.4900.a.dead:0 "#EMP [portrait.GetFirstNameNoTooltip]...#! เจ้าตายอย่างกล้าหาญ..."
 hunt.4900.a.scare:0 "และอย่ากลับมาอีก!"
 hunt.4900.a.flee:0 "ท่านไม่ได้ #EMP อยู่ที่นั่น#!! มัน #EMP ใหญ่โตมโหฬาร#!!"
 hunt.4900.b:0 "ข้าจะเก็บของบางอย่างไว้เป็นที่ระลึกถึงสิ่งนี้"
 hunt.4900.c:0 "#weak ไอ้สารเลว... เจ้าเล่ห์...#!"
 hunt.4900.d:0 "พอแล้ว เราจะกลับบ้าน!"

 hunt.4008.t:2 "ทายาทผู้พลั้งพลาด"
 hunt.4008.t_2:0 "ความผิดพลาดโดยสุจริต"
 hunt.4008.desc:2 "[ROOT.Char.Custom2('RelationToMeShort', hunt_participant)] ของข้า [hunt_participant.GetTitledFirstName] นำหน้ากลุ่มไป ไล่ตาม [activity.Custom('GetAnimalType')] เพียงลำพัง เมื่อข้าตามทัน ข้าพบ [hunt_participant.GetHerHim] ยืนคร่อม [peasant.GetWomanMan] คนหนึ่ง ดึงลูกธนูออกจากอกของชาวบ้านผู้น่าสงสาร\n\n[hunt_participant.GetSheHe|U] ซ่อนลูกธนูไว้ข้างหลัง [hunt_participant.GetHerHis] เมื่อ [hunt_participant.GetSheHe] เห็นข้า "[ROOT.Char.GetTitleAsNameNoTooltip]! ข้า... มัน..."
 hunt.4008.animal:1 "ท- [activity.Custom('GetAnimalMale')] ทำ! ข้าสาบาน!"\n\n"
 hunt.4008.fallback:0 "ม-มันไม่ใช่ความผิดของข้า! ข้าสาบาน!"\n\n"
 hunt.4008.closing:0 "ในไม่ช้าคณะที่เหลือจะตามมาทันและเรียกร้องคำอธิบาย"
 hunt.4008.a:1 "[hunt_participant.GetSheHe|U] ต่อสู้อย่างกล้าหาญเพื่อช่วย [peasant.GetHerHim] ข้าเห็น!"
 hunt.4008.a.success:0 "ทุกคนเชื่อข้า"
 hunt.4008.a.failure:0 "ผู้คนไม่เชื่อคำโกหก"
 hunt.4008.b:2 "เร็วเข้า ช่วยข้าซ่อนศพ!"
 hunt.4008.b.failure_tt:1 "[secret.GetName] [secret|E] ของ [hunt_participant.GetTitledFirstNamePossessive] ถูกเปิดโปง"
 hunt.4008.b.success:0 "เราจัดการซ่อนศพได้"
 hunt.4008.b.failure:0 "ศพถูกพบ"
 hunt.4008.b.success_tt:0 "ศพยังคงถูกซ่อนอยู่"
 hunt.4008.c:2 "เจ้า #EMP ต้อง#! รับผิดชอบต่อสิ่งนี้ [hunt_participant.GetFirstNameNoTooltip]!"
 hunt.4008.c.flavor:0 "แม้ว่าจะเป็นเพียงชาวบ้าน..."
 hunt.4008.d:1 "แย่หน่อยที่ 'สัตว์ร้าย' เล่นงาน #EMP เจ้า#! ด้วย..."

 hunt.4009.t:2 "ถูกล่า"
 hunt.4009.desc:2 "#EMP เปรี้ยง—!#!\nขณะที่ [activity.Custom('GetAnimalType')] [activity.Custom('GetAnimalAdjective')] ที่ข้ากำลังเข้าใกล้หายลับเข้าไปใน [host.GetCurrentLocation.Custom('GetTerrainType')] ข้าก็หันไปยังต้นตอของเสียง\n\n[schemer.GetTitledFirstName] [ROOT.Char.Custom2('RelationToMeShort', schemer)] ของข้า กำลังยืนอยู่เบื้องหลังข้าพร้อมกับกริชในมือและแววตาอันมุ่งร้ายหมายชีวิตของ [schemer.GetHerHis]"
 hunt.4009.a:0 "เจ้าไม่มีทางสู้ข้าได้!"
 hunt.4009.a.success:0 "ข้าหนีรอดจาก [schemer.GetTitledFirstNameNoTooltip]"
 hunt.4009.a.failure:0 "ข้าบาดเจ็บ แต่หนีรอดจาก [schemer.GetTitledFirstNameNoTooltip]"
 hunt.4009.a.critical_failure:0 "[schemer.GetTitledFirstNameNoTooltip] เอาชนะข้าได้"
 hunt.4009.b:0 "ช่วยด้วย! ช่วยด้วย! [saving_participant.GetFirstNameNoTooltip]!"
 hunt.4009.b.critical_success:0 "[saving_participant.GetTitledFirstNameNoTooltip] ทำให้ [schemer.GetTitledFirstNameNoTooltip] บาดเจ็บและพวกเราหนีรอดไปได้"
 hunt.4009.b.failure:1 "[saving_participant.GetTitledFirstNameNoTooltip] บาดเจ็บ แต่พวกเราหนีรอดจาก [schemer.GetTitledFirstNameNoTooltip]"
 hunt.4009.b.critial_failure:0 "[saving_participant.GetTitledFirstNameNoTooltip] มิอาจปกป้องข้าได้"
 hunt.4009.c:0 "หากข้าเพียงกลับไปถึงค่ายได้!"
 hunt.4009.c.failure:0 "[schemer.GetTitledFirstNameNoTooltip] จับข้าได้"

 hunt.4010.desc:2 "#EMP เปรี้ยง—!#!\nขณะที่ [activity.Custom('GetAnimalType')] [activity.Custom('GetAnimalAdjective')] ที่ [ROOT.Char.Custom2('RelationToMeShort', targeted_participant)] ของข้าและข้ากำลังเข้าใกล้หายลับเข้าไปใน [host.GetCurrentLocation.Custom('GetTerrainType')] พวกเราก็หันไปยังต้นตอของเสียง\n\n[schemer.GetTitledFirstName] [ROOT.Char.Custom2('RelationToMe', schemer)] ของข้า กำลังยืนอยู่เบื้องหลังพวกเราพร้อมกับกริชในมือของ [schemer.GetHerHis] จ่อไปยัง [targeted_participant.GetFirstName]"
 hunt.4010.a:1 "อย่าได้กลัวไปเลย [ROOT.Char.Custom2('RelationToMeShort', targeted_participant)] ของข้า!"
 hunt.4010.a.critical_success:1 "ข้า ทำให้ [schemer.GetFirstNameNoTooltip] บาดเจ็บและขับไล่ [schemer.GetHerHim] ไปได้"
 hunt.4010.a.failure:1 "[schemer.GetFirstNameNoTooltip] ทำให้ข้าบาดเจ็บ แต่เราทั้งคู่หนีรอดไปได้"
 hunt.4010.a.critical_failure:0 "ข้ามิอาจปกป้อง [targeted_participant.GetFirstNameNoTooltip] ได้"
 hunt.4010.b:0 "ขอให้โชคดี [targeted_participant.GetFirstNameNoTooltip]"
 hunt.4010.b.critical_success:1 "[targeted_participant.GetFirstNameNoTooltip] ทำให้ [schemer.GetFirstNameNoTooltip] บาดเจ็บและขับไล่ [schemer.GetHerHim] ไปได้"
 hunt.4010.b.failure:1 "[targeted_participant.GetFirstNameNoTooltip] บาดเจ็บ แต่หนีรอดไปได้"
 hunt.4010.b.critical_failure:1 "[schemer.GetFirstNameNoTooltip] เอาชนะ [targeted_participant.GetFirstNameNoTooltip] และกำจัดพยานทุกคน"
 hunt.4010.failure.murder_secret_tooltip:0 "ข้าได้ล่วงรู้ความลับการฆาตกรรม"
 hunt.4010.c:1 "ช่วยด้วย! [schemer.GetFirstNameNoTooltip] กำลังทำร้าย [ROOT.Char.Custom2('RelationToMeShort', targeted_participant)] ของข้า!"
 hunt.4010.d:0 "#EMP ไม่นะ—!#!"
 hunt.4010.d.tt:1 "ตัวเลือกนี้มีให้ เนื่องจากท่านเป็นผู้มีเกียรติ"
 hunt.4010.d.flavor:0 "#EMP เอาข้าไปแทนสิ!#!"

 hunt.4011.t:2 "ช่วงเวลาตามลำพัง"
 hunt.4011.desc:3 ""[ROOT.Char.Custom('FormOfAddressForLiege')|U] [activity.Custom('GetAnimalType')] อยู่นั่น!" [ROOT.Char.Custom2('RelationToMe', lover_participant)] ของข้า [lover_participant.GetTitledFirstName] ส่งสัญญาณให้ข้าตาม [lover_participant.GetHerHim] เข้าไปใน [ROOT.Char.GetCurrentLocation.Custom('GetProvinceFoliageDesc')] เมื่อเราซ่อนตัวอยู่ใน [host.GetCurrentLocation.Custom('GetTerrainType')] [lover_participant.GetSheHe] ก็หันมาและดึง [ROOT.Char.Custom('GetUpperClothingArticle')] ของข้าข้ามศีรษะ\n\n"ในที่สุดก็ได้อยู่กันตามลำพังเสียที [ROOT.Char.Custom('LoverPetName')] ของข้า!""
 hunt.4011.a:0 "โอ้ [lover_participant.GetFirstNameNoTooltip]!"
 hunt.4011.a.tt:0 "มาทำอย่างที่พวกเขาทำกันใน เบสเทียรัม โวคาบูลัม กันเถอะ!"
 hunt.4011.b:2 "แต่ แล้วเรื่อง [activity.Custom('GetAnimalType')] ล่ะ...?"

 hunt.4012.t:3 "[host.Custom('GetAnimalType')|U] [host.Custom('GetLegendaryColor')|U] ในตำนาน"
 hunt.4012.desc:4 "ข้ากำลังขี่ม้านำหน้ากลุ่มไปเมื่อ [host.GetCurrentLocation.Custom('GetTerrainType')] พลันเงียบสงัดลง\n\nความเงียบนั้นแทบจะจับต้องได้ แม้ แต่เสียงกีบม้าของข้าก็ดูเหมือนจะเลือนหายไป\n\nทันทีที่ข้ากำลังจะหันหลังกลับไปหาคนอื่นๆ ข้าก็เหลือบเห็นมันอยู่ข้างหน้า เลือนรางดุจความฝัน — [host.Custom('GetAnimalType')|l]"
 hunt.4012.black:1 "ดำสนิทดุจถ่านหิน"
 hunt.4012.white:1 "ขาวบริสุทธิ์ดุจหิมะ"
 hunt.4012.a:1 "ราวกับหลุดมาจากนิทาน..."
 hunt.4012.a.tt:3 "#EMP ข้าต้องได้ [host.Custom('GetAnimalType')] ตัวนั้นมา!#!"
 hunt.4012.a.sighting:0 "ข่าวลือ #EMP เป็น#! จริง...!"
 hunt.4012.b:2 "มันก็แค่ [host.Custom('GetAnimalType')] ตัวหนึ่ง"

 hunt.4013.desc:1 "ข้าตามรอยเท้าของสัตว์ร้ายเข้าไปใน [host.GetCurrentLocation.Custom('GetTerrainTypePlural')] ราวกับตกอยู่ในภวังค์ ความเงียบสงัดอันผิดธรรมชาติปกคลุมไปทั่วโลก\n\n"[ROOT.Char.GetTitleAsNameNoTooltip]! อยู่นี่เอง!" เสียงตะโกนกะทันหัน ทำให้ข้าสะดุ้ง\n\n"
 hunt.4013.guest:0 "[host.GetTitledFirstName] ตามรอยเท้าของสัตว์ร้ายเข้าไปใน [host.GetCurrentLocation.Custom('GetTerrainTypePlural')] ราวกับตกอยู่ในภวังค์ ความเงียบสงัดอันผิดธรรมชาติปกคลุมไปทั่วโลก\n\n"[ROOT.Char.GetTitleAsNameNoTooltip]! อยู่นี่เอง!" เสียงตะโกนกะทันหัน ทำให้ [host.GetHerHim] สะดุ้ง\n\n"
 hunt.4013.participant:0 "[hunt_participant.GetFirstName] และคนอื่นๆ ในคณะของข้าตามมาทัน "
 hunt.4013.closing:1 "เมื่อข้ามองกลับไป [activity.Custom('GetAnimalType')|l] ตัวนั้นก็หายไปแล้ว"
 hunt.4013.a:1 "มันหนีไปได้ #EMP คราวนี้#!."
 hunt.4013.a.tt:1 "ท่านจะได้รับ [stress|E] ใน แต่ละปีที่สัตว์ร้ายตัวนั้นหลบรอดไปได้"
 hunt.4013.a_modifier:0 "ชาวบ้านใน [activity_place.GetNameNoTier] รู้สึกไม่สงบ"
 hunt.4013.b:2 "ข้ากำลัง... ลาดเลาอยู่ข้างหน้า"
 hunt.4013.c:0 "เจ้าพวกโง่! ข้าเกือบจะได้ตัวมันแล้ว!"
 hunt.4013.d:0 "ข้าจะไม่เสียเวลากับเรื่องโง่เขลานี้"

 hunt.4014.t:3 "ภูมิประเทศเจ้าปัญหา"
 hunt.4014.desc:2 "ขณะที่ควบม้าผ่าน [activity.GetCurrentPhase.GetLocation.Custom('GetProvinceFoliageDesc')] พวกเราเกือบจะทันเหยื่อที่อ่อนล้าเต็มทีแล้ว เราไล่ตาม [activity.Custom('GetAnimalType')] ตัวนี้มาหลายชั่วโมง!\n\n"
 hunt.4014.fall:0 "ข้างๆ ข้า ม้าของ [hunt_participant.GetTitledFirstNamePossessive] พลันเสียหลัก ทำให้ [hunt_participant.GetHerHim] ร่วงหล่นลงสู่พื้นพร้อมกับเสียงร้องเอ๋ง\n\n"
 hunt.4014.branch:0 "[hunt_participant.GetTitledFirstName] หันมาตะโกนบอกข้า โดยไม่ทันสังเกตกิ่งไม้ [ROOT.Char.GetCurrentLocation.Custom('GetRandomRegionalWood')] ที่ห้อยต่ำอยู่ข้างหน้า!\n\n"
 hunt.4014.cry:0 "ข้าอดไม่ได้ที่จะร้องออกมาโดยไม่รู้ตัว "[hunt_participant.GetFirstNameNoTooltip]!""\n\n"
 hunt.4014.dead_care:0 "ข้าลงจากม้า รีบวิ่งไปยังร่างที่กองอยู่ของ [hunt_participant.GetWomanMan] แต่ความกลัวอันเลวร้ายที่สุดของข้าก็ได้รับการยืนยันอย่างรวดเร็ว..."
 hunt.4014.dead:0 "[ROOT.Char.Custom2('RelationToMe', hunt_participant)] ของข้านอนนิ่งสนิท บิดเบี้ยวในท่าทางผิดธรรมชาติ แต่กลับสงบนิ่งอย่างน่าประหลาด"
 hunt.4014.wounded:0 "มันไม่ถึงตาย แต่ [hunt_participant.GetWomanMan] กำลังบิดตัวด้วยความเจ็บปวด"
 hunt.4014.fall_host:1 "ความตึงเครียดเล็กน้อยในตัวม้าของข้าเป็นสัญญาณเตือนเดียวก่อนที่ข้าจะร่วงหล่นกลางอากาศ พื้นดินพุ่งเข้ามาหาข้า"
 hunt.4014.branch_host:0 "ข้าหันไปตะโกนบางอย่างใส่ [hunt_participant.GetFirstName] ผู้ ซึ่งจ้องมองไปข้างหน้า ใบหน้าบิดเบี้ยวด้วยความตื่นตระหนก ข้าเห็นมันช้าไป: ตรงหน้าข้า กิ่งไม้ [ROOT.Char.GetCurrentLocation.Custom('GetRandomRegionalWood')] ขนาดใหญ่"
 hunt.4014.dead_host:1 "ข้าไม่รู้สึกถึงพื้นดินที่กระทบตัว เวลาราวกับเคลื่อนช้าลง ท้องฟ้าเหนือข้ามืดลง ที่ ซึ่งรูปร่างต่างๆ เคลื่อนไหวไปมา เสียงตะโกนอู้อี้ของพวกเขาล่องลอยผ่านม่านหมอกอันสับสน"
 hunt.4014.wounded_host:0 "\n\nข้าได้สติขึ้นมาใน [activity.GetCurrentPhase.GetLocation.Custom('GetProvinceGroundDesc')] นอนกองอยู่กับพื้น ความเจ็บปวดแล่นไปทั่วร่าง"
 hunt.4014.dead_host_courtier:1 "ข้าเห็นใบหน้าของ [hunt_participant.GetTitledFirstNamePossessive] ขยับปากพูดกับข้า ขาวซีดราวกับผี และจำได้ถึงม้าเหล่านั้น..."
 hunt.4014.wounded_host_courtier:1 ""นาย [host.GetTitleAsNameNoTooltip] ของข้า! ท่านบาดเจ็บหรือไม่?!" [hunt_participant.GetTitledFirstName] ร้องถาม พลางลงจากม้าของ [hunt_participant.GetHerHis]"
 hunt.4014.a:0 "ข้าจะดูแล [hunt_participant.GetHerHim] เอง"
 hunt.4014.a.physician:0 "อยู่นิ่งๆ ข้าได้รับการฝึกฝนด้านการแพทย์!"
 hunt.4014.a.learning:0 "รอเดี๋ยว ข้ารู้ว่าต้องทำอย่างไร!"
 hunt.4014.a.success:0 "ท่านทำแผลให้ [hunt_participant.GetFirstNamePossessiveNoTooltip]"
 hunt.4014.a.failure:0 "ท่านทำแผลพลาด"
 hunt.4014.b:1 "ให้เวลา [hunt_participant.GetFirstNameNoTooltip] สักหน่อย..."
 hunt.4014.b.physician:0 "บอกข้าทีว่าจะพันแผลให้ท่านได้อย่างไร หมอ"
 hunt.4014.c:2 "[physician.GetFirstNameNoTooltip]! #EMP [physician.GetFirstNameNoTooltip] อยู่ไหน?!#!"
 hunt.4014.c.host:0 "แล้วไง? อย่ามัว แต่จ้อง [physician.GetFirstNameNoTooltip]!"
 hunt.4014.c.success:0 "[physician.GetFirstNameNoTooltip] ทำแผลให้"
 hunt.4014.c.failure:0 "[physician.GetFirstNameNoTooltip] ทำแผลพลาด"
 hunt.4014.d:1 "ข้าต้องไปต่อ! [activity.Custom('GetAnimalType')] กำลังหนีไป!"
 hunt.4014.e:0 "ถึงเวลาที่เราจะเลิกสำหรับวันนี้แล้ว..."
 hunt.4014.f:0 "ข้า ส- *อั่ก!* #EMP ข้าไม่เป็นไร!#! มันกำลังหนีไป!"
 hunt.4014.f.flavor:0 "#EMP เร็วเข้า! ม้าของข้า!#!"
 hunt.4014.g:0 "พ-พาข้ากลับค่าย..."
 hunt.4014.g.flavor:0 "#EMP ข้าต้องนอนพัก...#!"
 hunt.4014.h.physician:0 "#weak [physician.GetFirstNameNoTooltip]... ป-ไปตาม...!#!"
 hunt.4014.h:1 "#weak สัตว์... [activity.Custom('GetAnimalType')]...!#!"

 hunt.4015.t:2 "คู่รัก"
 hunt.4015.desc:2 "เราตามเหยื่อเข้าไปใน [host.GetCurrentLocation.Custom('GetTerrainType')] อย่างช้าๆ แต่แน่นอนว่ากำลังเข้าใกล้ [activity.Custom('GetAnimalType')] [activity.Custom('GetAnimalAdjective')] มากขึ้น\n\nทันใดนั้นมันก็ตื่นตกใจ [activity.Custom('GetAnimalChargeParticiple')] หนีไปอีกทาง และขณะที่ข้าเคลื่อนตัวไปดูว่าอะไร ทำให้มันตกใจ ข้าแทบไม่เชื่อสายตาตัวเอง — [lover_participant.GetTitledFirstName] และ [second_lover_participant.GetTitledFirstName] กำลังพัวพันกันอยู่บนพื้นในอ้อมกอดอันเร่าร้อน!"
 hunt.4015.a:0 "ถอยกลับไปช้าๆ... ข้าไม่เห็นอะไรทั้งนั้น"
 hunt.4015.b:0 ""นี่มันเรื่องน่าอับอาย! หยุดการกระทำนี้เดี๋ยวนี้!""
 hunt.4015.c_4:0 ""[lover_participant.GetFirstNameNoTooltip]! [second_lover_participant.GetFirstNameNoTooltip]! แล้ว #EMP ข้า#! ล่ะ?""
 hunt.4015.c_1:1 ""[lover_participant.GetFirstNameNoTooltip] เจ้าปิดบังข้ามาตลอด!""
 hunt.4015.c_2:1 ""[second_lover_participant.GetFirstNameNoTooltip] เจ้าปิดบังข้ามาตลอด!""
 hunt.4015.c_3:0 ""โอ้โฮ นี่มันงานเลี้ยงที่ข้าเห็นตัวเองเข้าร่วมได้เลย!""
 hunt.4015.d:0 ""[second_lover_participant.GetTitledFirstNameNoTooltip] ท่านทำได้อย่างไร?!""
 hunt.4015.d_2:0 ""[lover_participant.GetTitledFirstNameNoTooltip] ท่านทำได้อย่างไร?!""
 hunt.4015.e:0 ""ลุกขึ้น ข้ารู้สึกว่าสัตว์ร้ายอยู่ใกล้ๆ นี้!""

 hunt.4016.t:2 "ของรางวัล"
 hunt.4016.desc:2 "เราคงไล่ตามมันข้าม [ROOT.Char.Custom('TerrainType')] ทั้งหมดไปสองรอบแล้ว และเราก็ยังไม่เข้าใกล้การต้อน [activity.Custom('GetAnimalType')] ให้จนมุมเลย...\n\nทุกคนคาดหวังให้ข้ากลับไปอย่างผู้มีชัย พร้อมกับของรางวัล แต่ในสถานการณ์ เช่นนี้ ข้าจะกลับบ้านไปพร้อมกับความอัปยศเท่านั้น"
 hunt.4016.a:2 "ตลาดที่ใกล้ที่สุดน่าจะมี [activity.Custom('GetAnimalType')] ขาย..."
 hunt.4016.b.success:0 "ผู้คนเชื่อในแผนการของข้า"
 hunt.4016.b.failure:0 "การหลอกลวงของข้าถูกเปิดโปง"
 hunt.4016.b.tt:0 "[activity.GetShortName] จะสำเร็จ — ในแง่หนึ่ง"
 hunt.4016.c:0 "ข้าจะไม่ตกต่ำถึงเพียงนั้น ข้ายอมกลับไปมือเปล่าดีกว่า!"

 hunt.4017.desc:2 "ข้าทิ้งผู้ติดตามไว้เบื้องหลัง ค้นหาไปทั่ว [host.GetCurrentLocation.Custom('GetTerrainTypePlural')] เพื่อตามหา [activity.Custom('GetAnimalType')] [activity.Custom('GetLegendaryColor')] ที่คอยหลอกหลอนข้า\n\nทันใดนั้นราวกับว่าข้าอยู่ใต้น้ำ — เสียงเงียบหายไป และแสงก็ดูเลื่อนลอย นั่นไง!\n\nเบื้องหน้าข้า มันยืนอยู่ [host.GetCurrentLocation.Custom('GetTerrainType')] หยุดนิ่งอยู่รอบตัวมัน — ราวกับว่ามันกำลังมองลึกเข้ามาใน #EMP จิตวิญญาณ#! ของข้า"
 hunt.4017.a:1 "นี่คือโอกาสของข้า!"
 hunt.4017.a.tt:1 "#EMP มันไม่แม้แต่จะพยายามหนี...#! "

 hunt.4018.desc:2 "ความเงียบสงัดพลันเข้าปกคลุม [host.GetCurrentLocation.Custom('GetTerrainType')] เมื่อหันไปบนอานม้า ข้าเห็นมันชัดเจนราวกับกลางวัน — [activity.Custom('GetAnimalType')] [activity.Custom('GetLegendaryColor')]\n\nก่อนที่ข้าจะมีเวลาเรียกคนอื่นๆ มันก็หายลับเข้าไปใน [host.GetCurrentLocation.Custom('GetProvinceFoliageDesc')] ราวกับภาพมายา..."
 hunt.4018.a:1 "ค้นหาบริเวณนี้! #EMP หา [activity.Custom('GetAnimalType')] ตัวนั้นให้เจอ!#!"
 hunt.4018.a.tt:1 "#EMP มันต้องอยู่แถวนี้สิ! ที่ไหนสักแห่ง...#! "
 hunt.4018.b:1 "ลืมมันไปเถอะ มันไปแล้ว..."
 hunt.4018.a.success:0 "ท่านพบ [activity.Custom('GetAnimalType')] [activity.Custom('GetLegendaryColor')]"
 hunt.4018.a.animal:0 "ท่านพบสัตว์อื่น"
 hunt.4018.a.failure:0 "[activity.Custom('GetAnimalType')] [activity.Custom('GetLegendaryColor')] หนีรอดไปได้"

 hunt.4019.courtier:0 ""[ROOT.Char.Custom('FormOfAddressForLiege')|U]!" [ROOT.Char.Custom2('RelationToMe', hunt_participant)]ของข้า, [hunt_participant.GetFirstName], ส่งเสียงกระซิบ, กวักมือเรียกข้า, พลางชี้ไปข้าม [host.GetCurrentLocation.Custom('GetTerrainTypePlural')]."
 hunt.4019.fallback:0 ""[ROOT.Char.Custom('FormOfAddressForLiege')|U]!" นายพรานคนหนึ่งส่งเสียงกระซิบ, กวักมือเรียกข้า, พลางชี้ไปข้าม [host.GetCurrentLocation.Custom('GetTerrainType')]."
 hunt.4019.desc:2 "\n\n"นั่นไง! เห็น [activity.Custom('GetAnimalType')] ไหม? ใช่ตัวที่ท่านตามหาหรือเปล่า?"\n\nข้างหน้าเราคือ [activity.Custom('GetAnimalType')] ธรรมดาๆ ตัวหนึ่ง ไม่มีแม้ แต่ขนสี [activity.Custom('GetLegendaryColor')] สักกระจุก"
 hunt.4019.a:1 "...ใช่แล้ว ตาแหลมมาก"
 hunt.4019.a.tt:1 "คงต้องใช้ตัวนี้ไปก่อน... #EMP สำหรับตอนนี้#!."
 hunt.4019.b:0 "นั่นมัน #EMP ดูเหมือน#! สี [activity.Custom('GetLegendaryColor')] ตรงไหนกัน?!"

 hunt.5001.t:1 "ดอกไม้ป่า"
 hunt.5001.desc:0 "เป็นวันที่น่าอภิรมย์สำหรับการล่า ซึ่งหมายความว่าเป็นวันที่ดีที่จะได้อยู่กลางแจ้ง ขณะที่ข้าสูดอากาศบริสุทธิ์ของพงไพรเข้าไปเต็มปอด "
 hunt.5001.desc.witch:0 "ข้าเหลือบไปเห็นขุมทรัพย์ของขวัญจากมารดาธรรมชาติ"
 hunt.5001.desc.religious:0 "ข้ามองเห็นในระยะไกล สิ่งที่น่าจะเป็นของขวัญจาก หรือการอุทิศของธรรมชาติแด่ [ROOT.Char.GetFaith.HealthGodName]"
 hunt.5001.desc.ending:1 "\n\nสมุนไพรที่มีประโยชน์และดอกไม้งดงามมากมาย! ทั้งสำหรับรักษาและเจตนาร้าย — แต่ข้ามาที่นี่เพื่อล่า! การเก็บ [host.GetCurrentLocation.Custom('get_region_flower_type_plural')] อาจ ทำให้บางคนเลิกคิ้ว..."
 hunt.5001.a:0 "ข้าต้องรักษาภาพลักษณ์"
 hunt.5001.b:0 "เหตุใดข้าต้องสนใจว่าผู้อื่นจะคิดอย่างไร?"
 hunt.5001.c:0 ""เฮ้ นั่นอะไรอยู่ตรงนั้น!?""
 hunt.5001.c.success:1 "[hunt_participant.GetTitledFirstNameNoTooltip] หลงกลอุบายที่เก่าแก่ที่สุดในตำรา"
 hunt.5001.d:0 "ลืมดอกไม้ไปซะ: ดูสมุนไพรพวกนี้สิ!"
 hunt.5001.d.poisonous:0 "#EMP ของขวัญจาก [ROOT.Char.GetFaith.DeathDeityName]...#!"
 hunt.5001.d.medicinal:0 "#EMP ของขวัญจาก [ROOT.Char.GetFaith.HealthGodName]...#!"

 hunt.5002.opening_position:1 "[hunt_participant.GetHeldCourtPositionsString] ของข้า [hunt_participant.GetFirstName] ลงจากม้ามานั่งยองๆ ใน [hunt_participant.GetCurrentLocation.Custom('GetProvinceGroundDesc')] กำลังตรวจสอบดอก [host.GetCurrentLocation.Custom('get_region_flower_type')] อย่างระมัดระวัง"
 hunt.5002.opening:0 "[ROOT.Char.Custom2('RelationToMe', hunt_participant)] ของข้า [hunt_participant.GetFirstName] กำลังนั่งยองๆ อยู่บนพื้น ฮัมเพลงอย่างร่าเริง พลางเก็บ [host.GetCurrentLocation.Custom('get_region_flower_type_plural')]"
 hunt.5002.second_position:0 "ข้างๆ [hunt_participant.GetHerHim] [hunt_participant_2.GetHeldCourtPositionsString] ของข้า [hunt_participant_2.GetFirstName] พูดคุยอย่างตื่นเต้น ชี้ไปที่กลีบดอกไม้"
 hunt.5002.second:1 "[hunt_participant_2.GetFirstName] [ROOT.Char.Custom2('RelationToMe', hunt_participant_2)] ของข้า ชะโงกมองข้ามไหล่ของ [hunt_participant.GetHerHis] ตั้งใจฟังอย่างดี\n\n"
 hunt.5002.alone:0 "[hunt_participant.GetSheHe|U] ดูเหมือนจะหมดความสนใจในการล่าไปแล้ว\n\n"
 hunt.5002.gardener:0 ""อา [ROOT.Char.GetTitleAsNameNoTooltip] ดอกไม้อันงดงามเหล่านี้ ทำให้ข้าเกิดความคิดสำหรับการจัด แต่งใหม่ๆ — #EMP พวกนี้#! เหมาะอย่างยิ่งที่จะประดับริมทางเดินในวัง...""
 hunt.5002.physician:0 ""[ROOT.Char.GetTitleAsNameNoTooltip] ดูสมุนไพรและดอกไม้ที่มีประโยชน์ทั้งหมดที่นี่สิ! อันนี้สามารถบรรเทาอาการปวดได้! อันนี้ช่วยรักษา [hunt_participant.Custom('RandomSaintBone')|l] ที่หักได้! อันนี้ป้องกัน [hunt_participant.Custom('RandomDisease')|l]..""
 hunt.5002.desc:2 ""[ROOT.Char.GetTitleAsNameNoTooltip] ช่างเป็นความอุดมสมบูรณ์ของธรรมชาติเสียนี่กระไร! ดูพืชเหล่านี้สิ! แท้จริงแล้ว ความมั่งคั่งของผืนดินนั้นไร้ขอบเขต — เราช่างไม่เห็นคุณค่าของสมบัติอันเรียบง่ายเหล่านี้เพียงพอ""
 hunt.5002.a:1 "กลับ #EMP ขึ้น#! ม้าของเจ้าไป!"
 hunt.5002.a.second:0 "กลับ #EMP ขึ้น#! ม้าของพวกเจ้าไป!"
 hunt.5002.a.flavor:1 "#EMP เรามาที่นี่เพื่อ [activity.Custom('GetAnimalType')]!#!"
 hunt.5002.b:1 "น่าสนใจ! นั่น #EMP ดอกอะไร#!?"
 hunt.5002.c:1 "ท-ท่านกำลังฝึก #EMP เวทมนตร์คาถา#!...?"
 hunt.5002.c.known:0 "หยุดเวทมนตร์คาถานี้เดี๋ยวนี้ เจ้าพ่อมดชั่วร้าย!"
 hunt.5002.c.flavor:0 "#EMP มนต์ดำ! ยาพิษ!#!"
 hunt.5002.d:0 "...ท่านกำลังเป็นที่สนใจนะ [hunt_participant.Custom('SisterBrother')]"
 hunt.5002.d.flavor:0 "#EMP เราต้องปกป้องวิถีแห่ง [ROOT.Char.GetFaith.WitchGodName]...#!"
 hunt.5002.e:0 "ท่านช่างตาแหลมจริงๆ!"
 hunt.5002.e.flavor:0 "#EMP ให้ข้าเล่าเรื่องทั้งหมดให้ท่านฟัง...#!"
 hunt.5002.e.gardener:0 "ข้ากำลัง #EMP มองหา#! ของพวกนี้เพิ่มอยู่พอดี!"
 hunt.5002.e.herbalist:0 "ใช่ และ #EMP นี่#! อาจเป็นสมุนไพรที่มีประโยชน์ที่สุด!"
 hunt.5002.g:0 "ข้าว่าดอกไม้ใหม่ๆ #EMP ก็คง#! จะดี..."
 hunt.5002.g.present:0 "[gardener.GetFirstNameNoTooltip] มาทางนี้!"
 hunt.5002.g.elsewhere:0 "[gardener.GetFirstNameNoTooltip] #EMP คงจะ#! ชื่นชมดอกไม้เหล่านี้..."
 hunt.5002.h:0 "หมอหลวงของข้าจะมีสิ่งที่ [physician.GetSheHe] ต้องการ"
 hunt.5002.h.present:0 "[physician.GetFirstNameNoTooltip] มาทางนี้!"
 hunt.5002.h.elsewhere:0 "[physician.GetFirstNameNoTooltip] น่าจะใช้สมุนไพรเหล่านี้ได้..."
 hunt.5002.cp_flavor:0 "#EMP ...แต่เราจะไปต่อ!#!"
 hunt.5002.cp_present_flavor:1 "#EMP [hunt_participant.GetFirstNameNoTooltip] มีงานให้เจ้าทำ หมอรักษา!#!"
 hunt.5002.cp_elsewhere_flavor:0 "#EMP ท่านไม่ว่าอะไรใช่ไหมที่จะอยู่เก็บต่อ?#!"
 hunt.5003.opening:0 "ในช่วงเวลาพักผ่อนอันหาได้ยาก ข้าใช้เวลาอยู่เงียบๆ ชื่นชมความงามของธรรมชาติ"
 hunt.5003.desc_woo:0 "ข้าพลันสะดุ้งโดย [ROOT.Char.Custom2('RelationToMeShort', hunt_participant)] ของข้า [hunt_participant.GetFirstName] ผู้ ซึ่งหัวเราะ: "ของขวัญ สำหรับ [ROOT.Char.GetTitleAsNameNoTooltip] ของข้า"\n\n"
 hunt.5003.desc:1 "ขณะที่ความเครียดของข้าคลายลง ข้าได้ยินเสียง [ROOT.Char.Custom2('RelationToMeShort', hunt_participant)] ของข้า [hunt_participant.GetFirstName] หัวเราะเบาๆ: "#EMP ที่รักของข้า.#!"\n\n"
 hunt.5003.desc.flower:1 "[hunt_participant.GetSheHe|U] วางบางอย่างไว้หลังหูของข้า "แม้ว่าจะเทียบไม่ได้กับความงามของท่านเลย แต่ [newly_created_artifact.Custom('ArtifactVariableFlowerSpecies')] นี้ ทำให้ข้านึกถึงท่าน""
 hunt.5003.desc.animal:1 "[hunt_participant.GetSheHe|U] ชูซากกระต่ายป่าเปื้อนเลือดขึ้น "ข้าสังหารเจ้าตัวเล็กนี่เพื่อเป็นเกียรติแก่ท่าน เป็นเครื่องหมายแห่งความทุ่มเทของข้าที่จะต่อสู้เคียงข้างท่านตลอดไป""
 hunt.5003.ending:0 "\n\n[hunt_participant.GetFirstNameNoTooltip] ยิ้ม ชื่นชมผลงานของ [hunt_participant.GetHerHis]"
 hunt.5003.ending_lover:0 ""ท่านดูสงบเหลือเกิน ข้ายินดีนัก" [hunt_participant.GetSheHe|U] รีบจุมพิตแก้มข้าอย่างบริสุทธิ์ ราวกับว่ามีเพียงเราสองคนในโลก"
 hunt.5003.ending_woo:0 ""ข้ายินดีที่ได้พบท่านตามลำพัง" [hunt_participant.GetSheHe|U] หน้าแดงเล็กน้อย สายตาของ [hunt_participant.GetHerHis] สื่อสารบางอย่าง... ที่ไม่ได้เอ่ยออกมา"
 hunt.5003.a:1 "ท่านกำลัง #EMP พยายาม#! ให้ถูกจับได้หรือ!?"
 hunt.5003.b:1 "ข้าจะ #EMP ทะนุถนอม#! มัน ที่รัก"
 hunt.5003.b.woo:0 "ขอบคุณ มันงดงามมาก"
 hunt.5003.b.tt:0 "อาจมีคนรู้เรื่องความสัมพันธ์ [secret|E] ของท่าน"
 hunt.5003.c:0 "ข้าไม่ต้องการสิ่งนี้"
 hunt.5003.d:0 "มานี่สิ ที่รักของข้า"
 hunt.5003.d.woo:0 "มานี่สิ เราอยู่ตามลำพังทีเดียว..."

 hunt.5010.t:0 "[activity.Custom('GetAnimalFemale')|U] ที่หวาดกลัว"
 hunt.5010.desc:0 "ขณะที่เราเคลื่อนผ่าน [ROOT.Char.GetCurrentLocation.Custom('GetProvinceFoliageDesc')] ไล่ตาม [activity.Custom('GetAnimalType')] อย่างกระชั้นชิด เราก็เข้ามาในที่โล่งที่เป็นทางตันใต้หน้าผาเล็กๆ\n\nเสียงครวญครางด้วยความผิดหวังและรำคาญดังขึ้นจากคณะ: แม่กวางที่ตื่นกลัวและลูกของมันหมอบอยู่ใน [ROOT.Char.GetCurrentLocation.Custom('GetProvinceGroundDesc')] — เราคงตามรอยพวกมันมาโดยไม่ตั้งใจในความเร่งรีบของเรา...\n\nไม่มีเหตุผลที่จะล่าพวกมัน: เราจะต้องย้อนกลับไปและตามหา [activity.Custom('GetAnimalMale')] อีกครั้งก่อนที่จะสายเกินไป"
 hunt.5010.a:0 "เหยื่อก็คือเหยื่อ จัดการมันซะ"
 hunt.5010.b:0 "จับ [activity.Custom('GetAnimalChild')] มาฝึกให้เชื่อง!"
 hunt.5010.c:0 "ตามหา [activity.Custom('GetAnimalMale')] ตัวนั้น!"

 hunt.5050.t:0 "ถูกฉกจากฟ้า"
 hunt.5050.desc:0 "[activity.Custom('GetRaptorType')] ของข้าบินขึ้นจากจุดเฝ้าสังเกตการณ์อย่างสง่างาม มุ่งตรงไปยัง [activity.Custom('GetAnimalType')] สี [activity.Custom('GetAnimalColor')] ที่ซ่อนตัวอยู่ใน [host.GetCurrentLocation.Custom('GetProvinceFoliageDesc')]\n\nขณะที่มันบินขึ้นสูงสุด เสียงร้องแหลมดังขึ้นเหนือศีรษะเรา เสียงที่ดังและแหลมเกินกว่าจะเป็นของนก #EMP ของเรา#! ตัวใด\n\nทันทีที่ [activity.Custom('GetRaptorType')] ของข้าเริ่มโฉบลง มันก็ถูกโฉบโดย [host.Custom('GetRegionalEagleType')] ขนาดใหญ่ — ถูกฉกไปจากกลางอากาศพร้อมกับขนนกที่กระจายว่อน!"
 hunt.5050.a:0 "เจ้าสารเลว! ตามมันไป!"
 hunt.5050.a.success:0 "ท่านล้างแค้นให้ [activity.Custom('GetRaptorType')] ของท่าน"
 hunt.5050.a.failure:0 "นกตัวนั้นหนีไปได้"
 hunt.5050.b:0 "ดูเหมือนข้าจะต้องใช้ [activity.Custom('GetRaptorType')] #EMP ของท่าน#! แล้ว [hunt_participant.GetFirstNameNoTooltip]"
 hunt.5050.c:0 "อา ขนนกของมันเส้นหนึ่ง"
 hunt.5050.c.tt:0 "ท่านจะได้รับเครื่องประดับขนนก [artifact|E]"
 hunt.5050.d:0 "ธรรมชาติช่างโหดร้าย..."

 hunt.5060.t:0 "ใต้ปีกของข้า"
 hunt.5060.desc:1 "คณะของข้าและข้าเดินย่องผ่านพุ่มไม้เล็กๆ สอดส่ายสายตามองหาสัญญาณของ [activity.Custom('GetAnimalType')] จากยอดไม้ด้านบน เสียงร้องจิ๊บๆ เบาๆ ดังแว่วมา ดังขึ้นเรื่อยๆ ขณะที่เราเคลื่อนไปข้างหน้า\n\nมันคือลูกนกที่กำลังร้องหาแม่ของมัน!\n\nนายพรานผู้คล่องแคล่วคนหนึ่งนำลูกนกนักล่าขนปุยที่ยังบินไม่ได้ลงมาจากต้น [ROOT.Char.GetCurrentLocation.Custom('GetRandomRegionalWood')]! ช่างโชคดีอะไร เช่นนี้! มีเพียงลูกนกที่จับได้ในป่าเท่านั้นที่สามารถฝึกให้ล่าได้อย่างเหมาะสม"
 hunt.5060.a:0 "นำมันกลับไปที่โรงเลี้ยงนกของข้า"
 hunt.5060.b:0 "นี่ [hunt_participant.GetFirstNameNoTooltip] ของขวัญ!"
 hunt.5060.c:0 "เอามันกลับไปคืน"

 hunt.7001.t:3 "การเผชิญหน้าในหนองน้ำ"
 hunt.7001.desc:1 "พื้นดินเริ่มเปียกชื้น และอากาศก็หนักอึ้งขึ้น ขณะที่เราขี่ม้าลึกเข้าไปในถิ่นทุรกันดารของ [host.GetCurrentLocation.GetNameNoTooltip]\n\nทันใดนั้น จากพงหญ้าเขียวขจีรอบตัวเรา ชายร่างยักษ์คนหนึ่งก็ปรากฏตัวขึ้น — ร่างใหญ่โตในเสื้อผ้าสกปรกหลายชั้น\n\nเขาร้องตะโกน "จงอธิบายมา! พวกเจ้ากำลังทำอะไรในพื้นที่หนองน้ำ #EMP ของข้า#!?""
 hunt.7001.adventurer: "ท่านไม่อยากเห็นโลกกว้างกับพวกเราหรือ?"
 hunt.7001.a:0 "พื้นที่หนองน้ำ #EMP ของเจ้า#! งั้นรึ? ถ้า เช่นนั้นก็นำทางพวกเราสิ"
 hunt.7001.b:0 "มาคุยกันดีๆ เถอะ"
 hunt.7001.b_success:0 "ชายผู้นั้นเข้าใจเหตุผลของข้า... ข้าคิดว่านะ"
 hunt.7001.b_failure:0 "คนบ้าผู้นี้เข้าไม่ถึงเหตุผล"
 hunt.7001.c:1 "ในที่สุด! ก็มีบางอย่างให้ล่า!"
 hunt.7001.d:0 "หลีกทางไป เจ้าชาวบ้านโสโครก!"

 hunt.7011.t:1 "ติดกับดัก"
 hunt.7011.desc:0 "ขณะที่ [hunt_participant.GetTitledFirstName] และข้าเดินย่ำเท้าไปบนพื้นดินที่ลำบาก ข้าแทบจะกระโดดตัวลอยด้วยเสียงร้องโหยหวน\n\n"
 hunt.7011.snare:1 "ข้าหันไปเห็น [ROOT.Char.Custom2('RelationToMe', hunt_participant)] ของข้านอนแผ่อยู่บนพื้น บ่วงรัดน่องของ [hunt_participant.GetHerHis] อย่างแน่นหนา"
 hunt.7011.bear:0 "ข้าหันไปเห็นเท้าของ [ROOT.Char.Custom2('RelationToMePossessive', hunt_participant)] ติดอยู่ในปากของกับดักหมีที่โผล่ออกมาจากพงหนามอย่างน่ากลัว"
 hunt.7011.pit:0 "ข้าหันไปเห็น [ROOT.Char.Custom2('RelationToMe', hunt_participant)] ของข้าตกลงไปในหลุมพรางที่ซ่อนอยู่ ซึ่งตอนนี้ยึดขาของ [hunt_participant.GetHerHis] ไว้อย่างแน่นหนา"
 hunt.7011.alive:1 "\n\n[hunt_participant.GetSheHe|U] ร้องโหยหวนด้วยความเจ็บปวด"
 hunt.7011.noble:0 ""อ๊าก! พวกชาวบ้านชั้นต่ำนี่! ทำไมพวกมันไม่ล่าเหมือน [hunt_participant.GetWomenMen] จริงๆ กันนะ?!""
 hunt.7011.lowborn:0 ""ขาข้า! อ๊าก! ข้ามองไม่เห็นเจ้าสิ่งบ้านี่เลย! #EMP อ๊าก!#!""
 hunt.7011.dead:1 "\n\nเราต้องไปต่อ มิฉะนั้นเราจะเสีย [activity.Custom('GetAnimalType')] ไป!"
 hunt.7011.a:1 "ข้าต้องไปต่อ มิฉะนั้นเราจะเสีย [activity.Custom('GetAnimalType')] ไป!"
 hunt.7011.b:0 "[physician.GetFirstNameNoTooltip]! [physician.GetFirstNameNoTooltip] อยู่ไหน?"
 hunt.7011.c:0 "คนของข้าจะพาท่านกลับไป"
 hunt.7011.d:0 "ท่านโชคร้ายที่ล้มแรงมาก..."
 hunt.7011.d.success:0 "ไม่มีใครสังเกตเห็น"
 hunt.7011.d.failure:0 "มีคนสงสัย"
 hunt.7011.d.flavor:0 "#EMP ...และหัวของท่านกระแทกกับหินก้อนนี้...#!"
 hunt.7011.e:0 "ตามหาคนวางกับดัก แล้วตัดมือพวกมันซะ"
 hunt.7011.e.flavor:0 "#EMP ไม่มีใครขโมยของจาก [ROOT.Char.GetTitleAsNameNoTooltip]!#!"
 hunt.7011.e.hunting_grounds:0 "ตัวเลือกนี้มีให้ เนื่องจาก $building_type_hunting_grounds_01$ [building|E] ของ [host.GetCurrentLocation.GetTitle.GetBaseNameNoTierPossessive]"
 hunt.7011.e.royal_forests:0 "ตัวเลือกนี้มีให้ เนื่องจาก $building_type_royal_forest_01$ [building|E] ของ [host.GetCurrentLocation.GetTitle.GetBaseNameNoTierPossessive]"
 hunt.7020.t:1 "ท้าทายแรงโน้มถ่วง"
 hunt.7020.desc:0 "คณะหยุดลง ความสนใจถูกดึงดูดไปยังกลุ่มหินกลมมนบนยอดเนิน [onlooker.GetTitledFirstName] ผลักก้อนหินที่หลวมอยู่ก้อนหนึ่ง\n\nทุกคนเฝ้าดูอย่างใจจดใจจ่อขณะที่หินกลิ้งลงมา เร่งความเร็วขึ้นเรื่อยๆ ถึงตีนเขาพร้อมกับเสียงกระแทกที่น่าพอใจ\n\n"
 hunt.7020.murder:0 "ข้าสงสัย... [pertinent.GetFirstNameNoTooltip] จะหยิ่งพอที่จะหลงกลหรือไม่..."
 hunt.7020.woo:0 "จะมีวิธีใดพิสูจน์คุณค่าของข้าต่อ [pertinent.GetFirstNameNoTooltip] ได้ดีไปกว่าการกระโดดข้ามก้อนหิน?"
 hunt.7020.befriend:0 "นี่อาจเป็นโอกาสที่จะผูกมิตรกับ [pertinent.GetFirstNameNoTooltip] ที่ข้ารอคอยอยู่ก็ได้"
 hunt.7020.bravado:0 "ว่าไป นี่อาจเป็นโอกาสที่จะสร้างความประทับใจให้ทุกคน..."
 hunt.7020.a.intent:0 "ดูนี่สิ [pertinent.GetFirstNameNoTooltip]!"
 hunt.7020.a:0 "ทุกคน ช่วย [onlooker.GetFirstNameNoTooltip] กลิ้งก้อนใหญ่ให้ข้าที!"
 hunt.7020.a.flavor:0 "#EMP มันก็แค่ก้อนกรวด!#!"
 hunt.7020.b:0 "ผลักมาอีกก้อน ข้าจะกระโดดข้ามมัน!"
 hunt.7020.b.flavor:0 "#EMP ข้าจะข้ามมันไปได้อย่างง่ายดาย!#!"
 hunt.7020.c.rival:0 "ขี้ขลาดเกินกว่าจะกระโดดข้ามสักก้อนหรือ [pertinent.GetFirstNameNoTooltip]?"
 hunt.7020.c:0 "[pertinent.GetFirstNameNoTooltip] ท่านกระโดดข้ามสักก้อนได้ไหม?"
 hunt.7020.c.flavor:0 "#EMP มันจะมีอะไรผิดพลาดได้ล่ะ?#!"
 hunt.7020.d:0 "มาเถอะ [pertinent.GetFirstNameNoTooltip] มาดูกันว่าใครจะกระโดดได้มากที่สุด!"
 hunt.7020.d.flavor:0 "#EMP ระวังตัวด้วย!#!"
 hunt_boulder_jump_success_both:0 "ท่านทั้งคู่กระโดดข้ามก้อนหินของท่านได้"
 hunt_boulder_jump_success_self:0 "ท่านกระโดดข้ามก้อนหินได้"
 hunt_boulder_jump_success_pertinent:0 "[pertinent.GetFirstNameNoTooltip] กระโดดข้ามก้อนหินได้"
 hunt_boulder_jump_failure_self:0 "ท่าน #negative_value บาดเจ็บ#!"
 hunt_boulder_jump_failure_pertinent:0 "[pertinent.GetFirstNameNoTooltip] #negative_value บาดเจ็บ#!"
 hunt_boulder_jump_failure_both:0 "ท่านทั้งคู่ #negative_value บาดเจ็บ#!"
 hunt_boulder_jump_refusal:0 "[pertinent.GetFirstNameNoTooltip] ปฏิเสธคำท้าของท่าน"
 hunt_boulder_impressed_title:0 "การกระโดดอันน่าประทับใจ"
 hunt.7020.e:0 "ดีมาก ไปกันต่อเถอะ"
 hunt.7020.e.flavor:0 "#EMP มันคงจะโง่เขลาที่จะทำอย่างอื่น...#!"

 hunt.7100.t:1 "ช่วงเวลาสนทนา"
 hunt.7100.opening:0 "ขณะรอสุนัขตามกลิ่น คณะพักผ่อนอยู่ในร่มเงา [woo_target.GetFirstName] พักอยู่ใกล้ๆ: นี่จะเป็นเวลาที่เหมาะที่สุดสำหรับการสนทนาอย่างบริสุทธิ์ใจ"
 hunt.7100.married:0 "ข้าเคลื่อนไหวขณะที่ [woo_target.GetPrimarySpouse.GetWifeHusband] ของ [woo_target.GetHerHis] [woo_target.GetPrimarySpouse.GetTitledFirstName] กำลังเสียสมาธิ"
 hunt.7100.married_absent:0 "[woo_target.GetPrimarySpouse.GetWifeHusband] ของ [woo_target.GetHerHis|U] [woo_target.GetPrimarySpouse.GetTitledFirstName] อยู่ห่างไกลออกไป..."
 hunt.7100.currentspouse:0 "บางทีวันนี้ข้าอาจจะเอาชนะใจ [woo_target.GetWomanMan] ของข้าได้!"
 hunt.7100.desc:0 "\n\n"อา [woo_target.GetTitledFirstName] ช่างเป็นวันที่ดีจริงๆ ข้าเชื่อว่าท่านกำลังสนุกสนานอยู่ใช่หรือไม่?" ข้าเปิดประเด็นอย่างไม่ใส่ใจ\n\nข้าเกือบจะแน่ใจว่ารอยยิ้มของ [woo_target.GetHerHis] เป็นมากกว่าแค่ความสุภาพ"
 hunt.7100.a:0 "ไม่มีอะไรดีไปกว่าการล่าที่ดี!"
 hunt.7100.a.tt:0 "#F ดึงดูดด้านที่กระตือรือร้นของ [woo_target.GetFirstNamePossessiveNoTooltip]#!"
 hunt.7100.b:1 "การฝึกและปล่อย [activity.Custom('GetRaptorType')] ให้บินคือการใช้ชีวิตอย่างแท้จริง"
 hunt.7100.b.tt:0 "#F ดึงดูดด้านสังคมของ [woo_target.GetFirstNamePossessiveNoTooltip]#!"
 hunt.7100.c:0 "บางครั้งข้าก็สงสารสัตว์ที่น่าสงสารเหล่านั้น"
 hunt.7100.c.tt:0 "#F ดึงดูดด้านที่เห็นอกเห็นใจของ [woo_target.GetFirstNamePossessiveNoTooltip]#!"
 hunt.7100.d:0 "แน่นอนว่าข้าอยากจะทำอะไรที่มีประโยชน์มากกว่านี้"
 hunt.7100.d.tt:0 "#F ดึงดูดด้านที่ขยันหมั่นเพียรของ [woo_target.GetFirstNamePossessiveNoTooltip]#!"
 hunt.7100.e:0 "ป่าที่ได้รับการจัดการอย่างดีจะมอบของขวัญของ [ROOT.Char.GetFaith.HighGodNamePossessive] ออกมา"
 hunt.7100.e.tt:0 "#F ดึงดูดด้านการดูแลจัดการของ [woo_target.GetFirstNamePossessiveNoTooltip]#!"
 hunt.7101.reply_hunter:0 ""$hunt.7100.a$"\n\n"
