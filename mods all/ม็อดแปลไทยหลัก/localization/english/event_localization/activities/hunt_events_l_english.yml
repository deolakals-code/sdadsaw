 hunt.1202.capture_success:0 "หลังจากการดิ้นรนและ [activity.Custom('GetAnimalSoundParticiple')] อย่างมาก ในที่สุด [activity.Custom('GetAnimalType')] ก็สงบลง ถูกมัดขารวบอย่างช่วยไม่ได้"
 hunt.1202.capture_injury:0 "หลังจากการดิ้นรนและ [activity.Custom('GetAnimalSoundParticiple')] อย่างมาก [activity.Custom('GetAnimalType')] ก็สงบลง แต่ข้าได้รับบาดแผลใหญ่ในกระบวนการนั้น"
 hunt.1202.capture_failure:0 "หลังจากการดิ้นรนและ [activity.Custom('GetAnimalSoundParticiple')] อย่างมาก [activity.Custom('GetAnimalType')] ก็สงบลง แต่ [injury_target.GetFirstName] ได้รับ [activity.Custom('GetAnimalStrike')] อย่างแรงในกระบวนการนั้น"
 hunt.1202.capture_critical:0 "หลังจากการดิ้นรนและ [activity.Custom('GetAnimalSoundParticiple')] อย่างมาก [activity.Custom('GetAnimalType')] ก็สงบลง แต่ไม่ใช่ก่อนที่จะ ทำให้ [injury_target.GetFirstName] ล้มลง"
 hunt.1202.success_self:0 "\n\nเราค่อยๆ ล้อมรอบมัน หอกชี้ชัน และ ทำให้สัตว์ที่ [activity.Custom('GetAnimalSoundParticiple')] พ้นทุกข์"
 hunt.1202.success:0 "\n\nเหล่านักล่าค่อยๆ ล้อมรอบมัน หอกชี้ชัน และ ทำให้สัตว์ที่ [activity.Custom('GetAnimalSoundParticiple')] พ้นทุกข์"
