 hunt_prayed_at_a_statue_log: "[CHARACTER.GetShortUIName|U] สวดภาวนาที่ [activity.GetCurrentPhase.GetLocation.Custom('GetReligiousFigurineName')]"
 hunt_desecrated_a_statue_log_title: "$tgp_hunt.0004.t$"
 hunt_desecrated_a_statue_log: "[CHARACTER.GetShortUIName|U] ลบหลู่ [activity.GetCurrentPhase.GetLocation.Custom('GetReligiousFigurineName')]"
 tgp_hunt.0004.b.success: "ท่านลบหลู่รูปปั้นโดยไม่ถูกพบเห็น"
 tgp_hunt.0004.b.failure: "ท่านถูกชาวบ้านพบเห็นขณะกำลังลบหลู่รูปเคารพ"
 jizo_statue: "รูปปั้นจิโซ"
 religious_statuette: "รูปเคารพทางศาสนา"

 tgp_hunt.0005.t: "ท่ามกลางทุ่งนา"
 tgp_hunt.0005.desc: "ขณะที่เรากำลังไล่ล่า [activity.Custom('GetAnimalType')] การไล่ล่าของเราต้องหยุดชะงักเมื่อสัตว์หนีเข้าไปในทุ่งนาอันหนาทึบ คณะล่าสัตว์ทั้งหมดตามมาทันและเราสอดส่องไปในทุ่งเพื่อมองหาการเคลื่อนไหว แต่ไร้วี่แววของ [activity.Custom('GetAnimalType')]!\n\nเราจะมาพ่ายแพ้ให้กับนาข้าวไม่ได้!"
 tgp_hunt.0005.success: "พบเห็น [activity.Custom('GetAnimalType')] แล้ว"
 tgp_hunt.0005.failure: "ไม่พบเห็น [activity.Custom('GetAnimalType')] เลย"
 tgp_hunt.0005.a: "ข้าอาจมีกลวิธีในใจ"
 tgp_hunt.0005.b: "จุดไฟเผาเพื่อไล่สัตว์ออกมา!"
 tgp_hunt.0005.c: "บางที [target_character.GetFirstNameNoTooltip] อาจมีความคิดดี ๆ?"
 tgp_hunt.0005.d: "ทุกคนเข้าประจำที่! เราจะรอดู"

 tgp_hunt.0006.t: "บทกวีของนายพราน"
 tgp_hunt.0006.desc: "เมื่อข้ากลับมายังค่าย ข้าเห็น [poet.GetName] กำลังจ้องมองไปไกล ตกอยู่ในภวังค์ เมื่อข้าเข้าไปใกล้ ภวังค์ของ [poet.GetHerHis] ก็ขาดสะบั้น\n\n"ยินดีที่ได้พบท่าน [poet.Custom2('RelationToMe', SCOPE.sC('host'))] ของข้า! ข้าหวังจะ แต่งบทกวีเกี่ยวกับการล่าอันน่าตื่นเต้นนี้ แต่ข้าตัดสินใจเลือกหัวข้อไม่ได้เลย!""
 tgp_hunt.0006.a: ""ลองพิจารณาเสน่ห์อันผ่อนคลายของธรรมชาติในท้องถิ่นนี้สิ""
 tgp_hunt.0006.b: ""อ้าว ก็เกี่ยวกับความกล้าหาญของข้าน่ะสิ!""
 tgp_hunt.0006.c: ""อุทิศมันให้ [seduction_target.GetNameNoTooltip] สิ""
 tgp_hunt.0006.d: ""เขียนเกี่ยวกับความสามารถในการล่าสัตว์ของ [befriend_target.GetShortUINamePossessiveNoTooltip] สิ!""
 tgp_hunt.0006.e: ""ให้ข้ายืม [ROOT.Char.Custom('WritingInstrument')] ของข้าแก่ท่านเถิด!""
 hunt_depends_on_aptitude: "ประสิทธิภาพของสิ่งนี้ขึ้นอยู่กับ [aptitude|e] ของ [poet.GetShortUIName]"
 hunt_helped_with_poem: "ร่วมกัน แต่งบทกวี"
 hunt_gives_advice_log_title: "$tgp_hunt.0006.t$"
 hunt_gives_advice_log: "[CHARACTER.GetShortUIName|U] ให้คำแนะนำแก่ [poet.GetShortUIName]"
