 hunt.7101.opening:0 "[woo_actor.GetTitledFirstName] เข้ามาหาข้าขณะที่คณะพักผ่อนอยู่ในร่มเงารอให้สุนัขล่าเนื้อหาเจอตามกลิ่น\n\n[woo_actor.GetSheHe|U] ครุ่นคิดอยู่ครู่หนึ่งก่อนจะเสนอ:"
 hunt.7101.hunter:0 "$hunt.7101.reply_hunter$ข้าปฏิเสธไม่ได้ว่าความตื่นเต้น การกระทำนั้น เป็นความสุข"
 hunt.7101.falconer:0 "$hunt.7101.reply_falconer$ข้ารู้ถึงสัญลักษณ์ที่ [woo_actor.GetSheHe] กล่าวถึง"
 hunt.7101.pity:0 "$hunt.7101.reply_pity$บางที [woo_actor.GetSheHe] อาจแตกต่างจากคนอื่นๆ"
 hunt.7101.wastrel:0 "$hunt.7101.reply_wastrel$นี่คือ [woo_actor.GetWomanMan] ที่กำลังจะไปได้ไกล"
 hunt.7101.steward:0 "$hunt.7101.reply_steward$มีความงามอย่างแท้จริงในธรรมชาติที่เป็นระเบียบ"
 hunt.7101.fallback:0 "ข้าหาคำตอบได้ยาก"
 hunt.7101.a:0 "ข้าปฏิเสธไม่ได้ว่า [woo_actor.GetSheHe] มีเสน่ห์บางอย่าง..."

 hunt.7102.hunter:0 "$hunt.7101.reply_hunter$\n\nข้าอดไม่ได้ที่จะรู้สึกอึดอัดใจ..."
 hunt.7102.falconer:0 "$hunt.7101.reply_falconer$\n\nช่างหยิ่งยโสเสียนี่กระไร..."
 hunt.7102.pity:0 "$hunt.7101.reply_pity$\n\nเรียนรู้ที่จะรับคำชมเสียบ้างเถิด!"
 hunt.7102.wastrel:0 "$hunt.7101.reply_wastrel$\n\n"
 hunt.7102.steward:0 "$hunt.7101.reply_steward$\n\n"
 hunt.7102.fallback:0 "[woo_actor.GetSheHe|U] เพียงแค่ยิ้มให้ข้าอย่างรู้ทัน ทำให้ข้ารู้สึกอึดอัด #EMP อย่างยิ่ง#!"
 hunt.7102.a:0 "ช่างเป็น [woo_actor.GetWomanMan] ที่น่าขันเสียนี่กระไร"
 hunt.7103.reply:0 "[woo_target.GetTitledFirstName] ดูเหมือนจะตอบสนองต่อกลอุบายของข้าอย่างอบอุ่น"
 hunt.7103.hunter:0 "$hunt.7103.reply$ ดวงตาลุกวาวขณะที่ [woo_target.GetSheHe] พยักหน้าอย่างแรง"
 hunt.7103.falconer:0 "$hunt.7103.reply$ เกือบจะมองข้าด้วยสายตาใหม่"
 hunt.7103.pity:1 "$hunt.7103.reply$ คร่ำครวญถึงกีฬาที่รุนแรงในยุคสมัยและชนชั้นของเรา"
 hunt.7103.wastrel:1 "$hunt.7103.reply$ ประหลาดใจอย่างเห็นได้ชัดที่ได้พบจิตวิญญาณที่เหมือนกัน"
 hunt.7103.steward:1 "$hunt.7103.reply$ ยินดีที่ได้พบผู้ที่พบความสุขในสิ่งดังกล่าว เช่นกัน"
 hunt.7103.fallback:0 "$hunt.7103.reply$ จ้องมองลึกเข้าไปในดวงตาของข้าเป็นเวลานาน"
 hunt.7103.desc:0 "\n\nเมื่อ [woo_target.GetSheHe] จากไป ความตึงเครียดก็ปรากฏชัดในทุกคำทักทาย — ข้ารู้ว่าข้าจะหาคำพูดที่เหมาะสมเพื่อเอาชนะใจ [woo_target.GetHerHim] ได้!"
 hunt.7103.a:0 "ข้าคิดว่า [woo_target.GetSheHe] ติดกับแล้ว..."
 hunt.7104.reply:0 "คำตอบของข้าดูเหมือนจะไม่สร้างความประทับใจให้ [woo_target.GetTitledFirstName]"
 hunt.7104.hunter:0 "$hunt.7104.reply$ เพราะ [woo_target.GetSheHe] หลบสายตาข้าเมื่อ [woo_target.GetSheHe] ขอบคุณข้าและรีบจากไป [woo_target.GetHerHis]"
 hunt.7104.falconer:0 "$hunt.7104.reply$ เพราะ [woo_target.GetSheHe] กลอกตา [woo_target.GetHerHis] อย่างไม่ใส่ใจ"
 hunt.7104.pity:0 "$hunt.7104.reply$ เพราะ [woo_target.GetSheHe] หมดความสนใจอย่างรวดเร็ว รู้สึกท้อแท้กับคำพูดของข้า"
 hunt.7104.wastrel:0 "$hunt.7104.reply$ เพราะ [woo_target.GetSheHe] เหม่อลอย ดูเหมือนจะฟังเพียงครึ่งเดียว"
 hunt.7104.steward:0 "$hunt.7104.reply$ เพราะ [woo_target.GetSheHe] เหม่อลอย ดูเหมือนจะฟังเพียงครึ่งเดียว"
 hunt.7104.fallback:1 "$hunt.7104.reply$ เพราะ [woo_target.GetSheHe] ไม่สามารถจากไปจากข้าได้เร็วกว่านี้"
 hunt.7104.desc:0 "\n\nเมื่อยืนอยู่คนเดียวหลังจากที่ [woo_target.GetHerHis] กล่าวคำอำลาไปแล้ว ข้าอดไม่ได้ที่จะรู้สึกเหมือนคนโง่สำหรับการก้าวพลาดอย่างสิ้นเชิง เช่นนี้..."
 hunt.7104.a:0 "ข้าคิดอะไรอยู่กันนะ...?"

 hunt.7200.t:1 "เกมที่แท้จริง"
 hunt.7200.desc:1 "ขณะที่เราออกจากค่ายและมุ่งหน้าลึกเข้าไปใน [host.GetCurrentLocation.Custom('GetTerrainTypePlural')] ข้าจับตาดู [ROOT.Char.Custom2('DescriptorNegative', murder_target)] [murder_target.GetTitledFirstName] ที่เดินย่ำไปอย่างเชื่องช้า โดยไม่รู้ตัวว่าข้ากำลังสังเกตการณ์อยู่\n\n"
 hunt.7200.agent:0 "[murder_schemer.GetTitledFirstName] ไม่ได้อยู่ที่นี่ แต่นี่อาจเป็นโอกาสที่เรารอคอยอยู่\n\n"
 hunt.7200.accomplice_2:1 "[accomplice.GetTitledFirstName] และ [accomplice_2.GetTitledFirstName] กำลังจับตาดู [murder_target.GetHerHim] อย่างใกล้ชิด เช่นกัน... เราอาจไม่มีโอกาสที่ดีไปกว่านี้อีกแล้ว..."
 hunt.7200.accomplice:1 "ด้วยความช่วยเหลือของ [accomplice.GetTitledFirstName] ในที่สุดข้าอาจกำจัด [murder_target.GetWomanMan] ที่น่ารังเกียจนี้ได้"
 hunt.7200.alone:0 "ข้าอาจไม่มีผู้สนับสนุนในหมู่คณะ แต่ถ้าข้าหาจังหวะที่เหมาะสมได้ ก็ไม่มีอะไรจะปกปิดการกระทำได้ดีไปกว่าการล่าสัตว์"
 hunt.7200.a:0 "วันนี้คือวันนั้น"
 hunt.7200.b:0 "[accomplice.GetFirstNameNoTooltip] จะจัดการเอง"
 hunt.7200.c:0 "ข้าเชื่อใจ [accomplice_2.GetFirstNameNoTooltip] ในเรื่องละเอียดอ่อนนี้"
 hunt.7200.d:0 "ข้าต้องอดทน"
 hunt_murder_accomplice_tt:1 "[THIS.Char.GetShortUIName|U] จะพยายามสังหาร [murder_target.GetShortUIName]"

 hunt.7210.opening:0 "ขณะควบม้าผ่าน [host.GetCurrentLocation.Custom('GetProvinceFoliageDesc')] ตามเสียงแตรและเสียงเห่าหอนของสุนัข ในที่สุด [murder_target.GetTitledFirstName] ก็แยกตัว [murder_target.GetHerselfHimself] ออกจากคณะที่เหลือ\n\n"
 hunt.7210.desc:0 "[murder_target.GetSheHe|U] หยุดครู่หนึ่ง ครุ่นคิดว่าจะไปทางไหนดี"
 hunt.7210.accomplice:0 "ข้าเหลือบมองไปที่ [accomplice.GetFirstName] ผู้ ซึ่งพยักหน้าอย่างเคร่งขรึม คิ้วขมวดด้วยความมุ่งมั่น รอคอยการเคลื่อนไหวของข้า"
 hunt.7210.a:0 "และมันจะเป็นอุบัติเหตุที่น่าเศร้า"
 hunt.7210.a.tt:0 "#EMP ฮึ่ยย่ะ!#!"
 hunt.7210.b:0 "ไม่ ข้าต้องรอเวลา..."

 hunt.7211.desc:0 "ข้าเคลื่อนไหวให้เร็วที่สุดเท่าที่จะทำได้ พุ่งเข้าใส่ [murder_target.GetTitledFirstName] จากด้านข้างเพื่อพยายาม ทำให้ [murder_target.GetHerHim] ตกจากม้า"
 hunt.7211.agent:0 "ข้าไม่อยาก ทำให้ [abduct_schemer.GetFirstName] ผิดหวัง..."
 hunt.7211.accomplice:0 "[accomplice_2.GetFirstName] และ [accomplice.GetFirstName] รีบเข้ามาสมทบอย่างรวดเร็ว"
 hunt.7211.accomplice_2:0 "[accomplice.GetFirstName] เข้าร่วมอย่างรวดเร็วจากอีกด้านหนึ่ง"
 hunt.7211.success:0 "\n\n"[ROOT.Char.GetTitledFirstNameNoTooltip]?! อ๊าก! ท่านทำอะไ-" [murder_target.GetFirstNameNoTooltip] ตกจากหลังม้า [murder_target.GetHerHis] ลงไปใน [ROOT.Char.GetCurrentLocation.Custom('GetProvinceGroundDesc')] ขณะที่ข้ารีบลงจากหลังม้า\n\nการกระทำเสร็จสิ้นก่อนที่ [murder_target.GetSheHe] จะตั้งสติ [murder_target.GetHerselfHimself] ได้ และผู้เห็นเหตุการณ์ใดๆ ก็ยากที่จะระบุสาเหตุของความยุ่งเหยิงนี้ได้"
 hunt.7211.failure:0 "\n\n"[ROOT.Char.GetTitledFirstNameNoTooltip]?! อะไรกันวะ!" [murder_target.GetFirstNameNoTooltip] ตกจากหลังม้าอย่างแรง แต่ก็ตะเกียกตะกายลุกขึ้นยืนได้ [murder_target.GetSheHe|U] วิ่งไปยังคณะที่เหลือขณะที่ข้าพยายามควบคุมม้าของข้ากลับมา มองข้ามไหล่ของ [murder_target.GetHerHis] อย่างหวาดกลัว ตะโกนสุดเสียง ข้าคงตาม [murder_target.GetHerHim] ไม่ทัน..."

 hunt.7212.desc:0 "ข้าหยุดครู่หนึ่งเพื่อจัดอุปกรณ์ของข้า เสียงกิ่งไม้หักดังขึ้นทำลายความเงียบ และข้าเห็น [abduct_actor.GetTitledFirstName] กำลังเข้ามาหาข้าอย่างรวดเร็ว"
 hunt.7212.accomplice_2:0 "[accomplice_2.GetFirstName] และ [accomplice.GetFirstName] ตามมาติดๆ"
 hunt.7212.accomplice:0 "[accomplice.GetFirstName] ตามติด [abduct_actor.GetHerHis] มาอย่างกระชั้นชิด"
 hunt.7212.success:0 "\n\nข้าเห็นความมุ่งมั่นในดวงตาของ [murder_actor.GetFirstNamePossessiveNoTooltip] ช้าเกินไป ไม่สามารถหลบการพุ่งชนของ [murder_actor.GetHerHis] ได้ และถูกส่งลงไปใน [ROOT.Char.GetCurrentLocation.Custom('GetProvinceGroundDesc')] พร้อมกับเสียงตุ้บ\n\nเมื่อข้าได้สติและหันไป [murder_actor.GetSheHe] กำลังยืนคร่อมข้าอยู่ ถือก้อนหินขนาดใหญ่ไว้เหนือศีรษะของ [murder_actor.GetHerHis]! "ลาก่อน [ROOT.Char.GetFirstNameNoTooltip]""
 hunt.7212.failure:0 "\n\nเห็นได้ชัดว่ามีบางอย่างผิดปกติที่นี่ [murder_actor.GetFirstNameNoTooltip] พุ่งเข้าใส่ข้าทันที และข้าก็ล้มลงกับพื้นอย่างงุ่มง่าม แต่ก็สามารถลุกขึ้นยืนได้ขณะที่ [murder_actor.GetSheHe] เสียการทรงตัว [murder_actor.GetHerHis] ใน [ROOT.Char.GetCurrentLocation.Custom('GetProvinceGroundDesc')] พลางสบถ\n\nข้าวิ่งเข้าไปใน [ROOT.Char.GetCurrentLocation.Custom('GetProvinceFoliageDesc')] กรีดร้องขอความช่วยเหลือ คณะเดินทางคงอยู่ไม่ไกล!"
 hunt.7212.a:0 ""อะไร-! ม-""
 hunt.7212.b:0 "วิ่งต่อไป!"

 hunt.7300.t:1 "ช่วงเวลาสนทนา"
 hunt.7300.desc:0 "ขณะรอข่าวจากสุนัขตามกลิ่น คณะพักผ่อนอยู่ในพุ่มไม้ที่มีร่มเงา [befriend_target.GetFirstName] ยืนอยู่ไม่ไกล: นี่คือโอกาสของข้าที่จะสร้างความประทับใจให้ [befriend_target.GetHerHim]\n\n"[befriend_target.GetTitledFirstNameNoTooltip]! ท่านเป็นอย่างไรบ้าง? ไม่บ่อยนักที่เราจะมีโอกาสได้คุยกัน" ข้าเปิดประเด็นอย่างไม่เป็นทางการ\n\n[befriend_target.GetSheHe|U] ดูประหลาดใจ แต่ไม่เป็นศัตรู ต่อการสนทนาของข้า"
 hunt.7301.reply_hunter:0 ""$hunt.7100.a$"\n\n"
 hunt.7301.reply_falconer:0 ""$hunt.7100.b$"\n\n"
 hunt.7301.reply_pity:0 ""$hunt.7100.c$"\n\n"
 hunt.7301.reply_wastrel:0 ""$hunt.7100.d$"\n\n"
 hunt.7301.reply_steward:0 ""$hunt.7100.e$"\n\n"
 hunt.7301.opening:0 "[befriend_actor.GetTitledFirstName] เดินเข้ามาใกล้ขณะที่คณะรอข่าวจากสุนัขตามกลิ่น\n\n[befriend_actor.GetSheHe|U] ยิ้มอย่างอบอุ่น เริ่มบทสนทนา:"
 hunt.7301.hunter:0 "$hunt.7301.reply_hunter$เป็นคำกล่าวที่ข้าหาข้อผิดพลาดไม่ได้"
 hunt.7301.falconer:0 "$hunt.7301.reply_falconer$ตรงประเด็น ข้ารู้แน่ชัดว่า [befriend_actor.GetSheHe] หมายถึงอะไร"
 hunt.7301.pity:0 "$hunt.7301.reply_pity$ข้าปฏิเสธความจริงในคำพูดของ [befriend_actor.GetHerHis] ไม่ได้ มันเป็นกีฬาที่โหดร้าย"
 hunt.7301.wastrel:0 "$hunt.7301.reply_wastrel$มันฟังดูจริงอย่างแน่นอน สิ่งที่มีประโยชน์ทั้งหมดที่ข้าสามารถทำได้แทน..."
 hunt.7301.steward:0 "$hunt.7301.reply_steward$การจัดระเบียบธรรมชาติเป็นสิ่งที่ข้าสามารถเข้าใจได้ในการค้นหาความสุข"
 hunt.7301.fallback:0 "ข้าไม่แน่ใจว่าจะพูดอะไร"
 hunt.7301.a:0 "บางทีเราอาจมีอะไรเหมือนกันมากกว่าที่ข้าคิด"

 hunt.7302.hunter:0 "$hunt.7301.reply_hunter$\n\nข้าไม่เห็นด้วยอย่างยิ่ง..."
 hunt.7302.falconer:0 "$hunt.7301.reply_falconer$\n\nสิ่งเบี่ยงเบนความสนใจเล็กน้อย ไม่มีอะไรมากไปกว่านั้น..."
 hunt.7302.pity:0 "$hunt.7301.reply_pity$\n\nช่างอ่อนแอเสียนี่กระไร โลกนี้โหดร้าย"
 hunt.7302.wastrel:0 "$hunt.7301.reply_wastrel$\n\nเราทุกคนต้องหาเวลาสำหรับสิ่งเบี่ยงเบนความสนใจ"
 hunt.7302.steward:0 "$hunt.7301.reply_steward$\n\nช่างน่าเบื่อเสียนี่กระไร..."
 hunt.7302.fallback:0 "[befriend_actor.GetSheHe|U] ยิ้มอย่างมีความหวัง เห็นได้ชัดว่าคาดหวังความสัมพันธ์ที่ตอบสนองกลับมา"
 hunt.7302.a:0 "ว่าไง นั่นอะไรอยู่ตรงนั้น?"
 hunt.7303.reply:0 "[befriend_target.GetTitledFirstName] ดูเหมือนจะมีอะไรเหมือนกับข้ามาก"
 hunt.7303.hunter:0 "$hunt.7303.reply$ พูดคุยอย่างตื่นเต้นเกี่ยวกับรายละเอียดของสายธนูและกับดัก"
 hunt.7303.falconer:0 "$hunt.7303.reply$ แทบจะไม่สามารถเก็บงำความหลงใหลในการล่าด้วยเหยี่ยวของ [befriend_target.GetHerHis] ไว้ได้"
 hunt.7303.pity:0 "$hunt.7303.reply$ ."
 hunt.7303.wastrel:0 "$hunt.7303.reply$ คร่ำครวญถึงความจำเป็นในการให้ความบันเทิงแก่ราชสำนักด้วยเรื่องเล็กน้อย"
 hunt.7303.steward:0 "$hunt.7303.reply$ กระตือรือร้นที่จะแบ่งปันวิธีการจัดการป่าไม้และสัตว์ป่า"
 hunt.7303.fallback:0 "$hunt.7303.reply$ ผ่อนคลายท่าทีของ [befriend_target.GetHerHis] เมื่ออยู่กับข้า"
 hunt.7303.desc:0 "\n\nเมื่อเราเคลื่อนต่อไป เราแทบจะแยกจากกันไม่ได้ — ข้ารู้ว่าข้าจะหาคำพูดที่เหมาะสมเพื่อเอาชนะใจ [befriend_target.GetHerHim] ได้!"
 hunt.7303.a:0 "ข้าคิดว่าข้าเอาชนะใจ [befriend_target.GetHerHim] ได้แล้ว..."
 hunt.7304.reply:0 "คำพูดของข้าดูเหมือนจะไม่ได้สร้างผลกระทบต่อ [befriend_target.GetTitledFirstName] มากนัก"
 hunt.7304.hunter:0 "$hunt.7304.reply$ เพราะเพียงแค่ยิ้มอย่างสุภาพ กระแอมในลำคอ [befriend_target.GetHerHis] หูผึ่งฟังเสียงในป่า"
 hunt.7304.falconer:0 "$hunt.7304.reply$ เพราะ [befriend_target.GetSheHe] เพียงแค่พยักหน้าตามหน้าที่ ก่อนจะเดินต่อไป"
 hunt.7304.pity:0 "$hunt.7304.reply$ เพราะ [befriend_target.GetSheHe] มองข้าแปลกๆ และเกาหัวของ [befriend_target.GetHerHis]"
 hunt.7304.wastrel:0 "$hunt.7304.reply$ เพราะ [befriend_target.GetSheHe] ดูตกใจอย่างสิ้นเชิงกับคำพูดของข้า"
 hunt.7304.steward:0 "$hunt.7304.reply$ เพราะ [befriend_target.GetSheHe] หมดความสนใจอย่างรวดเร็ว เห็นได้ชัดว่าไม่สนใจเรื่องการจัดการ"
 hunt.7304.fallback:0 "$hunt.7304.reply$ เพราะ [befriend_target.GetSheHe] ไม่พูดอะไร"
 hunt.7304.desc:0 "\n\nเมื่อยืนอยู่คนเดียวหลังจากที่ [befriend_target.GetSheHe] เดินไปคุยกับคนอื่นแล้ว ข้ารู้สึกโง่เขลา..."
 hunt.7304.a:0 "ทำได้ดีมาก [ROOT.Char.GetFirstNameNoTooltip]"

 hunt.7400.t:0 "[ROOT.Char.GetCurrentLocation.Custom('GetTerrainLandPlural')|U] แห่งโอกาส"
 hunt.7400.desc:0 "เราออกจากค่าย เดินย่ำเข้าไปใน [ROOT.Char.GetCurrentLocation.Custom('GetTerrainType')] เป็นแถว ข้าเฝ้าดู [ROOT.Char.Custom2('DescriptorNegative', abduct_target)] [abduct_target.GetTitledFirstName] อย่างใกล้ชิด [abduct_target.GetSheHe] ไม่รู้ถึงแรงจูงใจของข้าเลยแม้ แต่น้อย มัว แต่สนใจการล่าสัตว์อย่างสิ้นเชิง\n\n"
 hunt.7400.agent:0 "[abduct_schemer.GetTitledFirstName] ไม่ได้อยู่กับเรา แต่บางทีข้าต้องฉวยโอกาสนี้หากเราต้องการบรรลุเป้าหมาย\n\n"
 hunt.7400.accomplice_2:0 "[accomplice.GetTitledFirstName] และ [accomplice_2.GetTitledFirstName] ตามมา เฝ้าดูเราทั้งคู่ด้วยความเข้าใจอย่างเงียบๆ..."
 hunt.7400.accomplice:0 "ข้าได้รับความช่วยเหลือจาก [accomplice.GetTitledFirstNamePossessive] หากเราเพียงหาโอกาสที่เหมาะสมได้..."
 hunt.7400.alone:0 "ข้าคงต้องลงมือคนเดียว แต่ด้วยการเตรียมการที่เหมาะสมและองค์ประกอบของความประหลาดใจ [ROOT.Char.GetWomanMan] คนเดียวก็สามารถทำสิ่งที่ยิ่งใหญ่ได้"
 hunt.7400.a:0 "ถึงเวลาลงมือแล้ว"
 hunt.7400.b:0 "ข้าปล่อยให้เป็นหน้าที่ของ [accomplice.GetFirstNameNoTooltip]"
 hunt.7400.c:0 "[accomplice_2.GetFirstNameNoTooltip] สามารถไว้วางใจได้ในเรื่องนี้"
 hunt.7400.d:0 "นี่ไม่ใช่เวลาที่เหมาะสม"
 hunt_abduct_accomplice_tt:0 "[THIS.Char.GetShortUIName|U] จะพยายามลักพาตัว [abduct_target.GetShortUIName]"

 hunt.7410.desc:0 "ในที่สุดข้าก็พบช่วงเวลาที่ข้าและ [abduct_target.GetTitledFirstName] อยู่กันตามลำพัง! สิ่งที่เหลืออยู่คือการดำเนินตามแผน!\n\n"
 hunt.7410.accomplice_2:0 "[accomplice.GetTitledFirstName] และ [accomplice_2.GetTitledFirstName] เฝ้าดูข้า รอให้ข้าเคลื่อนไหวก่อน..."
 hunt.7410.accomplice:0 "[accomplice.GetTitledFirstName] ยืนเตรียมพร้อม เฝ้าดูข้าอย่างกระวนกระวาย..."
 hunt.7410.alone:0 "ข้าทำได้..."
 hunt.7410.a:0 "ถึงเวลาแล้ว!"
 hunt.7410.a.success:0 "ท่านลักพาตัว [abduct_target.GetFirstNameNoTooltip]"
 hunt.7410.a.failure:0 "[abduct_target.GetFirstNameNoTooltip] หนีรอดไปได้"
 hunt.7410.b:0 "#EMP โอ้...#! ข้าทำไม่ได้..."

 hunt.7411.desc:0 "ข้าค่อยๆ เข้าใกล้ [abduct_target.GetTitledFirstName] จากด้านหลัง เลือกจังหวะที่จะจู่โจมอย่างระมัดระวัง"
 hunt.7411.agent:0 "$hunt.7211.agent$"
 hunt.7411.accomplice_2:0 "ในเวลาเดียวกัน [accomplice_2.GetFirstName] และ [accomplice.GetFirstName] เข้าใกล้จาก แต่ละด้าน"
 hunt.7411.accomplice:0 "[accomplice.GetFirstName] พยายามหาอีกมุมหนึ่งเพื่อเข้าถึง [abduct_target.GetHerHim]"
 hunt.7411.success:0 "\n\nข้าจับ [abduct_target.GetHerHim] ได้โดยไม่ทันตั้งตัว ทำให้ [abduct_target.GetHerHim] ล้มลงอย่างแรงบน [ROOT.Char.GetCurrentLocation.Custom('GetProvinceGroundDesc')] ขณะที่ [abduct_target.GetSheHe] นอนนิ่ง มึนงง ข้ามัดมือของ [abduct_target.GetHerHis] ด้วยเชือก\n\n[abduct_target.GetSheHe|U] พลิกตัว ดวงตาเต็มไปด้วยความกลัวและความสับสน"
 hunt.7411.failure:0 "\n\n[abduct_target.GetSheHe|U] เกือบจะถูกจับโดยไม่ทันตั้งตัว แต่แข็งแรงกว่าที่ [abduct_target.GetSheHe] ดู! [abduct_target.GetSheHe|U] รู้ตัวอย่างรวดเร็วว่าเกิดอะไรขึ้น มองเห็นเชือกในมือข้า และวิ่งหนีเข้าไปใน [ROOT.Char.GetCurrentLocation.Custom('GetProvinceFoliageDesc')] ร้องเรียกคนอื่นๆ..."
 hunt.7411.a:0 "ข้าจับเจ้าได้แล้ว เจ้าหนอนน้อย!"
 hunt.7411.b:0 "เจ้าหนอนลื่นไหล!"
 
 hunt.7412.success:0 "\n\nก่อนที่ข้าจะมีโอกาสสอบถาม [abduct_actor.GetFirstNameNoTooltip] ก็ผลักเข้าใส่ข้าด้วยสุดกำลัง [abduct_actor.GetHerHis] ส่งผลให้ข้าล้มกลิ้งไปบน [ROOT.Char.GetCurrentLocation.Custom('GetProvinceGroundDesc')]\n\nขณะที่ข้านอนมึนงงอยู่ ข้ารู้สึกว่ามือของข้าถูกมัดด้วยเชือก! การลักพาตัว?!"
 hunt.7412.failure:0 "\n\nข้ารู้สึกว่ามีบางอย่างผิดปกติ ดวงตาของ [abduct_actor.GetFirstNameNoTooltip] เป็นประกายด้วยความมุ่งมั่นที่ไม่สบายใจ [abduct_actor.GetSheHe|U] เคลื่อนไหวเพื่อผลักข้า แต่เพียงแค่เฉี่ยวข้าไป เสียการทรงตัว [abduct_actor.GetHerHis] และล้มลงกับพื้น ขดเชือกอยู่ใน [ROOT.Char.GetCurrentLocation.Custom('GetProvinceGroundDesc')] ข้างๆ [abduct_actor.GetHerHim]!\n\nข้าวิ่งเข้าไปใน [ROOT.Char.GetCurrentLocation.Custom('GetProvinceFoliageDesc')] ขณะที่ [abduct_actor.GetSheHe] นอนครวญคราง ร้องเรียกคนอื่นๆ..."
 hunt.7412.a:0 ""[abduct_actor.GetFirstNameNoTooltip]! อะไ-""

 hunt.7800.t:0 "จากที่ไหนก็ไม่รู้"
 hunt.7800.desc:0 "ข้าหยุดเพื่อดื่มน้ำจากถุงหนัง ชิมรสความเย็นสดชื่นจากเหงื่อและความโกลาหลของการไล่ล่า ขณะที่ข้าเก็บมันไว้ข้างตัว ข้าได้ยินเสียงหวีดหวิวต่ำๆ\n\n"
 hunt.7800.tree:0 "ลูกธนูปักเข้ากับต้น [ROOT.Char.GetCurrentLocation.Custom('GetRandomRegionalWood')] ข้างๆ ข้าพร้อมกับเสียง #EMP ปัก#!! อันดังสนั่น"
 hunt.7800.ground:1 "ลูกธนูปักเข้ากับ [ROOT.Char.GetCurrentLocation.Custom('GetProvinceGroundDesc')] ที่เท้าข้า ฝังลึกลงไปในดิน"
 hunt.7800.closing:0 "\n\nข้าและคนที่อยู่ใกล้ที่สุดหมุนตัวไปรอบๆ แต่ไม่มีใครอยู่ที่นั่น มีเพียงลมที่พัดผ่าน [ROOT.Char.GetCurrentLocation.Custom('GetProvinceFoliageDesc')]..."
 hunt.7800.a:0 "#EMP เฮ้ย!#! ระวังหน่อยสิ!"
 hunt.7800.b:0 "นี่ต้องเป็นของ #EMP ใครสักคน#!..."
 hunt.7800.b.success:0 "ท่านพบเจ้าของมัน"
 hunt.7800.b.failure:0 "ไม่มีเบาะแส"
 hunt.7800.b.tt:0 "ท่านเผชิญหน้ากับมือธนู"
 hunt.7800.c:0 "#EMP มือสังหาร!#! เร็วเข้า! พาข้าออกไปจากที่นี่!"

 hunt.7801.t:0 "จากที่ไหนก็ไม่รู้"
 hunt.7801.desc:0 "เมื่อตรวจสอบลูกธนูอย่างละเอียด ข้าพบว่าขนนกที่ติดอยู่นั้นมีโครงสร้างที่ไม่ธรรมดา ซึ่งแน่นอนว่าจะ ทำให้มันแตกต่างจากของสมาชิกคนอื่นๆ ในคณะ\n\nเมื่อแอบสอดส่องดูซองธนูของเพื่อนนักล่า ข้าก็พบตัวการในไม่ช้า...\n\n"ไม่นะ ได้โปรด! นาย [ROOT.Char.GetLadyLord] ของข้า! บางทีข้าอาจจะกระตือรือร้นเกินไป ปล่อยลูกธนูไปในพงหญ้า แต่มันปราศจากเจตนาร้าย! ข้าขอร้องท่าน!"
 hunt.7801.a:0 "ข้าจะปล่อยเจ้าไป #EMP ครั้งนี้#!."
 hunt.7801.b:0 "ไร้สาระ จับ [culprit.GetHerHim] ใส่ตรวน เราจะกลับกันแล้ว"

 hunt.8001.t:1 "ตัวอย่างอันงดงาม"
 hunt.8001.desc:2 "ขณะที่เรากลับจาก [host.GetCurrentLocation.GetName] พร้อมกับ [activity.Custom('GetAnimalType')] ที่ล้มลงแล้ว ข้าอดไม่ได้ที่จะชื่นชมมันแม้ในยามตาย ช่างเป็นตัวอย่างที่งดงามเสียนี่กระไร – ข้าสามารถจินตนาการถึงหนังหรือกะโหลกของมันประดับผนังราชสำนักของข้าได้อย่างง่ายดาย! โอ้ แต่จะเลือกตัวเลือกไหนดี?"
 hunt.8001.a:1 "ขนอันหนานุ่มของมันจะเป็นหัวข้อสนทนาที่ยอดเยี่ยม"
 hunt.8001.b:1 "สตาฟหัวมันไว้ แขกของข้าจะได้เห็นความสง่างามของมัน!"
 hunt.8001.c:0 "มาสนใจงานเลี้ยงแสนอร่อยแทนที่จะเป็นซากสัตว์เป็นของรางวัลกันเถอะ!"
  
 hunt.8200.t: "ฝึกเหยี่ยว"
 hunt.8200.desc: "ข้าทอดสายตามองขอบฟ้าเบื้องหน้า ดวงอาทิตย์ยามรุ่งอรุณนำพาวันที่เต็มไปด้วยความหวัง [ROOT.Char.Custom('GetHuntMasterDesc')] ของข้า [master_hunter.GetName] เยื้องย่างเข้ามาพร้อม [ROOT.Char.Custom('GetRaptorType')] ของข้าในมือ และประกายในดวงตาของ [master_hunter.GetHerHis]\n\n“ข้ารู้ว่าเรามีการล่าสัตว์ที่ต้องไป แต่ช่างเป็นเช้าที่แจ่มใสนัก! ด้วยความหิวในท้องนกของท่านและความเย็นบนพื้นดิน เหยื่อจะพร้อมให้ล่าอย่างยิ่ง กรงเล็บ [ROOT.Char.Custom('GetRaptorTypePossessive')] ของท่านจะยิ่งเฉียบคมขึ้นเพื่อการละเล่นที่กำลังจะมาถึง”"
 hunt.8200.a: "ข้าไม่อาจเข้าสู่สมรภูมิด้วยดาบที่ทื่อด้าน"
 hunt.8200.a.flavor: "ข้ายินดีที่จะฝึกฝนก่อนถึงวันสำคัญ"
 hunt.8200.b: "แต่ผู้ใดเล่าจะอยู่ที่นี่เพื่อเป็นประจักษ์พยานในชัยชนะของข้า!?"
 hunt.8200.b.flavor: "ข้ายืนกรานให้เรารีบเร่งไปล่าสัตว์"

 hunt.8210.t: "ถูกล่าขณะล่าเหยี่ยว"
 hunt.8210.desc: "เพื่อเตรียมพร้อมสำหรับการล่าที่กำลังจะมาถึง ข้าอาบน้ำแสงจันทร์ ชำระล้างตนเองและ [hunted_hawker.Custom('GetRaptorType')] ของข้า\n\nทันใดนั้น ด้านหลังข้า ข้าได้ยินเสียงกรอบแกรบ แล้วจึงรู้สึกถึงลมหายใจของใครบางคนบนต้นคอ\n\n“บางทีท่านอาจจะเป็นเหยื่อของข้าในเย็นนี้ นานๆ ทีข้าจะได้ลิ้มรสอาหารอันโอชะ ด้วยข้าหมกมุ่นอยู่กับหน้าที่ของตน”\n\nกลิ่นธูปหอมอันมัวเมาจาก [local_temple.Custom('GetLocationFaithTemple')] ที่อยู่ใกล้เคียงใน [local_temple.GetBaronyNameExplicitlyNoTooltip] ครอบงำสติสัมปชัญญะของข้า นี่อาจจะเป็น [shrine_maiden.Custom('PriestTitle')] ประจำท้องที่หรือ"
 hunt.8210.a: "ข้าเป็นผู้ใดกันที่จะปฏิเสธความปรารถนาแห่งทวยเทพ"
 hunt.8210.a.flavor: "ค่ำคืนแห่งตัณหาของท่านบ่มเพาะความสามารถทางกวีของท่าน"
 hunt.8210.b: "ปล่อยข้า ข้าต้องเก็บเรี่ยวแรงไว้สำหรับการล่า!"
 hunt.8210.b.flavor: "ท่านปฏิเสธเทพธิดาแห่งแรงบันดาลใจ"
 
 hunt.8211.opening: "[shrine_maiden.Custom2('AppropriateGreeting', ROOT.Char)]"
 hunt.8211.desc: "$love_artifact_poetry_name$\n\n#EMP “เมื่อคืนท่านเดินทางมาหาข้า หรือเป็นข้าที่แสวงหาท่าน\n\nข้าจำไม่ได้\n\nทั้งข้าก็ไม่รู้ว่าข้ากำลังเปี่ยมสุขอันผูกพันอยู่กับดินแดนแห่งความฝัน\n\nหรือความสุขเกษมเช่นนั้นเป็นเรื่องจริง”#!"
 hunt.8211.a: "[ROOT.Char.Custom('GetCourt')] จะได้ยินถึงความปรีดิ์เปรมที่เรามีร่วมกัน!"
 hunt.8211.b: "ข้าจะทะนุถนอมสิ่งบันทึกอันเป็นนิรันดร์นี้แห่งตัณหาของเรา"
 love_artifact_poetry_name: "ข้าข้ามสะพานแห่งสุขเกษม"
 love_artifact_poetry_description:1 "ผลงานกวีนิพนธ์อุทิศแด่ [ROOT.Char.GetTitledFirstName] เพื่อเฉลิมฉลองเมื่อครั้ง [sex_memory.GetDescription] เขียนโดยชู้รักของ [ROOT.Char.GetFirstNamePossessiveOrMyNoTooltip] [shrine_maiden.GetTitledFirstName]\n\n#EMP $hunt.8211.desc$#!"
 love_poetry_artifact_appended_desc: "ผลงานกวีนิพนธ์อุทิศแด่ [ROOT.Char.GetTitledFirstName] เพื่อเฉลิมฉลองเมื่อครั้ง [sex_memory.GetDescription] เขียนโดยชู้รักของ [ROOT.Char.GetFirstNamePossessiveOrMyNoTooltip] [shrine_maiden.GetTitledFirstName]\n\nมันอ่านว่า:\n#EMP $hunt.8211.desc$#!"
 hunt.8211.a_effect: "[newly_created_artifact.GetName] ถูกสร้างเป็น [court_artifact|E] และจะได้รับค่าปรับ แต่ง [grandeur|E]"
 hunt.8211.b_effect: "ท่านได้รับ [newly_created_artifact.GetName] [artifact|E]"
 hunt.9001.t: "ของขวัญจากพงไพร"
 hunt.9001.opening_falconry_self: "ข้ารวบรวมนกที่ล่ามาได้ ซึ่งถูก [activity.Custom('GetRaptorPlural')] ของเราจัดการ"
 hunt.9001.opening_falconry_master_of_hunt:1 "[hunt_participant.GetTitledFirstName] [ROOT.Char.Custom('GetHuntMasterDesc')] รวบรวมนกที่ [activity.Custom('GetRaptorPlural')] ของเราล่ามาได้"
 hunt.9001.opening_falconry_courtier:1 "[hunt_participant.GetTitledFirstName] รวบรวมนกที่ [activity.Custom('GetRaptorPlural')] ของเราล่ามาได้"
 hunt.9001.opening_captive_master_of_hunt:0 "[hunt_participant.GetTitledFirstName] [ROOT.Char.Custom('GetHuntMasterDesc')] ตรวจสอบเชือกที่มัดสัตว์"
 hunt.9001.opening_captive_courtier:0 "[hunt_participant.GetShortUINameNoFormat] ตรวจสอบเชือกที่มัดสัตว์"
 hunt.9001.opening_captive_self:0 "ข้าตรวจสอบเชือกที่มัดสัตว์"
 hunt.9001.opening_master_of_hunt:1 "[hunt_participant.GetTitledFirstName] [ROOT.Char.Custom('GetHuntMasterDesc')] สั่งการชำแหละซาก"
 hunt.9001.opening_courtier:0 "[hunt_participant.GetShortUINameNoFormat] สั่งการชำแหละซาก"
 hunt.9001.opening_self:0 "ข้าสั่งการชำแหละซาก"
 hunt.9001.opening_captive:0 "เฝ้าดู [host.Custom('GetAnimalTypeCaptive')] ที่ถูกมัด และสั่งการผู้ดูแลที่กำลังแบกมันอย่างระมัดระวัง"
 hunt.9001.opening_master:1 "แล่หนังสัตว์อย่างเชี่ยวชาญโดยไม่เปื้อนเลือดแม้ แต่หยดเดียว"
 hunt.9001.opening_skilled:1 "แล่หนังสัตว์อย่างคล่องแคล่วด้วยความแม่นยำและรวดเร็ว"
 hunt.9001.opening_beginner:0 "แล่หนังสัตว์อย่างระมัดระวังตามคำแนะนำของนายพราน"
 hunt.9001.opening_novice:0 "แล่หนังสัตว์อย่างงุ่มง่ามก่อนจะปล่อยให้นายพรานเข้ามาทำแทน"
 hunt.9001.opening:0 "ข้าสั่งการชำแหละเนื้อ ให้รางวัลแก่สุนัขล่าเนื้อด้วยส่วนแบ่งของพวกมัน"
 hunt.9001.opening_falconry:0 "ผลผลิตจากเกม และเครื่องวัดการฝึกฝนที่ดีของนกของเรา"

 hunt.9001.credit_self:0 "มันไม่ใช่สัตว์ร้ายอะไรนัก แต่ข้าก็ฆ่ามันด้วยตัวเอง\n\n"
 hunt.9001.credit_self_big:0 "เมื่อยืนอยู่ที่นี่ตอนนี้ แทบไม่อยากเชื่อว่าข้าล้มสัตว์ร้ายตัวนี้ลงได้ด้วยตัวเอง\n\n"
 hunt.9001.credit_other:0 "[credit_taker.GetFirstName] มีความสุขเป็นพิเศษกับการฆ่าของ [credit_taker.GetHerHis]\n\n"
 hunt.9001.credit_other_big:0 "[credit_taker.GetFirstName] ทำผลงานได้ยอดเยี่ยมในการล้มสัตว์ร้ายที่ทรงพลัง เช่นนี้\n\n"
 hunt.9001.credit_shared:0 "แม้ว่าเหยื่ออาจจะตัวเล็ก แต่คณะก็ยังคงปลาบปลื้มกับความพึงพอใจของการล่าที่ดี\n\n"
 hunt.9001.credit_shared_big:0 "ไม่มีอะไรเทียบได้กับความตื่นเต้นของการล้มสัตว์ร้ายที่ทรงพลัง\n\n"
 hunt.9001.opening_compassionate:1 "ข้าอดไม่ได้ที่จะชื่นชม [activity.Custom('GetAnimalType')] แม้ในยามตาย\n\n"
 hunt.9001.opening_callous:1 "[activity.Custom('GetAnimalType')] ที่ไร้ค่าไม่มีโอกาสสู้กับเราเลย...\n\n"
 hunt.9001.opening_ambitious:0 "ข้าได้ แต่จินตนาการถึงสัตว์ร้ายที่น่าภาคภูมิใจอื่นๆ ที่รอคอยการถูกล่า...\n\n"
 hunt.9001.opening_content:1 "นี่คือช่วงเวลาที่ควรค่าแก่การจดจำ: สหายที่ดีและ [activity.Custom('GetAnimalType')] ที่ดี\n\n"
 hunt.9001.opening_martial:1 "การออกนอกสถานที่ที่ดี [activity.Custom('GetAnimalType')] มอบรสชาติเล็กน้อยของความผันผวนในสนามรบ\n\n"
 hunt.9001.opening_learning:1 "ข้ามองดูซาก [activity.Custom('GetAnimalType')] ครุ่นคิดถึงกายวิภาคและความฉลาดที่น่าประหลาดใจของมัน...\n\n"
 hunt.9001.desc_court_artifact:0 "ข้าจินตนาการถึงหนังหรือกะโหลกของมันประดับผนังราชสำนักของข้า\n\n"
 hunt.9001.desc_trinket:0 "ของที่ระลึกจากวันนี้จะช่วยรักษาความทรงจำให้คงอยู่\n\n"
 hunt.9001.desc_hunter_1:1 "ข้าจัดการล่ามาพอสมควรแล้ว และผู้คนรอบข้างก็เริ่มสังเกตเห็น – ข่าวเกี่ยวกับกิจกรรมของข้ากำลังแพร่กระจายออกไป!"
 hunt.9001.desc_hunter_2:1 "[ROOT.Char.Custom('TerrainType')] เปรียบเสมือนบ้านหลังที่สองของข้า – การได้สัมผัสสายลมที่ปะทะเส้นผม การได้ใช้เวลากับข้าราชสำนัก การได้รู้สึกตื่นเต้นเมื่อเข้าใกล้เหยื่อ...ข้าภาวนาขอให้อย่าได้มีวันสิ้นสุด!"
 hunt.9001.desc_hunter_3:0 "ไม่ว่าเหยื่อจะเร็ว แข็งแกร่ง หรือเจ้าเล่ห์เพียงใด มันก็ไม่มีโอกาสสู้ข้าได้! ความเก่งกาจของข้าในฐานะนักล่าเป็นหัวข้อสนทนามากมายทั่วทั้งอาณาจักร อย่างไรก็ตาม รางวัลที่แท้จริงคืออิสรภาพที่ [ROOT.Char.Custom('TerrainType')] มอบให้ข้า"
 hunt.9001.falconry:0 "น่าเสียดายที่ต้องกลับเร็วขนาดนี้ ข้าสามารถทำสิ่งนี้ได้ทั้งวัน! แต่นกก็ต้องการพักผ่อน เช่นกัน"
 hunt.9001.desc_good_bad:1 "แม้จะมีปัญหาเล็กน้อยระหว่างทาง แต่การล่าก็ดำเนินไปได้ด้วยดี!"
 hunt.9001.desc_good:1 "การล่า เช่นนี้เป็นความสุขอย่างแท้จริง ข้ารอปีหน้าไม่ไหวแล้ว!"
 hunt.9001.desc_bad_good:1 "ทุกสิ่งที่อาจผิดพลาดได้ดูเหมือนจะเกิดขึ้น แต่ก็ยังมีสิ่งดีๆ ให้พบเจอ"
 hunt.9001.desc_bad:1 "คณะของเราดูเหมือนจะประสบกับความทุกข์ยากที่ดูเหมือนไม่มีที่สิ้นสุด และข้าเกือบจะโล่งใจที่ได้ทิ้ง [ROOT.Char.Custom('TerrainType')] ไว้เบื้องหลัง"
 hunt.9001.desc_same:1 "การตอบรับเสียงเรียกจากพงไพรคือการผจญภัย และการออกนอกสถานที่ครั้งนี้ก็มอบทั้งสิ่งดีและสิ่งร้ายอย่างมากมาย!"
 hunt.9001.desc_fallback:1 "การตอบรับเสียงเรียกจากพงไพรโดยปกติแล้วคือการผจญภัย แต่ข้าต้องยอมรับว่าข้าพบว่าการออกนอกสถานที่ครั้งนี้น่าลืมเลือนไปเสียหน่อย"
 hunt.9001.spoils_captive:0 "\n\nการล้มสัตว์ป่าเป็นเรื่องหนึ่ง แต่การจับมันทั้งเป็นและไม่บุบสลายนั้นเป็นความสำเร็จที่แตกต่างออกไป!"
 hunt.9001.spoils:0 "\n\nเราวางส่วนแบ่งของสุนัขที่กระตือรือร้นลงบนหนังสัตว์ที่ขึงไว้ ก่อนจะออกเดินทางกลับค่ายและบ้าน"
 hunt.9001.spoils_falconry:0 "\n\n[activity.Custom('GetRaptorType')] ของข้ากินเศษเนื้ออย่างมีความสุข เป็นรางวัลสำหรับผลงานอันยอดเยี่ยมในวันนี้ ก่อนที่เราจะออกเดินทางกลับค่ายและบ้าน"
 hunt.9001.murder_secret:1 "[ROOT.Char.GetIntentTarget.GetFirstName] นอนตายอยู่ และไม่มีใครรู้ว่าข้าอยู่เบื้องหลัง...\n\n"
 hunt.9001.murder_public:1 "[ROOT.Char.GetIntentTarget.GetFirstName] นอนตายอยู่ แม้ว่าทุกคนจะรู้ว่าข้าเป็นผู้รับผิดชอบ...\n\n"
 hunt.9001.murder_dead:1 "[ROOT.Char.GetIntentTarget.GetFirstName] นอนตายอยู่ แม้ว่าจะไม่ใช่ด้วยน้ำมือข้า...\n\n"
 hunt.9001.murder_fail:1 "น่าเสียดายจริงๆ ที่ [ROOT.Char.GetIntentTarget.GetFirstName] ยังมีชีวิตอยู่...\n\n"
 hunt.9001.woo_soulmate:1 "[ROOT.Char.GetIntentTarget.GetFirstName] และข้าได้สร้างสายสัมพันธ์พิเศษขึ้น ความแข็งแกร่งของมัน ทำให้แม้ แต่ข้าก็ประหลาดใจ...\n\n"
 hunt.9001.woo_lover:1 "[ROOT.Char.GetIntentTarget.GetFirstName] ไม่มีโอกาสต่อต้านการเกี้ยวพาราสีอันมีเสน่ห์ของข้าเลย...\n\n"
 hunt.9001.woo_potential:1 "ข้าดึงดูดความสนใจของ [ROOT.Char.GetIntentTarget.GetFirstName] ได้ แต่ยังต้องใช้ความพยายามมากขึ้นหากข้าต้องการเอาชนะใจ [woo_target.GetHerHis]...\n\n"
 hunt.9001.woo_fail:1 "[ROOT.Char.GetIntentTarget.GetFirstName] ไม่ประทับใจกับการเกี้ยวพาราสีของข้า... ข้าคงต้องลองเปลี่ยนกลยุทธ์...\n\n"
 hunt.9001.befriend_best:1 "[ROOT.Char.GetIntentTarget.GetFirstName] และข้ากลายเป็นเพื่อนสนิทกันอย่างรวดเร็ว เกินความคาดหมายทั้งหมดของข้า...\n\n"
 hunt.9001.befriend_friend:1 "[ROOT.Char.GetIntentTarget.GetFirstName] เป็นมิตรกับข้ามาก ข้าคิดว่าข้าสามารถพึ่งพา [befriend_target.GetHerHim] ได้...\n\n"
 hunt.9001.befriend_potential:1 "แม้ว่าจะยังมีความเป็นทางการอยู่บ้างระหว่าง [ROOT.Char.GetIntentTarget.GetFirstName] และข้า แต่เราก็ใกล้ชิดกันมากขึ้นกว่าเดิม...\n\n"
 hunt.9001.befriend_fail:1 "ข้ายังไม่เข้าใกล้การได้รับความไว้วางใจจาก [ROOT.Char.GetIntentTarget.GetFirstName] เลย ข้าต้องทำอะไรผิดพลาดแน่ๆ...\n\n"
 hunt.9001.a:1 "เรากลับมาแล้ว เปี่ยมด้วยพลังใจ!"
 hunt.9001.b:2 "เราทำดีที่สุดแล้ว..."
 hunt.9001.c:0 "ปล่อยให้การผจญภัยนี้อยู่เบื้องหลังไปก่อน"
 hunt.9001.d.choice:0 "ข้าจะเก็บแค่ของที่ระลึกไว้"
 hunt.9001.d:1 "ข้าจะเก็บของที่ระลึกไว้"
 hunt.9001.e:0 "ข้าจะเก็บขนนกไว้"
 hunt.9001.f:0 "[ROOT.Char.Custom2('RelationToMeShort', trophy_recipient)] ของข้า [trophy_recipient.GetTitledFirstNameNoTooltip] จะชื่นชมของรางวัลนี้"
 hunt.9001.f.present:0 "[trophy_recipient.GetTitledFirstNameNoTooltip] [ROOT.Char.Custom2('RelationToMeShort', trophy_recipient)] ที่ดีของข้า มันเป็นของท่าน!"
 hunt.9001.g:0 "[animal_slayer.GetTitledFirstName] ล้มมันลง มันเป็นของ [animal_slayer.GetHerHim]"

 hunt.9002.t:0 "มือเปล่า"
 hunt.9002.opening_master_of_hunt:1 "[ROOT.Char.Custom('GetHuntMasterDesc')] [hunt_participant.GetTitledFirstName] รวบรวมคณะที่ผิดหวังและสุนัขล่าเนื้อที่เหนื่อยล้าเพื่อเดินทางกลับบ้าน"
 hunt.9002.opening_courtier:1 "[hunt_participant.GetTitledFirstName] รวบรวมคณะที่ผิดหวังและสุนัขล่าเนื้อที่เหนื่อยล้าเพื่อเดินทางกลับบ้าน"
 hunt.9002.opening:1 "ข้ารวบรวมคณะที่ผิดหวังและสุนัขล่าเนื้อที่เหนื่อยล้าเพื่อเดินทางกลับบ้าน"
 hunt.9002.opening_animal:1 "\n\n[activity.Custom('GetAnimalType')] หลุดรอดจากเราไปได้จริงๆ #EMP ครั้งนี้#!..."
 hunt.0540.t:0 "นายพรานหลวง"
 hunt.0540.desc.intro:0 "การล่าของข้ากำลังจะเริ่มขึ้น และข้ายังไม่ได้ แต่งตั้ง [ROOT.Char.Custom('GetHuntMasterDesc')] แน่นอนว่าข้าสามารถรับผิดชอบหน้าที่ดังกล่าวด้วยตนเองได้ แต่ [ROOT.Char.GetTitleAsNameNoTooltip|U] ที่ดีทุกคนควรรู้ว่าเมื่อใดควรมอบหมายงาน"
 hunt.0540.desc.hates_candidate_a:0 "แม้ข้าจะไม่อยากยอมรับนัก แต่ [moh_candidate_1.GetFirstName] ผู้ [host.Custom2('InsultAdjective', ROOT.Char)] คือผู้ที่เหมาะสมที่สุดสำหรับตำแหน่งนี้\n\n"
 hunt.0540.desc.candidate_a:0 "[moh_candidate_1.GetWomanMan] ที่มีคุณสมบัติเหมาะสมที่สุดสำหรับงานนี้คือ [moh_candidate_1.GetName] และ [moh_candidate_1.GetSheHe] ดูเหมือนจะกระตือรือร้นที่จะพิสูจน์ [moh_candidate_1.GetHerselfHimself]\n\n"
 hunt.0540.desc.nepotism:0 "อย่างไรก็ตาม [moh_candidate_2.Custom2('MyCharacterIntroduction', ROOT.Char)] ก็จะเป็นผู้สมัครที่เหมาะสมและน่าเชื่อถือเท่าที่ข้าจะขอได้\n\n"
 hunt.0540.desc.enthusiasm:0 "[moh_candidate_3.Custom2('MyCharacterIntroduction', ROOT.Char)|U] ดูเหมือนจะมุ่งมั่นในตำแหน่งนี้อย่างแรงกล้า แม้ว่า [moh_candidate_3.GetSheHe] จะไม่เชี่ยวชาญเท่า [moh_candidate_1.GetFirstNameNoTooltip] ก็ตาม\n\n"
 hunt.0540.desc.outro:0 "แต่ข้าก็ไม่จำเป็นต้อง แต่งตั้งใครเลยก็ได้"
 hunt.0540.a:0 "[moh_candidate_1.GetFirstNameNoTooltip|U] เป็นผู้สมัครที่ดีที่สุด"
 hunt.0540.b:0 "ข้าสามารถไว้วางใจ [moh_candidate_2.GetFirstNameNoTooltip|U] ได้"
 hunt.0540.c:0 "[moh_candidate_3.GetFirstNameNoTooltip|U] มีความกระตือรือร้น"
 hunt.0540.d:0 "ข้าไม่ต้องการใคร"
 friend_made_me_moh:0 "[CHARACTER.GetShortUIName|U] ได้รับความกตัญญูชั่วนิรันดร์จาก [TARGET_CHARACTER.GetShortUINamePossessive] โดยการมอบตำแหน่ง $master_of_hunt_court_position$"
 friend_made_me_moh_corresponding:0 "[TARGET_CHARACTER.GetShortUIName|U] ได้รับความกตัญญูชั่วนิรันดร์จาก [CHARACTER.GetShortUINamePossessive] โดยการมอบตำแหน่ง $master_of_hunt_court_position$"

 hunt.0550.t:0 "การตั้งค่ายพัก"
 hunt.0550.host:0 "ในขณะที่เรารอการมาถึงของแขกคนอื่นๆ [ROOT.Char.Custom('GetServants')]ของข้าก็เริ่มลงมือเตรียมการ [ROOT.Char.Custom('GetGameKeepers')]ตรวจตรา [activity.GetCurrentPhase.GetLocation.Custom('GetTerrainLandPlural')] ทุกวันเพื่อค้นหาร่องรอยของเหยื่อ พร้อมทั้งตั้งค่ายให้ใกล้กับลานล่าสัตว์มากขึ้น\n\n"
 hunt.0550.guest:0 "ขณะที่เรารอการมาถึงของแขกที่เหลือ [host.GetTitledFirstName] ได้เริ่มเตรียมการแล้ว [host.GetHerHis|U] [host.Custom('GetGameKeepers')] ตรวจสอบ [activity.GetCurrentPhase.GetLocation.Custom('GetTerrainLandPlural')] ทุกวันเพื่อหาสัญญาณของเหยื่อ ขณะเดียวกันก็สร้างค่ายพักใกล้กับพื้นที่ล่าสัตว์มากขึ้น\n\n"
 hunt.0550.nerge.host.desc: "ในขณะที่เรารอการมาถึงของแขกคนอื่นๆ [ROOT.Char.Custom('GetServants')]ของข้าก็เริ่มลงมือเตรียมการ [ROOT.Char.Custom('GetGameKeepers')]กำลังกำหนดพื้นที่ที่ผู้เข้าร่วมจะต้อนสัตว์ทั้งหมดมารวมกันเพื่องาน Nerge อันยิ่งใหญ่ การรู้จักภูมิประเทศถือเป็นก้าวแรกจากหลายๆ ก้าวสู่ความสำเร็จ\n\n"
 hunt.0550.nerge.guest.desc: "ขณะที่เรารอแขกที่เหลือมาถึง [host.GetTitledFirstName]ได้เริ่มเตรียมการแล้ว [host.GetHerHis|U] [host.Custom('GetGameKeepers')]กำลังพิจารณาว่าผู้เข้าร่วมจะรวบรวมสัตว์ทั้งหมดไว้ในพื้นที่ใดสำหรับการล่าเนอร์เกอันยิ่งใหญ่ การรู้จักพื้นที่เป็นก้าวแรกของหลายๆ ก้าวสู่ความสำเร็จ\n\n"
 hunt.0550.sighting:0 "[activity.Custom('GetAnimalPlural')] เหล่านั้นอยู่ใกล้... ข้ารู้สึกได้..."
 hunt.0550.falconry:0 "นกของข้าเริ่มกระสับกระส่ายขณะรอคอย รู้ว่าอีกไม่นานมันจะถูกปล่อย..."
 hunt.0550.legendary:0 "ข้างนอกนั่น ที่ไหนสักแห่ง [activity.Custom('GetAnimalType')] [activity.Custom('GetLegendaryColor')] รอคอยและเฝ้ามองอยู่..."
 hunt.0550.nerge: "อาชาของข้าตื่นเต้นกับโอกาสในการล่าไม่น้อยไปกว่าข้า มันรู้ว่าความท้าทายอันยิ่งใหญ่กำลังรอเราอยู่ในอีกสองสามวันข้างหน้า"
 hunt.0550.standard:0 "ข้าตรวจสอบอุปกรณ์และม้าของข้าหลายครั้งแล้ว อีกไม่นานแล้ว..."
 hunt.0550.intent_arrived:0 "\n\n[ROOT.Char.GetIntentTarget.GetTitledFirstName] ยังคงไม่รู้ถึงแผนการของข้าที่จะ [ROOT.Char.GetInvolvedActivityIntent.GetName|l] [ROOT.Char.GetIntentTarget.GetHerHim] เลยแม้ แต่น้อย"
