 hunt_had_poem_written_about_self_log: "[CHARACTER.GetShortUIName] มีบทกวีที่เขียนเกี่ยวกับ [CHARACTER.GetHerselfHimself]"
 hunt_had_poem_written_about_their_love_interest_log_title: "$tgp_hunt.0006.t$"
 hunt_had_poem_written_about_their_love_interest_log: "[CHARACTER.GetShortUIName|U] มีบทกวีที่เขียนเกี่ยวกับ [seduction_target.GetShortUIName]"
