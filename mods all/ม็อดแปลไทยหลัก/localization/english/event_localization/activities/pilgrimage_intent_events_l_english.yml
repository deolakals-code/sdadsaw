l_english: 
 # Missionary, console a local
 pilgrimage_intent.1000.t:0 "$zealotry_intent_header$ วิกฤตศรัทธา"
 pilgrimage_intent.1000.desc:0 "ขณะที่ข้าเดินทางแสวงบุญต่อไป ข้าพบ [sad_peasant.GetWomanMan] คนหนึ่งข้างทาง เนื้อตัวเปรอะเปื้อนไปด้วยสิ่งสกปรกและเปียกชุ่มไปด้วยน้ำตา [sad_peasant.GetHerHis]\n\n"ตอนนี้ท่านมีความสุขแล้วหรือ? ท่านเอาทุกอย่างไปจากข้าแล้ว! ข้าจะดำเนินชีวิตต่อไปได้อย่างไรในโลกที่ปกครองโดยสิ่งมีชีวิตที่โหดร้าย เช่น [sad_peasant.GetFaith.HighGodName|U]?"\n\nเห็นได้ชัดว่า [sad_peasant.GetSheHe] สิ้นหวังและกำลังประสบวิกฤตศรัทธา"
 pilgrimage_intent.1000.a:0 ""มีคำตอบอยู่ใน [ROOT.Char.GetFaith.HealthGodName|U]""
 pilgrimage_intent.1000.a.alternate:0 ""ข้าขอเสนอทัศนะอีกมุมหนึ่งได้หรือไม่?""
 pilgrimage_intent.1000.a.conversion_succesful.t:0 "การเปลี่ยนศาสนาสำเร็จ"
 pilgrimage_intent.1000.a.conversion_succesful.desc:0 "ท่านเปลี่ยนศาสนา[sad_peasant.GetHerHim]ได้สำเร็จ"
 pilgrimage_intent.1000.a.conversion_failed.t:0 "การเปลี่ยนศาสนาล้มเหลว"
 pilgrimage_intent.1000.a.conversion_failed.desc:0 "ท่านเปลี่ยนศาสนา[sad_peasant.GetHerHim]ไม่สำเร็จ"
 pilgrimage_intent.1000.b:0 ""เรากำลังเดินทางแสวงบุญ เข้าร่วมกับเราสิ""
 pilgrimage_intent.1000.b.joined.t:0 "เข้าร่วมการจาริกแสวงบุญ"
 pilgrimage_intent.1000.b.joined.desc:0 "[sad_peasant.GetSheHe|U] เข้าร่วมการจาริกแสวงบุญของท่าน"
 pilgrimage_intent.1000.b.not_joined.t:0 "คำเชิญถูกปฏิเสธ"
 pilgrimage_intent.1000.b.not_joined.desc:0 "[sad_peasant.GetSheHe|U] ยังไม่เชื่อ"
 pilgrimage_intent.1000.c:0 "นี่คือน้ำตาของ[ROOT.Char.GetFaith.TricksterGodNamePossessive|U]"
 # Missionary, convert a child
 pilgrimage_intent.1001.t:0 "$zealotry_intent_header$ เยาวชนผู้คล้อยตามง่าย"
 pilgrimage_intent.1001.desc:0 "เราได้พบเห็นศรัทธาแปลกๆ มากมายแล้วในการเดินทางสู่ดินแดนศักดิ์สิทธิ์ และขณะที่เราผ่าน [ROOT.Char.GetCurrentLocation.GetName] ข้าพเจ้าเห็นกลุ่มเด็กกำลังเล่นซนกันอยู่ข้างทาง\n\nพวกเขาทั้งหมดหยุดทันทีเพื่อจ้องมองเราด้วยความประหลาดใจในดวงตา ราวกับว่าเราเป็นเพียงของแปลก พวกเขาไม่เคยเห็นผู้แสวงบุญชาว[ROOT.Char.GetFaith.GetAdherentNameNoTooltip]มาก่อนหรือ? มีเด็กคนหนึ่งดูเหมือนจะมีท่าทางสูงศักดิ์เป็นพิเศษ! บางทีเด็กคนนั้นอาจจะชอบฟังเรื่องราวจาก[ROOT.Char.GetFaith.ReligiousText]"
 pilgrimage_intent.1001.a:0 ""ข้าจะสอนเจ้าเอง""
 pilgrimage_intent.1001.a.conversion_succesful.t:0 "$pilgrimage_intent.1000.b.joined.t$"
 pilgrimage_intent.1001.a.conversion_succesful.desc:0 "ท่านเปลี่ยนศาสนาเด็กคนนั้นได้สำเร็จ"
 pilgrimage_intent.1001.a.conversion_failed.t:0 "$pilgrimage_intent.1000.a.conversion_failed.t$"
 pilgrimage_intent.1001.a.conversion_failed.desc:0 "ท่านเปลี่ยนศาสนาเด็กคนนั้นไม่สำเร็จ"
 pilgrimage_intent.1001.b:0 "เดินทางกันต่อเถอะ"
 # Local courtier is passing by, convert them and bring them on your pilgrimage!
 pilgrimage_intent.1010.t:0 "$zealotry_intent_header$ นักเดินทางผ่านทาง"
 pilgrimage_intent.1010.desc:0 "เราเดินทางต่อไปผ่าน [ROOT.Char.GetCurrentLocation.GetName] เท้าของเราเริ่มเจ็บและเหนื่อยล้า\n\nเราเห็นขุนนางจากราชสำนักท้องถิ่นอยู่ข้างหน้า และ[convertable_courtier.GetSheHe]ขี่ม้าเข้ามาพบกลุ่มของเรา\n\n"เจ้าหลงทางอย่างเห็นได้ชัด สหาย อะไรนำพา[ROOT.Char.GetFaith.GetAdherentNameNoTooltip]ผู้ต่ำต้อยมายัง [ROOT.Char.GetCurrentLocation.GetNameNoTooltip]?""
 pilgrimage_intent.1010.a:0 ""เรากำลังเดินทางอันศักดิ์สิทธิ์ เข้าร่วมกับเราสิ""
 pilgrimage_intent.1010.a.conversion_succesful.t:0 "$pilgrimage_intent.1000.a.conversion_succesful.t$"
 pilgrimage_intent.1010.a.conversion_succesful.desc:0 "ท่านเปลี่ยนศาสนา[convertable_courtier.GetHerHim]ได้สำเร็จ"
 pilgrimage_intent.1010.a.conversion_failed.t:0 "$pilgrimage_intent.1000.a.conversion_failed.t$"
 pilgrimage_intent.1010.a.conversion_failed.desc:0 "ท่านเปลี่ยนศาสนา[convertable_courtier.GetHerHim]ไม่สำเร็จ"
 pilgrimage_intent.1010.b:0 ""ไม่ใช่ธุระกงการอะไรของเจ้า!""
 # Fellow pilgrims of a different faith are on your path
 pilgrimage_intent.1020.t:0 "$zealotry_intent_header$ ผู้แสวงบุญที่ไม่คุ้นเคย"
 pilgrimage_intent.1020.desc:0 "เราได้พบผู้แสวงบุญชาว[ROOT.Char.GetFaith.GetAdherentNameNoTooltip]มากมายบนเส้นทางของเราจนถึงตอนนี้ และทุกคนต่างก็เคร่งศาสนาและอุทิศตนต่อพระประสงค์ของ[ROOT.Char.GetFaith.HighGodNamePossessive|U]\n\nอย่างไรก็ตาม ในไม่ช้าเราก็มาพบกับกลุ่มนักเดินทางแปลกหน้าจากดินแดนอันห่างไกล พวกเขาแนะนำตัวเองว่าเป็น[pilgrim_character.GetFaith.GetAdherentNamePlural] และบอกเราว่าเส้นทางนี้ศักดิ์สิทธิ์สำหรับผู้คนของพวกเขา เช่นกัน"
 pilgrimage_intent.1020.a:0 ""มีเพียง[ROOT.Char.GetFaith.GetAdherentNamePluralNoTooltip]เท่านั้นที่สามารถเดินทางนี้ได้""
 pilgrimage_intent.1020.a.conversion_succesful.t:0 "$pilgrimage_intent.1000.a.conversion_succesful.t$"
 pilgrimage_intent.1020.a.conversion_succesful.desc:0 "ท่านเปลี่ยนศาสนาผู้แสวงบุญเหล่านั้นได้สำเร็จ"
 pilgrimage_intent.1020.a.conversion_failed.t:0 "$pilgrimage_intent.1000.a.conversion_failed.t$"
 pilgrimage_intent.1020.a.conversion_failed.desc:0 "ท่านเปลี่ยนศาสนาผู้แสวงบุญเหล่านั้นไม่สำเร็จ"
 pilgrimage_intent.1020.b:0 ""บอกข้าสิว่าพวกท่านบูชา [pilgrim_character.GetFaith.HighGodName|U] อย่างไร""
 pilgrimage_intent.1020.c:0 "เราช่างเหมือนกัน พวกเขาควรมากับเรา!"
 cheaper_to_convert_to_pilgrim_faith_tt:0 "ท่านได้รับส่วนลด #P 50%#! สำหรับการเปลี่ยนไปนับถือ[THIS.Char.GetFaith.GetName]"
 # You see a particularly calming clearing along your way and stop to meditate
 pilgrimage_intent.1030.t:0 "$reflections_intent_header$ ที่โล่งอันสงบ"
 pilgrimage_intent.1030.desc:0 "ณ ที่แห่งนี้ ในความเงียบสงบของริมทางใน [ROOT.Char.GetCurrentLocation.GetName] ข้าพเจ้ารู้สึกถึงความสงบและความเงียบสงัดอย่างท่วมท้น เหมือนที่ไม่เคยประสบมาก่อน\n\nเลยสันเขาเล็กๆ ไป ข้าพเจ้าเห็นที่โล่งข้างทาง ซึ่งดูเหมือนไม่มีทั้งคนและสัตว์เข้ามาเป็นเวลาหลายสิบปี ข้าพเจ้ารู้สึกถึงการประทับอยู่ของ[ROOT.Char.GetFaith.HighGodNamePossessive|U]ที่นี่ และบางทีข้าพเจ้าควรจะอยู่ที่นี่เพื่อใคร่ครวญอย่างเงียบๆ สักครู่"
 pilgrimage_intent.1030.desc_sea:0 "ณ ที่นี้ กลางทะเล เมื่ออากาศสงบและไม่เห็นเรือสักลำบนขอบฟ้า ความสงบและความเงียบสงัดนั้นท่วมท้น การประทับอยู่ของ[ROOT.Char.GetFaith.HighGodNamePossessive|U]นั้นแข็งแกร่งเป็นพิเศษที่นี่ และมันเติมเต็มข้าพเจ้าจนเปี่ยมล้น\n\nบางทีเราควรฉวยโอกาสในการใคร่ครวญอย่างเงียบๆ โดยการอยู่ในอ่าวนี้อีกสักครู่?"
 pilgrimage_intent.1030.a:0 "นี่คือพระประสงค์ของ[ROOT.Char.GetFaith.HighGodNamePossessive|U]"
 pilgrimage_intent.1030.b:0 "เราต้องไม่ล่าช้า!"
 
 # You spot an animal, follow it for an omen?
 pilgrimage_intent.1040.t:0 "$reflections_intent_header$ ลางบอกเหตุจากสัตว์ป่า"
 pilgrimage_intent.1040.desc.intro:0 "ขณะที่เราเดินทางไปตามถนนศักดิ์สิทธิ์สายนี้ เราต้องหยุดกะทันหันเมื่อมีสัตว์ตัวหนึ่งก้าวออกมาขวางกลางทางของเรา\n\n"
 pilgrimage_intent.1040.desc.mid.pred:0 "[ROOT.Char.Custom('GetAnimalType')]อันทรงพลังยืนขวางอยู่ระหว่างข้าพเจ้ากับดินแดนศักดิ์สิทธิ์"
 pilgrimage_intent.1040.desc.mid.prey:0 "[ROOT.Char.Custom('GetAnimalType')]ผู้นอบน้อมจ้องมองขบวนคาราวานศักดิ์สิทธิ์ของเรา"
 pilgrimage_intent.1040.desc.outro:0 "\n\nมีบางอย่างที่ดูเหมือนรู้ความบนใบหน้าของสัตว์ร้าย ราวกับว่าจิตใจของ[ROOT.Char.GetWomanMan]ชราผู้ชาญฉลาดสถิตอยู่เบื้องหลังดวงตาอันดุร้ายเหล่านั้น [ROOT.Char.GetSheHe|U] กะพริบตาแล้วก็เดินทางต่อไปตามทางของ[ROOT.Char.GetHerHis]"
 pilgrimage_intent.1040.a:0 "[ROOT.Char.Custom('GetAnimalType')]ตัวนั้นคือผู้ส่งสารจาก[ROOT.Char.GetFaith.HighGodName]! ตาม[ROOT.Char.GetHerHim]ไป!"
 pilgrimage.you_lose_the_animal.t:0 "คลาดกับสัตว์"
 pilgrimage.you_lose_the_animal.desc:0 "ท่านคลาดกับ[ROOT.Char.Custom('GetAnimalType')]"
 pilgrimage_intent.1040.b:0 "เราจะวอกแวกไม่ได้"
 # Good omen (predator)
 pilgrimage_intent.1041.t:0 "ลางบอกเหตุ: การล่าที่ประสบความสำเร็จ"
 pilgrimage_intent.1041.desc.intro:0 "ข้าพเจ้าติดตาม[ROOT.Char.Custom('GetAnimalType')]อย่างขยันขันแข็ง ระวังไม่ให้[ROOT.Char.GetSheHe]สังเกตเห็นข้าพเจ้า\n\nในที่สุด [ROOT.Char.GetSheHe] ก็พบเหยื่อของ[ROOT.Char.GetHerHis]: นกตัวเล็กๆ"
 pilgrimage_intent.1041.desc.mid:0 "[ROOT.Char.Custom('GetAnimalType')] เคลื่อนไหว [ROOT.Char.GetHerHis] และขณะที่นกพยายามหลบหนีอย่างอ่อนแรง มันก็ถูกฉีกออกเป็นขนนกและเลือดอย่างรวดเร็ว"
 pilgrimage_intent.1041.desc.outro:0 "\n\n[ROOT.Char.GetFaith.HighGodName|U] หมายความว่าอย่างไรกันแน่?"
 pilgrimage_intent.1041.a:0 "สงครามของข้าจะประสบความสำเร็จ!"
 pilgrimage_intent.1041.b:0 "ศัตรูของข้าจะล้มลงเมื่อข้าเข้าจู่โจม!"
 # Bad omen (predator)
 pilgrimage_intent.1042.t:0 "ลางบอกเหตุ: การล่าที่ล้มเหลว"
 pilgrimage_intent.1042.desc.mid:0 "[ROOT.Char.Custom('GetAnimalType')] รอแล้วรอเล่าเพื่อหาโอกาส [ROOT.Char.GetHerHis] และในที่สุดก็โจมตีนกเพียง เพื่อให้มันหลุดรอดไปและกระพือปีกหนีไปในท้องฟ้าที่เปิดกว้าง"
 pilgrimage_intent.1042.a:0 "ข้าคือ[ROOT.Char.Custom('GetAnimalType')] และศัตรูของข้าจะเอาชนะข้าได้"
 pilgrimage_intent.1042.b:0 "ข้าคือนก และข้าจะหนีจากชะตากรรมอันเลวร้าย!"
 # Good omen (prey)
 pilgrimage_intent.1043.t:0 "ลางบอกเหตุ: ครอบครัวสุขสันต์"
 pilgrimage_intent.1043.desc.intro:0 "ข้าพเจ้าติดตาม[ROOT.Char.Custom('GetAnimalType')] โดยอยู่ห่างๆ เพื่อไม่ให้[ROOT.Char.GetHerHim]ตกใจ ในที่สุด [ROOT.Char.GetSheHe] ก็พบ[ROOT.Char.Custom('GetAnimalType')]อีกตัวในที่โล่ง บางทีอาจเป็นคู่ของ[ROOT.Char.GetHerHis]?\n\n"
 pilgrimage_intent.1043.desc.mid:0 "ทั้งสองชนหัวกันเล็กน้อย แต่ในไม่ช้าก็คลอเคลียกันแล้วก็หายเข้าไปในป่าด้วยกันทันที"
 pilgrimage_intent.1043.a:0 "ข้าพเจ้าจะมีบุตรในไม่ช้า!"
 pilgrimage_intent.1043.b:0 "ข้าพเจ้าต้องผูกมิตรกับศัตรูของข้าพเจ้า"
 pilgrimage_intent.1043.c:0 "ข้าพเจ้าควรให้ความสำคัญกับครอบครัวเป็นอันดับแรก"
 # Bad omen (prey)
 pilgrimage_intent.1044.t:0 "ลางบอกเหตุ: ภาพอันน่าสยดสยอง"
 pilgrimage_intent.1044.desc.mid:0 "ทั้งสองเข้าใกล้กัน แต่ก่อนที่พวกมันจะได้พบกัน ร่างเงาพร่ามัวก็กระโจนออกมาจากที่ไหนก็ไม่รู้และบดขยี้สิ่งมีชีวิตที่น่าสงสารจนกลายเป็นคราบเลือดต่อหน้าต่อตาเพื่อนของมัน"
 pilgrimage_intent.1044.a:0 "มีบางอย่างกำลังมาหาข้า!"
 pilgrimage_intent.1044.b:0 "ข้าจะทำลายศัตรูของข้าโดยไม่มีใครสังเกตเห็น!"
 you_follow_the_animal_tt:0 "ท่านติดตามสัตว์เข้าไปลึกขึ้น..."
 # You stop to contemplate on your age
 pilgrimage_intent.1050.t:0 "$reflections_intent_header$ การใคร่ครวญทางโลก"
 pilgrimage_intent.1050.desc.intro:0 "ตลอดเส้นทางสู่ดินแดนศักดิ์สิทธิ์ ข้าพเจ้าได้พบกับผู้แสวงบุญทุกประเภททั้งเด็กและผู้ใหญ่ ราวกับว่าข้าพเจ้ากำลังเห็นภาพชีวิตของตัวเองฉายอยู่ตรงหน้า\n\n"
 pilgrimage_intent.1050.desc.mid.old:0 "ผมสีเงินและผิวหนังเหี่ยวย่นดูเหมือนจะห่างไกลเสมอ จนกระทั่งพวกมันมาถึงข้าพเจ้า ข้าพเจ้าอดไม่ได้ที่จะรู้สึกว่าการจาริกแสวงบุญครั้งนี้อาจเป็นครั้งสุดท้ายของข้าพเจ้า ก่อนที่ข้าพเจ้าจะเดินทางครั้งสุดท้ายสู่[ROOT.Char.GetFaith.PositiveAfterLife|U]"
 pilgrimage_intent.1050.desc.mid.young_and_dying:0 "ด้วยสุขภาพที่ไม่ดีของข้าพเจ้า ชีวิตของข้าพเจ้าคงไม่ยืนยาวเท่าคนส่วนใหญ่ เมื่อเห็นใบหน้าที่ยิ้มแย้มของผู้โชคดีที่แก่ชราลงตามวัย ข้าพเจ้าอดไม่ได้ที่จะรู้สึกอิจฉาชีวิตที่ยืนยาวของพวกเขา"
 pilgrimage_intent.1050.desc.mid.young:0 "ข้าพเจ้ายังมีชีวิตอีกมากที่ต้องดำเนินต่อไป แต่ทั้งหมดดูเหมือนสั้นเหลือเกินเมื่อเผชิญกับแนวคิดเรื่องความเป็นนิรันดร์"
 pilgrimage_intent.1050.desc.outro:0 "\n\nบางทีข้าพเจ้าควรหยุดสักครู่และใคร่ครวญถึงความสั้นของชีวิต"
 pilgrimage_intent.1050.a:0 "ข้าพเจ้าจะใช้เวลาให้คุ้มค่าที่สุด"
 pilgrimage_intent.1050.b:0 "ข้าพเจ้ายังมีชีวิตอีกมากที่ต้องดำเนินต่อไป!"
 pilgrimage_intent.1050.c:0 "ความคิดเหล่านี้ ทำให้หัวใจข้าพเจ้าเจ็บปวด"
 # You stop to contemplate ancient civilizations
 pilgrimage_intent.1060.t:0 "$reflections_intent_header$ จักรวรรดิแห่งวันวาน"
 pilgrimage_intent.1060.desc.intro:0 "ขณะเดินทางไปตามเส้นทางนี้ ข้าพเจ้าได้พบสิ่งเตือนใจมากมายเกี่ยวกับผู้ที่มาก่อนข้าพเจ้า\n\nณ ที่นี้ ใน [ROOT.Char.GetCurrentLocation.GetNameNoTooltip],"
 pilgrimage_intent.1060.desc.mid.rome:0 "ข้าพเจ้าได้พบซากปรักหักพังของศาลเจ้าที่อุทิศให้กับเทพเจ้าโรมันโบราณ [GetFaithByKey('hellenic_pagan').FertilityGodName|U] ในความงามทั้งหมดของ[GetFaithByKey('hellenic_pagan').FertilityGodHerHis]ยิ้มให้ข้าพเจ้าด้วยปากที่แตกครึ่ง และใบหน้าของ[GetFaithByKey('hellenic_pagan').HighGodNamePossessive]ก็สึกกร่อนจนแทบจำไม่ได้"
 pilgrimage_intent.1060.desc.mid.israel:0 "ข้าพเจ้าได้เห็นสิ่งเตือนใจนับไม่ถ้วนถึงชาวฮีบรูโบราณที่เคยเดินทางมาที่นี่ในฐานะดินแดนแห่งพันธสัญญาของพวกเขา วิหารโบราณ ซึ่งครั้งหนึ่งเคยเป็นสถานที่สักการะ[GetFaithByKey('rabbinism').HighGodName|U] บัดนี้ถูกทิ้งให้ผุพังไปเมื่อชาวฮีบรูถูกขับไล่ออกไปอีกครั้ง"
 pilgrimage_intent.1060.desc.mid.egypt:0 "ข้าพเจ้าเห็นอนุสาวรีย์สูงตระหง่านของฟาโรห์โบราณ พวกเขาใช้เวลาทั้งชีวิตสร้างเครื่องบรรณาการขนาดยักษ์เหล่านี้เพื่อถวายแด่เทพเจ้าของพวกเขา ซึ่งทำจากเศวตศิลาและทองคำ เพียง เพื่อให้ตอนนี้พวกมันเต็มไปด้วยฝุ่นทรายและเปราะบางไปตามกาลเวลา"
 pilgrimage_intent.1060.desc.mid.persia:0 "ข้าพเจ้ายังคงพบสิ่งเตือนใจถึงชาวซาซาเนียน พาร์เธียน และเซลิวซิดโบราณ จักรวรรดินับไม่ถ้วนเกิดขึ้นและล่มสลายที่นี่ในเปอร์เซีย แต่เปอร์เซียเองก็ยังคงอยู่ วิหารโซโรอัสเตอร์เก่าแก่ยังคงอยู่ในสภาพทรุดโทรมทั่วทั้งประเทศ และบางทีวันหนึ่งแม้ แต่เมืองศักดิ์สิทธิ์ของเราก็จะพังทลายลงเป็นผุยผง"
 pilgrimage_intent.1060.desc.mid.ashokas_pillars:0 "ข้าพเจ้าพบเสาอโศกอีกต้นหนึ่ง ซึ่งสร้างขึ้นเมื่อนานมาแล้ว แต่ละต้นจารึกพระราชกฤษฎีกาที่ออกโดยพระเจ้าอโศกมหาราชเมื่อหลายศตวรรษก่อน อนุสาวรีย์ธรรมะเหล่านี้บัดนี้กระจายอยู่ทั่วดินแดน ซึ่งครั้งหนึ่งเคยเป็นส่วนหนึ่งของจักรวรรดิเมารยะ แต่ตัวจักรวรรดิเองก็เป็นเพียงฝุ่นผง"
 pilgrimage_intent.1060.desc.mid.kush:0 "ข้าพเจ้าเห็นสิ่งเตือนใจถึงจักรวรรดิมากมายที่รุ่งเรืองและล่มสลายที่นี่ริมฝั่งแม่น้ำไนล์ พีระมิดแห่งคุช วิหารอักซูไมต์ แทบจะเดินทางไปที่ไหนไม่ได้เลยโดยไม่เห็นอนุสาวรีย์ที่พังทลายของอดีต"
 pilgrimage_intent.1060.desc.mid.fallback:0 "ข้าพเจ้าเห็นสิ่งเตือนใจถึงผู้ที่อาศัยอยู่ในดินแดนนี้มานานก่อนเรา วิหารเก่าแก่ อาวุธที่แตกหัก เศษวัตถุที่ไม่สามารถระบุได้ เวลาพรากเราทุกคนไป และเทพเจ้าที่เราบูชาและวิธีที่เราบูชาพวกเขาก็เปลี่ยนแปลงอยู่เสมอ"
 pilgrimage_intent.1060.desc.outro:0 "\n\nบางทีวันหนึ่ง [ROOT.Char.GetWomanMan]คนอื่นอาจจะเดินไปตามเส้นทางนี้และใคร่ครวญถึง[ROOT.Char.GetPrimaryTitle.GetNameNoTooltip]ที่ล่มสลายและศรัทธา[ROOT.Char.GetFaith.GetAdjectiveNoTooltip]ที่[ROOT.Char.GetTitleAsNameNoTooltip|U]ของมันเคยปฏิบัติ"
 pilgrimage_intent.1060.a:0 "ข้าพเจ้าควรใคร่ครวญถึงจักรวรรดิเก่าแก่"
 pilgrimage_intent.1060.b:0 "ข้าพเจ้าควรใคร่ครวญถึงศรัทธาโบราณ"
 pilgrimage_intent.1060.c:0 "ไร้สาระ [ROOT.Char.GetPrimaryTitle.GetNameNoTierNoTooltip] จะคงอยู่ตลอดไป!"
 pilgrimage.drive_to_succeed.t:0 "แรงผลักดันสู่ความสำเร็จ"
 pilgrimage.existential_dread.t:0 "ความหวาดกลัวต่อการดำรงอยู่"
 pilgrimage.existential_dread.desc:0 "ท่านเต็มไปด้วยความหวาดกลัวต่อการดำรงอยู่"
 pilgrimage.drive_to_survive.t:0 "แรงผลักดันเพื่อความอยู่รอด"
 pilgrimage.drive_to_survive.desc:0 "ท่านมีแรงผลักดันเพื่อความอยู่รอด"
 pilgrimage.imperial_contemplation.t:0 "การใคร่ครวญถึงจักรวรรดิ"
 pilgrimage.imperial_contemplation.desc:0 "ท่านใคร่ครวญถึงความสั้นของจักรวรรดิ"
 pilgrimage.godly_meditation.t:0 "การทำสมาธิถึงพระเจ้า"
 pilgrimage.godly_meditation.desc:0 "ท่านใคร่ครวญถึงธรรมชาติของพระเจ้า"
 pilgrimage.failed_contemplation.t:0 "การใคร่ครวญล้มเหลว"
 pilgrimage.failed_contemplation.desc:0 "ท่านไม่มีความคืบหน้า"
 #Personal reflections
 pilgrimage_intent.1100.t:0 "$reflections_intent_header$ ท้องฟ้าที่เต็มไปด้วยดวงดาว"
 pilgrimage_intent.1100.desc:0 "ณ ที่นี้ ยามดึกสงัด บางครั้งข้าพเจ้ามองดูดวงดาวและสงสัย จุดประสงค์ในชีวิตของเราคืออะไร?\n\n[ROOT.Char.GetFaith.PantheonTerm] จะมองเห็นข้าพเจ้าได้หรือไม่ จากที่ไกลบ้าน เช่นนี้? ข้าพเจ้าทำทั้งหมดนี้เพื่ออะไร?"
 pilgrimage_intent.1100.a:0 "แน่นอนว่าเป็นหน้าที่อันศักดิ์สิทธิ์ของข้าพเจ้า!"
 pilgrimage_intent.1100.b:0 "สิ่งที่ข้าพเจ้าต้องการอย่างแท้จริงคือการเพลิดเพลินและสัมผัสกับวัฒนธรรมอื่น"
 pilgrimage_intent.1100.c:0 "ข้าพเจ้าทำไม่เกินกว่าที่จำเป็นในตำแหน่งของข้าพเจ้า"
 #Sea legs
 pilgrimage_intent.1110.t:0 "อาการเมาเรือ"
 pilgrimage_intent.1110.t_altruism:0 "$altruism_intent_header$ $pilgrimage_intent.1110.t$"
 pilgrimage_intent.1110.t_reflection:0 "$reflections_intent_header$ $pilgrimage_intent.1110.t$"
 pilgrimage_intent.1110.t_zealot:1 "$zealotry_intent_header$ $pilgrimage_intent.1110.t$"
 pilgrimage_intent.1110.desc:0 "ขณะเดินไปรอบๆ เรือในการเดินทางสู่ [ROOT.Char.GetTravelPlan.GetData.GetNextDestination.GetProvince.GetNameNoTooltip] ข้าพเจ้าเห็นเพื่อนผู้แสวงบุญคนหนึ่ง ซึ่งดูเหมือนจะไม่ค่อยสบาย เห็นได้ชัดว่า[affected_pilgrim.GetHerHis]ไม่เคยชินกับการเดินทางทางทะเล\n\n[affected_pilgrim.GetSheHe|U] คร่ำครวญเบาๆ นั่งยองๆ ข้างราวกั้น และเกาะมันไว้แน่นด้วยใบหน้าที่ซีดเผือดสลับไปมา"
 pilgrimage_intent.1110.desc.outro_altruism:0 "\n\nข้าพเจ้าควรพยายามปลอบโยน[affected_pilgrim.GetHerHim]บ้าง บางทีข้าพเจ้าควรเสนอน้ำให้[affected_pilgrim.GetHerHim]ดื่ม?"
 pilgrimage_intent.1110.desc.outro_reflection:0 "\n\nข้าพเจ้าทำได้เพียงเห็นใจ[affected_pilgrim.GetHerHim] ทำไม #EMP เรา#! ต้องเผชิญกับภยันตรายเหล่านี้ ซึ่งบางครั้งก็เป็นอันตรายถึงชีวิต?"
 pilgrimage_intent.1110.desc.outro_zealot:0 "\n\nข้าพเจ้ามั่นใจว่า[ROOT.Char.GetFaith.PantheonTerm]จะช่วยเหลือเรา บางทีเราควรสวดมนต์เพื่อเร่งกระบวนการ?"
 pilgrimage_intent.1110.a:0 "ทุกอย่างจะเรียบร้อยดี แค่ทนไว้"
 pilgrimage_intent.1110.b:0 "การทดลองและความยากลำบาก #EMP เป็น#! เรื่องปกติ..."
 pilgrimage_intent.1110.c:0 "ให้เราสวดมนต์ให้ท่านหายดี"
 pilgrimage_intent.1110.d:0 "ข้าพเจ้าควรมีสมุนไพรสำหรับเรื่องนั้น"
 pilgrimage_intent.1110.e:0 "ดีใจที่ไม่ใช่ข้าพเจ้า"
 #A local heathen is smitten with one of your entourage members and asks to marry them
 pilgrimage_intent.9000.t:0 "$zealotry_intent_header$ [ROOT.Char.Custom('GetDerogatoryNonbeliever')|U] ผู้หลงใหล"
 pilgrimage_intent.9000.desc:0 "ในตลาดของ [background_market_scope.GetName] [smitten_heathen.GetWomanMan]ที่คุ้นเคยปรากฏตัวขึ้น เหมือนลูกสุนัข [smitten_heathen.GetSheHe] ได้ติดตามเรามาหลายวันแล้ว\n\nด้วยสายตาอ้อนวอน [smitten_heathen.GetSheHe] อุทานว่า: "นายท่าน/นายหญิง[ROOT.Char.GetLadyLord|U]ของข้าพเจ้า — [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('entourage_to_marry_2'))]ของท่าน [entourage_to_marry_2.GetFirstName] [entourage_to_marry_2.GetSheHe]จะรักข้าพเจ้าหรือไม่? เพราะ[entourage_to_marry_2.GetSheHe]เป็น[entourage_to_marry_2.GetFaith.GetAdherentName] และข้าพเจ้าเป็นผู้ศรัทธา[smitten_heathen.GetFaith.GetAdjective]... แต่ มีโอกาสไหม?"\n\n[smitten_heathen.GetSheHe|U] ดูเหมือนจะหลงใหล แต่[entourage_to_marry_2.GetFirstNameNoTooltip]ดูไม่แน่ใจนัก [ROOT.Char.GetFaith.HighGodName]จะเห็นชอบกับการ แต่งงานครั้งนี้หรือไม่?"
 pilgrimage_intent.9000.seducer:0 "ให้ข้าแสดงให้เจ้าดูว่าทำอย่างไร!"
 pilgrimage_intent.9000.seducer.flavor:0 "สอนเคล็ดลับเล็กๆ น้อยๆ ให้[smitten_heathen.GetWomanMan]เพื่อ ทำให้[entourage_to_marry_2.GetFirstName]หลงใหลในตัว[smitten_heathen.GetHerHis]"
 pilgrimage_intent.9000.a.flavor:0 "ในการ แต่งงานของพวกเขา [ROOT.Char.GetFaith.HighGodName] จะได้ผู้รับใช้คนใหม่!"
 pilgrimage_intent.9000.b.flavor:0 "[smitten_heathen.GetFaith.GetAdherentNamePlural] ต้องมีพิธีกรรมเกี้ยวพาราสีที่น่าสนใจแน่ ข้าพเจ้าต้องสังเกตการณ์"
 pilgrimage_intent.9000.a:0 "ยอมรับ[ROOT.Char.GetFaith.HighGodName] แล้ว[entourage_to_marry_2.GetSheHe]จะเป็นของเจ้า"
 pilgrimage_intent.9000.b:0 "โอ้ ที่รัก เจ้าควรคุยกับ #EMP [entourage_to_marry_2.GetHerHim]#! ไม่ใช่ข้า!"
 pilgrimage_intent.9000.c:0 "เราไม่มีเวลาสำหรับเรื่องนี้..."
 hit_it_off_tt:0 "พวกเขาเข้ากันได้ดี"
 they_fight_publicly_tt:0 "พวกเขาก่อเรื่องในที่สาธารณะ"
