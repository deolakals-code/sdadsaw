l_english: 
 admiring_birds.1001.t:0 "โอ้! นก!"
 admiring_birds.1001.common_raven.desc:0 "เสียงเพลงที่แว่วเข้าหูข้ามิอาจผิดพลาดได้: เสียงร้องของอีกา นกตัวนั้นเกาะอยู่บนกิ่งไม้ ดูเหมือนกำลังไล่ตามบางสิ่ง"
 admiring_birds.1001.common_merganser.desc:0 "หงอน เช่นนี้เป็นที่จดจำได้ง่าย นกเป็ดน้ำปากยาวตัวนี้ทำรังอยู่ในโพรงไม้ มันกำลังปกป้องไข่อย่างระมัดระวัง ไม่เห็นคู่ของมันเลย บางทีอาจกำลังหาปลาอยู่"
 admiring_birds.1001.common_loon.desc:0 "ขนนกสีดำขาว พังผืดเชื่อมระหว่างนิ้วเท้า ท่าบินขึ้นที่ดูเงอะงะ อืม... ยากที่จะระบุชนิด แต่ก็น่าจะเป็นนกดำน้ำลูน"
 admiring_birds.1001.golden_eagle.desc:0 "ช่างเป็นสัตว์ที่สง่างามยิ่งนัก! ข้าโชคดีที่ได้เห็นการล่าของอินทรีทองตัวนี้ สัตว์ฟันแทะผู้น่าสงสารไม่ทันได้เห็นความตายของมันด้วยซ้ำ ขนสีน้ำตาลเข้มที่โดดเด่นคงช่วยในการพรางตัวได้ดี"
 admiring_birds.1001.red_crossbill.desc:0 "เสียงเพลงอันเงียบสงบและไพเราะแว่วเข้าหูข้า ตอนแรก ข้าไม่สามารถระบุที่มาของเสียงได้ ด้วยเสียงที่สะท้อนไปมาท่ามกลางหมู่ไม้ ทันใดนั้นข้าก็เห็นรูปร่างสีส้ม เกาะอยู่บนยอดไม้ นกปากไขว้แดงสองสามตัวกำลังหาอาหารอยู่ในต้นสน"
 admiring_birds.1001.northern_harrier.desc:0 "แม้จะอาจถูกเข้าใจผิดว่าเป็นนกฮูก แต่เหยี่ยวทุ่งเหนืออันภาคภูมิก็โดดเด่นด้วยการล่าในเวลากลางวันแสกๆ"
 admiring_birds.1001.great_egret.desc:0 "ขนนกสีขาวบริสุทธิ์ปรากฏดุจเมฆเหนือทะเลสาบ ขาอันเรียวยาวของนกยางขาวใหญ่เลือนหายไปในแสง ทำให้ดูเหมือนว่าลำตัวส่วนบนกำลังลอยอยู่"
 admiring_birds.1001.black_tern.desc:0 "ขณะเดินอยู่ริมทุ่งหญ้า ข้าพบนกนางนวลแกลบดำฝูงหนึ่งกำลังไล่จับกัน บินสูงขึ้นอย่างรวดเร็วด้วยการตีปีกที่เกินจริงพร้อมกับส่งเสียงร้องอย่างตื่นเต้น อาจจะเป็นฤดูผสมพันธุ์กระมัง?"
 admiring_birds.1001.osprey.desc:0 "ขณะเดินผ่านริมทะเลสาบ นกตัวหนึ่งก็พุ่งพรวดออกจากน้ำ มีปลาอยู่ในจะงอยปากสีดำของมัน เหยี่ยวออสเปรบินจากไปอย่างรวดเร็ว"
 admiring_birds.1001.northern_shoveler.desc:0 "นั่นคือหินผา!...ยอดเขา!...แหลม! แหลมโดยแท้! นั่นคือคาบสมุทร! เป็ดปากพลั่วเหนือมีจะงอยปากที่เป็นเอกลักษณ์อย่างแท้จริง" # Note: Translated the Cyrano เต๋อ Bergerac quote somewhat literally for flavor.
 admiring_birds.1001.atlantic_puffin.desc:0 "ช่างเป็นภาพที่น่าขบขัน! นกพัฟฟินแอตแลนติกเป็นสิ่งที่น่าเพลิดเพลินในการสังเกต มัน ทำให้ข้านึกถึงตัวตลกสีสันสดใสในทางใดทางหนึ่ง"
 admiring_birds.1001.mallard.desc:0 "ขนปีกสีม่วงน้ำเงินเหลือบรุ้งของนกที่กำลังบินจับความสนใจของข้าขณะที่ข้ากำลังเดินเตร่ เป็ดหัวเขียวร่อนลงจอดห่างออกไปเล็กน้อย ในทุ่งหญ้าใกล้เคียง"

 admiring_birds.1001.horned_lark.desc:0 "ฝูงนกจาบฝนเขาขนาดใหญ่กำลังสำรวจพื้นดิน ค้นหาหนอนและพูดคุยกัน ข้าหยุดทันทีเพื่อไม่ให้พวกมันตกใจ"
 admiring_birds.1001.barrow_goldeneye.desc:0 "ดวงตาสีทองกำลังจ้องมองข้าจากกลางทะเลสาบ เป็ดตาเหลืองบาร์โรว์ว่ายน้ำอย่างสงบ แน่นอนว่ากำลังมองหาอาหาร"

 admiring_birds.1001.gold_gain.desc:0 "ข้าช่างโชคดีเสียนี่กระไร! การเผชิญหน้า เช่นนี้เป็นสัญญาณที่ดี และรายได้ของข้าควรจะได้รับประโยชน์จากมัน"
 admiring_birds.1001.prowess_gain.desc:0 "การสังเกตวิธีที่มันไล่ล่าเหยื่อนั้นช่างเป็นแรงบันดาลใจ! ข้าจะสามารถนำไปใช้ในสนามรบได้"
 admiring_birds.1001.piety_gain.desc:0 "ข้าได้รับพรแล้ว! มันปลุกบางสิ่งที่อยู่ลึกภายในตัวข้า"
 admiring_birds.1001.prestige_gain.desc:0 "ช่างเป็นการเผชิญหน้าที่หาได้ยากยิ่ง! ทุกคนจะต้องอิจฉาข้าเป็นแน่"
 admiring_birds.1001.dynasty_prestige_gain.desc:0 "การได้พบนกตัวนี้พิสูจน์ว่าราชวงศ์ของข้าถูกกำหนดมาเพื่อความยิ่งใหญ่!"
 admiring_birds.1001.stress_loss_gain.desc:0 "ไม่มีอะไรจะผ่อนคลายไปกว่าการเฝ้าดูนกตัวนี้โบยบินอีกแล้ว"


 admiring_birds.1001.a:0 "หากเพียง แต่ข้ารู้เรื่องนกมากกว่านี้..."
 admiring_birds.1001.b:0 "ช่างเป็นการเผชิญหน้าที่มีประโยชน์ยิ่งนัก!"
 admiring_birds.1001.c:0 "เป็นส่วนเสริมที่ดีในคอลเลกชันถ้วยรางวัลของข้า"
