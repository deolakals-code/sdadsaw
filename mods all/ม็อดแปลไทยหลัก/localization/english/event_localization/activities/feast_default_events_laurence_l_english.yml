l_english: 
 feast_default_laurence.100.t: "อุดมการณ์ร่วมกัน"
 feast_default_laurence.100.desc: "เมื่อข้ากลับมาจากการไปปลดทุกข์ ข้าก็ถูกทักทายโดย [conspiratorial_fellow.GetName] ผู้มีแววตาแข็งกร้าว [conspiratorial_fellow.GetSheHe|U] เล่าเรื่องราวของ [war_memory.MakeScope.Var('war_cb').GetFlagName] ที่ [conspiratorial_fellow.GetSheHe] ต่อสู้กับ [intent_target.GetName] ให้ข้าฟังอย่างออกรส [conspiratorial_fellow.GetSheHe|U] คร่ำครวญผ่านไรฟันว่าพลาดโอกาสที่จะแล่ [intent_target.GetHerHim] ออกเป็นชิ้น ๆ [conspiratorial_fellow.GetSheHe|U] เอนตัวเข้ามาใกล้และจ้องประสาน [conspiratorial_fellow.GetHerHis] ตากับข้า\n\n"อย่าให้ [ROOT.Char.Custom('RegionalEdibleAnimal')] ที่พ่อครัวของท่านเตรียมการอย่างดี เป็นเพียงสัตว์ร้ายเพียงตัวเดียวที่ถูกเสียบในงานเลี้ยงนี้เลย! ท่านเพียงแค่บอกให้ยามของท่านทำเป็นมองไม่เห็นและหูหนวกเสีย ข้าจะจัดการที่เหลือเอง""
 feast_default_laurence.100.a: "จงให้ดาบของเจ้าได้ดื่มด่ำ!"
 feast_default_laurence.100.a.tt.success: "[intent_target.GetTitledFirstName] หลั่งเลือดราวกับเครื่องสังเวย"
 feast_default_laurence.100.a.tt.failure: "[intent_target.GetTitledFirstName] เจ้าเล่ห์เกินไป"
 feast_default_laurence.100.b: "ความคิดถึงความตายของ [intent_target.GetHerHis] ปลุกเร้าบางอย่างในตัวข้า แต่จงรอดูและรอคอยไปก่อน"
 feast_default_laurence.100.c: "ลืมถ้อยคำโง่เขลาเหล่านี้ไปเสีย แต่จำไว้ ข้าจะจดจำมัน"
 feast_default_laurence.101.desc: "เจ้าภาพของข้าพยายามอย่างเต็มที่ในการจัดเตรียมอาหารเลิศรส แม้จะดูสมถะเมื่อเทียบกับความหรูหราโอชะของ [intent_target.GetCapitalLocation.GetName] ข้าชื่นชมในความทุ่มเทด้านการต้อนรับขับสู้ของข้าหลวงของข้า\n\nข้าพลันสังเกตเห็นว่ามีคนในโถงน้อยลง ใช่ เหล่ายามดูเหมือนจะปลีกตัวออกไปแล้ว\n\nรู้สึกเจ็บแปลบที่สีข้าง! หมัดหรือ? บางสิ่งที่อุ่น ๆ ช่วยบรรเทาอาการคัน ข้ามองลงไป ด้ามดาบเล่มหนึ่งงอกออกมาจากระหว่างซี่โครงของข้า มันมาทำอะไรตรงนั้น..."
 feast_default_laurence.101.a: "ความตายมาเยือนข้าแล้ว"
 feast_default_laurence.102.desc: "ข้าต้องการมอบของกำนัลแสดงความจงรักภักดีแก่ [intent_target.GetName] ของกำนัลที่ใหญ่โตเสียจนต้องใช้ทหารยามทั้งหมดของข้าในการขนย้าย อนิจจา เมื่อพวกเขาออกจากห้องไปเอามัน ดูเหมือนว่าแขกของข้าจะมีดาบงอกออกมาจากระหว่างซี่โครงของ [intent_target.GetHerHis]\n\n[conspiratorial_fellow.GetName] ยิ้มให้ข้า ดวงตาของ [conspiratorial_fellow.GetHerHis] ลุกโชนราวกับได้จับแสงแห่งชีวิตที่ดับสูญ"
 feast_default_laurence.102.a: "ขอให้การร่วมมือครั้งนี้เป็นจุดเริ่มต้นของมิตรภาพอันยิ่งใหญ่"
 feast_default_laurence.102.b: "เจ้าทรยศต่อการต้อนรับของข้าด้วยการนองเลือด!"
 feast_default_laurence.102.b.flavor: "ท่านพยายามจองจำ [conspiratorial_fellow.GetHerHim]"
 feast_default_laurence.102.b.tt.success: "ทหารยามของท่านจับกุมคนทรยศจนสิ้นฤทธิ์"
 feast_default_laurence.102.b.tt.fail: "ทหารยามของท่านจับกุม [conspiratorial_fellow.GetName] ไม่สำเร็จ"
