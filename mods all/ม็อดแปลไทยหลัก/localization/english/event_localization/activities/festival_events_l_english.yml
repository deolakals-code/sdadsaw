 festival.104.t: "ลอยคว้างกลางฝูงชน"
 festival.104.desc: "ทุกงานสังสรรค์ย่อมมีกระแสขึ้นลง เราต้องระแวดระวังกระแสเหล่านั้น มิฉะนั้นอาจพบว่าตนเองถูกทิ้งให้โดดเดี่ยว\n\nเมื่อ [target_character3.GetTitledFirstName] หันไปทักทาย [target_character4.GetTitledFirstName] ข้าก็พลันพบว่าตนเองลอยคว้างกลางฝูงชน ปราศจากบทสนทนา\n\nห่างออกไปเล็กน้อย ข้าเห็น [target_character.GetTitledFirstName] และ [target_character2.GetTitledFirstName] กำลังจ้องมองมายังข้าอย่างมีนัย และแลกเปลี่ยนคำพูดกันหลังพัดของพวกเขา"
 festival.104.a: "ข้าจะเข้าร่วมกับพวกเขาอย่างกล้าหาญ"
 festival.104.b: "การกระซิบเล็กน้อยจากข้าจะหว่านเมล็ดพันธุ์แห่งความคิดที่ #EMP น่าสนใจ#!"
 festival.104.c: "ข้าขอปลีกตัวกลับไปหาสหายของข้าดีกว่า"

 festival.104.a.success: "ท่าน ทำให้พวกเขาประทับใจด้วยการเข้าหาอย่างกล้าหาญ"
 festival.104.a.success.toast: "การเข้าหาอย่างกล้าหาญของท่านประสบความสำเร็จ"
 festival.104.a.failure: "การบุกรุกเข้าไปอย่างเคอะเขินของท่านไม่เป็นที่ชื่นชม"
 festival.104.a.failure.toast: "การเข้าหาอย่างเคอะเขินของท่านไม่ได้รับการต้อนรับที่ดี"

 festival.104.b.success: "ท่านสร้างข้อครหาต่อความซื่อสัตย์ของพวกเขา"
 festival.104.b.success.toast: "ข่าวลือที่น่าสงสัยวนเวียนอยู่รอบตัวพวกเขา"
 festival.104.b.failure: "การปล่อยข่าวซุบซิบของท่านถูกเพิกเฉยโดยสิ้นเชิง"
 festival.104.b.failure.toast: "ความพยายามของท่านที่จะบ่อนทำลายพวกเขาล้มเหลวโดยสิ้นเชิง"

