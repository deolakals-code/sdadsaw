 festival.106.t: "วิวาห์จิ้งจอก"
 festival.106.desc: "ข้าโชคดีพอที่ได้เพลิดเพลินกับร่มเงาในศาลาเมื่อห่าฝนกระหน่ำลงมาท่ามกลางท้องฟ้าที่สว่างไสว วิวาห์จิ้งจอก อย่างที่พวกเขาเรียกกัน\n\nอนิจจา [target_character.GetTitledFirstName] ผู้น่าสงสารโดนฝนไปเต็มๆ [target_character.GetSheHe] เดินย่ำน้ำแฉะๆ เข้ามาในที่กำบังด้วยความสง่างามราวกับแมวเปียกน้ำ\n\n"ข้าขอร้องท่านล่ะ ขอเสื้อผ้าเปลี่ยนด้วย!" [target_character.GetSheHe] อ้อนวอน "[target_character2.GetTitledFirstName] กำลังมาทางนี้ และมันจะ ทำให้ข้าขายหน้าอย่างยิ่งหากถูกพบเห็นในสภาพยุ่งเหยิง เช่นนี้""
 festival.106.a: "ผู้ติดตามของข้าจะไปนำมาให้"
 festival.106.b: "ข้าจะดึงความสนใจของ [target_character2.GetHerHim] เอง รีบวิ่งไป!"
 festival.106.c: "[target_character2.GetFirstNameNoTooltip] จะต้องพบว่าเรื่องนี้ #EMP น่าขัน#! ทีเดียว"

 festival.106.b.success: "ท่านเบี่ยงเบนความสนใจของ [target_character2.GetTitledFirstName] ได้สำเร็จ"
 festival.106.b.success.toast: "ท่านเพลิดเพลินกับการพูดคุยกับ [target_character2.GetTitledFirstName]"
 festival.106.b.failure: "[target_character2.GetTitledFirstName] สังเกตเห็นว่ามีบางอย่างผิดปกติ"
 festival.106.b.failure.toast: "[target_character2.GetTitledFirstNameNoTooltip] สงสัยในตัวท่าน"

