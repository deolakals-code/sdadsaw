 festival.102.t: "ชูจอกขึ้นสูง"
 festival.102.desc: "หลังจากการเฉลิมฉลองอันรื่นเริงมาทั้งวัน พลบค่ำก็มาเยือนพวกเรา และการเฉลิมฉลองที่ #EMP แท้จริง#! ก็ได้เริ่มต้นขึ้นในที่สุด ไวน์ของเจ้าภาพไหลรินราวกับสายน้ำที่ไม่สิ้นสุด\n\nแต่ละจอกนำไปสู่อีกจอก และอีกจอก [target_character2.GetTitledFirstName] กล่าวคำล้อเล่นที่ข้าได้ยินเพียงช่วงท้าย แต่ [target_character.GetTitledFirstName] ดูเหมือนจะขบขันไม่รู้จบ บางทีการดื่มอีกสักหน่อยอาจช่วยให้ข้าหาส่วนที่น่าสนุกในนั้นเจอก็เป็นได้..."
 festival.102.a: "ไวน์ปลุกเร้าบางสิ่งในตัวข้า ข้ารู้สึกว่ากำลังจะ แต่งบทกวีได้!"
 festival.102.b: "ข้าขอดื่มจอกนี้ให้แด่ [target_character.GetTitledFirstNameNoTooltip] ผู้สูงศักดิ์!"
 festival.102.c: "ข้าคิดว่า ข้าดื่มมามากพอแล้วสำหรับค่ำคืนนี้"

