 festival.103.t: "ลิ้นโอ้อวด"
 festival.103.desc: "ขณะที่สหายของข้าและข้าเดินเล่นผ่านฝูงชน ข้าได้ยินเสียงดังแว่วมา\n\n"$language_chinese_name$ ของข้านั้น #EMP เลอเลิศ#!! ก็เมื่อครึ่งเดือนก่อน [target_character2.GetTitledFirstName] ได้ทดสอบความสามารถทางกวีของข้า และต้องยอมสยบต่อศิลปะของข้า!" [target_character.GetTitledFirstName] โอ้อวด\n\nข้าจำไม่ได้ว่ามีข่าวลือใดที่ว่า [target_character.GetHerHim] มีทักษะด้านกวี แต่การสนับสนุนคำกล่าวอ้างของ [target_character.GetHerHis] อาจเป็นประโยชน์ต่อข้า ทว่า การสั่งสอนคนขี้โม้ให้รู้สำนึกก็ยากจะห้ามใจ เช่นกัน"
 festival.103.a: ""[target_character.GetSheHe|U] พูดความจริง""
 festival.103.b: ""โปรดแสดงความสามารถของท่านให้พวกเราชมเป็นขวัญตาเถิด [target_character.GetTitledFirstNameNoTooltip]""
 festival.103.c: "ความสามารถของสหายของ #EMP ข้า#! นั้นยิ่งใหญ่กว่ามาก"
