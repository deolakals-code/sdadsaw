 festival.101.t: "แขนเสื้ออบกลิ่น"
 festival.101.desc: "ก่อนที่จะได้เห็น [target_character.GetTitledFirstName] ย่อมต้องได้ #EMP กลิ่น#! ของ [target_character.GetHerHim] เสียก่อน แม้ว่า #EMP จะเป็น#! ธรรมเนียมในการอบร่ำอาภรณ์ด้วยเครื่องหอม แต่ผลของมันน้อยครั้งนักที่จะตั้งใจให้รู้สึกได้ในระยะร้อยก้าวจากผู้สวมใส่\n\nบางที การส่งจดหมายตักเตือนอย่างเงียบๆ คงจะเหมาะสมกระมัง แม้ว่าการกระซิบต่อหูผู้อื่นอาจ ทำให้มั่นใจได้ว่าข้อบกพร่องเล็กน้อยนี้จะคงอยู่ยาวนานกว่ากลิ่นที่จางหายไป"
 festival.101.a: "ส่งคนที่มีศิลปะในการพูด...และจมูกไม่ดีไป"
 festival.101.b: "ทุกคน #EMP ต้อง#! รู้เรื่องนี้"

