 festival.1000.t: "สหายผู้ทรงเกียรติ"
 festival.1000.desc: "ขณะเพลิดเพลินกับความก้าวหน้าอย่างเนิบนาบของงานรื่นเริงอย่างเงียบๆ [bloc_member_head_1.GetTitledFirstName] แห่ง [bloc_member_head_1.GetHouse.GetBaseName] [bloc_member_head_2.GetTitledFirstName] แห่ง [bloc_member_head_2.GetHouse.GetBaseName] และข้า พบว่าตนเองกำลังแลกเปลี่ยนคำทักทายและขนมหวานกันในที่ร่ม"
 festival.1000.outro: "\n\nเราทั้งสามสามารถนับตนเองเป็นหนึ่งในขุนนางชั้นแนวหน้าของอาณาจักร และโอกาส เช่นนี้ที่จะได้พบปะสังสรรค์กันอย่างเป็นธรรมชาติมีน้อยและห่างไกลนัก"
 festival.1000.a: ""ข้าถือว่าตระกูลของข้าโชคดีที่มีสหายคุณภาพ เช่นนี้""
 festival.1000.b: ""ข้านับ [bloc_member_head_1.GetHouse.GetBaseNameNoTooltip] เป็นหนึ่งในสหายผู้มีเกียรติของข้า""
 festival.1000.c: "[bloc_member_head_1.GetFirstNameNoTooltip] ท่านสนุกกับการก้มหัวให้ [bloc_member_head_1.GetHouse.GetConfederation.GetLeadingHouse.GetBaseNameNoTooltip] หรือไม่?"
 festival.1000.e: ""คฤหาสน์ของ [bloc_member_head_1.GetHouse.GetBaseNameNoTooltip] เป็นภาพที่น่าชมยิ่ง""
 festival.1000.f: ""ปีนี้ [bloc_member_head_2.GetHouse.GetBaseNameNoTooltip] แสดงผลงานได้อย่างยอดเยี่ยม""
 festival.1000.g: "ช่วงเวลา เช่นนี้ควรค่าแก่การชื่นชม"

 festival.2000.t: "แยกย้าย"
 festival.2000.intro_desc: "เมื่องานรื่นเริงยามค่ำคืนจางลงและเปิดทางให้แสงสีทองแรกของรุ่งอรุณ ผู้เข้าร่วมงานต่างดื่มด่ำกับช่วงเวลาสุดท้ายเหล่านี้ก่อนที่จะกลับไปสู่ความจำเจของภาระหน้าที่ประจำวัน\n\n"
 festival.2000.intro_part_two: "[ROOT.Char.Custom2( 'RelationToMeShort', friendly_attendee )] ของข้า [friendly_attendee.GetTitledFirstName] เข้ามาใกล้ "มิตรภาพของท่านเป็นที่ต้อนรับอย่างยิ่งในช่วงหลายวันที่ผ่านมา" [friendly_attendee.GetSheHe] หยุดเพื่อยิ้มอย่างอบอุ่น\n\n"
 festival.2000.bloc_invitation: ""มากเสียจนข้าและมิตรสหายอยากจะขอเรียนเชิญ: ให้ท่านนับตนเองเป็นหนึ่งในพวกเรา และในทางกลับกัน พวกเราจะคอยหนุนหลังท่านเสมอ""
 festival.2000.befriending: ""คงจะเป็นเกียรติอย่างสูงหากท่านจะนับข้าเป็นหนึ่งในคนสนิทของท่านในอนาคต""
 festival.2000.nobody_likes_you: "กระแสธารของผู้คนที่ง่วงงุนและอิ่มหนำจากที่พักสู่ท้องถนนค่อยๆ เหือดหายไปจนหมด และในไม่ช้าก็เหลือเพียงคณะผู้ติดตามของข้าและตัวข้าเท่านั้น"

 festival.2000.a_accept: "ท่านสามารถวางใจในการสนับสนุนของข้าได้ เช่นเดียวกับที่ข้าจะวางใจในท่าน"
 festival.2000.a_decline: "ข้าขอบคุณท่าน แต่ข้าพึงพอใจในสิ่งที่ข้าเป็นอยู่"
 festival.2000.b_accept: "สายสัมพันธ์ เช่นนี้หาได้ยาก และควรค่าแก่การทะนุถนอม"
 festival.2000.b_decline: "ข้าซาบซึ้งในความนับถือของท่าน แต่ข้าต้องขอปฏิเสธ"
 festival.2000.c: "เราจะจดจำความสุขชั่วครู่นี้ไว้ในความทรงจำ"

