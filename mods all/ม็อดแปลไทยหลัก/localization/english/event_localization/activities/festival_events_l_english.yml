l_english: 

 festival.001.t: "พลัดหลงในฝูงชน"
 festival.001.desc: "เมื่อสังเกตฝูงชนที่มาร่วมเฉลิมฉลอง ข้าพเจ้ายินดีที่พบว่าเปี่ยมไปด้วยเสียงหัวเราะของเด็กๆ และรอยยิ้มอิ่มเอมใจของผู้เป็นพ่อแม่ ทว่า การเคลื่อนไหวที่ผิดแผกและกะทันหันกลับสะดุดตาข้า เล็กเกินกว่าจะเป็นเด็ก และ... #EMP ขนปุย#!?\n\nดูเหมือนว่าจะเป็นลูกสุนัขตัวหนึ่ง กำลังเดินกะเผลกระหว่างฝีเท้าของยักษ์ใหญ่ พลัดหลงและเดียวดาย"
 festival.001.a.tt: "#weak หาบ้านใหม่ให้เจ้าลูกหมานี่กัน #!"
 festival.001.a: "มานี่เถิด เจ้าตัวเล็ก แล้วเจ้าจะได้รับการดูแลอย่างดี"
 festival.001.b: "ชะตากรรมของมันมิใช่ธุระกงการใดของข้า"
 festival.001.b.tt: "แน่นอนว่าลูกสุนัขคงหาบ้านใหม่เองได้...กระมัง?"
 festival.001.b.custom.tooltip: "ท่านปล่อยลูกสุนัขไปตามชะตากรรม"

 festival.002.t: "จิตใจใฝ่รู้"
 festival.002.desc: "แรงดึงเบาๆ ที่แขนเสื้อฉุดความสนใจข้าพเจ้าไปจากทัศนียภาพของเทศกาล — เมื่อมองลงไป สายตาก็ประสานกับเด็กน้อยผู้หนึ่ง ดวงตากลมโตด้วยความพิศวง\n\n"เหตุใดจึงมีผู้คนมากมาย เช่นนี้?" [curious_child.GetSheHe] เอ่ยถามด้วยความสงสัยใคร่รู้อย่างไร้เดียงสา "เกิดอะไรขึ้นหรือ?""
 festival.002.a: "อืม ข้าจะเล่าเรื่องให้เจ้าฟัง..."
 festival.002.a.inspired_child: "[curious_child.GetSheHe|U] ดูเหมือนจะกระตือรือร้นที่จะฟัง"
 festival.002.a.bored_child: "เด็กคนนี้ไม่ชอบการเล่านิทาน"
 festival.002.b: "พ่อแม่ของเจ้าไม่สั่งสอนหรือ ว่าอย่าพูดคุยกับคนแปลกหน้า?"
 festival.002.b.flavor: "#weak เจ้าเด็กอวดดีนี่สมควรได้รับ "รางวัล" สำหรับความอหังการของมัน #!"
 festival.002.c: "ใครก็ได้ ส่ง [curious_child.GetHerHim] กลับไปหาพ่อแม่ของ [curious_child.GetHerHis] ที #EMP เร็วเข้า#!."

 child_is_excited: "เด็กน้อยปลาบปลื้มกับเรื่องเล่าของท่าน"
 child_is_bored: "เด็กน้อยหาวและเดินจากไปขณะที่ท่านกำลังพูด"
 child_is_kicked: "เพียงตบหูฉาดเดียว เด็กน้อยก็วิ่งหนีกลับเข้าไปในฝูงชน"

 festival.003.t: "อาหารอันโอชะ"
 festival.003.desc: "กลิ่นหอมของ [ROOT.Char.Custom('GetLocalStreetFoodPlural')] ที่ลอยมาจากแผงขายของ กระซิบสัญญาทั้งหวานและคาวแก่กระเพาะที่กำลังร้องโครกครากของข้า\n\nแถวที่ยาวเหยียดเป็นประจักษ์พยานที่มองเห็นได้ถึงความต้องการของว่างเหล่านี้ แต่แน่นอนว่าเจ้าภาพของวันย่อมต้องได้รับสิทธิพิเศษ #EMP บ้าง#! มิใช่หรือ?!"
 festival.003.a: "หลีกทางให้ [ROOT.Char.GetTitleAsNameNoTooltip]!"
 festival.003.b: "ปล่อยให้ผู้คนเพลิดเพลินกับความสุขเล็กๆ น้อยๆ ของพวกเขาเถิด"

 festival.004.t: "คำอธิษฐานกระซิบ"
 festival.004.desc: "เหล่าแขกเหรื่อรวมตัวกันรอบต้นไผ่ กิ่งก้านของมันประดับด้วยแผ่นกระดาษที่จารึกคำปรารถนาของเจ้าของ\n\nภายใต้แสงนวลของดวงดาว ผู้คนของข้าฝากฝังความฝันของพวกเขาไว้กับคู่รักเบื้องบน และข้าก็ตระหนักได้ว่า ตัวข้าเองก็อาจมีคำอธิษฐานที่อยากขอ เช่นกัน"
 festival.004.a: "ขอทวยเทพจงดลบันดาลความมั่งคั่งและความอุดมสมบูรณ์แก่ทุกคน"
 festival.004.b: "ข้าปรารถนาความรักอันเป็นนิรันดร์ดุจดวงดาว"
 festival.004.c: "โปรดประทานพละกำลังให้ข้าเพื่อบรรลุความทะเยอทะยานของข้า"
 festival.004.d: "ข้าปรารถนาที่จะพบรักในเร็ววัน"
 prosperity_festival_in_province_modifier: "คำอธิษฐานเพื่อความเจริญรุ่งเรือง"
 prosperity_festival_in_province_modifier_desc: "ดวงดาวดูเหมือนจะเข้าข้างเคาน์ตีนี้ และผู้ปกครองได้อธิษฐานขอความเจริญรุ่งเรืองแก่ทุกคน"
 prosperity_festival_find_love_modifier: "คำอธิษฐานเพื่อความรัก"
 prosperity_festival_find_love_modifier_desc: "ตัวละครนี้อธิษฐานขอให้พบรัก"
 prosperity_festival_health_modifier: "คำอธิษฐานเพื่อสุขภาพ"
 prosperity_festival_health_modifier_desc: "ตัวละครนี้อธิษฐานขอสุขภาพที่ดี"

 festival.005.t: "ผู้ฟังจำยอม"
 festival.005.desc: "ขณะที่เทศกาลดำเนินมาถึงจุดสูงสุด [target.chaplain.Custom('MyPriestTitle')] ของข้าก็ขึ้นเวที เสียงของ [target_chaplain.GetHerHis] ดังกึกก้องเหนือฝูงชน [target_chaplain.GetSheHe|U] เริ่มยกย่องการปฏิรูปศีลธรรมและวินัยทางจิตวิญญาณ พยายามเปลี่ยนพลังงานอันสนุกสนานของเทศกาลให้กลายเป็นการเทศนา บ้างก็พบว่าคำพูดของ [target_chaplain.GetHerHis] สร้างแรงบันดาลใจ ขณะที่คนอื่นๆ บ่นพึมพำว่าเทศกาลไม่ใช่สถานที่สำหรับความเคร่งขรึม เช่นนี้"
 festival.005.a: "[target_chaplain.GetSheHe|U] กล่าวในนามแห่งพระผู้เป็นเจ้า"
 festival.005.b: "ข้าจะไปพูดให้ [target_chaplain.GetHerHim] เข้าใจเหตุผลเอง"
 festival.005.c: "ข้าเบื่อหน่ายกับคำพูดยืดยาวนี่แล้ว เอา [target_chaplain.GetHerHim] ลงมาจากตรงนั้นที!"
 festival.005.b.success: "ท่านเกลี้ยกล่อมให้ [target_chaplain.GetHerHim] ลงจากเวทีได้สำเร็จ"
 festival.005.b.tt.success: "ท่านเกลี้ยกล่อม [target_chaplain.GetHerHim] ได้สำเร็จ"
 festival.005.b.failure: "ความกระตือรือร้นที่ขับเคลื่อนด้วยศรัทธาของ [target_chaplain.GetHerHis] ยังไม่มอดดับ"
 festival.005.b.tt.failure: "ท่านเกลี้ยกล่อม [target_chaplain.GetHerHim] ไม่สำเร็จ"

 festival.006.t: "พิธีชำระล้าง"
 festival.006.desc: "เมื่อการสวดภาวนาอันศักดิ์สิทธิ์สิ้นสุดลง เหล่า [ROOT.Char.GetFaith.PriestNeuterPlural] ก็เริ่มพิธีชำระล้าง ซึ่งจะชะล้างมลทินทางจิตวิญญาณทั้งปวงและประกันถึงปีที่เปี่ยมไปด้วยความผาสุก ในฐานะส่วนหนึ่งของพิธี ข้ามีหน้าที่อันศักดิ์สิทธิ์ในการตักน้ำบริสุทธิ์จากบ่อน้ำศักดิ์สิทธิ์"
 festival.006.a: "วันนี้ ความอ่อนน้อมถ่อมตนย่อมดีกว่าความหยิ่งทะนง"
 festival.006.b: "การแสดงความหรูหราโอ่อ่าตอนนี้สามารถยกระดับเกียรติภูมิของข้าได้"
 festival.006.c: "ให้ผู้ที่ด้อยกว่าจัดการเรื่องนี้เถิด มันจึงจะสมฐานะของข้า"

 festival.007.t: "การประลองแสงจันทร์"
 festival.007.desc: "ดวงจันทร์ลอยสูงบ่งบอกการมาถึงของเที่ยงคืน และพร้อมกันนั้นคือการเริ่มต้นการประลองพละกำลังอันเป็นที่นิยมชมชอบของผู้คนตลอดมา [ROOT.Char.GetFaith.PriestMale] จะโยนแท่งไม้เข้าไปกลางฝูงชน โดยมีธรรมเนียมเล่าว่า ผู้ที่ฝ่าฟันออกมาพร้อมแท่งไม้ในมือจะได้รับโชคลาภอันยิ่งใหญ่ในปีที่จะมาถึง"
 festival.007.a: "โชคลาภนี้ต้องเป็นของข้า!"
 festival.007.b: "ข้าจะปล่อยให้ผู้อื่นเหนื่อยล้าไปก่อน แล้วค่อยฉวยชัยชนะมาอย่างเงียบๆ"
 festival.007.c: "การประลองบางอย่าง เหมาะที่จะชื่นชมจากกลุ่มผู้ชมมากกว่า"
 festival.007.a.success: "ท่านเอาชนะคู่ต่อสู้ด้วยกำลัง"
 festival.007.a.failure: "คู่ต่อสู้ของท่านมีกำลังเหนือกว่า"
 festival.007.b.success: "ท่านใช้สติปัญญาเหนือคู่ต่อสู้"
 festival.007.b.failure: "คู่ต่อสู้ของท่านไม่หลงกล"
 festival.007.a.tt.success: "ท่านชนะ"
 festival.007.a.tt.failure: "ท่านแพ้"

 festival.008.t: "ระบำแห่งความอุดมสมบูรณ์"
 festival.008.desc: "มวลอากาศสั่นสะเทือนด้วยเสียงขลุ่ยผิวและเสียงทุ้มของกลอง ขณะที่เหล่า [dancer.GetWomenMen] หนุ่มสาวร่ายรำอย่างสง่างามในอาภรณ์สีสันสดใสพริ้วไหว\n\nการแสดงอันอ่อนช้อยของพวกเขา อันเป็นที่พึงพอใจต่อทั้งมนุษย์และเทพเจ้า ที่จะอวยพรผืนดินใต้เท้าของเราให้มีการเก็บเกี่ยวที่อุดมสมบูรณ์"
 festival.008.a: "ช่างเป็นระบำที่งดงามยิ่งนัก"
 festival.008.b: "เมื่อมองพวกเขา ข้าสัมผัสได้ถึงความสงบสุขอันแท้จริง"
 respected_tradition_modifier: "ธรรมเนียมที่ได้รับการเคารพ"

 festival.009.t: "คำอธิษฐานบนต้นไม้"
 festival.009.desc: "มีธรรมเนียมท้องถิ่นใน [ROOT.Char.GetInvolvedActivity.GetCurrentPhase.GetLocation.GetBaronyNameExplicitlyNoTooltip] ที่ผู้คนจะฝากฝังความปรารถนาจากใจจริงไว้บนแผ่นกระดาษและแขวนไว้บนต้นไม้\n\nเมื่อพินิจดูใกล้ๆ ข้าเห็นว่าคำอธิษฐานส่วนใหญ่ก็เป็นอย่างที่คาดเดาได้ - ความมั่งคั่ง ความรัก ความเจริญรุ่งเรือง ทว่าในหมู่คำอธิษฐานเหล่านั้น กลับมีบางส่วนที่จารึกความปรารถนาอันดำมืดไว้"
 festival.009.a: "การล่วงรู้ความคิดส่วนลึกที่สุดของผู้อื่นถือเป็นความได้เปรียบมิใช่น้อย"
 festival.009.b: "ความมุ่งร้ายไม่มีที่ยืนท่ามกลางกิ่งก้านเหล่านี้"

 festival.010.t: "พรจากกระดาษ"
 festival.010.desc: "ท้องถนนเปี่ยมไปด้วยความสดใสและสีสัน เครื่องประดับนับไม่ถ้วนปลิวไสวสว่างไสวในสายลม เสียงไชโยโห่ร้องและเสียงหัวเราะดังไปทั่วขณะที่ผู้คนชื่นชมสินค้าของช่างฝีมือ บางทีข้าอาจจะหาของที่ระลึกเหล่านี้ไว้สักชิ้นกระมัง?"
 festival.010.a: "นกกระเรียนกระดาษสีสันสดใสหนึ่งชุด เครื่องเตือนใจถึงความสำคัญของครอบครัว"
 festival.010.b: "กิโมโนกระดาษพับอย่างวิจิตร สัญลักษณ์แห่งสุขภาพ"
 festival.010.c: "ปล่อยให้ผู้อื่นประดับประดา เช่นนั้นเถิด ความเรียบง่ายเหมาะกับข้าที่สุดแล้ว"
 good_health_modifier: "สุขภาพดี"
 good_health_modifier_desc: "ตัวละครนี้ซื้อเครื่องประดับกิโมโนกระดาษ"
 strong_family_modifier: "สายใยแห่งครอบครัว"
 strong_family_modifier_desc: "ตัวละครนี้ซื้อเครื่องประดับนกกระเรียนกระดาษ"

 festival.012.t: "การเฉลิมฉลองอันอึกทึก"
 festival.012.desc: "โคมไฟส่องสว่างให้ความบันเทิงยามค่ำคืน ขณะที่บรรยากาศอวลไปด้วยเสียงดนตรีและเสียงหัวเราะที่ดังเป็นระยะ ข้าอดไม่ได้ที่จะรู้สึกตื่นเต้นไปกับภาพตรงหน้า"
 festival.012.a: "ความสุขเรียบง่ายของพวกเขาช่วยปลอบประโลมจิตวิญญาณอย่างอ่อนโยน"
 festival.012.b: "ความมีชีวิตชีวานี้ช่างปลุกพลังอย่างแท้จริง"
 festival.012.c: "เสียงอึกทึกนี้ช่างท่วมท้น - ข้าโหยหาความเงียบสงบ"
 festival_spirit_modifier: "จิตวิญญาณแห่งเทศกาล"
 festival_spirit_modifier_desc: "จิตวิญญาณของตัวละครนี้ได้รับการปลุกพลังจากบรรยากาศของเทศกาล"

 festival.014.t: "วันแห่งแขนเสื้อเริงระบำ"
 festival.014.desc: "วันนี้เป็นโอกาสสำหรับการเฉลิมฉลอง แต่ยังเป็นการขอพรจากทวยเทพด้วย สายตาของทั้งมนุษย์และเทพเจ้าจะจับจ้องการกระทำและเครื่องบูชาของเรา ดังนั้นเราต้องใส่ใจ เพื่อให้แน่ใจว่าทุกอย่างเป็นไปอย่างเรียบร้อย"
 festival.014.a: "ขอทวยเทพโปรดเมตตาพวกเราด้วยเถิด"

 festival.016.t: "เกียรติยศที่เปื้อนเปรอะ"
 festival.016.desc: "[ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('clumsy_oaf'))] ของข้า [clumsy_oaf.GetFirstName] ยืนนิ่งด้วยความหวาดกลัวสุดขีด ขณะที่เราทั้งคู่จ้องมองสาเกที่หยดจากอาภรณ์ของข้า เสื้อผ้าหรูหรานั้นเริ่มคล้ำลงด้วยรอยเปื้อนที่แผ่ขยาย\n\nผู้คนรอบข้างเรายืนนิ่งด้วยความอยากรู้อยากเห็น ซ่อนปฏิกิริยาของตนไว้หลังพัดที่วาดลวดลาย เฝ้ารอ — ไม่สิ คาดหวัง — การระเบิดอารมณ์ที่จะตามมา"
 festival.016.a: "เจ้าคนโง่เง่าซุ่มซ่าม! [clumsy_oaf.GetSheHe|U] จะต้องชดใช้!"
 festival.016.b: "เสื้อผ้าหาใหม่ได้"

 festival.017.t: "หุ่นกระบอกขบถ"
 festival.017.desc: "นักเชิดหุ่นเร่ร่อนตัดสินใจใช้เทศกาลเป็นเวทีของ [puppeteer.GetHerHis] ท่ามกลางผู้ร่วมงานหลายสิบคนที่กำลังหัวเราะคิกคัก\n\nขณะที่ข้ามองดูหุ่นกระบอกเต้นรำ การแสดงของพวกมันเริ่มมีแง่มุมที่น่าอึดอัดใจ ร่างของผู้ปกครองที่เข้มงวดนั้นช่างคุ้นตาเกินไปสำหรับข้า และฝูงชนก็ดูขบขันกับความซุ่มซ่ามของ [ROOT.Char.GetHerHis] มากเกินไป"
 festival.017.a: "ข้าจะหัวเราะให้ดังกว่าผู้ใด!"
 festival.017.b: "เผาตุ๊กตาอวดดีพวกนี้ซะ"
 festival.017.c: "คนของข้าควรสังเกตปฏิกิริยาของผู้ชม"

 festival.018.t: "ภวังค์และเครื่องบรรณาการ"
 festival.018.desc: "มิโกะประจำศาลเจ้าสั่นเทิ้มอย่างบ้าคลั่งราวกับถูกสิง เสียงราวกับมาจากโลกอื่นของนางตะโกนบัญชาแห่งทวยเทพ\n\nดูเหมือนว่าเทพองค์นี้จะชื่นชอบสาเกเป็นพิเศษ และในปริมาณที่มากโข การปฏิเสธย่อมเป็นการล่วงเกินตัวตนอันทรงพลัง แต่ข้าก็อดสงสัยไม่ได้ว่านี่อาจเป็นการแสดงอันไร้ศรัทธามากกว่าการอัญเชิญ"
 festival.018.a: "ไปเอาสาเกมา และเรามาดื่มด้วยกันเถิด!"
 festival.018.b: "เพียงแค่ถ้วยเล็กๆ พอเป็นพิธีพร้อมคำเชิญ..."
 festival.018.c: "การแสดงนี้จบสิ้นแล้ว"
 friend_invited_priestess: "[CHARACTER.GetShortUIName|U] ได้เชิญ [TARGET_CHARACTER.GetShortUIName] ให้เข้าร่วมราชสำนักของ [CHARACTER.GetHerHis] หลังจากได้เห็นการแสดงอันน่าประทับใจของ [TARGET_CHARACTER.GetHerHis] ที่เทศกาล"
 friend_invited_priestess_corresponding: "[CHARACTER.GetShortUIName|U] ได้รับเชิญไปยังราชสำนักของ [TARGET_CHARACTER.GetShortUINamePossessive] หลังจากได้เห็นการแสดงอันน่าประทับใจของ [CHARACTER.GetHerHis] ที่เทศกาล"

 festival.019.t: "ละครตามพระประสงค์"
 festival.019.desc: "สจ๊วตของข้า [play_planner.GetFirstName] โค้งคำนับอย่างนอบน้อมต่อหน้าข้า "จะมีการแสดงละคร [ROOT.Char.Custom('FormOfAddressForLiege')]," [play_planner.GetSheHe] กล่าว "แต่การเลือกเรื่องราวนั้นเป็นสิทธิ์ของท่าน" มันควรจะเป็นสิ่งที่ให้ความบันเทิงแก่ผู้คน หรือเตือนสติพวกเขาถึงที่ทางของตน?"
 festival.019.a: "จงเป็นตำนานแห่งความรุ่งโรจน์ของตระกูลข้า"
 festival.019.b: "ละครสอนศีลธรรมจะสอนคุณธรรมแห่งการเชื่อฟัง"
 festival.019.c: "อุทิศมันแด่ทวยเทพและให้เราได้รับพรจากพวกเขา"

 festival.020.t: "เกียรติยศควบม้า"
 festival.020.desc: "แม่น้ำทอประกายระยิบระยับภายใต้แสงตะวันยามเที่ยง ขณะที่เหล่านักธนูขึ้นม้า ส่วนอีกฟากของลำธาร เหล่าผู้ติดตามก็ยกเป้าของพวกเขาขึ้น: พัดกระดาษ\n\nณ ที่ใดที่หนึ่ง เสียงกลองดังกระหึ่ม กลบเสียงพึมพำของการวางเดิมพันชั่วขณะ ว่านักธนูคนใดจะได้รับชัยชนะ"
 festival.020.a: "เตรียมม้าศึกของข้า — รางวัลจะเป็นของข้า!"
 festival.020.b: "ข้าจะวางเดิมพันด้วยตัวเอง!"
 festival.020.c: "ปล่อยให้พวกเขายิงไป แต่จงนำเศษเสี้ยวของพัดมาให้ข้าเพื่อเป็นสิริมงคล"

 festival.021.t: "ขบวนแห่จากนรก"
 festival.021.desc: "จังหวะที่คาดเดาได้ของงานรื่นเริงพลันหยุดชะงักด้วยการมาถึงของ "ยักษ์" สวมหน้ากาก ที่ควงคบเพลิงลุกโชน สาดประกายไฟใส่ฝูงชนที่กำลังแตกหนี ในบริเวณใกล้เคียง เหล่านักบวชเตรียมพร้อมสำหรับการโต้กลับ พิธีกรรมอันมิอาจหลีกเลี่ยงเพื่อชัยชนะเหนือวิญญาณชั่วร้าย"
 festival.021.a: "ข้าจะนำ "การโต้กลับ" นี้ด้วยตนเอง!"
 festival.021.b: "จง ทำให้แน่ใจว่าทุกครัวเรือนมีถังน้ำเตรียมพร้อม"
 festival.021.c: "ไม่ว่าจะเป็นธรรมเนียมหรือไม่ ความเสี่ยงที่จะเกิดอัคคีภัยนั้นสูงเกินไป"

 festival.022.t: "ประลองเทศกาล"
 festival.022.desc: "[rumbler_one.GetWomenMen] สองคนจากหมู่บ้านใกล้เคียงได้มารวมตัวกันที่ลานเทศกาลเพื่อสะสางความขัดแย้งตามธรรมเนียม — โดยการชูเกี้ยวของตนขึ้นสูงและกระแทกใส่กัน เพื่อพยายาม ทำให้เกี้ยวของฝ่ายตรงข้ามร่วงลงสู่พื้น\n\nเศษไม้กระเด็นทุกครั้งที่ปะทะ! เสียงเชียร์อันอึกทึกของฝูงชนกระตุ้นให้นักสู้ปะทะกันอย่างดุเดือดยิ่งขึ้น"
 festival.022.a: "ข้าไม่อนุญาตให้มีความรุนแรง ไม่ว่าจะเป็นธรรมเนียมใดก็ตาม!"
 festival.022.b: "ผู้ชนะจะได้รับรางวัลอย่างงาม!"
 festival.022.c: "หากฝูงชนต้องการชมการแสดง พวกเขาก็ต้องจ่าย เพื่อที่จะได้เห็น"

 festival.023.t: "ขบวนแห่อันตราย"
 festival.023.desc: "เสียงกลองหนังกวางดังกระหึ่ม ประกาศการเริ่มต้นของขบวนแห่ในพิธี ผู้ถือธงนำขบวนอย่างภาคภูมิใจ ในชุดเทศกาลอันวิจิตรงดงาม ตามด้วยเกี้ยวอันสง่างาม ที่ถูกแบกสูงขึ้นบนบ่าของผู้ติดตาม\n\n"ระวัง!" ขบวนแห่อันงดงามพลันแตกสลาย เมื่อคนแบกเกี้ยวตะโกนขึ้น พลางปล่อยมือที่จับ ส่งผลให้เกี้ยวเอียงอย่างน่าหวาดเสียว"
 festival.023.a: "ทรงตัวไว้ ข้ากำลังไป!"
 festival.023.b: "จงโบยตีเจ้าโง่นั่น และให้หมู่บ้านของมันจ่ายค่าปรับ"

 festival.024.t: "ระบำสงครามไม้"
 festival.024.desc: "#EMP เปรี้ยง!#! #EMP เปรี้ยง!#! เสียงดังเหล่านี้ควรขับไล่วิญญาณชั่วร้ายทั้งปวงให้หนีไป! เหล่าเยาวชนในหมู่บ้านที่อยู่เบื้องหน้าข้า ยังคงกระทืบเท้าต่อไปและฟาดไม้พลองของตนด้วยความฮึกเหิมของนักรบผู้ดุดัน\n\nธรรมเนียมอันปลุกเร้านี้อาจพิสูจน์ได้ว่ามีประโยชน์ในแนวรบอื่น หากไม้พลองของพวกเขาถูกเปลี่ยนเป็นหอก"
 festival.024.a: "หมายตาผู้ที่แข็งแกร่งที่สุดไว้ — เราต้องการคน เช่นนั้น"
 festival.024.b: "ความแม่นยำของพวกเขาน่าชื่นชมนัก!"
 festival.024.c: "ช่างเป็นการแสดงพลังที่น่าทึ่ง"

