 festival.105.t: "การทดสอบปัญญา"
 festival.105.desc: "กระดาษโน้ต จารึกด้วยลายมืออันงดงาม ห้อยอย่างบอบบางจากกิ่งไม้ "[target_character.GetTitledFirstName] มอบปริศนาให้พวกเรา!" [target_character2.GetTitledFirstName] อุทานขึ้น\n\n"มันเป็นคำท้าทายต่างหาก" [target_character3.GetTitledFirstName] โต้กลับ "[target_character.GetSheHe|U] คิดว่า [target_character.GetHerselfHimself] ฉลาดที่สุดในหมู่พวกเรา [target_character.GetSheHe] เสนอว่าจะมอบสิ่งใดก็ได้ที่ต้องการจาก [target_character.GetHerHim] ให้แก่ผู้ที่ไขปริศนาได้เป็นคนแรก #EMP เห็นได้ชัด#! ว่า [target_character.GetSheHe] ไม่คาดคิดว่าพวกเราคนใดจะทำสำเร็จ""
 festival.105.a: "ข้าจะไขปริศนานี้ และพร้อมกันนั้นคือความเย่อหยิ่งของ [target_character.GetTitledFirstNamePossessiveNoTooltip]!"
 festival.105.b: "ช่างเป็นปริศนาที่ซับซ้อนนัก! ความเฉลียวฉลาดของ [target_character.GetHerHis|U] นั้นไม่มีใครเทียบได้จริงๆ"
 festival.105.c: "การเริ่มต้นของการประลองปัญญา!"

 festival.105.a.success: "ท่านไขปริศนาได้อย่างง่ายดายน่าประทับใจ"
 festival.105.a.success.toast: "ท่านไขปริศนาได้อย่างง่ายดาย"
 festival.105.a.failure: "ท่านจนปัญญาต่อปริศนา"
 festival.105.a.failure.toast: "ท่านไขปริศนาไม่สำเร็จ"

 festival.105.c.success: "ท่านไขปริศนาและ ทำให้เพื่อนนักไขปริศนาของท่านสับสนในระดับที่เท่าเทียมกัน"
 festival.105.c.success.toast: "งานเลี้ยงปริศนาประสบความสำเร็จอย่างงดงาม"
 festival.105.c.failure: "การแสดงความสามารถของท่านไม่น่าประทับใจ"
 festival.105.c.failure.toast: "งานเลี้ยงปริศนากลายเป็นการโต้เถียงกันในเรื่องเล็กน้อย"

