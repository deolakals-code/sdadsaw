 festival.100.t: "ในคืนจันทร์ส่องแสง"
 festival.100.desc: "ผู้ส่งสารที่เชิญข้าไปงานเลี้ยงชมจันทร์ของ [target_character.GetTitledFirstNamePossessive] แทบจะยังไม่ทันกล่าวจบ อีกคนหนึ่งก็มาถึง ถือจดหมายเชิญข้าไปร่วมกับ [target_character2.GetTitledFirstName] แทน!\n\nจังหวะเวลา เช่นนี้ #EMP คงมิใช่#! เรื่องบังเอิญเป็นแน่ ต่างฝ่ายต่างต้องการหยั่งเชิงข้าอย่างชัดเจน และการตอบรับคำเชิญหนึ่งย่อมถูกตีความว่าเป็นสัญญาณว่าข้าเข้าข้างผู้เขียน และในขณะเดียวกันก็เป็นการแสดงความรังเกียจต่อคู่ปรับของ [target_character.GetHerHis]"
 festival.100.a: "ข้าจะให้เกียรติไปร่วมงานของ [target_character.GetTitledFirstNameNoTooltip]"
 festival.100.b: "ข้าคิดว่าข้าชื่นชอบการร่วมสังสรรค์กับ [target_character2.GetTitledFirstNamePossessiveNoTooltip] มากกว่า"
 festival.100.c: "ส่งคำปฏิเสธพร้อมของกำนัลเล็กน้อยเพื่อแสดงความนับถือไปยังทั้งสองฝ่าย"
 festival.100.d: "เราจงจัดงานสังสรรค์ของเราเองและบดบังรัศมีพวกเขาทั้งคู่เสีย!"

