 festival.107.t: "การผจญภัยเชิงชู้สาว"
 festival.107.desc: ""[ROOT.Char.GetTitledFirstNameNoTooltip]!" [target_character2.GetTitledFirstName] ทักทายข้าขณะที่ข้าเดินผ่าน พลางกวักมือเรียกข้าเข้าไปใกล้กลุ่มของ [target_character2.GetHerHis]\n\n"ท่านได้ยินเรื่องที่เกิดขึ้นระหว่าง [target_character.GetTitledFirstName] กับ [courtier_host.Custom2('RelationToMeShort', SCOPE.sC('character_of_rumor'))] ของ [courtier_host.GetTitledFirstNamePossessive] [character_of_rumor.GetTitledFirstName] แล้วหรือยัง?" [target_character2.GetSheHe] กระซิบ "ข้ามีเหตุให้เชื่อว่า [target_character.GetSheHe] ไปไกลถึงห้องชั้นในของ [character_of_rumor.GetHerHis] แต่คนรับใช้ที่ข้าติดสินบนมาบอกข้าได้ไม่มากไปกว่านั้น"\n\nแน่นอนว่า คนรับใช้ #EMP ขึ้นชื่อ#! ว่าเป็นแหล่งข่าวซุบซิบที่เชื่อถือได้ แต่ไม่ว่าคำกล่าวอ้างนี้จะเป็นจริงหรือไม่ นี่เป็นโอกาสอันยอดเยี่ยมที่จะมีอิทธิพลต่อชื่อเสียงของ [target_character.GetTitledFirstNamePossessiveNoTooltip]"
 festival.107.a: "อืม #EMP ข้า#! ได้ยินมาว่า [character_of_rumor.GetSheHe] ปล่อยให้ [target_character.GetHerHim] อยู่หน้าประตูตลอดทั้งคืน!"
 festival.107.b: "พวกเขาเห็นเพียงเล็กน้อย แต่ #EMP ได้ยิน#! เยอะอย่างแน่นอน!"
 festival.107.c: "หากท่านชื่นชมการกระทำเชิงชู้สาว สหายของข้ามีเรื่องเล่าที่เหนือกว่านั้นมาก"

 festival_embarrassed_me: "ทำให้ข้าอับอาย"
 festival_reinforced_group_cohesion: "กระชับความสัมพันธ์"
 festival_enhanced_amorous_reputation: "เพิ่มพูนชื่อเสียงด้านชู้สาว"

 festival.108.t: "อ่านระหว่างรอยพับ"
 festival.108.desc: "ข้าเห็น [target_character2.GetTitledFirstName] กำลังเดินเข้ามา ดวงตาเป็นประกายด้วยความเจ้าเล่ห์ "ข้าพบสิ่งนี้ตกอยู่ในเงาของศาลา" [target_character2.GetSheHe] เริ่มต้น "ข้าจำได้ชัดเจนว่ามันอยู่ในมือของ [target_character.GetTitledFirstNamePossessive] เมื่อไม่กี่ชั่วโมงก่อน และมีข้อความที่... #EMP สองแง่สองง่าม#! จารึกอยู่"\n\n"เรา #EMP น่าจะ#! คืนมันให้ [target_character.GetHerHim]... #EMP หรือ#! บางทีข้าอาจจะจัดการให้มันถูก 'ส่ง' ไปให้คนอื่นในนามของ [target_character.GetHerHis] อย่างโจ่งแจ้ง บางทีอาจจะเป็น [target_character4.GetTitledFirstName] [target_character3.Custom2('RelationToMeShort', SCOPE.sC('target_character4'))] ของ [target_character3.Custom('MistressMaster')] ของ [target_character.GetHerHis] [target_character3.GetTitledFirstName]?""
 festival.108.a: "เป็นข้อเสนอที่ยอดเยี่ยม! จัดการตามนั้นเถิด"
 festival.108.b: "เอามันมานี่ ข้าจะคืนมันให้ #EMP ด้วยตนเอง#!"
 festival.108.c: "ให้เรื่องนี้อยู่ระหว่างเราสองคนไปก่อน แค่ท่านกับข้า"

 festival.109.t: "บทกวีภายใต้แรงกดดัน"
 festival.109.desc: "เสียงหัวเราะคิกคักดึงข้าไปยังที่ ซึ่งฝูงชนกลุ่มเล็กๆ มุงอยู่รอบสหายของเราสองคน "ขับขานบทกวีให้พวกเราฟังสิ [target_character2.GetTitledFirstName]!" [target_character.GetTitledFirstName] กระตุ้น น้ำเสียงเจือความเยาะเย้ยที่แทบไม่ปิดบัง "แน่นอนว่าท่านคงพอทำได้สัก #EMP บท#! ล่ะน่า?"\n\n[target_character2.GetFirstNameNoTooltip] ผู้ ซึ่งเป็นที่รู้กันว่ามีความสุนทรีย์ทางกวีราวกับก้อนหิน มองมาที่ข้าด้วยสายตาอ้อนวอนของสัตว์จนตรอก"
 festival.109.a: "มาต่อบทกวีกันเถิด ข้าเริ่มก่อน และ #EMP ท่าน#! ต่อ [target_character.GetFirstNameNoTooltip]"
 festival.109.b: "ทำให้พวกเราทึ่งในปฏิภาณไหวพริบของท่านสิ [target_character2.GetFirstNameNoTooltip]"
 festival.109.c: "หากท่านแสวงหาศิลปะที่แท้จริง จงมองหาในหมู่ #EMP พวกเรา#!"

