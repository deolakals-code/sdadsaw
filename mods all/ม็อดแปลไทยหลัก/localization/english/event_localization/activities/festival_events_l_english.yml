 festival.114.t: "ถูกทิ้งไว้บนฝั่ง"
 festival.114.desc: "ขณะรับอากาศยามค่ำคืน สหายของข้าและข้าพเจ้าก็มาพบ [target_character.GetTitledFirstName] กำลังจ้องมองผืนน้ำอย่างโหยหา\n\nในตอนแรก ข้าคิดว่าเขาหลงใหลในความงามของแสงจันทร์ที่สะท้อนบนผิวน้ำ แต่เสียงจากกลุ่มนักสังสรรค์ก็ดึงความสนใจของข้า ดูเหมือนว่าพวกเขาจะลงเรือไป และ [target_character.GetTitledFirstName] ผู้น่าสงสารถูกทิ้งไว้ข้างหลัง!"
 festival.114.a: ""ลืมพวกเขาเสีย แล้วมาร่วมกับเรา!""
 festival.114.b: ""น่าสมเพชเสียจริง! การถูกทอดทิ้งเหมือนของเล่นพังๆ มันเป็น เช่นไร?""
 festival.114.c: "#EMP พวกเรา#! ไม่เคยทอดทิ้งพวกพ้องของตนเอง"

