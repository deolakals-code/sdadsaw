l_english: 
 feast_header:0 "งานเลี้ยง:"
 feast_default.1001.t:2 "ด้วยความยำเกรง"
 feast_default.1001.very_high_learning:0 "หลังจากการสนทนาอย่างกว้างขวางเคล้าอาหารอันโอชะ [impressed_guest.GetTitledFirstName] ได้แสดงความเห็นว่า [impressed_guest.GetSheHe] พบว่าข้าพเจ้าเป็นผู้คงแก่เรียนและเฉลียวฉลาดยิ่งนัก และถ้อยคำของข้าพเจ้าล้วนมีคุณค่าประมาณมิได้แก่ผู้ที่อ่านน้อยกว่าข้าพเจ้าเสมอ"
 feast_default.1001.high_learning:0 "หลังจากการสนทนาอย่างกว้างขวางเคล้ามื้ออาหาร [impressed_guest.GetTitledFirstName] ได้แสดงความเห็นว่า [impressed_guest.GetSheHe] ชื่นชมในความสามารถของข้าพเจ้าที่สามารถขยายความในหัวข้อใดๆ ก็ได้"
 feast_default.1001.average_learning:0 "หลังจากได้สนทนากันระหว่างมื้อค่ำครู่หนึ่ง [impressed_guest.GetTitledFirstName] ก็เอนตัวมาบอกข้าพเจ้าว่า [impressed_guest.GetSheHe] รู้สึกประทับใจที่ข้าพเจ้ารอบรู้ในเรื่องต่างๆ มากมาย"
 feast_default.1001.low_learning:0 "ขณะที่ข้าพเจ้ากำลังพูดคุยกับผู้คนระหว่างมื้อค่ำ [impressed_guest.GetTitledFirstName] ก็เอนตัวเข้ามา "ข้าอยากรู้วิธี ทำให้ฟังดูฉลาดเหมือนท่านจัง [ROOT.Char.GetTitledFirstName]!"\n\nข้าพเจ้าเช็ดซุปออกจากคางแล้วยิ้มอย่างชาญฉลาด"
 feast_default.1001.a:0 "[impressed_guest.GetSheHe|U] รู้จักปัญญาที่แท้จริง ข้าเห็นแล้ว"

 feast_default.1002.t:1 "การรอคอยอันเหลือทน"
 feast_default.1002.desc:0 "ข้าไม่อยากจะเชื่อเลยว่าเรารออาหารนานขนาดนี้! เรามาที่นี่เพื่อกิน หรือเพื่อชื่นชมลายไม้ของโต๊ะกันแน่? ท่านกำลังจ้องมองอะไรอยู่ [other_guest.GetTitledFirstName] ข้าแค่หิวมาก!"
 feast_default.1002.a:0 "ข้าได้กลิ่นมาจากครัวด้วยซ้ำ!"
 feast_default.1002.gluttons_and_impatients:0 "แขกผู้ไม่อดทนและตะกละทุกคน"

 feast_default.1003.t:1 "ด้วยความยำเกรง"
 feast_default.1003.desc:0 "หลังจากนั่งทานอาหารข้างกันครู่หนึ่ง ข้าพเจ้าคงพูดอะไรที่ฉลาดเป็นพิเศษออกไป เพราะ [other_guest.GetTitledFirstName] ชมข้าพเจ้าว่าฉลาดเพียงใด!\n\nเพื่อเป็นการตอบสนอง ข้าพเจ้ายิ้มอย่างชาญฉลาดกลับไปยังเพื่อนนักปราชญ์ ก่อนที่จะง่วนอยู่กับคราบมันที่ไหลลงมาตามคาง"
 feast_default.1003.a:0 "ข้าก็พูดอะไรฉลาดๆ บ้างเป็นบางครั้ง"
 feast_default.1003.b:0 "ข้าไม่รู้เลยว่า [other_guest.GetSheHe] รู้สึก เช่นนั้น!"

 feast_default.1004.t:1 "ความสุขสำราญดุจสวรรค์"
 feast_default.1004.desc_exotic:0 "อา นี่คืออาหารประเภทใดกัน รสชาติช่างเข้มข้นยิ่งนัก? ข้าไม่เคยเห็นหรือลิ้มรสอาหารแปลกใหม่ที่น่าทึ่ง เช่นนี้มาก่อนเลย! โอ้ และขนมหวานหรูหราที่แปลกประหลาดอย่างน่าอัศจรรย์เหล่านี้!\n\nงานเลี้ยงนี้มีอาหารเลิศรสที่ข้าไม่เคยเห็นมาก่อนและสงสัยว่าจะได้เห็นอีกหรือไม่! ข้าต้องถามถึงที่มาเสียแล้ว!"
 feast_default.1004.desc_lavish:0 "ช่างเป็นอาหารและของหวานที่มากมายและหลากหลายไม่สิ้นสุดอะไร เช่นนี้! นี่คืออาหารประเภทที่ข้าคาดหวังได้ใน [ROOT.Char.GetFaith.PositiveAfterLife] หรือ? โอ้ และขนมหวานที่มีให้เลือกมากมายอะไร เช่นนี้!\n\nนี่ต้องเป็นอาหารที่มากที่สุดเท่าที่ข้าเคยเห็นในที่เดียว!"
 feast_default.1004.desc_meager:0 "นี่มันอะไรกัน? มีเนื้อติดกระดูกบ้างไหม? ปกติคนเรากินผักเล็กขนาดนี้หรือ? นี่คืออาหารประเภทที่ข้าคาดหวังได้ใน [ROOT.Char.GetFaith.NegativeAfterLife] หรือ? โอ้ แล้วขนมหวานอยู่ที่ไหน?\n\nนี่ต้องเป็นวิธีที่พวกไพร่กินกันแน่!"
 feast_default.1004.desc:0 "อา นี่คือเนื้อประเภทใดกัน รสชาติช่างเข้มข้นยิ่งนัก? ผักเหล่านี้คืออะไร เกือบจะหวาน? โอ้ และของหวานเล็กๆ ที่ยอดเยี่ยมเหล่านี้!\n\nงานเลี้ยงนี้มีอาหารที่ดีที่สุดเท่าที่ข้าเคยลิ้มรสมา!"
 feast_default.1004.a:0 "น่าพึงพอใจยิ่งนัก!"
 feast_default.1004.a_meager:0 "น่าสมเพช!"
 feast_default.1004.b:0 "นี่มันยอดเยี่ยมมาก! ส่งมาให้ข้าอีกจานสิ!"
 feast_default.1004.b_meager:0 "มีแค่นี้หรือ? จะมีจานที่สองไหม?"

 feast_default.1005.t:1 "ความโดดเดี่ยว"
 feast_default.1005.desc:0 "มันมากเกินไป เสียงพูดคุยไม่หยุดหย่อนของผู้คนรอบข้าง ใบหน้ามากมายที่มองมาที่ข้าเพื่อสนทนา... #EMP ผู้คน#!...\n\nข้ารู้ว่างานเลี้ยงนี้จะเป็นงานที่น่าเบื่อ แต่ข้าไม่เคยจินตนาการถึงขนาดของมันเลย"
 feast_default.1005.desc_friendly_guest:0 "\n\nข้าโชคดีที่อย่างน้อย [friendly_guest.Custom2('MyCharacterIntroduction', ROOT.Char )] ก็อยู่ที่นี่"
 feast_default.1005.a:0 "ต้องมีที่ไหนสักแห่งที่ข้าจะอยู่คนเดียวได้"
 feast_default.1005.b:0 "[friendly_guest.GetFirstNameNoTooltip] อย่าทิ้งข้าไว้ตามลำพังกับสัตว์ร้ายเหล่านี้!"
 feast_default.1005.c:0 ""เอ่อ ข้า... ข้า... อากาศน่ากลัวจังเลยใช่ไหม?""

 feast_default.1006.table_companions:0 "ทุกคนที่นั่งใกล้ข้า"
 feast_default.1006.t:1 "เหมือนอยู่บ้าน"
 feast_default.1006.desc:0 "อา ไม่มีอะไรเหมือนงานเลี้ยง! มัน ทำให้เราทุกคนนึกถึงสิ่งที่ดีในชีวิต และเพื่อนร่วมวงก็ไม่เลวร้ายนัก! อย่างน้อยคนที่นั่งใกล้ข้าก็ดูเหมือนจะคิด เช่นนั้น\n\n"ท่านเป็นคนพิเศษนะ [ROOT.Char.GetFirstNameNoTooltip]" [guest_1.GetTitledFirstName] บอกข้า [guest_2.GetTitledFirstName] และ [guest_3.GetTitledFirstName] พยักหน้าเห็นด้วย"
 feast_default.1006.a:0 "ข้าแค่ทำในสิ่งที่รู้สึกว่าถูกต้อง!"
 feast_default.1006.b:0 "อีกรอบนะทุกคน!"
 feast_default.1006.c:0 "ไม่มีทางอื่นที่จะใช้ชีวิตอย่างแท้จริงหรอก สหายข้า!"

 feast_default.1007.t:1 "ตะกละ"
 feast_default.1007.desc:0 "ด้วยการเสิร์ฟอาหารอร่อยอย่างต่อเนื่อง แขกส่วนใหญ่เลิกกินสำหรับคืนนี้แล้ว เพียงแค่เพลิดเพลินกับความบันเทิง ข้าดีใจที่เห็นว่า [other_glutton.GetTitledFirstName] รู้ดีกว่านั้น!\n\n[other_glutton.GetSheHe|U] และข้าต่างกระตือรือร้นที่จะลิ้มรส ตราบใดที่ยังมีอาหาร!"
 feast_default.1007.a:0 "เราสองคนกินม้าได้ทั้งตัว!"
 feast_default.1007.b:0 "ข้าพนันได้เลยว่าข้ากินเก่งกว่า [other_glutton.GetHerHim]"

 feast_default.1008.t:1 "วิจารณญาณอันมัวหมอง"
 feast_default.1008.desc:0 "ขณะที่ดวงตาของ [secret_recipient.GetTitledFirstNamePossessive] เบิกกว้างเมื่อได้ยินคำพูดของข้า ข้าก็ตระหนักว่าข้าเพิ่งยอมรับอะไรไป ข้าพยายามผลักเหยือกของข้าออกไป\n\n"ข้าดื่มมากเกินไป" ข้าพยายามลุกขึ้น โซเซเล็กน้อย "อย่าเชื่อคำพูดของข้าแม้ แต่คำเดียว!""
 feast_default.1008.a:0 "ข้าทำอะไรลงไป..."
 feast_default.1008.a.flavor:0 "#F [secret_recipient.GetSheHe|U] ไม่เชื่อคำแก้ตัวของข้า...#!"

 feast_default.1009.t:1 "วิจารณญาณอันมัวหมอง"
 feast_default.1009.desc:0 "ขณะที่ดวงตาของ [secret_recipient.GetTitledFirstNamePossessive] เบิกกว้างเมื่อได้ยินคำพูดของข้า ข้าก็ตระหนักว่าข้าเพิ่งพูดอะไรเกี่ยวกับ [secret_owner.GetTitledFirstName] ไป ข้าพยายามผลักเหยือกของข้าออกไป\n\n"ข้าดื่มมากเกินไป" ข้าพยายามลุกขึ้น โซเซเล็กน้อย "อย่าเชื่อคำพูดของข้าแม้ แต่คำเดียว!""
 feast_default.1009.a:0 "ข้าทำอะไรลงไป..."

 feast_default.1010.t:3 "คำสัตย์ปฏิญาณอันน่าประหลาดใจ"
 feast_default.1010.desc:1 "ข้าสัญญาอะไรไปเมื่อคืนนี้? ข้าจำไม่ได้ว่าเกิดอะไรขึ้นก่อนหน้านั้น แต่ข้าจำได้ว่าตบหลัง [favor_recipient.Custom2('MyCharacterIntroduction', ROOT.Char )] บอก [favor_recipient.GetHerHim] ว่าข้าจะทำทุกอย่างที่ [favor_recipient.GetSheHe] ขอ\n\nตอนนี้ข่าวลือแพร่สะพัดเกี่ยวกับ "คำสัตย์ปฏิญาณ" ที่ข้าสาบานไว้!"
 feast_default.1010.a:0 "สัญญาต้องเป็นสัญญา ไม่ว่าจะเกิดอะไรขึ้น"
 feast_default.1010.b:0 "มันเป็นแค่คำพูดพล่อยๆ ตอนเมา!"
 feast_default.1010.every_participant_with_high_opinion:1 "ผู้เข้าร่วมคนอื่นๆ ทุกคนที่เคารพ [favor_recipient.GetFirstNameNoTooltip]"

 feast_default.1011.t:1 "บนเส้นทางสงคราม"
 feast_default.1011.desc:0 "มันช่างมึนเมา – ทั้งสุราในสายเลือด, และโทสะในเส้นเลือดของข้า.\n\n[ROOT.Char.Custom2('RelationToMe', SCOPE.sC('guest_to_murder'))] ของข้า [guest_to_murder.GetTitledFirstName] เดินโซเซมาชนข้านอกห้องโถง, และข้าเข้าใจผิดคิดว่า [guest_to_murder.GetHerHim] เป็น [disliked_guest.GetTitledFirstName] ผู้ [disliked_guest.Custom2('InsultAdjective', ROOT.Char)]. ในทันใดนั้น เลือดของ [guest_to_murder.GetHerHis] ก็หยดลงจากคมดาบของข้า. ขณะที่ร่างของ [guest_to_murder.GetHerHis] ทรุดลงกับพื้น ข้าก็พลันรู้สึกสร่างเมาขึ้นมา"
 feast_default.1011.a:0 "[guest_to_murder.GetSheHe|U] เดินเข้ามาโดนมีดข้าเอง! ข้าสัญญา!"
 feast_default.1011.a.success:0 "ผู้คนเชื่อว่าเป็นอุบัติเหตุ"
 feast_default.1011.a.failure:0 "ผู้คนไม่เชื่อคำโกหกของข้า"
 feast_default.1011.b:0 "ข้า– ข้าต้องทำความสะอาดดาบ...!"
 feast_default.1011.b.success:0 "การฆาตกรรมยังคงเป็นปริศนา"
 feast_default.1011.b.failure:0 "ข้าถูกเปิดโปงว่าเป็นฆาตกร"
 feast_default.1011.c:0 "[disliked_guest.GetTitledFirstNameNoTooltip] ท่านทำได้อย่างไร?!"

 feast_default.1012.t:1 "ของเหลวสังหาร"
 feast_default.1012.desc_opening:0 "การยอมรับแก้วแล้วแก้วเล่าอย่างยินดีของ [ROOT.Char.Custom2('RelationDescriptor', SCOPE.sC('guest_to_murder'))] [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('guest_to_murder'))] [guest_to_murder.GetTitledFirstNamePossessive] กลบเสียงเครื่องดื่มของข้าที่สาดกระเซ็นขณะเทลงบนพื้น\n\nขณะที่ลมหายใจของ [guest_to_murder.GetHerHis] เริ่มติดขัด และใบหน้าของ [guest_to_murder.GetHerHis] ซีดเผือด ข้าสัมผัสได้ถึงรอยยิ้มที่แผ่กว้างบนใบหน้าของข้าเอง เสียงหัวเราะเบาๆ หลุดออกมาขณะที่ร่างของ [guest_to_murder.GetHerHis] กระแทกโต๊ะ"
 feast_default.1012.a:1 "ดื่มอวยพรแด่ [guest_to_murder.GetTitleTierName|U] และความกระหายในชีวิตของ [guest_to_murder.GetHerHis]!"

 feast_default.1013.t:1 "ผู้พิทักษ์"
 feast_default.1013.desc:0 "ขณะที่ [ROOT.Char.Custom2('RelationDescriptor', SCOPE.sC('guest_to_kill'))] [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('guest_to_kill'))] [guest_to_kill.GetTitledFirstName] ย่องเข้าหา [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('guest_to_save'))] [guest_to_save.GetTitledFirstName] ด้วยความโกรธแค้นในดวงตาของ [guest_to_kill.GetHerHis] และมีดในมือของ [guest_to_kill.GetHerHis] ข้าไม่ได้หยุดคิดแม้ แต่น้อย\n\nข้าคว้าสิ่งที่ใกล้ที่สุดที่สามารถใช้เป็นอาวุธได้ แล้วพุ่งเข้าใส่"
 feast_default.1013.a:0 "ใครจะรู้ว่าเครื่องใช้บนโต๊ะอาหารจะคมได้ขนาดนี้?"
 feast_default.1013.a_1:0 "ข้าหวังว่า [ROOT.Char.GetFaith.NegativeAfterLife] จะต้อนรับไอ้ [guest_to_kill.Custom2('InsultNoun', ROOT.Char)] [guest_to_kill.Custom2('InsultAdjective', ROOT.Char)] นั่นอย่างอบอุ่นนะ"
 feast_default.1013.b:0 "ข้าจะปัดมีด!"
 feast_default.1013.b.success:0 "ไม่มีใครได้รับบาดเจ็บ"
 feast_default.1013.b.failure:0 "ข้า #EMP เกือบจะ#! ทำสำเร็จ"
 feast_default.1013.b.big_failure:0 "ข้าล้มเหลว"
 feast_default.1013.c:0 "...และพุ่งตรงไปหาที่กำบัง"
 feast_default.1013.d:0 ""ข้าทำไปเพื่อปกป้อง [guest_to_save.GetFirstNameNoTooltip] พวกท่านทุกคนเห็น""

 feast_default.1014.t:1 "พยาน"
 feast_default.1014.desc:0 "[ROOT.Char.Custom2('RelationToMe', SCOPE.sC('guest_to_murder'))] [guest_to_murder.Custom2('InsultAdjective', ROOT.Char)] ของข้า [guest_to_murder.GetTitledFirstName] เยาะเย้ยขณะที่ข้าเดินโซเซออกไปข้างนอกเพื่อหาที่ปลดทุกข์. โทสะที่เดือดพล่านในเส้นเลือดของข้าอยู่แล้วยิ่งทวีความรุนแรงขึ้นเมื่อ [guest_to_murder.GetSheHe] เดินเข้ามาหาข้า. "ดูสิว่าใคร! เจ้า [ROOT.Char.Custom2('InsultNoun', SCOPE.sC('guest_to_murder'))] [ROOT.Char.Custom2('InsultAdjective', SCOPE.sC('guest_to_murder'))] [ROOT.Char.GetFirstNameNoTooltip]! ข้าพนันได้เลยว่าเจ้า—"\n\nทันทีที่ข้าจมดาบลงในใบหน้าที่น่าโมโหของ [guest_to_murder.GetFirstNamePossessive] ข้าก็ได้ยินเสียงสูดลมหายใจเบาๆ จากด้านหลัง"
 feast_default.1014.a:0 "ได้โปรด [witness.GetTitledFirstNameNoTooltip] อย่าบอกใคร!"
 feast_default.1014.a_2:0 "เจ้าจะไม่บอกใครในสิ่งที่เจ้าเห็น"
 feast_default.1014.b:0 "พูดถึงการอยู่ในที่ผิดเวลาจริงๆ!"

 #Shiny Trinkets
 feast_default.1016.t:1 "เครื่องประดับเล็กน้อยแวววาว"
 feast_default.1016.desc_intro:0 "ข้ามองไปรอบๆ ห้องที่ครึกครื้น ไฟกำลังลุกโชน เครื่องดื่มกำลังถูกริน ของอร่อยกำลังกลายเป็นอาหารในท้อง และอารมณ์ก็กำลังดี\n\nในมุมมืดแห่งหนึ่ง ที่สะท้อนแสงไฟริบหรี่ ข้าเหลือบไปเห็น [trinket_to_steal.GetName] ดูเหมือนมันถูกทิ้งไว้บนโต๊ะข้างตัวหนึ่งและกำลังเรียกชื่อข้าอย่างแน่นอน"
 feast_default.1016.desc_greedy:0 "\n\nมันคงเป็นอาชญากรรมหากข้า #EMP ไม่#! ช่วยคลายความเหงาให้มัน! ข้าเหลือบมองไปรอบห้องอย่างรวดเร็ว เพื่อให้แน่ใจว่าไม่มีใครมองอยู่"
 feast_default.1016.desc_hesitant:0 "\n\nข้ากำหมัดแน่นในความพยายามที่จะเอาชนะความอยากของข้า หวังว่าคงไม่มีใครสังเกตเห็น"
 feast_default.1016.desc_default:0 "\n\n[activity.GetOwner.GetTitledFirstNameNoTooltip] ดูเหมือนจะร่ำรวยดี [activity.GetOwner.GetSheHe] คงไม่คิดถึงเครื่องประดับเล็กน้อยชิ้นนี้หรอก..."
 feast_default.1016.a_greedy:0 "ไม่ว่ากันถ้าข้าจะหยิบไป!"
 feast_default.1016.a_hesitant:0 "ข้าอดใจไม่ไหวจริงๆ..."
 feast_default.1016.a:0 "นั่น #EMP เป็น#! เครื่องประดับที่ดูดีจริงๆ"
 feast_default.1016.b:0 "ไม่ นี่มันไม่ถูกต้อง"
 feast_default_1016_stealth.desc:0 "การขโมยของท่านไม่มีใครสังเกตเห็น"
 feast_default_1016_observed.desc:0 "ท่านมีพยานรู้เห็น"
 feast_default.1016.tt:0 "ขโมยเครื่องประดับเล็กน้อยแล้ว"

 #Shiny Trinkets continued - Thievery resolution
 feast_default.1017.t:1 "สิ่งที่ซ่อนอยู่ในเงา"
 feast_default.1017.desc_intro:0 "ข้าค่อยๆ คืบคลานไปยังโต๊ะข้างตัว พูดคุยกับแขกที่ข้าเดินผ่านไปตลอดทาง\nเมื่อข้าอยู่ใกล้ [new_trinket.GetName] ในจังหวะเดียว ข้าก็ผลักสิ่งของนั้นไปที่ขอบโต๊ะอย่างรวดเร็ว แต่แผ่วเบาและลงในผ้าเช็ดปากที่รออยู่ สำเร็จ!"
 feast_default.1017.desc_discovered:0 "\n\nความตื่นเต้นพลุ่งพล่าน แต่... ข้ารู้สึกไม่สบายใจว่าข้าไม่ใช่คนเดียวที่เห็นการโจรกรรมของข้า\n\nเวลาจะเป็นเครื่องพิสูจน์..."
 feast_default.1017.desc_stealth:0 "\n\nความตื่นเต้นพลุ่งพล่าน เสียงหัวใจเต้นรัวในอก และรสชาติอันหอมหวานแห่งชัยชนะเมื่อได้มา ซึ่งสิ่งที่ต้องการ\n\nในขณะนี้ ไม่มีอะไรสำคัญอีกแล้วจริงๆ"
 feast_default.1017.a:0 "นี่ไม่ดีเลย"
 feast_default.1017.b:0 "นี่มันยอดเยี่ยมมาก!"
 feast_default.1017.b_honest:0 "ข้าหวังว่าจะไม่มีใครรู้..."

 #Shiny Trinkets continued - The witness confronts you via proxy
 feast_default.1018.t:1 "...จะปรากฏออกมา"
 feast_default.1018.desc_intro:1 "ทันใดนั้น, ทูตจาก [witness.GetTitledFirstName], นามว่า [witness_proxy.GetTitledFirstName], ก็ปรากฏตัวที่หน้าประตูข้า. "คารวะ, [ROOT.Char.Custom('FormOfAddressForLiege')]! ข้านำสารจาก [witness.GetTitledFirstNameNoTooltip] มา"\n\nทูตดูอึดอัดเล็กน้อย: "[witness.GetTitledFirstNameNoTooltip] อยากจะให้ทราบว่า [feast_host.GetTitledFirstName] กำลังตามหา [trinket_to_steal.GetName] ของ [feast_host.GetHerHis] และ... ", [witness_proxy.GetSheHe] หยุดไปครู่หนึ่ง, "ดูเหมือนว่า [witness.Custom('MistressMaster')] ของข้าคิดว่าท่านอาจเหลือบไปเห็นมันในระหว่างงานเลี้ยง?" [witness_proxy.GetTitledFirstNameNoTooltip] จ้องมองข้าตั้งแต่หัวจรดเท้า"
 feast_default.1018.desc_greedy:0 "\n\n[witness.GetTitledFirstNameNoTooltip] กล้าดียังไง! เล็บจิกเข้าไปในฝ่ามือ ข้าพยายามสงบสติอารมณ์และมีเหตุผลเมื่อเผชิญกับข้อกล่าวหาเหล่านี้"
 feast_default.1018.desc_default:1 "\n\nหัวใจข้าเต้นรัวในหูขณะที่รู้สึกถึงเหงื่อที่ไหลลงมาตามหลัง นี่คือความเสี่ยงที่ข้าต้องเผชิญเพื่อแลกกับช่วงเวลาอันหอมหวานของการได้มา ซึ่งสิ่งของ"
 feast_default.1018.a:0 "ข้ามีถุงเงินอยู่ที่นี่ ซึ่งอาจจะเห็น"
 feast_default.1018.a_contempt:0 "เอาถุงเงินนี้ไปแล้วไปให้พ้น!"
 feast_default.1018.a_tt:1 "[witness.GetTitledFirstNameNoTooltip] ควรเก็บเรื่องนี้ไว้กับ [witness.GetHerselfHimself]!"
 feast_default.1018.b:0 "ของเก่าๆ นั่นน่ะหรือ? ไม่เคยเห็นเลย"
 feast_default.1018.b_contempt:0 "ของเก่าๆ นั่นน่ะหรือ? ไม่. เคย. เห็น."
 feast_default_1018_success.desc:0 "[witness.GetTitledFirstNameNoTooltip] เชื่อ"
 feast_default_1018_failure.desc:0 "[witness.GetTitledFirstNameNoTooltip] ไม่เชื่อ"
 feast_default_1018_success.t:0 "การโน้มน้าวสำเร็จ"
 feast_default_1018_failure.t:0 "การโน้มน้าวล้มเหลว"
 feast_default.1018.c:0 "เห็น... #EMP และมือ#! แตะต้องมัน!"

 #OPRHANED - Shiny Trinkets continued - You return the piece to the feast_host
 feast_default.1019.t:1 "การขอขมา"
 feast_default.1019_start:0 "ขณะที่ข้าเข้าไปในห้องของ [feast_host.GetTitledFirstNameNoTooltip] [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('feast_host'))] ของข้ามองมาที่ข้าด้วย"
 feast_default.1019.desc_intro_redeemed:0 "$feast_default.1019_start$ สายตาผิดหวัง\n\n"ข้ายอมรับว่าข้าไม่คาดคิดว่าจะเกิดเรื่องนี้ขึ้น การที่ [feast_host.Custom2('RelationToMe', ROOT.Char)] ของข้าเองตกเป็นเหยื่อของพฤติกรรมน่าละอาย เช่นนี้... เรื่องนี้คงจะหนักใจท่านอย่างแท้จริง ข้าขอชมเชยการสารภาพของท่าน มันเป็นก้าวแรกสู่การปรับปรุงตัว""
 feast_default.1019.desc_intro_condemned:0 "$feast_default.1019_start$ สายตาไม่พอใจ\n\n"เราไม่เคยเห็นพ้องต้องกันเลย ท่านกับข้า การที่ [feast_host.Custom2('RelationToMe', ROOT.Char)] ของข้าเองยอมจำนนต่อสิ่ง เช่นการลักเล็กขโมยน้อย... #EMP น่าอับอาย#! ที่สุด เช่นเดียวกับน่าตำหนิ ท่านต้องทำตัวให้ดีกว่านี้""
 feast_default.1019.desc_redemption_greedy:0 "\n\nข้าเล่นตามบทบาทในละครฉากนี้ ทั้งที่รู้ว่าทางเลือกอื่นคงจะเลวร้ายกว่านี้มาก อย่างน้อยข้าก็พ้นจากปัญหา... ครั้งนี้"
 feast_default.1019.desc_condemnation_greedy:0 "\n\nพยายามอย่างยิ่งที่จะยับยั้งตัวเอง ข้ามองลงไปที่พื้นต่อหน้า [feast_host.GetHerHim] และพยักหน้า ใช่ #EMP ข้าจะทำตัวให้ดีขึ้นในครั้งต่อไป#! "
 feast_default.1019.desc_redemption:0 "\n\nรู้สึกอับอายกับการกระทำของตัวเอง ข้ารู้สึกขอบคุณอย่างแท้จริงต่อการตอบสนองอย่างเมตตาของ [feast_host.GetHerHis] ต่อคำร้องขอของข้า ก้อนหินในใจได้ถูกยกออกไปแล้วจริงๆ"
 feast_default.1019.desc_condemnation:0 "\n\nแก้มแดงก่ำด้วยความละอาย ข้ารู้สึกขยะแขยงกับการกระทำของตัวเอง ไม่ว่าอะไรจะเข้าสิงข้าก็ตาม ตอนนี้ข้ากำลังรับผลที่ตามมา"
 feast_default.1019.a:0 "...บางทีข้าควรเก็บของชิ้นนี้ไว้เป็นเครื่องเตือนใจถึงข้อบกพร่องของข้า?"
 feast_default.1019.a_tt:0 "พยายามเก็บ [trinket_to_steal.GetName] ไว้"
 feast_default.1019.b:0 "ข้าไม่ต้องการสิ่งใดนอกจากการให้อภัยจากท่าน [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('feast_host'))] ของข้า"
 feast_default_1019_success.desc:0 "[feast_host.GetTitledFirstNameNoTooltip] เชื่อ"
 feast_default_1019_failure.desc:0 "[feast_host.GetTitledFirstNameNoTooltip] ไม่เชื่อ"
 feast_default_1019_redeemed.t:0 "ได้รับการไถ่โทษ"
 feast_default_1019_condemned.t:0 "ถูกประณาม"

 #Dislike the host, deface a displayed Court Artifact
 feast_default.1020.t:1 "อุบัติเหตุ"
 feast_default.1020.desc:0 "ขณะที่ข้าเดินเตร่ไปตามห้องโถงของ [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('feast_host'))] ที่น่ารังเกียจของข้า [feast_host.GetTitledFirstNameNoTooltip] ข้าพินิจพิเคราะห์ของสะสมโบราณวัตถุของ [feast_host.GetHerHis] ที่จัดแสดงอยู่ ช่างหรูหราฉูดฉาดเสียนี่กระไร — บางที [feast_host.GetSheHe] ควรจะถูกสั่งสอนสักหน่อย...\n\nสายตาของข้าจับจ้องอยู่ที่ [feast_target_artifact.GetName]"
 feast_default.1020.a_knock_over:0 "บางทีข้าอาจจะ #EMP บังเอิญ#! ชนมันล้ม..."
 feast_default.1020.a_scratch:0 "ข้าจะขูดขีดมันให้เป็นรอย..."
 feast_default.1020.a_drunkard:0 "ข้าอาจจะทำ [ROOT.Char.Custom('RegionalDrink')] หกใส่ทั้งหมด..."
 feast_default.1020.a_lustful:0 "ข้า #EMP ปรารถนาอย่างแรงกล้า#! ที่จะ ทำให้มันเสียหายโดยสิ้นเชิง..."
 feast_default.1020.a.tt_success:0 "ท่าน ทำให้โบราณวัตถุเสียหายโดยไม่มีใครตรวจพบ"
 feast_default.1020.a.tt_fined:0 "[feast_host.GetTitledFirstNameNoTooltip] ปรับท่านสำหรับการกระทำของท่าน"
 feast_default.1020.a.tt_imprisoned:0 "[feast_host.GetTitledFirstNameNoTooltip] ตอบโต้"
 feast_default.1020.b:0 "ไม่ ข้าไม่ควรเสี่ยงดีกว่า"
 feast_default.1020.tt:0 "โบราณวัตถุเสียหาย"
 GUESTS_LIKED_DEFACING:0 "#z แขก [CHARACTER.MakeScope.Var('num_unhappy_guests').GetValue|0]#! คน ชื่นชมการกระทำนี้:"
 feast_default.1020.tt_guests: "#z แขก [THIS.Var('num_unhappy_guests').GetValue|0]#! คน ชื่นชมการกระทำนี้และได้รับค่าความเห็นต่อท่านเพิ่มขึ้น"

 feast_default.1030.t:0 "วีรบุรุษแห่งยุคสมัยของเรา"
 feast_default.1030.desc:0 "เสียงปรบมือดังก้องหลังจากการขับขานอันเปี่ยมอารมณ์ครั้งแรกของ [minstrel.GetFirstNamePossessive] จบลง มีการเช็ดน้ำตา มีการทุบโต๊ะ\n\n"อีกเรื่องหนึ่ง!" [minstrel.GetSheHe] เสนอ "ข้าจะขับขานเรื่องราวของ $knight_culture_player_no_tooltip_lowercase$ ผู้ยิ่งใหญ่ [knight_1.GetFirstName]"
 feast_default.1030.ethical:0 "ผู้ปกป้องผู้อ่อนแออย่างสูงส่งได้อย่างไร?"
 feast_default.1030.amoral:0 "ผู้ทำร้ายศัตรูทุกรูปแบบอย่างทารุณได้อย่างไร?"
 feast_default.1030.leader:0 "ผู้นำสหายผ่านภยันตรายอันใหญ่หลวงได้อย่างไร?"
 feast_default.1030.morally_neutral:0 "ผู้แสดงคุณธรรมของ [knight_1.GetHerHis] เป็นครั้งแรกได้อย่างไร?"
 feast_default.1030.aggressive:0 "เรื่องของ [knight_2.GetFirstName] ที่บุกตะลุยไปข้างหน้าอย่างไม่มีใครหยุดยั้งได้?"
 feast_default.1030.defensive:0 "เรื่องของ [knight_2.GetFirstName] ที่ยืนหยัดมั่นคงดุจภูผา?"
 feast_default.1030.champion:0 "เรื่องของ [knight_2.GetFirstName] ที่คว้าชัยชนะมาได้ด้วยตัวคนเดียว?"
 feast_default.1030.stance_neutral:0 "เรื่องของ [knight_2.GetFirstName] ที่กอบกู้ชื่อเสียงอันมืดมนของ [knight_2.GetHerHis] คืนมา?"

 feast_default.1030.subtle:0 "เรื่องของ [knight_3.GetFirstName] ผู้หลักแหลมที่สุดในหมู่ [knight_3.GetCulture.GetCollectiveNounNoTooltip]?"
 feast_default.1030.forceful:0 "เรื่องของ [knight_3.GetFirstName] ผู้ทรงพลังที่สุดในหมู่ [knight_3.GetCulture.GetCollectiveNounNoTooltip]?"
 feast_default.1030.equestrian:0 "เรื่องของ [knight_3.GetFirstName] นักรบ [knight_3.GetCulture.GetCollectiveNounNoTooltip] ผู้ขี่ม้า?"
 feast_default.1030.intensity_neutral:0 "เรื่องของ [knight_3.GetFirstName] ผู้ยอดเยี่ยมที่สุดในหมู่ [knight_3.GetCulture.GetCollectiveNounNoTooltip]?"
 feast_default.1030.courtly:0 "เรื่องของ [knight_4.GetFirstName] และมิตรภาพที่แท้จริงของ [knight_4.GetHerHis]?"
 feast_default.1030.militant:0 "เรื่องของ [knight_4.GetFirstName] และสมรภูมิที่ [knight_4.GetHerHis] ได้รับชัยชนะ?"
 feast_default.1030.fighty_neutral:0 "เรื่องของ [knight_4.GetFirstName] และคำสัตย์ปฏิญาณอันทรงเกียรติของ [knight_4.GetHerHis]?"
 feast_default.1030.wrap_up:0 "นักรบเหล่านี้เทียบได้กับวีรบุรุษในสมัยโบราณ!"\n\nไม่ต้องสงสัยเลยว่า เมื่อนักแสดงของงานเลี้ยงนี้เดินทางไปยังราชสำนักอื่น เรื่องราวที่ข้าโปรดปรานจะถูกเล่าขานซ้ำแล้วซ้ำเล่า"

 feast_default.1030.a:0 "[knight_1.GetFirstNameNoTooltip], [accolade_1.GetNameNoTooltip]!"
 feast_default.1030.a.tt:0 "ขอให้เรื่องเล่าขานเป็นแรงบันดาลใจแก่ทุกคน ตั้งแต่เด็กรับใช้ในครัวที่ต่ำต้อยที่สุดไปจนถึง $knight_culture_player_plural_no_tooltip_lowercase$ ผู้ยิ่งใหญ่ที่สุด"
 feast_default.1030.b:0 "[knight_2.GetFirstNameNoTooltip], [accolade_2.GetNameNoTooltip]!"
 feast_default.1030.b.tt:0 "พวกเขาจะกล่าวว่า [knight_2.GetSheHe] ไม่มีใครเอาชนะได้!"
 feast_default.1030.c:0 "[knight_3.GetFirstNameNoTooltip], [accolade_3.GetNameNoTooltip]!"
 feast_default.1030.c.tt:0 "ทุกคนจะรู้จัก [knight_3.GetHerHim] ว่าเทียบเท่ากับวีรบุรุษในอดีต"
 feast_default.1030.d:0 "[knight_4.GetFirstNameNoTooltip], [accolade_4.GetNameNoTooltip]!"
 feast_default.1030.d.tt:0 "ผู้ทำภารกิจและวีรกรรมที่ได้รับความนิยมมากขึ้นเรื่อยๆ... ทั้งเรื่องจริงและเรื่อง แต่ง"

 knightly_tales_modifier:0 "อัศวินในบทเพลง"
 knightly_tales_modifier_desc:0 "อัศวินของตัวละครนี้เป็นแรงบันดาลใจให้เกิดเรื่องเล่าขานยอดนิยม ซึ่งยกระดับสถานะของขุนนางนักรบ"

 riders_of_song_modifier:0 "นักรบอาชาในบทเพลง"
 riders_of_song_modifier_desc:0 "ทั้งเด็กฝึกหัดและทหารม้าผู้ช่ำชองต่างปรารถนาที่จะบุกเข้าสู่สมรภูมิเคียงข้างอัศวินของตัวละครนี้"

 tales_of_knightly_valor_modifier:0 "ตำนานความกล้าหาญของอัศวิน"
 tales_of_knightly_valor_modifier_desc:0 "ผู้มุ่งหวังที่อาจหาญ บางคนไม่ต่างจากคนจรจัด อ้อนวอนขอรับใช้เคียงข้างอัศวินของตัวละครนี้"

 tales_of_knightly_leadership_modifier:0 "ตำนานความเป็นผู้นำของอัศวิน"
 tales_of_knightly_leadership_modifier_desc:0 "ถือเป็นเกียรติที่จะตอบสนองต่ออำนาจอันชาญฉลาดของอัศวินของตัวละครนี้"

#feared by all enemies

 feast_default.2001.t:1 "ความไม่อดทนอันน่าอับอาย"
 feast_default.2001.desc:0 "[host.GetTitledFirstName] ประกาศว่าการเสิร์ฟอาหารจะล่าช้าเล็กน้อย และ [glutton.GetTitledFirstName] ดูเหมือนจะระเบิดออกมาด้วยความหงุดหงิด!\n\nระหว่างเสียงท้องร้องของ [glutton.GetHerHis] ข้าได้ยิน แต่เสียงบ่นแสดงความไม่พอใจ"
 feast_default.2001.a:0 "[glutton.GetSheHe|U] กำลัง ทำให้ [glutton.GetHerselfHimself] เป็นตัวตลก"
 feast_default.2001.b:0 "[glutton.GetFirstNameNoTooltip] พูดถูก! อาหารของเราอยู่ที่ไหน?!"

 feast_default.2002.t:1 "ผู้ชื่นชม"
 feast_default.2002.desc:0 "มีคนลอบส่งจดหมายให้ข้าในระหว่างงานเลี้ยง:\n\n"[letterAuthor.Custom2('love_letter', SCOPE.sC('letterRecipient'))]"\n\nจดหมายอันอ่อนโยนนี้มาจากใครกัน? มีบางอย่างเกี่ยวกับวิธีที่ [crush_1.GetTitledFirstName] มองข้าอย่างเขินอาย หรือวิธีที่ [crush_2.GetTitledFirstName] ยิ้มเมื่อเราพบกัน แต่แล้ว [crush_3.GetTitledFirstName] ก็ดูเหมือนกระตือรือร้นที่จะนั่งใกล้ข้ามาก..."
 feast_default.2002.a:0 "ต้องเป็น [crush_1.GetFirstNameNoTooltip] แน่!"
 feast_default.2002.b:0 "อาจจะเป็น [crush_2.GetFirstNameNoTooltip]?"
 feast_default.2002.c:0 "นี่มันฝีมือ [crush_3.GetFirstNameNoTooltip] ชัดๆ"
 feast_default.2002.potential_lover_tt:0 "หากท่านทายถูก การ ทำให้พวกเขาเป็น [lover|E] ของท่านจะง่ายขึ้นมาก"

 feast_default.2003.t:1 "จิตวิญญาณที่เข้ากัน"
 feast_default.2003.desc:0 "สิ่งที่เริ่มต้นจากงานเลี้ยงธรรมดากลายเป็นงานเลี้ยงที่ยอดเยี่ยม ต้องขอบคุณการปรากฏตัวของ [other_guest.GetTitledFirstName]!\n\nเราพูดคุยกันตลอดทั้งเย็นเกี่ยวกับเรื่องราวต่างๆ นานา และดูเหมือนว่าเราจะมีอะไรเหมือนกันมากมาย! ข้ามีช่วงเวลาที่ดีกับ [other_guest.GetHerHim]"
 feast_default.2003.a:0 "ช่างเป็นค่ำคืนที่ดีอะไร เช่นนี้!"

 feast_default.2005.t:1 "เลอะ [ROOT.Char.Custom('GetClothingArticle')|U] ใหม่ของข้าไปหมด"
 feast_default.2005.desc:0 "เราทุกคนบอกได้ว่า [drunk.GetTitledFirstName] ดื่มมากเกินไป แม้ว่า [drunk.GetSheHe] จะยืนกรานที่จะแสดงให้เราเห็นว่า [drunk.GetSheHe] สร่างเมาแค่ไหน\n\nเพียงแค่ลุกขึ้นจากที่นั่งของ [drunk.GetHerHis] ก็เกินกำลังสำหรับ [drunk.GetHerHim] และตอนนี้ข้าก็เปรอะเปื้อนไปด้วยอาเจียนเหม็นคลุ้ง!"
 feast_default.2005.a:0 ""ท่านควรละอายใจตัวเองนะ [drunk.GetFirstNameNoTooltip]!""
 feast_default.2005.b:0 ""ฮ่า! ช่างเป็นการแสดงที่ยอดเยี่ยมอะไร เช่นนี้!""

 feast_default.2006.t:2 "[befriending_guest.GetTitleTierName|U] ผู้กระตือรือร้น"
 feast_default.2006.desc:0 "ขณะที่ [befriending_guest.Custom2('MyCharacterIntroduction', ROOT.Char )] ขัดจังหวะการสนทนาอีกครั้งด้วยเสียงหัวเราะดังลั่น ข้าไม่อาจปฏิเสธได้อีกต่อไปว่า [befriending_guest.GetSheHe] กำลังทำตัวแปลกๆ\n\n[befriending_guest.GetSheHe|U] ไม่เคยอยู่ห่างจากข้า เข้าร่วมทุกการสนทนา แสดงความชื่นชมในทุกสิ่งที่ข้าพูด..."
 feast_default.2006.a:0 "เป็นวิธีที่แปลกในการเอาใจข้า แต่ข้าต้องบอกว่ามันได้ผล"
 feast_default.2006.b:0 "ข้าอาจจะชินกับสิ่งนี้!"
 feast_default.2006.c:0 "ข้าทนไม่ได้ที่จะมีคนตามติดข้าแบบนี้!"
 feast_default.2006.d:0 "ได้โปรด อยู่ห่างๆ ข้า!"

 feast_default.2007.t:1 "เรื่องชู้สาวถูกเปิดโปง!"
 feast_default.2007.desc:0 "เสียงดังโครมครามดังก้องไปทั่วห้องโถงใหญ่เมื่อประตูบานหนึ่งไปยังห้องพักคนใช้พังลง\n\nในสภาพเกือบเปลือยเปล่า [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('lover_guest_1') )] [lover_guest_1.GetTitledFirstName] และ [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('lover_guest_2') )] [lover_guest_2.GetTitledFirstName] ของข้าล้มกลิ้งลงบนพื้นต่อหน้าทุกคน"
 feast_default.2007.a_chaste:0 "ข้าทนดูไม่ได้!"
 feast_default.2007.a_lustful:0 "แค่ #EMP ลองจินตนาการ#! ว่าพวกเขาอาจจะทำอะไรกันอยู่...!"
 feast_default.2007.a_sadistic:0 "ฮ่า! นี่มันอร่อยจริงๆ!"
 feast_default.2007.a_compassionate:0 "ไม่มีใครสมควรได้รับความอับอายแบบนี้..."
 feast_default.2007.b:0 "ไม่น่าเชื่อว่า #EMP พวกเขา#! จะมีความลับ เช่นนี้!"

 feast_default.2008.t:1 "หลังประตูที่ปิดล็อก"
 feast_default.2008.desc:1 "ขณะที่ [homosexual_character.Custom2('MyCharacterIntroduction', ROOT.Char )] พยายามแอบหนีออกจากงานเลี้ยงโดยไม่มีใครสังเกตเห็น ข้าคิดว่าข้าเห็นแวบหนึ่งของมือ [homosexual_character.GetHerHis] ที่เลื่อนเข้าไปในมือของคนรับใช้ [romance_target.Custom('FemaleMale')]!\n\nความสงสัยของข้าได้รับการยืนยันเมื่อข้าจับได้ว่าพวกเขาอยู่ในห้องที่เงียบสงัด ในสภาพครึ่งเปลือย!"
 feast_default.2008.a:0 "คบหากับ [homosexual_character.GetWomanMan] อีกคน?! อาณาจักรต้องรู้!"
 feast_default.2008.b:0 "ความลับของท่านปลอดภัยกับข้า [homosexual_character.GetFirstNameNoTooltip] สำหรับตอนนี้"
 feast_default.2008.c:0 "ทำให้คนรับใช้ #EMP ของข้า#! เสียหายโดยไม่ได้รับอนุญาตจากข้า?!"
 feast_default.2008.d:0 "โอ้ [homosexual_character.GetFirstNameNoTooltip] หากเพียง แต่ข้ารู้"
 feast_default.2008.d.unlock_text:0 "ตัวเลือกนี้มีให้ เนื่องจาก [sexuality|E] ของท่าน"

 feast_default.2009.t:1 "ได้โปรด พูดต่อเถิด"
 feast_default.2009.desc:1 "ข้าตั้งใจฟัง [secret_holder.GetTitledFirstName] ขณะที่ [secret_holder.GetSheHe] เปิดเผยเรื่องราวต่างๆ นานาอย่างไม่ระมัดระวัง ด้วยความวอกแวกจากการพยายามดื่มหยดสุดท้ายจากเหยือกของ [secret_holder.GetHerHis] [secret_holder.GetSheHe] จึงไม่รู้ว่าข้าตั้งใจฟังอย่างระมัดระวังเพียงใด\n\nเมื่อ [secret_holder.GetSheHe] ตระหนักได้ [secret_holder.GetSheHe] ก็เริ่มลุกขึ้น "ข้าแค่พูดพล่อยๆ! มันไม่จริงหรอก ไม่ว่าเรื่องใดก็ตาม!""
 feast_default.2009.a:0 "โอ้ มันบังเอิญเป็นคำพูดพล่อยๆ ที่ #EMP น่าสนใจมาก#!"

 feast_default.2011.t:2 "สัญญาต้องเป็นสัญญา"
 feast_default.2011.desc:0 "โดยไม่สนใจมารยาทใดๆ [favor_character.Custom2('MyCharacterIntroduction', ROOT.Char )] ตบหลังข้า "ข้าหมายความตามนั้น!" [favor_character.GetSheHe] อุทาน "ข้าจะทำทุกอย่างที่ท่านขอ ทุกอย่างเลย ขอมาสิ แล้วมันจะสำเร็จ!"\n\nข้าได้กลิ่นแอลกอฮอล์จากลมหายใจของ [favor_character.GetFirstNamePossessive] แต่สัญญานั้นได้รับการรับรู้จากแขกทุกคนที่อยู่ ณ ที่นั้น"
 feast_default.2011.a:0 "ท่านเป็น [favor_character.GetWomanMan] ที่รักษาคำพูดใช่ไหม?"
 feast_default.2011.b:0 ""ฮ่า [favor_character.GetTitledFirstNameNoTooltip] เมาเกินกว่าจะรู้ว่า [favor_character.GetSheHe] กำลังพูดอะไร!""

 feast_default.2012.t:1 "พยาน"
 feast_default.2012.desc:0 "ขณะที่ข้าเดินโซเซออกไปข้างนอกเพื่อปลดทุกข์ ข้าได้ยินเสียงตะโกนดังมาจากหัวมุม เมื่อข้าเลี้ยวไป ข้าเห็น [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('murderer'))] [murderer.GetTitledFirstName] ของข้าเยาะเย้ยขณะที่ [murderer.GetSheHe] แทงดาบของ [murderer.GetHerHis] เข้าที่ใบหน้าของ [murdered_guest.GetTitledFirstName] ที่กำลังหมอบอยู่\n\nไม่ว่าข้าจะส่งเสียงอะไรออกมาก็ตาม มันคงดังพอ เพราะ [murderer.GetFirstName] หันมาทางข้า ด้วยความประหลาดใจบนใบหน้าของ [murderer.GetHerHis]"
 feast_default.2012.a:0 "ท่าน #EMP ทำ#! อะไรลงไป?!"
 feast_default.2012.b:0 "ทุกคนจะรู้ถึงอาชญากรรมของท่าน!"
 feast_default.2012.c:0 "ความเงียบของข้ามีราคา"

 feast_default.2013.t:1 "คนประจบสอพลอ"
 feast_default.2013.desc:0 "ข่าวลือที่แพร่สะพัดเกี่ยวกับ [bootlicker.GetTitledFirstName] ที่ต้องการประจบประแจง [shared_liege.GetTitledFirstName] ได้รับการยืนยันเมื่อ [bootlicker.GetSheHe] มอบของขวัญให้ [shared_liege.GetHerHim]\n\n"[bootlicker.Custom2('RelationToMeShort', SCOPE.sC('shared_liege'))] ที่รักยิ่งของข้า ช่างน่ายินดีที่ได้พบท่าน! เมื่อรู้ว่าเราจะได้พบกันที่นี่ ข้าจึงนำหนังสัตว์อันงดงามนี้มาให้ท่าน เพื่อเป็นเครื่องแสดงความขอบคุณของข้า"\n\n[shared_liege.GetTitledFirstName] ยิ้มกว้างขณะที่ [shared_liege.GetSheHe] พิจารณาหนังสัตว์ เมื่อเห็นว่า [shared_liege.GetSheHe] มีความสุขเพียงใดจากการได้รับของขวัญ ข้าก็ตระหนักว่าข้ากำลังเสี่ยงที่จะพลาดโอกาสนี้ในการปรับปรุงสถานะของข้ากับ [shared_liege.GetHerHim] เช่นกัน!"
 feast_default.2013.a:0 ""[ROOT.Char.Custom2('RelationToMe', SCOPE.sC('shared_liege'))] ของข้า! ข้ามีของขวัญให้ท่าน เช่นกัน!""
 feast_default.2013.a.success:0 "[shared_liege.GetTitledFirstName] ประทับใจในของขวัญที่ท่านมอบให้โดยไม่ได้คาดคิด"
 feast_default.2013.a.failure:0 "[shared_liege.GetTitledFirstName] ไม่ประทับใจในของขวัญที่ท่านมอบให้โดยไม่ได้คาดคิด"
 feast_default.2013.b:0 ""#EMP อะแฮ่ม!#! ข้าขอประกาศดื่มอวยพรแด่ [shared_liege.GetTitledFirstNameNoTooltip]!""
 feast_default.2013.b.success:0 "[shared_liege.GetTitledFirstName] ประทับใจในคำอวยพรที่ท่านกล่าวโดยไม่ได้คาดคิด"
 feast_default.2013.b.failure:0 "[shared_liege.GetTitledFirstName] ไม่ประทับใจในคำอวยพรที่ท่านกล่าวโดยไม่ได้คาดคิด"
 feast_default.2013.c:0 "ทำเครื่องดื่มหกใส่หนังสัตว์ที่มอบให้และอ้างว่าเป็นอุบัติเหตุ"
 feast_default.2013.c.success:0 "ทุกคนเชื่อว่าการทำหกเป็นอุบัติเหตุ"
 feast_default.2013.c.failure:0 "ไม่มีใครเชื่อว่าการทำหกเป็นอุบัติเหตุ"
 feast_default.2013.d:0 "ไม่จำเป็นต้องรีบร้อน ข้าจะคิดอะไรบางอย่างออกในภายหลัง"

 feast_default.3001.t:1 "งานเลี้ยงกับสหาย"
 feast_default.3001.desc:0 "ช่างเป็นความสุขที่ได้เห็น [friend.Custom2('MyCharacterIntroductionNoComma', ROOT.Char )]! เรากิน ดื่ม และร้องเพลงด้วยกันอีกครั้ง ราวกับว่าไม่มีเวลาผ่านไปเลยนับตั้งแต่เราจากกันครั้งล่าสุด\n\nเราอาจจะทานอาหารในโรงนา และนี่ก็ยังคงเป็นหนึ่งในงานเลี้ยงที่ยิ่งใหญ่ที่สุดที่ข้าเคยไป"
 feast_default.3001.a:0 "อา ชีวิตจะเป็นอย่างไรหากไม่มี [friend.GetFirstNameNoTooltip]?"

 feast_default.3002.t:1 "จุมพิตที่ขโมยมา"
 feast_default.3002.desc:0 "[lover.GetTitledFirstName], [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('lover') )] ของข้า เรายิ้มและทักทายกันราวกับว่าเราไม่รู้จักกันอย่างใกล้ชิดอยู่แล้ว ราวกับว่าเราไม่เคยโอบกอดกันในห้วงแห่งกิเลสตัณหา ราวกับว่าเราไม่ปรารถนาที่จะกอดกันให้แน่น\n\nเมื่อเราเดินผ่านกันในภายหลังในโถงทางเดินที่ร้างผู้คน ข้าก็ได้สัมผัสริมฝีปากของ [lover.GetHerHis] อีกครั้ง จากนั้น [lover.GetSheHe] ก็ชี้ไปที่ประตูที่ไม่มีแสงไฟ..."
 feast_default.3002.a:0 "มาเถิด! เราไม่มีเวลาให้เสียแล้ว!"
 feast_default.3002.discovery_tt:0 "#F คนรับใช้เห็นอะไรมากมาย และอาจจะพูดคุยกัน...#!"
 feast_default.3002.b:0 "ไม่ เราอาจถูกพบเห็นได้"

 feast_default.3003.t:1 "เพื่อนร่วมวงที่ไม่น่าพอใจ"
 feast_default.3003.desc:1 "เป็นงานเลี้ยงที่น่ารื่นรมย์ แต่แล้ว #EMP [rival.GetSheHe]#! ก็ปรากฏตัวขึ้น ข้าจะมีค่ำคืนเดียวที่ไม่ถูก ทำให้มัวหมองด้วยกลิ่นเหม็นรบกวนของ [rival.GetTitledFirstNameNoTooltip] ไม่ได้เลยหรือ?\n\nที่แย่ที่สุดคือเสียงแหบแห้งของ [rival.GetHerHis] ขณะที่ [rival.GetSheHe] เดินเข้ามาใกล้ข้า "ทำไมทำหน้าบึ้ง เช่นนั้น [ROOT.Char.GetFirstNameNoTooltip]?""
 feast_default.3003.a:0 "[rival.GetSheHe|U] ทำให้ข้าอยากต่อยหน้า [rival.GetHerHim]!"

 feast_default.3004.t:1 "การทะเลาะวิวาทอันดูหมิ่น"
 feast_default.3004.desc:0 "หลังจากบริโภคอาหารและเครื่องดื่มมากมาย ข้าพบ [rival_guest.Custom2('MyCharacterIntroduction', ROOT.Char )] อยู่ท่ามกลางการสนทนาเสียงดัง [rival_guest.GetSheHe|U] หันมาหาข้าทันทีที่ [rival_guest.GetSheHe] สังเกตเห็นการปรากฏตัวของข้า\n\n"และ #EMP เจ้า#! – การปรากฏตัวของเจ้าเพียงอย่างเดียวก็ ทำให้ค่ำคืนนี้มัวหมอง!""
 feast_default.3004.a:0 "ข้าคิดว่าท่านดื่มพอแล้วสำหรับคืนนี้"
 feast_default.3004.b:0 "เจ้ามันก็แค่ [rival_guest.Custom2('InsultNoun', ROOT.Char)] [rival_guest.Custom2('InsultAdjective', ROOT.Char)]!"
 feast_default.3004.b.success:0 "ท่านชนะการต่อสู้"
 feast_default.3004.b.failure:0 "[rival_guest.GetFirstNameNoTooltip] ชนะการต่อสู้"
 feast_default.3004.c:0 "บางคนนำความสุขมาทุกที่ที่ไป; คนอื่น ๆ เมื่อใดก็ตามที่พวกเขาไป"
 feast_default.3004.c.tt:0 "#F ถึงเวลาที่ [rival_guest.GetFirstNameNoTooltip] จะต้องกระจายความสุขแล้ว#!"
 feast_default.3004.d:0 "หมัดต่อหน้าก็เป็นการตอบสนองที่ดีพอๆ กับอย่างอื่น!"

 feast_default.3005.t:1 "การท้าทาย"
 feast_default.3005.desc:0 "ห้องโถงก้องไปด้วยเสียงหัวเราะของ [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('rival_to_duel'))] [rival_to_duel.GetTitledFirstName], พร้อมด้วยคำเยาะเย้ยและสบประมาทของ [rival_to_duel.GetHerHis] — เมื่อ [rival_to_duel.GetSheHe] เรียกข้าว่า [ROOT.Char.Custom2('InsultAdjectiveArticle', SCOPE.sC('rival_to_duel'))] [ROOT.Char.Custom2('InsultNoun', SCOPE.sC('rival_to_duel'))] ข้าก็ชักดาบออกมา"
 feast_default.3005.desc_won:0 "\n\nข้าได้สติกลับคืนมาขณะที่โน้มตัวลงเหนือ [rival_to_duel.GetHerHim] เหยียบรองเท้าบู๊ตบนหน้าอกของ [rival_to_duel.GetHerHis] เราทั้งคู่หายใจหอบ"
 feast_default.3005.desc_lost:0 "\n\nข้าได้สติกลับคืนมาขณะที่ [rival_to_duel.GetSheHe] โน้มตัวลงเหนือข้า เหยียบรองเท้าบู๊ตบนหน้าอกของข้า [rival_to_duel.GetSheHe|U] กระซิบข้างหูข้า "ข้าอยากได้ยินเจ้าร้องขอความเมตตา""
 feast_default.3005.a:0 ""เจ้าจะต้องชดใช้ทุกสิ่งที่เจ้าทำ""
 feast_default.3005.b:0 ""ข้าไม่มีวันยอมแพ้ต่อคนอย่าง #EMP เจ้า#!!""
 feast_default.3005.c:0 ""ได้โปรด อย่าทำร้ายข้า!""
 feast_default.3005.d:0 ""ข้าอยากได้ยินเจ้าร้องขอความเมตตา""
 feast_default.3005.e:0 "ข้าเอื้อมมือขึ้นไปกรีดเอ็นร้อยหวายของ [rival_to_duel.GetHerHis] ในจังหวะเดียวอย่างราบรื่น"

 feast_default.3096.t:0 "ความเป็นไปได้ใหม่"
 feast_default.3096.desc:0 "ขณะที่งานรื่นเริงดำเนินไป ข้าอดไม่ได้ที่จะพบว่าตัวเองกำลังแลกเปลี่ยนสายตากับ [partner.GetName]\n\nข้าเป็น [ROOT.Char.GetWomanMan] ที่มีเกียรติ แต่ไม่ค่อยมีครั้งไหนที่ข้ารู้สึกถูกล่อใจให้สำรวจความสัมพันธ์ใหม่ เช่นนี้..."
 feast_default.3096.a:0 "มาดูกันว่าค่ำคืนนี้จะพาเราไปที่ใด"
 fest_default.3906.a.tt:0 "ท่านนอนกับ [partner.GetName]"
 feast_default.3096.b:0 "ข้าดีกว่านี้"

 feast_default.3006.t:1 "ค่ำคืนเดียว"
 feast_default.3006.opening_1:0 "ด้วยความมึนเมาและความใคร่ [partner.Custom2('MyCharacterIntroduction', ROOT.Char )] และข้าพบว่าตัวเองอยู่ตามลำพัง แขนของ [partner.GetHerHis|U] โอบรอบตัวข้า ริมฝีปากของ [partner.GetHerHis] แนบชิดกับคอของข้า เราดับไฟที่ลุกโชนในอกและบั้นเอวของเรา"
 feast_default.3006.opening_2:1 "ข้าตื่นขึ้นมาบนเตียงแปลกๆ พร้อมกับคู่นอนที่ไม่คาดคิด ความทรงจำของคืนก่อนหน้าค่อยๆ ก่อตัวขึ้นจากหมอกอันปวดร้าวในหัวของข้า [partner.Custom2('MyCharacterIntroduction', ROOT.Char )|U] และข้า ผูกพันกันด้วยความปรารถนา"
 feast_default.3006.opening_3:0 "ข้ายืนกรานมาตลอดว่านี่คือสิ่งที่ข้าจะไม่ทำอย่างแน่นอน แต่หลังจากดื่มไปไม่กี่แก้ว ข้าก็ตกหลุมรัก [partner.Custom2('MyCharacterIntroduction', ROOT.Char )] อย่างง่ายดาย – ติดอยู่ในใยเสน่หาของ [partner.GetHerHis] ในไม่ช้าข้าก็พบว่าตัวเองอยู่บนเตียงของ [partner.GetHerHis]"
 feast_default.3006.both_married_love:1 "\n\nข้าทนคิดถึงการไม่มี [partner.GetHerHim] ไม่ได้ แต่ [partner.Custom2('RelationToMe', SCOPE.sC('partner'))] ของ [partner.GetHerHis] ต้องไม่รู้ และ [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('partner'))] ของข้าก็ เช่นกัน!"
 feast_default.3006.married_love:1 "\n\nข้าทนคิดถึงการไม่มี [partner.GetHerHim] ไม่ได้ แต่ [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('partner'))] ของข้าต้องไม่ได้รับอนุญาตให้รู้ว่าเกิดอะไรขึ้นที่นี่"
 feast_default.3006.partner_married_love:1 "\n\nข้าทนคิดถึงการไม่มี [partner.GetHerHim] ไม่ได้ แต่เมื่อพิจารณาถึง [partner.Custom2('RelationToMe', SCOPE.sC('partner'))] ของ [partner.GetHerHis] [partner.GetTitledFirstName] ข้าจะทำอะไรได้?"
 feast_default.3006.unmarried_love:0 "\n\nนอกขอบเขตของการ แต่งงานและความเหมาะสม เราไม่สามารถให้โลกรู้ว่าเกิดอะไรขึ้นที่นี่ แต่ข้าทนคิดถึงการไม่มี [partner.GetHerHim] แม้ แต่วันเดียวไม่ได้"
 feast_default.3006.both_married:1 "\n\n[partner.Custom2('RelationToMe', SCOPE.sC('partner'))] ของ [partner.GetHerHis|U] ต้องไม่ได้รับอนุญาตให้รู้ และนั่นยังไม่ รวมถึง [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('partner'))] ของข้าเอง!"
 feast_default.3006.married:1 "\n\n[ROOT.Char.Custom2('RelationToMe', SCOPE.sC('partner'))] ของข้าต้องไม่รู้ถึงการทรยศของข้า"
 feast_default.3006.partner_married:1 "\n\n[partner.Custom2('RelationToMe', SCOPE.sC('partner'))] ของ [partner.GetHerHis|u] ต้องไม่ได้รับอนุญาตให้รู้ว่าเกิดอะไรขึ้นที่นี่"
 feast_default.3006.unmarried:0 "\n\nนอกขอบเขตของการ แต่งงานและความเหมาะสม เราไม่สามารถให้โลกรู้ว่าเกิดอะไรขึ้นที่นี่"
 feast_default.3006.a:0 "ข้าต้องพบท่านอีกครั้ง!"
 feast_default.3006.b:0 "มาใช้ประโยชน์จากช่วงเวลานี้ให้เต็มที่กันเถอะ..."
 feast_default.3006.b.mistake_tt:0 "#F [partner.GetFirstNameNoTooltip] ไม่สนใจ#!"
 feast_default.3006.c:0 "เราอย่าพูดถึงเรื่องนี้อีกเลย"
 feast_default.3006.c.tt:1 "#F ท่านอยู่ห่างจาก [partner.GetFirstNameNoTooltip]#!"

 feast_default.3007.t:1 "ขณะกระทำ"
 feast_default.3007.love:0 "ขณะที่แขกคนอื่นๆ กำลังเสียสติไปกับแก้วเหล้า [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('lover'))] ของข้าและข้าก็หาห้องเพื่อใช้เวลาค้างคืนกันตามลำพัง ข้ากำลังจูบไปทั่วแผ่นหลังเปลือยเปล่าของ [lover.GetFirstNamePossessive] เมื่อมีเสียงหนึ่ง ทำให้ข้ารีบหาอะไรมาปกปิดตัวเอง"
 feast_default.3007.not_love:0 "ข้าพา [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('lover'))] [lover.GetTitledFirstName] ของข้าไปยังห้องร้างเพื่อหนีจากฝูงชน ข้ากำลังอยู่ระหว่างการสนองความหิวของข้าเมื่อเสียงที่คุ้นเคย ทำให้เลือดข้าแข็งตัว"
 feast_default.3007.ambiguous:0 "หวังว่าจะได้ใช้เวลากับ [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('lover'))] ของข้า ข้าจึงพา [lover.GetTitledFirstName] ออกจากงานเลี้ยง ทันทีที่ข้ากำลังเตรียมตัวกลับ เสียงที่คุ้นเคย ทำให้ข้าตัวแข็งด้วยความตกใจ"
 feast_default.3007.end:0 "\n\n"[ROOT.Char.GetFirstNameNoTooltip]?! " [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('spouse'))] ของข้า, [spouse.GetTitledFirstName] กำลังจ้องมองเราอย่างตื่นตะลึง. "ท่านไปร่วมเตียงกับอี/ไอ้ [lover.Custom2('InsultNounSexual', SCOPE.sC('spouse'))] [lover.Custom2('InsultAdjective', SCOPE.sC('spouse'))] นั่นได้อย่างไร?""
 feast_default.3007.a:0 "นี่ไม่มีความหมายอะไรเลย ที่รัก!"
 feast_default.3007.b:0 "ข้ารัก [lover.GetHerHim]!"
 feast_default.3007.c:0 "ข้าทำตามใจตัวเอง"

 feast_default.5001.t:1 "รอยยิ้มเจ้าเล่ห์"
 feast_default.5001.friend_reminder:0 "ข้าเชื่อว่า [friend.GetTitledFirstName] ตั้งใจเพียงแค่เตือนเท่านั้น แต่หลังจากที่ [ROOT.GetCharacter.Custom2('RelationToMe' , SCOPE.sC('friend'))] ของข้าเตือนข้าถึงชื่อเสียงอันน่าสะพรึงกลัวของ [host.GetTitledFirstNamePossessive] ข้าก็คิดถึงเรื่องอื่นไม่ได้เลย"
 feast_default.5001.rival_reminder:0 "ข้ารู้ว่า [rival.GetTitledFirstName] พูดเพียงเพื่อ ทำให้ข้ากังวล แต่ตอนนี้ที่ [ROOT.GetCharacter.Custom2('RelationToMe' , SCOPE.sC('rival'))] ของข้าเตือนข้าถึงชื่อเสียงอันน่าสะพรึงกลัวของ [host.GetTitledFirstNamePossessive] ข้าก็คิดถึงเรื่องอื่นไม่ได้เลย"
 feast_default.5001.spouse_reminder:0 "แตะแขนข้าเพื่อเรียกความสนใจ [spouse.GetTitledFirstName] พูดด้วยเสียงเบาที่เต็มไปด้วยความกังวล "[host.GetTitledFirstName] มองท่านบ่อยมากในเย็นวันนี้..."\nเมื่อพิจารณาถึงชื่อเสียงของ [spouse.GetTitledFirstNamePossessive] ข้าเกือบจะหวังว่า [spouse.GetSheHe] จะไม่ได้พูดอะไรเลย"
 feast_default.5001.sadist_reminder:1 "ด้วยรอยยิ้มที่น่ารำคาญ [sadist.GetTitledFirstName] เล่าเรื่องราวที่น่าสะพรึงกลัวบางเรื่องเกี่ยวกับวิธีการ...ทางการทูตของ [host.GetTitledFirstNamePossessive] ข้าไม่ควรปล่อยให้มันมารบกวนจิตใจ แต่ตอนนี้ข้าพบว่ามันยากที่จะคิดถึงเรื่องอื่น"
 feast_default.5001.reminder:0 "แม้ว่างานเลี้ยงจะเป็นโอกาสแห่งการเฉลิมฉลองและความสุข แต่ก็ยากมากที่จะไม่นึกถึงชื่อเสียงอันน่าสะพรึงกลัวของ [host.GetTitledFirstNamePossessive]..."
 feast_default.5001.worry:0 "\n\nทุกรอยยิ้มจากเจ้าภาพของเราตอนนี้เริ่มดูกว้างเกินไป และทุกเสียงกระทบกันของเหยือกหรือจาน ทำให้ข้าสะดุ้ง กังวลว่ามีใครบางคนได้ก่อให้เกิดความพิโรธของ [host.GetHerHis] ด้วยการดูหมิ่นเล็กน้อย หรือแย่กว่านั้น คือคนนั้นคือข้า"
 feast_default.5001.a:0 "ข้าผ่านเรื่องนี้ไปได้ มันเป็นแค่งานเลี้ยง"

 feast_default.5002.t:1 "ความหลงผิด"
 feast_default.5002.desc_chair:0 "เจ้าภาพของเรา [ROOT.GetCharacter.Custom2('RelationToMe' , SCOPE.sC('lunatic_host'))] [lunatic_host.GetTitledFirstName] ของข้า โน้มตัวลงเพื่อสนทนากับเก้าอี้ข้างๆ [lunatic_host.GetHerHim] ได้ดีขึ้น เมื่อเห็นภาพนี้ การสนทนาอื่นๆ ทั้งหมดก็ค่อยๆ เงียบลง\n\n"ท่านพูดว่าอะไรนะ [ROOT.Char.Custom('RandomLadyLord')] ที่ดีของข้า? ใช่ แน่นอน ข้าเชื่อใจท่านมากกว่าใครๆ ที่นี่!""
 feast_default.5002.desc_chicken:0 "เจ้าภาพของเรา [ROOT.GetCharacter.Custom2('RelationToMe' , SCOPE.sC('lunatic_host'))] [lunatic_host.GetTitledFirstName] ของข้า กอดไก่ที่ถอนขนแล้ว — และปรุงสุกแล้ว — อย่างนุ่มนวลแนบอก [lunatic_host.GetHerHis] กระซิบคำหวานกับมัน ขณะที่ [lunatic_host.GetSheHe] เริ่มประกาศความรัก [lunatic_host.GetHerHis] ที่มีต่อสัตว์ปีกอย่างเสียงดัง บรรยากาศในห้องโถงใหญ่ก็เปลี่ยนไปอย่างรวดเร็ว"
 feast_default.5002.desc_drapes:0 "เจ้าภาพของเรา [ROOT.GetCharacter.Custom2('RelationToMe' , SCOPE.sC('lunatic_host'))] [lunatic_host.GetTitledFirstName] ของข้า กวาดตัวลงบนฟลอร์เต้นรำ ถือป้ายประดับผนังผืนหนึ่งไว้ในอ้อมแขนของ [lunatic_host.GetHerHis]\n\nแขกทำได้เพียงจ้องมองขณะที่เขานำผ้าผืนนั้นเต้นรำอย่างประณีต หลงใหลไปกับการแสดง"
 feast_default.5002.a:0 "[lunatic_host.GetLadyLord] ของข้า ทำไมเราไม่ออกไปสูดอากาศข้างนอกกันล่ะ?"
 feast_default.5002.b:0 "ข้าต้องหยุดความบ้าคลั่งนี้!"
 feast_default.5002.c:0 "[lunatic_host.GetFirstNameNoTooltip]! ให้ข้าเข้าร่วมกับท่านทั้งสองด้วย!"

 feast_default.5003.t:1 "ความบันเทิงอันเจ็บปวด"
 feast_default.5003.desc:0 "เศษโลหะแหลมคมในอาหารบางจาน เสี้ยนบนเก้าอี้ #EMP อุบัติเหตุ#! เล็กๆ น้อยๆ ที่รับประกันรอยฟกช้ำ...\n\nนั่งอยู่ที่หัวโต๊ะ [ROOT.GetCharacter.Custom2('RelationToMe' , SCOPE.sC('sadistic_host'))] [sadistic_host.GetTitledFirstName] ของข้า ไม่สามารถซ่อนรอยยิ้มเย็นชาที่แผ่กว้างบนใบหน้าของ [sadistic_host.GetHerHis] ได้ ขณะที่ [guest.GetLadyLord] อีกคน [guest.GetTitledFirstName] บ้วนเลือดลงบนจานของ [guest.GetHerHis]"
 feast_default.5003.a:0 ""นี่เป็นสิ่งที่ยอมรับไม่ได้!""
 feast_default.5003.b:0 "ข้าจะดูแล [guest.GetFirstNameNoTooltip] เองสำหรับตอนนี้"
 feast_default.5003.c:0 "ช่างเป็นงานเลี้ยงที่รุ่งโรจน์อะไร เช่นนี้!"

 feast_default.5004.t:1 "ก้นเหยือก"
 feast_default.5004.desc:0 ""นั่นเสียงแก้วเปล่าที่ท่านเพิ่งวางลงบนโต๊ะหรือ?" การจะได้ยินอะไรท่ามกลางเสียงอึกทึกในห้องโถงใหญ่ [host.GetTitledFirstName] ต้องมีหูทิพย์แน่ๆ เจ้าภาพผู้ใจดีของข้าโบกมือเรียกคนรับใช้ "เอาไวน์มาเพิ่มที่นี่! จะไม่มีใครกระหาย!""
 feast_default.5004.a:0 "ขอบคุณ [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('host'))] ของข้า!"
 feast_default.5004.b:0 "ข้าดื่มพอแล้ว ข้าคิดว่า"
 feast_default.5004.c:0 "ข้ากล่าวคำขอโทษและแอบหนีไปในฝูงชน"

 feast_default.5005.t:1 "การัม!"
 feast_default.5005.desc:0 "โอ้ รสชาติสวรรค์นี้! ช่างกลมกล่อม แต่เค็มเล็กน้อย ชวนให้นึกถึงทะเล...\n\nนี่อาจจะเป็นการัมที่ดีที่สุดที่ข้าเคยลิ้มรส และพ่อครัวของ [host.GetTitledFirstNamePossessive] ก็ใช้มันอย่างเชี่ยวชาญ!"
 feast_default.5005.a:0 "ข้าต้องกินสิ่งนี้เป็นประจำ!"
 feast_default.5005.b:0 ""นี่เป็นอาหารที่เหลือเชื่อมาก [host.GetFirstNameNoTooltip]!""
 feast_default.5005.c:0 ""ท่านรู้หรือไม่ว่ามูร์รีได้รับแรงบันดาลใจจากการัม?""
 feast_default.5005.c.flavor:0 "ดูเหมือนแขกคนอื่นๆ จะไม่ค่อยรู้เรื่องนี้!"
 feast_default.5005.d:0 "ถ้าข้าทำได้ ข้าจะ #EMP หายใจ#! เป็นการัม!"

 feast_default.6001.t:1 "[spouse.GetWomanMan|U] ที่เหมาะสมกับงาน"
 feast_default.6001.dislike_spouse:1 "แม้ว่าจะมีหลายทางที่เราเข้ากันไม่ได้ ข้าต้องยอมรับว่า [ROOT.GetCharacter.Custom2('RelationToMe' , SCOPE.sC('spouse'))] ของข้าทำงานเลี้ยงของข้าได้ดีมาก [spouse.GetFirstName] ทำให้แน่ใจว่าอาหารมาถึงตรงเวลา แขกทุกคนนั่งในที่ที่ถูกต้อง และทุกคนดูเหมือนจะพอใจ\n\nเมื่อ [spouse.GetHerHim] อยู่ข้างข้าที่โต๊ะใหญ่และการเฉลิมฉลองกำลังจะเริ่มขึ้น ข้าแจ้งให้ [spouse.GetHerHim] ทราบว่าข้าซาบซึ้งในการทำงานหนักของ [spouse.GetHerHis] ในการเตรียมงานเลี้ยงนี้"
 feast_default.6001.like_spouse:0 "[ROOT.GetCharacter.Custom2('RelationToMe' , SCOPE.sC('spouse'))] [spouse.GetFirstName] ที่รักของข้าทำงานอย่างหนัก เพื่อให้แน่ใจว่าทุกอย่างเกี่ยวกับงานเลี้ยงเป็นไปอย่างราบรื่น อาหารมาถึงตรงเวลา แขกทุกคนนั่งในที่ที่ถูกต้อง และทุกคนดูเหมือนจะพอใจ\n\nเมื่อ [spouse.GetFirstName] อยู่ข้างข้าที่โต๊ะใหญ่ ทุกอย่างก็พร้อม ข้าบีบมือ [spouse.GetHerHis] และยิ้มให้ [spouse.GetHerHim] ก่อนที่จะลุกขึ้นประกาศเริ่มการเฉลิมฉลอง"
 feast_default.6001.a:0 "ข้าจะทำอย่างไรหากไม่มี [spouse.GetHerHim]"

 feast_default.6002.t:1 "ความพยายามอันน่าสรรเสริญ"
 feast_default.6002.desc:0 "ขณะที่งานเลี้ยงกำลังดำเนินไป และแขกของเรากำลังกินและดื่มอย่างร่าเริง [guest.GetTitledFirstName] เข้ามาหา [spouse.GetFirstName] และข้าที่โต๊ะใหญ่\n"นี่เป็นงานเลี้ยงที่ยอดเยี่ยม! ขอชมเชยเจ้าภาพทุกท่าน""
 feast_default.6002.a:0 ""ใช่ ข้าทำได้ดีมากใช่ไหม?""
 feast_default.6002.b:0 ""[spouse.GetFirstNameNoTooltip] สมควรได้รับเครดิตทั้งหมด""

 feast_default.6003.t:1 "ในบ้านของข้า"
 feast_default.6003.opening:0 "ข้าทำทุกอย่างที่ทำได้ เพื่อให้แน่ใจว่า [fighter_1.GetTitledFirstName] และ [fighter_2.GetTitledFirstName] จะอยู่ห่างกันมากที่สุดเท่าที่จะเป็นไปได้ มันไม่เพียงพอ และตอนนี้พวกเขาก็ลงไม้ลงมือกัน กลางงานเลี้ยงของข้า!"
 feast_default.6003.bodyguard:0 "\n[ROOT.Char.Custom2('RelationToMe', SCOPE.sC('bodyguard'))] [bodyguard.GetTitledFirstName] ของข้า ยืนอยู่ใกล้การทะเลาะวิวาท และมองมาที่ข้าเพื่อรอคำสั่งให้เข้าแทรกแซง"
 feast_default.6003.guard:0 "\nทหารยามคนหนึ่งของข้าอยู่ใกล้การทะเลาะวิวาท และมองมาที่ข้าเพื่อรอคำสั่งให้เข้าแทรกแซง"
 feast_default.6003.a:0 "โยน [fighter_2.GetFirstNameNoTooltip] ออกไปให้ใจเย็นลง"
 feast_default.6003.b:0 "ควบคุมตัว [fighter_1.GetFirstNameNoTooltip] ไว้จนกว่าสถานการณ์จะสงบลง"
 feast_default.6003.c:0 ""หยุด! เราจะคุยเรื่องนี้กันทีหลัง""


 feast_default.6101.t:1 "[ROOT.Char.Custom2('RelationToMe', SCOPE.sC('troubled_guest'))|U] ผู้มีปัญหา"
 feast_default.6101.desc_opening:0 "สายตาอ้อนวอนที่ข้าได้รับจาก [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('troubled_guest'))] [troubled_guest.GetFirstName] ของข้ากำลังกลายเป็นน้ำเสียงที่สิ้นหวัง กลุ่มแขกกำลังเข้าใกล้หัวมุมที่ [troubled_guest.GetSheHe] ซ่อนตัวอยู่ตลอดทั้งเย็น และกำแพงกำลังขัดขวางการหลบหนีของ [troubled_guest.GetHerHis]\n\n"
 feast_default.6101.desc_liked:0 "[troubled_guest.GetWomanMan] ผู้น่าสงสารไม่เคยเข้ากับผู้คนได้ดีเลย!"
 feast_default.6101.desc_disliked:0 "ไม่น่าเชื่อว่า [troubled_guest.GetTitleTierName] จะทำตัว เช่นนี้..."
 feast_default.6101.desc_disliked_unlanded:0 "ไม่น่าเชื่อว่า [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('troubled_guest'))] ของข้าจะทำตัว เช่นนี้..."
 feast_default.6101.a:0 "ข้าจะเบี่ยงเบนความสนใจของแขกที่กำลังเข้ามา"
 feast_default.6101.b:0 "มาเถอะ [troubled_guest.GetFirstNameNoTooltip] เล่าเรื่องให้เราฟังหน่อย!"
 feast_default.6101.c:0 "[troubled_guest.GetFirstNameNoTooltip]! ข้าต้องการคุยกับท่าน เป็นการส่วนตัว"
 feast_default.6101.c.tt:0 "เราทั้งคู่ต้องการพักผ่อน..."

 feast_default.6111.t:1 "คู่สนทนา"
 feast_default.6111.desc:0 "ขณะที่อาหารจานหนึ่งถูกแทนที่ด้วยจานถัดไป, [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('guest_to_talk_to'))] ของข้า [guest_to_talk_to.GetTitledFirstName] ก็พูดไม่หยุดเกี่ยวกับ [guest_to_talk_to.Custom('subject_of_interest')].\n\n"...และนั่นคือวิธีที่เรากอบกู้สถานการณ์เละเทะนั้น! ท่านแน่ใจนะว่าข้าไม่ได้ ทำให้ท่านเบื่อ, [ROOT.Char.Custom('FormOfAddressForLiege')]?""
 feast_default.6111.a:0 "ไม่ ไม่ ได้โปรด พูดต่อเถิด!"
 feast_default.6111.b:0 "ทำไมเราไม่คุยเรื่องท่านให้มากขึ้นแทนล่ะ?"
 feast_default.6111.c:0 "การที่ท่านทำตัวเป็นตัวตลกไม่มีทาง ทำให้ข้าเบื่อได้!"
 feast_default.6111.d: "ข้าเคยเล่าเรื่อง [ROOT.Char.GetPromotedLegend.GetName] ให้ท่านฟังหรือยัง?"
 feast_default.6111.d.success: "ตำนานของท่านน่าหลงใหล"
 feast_default.6111.d.failure: "ท่านน่าเบื่อ"
 feast_default.6111.e: "น่าสนใจ ใช่ แต่มาหารือเรื่องการปกครองของข้ากันเถอะ ใช่ไหม?"
 every_evil_guest_scope_tt:0 "แขกผู้ไร้ความเห็นอกเห็นใจทุกคน"

 feast_default.6121.t:1 "การดูหมิ่นอย่างมีรสนิยม"
 feast_default.6121.desc:0 "ขณะที่อาหารจานแล้วจานเล่าถูกนำเข้ามาในห้องโถงใหญ่ กลิ่นที่ชัดเจนก็มาถึงข้า และข้ายิ้ม การที่ [ROOT.Char.Custom2('RelationDescriptor', SCOPE.sC('hated_guest'))] [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('hated_guest'))] [hated_guest.GetTitledFirstName] ของข้าแพ้ [ROOT.GetCharacter.Custom('GetFoodDetail')] เป็นสิ่งที่ข้า #EMP ลืม#! บอกพ่อครัวอย่างน่าเศร้า\n\n"ข้าขอต้อนรับทุกท่าน และข้าภาวนาว่าท่านจะพบว่าอาหารเป็นที่พอใจ""
 feast_default.6121.a:0 "โดยเฉพาะท่าน [hated_guest.GetFirstNameNoTooltip] #EMP เพลิดเพลินเถิด#!!"
 feast_default.6121.b:0 "ใบหน้าของ [hated_guest.GetHerHis|U] ขณะที่ข้า 'ช่วย' [hated_guest.GetHerHim] จากอาหารนั้นเป็นที่พอใจของข้าอย่างแน่นอน!"

 feast_default.6231.t:1 "หายนะมาเยือน"
 feast_default.6231.desc:0 ""[ROOT.Char.Custom('FormOfAddressForLiege')|U]. ไวน์... เราเปิดถังต่อไปแล้ว – มันเสีย. มันเสีย #EMP ทั้งหมด#! เลย!"\n\nงานเลี้ยงยังคงดำเนินต่อไปอย่างดุเดือด, แต่หากไร้สุรา บรรยากาศย่อมเหี่ยวเฉาลงอย่างรวดเร็ว"
 feast_default.6231.a:0 "พ่อค้าไวน์น่าจะยังอยู่ในเมือง!"
 every_drunkard_guest_scope_tt:0 "แขกขี้เมาทุกคนที่เข้าร่วม"
 feast_default.6231.b:0 "เราทุกคนต้องช่วยกัน มาเถอะ"
 feast_default.6231.c:0 "ถึงเวลาเปิดคลังลับของข้าแล้ว"
 feast_default.6231.d: "มานำไวน์ชั้นดีของข้าออกมากันเถอะ"

 feast_default.6251.t:1 "สภาวะกลืนไม่เข้าคายไม่ออก"
 feast_default.6251.desc:0 "งานเลี้ยงกำลังจะเลิกรา และข้าพบว่าตัวเองกำลังสนทนาอย่างลึกซึ้งกับ [ROOT.Char.Custom2('RelationDescriptor', SCOPE.sC('guest'))] [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('guest'))] [guest.GetTitledFirstName] ของข้า\n\n[guest.GetSheHe|U] สอบถามความคิดเห็นของข้าเกี่ยวกับ [guest.Custom('subject_of_interest')] – หัวข้อที่ [guest.GetSheHe] สนใจอย่างลึกซึ้ง [guest.GetHerselfHimself]"
 feast_default.6251.a:0 "เป็นหัวข้อที่ ทำให้ข้าหลงใหล เช่นกัน!"
 feast_default.6251.b:0 "ข้าไม่สนใจเลยแม้ แต่น้อย"
 feast_default.6251.c:0 "ข้าสนใจใน #EMP ท่าน#! มากกว่า...!"

 feast_default.6261.t:1 "เพื่อรับใช้มนุษย์"
 feast_default.6261.desc_lunatic:0 ""ข้าได้ลงมือช่วยเตรียมอาหารด้วยตนเอง และข้าหวังว่าผลลัพธ์จะเป็นที่น่าพอใจ!""
 feast_default.6261.desc_not_lunatic:0 ""ผู้ช่วยพ่อครัวได้ทุ่มเททั้งกายและใจเพื่อเตรียมอาหารมื้อนี้ และข้าหวังว่าผลลัพธ์จะเป็นที่น่าพอใจ!""
 feast_default.6261.desc_cannibal_guest:0 "\n\nขณะที่เรานั่งลงทานอาหาร ข้าอดสังเกตไม่ได้ว่า [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('cannibal_guest'))] [cannibal_guest.GetTitledFirstName] ของข้าดูเหมือนจะเพลิดเพลินกับอาหารเป็นพิเศษ"
 feast_default.6261.desc_concerned_guest:0 "\n\nอย่างไรก็ตาม ขณะที่เรานั่งลงทานอาหาร [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('concerned_guest'))] [concerned_guest.GetTitledFirstName] ของข้าเพียงแค่เขี่ยอาหารที่วางอยู่ตรงหน้า [concerned_guest.GetHerHim] และมองมาที่ข้าด้วยความสงสัย"
 feast_default.6261.a_exposed:0 "ราวกับว่า [concerned_guest.GetSheHe] ไม่ไว้ใจข้า!"
 feast_default.6261.a:0 "ปล่อยให้ [concerned_guest.GetHerHim] สงสัยอะไรก็ได้ที่ [concerned_guest.GetSheHe] ต้องการ"
 feast_default.6261.b:0 "นำอาหารอย่างอื่นมาให้ [concerned_guest.GetTitleTierName] ทาน"
 feast_default.6261.c:0 "ข้าคิดว่าเราอาจมีแนวคิดเรื่องอาหารมากมายที่จะหารือกัน!"

 feast_default.6301.t:1 "ภาระจากโบราณวัตถุ"
 feast_default.6301.desc:0 "ท่ามกลางงานรื่นเริง, หัวหน้าทหารองครักษ์รีบมาหาข้า.\n\n"[ROOT.Char.Custom('FormOfAddressForLiege')|U], ดูเหมือนว่าจะมีคน [feast_target_artifact.Custom('DamageArtifactAction')] [feast_target_artifact.GetName]! หลักฐานชี้ไปที่ [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('feast_artifact_culprit'))] ของ [ROOT.Char.GetLadyLord], [feast_artifact_culprit.GetTitledFirstNameNoTooltip], ผู้ ซึ่งมีท่าทีแปลกๆ ในเย็นวันนี้." [captain_of_the_guard_dummy.GetSheHe|U] ชำเลืองมองไปทาง [feast_artifact_culprit.GetFirstNamePossessiveNoTooltip].\n\n"[ROOT.Char.GetLadyLord] ประสงค์ให้ข้าทำ เช่นใด?""
 feast_default.6301.desc_learning_guard:0 "\n\n[feast_target_artifact.Custom('DamageArtifactActionFollowup')]"
 feast_default.6301.desc_learning:0 "\n\nเมื่อมองไป [feast_artifact_culprit.GetTitledFirstNameNoTooltip] ดูไม่สบายใจนัก"
 feast_default.6301.a:0 "กักตัว [feast_artifact_culprit.GetTitledFirstNameNoTooltip] ทันที!"
 feast_default.6301.b:0 "พา [feast_artifact_culprit.GetHerHim] มาหาข้า"
 feast_default.6301.b.tt:0 "[feast_artifact_culprit.GetTitledFirstNameNoTooltip] ควรจ่ายค่าเสียหาย"
 feast_default.6301.b.tt_innocent:1 "[feast_artifact_culprit.GetTitledFirstNameNoTooltip] เป็นผู้บริสุทธิ์"
 feast_default.6301.b.tt_guilty:1 "[feast_artifact_culprit.GetTitledFirstNameNoTooltip] เป็นผู้กระทำผิด"
 feast_default.6301.c_learning:0 "ข้าเชื่อว่าท่านรู้มากกว่าที่ท่านพูดนะ หัวหน้าทหารยาม..."
 feast_default.6301.c.tt:0 "ท่านกำจัดหัวหน้าทหารยามเจ้าเล่ห์ของท่าน"
 feast_default.6301.d:0 "ข้าไม่เคยชอบชิ้นนั้นอยู่แล้ว"

 #...turns out the suspect was innocent after all
 feast_default.6302.t:1 "ผู้บริสุทธิ์พูด"
 feast_default.6302.t_lover:0 "ผู้บริสุทธิ์นอนอยู่ที่นี่"
 feast_default.6302.desc_intro:0 "[feast_trusted_friend.GetTitledFirstNameNoTooltip] เข้ามาหาข้าในห้องทำงาน "สหายที่รัก [feast_trusted_friend.Custom2('RelationToMe', ROOT.Char)] ข้าเพิ่งทราบเรื่องการจองจำของ [feast_artifact_culprit.GetFirstNamePossessiveNoTooltip]""
 feast_default.6302.desc_secret_lover:0 "\n\n[feast_trusted_friend.GetSheHe|U] เหลือบมองข้าอย่างประหม่า "นั่นอาจเป็นความผิดพลาด — ข้ากำลัง... เฝ้าดู... [feast_artifact_culprit.GetTitledFirstNameNoTooltip] ในช่วงเวลาที่เกิดเหตุการณ์ และเป็นไปไม่ได้เลยที่จะเป็น [feast_artifact_culprit.GetHerHim]"\nแก้มของ [feast_trusted_friend.GetHerHis] แดงก่ำอย่างเห็นได้ชัด"
 feast_default.6302.desc_spirited_debate:0 "\n\n[feast_trusted_friend.GetSheHe|U] มองข้าอย่างสงบ แต่กังวล "ข้าจำได้อย่างชัดเจนว่า [feast_artifact_culprit.GetHerHim] กำลังโต้เถียงอย่างเผ็ดร้อนกับ [feast_debatee_character.GetTitledFirstNameNoTooltip] ในช่วงเวลาที่เกิดเหตุการณ์ ดังนั้นจึงเป็นไปไม่ได้เลยที่ [feast_artifact_culprit.GetHerHim] จะเป็นผู้กระทำผิด""
 feast_default.6302.a:0 "แม้ แต่โฮเมอร์ก็ยังพยักหน้า ข้าพเจ้าผิดเอง"
 feast_default.6302.a.tt:0 "[feast_artifact_culprit.GetTitledFirstNameNoTooltip] จะจดจำสิ่งนี้"
 feast_default.6302.a_lover:0 "#EMP [feast_trusted_friend.GetTitledFirstNameNoTooltip]!#!"
 feast_default.6302.b:0 "เก็บเรื่องนี้ไว้เป็นความลับระหว่างเรา"
 feast_default.6302.b.tt:0 "ข้ามั่นใจว่า [feast_artifact_culprit.GetTitledFirstNameNoTooltip] มีความผิดใน #EMP บางอย่าง#!."
 feast_default.6302.b.tt_callous:0 "[feast_artifact_culprit.GetTitledFirstNameNoTooltip] เป็นส่วนเสริมที่ดีให้กับนักโทษของข้า"

 feast_default.6351.t:1 "ความเสียหายข้างเคียง"
 feast_default.6351.desc_intro:0 "ข้าแทบจะไม่ได้นั่งลงที่ที่นั่งของข้าเลยเมื่อได้ยินเสียงโหยหวนเปล่งออกมาจาก [feast_default_6351_fighter_2.GetTitledFirstNameNoTooltip] ดูเหมือนว่า [feast_default_6351_fighter_2.GetSheHe] และ [feast_default_6351_fighter_1.GetTitledFirstNameNoTooltip] จะทะเลาะกันอย่างจริงจัง เนื่องจาก [feast_default_6351_fighter_2.GetFirstNameNoTooltip] กำลังถูก [feast_default_6351_fighter_1.GetWomanMan] จัดการอย่างเหมาะสมจาก [feast_default_6351_fighter_1.GetFirstNameNoTooltip] ข้าตระหนักช้าเกินไปว่าการต่อสู้ของพวกเขาได้เคลื่อนผ่าน [feast_target_artifact.GetName] ไปแล้ว!"
 feast_default.6351.desc_calm:0 "\n\nข้าโบกมือให้ทหารยามแยกทั้งสองออกจากกัน ซึ่งกำลังขู่ฟ่อและข่วนกันอยู่"
 feast_default.6351.desc_wrathful:0 "\n\nข้าตะโกนใส่พวกเขาจากอีกฟากของห้องโถง: "#EMP นี่มันหมายความว่าอย่างไร!#!""
 feast_default.6351.desc_outro:0 "\n\nทั้งคู่ถูกนำตัวมาอยู่ต่อหน้าข้า ตลอดเวลาต่างโยนความผิดให้กันและกันว่าเป็นคนเริ่มการต่อสู้"
 feast_default.6351.a:0 "[feast_default_6351_fighter_1.GetTitledFirstNameNoTooltip] ท่านทำได้อย่างไร?"
 feast_default.6351.a_wrathful:0 "[feast_default_6351_fighter_1.GetTitledFirstNameNoTooltip], #EMP ท่านกล้าดียังไง!#!"
 feast_default.6351.a.tt:0 "ให้ [feast_default_6351_fighter_1.GetTitledFirstNameNoTooltip] จ่ายค่าเสียหาย"
 feast_default.6351.b:0 "ทำไมท่านถึงปล่อยให้ [feast_default_6351_fighter_1.GetHerHim] ยั่วยุท่าน [feast_default_6351_fighter_2.GetTitledFirstNameNoTooltip]?"
 feast_default.6351.b_wrathful:0 "ความอดทนของข้าใกล้จะหมดแล้ว [feast_default_6351_fighter_2.GetTitledFirstNameNoTooltip]..."
 feast_default.6351.b.tt:0 "ให้ [feast_default_6351_fighter_2.GetTitledFirstNameNoTooltip] จ่ายค่าเสียหาย"
 feast_default.6351.c:0 "ไม่สำคัญว่าใครเริ่ม ท่านทั้งคู่ต้องรับผิดชอบ"
 feast_default.6351.c_wrathful:0 "#EMP พอได้แล้ว!#! ท่านทั้งคู่ต้องจ่ายค่าเสียหาย"
 feast_default.6351.c.tt:0 "ให้ทั้งคู่จ่ายค่าเสียหาย"
 feast_default.6351.d:0 "ในนามของ [ROOT.Char.GetFaith.HighGodName] ข้าจะหันแก้มอีกข้างให้"
 feast_default.6351.d.tt:0 "ให้ [ROOT.Char.GetFaith.HighGodName] จัดการพวกเขา"
 feast_default.6351.e:0 "เรื่องแบบนี้เกิดขึ้นได้ มันไม่ใช่ชิ้นโปรดของข้า"
 feast_default.6351.e_wrathful:0 "#EMP โชคดีสำหรับพวกเจ้าปัญญาทึบ#! ข้าไม่เคยชอบชิ้นนั้น..."
 feast_default.6351.e.tt:0 "ปล่อยพวกเขาไป"

 feast_default.6501.t:1 "คำพูดสองแง่สองง่าม"
 feast_default.6501.desc.opening:0 ""ข้ารู้ว่าข้าพูดอะไรไป ข้าแค่ไม่เข้าใจว่าทำไมท่านถึงคิดว่ามันตลกนัก?"\n\n[innocent_guest.GetTitledFirstName] เอียงศีรษะ [innocent_guest.GetHerHis] ไปด้านข้างขณะที่ข้ากลั้นหัวเราะ ข้ายังไม่ได้บอก [innocent_guest.GetHerHim] ว่าสิ่งที่ [innocent_guest.GetSheHe] พูดนั้นสามารถตีความว่าเป็นเรื่องลามกได้\n\n"
 feast_default.6501.joke_a:0 ""ถ้าท่านบีบหัว สารข้นๆ จะไหลออกมา!""
 feast_default.6501.joke_b:0 ""ข้ามีปัญหาในการทำความเข้าใจสำเนียงนี้ และข้าได้ยินมาว่าท่านเป็นนักภาษาศาสตร์ที่ฉลาดหลักแหลม!""
 feast_default.6501.joke_c:0 ""นางมีหีบที่น่ารักจัดแสดงอยู่ในห้องพิจารณาคดี!""
 feast_default.6501.desc.ending_solo:0 "\n\nมีเพียงข้าคนเดียวหรือที่คิดว่านี่ตลก? ข้าจะไม่รู้ เว้นแต่ข้าจะพูดออกมา มันคุ้มค่าที่จะเสี่ยง ทำให้ [innocent_guest.GetFirstNameNoTooltip] อับอายเพื่อเรื่องตลกหรือไม่?"
 feast_default.6501.desc.ending_duo:0 "\n\nข้าอาจไม่ใช่คนเดียวที่คิดว่านี่ตลก เช่นกัน; [fellow_pervert.GetTitledFirstName] สำลักเครื่องดื่มของ [fellow_pervert.GetHerHis] ออกมาเมื่อ [innocent_guest.GetTitledFirstNameNoTooltip] พูดซ้ำ [innocent_guest.GetHerselfHimself] ทั้งสองอาจมีอารมณ์ขันหยาบคายแบบเดียวกับข้า หรือพวกเขาอาจจะขุ่นเคืองกับมัน ข้าจะไม่รู้ว่าใครคิดอย่างไร เว้นแต่ข้าจะพูดออกมา"
 feast_default.6501.a:0 "ข้า เอ่อ... ช่างมันเถอะ..."
 feast_default.6501.b:0 "พูดซ้ำสิ่งที่ท่านพูด แต่ช้าๆ คิดเกี่ยวกับมันจริงๆ"
 feast_default.6501.b.tt:0 "#F ท่านเสี่ยงที่จะ ทำให้ [innocent_guest.GetTitledFirstNameNoTooltip] อับอายโดยหวังว่าท่านจะมีอารมณ์ขันแบบเดียวกัน"
 feast_default.6501.b.success:0 "[innocent_guest.GetTitledFirstNameNoTooltip] พบว่าคำพูดสองแง่สองง่ามนั้นตลก"
 feast_default.6501.b.failure:0 "[innocent_guest.GetTitledFirstNameNoTooltip] รู้สึกอับอายกับอารมณ์ขันวิปริตของท่าน"

 feast_default.6510.t: "ใต้โต๊ะ"
 feast_default.6510.desc.intro: "อาหารจานต่อไปมาถึงโต๊ะและทั้งหมดที่ข้าเห็นคือของเหลวข้นน่าสงสัยที่เสิร์ฟบนจาน, ดิ้นกระแด่วๆ ราวกับมีชีวิต. ท้องของข้าปั่นป่วนเพื่อเตือน, และข้าอยากจะข้ามจานต่อไปนี้เหลือเกิน... [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('primary_spouse'))] ของข้า [ROOT.Char.GetPrimarySpouse.GetFirstName] สังเกตเห็นความขยะแขยงของข้าและเอนตัวมาข้างหน้า, จ้องมองข้าอย่างเขม็ง, ค่อยๆ ส่ายศีรษะของ [primary_spouse.GetHerHis] ไปมาอย่างไม่เห็นด้วย.\n\nราวกับเพื่อช่วยข้าให้พ้นจากชะตากรรมอันน่าสะพรึงกลัวนี้, [ROOT.Char.GetFaith.PositiveAfterLife|U] ได้เข้าแทรกแซง — ข้าบังเอิญเหลือบไปเห็น"
 feast_default.6510.desc.cat: "แมวของข้า [ROOT.Char.Custom('CatStoryName')]"
 feast_default.6510.desc.dog: "สุนัขของข้า [ROOT.Char.Custom('DogStoryName')]"
 feast_default.6510.desc_cat_and_dog: "สัตว์เลี้ยงของข้า, [ROOT.Char.Custom('CatStoryName')] และ [ROOT.Char.Custom('DogStoryName')]"
 feast_default.6510.desc.outro: "กำลังมองหาเศษอาหารบนพื้น. นี่เป็นโอกาสของข้าที่จะเลี่ยงอาหารจานที่ไม่อภิรมย์นี้!"
 feast_default.6510.a: ""#EMP มานี่...""
 feast_default.6510.a.tt.success: "ดูเหมือนไม่มีใครสังเกตเห็น"
 feast_default.6510.a.tt.failure: "ดูเหมือนทุกคนจะสังเกตเห็น"
 feast_default.6510.b: "ทนๆ ไปดีกว่า..."
 feast_default.6510.b.tt.success: "ข้ารู้สึกดีกว่าที่คาดไว้"
 feast_default.6510.b.tt.failure: "ข้ารู้สึกไม่ค่อยดี"
 feast_default.6510.c: "ข้าเลือกสิ่งที่ข้าจะกิน!"

 feast_default.8001.t.fire:1 "จากเถ้าถ่านสู่เปลวเพลิง"
 feast_default.8001.t.knights:1 "เสิร์ฟเย็นดีที่สุด"
 feast_default.8001.desc.sadistic:1 "เปลวไฟเลียหลังคา และเสียงกรีดร้องดังก้องไปในยามค่ำคืน ข้าพิงหลังกับประตูที่ปิดอยู่ ไม่สนใจใบหน้าที่หวาดกลัวของเหยื่อ และยิ้ม การปล่อยให้ความแค้นเคืองที่คุกรุ่นปะทุเป็นเปลวไฟเป็นวิธีที่ดีที่สุดในการจัดการกับความขัดแย้งอย่างแท้จริง!\n\nขณะที่เสียงทุบจากอีกด้านหนึ่งอ่อนแรงลงเรื่อยๆ ในที่สุดข้าก็ปล่อยให้ตัวเองหัวเราะออกมา"
 feast_default.8001.desc.compassionate:0 "ข้าไม่สามารถละสายตาจากจานของข้าได้ [ROOT.Char.Custom('RegionalEdibleMeat')] แทบไม่ถูกแตะต้อง [ROOT.Char.Custom('GetExpensiveDrink_Singular')] ของข้ายังคงอยู่ ข้าหลีกเลี่ยง [honorary_guest.GetTitledFirstName] เมื่อ [honorary_guest.GetSheHe] พูดถึง [honorary_guest.Custom('herhis_subject_of_interest')] น่าละอาย\n\n"ได้โปรด สหายข้า" ข้าขอตัว ออกจากห้องไปอย่างเร่งรีบ ข้าหายใจหนักหน่วง มันคือสิ่งที่ #EMP ต้อง#! ทำ ข้าส่งสัญญาณให้คนรับใช้คนหนึ่งและหลับตาลง\n\nเปลวไฟ จากนั้นก็เสียงกรีดร้อง"
 feast_default.8001.desc.just:0 "คนอื่นๆ ออกไปหมดแล้ว ทุกคน — ยกเว้นแขกผู้มีเกียรติของข้าและคณะผู้ติดตามอันงดงามของ [honorary_guest.GetHerHis] ข้าจิบจากถ้วยของข้า ขณะที่ [ROOT.GetCharacter.Custom('GetIncidentalDetailPresent')] พวกเขาต้องไม่สงสัย "ขออภัย" ข้าสบตากับ [honorary_guest.GetTitledFirstName] ก่อนที่ข้าจะจากไป ต้องไม่มีใครรู้ จะไม่มีใครรู้\n\nขณะที่ข้าออกคำสั่งให้ปิดประตู ข้าใช้เวลาหายใจครู่หนึ่ง สิ่งที่ถูกต้องไม่จำเป็นต้องใจดีเสมอไป\n\nในไม่ช้า เปลวไฟก็ปรากฏขึ้น และเสียงกรีดร้องก็ตามมา"
 feast_default.8001.desc.random_1:1 "การสนทนากับ [honorary_guest.GetTitledFirstName] เป็นมิตรอย่างยิ่ง สายตาของข้าเหลือบไปมอง [host.Custom('GetExpensiveDrink_Singular')] ขณะที่ [honorary_guest.GetSheHe] บรรยายยืดยาวเกี่ยวกับ [honorary_guest.Custom('herhis_subject_of_interest')] แขกคนอื่นๆ ทั้งหมดออกไปแล้ว แน่นอน พวกเขาคงไม่อยากขัดจังหวะเรื่องสำคัญที่แขกผู้มีเกียรติของข้าต้องการหารือ\n\nยาพิษไม่มีรส ตรวจไม่พบ"
 feast_default.8001.desc.random_2:1 "ดนตรีและการเต้นรำดังถึงระดับที่ ทำให้การพูดคุยแทบเป็นไปไม่ได้ พนักงานรินเครื่องดื่มเติมถ้วยของ [honorary_guest.GetTitledFirstNamePossessive] และสายตาของเราสบกันเพียงชั่วครู่\n\n[ROOT.Char.GetHouse.GetMotto]" ข้าพึมพำ ขณะที่ [honorary_guest.GetFirstNameNoTooltip] สำลักยาพิษ"
 feast_default.8001.a:0 "ในที่สุด... พวกเขาก็ไปแล้ว"
