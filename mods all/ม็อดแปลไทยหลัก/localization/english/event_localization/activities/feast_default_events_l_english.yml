 feast_default.8002.t:1 "มีดในความมืด"
 feast_default.8002.t.poison:0 "อีกแก้ว"
 feast_default.8002.desc.random_2:0 "ในที่สุด ก็เหลือเพียงข้าและ [honorary_guest.GetTitledFirstName] ตามลำพัง "ขอคุยด้วยหน่อย สหายข้า" แขกคนอื่นๆ ทั้งหมดเริ่มเต้นรำและเสียงดนตรีดังมาถึงเรา อู้อี้ ผ่านกำแพงหิน เสียงสะท้อน บางทีเสียงสะท้อนของ [honorary_guest.GetHerHis] อาจจะได้ยิน เช่นกัน\n\n[honorary_guest.GetFirstNameNoTooltip] เลิกคิ้วของ [honorary_guest.GetHerHis] $knight_culture_player_plural_no_tooltip_lowercase$ คนหนึ่งของข้ากำลังเสิร์ฟเครื่องดื่มให้ [honorary_guest.GetHerHim] เพิ่ม "มีเรื่องสำคัญอะไรหรือ?," [honorary_guest.GetSheHe] ถาม ถ้วยเกือบจะแตะริมฝีปากของ [honorary_guest.GetHerHis] เกือบจะ เสียงอู้อี้ผ่านกำแพงหิน คอของ [honorary_guest.GetHerHis|U] ถูกปาด เสียงสะท้อน"
 feast_default.8002.desc.sadistic:0 ""มาทางนี้ [honorary_guest.GetFirstName] ข้าจะแสดงเข็มกลัดใหม่ที่ข้าสั่งทำเพื่อท่าน ของขวัญชั้นดีสำหรับแขกผู้ดีที่สุด"\n\nข้านำทาง และ [honorary_guest.GetSheHe] ตามมา ขณะที่ [ROOT.GetCharacter.Custom('GetIncidentalDetailPresent')] "อยู่นี่แล้ว" ข้าประกาศ เปิดประตูสู่ห้องเล็กๆ ที่มีแสงสลัว ข้าเห็นความสับสนในดวงตาของ [honorary_guest.GetHerHis] — เพียงชั่วครู่ การตระหนักรู้นั้นรวดเร็วพอ "ไม่... ท่านทำไม่ได้"\n\n"โอ้ ข้ารับรองว่าข้าจะทำ""
 feast_default.8002.desc.just:1 "ถึงเวลาแล้ว ข้าจ้องมอง [honorary_guest.GetTitledFirstName] ขณะที่ [honorary_guest.GetSheHe] [honorary_guest.Custom('quirk_pos_present')] น่าเสียดาย แต่ต้องทำ "ข้าขอเชิญท่านเดินเล่นได้ไหม?," คำถามของข้าได้รับการตอบรับอย่างกระตือรือร้นด้วยรอยยิ้มที่สงสัย "เรื่องราชการใดที่ ทำให้ [ROOT.Char.GetTitleAsNameNoTooltip] ของเรากังวล?"\n\nมากมาย ในไม่ช้า ก็จะน้อยลงหนึ่งเรื่อง\n\nข้านำทางไปยังห้องที่เล็กที่สุดห้องหนึ่ง ประตูปิดลงด้านหลัง ไฟเริ่มลุกไหม้ การเคลื่อนไหวที่สะอาด"
 feast_default.8002.a:0 "เสร็จสิ้นแล้ว"
 
 feast_default.8003.t:1 "อุบัติเหตุอันโชคร้าย"
 feast_default.8003.desc.poison:0 "แขกทุกคนดูเหมือนจะจดจ่ออยู่กับการร้องเพลงและการเต้นรำ มีเพียงไม่กี่คนที่ยังคงนั่งอยู่ โชคดีที่การสนทนาของข้ากับ [honorary_guest.GetTitledFirstName] ดูเหมือนจะเพียงพอที่จะรั้ง [honorary_guest.GetHerHim] ไว้ "งานเลี้ยงที่ยอดเยี่ยม" [honorary_guest.GetSheHe] กล่าว วางถ้วยของ [honorary_guest.GetHerHis] ลงเพื่อกัดอีกคำ\n\n"อา ท่าน ทำให้หัวใจข้าอบอุ่น" ข้าตอบ ขณะที่ส่งสัญญาณให้พนักงานรินเครื่องดื่มของข้า นี่จะเป็นงานเลี้ยงสุดท้ายของ [honorary_guest.GetHerHis] สายตาของข้าสบกับ [honorary_guest.GetFirstNamePossessiveNoTooltip] ชั่วขณะแห่งความลังเล"
 feast_default.8003.desc.compassionate:0 "ข้ารีบเช็ดหยดเหงื่อที่ไหลลงหน้าผาก กำผ้าเช็ดหน้าแน่นกว่าที่จำเป็น [honorary_guest.GetTitledFirstName] พูดถึง [honorary_guest.Custom('subject_of_interest')] และข้าไม่สามารถเพ่งสายตาได้ "สักครู่..." ข้าขอตัวขณะที่เห็น [honorary_guest.GetHerHim] ยกถ้วยของ [honorary_guest.GetHerHis] เข้าใกล้ริมฝีปากของ [honorary_guest.GetHerHis]\n\nข้ารู้ว่ามันบรรจุอะไรอยู่"
 feast_default.8003.desc.sadistic:0 ""ได้โปรด สหายข้า ให้ข้าเติมถ้วยให้ท่าน เพราะท่านคือแขกที่รักที่สุดของข้า" ข้าเสนอด้วยรอยยิ้มที่อบอุ่นที่สุด [honorary_guest.GetTitledFirstName] พยักหน้า ยื่นถ้วยของ [honorary_guest.GetHerHis] ให้ข้า แขกเริ่ม [ROOT.Char.Custom('GetMedievalDance')] และเสียงโห่ร้องของพวกเขาก็ดังพอที่จะเบี่ยงเบนความสนใจ\n\nข้าเทยาพิษจากแหวนของข้าด้วยความระมัดระวังสูงสุด "ข้าหวังว่าท่านจะกระหายน้ำ""
 feast_default.8003.a:0 "#EMP ดื่มอวยพร.#!"
 feast_default.8003.a.success:0 "[honorary_guest.GetShortUIName] ดื่มจากถ้วย"
 feast_default.8003.a.failure:0 "[honorary_guest.GetShortUIName] ไม่ดื่ม"
 
 feast_default.8004.t:0 "จงเปิดตาไว้"
 feast_default.8004.desc.intro:0 "ข้าจิบ [host.Custom('RegionalDrink')] ของข้าขณะที่ค่ำคืนใกล้จะสิ้นสุดลง ดวงตาของข้าเริ่มเหนื่อยล้า แต่"
 feast_default.8004.desc.goh_intro:0 "[host.GetTitledFirstName] ยืนกรานให้ข้าอยู่ต่อเพื่อหารือเรื่องราชการ "ดังที่ข้ากำลังพูด" [host.GetSheHe] พูดต่อ โดยไม่สนใจการหาวที่ข้าปกปิดไว้\n\n"
 feast_default.8004.desc.goh_solo:0 "$feast_default.8004.desc.goh_intro$ แต่เมื่อข้าลืมตาขึ้นอีกครั้ง ข้าเห็นแสงสีเงินแวววาว "งานเลี้ยงสิ้นสุดที่นี่""
 feast_default.8004.desc.goh_group:0 "$feast_default.8004.desc.goh_intro$"ช่วยด้วย!" เสียงกรีดร้องขัดจังหวะการสนทนา "#EMP ช่วยด้วย!#!" อีกเสียงหนึ่ง เมื่อข้ามองไปรอบๆ ข้าเห็นแสงสีเงินแวววาวของดาบ และหนึ่งในนั้นกำลังชี้มาที่ข้าโดยตรง\n\n"มันจบแล้ว [murder_victim.GetTitleAsNameNoTooltip]""
 feast_default.8004.desc.fallback:0 "[host.GetTitledFirstName] ยืนกรานให้ [honorary_guest.GetTitledFirstName] อยู่ต่อเพื่อการพูดคุยที่สำคัญมากๆ และแน่นอน คณะผู้ติดตามของ [honorary_guest.GetHerHis] ต้องติดตาม [honorary_guest.GetHerHim]"
 feast_default.8004.a:0 "เดี๋ยวก่อน... เกิดอะไรขึ้น?"
 feast_default.8004.a.tt.success:0 "ท่านตาย"
 feast_default.8004.a.tt.success.host:0 "[murder_victim.GetShortUIName] เสียชีวิตแล้ว"
 feast_default.8004.a.tt.failure:0 "ท่านรอดชีวิต"
 feast_default.8004.a.tt.failure.host:0 "[murder_victim.GetShortUIName] รอดชีวิต"
 feast_default.8004.a.goh_murder.tt:0 "[honorary_guest.GetShortUIName] ตาย"
 every_attending_travel_companion_goh:0 "สมาชิกคณะผู้ติดตามทุกคน"

 feast_default.8052.t:1 "การสิ้นสุดอย่างกะทันหัน"
 feast_default.8052.desc:0 ""ไฟไหม้!"\n\nขณะที่ความตื่นตระหนกแพร่กระจายไปในหมู่แขก ข้ามองหา [host.Custom2('MyCharacterIntroduction', ROOT.Char)] แต่พบว่าเก้าอี้ของ [host.GetHerHis] ว่างเปล่า\n\nไฟลุกลามอย่างรวดเร็ว – ผ้าที่เปื้อน [ROOT.Char.Custom('RegionalDrink')] และผู้เข้าร่วมที่ แต่งตัวหรูหราไหม้อย่างรวดเร็ว ผิวหนังของข้าพุพอง #EMP ลอก#! และข้ากรีดร้อง; แต่ในไม่ช้าแม้ แต่สิ่งนั้นก็เป็นไปไม่ได้เมื่อควันโขมง ทำให้เสียงร้องของข้าเงียบลง"
 feast_default.8052.a:0 "ข้าอยากจะจากไปอย่างรุ่งโรจน์เสมอ..."

 feast_default.8061.t.fire:1 "ไฟไหม้! ไฟไหม้...?"
 feast_default.8061.t:0 "$feast.7151.t$"
 feast_default.8061.desc.fire:1 "[host.Custom2('MyCharacterIntroduction', ROOT.Char)|U] รีบพาข้าและคนอื่นๆ อีกจำนวนหนึ่งออกจากห้องโถงจัดเลี้ยงก่อนที่จะพยายามปิดประตู\n\nอย่างไรก็ตาม — ก่อนที่ [host.GetSheHe] จะทำสำเร็จ — เสียงร้องดังขึ้นจากภายใน และผู้เข้าร่วมทั้งหมดก็หลั่งไหลออกไปในยามค่ำคืนขณะที่เปลวไฟเริ่มลุกไหม้จากห้องโถงจัดเลี้ยง"
 feast_default.8061.desc.fail:0 "$feast.7151.desc$"
 feast_default.8061.desc.fail_me:0 "มือของข้ายังคงสั่นหลังจากเหตุการณ์เมื่อคืนนี้ และทหารรับจ้างที่ควรจะสังหารข้าได้ถูก [host.GetTitledFirstName] จองจำไว้แล้ว\n\nอย่างไรก็ตาม ความรู้สึกไม่สบายใจนี้ไม่สามารถหายไปได้ง่ายๆ"
 feast_default.8061.desc.death_alone:1 "อารมณ์เศร้าสร้อยกว่าที่ข้าหวังไว้เมื่อเราเตรียมตัวออกจากงานเลี้ยงของ [host.GetTitledFirstNamePossessive] ศพของ [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('murder_guest'))] [murder_guest.GetTitledFirstName] ของข้าถูกพบ ยังคงอุ่นอยู่บนพื้น\n\nความตายได้หลอกหลอนกำแพงเหล่านี้และเครื่องดื่มก็มีรสเปรี้ยวบนริมฝีปากของเรา"
 feast_default.8061.a:2 "ข้าเดาว่างานเลี้ยงจบลงแล้ว"
 feast_default.8061.a.good:0 "[murder_guest.GetFirstNameNoTooltip]... จากไป เช่นนี้"

 feast_default.9001.t:1 "ขณะที่แขกของข้าจากไป"
 feast_default.9001.desc_exotic:0 "เมื่อทุกคนมุ่งหน้ากลับบ้านพร้อมกับท้องที่เต็มไปด้วยอาหารแปลกใหม่ ข้าภูมิใจที่จะกล่าวว่างานเลี้ยงประสบความสำเร็จ!"
 feast_default.9001.desc_lavish:0 "เมื่อแขกทุกคนของข้าออกจากปราสาทของข้าพร้อมกับของทั้งหมดในห้องเก็บอาหารอันกว้างใหญ่ของข้าในท้องของพวกเขา ข้าภูมิใจที่จะกล่าวว่างานเลี้ยงประสบความสำเร็จ!"
 feast_default.9001.desc_meager:0 "เมื่อแขกทุกคนของข้าต่อสู้เพื่อเศษอาหารบนโต๊ะอันน้อยนิดของข้าเสร็จสิ้นแล้ว มัน ทำให้ข้ารู้สึกโล่งใจอย่างยิ่งที่ได้เฝ้าดูพวกเขากลับไปในที่สุดด้วยเสื้อผ้าหลวมๆ และท้องที่ร้องครวญคราง"
 feast_default.9001.desc:0 "เมื่อทุกคนมุ่งหน้ากลับบ้านของตน ข้าภูมิใจที่จะกล่าวว่างานเลี้ยงประสบความสำเร็จ!"
 feast_default.9001.spouse:0 "\n\nข้าต้องขอบคุณ [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('spouse'))] [spouse.GetFirstName] ของข้าสำหรับความสำเร็จส่วนใหญ่ และข้ารู้สึกขอบคุณอย่างยิ่งขณะที่ [spouse.GetSheHe] ส่งแขกสองสามคนสุดท้ายกลับ"
 feast_default.9001.no_spouse:0 "อย่างไรก็ตาม ข้ายังคงรู้สึกขอบคุณที่ความพยายามสิ้นสุดลงแล้วสำหรับตอนนี้"
 feast_default.9001.a:0 "ไว้พบกันใหม่คราวหน้า!"

 feast_default.9002.desc_roughed_up: "\n\nช่างเป็นงานเลี้ยง! กระเป๋าของข้าเต็มไปด้วยเครื่องใช้บนโต๊ะอาหารและ [host.Custom('GetExpensiveMeal')] ที่ขโมยมา, ไอ้ [host.Custom2('InsultNoun', ROOT.Char)] [host.GetFirstNameNoTooltip] นั่นไม่ควรมาสบประมาทข้า!"
 feast_default.9002.desc_exotic:0 "ช่างเป็นงานเลี้ยงอะไร เช่นนี้! ก่อนมา ข้าไม่เคยจินตนาการถึงอาหารแปลกใหม่ที่ข้าจะได้ลิ้มลองในช่วงเวลาที่อยู่ในห้องโถงของ [host.GetTitledFirstNamePossessive] นี่เป็นงานเลี้ยงที่ข้าจะไม่มีวันลืม!"
 feast_default.9002.desc_lavish:0 "ช่างเป็นงานเลี้ยงอะไร เช่นนี้! ก่อนมา เสื้อผ้าของข้าหลวมและไม่พอดีตัว ตอนนี้ข้าเดินโซเซออกจากห้องโถงของ [host.GetTitledFirstNamePossessive] ด้วยอาหารและความรื่นเริงเต็มท้องเป็นสองเท่าเมื่อเทียบกับตอนที่ข้ามาถึง! นี่เป็นงานเลี้ยงที่ข้าจะพยายามลืมให้ได้!"
 feast_default.9002.desc_meager:0 "งานเลี้ยงอะไรกัน? แม้ว่าปกติข้าจะคาดหวังอาหารมากกว่านี้จากงานเลี้ยง ข้าออกจากห้องโถงของ [host.GetTitledFirstNamePossessive] ด้วยความหิว แต่อย่างน้อยเพื่อนร่วมวงก็ดี นี่เป็นงานเลี้ยงที่ข้าอยากจะลืม"
 feast_default.9002.desc:0 "ช่างเป็นงานเลี้ยงอะไร เช่นนี้! ข้าจะจดจำวันที่ใช้เวลาอยู่ในห้องโถงของ [host.GetTitledFirstNamePossessive] ไปอีกนาน"
 feast_default.9002.desc_ending:1 "\n\nบัดนี้ถึงเวลาชำระล้างร่องรอยของสุราและความรื่นเริง, และกลับไปปฏิบัติหน้าที่ของข้าอีกครั้ง..."
 feast_default.9002.a:0 "ลาก่อน [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('host'))] ของข้า!"
 feast_default.5010.t: "ความเงียบในตำนาน"
 feast_default.5010.desc: "ท่ามกลางการเฉลิมฉลองและความรื่นเริง มีช่วงสงบในการสนทนาของผู้เข้าร่วมทั้งหมด [rando_guest.GetName|U] เป็นเพียงคนเดียวที่ยังคงแลกเปลี่ยนคำพูด แต่ข้ารู้สึกว่าตัวเองถูกบังคับให้เงียบเมื่อสายตาเริ่มจับจ้องมาที่ข้า\n\nบางทีช่วงเวลาที่เงียบสงบนี้อาจเป็นโอกาสของข้าที่จะพูดถึง [ROOT.Char.GetPromotedLegend.GetName]"
 feast_default.5010.a: "[rando_guest.GetFirstName|U] ให้ข้าเล่าเรื่องให้ท่านฟัง"
 feast_default.5010.a.success: "[rando_guest.GetFirstName|U] ประทับใจ"
 feast_default.5010.a.failure: "[rando_guest.GetFirstName|U] เบื่อ"
 feast_default.5010.b: "ทุกคนต้องได้ยินตำนานนี้"
 feast_default.5010.c: "ในที่สุด ก็มีช่วงเวลาแห่งความเงียบ"

 feast_default.5020.t: "เงียบ"
 feast_default.5020.desc: "เหยือกกระทบกัน เสียงพูดคุยดังลั่น มือตบโต๊ะ ทั้งหมดอยู่ในเสียงดังผสมปนเปที่ไร้ความหมาย ข้ารู้สึกถึงเสียงที่เต้นเป็นจังหวะผ่านร่างกายของข้า จากนั้นทันใดนั้นทุกอย่างก็ค่อยๆ ช้าลงรอบตัวข้า เหลือเพียงไม่กี่คำและเสียงหัวเราะแปลกๆ\n\nในความเงียบนี้ ข้ารู้สึกว่าหัวใจของข้าเริ่มหมุนวนและในใจของข้ามีสุนทรพจน์ปรากฏขึ้นมาอย่างสมบูรณ์ เติบโตจากเสียงกระซิบเป็นเสียงตะโกน ต้องการแบ่งปันอย่างยิ่ง! สุนทรพจน์เกี่ยวกับความชอบธรรมของข้าในฐานะ [ROOT.Char.GetTitleAsNameNoTooltip|U]"
 feast_default.5020.a: "ข้ามีปัญญาของ [ROOT.Char.GetFaith.TricksterGodName]!"
 feast_default.5020.a.success: "สุนทรพจน์ของท่านปลุกเร้าแขก"
 feast_default.5020.a.failure: "สุนทรพจน์ของท่านแทบไม่ได้สร้างแรงบันดาลใจ"
 feast_default.5020.b: "[ROOT.Char.GetFaith.KnowledgeGodName|U] กระทำการผ่านข้า!"
 feast_default.5020.c: "ข้ามีหัวใจและท้องของ [ROOT.Char.GetFaith.WarGodName]!"
 feast_default.5020.d: "ทำไมต้อง ทำให้ความเงียบ เช่นนี้มัวหมอง?"

# Knock off an equal's Eboshi hat
feast_default.3008.t: "ยิ่งหมวกสูง..."
feast_default.3008.desc: "ในช่วงที่งานเลี้ยงเงียบสงบลงชั่วขณะ สายตาของข้าก็จับจ้องไปที่แสงวาบที่เต้นระยับบน [Glossary('เอโบชิ', 'EBOSHI_GLOSS')] เคลือบเงาสีดำของ [hat_man.GetFirstNamePossessive]. มันมิใช่วิถีของโลกหรือ, ที่แสงสว่างควรจะค้นหาและส่องไปยัง [hat_man.GetHerHim] ให้โดดเด่นเหนือพวกเราที่เหลือ?\n\nผู้คนจะคิด เช่นไรหากจู่ๆ [hat_man.GetSheHe] สูญเสียเอบิชิของ [hat_man.GetHerHis] ไป? [hat_man.GetSheHe] จะยังส่องสว่างได้เพียงใดกัน?! [hat_man.GetSheHe|U] จะสูญสิ้นความเป็นตัวตน! เป็นเพียงเด็ก. หรืออาจจะต่ำกว่ามนุษย์ด้วยซ้ำ"
feast_default.3008.a: "หมวกนั่นต้องหายไป!"
feast_default.3008.b: "มันไม่สมควรที่จะเก็บงำความริษยา เช่นนี้"
feast_default.3008.c: "ขอให้แสงสว่างนั้นบดบัง [hat_man.GetHerHim] จากเล่ห์อุบายของข้า"
feast_default.3008.c.tt: "[scheme|E] ของท่านได้รับ [GetModifier('didnt_knock_hat_off_modifier').GetNameWithTooltip]"
feast_default.3008.c.flavor: "ชื่อของ [hat_man.GetHerHis|U] จะต้องถูก ทำให้มัวหมอง!"
EBOSHI_GLOSS: "หมวกทรงสูงเคลือบเงา, ทำจากกระดาษแข็ง. มอบให้แก่ขุนนางเมื่อถึงวัยและเป็นสัญลักษณ์ของสถานะ, ความเป็นชาย และความเป็นตัวตน. หมวกนี้ใช้เพื่อปกป้อง 'โมโตโดริ' หรือมวยผมด้านบน และรักษาความสะอาด (และด้วยเหตุนี้จึงบริสุทธิ์)"

feast_default.3009.t: "...ยิ่งตกต่ำลงไป"
feast_default.3009.desc: "ข้าจู่โจมราวกับอสรพิษที่ขดตัว! เอบิชิของ [hat_man.GetFirstNamePossessive] ไถลไปกับพื้น. [hat_man.GetSheHe|U] พยายามที่จะปกปิดความอับอายของ [hat_man.GetHerHis], แต่ [Glossary('โมโทโดริ', 'MOTODORI_GLOSS')] ที่ไม่เป็นทรงของ [hat_man.GetHerHis] ก็ปรากฏให้ทุกคนเห็น, เผยให้เห็นความละเลยทางจิตวิญญาณของเขา. เมื่อภาพลวงตาแห่งความยิ่งใหญ่ของ [hat_man.GetHerHis] ถูกดับลง, ผู้อื่นอาจก้าวเข้ามาสู่แสงสว่างแทน?"
feast_default.3009.a: "ให้ช่วงเวลาอันรุ่งโรจน์ของข้าเริ่มต้นขึ้น!"
MOTODORI_GLOSS: "รูปแบบของมวยผมที่สวมในสมัยเฮอัง. ไม่เหมือนกับรูปแบบในยุคหลัง เช่น 'ชงมาเกะ', ไม่มีการโกนผมด้านบนของศีรษะ"

feast_default.3010.t: "หมวกของข้า!"
feast_default.3010.desc: "มีช่วงที่งานเลี้ยงเงียบสงบลง. ชั่วขณะหนึ่ง, ราวกับว่าเวลาเดินช้าลง, ความกังวลของโลกและความกดดันในปัจจุบันได้จางหายไป.\n\nแล้วราวกับอสรพิษจากเงามืด มือของ [hat_knocker.GetName] ก็ฟาดเข้าที่ [Glossary('เอโบชิ', 'EBOSHI_GLOSS')] ของข้า. ข้ามองดูอย่างไม่เชื่อสายตาขณะที่มันไถลไปกับพื้น. ข้าพยายามที่จะปกปิดความอับอาย, แต่ [Glossary('โมโทโดริ', 'MOTODORI_GLOSS')] ที่ไม่เป็นทรงของข้าก็ปรากฏให้ทุกคนเห็น, เผยให้เห็นความละเลยทางจิตวิญญาณของข้า"
feast_default.3010.a: "[hat_knocker.GetSheHe|U] จะต้องเสียใจที่ทำ เช่นนี้!"
feast_default.3010.a.flavor: "ข้าจะแสดงให้ [hat_knocker.GetHerHim|U] เห็นว่าการเป็นอสรพิษมันเป็นอย่างไร!"
feast_default.3010.a.tt: "[scheme|E] ของท่านได้รับ [GetModifier('scheme_apa_positive_2101_modifier').GetNameWithTooltip]"
feast_default.3010.b: "ท่านคงจะดื่มมากเกินไป [hat_knocker.GetFirstNameNoTooltip]"
feast_default.3010.b.flavor: "ความสงบของข้าจะยังคงอยู่"
 feast_default.6410.segway.close: ""[guest.Custom2('RelationToMe', ROOT.Char )|U], "
 feast_default.6410.segway: ""[ROOT.Char.GetTitledFirstName], "
 feast_default.6400.t: "A Badge with a View"
 feast_default.6400.desc: "I peer out across the festivities, when I feel a tug at my wrist: "Oh! Let me see!" my [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('guest'))], [guest.GetTitledFirstName], leans in to inspect me further.\n\n[guest.GetSheHe|U] hums and nods: "That [admired_badge.GetName]... it's #EMP marvelous#!."\n\nA dreamy look enters [guest.GetFirstNamePossessiveNoTooltip] gaze: "[badge_holy_site.GetName] is a grand sight, isn't it.""
 feast_default.6400.a: ""Isn't it, though?""
 feast_default.6400.b: ""You should come along next time!""
 feast_default.6405.t: "A Collection of Sorts"
 feast_default.6405.desc: "I can't help but notice my [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('guest'))], [guest.GetTitledFirstName], ogling me despite trying to be discrete. Rather, ogling the lining of pilgrim badges on my garment.\n\nThe small charms catch the light and twinkle enticingly: "Such a lovely collection of badges," [guest.GetFirstNameNoTooltip] says, as more people stop to admire them.\n\n"I wish I had the time to collect those...""
 feast_default.6405.a: ""I know, right?""
 feast_default.6405.a.tt: "Gain [prestige_i] #V [THIS.Char.MakeScope.ScriptValue('num_badge_collection_prestige_single')]#! per @badge_icon! Badge [artifact|E] #weak (Currently [prestige_i] #V [THIS.Char.MakeScope.ScriptValue('num_badge_collection_prestige_payout')]#!)"
 feast_default.6405.b: ""Would you take care of the [gifting_badge.GetNameNoTooltip] for me?""
 feast_default.6410.t: "Want to Trade?"
 feast_default.6410.desc: "My [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('guest'))], [guest.GetTitledFirstName], gingerly approaches me:"
 feast_default.6410.desc.outro: "I have been admiring your [my_badge.GetName] for a while now, and was wondering if you per chance would like to make a trade..."\n\n[guest.GetSheHe|U] coyly pulls out [guest.GetHerHis] [their_badge.GetName], slowly moving it about to catch the light in all its splendor.\n\n"What do you say?" [guest.GetFirstNameNoTooltip] smiles and nods at me."
 feast_default.6410.a: ""That seems fair!""
 feast_default.6410.b: ""Hmm I would rather not.""
