 petition_liege_county_convert_modifier:0 "ผู้เผยแผ่ศาสนาที่ได้รับการสนับสนุน"
 petition_liege_county_convert_modifier_desc:0 "ผู้ถือครองเคาน์ตีนี้ได้ร้องขอให้เจ้าเหนือหัวสนับสนุนการเปลี่ยนศาสนาเป็นศรัทธาที่แท้จริง"
