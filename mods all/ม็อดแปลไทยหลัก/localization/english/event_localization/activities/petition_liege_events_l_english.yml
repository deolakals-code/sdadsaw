 petition_liege_county_control_modifier:0 "เจ้าพนักงานหลวง"
 petition_liege_county_control_modifier_desc:0 "ผู้ถือครองเคาน์ตีนี้ได้ร้องขอความช่วยเหลือจากเจ้าพนักงานของเจ้าเหนือหัวในการฟื้นฟูระเบียบ"
