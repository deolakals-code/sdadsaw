 petition_liege.0309.t:0 "ข้อเสนอโต้กลับถูกปฏิเสธ"

 # Skill check counter event
 petition_liege.0401.t:0 "$petition_liege_header$ ความเห็นที่สอง"
 petition_liege.0401.desc.intro:2 "[petition_liege.GetTitledFirstName] คิดอยู่ครู่หนึ่ง จากนั้นก็ร้องว่า "[first_portrait.GetFirstName] ข้าต้องการคำปรึกษาของท่านในเรื่องนี้!" [first_portrait.Custom('GetNotableCharacteristic')] [first_portrait.Custom('GetPetitionLiegeTitle')] ก้าวไปข้างหน้าอย่างกระตือรือร้น กำ[first_portrait.Custom('councillor_flavor_prop')]ของ[first_portrait.GetHerHis]ไว้ "ใช่ เรื่องที่ละเอียดอ่อนยิ่งนัก นายท่าน/นายหญิง[petition_liege.GetLadyLord]ของข้าพเจ้า..."\n\n"
 petition_liege.0401.desc.second:0 "[second_portrait.GetTitledFirstName] [second_portrait.Custom('GetPetitionLiegeTitle')] ของ[petition_liege.GetTitleAsNamePossessiveNoTooltip] เฝ้าดูอย่างเงียบๆ จากข้างสนาม"
 petition_liege.0401.desc.second_diplomacy:0 "$petition_liege.0401.desc.second$—บางทีข้าอาจจะขอความเห็นใจจากธรรมชาติทางการทูตของ[second_portrait.GetHerHis]?\n\n"
 petition_liege.0401.desc.second_martial:0 "$petition_liege.0401.desc.second$—ข้อโต้แย้งเชิงปฏิบัติอาจได้รับการสนับสนุนจาก[second_portrait.GetHerHis]?\n\n"
 petition_liege.0401.desc.second_stewardship:0 "$petition_liege.0401.desc.second$—ตัวเลขที่ถูกต้องจะโน้มน้าว[second_portrait.GetHerHim]ถึงความต้องการของข้าพเจ้า?\n\n"
 petition_liege.0401.desc.second_intrigue:0 "$petition_liege.0401.desc.second$—หากข้าจะเอาชนะ[second_portrait.GetHerHim]ในที่สาธารณะ?\n\n"
 petition_liege.0401.desc.second_learning:1 "$petition_liege.0401.desc.second$—ไม่มีใครสามารถตั้งคำถามกับข้อโต้แย้งที่ #EMP [second_portrait.GetHerHim]#! ไม่ได้โต้แย้งได้\n\n"
 petition_liege.0401.desc.third_soulmate:0 "อีกครั้งหนึ่ง [third_portrait.GetTitledFirstName] ที่รักของข้าพเจ้าก็อยู่ไม่ไกล"
 petition_liege.0401.desc.third_lover:0 "[third_portrait.GetTitledFirstName] ขยิบตาให้ข้าพเจ้าอย่างสุขุม"
 petition_liege.0401.desc.third_best_friend:0 "คนสนิทที่สุดของข้าพเจ้า [third_portrait.GetTitledFirstName] อยู่ที่นี่"
 petition_liege.0401.desc.third_friend:0 "ถึง แม้ว่า... เพื่อนที่ดีของข้าพเจ้า [third_portrait.GetTitledFirstName] อาจมีอิทธิพลอยู่บ้าง"
 petition_liege.0401.desc.third_fallback:0 "อย่างไรก็ตาม [third_portrait.GetTitledFirstName] ชอบข้าพเจ้าเสมอมา"
 petition_liege.0401.desc.third:1 "—บางที[third_portrait.GetSheHe]อาจจะช่วยแก้ต่างให้ข้าพเจ้า? \n\n"
 petition_liege.0401.desc.outro:0 "[petition_liege.GetTitleAsNameNoTooltip] หันกลับมาหาข้าพเจ้า ความสนใจของ[petition_liege.GetHerHis]กำลังเคลื่อนไปที่อื่นแล้ว ข้าพเจ้าต้อง #EMP ทำ#! อะไรบางอย่าง!"
 petition_liege.0401.first:0 "ข้ารู้ว่าจะ ทำให้ [first_portrait.GetFirstNameNoTooltip] สะดุดได้อย่างไร..."
 petition_liege.0401.second:0 ""[second_portrait.GetFirstNameNoTooltip]!""
 petition_liege.0401.second_diplomacy:0 "$petition_liege.0401.second$ แน่นอนว่ามีช่องว่างสำหรับการประนีประนอมที่นี่?""
 petition_liege.0401.second_martial:0 "$petition_liege.0401.second$ แน่นอนว่า #EMP ท่าน#! เห็นประเด็นของข้าพเจ้า?"
 petition_liege.0401.second_stewardship:0 "$petition_liege.0401.second$ ตรรกะที่นี่ต้องชัดเจนสำหรับ #EMP ท่าน#!?""
 petition_liege.0401.second_intrigue:0 "$petition_liege.0401.second$ แน่นอนว่า #EMP ท่าน#! เห็นเหตุผล?""
 petition_liege.0401.second_learning:0 "$petition_liege.0401.second$ #EMP ท่าน#! ต้องเห็นปัญญาที่นี่?""
 petition_liege.0401.wildcard:0 "[third_portrait.GetTitledFirstNameNoTooltip] จะบอกพวกเขา!"
 petition_liege.0401.success:0 "[petition_liege.GetTitledFirstNameNoTooltip] เปลี่ยนใจ"
 petition_liege.0401.failure:0 "[petition_liege.GetTitledFirstNameNoTooltip] ไม่เชื่อ"
 # Second party request event
 petition_liege.0501.opening:0 "[second_party.Custom2('AppropriateGreeting', ROOT.Char )]"
 petition_liege.0501.desc:0 "[second_party.GetTitledFirstName] ผู้ภักดี เป็นเรื่องน่าเสียใจอย่างยิ่งที่ต้อง ทำให้ท่านตกอยู่ในสถานการณ์ เช่นนี้ \n\nข้าพเจ้าต้องขอให้ท่านสละ[petition_claim.GetName]เพื่อประโยชน์ของ [petition_vassal.GetTitledFirstName] ซึ่งอ้างสิทธิ์ในบรรดาศักดิ์ เช่นกัน ข้าพเจ้าเชื่อว่าท่านจะเคารพความปรารถนาของข้าพเจ้าในเรื่องนี้"
 petition_liege.0501.a:0 "ข้าพเจ้ามีทางเลือกอะไร...?"
 petition_liege.0501.b:0 "ข้าพเจ้าไม่สามารถยอมรับสิ่งนี้ได้!"
 petition_liege.0501.refuse_tt:0 "[second_party.GetTitledFirstName] ปฏิเสธที่จะสละ[petition_claim.GetName]"
 # Invalidated event
 petition_liege.0601.t:0 "$petition_liege_header$ เป็นโมฆะ"
 petition_liege.0601.desc.court:0 "เมื่อพิธีราชาภิเษกของข้าพเจ้าในฐานะ[ROOT.Char.GetTitleAsNameNoTooltip]เสร็จสิ้น คำร้องของข้าพเจ้าก็ไม่จำเป็นอีกต่อไป..."
 petition_liege.0601.desc.imprisoned_me:0 "$petition_liege.0601_shared_intro$ [ROOT.Char.GetImprisonedBy.GetTitledFirstName] โยนข้าพเจ้าเข้าคุก"
 petition_liege.0601.desc.imprisoned:0 "$petition_liege.0601_shared_intro$ ข้าพเจ้าถูกจับโดย [ROOT.Char.GetImprisonedBy.GetTitledFirstName]"
 petition_liege.0601.desc.liege_dead_me:0 "$petition_liege.0601_shared_intro$ ข้าพเจ้าลงเอยด้วยการสังหาร [petition_liege.GetTitledFirstName]... \n\n"
 petition_liege.0601.desc.liege_dead:0 "$petition_liege.0601_shared_intro$ [petition_liege.GetTitledFirstName] [petition_liege.GetDeathReasonHideKiller]... \n\n"
 petition_liege.0601.desc.liege_imprisoned_me:0 "$petition_liege.0601_shared_intro$ ข้าพเจ้าลงเอยด้วยการจับกุม [petition_liege.GetTitledFirstName]!"
 petition_liege.0601.desc.liege_imprisoned:0 "$petition_liege.0601_shared_intro$ [petition_liege.GetTitledFirstName] ถูกจับกุมโดย [petition_liege.GetImprisonedBy.GetTitledFirstName]"
 petition_liege.0601.desc.new_liege:0 "คำขอของข้าพเจ้าตอนนี้จะต้องส่งไปยังเจ้าเหนือหัวคนใหม่ของข้าพเจ้า [ROOT.Char.GetLiege.GetTitledFirstNameRegnal]"
 petition_liege.0601_shared_intro:0 "ขณะที่คำร้องของข้าพเจ้าได้เริ่มดำเนินการและกำลังจะเกิดผล"
 petition_liege.0601.desc:0 "\n\nสิ่งนี้เปลี่ยนแปลงสถานการณ์อย่างแน่นอน"
 petition_liege.0601.a_court:0 "ก้าวต่อไป สู่สิ่งที่ยิ่งใหญ่กว่า"
 petition_liege.0601.a_prison:0 "ให้ตายเถอะ"
 petition_liege.0601.a_liege:0 "ทำไมข้าควรจะ..."
 petition_liege.0601.a:0 "ถึงเวลาคิดใหม่..."
 # Activity End
 petition_liege.9999.t:0 "$petition_liege_header$ บทสรุป"
 petition_liege.9999.desc:0 "ขณะที่ผู้ยื่นคำร้องคนสุดท้ายจากไป ข้าราชบริพารต่างๆ ก็ตามพวกเขาออกจากห้องไป โดยมีธุระต้องไปทำที่อื่น คนอื่นๆ ยังคงอยู่ พูดคุยกันเองเกี่ยวกับกระบวนการล่าสุด\n\nในไม่ช้า ความเป็นทางการของพิธีการก็หายไปโดยสิ้นเชิง โดยมีเสียงฮัมและความวุ่นวายของชีวิตในราชสำนักตามปกติเข้ามาแทนที่"
 petition_liege.9999.a:0 "ธุระของข้าที่นี่เสร็จแล้ว"
 petition_liege.9999.arrogant:0 "เป็นการดีที่จะให้ข้ารับใช้ของข้าได้ชื่นชมในความน่าเกรงขามของข้า"
 petition_liege.9999.shy:0 "ข้าแทบรอไม่ไหวที่จะกลับไปที่ห้องของข้า..."
 petition_liege.9999.gregarious:0 "นี่ดูเหมือนจะเป็นโอกาสที่ดีที่จะคลุกคลีกับราชสำนักของข้า"
 petition_liege.9999.every_guest_and_courtier:0 "แขกและข้าราชบริพารทุกคน:"

 petition_liege.9001.t:0 "$petition_liege_header$ การเปลี่ยนกลยุทธ์"
 petition_liege.9001.desc:0 "ข้าพเจ้าไม่สามารถยื่นคำร้องต่อ [petition_liege.GetTitledFirstName] เพื่อ [ROOT.Char.Custom( 'GetPetitionType' )|l] ได้อีกต่อไป อย่างไรก็ตาม ข้าพเจ้าได้เดินทางมาถึง [petition_liege.GetCapitalLocation.GetName] เพื่อเข้าเฝ้า[petition_liege.GetHerHis] และข้าพเจ้าจะไม่พลาดโอกาส เช่นนี้ ข้าพเจ้าสามารถขอให้[petition_liege.GetSheHe]..."
 petition_liege.9001.gold: "$petition_liege_gold$."
 petition_liege.9001.council_seat:0 "แต่งตั้งข้าพเจ้าเข้าสภาของพวกเขา"
 petition_liege.9001.council_seat_family: "$petition_liege_council_seat_family$."
 petition_liege.9001.court_position: "$petition_liege_court_position$."
 petition_liege.9001.court_position_family: "$petition_liege_court_position_family$."
 petition_liege.9001.governorship_family: "$petition_liege_governorship_family$."
 petition_liege.9001.house_governorship_rights: "$petition_liege_house_governorship_rights$."
 petition_liege.9001.pay_debt:0 "ชำระหนี้สินของข้าพเจ้า"
 petition_liege.9001.war_aid:0 "ให้ความช่วยเหลือในสงคราม"
 petition_liege.9001.vassal_war:0 "บังคับใช้สันติภาพกับเพื่อนข้าหลวงของข้าพเจ้า"
 petition_liege.9001.faction_war:0 "ยุบกลุ่มอิทธิพลที่ทรงอำนาจ"
 petition_liege.9001.county_control:0 "ส่งเจ้าพนักงานไปช่วยฟื้นฟูการควบคุมเคาน์ตีที่ไม่เชื่อฟัง"
 petition_liege.9001.county_convert:0 "สนับสนุนนักบวชเพื่อช่วยเปลี่ยนศาสนาในเคาน์ตีในอาณาจักรของข้าพเจ้า"
 petition_liege.9001.county_opinion:0 "เสด็จเยือนเพื่อเพิ่มความเห็นของประชาชนในอาณาจักรของข้าพเจ้า"
 petition_liege.9001.fortify_border:0 "สร้างป้อมปราการชายแดนของข้าพเจ้า"
 petition_liege.9001.title_liege:0 "มอบการอ้างสิทธิ์หนึ่งของข้าพเจ้า"
 petition_liege.9001.title_vassal:0 "โอนการอ้างสิทธิ์"
 petition_liege.9001.construct_city:0 "สนับสนุนเงินทุนสร้างเมืองใหม่ในอาณาจักรของข้าพเจ้า"
 petition_liege.9001.construct_temple:0 "สนับสนุนเงินทุนสร้างวัดใหม่ในอาณาจักรของข้าพเจ้า"
 petition_liege.9001.development:0 "ตั้งถิ่นฐานใหม่ให้แก่ข้ารับใช้บางส่วนของพวกเขาในอาณาจักรของข้าพเจ้า"
 petition_liege.9001.house_fief: "การสถาปนาวิถีการปกครองใหม่ไม่เป็นอาชญากรรมอีกต่อไป"
 petition_liege.9001.fallback:0 "เพียงแค่เติมคลังของข้าพเจ้าให้เต็ม"
 petition_liege.0101.accept.fallback:0 "ตกลง คลังของท่านจะถูกเติมให้เต็ม"

