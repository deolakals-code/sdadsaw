 # Non Royal Liege
 ## Activity Start: Liege decides whether or not to hear petition
 petition_liege.0001.a.tt_non_royal: "ท่านต้อนรับ [petition_vassal.GetTitledFirstName] ใน [royal_court|E] ของ [liege|E] ของท่าน"
 ## Desc
 petition_liege.0101.desc_non_royal: "ในที่สุด [petition_vassal.GetTitledFirstName] ก็ถูกนำตัวเข้ามาในห้องโถงใหญ่ของ [liege_possessive|E] และมิทันรอช้าก็เดินตรงมายังบัลลังก์แล้วโค้งคำนับอย่างลึกซึ้ง \n\n\"ขอบพระคุณที่โปรดให้ข้าเข้าเฝ้า [petition_liege.GetTitledFirstNamePossessive] วันนี้ข้ามาหาท่านพร้อมด้วยคำร้องขออันเร่งด่วน —"
 petition_liege.0101.desc.title_liege_non_royal: "ด้วยความเคารพ [petition_liege.GetTitleAsNameNoTooltip] ของข้า [petition_claim.GetName] นั้นเป็นของข้าโดยชอบธรรม!" \n\n"ท่านปกครอง [petition_liege.GetPrimaryTitle.GetTierAsNameNoTooltip] อันยิ่งใหญ่ [petition_liege.GetLadyLord] ของข้า ท่านมิอาจมอบ [petition_claim.GetTierAsNameNoTooltip] เพียงหนึ่งเดียวที่ข้าอ้างสิทธิ์อย่างจริงจังนี้ให้แก่ข้าได้หรือ?""
 petition_liege.0201.a_non_royal: "ขอบพระคุณ [petition_liege.GetLadyLord] ของข้า!"

 petition_liege.0221.a: "ข้าซาบซึ้งในพระคุณชั่วนิรันดร์ ท่าน [petition_liege.GetTitleAsNameNoTooltip] ผู้ยิ่งใหญ่!"
 ## Liege asks for something in return
 petition_liege_skillcheck_counter_tt_non_royal: "พยายามโน้มน้าว [petition_liege.GetHerHim] ด้วยวิธีอื่น"
 # Ceremonial Liege
 petition_liege.0021.opening: "ขอคารวะ ท่าน [petition_liege.GetTitleAsNameNoTooltip] ผู้ประเสริฐ,"
 petition_liege.0021.desc.no_travel: "ข้าจักเป็นเกียรติอย่างยิ่งหากโปรดให้ข้าเข้าเฝ้า และรับฟังการนำเสนออันถ่อมตนและจริงจังของข้าในเรื่องอันสำคัญยิ่งต่อใจข้า\n\nข้าจะรอคอยการเรียกตัวจากวังอย่างอดทน สุด แต่ฝ่าบาทจะสะดวกโดยเร็วที่สุด"
 petition_liege.0029.opening: "ขอถวายความเคารพอย่างสูงสุด ท่าน [petition_liege.GetTitleAsNameNoTooltip] ผู้ยิ่งใหญ่,"
 petition_liege.0121.t.regent: "การรับรองตำแหน่ง"
 petition_liege.0121.t.appointment: "ความก้าวหน้าของตระกูล"
 petition_liege.0121.t.wedding: "การสมรสหลวง"
 petition_liege.0121.t.privilege: "การยอมรับในเกียรติศักดิ์"
 petition_liege.0121.desc: "ในที่สุด [petition_vassal.GetTitledFirstName] ก็ถูกนำตัวเข้ามาในห้องโถงใหญ่ของข้า และมิทันรอช้าก็เดินตรงมายังบัลลังก์ของข้าแล้วโค้งคำนับอย่างลึกซึ้ง \n\n\"ขอบพระคุณที่โปรดให้ข้าเข้าเฝ้า ท่าน [petition_liege.GetTitleAsNameNoTooltip] ผู้ยิ่งใหญ่ วันนี้ข้ามาหาท่านเพื่อหารือเรื่องสำคัญ —"
 petition_liege.0121.desc.regent: "คำถามที่ว่าผู้ใดจักเป็นผู้สืบทอดของ [petition_vassal.GetTopLiege.GetTitledFirstNamePossessive] ในฐานะผู้ดูแลอาณาจักรของท่านยังคงต้องหาข้อสรุป\"\n\n\"ข้าหวังว่าท่านจะเห็นด้วยว่า หากข้าจะขอเสนอตัวอย่างถ่อมตนเพื่อรับเกียรตินี้ ข้าจะรับใช้บัลลังก์ได้ดีที่สุด\""
 petition_liege.0121.desc.appointment: "ตระกูลของข้า เช่นเดียวกับตระกูลขุนนางชั้นสูงจำนวนมากใน [ROOT.Char.GetTopLiege.GetPrimaryTitle.GetBaseNameNoTierNoTooltip] แสวงหาเกียรติยศในการรับใช้บัลลังก์ ทำหน้าที่เป็นผู้ปกครองและข้าราชการ\"\n\n\"พวกเราได้พิสูจน์ตนเองแล้วว่าเป็นผู้รับใช้ที่ภักดีและเชี่ยวชาญของอาณาจักร และจักยินดียิ่งหากได้รับการสนับสนุนจากท่านในการคัดเลือกเจ้าหน้าที่\""
 petition_liege.0121.desc.wedding: "มีเพียงตระกูลที่สูงศักดิ์ที่สุดเท่านั้นที่จะหวังทัดเทียมเศษเสี้ยวแห่งพระเกียรติยศของราชวงศ์ท่านได้\"\n\n\"ด้วยความถ่อมตนอย่างที่สุด ข้าขอนับตระกูลของข้าเป็นหนึ่งในนั้น และขอรับการสนับสนุนจากท่านสำหรับการสมรสหลวง\""
 petition_liege.0121.desc.privilege: "ตระกูลที่วิวาทกันมากมายในอาณาจักรต่างหลงลืมความสง่างามและเกียรติศักดิ์ที่ผู้ที่อยู่ในตำแหน่งของตนเคยรู้จักรดี เหลือเพียงไม่กี่ตระกูลเท่านั้นที่ยังคงรักษาคุณสมบัติที่แท้จริงไว้ได้ ซึ่งข้านับตระกูลของข้าอยู่ในกลุ่มนั้นด้วย\"\n\"ด้วยความถ่อมตนอย่างที่สุด ข้าหวังว่าฝ่าบาทจะทรงตระหนักถึงคุณค่าของเรา ในฐานะหนึ่งในตระกูลที่สำคัญที่สุดของอาณาจักร\""
 petition_liege.0121.accept.regent: "ข้าหวังมานานแล้วว่าเจ้าจะก้าวขึ้นมารับผิดชอบหน้าที่นี้"
 petition_liege.0121.accept.appointment: "มีเพียงไม่กี่ตระกูลที่รับใช้อย่างขยันขันแข็งหรือภักดี เช่นนี้"
 petition_liege.0121.accept.wedding: "เจ้าได้พิสูจน์สถานะของตระกูลเจ้าแล้ว"
 petition_liege.0121.accept.privilege: "ชื่อเสียงของตระกูลเจ้านั้นเป็นที่ประจักษ์โดยไร้ข้อกังขา"
 petition_liege.0121.bribe_gold: "บัลลังก์ย่อมเมตตาต่อผู้ที่เมตตาต่อบัลลังก์"
 petition_liege.0121.bribe_bloc: "บัลลังก์ย่อมให้รางวัลแก่ผู้ที่พิสูจน์การสนับสนุนของตน"
 petition_liege.0121.bribe_favor: "พระคุณของบัลลังก์มิควรถูกลืมเลือนในเร็ววัน"
 petition_liege.0121.bribe_vows: "พระคุณของบัลลังก์มีไว้สำหรับผู้ที่พิสูจน์ความศรัทธาของตน"
 petition_liege.0121.bribe_knight: "พระคุณของบัลลังก์มีไว้สำหรับผู้รับใช้ที่ภักดีที่สุด"
 petition_liege.0121.refusal: "คำร้องขอนี้อยู่ต่ำกว่าเกียรติศักดิ์ของราชบัลลังก์"

 petition_liege.0221.desc.regent: "\n\nข้าทูลขอการสนับสนุนจาก [petition_liege.GetHerHis] อย่างถ่อมตนสำหรับการเสนอตัวเข้ารับตำแหน่งสูงสุด โดยแจกแจงความสำเร็จก่อนหน้าและตัวอย่างความภักดีอันแน่วแน่ของข้า"
 petition_liege.0221.desc.appointment: "\n\nข้าวิงวอน [petition_liege.GetLadyLord] ของข้าให้ตระหนักถึงคุณสมบัติของข้าในฐานะผู้รับใช้ และสนับสนุนความก้าวหน้าของข้าในการรับใช้ [petition_liege.GetHerHis] และอาณาจักร"
 petition_liege.0221.desc.wedding: "\n\nข้าแสดงความปิติยินดีที่ตระกูลของข้าจะได้รับหากได้เกี่ยวดองกับราชวงศ์ โดยชี้แจงถึงเกียรติศักดิ์ของสายเลือดตระกูล [ROOT.Char.GetHouse.GetNameNoTooltip] และความเหมาะสมของเหล่าสตรีและบุรุษของเรา"
 petition_liege.0221.desc.privilege: "ข้ากระตุ้นให้ [petition_liege.GetTitleAsNameNoTooltip] ยินยอมอย่างเป็นทางการต่อการยอมรับในสายเลือดอันสูงส่งของตระกูลข้าในหมู่ชนชั้นสูงแห่ง [ROOT.Char.GetTopLiege.GetPrimaryTitle.GetBaseNameNoTierNoTooltip]"
 
 petition_liege.0225.b: "ข้าเกรงว่านี่เป็นไปไม่ได้"

 petition_liege.0229.counter: "ฝ่าบาท ได้โปรด เพียงครู่เดียว!"

 petition_liege.0221.desc.bridge: "\n\nหลังจากฟังคำกล่าวจบ [petition_liege.GetSheHe] รอสักครู่ ก่อนที่ [petition_liege.GetSheHe] จะยิ้มอย่างอบอุ่นและตรัสว่า \"เจ้าให้เหตุผลอย่างชาญฉลาด! ดีมาก ข้าจะสั่งการให้จัดการเรื่องนี้ทันที\""
 petition_liege.9021.regent: "รับรองการเสนอตัวของข้าสำหรับตำแหน่งสูงสุด"
 petition_liege.9021.appointment: "สนับสนุนหน้าที่การงานของตระกูลข้า"
 petition_liege.9021.wedding: "ยินยอมให้มีการสมรสหลวง"
 petition_liege.9021.privilege: "ยอมรับในเกียรติศักดิ์ของตระกูลข้า"
 petition_ceremonial_liege_skillcheck_counter_tt: "พยายามโน้มน้าว [petition_liege.GetTitleAsNameNoTooltip] ด้วยวิธีอื่น"
