l_english: 
 # General Loc Strings
 petition_liege_header:0 "คำร้อง:"

 # Activity Start: Liege decides whether or not to hear petition
 petition_liege.0001.opening:1 "[petition_vassal.Custom2('AppropriateGreetingPositive', ROOT.Char )]"
 petition_liege.0001.desc:1 "คณะผู้ติดตามของข้าพเจ้าและตัวข้าพเจ้าเพิ่งเดินทางมาถึง [petition_liege.GetCapitalLocation.GetTitle.GetNameNoTierNoTooltip] หลังจากการเดินทางอันเหน็ดเหนื่อยเพื่อเข้าเฝ้าท่าน\n\nข้าพเจ้าใคร่ขอเข้าเฝ้าตาม แต่ท่านจะสะดวกโดยเร็วที่สุด"
 petition_liege.0001.a:1 "ไปตาม [petition_vassal.GetTitledFirstNameNoTooltip] และนำ[petition_vassal.GetHerHim]มาหาข้า!"
 petition_liege.0001.a.tt:1 "ท่านรับ [petition_vassal.GetTitledFirstName] ใน [royal_court|E] ของท่าน"
 petition_liege.0001.b:1 "ข้ายุ่งเกินกว่าจะจัดการกับ[petition_vassal.GetHerHim]ในตอนนี้"
 petition_liege.0001.b.arrogant:1 "ชิ ข้าไม่มีเวลามาต้อนรับแค่ #EMP [petition_vassal.GetTitleAsNameNoTooltip]#!!"
 petition_liege.0001.b.humble:1 "ส่งความเสียใจอย่างสุดซึ้งของข้าพเจ้าไปให้ [petition_vassal.GetTitledFirstNameNoTooltip] ว่าข้าไม่สามารถพบ[petition_vassal.GetHerHim]ได้"
 petition_liege.0001.b.tt:1 "ท่านส่ง [petition_vassal.GetTitledFirstName] กลับไป"

# Activity End: Vassal learns that liege refuses to hear petition
 petition_liege.0009.opening:2 "[petition_liege.Custom2('AppropriateGreeting', ROOT.Char )]"
 petition_liege.0009.desc:0 "น่าเสียดายที่ท่านมาถึงในช่วงเวลาที่ยากลำบาก และข้าพเจ้าต้องแจ้งให้ท่านทราบว่าข้าพเจ้าไม่สามารถต้อนรับท่านและคณะของท่านในท้องพระโรงของข้าพเจ้าได้"
 petition_liege.0009.a:1 "ปฏิเสธแม้กระทั่งจะ #EMP รับฟัง#! ข้าหรือ? ช่างกล้านักนะ [petition_liege.GetWomanMan] ผู้นั้น!"

# Liege hears petition, makes a decision
# Title
 petition_liege.0101.t.gold: "$petition_liege_header$ ทองคำ"
 petition_liege.0101.t.council_seat:0 "$petition_liege_header$ การ แต่งตั้งในสภา"
 petition_liege.0101.t.pay_debt:0 "$petition_liege_header$ ชำระหนี้สิน"
 petition_liege.0101.t.war_aid:0 "$petition_liege_header$ ความช่วยเหลือทางทหาร"
 petition_liege.0101.t.end_war:0 "$petition_liege_header$ ยุติสงครามข้าหลวง"
 petition_liege.0101.t.faction_war:0 "$petition_liege_header$ ยุบกลุ่มอิทธิพล"
 petition_liege.0101.t.county_control:0 "$petition_liege_header$ คำร้องขอเจ้าพนักงาน"
 petition_liege.0101.t.county_convert:0 "$petition_liege_header$ สนับสนุนนักบวช"
 petition_liege.0101.t.county_opinion:1 "$petition_liege_header$ การเสด็จเยือน"
 petition_liege.0101.t.fortify_border:0 "$petition_liege_header$ สร้างป้อมปราการชายแดน"
 petition_liege.0101.t.title_liege:0 "$petition_liege_header$ ผู้อ้างสิทธิ์ในบรรดาศักดิ์"
 petition_liege.0101.t.title_vassal:0 "$petition_liege_header$ ผู้อ้างสิทธิ์ในบรรดาศักดิ์ข้าหลวง"
 petition_liege.0101.t.construct_city:0 "$petition_liege_header$ การพัฒนาเมือง"
 petition_liege.0101.t.construct_temple:0 "$petition_liege_header$ สนับสนุน[petition_vassal.GetFaith.HouseOfWorship|U]"
 petition_liege.0101.t.development:0 "$petition_liege_header$ พัฒนาเมืองหลวง"
 petition_liege.0101.t.house_fief: "$petition_liege_header$ $japan_feudal_government$ ที่ดินศักดินา"
 # Desc
 petition_liege.0101.desc:1 "[petition_vassal.GetTitledFirstName] ได้รับการนำเข้ามาในห้องโถงใหญ่ของข้าพเจ้าในที่สุด และไม่เสียเวลาเดินเข้ามายังบัลลังก์ของข้าพเจ้าและโค้งคำนับอย่างลึกซึ้ง \n\n"ขอบพระทัย/ขอบพระคุณที่ทรงให้เข้าเฝ้า เจ้าเหนือหัวของข้าพเจ้า วันนี้ข้าพเจ้ามาหาท่านพร้อมคำร้องเร่งด่วน —"
 petition_liege.0101.desc.council_seat:0 "โปรดเถิด นายท่าน/นายหญิง[petition_liege.GetLadyLord]ของข้าพเจ้า ให้ข้าพเจ้านั่งในสภาของท่าน"\n\n"ความสามารถของข้าพเจ้าถูกมองข้าม ในขณะที่[petition_vassal.GetWomenMen]ที่ด้อยกว่ากลับได้รับการรับฟังในระดับสูงสุด ข้าพเจ้าอยากจะแบ่งเบาภาระของอาณาจักรในฐานะ[petition_vassal.Custom('GetCouncilPositionRequest')]ของท่าน""
 petition_liege.0101.desc.gold: "ข้าพเจ้าสงสัยว่าท่านพอจะแบ่งปันทองคำให้แก่ข้ารับใช้ผู้ภักดีได้หรือไม่ ด้วยการรับใช้และความภักดีของข้าพเจ้าตั้งแต่นี้ไป" \n\n"ข้าพเจ้ารับรองว่ามันจะถูกใช้เพื่อส่งเสริมผลประโยชน์ของอาณาจักร""
 petition_liege.0101.desc.pay_debt:0 "ข้าพเจ้าประสบปัญหา... ทางการเงินบางประการ เนื่องจากเหตุการณ์ที่อยู่เหนือการควบคุมของข้าพเจ้าโดยสิ้นเชิง" \n\n"เพื่อประโยชน์ของอาณาจักร ท่านจะช่วยข้าพเจ้าจัดการบัญชีของข้าพเจ้าได้หรือไม่?""
 petition_liege.0101.desc.war_aid:0 "[petition_war.GetName] ดำเนินไปอย่างไม่ราบรื่น [second_party.GetTitledFirstNameNoTooltip] กำลังได้เปรียบ \n\nนายท่าน/นายหญิง[petition_liege.GetLadyLord]ของข้าพเจ้า ความพ่ายแพ้ของข้าพเจ้าก็คือของท่าน เช่นกัน โปรดให้การสนับสนุนข้าพเจ้า เพื่อประโยชน์ของอาณาจักร"
 petition_liege.0101.desc.end_war:1 "[second_party.GetTitledFirstNameNoTooltip] กำลังทำสงครามกับข้าพเจ้าและข้ารับใช้ที่ดีและภักดีของท่านใน [petition_vassal.GetPrimaryTitle.GetName]!" \n\n"แน่นอนว่าการสู้รบภายในนี้มี แต่จะ ทำให้เราทุกคนอ่อนแอลง และควรหยุดยั้งเสียมิใช่หรือ?""
 petition_liege.0101.desc.faction_war:0 "ข้าพเจ้าถูกรุมล้อมโดย [second_party.GetTitledFirstName] และ [vassal_faction.GetNameNoTooltip|l] ของ[second_party.GetHerHis]! \n\n"โปรดเถิด ท่านต้องสั่งสอนเจ้าพวกไร้มารยาทเหล่านั้นให้อยู่ในที่ในทางของพวกมัน เพื่อประโยชน์ของอาณาจักร!""
 petition_liege.0101.desc.county_control:0 "[petition_county_example.GetNameNoTooltip] ถูกรุมล้อมโดยผู้เห็นต่าง ซึ่ง ทำให้การเก็บภาษีเป็นไปไม่ได้!" \n\n"โปรดเถิด นายท่าน/นายหญิง[petition_liege.GetLadyLord]ของข้าพเจ้า ช่วยข้าพเจ้าปราบอสรพิษเหล่านี้ให้อยู่หมัด เพื่อประโยชน์ของอาณาจักร""
 petition_liege.0101.desc.county_convert:0 "[petition_county_example.GetNameNoTooltip] ถูกรุมล้อมโดยพวก[petition_county_example.GetCountyData.GetFaith.GetAdherentNamePluralNoTooltip]ที่ชั่วร้ายและไร้พระเจ้า!" \n\n"นักบวชของข้าพเจ้าทำดีที่สุดแล้ว แต่ข้าพเจ้าเกรงว่าพวกเขาต้องการความช่วยเหลือหากอาณาจักรจะปราศจากความชั่วร้าย""
 petition_liege.0101.desc.county_opinion:0 "ความไม่พอใจแพร่ระบาดในดินแดนของข้าพเจ้า"\n\n"นายท่าน/นายหญิง[petition_liege.GetLadyLord]ของข้าพเจ้า ข้าพเจ้ามั่นใจว่าการเสด็จเยือนของ[petition_liege.Custom('GetRoyalCourtRank')]จะเปลี่ยนอารมณ์ของผู้คน และนำพวกเขากลับสู่เส้นทางที่เหมาะสม"
 petition_liege.0101.desc.fortify_border:0 "ดินแดนของข้าพเจ้าตั้งอยู่ระหว่าง [petition_liege.GetPrimaryTitle.GetNameNoTierNoTooltip] และศัตรูของท่าน!" \n\n"[petition_county_example.GetNameNoTooltip] เป็นหนึ่งในเขตชายแดนของอาณาจักร และการป้องกันก็เป็นความรับผิดชอบของท่าน เช่นเดียวกับของข้าพเจ้า""
 petition_liege.0101.desc.title_liege:0 "ด้วยความเคารพ ฝ่าบาท [petition_claim.GetName] เป็นของข้าพเจ้าโดยชอบธรรม!" \n\n"ท่านปกครอง[petition_liege.GetPrimaryTitle.GetTierAsNameNoTooltip]อันยิ่งใหญ่ นายท่าน/นายหญิง[petition_liege.GetLadyLord]ของข้าพเจ้า ท่านไม่สามารถประทานเพียง[petition_claim.GetTierAsNameNoTooltip]เดียวแก่ข้าพเจ้า ซึ่งอ้างสิทธิ์อย่างจริงจังได้หรือ?""
 petition_liege.0101.desc.title_vassal:0 "[petition_claim.GetName] ของ [second_party.GetTitledFirstNamePossessive] เป็นของข้าพเจ้าโดยชอบธรรม!" \n\n"นายท่าน/นายหญิง[petition_liege.GetLadyLord]ของข้าพเจ้า ท่านควรเข้าใจว่าการอ้างสิทธิ์มีความสำคัญต่อดินแดนที่เราถือครองเพียงใด โปรดให้[second_party.GetTitleAsNameNoTooltip]สละสิ่งที่ไม่ได้เป็นของ[second_party.GetHerHim]""
 petition_liege.0101.desc.construct_city:0 "[petition_construct_county.GetName] มีศักยภาพสูง แต่ขาดโครงสร้างพื้นฐานที่จำเป็น" \n\n"นายท่าน/นายหญิง[petition_liege.GetLadyLord]ของข้าพเจ้า การสนับสนุนเมืองใหม่ใน [petition_construct.GetName] จะเป็นประโยชน์ต่ออาณาจักรทั้งหมดเพียงแค่ผลกระทบต่อการค้าเท่านั้น""
 petition_liege.0101.desc.construct_temple:0 "ผู้ศรัทธาแห่ง[petition_construct_county.GetNamePossessiveNoTooltip]ต้องการสถานที่สักการะ" \n\n"ข้าพเจ้าจะรู้สึกเป็นเกียรติอย่างยิ่งหากท่านช่วยสนับสนุนเงินทุนสำหรับ[petition_liege.GetFaith.HouseOfWorship]แห่งใหม่ใน [petition_construct.GetName] เพื่อศรัทธา[petition_liege.GetFaith.GetAdjectiveNoTooltip]""
 petition_liege.0101.desc.development:0 "ดินแดนของข้าพเจ้าเทียบไม่ได้กับเมืองหลวงอันยิ่งใหญ่ของท่าน" \n\n"โปรดเถิด แบ่งปันโชคลาภบางส่วนของ[petition_liege.GetCapitalLocation.GetCounty.GetTitle.GetNameNoTierPossessive]ให้กับ[petition_county_example.GetName]อันต่ำต้อย และเพื่อประโยชน์ของอาณาจักรโดยรวม""
 petition_liege.0101.desc.house_fief: "โปรดมอบสิทธิ์ในการสืบทอดมรดกและโอกาสในการปกครองที่ดินศักดินาของข้าเองแก่ข้า เพื่อที่อาณาจักรโดยรวมจักได้เจริญรุ่งเรือง""
 petition_liege.0101.desc.council_first_councillor:0 "\n\nเช่นนั้น [petition_vassal.GetSheHe] คิดว่า [petition_vassal.GetSheHe] สามารถทำงานได้ดีกว่า [second_party.GetTitledFirstName]..."
 petition_liege.0101.desc.council_second_councillor:0 "บางทีข้าควรจะแทนที่ [second_councillor.GetTitledFirstName] แทน"
 # Accept
 petition_liege.0101.accept.gold: "ข้าพอจะแบ่งเหรียญกษาปณ์ให้ได้บ้าง"
 petition_liege.0101.accept.council_seat:0 "ตกลง ท่านจะได้ตำแหน่งของท่าน"
 petition_liege.0101.accept.council_seat_occupied:0 "ท่านจะแทนที่ [second_party.GetTitledFirstNameNoTooltip] ในฐานะ[second_party.GetCouncilTitle]ของข้า"
 petition_liege.0101.accept.pay_debt:0 "ตกลง หนี้สินของท่านได้รับการชำระแล้ว"
 petition_liege.0101.accept.war_aid:0 "ข้าพอจะแบ่งทหารให้ได้บ้าง"
 petition_liege.0101.accept:0 "ข้าเห็นประเด็นของท่าน ตกลง ข้าจะบังคับให้ยุติสงครามของท่าน"
 petition_liege.0101.accept.faction_war:0 "คนทรยศเหล่านี้จะต้องตอบคำถามต่อข้า"
 petition_liege.0101.accept.county_control:0 "ระเบียบจะได้รับการฟื้นฟู"
 petition_liege.0101.accept.county_convert:0 "ลูกหลานของ[ROOT.Char.GetFaith.DevilNamePossessive]ต้องถูกขับไล่ออกไป"
 petition_liege.0101.accept.county_opinion:0 "มวลชนจะได้เห็น[petition_liege.GetTitleAsNameNoTooltip]ของพวกเขา"
 petition_liege.0101.accept.fortify_border:0 "ชายแดนของท่านคือชายแดนของข้า"
 petition_liege.0101.accept.title_liege:0 "ตกลง [petition_claim.GetTierAsNameNoTooltip|l] เป็นของท่าน"
 petition_liege.0101.accept.title_vassal:0 "ข้าจะสนับสนุนการอ้างสิทธิ์ของท่าน"
 petition_liege.0101.accept.construct_city:0 "ทำไมจะไม่ได้ล่ะ? [petition_construct_county.GetDeJureLiege.GetNameNoTierNoTooltip] น่าจะมีเมืองใหม่ได้"
 petition_liege.0101.accept.construct_temple:0 "[petition_construct_county.GetNameNoTierNoTooltip] ขาด[petition_liege.GetFaith.BishopNeuter]มานานเกินไปแล้ว"
 petition_liege.0101.accept.development:0 "ใช่ [petition_liege.GetCapitalLocation.GetNameNoTooltip] ยุ่งเกินไปแล้ว"
 petition_liege.0101.accept.house_fief: "วิถีการปกครองของเจ้าจะไม่ถูกนับว่าเป็นอาชญากรรมอีกต่อไป"
 # Bribe gold
 petition_liege.0101.bribe_gold.council_seat:0 "คนวงในของข้าต้องพิสูจน์ตัวเองว่ามีฐานะทางการเงินที่มั่นคง..."
 petition_liege.0101.bribe_gold.war_aid:0 "มีการฝึกฝน ยุทโธปกรณ์ และไม่มีอะไรถูกเลย"
 petition_liege.0101.bribe_gold:0 "ข้าสามารถจัดการสันติภาพได้ แต่ท่านจะต้องจ่ายค่า #EMP ชดเชย#! บางอย่าง..."
 petition_liege.0101.bribe_gold.faction_war:0 "สันติภาพก็มีราคาของมัน"
 petition_liege.0101.bribe_gold.county_control:0 "งานนี้หนักและแพง"
 petition_liege.0101.bribe_gold.county_convert:0 "[ROOT.Char.GetFaith.WealthGodName] แสดงให้เราเห็นว่างาน เช่นนี้ไม่ใช่ไม่มีค่าใช้จ่าย"
 petition_liege.0101.bribe_gold.county_opinion:0 "การเยือนเหล่านี้มีค่าใช้จ่ายมากมาย"
 petition_liege.0101.bribe_gold.fortify_border:0 "มาเถิด ท่านก็รู้ว่ามาตรการ เช่นนี้มีราคาแพง"
 petition_liege.0101.bribe_gold.title_liege:0 "การอ้างสิทธิ์ของท่านมีค่าต่อท่านเท่าใด?"
 petition_liege.0101.bribe_gold.title_vassal:0 "มันมีค่าต่อท่านเท่าใด [petition_vassal.GetFirstNameNoTooltip]?"
 petition_liege.0101.bribe_gold.construct_city:0 "ท่านคงรู้ดีว่าสิ่งเหล่านี้มีราคาแพงเพียงใด..."
 petition_liege.0101.bribe_gold.construct_temple:0 "แน่นอนว่าท่านจะสนับสนุนส่วนต่อเติม?"
 petition_liege.0101.bribe_gold.development:0 "แน่นอน แต่จำเป็นต้องมีการชดเชยเล็กน้อย"
 petition_liege.0101.bribe_gold.house_fief: "ต่อเมื่อเจ้ายินดีจ่ายค่าตอบแทน"
 # Bribe favor
 petition_liege.0101.bribe_favor.council_seat:0 "การแสดงความโปรดปราน เช่นนี้ต้องได้รับการตอบแทน"
 petition_liege.0101.bribe_favor.pay_debt:0 "ข้าจะเรียกหาท่านในวันหนึ่ง เพื่อตอบแทนข้า"
