# Liege grants petition
 petition_liege.0201.t:0 "$petition_liege_header$ ได้รับการยอมรับ"
 petition_liege.0201.desc.intro:0 "ข้าพเจ้าได้รับการนำเข้าไปในห้องพระโรงของ[petition_liege.GetTitledFirstNamePossessive] ที่ ซึ่ง[petition_liege.GetSheHe]กวักมือเรียกให้ข้าพเจ้าเข้าใกล้และกล่าวกับ[petition_liege.GetHerHim]"
 petition_liege.0201.desc.council_seat:0 "\n\nข้าพเจ้าอธิบายความสามารถ ทั้งที่พิสูจน์แล้วและยังไม่ได้พิสูจน์ ซึ่ง ทำให้ข้าพเจ้าเป็นผู้สมัครที่เหมาะสมที่จะเป็น[petition_vassal.Custom('GetCouncilPositionRequest')]ของ[petition_liege.GetTitleAsNamePossessiveNoTooltip] โดยขอตำแหน่งในฐานะที่ปรึกษาของ[petition_liege.GetHerHis]"
 petition_liege.0201.desc.war_aid:0 "\n\nข้าพเจ้าวิงวอนนายท่าน/นายหญิง[petition_liege.GetLadyLord]ของข้าพเจ้าให้ยืมกำลังของพวกเขาเพื่ออุดมการณ์อันชอบธรรมของข้าพเจ้า ไม่ว่าจะด้วยวิธีใดก็ตามที่[petition_liege.GetSheHe]สามารถทำได้ เกรงว่าข้าหลวงผู้ภักดีของอาณาจักรจะพ่ายแพ้"
 petition_liege.0201.desc.pay_debt:0 "\n\nข้าพเจ้าวิงวอน[petition_liege.GetTitleAsNameNoTooltip]ให้เข้าใจถึงความท้าทายอันยิ่งใหญ่ที่ดินแดนศักดินาของข้าพเจ้าเผชิญ และ ซึ่ง ทำให้คลังของข้าพเจ้าว่างเปล่า วิงวอน[petition_liege.GetHerHim]ให้ชำระหนี้สินของข้าพเจ้า..."
 petition_liege.0201.desc.vassal_war:0 "\n\nข้าพเจ้าอธิบายสาเหตุและเหตุการณ์ของความขัดแย้งที่ดำเนินอยู่ของข้าพเจ้ากับ [second_party.GetTitledFirstName] และขอให้[petition_liege.GetTitleAsNameNoTooltip]บังคับใช้สันติภาพเพื่อยุติการนองเลือดภายในอาณาจักรของ[petition_liege.GetHerHis]"
 petition_liege.0201.desc.faction_war:0 "\n\nข้าพเจ้าสรุปเหตุการณ์ที่นำไปสู่การทรยศอย่างเปิดเผยของ [second_party.GetTitledFirstName] และ [vassal_faction.GetName|l] ของ[second_party.GetHerHis] และขอให้[petition_liege.GetTitleAsNameNoTooltip]บังคับให้พวกเขายอมจำนน"
 petition_liege.0201.desc.county_control:0 "\n\nข้าพเจ้าอธิบายปัญหาที่ดินแดนศักดินาของข้าพเจ้าเผชิญอย่างรอบคอบ การต่อต้านอำนาจของข้าพเจ้าและการถูกรุมล้อมโดยคนจรจัด และขอความช่วยเหลือในการฟื้นฟูระเบียบ"
 petition_liege.0201.desc.county_convert:0 "\n\nข้าพเจ้าอธิบายสถานการณ์ในดินแดนศักดินาของข้าพเจ้าอย่างกระตือรือร้น และความจำเป็นในการสนับสนุนเพื่อนำแสงสว่างแห่ง[petition_liege.GetFaith.GetNameNoTooltip]มาสู่ฝูงชนคนบาป"
 petition_liege.0201.desc.county_opinion:0 "\n\nข้าพเจ้าอธิบายความไม่พอใจในอาณาจักรของข้าพเจ้า และความกระปรี้กระเปร่าอันยิ่งใหญ่ที่การเสด็จเยือนอย่างเรียบง่ายจาก[petition_liege.GetTitleAsNameNoTooltip]จะมอบให้กับจิตวิญญาณของสามัญชน"
 petition_liege.0201.desc.fortify_border:0 "\n\nข้าพเจ้าสรุปภัยคุกคามที่เกิดจากเพื่อนบ้านของอาณาจักรอย่างเยือกเย็น โดยดึงความสนใจไปที่ [second_party.GetPrimaryTitle.GetName] และความเสี่ยงที่เกิดขึ้นกับดินแดนของข้าพเจ้า"
 petition_liege.0201.desc.title_liege:0 "\n\nข้าพเจ้าขอยืนยันการอ้างสิทธิ์อันชอบธรรมของข้าพเจ้าต่อ[petition_claim.GetName]ของ[petition_liege.GetHerHis]ด้วยความเคารพ โดยมอบเอกสารขนาดยาวที่ยืนยันสิทธิ์นั้น และรอคำตอบของ[petition_liege.GetTitleAsNamePossessiveNoTooltip]"
 petition_liege.0201.desc.title_vassal:0 "\n\nข้าพเจ้าแสดงหลักฐานการอ้างสิทธิ์ของข้าพเจ้าต่อ[petition_claim.GetName]อย่างคล่องแคล่ว และเน้นย้ำถึงความแข็งแกร่งของการอ้างสิทธิ์นั้นเหนือกว่าของ [second_party.GetTitledFirstName]"
 petition_liege.0201.desc.construct_city:0 "\n\nข้าพเจ้าเสนอข้อโต้แย้งของข้าพเจ้าสำหรับการพัฒนาการตั้งถิ่นฐานของ [petition_construct.GetName] ใน [petition_construct_county.GetName] โดยระบุผลประโยชน์ตามที่ได้ซักซ้อมไว้"
 petition_liege.0201.desc.construct_temple:0 "\n\nข้าพเจ้าขอนำเสนอกรณีสำหรับ[petition_liege.GetFaith.HouseOfWorship]แห่งใหม่ใน [petition_construct_county.GetName] อย่างถ่อมตน ซึ่งจะสร้างขึ้นที่การตั้งถิ่นฐานของ [petition_construct.GetName]"
 petition_liege.0201.desc.development:0 "\n\nข้าพเจ้าอธิบายสถานการณ์ที่แตกต่างกันของ [petition_county_example.GetName] และ [petition_liege.GetCapitalLocation.GetCounty.GetTitle.GetNameNoTier] อย่างรอบคอบ และสิ่งที่สามารถทำได้เพื่อแก้ไขความสมดุล"
 petition_liege.0201.desc.house_fief: "\n\nข้าชี้แจงเหตุผลของข้าว่า การมอบสิทธิ์ในการสืบทอดมรดกแก่ข้าจักเป็นประโยชน์ต่อภูมิภาค"
 petition_liege.0201.desc.bridge:1 "\n\nหลังจากฟังคำกล่าวของข้า [petition_liege.GetSheHe] ก็พยักหน้าสั้นๆ และตรัสว่า \"ข้าจะส่งคนของข้าไปทันทีเพื่อจัดการเรื่องนี้\""
 petition_liege.0201.desc.council_second_party:0 "ข้าพเจ้าคงทำได้ไม่แย่ไปกว่า [second_party.GetFullName] แน่..."
 petition_liege.0201.a:0 "ขอบพระทัย/ขอบพระคุณ เจ้าเหนือหัวของข้าพเจ้า!"
 petition_liege_accept_tt:0 "คำร้องของท่านได้รับการยอมรับแล้ว"

