 petition_liege.0205.t:0 "$petition_liege_header$ ข้อเสนอโต้กลับ"
 petition_liege.0205.desc.intro:0 "$petition_liege.0201.desc.intro$"
 petition_liege.0205.desc.bridge:2 "\n\nหลังจากฟังคำปราศรัยแล้ว [petition_liege.GetSheHe] นั่งเงียบอยู่ครู่หนึ่งขณะที่[petition_liege.GetSheHe]ครุ่นคิดถึงคำร้องของข้าพเจ้า \n\nในที่สุด [petition_liege.GetSheHe] ก็กล่าวกับข้าพเจ้าว่า "ท่านให้เหตุผลที่ดีบางประการ แต่หากข้าจะตกลงตามคำขอของท่าน ข้าจะต้องได้บางสิ่งเป็นการตอบแทน แน่นอนว่าท่านเห็นว่ามันจะเป็นประโยชน์ต่อเราทั้งคู่หากเราบรรลุข้อตกลง?""
 petition_liege.0205.counter:0 "นายท่าน/นายหญิง[petition_liege.GetTitleAsNameNoTooltip]ของข้าพเจ้า บางทีข้าพเจ้าอาจอธิบายได้ไม่ดีพอ..."
 petition_liege.0205.a:0 "ข้อเสนอที่ยุติธรรม — ข้ายอมรับ"
 petition_liege.0205.b:0 "ท่านล้อเล่นหรือ? ข้าถูกผลักดันจนถึงขีดสุดอยู่แล้ว!"
 petition_liege_skillcheck_counter_tt:0 "พยายามโน้มน้าวเจ้าเหนือหัวของท่านด้วยวิธีอื่น"

# Liege refuses petition (end)
 petition_liege.0209.t:0 "$petition_liege_header$ ถูกปฏิเสธ"
 petition_liege.0209.desc.intro:0 "$petition_liege.0201.desc.intro$"
 petition_liege.0209.desc.bridge:0 "\n\nหลังจากฟังคำปราศรัยแล้ว [petition_liege.GetSheHe] ขมวดคิ้วและปฏิเสธข้าพเจ้า"
 petition_liege.0209.desc.bridge.apologetic:1 "$petition_liege.0209.desc.bridge$ "ข้าขออภัย แต่เพื่อประโยชน์ของ [petition_liege.GetPrimaryTitle.GetNameNoTierNoTooltip] ข้าต้องปฏิเสธคำขอของท่าน""
 petition_liege.0209.desc.bridge.unapologetic:1 "$petition_liege.0209.desc.bridge$ "#EMP นี่#! คือเรื่องเร่งด่วนที่ท่านต้องการหารือกับข้าหรือ? ไม่ ไม่เด็ดขาด ตอนนี้หากท่านจะขอตัว ข้ามีเรื่อง #EMP สำคัญ#! ที่ต้องจัดการจริงๆ""
 petition_liege.0209.desc.bridge.favor:0 "$petition_liege.0209.desc.bridge$ "ข้าเสียใจจริงๆ แต่ข้าจะไม่สามารถอนุมัติคำขอนี้ได้ หากข้าทำได้ ข้าจะให้สิ่งที่ท่านต้องการ แต่โปรดให้คำมั่นสัญญาถึงบุญคุณในอนาคตนี้เพียงพอ""
 petition_liege.0209.counter:0 "เดี๋ยวก่อน นายท่าน/นายหญิง[petition_liege.GetLadyLord]ของข้าพเจ้า! ฟังข้าก่อน!"
 petition_liege.0209.a:0 "อนิจจา"
 petition_liege.0209.favor:0 "ตกลง"

