 #Your capital is now Mecca and you don't have the Hajjaj trait
 hajj.0011.t:0 "ภายในกำแพงอันสุกใส"
 hajj.0011.desc:0 "เนื่องจากเมืองหลวงใหม่ของข้าบัดนี้คือดินแดนอันรุ่งโรจน์แห่ง [ROOT.Char.GetCapitalLocation.GetTitle.GetNameNoTierNoTooltip] ข้าจึงได้ฉวยโอกาสประกอบพิธีกรรมเพื่อรับพรแห่งฮัจญ์"
 hajj.0011.a:0 "ข้ารู้สึกใกล้ชิดกับ [ROOT.Char.GetFaith.HighGodName] มากขึ้นแล้ว"
 hajj.0011.a_cynical:0 "มันเป็นสิ่งที่ต้องทำ"
 #Promise your Hajjaj relative to go on the Hajj
 hajj.0500.t:0 "กำแพงอันสุกใส"
 hajj.0500.desc:0 ""#EMP กำแพงอันสุกใส กำแพงอันสุกใส... #!," [hajj_dying_relative.GetTitledFirstName] พึมพำขณะที่ข้าเข้าสู่ [ROOT.Char.Custom('GetChamber')] ของ[hajj_dying_relative.GetHerHis] การหายใจของ[hajj_dying_relative.GetHerHis|U] นั้นลำบาก ประหนึ่งอากาศพยายามหลีกเลี่ยงที่จะลงไปสู่ปอดที่เป็นโรคของ[hajj_dying_relative.GetWomanMan] ผู้เคยยิ่งใหญ่\n\nข้ากระแอมคราหนึ่ง และดวงตาพร่ามัวของ[hajj_dying_relative.GetFirstNamePossessiveNoTooltip] พยายามเพ่งมองมาที่ข้า: "[ROOT.Char.GetFirstNameNoTooltip]? ... นั่นเจ้าหรือ?" [hajj_dying_relative.GetSheHe] กระซิบ จากนั้นสายตาของ[hajj_dying_relative.GetHerHis] ก็แจ่มชัดขึ้นชั่วขณะ: "กำแพงอันสุกใส มักกะฮ์"\n\n"เจ้าต้องไปประกอบพิธีฮัจญ์นะ [hajj_dying_relative.Custom2('RelationToMe' , ROOT.Char)] เจ้า #EMP ต้อง#! ไปเห็นกำแพงอันสุกใส!" [hajj_dying_relative.GetFirstNameNoTooltip] เริ่มไอจากการออกแรงกะทันหันและครวญครางเล็กน้อย ช่างน่าสงสารนัก"
 hajj.0500.a:0 "ข้าจะ ทำให้สำเร็จ"
 hajj.0500.a.flavor:0 "คำขอสุดท้ายก็คือคำขอสุดท้าย"
 hajj.0500.a.tt_hajj:0 "[hajj|E] [pilgrimage|E] ครั้งต่อไปของท่านจะมีค่าใช้จ่ายถูกลง"
 hajj.0500.b:0 "ข้า... ไม่อาจให้สัญญาใด ๆ ได้ [ROOT.Char.Custom2('RelationToMe' , SCOPE.sC('hajj_dying_relative'))]"
 hajj.0500.b.flavor:0 "ข้าไม่อยากทำเลยจริง ๆ"

 ###Hajj Destination Events
 #Pray at the Place of Abraham
 hajj.3010.t:1 "มะกอมอิบรอฮีม"
 hajj.3010.desc:0 "เมื่อเข้าสู่มักกะฮ์แล้ว ภารกิจแรกของข้าคือการเยี่ยมชมมะกอมอิบรอฮีม หินศักดิ์สิทธิ์นี้ถือเป็นแท่นหินที่อับราฮัมใช้เมื่อสร้างกะอ์บะฮ์ พร้อมด้วยอิสมาอีล เมื่อหลายศตวรรษก่อน\n\nผู้แสวงบุญฮัจญ์รอบตัวข้าเข้าใกล้สักการสถานและก้มศีรษะลงสวดภาวนาอย่างใคร่ครวญ ข้าควรทำ เช่นเดียวกัน"
 hajj.3010.a:0 "ข้าควรสวดขอสิ่งที่สำคัญกว่านี้..."
 hajj.3010.a.wealth.t:0 "ความมั่งคั่ง"
 hajj.3010.a.wealth.desc:0 "ท่านได้รับแนวคิดเกี่ยวกับวิธีเพิ่มพูนความมั่งคั่ง"
 hajj.3010.a.opinion.t:0 "รหัสทางสังคม"
 hajj.3010.a.opinion.desc:0 "ท่านตระหนักถึงวิธีที่จะเป็นที่ชื่นชอบมากขึ้น"
 hajj.3010.a.prestige.t:0 "เกียรติภูมิ"
 hajj.3010.a.prestige.desc:0 "ท่านเข้าใจวิธีที่จะ ทำให้ตนเองมีเกียรติภูมิมากขึ้น"
 hajj.3010.a.bad.t:0 "ความงมงาย"
 hajj.3010.a.bad.desc:0 "ท่านเพิ่มพูนความงมงายของท่าน"
 hajj.3010.b:0 "จงก้มลงและใคร่ครวญเถิด"
 hajj.3010.b.flavor_cynical:0 "ทำให้มันเสร็จ ๆ ไปเสียดีกว่า"
 #Walk between Safa and Marwah
 hajj.3020.t:1 "เศาะฟาและมัรวะฮ์"
 hajj.3020.desc:0 "ภารกิจต่อไปของข้าคือการเดินเจ็ดครั้งระหว่างจุดศักดิ์สิทธิ์สองแห่งคือเศาะฟาและมัรวะฮ์ เพื่อรำลึกถึงความสิ้นหวังและความพยายามของฮาญัรในการหาน้ำให้อิสมาอีล บุตรชายของนาง\n\nอิสมาอีล ผู้ ซึ่งต่อมาได้กลายเป็นบรรพบุรุษของนบีผู้ได้รับพร\n\nขณะที่ข้าเตรียมตัวสำหรับพิธีกรรม ข้าได้ชมทิวทัศน์ของเศาะฟาและมัรวะฮ์ และสังเกตเห็นผู้แสวงบุญจำนวนมากจากทุกชนชั้นกำลังเดินทางระหว่างเนินเขาทั้งสอง"
 hajj.3020.a:0 "เหตุใดต้องพอใจแค่เจ็ดครั้ง!"
 hajj.3020.b:0 "เจ็ดรอบอย่างพิถีพิถันก็เพียงพอแล้ว"
 hajj.3020.c:0 "จะมีใครสังเกตไหมหากข้าเดินน้อยครั้งลง?"
 hajj.3020.c.success.t:0 "ความเกียจคร้านสำเร็จผล"
 hajj.3020.c.success.desc:0 "ท่านลดจำนวนรอบที่เดินได้สำเร็จ"
 hajj.3020.c.failure.desc:0 "ท่านถูกจับได้และถูกลงโทษ"
 #Safa and Marwah penalization
 hajj.3021.t:1 "ถูกจับได้!"
 hajj.3021.desc:0 "ขณะที่ข้าเริ่มเดินทางกลับจากเนินเขาทั้งสอง ผู้นำศาสนาท้องถิ่นคนหนึ่งมองมาที่ข้าด้วยใบหน้าเคร่งขรึม: "ข้า #EMP เชื่อว่า#! ท่านมิได้ประกอบพิธีกรรมเศาะฟาและมัรวะฮ์อย่างถูกต้องนะ ท่านฮัจญี"\n\n[penalizer.GetSheHe|U] กล่าวต่อ: "บทลงโทษสำหรับการกระทำ เช่นนี้คือ ดัมม์ หรือ เศาะดะเกาะฮ์ อัลฟิฏร์ หรือท่านจะเดินให้ครบตามพิธีอย่างถูกต้องก็ได้เสมอ แน่นอน" ใบหน้าของ[penalizer.GetHerHis] อ่อนลงชั่วครู่\n\n"พิธีฮัจญ์จะไม่สมบูรณ์หากท่านละเว้น แล้วท่านจะเลือกอย่างไรเล่า ท่านฮัจญี?""
 hajj.3021.a:0 "การบูชายัญสัตว์สินะ"
 hajj.3021.a.flavor:0 "ดัมม์ $hajj.3040.c.flavor$"
 hajj.3021.b:0 "ข้าจะบริจาค"
 hajj.3021.b.flavor:0 "เศาะดะเกาะฮ์ อัลฟิฏร์ การบริจาคธัญพืชและอินทผลัมแก่คนยากจนดูมีคุณค่า"
 hajj.3021.c:0 "คราวนี้ก็แค่เดินให้ครบเจ็ดรอบอย่างถูกต้องเถอะ"
 hajj.3021.c.flavor_zealous:0 "ข้า #EMP รู้#! ว่าข้าควรจะจริงจังกับมัน..."
 hajj.3021.c.flavor:0 "โอ้ ให้ตายสิ"
 #Drink water from the Zamzam well
 hajj.3030.t:1 "บ่อน้ำซัมซัม"
 hajj.3030.desc:0 "ณ ที่นี้ ข้ายืนอยู่หน้าบ่อน้ำซัมซัมอันลี้ลับ บ่อที่ถูกค้นพบผ่านความฝันถึงน้ำพุอันเป็นนิรันดร์ในทะเลทราย การดื่มน้ำจากบ่อนี้เป็นหนึ่งในพิธีกรรมโบราณของฮัจญ์ และด้วยเหตุนี้ จึงเป็นภารกิจต่อไปของข้า\n\nบ่อน้ำแห่งนี้ แม้จะผุดขึ้นจากงานหินอันประณีต แต่ก็รายล้อมไปด้วยผู้แสวงบุญฮัจญ์ทั้งซ้าย ขวา และกลาง และข้าต้องเบียดเสียดฝูงชนเพื่อเข้าไปยังน้ำศักดิ์สิทธิ์ที่แบ่งปันกันโดยคนจำนวนมาก"
 hajj.3030.a:0 "ข้าควรให้ผู้อื่นไปก่อน"
 hajj.3030.a.flavor:0 "ข้าไม่รีบร้อน"
 hajj.3030.b:0 "ดับกระหายแห่งจิตวิญญาณของข้า!"
 hajj.3030.b.flavor:0 "อร่อยเลิศ และว่ากันว่าสามารถสร้างปาฏิหาริย์ได้ด้วย!"
 hajj.3030.c:0 "บางทีข้าอาจจะแค่จุ่มมือลงไปเล็กน้อย"
 hajj.3030.c.flavor:0 "นี่มัน #EMP แทบจะ#! ไม่ถูกสุขอนามัยเลย!"
 #Sacrifice to Allah
 hajj.3040.t:1 "การบูชายัญแด่อัลลอฮ์"
 hajj.3040.desc:0 "ถึงเวลาสำหรับพิธีกรรมต่อไปแล้ว: การบูชายัญแด่ [ROOT.Char.GetFaith.HighGodName] พื้นที่พิเศษของลานพิธีได้ถูกเตรียมไว้สำหรับโอกาสนี้ และกลิ่นอับชื้นก็แรงขึ้นเมื่อข้าเข้าใกล้คอกที่จัดหาสัตว์ประเภทต่าง ๆ\n\nข้าพิจารณาทางเลือกอย่างรอบคอบ การบูชายัญสัตว์ใหญ่ เช่นอูฐย่อมเป็นการแสดงความศรัทธาที่มากกว่าอย่างแน่นอน — ในขณะที่การบูชายัญสัตว์เล็กหรือแกะก็เพียงพอแล้วสำหรับการประกอบพิธีฮัจญ์ให้สมบูรณ์\n\n ผู้แสวงบุญบางส่วนที่มุมหนึ่งดูเหมือนจะร่วมกันลงขันและแบ่งค่าใช้จ่ายสำหรับวัวตัวใหญ่ระหว่างกัน"
 hajj.3040.a:0 "อูฐหกสิบสามตัว!"
 hajj.3040.a.flavor:0 "ข้าจะไม่ด้อยไปกว่านบีผู้ยิ่งใหญ่!"
 hajj.3040.b:0 "อูฐตัวเดียวก็น่าจะเพียงพอแล้ว"
 hajj.3040.b.flavor:0 "อูฐรู้ความลับข้อหนึ่ง..."
 hajj.3040.c:0 "เลือกแกะแล้วกัน"
 hajj.3040.c.flavor:0 "ข้าไม่เคยชอบดวงตาเล็ก ๆ ของพวกมันอยู่แล้ว"
 hajj.3040.d:0 "ข้าจะร่วมบูชายัญวัวตัวนั้นด้วย"
 hajj.3040.d.flavor:0 "เหตุใดต้องดับชีวิตเกินความจำเป็น?"
 #Performing the Halq
 hajj.3001.t:2 "ฮัลก์"
 hajj.3001.desc:2 "หลังจากสวดภาวนา ณ มะกอมอิบรอฮีม เดินระหว่างเศาะฟาและมัรวะฮ์ ดื่มน้ำจากบ่อน้ำซัมซัม และบูชายัญแด่ [ROOT.Char.GetFaith.HighGodName] แล้ว บัดนี้ข้าพร้อมที่จะประกอบพิธีฮัจญ์ให้สมบูรณ์ พิธีกรรมต่อไปที่ข้าต้องทำคือการตัดผม\n\n"
 hajj.3001.desc.male_dominated:0 "ตามธรรมเนียมแล้ว ผู้ชายจะโกนผมทั้งหมด แต่บางครั้งก็มีการอนุโลมให้ตัดเพียงบางส่วน และผู้หญิงถูกจำกัดให้ตัดเพียงปอยผม"
 hajj.3001.desc.female_dominated:0 "ตามธรรมเนียมแล้ว ผู้หญิงจะโกนผมทั้งหมด แต่บางครั้งก็มีการอนุโลมให้ตัดเพียงบางส่วน และผู้ชายถูกจำกัดให้ตัดเพียงปอยผม"
 hajj.3001.desc.equal:0 "ตามธรรมเนียมแล้ว จะโกนผมทั้งหมด แต่บางครั้งก็มีการอนุโลมให้ตัดเพียงบางส่วน"
 hajj.3001.a:0 "โกนให้หมด!"
 hajj.3001.b:0 "ตัดเพียงปอยผม"
