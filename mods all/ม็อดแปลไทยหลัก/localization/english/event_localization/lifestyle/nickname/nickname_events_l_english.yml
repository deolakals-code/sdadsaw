l_english: 
 lifestyle_nicknames.0001.t:0 "ธรรมเนียมการตั้งชื่อ"
 lifestyle_nicknames.0001.desc:0 "หลังจากใช้เวลานับไม่ถ้วนตรวจดูบัญชี รวบรวมตัวเลข และจัดการ [ROOT.Char.Custom('GetCourt')] ความพิถีพิถันของข้าก็บังเกิดผลในที่สุด ข้าได้ ทำให้ [ROOT.Char.Custom('GetRealmOrDomicile')|l] ของข้าเจริญรุ่งเรืองยิ่งกว่าครั้งใดๆ!\n\n[ROOT.Char.GetTitleAsNameNoTooltip|l] ผู้มีความสามารถทุกคน เช่นข้า [ROOT.Char.GetFullName] สมควรเป็นที่รู้จักจากความสำเร็จของตน\n\nบัดนี้ ข้าควรเรียกตนเองว่ากระไรดี?"
 lifestyle_nicknames.0001.a:0 "ข้าต้องการเป็นที่รู้จักด้านการบริหาร!"
 lifestyle_nicknames.0001.b:0 "ข้าจะเป็นที่จดจำในด้านความยุติธรรม!"
 lifestyle_nicknames.0001.c:0 "ผู้คนจะรู้จักข้าผ่านกฎหมายของข้า!"
 lifestyle_nicknames.0001.d:0 "คิดดูอีกที ช่างมันเถิด"
 lifestyle_nicknames.0001.tt:0 "ท่านตัดสินใจให้การกระทำของท่าน — แทนที่จะเป็น [epithet|E] — เป็นเครื่องพิสูจน์"
 
 lifestyle_nicknames.0002.desc:0 ""ขอให้เป็นไปตามพระประสงค์ [ROOT.Char.Custom('GetCourtOwner')] ของข้า!" [SelectLocalization(IsLandlessAdventurer(ROOT.Char),'lifestyle_nicknames_second',SelectLocalization(IsNomad(ROOT.Char),'lifestyle_nicknames_kurultai','lifestyle_nicknames_steward'))] ของข้าร้องออกมาขณะที่ [my_steward.GetSheHe] ออกจาก [ROOT.Char.Custom('GetChamberPlural')] ของข้า\n\nข้าลุกขึ้นจากเก้าอี้และเดินออกไปที่ [SelectLocalization(IsLandlessAdventurer(ROOT.Char),'lifestyle_nicknames.0002.laamp',SelectLocalization(IsNomad(ROOT.Char),'lifestyle_nicknames.0002.laamp','lifestyle_nicknames.0002.landed'))] ข้าต้องการให้พวกเขาจดจำข้าด้วยสิ่งใด?"
 lifestyle_nicknames.0002.landed: "เฉลียง เบื้องล่างข้าเห็นผู้คนนับพัน ทั้งหมดล้วนถูกนำมาสู่ความเจริญรุ่งเรืองภายใต้การปกครองของข้า"
 lifestyle_nicknames.0002.laamp: "ศูนย์กลางค่าย รอบตัวข้าเห็นผู้คนนับร้อย ทั้งหมดล้วนถูกนำมาสู่ความเจริญรุ่งเรืองภายใต้ธงชัยของข้า"
 lifestyle_nicknames.0002.a:0 "ข้าปรารถนาจะเป็นที่จดจำในด้านความเอื้อเฟื้อเผื่อแผ่"
 lifestyle_nicknames.0002.b:0 "ข้าหวังว่าพวกเขาจะรู้จักข้าด้วยความเมตตากรุณา"
 lifestyle_nicknames.0002.c:0 "ขอให้สักวันหนึ่งพวกเขาหวนรำลึกถึง #EMP ความวิจิตรแห่งการปกครองของข้า#!"
 lifestyle_nicknames.0002.d:0 "คิดดูอีกที ช่างมันเถิด"
 lifestyle_nicknames.0002.tt:0 "บางทีอาณาจักรที่รุ่งเรืองอาจเป็นรางวัลในตัวเอง ยิ่งกว่า [nickname|E] อันหรูหรา"
 
 lifestyle_nicknames.0003.t:0 "วาจาคือเงิน"
 lifestyle_nicknames.0003.desc:0 "เวลาทั้งหมดที่ทุ่มเทให้กับความพยายามทางการทูตได้บังเกิดผลแล้ว พวกเขากล่าวว่าความเงียบคือทองคำ แต่ข้าพบว่าความสามารถในการสื่อสาร โต้แย้ง และโน้มน้าวใจนั้น มีค่ามากกว่าทองคำเสียอีก\n\nผู้ปกครองที่ได้รับความเคารพทุกคนล้วนเป็นที่รู้จักด้วยนามรองสำหรับความสำเร็จของพวกเขา แล้วข้าควรจะเป็นที่จดจำ เช่นไร?"
 lifestyle_nicknames.0003.a:0 "ข้ารู้แล้ว! "ผู้ยิ่งใหญ่" เป็นอย่างไรเล่า?"
 lifestyle_nicknames.0003.b:0 "[ROOT.Char.GetFullName] ผู้มีใจกว้าง!"
 lifestyle_nicknames.0003.c:0 "ผู้สร้างสันติ ชื่อนี้ฟังดูดีทีเดียว!"
 lifestyle_nicknames.0003.d:0 "คิดดูอีกที ช่างมันเถิด"
 lifestyle_nicknames.0003.tt:0 "[cognomen|E] ควรได้มาด้วยความสามารถ ไม่ใช่การหยิบฉวย"
 
 lifestyle_nicknames.0004.desc:0 "การทำงานหนักทั้งหมดเพื่อขัดเกลาศิลปะการปกครองของข้าได้ ทำให้ความสัมพันธ์ภายในและภายนอกอยู่ในสถานะอันยอดเยี่ยม ชาวบ้านโบกมือให้คณะผู้ติดตามของข้าอย่างยินดีตามท้องถนน และข้ารู้จักชื่อข้าราชบริพารส่วนใหญ่ของข้า\n\nข้าคิดว่าข้าได้สร้างชื่อให้ตนเองแล้ว แต่ชื่อนั้นอาจเป็นอะไรได้บ้าง?"
 lifestyle_nicknames.0004.a:0 "ข้าปฏิบัติต่อทุกคนอย่างยุติธรรม โดยไม่คำนึงถึงตำแหน่งของพวกเขา ดังนั้น..."
 lifestyle_nicknames.0004.b:0 "ข้าหวังว่าข้าจะเป็นที่ชื่นชมในความเมตตาของข้า"
 lifestyle_nicknames.0004.c:0 "ทุกคนบอกข้าว่าข้าเป็นคนที่น่าพูดคุยด้วยทีเดียว"
 lifestyle_nicknames.0004.d:0 "คิดดูอีกที ช่างมันเถิด"
 lifestyle_nicknames.0004.tt:0 "การกระทำของผู้ปกครองควรดังกว่า [epithet|E] ของพวกเขา"
 
 lifestyle_nicknames.0005.t:0 "ดาบแห่งเหตุผล"
 lifestyle_nicknames.0005.desc:0 "เย็นวันหนึ่งอันเงียบสงบ หลังจาก [ROOT.Char.Custom('GetCourtierPlural')] ทั้งหมดรีบเร่งออกจาก [SelectLocalization(IsLandlessAdventurer(ROOT.Char),'room_command_tent','room_throne_room')] ข้าก็นั่งลงครุ่นคิดอยู่ครู่หนึ่ง\n\n"ผู้ปกครองผู้ยิ่งใหญ่ทั้งหลายในโลกล้วนมีนามอันยิ่งใหญ่ แล้วใยข้าจะไม่มีเล่า? นับ แต่นี้ไป ตลอดทุกยุคสมัยที่จะตามมา ข้าจะเป็นที่รู้จักในนาม [ROOT.Char.GetTitledFirstName]..."
 lifestyle_nicknames.0005.a:0 "...$nick_the_conqueror$!"
 lifestyle_nicknames.0005.b:0 "...$nick_haardraade$!"
 lifestyle_nicknames.0005.c:0 "...$nick_the_noble$!"
 lifestyle_nicknames.0005.d:0 "..."
 lifestyle_nicknames.0005.tt:0 "ท่านเอนหลัง: กลยุทธ์ของท่าน ดาบของท่าน จะสลักเสลา [cognomen|E] อันคู่ควรในที่สุด"
 
 lifestyle_nicknames.0006.desc:0 "ข้ามองดูแผนการรบที่วางอยู่ตรงหน้าและหยิบทหารไม้ตัวหนึ่งขึ้นมา ตอนเด็ก ๆ ข้าเล่นกับพวกมันในห้องของข้า และตอนนี้ข้าใช้ของเล่นชิ้นเดียวกันนั้นในการทำสงคราม\n\n"[ROOT.Char.GetTitledFirstName]?" — [SelectLocalization(IsLandlessAdventurer(ROOT.Char),'lifestyle_nicknames_second',SelectLocalization(IsNomad(ROOT.Char),'lifestyle_nicknames_kurultai','lifestyle_nicknames_marshal'))] ของข้าเข้ามาในเต็นท์ — "ผู้บัญชาการต้องการพูดคุยกับท่าน ท่านต้องการให้แนะนำตัวอย่างไร?"\n\n[my_marshal.GetSheHe|U] พูดถูกในความหมายโดยนัยของเขา [ROOT.Char.Custom('WomenMenPeople_GenderPreference')] ควรรู้ว่าพวกเขาต่อสู้ภายใต้ใครบางคนที่ยิ่งใหญ่กว่าชีวิต"
 lifestyle_nicknames_second: "[GetCourtPositionType('second_camp_officer').GetNameNoTooltip]"
 lifestyle_nicknames_marshal: "[GetPlayer.GetCouncillorPosition( 'councillor_marshal' ).GetPositionName]"
 lifestyle_nicknames_steward: "[GetPlayer.GetCouncillorPosition( 'councillor_steward' ).GetPositionName]"
 lifestyle_nicknames_kurultai: "[GetPlayer.GetCouncillorPosition( 'councillor_kurultai_1' ).GetPositionName]"
 lifestyle_nicknames.0006.a:0 "ข้าอยากให้พวกเขารู้จักข้าด้วยปรีชาสามารถด้านกลยุทธ์"
 lifestyle_nicknames.0006.b:0 "พวกเขาจักรู้จักข้าด้วยปณิธานอันแน่วแน่"
 lifestyle_nicknames.0006.c:0 "ความกล้าแกร่งและความองอาจนำพาข้ามาถึงที่นี่..."
 lifestyle_nicknames.0006.d:0 "โปรดเรียกข้าว่า [ROOT.Char.GetFirstNameNoTooltip]"
 lifestyle_nicknames.0006.tt:0 "ท่านก็เป็นเพียง [ROOT.Char.GetWomanMan] ปุถุชนคนหนึ่ง และไม่มี [epithet|E] ใดจะเปลี่ยนแปลงสิ่งนั้นได้"
 
 lifestyle_nicknames.0007.t:0 "ความเงียบคือทองคำ"
 lifestyle_nicknames.0007.desc:0 "พวกเขากล่าวว่าอิทธิพลเปรียบดั่งหญ้าในฤดูใบไม้ผลิ มันสามารถเติบโตได้ด้วยตัวเอง แต่ข้าได้ดูแลของข้าอย่างอดทน จนกระทั่งมันแผ่ขยายไปทั่วอาณาจักรของข้า และไกลออกไป สวนแห่งนั้น ที่ข้าได้ดูแลอย่างอุตสาหะ ได้ผลิบานเป็นสิ่งที่งดงามอย่างแท้จริง\n\nอำนาจสถิตอยู่ ณ ที่ที่ข้าปรารถนา ราคาที่ข้าจ่าย เพื่อให้ผู้คนเงียบนั้นสูงนัก แต่มันคือการเสียสละที่ข้ายินดีจะทำ ข้าคือพลังที่ต้องคำนึงถึง และข้าควรเป็นที่จดจำจากอิทธิพลที่ข้าครอบครอง! นามอันทรงพลังควรจะตอกย้ำตำแหน่งของข้าในประวัติศาสตร์..."
 lifestyle_nicknames.0007.a:0 "ข้าเปรียบดั่งเงา ข้าติดตามทุกความเคลื่อนไหว"
 lifestyle_nicknames.0007.b:0 "ข้าเฝ้าสังเกตการณ์จากระยะไกลและโจมตีโดยไม่ลังเล"
 lifestyle_nicknames.0007.c:0 "การได้เห็นข้าแผ่นดินของข้าตัวสั่นคือรางวัลอันยิ่งใหญ่ที่สุด"
 lifestyle_nicknames.0007.d:0 "ความลับสู่ความสำเร็จคือความลับนั่นเอง"
 lifestyle_nicknames.0007.tt:0 "ท่านตัดสินใจคัดค้าน การใช้ [nickname|E] อันฉาวโฉ่ย่อมมี แต่จะขัดขวางความพยายามของท่านในอนาคตอย่างแน่นอน"
 
 lifestyle_nicknames.0008.desc:0 "[SelectLocalization( IsLandlessAdventurer(ROOT.Char),ROOT.Char.Custom('GetLaampDescribeTypeSelf'),'กษัตริย์')] ผู้สามารถข่มขู่ [ROOT.Char.Custom('GetFollowerOrVassalPlural')] ของ [ROOT.Char.GetHerHis] และสร้างแรงบันดาลใจให้แก่ประชาชนของ [ROOT.Char.GetHerHis] [SelectLocalization( IsLandlessAdventurer(ROOT.Char),ROOT.Char.Custom('GetLaampDescribeTypeSelf'),'ผู้ปกครอง')] อันเป็นที่รักของข้าแผ่นดินของ [ROOT.Char.GetHerHis] ผู้กุมอำนาจที่จะเปลี่ยนแปลงชะตากรรมของ [ROOT.Char.Custom('GetRealmOrDomicile')] ดินแดนที่ผู้มีอำนาจไม่ข่มเหงผู้อ่อนแอ\n\nนี่คือคุณค่าที่ข้าเชื่อมั่น! ข้าปรารถนาที่จะเป็นตัวแทนของความฝันนี้\n\nนับ แต่นี้ไป ข้าจะเป็นที่รู้จักในด้าน..."
 lifestyle_nicknames.0008.a:0 "ความหลักแหลมของข้าในการจัดการกิจการแห่งอาณาจักร"
 lifestyle_nicknames.0008.b:0 "ความลับและเสียงกระซิบที่สามารถโค่นล้มจักรวรรดิได้"
 lifestyle_nicknames.0008.c:0 "เครือข่ายอิทธิพลที่ข้าสร้างขึ้นอย่างพิถีพิถัน"
 lifestyle_nicknames.0008.d:0 "เพียงการกระทำที่ข้าทำเพื่อช่วยเหลือตระกูลและอาณาจักร"
 lifestyle_nicknames.0008.tt:0 "ท่านตัดสินใจที่จะไม่รับ [epithet|E] — อาณาจักรที่รุ่งเรืองคือรางวัลในตัวเอง"
 
 lifestyle_nicknames.0009.t:0 "ปากกานั้นทรงพลังกว่า"
 lifestyle_nicknames.0009.desc:0 "ห้องสมุดในวังของข้านั้นช่างเป็นภาพที่น่าชมอย่างแท้จริง บัญชี หนังสือ และม้วนคัมภีร์นับพัน ซึ่งบรรจุความรู้ที่คนส่วนใหญ่ไม่รู้จัก นี่คือความภาคภูมิใจของข้า หนึ่งในความสำเร็จอันยิ่งใหญ่ที่สุดของข้า\n\nปราชญ์ผู้ยิ่งใหญ่ในอดีตยังคงเป็นที่จดจำ ผลงานของพวกเขาถูกอ้างอิงและศึกษา ข้าสมควรเข้าร่วมในวิหารแห่งปราชญ์นี้ นับ แต่นี้ไป ข้าจะเป็นที่รู้จักในนาม [ROOT.Char.GetTitledFirstName]..."
 lifestyle_nicknames.0009.a:0 "...$nick_the_enlightened$!"
 lifestyle_nicknames.0009.b:0 "...$nick_the_truthseeker$!"
 lifestyle_nicknames.0009.c:0 "...$nick_the_chronicler$!"
 lifestyle_nicknames.0009.d:0 "..."
 lifestyle_nicknames.0009.tt:0 "ท่านไม่รับ [cognomen|E] ด้วยละอายใจที่ความคิดอันหยิ่งผยอง เช่นนั้นผุดขึ้นมาในใจ"
 
 lifestyle_nicknames.0010.desc:1 ""[ROOT.Char.Custom('FormOfAddressForLiege')|U] ได้เวลาแล้วขอรับ" [my_chaplain.GetCouncilTitle|U] [my_chaplain.GetFirstName] โค้งคำนับอย่างนอบน้อม ณ ประตูห้องส่วนตัวของข้า\n\nข้ารวบรวมบันทึกของข้าเป็นตั้งบนโต๊ะเขียนหนังสือ; ข้ามีหน้าที่ต้องกล่าวสุนทรพจน์เกี่ยวกับความสำเร็จทางวัฒนธรรมล่าสุดของอาณาจักร ต่อหน้าเหล่าทูตและราชทูต\n\n[my_chaplain.GetCouncilTitle] ของข้า หยุดข้าไว้ก่อนที่เราจะเข้าไปในโถง:\n"แน่นอนว่า พวกเขาทุกคนย่อมรู้ #EMP เกี่ยวกับ#! ท่านอยู่แล้ว — แต่ท่านประสงค์ให้ข้าแนะนำตัวท่านว่าอย่างไร?""
 lifestyle_nicknames.0010.a:0 "ข้าคือใครเล่า หากมิใช่ "$nick_the_sage$?""
 lifestyle_nicknames.0010.b:0 "อืม "$nick_the_scholar$" เป็นอย่างไร?"
 lifestyle_nicknames.0010.c:0 "ข้าคิดว่าข้าเป็นเหมือนนักประวัติศาสตร์อยู่บ้าง..."
 lifestyle_nicknames.0010.d:0 "ข้าเป็นเพียง [ROOT.Char.GetTitleAsName]"
 lifestyle_nicknames.0010.tt:0 "ท่านเข้าสู่ห้องโถงโดยปราศจาก [nickname|E] ใหม่ประดับ"
 
 lifestyle_nicknames.0011.t:0 "เสียงสะท้อน"
 lifestyle_nicknames.0011.desc:0 "ไม่ว่าข้าจะไปที่ใด ข้ามิอาจหลีกหนีสายตาที่ไม่เห็นด้วยของทั้งขุนนางและสามัญชนได้ แม้จะมีเจตนาดีที่สุด ดูเหมือนว่าชื่อที่ข้าเลือกให้ตนเองนั้นกลับได้รับการดูถูกเหยียดหยามมากกว่าที่ข้าคาดการณ์ไว้\n\nข้าถอยกลับไปยังห้องพักและครุ่นคิดว่าข้าควรทำ เช่นไร..."
 lifestyle_nicknames.0011.a:0 "พวกเขาอาจไม่เคารพข้า แต่พวกเขาจะเชื่อฟังข้า!"
 lifestyle_nicknames.0011.a.tt:0 "ท่านแจ้งให้ทุกคนทราบว่าท่านตั้งใจจะรักษา [cognomen|E] ที่ท่านเลือกไว้ และจะไม่ยอมให้เป็นอื่น"
 lifestyle_nicknames.0011.b:0 "พวกเขาพูดถูก ข้าคิดอะไรอยู่กันแน่?"
 
 lifestyle_nicknames.1000.t:0 "สมัญญานาม: [nickname_getter.GetNicknameNoTooltip|U]"
 lifestyle_nicknames.1000.desc:0 ""[informer.Custom2('RelationToMeShort', SCOPE.sC('nickname_getter'))] ของข้า ท่านได้ยินหรือไม่ว่าพวกเขาเรียกท่านว่ากระไร?" [nickname_getter.Custom2('RelationToMeShort', SCOPE.sC('informer'))] ของข้า [informer.GetFirstName] กล่าวกับข้า ขณะที่ [informer.Custom('quirk_pos_pp')]\n\n"
 lifestyle_nicknames.1000.desc_prison:0 ""[nickname_getter.GetFirstNameNoTooltip] ท่านได้ยินหรือไม่ว่าพวกเขาเรียกท่านว่ากระไร?" [informer.GetFirstName] พูดตะกุกตะกัก พลางเคาะถ้วยกับลูกกรงเหล็ก\n\n"
 lifestyle_nicknames.1000.desc_good:0 ""พวกเขาเรียกท่านว่า #EMP '[nickname_getter.GetTitledFirstNameNicknamedNoTooltip]'#! ช่างน่าประทับใจ มิใช่หรือ? มันอยู่บนริมฝีปากของทั้งไพร่และขุนนาง""
 lifestyle_nicknames.1000.desc_bad:0 ""พวกเขาเรียกท่านว่า #EMP '[nickname_getter.GetTitledFirstNameNicknamedNoTooltip]'#!... อาจจะไม่ใช่สิ่งที่ท่านเรียกว่า #EMP น่าพอใจ#! นัก แต่มันไม่น่าเป็นไปได้ที่ท่านจะทำสิ่งใดเพื่อเปลี่ยนแปลงมันได้""
 lifestyle_nicknames.1000.end_bad_bad:0 "\n\n"ทำความคุ้นเคยกับมันเสียเถิด!" [informer.GetFirstNameNoTooltip] หัวเราะคิกคักขณะที่ [informer.GetSheHe] เดินจากไป"
 lifestyle_nicknames.1000.end_good_bad:0 "\n\n"ไม่ใช่ชื่อที่ข้าจะเลือกให้ท่านเลย..." [informer.GetFirstNameNoTooltip] กล่าวอย่างเห็นได้ชัดว่าหงุดหงิด"
 lifestyle_nicknames.1000.end_bad_good:0 "\n\n"อย่างไรก็ตาม ข้าสัญญาว่าจะไม่เรียกท่านด้วยชื่อนั้น" [informer.GetFirstNameNoTooltip] กล่าวและยิ้ม"
 lifestyle_nicknames.1000.end_good_good:0 "\n\n"ข้าคิดว่าเป็นเหตุให้เฉลิมฉลองได้!" [informer.GetFirstNameNoTooltip] อุทานด้วยน้ำเสียงร่าเริง"
 lifestyle_nicknames.1000.a:0 "ข้าสามารถคุ้นเคยกับชื่อนี้ได้!"
 lifestyle_nicknames.1000.b:0 "'[nickname_getter.GetNicknameNoTooltip|U]'? #EMP อะไรนะ!?#! เหลวไหลสิ้นดี!"
 lifestyle_nicknames.1000.c:0 "แสงสว่างเพียงริบหรี่ในความมืดมิด..."
 lifestyle_nicknames.1000.d:0 "อา ชีวิตมัน #emp แย่#! ลงได้อีกสินะ"
 lifestyle_nicknames.1000.e:0 "*คำรามอย่างเห็นด้วย*"
