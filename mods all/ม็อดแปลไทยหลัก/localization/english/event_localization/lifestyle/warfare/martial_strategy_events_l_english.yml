l_english: 
 #Well-known commander, by Sean Hughes
 martial_strategy.1051.t:0 "ข่าวซุบซิบเกี่ยวกับแม่ทัพ"
 martial_strategy.1051.desc:0 "หัวข้อสนทนาที่ได้รับความนิยมมากที่สุดใน [ROOT.Char.Custom('GetCourt')] เปลี่ยนแปลงอยู่เสมอ แต่แนวโน้มล่าสุดคือการพูดคุยถึงทักษะอันโดดเด่นของข้าในฐานะผู้บัญชาการทหาร — และอะไรคือเคล็ดลับสู่ความสำเร็จของข้า\n\nข้าสามารถใช้ความอยากรู้อยากเห็นตามธรรมชาตินี้เพื่อเสริมสร้างชื่อเสียงของข้าได้ แต่ก่อนอื่นข้าต้องตัดสินใจว่าจะยกความสำเร็จของข้าให้กับสิ่งใด..."
 martial_strategy.1051.a:0 "ข้ามีพรสวรรค์โดยธรรมชาติที่ ทำให้ข้าเหนือกว่าผู้อื่น"
 martial_strategy.1051.a.humble:0 "การรู้ขีดจำกัดของตนเองหมายความว่าข้าสามารถทำงานรอบ ๆ พวกมันได้"
 martial_strategy.1051.b.brave:0 "ความกล้าหาญของข้าเป็นแรงบันดาลใจให้กองทหารของข้ายืนหยัดต่อสู้"
 martial_strategy.1051.b.stalwart:0 "ความมุ่งมั่นของข้าเป็น เช่นนั้น ข้าจะไม่มีวันหวั่นไหว!"
 martial_strategy.1051.c.wrathful:0 "ไม่มีใครสามารถต้านทานความดุร้ายอันท่วมท้นของข้าได้!"
 martial_strategy.1051.c.feareater:0 "เพียงแค่การปรากฏตัวของข้าก็ ทำให้ศัตรูหวาดกลัว!"
 martial_strategy.1051.d.zealous:0 "ความศรัทธาของข้าต่อ [ROOT.GetCharacter.GetFaith.HighGodName] มอบชัยชนะให้แก่ข้า"
 martial_strategy.1051.d.sadistic:0 "ข้าโจมตีศัตรูในจุดที่เจ็บปวดที่สุดเสมอ"
 martial_strategy.1051.d.zealoussadistic:0 "ข้าไม่ลดละในการทำสงครามครูเสดต่อต้านคนชั่ว!"
 martial_strategy.1051.e.patient:0 "ข้าระแวดระวังอยู่เสมอ รอคอยโอกาสที่จะโจมตี"
 martial_strategy.1051.f.ambitious:0 "ข้าจะทำ #EMP ทุกอย่าง#! ที่จำเป็นเพื่อคว้าชัยชนะ!"

 
 #Translate old texts (Learning skill challenge), Mathilda Bjarnehed
 martial_strategy.2000.t:0 "บทเรียนจากอดีต"
 martial_strategy.2000.start.desc:0 "แม้ว่าข้าจะเห็นสนามรบมากมายก่อนที่จะพบผู้สร้างของข้าอย่างแน่นอน แต่ห้องสมุดของข้าก็มีเรื่องราวสงครามจากร้อยชั่วอายุคน\n\nข้าเพิ่งได้ตำราเกี่ยวกับ"
 martial_strategy.2000.hastings.desc:1 "ยุทธการที่เฮสติงส์ อันยิ่งใหญ่, "
 martial_strategy.2000.tours.desc:1 "ยุทธการที่ตูร์ อันยิ่งใหญ่, "
 martial_strategy.2000.palaceofthemartyrs.desc:1 "ยุทธการที่วังแห่งมรณสักขี อันยิ่งใหญ่, "
 martial_strategy.2000.catalaunianplains.desc:1 "ยุทธการที่ทุ่งคาตาเลาเนียน อันยิ่งใหญ่, "
 martial_strategy.2000.constantinople.desc:1 "การล้อมกรุงคอนสแตนติโนเปิล อันยิ่งใหญ่, "
 martial_strategy.2000.vapati.desc:1 "ยุทธการที่วาปาติ อันยิ่งใหญ่, "
 martial_strategy.2000.end.desc:1 "รวมถึงม้วนคัมภีร์เก่าแก่ที่เขียนด้วยภาษาโบราณบางภาษา ใครจะรู้ว่ามันมีความลับที่ถูกลืมอะไรซ่อนอยู่..."
 martial_strategy.2000.a:0 "อ่านตำราเล่มใหม่กว่า"
 martial_strategy.2000.b:0 "พยายามแปลม้วนคัมภีร์เก่า"
 martial_strategy.2000.b.success:0 "ข้าค้นพบส่วนหนึ่งของความรู้โบราณ"
 martial_strategy.2000.b.success.tt:1 "ท่านได้รับ #P 1#! [martial|E], #P 1#! [learning|E] และโบนัส [commander|E] เป็นเวลา #V 20 ปี#!"
 martial_strategy.2000.b.failure:0 "ข้าล้มเหลวในการถอดรหัสม้วนคัมภีร์"
 martial_strategy.2000.b.failure.tt:1 "ท่านต้องได้รับ [stress|E] หรือยอมแพ้"

 martial_strategy.2001.start.desc:0 "แม้จะได้รับความช่วยเหลือจากอภิธานศัพท์ที่เต็มไปด้วยฝุ่น แต่ม้วนคัมภีร์ก็ไม่เต็มใจที่จะแบ่งปันความลับของมัน แต่ข้าก็ยังคงพยายามต่อไป เมื่อค่ำคืนดำเนินไป เรื่องราวที่น่าเหลือเชื่อที่สุดก็คลี่คลายต่อหน้าข้า...\n\n"
 martial_strategy.2001.gaixia.desc:1 "#F ม้วนคัมภีร์บรรยายถึงยุทธการที่ไกเซี่ย หาน ซิ่น ผู้บัญชาการของฮั่น ทำลายขวัญกำลังใจของศัตรูโดยให้คนของเขาร้องเพลงจากอาณาจักรฉู่ซึ่งเป็นบ้านเกิดของศัตรู ผู้บัญชาการเซี่ยง อวี่ แห่งฉู่ หลบหนีไปพร้อมกับกองกำลังเล็ก ๆ ที่ภักดี แต่ในที่สุด พวกเขาก็ถูกไล่ตามและพ่ายแพ้#! "
 martial_strategy.2001.red_cliffs.desc:0 "#F ในยุทธการที่ผาแดง ขุนศึกโจโฉผูกเรือของเขาตั้งแต่หัวจรดท้ายเพื่อต่อสู้กับอาการเมาเรือ ผู้บัญชาการคนหนึ่งของกองกำลังซุน-เล่าฝ่ายตรงข้าม หวง ไก เห็นโอกาสของเขาและส่งจดหมายยอมจำนนปลอม จากนั้น เขาก็เตรียมกองเรือ เติมเชื้อไฟและน้ำมันลงไป และปล่อยให้ลมพัดพาพวกมันไปยังโจโฉ เมื่อเรือที่ไม่มีลูกเรือเข้าใกล้กองเรือของศัตรู พวกมันก็ถูกจุดไฟเผา ส่งผลให้ชายจำนวนนับไม่ถ้วนเสียชีวิตอย่างน่าสยดสยอง#! "
 martial_strategy.2001.thermopylae.desc:0 "#F โดยการปิดกั้นช่องเขาชายฝั่งแคบ ๆ ที่เทอร์โมพิลี กองทหารกรีกที่มีจำนวนน้อยกว่ามากสามารถต้านทานกองทัพเปอร์เซียได้เป็นเวลาเจ็ดวัน ในวันสุดท้าย เมื่อกษัตริย์เลโอไนดัสถูกตีขนาบข้าง พระองค์ทรงปลดกองทัพส่วนใหญ่ออกไปและคุ้มกันการล่าถอยของพวกเขาในการยืนหยัดครั้งสุดท้ายอันรุ่งโรจน์ วีรกรรมของกองทหารของพระองค์เป็นเครื่องพิสูจน์ถึงพลังของกองทัพผู้รักชาติที่ปกป้องดินแดนบ้านเกิดของตน#! "
 martial_strategy.2001.teutoburg_forest.desc:0 "#F อาร์มินิอุส บุตรชายของหัวหน้าเผ่าเจอร์แมนิก ได้รับการเลี้ยงดูในกรุงโรม แต่ได้วางแผนที่จะสร้างพันธมิตรของชนเผ่าเพื่อเอาชนะชาวโรมัน อาร์มินิอุสกลายเป็นนายทหารของนายพลวารุสแห่งโรมันและแนะนำให้เขาอ้อมไปทางป่าท็อยโทบวร์ค ที่นั่น อาร์มินิอุสเปิดฉากซุ่มโจมตีหลายครั้ง เนื่องจากการศึกษาแบบโรมันของเขา อาร์มินิอุสจึงรู้วิธีต่อสู้กับกลยุทธ์ของศัตรูอย่างแม่นยำ และนำพาประชาชนของเขาไปสู่ชัยชนะอย่างเด็ดขาด#! "
 martial_strategy.2001.a:0 "ศึกษายุทธการ"
 martial_strategy.2001.b:0 "มุ่งเน้นไปที่กระบวนการแปล"

 martial_strategy.2002.desc:0 "ค่ำคืนมาเยือนและเทียนเล่มเดียวที่ส่องสว่างต้นฉบับตรงหน้าข้าก็สั้นลงทุกชั่วโมง เมื่อมันริบหรี่เป็นครั้งสุดท้ายและทิ้งข้าไว้ในความมืด ความลับของม้วนคัมภีร์ก็ยังคงไม่ถูกค้นพบ"
 martial_strategy.2002.a:0 "พยายามต่อไป"
 martial_strategy.2002.b:0 "ยอมแพ้"


 #Developing cunning/manipulative tactics (Intrigue skill challenge), Sean Hughes
 martial_strategy.2020.t:0 "ทุกอย่างยุติธรรม?"
 martial_strategy.2020.opening:0 "มีการเขียนตำรามากมายเกี่ยวกับการปฏิบัติอย่างมีเกียรติในสงคราม แต่ชีวิตของผู้เขียนเหล่านั้นไม่ได้แขวนอยู่บนเส้นด้ายเมื่อพวกเขาจรดปากกาลงบนกระดาษ\n\n"
 martial_strategy.2020.desc:0 "หากข้าต้องการเพิ่มโอกาสในการชนะในการรบให้สูงสุด อาจคุ้มค่าสำหรับข้าที่จะพิจารณาใช้กลยุทธ์ที่... นอกรีตมากขึ้น"
 martial_strategy.2020.desc.ambitious:0 "เพื่อให้แน่ใจว่าจะได้รับชัยชนะ ข้าต้องคว้าทุกความได้เปรียบที่ข้าจะได้รับในสนามรบ แม้ว่านั่นจะหมายถึงการใช้กลยุทธ์ที่อาจถือว่าไม่ยุติธรรมก็ตาม"
 martial_strategy.2020.desc.martial:0 "ข้ารู้จากประสบการณ์ว่าวิธีที่ดีที่สุดในการเอาชนะศัตรูของข้าคือการ ทำให้แน่ใจว่าเราจะเข้าปะทะกันตามเงื่อนไขของข้าเท่านั้น! คำถามคือ เงื่อนไขใดจะได้เปรียบที่สุด?"
 martial_strategy.2020.desc.deceitful:0 "ข้าเคยอ่านบทกวีเปรียบเทียบสนามรบกับบุคคลที่มีชีวิต สิ่งนี้ ทำให้ข้าสงสัย... ข้าสามารถชักใยสนามรบได้เหมือนกับที่ข้าสามารถชักใยผู้คนได้หรือไม่?"
 martial_strategy.2020.a:0 "ข้าจะหลอกศัตรูให้ยืดแนวรบเกินไป!"
 martial_strategy.2020.a.success:0 "กลอุบายของข้าได้ผลสำเร็จ"
 martial_strategy.2020.a.failure:0 "กลอุบายของข้าล้มเหลว ทำให้ข้าอับอาย"
 martial_strategy.2020.b:0 "กลยุทธ์ตีแล้วหนีจะ ทำให้ศัตรูอ่อนกำลังลง!"
 martial_strategy.2020.d:0 "ข้าจะไม่ลดตัวลงไปสู้สกปรก!"
 martial_strategy.2020.d.brave:0 "มีเพียงคนขี้ขลาดเท่านั้นที่จะใช้กลยุทธ์ เช่นนี้!"
 martial_strategy.2020.d.flavor:0 "ปฏิเสธการใช้กลยุทธ์เหล่านี้"
 
 martial_strategy.2021.t:0 "การหลอกลวงที่ประสบความสำเร็จ"
 martial_strategy.2020.desc.opening:0 "ข้ารวบรวมผู้ติดตามของข้าเพื่อเล่นเกมสงคราม กระตือรือร้นที่จะลองใช้ความคิดของข้าในการแสร้งทำเป็นล่าถอยเพื่อล่อให้ฝ่ายตรงข้ามยืดแนวรบเกินไป"
 martial_strategy.2021.desc:0 "\n\nเมื่อเราแบ่งทีมกัน ข้าก็ดูแลแสดงให้ทุกคนเห็นถึงวิธีการยอมเสียพื้นที่เพียงเล็กน้อยเพื่อหลอกให้อีกฝ่ายเคลื่อนออกจากตำแหน่ง โดยไม่ยอมเสียมากจนแนวรบของเราแตก\n\nกลยุทธ์ใหม่ของข้าได้ผลอย่างไม่มีที่ติ ทำให้เราสามารถโอบล้อมทีมศัตรูและบังคับให้พวกเขายอมจำนนได้!"
 martial_strategy.2021.a:0 "ข้ารอคอยวันที่ข้าจะได้ใช้กลอุบายนี้ในการรบจริง!"

 martial_strategy.2022.t:0 "ความฝันที่แตกสลาย"
 martial_strategy.2022.desc:0 "\n\nน่าเสียดาย เมื่อทีมของข้าพยายามลองใช้กลยุทธ์ใหม่ของข้า เราไม่สามารถรักษาพื้นที่ของเราไว้ได้ เราประสบความพ่ายแพ้อย่างรวดเร็วและน่าอัปยศเมื่อฝ่ายศัตรูทะลวงแนวรบของเราอย่างรวดเร็วและ ทำให้แถวของเราแตกสลาย\n\nทุกคนที่เข้าร่วมในเกมตอนนี้คิดว่าข้าเป็นคนโง่ และไม่ต้องการมีส่วนร่วมใน 'ความคิด' ของข้าอีกต่อไป"
 martial_strategy.2022.b:0 "บางทีข้าควรจะยึดติดกับกลยุทธ์แบบเดิม ๆ..."


 #Logistics and securing provisions (Stewardship skill challenge), Sean Hughes
 martial_strategy.2030.t:0 "ความมั่นคงด้านเสบียง"
 martial_strategy.2030.desc.fallback:0 "ส่วนหนึ่งของการบัญชาการกองทัพหมายถึงการ ทำให้แน่ใจว่าทหารของข้ามีอาหาร เครื่องดื่ม และอุปกรณ์ค่ายพักเพียงพอสำหรับการทัพที่ยาวนาน"
 martial_strategy.2030.desc.diligent:0 "ข้าภูมิใจในการ ทำให้แน่ใจว่าทุกอย่างได้รับการดูแลอยู่เสมอ ซึ่ง รวมถึงการ ทำให้แน่ใจว่าทหารของข้าได้รับการจัดหาเสบียงอย่างดี"
 martial_strategy.2030.desc.ambitious:0 "ไม่ว่าทหารของข้าจะน่าเกรงขามเพียงใด หากพวกเขาหมดเสบียงขณะอยู่ในการทัพ พวกเขาจะรับใช้ข้าได้ไม่ดีไปกว่ากระรอกที่ได้รับการฝึกฝน"
 martial_strategy.2030.desc.end:0 "\n\nเพื่อการนี้ ข้าควรจะวางแผน เพื่อให้แน่ใจว่าทหารของข้ามีเสบียงที่ต้องการในสนามรบอยู่เสมอ"
 martial_strategy.2030.a:0 "จัดตั้งเครือข่ายพ่อค้าเพื่อช่วยข้า"
 martial_strategy.2030.a.success.tt:1 "ท่านสร้างเครือข่ายผู้จัดหาที่น่าเชื่อถือได้"
 martial_strategy.2030.a.failure.tt:1 "พ่อค้าที่ท่านพบไม่น่าเชื่อถือ"
 martial_strategy.2030.b:0 "กักตุนเสบียงในฐานที่มั่นของข้า"
 martial_strategy.2030.c:0 "ทหารของข้าสามารถหาเสบียงของตนเองได้"

 martial_strategy.2031.t:0 "เครือข่ายที่น่าเชื่อถือ"
 martial_strategy.2031.desc:0 "หลังจากตรวจสอบบัญชีการเงินจำนวนมาก ข้าสามารถเลือกกลุ่มพ่อค้าที่กระจายอยู่ทั่วชนบท ซึ่งข้ารู้ว่าจะน่าเชื่อถือได้\n\nข้าได้ยื่นข้อเสนอที่จะจ้างพวกเขาไว้เพื่อจัดหาเสบียงใด ๆ ที่กองทัพของข้าต้องการได้ทันที สิ่งนี้จะ ทำให้แน่ใจว่าผู้บัญชาการของข้าจะรู้เสมอว่าควรไปหาใครเมื่อต้องการเสบียง"
 martial_strategy.2031.a:0 "สิ่งนี้จะจัดหาเสบียงให้กองทัพของข้าในสนามรบได้อย่างน่าเชื่อถือ"
 martial_strategy.2031.b:0 "ตอนนี้ถึงเวลาหักหัวคิวเล็กน้อย..."

 martial_strategy.2032.t:0 "เสบียงที่หายไป"
 martial_strategy.2032.desc:0 "ข้าติดต่อพ่อค้าที่มีอยู่หลายรายเพื่อดูว่าใครสามารถจัดหาเสบียงที่กองทัพของข้าต้องการได้ดีที่สุด\n\nพ่อค้าคนหนึ่งมีราคาดีมาก ดังนั้นข้าจึงจัดการ เพื่อให้ได้เสบียงส่วนใหญ่ของกองทัพจากเขา... แต่เมื่อถึงเวลารับสินค้า เขากับสินค้าของเขาก็หายไปไหนไม่รู้!"
 martial_strategy.2032.a:0 "เมื่อข้าเจอไอ้คนหลอกลวงนั่น ข้าจะตัดหัวมัน!"
 martial_strategy.2032.a.forgiving:0 "ข้าควรจะศึกษาข้อมูลให้มากกว่านี้ก่อนที่จะสั่งซื้อ"


 # Decide between two vassal's proposed strategies for a war, Sean Hughes
 martial_strategy.3010.t:0 "ทางตันทางยุทธศาสตร์"
 martial_strategy.3010.desc.start:0 "ข้านั่งอยู่รอบโต๊ะแผนที่กับ [impatient_commander.GetTitledFirstName] และ [patient_commander.GetTitledFirstName] กำลังหารือเกี่ยวกับกลยุทธ์ของเราสำหรับสงครามที่กำลังดำเนินอยู่\n\n[impatient_commander.GetFirstNameNoTooltip]"
 martial_strategy.3010.desc.middle:0 "ขณะที่ [patient_commander.GetFirstNameNoTooltip]"
 martial_strategy.3010.desc.end:0 "\n\nเป็นสิทธิ์ของข้าที่จะตัดสินใจแนวทางการดำเนินการขั้นสุดท้ายของเรา"
 martial_strategy.3010.desc.wrathful:0 "ทุบกำปั้น [impatient_commander.GetHerHis] ลงบนโต๊ะและประกาศเสียงดังว่าเราควรบุกโจมตีศัตรูโดยตรงและบดขยี้พวกเขาด้วยพลังอันมหาศาลของกองทัพของเรา,"
 martial_strategy.3010.desc.greedy:0 "ชี้เป้าหมายสำคัญทั้งหมดที่เราควรส่งกองกำลังปล้นสะดมไปปล้นทันทีอย่างกระตือรือร้น,"
 martial_strategy.3010.desc.patient:0 "นั่งเอนหลังและสนับสนุนอย่างอดทนให้เรายึดครองสถานที่สำคัญและรอให้ศัตรูเข้ามาหาเราแทน"
 martial_strategy.3010.desc.craven:0 "พึมพำอย่างประหม่าเกี่ยวกับว่าเราควรหลีกเลี่ยงการปะทะที่ไม่จำเป็นและต่อสู้สงครามบั่นทอนกำลัง"
 martial_strategy.3010.desc.flexible:0 "อธิบายว่าเราต้องจับตาดูสิ่งที่ศัตรูทำและตอบสนองตามนั้น"
 martial_strategy.3010.a:0 "[impatient_commander.GetTitledFirstNameNoTooltip] มีความคิดที่ถูกต้องที่นี่!"
 martial_strategy.3010.b:0 "ข้าอยากจะใช้แผนของ [patient_commander.GetTitledFirstNamePossessiveNoTooltip] มากกว่า"
 martial_strategy.3010.c:0 "ผู้บัญชาการของข้าสามารถดำเนินการตามที่ แต่ละคนเห็นสมควร"
 martial_strategy.3010.o_martial:0 "ข้ารู้วิธีที่เราจะใช้ทั้งสองกลยุทธ์ได้!"

 martial_strategy.3010.desc.response.start:0 "ข้ากำลังเข้าร่วมการประชุมวางแผนกลยุทธ์กับ [my_liege.GetTitledFirstName] และ [other_commander.GetTitledFirstName] กำลังหารือเกี่ยวกับแผนการของเราสำหรับสงครามที่กำลังดำเนินอยู่"

 martial_strategy.3011.t:0 "กลยุทธ์ที่ยอมรับ"
 martial_strategy.3011.desc:0 "\n\n[my_liege.GetTitledFirstName] เปิดรับความคิดของข้าเป็นอย่างมาก โดยชื่นชอบความคิดเหล่านั้นมากกว่าความคิดที่เสนอโดย [other_commander.GetFirstName] ตอนนี้เราจะดำเนินการต่อไปและใช้ความคิดเหล่านั้นเพื่อกำหนดนโยบายเชิงกลยุทธ์ของเราสำหรับสงครามที่กำลังดำเนินอยู่!"
 martial_strategy.3011.a.disapprove:0 "ใครจะรู้ว่า [my_liege.GetFirstNameNoTooltip] จะเห็นเหตุผลได้?"
 martial_strategy.3011.a:0 "ข้ารู้ว่า [my_liege.GetTitledFirstNameNoTooltip] จะชอบความคิดของข้า!"

 martial_strategy.3012.t:0 "กลยุทธ์ที่ถูกปฏิเสธ"
 martial_strategy.3012.desc:0 "\n\nน่าเสียดายที่ [my_liege.GetTitledFirstName] ไม่สนใจความคิดของข้า แต่กลับชื่นชอบความคิดที่เสนอโดย [other_commander.GetFirstName] แทน ตอนนี้เราจะดำเนินการต่อไปและใช้ความคิดเหล่านั้นเพื่อกำหนดนโยบายเชิงกลยุทธ์ของเราสำหรับสงครามที่กำลังดำเนินอยู่!"
 martial_strategy.3012.a.disapprove:0 "ความโง่เขลาของ [my_liege.GetFirstNameNoTooltip] ไม่ ทำให้ข้าประหลาดใจ"
 martial_strategy.3012.a:0 "เวลาจะบอกเองว่าการเลือกของ [my_liege.GetFirstNamePossessiveNoTooltip] ถูกต้องหรือไม่"

 martial_strategy.3013.t:0 "กลยุทธ์ที่อนุญาต"
 martial_strategy.3013.desc:0 "[my_liege.GetTitledFirstName] ได้ตัดสินใจที่จะใช้วิธีการที่ไม่เข้าไปยุ่งเกี่ยว โดยอนุญาตให้ทั้ง [other_commander.GetFirstName] และข้าดำเนินการตามที่เราเห็นสมควร"
 martial_strategy.3013.a:0 "ข้าดีใจที่ข้าจะมีอิสระในการทำตามที่ข้าต้องการ"

 martial_strategy.3014.t:0 "กลยุทธ์ที่ผสมผสาน"
 martial_strategy.3014.desc:0 "\n\n[my_liege.GetTitledFirstName] ได้รวมความคิดของข้าเข้ากับ [other_commander.GetFirstNamePossessive] ผสานเข้าด้วยกันเป็นกลยุทธ์ที่เหนียวแน่นเป็นหนึ่งเดียว ซึ่งจะ ทำให้เราได้เปรียบอย่างมากในสนามรบ!"
 martial_strategy.3014.a.disapprove:0 "แม้จะมีข้อบกพร่องของ [my_liege.GetFirstNamePossessiveNoTooltip] [my_liege.GetSheHe] ก็เป็นแม่ทัพที่มีทักษะ"
 martial_strategy.3014.a:0 "ข้าประทับใจในแผนของ [my_liege.GetTitledFirstNamePossessiveNoTooltip]"


 #Storm Your Own Castle, by Linnéa Thimrén
 martial_strategy_special.1301.t:0 "ภายใต้การล้อม"
 martial_strategy_special.1301.desc:1 ""ศัตรูที่แท้จริงของทหารทุกคนคือความประมาท" [siege_proposer.Custom2('MyCharacterIntroduction', ROOT.Char)] กล่าว ก่อนที่ [siege_proposer.Custom('quirk_pos_pp')] เรายืนเคียงข้างกันบนกำแพง [ROOT.Char.Custom('FortifiedBuilding')] ของข้า มองลงไปยังทหารที่กำลังฝึกซ้อมอยู่เบื้องล่าง\n\n"เราสามารถเปลี่ยนประตู [ROOT.Char.Custom('FortifiedBuilding')] เป็นแผ่นไม้ และ ทำให้ลูกธนูในกระบอกธนูของกองทหารทื่อลงได้" [siege_proposer.GetSheHe] กล่าวต่อ "นำทหารเข้าโจมตีจำลอง [ROOT.Char.Custom('FortifiedBuilding')] และดูว่าพวกเขาทำได้ดีเพียงใดในการปฏิบัติจริง!""
 martial_strategy_special.1301.a:0 "เวลาของเราควรใช้ไปกับการปรับปรุงการป้องกันของเราดีกว่า"
 martial_strategy_special.1301.b:0 "ความคิดดี ท่านควรนำกองกำลังป้องกัน!"
 martial_strategy_special.1301.b.tt:0 "#F ให้เกมเริ่มต้นขึ้น!#!"

 martial_strategy_special.1302.t:1 "$martial_strategy_special.1301.t$: การบุกครั้งแรก"
 martial_strategy_special.13.a.tt:0 "#F แนวทางที่เสี่ยงกว่าซึ่งอาจให้ผลตอบแทนที่สูงกว่า#!"
 martial_strategy_special.13.b.tt:0 "#F แนวทางที่ปลอดภัยและมียุทธวิธีมากกว่า#!"
 martial_strategy_special.1302.desc:0 "ประตูที่ปิดสนิทและกำแพงที่สูงตระหง่านขึ้นไปบนท้องฟ้า สามารถมองเห็นพลธนูเป็นเงาเคลื่อนไหวอยู่หลังเชิงเทิน และความรู้สึกตื่นเต้นอย่างแท้จริงก็แผ่ซ่านไปในอากาศ\n\nในช่วงสงบก่อนการรบ ข้าหันไปกล่าวกับทหาร คำสั่งของข้าดังก้องกังวานไปทั่วสนามรบ"

 martial_strategy_special.1302.c:0 "ใช้ประโยชน์จากจุดอ่อนของประตู!"
 martial_strategy_special.1302.d:0 "ไปทางท่อระบายน้ำ!"
 martial_strategy_special.1302.a:0 "บุกประตูหลัก!"
 martial_strategy_special.1302.a.tt1:0 "เราเดินเข้าไปโดยแทบไม่มีการต่อต้าน"
 martial_strategy_special.1302.a.tt2:1 "เราสูญเสีย 'กำลังพล' อย่างหนัก แต่ก็พังประตูลงได้"
 martial_strategy_special.1302.b:0 "เอาบันไดออกมา!"
 martial_strategy_special.1302.b.tt1:0 "กำแพงถูกปีนขึ้นไปโดยไม่มีปัญหามากนัก"
 martial_strategy_special.1302.b.tt2:1 "เราแทบจะไม่ถึงเชิงเทิน สูญเสีย 'กำลังพล' อย่างหนัก"

 martial_strategy_special.storm_castle.very_well:0 "การโจมตีดำเนินไป #P อย่างดีเยี่ยม#!"
 martial_strategy_special.storm_castle.poorly:0 "การโจมตีดำเนินไป #N อย่างย่ำแย่#!"
 martial_strategy_special.storm_castle.normal:0 "การโจมตีดำเนินไป #Z อย่างพอใช้#!"
 martial_strategy_special.storm_castle.well:0 "การโจมตีดำเนินไป #P อย่างดี#!"

 martial_strategy_special.1303.t:0 "$martial_strategy_special.1301.t$: ทุกย่างก้าว"
 martial_strategy_special.1303.desc:0 "บันไดดังก้องเมื่ออาวุธทื่ออีกอันกระเด็นออกจากเสากลาง เป็นครั้งที่สองในเวลาไม่กี่นาทีที่ข้าสาปแช่งบันไดวนแคบ ๆ ที่ขัดขวางไม่ให้เราเหวี่ยงอาวุธใส่กองกำลังป้องกัน\n\nเสียงหอบหายใจของทหารรอบตัวข้าดังจนหูอื้อ และทุกครั้งที่การโจมตีถูกขับไล่ พวกเขาก็ยิ่งท้อแท้และหงุดหงิดมากขึ้น ข้าต้องเข้าควบคุมสถานการณ์!"
 martial_strategy_special.1303.c:0 "ทหารที่ถนัดซ้ายทุกคนไปข้างหน้า!"
 martial_strategy_special.1303.d:0 "ระวัง! อย่าให้พวกมันล่อลวงเจ้าได้!"
 martial_strategy_special.1303.a:0 "อย่าหยุด เราจะเอาชนะพวกมันให้ได้!"
 martial_strategy_special.1303.e:0 "ตามข้ามา! #EMP บุก#!!"
 martial_strategy_special.1303.a.tt1:0 "เรายึดบันไดได้อย่างมีประสิทธิภาพอย่างโหดเหี้ยม"
 martial_strategy_special.1303.a.tt2:0 "บันไดแทบจะไม่ถูกยึดครองด้วยก้าวที่สะดุดและแขนที่เหนื่อยล้า"
 martial_strategy_special.1303.b:0 "ทีละคน! ตื่นตัวอยู่เสมอ!"
 martial_strategy_special.1303.b.tt1:0 "ต้องใช้เวลา แต่ในที่สุดเราก็ยึดบันไดได้"
 martial_strategy_special.1303.b.tt2:0 "เราสูญเสีย 'กำลังพล' จำนวนมากก่อนที่จะบุกทะลวงเข้าไปได้"
 martial_strategy_special.1303.f:0 "อยู่ข้างหลังข้า! ข้าจะปกป้องพวกเจ้า!"
 martial_strategy_1303.winning:0 "เรากำลังชนะ แต่ไม่มีที่ว่างสำหรับความผิดพลาด!"
 martial_strategy_1303.losing:0 "นี่เป็นโอกาสสุดท้ายของเราที่จะพลิกสถานการณ์การรบ!"

 martial_strategy_special.1304.t:0 "$martial_strategy_special.1301.t$: ความองอาจบนเชิงเทิน"
 martial_strategy_special.1304.desc:0 "เมื่อก้าวสุดท้ายขึ้นไปบนกำแพงที่ล้อมรอบ [ROOT.Char.Custom('FortifiedBuilding')] ข้าสำรวจฉากนั้น\n\nทหารจำนวนมากอาจสูญเสียให้กับพลธนูบนกำแพง แต่เราจะไม่ย่อท้อ ทีละคนเราเอาชนะกองกำลังป้องกันและยืนหยัดอย่างผู้ชนะเหนือผู้ล้มลง\n\nข้าสูดหายใจลึก ๆ แล้วก็ถึงเวลาที่จะต้องเดินหน้าต่อไปอีกครั้ง"
 martial_strategy_special.1304.a:0 "ทุกคน ตามข้ามา!"
 martial_strategy_special.1304.c:0 "โจมตีพวกมันอย่างหนัก! วันนี้พวกมันไม่ใช่เพื่อนของเจ้า!"
 martial_strategy_special.1304.d:0 "ยกโล่ขึ้น! ปกป้องด้านหลัง!"
 martial_strategy_special.1304.f:0 "โจมตีพวกมันอย่างหนัก! อย่าปรานี!"

 martial_strategy_special.1304.a.tt1:0 "เราเอาชนะกองกำลังของ [siege_proposer.GetTitledFirstNamePossessiveNoTooltip] ได้อย่างรวดเร็ว"
 martial_strategy_special.1304.a.tt2:0 "เราถูกโจมตีจากด้านหลังที่ไม่มีการป้องกัน"
 martial_strategy_special.1304.b:0 "พลธนู เข้าประจำตำแหน่ง!"
 martial_strategy_special.1304.b.tt1:0 "เราไม่มีใครหยุดยั้งได้"
 martial_strategy_special.1304.b.tt2:0 "หากไม่มีพลธนู การโจมตีของเราก็ถูกขับไล่ได้ง่าย"

 martial_strategy_special.1399.t:0 "$martial_strategy_special.1301.t$: การบุก [ROOT.Char.Custom('FortifiedBuilding')|U]"
 martial_strategy_special.1399.desc_win:0 "[ROOT.Char.Custom('FortifiedBuilding')] เป็นของเราแล้ว!"
 martial_strategy_special.1399.desc_loose:0 "การรบพ่ายแพ้ และกองกำลังป้องกันเป็นผู้ชนะในวันนี้"
 martial_strategy_special.1399.desc:0 "ท่ามกลางทหารที่กำลังเฉลิมฉลอง ข้าพบ [siege_proposer.GetTitledFirstName] ผู้ ซึ่งแสดงความยินดีกับข้าสำหรับการนำทัพบุกที่ยอดเยี่ยม"
 martial_strategy_special.1399.desc_win2:0 "\n\n"ดูพวกเขาเถิด [ROOT.Char.Custom('FormOfAddressForLiege')] การเปลี่ยนบรรยากาศส่งผลดีต่อพวกเขา แม้ แต่ท่านเองก็ดูเหมือนจะกระปรี้กระเปร่าขึ้น แม้ว่า [ROOT.Char.Custom('FortifiedBuilding')] ของท่านจะเพิ่งตกเป็นของผู้โจมตีก็ตาม!""
 martial_strategy_special.1399.desc_loose2:0 "\n\n"แม้ว่าท่านจะยึด [ROOT.Char.Custom('FortifiedBuilding')] ไม่สำเร็จ [ROOT.Char.Custom('FormOfAddressForLiege')] ทั้งกองทหารและท่านก็ดูเหมือนจะกระปรี้กระเปร่าขึ้นจากการเปลี่ยนบรรยากาศ!"\n\nข้ามิอาจทำสิ่งใดได้นอกจากเห็นด้วย อีกอย่าง มันก็อุ่นใจที่ได้รู้ว่า [ROOT.Char.Custom('FortifiedBuilding')] ของข้าจะไม่ถูกตีแตกง่ายดาย เช่นนั้น!"
 martial_strategy_special.1399.a:0 "ศัตรูของเราจะไม่มีวันมีโอกาส!"
 martial_strategy_special.1399.b:0 "ในฐานะกองกำลังป้องกัน เราน่าเกรงขาม!"


 #March gone awry, by Petter Vilberg
 martial_strategy_special.1401.t:0 "ในการเดินทัพ"
 martial_strategy_special.1401.opening:1 "ในตอนท้ายของการฝึกภาคสนาม มันดูเหมือนเป็นความคิดที่ยอดเยี่ยม...\n\nเพื่อฝึกการรวมพลกองทัพที่กระจัดกระจาย ข้าได้แบ่งกองทหารของข้าและสั่งให้นายทหารทุกคนเดินทางไปยัง [capital.GetNameNoTier] โดยอิสระ\n\nแน่นอนว่า เมื่อถึงวันที่สามของการรอคอย แต่มีกองทัพของข้าเพียงครึ่งเดียวเท่านั้นที่เข้าประจำที่ ข้าจึงเริ่มเห็นข้อบกพร่องในแผน"
 martial_strategy_special.1401.commander:0 "[commander.GetTitledFirstName]"
 martial_strategy_special.1401.officer_fallback:0 "นายทหารคนหนึ่งของข้า"
 martial_strategy_special.1401.end:1 "แนะนำให้ข้าขี่ม้าออกไปพร้อมกับกองกำลัง $knight_culture_player_plural_no_tooltip_lowercase$ เพื่อค้นหากองทหารที่หายไป ขณะที่กองทัพที่เหลือกลับบ้าน"
 martial_strategy_special.1401.a:0 "นี่จะเป็นการค้นหาที่น่าตื่นเต้น!"
 martial_strategy_special.1401.a.tt:3 "การค้นหาของท่านอาจใช้เวลาสักครู่..."
 martial_strategy_special.1401.b:0 "ความคิดดี ท่านเป็นผู้รับผิดชอบ"
 martial_strategy_special.1401.give_up_tt:0 "#F ทหารคนอื่น ๆ สามารถเรียนรู้บางอย่างจากการเดินทางกลับบ้านด้วยตนเองได้#! "
 martial_strategy.1401.almost_done:0 "ทหารเกือบทั้งหมดของข้ากลับมาแล้วในตอนนี้ และข้าก็ออกเดินทางโดยรู้ว่าทหารสองสามคนสุดท้ายอาจหายาก\n\n"
 martial_strategy.1401.close_to_done:0 "ทหารส่วนใหญ่ของข้ากลับมาแล้ว และข้าก็ออกเดินทางเพื่อตามหากองทหารที่เหลืออยู่\n\n"
 martial_strategy.1401.a_lot_returned:0 "กองทหารจำนวนมากของข้ากลับมาแล้ว และข้ามองโลกในแง่ดีเกี่ยวกับการค้นหาคนที่เหลืออยู่\n\n"
 martial_strategy.1401.some_returned:0 "กองทหารบางส่วนของข้ากลับมาแล้ว ขณะที่ข้าออกเดินทางเพื่อค้นหาคนที่เหลืออยู่\n\n"
 martial_strategy.1401.first_find:0 "ข้าใช้เวลาไม่นานในการค้นหากองทหารแรกที่ข้ากำลังมองหา\n\n"
 martial_strategy_special.1401.continue_search_tooltip:0 "การค้นหาของท่านดำเนินต่อไป"
 martial_strategy_special.1401.delay_tt:0 "การค้นหาของท่านจะล่าช้า"
 martial_strategy_special.1401.give_up:0 "ท่านละทิ้งการค้นหาและกลับบ้าน"

 martial_strategy_special.1402.t:0 "ในการเดินทัพ"
 martial_strategy_special.1402.desc:2 "ข้าได้ยินเสียงเอะอะโวยวายดังมาจากโรงเตี๊ยมริมทาง $knight_culture_player_plural_no_tooltip_lowercase$ คนหนึ่งของข้าเตะประตูเปิดออก เผยให้เห็นห้องที่เต็มไปด้วยทหารที่หลงทางของข้า\n\nการมาถึงของข้า ทำให้พวกเขาเงียบลงและจ้องมองลงไปในเหยือกของตนโดยไม่มีคำพูดใด ๆ ระหว่างกัน เจ้าของร้านหรี่ตา [ROOT.Char.Custom('RandomHerHis')] "งั้น #EMP เจ้า#! เป็นผู้รับผิดชอบต่อฝูงชนนี้รึ?""
 martial_strategy_special.1402.a:0 "ข้ามีเหรียญพอที่จะจ่ายค่าเสียหาย"
 martial_strategy_special.1402.a.tt:2 "#F การจัดการกับทหารที่เกเรนั้นง่ายกว่าเจ้าของโรงเตี๊ยมที่เกเร และท่านต้องดำเนินการค้นหาต่อไป#! "
 martial_strategy_special.1402.b:0 "คนเหล่านี้มีความคิดที่ถูกต้อง รินเครื่องดื่มให้ข้า!"
 martial_strategy_special.1402.b.tt:1 "#F ดื่มกับชาวบ้านธรรมดา! ช่างเป็นชีวิต! อย่างน้อยก็จนกว่าท่านจะต้องดำเนินการค้นหาต่อไป#! "
 martial_strategy_special.1402.c:0 "ข้าเบื่อที่จะต้องรับมือกับทหารที่ไม่มีวินัย"
 martial_strategy_special.1402.d:1 "หยิบเครื่องดื่มสำหรับเดินทางเถิดพวก และให้เราออกเดินทาง!"
 martial_strategy_special.1402.d.tt:2 "#F ท่านแน่ใจว่าท่านสามารถโน้มน้าวทหารเหล่านี้ให้เข้าร่วมการค้นหาได้#! "

 martial_strategy_special.1403.t:0 "ในการเดินทัพ"
 martial_strategy_special.1403.desc:1 "เมื่อเข้าใกล้ [ROOT.Char.Custom('IndefiniteBodyOfWater')] ข้าเห็นค่ายพักตั้งอยู่บนชายฝั่ง เมื่อข้าเข้าไป ข้าก็พบกับสิบเอกผู้รับผิดชอบ\n\n"ท่าน [ROOT.Char.GetLadyLord]! เสบียงน้ำของเราเกิดรั่วไหลขณะเดินทาง และสัตว์บรรทุกของเราไม่สามารถเดินทางกลับบ้านได้หากไม่มีน้ำมากกว่าที่เรามีอยู่ในปัจจุบัน" ทหารมองข้าอย่างประหม่า "อย่างไรก็ตาม หากท่าน [ROOT.Char.GetLadyLord] และ [ROOT.Char.Custom('MountedWarriorTermPlural')] ของ [ROOT.Char.GetHerHis] ช่วยแบกถุงน้ำ..."
 martial_strategy_special.1403.a:0 "หากนี่เป็นหนทางเดียว..."
 martial_strategy_special.1403.a.tt:0 "#F ความอัปยศของการแบกน้ำให้ล่อ!#!"
 martial_strategy_special.1403.b:0 "คนเหล่านั้นจะเดินทัพ และพวกเขาจะเดินทัพเดี๋ยวนี้!"
 martial_strategy_special.1403.b.tt:1 "#F "ชาวบ้านเหล่านี้คิดว่าน้ำสำคัญกว่าคำสั่งของข้ารึ?"#! "
 martial_strategy_special.1403.c:0 "แค่พาพวกเขากลับบ้าน สิบเอก ข้าไม่สนใจอีกต่อไปแล้ว"
 martial_strategy_special.1403.d:0 "ข้าคิดว่าข้าสามารถหาทางแก้ไขปัญหานี้ได้"
 martial_strategy_special.1403.d.tt:0 "#F ทีนี้ ถ้าล่อต้องการน้ำแปดแกลลอนต่อวัน...#!"

 martial_strategy_special.1404.t:0 "ในการเดินทัพ"
 martial_strategy_special.1404.desc:1 "เมื่อทหารม้าลาดตระเวนของข้านำข่าวค่ายเล็ก ๆ มาแจ้ง ข้าไม่ได้คาดหวังว่าจะพบทหารยังคงฝึกซ้อมรูปแบบการรบอยู่\n\nดูเหมือนว่า [knight.Custom2('MyCharacterIntroduction', ROOT.Char)] ได้ถือเป็นภาระของ [knight.GetHerselfHimself] ในการดำเนินการฝึกซ้อมภาคสนามต่อไปขณะรอข่าวจากกองทัพหลัก กองกำลังของ [knight.GetHerHis|U] เข้าแถวอย่างเรียบร้อยขณะที่ข้าขี่ม้าเข้าไปพบ [knight.GetHerHim]"
 martial_strategy_special.1404.a:0 "นั่นไม่ใช่คำสั่งที่ข้าให้ไว้!"
 martial_strategy_special.1404.a.tt:0 "ทหาร #EMP ของข้า#! ต้องปฏิบัติตามคำสั่ง #EMP ของข้า#! "
 martial_strategy_special.1404.b:0 "ท่าทางที่ไม่ได้เรื่องนี่คืออะไร? นั่นไม่ใช่วิธีถือดาบ!"
 martial_strategy_special.1404.b.tt:0 "ไม่น่าแปลกใจที่พวกเขาหลงทาง — กองทหารเหล่านี้ต้องการระเบียบวินัย!"
 martial_strategy_special.1404.c:0 "พาคนกลับบ้าน [knight.GetFirstNameNoTooltip] ข้าเหนื่อยกับการค้นหาแล้ว"
 martial_strategy_special.1404.d:0 "[soldier_friend.GetTitledFirstNameNoTooltip] สามารถรับผิดชอบกองทหารเหล่านี้ได้"
 martial_strategy_special.1404.d.tt:0 "[soldier_friend.GetSheHe|U] จะพาพวกเขาไปยังปราสาทอย่างปลอดภัย"

 martial_strategy_special.1405.t:0 "ในการเดินทัพ"
 martial_strategy_special.1405.desc:1 "ขณะที่ข้ากำลังผ่านหมู่บ้านเล็ก ๆ แห่งหนึ่ง ข้าสังเกตเห็นว่า แม้จะสวมเสื้อผ้าธรรมดา แต่ทหารยามของเมืองกลับถืออาวุธที่มีตราของข้าอยู่!\n\nผู้ที่ต้อนรับข้าบนถนนที่เต็มไปด้วยโคลนคือ [zealot.GetTitledFirstName] ผู้ประกาศตนเองว่าเป็น "ผู้พิทักษ์ศักดิ์สิทธิ์" ของเมือง ทหารของข้าถอดชุดเกราะออกเพื่อช่วยนักเทศน์ผู้นี้รับใช้ [zealot.GetFaith.HighGodName]!"
 martial_strategy_special.1405.a:1 "ข้าปกครองโดยสิทธิ์อันศักดิ์สิทธิ์อยู่แล้ว!"
 martial_strategy_special.1405.a.tt:1 "#F "ทหารเหล่านี้ควรจำไว้ว่า #EMP ข้า#! ได้รับเลือกจาก [zealot.GetFaith.HighGodName] ตามแผนการอันศักดิ์สิทธิ์"#! "
 martial_strategy_special.1405.b:0 "เจ้ามีเวลาหนึ่งวันที่จะหนีออกจากที่นี่ นักบวชคลั่ง"
 martial_strategy_special.1405.b.tt:2 "#F "ดูเหมือนจะเป็นอันตรายที่จะลงโทษ [zealot.GetWomanMan] แต่การส่ง [zealot.GetHerHim] ไปเนรเทศจะแก้ปัญหาของข้าได้ในตอนนี้"#! "
 martial_strategy_special.1405.c:0 "พวกเขาจะเบื่อหน่ายกับการเล่นเป็นทหารศักดิ์สิทธิ์ในไม่ช้า"
 martial_strategy_special.1405.d:1 "เข้าร่วมกับข้า นักเทศน์ และเราจะประกาศใช้พระประสงค์ของ [ROOT.Char.GetFaith.HighGodNamePossessive] ร่วมกัน!"
 martial_strategy_special.1405.d.tt:2 "#F "ท้ายที่สุดแล้ว เราทุกคนไม่ใช่ผู้รับใช้ของ [ROOT.Char.GetFaith.HighGodNameAlternate] ในทางใดทางหนึ่งหรือ?"#! "

 martial_strategy_special.1498.t:0 "ในการเดินทัพ"
 martial_strategy_special.1498.desc:0 "กองทหารสุดท้ายของข้าได้เดินทางกลับมาถึง [capital.GetNameNoTier] และความเป็นระเบียบเรียบร้อยก็ได้รับการฟื้นฟู\n\nแม้ว่านี่แทบจะไม่ใช่การแสดงความสามารถทางทหารที่ยอดเยี่ยม แต่ข้าก็ได้มุมมองใหม่เกี่ยวกับกองทัพของข้าและทหาร แต่ละคนที่ประกอบกันเป็นกองทัพ"
 martial_strategy_special.1498.a:0 "ท้ายที่สุดแล้ว มันก็เป็นการฝึกที่มีค่า!"

 martial_strategy_special.1499.t:0 "ในการเดินทัพ"
 martial_strategy_special.1499.desc:0 "ต้องใช้เวลาสักครู่ แต่ช้า ๆ และแน่นอน กองทหารที่หายไปก็ทยอยกลับเข้ามาทางประตูของ [capital.GetNameNoTier]\n\nข้าอาจจะไม่ได้มีส่วนเกี่ยวข้องมากนัก แต่ดูเหมือนว่าพวกเขาจะได้เรียนรู้มากมายจากประสบการณ์นี้"
 martial_strategy_special.1499.a:0 "การฝึกครั้งนี้ไม่ได้เป็นไปตามแผน"
 martial_strategy_special.1499.a.tt:1 "#F อย่างไรก็ตาม การอยู่ใน [ROOT.Char.Custom('FortifiedBuilding')] ของท่านนั้นสะดวกสบายกว่าในสนามรบมาก#! "
 
