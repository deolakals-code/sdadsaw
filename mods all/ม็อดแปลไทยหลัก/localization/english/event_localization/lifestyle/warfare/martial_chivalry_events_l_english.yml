l_english: 
 #A practice duel gone terribly wrong, Peter Vilberg 	
 martial_chivalry.0001.t:0 "การท้าทายอันไม่คู่ควร"
 martial_chivalry.0001.opening:0 "ในตอนแรก ข้าคิดว่าทหารราบผู้นั้นช่างโง่เขลาที่ก้าวเข้ามาในสนามฝึก"
 martial_chivalry.0001.hard_fight:0 "ทว่า การต่อสู้กลับยากลำบากกว่าที่ข้าคาดไว้ และค่อยๆ ชัดเจนขึ้นว่า[duel_opponent.GetSheHe]จะไม่สามารถหยุดยั้งการโจมตีอันดุร้ายและป่าเถื่อนของ[duel_opponent.GetHerHis]ไม่ให้ทำร้ายข้าได้!"
 martial_chivalry.0001.easy_fight:0 "\n\nแม้ว่า[duel_opponent.GetTitledFirstName]จะดูเหมือนไม่มีภัยคุกคามในตอนแรก แต่ก็ชัดเจนขึ้นอย่างรวดเร็วว่า[duel_opponent.GetSheHe]จะไม่สามารถหยุดยั้งการโจมตีอันดุร้ายและป่าเถื่อนของ[duel_opponent.GetHerHis]ไม่ให้ทำร้ายข้าได้!"
 martial_chivalry.0001.conclusion:0 "การปลดอาวุธ[duel_opponent.GetHerHim]กลายเป็นเรื่องความเป็นความตายในทันใด\n\nข้าพยายามไม่แสดงความโล่งใจเมื่อดาบของ[duel_opponent.GetHerHis]กระทบพื้นในที่สุด"
 martial_chivalry.0001.a:0 "ข้าต้องการคนอย่างเจ้าเพิ่ม!"
 martial_chivalry.0001.a.tt:1 "[duel_opponent.GetTitledFirstName] หวังว่าจะมารับใช้ท่านได้เป็นอย่างดี"
 martial_chivalry.0001.b:0 "ชาวนาผู้นี้ — และทหารของข้า — จะได้รับการบรรยายเรื่องเกียรติยศ"
 martial_chivalry.0001.b.tt:1 "ทหารของท่านก็จะได้รับประโยชน์จากการอธิบายถึงสิ่งที่ถูกและผิดในการต่อสู้ส่วนตัว เช่นกัน"
 martial_chivalry.0001.c:0 "ข้าฟัน[duel_opponent.GetHerHim]ลงตรงที่[duel_opponent.GetSheHe]ยืนอยู่"
 martial_chivalry.0001.c.tt:0 "การตัดศีรษะในดาบเดียวเป็นวิธีที่แน่นอนในการสร้างความประทับใจให้กับทหารราบ — และขุนนาง — ที่อยู่ ณ ที่นั้น"


 #Horse Riding Accident, by Petter Vilberg
 martial_chivalry.0002.t:0 "ความตกใจอย่างกะทันหัน"
 martial_chivalry.0002.desc:0 "ข้าขี่ม้า เล็งเป้า และฟันมาหลายครั้งจนคิดว่าไม่มีอะไรจะมารบกวนจังหวะของข้าได้ ขณะที่ข้าควบม้าไปตามสนามฝึกอีกครั้ง ความโกลาหลที่ข้ามองไม่เห็นทั้งหมด ทำให้ม้าของข้าผงาดขึ้น\n\nชั่วขณะหนึ่ง แรงเฉื่อย ทำให้ข้าติดอยู่กับหลังม้าขณะที่มันเริ่มสั่น จากนั้น ราวกับว่าเวลาไหลช้าลง ข้าสัมผัสได้ว่าตัวเองกำลังจะหลุดออกจากหลังม้า"
 martial_chivalry.0002.a:0 "ใจเย็นๆ [ROOT.Char.Custom('RandomGirlBoy')]! ใจเย็นๆ!"
 martial_chivalry.0002.a_success:0 "ท่านทรงตัวอยู่บนหลังม้าได้"
 martial_chivalry.0002.a_failure:0 "ท่านถูกเหวี่ยงตกจากหลังม้า"
 martial_chivalry.0002.increase_horse_mastery:1 "ความเชี่ยวชาญในการขี่ม้าของข้าเพิ่มขึ้น และพร้อมกันนั้นความเชี่ยวชาญใน[martial_lifestyle|E]ของข้าก็เพิ่มขึ้นด้วย"
 martial_chivalry.0002.b:0 "ข้ากระโดดลงสู่พื้นดินที่มั่นคง — ปลอดภัยไว้ก่อนดีกว่า!"

 martial_chivalry.0003.t:0 "อยู่ในการควบคุม"
 martial_chivalry.0003.desc:0 "ข้ารู้สึกว่าตัวเองถูกเหวี่ยงไปทางซ้ายและขวา แต่ไม่มีการเคลื่อนไหวใดสามารถ ทำให้ข้าคลายการจับบังเหียนและอานม้าได้\n\nในที่สุดคำสั่งของข้าก็ ทำให้ม้าสงบลง และในไม่ช้าสัตว์ตัวนั้นก็กลับมากระทืบเท้าอย่างกระตือรือร้นบนพื้นดินที่อัดแน่น มั่นคงเหมือนเคย"
 martial_chivalry.0003.a:0 "ช่างเป็นสัตว์ที่ทรงพลัง"
 martial_chivalry.0003.b:0 "ข้าจะดูแลฝึกฝนตัวนี้เป็นการส่วนตัว"
 martial_chivalry.0003.a.tt:1 "หากไม่มีอะไรอื่น เหตุการณ์นี้ได้สอนท่านเกี่ยวกับการควบคุมม้าเพิ่มขึ้นเล็กน้อย"

 martial_chivalry.0004.t:0 "การแสดงที่ไม่น่าดู"
 martial_chivalry.0004.desc:1 "ข้าถูกเหวี่ยงลงบนพื้นดินที่อัดแน่น ความเจ็บปวดจากการกระแทกแล่นผ่านกระดูกทุกชิ้นในร่างกายของข้า\n\nเด็กดูแลคอกม้าวิ่งมาสายไปเล็กน้อย"
 martial_chivalry.0004.a:0 "ไอ้สัตว์ร้าย!"

 martial_chivalry.0005.t:0 ""ช่างเป็นวันที่แย่สำหรับการขี่ม้า""
 martial_chivalry.0005.desc:1 "เด็กดูแลคอกม้าพยายามช่วยข้าลุกขึ้นยืน แต่ข้าตะโกนให้เขาหยุด\n\nการกระแทกพื้นส่งความเจ็บปวดแล่นไปทั่วทั้งร่าง และบาดแผลเก่าของข้าก็ปวดร้าวยิ่งกว่าตอนที่มันยังสดใหม่!"
 martial_chivalry.0005.a:0 "ข้าไม่ควรลุกจากเตียงในวันนี้เลย"

 martial_chivalry.0006.t:0 "เกิดอะไรขึ้น?"
 martial_chivalry.0006.desc:1 "ข้าจำไม่ได้ว่าข้าลงมาบนพื้นได้อย่างไร ข้ารู้เพียงความเจ็บปวดแสบไปทั่วทั้งร่าง ใบหน้าที่ไม่ชัดเจนรวมตัวกันรอบๆ มองลงมาที่ข้า\n\nทุกอย่างมืดลง"
 martial_chivalry.0006.a:0 "ข้ามาอยู่บนเตียงได้อย่างไร? ม้าของข้าอยู่ที่ไหน?"

 martial_chivalry.0007.t:0 "อาณาจักรของข้าเพื่อม้าตัวหนึ่ง"
 martial_chivalry.0007.desc:0 "ข้าคิดว่าการขี่ม้าจะ ทำให้ข้ารู้สึกดีขึ้น การออกแรงเล็กน้อยจะช่วยให้ข้าหายดี ขณะที่ข้าร่วงหล่นลงมาในอากาศ ความเจ็บปวดจากบาดแผลของข้าหายไปชั่วขณะหนึ่งของความไร้น้ำหนัก มันเป็นความรู้สึกที่ดีที่สุดที่ข้าเคยรู้สึกมาหลายสัปดาห์\n\nขณะที่ข้ากระแทกลงกับพื้น ข้าไม่จำเป็นต้องกังวลเกี่ยวกับความเจ็บปวด หรือความกังวลทางโลกอื่นใดอีกต่อไป"
 martial_chivalry.0007.a:0 "สิ่งใดรออยู่เบื้องหน้า?"

 #Train with your signature weapon, by Linnéa Thimrén
 martial_chivalry.0010.t:0 "วิถีแห่ง[ROOT.Char.Custom('signature_weapon')|U]"
 martial_chivalry.0010.desc:0 "เสียงโลหะกระทบโลหะที่ไม่สิ้นสุด การเสียดสีของเกราะ ความแสบของเหงื่อ... มันคือการร่ายรำที่คุ้นเคยพอๆ กับที่เหน็ดเหนื่อย การ[ROOT.Char.Custom('SignatureWeaponAction')] [ROOT.Char.Custom('signature_weapon')]ของข้า โจมตี หลบหลีก ป้องกัน และทำซ้ำ\n\nบางทีการฝึกฝนทักษะของข้าด้วยอาวุธอื่นอาจเป็นผลดีต่อข้า"
 martial_chivalry.0010.a:0 "ข้าและ[ROOT.Char.Custom('signature_weapon')]ที่ข้าไว้วางใจจะไม่แยกจากกัน"
 martial_chivalry.0010.b:0 "มาหยุดความจำเจนี้กันเถอะ ส่งอาวุธอื่นมาให้ข้า!"
 martial_chivalry.0010.b.tt1:1 "ท่านแสดงให้พวกเขาเห็นว่าทำอย่างไร"
 martial_chivalry.0010.b.tt2:1 "ท่านสะดุดและบาดเจ็บ"


 #Find an old castle, by Linnéa Thimrén 
 martial_chivalry.1011.t:0 "ที่พักสำหรับผู้เหนื่อยล้า"
 martial_chivalry.1011.desc:0 "เหงื่อท่วม เหนื่อยล้า และต้องการอาหาร วันอันยาวนานของการฝึกกับกองทหารกำลังจะสิ้นสุดลง\n\nขณะที่เรามองหาสถานที่ตั้งค่าย เราเห็นปราสาทเก่าแก่และร้างอยู่ไกลๆ [ROOT.Char.Custom('quirk_pos_personal_pp')|U] ข้าประกาศว่า "นั่นคือที่ที่เราจะตั้งค่ายในคืนนี้"\n\nดวงอาทิตย์กำลังตกดิน และทุกย่างก้าวที่มุ่งสู่ซากปรักหักพังนั้นดูน่ากลัวยิ่งขึ้น ไม่นานนัก ทหารก็เริ่มกระซิบกระซาบเกี่ยวกับผี"
 martial_chivalry.1011.a:0 "เข้าไปข้างในกันเถอะ ข้ามั่นใจว่ามีสมบัติให้ค้นหา!"
 martial_chivalry.1011.a.tt:0 "ใครจะรู้ว่าท่านจะพบอะไรข้างใน?"
 martial_chivalry.1011.b:0 "กางเต็นท์ข้างนอกกันเถอะ ถึงเวลาพักผ่อนแล้ว"

 martial_chivalry.1012.t:0 "ค้นหาสิ่งที่ไม่รู้จัก"
 martial_chivalry.1012.desc:0 "ความมืด ความชื้น และความอ้างว้างครอบงำอยู่ภายในปราสาท และร่องรอยของชีวิตทั้งหมดหายไป\n\nเมื่อมองขึ้นไปบนบันไดที่ผุพัง ข้าเห็นสิ่งที่อาจเป็นเศษซากของพรมที่หรูหราและภาพวาดเก่าๆ เมื่อมองลงไปตามขั้นบันไดที่วนลงไป ข้าเห็นเพียงความมืดที่ทอดลึกลงไปในพื้นดินใต้ปราสาท"
 martial_chivalry.1012.a:0 "เราค้นหาชั้นบน!"
 martial_chivalry.1012.a.success:1 "เราพบสมบัติล้ำค่า"
 martial_chivalry.1012.a.failure:1 "เราพบเครื่องประดับเล็กๆ น้อยๆ"
 martial_chivalry.1012.b:0 "สิ่งใดอาจซ่อนอยู่ในความมืดเบื้องล่าง?"
 martial_chivalry.1012.b.tt1:1 "#F "ข้าสาบานว่าเงาเมื่อครู่ขยับ! นั่น... เลือดหรือเปล่า? เสียงอะไรน่ะ?!"#!"
 martial_chivalry.1012.b.success:1 "ท่านเผชิญหน้ากับความกลัวของท่าน"
 martial_chivalry.1012.b.failure:1 "สถานที่นี้ ทำให้ท่านหวาดกลัว"

 martial_chivalry.1021.t:0 "ความโกลาหลของการรบ"
 martial_chivalry.1021.desc:1 "ดาบฟาดผ่านแผ่นเกราะอกของข้า ข้อศอกกระแทกเข้ากับหมวกเกราะของข้า ทหารคนหนึ่งหลบการโต้กลับอันงุ่มง่ามของข้าได้อย่างง่ายดาย... การรบจำลองดำเนินไปรอบตัวข้า แต่ข้าพยายามหาจุดสนใจ\n\nข้าอยากจะลดการป้องกันลงทันทีที่การต่อสู้สงบลง แต่ข้ารู้ว่าการโจมตีครั้งที่สองกำลังจะเริ่มขึ้น"
 martial_chivalry.1021.a:0 "ข้าจะถอยไปสักครู่"
 martial_chivalry.1021.b:0 "เผชิญหน้ากับการโจมตีโดยตรง!"
 martial_chivalry.1021.b.success:0 "การบุกของข้าน่าเกรงขาม"
 martial_chivalry.1021.b.failure:0 "ข้าสะดุดและบาดเจ็บ"


 #Practice duel (Prowess skill challenge), Petter Vilberg
 martial_chivalry.2010.t:0 "การท้าทาย"
 martial_chivalry.2010.start.desc:1 "ข้ากำลังซ้อมรบกับทหารคนหนึ่งของข้า เหงื่อไหลหยดบนหน้าผาก เมื่อข้าสัมผัสได้ถึงความรู้สึกแปลกประหลาดว่าถูกจับตามอง เมื่อมองข้ามไหล่ไป ข้าเห็น[challenger.Custom2('MyCharacterIntroduction', ROOT.Char)],"
 martial_chivalry.2010.like.desc:0 "ผู้โบกมือให้ข้า ข้าเดินเข้าไปทักทาย[challenger.GetHerHim]\n\nเราพูดคุยเกี่ยวกับการฝึกอาวุธของเราสักพัก แลกเปลี่ยนเคล็ดลับและคำแนะนำ ขณะที่ข้ากำลังจะจากไปเพื่อฝึกอีกรอบ ใบหน้าของ[challenger.GetTitledFirstNamePossessive]ก็สว่างขึ้นและ[challenger.GetSheHe]เสนอให้เราฝึกด้วยกัน"
 martial_chivalry.2010.dislike.desc:0 "จ้องมองข้าขณะแกว่ง[challenger.Custom('signature_weapon')]ของ[challenger.GetHerHis]ไปมาอย่างไม่ใส่ใจ\n\n"[ROOT.Char.GetTitleTierName]ของข้า!" คำพูดของ[challenger.GetFirstNamePossessive]ดังไปทั่วลาน "ท่านไม่ต้องการทดสอบทักษะของท่านกับข้าแทนหรือ?""
 martial_chivalry.2010.a:0 "รับคำท้า!"
 martial_chivalry.2010.a.success.tt:1 "ท่านชนะการประลองฝึกซ้อม"
 martial_chivalry.2010.b:0 "ข้าไม่อยาก..."
 martial_chivalry.2010.a.failure1.tt:0 "[challenger.GetShortUINameNoTooltip] ได้เปรียบในการประลอง"
 martial_chivalry.2010.a.failure2.tt:1 "ท่านแพ้การประลองฝึกซ้อม"

 martial_chivalry.2011.t:0 "ความได้เปรียบ"
 martial_chivalry.2011.start.desc:0 "เสียง[ROOT.Char.Custom('signature_weapon')]กระทบกับ[challenger.Custom('signature_weapon')]ดังก้องไปมาระหว่างกำแพงลาน ทุกสายตาจับจ้องมาที่เรา ทุกคนต้องการเห็น[ROOT.Char.GetTitleTierName]ของพวกเขาต่อสู้กับ[ROOT.Char.Custom2('RelationToMe', SCOPE.sC('challenger'))]ของ[ROOT.Char.GetHerHis]\n\n"
 martial_chivalry.2011.end.desc:0 "ฝูงชนปรบมือขณะที่ข้าพุ่งเข้าใส่ และความชื่นชมของพวกเขา ทำให้ข้ากล้าหาญ แทนที่จะถอยกลับ ข้าลองใช้เทคนิคใหม่ที่ข้าฝึกฝนมา การเคลื่อนไหวไหลผ่านตัวข้าและเข้าสู่[ROOT.Char.Custom('signature_weapon')]ของข้าราวกับว่าเราเป็นหนึ่งเดียวกัน [challenger.GetTitledFirstName]ไร้ทางป้องกันต่อหน้าข้า"
 martial_chivalry.2011.a:0 "จบกันแค่นี้เถอะ! สู้ได้ดีมาก"
 martial_chivalry.2011.b:0 "ข้าจะแสดงให้[challenger.GetHerHim]เห็นว่าอย่ามาท้าทายข้าอีก!"

 martial_chivalry.2012.t:2 "[challenger.Custom('SignatureWeaponArticle')|U] [challenger.Custom('signature_weapon')|U] จ่อคอข้า"
 martial_chivalry.2012.end.desc:1 "ข้าคงเหนื่อยจากการฝึกครั้งก่อน เพราะข้าเคลื่อนไหวเชื่องช้า ไม่สามารถตามคู่ต่อสู้ได้ทัน เมื่อข้าพุ่งเข้าใส่ [challenger.GetSheHe]ก็หายไปแล้ว และการปัดป้องของข้าก็มาถึงในวินาทีสุดท้าย ไม่นานนักข้าก็พบว่าตัวเองอยู่บนพื้นต่อหน้า[challenger.GetHerHim]"
 martial_chivalry.2012.a:0 "ข้ายอมแพ้! สู้ได้ดีมาก"
 martial_chivalry.2012.b:0 "มี แต่คนขี้ขลาดเท่านั้นที่ยอมจำนน!"
 martial_chivalry.2012.b.failure.tt:1 "#F ท่านแพ้การประลองฝึกซ้อม#!"
 
 martial_chivalry.2013.t:0 "ความอัปยศอันนองเลือด"
 martial_chivalry.2013.end.desc:0 "ด้วยการใช้กลอุบายสกปรก [challenger.GetFirstName]ได้เปรียบตั้งแต่เนิ่นๆ ไม่มีเวลาคัดค้าน และข้าก็ไม่อยากทำตัวเหมือนคนขี้บ่น แต่ข้าปล่อยมันไปไม่ได้ และความหงุดหงิดของข้า ทำให้ข้าเสียสมดุล ข้าพุ่งเข้าใส่อย่างไม่รอบคอบและคู่ต่อสู้ของข้าก็ฟันข้าลงกับพื้น"
 martial_chivalry.2013.a:0 "เจ้า [challenger.Custom2('InsultNoun', ROOT.Char)] คดโกงนั่น!"
 
 martial_chivalry.2014.t:0 "ฝ่าฟันอุปสรรค"
 martial_chivalry.2014.desc:0 "ตัดสินจากเสียงอุทานจากฝูงชน พวกเขาแทบไม่เชื่อสายตาตัวเองขณะที่ข้าม้วนตัวหลบ[challenger.Custom('signature_weapon')]ของ[challenger.GetFirstNamePossessive]และปลดอาวุธ[challenger.GetHerHim]ในการเคลื่อนไหวที่รวดเร็วเพียงครั้งเดียว ข้ารู้ว่ามันเป็นการเคลื่อนไหวที่อันตราย แต่บางครั้งท่านก็ต้องเสี่ยงอย่างมาก เพื่อให้ได้ชัยชนะอันรุ่งโรจน์"
 martial_chivalry.2014.a:0 "ชัยชนะของข้าจะไม่มีวันถูกลืมเลือนในเร็ววัน!"

 martial_chivalry.2015.t:0 "การเยาะเย้ยในที่สาธารณะ"
 martial_chivalry.2015.desc:0 "ข้าทำการโจมตีครั้งสุดท้ายอย่างสิ้นหวัง แต่[challenger.GetFirstName]รวดเร็ว [challenger.GetSheHe|U]ปัดป้องตามสัญชาตญาณ แต่ เนื่องจากการโจมตีของข้าไม่คาดฝัน [challenger.GetSheHe]จึงไม่สามารถควบคุมอาวุธของ[challenger.GetHerHis]ได้อย่างเต็มที่ ความเจ็บปวดจนชาแล่นผ่านแขนของข้า"
 martial_chivalry.2015.a:0 "ทำไมข้าถึงทำ เช่นนั้น?!"

 #Vassal struggling to train new recruits, Sean Hughes
 martial_chivalry.3000.t:0 "ทหารใหม่ที่ไร้วินัย"
 martial_chivalry.3000.desc:0 "วันนี้ข้ากำลังสังเกตการณ์[bad_commander.GetTitledFirstName]ขณะที่[bad_commander.GetSheHe]ฝึกทหารใหม่บางส่วนของ[bad_commander.GetHerHis] แต่ภายใต้คำสั่งของ[bad_commander.GetHerHis] พวกเขาดูเหมือนกลุ่มคนที่ไร้ระเบียบมากกว่ากองทัพ\n\nข้ามองดูขณะที่[bad_commander.GetSheHe]พยายามควบคุมสถานการณ์ เห็นได้ชัดว่าถูกผลักดันจนถึงขีดจำกัดของ[bad_commander.GetHerHis]"
 martial_chivalry.3000.desc.callous:0 "การแสดงความไร้ความสามารถนี้เป็นความอับอายต่อ[ROOT.Char.GetPrimaryTitle.GetName]และไม่อาจทนได้!"
 martial_chivalry.3000.desc.compassionate:0 "เคยอยู่ในสถานการณ์นั้น ข้ารู้ว่ามันยากเพียงใดที่จะทำงานกับทหารที่ยังไม่ได้รับการฝึกฝน"
 martial_chivalry.3000.desc.fallback:1 "แม้ว่าการฝึกทหารใหม่จะไม่ใช่เรื่องง่าย แต่[bad_commander.GetSheHe]จำเป็นต้องทำได้ดีกว่านี้อย่างจริงจัง"
 martial_chivalry.3000.a:0 "ตำหนิ[bad_commander.GetHerHim]สำหรับความล้มเหลวของ[bad_commander.GetHerHis]"
 martial_chivalry.3000.b:0 "สอน[bad_commander.GetHerHim]ในสิ่งที่ข้ารู้เกี่ยวกับการบังคับบัญชา"
 martial_chivalry.3000.b.attempt:0 "[bad_commander.GetTitledFirstNameNoTooltip] จะตัดสินใจตามบุคลิกภาพของ[bad_commander.GetHerHis]"
 martial_chivalry.3000.b.tt.s:1 "[bad_commander.GetTitledFirstNameNoTooltip] ยอมรับคำแนะนำของท่าน"
 martial_chivalry.3000.b.tt.f:0 "[bad_commander.GetTitledFirstNameNoTooltip] ปฏิเสธที่จะฟัง"
 martial_chivalry.3000.c:0 "ให้กำลังใจ[bad_commander.GetHerHim]หลังจากการฝึกสิ้นสุดลง"

 martial_chivalry.3000.response.desc:0 "[my_liege.GetTitledFirstName] แวะมาสังเกตการณ์ข้าในวันนี้ขณะที่ข้ากำลังฝึกทหารเกณฑ์ใหม่ของข้า\n\nน่าอับอายที่ทหารไร้วินัยของข้ากลายเป็นกลุ่มคนที่ไร้ระเบียบขณะพยายามทำแบบฝึกหัดให้เสร็จ!"
 martial_chivalry.3001.t:0 "ถูก ทำให้อับอาย!"
 martial_chivalry.3001.desc:0 "ที่แย่ไปกว่านั้น [my_liege.GetFirstName]กล่าวโทษข้าเป็นการส่วนตัวสำหรับความล้มเหลวนี้"
 martial_chivalry.3001.a:0 "ลงโทษทหารเกณฑ์เหล่านั้นที่ ทำให้ข้าดูแย่!"
 martial_chivalry.3001.b:0 "ข้าต้องทำได้ดีกว่านี้ เพื่อประโยชน์ของอาณาจักร"
 martial_chivalry.3001.c:0 "ข้า ทำให้[my_liege.GetTitledFirstNameNoTooltip]ผิดหวัง"

 martial_chivalry.3002.t:0 "การแทรกแซง"
 martial_chivalry.3002.desc:0 "ตอนนี้[my_liege.GetFirstName]กำลังบรรยายให้ข้าฟังเกี่ยวกับพื้นฐานของการฝึกทหารใหม่!"
 martial_chivalry.3002.a:0 "ยอมรับคำแนะนำของ[my_liege.GetFirstNamePossessiveNoTooltip]อย่างสง่างาม"
 martial_chivalry.3002.b:0 "สาปแช่งพวกไพร่ไร้ระเบียบนั่นที่ ทำให้ข้าดูแย่!"

 martial_chivalry.3003.t:0 "ยอมรับคำแนะนำ"
 martial_chivalry.3003.desc.1:0 "ข้าดึง[bad_commander.GetTitledFirstName]ไปด้านหนึ่งขณะที่ทหารเกณฑ์ของ[bad_commander.GetHerHis]พยายามฝึกต่อไป "สิ่งสำคัญในการฝึกทหารใหม่คือการปลูกฝังวินัย!" ข้าบอก[bad_commander.GetHerHim] "หากไม่มีสิ่งนั้น ท่านจะไม่สามารถพึ่งพาพวกเขาให้ปฏิบัติตามคำสั่งของท่านได้...""
 martial_chivalry.3003.desc.2:0 "\n\nหลังจากข้าพูดจบ [bad_commander.GetFirstName]ขอบคุณข้าก่อนที่จะเดินกลับไปที่สนาม ซึ่ง[bad_commander.GetSheHe]ควบคุมสถานการณ์ได้อย่างรวดเร็ว"
 martial_chivalry.3003.a:0 "สิ่งนี้จะ ทำให้[bad_commander.GetFirstNameNoTooltip]เป็นผู้บัญชาการที่ดีขึ้น"

 martial_chivalry.3004.t:0 "ปฏิเสธคำแนะนำ!"
 martial_chivalry.3004.desc:0 "ขณะที่ข้าแตะไหล่ของ [bad_commander.GetTitledFirstName] [bad_commander.GetSheHe] ก็ยกมือของ [bad_commander.GetHerHis] ขึ้นและตะโกนว่า "นี่ #EMP ไม่ใช่#! ความผิดของข้า [ROOT.Char.GetFirstNameNoTooltip]! พวกชาวนาโง่เง่าเหล่านี้ไม่รู้ว่ามือขวาอยู่ไหนมือซ้ายอยู่ไหน! ใครจะคาดหวังให้เปลี่ยนฝูงชนไร้ระเบียบนี้ให้เป็นกองทัพได้!?""
 martial_chivalry.3004.b:0 "[bad_commander.GetTitledFirstNameNoTooltip] จะต้องเสียใจกับการแสดงความโอหังนี้!"
 martial_chivalry.3004.a:0 "ข้าผิดหวังในตัว[bad_commander.GetTitledFirstNameNoTooltip]"

 martial_chivalry.3005.t:0 "การปลอบใจ"
 martial_chivalry.3005.desc:0 "ข้าโล่งใจที่[my_liege.GetFirstName]เข้ามาหาข้าหลังจากการฝึกเพื่อปลอบใจและให้กำลังใจในความพยายามของข้า"
 martial_chivalry.3005.a:0 "[my_liege.GetSheHe|U] มีสิทธิ์ที่จะตำหนิข้า แต่ก็ไม่ได้ทำ"

 martial_chivalry.4000.t:0 "การขี่ม้ายามเที่ยงคืน"
 martial_chivalry.4000.desc:0 "เสียงของคนรับใช้ฉุดข้าออกจากความฝัน\n\n"โจร! ผู้บุกรุก!" [ROOT.Char.GetSheHe] กรีดร้อง "[ROOT.Char.GetTitleAsNameNoTooltip]ของข้า มีนักรบหนุ่มกำลังนำฝูงสัตว์ของท่านเข้าไปในความมืด ต้อนพวกมันอย่างหนักไปยังดินแดนของ[raiders.GetTitledFirstName]!"\n\nเมื่อถูกปลุก $knight_culture_player_plural_no_tooltip_lowercase$ ของข้าก็ล้มลุกคลุกคลานจากเตียงและรีบวิ่งไปที่อานม้า ข้าเข้าใกล้ม้าของข้า [ROOT.Char.Custom('signature_weapon')]ในมือ\n\n เวลาก็ดึกแล้วและมีระยะทางอีกไกลที่ต้องเดินทาง"
 martial_chivalry.4000.sleepy:0 "\n\nความคิดของข้าล่องลอยกลับไปที่เตียงนุ่มๆ อุ่นๆ..."
 martial_chivalry.4000.angry:0 "แต่ต้องหยุดพวกโจรให้ได้!"
 martial_chivalry.4000.a:0 "เมื่อถูกล้อมรอบ พวกโจรจะตื่นตระหนก"
 martial_chivalry_special.4000.a.tt:0 "ท่านนำนักขี่ม้าของท่านในการขี่ม้าเร็วกว่าและล้อมรอบพวกขโมยวัวควาย"
 martial_chivalry_special.4000.a.tt_success:0 "การโต้กลับของท่านได้ผลอย่างสมบูรณ์แบบ"
 martial_chivalry_special.4000.a.tt_failure:0 "พวกโจรต่อสู้ขับไล่ท่านออกไป"
 martial_chivalry_special.4000.a.tt_failure_2:0 "ท่านหรือหนึ่งใน$knight_culture_player_plural_no_tooltip$ของท่านได้รับบาดเจ็บ"
 martial_chivalry.4000.b:0 "ข้าจะฟันหัวหน้าผู้โอหังของพวกมันให้ตาย!"
 martial_chivalry_special.4000.b.tt:0 "ไม่มีใครสามารถขี่ม้าเร็วกว่าหรือต่อสู้เก่งกว่า[ROOT.Char.GetTitledFirstNameNoTooltip]ได้!"
 martial_chivalry_special.4000.b.tt_success:0 "ท่านหลั่งเลือดเพื่อปศุสัตว์ของท่าน"
 martial_chivalry_special.4000.b.tt_failure:0 "เด็กหนุ่มขโมย ทำให้ท่านอับอาย"
 martial_chivalry_special.4000.b.tt_critical_failure:0 "ท่านถูกกระแทกตกจากอานม้า... และถูกเหยียบย่ำ"
 martial_chivalry_special.4000.b.tt_critical_failure_2:0 "ท่านได้รับบาดเจ็บสาหัส"
 martial_chivalry.4000.c:0 "ม้าของข้าและข้าคิดเหมือนกัน: "ไม่ใช่คืนนี้""
 martial_chivalry_special.4000.c.tt:0 "ท่านจะจับพวกขโมยวัวควาย #EMP บางส่วน#! ได้แน่นอน หลังจากที่ท่านได้นอนหลับฝันดีแล้ว"

 #Mounted Warrior Practice, by Petter Vilberg
 martial_chivalry_special.1201.t:0 "การฝึก[ROOT.Char.Custom('MountedWarriorAdjective')|U]"
 martial_chivalry_special.1201.desc:0 "เสียงเกราะกระทบกันและเสียงดาบปะทะกันดังอยู่ในหูของข้าขณะที่[ROOT.Char.Custom('MountedWarriorTermPlural')]ของข้าฝึกอาวุธ ข้าศึกษาพวกเขาอย่างตั้งใจ พยายามตรวจสอบจุดแข็งและจุดอ่อนเฉพาะของ แต่ละคน\n\nพวกเขาแทบไม่มีเวลาพักผ่อน เพราะทันทีที่ระฆังดังขึ้นเพื่อส่งสัญญาณสิ้นสุดการตะลุมบอนจำลอง ประตูคอกม้าก็เปิดออก ถึงเวลาที่จะนำม้าออกมา"
 martial_chivalry_special.1201.a:0 "วันนี้เราจะไปขี่ม้าในทุ่ง!"
 martial_chivalry_special.1201.a.tt:2 "การฝึกรูปแบบกับ[ROOT.Char.Custom('MountedWarriorTermPlural')]ของท่านสามารถช่วยปรับปรุงความเชี่ยวชาญของท่านใน[martial_lifestyle|E]ได้"
 martial_chivalry_special.1201.b:0 "นำเกราะมาให้ข้า ข้าไม่ได้ขี่ม้าชนเป้าซ้อมรบมานานแล้ว!"
 martial_chivalry_special.1201.b.tt:1 "\nการออกกำลังกายจนถึงพระอาทิตย์ตกดินจะไม่ช่วยปรับปรุงความเข้าใจในกลยุทธ์ของท่าน แต่มันจะ ทำให้ท่าน #EMP แข็งแกร่ง#!"

 martial_chivalry_special.1202.t:1 "การฝึก[ROOT.Char.Custom('MountedWarriorAdjective')|U]: ทิวทัศน์บนยอดเขา"
 martial_chivalry_special.1202.desc:0 "[soldier.GetTitledFirstName] เหลือบมองทุ่งโคลนที่ด้านล่างของเนินเขา "สิ่งเหล่านั้นสามารถใช้เป็นโครงร่างของกองทัพศัตรูได้" [soldier.GetSheHe] กล่าว\n\nข้าแจ้ง[ROOT.Char.Custom('MountedWarriorTermPlural')]ของข้าขณะที่ข้าตรวจสอบแนวรบของพวกเขา เตรียมพวกเขาให้พร้อมสำหรับกลยุทธ์ในมือ"
 martial_chivalry_special.1202.a:0 "ข้าควรตัดเฉียงและนำ[ROOT.Char.Custom('MountedWarriorTermPlural')]เข้าสู่ 'ปีก'"
 martial_chivalry_special.1202.b:0 "#EMP บุกกกก!#!"
 martial_chivalry_special.1202.b_success:0 "การบุกดำเนินไปได้ด้วยดี"
 martial_chivalry_special.1202.b_failure:0 "การบุกเป็นหายนะ"

 martial_chivalry_special.1203.t:1 "การฝึก[ROOT.Char.Custom('MountedWarriorAdjective')|U]: การโจมตีที่แม่นยำ"
 martial_chivalry_special.1203.desc:0 "พายุแห่งกีบเท้ารอบตัวข้า เสียงตะโกนของนักรบบนหลังม้า แรงผลักดันที่ไม่ยอมแพ้ของพวกเขา การขี่ม้าเป็นผู้นำ ทำให้รู้สึกราวกับว่าข้าเป็นผู้นำของพลังธรรมชาติ อย่างไรก็ตาม นี่คือพลังที่ข้าชี้นำ ที่ตอบสนองต่อคำสั่งเล็กๆ น้อยๆ ทุกคำสั่งของข้า ที่ข้าบัญชาการราวกับว่ามันเป็นส่วนขยายของตัวข้าเอง\n\nการบุกเข้าสู่ปีกของกองทัพในจินตนาการ [ROOT.Char.Custom('MountedWarriorTermPlural')]ของข้าไม่เคยออกนอกแผนของข้า ข้ารู้ว่านี่คือวิธีที่ข้านำความพินาศอย่างสิ้นเชิงมาสู่ศัตรูของข้า"
 martial_chivalry_special.1203.a:0 "นี่คือความรู้สึกของชัยชนะ"

 martial_chivalry_special.1204.t:1 "การฝึก[ROOT.Char.Custom('MountedWarriorAdjective')|U]: ความโกรธเกรี้ยวของสัตว์ร้าย"
 martial_chivalry_special.1204.desc:0 "ข้า[ROOT.Char.Custom('SignatureWeaponAction')] [ROOT.Char.Custom('signature_weapon')]ของข้า และนำนักขี่ม้าในการวิ่งอย่างบ้าคลั่งลงเนินเขา อย่างไรก็ตาม ท่ามกลางความโกลาหลที่ดูเหมือนของการเปลี่ยนเกราะ อาวุธที่ยกขึ้น และเสียงโห่ร้องในการรบ มีแผนอยู่ ขณะที่เราพุ่งเข้าชนกองทัพในจินตนาการในสนามด้านล่าง ทหารทุกคนหาตำแหน่งของตนในแนวรบของเรา เตรียมการโจมตี ถอยกลับ บิดบังเหียน และกระโดดกลับเข้าสู่การต่อสู้\n\nเราจะพุ่งเข้าใส่ศัตรูของเราเหมือนพลังธรรมชาติ และพวกเขาจะแตกสลายเหมือนต้นไม้ก่อนพายุ"
 martial_chivalry_special.1204.a:0 "เราจะฟันทุกคนในเส้นทางของเรา!"


 #Train a warhorse, by Linnéa Thimrén
 martial_chivalry_special.1601.t:0 "การฝึกม้าศึก"
 martial_chivalry_special.1601.desc:1 "ขณะที่ข้าตรวจคอกม้า สายตาของข้าก็จับจ้องไปที่ [dummy_gender.Custom('HorseMareStallion')] ตัวหนึ่งที่ถูกแยกไว้ห่างจากตัวอื่น ๆ ทั้งหมด [dummy_gender.GetSheHe|U] สะบัดศีรษะของ [dummy_gender.GetHerHis] และกระทืบกีบเท้าของ [dummy_gender.GetHerHis] แสดงให้เห็นถึงสะโพกที่ทรงพลังและคอที่โค้งสวยงาม สิ่งมีชีวิตนี้มีรูปร่างที่ดีที่สุดและอารมณ์ร้ายที่สุด\n\nข้าไม่เคยเห็นม้าศึก เช่นนี้มาก่อน แต่นายคอกม้ายืนยันว่า [dummy_gender.GetSheHe] เป็นไปไม่ได้ที่จะฝึก"
 martial_chivalry_special.1601.a:0 "ข้าไม่ใช่คนที่จะถอยหนีจากความท้าทาย!"
 martial_chivalry_special.1601.b:0 "ม้าชั้นดี เช่นนี้จะขายได้ราคาสูง"
 martial_chivalry_special.1601.c:1 "เจ้าของคอกม้าของข้าจะได้เรียนรู้มากมายจากการฝึก[dummy_gender.GetHerHim]ให้เชื่อง"
 martial_chivalry_special.1601.a.tt:1 "ม้าอาจกลายเป็นม้าส่วนตัวของท่าน"
 martial_chivalry_special.1601.d:0 "[m_horse.GetTitledFirstNameNoTooltip] มิใช่หรือที่เป็นผู้เชี่ยวชาญเรื่องม้า?"
 martial_chivalry_special.1601.d.tt:0 "$master_of_horse_court_position$ของท่านจะพยายามฝึกสัตว์ให้เชื่อง หากพวกเขาทำสำเร็จ ม้าจะกลายเป็นม้าส่วนตัวของท่าน"

 martial_chivalry_special.1603.desc:1 "ม้าลู่หูไปข้างหลังขณะที่ข้าเข้าใกล้ การไม่ใส่ใจข้าของ[dummy_gender.GetHerHis]ชัดเจนแจ่มแจ้ง การพบกันครั้งแรกนี้สำคัญต่อการได้รับความไว้วางใจและความเคารพจาก[dummy_gender.GetHerHis] และข้าต้องตัดสินใจว่าจะทำอย่างไร"
 martial_chivalry_special.1603.a:0 "ต้องใช้มือที่มั่นคงในการฝึกสัตว์ร้ายตัวนี้ให้เชื่อง!"
 martial_chivalry_special.1603.a.tt:0 "มีแนวโน้มที่จะได้ผลดีกับทักษะ[prowess|E]สูงหรือบุคลิกที่กล้าหาญ"
 martial_chivalry_special.1603.b:0 "หากข้าอ่อนโยนและเคลื่อนไหวช้าๆ [dummy_gender.GetSheHe]จะไว้ใจข้า"
 martial_chivalry_special.1603.b.tt:0 "มีแนวโน้มที่จะได้ผลดีกับทักษะ[diplomacy|E]สูงหรือบุคลิกที่เมตตา"
 martial_chivalry_special.1603.c:0 "ทุกคนมีราคาของตัวเอง — นำแอปเปิ้ลออกมา!"
 martial_chivalry_special.1603.c.tt:0 "มีแนวโน้มที่จะได้ผลดีกับทักษะ[intrigue|E]สูงหรือบุคลิกที่ใจกว้าง"

 martial_chivalry_special.1604.desc_success:0 "มันเป็นความรู้สึกที่ยิ่งใหญ่ ม้าที่ทรงพลังทำตามความต้องการของข้าทุกอย่าง ตอนนี้ข้าได้รับความไว้วางใจจาก[dummy_gender.GetHerHis]แล้ว [dummy_gender.GetSheHe]ดูเหมือนจะชอบข้าด้วยซ้ำ"
 martial_chivalry_special.1604.desc_failure:0 "ไม่ว่าข้าจะพยายามอะไร ม้าก็ปฏิเสธที่จะฟัง ความพยายามของข้า ทำให้ทั้ง[dummy_gender.GetHerHim]และข้าเหงื่อออกและโกรธ และขณะที่ข้าออกจากคอกม้าในตอนเย็น ข้ารู้ว่าข้าจะไม่กลับมาในเร็วๆ นี้"
 martial_chivalry_special.1604.a:1 "ข้าจะเก็บ[dummy_gender.GetHerHim]ไว้เป็นม้าศึกส่วนตัวของข้า!"
 martial_chivalry_special.1604.a_2:0 "นี่เป็นรางวัล! ข้าจะทำอีกครั้ง"
 martial_chivalry_special.1604.b:0 "อย่างน้อยข้าก็ได้เรียนรู้ว่า #EMP ไม่ควร#! ทำอะไร..."
 martial_chivalry_special.1604.c:0 "เจ้านายของข้าจะพอใจ"
 martial_chivalry_special.1604.t:0 "ม้าเชื่องแล้ว"
 martial_chivalry_special.1604.succcess:0 "$master_of_horse_court_position$ของท่านได้ฝึกม้าเจ้าอารมณ์ของท่านให้เชื่องแล้ว!"
 martial_chivalry_special.1604.t.2:0 "ม้ายังไม่เชื่อง"
 martial_chivalry_special.1604.failure:0 "$master_of_horse_court_position$ของท่านล้มเหลวในการฝึกม้าให้เชื่อง"
 
 martial_chivalry.5000.t:0 "ข่าวลือที่ไม่มีมูล"
 martial_chivalry.5000.intro:0 "ไม่นานหลังจากตะวันลับขอบฟ้า [spymaster.Custom2('MyCharacterIntroduction', ROOT.Char)] ก็เข้ามาหาข้าระหว่างทางไปยังห้องนอน\n\n"[ROOT.Char.Custom('FormOfAddressForLiege')|U] ความองอาจของท่านเป็นที่รู้จักและชื่นชมในหมู่ข้าหลวง แต่ท่วงท่าสง่างามในราชสำนัก เช่นนั้นมักจะดึงดูดปฏิกิริยาอิจฉาริษยา แม้ แต่ตอนนี้ พวกเขาก็กระซิบกันว่าท่านมีเจตนาอื่นที่ลามกกว่านั้น""
 martial_chivalry.5000.desc.lustful:0 "\n\nแม้ว่าข้าจะไม่มีวันยอมรับ แต่ความจริงก็คือพวกเขาไม่ได้ห่างไกลจากความสงสัยของพวกเขาเลย..."
 martial_chivalry.5000.desc.honest_chaste:0 "\n\nใครจะเชื่อได้อย่างไรว่าข้าจะมีส่วนร่วมในพฤติกรรมที่น่าละอาย เช่นนี้?"
 martial_chivalry.5000.desc.fallback:0 "\n\nข้าเลิกคิ้ว — หากนั่นคือทั้งหมด เขาคงไม่ดูเป็นกังวลขนาดนั้น"
 martial_chivalry.5000.desc.outro:0 "\n\n"[ROOT.Char.Custom('FormOfAddressForLiege')|U] มีข่าวลือว่าท่าน... #EMP พัวพัน#! กับคู่ครองของ [my_liege.GetShortUINamePossessive]""
 martial_chivalry.5000.a:0 "ข้าจะปฏิเสธข้อกล่าวหาเหล่านี้ทันที!"
 martial_chivalry.5000.a.success:0 "ท่านโน้มน้าว[my_liege.GetFirstNameNoTooltip]ถึงเจตนาที่ซื่อสัตย์ของท่านได้"
 martial_chivalry.5000.a.failure:0 "[my_liege.GetFirstNameNoTooltip] ยังคงสงสัยท่านอยู่"
 martial_chivalry.5000.b:0 "การพูดถึงเรื่องนี้จะยิ่ง ทำให้เรื่องเป็นที่สนใจมากขึ้นเท่านั้น"
 martial_chivalry.5000.c:0 "ข้าต้องไปคุยกับ[my_liege.GetTitledFirstNameNoTooltip]ด้วยตัวเอง"
 martial_chivalry.5000.d:0 "แหม ถ้าเพียง แต่พวกเขาได้เห็นว่า[spouse.GetSheHe]มองข้าอย่างไร..."
 martial_chivalry.5000.d.tt:0 "สิ่งที่กล้าหาญที่สุดที่คนๆ หนึ่งสามารถทำได้คือการไล่ตามความรักต้องห้าม"
 martial_chivalry.5000.d.tt.warning:0 "@warning_icon! #X ยุติ[schemes|E]ส่วนตัวใดๆ ที่กำลังดำเนินอยู่#!"
 
 martial_chivalry.6000.t:0 "สู่[church_province.GetTerrain.GetNameNoTooltip]"
 martial_chivalry.6000.desc:0 "ป่าไม้เป็นสนามฝึกที่มีค่าเสมอมา ทุกคนรู้ว่าอัศวินผู้กล้าหาญทุกคนมักมองหาการผจญภัยใหม่ๆ อยู่เสมอ: ทรราชผู้ชั่วร้าย การทดลองลับ ผู้บริสุทธิ์ที่ต้องการความช่วยเหลือ\n\nข้าไม่เคยสำรวจส่วนนี้ของ[church_province.GetTerrain.GetNameNoTooltip|l]มาก่อน บางทีนั่นอาจเป็นสิ่งที่ ทำให้ซากปรักหักพังที่ปรากฏขึ้นอย่างกะทันหันดูเหมือนเป็นการทดสอบความกล้าหาญ\n\nโบสถ์แห่งนี้ถูกทิ้งร้างมานานหลายทศวรรษ ดูจากสภาพแล้ว ใยแมงมุมเข้ามาแทนที่กระจกบนหน้าต่าง ลำต้นที่หักกลายเป็นม้านั่งใหม่ นกบางตัวบินหนีไปเมื่อข้าเข้าใกล้ประตูที่ผุพัง"
 martial_chivalry.6000.a:0 "มีเพียงไม่กี่สิ่งที่น่าดึงดูดใจเท่ากับ[ROOT.Char.GetFaith.HouseOfWorship]ที่ยังไม่ได้สำรวจ!"
 martial_chivalry.6000.a.tt:0 "ท่านอาจพบบางสิ่งข้างใน"
 martial_chivalry.6000.b:0 "[bishop.Custom2('MyCharacterIntroduction', ROOT.Char)|U] จะชอบที่จะได้ยินเกี่ยวกับการค้นพบที่สำคัญ เช่นนี้"
 martial_chivalry.6000.c:0 "เราสามารถใช้สถานที่นี้เป็นห้องเก็บของใหม่ได้"
 ignored_church_modifier:0 "ที่เก็บของในโบสถ์ร้าง"
 
 martial_chivalry.6001.t:0 "สู่[church_province.GetTerrain.GetNameNoTooltip]: สัตว์ประหลาด!"
 martial_chivalry.6001.desc:0 "แท่นบูชาแทบจะจำไม่ได้ภายใต้ชั้นของธรรมชาติ รากและมอสส์ขึ้นปกคลุมก้อนหินอย่างไม่ปรานี เสียงใบไม้เสียดสีเบาๆ ข้างๆ มันให้ความรู้สึกสงบ หลอกลวง\n\nอ๊ะ! นั่นไม่ใช่เสียงที่ข้าคิดว่าข้าได้ยินหรือ!\n\nปรากฏว่ามันคือเสียงคำรามของ[ROOT.Char.Custom('GetAnimalType')] ดวงตาที่หิวโหยของมันจับจ้องมาที่ข้า"
 martial_chivalry.6001.a:0 "นี่คือจุดจบของเจ้า ไอ้ปีศาจ!"
 martial_chivalry.6001.a_success:0 "ท่านเอาชนะสัตว์ร้ายได้"
 martial_chivalry.6001.a_success_toast:0 "ชัยชนะที่ยุติธรรม!"
 martial_chivalry.6001.a_failure:0 "ท่านได้รับบาดเจ็บ"
 martial_chivalry.6001.a_failure_toast:0 "สัตว์ร้ายโต้กลับ!"
 martial_chivalry.6001.b:0 "ข้าจะพยายามแอบออกไป..."
 martial_chivalry.6001.b_success:0 "ท่านหนีจากการโจมตีได้"
 martial_chivalry.6001.b_success_toast:0 "ท่านหลบหนีได้สำเร็จ"
 martial_chivalry.6001.b_failure:0 "สัตว์ร้ายจับท่านได้"
 martial_chivalry.6001.b_failure_toast:0 "สัตว์ร้ายสังเกตเห็นท่าน"
 
 martial_chivalry.6002.t:0 "สู่[church_province.GetTerrain.GetNameNoTooltip]: สมบัติ!"
 martial_chivalry.6002.desc:0 "ต้นไม้ต้นหนึ่งเติบโตอยู่ด้านหลังแท่นบูชา เรือนยอดของมันเข้ามาแทนที่ส่วนที่พังทลายของหลังคา ข้างๆ กัน มีหีบไม้ที่ใครบางคนเพิ่งใช้งานไปไม่นาน ดูจากที่ไม่มีฝุ่นหรือเชื้อรา\n\nข้างในมีสมบัติเล็กๆ น้อยๆ"
 martial_chivalry.6002.a:0 "ข้าจะทะนุถนอมของขวัญอันศักดิ์สิทธิ์นี้"
 church_artifact_book:0 "คัมภีร์แห่งความชื่นชมในราชสำนัก"
 church_artifact_book_desc:0 "คัมภีร์ที่ประดับประดาอย่างหรูหรา ซึ่งมีแนวทางในการเป็นอัศวินที่สุภาพ พบในดินแดนศักดิ์สิทธิ์ของ[church_county.GetNameNoTooltip]"
 church_artifact_sword:0 "ดาบแห่งความศรัทธาอันศักดิ์สิทธิ์"
 church_artifact_sword_desc:0 "ดาบที่ประดับประดาอย่างหรูหรา มีคนแกะสลักคำอธิษฐานไว้ตามใบดาบ พบในดินแดนศักดิ์สิทธิ์ของ[church_county.GetNameNoTooltip]"
 church_artifact_dagger:0 "กริชแห่งคำอธิษฐานอันทรงพลัง"
 church_artifact_dagger_desc:0 "กริชที่ประดับประดาอย่างหรูหรา มีคนผูกเครื่องรางไว้ที่ด้ามจับ พบในดินแดนศักดิ์สิทธิ์ของ[church_county.GetNameNoTooltip]"
 martial_chivalry.6002.book:0 "นี่ฟังดูเหมือนการบรรยายที่สมบูรณ์แบบสำหรับอัศวิน!"
 martial_chivalry.6002.book_tt:0 "ท่านศึกษาคัมภีร์และวางมันกลับคืนสู่สถานที่ศักดิ์สิทธิ์"
 martial_chivalry.6002.b:0 "[bishop.Custom2('MyCharacterIntroduction', ROOT.Char)|U] จะชื่นชมของขวัญชิ้นนี้"
 martial_chivalry.6002.c:0 "การบูชารูปเคารพจอมปลอมนี้สมควรถูกเผา!"
 
 martial_chivalry.6003.t:0 "สู่[church_province.GetTerrain.GetNameNoTooltip]: ใครอยู่ที่นั่น...?"
 martial_chivalry.6003.desc_intro:0 "เงาร่างปรากฏขึ้นอย่างกะทันหันจนเกือบน่าสงสัย ใบหน้าของ[dummy_attracted_gender.GetHerHis|U]สะท้อนแสงอาทิตย์ตกและ ทำให้ดูเย็นชา\n\n"
 martial_chivalry.6003.desc_ugly:0 ""โอ้... ท่าน... ข้าคาดหวังอัศวิน #EMP ผู้กล้าหาญ#!..."\n\n[dummy_attracted_gender.GetSheHe|U]ใช้ผ้าเช็ดหน้าสีขาวปิดจมูกของ[dummy_attracted_gender.GetHerHis]\n\n"แต่ข้าเดาว่าท่านคงพอใช้ได้ ท่านช่วยพาข้ากลับไปที่ปราสาทได้หรือไม่?""
 martial_chivalry.6003.desc_pretty:0 ""อ้า อัศวินผู้กล้าหาญ ในที่สุดท่านก็มาช่วยข้าแล้วหรือ? ท่านจะกรุณาพาข้ากลับไปที่ปราสาทได้หรือไม่?"\n\nเสียงของ[dummy_attracted_gender.GetHerHis|U]ช่างสงบ ท่าทางของ[dummy_attracted_gender.GetHerHis]ช่างโล่งใจ"
 martial_chivalry.6003.a:0 "ข้าจะไม่มีวันทอดทิ้งผู้บริสุทธิ์ที่ต้องการความช่วยเหลือ"
 martial_chivalry.6003.a_success:0 "ท่านหาทางกลับเจอ"
 martial_chivalry.6003.a_failure:0 "ท่านหลงทางในป่า"
 martial_chivalry.6003.b:0 "[dummy_attracted_gender.GetSheHe]ทำอะไรอยู่ที่นี่คนเดียว? ข้าต้องออกไปก่อนที่จะถูกซุ่มโจมตี!"
 martial_chivalry.6003.c:0 "วิญญาณ! ผี! ข้าจะไม่อยู่ที่นี่อีกวินาทีเดียว!"
 martial_chivalry.6003.d:0 "แหม [dummy_attracted_gender.GetSheHe]เน่าเปื่อยอยู่ในนั้นก็ได้"
 martial_chivalry.6003.d_tt:0 "นี่จะสอนให้[dummy_attracted_gender.GetHerHim]สุภาพอยู่เสมอ"
