l_english: 
 # Mercenaries are being assholes at an inn, by Linnéa Thimrén
 martial_authority.1031.t:0 "ความเมตตาต่อทหารรับจ้าง"
 martial_authority.1031.desc:0 "ความวุ่นวายในโรงเตี๊ยม [ROOT.Char.Custom('RegionalAlcoholicDrink')] ชั้นเลิศ ยามเย็นอันเงียบสงบหลังจากการฝึกฝนมาทั้งวัน... ถ้วยของข้าถูกปัดกระเด็นจากมือโดยทหารรับจ้างที่กำลังโซเซจากหมัด และความหวังที่จะได้ผ่อนคลายทั้งหมดก็ไหลลับไปกับสุราลงบนพื้น\n\n"ได้โปรดเถิด [ROOT.Char.Custom('FormOfAddressForLiege')]" เจ้าของโรงเตี๊ยมอ้อนวอน, "พวกอันธพาลของ [scoped_mercenary.GetFirstNamePossessive] ดื่มเหล้าข้าจนเกลี้ยง โดยไม่จ่ายเงิน มาหลายวันแล้ว! และการต่อสู้ของพวกมันก็ ทำให้พนักงานและแขกขวัญหนีดีฝ่อ!""
 martial_authority.1031.a:0 "ข้าจะจ่ายค่าเครื่องดื่มให้ หากพวกเจ้าจากไปทันที"
 martial_authority.1031.b:0 "ทหาร โยนพวกมันออกไป!"
 martial_authority.1031.c:0 "พวกมันเมาเกินกว่าจะเป็นภัยคุกคามจริงจัง เรื่องนี้จะจบลงอย่างรวดเร็ว"

 # Fight between my soldiers (Diplomacy skill challenge), Sean Hughes
 martial_authority.2040.t:0 "ข้อพิพาทในค่ายพัก"
 martial_authority.2040.desc:2 "หลังจากกองทัพของข้าตั้งค่ายพัก ข้าได้ยินเสียงเอะอะโวยวายดังมาจากที่พักของ $knight_culture_player_plural_possessive_no_tooltip_lowercase$ ของข้า\n\nเมื่อตรวจสอบความวุ่นวาย ข้าพบ [first.GetTitledFirstName] และ [second.GetTitledFirstName] กำลังโต้เถียงกันอย่างดุเดือด ขณะที่ผู้มุงดูหลายคนยุยงส่งเสริมพวกเขา"
 martial_authority.2040.a:0 "กล่าวสุนทรพจน์เรื่องความสามัคคีต่อฝูงชน"
 martial_authority.2040.a.success:0 "คำพูดของข้าดึงทุกคนออกจากการต่อสู้"
 martial_authority.2040.a.failure:0 "คำพูดของข้าไม่มีผลต่อการโต้เถียง"
 martial_authority.2040.a.failure.tt:0 "การต่อสู้บานปลายเมื่อผู้มุงดูเข้าร่วม!"
 martial_authority.2040.b:0 "จงเฆี่ยนพวกเขาฐานละเมิดวินัย!"
 martial_authority.2040.c:1 "ช่างหัวมัน ข้าจะไปที่กระโจมของข้าและอุดหูเสีย..."
 martial_authority.2040.c.drunkard:0 "ช่างหัวมัน ข้าจะไปที่กระโจมของข้าและดื่มสักหน่อย..."
 martial_authority.2040.c.hashishiyah:0 "ช่างหัวมัน ข้าจะไปเสพกัญชาสักหน่อย"

 martial_authority.2041.t:0 "การแก้ไขปัญหา"
 martial_authority.2041.desc:0 "ข้าลุกขึ้นและกล่าวสุนทรพจน์เกี่ยวกับว่าเราทุกคนกำลังต่อสู้เพื่อ [ROOT.Char.GetPrimaryTitle.GetName] และเราต้องยืนหยัดเป็นหนึ่งเดียวเพื่อต่อต้านศัตรูของเรา เพราะหากเราไม่ทำ เช่นนั้น ก็มีคนภายนอกมากมายที่จะฉวยโอกาสจากความขัดแย้งภายในของเราเพื่อยึดครองดินแดนของเราและบังคับใช้การปกครองของพวกเขาเหนือเรา\n\nด้วยท่าทีอับอาย [first.GetTitledFirstName] และ [second.GetTitledFirstName] กล่าวขอโทษและเตรียมตัวเข้านอน"
 martial_authority.2041.a:0 "เราแข็งแกร่งขึ้นเมื่อเรายืนหยัดร่วมกัน"

 martial_authority.2042.t:0 "การทะเลาะวิวาท"
 martial_authority.2042.desc:0 "คำวิงวอนของข้าให้เราทุกคนละทิ้งความแตกต่างของเรานั้นไร้ผล เมื่อการทะเลาะวิวาทกลายเป็นการชกต่อยกันอย่างเต็มรูปแบบ\n\nเครื่องดื่มและอาหารกระจัดกระจายเมื่อผู้คนเริ่มขว้างเหยือกและห่อของไปรอบ ๆ"
 martial_authority.2042.a:0 "เข้าร่วมด้วยก็ดีเหมือนกัน!"
 martial_authority.2042.a.success:0 "ข้าปรากฏตัวเป็นผู้ชนะเพียงผู้เดียวของการทะเลาะวิวาท"
 martial_authority.2042.a.failure:0 "ข้าได้รับบาดเจ็บในการต่อสู้ที่รุนแรง"
 martial_authority.2042.b:0 "ช่างเละเทะเสียนี่กระไร..."

 martial_authority.2050.t:0 "มือขวาช่วยงาน"
 martial_authority.2050.desc.opening:0 "สำหรับอำนาจทั้งหมดที่ข้าควรจะมีในฐานะ [ROOT.Char.GetTitleAsNameNoTooltip] ข้าไม่สามารถอยู่ทุกหนทุกแห่งใน [ROOT.Char.Custom('GetRealmOrDomicile')|l] ของข้าได้ในคราวเดียว จะมีผู้ที่ "ลืม" ปฏิบัติตามคำสั่งของข้าเสมอเมื่อความสนใจของข้าหันไปทางอื่น\n\nนี่คือจุดที่ [right_hand_person.Custom2('MyCharacterIntroduction', ROOT.Char)] สามารถเข้ามามีบทบาทได้ ผู้ ซึ่งบังคับใช้พระราชกฤษฎีกาของข้าอย่างซื่อสัตย์"
 martial_authority.2050.desc.vassal:0 "ภายในอาณาเขตของ [right_hand_person.GetHerHis] เอง"
 martial_authority.2050.desc.knight:0 "ขณะตรวจตราชนบท"
 martial_authority.2050.desc.courtier:0 "ใน [ROOT.Char.Custom('GetCourt')|l]"
 martial_authority.2050.desc.ending:0 "[right_hand_person.GetSheHe] จะสามารถรับใช้เป็นมือขวา [right_hand_person.GetWomanMan] ของข้าและมีบทบาทเชิงรุกมากขึ้นในการบริหาร [ROOT.Char.Custom('GetRealmOrDomicile')|l] ของข้าได้หรือไม่?"
 martial_authority.2050.a:0 "ใช่ [right_hand_person.GetSheHe] จะรับใช้ข้าได้เป็นอย่างดี!"
 martial_authority.2050.a.tt:1 "ท่านจะใช้เวลาร่วมกับ [right_hand_person.GetShortUIName] มากขึ้น"
 martial_authority.2050.b:1 "[marshal.GetFirstNameNoTooltip] [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('marshal'))]ของข้า สามารถจัดการปัญหาเหล่านั้นได้"
 martial_authority.2050.c:0 "ข้าสามารถจัดการทุกอย่างได้ด้วยตนเองหากข้าทำงานหนักขึ้น!"
 martial_authority.2050.toast.title:0 "[right_hand_person.GetShortUIName] กำลังรับใช้เป็นมือขวา [right_hand_person.GetWomanMan] ของท่าน"

 martial_authority.2051.t:0 "มือขวาช่วยงาน"
 martial_authority.2051.desc:0 "ในระหว่างการช่วยข้าบริหาร [ROOT.Char.Custom('GetRealmOrDomicile')] ในฐานะมือขวา [right_hand_person.GetWomanMan] ของข้า [right_hand_person.GetTitledFirstName] และข้าได้ค้นพบว่าเรามีอะไรที่เหมือนกันมากมาย!\n\nเราได้สร้างความสัมพันธ์อันแน่นแฟ้นขึ้นในช่วงเวลาที่เราทำงานร่วมกันอันเป็นผลมาจากสิ่งนี้ และข้าพบว่าตนเองกำลังสงสัยว่าอนาคตจะเป็นอย่างไรสำหรับเรา..."
 martial_authority.2051.a:0 "เราจะกลายเป็นสหายที่ดีต่อกัน!"
 martial_authority.2051.b:0 "นี่คือจุดเริ่มต้นของบางสิ่งที่มากกว่านั้นหรือไม่?"
 martial_authority.2051.c:0 "เราต้องรักษาความสัมพันธ์นี้ให้เป็นมืออาชีพ"

 martial_authority.2052.message:0 "ข้าจองจำมือขวา [right_hand_person.GetWomanMan] ของข้า"
 martial_authority.2053.toast:0 "[right_hand_person.GetWomanMan] มือขวาของข้า ถูก [imprisoner.Custom2('MyCharacterIntroduction', ROOT.Char)] คุมขัง และมิสามารถรับใช้ข้าได้ เว้นแต่จะถูกปล่อยตัว"
 martial_authority.2054.toast:1 "มือขวา [right_hand_person.GetWomanMan] ของข้ากลับมารับใช้ข้า"
 martial_authority.2054.toast.no_return:1 "มือขวา [right_hand_person.GetWomanMan] ของข้าไม่กลับมารับใช้ข้า"
 martial_authority.2055.message:0 "มือขวา [right_hand_person.GetWomanMan] ของข้าออกจากการรับใช้ข้า"
 martial_authority.2055.message.incapable:0 "มือขวา [right_hand_person.GetWomanMan] ของข้าไร้ความสามารถ"
 martial_authority.2056.message:1 "มือขวา [ROOT.Char.GetWomanMan|U] ของข้าเสียชีวิต"
 martial_authority.2056.message.death:0 "ข้าสังหารมือขวา [right_hand_person.GetWomanMan] ของข้า"

 # Soldier and Officer Fighting, by Mathilda Bjarnehed
 martial_authority_special.1100.t:0 "ปลอมตัว"
 martial_authority_special.1100.start.desc:0 "คืนนี้ ข้าได้ถอดสัญลักษณ์ทุกอย่างที่บ่งบอกยศของข้าออกไปเพื่อเดินปะปนกับทหารของข้าโดยไม่เปิดเผยตัวตน เป็นค่ำคืนที่เงียบสงบ ดังนั้นเมื่อการโต้เถียงเกิดขึ้น คำพูดจึงดังมาถึงหูข้าอย่างชัดเจน\n\n"
 martial_authority_special.1100.heavy_infantry.desc:0 "ทหารราบ"
 martial_authority_special.1100.cavalry.desc:0 "ทหารม้า"
 martial_authority_special.1100.archer.desc:0 "พลธนู"
 martial_authority_special.1100.skirmisher.desc:0 "พลปะทะ"
 martial_authority_special.1100.pikemen.desc:0 "พลหอก"
 martial_authority_special.1100.end.desc:0 "กำลังพยายามโน้มน้าวผู้บัญชาการของ [soldier_friend.GetHerHis] [officer.Custom2('MyCharacterIntroductionNoComma', ROOT.Char)] ถึงข้อดีของกลยุทธ์ทางเลือก [officer.GetFirstNameNoTooltip] จะไม่ยอมฟังเลย — ขณะที่ข้าเข้าใกล้ [officer.GetWomanMan] ที่โกรธจัดก็ยกกำปั้นของ [officer.GetHerHis] ขึ้น..."
 martial_authority_special.1100.a:0 "ก้าวเข้าไปปกป้องทหาร"
 martial_authority_special.1100.a.success.tt:1 "ท่านเอาชนะนายทหารในการต่อสู้มือเปล่า"
 martial_authority_special.1100.a.failure.tt:0 "นายทหารเอาชนะท่านในการต่อสู้มือเปล่า"
 martial_authority_special.1100.b:0 "ไกล่เกลี่ยระหว่าง [officer.GetFirstNameNoTooltip] และทหาร"
 martial_authority_special.1100.b.success.tt:1 "ท่านโน้มน้าว [officer.GetShortUINameNoTooltip]"
 martial_authority_special.1100.b.failure.tt:1 "[officer.GetShortUINameNoTooltip] ด่าว่าท่านอย่างน่าประทับใจ"
 martial_authority_special.1100.c:0 "ทำให้พวกเขาเป็นเยี่ยงอย่าง"
 martial_authority_special.1100.d:0 "แอบหนีไปและเอาความดีความชอบจากความคิดของทหาร"

 martial_authority_special.1101.desc:0 "การฝึกฝนของข้าได้ผลดี ไม่กี่อึดใจต่อมา ข้าก็ล็อกแขน [officer.GetTitledFirstName] ไว้อย่างแน่นหนา "ให้เรื่องนี้เป็นบทเรียน" ข้ากล่าวเสียงดังให้ทุกคนได้ยิน "[ROOT.Char.GetTitleTierName] ของท่านไม่โปรดปรานคนโง่ที่ใจแคบ ไม่ว่ายศของพวกเขาจะเป็น เช่นไร""

 martial_authority_special.1101.end.desc:0 "\n\n"ขอบพระคุณ, [ROOT.Char.Custom('FormOfAddressForLiege')] ท่านจะไม่มีวันได้พบผู้รับใช้ที่ภักดีไปกว่า [soldier_friend.GetFullNameNoTooltip] อีกแล้ว""
 martial_authority_special.1101.a:0 "นำกลยุทธ์ของ [soldier_friend.GetFirstNamePossessiveNoTooltip] มาใช้"
 martial_authority_special.1101.b:0 "หารือเกี่ยวกับกลยุทธ์เพื่อเรียนรู้เพิ่มเติมเกี่ยวกับการสงคราม"
 
 martial_authority_special.1102.desc:0 "เมื่อรู้ถึงผลที่ตามมาของการทำร้ายผู้บังคับบัญชา ทหารผู้นั้นจึงไม่ทำอะไรเพื่อป้องกัน [soldier_friend.GetHerselfHimself] จากการโจมตีที่เข้ามา เมื่อเลือดออก ข้าก็กระโจนเข้าไประหว่างพวกเขา\n\nบางทีข้าควรจะรู้ดีกว่านี้ที่จะทะเลาะวิวาทกับนักรบผู้ช่ำชอง ในที่สุด ข้าต้องเปิดเผยตัวตนของข้า เพื่อให้ [officer.GetTitledFirstName] ปล่อยข้าไป ข้าหลบกลับไปที่กระโจมของข้าก่อนที่ข่าวจะแพร่กระจาย..."
 martial_authority_special.1102.a:0 "อย่างน้อยข้าก็ได้เรียนรู้กลอุบายสักอย่างสองอย่าง"

 martial_authority_special.1103.desc:0 "แขนของ [officer.GetTitledFirstNamePossessive] หยุดชะงักกลางคันเมื่อข้าเปล่งเสียง ความเข้มข้นทางอารมณ์ของคำพูดของข้าดูเหมือนจะกระทบใจ – สีหน้าของ [officer.GetHerHis] อ่อนลงเป็นความอับอาย [officer.GetSheHe|U] พูดขอโทษอย่างตะกุกตะกักและรีบหนีไป"

 # Deal with Deserters, by Linnéa Thimrén
 martial_authority_special.1501.t: "ทหารหนีทัพ"
 martial_authority_special.1501.desc: "ข้ากำลังลาดตระเวน [ravaged_place.GetName] พยายามประเมินความเสียหายล่าสุดของเคาน์ตี [deserting_soldier.GetTitledFirstName] หยุดข้าก่อนที่จะไปต่อ:\n\n"ข้าจำจุดนี้ได้แม่นยำ""
 martial_authority_special.1501.desc_battle: "มันถูกทำลายล้างระหว่างการรบครั้งล่าสุดของเรา!"
 martial_authority_special.1501.desc_raid: "มันถูกปล้นสะดมและขโมยทรัพย์สิน!"
 martial_authority_special.1501.desc_outro: "ข้าเห็นความน่าสะพรึงกลัว เสียงกรีดร้อง เลือด... ไฟ" ใบหน้าของ [deserting_soldier.GetHerHis|U] ซีดเผือด "ข้า-ข้าอยู่ที่นี่ต่อไปไม่ได้แล้ว ข้าจะไม่ทน!""
 martial_authority_special.1501.a: ""ข้าก็ เช่นกัน แต่เราต้องอดทน""
 martial_authority_special.1501.a_tt: "ท่านบอก [deserting_soldier.GetFirstNameNoTooltip] เกี่ยวกับประสบการณ์ที่คล้ายคลึงกันของท่านและว่ามัน ทำให้ท่านรู้สึกอย่างไร"
 martial_authority_special.1501.a.success: "[deserting_soldier.GetFirstName] สงบลง"
 martial_authority_special.1501.a.failure: "ความหลงผิดของ [deserting_soldier.GetFirstNamePossessive] แพร่กระจาย"
 martial_authority_special.1501.b: "มันจะไม่เกิดขึ้นกับเจ้าอีกต่อไป"
 martial_authority_special.1501.c: ""ตั้งสติหน่อย!""

 martial_authority_special.3000.t:0 "การแสดงภาวะผู้นำ"
 martial_authority_special.3000.desc:0 "[martial_authority_friend.Custom2('MyCharacterIntroductionNoComma', ROOT.Char)|U] วนเวียนอยู่รอบ ๆ การประชุมสภาของข้าในช่วงหลังนี้ เมื่อรู้ถึงความสนใจของ [martial_authority_friend.GetHerHis] ในเรื่องภาวะผู้นำ ข้าอดไม่ได้ที่จะรู้สึกว่า [martial_authority_friend.GetWomanMan] กำลังรอให้ข้าสร้างความประทับใจให้ [martial_authority_friend.GetHerHim]\n\nข้าอาจจะชวน [martial_authority_friend.GetHerHim] สนทนาได้ ในทางกลับกัน อาจเป็นการดีกว่าสำหรับ [martial_authority_friend.GetHerHim] ที่จะเพียงแค่เห็นข้ามีปฏิสัมพันธ์กับ [ROOT.Char.Custom('WomenMenPeople_GenderPreference')] ของข้า — มีบางอย่างที่ต้องกล่าวถึงสำหรับการ #EMP แสร้งทำ#! เป็นอย่างน้อยว่ารู้จักใบหน้าของทหารทุกคน"
 martial_authority_special.3000.a:0 "ให้เราหารือเกี่ยวกับวิธีการสื่อสาร"
 martial_authority_special.3000.b:0 "เราควรไปทักทายทหารใหม่บางคน!"
 respected_figurehead:0 "ผู้นำที่เป็นที่เคารพ"
