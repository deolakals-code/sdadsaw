l_english: 
 available_because_of_dread_tt:0 "ตัวเลือกนี้มีให้ เนื่องจาก [dread|E] ของท่าน"
 intrigue_lifestyle_perk_indication:2 "ท่านอาจได้รับ [perk|E] [intrigue_lifestyle|E]"
 intrigue_scheming_focus_point_clear_gain:0 "ความเข้าใจใน [intrigue_lifestyle|E] ของท่านเพิ่มขึ้น"

# Play Robin Hood, by Linnéa Thimrén
 intrigue_scheming.1001.t:0 "เสียงคร่ำครวญของ [county.GetNameNoTierNoTooltip]"
 intrigue_scheming.1001.desc:0 ""เราต้องการทรัพยากรเหล่านั้นสำหรับกองทหาร! หากหมู่บ้านเล็กๆ แห่งหนึ่งใน [county.GetNameNoTier] ต้องอดอยาก—"\nการโต้เถียงอย่างเผ็ดร้อนระหว่างที่ปรึกษาของข้าตามข้าออกมาจากห้อง และ [councillor.GetTitledFirstName] ผู้แทนจาก [county.GetNameNoTierNoTooltip] ทักทายข้าด้วยดวงตาที่เหนื่อยล้าขณะที่ข้าเข้าใกล้"
 intrigue_scheming.1001.a:0 "นี่ พระราชกฤษฎีกานี้จะบังคับให้พวกเขาปล่อยเจ้าไว้ตามลำพัง"
 intrigue_scheming.1001.b:0 "หมู่บ้านเดียวมีความสำคัญอะไรในแผนการใหญ่?"

# Invent code for messages, by Linnéa Thimrén
 intrigue_scheming.1011.t:0 "ความจำเป็นในการรักษาความลับ"
 intrigue_scheming.1011.desc:0 ""[ROOT.Char.Custom('FormOfAddressForLiege')|U]!"\nข้าหันไปเห็น [council_member.GetTitledFirstName] วิ่งมาหาข้าอย่างหมดลมหายใจ "มีผู้ส่งสารถูกพบว่าเสียชีวิตอีกคนแล้ว [ROOT.Char.Custom('FormOfAddressForLiege')] ทั้งถุงและจดหมายถูกขโมยไป"\n\nครั้งที่สามของปีนี้ ความรำคาญใจที่กำลังกลายเป็นความกังวล จะเป็นอย่างไรหากจดหมายติดต่อระหว่างข้ากับสายลับของข้าถูกศัตรูของเราอ่าน?"
 intrigue_scheming.1011.a:0 "ส่งคนไปตามนักถอดรหัสลับ เริ่มงานทันที!"
 intrigue_scheming.1011.a.flavor:0 "ข้าจะทำงานร่วมกับนักถอดรหัสลับเพื่อพัฒนารหัส"
 intrigue_scheming.1011.b:0 "ข้าต้องระมัดระวังมากขึ้นในอนาคต"

 intrigue_scheming.1012.desc:0 "ค่ำคืนอันยาวนานกลายเป็นรุ่งอรุณ โดยไม่มีเวลาพักผ่อนสำหรับข้าหรือนักถอดรหัสลับ [cryptographer.GetTitledFirstName]\n\n"
 intrigue_scheming.1012.desc_archimedes:0 ""งานน่าเบื่อนี้คงจะจบลงในไม่ช้า หากเพียง แต่เรามีผลงานของอาร์คิมิดีสเกี่ยวกับรหัสลับ หน้าแล้วหน้าเล่าเกี่ยวกับรหัสและการเข้ารหัส...""
 intrigue_scheming.1012.desc_al_kindi:0 ""งานน่าเบื่อนี้คงจะจบลงในไม่ช้า หากเรามีผลงานของอัล-คินดีเกี่ยวกับวิทยาการเข้ารหัสลับ หน้าแล้วหน้าเล่าเกี่ยวกับรหัสและการเข้ารหัส...""
 intrigue_scheming.1012.desc_ending:0 "\nเสียงพึมพำของ [cryptographer.GetTitledFirstNamePossessive] ดังมาถึงข้าผ่านม่านหมอกแห่งความง่วงงุน"
 intrigue_scheming.1012.a:0 "เรามีเรื่องต้องหารือกันมาก เจ้ากับข้า..."
 intrigue_scheming.1012.a.duel_success:0 "[cryptographer.GetTitledFirstNameNoTooltip] และข้าพัฒนารหัสใหม่ได้สำเร็จ"
 intrigue_scheming.1012.a.duel_failure:0 "[cryptographer.GetTitledFirstNameNoTooltip] ไม่สามารถสอนศาสตร์ของ[cryptographer.GetHerHis]ให้ข้าได้"
 intrigue_scheming.1012.b:0 "ปลุกข้าหากเจ้าพบอะไร"

 intrigue_scheming.1013.desc_alive:0 "ในที่สุด เราก็ได้อะไรบางอย่าง! หลังจากการหารืออันยาวนานหลายครั้งและค่ำคืนที่ยาวนานยิ่งกว่า [cryptographer.GetTitledFirstName] และข้าก็ได้ข้อสรุปในที่สุด\n\n"
 intrigue_scheming.1013.desc_dead:0 "แม้จะสูญเสียนักถอดรหัสลับไป ในที่สุดข้าก็ได้อะไรบางอย่าง!\n\n"
 intrigue_scheming.1013.desc_transposition:0 "ระบบพื้นฐานที่ค่อนข้างธรรมดา ซึ่งจัดเรียงตัวอักษรในคำใหม่ จะเป็นประโยชน์ต่อเรามากที่สุด เป็นสิ่งสำคัญอย่างยิ่งที่ผู้รับจะเข้าใจข้อความโดยไม่ล่าช้าเกินไป"
 intrigue_scheming.1013.desc_substitution:0 "ระบบที่แทนที่ตัวอักษรด้วยตัวเลขจะตอบสนองวัตถุประสงค์ของเราได้ดีที่สุด ศัตรูของเราจะคิดว่ามันไร้สาระ!"
 intrigue_scheming.1013.desc_cipher:0 "รหัสลับ เพื่อให้ศัตรูเชื่อว่าทุกข้อความที่ถูกดักจับนั้นเขียนด้วยภาษาต่างประเทศ จะเป็นประโยชน์ต่อเรามากที่สุด!"
 intrigue_scheming.1013.a:0 "ไม่มีใครสามารถถอดรหัสนี้ได้!"
 intrigue_scheming.1013.a.tt:2 "ท่านได้รับ #T [THIS.Var('intrigue_exp_gain_value').GetValue]#! แต้ม [intrigue_rigueint|E]"
 intrigue_scheming.1013.b.tt:2 "ท่านได้รับ #T [THIS.Var('intrigue_exp_gain_value').GetValue]#! แต้ม [intrigue_9_14_20_18_9_7_21_5|E]"
 intrigue_scheming.1013.c.tt:2 "ท่านได้รับ #T [THIS.Var('intrigue_exp_gain_value').GetValue]#! แต้ม [intrigue_lqwuljxh|E]"

 intrigue_scheming.1014.desc_alive:0 "น่าเสียดาย เท่าที่ข้าพยายามแล้ว ข้าก็ไม่สามารถเข้าใจศาสตร์การเข้ารหัสลับอันลึกลับของ [cryptographer.GetTitledFirstNamePossessive] ได้\n\n[cryptographer.GetWomanMan]ผู้นั้นรับรองกับข้าว่ารหัสที่[cryptographer.GetSheHe]พัฒนาขึ้นนั้นปลอดภัยอย่างไม่ต้องสงสัย แต่ข้าก็อดไม่ได้ที่จะรู้สึกว่านี่เป็นโอกาสที่พลาดไปสำหรับข้าในการขัดเกลาทักษะของข้า"
 intrigue_scheming.1014.desc_dead:0 "เมื่อ [cryptographer.GetTitledFirstName] เสียชีวิต ความพยายามของข้าในการสร้างรหัสลับเพื่อแลกเปลี่ยนข้อมูลที่ละเอียดอ่อนอย่างปลอดภัยจะต้องถูกระงับไว้ก่อน\n\nข้าได้ แต่หวังว่าโอกาสอื่นในการปรับปรุงการป้องกันการจารกรรมของ[ROOT.Char.Custom('GetCourt')]ของข้าจะมาถึงในไม่ช้า"
 intrigue_scheming.1014.a:0 "น่าเสียดายจริงๆ..."

# Hired spies construct a report of your castle's weaknesses, by Linnéa Thimrén
 intrigue_scheming.1201.t:0 "ทุกซอกทุกมุม"
 intrigue_scheming.1201.desc:0 "ค่ำคืนอันมืดมิดสามารถ ทำให้เงาในโถงทางเดินของ[ROOT.Char.Custom('FortifiedBuilding')]ของข้ามีชีวิตชีวาขึ้นมาได้อย่างแท้จริง ความเสี่ยงที่รับรู้ได้จากผู้มาเยือนที่ไม่ได้รับอนุญาตเพิ่มสูงขึ้นเรื่อยๆ ทุกครั้งที่พบมุมที่ไม่มีการป้องกัน\n\nหากข้าเพียงผู้เดียวสามารถเห็นข้อบกพร่องมากมายขนาดนี้ ลองจินตนาการดูว่าคนอื่นๆ ที่มีมุมมองคล้ายกันจะทำอะไรได้มากกว่านี้!"
 intrigue_scheming.1201.a:0 "ข้าจะจ้างกลุ่มสายลับ... #EMP ที่ไม่เปิดเผยตัว#!"
 intrigue_scheming.1201.b:0 "มุมมองของข้าเพียงอย่างเดียวก็เพียงพอแล้ว!"

 intrigue_scheming.1202.desc:0 ""ดังนั้น นี่คือสิ่งที่ท่านควรทำ..."\n[hired_spy.GetTitledFirstName] #EMP ผู้เชี่ยวชาญ#! ในศาสตร์ที่ไม่เปิดเผยตัว ได้สำรวจไปทั่ว[ROOT.Char.Custom('FortifiedBuilding')]ของข้า ทำให้ทั้งคนรับใช้และข้าราชสำนักตกใจเมื่อโผล่ออกมาจากมุมที่มืดที่สุด\n\nเมื่อรวมตัวกันรอบบันทึกของ[hired_spy.GetHerHis] แผนการโดยละเอียดเพื่อเพิ่มความปลอดภัยก็ค่อยๆ เป็นรูปเป็นร่างขึ้น"
 intrigue_scheming.1202.a:0 "ข้ารู้สึกปลอดภัยขึ้นแล้ว!"
 intrigue_scheming.1202.b:0 "ข้าอาจต้องการคนที่มีความสามารถ เช่นเจ้า"
 intrigue_scheming.1202.b.tt:1 "[hired_spy.GetTitledFirstName] พักอยู่ที่ราชสำนักของท่าน"
 intrigue_scheming.1202.c:0 "แน่นอนว่าความรู้นี้ไม่สามารถเปิดเผยให้ทราบกันอย่างกว้างขวางได้"

# Meet a merchant from a far away land, by Linnéa Thimrén
 intrigue_scheming.1401.t:0 "เกร็ดเล็กเกร็ดน้อยจากแดนไกล"
 intrigue_scheming.1401.desc_opening:0 "ขณะเยี่ยมชมตลาดท้องถิ่น พ่อค้าจากดินแดนอันไกลโพ้นดึงดูดความสนใจของข้า\n\n"เข้ามาใกล้ๆ สิ [ROOT.Char.Custom('FormOfAddressForLiege')]! ตื่นตากับสมบัติที่ไม่เคยมีใครเห็นในดินแดนแถบนี้มาก่อน!""
 intrigue_scheming.1401.desc1:0 "ต้องระวังหลังเพื่อเอาของงามๆ พวกนี้ออกมา ข้าทำได้ ไม่เคยหลับตาสองข้างพร้อมกันเลย""
 intrigue_scheming.1401.desc2:0 "เดินผ่านยามที่รับผิดชอบของงามๆ พวกนี้ไปเลย ข้าเป็นผู้รู้ใจคนอย่างแท้จริง""
 intrigue_scheming.1401.desc3:0 "ข้าต้องกลมกลืนไปกับประชาชนเพื่อเอาของงามๆ พวกนี้ออกมา เป็นประสบการณ์ที่น่าสะพรึงกลัวอย่างแท้จริง""
 intrigue_scheming.1401.desc_ending:0 "\n\nพ่อค้าคนนี้อาจมีอะไรให้ข้ามากกว่าสิ่งมหัศจรรย์จากแดนไกล"
 intrigue_scheming.1401.a:0 ""คงน่าสนใจนะ ที่ได้เดินทางมากเท่าเจ้า!""
 intrigue_scheming.1401.a.tt:1 "#F ท่านโน้มน้าวให้พ่อค้าแบ่งปันข้อมูลเชิงลึกของ[dummy_gender.GetHerHis]กับท่าน#!."
 intrigue_scheming.1401.a.success:1 "ท่านโน้มน้าวพ่อค้าได้สำเร็จ"
 intrigue_scheming.1401.a.failure:1 "ท่านโน้มน้าวพ่อค้าไม่สำเร็จ"
 intrigue_scheming.1401.b:0 "[dummy_gender.GetSheHe|U] #EMP จะต้อง#! บอกข้าในสิ่งที่[dummy_gender.GetSheHe]รู้!"
 intrigue_scheming.1401.b.penalty:1 "เหล่าไพร่โกรธเคืองพฤติกรรมของท่าน"
 intrigue_scheming.1401.c:0 ""นี่น่าจะครอบคลุมทั้งเครื่องประดับและข้อมูล""

# Potential to turn a secret into a hook — or other things, by Petter Vilberg
 intrigue_scheming.1601.t:0 "สิ่งที่เราล่วงรู้"
 intrigue_scheming.1601.desc:0 "ข้าคงโกหกหากบอกว่าไม่รู้สึกพอใจเล็กน้อยที่เห็นท่าทางกระสับกระส่ายของ [blackmailed_vassal.GetTitledFirstName] เมื่อข้าบอกให้[blackmailed_vassal.GetHerHim]รู้ว่าข้ารู้อะไร\n\n[ROOT.Char.Custom2('RelationToMe', SCOPE.sC('blackmailed_vassal'))] ของข้าพาข้าไปคุยส่วนตัว ต้องการทราบว่า[blackmailed_vassal.GetSheHe]จะทำอะไรกับเรื่องนี้ได้บ้าง"
 intrigue_scheming.1601.a:0 "ทองคำเล็กน้อยช่วยได้มาก"
 intrigue_scheming.1601.b:0 "ข้ามีคนที่ข้าอยากสร้างความประทับใจ..."
 intrigue_scheming.1601.c:0 "ไม่มีอะไรต้องทำ ข้าแค่อยากให้เจ้ากังวล"
 
# Gain Intrigue Mentor, by Linnéa Thimrén
 intrigue_scheming.2001.t:0 "อาจารย์"
 intrigue_scheming.2001.desc:0 ""ข้าสังเกตเห็นความสนใจของท่านในศาสตร์แห่ง... เล่ห์กล [ROOT.Char.Custom('FormOfAddressForLiege')] ข้าอาจช่วยให้ท่านเรียนรู้ได้มากยิ่งขึ้น"\n\n[ROOT.Char.Custom2('RelationToMe', SCOPE.sC('future_mentor') )] ของข้า [future_mentor.GetTitledFirstName] ยิ้ม [future_mentor.Custom('quirk_pos_adverb')] ขณะที่ [future_mentor.GetSheHe] เข้าร่วมกับข้าใน [SelectLocalization( IsLandlessAdventurer(ROOT.Char),ROOT.Char.Custom('GetRandomCampBuilding'),'my gardens')] [future_mentor.GetSheHe|U] มีชื่อเสียงโด่งดังที่สุดเท่าที่ใครสักคนที่มีทักษะเหล่านี้พึงมีได้ และข้า #EMP ก็#! อยากจะเพิ่มพูนความรู้ด้านกลอุบายของข้าให้ลึกซึ้งยิ่งขึ้น"
 intrigue_scheming.2001.a:0 ""นำทางไป""
 intrigue_scheming.2001.b:0 "ข้าคงจะไร้เดียงสาหากไว้วางใจคนที่มีทักษะอย่าง[future_mentor.GetHerHis]"

# Sneaky person seeks you out (might be an agent), by Linnéa Thimrén
 intrigue_scheming.2101.t:0 "โอกาสที่น่าสนใจ"
 intrigue_scheming.2101.desc:0 ""ข้าทราบมาว่า [ROOT.Char.Custom('FormOfAddressForLiege')] ท่านอาจกำลังต้องการคนที่มี... พรสวรรค์ เช่นข้า" คนรู้จักใหม่ของข้า [sneaky_person.GetTitledFirstName] เข้ามาหาข้า พลางยิ้ม\n\n"หากการบริการของข้าจะมีประโยชน์ โปรดอย่าลังเลที่จะเรียกใช้""
 intrigue_scheming.2101.a:0 "ข้าอาจมีประโยชน์ให้เจ้าทำ"
 intrigue_scheming.2101.b:0 "เจ้าไม่ใช่[sneaky_person.GetWomanMan]สำหรับงานนี้"

 intrigue_scheming.2102.t:0 "[ROOT.Char.Custom2('RelationToMe', SCOPE.sC('sneaky_person') )|U]ผู้ภักดี"
 intrigue_scheming.2102.desc:0 "ข้ายืนอยู่ในเงาของ[ROOT.Char.Custom('GetCourtyard')] มองดู[ROOT.Char.Custom2('RelationToMe', SCOPE.sC('sneaky_person') )]คนใหม่ของข้า [sneaky_person.GetTitledFirstName] หายลับไปในยามค่ำคืน\n\nอีกค่ำคืนหนึ่ง การพบปะลึกลับอีกครั้ง และความสงสัยของข้าที่มีต่อ[sneaky_person.GetWomanMan]ผู้นี้ก็เพิ่มมากขึ้นเท่านั้น"
 intrigue_scheming.2102.a:0 "[sneaky_person.GetFirstNameNoTooltip] เจ้ากำลังทำอะไรอยู่?!"
 intrigue_scheming.2102.a.tt:1 "[sneaky_person.GetSheHe|U]ไม่ทันสังเกตการสืบสวนของท่าน"
 intrigue_scheming.2102.b.tt:1 "[sneaky_person.GetSheHe|U]รู้ตัวว่าท่านกำลังสืบสวน[sneaky_person.GetHerHim]"
 intrigue_scheming.2102.b:0 "คงไม่มีอะไร"

 intrigue_scheming.2103.desc_not_noticed:0 ""[sneaky_person.GetSheHe|U]ทำงานให้ [sneaky_person_scheme_owner.GetTitledFirstName] หรือ?!"\n\nใน[ROOT.Char.Custom('GetChamberPlural')]ของ [sneaky_person.GetTitledFirstNamePossessive] ข้าพบจดหมายที่ไม่เหลือช่องว่างให้เข้าใจผิด [sneaky_person.GetSheHe|U]ได้วางแผนร้ายต่อข้า สวมบทบาทเป็น[ROOT.Char.Custom2('RelationToMe', SCOPE.sC('sneaky_person') )]ผู้ภักดีเพียงเพื่อเป็นฉากบังหน้า"
 intrigue_scheming.2103.desc_noticed:0 ""[ROOT.Char.Custom('FormOfAddressForLiege')|U] มีสิ่งใดให้ข้ารับใช้หรือ?"\n\nแม้ว่าข้าจะพยายามอย่างที่สุดแล้ว ดูเหมือนไม่มีสิ่งใดน่าสงสัยเกี่ยวกับ [sneaky_person.GetTitledFirstName] เลย เว้น แต่นิสัยประหลาดในยามค่ำคืนของ [sneaky_person.GetHerHis]"
 intrigue_scheming.2103.a:0 "จับ [sneaky_person.GetHerHim] ไปขังคุก!"
 intrigue_scheming.2103.b:0 "โยน [sneaky_person.GetHerHim] ออกไป"
 intrigue_scheming.2103.c:0 "เราทุกคนต่างก็มี... #EMP ความต้องการ#! ของตัวเอง ข้าคิดว่านะ"

# Servants and Masters, by Petter Vilberg
 intrigue_scheming.3001.t:0 "คนรับใช้และเจ้านาย"
 intrigue_scheming.3001.desc:0 "[hooked_courtier.GetTitledFirstName] [new_target.Custom2('RelationToMe', SCOPE.sC('hooked_courtier'))] ของ [new_target.GetTitledFirstNamePossessive] อยู่ในกำมือของข้าอย่างมั่นคง อย่างไรก็ตาม ด้วยกลยุทธ์ที่เหมาะสม ข้าอาจเพิ่มความได้เปรียบของข้าให้มากยิ่งขึ้นไปอีก\n\nบางที [hooked_courtier.GetFirstName] อาจถูกใช้เพื่อขยายอิทธิพลของข้าเหนือ [new_target.GetTitleTierName]?"
 intrigue_scheming.3001.a:0 "ข้าจะส่ง [hooked_courtier.GetFirstNameNoTooltip] ไปเป็นสายลับส่วนตัว!"
 intrigue_scheming.3001.a.tt:1 "หาก [new_target.GetFirstNameNoTooltip] มีความลับใดๆ:\n  เปิดเผยความลับหนึ่งของ[new_target.GetHerHis]ให้ท่านทราบ"
 intrigue_scheming.3001.b:0 "นี่คือวิธีที่เจ้าจะแน่ใจได้ว่าจะเปิดโปงความลับของ [new_target.GetFirstNamePossessiveNoTooltip]..."
 intrigue_scheming.3001.b.tt:1 "หาก [new_target.GetFirstNameNoTooltip] มีความลับใดๆ:\n  เปิดเผยความลับหนึ่งของ[new_target.GetHerHis]ให้ท่านทราบ\nหากไม่มี:"
 intrigue_scheming.3001.b.success:0 "สร้างเรื่องความลับสำเร็จ"
 intrigue_scheming.3001.b.success_tt:0 "[hooked_courtier.GetFirstNameNoTooltip] "พบ" "หลักฐาน" ของความลับหนึ่งของ [new_target.GetFirstNamePossessiveNoTooltip]"
 intrigue_scheming.3001.b.failure:0 "การใส่ร้ายถูกค้นพบ"
 intrigue_scheming.3001.c:0 "เจ้าคือกุญแจสู่กับดักอันงดงาม [hooked_courtier.GetFirstNameNoTooltip]!"
 intrigue_scheming.3001.c.success:0 "การฆาตกรรมที่จัดฉากขึ้น"
 intrigue_scheming.3001.c.failure_secret:0 "กับดักล้มเหลว"
 intrigue_scheming.3001.c.failure:0 "กับดักถูกเปิดโปง"
 intrigue_scheming.3001.c.failure.tt:1 "[new_target.GetFirstNameNoTooltip] ทราบถึงการมีส่วนร่วมของท่านในการฆาตกรรม"
 intrigue_scheming.3001.d:0 "ทำให้ชัดเจนว่าข้าสามารถเข้าถึง [new_target.GetHerHim] ได้ง่ายเพียงใด"
 intrigue_scheming.3001.d.success:0 "ชื่อเสียงของข้ามาก่อนตัวข้า"
 intrigue_scheming.3001.d.failure:0 "คำขู่ที่ว่างเปล่า"
 intrigue_scheming.3001.z:0 "ปล่อยข่าวลือเล็กน้อยเกี่ยวกับความน่าสะพรึงกลัวของข้า"

 intrigue_scheming.3003.desc:0 "[hooked_courtier.GetTitledFirstName] ทำงานของ[hooked_courtier.GetHerHis]ได้ดี! ตอนนี้ข้ารู้ความลับของ [new_target.GetTitledFirstNamePossessive] แล้ว และหนี้บุญคุณของ [hooked_courtier.GetFirstNamePossessive] ต่อข้าก็ได้รับการชดใช้แล้ว"
 intrigue_scheming.3003.a:0 "มันไม่ได้เลวร้ายอย่างที่เจ้าคาดไว้ใช่ไหม?"
 intrigue_scheming.3003.b:0 "และตอนนี้ก็ถึงเวลาแบล็กเมล์..."
 
 intrigue_scheming.3004.desc:0 "[hooked_courtier.GetTitledFirstName] ล้มเหลวในการค้นหาข้อมูลที่บ่งชี้ความผิดเกี่ยวกับ [new_target.GetTitledFirstName] ถึงกระนั้น คนโง่ผู้นั้นก็ยังยืนกรานว่าสำหรับความพยายามของ[hooked_courtier.GetHerHis] หนี้บุญคุณของ[hooked_courtier.GetHerHis]ต่อข้าได้รับการชดใช้เต็มจำนวนแล้ว!"
 intrigue_scheming.3004.a:0 "ข้าไม่ได้น่าเกรงขามอย่างที่ข้าคิดหรือ?"

 intrigue_scheming.3013.desc:0 "[hooked_courtier.GetTitledFirstName] ไม่พบข้อมูลที่บ่งชี้ความผิดเกี่ยวกับ [new_target.GetTitledFirstName] ดังนั้นจึงเป็นเรื่องดีที่ข้าได้เตรียมมันไว้เอง\n\nทันใดนั้น [new_target.GetFirstName] ดูเหมือนจะถูกรุมเร้าด้วยข่าวลือที่ไม่ดี และข้าก็บังเอิญมีหลักฐานทั้งหมดสำหรับข่าวลือเหล่านั้น"
 intrigue_scheming.3013.a:0 "[ROOT.Char.GetFaith.TricksterGodName] ช่วยเหลือผู้ที่ช่วยเหลือตนเอง"

 intrigue_scheming.3014.desc:0 "[hooked_courtier.GetTitledFirstName] ไม่พบข้อมูลที่บ่งชี้ความผิดเกี่ยวกับ [new_target.GetTitledFirstName] น่าเสียดายที่ข่าวลือที่ข้าปล่อยไว้อย่างระมัดระวังดูเหมือนจะไม่ได้รับความสนใจมากนัก และไม่มีใครเชื่อข้อกล่าวหาที่ข้าเตรียมพร้อมที่จะกล่าวหา [new_target.GetTitleTierName]\n\nยิ่งไปกว่านั้น ข่าวลือเท็จเหล่านั้นยังถูกสืบย้อนกลับมาถึงข้า!"
 intrigue_scheming.3014.a:0 "คำโกหกที่ไม่เป็นอันตรายเล็กน้อยในหมู่เพื่อนฝูงคืออะไรกัน?"

 intrigue_scheming.3021.desc:0 "เสียงกรีดร้องดังไปทั่ว[new_target.Custom('ResidenceBuilding')] คนรับใช้ที่วิ่งวุ่นทิ้งให้ [new_target.GetTitledFirstName] ที่งุนงงจ้องมองศพเปื้อนเลือดของ [hooked_courtier.GetTitledFirstName] ที่นอนอยู่ใน[new_target.Custom('GetChamberPlural')]ของ[new_target.GetHerHis] มีดของ[new_target.GetHerHis]อยู่ข้างๆ\n\n"ข้าอยู่ในสวนคนเดียว ท่านต้องเชื่อข้า!" [new_target.GetSheHe] ยืนกรานต่อฝูงชน[new_target.Custom('GetCourtierPlural')]ที่มารวมตัวกัน ใครจะเชื่อข้อแก้ตัวที่ฟังไม่ขึ้น เช่นนี้?"
 intrigue_scheming.3021.a:0 "ข้าชอบทิ้งของขวัญให้ผู้คน!"

 intrigue_scheming.3022.desc:0 "ความพยายามของข้าที่จะใส่ร้าย [new_target.GetTitledFirstName] จบลงด้วยหายนะ! [hooked_courtier.GetFirstName] ยังคงหายใจอยู่เมื่อคนรับใช้พบ[hooked_courtier.GetHerHim]เลือดออกใน[new_target.Custom('GetChamberPlural')]ของ [new_target.GetTitleTierName]\n\nเมื่อ [new_target.GetFirstName] มาถึง [hooked_courtier.GetFirstName] เหลือลมหายใจเพียงเฮือกสุดท้าย "[ROOT.Char.GetTitledFirstName]...""
 intrigue_scheming.3022.a:0 "ข้าจะฆ่า [hooked_courtier.GetHerHim] หากข้ายังไม่ได้ทำ!"

 intrigue_scheming.3023.desc:0 "มันควรจะสมบูรณ์แบบ แต่ ทว่า... [hooked_courtier.GetTitledFirstName] จะถูกพบใน[new_target.Custom('GetChamberPlural')]ของ [new_target.GetTitleTierName] คอถูกปาดด้วยมีดของ [new_target.GetTitleTierName] ในเวลาที่ [new_target.GetTitleTierName] ไม่มีข้ออ้างที่อยู่อื่น\n\nอย่างไรก็ตาม คนรับใช้ครึ่งโหลสามารถยืนยันได้ว่า [new_target.GetTitledFirstName] ออกไปขี่ม้าในวันนั้น ทำให้เป็นไปไม่ได้ที่[new_target.GetHerHim]จะเป็นฆาตกร"
 intrigue_scheming.3023.a:0 "เสียเหยื่อดีๆ ไปเปล่าๆ!"

 intrigue_scheming.3031.desc:0 "ชื่อเสียงของข้าในการได้สิ่งที่ข้าต้องการ ไม่ว่าจะด้วยวิธีใดก็ตาม เป็นประโยชน์ต่อข้าอย่างยิ่ง เมื่อข้าหลวงและคนรับใช้จำนวนมากของข้าตัวสั่นอยู่เบื้องหน้าข้า มันก็ไม่ยากที่จะโน้มน้าวให้คนอื่นๆ ทำตาม\n\nเพียงพอแล้วที่ [hooked_courtier.GetTitledFirstName] จะพบ [new_target.GetTitledFirstName] ตามลำพังในเย็นวันหนึ่งและส่งจดหมายพร้อมตราประทับของข้า [new_target.GetTitleTierName]เข้าใจดีว่าข้าสามารถเข้าถึง[new_target.GetHerHim]ได้ง่ายเพียงใด"
 intrigue_scheming.3031.a:0 "เกือบจะน่าเสียดาย ข้าสนุกกับการโน้มน้าวผู้คน..."

 intrigue_scheming.3032.desc:0 "[hooked_courtier.GetTitledFirstName] พบ [new_target.GetTitledFirstName] ตามลำพังในคืนหนึ่ง และส่งจดหมายพร้อมตราประทับของข้า เพื่อ ทำให้ชัดเจนว่าข้าเข้าถึงได้ไกลเพียงใด อย่างไรก็ตาม มันไม่ได้ผลตามที่ตั้งใจไว้ แต่ [new_target.GetTitleTierName] กลับชอบที่จะบอกทุกคนเกี่ยวกับ "คำขู่ที่ว่างเปล่า" ของข้าอย่างรวดเร็ว!"
 intrigue_scheming.3032.a:0 "ข้าอาจจะแสดงให้เจ้าเห็นว่ามันว่างเปล่าจริงๆ อย่างไร..."


# The Weight of Influence, by Petter Vilberg
 intrigue_scheming.3041.t:0 "น้ำหนักแห่งอิทธิพล"
 intrigue_scheming.3041.desc:0 "แม้ว่าข้าจะเพลิดเพลินกับความเต็มใจที่ [vassal_target.GetTitledFirstName] ทำตามคำสั่งของข้า แต่ [liege_target.Custom2('RelationToMe', SCOPE.sC('liege_target'))] ของ[vassal_target.GetHerHis] [liege_target.GetTitledFirstName] ยังคงอยู่นอกเหนือการเข้าถึงของข้า อย่างไรก็ตาม [vassal_target.GetFirstName] เป็น[vassal_target.GetWomanMan]ที่เหมาะสมที่จะช่วยข้าเปลี่ยนแปลงสิ่งนั้น"
 intrigue_scheming.3041.a:0 "เจ้าเหนือหัวต้องรับผิดชอบต่อการกระทำของข้าหลวง..."
 intrigue_scheming.3041.a.success:0 "ความกลัวต่อผลที่ตามมา"
 intrigue_scheming.3041.a.failure:0 "ไม่ประทับใจ"
 intrigue_scheming.3041.b:0 "[vassal_target.GetFirstNameNoTooltip] จะช่วย ทำให้ [liege_target.GetHerHim] กลัวข้า!"
 intrigue_scheming.3041.b.torture_desc:0 "[vassal_target.GetFirstNameNoTooltip] อาจไม่รอดออกมาอย่างสมบูรณ์"
 intrigue_scheming.3041.b.success:0 "มือที่เด็ดขาดได้ผลเสมอ!"
 intrigue_scheming.3041.b.failure:0 "[liege_target.GetFirstNameNoTooltip] ไม่ได้ถูกข่มขู่"
 intrigue_scheming.3041.c:0 "ข้าไม่ต้องการความช่วยเหลือใดๆ เพื่อบรรลุเป้าหมายของข้า"

 intrigue_scheming.3042.desc:0 "[liege_target.GetTitledFirstName] ดูตกตะลึง ราวกับว่าการทรยศของ [vassal_target.GetTitledFirstNamePossessive] เป็นเรื่องน่าประหลาดใจ #EMP อย่างที่สุด#! "เจ้ากล้าสนับสนุนข้อเรียกร้องใดๆ ของ... ของ [ROOT.Char.Custom2('InsultNoun', SCOPE.sC('liege_target'))] นี่รึ?!"\n\n[vassal_target.GetFirstName] เล่นตามน้ำ พยักหน้าอย่างเคร่งขรึม — ตามแผน ข้ายิ้มให้กับหมากตัวใหม่ในไม่ช้าของข้า "อย่าได้เชื่อแม้เพียงชั่วขณะว่า [vassal_target.GetSheHe] อยู่เพียงลำพัง""
 intrigue_scheming.3042.a:0 "ทีนี้ สิ่งที่ข้าอยากให้ท่านทำคือ..."

 intrigue_scheming.3043.desc:0 ""อย่าคิดว่าข้าจะถูกบีบบังคับได้ง่ายๆ!" [liege_target.GetTitledFirstName] ประกาศ [vassal_target.GetTitledFirstName] ดูเหมือนจะหดตัวต่อหน้า[liege_target.GetHerHim] ไม่เต็มไปด้วยความมั่นใจที่[vassal_target.GetSheHe]เคยเสนอที่จะสนับสนุนข้อเรียกร้องของข้าอีกต่อไป\n\n[liege_target.GetTitleTierName]ทำลายความหวังสุดท้ายของข้า "[liege_target.Custom('GetFollowerOrVassalPlural')]ของข้ารู้ที่ทางของตนเอง" [vassal_target.GetFirstName] ยืนยันด้วยความเงียบของ[vassal_target.GetHerHis]"
 intrigue_scheming.3043.a:0 "ดูเหมือนข้าจะเล่นไพ่ผิดมือไป..."

 intrigue_scheming.3051.desc:0 "ข้าได้ล่อลวง [liege_target.GetTitledFirstName] ไปยังคุกใต้ดินของ [vassal_target.GetTitledFirstNamePossessive] ตามคำเชิญของ [vassal_target.GetTitleTierName] ที่นั่นข้ารออยู่ พร้อมที่จะทรมานเจ้าบ้านของเราเพื่อแสดงอำนาจของข้า [liege_target.GetFirstName] ไม่ได้ตอบสนองอย่างที่ข้าคาดไว้\n\n"ใครๆ อาจคิดว่าท่านไม่เคยทำสิ่งนี้มาก่อน!"\nข้ามองด้วยความตกใจเมื่อ[liege_target.GetSheHe]เข้าควบคุมและ ทำให้ [vassal_target.GetFirstName] อยู่รอดจนถึงรุ่งเช้า แต่ไม่นานไปกว่านั้น"
 intrigue_scheming.3051.a:0 "ช่างเป็นการแสดงที่น่าสยดสยอง!"
 intrigue_scheming.3051.b:0 "ข้าได้เรียนรู้มากมาย!"

 intrigue_scheming.3052.desc:0 "ข้าได้ล่อลวง [liege_target.GetTitledFirstName] ไปยังคุกใต้ดินของ [vassal_target.GetTitledFirstNamePossessive] ตามคำเชิญของ [vassal_target.GetTitleTierName] ที่นั่นข้ารอเพื่อเปิดเผยว่าเจ้าบ้านของเราเป็นนักโทษในบ้านของ[vassal_target.GetHerHis]เอง\n\nข้าอาจจะเผลอตัวไปหน่อยกับชีวิตของ [vassal_target.GetTitleTierName] ในมือของข้า แต่ข้าเปลี่ยนมันให้เป็นข้อความที่ละเอียดอ่อนเกี่ยวกับวิธีที่ข้าคาดหวังการเชื่อฟังอย่างสมบูรณ์"
 intrigue_scheming.3052.a:0 "แม้ แต่เสียงกรีดร้องของ [vassal_target.GetFirstNamePossessiveNoTooltip] [liege_target.GetFirstNameNoTooltip] ก็เข้าใจประเด็น"

 intrigue_scheming.3053.desc:0 "ข้าได้ล่อลวง [liege_target.GetTitledFirstName] ไปยังคุกใต้ดินของ [vassal_target.GetTitledFirstNamePossessive] ตามคำเชิญของ [vassal_target.GetTitleTierName] ที่นั่นข้ารอเพื่อเปิดเผยว่าเจ้าบ้านของเราเป็นนักโทษในบ้านของ[vassal_target.GetHerHis]เอง\n\n[liege_target.GetFirstName] ไม่ได้ถูกข่มขู่จากการแสดงการทรมานของข้าอย่างที่ข้าคาดไว้ "พวกเสื่อมทรามอย่างเจ้าจะไม่มีวัน ทำให้ข้ากลัวได้ [ROOT.Char.GetTitledFirstName]!""
 intrigue_scheming.3053.a:0 "แม้ แต่คำวิงวอนขอความเมตตาของ [vassal_target.GetFirstNamePossessiveNoTooltip] ก็ไม่สามารถ ทำให้ข้าอารมณ์ดีขึ้นได้หลังจากนั้น"

# Fabricate Bastardy, by Petter Vilberg
 intrigue_scheming.3061.t:0 "มรดกที่สับสน"
 intrigue_scheming.3061.desc:0 "เป็นเวลาหลายวันที่ข้าหมกมุ่นอยู่กับเชื้อสาย [target.GetDynasty.GetBaseName] และตอนนี้ข้ามั่นใจแล้ว ไม่มีทางที่ [target.GetTitledFirstName] จะสามารถพิสูจน์ความเป็นบิดาของ [target.Custom2('RelationToMe', SCOPE.sC('heir'))] ของ[target.GetHerHis] [heir.GetTitledFirstName] ได้อย่างแน่ชัด!\n\nในที่ที่ขาดหลักฐาน หลักฐานก็สามารถปลูกฝังได้... ถึงเวลาแล้วที่ข้าจะเขียนความจริงใหม่เกี่ยวกับต้นกำเนิดของ [heir.GetFirstNamePossessive]!"
 intrigue_scheming.3061.a:0 "[new_father.GetTitledFirstNameNoTooltip] จะเป็นบิดาที่ยอดเยี่ยม"
 intrigue_scheming.3061.b:0 "[mother.GetTitledFirstNameNoTooltip] ไปสมสู่กับคนรับใช้อย่างนั้นรึ?! ช่างน่าละอาย!"
 intrigue_scheming.3061.c:0 "และข้าจะมีบทบาทนำ!"
 intrigue_scheming.3061.d:0 "ประวัติศาสตร์ราชวงศ์ทั้งหมดนี้อาจมีประโยชน์อย่างอื่น"
 intrigue_scheming.3061.success:0 "หลักฐานใหม่"
 intrigue_scheming.3061.c.success_tt:0 "ข้าจะสามารถเปิดเผยว่า [heir.GetTitledFirstNameNoTooltip] เป็นลูกนอกสมรสของข้า"
 intrigue_scheming.3061.failure:0 "สายเลือดถูกดูหมิ่น"
 intrigue_scheming.3061.a.success_tt:0 "ข้าจะสามารถเปิดเผยว่า [heir.GetTitledFirstNameNoTooltip] เป็นลูกนอกสมรสของ [new_father.GetTitledFirstNameNoTooltip]"
 intrigue_scheming.3061.b.success_tt:0 "ข้าจะสามารถเปิดเผยว่า [heir.GetTitledFirstNameNoTooltip] เป็นลูกนอกสมรสของ [commoner_target.GetTitledFirstNameNoTooltip]"

 intrigue_scheming.3062.opening:0 "ข่าวลือเริ่มแพร่สะพัดไปตามที่ข้าหวังไว้ แน่นอนว่าไม่มีใครสามารถพูดอะไรได้อย่างแน่นอน — นั่นคือประเด็น!"
 intrigue_scheming.3062.ending:0 "สายลับของข้ารายงานว่าแม้ แต่ [target.GetTitledFirstName] ก็มอง [heir.GetTitledFirstName] ด้วยความสงสัยในสายตาของ[target.GetHerHis] และมอง [new_father.GetTitledFirstName] ด้วยความไม่ไว้วางใจ"
 intrigue_scheming.3062.a:0 "ข้าจะเปิดเผย "หลักฐาน" ของข้าต่อสาธารณะ!"
 intrigue_scheming.3062.b:0 "เวลายังไม่เหมาะสมนัก"
 intrigue_scheming.3062.b.tt:1 "#F ท่านจะเก็บ "ความลับ" นี้ไว้ก่อนในตอนนี้#!"

 intrigue_scheming.3063.opening:0 ""ฮ่า ข่าวลือเหล่านี้น่าหัวเราะ! เป็นเพียง [ROOT.Char.GetTitledFirstName] ที่แพร่กระจายคำโกหกที่ชั่วร้าย"\n\nสายลับของข้ารายงานว่า [new_father.GetTitledFirstName] ได้ปฏิเสธข้อกล่าวหาใดๆ ที่ว่า [heir.GetTitledFirstName] อาจเป็น [heir.Custom('GetDaughterSon')] ของ[target.GetHerHis]"
 intrigue_scheming.3063.ending:0 "\n\n[target.GetTitledFirstName] ดูเหมือนจะไม่เชื่อว่าอาจมีความจริงใดๆ ในข่าวลือของข้า เช่นกัน และได้ประณามข้าว่าเป็นคนโกหกที่น่าอับอาย ซึ่งขาดความเคารพต่อระเบียบที่ถูกต้องของสิ่งต่างๆ"
 intrigue_scheming.3063.a:0 "ข้าขอประท้วง! ข้าไม่รู้สึกน่าอับอายเลยแม้ แต่น้อย!"

 intrigue_scheming.3064.ending:0 "สายลับของข้ารายงานว่าแม้ แต่ [target.GetTitledFirstName] ก็ยังสงสัย และมอง [mother.GetTitledFirstName] [heir.GetTitledFirstName] และ [commoner_target.GetTitledFirstName] ด้วยความไม่ไว้วางใจ"

 intrigue_scheming.3065.opening:0 ""ราวกับว่าข้าจะยอมให้สามัญชนอย่าง [commoner_target.GetTitledFirstName] แตะต้องตัวข้าได้"\n\nสายลับของข้ารายงานว่า [mother.GetTitledFirstName] ไม่ได้รอช้าแม้ แต่วินาทีเดียวในการปฏิเสธข่าวลือที่ข้าพยายามจะเริ่มเกี่ยวกับ[mother.GetHerHim]"

 intrigue_scheming.3066.desc:0 "วันที่ การเดินทาง โอกาสในการพบปะกันอย่างลับๆ... ทั้งหมดอยู่ที่นั่น และด้วยข่าวลือที่ข้าได้ปล่อยไป แม้ แต่ [target.GetTitledFirstName] ก็ยังรู้สึกสงสัยเกี่ยวกับความเป็นบิดาของ [heir.GetTitledFirstName]\n\nเป็นเพียงเรื่องของเวลาก่อนที่ใครบางคนจะสรุปได้ว่าข้าเป็นผู้สมัครที่มีแนวโน้ม..."
 intrigue_scheming.3066.a:0 "มาหาพ่อเถิด [heir.GetFirstNameNoTooltip]!"
 intrigue_scheming.3066.b:0 "ทุกอย่างต้องใช้เวลา ทุกอย่างต้องใช้เวลา"

 intrigue_scheming.3067.opening:0 "สำหรับข่าวลือทั้งหมดที่ข้าได้แพร่กระจายเกี่ยวกับ[mother.GetHerHim] ข้าไม่ได้คาดหวังว่าจะได้พบ [mother.GetTitledFirstName] ด้วยตนเอง\n\n"เจ้ากล้าดียังไงมาพูดเรื่องชั่วร้ายเหล่านี้เกี่ยวกับข้าและ[heir.Custom('GetDaughterSon')]ของข้า?!" คำพูดของ[mother.GetHerHis|U]ไม่ได้ ทำให้เจ็บแสบเท่ากับการตบหน้าข้าอย่างไม่คาดคิด "นั่นคือสิ่งที่ใกล้ที่สุดที่เจ้าจะได้สัมผัสตัวข้า!""
 intrigue_scheming.3067.a:0 "ดูเหมือนข้าจะประเมินคู่ต่อสู้ผิดไป..."

# Interrogation, by Sean Hughes
 intrigue_scheming.4021.t:0 "การสอบสวน"
 intrigue_scheming.4021.desc:0 "จากข้อมูลที่ข้ารวบรวมมา ข้าสงสัยอย่างยิ่งว่า [prisoner.GetTitledFirstName] รู้ความลับที่ข้าไม่รู้ เนื่องจากปัจจุบันข้าจับ[prisoner.GetHerHim]เป็นเชลยอยู่ นี่จึงเป็นโอกาสอันดีที่ข้าจะใช้วิธีการใดๆ ก็ตามที่ข้าต้องการเพื่อเรียนรู้ว่ามันคืออะไรกันแน่..."
 intrigue_scheming.4021.a:0 "เสนอปล่อยตัว [prisoner.GetHerHim] เพื่อแลกกับข้อมูล"
 intrigue_scheming.4021.a.success:0 "[prisoner.GetTitledFirstName] ยอมรับข้อเสนอของข้า"
 intrigue_scheming.4021.a.failure:0 "[prisoner.GetTitledFirstName] ปฏิเสธข้อเสนอของข้า"
 intrigue_scheming.4021.b:0 "เกมจิตวิทยามักจะเปิดเผยอะไรได้มาก..."
 intrigue_scheming.4021.b.success:0 "ข้าหลอกล่อให้ [prisoner.GetTitledFirstName] บอกสิ่งที่[prisoner.GetSheHe]รู้แก่ข้า"
 intrigue_scheming.4021.b.failure:0 "[prisoner.GetTitledFirstName] สามารถต้านทานกลอุบายทางจิตของข้าได้"
 intrigue_scheming.4021.c:0 "ขู่ว่าจะทรมาน [prisoner.GetHerHim] เว้น แต่[prisoner.GetSheHe]จะสารภาพ!"
 intrigue_scheming.4021.c.success:0 "คำขู่ของข้า ทำให้ [prisoner.GetTitledFirstName] กลัวจนต้องสารภาพ"
 intrigue_scheming.4021.c.failure:0 "คำขู่ของข้าดูเหมือนจะไม่ ทำให้ [prisoner.GetTitledFirstName] หวั่นไหว"
 intrigue_scheming.4021.success:0 "ข้าเรียนรู้[secret|E]ที่ [prisoner.GetTitledFirstName] รู้"
 intrigue_scheming.4021.failure:0 "ข้าไม่ได้เรียนรู้อะไรที่สำคัญ"

# Passing Suspicion, by Sean Hughes
 intrigue_scheming.4040.t:0 "ความสงสัยที่ผ่านไป"
 intrigue_scheming.4040.desc:0 "เป็นที่ทราบกันดีว่า[ROOT.Char.Custom('GetCourtierPlural')]จะวางแผนร้ายและสมคบคิด แต่ข้าอาจใช้สิ่งนี้ให้เป็นประโยชน์ได้\n\nหากข้าสามารถ ทำให้[ROOT.Char.Custom('GetCourtierPlural')]ของข้าสงสัย ซึ่งกันและกันและวอกแวกกับการต่อสู้กันเอง พวกเขาจะไม่มีเวลาหรือทรัพยากรที่จะวางแผนร้ายต่อข้า!"
 intrigue_scheming.4040.a:0 "ข้าจะเริ่มปล่อยข่าวลือทันที!"
 intrigue_scheming.4040.a.success:0 "ข่าวลือ ทำให้[ROOT.Char.Custom('GetCourtierPlural')]ของข้าไม่ไว้วางใจ ซึ่งกันและกัน"
 intrigue_scheming.4040.a.success.tt:0 "[courtier_1.GetFirstName], [courtier_2.GetFirstName] และ [courtier_3.GetFirstName] สูญเสีย #N [EmptyScope.ScriptValue('medium_positive_opinion')|N0]#! [opinion|E] ต่อกัน"
 intrigue_scheming.4040.a.success.desc:0 "ข่าวลือที่ข้าปล่อยไปทั่ว[ROOT.Char.Custom('GetCourt')]ของข้าได้สร้างความไม่ไว้วางใจในหมู่[ROOT.Char.Custom('GetCourtierPlural')]หลายคนของข้า"
 intrigue_scheming.4040.a.failure:0 "ข่าวลือถูกปัดตกไปว่าเป็นเรื่องไร้สาระ"
 intrigue_scheming.4040.a.failure.tt:1 "ข่าวลือที่ท่านปล่อยไปทั่ว[ROOT.Char.Custom('GetCourt')]ของท่านถูกปัดตกไปว่าเป็นเรื่องไร้สาระ"
 intrigue_scheming.4040.b:0 "ตราบใดที่ข้าส่งสายลับบางคนไปอยู่ท่ามกลางพวกเขา ข้าก็จะปลอดภัย"
 intrigue_scheming.4040.c.dread:0 "[ROOT.Char.Custom('GetCourtierPlural')]ของข้ารู้อยู่แล้วว่าไม่ควรวางแผนร้ายต่อข้า!"
 intrigue_scheming.4040.c.dread.tt:1 "ตัวเลือกนี้มีให้ เนื่องจาก [dread|E] ที่สูงของท่าน"

# Information Brokering, by Sean Hughes
 intrigue_scheming.4050.t:0 "การซื้อขายข้อมูล"
 intrigue_scheming.4050.desc.start:0 "ข้าคาดว่า [buyer.GetTitledFirstName] คงจะสนใจอย่างยิ่งในข้อมูลที่ข้าได้รับมา ซึ่งบ่งชี้ว่า"
 intrigue_scheming.4050.desc.lover:1 "[buyer.Custom2('RelationToMeShort', SCOPE.sC('owner'))] ของ[buyer.GetHerHis] [owner.GetTitledFirstName] กำลังหลับนอนกับ [target.GetTitledFirstName]..."
 intrigue_scheming.4050.desc.incest:2 "[buyer.Custom2('RelationToMeShort', SCOPE.sC('owner'))] ของ[buyer.GetHerHis] [owner.GetTitledFirstName] และ [owner.Custom2('RelationToMeShort', SCOPE.sC('target'))] ของ [owner.GetFirstNamePossessiveNoTooltip] [target.GetTitledFirstName] ได้มีความสัมพันธ์ทางเพศต่อกัน..."
 intrigue_scheming.4050.desc.pregnancy:1 "[buyer.Custom2('RelationToMeShort', SCOPE.sC('owner'))] ของ[buyer.GetHerHis] [owner.GetTitledFirstName] กำลังตั้งครรภ์กับลูกของ [target.GetTitledFirstName]..."
 intrigue_scheming.4050.desc.bastard:3 "[buyer.Custom2('RelationToMeShort', SCOPE.sC('target'))] ของ[buyer.GetHerHis] [target.GetTitledFirstName] แท้จริงแล้วเป็นบุตรของ [target.GetRealFather.GetTitledFirstName]..."
 intrigue_scheming.4050.desc.murderattempt:0 "[owner.GetTitledFirstName] อยู่เบื้องหลังแผนการลอบสังหาร [target.GetTitledFirstName] ที่ล้มเหลว..."
 intrigue_scheming.4050.desc.murderattemptself:0 "[owner.GetTitledFirstName] อยู่เบื้องหลังแผนการลอบสังหาร[target.GetHerHim]ที่ล้มเหลว..."
 intrigue_scheming.4050.desc.murder:0 "[owner.GetTitledFirstName] เป็นฆาตกรของ [buyer.Custom2('RelationToMeShort', SCOPE.sC('target'))] ของ[buyer.GetHerHis] [target.GetTitledFirstName]..."
 intrigue_scheming.4050.desc.end:0 "\n\nบางที [buyer.GetSheHe] อาจจะสนใจมากพอที่จะเสนออะไรบางอย่างที่สำคัญให้ข้าเป็นการแลกเปลี่ยน?"
 intrigue_scheming.4050.a:0 "ข้าจะขายข้อมูลให้[buyer.GetHerHim]เพื่อแลกกับทองคำ"
 intrigue_scheming.4050.b:0 "ความลับแลกความลับเป็นการค้าที่ยุติธรรม"
 intrigue_scheming.4050.b.tt:1 "[buyer.GetTitledFirstName] จะเปิดเผยความลับที่[buyer.GetSheHe]รู้แก่ท่าน"
 intrigue_scheming.4050.c:0 "ข้าจะบอก[buyer.GetHerHim]ก็ต่อเมื่อแลกกับบุญคุณเท่านั้น"
 intrigue_scheming.4050.c.rival:0 "ขอให้สิ่งนี้เป็นเครื่องบรรณาการสันติภาพระหว่างเรา"
 intrigue_scheming.4050.c.opinion:0 "ความปรารถนาดีของ[buyer.GetHerHis|U]คือการชำระเงินเพียงอย่างเดียวที่ข้าต้องการ"
 intrigue_scheming.4050.d:0 "ความรู้คืออำนาจ และข้าจะไม่ให้มันไปง่ายๆ"
 intrigue_scheming.4050.success:0 "[buyer.GetTitledFirstName] ยอมรับข้อเสนอของท่าน"
 intrigue_scheming.4050.failure:0 "[buyer.GetTitledFirstName] ปฏิเสธข้อเสนอของท่าน"

 intrigue_scheming.4051.desc.start:0 "[seller.GetTitledFirstName] ได้เข้ามาหาข้า อ้างว่า[seller.GetSheHe]ได้ค้นพบ"
 intrigue_scheming.4051.desc.lover:0 "ใครบางคนในครอบครัวใกล้ชิดของข้ากำลังมีความสัมพันธ์นอกสมรส"
 intrigue_scheming.4051.desc.bastard:0 "ความชอบธรรมอย่างต่อเนื่องของเชื้อสายของข้าตกอยู่ในความเสี่ยง เว้น แต่ข้าจะดำเนินการ"
 intrigue_scheming.4051.desc.murderattempt:0 "ใครอยู่เบื้องหลังแผนการลอบสังหาร [target.GetTitledFirstName] ที่ล้มเหลว"
 intrigue_scheming.4051.desc.murderattemptself:0 "ใครอยู่เบื้องหลังแผนการลอบสังหารข้าที่ล้มเหลว"
 intrigue_scheming.4051.desc.murder:0 "ใครอยู่เบื้องหลังการฆาตกรรม [buyer.Custom2('RelationToMeShort', SCOPE.sC('target'))] ของข้า [target.GetTitledFirstName]"
 intrigue_scheming.4051.desc.incest:0 "การมีอยู่ของความสัมพันธ์ร่วมสายโลหิตในครอบครัวของข้าเอง!"
 intrigue_scheming.4051.desc.middle:0 "\n\n[seller.GetSheHe|U]ได้เสนอที่จะให้ข้อมูลทุกอย่างที่[seller.GetSheHe]รู้แก่ข้า รวมถึงชื่อและหลักฐาน"
 intrigue_scheming.4051.desc.gold:0 "เพื่อแลกกับทองคำก้อนหนึ่ง"
 intrigue_scheming.4051.desc.secret:0 "เพื่อแลกกับรายละเอียดของความลับอื่นที่ข้ารู้"
 intrigue_scheming.4051.desc.favor:0 "เพื่อแลกกับบุญคุณที่จะตอบแทนในอนาคต"
 intrigue_scheming.4051.desc.rival:0 "ในฐานะเครื่องบรรณาการสันติภาพระหว่างเรา เพื่อที่เราจะได้ละทิ้งความขุ่นเคืองใจ"
 intrigue_scheming.4051.desc.opinion:0 "ในฐานะท่าทีแห่งความปรารถนาดี"
 intrigue_scheming.4051.a:0 "ข้าต้องรู้ความจริง!"
 intrigue_scheming.4051.a.tt:1 "ท่านเรียนรู้รายละเอียดของความลับที่ไม่รู้จักนี้"
 intrigue_scheming.4051.a.opinion:0 "ช่างใจกว้างเสียจริง!"
 intrigue_scheming.4051.b:0 "หินบางก้อนปล่อยทิ้งไว้ไม่พลิกดูจะดีกว่า..."

 intrigue_scheming.4052.desc:0 "ด้วยสิ่งล่อใจของความลับที่ข้าถือครองอยู่ ซึ่งยากเกินกว่าจะเพิกเฉย [buyer.GetTitledFirstName] จึงตกลงตามข้อเสนอของข้า หากข้ายังคงสอดแนมต่อไป ข้าอาจสามารถจัดการข้อตกลง เช่นนี้ได้มากขึ้นในอนาคต..."
 intrigue_scheming.4052.a:0 "มีศักยภาพมากมายที่นี่!"

 intrigue_scheming.4053.desc:0 "ไม่ว่า [buyer.GetTitledFirstName] จะเชื่อข้าหรือไม่เมื่อข้าบอก[buyer.GetHerHim]ว่าข้ามีข้อมูลเกี่ยวกับครอบครัวของ[buyer.GetHerHis]นั้นยากที่จะบอกได้ ไม่ว่ากรณีใดก็ตาม [buyer.GetSheHe]ปฏิเสธที่จะยอมรับเงื่อนไขของข้า ส่งข้ากลับไปมือเปล่า"
 intrigue_scheming.4053.a:0 "ข้าจะต้องหาวิธีอื่นในการใช้ข้อมูลนี้..."

 intrigue_scheming.4054.desc.start:0 "หลังจากตรวจสอบเอกสารที่ข้าได้รับจาก [seller.GetTitledFirstName] ก็เป็นที่ชัดเจนว่า"
 intrigue_scheming.4054.desc.lover:1 "[buyer.Custom2('RelationToMeShort', SCOPE.sC('owner'))] ของข้า [owner.GetTitledFirstName] กำลังหลับนอนกับ [target.GetTitledFirstName]!"
 intrigue_scheming.4054.desc.incest:1 "[buyer.Custom2('RelationToMeShort', SCOPE.sC('owner'))] ของข้า [owner.GetTitledFirstName] และ [buyer.Custom2('RelationToMeShort', SCOPE.sC('target'))] ของข้า [target.GetTitledFirstName] ได้มีความสัมพันธ์ทางเพศต่อกัน!"
 intrigue_scheming.4054.desc.pregnancy:1 "[buyer.Custom2('RelationToMeShort', SCOPE.sC('owner'))] ของข้า [owner.GetTitledFirstName] กำลังตั้งครรภ์กับลูกของ [target.GetTitledFirstName]!"
 intrigue_scheming.4054.desc.bastard:2 "[buyer.Custom2('RelationToMeShort', SCOPE.sC('target'))] ของข้า [target.GetTitledFirstName] แท้จริงแล้วเป็นบุตรของ [target.GetRealFather.GetTitledFirstName]!"
 intrigue_scheming.4054.desc.murderattempt:0 "[owner.GetTitledFirstName] อยู่เบื้องหลังแผนการลอบสังหาร [target.GetTitledFirstName] ที่ล้มเหลว!"
 intrigue_scheming.4054.desc.murderattemptself:0 "[owner.GetTitledFirstName] อยู่เบื้องหลังแผนการลอบสังหารข้าที่ล้มเหลว!"
 intrigue_scheming.4054.desc.murder:1 "[owner.GetTitledFirstName] เป็นฆาตกรของ [buyer.Custom2('RelationToMeShort', SCOPE.sC('target'))] ของข้า [target.GetTitledFirstName]!"
 intrigue_scheming.4054.a:0 "อย่างน้อยตอนนี้ข้าก็รู้แล้ว"
 intrigue_scheming.4054.a.incest:0 "ผิดธรรมชาติ! เป็นการลบหลู่ [ROOT.Char.GetFaith.HighGodName]!"
 intrigue_scheming.4054.a.incest.deviant:0 "โอ้ ช่างเย้ายวนใจยิ่งนัก!"
 intrigue_scheming.4054.a.incest.accepted:0 "มันผิดตรงไหนกันแน่?"
 intrigue_scheming.4054.a.murder:0 "ไอ้คนเจ้าเล่ห์นั่น!"
 intrigue_scheming.4054.a.bastard:0 "ข้าถูกทรยศ!"

# Special Chain — Convince Courtier to Share Spy-Secrets 
 intrigue_scheming_special.1001.t:0 "การแสดงละคร"
 intrigue_scheming_special.1001.desc:0 "เสียงกระซิบที่ได้ยินแว่วๆ และการจ้องมองอย่างเฉียบคมเป็นชิ้นส่วนสุดท้ายที่ ทำให้ปริศนาคลี่คลาย [ROOT.GetCharacter.Custom2('RelationToMe', SCOPE.sC('courtier_spy'))] ของข้า [courtier_spy.GetTitledFirstName] เชี่ยวชาญในศาสตร์แห่งอุบายมากกว่าที่[courtier_spy.GetSheHe]อยากให้ทุกคนเชื่อ\n\nการรู้ว่ามี[courtier_spy.GetWomanMan] เช่นนั้นอยู่ในราชสำนัก ทำให้ข้าค่อนข้างประหม่า อย่างไรก็ตาม ข้าอาจเรียนรู้ได้มาก หากข้าสามารถ ทำให้[courtier_spy.GetHerHim]ไว้วางใจข้าได้"
 intrigue_scheming_special.1001.a:0 "ข้าจะโน้มน้าว[courtier_spy.GetHerHim]ว่าเราเป็นพวกเดียวกัน!"
 intrigue_scheming_special.1001.b:0 "ความเสี่ยงนั้นยิ่งใหญ่เกินไป #EMP ข้า#! ไม่สามารถไว้ใจ #EMP [courtier_spy.GetHerHim]#! ได้"
 intrigue_scheming_special.1001.c:0 "[courtier_spy.GetSheHe|U]ต้องไป!"

 intrigue_scheming_special.1002.desc:0 "ใช้เวลาหลายวัน แต่ในที่สุดข้าก็ #EMP บังเอิญ#! พบ [courtier_spy.GetTitledFirstName] ขณะที่[courtier_spy.GetSheHe]อยู่ตามลำพัง "[courtier_spy.GetLadyLord|U] [courtier_spy.GetTitledFirstNameNoTooltip] ข้าตั้งใจจะ—"\n"หากท่านเดินเข้าไปในห้องแล้วพบว่าคู่สมรสของท่านกำลังตะคอกใส่เด็กรับใช้ที่ทำจานหล่น ท่านจะทำอย่างไร?"\n\n[courtier_spy.GetSheHe]กำลังทดสอบข้าอยู่หรือ? บางทีนี่อาจเป็นโอกาสของข้าที่จะโน้มน้าว[courtier_spy.GetHerHim]ว่าเรามีอะไรเหมือนกันมาก"
 intrigue_scheming_special.1002.a:0 "แน่นอนว่าเด็กรับใช้จะถูกลงโทษ"
 intrigue_scheming_special.1002.b:0 "ทุกคนทำผิดพลาดได้ ข้าจะให้อภัยเด็กรับใช้"
 intrigue_scheming_special.1002.c:0 "พวกเขาทั้งสองจะต้องบอกข้าว่าเกิดอะไรขึ้น"
 intrigue_scheming_special.1002.d:0 "ข้ามั่นใจว่าพวกเขาจะจัดการได้ดีกว่าหากไม่มีข้า"
 intrigue_scheming_special.1002.e:0 "ข้าจะส่งเสริมการสนทนา มันช่วยแก้ปัญหาส่วนใหญ่ได้"
 intrigue_scheming_special.1002.f:0 "การต่อสู้? ข้าจะจากไปให้เร็วที่สุด"
 intrigue_scheming_special.1002.g:0 "ข้าจะเข้าร่วมตะคอกด้วย!"
 intrigue_scheming_special.1002.h:0 "ข้าจะขอให้ทั้งสองฝ่ายนำเสนอเรื่องราวของตนเอง"

 intrigue_scheming_special.1003.desc_good:0 ""หืม" [courtier_spy.GetSheHe|U]หยุดชั่วคราว ครุ่นคิด ก่อนจะพูดต่อ\n\n"
 intrigue_scheming_special.1003.desc_bad:0 ""หืม" [courtier_spy.GetSheHe|U]หยุดชั่วคราว ทำหน้าบึ้งราวกับว่า[courtier_spy.GetSheHe]กำลังชิมของเปรี้ยว ก่อนจะพูดต่อ\n\n"
 intrigue_scheming_special.1003.desc:0 ""ระหว่างการเดินทัพไปรบ ขณะที่ท่านกำลังตั้งค่ายพัก นายทหารคนหนึ่งเข้ามาหาท่านเพื่อถามว่าควรทำอย่างไรกับสายลับที่ถูกจับได้""
 intrigue_scheming_special.1003.a:0 "ทำให้สายลับเป็นตัวอย่าง!"
 intrigue_scheming_special.1003.b:0 "ก่อนอื่นข้าจะ ทำให้แน่ใจว่าสายลับได้รับการปฏิบัติอย่างดี"
 intrigue_scheming_special.1003.c:0 "สายลับรึ? ไม่สำคัญ เราเดินทัพต่อไป!"
 intrigue_scheming_special.1003.d:0 "ข้ามั่นใจว่านายทหารจะรู้ว่าต้องทำอย่างไร"
 intrigue_scheming_special.1003.e:0 "ข้าจะคุยกับสายลับ ดูว่าพวกเขามีอะไรจะพูด"
 intrigue_scheming_special.1003.f:0 "ข้าจะขอให้นายทหารจัดการเรื่องนี้และปล่อยข้าไว้ตามลำพัง"
 intrigue_scheming_special.1003.g:0 "สายลับ?! เราจะไม่มีทาง— มันจะไม่มีทางเกิดขึ้น!"
 intrigue_scheming_special.1003.h:0 "เห็นได้ชัดว่าสายลับมีคำตอบบางอย่างที่จะให้ ในเวลาที่เหมาะสม"

 intrigue_scheming_special.1004.desc_good:0 "[courtier_spy.GetSheHe|U]พยักหน้าให้[courtier_spy.GetHerselfHimself]ก่อนจะวาดภาพสถานการณ์ต่อไป\n\n"
 intrigue_scheming_special.1004.desc_bad:0 "คิ้วของ[courtier_spy.GetHerHis|U]ขมวดลง และสายตาของ[courtier_spy.GetHerHis]ก็เย็นชาลง\n\n"
 intrigue_scheming_special.1004.desc:0 ""ท่านตัดสินใจ — สมมติว่าภาษีทั้งหมดในเคาน์ตีจะถูกขึ้น — และท่านทราบว่าข้าหลวงคนหนึ่งของท่านตั้งคำถามกับการตัดสินใจนั้นอย่างเปิดเผย ท่านจะตอบสนองอย่างไร?""
 intrigue_scheming_special.1004.a:0 "การลงโทษเป็นทางเลือกเดียว"
 intrigue_scheming_special.1004.b:0 "เราทุกคนต่างมีความแตกต่าง มันจะไม่รบกวนข้า"
 intrigue_scheming_special.1004.c:0 "ไม่มีใครตั้งคำถามกับข้าแบบนั้น! ข้าจะเผชิญหน้ากับข้าหลวง"
 intrigue_scheming_special.1004.d:0 "หากข้าหลวงของข้าคิดว่าเป็นการตัดสินใจที่ไม่ดี มันก็คงจะเป็น เช่นนั้น"
 intrigue_scheming_special.1004.e:0 "ทั้งราชสำนักจะได้ยินถึงความผิดพลาดทุกอย่างของข้าหลวง"
 intrigue_scheming_special.1004.f:0 "ข้าจะพยายามเพิกเฉยต่อการดูหมิ่น ไม่จำเป็นต้องสร้างเรื่อง"
 intrigue_scheming_special.1004.g:0 "เอาล่ะ ข้าจะเผชิญหน้ากับพวกเขา เสียงดัง"
 intrigue_scheming_special.1004.h:0 "ความเห็นต่างควรแก้ไขด้วยการหารือ"

 intrigue_scheming_special.1099.desc_won:0 "ใบหน้าของ[courtier_spy.GetHerHis|U]สว่างขึ้นด้วยรอยยิ้มที่อบอุ่นอย่างน่าประหลาดใจ "ดูเหมือนท่านจะเป็น[ROOT.Char.GetWomanMan]ที่มีวิจารณญาณดี"\n\n[courtier_spy.GetSheHe|U] [courtier_spy.Custom('quirk_pos_present')] ก่อนจะเคลื่อนตัวไปตามทางเดินด้วยฝีเท้าเงียบกริบ "โปรด ตามข้ามา เรามีเรื่องต้องหารือกันมาก""
 intrigue_scheming_special.1099.desc_lost:0 "[courtier_spy.GetSheHe|U]ขมวดคิ้ว และถอยหลังไปก้าวหนึ่ง "ข้าจะขอบคุณหากท่านไม่เข้ามาหาข้าเกี่ยวกับเรื่องนี้อีก"\n\nก่อนที่ข้าจะมีเวลาตอบ [courtier_spy.GetSheHe]ก็ได้เริ่มเคลื่อนตัวไปตามโถงทางเดินแล้ว ทุกย่างก้าวปกคลุม[courtier_spy.GetHerHim]ให้ลึกเข้าไปในเงา"
 intrigue_scheming_special.1099.a:0 "ข้าควรจะแสร้งทำต่อไป อย่างน้อยก็ในตอนนี้"
 intrigue_scheming_special.1099.b:0 "[courtier_spy.GetSheHe|U]ช่างเป็นปริศนาเสียจริง"
 
# Special Chain — Root out secrets at your court, by Linnéa Thimrén
 intrigue_scheming_special.1301.t:0 "ถูกไล่ล่าโดยเงา"
 intrigue_scheming_special.1301.desc:0 "เสียงฝีเท้าดังก้องไปตามโถงทางเดินอันมืดมิด เอกสารที่วางผิดที่ในห้องทำงานของข้า เงาที่เห็นจากหางตา..."
 intrigue_scheming_special.1301.desc_mentor_or_other:0 "\n\n"ท่านคิดว่ามีคนตามท่านอยู่หรือ?" [ROOT.GetCharacter.Custom2('RelationToMe' , SCOPE.sC('mentor_or_other'))] ของข้า [mentor_or_other.GetTitledFirstName] ดูเหมือนจะครุ่นคิดก่อนจะพยักหน้าให้[mentor_or_other.GetHerselfHimself] "ข้า #EMP ได้#! สังเกตเห็นบางสิ่งที่น่าสงสัยใน[ROOT.Char.Custom('FortifiedBuilding')]เมื่อเร็วๆ นี้""
 intrigue_scheming_special.1301.a:0 "ข้าต้องสืบให้ถึงต้นตอของเรื่องนี้!"
 intrigue_scheming_special.1301.b:0 "ข้าจะ ทำให้แน่ใจว่าข้าจะไม่ต้องกังวลเรื่องความปลอดภัยอีกต่อไป"

 intrigue_scheming_special.1302.desc:0 "ซ่อนตัวอยู่ในโถงทางเดินที่เปลี่ยวร้างแห่งหนึ่ง ซึ่งนำไปสู่ห้องส่วนตัวส่วนใหญ่ รวมถึงสวนของ[ROOT.Char.Custom('FortifiedBuilding')] ข้ารอ และข้าเฝ้าดู\n\n#EMP มันโง่หรือเปล่าที่มาที่นี่? บางทีถ้าข้า#!- เสียงฝีเท้า เคลื่อนไหวอย่างเงียบๆ ไปตามโถงทางเดิน ร่างหนึ่งปรากฏขึ้นจากเงา\n\n[sneaky_courtier.GetTitledFirstName] กำลังทำอะไรอยู่ที่นี่?"
 intrigue_scheming_special.1302.a:0 "ข้าจะเผชิญหน้ากับ[sneaky_courtier.GetHerHim]ทันที!"
 intrigue_scheming_special.1302.a.tt:1 "หาก [sneaky_courtier.GetFirstName] มีส่วนเกี่ยวข้องในแผนการร้าย ท่านจะเปิดโปงมัน\nหากไม่ ความพยายามของท่านในการกำจัดสายลับจะล้มเหลว"
 intrigue_scheming_special.1302.b:0 "ข้าต้องแน่ใจ ข้าจะตาม[sneaky_courtier.GetHerHim]ต่อไป"
 intrigue_scheming_special.1302.b.tt1:1 "[sneaky_courtier.GetSheHe|U]ไม่สังเกตเห็นท่าน"
 intrigue_scheming_special.1302.b.tt2:1 "[sneaky_courtier.GetSheHe|U]ได้ยินเสียงท่านตาม[sneaky_courtier.GetHerHim]"
 intrigue_scheming_special.1302.c:0 "ข้าจะไม่เปิดเผยตัวเอง มันคงไม่ใช่[sneaky_courtier.GetHerHim]"
 intrigue_scheming_special.1302.c.tt:1 "ท่านจะค้นหาสายลับต่อไป"

 intrigue_scheming_special.1303.desc_exposed:0 "ความจำเป็นในการตาม [sneaky_courtier.GetTitledFirstName] เพื่อหาว่า[sneaky_courtier.GetSheHe]กำลังทำอะไรอยู่ได้ผ่านไปแล้ว [sneaky_courtier.GetSheHe]เป็นสายลับที่รู้จักกันดี!\n\nหวังว่าข้าจะสามารถสังเกตเห็นสัญญาณได้เร็วกว่านี้หากมันเกิดขึ้นอีก... นี่เป็นความรู้ที่ได้มาอย่างยากลำบาก!"
 intrigue_scheming_special.1303.desc_sneak_win:0 "ข้าสามารถตาม [sneaky_courtier.GetTitledFirstName] ไปได้โดยไม่มีเสียง [sneaky_courtier.GetSheHe|U]รีบเดินไปตามโถงทางเดินหนึ่งแล้วอีกโถงหนึ่ง และหลังจากนั้นสองสามนาที [sneaky_courtier.GetSheHe]ก็เดินผ่านห้องของข้าไปและออกไปยังสวนของ[ROOT.Char.Custom('FortifiedBuilding')]"
 intrigue_scheming_special.1303.desc_sneak_win_spy:0 "ข้าสามารถตาม[sneaky_courtier.GetHerHim]ไปได้โดยไม่มีเสียง และเมื่อเราเข้าใกล้ห้องส่วนตัวของข้า ข้าก็รู้สึกว่าชีพจรเต้นเร็วขึ้น\n\nในไม่ช้า เสียงคลิกของกุญแจห้องส่วนตัวของข้าก็ดังก้องไปตามโถงทางเดิน"
 intrigue_scheming_special.1303.desc_sneak_fail:0 "ข้าตาม [sneaky_courtier.GetTitledFirstName] ไปโดยไม่มีใครสังเกตเห็น และเมื่อเราเข้าใกล้ห้องส่วนตัวของข้าและสวนของ[ROOT.Char.Custom('FortifiedBuilding')] หัวใจของข้าก็เต้นเร็วขึ้น [sneaky_courtier.GetSheHe]กำลังทำอะไรอยู่ที่นี่? ด้วยความวอกแวก ข้าชนแจกันที่ประดับโถงทางเดิน และมันก็หล่นลงพื้นแตก\n\nเสียงดังที่ตามมาเกือบจะกลบเสียงฝีเท้าเร่งรีบของ[sneaky_courtier.GetHerHis]ขณะที่มันจางหายไปตามทางเดิน และในไม่ช้า[sneaky_courtier.GetSheHe]ก็หายไปในยามค่ำคืน"
 intrigue_scheming_special.1303.a:0 "เผชิญหน้ากับ[sneaky_courtier.GetHerHim]!"
 intrigue_scheming_special.1303.b:0 "บัดซบ! ข้าจะต้องจับตาดู"
 intrigue_scheming_special.1303.c:0 "เอาล่ะ คืนนี้ #EMP อากาศ#! ดีจริงๆ"
 intrigue_scheming_special.1303.c.tt:1 "ท่านคลายความสงสัยลงแล้ว และนี่เป็นบทเรียนอันมีค่า\n"
 intrigue_scheming_special.1303.d:0 "แต่ข้าสังเกตเห็นสัญญาณได้เร็ว!"

 intrigue_scheming_special.1304.desc_found:0 "ข้ารู้อยู่แล้ว! ข้ามีเวลาเพียงพอที่จะถอยกลับเข้าไปในอ้อมกอดอันมืดมิดของเงาเมื่อ [sneaky_courtier.GetTitledFirstName] เดินมาตามโถงทางเดิน มุ่งตรงไปยังห้องของข้า\n\nเสียงคลิกของกุญแจขณะที่มันถูกสะเดาะตามมาอย่างรวดเร็วด้วยเสียงร้องของ[sneaky_courtier.GetHerHis]เมื่อข้าเอามือวางบนไหล่ของ[sneaky_courtier.GetHerHis]"
 intrigue_scheming_special.1304.desc_not_found:0 "เมื่อค่ำคืนผ่านไป โถงทางเดินก็เงียบสงัด ไม่ได้ยินเสียงกระซิบใดๆ และไม่เห็นเงาที่คุกคามใดๆ\n\nบางทีข้าควรจะตาม [sneaky_courtier.GetTitledFirstName] ไปตั้งแต่แรก?"
 intrigue_scheming_special.1304.a:0 ""ข้าคิดว่าเจ้าควรมากับข้า""
 intrigue_scheming_special.1304.b:0 "หรือบางทีอาจไม่เคยมีภัยคุกคามใดๆ ตั้งแต่แรก?"

 intrigue_scheming_special.1350.desc:0 "ตอนนี้ [sneaky_courtier.GetTitledFirstName] ได้จากไปแล้ว ข้าจะไม่มีวันรู้ว่า[sneaky_courtier.GetSheHe]ทำงานต่อต้านข้าหรือไม่... อย่างไรก็ตาม การสืบสวนของข้าสอนข้ามากมาย และครั้งต่อไปข้าจะไม่ต้องสงสัยอีกต่อไป!"
 intrigue_scheming_special.1350.a:0 "การจากไปของ[sneaky_courtier.GetHerHis]เป็นพร หรือเป็นเพียงเรื่องบังเอิญ?"

 intrigue_scheming_special.1398.desc:0 ""ทำไมท่านถึงกล่าวหาข้า เช่นนี้?!" [sneaky_courtier.GetTitledFirstName] ถามข้า เสียงเจือด้วย[sneaky_courtier.Custom('GeneralTemperament')] "ข้าเพียงแค่ออกไปที่สวนเพื่อสูดอากาศ"\n\nตอนนี้ เมื่อเผชิญกับความเจ็บปวดในดวงตาของ[sneaky_courtier.GetHerHis] ข้าไม่รู้เลยว่าข้าเคยจินตนาการว่า[sneaky_courtier.GetHerHim]เป็นสายลับได้อย่างไร"
 intrigue_scheming_special.1398.a:0 "ข้าหวังว่า[sneaky_courtier.GetSheHe]จะให้อภัยข้าได้"

 intrigue_scheming_special.1399.desc:0 "ข้าเอามือวางบนไหล่ของ[sneaky_courtier.GetHerHis] และ [sneaky_courtier.GetTitledFirstName] ก็หันกลับมาเร็วปานสายฟ้า ถูกจับได้กลางภารกิจของ[sneaky_courtier.GetHerHis] [sneaky_courtier.GetSheHe]ไม่แม้ แต่จะพยายามปกป้อง[sneaky_courtier.GetHerselfHimself]\n\nเรื่องราวทั้งหมดนี้ได้สอนบทเรียนอันมีค่าแก่ข้าในเรื่องความไว้วางใจและความระแวดระวัง และตอนนี้ข้าก็เฉียบแหลมกว่าที่เคย!"

# An Anonymous Informant by Chad Uhl
 realm_has_more_than_2_siegeable_holdings_trigger_desc:0 "ที่ดินของศัตรูตั้งแต่ 2 แห่งขึ้นไปสามารถถูกล้อมได้"
 realm_has_more_than_2_siegeable_holdings_trigger_desc_not:0 "ที่ดินของศัตรูน้อยกว่า 2 แห่งสามารถถูกล้อมได้"

 intrigue_scheming.1801.t:0 "ผู้ให้ข้อมูลนิรนาม"
 intrigue_scheming.1801.desc:0 "และยื่นจดหมายนิรนามที่[spymaster.GetSheHe]เพิ่งได้รับให้ข้า ดูเหมือนว่าเราจะมีโอกาสพิเศษในการได้รับข้อมูลเกี่ยวกับกลยุทธ์ป้องกันของ [enemy.GetTitledFirstNamePossessive]\n\nจดหมายอ่านว่า:\n\n"หากท่านต้องการข้อมูลเกี่ยวกับการป้องกันของ [enemy.GetFirstNamePossessiveNoTooltip] ให้[spymaster.GetCouncilTitle]ของท่าน [spymaster.GetFirstNameNoTooltip] พบข้าที่ [meeting_place.GetName] ภายในสองสัปดาห์ นำทองคำมามากๆ""
 intrigue_scheming.1801.a:0 "ข้าคงเป็นคนโง่หากไม่สืบสวนเรื่องนี้"
 intrigue_scheming.1801.b:0 "นี่เป็นเพียงการขู่กรรโชกที่ว่างเปล่า"
 intrigue_scheming.1801_landed: "[spymaster.GetCouncilTitle] ของข้า [spymaster.GetFirstName] รีบเข้ามาในห้อง"
 intrigue_scheming.1801_laamp: "[GetCourtPositionType('second_camp_officer').GetNameNoTooltip] ของข้า [spymaster.GetFirstName] รีบเข้ามาในเต็นท์"

 intrigue_scheming.1802.intro_desc:0 "[spymaster.GetFirstName] กลับมาจากการพบกับผู้ให้ข้อมูลนิรนาม ด้วยสีหน้าเคร่งขรึมบนใบหน้าของ [spymaster.GetHerHis] [spymaster.GetSheHe] กางแผ่นหนังแกะที่จารึกสิ่งที่ดูเหมือนจะเป็นกลยุทธ์การป้องกันของศัตรูของข้าออก"
 intrigue_scheming.1802.g_high_skill_desc:0 "$intrigue_scheming.1802.intro_desc$\n\nเท่าที่ข้าสามารถบอกได้ แผนผังสำหรับแผนการป้องกันของ [enemy.GetFirstNamePossessive] เหล่านี้ดูเหมือนจะเป็นของแท้มากที่สุดเท่าที่จะเป็นไปได้"
 intrigue_scheming.1802.g_medium_skill_desc:0 "$intrigue_scheming.1802.intro_desc$\n\nแผนผังที่วาดบนแผ่นหนังแกะนั้นสมเหตุสมผล แต่มีบางส่วนที่ไม่สอดคล้องกับความรู้ที่มีอยู่ของเราเกี่ยวกับกลยุทธ์ตามปกติของ [enemy.GetFirstNamePossessive]"
 intrigue_scheming.1802.decent_skill_desc:0 "$intrigue_scheming.1802.intro_desc$\n\nเอกสารดูเหมือนจะเป็นของแท้ แต่มีบางอย่างดูไม่ชอบมาพากล... แม้ว่าข้าจะไม่สามารถระบุได้ว่าคืออะไร"
 intrigue_scheming.1802.fallback_desc:0 "$intrigue_scheming.1802.intro_desc$\n\nแทบจะเป็นไปไม่ได้เลยที่จะบอกว่าแผนการเหล่านี้เป็นของแท้หรือไม่"
 intrigue_scheming.1802.a:0 "ดำเนินการตามข้อมูล"
 intrigue_scheming.1802.b:0 "ไม่สนใจข้อมูล"

 intrigue_scheming.1803.f_high_skill_desc:0 "$intrigue_scheming.1802.intro_desc$\n\nขณะที่ข้าดูเอกสาร ข้าพบข้อผิดพลาดที่เห็นได้ชัดเจนมากเกินไปในแผนการเหล่านี้เกินกว่าจะเป็นของแท้ได้ ข้าถูกหลอกแล้ว!"
 intrigue_scheming.1803.f_medium_skill_desc:0 "$intrigue_scheming.1802.intro_desc$\n\nรายละเอียดบางอย่างที่อธิบายโดยแผนการนั้นสมเหตุสมผล แต่หลายอย่างไม่สอดคล้องกับสิ่งที่เรารู้เกี่ยวกับกลยุทธ์ป้องกันตามปกติของ [enemy.GetFirstNamePossessive]"

 intrigue_scheming.1803.a:0 "ดำเนินการตามข้อมูล"
 intrigue_scheming.1803.b:0 "ไม่สนใจข้อมูล"

 intrigue_scheming.1804.genuine_info_desc:0 "ข่าวเพิ่งกลับมาจากกองกำลังของข้าที่กำลังล้อม [barony.GetName] ในสงครามของข้ากับ [enemy.GetTitledFirstName] พวกเขารายงานว่าข้อมูลที่เราได้รับจากผู้ให้ข้อมูลนิรนามนั้นเป็นของแท้!\n\nด้วยความรู้ภายในเกี่ยวกับกลยุทธ์ป้องกันของ [enemy.GetFirstNamePossessiveNoTooltip] พวกเขาสามารถยึด[enemy.Custom('FortifiedBuilding')]ได้ในเวลาอันรวดเร็ว ชัยชนะดูเหมือนจะแน่นอนแล้ว!"
 intrigue_scheming.1804.fake_info_desc:0 "ข่าวเพิ่งกลับมาจากกองกำลังของข้าที่กำลังล้อม [barony.GetName] ในสงครามของข้ากับ [enemy.GetTitledFirstName] พวกเขารายงานว่าข้อมูลที่เราได้รับจากผู้ให้ข้อมูลนิรนามนั้นเป็นเท็จ!\n\nพวกเขาสามารถยึด[enemy.Custom('FortifiedBuilding')]ได้ อย่างไรก็ตาม แต่หนทางข้างหน้าจะท้าทาย"
 intrigue_scheming.1804.rejected_fake_info_desc:0 "ข่าวเพิ่งกลับมาจากกองกำลังของข้าที่กำลังล้อม [barony.GetName] ในสงครามของข้ากับ [enemy.GetTitledFirstName] พวกเขารายงานว่าข้อมูลที่เราได้รับจากผู้ให้ข้อมูลนิรนามนั้นเป็นเท็จ!\n\nขอบคุณ [ROOT.Char.GetFaith.HighGodName] ที่ข้าไม่ได้เลือกที่จะดำเนินการตามเอกสารฉ้อฉลเหล่านั้น!"
 intrigue_scheming.1804.a:0 "เป็นการซื้อที่ดี หากข้าจะพูดเอง"
 intrigue_scheming.1804.b:0 "เราต้องอดทน!"
 intrigue_scheming.1804.c:0 "ข้าตัดสินใจถูกต้องแล้ว"
 intrigue_scheming.1804.custom_tt:0 "ท่านและผู้บัญชาการทุกคน"
