l_english: 

 #Lessons of the heart
 intrigue_events_bjorn.5100.t: "บทเรียนแห่งหัวใจ"
 intrigue_events_bjorn.5100.desc: "เมื่อมองดู [the_lover.GetFirstName] ยอดรักของข้า ข้าก็ฉุกคิดได้ว่ายังมีอีกหลายสิ่งที่ข้าสามารถเรียนรู้จากบุคคลที่ยอดเยี่ยมเช่นนี้ ความคิดของ[the_lover.GetHerHis|U]เปรียบดั่งขุมทรัพย์ที่รอการปล้นสะดม และข้าเองก็มีสองสามอย่างที่จะสอน [the_lover.GetFirstName] เช่นกัน\n\nไม่ต้องพูดถึงเลยว่า มันช่างเป็นวิธีใช้เวลาร่วมกันที่แสนวิเศษเพียงใด!"
 intrigue_events_bjorn.5100.a: "ความรักของข้ามีหลายสิ่งที่จะสอนข้า"
 intrigue_events_bjorn.5100.b: "[the_lover.GetSheHe|U] จะเป็นศิษย์ที่น่ารัก"
 intrigue_events_bjorn.5100.c: "แค่เราได้ใช้เวลาร่วมกันก็เพียงพอแล้วสำหรับข้า"
 
 #shared interests
 intrigue_events_bjorn.5101.t: "เป้าหมายร่วมกัน"
 intrigue_events_bjorn.5101.desc: "[the_lover.GetFirstName] ทำให้ข้าหลงใหลเหลือเกิน! ข้าปรารถนาที่จะเพลิดเพลินไปกับสิ่งที่ทำให้[the_lover.GetHerHim]มีความสุข\n\nโอ้ หากได้ใช้เวลาอันแสนสุขร่วมกัน:\n\nสองมือทำงานประสาน สองใจมุ่งสู่เป้าหมายเดียวกัน\n\nหัวใจของเราเต้นเป็นจังหวะเดียวกัน"
 intrigue_events_bjorn.5101.a: "แสดงให้ข้าเห็นสิว่าอะไรที่จุดไฟแห่งความปรารถนาของท่าน ยอดรัก"
 intrigue_events_bjorn.5101.b: "มาสิ มาร่วมแบ่งปันความสุขนี้กับข้า"
 intrigue_events_bjorn.5101.c: "ถ้าเรามาเรียนรู้สิ่งใหม่ๆ ไปด้วยกันล่ะ?"
  
 #Dark depths of the soul
 intrigue_events_bjorn.5102.t: "เพื่อรักเงามืด"
 intrigue_events_bjorn.5102.desc: "เมื่อเราใกล้ชิดกันมากขึ้น บัดนี้เรายืนอยู่ ณ เส้นแบ่ง บางทีอาจถึงเวลาที่จะต้องแบ่งปันทุกสิ่งแก่กันและกันอย่างแท้จริง เพื่อให้เรารู้ทุกสิ่งที่ควรรู้ เพื่อแบ่งปันสิ่งที่มักจะ... ไม่ถูกเปิดเผย\n\nไม่มีทางหวนกลับจากจุดนี้ แต่ [the_lover.GetFirstName] จะยอมรับทุกสิ่งที่เป็นข้าได้หรือไม่?"
 intrigue_events_bjorn.5102.a: "ข้ามีสิ่งนั้นให้ท่านดู"
 intrigue_events_bjorn.5102.b: "บอกข้าสิ ถึงสิ่งที่ท่านไม่เคยบอกใคร"
 intrigue_events_bjorn.5102.c: "มาสำรวจจินตนาการอันดำมืดที่สุดของเรากันเถิด"
 intrigue_events_bjorn.5102.d: "ไม่! บางสิ่งก็ไม่ควรให้ถูกเปิดเผย"
