 # Scaring a loved one, by Luke Bean
 intrigue_dread.2001.t:0 "แม้ แต่[loved_one.GetSheHe|U]ก็ยังกลัวข้า"
 intrigue_dread.2001.desc:0 "มือของ[loved_one.GetTitledFirstNamePossessive]สั่นเทาอยู่ใต้มือข้า ขณะที่ข้ายื่นมือไปลูบแก้มของ[loved_one.GetHerHis] [loved_one.GetSheHe]ก็ผงะถอย\n\n[loved_one.GetSheHe|U]บอกข้าถึงเรื่องแปลกๆ ที่ผู้คนพูดถึงข้า เรื่องน่าสะพรึงกลัว [loved_one.GetSheHe|U]สงสัยว่าเรื่องใดเป็นความจริง"
 intrigue_dread.2001.a:0 "พวกเขาไม่รู้แม้ แต่ #EMP ครึ่งหนึ่ง#! ของสิ่งที่ข้าทำลงไป"
 intrigue_dread.2001.a.tt:1 "เข้ามาใกล้ๆ #EMP ใกล้เข้ามาอีก#! ข้าจะกระซิบที่หูเจ้า"
 intrigue_dread.2001.b:0 "ทุกสิ่งที่ข้าทำก็เพื่อปกป้องเจ้า!"
 intrigue_dread.2001.c:0 "ใครกันแน่ที่พูดเรื่องเหล่านี้? ข้าต้องการชื่อ"
 intrigue_dread.2001.d:0 "เพียงยิ้มและเดินจากไป"
 intrigue_dread.2001.b.into_it:0 "[loved_one.GetFirstName] ซาบซึ้งในความทุ่มเทของท่าน"
 intrigue_dread.2001.b.reassured:0 "[loved_one.GetFirstName] มั่นใจว่า[loved_one.GetSheHe]ปลอดภัย"
 intrigue_dread.2001.b.terrified:0 "คำสารภาพของท่าน ทำให้ [loved_one.GetFirstName] หวาดกลัว"
 tooltip.intrigue_dread.2001.c.duel_success:1 "ทหารยามของท่านรวบตัวพวกขี้นินทา"
 tooltip.intrigue_dread.2001.c.duel_failure:1 "[loved_one.GetFirstName] ท้าทายท่านอย่างเปิดเผย"
 intrigue_protected_by_loved_one_modifier:1 "ได้รับการปกป้องโดยผู้เป็นที่รัก"
 intrigue_protected_by_loved_one_modifier_desc:0 "บุคคลนี้มีผู้เป็นที่รัก ซึ่งจะทำ #EMP ทุกอย่าง#! เพื่อปกป้องพวกเขา"
 intrigue_defied_loved_one_opinion:1 "ท้าทายบุคคลอันเป็นที่รัก"

 # Rumors about a relative, by Luke Bean
 intrigue_dread.2101.t:0 "ข่าวลือเกี่ยวกับ [family_member.GetFirstNameNoTooltip]"
 intrigue_dread.2101.desc.intro:0 ""ข่าวลือเสื่อมเสียเกี่ยวกับ [family_member.GetTitledFirstName] [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('family_member'))]ของท่าน... ข้าได้สืบสาวจนพบต้นตอแล้ว" [spymaster.Custom2('MyCharacterIntroduction', ROOT.Char)|U] ตบห่อจดหมายเบาๆ\n\nจดหมายเหล่านี้เป็นหลักฐานชั้นดีว่า [hater.GetName] พยายามทำให้ชื่อเสียงของ [family_member.GetFirstNamePossessive] แปดเปื้อนมาตลอด"
 intrigue_dread.2101.desc.failed_assassination:0 "[hater.GetSheHe|U]ถึงกับกล่าวหาว่า [family_member.GetFirstName] พยายามจะสังหาร[hater.GetHerHim]!"
 intrigue_dread.2101.desc.committed_adultery:0 "[hater.GetSheHe|U]อ้างว่า [family_member.GetFirstName] เป็น[family_member.GetWifeHusband]ที่ไม่ซื่อสัตย์ และเล่าเรื่องราวอันน่าสยดสยองของ[family_member.GetHerHis]!"
 intrigue_dread.2101.desc.bullied_me:0 "[hater.GetSheHe|U]อ้างว่า [family_member.GetFirstName] มีเมล็ดพันธุ์แห่งความชั่วร้ายอยู่ในตัว[family_member.GetHerHim]ตั้งแต่เด็ก เมื่อ[family_member.GetSheHe]รังแก [hater.GetNameNoTooltip] อย่างโหดร้าย"
 intrigue_dread.2101.desc.bad_friend:0 "[hater.GetSheHe|U]อ้างว่า [family_member.GetFirstName] เป็นเพื่อนที่ไม่ดี และมัน ทำให้[hater.GetHerHim]เจ็บปวดอย่างยิ่งเมื่อ [family_member.GetFirstName] ละทิ้งมิตรภาพของพวกเขา"
 intrigue_dread.2101.desc.sinner:0 "[hater.GetSheHe|U] เยาะเย้ยอุปนิสัยของ [family_member.GetFirstNamePossessive] กล่าวหา [family_member.GetHerHim] ว่ามี [ROOT.GetCharacter.Custom('GetSinMisdeedPlural')] อันน่าตกตะลึง"
 intrigue_dread.2101.desc.outro:0 "\n\nผู้คนคิดจริงๆ หรือว่าพวกเขาสามารถพูดถึง[ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('family_member'))]ของข้า เช่นนี้ได้?"
 intrigue_dread.2101.a:0 "ปล่อยข่าวลือที่ดำมืดยิ่งกว่าเกี่ยวกับ [family_member.GetFirstNameNoTooltip] เพื่อให้ทุกคนยำเกรงเรา"
 intrigue_dread.2101.a.tt.success:0 "ผู้คนเชื่อว่า [family_member.GetFirstName] สามารถทำอะไรก็ได้"
 tooltip.intrigue_dread.2101.a.duel_success:0 "พวกเขาเชื่อ และตัวสั่น"
 intrigue_dread.2101.a.tt.failure:0 "ไม่มีใครเชื่อเรื่องเหลวไหลของท่าน"
 tooltip.intrigue_dread.2101.a.duel_failure:0 "ผู้คนเยาะเย้ยเรื่องราวที่เกินจริงของท่าน"
 intrigue_dread.2101.b:0 "เสนอเหรียญให้ [hater.GetTitledFirstNameNoTooltip] บ้างเพื่อปิดปาก [hater.GetHerHis]"
 intrigue_dread.2101.b.tt.success:0 "[hater.GetTitledFirstName] จะเงียบปาก"
 tooltip.intrigue_dread.2101.b.duel_success:0 "[hater.GetTitledFirstName] เงียบ ทุกคนมีความสุข"
 intrigue_dread.2101.b.tt.failure:0 "[hater.GetTitledFirstName] จะยังคงนินทาต่อไป"
 tooltip.intrigue_dread.2101.b.duel_failure:0 "[hater.GetTitledFirstName] รับเงินของท่านและยังคงพูดพล่ามต่อไป"
 intrigue_everyone_is_satisfied_tt:0 "[hater.GetTitledFirstName] และ [family_member.GetFirstName] ต่างพอใจกับการแก้ไขปัญหานี้"
 intrigue_dread.2101.c:0 "แอบหาอันธพาลไปซ้อม [hater.GetTitledFirstNameNoTooltip]"
 intrigue_dread.2101.c.tt.success:0 "จะไม่มีใครกล้าพูดร้ายเกี่ยวกับครอบครัวของท่าน"
 tooltip.intrigue_dread.2101.c.duel_success:0 "[hater.GetTitledFirstName] กำลังฟื้นตัวจากอุบัติเหตุอันเจ็บปวด"
 intrigue_suspect_you_in_attack_success_tt:0 "ไม่มีใครสามารถพิสูจน์การมีส่วนร่วมของท่านได้ แต่พวกเขาสงสัยมากพอที่จะกลัวท่าน"
 intrigue_dread.2101.c.tt.failure:0 "ความสัมพันธ์ของท่านกับอาชญากรทั่วไปกลายเป็นที่รู้จัก"
 tooltip.intrigue_dread.2101.c.duel_failure:0 "[hater.GetTitledFirstName] สงสัยว่าท่านอยู่เบื้องหลังการโจมตีที่ล้มเหลว"
 intrigue_dread.2101.d:0 "ตีตัวออกห่างจาก [family_member.GetFirstNameNoTooltip]"
 intrigue_everyone_heard_rumours_tt:0 "ทุกคนในราชสำนักของท่านได้ยินข่าวลือที่น่าอับอายเกี่ยวกับ [family_member.GetNameNoTooltip]"
 intrigue_everyone_heard_horrifying_rumours_tt:0 "ทุกคนในราชสำนักของท่านได้ยินข่าวลือที่น่าสะพรึงกลัวเกี่ยวกับ [family_member.GetNameNoTooltip]"
 intrigue_bumbling_tyrant_modifier:0 "ทรราชย์ผู้เงอะงะ"
 intrigue_blanket_of_fear_modifier:0 "ผ้าห่มแห่งความกลัว"
 intrigue_controlling_the_narrative_modifier:0 "ควบคุมเรื่องเล่า"
 intrigue_thrown_under_the_carriage_opinion:0 "ตีตัวออกห่างจากข้า"
