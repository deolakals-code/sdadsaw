 # Your court thinks you're soft, by Luke Bean
 intrigue_dread.2301.t:0 "แสดงให้พวกเขาเห็นว่าท่านเป็นใคร"
 intrigue_dread.2301.desc.a:0 ""เราโชคดีเพียงใดที่มี[ROOT.Char.Custom('GetCourtOwner')]ผู้อ่อนโยน ใจอ่อน และบริสุทธิ์ เช่นนี้!" ใบหน้ายิ้มเยาะของ[smirking_courtier.GetNamePossessive]ลอยอยู่ตรงหน้าข้า "เราได้รับพรที่ได้อยู่ใน[ROOT.Char.Custom('GetCourt')]ที่เราสามารถปราศจากความกลัวได้!""
 intrigue_dread.2301.desc.b:0 ""เราโชคดีเพียงใดที่มี[ROOT.Char.Custom('GetCourtOwner')]ผู้จริงใจและซื่อสัตย์ ไม่สามารถหลอกลวงได้ เช่นนี้!" ใบหน้ายิ้มเยาะของ[smirking_courtier.GetNamePossessive]ลอยอยู่ตรงหน้าข้า "เราได้รับพรที่ได้อยู่ใน[ROOT.Char.Custom('GetCourt')]ที่เราสามารถปราศจากความกลัวได้!""
 intrigue_dread.2301.desc.c:0 ""เราโชคดีเพียงใดที่มี[ROOT.Char.Custom('GetCourtOwner')]ผู้เรียบง่ายและถ่อมตน ไม่เรียกร้องสิ่งใดจากเรา เช่นนี้!" ใบหน้ายิ้มเยาะของ[smirking_courtier.GetNamePossessive]ลอยอยู่ตรงหน้าข้า "เราได้รับพรที่ได้อยู่ใน[ROOT.Char.Custom('GetCourt')]ที่เราสามารถปราศจากความกลัวได้!""
 intrigue_dread.2301.desc.d:0 ""เราโชคดีเพียงใดที่มี[ROOT.Char.Custom('GetCourtOwner')]ผู้ชอบธรรม เช่นนี้ ผู้เคารพกฎหมายอย่างแท้จริง!" ใบหน้ายิ้มเยาะของ[smirking_courtier.GetNamePossessive]ลอยอยู่ตรงหน้าข้า "เราได้รับพรที่ได้อยู่ใน[ROOT.Char.Custom('GetCourt')]ที่เราสามารถปราศจากความกลัวได้!""
 intrigue_dread.2301.desc.e:0 ""เราโชคดีเพียงใดที่มี[ROOT.Char.Custom('GetCourtOwner')]ผู้ห่วงใยเรา ผู้ที่จะไม่ปฏิบัติต่อไพร่ฟ้าของ[ROOT.Char.GetHerHis]อย่างไม่เป็นธรรม!" ใบหน้ายิ้มเยาะของ[smirking_courtier.GetNamePossessive]ลอยอยู่ตรงหน้าข้า "เราได้รับพรที่ได้อยู่ใน[ROOT.Char.Custom('GetCourt')]ที่เราสามารถปราศจากความกลัวได้!""
 intrigue_dread.2301.desc.outro:0 "\n\nเบื้องหลัง [smirking_courtier.GetFirstNameNoTooltip] [ROOT.Char.Custom('GetCourt')]ของข้าหัวเราะและโห่ร้อง ผู้คนเหล่านี้ไม่กลัวข้า พวกเขาไม่เคารพข้า พวกเขาไม่รู้จักข้า ข้าจะแสดงให้พวกเขาเห็นว่าข้าเป็นใคร"
 intrigue_dread.2301.a:0 "แทง [smirking_courtier.GetFirstNameNoTooltip] ที่ลำคอ"
 intrigue_dread.2301.b:0 "สั่งลากตัว [smirking_courtier.GetFirstNameNoTooltip] ไปยัง [ROOT.Char.Custom('GetDungeon')]"
 intrigue_dread.2301.c:0 "ยิ้ม หัวเราะ และวางแผนแก้แค้นของท่าน"
 intrigue_dread.2301.d:0 "[smirking_courtier.GetFirstNameNoTooltip] จะตายในคืนนี้ ปล่อยให้พวกเขาคาดเดากันไปว่า เพราะเหตุใด"
 intrigue_show_them_all_modifier:0 "วางแผนที่จะแสดงให้พวกเขาทั้งหมดเห็น"

 # Executions could be better, by Luke Bean
 intrigue_dread.2401.t:0 "การประหารชีวิตน่าจะดีกว่านี้ได้"
 intrigue_dread.2401.desc:0 "โจรที่ถูกตัดสินประหารชีวิตกระตุกที่ปลายเชือก แล้วก็นิ่งไป ฝูงชนสามัญชนพึมพำเห็นด้วยและเริ่มสลายตัวไป\n\nแต่เสียงโห่ร้อง เสียงคร่ำครวญ ความหวาดกลัวอยู่ที่ไหน? ข้าสามารถปรับปรุงการประหารชีวิตในที่สาธารณะใน [execution_county.GetName] ได้ด้วยการเปลี่ยนแปลงง่ายๆ เพียงอย่างเดียว..."
 intrigue_dread.2401.a:0 "มากขึ้น. อีก. เยอะๆ."
 intrigue_dread.2401.a.tt.success:0 "อาชญากรถูกกวาดล้างทั่ว [execution_county.GetNameNoTier]"
 tooltip.intrigue_dread.2401.a.duel_success:0 "$intrigue_dread.2401.a.tt.success$"
 intrigue_dread.2401.a.tt.failure:0 "การประหารชีวิตที่ไม่ยุติธรรม ทำให้ [execution_county.GetNameNoTier] โกรธแค้น"
 tooltip.intrigue_dread.2401.a.duel_failure:0 "$intrigue_dread.2401.a.tt.failure$"
 intrigue_dread.2401.b:0 "การเข้าร่วมการประหารชีวิตเป็นภาคบังคับ!"
 intrigue_dread.2401.b.tt.success:0 "ผู้คนใน [execution_county.GetNameNoTier] ตัวสั่นต่อหน้าความยุติธรรม"
 tooltip.intrigue_dread.2401.b.duel_success:0 "$intrigue_dread.2401.b.tt.success$"
 intrigue_dread.2401.b.tt.failure:0 "ผู้คนใน [execution_county.GetNameNoTier] เสียเวลาจ้องมองการประหารชีวิต"
