 intrigue_dread.2401.c:0 "การประหารชีวิตควรจะช้า และ #EMP สร้างสรรค์#!..."
 intrigue_dread.2401.d:0 "สามัญชนไม่ควรเสียเวลาไปกับการประหารชีวิต"

