 # Councillor is too scared to speak their mind, by Luke Bean
 intrigue_dread.2201.t:0 "กลัวเกินกว่าจะพูดความคิดของ[yesman.GetHerHis|U]"
 intrigue_dread.2201.desc:0 ""เป็นการตัดสินใจที่ชาญฉลาดอะไร เช่นนี้ ฝ่าบาท!" [yesman.Custom2('MyCharacterIntroduction', ROOT.Char)] ยิ้มอย่างประหม่าและผงกศีรษะ[yesman.GetHerHis]ให้ข้าเหมือนนกพิราบ "แท้จริงแล้ว ข้าไม่มีอะไรจะเสริม!"\n\n[yesman.GetNameNoTooltip] กลัวข้ามากเกินไปที่จะขัดแย้งกับการตัดสินใจของข้า มัน ทำให้[yesman.GetHerHim]ค่อนข้างไร้ประโยชน์ในฐานะ[yesman.GetCouncilTitle]"
 intrigue_dread.2201.a:0 "สมบูรณ์แบบ สภาของข้า #EMP ควร#! เกรงกลัวข้า"
 intrigue_dread.2201.b:0 "ข้าจะทำงานของเจ้าเอง เจ้าโง่!"
 intrigue_dread.2201.c:0 "จงพูดความคิดของเจ้าอย่างอิสระ ตำแหน่งของเจ้าปลอดภัย"
 intrigue_guaranteed_position_block_firing_councillor_effect_tt:0 "[yesman.GetShortUIName|U] ไม่สามารถถูกถอดถอนออกจาก[council|E]ได้เป็นเวลา 5 ปี"
 intrigue_dread.2201.c.tt.success:0 "[yesman.GetFirstNameNoTooltip] เชื่อใจท่านมากพอที่จะพูดอย่างอิสระ"
