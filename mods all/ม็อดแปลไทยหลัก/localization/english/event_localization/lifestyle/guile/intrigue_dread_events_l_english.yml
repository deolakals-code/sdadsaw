l_english: 
# Join a touring theater company
 intrigue_dread_special.1101.t:0 "สวมบทบาท"
 intrigue_dread_special.1101.desc:0 "ม้าสองตัวแรก สวมบังเหียนและขนนกหรูหรา จากนั้นจึงเป็นเกวียนที่บรรทุกหีบสมบัติและผู้คน\n\nไม่นานนัก ขบวนของข้าและตัวข้าก็ถูกขัดขวางโดยคณะละครเร่ คณะหนึ่ง ผู้คนล้วน แต่งกายสีสันสดใสและเปี่ยมชีวิตชีวา\n\n"[ROOT.Char.Custom('FormOfAddressForLiege')|U]!" [ROOT.Char.Custom('RandomWomanMan')] สูงวัยผู้หนึ่งตะโกนมาจากเกวียนที่แล่นผ่าน "ข้าเห็นแววตาอันโหยหาของท่าน ไฉนท่านไม่มาร่วมชมการแสดงกับพวกเราเล่า""
 intrigue_dread_special.1101.a.a:0 "ข้าจะเล่นบทคนงานในนาผู้ละโมบ!"
 intrigue_dread_special.1101.a.b:0 "ข้าจะเล่นบท[ROOT.Char.GetWifeHusband]ชรา!"
 intrigue_dread_special.1101.a.c:0 "ข้าจะเล่นบทคนรับใช้เจ้าเล่ห์!"
 intrigue_dread_special.1101.a.d:0 "ข้าจะเล่นบทชู้รักหนุ่มสาว!"
 intrigue_dread_special.1101.a.e:0 "ข้าจะเล่นบทตัวตลกผู้เศร้าสร้อย!"
 intrigue_dread_special.1101.b:0 "จงเก็บที่นั่งแถวหน้าไว้ให้ข้าด้วย"
 intrigue_dread_special.1101.c:0 "นี่มันต่ำกว่าเกียรติของข้า"

 intrigue_dread_special.1102.desc:0 "ขั้นตอนแรกของการแสดงใดๆ ไม่ว่าจะจัดขึ้นใน[ROOT.Char.Custom('FortifiedBuilding')]ของข้าหรือบนเวที คือการเตรียมตัว\n\nท่ามกลางความวุ่นวายของคณะละครและกลายเป็นนิรนามในเสื้อผ้าที่ยืมมา ข้าพบว่าตนเองมีเวลาว่างก่อนการแสดงจะเริ่มขึ้น"
 intrigue_dread_special.1102.a:0 "ไม่ ย้ายฉากประกอบนั้นไปตรงนั้น!"
 intrigue_dread_special.1102.a.duel_success:1 "ท่านใช้ทักษะการจัดการของท่านให้เป็นประโยชน์"
 tooltip.intrigue_dread_special.1102.a.duel_success:1 "ท่านจัดฉากได้อย่างน่าอัศจรรย์"
 intrigue_dread_special.1102.a.duel_failure:1 "คำสั่งของท่าน ทำให้นักแสดงสับสน"
 tooltip.intrigue_dread_special.1102.a.duel_failure:0 "ฉากประกอบอยู่ในสภาพไม่เป็นระเบียบ"

 intrigue_dread_special.1102.b:0 "มาทบทวนบทกันเถอะ!"
 intrigue_dread_special.1102.b.duel_success:1 "ท่านทำความคุ้นเคยกับนักแสดง"
 tooltip.intrigue_dread_special.1102.b.duel_success:1 "นักแสดงชื่นชมความช่วยเหลือของท่าน"
 intrigue_dread_special.1102.b.duel_failure:1 "คำสั่งของท่าน ทำให้นักแสดงสับสน"
 tooltip.intrigue_dread_special.1102.b.duel_failure:1 "ดูเหมือนนักแสดงจะไม่ไว้วางใจท่าน"

 intrigue_dread_special.1102.c:0 "ข้าจะอ่านบท #EMP อีกครั้ง#! หนึ่ง"
 intrigue_dread_special.1102.c.flavor:1 "เป็นทางเลือกที่ปลอดภัย แต่ความเสี่ยงต่ำย่อมให้ผลตอบแทนน้อย"

 intrigue_dread_special.1103.desc:0 "ขณะที่ข้าก้าวออกไปบนเวทีพร้อมกับนักแสดงคนอื่นๆ ความสนใจของผู้ชมแน่วแน่ไม่เปลี่ยนแปลง\n\nเมื่อฉากหนึ่งตามมาด้วยอีกฉาก ข้าสัมผัสได้ถึงจังหวะของเรื่องราวที่กำลังถูกเล่าขาน มันเต้นเร้าอยู่ในตัวข้า เมื่อถึงเวลาที่ข้าต้องพูดบทแรก ราวกับว่าผู้ชมทั้งมวลกำลังกลั้นหายใจ"
 intrigue_dread_special.1103.a:0 "สาธารณชนต้อง #EMP รู้สึก#! ถึงมัน!"
 intrigue_dread_special.1103.a.duel_success:0 "ข้าตีความตัวละครของข้าได้อย่างไร้ที่ติ"
 tooltip.intrigue_dread_special.1103.a.duel_success:0 "สาธารณชนประทับใจในการแสดงของข้า"
 intrigue_dread_special.1103.a.duel_failure:0 "ข้าล้มเหลวในการเข้าถึงบทบาท"
 tooltip.intrigue_dread_special.1103.a.duel_failure:0 "สาธารณชนไม่ประทับใจ"
 intrigue_dread_special.1103.b:0 "ข้าจะมุ่งเน้นไปที่การอ่านทุกบรรทัดอย่างไม่มีที่ติ"
 intrigue_dread_special.1103.b.duel_success:0 "สาธารณชนประทับใจในการออกเสียงของข้า"
 intrigue_dread_special.1103.b.duel_failure:0 "ข้าพูดติดอ่างตลอดการแสดง"
 intrigue_dread_special.1103.c:0 "ยึดตามบทและอยู่ในฉากหลัง"

 intrigue_dread_special.1199.desc_win_feeling:0 "มันเป็นบทสั้นๆ แต่ข้า ทำให้มันมีความหมาย ผู้ชมจดจ่ออยู่กับทุกคำพูดของข้า เคลิบเคลิ้มไปกับเรื่องราวที่ข้าปั่น แต่งให้พวกเขาฟัง"
 intrigue_dread_special.1199.desc_loose_feeling:0 "มันเป็นบทสั้นๆ แต่ไม่รู้ทำไมข้ากลับแสดงผิดพลาดไปเสียหมด ข้าเก่งในการโน้มน้าวผู้คนในราชสำนักเสมอมา แต่การต้องเผชิญหน้ากับผู้คนมากมาย... มันเป็นประสบการณ์ใหม่โดยสิ้นเชิง"
 intrigue_dread_special.1199.desc_win_reading:0 "ข้าพูดบทได้อย่างไม่มีที่ติ จับช่วงเวลาและดึงดูดความสนใจทั้งหมดของผู้ชม"
 intrigue_dread_special.1199.desc_loose_reading:0 "ขณะที่เสียงหัวเราะของผู้ชมเงียบลง ข้าพยายามแก้ไขความผิดพลาดของตน การพูดสิ่งที่ถูกต้องในเวลาที่เหมาะสมมักเป็นสิ่งที่ข้าทำได้ดี แต่การทำ เช่นนั้นบนเวทีกลับพิสูจน์ว่ายากกว่าที่ข้าจินตนาการไว้"
 intrigue_dread_special.1199.desc_fallback:0 "ข้ายึดตามบท และฉากดำเนินไปอย่างราบรื่น แต่ไม่โดดเด่น"
 intrigue_dread_special.1199.desc_win:0 "\n\nเราตามลงจากเวทีด้วยเสียงปรบมือดังกึกก้องหลังจากฉากสุดท้าย การหลอกลวงผู้ชมทั้งมวลได้อย่างหมดจด การรักษาการปลอมตัวและการหลอกลวงของข้า และการสามารถหลอกลวงผู้คนมากมายในคราวเดียว... มันเป็นความรู้สึกที่ทรงพลัง!"
 intrigue_dread_special.1199.desc_loose:0 "\n\nขณะที่เราจบฉากสุดท้าย ผลัดกันโค้งคำนับผู้ชม ความเงียบก็บ่งบอกด้วยตัวมันเองเมื่อถึงตาข้า แม้ข้าจะพยายามแล้ว ข้าก็ไม่สามารถ ทำให้ผู้ชมเชื่อในการเสกสรรปั้น แต่งของข้าได้ และความผิดหวังก็เป็นยาขมที่ต้องกลืนกิน"
 intrigue_dread_special.1199.z:0 "และข้าปรารถนาที่จะรู้สึก เช่นนั้นอีกครั้ง! และอีกครั้ง!"
 intrigue_dread_special.1199.a:0 "ออกทางซ้ายของเวที"
 intrigue_dread_special.1199.b:0 "แต่คราวหน้า คอยดูเถอะ!"
 intrigue_dread_special.1199.c.a:0 "พวกเจ้า #EMP ต้อง#! โห่ร้อง! ทหาร!"
 intrigue_dread_special.1199.c.b:0 "นี่ต้องเป็นแผนการที่จะ ทำให้ข้าอับอายแน่! ทหาร!"

 intrigue_dread_special.1197.t:0 "การแสดงอันน่าสะพรึงกลัว"
 intrigue_dread_special.1197.desc:0 "ข้ายอมรับว่าการแสดงครั้งแรกของข้าอาจจะขาดๆ เกินๆ ไปบ้าง... การจับคณะละครทั้งคณะใส่ขื่อคาได้รับการตอบรับที่ดีกว่ามากจากชาวนา อืม บางทีอาจจะไม่ใช่ #EMP ดี#! เสียทีเดียว แต่ก็น่าพอใจอย่างแน่นอน"
 intrigue_dread_special.1197.a:0 "อย่างน้อยข้าก็สนุก"

 intrigue_dread_special.1198.desc:0 "เราทำการแสดงซ้ำแล้วซ้ำเล่า ขณะที่สาธารณชน ภายใต้สายตาอันจับจ้องของทหารยามของข้า ยังคงโห่ร้องทุกครั้ง \n\nหลังจากการทดลองครั้งใหม่ แต่ละครั้ง การแสดงของข้าก็ประณีตยิ่งขึ้น ในขณะที่ศิลปินคนอื่นๆ กลับสะเพร่าลง ถูกฉุดรั้งด้วยความกลัวและความคับข้องใจ จนกระทั่งพวกเขาเริ่มล้มลงทีละคนจากความเหนื่อยล้า ทิ้งให้ข้าอยู่ตามลำพังและได้รับชัยชนะบนเวที"
 intrigue_dread_special.1198.a:0 "เป็นประสบการณ์อันสูงส่งอย่างแท้จริง มิใช่หรือ?"

# Retinue members are concerned, by Linnéa Thimrén
 intrigue_dread_special.1301.t:0 "[ROOT.Char.Custom('GetCourtierPlural')|U]ผู้กังวล"
 intrigue_dread_special.1301.desc:0 ""...และอีกนานเท่าใดกว่า[ROOT.Char.GetSheHe]จะวางแผนต่อต้าน #EMP พวกเรา#!? การวางแผนนี้กำลังจะเกินควบคุม" [courtier_first.GetTitledFirstName] และ [courtier_second.GetTitledFirstName] กำลังยืนศีรษะชิดกัน และพวกเขาสะดุ้งเมื่อข้าเลี้ยวหัวมุมมา\n\n"ท่าน[ROOT.Char.GetTitleTierName]ของข้า! เราเพียงแค่กำลังพูดถึง... กิจกรรมสันทนาการของท่าน ดูเหมือนว่ามันจะกินเวลาของท่านไปมาก""
 intrigue_dread_special.1301.a:0 "ข้าได้ยินพวกเจ้าสมคบคิดต่อต้านข้า! ทหาร!"
 intrigue_dread_special.1301.b:0 "ไม่มีสิ่งใดที่[ROOT.Char.Custom('GetServants')] #EMP ผู้ภักดี#! คนใดควรต้องกังวล..."
 intrigue_dread_special.1301.c:0 "ข้ารับรองกับพวกเจ้า ไม่มีสิ่งใดต้องกังวล"
 intrigue_dread_special.1301.c.duel_success:0 "ข้าปลอบโยน[ROOT.Char.Custom('GetCourtierPlural')|U]ได้สำเร็จ"
 tooltip.intrigue_dread_special.1301.c.duel_success:0 "คำวิงวอนของข้าน่าเชื่อถือ"
 intrigue_dread_special.1301.c.duel_failure:0 "ไพร่ฟ้าของข้าไม่สบายใจ"
 tooltip.intrigue_dread_special.1301.c.duel_failure:0 "ข้าไม่น่าเชื่อถือเพียงพอ"
 intrigue_dread_special.1301.d:0 "อย่าสอดรู้สอดเห็นเรื่องของข้า!"

# Cannibal cook, by Linnéa Thimrén
 intrigue_dread.1501.t:0 "อาหารมื้อเย็น"
 intrigue_dread.1501.desc:0 ""สตูว์เป็นอย่างไรบ้าง [ROOT.Char.Custom('FormOfAddressForLiege')]?"\n\nที่ปนอยู่กับชิ้นผักคือชิ้นเนื้อติดมัน เนื้อสัมผัสเป็นเส้นๆ ถูกขัดด้วยสิ่งที่ดูเหมือนขนสั้นและบางตา เมื่อถามถึงส่วนผสม พ่อครัวส่วนตัวของข้า [cannibal_cook.GetTitledFirstName] เพียงแค่ยิ้มและพยายามปลอบข้า\n\n"ความปรารถนาเดียวของข้าคือการรับใช้ #EMP ท่าน#! [ROOT.Char.Custom('FormOfAddressForLiege')].""
 intrigue_dread.1501.a:0 "ส่วนประกอบที่แท้จริงของอาหารข้าไม่สำคัญ"
 intrigue_dread.1501.b:0 "[cannibal_cook.GetSheHe|U]คิดว่า[cannibal_cook.GetSheHe]สามารถเก็บความลับจาก #EMP ข้า#! ได้รึ?"
 intrigue_dread.1501.b.flavor:1 "การไม่รู้อาจเป็นสุข แต่ข้า #EMP จำเป็น#! ต้องรู้"
 intrigue_dread.1501.b.tt1:0 "ข้าสามารถแอบและหลอกล่อเข้าไปในครัวได้สำเร็จ"
 intrigue_dread.1501.b.tt2:0 "[cannibal_cook.GetSheHe|U]สามารถเก็บสูตรอาหารเป็นความลับได้สำเร็จ"
 intrigue_dread.1501.c:0 "โรสแมรี่กับเนื้อมนุษย์รึ? เป็นทางเลือกที่ยอดเยี่ยม!"

 intrigue_dread.1502.desc:0 "เมื่อข้าเข้าไปในครัว มันทั้งมืดและว่างเปล่า อากาศหนักอึ้งไปด้วยควัน ที่มุมหนึ่งข้าพบตำราอาหารของ [cannibal_cook.GetTitledFirstNamePossessive] เปรอะเปื้อนไปด้วยคราบ\n\n#EMP เมื่อปรุงตับ เป็นที่สังเกตว่าการบริโภค [ROOT.Char.Custom('RegionalDrink')] มากเกินไป สามารถลดคุณภาพของอวัยวะได้อย่างมาก-#!\nความรู้สึกเย็นเยียบแล่นเข้าสู่ทรวงอกขณะที่ข้าพลิกไปยังหน้าอื่น\n#EMP ...อย่างไรก็ตาม เมื่อปรุงอาหารเด็กเล็กที่อายุต่ำกว่า-#!"
 intrigue_dread.1502.a:0 "นำหัวของ[cannibal_cook.GetHerHis]มาให้ข้า!"
 intrigue_dread.1502.a.flavor:0 "แต่ไม่ใช่บนถาดนะ"
 intrigue_dread.1502.b:0 "โยน[cannibal_cook.GetHerHim]ลงไปใน[ROOT.Char.Custom('GetDungeon')]!"
 intrigue_dread.1502.c:0 "แต่มันอร่อยมาก..."

 intrigue_dread.1503.desc:0 "แม้ข้าจะพยายามอย่างสุดความสามารถ ข้าก็ไม่สามารถเข้าถึงห้องครัวได้ในลักษณะที่ไม่ ทำให้[cannibal_cook.GetTitledFirstNamePossessive]สงสัย"
 intrigue_dread.1503.a:0 "ปริศนานี้จะกัดกินใจข้า..."

# Poison tasting, by Petter Vilberg
 intrigue_dread.1801.t:0 "การทดลอง"
 intrigue_dread.1801.mentor_desc:0 ""และอีกเพียงเล็กน้อยของตัวนี้ก็จะ ทำให้[test_subject.GetHerHim]สลบไปโดยสิ้นเชิง" [intrigue_mentor.GetFirstName] บอกข้า "อาสาสมัคร" ของเรา [test_subject.GetTitledFirstName] แทบจะหมดสติไปแล้ว\n\n[intrigue_mentor.GetFirstName] เริ่มเก็บขวด "น่าเสียดาย ข้าเชื่อว่านี่อาจจะเป็นทั้งหมดที่ผู้รับการทดลองของเราสามารถรับได้ในคืนนี้""
 intrigue_dread.1801.desc:0 "ข้าขอบคุณ [test_subject.GetTitledFirstName] อย่างจริงใจ ขณะที่[test_subject.GetSheHe]จ้องมองข้าอย่างโกรธเคืองผ่านม่านหมอกแห่งการเล่นแร่แปรธาตุ มันไม่ใช่เรื่องง่ายที่จะหาใครสักคนมา "อาสาสมัคร" เพื่อทดสอบชุดสะสม... สารต่างๆ ของข้า สำหรับ[test_subject.GetHerHim]แล้ว มันเป็นค่ำคืนแห่งความเจ็บปวด ความรู้สึกแสบร้อน และการหมดสติเป็นครั้งคราว"
 intrigue_dread.1801.a:0 "นี่เป็นการให้ความรู้ความเข้าใจอย่างยิ่ง"
 intrigue_dread.1801.b:0 "เรายังไม่เสร็จสิ้นเสียทีเดียว"
 intrigue_dread.1801.c:0 "ขอให้เราอย่าทำสิ่ง เช่นนี้อีกเลย"

# Torturing Courtier
 intrigue_dread.1901.t:0 "ตัวตลกผู้ [disliked_courtier.Custom2('InsultAdjective', ROOT.Char)|U]"
 intrigue_dread.1901.desc:0 "วันแล้ววันเล่า ข้าต้องทนกับการมีอยู่ของ [disliked_courtier.Custom2('MyCharacterIntroduction', ROOT.Char)]\n\nเมื่อใดก็ตามที่ข้าพูดกับ[disliked_courtier.GetHerHim] [disliked_courtier.GetSheHe] [disliked_courtier.Custom('quirk_neg_present')] [disliked_courtier.GetSheHe]กำลัง #EMP พยายาม#! ดูหมิ่นข้าอยู่รึ? ข้าจะไม่ยอมรับการไม่เคารพจาก[disliked_courtier.Custom('InsultNoun')]อีกต่อไป ใครสักคนต้องสั่งสอน[disliked_courtier.GetHerHim]!"
 intrigue_dread.1901.a:0 "ข้ามีพิษนี้ที่ข้าอยากจะลองใช้มานานแล้ว..."
 intrigue_dread.1901.b:0 "คงจะน่าเสียดายหาก[disliked_courtier.GetSheHe] ทำให้[disliked_courtier.GetHerselfHimself]กลายเป็นตัวตลกในราชสำนัก"
 intrigue_dread.1901.b.tt:0 "ตัวเลือกนี้มีให้ เนื่องจากลักษณะนิสัย[GetTrait('gregarious').GetName( GetPlayer )]ของ[disliked_courtier.GetFirstNamePossessiveNoTooltip]"
 intrigue_dread.1901.c:1 "กระเป๋าเงินที่เบาลงสำหรับ[disliked_courtier.GetHerHim]นำไปสู่อารมณ์ที่เบาลงสำหรับข้า!"
 intrigue_dread.1901.c.tt:0 "ตัวเลือกนี้มีให้ เนื่องจากลักษณะนิสัย[GetTrait('greedy').GetName( GetPlayer )]ของ[disliked_courtier.GetFirstNamePossessiveNoTooltip]"
 intrigue_dread.1901.d:0 ""ท่านได้ยินหรือไม่? [disliked_courtier.GetSheHe|U]จืดชืดเหมือนแป้งบนเตียง""
 intrigue_dread.1901.d.tt:0 "ตัวเลือกนี้มีให้ เนื่องจากลักษณะนิสัย[GetTrait('lustful').GetName( GetPlayer )]ของ[disliked_courtier.GetFirstNamePossessiveNoTooltip]"
 
# Mind Break, by Sean Hughes
 intrigue_dread.4001.t:0 "ความทุกข์ทรมานอันวิจิตร"
 intrigue_dread.4001.desc.start:0 "ข้าไม่พอใจกับการทรมานตามปกติที่ข้าเป็นที่รู้จักในการกระทำต่อนักโทษของข้าอีกต่อไป ข้าปรารถนาที่จะสร้างผลงานชิ้นเอก — งานศิลปะที่ประดิษฐานความเจ็บปวดและความทุกข์ทรมาน ก้าวข้ามทุกสิ่งที่ข้าเคยทำมาก่อน!"
 intrigue_dread.4001.desc.single:0 "\n\nอย่างไรก็ตาม ข้าอดสงสัยไม่ได้ว่า [prisoner_1.GetTitledFirstName] เป็นผืนผ้าใบที่เหมาะสมสำหรับงานอันยิ่งใหญ่ของข้าหรือไม่?"
 intrigue_dread.4001.desc.multiple:0 "\n\nคำถามคือ ใครจะเป็นผืนผ้าใบของข้า?"
 intrigue_dread.4001.a.single:0 "ใช่ [prisoner_1.GetSheHe]จะเหมาะอย่างยิ่ง..."
 intrigue_dread.4001.a:0 "[prisoner_1.GetTitledFirstNameNoTooltip] สมบูรณ์แบบ!"
 intrigue_dread.4001.b:0 "บางที [prisoner_2.GetTitledFirstNameNoTooltip] อาจจะดีที่สุด?"
 intrigue_dread.4001.c:0 "ข้าอยากจะใช้ [prisoner_3.GetTitledFirstNameNoTooltip] มากกว่า"
 intrigue_dread.4001.a-c.tt:0 "ข้าจะใช้ [THIS.Char.GetTitledFirstName] เป็นผู้รับการทดลองในความพยายามนี้"
 intrigue_dread.4001.kinslayer:0 "หาก [THIS.Char.GetTitledFirstName] ถูกสังหารด้วยเหตุนี้ ข้าอาจกลายเป็นที่รู้จักในฐานะ[GetTrait('kinslayer_3').GetName( GetPlayer )]"
 intrigue_dread.4001.d:0 "ไม่ ตอนนี้ยังไม่ใช่เวลาที่เหมาะสม"
 intrigue_dread.4001.d.flavor:0 "ข้าจะกลับมาพิจารณาแนวคิดนี้อีกครั้งในอีกไม่กี่ปี หวังว่าจะมีนักโทษใหม่"

 intrigue_dread.4002.desc:0 "บัดนี้ข้าได้เลือกผืนผ้าใบของข้าแล้ว ข้าต้องตัดสินใจว่าผลงานชิ้นเอกของข้าจะมีรูปแบบใด\n\nข้าคิดถึงความทรมานมากมายที่ข้าอยากจะมอบให้แก่ [victim.GetTitledFirstName] แต่หากข้าจะสร้างผลงานชิ้นเอกที่แท้จริง ข้าต้องมุ่งเน้นไปที่การทำสิ่งเดียวให้สมบูรณ์แบบ"
 intrigue_dread.4002.a:0 "ปั้นร่างที่ถูกถลกหนังของ[victim.GetHerHis]ให้เป็นประติมากรรมที่สวยงาม"
 intrigue_dread.4002.a.flavor:0 "ข้าจะนำไปจัดแสดงให้ทั้ง[ROOT.Char.Custom('GetRealmOrDomicile')]ได้เห็น!"
 intrigue_dread.4002.b:0 "[victim.GetSheHe|U]จะขับขานบทเพลงอันไพเราะแห่งความเจ็บปวดให้ข้าฟัง..."
 intrigue_dread.4002.b.flavor:0 "ข้าจะเก็บความทรงจำเกี่ยวกับเสียงกรีดร้องของ[victim.GetHerHis]ไว้เป็นสมบัติไปอีกหลายปี"
 intrigue_dread.4002.c:0 "ทำลายจิตใจของ[victim.GetHerHis]และ ทำให้[victim.GetHerHim]เป็นทาสของข้า!"
 intrigue_dread.4002.c.flavor:0 "ข้าจะเริ่มกระบวนการอันยาวนานและยากลำบากในการลอกเลียนความเป็นตัวตนของ[victim.GetTitledFirstNamePossessiveNoTooltip] เปลี่ยน[victim.GetHerHim]ให้เป็นคนรับใช้ผู้ภักดีของข้า"
 intrigue_dread.4002.c.compassionate.tt:0 "คำเตือน เนื่องจากธรรมชาติที่มีเมตตาของข้า การเลือกเส้นทางนี้จะเพิ่ม[stress|E]ของข้าอย่างมาก"
 intrigue_dread.4002.c.success.desc:0 "ข้าประสบความสำเร็จในการปรับเปลี่ยนจิตใจของ[victim.GetFirstNamePossessiveNoTooltip]ให้เหมาะกับจุดประสงค์ของข้า"
 intrigue_dread.4002.c.failure.desc:0 "[victim.GetFirstNameNoTooltip] สิ้นใจก่อนที่ข้าจะทำกระบวนการให้เสร็จสิ้น"
 intrigue_dread.4002.d:0 "ข้าเปลี่ยนใจแล้ว [victim.GetSheHe]ไม่เหมาะกับเรื่องนี้..."

 intrigue_dread.4004.desc:0 "เพื่อที่จะปรับเปลี่ยนจิตใจของ[victim.GetTitledFirstNamePossessive] ข้าต้อง ทำให้[victim.GetHerHim]เผชิญกับความเครียดอย่างรุนแรงเสียก่อน\n\nข้าควรเลือกวิธีการทรมานที่[victim.GetFirstNameNoTooltip]จะอ่อนแอเป็นพิเศษอย่างระมัดระวัง — การทำ เช่นนี้จะ ทำให้ข้ามั่นใจได้ว่าจะสร้างความบอบช้ำทางจิตใจให้มากที่สุดเท่าที่จะเป็นไปได้"
 intrigue_dread.4004.desc.followup:0 "[victim.GetTitledFirstName] กำลังชินชากับวิธีการทรมานปัจจุบันของข้า และมันไม่มีผลกระทบเหมือนเดิมอีกต่อไป ข้าจะต้องเลือกแนวทางอื่น..."
 intrigue_dread.4004.o.flavor:0 "ประสิทธิภาพของเทคนิคนี้จะแตกต่างกันไปขึ้นอยู่กับ[traits|E]ของ[victim.GetTitledFirstNamePossessiveNoTooltip]"
 intrigue_dread.4004.a:0 "การทรมานทางร่างกายและความเจ็บปวด"
 intrigue_dread.4004.b:0 "การอดอาหารและการอดนอน"
 intrigue_dread.4004.c:0 "การ ทำให้อับอายและการลดทอนคุณค่า"

 intrigue_dread.4005.desc:0 "[victim.GetTitledFirstName] สิ้นหวังในที่สุด และไม่ต่อสู้กับข้าในคุกใต้ดินอีกต่อไป\n\nนี่หมายความว่าถึงเวลาที่จะก้าวไปสู่ขั้นตอนที่สอง ซึ่งข้าต้องสร้างความรู้สึกผิดและความสับสนในจิตใจของ[victim.GetHerHis]ให้มากพอที่จะทำลายสำนึกทางศีลธรรม จุดมุ่งหมาย และแม้ แต่อัตลักษณ์ของ[victim.GetHerHis]"
 intrigue_dread.4005.desc.followup:0 "[victim.GetTitledFirstName] ยังคงยึดติดกับเศษเสี้ยวที่ขาดรุ่งริ่งของอัตลักษณ์ของ[victim.GetHerHis] ได้รับความเสียหาย แต่ยังไม่ถูกทำลาย ข้าต้องใช้กลยุทธ์อื่นเพื่อทำงานให้เสร็จ..."
 intrigue_dread.4005.a:0 "เสนอคำพูดปลอบโยน... ขณะที่ยังคงทรมานต่อไป!"
 intrigue_dread.4005.b:0 "อ้างว่าทั้งหมดนี้คือการลงโทษสำหรับ [ROOT.Char.Custom('GetSinMisdeedPlural')] ของ [victim.GetHerHis]"
 intrigue_dread.4005.c:0 "ปล่อยให้[victim.GetHerHim]คาดหวังการผ่อนผัน แล้วบดขยี้ความหวังของ[victim.GetHerHis]"

 intrigue_dread.4006.desc:0 "ในที่สุดข้าก็ได้ลอกเลียนร่องรอยสุดท้ายของอัตลักษณ์ของ[victim.GetTitledFirstNamePossessive]ออกไปแล้ว บัดนี้[victim.GetSheHe|U]เป็นภาชนะที่ว่างเปล่า ไม่สามารถมีปฏิสัมพันธ์กับโลกรอบตัว[victim.GetHerHim]ได้"
 intrigue_dread.4006.a:0 "ข้าจะปรับเปลี่ยน[victim.GetHerHim]ให้เหมาะกับจุดประสงค์ของข้า"
 intrigue_dread.4006.a.tt:0 "ข้าเริ่มทำงานเปลี่ยน [victim.GetTitledFirstName] ให้เป็นคนรับใช้ที่เชื่อฟัง"
 intrigue_dread.4006.b:0 "มัน ทำให้ข้าขบขันมากกว่าที่จะส่ง[victim.GetHerHim]กลับไปเป็นเปลือกที่ว่างเปล่า"

 intrigue_dread.4007.desc:0 "เสร็จสิ้นแล้ว — [victim.GetTitledFirstName] ยืนอยู่ต่อหน้าข้า ทาสผู้เชื่อฟังของข้า เต็มใจที่จะทำทุกอย่างที่ข้าขอจาก[victim.GetHerHim]"
 intrigue_dread.4007.a:0 "โอ้ สิ่งที่เราจะทำร่วมกัน!"

 intrigue_dread.4008.desc:0 "เป็นเวลาหลายปีแล้วที่ข้าปล่อย [victim.GetTitledFirstName] กลับสู่โลกภายนอกเพื่อทำตามคำสั่งของข้า"
 intrigue_dread.4008.desc.success:0 "ตั้งแต่นั้นมา [victim.GetSheHe|U]ก็ได้ปรับตัวเข้ากับสภาพแวดล้อมของ[victim.GetHerHis]อีกครั้ง และได้เข้ารับผิดชอบตามปกติของ[victim.GetHerHis] — ทั้งหมดนี้ ในขณะที่ยังคงภักดีต่อข้า"
 intrigue_dread.4008.desc.lunatic:0 "\n\nน่าเสียดาย ดูเหมือนว่าความแตกต่างระหว่างการปรับสภาพของข้ากับความเป็นจริงของชีวิตใหม่ของ[victim.GetHerHis]จะหนักเกินไปสำหรับ[victim.GetHerHim] และในที่สุด[victim.GetSheHe]ก็สติแตก"
 intrigue_dread.4008.desc.failure:0 "\n\nน่าเสียดาย ดูเหมือนว่าเพื่อนและครอบครัวของ[victim.GetHerHis]สามารถแก้ไขงานอันละเอียดอ่อนของข้าที่มีต่อ[victim.GetHerHim]ได้มาก และ[victim.GetSheHe]ไม่ภักดีต่อข้าอีกต่อไป"
 intrigue_dread.4008.a.success:0 "ยอดเยี่ยม..."
 intrigue_dread.4008.a.lunatic:0 "อย่างน้อยเราก็เคยมีช่วงเวลาที่ดี"
 intrigue_dread.4008.a.failure:0 "สาปแช่งพวกมันที่ทำลายงานศิลปะของข้า!"

 intrigue_dread.4011.desc:0 "เมื่อ [victim.GetTitledFirstName] ไม่ได้อยู่ใน[ROOT.Char.Custom('GetDungeonPlural')]ของข้าอีกต่อไป ข้าไม่สามารถทำงานต่อไปในการเปลี่ยน[victim.GetHerHim]ให้เป็นผลงานชิ้นเอกของข้าได้ สิ่งนี้จะ ทำให้แผนการของข้าต้องหยุดชะงักลงจนกว่าข้าจะได้ผืนผ้าใบที่สร้างแรงบันดาลใจได้อย่างเหมาะสมอีกผืนหนึ่ง เพราะถึงแม้ข้าจะได้[victim.GetHerHim]กลับคืนมา มันก็จะไม่เหมือนเดิมอีกต่อไป"
 intrigue_dread.4011.a:0 "ความพ่ายแพ้ที่น่าเศร้า..."

 intrigue_dread.4013.desc:0 "ดูเหมือนว่า #EMP การจัดการ#! ของข้าจะหนักเกินไปสำหรับ [victim.GetTitledFirstName] ผู้ ซึ่งได้สิ้นใจใน[ROOT.Char.Custom('GetDungeonPlural')]ของข้า\n\nบัดนี้ข้าจะไม่สามารถสร้างผลงานชิ้นเอกของข้าให้เสร็จสมบูรณ์ได้ เว้น แต่ข้าจะได้ผืนผ้าใบที่สร้างแรงบันดาลใจได้อย่างเหมาะสมอีกผืนหนึ่ง และ[ROOT.Char.GetFaith.HighGodName]ทรงทราบดีว่าต้องใช้เวลานานเท่าใด..."
 intrigue_dread.4013.a:0 "ข้าจะต้องระมัดระวังมากขึ้นในครั้งต่อไป"

 intrigue_dread.4100.t:0 "การพิจารณาคดีที่ไม่สิ้นสุด"
 intrigue_dread.4100.desc.intro:0 "ไม่มีวันใดผ่านไปโดยไม่มีเรื่องไร้สาระใหม่ๆ ถูกนำมาเสนอต่อข้าในราชสำนัก วันนี้ ดูเหมือนจะเป็นตาของ[petitioner_1.GetTitledFirstNamePossessive]และ[petitioner_2.GetTitledFirstNamePossessive]ที่จะมาเสียเวลาของข้าด้วยข้อพิพาทเล็กน้อย"
 intrigue_dread.4100.desc.lazy:0 "\n\nข้าแทบจะไม่สามารถฟังความคับข้องใจของพวกเขาได้... ข้าจะปกครองได้อย่างไรเมื่อเวลาและพลังงานอันจำกัดส่วนใหญ่ของข้าหมดไปกับเรื่องไร้สาระ เช่นนี้?"
 intrigue_dread.4100.desc.councillors:0 "\n\nพวกเขาอยากให้ข้าเชื่อว่านี่เป็นประเด็นที่ ทำให้ความปลอดภัยของอาณาจักรตกอยู่ในความเสี่ยง แต่ข้าก็อดรู้สึกไม่ได้ว่าพวกเขากำลังประเมินความรุนแรงของสถานการณ์สูงเกินไปเพื่อสนองอัตตาของตนเอง"
 intrigue_dread.4100.desc.fallback:0 "\n\nยิ่งข้าฟังเหตุผลของพวกเขามากเท่าไหร่ ข้าก็ยิ่งเชื่อมั่นว่าการพิจารณาคดีทั้งหมดนี้ต่ำกว่าความสนใจของข้า"
 intrigue_dread.4100.z:0 "ข้าสงสัย หัวที่ถูกตัดของพวกเจ้าจะช่างพูดสักเพียงใด?"
 intrigue_dread.4100.a:0 "ทหาร เอาเจ้าพวกอันธพาลเหล่านี้ออกไปให้พ้นสายตาข้า!"
 intrigue_dread.4100.b:0 "ข้าจะสอนพวกเจ้าให้รู้ว่าการเสียเวลาของราชสำนักเป็นอย่างไร!"
 intrigue_dread.4100.b.duel_success:0 "ผู้ร้องทุกข์ตัวสั่นต่อหน้าความพิโรธของข้า"
 intrigue_dread.4100.b.duel_failure:0 "ผู้ร้องทุกข์รู้สึกถูกดูหมิ่นจากคำขู่ของข้า"
 intrigue_dread.4100.c:0 "ให้ข้าฟังเรื่องนี้อีกครั้ง..."
 intrigue_dread.4100.c.tooltip:1 "ท่านจะใช้เวลาในการตัดสินใจ"
 intrigue_dread.4100.c.support.petitioner_1:1 "หากท่านสนับสนุน [petitioner_1.GetTitledFirstName]"
 intrigue_dread.4100.c.support.petitioner_2:1 "หากท่านสนับสนุน [petitioner_2.GetTitledFirstName]"
 intrigue_dread.4100.d:0 "[scoped_chancellor.GetTitledFirstNameNoTooltip] ควรจัดการเรื่องเหล่านี้"

 intrigue_dread.4102.desc.commanders:0 "แก่นของประเด็นระหว่าง [petitioner_1.GetFirstName] และ [petitioner_2.GetFirstName] เกี่ยวข้องกับการทะเลาะวิวาทระหว่างผู้บังคับบัญชาและทหารผ่านศึกสองสามคน"
 intrigue_dread.4102.desc.guests:0 "เห็นได้ชัดว่า ปัญหาเกิดจากเหตุการณ์ทางการทูตบางประเภท..."
 intrigue_dread.4102.desc.fallback:0 "ข้าหวังว่าการฟังความคับข้องใจของพวกเขาจะเปิดเผยความหมายที่ลึกซึ้งยิ่งขึ้นของเรื่องทั้งหมดนี้ แต่การทะเลาะวิวาทของ[petitioner_1.GetFirstNamePossessive]และ[petitioner_2.GetFirstNamePossessive]กลับฟังดูตื้นเขินยิ่งขึ้นในหูของข้า"
 intrigue_dread.4102.desc.antagonizer:0 "\n\nหากไม่มีอะไรอื่น ข้าบอกได้เลยว่า [scoped_antagonizer.GetFirstNameNoTooltip] เป็นผู้ร้องทุกข์ที่น่ารำคาญที่สุดในสองคนนี้"
 intrigue_dread.4102.a:0 "ข้าสั่งให้พวกเจ้าสงบศึกเดี๋ยวนี้ มิฉะนั้น"
 intrigue_dread.4102.b:0 "[petitioner_1.GetFirstNameNoTooltip] เป็นฝ่ายถูกอย่างชัดเจน"
 intrigue_dread.4102.c:0 "คำพูดของ[petitioner_2.GetFirstNamePossessiveNoTooltip]ฟังดูเป็นจริงในหูของข้า"

 intrigue_dread.4200.t:0 "ป่าในฝันของข้า"
 intrigue_dread.4200.desc.intro:0 "จากความพยายามของข้าที่จะกลายเป็นบุคคลที่น่าเกรงขามและเป็นที่เคารพอย่างแท้จริง ผู้กระทำผิดและผู้ไม่ภักดีจำนวนมากได้ลงเอยในคุกใต้ดินของข้า"
 intrigue_dread.4200.desc.noble_forest:2 "ห้องขังของข้าเต็มไปด้วยคู่แข่ง คนทรยศ และอาชญากรทั่วไป บางทีอาจถึงเวลาที่พวกเขาจะได้พบกับ[ROOT.Char.GetFaith.DeathDeityName]ใน[ROOT.Char.GetFaith.NegativeAfterLife] และรับใช้ผลประโยชน์ของ[ROOT.Char.GetPrimaryTitle.GetAdjectiveNoTooltip]ไปพร้อมกัน!"
 intrigue_dread.4200.desc.commoner_forest:0 "นักฆ่าและนักล้วงกระเป๋าชั้นต่ำจำนวนมากจากชนบทและเมืองต่างๆ กำลังรอชะตากรรมของตน แยกออกจากสังคม แต่บางทีข้าอาจมีความคิดที่ดีกว่าสำหรับพวกเขา"
 intrigue_dread.4200.desc.middle:0 "\n\nในแผนการอันน่าสยดสยองของข้า ข้าจินตนาการถึงป่าแห่งคนชั้นต่ำและคนทรยศที่ถูกเสียบล้อมรอบ [ROOT.Char.GetCapitalLocation.GetTitle.GetNameNoTierNoTooltip] ทุกด้าน: เครื่องเตือนใจอันน่าสะพรึงกลัวแก่ทุกคนถึงสิ่งที่จะเกิดขึ้นเมื่อ [ROOT.Char.GetTitleAsNameNoTooltip] ถูกทรยศ"
 intrigue_dread.4200.desc.noble_forest.outro:1 "ข้าเห็น [random_prisoner_scope.GetName] บนหลักแหลม ล้อมรอบด้วยสามัญชนที่ถูกตั้งขึ้นในลักษณะเดียวกัน สิ่งที่เหลืออยู่ตอนนี้คือการ ทำให้ความฝันนี้เป็นจริง!"
 intrigue_dread.4200.desc.commoner_forest.outro:0 "ข้าเห็นแถวแล้วแถวเล่าของอาชญากรทั่วไปแผ่ขยายออกไปสุดขอบฟ้า [ROOT.Char.GetCapitalLocation.GetTerrain.GetNameNoTooltip]เปื้อนเลือดของพวกเขา ด้วยการทำงานเล็กน้อย เราอาจรวบรวมพวกเดนมนุษย์เหล่านี้ได้มากพอที่จะ ทำให้ความฝันของข้าเป็นจริง"
 intrigue_dread.4200.a:0 "มาเริ่มกันเลย!"
 intrigue_dread.4200.b:1 "[random_prisoner_scope.GetTitledFirstNameNoTooltip] และสามัญชนสองสามคนควรจะส่งสารได้"
 intrigue_dread.4200.c:0 "การรวบรวมศพเล็กน้อยน่าจะเพียงพอ"
 intrigue_dread.4200.d:0 "ทุกคนต้องเกรงกลัวข้า!"
 intrigue_dread.4200.e:0 "สาบานต่อ[ROOT.Char.GetFaith.HighGodName]! ข้าทำสิ่งนี้ไม่ได้!"
 intrigue_dread.4201.t:0 "ป่าแห่งซากศพ"
 intrigue_dread.4201.desc.intro:0 "ในที่สุดนิมิตของข้าก็เป็นจริงขึ้นมาด้วยซากศพของอาชญากรนับไม่ถ้วน ข้าเดินเล่นอย่างสบายอารมณ์ไปกับเสียงนกร้องและเสียงหยดเลือดเก่าๆ ที่หยดลงบนพื้นดินชุ่มน้ำ"
 intrigue_dread.4201.desc.noble_forest:0 "\n\nข้ามาพบร่างของ [random_prisoner.GetNameNoTooltip] ใบหน้าของ[random_prisoner.GetHerHis]แข็งค้างด้วยสีหน้าบิดเบี้ยวด้วยความตกใจและความหวาดกลัว ราวกับว่า[random_prisoner.GetSheHe]รับรู้ถึงชะตากรรมของ[random_prisoner.GetHerHis]"
 intrigue_dread.4201.desc.commoner_forest:0 "\n\nข้าเดินผ่านแถวแล้วแถวเล่าของคนชั้นต่ำและโจรไร้นาม มั่นใจว่าโจรปล้นสะดมหรือโจรใดๆ ที่เข้าใกล้ [ROOT.Char.GetCapitalLocation.GetTitle.GetNameNoTierNoTooltip] สามารถเห็นได้อย่างชัดเจนว่าจะเกิดอะไรขึ้นกับผู้ที่พยายามก่ออาชญากรรมและความวุ่นวายใน [ROOT.Char.GetPrimaryTitle.GetNameNoTooltip]!"
 intrigue_dread.4201.desc.outro:0 "\n\nเมื่อเสร็จสิ้นการเยี่ยมชม ข้าสูดหายใจเฮือกสุดท้ายของไอพิษแห่งความตายก่อนกลับบ้าน พอใจกับผลงานของข้า"
 intrigue_dread.4201.a:0 "บัดนี้ทุกคนจะเกรงกลัวนาม "[ROOT.Char.GetNameNoTooltip]""

 forest_of_corpses_1_modifier:0 "ป่าแห่งซากศพ"
 forest_of_corpses_1_modifier_desc:0 "ป่าขนาดใหญ่ของซากศพที่ถูกเสียบได้ถูกสร้างขึ้นในเคาน์ตีนี้"
