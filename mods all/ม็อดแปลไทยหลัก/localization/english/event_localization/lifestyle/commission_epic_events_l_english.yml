 commission_epic.2002.t:0 "มหากาพย์ประจำตระกูล: ความภาคภูมิใจของตระกูล"
 commission_epic.2002.desc:0 "[spymaster.Custom2('MyCharacterIntroduction', ROOT.Char)|U] ดูเหมือนจะเป็นคนล่าสุดที่ได้ [ROOT.Char.Custom('CompositionTypeActionPast')] ข้อความที่ตัดตอนมาจากมหากาพย์ประจำตระกูลของข้า\n\n"ทวดของท่าน [grandparent.GetMotherFather] เป็นบุคคลที่น่าทึ่งและมีไหวพริบ" [spymaster.GetSheHe] บอกข้า "หากเรา ทำให้เป็นที่รู้กันว่าท่านมีเล่ห์เหลี่ยมแม้เพียงครึ่งหนึ่งของ [grandparent.GetSheHe] ผู้คนจะคิดทบทวนก่อนที่จะกระทำการต่อต้านท่าน""
 commission_epic.2002.a:0 "เลือดของงูพิษนั้นไหลเวียนอยู่ในเส้นเลือดของข้า!"
