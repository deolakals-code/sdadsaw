 commission_epic.0002.t:0 "มหากาพย์ประจำตระกูล: มุมมอง"
 commission_epic.0002.writer:0 "มหากาพย์ประจำตระกูลของข้าดูเหมือนจะดำเนินไปด้วยดี และบางบรรทัดก็ฟังดูเหมือนจะถูกอ้างอิงไปอีกหลายทศวรรษ แต่ [writer.GetTitledFirstName] มีคำถามมากมายเกี่ยวกับจุดเน้นของเรื่องราว\n\nมันจะง่ายกว่าถ้า [writer.GetSheHe] เขียนทั้งหมดก่อน แล้วข้าค่อยบอก [writer.GetHerHim] ว่าข้าไม่ชอบอะไรเกี่ยวกับมัน แต่ [writer.GetSheHe] ยืนยันว่า [writer.GetSheHe] ต้องการคำตอบเดี๋ยวนี้"
 commission_epic.0002.servant:0 "[servant.GetFirstName] ข้ารับใช้ที่ข้าสั่งให้ไปเรียบเรียงประวัติวงศ์ตระกูล ดูเหมือนจะติดขัดอยู่บ้าง ทว่า การที่[servant.GetSheHe]พอจะทำอะไรคืบหน้าไปบ้างก็นับว่าน่าทึ่งยิ่งนัก เพราะปรากฏว่า[servant.GetSheHe]อ่านไม่ออก ทั้งยัง แต่งโคลงกลอนไม่เป็น\n\nถึงกระนั้น [servant.GetSheHe]ก็ยังอุตส่าห์ทำงานหามรุ่งหามค่ำ และบัดนี้ได้มาหาข้าพร้อมคำถามสำคัญ "เนื้อหาควรจะเกี่ยวกับสิ่งใดกันแน่หรือ [ROOT.Char.Custom('FormOfAddressForLiege')] พ่ะย่ะค่ะ?""
 commission_epic.0002.scribes:0 "เหล่า[ROOT.Char.Custom('CommissionEpicScribes')]ของข้าได้เริ่มงานเรียบเรียงมหากาพย์วงศ์ตระกูลแล้ว แต่พวกเขาก็กำลังประสบปัญหาเสียแล้ว พวกเขาตกลงกันไม่ได้ว่าเนื้อเรื่องควรจะมุ่งเน้นไปที่สิ่งใด โดยที่[ROOT.Char.Custom('CommissionEpicScribe')]ทุกคนต่างบังเอิญยืนกรานว่าส่วนงานที่ตนรับผิดชอบควรจะเป็นส่วนที่ได้รับการเน้นย้ำมากที่สุด\n\n"พวกข้ามิได้ประสงค์จะรบกวน [ROOT.Char.Custom('FormOfAddressForLiege')] แต่ท่าน #EMP จักต้อง#! ตัดสินเรื่องนี้ ก่อนที่พวกข้าจะฉีกทึ้งกันเองเป็นชิ้น ๆ ขอรับ!""
 commission_epic.0002.iberia_epic.a:0 "เขียนเกี่ยวกับสิทธิ์ของราชวงศ์ข้าในการปกครองไอบีเรีย!"
 commission_epic.0002.a:1 "เน้นเรื่องราวเกี่ยวกับสิทธิ์ในการอ้างสิทธิ์ตามบรรพบุรุษของราชวงศ์ข้า"
 commission_epic.propaganda:0 "ข้าจะได้รับ [claims|E] เหนือดินแดนข้างเคียงเมื่อมหากาพย์เสร็จสิ้น"
 commission_epic.0002.b:1 "แน่นอนว่ามันควรเน้นที่ข้าและโชคชะตาของข้า!"
 commission_epic.more_prestige:0 "ข้าจะได้รับ [prestige|E] ส่วนตัวมากขึ้นเมื่อมหากาพย์เสร็จสิ้น"
 commission_epic.0002.c:1 "มันคือประวัติ #EMP ตระกูล#! ดังนั้นจงใจกว้าง"
 commission_epic.more_dynasty_prestige:0 "ข้าจะได้รับ [dynasty_prestige|E] มากขึ้นเมื่อมหากาพย์เสร็จสิ้น"
 commission_epic.0002.d:0 "เล่าเรื่องตามความเป็นจริงที่สุดเท่าที่จะเป็นไปได้"
 commission_epic.more_piety:0 "ข้าจะได้รับ [piety|E] บางส่วนเมื่อมหากาพย์เสร็จสิ้น"


 commission_epic.1001.t:0 "มหากาพย์ประจำตระกูล: คำถามเรื่องเวลา"
 commission_epic.1001.opening:0 "ข้าไม่ได้รับงานใหม่เกี่ยวกับมหากาพย์ประจำตระกูลของข้ามาหลายสัปดาห์แล้ว และกระบวนการทั้งหมดอาจใช้เวลานานเกินไป หรือ"
 commission_epic.1001.composer:0 "[composer.GetSheHe] ลงเอยด้วยการทำงานลวกๆ! มันมากเกินไปจริงๆ หรือที่จะเรียกร้องให้ [composer.GetSheHe] ส่งมอบความเป็นเลิศ และให้ [composer.GetSheHe] ส่งมอบมันเดี๋ยวนี้?"
 commission_epic.1001.scribes:0 "[ROOT.Char.Custom('CommissionEpicScribes')] ของข้าลงเอยด้วยการทำงานลวกๆ! มันมากเกินไปจริงๆ หรือที่จะเรียกร้องให้พวกเขาส่งมอบความเป็นเลิศ และให้พวกเขาส่งมอบมันอย่างรวดเร็ว?"
 commission_epic.1001.a:0 "ข้าต้องการให้มันดี และข้าต้องการมัน #EMP เดี๋ยวนี้!#!"
 commission_epic.1001.b:0 "ข้าจะให้ [ROOT.Char.Custom2('CommissionEpicComposerThem', composer)] อยู่ตราบเท่าที่จำเป็น"
 commission_epic.1001.b_scribes:0 "ข้าจะให้ [ROOT.Char.Custom('CommissionEpicComposerThem')] อยู่ตราบเท่าที่จำเป็น"
 commission_epic.1001.c:0 "ทีนี้ ถ้าเราแบ่งส่วนที่ทำเสร็จแล้วออกเป็นส่วนที่ 1..."

 commission_epic.1002.t:0 "มหากาพย์ประจำตระกูล: แหล่งข้อมูลอันอุดม"
 commission_epic.1002.composer:0 "[composer.GetTitledFirstName] กำลังเล่าให้ [powerful_vassal.Custom2('MyCharacterIntroduction', ROOT.Char)] ฟังเกี่ยวกับรายละเอียดที่น่าตื่นเต้นหลายอย่างที่ [composer.GetSheHe] ค้นพบเกี่ยวกับบรรพบุรุษของข้า "ตอนนี้ ข้าเชื่อว่าส่วนที่มี [ROOT.Char.Custom('CompositionDetail')] อาจเป็นเรื่องจริง เนื่องจาก—"\n\nแน่นอนว่ามันน่าทึ่ง แต่ [composer.GetSheHe] ไม่มี [ROOT.Char.Custom('CompositionType')] อันยิ่งใหญ่ที่ต้อง ทำให้เสร็จหรือ? ส่วนเรื่องเกร็ดเล็กเกร็ดน้อยนี้..."
 commission_epic.1002.scribes:0 "อาลักษณ์บางคนของข้ากำลังเล่าให้ [powerful_vassal.Custom2('MyCharacterIntroduction', ROOT.Char)] ฟังเกี่ยวกับรายละเอียดที่น่าตื่นเต้นหลายอย่างที่พวกเขาค้นพบเกี่ยวกับบรรพบุรุษของข้า\n\n"ตอนนี้ ข้าเชื่อว่าส่วนที่มี [ROOT.Char.Custom('CompositionDetail')] อาจเป็นเรื่องจริง เนื่องจาก—"\n\nแน่นอนว่ามันน่าทึ่ง แต่พวกเขาไม่มี [ROOT.Char.Custom('CompositionType')] อันยิ่งใหญ่ที่ต้อง ทำให้เสร็จหรือ? ส่วนเรื่องเกร็ดเล็กเกร็ดน้อยนี้..."
 commission_epic.1002.a:0 "ควรแบ่งปันให้ข้าหลวงทุกคนของข้า!"
 commission_epic.1002.a.tt:0 "เมื่อเสร็จสิ้น ท่านจะได้รับหนังสือมหากาพย์ประจำตระกูล [artifact|E] ซึ่งปรับปรุง [opinion|E] ของ [vassal|E]"
 commission_epic.1002.b:0 "ใส่มันลงใน [ROOT.Char.Custom('CompositionType')] เพื่อให้เสร็จเร็วขึ้น!"
 commission_epic.1002.b.tt:0 "ซึ่งหมายความว่าข้าสามารถเรียกคืนเงินเดือนบางส่วนได้ด้วย!"

 commission_epic.1003.t:0 "มหากาพย์ประจำตระกูล: การพักผ่อนของนักเขียน"
 commission_epic.1003.composer:0 "[composer.GetTitledFirstName] ถูกจับได้ขณะพยายามแอบหนีจากหน้าที่ของ [composer.GetHerHis]! โชคดีที่องครักษ์จำ [composer.GetHerHim] ได้ขณะที่ [composer.GetSheHe] ผ่านประตู\n\n"มันเป็นงานที่เหน็ดเหนื่อย" [composer.GetSheHe] ปกป้อง [composer.GetHerselfHimself] "ทั้งวันทั้งคืน [ROOT.Char.GetLadyLord] ผู้มีเมตตาของข้า! ข้าต้องการพักผ่อนสักสองสามวันอย่างยิ่ง""
 commission_epic.1003.scribes:0 "อาลักษณ์ของข้าบางคนถูกจับได้ขณะพยายามลอบหนีจากหน้าที่เรียบเรียงมหากาพย์วงศ์ตระกูลของข้า! โชคยังดีที่ยามคนหนึ่งจำพวกเขาได้ขณะที่พวกเขาเดินผ่านประตูเมือง\n\n"มันเป็นงานที่เหนื่อยล้าอย่างยิ่ง" พวกเขาอธิบาย "ทั้งวันทั้งคืน [ROOT.Char.Custom('FormOfAddressForLiege')]! พวกข้าต้องการหยุดพักสักสองสามวันอย่างยิ่งขอรับ""
 commission_epic.1003.a:0 "เอาล่ะ บางทีการพักผ่อนอาจจะเหมาะสม"
 commission_epic.1003.b:0 "ล่ามโซ่ [ROOT.Char.Custom2('CommissionEpicComposerThem', composer)] ไว้กับโต๊ะทำงานของ [ROOT.Char.Custom2('CommissionEpicComposerTheir', composer)]!"
 commission_epic.1003.b_scribes:0 "ล่ามโซ่ [ROOT.Char.Custom('CommissionEpicComposerThem')] ไว้กับโต๊ะทำงานของ [ROOT.Char.Custom('CommissionEpicComposerTheir')]!"

 commission_epic.1004.t:0 "มหากาพย์ประจำตระกูล: นักวาดภาพประกอบวิจิตรผู้เชี่ยวชาญ"
 commission_epic.1004.opening:0 "มีข่าวมาถึงข้าว่า"
 commission_epic.1004.devotee_male:0 "[ROOT.Char.GetFaith.DevoteeMale]"
 commission_epic.1004.devotee_female:0 "[ROOT.Char.GetFaith.DevoteeFemale]"
 commission_epic.1004.ending:1 "ผู้มีชื่อเสียงด้านภาพประกอบวิจิตรของ [illuminator.GetHerHis] กำลังพักอยู่ในเมืองใน [barony.GetNameNoTier] ด้วยมหากาพย์ประจำตระกูลของข้าที่กำลังดำเนินไป นี่อาจเป็นเวลาที่เหมาะที่สุดที่จะคิดว่าหน้ากระดาษควรมีลักษณะอย่างไรเมื่อทุกอย่างเสร็จสิ้น"
 commission_epic.1004.a:0 "จ้างนักวาดภาพประกอบวิจิตร ไม่ว่าจะต้องเสียค่าใช้จ่ายเท่าใด!"
 commission_epic.1004.b:1 "[composer.GetTitledFirstNameNoTooltip] สามารถทำได้ด้วย [composer.GetHerselfHimself]"
 commission_epic.1004.b_scribes:0 "[ROOT.Char.Custom('CommissionEpicScribes')] ของข้าสามารถทำได้ด้วยตนเอง"
 commission_epic.1004.success:0 "ภาพประกอบวิจิตรยอดเยี่ยม"
 commission_epic.1004.failure:0 "ภาพประกอบวิจิตรแย่"
 commission_epic.1004.c:0 "ข้าคิดว่าตัวเองเป็นศิลปินอยู่เสมอ..."

 commission_epic.1005.t:0 "มหากาพย์ประจำตระกูล: บทเพลงของประชาชนของเรา"
 commission_epic.1005.opening:0 "ข้าครุ่นคิดถึงสองสามบรรทัดสุดท้าย"
 commission_epic.1005.composer:0 "[composer.GetFirstName] ได้"
 commission_epic.1005.scribes:0 "[ROOT.Char.Custom('CommissionEpicScribes')] ของข้าได้"
 commission_epic.1005.ending:0 "มอบให้ข้าจากมหากาพย์ประจำตระกูลของข้า และเมื่อข้าเริ่มฮัมเพลง ข้าก็ตระหนักว่ามันเป็นไปตามจังหวะเดียวกับเพลงโปรดเพลงหนึ่งของชนเผ่าของข้า!\n\nหากเรื่องราวของบรรพบุรุษของข้าถูกใส่ทำนองที่น่าจดจำ เช่นนี้ แน่นอนว่าจะไม่มีวันถูกลืม!"
 commission_epic.1005.a:0 "ข้าควรจะขอสิ่งนี้ตั้งแต่แรก!"
 commission_epic.1005.b_composer:0 "ข้ามั่นใจว่า [ROOT.Char.Custom2('CommissionEpicComposer', composer)] สามารถคิดอะไรที่ดีพอๆ กันได้"
 commission_epic.1005.b:0 "ข้ามั่นใจว่า [ROOT.Char.Custom('CommissionEpicComposer')] สามารถคิดอะไรที่ดีพอๆ กันได้"
 commission_epic.1005.classic:0 "ประพันธ์ทำนองคลาสสิก"
 commission_epic.1005.enjoyable:0 "ประพันธ์ทำนองที่น่าเพลิดเพลิน"
 commission_epic.1005.terrible:0 "ประพันธ์ทำนองที่แย่มาก"

 commission_epic.1006.opening:0 "[vassal.Custom2('AppropriateGreetingPositive', ROOT.Char)]"
 commission_epic.1006.desc:0 "ข้าได้ [ROOT.Char.Custom('CompositionTypeActionPast')] ส่วนต่างๆ ของมหากาพย์ประจำตระกูลใหม่ของท่าน และความภักดีที่แท้จริง ซึ่งเกิดจากมิตรภาพอันลึกซึ้งระหว่างวีรบุรุษในตำนานเหล่านี้เป็นแรงบันดาลใจให้ข้า\n\nข้าจะรู้สึกเป็นเกียรติอย่างยิ่งที่ได้เรียกท่านว่าเป็นสหาย ในขณะที่ข้ารับใช้อย่างภักดี"
