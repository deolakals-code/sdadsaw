 commission_epic.2003.t:0 "มหากาพย์ประจำตระกูล: พันธกรณีชั่วนิรันดร์"
 commission_epic.2003.desc:0 "ดูเหมือนว่า [court_chaplain.GetFirstName] ได้ [ROOT.Char.Custom('CompositionTypeActionPP')] ส่วนต่างๆ ของมหากาพย์ประจำตระกูลใหม่ของข้า แน่นอนว่า [court_chaplain.GetSheHe] ได้ค้นพบ "ความคลาดเคลื่อน" ระหว่างคำสัญญาที่ทำไว้ในอดีตกับความเป็นจริงในปัจจุบันของเรา\n\nข้าบอกได้เลยว่า [court_chaplain.GetSheHe] จะไม่ปล่อยเรื่องนี้ไปง่ายๆ ในเร็วๆ นี้ "แน่นอนว่าท่านเห็นว่ามันจะฉลาดและมีเมตตาเพียงใดที่จะปฏิบัติตามคำสัญญาของบรรพบุรุษของท่าน แม้กระทั่งตอนนี้?""
 commission_epic.2003.a_same_dynasty:0 "เราทั้งคู่รู้ว่าราชวงศ์ของเรารักษาสัญญา"
 commission_epic.2003.a:0 "ข้าสืบเชื้อสายมาจากผู้รักษาสัญญามายาวนาน"
 commission_epic.2003.b:0 "บรรพบุรุษของข้าเป็น[ROOT.Char.Custom('GetPiousBelievers')] แต่ก็หาได้เปี่ยมปัญญาเสมอไปไม่"

 commission_epic.2004.t:0 "มหากาพย์ประจำตระกูล: แรงบันดาลใจบังเกิด"
 commission_epic.2004.desc_scribes:0 "[ROOT.Char.Custom('CommissionEpicComposer')|U] [ROOT.Char.Custom('CommissionEpicComposerHasHave')] ได้ใช้..."
 commission_epic.2004.desc_composer:0 "[ROOT.Char.Custom2('CommissionEpicComposer', composer)] [ROOT.Char.Custom2('CommissionEpicComposerHasHave', composer )] ได้ใช้..."
 commission_epic.2004.desc:1 "อิสระอย่างมากในมหากาพย์ประจำตระกูลของข้าเกี่ยวกับสงครามและการสู้รบ มันสร้างฉากที่น่าทึ่ง แต่ข้ากังวลว่า [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('marshal'))] ของข้าอาจขุ่นเคืองเมื่อ [marshal.GetSheHe] ขมวดคิ้ว [marshal.GetHerHis] กับฉากเฉพาะ\n\nข้าเกือบจะโล่งใจเมื่อ [marshal.GetSheHe] แบ่งปันความคิดของ [marshal.GetHerHis] ในที่สุด "มันไร้สาระทั้งหมด แต่ส่วนนี้ที่มี [ROOT.Char.Custom('CompositionDetail')] ทำให้ข้าได้ความคิดบางอย่าง...""
 commission_epic.2004.a:0 "ไม่ว่าแรงบันดาลใจจะพบได้ที่ใด เราควรใช้มัน!"
 commission_epic.2004.a.tt:0 "เมื่อเสร็จสิ้น ท่านจะได้รับหนังสือมหากาพย์ประจำตระกูล [artifact|E] ซึ่งปรับปรุง [advantage|E] ในการรบ"
 commission_epic.2004.b:0 "อธิบายให้ข้าฟังโดยละเอียด..."

 commission_epic.2005.t:0 "มหากาพย์ประจำตระกูล: ความซื่อสัตย์และการรับรู้"
 commission_epic.2005.desc:0 "[ROOT.Char.Custom2('RelationToMe', SCOPE.sC('chancellor'))] ของข้า [chancellor.GetTitledFirstName] กำลัง [ROOT.Char.Custom('CompositionTypeActionPP')] มหากาพย์ประจำตระกูลของข้าขณะที่มันค่อยๆ เป็นรูปเป็นร่าง\n\n"หลายส่วนไม่น่าเชื่อถือมากนัก เช่น ส่วนที่มี [ROOT.Char.Custom('CompositionDetail')]" [chancellor.GetSheHe] บอกข้า "ในทางกลับกัน ใครจะบอกได้ว่าอดีตเป็นอย่างไร? หากท่านกำลัง แต่งเติมอยู่แล้ว ทำไมไม่ ทำให้มันสุดโต่งไปเลยล่ะ?""
 commission_epic.2005.a:0 "ท้ายที่สุดแล้ว การเล่าเรื่องที่ดีเป็นสิ่งสำคัญ..."
 commission_epic.2005.b:0 "ไม่ มันควรเป็นจริงตามชีวิตมากที่สุดเท่าที่จะเป็นไปได้"
 commission_epic.2005.b.tt:0 "เมื่อเสร็จสิ้น ท่านจะได้รับหนังสือมหากาพย์ประจำตระกูล [artifact|E] ซึ่งปรับปรุง [success_chance|E] ของ [personal_scheme|E]"

 commission_epic.2006.t:0 "มหากาพย์ประจำตระกูล: ผูกพันด้วยศรัทธา"
 commission_epic.2006.desc:0 "ข้าไม่แน่ใจว่าควรจะโล่งใจหรือกระอักกระอ่วนใจดี กับความกระตือรือร้นที่ [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('court_chaplain'))]ของข้า [court_chaplain.GetTitledFirstName] แสดงออกมา หลังจากได้[ROOT.Char.Custom('CompositionTypeActionPP')]มหากาพย์วงศ์ตระกูลส่วนที่เสร็จสมบูรณ์แล้ว\n\n"นี่คือเรื่องเล่าอันแฝงคติธรรมอันยอดเยี่ยม!" [court_chaplain.GetSheHe] อ้าง "ราชวงศ์[ROOT.Char.GetDynasty.GetBaseName]มักจะพบกับความยิ่งใหญ่เสมอเมื่อได้รับคำแนะนำจากเหล่า[ROOT.Char.GetFaith.AltPriestTermPlural] และประสบกับช่วงเวลาอันมืดมนเมื่อล้มเหลวที่จะรับฟังคำแนะนำนั้น! ข้าหวังว่านี่จะเป็นบทเรียนที่ท่านจะรับฟังเป็นอย่างดี เช่นกัน""
 commission_epic.2006.a:0 "แท้จริงแล้ว ข้ารู้ดีเกินไป"
 commission_epic.2006.a.tt:0 "เมื่อเสร็จสิ้น ท่านจะได้รับหนังสือมหากาพย์ประจำตระกูล [artifact|E] ซึ่งเพิ่ม [piety|E] และภาษีจากผู้มี [faith|E] เดียวกัน"
 commission_epic.2006.b:0 "ฮ่า! มันกลับกันต่างหาก"
 commission_epic.2006.b.flavor:0 "เราเป็นผู้นำทางสำหรับ [ROOT.Char.GetFaith.AltPriestTermPlural] เสมอมา"
 commission_epic.2006.c:0 "เราทั้งคู่รู้ว่าครอบครัวมาก่อนในทุกสิ่ง"
 commission_epic.2006.c.same_dynasty:0 "ตัวเลือกนี้ใช้ได้ เพราะ [court_chaplain.GetFirstNameNoTooltip] อยู่ใน [dynasty|E] เดียวกันกับข้า"

 commission_epic.6001.t:0 "การ แต่งเติมเล็กน้อย"
 commission_epic.6001.writerservant:0 "หลังจากทำงานเกี่ยวกับพงศาวดารของข้ามาสักพัก [composer.GetName] ก็มาหาข้า\n\n"[Select_CString(ROOT.Char.IsFemale,'นายหญิง','นายท่าน')]" [composer.GetSheHe] กล่าว "ข้าต้องสารภาพว่า แม้ว่าราชวงศ์ของท่านจะยิ่งใหญ่จริง ๆ แต่การอ้างสิทธิ์ในบรรพบุรุษที่ท่านหวังว่าจะพบอาจ... ไม่ใช่เรื่องง่ายที่จะยืนยัน ข้าต้องการเวลาและทรัพยากรมากขึ้น เพื่อขุดค้นลึกลงไปในตำราเก่า ๆ มิฉะนั้น ข้าจะต้องทำการ #italic ตกแต่ง#! เล็กน้อยกับเรื่องราว และการอ้างสิทธิ์ของท่านอาจลงเอยด้วยความน่าเชื่อถือน้อยลง...""
 commission_epic.6001.scribes:0 "อาลักษณ์ของข้าทำงานทั้งวันทั้งคืนขุดค้นผ่านต้นฉบับเก่า ๆ แสวงหาการอ้างสิทธิ์ในดินแดนจากบรรพบุรุษของข้าเพื่อยกย่องในพงศาวดาร\n\n"อนิจจา" พวกเขากล่าว "เราอาจต้องทำการตก แต่งเล็กน้อยเมื่อพูดถึง... ความจริงของเรื่องนี้ การกระทำและอาณาเขตของบรรพบุรุษของท่าน และอื่น ๆ แน่นอนว่าท่านเข้าใจเรื่องนั้น [Select_CString(ROOT.Char.IsFemale,'นายหญิง','นายท่าน')]?""
 commission_epic.6001.a:0 "แต่งเติมอะไรก็ได้ที่เจ้าต้องการ แค่ ทำให้มันเสร็จ!"
 commission_epic.6001.b:0 "แค่เอาทองของข้าไป แล้วทำวิจัยเพิ่มเติม"
 commission_epic.less_credible:0 "พงศาวดารจะน่าเชื่อถือน้อยลง"
 commission_epic.more_credible:0 "พงศาวดารอาจลงเอยด้วยความน่าเชื่อถือมากขึ้น"

 commission_epic.6003.t:0 "ข้ออ้างสิทธิ์ที่เย็นชา"
 commission_epic.6003.writer:0 "[composer.GetName] ทำงานเรียบเรียงพงศาวดารของข้าอย่างขยันขันแข็ง ซึ่งมันก็ยิ่งใหญ่ขึ้นและน่ากังขามากขึ้นในระดับที่เท่า ๆ กัน\n\n"[composer.GetSheHe] กล่าวว่า "[ROOT.Char.Custom('FormOfAddressForLiege')|U] ข้าพเจ้าพบบทความเก่า ๆ ขาด ๆ ที่กล่าวถึง[Select_CString(ancestor_1.IsFemale,'ราชินี','กษัตริย์')]นามว่า [ancestor_1.GetFirstNameNoTooltip] ผู้เคยปกครองใน [neighboring_county_1.GetNameNoTier], [neighboring_county_2.GetNameNoTier] และ [neighboring_county_3.GetNameNoTier] ข้าพเจ้าสามารถค้นคว้าตารางลำดับวงศ์ตระกูล และทำการ... เรียกได้ว่า #italic เพิ่มเติมอย่างสร้างสรรค์#! เพื่อยืนยันว่า [ancestor_1.GetSheHe] เป็นบรรพบุรุษของท่าน จากนั้น ข้าพเจ้าก็สามารถใช้เรื่องราวของ[ancestor_1.GetHerHis]เพื่อมอบสิทธิ์อ้างอิงที่น่าเชื่อถือไม่มากก็น้อยให้แก่ท่าน เหนือดินแดนเหล่านั้นบางส่วน หรืออาจจะทั้งหมด...""
 commission_epic.6003.servant:0 "[composer.GetName] ทำงานอย่างขยันขันแข็งกับพงศาวดารของข้าที่น่าสงสัยมากขึ้นเรื่อย ๆ\n\n"[composer.GetSheHe] กล่าวว่า "[ROOT.Char.Custom('FormOfAddressForLiege')|U] ข้าพบจารึกบูชาที่ซีดจางจาก [ancestor_1.GetFirstNameNoTooltip] [Select_CString(ancestor_1.IsFemale,'นักล่าหญิง','ผู้สูงเพียงศอก')] [Select_CString(ancestor_1.IsFemale,'ราชินี','กษัตริย์')]แห่ง [neighboring_county_1.GetNameNoTier], [neighboring_county_2.GetNameNoTier] และ [neighboring_county_3.GetNameNoTier] ในสมัยโบราณ ข้าสามารถเพิ่มเติมอย่างสร้างสรรค์เล็กน้อยลงในแผนภูมิตระกูลของท่าน เพื่อยืนยันว่า [ancestor_1.GetSheHe] เป็นบรรพบุรุษของท่าน จากนั้นในพงศาวดาร ข้าสามารถทำการตก แต่งเล็ก ๆ น้อย ๆ และอื่น ๆ เพื่อยืนยันสิทธิ์อ้างอิงของท่านอย่างมั่นคงเหนือดินแดนเหล่านั้นบางส่วน - หรืออาจจะทั้งหมด""
 commission_epic.6003.scribes:0 "เหล่าอาลักษณ์ของข้าทำงานอย่างหนักกับพงศาวดารที่ซับซ้อนมากขึ้นเรื่อย ๆ ของข้า\n\n"พวกเขากล่าวว่า "[ROOT.Char.Custom('FormOfAddressForLiege')|U] พวกข้าพบบันทึกช่วยจำบริเวณขอบในเอกสารโบราณฉบับหนึ่ง อ้างอิงถึง[ancestor_1.GetWomanMan]นามว่า [ancestor_1.GetFirstNameNoTooltip] [Select_CString(ancestor_1.IsFemale,'ผู้ใจกว้าง','ตาเดียว')] ผู้มีอิทธิพลบางอย่างใน [neighboring_county_1.GetNameNoTier], [neighboring_county_2.GetNameNoTier] และ [neighboring_county_3.GetNameNoTier] ในสมัยโบราณ พวกข้าสามารถค้นคว้าตารางลำดับวงศ์ตระกูล เพื่อ#italic ยืนยัน#!อย่างสร้างสรรค์ว่า [ancestor_1.GetSheHe] เป็นบรรพบุรุษของท่าน จากนั้นในพงศาวดาร พวกข้าอาจใช้มันเพื่อยืนยันสิทธิ์ในการปกครองของท่านเหนือดินแดนเหล่านั้นบางส่วน - หรืออาจจะทั้งหมด...""
 commission_epic.6003.a:0 "ทั้งหมด!"
 commission_epic.6003.b:0 "[neighboring_county_1.GetNameNoTierNoTooltip] ดูดีในช่วงเวลานี้ของปี!"
 commission_epic.6003.c:0 "[neighboring_county_2.GetNameNoTierNoTooltip] คือสิ่งที่ข้าต้องการ!"
 commission_epic.6003.d:0 "[neighboring_county_3.GetNameNoTierNoTooltip] ต้องเป็นของข้า"
 commission_epic.paranoid_neighbors:0 "เพื่อนบ้านของท่านจะอารมณ์เสียมากเมื่อพวกเขารู้เกี่ยวกับพงศาวดารนี้"

 commission_epic.6004.t:0 "ข้ออ้างสิทธิ์ที่น่าเชื่อถือ"
 commission_epic.6004.writerservant:0 "[composer.GetName] ทำงานอย่างขยันขันแข็งกับพงศาวดารของข้า ซึ่งขยายใหญ่ขึ้นเรื่อย ๆ ทั้งในแง่ขอบเขตและปริมาณ\n\n"[composer.GetSheHe] กล่าวว่า "[ROOT.Char.Custom('FormOfAddressForLiege')|U] ข้าพเจ้าพบเอกสารเก่าเกี่ยวกับภาษีและสิทธิ์ในที่ดิน เป็นงานเขียนที่ค่อนข้างน่าเบื่อ แต่ก็กล่าวถึง[ancestor_1.GetLadyLord]นามว่า [ancestor_1.GetFirstNameNoTooltip] [Select_CString(ancestor_1.IsFemale,'ผู้สูงใหญ่','ผู้ศีรษะล้าน')] ผู้ปกครอง [neighboring_county_1.GetNameNoTier] และ [neighboring_county_2.GetNameNoTier] ในสมัยโบราณ ข้าพเจ้าสามารถสืบเชื้อสายของ[ancestor_1.GetHerHis]ย้อนไปตั้งแต่สมัยโบราณตอนปลาย จนมาถึงท่าน! ดังนั้น ข้าพเจ้าจึงสามารถมอบสิทธิ์อ้างอิงเหนือดินแดนใดดินแดนหนึ่งให้ท่านได้ ซึ่งน่าเชื่อถือเสียจนไม่มีผู้ใดปฏิเสธได้""
 commission_epic.6004.scribes:0 "เหล่าอาลักษณ์ของข้าทำงานอย่างหนักกับพงศาวดารของข้า ซึ่งยืดยาวและใหญ่โตขึ้นทุกวันที่ผ่านไป\n\n"พวกเขากล่าวว่า "[ROOT.Char.Custom('FormOfAddressForLiege')|U] พวกข้าพบกฎบัตรหลวงที่มีต้นกำเนิดเก่าแก่มาก ซึ่งมอบสิทธิ์ปกครองเหนือ [neighboring_county_1.GetNameNoTier] และ [neighboring_county_2.GetNameNoTier] ให้แก่[ancestor_1.GetLadyLord]นามว่า [ancestor_1.GetFirstNameNoTooltip] [Select_CString(ancestor_1.IsFemale,'ผู้ดีงาม','ผู้โชคดี')] ด้วยการชี้นำของ[ROOT.GetCharacter.GetFaith.HighGodName] พวกข้าสามารถสืบเชื้อสายของท่านย้อนกลับไปถึง[ancestor_1.GetHerHim] และพวกข้ามั่นใจว่าได้บันทึกไว้ เช่นนั้นในพงศาวดาร ดินแดนใดดินแดนหนึ่งในนั้นจึงควรเป็นของท่านโดยชอบธรรม""
 commission_epic.6004.a:0 "ทำไมไม่ทั้งสองเลยล่ะ?"
 commission_epic.6004.b:0 "[neighboring_county_1.GetNameNoTierNoTooltip] เป็นส่วนหนึ่งของมรดกของข้าอย่างแน่นอน"
 commission_epic.6004.c:0 "ข้ารู้สึกเสมอว่า [neighboring_county_2.GetNameNoTierNoTooltip] ควรเป็นของข้า!"

 commission_epic.6005.t:0 "มหากาพย์ที่ยังไม่เสร็จ"
 commission_epic.6005.writerservant:0 ""ข้าสงสัยมานานแล้วว่ามีบางอย่างผิดปกติกับพงศาวดารของข้า และก็จริงดังคาด [composer.GetName] บัดนี้มาเข้าพบข้าด้วยท่าทางกังวล\n\n"[composer.GetSheHe] กล่าวว่า "อนิจจา [ROOT.Char.Custom('FormOfAddressForLiege')] แม้ข้าพเจ้าจะพยายามเพียงใด ข้าพเจ้าก็ไม่พบประวัติการอ้างสิทธิ์ใดที่ดีพอจะสนับสนุนได้ ข้าพเจ้าไม่สามารถทำงานนี้ต่อไปได้ ถึงกระนั้น ข้าพเจ้าก็ได้จัดทำพงศาวดารที่สรรเสริญคุณธรรมแห่งราชวงศ์ของท่าน โปรดพอใจกับสิ่งนี้ และอย่าได้ลงโทษข้าพเจ้าสำหรับความล้มเหลวเลย...""
 commission_epic.6005.scribes:0 "อาลักษณ์ของข้าดูเหมือนจะประสบปัญหากับพงศาวดารของข้า และแน่นอนว่า ตอนนี้พวกเขามาหาข้าด้วยท่าทางกังวล\n\n"อนิจจา" พวกเขากล่าว "เราไม่พบประวัติข้ออ้างสิทธิ์ที่ดีพอที่จะยืนยันได้ เราพยายามแล้ว แต่มันเกินความสามารถของเรา กระนั้นเราได้ผลิตพงศาวดารที่ยกย่องคุณธรรมของราชวงศ์ของท่าน โปรดพอใจกับสิ่งนี้ และอย่าลงโทษเราสำหรับความล้มเหลวของเรา...""
 commission_epic.6005.a:0 "ไปยังคุกใต้ดินกับเจ้า!"
 commission_epic.6005.b:0 "เจ้าพวกโง่เง่าไร้ความสามารถ..."
 commission_epic.6005.c:0 "นี่คือ [ROOT.GetCharacter.GetFaith.HighGodName] กำลังลงโทษข้าสำหรับความหยิ่งยโสของข้าหรือ?"
 commission_epic.6005.d:0 "อย่างน้อยข้าก็ได้พงศาวดาร..."

 commission_epic.6006.t:0 "โฆษณาชวนเชื่อที่ทรงพลัง"
 commission_epic.6006.writerservant:0 ""เสร็จแล้ว [ROOT.Char.GetLadyLord] ของข้า" [composer.GetName] กล่าวด้วยความโล่งใจ ยื่นหนังสือเล่มใหญ่ให้ข้า\n\n"นี่คือพงศาวดารของตระกูล [ROOT.Char.GetDynastyHouseNameNoTooltip] อธิบายรายละเอียดประวัติศาสตร์การปกครองดินแดนต่าง ๆ ที่ท่านปรารถนา แน่นอนว่าตอนนี้ไม่มีใครสามารถโต้แย้งการอ้างสิทธิ์อันชอบธรรมของท่านได้!""
 commission_epic.6006.scribes:0 "ในที่สุด อาลักษณ์ของข้าก็ได้ทำพงศาวดารโฆษณาชวนเชื่อเสร็จสิ้น พวกเขาดูโล่งใจขณะยื่นหนังสือเล่มใหญ่โตให้ข้า\n\n"นี่คือ [Select_CString(ROOT.Char.IsFemale,'นายหญิง','นายท่าน')] พงศาวดารอันยิ่งใหญ่ของตระกูล [ROOT.Char.GetDynastyHouseNameNoTooltip] อธิบายรายละเอียดเกี่ยวกับการอ้างสิทธิ์ทั้งหมดของท่าน ขอให้มันนำโชคลาภอันยิ่งใหญ่มาให้ท่าน""
 commission_epic.6006.a:0 "สมบูรณ์แบบ!"

 propaganda_chronicle_name:0 "พงศาวดารโฆษณาชวนเชื่อตระกูล [ROOT.Char.GetDynastyHouseNameNoTooltip]"
 propaganda_chronicle_desc:0 "หนังสือเล่มหนาหนักนี้อธิบายรายละเอียดอย่างเจ็บปวดเกี่ยวกับความรุ่งโรจน์ของตระกูล [ROOT.Char.GetDynastyHouseNameNoTooltip] และข้ออ้างสิทธิ์ในดินแดนต่างๆ ที่แปลกประหลาดมากหรือน้อยของตระกูล"
 
 half_baked_propaganda_chronicle_name:0 "พงศาวดารโฆษณาชวนเชื่อที่ยังไม่เสร็จ"
 half_baked_propaganda_chronicle_desc:0 "หนังสือเล่มนี้อาจมีชีวิตอยู่ในความอื้อฉาว หากมันเสร็จสมบูรณ์ ตามที่เป็นอยู่ มันล้มเหลวในการโน้มน้าวผู้อ่านเกี่ยวกับข้ออ้างสิทธิ์ในดินแดนที่ผู้อุปถัมภ์ต้องการ แต่กลับพรรณนาอย่างไพเราะเกี่ยวกับคุณธรรมที่กล่าวอ้างของราชวงศ์ [ROOT.Char.GetDynastyNameNoTooltip]"
 



 commission_epic.9001.t:0 "มหากาพย์ประจำตระกูล"
 commission_epic.9001.writer:1 "[ROOT.Char.Custom('CompositionType')] มหากาพย์ของตระกูลข้าเสร็จสมบูรณ์ในที่สุด และ [composer.GetTitledFirstName] มีเหตุผลที่จะภาคภูมิใจ!"
 commission_epic.9001.servant:0 "ดูเหมือนว่าข้าฉลาดในการเลือก [composer.GetTitledFirstName] ให้ประพันธ์ [ROOT.Char.Custom('CompositionType')] ของตระกูลข้า แม้จะมีอุปสรรคของ [composer.GetHerHis] แต่งานที่เสร็จสมบูรณ์ก็น่าประทับใจทีเดียว"
 commission_epic.9001.scribes:1 "[ROOT.Char.Custom('CompositionType')] มหากาพย์ของตระกูลข้าเสร็จสมบูรณ์ในที่สุด และ [ROOT.Char.Custom('CommissionEpicScribes')] ของข้ามีเหตุผลที่จะภาคภูมิใจ!"
 commission_epic.9001.conclusion:0 "\n\nบรรพบุรุษของข้ายืนหยัดเป็นแกนหลักในฐานะตัวอย่างอันเจิดจรัสของความหมายของการเป็นผู้ปกครองในยุคสมัยของเรา แม้ว่ามันจะยืดเยื้อในบางแห่ง และส่วนที่มี [ROOT.Char.Custom('CompositionDetail')] ก็ไร้สาระอย่างสิ้นเชิง ถึงกระนั้น ข้าก็ภูมิใจที่ได้เก็บสิ่งนี้ไว้ในห้องสมุดของตระกูลข้า เพื่อให้คนรุ่นหลังได้เพลิดเพลินและเรียนรู้"
 commission_epic.9001.a:0 "ประวัติศาสตร์ช่างเล่าเรื่องราวได้ดีเหลือเกิน"

 commission_epic.9002.t:0 "มหากาพย์อันยอดเยี่ยม"
 commission_epic.9002.writer:0 "[composer.GetTitledFirstName] ได้ประพันธ์มหากาพย์ประจำตระกูลของข้าเสร็จสิ้นแล้ว และช่างเป็น [ROOT.Char.Custom('CompositionType')] อันรุ่งโรจน์ที่ [composer.GetSheHe] ได้ประพันธ์ขึ้น!"
 commission_epic.9002.scribes:0 "[ROOT.Char.Custom('CommissionEpicScribes')] ของข้าได้ประพันธ์มหากาพย์ประจำตระกูลของข้าเสร็จสิ้นแล้ว และช่างเป็น [ROOT.Char.Custom('CompositionType')] อันรุ่งโรจน์ที่พวกเขาได้ประพันธ์ขึ้น!"
 commission_epic.9002.conclusion:0 "\n\nมันมีทั้งดราม่าเข้มข้น ปัญหาทางศีลธรรม และการดวลที่ตึงเครียด ทุกสิ่งที่ตระกูลของข้าถูกหล่อหลอมขึ้นมาอยู่ในนั้น! แม้ แต่ส่วนที่มี [ROOT.Char.Custom('CompositionDetail')] ซึ่งดูเหมือนห่างไกลความเป็นจริง ก็กลายเป็นช่วงเวลาที่น่าประทับใจ ซึ่งสรุปโชคชะตาของตระกูลข้า!"
 commission_epic.9002.a:0 "นี่อาจเป็น [ROOT.Char.Custom('CompositionType')] ที่ยิ่งใหญ่ที่สุดเท่าที่เคยเขียนมา!"

 commission_epic.9101.t:0 "มหากาพย์ประจำตระกูล: งานที่เสร็จสมบูรณ์"
 commission_epic.9101.desc:0 "หลังจากเวลาทั้งหมดที่ [composer.GetTitledFirstName] ใช้เวลาอยู่ที่ราชสำนักของข้า และความคุ้นเคยที่ [composer.GetSheHe] มีต่อข้า มันรู้สึกแปลกที่ [composer.GetSheHe] กำลังจะจากไป\n\n"ข้ามีที่อื่นที่ต้องไป และเรื่องราวอื่นที่ต้องเล่า" [composer.GetSheHe] พยายามอธิบาย"
 commission_epic.9101.a:0 "ข้าคิดว่านี่คือการอำลา"
 commission_epic.9101.b:0 "ยังมีอะไรอีกมากมายที่นี่สำหรับเจ้า!"
 commission_epic.9101.c:0 "ข้าก็ต้องการเจ้า เช่นกัน ที่นี่"
 commission_epic.9101.d:0 "ตราบใดที่เจ้าเขียนถึงข้า!"
