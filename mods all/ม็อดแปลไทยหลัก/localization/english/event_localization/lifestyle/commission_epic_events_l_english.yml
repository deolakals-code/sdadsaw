 commission_epic.0001.t:0 "มหากาพย์ประจำตระกูล"
 commission_epic.0001.desc:0 "สิ่งที่ข้าต้องการคือเรื่องราวคลาสสิกเกี่ยวกับความยิ่งใหญ่ของตระกูลข้า [ROOT.Char.Custom('CompositionType')] เกี่ยวกับต้นกำเนิดของราชวงศ์ [ROOT.Char.GetDynasty.GetBaseName] และวิธีที่เราถูกลิขิตมาเพื่อความยิ่งใหญ่!\n\nข้าเพียงต้องการใครสักคนที่รู้วิธีเล่าเรื่อง..."
 commission_epic.0001.a:1 "[writer.GetTitledFirstNameNoTooltip] นักเล่าเรื่องผู้เชี่ยวชาญ!"
 writer_writes_epic:0 "[writer.GetTitledFirstName] นักเล่าเรื่องประพันธ์มหากาพย์"
 commission_epic.0001.b:0 "ข้าจะรวบรวม [ROOT.Char.Custom('CommissionEpicScribes')] ที่ดีที่สุดของข้าบางส่วน"
