 commission_epic.2001.t:0 "มหากาพย์ประจำตระกูล: ความสำคัญก่อนหลัง"
 commission_epic.2001.desc_composer:0 "[steward.Custom2('MyCharacterIntroduction', ROOT.Char)|U] มาหาข้า ตื่นเต้นกับข่าว "ข้าได้ [ROOT.Char.Custom('CompositionTypeActionPP')] ส่วนล่าสุดของมหากาพย์ประจำตระกูลของท่าน และ [ROOT.Char.Custom2('CommissionEpicComposer', composer)] [ROOT.Char.Custom2('CommissionEpicComposerHasHave', composer )] ได้ค้นพบบางสิ่งที่น่าสนใจมาก!""
 commission_epic.2001.desc_scribes:0 "[steward.Custom2('MyCharacterIntroduction', ROOT.Char)|U] มาหาข้า ตื่นเต้นกับข่าว "ข้าได้ [ROOT.Char.Custom('CompositionTypeActionPP')] ส่วนล่าสุดของมหากาพย์ประจำตระกูลของท่าน และ [ROOT.Char.Custom('CommissionEpicComposer')] [ROOT.Char.Custom('CommissionEpicComposerHasHave')] ได้ค้นพบบางสิ่งที่น่าสนใจมาก!""
 commission_epic.2001.desc:1 "\n\nดูเหมือนว่า [county.GetName] ไม่เคยมีเจตนาให้อยู่ในมือของตระกูล [vassal.GetHouse.GetName] อย่างถาวร ข้าสามารถอ้างสิทธิ์อย่างสมเหตุสมผลต่อ [vassal.GetTitledFirstName] ได้!"
