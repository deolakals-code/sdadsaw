 commission_epic.0001.c:0 "แน่นอนว่า [servant.Custom('GenderedLowlyServantType')] ต่ำต้อยคนใดก็ทำได้?"
 servant_writes_epic:0 "[servant.GetTitledFirstName] คนรับใช้ประพันธ์มหากาพย์"
