# Learn to read, by Linnéa Thimrén
 learning_scholarship.1101.t:0 "ขาดการรู้หนังสือ"
 learning_scholarship.1101.desc:1 ""[ROOT.Char.Custom('FormOfAddressForLiege')|U] ข้าสังเกตเห็นว่าท่านอาจต้องการการชี้แนะในศิลปะแห่ง... การถอดความสาส์นที่เขียนขึ้น" [bishop.Custom2('MyCharacterIntroduction', ROOT.Char)] กล่าว พลางยื่นม้วนสาส์นให้ข้า\n\n"หากเป็นที่พอพระทัย/พอใจ [ROOT.Char.GetLadyLord] ของข้า ข้ายินดีที่จะสอนท่าน ข้ามีตำราที่สมบูรณ์แบบอยู่ที่นี่แล้ว""
 learning_scholarship.1101.a:0 "พ... พระราชา ทรง— ทรงมีมงกุฎใหญ่..."
 learning_scholarship.1101.b:0 "ข้าเป็นผู้อ่านที่เชี่ยวชาญ!"

# Automaton, by Linnéa Thimrén & Mathilda Bjarnehed
 learning_scholarship.1201.t:0 "นกขับขาน"
 learning_scholarship.1201.desc:0 "ขนนกโลหะแวววาว ดวงตาอัญมณีล้ำค่า เสียงร้องเพลงดังกังวานดุจเสียงระฆัง... นกกลที่[bird_sender.Custom2('MyCharacterIntroduction', ROOT.Char)]มอบให้ข้าเป็นผลงานชิ้นเอกอย่างแท้จริง!\n\n"นกตัวนี้สร้างขึ้นโดยช่างฝีมือที่เก่งกาจที่สุดใน[bird_sender.GetPrimaryTitle.GetNameNoTierNoTooltip]ทั้งหมด" จดหมายของ[bird_sender.GetTitledFirstNamePossessiveNoTooltip]อ่าน "ข้าคิดว่าท่านจะพบว่ามันน่าสนใจทีเดียว""
 learning_scholarship.1201.a:0 "ขายมันเสีย"
 learning_scholarship.1201.b:0 "นำไปจัดแสดง"
 learning_scholarship.1201.c:0 "แยกชิ้นส่วนและศึกษากลไกของมัน"
 learning_scholarship.1201.c.success:0 "[bird_sender.GetTitledFirstNameNoTooltip] เป็น[bird_sender.GetWomanMan]ผู้คงแก่เรียน"
 learning_scholarship.1201.c.failure:0 "[bird_sender.GetTitledFirstNameNoTooltip] รู้สึกถูกดูหมิ่น"

# Acquire a reading stone, by Linnéa Thimrén
 learning_scholarship.1401.t:0 "ศิลาแก้ว"
 learning_scholarship.1401.desc:0 "ขณะที่ข้าพยายามอ่านตัวอักษรเล็กๆ บนม้วนสารตรงหน้า ข้ารู้สึกปวดหัวขึ้นมาอีกครั้ง เหตุใดพวกอาลักษณ์จึงยืนกรานที่จะเขียนสัญลักษณ์เล็กๆ เช่นนี้?!\n\nข้าหรี่ตาและพยายามอีกครั้ง\n\n"...ไม่มีสิ่งใดนอกจากปาฏิหาริย์ ด้วยความช่วยเหลือของศิลาแก้ว แม้ แต่[ROOT.Char.GetWomenMen]ชราที่ประสบปัญหาสายตาไม่ดีก็สามารถอ่านได้อย่างง่ายดาย""
 learning_scholarship.1401.a:1 "ข้าต้องการศิลาเหล่านี้สักอัน!"
 learning_scholarship.1401.b:0 "ขายทุกสิ่งที่อ่านไม่ได้"
 learning_scholarship.1401.c:0 "[bishop.GetTitledFirstNameNoTooltip] ข้าต้องการความช่วยเหลือจากท่าน!"
 
 # Scientific Experiments, by Petter Vilberg
 learning_scholarship.3001.t:0 "นิมิตแห่งสวรรค์"
 learning_scholarship.3001.desc:0 "ข้ากวักมือเรียก[ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('chaplain'))]ของข้า [chaplain.GetTitledFirstName] ให้มาร่วมกับข้าในวงกลมของลูกโลกทองเหลืองและเทียนที่จัดเรียงบนไม้เท้าทั่วห้องมืด กลิ่นธูปที่คละคลุ้งในอากาศเพื่อปัดเป่าไอระเหยที่ไม่ดี ทำให้ตาของเราน้ำตาไหลในเวลาไม่นาน "นี่คือวิธีที่เราจะมองเห็นรูปลักษณ์อันยากจะหยั่งถึงของทูตสวรรค์ผ่านหางตาของเรา"\n\nอย่างไรก็ตาม [chaplain.GetFirstNameNoTooltip] หยุดชะงักในไม่ช้า "นี่รู้สึกผิด นี่คือสิ่งมีชีวิตจากสวรรค์ ไม่ได้มีไว้ให้สายตาปุถุชนมองเห็น""
 learning_scholarship.3001.a:0 "ท่านไปได้ แต่ไม่ว่าจะด้วยวิธีใด ข้าจะต้องรู้ให้ได้"
 learning_scholarship.3001.b:0 "ใช่ นี่เป็นเรื่องโง่เขลา หากไม่ใช่บาปในตัวเอง"
 learning_scholarship.3001.c:0 "เจตนาของข้าบริสุทธิ์ ข้ารับรองท่าน!"
 learning_scholarship.3001.c.tt1:0 "ข้าโน้มน้าวให้ [chaplain.GetFirstName] ช่วยเหลือข้า"
 learning_scholarship.3001.c.toast.tt1:0 "[chaplain.GetFirstName] ถูกโน้มน้าวโดยคำวิงวอนของข้า"
 learning_scholarship.3001.c.tt2:0 "ข้าไม่สามารถโน้มน้าว [chaplain.GetFirstName] ได้"
 learning_scholarship.3001.c.toast.tt2:0 "[chaplain.GetFirstName] ปฏิเสธเหตุผลของข้า"

# Translate a Great Work, by Petter Vilberg
#story cycle loc
 book_translation_story: "แปลผลงานชิ้นเอก"
 book_translation_story_desc: "การแปลผลงานชิ้นเอกจะช่วยให้ผู้อื่นได้รับประโยชน์จากภูมิปัญญาของมัน การบรรลุความสำเร็จทางปัญญาอันทะเยอทะยานนี้จะเป็นสิ่งสะท้อนถึงความปราดเปรื่องอันเจิดจรัสของท่าน ทว่าหากล้มเหลว ท่านก็จะถูกตราหน้าว่าเป็นคนโง่เขลา"
 TRANSLATION_STORY: "ท่านกำลังแปล [Story.GetOwner.Custom('TranslationBookLong')]"
 TRANSLATION_QUALITY: "คุณภาพงานแปล"
 POOR_TRANSLATION: "แย่"
 EXCELLENT_TRANSLATION: "ยอดเยี่ยม"
 DURATION_LEFT: "ระยะเวลาที่เหลืออยู่"
 PROGRESS_TOWARDS_CYNICISM: "ความคืบหน้าสู่ความเย้ยหยันศาสนา"
 CYNICISM: "เย้ยหยันศาสนา"
 ZEALOTRY: "คลั่งศาสนา"
#event loc
 learning_scholarship_special.2001.t:0 "การแปลครั้งใหม่"
 learning_scholarship_special.2001.desc:0 "เหนือสิ่งอื่นใด การแสวงหาของข้าเพื่อเป็น[ROOT.Char.GetWomanMan]ผู้คงแก่เรียนกำลังสอนข้าว่าข้ายังไม่รู้อะไรอีกมากเพียงใด ยิ่งไปกว่านั้น ต้องมีความรู้มากมายที่สูญหายไปตามกาลเวลา เนื่องจากหนังสือผุพังหรือภาษาถูกลืมเลือน...\n\nบางทีข้าอาจจะมีส่วนร่วมโดยการแปลผลงานคลาสสิกชิ้นหนึ่งขึ้นมาใหม่?\n\nถึงกระนั้น ข้าจะแปลอะไรดี...?"
 learning_scholarship_special.2001.regula_pastoralis:0 "เรอกูลา ปาสโตราลิส ว่าด้วยการดำเนินชีวิตที่ดี"
 learning_scholarship_special.2001.physica_elementa:0 "วิทยาศาสตร์คลาสสิก — ฟิสิกาของอริสโตเติล!"
 learning_scholarship_special.2001.almagest:0 "การศึกษาท้องฟ้าผ่านอัลมาเกสต์ของปโตเลมี"
 learning_scholarship_special.2001.elements:0 "เอเลเมนต์ส ตำราคณิตศาสตร์ของยุคลิด!"
 learning_scholarship_special.2001.corpus_hermeticus:0 "ความรู้ลึกลับของคอร์ปุส เฮอร์เมติคุส!"
 learning_scholarship_special.2001.treatises_of_hippocrates:0 "ข้อมูลเชิงลึกทางการแพทย์จากตำราของฮิปโปเครตีส"
 learning_scholarship_special.2001.peri_psyches:0 "เพริ ไซคีส อันโด่งดังของอริสโตเติล!"
 learning_scholarship_special.2001.kategoriai:0 "คาเทโกริไอ การจำแนกประเภทของประธานและภาคแสดงทั้งหมด"
 learning_scholarship_special.2001.avesta:0 "คัมภีร์ศักดิ์สิทธิ์เปอร์เซียโบราณ อเวสตา"
 learning_scholarship_special.2001.de_oratore:0 "บทเรียนวาทศิลป์ของซิเซโรจาก เด โอราโตเร!"
 learning_scholarship_special.2001.book_of_arda_viraf:0 "การเดินทางในฝันจากคัมภีร์อาร์ดา วิราฟ"
 learning_scholarship_special.2001.upanishads:0 "คัมภีร์พระเวทที่โด่งดังที่สุด อุปนิษัท!"
 learning_scholarship_special.2001.rigveda:0 "บทสวดทางศาสนาของฤคเวท"
 learning_scholarship_special.2001.book_of_balances:0 "คัมภีร์ย่อว่าด้วยการคำนวณ"
 learning_scholarship_special.2001.secret_of_secrets:0 "ความลับแห่งความลับที่มอบให้อเล็กซานเดอร์"
 learning_scholarship_special.2001.court_of_agriculture:0 "ตำราเกษตรศาสตร์"
 learning_scholarship_special.2001.lanterns_of_wisdom:0 "คำแนะนำเกี่ยวกับการเล่นแร่แปรธาตุในโคมไฟแห่งปัญญา"
 learning_scholarship_special.2001.shahnameh:0 "บทกวีประวัติศาสตร์เปอร์เซีย ชาห์นาเมห์"
 learning_scholarship_special.2001.arithmetica:0 "อาริธเมติกาและอรรถกถาของไดโอแฟนตัส"
 learning_scholarship_special.2001.pali_canon:0 "ข้อความจากพระไตรปิฎกบาลี"
 learning_scholarship_special.2001.the_norse_sagas:0 "หนึ่งในตำนานนอร์ส!"
 learning_scholarship_special.2001.family_history:0 "เรื่องส่วนตัว — ประวัติครอบครัวของข้า"
 learning_scholarship_special.2001.ancient_myths:0 "เรื่องยิ่งใหญ่ — หนึ่งในตำนานโบราณ!"
 learning_scholarship_special.2001.decline:0 "นี่ฟังดูยากเกินไป"

