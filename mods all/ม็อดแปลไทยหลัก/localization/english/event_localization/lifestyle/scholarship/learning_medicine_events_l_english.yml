l_english: 

# Become a herbalist, by Mathilda Bjarnehed
 learning_medicine.2001.t:0 "ความลับแห่งธรรมชาติ"
 learning_medicine.2001.pool.desc:0 "ข้าได้รับข้อเสนอจาก [herbalist.Custom2('MyCharacterIntroductionNoComma', ROOT.Char)] หากเชื่อตามจดหมาย [herbalist.GetSheHe] เป็นหมอยาผู้มีประสบการณ์ ซึ่งยินดีจะแบ่งปันความรู้ของ [herbalist.GetHerHis] เพื่อแลกกับ [ROOT.Char.Custom('GetRoom')] และอาหาร"
 learning_medicine.2001.no_pool.desc:0 "[herbalist.Custom2('MyCharacterIntroductionNoComma', ROOT.Char)|U] เป็นหมอยาผู้ชำนาญ รอบรู้เรื่องพืชสมุนไพรทั้งที่ใช้รักษาและเป็นพิษ [herbalist.GetSheHe] ได้เสนอที่จะแบ่งปันความเชี่ยวชาญของ [herbalist.GetHerHis] แก่ข้ามากกว่าหนึ่งครั้ง"
 learning_medicine.2001.chaplain_hates_herbs.desc:1 "\n\nข้อเสนอนี้น่าสนใจ แต่ข้ารู้ว่า [chaplain_hates_herbs.GetCouncilTitle] [chaplain_hates_herbs.GetFirstName] ไม่ไว้วางใจเครื่องรางและยาปรุง [chaplain_hates_herbs.GetSheHe|U] เชื่อว่า [ROOT.Char.GetFaith.DevilName] ใช้สิ่งเหล่านี้เพื่อจุดประสงค์อันชั่วร้ายของ [ROOT.Char.GetFaith.DevilHerHis]... "

 learning_medicine.2001.a:0 "ข้ากระตือรือร้นที่จะเรียนรู้สิ่งใหม่อยู่เสมอ"
 learning_medicine.2001.b:0 "ดอกไม้หายากคงจะ ทำให้วันของ [flower_receiver.GetFirstNamePossessiveNoTooltip] สดใสขึ้น"
 learning_medicine.2001.c:0 "[herbalist.GetSheHe|U] สามารถปลูกสวนสมุนไพรศักดิ์สิทธิ์ได้"
 learning_medicine.2001.d:1 "ข้าไม่มีเวลามาคลุกคลีกับดินและต้นไม้"
 learning_medicine.2001.d.chaplain_hates_herbs:0 "ข้าเชื่อมั่นในวิจารณญาณของ [chaplain_hates_herbs.GetCouncilTitle] [chaplain_hates_herbs.GetNamePossessiveNoTooltip] ในเรื่องนี้"

 learning_medicine.2002.start.desc:0 "[herbalist.GetFirstName] และข้ากำลังใช้เวลาค่ำคืนอันยาวนานอีกครั้งในการจำแนกประเภทพืชและปรุงยา ข้ากำลังพลิกดูตำราเก่าคร่ำคร่าเล่มหนึ่งของ [herbalist.GetHerHis] เมื่อข้าค้นพบ"
 learning_medicine.2002.chaplain_hates_herbs.desc:0 "ย่อหน้าที่คงจะ ทำให้ [chaplain_hates_herbs.GetCouncilTitle] [chaplain_hates_herbs.GetFirstName] ต้องฟูมฟาย!"
 learning_medicine.2002.not_witchcraft_accepted.desc:0 "ย่อหน้าที่คงจะ ทำให้ [ROOT.Char.Custom('DefaultPriestTitlePlural')] ต้องฟูมฟาย!"
 learning_medicine.2002.witchcraft_accepted.desc:0 "สูตรยาที่น่าสนใจยิ่ง ข้าไม่เคยรู้มาก่อนว่าเพียงสมุนไพรจะมีพลัง เช่นนี้..."
 learning_medicine.2002.a:0 "ข้าต้องเจาะลึกลงไปในความรู้ที่ซ่อนเร้นนี้!"
 learning_medicine.2002.a.success.t:0 "[herbalist.GetFirstNameNoTooltip] เป็นแม่มด/พ่อมด"
 learning_medicine.2002.a.failure.t:0 "[herbalist.GetFirstNameNoTooltip] ตกใจกับการกล่าวหาของข้า"
 learning_medicine.2002.b:0 "หาก [herbalist.GetSheHe] กำลังเก็บงำความลับ ข้าจะค้นพบมัน"
 learning_medicine.2002.b.success.t:0 "ข้าค้นพบความจริงเกี่ยวกับ [herbalist.GetFirstNameNoTooltip]"
 learning_medicine.2002.b.success.tt:0 "หาก [herbalist.GetShortUIName] มีความลับเรื่องเวทมนตร์ มันจะถูกเปิดเผยแก่ข้า"
 learning_medicine.2002.b.success.witch.t:0 "[herbalist.GetFirstNameNoTooltip] เป็นแม่มด/พ่อมด"
 learning_medicine.2002.b.success.no_witch.t:0 "[herbalist.GetFirstNameNoTooltip] ไม่ใช่แม่มด/พ่อมด"
 learning_medicine.2002.b.success.no_witch.desc:1 "ข้ามั่นใจในความบริสุทธิ์ของ [herbalist.GetTitledFirstNamePossessive]"
 learning_medicine.2002.b.inconclusive.t:0 "การสืบสวนของข้ายังไม่สามารถสรุปได้"
 learning_medicine.2002.b.inconclusive.desc:0 "ข้าไม่พบหลักฐานการใช้เวทมนตร์"
 learning_medicine.2002.b.failure.t:0 "[herbalist.GetFirstNameNoTooltip] จับได้ว่าข้ากำลังสอดแนม"
 learning_medicine.2002.c:0 "ข้าจะไม่ยอมให้เรื่องปรัมปราและข่าวลือมา ทำให้ไขว้เขว"

 learning_medicine.2003.desc:0 ""นี่คือสิ่งที่ข้าปรารถนาจะเรียนรู้" ข้ากล่าวขณะยื่นตำราให้ [herbalist.GetFirstName] "ท่านจะสอนข้าหรือไม่?"\n\n[herbalist.GetSheHe|U] จ้องมองข้าอย่างพิจารณา "ท่านพร้อมแล้วหรือ [ROOT.Char.GetFirstNameNoTooltip]? ท่านจะอุทิศตนแด่ [herbalist.GetFaith.WitchGodName] เพื่อแลกกับพรของ [herbalist.GetFaith.WitchGodHerHis|U] หรือไม่?""
 learning_medicine.2003.a:0 "ไม่มีสิ่งใดที่ข้าปรารถนามากไปกว่านี้อีกแล้ว"

# Improve the skills of your court physician, by Mathilda Bjarnehed
 learning_medicine.2010.t:0 "การแปลที่น่าหนักใจ"
 learning_medicine.2010.start.desc:0 "ขณะที่ข้าก้าวข้ามธรณีประตูเข้าไปในห้องทำงานของ [court_physician.GetFirstNamePossessive] [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('court_physician'))] ของข้า ข้าพบ [court_physician.GetHerHim] กำลังก้มหน้าก้มตาอยู่กับหนังสือเล่มหนึ่ง\n\n"คำแปลของ"
 learning_medicine.2010.galen.desc:0 "กาเลน"
 learning_medicine.2010.hippocrates.desc:0 "ฮิปโปเครตีส"
 learning_medicine.2010.herophilus.desc:0 "เฮโรฟิลุส"
 learning_medicine.2010.hildegard.desc:0 "ฮิลเดการ์ดแห่งบิงเงน"
 learning_medicine.2010.mundinus.desc:0 "มุนดินุส"
 learning_medicine.2010.avicenna.desc:0 "อาวิเซนนา"
 learning_medicine.2010.trota.desc:0 "โตรตาแห่งซาเลอร์โน"
 learning_medicine.2010.sun_simiao.desc: "ซุนซือเหมี่ยว"
 learning_medicine.2010.zhan_zhongjing.desc: "จางจ้งจิ่ง"
 learning_medicine.2010.hua_tuo.desc: "ฮัวโต๋"
 learning_medicine.2010.tamba_yasuyori.desc: "ทัมบะ ยาสุโยริ"
 learning_medicine.2010.bianque.desc: "[Glossary( 'เปี่ยนเชวี่ย', 'BIAN_QUE_GLOSS' )]"
 learning_medicine.2010.fallback.desc:0 "รายงานการชันสูตรศพ"
 learning_medicine.2010.end.desc:0 "นี้ช่างเลวร้ายนัก" [court_physician.GetSheHe] กล่าวพร้อมถอนหายใจ "หากข้าทำตามคำแนะนำเหล่านี้ ข้าอาจจะรักษาคนไข้ได้พอๆ กับฆ่าพวกเขาให้ตายทันที""

 learning_medicine.2010.a:0 "ให้ข้าดูหน่อย..."
 learning_medicine.2010.a.success.desc:0 "ข้าช่วย [court_physician.GetFirstNameNoTooltip] แปลข้อความ"
 learning_medicine.2010.a.failure.desc:0 "ข้าทำตัวเองขายหน้า"
 learning_medicine.2010.b:0 "ข้าจะซื้อฉบับแปลที่ดีกว่าให้ท่าน"
 learning_medicine.2010.c:0 "ท่านควรหาคำแนะนำจาก [ROOT.Char.GetFaith.ReligiousText]"

 # Fertility treatment, by Mathilda Bjarnehed
 learning_medicine.2021.t:0 "แด่ [ROOT.Char.GetTitledFirstNameNoTooltip] ผู้ [ROOT.Char.Custom('FormalComplimentAdjective')]"
 learning_medicine.2021.desc:0 "นามของข้าคือ [physician.GetTitledFirstNameNoTooltip] และข้าเป็นแพทย์ผู้ผ่านการฝึกฝน เชี่ยวชาญด้านปัญหาการมีบุตร บางทีคำปรึกษาอย่างรอบคอบของข้าอาจเป็นประโยชน์ต่อ [ROOT.Char.GetLadyLord] ของข้า? ข้าจะรู้สึกเป็นเกียรติอย่างยิ่งที่ได้รับใช้ — โดยมีค่าธรรมเนียมเล็กน้อย"
 learning_medicine.2021.a:0 "ข้าอาจต้องการความช่วยเหลือจากท่าน..."
 learning_medicine.2021.a.tt:0 "ท่านยอมรับการรักษาภาวะเจริญพันธุ์"
 learning_medicine.2021.b:0 "[physician.GetWomanMan] ทางการแพทย์ที่ผ่านการฝึกฝนย่อมเป็นที่ต้อนรับเสมอ"
 learning_medicine.2021.b.tt:0 "ท่านปฏิเสธการรักษาภาวะมีบุตรยาก"
 learning_medicine.2021.c:0 "ข้าไม่มีปัญหา #EMP เช่นนั้น!!#!"

 learning_medicine.2022.t:0 "ปัญหาการมีบุตร"
 learning_medicine.2022.old_physician.desc:0 "ข้าเคยเห็น [physician.GetTitledFirstName] รับมือกับทุกสิ่งตั้งแต่ปลิงไปจนถึงศพเน่าเปื่อย แต่ความอึดอัดบนใบหน้าของ [physician.GetHerHis] เป็นสิ่งใหม่โดยสิ้นเชิง\n\n"ในฐานะแพทย์ของท่าน ข้าคือผู้พิทักษ์สุขภาพของท่าน" [physician.GetSheHe] กล่าว พลางจ้องมองรองเท้าของ [physician.GetHerHis] "นั่น รวมถึงสุขภาพ... #EMP ด้านการสืบพันธุ์#! ของท่านด้วย ข้าสามารถปรุงยาที่อาจช่วยท่านและ [spouse.Custom('WifeHusband')] ของท่านได้ ข้ายังได้อ่านเกี่ยวกับการรักษาเชิงทดลองบางอย่างที่ให้ผลลัพธ์น่าพอใจ""
 learning_medicine.2022.new_physician.desc:0 "ข้าตั้งใจจะให้เวลาแพทย์หลวงคนใหม่ของข้าได้ปรับตัวเสียหน่อย แต่เพียงไม่กี่ชั่วยามหลังการมาถึงของ[physician.GetHerHis] [physician.GetFirstName] ก็พรวดพราดเข้ามาในห้องทำงานของข้าพร้อมกับหีบใบใหญ่ [physician.GetSheHe|U] เหวี่ยงมันวางลงบนโต๊ะของข้าพร้อมเสียง #EMP ดังปัง#! ที่น่าตกใจ\n\n"ท่านและ[spouse.Custom('WifeHusband')]ของท่านมีทางเลือกอยู่หลายประการ [ROOT.Char.Custom('FormOfAddressForLiege')] มียาหมักที่ผ่านการพิสูจน์และเชื่อถือได้ — แต่ข้าก็มีการรักษาเชิงทดลองบางอย่างที่กำลังพัฒนาอยู่ เช่นกัน""
 learning_medicine.2022.b:0 "ยาปรุงง่ายๆ ดูสมเหตุสมผล"
 learning_medicine.2022.b.success:0 "การรักษาประสบความสำเร็จ"
 learning_medicine.2022.b.failure:0 "การรักษาไม่ประสบความสำเร็จ"
 learning_medicine.2022.a:0 "อนาคตของอาณาจักรเป็นเดิมพัน! ข้าจะลองทุกอย่าง!"
 learning_medicine.2022.a.success:0 "การรักษาประสบความสำเร็จอย่างยิ่ง"
 learning_medicine.2022.a.unexpected:0 "การรักษามีผลข้างเคียงที่แปลกประหลาด"
 learning_medicine.2022.a.failure:0 "การรักษามีผลข้างเคียงที่ไม่ดี"
 learning_medicine.2022.c:0 "อันที่จริงข้าแค่ต้องการ... คำแนะนำ"
 learning_medicine.2022.a.unexpected.tt:0 "อาจมีบางสิ่งที่คาดไม่ถึงเกิดขึ้น"

 learning_medicine.2023.urine.desc:0 ""ร่างกายของท่านทั้งสองไม่สอดประสานกัน [ROOT.Char.Custom('FormOfAddressForLiege')] แต่ข้ามีวิธีแก้ไข ท่านต้องดื่มปัสสาวะของ[spouse.Custom('WifeHusbandPossessive')] และ[spouse.GetSheHe]ก็ต้องดื่มของท่าน ทุกคืนก่อนนอน เป็นเวลาหนึ่งสัปดาห์ แล้วพลังของท่านทั้งสองจะต้องสอดคล้องกันอย่างแน่นอน!"\n\nมันช่างเป็นสัปดาห์ที่ยาวนานนัก"
 learning_medicine.2023.unpleasant_end.desc:0 "\n\nแม้ว่าการรักษาจะไม่น่าพึงพอใจนัก"
 learning_medicine.2023.pig_testicles.desc:0 ""ข้าได้หมูตัวผู้ที่แข็งแรงที่สุดใน [location.GetNameNoTooltip] ทั้งหมดมา และนำอัณฑะของมันไปตากแห้งและบดเป็นผง ดื่มผสมกับไวน์เป็นเวลาสองสัปดาห์ แล้วภาวะเจริญพันธุ์ของท่านจะเพิ่มขึ้นสิบเท่า!""
 learning_medicine.2023.pig_testicles_end.desc:0 "\n\nแม้ว่าผงจะ ทำให้ไวน์มีรสเหม็นอับ แต่โดยรวมแล้วมันเป็นประสบการณ์ที่น่าประหลาดใจ"
 learning_medicine.2023.udder.desc:0 ""นมให้ชีวิต ดังนั้นเราต้องไปที่แหล่งกำเนิดของมัน พ่อครัวจะทำสตูว์เต้านมวัวให้ท่านทั้งสอง กิน แต่อย่างอื่นไม่ได้เป็นเวลาหนึ่งสัปดาห์ แล้วท่านจะได้รับรางวัลอย่างแน่นอน"\n\nมันเป็นสัปดาห์ที่ยาวนาน"
 learning_medicine.2023.female_orgasm.start.desc:0 ""อย่างที่ท่านอาจทราบ ความสุขสมของผู้หญิงมีความสำคัญพอๆ กับของผู้ชาย""
 learning_medicine.2023.female_orgasm.female.desc:1 "เมล็ดพันธุ์ของท่านต้องพุ่งออกมาผสมกับของ [spouse.Custom('WifeHusbandPossessive')] [spouse.GetSheHe|U] ควรอ่านตำราเล่มนี้เกี่ยวกับเทคนิคสำหรับ [ROOT.Char.Custom('GetChamber')]"\n\nข้าไม่สามารถหวังการรักษาที่ดีกว่านี้ได้อีกแล้ว\n\n"
 learning_medicine.2023.female_orgasm.male.desc:0 "ท่านต้อง ทำให้เมล็ดพันธุ์ของ [spouse.Custom('WifeHusbandPossessive')] พุ่งออกมา เพื่อให้มันผสมกับของท่านเอง ท่านควรอ่านตำราเล่มนี้เกี่ยวกับเทคนิคสำหรับ [ROOT.Char.Custom('GetChamber')]"\n\nต้องใช้ความพยายามอย่างมากในการฝึกฝนวิธีการที่ไม่คุ้นเคย แต่ข้าก็ทำได้สำเร็จ — อย่างน้อยก็ถ้าปฏิกิริยาของ [spouse.GetFirstNamePossessive] เป็นเครื่องบ่งชี้!\n\n"
 learning_medicine.2023.milk_bath.desc:0 ""นมทุกชนิดให้ชีวิต และนมแพะมีฤทธิ์แรงเป็นพิเศษ เมื่อใดก็ตามที่ท่านและ [spouse.Custom('WifeHusband')] พยายามตั้งครรภ์ ท่านควรอาบน้ำนมแพะก่อน ท่านอาจจะลองทำในอ่างอาบน้ำก็ได้!""
 learning_medicine.2023.milk_bath_end.desc:0 "\n\nแม้ว่านมจะมี #EMP กลิ่น#! ที่ชัดเจน"
 learning_medicine.2023.end.desc:0 "[physician.GetFirstNameNoTooltip] มองผลลัพธ์ในแง่บวกมาก และข้ารู้สึกยอดเยี่ยม! [physician.GetSheHe|U] บอกให้เราอดทน แต่ข้าคิดว่าเราสามารถคาดหวังสมาชิกครอบครัวใหม่ได้ในไม่ช้า"
 learning_medicine.2023.a:0 "เราไปที่ [ROOT.Char.Custom('GetChamber')] ของข้ากันเถอะ [spouse.GetFirstNameNoTooltip]..."

 learning_medicine.2024.end.desc:0 "\n\nแม้ว่าข้าจะทำตามคำแนะนำของ [physician.GetFirstNamePossessive] ทุกประการ และ [physician.GetSheHe] บอกให้ข้าอดทน แต่ความกังวลของข้าก็รุนแรง ข้ารู้สึกคลื่นไส้และหน้ามืด และ [spouse.GetFirstName] ก็ล้มป่วยอยู่บนเตียงมาสามวันแล้ว"
 learning_medicine.2024.a:0 "ข้าแค่อยากพักผ่อน..."
 learning_medicine.2024.b:0 "ทหาร! จับกุมไอ้หมอเถื่อนนี่!"

 learning_medicine.2025.start.desc:0 ""[ROOT.Char.Custom('FormOfAddressForLiege')|U] ข้ามีข่าวดีมาแจ้ง! แม้จะยังเร็วไปนัก แต่[spouse.Custom('WifeHusband')]ของท่านแสดงสัญญาณทั้งปวงของการตั้งครรภ์!"\n\nในคราแรก ความยินดีและโล่งใจก็ถาโถมเข้าใส่ข้า แต่ความสับสนก็ติดตามมาอย่างรวดเร็ว "แต่ท่านยังมิได้ทำการรักษาเลยนี่ [physician.GetFirstName]" ข้ากล่าวอย่างเจาะจง\n\n"
 learning_medicine.2025.fertilitygod.desc:0 ""[physician.GetFaith.FertilityGodName]""
 learning_medicine.2025.the_universe.desc:0 ""จักรวาล""
 learning_medicine.2025.end.desc:0 "ชะตาลิขิตนั้นดำเนินไปในวิถีอันลึกลับ [ROOT.Char.Custom('FormOfAddressForLiege')] บางครั้งการน้อมรับพรที่ท่านได้รับย่อมดีกว่าการพยายามอธิบายที่มาของมัน""
 learning_medicine.2025.b:0 "คำพูดที่ชาญฉลาด!"
 learning_medicine.2025.a:0 "[spouse.GetFirstNameNoTooltip] เราต้องคุยกัน เป็นการส่วนตัว"
 learning_medicine.2025.a.tt:0 "ข้าเผชิญหน้ากับ [spouse.GetShortUIName]"

 #Healthy coping mechanism: becoming a confider
 learning_medicine.2030.t:0 "มงกุฎอันหนักอึ้ง"
 learning_medicine.2030.desc:0 "บางครั้ง ความรับผิดชอบของข้าในฐานะ [ROOT.Char.GetTitleAsNameNoTooltip] ก็รู้สึกท่วมท้นอย่างยิ่ง [ROOT.Char.GetWomanMan] คนเดียวจะแบกรับ [ROOT.Char.GetPrimaryTitle.GetNameNoTierNoTooltip] ทั้งหมดไว้บนบ่าของ [ROOT.Char.GetHerHis] ได้อย่างไร?\n\nบางทีอาจมีภาระบางอย่างที่ข้าไม่ต้องแบกรับเพียงลำพัง หากเพียง แต่ข้ามีใครสักคนที่จะไว้วางใจ..."
 learning_medicine.2030.a:0 "คำแนะนำของ [confider_target.GetFirstNamePossessiveNoTooltip] ช่วยปลอบประโลมเสมอ"
 learning_medicine.2030.a.message:0 "การไว้วางใจช่วยคลายความเครียดของข้า"
 learning_medicine.2030.b:0 "[confider_target_2.GetFirstNameNoTooltip] เป็นผู้ฟังที่ดีเหลือเกิน"
 learning_medicine.2030.c:0 "เราสามารถปกป้องความลับดำมืดของกันและกันได้"
 learning_medicine.2030.d:0 "การพึ่งพาผู้อื่นจะ ทำให้ข้าอ่อนแอลงเท่านั้น"
 learning_medicine.2030.c.tt:0 "หาก [confider_target.GetShortUIName] มี [secret|E] [confider_target.GetSheHe] จะเปิดเผยให้ข้าทราบ"
 learning_medicine.2030.c.message:0 "[confider_target.GetFirstNameNoTooltip] เปิดเผยความลับ"

 #Healthy coping mechanism: journaller or athletic, by Mathilda Bjarnehed
 learning_medicine.2040.t:0 "จิตใจและร่างกาย"
 learning_medicine.2040.start.desc:0 "ยิ่งข้าศึกษาลึกลงไปมากเท่าไหร่ ความเชื่อมโยงระหว่างจิตใจและร่างกายก็ยิ่งชัดเจนมากขึ้นเท่านั้น ความกังวลที่มากเกินไปอาจ ทำให้ท่านป่วยได้ และจิตใจก็ไม่แข็งแกร่งไปกว่าภาชนะของมัน!\n\n"
 learning_medicine.2040.athletic_friend.desc:0 "เพื่อนผู้ชาญฉลาดของข้า [friend.GetTitledFirstName] สาบานว่าการเคลื่อนไหวอย่างกระฉับกระเฉงช่วยให้ [friend.GetHerHim] ควบคุมความเครียดของ [friend.GetHerHim] ได้ ข้ายังได้อ่านเกี่ยวกับประโยชน์ของการจดบันทึกเพื่อบรรเทาความวิตกกังวลด้วย"
 learning_medicine.2040.journaller_friend.desc:0 "สหายผู้ชาญฉลาดของข้า [friend.GetTitledFirstName] จดบันทึกเกี่ยวกับความกังวลของ [friend.GetHerHis] และสาบานว่ามันช่วยให้จิตใจของ [friend.GetHerHis] สงบลง ข้ายังได้อ่านเกี่ยวกับประโยชน์ของการเคลื่อนไหวอย่างแข็งขันเพื่อบรรเทาความตึงเครียด"
 learning_medicine.2040.no_friend.desc:0 "ข้าต้องการทางออกที่ดีต่อสุขภาพเพื่อรับมือกับความเครียดจากการปกครอง ข้าได้อ่านเกี่ยวกับประโยชน์ของการเคลื่อนไหวอย่างแข็งขัน เช่นเดียวกับการจดบันทึกเพื่อบรรเทาความตึงเครียด"
 learning_medicine.2040.a:0 "ออกกำลังกายร่วมกับ [friend.GetFirstNameNoTooltip]"
 learning_medicine.2040.b:0 "ขอคำแนะนำในการจดบันทึกจาก [friend.GetFirstNameNoTooltip]"
 learning_medicine.2040.c:0 "ออกไปวิ่ง"
 learning_medicine.2030.c.trait:0 "การออกกำลังกาย ทำให้ข้าสงบลง"
 learning_medicine.2030.c.modifier:0 "ข้าไม่รู้สึกผ่อนคลาย แต่แข็งแรงขึ้น"
 learning_medicine.2040.d:0 "ใช้เวลาช่วงบ่ายจดบันทึก"
 learning_medicine.2030.d.trait:0 "การจดบันทึก ทำให้ข้าสงบลง"
 learning_medicine.2030.d.modifier:0 "ข้าไม่รู้สึกผ่อนคลาย แต่การเขียนของข้าดีขึ้น"
 learning_medicine.2040.e:0 "หยุดพักทั้งวัน"

 #Helping healing hand (medicine friend), by Mathilda Bjarnehed
 learning_medicine.2050.t:0 "เลือดไหลไม่หยุด"
 learning_medicine.2050.start.desc:0 "ข้ากำลังตรวจโรงพยาบาลสนามใน [Select_CString(IsLandlessAdventurer(ROOT.Char),'camps','barracks')] เมื่อทหารบาดเจ็บสาหัสถูกนำเข้ามา "[soldier.GetSheHe|U] เสียเลือดมากเกินไป! หมอหลวงอยู่ที่ไหน?!"\n\n"
 learning_medicine.2050.physician.desc:0 "ไม่พบ [physician.GetTitledFirstName] ที่ไหนเลย"
 learning_medicine.2050.no_physician.desc:0 "ไม่พบผู้รักษาที่ไหนเลย"
 learning_medicine.2050.end.desc:0 "ความหนาวเย็นวิ่งผ่านกระดูกสันหลังของข้า #EMP ข้า#! อาจเป็นความหวังเดียวของ [soldier.Custom('WomanManPossessive')] ผู้นี้\n\nทันใดนั้น ราวกับว่า [helper.GetSheHe] ก้าวออกมาจากอากาศธาตุ [helper.Custom2('MyCharacterIntroduction', ROOT.Char)] ก็อยู่ข้าง ๆ ข้า [helper.GetSheHe|U] ม้วนแขนเสื้อของ [helper.GetHerHis] ขึ้นและมองมาที่ข้า"
 learning_medicine.2050.a:0 "ส่งสายรัดห้ามเลือดมาให้ข้า!"
 learning_medicine.2050.a.success:0 "[helper.GetFirstNameNoTooltip] และข้าช่วยชีวิตทหารไว้ได้"
 learning_medicine.2050.a.failure:0 "แม้จะพยายามแล้ว เราก็สูญเสีย [soldier.GetHerHim] ไป"
 learning_medicine.2050.b:0 "#EMP ถอยไป#!! นี่คือคนไข้ #EMP ของข้า#! "
 learning_medicine.2050.b.success:0 "ข้าช่วยชีวิตทหารไว้ได้ด้วยตัวเอง"
 learning_medicine.2050.b.failure:0 "ข้าไม่สามารถช่วยชีวิต [soldier.GetHerHim] ได้"
 learning_medicine.2050.c:0 "ปล่อยให้ [soldier.GetHerHim] เลือดออกไป [soldier.GetSheHe|U] ไม่สมควรได้รับสิ่งที่ดีกว่านี้"

 learning_medicine.2051.start_our.desc:0 "คนไข้ของเรา"
 learning_medicine.2051.start.desc:0 "กรีดร้องและดิ้นรน แม้ว่า [soldier.GetWomenMen] โตเต็มวัยสามคนจะกด [soldier.GetHerHim] ไว้ แต่ทุกย่างก้าวคือการต่อสู้"
 learning_medicine.2051.middle.desc:0 "แต่ [helper.GetTitledFirstName] ยังคงสงบ และในที่สุด ความตั้งใจอันเงียบสงบก็เข้ามาครอบงำเรา\n\nข้าไม่แน่ใจว่าเราจัดการได้อย่างไร แต่ในท้ายที่สุด ดูเหมือนว่าทหารจะรอดชีวิต "นั่นเป็นความสำเร็จที่น่าประทับใจ"
 learning_medicine.2051.my_ladylord.desc:0 ""[ROOT.Char.Custom('FormOfAddressForLiege')|U],""
 learning_medicine.2051.firstname.desc:1 "[ROOT.Char.GetFirstNameNoTooltip],""
 learning_medicine.2051.end.desc:0 "[helper.GetFirstNameNoTooltip] กล่าวพร้อมรอยยิ้มเหนื่อยล้า "เป็นเกียรติที่ได้รับใช้เคียงข้างท่าน""
 learning_medicine.2051.a:0 "ข้าคงทำไม่ได้หากไม่มีท่าน"

 learning_medicine.2052.middle.desc:0 "\n\nเราทำงานอย่างบ้าคลั่ง ตะโกนสั่งการท่ามกลางความโกลาหล แต่มันไร้ความหวัง [soldier.GetWomanMan] ผู้นั้นอ่อนแอลงเรื่อยๆ เลือดของ [soldier.GetHerHis] ไหลทะลักออกมาเหนือนิ้วมือของเรา\n\n"เราทำทุกอย่างที่ทำได้แล้ว"
 learning_medicine.2052.end.desc:0 "[helper.GetFirstNameNoTooltip] กล่าวพร้อมถอนหายใจอย่างหนักขณะที่พวกเขานำร่างออกไป "[soldier.GetWomanMan] ผู้นั้นถึงวาระแล้วนานก่อนที่เราจะเห็น [soldier.GetHerHim] เสียอีก""
 learning_medicine.2052.a:0 "ท่านพูดถูก ขอบคุณ [helper.GetFirstNameNoTooltip]"
 learning_medicine.2052.b:0 "ข้าไม่ต้องการความสงสารของท่าน!"

 learning_medicine.2053.start_my.desc:0 "คนไข้ของข้า"
 learning_medicine.2053.desc:0 "แต่ความรู้ของข้ามิได้ล้มเหลว และมือของข้ายังคงมั่นคง\n\nข้าไม่แน่ใจว่าข้าจัดการได้อย่างไร แต่ในท้ายที่สุด ดูเหมือนว่าทหารผู้นั้นจะมีชีวิตรอด สหายร่วมรบของ[soldier.GetHerHis|U] ตบหลังข้า มารยาทอันควรถูกลืมเลือนไป เพราะความโล่งอก "ขอบพระคุณ [ROOT.Char.Custom('FormOfAddressForLiege')] พวกเราคงสูญเสีย [soldier.GetFirstName] ไปแล้วหากปราศจากท่าน!""
 learning_medicine.2053.a:0 "วันนี้ข้าช่วยชีวิตคนได้!"

 learning_medicine.2054.desc:0 "\n\nข้าทำงานอย่างบ้าคลั่ง ตะโกนสั่งการท่ามกลางความโกลาหล แต่มันไร้ความหวัง [soldier.GetWomanMan] ผู้นั้นอ่อนแอลงเรื่อยๆ เลือดของ [soldier.GetHerHis] ไหลทะลักออกมาเหนือนิ้วมือของข้า\n\nขณะที่พวกเขานำร่างออกไป [helper.GetFirstName] มองมาที่ข้าด้วย"
 learning_medicine.2054.disgust.desc:0 "ความรังเกียจอย่างไม่ปิดบัง"
 learning_medicine.2054.pity.desc:0 "ความสงสาร"
 learning_medicine.2054.a:0 "ข้า... หากเพียง แต่ข้า..."

 #A vassal (or your liege) wants to eat some hashish while visiting your capital, by Ewan Cowhig Croft.
 learning_medicine.2110.t:0 "สนทนาเคล้าขนมเค้ก"
 learning_medicine.2110.desc:0 "ขบวนของข้าและข้ากำลังเดินกลับจากการเดินทางสั้นๆ เข้าไปใน [capital.GetNameNoTooltip] เมื่อเราบังเอิญพบกับ [hashish_vassal_or_liege.Custom2('MyCharacterIntroduction', ROOT.Char)] และขบวนของ [hashish_vassal_or_liege.GetHerHis] กำลังด้อมๆ มองๆ อยู่ในเมืองหลวงของข้าโดยไม่ได้แจ้งล่วงหน้า\n\n"
 learning_medicine.2110.desc_good_terms:0 ""อา [ROOT.Char.GetFirstNameNoTooltip]! ข้าหวังว่าจะได้พบท่าน มาเถิด ข้าพบโรงเตี๊ยมเล็กๆ ที่น่ารื่นรมย์อยู่ไม่ไกลจากที่นี่ ท่านสนใจจะร่วมดื่ม [ROOT.Char.Custom('GetExpensiveDrink')] และขนมเค้กผสมฮาชิชกับข้าหรือไม่?""
 learning_medicine.2110.desc_bad_terms:0 "ความตึงเครียดในอากาศนั้นชัดเจนยิ่งนัก ทหารองครักษ์ของทั้งสองฝ่ายต่างเตรียมพร้อมที่จะต่อสู้ "[ROOT.Char.Custom('FormOfAddressForLiege')|U]" ทหารหนุ่มผู้ตื่นกลัวหลังข้าเอ่ยขึ้น "บางทีพวกเราทั้งหมดอาจจะใจเย็นลงได้หากได้กินเค้กฮาชิชในโรงเตี๊ยมเล็ก ๆ ตรงนั้นสักหน่อย?"\n\nความเงียบเข้าปกคลุมทั้งสองกลุ่ม ขณะที่ [hashish_vassal_or_liege.GetFirstNameNoTooltip] รอคอยคำตอบของข้า"
 learning_medicine.2110.desc_neutral_terms:0 "ด้วยความประหลาดใจ ความเงียบอันน่าอึดอัดผ่านไปครู่หนึ่งก่อนที่สายตาของ [hashish_vassal_or_liege.GetFirstNamePossessiveNoTooltip] จะจับจ้องไปที่บางสิ่งข้างหลังข้า\n\n"อา [hashish_vassal_or_liege.Custom2('RelationToMe', ROOT.Char)] ของข้า บางทีท่านอาจจะร่วมลืมเรื่องนี้ไปกับ [ROOT.Char.Custom('GetExpensiveDrink')] และขนมเค้กผสมฮาชิชกับข้า?""
 learning_medicine.2110.a.good_terms:0 "ขออภัย แต่ข้าต้องไปแล้ว"
 learning_medicine.2110.a.bad_terms:0 "กับเจ้าคนถ่อยนี่รึ? ไม่มีทาง!"
 learning_medicine.2110.a.neutral_terms:0 "ข้าเกรงว่าข้ามีธุระต้องไป"
 learning_medicine.2110.b.good_terms:0 "ข้าอาจจะยอมตามใจสักหน่อย..."
 learning_medicine.2110.b.bad_terms:0 "ก็ได้ แต่ #EMP แค่ชิ้นเดียว#! นะ"
 learning_medicine.2110.b.neutral_terms:0 "บางทีเราอาจจะกินเค้กสักชิ้นสองชิ้น..."
 learning_medicine.2110.b.flavour:0 "เค้กชิ้นหนึ่งกลายเป็นสอง แล้วสาม แล้วห้า..."
 cosmic_insights_modifier:0 "ญาณทัศนะแห่งจักรวาล"
 cosmic_insights_modifier_desc:0 "ค่ำคืนอันยาวนานของการบริโภคฮาชิชได้มอบญาณทัศนะเกี่ยวกับธรรมชาติของความเป็นจริงแก่ตัวละครนี้อย่างแท้จริง"
 learning_medicine.2110.c.good_terms:0 "แค่พยายามตามให้ทันนะ สหาย!"
 learning_medicine.2110.c.bad_terms:0 "ความอดทนของข้าเป็นตำนาน!"
 learning_medicine.2110.c.neutral_terms:0 "เราจะ ทำให้ค่ำคืนนี้เสื่อมทราม!"
 learning_medicine.2110.c.tt_success:0 "ฮาชิช ทำให้ [hashish_vassal_or_liege.GetHerHim] พูดมากเกินไป"
 learning_medicine.2110.c.tt_fail:0 "การตามใจมากเกินไป ทำให้ข้าไม่รอบคอบ"

##########
#learning_medicine_special
###########

# Study human cadavers, by Linnéa Thimrén and Flavio Verna
 learning_medicine_special.1001.t:0 "ความลับของร่างกาย"
 learning_medicine_special.1001.desc:0 "ข้าพบว่าตนเองหลงใหลในร่างกายมนุษย์และความลับทั้งหมดที่มันยังคงซ่อนเร้นจากเรา คำถามเกี่ยวกับชีวิตและความตายวนเวียนอยู่ในใจข้าตลอดเวลา\n\nการอ่านตำราเกี่ยวกับหัวข้อนี้ก็ดีอยู่แล้ว แต่ข้าอดไม่ได้ที่จะรู้สึกว่าข้าจะได้เรียนรู้มากขึ้นจากการวิจัยภาคปฏิบัติ"
 learning_medicine_special.1001.a:0 "ข้าจะศึกษาความเสียหายจากโรคบนซากศพ"
 learning_medicine_special.1001.b:0 "ร่างของผู้ตายสมควรได้รับความเคารพจากเรา!"

 learning_medicine_special.1002.desc:0 "ข้าพยายามกลั้นหายใจขณะที่ข้าคุ้ยเขี่ยกองเครื่องในที่พันกันยุ่งเหยิง ลื่นไหล และบวมเป่ง ซึ่งงอกออกมาจากท้องของซากศพ แต่มันไร้ผล กลิ่นเหม็นเน่าของการเน่าเปื่อยค่อยๆ คืบคลานเข้าสู่ปอดของข้า ทำให้ข้าสำลัก\n\nจากนั้นบางสิ่งก็ฉีกขาด และของเหลวข้นหนืดสีเหลืองก็ไหลทะลักออกมาทั่วโต๊ะผ่าตัด\n\n "นั่นมัน #EMP อะไรกัน#!?""
 learning_medicine_special.1002.a:0 "บางที [scoped_physician.GetTitledFirstNameNoTooltip] อาจช่วยข้าได้?"
 learning_medicine_special.1002.a.good:0 "[scoped_physician.GetTitledFirstName] ช่วยข้าในการวิจัย"
 learning_medicine_special.1002.a.bad:0 "[scoped_physician.GetTitledFirstName] ตกตะลึงกับการทดลองของข้า"
 learning_medicine_special.1002.b:0 "ข้าแค่ต้องหาร่างเพิ่ม... อย่างใดอย่างหนึ่ง"
 learning_medicine_special.1002.c:0 "พอแล้ว! นี่มันไม่เหมาะสม!"

 learning_medicine_special.1003.desc_physician:0 "[scoped_physician.GetTitledFirstName] รู้สึกปิติยินดีที่ได้เรียนรู้เกี่ยวกับความสนใจใหม่ของข้าในด้านกายวิภาคศาสตร์ ด้วยความช่วยเหลือของ [scoped_physician.GetHerHis] ข้าได้เพิ่มพูนความเข้าใจเกี่ยวกับร่างกายมนุษย์อย่างมีนัยสำคัญ"
 learning_medicine_special.1003.desc_fallback:0 "ด้วยความช่วยเหลือของเหรียญที่วางไว้อย่างดีสองสามเหรียญและคนรับใช้ที่ปากแข็ง ข้าได้จัดหาศพมาทดลองอย่างต่อเนื่อง น่าเสียดายที่ข้าลงเอยด้วยการชำแหละพวกมันส่วนใหญ่ แต่ใครเล่าจะเรียนรู้ได้โดยไม่ทำผิดพลาดสักครั้งหรือหลายสิบครั้ง?"
 learning_medicine_special.1003.desc_ending:0 "\n\nข้าเพียงหวังว่าจะมีวิธีใดวิธีหนึ่งที่จะขจัดกลิ่น... ข้าเริ่มกลัวว่าการสัมผัสกับอากาศที่ไม่ดีทั้งหมดนี้อาจไม่ดีต่อสุขภาพของข้า"
 learning_medicine_special.1003.a:0 "บางทีดอกไม้บางชนิดอาจช่วยได้?"
 learning_medicine_special.1003.a.good:0 "ข้อควรระวังของข้าปกป้องข้าจากความเจ็บป่วย"
 learning_medicine_special.1003.a.bad:0 "กลิ่นของซากศพเริ่มส่งผลต่อธาตุในกายข้า"
 learning_medicine_special.1003.b:0 "ข้าคิดว่าข้าได้เรียนรู้เพียงพอแล้ว"

 learning_medicine_special.1004.desc:0 "[scoped_physician.GetTitledFirstName] ไม่พอใจนักที่ได้เรียนรู้เกี่ยวกับการทดลองของข้า [scoped_physician.GetSheHe|U] ปฏิเสธที่จะให้ความช่วยเหลือใดๆ และตักเตือนข้าว่าความพยายามประเภทนี้ไม่อยู่ในขอบเขตอำนาจของ [ROOT.Char.GetTitleTierName]"
 learning_medicine_special.1004.unavailable.desc:0 "เมื่อ [scoped_physician.GetTitledFirstName] ไม่สามารถให้ความช่วยเหลือใดๆ แก่ข้าได้อีกต่อไป ข้าจึงไม่สามารถดำเนินการทดลองเกี่ยวกับกายวิภาคของมนุษย์ต่อไปได้"
 learning_medicine_special.1004.a:0 "บางทีท่านอาจจะพูดถูก..."
 learning_medicine_special.1004.unavailable.a:0 "อนิจจา"
 learning_medicine_special.1004.unavailable.tt:0 "ท่านหยุดศึกษาซากศพมนุษย์"

 learning_medicine_special.1005.desc:0 "โชคดีที่การใช้แปลงดอกไม้ ธูป และการระบายอากาศอย่างเหมาะสมดูเหมือนจะช่วยลดผลกระทบที่ไอระเหยที่ไม่ดี ซึ่งเล็ดลอดออกมาจากซากศพมีต่อร่างกายของข้า\n\nในที่สุดข้าก็สามารถมุ่งความสนใจไปที่การศึกษาของข้าได้โดยไม่ต้องกลัวผลกระทบต่อสมดุลธาตุในกายของข้าเอง"
 learning_medicine_special.1005.a:0 "ไม่มีสิ่งใดขวางกั้นความรู้ได้!"

 learning_medicine_special.1006.desc_opening:0 "ขณะที่ข้ายืนอยู่เหนือร่างหนึ่งที่ข้าเก็บไว้ในห้องศึกษามาหลายวัน ข้าก็รู้สึกเวียนศีรษะอย่างกะทันหัน — อีกครั้ง"
 learning_medicine_special.1006.desc_death:0 "อาการไอตามมาไม่นานนัก และขณะที่ข้างอตัวลงจากความเจ็บปวด ข้าก็รู้สึกได้ถึงเลือดที่ไหลซึมออกมาจากระหว่างริมฝีปาก\n\nข้ากะพริบตา และพบว่าตัวเองอยู่บนพื้น ข้าหายใจเฮือก และพบว่าข้าหายใจต่อไปไม่ได้อีกแล้ว ข้าหลับตาลง..."
 learning_medicine_special.1006.desc:0 "ข้าไม่สามารถปฏิเสธความต้องการของร่างกายตัวเองได้อีกต่อไป ข้าต้องยุติเรื่องนี้และนอนพักสักครู่..."
 learning_medicine_special.1006.a:0 "กลิ่นอายมรณะได้กระทบธาตุขันธ์ของข้า!"

 

 #You consume a hallucinogenic fish, by Ewan Cowhig Croft.
 learning_medicine_special.2100.t:0 "ปลาอัศจรรย์ที่สุด"
 learning_medicine_special.2100.desc:1 "[fish_alchemist.GetWomanMan] ชาวประมงท้องถิ่นจาก [hallucinogenic_fish_county.GetNameNoTierNoTooltip] ชื่อ [fish_alchemist.GetName] ได้มาเข้าเฝ้าข้าโดยอ้างว่าสามารถปรุงอาหารเย็นที่ต้องมนต์ได้\n\nว่ากันว่า [fish_alchemist.GetSheHe] จับปลาในฝันจากจุดลับและทำพิธีกรรมแปลกๆ กับพวกมัน [fish_alchemist.GetSheHe|U] จากนั้นก็นำหัวของพวกมันมาเสิร์ฟ โดยปลา แต่ละตัวจะสร้างนิมิตอันน่าปิติยินดีเป็นเวลาหลายวันหลังจากการบริโภค\n\n[fish_alchemist.GetWomanMan] ชาวประมงบิดมือของ [fish_alchemist.GetHerHis] ขณะที่ [fish_alchemist.GetSheHe] มองมาที่ข้า ดวงตาเป็นประกายด้วยความโลภและความกลัว"
 learning_medicine_special.2100.a:0 "เตรียมปลาวิเศษของเจ้าให้ข้าตัวหนึ่ง"
 learning_medicine_special.2100.a.tt_success:0 "ข้าได้รับการเปิดเผยอันศักดิ์สิทธิ์เกี่ยวกับ [ROOT.Char.GetFaith.PositiveAfterLife]"
 hallucinogenic_visions_uplifting_modifier:0 "นิมิตอันยกระดับจิตใจเกี่ยวกับชีวิตหลังความตาย"
 hallucinogenic_visions_uplifting_modifier_desc:0 "ตัวละครนี้ได้รับการเปิดเผยที่เปลี่ยนแปลงจิตใจเกี่ยวกับความสุขที่รอคอยผู้ที่ได้รับเลือกในปรโลก"
 learning_medicine_special.2100.a.tt_failure:0 "ข้าต้องเผชิญกับฝันร้ายเกี่ยวกับ [ROOT.Char.GetFaith.NegativeAfterLife]"
 hallucinogenic_visions_terrifying_modifier:0 "นิมิตอันน่าสะพรึงกลัวเกี่ยวกับชีวิตหลังความตาย"
 hallucinogenic_visions_terrifying_modifier_desc:0 "ตัวละครนี้ถูกทรมานด้วยนิมิตที่ฝังใจเกี่ยวกับความน่าสะพรึงกลัวที่รอคอยผู้ที่ไม่คู่ควรในปรโลก"
 learning_medicine_special.2100.b:0 "พิธีกรรมนี้ เจ้าต้องสอนข้า..."
 learning_medicine_special.2100.b.tt_success:0 "ชาวบ้านเปิดเผยความลับของ [fish_alchemist.GetHerHis]"
 learning_medicine_special.2100.b.tt_success.tt:0 "[fish_alchemist.GetShortUINameNoTooltip] เข้าร่วมราชสำนักของข้าในฐานะคนรับใช้ผู้ภักดี"
 learning_medicine_special.2100.b.tt_fail:0 "ข้าทะเลาะวิวาทอย่างรุนแรงกับชาวบ้าน"
 learning_medicine_special.2100.b.tt_failure.tt:0 "[fish_alchemist.GetShortUINameNoTooltip] หนีออกจากราชสำนักของข้าด้วยความโกรธเคือง"
 associates_with_strange_peasants_modifier:0 "คบค้ากับชาวบ้านประหลาด"
 associates_with_strange_peasants_modifier_desc:0 "ตัวละครนี้เป็นที่รู้กันว่ามีส่วนร่วมในการโต้เถียงแปลกๆ กับผู้ที่อยู่ต่ำกว่าสถานะของตนมาก"
 learning_medicine_special.2100.c:0 "อย่าปล่อยให้แม่มด/พ่อมดมีชีวิตอยู่!"
 learning_medicine_special.2100.c.tt:0 "[fish_alchemist.GetShortUINameNoTooltip] ถูกเผาทั้งเป็น"
 learning_medicine_special.2100.d:0 "ใครช่วยกรุณาเอาชาวบ้านคนนี้ออกไปที?"
 learning_medicine_special.2100.d.tt:0 "[fish_alchemist.GetShortUINameNoTooltip] ถูกโยนออกจากราชสำนักของข้าด้วยความขุ่นเคือง"
 aloof_from_the_commoners_modifier:0 "ห่างเหินจากสามัญชน"
 aloof_from_the_commoners_modifier_desc:0 "ตัวละครนี้มีชื่อเสียงในการขับไล่ชาวบ้านที่เสียเวลา"
