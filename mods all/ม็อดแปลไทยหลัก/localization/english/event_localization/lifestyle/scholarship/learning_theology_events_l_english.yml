l_english: 
# Your realm priest asks for books, by Linnéa Thimrén
 learning_theology.1301.t:0 "วรรณกรรมอันเป็นที่ปรารถนา"
 learning_theology.1301.desc_opening:0 ""[ROOT.Char.Custom('FormOfAddressForLiege')|U]!" [bishop.Custom2('MyCharacterIntroduction', ROOT.Char)|U] เข้ามาหาข้าอย่างเร่งรีบ\n\n"
 learning_theology.1301.desc_regula_pastoralis:0 ""พ่อค้าท้องถิ่นผู้หนึ่งมีสำเนาของ เรอกูลา ปาสโตราลิส อันทรงอิทธิพล แต่ปฏิเสธที่จะขายให้ข้า"
 learning_theology.1301.desc:0 ""พ่อค้าท้องถิ่นผู้หนึ่งมีสำเนาของ ตำราสรุปว่าด้วยการคำนวณโดยการเติมเต็มและการถ่วงดุล แต่ปฏิเสธที่จะขายให้ข้า"
 learning_theology.1301.desc_ending:0 "หากท่าน ทำให้เขาเห็นความผิดพลาดในวิถีของเขาได้ ข้าจะเป็นหนี้บุญคุณท่านยิ่งนัก!""
 learning_theology.1301.a:0 "ข้าจะ ทำให้แน่ใจว่าตำรานั้นถึงมือท่าน"
 learning_theology.1301.b:0 "หืม ตำราเล่มนี้น่าสนใจ..."
 learning_theology.1301.c:0 "นี่ฟังดูเหมือนปัญหาของ #EMP ท่าน#! นะ"

# Flatter your court chaplain with some bible verses, by Mathilda Bjarnehed
 learning_theology.2020.t:0 "พลังแห่ง [ROOT.Char.GetFaith.ReligiousText|U]"
 learning_theology.2020.desc:0 "[court_chaplain.GetCouncilTitle|U] [court_chaplain.GetFirstName] มักอ้างอิงข้อความจาก [ROOT.Char.GetFaith.ReligiousText] เกี่ยวกับคุณธรรมอันศักดิ์สิทธิ์ ข้าควรพิสูจน์ว่าข้าได้ใส่ใจโดยการอ้างอิงข้อความของข้าเอง — โดยเฉพาะอย่างยิ่งข้อความที่สอดคล้องกับบุคลิกภาพของ [court_chaplain.GetHerHis]\n\nข้าจะท่องจำและสาธยายส่วนที่เกี่ยวกับ..."
 learning_theology.2020.brave:0 "...ความกล้าหาญ"
 learning_theology.2020.just:0 "...ความยุติธรรม"
 learning_theology.2020.temperate:0 "...ความพอประมาณ"
 learning_theology.2020.chaste:0 "...พรหมจรรย์"
 learning_theology.2020.compassionate:0 "...ความเมตตา"
 learning_theology.2020.honest:0 "...ความสัตย์จริง"
 learning_theology.2020.forgiving:0 "...การให้อภัย"
 learning_theology.2020.wrathful:0 "...ความดุร้าย"
 learning_theology.2020.vengeful:0 "...ความอาฆาตแค้น"
 learning_theology.2020.content:0 "...ความสันโดษ"
 learning_theology.2020.patient:0 "...ความอดทน"
 learning_theology.2020.calm:0 "...ความสงบ"
 learning_theology.2020.humble:0 "...ความถ่อมตน"
 learning_theology.2020.diligent:0 "...ความขยันหมั่นเพียร"
 learning_theology.2020.generous:0 "...ความเอื้อเฟื้อเผื่อแผ่"
 learning_theology.2020.greedy:0 "...ความมั่งคั่ง"
 learning_theology.2020.lustful:0 "...ความปรารถนา"
 learning_theology.2020.ambitious:0 "...ความทะเยอทะยาน"
 learning_theology.2020.gluttonous:0 "...ความเจริญอาหาร"

 learning_theology.2020.success.desc:0 "[court_chaplain.GetCouncilTitle|U] [court_chaplain.GetFirstNameNoTooltip] รู้สึกปลื้มใจ"
 learning_theology.2020.neutral.desc:0 "[court_chaplain.GetCouncilTitle|U] [court_chaplain.GetFirstNameNoTooltip] พอใจ"
 learning_theology.2020.failure.desc:0 "[court_chaplain.GetCouncilTitle|U] [court_chaplain.GetFirstNameNoTooltip] คิดว่าข้ากำลังเยาะเย้ย [court_chaplain.GetHerHim]"

 learning_theology.2021.desc:0 "ข้ามั่นใจว่า [court_chaplain.GetCouncilTitle|U] [court_chaplain.GetFirstName] ได้กล่าวบางอย่างเกี่ยวกับคุณธรรมของการเป็น [SCOPE.Custom('virtue_choice')] ข้าจำคำพูดที่แท้จริงของเขาไม่ได้ ดังนั้นข้าจึงอนุญาตให้ตนเองใช้ความคิดสร้างสรรค์บ้าง\n\nน่าเสียดายที่ [court_chaplain.GetCouncilTitle|U] ค่อนข้างอนุรักษ์นิยม "ท่านกำลังพูดเรื่องอะไร?" [court_chaplain.GetSheHe] พูดอย่างเย้ยหยัน "นั่นไม่ใช่พระวจนะของ [ROOT.Char.GetFaith.HighGodName]!""
 learning_theology.2021.a:0 "บางทีข้าควรอ่าน [ROOT.Char.GetFaith.ReligiousText] ให้บ่อยขึ้น..."

 learning_theology.3002.t:0 "อายุของโลก"
 learning_theology.3002.desc:0 "ข้าได้ศึกษาคัมภีร์ศาสนาโบราณและงานเขียนของปราชญ์ และดูเหมือนว่าทั้งหมดจะเห็นพ้องกันว่า [ROOT.Char.Custom('WorldDeadline')] จากการคำนวณของข้า เราอยู่ห่างจากเวลานั้นไม่ถึงศตวรรษ\n\nอย่างไรก็ตาม [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('chaplain'))] ของข้า [chaplain.GetTitledFirstName] กระตุ้นให้ข้าเก็บเรื่องนี้ไว้กับตัวเอง "ปล่อยให้เป็นเรื่องของ [ROOT.Char.GetFaith.AltPriestTermPlural] และหลีกเลี่ยงความตื่นตระหนก จะเป็นอย่างไรหากการคำนวณของท่านผิดพลาด?""
 learning_theology.3002.a:0 "ทุกคนสมควรได้รับรู้ความจริง!"
 learning_theology.3002.b:0 "เป็นประเด็นที่สมเหตุสมผล [chaplain.GetFirstNameNoTooltip]"
 learning_theology.3002.c:0 "ข้าควรปรึกษาหารือกับ [ROOT.Char.GetFaith.PriestNeuterPlural] เพิ่มเติม"

 learning_theology.3003.t:0 "การจ้องมองดวงดาว"
 learning_theology.3003.desc:0 "จากทุกค่ำคืนที่ข้าเฝ้ามองดวงดาว ข้าได้เห็นด้วยตาของข้าเองในสิ่งที่ข้าเคยได้ยินมาก่อนเท่านั้น\n\nดวงดาวเคลื่อนที่ด้วยความเร็วที่แตกต่างกัน และย้อนกลับเส้นทางในเวลาที่ต่างกัน แต่ดูเหมือนจะเป็นกลุ่มใหญ่ ขึ้นอยู่กับว่าพวกมันอยู่ในทรงกลมท้องฟ้าใด อันที่จริง ด้วยการคำนวณที่ถูกต้อง เราอาจทำนายการเคลื่อนที่ของพวกมันได้ด้วยซ้ำ\n\n[ROOT.Char.Custom2('RelationToMe', SCOPE.sC('chaplain'))] ของข้าไม่เห็นด้วยแน่นอน "ปล่อยท้องฟ้าไว้เถิด แดนสวรรค์เป็นเรื่องที่ [ROOT.Char.GetFaith.AltPriestTermPlural] ควรรู้""
 learning_theology.3003.a:0 "ข้าจะค้นหาคำตอบของข้าในสรวงสวรรค์"
 learning_theology.3003.b:0 "ท่านพูดถูก ข้าควรให้ความสำคัญกับเรื่องทางโลก"

 #Worship in the same church (theology friend), by Linnéa Thimrén
 learning_theology.3011.t:0 "การสวดภาวนาร่วมกัน"
 learning_theology.3011.desc_friend:0 "เมื่อออกจาก [ROOT.Char.GetFaith.HouseOfWorship] ใน [temple_county.GetName] ข้าและ [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('believer'))] ของข้า [believer.GetTitledFirstName] ก็ได้พบปะกับพ่อค้าท้องถิ่นบางคน"
 learning_theology.3011.desc:0 "เมื่อออกจาก [ROOT.Char.GetFaith.HouseOfWorship] ใน [temple_county.GetName] ข้าก็ได้พบปะกับพ่อค้าท้องถิ่นบางคน เช่นเดียวกับ [believer.GetTitledFirstName]"
 learning_theology.3011.ending:0 "พวกเขากำลังอยู่ท่ามกลางการสนทนาเกี่ยวกับเทววิทยาและทรัพย์สมบัติทางโลก\n\n"ข้า #EMP ก็อยากจะ#! ลงทุนใน [ROOT.Char.GetFaith.HouseOfWorship] แต่ข้าจะรู้ได้อย่างไรว่านั่นเป็นพระประสงค์ของ [ROOT.Char.GetFaith.WealthGodNamePossessive] หรือไม่?""
 learning_theology.3011.a_friend:0 "เราจะโน้มน้าวพวกเขาว่า [ROOT.Char.GetFaith.WealthGodName] ได้ประทานสัญญาณแล้ว!"
 learning_theology.3011.a:0 "ช่วยข้าโน้มน้าวพวกเขาด้วย [believer.GetTitledFirstNameNoTooltip]!"
 learning_theology.3011.a.success:0 "เหล่าพ่อค้าถูกโน้มน้าวแล้ว"
 learning_theology.3011.a.failure:0 "[ROOT.Char.GetFaith.HouseOfWorship] ไม่เคยเห็นเหรียญเลยสักอัน"
 learning_theology.3011.b:0 "ข้ารู้ว่าที่ใดที่ทองคำของท่านจะมีประโยชน์มากกว่า...!"

 #Send fan mail to religious head, by Linnéa Thimrén
 learning_theology.3021.t:0 "สาส์นศักดิ์สิทธิ์"
 learning_theology.3021.desc_opening:0 "ความพยายามล่าสุดของข้าในแวดวงศาสนศาสตร์ ทำให้ข้าซาบซึ้งในตัวแทนของ [ROOT.Char.GetFaith.HighGodNamePossessive] บนโลกมนุษย์มากขึ้น เพื่อพยายามแสดงความรู้สึกเหล่านี้ ข้าจะร่างจดหมายถึง [compliment_receiver.GetTitleAsName] [compliment_receiver.GetFirstName]\n\n"
 learning_theology.3021.desc_friend:0 "ข้านั่งลงกับ [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('believer'))] ของข้า [believer.GetTitledFirstName],"
 learning_theology.3021.desc:0 "ข้านั่งลงกับอาลักษณ์ผู้หนึ่ง "
 learning_theology.3021.desc_christian:0 "และร่วมกันเราสร้างสรรค์จดหมายอันงดงามอย่างแท้จริง เน้นย้ำถึงความศักดิ์สิทธิ์ของ [compliment_receiver.GetHerHis|U]..."
 learning_theology.3021.desc_other:0 "และร่วมกันเราสร้างสรรค์จดหมายอันงดงามอย่างแท้จริง เน้นย้ำถึง [compliment_receiver.GetHerHis]..."
 learning_theology.3021.success.tt:0 "ขึ้นอยู่กับดุลยพินิจของ [believer.GetTitledFirstNameNoTooltip]:"
 learning_theology.3021.b:0 "มีเพียง [ROOT.Char.GetFaith.HighGodName|U] เท่านั้นที่เหนือกว่า!"

 learning_theology.3022.opening:0 "[compliment_receiver.Custom2('AppropriateGreeting', ROOT.Char)]"
 learning_theology.3022.desc:0 "จดหมายของท่านเป็นที่ชื่นชมยิ่งนัก! ความเข้าใจอย่างลึกซึ้งของท่านในขอบเขตของ [ROOT.Char.GetFaith.HighGodName|U] รวมถึงธรรมชาติของมนุษย์นั้นน่าทึ่งมาก"
 learning_theology.3022.a:0 "สรรเสริญ [ROOT.Char.GetFaith.HighGodNameAlternate]!"

 learning_theology.3023.opening:0 "[compliment_receiver.Custom2('AppropriateGreeting', ROOT.Char)]"
 learning_theology.3023.desc:0 "ข้าประทับใจในความเข้าใจอย่างลึกซึ้งของท่านเกี่ยวกับศาสนาของเรา แต่น้อยกว่านั้นสำหรับความเข้าใจในเพื่อนมนุษย์ของท่าน"
 learning_theology.3023.a:0 "ขอให้เป็น เช่นนั้นเถิด"

 learning_theology.3024.opening:0 "[compliment_receiver.Custom2('AppropriateGreeting', ROOT.Char)]"
 learning_theology.3024.desc:0 "การวางท่าอันว่างเปล่าของท่านในฐานะ [ROOT.Char.GetWomanMan] แห่ง [ROOT.Char.GetFaith.HighGodName] ไม่ได้หลอกลวงข้า และสายตาที่มืดมัวของท่านในการมองลึกลงไปในหัวใจของผู้คนได้เผยตัวตนของท่านออกมา!"
 learning_theology.3024.a:0 "พับผ่าสิ...!"

# Deal with county of different faith, by Linnéa Thimrén
 learning_theology.3031.t:0 "ความแตกต่างทางศรัทธา"
 learning_theology.3031.desc_opening:0 "ใน [county.GetName] พวกเขานับถือ [county.GetProvince.GetCounty.GetFaith.GetNameNoTooltip]\n\n"
 learning_theology.3031.desc_bishop:0 "[bishop.GetCouncilTitle|U] [bishop.GetFirstName] ประณามว่าเป็นลัทธินอกรีต แต่ผู้คนร้องขอความเข้าใจ..."
 learning_theology.3031.desc:0 "หลายคนประณามว่าเป็นลัทธินอกรีต แต่ผู้คนร้องขอความเข้าใจ..."
 learning_theology.3031.a:0 "วิธีที่พวกเขาสักการะไม่ใช่เรื่องของข้า"
 learning_theology.3031.b:0 "พวกเขา #EMP จะต้อง#! สวดภาวนาต่อ [ROOT.Char.GetFaith.PantheonTerm]!"
 learning_theology.3031.b_confucian: "พวกเขาจะปฏิบัติตามมรรคา!"
 learning_theology.3031.b_tt:1 "เพิ่มความคืบหน้าของภารกิจสภา $task_conversion$"
 learning_theology.3031.b_tt2:0 "จะง่ายขึ้นในการเปลี่ยนศรัทธาใน [county.GetNameNoTooltip] เป็นเวลา 30 ปี"

 # Study Mysticism, by Petter Vilberg
 learning_theology.3041.t:0 "ความรู้ลี้ลับ"
 learning_theology.3041.desc:0 "ข้าเคยได้ยินมาว่า [ROOT.Char.GetFaith.DevoteeNeuterPlural] เข้าสู่ภวังค์และนิมิตอันปลาบปลื้มเพื่อสื่อสารกับ [ROOT.Char.GetFaith.HighGodName]\n\nข้าจะสามารถบรรลุการเชื่อมต่ออันศักดิ์สิทธิ์ เช่นนี้ได้บ้างหรือไม่?"
 learning_theology.3041.a:0 "ข้าสงสัยว่าจะเกิดอะไรขึ้นหากข้าเลียนแบบการปฏิบัติของพวกเขา"
 learning_theology.3041.a.tt:0 "ท่านทดสอบการปฏิบัติลี้ลับ"
 learning_theology.3041.b:0 "ตำราอื่น ๆ กล่าวว่าอย่างไร?"
 learning_theology.3041.b.tt:0 "ท่านพยายามเรียนรู้เพิ่มเติมเกี่ยวกับการปฏิบัตินี้ผ่านตำรา"

 learning_theology.3042.desc:0 "ถูกขังอยู่ในห้อง ผงแปลกประหลาดบนกองไฟที่ลุกไหม้ให้ความร้อน ควัน และกลิ่นที่รุนแรง ขณะที่ข้าพยายามสัมผัสถึงสิ่งที่อยู่เหนือโลกแห่งประสาทสัมผัส\n\nข้าไม่รู้ว่าเวลาผ่านไปนานเท่าใดก่อนที่นิมิตแห่งแสงและเสียงที่สั่นสะเทือนอันแปลกประหลาดและไม่อาจถอดความได้จะมาถึงข้า มันเป็นจินตนาการของข้า หรือเป็นการเหลือบเห็นสิ่งศักดิ์สิทธิ์? มีทางใดที่จะบอกได้หรือไม่?"
 learning_theology.3042.a:0 "ข้าต้องลองอีกครั้งเพื่อดูว่ามีอะไรแตกต่างไปหรือไม่!"
 learning_theology.3042.a.tt:0 "ท่านทดลองต่อไป"
 learning_theology.3042.b:0 "น่าสนใจ ข้าจะบันทึกสิ่งที่ข้าค้นพบไว้สำหรับอนาคต"

 learning_theology.3043.desc:0 "ยิ่งข้าทดลองมากขึ้นเท่าใด ข้าก็ยิ่งเข้าใจสิ่งต่าง ๆ ได้ชัดเจนขึ้นเท่านั้น ราวกับว่าบัดนี้ข้าสามารถอัญเชิญการประทับอยู่ที่ข้ารู้สึกได้เมื่อข้าเริ่มพิธีกรรมเล็ก ๆ ของข้า\n\nมันมอบความมั่นคงและความสบายใจขณะที่ความโกลาหลของโลกหมุนวนอยู่รอบตัวข้า"
 learning_theology.3043.a:0 "นี่คือสิ่งที่ข้าแสวงหา!"
 learning_theology.3043.b:0 "แทบไม่มีอะไรศักดิ์สิทธิ์เลย — แต่ผ่อนคลายมาก!"

 learning_theology.3044.desc:0 "ยิ่งข้าขุดค้นตำราโบราณมากเท่าใด ข้าก็ยิ่งค้นพบมากขึ้นเท่านั้น การปฏิบัติอันลึกลับของ [ROOT.Char.GetFaith.DevoteeNeuterPlural] โบราณอาจมีมาก่อนแม้กระทั่ง [ROOT.Char.GetFaith.GetReligion.GetNameNoTooltip] เองหรือไม่?\n\nดูเหมือนว่าข้าจะบังเอิญพบเจอสิ่งที่น่าทึ่ง"
 learning_theology.3044.a:0 "สิ่งนี้สอนข้ามากมายเกี่ยวกับศรัทธาของข้า!"
 learning_theology.3044.b:0 "บางทีข้าควรทดลองเล็กน้อยหลังจากทั้งหมด..."

 learning_theology.3045.desc:0 "นี่มันน่าหงุดหงิดเหลือเกิน! ไม่ว่าข้าจะทำอะไร ข้าก็ไม่สามารถจับความรู้สึกที่ข้าได้รับจากการทดลองลี้ลับครั้งแรกของข้าได้\n\nความรู้สึกที่ว่า #EMP บางสิ่ง#! อยู่ที่นั่น ใกล้แค่เอื้อม แต่คว้าไม่ได้ มันหายไปแล้ว ไม่ว่าข้าจะทำอะไรก็ตาม!"
 learning_theology.3045.a:0 "ข้าต้องจับความรู้สึกนั้นกลับคืนมาให้ได้!"
 learning_theology.3045.b:0 "การสวดภาวนาคือทั้งหมดที่ข้าต้องการเพื่อสื่อสารกับ [ROOT.Char.GetFaith.HighGodNameAlternate]"

 learning_theology.3046.desc:0 "ข้าแสวงหาความรู้และประสบการณ์ลี้ลับมานานแล้ว แต่ ทว่า... ไม่มีอะไรเลย! คำตอบเดียวที่ข้าเหลืออยู่คือการกลับไปสู่จุดเริ่มต้น และสร้างเงื่อนไขของการทดลองของข้าขึ้นมาใหม่อย่างสมบูรณ์แบบ\n\nข้าต้องสื่อสารกับสิ่งศักดิ์สิทธิ์ ข้ากำลังถูกเพิกเฉยโดยเจตนาหรือไม่?!"
 learning_theology.3046.a:0 "ข้าต้องค้นหาคำตอบให้ได้!"
 learning_theology.3046.a.success:0 "การทดลองที่ประสบความสำเร็จ"
 learning_theology.3046.a.success.tt:1 "ท่านอาจได้รับ [GetTrait('lifestyle_mystic').GetName( GetPlayer )]"
 learning_theology.3046.a.failure:0 "ยังคงไม่มีอะไร!"
 learning_theology.3046.a.failure.tt:0 "การแสวงหาของท่าน ทำให้ท่านเสียสติ"
 learning_theology.3046.b:0 "ข้ากำลังทำอะไรอยู่... ถึงเวลาที่ข้าจะเลิกความโง่เขลานี้เสียที"

 learning_theology.3047.desc:0 "ข้าไม่ต้องการพิธีกรรมโบราณเพื่อสื่อสารกับสิ่งศักดิ์สิทธิ์ สิ่งศักดิ์สิทธิ์พูดคุยกับข้าตลอดเวลา ข้าได้ยินมัน ข้าไม่มีอะไรต้องกังวล และไม่มีอะไรต้องแสวงหา ทุกสิ่งอยู่ที่นี่กับข้าแล้ว ทุกเช้า ทุกเย็น ทุกคืน\n\nมันพูดคุยกับข้า และเอ่ยเพียงนามของข้าเท่านั้น!"
 learning_theology.3047.a:0 "[ROOT.Char.GetFaith.HighGodName] เลือกข้า! ข้าคือผู้ถูกเลือก!"

# Passion Play fanfiction drama, by James Beaumont
 learning_theology.3051.t:0 "ละคร [ROOT.Char.GetFaith.GetReligion.GetAdjectiveNoTooltip] ใน [ROOT.Char.GetCapitalLocation.GetTitle.GetNameNoTierNoTooltip]"
 learning_theology.3051.desc.intro:1 "มีผู้แจ้งให้ข้าทราบว่า [passion_playwright.GetName] นักเขียนบทละคร [ROOT.Char.GetFaith.GetReligion.GetAdjectiveNoTooltip] ผู้มีชื่อเสียง ตั้งใจจะจัดการแสดงผลงานของ [passion_playwright.GetHerHis] ที่มีชื่อว่า:"
 learning_theology.3051.passion:0 "พระทรมานของ [ROOT.Char.GetFaith.random_GoodGodNames]"
 learning_theology.3051.arabian_nights:0 "2000 ราตรี [SelectLocalization( IsLandlessAdventurer( ROOT.Char ), ROOT.Char.GetCulture.GetCollectiveNounNoTooltip, ROOT.Char.GetPrimaryTitle.GetAdjectiveNoTooltip ) ]"
 learning_theology.3051.inferno:0 "ขุมนรกของ [ROOT.Char.GetFaith.random_EvilGodNames]"
 learning_theology.3051.my_immortal:0 "[passion_playwright.GetRandomPositiveTrait] ของข้า"
 learning_theology.3051.desc.passion:0 ""$learning_theology.3051.passion$""
 learning_theology.3051.desc.arabian_nights:0 ""$learning_theology.3051.arabian_nights$""
 learning_theology.3051.desc.inferno:0 ""$learning_theology.3051.inferno$""
 learning_theology.3051.desc.my_immortal:0 ""$learning_theology.3051.my_immortal$""
 learning_theology.3051.desc.outro:0 "\n\nค่าเข้าชมนั้นสูงนัก แต่นี่น่าจะเป็นโอกาสครั้งหนึ่งในชีวิตที่จะได้ชมบทละครของ [passion_playwright.GetNameNoTooltip] ด้วยตาของข้าเอง!"
 learning_theology.3051.a:0 "ค่ำคืนอันเปี่ยมศรัทธาที่โรงละครนี่แหละ!"
 learning_theology.3051.b:0 "ข้าจะไม่ล้อเลียนการสร้างสรรค์ของ [ROOT.Char.GetFaith.CreatorName]"
 learning_theology.3052.desc:0 "ขณะที่ข้าชมบทละครดำเนินไปเบื้องหน้า ข้าก็เข้าใจได้อย่างรวดเร็วว่าเหตุใด [passion_playwright.GetName] จึงเป็นที่รู้จักกันดีในฐานะอัจฉริยะทางวรรณกรรม ร้อยแก้ว การแสดง ทั้งหมดนี้ ทำให้ข้ารู้สึกราวกับว่าข้ากำลังเป็นสักขีพยานเหตุการณ์ใน [ROOT.Char.GetFaith.ReligiousText] ที่คลี่คลายอยู่ตรงหน้าข้า — ราวกับว่าข้าอยู่ที่นั่นเพื่อยลผลงานของ [ROOT.Char.GetFaith.CreatorName] ด้วยตนเอง!\n\nเมื่อบทละครจบลง ข้าพบว่าตนเองอยู่ตามลำพังกับ [passion_playwright.GetNameNoTooltip]"
 learning_theology.3052.a:0 "ท่านต้องสอนข้าตีความ [ROOT.Char.GetFaith.ReligiousText] อย่างที่ท่านทำ!"
 learning_theology.3052.b:0 "ข้าเขียนได้ดีกว่านี้เสียอีก!"
 learning_theology.3053.desc:1 "ข้าชมบทละครดำเนินไปตรงหน้า และไม่ต้องสงสัยเลยว่ามันเป็นเรื่องเหลวไหลโดยสิ้นเชิง สิ่งที่ข้าเพิ่งได้เห็นนั้นไม่คู่ควรแม้ แต่จะเรียกว่าวรรณกรรม\n\nเรื่องราวติดตาม [ROOT.Char.GetCapitalLocation.Custom('GetRandomRegionalWood')|U] [ROOT.Char.Custom('GetRandomRegionalBird')|U]เวย์ นักวิชาการหนุ่มผู้ศึกษาเวทมนตร์ลี้ลับและคาถาอาคมแบบ [ROOT.Char.GetFaith.GetReligion.GetAdjectiveNoTooltip] ขณะเดียวกันก็ไล่ตามคนรักคนแล้วคนเล่าภายในแวดวงนักวิชาการของ [passion_playwright.GetHerHis]\n\nบทละครแทบไม่เกี่ยวข้องกับ [ROOT.Char.GetFaith.ReligiousText] เลย และเพื่อนผู้ชมของข้าก็เริ่มเยาะเย้ยและโห่ร้องต่องานเขียนที่ไม่ได้เรื่องของ [passion_playwright.GetNamePossessive] แล้ว"
 learning_theology.3053.a:0 "โห่!"
 learning_theology.3053.b:0 "ข้าจะประพันธ์บทละครของข้าเอง!"
 learning_theology.3053.c:0 "คนโง่เขลาเหล่านี้เพียงแค่ไม่เห็นคุณค่าอัจฉริยภาพของ [passion_playwright.GetFirstNamePossessiveNoTooltip]!"
 learning_theology.3054.t:0 "บทละคร [ROOT.Char.GetFaith.GetReligion.GetAdjectiveNoTooltip] ของข้าเอง"
 learning_theology.3054.desc.intro:0 "เป็นเวลาพอสมควรแล้วนับตั้งแต่ข้าปฏิญาณตนว่าจะเอาชนะผลงานที่ด้อยกว่าของ [passion_playwright.GetName] และเมื่อหมึกของอาลักษณ์ของข้าแห้งลง ข้าก็ชื่นชมผลงานของตนเอง"
 learning_theology.3054.desc.outro:0 "เป็นผลงานที่สมควรถูกเรียกว่า "ผลงานชิ้นเอก" ตามการประเมินอย่างถ่อมตนของข้า คำถามเดียวที่ยังคงอยู่คือใครควรรับบทนำ?"
 learning_theology.3054.a:0 "ตัวข้าเองปลอมตัว แน่นอน!"
 learning_theology.3054.b:0 "ถึงเวลาที่ [family_actor.Custom2('RelationToMeShort', ROOT.Char)|U] จะเฉิดฉายแล้ว!"
 learning_theology.3054.c:0 "[ROOT.Char.Custom2('RelationToMeShort', random_actor)]ของข้า [random_actor.GetTitledFirstNameNoTooltip] เป็นผู้มีเสน่ห์โดยธรรมชาติ"
 learning_theology.3055.t:0 "การเปิดตัวอันน่าทึ่ง"
 learning_theology.3055.desc.intro.solo:0 "ข้าสูดหายใจและเตรียมพร้อมที่จะแสดงบทละครของข้า มั่นใจว่ามันจะไร้ที่ติเมื่อมีข้าอยู่ที่นี่เพื่อส่งสารอันเปี่ยมศรัทธา"
 learning_theology.3055.desc.intro.hired_actor:0 "ข้านั่งลงท่ามกลางผู้ชม ดู [lead_actor.GetName] ขณะที่ [lead_actor.GetSheHe] เริ่มการแสดงผลงานชิ้นเอกของ [lead_actor.GetHerHis]"
 learning_theology.3055.desc.victory.solo:0 "ข้าสูดหายใจลึกและท่องบทของข้าอย่างไร้ที่ติ ผู้ชมรอบตัวข้าตกอยู่ภายใต้มนต์สะกดของคำพูดข้า\n\nข้าให้ความกระจ่างแก่พวกเขาด้วยการตีความอันเชี่ยวชาญของข้าเกี่ยวกับเรื่องราวจาก [ROOT.Char.GetFaith.ReligiousText]"
 learning_theology.3055.desc.defeat_writing.solo:0 "แม้ว่าข้าจะท่องบทของข้าอย่างไร้ที่ติ ใบหน้าที่คาดหวังของผู้ชมก็เริ่มเปลี่ยนเป็นขมขื่นและสับสนอย่างรวดเร็ว"
 learning_theology.3055.desc.defeat_acting.solo:0 "ข้าพยายามอ่านบทเปิด แต่ก็สำลักคำพูดทันทีและตะกุกตะกักอ่านบทอย่างแข็งทื่อ ไม่สามารถจำงานเขียนของตนเองได้ ผู้ชมของข้าไม่ให้อภัยข้า และเริ่มโห่ร้องและส่งเสียงฟ่อใส่ข้าอย่างรวดเร็ว!\n\n"
 learning_theology.3055.desc.victory.hired_actor:0 "ด้วยความยินดีของข้า [lead_actor.GetSheHe] แสดงได้อย่างคู่ควรไม่เพียง แต่งานเขียนของข้า แต่ยังคู่ควรกับ [ROOT.Char.GetFaith.HighGodName] [ROOT.Char.GetFaith.HighGodHerselfHimself]!"
 learning_theology.3055.desc.defeat_writing.hired_actor:0 "ด้วยความสยดสยองของข้า แม้ว่า [lead_actor.GetSheHe] จะท่องบทของข้าตรงตามที่ข้าจินตนาการไว้ทุกประการ แต่ผู้ชมก็หันมาต่อต้าน [lead_actor.GetHerHim] อย่างรวดเร็ว ส่งเสียงฟ่อและโห่ร้องขณะที่ [lead_actor.GetSheHe] แสดงได้อย่างยอดเยี่ยม เช่นนั้น!"
 learning_theology.3055.desc.defeat_acting.hired_actor:0 "ด้วยความสยดสยองของข้า [lead_actor.GetSheHe] สำลักคำพูดของ [lead_actor.GetHerHis] และไม่สามารถแสดงได้แม้ แต่ระดับพอใช้ เลือดของข้าเดือดพล่านขณะที่ข้าเฝ้าดู [lead_actor.GetHerHim] ทำลายผลงานอันยิ่งใหญ่ของข้า ทำอะไรไม่ได้ในที่นั่งของข้าเพื่อป้องกันเสียงโห่ร้องของผู้ชม"
 learning_theology.3055.desc.victory_outro:0 "ขณะที่ฝูงชนระเบิดเสียงปรบมือ ข้ามั่นใจว่าข้าทำได้ดีเกินคาดและแสดงให้ [passion_playwright.GetName] เห็นว่า [ROOT.Char.GetFaith.GetAdherentNameNoTooltip] ตัวจริงเขียนบทละครอย่างไร!"
 learning_theology.3055.desc.defeat_outro.solo:0 "ข้ายังคงดำเนินต่อไป หวังว่าข้าอาจจะกลับมามีแรงผลักดันอีกครั้งและกอบกู้การแสดงนี้ได้ในบางจุด แต่มันก็เปล่าประโยชน์ ก่อนที่ข้าจะไปถึงตอนจบ ที่นั่งในโรงละครก็ว่างเปล่าและข้าก็เหลือเพียงความอัปยศอดสู"
 learning_theology.3055.desc.defeat_outro.hired_actor:0 "\n\n[lead_actor.GetTitledFirstNameNoTooltip|U] ยังคงพยายามต่อไป หวังว่าบางทีบทละครนี้อาจยังพอกอบกู้ได้ แต่การแสดงกลับล้มเหลว ก่อนที่เราจะไปถึงตอนจบ ที่นั่งในโรงละครก็ว่างเปล่า และข้าต้องตกอยู่ในความอัปยศ"
 learning_theology.3055.a:0 "ช่างเป็นค่ำคืนที่ยอดเยี่ยมสำหรับ [ROOT.Char.GetFaith.GetAdherentNamePluralNoTooltip] ทุกหนแห่ง!"
 learning_theology.3055.b:0 "บางทีการแสดงอาจไม่เหมาะกับข้า..."

 learning_theology.3054.a.tt:0 "ท่านจะพยายามเอาชนะ [passion_playwright.GetName] ในการประลองโดยใช้ [diplomacy_skill] ของท่าน"
 learning_theology.3054.b.tt:0 "[family_actor.GetName] จะพยายามเอาชนะ [passion_playwright.GetName] ในการประลองโดยใช้ [diplomacy_skill] ของท่าน"
 learning_theology.3054.c.tt:0 "[random_actor.GetName] จะพยายามเอาชนะ [passion_playwright.GetName] ในการประลองโดยใช้ [diplomacy_skill] ของท่าน"

# Find old text, by Linnéa Thimrén & Flavio Verna
 learning_theology_special.1001.t:0 "คัมภีร์นอกสารบบ"
 learning_theology_special.1001.desc:0 "การแสวงหาความรู้อย่างไม่รู้จักพอของข้าได้นำพาข้าไปค้นพบตำราเก่าแก่ที่แปลกประหลาดเล่มหนึ่ง\n\nตำราเล่มนี้ ซึ่งอ้างว่าเป็นผลงานของนักเทววิทยาโบราณที่ถูกอ้างอิงถึงน้อยครั้งในแหล่งข้อมูลทางการ ให้ความกระจ่างแก่บางแง่มุมของ [ROOT.Char.GetFaith.GetName] ที่ข้าไม่เคยรู้มาก่อนว่าเป็นส่วนหนึ่งของหลักคำสอนของศรัทธา"
 learning_theology_special.1001.d:0 "เราต้องฟื้นฟูการปฏิบัติโบราณเหล่านี้"
 learning_theology_special.1001.d.success:0 "ข้าประสบความสำเร็จในการผสานการค้นพบของข้าเข้ากับหลักคำสอน [THIS.Char.GetFaith.GetAdjective] ในปัจจุบัน"
 learning_theology_special.1001.d.failure:0 "ข้าไม่สามารถโน้มน้าวคณะสงฆ์ที่เหลือได้"
 learning_theology_special.1001.d.failure.toast:0 "ความพยายามของข้าในการผสานคัมภีร์นอกสารบบล้มเหลว"
 learning_theology_special.1001.e:0 "ต้องแจ้งให้ [vassal_pope.GetTitledFirstNameNoTooltip] ทราบเรื่องนี้!"
 learning_theology_special.1001.e.success:0 "ข้าโน้มน้าว [vassal_pope.GetTitledFirstName] ให้ผสานการค้นพบของข้าเข้ากับหลักคำสอน [THIS.Char.GetFaith.GetAdjective] ในปัจจุบัน"
 learning_theology_special.1001.e.failure:0 "[vassal_pope.GetTitledFirstNameNoTooltip] ปฏิเสธที่จะยอมรับว่าตำราเป็นของแท้"
 learning_theology_special.1001.e.failure.toast:0 "[vassal_pope.GetTitledFirstName] ปฏิเสธตำราว่าเป็นเรื่องหลอกลวงนอกรีต"
 learning_theology_special.1001.a:0 "[bishop.GetTitledFirstNameNoTooltip] สามารถช่วยข้าศึกษาตำรานี้ได้"
 learning_theology_special.1001.a.desc:0 "ขึ้นอยู่กับว่า [bishop.GetTitledFirstName] เคร่งครัดเพียงใด"
 learning_theology_special.1001.a.success:0 "[bishop.GetSheHe|U] จะช่วยข้าศึกษา"
 learning_theology_special.1001.a.success.toast:0 "[bishop.GetTitledFirstName] แสดงความยินดีกับข้าสำหรับการค้นพบที่หายากนี้"
 learning_theology_special.1001.a.failure:0 "[bishop.GetSheHe|U] จะนำหนังสือไปเผา"
 learning_theology_special.1001.a.failure.toast:0 "[bishop.GetTitledFirstName] ขอบคุณข้าที่นำหนังสือต้องห้ามนอกรีตมาสู่กองไฟ"
 learning_theology_special.1001.b:0 "ข้าควรศึกษาเรื่องนี้เป็นการส่วนตัวดีกว่า..."
 learning_theology_special.1001.c:0 "สิ่งสกปรกนอกรีตนี้ควรถูกเผา!"

 learning_theology_special.1002.t:0 "หลักคำสอนใหม่"
 learning_theology_special.1002.a.desc:0 "โดยการผสานเนื้อหาของตำราเก่าเข้ากับการปฏิบัติ [ROOT.Char.GetFaith.GetAdjective] สมัยใหม่ ข้าได้ทิ้งร่องรอยทางประวัติศาสตร์ไว้บนศรัทธาของเรา ซึ่งเป็นสิ่งที่ผู้สืบทอดของข้าน้อยคนนักจะหวังว่าจะเทียบเท่าได้\n\nผู้แทนที่โดดเด่นบางคนในคณะสงฆ์ของเรายังคงเยาะเย้ยการเปลี่ยนแปลงที่ไม่ปกตินี้ในหลักคำสอนของเรา แต่ด้วยวาทศิลป์ของข้า นักบวชผู้มีอิทธิพลส่วนใหญ่ได้ถูกโน้มน้าวถึงความชอบธรรมของการปฏิรูปของข้าแล้ว"
 learning_theology_special.1002.b.desc:0 "ไม่ใช่เรื่องง่ายเลยที่จะโน้มน้าว [vassal_pope.GetTitledFirstName] ถึงความเป็นของแท้ของตำราก่อน จากนั้นจึงโน้มน้าวผู้แทนคนสำคัญอื่น ๆ ของศรัทธา [ROOT.Char.GetFaith.GetAdjective] ที่อยู่ภายใต้ [vassal_pope.GetHerHim] แต่ความมุ่งมั่นและความรู้ด้านศาสนศาสตร์ของข้าก็ได้รับชัยชนะ\n\nผู้แทนที่โดดเด่นบางคนในคณะสงฆ์ของเรายังคงเยาะเย้ยการเปลี่ยนแปลงที่ไม่ปกตินี้ในหลักคำสอนของเรา แต่ผู้มีอิทธิพลส่วนใหญ่ได้ถูกโน้มน้าวถึงความชอบธรรมของมันแล้ว"
 learning_theology_special.1002.a:0 "เห็นได้ชัดว่า [ROOT.Char.GetFaith.HighGodName] [ROOT.Char.GetFaith.HighGodHerselfHimself] นำทางข้ามาสู่ตำราเล่มนี้!"

 learning_theology_special.1003.a.desc:0 "ด้วยปัญญาอันยิ่งใหญ่ของ [player_pope.GetHerHis] [player_pope.GetTitledFirstName] ได้ค้นพบตำราศาสนาโบราณที่เปลี่ยนแปลงหลักคำสอน [ROOT.Char.GetFaith.GetAdjective] อย่างมีนัยสำคัญ\n\nหลังจากหารือเกี่ยวกับการค้นพบของ [player_pope.GetHerHis] กับสมาชิกที่โดดเด่นของคณะสงฆ์ [player_pope.GetTitleTierName] ได้ตัดสินใจที่จะผสานเนื้อหาของหนังสือเข้ากับหลักคำสอนอย่างเป็นทางการของศรัทธา"
 learning_theology_special.1003.b.desc:0 "หลังจากการวิจัยที่ต้องใช้ความอุตสาหะและการศึกษาด้านเทววิทยาเป็นเวลาหลายชั่วโมง [pope_liege.GetTitledFirstName] ได้ค้นพบตำราศาสนาโบราณที่เปลี่ยนแปลงหลักคำสอน [ROOT.Char.GetFaith.GetAdjective] อย่างมีนัยสำคัญ\n\nหลังจากนำเสนอการค้นพบของ [pope_liege.GetHerHis] ต่อหน้า [vassal_pope.GetTitledFirstName] [vassal_pope.GetTitleTierName] ได้ตัดสินใจที่จะผสานเนื้อหาของหนังสือเข้ากับหลักคำสอนอย่างเป็นทางการของศรัทธา"
 learning_theology_special.1003.a:0 "สิ่งนี้หมายความว่าอย่างไรสำหรับพวกเราที่เหลือกันแน่?"

# Learned scholar come to your court, by Linnéa Thimrén
 learning_theology_special.1101.t:0 "อรรถกถา"
 learning_theology_special.1101.desc:0 ""ขอพรจงมีแด่ท่าน [ROOT.Char.Custom('FormOfAddressForLiege')] ข้าพเจ้าชื่อ [scholar.GetTitledFirstName]" รับบีตรงหน้าข้าโค้งคำนับอย่างนอบน้อม\n\n"ข้าพเจ้าอุทิศชีวิตให้กับการศึกษาและเขียนบทอรรถาธิบายเกี่ยวกับทานัคและทัลมุด บางทีงานเขียนและการชี้แนะของข้าพเจ้าอาจเป็นประโยชน์ต่อท่านในการศึกษา [ROOT.Char.GetFaith.ReligiousText] ของท่านเอง""
 learning_theology_special.1101.desc.fallback:0 ""ขอคารวะ [ROOT.Char.Custom('FormOfAddressForLiege')] ข้าพเจ้าชื่อ [scholar.GetTitledFirstName]" นักบวชตรงหน้าข้าโค้งคำนับอย่างนอบน้อม\n\n"ข้าพเจ้าอุทิศชีวิตให้กับการศึกษาและเขียน [ROOT.Char.GetFaith.ReligiousText] บางทีงานเขียนและการชี้แนะของข้าพเจ้าอาจเป็นประโยชน์ต่อท่านในการศึกษาของท่านเอง""
 learning_theology_special.1101.a:0 "มาเขียนอรรถกถาเกี่ยวกับ [ROOT.Char.GetFaith.ReligiousText] กันเถิด!"
 learning_theology_special.1101.b:0 "ข้ามีเรื่องเร่งด่วนกว่าในโลกแห่ง #emp ความเป็นจริง#!"
 learning_theology_special.1101.c:0 "ข้าจะไม่มีวันให้ที่พักพิงแก่นอกรีตภายใต้ชายคาของข้า!"

 learning_theology_special.1102.desc:0 "หลังจากทำงานหนักมาหลายวัน เรามองดูหน้ากระดาษที่กระจัดกระจายอยู่เบื้องหน้าเรา อรรถกถาที่เราเขียนนั้นครอบคลุมและละเอียดถี่ถ้วน ด้วยการชี้แนะของ [scholar.GetTitledFirstNamePossessive] ข้ามีความเข้าใจใหม่เกี่ยวกับ [ROOT.Char.GetFaith.ReligiousText]"
 learning_theology_special.1102.desc_dead:0 "หลังจากทำงานหนักมาหลายวัน ข้ามองดูหน้ากระดาษที่กระจัดกระจายอยู่เบื้องหน้าข้า อรรถกถาที่เขียนนั้นครอบคลุมและละเอียดถี่ถ้วน น่าเสียดายที่ [scholar.GetTitledFirstName] ไม่ได้อยู่ที่นี่เพื่อดูมัน"
 learning_theology_special.1102.desc_ending:0 "\n\nข้าเชื่อว่าคณะสงฆ์คงจะสนใจในงานที่ข้าได้ทำ!"
 learning_theology_special.1102.a.success:0 "ข้าโน้มน้าว [scholar.GetTitledFirstNameNoTooltip] ให้ทำต่อไป"
 learning_theology_special.1102.a.failure:0 "[scholar.GetTitledFirstNameNoTooltip] ไม่ถูกโน้มน้าว"
 learning_theology_special.1102.b:0 "เหตุใดข้าจึงควรแบ่งปันเกียรติยศ?"
 learning_theology_special.1102.c:0 "ทั้งหมดนี้ต้องขอบคุณ [scholar.GetFirstNameNoTooltip]!"
 learning_theology_special.1102.c.rl_desc:1 "ขึ้นอยู่กับว่า [scholar.GetTitledFirstNameNoTooltip] มีเกียรติเพียงใด"
 learning_theology_special.1102.c.success:0 "[scholar.GetSheHe|U] จะแบ่งปันเกียรติยศกับข้า"
 learning_theology_special.1102.c.failure:0 "[scholar.GetSheHe|U] จะรับความดีความชอบทั้งหมดไป"
 learning_theology_special.1102.c.success.toast:0 "[scholar.GetTitledFirstName] แบ่งปันเกียรติยศกับข้า"
 learning_theology_special.1102.c.failure.toast:0 "[scholar.GetTitledFirstName] รับความดีความชอบทั้งหมดไป"
 
 learning_theology_special.1102.b.success:0 "ข้าชิงไหวชิงพริบ [scholar.GetShortUINameNoTooltip]"
 learning_theology_special.1102.b.failure:0 "[scholar.GetShortUINameNoTooltip] เปิดเผยการตีสองหน้าของข้า"
 learning_theology_special.1102.d:0 "แต่ข้าก็ได้เรียนรู้มากมาย!"
 learning_theology.3002.desc.intro: "I have been studying the ancient religious texts and the writings of scholars, and they all seem to agree that [ROOT.Char.Custom('WorldDeadline')]. By my calculations we are less than a century away.\n\nHowever, my [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('chaplain'))], [chaplain.GetTitledFirstName], urges me to keep it to myself."
 learning_theology.3002.desc.clergy: "$learning_theology.3002.desc.intro$ "Such knowledge is for us of the cloth to weigh, not for the flock to fear. What if your calculations are wrong?""
