l_english: 
 wanderer_lifestyle_events.10.t: "ความฝันถึงการเดินทาง"
 wanderer_lifestyle_events.10.desc: "ห้องนี้ กำแพงเหล่านี้ เก้าอี้บ้าๆ ตัวนี้... ข้า #bold เบื่อหน่าย#! กับมันทั้งหมดเหลือเกิน\n\nข้า #emp ต้อง#! ออกไปจากที่นี่ ข้าต้องไปที่อื่น ที่ไหนก็ได้\n\nทุกวันที่ข้าติดอยู่ในห้องอันน่าสะพรึงกลัวนี้ ข้ารู้สึกเหมือนชีวิตอีกส่วนเล็กๆ ของข้าถูกพรากไป"
 wanderer_lifestyle_events.10.a: "ข้าต้องการพักจากทั้งหมดนี้..."
 wanderer_lifestyle_events.10.a.tt: "[traveling|E] จะลบ [modifier|E] ออก และให้ [stress_loss|E] และ [lifestyle_experience|E]"

 wanderer_restlessness_modifier: "ความกระสับกระส่าย"
 wanderer_restlessness_modifier_desc: "#emp [modifier|E] นี้จะหายไปในครั้งต่อไปที่ท่าน [travel|E] ไปที่ใดก็ได้#!\nทุกวันที่น่าหวาดหวั่นหมดไปกับการฝันถึงการได้ไปอยู่ที่อื่น"

 wanderer_restlessness_removal_title: "ความสงบ"

 wanderer_lifestyle_events.20.t: "ช่วงเวลาของข้าใน [reminiscing_location.GetNameNoTooltip]"
 wanderer_lifestyle_events.20.desc: "ขณะที่ข้ารื้อค้นข้าวของเพื่อหาสิ่งอื่น ข้าก็พบรูปปั้นเก่าแก่ของ [SCOPE.Custom('mythical_map_creatures')] ซึ่งข้าเก็บมาระหว่างการเยือน [reminiscing_location.GetName] เมื่อข้ามองดูมัน ข้าก็นึกถึง "
 wanderer_lifestyle_events.20.desc.special_building: "[reminiscing_location.GetHolding.GetSpecialBuildingType.GetName] สถานที่ที่ข้าไม่ได้นึกถึงมานานแล้ว"
 wanderer_lifestyle_events.20.desc.coastal: "ท่าเรือขนาดใหญ่และทิวทัศน์อันงดงามข้ามมหาสมุทร"
 wanderer_lifestyle_events.20.desc.river: "แม่น้ำที่ไหลผ่านเมือง และสะพานมากมายที่ทอดข้าม"
 wanderer_lifestyle_events.20.desc.castle: "ปราสาทอันน่าประทับใจที่ตั้งตระหง่านมองเห็นเมือง"
 wanderer_lifestyle_events.20.desc.city: "เมืองใหญ่อันสง่างามที่มีเขตต่างๆ มากมาย และซอกมุมเล็กๆ ทั้งหมด"
 wanderer_lifestyle_events.20.desc.people: "ผู้คนที่เป็นมิตรที่อาศัยอยู่ที่นั่น"
 wanderer_lifestyle_events.20.desc.outro_child: "\n\nขณะที่ข้ารำลึกความหลัง [listening_child.GetFirstName] ก็พรวดพราดเข้ามา "นั่นอะไรหรือ?" [listening_child.GetSheHe|U] ถาม พร้อมกับเหลือบมองรูปปั้นเล็กๆ ด้วยความสงสัย"
 wanderer_lifestyle_events.20.desc.outro: "\n\nขณะที่ข้ารำลึกความหลัง ข้ารู้สึกคิดถึงบ้าน บางที... บางทีมันอาจจะไม่เลวร้ายนักถ้าข้าออกเดินทางไปเยือน [reminiscing_location.GetNameNoTooltip] อีกครั้ง"
 wanderer_lifestyle_events.20.a: "ให้ข้าเล่าเรื่อง [SCOPE.Custom('mythical_map_creatures')] แห่ง [reminiscing_location.GetNameNoTooltip] ให้เจ้าฟัง!"
 wanderer_lifestyle_events.20.b: "สักวันหนึ่ง ข้าจะได้เห็น [reminiscing_location.GetNameNoTooltip] อีกครั้ง..."
 wanderer_lifestyle_events.20.b.child: "นี่มาจาก [reminiscing_location.GetNameNoTooltip] บางทีข้าอาจจะพาเจ้าไปที่นั่นได้สักวัน"

 wanderer_lifestyle_events.20.a.win: "[listening_child.GetSheHe|U] หลงใหลในเรื่องราว"
 wanderer_lifestyle_events.20.a.lose: "[listening_child.GetSheHe|U] ไม่ค่อยเชื่อเรื่องราว แต่ก็ยังคงสนุกกับมัน"

 wanderer_lifestyle_events.20.b.tt: "ท่านอาจได้รับ [wanderer_lifestyle|E] Experience หรือ [stress_loss|E] เพิ่มเติมหากท่าน [travel|E] ผ่าน [reminiscing_location.GetName]"

 wanderer_lifestyle_events.25.t: "การเยือนอีกครั้ง"
 wanderer_lifestyle_events.25.desc: "ข้าเดินไปตามถนนสายเดิมเหมือนครั้งสุดท้ายที่ข้าอยู่ใน [province_location.GetName] ข้าเห็นแผงลอยเดิมๆ ข้าได้กลิ่นเดิมๆ และได้ยินเสียงเดิมๆ\n\nมีความสบายใจที่รู้ว่าบางสิ่งยังไม่เปลี่ยนแปลง"
 wanderer_lifestyle_events.25.a: "นี่... คือสิ่งที่ข้าหวังไว้"

 wanderer_lifestyle_events.30.t: "ความฝันถึงดินแดนห่างไกล"
 wanderer_lifestyle_events.30.desc: "ขณะอ่านหนังสือของข้า ข้าพบบันทึกการเดินทางของพ่อค้าที่เดินทางผ่าน [ROOT.Char.Custom('DistantLandsRegionLoc')]\n\n"#emp ขณะที่เราเดินผ่าน [ROOT.Char.Custom('DistantLandsTerrainTypeLoc')] ข้าก็เหลือบไปเห็น [ROOT.Char.Custom('DistantLandsGroupTypeLoc')] [ROOT.Char.Custom('DistantLandsPluralTypeLoc')] [ROOT.Char.Custom('DistantLandsActivityTypeLoc')]#!""
 wanderer_lifestyle_events.30.desc.singular: "#emp มันมี [ROOT.Char.Custom('DistantLandsDescriptionTypeLoc')] ข้าเพียงแค่สังเกตมันอยู่ครู่หนึ่ง มันไม่เหมือนสิ่งใดที่ข้าเคยเห็นมาก่อน จนกระทั่งภายหลังข้าจึงได้รู้ชื่อของมัน#!""
 wanderer_lifestyle_events.30.desc.plural: "#emp พวกมันมี [ROOT.Char.Custom('DistantLandsDescriptionTypeLoc')] ข้าเพียงแค่สังเกตพวกมันอยู่ครู่หนึ่ง พวกมันไม่เหมือนสิ่งใดที่ข้าเคยเห็นมาก่อน จนกระทั่งภายหลังข้าจึงได้รู้ชื่อของพวกมัน#!""
 wanderer_lifestyle_events.30.a.singular: "สักวันหนึ่ง ข้าจะเห็นมันด้วยตาของข้าเอง"
 wanderer_lifestyle_events.30.a.plural: "สักวันหนึ่ง ข้าจะเห็นพวกมันด้วยตนเอง"

 wanderer_lifestyle_events.30.a.europe: "ท่านอาจได้รับ [wanderer_lifestyle|E] Experience หรือ [stress_loss|E] เพิ่มเติมหากท่าน [travel|E] ผ่าน [GetGeographicalRegion('world_europe').GetName]"
 wanderer_lifestyle_events.30.a.africa: "ท่านอาจได้รับ [wanderer_lifestyle|E] Experience หรือ [stress_loss|E] เพิ่มเติมหากท่าน [travel|E] ผ่าน [GetGeographicalRegion('world_africa').GetName]"
 wanderer_lifestyle_events.30.a.asia: "ท่านอาจได้รับ [wanderer_lifestyle|E] Experience หรือ [stress_loss|E] เพิ่มเติมหากท่าน [travel|E] ผ่าน [GetGeographicalRegion('world_middle_east').GetName]"
 wanderer_lifestyle_events.30.a.india: "ท่านอาจได้รับ [wanderer_lifestyle|E] Experience หรือ [stress_loss|E] เพิ่มเติมหากท่าน [travel|E] ผ่าน [GetGeographicalRegion('world_india').GetName]"
 wanderer_lifestyle_events.30.a.tibet: "ท่านอาจได้รับ [wanderer_lifestyle|E] Experience หรือ [stress_loss|E] เพิ่มเติมหากท่าน [travel|E] ผ่าน [GetGeographicalRegion('world_tibet').GetName]"
 wanderer_lifestyle_events.30.a.steppe: "ท่านอาจได้รับ [wanderer_lifestyle|E] Experience หรือ [stress_loss|E] เพิ่มเติมหากท่าน [travel|E] ผ่าน [GetGeographicalRegion('world_steppe').GetName]"

 wanderer_lifestyle_events.35.t: "ความฝันเป็นจริง"
 wanderer_lifestyle_events.35.desc.singular: "ขณะที่เราเดินทางผ่าน [province_location.Custom('HoldingNoHoldingTerrainRoaming')] ข้าก็เห็นสัตว์ตัวหนึ่ง [ROOT.Char.Custom('DistantLandsActivityTypeLoc')] ในตอนแรก ข้าสงสัยว่านี่คือสัตว์ชนิดใด แต่แล้วข้าก็นึกถึงคำบรรยายเก่าๆ ที่ข้าเคยอ่านเมื่อนานมาแล้ว — นี่ต้องเป็น [ROOT.Char.Custom('DistantLandsPluralTypeLoc')] แน่!\n\n[ROOT.Char.Custom('DistantLandsDescriptionTypeLoc')|U] มันเกือบจะเหมือนกับที่บันทึกการเดินทางบอกไว้ทุกประการ "
 wanderer_lifestyle_events.35.desc.singular.adorable: "แต่กระนั้นมันก็น่ารักกว่าที่ข้าจินตนาการไว้มาก มีบางอย่างเกี่ยวกับมันที่ดึงดูดใจข้า"
 wanderer_lifestyle_events.35.desc.singular.neutral: "แต่กระนั้นก็แตกต่างจากที่ข้าคาดไว้เล็กน้อย แต่ไม่ใช่ในทางที่ไม่ดี"
 wanderer_lifestyle_events.35.desc.singular.taken_aback: "แต่กระนั้นข้าก็รู้สึกประหลาดใจเล็กน้อยกับรูปลักษณ์ของมัน... อย่างไรก็ตาม ข้ารู้สึกปลาบปลื้มที่ในที่สุดก็ได้ตามหามันเจอ!"
 wanderer_lifestyle_events.35.desc.plural: "ขณะที่เราเดินทางผ่าน [province_location.Custom('HoldingNoHoldingTerrainRoaming')] ข้าก็เห็นสัตว์หลายตัว [ROOT.Char.Custom('DistantLandsActivityTypeLoc')] ในตอนแรก ข้าสงสัยว่านี่คือสัตว์ชนิดใด แต่แล้วข้าก็นึกถึงคำบรรยายเก่าๆ ที่ข้าเคยอ่านเมื่อนานมาแล้ว — นี่ต้องเป็น [ROOT.Char.Custom('DistantLandsPluralTypeLoc')] แน่!\n\n[ROOT.Char.Custom('DistantLandsDescriptionTypeLoc')|U] พวกมันเกือบจะเหมือนกับที่บันทึกการเดินทางบอกไว้ทุกประการ "
 wanderer_lifestyle_events.35.desc.plural.adorable: "แต่กระนั้นพวกมันก็น่ารักกว่าที่ข้าจินตนาการไว้มาก มีบางอย่างเกี่ยวกับพวกมันที่ดึงดูดใจข้า"
 wanderer_lifestyle_events.35.desc.plural.neutral: "$wanderer_lifestyle_events.35.desc.singular.neutral$"
 wanderer_lifestyle_events.35.desc.plural.taken_aback: "แต่กระนั้นข้าก็รู้สึกประหลาดใจเล็กน้อยกับรูปลักษณ์ของพวกมัน... อย่างไรก็ตาม ข้ารู้สึกปลาบปลื้มที่ในที่สุดก็ได้ตามหาพวกมันเจอ!"
 wanderer_lifestyle_events.35.a: "มันเป็นของข้า!"
 wanderer_lifestyle_events.35.a.win: "ท่านจับ [ROOT.Char.Custom('DistantLandsLoc')] ได้สำเร็จ"
 wanderer_lifestyle_events.35.a.lose: "ท่าน ทำให้ตัวเองดูโง่เขลา"
 wanderer_lifestyle_events.35.b.singular: "ในที่สุดการได้เห็นสักตัวก็เพียงพอสำหรับข้าแล้ว"
 wanderer_lifestyle_events.35.b.plural: "ในที่สุดการได้เห็นพวกมันก็เพียงพอสำหรับข้าแล้ว"

 wanderer_lifestyle_events.40.t: "เหตุเฟอะฟะในตลาด"
 wanderer_lifestyle_events.40.desc: "การเดินทางของข้า[ROOT.Char.GetLocationDesc|l]เป็นไปด้วยดี, แต่, ช่วงเวลาที่ยากลำบากกำลังมาเยือนเมื่อเสบียงอาหารของเราใกล้จะหมดสิ้นแล้ว! กลิ่น[ROOT.Char.Custom('GetExpensiveMeal')]ที่ปรุงสดใหม่ยั่วยวนข้า, และเมื่อตามกลิ่นไป, ข้าก็พบแผงลอยที่ดูแปลกตา [ROOT.Char.Custom('GetLocalStreetFoodPlural')]นานาชนิดและชิ้นส่วนของ[ROOT.Char.Custom('GetRegionalFish')]ถูกจัดแสดงไว้, โดยมีอาหารที่เสิร์ฟพร้อมกับ... [ROOT.Char.Custom('FavoriteTreat')]รสหวาน?\n\nแต่ช่างเถิด, ราคานับว่าถูกมากทีเดียว! พ่อค้าพึมพำบางอย่างที่ข้าฟังไม่เข้าใจ, และทำท่าทางให้ข้าจ่ายเงินให้[provisions_merchant.GetHerHim]มากกว่าคนท้องถิ่น, และถึงแม้ข้าจะยังประหยัดเงินได้บ้าง, ข้าก็ควรจะโต้แย้ง แต่ข้าแทบจะไม่รู้จักภาษา[provisions_merchant.GetCulture.GetLanguage.GetNameNoTooltip]เลย..."
 wanderer_lifestyle_events.40.fold: "จ่ายให้[provisions_merchant.GetHerHim]ตามที่[provisions_merchant.GetSheHe]ขอก็แล้วกัน, ให้มันจบๆ ไปเสียที"
 wanderer_lifestyle_events.40.barter: "ข้ามีแผนของข้าอยู่แล้ว, ถึงแม้ข้าจะพูดภาษาที่ฟังไม่รู้เรื่องนั้นไม่ได้ก็ตาม"
 wanderer_lifestyle_events.40.language: "บางทีภาษา[provisions_merchant.GetCulture.GetLanguage.GetNameNoTooltip]อาจจะไม่ใช่สิ่งแปลกใหม่อย่างสิ้นเชิงสำหรับข้า..."
 wanderer_lifestyle_events.40.meh: "อันที่จริง เรามีอาหารอยู่ที่พักแล้ว"
 wanderer_lifestyle_events.40.language_tt: "ท่านพยายามสื่อสารกับ[provisions_merchant.GetName]ด้วยภาษาแม่ของ[provisions_merchant.GetHerHis]"
 wanderer_lifestyle_events.40.language_tt.success: "ท่านสื่อสารกับ[provisions_merchant.GetHerHim]ได้สำเร็จ, และ ดังนั้นจึงได้รับราคา#EMPท้องถิ่น#!"
 wanderer_lifestyle_events.40.language_learned: "การสืบเสาะทางภาษาของท่านบังเกิดผล"
 wanderer_lifestyle_events.40.language_nothing: "ท่านไม่ได้เรียนรู้ภาษา, แต่ท่านก็ยังคงได้ราคาท้องถิ่น"
 wanderer_lifestyle_events.40.language_tt.fail: "สถานการณ์ยิ่งสับสนมากขึ้น, และท่านก็ยังคงต้องจ่ายเพิ่มอยู่ดี"
 wanderer_lifestyle_events.40.barter_tt: "ท่านพยายาม#EMPโน้มน้าว#!ให้[provisions_merchant.GetName]ลดราคาให้ท่านเป็นราคาท้องถิ่น"
 wanderer_lifestyle_events.40.barter_tt.success: "[provisions_merchant.GetSheHe|U]ประทับใจในความพยายามของท่าน, จึงยอมขายให้ในราคาที่ต่ำกว่า"
 wanderer_exotic_animal_modifier: "สัตว์แปลก"
 wanderer_exotic_animal_modifier_desc: "ไม่มีอะไรน่าประทับใจเท่ากับสัตว์แปลกที่ไม่มีใครเคยเห็นมาก่อน!"
 wanderer_lifestyle_events.40.success_title: "ท่านต่อรองราคากับ[provisions_merchant.GetHerHim]ได้สำเร็จ"
 wanderer_lifestyle_events.40.fail_title: "[provisions_merchant.GetFirstNameNoTooltip]ไม่ประทับใจ"

