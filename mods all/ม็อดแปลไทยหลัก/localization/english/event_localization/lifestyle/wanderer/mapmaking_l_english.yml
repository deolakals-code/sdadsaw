l_english: 
 mapmaking.0001.t: "กำหนดการเดินทางและแผนภูมิ"
 mapmaking.0001.desc: "ถึงเวลาแล้วที่จะบันทึกสิ่งที่ข้าได้เรียนรู้ระหว่างการเดินทาง เพื่อให้ผู้อื่นสามารถเรียนรู้จากประสบการณ์ของข้าได้ กำหนดการเดินทางโดยละเอียดพร้อมแผนที่และแผนภูมิจะช่วยให้ข้าสามารถเผยแพร่ข้อมูลเชิงลึกที่ได้มาอย่างยากลำบากแก่ผู้อื่นได้\n\nการตัดสินใจแรกที่ข้าต้องทำคือการเดินทางใดที่ข้าต้องการนำมาใช้ในโครงการนี้"
 mapmaking.0001.a: "อาณาเขตของ[ROOT.Char.GetPrimaryTitle.GetNameNoTooltip]"
 mapmaking.0001.a.tt: "โครงการนี้จะอิงจากการเยือน[visited_own_county.GetName]และที่ดินอื่นๆ ในอาณาเขตของท่าน\nสิ่งนี้จะ ส่งผลให้ได้สิ่งประดิษฐ์ที่ทรงพลังยิ่งขึ้นหากท่านได้เยือนที่ดินใน[domain|E]หลายแห่ง"
 mapmaking.0001.b: "ดินแดนของ[visited_own_vassal_title.GetNameNoTooltip]"
 mapmaking.0001.b.tt: "โครงการนี้จะอิงจากการเยือน[visited_own_vassal.GetName]และเมืองหลวงของข้าหลวงอื่นๆ\nสิ่งนี้จะ ส่งผลให้ได้สิ่งประดิษฐ์ที่ทรงพลังยิ่งขึ้นหากท่านได้เยือนเมืองหลวง[capital|E]หลายแห่งของ[powerful_vassals|E]"
 mapmaking.0001.c: "เส้นทางสู่[poi_map_target.GetHolding.GetSpecialBuildingType.GetNameNoTooltip]" #[location.Custom('GetSpecialBuildingPrefix')]
 mapmaking.0001.c.tt: "โครงการนี้จะอิงจากการเยือน[poi_map_target.GetName]และ[point_of_interest|E]ของมัน\nสิ่งนี้จะ ส่งผลให้ได้สิ่งประดิษฐ์ที่ทรงพลังยิ่งขึ้นหากท่านมีประสบการณ์ลักษณะนิสัย[GetTrait('lifestyle_traveler').GetName( GetNullCharacter )]มากขึ้น"
 mapmaking.0001.d: "แผนที่ของ[foreign_kingdom_map_target.GetNameNoTooltip]"
 mapmaking.0001.d.tt: "โครงการนี้จะอิงจากการเยือน[foreign_capital_map_target.GetName] เมืองหลวงของ[foreign_capital_map_target.GetTitle.GetHolder.GetPrimaryTitle.GetName]\nสิ่งนี้จะ ส่งผลให้ได้สิ่งประดิษฐ์ที่ทรงพลังยิ่งขึ้นหากท่านมีประสบการณ์ลักษณะนิสัย[GetTrait('lifestyle_traveler').GetName( GetNullCharacter )]มากขึ้น"
 mapmaking.0001.z: "[visited_own_liege.GetNameNoTooltip]"
 mapmaking.0010.t: "การทำแผนที่อาณาเขต"
 mapmaking.0010.desc: "เจ้านายที่ดีทุกคนจะรู้จักอาณาจักรของ[ROOT.Char.GetHerHis] [ROOT.Char.GetSheHe|U]จะรู้ว่าควรขอความช่วยเหลือจากใครในการทำงานให้สำเร็จ ที่ใดมีที่ดินว่างเปล่า สิ่งใดที่ต้องบำรุงรักษา ความท้าทายใดที่ต้องเอาชนะ\n\nขณะที่ข้านั่งลงวาดแผนที่เพื่ออธิบายดินแดนของข้า ข้าต้องใคร่ครวญว่าสิ่งใดที่ข้าถือว่าเป็นข้อมูลสำคัญสำหรับผู้อ่านแผนที่ที่ข้ากำลังวาด ข้าได้เรียนรู้อะไรบ้างจากการเดินทางของข้า?"
 mapmaking.0010.a: "ควรเน้นที่ทรัพยากรที่ยังไม่ได้ใช้ประโยชน์"
 mapmaking.0010.a.tt: "สิ่งนี้จะ ส่งผลให้ได้กำหนดการเดินทางพร้อมประโยชน์ที่เกี่ยวข้องกับเศรษฐกิจของ[domain|E]\nตัวเลือกนี้ได้รับประโยชน์จากการมี[stewardship|E]ของตัวละครที่สูงขึ้น"
 mapmaking.0010.b: "การป้องกันอาณาจักรเป็นสิ่งสำคัญยิ่ง"
 mapmaking.0010.b.tt: "สิ่งนี้จะ ส่งผลให้ได้กำหนดการเดินทางพร้อมประโยชน์ที่เกี่ยวข้องกับการป้องกัน[domain|E]ของท่าน\nตัวเลือกนี้ได้รับประโยชน์จากการมี[martial|E]ของตัวละครที่สูงขึ้น"
 mapmaking.0020.t: "ดินแดนของ[visited_own_vassal_title.GetNameNoTooltip]"
 mapmaking.0020.desc: "จากการเยือนดินแดนของข้าหลวงของข้า ข้าได้เรียนรู้ว่าพวกเขาปฏิบัติต่อราษฎรอย่างไร สิ่งที่พวกเขาขาดแคลนและสิ่งที่พวกเขามีอย่างเหลือเฟือ ข้าอาจมีความคิดที่ดีเกี่ยวกับสถานที่ที่จะค้นพบความลับและความมั่งคั่งของพวกเขาด้วยซ้ำ\n\nอย่างไรก็ตาม ทั้งหมดนั้นไม่สามารถอธิบายได้ง่ายๆ ในแผนที่เดียว ข้าจะต้องตัดสินใจว่าข้ากำลังสร้างแผนที่ประเภทใด"
 mapmaking.0020.a: "ข้าจะแสดงวิธีควบคุมพวกเขา"
 mapmaking.0020.a.tt: "สิ่งนี้จะ ส่งผลให้ได้กำหนดการเดินทางพร้อมประโยชน์ที่เกี่ยวข้องกับ[dread|E]\nตัวเลือกนี้ได้รับประโยชน์จากการมีประสบการณ์โชกโชนในลักษณะนิสัย[GetTrait('lifestyle_traveler').GetName( GetNullCharacter )]สูง"
 mapmaking.0020.b: "แผนที่นี้จะช่วยให้ข้าช่วยเหลือพวกเขาได้"
 mapmaking.0020.b.tt: "สิ่งนี้จะ ส่งผลให้ได้กำหนดการเดินทางพร้อมประโยชน์ที่เกี่ยวข้องกับความสัมพันธ์ที่ดีกับ[vassals|E]และ[courtiers|E]\nตัวเลือกนี้ได้รับประโยชน์จากการมี[diplomacy|E]ของตัวละครที่สูงขึ้น"
 mapmaking.0020.c: "แผนที่ของข้าจะเปิดเผยความลับของพวกเขา"
 mapmaking.0020.c.tt: "สิ่งนี้จะ ส่งผลให้ได้กำหนดการเดินทางพร้อมประโยชน์ที่เกี่ยวข้องกับ[schemes|E]\nตัวเลือกนี้ได้รับประโยชน์จากการมี[intrigue|E]ของตัวละครที่สูงขึ้น"
 mapmaking.0030.t: "ยังไม่ได้สำรวจ"
 mapmaking.0030.desc: "[poi_map_target.Custom('GetSpecialBuildingPrefix')|U][poi_map_target.GetHolding.GetSpecialBuildingType.GetNameNoTooltip] อาจเป็นหนึ่งในสถานที่ที่สร้างความประทับใจให้ข้ามากที่สุดในการเดินทาง การเดินทางไปยัง[poi_map_target.GetHolding.GetNameNoTooltip]เองก็น่าจดจำเกือบเท่ากัน และน่าจะไปได้เร็วกว่านี้มากหากข้าเตรียมตัวดีกว่านี้\n\nอย่างไรก็ตาม ข้าสามารถถ่ายทอดข้อมูลได้เพียงเท่านี้ และขณะที่ข้านั่งลงเพื่ออธิบายสิ่งที่เกิดขึ้น ข้าจะต้องตัดสินใจว่าควรให้ความสำคัญกับสิ่งใด" #[location.Custom('GetSpecialBuildingPrefix')]
 mapmaking.0030.a: "ไม่มีอะไรสำคัญไปกว่าการเดินทางที่รวดเร็วและปลอดภัย"
 mapmaking.0030.a.tt: "การมุ่งเน้นไปที่การเดินทางไปยัง[poi_map_target.GetHolding.GetNameNoTooltip]จะ ส่งผลให้ได้กำหนดการเดินทางที่เป็นประโยชน์ต่อความปลอดภัยและความเร็วในการ[travel|E]\nตัวเลือกนี้ได้รับประโยชน์จากการมีประสบการณ์โชกโชนในลักษณะนิสัย[GetTrait('lifestyle_traveler').GetName( GetNullCharacter )]สูง"
 mapmaking.0030.b: "ข้าจะวาดแผนภูมิของ[poi_map_target.GetHolding.GetNameNoTooltip]เอง"
 mapmaking.0030.b.tt: "การมุ่งเน้นไปที่[poi_map_target.Custom('GetSpecialBuildingPrefix')][poi_map_target.GetHolding.GetSpecialBuildingType.GetNameNoTooltip] จะ ส่งผลให้ได้กำหนดการเดินทางพร้อมประโยชน์ที่เกี่ยวข้องกับประเภทของ[point_of_interest|E]\nตัวเลือกนี้ได้รับประโยชน์จากการมีประสบการณ์นักเดินทางในลักษณะนิสัย[GetTrait('lifestyle_traveler').GetName( GetNullCharacter )]สูง"
 mapmaking.0040.t: "[foreign_kingdom_map_target.GetNameNoTooltip]"
 mapmaking.0040.desc: "การเดินทางของข้าไปยัง[foreign_kingdom_map_target.GetNameNoTier]สอนข้าหลายสิ่งหลายอย่าง ไม่เพียง แต่เกี่ยวกับราษฎร[foreign_kingdom_map_target.GetAdjectiveNoTooltip]เท่านั้น แต่ยังเกี่ยวกับความแตกต่างของดินแดนของพวกเขาจากดินแดนของเราด้วย ชาว[foreign_kingdom_map_target.GetAdjectiveNoTooltip]มีขนบธรรมเนียมของตนเอง และหาเลี้ยงชีพด้วยวิธีที่แตกต่างจากเรา ในหลายๆ ด้าน ดินแดนนั้นก็แปลกใหม่สำหรับข้า เช่นกัน\n\nขณะที่ข้าเริ่มอธิบายสิ่งที่ข้าได้เรียนรู้ ข้าจะต้องตัดสินใจว่าควรให้ความสำคัญกับสิ่งใด และสิ่งที่ข้าต้องการให้นักเดินทางคนอื่นๆ รู้เกี่ยวกับเรื่องนี้"
 mapmaking.0040.a: "ราชสำนักที่[background_terrain_scope.GetTitle.GetNameNoTierNoTooltip]นั้นน่าจดจำอย่างแท้จริง"
 mapmaking.0040.a.tt: "การมุ่งเน้นไปที่ราชสำนักจะ ส่งผลให้ได้กำหนดการเดินทางพร้อมประโยชน์ที่เกี่ยวข้องกับ[prestige|E]\nตัวเลือกนี้ได้รับประโยชน์จากการมีประสบการณ์นักเดินทางในลักษณะนิสัย[GetTrait('lifestyle_traveler').GetName( GetNullCharacter )]สูง"
 mapmaking.0040.b: "ข้าจะมุ่งเน้นไปที่ผู้คนและขนบธรรมเนียมของพวกเขา"
 mapmaking.0040.b.tt: "การมุ่งเน้นไปที่ผู้คนจะ ส่งผลให้ได้กำหนดการเดินทางพร้อมประโยชน์ที่เกี่ยวข้องกับ[diplomacy|E]\nตัวเลือกนี้ได้รับประโยชน์จากการมีประสบการณ์โชกโชนในลักษณะนิสัย[GetTrait('lifestyle_traveler').GetName( GetNullCharacter )]สูง"
 mapmaking.0040.c: "ทุกคนต้องรู้เกี่ยวกับ[SCOPE.Custom('mythical_map_creatures')][foreign_kingdom_map_target.GetAdjectiveNoTooltip]!"
 mapmaking.0040.c.tt: "การมุ่งเน้นไปที่สิ่งมีชีวิตในตำนานจะ ส่งผลให้ได้กำหนดการเดินทางพร้อมประโยชน์ที่เกี่ยวข้องกับ[dynasty_prestige|E]"
 mapmaking.0004.t: "[background_terrain_scope.Custom('GetTerrainLandPlural')|U]แห่ง[background_terrain_scope.GetTitle.GetDeJureLiege.GetDeJureLiege.GetNameNoTierNoTooltip]"
 mapmaking.0004.heat.t: "ความร้อนระอุแห่ง[background_terrain_scope.GetTitle.GetDeJureLiege.GetDeJureLiege.GetNameNoTierNoTooltip]"
 mapmaking.0004.snow.t: "[background_terrain_scope.Custom('GetBadWeatherDesc')|U][background_terrain_scope.GetTitle.GetDeJureLiege.GetDeJureLiege.GetAdjectiveNoTooltip]"
 mapmaking.0004.fighting.t: "ภยันตรายแห่ง[background_terrain_scope.GetTitle.GetDeJureLiege.GetDeJureLiege.GetNameNoTierNoTooltip]"
 mapmaking.0004.monsoon.t: "สายฝนแห่ง[background_terrain_scope.GetTitle.GetDeJureLiege.GetDeJureLiege.GetNameNoTierNoTooltip]"
 mapmaking.0004.desc.intro: "กำหนดการเดินทางใดๆ ต้องเตือนผู้อ่านถึงอันตรายที่รออยู่ข้างหน้า\n\n"
 mapmaking.0004.fighting.desc: "การเดินทางผ่านพื้นที่นี้สอนให้ข้าระวังการซุ่มโจมตีและการโจมตีอยู่เสมอ กฎของผู้แข็งแกร่งคือกฎหมายใน[background_terrain_scope.GetTitle.GetDeJureLiege.GetDeJureLiege.GetNameNoTierNoTooltip] ไม่ว่าจะพบกับพวกนอกกฎหมาย บารอนท้องถิ่น หรือกองทัพต่างชาติ ข้าต้องพร้อมที่จะป้องกันตัวเองเสมอ\n\n"
 mapmaking.0004.snow.desc: "ข้าจะไม่มีวันลืมฤดูหนาวของ[background_terrain_scope.GetTitle.GetDeJureLiege.GetDeJureLiege.GetNameNoTierNoTooltip] ด้วยพายุหิมะกะทันหัน อุณหภูมิที่ลดลง และทะเลหิมะสีขาวที่ดูเหมือนไม่มีที่สิ้นสุดที่เราต้องลุยผ่าน\n\n"
 mapmaking.0004.heat.desc: "ความทรงจำที่แข็งแกร่งที่สุดของข้าเกี่ยวกับ[background_terrain_scope.GetTitle.GetDeJureLiege.GetDeJureLiege.GetNameNoTierNoTooltip]คือรังสีอันไร้ความปรานีของดวงอาทิตย์ ขณะที่เราเดินทางข้าม[background_terrain_scope.Custom('GetTerrainLandPlural')] เรามองหาร่มเงาและน้ำจืดอยู่ตลอดเวลา\n\n"
 mapmaking.0004.monsoon.desc: "ฝนตกหนักของ[background_terrain_scope.GetTitle.GetDeJureLiege.GetDeJureLiege.GetNameNoTierNoTooltip]จะไม่มีวันลืมเลือนสำหรับข้า ในฤดูมรสุม แม้ แต่เส้นทางที่ปลอดภัยที่สุดก็จะกลายเป็นหล่มโคลน\n\n"
 mapmaking.0004.terrain_steppes.desc: "ทุ่งหญ้าสเตปป์ที่เปิดโล่งนั้นเป็นลักษณะที่โดดเด่นที่สุดของพื้นที่นี้ในหลายๆ ด้าน ป่าเถื่อน ไม่ถูกควบคุม และยากต่อการเพาะปลูก ดินแดนแห่งนี้มีเสบียงหรือน้ำจืดเพียงเล็กน้อย..."
 mapmaking.0004.terrain_deep_forests.desc: "ป่าลึกจะกำหนดรูปแบบการเดินทางใดๆ ผ่านพื้นที่นี้ เส้นทางใดที่จะใช้ วิธีหาอาหารและล่าสัตว์เป็นความทรงจำที่ขาดไม่ได้ที่ข้ามีจาก[background_terrain_scope.GetTitle.GetDeJureLiege.GetDeJureLiege.GetNameNoTierNoTooltip]..."
 mapmaking.0004.terrain_wetlands.desc: "พื้นที่ชุ่มน้ำเป็นลักษณะที่น่าจดจำของพื้นที่นี้ และวิธีที่ดีที่สุดในการหาทางผ่านหมอกและพื้นดินที่ทรยศเป็นสิ่งที่เข้ามาในใจข้าทันที..."
 mapmaking.0004.terrain_undulating.desc: "การเดินทางในพื้นที่นี้คือการเตรียมพร้อมสำหรับการเดินทางที่ยากลำบาก เนื่องจากระดับความสูงเปลี่ยนแปลงตลอดเวลา ในด้านบวก ข้ายังคงนึกถึงทิวทัศน์อันงดงามบางส่วนจากด้านบน..."
 mapmaking.0004.terrain_open_farmland.desc: "การตุนเสบียงไม่เคยเป็นปัญหาสำหรับเราที่นี่ พื้นที่นี้ไม่ใช่พื้นที่อันตราย ทุ่งนาที่ได้รับการดูแลอย่างดีทอดยาวไปทุกทิศทางจาก[background_terrain_scope.GetTitle.GetNameNoTierNoTooltip]..."
 mapmaking.0004.terrain_open.desc: "ประเทศที่เปิดกว้างหมายความว่าข้าไม่สามารถปกปิดการมาถึงของเราในพื้นที่นี้ได้ แต่เราต้องพร้อมที่จะเผชิญหน้ากับศัตรูโดยตรง..."
 mapmaking.0004.terrain_desert.desc: "ทะเลทรายเรียกร้องอย่างมากจากข้าขณะที่ข้าเดินทางผ่านพื้นที่นี้ — ในที่โล่งกว้างไม่มีทางที่จะซ่อนตัวจากดวงอาทิตย์หรือจากศัตรูได้"
 mapmaking.0004.terrain_jungle.desc: "ป่าดงดิบเป็นที่อยู่ของสัตว์และพืชมากมาย ทั้งที่เป็นประโยชน์และเป็นอันตรายถึงชีวิต การรู้จักแยกแยะสิ่งหนึ่งออกจากอีกสิ่งหนึ่ง และรู้วิธีตั้งค่ายพักแรมอย่างเหมาะสม เป็นประสบการณ์ที่ขาดไม่ได้..."
 mapmaking.0004.desc.generic_fallback: "ข้าไม่ค่อยได้เห็นดินแดนที่ไม่น่าสนใจ เช่นนี้ทั้งก่อนและหลัง ลักษณะที่ไม่โดดเด่นของดินแดนนั้นสะท้อนให้เห็นโดยผู้คนที่ไม่มีอะไรโดดเด่นพอๆ กัน"
 mapmaking.0004.a: "มุ่งเน้นไปที่การเดินทางใน[background_terrain_scope.Custom('GetTerrainLandPlural')]"
 mapmaking.0004.a.tt: "ตัวเลือกนี้จะ ส่งผลให้ได้สิ่งประดิษฐ์พร้อมประโยชน์ที่เกี่ยวข้องกับ[terrain|E][background_terrain_scope.GetTerrain.GetName]"
 mapmaking.0004.b: "ข้าจะอธิบายการเตรียมการซุ่มโจมตี"
 mapmaking.0004.b.tt: "ตัวเลือกนี้จะ ส่งผลให้ได้สิ่งประดิษฐ์พร้อมประโยชน์ที่เกี่ยวข้องกับความปลอดภัยในการ[travel|E]และการป้องกันตนเอง"
 mapmaking.0004.c: "มุ่งเน้นไปที่วิธีรับมือกับความหนาวเย็น"
 mapmaking.0004.c.tt: "ตัวเลือกนี้จะ ส่งผลให้ได้สิ่งประดิษฐ์พร้อมประโยชน์ที่เกี่ยวข้องกับฤดูหนาว"
 mapmaking.0004.d: "การรับมือกับความร้อนเป็นสิ่งสำคัญยิ่ง"
 mapmaking.0004.d.tt: "ตัวเลือกนี้จะ ส่งผลให้ได้สิ่งประดิษฐ์พร้อมประโยชน์ที่เกี่ยวข้องกับความปลอดภัยในการ[travel|E]ใน[terrain|E]ที่ร้อน"
 mapmaking.0004.e: "มรสุมมีความสำคัญมากกว่า"
 mapmaking.0004.e.tt: "ตัวเลือกนี้จะ ส่งผลให้ได้สิ่งประดิษฐ์พร้อมประโยชน์ที่เกี่ยวข้องกับความปลอดภัยในการ[travel|E]ใน[terrain|E]ที่เปียกชื้น"
 mapmaking.1000.t: "การเดินทางสู่[background_terrain_scope.GetTitle.GetDeJureLiege.GetDeJureLiege.GetDeJureLiege.GetNameNoTooltip]"
 mapmaking.1000.internal.t: "การเดินทางใน[background_terrain_scope.GetTitle.GetDeJureLiege.GetDeJureLiege.GetDeJureLiege.GetNameNoTooltip]"
 mapmaking.1000.mythical.t: "การเดินทางสู่ดินแดนแห่ง[SCOPE.Custom('mythical_map_creatures')|U]"
 mapmaking.1000.desc: "ขณะที่ข้าเติมหน้าสุดท้ายของต้นฉบับของข้า มันเป็นความรู้สึกพึงพอใจอย่างยิ่ง\n\nการเขียนสิ่งที่ข้าได้เรียนรู้ในการเดินทางของข้าเป็นประสบการณ์ที่ชวนให้คิดถึงอดีตในหลายๆ ด้าน มัน ทำให้ข้าได้หวนนึกถึงช่วงเวลาที่หล่อหลอมตัวตนในอดีตของข้า ขณะเดียวกันก็สร้างสรรค์สิ่งที่สามารถช่วยเหลือนักเดินทางในอนาคตได้\n\nข้าหวังว่ากำหนดการเดินทางที่ได้และแผนที่โดยละเอียดประกอบเส้นทางของข้าผ่าน[background_terrain_scope.GetTitle.GetDeJureLiege.GetDeJureLiege.GetDeJureLiege.GetNameNoTooltip]จะสามารถยืนหยัดผ่านการทดสอบของกาลเวลาได้"
 mapmaking.1000.a: "การเดินทางครั้งนี้สิ้นสุดลงแล้ว"
 map_artifact_name: "การเดินทางสู่[background_terrain_scope.GetTitle.GetDeJureLiege.GetDeJureLiege.GetDeJureLiege.GetNameNoTooltip]"
 map_artifact_name_domain: "อาณาเขตของ[author.GetTitledFirstNameNoTooltip]"
 map_artifact_name_vassal_dread: "ว่าด้วยการปราบปรามข้าหลวง[background_terrain_scope.GetTitle.GetDeJureLiege.GetDeJureLiege.GetDeJureLiege.GetAdjectiveNoTooltip]"
 map_artifact_name_vassal_opinion: "การเดินทางในอาณาจักร[background_terrain_scope.GetTitle.GetHolder.GetLiege.GetPrimaryTitle.GetAdjectiveNoTooltip]"
 map_artifact_name_vassal_intrigue: "กำหนดการเดินทางลับแห่งอาณาจักร[background_terrain_scope.GetTitle.GetHolder.GetLiege.GetPrimaryTitle.GetAdjectiveNoTooltip]"
 map_artifact_name_poi: "การเดินทางสู่[poi_map_target.GetHolding.GetSpecialBuildingType.GetNameNoTooltip]"
 map_artifact_name_mythical: "ดินแดนแห่ง[SCOPE.Custom('mythical_map_creatures_capitalized')|U]"

 map_artifact_beginning_western: "หนังสือเล่มเล็กปกหนังเล่มนี้เป็นกำหนดการเดินทางพร้อมแผนที่พับอยู่ข้างใน ทั้งแผนที่และหนังสือแสดงให้เห็นถึงการเดินทางของ[author.GetFullName]"
 map_artifact_beginning_far_eastern: "ต้นฉบับใบลานนี้เป็นกำหนดการเดินทางที่ดำเนินการโดย[author.GetFullName]"
 map_artifact_beginning_internal: "[newly_created_artifact.GetDesc]ภายในอาณาจักร[background_terrain_scope.GetTitle.GetDeJureLiege.GetDeJureLiege.GetDeJureLiege.GetNameNoTier] มีแผนที่โดยละเอียดประกอบ ซึ่งวาดด้วยมือของ[author.GetHerHis] เช่นกัน\nนี่คือเรื่องราวของการเดินทางผ่าน "
 map_artifact_beginning_external: "[newly_created_artifact.GetDesc]ไปยังดินแดน[background_terrain_scope.GetTitle.GetDeJureLiege.GetDeJureLiege.GetDeJureLiege.GetNameNoTier] มีแผนที่โดยละเอียดประกอบ ซึ่งวาดด้วยมือของ[author.GetHerHis] เช่นกัน\nนี่คือเรื่องราวของการเดินทางผ่าน "
 map_artifact_danger_type_heat: "[newly_created_artifact.GetDesc]ความร้อนระอุ การรับมือกับการขาดแคลนน้ำอย่างต่อเนื่อง,"
 map_artifact_danger_type_monsoons: "[newly_created_artifact.GetDesc]มรสุมที่ถาโถม,"
 map_artifact_danger_type_snowstorms: "[newly_created_artifact.GetDesc]ความหนาวเย็นสุดขั้ว พายุหิมะ,"
 map_artifact_danger_type_fighting: "[newly_created_artifact.GetDesc]ดินแดนไร้กฎหมาย ที่ ซึ่งความขัดแย้งแทบจะหลีกเลี่ยงไม่ได้,"
 map_artifact_danger_type_undulating: "[newly_created_artifact.GetDesc]เนินเขาที่ขึ้นๆ ลงๆ ช่องเขาอันตราย,"
 map_artifact_danger_type_wetlands: "[newly_created_artifact.GetDesc]พื้นที่ชุ่มน้ำที่ทรยศ เต็มไปด้วยโรคภัยไข้เจ็บ,"
 map_artifact_danger_type_open: "[newly_created_artifact.GetDesc]ที่ราบเปิดกว้าง ที่ ซึ่งไม่มีที่กำบัง,"
 map_artifact_danger_type_desert: "[newly_created_artifact.GetDesc]ทะเลทรายที่ไม่ปรานี ปราศจากน้ำหรือที่กำบัง,"
 map_artifact_danger_type_jungle: "[newly_created_artifact.GetDesc]ป่าทึบ พร้อมด้วยสัตว์อันตรายภายใน,"
 map_artifact_danger_type_forests: "[newly_created_artifact.GetDesc]ป่าลึก เต็มไปด้วยอันตรายที่ซ่อนเร้น,"
 map_artifact_danger_type_steppes: "[newly_created_artifact.GetDesc]ทุ่งหญ้าสเตปป์เปิดโล่ง ห่างไกลจากดินแดนที่มีผู้คนตั้งถิ่นฐาน,"
 map_artifact_danger_type_farmlands: "[newly_created_artifact.GetDesc]พื้นที่เกษตรกรรมอันอุดมสมบูรณ์ ซึ่งสามารถรองรับคณะผู้ติดตามใดๆ ได้,"
 map_artifact_danger_type_end: "[newly_created_artifact.GetDesc] และความคิดเห็นของ[author.GetFirstNamePossessiveNoTooltip]เกี่ยวกับวิธีที่ดีที่สุดในการจัดการกับสิ่งเหล่านั้น\n\n"
 map_artifact_domain_purpose_growth: "[newly_created_artifact.GetDesc]การเดินทางที่อธิบายไว้นี้ดำเนินการเพื่อตรวจสอบอาณาเขตของผู้เขียน และกำหนดการเดินทางให้รายละเอียดสิ่งที่[author.GetTitledFirstName]เรียนรู้เกี่ยวกับอาณาเขตของ[author.GetHerHis]และวิธีที่ดีที่สุดในการสกัดทรัพยากรและความมั่งคั่งจากดินแดนของ[author.GetHerHis]"
 map_artifact_domain_purpose_defensive: "[newly_created_artifact.GetDesc]การเดินทางที่อธิบายไว้นี้ดำเนินการเพื่อตรวจสอบอาณาเขตของผู้เขียน ทั้งกำหนดการเดินทางและแผนที่อธิบายว่า[author.GetTitledFirstName]จะป้องกันดินแดนของ[author.GetHerHis]จากกองทัพศัตรูได้อย่างไร แผนที่แสดงตำแหน่งที่ควรสร้างแนวป้องกัน วิธีสนับสนุนพลรบของ[author.GetHerHis]ได้ดีที่สุด และสิ่งที่ผู้โจมตีอาจทำ"
 map_artifact_vassal_purpose_dread: "[newly_created_artifact.GetDesc]กำหนดการเดินทางอธิบายการเดินทางที่ทำขึ้นเพื่อตรวจสอบดินแดนของข้าหลวงของผู้เขียน\nจุดแข็งที่รับรู้ทั้งหมดถูกทำเครื่องหมายไว้บนแผนที่ พร้อมด้วยคำแนะนำเกี่ยวกับวิธีที่ดีที่สุดในการทำลายการต่อต้านใดๆ มีบันทึกเกี่ยวกับบุคลิกภาพของข้าหลวงเองและวิธีที่พวกเขาจะถูกข่มขู่ให้ยอมจำนนได้ดีที่สุด"
 map_artifact_vassal_purpose_opinion: "[newly_created_artifact.GetDesc]ข้อความอธิบายการเดินทางเพื่อตรวจสอบดินแดนของข้าหลวงของผู้เขียน — พร้อมบันทึกเกี่ยวกับทรัพย์สินมีค่า และบุคลิกภาพของข้าหลวง แต่ละคน ครอบคลุมข้อเสนอแนะจำนวนมากเกี่ยวกับวิธีที่ดีที่สุดในการสนับสนุนและประจบประแจงเจ้าของที่ดินเหล่านี้เพื่อรักษาการสนับสนุนของพวกเขา"
 map_artifact_vassal_purpose_intrigue: "[newly_created_artifact.GetDesc]ข้อความอธิบายการเดินทางเพื่อตรวจสอบข้าหลวงของผู้เขียน พร้อมบันทึกมากมายเกี่ยวกับทางเข้าปราสาท ทางลับ และสถานที่ที่ข้าหลวงต่างๆ ของ[author.GetTitledFirstName]เก็บทรัพย์สินล้ำค่าที่สุดของพวกเขาไว้"
 map_artifact_poi_travel: "[newly_created_artifact.GetDesc]เป้าหมายของการเดินทางดูเหมือนจะเป็นการเยือน[poi_map_target.GetHolding.GetSpecialBuildingType.GetNameNoTooltip] แผนที่ให้รายละเอียดเส้นทางที่ใช้ รวมถึงวิธีที่ดีที่สุดในการหลีกเลี่ยงข้อผิดพลาดใดๆ ที่[author.GetTitledFirstName]รู้สึกว่า[author.GetSheHe]ได้กระทำระหว่างทางไปที่นั่น"
 map_artifact_poi_purpose: "[newly_created_artifact.GetDesc]เป้าหมายของการเดินทางดูเหมือนจะเป็นการเยือน[poi_map_target.GetHolding.GetSpecialBuildingType.GetNameNoTooltip] มีแผนที่พิเศษที่ครอบคลุมเฉพาะ[poi_map_target.GetHolding.GetSpecialBuildingType.GetNameNoTooltip]และบริเวณโดยรอบ และกำหนดการเดินทางอธิบายสิ่งที่คุณคาดว่าจะพบได้ที่นั่น"
 map_artifact_foreign_purpose_court: "[newly_created_artifact.GetDesc]การเดินทางที่อธิบายไว้นี้สิ้นสุดลงด้วยการเยือนราชสำนัก[foreign_kingdom_map_target.GetAdjectiveNoTooltip]ที่[background_terrain_scope.GetTitle.GetNameNoTierNoTooltip]และผู้เขียนกล่าวถึงชีวิตของสังคมชั้นสูงในอาณาจักรเป็นเวลานาน"
 map_artifact_foreign_purpose_people: "[newly_created_artifact.GetDesc]จุดประสงค์ของการเดินทางที่อธิบายไว้คือการเยือนราชสำนัก[foreign_kingdom_map_target.GetAdjectiveNoTooltip] แต่กำหนดการเดินทางแทบไม่ได้กล่าวถึงเมืองหลวงเลย แต่กลับลงรายละเอียดอย่างมากเกี่ยวกับผู้คนในดินแดน ท่าทางและขนบธรรมเนียมที่แปลกประหลาดของพวกเขา"
 map_artifact_foreign_purpose_mythical: "[newly_created_artifact.GetDesc]การเดินทางที่อธิบายไว้นี้สิ้นสุดลงด้วยการเยือนราชสำนัก[foreign_kingdom_map_target.GetAdjectiveNoTooltip] แต่จุดสนใจหลักคือคำอธิบายที่มีสีสันมากเกี่ยวกับดินแดนที่ถูกหลอกหลอนโดย[SCOPE.Custom('mythical_map_creatures')]และวิธีที่นักเดินทางอาจเตรียมพร้อมรับมือกับพวกมันได้ดีที่สุด"
