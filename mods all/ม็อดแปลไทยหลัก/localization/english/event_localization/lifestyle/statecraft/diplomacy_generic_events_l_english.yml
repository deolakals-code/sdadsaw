l_english: 

 diplomacy_lifestyle_rank_up_indication:1 "I might gain a [diplomacy_lifestyle|E] [perk|E]"
 
 ###################
 # Standard Events #
 ###################

 #Social Manipulation (Put a vassal in their place by manipulating them), by Mathilda Bjarnehed
 diplomacy_generic.0012.t:0 "การชักใยทางสังคม"
 diplomacy_generic.0012.start.desc:0 "ครั้งแรกที่มันเกิดขึ้น ข้าแทบไม่ได้ใส่ใจเลยแม้ แต่น้อย แต่ [disobedient_subject.Custom2('MyCharacterIntroduction', ROOT.Char)] กลับเหิมเกริมขึ้น การท้าทายของ [disobedient_subject.GetHerHis|U] ไม่ได้ผ่านไปโดยไม่มีใครสังเกตอีกต่อไป"
 diplomacy_generic.0012.council.desc:0 "ที่โต๊ะสภา"
 diplomacy_generic.0012.vassal.desc:0 "ในหมู่ข้าหลวงของข้า"
 diplomacy_generic.0012.end.desc:0 "\n\n[disobedient_subject.GetSheHe|U] กำลังทดสอบขีดจำกัดของข้า คนอื่น ๆ จะต้องตามอย่างแน่นอน — เว้น แต่ข้าจะให้ [disobedient_subject.GetHerHim] ได้ลิ้มรสยาขมของ [disobedient_subject.GetHerHis] เอง..."
 diplomacy_generic.0012.a:0 "ข้าจะเพิกเฉย [disobedient_subject.GetHerHim] และขโมยความคิดของ [disobedient_subject.GetHerHis]"
 make_invisible_option.tt:2 "ท่านเดาว่า [disobedient_subject.GetFirstName] ไม่กล้าแสดงออก เฉื่อยชา หรือไม่ทะเยอทะยาน"
 diplomacy_generic.0012.b:0 "การเยาะเย้ย [disobedient_subject.Custom2('PointOfRidicule', ROOT.Char)] ของ [disobedient_subject.GetHerHis] จะ ทำให้ [disobedient_subject.GetHerHim] หุบปากได้"
 ridicule_option.tt:2 "ท่านเดาว่า [disobedient_subject.GetFirstName] ประหม่าและใส่ใจว่าผู้อื่นคิดอย่างไร"
 diplomacy_generic.0012.c:0 "การ "ลืม" เชิญ [disobedient_subject.GetHerHim] จะ ทำให้ [disobedient_subject.GetHerHim] ไม่รู้อะไรเลย"
 withhold_information_option.tt:2 "ท่านเดาว่า [disobedient_subject.GetFirstName] มีจิตใจอ่อนแอหรือเก็บตัวอยู่กับ [disobedient_subject.GetHerselfHimself]"
 diplomacy_generic.0012.d:0 "[disobedient_subject.GetSheHe|U] จะได้รับมอบหมายงานที่เป็นไปไม่ได้ที่จะ ทำให้สำเร็จ"
 impossible_task_option.tt:2 "ท่านเดาว่า [disobedient_subject.GetFirstName] จะทำทุกอย่างในอำนาจของ [disobedient_subject.GetHerHis] เพื่อให้งานสำเร็จ"
 diplomacy_generic.0012.e:0 "ปัญหาทั้งหมดจะถูกโยนความผิดให้ [disobedient_subject.GetHerHim]"
 shame_option.tt:2 "ท่านเดาว่า [disobedient_subject.GetFirstName] มีมโนธรรม หรืออย่างน้อยก็ต้องการให้ผู้คนคิดดีกับ [disobedient_subject.GetHerHim]"
 diplomacy_generic.0012.f:0 "การแสดงความคิดเห็นเกี่ยวกับ [disobedient_subject.Custom('ObjectifiedFeature')] ของ [disobedient_subject.GetHerHis] จะ ทำให้ [disobedient_subject.GetHerHim] เสียสมาธิ"
 objectification_option.tt:2 "ท่านเดาว่า [disobedient_subject.GetFirstName] มักถูกมองเป็นวัตถุ เนื่องจากรูปลักษณ์ของ [disobedient_subject.GetHerHis]"
 diplomacy_generic.0012.g:0 "การข่มขู่ด้วยความรุนแรงอย่าง "แนบเนียน" จะยุติเรื่องนี้"
 threat_option.tt:2 "ท่านเดาว่า [disobedient_subject.GetFirstName] ขี้ขลาดหรือต้องการรักษาสันติภาพ"
 diplomacy_generic.0012.h:1 ""เจ้ากล้าท้าทาย #EMP [ROOT.Char.GetTitleAsNameNoTooltip]#!! ของเจ้าได้อย่างไร!?""
 diplomacy_generic.0012.tt:0 "ไม่ค่อยเป็นการทูตนัก แต่ก็ได้ผล..."
 
 diplomacy_generic.0012.good_outcome.desc:1 "ท่านชักใย [disobedient_subject.GetTitledFirstNameNoTooltip]"
 diplomacy_generic.0012.bad_outcome.desc:0 "[disobedient_subject.GetTitledFirstNameNoTooltip] ไม่ได้โง่เขลา"
 diplomacy_generic.0012.terrible_outcome.desc:1 "[disobedient_subject.GetTitledFirstNameNoTooltip] ชิงไหวชิงพริบเหนือกว่าท่าน"
 diplomacy_generic.0012.failure.desc:1 "ท่านล้มเหลวในการชักใย [disobedient_subject.GetTitledFirstName]"

 diplomacy_generic.0013.t:0 "หุ่นเชิดบนเส้นด้าย"
 diplomacy_generic.0013.make_invisible.desc:0 "ดูเหมือนว่า [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('suppressor'))] ของข้า [suppressor.GetTitledFirstName] จะหมดความสนใจในความคิดเห็นของข้าแล้ว เมื่อข้าพูดขึ้น [suppressor.GetSheHe] ก็ขัดจังหวะข้าหรือหันความสนใจไปที่อื่น แต่บางครั้ง ดูเหมือน [suppressor.GetSheHe] จะฟังอยู่ เพราะ [suppressor.GetSheHe] พูดซ้ำความคิดของข้าและอ้างว่าเป็นของ [suppressor.GetHerHis] เอง..."
 diplomacy_generic.0013.ridicule.desc:0 "ข้าต้องทำ เช่นไรจึงจะเป็นที่ยอมรับนับถือจาก [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('suppressor'))] ของข้า? ยามใดก็ตามที่ข้าพูด, [suppressor.GetTitledFirstName] ก็จะขัดจังหวะข้าเพื่อเยาะเย้ยความคิดของข้า หรือ "[disobedient_subject.Custom2('PointOfRidicule', SCOPE.sC('suppressor'))]" ของข้า""
 diplomacy_generic.0013.withhold_information.desc:0 "ช่วงหลังมานี้ ดูเหมือนทุกคนจะรู้เรื่องหมดยกเว้นข้า! ข้าดูเหมือนคนโง่เง่าเมื่อต้องถาม [suppressor.GetTitledFirstName] เพื่อขอคำชี้แจงในการประชุมอยู่ตลอดเวลา หรือเมื่อข้าเสนอแนะโดยอิงจากข้อมูลเก่า ข้าเกรงว่า [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('suppressor'))] ของข้าจงใจปิดบังเรื่องต่าง ๆ จากข้า"
 diplomacy_generic.0013.impossible_task.desc:0 "[ROOT.Char.Custom2('RelationToMe', SCOPE.sC('suppressor'))] ของข้า [suppressor.GetTitledFirstName] คอยมอบหมายงานที่เป็นไปไม่ได้ที่จะ ทำให้เสร็จทันเวลาให้ข้าอยู่เรื่อย! เมื่อข้าพยายามทำอย่างละเอียดถี่ถ้วน ข้าก็ถูกหาว่าขี้เกียจ และเมื่อข้ารีบเร่ง [suppressor.GetSheHe] ก็คิดว่าข้าสะเพร่า"
 diplomacy_generic.0013.shame.desc:0 "เมื่อใดก็ตามที่มีปัญหา [suppressor.GetTitledFirstName] ดูเหมือนจะคิดว่าข้าเป็นคนผิด อย่างไรก็ตาม เมื่อข้าเป็นคนหยิบยกประเด็นขึ้นมา [suppressor.GetSheHe] ก็กล่าวหาว่าข้าให้ความสำคัญผิดเรื่อง!"
 diplomacy_generic.0013.objectification.desc:0 "เมื่อ [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('suppressor'))] ของข้าเรียกประชุม ข้ารู้สึกปั่นป่วนในท้อง ในช่วงสองสามสัปดาห์ที่ผ่านมา มีการแสดงความคิดเห็นมากกว่าหนึ่งครั้งเกี่ยวกับ "[disobedient_subject.Custom('ObjectifiedFeature')]" ของข้า และเมื่อข้าพูด [suppressor.GetSheHe] ก็ใช้เวลาจ้องมองมากกว่าฟัง เหตุใด [suppressor.GetTitledFirstName] จึงสนใจร่างกายของข้ามากกว่าสิ่งที่ข้าทำและพูด?"
 diplomacy_generic.0013.threat.desc:0 "ช่วงหลังมานี้ ข้าสังเกตเห็นสีหน้าแปลก ๆ บนใบหน้าของ [suppressor.GetTitledFirstNamePossessive] เมื่อใดก็ตามที่ข้าพูด ซึ่งเป็นการผสมผสานระหว่างความขุ่นเคืองและความโกรธ แต่ข้าก็ไม่แน่ใจว่ามีบางอย่างผิดปกติ จนกระทั่งวันนี้ เมื่อข้าไม่เห็นด้วยกับ [suppressor.GetHerHim] ในการประชุม [suppressor.GetSheHe] ก็ขู่ว่าจะให้ข้าถูกเฆี่ยน!"
 diplomacy_generic.0013.a:0 "เกมนี้เล่นกันสองคนได้"
 diplomacy_generic.0013.a.success.tt:1 "ท่านประสบความสำเร็จในการชักใย [suppressor.GetTitledFirstNameNoTooltip]"
 diplomacy_generic.0013.a.failure.tt:1 "ท่านถูกชักใยโดย [suppressor.GetTitledFirstNameNoTooltip]"
 diplomacy_generic.0013.b:0 "บางทีข้าสมควรได้รับการปฏิบัติ เช่นนี้..."

 diplomacy_generic.0014.t:1 "$diplomacy_generic.0012.t$: จ้าวแห่งการกดขี่"
 diplomacy_generic.0014.make_invisible.desc:0 "เมื่อใดก็ตามที่ [disobedient_subject.GetTitledFirstName] เปล่งเสียงของ [disobedient_subject.GetHerHis] เพื่อพูด ข้าก็หาว หันความสนใจไปที่อื่น หรือขัดจังหวะ [disobedient_subject.GetHerHim] อย่างโจ่งแจ้ง เมื่อคนอื่น ๆ เริ่มทำตามแบบอย่างของข้า [disobedient_subject.GetTitledFirstNameNoTooltip] ก็ลังเลมากขึ้นเรื่อย ๆ"
 diplomacy_generic.0014.ridicule.desc:0 "คำพูดถากถางไม่หยุดหย่อนของข้าเกี่ยวกับ [disobedient_subject.Custom2('PointOfRidicule', ROOT.Char)] ของ [disobedient_subject.GetTitledFirstNamePossessive] ดูเหมือนจะส่งผลกระทบต่อ [disobedient_subject.GetHerHim] อย่างแท้จริง! นับตั้งแต่ที่ผู้อื่นเริ่มทำตามอย่างข้า, [disobedient_subject.GetTitledFirstNameNoTooltip] ก็เริ่มลังเลมากขึ้นเรื่อยๆ"
 diplomacy_generic.0014.withhold_information.desc:0 "ตั้งแต่ข้าเริ่มปิดบังข้อมูลจาก [disobedient_subject.GetTitledFirstName] [disobedient_subject.GetSheHe] ก็ ทำให้ [disobedient_subject.GetHerselfHimself] กลายเป็นตัวตลกมานับครั้งไม่ถ้วน การปัดตกข้อเสนอแนะที่ล้าสมัยอย่างสิ้นหวังของ [disobedient_subject.GetHerHis] นั้นง่ายยิ่งกว่าการชิงไหวชิงพริบกับสุนัขเสียอีก"
 diplomacy_generic.0014.impossible_task.desc:0 "เมื่อ [disobedient_subject.GetTitledFirstName] พยายามทำงานของ [disobedient_subject.GetHerHis] ให้เสร็จอย่างละเอียดถี่ถ้วน ข้าก็ดุ [disobedient_subject.GetHerHim] ต่อหน้าทุกคน และเมื่อ [disobedient_subject.GetSheHe] รีบ ทำให้เสร็จทันเวลา ข้าก็แสดงผลงานที่เลินเล่อของ [disobedient_subject.GetHerHis] ให้ทุกคนเห็น [disobedient_subject.GetSheHe|U] พยายามอย่างสุดความสามารถ [disobedient_subject.GetHerselfHimself] เพื่อเอาใจข้า แต่ข้าไม่เคยยอมรับความพยายามของ [disobedient_subject.GetHerHis] เลย"
 diplomacy_generic.0014.shame.desc:0 "ประเด็นที่ [disobedient_subject.GetTitledFirstName] หยิบยกขึ้นมาเคย ทำให้ข้าดูแย่ แต่ตอนนี้สถานการณ์กลับตาลปัตร ทุกครั้งที่ [disobedient_subject.GetSheHe] หยิบยกประเด็นที่น่ากังวลขึ้นมา ข้าก็โยนความผิดกลับไปให้ [disobedient_subject.GetHerHim] อย่างชำนาญ หรือ ทำให้ [disobedient_subject.GetHerHim] ดูเป็นคนใจแคบที่หยิบยกเรื่องนี้ขึ้นมา"
 diplomacy_generic.0014.objectification.desc:0 "มุกตลกลามก การจ้องมองที่ยาวนาน การขัดจังหวะ [disobedient_subject.GetHerHis] เพื่อ "ชมเชย" [disobedient_subject.Custom('ObjectifiedFeature')] ของ [disobedient_subject.GetHerHis] ทีละเล็กทีละน้อย ข้าได้ทำลาย [disobedient_subject.GetTitledFirstName] ลง ทำให้ [disobedient_subject.GetHerHim] ตึงเครียดและประหม่า"
 diplomacy_generic.0014.threat.desc:0 "บางครั้ง การข่มขู่ด้วยความรุนแรงง่าย ๆ ก็ได้ผล"
 diplomacy_generic.0014.end.desc:0 "บัดนี้ [disobedient_subject.GetSheHe] ยังคงเงียบงัน สายตาจับจ้องต่ำ"
 diplomacy_generic.0014.a.cruel:0 "[disobedient_subject.GetSheHe|U] จะคิดให้รอบคอบก่อนที่จะท้าทายข้าอีกครั้ง!"
 diplomacy_generic.0014.a.compassionate:0 "อาจจะโหดร้าย แต่ก็จำเป็นต้องทำ"

 diplomacy_generic.0015.t:1 "$diplomacy_generic.0012.t$: จากผู้ชักใยสู่หุ่นเชิด"
 diplomacy_generic.0015.make_invisible.desc:0 "เมื่อ [disobedient_subject.GetTitledFirstName] เปล่งเสียงของ [disobedient_subject.GetHerHis] เพื่อพูด ข้าก็หาวและหันความสนใจไปที่เอกสารของข้า ข้าคาดว่าคนอื่น ๆ จะทำตามแบบอย่างของข้า แต่พวกเขากลับเข้าร่วมการสนทนาแทน เมื่อข้ากลืนความภาคภูมิใจของข้าลงไปเพื่อเข้าร่วมในที่สุด [disobedient_subject.GetFirstName] ก็ได้เปรียบแล้วและคำพูดของข้าก็ถูกลืมไปในไม่ช้า"
 diplomacy_generic.0015.ridicule.desc:0 "ปรากฏว่า, ไหวพริบของ [disobedient_subject.GetTitledFirstNamePossessive] นั้นเฉียบแหลมกว่าที่ข้าคาดไว้มาก ขณะที่ข้าวิจารณ์ [disobedient_subject.Custom2('PointOfRidicule', ROOT.Char)] ของ [disobedient_subject.GetHerHis], [disobedient_subject.GetSheHe] ก็พลิกสถานการณ์กลับในทันที และ ทำให้ข้าดูเป็นคนใจแคบที่ไปตอบโต้ปัญหาที่เกิดขึ้นจริงด้วยคำพูดถากถาง"
 diplomacy_generic.0015.impossible_task.desc:0 "ด้วยความประหลาดใจอย่างยิ่งของข้า [disobedient_subject.GetTitledFirstName] สามารถเกณฑ์คนอื่นมาช่วย [disobedient_subject.GetHerHim] ทำงานที่ข้ามอบหมายให้ [disobedient_subject.GetHerHim] ได้ เนื่องจากพวกเขาแทบไม่มีเวลา ทำให้เสร็จอย่างถูกต้องด้วยกัน จึงเห็นได้ชัดว่าข้าเรียกร้องมากเกินไป ข้าไม่สามารถแม้ แต่จะบ่นเกี่ยวกับการดำเนินการได้"
 diplomacy_generic.0015.shame.desc:0 "การโยนความผิดให้ [disobedient_subject.GetTitledFirstName] กลายเป็นเรื่องยากกว่าที่ข้าจินตนาการไว้ ใช่ ข้าสามารถโน้มน้าวใจได้ แต่ปรากฏว่า [disobedient_subject.GetSheHe] มีทักษะในเกมนี้มากกว่าข้าเสียอีก ด้วยประโยคเดียว [disobedient_subject.GetSheHe] ก็ฉีกคำอธิบายของข้าเป็นชิ้น ๆ ทำให้ข้าดูโง่เขลาหรือไม่น่าไว้วางใจ ข้าไม่แน่ใจว่าอย่างไหนแย่กว่ากัน"
 diplomacy_generic.0015.objectification.desc:0 "ข้าคิดว่าความคิดเห็นลามกของข้าจะ ทำให้ [disobedient_subject.GetTitledFirstName] หุบปากได้ แต่คำตอบของ [disobedient_subject.GetHerHis] นั้นคู่ควร แต่ก็ตรงประเด็น ตอนนี้คนอื่น ๆ คิดว่า [disobedient_subject.GetSheHe] เป็นนักบุญประเภทหนึ่ง ในขณะที่ข้าดูทั้งไร้สาระและผิดศีลธรรมเมื่อเปรียบเทียบกัน"
 diplomacy_generic.0015.threat.desc:0 "ข้าคิดว่าคำขู่ของข้าจะ ทำให้ [disobedient_subject.GetTitledFirstName] หุบปากได้ แต่ [disobedient_subject.GetSheHe] ก็เพิกเฉยและพูดต่อไป การไม่แสดงความกลัวอย่างสิ้นเชิงของ [disobedient_subject.GetHerHis|U] ทำให้คำพูดของข้าดูไร้สาระ แทนที่จะน่าเกรงขาม"
 diplomacy_generic.0015.withhold_information.desc:0 "แม้ว่าข้าจะ "ลืม" ส่งข้อความถึง [disobedient_subject.GetTitledFirstName] หรือเชิญ [disobedient_subject.GetHerHim] เข้าร่วมการประชุมเป็นประจำ แต่ [disobedient_subject.GetSheHe] ก็ดูเหมือนจะรู้เรื่องอยู่เสมอ ตอนนี้ข้าดูสับสนและไร้ความสามารถเมื่อเปรียบเทียบกัน!"
 diplomacy_generic.0015.a:0 "ครั้งนี้เจ้าชนะ [disobedient_subject.GetFirstNameNoTooltip]"
