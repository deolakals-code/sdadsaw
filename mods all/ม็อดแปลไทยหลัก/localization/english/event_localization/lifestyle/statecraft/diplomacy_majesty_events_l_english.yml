 # A Tedious Disagreement
 diplomacy_majesty_special.1010.t:0 "ความขัดแย้งอันน่าเบื่อหน่าย"
 diplomacy_majesty_special.1010.start.desc:0 "[debater.Custom2('MyCharacterIntroduction', ROOT.Char)|U] และข้ามักจะลงเอยด้วยการโต้วาทีกันเสมอ"
 diplomacy_majesty_special.1010.divine_attributes.desc:0 "ความเข้ากันได้ของคุณลักษณะอันศักดิ์สิทธิ์"
 diplomacy_majesty_special.1010.free_will.desc:0 "ความเข้ากันได้ของการหยั่งรู้อันศักดิ์สิทธิ์กับเจตจำนงเสรี"
 diplomacy_majesty_special.1010.faith_reason.desc:0 "ความสัมพันธ์ระหว่างศรัทธากับเหตุผล"
 diplomacy_majesty_special.1010.just_war.desc:0 "ธรรมชาติของสงครามอันชอบธรรม"
 diplomacy_majesty_special.1010.chivalry.desc:0 "คุณค่าของความเป็นอัศวิน"
 diplomacy_majesty_special.1010.seven_virtues.desc:0 "คุณธรรมที่สำคัญที่สุดในเจ็ดประการ"
 diplomacy_majesty_special.1010.duty_women.desc:0 "หน้าที่ของสตรี"
 diplomacy_majesty_special.1010.mercy.desc:0 "ว่าความเมตตาเป็นสัญญาณของความอ่อนแอหรือไม่"
 diplomacy_majesty_special.1010.ambition.desc:0 "ว่าความทะเยอทะยานเป็นบาปหรือความแข็งแกร่ง"
 diplomacy_majesty_special.1010.inheritance.desc:0 "เรื่องของกฎหมายมรดก"
 diplomacy_majesty_special.1010.mapped_territory.desc:0 "สิ่งที่อยู่นอกเหนือขอบเขตของดินแดนที่ทำแผนที่ไว้"
 diplomacy_majesty_special.1010.heroism.desc:0 "ว่าความกล้าหาญคือความกล้าหรือความโง่เขลา"
 diplomacy_majesty_special.1010.end.desc:0 "เราไม่เคยไปถึงไหนเลย แต่กลับโต้เถียงด้วยเหตุผลเดิมๆ ซ้ำแล้วซ้ำเล่า...\n\nพอทีเถิด ครั้งต่อไปที่หัวข้อนี้ถูกหยิบยกขึ้นมาจะต้องเป็นครั้งสุดท้าย"
 diplomacy_majesty_special.1010.o.tt:1 "ท่านจะโต้วาทีกับ [debater.GetFirstNameNoTooltip] ในอนาคตอันใกล้"
 diplomacy_majesty_special.1010.a:0 "อ่านเกี่ยวกับหัวข้อนี้อย่างละเอียดเพื่อเตรียมตัว"
 diplomacy_majesty_special.1010.a.success.desc:0 "ข้าเพิ่มความเข้าใจในหัวข้อนี้"
 diplomacy_majesty_special.1010.a.success.tt:1 "ท่านเพิ่มโอกาสสำเร็จในการโต้วาทีครั้งสุดท้าย #P 20%#!"
 diplomacy_majesty_special.1010.a.success.message:0 "การศึกษาของข้าเป็นไปด้วยดี และตอนนี้ข้าพร้อมสำหรับการโต้วาทีครั้งสุดท้ายมากขึ้น"
 diplomacy_majesty_special.1010.a.failure.desc:0 "ข้า ทำให้ตัวเองเหนื่อยล้า"
 diplomacy_majesty_special.1010.a.failure.tt:1 "ท่านลดโอกาสสำเร็จในการโต้วาทีครั้งสุดท้าย #N 20%#!"
 diplomacy_majesty_special.1010.a.failure.message:0 "ข้าเหนื่อยล้าจากการศึกษาและจำอะไรไม่ค่อยได้"
 diplomacy_majesty_special.1010.b:0 "การศึกษาคู่ต่อสู้อาจ ทำให้ข้าได้เปรียบ..."
 diplomacy_majesty_special.1010.b.success.desc:0 "ข้าเพิ่มความเข้าใจในตัว [debater.GetTitledFirstNameNoTooltip]"
 diplomacy_majesty_special.1010.b.success.tt:1 "ท่านจะได้รับคำใบ้เกี่ยวกับกลยุทธ์ที่จะเลือกในการโต้วาทีครั้งสุดท้าย"
 diplomacy_majesty_special.1010.c:0 "การพักผ่อนบ้างจะ ทำให้ข้าพร้อมสำหรับการเผชิญหน้า"
 diplomacy_majesty_special.1010.d:0 "ข้าจะแสดงให้เจ้า [debater.Custom2('InsultNoun', ROOT.Char)] นั่นเห็นว่าใครเป็นใหญ่!"
 diplomacy_majesty_special.1010.e:0 "ปล่อยให้ [debater.GetHerHim] ชนะไปง่ายกว่า"
 
 diplomacy_majesty_special.1011.start.desc:0 "เรามาถึงจุดนี้อีกครั้ง ดังที่ข้าคาดการณ์ไว้ กำลังทะเลาะกันเรื่อง"
 diplomacy_majesty_special.1011.study_subject_success.desc:0 "โชคดีเพียงใดที่การเตรียมตัวของข้าเป็นไปด้วยดี — ข้ามีข้อโต้แย้งใหม่ๆ อยู่ในมือ!"
 diplomacy_majesty_special.1011.study_opponent_success.desc:0 "โชคดีเพียงใดที่ข้าคิดออกว่าข้าสามารถใช้ประโยชน์จาก [debater.Custom('StrongestAIValueNoun')] ของ [debater.GetFirstNamePossessive] ได้!"
 diplomacy_majesty_special.1011.failure.desc:0 "น่าเสียดายที่จังหวะเวลาไม่ดีเลย ข้าอยู่ดึกเกินไปเมื่อคืนนี้ในความพยายามที่จะเตรียมตัว"
 diplomacy_majesty_special.1011.end.desc:0 "\n\nทีละคน ผู้คนในบริเวณใกล้เคียงหยุดฟังการโต้เถียงของเรา — บางคนก็ไม่ค่อยสุขุมนัก ตอนนี้ถึงเวลาที่จะยุติเรื่องนี้เสียที ครั้งแล้วครั้งเล่า\n\nก่อนที่ข้าจะเริ่ม ข้าควรตัดสินใจว่าผลลัพธ์ใดที่ข้าปรารถนามากที่สุด"
 diplomacy_majesty_special.1011.a:0 "ข้าต้องการโน้มน้าว [debater.GetHerHim] มาอยู่ข้างข้า"
 diplomacy_majesty_special.1011.a.flavor:0 "เพื่อให้บรรลุเป้าหมายนี้ ข้าจะต้องนำเสนอแนวคิดของข้าในลักษณะที่ [debater.GetFirstNameNoTooltip] เห็นด้วย..."
 diplomacy_majesty_special.1011.b:0 "ข้าต้องการบดขยี้ [debater.GetHerHim] ต่อหน้าทุกคน!"
 diplomacy_majesty_special.1011.b.flavor:0 "เพื่อให้บรรลุเป้าหมายนี้ ข้าจะต้องใช้ประโยชน์จากข้อบกพร่องทางอุปนิสัยอย่างหนึ่งของ [debater.GetFirstNamePossessiveNoTooltip] เพื่อหยุดยั้ง [debater.GetHerHim] จากการคิดอย่างมีเหตุผล..."
 diplomacy_majesty_special.1011.a.desc:0 "ผลลัพธ์ที่เป็นไปได้ของการโต้วาทีครั้งสุดท้าย"
 diplomacy_majesty_special.1011.a.success.desc:0 "หากข้าชนะการโต้วาทีครั้งสุดท้าย"
 diplomacy_majesty_special.1011.a.failure.desc:0 "หากข้าแพ้การโต้วาทีครั้งสุดท้าย"
 diplomacy_majesty_special.1011.b.rival:0 "อาจกลายเป็นคู่แข่งของข้า"

 diplomacy_majesty_special.1012.desc:0 "เมื่อคำนึงถึงสิ่งที่ข้ารู้เกี่ยวกับอุปนิสัยของ [debater.GetFirstNamePossessive] ข้าเชื่อว่าวิธีที่ดีที่สุดในการโน้มน้าว [debater.GetHerHim] คือ..."
 diplomacy_majesty_special.1012.a:0 "...สร้างกรณีของข้าบนตรรกะ"
 diplomacy_majesty_special.1012.a.tt:0 "ได้ผลดีกับผู้ที่มีเหตุผล เห็นแก่ตัว ขี้สงสัย หรือใจดำ"
 diplomacy_majesty_special.1012.b:0 "...สงบสติอารมณ์ ไม่ว่าจะเกิดอะไรขึ้น"
 diplomacy_majesty_special.1012.generic.tt:0 "ประสิทธิภาพของกลยุทธ์ขึ้นอยู่กับว่าเหมาะสมกับบุคลิกภาพของ [debater.GetTitledFirstNamePossessive] เพียงใด"
 diplomacy_majesty_special.1012.b.tt:0 "ได้ผลดีกับผู้ที่กล้าหาญ กระตือรือร้น อาฆาตแค้น หรือไร้เกียรติ"
 diplomacy_majesty_special.1012.c:0 "...อ้างถึงคุณค่าที่สูงกว่า"
 diplomacy_majesty_special.1012.c.tt:0 "ได้ผลดีกับผู้ที่มีเกียรติ ใจดี ให้อภัย เชื่อในศาสนา หรือขาดความทะเยอทะยาน"
 diplomacy_majesty_special.1012.d:0 "...ตั้งใจฟังคำพูดของ [debater.GetHerHis]"
 diplomacy_majesty_special.1012.d.tt:0 "ได้ผลดีกับผู้ที่ระมัดระวัง เฉื่อยชา หรือโง่เขลา"

 diplomacy_majesty_special.1013.logic.desc:0 "โดยการแสดงให้เห็นอย่างชัดเจนว่าแนวคิดหนึ่งตามมาอีกแนวคิดหนึ่งอย่างไร ข้าได้สร้างกรณีที่แข็งแกร่งดุจกำแพง [ROOT.Char.Custom('FortifiedBuilding')] เมื่อข้ามาถึงประเด็นของข้า [debater.GetFirstName] ก็ทำอะไรไม่ได้นอกจากเห็นด้วย"
 diplomacy_majesty_special.1013.calm.desc:0 "ไม่ว่า [debater.GetFirstName] จะยั่วยุข้าอย่างไร ข้าก็ควบคุมอารมณ์ของข้าไว้ได้ ตอบกลับด้วยท่าทีสงบและมั่นคง สิ่งนี้สร้างความประทับใจให้กับผู้สังเกตการณ์ และพวกเขาเริ่มพยักหน้าและฮัมเพลงเห็นด้วยขณะที่ข้าพูด จากนั้น [debater.GetFirstName] ก็เริ่มฟัง และในไม่ช้าข้าก็ ทำให้ [debater.GetHerHim] ประทับใจ เช่นกัน"
 diplomacy_majesty_special.1013.higher_values.desc:0 "เมื่อรู้ว่า [debater.GetFirstName] เป็น [debater.GetWomanMan] ที่คำนึงถึงประโยชน์ส่วนรวม ข้าจึงอ้างถึงคุณค่าที่สูงกว่าที่ [debater.GetSheHe] ยึดถืออย่างยิ่ง ด้วยมุมมองนี้ [debater.GetSheHe] จึงเห็นข้อดีของข้อโต้แย้งของข้าในที่สุด "
 diplomacy_majesty_special.1013.listen.desc:0 "เมื่อรู้ว่า [debater.GetFirstName] ขาดความอดทนที่จะยืนหยัดในข้อโต้แย้งของ [debater.GetHerHis] ข้าจึงทำในสิ่งที่ไม่มีใครทำ — ข้าฟัง [debater.GetHerHim] การได้รับการเอาใจใส่อย่างจริงจัง ทำให้ [debater.GetHerHim] พอใจอย่างยิ่ง และเมื่อ [debater.GetSheHe] พูดจบ [debater.GetSheHe] ก็ยินดีฟังข้าตอบ"
 diplomacy_majesty_special.1013.a.cruel:0 "คนอ่อนแอถูกชักจูงได้ง่ายเพียงใด"
 diplomacy_majesty_special.1013.a.compassionate:0 "ข้ายินดีที่เราสามารถทิ้งเรื่องนี้ไว้เบื้องหลังได้"

 diplomacy_majesty_special.1014.desc:0 "เมื่อคำนึงถึงสิ่งที่ข้ารู้เกี่ยวกับจุดอ่อนของ [debater.GetFirstNamePossessive] ข้าคิดว่าวิธีที่มีประสิทธิภาพที่สุดในการ ทำให้ [debater.GetHerHim] อับอายต่อหน้าทุกคนคือ..."
 diplomacy_majesty_special.1014.a:0 "...แสดงความโหดเหี้ยมและ ทำให้ [debater.GetHerHim] หวาดกลัว"
 diplomacy_majesty_special.1014.generic.tt:0 "#F ประสิทธิภาพของกลยุทธ์ขึ้นอยู่กับว่าใช้ประโยชน์จากจุดอ่อนของ [debater.GetTitledFirstNamePossessive] ได้ดีเพียงใด!#!"
 diplomacy_majesty_special.1014.a.tt:0 "#F ได้ผลดีกับผู้ที่ระมัดระวัง ใจดี ให้อภัย และเฉื่อยชา!#!"
 diplomacy_majesty_special.1014.b:0 "... ยั่วยุให้ [debater.GetHerHim] เสียอารมณ์ [debater.GetHerHis]"
 diplomacy_majesty_special.1014.b.tt:0 "#F ได้ผลดีกับผู้ที่กล้าหาญ กระตือรือร้น อาฆาตแค้น และมีเกียรติ!#!"
 diplomacy_majesty_special.1014.c:0 "...ชี้ให้เห็นถึงอุปนิสัยต่ำทรามของ [debater.GetHerHis]"
 diplomacy_majesty_special.1014.c.tt:0 "#F ได้ผลดีกับผู้ที่ไร้เกียรติ ใจดำ เห็นแก่ตัว หรือขี้สงสัย!#!"
 diplomacy_majesty_special.1014.d:0 "...กล่าวเกินจริงเกี่ยวกับจุดยืนของ [debater.GetHerHis]"
 diplomacy_majesty_special.1014.d.tt:0 "#F ได้ผลดีกับผู้ที่โง่เขลา เชื่อในศาสนา หรือขาดความทะเยอทะยาน!#!"

 diplomacy_majesty_special.1015.scare.desc:0 "ข้าอาจจะแนบเนียนกว่านี้ได้ แต่คำขู่ที่แฝงเร้นและการโต้ตอบที่รุนแรงของข้าได้ผลอย่างแน่นอน [debater.GetFirstName] แทบจะไม่สามารถพูดประเด็นของ [debater.GetHerHis] เองได้ นับประสาอะไรกับการคัดค้านข้า!"
 diplomacy_majesty_special.1015.provoke.desc:0 "มันง่ายเกินไปที่จะ ทำให้ [debater.GetFirstName] ผู้น่าสงสารคลั่ง เมื่อ [debater.GetSheHe] สังเกตเห็นสีหน้าตกตะลึงของผู้ฟังของเรา มันก็สายเกินไปแล้ว ข้าดูเหมือนเป็นแบบอย่างของปัญญาเมื่อเปรียบเทียบกัน และแทบไม่ต้องพยายามเลย"
 diplomacy_majesty_special.1015.exaggerate.desc:0 "แทนที่จะอธิบายจุดยืนของข้าเอง ข้ากลับมุ่งเน้นไปที่การบิดเบือนและกล่าวเกินจริงเกี่ยวกับจุดยืนของ [debater.GetFirstName] ในตอนแรก [debater.GetSheHe] ไม่ได้สังเกต และยังคงปกป้องมุมมองที่อุกอาจมากขึ้นเรื่อยๆ เมื่อข้านำเสนอจุดยืนของข้าเองในที่สุด ข้าก็มีผู้ฟังอยู่ข้างข้า"
 diplomacy_majesty_special.1015.low_character.desc:0 "แทนที่จะตอบโต้ข้อกล่าวอ้างของ [debater.GetFirstNamePossessive] ด้วยข้อเท็จจริงและเหตุผล, ข้ากลับโยงความเห็นของ [debater.GetHerHis] เข้ากับข้อบกพร่องในนิสัยของ [debater.GetHerHis] เนื่องจากวิถีอัน [debater.Custom2('InsultAdjective', ROOT.Char)] ของ [debater.GetHerHis] เป็นที่รับรู้กันอย่างกว้างขวาง, มันจึง ทำให้ทัศนะของผู้ฟังที่มีต่อจุดยืนของ [debater.GetHerHis] ต้องมัวหมองในไม่ช้า, ไม่ว่า [debater.GetSheHe] จะพูดสิ่งใดก็ตาม"
 diplomacy_majesty_special.1015.a.cruel:0 "โอ้ สีหน้าของ [debater.GetHerHis] นั่น! ประเมินค่ามิได้!"
 diplomacy_majesty_special.1015.a.compassionate:0 "บางทีข้าอาจจะรุนแรงเกินไปหน่อย..."

 diplomacy_majesty_special.1016.start.desc:0 "แม้ว่าข้าจะพยายามอย่างเต็มที่เพื่อ"
 diplomacy_majesty_special.1016.logic.desc:0 "ใช้ตรรกะเพื่อโน้มน้าว [debater.GetFirstName] แต่ [debater.GetSheHe] ก็มีอารมณ์ร่วมมากเกินไปที่จะมองเห็นอย่างชัดเจน"
 diplomacy_majesty_special.1016.calm.desc:0 "ข้าพยายามสงบสติอารมณ์, แต่ทัศนะอันน่าเดือดดาลของ [debater.GetFirstName] ก็ ทำให้ข้าตัวสั่นด้วยความโกรธในไม่ช้า เจ้า [debater.Custom2('InsultNoun', ROOT.Char)] [debater.Custom2('InsultAdjective', ROOT.Char)] นั่น!"
 diplomacy_majesty_special.1016.higher_values.desc:0 "อ้างถึงคุณค่าที่สูงกว่าของ [debater.GetFirstNamePossessive] แต่ [debater.GetFirstName] กลับพลิกสถานการณ์โดยกล่าวหาว่าข้าพยายามเปลี่ยนเรื่อง"
 diplomacy_majesty_special.1016.listen.desc:0 "ตั้งใจฟัง แต่ [debater.GetFirstName] ก็พูดพล่ามไปเรื่อยๆ ในแบบที่ไร้สาระตามปกติของ [debater.GetHerHis] ขณะที่ข้ากำลังฝันกลางวันถึงสิ่งที่ข้าอยากจะทำมากกว่า [debater.GetFirstName] ดูเหมือนจะพูดประเด็นที่ดีบางอย่างได้จริงๆ"
 diplomacy_majesty_special.1016.scare.desc:0 "ทำให้ [debater.GetFirstName] หวาดกลัว แต่ [debater.GetSheHe] กลับหัวเราะและข้าก็ดูทั้งใจแคบและโง่เขลา"
 diplomacy_majesty_special.1016.provoke.desc:0 "ยั่วยุ [debater.GetFirstName] แต่ [debater.GetSheHe] กลับสงบสติอารมณ์ได้ สิ่งนี้สร้างความประทับใจให้กับผู้ฟังของเรา ในขณะที่ข้าดูใจแคบเท่านั้น"
 diplomacy_majesty_special.1016.exaggerate.desc:0 "บิดเบือนความคิดเห็นของ [debater.GetFirstNamePossessive] เพื่อต่อต้าน [debater.GetHerHim] แต่ข้ากลับเล่นเข้าทาง [debater.GetHerHis] เสียเอง"
 diplomacy_majesty_special.1016.low_character.desc:0 "เปลี่ยนจุดสนใจไปที่อุปนิสัยต่ำทรามของ [debater.GetFirstNamePossessive] แต่กลับกลายเป็นว่าไม่มีใครรู้สึก เช่นนี้เลย ในทางกลับกัน ผู้ฟังเริ่มปกป้อง [debater.GetHerHim]!"
 diplomacy_majesty_special.1016.end.desc:0 "\n\nไม่สำคัญว่าข้าจะถูก — [debater.GetFirstName] ปั่นหัวผู้สังเกตการณ์ได้สำเร็จและพวกเขาก็ยอมรับคำพูดของ [debater.GetHerHis] โดยไม่มีข้อกังขา"
 diplomacy_majesty_special.1016.a:0 "น่าอายเสียนี่กระไร..."

 diplomacy_majesty_special.1050.title:0 "การโต้วาทีสิ้นสุดลงโดยไม่มีข้อสรุป"
 diplomacy_majesty_special.1050.message:0 "ข้าไม่เคยมีโอกาสได้ทดสอบทักษะการโต้วาทีของข้ากับ [debater.GetTitledFirstName]"
