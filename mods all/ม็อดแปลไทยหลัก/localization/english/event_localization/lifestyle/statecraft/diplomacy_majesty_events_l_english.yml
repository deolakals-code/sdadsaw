l_english: 
 ###################
 # Standard Events #
 ###################

 # The Power of Words
 diplomacy_majesty.0004.t:0 "พลังแห่งวาจา"
 diplomacy_majesty.0004.desc:0 "เราทั้งคู่ต่างสังเกตเห็น — รอยยิ้มอันฝืนใจและบทสนทนาอันติดขัด ตามมาด้วยความเงียบงันอันน่าอึดอัด มีบางอย่างไม่ถูกต้องนักระหว่าง [compliment_receiver.Custom2('MyCharacterIntroduction', ROOT.Char)] กับข้า \n\nบางทีคำชมเชยที่เลือกสรรมาอย่างดีอาจ ทำให้ปฏิสัมพันธ์ของเราราบรื่นขึ้นกระมัง? คราหน้าเมื่อเราพบกัน ข้าอาจจะสรรเสริญ... ของ [compliment_receiver.GetHerHis]"
 diplomacy_majesty.0004.compassionate:0 "ความเห็นอกเห็นใจและจิตใจอันเมตตา"
 diplomacy_majesty.0004.bold:0 "ความกล้าหาญอันไม่ย่อท้อ"
 diplomacy_majesty.0004.honorable:0 "ความภักดีและสำนึกในเกียรติยศ"
 diplomacy_majesty.0004.greed:0 "ความทะเยอทะยานอันสูงส่ง"
 diplomacy_majesty.0004.rational:0 "ความมีเหตุผลที่ชัดเจน"
 diplomacy_majesty.0004.zealous:0 "ศรัทธาอันไม่สั่นคลอนใน [compliment_receiver.GetFaith.HighGodName]"
 diplomacy_majesty.0004.energetic:0 "ความกระฉับกระเฉงดุจวัยหนุ่มสาว"
 diplomacy_majesty.0004.forgiving:0 "ธรรมชาติที่ให้อภัย"
 diplomacy_majesty.0004.beautiful:0 "รูปลักษณ์อันสง่างาม"
 diplomacy_majesty.0004.strong:0 "ความแข็งแกร่งแห่งแขน"
 diplomacy_majesty.0004.extroverted:0 "ทักษะการเข้าสังคมอันหาที่เปรียบมิได้"
 diplomacy_majesty.0004.dominant:0 "การแสดงตนอย่างมั่นใจ"
 diplomacy_majesty.0004.fallback:0 "...ช่างเถิด ข้าเกรงว่าอาจจะดูหมิ่น [compliment_receiver.GetHerHim]!"
 diplomacy_majesty.0004.compliment.tt:0 "ปฏิกิริยาของ [compliment_receiver.GetTitledFirstNamePossessive] จะขึ้นอยู่กับว่าคำชมนั้นเหมาะสมกับ [compliment_receiver.GetHerHim] เพียงใด:"
 diplomacy_majesty.0004.success.tt:1 "คำชมของท่านได้รับการตอบรับอย่างดี"
 diplomacy_majesty.0004.neutral.tt:1 "คำชมของท่านไม่ได้ผล"
 diplomacy_majesty.0004.failure.tt:1 "คำชมของท่านฟังดูเป็นการดูถูก"
 diplomacy_majesty.0004.neutral_outcome.desc:0 "คำชมที่ข้ามอบให้ [compliment_receiver.GetTitledFirstName] ไม่ได้ผล"
 diplomacy_majesty.0005.t:1 "$diplomacy_majesty.0004.t$: หวานปานน้ำผึ้ง"
 diplomacy_majesty.0005.desc:0 "คำชมที่ข้าเตรียมไว้อย่างดีได้รับรางวัลเป็นรอยยิ้มขอบคุณและแก้มที่แดงระเรื่อของ [compliment_receiver.GetTitledFirstNamePossessive] บทสนทนาที่ตามมานั้นเป็นบทสนทนาที่น่าพึงพอใจที่สุดที่เราเคยมีมาในรอบหลายเดือน"
 diplomacy_majesty.0005.a:0 "คำพูดดีๆ ไม่กี่คำสามารถสร้างปาฏิหาริย์ได้อย่างแท้จริง!"

 diplomacy_majesty.0006.t:1 "$diplomacy_majesty.0004.t$: ขมดุจบอระเพ็ด"
 diplomacy_majesty.0006.desc:0 "ข้าตั้งใจให้คำพูดของข้าเป็นไปในทางที่ดี แต่ปฏิกิริยาของ [compliment_receiver.GetTitledFirstNamePossessive] ทำให้ข้าไม่สงสัยเลยในความล้มเหลวของข้า สีหน้าขุ่นเคืองบนใบหน้าของ [compliment_receiver.GetHerHis] ทำให้หัวใจข้าหล่นวูบไปถึงท้องน้อย"
 diplomacy_majesty.0006.a:0 "ข้าช่างไร้ไหวพริบ เช่นนี้ได้อย่างไร..."
 
 # Kindred Spirits
 diplomacy_majesty.0016.t:0 "จิตวิญญาณ kindred"
 diplomacy_majesty.0016.desc:0 "ข้าสังเกตเห็นว่า [potential_friend.Custom2('MyCharacterIntroduction', ROOT.Char)] และข้าดูเหมือนจะคิดและกระทำในลักษณะที่คล้ายคลึงกันมาก เราอาจไม่เห็นพ้องต้องกันเสมอไป แต่โดยเนื้อแท้แล้ว ข้าคิดว่าเราเข้ากันได้\n\nนี่อาจเป็นรากฐานของมิตรภาพที่ยั่งยืน — หรือจุดอ่อนที่จะใช้ประโยชน์..."
 diplomacy_majesty.0016.a:0 "เราจะเป็นเพื่อนที่ดีที่สุด!"
 diplomacy_majesty.0016.a.tt:0 "[scheme|E] จะมี [success_chance|E] เพิ่มขึ้น"
 diplomacy_majesty.0016.b:0 "ข้าจะปั่นหัว [potential_friend.GetHerHim] เล่น..."
 diplomacy_majesty.0016.c:0 "ข้าไม่ต้องการเพื่อน ข้ามีมีด!"

 # Loyal Subjects
 diplomacy_majesty.1020.t:0 "ความภักดีหรือความกลัว"
 diplomacy_majesty.1020.desc:0 "ในฐานะ [ROOT.Char.GetTitleAsName] ของพวกเขา [ROOT.Char.Custom('GetFollowerOrVassalPlural')] ของข้าเป็นหนี้บุญคุณความภักดีต่อข้า คำพูดของข้าคือกฎหมาย แต่การเชื่อฟังโดยปราศจากความทุ่มเทนั้นมีค่าเพียงใด?\n\nในยามวิกฤต การตอบสนองที่เชื่องช้าหรือความพยายามที่ไม่เต็มใจอาจนำไปสู่หายนะได้ ข้าสามารถเสี่ยง เช่นนั้นได้หรือ?"
 diplomacy_majesty.1020.a:0 "ข้าจะเอาชนะใจพวกเขาให้ภักดีอย่างไม่สั่นคลอน"
 diplomacy_majesty.1020.b:0 "ข้ามี [important_ruler.GetWomenMen] ที่สำคัญกว่าที่ต้องสร้างความประทับใจ"
 diplomacy_majesty.1020.c:0 "ความกลัวเป็นเครื่องมือที่มีประสิทธิภาพมากกว่ามาก"
 diplomacy_majesty.1020.d:0 "เหตุใดข้าต้องสนใจว่าผู้อื่นคิดอย่างไรกับข้า?"

 # A Battle of Ideas
 diplomacy_majesty.4030.t:0 "สมรภูมิแห่งความคิด"
 diplomacy_majesty.4030.desc:0 "ขณะที่ข้าใช้เวลามากขึ้นในการฝึกฝนศิลปะการปกครองและการทูต ข้าพบว่าตนเองกำลังคิดถึงความคล้ายคลึงกันระหว่างชีวิตใน [ROOT.Char.Custom('GetCourt')] กับการทำสงคราม การอ่านใจคู่ต่อสู้... การเดินหมากและการแก้หมาก... \n\nการเก็บความคิดเหล่านี้ไว้กับตัวเองอาจ ทำให้ข้ามีอาวุธลับ เพื่อให้แน่ใจว่าข้าจะได้ในสิ่งที่ต้องการ หรืออีกทางหนึ่ง ข้าอาจแบ่งปันแนวคิดนี้กับ [event_target.GetTitledFirstName] เพื่อให้ได้มา ซึ่งความปรารถนาดีของ [event_target.GetHerHis]..."
 diplomacy_majesty.4030.a:0 "ข้าต้องขยายทฤษฎีนี้!"
 diplomacy_majesty.4030.a.success:0 "กลยุทธ์ใหม่ของข้าได้ผลดีเป็นพิเศษ"
 diplomacy_majesty.4030.a.failure:0 "ข้าล้มเหลวในการพัฒนากลยุทธ์ที่เป็นประโยชน์"
 diplomacy_majesty.4030.b:0 "พันธมิตรเป็นสิ่งจำเป็นทั้งในยามสงครามและยามสงบ"
 diplomacy_majesty.4030.c:0 "เพียงแค่คิด เช่นนี้ก็จะเป็นประโยชน์แล้ว"

 diplomacy_majesty.4031.t:1 "$diplomacy_majesty.4030.t$: อิทธิพล"
 diplomacy_majesty.4031.desc:0 "หลังจากการครุ่นคิดหลายคืน ข้าได้คิดค้นกลยุทธ์ที่มั่นคงสำหรับการพิสูจน์ประเด็นของข้าในการโต้วาที\n\nข้าจะเริ่มจากจุดยืนที่แข็งแกร่งโดยการใช้จุดยืนที่เป็นที่นิยมในหัวข้อที่ไม่สามารถโต้แย้งได้ และจากจุดยืนนั้น ข้าจะโจมตีข้อโต้แย้งของคู่ต่อสู้และชี้ให้เห็นข้อบกพร่องทั้งหมดของพวกเขา\n\nการทำ เช่นนี้ ข้าจะขจัดทางออกที่เป็นไปได้ทั้งหมดของปัญหา... ทั้งหมด ยกเว้นทางออกที่ข้าพอใจ นั่นคือ"
 diplomacy_majesty.4031.a:0 "เทคนิคนี้จะโน้มน้าวผู้คนมาอยู่ข้างข้า"

 diplomacy_majesty.4032.t:1 "$diplomacy_majesty.4030.t$: การเผชิญหน้าที่คาดเดาไม่ได้"
 diplomacy_majesty.4032.desc:0 "ข้าใช้เวลาหลายคืนในการคิดค้นกลยุทธ์เพื่อชี้นำการสนทนาไปในทิศทางที่ข้าต้องการ ทบทวนวิธีการที่เป็นไปได้ที่ผู้คนอาจตอบสนองต่อสิ่งที่ข้าพูด\n\nอย่างไรก็ตาม ทุกครั้งที่ข้าพยายามนำกลยุทธ์เหล่านี้ไปปฏิบัติ สิ่งต่างๆ ไม่เคยเป็นไปตามที่ข้าคาดไว้ ข้าเดาว่าไม่มีแผนใดรอดพ้นจากการเผชิญหน้ากับศัตรูได้"
 diplomacy_majesty.4032.a:0 "อย่างน้อยความล้มเหลวนี้ก็ไม่ได้นำไปสู่การสูญเสียชีวิต"

 diplomacy_majesty.4033.t:0 "ห่วงโซ่อุปทานแห่งความคิด"
 diplomacy_majesty.4033.desc:0 "วันนี้ [thinker.GetTitledFirstName] เข้ามาหาข้าพร้อมกับแนวคิดที่น่าสนใจ [thinker.GetSheHe|U] กล่าวว่าการคิดถึงการโต้วาทีในราชสำนักเหมือนกับการรบในสนามรบอาจเป็นประโยชน์ ผู้แสดงต่าง ๆ แสวงหาเป้าหมายที่แตกต่างกัน แต่ละคนพยายามชี้นำการสนทนาเพื่อประโยชน์ของตน แต่จะมีเพียงผู้เดียวเท่านั้นที่จะชนะ"
 diplomacy_majesty.4033.a:0 "[thinker.GetSheHe|U] มีแนวคิดที่น่าสนใจเกี่ยวกับการทูต!"

 # Lure of Language
 diplomacy_majesty.4070.t:0 "เสน่ห์แห่งภาษา"
 diplomacy_majesty.4070.desc:0 "การปกครอง [ROOT.Char.GetPrimaryTitle.GetName] ที่มีความหลากหลายทางวัฒนธรรมมาพร้อมกับความท้าทายในตัวเอง [ROOT.Char.Custom('GetCourtierPlural')] ชาวต่างชาติมักรู้สึกแปลกแยกเมื่อไม่สามารถพูดภาษาแม่ของตนใน [ROOT.Char.Custom('GetCourt')] ได้ ก่อให้เกิดความไม่พอใจ\n\n[my_vassal.Custom2('MyCharacterIntroduction', ROOT.Char)|U] แนะนำว่าข้าสามารถปรับปรุงความสัมพันธ์กับ [ROOT.Char.Custom('GetCourtierPlural')] ชาว [my_vassal.GetCulture.GetName] ของข้าได้อย่างมีนัยสำคัญโดยการเรียนรู้ที่จะพูดภาษาของพวกเขาควบคู่ไปกับภาษาของข้าเอง"
 diplomacy_majesty.4070.a:0 "ถึงเวลาอ่านตำราแล้ว!"
 diplomacy_majesty.4070.b:0 "จ้างครูสอนพิเศษมาสอนข้า"
 diplomacy_majesty.4070.c:0 "จะลำบากไปทำไม? ภาษา [ROOT.Char.GetCulture.GetNameNoTooltip] เหนือกว่าอย่างเห็นได้ชัด"
 diplomacy_majesty.4070.d:0 "ครูสอนพิเศษประจำราชสำนักของข้าสามารถช่วยข้าได้อย่างแน่นอน!"
 diplomacy_majesty.4070.success:0 "ข้าเรียนรู้ที่จะพูดภาษา [my_vassal.GetCulture.GetName]"
 diplomacy_majesty.4070.failure:0 "ข้าล้มเหลวในการเรียนรู้ภาษาใหม่"
 diplomacy_majesty.4070.failure.tt:1 "ท่านอาจเลือกที่จะศึกษาต่อ"

 diplomacy_majesty.4071.t:1 "$diplomacy_majesty.4070.t$: เรียนรู้ภาษาแล้ว"
 diplomacy_majesty.4071.desc:0 "หลังจากศึกษาเป็นเวลาหลายสัปดาห์ ในที่สุดข้าก็เข้าใจพื้นฐานของภาษา [my_vassal.GetCulture.GetName] อย่างถ่องแท้\n\nด้วยการฝึกฝนอย่างต่อเนื่อง ความคล่องแคล่วของข้าจะดีขึ้น แต่แม้ แต่ความเข้าใจพื้นฐานนี้ก็ได้ปรับปรุงความสัมพันธ์ของข้ากับ [ROOT.Char.Custom('GetCourtierPlural')] ชาว [my_vassal.GetCulture.GetNameNoTooltip] ของข้าแล้ว"
 diplomacy_majesty.4071.a:0 "เวลาที่ใช้ไปอย่างคุ้มค่า"
 diplomacy_majesty.4071.b:0 "ช่างเป็นวัฒนธรรมที่น่าสนใจ... ข้าต้องการเรียนรู้เพิ่มเติม!"
 diplomacy_majesty.4070.b.custom:1 "ทุก [close_family|E] [ROOT.Char.Custom('GetCourtier')] และข้าหลวงโดยตรงที่เป็นเด็ก"

 diplomacy_majesty.4072.t:1 "$diplomacy_majesty.4070.t$: เข้าใจยาก!"
 diplomacy_majesty.4072.desc:0 "แม้จะศึกษามาหลายสัปดาห์ ข้าก็ยังไม่สามารถเข้าใจภาษา [my_vassal.GetCulture.GetName] ได้อย่างถ่องแท้ ข้าได้เรียนรู้คำศัพท์บางคำ แต่ไวยากรณ์ การใช้ถ้อยคำ... ยังคงหลุดลอยไปจากข้า ข้าไม่คิดว่านี่จะเป็นประโยชน์"
 diplomacy_majesty.4072.a:0 "ข้าต้องพยายามต่อไป!"
 diplomacy_majesty.4072.b:0 "เวลาของข้าควรใช้ไปกับสิ่งอื่นที่ดีกว่า"
 diplomacy_majesty.4072.c:0 "$diplomacy_majesty.4070.b$"

 diplomacy_majesty.4073.t:1 "$diplomacy_majesty.4070.t$: ความพยายามอันไร้ผล"
 diplomacy_majesty.4073.desc:0 "แม้ข้าจะไม่อยากยอมรับ แต่ข้าก็ไม่คิดว่าข้าจะเชี่ยวชาญภาษา [my_vassal.GetCulture.GetName] ได้เลย ข้าได้พยายามแล้วพยายามอีก แต่ก็ล้มเหลวที่จะมีความคืบหน้าใดๆ... ข้าต้องยอมรับความจริงนี้"
 diplomacy_majesty.4073.a:0 "ข้ายอมแพ้"

 # Trappings of Majesty
 diplomacy_majesty.4090.t:0 "เครื่องประกอบพระบรมราชอิสริยยศ"
 diplomacy_majesty.4090.desc:0 "ข้ายืนอยู่เหนือเหล่าอาณาประชาราษฎร์ในฐานะผู้ปกครองสูงสุด หาผู้ใดในอาณาจักรเทียบเทียมมิได้ การ แต่งกายให้สมฐานะด้วยอาภรณ์และเครื่องประดับอันงดงามจะเป็นเครื่องเตือนใจอย่างแนบเนียนแก่ทุกคนว่าข้าคือผู้กุมอำนาจ"
 diplomacy_majesty.4090.a:0 "มีเพียงขนเออร์มินและกำมะหยี่ที่ดีที่สุดเท่านั้นสำหรับข้า!"
 diplomacy_majesty.4090.b:0 "แฟชั่นท้องถิ่นมีความหมายเชิงสัญลักษณ์"
 diplomacy_majesty.4090.b.desc:0 "ข้าหาช่างตัดเสื้อที่มีทักษะในการใช้วัสดุท้องถิ่น"
 diplomacy_majesty.4090.b.success:0 "ข้าได้รับเครื่อง แต่งกายที่เหมาะกับ [me.GetTitleAsNameNoTooltip]"
 diplomacy_majesty.4090.b.success.tt:1 "เครื่อง แต่งกายใหม่ที่งดงามของท่านเหมาะกับ [me.GetTitleAsNameNoTooltip] อย่างแท้จริง!"
 diplomacy_majesty.4090.b.failure:0 "ข้าได้รับเครื่อง แต่งกายที่น่าเบื่อและไม่น่าประทับใจ"
 diplomacy_majesty.4090.b.failure.tt:1 "เครื่อง แต่งกายใหม่ของท่านไม่สามารถสร้างความประทับใจให้ใครได้"
 diplomacy_majesty.4090.c:0 "ข้าไม่ต้องการ #EMP สิ่งของ#! เพื่อสร้างความชอบธรรมให้กับการปกครองของข้า!"
 diplomacy_majesty.4090.c.zealous:0 "ข้ารับใช้ของ [ROOT.Char.GetFaith.HighGodNamePossessive] ไม่ต้องการเครื่องประดับ!"
 diplomacy_majesty.4090.d.lunatic.male:0 "กางเกงมิใช่อื่นใดนอกจากคุกขังขา!"
 diplomacy_majesty.4090.d.lunatic.neutral:0 "เสื้อผ้ามิใช่อื่นใดนอกจากคุกขังร่างกาย!"
 diplomacy_majesty.4090.d.lunatic.female:0 "เครื่องรัดเอวสตรีมิใช่อื่นใดนอกจากเครื่องผูกมัดอันกดขี่!"
 diplomacy_majesty.4090.d.lunatic_beautiful:0 "ไม่มีเสื้อผ้าใดเทียบได้กับความงามตามธรรมชาติของข้า!"

