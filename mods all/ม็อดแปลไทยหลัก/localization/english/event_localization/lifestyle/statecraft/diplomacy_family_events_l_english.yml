 #Successor's Squabble — Resolve a dispute between your heir and a powerful vassal, by Sean Hughes
 diplomacy_family_special.2200.t:0 "การทะเลาะวิวาทของผู้สืบทอด"
 diplomacy_family_special.2200.desc:2 "ข้ากำลังพักผ่อนอยู่ใน[ROOT.Char.Custom('ResidenceBuilding')]ของข้าในตอนท้ายของวัน เมื่อ[heir.Custom2('MyCharacterIntroduction', ROOT.Char)]เข้ามาด้วยท่าทางทุกข์ใจอย่างเห็นได้ชัด\n\n"[vassal.Custom2('YourCharacterIntroduction', ROOT.Char)|U] ช่างน่ารำคาญเสียจริง!" [heir.GetSheHe] อุทาน "[vassal.GetSheHe|U] เอา แต่พูดพล่ามอยู่ตลอดเวลาว่าข้าไม่เหมาะสมที่จะสืบทอดตำแหน่งต่อจากท่าน [vassal.GetSheHe|U] คิดว่าข้า[SCOPE.Custom('PersonalityGetTraitDescriptionFromFlag')]เกินไปที่จะเป็น"
 diplomacy_family_special.2200.same_title.desc:0 "[ROOT.Char.GetTitleAsNameNoTooltip]"
 diplomacy_family_special.2200.same_sex_title.desc:0 "$diplomacy_family_special.2200.same_title.desc$"
 diplomacy_family_special.2200.opposite_sex_title.desc:0 "[ROOT.Char.GetPrimarySpouse.GetTitleAsNameNoTooltip]"
 diplomacy_family_special.2200.ruler.desc:0 "[ROOT.Char.GetTitleAsNameNoTooltip]"
 diplomacy_family_special.2200.end.desc:0 "คนต่อไปของ[ROOT.Char.GetPrimaryTitle.GetNameNoTier]!""
 diplomacy_family_special.2200.a:0 "มานั่งกับข้า เราจะหารือเรื่องนี้กัน"
 diplomacy_family_special.2200.a.tt:0 "ข้าจะช่วย[heir.GetFirstNameNoTooltip]หาวิธีตอบโต้คำวิจารณ์"
 diplomacy_family_special.2200.b:0 "ข้าจะคุยกับ[vassal.GetTitledFirstNameNoTooltip]เกี่ยวกับเรื่องนี้"
 diplomacy_family_special.2200.b.tt:0 "ข้าจะให้[vassal.GetFirstNameNoTooltip]อธิบายว่าเหตุใด[vassal.GetSheHe]จึงวิจารณ์ทายาทของข้า"
 diplomacy_family_special.2200.c:0 "เหตุใดเจ้าจึงมารบกวนข้าด้วยเรื่องนี้?"

 diplomacy_family_special.2201.desc:0 "ข้าดึง[heir.GetFirstName]มาคุยกันอย่างเปิดอก ข้าบอกได้ว่า[heir.GetSheHe]รู้สึกหงุดหงิดกับสถานการณ์เกี่ยวกับ[vassal.GetTitledFirstName]และยินดีที่จะรับฟังคำแนะนำของข้า"
 diplomacy_family_special.2201.a:0 "เจ้ามีอะไรเหมือนกันมากกว่าที่เจ้าคิด"
 diplomacy_family_special.2201.a.success:0 "[heir.GetFirstNameNoTooltip] และ [vassal.GetFirstNameNoTooltip] แก้ไขความขัดแย้งของพวกเขา"
 diplomacy_family_special.2201.a.failure:0 "[heir.GetFirstNameNoTooltip] ไม่เต็มใจที่จะคืนดีกับ[vassal.GetFirstNameNoTooltip]"
 diplomacy_family_special.2201.b:0 "ข้าสามารถช่วยเจ้าฝึกฝนการเป็นคน[SCOPE.Custom('PersonalityGetTraitDescriptionFromFlagInverted')]..."
 diplomacy_family_special.2201.b.success:0 "ข้าโน้มน้าวให้[heir.GetFirstNameNoTooltip]พยายามและเปลี่ยนบุคลิกภาพของ[heir.GetHerHis]"
 diplomacy_family_special.2201.b.failure:0 "[heir.GetFirstNameNoTooltip] ปฏิเสธที่จะเปลี่ยนบุคลิกภาพของ[heir.GetHerHis]"
 diplomacy_family_special.2201.b.success.tt:0 "[heir.GetTitledFirstName] เริ่มพยายามที่จะเป็น[SCOPE.Custom('PersonalityGetTraitDescriptionFromFlagInvertedTraitLink')]มากขึ้น"
 diplomacy_family_special.2201.b.failure.tt:0 "[heir.GetTitledFirstName] ยังคงเป็น[SCOPE.Custom('PersonalityGetTraitDescriptionFromFlagTraitLink')]"
 diplomacy_family_special.2201.c:0 "ข้าจะ ทำให้[vassal.GetHerHim]ชดใช้ที่วิจารณ์เจ้า!"

 diplomacy_family_special.2202.desc:0 "ข้าจัดการประชุมกับ[vassal.GetTitledFirstName]เพื่อหารือเกี่ยวกับปัญหาของเขากับ[heir.GetTitledFirstName] [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('heir'))]ของข้า\n\n"มันค่อนข้างง่าย [ROOT.Char.GetTitledFirstNameNoTooltip]; ข้าไม่ชอบความคิดที่จะมีนายเหนือหัวที่เป็นคน[SCOPE.Custom('PersonalityGetTraitDescriptionFromFlag')] เพื่อประโยชน์ของ[ROOT.Char.Custom('GetRealmOrDomicile')] ข้ายินดีที่จะแสดงความไม่พอใจของข้าให้เป็นที่ประจักษ์ แม้ว่านั่นหมายถึงการ ทำให้ตัวเองตกอยู่ในความเสี่ยงก็ตาม""
 diplomacy_family_special.2202.a:0 "แต่แล้วคุณสมบัติที่ดีของ[heir.GetHerHis]ล่ะ?"
 diplomacy_family_special.2202.a.success:0 "[vassal.GetFirstNameNoTooltip] และ [heir.GetFirstNameNoTooltip] แก้ไขความขัดแย้งของพวกเขา"
 diplomacy_family_special.2202.a.failure:0 "[vassal.GetFirstNameNoTooltip] ไม่เต็มใจที่จะคืนดีกับ[heir.GetFirstNameNoTooltip]"
 diplomacy_family_special.2202.b:0 "ท่านพูดถูก [heir.GetFirstNameNoTooltip] เป็นความผิดหวัง"
 diplomacy_family_special.2202.c:0 "เจ้าจะไม่วิจารณ์[ROOT.Char.Custom2('RelationToMe', SCOPE.sC('heir'))]ของข้า!"

 diplomacy_family_special.2210.desc:0 "หลังจากพูดคุยกับ[vassal.GetTitledFirstName] [vassal.GetSheHe]ตัดสินใจที่จะพยายามแก้ไขความสัมพันธ์กับ[heir.GetTitledFirstName] โดยมุ่งเน้นไปที่สิ่งที่พวกเขามีเหมือนกันแทนที่จะเป็นความแตกต่าง การเปลี่ยนแปลงความคิดนี้ค่อนข้างมีแนวโน้มที่ดี!"
 diplomacy_family_special.2210.a:0 "นี่เป็นลางดีสำหรับอนาคต!"

 diplomacy_family_special.2211.desc:0 "แม้ว่าข้าจะพยายามอย่างเต็มที่เพื่อโน้มน้าวให้[vassal.GetTitledFirstName]เชื่อว่าเขาสามารถเข้ากับ[heir.GetTitledFirstName]ได้หาก[vassal.GetSheHe]พยายาม แต่คนโง่คนนั้นก็ปฏิเสธที่จะยอมรับสิ่งใดๆ ที่น่าชอบเกี่ยวกับบุคลิกภาพของ[heir.GetTitledFirstNamePossessive]"
 diplomacy_family_special.2211.a:0 "[vassal.GetTitledFirstNameNoTooltip] เป็นคนหยาบคายไร้มารยาทจริงๆ!"
 diplomacy_family_special.2211.a.high_opinion:0 "ข้าคาดหวังสิ่งที่ดีกว่านี้จาก[vassal.GetTitledFirstNameNoTooltip]"

 diplomacy_family_special.2212.desc:0 "หลังจากพูดคุยกับ[heir.GetHerHim] [heir.GetTitledFirstName] กล่าวว่า[heir.GetSheHe]จะพยายามทำตัวให้ดีขึ้นเมื่ออยู่ใกล้[vassal.GetTitledFirstName]\n\nโดยการมุ่งเน้นไปที่สิ่งที่พวกเขามีเหมือนกันแทนที่จะเป็นความแตกต่าง เป็นไปได้ว่ามิตรภาพใหม่จะเกิดขึ้นระหว่างทั้งสอง"
 diplomacy_family_special.2212.a:0 "นี่เป็นลางดีสำหรับอนาคต!"

 diplomacy_family_special.2213.desc:0 "แม้ว่าข้าจะพยายามอย่างเต็มที่เพื่อโน้มน้าวให้[heir.GetTitledFirstName]เชื่อว่าเขาสามารถเข้ากับ[vassal.GetTitledFirstName]ได้หาก[heir.GetSheHe]พยายาม แต่[heir.GetFirstNameNoTooltip]ก็ปฏิเสธที่จะเปลี่ยนพฤติกรรมของ[heir.GetHerHis]เมื่ออยู่ใกล้[vassal.GetTitledFirstNameNoTooltip]\n\nดูเหมือนว่าความเกลียดชังระหว่างพวกเขาจะดำเนินต่อไปอีกระยะหนึ่ง..."
 diplomacy_family_special.2213.a:0 "ข้าผิดหวังในตัว[heir.GetFirstNameNoTooltip]"

 diplomacy_family_special.2220.desc:0 "ข้านั่งลงกับ[heir.GetFirstName]และอธิบายว่าบางครั้งการเป็นคน[SCOPE.Custom('PersonalityGetTraitDescriptionFromFlagInverted')]ก็เป็นประโยชน์สูงสุดต่อ[ROOT.Char.Custom('GetRealmOrDomicile')] แม้ว่าพฤติกรรมดังกล่าวจะไม่เกิดขึ้นตามธรรมชาติก็ตาม\n\nในตอนแรก[heir.GetSheHe|U]ดูเหมือนจะสงสัย แต่ก็ได้รับกำลังใจเมื่อข้าบอก[heir.GetHerHim]ว่าสิ่งต่างๆ เช่นนี้จะง่ายขึ้นตามเวลาและการฝึกฝน"
 diplomacy_family_special.2220.a:0 "เวลาจะเป็นเครื่องพิสูจน์ว่าสิ่งนี้จะเปลี่ยนแปลงสิ่งต่างๆ อย่างไร"
 diplomacy_family_special.2220.a.tt:0 "[heir.GetFirstName] จะพยายามเป็น[SCOPE.Custom('PersonalityGetTraitDescriptionFromFlagInvertedTraitLink')]มากขึ้น"

 diplomacy_family_special.2221.desc:0 "ข้าพยายามโน้มน้าว[heir.GetFirstName]ว่าเหตุใดจึงเป็นประโยชน์ต่อ[heir.GetHerHis]เองที่จะเป็นคน[SCOPE.Custom('PersonalityGetTraitDescriptionFromFlag')]น้อยลง โดยยกตัวอย่างให้[heir.GetHerHim]เห็นว่าการเป็น[ROOT.Char.GetTitleAsNameNoTooltip]ที่[SCOPE.Custom('PersonalityGetTraitDescriptionFromFlagInverted')]นั้นได้เปรียบอย่างไร\n\nอย่างไรก็ตาม [heir.GetSheHe]ปฏิเสธที่จะพิจารณาเปลี่ยนพฤติกรรมของ[heir.GetHerHis] ดูเหมือนว่า[heir.GetSheHe|U]จะยึดมั่นในวิถีทางของ[heir.GetHerHis] แม้ว่านั่นหมายถึงการ ทำให้ผู้อื่นแปลกแยกก็ตาม"
 diplomacy_family_special.2221.a:0 "เหตุใด[heir.GetSheHe]จึงมองไม่เห็นความจริงในคำพูดของข้า?"

 diplomacy_family_special.2231.desc:0 "ความสัมพันธ์ของ[heir.GetTitledFirstName]และ[vassal.GetTitledFirstNamePossessive]อาจเริ่มต้นด้วยความเกลียดชังและความอาฆาตแค้น แต่ภายใต้การนำของข้า พวกเขาเรียนรู้ที่จะเข้าใจและไว้วางใจ ซึ่งกันและกัน การส่งเสริมคุณลักษณะเหล่านี้อย่างระมัดระวังได้นำไปสู่การสร้างมิตรภาพที่แน่นแฟ้นระหว่างพวกเขา!"
 diplomacy_family_special.2231.a:0 "ข้ารู้อยู่แล้วว่าเราทุกคนสามารถแก้ไขปัญหานี้ได้!"

 diplomacy_family_special.2233.desc:0 "ข้าได้สนับสนุนให้[heir.GetFirstName]เปลี่ยนพฤติกรรมของ[heir.GetHerHis]มาหลายปีแล้ว และดูเหมือนว่าความพยายามของข้าจะได้รับผลตอบแทนอย่างแท้จริง!\n\nการเป็นคน[SCOPE.Custom('PersonalityGetTraitDescriptionFromFlagInverted')]ดูเหมือนจะกลายเป็นธรรมชาติที่สองของ[heir.GetHerHim] เป็นนิสัยที่ฝังแน่นจน[heir.GetSheHe]ไม่จำเป็นต้องพยายามทำตัว เช่นนั้นอีกต่อไป"
 diplomacy_family_special.2233.a:0 "ข้ายินดีที่ได้เห็น[heir.GetFirstNameNoTooltip]เติบโตขึ้นในฐานะบุคคล"

diplomacy_family.2400.story_title: "การสั่งสอนผู้สืบทอด"
diplomacy_family.2400.t: "$diplomacy_family.2400.story_title$: ข้อเสนอ"
diplomacy_family.2400.desc: "ในยามเช้าตรู่ [ROOT.Char.Custom2('PartnerOpinionDescription', SCOPE.sC('spouse') )] [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('spouse'))] ของข้าได้เข้ามายัง [ROOT.Char.Custom('GetChambersOrTent')] ของข้า\n\n"[spouse.Custom2('RelationToMe', ROOT.Char)] [ROOT.Char.Custom('ComplimentAdjective')] ของข้า! ช่วงนี้ข้าได้ไตร่ตรองถึงเรื่องการศึกษาของ [heir.GetFirstNamePossessive] และเชื่อว่าความรู้ในด้าน [spouse.Custom('highest_skill_noun')] ของข้าจะเป็นประโยชน์ต่อ [heir.GetHerHim] ท่านจะยินยอมให้ข้าช่วยเหลือท่านในการขัดเกลาวิชาความรู้ของ [heir.GetHerHis] หรือไม่?""
diplomacy_family.2400.a: "ข้าควรปล่อยให้[spouse.GetHerHim]ลองดู"
diplomacy_family.2400.a.tt: "[spouse.GetFirstNameNoTooltip] จะพยายามสั่งสอน [heir.GetFirstNameNoTooltip]"
diplomacy_family.2400.a.result.tt_first: "#weak สิ่งนี้ #EMP อาจจะ#! ช่วยพัฒนาการศึกษาของ [TARGET_CHARACTER.GetFirstNamePossessiveNoTooltip] ได้#!"
diplomacy_family.2400.b: "ข้าสั่งสอนเองก็เพียงพอแล้ว"
diplomacy_family.2410.t: "$diplomacy_family.2400.story_title$: สู่ทางตัน"
diplomacy_family.2410.desc: "ในคืนที่กระสับกระส่าย ข้าเริ่มเดินเตร่ไปเรื่อย เมื่อถึงที่เก็บเสบียง ข้าก็ได้ยินเสียงประหลาด ข้าประหลาดใจที่เห็น [spouse.GetFirstName] [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('spouse'))]ของข้า กำลังยัด [ROOT.Char.Custom('GetExpensiveDessert')] เข้าปากของ[spouse.GetHerHis] [spouse.GetSheHe|U] มองข้าด้วยความอับอายและสิ้นหวัง\n\n"ข้าหมดหนทางสั่งสอน [heir.GetFirstName] แล้ว! แทนที่[heir.GetSheHe]จะฟังข้า [heir.GetSheHe]"
diplomacy_family.2410.rowdy: "กลับวิ่งพล่านก่อเรื่องวุ่นวายไปทั่ว"
diplomacy_family.2410.charming: "กลับเอาแต่คุยจ้อกับเด็กคนอื่นตลอดเวลา"
diplomacy_family.2410.curious: "กลับทำให้ข้าแทบเป็นบ้าด้วยคำถามที่ไม่ตรงประเด็น"
diplomacy_family.2410.pensive: "กลับเอาแต่ก้มหน้าก้มตาอ่านหนังสือของ[heir.GetHerHis]"
diplomacy_family.2410.bossy: "กลับทำในสิ่งที่ตรงข้ามกับที่ข้าสั่ง[heir.GetHerHim]ทุกอย่าง"
diplomacy_family.2410.desc.after: "ข้าไม่อาจทนต่อไปได้โดยไม่เสียสติเสียก่อน""
diplomacy_family.2410.a: "ข้าควรซื้อสื่อการสอนให้[spouse.GetHerHim]"
diplomacy_family.2410.a.tt: "ท่านช่วยเหลือ [spouse.GetFirstNameNoTooltip] ในการสอน [heir.GetNameNoTooltip]"
diplomacy_family.2410.a.possible_outcome_good.tt_first: "#weak ด้วยทักษะของท่านทั้งสองรวมกัน การศึกษาของ [TARGET_CHARACTER.GetFirstNamePossessiveNoTooltip] อาจพัฒนาขึ้น #P อย่างมาก#! #!"
diplomacy_family.2410.a.possible_outcome_mediocre.tt_first: "#weak ด้วยทักษะของท่านทั้งสองรวมกัน การศึกษาของ [TARGET_CHARACTER.GetFirstNamePossessiveNoTooltip] อาจพัฒนาขึ้น #M เล็กน้อย#! #!"
diplomacy_family.2410.b: ""ท่านต้องพยายามให้มากกว่านี้""
diplomacy_family.2410.b.tt: "ท่านให้กำลังใจ [spouse.GetFirstNameNoTooltip] ในการสั่งสอน [heir.GetFirstNameNoTooltip] ต่อไป"
diplomacy_family.2410.b.possible_outcome.tt_first: "#weak การศึกษาของ [TARGET_CHARACTER.GetFirstNamePossessiveNoTooltip] จะได้รับการพัฒนา #!"
diplomacy_family.2410.c: "ให้ข้าจัดการเรื่องนี้แทนเถิด"
diplomacy_family.2410.c.possible_outcome_you.tt_first: "#weak การศึกษาของ [TARGET_CHARACTER.GetFirstNamePossessiveNoTooltip] จะได้รับการพัฒนา #!"
diplomacy_family.2411.t: "$diplomacy_family.2400.story_title$: ความพยายามร่วมกัน"
diplomacy_family.2411.desc: "หลังจากทำงานหนักและอุทิศตนให้กับการสั่งสอนของ [heir.GetFirstNamePossessive] มานานหลายเดือน [spouse.GetFirstName] [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('spouse'))]ของข้า ก็เข้ามาหาข้าใน[ROOT.Char.Custom('GetChambersOrTent')] ใบหน้าของ[spouse.GetHerHis|U]เปี่ยมไปด้วยความภาคภูมิใจ\n\n"โอ้ [ROOT.Char.GetFirstNameNoTooltip]! ด้วยคำแนะนำและการสนับสนุนจากท่าน [heir.GetNameNoTooltip] [heir.Custom('PetName')]ของเรา ทำผลงานการศึกษาของ[heir.GetHerHis]ได้ยอดเยี่ยมมาก ข้าคงแย่แน่ถ้าไม่มีท่าน""
diplomacy_family.2411.a: "อนาคตของ [heir.GetFirstNameNoTooltip] ช่างสดใสยิ่งนัก"
diplomacy_family.2411.a.outcome_spouse_medium.tt_global_past: "#weak จากทักษะที่พอใช้ได้ของคู่สมรส#!"
diplomacy_family.2411.a.outcome_you_medium.tt_global_past: "#weak จากทักษะที่พอใช้ได้ของท่าน#!"
diplomacy_family.2411.a.outcome_spouse_good.tt_global_past: "#weak จากทักษะอันยอดเยี่ยมของคู่สมรส#!"
diplomacy_family.2411.a.outcome_you_good.tt_global_past: "#weak จากทักษะอันยอดเยี่ยมของท่าน#!"
