 ###################
 # Standard Events #
 ###################

 # An Opportune Moment, by Mathilda Bjarnehed
 diplomacy_family.0007.t:0 "ช่วงเวลาอันเหมาะสม"
 diplomacy_family.0007.desc:1 "งานเลี้ยงอาหารค่ำที่ข้าจัดเตรียมไว้อย่างรอบคอบดำเนินไปตามแผน และข้าพบว่าตนเองอยู่ตามลำพังกับ[voter.GetTitledFirstName] ด้วยฤทธิ์ไวน์และ[voter.Custom('FavoriteTreat')]ของโปรดของ[voter.GetHerHis] ดูเหมือนว่า[voter.GetSheHe]จะมีความสุขมากกว่าที่ข้าเคยเห็น[voter.GetHerHim]มาหลายเดือน\n\nนี่เป็นโอกาสอันดีที่จะโน้มน้าวให้[voter.GetFirstNameNoTooltip]ลงคะแนนให้[candidate.GetTitledFirstName] [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('candidate'))]ของข้า..."
 diplomacy_family.0007.a:0 "นำเสนอข้อโต้แย้งที่น่าเชื่อถือที่สุดของข้า"
 diplomacy_family.0007.a.success.tt:1 "ท่านโน้มน้าว[voter.GetTitledFirstNameNoTooltip]ได้สำเร็จ"
 diplomacy_family.0007.a.success.desc:0 "ข้าโน้มน้าวให้[voter.GetTitledFirstName]ลงคะแนนให้[candidate.GetTitledFirstName]ได้สำเร็จ"
 diplomacy_family.0007.a.failure.tt:1 "ท่านโน้มน้าว[voter.GetTitledFirstNameNoTooltip]ไม่สำเร็จ"
 diplomacy_family.0007.a.failure.desc:0 "ความพยายามของข้าในการโน้มน้าว[voter.GetTitledFirstName]ล้มเหลว"
 diplomacy_family.0007.c:0 "บุญคุณต้องทดแทน ดูเหมือนจะยุติธรรมดี มิใช่หรือ?"
 diplomacy_family.0007.b:0 "ถุงเงินใบนี้อาจเปลี่ยนใจ[voter.GetHerHis]ได้..."
 diplomacy_family.0007.placeholder.tt:0 "[voter.GetShortUIName|U] จะลงคะแนนเลือก[candidate.GetShortUIName]เป็นผู้ปกครองคนต่อไปของ[title.GetNameNoTier]"

 # A Flaw of Character, by Mathilda Bjarnehed
 diplomacy_family.0008.t:0 "ข้อบกพร่องทางอุปนิสัย"
 diplomacy_family.0008.start.desc:1 "เมื่อข้าจากโลกนี้ไปแล้ว [disagreeable_heir.Custom2('MyCharacterIntroduction', ROOT.Char)] จะปกครองแทนข้า\n\nน่าเสียดายที่ข่าวลือเกี่ยวกับ [disagreeable_heir.GetFirstNamePossessiveNoTooltip]"
 diplomacy_family.0008.lazy.desc:0 "ความเกียจคร้านอันน่าอับอาย"
 diplomacy_family.0008.craven.desc:0 "ความขี้ขลาดตาขาวอย่างที่สุด"
 diplomacy_family.0008.arbitrary.desc:0 "การขาดศีลธรรมอย่างสิ้นเชิง"
 diplomacy_family.0008.callous.desc:0 "หัวใจอันเย็นชาดุจหิน"
 diplomacy_family.0008.stubborn.desc:0 "ความดื้อรั้นอันน่ารำคาญ"
 diplomacy_family.0008.gluttonous.desc:0 "ความตะกละอันน่ารังเกียจ"
 diplomacy_family.0008.greedy.desc:0 "ความโลภอันไม่รู้จักพอ"
 diplomacy_family.0008.arrogant.desc:0 "ความหยิ่งผยองอันไม่สำนึกผิด"
 diplomacy_family.0008.deceitful.desc:0 "คำโกหกและเล่ห์เหลี่ยม"
 diplomacy_family.0008.vengeful.desc:0 "ความแค้นที่ไม่สิ้นสุด"
 diplomacy_family.0008.end.desc:0 "ได้แพร่กระจายไปทั่วราชสำนักของข้า มัน ทำให้ข้าสงสัยว่า [disagreeable_heir.GetSheHe] จะสามารถรักษาการสนับสนุนจากข้าหลวงของข้าได้หรือไม่เมื่อข้าจากไป..."
 diplomacy_family.0008.end_no_vassals.desc:0 "ได้แพร่กระจายไปทั่ว [ROOT.Char.Custom('GetCourt')] ของข้า มัน ทำให้ข้าสงสัยว่า [disagreeable_heir.GetSheHe] สามารถรับผิดชอบต่อ [ROOT.Char.GetPrimaryTitle.GetNameNoTierNoTooltip] และประชาชนของตนได้หรือไม่เมื่อข้าจากไป..."
 diplomacy_family.0008.a:0 "พยายามแก้ไขข้อบกพร่องของ[disagreeable_heir.GetFirstNamePossessiveNoTooltip]"
 diplomacy_family.0008.a.tt:0 "[disagreeable_heir.GetShortUIName|U] อาจเอาชนะข้อบกพร่องของ[disagreeable_heir.GetHerHis]ได้"
 diplomacy_family.0008.b:0 "พูดถึงคุณสมบัติที่ดีของ[disagreeable_heir.GetHerHis]แทน"
 diplomacy_family.0008.b.custom:0 "[ROOT.Char.Custom('GetFollowerOrVassal')]ทุกคน"
 diplomacy_family.0008.c:0 "มุ่งเน้นที่ตนเองและเป็นผู้นำด้วยการเป็นแบบอย่าง"


 diplomacy_family.0009.desc:0 "[disagreeable_heir.GetTitledFirstName] ตกลงที่จะให้ข้าเป็นพี่เลี้ยงให้[disagreeable_heir.GetHerHim] แม้ว่าความกระตือรือร้นของ[disagreeable_heir.GetHerHis]จะค่อนข้างขาดหายไป\n\nข้าเกรงว่าความชั่วร้ายของ[disagreeable_heir.GetHerHis]จะฝังรากลึก แต่ประสบการณ์ที่เปิดหูเปิดตาอย่างแท้จริงอาจ ทำให้[disagreeable_heir.GetHerHim]ตระหนักถึงความเขลาในวิถีทางของ[disagreeable_heir.GetHerHis]\n\nเราควรทำอย่างไร?"
 diplomacy_family.0009.wronglessonstart.desc:0 "เมื่อข้าสังเกตเห็น [disagreeable_heir.GetFirstName] ปฏิบัติภารกิจที่ได้รับมอบหมายของ [disagreeable_heir.GetHerHis] ความสงสัยก็ค่อย ๆ คืบคลานเข้ามาในใจข้า [disagreeable_heir.GetSheHe|U] ไม่ได้ดิ้นรนที่จะ"
 diplomacy_family.0009.compassion.desc:0 "เอาใจ[disagreeable_heir.GetHerselfHimself]ไปใส่ใจผู้ที่ด้อยโอกาสกว่าและเห็นใจพวกเขา,"
 diplomacy_family.0009.honor.desc:0 "ยอมรับความผิดพลาดของ[disagreeable_heir.GetHerHis]และรับมือกับผลที่ตามมา,"
 diplomacy_family.0009.greed.desc:0 "สละทรัพย์สินทางวัตถุ,"
 diplomacy_family.0009.energy.desc:0 "ปกครองแทนข้า,"
 diplomacy_family.0009.vengefulness.desc:0 "แสดงการให้อภัยอย่างแท้จริง,"
 diplomacy_family.0009.wronglessonend.desc:0 "และดูเหมือนว่า[disagreeable_heir.GetSheHe]จะไม่ได้เรียนรู้อะไรจากแบบฝึกหัดนี้เลย\n\nข้าจะให้โอกาส[disagreeable_heir.GetFirstNameNoTooltip]อีกครั้ง และบางทีข้าควรเปลี่ยนวิธีการของข้า\n\nครั้งนี้ เราจะ..."

 diplomacy_family.0009.rightlessonstart.desc:0 "เป็นเรื่องน่าหงุดหงิดที่ต้องสังเกตเห็น[disagreeable_heir.GetFirstName]พยายามอย่างยากลำบากที่จะ"
 diplomacy_family.0009.rightlessonend.desc:0 "ข้าสงสัยว่า[disagreeable_heir.GetSheHe]พยายามด้วยซ้ำหรือไม่!\n\nข้าเกือบจะแน่ใจว่าความผิดอยู่ที่ระดับความกระตือรือร้นของ[disagreeable_heir.GetFirstNamePossessiveNoTooltip]มากกว่าบทเรียนของข้า ข้าจะให้โอกาส[disagreeable_heir.GetHerHim]อีกครั้ง...\n\nคำถามคือ เราควรลองใช้กลยุทธ์ใหม่หรือไม่? หรือความพากเพียรจะเอาชนะในวันนี้?"
 diplomacy_family.0009.a:0 "ออกไปตามท้องถนนและพูดคุยกับคนยากจน"
 diplomacy_family.0009.a.tt:0 "บทเรียนที่เหมาะสมสำหรับผู้ที่ต้องการฝึกฝนความเห็นอกเห็นใจ"
 diplomacy_family.0009.b:0 "ยอมรับการกระทำผิดและแก้ไขให้ถูกต้อง"
 diplomacy_family.0009.b.tt:0 "บทเรียนที่เหมาะสมสำหรับผู้ที่ต้องการฝึกฝนเกียรติยศ"
 diplomacy_family.0009.c:0 "มอบทรัพย์สินให้แก่ผู้ขัดสน"
 diplomacy_family.0009.c.tt:0 "บทเรียนที่เหมาะสมสำหรับผู้ที่ต้องการฝึกฝนความเอื้อเฟื้อเผื่อแผ่"
 diplomacy_family.0009.d:0 "[disagreeable_heir.GetFirstNameNoTooltip] จะว่าราชการแทนข้า"
 diplomacy_family.0009.d.tt:0 "บทเรียนที่เหมาะสมสำหรับผู้ที่ต้องการฝึกฝนความเด็ดขาด"
 diplomacy_family.0009.e:0 "ให้อภัยผู้ที่ทำผิดต่อ[disagreeable_heir.GetHerHim]"
 diplomacy_family.0009.e.tt:0 "บทเรียนที่เหมาะสมสำหรับผู้ที่ต้องการฝึกฝนการปล่อยวาง"


 diplomacy_family.0010.t:1 "$diplomacy_family.0008.t$: ความเข้าใจที่ค้นพบใหม่"
 diplomacy_family.0010.start.desc:0 "ข้ายินดีเป็นอย่างยิ่งที่ได้เห็นการเปลี่ยนแปลงในตัว[disagreeable_heir.GetTitledFirstName]!"
 diplomacy_family.0010.compassion.desc:0 "แม้ว่าในตอนแรก[disagreeable_heir.GetSheHe]จะไม่สนใจ แต่เรื่องราวของสิ่งมีชีวิตที่น่าสงสารเหล่านั้นที่เราพบดูเหมือนจะกระตุ้นบางสิ่งในใจของ[disagreeable_heir.GetHerHis]\n\nระหว่างทางกลับบ้าน [disagreeable_heir.GetSheHe]นั่งครุ่นคิดอย่างเงียบๆ และดูเหมือนจะไม่ค่อย"
 diplomacy_family.0010.honor.desc:0 "แม้ว่าในตอนแรก[disagreeable_heir.GetSheHe]จะไม่คิดว่า[disagreeable_heir.GetSheHe]ทำผิด แต่การตอบสนองที่[disagreeable_heir.GetSheHe]ได้รับเมื่อแก้ไขเรื่องนี้ก็เข้าถึง[disagreeable_heir.GetHerHim]ได้\n\nข้าสงสัยว่า[disagreeable_heir.GetFirstNameNoTooltip]ไม่เคยได้รับความเคารพ เช่นนั้นมาก่อน และดูเหมือนจะไม่ค่อย"
 diplomacy_family.0010.greed.desc:0 "แน่นอนว่า ในตอนแรก[disagreeable_heir.GetSheHe]พยายามอย่างยากลำบากที่จะสละทรัพย์สินของ[disagreeable_heir.GetHerHis] แต่การได้สัมผัสกับความสุขและความกตัญญูของผู้ที่ต้องการอย่างแท้จริงเป็นสิ่งใหม่สำหรับ[disagreeable_heir.GetHerHim]โดยสิ้นเชิง\n\nระหว่างทางกลับบ้าน [disagreeable_heir.GetFirstNameNoTooltip]ถึงกับสารภาพว่า[disagreeable_heir.GetSheHe]ไม่ได้คิดถึงสิ่งของส่วนใหญ่ด้วยซ้ำ และดูเหมือนจะไม่ค่อย"
 diplomacy_family.0010.energy.desc:0 "ในตอนแรกข้ากังวลเกี่ยวกับผลลัพธ์ของการมอบความรับผิดชอบมากมายให้[disagreeable_heir.GetHerHim] แต่ เนื่องจาก[disagreeable_heir.GetSheHe]ไม่มีใครให้หลบซ่อนหรือมอบหมายงานให้ [disagreeable_heir.GetSheHe]จึงก้าวขึ้นมารับภารกิจนั้น\n\n[disagreeable_heir.GetFirstNameNoTooltip]ประหลาดใจยิ่งกว่าข้าในพรสวรรค์ที่ซ่อนเร้นของ[disagreeable_heir.GetHerHis] และดูเหมือนจะไม่ค่อย"
 diplomacy_family.0010.vengefulness.desc:0 "ข้าเห็นได้ว่ามันยากเพียงใดสำหรับ[disagreeable_heir.GetHerHim]ที่จะเผชิญหน้ากับ[dummy_gender.GetWomanMan]ผู้ที่ทำผิดต่อ[disagreeable_heir.GetHerHim] คำพูดติดอยู่ในปากของ[disagreeable_heir.GetHerHis]ขณะที่[disagreeable_heir.GetSheHe]พยายามพูด\n\nโชคดีที่[dummy_gender.GetWomanMan]ตอบสนองอย่างมีเมตตา และโดยการทำตามแบบอย่างของ[dummy_gender.GetHerHis] [disagreeable_heir.GetFirstName]ได้ให้อภัย[dummy_gender.GetHerHim]อย่างจริงใจ [disagreeable_heir.GetSheHe|U] ดูเหมือนจะไม่ค่อย"
 diplomacy_family.0010.lazy.desc:0 "เกียจคร้าน"
 diplomacy_family.0010.craven.desc:0 "ไม่มั่นคง"
 diplomacy_family.0010.arbitrary.desc:0 "ตามอำเภอใจ"
 diplomacy_family.0010.callous.desc:0 "ใจดำ"
 diplomacy_family.0010.stubborn.desc:0 "ดื้อรั้น"
 diplomacy_family.0010.gluttonous.desc:0 "ตะกละ"
 diplomacy_family.0010.greedy.desc:0 "เห็นแก่ตัว"
 diplomacy_family.0010.arrogant.desc:0 "สำคัญตน"
 diplomacy_family.0010.deceitful.desc:0 "ไม่ซื่อสัตย์"
 diplomacy_family.0010.sadistic.desc:0 "ใจร้าย"
 diplomacy_family.0010.vengeful.desc:0 "อาฆาตแค้น"
 diplomacy_family.0010.end.desc:0 "ตั้งแต่นั้นมา"
 diplomacy_family.0010.a:0 "ความสำเร็จอันยิ่งใหญ่ สำหรับเราทั้งคู่!"
 diplomacy_family.0010.b:0 "นี่เป็นเพียงแบบฝึกหัดเพื่อการเรียนรู้ ไม่มีอะไรมากไปกว่านั้น"
 diplomacy_family.0010.c:0 "นี่เป็นเพียงก้าวแรก! เราต้องทำงานหนักขึ้น!"

 diplomacy_family.0011.t:1 "$diplomacy_family.0008.t$: ยึดติดกับวิถีทางของ[disagreeable_heir.GetHerHis|U]"
 diplomacy_family.0011.start.desc:0 "[disagreeable_heir.GetTitledFirstName] และ [disagreeable_heir.GetHerHis]"
 diplomacy_family.0011.end.desc:0 "ของ[disagreeable_heir.GetHerHis]กำลัง ทำให้ข้าคลั่ง! แม้ว่าข้าจะพยายามอย่างเต็มที่แล้ว แต่[disagreeable_heir.GetSheHe]ก็ไม่มีความคืบหน้าใดๆ\n\nหากใจของ[disagreeable_heir.GetHerHis]ไม่มุ่งมั่นที่จะเปลี่ยนแปลง มันก็จะไม่มีวันเกิดขึ้น"
 diplomacy_family.0011.a:0 "ข้ายอมแพ้..."

 # Family Quarrel, by Petter Vilberg
 diplomacy_family.2101.t:0 "การทะเลาะวิวาท"
 diplomacy_family.2101.desc:0 "[family_1.Custom2('MyCharacterIntroduction', ROOT.Char)|U] โต้เถียงกับ [family_2.Custom2('HerHisCharacterIntroduction', family_1)] มาหลายวันแล้ว เมื่อครู่นี้ข้าแว่วได้ยินพวกเขากำลังโต้เถียงกันใน [ROOT.Char.Custom('GetRoom')] ที่อยู่ถัดไป เกี่ยวกับ...\n\n"เหลือเชื่อ!" [family_1.GetFirstName] ตะโกน, "เหตุใด [family_2.Custom2('InsultNoun', SCOPE.sC('family_1'))] เยี่ยงเจ้าจึงเชื่อว่าตนคือตัวแทนอันสูงส่งแห่งคุณธรรมของตระกูล [ROOT.Char.GetDynastyName]!? ข้าผู้นี้ #EMP คู่ควร#! กับการยอมรับนั้น #EMP มาก#! กว่าเจ้าอย่างชัดเจน!""
 diplomacy_family.2101.a:0 "ห้ามทะเลาะกันในครอบครัว!"
 diplomacy_family.2101.a.tt: "ท่านพยายามห้ามการทะเลาะของพวกเขา"
 diplomacy_family.2101.b:0 "ปล่อยให้พวกเขาจัดการเรื่องทะเลาะกันอย่างสงบ"

 diplomacy_family.2102.desc:0 "ขณะที่ข้าเดินเข้าไปใน[ROOT.Char.Custom('GetRoom')] [family_1.GetFirstName] หันมาเผชิญหน้ากับข้า "ข้ายินดีที่ท่านอยู่ที่นี่ [ROOT.Char.GetFirstNameNoTooltip] ท่านช่วยพูดให้[family_2.Custom2('YourCharacterIntroduction', ROOT.Char)]เข้าใจเหตุผลหน่อยได้หรือไม่? [family_2.GetSheHe|U] ไร้เหตุผลอย่างสิ้นเชิง!""
 diplomacy_family.2102.a:0 "ใช่ น่าละอายจริงๆ [family_2.GetFirstNameNoTooltip]!"
 diplomacy_family.2102.b:0 "เจ้าผิดเองในเรื่องนี้ [family_1.GetFirstNameNoTooltip]"
 diplomacy_family.2102.c:0 "พวกเจ้าทั้งคู่ทำตัวเหมือนเด็กเอา แต่ใจ!"
 diplomacy_family.2102.c.success:0 "พวกเขาฟังเหตุผล"
 diplomacy_family.2102.c.failure:0 "พวกเขาปฏิเสธที่จะฟัง"
 diplomacy_family.2102.d:0 "ฮ่า! ข้าคือชาว[ROOT.Char.GetDynastyNameNoTooltip]ที่ #EMP ดีที่สุด#! อย่างชัดเจน!"
 diplomacy_family.2102.d.flavor:0 "อืม นั่นเป็นวิธีหนึ่งที่จะหยุดพวกเขาจากการทะเลาะกับ #EMP กันเอง#!..."

 # Choosing Best Friend, by Flavio Verna

 diplomacy_family.2200.t:0 "สหายรักที่สุดของข้า"
 diplomacy_family.2200.desc:0 "มี[ruler.GetWomenMen]เพียงไม่กี่คนที่โชคดีพอที่จะมีสหายมากมาย เช่นข้า ข้าซาบซึ้งในการสนับสนุนของพวกเขาและมอบความไว้วางใจให้พวกเขาอย่างเท่าเทียมกัน ทว่าข้ารู้สึกว่า ท่ามกลางเหล่าดวงวิญญาณผู้กล้าหาญทั้งหลายที่ข้านับเป็นสหายผู้ภักดีในชีวิต มีคนหนึ่งที่เข้าใจข้าเหนือสิ่งอื่นใด"
 diplomacy_family.2200.a:0 "[friend_1.GetTitledFirstNameNoTooltip] คือสหายรักที่สุดของข้า"
 diplomacy_family.2200.a.tt:1 "[friend_1.GetTitledFirstName] อาจกลายเป็นสหายรักที่สุดของท่าน"
 diplomacy_family.2200.b:0 "ข้าไว้วางใจ[friend_2.GetFirstNameNoTooltip]มากกว่าใคร"
 diplomacy_family.2200.b.tt:1 "[friend_2.GetTitledFirstName] อาจกลายเป็นสหายรักที่สุดของท่าน"
 diplomacy_family.2200.c:0 "จะเป็นใครอื่นไปได้นอกจาก[friend_3.GetTitledFirstNameNoTooltip]?"
 diplomacy_family.2200.c.tt:1 "[friend_3.GetTitledFirstName] อาจกลายเป็นสหายรักที่สุดของท่าน"
 diplomacy_family.2200.d:1 "ข้าไม่ควรลำเอียง"

 diplomacy_family.2201.desc:0 "เมื่อไม่นานมานี้เองที่ข้าเริ่มตระหนักว่าข้าพึ่งพาคำแนะนำและการสนับสนุนของ[ruler.GetFirstNamePossessive]มากเพียงใด ข้าได้มองเห็น[ruler.GetHerHim]เป็นสหายที่ใกล้ชิดและรักใคร่ที่สุดของข้า"
 diplomacy_family.2201.a:0 "เราเป็นจิตวิญญาณที่ผูกพันกันอย่างแท้จริง"
 diplomacy_family.2201.b:0 "เราเป็นสหายกัน แน่นอน แต่นั่นคือทั้งหมด"
 diplomacy_family.2201.b.tt:1 "เรายังคงเป็นเพียงสหายกัน"
 diplomacy_family.2201.a.tt:0 "เรากลายเป็นสหายรักที่แท้จริง"

 # Jealous relative vs lover's spouse, by Flavio Verna

 diplomacy_family.2250.t:0 "[lover.Custom2('RelationToMeShort', SCOPE.sC('ruler'))|U]ผู้หึงหวง"
 diplomacy_family.2250.desc.intro:0 "ข้าสุดจะทนเห็นภาพ [ruler.Custom2('RelationToMeShort', SCOPE.sC('lover'))] อันเป็นที่รักของข้า, [lover.GetFirstName], ไปใช้เวลากับ [spouse.GetWifeHusband] [spouse.Custom2('InsultAdjective', ROOT.Char)] ของ [lover.GetHerHis], [spouse.GetTitledFirstName]"
 diplomacy_family.2250.desc.legal.pure:0 "\n\nความคิดที่ว่ามืออันไม่บริสุทธิ์จะแปดเปื้อนร่างกายของ[lover.GetHerHis]นั้นช่างเหลือทน เราทั้งคู่มาจากตระกูล[ruler.GetHouse.GetName] เราคู่ควรกัน!"
 diplomacy_family.2250.desc.legal.same:0 "\n\nเหตุใด[ruler.GetFaith.HighGodName]จึงควรโปรดปราน[ruler.Custom2('RelationToMeShort', SCOPE.sC('spouse'))]ของข้ามากกว่าข้า? เราทั้งคู่เป็นสมาชิกของตระกูล[ruler.GetHouse.GetName] แต่[spouse.GetFirstNameNoTooltip]สามารถอยู่กับ[lover.GetHerHim]ได้ ในขณะที่ข้าต้องซ่อนตัวอยู่ในเงาของพวกเขา"
 diplomacy_family.2250.desc.illegal:0 "\n\nแม้ว่าเราจะ แต่งงานกันไม่ได้ นั่นก็ไม่ได้หมายความว่าข้าจะไม่กังวลว่า [lover.GetSheHe] จะใช้ชีวิตที่เหลืออยู่ [lover.GetHerHis] กับใคร!"
 diplomacy_family.2250.a:0 "[spouse.GetFirstNameNoTooltip] ควรเก็บมือของ[spouse.GetHerHis]ไว้กับ[spouse.GetHerselfHimself]!"
 diplomacy_family.2250.a.tt:0 "ข้าจะพยายามห้ามปราม[spouse.GetTitledFirstName]จากการนอนกับ[ruler.Custom2('RelationToMeShort', SCOPE.sC('lover'))]ของข้า"
 diplomacy_family.2250.a.success.duel:0 "ข้าข่มขู่[spouse.GetTitledFirstName]ได้สำเร็จ"
 diplomacy_family.2250.a.failure.duel:0 "[spouse.GetTitledFirstName] เพิกเฉยต่อคำเตือนของข้า"
 diplomacy_family.2250.a.failure.tt:0 "[spouse.GetTitledFirstName] เพิกเฉยต่อคำเตือนของข้าเกี่ยวกับ[lover.GetFirstName]"
 diplomacy_family.2250.b.a:0 ""ทำไมเจ้าไม่ตายไปเสียที!?!""
 diplomacy_family.2250.b.b:0 "[spouse.GetSheHe|U] ต้องถูกจัดการ"
 diplomacy_family.2250.b.tt:0 "[scheme|E] จะมี[success_chance|E]เพิ่มขึ้น"
 diplomacy_family.2250.b.spouse_joining:0 "[lover.GetFirstName] #P จะ#! เข้าร่วม[scheme|E]ของข้า"
 diplomacy_family.2250.b.spouse_refusing:0 "[lover.GetFirstName] #N จะไม่#! เข้าร่วม[scheme|E]ของข้า"
 diplomacy_family.2250.c.a:0 "[house_head.GetTitledFirstNameNoTooltip] ต้องยุติการ แต่งงานนี้!"
 diplomacy_family.2250.c.b:0 "ข้าต้องยุติการ แต่งงานนี้!"
 diplomacy_family.2250.c.flavor:0 "[house_head|E] มีอำนาจที่จะเพิกถอนการ แต่งงานของ[lover.GetFirstNamePossessive]"
 diplomacy_family.2250.d:0 "ข้าต้องเรียนรู้ที่จะอยู่กับความปวดร้าวของข้า"

 diplomacy_family.2251.desc:0 "[spouse.GetTitledFirstName] จะคิดให้รอบคอบก่อนที่จะแตะต้อง[lover.GetFirstName]ของข้าอีกครั้ง ข้าระมัดระวังอย่างยิ่งที่จะไม่เปิดเผยเหตุผลของข้า แต่ก็อาจเป็นเรื่องโง่เขลาที่จะกดดันเรื่องนี้อีกในอนาคต \n\nไม่ช้าก็เร็ว [spouse.GetFirstNameNoTooltip]จะหาทางเพิกเฉยต่อคำขู่ของข้าได้ แต่สำหรับตอนนี้ ข้าสามารถพักผ่อนได้อย่างสบายใจ"
 diplomacy_family.2251.a:0 "ข้าหวังว่า[ruler.Custom2('RelationToMeShort', SCOPE.sC('lover'))]ของข้าจะซาบซึ้ง"
 diplomacy_family.2252.desc:0 ""ท่านช่างไม่คิดถึงใจผู้อื่นเสียเลย?!" [lover.GetFirstName] กระซิบใส่ข้า ไม่กล้าขึ้นเสียง [lover.GetHerHis] แม้จะอยู่ใน [ROOT.Char.Custom('GetRoomPlural')] ของข้าเอง\n\n ดูเหมือนว่า [spouse.GetTitledFirstName] ได้เพิกเฉยต่อคำเตือนของข้าและได้แจ้ง [ruler.Custom2('RelationToMeShort', SCOPE.sC('lover'))] ของข้าเรื่องที่เราคุยกัน\n\n"ข้าไม่อาจละเลยหน้าที่ในชีวิตสมรสเพื่อท่านได้ [ruler.GetFirstNameNoTooltip]!" พูดจบ [lover.GetSheHe] ก็จากไปอย่างเร่งรีบ"
 diplomacy_family.2252.a:0 "แต่...!"
 diplomacy_family.2253.desc.a:0 "แผนของข้าสำเร็จอย่างงดงาม! [lover.GetFirstName] เป็นอิสระจาก [spouse.Custom2('InsultNoun', ROOT.Char)] หยาบคายผู้นั้น, [spouse.GetTitledFirstName], และพวกเราก็ยินดีเป็นล้นพ้น\n\n[lover.GetSheHe|U] รีบรุดมายัง [ROOT.Char.Custom('GetRoomPlural')] ของข้าทันทีที่ [lover.GetSheHe] ได้ยินข่าวจาก [house_head.GetTitledFirstName] เพื่อแสดงความขอบคุณของ [lover.GetHerHis] ด้วยวิธีอันแสนหวาน"
 diplomacy_family.2253.desc.b:0 "แผนของข้าสำเร็จอย่างงดงาม! [lover.GetFirstName] เป็นอิสระจาก [spouse.Custom2('InsultNoun', ROOT.Char)] หยาบคายผู้นั้น, [spouse.GetTitledFirstName], และพวกเราก็ยินดีเป็นล้นพ้น\n\n[lover.GetSheHe|U] รีบรุดมายัง [ROOT.Char.Custom('GetRoomPlural')] ของข้าทันทีที่ [lover.GetSheHe] ได้รับจดหมายของข้า เพื่อแสดงความขอบคุณของ [lover.GetHerHis] ด้วยวิธีอันแสนหวาน"
 diplomacy_family.2253.a:0 "ในที่สุดเราก็สามารถอยู่ด้วยกันตลอดไป!"
 diplomacy_family.2253.b:0 "สิ่งที่ข้าทำเพื่อครอบครัว..."
 diplomacy_family.2253.c:0 "ทุกคนจะต้องรู้เรื่องความรักของเรา!"
 diplomacy_family.2254.desc.a:0 "ข้าหวังว่า[lover.GetFirstName]จะขอบคุณข้าที่ยื่นคำร้องต่อ[house_head.GetTitledFirstName]ให้หย่า[lover.GetHerHim]จาก[spouse.GetFirstName] แต่มันกลับตรงกันข้าม\n\n[lover.GetSheHe|U] โกรธจัดกับการที่ข้าเข้าไปยุ่งเกี่ยวกับชีวิตสมรสของ[lover.GetHerHis] และไม่ต้องการเกี่ยวข้องอะไรกับข้าอีกต่อไป"
 diplomacy_family.2254.desc.b:0 "ข้าหวังว่า[lover.GetFirstName]จะขอบคุณข้าที่จัดการเรื่องหย่าให้[lover.GetHerHim] แต่มันกลับตรงกันข้าม\n\n[lover.GetSheHe|U] โกรธจัดกับการที่ข้าเข้าไปยุ่งเกี่ยวกับชีวิตสมรสของ[lover.GetHerHis] และไม่ต้องการเกี่ยวข้องอะไรกับข้าอีกต่อไป"
 diplomacy_family.2254.a:0 "มันไม่ใช่เรื่องของเรา มันเกี่ยวกับครอบครัว!"
 diplomacy_family.2254.b:0 "ข้าไม่รู้จะพูดอะไร..."

 # Dealing with lackluster family member, by Flavio Verna

 diplomacy_family.2300.t:0 "การตัด แต่งราชวงศ์"
 diplomacy_family.2300.desc.intro:0 "การมีอยู่ของ[bad_relative.GetFirstNamePossessive]เป็นการดูหมิ่นชื่อเสียงของราชวงศ์อันรุ่งโรจน์ของเรา"
 diplomacy_family.2300.desc.a:0 "\n\n[ruler.Custom2('RelationToMeShort', SCOPE.sC('bad_relative'))]ของข้าเป็นคนโง่เง่า งุ่มง่าม ทำตัวเป็นตัวตลกของตระกูล[ruler.GetDynastyName]ด้วยทุกคำที่[bad_relative.GetSheHe]พูดออกมา"
 diplomacy_family.2300.desc.b:0 "\n\n[ruler.Custom2('RelationToMeShort', SCOPE.sC('bad_relative'))]ของข้าเป็นความผิดหวังอย่างสิ้นเชิงในทุกสิ่งที่[bad_relative.GetSheHe]พยายามจะ ทำให้สำเร็จ"
 diplomacy_family.2300.desc.c:0 "\n\nตัวประหลาดรูปร่างผิดส่วน [ruler.Custom2('RelationToMeShort', SCOPE.sC('bad_relative'))]ของข้า ทำให้ราชวงศ์[bad_relative.GetDynasty.GetName]เสื่อมเสียด้วยทุกลมหายใจของ[bad_relative.GetHerHis] เชื้อสายอันโดดเด่น เช่นนี้ให้กำเนิดสิ่งมีชีวิต เช่น[bad_relative.GetHerHim]ได้อย่างไร?"
 diplomacy_family.2300.desc.d:0 "\n\nดั่งกิ่งไม้ที่เหี่ยวแห้งและบิดเบี้ยวห้อยอยู่บนต้นไม้ครอบครัวอันมีชีวิตชีวาของเรา [ruler.Custom2('RelationToMeShort', SCOPE.sC('bad_relative'))]ของข้าเป็นเครื่องเตือนใจถึงความไม่ซื่อสัตย์ของ[bad_parent.GetFirstNamePossessive]อยู่เสมอ"
 diplomacy_family.2300.a:0 "บางทีข้าอาจจะปั้น[bad_relative.GetHerHim]ให้เป็นอะไรสักอย่างได้"
 diplomacy_family.2300.a.success.tt:0 "ข้าช่วยให้[bad_relative.GetFirstName]เรียนรู้สิ่งที่เป็นประโยชน์"
 diplomacy_family.2300.a.success.effect.tt:0 "หนึ่งใน[skills|E]ของ[bad_relative.GetFirstNamePossessive]จะเพิ่มขึ้น"
 diplomacy_family.2300.a.failure.tt:0 "[bad_relative.GetFirstName] ปฏิเสธความช่วยเหลือของข้า"
 diplomacy_family.2300.a.failure.toast:0 "ข้าไม่สามารถสอนสิ่งใดที่น่าสังเกตให้[bad_relative.GetFirstName]ได้"
 diplomacy_family.2300.b.a:0 "ข้าต้องพยายามกำจัด[bad_relative.GetHerHim]อีกครั้ง"
 diplomacy_family.2300.b.b:0 "บางครั้งก็ต้องตัด แต่งกิ่งไม้..."
 diplomacy_family.2300.c:0 "ข้าต้องขับไล่[bad_relative.GetHerHim]ออกไป!"
 diplomacy_family.2300.c.flavor:0 "[dynast|E] มีอำนาจที่จะตัดสมาชิกในครอบครัวออกจากกองมรดก"
 diplomacy_family.2300.d:0 "เราทุกคนต่างก็มีข้อบกพร่อง"
 diplomacy_family.2301.desc:0 "เป็นงานยากที่จะ ทำให้บางสิ่งผ่านกะโหลกหนาๆ ของ[bad_relative.GetFirstNamePossessive]ไปได้ แต่ข้าก็ทำได้สำเร็จ อย่างน้อยที่สุด ตอนนี้[bad_relative.GetSheHe]ก็ไม่ใช่ความผิดหวังโดยสิ้นเชิงอีกต่อไป..."
 diplomacy_family.2301.a:0 "ข้าทำในสิ่งที่ข้าทำได้"

