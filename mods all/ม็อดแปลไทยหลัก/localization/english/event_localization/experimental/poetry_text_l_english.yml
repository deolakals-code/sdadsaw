l_english: 
 first_line_text_set_1_A:0 "ข้าคือบุปผาอันอ่อนโยน บอบบาง"
 first_line_text_set_1_B:0 "หวังท่านเชิญข้าสู่เรือนหอของท่าน"
 first_line_text_set_2_A:0 "ท่านคือดาวนำทางของข้าในสิ่งนี้"
 first_line_text_set_2_B:0 "ข้ามั่นใจว่าข้าไม่ใช่ชาวสวิส"
 second_line_text_set_1_A:0 "ท่าน ทำให้ข้านึกถึงหอคอย"
 second_line_text_set_1_B:0 "และข้ามีอำนาจศักดินามากมาย"
 second_line_text_set_2_A:0 "แท้จริงแล้ว มันคือสาเหตุแห่งความสุขทั้งปวงของข้า"
 second_line_text_set_2_B:0 "ทุกสิ่งคลี่คลายในจุมพิตอันอ่อนโยน"
 third_line_text_set_1_A:0 "บางทีข้าควรใช้เวลาคิดให้มากขึ้น"
 third_line_text_set_1_B:0 "บางทีข้าอาจทำอะไรบางอย่างกับกลิ่นเหม็นนี้ได้"
 third_line_text_set_2_A:0 "ตามเส้นทางการบินของนกน้อย"
 third_line_text_set_2_B:0 "ที่ไหนสักแห่งระหว่างชีสแพะกับนมเปรี้ยว"
 fourth_line_text_set_1_A:0 "แต่ข้าหลงรักความรู้สึกของการจมดิ่ง"
 fourth_line_text_set_1_B:0 "ล้อเล่นน่า มาดื่มกันต่อเถอะ"
 fourth_line_text_set_2_A:0 "มันเป็นเพียงคำคำเดียว"
 fourth_line_text_set_2_B:0 "ข้าขออภัยที่ทำตัวไร้สาระ"
 poetry_line_break:0 "\n"
 # Lines from the Song of Roland
 poetry.0002.t:0 "บทกวี!"
 # First line
 0002.blank_verse_line_1_A:0 "กษัตริย์มาร์ซิลิอุสประทับ ณ ซาร์รากุซ,"
 0002.blank_verse_line_1_B:0 "บลังคันดรินเป็นเพแกนผู้ปรีชายิ่ง,"
 0002.blank_verse_line_1_C:0 "ชาร์ลส์ กษัตริย์, จอมราชันและองค์อธิปัตย์ของเรา,"
 0002.blank_verse_line_1_D:0 "ร่าเริงและองอาจ บัดนี้คือจักรพรรดิองค์นั้น,"
 # Second line
 0002.blank_verse_line_2_A:0 "เสด็จดำเนินสู่สวนผลไม้อันเย็นสบาย;"
 0002.blank_verse_line_2_B:0 "ในฐานะข้าหลวง เขาคืออัศวินผู้กล้าหาญ,"
 0002.blank_verse_line_2_C:0 "เจ็ดปีเต็มประทับอยู่ในสเปน,"
 0002.blank_verse_line_2_D:0 "ทรงยึดคอร์เดรส กำแพงพังทลายลง,"
 # Third line
 0002.blank_verse_line_3_A:0 "ณ ที่นั่นบนบัลลังก์ ทรงประทับ, ด้วยหินอ่อนสีฟ้า,"
 0002.blank_verse_line_3_B:0 "ด้วยความเก่งกาจเป็นเลิศ เขายืนเคียงข้างนายเหนือหัว."
 0002.blank_verse_line_3_C:0 "พิชิตแผ่นดิน และได้ครอบครองทะเลตะวันตก,"
 0002.blank_verse_line_3_D:0 "เครื่องยิงหินของพระองค์ทุบทำลายเมืองและหอคอย."
 # Fourth line
 0002.blank_verse_line_4_A:0 "รายล้อมพระองค์คือไพร่พล, สองหมื่นเต็ม, ยืนอยู่."
 0002.blank_verse_line_4_B:0 "และเขากล่าวว่า: "อย่าได้หวาดหวั่นไปเลย!""
 0002.blank_verse_line_4_C:0 "บัดนี้ไม่มีป้อมปราการใดต้านทานพระองค์ได้,"
 0002.blank_verse_line_4_D:0 "เงินและทองและอาภรณ์ประดับอัญมณีมากมาย."



# Lines from the Song of Roland for now

 poetry.0003.t:0 "บทกวีเกี่ยวกับ [ROOT.GetCharacter.Custom('theme_announcement')|UD]"
 # First line
 0003.line_1_A:0 "แผ่นดินร้างด้วย [ROOT.GetCharacter.Custom('noun_specific_singular_one')|D] อันโหดร้าย"
 0003.line_1_B:0 "ในยุคแห่ง [ROOT.GetCharacter.Custom('noun_abstract_plural_one')|D] อันยั่งยืน"
 0003.line_1_C:0 "[ROOT.GetCharacter.Custom('noun_specific_singular_two')|D] ชาร์ลส์ กษัตริย์, จอมราชันและองค์อธิปัตย์ของเรา,"
 0003.line_1_D:0 "[ROOT.GetCharacter.Custom('noun_abstract_singular_two')|D] ร่าเริงและองอาจ บัดนี้คือจักรพรรดิองค์นั้น,"
 # Second line
 0003.line_2_A:0 "เราล้วนยอมจำนนต่อ [ROOT.GetCharacter.Custom('noun_abstract_singular_one')|D] อันโหดร้าย"
 0003.line_2_B:0 "บัดนี้มองเห็นด้วยดวงตาแห่ง [ROOT.GetCharacter.Custom('noun_abstract_plural_two')|D]"
 0003.line_2_C:0 "[ROOT.GetCharacter.Custom('noun_abstract_singular_two')|D] เจ็ดปีเต็มประทับอยู่ในสเปน,"
 0003.line_2_D:0 "[ROOT.GetCharacter.Custom('noun_abstract_singular_two')|D] ทรงยึดคอร์เดรส กำแพงพังทลายลง,"
 # Third line
 0003.line_3_A:0 "หาก [ROOT.GetCharacter.Custom('noun_specific_singular_two')|D] ของท่าน ข้ามิอาจเอื้อมถึง"
 0003.line_3_B:0 "หลังจาก [ROOT.GetCharacter.Custom('two_syllable_number')|D] ปีแห่ง [ROOT.GetCharacter.Custom('noun_abstract_plural_two')|D]"
 0003.line_3_C:0 "[ROOT.GetCharacter.Custom('noun_specific_singular_two')|D] พิชิตแผ่นดิน และได้ครอบครองทะเลตะวันตก,"
 0003.line_3_D:0 "[ROOT.GetCharacter.Custom('noun_abstract_singular_two')|D] เครื่องยิงหินของพระองค์ทุบทำลายเมืองและหอคอย."
 # Fourth line
 0003.line_4_A:0 "พวกเขาอาจไม่มีวันได้ [ROOT.GetCharacter.Custom('noun_abstract_singular_two')|D] ของข้าไป"
 0003.line_4_B:0 "ในไม่ช้า [ROOT.GetCharacter.Custom('noun_specific_plural_two')|D] ก็ถูกลืมเลือนไปหมดสิ้น"
 0003.line_4_C:0 "[ROOT.GetCharacter.Custom('noun_specific_singular_two')|D] บัดนี้ไม่มีป้อมปราการใดต้านทานพระองค์ได้,"
 0003.line_4_D:0 "[ROOT.GetCharacter.Custom('noun_abstract_singular_two')|D] เงินและทองและอาภรณ์ประดับอัญมณีมากมาย."
 0003.poetry_from:0 "[actor.GetTitledFirstName] ได้ประพันธ์บทกวีให้ท่าน\n\n"


