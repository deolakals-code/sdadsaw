 ep3_laamp_flavour_ewan_4031_sickness_affects_some_of_herd_modifier_desc: "โรคภัยรบกวนสัตว์บรรทุกที่แก่และอ่อนแอของค่ายนี้"
 ep3_laamp_flavour_ewan_4031_sickness_spreads_through_herd_modifier: "ฝูงสัตว์ป่วย"
 ep3_laamp_flavour_ewan_4031_sickness_spreads_through_herd_modifier_desc: "หนึ่งในสี่หรือมากกว่าของสัตว์บรรทุกในค่ายนี้ป่วย"
 ep3_laamp_flavour_ewan_4031_sickness_spreads_wildly_through_herd_modifier: "ฝูงสัตว์ป่วยอย่างรุนแรง"
 ep3_laamp_flavour_ewan_4031_sickness_spreads_wildly_through_herd_modifier_desc: "มากกว่าครึ่งหนึ่งของสัตว์บรรทุกในค่ายนี้เป็นโรคที่น่ากลัวบางอย่าง"
 ep3_laamp_flavour_ewan_4031_callous_culled_herd_modifier: "ฝูงสัตว์ถูกคัดทิ้ง"
 ep3_laamp_flavour_ewan_4031_callous_culled_herd_modifier_desc: "ท่านสามารถเดินทางได้เร็วขึ้นโดยไม่มีสัตว์ที่อ่อนแอ แต่ท่านจะเดินทางเบาลง"
