 ep3_laamp_flavour_ewan.9531.t: "ผู้ติดตามที่หายไป: [visitor.GetTitledFirstNameNicknamedNoTooltip]"
 ep3_laamp_flavour_ewan.9531.desc: "เป็นเวลาหลายปีแล้ว และบัดนี้เป็นที่ชัดเจนแล้วว่า [visitor.GetTitledFirstNameNicknamed] ผู้ติดตามที่หายไปของข้าจะไม่กลับมา\n\nบางอย่างเกี่ยวกับการขาดข่าวสารบอกข้าว่า[visitor.GetSheHe]ได้เสียชีวิตไปแล้วในระหว่างการพำนักชั่วคราว[visitor.GetHerHis] แม้ว่าข้าจะไม่สามารถบอกได้แน่ชัดว่าทำไม\n\nเพียง แต่เลิกมองหาการมาถึง[visitor.GetHerHis]"
 ep3_laamp_flavour_ewan.9531.tt.follower_is_dead: "[visitor.GetTitledFirstName] ได้เสียชีวิตไปแล้วขณะอยู่ห่างจาก[camp|E]"
 ep3_laamp_flavour_ewan.9531.a: "คิดไม่ถึงว่าเราจะไม่ได้พบ[visitor.GetHerHim]อีกแล้ว..."
 ep3_laamp_flavour_ewan.9531.b: "#EMP เอ๊ะ.#!"

 ep3_laamp_flavour_ewan.9532.t: "$ep3_laamp_flavour_ewan.9531.t$"
 ep3_laamp_flavour_ewan.9532.desc: "แม้ว่า [visitor.GetTitledFirstNameNicknamed] ผู้ติดตามของข้าจะห่างหายจากเราไปหลายปีแล้ว แต่เราก็คาดหวังว่า[visitor.GetHerHim]จะกลับมาในไม่ช้า\n\nอนิจจา ผู้ส่งสารแจ้งว่าสิ่งนี้เป็นไปไม่ได้: ดูเหมือนว่า[visitor.GetSheHe]กำลังถูกคุมขังโดย[imprisoner.GetTitledFirstName]ผู้เลวทราม! หากเราต้องการพบ[visitor.GetHerHim]อีกครั้ง เราจะต้องจ่ายค่าไถ่"
 ep3_laamp_flavour_ewan.9532.a: "เราต้องปลดปล่อย[visitor.GetFirstNameNoTooltip]!"
 ep3_laamp_flavour_ewan.9532.b: "[imprisoner.GetFirstNameNoTooltip] สามารถเก็บ[visitor.GetHerHim]ไว้ได้เลยเท่าที่ข้าสนใจ"

 ep3_laamp_flavour_ewan.9533.t: "$ep3_laamp_flavour_ewan.9531.t$"
 ep3_laamp_flavour_ewan.9533.desc: "หลังจากจากไปหลายปี พวกเราเริ่มเป็นห่วง [visitor.GetTitledFirstNameNicknamed] ซึ่งควรจะกลับมาได้แล้ว\n\nอนิจจา ดูเหมือนว่าความกังวลของเรานั้นสมเหตุสมผล เพราะเย็นวันนี้ [visitor.GetSheHe] ได้โซซัดโซเซกลับมาที่ค่ายและล้มลง เป็นเพียงซาก [visitor.GetWomanMan] ที่แตกสลาย สิ่งนี้เกิดขึ้นกับ [visitor.GetHerHim] ได้อย่างไร และ [visitor.GetSheHe] เดินทาง [visitor.GetHerHis] มาหาพวกเราในสภาพนี้ได้อย่างไร ข้าไม่อาจบอกได้\n\nในสภาพที่ [visitor.GetSheHe] เป็นอยู่ [visitor.GetSheHe] ก็บอกไม่ได้ เช่นกัน"
 ep3_laamp_flavour_ewan.9533.tt.follower_is_incapable: "[visitor.GetTitledFirstName] ได้กลายเป็น [GetTrait('incapable').GetName( GetNullCharacter )] ขณะอยู่ห่างจาก[camp|E]"
 ep3_laamp_flavour_ewan.9533.a: "เกิดอะไรขึ้นกับ[visitor.GetHerHim]กันแน่?"
 ep3_laamp_flavour_ewan.9533.b: "อย่ากังวลไปเลย [visitor.GetFirstNameNoTooltip] เราจะดูแลเจ้าเอง"
 ep3_laamp_flavour_ewan.9533.c: "ขับไล่เจ้าคนโง่นี่ไปก่อนที่ใครจะเห็น[visitor.GetHerHim]"

 ep3_laamp_flavour_ewan.9534.t: "$ep3_laamp_flavour_ewan.9531.t$"
 ep3_laamp_flavour_ewan.9534.desc: "[visitor.GetTitledFirstNameNicknamed] ควรจะกลับมาได้แล้ว\n\n[visitor.GetSheHe|U] ไม่ควรจะหายไปนานขนาดนี้ แต่ถึงกระนั้น [visitor.GetSheHe] ก็ยังไม่กลับมาและไม่ได้ส่งข่าวมา แต่อย่างใด บางที[visitor.GetSheHe]อาจจะหลงทางจากเราและตามรอยเราไม่เจออีก\n\nไม่ว่ากรณีใดก็ตาม ดูเหมือนเป็นที่ชัดเจนแล้วว่า[visitor.GetFirstNameNoTooltip]จะไม่มีวันกลับมาหาเราอีก"
 ep3_laamp_flavour_ewan.9534.tt.follower_is_lost: "[visitor.GetTitledFirstName] ได้หลงทางไปที่ไหนสักแห่ง อย่างใดอย่างหนึ่ง และจะไม่กลับมายัง[camp|E]"
 ep3_laamp_flavour_ewan.9534.a: "ข้าสงสัยว่าเกิดอะไรขึ้นกับ[visitor.GetHerHim]..."

 ep3_laamp_flavour_ewan.9541.t.nickname_gained: "ผู้ติดตามได้รับฉายา"
 ep3_laamp_flavour_ewan.9541.desc.nickname_gained: "ผู้คนรอบค่ายได้มอบฉายาให้ [eponymee.GetFirstName] โดยอิงจาก [personality|E] และ [traits|E] ของ [eponymee.GetHerHis]\n$EFFECT_LIST_BULLET$[eponymee.GetSheHe|U] เป็นที่รู้จักในนาม #V [eponymee.GetFirstNameNicknamed]#!"
 ep3_laamp_flavour_ewan.9541.t.dog_gained: "ผู้ติดตามเก็บสุนัขมาเลี้ยง"
 ep3_laamp_flavour_ewan.9541.desc.dog_gained: "[pet_owner.GetFirstNameNicknamed] ได้รับสุนัขเลี้ยงมาตัวหนึ่ง"
 ep3_laamp_flavour_ewan.9541.t.cat_gained: "ผู้ติดตามถูกแมวรับเลี้ยง"
 ep3_laamp_flavour_ewan.9541.desc.cat_gained: "[pet_owner.GetFirstNameNicknamed] บัดนี้มีแมวตัวเล็กๆ ติดตามไปด้วย"
 ep3_laamp_flavour_ewan.9541.t.opinion_gained: "ผู้ติดตามที่เป็นมิตร"
 ep3_laamp_flavour_ewan.9541.desc.opinion_gained: "[follower_1.GetFirstNameNicknamed] และ [follower_2.GetFirstNameNicknamed] กำลังสร้างความผูกพันจากจุดร่วม"
 ep3_laamp_flavour_ewan.9541.t.opinion_lost: "ผู้ติดตามที่เป็นปรปักษ์"
 ep3_laamp_flavour_ewan.9541.desc.opinion_lost: "[follower_1.GetFirstNameNicknamed] และ [follower_2.GetFirstNameNicknamed] กำลังขัดแย้งกันเรื่องความแตกต่างของพวกเขา"
 ep3_laamp_flavour_ewan.9541.t.stress_gained: "ชีวิตที่ยากลำบาก"
 ep3_laamp_flavour_ewan.9541.desc.stress_gained: "[stressee.GetFirstNameNicknamed] กำลังรับมือกับความยากลำบากของชีวิตได้ไม่ดีนักในตอนนี้"
 ep3_laamp_flavour_ewan.9541.t.stress_lost: "ชีวิตที่ง่ายดาย"
 ep3_laamp_flavour_ewan.9541.desc.stress_lost: "[stressee.GetFirstNameNicknamed] ชื่นชมอิสรภาพของชีวิตบนเส้นทาง"
