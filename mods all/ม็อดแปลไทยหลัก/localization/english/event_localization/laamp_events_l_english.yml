 ep3_laamp_flavour_ewan.0021.t: "ผู้ติดตามตัวน้อย"
 ep3_laamp_flavour_ewan.0021.desc.intro.cat: "หลายวันมาแล้ว ข้าเห็นแมวตัวเล็กๆ เดินด้อมๆ มองๆ รอบกระโจมของข้า,"
 ep3_laamp_flavour_ewan.0021.desc.intro.dog: "หลายวันมาแล้ว สุนัขตัวเล็กๆ ผอมโซใช้เวลาช่วงเย็นนั่งอยู่หน้ากระโจมของข้า,"
 ep3_laamp_flavour_ewan.0021.desc.cat.1: "ล่าหนูในท้องถิ่นและตบปัดผู้ติดตามชั้นผู้น้อยอย่างแข็งขันด้วยความหยิ่งผยองของราชวงศ์ที่แท้จริง\n\nจะมีบทสรุปใดที่ยิ่งใหญ่กว่าชีวิตของขุนนางไปกว่าสองการกระทำนี้อีกหรือ?"
 ep3_laamp_flavour_ewan.0021.desc.cat.2: "ตื่นพร้อมกับค่ายในตอนเช้า งีบหลับตลอดการเดินทางประจำวันบนเกวียน #EMP ของข้า#! ก่อนที่จะตื่นขึ้นอย่างงัวเงียเพื่อไล่ตามอาหารเย็นที่เป็นเศษอาหารและเสบียงที่ขโมยมา\n\nสัตว์ที่ถือดี แต่ก็เป็นสัตว์ที่มุ่งมั่นอย่างแน่นอน"
 ep3_laamp_flavour_ewan.0021.desc.cat.3: "หายตัวไปเมื่อใดก็ตามที่มีคนก้าวเข้ามาใกล้ เพียงเพื่อจะปรากฏตัวขึ้นอีกครั้งอย่างเงียบๆ ในอีกไม่กี่นาทีต่อมา — เฝ้ามองจากระยะไกล\n\nขี้อาย แต่ก็อยากรู้อยากเห็นตลอดเวลา การผสมผสานที่ burdensome สำหรับสิ่งใดก็ตามที่จะทนทานได้ นับประสาอะไรกับแมวตัวเล็กๆ เช่นนี้"
 ep3_laamp_flavour_ewan.0021.desc.cat.4: "พันแข้งพันขาอย่างกระตือรือร้นรอบๆ และผ่านเท้าของผู้มาเยือนทุกคนของข้า — และแม้ แต่ผู้สัญจรไปมาจำนวนมาก — หลอกล่อเอาขนมหรือการเกาคางจากพวกเขาก่อนที่จะทอดทิ้งคนโง่เขลาที่โชคร้ายโดยไม่คิดซ้ำสอง\n\nอาจจะโหดเหี้ยม แต่ก็มีประสิทธิภาพ"
 # Bazcat.
 ep3_laamp_flavour_ewan.0021.desc.cat.5: "และข้าไม่เคยพบสัตว์ที่เสียงดังและดุร้าย เช่นนี้มาก่อน เป็นเพียงก้อนฟัน กรงเล็บ และความโกรธเกรี้ยว รูปร่างเล็กๆ ของมันบดบังความ #EMP เกลียดชัง#! อันยิ่งใหญ่ที่เห็นได้ชัดภายใน\n\nบางทีอาจเป็นเรื่องดีที่สัตว์ตัวนี้เกิดมาเป็นแมวไม่ใช่เสือดำ"
 ep3_laamp_flavour_ewan.0021.desc.dog.1: "เห่าหอนและโหยหวนเมื่อใดก็ตามที่ข้าลับสายตา ร้องครางเหมือน... ก็เหมือนสุนัขที่ร้องหาเจ้านาย แม้ว่าข้าจะเพิ่งพบสุนัขตัวนี้ก็ตาม\n\nบางทีสัตว์ตัวนี้อาจรู้สึกถึงความผูกพันบางอย่างกับข้า แม้ว่าในระหว่างวันมันจะเดินตามหลังข้าในระยะที่พอสมควร"
 ep3_laamp_flavour_ewan.0021.desc.dog.2: "คำรามและงับใส่ใครก็ตามที่เข้ามาในระยะหนึ่งฟุต เพราะความอหังการที่จะเข้าใกล้ที่พักของข้า\n\nไม่สะดวกในหลายระดับ แต่มีน้อยสิ่งที่จะปกป้องท่านได้ดีกว่าสุนัขที่ซื่อสัตย์"
 ep3_laamp_flavour_ewan.0021.desc.dog.3: "วิ่งเป็นวงกลมและวงกลมและวงกลมและ #EMP วงกลม#! อย่างกระตือรือร้นด้วยพลังงานอันไร้ขอบเขตของสุนัขที่มีทุกที่ให้ไป แต่ไม่มีที่ไหนให้อยู่\n\nบางทีเราอาจจะคล้ายกันเล็กน้อยในแง่นั้น ทั้งคู่เป็นคนจรจัดที่ล่องลอยไปในโลก"
 ep3_laamp_flavour_ewan.0021.desc.dog.4: "ดูเหมือนจะพยายามอย่างเต็มที่เพื่อสอน #EMP ตัวเอง#! ให้ทำกลอุบาย บางทีอาจหวังว่าจะ ทำให้ข้าประทับใจ มันเป็นสุนัขที่ฉลาดกว่าส่วนใหญ่ ซึ่งเป็นสิ่งที่ข้าเพิ่งตระหนักเมื่อเจ้าตัวร้ายนั่นคว้าหัวไชเท้าตุ๋นจากมือข้าด้วยการกระโดดเพียงครั้งเดียว\n\nข้าตะโกนใส่สัตว์ตัวนั้น แต่ข้าไม่สามารถพูดได้ว่ามันไม่ตลก แม้จะน่าประทับใจ เมื่อพิจารณาว่ามันเป็นสุนัข"
 ep3_laamp_flavour_ewan.0021.desc.dog.5: "ตามข้าไปโดยไม่มีอะไรนอกจากหอบหายใจกึ่งเงียบเมื่อใดก็ตามที่ข้าจากไป ก่อนที่จะติดตามข้าในการเดินทางกลับ ข้าไม่รู้ว่าทำไมมันถึงปกป้องข้า แต่ดูเหมือนว่ามันพอใจที่จะทำ เช่นนั้นไม่ว่าจะด้วยเหตุผลใดก็ตาม\n\nบางทีข้าอาจ ทำให้นึกถึง [ROOT.Char.Custom('MistressMaster')] คนก่อนของสัตว์ตัวนี้? ยากที่จะบอก แม้ว่ากิจวัตรนั้นดูเหมือนจะง่ายสำหรับมันอย่างแน่นอน"
 ep3_laamp_flavour_ewan.0021.desc.outro: "\n\nสัตว์ร้ายดูเหมือนจะเป็นมิตรกับข้าพอสมควร คลอเคลียและเลียนิ้วของข้าอย่างมีความสุขเป็นเวลาหลายนาที แม้ว่ามันจะปฏิเสธที่จะยอมรับคนอื่นก็ตาม"
 ep3_laamp_flavour_ewan.0021.a: "มานี่สิ เพื่อนตัวน้อย เจ้าช่างเป็นเพื่อนที่ดีจริงๆ?"
 ep3_laamp_flavour_ewan.0021.b: "นั่น... เป็นอาหาร..."
 ep3_laamp_flavour_ewan.0021.c: "เตะสิ่งมีชีวิตนั้นให้แรงที่สุดเท่าที่จะทำได้"
 ep3_laamp_flavour_ewan.0021.d: "มันเป็นเพียงเพื่อนร่วมเดินทาง ปล่อยมันไปเถอะ"
 ep3_laamp_flavour_ewan_0021_respected_cat_modifier: "แมวที่ได้รับความเคารพ"
 ep3_laamp_flavour_ewan_0021_respected_cat_modifier_desc: "ตัวละครนี้รู้ว่าใครคือเพื่อนที่ดีที่สุดของมนุษย์อย่างแท้จริง"
 ep3_laamp_flavour_ewan_0021_respected_dog_modifier: "สุนัขที่ได้รับความเคารพ"
 ep3_laamp_flavour_ewan_0021_respected_dog_modifier_desc: "$ep3_laamp_flavour_ewan_0021_respected_cat_modifier_desc$"

 ep3_laamp_flavour_ewan.0031.t: "ร่วงหล่นลงมา"
 ep3_laamp_flavour_ewan.0031.desc.intro: "ขณะที่เราขี่ม้าผ่าน [current_county.GetBaseNameNoTier] ความคิดของข้าล่องลอยไปอย่างไร้จุดหมาย เบื่อหน่ายกับความซ้ำซากของการเดินทางธรรมดาๆ เมื่อมีเสียง #EMP ตะโกน#! เตือนภัยดังขึ้นทันที\n\nการโจมตีหรือ? ข้าหันศีรษะไปรอบๆ — ไม่ — มันคือไอ้คนโง่ [stooge.GetTitledFirstName] นั่น [stooge.GetSheHe]ตกจากหลังม้าของ[stooge.GetHerHis]และ"
 ep3_laamp_flavour_ewan.0031.desc.plains: "กลิ้งลงไปตามทางลาดเล็กๆ ตรงเข้าไปในพุ่มไม้หนามที่ดูร้ายกาจ,"
 ep3_laamp_flavour_ewan.0031.desc.farmlands: "พุ่งทะลุแนวพุ่มไม้หนาและเข้าไปในคูน้ำที่เต็มไปด้วยหนาม,"
 ep3_laamp_flavour_ewan.0031.desc.hills: "กลิ้งลงไปตามไหล่เขาที่สูงชัน หัวทิ่มหัวตำจนตกลงไปในหุบเหว,"
 ep3_laamp_flavour_ewan.0031.desc.mountains: "ไถลลงไปตามไหล่เขา เตะหินและฝุ่นฟุ้งกระจายจนตกลงไปบนขอบผา"
 ep3_laamp_flavour_ewan.0031.desc.desert: "หมุนคว้างลงไปตามเนินทรายสูง บิดเบี้ยวไปมาอย่างงุ่มง่ามขณะที่แรงผลักดันพา[stooge.GetHerHim]ไปข้างหน้า"
 ep3_laamp_flavour_ewan.0031.desc.desert_mountains: "$ep3_laamp_flavour_ewan.0031.desc.mountains$"
 ep3_laamp_flavour_ewan.0031.desc.oasis: "$ep3_laamp_flavour_ewan.0031.desc.desert$"
 ep3_laamp_flavour_ewan.0031.desc.jungle: "กลิ้งลงไปตามไหล่เขาที่ปกคลุมด้วยต้นไม้ เกี่ยวเถาวัลย์และหนามแปลกๆ ขณะที่"
 ep3_laamp_flavour_ewan.0031.desc.forest: "กลิ้งลงไปตามไหล่เขาที่ปกคลุมด้วยต้นไม้ เกี่ยวกับกิ่งไม้และพุ่มหนามขณะที่"
 ep3_laamp_flavour_ewan.0031.desc.taiga: "กลิ้งลงไปตามไหล่เขาที่ปกคลุมด้วยต้นไม้ เกี่ยวกับกิ่งไม้และลูกสนเก่าๆ ขณะที่"
 ep3_laamp_flavour_ewan.0031.desc.wetlands: "ไถลลงไปตามเนินดินเตี้ยๆ เตะโคลนและหญ้าชื้นๆ ฟุ้งกระจาย,"
 ep3_laamp_flavour_ewan.0031.desc.steppe: "หาเนินเขา #EMP ลูกเดียว#! ในระยะหลายลีกในทุกทิศทางเพื่อกลิ้งลงไป,"
 ep3_laamp_flavour_ewan.0031.desc.floodplains: "กลิ้งลงไปในสิ่งที่ดูเหมือนจะเป็นคูระบายน้ำกร่อยบางชนิด,"
 ep3_laamp_flavour_ewan.0031.desc.drylands: "กลิ้งลงไปตามเนินเขาที่เต็มไปด้วยฝุ่น เตะเมฆหนาของกรวดทรายฟุ้งกระจายและ"
 ep3_laamp_flavour_ewan.0031.desc.midtro: "กรีดร้องและร้องไห้ขณะที่[stooge.GetSheHe]กลิ้งลงไป\n\n"
 ep3_laamp_flavour_ewan.0031.desc.outro.dead: "เมื่อ [stooge.GetFirstNameNoTooltip] ไม่ออกมาหลังจากผ่านไปหลายนาที คนขนของคนหนึ่งลงไปตรวจสอบ ครู่ต่อมาเสียงร้องด้วยความตกใจก็ดังขึ้น\n\nดูเหมือนว่า[stooge.GetSheHe]เสียชีวิตจากการตก"
 ep3_laamp_flavour_ewan.0031.desc.outro.fallback: "ครู่ต่อมา [stooge.GetFirstNameNoTooltip] ก็โผล่ออกมา สบถอย่างหยาบคายและยังมีชีวิตอยู่ แต่ไม่ได้รับบาดเจ็บ"
 ep3_laamp_flavour_ewan.0031.a: "หัวเราะเสียงดัง"
 ep3_laamp_flavour_ewan.0031.b: "หัวเราะคิกคัก แต่ไม่มากไปกว่านั้น"
 ep3_laamp_flavour_ewan.0031.c: "ความอาฆาตพยาบาทเล็กน้อย เช่นนี้ต่ำกว่าศักดิ์ศรีของข้า"
 ep3_laamp_flavour_ewan_0031_grisly_modifier: "อารมณ์ขันอันน่าสยดสยอง"
 ep3_laamp_flavour_ewan_0031_grisly_modifier_desc: "ชีวิตกำลังหัวเราะเยาะท่าน ทำไมไม่หัวเราะไปพร้อมกับมันล่ะ?"
 ep3_laamp_flavour_ewan_0031_macabre_modifier: "อารมณ์ขันอันน่าขนลุก"
 ep3_laamp_flavour_ewan_0031_macabre_modifier_desc: "เพียง เพราะมันมืดมน ไม่ได้หมายความว่ามันไม่น่าขบขัน"

 ep3_laamp_flavour_ewan.0041.t: "ความยากลำบากของพ่อครัว"
 ep3_laamp_flavour_ewan.0041.desc.has_cook: ""ข้าไม่คิดว่าข้ากำลังไร้เหตุผล", [camp_cook.GetFirstName] — [GetCourtPositionType( 'camp_cook_camp_officer' ).GetName()] ของข้า — พูดเหน็บแนมขณะที่[camp_cook.GetSheHe]โบกแขนอย่างไม่ไยดีไปยังภูมิประเทศโดยรอบ\n\n"
 ep3_laamp_flavour_ewan.0041.desc.nameless_cook: ""ข้าไม่คิดว่าเรากำลังไร้เหตุผล", พ่อครัวที่คาดว่าจับไม้สั้นได้ในการมาพูดกับข้า พูดเหน็บแนม พลางโบกแขนอย่างไม่ไยดีไปยังภูมิประเทศโดยรอบตลอดเวลา\n\n"
 ep3_laamp_flavour_ewan.0041.desc.plains: ""มีฟาร์มมากมายที่นี่ แม้ว่าจะไม่ใช่ฟาร์มที่ดีนัก มันคงไม่ยากเกินไปที่เราจะหยุดพักสักครู่และ"
 ep3_laamp_flavour_ewan.0041.desc.farmlands: ""พื้นที่เกษตรกรรมที่สวยงามทั้งหมดนี้และเราไม่สามารถหาเวลาเพียงเล็กน้อยเพื่อ"
 ep3_laamp_flavour_ewan.0041.desc.hills: ""ทุ่งหญ้าบนเนินเขามากมายหลายไมล์รอบๆ แต่ดูเหมือนว่าเราจะไม่สามารถหาเวลาเพื่อ"
 ep3_laamp_flavour_ewan.0041.desc.mountains: ""สัตว์ป่าบนภูเขาทั้งหมดนี้อยู่รอบๆ และเราไม่สามารถแม้ แต่จะใช้เวลาเพื่อ"
 ep3_laamp_flavour_ewan.0041.desc.desert: ""จมอยู่ในหลุมทะเลทรายนี้ลึกถึงข้อศอก ไม่มีถิ่นฐานใดๆ ในสายตา และเราขาดแคลนจนไม่สามารถแม้ แต่จะ"
 ep3_laamp_flavour_ewan.0041.desc.desert_mountains: ""ถูกผลักขึ้นไปครึ่งทางสู่ท้องฟ้าและลำคอแห้งผาก และเราไม่สามารถแม้ แต่จะพยายาม"
 ep3_laamp_flavour_ewan.0041.desc.oasis: ""แม้จะอยู่ที่โอเอซิสจริงๆ ดูเหมือนว่าเรากระตือรือร้นที่จะกลับออกไปสู่ความโหดร้ายของทะเลทราย ไม่สามารถแม้ แต่จะ"
 ep3_laamp_flavour_ewan.0041.desc.jungle: ""แม้จะมีของแปลกใหม่มากมายในป่าให้เราเก็บเกี่ยว เราก็ไม่สามารถแม้ แต่จะหาความตั้งใจที่จะ"
 ep3_laamp_flavour_ewan.0041.desc.forest: ""แม้จะอยู่ในป่าที่อุดมสมบูรณ์นี้ เราก็ไม่สามารถใช้เวลาเพื่อ"
 ep3_laamp_flavour_ewan.0041.desc.taiga: ""ออกไปที่นี่ในป่านรกที่ห่างไกลและถูกทอดทิ้ง ห่างไกลจากชีวิตจนเราไม่สามารถแม้ แต่จะ"
 ep3_laamp_flavour_ewan.0041.desc.wetlands: ""ถูกสาปให้ต้องพเนจรไปในหนองบึงเหม็นเน่านี้ชั่วนิรันดร์ ไม่สามารถแม้ แต่จะ"
 ep3_laamp_flavour_ewan.0041.desc.steppe: ""หลงทางอยู่ที่นี่ในทะเลหญ้าที่ไร้ลักษณะเด่นนี้ ไกลจากที่ใดๆ เกินไปที่จะแม้ แต่จะ"
 ep3_laamp_flavour_ewan.0041.desc.floodplains: ""ถูกทอดทิ้งลงมาที่นี่ในที่ราบน้ำท่วมถึงที่เน่าเปื่อยเหล่านี้ อยู่ในความเมตตาของกระแสน้ำและตลิ่ง ไม่สามารถแม้ แต่จะ"
 ep3_laamp_flavour_ewan.0041.desc.drylands: ""ถูกเนรเทศออกไปที่นี่สู่นรกที่เต็มไปด้วยฝุ่นนี้ ไกลจากที่ใดๆ ที่สำคัญพอที่จะแม้ แต่จะ"
 ep3_laamp_flavour_ewan.0041.desc.outro: "ตุนของฟุ่มเฟือยเล็กๆ น้อยๆ ที่ ทำให้อาหารของเราพอทนได้?"\n\nข้าถอนหายใจ เหนื่อยกับการสนทนาแล้ว ข้าสงสัยว่าใครในพวกเราจะยอมแพ้ก่อนกัน"
 ep3_laamp_flavour_ewan.0041.desc.provisions.high: "\n\nนี่รู้สึกเหมือนคำพูดเพ้อเจ้อของคนบ้า ข้าตรวจสอบสต็อกเมื่อเช้านี้เองและเราควรจะมีเสบียงเพียงพอสำหรับหลายเดือนข้างหน้า"
 ep3_laamp_flavour_ewan.0041.desc.provisions.medium: "\n\nใช่ เสบียงของเราอาจจะ #EMP ต่ำกว่า#! ที่ข้าต้องการเล็กน้อย แต่ก็มีเหตุผลน้อยมากที่จะต้องตื่นตระหนก เช่นนั้น"
 ep3_laamp_flavour_ewan.0041.desc.provisions.low: "\n\nคลังเสบียงของเราอยู่ในสภาพที่เป็นอยู่และคนโง่นี่กำลังโต้เถียงกันว่าเสบียงสุดท้ายของเราจะถูกปากหรือไม่"
 ep3_laamp_flavour_ewan.0041.desc.provisions.sahara: "\n\nข้ามองไปรอบๆ ทะเลทรายที่ใกล้จะไม่มีที่สิ้นสุดทอดยาวออกไปในทุกทิศทาง ตลอดไป"
 ep3_laamp_flavour_ewan.0041.a: "เจ้ากำลังบ่นเรื่องอะไรกันแน่?"
 ep3_laamp_flavour_ewan.0041.b: "ก็ได้ เราสามารถเติมเสบียงได้"
 ep3_laamp_flavour_ewan.0041.b.tt.success: "ท่านทำข้อตกลงที่ดี"
 ep3_laamp_flavour_ewan.0041.b.tt.failure: "ได้รับการต้อนรับอย่างเย็นชาจากคนท้องถิ่น"
 ep3_laamp_flavour_ewan.0041.c: "ไม่ได้เด็ดขาด ทำงานกับสิ่งที่มีอยู่"
