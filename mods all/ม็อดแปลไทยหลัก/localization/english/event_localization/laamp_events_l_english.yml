 ep3_laamp_flavour_ewan_4031_callous_and_plentiful_steeds_culled_herd_modifier_desc: "$ep3_laamp_flavour_ewan_4031_callous_culled_herd_modifier_desc$"

 ep3_laamp_flavour_ewan.4041.t: "ส่วยของ [ROOT.Char.GetFaith.TricksterGodNamePossessive]"
 ep3_laamp_flavour_ewan.4041.desc.weather_type.storm.thunder: "เสียงฟ้าร้องดังก้องอย่างเป็นลางเหนือศีรษะ เป็นการขัดจังหวะที่น่าเบื่อหน่ายต่อลมกระโชกแรงและฝนที่สาดซัด ซึ่งกำลังพยายาม ทำให้ขบวนของเรากระจัดกระจาย\n\nเสียงร้องไห้จากระยะไกลดังก้องไปตามแนวขณะที่เกวียนและสัตว์จมลงใน [ROOT.Char.Custom('RainySoilType')] พายุพยายามอย่างเต็มที่ที่จะพัดพาเราไปสู่ [ROOT.Char.GetFaith.NegativeAfterLife] เด็กและผู้สูงอายุตัวสั่นในความเงียบอันน่าสังเวช เปียกโชกไปถึงกระดูกและสงสัยว่าภาวะตัวเย็นเกินจะเริ่มเมื่อใด\n\nอากาศเต็มไปด้วยไฟฟ้าสถิตและความตึงเครียด"
 ep3_laamp_flavour_ewan.4041.desc.weather_type.storm.wind: "เสียงลมโหยหวน ทำให้แทบเป็นไปไม่ได้ที่จะได้ยินเสียงในระยะห่างเกินสองสามฟุต\n\nความรุนแรงของพายุอันเลวร้ายนี้มี แต่จะเพิ่มขึ้น ฝนสาดใส่ตาเราและ ทำให้เกวียนหนักและสัตว์ที่บรรทุกของติดอยู่ในกอง [ROOT.Char.Custom('RainySoilType')] ภาพนิ่งเงียบแบบเดียวกันสามารถเห็นได้ตลอดแนว ผู้ติดตามที่แข็งแรงกว่าช่วยดึงยานพาหนะที่ติดอยู่ออกมา ในขณะที่เด็กและผู้สูงอายุเบียดเสียดกันอยู่ใต้ที่กำบังใดๆ ที่พวกเขาสามารถหาหรือสร้างขึ้นได้\n\nธรรมชาติเองดูเหมือนจะต่อต้านเรา ทิ้งไว้ ซึ่ง"
 ep3_laamp_flavour_ewan.4041.desc.weather_type.storm.snow: "ความชา\n\nแม้จะห่อตัวให้อุ่นที่สุดเท่าที่จะทำได้ ความหนาวเย็นก็กัดกินข้า ละอองหิมะขนาดใหญ่ที่ถูกลมพัดกระหน่ำ ทำให้เนื้อหนังที่เปิดเผยทุกส่วนเปียกโชก ดูดความร้อนออกไปเหมือนขี้ผึ้งจากเทียนที่ใช้แล้ว ส่วนที่เหลือของขบวนแย่กว่านั้น — คน สัตว์ และเกวียนติดอยู่ในนรกสีขาวโพลนนี้อย่างต่อเนื่อง เด็กและผู้สูงอายุตัวสั่นอยู่ใต้หลังคาที่ปกคลุมด้วยหิมะ ในขณะที่ผู้ใหญ่ทำงานอย่างบ้าคลั่งเพื่อปลดปล่อยยานพาหนะที่ติดอยู่ของเรา\n\nพายุหิมะค่อยๆ ทวีความรุนแรงขึ้น ทิ้งไว้ ซึ่ง"
 ep3_laamp_flavour_ewan.4041.desc.weather_type.storm.sand: "ทรายอยู่ #EMP ทุกหนทุกแห่ง#! — ตา จมูก ลำคอของข้า แม้จะปิดหน้าก็แทบไม่ช่วยชะลอความเร็วของมัน กรวดทรายอันน่าสะพรึงกลัวพัดกระหน่ำใส่ทุกสิ่งทุกอย่างที่ขวางหน้าอย่างบ้าคลั่ง\n\nพายุทรายเกิดขึ้นอย่างกะทันหัน ดูเหมือนจะมาจากไหนก็ไม่รู้ ภายในไม่กี่นาที ขบวนทั้งหมดก็ถูกกลืนกิน และตอนนี้สิ่งที่ข้าพอจะรับรู้ได้จากส่วนที่เหลือคือเสียงกรีดร้องเมื่อเสบียงของเราถูกฉีกกระชากและพัดพาไปตามลมพายุ และเสียงไอโขลกๆ ที่ปอดของทั้งเด็กและผู้ใหญ่ต่างล้มเหลว\n\nการเตรียมการอย่างรอบคอบทั้งหมดของเราก็ตกอยู่ในความสับสนวุ่นวายในทันใด ทิ้งไว้ ซึ่ง"
 ep3_laamp_flavour_ewan.4041.desc.weather_type.wild_fires.intro: "แม้จะอยู่ห่างไกล เราก็สัมผัสได้ถึงความร้อนแรงของเปลวไฟที่พุ่งเข้าหาเรา\n\n"
 ep3_laamp_flavour_ewan.4041.desc.weather_type.wild_fires.scrub: "ไฟป่ากำลังลุกลามผ่านพุ่มไม้แห้งเร็วกว่าที่เราเคลื่อนที่ผ่านพื้นที่เปิดโล่ง ลมที่คาดเดาไม่ได้พัดพามันมาทางเราอย่างแรง คุกคามที่จะเผาทุกคนและทุกสิ่งที่หนีไม่ทัน — ทั้งล่อที่บรรทุกของหนักและเด็กที่อ้อยอิ่ง\n\nกลุ่มควันขนาดใหญ่ลอยนำหน้าเปลวไฟหลัก ทำให้ผู้ป่วยและผู้สูงอายุของเราสำลัก ทิ้งไว้ ซึ่ง"
 ep3_laamp_flavour_ewan.4041.desc.weather_type.wild_fires.slopes: "แม้ว่าเราจะยังคงดันขึ้นเนินอย่างหนัก ลมที่สม่ำเสมอและพื้นดินแห้งหมายความว่าไฟป่ากำลังไล่ตามเราทัน คุกคามที่จะเผาทุกคนและทุกสิ่งที่หนีไม่ทัน — ทั้งล่อที่บรรทุกของหนักและเด็กที่อ้อยอิ่ง\n\nกลุ่มควันที่ม้วนตัวขึ้นเหนือเปลวไฟหลัก แทรกซึมเข้ามาในแถวของเราเพื่อ ทำให้แม้ แต่ผู้ที่แข็งแกร่งที่สุดสำลัก ทิ้งไว้ ซึ่ง"
 ep3_laamp_flavour_ewan.4041.desc.weather_type.wild_fires.treeline: "ด้วยใบไม้จำนวนมากให้เผาไหม้ ไฟป่าจึงไล่ตามมาอย่างรวดเร็ว — การระเบิดเป็นครั้งคราวของต้นไม้ที่แห้งเป็นพิเศษและมียางมาก เป็นเครื่องเตือนใจอันน่าสยดสยองและน่าตกใจถึงชะตากรรมอันน่าสยดสยองที่รอคอยทุกสิ่งและทุกคนที่หนีไม่ทัน\n\nกลุ่มควันมันเยิ้มที่มีกลิ่นหอมอย่างผิดธรรมชาติไล่ตามเรานำหน้าเปลวไฟ ทำให้ผู้อ่อนแอสำลัก ทิ้งไว้ ซึ่ง"
 ep3_laamp_flavour_ewan.4041.desc.weather_type.wild_fires.fallback: "ไฟป่ากำลังเคลื่อนที่เร็วกว่าเรา พบเชื้อเพลิง #EMP เพียงพอ#! ที่จะเผาไหม้อย่างตะกละตะกลามเข้าหาขบวนของเรา ทุกคนและทุกสิ่งที่หนีไม่ทันจะถูกเผาทั้งเป็น — ทั้งล่อที่บรรทุกของหนักและเด็กที่อ้อยอิ่ง\n\nที่แย่ไปกว่านั้น กลุ่มควันขนาดใหญ่พวยพุ่งออกมานำหน้าเปลวไฟ บางครั้งก็พัดผ่านเราเพื่อคร่าชีวิตผู้อ่อนแอ ทิ้งไว้ ซึ่ง"
 ep3_laamp_flavour_ewan.4041.desc.weather_type.avalanche: "เป็นเสียงที่นุ่มนวลอย่างน่าประหลาดใจที่บ่งบอกถึงอันตรายที่ใกล้เข้ามา: เสียง #EMP วูบ#! ขนาดใหญ่และแผ่วเบาจากเบื้องบน\n\nดวงตาหลายสิบคู่ท่ามกลางขบวนเงยหน้าขึ้นมองยอดเขาที่สูงตระหง่านเหนือเรา ก่อนที่เสียงฟ้าผ่าที่ดังยิ่งกว่าพายุใดๆ จะดังก้องไปทั่วเทือกเขา\n\n"#BER หิมะถล่ม!#!" ใครบางคนกรีดร้อง ทันใดนั้น ทุกอย่างก็โกลาหล ทั้งคนและสัตว์ต่างแตกหนีอย่างรวดเร็วเพื่อหาที่กำบังแม้เพียงเล็กน้อยจากธารหิมะแห่งความตายสีขาวที่กำลังพุ่งเข้าหาเรา ทิ้งไว้ ซึ่ง"
 ep3_laamp_flavour_ewan.4041.desc.weather_type.flood: "หมอกดูเหมือนจะก่อตัวขึ้นจากที่ไหนก็ไม่รู้ — ชั่วขณะหนึ่งอากาศชื้น จากนั้นก็ข้นขึ้นจนเกือบเป็นซุป\n\nจากเบื้องบน หยาดฝนสองสามหยดตกลงมา และลำธารใกล้เคียงก็เริ่มเอ่อล้นตลิ่งอย่างรวดเร็ว ความตึงเครียดเข้าครอบงำขบวน ทำให้ทั้งคนและเกวียนค่อยๆ หยุดลง ไม่มีใครบอกได้แน่ชัดว่าปัญหาคืออะไร แต่ #EMP บางอย่าง#! ผิดปกติ\n\nภายในหนึ่งนาที พื้นดินที่เคยมั่นคงก็กลายเป็นโคลนหนา และน้ำทุกหนทุกแห่งก็เริ่มเอ่อขึ้นมาจากเบื้องล่าง "น้ำท่วม #EMP น้ำป่าไหลหลาก#!!" เสียงร้องจากใครบางคนดังขึ้น ทิ้งไว้ ซึ่ง"
 ep3_laamp_flavour_ewan.4041.desc.weather_type.frozen_water: "หิมะที่นี่ตกต่อเนื่อง แต่ไม่รุนแรงพอที่จะก่อปัญหา เพียงพอที่จะปกคลุมโลกด้วยพรมสีขาวหนา ขบวนของเราผ่านจุดโล่งในป่า เพลิดเพลินกับการพักจากร่มไม้ โอกาสเล็กน้อยที่จะชื่นชมดินแดนมหัศจรรย์รอบตัว\n\n#BER แคร็ก.#!\n\nดวงตาหลายสิบคู่มองลงไป เห็นรอยแยกขนาดใหญ่เปิดออกบนพื้น- ไม่ใช่ บนพื้นผิวของ #EMP ทะเลสาบน้ำแข็ง#!! ด้วยความสยดสยองที่เพิ่มขึ้น ไม่มีเวลาให้เสียเปล่า ไม่มีเวลาให้คิด เราต่างหนี — แม้จะมี"
 ep3_laamp_flavour_ewan.4041.desc.weather_type.earthquake: "โลกเคลื่อนไหวใต้ฝ่าเท้าของเรา คนและล่อโซเซ ทารกต่างร้องไห้ระงม และล้อเกวียนหลายอันหักเมื่อถูกยกขึ้นแล้วกระแทกลงหรือถูกดันไปด้านข้าง\n\nความตื่นตระหนกครึ่งวินาทีเข้าครอบงำทั่วทั้งขบวนหลังจากการสั่นสะเทือน: นั่นคืออะไร? จะมีอีกไหม หรือแค่นั้-\n\n#EMP แผ่นดินเริ่มสั่นสะเทือน#!. ในระยะกลาง รอยแยกเปิดออกและเริ่มคืบคลาน เร็วกว่าที่คนจะวิ่งได้ ตรงมายังเรา ภาพนั้นทิ้งไว้ ซึ่งทันที"
 ep3_laamp_flavour_ewan.4041.desc.outro: "ผู้ติดตามของข้าใกล้จะแตกสลาย"
