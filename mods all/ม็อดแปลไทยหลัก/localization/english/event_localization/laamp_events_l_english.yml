 ep3_laamp_flavour_ewan.4051.desc: "ด้วยกองทหารจำนวนมากภายใต้ธงรบเคลื่อนที่ผืนเดียว และดินแดน #EMP น่าสงสัย#! ทั้งหมดนี้ที่ต้องเดินทางผ่าน จึงเป็นที่คาดหมายได้ว่าเสบียงบางส่วนจะหายไปเป็นครั้งคราว\n\nนี่ไม่ใช่เสบียงเพียงเล็กน้อย\n\nนี่คือเสบียงจำนวนมหาศาล #EMP มหาศาล#! ที่คนโง่เห็นแก่ตัวบางคนได้ขายให้กับชาวบ้านหรือคนเลวในกองทหารของข้า สูญหายไป เนื่องจากความไร้ความสามารถ ไม่ได้ซื้อมาตั้งแต่แรก หรือไม่ก็ผลาญทิ้งไปเฉยๆ และมันแสดงถึงการละเมิดวินัยที่ไม่อาจให้อภัยได้"
 ep3_laamp_flavour_ewan.4051.a: "เอาแส้มาให้ข้า แล้วเราจะหาตัวผู้กระทำผิด!"
