 ep3_laamp_flavour_ewan.4001.t: "โจรป่า!"
 ep3_laamp_flavour_ewan.4001.desc: "พวกโจรเปิดฉากโจมตีขณะที่เรายังคงเคลื่อนที่อยู่ ทั้งผู้ป้องกันและสมาชิกที่เปราะบางของเราต่างกระจายออกไปเป็นแนวยาวคดเคี้ยว\n\nพวกมันประสานงานกันได้ดี เป่าเขาสัญญาณยาวก่อนที่จะพรั่งพรูออกมาจากที่ซ่อน โจมตีหลายจุดตามขบวนของเราพร้อมกันด้วยความโกรธเกรี้ยวอันน่าสะพรึงกลัว\n\nถึงกระนั้น ก็เห็นได้ชัดในทันทีว่าเป้าหมายของพวกมันคืออะไร เมื่อผู้นำของพวกมัน [bandit_leader.GetWomanMan] ชาว [bandit_leader.GetCulture.GetName] ผู้น่าเกรงขาม นำแก๊งของ [bandit_leader.GetHerHis] ตรงไปยังเกวียนที่บรรทุกเสบียงหนักที่สุด"
 ep3_laamp_flavour_ewan.4001.a: "ขับไล่พวกมัน!"
 ep3_laamp_flavour_ewan.4001.a.tt.success: "โจรป่าแตกพ่าย"
 ep3_laamp_flavour_ewan.4001.a.tt.failure: "พวกมันหนีไปพร้อมกับของที่ปล้นได้อยู่ดี"
 ep3_laamp_flavour_ewan.4001.b: "เตรียมลิ้มรสเหล็กกล้าเถิด ไอ้โจร!"
 ep3_laamp_flavour_ewan.4001.c: "ถอยไป ไอ้พวก #EMP ปลาซิว#!."
 ep3_laamp_flavour_ewan.4001.c.tt.success: "ท่านข่มขู่อาชญากรท้องถิ่นได้สำเร็จ"
 ep3_laamp_flavour_ewan.4001.c.tt.failure: "ชื่อเสียงของท่านใช้ไม่ได้ผล"
