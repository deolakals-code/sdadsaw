 ep3_laamp_flavour_ewan.4031.t: "โรคระบาดในฝูงสัตว์"
 ep3_laamp_flavour_ewan.4031.desc: "ไม่มีทางเป็นอื่นไปได้: ไม่ว่าจะจากสภาพอากาศ ภูมิประเทศ การบรรทุกน้ำหนักเกิน หรือเพียงแค่โชคร้าย โรคภัยบางอย่างได้เข้ามาสู่ฝูงสัตว์บรรทุกของค่าย\n\nพวกมันคร่ำครวญ พวกมันร้องเสียงดัง พวกมันเดิน แต่มันทั้งหมดกำลังช้าลงและเฉื่อยชาลงทุกชั่วโมง ไม่ต้องพูดถึงรายวัน\n\nม้าบางตัวมีไข้ชัดเจน และล่อแก่ตัวหนึ่งดูเหมือนใกล้จะตาย — เป็นภัยคุกคามร้ายแรงหากมันแพร่กระจายต่อไป"
 ep3_laamp_flavour_ewan.4031.a: "แน่นอนว่าเรารักษามันได้ใช่ไหม?"
