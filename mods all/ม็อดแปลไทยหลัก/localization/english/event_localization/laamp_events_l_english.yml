 # SIMPLE JOYS

 ep3_laamp_flavour_ewan.0001.t: "เฉดสีชมพูระเรื่อ"
 ep3_laamp_flavour_ewan.0001.desc.intro.preamble: "ช่วงพลบค่ำเป็นช่วงเวลาแห่งความวุ่นวายอย่างเข้มข้นของค่ายพัก ผู้คนและเสบียงถูกโยนไปมาขณะที่บ้านเคลื่อนที่ของเราถูกตั้งลงอีกครั้ง ตามปกติแล้ว มันเป็นช่วงเวลาที่ข้าเดินเล่นเพื่อทำใจให้ปลอดโปร่งและ"
 ep3_laamp_flavour_ewan.0001.desc.intro.lazy: "หลีกเลี่ยงงานเล็กๆ น้อยๆ และคำถามต่างๆ ที่มาจากผู้ติดตามของข้า\n\n"
 ep3_laamp_flavour_ewan.0001.desc.intro.diligent: "จัดระเบียบงานสำหรับวันพรุ่งนี้ในใจ\n\n"
 ep3_laamp_flavour_ewan.0001.desc.intro.fallback: "หลบหนีจากเสียงดังสักพัก\n\n"
 ep3_laamp_flavour_ewan.0001.desc.midtro.sunlight_boilerplate: "ข้าเห็นแสงสีชมพูระเรื่อสุดท้ายของดวงอาทิตย์ที่กำลังจะลับขอบฟ้าอาบไล้"
 ep3_laamp_flavour_ewan.0001.desc.midtro.small_hill: "ขณะที่ข้าขึ้นสู่ยอดเนินเขาเล็กๆ, $ep3_laamp_flavour_ewan.0001.desc.midtro.sunlight_boilerplate$"
 ep3_laamp_flavour_ewan.0001.desc.midtro.tree_covered_hill: "ขณะที่ข้าขึ้นสู่ยอดเนินเขาที่ปกคลุมด้วยต้นไม้, $ep3_laamp_flavour_ewan.0001.desc.midtro.sunlight_boilerplate$"
 ep3_laamp_flavour_ewan.0001.desc.midtro.small_ridge: "ขณะที่ข้าขึ้นสู่ยอดสันเขาเล็กๆ, $ep3_laamp_flavour_ewan.0001.desc.midtro.sunlight_boilerplate$"
 ep3_laamp_flavour_ewan.0001.desc.midtro.small_dune: "ขณะที่ข้าขึ้นสู่ยอดเนินทรายเล็กๆ, $ep3_laamp_flavour_ewan.0001.desc.midtro.sunlight_boilerplate$"
 ep3_laamp_flavour_ewan.0001.desc.midtro.dusty_ridge: "ขณะที่ข้าขึ้นสู่ยอดสันเขาที่เต็มไปด้วยฝุ่น, $ep3_laamp_flavour_ewan.0001.desc.midtro.sunlight_boilerplate$"
 ep3_laamp_flavour_ewan.0001.desc.midtro.stubby_hillock: "ขณะที่ข้าขึ้นสู่ยอดเนินดินเตี้ยๆ, $ep3_laamp_flavour_ewan.0001.desc.midtro.sunlight_boilerplate$"
 ep3_laamp_flavour_ewan.0001.desc.midtro.dusty_hill: "ขณะที่ข้าขึ้นสู่ยอดเนินเขาที่เต็มไปด้วยฝุ่น, $ep3_laamp_flavour_ewan.0001.desc.midtro.sunlight_boilerplate$"
 ep3_laamp_flavour_ewan.0001.desc.plains: "ที่ราบเบื้องล่าง สลักเสลาแอ่งแสงระยิบระยับเมื่อกระทบสระน้ำและลำธาร และอาบไล้ส่วนที่เหลือด้วยแสงนวลตา"
 ep3_laamp_flavour_ewan.0001.desc.farmlands: "พื้นที่เกษตรกรรมเบื้องล่าง จับภาพแนวพุ่มไม้และบ้านไร่ปลายนา และ ทำให้ขอบของมันนุ่มนวลลงด้วยเงาที่ลึกขึ้นเพียงเล็กน้อย โลกใบเล็กๆ มากมายสำหรับผู้คนตัวเล็กๆ ภายใต้ท้องฟ้าที่ส่องแสงเหมือนกัน"
 ep3_laamp_flavour_ewan.0001.desc.hills: "เนินเขาเบื้องล่าง สร้างแอ่งเงาเล็กๆ นับสิบ ดั่งผ้าห่มลายตารางหมากรุกที่ประดับด้วยดอกกุหลาบและหุบเขาอันมืดมิด"
 ep3_laamp_flavour_ewan.0001.desc.mountains: "ยอดเขาที่ต่ำกว่าเบื้องล่าง ทอดเงาปกคลุมหุบเขาทั้งหมดอย่างรวดเร็ว ขณะที่อาบไล้ยอดเขาด้วยแสงสีกุหลาบ"
 ep3_laamp_flavour_ewan.0001.desc.desert: "ทะเลทรายทอดตัวอยู่เบื้องหน้าข้า มหาสมุทรแห่งทรายสีกุหลาบทอดยาวไปจนสุดขอบฟ้า ไกลกว่านั้นอีก แม้จะแห้งแล้ง แต่ก็แทบไม่มีลักษณะเด่น ภูมิประเทศเปลี่ยนแปลงไปตามลมยามเย็น"
 ep3_laamp_flavour_ewan.0001.desc.desert_mountains: "ยอดเขาที่ต่ำกว่าเบื้องล่าง ภูเขาที่แห้งผากดื่มด่ำแสงสีกุหลาบอย่างตะกละตะกลาม ทอดเงาปกคลุมหุบเขาทั้งหมดขณะที่มันเหือดแห้งไป"
 ep3_laamp_flavour_ewan.0001.desc.oasis: "ทะเลทรายทอดตัวอยู่เบื้องหน้าข้า จับภาพผืนน้ำของโอเอซิสได้สว่างที่สุด สระน้ำอันล้ำค่าส่องประกายเจิดจ้ายิ่งขึ้น กลายเป็นมากกว่าแค่สัญญาณเปรียบเปรยชั่วขณะ"
 ep3_laamp_flavour_ewan.0001.desc.jungle: "ยอดไม้ป่าดิบชื้นทอดตัวอยู่เบื้องล่าง เป็นหย่อมเงาที่ลึกอยู่แล้วและต้นไม้ใหญ่ดูเหมือนจะยืดตัวขึ้นเพื่อรับแสงสุดท้ายเพียงแวบเดียว"
 ep3_laamp_flavour_ewan.0001.desc.forest: "ป่าไม้เบื้องล่าง เป็นกลุ่มยอดไม้ที่พันกันยุ่งเหยิงและเส้นทางเล็กๆ ที่มีหย่อมเงาเพียงพอที่จะซ่อนกองทัพได้ แม้ว่าจะครั้งละสองหรือสามคนก็ตาม"
 ep3_laamp_flavour_ewan.0001.desc.taiga: "ป่าไม้เบื้องล่าง ต้นสนและสปรูซทอดยาวผ่านเนินเขาหินเป็นระยะทางหลายลีกโดยรอบ ลายพร้อยไปด้วยเงาและแสงสีกุหลาบ"
 ep3_laamp_flavour_ewan.0001.desc.wetlands: "พื้นที่ชุ่มน้ำเบื้องล่าง ผืนน้ำเน่าเหม็นของหนองบึงเปลี่ยนเป็นผ้าห่มเกล็ดสีเงินอมชมพูในทันที แสงเปลี่ยนทุกสระน้ำให้กลายเป็นอัญมณีที่ส่องประกาย"
 ep3_laamp_flavour_ewan.0001.desc.steppe: "ทุ่งหญ้าสเตปป์ทอดตัวอยู่เบื้องหน้าข้า ทะเลหญ้าสีเหลืองน้ำตาลที่พลิ้วไหวพลันถูกเน้นด้วยสีกุหลาบอ่อนๆ ความราบเรียบอันน่าขนลุกของผืนดิน ทำให้เงาไม่มีที่ยึดเกาะ ก่อให้เกิดภาพที่สม่ำเสมออย่างน่าสบายใจ"
 ep3_laamp_flavour_ewan.0001.desc.floodplains: "ที่ราบน้ำท่วมถึงทอดตัวอยู่เบื้องหน้าข้า หญ้าสูงเขียวชอุ่มและแนวต้นไม้ที่เจริญงอกงามต่างทอดเงาบางๆ ไปทุกทิศทาง ผืนดินทั้งผืนดูเหมือนจะเรืองแสงอย่างนุ่มนวล"
 ep3_laamp_flavour_ewan.0001.desc.drylands: "พื้นที่แห้งแล้งเบื้องล่าง อาบไล้ทิวทัศน์ด้วยแสงสีกุหลาบอ่อนๆ จากเนินเขาสู่เนินเขา จากหมู่บ้านเล็กๆ สู่หมู่บ้านเล็กๆ ปกคลุมหมู่บ้านเล็กๆ มากมายในพื้นที่ด้วยความสงบนิ่ง"
 ep3_laamp_flavour_ewan.0001.desc.outro: "\n\nทิวทัศน์ที่สวยงาม — บางทีอาจเป็นสิ่งที่ควรค่าแก่การแบ่งปัน?"
 ep3_laamp_flavour_ewan.0001.a: "ดื่มด่ำและชื่นชมความสันโดษ"
 ep3_laamp_flavour_ewan.0001.b: "[watch_partner_1.GetFirstNameNoTooltip], ปีนขึ้นมานี่!"
 ep3_laamp_flavour_ewan.0001.c: "เรียก [watch_partner_2.GetFirstNameNoTooltip] แทน"
 ep3_laamp_flavour_ewan.0001.d: "เป็นช่วงเวลาที่ดี แต่งานรออยู่"
 ep3_laamp_flavour_ewan_0001_the_little_things_modifier: "สิ่งเล็กน้อย"
 ep3_laamp_flavour_ewan_0001_the_little_things_modifier_desc: "ตัวละครนี้แน่ใจว่าได้ใช้เวลาชื่นชมความสุขเล็กๆ น้อยๆ ในชีวิต"
 ep3_laamp_flavour_ewan_0001_all_business_modifier: "เรื่องงานล้วนๆ"
 ep3_laamp_flavour_ewan_0001_all_business_modifier_desc: "เมื่อมีงานต้องทำ อย่างอื่นรอได้"

 ep3_laamp_flavour_ewan.0011.t: "กองไฟและสหาย"
 ep3_laamp_flavour_ewan.0011.desc.intro: "ในแต่ละคืน กองไฟจะกลายเป็นศูนย์กลางแห่งกิจกรรมทางสังคมของค่าย ผู้คนมารวมตัวกันรอบตัวข้าเพื่อพูดคุยและหยอกล้อกันอย่างเป็นกันเอง คืนนี้ก็เช่นกัน\n\n"ฟังนะ สิ่งที่ข้าพยายามจะบอกก็คือ", [mocker.GetFirstName] หัวเราะร่วน, "ว่า[mockee.GetFirstName]ผู้น่าสงสาร""
 ep3_laamp_flavour_ewan.0011.desc.lustful: "ติดโรคติดต่อทางเพศสัมพันธ์มากกว่าจำนวนนิ้วที่[mockee.GetSheHe]มี — และเราไม่สามารถรู้ได้มากกว่านั้น เพราะ[mockee.GetSheHe]นับเลขสูงกว่านั้นไม่ได้!""
 ep3_laamp_flavour_ewan.0011.desc.chaste: "นี่คืออัครสาวกที่แท้จริงของความบริสุทธิ์ — และข้าหวังเป็นอย่างยิ่งว่าจะเป็น เช่นนั้น เพราะมันคงเป็นโชคไม่ดีสำหรับ[mockee.GetHerHim]ที่มีใบหน้า เช่นนั้น!""
 ep3_laamp_flavour_ewan.0011.desc.gluttonous: "คือเหตุผล #EMP ที่แท้จริง#! ที่เราต้องย้ายบ่อยๆ ทุกครั้งที่[mockee.GetSheHe]ไปตลาด มัน ทำให้เกิดความอดอยาก!""
 ep3_laamp_flavour_ewan.0011.desc.temperate: "ไม่สามารถถูกตำหนิได้ที่บังเอิญดื่มปัสสาวะแพะและไม่สังเกตเห็นรสชาติ ไม่ใช่ครั้งแรก นั่นเป็นอุบัติเหตุ แต่ครั้งที่ #EMP สอง#!? ตอนนี้มันเป็นรูปแบบแล้ว!""
 ep3_laamp_flavour_ewan.0011.desc.greedy: "ไม่ได้ทำอะไรผิด #EMP ในทางเทคนิค#! เมื่อ[mockee.GetSheHe]โยนเหรียญให้ขอทานคนนั้น — มันไม่ใช่ความผิดของ[mockee.GetHerHis]ที่[mockee.GetSheHe]จับมันได้ก่อนที่พวกเขาจะจับ!""
 ep3_laamp_flavour_ewan.0011.desc.generous: "เป็นคนใจดีที่ไม่เพียง แต่ไม่ให้เสื้อที่[mockee.GetHerHis]สวมอยู่ตอนนี้แก่เรา เพราะไม่มีใครจะรับมัน!""
 ep3_laamp_flavour_ewan.0011.desc.lazy: "ไม่สามารถถูกตำหนิได้ที่หายตัวไปเร็วกว่ากระต่ายตกใจเมื่อใดก็ตามที่มีคนเริ่มประโยคด้วย 'ช่วย' — ณ จุดหนึ่ง ความเกียจคร้านกลายเป็นศิลปะ!""
 ep3_laamp_flavour_ewan.0011.desc.diligent: "ไม่สามารถถูกตำหนิได้สำหรับจังหวะการเดินทัพที่ช้าของ[mockee.GetHerHis] — คงจะยากเมื่อมีไม้นั่นเสียบตรงก้นของ[mockee.GetHerHis]!""
 ep3_laamp_flavour_ewan.0011.desc.wrathful: "ไม่ต้องรับผิดชอบต่ออารมณ์ของ[mockee.GetHerHis] — ถ้าข้าต้องตื่นขึ้นมาเป็น[mockee.GetHerHim]ทุกเช้า ข้าก็คงจะโกรธเป็นบ้าเหมือนกัน!""
 ep3_laamp_flavour_ewan.0011.desc.calm: "อาจจะน่าเบื่อ แห้งแล้ง ไร้อารมณ์ความรู้สึกเรื้อรัง เป็นอาวุธที่ยิ่งใหญ่ที่สุดของค่ายในการต่อสู้กับอาการนอนไม่หลับ และ... โอ้ ขอโทษที [mockee.GetFirstNameNoTooltip] ไม่เห็นเจ้าอยู่ที่นั่น!""
 ep3_laamp_flavour_ewan.0011.desc.patient: "คงจะเอาชนะก้อนหินนั้นในการแข่งขันจ้องตาได้ถ้าเราไม่ต้องย้ายค่ายหลังจากผ่านไปหนึ่งหรือสองสัปดาห์!""
 ep3_laamp_flavour_ewan.0011.desc.impatient: "อาจมีสมาธิสั้นเท่าแมลงหวี่ แต่ [mockee.GetSheHe] ชดเชยด้วย... ความ... เอ่อออ ความตื่นเต้นตามธรรมชาติสำหรับสิ่งใหม่ ๆ ของ [mockee.GetHerHis] ใช่ไหม [mockee.GetFirstNameNoTooltip]?""
 ep3_laamp_flavour_ewan.0011.desc.arrogant: "ไม่สามารถถูกตำหนิได้สำหรับอัตตา #EMP อันมโหฬาร#! ของ[mockee.GetHerHis] — ท้ายที่สุดแล้ว มันเป็นสิ่งที่ใหญ่ที่สุดที่[mockee.GetSheHe]เหลืออยู่กับชื่อของ[mockee.GetHerHis]ในทุกวันนี้!""
 ep3_laamp_flavour_ewan.0011.desc.humble: "ถ่อมตัว[mockee.GetHerselfHimself]บ่อยพอที่ข้าไม่ต้องพยายามเลยจริงๆ — แต่ข้าก็จะทำอยู่ดี!""
 ep3_laamp_flavour_ewan.0011.desc.deceitful: "อาจเป็นคนที่ซื่อสัตย์ #EMP น้อยที่สุด#! ที่ข้าเคยพบ แต่เจ้าไม่สามารถพูดได้ว่าการสนทนากับ[mockee.GetHerHim]ไม่ใช่การเดินทางที่โลดโผน! ใช่ไหม [mockee.GetFirstNameNoTooltip]? ถ้านั่นคือชื่อจริงของเจ้า!"
 ep3_laamp_flavour_ewan.0011.desc.honest: "ไม่สามารถโกหกเพื่อช่วยชีวิต[mockee.GetHerHis]ได้ — หรือพูดเรื่องตลกได้ เช่นกัน!""
 ep3_laamp_flavour_ewan.0011.desc.craven: "เป็นคนอ่อนโยนที่เราทุกคนต้องระวังไม่ให้ตกใจกลัว เกรงว่าหัวใจของ[mockee.GetHerHis]จะหยุดเต้นจากความตกใจ!""
 ep3_laamp_flavour_ewan.0011.desc.brave: "พร้อมที่จะต่อสู้ตลอดเวลา และนั่นเป็นสิ่งที่ดี ดีกว่าที่คนหน้าตาน่าเกลียดที่สุดจะต่อสู้ พวกเขามีสิ่งที่จะเสียน้อยที่สุด!""
 ep3_laamp_flavour_ewan.0011.desc.shy: "กล้าหาญมากที่มานั่งข้างกองไฟคืนนี้ — ข้ารอคอยการมาเยือนของ[mockee.GetHerHis]ในปีหน้าแล้ว!""
 ep3_laamp_flavour_ewan.0011.desc.gregarious: "เป็นที่รู้จักของทุกคนว่าเป็นคนเข้ากับคนง่าย เป็นที่ชื่นชอบของฝูงชนอย่างแท้จริง — ซึ่งเป็นสิ่งที่ดี เพราะ[mockee.GetSheHe]ไม่เคย ทำให้ใครพอใจแบบตัวต่อตัวเลย!""
 ep3_laamp_flavour_ewan.0011.desc.ambitious: "อาจมีความคิดที่ยิ่งใหญ่เกี่ยวกับศักยภาพในชีวิตของ[mockee.GetHerHis] แต่เจ้าต้องยอมรับ[mockee.GetHerHim] มีคนไม่มากนักที่สามารถพูดพล่ามได้เต็มนาทีโดยไม่หยุดหายใจ!""
 ep3_laamp_flavour_ewan.0011.desc.content: "รู้ว่าต้องรักษาความทะเยอทะยานของ[mockee.GetHerHis]ให้เล็กและดี — ให้เข้ากับพรสวรรค์ของ[mockee.GetHerHis]!""
 ep3_laamp_flavour_ewan.0011.desc.arbitrary: "ไม่สามารถรับผิดชอบต่อการไม่เข้าใจกฎ #EMP ทั้งหมด#! เหล่านี้ได้ — ท้ายที่สุดแล้ว [mockee.GetSheHe] อ่านหนังสือไม่ออกด้วยซ้ำ!""
 ep3_laamp_flavour_ewan.0011.desc.just: "อาจเป็นคนเข้มงวดกับกฎเกณฑ์ก็จริง แต่เมื่อพิจารณาว่าพวกมันดูเหมือนจะติดแน่นอยู่ในก้นของ[mockee.GetHerHis]เพียงใด นั่นก็เป็นสิ่งที่คาดหวังได้!""
 ep3_laamp_flavour_ewan.0011.desc.cynical: "ไม่เป็นที่รู้จักในฐานะ [mockee.GetWomanMan] ที่เคร่งศาสนาอย่างแน่นอน แต่ เพื่อให้ #EMP ยุติธรรม#! อย่างเคร่งครัด ข้าก็คงมีปัญหา เช่นกันหาก [mocker.GetFaith.CreatorName] สาปแช่งข้าด้วยใบหน้านั้น!""
 ep3_laamp_flavour_ewan.0011.desc.zealous: "เป็นที่รู้จักว่าเป็นหนึ่งในผู้ติดตามที่ชอบธรรมและเสียสละตนเองมากที่สุดของ [mockee.GetFaith.HighGodName] บนโลก — [mockee.GetSheHe] ถึงกับยอมสละอารมณ์ขันทั้งหมดของ[mockee.GetHerHis]!""
 ep3_laamp_flavour_ewan.0011.desc.paranoid: "เป็นที่รู้จักว่าได้สร้างศัตรูไว้บ้างในสมัยของ[mockee.GetHerHis] — บางทีบางคนอาจอยู่ที่นี่ตอนนี้ บางทีอาจจะ... #EMP ข้างหลังเจ้า#!, [mockee.GetFirstNameNoTooltip], ระวัง!""
 ep3_laamp_flavour_ewan.0011.desc.trusting: "อาจจะเสียเหรียญไปบ้างให้กับพวกสิบแปดมงกุฎ แต่เพื่อปกป้อง[mockee.GetHerHis] [mockee.GetSheHe]จะไปรู้ได้อย่างไรว่าขอทานไร้ฟันผู้นั้นไม่ใช่พระราชาแห่ง[current_county.GetBaseNameNoTier] #EMP ตัวจริง#!?""
 ep3_laamp_flavour_ewan.0011.desc.compassionate: "ถูกบรรยายว่าอ่อนโยนเล็กน้อย หรืออ่อนโยนมาก อ่อนโยนทั้งหมดจริงๆ เหมือนผ้าห่มขนห่านชั้นดีที่อยู่ในร่างมนุษย์"
 ep3_laamp_flavour_ewan.0011.desc.callous: "อาจแสดงระดับความตระหนักรู้ทางสังคม เช่นเดียวกับแพะโดยเฉลี่ย แต่ไม่เหมือนแพะ [mockee.GetSheHe], เอ่อ... เอาล่ะ [mockee.GetFirstNameNoTooltip] นี่มันน่าอึดอัด"
 ep3_laamp_flavour_ewan.0011.desc.sadistic: "#EMP เตะ#! เด็กกำพร้าคนนั้นลงเนินเขา และ #EMP หัวเราะ#! ใส่หน้าหญิงขอทานคนนั้น แต่[mockee.GetSheHe]ก็มีคุณสมบัติไถ่โทษ เช่นกัน... ข้าเดาว่านะ ที่ไหนสักแห่ง อาจจะ"
 ep3_laamp_flavour_ewan.0011.desc.stubborn: "อาจเป็นสิ่งที่ดื้อรั้นที่สุดที่ค่ายมีให้ แต่ก็น่าประทับใจทีเดียวเมื่อพิจารณาถึงล่อทั้งหมด!"
 ep3_laamp_flavour_ewan.0011.desc.fickle: "อาจเปลี่ยนใจ[mockee.GetHerHis]บ่อยกว่าลมเปลี่ยนทิศ แต่เจ้าต้องยอมรับว่าไม่มีช่วงเวลาที่น่าเบื่อเลยเมื่อคุยกับ[mockee.GetHerHim]!"
 ep3_laamp_flavour_ewan.0011.desc.vengeful: "อาจสาบานว่าจะล้างแค้นด้วยเลือดชั่วนิรันดร์กับทั้งตระกูลนั้น แต่[mockee.GetSheHe]จะทำอะไรได้อีก? พวกเขาตัดแถวอาหาร!"
 ep3_laamp_flavour_ewan.0011.desc.forgiving: "อาจจะเต็มใจ #EMP เกินไป#! ที่จะปล่อยให้เรื่องที่แล้วผ่านไป แต่การฆ่าสุนัขเล็กน้อยระหว่างเพื่อนคืออะไร ใช่ไหม? เกิดขึ้นกับคนที่ดีที่สุด — และ[mockee.GetHerHim]ด้วย!"
 ep3_laamp_flavour_ewan.0011.desc.eccentric: "อาจจะแปลก อาจจะพูดแปลกๆ อาจจะมีกลิ่นเหมือนต้มอย่างอธิบายไม่ได้บ่อยครั้ง แต่อย่างน้อยเจ้าก็ไม่สามารถพูดได้ว่า[mockee.GetSheHe]คาดเดาไม่ได้!"
 ep3_laamp_flavour_ewan.0011.desc.outro: "\n\nเสียงระเบิดหัวเราะดังก้องมาจากกลุ่มผู้เฝ้ามองที่เมามาย แม้ดูเหมือนว่ามันจะทำให้ [mockee.GetFirstNameNoTooltip] เริ่มหมดความอดทนแล้วก็ตาม"
 ep3_laamp_flavour_ewan.0011.a: "เข้าร่วมการล้อเลียน [mockee.GetFirstNameNoTooltip]"
 ep3_laamp_flavour_ewan.0011.a.tt.success: "ดาวเด่นของงานเลี้ยง"
 ep3_laamp_flavour_ewan.0011.a.tt.failure: "ก้าวล้ำเส้น"
 ep3_laamp_flavour_ewan.0011.b: "พลิกสถานการณ์ใส่ [mocker.GetFirstNameNoTooltip]"
