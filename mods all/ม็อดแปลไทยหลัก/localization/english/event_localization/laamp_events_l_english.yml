 ep3_laamp_flavour_ewan.3071.f.success: "ท่านหนีรอด"
 ep3_laamp_flavour_ewan.3071.f.failure: "ศัตรูตามท่านทัน"

 ep3_laamp_flavour_ewan.3073.t: "$ep3_laamp_flavour_ewan.3071.t$: การประลองอันมีชัย"
 ep3_laamp_flavour_ewan.3073.desc: "ขณะที่ร่างอันบอบช้ำของ [local_soldier.GetFirstNamePossessive] ล้มลงกับพื้น เสียงร้องด้วยความตกใจก็ดังขึ้นจากกองทหารของ [local_soldier.GetHerHis]\n\nเมื่อผู้บัญชาการของพวกเขาตาย ขวัญกำลังใจของชาวบ้านก็แตกสลายโดยสิ้นเชิง และพวกเขาก็แตกพ่ายถอยหนีอย่างไม่เป็นระเบียบโดยมีทหารของข้าไล่ตามติดๆ\n\nข้ามองลงไปที่ศพ หึ\n\nความตายหรือความรุ่งโรจน์จริงๆ"
 ep3_laamp_flavour_ewan.3073.a: "เจ้าคนโง่เขลา"

 ep3_laamp_flavour_ewan.3081.t: "ชิงชัยด้วยมวยปล้ำ"
 ep3_laamp_flavour_ewan.3081.desc: "คู่ต่อสู้คนล่าสุดของ [challenger.GetFirstNamePossessive|U] ทรุดตัวลง หอบหายใจและพ่ายแพ้\n\nมวยปล้ำเป็นกีฬาที่ค่อนข้างเป็นที่นิยมในหมู่ทหารรับจ้างส่วนใหญ่ ด้วยเหตุผลที่ชัดเจน แต่ [challenger.GetFirstNameNoTooltip] ไล่ตามมันราวกับเป็นรูปแบบศิลปะ บางครั้งข้าก็สงสัยว่า [challenger.GetSheHe] จะไม่ชอบต่อสู้ด้วยมือเปล่ามากกว่าหรือ โดยไม่ต้องการอาวุธอื่นใด\n\n[challenger.GetWomanMan] เห็นท่าทางครุ่นคิดของข้า และยกหมัดของ [challenger.GetHerHis] ขึ้นเป็นการหยอกล้อที่สุภาพ — แต่เย้ยหยัน — "เอาล่ะ [ROOT.Char.GetFirstNameNoTooltip] ว่าอย่างไร?""
 ep3_laamp_flavour_ewan.3081.a: "คำพูดกล้าหาญสำหรับผู้แพ้ที่ใกล้เข้ามา"
 ep3_laamp_flavour_ewan.3081.a.tt.success: "ท่านปล้ำ [challenger.GetFirstNameNoTooltip] จนยอมจำนน"
 ep3_laamp_flavour_ewan.3081.a.tt.failure: "พ่ายแพ้"
 ep3_laamp_flavour_ewan.3081.b: "สั่งโบย [challenger.GetHerHim] โทษฐานที่กล้าถาม"
 ep3_laamp_flavour_ewan.3081.c: "ฮ่า #EMP ไม่#!."

