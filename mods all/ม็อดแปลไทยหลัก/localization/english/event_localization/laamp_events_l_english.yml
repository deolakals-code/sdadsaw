 ep3_laamp_flavour_ewan_1041_beautiful_home_diplomacy_modifier_desc: "ตัวละครนี้ชื่นชอบเรื่องราวของบ้านเกิดที่พวกเขาจำได้เพียงลางๆ หรือไม่เคยเห็นเลย"
