l_english: 
 ep3_laamps.0001.t.female: "อดีตและครั้งหนึ่งเคยเป็น [lost_primary_title.Custom('GetTierBaseTitleFemale')]"
 ep3_laamps.0001.t.male: "อดีตและครั้งหนึ่งเคยเป็น [lost_primary_title.Custom('GetTierBaseTitleMale')]"
 ep3_laamps.0001.intro: "ความพ่ายแพ้อันน่าอดสูและน่าอัปยศ!"
 ep3_laamps.0001.memory: "ไอ้ [war_memory.MakeScope.Var('war_cb').GetFlagName] ชั่วช้านี่ได้พรากทุกสิ่งไปจากข้า!"
 ep3_laamps.0001.fallback: "สงครามอันเลวร้ายนี้ได้พรากทุกสิ่งไปจากข้า!"
 ep3_laamps.0001.desc: "ข้าถูกขับไล่ออกไปในป่า ขณะที่ [winner.GetTitledFirstName] และเหล่าทหารของ [winner.GetHerHis] กำลังเฉลิมฉลองชัยชนะ!\n\nข้าสูญเสียบัลลังก์ [lost_primary_title.GetAdjectiveNoTooltip]... และเจ้า [winner.Custom('PersonalityGetNegativeTraitDesc')] [winner.Custom2('InsultNoun', ROOT.Char)] นั่น อาจกำลังสวมเครื่องราชกกุธภัณฑ์แห่ง [lost_primary_title.GetTierAsNameNoTooltip] #EMP ของข้า#! อยู่ในขณะนี้!"
 ep3_laamps.0001.a: "สักวันหนึ่ง ข้า #EMP จะต้อง#! ทวงคืนดินแดนของข้า!"
 ep3_laamps.0001.b: "ทุกสิ่งตกเป็นของ [alt_1.GetFirstNameNoTooltipRegnal]"
 target_character_government: "[government|E]: [TARGET_CHARACTER.GetGovernment.GetName]"
 target_character_independent: "[independent_ruler|E]"
 target_character_liege: "[Select_CString(TARGET_CHARACTER.IsIndependentRuler, 'เป็นอิสระ', 'ข้าหลวงของ')][Select_CString(TARGET_CHARACTER.IsIndependentRuler, "", TARGET_CHARACTER.GetLiege.GetName)]"
 ep3_laamps.0001.c: "[alt_2.GetFirstNameNoTooltipRegnal] ต้องสร้างอนาคตของตระกูลเรา"
 ep3_laamps.0001.d: "บัดนี้ พวกเรามองไปที่ [alt_3.GetFirstNameNoTooltipRegnal]"
 ep3_laamps.0001.e: "เวลาได้ล่วงเลยไปแล้ว..."
 ep3_laamps.0003.opening: "[adventurer.Custom2('AppropriateGreetingNegative', ROOT.Char)]"
 ep3_laamps.0003.desc: "ท่านและเจ้าภาพที่ชั่วร้ายของท่านอาจแย่งชิง [lost_primary_title.GetTierAsNameNoTooltip|l] ของข้าไปจากข้าได้ แต่จำคำข้าไว้: ข้ายังไม่จบสิ้น และข้าจะไม่ยอมแพ้ [lost_primary_title.GetBaseNameNoTierNoTooltip] ง่าย ๆ!"
 ep3_laamps.0003.a: "ฮ่า! คนโง่ยังมีใจสู้!"
 ep3_laamps.0004.desc: "ไอ้พวกทรยศชั่วช้าเหล่านี้ได้แย่งชิง[conquered.GetTierAsNameNoTooltip|l]ไปจากข้า ขับไล่ข้าสู่แดนกันดาร ขณะที่ [winner.GetTitledFirstName] และเหล่าทหารของ[winner.GetHerHis]โห่ร้องยกย่อง [heir.GetTitledFirstName] แทนที่ข้า!\n\nข้าปล่อยให้พวกนอกรีตและคนโป้ปดมดเท็จแย่งชิงบัลลังก์แห่ง[conquered.GetAdjectiveNoTooltip]ไปจากข้า... พวกเราเป็นเพียงของเล่นของ [ROOT.Char.GetFaith.FateGodName] โดยแท้..."
 lose_all_prestige_tt: "ท่านเหลือ [prestige_i][prestige|E] เพียง #V 100#! เท่านั้น"
 lose_all_prestige_level_tt: "ท่านสูญเสีย [prestige_levels|E] #value 3#! ระดับ"

 ep3_laamps.0010.t: "[potential_laamp.Custom('GetDaughterSon')|U] ผู้น้อยแห่ง [ROOT.Char.GetPrimaryTitle.GetBaseNameNoTierNoTooltip]"
 ep3_laamps.0010.single: "ในฐานะ [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('potential_laamp'))] ของข้า"
 ep3_laamps.0010.multi: "ในฐานะพี่น้องของข้า"
 ep3_laamps.0010.desc: "และข้าโศกเศร้าต่อการจากไปของ [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('deceased'))] ผู้ล่วงลับ, [deceased.GetTitledFirstNameRegnal], พวกเราต่างวุ่นวายกับการแบ่งสรรที่ดินของ[deceased.GetHerHis]\n\n[inherited.GetBaseNameNoTierNoTooltip] ตกเป็นของข้า,"
 ep3_laamps.0010.inheritor_1: "[inherited_1.GetBaseNameNoTierNoTooltip] แก่ [inheritor_1.GetFirstName];"
 ep3_laamps.0010.inheritor_2: "[inherited_2.GetBaseNameNoTierNoTooltip] แก่ [inheritor_2.GetFirstName];"
 ep3_laamps.0010.inheritor_3: "[inherited_3.GetBaseNameNoTierNoTooltip] แก่ [inheritor_3.GetFirstName];"
 ep3_laamps.0010.connector: "และ"
 ep3_laamps.0010.laamp: "แต่แล้ว [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('potential_laamp'))] [potential_laamp.Custom('PersonalityGetPositiveTraitDesc')] ของข้า, [potential_laamp.GetFirstName] เล่า?\n\nมือเปล่า, [potential_laamp.GetSheHe]เฝ้ามองการเปลี่ยนผ่านอำนาจจากข้างสนาม: ไม่มีพิธีการใดๆ สำหรับ #EMP [potential_laamp.GetHerHim]#! มีเพียงคำสัตย์ปฏิญาณต่อผู้อื่น สายเลือดขุนนางและดาบข้างกาย[potential_laamp.GetHerHis]คือสิทธิ์โดยกำเนิดเพียงอย่างเดียวของ[potential_laamp.GetHerHis]"
 ep3_laamps.0010.a: "อนิจจา บางคนไม่ได้ถูกลิขิตให้ปกครอง..."
 ep3_laamps.0010.b: "...ถึงกระนั้น ข้า #EMP ก็#! อิจฉาในอิสรภาพของ [potential_laamp.GetFirstNamePossessiveNoTooltip]"

 ep3_laamps.0020.t: "ผู้ถูกเนรเทศแห่ง[revoked.GetAdjectiveNoTooltip]"
 ep3_laamps.0020.desc: "ข้าสูญเสียทุกสิ่งในพริบตา: [revoked.GetTierAsNameNoTooltip|l] ของข้า, บรรดาศักดิ์ของข้า, ศักดิ์ศรีของข้า...\n\nไอ้สุนัขทรยศนั่น, [banisher.GetTitledFirstName], คาดหวังให้ข้าสำนึกบุญคุณที่มันไว้ชีวิตข้า และเพียงแค่เนรเทศข้าออกจาก [banisher.GetTopLiege.GetPrimaryTitle.GetBaseNameNoTierNoTooltip]! แม้คนโง่ก็รู้ว่าการเนรเทศอาจเป็นชะตากรรมที่ #EMP เลวร้ายยิ่งกว่า#! ความตาย..."
 ep3_laamps.0020.a: "ข้าจะไม่ยอมแพ้เรื่อง [revoked.GetBaseNameNoTierNoTooltip] ง่ายๆ!"
 ep3_laamps.0022.desc: "เจ้าอาจยึด [revoked.GetTierAsNameNoTooltip|l] ของข้าไปเพื่อแลกกับอิสรภาพของข้า แต่ [revoked.GetBaseNameNoTier] ไม่ใช่สิ่งที่เจ้าควรยึดไป และข้าจะไม่ยอมให้สิทธิ์ของข้าถูกลืมเลือน\n\nอาจมีวันหนึ่งที่บทบาทของเราสลับกัน และชีวิตของเจ้าอยู่ในมือ #EMP ของข้า#!"
 ep3_laamps.0022.a: "เห่าเสียงดัง แต่กัดไม่เข้า"

 ep3_laamps.0030.t: "นอกเหนือไปจาก [old_primary_title.GetBaseNameNoTierNoTooltip]"
 ep3_laamps.0030.desc: "ในที่สุดข้าก็จะสลัดเครื่องประดับ, ภาระหยุมหยิม, และงานประจำวันที่น่าเบื่อหน่ายในชีวิตที่ [old_capital_province.GetNameNoTooltip] ทิ้งไป และตั้งค่ายพักใน [old_capital_province.Custom('GetTerrainTypePlural')] ที่เปิดโล่ง!\n\nข้ามีข้ารับใช้และผู้ติดตามที่ไว้ใจที่สุดร่วมเดินทางด้วย ซึ่งต่างก็มีความกระตือรือร้นในระดับต่างๆ กันสำหรับชีวิตใหม่ในป่า\n\n"
 ep3_laamps.0030.heir: "แทนที่ข้า [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('laamp_inheritor'))] และทายาทของข้า, [laamp_inheritor.GetFirstName], ได้รับบรรดาศักดิ์ของข้าในฐานะ [laamp_inheritor.GetTitleAsNameNoTooltip] แห่ง [laamp_inheritor.GetPrimaryTitle.GetNameNoTierNoTooltip]"
 ep3_laamps.0030.liege: "อาณาจักรเก่าของข้าตกเป็นของเจ้าเหนือหัวเดิมของข้า, [laamp_inheritor.GetTitledFirstName], ผู้ ซึ่งยอมรับการตัดสินใจของข้าที่จะออกจากการรับใช้ของ[laamp_inheritor.GetHerHis]"
 ep3_laamps.0030.new: "แทนที่ข้า [laamp_inheritor.GetFirstName], ผู้มีอำนาจในท้องถิ่น, ได้รับเลือกจากเหล่าขุนนางให้ปกครองอาณาจักรเก่าของข้า"
 ep3_laamps.0030.a: "เอาล่ะ พวกเรารออะไรอยู่?"
 ep3_laamps.0032.opening: "[adventurer.Custom2('AppropriateGreetingPositive', ROOT.Char)]"
 ep3_laamps.0032.desc: "ชีวิตที่น่าตื่นเต้นยิ่งกว่า การเดินทางไปทั่วโลก กำลังเรียกหาข้า หลังจากไตร่ตรองมานาน ข้าได้ตัดสินใจสละที่ดินของข้าให้แก่ท่าน เจ้าเหนือหัวของข้า เพื่อเก็บไว้เป็นของท่านเอง ข้าจะออกเดินทางจาก [old_primary_title.GetBaseNameNoTierNoTooltip] สู่หนทางที่เปิดกว้างในไม่ช้า"
 ep3_laamps.0032.a: "เป็นการเคลื่อนไหวที่กล้าหาญ บางคนอาจเรียกว่าโง่เขลา"

 ep3_laamps.0040.t: "จากมั่งมีสู่ยาจก"
 ep3_laamps.0040.family: "[ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('actor'))] [actor.Custom2('InsultAdjective', ROOT.Char)] ของข้าไปอยู่ที่ #EMP ไหน#! กัน"
 ep3_laamps.0040.other: "นายเหนือหัว [actor.Custom2('InsultAdjective', ROOT.Char)] ของข้า ไปอยู่ที่ #EMP ไหน#! กัน "
 ep3_laamps.0040.desc: "หา!! บรรดาศักดิ์ของข้าถูกริบ! ที่ดินของข้าหายไป! สถานะของข้าป่นปี้!\n\nหากข้าจะปกป้องและฟื้นฟูทรัพย์สินอันชอบธรรมของข้า นับประสาอะไรกับเกียรติยศของข้า ดูเหมือนว่าข้าต้องเริ่มต้นจากจุดต่ำสุด!\n\nความโลภอันตะกละตะกลามของ [actor.GetTitledFirstNamePossessive] ควรได้รับการแก้แค้น ไม่ว่าหนทางจะยาวไกลเพียงใด..."
 ep3_laamps.0040.a: "[actor.GetSheHe|U] จะไม่ลอยนวลไปกับเรื่องนี้"
 ep3_laamps.0042.desc: "การริบ [landed_title.GetTierAsNameNoTooltip|l] ของข้าโดยเจ้า ทำให้ข้าไม่มีทางเลือกอื่น เจ้าบังคับให้ข้าต้องใช้ชีวิตเยี่ยงนักผจญภัย\n\nข้ายังไม่จบสิ้น และข้าจะไม่ลืมสิทธิ์อันชอบธรรมของข้าต่อ [landed_title.GetNameNoTierNoTooltip]!"
 ep3_laamps.0042.a: "ข้าให้เวลา [actor.GetHerHim] อย่างมากที่สุดสองสัปดาห์"

 ep3_laamps.0050.t: "ไปตามทางของ[potential_laamp.GetHerHis|U]"
 ep3_laamps.0050.desc: "[ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('potential_laamp'))] ของข้า, [potential_laamp.GetFirstName], เริ่มกระสับกระส่ายในช่วงหลัง และข้าแทบไม่แปลกใจเลยเมื่อ [potential_laamp.GetSheHe] ดักพบข้าในเย็นวันหนึ่ง ขณะที่เรากำลังทอดสายตามอง [ROOT.Char.GetCurrentLocation.Custom('GetTerrainType')] แห่ง [ROOT.Char.GetCurrentLocation.GetBaronyNameExplicitlyNoTooltip]\n\n"[potential_laamp.Custom2('RelationToMeShort', ROOT.Char)|U]," [potential_laamp.GetSheHe] ถอนหายใจอย่างอาวรณ์ มองไปยังขอบฟ้า, "ข้าเบื่อ [ROOT.Char.Custom('ResidenceBuildingPlural')] แล้ว ข้าอยากออกไป #EMP ที่นั่น#! ไปเห็นโลก! ข้าอยากสร้างชื่อเสียง #EMP ของข้า#! เอง"\n\n[potential_laamp.GetSheHe|U] ดูมุ่งมั่นอย่างแท้จริง เปี่ยมไปด้วยความกระตือรือร้นที่ข้าไม่เคยเห็นในตัว [potential_laamp.GetHerHim] หรือใครอื่น มาเป็นเวลานานแล้ว"
 ep3_laamps.0050.a: "เจ้า ทำให้ตระกูล [ROOT.Char.GetHouse.GetBaseNameNoTooltip] ภาคภูมิใจ!"
 ep3_laamps.0050.b: "หากเจ้าต้องไป ข้าจะไม่รั้งเจ้าไว้ที่นี่"
 ep3_laamps.0050.c: "อย่าพูดจาเหลวไหล!"
 ep3_laamps.0051.desc: "ขณะที่ข้าตื่นขึ้นในเช้าวันรุ่งขึ้น การโต้เถียงกับ [potential_laamp.GetFirstName] ยังคงหนักอึ้งในใจ ข้าได้รับแจ้งว่าไอ้คน [potential_laamp.Custom('PersonalityGetNegativeTraitDesc')] นั่นหายตัวไปในชั่วข้ามคืน!\n\nคนโง่นั่นขัดขืนความปรารถนาที่ชัดเจนของข้า เพื่อออกไปสู่ป่าและเล่นกับกลุ่มอันธพาล!"
 ep3_laamps.0051.a: "ไอ้เด็กเหลือขอนั่น..."
 ep3_laamps.0051.b: "...ช่างมีใจสู้เสียจริง!"
 allowed_runaway_laamp_opinion: "อนุญาตให้ออกผจญภัย"
 forbidden_runaway_laamp_opinion: "ห้ามออกผจญภัย"

 ep3_laamps.0100.t: "ทุกสิ่งมีราคา"
 ep3_laamps.0100.desc: "ข้าแทบไม่เชื่อสายตาเมื่อได้รับความยินยอมจาก [recipient.GetTitledFirstNamePossessive] ต่อข้อเสนอของข้า ในที่สุดข้าก็จะมี [ROOT.Char.Custom('FortifiedBuilding')] เป็นของตัวเอง พร้อมหลังคาและกำแพงแข็งแรงสี่ด้าน!\n\nข้าจะได้เป็น [ROOT.Char.GetTitleAsNameNoTooltip] คนใหม่แห่ง [ROOT.Char.GetPrimaryTitle.GetNameNoTier],"
 ep3_laamps.0100.desc_nomadic: "ข้าแทบไม่อยากเชื่อเลยเมื่อได้รับความเห็นชอบจาก [recipient.GetTitledFirstNamePossessive] ต่อข้อเสนอของข้า ในที่สุดข้าก็จะมีที่ดินเป็นของตัวเอง และมีสถานที่สำหรับเลี้ยงฝูงสัตว์!\n\nข้าจะได้เป็น [ROOT.Char.GetTitleAsNameNoTooltip] คนใหม่ของ [ROOT.Char.GetPrimaryTitle.GetBaseNameNoTier],"
 ep3_laamps.0100.fellow_vassal: "ปกครองพื้นที่ในฐานะข้าหลวงร่วมของ [new_liege.GetName] พึ่งพาและผูกพันกับเจ้าเหนือหัวคนใหม่ของข้าในระดับเท่าเทียมกัน"
 ep3_laamps.0100.liege: "ปกครองพื้นที่ในฐานะข้าหลวงแห่ง[recipient.GetPrimaryTitle.GetAdjectiveNoTooltip] พึ่งพาและผูกพันกับเจ้าเหนือหัวคนใหม่ของข้าในระดับเท่าเทียมกัน"
 ep3_laamps.0100.independent: "ปกครองดินแดนแห่ง[recipient.GetPrimaryTitle.GetAdjectiveNoTooltip] ที่เคยเป็นของผู้อื่นนี้ในฐานะเขตศักดินาของข้าเอง!"
 ep3_laamps.0100.unpopular: "\n\nถึงกระนั้น การไต่เต้าอย่างรวดเร็วของข้าขึ้นสู่ตำแหน่งอันสูงส่งของ [actor.GetTopLiege.GetPrimaryTitle.GetTierAsNamePossessiveNoTooltip] ย่อมต้องสร้างความขุ่นเคืองให้กับเหล่าท่านลอร์ดและท่านหญิงเพื่อนร่วมงานอย่างแน่นอน..."
 ep3_laamps.0100.fallback: "\n\nมันเป็นหนทางที่ยาวนาน แต่ในที่สุดข้าก็สามารถทิ้งเตียงนอนในค่ายไว้เบื้องหลังได้เสียที..."
 ep3_laamps.0100.a: "ฮ่า — แล้วพวกเขาก็พูดว่า 'เกียรติยศซื้อไม่ได้'!"
 ep3_laamps.0101.opening: "[recipient.Custom2('AppropriateGreetingPositive', actor)]"
 ep3_laamps.0101.desc: "ข้าดีใจอย่างยิ่งที่ได้ยินว่าท่านยอมรับข้อเสนอของข้า!\n\nทองคำได้ถูกส่งไปแล้ว และข้ากำลังจะย้ายไปพำนักที่ [new_primary_title.GetPreferredCapital.GetName]"
 ep3_laamps.0101.fellow_vassal: "ในฐานะข้าหลวงร่วมของ [new_liege.GetName]"
 ep3_laamps.0101.liege: "ในฐานะข้าหลวงผู้ต่ำต้อยของท่าน"
 ep3_laamps.0101.independent: "และปกครองมันในฐานะเขตศักดินาของข้าเอง"
 ep3_laamps.0101.a: "[actor.GetSheHe|U] ควรรู้จักที่ทางของ[actor.GetHerHis]"
 ep3_laamps.0101.b: "ข้าหวังว่านี่ไม่ใช่ความผิดพลาด"
 ep3_laamps.0101.c: "หวังว่าจะเป็นข้อตกลงที่ยุติธรรม"
 ep3_laamps.0101.liege_message.title: "ข้าหลวงขายที่ดิน"
 ep3_laamps.0102.opening: "[recipient.Custom2('AppropriateGreetingNegative', actor)]"
 ep3_laamps.0102.desc: "ช่างเป็นข้อเสนอที่น่าขันเสียนี่กระไร เจ้าคิดจริงๆ หรือว่าข้าจะขายบรรดาศักดิ์ของข้า? และขายให้กับ [actor.GetWomanMan] เช่น #EMP เจ้า?!#!"
 ep3_laamps.0102.a: "ไม่จำเป็นต้องหยาบคาย"


 ep3_laamps.0200.opening: "[recipient.Custom2('AppropriateGreeting', actor)]"
 ep3_laamps.0200.desc: "ตกลง ข้าจะช่วยในการรุกราน [secondary_recipient.GetPrimaryTitle.GetTierAsNameNoTooltip] ของ [secondary_recipient.GetTitledFirstNamePossessive] หากเจ้าสาบานว่าจะจงรักภักดีต่อข้าหากเจ้าได้รับชัยชนะ"
 ep3_laamps.0200.a: "ยอดเยี่ยม!"
 ep3_laamps.0201.opening: "[recipient.Custom2('AppropriateGreeting', actor)]"
 ep3_laamps.0201.desc: "ข้าได้พิจารณาข้อเสนอของเจ้าอย่างรอบคอบที่สุดแล้ว และได้ข้อสรุปว่าข้าไม่สามารถให้ความช่วยเหลือแก่เหตุผลของเจ้าได้ในเวลานี้"
 ep3_laamps.0201.a: "ข้าไม่ต้องการ [recipient.GetHerHim] อยู่แล้ว..."
 
 ep3_laamps.0300.t: "...และศัตรูของท่านให้ใกล้ชิดยิ่งกว่า"
 ep3_laamps.0300.desc: "หลังจากรอคอยคำตอบของ [recipient.GetFirstNamePossessive] ต่อข้อเสนอของข้าอย่างกระวนกระวาย ข้าปฏิเสธไม่ได้ถึงความโล่งใจที่รู้สึกเมื่อเห็นลายมือที่แสดงความยินยอมของ[recipient.GetHerHis]บนสาส์น\n\nเป็นอันว่า: [recipient.GetSheHe] จะเป็น [recipient.GetTitleAsNameNoTooltip] คนใหม่แห่ง [recipient.GetPrimaryTitle.GetNameNoTier],"
 ep3_laamps.0300.fellow_vassal: "ปกครองพื้นที่ในฐานะข้าหลวงร่วมของ [new_liege.GetName]"
 ep3_laamps.0300.liege: "ปกครองพื้นที่ในฐานะข้าหลวงของข้า — หาก [recipient.GetSheHe] อยู่ในร่องในรอย"
 ep3_laamps.0300.independent: "ปกครองดินแดนอันชอบธรรมแห่ง[recipient.GetPrimaryTitle.GetAdjectiveNoTooltip] ในฐานะเขตศักดินาของ[recipient.GetHerHis]เอง!"
 ep3_laamps.0300.unpopular: "\n\nการเลื่อนตำแหน่งอย่างรวดเร็วของ[recipient.GetHerHis|U]สู่ตำแหน่งขุนนางแห่ง[actor.GetTopLiege.GetPrimaryTitle.GetAdjectiveNoTooltip] ย่อมต้อง ทำให้หลายคนเลิกคิ้วใน [actor.GetTopLiege.GetPrimaryTitle.GetTierAsNameNoTooltip] อย่างแน่นอน..."
 ep3_laamps.0300.fallback: "\n\nบางทีในที่สุดข้าก็สามารถหันความสนใจไปยังเรื่องที่เร่งด่วนกว่าได้เสียที..."
 ep3_laamps.0300.a: "หวังว่านี่จะเป็นจุดสิ้นสุดของเรื่องนี้"
 ep3_laamps.0301.opening: "[actor.Custom2('AppropriateGreetingPositive', recipient)]"
 ep3_laamps.0301.desc: "ข้าดีใจที่เจ้าเห็นเหตุผล และข้าเชื่อว่าสิ่งนี้จะยุติข้อพิพาทของเรา\n\n[new_primary_title.GetPreferredCapital.GetNameNoTier] ได้ถูกเตรียมพร้อมสำหรับการมาถึงของเจ้า เพื่อปกครอง"
 ep3_laamps.0301.fellow_vassal: "ในฐานะข้าหลวงร่วมของ [new_liege.GetName]"
 ep3_laamps.0301.liege: "ในฐานะข้าหลวงของข้า"
 ep3_laamps.0301.independent: "ในฐานะเขตศักดินาของเจ้าเอง"
 ep3_laamps.0301.a: "ข้าพร้อมรับใช้ท่าน"
 ep3_laamps.0301.b: "ผู้ตกต่ำกลับกลายเป็นผู้ยิ่งใหญ่ได้อย่างไร!"
 ep3_laamps.0301.c: "ในที่สุดก็ได้เป็น [ROOT.Char.GetTitleAsNameNoTooltip]"
 ep3_laamps.0301.liege_message.title: "ข้าหลวงตั้งรกรากให้นักผจญภัย"
 ep3_laamps.0302.opening: "[recipient.Custom2('AppropriateGreetingNegative', actor)]"
 ep3_laamps.0302.desc: "เจ้าคิดว่าข้าจะถูกซื้อด้วยบรรดาศักดิ์เล็กน้อยเหล่านี้ง่ายๆ หรือ? หากข้าจะได้มันมา ข้าจะแย่งชิงมันมาจากเจ้าด้วยคมดาบ"
 ep3_laamps.0302.a: "โอ้! ไอ้คนไร้ค่าผู้นี้!"
 #
 ep3_laamps.0800.t: "ทางแยก"

 ep3_laamps.0800.inherited: "ผู้แจ้งข่าวมาถึงพร้อมกับการเปิดเผยอันหนักอึ้งถึงการสืบทอด [new_title.GetBaseNameNoTier] และดินแดนในสังกัดของข้า จาก [previous_holder.GetFullName]..."
 ep3_laamps.0800.abdication: "ผู้แจ้งข่าวมาถึงพร้อมกับการเปิดเผยอันหนักอึ้งถึงการสืบทอด [new_title.GetBaseNameNoTier] และดินแดนในสังกัดของข้า หลังจากการสละราชสมบัติของ [previous_holder.GetFullNamePossessive]..."
 ep3_laamps.0800.granted: "ผู้แจ้งข่าวมาถึงพร้อมกับการเปิดเผยอันหนักอึ้งถึงการมอบ [new_title.GetBaseNameNoTier] และดินแดนในสังกัดให้แก่ข้าโดย [new_liege.GetTitledFirstNamePossessive]..."
 ep3_laamps.0800.election: "ผู้แจ้งข่าวมาถึงพร้อมกับการเปิดเผยอันหนักอึ้งถึงการเลือกตั้งข้าเป็นผู้ปกครอง [new_title.GetBaseNameNoTier] และดินแดนในสังกัด..."
 ep3_laamps.0800.faction: "ผู้แจ้งข่าวมาถึงพร้อมกับการเปิดเผยอันหนักอึ้งว่าเหล่าขุนนางแห่ง [new_title.GetBaseNameNoTier] ได้มอบการปกครองให้แก่ข้า ขับไล่ [previous_holder.GetFullName] ออกไป..."
 ep3_laamps.0800.claim_war: "ในที่สุด ข้าได้เอาชนะ [previous_holder.GetTitledFirstName] และยึดดินแดนอันชอบธรรมของข้าคืนมา บัดนี้ข้ากุมอนาคตของ [new_title.GetBaseNameNoTier] ไว้ในมือ..."
 ep3_laamps.0800.holy_war: "ในที่สุด ข้าได้เอาชนะ [previous_holder.GetTitledFirstName] และยึดดินแดนของ[previous_holder.GetHerHis]ในนามของ [ROOT.Char.GetFaith.HighGodName] บัดนี้ข้ากุมอนาคตของ [new_title.GetBaseNameNoTier] ไว้ในมือ..."
 ep3_laamps.0800.conquest: "ในที่สุด ข้าได้เอาชนะ [previous_holder.GetTitledFirstName] และพิชิตดินแดนของ[previous_holder.GetHerHis] บัดนี้ข้ากุมอนาคตของ [new_title.GetBaseNameNoTier] ไว้ในมือ..."
 ep3_laamps.0800.vassal: "\n\nข้าถูกลิขิตให้รับช่วงต่อ และนั่งใน [new_capital.GetCountyData.GetCapital.GetBaronyNameExplicitlyNoTooltip] รับใช้ [new_liege.GetTitledFirstNameRegnal] ในฐานะ [ROOT.Char.GetLadyLord] ข้าหลวงแห่ง[new_liege.GetPrimaryTitle.GetAdjectiveNoTooltip] หรือ?"
 ep3_laamps.0800.independent: "\n\nข้าถูกลิขิตให้รับช่วงต่อ และนั่งใน [new_capital.GetCountyData.GetCapital.GetBaronyNameExplicitlyNoTooltip] ในฐานะ [ROOT.Char.GetLadyLord] องค์อธิปัตย์โดยสิทธิ์ของข้าเองหรือ?"
 ep3_laamps.0800.desc: "\n\nชีวิตบนท้องถนนนั้นเต็มไปด้วยการทดลองและอันตรายอย่างแน่นอน แต่ช่างมีอิสรภาพเสียนี่กระไร! ข้าปฏิเสธเสน่ห์ของมันไม่ได้ ปราศจากภาระความรับผิดชอบมากมายของการปกครอง\n\n"
 ep3_laamps.0800.a: "ใช่ ถึงเวลาทิ้งค่ายพักของข้าไว้เบื้องหลังแล้ว..."
 ep3_laamps.0800.a.tt: "#mixed_value #BER [THIS.Char.GetShortUIName|U] จะกลายเป็น [ruler|E] ผู้มี [landed|E]#!#!"
 ep3_laamps.0800.b: "ถนนเรียกหาข้า: [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('alt_1'))] ของข้า, [alt_1.GetFirstNameNoTooltip], สามารถรับมันไปได้!"
 ep3_laamps.0800.b.claimant: "ถนนเรียกหาข้า: ให้ [alt_1.GetFirstNameNoTooltip] รับสิทธิ์ในการอ้างของ[alt_1.GetHerHis]ไป!"
 ep3_laamps.0800.c: "ข้าจะมอบหมาย [new_title.GetBaseNameNoTierNoTooltip] ให้กับ [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('alt_2'))] ของข้า, [alt_2.GetFirstNameNoTooltip]"
 ep3_laamps.0800.c.claimant: "ข้าจะมอบหมายมันให้กับผู้อ้างสิทธิ์อันชอบธรรม: [alt_2.GetFirstNameNoTooltip]!"
 ep3_laamps.0800.d: "[ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('alt_3'))] ของข้า, [alt_3.GetFirstNameNoTooltip], จะปกครอง [new_title.Custom('GetTierBase')|l]!"
 ep3_laamps.0800.d.claimant: "การสนับสนุนของข้าตกเป็นของสิทธิ์ในการอ้างของ [alt_3.GetFirstNamePossessiveNoTooltip]!"
 ep3_laamps.0800.e: "ข้าสละดินแดนเหล่านี้ ให้ผู้อื่นรับไปเถิด!"
 ep3_laamps.0800.e.liege: "ข้าสละดินแดนเหล่านี้ [new_liege.GetTitleAsNameNoTooltip] อาจรับไปได้!"
 ep3_laamps.0800.claim.tt: "@warning_icon! #N ท่านจะสูญเสีย [claims|E] ทั้งหมดต่อ [titles|E] ที่สละไป#!"
 renounced_land_to_me_opinion: "สละบรรดาศักดิ์ให้แก่ข้า"
 renounced_land_to_weaker_claim_opinion: "สละบรรดาศักดิ์ให้แก่ผู้อ้างสิทธิ์ที่อ่อนแอกว่า"
 renounced_land_to_other_opinion: "สละบรรดาศักดิ์ให้แก่ผู้อื่น"
 renounced_land_outside_family_opinion: "สละบรรดาศักดิ์นอกตระกูล"
 adventurer_titles_renounced_title: "สละบรรดาศักดิ์แล้ว"
 adventurer_titles_renounced_to_me_desc: "[adventurer.GetFirstName] สละ [titles|E] ใหม่ของ[adventurer.GetHerHis]เพื่อยังคงเป็น [adventurer|E]"
 adventurer_titles_renounced_by_me_desc: "ข้าสละ [titles|E] ใหม่ของข้าให้แก่ [beneficiary.GetTitledFirstName]"

 ep3_laamps.1001.t: "เส้นทางที่เราเดิน"
 ep3_laamps.1001.desc.intro: "เส้นทางข้างหน้าทอดยาวไปเรื่อยๆ ดั่งเส้นด้ายคดเคี้ยวอันโดดเดี่ยวที่มุ่งสู่ขอบฟ้าอันไกลโพ้น\n\nค่ายพักของข้า...เงียบสงัด มีเพียงเต็นท์กระจัดกระจายไม่กี่หลังและสัตว์บรรทุกที่หาวหวอดรับลม คนแปลกหน้าและผู้ติดตามตื่นขึ้นพร้อมกับวันใหม่ เตรียมพร้อมสำหรับงานประจำวันยามเช้าอย่างไม่เต็มใจ\n\nส่วนใหญ่เป็นพวกเร่ร่อนเบ็ดเตล็ดที่เข้าๆ ออกๆ กลุ่มตามเส้นทางพร้อมกับถิ่นฐานใหม่ แต่ละแห่ง"
 ep3_laamps.1001.desc.blind: "มีเพียงไม่กี่เสียงที่ข้าจำได้ อย่างน้อยก็มากกว่าแค่ผ่านๆ"
 ep3_laamps.1001.desc.at_least_one_working_eye: "มีเพียงไม่กี่ใบหน้าที่ข้าจำได้ อย่างน้อยก็มากกว่าแค่ผ่านๆ"
 ep3_laamps.1001.a: "โชคดีที่คนที่ข้าจำได้เป็นนักสนทนาที่คารมคมคาย"
 ep3_laamps.1001.a.tt: "ท่านเริ่มต้นด้วย [followers|E] สองคนที่มีทักษะด้าน [diplomacy|E]"
 ep3_laamps.1001.b: "สักวันหนึ่ง นี่จะเป็นกองทัพ"
 ep3_laamps.1001.b.tt: "ท่านเริ่มต้นด้วย [followers|E] สองคนที่มีทักษะด้าน [martial|E]"
 ep3_laamps.1001.c: "ด้วยผู้คนเหล่านี้ ข้าจะสร้างจักรวรรดิ"
 ep3_laamps.1001.c.tt: "ท่านเริ่มต้นด้วย [followers|E] สองคนที่มีทักษะด้าน [stewardship|E]"
 ep3_laamps.1001.d: "อืม และไม่มีการขโมยในตอนกลางคืนด้วยซ้ำ"
 ep3_laamps.1001.d.tt: "ท่านเริ่มต้นด้วย [followers|E] สองคนที่มีทักษะด้าน [intrigue|E]"
 ep3_laamps.1001.e: "ขอบคุณ [ROOT.Char.GetFaith.KnowledgeGodName] ที่อย่างน้อยเราก็มีปัญญาชนอยู่บ้าง!"
 ep3_laamps.1001.e.tt: "ท่านเริ่มต้นด้วย [followers|E] สองคนที่มีทักษะด้าน [learning|E]"
 ep3_laamps.1001.f: "อย่างน้อยข้าก็นับว่ามีนักสู้ที่ดีอยู่บ้าง"
 ep3_laamps.1001.f.tt: "ท่านเริ่มต้นด้วย [followers|E] สองคนที่มีทักษะด้าน [prowess|E]"
 ep3_laamps.1001.g: "ข้ายังไม่ได้ผู้ติดตามที่คู่ควรเลย — ยัง"
 ep3_laamps.1001.g.tt.followers: "ท่านเริ่มต้นโดยไม่มี [followers|E] ที่สร้างขึ้น — มีเพียง [family|E] และ [friends|E] ใดๆ ที่ท่านมีอยู่แล้ว"
 ep3_laamps.1001.g.tt.difficulty: "@alert_icon! #alert_trial ท่านอาจพบว่า [task_contracts|E] ยาก หรือเป็นไปไม่ได้ จนกว่าท่านจะได้ [followers|E]#!"

 ep3_laamps.1011.t: "สาบานด้วยดาบ"
 ep3_laamps.1011.desc.four_plus_titles: ""... และข้าขอปฏิญาณว่าจะปกป้องสิทธิ์ของท่านใน [title_1.GetNameNoTier], ใน [title_2.GetNameNoTier], ใน [title_3.GetNameNoTier], และในทุกอาณาจักรที่ควรเป็นของท่านโดยชอบธรรมตลอดไป, เจ้าเหนือหัวของข้า", "
 ep3_laamps.1011.desc.three_titles: ""... และข้าขอปฏิญาณว่าจะปกป้องสิทธิ์ของท่านในอาณาเขตตามธรรมชาติของท่านตลอดไป, จาก [title_1.GetNameNoTier] ถึง [title_2.GetNameNoTier] ถึง [title_3.GetNameNoTier], เจ้าเหนือหัวของข้า", "
 ep3_laamps.1011.desc.two_titles: ""... และข้าขอปฏิญาณว่าจะปกป้องสิทธิ์ของท่านในอาณาจักรคู่ของท่านทั้ง [title_1.GetNameNoTier] และ [title_2.GetNameNoTier] ตลอดไป, เจ้าเหนือหัวของข้า", "
 ep3_laamps.1011.desc.one_title: ""... และข้าขอปฏิญาณว่าจะปกป้องสิทธิ์ของท่านในอาณาเขตอันชอบธรรมที่สุดของท่านคือ [title_1.GetNameNoTier] ตลอดไป, เจ้าเหนือหัวของข้า", "
 ep3_laamps.1011.desc.midtro: "ประกาศโดย [recipient.Custom2('MyCharacterIntroduction', actor)]\n\n[recipient.GetWomanMan]ผู้นั้นยังคงก้มศีรษะด้วยความเคารพยอมจำนนขณะที่[recipient.GetSheHe]กล่าวคำสัตย์ปฏิญาณอันยาวเหยียดของ[recipient.GetHerHis]จบลง รอคอยคำตอบของข้า\n\n"
 ep3_laamps.1011.desc.prior_swords: "อีกหนึ่งคมดาบชั้นดีที่สาบานต่ออุดมการณ์ของข้า"
 ep3_laamps.1011.desc.first_sword: "ดาบเล่มแรกที่สาบานต่อข้าอย่างสุดซึ้ง เช่นนี้"
 ep3_laamps.1011.desc.outro: "— ความภักดีของ[recipient.GetHerHis]บัดนี้ไร้ที่ติ — คำถามเดียวที่ยังคงอยู่คือ ข้า #EMP เต็มใจ#! ที่จะมอบความภักดีกลับไปมากเพียงใด?"
 ep3_laamps.1011.a: "[recipient.Custom('SisterBrother')] ของข้า ท่านจะมีที่นั่งที่โต๊ะของข้าเสมอ"
 ep3_laamps.1011.b: "ขอให้ชัยชนะของข้าได้รับความภักดีจากเจ้า [recipient.GetFirstNameNoTooltip]"

 ep3_laamps.5000.t: "ลังเปล่า"
 ep3_laamps.5000.desc: "ข้าก้มมองอาหารของข้าอย่างเศร้าสร้อย แอปเปิ้ลที่สุกงอมแทบไม่เต็มที่ดูเป็นสิ่งที่น่าดึงดูดใจที่สุดในบรรดาอาหาร\n\n"
 ep3_laamps.5000.provisionslow: "เสบียงของเรายังคงหมดลงเรื่อยๆ และตอนนี้เรากำลังลำบากอย่างแท้จริง ท้องร้องครวญครางไปทั่วค่าย และเข็มขัดของเราแทบจะไม่มีรูเหลือให้รัดแล้ว"
 ep3_laamps.5000.provisionsok: "ในค่ายไม่มีปัญหาขาดแคลนอาหาร แต่ความหลากหลายนั้นขาดหายไป เรามีผักเหี่ยวๆ มากมาย แต่ข้าอยากได้เนื้อชั้นดีจริงๆ"
 ep3_laamps.5000.ending: "\n\n[hunter.GetFirstName] กระโดดลุกขึ้นยืนบนเท้า [hunter.GetHerHis] คันธนูในมือ เอื้อมหยิบลูกธนูจากแล่ง\n\n"ข้าทนไม่ไหวแล้ว นี่อาจเป็นดินแดนของ [local_lord.GetTitledFirstNamePossessive] แต่ข้ามั่นใจว่า [local_lord.GetSheHe] คงไม่หวงแหนเศษเสี้ยวเล็กน้อยจากความอุดมสมบูรณ์ของพวกเขาหรอก""
 ep3_laamps.5000.a: "ห้ามลักลอบล่าสัตว์โดยไม่ได้รับอนุญาต"
 ep3_laamps.5000.a.tt: "ข้าจะส่งจดหมายขอสิทธิ์ในการล่าสัตว์"
 ep3_laamps.5000.a.success: "[local_lord.GetFirstNameNoTooltip] ยินยอม"
 ep3_laamps.5000.a.failure: "[local_lord.GetFirstNameNoTooltip] ยืนกรานให้ท่านจ่ายค่าสิทธิ์ในการล่าสัตว์"
 ep3_laamps.5000.a.critfailure: "[local_lord.GetFirstNameNoTooltip] ปฏิเสธ"
 ep3_laamps.5000.b: "ไปให้เร็ว และไปอย่างเงียบเชียบ"
 ep3_laamps.5000.b.success: "[hunter.GetFirstNameNoTooltip] ล่าสัตว์โดยไม่มีใครตรวจพบ"
 ep3_laamps.5000.b.failure: "[hunter.GetFirstNameNoTooltip] ถูกจับและปรับ โดยครึ่งหนึ่งของสิ่งที่[hunter.GetHerHis]ล่ามาได้ถูกริบ"
 ep3_laamps.5000.b.critfailure: "[hunter.GetFirstNameNoTooltip] ถูกจับและจำคุก"
 ep3_laamps.5000.c: "เราเสี่ยงไม่ได้ ไปหาผลเบอร์รี่แทน"
 ep3_laamps.5000.c.success: "[hunter.GetFirstNameNoTooltip] นำผลเบอร์รี่กลับมาบ้าง"
 ep3_laamps.5000.c.failure: "พุ่มเบอร์รี่ว่างเปล่า"

 ep3_laamps.5005.t: "ผู้มาเยือนผู้ศรัทธา"
 ep3_laamps.5005.desc: "กองไฟแตกประทุ ส่องให้เห็นร่างหนึ่งกำลังเข้ามาในวงล้อมของเรา [priest.GetSheHe|U] เคลื่อนไหวอย่างแข็งขันแม้จะเป็นเวลาดึกดื่น มือจับไม้เท้าไว้แน่น ผู้ที่ยืนยามอยู่กำลังสกัดกั้นแล้ว แต่ข้าโบกมือให้พวกเขาถอยไป\n\n"ท่านมีที่สำหรับบุรุษแห่ง [priest.GetFaith.HighGodName] หรือไม่?" [priest.GetSheHe|U] ยิ้มให้ข้าอย่างมีความหวัง เสื้อผ้าสกปรกส่งเสียงกรอบแกรบในสายลมแรง [ROOT.Char.GetFaith.PriestNeuter] พเนจร!\n\n"
 ep3_laamps.5005.samefaith: "บุคคล เช่นนี้เป็นที่รู้จักกันดีในแวดวง [ROOT.Char.GetFaith.GetAdjective] นักเทศน์พเนจรเผยแพร่พระวจนะของ [priest.GetFaith.HighGodName] ไปยังทุกซอกทุกมุมของโลก"
 ep3_laamps.5005.difffaith: "อาจจะเป็น [ROOT.Char.GetFaith.PriestNeuter] แต่ไม่ใช่ [ROOT.Char.GetFaith.PriestNeuter] แห่งศรัทธา [ROOT.Char.GetFaith.GetAdjective] นั่นข้าบอกได้ ผู้ร่วมศรัทธาของข้าสองสามคนขยับเท้าอย่างอึดอัดเมื่อพวกเขารู้ เช่นเดียวกัน"
 ep3_laamps.5005.a: "เราน่าจะได้ประโยชน์จาก [priest.GetWomanMan] ที่เจนโลก เช่นนี้..."
 ep3_laamps.5005.a.success: "[priest.GetSheHe|U] ตกลงที่จะอยู่สักพัก"
 ep3_laamps.5005.a.failure: "[priest.GetSheHe|U] มีแผนการที่ไกลเกินกว่าค่ายพัก"
 ep3_laamps.5005.b: ""นั่งลง พักสักคืน แล้วเล่าเรื่องของท่านให้เราฟัง!""
 ep3_laamps.5005.c: ""ข้าต้องขอให้ท่านจากไป""
 ep3_laamps.5005.c.tt: "มีที่ว่างไม่พอจริงๆ: ข้าไม่มีวันขอให้ผู้ติดตามของข้าสละเตียงให้คนแปลกหน้า!"
 ep3_laamps.5005.d: ""ไปให้พ้น! เราไม่ต้องการคนประเภทเจ้าที่นี่!""
 every_non_faith_follower: "[follower|E] ทุกคนที่ไม่ใช่ชาว [priest.GetFaith.GetAdjective]"

 ep3_laamps.5010.t: "ความปวดเมื่อย"
 ep3_laamps.5010.desc: "#EMP โอ๊ย!#!\n\nข้าพบว่าตัวเองส่งเสียง เช่นนี้เมื่อนั่งลงข้างกองไฟในตอนเย็นตอนนี้ ผู้เฒ่าผู้แก่พูดเสมอว่าสิ่งนั้นเกิดขึ้นเมื่อท่านแก่ตัวลง แต่ข้าอายุเพียง [ROOT.Char.GetAge]...\n\nไม่ นี่คือความสึกหรอของชีวิตที่ต้องอยู่อย่างลำบาก ข้าเห็นผลกระทบที่มันมีต่อคนอื่นๆ ด้วย: [follower.GetName] ทำหน้าเหยเกเล็กน้อยขณะที่ [follower.GetSheHe] ทรุดตัวลงนั่งข้างข้า"
 ep3_laamps.5010.a: "โรงเตี๊ยมที่เราผ่านมามีเตียงว่างมากมาย..."
 ep3_laamps.5010.b: "หลังที่น่าสงสารของข้าต้องการเครื่องเรือนที่หรูหรากว่านี้"
 ep3_laamps.5010.b.tt: "อัปเกรด [building|E] $camp_main_01_domicile_building$ ของท่านในราคาส่วนลด"
 ep3_laamps.5010.c: "เราต้องอดทนต่อไป"
 ep3_laamps.5010.c.success: "ร่างกายของท่านเริ่มชินกับมัน"
 ep3_laamps.5010.c.failure: "ท่านยังคงทนทุกข์ทรมานต่อไป"

 ep3_laamps.5015.t: "ทหารผู้หิวโหย"
 ep3_laamps.5015.desc: "ร่างหนึ่งโซซัดโซเซเข้ามาในค่าย สกปรกและเหนื่อยล้า เห็นได้ชัดว่าต้องการอาหารดีๆ สักมื้อ ชื่อของ[knight.GetHerHis|U]คือ [knight.GetFirstName], [knight.GetSheHe] กล่าว\n\n"ยังมีคนเหมือนข้าอีกมาก," [knight.GetSheHe] ชี้ไปยังระยะไกล, "พวกเราทุกคนถูกทอดทิ้งให้เน่าเปื่อยหลังจากความขัดแย้งเล็กๆ น้อยๆ ทุกครั้งสิ้นสุดลง แขนดาบของเรายังคงใช้งานได้ดี เช่นเคย แต่ชะตาของเราคือการพเนจรและอดอยาก"\n\n"เราเป็นคนกลุ่มเดียวที่เหลืออยู่ที่จะไม่ปล้นผู้ที่อ่อนแอเพื่ออาหารและของมีค่า" ดวงตาของ[knight.GetHerHis|U]เปล่งประกายด้วยความมุ่งมั่น แม้ว่า[knight.GetHerHis]จะมีท่าทางซูบผอม "ข้ายอมตายเสียดีกว่า""
 ep3_laamps.5015.a: ""เจ้าดีกว่าข้า และโง่เขลากว่า""
 ep3_laamps.5015.a.tt: "ยึดทุกเพนนีและเครื่องประดับเล็กน้อยในครอบครองของ[knight.GetHerHis]"
 ep3_laamps.5015.b: "เจ้าบอกว่ามีพวกเจ้าอีกงั้นหรือ?"
 ep3_laamps.5015.c: "เราน่าจะได้ประโยชน์จากคมดาบอีกเล่ม..."
 ep3_laamps.5015.c.success: "ข่าวความเอื้อเฟื้อของท่านแพร่กระจายออกไป"
 ep3_laamps.5015.d: "มาเถิด นั่งพักผ่อน กินเสีย"

 ep3_laamps.5020.t: "เสบียงที่ไม่คุ้นเคย"
 ep3_laamps.5020.desc: "วัฒนธรรมใน [location.GetName] ไม่คุ้นเคยสำหรับข้า และขนบธรรมเนียมบางอย่างของพวกเขาก็แปลกประหลาดไม่แพ้กัน สิ่งนี้ได้รับการพิสูจน์โดยเฉพาะอย่างยิ่งเมื่อ [cook.GetFirstName] ซึ่งทำหน้าที่เป็นพ่อครัวของเราในเย็นวันนั้น กวักมือเรียกข้าให้ไปดูหม้อตุ๋น\n\n"มันเป็นสูตรท้องถิ่น," [cook.GetSheHe] เริ่มต้น, "คาดว่าจะเป็นของชาว [local_culture.GetName] #EMP แท้ๆ#! ข้าได้รับการยืนยัน เช่นนั้นจากพ่อค้าที่ผ่านทางมา"\n\nข้ามองดูสารนั้นด้วยความสงสัย นั่นคือ... [cook.Custom('GetRandomRegionalSmallGame')] ตุ๋นหรือ? กับ #EMP [cook.Custom('RegionalRootVegetablePlural')]?!#!"
 ep3_laamps.5020.tt: "ต้องการหนึ่งใน: [GetTrait('lifestyle_traveler').GetName( GetNullCharacter )], [GetTrait('eccentric').GetName( GetNullCharacter )], หรือ [GetTrait('gluttonous').GetName( GetNullCharacter )]"
 ep3_laamps.5020.a: "...บางทีมันอาจต้องการ #EMP บางอย่าง#! ที่พิเศษเล็กน้อย"
 ep3_laamps.5020.a.tt: "และบางที [cook.GetFirstNameNoTooltip] อาจพบว่ามันพิเศษ เช่นกัน"
 ep3_laamps.5020.b: "ผสมกับสมุนไพรจากอาหาร [culture.GetNameNoTooltip]"
 ep3_laamps.5020.c: "เอาล่ะ ข้าจะลองดู"
 ep3_laamps.5020.c.success: "มันอร่อยมาก"
 ep3_laamps.5020.c.failure: "มันน่าขยะแขยง"
 cultural_acceptance_gain_food_acceptance: "สองวัฒนธรรมแลกเปลี่ยนเทคนิคการทำอาหาร"
 ep3_laamps.5020.d: "นี่มันโคลนอะไรกัน?!"
 ep3_laamps.5020.d.tt: "ความไม่เต็มใจของท่านกลายเป็นที่เลื่องลือ"

 ep3_laamps.5025.t: "หนทางสู่จุดหมาย?"
 ep3_laamps.5025.desc: "ข้านั่งอยู่ข้าง [ROOT.Char.Custom('GetRandomCampBuilding')] ปล่อยให้เสียงและกลิ่นของค่ายพักพัดผ่านตัวข้า มันแตกต่างจากชีวิตภายในกำแพงอันปลอดภัยของพระราชวัง แตกต่างกันมาก\n\nอิสรภาพนั้นง่ายต่อการเพลิดเพลิน ไม่มีภาระผูกพัน ไม่มีที่ปรึกษาคอยบ่น ไม่มีบุคคลสำคัญให้ความบันเทิง ไม่มีข้อเสียใดๆ ของเครื่องประดับแห่งอำนาจ\n\nทว่าอิสรภาพเหล่านี้ต้องซื้อมาด้วยราคาแพง การดิ้นรนเพื่อความอยู่รอดอย่างต่อเนื่องนั้น ทำให้เหนื่อยล้า ทุกคืนข้าโหยหาเตียงนอนที่เหมาะสมมากขึ้นเรื่อยๆ..."
 ep3_laamps.5025.a: "ข้า #EMP ต้อง#! อ้างสิทธิ์ในดินแดนบางแห่งในอนาคต"
 ep3_laamps.5025.b: "ข้าค่อนข้างเพลิดเพลินกับชีวิตนี้"
 ep3_laamps.5025.b.flavor: "ถ้า เช่นนั้น ก็ถึงเวลาทำความคุ้นเคยกับมัน!"
 ep3_laamps.5025.b.tt: "เพิ่ม [task_contracts|E] ใหม่ #value 2#! รายการ"
 ep3_laamps.5025.c: "เป็นการดีที่สุดที่จะเปิดทางเลือกไว้"
 ep3_laamps.5025.c.flavor: "...และเป็นการดีที่สุดที่จะตุนเสบียงสำหรับสิ่งใดก็ตามที่รออยู่ข้างหน้า"
 ep3_laamps.5025.c.toast: "ท่านเรียนรู้คุณค่าของความยืดหยุ่น"
 lust_for_land_modifier_tt: "ตัวปรับค่า [GetModifier( 'ep3_lust_for_land_modifier' ).GetNameWithTooltip]"

 ep3_laamps.5030.t: "เข้าๆ ออกๆ โรงเตี๊ยม"
 ep3_laamps.5030.desc: "ขณะที่เราเดินย่ำไปตามถนน อาคารหลังหนึ่งก็ปรากฏแก่สายตา ป้ายที่ผุพังด้านนอกเขียนว่า "[ROOT.Char.Custom('GetPubName')] - โรงเตี๊ยม"\n\n"คืนนี้ไม่มีโชค เราแทบไม่มีที่ว่างสำหรับผู้เช่าปัจจุบันของเรา นับประสาอะไรกับคนใหม่" ข้างใน เจ้าของโรงเตี๊ยมส่ายหน้า[innkeeper.GetHerHis]อย่างไม่ไยดี "และ #EMP โดยเฉพาะอย่างยิ่ง#! ไม่ใช่พวกเจ้าที่ แต่งตัวซอมซ่อ!"\n\n#EMP ซอมซ่อ?!#!"
 ep3_laamps.5030.a: "อา ไม่เป็นไร แค่ดื่มอะไรสักหน่อยก็พอ"
 ep3_laamps.5030.a.tt: "ตัวเลือกนี้มีให้ท่าน เนื่องจาก [dynasty_prestige|E] ที่สูงของท่าน\n"
 ep3_laamps.5030.b: "ข้าไม่ใช่ขอทาน ข้าคือ [ROOT.Char.GetFirstNameNoTooltip] แห่งตระกูล [ROOT.Char.GetHouse.GetNameNoTooltip]"
 ep3_laamps.5030.b.tt: ""และข้า #EMP เรียกร้อง#! การต้อนรับ!""
 ep3_laamps.5030.c: "ข้าเกรงว่าข้าต้องการที่พักอย่างแน่นอน"
 ep3_laamps.5030.c.success: "คำใบ้ของท่านเป็นที่เข้าใจ พร้อมส่วนลดเพิ่มเติม"
 ep3_laamps.5030.c.failure: "การข่มขู่ของท่านกลายเป็นเรื่องโจ่งแจ้ง"
 ep3_laamps.5030.c.critfailure: "เรื่องราวบานปลาย"
 ep3_laamps.5030.d: "แน่นอนว่าเราสามารถตกลงกันได้?"
 ep3_laamps.5030.d.success: "การต่อรองของท่านประสบความสำเร็จ"
 ep3_laamps.5030.d.failure: "[innkeeper.GetFirstNameNoTooltip] ไม่ยอมขยับเขยื้อน"

 ep3_laamps.5035.t: "ลักษณะภูมิประเทศ"
 ep3_laamps.5035.desc: "ไม่มีใครในค่ายของข้าคุ้นเคยกับภูมิประเทศใน [location.GetName] อย่างใกล้ชิด และดินแดน เช่นนั้นไม่ใช่สิ่งที่ควรล้อเล่น ด้วยเหตุนี้ ข้าจึงพบว่าตัวเองกำลังยืนอยู่หน้าผู้นำทางท้องถิ่น ต่อรองราคาสำหรับบริการที่จะได้รับ\n\n"ข้างนอกนั่นไม่ใช่เรื่องล้อเล่น!" [guide.GetSheHe|U] เสนอ สูดอากาศเข้าทางฟันที่ขบกันแน่น ท่าทางกังวลอย่างเสแสร้ง "ท่านจะต้องใช้แผนที่เหล่านี้หรือบริการของข้า ข้าบอกท่านได้ฟรีๆ เลย"\n\n[guide.GetSheHe|U] พูดถูก แต่... มีบางอย่างเกี่ยวกับท่าทางของ[guide.GetHerHis]ที่ ทำให้ข้าลังเล"
 ep3_laamps.5035.tt: "ต้องการหนึ่งใน: [GetTrait('lifestyle_traveler').GetName( GetNullCharacter )], [GetTrait('eccentric').GetName( GetNullCharacter )], หรือ [GetTrait('gluttonous').GetName( GetNullCharacter )]"
 ep3_laamps.5035.a: "ข้าน่าจะได้ประโยชน์จาก [guide.GetWomanMan] เช่นเจ้าในค่ายพัก"
 ep3_laamps.5035.b: "เจ้าบอกว่าแผนที่เหล่านั้นราคาเท่าไหร่?"
 ep3_laamps.5035.c: "เราต้องการความช่วยเหลือจากเจ้าในการผ่านพื้นที่ #EMP เหล่านี้#!..."
 ep3_laamps.5035.c.success: "คำแนะนำพิสูจน์ว่ามีประโยชน์"
 ep3_laamps.5035.c.failure: "ข้อมูลของผู้นำทางผิดพลาด"
 ep3_laamps.5035.c.critfailure: "เส้นทางของผู้นำทางนำท่านไปสู่กับดักโดยตรง"
 ep3_laamps.5035.d: "ไม่จำเป็นต้องใช้บริการของเจ้า"
 ep3_laamps.5035.d.tt: "เราคงต้องหวังว่าเราจะไม่หลงทาง..."
 ep3_laamps.5035.d.toast: "ท่านหลงทาง"

 guide_map: "แผนที่โดยละเอียด"
 guide_map_desc: "มัดแผนที่นี้แสดงลักษณะภูมิประเทศโดยละเอียด ครอบคลุมพื้นที่ส่วนใหญ่ของโลกที่รู้จัก มีประโยชน์อย่างยิ่งเมื่อนำทางในภูมิประเทศที่ยุ่งยากและอันตราย"

 ep3_laamps.5040.t: "เดินเตร่ในซากปรักหักพัง"
 ep3_laamps.5040.desc: "ขณะลาดตระเวนล่วงหน้าค่ายพัก ข้าพบกลุ่มพ่อค้าที่รวมตัวกันอย่างไม่เป็นระเบียบ พวกเขารวมตัวกันรอบอาคารขนาดใหญ่ แต่เก่าแก่และทรุดโทรม โดยอาคารที่เหลืออยู่ในสภาพดีถูกพ่อค้ายึดครอง\n\nสินค้าของพวกเขาค่อนข้างธรรมดา ส่วนใหญ่เป็นอาหาร เนื่องจากอยู่บนถนนที่มีผู้สัญจรไปมาเป็นอย่างดี ซึ่งไม่ต้องสงสัยเลยว่าจะดึงดูดผู้ซื้อจำนวนมาก ทว่าสายตาของข้ากลับจับจ้องไปที่กำแพงสีเทา มีรอยด่างพร้อยของซากปรักหักพังอย่างไม่อาจต้านทานได้\n\nช่างงดงามเสียนี่กระไร! พ่อค้าครอบครองเพียงบริเวณรอบนอก แต่ใจกลางที่ทรุดโทรมของมันยังคงไม่ถูกแตะต้อง"
 ep3_laamps.5040.a: "เอาล่ะ ลองเสี่ยงโชคในซากปรักหักพังเหล่านั้นดู..."
 ep3_laamps.5040.a.bigsuccess: "การค้นหาของท่านเป็นไปด้วยดีมาก"
 ep3_laamps.5040.a.bigsuccess.tt: "ท่านค้นพบอาวุธที่เต็มไปด้วยฝุ่น"
 ep3_laamps.5040.a.success: "การค้นหาของท่านเป็นไปด้วยดี"
 ep3_laamps.5040.a.success.tt: "ท่านค้นพบเครื่องประดับเล็กๆ น้อยๆ"
 ep3_laamps.5040.a.failure: "การค้นหาของท่านไร้ประโยชน์"
 ep3_laamps.5040.a.failure.tt: "ท่านไม่ค้นพบสิ่งใดเลย"
 ep3_laamps.5040.b: "เป็นการดีที่สุดที่จะอยู่อย่างปลอดภัยและซื้อเสบียง"
 ep3_laamps.5040.c: "บางทีบางคนในหมู่พวกเขาอาจเข้าร่วมกับข้า?"
 ep3_laamps.5040.c.critsuccess.tt: "[followers|E] สองคนเข้าร่วม"
 ep3_laamps.5040.c.success.tt: "[follower|E] หนึ่งคนเข้าร่วม"
 ep3_laamps.5040.c.failure.tt: "ไม่มีใครเข้าร่วม"
 ep3_laamps.5040.c.critsuccess: "สองสามคนรับข้อเสนอของท่าน"
 ep3_laamps.5040.c.success: "มีคนตัดสินใจเข้าร่วมกับท่าน"
 ep3_laamps.5040.c.failure: "ไม่มีใครก้าวออกมา"

 ep3_laamps.5045.t: "ระเบียงแห่งอำนาจ"
 ep3_laamps.5045.desc: "อาหารที่บ้านพักของ [local_lord.GetFullNamePossessive] ใน [location.GetName] นั้นยอดเยี่ยม แน่นอน แตกต่างจากอาหารหยาบๆ ที่พร้อมทานตามปกติที่ข้าคุ้นเคยเป็นอย่างดี\n\n"ข้าดีใจมากที่ท่านสามารถตอบรับหมายเรียกของข้าได้" [local_lord.GetFirstNameNoTooltip] กล่าว พลางชี้มาทางข้า "ข้าอยากจะดูว่ามีอะไรที่เราสามารถช่วยเหลือ ซึ่งกันและกันได้บ้าง"\n\n"ท้ายที่สุดแล้ว มีบางครั้งที่ [local_lord.GetWomanMan] ในตำแหน่งของข้าไม่สามารถ #EMP ลงไปคลุกคลีกับโคลนตม#! ได้เท่าที่งานบางอย่างต้องการ...""
 ep3_laamps.5045.a: "ท่านรู้ไหม ข้าค่อนข้างเหนื่อยกับชีวิตพเนจร..."
 ep3_laamps.5045.a.tt: "สิ่งนี้มีให้ท่าน เนื่องจากท่านมี [modifier|E] [GetModifier( 'ep3_lust_for_land_modifier' ).GetNameWithTooltip]"
 ep3_laamps.5045.a.success: "คำพูดของท่านพิสูจน์ว่าโน้มน้าวใจได้"
 ep3_laamps.5045.a.failure: "[local_lord.GetSheHe|U] หัวเราะเยาะ"
 ep3_laamps.5045.b: "เอาล่ะ ทองคำไม่เคยเสียหาย..."
 ep3_laamps.5045.c: "อาหารแบบนี้อีกสักหน่อยก็พอแล้ว"
 ep3_laamps.5045.d: "ทั้งหมดที่ข้าต้องการคืองานเพื่อรับใช้ดินแดนเหล่านี้"
 
 world_africa_sahara_provisions_usage_multiplier_modifier: "จังหวัดซาฮารา"
 world_africa_sahara_provisions_usage_multiplier_modifier_desc: "จังหวัดนี้อยู่ภายใต้ความพิโรธอันเต็มเปี่ยมของทะเลทรายซาฮาราอันยิ่งใหญ่ (หรือเทือกเขาที่อยู่ติดกัน) — มีเพียงคนโง่หรือผู้เชี่ยวชาญเท่านั้นที่จะพยายามข้ามผ่านมันไป"

