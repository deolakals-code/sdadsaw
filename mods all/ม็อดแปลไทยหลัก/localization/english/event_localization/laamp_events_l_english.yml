 ep3_laamp_flavour_ewan.1051.t: "มันไม่ยุติธรรม"
 ep3_laamp_flavour_ewan.1051.desc: "เสียงกรีดร้องอย่างฉุนเฉียวของ [child.GetFirstNamePossessive|U] สามารถปลุกคนตายได้\n\n"ข้าบอกแล้วว่ามัน #EMP ไม่ยุติธรรม#! ไม่เลยสักนิด! ทำไม #EMP พวกเรา#! ต้องมาอยู่ที่นี่แบบนี้? เหมือนกับว่าเราเป็นแค่... สัตว์ป่า เร่ร่อนจากที่หนึ่งไปอีกที่หนึ่ง ไม่มีวัง ไม่มีปราสาท ไม่มีแม้ แต่เตียงนอนดีๆ ข้าไม่ได้ขอ #EMP ความยากจน#! นี้ และข้าสมควรได้รับสิ่งที่ดีกว่า!"\n\nท่ามกลางเสียงกรีดร้องและความโกรธแค้น ข้าสามารถ [ROOT.Char.Custom('SenseObserve_SenseSee')] ได้ว่าความคับข้องใจของ [child.Custom('GetDaughterSon')] ของข้านั้นเป็นเรื่องจริง น้ำตาแห่งความโกรธและความเศร้าไหลอาบแก้มทั้งสองข้างของ [child.GetHerHis]"
 ep3_laamp_flavour_ewan.1051.tt.success: "[child.GetFirstNameNoTooltip] สงบลง"
 ep3_laamp_flavour_ewan.1051.tt.failure: "[child.GetFirstNameNoTooltip] ไม่สามารถปลอบโยนได้"
 ep3_laamp_flavour_ewan.1051.a: "มานี่เถิด [child.Custom('GirlBoy')] ของข้า ทุกอย่างจะเรียบร้อย"
 ep3_laamp_flavour_ewan.1051.b: "ยุติธรรม? เจ้าคือ [child.GetHouse.GetNameNoTooltip]! ยืนตัวตรง!"
 ep3_laamp_flavour_ewan.1051.c: "ข้ารู้ แต่มันก็เป็น เช่นนี้"
 ep3_laamp_flavour_ewan.1051.d: "ปล่อย [child.GetHerHim] ไว้กับอาการอาละวาดของ [child.GetHerHis]"
 ep3_laamp_flavour_ewan.1051.d.tt.annoyance_fades: "ความรำคาญของ [child.GetHerHis|U] จางหายไปตามกาลเวลา"
 ep3_laamp_flavour_ewan.1051.d.tt.grudge_held: "[child.GetFirstNameNoTooltip] เก็บความแค้นไว้"

 ep3_laamp_flavour_ewan.1061.t: "เรียนรู้เร็ว"
 ep3_laamp_flavour_ewan.1061.desc: "ดูเหมือนว่าเวลาของเราใน [current_county.GetBaseNameNoTier] จะเป็นประโยชน์ต่อ [child.Custom('GetDaughterSon')] [child.GetFirstName] ของข้า\n\nบางอย่างเกี่ยวกับวัฒนธรรมท้องถิ่น ทำให้ [child.GetHerHim] #EMP หลงใหล#! อย่างยิ่ง มากเสียจนในช่วงเวลาสั้นๆ ที่เราอยู่ที่นี่ [child.GetSheHe] สามารถเรียนรู้ภาษา [current_county.GetProvince.GetCulture.GetLanguage.GetName] ได้ในระดับที่พอใช้ ซึ่งเป็นความสำเร็จที่ [child.Custom('GetLassLad')] กำลังป่าวประกาศไปทั่วโดยการพูดภาษานั้นรอบค่ายตลอดเวลา แม้กระทั่งแทรกคำและวลีเล็กๆ น้อยๆ เข้าไปในการสนทนากับผู้ที่ด้อยกว่า [child.GetHerHis]\n\nพฤติกรรมที่อวดดีแน่นอน แต่บางทีอาจมีเหตุผลที่ดี"
 ep3_laamp_flavour_ewan.1061.a: "อืมม์ [child.Custom('GirlBoy')] ที่ฉลาด"
 ep3_laamp_flavour_ewan.1061.b: "บางที [child.GetSheHe] อาจจะสอนข้าได้ด้วย..."
 ep3_laamp_flavour_ewan.1061.b.tt.success: "ท่านเรียนภาษาด้วยกัน"
 ep3_laamp_flavour_ewan.1061.b.tt.failure: "ท่านพยายามและท่านล้มเหลว"
 ep3_laamp_flavour_ewan.1061.c: "เอาภาษาต่างชาติสกปรกนั่นออกจากปากเจ้าไป!"

 ep3_laamp_flavour_ewan.1071.t: "ที่ขอบค่าย"
 ep3_laamp_flavour_ewan.1071.desc.intro: "เส้นทางกลับของข้าจาก [ROOT.Char.Custom('GetRandomCampBuilding')] พาข้าเข้าใกล้ขอบค่าย ที่ ซึ่งเสียงตะโกนและเสียงกรีดร้องของเด็กๆ ที่กำลังเล่นกันดึงดูดความสนใจของข้า\n\n[own_child.Custom('GetDaughterSon')] [own_child.GetFirstName] ของข้ากำลังนำเด็กคนอื่นๆ อีกหลายคนใน"
 ep3_laamp_flavour_ewan.1071.desc.plains: "การโจมตีของทหารม้าจำลองข้ามพื้นดินที่ราบเรียบ ฟาดกิ่งไม้เล็กๆ ใส่ศัตรูในจินตนาการขณะที่พวกเขาส่งศัตรูที่ไม่มีตัวตนหนีกระเจิงไปด้วยความกลัว"
 ep3_laamp_flavour_ewan.1071.desc.farmlands: "การปีนต้นไม้โดดเดี่ยวที่บิดเบี้ยว ซึ่งยืนคดเคี้ยวอยู่กลางทุ่งนา เด็กโตปีนขึ้นไปได้ไกลกว่ามาก ในขณะที่เด็กเล็กๆ อ้อยอิ่งอยู่รอบๆ โคนต้น"
 ep3_laamp_flavour_ewan.1071.desc.hills: "การกลิ้งตัวอย่างดุเดือด หัวชนท้าย ลงมาจากเนินเขาที่ปกคลุมด้วยหญ้า ดูเหมือนจะไม่มีทักษะอะไรเกี่ยวข้องมากนัก แต่เด็กๆ ก็ยังแข่งขันกันว่าใครจะไปได้เร็วที่สุด"
 ep3_laamp_flavour_ewan.1071.desc.mountains: "การขว้างก้อนหินเล็กๆ ออกจากสันเขา ดูว่าพวกเขาสามารถขว้างขีปนาวุธเล็กๆ ของพวกเขาออกไปไกลแค่ไหนในหุบเขาเบื้องล่าง พวกเขาโห่ร้องเมื่อก้อนหนึ่งไปได้ไกลกว่าก้อนอื่นๆ และหัวเราะคิกคักกับก้อนที่กระเด็นไปหยุดในที่ที่ยังมองเห็นได้"
 ep3_laamp_flavour_ewan.1071.desc.desert: "การทิ้งตัวลงมาจากเนินทรายสูง ส่งผลให้ทรายกระจายไปทุกหนทุกแห่ง เสียงหัวเราะคิกคักและเสียงถ่มน้ำลาย #EMP พุท#! #EMP พุท#! ตามมาเมื่อใดก็ตามที่เด็กคนหนึ่งมีทรายเข้าปาก ซึ่งเกิดขึ้นบ่อยครั้ง"
 ep3_laamp_flavour_ewan.1071.desc.desert_mountains: "$ep3_laamp_flavour_ewan.1071.desc.mountains$"
 ep3_laamp_flavour_ewan.1071.desc.oasis: "การสร้าง... ห่อทรายเล็กๆ โดยใช้ใบไม้และหญ้า? ไม่ชัดเจนว่าสิ่งเหล่านั้นจะใช้ทำอะไร— เด็กอีกคนคลานข้ามเนินทรายใกล้ๆ และทันใดนั้นถุงทรายจำนวนมากก็ถูกขว้างออกไปเหมือนหม้อไฟ"
 ep3_laamp_flavour_ewan.1071.desc.jungle: "การใช้กิ่งไม้แหย่งูตาย สัตว์ตัวนั้นตายอย่างเห็นได้ชัด หัวของมันถูกฉีกขาดอย่างน่าสยดสยองโดยนักล่าอื่น แต่เด็กๆ ก็สนุกสนานไม่รู้จบกับการพยายามยกศพที่อ่อนปวกเปียกของมันด้วยไม้ของพวกเขา เพียง เพื่อให้มันทรุดตัวลงอีกครั้ง"
 ep3_laamp_flavour_ewan.1071.desc.forest: "การป้องกันกิ่งไม้ด้านบนของต้นไม้จากเด็กหลายคนที่พยายามปีนขึ้นมาจากด้านล่าง เมื่อเด็กที่อยู่บนพื้นเริ่มได้ที่ยึด เด็กที่อยู่บนอากาศก็ขว้างกิ่งไม้ ใบไม้ และก้อนยางไม้ใส่พวกเขา"
 ep3_laamp_flavour_ewan.1071.desc.taiga: "$ep3_laamp_flavour_ewan.1071.desc.forest$"
 ep3_laamp_flavour_ewan.1071.desc.wetlands: "การสร้างเกาะชั่วคราว พวกเขาพบแผ่นดินโคลนแคบๆ ที่ยื่นออกมาล้อมรอบด้วยน้ำกร่อย และกำลังทำงานอย่างต่อเนื่องเพื่อตัดขาดมันออกจากส่วนที่เหลือของหนองบึงด้วยมือที่สกปรกและไม้ผุๆ"
 ep3_laamp_flavour_ewan.1071.desc.steppe: "สิ่งที่ดูเหมือนจะเป็นเกมทอยกระดูกข้อเท้าที่ค่อนข้างตึงเครียด ทุกครั้งที่โยน มีคนประกาศกฎใหม่ และที่เหลือก็โห่ร้องหรือเชียร์ว่าจะอนุมัติหรือไม่"
 ep3_laamp_flavour_ewan.1071.desc.floodplains: "การต่อสู้ด้วยก้อนโคลนที่ขว้างใส่กันอย่างตึงเครียดไม่แพ้การปะทะกันของอาวุธของผู้ใหญ่ แน่นอนว่าทั้งสองฝ่ายดูเหมือนจะเต็มใจที่จะสละชีวิตเพื่อ... สาเหตุอะไรก็ตามที่พวกเขากำลังต่อสู้กันอยู่"
 ep3_laamp_flavour_ewan.1071.desc.drylands: "เกมวิ่งไล่จับที่น่าตื่นเต้น เตะฝุ่นและกรีดร้องด้วยความดีใจหรือความโกรธเคืองเมื่อใดก็ตามที่พวกเขาถูกจับได้"
 ep3_laamp_flavour_ewan.1071.desc.outro: "\n\nครู่ต่อมา [own_child.GetFirstNameNoTooltip] [own_child.Custom('Saying_3p_AwareSight')] ข้า [own_child.Custom('GirlBoy')] ยิ้มให้ข้า เห็นได้ชัดว่ากำลังลังเลระหว่างการพาเพื่อนเล่นของ [own_child.GetHerHis] กลับไปที่ค่าย หรือออกไปสำรวจในป่าอีกเล็กน้อย"
 ep3_laamp_flavour_ewan.1071.tt.every_playing_child: "เด็กทุกคนที่กำลังเล่น"
 ep3_laamp_flavour_ewan.1071.a: "อยู่ในสายตา!"
 ep3_laamp_flavour_ewan.1071.b: "ไปเถอะ ไปสำรวจ"
 ep3_laamp_flavour_ewan.1071.c: "เด็กๆ ตื่นเต้นกับสิ่งที่ง่ายที่สุด..."

 ep3_laamp_flavour_ewan.1081.t: "เติบโตขึ้น"
 ep3_laamp_flavour_ewan.1081.desc: ""[ROOT.Char.GetMotherFather|U]" [child.Custom('GetDaughterSon')] [child.GetFirstName] ของข้าเริ่มต้นขณะที่ [child.GetSheHe] เดินตรงมาหาข้า "ข้าตัดสินใจแล้วว่า ในเมื่อตอนนี้ข้าเป็น [child.GetWomanMan] แล้ว ข้าจะมีกระโจมเป็นของตัวเอง ไม่ต้องแชร์กับใครอีกต่อไปสำหรับข้า!"\n\nเด็กหนุ่มยืนนิ่ง พูดจบแล้ว ท่าทางของ [child.GetHerHis] แสดงออกถึงการต่อต้านอย่างฉุนเฉียว เกือบจะโดยไม่สมัครใจ ข้าเลิกคิ้วขึ้นกับการแสดงออกที่ไม่ถูกกระตุ้นนี้\n\n"ข้าจะไม่ยอมในเรื่องนี้! ข้าเป็นผู้ใหญ่แล้ว และข้าต้องการให้ได้รับการปฏิบัติเหมือนผู้ใหญ่!""
 ep3_laamp_flavour_ewan.1081.a: "อืมม์ โอเค เจ้าเป็น [child.GetWomanMan] แล้วตอนนี้"
 ep3_laamp_flavour_ewan.1081.b: "เจ้าต้องการมัน? ก็จงหามันมา"
 ep3_laamp_flavour_ewan.1081.b.f: "ท่านตั้งความท้าทายให้ [child.Custom('GetDaughterSon')] ของท่าน ซึ่งกำหนดโดย [education_trait|E] ของท่าน"
 ep3_laamp_flavour_ewan.1081.b.tt.success: "[child.GetFirstNameNoTooltip] ได้รับชัยชนะ"
 ep3_laamp_flavour_ewan.1081.b.tt.failure: "[child.GetSheHe|U] ไม่สามารถ ทำให้ท่านประทับใจได้"
 ep3_laamp_flavour_ewan.1081.c: "บาห์ เจ้ายังเป็นเด็กจนกว่าข้าจะบอกเป็นอย่างอื่น"

 ep3_laamp_flavour_ewan.1091.t: "หน้าที่ของผู้ปกครองทุกคน"
 ep3_laamp_flavour_ewan.1091.desc: ""แล้วมันจะไม่โยนข้าทิ้งเหรอ?" [child.Custom('GetDaughterSon')] [child.GetFirstName] ของข้าถาม พยายาม — และล้มเหลว — ที่จะเก็บเสียงสั่นเครือจากเสียงของ [child.GetHerHis]\n\nข้ามองลงไปที่ม้าโพนี่ตัวเล็กที่ [child.GetSheHe] นั่งอยู่: ม้าฝึกหัดที่ง่ายที่สุดและสงบที่สุดที่ข้าหาได้ในค่ายทั้งหมด ข้ากลัวขนาดนี้ไหมตอนที่ [ROOT.Char.GetMotherFather] ของข้าสอนข้าขี่ม้า?\n\n"อ-โอเค งั้นข้าจะแค่เตะมันให้วิ่งเหยาะๆ และ...""
 ep3_laamp_flavour_ewan.1091.tt.success: "ข้าทำได้แล้ว [ROOT.Char.Custom('GetMumDad')] ข้าทำได้แล้ว!"
 ep3_laamp_flavour_ewan.1091.tt.failure: "ไม่-ไม่-ไม่-ไม่-ไม่!"
 ep3_laamp_flavour_ewan.1091.a: "จำไว้ จงหนักแน่น แต่ให้ความเคารพ"
 ep3_laamp_flavour_ewan.1091.b: "อย่ากลัวที่จะใช้แส้!"
 ep3_laamp_flavour_ewan.1091.c: "ควบคุมม้าให้ได้ มิฉะนั้นมันจะโยนเจ้าทิ้ง"
 ep3_laamp_flavour_ewan.1091.d: "ไม่ต้องพูดอะไร"
 ep3_laamp_flavour_ewan.1091.d.tt.success: "[child.GetSheHe|U] รับมือได้ดีพอสมควร"
 ep3_laamp_flavour_ewan.1091.d.tt.failure: "[child.GetFirstNameNoTooltip] ไม่สามารถจัดการได้หากไม่มีคำแนะนำ"
 ep3_laamp_flavour_ewan_1091_confidence_gained_modifier: "ได้รับความมั่นใจ"
 ep3_laamp_flavour_ewan_1091_confidence_gained_modifier_desc: "น่าทึ่งที่โลกเปิดกว้างขึ้นเมื่อท่านสามารถขี่ม้าได้"

 ep3_laamp_flavour_ewan.1101.t: "การช่วยเหลือ"
 ep3_laamp_flavour_ewan.1101.desc: "แม้ว่าค่ายจะต้องย้ายที่ตั้งทุกๆ สองสามคืน แต่ก็มีการเดินทางบางครั้งที่ต้องใช้เวลาเดินทางนานกว่า — และมาพร้อมกับการเก็บของที่มากกว่าอย่างแน่นอน\n\nเนื่องจากคนขนของส่วนใหญ่ของข้ากำลังจัดการกับผลพวงจากงานเลี้ยงเมื่อคืนที่ผ่านมา ข้าจึงต้องเก็บของส่วนตัวส่วนใหญ่เองเป็นการเปลี่ยนแปลง สถานการณ์ที่น่าเศร้า และเป็นสิ่งที่ ทำให้ข้าถอนหายใจไปแล้วหลายครั้ง\n\nการดึงแขนเสื้ออย่างกะทันหัน ทำให้ข้ารู้ถึงการปรากฏตัวของ [child.Custom('GetDaughterSon')] [child.GetFirstName] หนุ่มสาวของข้า กำลังถือเสื้อคลุมที่ยับยู่ยี่ในความพยายามที่ไม่ดีนักที่จะช่วยข้า"
 ep3_laamp_flavour_ewan.1101.a: "เจ้ากำลังทำอะไรอยู่ตรงนั้น [child.Custom('GetLassLad')] น้อย?"
 ep3_laamp_flavour_ewan.1101.b: "ชิ่วไป เจ้าตัวป่วน!"

 ep3_laamp_flavour_ewan.1103.t: "$ep3_laamp_flavour_ewan.1101.t$: พิธีกรรมส่วนตัว"
 ep3_laamp_flavour_ewan.1103.desc.child_younger: "ด้วยการย้ายอีกครั้งในวันพรุ่งนี้และคนขนของของข้าก็ยังคงยุ่งอยู่ ข้าเข้าไปในห้องส่วนตัวของข้าเพื่อพบ [child.Custom('GetDaughterSon')] [child.GetFirstName] ของข้า ซึ่งเต็มไปด้วย [ROOT.Char.Custom('GritType')] จากการเล่นข้างนอก กำลังพยายามเก็บของให้ข้า\n\n"[child.Custom('GetMaMaPaPa')|U]!" [child.Custom('GirlBoy')] ยิ้มฟันหลอ วิ่งเข้ามาหาเพื่อกอด มือที่สกปรกข้างหนึ่งถือหมวกใบโปรดของข้าที่ยับยู่ยี่และเสียหาย"
 ep3_laamp_flavour_ewan.1103.desc.child_older: "เมื่อเข้าไปในกระโจมของข้าก่อนการย้ายในวันพรุ่งนี้ ข้าไม่แปลกใจเลยที่พบว่า [child.Custom('GetDaughterSon')] [child.GetFirstName] ของข้าอยู่ที่นี่แล้ว\n\nข้างๆ [child.GetHerHim] บนเตียงของข้าคือเสื้อผ้าที่พับไว้และของใช้ส่วนตัวที่กองไว้อย่างหยาบๆ และ [child.GetSheHe] หันมาอย่างภาคภูมิใจเพื่อนำเสนอผลงานของ [child.GetHerHis] ให้ข้าดู\n\n"จัดทุกอย่างตามที่ท่านชอบแล้ว [child.Custom('GetMumDad')] เกือบครึ่งทางแล้ว!""
 ep3_laamp_flavour_ewan.1103.desc.child_teen: "แม้ว่า [child.GetSheHe] จะเกือบจะเป็น [child.GetWomanMan] แล้วตอนนี้ การเดินทางไกลหมายถึงการมาเยี่ยมตามปกติของ [child.Custom('GetDaughterSon')] [child.GetFirstName] ของข้าเพื่อช่วยเก็บของ\n\nอย่างน้อยครั้งนี้ ข้าก็มาถึงก่อน [child.GetHerHim] และได้เริ่มไปแล้วเมื่อวัยรุ่นมาถึง\n\n"ท่านน่าจะรอข้า!" [child.GetFirstNameNoTooltip] ครึ่งครวญครึ่งพูดตลก เสียงหัวเราะเยาะเย้ยของข้ากระตุ้นเสียงร้องด้วยความโกรธ และเสื้อผ้าที่พับไว้ชิ้นต่อไปก็ถูกโยนตรงมาที่หัวของข้าแทนที่จะเป็นตะกร้าของข้า"
 ep3_laamp_flavour_ewan.1103.desc.child_adult: "[child.Custom('GetDaughterSon')] [child.GetFirstName] ของข้ามุดเข้ามาในกระโจมของข้าเย็นนี้เพื่อพบว่าข้ากำลังเก็บของสำหรับการเดินทางในวันพรุ่งนี้แล้ว แม้ว่าจะเห็นได้ชัดว่าช้าลงเล็กน้อยสำหรับ [child.GetHerHim]\n\n[child.GetSheHe|U] ไม่พูดอะไรขณะที่ [child.GetSheHe] เคลื่อนเข้ามาช่วยข้าจัดของ เพียงแค่ยิ้มอย่างอ่อนโยนและฮัมเพลงที่คุ้นเคยขณะที่ [child.GetSheHe] ทำงาน\n\n"เจ้าไม่แก่เกินไปสำหรับเรื่องนี้แล้วเหรอ?" ข้าถาม\n\n"ท่านไม่เคยแก่เกินไปที่จะช่วย [ROOT.Char.GetWomanMan] แก่ๆ ที่ต้องการความช่วยเหลือหรอกน่า" [child.GetFirstNameNoTooltip] พูดสวนกลับ"
 ep3_laamp_flavour_ewan.1103.a: "เอ่อ ขอบคุณ [child.GetFirstNameNoTooltip] ตอนนี้ไปทำความสะอาดซะ"
 ep3_laamp_flavour_ewan.1103.b: "ขยี้ผมของ [child.GetHerHis]"
 ep3_laamp_flavour_ewan.1103.c: "ช่วยเหลือดีเหมือนเคย!"
 ep3_laamp_flavour_ewan.1103.d: "หัวเราะและกอด [child.GetFirstNameNoTooltip]"
 ep3_laamp_flavour_ewan.1103.e: "เจ้าควรหยุดทำ เช่นนี้ [child.GetFirstNameNoTooltip]"

 ep3_laamp_flavour_ewan.1104.t: "$ep3_laamp_flavour_ewan.1101.t$: การหายไปเล็กๆ น้อยๆ"
 ep3_laamp_flavour_ewan.1104.desc.child_dead: "การย้ายในตอนเช้าดูเหมือนจะ... น่าเบื่อหน่ายมากขึ้น มีน้ำหนักที่ไม่อาจนิยามได้ การหายไปที่นั่น ซึ่งข้าไม่สามารถระบุได้ในตอนแรกขณะที่ข้าค่อยๆ เก็บของ\n\nมันกระทบข้าเหมือนถังน้ำเย็นจัด\n\n[child.GetFirstName|U] [child.GetSheHe|U] ไม่ได้อยู่ที่นี่ ไม่ได้ช่วยข้า [child.GetSheHe|U] จะไม่มีวันทำอีกแล้ว"
 ep3_laamp_flavour_ewan.1104.desc.child_rival: "มันไม่ใช่งานที่ยากลำบาก การต้องเก็บของของตัวเองสำหรับการย้ายในวันพรุ่งนี้ แต่เสียงถอนหายใจอย่างเศร้าสร้อยก็หลุดออกมาจากริมฝีปากของข้าอยู่ดี\n\nการทำ เช่นนี้ ทำให้ข้านึกถึง [child.Custom('GetDaughterSon')] [child.GetFirstName] ของข้า นึกถึงช่วงเวลาที่มีความสุขกว่าเมื่อ [child.Custom('GirlBoy')] ยังเด็กและไม่ต้องการอะไรมากไปกว่าการใช้เวลากับ [child.Custom('GetMaPa')] ของ [child.GetHerHis]\n\nย้อนกลับไปเมื่อ [child.GetSheHe] ยังคงพูดกับข้า ยังคงยิ้มให้ข้า\n\nรอยยิ้มฟันหลอน้อยๆ นั่น..."
 ep3_laamp_flavour_ewan.1104.a: "ข้าทำอะไรลงไป..."
 ep3_laamp_flavour_ewan.1104.b: "ข้าจะล้างแค้น!"
 ep3_laamp_flavour_ewan.1104.c: "#EMP เอ๊ะ.#!"
 ep3_laamp_flavour_ewan.1104.d: "พยายามก้าวต่อไป"

 ep3_laamp_flavour_ewan.1111.t: "จมูกไวต่อปัญหา"
 ep3_laamp_flavour_ewan.1111.desc.intro: ""[ROOT.Char.GetMotherFather|U]!" [child.Custom('GetDaughterSon')] [child.GetFirstName] ของข้าร้องเรียก วิ่งเข้ามาหาข้าด้วยความเร็วและเกือบจะชนข้าล้ม "ดูสิว่าข้าเจออะไร! มันคือลูกหมา!"\n\n[child.Custom('GirlBoy')] ดูเหมือนจะกำลังแกว่งลูกหมาที่เพิ่งคลอด ซึ่ง [child.GetSheHe] หนีบไว้ในแขนของ [child.GetHerHis] อย่างแท้จริง\n\n""
 ep3_laamp_flavour_ewan.1111.desc.has_kennels: "มันไม่ใช่หนึ่งในสุนัขล่าเนื้อจากคอกสุนัขอย่างแน่นอน และ,"
 ep3_laamp_flavour_ewan.1111.desc.no_kennels: "[ROOT.Char.GetFaith.KnowledgeGodName] เท่านั้นที่รู้ว่า [child.GetSheHe] ไปเก็บมันมาจากไหน แต่,"
 ep3_laamp_flavour_ewan.1111.desc.outro: "แม้จะเคลื่อนไหวอย่างงุ่มง่าม สัตว์ตัวนั้นดูตื่นเต้นมากที่ได้มาอยู่ที่นี่ [child.GetFirstNameNoTooltip] ดูมีความสุขกว่าที่ข้าเคยเห็น [child.GetHerHim] มาหลายสัปดาห์"
 ep3_laamp_flavour_ewan.1111.a: "[child.Custom('GirlBoy')] และสุนัขของ [child.GetHerHis]"
 ep3_laamp_flavour_ewan.1111.b: "จับลูกหมากดน้ำ"
 ep3_laamp_flavour_ewan.1111.c: "#EMP แม่เจ้า#! ช่างเป็นหมาที่อ้วนท้วนเสียนี่กระไร หาเจอได้ดี [child.Custom('GetLassLad')]!"
 ep3_laamp_flavour_ewan.1111.d: "[child.GetFirstNameNoTooltip]! หยุดเล่นกับหมาสกปรกตัวนั้น!"

 ##################################################
 # PERSONAL TENSIONS

 ep3_laamp_flavour_ewan.2001.t: "มีอะไรเหมือนกันมากมาย"
 ep3_laamp_flavour_ewan.2001.desc.intro: "ชีวิตในที่แคบมักจะขยายความสัมพันธ์ ทั้งดีและร้าย\n\nโชคดีสำหรับ [follower_1.GetFirstName] และ [follower_2.GetFirstName] ความสนใจร่วมกันของพวกเขาใน"
 ep3_laamp_flavour_ewan.2001.desc.lustful: "เรื่องตลกหยาบโลนและความคิดเห็นที่เต็มไปด้วยตัณหา"
 ep3_laamp_flavour_ewan.2001.desc.chaste: "การยับยั้งชั่งใจทางกายและการรักษาพรหมจรรย์ในที่สาธารณะ"
 ep3_laamp_flavour_ewan.2001.desc.gluttonous: "อาหารที่ดีและเครื่องดื่มที่ดีกว่า"
 ep3_laamp_flavour_ewan.2001.desc.temperate: "อาหารที่จำกัดและชีวิตที่มีสุขภาพดี"
 ep3_laamp_flavour_ewan.2001.desc.greedy: "ทองคำ เงิน และการได้มา ซึ่งความมั่งคั่ง"
 ep3_laamp_flavour_ewan.2001.desc.generous: "ประโยชน์ของจิตใจที่เอื้อเฟื้อเผื่อแผ่และชีวิตที่ไม่เห็นแก่ตัว"
 ep3_laamp_flavour_ewan.2001.desc.lazy: "ความชั่วร้ายของการทำงานหนักและประโยชน์ของการงีบหลับที่ดี"
 ep3_laamp_flavour_ewan.2001.desc.diligent: "การตื่น แต่เช้าและการทำงานหนักด้วยความทุ่มเท"
 ep3_laamp_flavour_ewan.2001.desc.wrathful: "ความรุนแรงและศิลปะแห่งการตะโกน"
 ep3_laamp_flavour_ewan.2001.desc.calm: "การรักษาท่าทีที่แข็งกร้าวและเยือกเย็นเมื่อเผชิญกับความทุกข์ยาก"
 ep3_laamp_flavour_ewan.2001.desc.patient: "การรับฟัง ซึ่งกันและกันและการรอคอยโอกาสที่เหมาะสม"
 ep3_laamp_flavour_ewan.2001.desc.impatient: "การตีเหล็กเมื่อร้อนเสมอ"
 ep3_laamp_flavour_ewan.2001.desc.arrogant: "ความเหนือกว่าที่ถูกกล่าวหาของพวกเขาเอง"
 ep3_laamp_flavour_ewan.2001.desc.humble: "ประโยชน์ของทัศนคติที่ถ่อมตนและมุมมองที่อ่อนน้อม"
 ep3_laamp_flavour_ewan.2001.desc.deceitful: "การโกหกที่โอ้อวดมากขึ้นเรื่อยๆ"
 ep3_laamp_flavour_ewan.2001.desc.honest: "การหลีกเลี่ยงอันตรายของการโกหกในทุกกรณี"
 ep3_laamp_flavour_ewan.2001.desc.craven: "การมีชีวิตอยู่เพื่อต่อสู้อีกวัน ไม่ว่าจะเกิดอะไรขึ้น"
 ep3_laamp_flavour_ewan.2001.desc.brave: "การเผชิญหน้ากับความท้าทาย — และผู้ท้าชิง — อย่างตรงไปตรงมาไม่ว่าความเสี่ยงจะเป็นอย่างไร"
 ep3_laamp_flavour_ewan.2001.desc.shy: "การหลีกเลี่ยงสถานการณ์ทางสังคมที่เสียงดังและเพลิดเพลินกับความเงียบ"
 ep3_laamp_flavour_ewan.2001.desc.gregarious: "เสียงอึกทึกครึกโครมและเสียงหัวเราะคิกคักอย่างต่อเนื่องของผู้ที่เข้าสังคมอย่างไม่หยุดหย่อน"
 ep3_laamp_flavour_ewan.2001.desc.ambitious: "ผลประโยชน์ในอนาคตและแผนการที่ซับซ้อน"
 ep3_laamp_flavour_ewan.2001.desc.content: "การมีความสุขกับชีวิตที่ต่ำต้อยของพวกเขา"
 ep3_laamp_flavour_ewan.2001.desc.arbitrary: "การไม่สนใจกฎและข้อบังคับที่ไม่สะดวกสำหรับพวกเขา"
 ep3_laamp_flavour_ewan.2001.desc.just: "การเชื่อฟังกฎหมายที่ได้รับการ แต่งตั้งอย่างถูกต้องของแผ่นดิน แท้จริงแล้วคือแผ่นดินใดๆ"
 ep3_laamp_flavour_ewan.2001.desc.cynical: "มุมมองต่อชีวิตที่เน้นทางโลกอย่างชัดเจน"
 ep3_laamp_flavour_ewan.2001.desc.zealous: "การอุทิศตนอย่างสมบูรณ์ต่อ [follower_1.GetFaith.HighGodName]"
 ep3_laamp_flavour_ewan.2001.desc.paranoid: "การป้องกันไม่ให้แผนการมากมายของศัตรูบรรลุผล"
 ep3_laamp_flavour_ewan.2001.desc.trusting: "การหลีกเลี่ยงความซับซ้อนทั้งหมดของการวางแผนและความสงสัย"
 ep3_laamp_flavour_ewan.2001.desc.compassionate: "การยังคงห่วงใยและเห็นอกเห็นใจภายใต้สถานการณ์ใดๆ"
 ep3_laamp_flavour_ewan.2001.desc.callous: "การปฏิบัติต่อผู้อื่นอย่างหยาบกระด้างเท่าที่พวกเขารู้สึกว่าชีวิตปฏิบัติต่อพวกเขา"
 ep3_laamp_flavour_ewan.2001.desc.sadistic: "อารมณ์ขันที่มุ่งร้ายและด้านมืดของชีวิต"
 ep3_laamp_flavour_ewan.2001.desc.stubborn: "การยืนหยัดอย่างทรหดในทุกกรณี"
 ep3_laamp_flavour_ewan.2001.desc.fickle: "การมีความคิดเห็นที่แกว่งไปมาอย่างรุนแรงใน แต่ละวัน"
 ep3_laamp_flavour_ewan.2001.desc.vengeful: "การยึดติดกับความแค้นทุกอย่างที่ ทำให้พวกเขาทุกข์ทรมาน"
 ep3_laamp_flavour_ewan.2001.desc.forgiving: "การปล่อยวางความเกลียดชังและให้อภัยผู้ที่ล่วงเกินพวกเขา"
 ep3_laamp_flavour_ewan.2001.desc.eccentric: "สิ่งที่แปลกประหลาด สิ่งที่ผิดปกติ และสิ่งที่ประหลาดอย่างแท้จริง"
 ep3_laamp_flavour_ewan.2001.desc.outro: "ได้พิสูจน์แล้วว่าเป็นตัวประสานที่แข็งแกร่ง\n\nทั้งสองหัวเราะและพูดตลกด้วยกันที่ค่ายและขี่ม้าเคียงข้างกันบนท้องถนนกำลังกลายเป็นภาพที่เห็นได้บ่อยขึ้น"
 ep3_laamp_flavour_ewan.2001.a: "ส่งเสริมมิตรภาพ"
 ep3_laamp_flavour_ewan.2001.a.tt.success: "มิตรภาพเบ่งบาน"
 ep3_laamp_flavour_ewan.2001.a.tt.failure: "ผู้นำที่เอา แต่ใจ"
 ep3_laamp_flavour_ewan.2001.b: "พยายามแยกพวกเขาออกจากกัน"
 ep3_laamp_flavour_ewan.2001.b.tt.success: "มิตรภาพที่ถูกทำลาย"
 ep3_laamp_flavour_ewan.2001.b.tt.failure: "$ep3_laamp_flavour_ewan.2001.a.tt.failure$"
 ep3_laamp_flavour_ewan.2001.c: "ดีสำหรับพวกเขา!"

 ep3_laamp_flavour_ewan.2011.t: "ข่าวลือในค่าย"
 ep3_laamp_flavour_ewan.2011.desc.intro: "ไม่ใช่เรื่องแปลกที่จะได้ยินข่าวลือแพร่สะพัดไปทั่วค่ายนี้ — หรือค่ายใดๆ ก็ตาม ความคิดลามกและเสียงกระซิบเรื่องอื้อฉาวสามารถผ่านพ้นค่ำคืนอันยาวนานไปได้ ท้ายที่สุดแล้ว บางครั้งพวกมันก็เป็นเรื่องจริง\n\nสัปดาห์นี้"
 ep3_laamp_flavour_ewan.2011.desc.affair: "เกี่ยวกับเรื่องชู้สาวที่ถูกกล่าวหาบางประเภท แม้ว่า #EMP ใคร#! ที่เป็นคู่รักนอกใจนั้นเป็นเรื่องของการถกเถียงกึ่งวิชาการและการเยาะเย้ยอย่างอึกทึกเป็นครั้งคราว"
 ep3_laamp_flavour_ewan.2011.desc.petty_theft: "เกี่ยวข้องกับ [victim.GetFirstName] ซึ่งถูกกล่าวหาว่าทำเงินจำนวนเล็กน้อยหายไปหลายครั้งในช่วงหลัง อย่างน้อยมีคนไม่กี่คนที่อ้างว่าเห็นร่างหนึ่งซุ่มซ่อนอยู่ใกล้กระโจมของ [victim.GetHerHis] โดยจงใจมุ่งเป้าไปที่ [victim.GetWomanMan]"
 ep3_laamp_flavour_ewan.2011.desc.cruel_pranks: "เกี่ยวข้องกับโชคร้ายที่เลวร้ายเป็นพิเศษสำหรับ [victim.GetFirstName] อุบัติเหตุที่โชคร้าย น่ารังเกียจ หรือน่าอับอายยังคง #EMP เกิดขึ้น#! กับ [victim.GetWomanMan] และวงในกล่าวว่าอาจเป็นการกระทำโดยเจตนา"
 ep3_laamp_flavour_ewan.2011.desc.nasty_rumours: "เป็นเรื่องที่ขัดแย้งกัน: มีการพูดคุยกันมากมายเกี่ยวกับนิสัยที่ไม่น่าพอใจของ [victim.GetFirstName] แต่หลายคนอ้างว่าได้กลิ่นไม่ดี โต้แย้งว่า [victim.GetSheHe] เป็นเพียงเหยื่อของการรณรงค์ใส่ร้าย"
 ep3_laamp_flavour_ewan.2011.desc.hidden_feud: "ชี้ให้เห็นว่าคนสองคนในหมู่พวกเรากำลังทำสงครามส่วนตัวต่อกัน แต่ทั้งคู่เก็บเป็นความลับเพื่อป้องกันไม่ให้ความไร้วินัยของพวกเขาถูกค้นพบและลงโทษ"
 ep3_laamp_flavour_ewan.2011.desc.outro: "\n\nไม่ใช่เรื่องดีที่ผู้คนจะพูดพล่ามเพื่อความบันเทิงเท่านั้น แต่แล้ว ข่าวซุบซิบก็ไม่ค่อยเป็น เช่นนั้น"
 ep3_laamp_flavour_ewan.2011.a: "สืบหาความจริงของเรื่องนี้"
 ep3_laamp_flavour_ewan.2011.a.tt.explanation: "หากข่าวลือไม่เป็นความจริง ท่านจะไม่พบอะไรเลย แม้ว่าจะประสบความสำเร็จก็ตาม"
 ep3_laamp_flavour_ewan.2011.a.tt.success: "ท่านติดตามเรื่องนี้ได้สำเร็จ"
 ep3_laamp_flavour_ewan.2011.a.tt.failure: "ใครจะบอกได้ว่าอะไรคือความจริง?"
 ep3_laamp_flavour_ewan.2011.b: "เห็นด้วยกับข้อกล่าวหาอย่างไร้เหตุผล"
 ep3_laamp_flavour_ewan.2011.c: "ปล่อยไว้ตามเดิม"
 ep3_laamp_flavour_ewan_2011_source_of_truth_modifier: "แหล่งที่มาของความจริง"
 ep3_laamp_flavour_ewan_2011_source_of_truth_modifier_desc: "หากตัวละครผู้รับผิดชอบกล่าว เช่นนั้น ก็ต้องเป็นความจริง"
 ep3_laamp_flavour_ewan_2011_truth_hound_modifier: "นักล่าความจริง"
 ep3_laamp_flavour_ewan_2011_truth_hound_modifier_desc: "ตัวละครนี้เป็นที่รู้จักในการติดตามข่าวลือไปจนถึงบทสรุปตามธรรมชาติ"

 ep3_laamp_flavour_ewan.2012.t: "$ep3_laamp_flavour_ewan.2011.t$: คู่รักลับ"
 ep3_laamp_flavour_ewan.2012.desc: "การสืบสวนอย่างมีทักษะโดยนักสืบผู้มีความสามารถจะบังเกิดผลเสมอ\n\nเมื่อพบ [lover_1.GetFirstName] และ [lover_2.GetFirstName] กอดกันอย่าง #EMP สนิทสนม#! ในเงามืดหลัง [ROOT.Char.Custom('GetRandomCampBuilding')] ข้าสามารถอยู่ได้เพียงครู่เดียวก่อนที่ทั้งสองจะจำการปรากฏตัวของข้าได้และรีบจัดเสื้อผ้าให้เรียบร้อย\n\n"[ROOT.Char.GetTitledFirstNameNoTooltip] โปรดเถิด ข้าขอร้องท่าน" [lover.GetFirstNameNoTooltip] ร้องกระซิบ "อย่าเปิดเผยพวกเราต่อค่าย — คนอื่นๆ จะไม่เข้าใจ""
 ep3_laamp_flavour_ewan.2012.a: "เปิดเผยทันที"
 ep3_laamp_flavour_ewan.2012.b: "เก็บความลับไว้ — สำหรับตอนนี้"

 ep3_laamp_flavour_ewan.2013.t: "$ep3_laamp_flavour_ewan.2011.t$: การลักเล็กขโมยน้อย"
 ep3_laamp_flavour_ewan.2013.desc: "กับดักง่าย ๆ ก็เพียงพอที่จะจับ [thief.GetFirstName] ได้คาหนังคาเขา — ให้ [victim.GetFirstName] ออกจากเต็นท์ของ [victim.GetHerHis] อย่างเห็นได้ชัด ทางเข้าเปิดทิ้งไว้ เหรียญกองไว้อย่างเรียบร้อยบนเก้าอี้ข้างใน\n\nหลังจากผ่านไปหนึ่งนาที เพื่อให้แน่ใจว่า [victim.GetFirstNameNoTooltip] จะไม่กลับมาทันที โจรก็ย่องออกมาจากที่ซ่อนของ [thief.GetHerHis] ในบริเวณใกล้เคียง เพียงเพื่อหันกลับมาพบข้ายืนอยู่ที่นั่น กอด [ROOT.Char.Custom('ArmArms')]\n\n"ข- ข้าสาบานว่ามันไม่ใช่สิ่งที่เห็น! ข้าแค่ล้อเล่นกับ [victim.GetFirstNameNoTooltip] เท่านั้น!" [thief.GetSheHe] ร้องไห้ เสียงเยาะเย้ยที่ได้ยินจาก [victim.GetFirstNameNoTooltip] ที่กลับมาบ่งชี้ว่า [victim.GetSheHe] ไม่ค่อยเห็นความตลกขบขันเท่าใดนัก"
 ep3_laamp_flavour_ewan.2013.a: "ลงโทษ [thief.GetFirstNameNoTooltip]"
 ep3_laamp_flavour_ewan.2013.b: "ปกป้อง [thief.GetFirstNameNoTooltip]"
 ep3_laamp_flavour_ewan.2013.c: "ให้ความจริงเป็นที่ประจักษ์ แต่ปล่อยไว้แค่นั้น"

 ep3_laamp_flavour_ewan.2014.t: "$ep3_laamp_flavour_ewan.2011.t$: การแกล้งที่โหดร้าย"
 ep3_laamp_flavour_ewan.2014.desc: "ด้วยการสอบสวนเพียงเล็กน้อย [prankster.GetFirstName] ก็แสดงตัวเป็นผู้กระทำผิดที่ชัดเจนที่สุด — มีคนเห็น [prankster.GetSheHe] อยู่ใกล้ๆ ก่อน หลัง หรือระหว่าง #EMP อุบัติเหตุ#! ที่น่าสังเกตเกือบทั้งหมด โดยทั่วไปแล้วไม่มีเหตุผลอะไรมากนัก\n\n"ใช่ ข้าเล่นตลกกับ [victim.GetFirstName] ไปบ้าง มันผิดมากเหรอ? [victim.GetSheHe|U] เป็นคนที่น่าสังเวชที่จะอยู่ด้วย และจากการตรวจสอบครั้งล่าสุด การเล่นตลกแปลกๆ ไม่ใช่สาเหตุที่จะ ทำให้ใครบางคนกลายเป็นคนนอกกฎหมาย""
 ep3_laamp_flavour_ewan.2014.a: "ลงโทษ [prankster.GetFirstNameNoTooltip]"
 ep3_laamp_flavour_ewan.2014.b: "ปกป้อง [prankster.GetFirstNameNoTooltip]"
 ep3_laamp_flavour_ewan.2014.c: "ให้ความจริงเป็นที่ประจักษ์ แต่ปล่อยไว้แค่นั้น"

 ep3_laamp_flavour_ewan.2015.t: "$ep3_laamp_flavour_ewan.2011.t$: นักปล่อยข่าวลือ"
 ep3_laamp_flavour_ewan.2015.desc: "ไม่นานนัก ข้าก็สามารถชี้ตัว [rumourmonger.GetFirstName] ได้อย่างง่ายดาย และเมื่อถูกเผชิญหน้า [rumourmonger.GetSheHe] ก็ยอมรับอย่างง่ายดายโดยไม่สำนึกผิด\n\n"แล้วจะทำไมถ้าข้าจะพูดเกินจริงสักเรื่องสองเรื่องเกี่ยวกับเจ้า [victim.Custom2('InsultNoun', SCOPE.sC('rumourmonger'))] จอมโอ้อวดนั่น [victim.GetSheHe|U] เป็นทั้งคนโง่และคนเลว และไม่มีคำโกหกใดเกี่ยวกับ [victim.GetHerHim] ที่เลวร้ายไปกว่าความจริงอีกแล้ว"\n\n[victim.GetFirstName] ผู้โกรธจัด ยืนหัวฟัดหัวเหวี่ยงอยู่ข้างหลังข้า เกือบจะพร้อมบีบคอ [rumourmonger.GetWomanMan] ผู้นั้น"
 ep3_laamp_flavour_ewan.2015.a: "ลงโทษ [rumourmonger.GetFirstNameNoTooltip]"
 ep3_laamp_flavour_ewan.2015.b: "ปกป้อง [rumourmonger.GetFirstNameNoTooltip]"
 ep3_laamp_flavour_ewan.2015.c: "ให้ความจริงเป็นที่ประจักษ์ แต่ปล่อยไว้แค่นั้น"

 ep3_laamp_flavour_ewan.2016.t: "$ep3_laamp_flavour_ewan.2011.t$: ความบาดหมางที่ซ่อนเร้น"
 ep3_laamp_flavour_ewan.2016.desc: "เมื่อมองย้อนกลับไป บางทีมันควรจะชัดเจนว่า [rival_1.GetFirstName] และ [rival_2.GetFirstName] กำลังขัดแย้งกันอย่างรุนแรง\n\nเมื่อท่านมองหาสัญญาณเหล่านั้น สัญญาณของความเป็นปรปักษ์ระหว่างทั้งสองก็ชัดเจนราวกับกลางวัน แม้ว่าเมื่อถูกเรียกตัวมาสอบสวน พวกเขาทั้งคู่ #EMP ยืนกราน#! ว่าพวกเขาไม่ได้ปล่อยให้มันส่งผลกระทบต่อค่ายในวงกว้าง\n\nในที่พักที่ใกล้ชิด เช่นนี้ เรื่องราวฟังดู #EMP ไม่น่าเป็นไปได้#!"
 ep3_laamp_flavour_ewan.2016.a: "พยายามประนีประนอมทั้งสอง"
 ep3_laamp_flavour_ewan.2016.a.tt.success: "ความตึงเครียดลดลง"
 ep3_laamp_flavour_ewan.2016.a.tt.failure: "มี แต่ ทำให้แย่ลง"
 ep3_laamp_flavour_ewan.2016.b: "เจ้าจะไม่ยอมให้เรื่องนี้บานปลาย เข้าใจไหม?"

 ep3_laamp_flavour_ewan.2017.t: "$ep3_laamp_flavour_ewan.2011.t$: ไม่มีอะไรให้ดูที่นี่"
 ep3_laamp_flavour_ewan.2017.desc.affair: "สำหรับเรื่องเล่าสูงๆ เกี่ยวกับเรื่องชู้สาว การพบปะกันอย่างโรแมนติกใต้แสงจันทร์หลัง [ROOT.Char.Custom('GetRandomCampBuilding')] และการเหลือบมองอย่างลับๆ ล่อๆ ข้ามมื้อค่ำ ความรักใน [ROOT.Char.GetPrimaryTitle.GetDefinitiveName] ดูเหมือนจะ... เป็นไปตามแบบแผนอย่างชัดเจน"
 ep3_laamp_flavour_ewan.2017.desc.petty_theft: "แม้ว่า [victim.GetFirstNamePossessive] จะร้องโวยวาย แต่ก็ไม่มีพยานที่น่าเชื่อถือคนใดสามารถระบุลักษณะร่วมกันของบุคคลลึกลับที่ถูกกล่าวหาว่าปล้น [victim.GetHerHim] จนหมดตัวได้ และแม้ แต่ [victim.GetSheHe] ก็ยังลำบากในการนับความสูญเสียของ [victim.GetHerHis]"
 ep3_laamp_flavour_ewan.2017.desc.cruel_pranks: "ข้าถูกบังคับให้สรุปว่า [victim.GetFirstName] เป็นเพียงคนซุ่มซ่าม โชคร้าย หรือทั้งสองอย่าง ไม่มีเหตุผลหรือเหตุผลร่วมกันสำหรับปัญหาเล็กๆ น้อยๆ มากมายของ [victim.GetHerHis] และไม่มีผู้ต้องสงสัยที่ชัดเจนที่สามารถจัดการทั้งหมดได้"
 ep3_laamp_flavour_ewan.2017.desc.nasty_rumours: "[victim.GetFirstName|U] อาจเป็นองค์ประกอบที่เป็นปัญหาในท้ายที่สุด เบาะแสทุกอย่างเกี่ยวกับผู้ที่อาจต้องการทำร้าย [victim.GetHerHim] หายไปเมื่อตรวจสอบอย่างใกล้ชิด ในขณะที่เรื่องราวเกี่ยวกับความผิดของ [victim.GetHerHis] มี แต่จะเพิ่มมากขึ้น"
 ep3_laamp_flavour_ewan.2017.desc.hidden_feud: "ความขัดแย้งลับ? ความคิดที่ว่าคนสองคนที่นี่สามารถเก็บความโกรธไว้ได้ในมื้อค่ำ ไม่ต้องพูดถึงการเก็บเป็นความลับ ในขณะที่สร้างความไม่สะดวกให้กันและกันนั้น เป็นเรื่องที่น่าหัวเราะอย่างยิ่ง ไม่ใช่กับขบวนตัวตลกที่ข้าเดินทางไปด้วย"
 ep3_laamp_flavour_ewan.2017.desc.duel.won: "\n\nการสืบสวนอย่างละเอียดของข้าไม่พบอะไรเลย แต่ข้าก็พอใจอยู่ดี หากมีอะไรให้ค้นหา ข้าคงพบมันไปแล้วตอนนี้"
 ep3_laamp_flavour_ewan.2017.desc.duel.lost: "\n\nข้าทำดีที่สุดแล้ว แต่ทั้งหมดที่ข้าค้นพบคือข่าวลือและคำบอกเล่าเพิ่มเติม\n\nผู้คนสังเกตเห็นเมื่อ [ROOT.Char.GetTitleAsNameNoTooltip] กำลังสอดแนมอยู่รอบๆ ข้าคิดว่า และนั่นในทางกลับกันก็กระตุ้นให้เกิดความคิดเห็นที่ไม่มีมูลเพิ่มเติม"
 ep3_laamp_flavour_ewan.2017.a: "อย่างน้อยข้าก็พอใจ"
 ep3_laamp_flavour_ewan.2017.b: "ข้าไม่ได้สนใจอยู่แล้ว..."

 ep3_laamp_flavour_ewan.2021.t: "ผูกพันกัน"
 ep3_laamp_flavour_ewan.2021.desc: "ในฐานะ [ROOT.Char.GetTitleAsNameNoTooltip] ของค่ายนี้ เมื่อผู้ติดตามที่โดดเด่นกว่าสองคนของข้าต้องการ แต่งงานกัน เป็นสิทธิ์ของข้าที่จะมีคำพูดสุดท้าย พวกเขาอาศัยอยู่ภายใต้การคุ้มครองของข้า เดินทางด้วยสัตว์ของข้า และกินอาหารของข้า ท้ายที่สุดแล้ว\n\nคู่รักที่มีความหวังในวันนี้คือ [follower_1.GetFirstName] และ [follower_2.GetFirstName] และเมื่อทุกอย่างเข้าที่แล้ว พวกเขาเพียงรอให้ข้าโบกมืออนุญาต — หรือไม่ก็ส่งสัญญาณถึงการท้าทายของข้า"
 ep3_laamp_flavour_ewan.2021.a: "อนุญาตการรวมตัว"
 ep3_laamp_flavour_ewan.2021.b: "อนุญาต แต่ไม่อนุญาตให้มีพิธีการที่เป็นทางการ"
 ep3_laamp_flavour_ewan.2021.c: "ห้ามพวกเขา"
 ep3_laamp_flavour_ewan.2021.c.tt: "การสั่งให้คู่รักหยุดเจอกันง่ายๆ นั้นไม่ค่อยได้ผลทั้งหมด"

 ep3_laamp_flavour_ewan.2031.t: "พอแล้วกับเจ้า"
 ep3_laamp_flavour_ewan.2031.desc.intro: ""... และคำพูดที่คร่ำครวญ อ้อนวอนของเจ้า การเดินขบวนสู่ความตายไปสู่ที่ไหนก็ไม่รู้ และความล้มเหลวอย่างสิ้นเชิงของเจ้าในการจัดหาในฐานะ [ROOT.Char.GetTitleAsNameNoTooltip]! เจ้าได้ยินข้าไหม? ข้า #EMP พอแล้ว!#!" [firebrand.GetFirstName] ตะโกน [firebrand.Custom('ArmArms')] ของ [firebrand.GetSheHe] แกว่งไปมาอย่างบ้าคลั่งขณะที่ [firebrand.GetSheHe] ชี้ไม้ชี้มือไปยังฝูงชนที่มุงดู\n\n""
 ep3_laamp_flavour_ewan.2031.desc.waverers.some: "ผู้ติดตามคนอื่นๆ ของข้าหลายคนก็แสดงสีหน้าไม่พอใจ เช่นกัน ดูเหมือนพร้อมที่จะจากไปพร้อมกับ [firebrand.GetFirstNameNoTooltip] — #EMP หาก#! [firebrand.GetSheHe] ได้รับอนุญาตให้ทำ เช่นนั้น"
 ep3_laamp_flavour_ewan.2031.desc.waverers.none: "ผู้ติดตามที่เหลือของข้าดูเหมือนจะไม่เห็นใจ สำหรับการพูดจาโผงผางและบ้าคลั่งทั้งหมดของ [firebrand.GetHerHis] เกี่ยวกับความชั่วร้ายของข้า [firebrand.GetFirstNameNoTooltip] ยืนหยัดอยู่คนเดียวในความเกลียดชังอย่างรุนแรงต่อข้า เช่นนี้"
 ep3_laamp_flavour_ewan.2031.tt.success.wavering_courtiers: "[followers|E] ที่ลังเลทั้งหมด"
 ep3_laamp_flavour_ewan.2031.tt.failure.wavering_courtiers_move_to_pool: "$ep3_laamp_flavour_ewan.2031.tt.success.wavering_courtiers$"
 ep3_laamp_flavour_ewan.2031.a: "บางทีข้าอาจจะโน้มน้าวเจ้าได้..."
 ep3_laamp_flavour_ewan.2031.a.tt.success: "ท่าน ทำให้ความไม่พอใจเย็นลง"
 ep3_laamp_flavour_ewan.2031.a.tt.failure: "คำพูดไร้ค่าจาก [ROOT.Char.GetWomanMan] ที่ไร้ค่า"
 ep3_laamp_flavour_ewan.2031.b: "เจ้าจะไปไหนไม่ได้ จับ [firebrand.GetHerHim] ใส่โซ่ตรวน!"
 ep3_laamp_flavour_ewan.2031.c: "จากไปหากเจ้าต้องการ แต่เจ้าจะไม่ได้อะไรและไม่มีใครไป"
 ep3_laamp_flavour_ewan.2031.c.tt.success: "ท่านจ้องมอง [firebrand.GetHerHim] จนยอมแพ้"
 ep3_laamp_flavour_ewan.2031.c.tt.failure: "ความเย่อหยิ่งของท่าน ทำให้หลายคนตัดสินใจ"
 ep3_laamp_flavour_ewan.2031.d.multi: "ไปเถอะ พวกเจ้าทุกคน"
 ep3_laamp_flavour_ewan.2031.d.solo: "ไปเถอะ"

 ep3_laamp_flavour_ewan.2041.t: "ที่พักที่ใกล้ชิดยิ่งขึ้น"
 ep3_laamp_flavour_ewan.2041.desc: "ระหว่างความโกลาหลของการย้ายที่ตั้งเป็นประจำและการมาและการไปของใบหน้าใหม่ๆ ทุกๆ เมือง มีเวลาเหลือเฟือใน แต่ละวันสำหรับผู้ติดตามที่จะพบว่าพวกเขามีความสัมพันธ์ที่ไม่คาดฝันกับใครบางคนใหม่และไม่คาดคิด\n\nตัดสินจากเรื่องตลกวงในที่พวกเขามีร่วมกัน เสียงกระซิบที่ส่งต่อกัน และการแอบหนีไปอย่างไม่แนบเนียนเป็นครั้งคราว ดูเหมือนว่าจะเป็นกรณีนี้กับ [follower_1.GetFirstName] และ [follower_2.GetFirstName]\n\nเห็นได้ชัดว่านกเลิฟเบิร์ดทั้งสองคิดว่าตัวเองลอบเร้น พวกเขาไม่ได้เป็น เช่นนั้น"
 ep3_laamp_flavour_ewan.2041.a: "ให้พวกเขาแยกจากกัน"
 ep3_laamp_flavour_ewan.2041.a.tt.success: "ความรักที่เหี่ยวเฉา"
 ep3_laamp_flavour_ewan.2041.a.tt.failure: "หัวใจต้องการสิ่งที่มันต้องการ"
 ep3_laamp_flavour_ewan.2041.b: "ไม่ใช่เรื่องของข้าจริงๆ"

 ep3_laamp_flavour_ewan.2051.t: "จะมีประโยชน์อะไร?"
 ep3_laamp_flavour_ewan.2051.desc.intro: "[smelly.GetFirstName|U] หยุดอาบน้ำ หยุดแม้กระทั่งพยายามทำความสะอาด [smelly.GetHerselfHimself] ด้วยซ้ำ — ข้อเท็จจริงที่ข้าต้องเผชิญหน้าอย่างโหดร้ายเมื่อผู้ติดตามหลายคนของข้าขอร้องให้ข้าจัดการกับ [smelly.GetHerHim]\n\n"ข้ารู้ว่าท่านกำลังคิดอะไรอยู่ [ROOT.Char.GetTitleAsName] แต่มันไม่ใช่ความเกียจคร้าน"
 ep3_laamp_flavour_ewan.2051.desc.diligent_and_humble: "ตรงกันข้ามเลย! ข้าเป็น [smelly.GetWomanMan] ที่เรียบง่าย อุทิศตนให้กับงานของข้า และมีเวลาจำกัดใน แต่ละวัน ทำไมต้องเสียเวลาทำความสะอาดในเมื่อฝุ่นของถนนวันพรุ่งนี้จะมาเกาะข้าในตอนเช้าอยู่แล้ว?""
 ep3_laamp_flavour_ewan.2051.desc.athletic: "ข้าใช้เวลาทั้งวันในการเดิน วิ่ง หรือขี่ม้า ทั้งหมดเพื่อประโยชน์ของค่าย ดังนั้นจึงเป็นเรื่องธรรมดาที่ข้าจะมี #EMP กลิ่นตัว#! เล็กน้อยเมื่อพิจารณาถึงทุกสิ่งที่ข้าทำที่นี่ มันผิดจริงๆ หรือที่จะละทิ้งการเสแสร้งทั้งหมด?""
 ep3_laamp_flavour_ewan.2051.desc.gregarious: "ข้าเป็นชีวิตชีวาของทุกงานเลี้ยงและเป็นที่นิยมของทุกคนตั้งแต่วงในไปจนถึงผู้ติดตามที่สำคัญน้อยที่สุด อย่างน้อยข้าก็คิด เช่นนั้น ซึ่ง ทำให้ข้ามีความสำคัญต่อขวัญกำลังใจ มันสำคัญจริงๆ หรือถ้าข้าจะเปื้อนโคลนและเหงื่อเล็กน้อยเมื่อพิจารณาถึงความสุขที่ข้านำมา?""
 ep3_laamp_flavour_ewan.2051.desc.lazy: "มันคือ เอ่อ... แรงผลักดันเพื่อประสิทธิภาพ? ข้าสามารถทำงาน #EMP มากขึ้น#! ได้จริงๆ หากข้าใช้เวลาน้อยลงในการเช็ดเหงื่อจากท้องถนน นี่คือสิ่งที่การมุ่งเน้นไปที่คุณค่าอย่างไม่ลดละดูเหมือนจะเป็น""
 ep3_laamp_flavour_ewan.2051.desc.outro: "\n\n[smelly.GetSheHe|U] บ้าไปแล้ว หรือเป็นคนโง่ หรือทั้งสองอย่าง"
 ep3_laamp_flavour_ewan.2051.a.diligent_and_humble: "นี่ไม่ใช่งานเล็กน้อยที่จะข้ามไป"
 ep3_laamp_flavour_ewan.2051.a.athletic: "การเหงื่อออกเป็นประจำต้องอาบน้ำเป็นประจำ ให้ตายสิ"
 ep3_laamp_flavour_ewan.2051.a.gregarious: "ให้ตายสิ คิดถึงพวกเราที่เหลือบ้าง!"
 ep3_laamp_flavour_ewan.2051.a.lazy: "ความเกียจคร้านของเจ้าไปไกลเกินไปแล้ว!"
 ep3_laamp_flavour_ewan.2051.b: "เจ้าพูดมีเหตุผล"
 ep3_laamp_flavour_ewan.2051.c: "เพียงแค่ขี่ม้านำหน้าไป — #EMP ไกล#! ล่วงหน้า"
 ep3_laamp_flavour_ewan_2051_is_stinker_modifier: "เหม็น"
 ep3_laamp_flavour_ewan_2051_is_stinker_modifier_desc: "ตัวละครนี้ แม้จะมีการประท้วงมากมาย ก็ไม่เต็มใจที่จะอาบน้ำอย่างยิ่ง"
 ep3_laamp_flavour_ewan_2051_disciplined_stinker_modifier: "ผู้มีระเบียบวินัยด้านสุขอนามัย"
 ep3_laamp_flavour_ewan_2051_disciplined_stinker_modifier_desc: "ตัวละครนี้ไม่มีเวลาให้กับคนที่เหงื่อออกอย่างไม่ระมัดระวัง"
 ep3_laamp_flavour_ewan_2051_joined_stinker_modifier: "เหม็นด้วย"
 ep3_laamp_flavour_ewan_2051_joined_stinker_modifier_desc: "ตัวละครนี้เลือกที่จะเข้าร่วมกับผู้ติดตามคนหนึ่งของพวกเขาในการเลิกอาบน้ำ"

 ep3_laamp_flavour_ewan.2061.t: "ที่ของข้า"
 ep3_laamp_flavour_ewan.2061.desc: ""ย้ายกระโจมเฮงซวยของเจ้าไปซะ, ให้ตายสิ, [thief.GetFirstName]! นี่มันที่ของข้า!" [victim.GetFirstName] ร้องตะโกนขึ้น ขัดจังหวะการเดินเล่นยามเย็นของข้า [thief.GetFirstNameNoTooltip|U] ดูไม่สะทกสะท้าน เพียงแค่กอด [thief.Custom('ArmArms')] ของ [thief.GetHerHis] ไว้บนอก\n\n"มันจะเป็นที่ของเจ้าได้อย่างไร ในเมื่อมันมีกระโจม #EMP ของข้า#! ตั้งอยู่ จริงไหมล่ะ?" [thief.GetSheHe] พูดสวนกลับ\n\nด้วยความต้องการผู้มีอำนาจตัดสิน [victim.GetFirstNameNoTooltip] จึงหันมาหาข้า: "[ROOT.Char.GetTitledFirstName] ได้โปรด ข้าขอร้องท่าน ช่วยสั่งสอนเจ้าคน #EMP เลวทราม#! นี่ที""
 ep3_laamp_flavour_ewan.2061.a: "เข้าข้าง [victim.GetFirstNameNoTooltip]"
 ep3_laamp_flavour_ewan.2061.b: "เข้าข้าง [thief.GetFirstNameNoTooltip]"
 ep3_laamp_flavour_ewan.2061.c: "เรามีกฎระเบียบด้วยเหตุผลนะ, [thief.GetFirstNameNoTooltip]"
 ep3_laamp_flavour_ewan.2061.d: "พวกเจ้าไปตกลงกันเองเถิด"

 ep3_laamp_flavour_ewan.2071.t: "รองผู้บัญชาการ"
 ep3_laamp_flavour_ewan.2071.desc.sic_exists: "ไม่ใช่ความลับเลยว่า [current_sic.GetFirstName] นั้น อาจจะไม่ใช่รองผู้บัญชาการที่ดีที่สุดที่ข้าจะมีได้"
 ep3_laamp_flavour_ewan.2071.desc.sic_vacant: "เป็นเวลาสักพักแล้ว ที่ตำแหน่งรองผู้บัญชาการของข้าว่างลง"
 ep3_laamp_flavour_ewan.2071.desc.outro: "ความไม่พอใจกับสถานการณ์นี้ในที่สุดก็ปะทุขึ้นมากพอที่ผู้สมัครสามคนได้ก้าวออกมาเสนอตัวสำหรับบทบาทนี้\n\n[candidate_1.GetFirstName] ผู้เสนอที่จะสาบาน [candidate_1.GetHerselfHimself] ต่อข้าจนกว่าลมหายใจสุดท้ายของ [candidate_1.GetHerHis]\n\n[candidate_2.GetFirstName] ผู้ดูเหมือนพร้อมที่จะทำงาน [candidate_2.GetHerselfHimself] จนหมดแรงเพื่อข้า\n\nและแน่นอน [candidate_3.GetFirstName] — ไม่ต้องสงสัยเลยว่าเป็นผู้ที่มีคุณสมบัติเหมาะสมที่สุดในค่ายสำหรับบทบาทนี้"
 ep3_laamp_flavour_ewan.2071.a: "ยอมรับความภักดีของ [candidate_1.GetFirstNamePossessiveNoTooltip]"
 ep3_laamp_flavour_ewan.2071.a.tt.candidate_aptitude: "[aptitude|E] ของ [candidate_1.GetFirstNamePossessive] จะเป็น [candidate_1.GetCourtPositionAptitude( GetCourtPositionType( 'second_camp_officer') )]"
 ep3_laamp_flavour_ewan.2071.b: "ใช้ประโยชน์จากจรรยาบรรณในการทำงานของ [candidate_2.GetFirstNamePossessiveNoTooltip]"
 ep3_laamp_flavour_ewan.2071.b.tt.candidate_aptitude: "[aptitude|E] ของ [candidate_2.GetFirstNamePossessive] จะเป็น [candidate_2.GetCourtPositionAptitude( GetCourtPositionType( 'second_camp_officer') )]"
 ep3_laamp_flavour_ewan.2071.c: "ใช้ทักษะอันประจักษ์ของ [candidate_3.GetFirstNamePossessiveNoTooltip]"
 ep3_laamp_flavour_ewan.2071.c.tt.candidate_aptitude: "[aptitude|E] ของ [candidate_3.GetFirstNamePossessive] จะเป็น [candidate_3.GetCourtPositionAptitude( GetCourtPositionType( 'second_camp_officer') )]"
 ep3_laamp_flavour_ewan.2071.d.post_filled: "[current_sic.GetFirstNameNoTooltip] จะยังคงดำรงตำแหน่งของ [current_sic.GetHerHis] ต่อไป!"
 ep3_laamp_flavour_ewan.2071.d.post_empty: "ตำแหน่งจะยังคงว่างอยู่"
 ep3_laamp_flavour_ewan_2071_b_work_self_to_death_modifier: "ทำงานจนตัวตาย"
 ep3_laamp_flavour_ewan_2071_b_work_self_to_death_modifier_desc: "'การพักผ่อน' เป็นข้ออ้างที่พวกขี้เกียจสันหลังยาวอนุญาตให้ตนเองใช้เป็นความหรูหรา"

 ep3_laamp_flavour_ewan.2081.t: "เครื่องจักรที่หล่อลื่นอย่างดี"
 ep3_laamp_flavour_ewan.2081.desc.intro: "ป่ากระโจมเล็กๆ ของเราที่ตั้งขึ้นทุกๆ สองสามเย็น เป็นสิ่งที่เราทำได้ดีขึ้นมากในช่วงหลังนี้ หลังแล้วหลังเล่า ผู้คนและเครื่องมือกระจายไปตามแนวเพื่อช่วยเหลือเพื่อนบ้าน เป็นแบบอย่างของความเร็วและประสิทธิภาพ\n\n"
 ep3_laamp_flavour_ewan.2081.desc.dislike: "แม้ แต่ [follower_1.GetFirstName] และ [follower_2.GetFirstName] ซึ่งในอดีตไม่เคยลงรอยกัน ก็กำลังช่วยเหลือ ซึ่งกันและกันในคืนนี้ หัวเราะเหมือนเพื่อนเก่าขณะทำงาน"
 ep3_laamp_flavour_ewan.2081.desc.like: "[follower_1.GetFirstName] และ [follower_2.GetFirstName] ซึ่งโดยทั่วไปเข้ากันได้ดีในอดีต ดูเหมือนจะผูกพันกันเป็นพิเศษในคืนนี้ขณะที่พวกเขาช่วยเหลือ ซึ่งกันและกัน"
 ep3_laamp_flavour_ewan.2081.desc.neutral: "แม้ แต่ [follower_1.GetFirstName] และ [follower_2.GetFirstName] ซึ่งโดยทั่วไปไม่เป็นที่รู้จักว่าอยู่ในวงสังคมเดียวกัน ก็กำลังฮัมเพลงเบาๆ ขณะช่วยเหลือ ซึ่งกันและกัน"
 ep3_laamp_flavour_ewan.2081.desc.outro: "\n\nมีที่สำหรับทุกสิ่ง และทุกสิ่งอยู่ในที่ของมัน"
 ep3_laamp_flavour_ewan.2081.a: "ต้องการให้ข้าช่วยอีกแรงหรือไม่?"
 ep3_laamp_flavour_ewan.2081.b: "หลังจากเสร็จที่นี่แล้ว ไปช่วยตั้งพลับพลาของข้าด้วย"
 ep3_laamp_flavour_ewan.2081.c: "อืม... ไม่ชอบเลย แยกพวกเขาออกจากกัน"
 ep3_laamp_flavour_ewan.2081.d: "อย่างที่ควรจะเป็น"
 ep3_laamp_flavour_ewan.2081.e: "ดีใจที่เห็นทั้งสองเข้ากันได้!"
 ep3_laamp_flavour_ewan_2081_d_well_oiled_operation_modifier: "ปฏิบัติการอันราบรื่น"
 ep3_laamp_flavour_ewan_2081_d_well_oiled_operation_modifier_desc: "ค่ายของตัวละครนี้เคลื่อนไหวราวกับรางเครื่องยิงหินที่หล่อลื่นอย่างดี"

 ep3_laamp_flavour_ewan.2091.t: "อาชญากรรมจากแรงโทสะ"
 ep3_laamp_flavour_ewan.2091.desc: "รอบกองไฟ ผู้ติดตามสองสามคนกำลังแบ่งปันมื้อค่ำกัน\n\nน่าประหลาดนักที่ [attacker.GetFirstName] [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('attacker'))]ของข้า และ [defender.GetFirstName] [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('defender'))]ของข้า นั่งปะปนอยู่กับพวกเขาด้วย — แม้ทั้งสองจะไม่ลงรอยกันก็ตาม\n\n[defender.GetFirstNameNoTooltip|U] พึมพำบางอย่างในลำคอของ[defender.GetHerHis] ไม่ว่าสิ่งนั้นจะเป็นอะไร มันทำให้ [attacker.GetFirstNameNoTooltip] โกรธจนหน้ามืดตามัว คมดาบประกายวาบ เลือดกำลังจะหลั่งริน"
 ep3_laamp_flavour_ewan.2091.tt.duel_commences: "[attacker.GetFirstName] และ [defender.GetFirstName] จะประลองกันจนตายทันที"
 ep3_laamp_flavour_ewan.2091.a: "เข้าแทรกแซง"
 ep3_laamp_flavour_ewan.2091.a.tt.success: "ท่านหยุดยั้งเรื่องนี้ได้"
 ep3_laamp_flavour_ewan.2091.a.tt.failure: "มีการลงไม้ลงมือกันอยู่ดี"
 ep3_laamp_flavour_ewan.2091.b: "ทำไมไม่ตัดสินเรื่องนี้ด้วยการประลองอย่างสมเกียรติเล่า?"
 ep3_laamp_flavour_ewan.2091.c: "จับกุม [attacker.GetFirstNameNoTooltip]! เอาไปเข้าขื่อคา!"
 ep3_laamp_flavour_ewan.2091.d: "ปล่อยให้พวกเขาจัดการกันเอง"
 
 ep3_laamp_flavour_ewan.2092.tt.attacker_won: "[attacker.GetFirstNameNoTooltip] ชนะ"
 ep3_laamp_flavour_ewan.2092.tt.attacker_won.tt: "[attacker.GetSheHe|U] สังหาร [defender.GetFirstName]"
 ep3_laamp_flavour_ewan.2092.tt.defender_won: "[defender.GetFirstNameNoTooltip] ชนะ"
 ep3_laamp_flavour_ewan.2092.tt.defender_won.tt: "[defender.GetSheHe|U] สังหาร [attacker.GetFirstName] เพื่อป้องกันตัว"

 ##################################################
 # CAMP PURPOSE

 ep3_laamp_flavour_ewan.3001.t: "ได้ยินชื่อเสียงของท่าน"
 ep3_laamp_flavour_ewan.3001.desc.intro: "ข้าตามยามเข้าไปในกระโจมที่มีแสงสลัวข้าง [ROOT.Char.Custom('GetRandomCampBuilding')] ที่ ซึ่งชาวบ้านสามคนในสภาพซอมซ่อรอข้าอยู่ พวกเขา [ROOT.Char.Custom('SenseObserve_SeemLook')] ประหม่า ราวกับว่าการมาที่นี่เป็นความเสี่ยง\n\nคนหนึ่งยืนขึ้น ก่อนจะโค้งคำนับให้ข้าอย่าง #EMP งุ่มง่าม#! "คารวะท่าน [ROOT.Char.GetLadyLord] ข้านามว่า [brains.GetFirstName] ไอ้ [brawn.Custom('GetLassLad')] ร่างใหญ่คนนี้คือ [brawn.GetFirstName] และอีกคนคือ [fingers.GetFirstName] พวกเรามาที่นี่เพื่อสมัครเข้าร่วม"\n\n"
 ep3_laamp_flavour_ewan.3001.desc.legendary: ""พวกเราเป็นศิลปินโดยเนื้อแท้ — ไม่ว่าจะด้วยมีด บ่วง หรือลูกธนูบาก — และเรานึกไม่ออกว่าจะมี [ROOT.Char.Custom('MistressMaster')] ใดที่คู่ควรกับพรสวรรค์ของเรามากกว่าท่านอีกแล้ว""
 ep3_laamp_flavour_ewan.3001.desc.exalted: ""พวกเราจริงจังกับสิ่งที่ทำ และนั่นหมายถึงการไม่ปล่อยให้ความหยิ่งทะนง ทำให้เราพลาดโอกาสครั้งสำคัญในชีวิต พาพวกเราไปด้วย แล้วเราจะขโมยโลกทั้งใบมาให้ท่าน""
 ep3_laamp_flavour_ewan.3001.desc.illustrious: ""พวกเราเคยเป็นปลาใหญ่ที่สุดในบ่อนี้ — จนกระทั่งท่านปรากฏตัวขึ้น ไม่ใช่ว่าเราไม่พอใจ ธุรกิจก็คือธุรกิจ และไม่มีเหตุผลที่จะแข่งขันกันในเมื่อเราสามารถทำงานร่วมกันได้""
 ep3_laamp_flavour_ewan.3001.desc.distinguished: ""พวกเราได้ยินชื่อเสียงของท่านตั้งแต่ท่านมาถึง และคิดว่าเราจะเป็นประโยชน์อย่างยิ่งต่อปฏิบัติการของท่าน""
 ep3_laamp_flavour_ewan.3001.desc.established: ""พวกเราเป็นคนทำงานหนัก — อย่างน้อยก็ใน #EMP สายงาน#! ของเรา — และในมุมมองของเรา ท่านน่าจะต้องการความช่วยเหลือในการสร้างชื่อเสียงและหาเงินเข้ากระเป๋า""
 ep3_laamp_flavour_ewan.3001.desc.disgraced: ""พวกเรา เอ่อ... ทำผิดกฎหมายใน [current_county.GetBaseNameNoTier] มาหลายครั้งเกินไป และกำลังมองหาทางหนีออกจากที่นี่ แก๊งของท่านดูดีพอๆ กับแก๊งอื่นๆ""
 ep3_laamp_flavour_ewan.3001.a: "แน่นอน เราจะรับพวกเจ้าไว้..."
 ep3_laamp_flavour_ewan.3001.b: "... แต่พวกเจ้าต้องจ่ายเข้า #EMP กองกลาง#! ก่อน"
 ep3_laamp_flavour_ewan.3001.b.tt.success: "พวกเขาเทสมบัติทั้งหมดให้ท่าน"
 ep3_laamp_flavour_ewan.3001.b.tt.failure: "ไม่มีสัจจะในหมู่โจรสินะ!"
 ep3_laamp_flavour_ewan.3001.c: "เหอะ ออกไปให้พ้น ไอ้พวกสวะ"

 ep3_laamp_flavour_ewan.3011.t: "โต้แย้งวาทะ"
 ep3_laamp_flavour_ewan.3011.desc: "มีทัศนะ ย่อมโต้แย้ง\n\nสัจธรรมง่ายๆ สำหรับการรวมตัวของปัญญาชนมากกว่าสองคน และแน่นอนว่ามีคน เช่นนั้นมากกว่าสองคนใน [ROOT.Char.GetPrimaryTitle.GetDefinitiveName]\n\nในเย็นอันดีงามนี้ มีการสนทนาที่ทับซ้อนกัน — และค่อนข้างดัง — สองวง หนึ่งคือเรื่องวาทศิลป์และการเมืองชั้นสูงกับ [eloquent_follower.GetFirstName] และอีกหนึ่งคือเรื่องประวัติศาสตร์และภูมิปัญญาทางปรัชญากับ [wise_follower.GetFirstName]"
 ep3_laamp_flavour_ewan.3011.a: "[eloquent_follower.GetFirstNameNoTooltip] น่าสนใจ..."
 ep3_laamp_flavour_ewan.3011.a.tt.success: "การโต้วาทีแห่งยุคสมัย"
 ep3_laamp_flavour_ewan.3011.a.tt.failure: "ถ้อยคำสละสลวยและการพูดคุยอันดี"
 ep3_laamp_flavour_ewan.3011.b: "ความคิดของ [wise_follower.GetFirstNamePossessiveNoTooltip] จะกระตุ้นข้า!"
 ep3_laamp_flavour_ewan.3011.b.tt.success: "การสนทนาที่ให้ความกระจ่าง"
 ep3_laamp_flavour_ewan.3011.b.tt.failure: "การพูดเพ้อเจ้อที่น่าเพลิดเพลิน"
 ep3_laamp_flavour_ewan.3011.c: "ดื่มด่ำกับความโกลาหลของผู้ทรงความรู้"
 ep3_laamp_flavour_ewan.3011.d: "พยักหน้าตามการสนทนา"
 ep3_laamp_flavour_ewan_3011_d_presiding_over_lively_debates_modifier: "เป็นประธานในการโต้วาทีอันมีชีวิตชีวา"
 ep3_laamp_flavour_ewan_3011_d_presiding_over_lively_debates_modifier_desc: "น่าตกใจว่าเหล่าปัญญาชนจะเสียงดังได้เพียงใดเมื่อพวกเขาตั้งใจ"
 ep3_laamp_flavour_ewan_3011_d_presiding_over_debates_modifier: "เป็นประธานในการโต้วาที"
 ep3_laamp_flavour_ewan_3011_d_presiding_over_debates_modifier_desc: "ความรู้เพียงเล็กน้อยก็ไปได้ไกล"

 ep3_laamp_flavour_ewan.3021.t: "สุดขอบฟ้า"
 ep3_laamp_flavour_ewan.3021.desc: "ขณะนั่งอยู่ในกระโจม ข้าพบว่าตนเองกำลังคร่ำเคร่งอยู่กับบันทึก แผนที่ และต้นฉบับที่ให้รายละเอียดเกี่ยวกับอาณาจักรอันแปลกตาและห่างไกล เรื่องราวช่างน่าเย้ายวนใจ สถานที่ #EMP แปลกประหลาด#! ที่โลกนี้มีให้...\n\nข้าสงสัยว่า ผู้คนของพวกเขาได้ยินเรื่องราว เช่นนี้เกี่ยวกับเราหรือไม่? ข้ากำลังตีความเพียงข่าวลือ หรือบันทึกที่สัตย์จริง — และน่าอัศจรรย์ — เกี่ยวกับสถานที่ที่ดูเหมือนห่างไกลจากสายพระเนตรของ [ROOT.Char.GetFaith.HighGodNamePossessive]?"
 ep3_laamp_flavour_ewan.3021.tt.kingdom_1.contracts_appear: "สัญญาที่มีมูลค่าสูงหลายฉบับจะปรากฏใน [kingdom_1.GetDefinitiveName]"
 ep3_laamp_flavour_ewan.3021.tt.kingdom_2.contracts_appear: "สัญญาที่มีมูลค่าสูงหลายฉบับจะปรากฏใน [kingdom_2.GetDefinitiveName]"
 ep3_laamp_flavour_ewan.3021.tt.kingdom_3.contracts_appear: "สัญญาที่มีมูลค่าสูงหลายฉบับจะปรากฏใน [kingdom_3.GetDefinitiveName]"
 ep3_laamp_flavour_ewan.3021.tt.success: "ช่างเป็นวากยสัมพันธ์ที่งดงาม"
 ep3_laamp_flavour_ewan.3021.tt.failure: "ถ้อยคำเหล่านี้ยากนัก"
 ep3_laamp_flavour_ewan.3021.a: "[kingdom_1.GetBaseNameNoTierNoTooltip] ทำให้ข้าสนใจ"
 ep3_laamp_flavour_ewan.3021.b: "ข้าอยากเห็น [kingdom_2.GetBaseNameNoTierNoTooltip] มาโดยตลอด!"
 ep3_laamp_flavour_ewan.3021.c: "ข้าพบว่า [kingdom_3.GetBaseNameNoTierNoTooltip] น่าหลงใหล"
 ep3_laamp_flavour_ewan.3021.d: "ข้ายังมีสถานที่ให้ครุ่นคิดอีก..."

 ep3_laamp_flavour_ewan.3031.t: "ของข้าโดยชอบธรรม"
 ep3_laamp_flavour_ewan.3031.desc.intro: "มันควรจะเป็นของข้า\n\nมันไม่ถูกต้องที่ข้านั่งอยู่ที่นี่ ในกระโจมที่มีลมโกรก แทนที่จะเป็นเตียงอุ่นๆ ในวังของข้าในเมืองหลวง แรงผลักดันของข้าที่จะได้เห็นทรัพย์สินของข้า — #EMP สิทธิ์โดยกำเนิด#! ของข้า — กลับคืนมานั้น ลุกโชนสว่างขึ้นเล็กน้อยใน แต่ละคืน เป็นแรงจูงใจที่บังคับให้ข้าก้าวต่อไปแม้จะต้องเผชิญกับ...ความอัปยศเหล่านี้\n\nแต่นั่นคือทั้งหมดหรือ?"
 ep3_laamp_flavour_ewan.3031.desc.family_title: "ข้าไม่มีสิทธิ์อันชอบธรรมใน [family_title.GetBaseNameNoTier] หรอกหรือ?"
 ep3_laamp_flavour_ewan.3031.desc.adjacent_title: "[adjacent_title.GetBaseNameNoTier] ไม่ใช่ของข้าตามหลักเหตุผลหรอกหรือ?"
 ep3_laamp_flavour_ewan.3031.desc.memory_title: "[memory_title.GetBaseNameNoTier] ไม่ได้ถูกขโมยไปจากข้าหรอกหรือ?"
 ep3_laamp_flavour_ewan.3031.desc.outro: "\n\nอารมณ์ของข้ามืดมนลงพร้อมกับท้องฟ้า"
 ep3_laamp_flavour_ewan.3031.a: "[family_title.GetBaseNameNoTierNoTooltip] เป็นของข้าโดยชอบธรรม!"
 ep3_laamp_flavour_ewan.3031.b: "[adjacent_title.GetBaseNameNoTierNoTooltip] เป็นอาณาเขตตามธรรมชาติของข้าอย่างแน่นอน..."
 ep3_laamp_flavour_ewan.3031.c: "ในใจข้า ข้าไม่เคยยอมแพ้ต่อ [memory_title.GetBaseNameNoTierNoTooltip]"
 ep3_laamp_flavour_ewan.3031.d: "สักวันหนึ่ง ทั้งหมดนี้และมากกว่านั้น..."
 ep3_laamp_flavour_ewan_3031_d_brooding_over_titles_modifier: "ครุ่นคิดถึงบรรดาศักดิ์"
 ep3_laamp_flavour_ewan_3031_d_brooding_over_titles_modifier_desc: "จิตใจที่มุ่งมั่นมีประโยชน์มากมาย"

 ep3_laamp_flavour_ewan.3041.t: "ผู้คนจากช่วงเวลาที่ดีกว่า"
 ep3_laamp_flavour_ewan.3041.desc.intro: "[commander.GetWomanMan] ชาว [commander.GetCulture.GetName] ยืนตัวตรงในกระโจมของข้า ศีรษะของ [commander.GetHerHis] ก้มต่ำลงด้วยความเคารพ\n\n"[ROOT.Char.GetTitledFirstNameNoTooltip] ข้าคือ [commander.GetFirstName] และข้านำผู้ติดตามที่ภักดีของท่านจาก [former_title.GetBaseNameNoTier] มาด้วยเท่าที่ข้าจะจัดการได้ เหล่าผู้ช่วงชิงปกครองดินแดนของท่าน และพวกเรา ข้ารับใช้ผู้ซื่อสัตย์ของท่าน ทนดูต่อไปไม่ได้อีกแล้ว —"
 ep3_laamp_flavour_ewan.3041.desc.compassionate: "ธรรมชาติอันเปี่ยมเมตตาและหัวใจอันกรุณาของท่านได้บ่งบอกเสมอมาว่าท่านคือเจ้าเหนือหัวโดยชอบธรรมของเรา""
 ep3_laamp_flavour_ewan.3041.desc.sadistic: "ปราศจากความยุติธรรมอันโหดเหี้ยมของท่าน เหล่าอาชญากรก็เฟื่องฟูและแพร่พันธุ์""
 ep3_laamp_flavour_ewan.3041.desc.callous: "ปราศจากวินัยอันเข้มงวดและชี้นำของท่าน อาณาจักรของท่านก็ตกต่ำสู่ความเสื่อมทราม""
 ep3_laamp_flavour_ewan.3041.desc.wrathful: "ปราศจากอารมณ์อันห้าวหาญของท่าน ศัตรูของเราก็คุกคามที่จะกวาดล้างเราไปจากโลก""
 ep3_laamp_flavour_ewan.3041.desc.calm: "ปราศจากมืออันมั่นคงและชี้นำของท่าน อาณาจักรของท่านกำลังล่มสลาย""
 ep3_laamp_flavour_ewan.3041.desc.arrogant: "ปราศจากอำนาจตามธรรมชาติของท่าน อาณาจักรของท่านก็ตกอยู่ในความโกลาหลชั่วนิรันดร์""
 ep3_laamp_flavour_ewan.3041.desc.humble: "ปราศจากความอ่อนน้อมถ่อมตนของท่านที่จะนำทางเรา ความเย่อหยิ่งและความโหดร้ายก็อาละวาดไปทั่ว""
 ep3_laamp_flavour_ewan.3041.desc.ambitious: "ปราศจากแรงผลักดันและความทะเยอทะยานของท่าน พวกเราก็เหมือนลูกแกะหลงทาง""
 ep3_laamp_flavour_ewan.3041.desc.content: "ปราศจากปัญญาและมุมมองของท่าน พวกเราก็เหมือนสุนัขป่า""
 ep3_laamp_flavour_ewan.3041.desc.arbitrary: "ปราศจากความปรารถนาตามอำเภอใจอันชี้นำของท่าน กฎหมายก็กลายเป็นเผด็จการ""
 ep3_laamp_flavour_ewan.3041.desc.just: "ปราศจากความยุติธรรมอันเที่ยงธรรมของท่าน หลักนิติธรรมก็ตายสิ้น""
 ep3_laamp_flavour_ewan.3041.desc.fallback: "พวกเราได้ให้สัตย์สาบาน และเราตั้งใจที่จะยึดมั่นในคำสาบานนั้นจนกว่าความตายจะพรากเราไป""
 ep3_laamp_flavour_ewan.3041.desc.title_claimed: "\n\n"ท่านยังคงอ้างสิทธิ์ใน [former_title.GetBaseNameNoTierNoTooltip] โปรดรับ #EMP พวกเรา#! ไว้เป็นสิทธิ์อันชอบธรรมของท่าน!""
 ep3_laamp_flavour_ewan.3041.desc.title_forsaken: "\n\n"ไม่ว่าท่านจะปรารถนาที่จะยึดคืน [former_title.GetBaseNameNoTierNoTooltip] หรือไม่ พวกเราก็ขอรับใช้ท่านดีกว่าที่จะอยู่ที่นั่นต่อไป""
 ep3_laamp_flavour_ewan.3041.tt.up_to_ten_usurper_held_counties: "สูงสุดสิบ [counties|E] ที่ถูกผู้ช่วงชิงยึดครอง"
 ep3_laamp_flavour_ewan.3041.a.imperial: "กองกำลังเพิ่มเติมสำหรับกองทัพจักรวรรดิพลัดถิ่น!"
 ep3_laamp_flavour_ewan.3041.a.royal: "กองกำลังเพิ่มเติมสำหรับกองทัพหลวงพลัดถิ่น!"
 ep3_laamp_flavour_ewan.3041.b: "ความภักดีของเจ้าเป็นที่รับทราบ แต่ข้าต้องการผู้บ่อนทำลาย"
 ep3_laamp_flavour_ewan.3041.c: "กลับบ้านไป และก่อกวนผู้ช่วงชิงไม่ว่าพวกเขาจะอยู่ที่ใด"
 ep3_laamp_flavour_ewan.3041.d: "ข้าขอบใจเจ้า แต่ข้าไม่ #EMP ต้องการ#! เจ้า"
 legitimist_loyalists: "ผู้ภักดีต่อสิทธิ์อันชอบธรรม"

 # Ngl I think this is probably the funniest title I've ever written.
 ep3_laamp_flavour_ewan.3051.t: "การวาดแผนที่"
 ep3_laamp_flavour_ewan.3051.desc: "มีบางอย่างที่บำบัดจิตใจเกี่ยวกับการทำแผนที่\n\nการจรดปากกาและพู่กันลงบนผืนผ้าใบ เฝ้าดูเส้นโค้งและรูปทรงของภูมิภาคมีชีวิตชีวาขึ้น มองเห็นโลกจากมุมมองใหม่ทั้งหมด มันเป็นเพียงการออกกำลังกายที่น่ารื่นรมย์ ซึ่งข้าพบว่าได้ใช้เวลาว่างยามเย็นหลายครั้งไปกับมันในช่วงหลังนี้\n\nผลงานชิ้นล่าสุดนี้อาจเป็นผลงานที่ยิ่งใหญ่ที่สุดของข้า แผนภูมิพร้อมภาพประกอบและคำอธิบายประกอบฉบับสมบูรณ์ของ [kingdom.GetBaseNameNoTier]"
 ep3_laamp_flavour_ewan.3051.tt.success: "ผลงานอันงดงาม"
 ep3_laamp_flavour_ewan.3051.tt.failure: "ภาพวาดเล่นๆ ของท่านแทบไม่มีค่าอะไร"
 ep3_laamp_flavour_ewan.3051.a: "ข้าจะสร้างผลงานอันเลื่องชื่อ!"
 ep3_laamp_flavour_ewan.3051.b: "แผนที่ของข้าจะโด่งดังไปทั่วโลก"
 ep3_laamp_flavour_ewan.3051.c: "ข้ามุ่งมั่นที่จะสร้างผลงานชิ้นเอกเสมอ..."
 ep3_laamp_flavour_ewan.3051.d: "เพียงแค่สนุกกับมัน"
 handcrafted_map: "แผนที่ประดับของ [kingdom.GetBaseNameNoTierNoTooltip]"
 handcrafted_map_desc.boilerplate: "แผนที่ที่สร้างขึ้นด้วยความรักนี้ครอบคลุมพื้นที่ทั้งหมดของ [kingdom.GetBaseNameNoTier] ดินแดนชายแดน และเพื่อนบ้านที่สำคัญที่สุด\n\nมีการให้ความสนใจเป็นพิเศษกับ"
 handcrafted_map_desc.mythic_beasts: "การให้รายละเอียดเกี่ยวกับตำนานและเรื่องเล่าท้องถิ่น การวาดภาพสัตว์ประหลาด สัตว์ร้าย และสิ่งแปลกประหลาดอื่นๆ ลงในทุกซอกทุกมุมที่กล่าวกันว่าพวกมันซ่อนตัวอยู่"
 handcrafted_map_desc.geography: "ภูมิศาสตร์ การบันทึกภูมิภาค ลักษณะเด่นของภูมิประเทศท้องถิ่นต่างๆ และแม้กระทั่งการร่างเส้นชั้นความสูงคร่าวๆ เท่าที่เป็นไปได้"
 handcrafted_map_desc.settlements: "การตั้งถิ่นฐานที่กระจายอยู่ทั่วแผ่นดิน ครอบคลุมทุกเมืองใหญ่ ทุกเมืองเล็ก แม้กระทั่งหมู่บ้านขนาดใหญ่บางแห่ง — เมืองหลวงเพียงแห่งเดียวถูกขยายใหญ่ขึ้นอย่างมากและมีการทำเครื่องหมายเขตต่างๆ ไว้"
 handcrafted_map_desc.people.urban: "การบันทึกนิสัยและชื่อเสียงของผู้คนจากศูนย์กลางเมืองใหญ่: ใครเหมาะที่จะเชิญไปร่วมงานเลี้ยงอาหารค่ำอย่างเป็นทางการ ใครเพาะพันธุ์ม้าที่ดีที่สุด ใครถูกหลอกลวงได้ง่ายที่สุด และอื่นๆ"
 handcrafted_map_desc.fauna: "สิ่งมีชีวิตในดินแดน ตั้งแต่สัตว์ล่าขนาดเล็กที่สุดและสัตว์ปีกที่เล็กที่สุด ไปจนถึงราชาและราชินีแห่งอาณาจักรสัตว์ในท้องถิ่น — ภาพประกอบของพวกมันจำนวนมากอัดแน่นอยู่ตามขอบและโลดเต้นไปตามพื้นที่ว่างที่มีอยู่"
 handcrafted_map_desc.flora: "พืชพรรณในดินแดน ตั้งแต่หญ้าที่เล็กที่สุดไปจนถึงต้นไม้ที่ใหญ่ที่สุดและแผ่กิ่งก้านสาขามากที่สุด — ขอบหนาของดอกไม้เบียดเสียดกันตามชายแดน แต่ละดอกมีรายละเอียดที่ไร้ที่ติ"
 handcrafted_map_desc.government: "วิธีที่คนท้องถิ่นดำเนินกิจการปกครอง ผู้นำที่มีชื่อเสียงที่สุดของพวกเขาคือใคร และพวกเขา ทำให้ตนเองชอบธรรมได้อย่างไร ภาพเหมือนขนาดเล็กของกษัตริย์ผู้โด่งดังนั่งยองๆ อยู่ใน แต่ละมุม"
 handcrafted_map_desc.tourism_sites: "สถานที่สำคัญที่น่าสนใจที่ผู้แสวงบุญ นักเดินทาง และนักผจญภัยทุกประเภทอาจต้องการเยี่ยมชม — สถานที่ขนาดใหญ่ เช่นนี้ยังมีภาพประกอบขนาดเล็กอีกด้วย"
 handcrafted_map_desc.routes: "เส้นทางที่สั้นที่สุด ถนนที่ได้รับการบำรุงรักษาดีที่สุด และเส้นทางที่ปลอดภัยที่สุดในการเดินทาง — ภาพประกอบขนาดเล็กของสัตว์ร้าย โจร และคนเถื่อนทำเครื่องหมายพื้นที่อันตรายที่สุดไว้อย่างชัดเจน"
 handcrafted_map_desc.people.rural: "การบันทึกนิสัยและชื่อเสียงของผู้คนจากพื้นที่ชนบทหลายแห่ง: ที่ใดที่ชาวนาต่อรองอย่างหนักที่สุด ใครปลูกองุ่นที่ดีที่สุด และที่ใดที่พวกเขามีแนวโน้มที่จะ...สนิทสนมกันในครอบครัวมากเกินไปเล็กน้อย"

 ep3_laamp_flavour_ewan.3061.t: "คู่มือสู่..."
 ep3_laamp_flavour_ewan.3061.desc: "เพียง... ไม่กี่... ครั้งสุดท้าย... ของการขีดเขียนด้วยปากกาขนนก... และก็...\n\nเสร็จแล้ว! แผ่นพับฉบับสมบูรณ์เกี่ยวกับชาวบ้านใน [current_county.GetBaseNameNoTier] และความแปลกประหลาดของพวกเขา เอาล่ะ ไม่ใช่ฉบับที่ละเอียดถี่ถ้วน แต่คำพูดไม่ได้งอกเงยบนต้นไม้ — ต้องคัดลอกอย่างอุตสาหะ ทีละตัวอักษร\n\nทีนี้ จะตั้งชื่อสิ่งมหัศจรรย์แห่งการเรียนรู้นี้ว่าอะไรดี?"
 ep3_laamp_flavour_ewan.3061.a: ""ผู้คนและสถานที่""
 ep3_laamp_flavour_ewan.3061.b: ""ร้อยแก้วและร้อยกรอง""
 ep3_laamp_flavour_ewan.3061.c: ""พืชและสัตว์""
 ep3_laamp_flavour_ewan.3061.d: "เพียงแค่ขีดเขียนความคิดต่อไป"
 ep3_laamp_flavour_ewan_3061_peoples_and_places_modifier: "ผู้คนและสถานที่"
 ep3_laamp_flavour_ewan_3061_peoples_and_places_modifier_desc: "ในการชักจูงผู้คน ท่านต้องเข้าใจพวกเขาก่อน"
 ep3_laamp_flavour_ewan_3061_prose_and_poetry_modifier: "ร้อยแก้วและร้อยกรอง"
 ep3_laamp_flavour_ewan_3061_prose_and_poetry_modifier_desc: "ปัญญาชนที่แท้จริงเป็นทั้งนักเขียนบทละครและนักวาทศิลป์"
 ep3_laamp_flavour_ewan_3061_plants_and_animals_modifier: "พืชและสัตว์"
 ep3_laamp_flavour_ewan_3061_plants_and_animals_modifier_desc: "โลกธรรมชาติคือบ่อเกิดพื้นฐานของความรู้"

 ep3_laamp_flavour_ewan.3071.t: "กฎหมายใน [current_county.GetBaseNameNoTierNoTooltip]"
 ep3_laamp_flavour_ewan.3071.desc: "การซุ่มโจมตีเกิดขึ้นเกือบทันทีที่ข้ามีเหตุให้เข้าไปในถิ่นทุรกันดาร ฝูงนักรบ [local_soldier.GetCulture.GetCollectiveNoun] พรั่งพรูออกมาจากที่ซ่อนที่เตรียมไว้และมุ่งตรงมายังข้าและกลุ่มผู้ติดตามเล็กๆ ของข้า\n\nพวกเขาติดอาวุธและสวมเกราะอย่างดี เกินกว่าจะเป็นการโจมตีฉวยโอกาส กองกำลังชาวบ้านกระมัง หรืออาจจะเป็นกองทหารประจำตระกูล ที่มาเพื่อสังหารข้าสำหรับอาชญากรรมของข้า\n\n[local_soldier.GetWomanMan] ร่างยักษ์นำการบุกตะลุย ตะโกนท้าทายข้าสุดเสียงอันทรงพลังของ [local_soldier.GetHerHis]: "#EMP ความตาย!#! #BER ความตายหรือความรุ่งโรจน์!"#!"
 ep3_laamp_flavour_ewan.3071.a: "ประลองกับผู้นำการโจมตี"
 ep3_laamp_flavour_ewan.3071.b: "เริ่มการซุ่มโจมตีของท่าน!"
 ep3_laamp_flavour_ewan.3071.c: "เป่าเขาสัญญาณ!"
 ep3_laamp_flavour_ewan.3071.c.tt.success: "กองทหารใกล้เคียงของท่านรุมล้อมพวกเขา"
 ep3_laamp_flavour_ewan.3071.c.tt.failure: "หายนะ!"
 ep3_laamp_flavour_ewan.3071.d: "โต้กลับอย่างง่ายดาย"
 ep3_laamp_flavour_ewan.3071.e: "รวบรวมกลุ่มของท่านเพื่อโต้กลับ"
 ep3_laamp_flavour_ewan.3071.e.tt.success: "ท่านขับไล่พวกเขาไปได้"
