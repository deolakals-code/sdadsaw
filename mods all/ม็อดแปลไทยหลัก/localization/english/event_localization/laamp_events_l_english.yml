 ep3_laamp_flavour_ewan.4062.desc.terrain.jungle: "เราก็มาถึงลานกว้างในป่าดิบชื้น"
 ep3_laamp_flavour_ewan.4062.desc.terrain.forest: "เราก็มาถึงดงป่ากว้างใหญ่"
 ep3_laamp_flavour_ewan.4062.desc.terrain.taiga: "$ep3_laamp_flavour_ewan.4062.desc.terrain.forest$"
 ep3_laamp_flavour_ewan.4062.desc.terrain.wetlands: "เราก็มาถึงหย่อมดินที่แห้งกว่า"
 ep3_laamp_flavour_ewan.4062.desc.terrain.steppe: "เราก็มาถึงร่องลึกที่เป็นหิน"
 ep3_laamp_flavour_ewan.4062.desc.terrain.floodplains: "เราก็มาถึงแหลมแคบๆ"
 ep3_laamp_flavour_ewan.4062.desc.terrain.drylands: "เราก็มาถึงหุบเขาที่เต็มไปด้วยฝุ่น"
 ep3_laamp_flavour_ewan.4062.desc.terrain.plains: "เราก็ข้ามเนินเขาเตี้ยๆ"
 ep3_laamp_flavour_ewan.4062.desc.terrain.connector: "ที่ ซึ่งรอยเท้าดูเหมือนจะหายไปเฉยๆ\n\n"
 ep3_laamp_flavour_ewan.4062.desc.animal.dog: "เสียงคำรามต่ำๆ จากด้านหลัง ทำให้ข้าต้องหันขวับไป ที่นั่น สุนัขพันธุ์มาสทิฟฟ์ป่าดุร้าย [ROOT.Char.Custom('4061_size_adjective')] ตัวหนึ่ง ปากของมันยังชุ่มโชกไปด้วยเลือดจากการสังหารเมื่อคืน กำลังจะเข้ามาถึงตัวเรา $ep3_laamp_flavour_ewan.4062.desc.animal.boilerplate$"
 ep3_laamp_flavour_ewan.4062.desc.animal.wolf: "เสียงคำรามดุร้ายจากด้านหลัง ทำให้ข้าต้องหันขวับไป ที่นั่น ข้าเผชิญหน้ากับหมาป่า [ROOT.Char.Custom('4061_size_adjective')] ตัวหนึ่ง ดวงตาของมันลุกโชนด้วยความหิวกระหายแบบสัตว์ป่า เขี้ยวของมันแยกออก น้ำลายข้นเหนียวหยดจากปาก $ep3_laamp_flavour_ewan.4062.desc.animal.boilerplate$"
 ep3_laamp_flavour_ewan.4062.desc.animal.hyena: "เสียงหัวเราะอย่างบ้าคลั่งจากด้านหลัง ทำให้ข้าต้องหันขวับไป ที่นั่น ไฮยีน่า [ROOT.Char.Custom('4061_size_adjective')] ตัวหนึ่ง — ปากของมันชุ่มโชกไปด้วยเลือดแห้งกรังและเศษเนื้อของมนุษย์ — จ้องมองเราอย่างหิวโหย $ep3_laamp_flavour_ewan.4062.desc.animal.boilerplate$"
 ep3_laamp_flavour_ewan.4062.desc.animal.lion: "เสียงคำรามดุจฟ้าร้องจากด้านหลัง ทำให้เราทุกคนต้องหันขวับไป ที่นั่น สิงโต [ROOT.Char.Custom('4061_size_adjective')] ตัวหนึ่ง — จมูกสั้นๆ ของมันยังคงเปรอะเปื้อนไปด้วยเครื่องในจากเมื่อเย็น — หอบหายใจด้วยความหิวโหยอย่างเห็นได้ชัด $ep3_laamp_flavour_ewan.4062.desc.animal.boilerplate$"
 ep3_laamp_flavour_ewan.4062.desc.animal.tiger: "เสียงคำรามเยือกกระดูกจากด้านหลัง ทำให้เราทุกคนต้องหันขวับไป ที่นั่น เสือ [ROOT.Char.Custom('4061_size_adjective')] ตัวหนึ่ง ยังคงมีกลิ่นเหม็นคาวจากการสังหารเมื่อเย็น จ้องมองเราอย่างหิวโหย $ep3_laamp_flavour_ewan.4062.desc.animal.boilerplate$"
 ep3_laamp_flavour_ewan.4062.desc.animal.leopard: "เสียงคำรามดังจากด้านหลัง ทำให้ข้าต้องหมุนตัวกลับ ที่นั่น เสือดาว [ROOT.Char.Custom('4061_size_adjective')] บ้าคลั่งตัวหนึ่ง — ใบหน้าและอุ้งเท้ายังชุ่มโชกไปด้วยเลือด — กำลังรออยู่ $ep3_laamp_flavour_ewan.4062.desc.animal.boilerplate$"
 ep3_laamp_flavour_ewan.4062.desc.animal.panther: "เสียงคำรามดังจากด้านหลัง ทำให้ข้าต้องหมุนตัวกลับ ที่นั่น ข้าแทบตกตะลึงเมื่อเห็นเสือดำสนิทเผชิญหน้ากับเรา มันยังคงเต็มไปด้วยความตื่นตัวและความกระหายเลือดจากการล่าเมื่อเย็น $ep3_laamp_flavour_ewan.4062.desc.animal.boilerplate$"
 ep3_laamp_flavour_ewan.4062.desc.animal.lynx: "เสียงขู่ต่ำๆ จากด้านหลัง ทำให้ข้าต้องหมุนตัวกลับ ที่นั่น ลิงซ์ [ROOT.Char.Custom('4061_size_adjective')] ตัวหนึ่ง — ดวงตาเป็นประกายด้วยความเจ้าเล่ห์ผิดธรรมชาติ ย่องเข้ามาในสายตา $ep3_laamp_flavour_ewan.4062.desc.animal.boilerplate$"
 ep3_laamp_flavour_ewan.4062.desc.animal.caracal: "เสียงคำรามดังจากด้านหลัง ทำให้ข้าต้องหันขวับไป ที่นั่น ใบหน้าที่เปื้อนเลือดของคาราคัล [ROOT.Char.Custom('4061_size_adjective')] ตัวหนึ่งรออยู่ ดูเหมือนมันจะเติบโตผิดธรรมชาติสำหรับสายพันธุ์ของมัน เหมือนสิงโตตัวเล็กมากกว่าแมวป่า $ep3_laamp_flavour_ewan.4062.desc.animal.boilerplate$"
 ep3_laamp_flavour_ewan.4062.desc.animal.bear: "เสียงคำรามก้องในลำคอจากด้านหลัง ทำให้เราทุกคนต้องหันขวับไป ที่นั่น ปากที่เปียกโชกไปด้วยเลือดแห้งกรังของหมี [ROOT.Char.Custom('4061_size_adjective')] ตัวหนึ่งจ้องมองเราด้วยดวงตาที่ฉลาดเกินไป $ep3_laamp_flavour_ewan.4062.desc.animal.boilerplate$"
 ep3_laamp_flavour_ewan.4062.desc.animal.hippo.largest: "เสียงคำรามที่ดังและเกรี้ยวกราดที่สุดเท่าที่ข้าเคยได้ยินดังมาจากด้านหลังเรา — เมื่อหันไป เราพบฮิปโป [ROOT.Char.Custom('4061_size_adjective')] ตัวหนึ่ง ด้วยฟันที่เหมือนกิ่งไม้และร่างกายที่ใหญ่โตราวกับเกวียนบรรทุกของ ซึ่งเต็มไปด้วยกล้ามเนื้อ มันอาจเป็นสัตว์ร้ายที่ใหญ่ที่สุดเท่าที่เคยพบเจอ $ep3_laamp_flavour_ewan.4062.desc.animal.boilerplate$""
 ep3_laamp_flavour_ewan.4062.desc.animal.hippo.fallback: "เสียงคำรามก้องในลำคอจากด้านหลัง ทำให้เราทุกคนต้องหันขวับไป ที่นั่น ปากที่มีฟันเหมือนกระบองของฮิปโป [ROOT.Char.Custom('4061_size_adjective')] ตัวหนึ่งรออยู่ $ep3_laamp_flavour_ewan.4062.desc.animal.boilerplate$""
 ep3_laamp_flavour_ewan.4062.desc.animal.crocodile: "เสียงคำรามลึกในลำคอจากด้านหลัง ทำให้เราทุกคนต้องหันขวับไป ที่นั่น ปากของจระเข้ [ROOT.Char.Custom('4061_size_adjective')] ตัวหนึ่งชี้ตรงมาที่เรา — ยังคงเกรอะกรังไปด้วยเครื่องในจากผู้ติดตามของข้า $ep3_laamp_flavour_ewan.4062.desc.animal.boilerplate$"
 ep3_laamp_flavour_ewan.4062.desc.animal.boilerplate: "สิ่งมีชีวิตนั้น เมื่อกับดักทำงาน ก็ออกวิ่งสุดฝีเท้า"
 ep3_laamp_flavour_ewan.4062.desc.animal.cannibal_generated: ""เจ้าเป็นคนแรก เจ้ารู้ไหม" เสียงที่ไม่คุ้นเคยดังขึ้นจากด้านหลัง เมื่อหันไป เราพบ [cannibal.GetWomanMan] ที่มีผมเปื้อนเลือดและเศษเนื้อดิบในฟันของ [cannibal.GetHerHis] "รสชาติแรกของข้า — และช่างเป็นรสชาติอะไร เช่นนี้! แต่เจ้า... เจ้าจะเป็น #EMP งานเลี้ยง!#!" อาวุธอยู่ในมือ มนุษย์กินคนพุ่ง [cannibal.GetHerselfHimself] เข้าใส่ข้า"
 ep3_laamp_flavour_ewan.4062.desc.animal.cannibal_existing.anna: "เสียงกรีดร้องด้วยความโกรธแค้นอย่างแท้จริงทำลายความเงียบสงัดของเรา ก่อนที่หอกซัดที่ขว้างมาจากความสูงระดับหน้าแข้งจะปักเข้าที่ฐานกระดูกสันหลังของผู้ติดตามคนหนึ่งของข้า ทำให้เขาล้มลงทันที เมื่อหันไป ข้าเผชิญหน้ากับใบหน้าที่เปื้อนเลือดของคนแคระที่กำลังเดือดดาล มือ[cannibal.GetHerHis]ที่เปียกโชกไปด้วยเลือดแห้งกรังกุมอาวุธพุ่งตรงมายังหว่างขาของข้า"
 ep3_laamp_flavour_ewan.4062.desc.animal.cannibal_existing.secret: ""ข้าต้องทำมัน ข้า #EMP ต้อง#! ทำ" เสียงที่ไม่คุ้นเคยและสับสนดังขึ้นข้างหลังเรา เมื่อหันไป เราพบ... [cannibal.GetWomanMan]? แค่ [cannibal.GetWomanMan] — ใบหน้าและฟันเปื้อนเลือดสีสนิมที่แห้งกรัง "เจ้าไม่รู้ถึง #EMP ความหิว#! เจ้าไม่ — เจ้า #EMP จะไม่#! เข้าใจ!" มนุษย์กินคนกรีดร้องขณะที่ [cannibal.GetSheHe] พุ่ง [cannibal.GetHerselfHimself] เข้าหาข้า"
 ep3_laamp_flavour_ewan.4062.desc.animal.cannibal_existing.fallback: ""เอาล่ะ เอาล่ะ เอาล่ะ" เสียงที่ไม่คุ้นเคยหัวเราะเบา ๆ ข้างหลังเรา พร้อมกันนั้น เราหันไปพบ [cannibal.GetWomanMan] กำลังถืออาวุธและยิ้มอย่างบ้าคลั่ง "ดูเหมือนว่าอาหารกลางวันจะมาส่งถึงที่!" [cannibal.GetSheHe] พูดติดตลก พุ่ง [cannibal.GetHerselfHimself] ตรงมาที่ข้า"
 ep3_laamp_flavour_ewan.4062.desc.animal.cannibal_chad: ""ข้าไม่ได้อยากทำร้ายใคร" เสียงสั่นเครือที่ไม่คุ้นเคยครวญครางจากด้านหลังเรา เมื่อหันไป เราพบ... ชายคนหนึ่ง? ดูเหมือนบัณฑิตหนอนหนังสือด้วยซ้ำ คนที่ดูไม่เข้ากับที่นี่และเวลานี้อย่างสิ้นเชิง "ข้าแค่... ข้าต้องการ #EMP เนื้อ#! ข้ายังต้องการมัน!" เขาร้องตะโกน อาวุธพลันปรากฏในมือขณะที่เขากระโจนเข้าใส่ข้า"
