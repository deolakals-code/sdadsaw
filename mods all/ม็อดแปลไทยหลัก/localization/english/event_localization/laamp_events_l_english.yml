 ep3_laamp_flavour_ewan.0041.m: "เจ้า #EMP เห็น#! ที่ไหนให้ซื้อเสบียงไหม ไอ้โง่?"
 ep3_laamp_flavour_ewan.0041.n: "ข้าไม่สนว่าเราจะกินข้าวต้มจนกว่าเราจะผ่านพ้นเรื่องนี้ไป"
 ep3_laamp_flavour_ewan_0041_well_provided_camp_modifier: "ค่ายพักที่มีเสบียงอย่างดี"
 ep3_laamp_flavour_ewan_0041_well_provided_camp_modifier_desc: "ความทรงจำเกี่ยวกับความอุดมสมบูรณ์สามารถคงอยู่ได้นาน"
 ep3_laamp_flavour_ewan_0041_doubled_beer_rations_camp_modifier: "ปันส่วนเบียร์สองเท่า"
 ep3_laamp_flavour_ewan_0041_doubled_beer_rations_camp_modifier_desc: "ค่ายพักของตัวละครนี้ #EMP ร่าเริง#! มาก — แค่ไม่ค่อยมีสมาธิ"
 ep3_laamp_flavour_ewan_0041_stern_camp_modifier: "เข้มงวดเรื่องเสบียง"
 ep3_laamp_flavour_ewan_0041_stern_camp_modifier_desc: "ผู้ติดตามของตัวละครนี้เรียนรู้ที่จะอยู่กับสิ่งที่มีหรืออยู่โดยไม่มี"
