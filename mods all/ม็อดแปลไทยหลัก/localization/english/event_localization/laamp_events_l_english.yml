 ep3_laamp_flavour_ewan.0051.t: "เสียงจอแจอันเป็นมิตร"
 ep3_laamp_flavour_ewan.0051.desc.intro: "เป็นการยากที่จะอธิบายว่าสิ่งใดที่น่าดึงดูดใจอย่างใกล้ชิดเกี่ยวกับเสียงหึ่งๆ ต่ำๆ ของค่ายที่กำลังจะพักผ่อนในยามเย็น\n\nอาจจะเป็น"
 ep3_laamp_flavour_ewan.0051.desc.purpose.wanderers.1: "ขบวนใบหน้าใหม่ที่กระตือรือร้นที่จะหลีกหนีจากชีวิตที่ตั้งรกราก,"
 ep3_laamp_flavour_ewan.0051.desc.purpose.wanderers.2: "เสียงทะเลาะกันในช่วงหัวค่ำเกี่ยวกับการวางแผนสำหรับวันพรุ่งนี้,"
 ep3_laamp_flavour_ewan.0051.desc.purpose.wanderers.3: "เรื่องตลกเศร้าสร้อยเล็กน้อยเกี่ยวกับสิ่งที่จะทำต่อไป,"
 ep3_laamp_flavour_ewan.0051.desc.purpose.mercenaries.1: "เสียงกระทบกันของอาวุธที่ถูกโยนไปมา,"
 ep3_laamp_flavour_ewan.0051.desc.purpose.mercenaries.2: "เสียงหัวเราะก้องกังวานของเหล่านักรบที่เล่าเรื่องตลกหยาบโลน,"
 ep3_laamp_flavour_ewan.0051.desc.purpose.mercenaries.3: "เสียงโห่ร้องและเชียร์อันเป็นเอกลักษณ์ของวงพนันลูกเต๋าที่อยู่ห่างไกล,"
 ep3_laamp_flavour_ewan.0051.desc.purpose.scholars.1: "เสียงขีดเขียนอันน่าสบายใจของปากกาขนนกในบันทึกประจำวันยามค่ำคืน,"
 ep3_laamp_flavour_ewan.0051.desc.purpose.scholars.2: "เสียงโต้เถียงเรื่องเดิมจากเมื่อคืนที่ดังมาจากระยะไกล ซึ่งกลับมาดำเนินต่อโดยไม่ชักช้า,"
 ep3_laamp_flavour_ewan.0051.desc.purpose.scholars.3: "เสียงร้องแสดงความไม่พอใจอย่างหยิ่งยโสจากเหล่าบัณฑิตที่อาศัยอยู่ในถิ่นทุรกันดาร,"
 ep3_laamp_flavour_ewan.0051.desc.purpose.explorers.1: "การสนทนาถึงสถานที่ห่างไกลราวกับว่าพวกเราทุกคนเคยไปที่นั่นมาแล้ว,"
 ep3_laamp_flavour_ewan.0051.desc.purpose.explorers.2: "ความทะเยอทะยานอย่างโจ่งแจ้งที่จะเห็นโลก ซึ่งถูกโอ้อวดอยู่ตลอดเวลา,"
 ep3_laamp_flavour_ewan.0051.desc.purpose.explorers.3: "ความรักที่แท้จริงต่อสิ่งมหัศจรรย์ที่โลกอาจยังคงมีอยู่,"
 ep3_laamp_flavour_ewan.0051.desc.purpose.brigands.1: "ความหิวกระหายในของปล้นและของริบบนใบหน้าของผู้ติดตามทุกคน,"
 ep3_laamp_flavour_ewan.0051.desc.purpose.brigands.2: "ข้อกล่าวหาเรื่องการโกงและคำขู่ฆ่าที่เกิดขึ้นจากการพนัน,"
 ep3_laamp_flavour_ewan.0051.desc.purpose.brigands.3: "การแลกเปลี่ยนเรื่องเล่าอันน่าสยดสยองนอกกระโจมของเพื่อนฝูง,"
 ep3_laamp_flavour_ewan.0051.desc.purpose.legitimists.1: "ความรู้ที่ว่าคนเหล่านี้จะตามข้าไปยัง [ROOT.Char.random_NegativeAfter] หากข้าขอให้พวกเขาทำ,"
 ep3_laamp_flavour_ewan.0051.desc.purpose.legitimists.2: "เสียงพึมพำเงียบๆ ของคำปฏิญาณประจำวันที่ได้รับการยืนยันจากกระโจมเว้นกระโจม,"
 ep3_laamp_flavour_ewan.0051.desc.purpose.legitimists.3: "เรื่องราวเบื้องหลังแห่งชัยชนะและวีรกรรมที่ผู้ติดตามของข้าปั่นเรื่องเกี่ยวกับการกลับมาของข้า"
 ep3_laamp_flavour_ewan.0051.desc.buildings.supply_tent_01: "เสียงรื้อค้นลังและถังจากกระโจมเสบียง,"
 ep3_laamp_flavour_ewan.0051.desc.buildings.supply_tent_sutler: "เสียงร้องเร่ขายของพ่อค้าเร่,"
 ep3_laamp_flavour_ewan.0051.desc.buildings.supply_tent_smithy: "เสียงกรีดร้องสะท้อนของเหล็กกระทบเหล็กจากโรงตีเหล็ก,"
 ep3_laamp_flavour_ewan.0051.desc.buildings.supply_tent_arsenal: "เสียงนับจำนวนอาวุธยุทโธปกรณ์ทุกชิ้นในคลังแสงอย่างตั้งใจ,"
 ep3_laamp_flavour_ewan.0051.desc.buildings.barber_tent_01: "เสียงกรีดร้องและความสุภาพแบบฝืนใจที่ผสมปนเปกันจากกระโจมช่างตัดผม,"
 ep3_laamp_flavour_ewan.0051.desc.buildings.barber_tent_surgeons_tools: "เสียงกรีดร้องที่แทบจะกลั้นไม่อยู่ของสิ่งที่เรียกว่าการผ่าตัด ซึ่งดังมาจากกระโจมช่างตัดผม,"
 ep3_laamp_flavour_ewan.0051.desc.buildings.barber_tent_dentists_tools: "เสียงร้องโหยหวนในลำคอของผู้ติดตามที่ถูกคีมและมืออันมั่นคงจัดการกับฟันผุของพวกเขา,"
 ep3_laamp_flavour_ewan.0051.desc.buildings.barber_tent_torturers_tools: "เสียงกรีดร้องแหบแห้งของค่ายนักโทษที่อยู่ใกล้กระโจมช่างตัดผมเกินไป,"
 ep3_laamp_flavour_ewan.0051.desc.buildings.baggage_train_01: "ความโกลาหลและความสับสนวุ่นวายของขบวนสัมภาระที่คลี่คลายจากการเดินทางมาทั้งวัน,"
 ep3_laamp_flavour_ewan.0051.desc.buildings.baggage_train_ample_steeds: "เสียงร้องของฝูงม้าจำนวนมากของเรา,"
 ep3_laamp_flavour_ewan.0051.desc.buildings.baggage_train_porters: "เสียงเรื่องตลกและเสียงคำรามของคนขนของที่ลากสัมภาระจากที่หนึ่งไปยังอีกที่หนึ่ง,"
 ep3_laamp_flavour_ewan.0051.desc.buildings.baggage_train_trackers: "กลุ่มนักล่าที่เงียบสงัดเคลื่อนไหวเป็นหนึ่งเดียวกันผ่านทางเดินและกระโจมต่างๆ,"
 ep3_laamp_flavour_ewan.0051.desc.buildings.baggage_train_kennel: "เสียงเห่าหอนและเสียงร้องแหลมของคอกสุนัข,"
 ep3_laamp_flavour_ewan.0051.desc.buildings.baggage_train_siege_engineers: "เสียงเอี๊ยดอ๊าดไม่หยุดหย่อนจากเกวียนของวิศวกรขณะที่มันส่งเสียงครวญครางภายใต้น้ำหนักของเสบียงของมันเอง,"
 ep3_laamp_flavour_ewan.0051.desc.buildings.baggage_train_shrine: "แถวผู้ศรัทธาที่มั่นคง ซึ่งวนรอบศาลเจ้าเคลื่อนที่,"
 ep3_laamp_flavour_ewan.0051.desc.buildings.baggage_train_scribes: "ไหวพริบอันแห้งแล้งและการสังเกตการณ์อย่างประชดประชันของอาลักษณ์จำนวนมากที่เดินเตร็ดเตร่อยู่รอบๆ อย่างไร้ประโยชน์,"
 ep3_laamp_flavour_ewan.0051.desc.buildings.baggage_train_bartering_grounds: "เสียงตะโกนและเสียงร้องของทั้งพ่อค้าและผู้ติดตาม ณ ลานแลกเปลี่ยนสินค้า,"
 ep3_laamp_flavour_ewan.0051.desc.buildings.baggage_train_ransom_cages: "เสียงร้องและเสียงครวญครางต่ำๆ ของนักโทษในขื่อคาและกรงขัง,"
 ep3_laamp_flavour_ewan.0051.desc.buildings.baggage_train_pleasure_tents: "กระแสผู้คนที่เดินกลับมาจากกระโจมสำราญอย่างต่อเนื่องพร้อมรอยยิ้มเหม่อลอย,"
 ep3_laamp_flavour_ewan.0051.desc.buildings.mess_tent_01: "เสียงอึกทึกของผู้ติดตามที่หิวโหยดังมาจากกระโจมโรงอาหาร,"
 ep3_laamp_flavour_ewan.0051.desc.buildings.mess_tent_herbalists: "กลิ่นสมุนไพรตากแห้งจากชั้นวางนอกโรงอาหาร,"
 ep3_laamp_flavour_ewan.0051.desc.buildings.mess_tent_brewers: "เสียงของผู้ติดตามที่ส่งเสียงดังเอะอะกำลังมึนเมาจากเบียร์ที่เพิ่งหมักเสร็จใหม่ๆ,"
 ep3_laamp_flavour_ewan.0051.desc.buildings.mess_tent_bakers: "กลิ่นขนมปังที่กำลังขึ้นฟูสำหรับมื้อเย็น,"
 ep3_laamp_flavour_ewan.0051.desc.buildings.mess_tent_cooks: "การโต้เถียงตามปกติระหว่างพ่อครัวเกี่ยวกับเรื่องหยุมหยิมเล็กน้อยที่คนหนึ่งบังคับให้คนอื่นทำ,"
 ep3_laamp_flavour_ewan.0051.desc.buildings.camp_fire_01: "กลิ่นกองไฟที่เพิ่งเริ่มจุด,"
 ep3_laamp_flavour_ewan.0051.desc.buildings.camp_fire_trailing_musicians: "เสียงประสานอันไพเราะของนักดนตรีที่ติดตามเรามาเริ่มบรรเลง,"
 ep3_laamp_flavour_ewan.0051.desc.buildings.camp_fire_wandering_poets: "เสียงหอบหายใจอย่างตกใจของผู้ติดตามที่ฟังบทกวีลามก,"
 ep3_laamp_flavour_ewan.0051.desc.buildings.camp_fire_capering_fools: "การแสดงตลกบิดเบี้ยวของตัวตลกที่วิ่งไปมาระหว่างกองไฟ,"
 ep3_laamp_flavour_ewan.0051.desc.buildings.camp_fire_local_hangers_on: "ชาวบ้านที่อยากรู้อยากเห็นปรากฏตัวขึ้นและมองดูคนแปลกหน้าจำนวนมากด้วยความกลัวและความประหลาดใจ,"
 ep3_laamp_flavour_ewan.0051.desc.buildings.camp_fire_juicy_rumors: "เสียงหอบหายใจอย่างตกใจของข่าวลือที่เริ่มแพร่กระจายไปรอบๆ กองไฟแล้ว,"
 ep3_laamp_flavour_ewan.0051.desc.buildings.proving_grounds_01: "เสียงตะโกนและเสียงกรีดร้องด้วยความหงุดหงิดจากระยะไกลจากลานฝึกซ้อม,"
 ep3_laamp_flavour_ewan.0051.desc.buildings.proving_grounds_horse_run: "เสียงกีบเท้าดังกระหึ่มขณะที่ทหารม้าเบาของเราฝึกฝนศิลปะของพวกเขา,"
 ep3_laamp_flavour_ewan.0051.desc.buildings.proving_grounds_camel_run: "เสียงกีบเท้าดังสนั่นและเสียงร้องแหลมคล้ายเห่าของอูฐที่ดังมาจากระยะไกล,"
 ep3_laamp_flavour_ewan.0051.desc.buildings.proving_grounds_elephantry_reserve: "เสียงร้องแปร๋นอย่างไม่พอใจของช้าง,"
 ep3_laamp_flavour_ewan.0051.desc.buildings.proving_grounds_nightly_barding_drills: "เสียงคำรามและเสียงกระทบกันดังมาจากทหารม้าหนักที่กำลังซ่อมแซมและบำรุงรักษาเกราะของพวกเขา,"
 ep3_laamp_flavour_ewan.0051.desc.buildings.proving_grounds_the_stump: "เสียง #EMP ทวิก#! เป็นระยะๆ ขณะที่การยิงธนูอีกชุดหนึ่งถูกปล่อยไปยัง [ROOT.Char.Custom('GetStumpName')] ของวันนี้,"
 ep3_laamp_flavour_ewan.0051.desc.buildings.proving_grounds_personal_bouts: "เสียงโห่ร้องแห่งความสำเร็จและเสียงเชียร์เยาะเย้ยจากนักสู้ตัวต่อตัว,"
 ep3_laamp_flavour_ewan.0051.desc.buildings.proving_grounds_training_circle: "เสียงกระทบกันของโล่ต่อโล่จากวงฝึกซ้อม,"
 ep3_laamp_flavour_ewan.0051.desc.buildings.proving_grounds_mock_battle_drills: "เสียงอึกทึกที่เบาลงของการรบจำลองขณะที่พลหอกฝึกฝนระเบียบวินัยร่วมกัน,"
 ep3_laamp_flavour_ewan.0051.desc.buildings.proving_grounds_the_stick_game: "เสียงสบถ #EMP หยาบคาย#! อย่างแท้จริงเป็นครั้งคราวเมื่อมีคนแพ้เกมไม้,"
 ep3_laamp_flavour_ewan.0051.desc.buildings.proving_grounds_bodyguard_drills: "เสียงตะโกนแหบแห้งขององครักษ์ของข้าที่ฝึกซ้อมอย่างสุดกำลัง,"
 ep3_laamp_flavour_ewan.0051.desc.buildings.camp_perimeter_01: "เสียงคำสั่งตะคอกและเสียงฝีเท้าเดินย่ำ ซึ่งเป็นเครื่องหมายของการจัดตั้งแนวป้องกันของเรา,"
 ep3_laamp_flavour_ewan.0051.desc.buildings.camp_perimeter_fixed_layout: "เสียงโต้เถียงเงียบๆ และเสียงถอนหายใจอย่างจำยอมขณะที่รูปแบบที่กำหนดไว้ของเรายุติการโต้เถียงเรื่องการตั้งกระโจมแทนข้า,"
 ep3_laamp_flavour_ewan.0051.desc.buildings.camp_perimeter_palisade: "เสียงเคาะไม้กระทบไม้ขณะที่หอสังเกตการณ์ชั่วคราวกำลังถูกสร้างขึ้นสำหรับคืนนี้,"
 ep3_laamp_flavour_ewan.0051.desc.buildings.camp_perimeter_ditch: "เสียงพลั่วขุดลงไปในดินขณะที่หน่วยยามคืนนี้ฝึกซ้อมการขุดคูจำลอง,"
 ep3_laamp_flavour_ewan.0051.desc.buildings.fallback: "ความกระตือรือร้นอันเกิดจากการพักแรมใต้ฟ้ากว้าง,"
 ep3_laamp_flavour_ewan.0051.desc.followers.connector: "หรือแม้แต่"
 ep3_laamp_flavour_ewan.0051.desc.followers.courtier_relations.friends: "การหยอกล้ออย่างเป็นกันเองของ [courtier_friend_1.GetFirstName] และ [courtier_friend_2.GetFirstName] ที่เดินสวนสนามผ่านกระโจมของข้า"
 ep3_laamp_flavour_ewan.0051.desc.followers.courtier_relations.best_friends: "การเหน็บแนมอย่างรักใคร่ของ [courtier_best_friend_1.GetFirstName] และ [courtier_best_friend_2.GetFirstName] ขณะที่เพื่อนสนิททั้งสองทำธุระยามเย็น"
 ep3_laamp_flavour_ewan.0051.desc.followers.courtier_relations.rivals: "การเหน็บแนมอย่างขมขื่นของ [courtier_rival_1.GetFirstName] และ [courtier_rival_2.GetFirstName] ที่ทะเลาะกันเหมือนเคย"
 ep3_laamp_flavour_ewan.0051.desc.followers.courtier_relations.nemeses: "เสียงคำรามที่แทบจะกลั้นไม่อยู่ของ [courtier_nemesis_1.GetFirstName] และ [courtier_nemesis_2.GetFirstName] ที่ใช้โอกาสตามปกติของพวกเขาในการตะคอกใส่กัน"
 ep3_laamp_flavour_ewan.0051.desc.followers.courtier_relations.lovers: "เสียงหัวเราะคิกคักและเสียงกระซิบของ [courtier_lover_1.GetFirstName] และ [courtier_lover_2.GetFirstName] ที่เดินผ่านไปคล้องแขนกันในการเดินเล่นตามปกติของพวกเขา"
 ep3_laamp_flavour_ewan.0051.desc.followers.courtier_relations.soulmates: "คำพูดหวานเลี่ยนที่ส่งผ่านระหว่าง [courtier_soulmate_1.GetFirstName] และ [courtier_soulmate_2.GetFirstName] ที่เดินผ่านไปอย่างหวานชื่นเหมือนเคย"
 ep3_laamp_flavour_ewan.0051.desc.followers.courtier_count.many_children: "เสียงหัวเราะคิกคักและเสียงหัวเราะก้องของเด็กๆ จำนวนมากที่กำลังเล่นกัน ขณะที่ [leading_child.GetFirstName] กรีดร้องวิ่งผ่านข้าไป นำเกมวิ่งไล่จับ"
 ep3_laamp_flavour_ewan.0051.desc.followers.courtier_count.many_knights: "เสียงตะโกนของ [leading_knight.GetFirstName] ขณะที่ [leading_knight.GetSheHe] นำเหล่า $knight_culture_player_plural_no_tooltip$ ในการประลองประจำวันของพวกเขา"
 ep3_laamp_flavour_ewan.0051.desc.followers.courtier_count.many_languages: "ภาษามากมายที่ผู้คนเดินผ่านไปมาพูดกัน ตั้งแต่ [culture_1.GetLanguage.GetNameNoTooltip] ถึง [culture_2.GetLanguage.GetNameNoTooltip] ถึง [culture_3.GetLanguage.GetNameNoTooltip]"
 ep3_laamp_flavour_ewan.0051.desc.followers.courtier_count.many_faiths: "เสียงสวดมนต์ยามเย็นที่ดังขึ้นถึง [faith_1.GetAdjective] [faith_1.HealthGodName], [faith_2.GetAdjective] [faith_2.HouseholdGodName], และ [faith_3.GetAdjective] [faith_3.NightGodName]"
 ep3_laamp_flavour_ewan.0051.desc.followers.notable_char.intro: "เสียงที่คุ้นเคยของ [notable_char.GetFirstName]"
 ep3_laamp_flavour_ewan.0051.desc.followers.notable_char.lustful: "กำลังจีบผู้ติดตามที่น่าสงสารบางคน"
 ep3_laamp_flavour_ewan.0051.desc.followers.notable_char.gluttonous: "กำลังสวาปามอาหารท้องถิ่นสดใหม่บางอย่าง"
 ep3_laamp_flavour_ewan.0051.desc.followers.notable_char.temperate: "กำลังเทศนาให้ใครบางคนฟังถึงอันตรายของการกินอาหารเย็นมากเกินไปอย่างได้ยินชัด"
 ep3_laamp_flavour_ewan.0051.desc.followers.notable_char.greedy: "กำลังนับเหรียญของพวกเขา — ครั้งที่สองจากสามครั้ง เพื่อให้แน่ใจจริง ๆ ว่าพวกเขาไม่ได้ทำหายไประหว่างการเดินทัพ"
 ep3_laamp_flavour_ewan.0051.desc.followers.notable_char.generous: "กำลังหัวเราะขณะที่ [notable_char.GetSheHe] โยนเหรียญให้ผู้ติดตามผู้โชคดีบางคน"
 ep3_laamp_flavour_ewan.0051.desc.followers.notable_char.lazy: "หาข้ออ้างอย่างสบายๆ ให้ [notable_char.GetHerselfHimself] ไม่ต้องกางกระโจมของ [notable_char.GetHerHis] เอง — อีกแล้ว"
 ep3_laamp_flavour_ewan.0051.desc.followers.notable_char.diligent: "กำลังจัดระเบียบผู้ติดตามชั้นผู้น้อยหลายคนขณะที่พวกเขาทำงานบ้านยามเย็น"
 ep3_laamp_flavour_ewan.0051.desc.followers.notable_char.wrathful: "กำลังกรีดร้องใส่ผู้ติดตามผู้โชคร้ายบางคน"
 ep3_laamp_flavour_ewan.0051.desc.followers.notable_char.calm: "กำลังระงับเหตุทะเลาะวิวาทระหว่างผู้ติดตามชั้นผู้น้อยสองคน"
 ep3_laamp_flavour_ewan.0051.desc.followers.notable_char.patient: "กำลังพยักหน้าและส่งเสียงเห็นด้วยขณะที่ชาวบ้านคนหนึ่งเล่าเรื่องยาวยืด"
 ep3_laamp_flavour_ewan.0051.desc.followers.notable_char.impatient: "กำลังขัดจังหวะเรื่องเล่าของใครบางคนเพื่อบอกให้พวกเขาเข้าประเด็นเสียที"
 ep3_laamp_flavour_ewan.0051.desc.followers.notable_char.arrogant: "กำลังเรียกผู้ติดตามชั้นผู้น้อยหลายคนมาจัดการงานหยุมหยิมให้ [notable_char.GetHerHim] อย่างสบายๆ"
 ep3_laamp_flavour_ewan.0051.desc.followers.notable_char.humble: "กำลังหยุดช่วยคนอื่นกางกระโจม"
 ep3_laamp_flavour_ewan.0051.desc.followers.notable_char.deceitful: "กำลังอยู่ระหว่างการเล่าเรื่องยาวที่น่าสงสัยให้ชาวบ้านที่เชื่อง่ายคนหนึ่งฟัง"
 ep3_laamp_flavour_ewan.0051.desc.followers.notable_char.honest: "กำลังอธิบายปัญหาที่น่าอึดอัดใจบางอย่างให้ชาวบ้านที่หงุดหงิดคนหนึ่งฟัง"
 ep3_laamp_flavour_ewan.0051.desc.followers.notable_char.gregarious: "กำลังหัวเราะและพูดตลกกับผู้ติดตามชั้นผู้น้อยบางคน"
 ep3_laamp_flavour_ewan.0051.desc.followers.notable_char.arbitrary: "กำลังเรียกร้องให้ใครบางคนสลับกระโจมกับ [notable_char.GetHerHim] — อีกแล้ว"
 ep3_laamp_flavour_ewan.0051.desc.followers.notable_char.just: "กำลังเทศนาใครบางคนอย่างได้ยินชัดเจนดังและมั่นใจราวกับ [notable_char.GetLadyLord] ในราชสำนัก"
 ep3_laamp_flavour_ewan.0051.desc.followers.notable_char.cynical: "กำลังเยาะเย้ยการสวดมนต์ยามค่ำคืนของใครบางคน"
 ep3_laamp_flavour_ewan.0051.desc.followers.notable_char.zealous: "กำลังนำกลุ่มผู้ติดตามผู้ศรัทธากลุ่มเล็กๆ ในการนมัสการ"
 ep3_laamp_flavour_ewan.0051.desc.followers.notable_char.paranoid: "กำลังพึมพำและบ่นกับ [notable_char.GetHerselfHimself]"
 ep3_laamp_flavour_ewan.0051.desc.followers.notable_char.trusting: "กำลังฟังเรื่องยาวที่น่าสงสัยของคนโง่บางคนอย่างเชื่อง่าย"
 ep3_laamp_flavour_ewan.0051.desc.followers.notable_char.compassionate: "ขึ้นไปบนแท่นเทศน์ของ [notable_char.GetHerHis] เกี่ยวกับใครบางคนที่ถูกกล่าวหาว่าเตะสุนัข"
 ep3_laamp_flavour_ewan.0051.desc.followers.notable_char.callous: "กำลังฟังเรื่องเศร้าของชาวบ้านบางคนอย่างไม่แยแส"
 ep3_laamp_flavour_ewan.0051.desc.followers.notable_char.sadistic: "กำลังหัวเราะอย่างมุ่งร้ายกับเรื่องเศร้าของชาวบ้านบางคน"
 ep3_laamp_flavour_ewan.0051.desc.followers.notable_char.stubborn: "ยืนหยัดอย่างดื้อรั้นในจุดยืนของ [notable_char.GetHerHis] ต่อต้านกลุ่มชาวบ้านที่โกรธแค้น"
 ep3_laamp_flavour_ewan.0051.desc.followers.notable_char.fickle: "กำลังโต้เถียงอย่างสับสนกับใครบางคน สลับจุดยืนของ [notable_char.GetHerHis] ไปมาทุกประโยคเว้นประโยค"
 ep3_laamp_flavour_ewan.0051.desc.followers.notable_char.vengeful: "กำลังสาบานว่าจะล้างแค้นข้ามรุ่นกับใครบางคน เพราะ... เรื่องอะไรสักอย่าง"
 ep3_laamp_flavour_ewan.0051.desc.followers.notable_char.fallback: "กำลังฮัมเพลงกับ [notable_char.GetHerselfHimself] ขณะที่ [notable_char.GetSheHe] เดินผ่านไป"
 ep3_laamp_flavour_ewan.0051.desc.followers.fallback.1: "เสียงร้องแหลมกึ่งห่างไกลของล่อที่ดื้อรั้นกำลังถูกนำเข้าคอกสำหรับตอนเย็น"
 ep3_laamp_flavour_ewan.0051.desc.followers.fallback.2: "เสียงร้องจิ๊บๆ ของนกท้องถิ่นขณะที่กลางคืนเริ่มคืบคลานเข้ามา"
 ep3_laamp_flavour_ewan.0051.desc.followers.fallback.3: "เสียงตอกตะปูเป็นจังหวะดังทุบๆ ลงไปในพื้นดินอ่อนรอบตัวข้า"
 ep3_laamp_flavour_ewan.0051.desc.outro: "\n\nทั้งหมดนี้ก่อตัวเป็นผ้าห่มแห่งความคุ้นเคยที่เงียบสงบและปลอบโยน นี่คืออาณาเขตของข้า และนี่คือผู้คนของข้า — อาณาจักรเล็กๆ แต่เป็นที่ที่ข้ารู้จักทุกภาพ ทุกเสียง และทุกวิญญาณ"
 ep3_laamp_flavour_ewan.0051.a: "กลับไปที่กระโจมของข้าและเพียงแค่ฟัง"
 ep3_laamp_flavour_ewan.0051.b: "ตรวจสอบเสบียงของเรา"
 ep3_laamp_flavour_ewan.0051.c.bald.female: "บางทีข้าควรจะให้ตรวจธาตุในร่างกาย?"
 ep3_laamp_flavour_ewan.0051.c.bald.male: "บางทีควรจะโกนหนวด?"
 ep3_laamp_flavour_ewan.0051.c.hairy.male: "บางทีควรจะโกนหนวดและตัดผม?"
 ep3_laamp_flavour_ewan.0051.c.fallback: "บางทีควรจะตัดผม?"
 ep3_laamp_flavour_ewan.0051.d: "ถึงเวลาควบคุมความโกลาหลของขบวนสัมภาระแล้ว..."
 ep3_laamp_flavour_ewan.0051.e: "ควรไปทานอาหารของข้าก่อนที่โรงอาหารจะเต็มไปด้วยผู้คน"
 ep3_laamp_flavour_ewan.0051.f: "ข้าคิดว่าข้าจะไปนั่งที่ประจำที่กองไฟ"
 ep3_laamp_flavour_ewan.0051.g: "การฝึกซ้อมยามค่ำคืนไม่รอ [ROOT.Char.GetWomanMan] คนใด"
 ep3_laamp_flavour_ewan.0051.h: "การเดินเล่นตามแนวป้องกันฟังดูน่าพอใจ"
 ep3_laamp_flavour_ewan_0051_check_building_supply_tent_modifier: "เสบียงเรียบร้อยดี"
 ep3_laamp_flavour_ewan_0051_check_building_supply_tent_modifier_desc: "การลงมือทำด้วยตนเองช่วยกระตุ้นให้เกิดการบันทึกที่แม่นยำจริงๆ"
 ep3_laamp_flavour_ewan_0051_check_building_barber_tent_modifier: "ดูไร้ที่ติ"
 ep3_laamp_flavour_ewan_0051_check_building_barber_tent_modifier_desc: "ชีวิตที่ต้องเดินทางไม่ใช่ข้ออ้างที่จะละเลยการดูแลตนเอง"
 ep3_laamp_flavour_ewan_0051_check_building_baggage_train_modifier: "ขบวนมีระเบียบวินัย"
 ep3_laamp_flavour_ewan_0051_check_building_baggage_train_modifier_desc: "ขบวนสัมภาระคือการผสมผสานที่วุ่นวายของผู้คน — เว้น แต่ท่านจะควบคุมพวกเขาไว้อย่างมั่นคง"
 ep3_laamp_flavour_ewan_0051_check_building_mess_tent_modifier: "กินข้าวกับค่าย"
 ep3_laamp_flavour_ewan_0051_check_building_mess_tent_modifier_desc: "ผู้นำไม่จำเป็นต้องร่วมโต๊ะอาหารกับคนของตน แต่ก็ช่วยได้"
 ep3_laamp_flavour_ewan_0051_check_building_camp_fire_modifier: "ผู้นำแห่งวงล้อม"
 ep3_laamp_flavour_ewan_0051_check_building_camp_fire_modifier_desc: "ตำแหน่งที่สั่งการได้ก่อให้เกิดท่าทางที่สั่งการได้"
 ep3_laamp_flavour_ewan_0051_check_building_proving_grounds_modifier: "ฝึกซ้อมเสมอ"
 ep3_laamp_flavour_ewan_0051_check_building_proving_grounds_modifier_desc: "การเหลือบมองอย่างมั่นคงจากเบื้องบนช่วยเรื่องระเบียบวินัยได้อย่างน่าอัศจรรย์"
 ep3_laamp_flavour_ewan_0051_check_building_camp_perimeter_modifier: "เฝ้าดูผู้เฝ้ายาม"
 ep3_laamp_flavour_ewan_0051_check_building_camp_perimeter_modifier_desc: "การเดินตรวจตราแนวป้องกันยามค่ำคืน ทำให้ทหารยามตื่นตัวอยู่เสมอ"

 ep3_laamp_flavour_ewan.0061.t: "งานออกร้านที่ไม่คาดคิด"
 ep3_laamp_flavour_ewan.0061.desc: "แม้ว่าไม่ใช่ทุกที่จะต้อนรับค่าย เช่นของเรา แต่ดูเหมือนว่า [current_county.GetBaseNameNoTier] จะต้อนรับอย่างแน่นอน — หรืออย่างน้อย [local_merchant.GetFirstName] ก็ ทำให้มัน #EMP ดูเหมือน#! เป็น เช่นนั้น โดยการจัดงานออกร้านอย่างกะทันหันเพื่อแลกเปลี่ยนสินค้าและรีดไถเงินจากผู้ติดตามของข้า\n\nดูถูกเหยียดหยาม? อาจจะใช่ แต่มันยากที่จะปฏิเสธว่ามันสร้างรอยยิ้มบนใบหน้าของคนส่วนใหญ่ได้มากเพียงใด และบางครั้งนั่นก็เพียงพอแล้ว"
 ep3_laamp_flavour_ewan.0061.tt.everyone_loves_faires: "ทุกคนชอบงานออกร้าน"
 ep3_laamp_flavour_ewan.0061.a: "ช่างเป็นเรื่องน่าประหลาดใจที่น่ายินดี!"
 ep3_laamp_flavour_ewan.0061.b: "บางที [local_merchant.GetFirstNameNoTooltip] อาจจะอยากได้งาน..."
 ep3_laamp_flavour_ewan.0061.c: "หาเสบียงเพิ่มขณะที่เราอยู่ที่นี่"
 ep3_laamp_flavour_ewan.0061.d: "ข้าคิดว่าข้าจะอยู่ที่ค่ายเหมือนเดิม"

 ep3_laamp_flavour_ewan.0071.t: "เสียงกีบเท้าดังกระหึ่ม"
 ep3_laamp_flavour_ewan.0071.desc: ""อ๊ากกก #EMP หัว#! ข้า!" [hanger.GetFirstName] คร่ำครวญขณะที่ [hanger.GetSheHe] ขี่ม้าอยู่ข้างๆ ข้า ข้าเลิกคิ้วขึ้นเป็นการสอบถามอย่างเงียบๆ ต่อเสียงอุทานของ [hanger.GetWomanMan]\n\nในการตอบสนอง [hanger.GetFirstNameNoTooltip] เพียงแค่ทรุดตัวลงบนหลังม้าของ [hanger.GetHerHis] คร่ำครวญและกุมขมับของ [hanger.GetHerHis]\n\nเห็นได้ชัดว่า #EMP ใครบางคน#! มีค่ำคืนที่ดีเมื่อคืนนี้"
 ep3_laamp_flavour_ewan.0071.a: "ชะลอความเร็วให้ [hanger.GetHerHim]"
 ep3_laamp_flavour_ewan.0071.b: "หัวเราะเยาะสถานการณ์ที่ยากลำบากของ [hanger.GetHerHis]"
 ep3_laamp_flavour_ewan.0071.c: "เตะม้าของ [hanger.GetHerHis] ให้เคลื่อนที่"
 ep3_laamp_flavour_ewan.0071.d: "ขี่ม้าต่อไป ทิ้ง [hanger.GetHerHim] ไว้กับความทุกข์ทรมานของ [hanger.GetHerHis]"

 ##################################################
 # CHILDREARING

 ep3_laamp_flavour_ewan.1001.t: "เพื่อนในที่ต่ำต้อย"
 ep3_laamp_flavour_ewan.1001.desc: ""[ROOT.Char.GetMotherFather|U], [ROOT.Char.GetMotherFather]!" [own_child.Custom('GetDaughterSon')] ของข้าร้องเรียกขณะที่ [own_child.GetSheHe] วิ่งมาหาข้า "ข้าอยากให้ท่านพบใครบางคน!"\n\n[own_child.Custom('GirlBoy')] หันไปแนะนำเด็กอีกคน กางแขนของ [own_child.GetHerHis] ออกกว้างราวกับกำลังถวายของขวัญของ [ROOT.Char.GetFaith.HighGodNamePossessive] แก่ผู้ศรัทธา แทนที่จะเป็นสิ่งที่ดูเหมือนคนชั้นต่ำซอมซ่อ\n\n"นี่คือ [other_child.GetFirstName] เพื่อนเล่นคนใหม่ของข้า #EMP สักวันหนึ่ง#! [other_child.GetSheHe] จะช่วยข้าดูแลค่ายนี้""
 ep3_laamp_flavour_ewan.1001.set_best_friendship: "เราสู้กับโลก"
 ep3_laamp_flavour_ewan.1001.set_friendship: "มิตรภาพถือกำเนิดขึ้น"
 ep3_laamp_flavour_ewan.1001.set_hidden_potential_friendship: "เพื่อนเล่นคนโปรด"
 ep3_laamp_flavour_ewan.1001.friendship_fizzles: "มิตรภาพจางหายไป"
 ep3_laamp_flavour_ewan.1001.a: "ฮ่าๆ ไปวิ่งเล่นกันเถอะ เจ้าสองคน"
 ep3_laamp_flavour_ewan.1001.b: "ข้าคิดว่าเจ้าได้เพื่อนแท้แล้วล่ะ [own_child.Custom('GetDaughterSon')] ของข้า"
 ep3_laamp_flavour_ewan.1001.c: "[own_child.GetFirstNameNoTooltip], [other_child.GetSheHe] ต่ำต้อยกว่าเจ้า"
 
 ep3_laamp_flavour_ewan.1011.t: "เรียนรู้จากตัวอย่าง"
 ep3_laamp_flavour_ewan.1011.desc: "[child.GetFirstName|U] อยู่ในวัยที่เด็กจะซึมซับทุกสิ่งทุกอย่างรอบตัว [child.GetHerHim] เหมือนฟองน้ำดูดซับน้ำ\n\nแม้ว่าสถานการณ์ปัจจุบันจะ ทำให้ข้าไม่สามารถให้การศึกษาที่ดีที่สุดแก่ [child.GetHerHim] ได้ แต่ [child.Custom('GetLassLad')] หนุ่มสาวก็ดูเหมือนจะกระตือรือร้นที่จะเรียนรู้ไม่น้อยลงเลย แทนที่จะมีครูสอนพิเศษและหนังสือที่คนที่มีฐานะ... มั่นคงกว่าอาจรู้สึกว่ามีสิทธิ์ได้รับ [child.GetSheHe] กลับเดินเตร็ดเตร่ไปทั่วค่าย ติดตามนายทหารของข้าและช่วยเหลือพวกเขาในหน้าที่อย่างกระตือรือร้น\n\nการผลักดันเล็กน้อยไปยังใครบางคนโดยเฉพาะน่าจะช่วยให้ความพยายามของ [child.GetHerHis] มีจุดมุ่งหมายมากขึ้นได้อย่างน่าอัศจรรย์"
