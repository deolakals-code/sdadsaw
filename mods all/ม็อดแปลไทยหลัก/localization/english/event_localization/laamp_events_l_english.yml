 ep3_laamp_flavour_ewan.4064.t: "$ep3_laamp_flavour_ewan.4061.t$: ชัยชนะในการประลอง"
 ep3_laamp_flavour_ewan.4064.desc: "ร่างของมนุษย์กินคนล้มหงายหลัง เลือดพุ่งกระฉูดออกมาก่อนแล้วจึงค่อยๆ ไหลรินจากบาดแผลฉกรรจ์[cannibal.GetHerHis]\n\nไม่ใช่ผลลัพธ์ที่ข้าคาดหวังไว้แน่ แต่โลกก็ไม่อาจกล่าวได้ว่าข้าไม่ได้สังหารมนุษย์กินคนไปแล้ว\n\nขณะที่ความตึงเครียดจากการต่อสู้คลายออกจากร่างของข้า เสียงโห่ร้องยินดีก็ดังขึ้นจากคณะล่าสัตว์ที่เหลือ ข้ามอง[cannibal.GetWomanMan]ที่นอนตายอยู่บนพื้นเป็นครั้งสุดท้าย แล้วหันหลังกลับบ้าน"
 ep3_laamp_flavour_ewan.4064.a.is_cannibal: "เอาล่ะ ตอนนี้ #EMP ข้า#! ชักหิวแล้วสิ..."
 ep3_laamp_flavour_ewan.4064.a.not_cannibal: "ความบ้าคลั่งอันวิปริต"

 ep3_laamp_flavour_ewan.4071.t: "นักล่าทาส"
 ep3_laamp_flavour_ewan.4071.desc: "การซุ่มโจมตีเริ่มขึ้นอย่างเชี่ยวชาญ\n\nจุดคอขวดที่เปราะบางในภูมิประเทศเปิดโอกาสให้ฝูงนักล่าทาส — ในมือถือตรวนและดาบ — รุมล้อมเราจากสองด้าน ขณะที่กลุ่มที่สามคอยขัดขวางกองกำลังหลักของขบวนไม่ให้เข้ามาช่วยเราได้ เสียงกรีดร้องดังระงมจากผู้ติดตามที่ไม่มีอาวุธเมื่อตระหนักถึงสถานการณ์\n\nหากอสูรร้ายเหล่านี้ชนะ ชะตากรรมอันน่าสะพรึงกลัวรอคอยพวกเราหลายคนอยู่"
 ep3_laamp_flavour_ewan.4071.a: "รวมพล! รวมพลแล้วสังหารไอ้เดนมนุษย์พวกนี้ซะ!"
 ep3_laamp_flavour_ewan.4071.a.tt.success: "กองกำลังป้องกันของเจ้าบุกไปข้างหน้า"
 ep3_laamp_flavour_ewan.4071.a.tt.failure: "การตะลุมบอนอันโหดร้าย"
 ep3_laamp_flavour_ewan.4071.b: "เข้าประลองกับหัวหน้านักล่าทาส"
 ep3_laamp_flavour_ewan.4071.c: "ต่อรองราคาและขายผู้ติดตามชั้นผู้น้อยบางส่วน"
 ep3_laamp_flavour_ewan.4071.c.sale_explanation.profit: "เจ้าจะได้รับเงิน [gold|E] เทียบเท่ากับผลรวม [skills|E] ของ [followers|E] ที่แย่ที่สุดห้าคนของเจ้า"
 ep3_laamp_flavour_ewan.4071.c.sale_explanation.limitations: "ผู้ใดก็ตามที่มีความสำคัญต่อเจ้า มีทักษะพิเศษ หรือเป็นโรคหรือบาดเจ็บ จะได้รับการยกเว้นจากการขาย"
 ep3_laamp_flavour_ewan.4071.c.sale_explanation.death: "การขาย [character|E] ไปเป็นทาสจะนำพวกเขาออกจากเกม ซึ่งมีผลเทียบเท่ากับ [character_death_death|E]"
 ep3_laamp_flavour_ewan.4071.d: "เมินเสียงร้องและหวังให้ดีที่สุด"
 ep3_laamp_flavour_ewan.4071.d.tt.success: "[ROOT.Char.GetFaith.FateGodName] ยิ้มให้เจ้า"
 ep3_laamp_flavour_ewan.4071.d.tt.failure: "เสียงร้องโหยหวนค่อยๆ จางหายไปในยามค่ำคืน"

 ep3_laamp_flavour_ewan.4073.t: "$ep3_laamp_flavour_ewan.4071.t$: ชัยชนะในการประลอง"
 ep3_laamp_flavour_ewan.4073.desc: "ความตายของ[slaver.GetWomanMan] ส่งผลให้เกิดความสับสนอลหม่านในหมู่ศัตรู\n\nการต่อสู้รอบตัวข้าเปลี่ยนทิศทาง เสียงกรีดร้องและเสียงครืดครากดังขึ้นจากฝ่ายศัตรูขณะที่พ่อค้าทาสถูกสังหารด้วยดาบนับสิบ ตายกันเป็นเบือ ภายในไม่กี่นาที กองกำลังเสริมจากกองกำลังหลักของขบวนก็ฝ่าแนวหลังของนักล่าทาสเข้ามาได้ และทุกอย่างก็จบลง\n\nด้วยการเตะอย่างดูถูกเหยียดหยาม ข้า ทำให้สิ่งที่เหลืออยู่ของหัวหน้าพวกมันคว่ำหน้าลงไปใน[ROOT.Char.Custom('GritType')]"
 ep3_laamp_flavour_ewan.4073.a: "นี่คือสิ่งที่ข้าคิดกับเจ้า ไอ้เดนมนุษย์"

 ep3_laamp_flavour_ewan.4081.t: "กำเนิดจากความสิ้นหวัง"
 ep3_laamp_flavour_ewan.4081.desc.intro: "ตอนแรก เราเห็นเพียงชาวนาชาว[current_county.GetCountyData.GetCulture.GetName] ซูบผอมไม่กี่คน พวกเขาปรากฏตัวอยู่ไกลๆ หรือแอบมองอยู่หลังสิ่งต่างๆ ในภูมิประเทศ แล้วหนีไปเมื่อเราสังเกตเห็น\n\nหลายชั่วโมงผ่านไป ชาวบ้านที่ตื่นตกใจง่ายเหล่านี้ยังคงจับตามองเราจากระยะไกลตลอดเวลา\n\nทันทีที่ดูเหมือนว่าพวกเขาจะถอยกลับไปในที่สุด เสียงร้องตะโกนก็ดังขึ้น และฝูงชนคลุ้มคลั่งก็พุ่งเข้าใส่เราจากที่กำบังบนสันเขา ด้วยดวงตาเบิกโพลงและผอมแห้ง"
 ep3_laamp_flavour_ewan.4081.desc.epidemic: "พวกเขาดูป่วยไข้ ติดเชื้อโรคร้ายแรงบางอย่างอย่างไม่ต้องสงสัย —"
 ep3_laamp_flavour_ewan.4081.desc.mundane: "พวกเขาดูเปราะบาง อยู่ในระยะเริ่มต้นของความอดอยากอย่างไม่ต้องสงสัย —"
 ep3_laamp_flavour_ewan.4081.desc.outro: "แม้จะไม่ถึงกับอ่อนแอจนไม่สามารถปล้นเสบียงของเราไปได้มากก่อนที่จะถูกขับไล่ไป"
 ep3_laamp_flavour_ewan.4081.a: "พยายาม ทำให้ฝูงชนสงบลง"
 ep3_laamp_flavour_ewan.4081.a.tt.success: "เจ้าพูดเกลี้ยกล่อมฝูงชนได้สำเร็จ"
 ep3_laamp_flavour_ewan.4081.a.tt.failure: "คำพูดมีความหมายเพียงเล็กน้อยสำหรับพวกเขา"
 ep3_laamp_flavour_ewan.4081.b: "หากพวกเขาต้องการเสบียง พวกเขาต้อง #EMP จ่าย!#!"
 ep3_laamp_flavour_ewan.4081.b.tt.success: "กำไรเป็นกอบเป็นกำ"
 ep3_laamp_flavour_ewan.4081.b.tt.success.every_compassionate_or_generous_follower: "[follower|E] ทุกคนที่ [GetTrait('compassionate').GetName( GetNullCharacter )] หรือ [GetTrait('generous').GetName( GetNullCharacter )]"
 ep3_laamp_flavour_ewan.4081.b.tt.success.every_callous_greedy_or_sadistic_follower: "[follower|E] ทุกคนที่ [GetTrait('greedy').GetName( GetNullCharacter )] หรือ [GetTrait('sadistic').GetName( GetNullCharacter )]"
 ep3_laamp_flavour_ewan.4081.b.tt.failure: "ความคลั่ง เพราะความหิวโหย"
 ep3_laamp_flavour_ewan.4081.c: "ขับไล่ฝูงชนไร้ระเบียบนี้กลับไป"
 ep3_laamp_flavour_ewan.4081.c.tt.success: "บริวารติดอาวุธของเจ้าหักกระดูกพวกเขาได้มากพอ"
 ep3_laamp_flavour_ewan.4081.c.tt.failure: "เจ้าหยุดพวกเขาทั้งหมดไม่ได้"
 ep3_laamp_flavour_ewan.4081.d: "ปล่อยให้พวกเขาเอาเสบียงไปบ้าง"

 ep3_laamp_flavour_ewan.4091.t: "การโจมตียามค่ำคืน"
 ep3_laamp_flavour_ewan.4091.desc: "เป็นเวลากลางคืนเมื่อผู้โจมตีบุกเข้ามายังแนวป้องกันรอบนอกของเรา เป็นภาพของเกราะสะท้อนแสงและอาวุธแวววาวที่หลากหลาย ส่องสว่างเพียงด้วยแสงไฟจากระยะไกล\n\nหากพวกเขาสวมสัญลักษณ์ใดๆ ก็มองไม่เห็น แต่เจตนาของพวกเขาก็ชัดเจนพออยู่แล้ว กำจัดเราออกจาก[current_county.GetBaseNameNoTier] ไม่ว่าจะตายหรือเป็น\n\nอย่างไรก็ตาม ค่ายก็ไม่ได้ไร้ผู้ป้องกัน และด้วยเสียงร้องด้วยความโกรธแค้น เราเตรียมพร้อมที่จะขับไล่ภัยพิบัติท้องถิ่นนี้กลับไป"
 ep3_laamp_flavour_ewan.4091.a: "โจมตีโต้กลับ ตามข้ามา!"
 ep3_laamp_flavour_ewan.4091.a.tt.success: "ชัยชนะทางยุทธวิธี"
 ep3_laamp_flavour_ewan.4091.a.tt.failure: "เลือดตกยางออกและแตกพ่าย"
 ep3_laamp_flavour_ewan.4091.b: "ข้าจะเข้าสู่ความโกลาหล!"
 ep3_laamp_flavour_ewan.4091.b.tt.success: "การอาละวาดที่ประสบความสำเร็จ"
 ep3_laamp_flavour_ewan.4091.b.tt.failure: "$ep3_laamp_flavour_ewan.4091.a.tt.failure$"
 ep3_laamp_flavour_ewan.4091.c: "ซ่อนตัวจากความโกลาหล"
 ep3_laamp_flavour_ewan.4091.c.every_non_craven_follower: "[follower|E] ทุกคนที่ไม่ใช่ [GetTrait('craven').GetName( GetNullCharacter )]"

 ep3_laamps.5999.t: "ข่าวจากเกาะ"
 ep3_laamps.5999.desc: "บิดาของข้าเป็นคนเข้มงวด เมื่อเวลาผ่านไปหลายปี บัดนี้ข้าจึงเห็นว่า... การกระทำที่ไม่เหมาะสมของข้าต่อท่านนั้นถูกมองด้วยอารมณ์ขันอย่างที่ควรจะเป็น คำร้องของท่านต่อ[edward.GetTitledFirstName]ได้รับการรับฟัง และ ดังนั้นข้าจึงมาอยู่ที่นี่ใน[location.GetName] ทำงานสกปรกให้[flanders.GetTitledFirstName]\n\nแต่มันเป็นเวลาหลายปีแล้ว และอังกฤษก็กำลังอยู่ในช่วงผันผวน [edward.GetTitledFirstNameNoTooltip] สิ้นพระชนม์แล้ว [harold.GetTitledFirstName] ได้ยึดบัลลังก์ และศัตรูของเขา [william.GetTitledFirstName] และ [harald.GetTitledFirstName] กำลังวางแผนโค่นล้มเขา\n\nข้าเพียงหวังว่าความวุ่นวายใดๆ ที่จะเกิดขึ้นในวันข้างหน้าจะอยู่ห่างจากครอบครัวและดินแดนของเรา"
 ep3_laamps.5999.a: "ข้าต้องจับตาสถานการณ์ไว้"
 ep3_laamps.5999.b: "ชะตากรรมของข้าไม่ได้อยู่ที่อังกฤษ"
 ep3_laamps.5999.b.tt: "เพิ่ม [task_contract|E] ใหม่"

 ep3_laamps.6000.t: "ชะตากรรม"
 ep3_laamps.6000.intro: "ข้าพลิกจดหมายในมือ สัมผัสผิวภายนอกที่หยาบ ตราประทับขี้ผึ้ง และตราประจำตระกูลที่ประทับอยู่บนนั้น ตราของ[ROOT.Char.GetHouse.GetBaseName] ข้ากรีดตราประทับออกและเริ่มอ่าน\n\nข่าวร้ายแรงยิ่งนัก"
 ep3_laamps.6000.body.alive: "น้องชาย/พี่ชายของข้า [brother.GetFirstName] ยังมีชีวิตอยู่ — และแท้จริงแล้วเป็นลายมือของเขาที่เขียนสาส์นฉบับนี้ — แต่ข่าวลือที่มาจากนอร์มังดีกลับกลายเป็นความจริง"
 ep3_laamps.6000.body.dead: "น้องชาย/พี่ชายของข้า [brother.GetFirstName] นอนตายแล้ว — กล่าวกันว่า[brother.GetSheHe] [brother.GetDeathReasonHideKiller] — และข่าวลือที่มาจากนอร์มังดีพิสูจน์ว่าเป็นความจริง"
 ep3_laamps.6000.desc: "\n\n[harold.GetFirstName] แห่ง [harold.GetHouse.GetBaseName] ถูกปลดออกจากตำแหน่งอย่างรุนแรง บัดนี้ไม่ว่าจะตายหรือซ่อนตัว ดยุก [william.GetFirstName] ไอ้ลูกนอกสมรสผู้อ้างสิทธิ์จอมปลอมในบัลลังก์อังกฤษ บัดนี้คือ [william.GetTitledFirstNameNoTooltip] แห่ง [william.GetPrimaryTitle.GetNameNoTier] [william.GetSheHe|U] ได้เริ่มมอบที่ดินส่วนต่างๆ ให้กับผู้ติดตาม[william.GetHerHis]แล้ว โดยแย่งชิงมาจากเงื้อมมือของชาว[ROOT.Char.GetCulture.GetCollectiveNoun]ผู้พ่ายแพ้\n\n"
 ep3_laamps.6000.closing.alive: "น้องชาย/พี่ชายของข้าร้องขอความช่วยเหลือ..."
 ep3_laamps.6000.closing.dead: "ครอบครัวของข้าย่อยยับ..."
 ep3_laamps.6000.a: "ข้าจะไม่ทอดทิ้งครอบครัวในยามคับขัน!"
 ep3_laamps.6000.a.dead: "ข้าจะไม่ทอดทิ้งมรดกอันชอบธรรมของข้า!"
 ep3_laamps.6000.a.flavor: "มุ่งหน้าสู่บ้านเกิดเมืองนอนของข้า"
 ep3_laamps.6000.a.tt: "เริ่มเดินทางไปยัง [ely.GetName]"
 ep3_laamps.6000.b: "ข้าไม่ได้เป็นชาว[ROOT.Char.GetHouse.GetBaseNameNoTooltip]มานานแล้ว"
 ep3_laamps.6000.b.tt: "@alert_icon!#alert_trial จะไม่มีการหวนกลับ เมื่อเลือกเส้นทางนี้แล้ว...#!"

 ep3_laamps.6001.t: "บ้านแสนสุข?"
 ep3_laamps.6001.desc: "ทันทีที่ข้าเหยียบย่างเข้าไปในบริเวณบ้านเก่าของครอบครัว ข้ารู้ว่ามีบางอย่างผิดปกติ ก้อนบิดเบี้ยวปรากฏขึ้นผ่านม่านหมอก มีเสาบางๆ ตั้งตระหง่านอยู่เหนือมัน ก้าวไปข้างหน้าอีกก้าว และ...\n\nศีรษะของ[ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('brother'))] [brother.GetFirstNamePossessive] ถูกเสียบอยู่บนยอดหลักแหลม ส่วนที่เหลือของร่างเขากองยับยู่ยี่เปื้อนเลือดอยู่ด้านล่าง\n\n"เจ้าเป็นใคร?" เสียงนั้น ในสำเนียงที่ข้าไม่รู้จัก ทำให้ข้าสะดุ้ง ข้าหันไปเห็น[frederick.GetWomanMan]กำลังเช็ดคราบเลือดออกจากอาวุธในมือ[frederick.GetHerHis] เลิกคิ้วเมื่อเห็นข้า "ถ้าเจ้ามาที่นี่เพื่อเอาศพ ข้าไม่จ่ายเงินให้เจ้าเอามันไปหรอกนะ"\n\nข้ามองลงไปที่ร่างที่หักและบิดเบี้ยวของน้องชาย/พี่ชายข้าอีกครั้ง"
 ep3_laamps.6001.a: ""เจ้าจะต้องตาย เพราะสิ่งที่เจ้าทำที่นี่""
 ep3_laamps.6001.b: ""เจ้ามีโอกาสหนีเพียงครั้งเดียว ไอ้หมาขี้เรื้อนน่ารังเกียจ""
 ep3_laamps.6001.b.one: "[frederick.GetWomanMan]วิ่งหนีไป"
 ep3_laamps.6001.b.one.tt: "เจ้าเก็บร่างของ[brother.GetFirstNamePossessiveNoTooltip]กลับมาโดยไม่ถูกรบกวน"
 ep3_laamps.6001.b.two: "[frederick.GetWomanMan]ตรงเข้ามาหาเจ้า ชูอาวุธขึ้น"
 ep3_laamps.6001.b.two.tt: "การ[single_combat_duel|E]เริ่มต้นขึ้น"

 ep3_laamps.6003.t: "จานนี้ต้องเสิร์ฟ..."
 ep3_laamps.6003.desc: "ข้าก้าวข้ามซากศพที่ยังกระตุกของ[frederick.GetFirstNamePossessive]อย่างไม่ไยดี กลับไปยังร่างของ[brother.GetFirstNamePossessive] ในไม่ช้า จะมีการขุดหลุมศพ จัดพิธีศพ พิธีกรรมเพื่อรำลึกถึงชีวิตที่แสนสั้นอย่างโหดร้าย[brother.GetHerHis] สำหรับตอนนี้ ยามเย็นเปลี่ยนเป็นยามค่ำคืน และข้านั่งรำลึกถึงความหลัง\n\n[brother.GetSheHe|U]เป็น[brother.GetWomanMan]ที่รักสงบ มันไม่ยุติธรรมเลยที่คนที่เพียงต้องการใช้ชีวิตอย่างปลอดภัยจะต้องประสบชะตากรรม เช่นนี้ โดยไม่ได้เชื้อเชิญ การตระหนักรู้ผุดขึ้นในใจ\n\nชาว[frederick.GetCulture.GetCollectiveNoun] [brother.GetSheHe|U]คงจะมีชีวิตอยู่หากไม่ใช่ เพราะพวกเขา จะมีพี่ชายน้องชายนับพัน พี่สาวน้องสาวนับพัน พ่อแม่และลูกชายนับพัน ลูกสาวนับพัน #EMP ทุกคน#! ทั่วแผ่นดิน #EMP ทุกคน#! กำลังจะตายในคืนนี้ #EMP ทั้งหมด#! เป็น เพราะพวก...\n\n#EMP ไอ้พวก. [frederick.GetCulture.GetCollectiveNounNoTooltip|U] ที่ถูกสาปแช่ง.!#!"
 ep3_laamps.6003.a: ""ข้าจะล้างแค้นให้เจ้า น้องชาย/พี่ชาย ข้าสัญญา""
 ep3_laamps.6003.b: "การชดใช้ครั้งแรกรออยู่"
 ep3_laamps.6003.b.flavor: "ไอ้โสโครกที่ข้าฆ่าไปนั่นดูเหมือนจะมีทรัพย์สมบัติอยู่บ้าง..."
 ep3_laamps.6003.b.tt: "ได้รับ[artifact|E]เล็กๆ น้อยๆ"

 ep3_laamps.6005.t: "กลับสู่หนองบึง"
 ep3_laamps.6005.desc: "เป็นเวลาหลายปีเกินไปแล้วนับตั้งแต่ข้าเหยียบย่างบนดินแดนเหล่านี้ครั้งสุดท้าย เป็นก้าวที่ไม่หนักแน่นนัก ด้วยเหตุผลที่ดี แม้ แต่ตอนนี้ดินเลนก็ยังดูดรองเท้าบู๊ตของข้า\n\nดินแดนเหล่านี้ — บ้านของข้า — ถูกเรียกว่า '[Glossary( 'เดอะเฟนส์', 'FENS_GLOSS' )]' มาหลายชั่วอายุคนแล้ว แท้จริงแล้ว น้ำขึ้นสูงมากในบางส่วนจนเอลีเองก็ถือเป็นเกาะทางเทคนิค\n\nไม่มีเวลาให้เสียเปล่า แม้ แต่ตอนนี้ไอ้หมานอร์มันนั่นก็กำลังกระชับอำนาจ[william.GetHerHis]รอบดินแดนแองโกล-แซกซอนที่ดีงาม เพื่อที่จะต่อต้านได้บ้าง เราจะต้องมีสายเลือดหล่อเลี้ยงคู่ของสงครามใดๆ: เงินและคน"
 ep3_laamps.6005.a: "เราต้องเติมท้องพระคลังก่อน ด้วยวิธีการใดๆ ก็ตามที่จำเป็น"
 ep3_laamps.6005.a.tt: "ข้าคิดว่าข้าเห็นขุนนางที่ป้องกันหละหลวมกำลังเดินเหยาะๆ อยู่ตรงโน้นพอดี..."
 ep3_laamps.6005.b: "บางทีอัศวินท้องถิ่นอาจถูกโน้มน้าวให้เข้าร่วมกับข้าได้?"
 ep3_laamps.6005.b.tt: "และ เนื่องจากเป็นคนท้องถิ่น บางทีพวกเขาอาจจะมีความรู้เป็นอย่างดีเกี่ยวกับวิธีที่ดีที่สุดในการนำทางในภูมิประเทศนี้..."
 every_fenland_holding: "[holding|E] ทุกแห่งในเดอะเฟนส์"
 FENS_GLOSS: "พื้นที่ลุ่มชื้นแฉะอันอุดมสมบูรณ์รอบๆ เดอะวอช เป็นที่รู้จักกันในท้องถิ่นว่า 'เดอะเฟนส์' ประกอบด้วยโบสถ์และอาสนวิหารที่โดดเด่นที่สุดหลายแห่งในอังกฤษ\n\nเป็นที่ยอมรับกันโดยทั่วไปว่าเฟนแลนด์ประกอบด้วย [baronies|E] ดังต่อไปนี้:\n\n$EFFECT_LIST_BULLET$[GetTitleByKey('b_lynn').GetBaseName]\n$EFFECT_LIST_BULLET$[GetTitleByKey('b_cambridge').GetBaseName]\n$EFFECT_LIST_BULLET$[GetTitleByKey('b_radfield').GetBaseName]\n$EFFECT_LIST_BULLET$[GetTitleByKey('b_papworth').GetBaseName]\n$EFFECT_LIST_BULLET$[GetTitleByKey('b_ely').GetBaseName]\n$EFFECT_LIST_BULLET$[GetTitleByKey('b_hurstingstone').GetBaseName]\n$EFFECT_LIST_BULLET$[GetTitleByKey('b_norman_cross').GetBaseName]\n$EFFECT_LIST_BULLET$[GetTitleByKey('b_stamford').GetBaseName]\n$EFFECT_LIST_BULLET$[GetTitleByKey('b_boston').GetBaseName]\n$EFFECT_LIST_BULLET$[GetTitleByKey('b_peterborough').GetBaseName]"

 ep3_laamps.6010.t: "[powerful_vassal.Custom2('AppropriateGreetingPositive', ROOT.Char)]"
 ep3_laamps.6010.desc: "ข้าได้ยินถึงวีรกรรมของท่านและงานดีๆ ที่ท่านกำลังทำอยู่ในเฟนส์\n\nข้าอยากให้ท่านมาพบข้าที่ [powerful_vassal_capital.GetName]: เรามีเรื่องต้องหารือกันมาก"
 ep3_laamps.6010.a: "ท่านคาดหวังข้าได้ในอีกไม่กี่วันข้างหน้า"
 ep3_laamps.6010.a.flavor: "[powerful_vassal_capital.GetNameNoTooltip] งั้นหรือ? ข้าควรจะเริ่มจัดการได้แล้ว"
 ep3_laamps.6010.a.tt: "ท่านออกเดินทางไปยัง [powerful_vassal_capital.GetNameNoTooltip]"
 ep3_laamps.6010.b: "ข้าเดินในเส้นทางของข้าเอง"

 ep3_laamps.6015.t: "เพื่ออังกฤษ"
 ep3_laamps.6015.desc: "[powerful_vassal.GetTitledFirstNameRegnal] ลอร์ดชาว[powerful_vassal.GetCulture.GetName]ที่ทรงอำนาจที่สุดที่ยังเหลืออยู่ ได้ต้อนรับข้าด้วยอ้อมแขนที่เปิดกว้าง ในระหว่างการพูดคุยของเรา หัวข้อไม่ค่อยจะออกนอกเรื่องที่เห็นได้ชัด\n\n"พวกเราไม่ใช่คนแปลกหน้าที่จะถูกปกครองโดยคนแปลกหน้าที่นี่" [powerful_vassal.GetFirstNameNoTooltip] กล่าว พร้อมรอยยิ้มเยาะๆ กับความตลกคะนอง[powerful_vassal.GetHerHis]เอง นิ้วมือประสานกันอย่างมีเป้าหมาย "บรรพบุรุษของเราอยู่ภายใต้การปกครองของชาวเดนส์มากกว่าหนึ่งคนเสียอีก แต่ครั้งนี้... ครั้งนี้มันแตกต่างออกไป"\n\n"ข้าตั้งใจที่จะท้าทายไอ้ #EMP [william.GetFirstNameNoTooltip]#! คนนี้" [powerful_vassal.GetSheHe] ถ่มชื่อนั้นออกมาอย่างอาฆาตแค้น "แต่ข้าต้องการการสนับสนุน ความภักดีของเกือบทุกคนนั้นไม่แน่นอน" [powerful_vassal.GetSheHe|U] เงยหน้าขึ้นสบตาข้า\n\n"ข้าสามารถพึ่งพาความช่วยเหลือของท่านได้หรือไม่?""
 ep3_laamps.6015.a: "ท่านได้รับการสนับสนุนจากข้า"
 every_direct_vassal_william: "[direct_vassal|E] ชาวนอร์มันทุกคนของ [william.GetFirstNameRegnal]"
 every_anglo_noble: "[noble|E] ชาวแองโกล-แซกซอนทุกคน"
 ep3_laamps.6015.b: "ข้าต้องการเวลามากกว่านี้"

 ep3_laamps.6016.t: "จุดจบที่ไม่เป็นมงคล"
 ep3_laamps.6016.frustrated: ""นั่นเป็นเวลาที่เราไม่มี!" [powerful_vassal.GetFirstName|U] ทุบโต๊ะเพื่อเน้นย้ำประเด็น ความโกรธฉายวาบขึ้นบนใบหน้า[powerful_vassal.GetHerHis] "แม้ แต่ตอนนี้ก็มีเสียงกระซิบเรื่องการตอบโต้! ยิ่งเราใช้เวลานานเท่าไหร่ [william.GetSheHe] ก็ยิ่งมีเวลามากขึ้นในการรวบรวมการสนับสนุน"\n\n"เรา #EMP ต้อง#! เคลื่อนไหวอย่างรวดเร็ว ใช้เวลาที่ท่านต้องการ แต่ข้าทำได้เพียงวิงวอนให้ท่านเลือกข้าง ในขณะที่ท่านยังทำได้"\n\n"
 ep3_laamps.6016.happy: ""ยอดเยี่ยม! ยอดเยี่ยมที่สุด!" [powerful_vassal.GetFirstName] ตบโต๊ะด้วยความโล่งใจ "ข้าแทบจะนึกถึง[ROOT.Char.GetWomanMan]ที่ดีกว่านี้ที่จะจับอาวุธร่วมด้วยไม่ได้เลย" [powerful_vassal.GetSheHe|U] เอื้อมมือข้ามมาจับมือข้าไว้ในมือ[powerful_vassal.GetHerHis]\n\n"ร่วมกันเราอาจจะยังสามารถแย่งชิงดินแดนเหล่านี้กลับมาจากไอ้งูนอร์มันนั่นได้ บัดนี้ เราต้องรวดเร็ว-"\n\n"
 ep3_laamps.6016.ending: "[powerful_vassal.GetSheHe|U] อ้าปาก[powerful_vassal.GetHerHis]อีกครั้ง แต่เสียงประตูที่กระแทกเปิดออกขัดจังหวะ[powerful_vassal.GetHerHim] ผู้ส่งสาร เปียกโชกและตาเบิกโพลง ขัดจังหวะการตอบโต้อย่างขุ่นเคืองของ[powerful_vassal.GetFirstNamePossessiveNoTooltip]ด้วยการชูสาส์นขึ้น\n\nข้ารอขณะที่[powerful_vassal.GetFirstNameNoTooltip]กรีดตราประทับออกและกวาดตาอ่านแผ่นหนัง\n\nสีหน้า[powerful_vassal.GetHerHis]ค่อยๆ ซีดเผือดลง"
 ep3_laamps.6016.a: ""มันคืออะไร?""
 ep3_laamps.6016.a.tt: "ท่านรับสาส์นที่ยื่นให้..."

 ep3_laamps.6020.t: "การกวาดล้างภาคเหนือ"
 ep3_laamps.6020.desc: "การสถาปนากษัตริย์องค์ใหม่ชาวต่างชาติ — และเป็นไอ้ลูกนอกสมรสชาว[william.GetCulture.GetName]เสียด้วย — ได้พิสูจน์แล้วว่าเพียงพอที่จะ ทำให้เชือกที่ใกล้ขาด ซึ่งยึดอังกฤษไว้ด้วยกันขาดสะบั้น การลุกฮือในท้องถิ่น ซึ่งได้รับการสนับสนุนและปลุกปั่นโดย [Glossary( 'เอเธลลิง', 'AETHELINGS_GLOSS' )] ชาวแองโกล-แซกซอนผู้พ่ายแพ้และขุ่นเคือง แพร่กระจายไปทั่วประเทศราวกับไฟป่า\n\n[william.GetTitledFirstName] ซึ่งได้สร้างฐานอำนาจ[william.GetHerHis]ในภาคใต้อย่างมั่นคงแล้ว บัดนี้มองไปยังภาคเหนือเพื่อ ทำให้ผู้ที่กล้าหาญและโง่เขลาพอที่จะต่อต้านเขาสงบลง ไม่ว่าสายตา[william.GetHerHis]จะทอดไปถึงที่ใด ความตายและการทำลายล้างจะตามมา และการต่อสู้อย่างสิ้นหวังเพื่อแย่งชิงดินแดนก็ได้เกิดขึ้น\n\n[william.GetFirstNameNoTooltip] จะต้องเดินบนเส้นบางๆ ระหว่างไม้นวมและไม้แข็ง การอ่อนข้อเกินไปอาจ ทำให้[william.GetHerHim]สูญเสียอาณาจักร[william.GetHerHis]ได้ แต่การตอบโต้อย่างโหดเหี้ยมเกินไปก็จะ ทำให้อาณาจักรเหลืออยู่ไม่มากนักที่จะปกครอง\n\nสำหรับเหล่าเอเธลลิง มีเพียงความตายหรือเกียรติยศเท่านั้นที่รออยู่"
 ep3_laamps.6020.a: "อังกฤษแขวนอยู่บนเส้นด้าย"
 AETHELINGS_GLOSS: ""เอเธลลิง" เป็นคำศัพท์แองโกล-แซกซอนที่ใช้เรียกชาวแองโกล-แซกซอนผู้มีเชื้อสายขุนนาง และคำนำหน้า 'เอเธล' มักจะถูกนำมาต่อท้ายชื่อของพวกเขาด้วย"
 every_aetheling: "[vassal|E] ชาว$anglo_saxon$ ทุกคนของ [william.GetTitledFirstName]"
 every_county: "[county|E] ทุกแห่ง"

 ep3_laamps.6021.desc: "การสถาปนาอันชอบธรรมของข้าบนบัลลังก์อังกฤษได้พิสูจน์แล้วว่าเพียงพอที่จะ ทำให้เชือกที่ใกล้ขาด ซึ่งยึดอาณาจักรไว้ด้วยกันขาดสะบั้น การลุกฮือในท้องถิ่น ซึ่งได้รับการสนับสนุนและปลุกปั่นโดย [Glossary( 'เอเธลลิง', 'AETHELINGS_GLOSS' )] ชาวแองโกล-แซกซอนผู้พ่ายแพ้และขุ่นเคือง แพร่กระจายไปทั่วประเทศราวกับไฟป่า\n\nด้วยฐานอำนาจของข้าในภาคใต้ที่มั่นคงแล้ว บัดนี้ข้าต้องมองไปยังภาคเหนือเพื่อ ทำให้ผู้ที่กล้าหาญและโง่เขลาพอที่จะต่อต้านข้าสงบลง ไม่ว่าสายตาของข้าจะทอดไปถึงที่ใด ความตายและการทำลายล้างจะตามมา เกรงว่าตำแหน่งของข้าจะถูกแย่งชิงโดยชาวบ้านเจ้าเล่ห์\n\nข้าต้องเดินบนเส้นบางๆ ระหว่างไม้นวมและไม้แข็ง การอ่อนข้อเกินไปจะ ทำให้ข้าสูญเสียอาณาจักร แต่การตอบโต้อย่างโหดเหี้ยมเกินไปจะ ทำให้ข้าเหลืออาณาจักรไม่มากนักที่จะปกครอง อย่างไรก็ตาม สำหรับเหล่าเอเธลลิง...\n\nจะต้องไม่มีความเมตตาสำหรับผู้ที่ไม่ยอมมอบความจงรักภักดี"

 ep3_laamps.7000.t: "อีกเส้นทางหนึ่ง"
 ep3_laamps.7000.desc: "ด้วยความวุ่นวาย เช่นนี้ที่ครอบงำดินแดนแห่ง[england.GetName] บางครั้งข้าก็สงสัยว่าชะตากรรมของข้าอยู่ที่อื่นหรือไม่\n\nความเปลี่ยนแปลงครั้งใหญ่ได้เริ่มขึ้นแล้ว หลังจากการแย่งชิงการควบคุมอาณาจักรของ[william.GetTitledFirstNamePossessive] ข้าสงสัยว่ามันจะน่าเกลียดยิ่งกว่าที่เป็นอยู่ตอนนี้ และชีวิตบนเส้นทางตามรอยเท้าบิดาของข้าก็มีความน่าดึงดูดใจบางอย่าง\n\nบางทีข้าอาจจะไปทางเหนือ สู่สกอตแลนด์? หรือบางทีอาจจะเป็นทางใต้ของอิตาลี ในแถบเชิงเขาอาปูเลีย?"
 ep3_laamps.7000.a: "สกอตแลนด์ฟังดูเป็นแผนที่ดี"
 ep3_laamps.7000.b: "ข้าได้กลิ่นน้ำมันมะกอกอาปูเลียแล้ว!"
 ep3_laamps.7000.c: "ข้าต้องไม่หลีกเลี่ยงหน้าที่ของข้า"

 ep3_laamps.7001.t: "ยังมีอีกคน"
 ep3_laamps.7001.desc: ""[ROOT.Char.GetFirstNameNoTooltip]? ที่นี่คือที่ที่[ROOT.Char.GetFirstNameNoTooltip]อาศัยอยู่หรือ? อ๊ะ- ปล่อยข้า เจ้า-" เสียงดังกึกก้องบ่งบอกถึงการมาถึงของผู้มาเยือน ซึ่งถูกทหารยามของข้าล้อมรอบอย่างรวดเร็ว ข้าก้าวออกจากเต็นท์ไปเห็น[siward.GetWomanMan]ร่างกำยำพร้อมดาบพาดอยู่บนไหล่[siward.GetHerHis]\n\n"เจ้า! เจ้าคือ[ROOT.Char.GetFirstNameNoTooltip] ใช่หรือไม่?" ข้าพยักหน้ายอมรับขณะที่[siward.GetSheHe]ก้าวไปข้างหน้า ยื่นแขนข้างที่ว่างออกมา\n\n"ชื่อเสียงของท่านมาก่อนตัว! ข้าคือ[siward.GetFirstName] แห่ง[siward.GetHouse.GetBaseName] ข้ามาเพื่อเข้าร่วมกับท่าน""
 ep3_laamps.7001.a: ""[siward.GetFirstNameNoTooltip] งั้นหรือ? ยินดีต้อนรับ!""
 ep3_laamps.7001.b: ""พวกเราเต็มแล้ว ข้าเกรงว่า""

 ep3_laamps.7002.t: "อังกฤษใหม่"
 ep3_laamps.7002.desc: "[siward.GetFirstName] [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('siward'))]ผู้ภักดีของข้า เข้ามาหาข้าด้วยแววตาเป็นประกาย\n\n"ข้ามาเพื่อกล่าวลา" [siward.GetSheHe|U] ขัดจังหวะการคัดค้านที่กำลังจะพูดของข้าด้วยการยกมือห้าม "ข้าตัดสินใจแล้ว ไม่มีอะไรหยุดข้าได้" [siward.GetSheHe|U] ผายมือให้ข้านั่ง\n\n"มีเสียงกระซิบมาจากคอนสแตนติโนเปิล [emperor.GetTitledFirstName] เสนอการเดินทางที่ปลอดภัยให้กับผู้ลี้ภัยจากความโกรธกริ้วของ[king_england.GetTitledFirstNamePossessive] และโอกาสที่จะสร้างตัวขึ้นใหม่" [siward.GetFirstNameNoTooltip] ตบต้นขา[siward.GetHerHis]และมองไปรอบๆ\n\n"ข้าจะคิดถึงที่นี่ ลาก่อน [ROOT.Char.Custom('SisterBrother')]ของข้า""
 ep3_laamps.7002.a: ""เดินทางโดยสวัสดิภาพ ขอให้ท่านพบความสงบสุข""
 ep3_laamps.7002.b: "ทีนี้ฟังดูน่าสนใจ #EMP มาก#! ทีเดียว..."
 ep3_laamps.7002.c.success: "[siward.GetFirstNameNoTooltip] อยู่ต่อ"
 ep3_laamps.7002.c.failure: "[siward.GetFirstNameNoTooltip] จากไป"

 ep3_laamps.7003.t: "การเข้าเฝ้าฯ"
 ep3_laamps.7003.desc: "การได้รับพระราชทานพระบรมราชวโรกาสให้เข้าเฝ้าฯ [emperor.GetTitleAsNameNoTooltip] ไม่ใช่เรื่องเล็กน้อย แต่เห็นได้ชัดว่าการมาถึงของข้าพร้อมกับกลุ่มคนต่างชาติที่ดูมอซอได้ ทำให้เกิดเสียงซุบซิบนินทา\n\n"ยินดีต้อนรับ [ROOT.Char.GetFirstName] แห่ง [ROOT.Char.GetHouse.GetBaseName] ท่านมาเพื่อขอลี้ภัยจากชะตากรรมอันเลวร้ายของบ้านเกิดเมืองนอนของท่านหรือ?" ข้าทำได้เพียงพยักหน้าอย่างมึนงง [emperor.GetTitleAsNameNoTooltip] เผยรอยยิ้มเคร่งขรึมไร้แววขัน "ท่านจะปลอดภัยที่นี่ แต่สิ่งที่ยิ่งใหญ่กว่านั้นอยู่ในกำมือของท่าน"\n\n"ทางตะวันออกเฉียงเหนือมีดินแดนที่ปกครองโดยข้าหลวงใจคดของข้า จงเดินทางไปที่นั่น ยึดครองดินแดนเหล่านั้นเพื่อตัวท่านเอง และท่านอาจจะเก็บรักษาไว้ได้เพื่อแลกกับความจงรักภักดี"\n\nพระดำรัสของ[emperor.GetTitleAsNamePossessiveNoTooltip]ดังก้องท่ามกลางเสียงสูดปากอย่างตกใจประปราย อาณาจักรใหม่? สำหรับพวกเราผู้หลบหนี?"
 ep3_laamps.7003.a: ""ข้าขอรับข้อเสนอของท่าน [emperor.GetTitleAsNameNoTooltip]ผู้ยิ่งใหญ่""
 ep3_laamps.7003.a.tt: "ท่านออกเดินทางไปยังดินแดนใหม่..."
 ep3_laamps.7003.b: ""ข้าอยากจะอยู่ที่นี่ ในคอนสแตนติโนเปิลมากกว่า""

 ep3_laamps.7004.t: "การเข้าเฝ้าฯ อีกครั้ง"
 ep3_laamps.7004.desc: ""[emperor.GetSheHe]ส่งเจ้ามาที่นี่งั้นรึ? เรียกมันว่าดินแดน[emperor.GetHerHis] งั้นรึ?" ริมฝีปากของ[title_holder.GetFirstNamePossessive]เบ้ลงด้วยความโกรธและเยาะเย้ย "เจ้าถูกหลอกแล้ว เจ้าโง่"\n\nดูเหมือนว่าจักรวรรดิของ[emperor.GetTitleAsNamePossessiveNoTooltip]จะไม่ได้แผ่ขยายไปไกลเท่าที่[emperor.GetSheHe]บอกเป็นนัย ดินแดนที่เราค้นพบเมื่อมาถึง — ดินแดนที่มีป่าหนาทึบ แต่อุดมสมบูรณ์อย่างน่าประหลาดใจ — ไม่ได้อยู่ในมือของชาวกรีกเลย แต่เป็นของ[title_holder.GetTitleAsNameNoTooltip] [title_holder.GetFirstNameNoTooltip]\n\n"ไอ้สารเลวนั่นบนบัลลังก์หรูหรา[emperor.GetHerHis]นำเจ้าหลงผิด แต่..." [title_holder.GetSheHe|U] หยุดชั่วคราวเพื่อมองข้าและผู้ติดตามที่มอมแมม แต่มีกำลังใจของข้า "...บางทีเจ้า #EMP อาจจะ#! เสนอบางอย่างได้ หากเจ้ามีเงินพอที่จะซื้อทาง เจ้าอาจจะได้ดินแดนเหล่านี้ไป ในฐานะข้าหลวงของข้า แน่นอน""
 ep3_laamps.7004.a: ""ข้าจะเป็นเกียรติอย่างยิ่ง""
 ep3_laamps.7004.b: ""ดินแดนเหล่านี้ถูกสัญญาไว้กับข้าแล้ว ข้าจะยึดมันมาด้วยกำลัง""

 ##################################################
 # LOANED COURTIER RETURNS

 ep3_laamp_flavour_ewan.9511.t: "ผู้ติดตามกลับมา: [visitor.GetTitledFirstNameNicknamedNoTooltip]"
 ep3_laamp_flavour_ewan.9511.desc.intro: "หลังจากจากไปหลายปีกับ [host.GetTitledFirstName] ผู้ติดตามที่ภักดีของข้า [visitor.GetFirstNameNicknamed] ก็ได้หาทาง [visitor.GetHerHis] กลับมาหาพวกเราในที่สุด\n\n"
 ep3_laamp_flavour_ewan.9511.desc.spouse.got_married: "แม้ว่า[visitor.GetSheHe] [visitor.GetHerselfHimself] จะไม่ได้เปลี่ยนแปลงไปมากนักนับตั้งแต่พลัดหลงไปจาก[ROOT.Char.GetPrimaryTitle.GetDefinitiveName] ดูเหมือนว่า[visitor.GetSheHe] #EMP จะ#! ได้[visitor_spouse.Custom('WifeHusband')]ท้องถิ่นจาก[capital.GetBaseNameNoTier]มาด้วย — [visitor_spouse.GetFirstName] ซึ่งได้ติดตาม[visitor.Custom('WifeHusband')][visitor_spouse.GetHerHis]กลับมาที่ค่าย"
 ep3_laamp_flavour_ewan.9511.desc.spouse.nope: "[visitor.GetSheHe|U] แทบไม่ได้เปลี่ยนแปลงไปเลยนับตั้งแต่วันที่[visitor.GetSheHe]จาก[ROOT.Char.GetPrimaryTitle.GetDefinitiveName]ไป ไม่ว่าจะดีขึ้นหรือแย่ลง และส่วนใหญ่ก็แค่ดีใจที่ได้กลับมาอยู่ท่ามกลางหมู่คณะที่คุ้นเคย"
 ep3_laamp_flavour_ewan.9511.desc.outro: "\n\nเพื่อนเก่าและหน้าใหม่ต่างเบียดเสียดกันเข้ามาเพื่อดู[visitor.GetWomanMan]ที่กลับมา ต่างก็มีความสุขเท่าๆ กันกับข่าวดีที่ไม่คาดคิดเล็กน้อย"
 ep3_laamp_flavour_ewan.9511.a: "ยินดีต้อนรับ ยินดีต้อนรับ!"
 ep3_laamp_flavour_ewan.9511.b: "#EMP แต่งงานแล้ว?#! ข้าไม่คิด เช่นนั้น!"
 ep3_laamp_flavour_ewan.9511.c: "เจ้าไม่เป็นที่ต้องการอีกต่อไป ไปเสีย"

 ep3_laamp_flavour_ewan.9512.t: "ผู้ติดตามกลับมาพร้อมพัฒนาการ: [visitor.GetTitledFirstNameNicknamedNoTooltip]"
 ep3_laamp_flavour_ewan.9512.desc: ""[ROOT.Char.GetTitledFirstNameNoTooltip]!" เสียงกึ่งคุ้นเคยของ [visitor.GetFirstName] ร้องขึ้น เข้ามาในค่ายอย่างตื่นเต้นหลังจากห่างหายจาก [ROOT.Char.GetPrimaryTitle.GetDefinitiveName] ไปหลายปี "ข้ากลับมาแล้ว และข้าก็ไม่ได้อยู่เฉย ๆ ระหว่างที่ข้าถูกขับไล่!"\n\nจริงดังว่า [visitor.GetSheHe] ไม่ได้อยู่เฉย — ดูเหมือนว่าเวลาที่ [visitor.GetHerHis] อยู่กับ [host.GetTitledFirstName] ได้ให้โอกาส [visitor.GetHerHim] อย่างเต็มที่ในการฝึกฝนทักษะของ [visitor.GetHerHis] บางสิ่งที่ [visitor.GetSheHe] ดูเหมือนกระตือรือร้นที่จะนำมาใช้ ในเมื่อ [visitor.GetSheHe] กลับมาอยู่กับเราแล้ว"
 ep3_laamp_flavour_ewan.9512.a: "เจ้าเติบโตขึ้นมาก [visitor.GetFirstNameNoTooltip]!"
 ep3_laamp_flavour_ewan.9512.b: "ไปให้พ้น เจ้าคนพเนจร"

 ep3_laamp_flavour_ewan.9521.t: "ไม่เหมือนที่ข้าจำเจ้าได้: [visitor.GetTitledFirstNameNicknamedNoTooltip]"
 ep3_laamp_flavour_ewan.9521.desc.intro: "หลังจากห่างหายจากเราไปหลายปี ในที่สุด [visitor.GetTitledFirstNameNicknamed] ผู้ติดตามของข้าก็กลับมา\n\nแต่ ทว่า... [visitor.GetSheHe] ไม่เหมือนเดิมเสียทีเดียวกับตอนที่[visitor.GetSheHe]จากเราไป"
 ep3_laamp_flavour_ewan.9521.desc.source.host: "ดูเหมือนว่าเวลาที่ใช้ไปกับ [host.GetTitledFirstName] ได้ทิ้งร่องรอยที่ลบไม่ออกไว้บนกิริยาท่าทางและลักษณะนิสัยของ [visitor.GetHerHis] — บัดนี้ [visitor.GetSheHe] ดูเหมือน [new_culture.GetName] มากกว่า [old_culture.GetName] เสียอีก\n\n"
 ep3_laamp_flavour_ewan.9521.desc.source.capital: "เห็นได้ชัดว่าวันเวลาของ [visitor.GetHerHis] ใน [capital.GetBaseNameNoTier] ได้หล่อหลอมเขา เพราะร่องรอยวิถีชีวิตแบบ [old_culture.GetName] เดิมของ [visitor.GetHerHis] ได้หายไปหมดสิ้น ถูกแทนที่ด้วยคำพูดและกิริยาท่าทางของชาว [new_culture.GetCollectiveNoun]\n\n"
 ep3_laamp_flavour_ewan.9521.desc.reaction.changed_away: "ในฐานะที่เป็นชาว[old_culture.GetNameNoTooltip]เอง การเปลี่ยนแปลงนี้... น่าไม่สบายใจ"
 ep3_laamp_flavour_ewan.9521.desc.reaction.changed_to: "แน่นอน ในฐานะที่เป็นชาว[new_culture.GetNameNoTooltip]เอง ข้าสามารถสั่งสอน[visitor.GetHerHim]ได้อย่างสมบูรณ์แบบ #EMP โดยไม่#! จำเป็นต้องใช้เวลาหลายปีห่างจากเรา"
 ep3_laamp_flavour_ewan.9521.desc.reaction.uninvolved: "มันแปลกที่เห็นว่าเวลาได้เปลี่ยนแปลง[visitor.GetHerHim]ไป แต่ข้าคิดว่าเราทุกคนต่างก็ผ่านช่วงเวลาแห่งการเปลี่ยนแปลง"
 ep3_laamp_flavour_ewan.9521.desc.outro: "\n\n[visitor.GetFirstNameNoTooltip] [visitor.GetHerselfHimself] ดูไม่หวั่นไหวต่อการเปลี่ยนแปลงสภาพ[visitor.GetHerHis] เพียงแค่ดีใจที่ได้กลับมาที่ค่าย"
 ep3_laamp_flavour_ewan.9521.tt.primary_skill.diplomacy: "ได้รับ [skill_1.GetValue|V0] [diplomacy|E] [skill|E] จากการเรียนรู้ที่จะปรับใช้ [ethos|E] ของชาว[new_culture.GetName]"
 ep3_laamp_flavour_ewan.9521.tt.primary_skill.martial: "ได้รับ [skill_1.GetValue|V0] [martial|E] [skill|E] จากการเรียนรู้ที่จะปรับใช้ [ethos|E] ของชาว[new_culture.GetName]"
 ep3_laamp_flavour_ewan.9521.tt.primary_skill.stewardship: "ได้รับ [skill_1.GetValue|V0] [stewardship|E] [skill|E] จากการเรียนรู้ที่จะปรับใช้ [ethos|E] ของชาว[new_culture.GetName]"
 ep3_laamp_flavour_ewan.9521.tt.primary_skill.learning: "ได้รับ [skill_1.GetValue|V0] [learning|E] [skill|E] จากการเรียนรู้ที่จะปรับใช้ [ethos|E] ของชาว[new_culture.GetName]"
 ep3_laamp_flavour_ewan.9521.tt.secondary_skill.diplomacy: "ได้รับ [skill_2.GetValue|V0] [diplomacy|E] [skill|E] จากการเรียนรู้ที่จะปรับใช้ [ethos|E] ของชาว[new_culture.GetName]"
 ep3_laamp_flavour_ewan.9521.tt.secondary_skill.stewardship: "ได้รับ [skill_2.GetValue|V0] [stewardship|E] [skill|E] จากการเรียนรู้ที่จะปรับใช้ [ethos|E] ของชาว[new_culture.GetName]"
 ep3_laamp_flavour_ewan.9521.tt.secondary_skill.intrigue: "ได้รับ [skill_2.GetValue|V0] [intrigue|E] [skill|E] จากการเรียนรู้ที่จะปรับใช้ [ethos|E] ของชาว[new_culture.GetName]"
 ep3_laamp_flavour_ewan.9521.tt.secondary_skill.learning: "ได้รับ [skill_2.GetValue|V0] [learning|E] [skill|E] จากการเรียนรู้ที่จะปรับใช้ [ethos|E] ของชาว[new_culture.GetName]"
 ep3_laamp_flavour_ewan.9521.tt.secondary_skill.prowess: "ได้รับ [skill_2.GetValue|V0] [prowess|E] [skill|E] จากการเรียนรู้ที่จะปรับใช้ [ethos|E] ของชาว[new_culture.GetName]"
 ep3_laamp_flavour_ewan.9521.a.changed_away: "แปลกประหลาด แต่เจ้าก็ยังเป็นพวกเรา!"
 ep3_laamp_flavour_ewan.9521.a.changed_to: "การตัดสินใจที่สมเหตุสมผล!"
 ep3_laamp_flavour_ewan.9521.a.uninvolved: "ยินดีต้อนรับกลับ!"
 ep3_laamp_flavour_ewan.9521.b: "เราไม่ต้องการคนแปลกหน้าชาว #EMP [visitor.GetCulture.GetNameNoTooltip]#! ไปให้พ้น"

 ep3_laamp_flavour_ewan.9522.t: "$ep3_laamp_flavour_ewan.9521.t$"
 ep3_laamp_flavour_ewan.9522.desc.intro: "แม้จะใช้เวลาหลายปี ในที่สุดผู้ติดตามในอดีตของข้า [visitor.GetTitledFirstNameNicknamed] ก็ได้หาทาง [visitor.GetHerHis] กลับมายัง [ROOT.Char.GetPrimaryTitle.GetDefinitiveName]\n\nเพียง แต่... มีบางอย่างเปลี่ยนไป —"
 ep3_laamp_flavour_ewan.9522.desc.source.host: "[visitor.GetSheHe] พูดถึง [new_faith.CreatorName] [new_faith.GetAdjective] ของ [host.GetTitledFirstName] [visitor.GetHerHis] ด้วยความเคารพยำเกรง อ้างว่าได้พบความรอดพ้นที่แท้จริงด้วยคำสอนของ[new_faith.GetNameNoTooltip]"
 ep3_laamp_flavour_ewan.9522.desc.source.capital: "[visitor.GetSheHe] พูดถึงแสงสว่างแห่ง[new_faith.GetName] ความเชื่อของ[capital.GetBaseNameNoTier] ด้วยความเคารพยำเกรง อ้างว่าได้พบความรอดพ้นที่แท้จริงด้วยคำสอนของ[new_faith.HighGodNamePossessive]"
 ep3_laamp_flavour_ewan.9522.desc.source.bridge: "แทนที่จะเป็น[old_faith.GetAdherentName]ที่เราทิ้งไว้เบื้องหลัง\n\n"
 ep3_laamp_flavour_ewan.9522.desc.reaction.give_a_shit: "ไม่ใช่ว่าเรื่องนั้นสำคัญกับข้าเท่ากับบางคน แต่ถึงกระนั้น มันก็น่าประหลาดใจ"
 ep3_laamp_flavour_ewan.9522.desc.reaction.changed_away: "การละทิ้งวิถีชีวิตแบบ[old_faith.GetAdjectiveNoTooltip] การทิ้งประเพณีอันศักดิ์สิทธิ์ที่สุดของเราเหมือนเสื้อคลุมที่โยนทิ้งลงพื้นนั้น แทบจะคิดไม่ถึง"
 ep3_laamp_flavour_ewan.9522.desc.reaction.changed_to_ours: "โดยธรรมชาติแล้ว ข้าปิติยินดีอย่างยิ่งที่ได้เรียนรู้ถึงการเลือกที่ถูกต้อง[visitor.GetHerHis] การโอบรับความรอดพ้นและความหมายที่แท้จริงของการดำรงอยู่กับ[new_faith.HighGodName]"
 ep3_laamp_flavour_ewan.9522.desc.reaction.changed_to_lovable: "แม้ว่าการเลือกนั้น ทำให้ข้าประหลาดใจ ข้าก็ไม่อาจกล่าวได้ว่า[new_faith.GetNameNoTooltip]เป็นวิถีชีวิตที่ไม่ดี [ROOT.Char.GetFaith.GetName] คิดเห็นอย่างสูงเกี่ยวกับเรื่องนี้อยู่แล้ว"
 ep3_laamp_flavour_ewan.9522.desc.reaction.changed_to_acceptable: "ข้าไม่อาจอ้างได้ว่ารู้อะไรเป็นแรงจูงใจในการเลือกของ[visitor.GetWomanMan] แต่อย่างน้อย[new_faith.GetNameNoTooltip]ก็เป็นศรัทธาที่ยอมรับได้มากกว่าหลายๆ ศรัทธาในโลกที่ไร้พระเจ้านี้"
 ep3_laamp_flavour_ewan.9522.desc.reaction.uninvolved: "ในฐานะที่เป็นชาว[ROOT.Char.GetFaith.GetAdjective]เอง การเปลี่ยนศาสนา[visitor.GetHerHis]ไม่ได้สำคัญ #EMP มาก#! นักสำหรับข้า แต่มันก็เป็นเรื่องที่ไม่คาดฝันอย่างแน่นอน"
 ep3_laamp_flavour_ewan.9522.desc.outro: "\n\nโดยไม่สนใจความวุ่นวายที่การกลับมาอย่างกะทันหันและการเปลี่ยนแปลง[visitor.GetHerHis]นำมา [visitor.GetFirstNameNoTooltip] ก็เพียงแค่ทำธุระ[visitor.GetHerHis]ไปราวกับว่า[visitor.GetSheHe]ไม่เคยจากไปไหน"
 ep3_laamp_flavour_ewan.9522.a: "ยินดีต้อนรับ [visitor.Custom('SisterBrother')]!"
 ep3_laamp_flavour_ewan.9522.b: "แต่ทำไมถึงเปลี่ยนไปนับถือ[new_faith.GetNameNoTooltip]..."
 ep3_laamp_flavour_ewan.9522.c: "เจ้าทำอะไรลงไป เจ้าโง่?!"
 ep3_laamp_flavour_ewan.9522.d: "[old_faith.GetAdherentNameNoTooltip], [new_faith.GetAdherentNameNoTooltip], เจ้าก็ยังคงเป็น[visitor.GetFirstNameNoTooltip]"
 ep3_laamp_flavour_ewan.9522.e: "ดีใจที่เจ้ากลับมา [visitor.GetFirstNameNoTooltip]"
 ep3_laamp_flavour_ewan.9522.f: "เจ้าไม่เป็นที่ต้อนรับที่นี่อีกต่อไป"

 ep3_laamp_flavour_ewan.9523.t: "$ep3_laamp_flavour_ewan.9521.t$"
 ep3_laamp_flavour_ewan.9523.desc.intro: "$ep3_laamp_flavour_ewan.9522.desc.intro$ [visitor.GetSheHe] พูดและ แต่งกายเหมือนชาว[new_culture.GetCollectiveNoun]ที่[visitor.GetSheHe]ไปพักอยู่ด้วยมากขึ้น และอ้างว่าได้พบแสงสว่างแห่งศรัทธา[new_faith.GetAdjective]ที่แท้จริงเพียงหนึ่งเดียวของ"
 ep3_laamp_flavour_ewan.9523.desc.source.host: "เจ้าบ้าน[visitor.GetHerHis] [host.GetTitledFirstName]"
