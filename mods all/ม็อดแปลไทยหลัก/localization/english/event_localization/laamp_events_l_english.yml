 ep3_laamp_flavour_ewan.4003.t: "$ep3_laamp_flavour_ewan.4001.t$: การประลองอันมีชัย"
 ep3_laamp_flavour_ewan.4003.desc: "ความตายของผู้นำจุดประกายความตื่นตระหนกอย่างบ้าคลั่งในหมู่โจรป่า\n\nเสียงกรีดร้องและร่ำไห้เปลี่ยนจากผู้ที่ไม่ใช่พลรบที่หวาดกลัวในขบวนสัมภาระ ไปเป็นนักฆ่าผู้โหดเหี้ยมที่เห็นแผนการพังทลายลงในทางที่เลวร้ายที่สุดต่อหน้าต่อตา\n\nพวกที่ขี้ขลาดที่สุดแตกหนี พวกที่โหดเหี้ยมกว่าทำร้ายสหายเพื่อบังหน้าการหลบหนีของตน ไม่ว่าจะทางใด การโจมตีก็สิ้นสุดลงภายในไม่กี่นาที"
 ep3_laamp_flavour_ewan.4003.a: "ไม่มีใครขโมยของจากข้าได้"

 ep3_laamp_flavour_ewan.4011.t: "ดินแดนแห่งน้ำนมและน้ำผึ้ง"
 ep3_laamp_flavour_ewan.4011.desc: "มีสถานที่ที่ยากลำบากและไม่ปรานีมากมายในโลกนี้\n\n[current_county.GetBaseNameNoTier] ไม่ใช่หนึ่งในนั้น\n\nไม่เลย แต่ดินแดนอันอุดมสมบูรณ์กลับก่อให้เกิดผู้คนใจกว้างและการหาอาหารที่ง่ายดาย ความตึงเครียดผ่อนคลายลง และอาหารสำหรับทั้งกลุ่มดูเหมือนจะกลายเป็นเรื่องที่ไม่ต้องกังวลชั่วคราว: ช่างเป็น #EMP ความสุข#! ที่ไม่คาดคิด"
 ep3_laamp_flavour_ewan.4011.a: "เพลิดเพลินกับผลแห่งความอุดมสมบูรณ์"

 ep3_laamp_flavour_ewan.4021.t: "กระหายน้ำ"
 ep3_laamp_flavour_ewan.4021.desc: "เป็นเวลาหลายวันแล้วที่ค่ายสามารถหาแหล่งน้ำที่มั่นคงได้ครั้งสุดท้าย\n\nอาหาร อาหารที่ [ROOT.Char.GetWomanMan] สามารถอยู่ได้โดยปราศจากมัน — ชั่วขณะหนึ่ง ท้องที่ร้องครวญครางอาจใช้เวลาหลายสัปดาห์กว่าจะคร่าชีวิตท่าน\n\nแต่หากปราศจากน้ำ โดยไม่มีที่ใดให้เติมน้ำในสายตาและเสบียงระหว่างทางกำลังร่อยหรอ ความกระหายคุกคามการสูญสิ้นที่ #EMP รวดเร็ว#! กว่ามาก"
