 ep3_laamp_flavour_ewan.4061.t: "ดวงตาในยามค่ำคืน"
 ep3_laamp_flavour_ewan.4061.desc.intro: "ยามเช้านำรายงานมาว่าสัตว์ร้ายกินคนได้โจมตีอีกครั้ง:"
 ep3_laamp_flavour_ewan.4061.desc.size.titanic: "สามคนหายไปเมื่อคืนนี้ ไม่เหลืออะไรนอกจากรอยเลือดและรอยเท้าเปื้อนโคลนของบางสิ่งที่ใหญ่โตมโหฬารอย่างแท้จริง"
 ep3_laamp_flavour_ewan.4061.desc.size.colossal: "สามคนหายไปเมื่อคืนนี้ ไม่เหลืออะไรนอกจากเศษกระดูกและแขนส่วนใหญ่ ถูกกินโดยสัตว์ประหลาดขนาดมหึมาบางตัว"
 ep3_laamp_flavour_ewan.4061.desc.size.mammoth: "สองคนหายไปเมื่อคืนนี้ พบว่าถูกฉีกเป็นชิ้นๆ และกระจายไปทั่วครึ่งไมล์โดยนักล่าขนาดมหึมาบางตัว"
 ep3_laamp_flavour_ewan.4061.desc.size.huge: "สองคนหายไปเมื่อคืนนี้ สิ่งที่เหลืออยู่ของพวกเขาถูกพบไม่ไกลจากเขตรอบนอก เป็นเพียงเศษเนื้อพันกันที่เหลือไว้โดยสัตว์ร้ายขนาดใหญ่บางตัว"
 ep3_laamp_flavour_ewan.4061.desc.size.large: "ผู้ติดตามอีกคนถูกฆ่า ศพส่วนใหญ่ของชายผู้นั้นถูกพบข้าง [ROOT.Char.Custom('GetRandomCampBuilding')] ที่ ซึ่งสัตว์ขนาดใหญ่ทิ้งเขาไว้"
 ep3_laamp_flavour_ewan.4061.desc.size.nimble: "อีกชีวิตหนึ่งหายไปอย่างไร้ร่องรอย เว้น แต่รอยลากเล็กน้อยและรอยเลือดสองสามหยดที่ ซึ่งสิ่งมีชีวิตที่ว่องไว ทำให้เหยื่อหมดสติ"
 ep3_laamp_flavour_ewan.4061.desc.midtro: "\n\nยามไม่สามารถมองเห็นเจ้าสิ่งเลวร้ายนั่นได้ ไม่ว่ามันจะเป็นอะไร มันติดใจรสชาติของเรา และดูเหมือนจะฉลาดพอที่จะตามเรามาในตอนกลางวันหรือตอนเย็นๆ\n\n"
 ep3_laamp_flavour_ewan.4061.desc.sight.blind: "ข้าเพ่งจิต"
 ep3_laamp_flavour_ewan.4061.desc.sight.sighted: "ข้าทอดสายตา"
 ep3_laamp_flavour_ewan.4061.desc.terrain.major_river: "ไปยังแม่น้ำที่เส้นทางของเราพาเรามาเลียบเคียง แหล่งน้ำอันกว้างใหญ่ เช่นนี้สามารถซ่อนความน่าสะพรึงกลัวใต้น้ำได้ทุกรูปแบบ"
 ep3_laamp_flavour_ewan.4061.desc.terrain.farmlands: "ไปยังพื้นที่เกษตรกรรมโดยรอบ ทะเลหนาทึบของแนวพุ่มไม้และทุ่งนาที่คั่นด้วยพุ่มไม้เล็กๆ ทุกๆ ยี่สิบฟุตสามารถซ่อนความน่าสะพรึงกลัวอีกอย่างได้"
 ep3_laamp_flavour_ewan.4061.desc.terrain.hills: "ไปยังพรมเนินเขาที่เราเคลื่อนผ่าน แต่ละลูกบดบังทัศนียภาพไปยังฝั่งตรงข้าม ทำให้สัตว์ร้ายน่าสะพรึงกลัวสามารถย่องตามเรามาได้ง่าย"
 ep3_laamp_flavour_ewan.4061.desc.terrain.mountains: "ไปยังยอดเขาและสันเขาขรุขระที่ตั้งตระหง่านเหนือเราในแสงอรุณรุ่งสลัว สถานที่นับไม่ถ้วนสำหรับความน่าสะพรึงกลัวที่อาศัยอยู่ในถ้ำบางชนิดที่จะซ่อนตัว"
 ep3_laamp_flavour_ewan.4061.desc.terrain.desert: "ไปยังทะเลทรายที่ล้อมรอบเรา มัน [ROOT.Char.Custom('SenseObserve_SeemLook')] เปิดโล่งมาก แต่ความน่าสะพรึงกลัวยามค่ำคืนที่เจ้าเล่ห์สามารถว่ายผ่านมันได้ง่ายดายเหมือนฉลามผ่านคลื่น"
 ep3_laamp_flavour_ewan.4061.desc.terrain.desert_mountains: "ไปยังยอดเขาที่เต็มไปด้วยฝุ่นและสันเขาทรายที่บังแสงแดดยามเช้าอันเจิดจ้าให้เรา มีสถานที่มากเกินไปสำหรับความน่าสะพรึงกลัวที่หิวโหยที่จะรอให้ความร้อนของวันผ่านพ้นไป"
 ep3_laamp_flavour_ewan.4061.desc.terrain.oasis: "$ep3_laamp_flavour_ewan.4061.desc.terrain.desert$"
 ep3_laamp_flavour_ewan.4061.desc.terrain.jungle: "ไปยังปมเถาวัลย์ของต้นไม้และเรือนยอดหนาทึบที่ชุ่มไปด้วยเถาวัลย์เบื้องบน สัตว์ร้ายน่าสะพรึงกลัวอาจอยู่ห่างจากเราสิบฟุตในตอนนี้ และเราจะไม่มีทางรู้เลย"
 ep3_laamp_flavour_ewan.4061.desc.terrain.forest: "ไปยังผืนป่าที่ทอดยาวไปทุกทิศทาง หนาแน่นเกินกว่าจะมองเห็นได้ไกลเกินร้อยฟุตจากเขตรอบนอกของค่าย ทำให้มีพื้นที่มากมายสำหรับความน่าสะพรึงกลัวที่จะซ่อนตัว"
 ep3_laamp_flavour_ewan.4061.desc.terrain.taiga: "$ep3_laamp_flavour_ewan.4061.desc.terrain.forest$"
 ep3_laamp_flavour_ewan.4061.desc.terrain.wetlands: "ไปยังขอบฟ้าที่เต็มไปด้วยหมอกและเนินเตี้ยๆ ที่กระจายอยู่ทั่วพื้นที่ชุ่มน้ำ พื้นดินส่วนใหญ่ราบเรียบ แต่ไม่เพียงพอที่จะให้ที่กำบัง #EMP ใดๆ#! สำหรับความน่าสะพรึงกลัวแปลกๆ บางอย่าง"
 ep3_laamp_flavour_ewan.4061.desc.terrain.steppe: "ไปยังทะเลหญ้าที่ล้อมรอบเรา มีเพียงคนโง่เท่านั้นที่จะคิดว่าภูมิประเทศที่ราบเรียบหมายถึงไม่มีที่ซ่อน ไม่มีสันเขาหรือหุบเขา ไม่มีถ้ำที่จะบรรจุความน่าสะพรึงกลัวแปลกๆ"
 ep3_laamp_flavour_ewan.4061.desc.terrain.floodplains: "ไปยังที่ราบน้ำท่วมถึงที่เต็มไปด้วยโคลนและมีต้นไม้เรียงรายที่เรากำลังเคลื่อนผ่าน ภูมิประเทศที่สมบูรณ์แบบสำหรับความน่าสะพรึงกลัวที่ชอบซุ่มโจมตีที่จะย่องผ่าน"
 ep3_laamp_flavour_ewan.4061.desc.terrain.drylands: "ไปยังพื้นดินแห้งแล้งที่เต็มไปด้วยฝุ่นที่เรากำลังเคลื่อนผ่าน ถูกขัดจังหวะด้วยเนินเขาและต้นไม้เป็นครั้งคราว ความน่าสะพรึงกลัวที่น้ำลายไหลใดๆ ก็สามารถย่องตามเราผ่านภูมิประเทศนี้ได้อย่างง่ายดาย"
 ep3_laamp_flavour_ewan.4061.desc.terrain.plains: "ไปยังที่ราบกว้างใหญ่ที่เรากำลังเคลื่อนผ่าน ราบเรียบ แต่ไม่ #EMP ทั้งหมด#! ราบเรียบ มีเนินและแอ่งเพียงพอที่จะซ่อนความน่าสะพรึงกลัวได้ทุกรูปแบบ"
 ep3_laamp_flavour_ewan.4061.desc.outro: "เฝ้ามอง รอคอย ความหิวค่อยๆ ก่อตัวขึ้นสำหรับอาหารมื้อเย็นของมัน"
 ep3_laamp_flavour_ewan.4061.a: "เพิ่มความเข้มงวดในการเฝ้ายาม"
 ep3_laamp_flavour_ewan.4061.a.tt.duel.safe: "อย่างเลวร้ายที่สุด สัตว์ร้ายจะกิน [followers|E] ที่มีชื่อของท่านไปสองสามคน"
 ep3_laamp_flavour_ewan.4061.a.tt.success: "สกัดกั้นและกำจัดได้"
 ep3_laamp_flavour_ewan.4061.a.tt.failure: "มีผู้เสียชีวิตเพิ่มอีกสองสามคน"
 ep3_laamp_flavour_ewan.4061.b: "ข้าจะตัดหัวมันเอง!"
 ep3_laamp_flavour_ewan.4061.a.tt.duel.risky: "ท่านไล่ตามสัตว์ร้ายด้วยตนเอง เสี่ยงต่อ [character_death_death|E] ที่อาจเกิดขึ้นเพื่อแลกกับ [prestige|E]"
 ep3_laamp_flavour_ewan.4061.a.tt.duel.risky.are_you_sure: "@alert_icon! #alert_trial ขึ้นอยู่กับว่ามันคืออะไร — และขนาดที่แท้จริงของมัน — นี่อาจจะค่อนข้างง่ายหรือยากมากๆ และท่านไม่สามารถถอยได้เมื่อออกเดินทางไปแล้ว#!"
 ep3_laamp_flavour_ewan.4061.c: "ตราบใดที่มันไม่กินคนสำคัญ"
 ep3_laamp_flavour_ewan.4061.c.tt.success: "มันไม่ได้ทำ"
