 ep3_laamp_flavour_ewan.1021.t: "รักแรกพบที่ค่าย"
 ep3_laamp_flavour_ewan.1021.desc: ""[ROOT.Char.Custom('StammerLetterMotherFather')|U]-ท่าน[ROOT.Char.GetMotherFather] ข้า ม-มีเรื่องจะขอร้อง" [child.Custom('GetDaughterSon')] [child.GetFirstName] ของข้าพูดตะกุกตะกัก ข้างหลัง [child.GetHerHim] มีเด็กหนุ่มชาว [crush_child.GetCulture.GetName] ร่างผอมเก้งก้างเกาะมือ [child.Custom('GirlBoy')] ของข้าอย่างขี้อายซ่อนตัวอยู่\n\n"นี่คือ [crush_child.GetFirstName] ข้า ช-ชอบ [crush_child.GetHerHim] มาก และข้าสงสัยว่า ค- [crush_child.GetSheHe] มากับพวกเราได้ไหม? พ่อแม่ของ [crush_child.GetHerHis|U] ด้วย [crush_child.GetSheHe] ทิ้งพวกเขาไว้ข้างหลังไม่ได้!""
 ep3_laamp_flavour_ewan.1021.a: "ข้าคิดว่าเราพอจะรับครอบครัวเพิ่มได้อีกครอบครัว..."
 ep3_laamp_flavour_ewan.1021.b: "เจ้าจะเลิกเจอ [crush_child.GetHerHim] เดี๋ยวนี้!"
 ep3_laamp_flavour_ewan.1021.c: "คงเป็นแค่ความรักชั่วครู่ เจ้าจะลืมมันไปเอง"
 ep3_laamp_flavour_ewan.1021.c.crush_endures: "ความหลงใหลของ [child.GetFirstNamePossessiveNoTooltip] ยังคงลุกโชน"
 ep3_laamp_flavour_ewan.1021.c.crush_fades: "ความหลงใหลจางหายไป"
 
 ep3_laamp_flavour_ewan.1031.t: "การเลี้ยงดู"
 ep3_laamp_flavour_ewan.1031.desc.intro: "ว่ากันว่าเด็กๆ ตอบสนองต่อสถานที่ที่พวกเขาพบเจอมากกว่าใครๆ\n\nนับเป็นโชคดีสำหรับ [child.Custom('GetDaughterSon')] [child.GetFirstName] ของข้าแล้วที่ [child.GetSheHe] พบ [child.GetHerselfHimself] อยู่ในหมู่"
 ep3_laamp_flavour_ewan.1031.desc.purpose.wanderers: "สหายผู้ภักดีที่สุด คนรู้จักที่น่าสนใจ และผู้ติดตามที่เป็นประโยชน์"
 ep3_laamp_flavour_ewan.1031.desc.purpose.mercenaries: "$knight_culture_player_plural_no_tooltip$ ที่แข็งแกร่ง ทหารรับจ้างที่ดุร้าย และทหารที่ทรหด"
 ep3_laamp_flavour_ewan.1031.desc.purpose.scholars: "บัณฑิตผู้คงแก่เรียน นักการทูตผู้มีวาทศิลป์ และปราชญ์ผู้ปราดเปรื่องที่สุด"
 ep3_laamp_flavour_ewan.1031.desc.purpose.explorers: "นักผจญภัยผู้ทะเยอทะยาน ชาวพื้นเมืองที่แปลกตา และนักเดินทางผู้ทรหด"
 ep3_laamp_flavour_ewan.1031.desc.purpose.brigands: "หัวขโมยเจ้าเล่ห์ โจรปล้นไร้ความปรานี และเดนมนุษย์ที่ชั่วร้าย"
 ep3_laamp_flavour_ewan.1031.desc.purpose.legitimists: "ผู้ภักดีที่มุ่งมั่น องครักษ์ชั้นยอด และทหารรับจ้างที่คุ้มค่า"
 ep3_laamp_flavour_ewan.1031.desc.outro: "ที่ข้าสามารถรวบรวมมาได้\n\nสภาพแวดล้อมที่ดีสำหรับ [child.Custom('GirlBoy')] หนุ่มสาวที่จะเติบโตขึ้น และเป็นที่ที่ [child.GetSheHe] ดูเหมือนจะมุ่งมั่นที่จะนำบทเรียนมากมายมาใส่ใจ"
 ep3_laamp_flavour_ewan.1031.tt.trait_adopted: "ได้รับลักษณะ"
 ep3_laamp_flavour_ewan.1031.tt.skill_gain: "ได้รับทักษะ"
 ep3_laamp_flavour_ewan.1031.a: "อาาา ความกระหายการเดินทางได้ครอบงำ '[child.Custom('GetErIm')] แล้ว"
 ep3_laamp_flavour_ewan.1031.b: "[child.GetSheHe|U] จะเป็นนักรบสักวันหนึ่ง"
 ep3_laamp_flavour_ewan.1031.c: "ช่างกระตือรือร้นเสียจริงในวัยเยาว์ เช่นนี้!"
 ep3_laamp_flavour_ewan.1031.d: "ข้าสงสัยว่า [child.GetSheHe] จะได้เห็นทิวทัศน์อะไรบ้าง..."
 ep3_laamp_flavour_ewan.1031.e: "ทัศนคตินี้จะช่วย [child.GetHerHim] ได้ดี"
 ep3_laamp_flavour_ewan.1031.f: "ความทะเยอทะยาน เช่นนี้เป็นเรื่องธรรมชาติ"
 ep3_laamp_flavour_ewan.1031.g: "บางทีเราอาจพิจารณาเส้นทางอื่นได้?"
 ep3_laamp_flavour_ewan.1031.g.tt.success: "ท่านปลูกฝังปัญญาเล็กน้อย"
 ep3_laamp_flavour_ewan.1031.g.tt.failure: "บทเรียนของท่านไม่ได้รับการใส่ใจ"
 ep3_laamp_flavour_ewan.1031.h: "*ถอนหายใจ* หยุดทำ เช่นนั้น [child.Custom('GirlBoy')]"
 geterim_er: "เขา"
