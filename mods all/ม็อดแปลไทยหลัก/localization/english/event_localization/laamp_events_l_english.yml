 ep3_laamp_flavour_ewan.1041.t: "บ้านเมืองเก่า"
 ep3_laamp_flavour_ewan.1041.desc: ""[ROOT.Char.GetMotherFather|U] บ้านเกิดเป็นอย่างไรบ้าง?" [child.Custom('GetDaughterSon')] [child.GetFirstName] ของข้าถามตอนอาหารเช้า\n\nข้าประหลาดใจเล็กน้อยกับคำถามกะทันหัน ข้าเขี่ยชามข้าวโอ๊ตอยู่ครู่หนึ่ง นึกย้อนไปถึงตอนที่ [memory.GetDescription]\n\nหลายปีแล้ว... ข้าคิดว่าเป็นเรื่องธรรมดาที่คนอายุน้อยอย่าง [child.GetFirstNameNoTooltip] จะอยากรู้ว่าสิ่งต่างๆ #EMP เคย#! เป็นอย่างไร"
