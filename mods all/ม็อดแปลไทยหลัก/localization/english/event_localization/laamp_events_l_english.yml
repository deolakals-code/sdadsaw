 ep3_laamp_flavour_ewan.4051.t: "เสบียงที่ไม่สามารถชี้แจงได้"
 ep3_laamp_flavour_ewan.4051.tt.most_provisions_regained: "$game_concept_provisions$ ส่วนใหญ่ถูกกู้คืน"
