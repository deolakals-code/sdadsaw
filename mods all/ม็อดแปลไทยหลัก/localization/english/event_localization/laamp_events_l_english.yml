 ep3_laamp_flavour_ewan_1041_horrible_home_martial_modifier_desc: "ตัวละครนี้อาจไม่มีความผูกพันกับบ้านเกิดที่สูญหายไป แต่พวกเขาก็ยังจำบทเรียนของมันได้"
