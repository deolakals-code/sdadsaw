 ep3_laamp_flavour_ewan.4062.desc.intro: "เราไม่อาจรอช้าอีกคืนเพื่อหนีเจ้าสิ่งนั้นได้ ข้ารวบรวมคณะล่าสัตว์ ตั้งใจจะจบเรื่องนี้ให้ได้ในเช้าวันนี้\n\nรอยเท้าของอสูรร้าย"
 ep3_laamp_flavour_ewan.4062.desc.tracks.canine: "นั้นตื้นและตามรอยได้ยาก แต่เป็นของสัตว์วงศ์สุนัขอย่างไม่ต้องสงสัย"
 ep3_laamp_flavour_ewan.4062.desc.tracks.feline: "แทบจะมองไม่เห็น แม้จะดูเหมือนเป็นของสัตว์วงศ์แมว"
 ep3_laamp_flavour_ewan.4062.desc.tracks.ursine: "นั้นเบาอย่างน่าประหลาดใจ แต่เป็นของสัตว์วงศ์หมีอย่างชัดเจน"
 ep3_laamp_flavour_ewan.4062.desc.tracks.hippopotomine: "นั้นหนัก และ... ประหลาด ข้าไม่สามารถระบุได้แน่ชัด"
 ep3_laamp_flavour_ewan.4062.desc.tracks.crocodyline: "ดูเหมือน... มือมนุษย์ ที่ลากตัวเองไปข้างหน้าด้วยนิ้วที่มีกรงเล็บแหลมคม"
 ep3_laamp_flavour_ewan.4062.desc.tracks.human: "นั้นเบาหวิวและระบุไม่ได้ ราวกับถูกอำพรางไว้โดยเจตนา"
 ep3_laamp_flavour_ewan.4062.desc.tracks.connector: "หลังจากผ่านไปเกือบชั่วโมง"
 ep3_laamp_flavour_ewan.4062.desc.terrain.major_river: "เราก็มาถึงหาดทรายริมแม่น้ำ"
 ep3_laamp_flavour_ewan.4062.desc.terrain.farmlands: "เราก็มาถึงช่องว่างในแนวพุ่มไม้ยาว"
 ep3_laamp_flavour_ewan.4062.desc.terrain.hills: "เราก็ขึ้นมาถึงยอดเนินเขาสูง"
 ep3_laamp_flavour_ewan.4062.desc.terrain.mountains: "เราก็มาถึงขอบหน้าผาสูงชัน"
 ep3_laamp_flavour_ewan.4062.desc.terrain.desert: "เราก็มาถึงฐานของเนินทรายสูง"
