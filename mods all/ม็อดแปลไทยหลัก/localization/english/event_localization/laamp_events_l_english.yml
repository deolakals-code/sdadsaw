 ep3_laamp_flavour_ewan.1041.c: "สักวันหนึ่ง เจ้าจะได้รู้จักมันด้วยตัวเอง"
 ep3_laamp_flavour_ewan.1041.d: "บางทีเราอาจจะกลับไปสักวัน ค่อยถามข้าตอนนั้น"
 ep3_laamp_flavour_ewan.1041.e: "ข้าจะไม่พูดถึงมัน"
