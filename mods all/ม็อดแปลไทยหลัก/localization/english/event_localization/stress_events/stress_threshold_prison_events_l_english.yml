l_english: 
 # Level 1 Stress Events
 stress_threshold_prison.1001.t:0 "สติแตก: ปัญหาในคุก"
 stress_threshold_prison.1001.desc:0 "การถูกจองจำ, ถูกขังห่างไกลจากทุกสิ่งที่เคยเป็นสุขและน่าเพลิดเพลินในชีวิต..."
 stress_threshold_prison.1001.desc.normal:0 "มันยากที่จะไม่ตกอยู่ในความสิ้นหวัง"
 stress_threshold_prison.1001.desc.cynical:0 "\n\nเหตุใด [ROOT.Char.GetFaith.HighGodName] จึงปล่อยให้สถานที่แห่งความสิ้นหวังนี้ดำรงอยู่ได้? เทพองค์ใดเล่าจะทำ เช่นนั้น?"
 stress_threshold_prison.1001.desc.depressed:0 "มันเคยรบกวนข้า, แต่แปลกที่, บัดนี้ไม่เป็น เช่นนั้นแล้ว"
 stress_threshold_prison.1001.inappetetic.gain:0 "ข้าทนกินอาหารเหลวนี้ต่อไปไม่ไหวแล้ว"
 stress_threshold_prison.1001.inappetetic.effect:0 "อาหารวางอยู่บนจานโดยไม่ถูกแตะต้อง"
 stress_threshold_prison.1001.cynical.gain:0 "[ROOT.Char.GetFaith.HighGodName] ได้ทอดทิ้งข้าแล้ว..."
 stress_threshold_prison.1001.cynical.effect:0 "นี่พิสูจน์แล้วว่าไม่มี [ROOT.Char.GetFaith.HighGodName] อยู่จริง..."
 stress_threshold_prison.1001.endure:0 "เหตุใดยังไม่มีใครปล่อยข้าไป!?"
 stress_threshold_prison.1001.depressed.gain:0 "ชีวิต เช่นนี้จะมีค่าควรแก่การมีชีวิตอยู่ได้อย่างไร?"
 stress_threshold_prison.1001.depressed.effect:0 "ไม่มีความเจ็บปวด ข้าตายจากภายในไปแล้ว"
 stress_threshold_prison.1011.t:2 "สติแตก: ความหิวโหย"
 stress_threshold_prison.1011.desc:0 "เป็นเวลาหลายวันแล้วที่ข้าไม่สามารถกินอะไรลงท้องได้ จิตใจที่วิตกกังวลของข้าปฏิเสธที่จะให้ร่างกายมีเรี่ยวแรงกินข้าวต้มแห้งๆ ที่ผู้คุมนำมาให้\n\nข้ารู้สึกอ่อนแอลงทุกวัน, แต่ [ROOT.Char.GetWomanMan] จะทำอะไรกับร่างกายของ [ROOT.Char.GetHerHis] เองได้?"
 stress_threshold_prison.1011.a:0 "การอดตายยังดีกว่าอาหารเหลวนี้"
 stress_threshold_prison.1011.b:1 "มี #EMP แหล่งอาหาร#! ทางเลือกอื่น ๆ อยู่ที่นี่..."
 stress_threshold_prison.1011.c:0 "[ROOT.Char.GetSheHe|U] สามารถต่อสู้กับมันได้, ทีละช้อน!"

 stress_threshold_prison.1012.t:1 "สติแตก: เวลาให้อาหาร"
 stress_threshold_prison.1012.desc:0 "พวกเขาคิดว่าไม่มีอะไรให้กินในนี้, ว่าพวกเขากำลัง ทำให้ข้าอดตาย, ทำให้ข้าแตกสลาย\n\nพวกเขาไม่รู้ว่าข้าได้รับการเลี้ยงดูดีกว่าที่เคย...\n\nนี่คือห้องโถงจัดเลี้ยง, เต็มไปด้วยอาหารเลิศรสและเสียงโห่ร้องเฉลิมฉลอง"
 stress_threshold_prison.1012.a:0 "อบอุ่นและชุ่มฉ่ำและเต็มไปด้วยชีวิตชีวา"

 stress_threshold_prison.1021.t:1 "สติแตก: เกมอันโหดร้าย"
 stress_threshold_prison.1021.desc:0 "มีความเพลิดเพลินเพียงเล็กน้อยที่จะพบได้ที่นี่ใน [bg_override_char.Custom('GetDungeon')|l] อันสกปรกนี้ แอ่งน้ำนิ่งเหม็นอับ, ถังที่น่าขยะแขยง, กองหินเล็กๆ—\n\nเงาดำของ [fellow_prisoner.GetTitledFirstName] ที่มุมตรงข้ามดูเหมือนจะเป็นเป้าหมายที่ยอดเยี่ยมทันที"
 stress_threshold_prison.1021.a:0 "สิบคะแนนถ้าข้าปาโดนหัว [fellow_prisoner.GetHerHis]!"
 stress_threshold_prison.1021.b:0 "ความเจ็บปวดของผู้อื่นไม่ได้ช่วยอะไรข้าเลย แต่ของข้า..."
 stress_threshold_prison.1021.c:0 "ข้าคิดเรื่องดำมืด เช่นนี้ได้อย่างไร!?"

 stress_threshold_prison.1031.t:0 "สติแตก: การคว้าอำนาจ"
 stress_threshold_prison.1031.desc:0 "ถูกขังอยู่ที่นี่, ข้าควรจะอ่อนแอและสงบเสงี่ยม ฮ่า!\n\nที่นี่ในความมืด, ข้ารวบรวมกำลังและฝึกฝนการฉีกแขนขาศัตรูในใจข้า! ซ้ำแล้วซ้ำเล่า, ทุกวันที่พวกเขาเกิดใหม่และทุกวันที่ข้าทำลายพวกเขาราวกับเป็นสัตว์รบกวน!\n\nโดยเฉพาะอย่างยิ่งผู้คุมที่น่ารังเกียจของข้า, [jailer.GetTitledFirstName]... [jailer.GetSheHe] จะต้องทนทุกข์ทรมานที่สุด!"
 stress_threshold_prison.1031.a:0 "เมื่อข้าออกไป... โอ้ พวกเขาจะต้อง #EMP ชดใช้#!!"
 stress_threshold_prison.1031.b:0 "จะรอทำไม? ในใจข้า, พวกเขาอยู่ในความเมตตาของข้า..."
 stress_threshold_prison.1031.c:0 "ไม่... นี่มันผิด ข้าดีกว่านี้"

 stress_threshold_prison.1041.t:0 "สติแตก: ความต้องการที่ถูกลืม"
 stress_threshold_prison.1041.desc:0 "กิจวัตรของข้าเหมือนเดิมเสมอเมื่อเช้าเปลี่ยนเป็นกลางวัน, เปลี่ยนเป็นกลางคืน...\n\nกลิ่นเหม็นคลื่นไส้ของอาหารบูดเน่าอบอวลอยู่ในอากาศ กองจานสูงขึ้นเมื่อใด? ข้าพลาดอาหารไปกี่มื้อแล้ว? มันยากขึ้นเรื่อยๆ ที่จะรักษาความรู้สึกปกติ..."
 stress_threshold_prison.1041.depressed:0 "มันยากยิ่งกว่าที่จะจำได้ว่าทำไมข้าควรจะพยายามด้วยซ้ำ"
 stress_threshold_prison.1041.inappetetic:0 "อาหารจะมีประโยชน์อะไรหากปราศจากอิสรภาพ?"
 stress_threshold_prison.1041.flagellant:0 "ความเจ็บปวดจะให้บางสิ่งแก่ข้าเพื่อจดจ่อ"
 stress_threshold_prison.1041.journaller.gain:0 "บางทีการเขียนอาจทำลายความซ้ำซากจำเจได้..."
 stress_threshold_prison.1041.journaller.effect:0 "ข้าดีใจที่อย่างน้อยข้าก็มีสมุดบันทึกของข้า"
 stress_threshold_prison.1041.athletic:0 "ข้าอาจถูกขัง, แต่ข้ายังคงออกกำลังกายได้..."
 stress_threshold_prison.1041.optout:0 "ข้าจะออกไปได้ในที่สุด... ใช่ไหม?"

 # Level 2 Stress Events
 stress_threshold_prison.2001.t:1 "สติแตก: การตะเกียกตะกายออกไป"
 stress_threshold_prison.2001.desc:0 "เหตุใดพวกเขาถึงไม่ #EMP ปล่อยข้าออกไป#!?! แน่นอนว่าข้าอยู่ใน [bg_override_char.Custom('GetDungeon')|l] ที่หนาวเย็น, #EMP คับแคบ#! นี้มานานพอแล้ว?\n\nข้ากอดมือที่เปื้อนเลือดไว้แนบอกขณะนั่งพิงลูกกรง หากข้าข่วนนานพอและแรงพอ, พันธนาการของข้าต้องหลุดออก, ใช่ไหม?\n\n...ใช่ไหม?"
 stress_threshold_prison.2001.a:0 "ข้าต้องพยายามต่อไป!"
 stress_threshold_prison.2001.b:0 "อา, ลืมมันไปเถอะ จะไปสนใจ... อะไรทำไม?"

 stress_threshold_prison.2011.t:1 "สติแตก: [ROOT.Char.Custom('prison_pet')|U] ของข้าและข้า"
 stress_threshold_prison.2011.desc_rat:0 "เป็นเวลาหลายวันแล้วที่หนูตัวเดิมมาเยี่ยมข้า มันมองข้าด้วยความเห็นอกเห็นใจและความไว้วางใจ, สิ่งที่ข้าไม่ได้ประสบมานานแล้ว"
 stress_threshold_prison.2011.desc_stone:0 "การปรากฏตัวที่มั่นคงเคียงข้างข้า, สิ่งที่ไม่เปลี่ยนแปลงในชีวิตที่พลิกผัน หินที่ข้าไว้วางใจคือเพื่อนคู่หูและสหายของข้า, อยู่ที่นั่นเสมอเมื่อข้าต้องการ"
 stress_threshold_prison.2011.desc_spoon:0 "หนึ่งในไม่กี่สิ่งที่คงที่ในชีวิตข้าที่นี่ใน [bg_override_char.Custom('GetDungeon')|l], แหล่งปลอบโยนและเพื่อนเพียงหนึ่งเดียว... ช้อนของข้าอยู่ที่นั่นเสมอเมื่อข้าต้องการ, และมันไม่เคยตัดสินข้า — แม้ในวันที่มืดมนที่สุดของข้า"
 stress_threshold_prison.2011.desc_cockroach:0 "และนั่นมันอีกแล้ว, แมลงสาบ, นั่งอยู่ในมุมมืดของมัน มันคือเพื่อนคู่หูของข้า, สหายที่ข้าไว้วางใจ, #EMP บุตร#! ของข้า\n\nมันเฝ้ามองข้า, อยู่เป็นเพื่อนข้าในสถานที่อันเลวร้ายนี้"
 stress_threshold_prison.2011.desc_end:0 "\n\nข้าไม่เคยรู้สึกผูกพันกับสิ่งมีชีวิตอื่น เช่นนี้มาก่อน, ความทุ่มเทและความเห็นอกเห็นใจ เช่นนี้"
 stress_threshold_prison.2011.a:0 "มานี่สิ, [ROOT.Char.Custom('prison_pet')] น้อย, ให้ข้ากอดเจ้า"

 stress_threshold_prison.2021.t:1 "สติแตก: มุมที่มืดมิดที่สุด"
 stress_threshold_prison.2021.desc:0 "ผู้คุมบอกข้าว่าข้าอยู่คนเดียวมาหลายวันแล้ว, แต่ข้ารู้ดีกว่านั้น ข้า #EMP รู้สึก#! ได้ว่าพวกมันกำลังเฝ้ามองข้า, ประเมินข้า, ประเมินความกลัวและจุดอ่อนของข้า...\n\nทุกเสียงบอกข้าถึงการมีอยู่ของพวกมัน, ทุกเงาบอกถึงภัยคุกคามของพวกมัน"
 stress_threshold_prison.2021.a:0 "ข้าต้องระแวดระวังตลอดไป!"
 stress_threshold_prison.2021.b:0 "ข้าต้องซ่อนตัวที่ไหนสักแห่ง... ที่ใดก็ได้!"
 stress_threshold_prison.2021.c:0 "บางทีข้าอาจจะคุยกับพวกมันได้?"

 # Level 3 Stress Events
 stress_threshold_prison.3001.t:1 "สติแตก: สหายในยามยาก"
 stress_threshold_prison.3001.desc:0 "สิ่งที่พวกเขาไม่เคยบอกข้าเกี่ยวกับ [bg_override_char.Custom('GetDungeonPlural')|l] คือมัน #EMP น่าเบื่ออย่างร้ายกาจ#! เพียงใด! ขอบคุณสวรรค์ที่ [fictional_friend.Custom('DuchessDuke')|U] [fictional_friend.Custom('RandomExampleName')] อยู่ที่นี่เพื่อเป็นเพื่อนข้า\n\n[fictional_friend.Custom('DuchessDuke')] ผู้ดีงามพูดตลกไม่เหมือนใคร, และ ทำให้ข้ามีกำลังใจเสมอ และ [fictional_friend.GetSheHe] ก็ฉลาดหลักแหลมด้วย\n\nอะไรนะ, [fictional_friend.Custom('DuchessDuke')|U]? #EMP ฮ่า!#! เยี่ยมไปเลย!"
 stress_threshold_prison.3001.a:0 "มานี่สิเจ้าคนเจ้าเล่ห์!"

 stress_threshold_prison.3011.t:1 "สติแตก: ครอบครัวที่แท้จริง"
 stress_threshold_prison.3011.desc:0 "ข้ากลั้นน้ำตา — ข้าเคย #EMP หลงทาง#! อย่างสิ้นหวัง — แต่ตอนนี้สิ่งต่างๆ ดีขึ้นแล้ว! ครอบครัวของข้าอยู่ที่นี่กับข้า, คอยปกป้องข้าให้ปลอดภัย\n\nท่านแม่และท่านพ่อกอดข้าไว้ใกล้ๆ"
 stress_threshold_prison.3011.sibling: "[sibling.Custom('SisterBrother')] ของข้า, [sibling.GetFirstName], เฝ้ามองข้า"
 stress_threshold_prison.3011.sibling_multiple: "[sibling.Custom('SisterBrother')] ของข้า, [sibling.GetFirstName] — พี่น้องทั้งหมดของข้า — เฝ้ามองข้า"
 stress_threshold_prison.3011.child: "[child.GetDaughterSon] ของข้า, [child.GetFirstName], จับมือข้า, รักษาแสงสว่างในดวงตาข้าให้ส่องประกาย"
 stress_threshold_prison.3011.child_multiple: "บุตรของข้า — บุตรมากมายทั้งหมดของข้า — รวมตัวกันอยู่รอบๆ, รักษาแสงสว่างในดวงตาข้าให้ส่องประกาย"
 stress_threshold_prison.3011.fallback: "พวกเขาทั้งหมดรวมตัวกันอยู่รอบตัวข้า, รักษาแสงสว่างในดวงตาข้าให้ส่องประกาย"
 stress_threshold_prison.3011.a:0 "ข้าคิดได้อย่างไรว่าข้าถูกทอดทิ้ง?"

 stress_threshold_prison.3999.t:1 "สติแตก: อิสรภาพ"
 stress_threshold_prison.3999.desc:0 "ข้าทนต่อไปไม่ไหวแล้ว จิตใจของข้าแจ่มใสกว่าที่เป็นมาหลายสัปดาห์, และข้ารู้ว่าข้าแตกสลายในหลายๆ ด้าน\n\nร่างกายของข้ามี แต่ความเจ็บปวด, แม้ แต่การหายใจก็เจ็บปวด [bg_override_char.Custom('GetDungeon')|l] รอบตัวข้าไม่รู้สึกกดขี่อีกต่อไป, แต่กลับรู้สึกสบายใจ ต้อนรับ\n\nข้ารู้ในใจว่านี่คือลมหายใจสุดท้ายของข้า"
 stress_threshold_prison.3999.a:0 "[ROOT.Char.GetFaith.PositiveAfterLife|U] โอบกอดข้า"
