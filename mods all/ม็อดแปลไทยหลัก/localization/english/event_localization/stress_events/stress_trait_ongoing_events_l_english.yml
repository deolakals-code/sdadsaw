 stress_trait_ongoing.1501.t:0 "ความหลงใหล"
 stress_trait_ongoing.1501.desc_1_a:0 "ข้าเหลือบเห็นร่องอกอันยั่วยวนของ [obsession.GetTitledFirstNamePossessive] เมื่อข้าเดินผ่าน [obsession.GetHerHim] เมื่อเช้านี้"
 stress_trait_ongoing.1501.desc_1_b:0 "ข้าสังเกตเห็นส่วนนูนที่บ่งบอกบางอย่างยื่นออกมาจากกางเกงรัดรูปของ [obsession.GetTitledFirstNamePossessive] เมื่อข้าเดินผ่าน [obsession.GetHerHim] เมื่อเช้านี้"
 stress_trait_ongoing.1501.desc_1_c:0 "[obsession.Custom2('MyCharacterIntroduction', ROOT.Char)|U] ยิ้มให้ข้าอย่างอบอุ่นเมื่อข้าเดินผ่าน [obsession.GetHerHim] เมื่อเช้านี้"
 stress_trait_ongoing.1501.desc_1_d:0 "ข้าอดไม่ได้ที่จะปล่อยให้สายตาของข้าจับจ้องไปทั่วร่างของ [obsession.GetTitledFirstNamePossessive] เมื่อข้าเดินผ่าน [obsession.GetHerHim] เมื่อเช้านี้"
 stress_trait_ongoing.1501.bridge:0 "นับตั้งแต่นั้นมา ข้าก็ไม่สามารถหยุดคิดถึง [obsession.GetHerHim] ได้ และจินตนาการอันลามกของข้าก็คอยกวนใจข้าจากการทำงานอยู่เรื่อย\n\n"
 stress_trait_ongoing.1501.desc_2_a:0 "หน้าอกอวบอิ่มของ[obsession.GetHerHis|U],"
 stress_trait_ongoing.1501.desc_2_b:0 "สะโพกผายของ[obsession.GetHerHis|U],"
 stress_trait_ongoing.1501.desc_2_c:0 "ความเป็นชายอันยั่วยวนของ[obsession.GetHerHis|U],"
 stress_trait_ongoing.1501.desc_2_d:0 "ร่างอรชรของ[obsession.GetHerHis|U],"
 stress_trait_ongoing.1501.desc_2_e:0 "ไหล่กว้างของ[obsession.GetHerHis|U],"
 stress_trait_ongoing.1501.desc_2_f:0 "รูปร่างน่าดึงดูดของ[obsession.GetHerHis|U],"
 stress_trait_ongoing.1501.desc_3_a:0 "ท่วงท่าที่ร่างอันคล่องแคล่วของ[obsession.GetHerHis]เคลื่อนไหวไป..."
 stress_trait_ongoing.1501.desc_3_b:0 "ท่วงท่าที่ร่างอวบอั๋นของ[obsession.GetHerHis]โยกย้ายขณะที่[obsession.GetSheHe]เดินไป..."
 stress_trait_ongoing.1501.desc_3_c:0 "ท่วงท่าที่กล้ามเนื้อของ[obsession.GetHerHis]เกร็งตัวใต้ผิวหนังขณะที่[obsession.GetSheHe]เดินผ่านไป..."
 stress_trait_ongoing.1501.desc_3_d: "ความสง่างามและศักดิ์ศรีที่ [obsession.GetSheHe] วางตัว[obsession.GetHerselfHimself]ด้วย..."
 stress_trait_ongoing.1501.desc_3_e:0 "ท่วงท่าที่[obsession.GetSheHe]เดินด้อมๆ มองๆ อย่างซุกซนไปทั่ว [ROOT.Char.Custom('ResidenceBuilding')]..."
 stress_trait_ongoing.1501.desc_3_f:0 "จังหวะการเดินที่มั่นคงขณะที่[obsession.GetSheHe]เดินไป..."
 stress_trait_ongoing.1501.end:0 "มันมากเกินไปแล้ว! ข้าต้องหาทางบรรเทาจากความหลงใหลนี้ มิฉะนั้นข้าจะไม่มีวันทำอะไรสำเร็จ!"
 stress_trait_ongoing.1501.warning:0 "\n\nอนิจจา ข้ารู้ว่า [obsession.GetFirstName] ไม่มีความสนใจใน [ROOT.Char.GetWomenMen] และ ดังนั้น [obsession.GetSheHe] จะไม่มีความสนใจในตัวข้า"
 stress_trait_ongoing.1501.a:0 "ข้าต้องรู้ให้ได้ว่า [obsession.GetSheHe] รู้สึก เช่นเดียวกันหรือไม่!"
 stress_trait_ongoing.1501.a.flavor:0 "สิ่งนี้จะคลี่คลายเรื่องต่างๆ ไม่ทางใดก็ทางหนึ่ง"
 stress_trait_ongoing.1501.a.success:0 "[obsession.GetTitledFirstName] ก็ปรารถนาในตัวข้า เช่นกัน"
 stress_trait_ongoing.1501.a.failure:0 "[obsession.GetTitledFirstName] ปฏิเสธการเข้าหาของข้า"
 stress_trait_ongoing.1501.b:0 "การเพ้อฝันเล็กน้อยคงไม่เสียหายกระมัง?"
 stress_trait_ongoing.1501.b.flavor:0 "การอยู่ตามลำพังบ้างจะช่วยบรรเทาได้ชั่วคราว อย่างน้อยก็"
 stress_trait_ongoing.1501.c:0 "การไปซ่องนางโลมจะช่วยให้ข้าเลิกคิดถึง [obsession.GetHerHim] ได้..."
 stress_trait_ongoing.1501.c.flavor:0 "#EMP ใครสักคน#! ที่นั่นย่อมช่วยให้ข้าผ่านพ้นเรื่องนี้ไปได้อย่างแน่นอน"
