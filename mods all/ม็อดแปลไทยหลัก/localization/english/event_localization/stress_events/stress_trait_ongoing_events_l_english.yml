 stress_trait_ongoing.4501.t:0 "ไม่มีอะไรให้กินสักคำ"
 stress_trait_ongoing.4501.desc:0 "สองสามสัปดาห์ที่ผ่านมานี้ตึงเครียดเป็นพิเศษ และสิ่งที่ข้าต้องการทั้งหมดคือ [ROOT.Char.Custom('FavoriteTreat')] อร่อยๆ สักชิ้น... หรืออาจจะหลายชิ้น...\n\nให้ตายสิ บางทีอาจจะทั้งโต๊ะเลย!\n\nอนิจจา พ่อครัวของข้าแจ้งว่าเขาไม่มีเหลือแล้ว และไม่มีวัตถุดิบที่จะทำเพิ่มด้วย"
 stress_trait_ongoing.4501.a:0 "เอาเหรียญเหล่านี้ไป ไม่ว่าจะต้องทำอย่างไร หาอาหารมาให้ข้า!"
 stress_trait_ongoing.4501.b:0 "เจ้ามี #EMP อะไร#! บ้างที่พอจะสนองความอยากของข้าได้?"
 stress_trait_ongoing.4501.b.success:0 "ท่านค้นพบของหวานโปรดชนิดใหม่"
 stress_trait_ongoing.4501.b.cannibal:0 "ท่านเริ่มติดใจในรสชาติเนื้อมนุษย์"
 stress_trait_ongoing.4501.b.failure:0 "ความอยากของท่านไม่ได้รับการสนอง"
 stress_trait_ongoing.4501.c:0 "เฮ้อ... ข้าคงต้องทนไม่มีไปก่อน"

 stress_trait_ongoing.4502.t:0 "ความหิวโหย"
 stress_trait_ongoing.4502.desc:0 "สองสามสัปดาห์ที่ผ่านมานี้ตึงเครียดเป็นพิเศษ และสิ่งที่ข้าต้องการทั้งหมดคือเนื้อชิ้นงามๆ ชุ่มฉ่ำ เนื้อส่วนที่นุ่มอย่างเนื้อสัน หรืออาจจะเป็นซี่โครง?\n\nปากของข้าน้ำลายสอเมื่อนึกถึง และข้ารู้ว่าข้าไม่อาจยับยั้งความหิวโหยได้ ไม่ใช่ครั้งนี้"
 stress_trait_ongoing.4502.a:0 "คงไม่มีใครคิดถึง [prisoner.GetTitledFirstNameNoTooltip] หรอก"
 stress_trait_ongoing.4502.b:0 "อย่างไรเสีย [courtier.GetTitledFirstNameNoTooltip] ก็สมควรแล้วที่มันจะเกิดกับ[courtier.GetHerHim]..."
 stress_trait_ongoing.4502.c:0 "ได้เวลาเดินทางลงไปยัง [hapless_village.GetNameNoTier] แล้ว!"

 stress_trait_ongoing.5001.t:0 "งานเลี้ยงแห่งเจตนา"
 stress_trait_ongoing.5001.desc:0 ""ตามข้ามา [ROOT.Char.GetTitledFirstName] ข้ามีเรื่องประหลาดใจให้ท่าน!" [giver.Custom2('MyCharacterIntroduction', ROOT.Char)] กล่าวอย่างตื่นเต้น "ข้าสังเกตเห็นว่าท่านทานอาหารได้ไม่ดีนัก ข้าจึงใช้เวลาหลายสัปดาห์เสาะหาอาหารอันโอชะที่หายากที่สุดเท่าที่ข้าจะหาได้!"\n\nเมื่อตาม [giver.GetHerHim] ไป ข้าเห็นโต๊ะที่เต็มไปด้วยอาหารเลิศรสหลากหลายชนิด [ROOT.Char.Custom('GetExpensiveMeal')|U] และ [ROOT.Char.Custom('GetExpensiveMealAlt')]... [ROOT.Char.Custom('GetExpensiveDessert')]... เพียงแค่กลิ่นก็ ทำให้ข้าท้องไส้ปั่นป่วน\n\n"เป็นอย่างไรบ้าง? ทานเลยสิ [ROOT.Char.Custom('FormOfAddressForLiege')]!""
 stress_trait_ongoing.5001.a:0 "\"มัน เอ่อ... อร่อยจริงๆ อืม อร่อยมาก\""
 stress_trait_ongoing.5001.a.flavor:0 "ข้าจะกินอาหาร แต่เพียงเพื่อรักษามารยาทเท่านั้น"
 stress_trait_ongoing.5001.b:0 "\"ท่านไม่น่าเลย... ไม่จริงๆ นะ #EMP คนรับใช้!#! เอาสิ่งนี้ออกไป\""
 stress_trait_ongoing.5001.c.dog:0 "แสร้งทำเป็นกิน แต่ป้อนทั้งหมดให้ [ROOT.Char.Custom('DogStoryName')] ใต้โต๊ะ"
 stress_trait_ongoing.5001.c.cat:0 "แสร้งทำเป็นกิน แต่ป้อนทั้งหมดให้ [ROOT.Char.Custom('CatStoryName')] ใต้โต๊ะ"
 stress_trait_ongoing.5001.c.no_pet:0 "แสร้งทำเป็นกิน แต่ป้อนทั้งหมดให้สุนัขใต้โต๊ะ"
 stress_trait_ongoing.5001.c.success:0 "[giver.GetTitledFirstName] คิดว่าข้าเพลิดเพลินกับอาหาร"
 stress_trait_ongoing.5001.c.failure:0 "[giver.GetTitledFirstName] สังเกตเห็นว่าข้าไม่ได้กินอาหาร"

