l_english: 
 stress_threshold_special.1001.t:0 "จิตแตกสลาย: ความโศกเศร้าท่วมท้น"
 stress_threshold_special.1001.desc_intro_standard:0 "ชีวิตมิเคยง่ายดาย แต่ดูเหมือนว่าการสูญเสีย [deceased_character.GetFirstName] [ROOT.Char.Custom2('RelationToMeShort', deceased_character)] ของข้า ได้ผลักดันข้าจนเกินขีดจำกัด\n\n"
 stress_threshold_special.1001.desc_intro_lover:0 "แสงสว่างได้ดับไปจากชีวิตข้า\n\nเมื่อ [deceased_character.GetFirstName] [deceased_character.Custom('LoverPetName')] ของข้าจากไป ชีวิตพลันดูมืดมนยิ่งนัก"
 stress_threshold_special.1001.desc_intro_friend:0 "สหายข้า [deceased_character.GetFirstName] อยู่เคียงข้างข้าเสมอ ข้ามิคาดว่าการตายของ[deceased_character.GetHerHis]จะเป็นเรื่องง่าย แต่ข้าก็มิอาจจินตนาการได้เลยว่ามันจะยากลำบากถึงเพียงนี้"
 stress_threshold_special.1001.desc_spouse:0 "[deceased_character.GetSheHe|U] คือคู่ชีวิตของข้า ช่วยข้าผ่านพ้นบททดสอบและความยากลำบากมากมาย แม้เราอาจเคยมีความขัดแย้ง การเผชิญชีวิตโดยปราศจาก [deceased_character.GetHerHim] มันช่างรู้สึก... น่าหวาดหวั่น\n\nข้าจะจัดการได้อย่างไรหากไม่มี [deceased_character.GetHerHim]?"
 stress_threshold_special.1001.desc_child_toddler:0 "ยังเยาว์วัยนัก เปี่ยมด้วยชีวิตและศักยภาพ บัดนี้ นิ่งสนิทโดยสมบูรณ์...\n\nนิ่งสนิทชั่วนิรันดร์ ไม่หัวเราะหรือร่ำไห้อีกต่อไป"
 stress_threshold_special.1001.desc_child_older:0 "ข้ายังจำ [deceased_character.GetHerHim] เมื่อครั้งยังเป็นทารกได้ ตัวเล็ก บอบบางยิ่งนัก ถึงกระนั้น [deceased_character.GetSheHe] ก็รอดชีวิต เติบใหญ่ เติบโตขึ้น จนกระทั่ง... บัดนี้ เมื่อ [deceased_character.GetSheHe] หยุดลงอย่างกะทันหัน\n\nข้าเคยมีความหวังมากมายสำหรับอนาคตของ[deceased_character.GetHerHis]... สิ่งต่างๆ มากมายที่ข้าปรารถนาจะได้เห็น ซึ่งบัดนี้ไม่มีวันเป็นจริงได้"
 stress_threshold_special.1001.desc_parent:0 "แม้ข้ารู้ว่ามันต้องเกิดขึ้นในที่สุด ข้าก็พบว่าตนเองไม่ได้เตรียมพร้อมอย่างน่าเศร้าสำหรับการตายของ [ROOT.Char.Custom2('RelationToMe', deceased_character)] ของข้า\n\nทันใดนั้น ข้าก็ไม่สามารถไปหา [deceased_character.GetHerHim] เพื่อขอความปลอบใจหรือคำแนะนำได้อีกต่อไป\n\nมีเพียงพื้นที่ว่างเปล่าในที่ที่พวกเขาเคยอยู่... มันจะถูกเติมเต็มได้หรือไม่?"
 stress_threshold_special.1001.desc_lover:1 "แต่ละวันคือการต่อสู้ ที่ ซึ่งข้าดิ้นรนเพื่อค้นหาความหมายในการไม่มีอยู่ของ[deceased_character.GetHerHis] ข้าหยุดคิดถึงช่วงเวลาอันแสนวิเศษที่เราเคยมีร่วมกันไม่ได้...\n\nบัดนี้จะไม่มีอีกต่อไปแล้ว"
 stress_threshold_special.1001.desc_friend:0 "\n\n[deceased_character.GetSheHe|U] พร้อมเสมอที่จะให้กำลังใจข้าหรือช่วยข้าออกจากสถานการณ์คับขัน ด้วยปัญหาทั้งหมดของข้าเมื่อเร็วๆ นี้ การไม่มีอยู่ของ[deceased_character.GetHerHis]จึงเป็นที่สังเกตเห็นได้ชัดเป็นพิเศษ"
 stress_threshold_special.1001.depressed:0 "ชีวิตที่ปราศจาก [deceased_character.GetHerHim] ยังควรค่าแก่การมีอยู่หรือไม่?"
 stress_threshold_special.1001.drunkard:0 "ดื่มเพื่อระลึกถึง [deceased_character.GetHerHim]... และดื่มเพื่อลืมเลือน"
 stress_threshold_special.1001.hashishiyah:0 "ความเจ็บปวดนี้ช่างรุนแรงเกินไป ข้าต้องการบางสิ่งเพื่อ ทำให้มันชาด้าน..."
 stress_threshold_special.1001.flagellant:0 "มันเป็นความผิดของข้าทั้งหมดด้วย ข้าสมควรได้รับความทุกข์ทรมานสำหรับสิ่งนี้..."
 stress_threshold_special.1001.inappetetic.trait:0 "จะมีประโยชน์อันใดในการกินเมื่อมีรูโหว่อยู่ในใจข้า?"
 stress_threshold_special.1001.inappetetic.effect:0 "บัดนี้หัวใจข้าว่างเปล่าดุจดังท้องของข้า"
 stress_threshold_special.1001.journaller:0 "บางทีการเขียนความรู้สึกของข้าลงไปอาจช่วยให้ข้าประมวลผลอารมณ์ของตนเองได้?"
 stress_threshold_special.1001.confider.shared:1 "มันยากลำบาก แต่อย่างน้อย [confidant.GetFirstNameNoTooltip] และข้าก็สามารถผ่านพ้นความโศกเศร้าของเราไปด้วยกันได้"
 stress_threshold_special.1001.confider.assist:1 "มันยากลำบาก แต่ [confidant.GetFirstNameNoTooltip] สามารถช่วยข้าผ่านพ้นสิ่งนี้ไปได้"
 stress_threshold_special.1001.frozen_grief:0 "ข้าต้องเดินหน้าต่อไป นี่คือสิ่งที่ [deceased_character.GetSheHe] คงต้องการ"
 stress_threshold_special.1001.lunatic:0 "แต่ [deceased_character.GetSheHe] ยังมิได้จากไป! [deceased_character.GetSheHe|U] อยู่ตรงนี้กับข้า..."
 stress_threshold_special.1001.lunatic.flavor:0 "...และ [deceased_character.GetSheHe] จะอยู่กับข้า ตลอดไป!"

 stress_threshold_special.2001.t:0 "จิตแตกสลาย: ความปรารถนาที่ถูกกดไว้"
 stress_threshold_special.2001.beginning:0 "โอ้ ข้าคิดถึงวันคืนแห่งความเสเพลและตัณหาที่ข้าเคยมีเหลือเกิน นานเหลือเกินแล้วที่ข้ามิได้นอนกับผู้อื่น... และมันช่างเจ็บปวดที่ต้องนอนเดียวดาย\n\n"
 stress_threshold_special.2001.consort:0 "ข้ารู้ว่า [target.GetFirstName] [ROOT.Char.Custom2('RelationToMe', target)] ของข้า จะต้อนรับข้ากลับสู่เตียงของ[target.GetHerHis]ด้วยอ้อมแขนเปิดกว้าง [target.GetSheHe|U] ต้องการข้า ข้ารู้... และโอ้ ข้าปรารถนา [target.GetHerHim] เพียงใด!"
 stress_threshold_special.2001.noble:0 "ข้าเห็นสายตาที่ [target.Custom2('MyCharacterIntroduction', ROOT.Char)] มองข้า [target.GetSheHe|U] ต้องการข้า ข้ารู้... และโอ้ ข้าปรารถนา [target.GetHerHim] เพียงใด!"
 stress_threshold_special.2001.servant:0 "แม้ [target.GetSheHe] เป็นเพียงคนรับใช้ต่ำต้อย ข้าก็เห็นสายตาที่ [target.GetFirstName] มองข้า [target.GetSheHe|U] ต้องการข้า ข้ารู้... และโอ้ ข้าปรารถนา [target.GetHerHim] เพียงใด!"
 stress_threshold_special.2001.ending:0 "\n\nเมื่อข้าปฏิญาณตน ข้าคิดว่าข้าจะรับมือกับการครองพรหมจรรย์ได้ แต่บัดนี้... ข้าไม่แน่ใจนัก"
 stress_threshold_special.2001.a:0 "ลืมมันไปเสีย ข้าต้านทานต่อไปไม่ไหวแล้ว ข้า #EMP ต้องการ#! สิ่งนี้!"
 stress_threshold_special.2001.a.tt:0 "ท่านสูญเสีย [perk|E] [GetPerk( 'restraint_perk' ).GetName( GetPlayer)|V]"
 stress_threshold_special.2001.b:0 "ไม่... นั่นไม่ใช่ตัวตนของข้าอีกต่อไป ข้าต้องควบคุมแรงกระตุ้นเหล่านี้!"

