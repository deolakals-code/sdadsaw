l_english: 
 stress_threshold_cooldown_message:1 "หากท่านยังคง [stressed|E] ในอีก [SCOPE.ScriptValue('stress_threshold_cooldown_duration_in_years')|V0] ปี ท่านอาจประสบ [mental_break|E] อีกครั้ง"

 # System Messages
 stress_threshold.0010.toast:2 "ท่วมท้นด้วยความเครียด"
 stress_threshold.0010.text:0 "ท่านได้รับ [stress_level|E] เพิ่มขึ้น"
 stress_threshold.0400.toast:2 "ท่านมี [stress|E] เกินขีดจำกัดและถูกปรับกลับไปที่ [stress_level|E] 3"

 # Level 1 Stress Events
 stress_threshold.1001.t:0 "สติแตก: ความคิดมืดมน"
 stress_threshold.1001.desc:0 "ความรู้สึกผิดและความละอายใจได้รบกวนข้าในช่วงหลังนี้ บาปทั้งปวงของข้า, ข้อบกพร่องของข้า, ความล้มเหลวของข้า... ความคิดมืดมนเหล่านี้เบี่ยงเบนความสนใจข้าจากความรับผิดชอบและ ทำให้ข้านอนไม่หลับในยามค่ำคืน\n\nข้ารู้สึกว่าข้าต้องทำอะไรสักอย่างเพื่อยุติความปวดร้าวทางจิตใจนี้, แต่สิ่งใดเล่าจะช่วยได้?"
 stress_threshold.1001.contrite.gain:0 "ข้าต้องสารภาพความผิดทั้งหมดของข้า!"
 stress_threshold.1001.contrite.effect:0 "ข้าไม่อาจซ่อนความลับของข้าได้อีกต่อไป!"
 stress_threshold.1001.flagellant.gain:0 "ความเจ็บปวดจากแส้จะชำระล้างบาปของข้า"
 stress_threshold.1001.flagellant.effect:0 "ข้าสมควรถูกลงโทษ! สำหรับทุกสิ่ง!"
 stress_threshold.1001.improvident.gain:0 "การบริจาคเพื่อการกุศลจะชดเชยบาปของข้า"
 stress_threshold.1001.improvident.effect:0 "ผู้อื่นต้องการทองคำของข้ามากกว่าข้า!"
 stress_threshold.1001.drunkard.gain:0 "บางทีการดื่มสักสองสามจอกอาจช่วยได้?"
 stress_threshold.1001.drunkard.effect:0 "ข้าจะดื่มจนกว่าความคิดเหล่านี้จะหายไป"
 stress_threshold.1001.hashishiyah.gain:0 "ฮาชิชบางส่วนจะ ทำให้จิตใจข้าสงบลง..."
 stress_threshold.1001.hashishiyah.effect:1 "ค่ำคืนอันผ่อนคลายกับถาดขนมเค้กฮาชิชจะช่วยได้"
 stress_threshold.1001.journaller.gain:0 "การเขียนความกังวลของข้าลงไปจะช่วยให้ข้ามีสมาธิ"
 stress_threshold.1001.journaller.effect:0 "ข้าต้องการค่ำคืนตามลำพังในห้องหนังสือของข้า"
 stress_threshold.1001.endure:0 "ข้าต้องเข้มแข็งและต่อต้านแรงกระตุ้นเหล่านี้!"

 stress_threshold.1011.t:0 "สติแตก: ความปรารถนาอันไร้ขอบเขต"
 stress_threshold.1011.desc:0 "ช่วงหลังนี้รู้สึกเหมือนข้าถูกรบกวนอยู่ตลอดเวลาด้วยความคิดลามกและจินตนาการทางเพศ ด้วยความยากลำบากทั้งหมดในชีวิตประจำวันของข้า, มันง่ายเหลือเกินที่จะหลงลืมตนเองไปในฝันกลางวันและลืมความเป็นจริง\n\nความปรารถนาเหล่านี้กำลังรบกวนชีวิตข้าอย่างชัดเจน, แต่ข้าควรทำอย่างไรกับมัน?"
 stress_threshold.1011.rakish.gain:0 "การไปเยือนซ่องโสเภณีจะช่วยบรรเทาได้!"
 stress_threshold.1011.rakish.effect:0 "คืนนี้อย่าให้ผู้ใดเข้าซ่องโสเภณีนอกจากข้า"
 stress_threshold.1011.rakish.tt:0 "พฤติกรรมไร้ขอบเขต เช่นนี้มีความเสี่ยงโดยธรรมชาติ..."
 stress_threshold.1011.reclusive.gain:0 "ข้าต้องปลีกตัวเพื่อหลีกเลี่ยงสิ่งยั่วยวน!"
 stress_threshold.1011.reclusive.effect:0 "ในความสันโดษเท่านั้นที่ข้าจะพบความสงบ!"
 stress_threshold.1011.conversion.interfaith:0 "บางทีมุมมองใหม่ต่อ [new_faith.HighGodName] จะช่วยข้าได้?"
 stress_threshold.1011.conversion.intrafaith:0 "บางที [new_faith.HighGodName] อาจช่วยข้าได้ในสิ่งที่ [ROOT.Char.GetFaith.HighGodName] ล้มเหลว?"
 stress_threshold.1011.conversion.judaism:0 "บัญญัติเก่าแก่จะช่วยให้ข้าบริสุทธิ์"
 stress_threshold.1011.conversion.christianity:0 "พระเยซู, โปรดช่วยข้าให้พ้นจากสิ่งล่อลวงเหล่านี้!"
 stress_threshold.1011.exercise.gain:0 "บางทีการระบายออกในรูปแบบอื่นอาจช่วยได้..."
 stress_threshold.1001.exercise.effect:0 "การออกกำลังกายที่ดีจะเผาผลาญความปรารถนาเหล่านี้ไป"
 stress_threshold.1011.endure:0 "ข้าจะกัดริมฝีปากและพยายามมีสมาธิ!"

 stress_threshold.1501.t:0 "สติแตก: ไม่มีสิ่งใดสำคัญ"
 stress_threshold.1501.intro.desc:0 "ใน แต่ละวันที่ผ่านไป มันยากขึ้นเรื่อยๆ ที่จะหาเหตุผลลากตัวเองออกจากเตียง"
 stress_threshold.1501.helper.desc:0 "[scoped_helper.Custom2('MyCharacterIntroductionNoComma', ROOT.Char)|U] รอข้าอยู่, แต่ข้ารู้ว่าคำพูดของ [scoped_helper.GetHerHis] จะไม่ ทำให้ข้าสบายใจขึ้น"
 stress_threshold.1501.nohelper.desc:0 "หลังจากลากตัวเองออกจากเตียง, ข้าไม่พบความสนใจในกิจธุระอันไร้สาระของ [ROOT.Char.Custom('GetCourt')] เลย, หรือความสุขใดๆ ในการรับประทานอาหารเช้า"
 stress_threshold.1501.faith.desc:0 "\n\nแม้ แต่คำพูดของ [scoped_ruler.GetFaith.AltPriestTermPlural] ก็ฟังดูกลวงเปล่าในหูของข้า"
 stress_threshold.1501.fallback.desc:0 "\n\nจังหวะชีวิตอันซ้ำซากจำเจนี้น่าเหลือทน"
 stress_threshold.1501.a:0 "ข้าทน [scoped_helper.GetHerHim] ต่อไปไม่ไหวแล้ว!"
 stress_threshold.1501.b:0 "ข้าคิดว่าข้าจะงดอาหารกลางวันอีกครั้ง"
 stress_threshold.1501.c:0 "ข้าแค่อยากอยู่คนเดียว"
 stress_threshold.1501.d:0 "จะกินไปทำไมเมื่อทุกอย่างรสชาติเหมือนเถ้าถ่าน?"
 stress_threshold.1501.e:0 "ข้าไม่อาจปล่อยให้ความคิดมืดมนเหล่านี้มารบกวนข้าได้"
 stress_threshold.1501.f:0 "ชีวิตในฐานะ [scoped_ruler.GetFaith.GetAdherentName] ไม่มีจุดหมาย"

 stress_threshold.1502.t:0 "สติแตก: ความขุ่นเคือง"
 stress_threshold.1502.intro.desc:0 "เหตุใดข้าต้อง #EMP ทำทุกอย่าง#! ด้วยตัวเองเสมอ? ข้าจะถูกคาดหวังให้จัดการกิจการของ [scoped_ruler.GetPrimaryTitle.GetNameNoTierNoTooltip] ได้อย่างไร ในเมื่อครึ่งหนึ่งของ [ROOT.Char.Custom('GetCourt')|l] ของข้าไม่สามารถทำตามคำสั่งข้าได้, และอีกครึ่งหนึ่งไม่เข้าใจคำสั่งเหล่านั้นด้วยซ้ำ?"
 stress_threshold.1502.courtier.desc:0 "\n\nโดยเฉพาะอย่างยิ่ง [scoped_courtier.GetFirstName] กลายเป็นคนที่น่าเหลือทนในช่วงหลังนี้ ข้าแทบจะทนฟังคำพูดพล่ามไม่หยุดหย่อนของ [ROOT.Char.Custom2('RelationToMePossessive', SCOPE.sC('scoped_courtier'))] ข้าไม่ได้"
 stress_threshold.1502.nocourtier.desc:0 ""
 stress_threshold.1502.a:0 "เจ้ามันก็แค่ [scoped_courtier.Custom2('InsultNoun', ROOT.Char)] [scoped_courtier.Custom2('InsultAdjective', ROOT.Char)]!"
 stress_threshold.1502.b:0 "ผู้คุม! พาข้านักโทษมาอีกคน!"
 stress_threshold.1502.c:0 ""เหตุใดพวกเจ้าทุกคนถึงเป็น #EMP คนโง่#! ที่ไร้ความสามารถ เช่นนี้!?""
 stress_threshold.1502.d:0 "การไปเยือน [ROOT.Char.Custom('GetDungeon')] จะ ทำให้หัวข้าปลอดโปร่ง..."
 stress_threshold.1502.e:0 "ข้าคงต้องอดทนต่อไป"
 stress_threshold.1502.f:0 "บางทีหากข้าเก็บบันทึกเรื่องโชคร้ายของข้าไว้?"
 stress_threshold.1502.g:0 "[scoped_ruler.GetFaith.HighGodName], ข้าต้องการเครื่องดื่ม!"

 stress_threshold.1503.t:0 "สติแตก: ความว่างเปล่าภายใน"
 stress_threshold.1503.desc:0 "ไม่มีสิ่งใดที่ข้าทำแล้ว ทำให้ข้าพอใจอีกต่อไป แม้จะพยายามเพียงใด, ข้าก็ไม่พบทั้งความสุขหรือความสงบทางใจ ราวกับว่ามีบางสิ่ง... ขาดหายไป\n\nสิ่งใดเล่าจะเติมเต็มหลุมที่กัดกินในจิตวิญญาณของข้าได้?"
 stress_threshold.1503.a.a:0 "อัญมณีอีกสักสองสามชิ้น, บางที?"
 stress_threshold.1503.a.b:0 "ข้าต้องการมงกุฎที่ใหญ่กว่านี้!"
 stress_threshold.1503.a.c:0 "ข้าเบื่อเสื้อผ้าของข้าแล้ว..."
 stress_threshold.1503.a.d:0 "ม้าศึกทรงพลังตัวใหม่!"
 stress_threshold.1503.a.e:0 "ภาพวาดใหม่โดยศิลปินชื่อดัง!"
 stress_threshold.1503.b:0 "มีเพียง [scoped_ruler.Custom('GetExpensiveMeal')] เท่านั้นที่สามารถเยียวยาความเจ็บปวดนี้ได้"
 stress_threshold.1503.e:0 "หากเพียง แต่มีบางสิ่งที่ข้าสามารถทำได้..."

 stress_threshold.1504.t:0 "สติแตก: งานหนักไม่สิ้นสุด"
 stress_threshold.1504.desc:0 "บางครั้ง, ข้ารู้สึกราวกับว่าโลกทั้งใบวางอยู่บนบ่าของข้า ความรับผิดชอบของข้าในฐานะ [scoped_ruler.GetTitleAsNameNoTooltip] ดูเหมือนไม่มีที่สิ้นสุด...\n\nแท้จริงแล้ว, ข้าแทบไม่มีเวลาเหลือให้ตัวเองเลย"
 stress_threshold.1504.a:0 "ผู้คนจะปล่อยข้าไว้ตามลำพังสักพักไม่ได้หรือ?!"
 stress_threshold.1504.b:0 "ข้าต้องการบางสิ่งเพื่อปรับสมดุลธาตุในร่างกายข้า..."
 stress_threshold.1504.e:0 "นี่คือหน้าที่ของข้า, อย่างไรก็ตาม"
 stress_threshold.1504.f:0 "ข้าถูกรายล้อมไปด้วยคนโง่!"
 stress_threshold.1504.g:0 "ข้าจะรวบรวมความคิดของข้าเป็นลายลักษณ์อักษร"
 stress_threshold.1504.h:0 "ใส่อานม้าของข้า, ข้าต้องออกไปขี่ม้า!"
 stress_threshold.1504.i: "ข้าต้องการเวลาเงียบๆ สักครู่เพื่อครุ่นคิด"
 stress_threshold.1601.t:0 "สติแตก: ความคิดหมุนวน"
 stress_threshold.1601.desc:0 "ข้าไม่มีสมาธิ, ความคิดของข้าวนเวียนอยู่ในหัว! ข้าต้องดูแล [ROOT.Char.Custom('GetCourt')|l], ข้าต้องตรวจตรากองทหาร, ข้าต้อง...\n\nข้าจะพักผ่อนได้อย่างไรเมื่อแม้ แต่ความคิดของข้าก็ทรยศข้า เช่นนี้?!"
 stress_threshold.1601.profligate.gain:0 "หากข้าซื้อของแวววาวบางอย่างเพื่อจดจ่อความคิด..."
 stress_threshold.1601.profligate.effect:0 "ข้ารู้สึกมีสมาธิมากขึ้นเสมอหลังจากซื้อของดีๆ!"
 stress_threshold.1601.inappetetic.gain:0 "ความคิดเรื่องอาหารเป็นสิ่งรบกวนสมาธิ"
 stress_threshold.1601.inappetetic.effect:0 "ข้าจะอดอาหารเพื่อขจัดสิ่งรบกวนทั้งหมด!"
 stress_threshold.1601.comfort_eater.gain:0 "ท้องที่อิ่มอาจช่วยให้ข้ามีสมาธิ"
 stress_threshold.1601.comfort_eater.effect:0 "ท้องที่อิ่ม ทำให้ข้ารู้สึกมีสมาธิมากขึ้นเสมอ"
 stress_threshold.1601.rakish.gain:0 "บางทีข้าอาจพบสมาธิในความหลงใหล..."
 stress_threshold.1601.rakish.effect:0 "การไปเยือนซ่องโสเภณีจะช่วยให้ข้าจดจ่อความคิดได้!"
 stress_threshold.1601.reclusive.gain:0 "บางทีข้าอาจจดจ่อความคิดได้หากข้าอยู่คนเดียว..."
 stress_threshold.1601.reclusive.effect:0 "ข้าสามารถจดจ่อความคิดได้เสมอเมื่อข้าอยู่คนเดียว..."
 stress_threshold.1601.irritable.gain:0 "บางทีข้าอาจคิดได้หากทุกคน #EMP เงียบ#! ได้!!"
 stress_threshold.1601.irritable.effect:0 "ข้าจะบอกให้ทุกคน #EMP เงียบ#! เสีย!!"
 stress_threshold.1601.confider.gain:0 ""[friend.GetFirstNameNoTooltip], สหายข้า, ช่วยข้าเรียบเรียงความคิดที!""
 stress_threshold.1601.confider.effect:0 ""[friend.GetFirstNameNoTooltip], โปรดฟังข้าเหมือนที่ท่านทำเสมอ!""
 stress_threshold.1601.athletic.gain:0 "ข้าเคยได้ยินว่าร่างกายที่แข็งแรงนำมา ซึ่งจิตใจที่แข็งแรง..."
 stress_threshold.1601.athletic.effect:0 "ข้าไม่เคยสงบเท่าหลังจากออกกำลังกาย!"
 stress_threshold.1601.contrite.gain:0 "ข้าจะ ทำให้จิตใจปลอดโปร่งโดยการสารภาพความผิดของข้า"
 stress_threshold.1601.contrite.effect:0 "ข้าต้องสารภาพความผิดของข้า! นั่นควรจะนำมา ซึ่งความกระจ่าง"
 stress_threshold.1601.flagellant.gain:0 "ว่ากันว่าความเจ็บปวด ทำให้จิตใจเฉียบคม..."
 stress_threshold.1601.flagellant.effect:0 "ไม่มีอะไรเหมือนความเจ็บปวดที่จะ ทำให้ความคิดข้าจดจ่อ"
 stress_threshold.1601.improvident.gain:0 "บางทีการกระทำเพื่อการกุศลที่ชัดเจนจะปลดปล่อยความคิดข้า?"
 stress_threshold.1601.improvident.effect:0 "การบริจาคเพื่อการกุศลที่ดี ทำให้จิตใจข้าสงบลงเสมอ"
 stress_threshold.1601.drunkard.gain:0 "บางทีข้าจะรู้สึกมีสมาธิมากขึ้นหลังจากดื่ม..."
 stress_threshold.1601.drunkard.effect:0 "ข้ารู้สึกมีสมาธิมากขึ้นเสมอหลังจากดื่ม"
 stress_threshold.1601.hashishiyah.gain:0 "หวังว่าฮาชิชบางส่วนจะ ทำให้จิตใจข้าสงบลง..."
 stress_threshold.1601.hashishiyah.effect:1 "ข้าไม่เคยสงบเท่าหลังจากค่ำคืนกับขนมเค้กฮาชิช"
 stress_threshold.1601.journaller.gain:0 "การเขียนความคิดของข้าลงไปน่าจะนำมา ซึ่งความกระจ่าง..."
 stress_threshold.1601.journaller.effect:0 "การเขียนความคิดของข้าลงไปนำมา ซึ่งความกระจ่างเสมอ!"
 stress_threshold.1601.burdened.gain: "การฝันถึงสถานที่ที่ดีกว่าอาจช่วยได้"
 stress_threshold.1601.burdened.effect: "การฝันถึงสิ่งดีๆ ช่วยได้เสมอ!"

 stress_threshold.1601.endure_no_option:0 "ข้า– ข้าต้อง ต้องอดทน ไม่มีอะไรที่ข้าทำได้..."

 stress_threshold.1602.t:0 "สติแตก: อารมณ์ปั่นป่วน"
 stress_threshold.1602.desc:0 "อารมณ์ของข้าไม่มั่นคงมากขึ้นทุกวันที่ผ่านไป ความสุขท่วมท้นจะเข้ามาแทนที่ความเศร้าโศกอย่างสุดซึ้งจากชั่วขณะหนึ่งไปยังอีกชั่วขณะหนึ่ง, และทั้ง [ROOT.Char.Custom('GetCourt')|l] ของข้าและตัวข้าเองต่างก็เหนื่อยหน่าย\n\nหากเพียง แต่ข้าสามารถหาวิธีควบคุมพายุอารมณ์ภายในนี้ได้!"
 stress_threshold.1602.profligate.gain:0 "บางทีสิ่งใหม่ – สิ่งที่แวววาว – จะ ทำให้ข้าสงบลง"
 stress_threshold.1602.profligate.effect:0 "สิ่งใหม่และแวววาวจะนำมา ซึ่งความสุขที่ชัดเจนให้ข้าเท่านั้น!"
 stress_threshold.1602.inappetetic.gain:0 "หากข้าไม่กิน ข้าจะไม่มีพลังงานที่จะรู้สึก..."
 stress_threshold.1602.inappetetic.effect:0 "ข้าจะอดอาหารเพื่อขจัดอารมณ์ทั้งหมด"
 stress_threshold.1602.comfort_eater.gain:0 "อย่างน้อยอาหารก็นำความรู้สึกสบายใจที่ชัดเจนมาให้ข้า"
 stress_threshold.1602.comfort_eater.effect:0 "เมื่อข้ากิน ข้ารู้สึกเพียงความสบายใจ"
 stress_threshold.1602.rakish.gain:0 "ความปรารถนาอันแรงกล้าอาจควบคุมความรู้สึกอื่น ๆ ไว้ได้..."
 stress_threshold.1602.rakish.effect:0 "ไม่มีอะไร ทำให้ข้าสงบลงได้เหมือนความปรารถนาอันแรงกล้าและตัณหา!"
 stress_threshold.1602.reclusive.gain:0 "บางทีข้าอาจสงบลงได้หากข้าอยู่คนเดียว..."
 stress_threshold.1602.reclusive.effect:0 "ข้าได้รับความกระจ่างเสมอเมื่อข้าอยู่คนเดียว"
 stress_threshold.1602.irritable.gain:0 "มันคงจะง่ายกว่านี้หากผู้คน #EMP ปล่อยข้าไว้ตามลำพัง#!!"
 stress_threshold.1602.irritable.effect:0 "ข้าจะบอกพวกเขาว่าข้าคิดอย่างไรกับ #EMP ความระแวดระวัง#! ของพวกเขา!!"
 stress_threshold.1602.confider.gain:0 "การพูดคุยเรื่องนี้กับ [friend.GetFirstNameNoTooltip] อาจช่วยได้"
 stress_threshold.1602.confider.effect:0 "การพูดคุยกับ [friend.GetFirstNameNoTooltip] มักจะช่วยได้เสมอ!"
 stress_threshold.1602.athletic.gain:0 "ข้าจะวิ่งจนกว่าข้าจะไม่รู้สึกอะไรนอกจากความพึงพอใจ"
 stress_threshold.1602.athletic.effect:0 "การวิ่ง ทำให้ข้าสงบอารมณ์ลงได้เสมอ"
 stress_threshold.1602.contrite.gain:0 "ข้าอาจสงบลงหากข้าสารภาพความผิดของข้า"
 stress_threshold.1602.contrite.effect:0 "ข้ารู้สึกสมดุลมากขึ้นเสมอหลังจากข้าสารภาพ!"
 stress_threshold.1602.flagellant.gain:0 "บางทีข้าอาจขจัดอารมณ์ทั้งหมดออกไปได้ยกเว้นความเจ็บปวด..."
 stress_threshold.1602.flagellant.effect:0 "ข้าจะรู้สึกเพียงความเจ็บปวด, ไม่มีอะไรมากไปกว่านั้น"
 stress_threshold.1602.improvident.gain:0 "ความกตัญญูจากการกุศลอาจมีอำนาจเหนือสิ่งอื่นใด"
 stress_threshold.1602.improvident.effect:0 "ข้ารู้สึกมีศูนย์กลางมากขึ้นเสมอหลังจากข้าบริจาค..."
 stress_threshold.1602.journaller.gain:0 "ข้าจะเขียนจนกว่าข้าจะไม่รู้สึกอะไรนอกจากมีสมาธิ"
 stress_threshold.1602.journaller.effect:0 "การเขียนเกี่ยวกับความรู้สึกของข้าได้ผลเสมอ!"
 stress_threshold.1602.drunkard.gain:0 "ด้วยการดื่มที่เพียงพอ อารมณ์ทั้งหมดจะจางหายไป..."
 stress_threshold.1602.drunkard.effect:0 "ข้าสามารถทิ้งอารมณ์ไว้เบื้องหลังได้เสมอด้วยการดื่ม!"
 stress_threshold.1602.hashishiyah.gain:0 "บางทีฮาชิชบางส่วนจะนำความสงบมาให้"
 stress_threshold.1602.hashishiyah.effect:0 "ฮาชิช ทำให้ข้าสงบลงเสมอ"
 stress_threshold.1602.burdened.gain: "ถ้าเพียงข้าสามารถคิดถึงเรื่องอื่น #EMP เรื่องใดก็ได้#! ที่ไม่ใช่เรื่องนี้"
 stress_threshold.1602.burdened.effect: "หากข้าปล่อยให้ความคิดล่องลอยไป ความวิตกกังวลของข้าจะลดน้อยลง"

 # Level 2 Stress Events
 stress_threshold.2001.t:0 "สติแตก: ความอกตัญญู"
 stress_threshold.2001.desc:0 "พวกคนอกตัญญู! พวกเขาไม่รู้หรือว่าข้าเสียสละเพื่อพวกเขามากเพียงใด?\n\nทุกวันข้าทำงานหนักอย่างไม่สิ้นสุดเพื่อผลประโยชน์ของ [ROOT.Char.Custom('GetRealmOrDomicile')|l] นี้, แต่สิ่งที่ทุกคนทำคือบ่นและขอมากขึ้น!\n\nบัดนี้ [victim.GetFirstName] ถึงกับกล้าตั้งคำถามกับคำสั่งของข้า!?"
 stress_threshold.2001.arbitrary.gain:0 "ข้าคือ [ROOT.Char.GetTitleAsNameNoTooltip], คำพูดของข้าคือกฎหมาย!"
 stress_threshold.2001.arbitrary.effect:0 "ข้าตัดสินใจว่าสิ่งต่างๆ จะดำเนินไปอย่างไรที่นี่!"
 stress_threshold.2001.imprison_victim:0 "มาดูกันว่า [victim.GetFirstNameNoTooltip] จะรู้สึกขอบคุณเพียงใดใน [ROOT.Char.Custom('GetDungeon')]!"
 stress_threshold.2001.endure:0 "มาเถิด, จงอดทนกับพวกเขา..."

 stress_threshold.2101.t:0 "สติแตก: ไม่เป็นที่ต้อนรับ"
 stress_threshold.2101.desc:0 "บางครั้งข้ารู้สึกเหมือนคนแปลกหน้าใน [ROOT.Char.Custom('GetCourt')|l] ของข้าเอง\n\nข้าอดไม่ได้ที่จะสังเกตเห็นสายตาแปลกๆ ที่ [ROOT.Char.Custom('GetCourtierPlural')|l] ของข้ามองมา, ความอึดอัดที่เติมเต็ม [ROOT.Char.Custom('GetRoom')|l] ใดๆ ที่ข้าเดินเข้าไป... เกิดอะไรขึ้นกับชีวิตข้า? เหตุใดข้าจึงไม่เป็นที่ต้อนรับในหมู่พวกพ้องของข้าเอง?"
 stress_threshold.2101.witch.gain:0 "ข้าเป็นคนนอกคอก, เช่นเดียวกับ [ROOT.Char.GetFaith.WitchGodName]"
 stress_threshold.2101.witch.effect:0 "อย่างน้อยข้ารู้ว่า [ROOT.Char.GetFaith.WitchGodName] เข้าใจข้า"
 stress_threshold.2101.drunkard.effect:0 "[ROOT.Char.Custom('RegionalAlcoholicDrink')|U] อาจเป็นเพื่อนแท้เพียงคนเดียวของข้า"
 stress_threshold.2101.hashishiyah.effect:1 "อย่างน้อยเค้กหน้าฮาชิชนี้จะไม่ตัดสินข้า"
 stress_threshold.2101.endure:0 "บางทีนี่อาจเป็นเพียงเรื่องในหัวข้า..."

 stress_threshold.2201.t:0 "สติแตก: ความโกรธเดือดดาล"
 stress_threshold.2201.desc.insult_adventurer: ""เจ้าอาจเป็น [ROOT.Char.Custom('GetCourtier')] ของข้า [character_to_yell_at.GetFirstName] แต่เจ้าก็เป็น [character_to_yell_at.Custom2('InsultNoun', ROOT.Char)] [character_to_yell_at.Custom2('InsultAdjectiveArticle', ROOT.Char)] ด้วย!"\n\n"
 stress_threshold.2201.desc.insult:0 ""เจ้าอาจเป็น [character_to_yell_at.GetTitleAsName] [character_to_yell_at.GetFirstName] แต่เจ้าก็เป็น [character_to_yell_at.Custom2('InsultNoun', ROOT.Char)] [character_to_yell_at.Custom2('InsultAdjectiveArticle', ROOT.Char)] ด้วย!"\n\n"
 stress_threshold.2201.desc:0 "ข้าลังเลทันทีที่เห็นสีหน้าของ [ROOT.Char.Custom2('RelationToMePossessive', SCOPE.sC('character_to_yell_at'))] ข้า, แต่... ข้าแค่รู้สึก #EMP โกรธ#! ตลอดเวลา, และทุกคนก็ยั่วโทสะข้า–\n\n"
 stress_threshold.2201.desc_liege:0 ""เกิดอะไรขึ้นกับเจ้า, [ROOT.Char.GetTitledFirstNameNoTooltip]?! พฤติกรรมนี้รับไม่ได้""
 stress_threshold.2201.desc_vassal:0 ""นายท่าน/นายหญิง, พฤติกรรมนี้หมายความว่าอย่างไร?!"
 stress_threshold.2201.desc.calm:0 "และปกติท่านก็สงบเสงี่ยมมาก...""
 stress_threshold.2201.desc.ending:0 """
 stress_threshold.2201.a:0 "เจ้าได้ยินสิ่งที่ข้าพูด!"
 stress_threshold.2201.save:0 "บอกข้ามา, เจ้าจะตอบสนองต่อการโจมตี เช่นนี้อย่างไร?"
 stress_threshold.2201.save_tt:0 "ข้าแสร้งทำเป็นว่าข้าแค่กำลังทดสอบ [character_to_yell_at.GetHerHim]"
 stress_threshold.2201.liege:0 "ข้าขออภัย, นายท่าน/นายหญิง ข้าจะควบคุมตนเองให้ดีขึ้น"
 stress_threshold.2201.c:0 "ข้าขออภัย ข้าจะควบคุมตนเองให้ดีขึ้น"

 stress_threshold.2202.t:0 "ความโกรธเดือดดาล"
 stress_threshold.2202.desc.liege:0 "ความโกรธที่ไม่สมเหตุสมผล ซึ่งแสดงออกโดยเจ้าเหนือหัวของข้า, [stress_character.GetTitledFirstName], เป็นเรื่องน่าประหลาดใจอย่างยิ่ง"
 stress_threshold.2202.desc.vassal:0 "ความโกรธที่ไม่สมเหตุสมผล ซึ่งแสดงออกโดยข้าหลวงของข้า, [stress_character.GetTitledFirstName], เป็นเรื่องน่าประหลาดใจอย่างยิ่ง"
 stress_threshold.2202.desc.other_relationship:0 "ความโกรธที่ไม่สมเหตุสมผล ซึ่งแสดงออกโดย [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('stress_character'))] ของข้า, [stress_character.GetTitledFirstName], เป็นเรื่องน่าประหลาดใจอย่างยิ่ง"
 stress_threshold.2202.desc:0 "[stress_character.GetSheHe|U] อยู่ภายใต้ความเครียดอย่างมากในช่วงหลังนี้, แต่"
 stress_threshold.2202.desc.rival:0 "เมื่อถูกขอให้อธิบาย [stress_character.GetHerselfHimself] [stress_character.GetSheHe] กลับยิ่งสบประมาทมากขึ้น"
 stress_threshold.2202.desc.other:0 "ที่จะประพฤติตน เช่นนี้..."
  stress_threshold.2202.a:0 "ข้าจะตอบโต้ให้สาสม [stress_character.Custom2('InsultNoun', ROOT.Char)]!"
 stress_threshold.2202.b:0 "แม้ แต่ [stress_character.GetSheHe] ก็ยังดิ้นรน... มัน ทำให้สงบลง"

 # Level 3 Stress Events
 stress_threshold.3001.t:0 "สติแตก: เสียงกระซิบ"
 stress_threshold.3001.desc:0 "ในขณะที่ [ROOT.Char.Custom('GetCourt')|l] ของข้าเกี่ยวข้อง แต่เรื่องโกหกและหลอกลวง, ข้าได้พบผู้ที่อ้างว่าเต็มใจจะบอกความจริงแก่ข้า\n\nพวกเขาอยู่กับข้า ในหัวข้า\n\nพวกเขาบอกว่าพวกเขารู้ความจริง...\n\nพวกเขารู้จริงหรือ?"
 stress_threshold.3001.possessed.gain:0 "ใช่, มีเพียงเสียงเหล่านั้นที่รู้ความจริงแท้!"
 stress_threshold.3001.possessed.effect:0 "ใช่, ใช่, พวกเขารู้ความจริง, ความจริงแท้..."
 stress_threshold.3001.naked_run:0 "ข้าต้องขับไล่ปีศาจเหล่านี้ด้วยการวิ่งเปลือยกาย!"
 stress_threshold.3001.endure:0 "แค่... อย่าไปฟังพวกมัน..."

 stress_threshold.3101.t:0 "สติแตก: ความผิดปกติ"
 stress_threshold.3101.desc:0 "ทุกอย่าง... ผิดปกติ [ROOT.Char.Custom('GetRoom')|l] นี้ผิดปกติ พื้นดินผิดปกติ แม้ แต่อากาศก็ผิดปกติ!\n\nเหตุใดทุกอย่างจึงผิดปกติ? ผู้ใดทำ เช่นนี้?\n\nผู้ใด ทำให้ทุกอย่าง #EMP ผิดปกติ?!#!"
 stress_threshold.3101.kill_victim:0 "ทั้งหมดเป็นความผิดของ [victim.GetFirstNamePossessiveNoTooltip], ข้ารู้!"
 stress_threshold.3101.lunatic.gain:0 "[ROOT.Char.Custom('GetRandomRegionalSmallGamePlural')]... พวกสารเลวตัวน้อยเจ้าเล่ห์เหล่านั้นทำมัน!"
 stress_threshold.3101.lunatic.effect:0 "[ROOT.Char.Custom('GetRandomRegionalSmallGamePlural')] เจ้าเล่ห์กลับมาแล้ว!"
 stress_threshold.3101.lunatic.tt:0 "#F เอาคบเพลิงมาให้ข้า!#!"

 stress_threshold.3201.t:0 "สติแตก: เกินรับไหว"
 stress_threshold.3201.desc:0 "มันมากเกินไป, เหตุใดข้าจึงพยายามอยู่?\n\nเราอยู่ท่ามกลางอาหารค่ำเมื่อทุกอย่าง... พังทลายลง ข้าต้องตรวจสอบการเงินของ [ROOT.Char.Custom('GetCourt')|l], ข้าต้องตัดสินข้อพิพาทเล็กน้อยนับสิบ, ข้าต้อง–\n\n"ท่านสบายดีหรือไม่, [ROOT.Char.GetTitleAsNameNoTooltip] ของข้า?" [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('vassal'))] ของข้า, [vassal.GetTitledFirstName], เอ่ยถามความกังวลของ [vassal.GetHerHis] อย่างระมัดระวัง"
 stress_threshold.3201.depressed.gain:0 "มันจะสำคัญอะไร? ข้ายอมแพ้"
 stress_threshold.3201.depressed.effect:0 "อย่างไรเสียมันก็ไร้จุดหมาย..."
 stress_threshold.3201.help:0 ""[vassal.GetFirstNameNoTooltip]... โปรดช่วยข้าด้วย""
 stress_threshold.3201.wrathful.gain:0 ""ไม่ เจ้า [vassal.Custom2('InsultNoun', ROOT.Char)] [vassal.Custom2('InsultAdjective', ROOT.Char)] ข้า #EMP ไม่ได้#! สบายดี!""
 stress_threshold.3201.wrathful.effect:0 ""ข้าจะแสดงให้เจ้าเห็นเองว่าใคร #EMP สบายดี#! เจ้า [vassal.Custom2('InsultNoun', ROOT.Char)] [vassal.Custom2('InsultAdjective', ROOT.Char)]!""
 stress_threshold.3201.wrathful.effect.success:0 "ท่านทุบตี [vassal.GetTitledFirstName]"
 stress_threshold.3201.wrathful.effect.failure:0 "[vassal.GetTitledFirstName] ต่อสู้ป้องกันตัวจากท่าน"

 stress_threshold.3301.t:0 "สติแตก: หัวใจปวดร้าว"
 stress_threshold.3301.desc_man:0 "สัญญาณแรกว่ามีบางอย่างผิดปกติคืออาการเจ็บแปลบที่หน้าอก ข้าเซหาที่พยุงขณะที่ความเจ็บปวดแล่นลงไปที่แขนซ้าย ข้ารู้สึกหน้ามืดเหลือเกิน...\n\nข้า... ข้าไม่มีเวลาสำหรับเรื่องนี้! ข้ามีสิ่งที่ต้องทำ!\n\nขณะที่ข้าพยายามก้าวเดิน, ข้าก็ทรุดลงกับพื้น ข้าอ้าปากเพื่อร้องขอความช่วยเหลือ, แต่เสียงเดียวที่เล็ดลอดออกมาคือเสียงครวญครางที่ติดขัดในลำคอ\n\nความเจ็บปวดในอกทวีความรุนแรงขึ้น, และรุนแรงขึ้น, และ— ความมืดเข้าครอบงำการมองเห็นของข้า, และข้า #EMP รู้สึก#! ได้ว่าหัวใจข้าเต้นสะดุด"
 stress_threshold.3301.desc_woman:0 "สัญญาณแรกว่ามีบางอย่างผิดปกติคืออาการแสบร้อนกลางอกที่ไม่ยอมหายไป ข้าลองใช้ยาทุกชนิด – ขนแกะนุ่มๆ วางบนท้อง, การเดินเล่นสบายๆ...\n\nทันใดนั้นข้าดูเหมือนจะหายใจลึกๆ ไม่ได้และข้าเซหาที่พยุง อะไร— เกิดอะไรขึ้น?! ข้าพยายามร้องขอความช่วยเหลือ, แต่ทั้งหมดที่ข้าทำได้คือการหอบหายใจอย่างเจ็บปวด\n\nมัน #EMP เจ็บ#!! ความเจ็บปวดเฉียบพลันแผ่กระจายจากระหว่างสะบักลงไปที่แขนซ้าย, และขณะที่ความเจ็บปวดทวีความรุนแรงขึ้น ข้าก็ทรุดลงกับพื้น\n\nความมืดตามมาอย่างรวดเร็ว"
 stress_threshold.3301.a:0 "#EMP #DIE1 อึก...!#!#!"
