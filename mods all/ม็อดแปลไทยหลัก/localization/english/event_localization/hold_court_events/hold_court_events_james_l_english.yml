l_english: 
 hold_court.7000.t: "ส่วนแบ่งที่ยุติธรรม"
 hold_court.7000.desc: "[local_leader.Custom2('MyCharacterIntroduction', ROOT.Char)|U] เดินเข้ามาในราชสำนัก สายตา [local_leader.GetHerHis] ชื่นชมความมั่งคั่งที่สามารถหาได้ในเมืองหลวงอย่างบ้าคลั่ง\n\n"ไม่ใช่ความลับที่ [ROOT.Char.GetCapitalLocation.GetTitle.GetNameNoTierNoTooltip|U] เป็นที่อิจฉาของโลก [ROOT.Char.Custom('FormOfAddressForLiege')] แต่ไม่ใช่ทุกส่วนในอาณาจักรของท่านจะโชคดี เช่นนี้ ตัวอย่าง เช่น ใน [low_dev_county.GetNameNoTier] ทุ่งนาแห้งแล้งปราศจากผู้คนดูแล มันจะไม่ยิ่งใหญ่หรอกหรือหากทั้งอาณาจักรนั้นงดงามดั่ง เช่น [ROOT.Char.GetCapitalLocation.GetTitle.GetNameNoTierNoTooltip|U]?""
 hold_court.7000.a: ""คงจะเป็น เช่นนั้น""
 hold_court.7000.b: ""ไพร่ฟ้าของท่านเคยลองอาศัยอยู่ใน [ROOT.Char.GetCapitalLocation.GetTitle.GetNameNoTierNoTooltip|U] หรือไม่?""
 hold_court.7000.c: ""เรื่องนี้ควรจะ ทำให้ข้าสนใจหรือ? ไม่เลย""
 hold_court.7010.t: "สองศรัทธา หนึ่งครอบครัว"
 hold_court.7010.desc: "[friendly_neighbour.Custom2('MyCharacterIntroduction', ROOT.Char)|U] ก้าวเข้ามาในราชสำนักของข้าพเจ้าด้วยความมั่นใจเกินตัว [friendly_neighbour.GetHerHim] ราวกับว่า [friendly_neighbour.GetSheHe] ไม่ใช่ผู้บุกรุกในราชสำนัก [ROOT.Char.GetFaith.GetAdjectiveNoTooltip] อันเมตตาของข้าพเจ้า\n\n"ท่าน [ROOT.Char.GetTitleAsNameNoTooltip|U] [ROOT.Char.GetFirstName] ผู้ประเสริฐ เป็นที่ทราบกันดีว่าท่านเป็น [ROOT.Char.GetWomanMan] ที่มีศัตรูมากมายที่ชายแดน แต่หากข้าพเจ้าโชคดีพอ ข้าพเจ้าไม่ปรารถนาที่จะเป็นหนึ่งในนั้น หลายคนอยากเห็นชาว [ROOT.Char.GetFaith.GetAdherentNamePlural] ทั้งหมดถูกลบไปจากภูมิภาค แต่ข้าพเจ้าเสนอให้ท่านและข้าพเจ้านำสันติภาพมา เรื่องนี้ง่ายมาก ท่านมี [potential_prince.Custom('GetDaughterSon')] ข้าพเจ้ามี [foreign_princess.Custom('GetDaughterSon')] ให้ทั้งสอง แต่งงานกันและยุติการทะเลาะวิวาทเสีย""
 hold_court.7010.a.jewish: ""มาเซล ทอฟ!""
 hold_court.7010.a: ""เช่นนั้นก็ให้มีงานวิวาห์เถิด!""
 hold_court.7010.b: ""ดาบของข้ากระหายเลือดชาว [friendly_neighbour.GetFaith.GetAdherentNameNoTooltip]!""
 hold_court.7010.c: ""งานวิวาห์ เช่นนั้นจะเป็นการนอกรีต""
 every_county_10_dev_below_capital: "ทุก [county|E] ที่มีระดับ [development|E] ต่ำกว่า [capital|E] ของท่านอย่างน้อย 10 ระดับ"
 hc_7000_dev_boost: "การพัฒนาที่เจริญรุ่งเรือง"
 hc_7000_dev_boost_desc: "ทรัพยากรเพิ่งถูกจัดสรรเพื่อช่วยในการเติบโตของเคาน์ตีนี้"
 hc_7000_dev_reduction: "การพัฒนาที่ถูกขัดขวาง"
 hc_7000_dev_reduction_desc: "ทรัพยากรของเคาน์ตีนี้กำลังถูกเบี่ยงเบนไปยังส่วนที่ห่างไกลของอาณาจักร ทำลายคุณภาพชีวิตที่นี่"
 hc_7010_holy_war: "การเตรียมทำสงครามศักดิ์สิทธิ์"
 hc_7010_holy_war_desc: "ตัวละครนี้เพิ่งประกาศิตว่าผู้ไม่เชื่อทุกคนจะต้องถูกกำจัดในและรอบๆ ดินแดนของพวกเขา"
 hc_7010_tolerance: "การสมรสที่ยอมรับความต่าง"
 hc_7010_tolerance_desc: "ตัวละครนี้เพิ่งให้ญาติคนหนึ่ง แต่งงานกับสมาชิกของศาสนาอื่น เผยแพร่ความรู้สึกยอมรับความต่างไปทั่วดินแดนของพวกเขา"
 hold_court.7020.t: "โล่แห่ง [ROOT.Char.GetFaith.GetNameNoTooltip]"
 hold_court.7020.desc.intro: "[same_faith_friend.Custom2('MyCharacterIntroduction', ROOT.Char)|U] เข้ามาในราชสำนักของข้าพเจ้าวันนี้พร้อมขบวนแห่อันเคร่งขรึมของ [ROOT.Char.GetFaith.PriestNeuterPlural] ตามมา สวดมนต์ [ROOT.Char.GetFaith.GetAdjective] แบบดั้งเดิมตลอดทาง\n\n"ท่าน [ROOT.Char.GetTitleAsNameNoTooltip|U] ผู้ประเสริฐ ท่านและข้าพเจ้าต่างรู้ดีว่าวิถีเก่ากำลังตกอยู่ในอันตราย""
 hold_court.7020.desc.mid.oppression: "ผู้ติดตามนับไม่ถ้วนของ [ROOT.Char.GetFaith.HighGodName|U] ถูกกดขี่ภายใต้ [threatening_ruler.GetName] และความเสี่ยงของการบังคับเปลี่ยนศาสนาก็เพิ่มมากขึ้นทุกวัน"
 hold_court.7020.desc.mid.recent_war: "ดินแดนของท่านถูกละเมิดโดยน้ำมือชาว [threatening_ruler.GetPrimaryTitle.GetAdjectiveNoTooltip|U] และวิหารของ [ROOT.Char.GetFaith.HighGodNamePossessive|U] ถูกเผา"
 hold_court.7020.desc.mid.holy_site: "ดินแดนศักดิ์สิทธิ์ของเรายังคงอยู่ไกลเกินเอื้อม และข้าพเจ้าเกรงว่าผู้ศรัทธาอาจไม่มีวันได้ไปเยือนสถานที่ที่ [ROOT.Char.GetFaith.HighGodNamePossessive|U] เลือกสรรบนโลกนี้"
 hold_court.7020.desc.outro: "เป็นที่ชัดเจนสำหรับข้าพเจ้าว่าเราต้องจัดระเบียบศรัทธา เพื่อให้วิถีเก่ายังคงอยู่รอดจากการโจมตีของศาสนา [threatening_ruler.GetFaith.GetReligion.GetName]""
 hold_court.7020.a: ""เพื่อที่จะยืนหยัดต่อไป เราต้องเปลี่ยนแปลง""
 hold_court.7020.b: ""จงเข้มแข็งเข้าไว้ เราต้องไม่สละวิถีของเรา""
 hold_court.7020.c: ""ร่วมกันเราอาจรักษาวิถีเก่าไว้ได้ตลอดไป""
 rival_planning_holy_war: "[CHARACTER.GetShortUIName|U] ปฏิเสธคำร้องขอสันติภาพทางศาสนาของ [TARGET_CHARACTER.GetShortUINamePossessive]"
 rival_planning_holy_war_corresponding: "[TARGET_CHARACTER.GetShortUIName|U] ปฏิเสธคำร้องขอสันติภาพทางศาสนาของ [CHARACTER.GetShortUINamePossessive]"
 friend_beyond_faith: "[CHARACTER.GetShortUIName|U] และ [TARGET_CHARACTER.GetShortUIName] ละทิ้งความแตกต่างทางศาสนาทั้งหมดเพื่อเห็นแก่ครอบครัวและพันธมิตร"
 friend_united_by_faith: "[CHARACTER.GetShortUIName|U] และ [TARGET_CHARACTER.GetShortUIName] รวมเป็นหนึ่งเดียวกันในศรัทธา"
 ignore_3_site_rule_tt: "ท่านอาจปฏิรูป [faith|E] ของท่านได้โดยไม่ต้องมีข้อกำหนดตามปกติในการครอบครอง [holy_sites|E]"
 friend_will_convert_tt: "[same_faith_friend.GetFirstName|U] จะเปลี่ยนมานับถือศาสนาที่ปฏิรูปแล้วพร้อมกับท่าน"
 truce_religious_tolerance: "การยอมรับความต่างทางศาสนา"
 hc_7020_guardian_of_the_old_ways: "ผู้พิทักษ์วิถีเก่า"
 hc_7020_guardian_of_the_old_ways_desc: "ตัวละครนี้ได้อุทิศตนเพื่อปกป้องและรักษาสิ่งศรัทธาของตน"
