l_english: 

 #### Your Heir is a Jerk, by Isabella Welch
 hold_court.4001.t:0 "ตัวแสบ"
 hold_court.4001.desc.intro:0 "[annoyed_vassal.GetTitledFirstName] บุกเข้ามาหน้าพระที่นั่ง "[ROOT.Char.Custom2('RelationToMeAddress', annoyed_vassal)|U] หลายคนคิดว่า [preferred_heir.GetTitledFirstName] ควรเป็นผู้สืบทอดของท่านแทนที่ [annoying_heir.GetTitledFirstName] เป็นที่ทราบกันทั่ว [ROOT.Char.GetPrimaryTitle.GetNameNoTooltip] ว่าทายาทของท่าน [annoying_heir.GetTitledFirstNameNoTooltip] สร้างความขุ่นเคืองจนเป็นที่เลื่องลือ!"
 hold_court.4001.heir_street_fight:0 "ไอ้คนชั่วช้านั่นเตร็ดเตร่อยู่นอกโรงเตี๊ยมและยั่วยุชาวบ้านขี้เมาให้ต่อสู้ หลายคนตายในการทะเลาะวิวาทเหล่านี้ ซึ่ง [annoying_heir.GetSheHe] ฆ่าเพื่อความสนุกสนาน!"
 hold_court.4001.heir_robbery:0 "ระหว่างการเดินทางมาที่นี่ ข้าถูกโจรขี่ม้า [annoying_heir.GetWomanMan] ในเครื่องประดับหรูหรา แต่ไร้รสนิยมปล้น [annoying_heir.GetSheHe|U] เปลื้องผ้าข้าแล้วมัดไว้กับต้นไม้ ก่อนจะถอดหน้ากากของ [annoying_heir.GetHerHis] ออกแล้วโอ้อวดว่า [annoying_heir.GetSheHe] คือ [annoying_heir.GetTitledFirstNameNoTooltip]!"
 hold_court.4001.heir_tavern:0 "[annoying_heir.GetSheHe|U] แทบจะอาศัยอยู่ในโรงเตี๊ยม และเมื่อ [annoying_heir.GetSheHe] ผลาญเงินค่าขนมของ [annoying_heir.GetHerHis] จนหมด คนอื่น ๆ ก็ซื้อเครื่องดื่มให้ [annoying_heir.GetHerHim] เพื่อแลกกับการล้อเลียนท่านอย่างหยาบคาย!"
 hold_court.4001.heir_diplomacy_failure:0 "[annoying_heir.GetSheHe|U] ปฏิเสธที่จะเข้าร่วมการประชุมแม้ แต่ครั้งเดียว และเมื่อข้าถาม [annoying_heir.GetHerHim] ว่าทำไม [annoying_heir.GetSheHe] บอกข้าว่า 'มันน่าเบื่อเกินไป เราคงจะสนุกกว่านี้มากหากฆ่ากันเอง'"
 hold_court.4001.heir_hated:0 "[annoying_heir.GetSheHe|U] เป็นคนขี้โอ้อวดที่ไม่น่ารัก และโอ้อวดกับข้าว่า [annoying_heir.GetSheHe] ไม่สนใจว่าพวกเราคนใดจะชอบ [annoying_heir.GetHerHim] หรือไม่"
 hold_court.4001.protective_parent:0 "\n\n[protective_parent.GetTitledFirstNameNoTooltip] ทำเสียงจุ๊จ๊ะอย่างตกตะลึง "[annoying_heir.Custom('PetName')] ของข้าไม่มีวันทำเรื่อง เช่นนั้นเด็ดขาด!"
 hold_court.4001.accusation_default:0 "\n\n[annoyed_vassal.GetSheHe|U] ถอนหายใจ "แต่ข้ามั่นใจว่า [annoying_heir.GetSheHe] จะปฏิเสธว่าได้ทำเรื่องนี้""
 hold_court.4001.heir_admission:0 "\n\nรอยยิ้มเจ้าเล่ห์ปรากฏขึ้นบนใบหน้าของ [annoying_heir.GetTitledFirstNamePossessiveNoTooltip] "โอ้ ข้าทำจริง ๆ นั่นแหละ""
 hold_court.4001.a:0 "น่ารักจริง ๆ [annoying_heir.GetSheHe] ได้เชื้อ [ROOT.Char.GetMotherFather] ของ [annoying_heir.GetHerHis] มาเต็ม ๆ!"
 hold_court.4001.b:0 "นี่มันฟางเส้นสุดท้ายแล้ว! ต้องเป็น [preferred_heir.GetTitledFirstNameNoTooltip]"
 hold_court.4001.c:0 "จากประสบการณ์ของข้า [preferred_heir.GetTitledFirstNameNoTooltip] ก็น่ารังเกียจไม่แพ้กัน!"
 hold_court.4001.d:0 "การไม่สมบูรณ์แบบหมายความว่าเหล่าทหารมอง [annoying_heir.GetHerHim] เป็นพวกเดียวกับพวกเขา!"

 disabled_fallback:0 "ปิดใช้งาน"

 ## Inspired Poet appears at court and makes demands by Isabella Welch

 hold_court.4500.t:0 "บทกวีไม่รู้จบ"
 hold_court.4500.desc: "ร่างอันงดงามพร้อมประกายแห่งการหยั่งรู้เกี่ยวกับ [demanding_poet.GetHerHim] เข้ามาใกล้ "ข้าคือกวีผู้ยิ่งใหญ่และข้าเดินทางมาไกลเพียงเพื่อรับใช้ท่าน ข้าได้ประพันธ์บทเพลงที่ยิ่งใหญ่ที่สุดแห่งจักรวาล เกี่ยวกับความรุ่งโรจน์ของท่านและความงดงามของราชสำนัก [ROOT.Char.GetPrimaryTitle.GetAdjectiveNoTooltip]""
 hold_court.4500.a:1 "ข้าไม่ต้องการกวี"
 hold_court.4500.b:1 "บทกวีของท่านช่างมีเสน่ห์ มาเขียนให้ราชสำนักของข้าเถิด"

### Peasants are convinced you're a literal monster by Isabella Welch 
 hold_court.4600.t:0 "[ROOT.GetCharacter.GetSheHe|U] ผู้ ทำให้ [ROOT.GetCharacter.GetHerselfHimself|U] กลายเป็นอสูร..."
 hold_court.4600.desc:1 "ฝูงชาวบ้านซอมซ่อปรากฏตัวต่อหน้าบัลลังก์ของข้า พวกเขาติดอาวุธด้วยเครื่องมือทำฟาร์มลุกเป็นไฟที่ร้ายกาจที่สุดที่ข้าเคยเห็นมาตลอดอาชีพการปราบปรามกบฏ\n\n"สิ่งมีชีวิตที่ปกครองเรานี้คือปีศาจที่แท้จริงจุติมาเกิด ไม่มี [ROOT.GetCharacter.GetWomanMan] ที่แท้จริงคนใดจะสามารถกระทำการรุนแรงสุดขั้วและหยาบคาย เช่นนี้ได้ เราเรียกร้องให้ยุติการปกครองแบบเผด็จการอันโหดร้ายของท่าน!""
 hold_court.4600.a:0 "ข้าไม่ใช่ปีศาจ ข้าคือ [ROOT.Char.GetTitleAsNameNoTooltip] ซึ่งเลวร้ายกว่า #EMP มาก#!."
 hold_court.4600.b:0 "เป็นความคิดที่น่ารัก! [chancellor.GetCouncilTitle]! จงป่าวประกาศไปว่าข้าคือปีศาจ"
 hold_court.4600.c:0 "ข้าช่างน่ารังเกียจถึงเพียงนั้นเชียวหรือ?"
 hold_court.4600.c.tt:1 "ยังไม่สายเกินไปที่จะเปลี่ยนแปลง"
 hold_court.4600.d:1 "เอาฝูงชนชั้นต่ำนี้ออกไปให้พ้นสายตาข้า"
### Vassal invites you to a suspicious dinner by Isabella Welch
 hold_court.4601.t:0 "[ROOT.GetCharacter.GetLadyLord|U] ผู้น่าลิ้มลองของข้า,"
 hold_court.4601.d:0 "หัวใจของข้าแทบไม่หยุดสั่นระรัวนับตั้งแต่ข้าได้ยินชาวเมืองเล่าขานว่าท่านมีวิญญาณของปีศาจที่แท้จริง ข้าเสียใจเสมอที่ไม่ได้ทำความรู้จักกับตัวตนอันน่าเกรงขามของท่านให้ดีกว่านี้\n\nมาเยี่ยมปราสาทของข้า แล้วเราจะร่วมรับประทานอาหารอันโอชะที่ดิบที่สุดเท่าที่รู้จักใน [ROOT.Char.GetPrimaryTitle.GetNameNoTooltip]!"
 hold_court.4601.a:0 "ฟังดูเลิศรส!"
 hold_court.4601.b:0 "เรามีงานเลี้ยงที่ดีกว่านี้ที่บ้าน..."

### Sophisticated Cannibal dinner by Isabella Welch
 hold_court.4602.t:0 "[ROOT.GetCharacter.GetLadyLord|U] ผู้น่าลิ้มลองของข้า"
 hold_court.4602.desc:0 "[cannibal_vassal.Custom('FortifiedBuilding')] ของ [cannibal_vassal.GetTitledFirstNamePossessiveNoTooltip] สว่างไสวด้วยแสงเทียนริบหรี่เพียงไม่กี่เล่ม [cannibal_vassal.GetSheHe|U] เชิญข้านั่งลงหน้าโต๊ะจัดเลี้ยง ซึ่งไม่มีอาหารอื่นใดนอกจากเนื้อสัตว์ที่ปรุงสุกเพียงเล็กน้อยหลากหลายชนิด\n\n[cannibal_vassal.GetSheHe|U] ยืนซุ่มอยู่หลังเก้าอี้ของข้า รอให้ข้าเลือกอาหาร ครู่ต่อมา [cannibal_vassal.GetSheHe] โน้มตัวเข้ามาใกล้ศีรษะข้า แยกเขี้ยวของ [cannibal_vassal.GetHerHis]\n\n"มี [ROOT.GetCharacter.GetWomenMen] ชั้นดีมากมายที่ปรุงอยู่ต่อหน้าเราในคืนนี้ แต่ไม่มีผู้ใดอร่อยเท่าท่าน!""
 hold_court.4602.a:0 "ข้าควรกินใครเป็นอาหารเรียกน้ำย่อยดี?"
 hold_court.4602.b:0 "ก็ได้ ท่านอาจจะกัดได้คำเดียว"
 hold_court.4602.c:0 "ข้าจะไปแล้ว! นี่มันช่างไร้รสนิยมสิ้นดี!"

## Shady genealogist offers to prove you are descended from mythical heroes by Isabella Welch

 hold_court.4900.t:0 "ในสมัยโบราณ..."
 hold_court.4900.desc:1 "ร่างชราภาพผู้หนึ่งเดินเข้ามาใกล้บัลลังก์ของข้า พร้อมเสียงไม้เท้าของ[suspicious_genealogist.GetHerHis]ที่กระทบพื้นดังกริ๊กและก๊อกในทุกย่างก้าว\n\n"[ROOT.Char.Custom('FormOfAddressForLiege')|U] ข้าคือนักลำดับวงศ์ตระกูล และท่านย่อมตระหนักดีว่าท่านสืบเชื้อสายมาจากชนชั้นสูง ทว่าความสูงส่งนั้นไม่เหมือนกับความศักดิ์สิทธิ์หรือตำนานปรัมปราเสียทีเดียว ข้าปรารถนาจะเขียนม้วนคัมภีร์ที่จะสืบสาวสายเลือดของท่านย้อนกลับไปจนถึงรุ่งอรุณแห่งประวัติศาสตร์ ด้วยทองคำเพียงไม่กี่เหรียญ ข้าสามารถเปิดเผยความจริงแก่ท่านและโลกหล้า: ท่านคือผู้สืบเชื้อสายที่แท้จริงของ [ROOT.GetCharacter.Custom('GetMythicalFounder')]!""
 hold_court.4900.a:1 ""ข้าไม่ต้องการเศษกระดาษมาบอกข้าเรื่องนั้น!""
 hold_court.4900.b:1 ""ยอดเยี่ยม! ทำให้แน่ใจว่ารายชื่อนั้นยาวเหยียดเกินควร!""
 hold_court.4900.c:1 ""[ROOT.GetCharacter.Custom('GetMythicalFounder')]? เทียบข้าไม่ได้เลย!""
 hold_court.4900.d:1 ""ราชวงศ์ของข้าอาจจะยังเล็ก แต่เราไม่ใช่คนโง่!""
 hold_court.4900.e: ""เป็นข้ออ้างที่สมบูรณ์แบบเพื่อตอกย้ำสถานะตำนานของข้า!""

 hold_court.4901.desc.intro:0 "สองสามวันต่อมา นักลำดับวงศ์ตระกูล [suspicious_genealogist.GetTitledFirstName] ก็กลับมา [suspicious_genealogist.GetSheHe|U] คลี่ม้วนคัมภีร์ที่ยาวพอจะพันรอบหนึ่งในจังหวัดของข้าได้ [chaplain.GetCouncilTitle] ของข้าสะดุดเล็กน้อยเมื่อปลายม้วนที่คลี่ออกมากองอยู่ที่แท่นบัลลังก์ของข้า\n\n"ข้ามีความจริงเกี่ยวกับต้นกำเนิดของท่านอยู่ที่นี่ [ROOT.Char.Custom('FormOfAddressForLiege')]" [suspicious_genealogist.GetSheHe] กระแอมไอ [suspicious_genealogist.GetHerHis] และเริ่มอ่าน "วันนี้เราจะเปิดเผยประวัติศาสตร์อันยิ่งใหญ่ ผู้ที่ยืนอยู่ต่อหน้าเราคือ [ROOT.GetCharacter.GetTitledFirstNameNoTooltip]""
 hold_court.4901.mothers:0 "ธิดาของ [mother_1.GetFullNameNicknamedNoTooltip], ผู้สืบเชื้อสายจาก [mother_2.GetFullNameNicknamedNoTooltip] ผู้น่าเกรงขาม, ผลผลิตจากครรภ์ของ [mother_3.GetFullNameNicknamedNoTooltip], ถือกำเนิดจากมดลูกของ [mother_4.GetFullNameNicknamedNoTooltip], บุตรของ [mother_5.GetFullNameNicknamedNoTooltip] ผู้งดงาม..."
 hold_court.4901.fathers:0 "บุตรของ [father_1.GetFullNameNicknamedNoTooltip], ผู้สืบเชื้อสายจาก [father_2.GetFullNameNicknamedNoTooltip] ผู้น่าเกรงขาม, ผลผลิตจากครรภ์ของ [father_3.GetFullNameNicknamedNoTooltip], บุตรของ [father_4.GetFullNameNicknamedNoTooltip] ผู้โดดเด่น, บุตรของ [father_5.GetFullNameNicknamedNoTooltip]..."
 hold_court.4901.desc.outro:0 "\n\nเปลือกตาของคนในราชสำนักสองสามคนเริ่มปรือลง"
 hold_court.4901.a:0 "ถึงเวลางีบหลับแล้ว ข้าจะฝันถึงความรุ่งโรจน์ของตัวเอง"
 hold_court.4901.a.tt:0 "ท่านปล่อยให้คนที่เหลือในราชสำนักตั้งใจฟังต่อไป"
 hold_court.4901.b:0 "สิ่งนี้น่าตื่นเต้นยิ่งกว่าบทเพลงใด ๆ! ข้านั่งไม่ติดบัลลังก์แล้ว!"
 hold_court.4901.c:0 ""พอแล้ว! [ROOT.Char.GetPrimaryTitle.GetBaseNameNoTooltip] เป็นหนี้บุญคุณท่านสำหรับบริการของท่าน""
