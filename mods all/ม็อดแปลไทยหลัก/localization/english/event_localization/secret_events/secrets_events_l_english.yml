 secret_exposed_notification_effect_message_lover_sodomy:0 "ความสัมพันธ์อันผิดธรรมชาติของ[owner.GetTitledFirstNamePossessive] กับ[target.GetTitledFirstName] ถูกเปิดโปงโดย[secret_exposer.GetTitledFirstName]!"
