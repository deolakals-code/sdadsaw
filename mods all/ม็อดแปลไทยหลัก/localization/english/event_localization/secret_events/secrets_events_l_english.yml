 secrets_secondary_character_my_character_introduction:0 "[secondary_character.Custom2('MyCharacterIntroductionNoComma', event_root)]"
 secrets_secondary_character_primary_characters_introduction:0 "[secondary_character.Custom2('HerHisCharacterIntroductionNoComma', primary_character)]"
	
 secrets.0001.t:0 "ความลับของข้าถูกเปิดโปง!"
 secrets.0001.desc:0 "[secret_exposer.Custom2('MyCharacterIntroduction', ROOT.Char)|U] ได้เผยความลับของข้าให้โลกรับรู้!\n\nตัณหาอันผิดธรรมชาติและความปรารถนาที่มิอาจควบคุมได้ของข้า บัดนี้เป็นที่ประจักษ์แก่คนทั้งปวง และถูกยอมรับว่าเป็นความจริง!"
 secrets.0001.a:0 "ข้าจะมีชีวิตอยู่กับความอัปยศนี้ได้อย่างไร?"

 secrets.0101.negative.desc:0 "[secret_exposer.Custom2('MyCharacterIntroduction', ROOT.Char)|U] ได้กล่าวหา [owner.Custom2('MyCharacterIntroduction', ROOT.Char)] ว่ามีพฤติกรรมเบี่ยงเบนทางเพศ! รายละเอียดคำบอกเล่าของเขานั้นช่างน่าขยะแขยงยิ่งนัก!"
 secrets.0101.positive_1.desc:0 "[secret_exposer.Custom2('MyCharacterIntroduction', ROOT.Char)|U] ได้กล่าวหา [owner.Custom2('MyCharacterIntroduction', ROOT.Char)] ต่อสาธารณะว่าเป็นผู้มีพฤติกรรมเบี่ยงเบนทางเพศ!"
 secrets.0101.worried.desc:0 "\n\nข้าต้องข่มตัณหาของตนไว้ มิให้มันครอบงำข้าได้ ใครจะรู้ว่าพวกเขาจะชี้หน้ากล่าวหาผู้ใดเป็นรายต่อไป..."
 secrets.0101.positive_2.desc:0 "ข้าไม่เห็นว่าเรื่องนี้จะเอิกเกริกอันใดนัก มันมิใช่ว่าตัณหาเป็นสิ่งผิดธรรมชาติเสียเมื่อไร..."
 secrets.0101.b:0 "[owner.GetFirstNameNoTooltip] ต้องชดใช้ความผิดของ [owner.GetHerHis] ทหาร!"

 secrets.0003.desc:0 "[secret_exposer.Custom2('MyCharacterIntroduction', ROOT.Char)|U] ได้ประณามข้าต่อสาธารณะว่าเป็นผู้สมสู่กับ [ROOT.Char.GetWomenMen] อื่น! แม้ข้าจะอ้างว่าเป็นความเข้าใจผิดมากเพียงใด เหล่า [ROOT.Char.Custom('DefaultPriestTitlePlural')] ก็ถือว่าข้าเป็นคนบาปในสายพระเนตรของ [ROOT.Char.GetFaith.HighGodName]"
 secrets.0003.a:0 "หากข้าเพียงมีโอกาสอธิบาย ข้า... ข้า..."

 secrets.0103.negative.desc:0 "[secret_exposer.Custom2('MyCharacterIntroduction', ROOT.Char)|U] ได้กล่าวหา [owner.Custom2('MyCharacterIntroduction', ROOT.Char)] ว่ามีความสัมพันธ์ทางเนื้อหนังกับ [owner.GetWomenMen] อื่น! นี่มิใช่สิ่งที่ [ROOT.Char.GetFaith.HighGodNameAlternate] ประสงค์เป็นแน่!"
 secrets.0103.positive_1.desc:0 "[secret_exposer.Custom2('MyCharacterIntroduction', ROOT.Char)|U] ได้กล่าวหา [owner.Custom2('MyCharacterIntroduction', ROOT.Char)] ต่อสาธารณะว่าสมสู่ทางทวารหนัก!"
 secrets.0103.positive_2.desc:0 "\n\nตัดสินจากคำดูหมิ่นอันชั่วช้าของ [secret_exposer.GetTitledFirstNamePossessiveNoTooltip] [secret_exposer.GetSheHe] คงคิดว่า [owner.GetTitledFirstNameNoTooltip] คือ [ROOT.Char.GetFaith.DevilName] [ROOT.Char.GetFaith.DevilHerselfHimself] ทว่าความรักจะผิดได้อย่างไรกัน?"
 secrets.0103.worried_2.desc:0 "\n\nข้าต้องระวังตัวเมื่ออยู่ใกล้ [lover.GetFirstName] เพื่อประโยชน์ของ [lover.GetHerHis] เช่นเดียวกับของข้าเอง ใครจะรู้ว่าพวกเขาจะชี้หน้ากล่าวหาผู้ใดเป็นรายต่อไป..."
 secrets.0103.worried_3.desc:0 "พวกเราจะได้รักกันอย่างเสรี ปราศจากความกลัว บ้างหรือไม่?"
 secrets.0103.dislikes_negative:0 "[ROOT.Char.GetFaith.HighGodName] จะทรงพิพากษาเจ้า คนบาป!"
 secrets.0103.b:0 "ทหาร! จับ [owner.GetWomanMan] ผู้นี้ล่ามโซ่!"

 secrets.0004.desc:0 "[secret_exposer.Custom2('MyCharacterIntroduction', ROOT.Char)|U] ได้ประณามข้าว่าเป็นผีดิบที่ชื่นชอบรสชาติเนื้อมนุษย์! [secret_exposer.GetSheHe|U] หามีทางเข้าใจสิ่งที่ [secret_exposer.GetSheHe] พูดไม่ แต่ทุกคนดูเหมือนจะเชื่อข่าวลือนั้นว่าเป็นจริง"
 secrets.0004.a:0 "ชื่อเสียงข้าป่นปี้หมดแล้ว!"

 secrets.0104.negative.desc:0 "ความคลื่นเหียนตีขึ้นมาในลำคอเมื่อนึกถึงข้อกล่าวหาที่ [secret_exposer.Custom2('MyCharacterIntroduction', ROOT.Char)] หยิบยกขึ้นมา [owner.Custom2('MyCharacterIntroductionNoComma', ROOT.Char)|U] เป็นพวกกินเนื้อมนุษย์! ข้ามิอาจปัดเป่าภาพอันน่าสยดสยองนั้นออกไปจากใจได้เลย..."
 secrets.0104.positive_1.desc:0 "[secret_exposer.Custom2('MyCharacterIntroduction', ROOT.Char)|U] ได้กล่าวหา [owner.Custom2('MyCharacterIntroduction', ROOT.Char)] ต่อสาธารณะว่าเป็นพวกกินเนื้อมนุษย์!"
 secrets.0104.worried.desc:0 "ข้าต้องระวังตัว หากข้าไม่ยับยั้งความกระหายของตน ข้าอาจเป็นรายต่อไป..."
 secrets.0104.positive_2.desc:0 "เขาไม่เข้าใจหรือว่า [ROOT.Char.GetFaith.HighGodName] ทรงปรีดาเพียงใดในการเลี้ยงฉลองของเรา?"
 secrets.0104.dislikes_negative:0 "เจ้าน่ารังเกียจยิ่งนัก [owner.GetFirstNameNoTooltip]!"
 secrets.0104.b:0 "ผีดิบตนนี้ต้องชดใช้ความผิดของ [owner.GetHerHis] ทหาร!"

 secrets.0005.desc:0 "ด้วยการบอกเล่าความคิดของข้าเกี่ยวกับ [ROOT.Char.GetFaith.HighGodName] ให้ทุกคนฟัง [secret_exposer.Custom2('MyCharacterIntroduction', ROOT.Char)] ได้ ทำให้เหล่า [ROOT.Char.Custom('DefaultPriestTitlePlural')] เชื่อว่าข้าเป็นผู้ไร้ศรัทธา และเป็นผู้ทรยศต่อ [ROOT.Char.GetFaith.HighGodNameAlternate]!"
 secrets.0005.a:0 "การคิดด้วยตนเองมันผิดกระไรนัก?!"

 secrets.0105.negative.desc:0 "[secret_exposer.Custom2('MyCharacterIntroduction', ROOT.Char)|U] ได้กล่าวหา [owner.Custom2('MyCharacterIntroduction', ROOT.Char)] ว่าเป็นผู้ไร้ศรัทธา! เป็นผู้ทรยศต่อ [owner.GetFaith.HighGodName]! [owner.GetSheHe] เป็นใครถึงกล้าตั้งคำถามต่อ [owner.GetFaith.HighGodNameAlternate]?"
 secrets.0105.positive_1.desc:0 "[secret_exposer.Custom2('MyCharacterIntroduction', ROOT.Char)|U] ได้กล่าวหา [owner.Custom2('MyCharacterIntroduction', ROOT.Char)] ต่อสาธารณะว่าเป็นผู้ไร้ศรัทธา!"
 secrets.0105.positive_2.desc:0 "ความไร้เหตุผลของ [secret_exposer.GetFirstNamePossessiveNoTooltip] ช่างน่าอับอาย [owner.GetFirstNameNoTooltip] ได้ก่อความเสียหายอันใด?"
 secrets.0105.worried.desc:0 "ต่อ แต่นี้ไป ข้าต้องเลือกใช้คำพูดด้วยความระมัดระวัง มิฉะนั้นข้าอาจเป็นรายต่อไป..."
 secrets.0105.dislikes_negative:0 "[owner.GetSheHe] ไม่มีความละอายใจบ้างหรือ?!"
 secrets.0105.likes_positive:0 "การคิดด้วยตนเองมันเลวร้ายตรงไหน?"

 secrets.0006.desc:0 "[secret_exposer.Custom2('MyCharacterIntroduction', ROOT.Char)|U] ได้แพร่ข่าวลืออันชั่วช้าเกี่ยวกับความสัมพันธ์ทางเนื้อหนังระหว่างข้ากับญาติที่ไม่ระบุชื่อ! ผู้คนดูเหมือนจะกระตือรือร้นที่จะเชื่อ [secret_exposer.GetHerHim] เสียเหลือเกิน!"
 secrets.0006.a:0 "พวกเขาเป็นใครถึงกล้าตัดสินว่ารักแท้คืออะไร?!"

 secrets.0106.t:0 "ความลับถูกเปิดโปง!"
 secrets.0106.negative.desc:0 "ด้วยนามแห่ง [ROOT.Char.GetFaith.HighGodName]! [secret_exposer.Custom2('MyCharacterIntroduction', ROOT.Char)|U] ได้แสดงหลักฐานอันมิอาจปฏิเสธได้ต่ออาณาจักร ว่า [owner.Custom2('MyCharacterIntroduction', ROOT.Char)] ได้กระทำการอันวิปริตด้วยการร่วมประเวณีในหมู่ญาติ!"
 secrets.0106.positive_1.desc:0 "[secret_exposer.Custom2('MyCharacterIntroduction', ROOT.Char)|U] ได้กล่าวหา [owner.Custom2('MyCharacterIntroduction', ROOT.Char)] ต่อสาธารณะว่ามีความสัมพันธ์ร่วมสายโลหิต!"
 secrets.0106.worried.desc:0 "\n\nความทุกข์ทรมานของ [owner.GetTitledFirstNamePossessiveNoTooltip] นั้นชัดเจนดังกลางวัน ทว่าข้ากลับถูกบีบให้ระงับความปลอบโยน ข้าสาบานได้ว่าสายตาของพวกเขาติดตามข้าไปทุกที่..."
 secrets.0106.positive_2.desc:0 "แต่ความรักระหว่างญาติพี่น้องมิใช่เป็นธรรมชาติเหมือนการหายใจหรอกหรือ?"
 secrets.0106.likes_negative:0 "ข้าไม่เคย... ไม่เคยคิดเลย!"
 secrets.0106.dislikes_negative:0 "น่าขยะแขยง! น่าขยะแขยงอย่างที่สุด!"
 secrets.0106.likes_positive:0 "การประหัตประหารนี้ไม่ถูกต้อง!"
 secrets.0106.dislikes_positive:0 "เราไม่มีเรื่องสำคัญกว่านี้ให้ดูแลแล้วหรือ?"


 secrets.0007.desc:0 "[secret_exposer.Custom2('MyCharacterIntroduction', ROOT.Char)|U] ได้ประณามการปฏิบัติของข้าว่าไร้ ซึ่งความเป็นพระเจ้าและไม่อาจให้อภัยได้! บัดนี้ผู้คนขนานนามข้าว่าเป็นแม่มด และเป็นศัตรูของ [ROOT.Char.GetFaith.HighGodName]!"
 secrets.0007.a:0 "พวกเขาไม่เห็นสัจธรรมที่ข้าเห็นหรอกหรือ?"

 secrets.0107.negative.desc:0 "[secret_exposer.Custom2('MyCharacterIntroduction', ROOT.Char)|U] ได้กล่าวหา [owner.Custom2('MyCharacterIntroduction', ROOT.Char)] ว่าเป็นแม่มด! [owner.GetWomanMan] ชั่วช้าผู้นี้คบหากับ [ROOT.Char.GetFaith.DevilName] เพื่อวางยาความคิดและชักนำพวกเราให้ออกห่างจาก [ROOT.Char.GetFaith.HighGodName]!"
 secrets.0107.positive_1.desc:0 "[secret_exposer.Custom2('MyCharacterIntroduction', ROOT.Char)|U] ได้กล่าวหา [owner.Custom2('MyCharacterIntroduction', ROOT.Char)] ต่อสาธารณะว่าเป็นแม่มด!"
 secrets.0107.positive_2.desc:0 "[secret_exposer.GetWomanMan] ปัญญาทึบผู้นี้พล่ามไม่หยุดเกี่ยวกับ "[secret_exposer.GetFaith.DevilName]" [secret_exposer.GetSheHe] ตาบอดต่อปัญญาของ [owner.GetTitledFirstNamePossessiveNoTooltip] หรืออย่างไร?"
 secrets.0107.worried.desc:0 "\n\nข้าอยากจะพูด เปิดเผยความจริงให้พวกเขาทั้งหมดเห็น แต่พวกเขาจะฟังหรือ? หากข้าทำ เช่นนั้น ข้าเกรงว่าพวกเขาจะหันมาเล่นงานข้าเป็นรายต่อไป..."
 secrets.0107.dislikes_negative:0 "เผาแม่มด!"
 secrets.0107.b:0 "แม่มดจะต้องชดใช้ความผิดของ [owner.GetHerHis]!"
 secrets.0107.c:0 "ข้อกล่าวหาเหล่านี้มิใช่อื่นใดนอกจากความมุ่งร้ายและคำโกหก"
 

 secrets.0008.desc:1 "[secret_exposer.Custom2('MyCharacterIntroduction', ROOT.Char)|U] ได้เปิดเผยว่าข้าแอบพบกับ [Select_CString( ObjectsEqual( secret_exposer, target ), 'พวกเขา', target.GetTitledFirstName )] อย่างลับๆ! เมื่อความจริงแพร่กระจายไปดั่งไฟลามทุ่ง ความรักอันเร่าร้อนของเราอาจไม่ได้ถูกซ่อนเร้นอย่างที่เราเชื่อ"
 secrets.0008.forbidden.desc:1 "[secret_exposer.Custom2('MyCharacterIntroduction', ROOT.Char)|U] ได้เปิดโปงความสัมพันธ์ของข้ากับ [Select_CString( ObjectsEqual( secret_exposer, target ), 'พวกเขา', target.GetTitledFirstName )] ให้โลกได้รับรู้!\n\nขณะที่พวกเขาชี้นิ้วและตะโกนถ้อยคำหยาบคาย ข้าหาได้รู้สึกละอายไม่ ข้าเพียงโกหกเพื่อปกป้อง [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('target'))] ของข้าให้ปลอดภัย ทว่าสิ่งที่ข้ารู้สึกคือความหวาดกลัว... จะเกิดอะไรขึ้นกับพวกเราต่อไป?"
 secrets.0008.a:0 "พวกเขาเป็นใครถึงกล้าตัดสิน?!"

 secrets.0108.no_exposer.desc:3 "ความจริงที่ถูกซ่อนเร้นได้ปรากฏสู่แสงสว่าง [ROOT.Char.Custom2('RelationToMeShort', primary_character)] ของข้า [primary_character.GetTitledFirstName] ได้"
 secrets.0108.exposer.desc:1 "[secret_exposer.Custom2('MyCharacterIntroduction', ROOT.Char)|U] ได้กล่าวหา [primary_character.GetTitledFirstName] ผู้เป็น [secret_exposer.Custom2('RelationToMeShort', primary_character)] ของ [secret_exposer.GetHerHis] ว่ามี"
 secrets.0108.incest_bad.desc:2 "ความสัมพันธ์ร่วมสายโลหิตกับ #EMP [primary_character.Custom2('RelationToMeShort', SCOPE.sC('secondary_character'))]#!! ของ [primary_character.GetHerHis] เอง! [primary_character.GetFirstNameNoTooltip] และ [secondary_character.GetTitledFirstName] เป็นชู้รักกัน!\n\nข้าเคยเห็นและได้ยินเรื่องราวมามากมายในชีวิต แต่เรื่องนี้..."
 secrets.0108.sodomy_bad.desc:3 "กระทำการสมสู่ทางทวารหนักร่วมกับ [SCOPE.Custom('SecretRevealSecondCharacterIntroduction')]! นี่มิใช่สิ่งที่ [ROOT.Char.GetFaith.HighGodNameAlternate] ประสงค์เป็นแน่!"
 secrets.0108.adulterer_bad.desc:3 "มีความสัมพันธ์ชู้สาวนอกสมรสกับ [SCOPE.Custom('SecretRevealSecondCharacterIntroduction')]! [primary_character.GetSheHe] ลบหลู่ความศักดิ์สิทธิ์ของการสมรสของ [primary_character.GetHerHis] ได้อย่างไร?"
 secrets.0108.fornicator_bad.desc:3 "ร่วมสังวาสกับ [SCOPE.Custom('SecretRevealSecondCharacterIntroduction')]! เรื่อง เช่นนี้มิอาจยอมรับได้นอกการสมรส!"
 secrets.0108.incest_is_good.desc:3 "มีความสัมพันธ์ชู้สาวกับ [secondary_character.Custom2('HerHisCharacterIntroductionNoComma', primary_character)] มีผู้คนมากมายตัดสินพวกเขา ทว่าข้ารู้ว่าไม่มีสิ่งใดที่เป็นอันตรายในสิ่งที่ [primary_character.GetFirstNameNoTooltip] และ [secondary_character.GetFirstNameNoTooltip] มีร่วมกัน..."
 secrets.0108.all_is_good.desc:3 "มีความสัมพันธ์ชู้สาวกับ [SCOPE.Custom('SecretRevealSecondCharacterIntroduction')] ข้าไม่เห็นว่าเรื่องนี้จะเอิกเกริกอันใดนัก มันมิใช่ว่าตัณหาเป็นสิ่งผิดธรรมชาติเสียเมื่อไร..."
 secrets.0108.dislikes_negative:0 "[ROOT.Char.GetFaith.HighGodName] จะทรงพิพากษาคนบาปเหล่านี้!"
 secrets.0108.b:0 "อาชญากรรมนี้มิอาจปล่อยให้ผ่านไปโดยไม่มีการลงโทษ ทหาร!"

 secrets.0110.start.desc:0 "[secret_exposer.Custom2('MyCharacterIntroduction', ROOT.Char)|U] ได้นำเสนอหลักฐานที่ไม่อาจปฏิเสธได้ว่า"
 secrets.0110.start.above_cutoff:0 "แม้ว่าจะไม่มีทางพิสูจน์ได้อย่างแน่ชัด [secret_exposer.Custom2('MyCharacterIntroduction', ROOT.Char)|U] ได้นำเสนอหลักฐานว่า"
 secrets.0110.single_child.desc:0 "[child.GetTitledFirstName] มิใช่"
 secrets.0110.single_child_relation.desc:0 "[child.GetFirstName] มิใช่"
 secrets.0110.is_not_fathers.desc:0 "[child.Custom('GetDaughterSon')] ของ [father.Custom2('MyCharacterIntroductionNoComma', ROOT.Char)] แต่ [child.GetSheHe] ถือกำเนิดจาก"
 secrets.0110.are_not_fathers.desc:0 "บุตรของ [father.Custom2('MyCharacterIntroductionNoComma', ROOT.Char)] แต่พวกเขาถือกำเนิดจาก"
 secrets.0110.is_not_mine.desc:0 "[child.Custom('GetDaughterSon')] ของข้า แต่ถือกำเนิดจาก"
 secrets.0110.incest_real_father.desc:0 "[mother.Custom2('RelationToMeShort', SCOPE.sC('real_father'))] ของ [mother.GetTitledFirstNamePossessive] เอง [real_father.GetTitledFirstName]!\n\n"
 secrets.0110.regular_real_father.desc:1 "[real_father.Custom2('MyCharacterIntroductionNoComma', ROOT.Char)]!"
 secrets.0110.regular_real_father_self_expose:0 "มิใช่ใครอื่นนอกจาก [real_father.GetHerHim]!"
 secrets.0110.father.child_above_cutoff:0 "\n\nไม่มีทางที่จะพิสูจน์เรื่องใดๆ เหล่านี้ได้อย่างไม่อาจโต้แย้งได้ แต่มันเริ่มจะสมเหตุสมผลขึ้นมาแล้ว..."
 secrets.0110.father_knew.desc:0 "\n\nแม้จะเป็นแผลเก่า แต่ก็ยังเจ็บปวดที่ต้องนึกถึงความไม่ซื่อสัตย์ของ [mother.GetFirstNamePossessive]... และบัดนี้ ข้าต้องแบกรับความอัปยศให้ทุกคนเห็น"
 secrets.0110.father_love.desc:0 "\n\nโอ้ [mother.GetFirstName] ท่านทำ เช่นนี้ได้อย่างไร? ข้ารักท่าน และ [child.Custom('GetDaughterSon')] ของเรา... [child.Custom('GetDaughterSon')] ของท่าน ในชั่วพริบตาเดียว ท่านทั้งสองก็ถูกพรากไปจากข้า"
 secrets.0110.father_no_love.desc:0 "\n\nแม้พันจันทราจะผ่านพ้นไป แต่ข้าจะไม่มีวันลืมการทรยศของ [mother.GetFirstNamePossessive] บางทีข้าอาจจะกลับมาเชื่อใจ [mother.GetHerHis] ได้อีกครั้ง แต่วันนี้ยังไม่ใช่วันนั้น"
 secrets.0110.incest_consort.desc:0 "\n\nความจริงกระจ่างแก่ข้าดุจค้อนทุบ โอ้ ท่าน [ROOT.Char.GetFaith.HighGodName] ที่รัก [consort_bastard.GetFirstNameNoTooltip] คือ [ROOT.Char.Custom2('CloseOrExtendedFamilyRelationToMe', SCOPE.sC('consort_bastard'))] ของข้า ตลอดเวลาที่ผ่านมา... สิ่งที่เราได้ทำลงไป..."
 secrets.0110.incest_consort_accepted.desc:0 "\n\nด้วยนามแห่ง [ROOT.Char.GetFaith.HighGodName] นี่หมายความว่า [consort_bastard.GetFirstNameNoTooltip] คือ [ROOT.Char.Custom2('CloseOrExtendedFamilyRelationToMe', SCOPE.sC('consort_bastard'))] ของข้า! ข้ารู้อยู่แล้วว่ามี #EMP บางสิ่ง#! อยู่ตรงนั้น ความผูกพันพิเศษบางอย่าง... บัดนี้ข้ารู้สึกใกล้ชิดกับ [consort_bastard.GetHerHim] มากกว่าที่เคย"
 secrets.0110.mother_spouse.desc:0 "\n\nข่าวซุบซิบแพร่กระจายไปทั่วราชสำนักดั่งไฟลามทุ่ง และ [mother.GetFirstName] ได้ขังตนเองอยู่ในห้องพักของนาง ข้าควรจะปลอบโยนนางหรือไม่? ตำหนินาง? หรือข้าควร... กังวล?"
 secrets.0110.real_father_spouse.desc:0 "\n\nข่าวซุบซิบแพร่กระจายไปทั่วราชสำนักดั่งไฟลามทุ่ง แต่ข้าไม่รู้ว่าจะคิดหรือพูดอะไร ท่านทำ เช่นนี้ได้อย่างไร [real_father.GetFirstName]? ข้าจะเชื่อใจท่านอีกครั้งได้อย่างไร?"
 secrets.0110.mother_family.desc:0 "\n\n[ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('mother'))] ของข้าเองทำ เช่นนี้กับพวกเราได้อย่างไร? ในทางกลับกัน [child.GetFirstNameNoTooltip] ไม่มีส่วนผิดในเรื่องนี้ ทว่าผลกระทบที่ [child.GetHerHis] ได้รับอาจร้ายแรง..."
 secrets.0110.real_father_family.desc:0 "\n\n[ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('real_father'))] ของข้าเองทำ เช่นนี้กับพวกเราได้อย่างไร? ในทางกลับกัน [child.GetFirstNameNoTooltip] ไม่มีส่วนผิดในเรื่องนี้ ทว่าผลกระทบที่ [child.GetHerHis] ได้รับอาจร้ายแรง..."
 secrets.0110.general_end.desc:0 "\n\n[child.GetFirstNameNoTooltip] ไม่มีส่วนผิด แต่ผลที่ [child.GetHerHis] ได้รับอาจร้ายแรง ในทางกลับกัน [real_father.GetTitledFirstNameNoTooltip] และ [mother.GetTitledFirstName]..."
 secrets.0110.a:0 "ข้าพูดไม่ออก!"
 secrets.0110.a.incest:0 "ข้าคิดว่าข้ากำลังจะอาเจียน"
 secrets.0110.b:0 "เจ้ายังคงนอนกับ [consort_bastard_parent_lover.GetHerHim] อยู่ใช่หรือไม่?!"
 secrets.0110.b.success.desc:0 "ข้อกล่าวหาของข้าถูกต้อง"
 secrets.0110.b.success.tt:0 "ความลับของ [consort_bastard_parent.GetTitledFirstNamePossessive] ถูกเปิดเผยแก่ข้า"
 secrets.0110.b.failure.desc:0 "[consort_bastard_parent_lover.GetTitledFirstNameNoTooltip] มิใช่ชู้รักของ [consort_bastard_parent.GetTitledFirstNamePossessiveNoTooltip]"
 secrets.0110.c:0 "ข้าเกือบจะหวังว่าตนไม่เคยรู้เลย..."
 
 secrets.0112.single_child_relation.desc:0 "[ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('child'))] ของข้า [child.GetFirstName] ถือกำเนิดจาก"
 secrets.0112.single_child.desc:0 "[child.GetTitledFirstName] ถือกำเนิดจาก"
 secrets.0112.mother_family.desc:0 "โอ้ ท่านแม่ ข้าไม่แน่ใจว่าจะพูดอะไร หรือรู้สึกอย่างไร อย่างน้อยตอนนี้ทุกอย่างก็เปิดเผยแล้ว"
 secrets.0112.real_father_family.desc:1 "\n\n[ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('real_father'))] ของข้าเองทำ เช่นนี้กับพวกเราได้อย่างไร? [real_father.GetFirstNameNoTooltip] ท่านรู้หรือไม่ว่านี่หมายถึงอะไรสำหรับครอบครัวของเรา?"
 secrets.0112.general_end.desc:0 "ข้าสงสัยว่า [child.GetFirstNameNoTooltip] รู้เกี่ยวกับชาติกำเนิดที่แท้จริงของ [child.GetHerHis] หรือไม่ หรือนี่เป็นข่าวใหม่สำหรับ [child.GetHerHim] เช่นเดียวกับข้า? การเปิดเผยนี้จะเป็นพรหรือคำสาปกันแน่?"
 secrets.0112.b.success.desc:0 "ความสงสัยของข้าถูกต้อง"
 secrets.0112.a:0 "ใครจะไปรู้เล่า?"
 secrets.0112.b:0 "ท่านยังคงพบกับ [consort_bastard_parent_lover.GetHerHim] อยู่หรือไม่?"
 secrets.0112.c:0 "ปล่อยให้เรื่องนี้ผ่านไปเถิด"

 secrets.0115.start.desc:0 "[secret_exposer.Custom2('MyCharacterIntroduction', ROOT.Char)|U] ได้นำเสนอหลักฐานที่ไม่อาจปฏิเสธได้ถึงความพยายามของข้าในการสังหาร [victim.Custom2('MyCharacterIntroductionNoComma', ROOT.Char)]! [ROOT.Char.Custom('CulturalCurse')|U]!\n\n"
 secrets.0115.victim_alive.desc:0 "บัดนี้เมื่อ [victim.GetSheHe] รู้แล้ว ข้าต้องระมัดระวังตัว การแก้แค้นของ [victim.GetHerHis|U] อาจมาถึงในวันพรุ่งนี้ ในสิบปี หรืออาจจะไม่มาถึงเลยก็ได้ แต่หากมันมาถึงเมื่อใด ข้าก็ไม่ควรประมาท"
 secrets.0115.victim_dead.desc:0 "อย่างน้อยบัดนี้ [victim.Custom2('InsultNoun', ROOT.Char)] นั่นก็กำลังเน่าเปื่อยอยู่ในหลุมศพของ [victim.GetHerHis]!"
 secrets.0115.a:0 "ข้ามีเหตุผลของข้า!"

 secrets.0116.negative.desc:0 "สาบานต่อ [ROOT.Char.GetFaith.HighGodName]! [secret_exposer.Custom2('MyCharacterIntroduction', ROOT.Char)|U] ได้นำเสนอหลักฐานที่มิอาจโต้แย้งได้ถึงความพยายามลอบสังหาร [victim.Custom2('MyCharacterIntroductionNoComma', ROOT.Char)] ซึ่งถูกบงการโดย [murderer.Custom2('MyCharacterIntroductionNoComma', ROOT.Char)]!\n\n[murderer.Custom2('InsultNoun', ROOT.Char)] เลือดเย็นผู้นั้นมิมีความเคารพต่อชีวิตมนุษย์เลยหรือ?"
 secrets.0116.positive.desc:0 "[secret_exposer.Custom2('MyCharacterIntroduction', ROOT.Char)|U] ได้กล่าวหา [murderer.Custom2('MyCharacterIntroduction', ROOT.Char)] ว่าวางแผนสังหาร [victim.Custom2('MyCharacterIntroductionNoComma', ROOT.Char)]!\n\nบัดนี้เมื่อความจริงเปิดเผยแล้ว [murderer.GetFirstNameNoTooltip] ควรระวังหลังของ [murderer.GetHerHis] ไว้ให้ดี"
 secrets.0106.victim_knows.desc:0 "[secret_exposer.Custom2('MyCharacterIntroduction', ROOT.Char)|U] ได้กล่าวหา [murderer.Custom2('MyCharacterIntroduction', ROOT.Char)] ต่อสาธารณะว่าพยายามจบชีวิตของข้า พยายามอธิบายหรือบิดเบือนเท่าใด [murderer.GetSheHe] ก็ตาม บัดนี้หลักฐานได้เปิดเผยให้ทุกคนเห็นแล้ว"
 secrets.0106.victim.desc:0 "สาบานต่อ [ROOT.Char.GetFaith.HighGodName]! [secret_exposer.Custom2('MyCharacterIntroduction', ROOT.Char)|U] ได้นำเสนอหลักฐานที่มิอาจโต้แย้งได้ถึงความพยายามลอบสังหาร #EMP ข้า#!! [murderer.Custom2('InsultNoun', ROOT.Char)] คดโกงผู้อยู่เบื้องหลังแผนการนี้มิใช่ใครอื่นนอกจาก [murderer.Custom2('MyCharacterIntroductionNoComma', ROOT.Char)]!\n\nจงเชื่อคำข้า [murderer.GetSheHe] จะต้องเสียใจกับการล้มเหลวของ [murderer.GetHerHis]"
 secrets.0116.likes_negative:0 "[murderer.GetSheHe] ทำ เช่นนี้ได้อย่างไร!"
 secrets.0116.dislikes_negative:0 "[murderer.GetSheHe|U] จะต้องชดใช้ ไม่ทางใดก็ทางหนึ่ง!"
 secrets.0116.likes_positive:0 "ข้ามั่นใจว่า [victim.GetFirstNameNoTooltip] สมควรได้รับมันแล้ว!"
 secrets.0116.victim_knows:0 "บัดนี้ทุกคนจะรู้ว่า [murderer.GetSheHe] เป็นใครอย่างแท้จริง"
 secrets.0116.b:0 "ทหาร! จับกุมอาชญากรโสมมผู้นี้!"
 secrets.0116.c:0 "[murderer.GetSheHe|U] เดินอย่างอิสระ สำหรับตอนนี้"

 secrets.0117.start.desc:0 "[secret_exposer.Custom2('MyCharacterIntroduction', ROOT.Char)|U] ได้นำเสนอหลักฐานที่ไม่อาจปฏิเสธได้ถึงบทบาทของข้าในการตายของ [victim.Custom2('MyCharacterIntroductionNoComma', ROOT.Char)]! [ROOT.Char.Custom('CulturalCurse')|U]!\n\n"
 secrets.0117.kinslayer.desc:0 "ข้าเคยหวังว่ามันจะไม่มาถึงจุดนี้ ความผิดพลาดของคนโง่เขลา บัดนี้ข้าอยู่ในความเมตตาของ [dynast.GetTitledFirstNamePossessive] และหาก [dynast.GetSheHe] ให้อภัยข้า ก็ยังมีคนอื่นอีกมากที่กระหายการแก้แค้น..."
 secrets.0117.kinslayer_dynasty_head.desc:0 "ข้าเคยหวังว่ามันจะไม่มาถึงจุดนี้ ความผิดพลาดของคนโง่เขลา บัดนี้ข้าเกรงว่าราชวงศ์ทั้งหมดของข้าจะหันมาต่อต้านข้า..."
 secrets.0117.regular.desc:0 "เป็นการดีที่สุดที่ข้าจะระวังหลังและเตรียมการป้องกันตนเอง มีคนจำนวนมากที่กระหายการแก้แค้น..."
 secrets.0117.a:0 "ข้ามีเหตุผลของข้า!"


 secrets.0118.known_murder.t:0 "ฆาตกร!"
 secrets.0118.negative_start.desc:0 "[secret_exposer.Custom2('MyCharacterIntroduction', ROOT.Char)|U] ได้เปิดโปงความลับอันน่าสยดสยองที่สุด! [victim.Custom2('MyCharacterIntroduction', ROOT.Char)|U] พบจุดจบก่อนวัยอันควรด้วยน้ำมือของ [murderer.Custom2('MyCharacterIntroductionNoComma', ROOT.Char)]!\n\n"
 secrets.0118.negative_start_known.desc:0 "[murderer.Custom2('MyCharacterIntroduction', ROOT.Char)|U] ได้สังหาร [victim.Custom2('MyCharacterIntroduction', ROOT.Char)] อย่างเลือดเย็น!\n\n"
 secrets.0118.negative_end_family.desc:0 "[murderer.Custom2('InsultAdjective', ROOT.Char)] [murderer.Custom2('InsultNoun', ROOT.Char)] นั่นควรนอนลืมตาข้างเดียวไว้เถิด ไม่ทางใดก็ทางหนึ่ง [murderer.GetSheHe] จะต้องเสียใจกับการกระทำนี้อย่างขมขื่น ข้าขอสาบานต่อหน้าหลุมศพของ [victim.GetTitledFirstNamePossessiveNoTooltip]!"
 secrets.0118.negative_end.desc:0 "[murderer.GetFirstNameNoTooltip] คงคิดว่า [murderer.GetHerselfHimself] เทียบเท่ากับ [ROOT.Char.GetFaith.HighGodNamePossessive] ว่า [murderer.GetSheHe] ปกครองเหนือความเป็นและความตาย กฎหมายจะเป็นอย่างไรก็ช่าง! ไม่มีการไถ่บาปสำหรับอาชญากรรม เช่นนี้!"
 secrets.0118.positive.desc:0 "[secret_exposer.Custom2('MyCharacterIntroduction', ROOT.Char)|U] ได้กล่าวหา [murderer.Custom2('MyCharacterIntroduction', ROOT.Char)] ว่าเป็นผู้ ทำให้ [victim.Custom2('MyCharacterIntroductionNoComma', ROOT.Char)] ถึงแก่ความตายก่อนวัยอันควร!\n\nบัดนี้เมื่อความจริงเปิดเผยแล้ว [murderer.GetFirstNameNoTooltip] ควรระวังหลังของ [murderer.GetHerHis] ไว้ให้ดี"
 secrets.0118.positive_known.desc:0 "[murderer.Custom2('MyCharacterIntroduction', ROOT.Char)|U] ได้ ทำให้ [victim.Custom2('MyCharacterIntroductionNoComma', ROOT.Char)] ถึงแก่ความตายก่อนวัยอันควร! [murderer.GetWomanMan] ผู้นั้นได้สร้างศัตรูมากกว่าหนึ่งคนในวันนี้"
 
 secrets.0121.start.desc.intro.self_exposed:0 "แขวนคอและปล้นเจ้าหมาเลวทรามสามานย์นั่นซะ [secret_exposer.GetTitledFirstName] ดันไปปากโป้งบอกคนทั้งโลกว่าข้าจัดสรรเงินทุนใหม่จาก [secret_exposer.GetHerHim]\n\n"
 secrets.0121.start.desc.intro:1 "ให้ตายสิ เจ้า [secret_exposer.GetTitledFirstName] ขี้ขลาดนั่น [secret_exposer.GetWomanMan] ผู้นั้นกลับปากโป้งไปทั่วหล้าเรื่องเงินทุนที่ข้าได้จัดสรรใหม่จาก [secret_target.GetTitledFirstName]\n\n"
 secrets.0121.desc.victim_is_liege_or_above:1 "ที่แย่ไปกว่านั้น เนื่องจาก [secret_target.GetFirstNameNoTooltip] มีอำนาจตามกฎหมายเหนือข้า [secret_target.GetSheHe] อาจเรียกร้องให้ข้าชดใช้ #EMP ทุกอย่าง#! คืน ข้าอาจสิ้นเนื้อประดาตัว เพราะเรื่องนี้"
 secrets.0121.desc.victim_not_liege.root_has_liege:0 "โชคดีที่ [secret_target.GetFirstNameNoTooltip] ไม่มีอำนาจโดยตรงที่จะเรียกร้องค่าชดเชย โชคร้ายที่ [secret_target.GetSheHe] อาจไปร้องขอต่อเจ้าเหนือหัวของข้า [secret_owner.GetLiege.GetTitledFirstName] ให้เรียกร้องเงินแทน ข้าคงต้องหวังว่ามันจะไม่เป็น เช่นนั้น"
 secrets.0121.desc.victim_not_liege.root_has_no_liege:0 "อย่างน้อยก็ไม่มีอำนาจที่สูงกว่าใดๆ ที่จะบังคับให้ข้าต้องจ่ายเงินคืนได้ ขอบคุณ [secret_owner.GetFaith.WealthGodName] สำหรับความเมตตาเล็กๆ น้อยๆ"
 secrets.0121.a:1 "เงินนั่นแค่พักอยู่ในคลังของข้าเท่านั้น!"

 secrets.0122.t:1 "มือเหนียว"
 secrets.0122.start.desc.intro.self_exposed:0 "ข้าได้นำเสนอหลักฐานที่ไม่อาจโต้แย้งได้ว่า [secret_owner.Custom2('MyCharacterIntroduction', secret_target)] ได้แอบขโมยทรัพย์สินจากข้า! อาลักษณ์และเหรัญญิกของข้าได้ตรวจสอบทรัพย์สินที่ได้มาโดยมิชอบอย่างละเอียด และยอดรวมตรงกับภาษีและสิบลดที่หายไปหรือสูญเปล่าจากทั่วทั้งอาณาจักรของข้า\n\n"
 secrets.0122.start.desc.intro:1 "ตามคำกล่าวของ [secret_exposer.Custom2('MyCharacterIntroduction', secret_target)], [secret_owner.Custom2('MyCharacterIntroduction', secret_target)] ได้แอบขโมยทรัพย์สินจากข้า! หลักฐานที่นำเสนอมานั้นไม่อาจโต้แย้งได้ ยอดรวมตรงกับภาษีและสิบลดที่หายไปหรือสูญเปล่าจากทั่วทั้งอาณาจักรของข้า\n\n"
 secrets.0122.desc.victim_is_vassal_or_below.secret_owner:1 "ในฐานะเจ้าเหนือหัวของ [secret_owner.GetFirstNamePossessiveNoTooltip] โชคดีที่ข้าอยู่ในฐานะที่จะเรียกร้องค่าชดเชยได้ #EMP มิฉะนั้น#!."
 secrets.0122.desc.victim_is_vassal_or_below.other:0 "แม้ว่า [secret_owner.GetFirstNameNoTooltip] จะไม่ได้อยู่ภายใต้อำนาจโดยตรงของข้า [secret_owner.GetSheHe] #EMP มี#! เจ้าเหนือหัวที่สามารถบังคับให้ [secret_owner.GetHerHim] จ่ายได้ — [secret_owner.GetLiege.GetTitledFirstName] อาจจะยอมสนับสนุนเรื่องของข้า หากข้าเสนอที่จะแบ่งภาษีย้อนหลังที่ได้คืนมาให้ [secret_owner.GetHerHim]"
 secrets.0122.desc.victim_not_vassal:1 "เนื่องจาก [secret_owner.GetFirstName] เป็นอิสระจากอำนาจของข้า จึงไม่มีหนทางใดที่ข้าจะเรียกคืนเงินที่หายไปได้"
 secrets.0122.a:1 "ข้าจะต้องได้เงินคืน [secret_owner.GetFirstNameNoTooltip]!"
 secrets.0122.a.tt:1 "[secret_owner.GetFirstName] จะจ่ายเงินคืนให้ท่าน #P [gold_i][secret.MakeScope.Var('embezzlement_stake').GetValue]#! เต็มจำนวน มิฉะนั้นจะก่อกบฏ"
 secrets.0122.b:1 "ข้าไม่สนทองคำ ข้าชอบ... เหล็กกล้ามากกว่า..."
 secrets.0122.c:1 "มนุษย์ย่อมผิดพลาด การให้อภัยคือสิ่งประเสริฐ"
 secrets.0122.c.tt:1 "[secret_target.GetFirstNameNoTooltip] ยก "หนี้สิน" ของท่านให้"
 secrets.0122.d:1 "$secrets.0122.a$"
 secrets.0122.d.tt:0 "ท่านร้องขอให้ [secret_owner.GetFirstName] จ่ายเงินคืน #P [gold_i][secret.MakeScope.Var('embezzlement_stake').GetValue]#! — [secret_owner.GetSheHe] ไม่ได้ถูกบังคับให้ทำ เช่นนี้ และไม่น่าจะปฏิบัติตาม"
 secrets.0122.e:1 "แน่นอนว่า [secret_owner.GetLiege.GetTitledFirstNameNoTooltip] ย่อมเห็นว่าสิ่งนี้ไม่ยุติธรรม..."
 secrets.0122.e.tt:0 "ท่านเสนอที่จะแบ่ง #P [gold_i][secret.MakeScope.Var('embezzlement_stake').GetValue]#! คนละครึ่งกับ [secret_owner.GetLiege.GetTitledFirstName] หาก [secret_owner.GetLiege.GetSheHe] บังคับให้ [secret_owner.GetFirstName] จ่ายเงินคืน"
 secrets.0122.f:1 "$secrets.0122.c$"
 secrets.0122.g:1 "ข้ารอเวลาได้..."
 secrets.0122.g.tt:1 "[secret_owner.GetFirstName] จะต้องเผชิญกับการพิพากษาอย่างแน่นอน ในที่สุด"

 secrets.0123.t:1 "[secret_target.Custom2('AppropriateGreeting', secret_owner)]"
 secrets.0123.desc.self_exposed:0 "บัดนี้โลกทั้งใบรู้เรื่องการโยกย้ายภาษี สิบลด และสินค้าอย่างผิดกฎหมายของเจ้าจากคลังของข้าแล้ว\n\nเจ้าจงคืนทรัพย์สินที่ได้มาโดยมิชอบเหล่านี้ทันที มิฉะนั้นจงเตรียมรับผลที่ตามมา"
 secrets.0123.desc:1 "[secret_exposer.Custom2('MyCharacterIntroduction', secret_target)|U] ได้แจ้งเตือนข้าถึงการโยกย้ายภาษี สิบลด และสินค้าอย่างผิดกฎหมายของเจ้าจากคลังของข้า\n\nเจ้าจงคืนทรัพย์สินที่ได้มาโดยมิชอบเหล่านี้ทันที มิฉะนั้นจงเตรียมรับผลที่ตามมา"
 secrets.0123.a:1 "นี่คือการขโมยทรัพย์สินอันชอบธรรมของข้า แต่ #EMP ก็ได้#!."
 secrets.0123.a.tt:0 "ทองคำของท่านมาถึงครบถ้วนและตรงเวลา"
 secrets.0123.b:1 "เจ้าจะได้ทองคำคืนก็ต่อเมื่อได้ลิ้มรสเหล็กกล้าของข้า!"
 secrets.0123.b.tt.on_the_lamb:0 "[secret_owner.GetFirstNameNoTooltip] หลบหนีออกจากอาณาจักร"
 secrets.0123.b.tt.captured:0 "[secret_owner.GetFirstNameNoTooltip] พยายามหลบหนี แต่ไม่สำเร็จ"
 secrets.0123.b.tt.refused:0 "[secret_owner.GetFirstNameNoTooltip] ปฏิเสธอย่างแข็งขัน"

 secrets.0124.t:0 "[secret_target.Custom2('AppropriateGreetingPositive', SCOPE.sC('liege'))]"
 secrets.0124.desc:0 "[secret_owner.Custom2('YourCharacterIntroduction', SCOPE.sC('liege'))|U] ได้ลักลอบนำทองคำจำนวนมากไปจากข้า ซึ่งข้ามิอาจได้คืนมาหากปราศจากความช่วยเหลือจากท่าน\n\nข้าขอวิงวอนท่าน โปรดเรียกร้องค่าชดเชยแทนข้า และท่านสามารถเก็บทองคำครึ่งหนึ่งไว้เป็นค่าตอบแทนได้"
 secrets.0124.a:0 "เอาล่ะ มันก็เป็นเพียงสิ่งที่ท่านสมควรได้รับอยู่แล้วนี่นา..."
 secrets.0124.a.tt:0 "ท่านและ [secret_target.GetShortUIName] ได้รับ #P [gold_i][secret.MakeScope.Var('embezzlement_stake_half').GetValue]#! คนละส่วน"
 secrets.0124.b:0 "ท่านจะได้รับเงินคืนเต็มจำนวน!"
 secrets.0124.b.tt:0 "[secret_target.GetShortUIName|U] ได้รับ #P [gold_i][secret.MakeScope.Var('embezzlement_stake').GetValue]#!"
 secrets.0124.b.tt.conditional:0 "หาก [secret_owner.GetTitledFirstName] ยอมรับ"
 secrets.0124.b.tt.conditional_failed: "หาก [secret_owner.GetTitledFirstName] ปฏิเสธ"
 secrets.0124.c:0 "เรื่องนี้ดูเหมือนจะเป็นเรื่องส่วนตัว"
 secrets.0124.c.tt:0 "[liege.GetTitledFirstNameNoTooltip] ไม่สนใจ"

 secrets.0125.t:0 "[liege.Custom2('AppropriateGreeting', secret_owner)]"
 secrets.0125.desc:0 "ข้าตกใจที่ได้ยินเรื่องการขโมยทรัพย์สินของเจ้าจาก [secret_target.Custom2('YourCharacterIntroduction', secret_owner)] [secret_target.GetSheHe|U] ติดต่อข้าเพื่อขอความยุติธรรม และในฐานะเจ้าเหนือหัวของเจ้า ข้าสั่งให้เจ้าชดใช้เงินครึ่งหนึ่งที่เจ้าขโมยไปจาก [secret_target.GetFirstNameNoTooltip] คืน\n\nอีกครึ่งหนึ่งเจ้าจะต้องจ่ายให้ข้าเป็นการไถ่โทษ เพื่อประโยชน์สุขของอาณาจักร"
 secrets.0125.a:0 "ชิ เอาไปเลยแล้วกัน"
 secrets.0125.a.tt:0 "ทองคำครึ่งหนึ่งของท่านมาถึงแล้ว"
 secrets.0125.b:0 "พวกเจ้าทั้งสองจะไม่ได้อะไรจากข้านอกจากเหล็กกล้า!"
 secrets.0125.b.tt:0 "[secret_owner.GetTitledFirstNameNoTooltip] ก่อกบฏแทนที่จะจ่ายเงิน"

 secrets.0126.t:0 "[liege.Custom2('AppropriateGreeting', secret_owner)]"
 secrets.0126.desc:0 "การขโมยเงินอย่างขี้ขลาดของเจ้าจากคลังของ [secret_target.GetTitledFirstName] จะไม่ถูกปล่อยปละละเลย ชดใช้คืนให้ [secret_target.GetHerHim] ทันทีและเต็มจำนวน มิฉะนั้นจงเผชิญกับความพิโรธของข้า"
 secrets.0126.a:0 "เงินนั่นหามาได้อย่างถูกต้องตามกฎหมาย แต่ #EMP ก็ได้#!."
 secrets.0126.a.tt:0 "[liege.GetTitledFirstNameNoTooltip] ส่งทุกอย่างให้ท่าน"
 secrets.0126.b:0 "เจ้าไม่ใช่เจ้าเหนือหัวของข้า!"
 secrets.0126.b.tt:0 "$secrets.0125.b.tt$"

 secrets.0131.desc: "[secret_target.GetTitledFirstName] ของข้าหาได้แสดงความเมตตาไม่ [secret_target.GetSheHe|U] ได้เปิดโปงแผนการของข้าที่จะยึด [secret_target.GetPrimaryTitle.GetTierAsNameNoTooltip|l] ให้กับตนเองต่อหน้าชาว [secret_target.GetPrimaryTitle.GetBaseName] ทั้งหมด!\n\nหากเพียง แต่มีหนทางชดใช้การกระทำของข้า..."
 every_fellow_vassal_tt: "ทุก [vassal|E] คน"
 secrets.0131.a: "ขอ [ROOT.Char.GetFaith.FateGodName] ทรงโปรดเมตตาข้าด้วยเถิด"

 secrets.0141.start.desc.intro.other_exposed: "[secret_exposer.GetTitledFirstName] ได้เปิดเผยแผนการทั้งหมดแก่ [secret_exposer.GetHerHim]...\n\n"
 secrets.0141.start.desc.intro.self_exposed: "ข้าเดาว่า [secret_target.GetTitledFirstName] คงต้องรู้เข้าสักวัน ไม่ทางใดก็ทางหนึ่ง...\n\n"
 secrets.0141.start.desc.intro: "ข้าน่าจะรู้ว่าการบุกปล้นตระกูล [secret_target.GetHouse.GetBaseName] ของเราไม่อาจเก็บเป็นความลับได้นานในรังอสรพิษที่เราเรียกว่า [secret_owner.GetTopLiege.GetPrimaryTitle.GetTierAsNameNoTooltip] แห่งนี้!"
 secrets.0141.desc.target_emperor: "บัดนี้เราต้องเตรียมพร้อมรับมือกับความโกรธเกรี้ยวอย่างรุนแรงของ [secret_target.GetTitleAsNameNoTooltip]..."
 secrets.0141.desc.owner_emperor: "ในฐานะ [secret_owner.GetTitleAsNameNoTooltip] ข้าต้องระมัดระวังตัวมากขึ้นหากต้องการหลีกเลี่ยงการยั่วยุความโกรธเคืองของตระกูลใหญ่ทั้งหลาย..."
 secrets.0141.desc.fallback: "ด้วยข้อมูลนี้ [secret_target.GetFirstNameNoTooltip] จะต้องพยายาม ทำให้ [secret_owner.GetTopLiege.GetTitleAsNameNoTooltip] ต่อต้านตระกูล [secret_owner.GetHouse.GetBaseName] อย่างแน่นอน..."
 secrets.0141.a: "ปล่อยให้คนโง่พล่ามไป!"
 secrets.0142.t: "ผู้บุกปล้นถูกเปิดโปง"
 secrets.0142.start.desc.intro.other_exposed: "ขอพรจาก [secret_target.GetFaith.HighGodName] จงมีแด่ [secret_exposer.GetTitledFirstName] ที่เปิดโปงความชั่วร้ายของตระกูล [secret_owner.GetHouse.GetBaseName] นี้!\n\n"
 secrets.0142.start.desc.intro.self_exposed: "สรรเสริญ [secret_target.GetFaith.HighGodNameAlternate] ที่ทรงนำทางข้าในการเปิดโปงความชั่วร้ายของตระกูล [secret_owner.GetHouse.GetBaseName] นี้!\n\n"
 secrets.0142.start.desc.intro: "ในที่สุด เราก็ได้รู้เสียทีว่าใครอยู่เบื้องหลังการบุกปล้นที่ดินของตระกูล [secret_target.GetHouse.GetBaseName] อย่างอุกอาจ! เจ้าปีศาจร้าย [secret_owner.GetTitledFirstName] และตระกูลอันน่ารังเกียจของ [secret_owner.GetHerHis]!"
 secrets.0142.desc.target_emperor: "ในฐานะ [secret_target.GetTitleAsNameNoTooltip] ข้าสามารถใช้อำนาจที่มีอยู่จัดการกับตระกูลชั่วร้ายนี้ได้"
 secrets.0142.desc.owner_emperor: "เราต้องระมัดระวังตัว [secret_owner.GetTitleAsNameNoTooltip] จะต้องคาดการณ์การเคลื่อนไหวครั้งต่อไปของเรา..."
 secrets.0142.desc.fallback: "บัดนี้เราสามารถนำศัตรูของเรามาจัดการต่อหน้า [secret_target.GetTopLiege.GetTitleAsNameNoTooltip] และ [secret_target.GetTopLiege.GetPrimaryTitle.GetTierAsNameNoTooltip] ได้แล้ว!"
 secrets.0142.a: "การทรยศครั้งนี้จะปล่อยไว้ไม่ได้!"
 secrets.0142.b: "เราจะแก้แค้นให้จงได้ ไม่ทางใดก็ทางหนึ่ง..."

 secrets.0500.single_child.t:0 "[child.Custom('GetDaughterSon')|U] ของชายอื่น"
 secrets.0500.start.desc:0 "มันจะเป็นจริงได้หรือ?"
 secrets.0500.single_child.desc:0 "ว่า [child.GetFirstName] ถือกำเนิดจาก"
 secrets.0500.incest_real_father.desc:0 "[mother.Custom2('RelationToMeShort', SCOPE.sC('real_father'))] ของ [mother.GetTitledFirstNamePossessive] เอง [real_father.GetTitledFirstName],"
 secrets.0500.regular_real_father.desc:0 "[real_father.Custom2('MyCharacterIntroductionNoComma', ROOT.Char)],"
 secrets.0500.end.desc:0 "มิใช่ข้า?\n\nข้าควรร้องไห้? กรีดร้อง? ลงโทษ? ให้อภัย? [child.GetFirstNameNoTooltip] จะถูกมองว่าเป็นบุตรที่เกิดโดยชอบธรรมของข้าเสมอ ทว่าข้ามิอาจปฏิเสธหลักฐานตรงหน้านี้ได้..."
 secrets.0500.a:0 "ข้าต้องการเวลาคิด..."

 secrets.0501.t:0 "ชาติกำเนิดที่แท้จริงของข้า"
 secrets.0501.desc_incest_marriage:0 "ในที่สุดข้าก็ได้รู้ว่าใครคือ [real_father.Custom('MotherFather')] ที่แท้จริงของข้า – [real_father.GetTitledFirstName] ข้าเพียง แต่หวังว่าการเปิดเผยนี้จะไม่มาพร้อมกับความรู้ที่ว่า [incest_spouse.Custom('WifeHusband')] ของข้า [incest_spouse.GetTitledFirstName] ก็เป็น [incest_spouse.Custom('SisterBrother')] ของข้าด้วย!"
 secrets.0501.desc_unmarried_mother:0 "ความจริงที่ว่าข้าถือกำเนิดนอกพันธะการสมรสได้หลอกหลอนข้ามาตั้งแต่เกิด\n\nบัดนี้เมื่อข้ารู้ความจริงแล้ว ว่า [real_father.GetTitledFirstName] คือ [real_father.Custom('MotherFather')] ของข้า ข้าก็สามารถหายใจได้คล่องขึ้นเสียที"
 secrets.0501.desc_married_mother:0 "นี่เรื่องตลกหรือ? ความฝันหรือ? [father.GetFirstName] ผู้เลี้ยงดูข้ามา มิใช่บิดาที่แท้จริงของข้าหรอกหรือ?\n\nมันดูราวกับไม่จริง แต่ข้ามิอาจปฏิเสธหลักฐานตรงหน้านี้ได้ ข้าถือกำเนิดจากชายอื่น – [real_father.GetTitledFirstName]"
 secrets.0501.a:0 "ความจริงอาจเป็นพร หรือเป็นคำสาป"

 secrets.0502.single_child.t:0 "[child.Custom('GetDaughterSon')|U] ที่หายไปของข้า"
 secrets.0502.single_child_start.desc:0 "ด้วยนามแห่ง [ROOT.Char.GetFaith.HighGodName], [child.GetTitledFirstName] คือ [child.Custom('GetDaughterSon')] ของข้างั้นหรือ?!"
 secrets.0502.lover.desc:0 "ข้าสงสัยมาตลอด แต่บัดนี้เมื่อความจริงปรากฏชัดเจนแล้ว ข้าก็พูดไม่ออก"
 secrets.0502.unmarried.desc:0 "\n\nการที่ [mother.Custom2('MyCharacterIntroduction', ROOT.Char)] ตั้งครรภ์นอกสมรสเป็นที่ทราบกันดี แต่การมีส่วนร่วมที่แท้จริง #EMP ของข้า#! ถูกเก็บเป็นความลับมาจนถึงบัดนี้"
 secrets.0502.married.desc:0 "\n\nเราทุกคนคิดว่า [father.Custom2('MyCharacterIntroduction', ROOT.Char)] เป็นบิดา ไม่น่าเชื่อว่า [mother.GetTitledFirstName] จะเก็บงำความจริงไว้ตลอดเวลา!"
 secrets.0502.end:0 "\n\nจะมีผู้ที่อ้างเสมอว่า [child.GetFirstNameNoTooltip] หนุ่มน้อย/สาวน้อย คือบุตรที่เกิดโดยชอบธรรมของ [father.GetFirstNamePossessiveNoTooltip] แต่ข้ารู้ความจริง"
 secrets.0502.a.incest:0 "ข้าคิดว่าข้ากำลังจะอาเจียน..."
 secrets.0502.a:0 "[child.GetFirstNameNoTooltip] ตลอดเวลาที่ผ่านมา..."
 secrets.0502.b:0 "โลกต้องรับรู้!"

 secrets.0503.t:0 "ความผูกพันอันใกล้ชิด"
 secrets.0503.incest_accepted.desc:0 "ด้วยนามแห่ง [ROOT.Char.GetFaith.HighGodName], [sibling_partner.GetFirstName] คือ [sibling_partner.Custom('SisterBrother')] ของข้า! ข้ารู้อยู่แล้วว่ามี #EMP บางสิ่ง#! อยู่ตรงนั้น ความผูกพันพิเศษบางอย่าง... บัดนี้ข้ารู้สึกใกล้ชิดกับ [consort_bastard.GetHerHim] มากกว่าที่เคย"
 secrets.0503.incest.desc:0 "ความจริงเกี่ยวกับชาติกำเนิดของ [sibling_partner.GetFirstNamePossessive] มาพร้อมกับผลลัพธ์อันน่าสะอิดสะเอียน หากเรามีบิดาคนเดียวกัน...\n\nภาพของสิ่งที่เราพูด สิ่งที่เราทำ ฉายวาบขึ้นในมโนภาพของข้า ตลอดเวลาที่ผ่านมา..."
 secrets.0502.likes_incest.a:0 "ข้าได้รับพรอย่างแท้จริง!"
 secrets.0502.dislikes_incest.a:0 "ข้าคิดว่าข้ากำลังจะอาเจียน"

 secrets.0510.t:0 "อสรพิษถูกเปิดโปง"
 secrets.0510.traitor.desc:0 "ข้าไม่อยากเชื่อว่า [murderer.GetTitledFirstName] จะกล้าวางแผนต่อต้านข้า! สังหาร [murderer.Custom2('RelationToMeShort', ROOT.Char)] ของ [murderer.GetHerHis] เอง!\n\n"
 secrets.0510.regular.desc:0 "ข้ารู้สึกทั้งโล่งใจและเดือดดาลที่ได้รู้ว่าใครพยายามเอาชีวิตข้า [murderer.Custom2('MyCharacterIntroduction', ROOT.Char)|U] มันอสรพิษ [murderer.Custom2('InsultAdjective', ROOT.Char)] ชัดๆ!\n\n"
 secrets.0510.alive.desc:0 "ข้าไม่ควรปล่อยเรื่องนี้ไปโดยไม่มีการลงโทษ ใครจะรู้ว่าจะเกิดอะไรขึ้นในครั้งต่อไป ข้าสงสัยว่าแนวทางการดำเนินการที่ดีที่สุดคืออะไร..."
 secrets.0510.dead.desc:0 "แผนการของ [murderer.GetHerHis|U] ล้มเหลวอย่างน่าสยดสยอง ข้ายังคงยืนหยัดอยู่ได้ ขณะที่ [murderer.GetSheHe] กำลังเน่าเปื่อยอยู่ในพื้นดิน!"
 secrets.0510.a.alive:0 "ข้าต้องวางแผนการเคลื่อนไหวครั้งต่อไป..."
 secrets.0510.a.dead:0 "ไปให้พ้นเสียที!"

 secrets.0511.regular.desc:0 "ด้วยนามแห่ง [ROOT.Char.GetFaith.HighGodNamePossessive]! [murderer.Custom2('MyCharacterIntroduction', ROOT.Char)|U] ได้พยายามกระทำการต่อชีวิตของ [victim.Custom2('MyCharacterIntroductionNoComma', ROOT.Char)]!"
 secrets.0511.dead.desc:0 "อย่างน้อยอสรพิษ [murderer.Custom2('InsultAdjective', ROOT.Char)] นั่นก็ตายและถูกฝังไปแล้ว!"
 secrets.0511.alive.desc:0 "เว้นแต่ข้าจะดำเนินการบางอย่าง [victim.GetFirstNameNoTooltip] อาจยังคงตกอยู่ในอันตราย"
 
 secrets.0512.regular.desc:0 "ในที่สุด ข้าก็ค้นพบความจริง! [murderer.Custom2('InsultNoun', ROOT.Char)] เลือดเย็นผู้อยู่เบื้องหลังการตายก่อนวัยอันควรของ [victim.GetFirstNamePossessive] [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('victim'))] ของข้า มิใช่ใครอื่นนอกจาก [murderer.Custom2('MyCharacterIntroductionNoComma', ROOT.Char)]!\n\n"
 secrets.0512.immured.desc:0 "ขณะที่สายลับของข้าตรวจค้น [murderer.Custom('ResidenceBuilding')] ของ [murderer.GetHerHis] อย่างละเอียด พวกเขาพบห้องที่ถูกก่ออิฐปิดตาย ซึ่งด้านหลังพบร่างของ [victim.GetFirstNamePossessiveNoTooltip]\n\n"
 secrets.0512.alive.desc:0 "โอ้ [murderer.GetSheHe] คิดว่า [murderer.GetSheHe] จะรอดพ้นจากอาชญากรรมอันเลวร้ายนี้ไปได้ แต่จำคำข้าไว้ [murderer.GetFirstNameNoTooltip] จะต้องชดใช้อย่างสาสมสำหรับบาปของ [murderer.GetHerHis]"
 secrets.0512.dead.desc:0 "แม้ว่าข้าจะดีใจที่ [murderer.GetSheHe] กำลังเน่าเปื่อยอยู่ในหลุมศพของ [murderer.GetHerHis] แต่ก็มีส่วนหนึ่งในใจข้าที่หวังว่า [murderer.GetSheHe] จะยังมีชีวิตและหายใจอยู่ต่อหน้าข้า ข้ารู้วิธีสองสามอย่างที่จะเหมาะสมกับ [murderer.GetFirstNameNoTooltip] มากกว่าการพักผ่อนชั่วนิรันดร์..."


 secrets.1001.t:0 "การค้นพบ"
 secrets.1001.opening_spymaster:0 "ในตอนท้ายของรายงานล่าสุดของ [spymaster.GetCouncilTitle] [spymaster.GetFirstNamePossessive] [spymaster.GetSheHe] หยุดชั่วครู่ "มีบางอย่างที่ท่านควรรู้เกี่ยวกับ [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('secret_holder'))] ของท่าน""
 secrets.1001.opening_no_spymaster:0 "มีข่าวลือกระซิบกระซาบเกี่ยวกับ [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('secret_holder'))] ของข้ามาสักพักแล้ว แต่ข้ายังไม่เห็นหลักฐานใดๆ จนกระทั่งบัดนี้"
 secrets.1001.sexual_habits:0 "\n\nดูเหมือนว่า [secret_holder.GetTitledFirstName] จะมีความใคร่ทางเพศที่แปลกประหลาดมาก..."
 secrets.1001.secret_relationships:0 "\n\n[secret_holder.GetTitledFirstName] และ [secret_lover.GetTitledFirstName] กำลังมีความสัมพันธ์ชู้สาวกันอย่างลับๆ!"
 secrets.1001.fallback:0 "\n\nดูเหมือนว่า [secret_holder.GetTitledFirstName] จะมีความลับมากมาย"
 secrets.1001.a:0 "ท่านว่าชื่นชอบใน [secret_holder.Custom('WomenMen')] งั้นรึ?"
 secrets.1001.b:0 "ดูเหมือนว่าข้ามิใช่คนเดียวที่ปล่อยให้แรงกระตุ้นครอบงำ"
 secrets.1001.c:0 "[secret_holder.GetSheHe] เข้าใจผิดเกี่ยวกับ 'การผสมพันธุ์สัตว์' หรือไม่?"
 secrets.1001.f:0 "[secret_holder.GetFirstNameNoTooltip] และ [secret_lover.GetFirstNameNoTooltip]? แค่คิดก็รบกวนใจข้าแล้ว!"
 secrets.1001.option_fallback:0 "หากข้าไม่รู้ว่าเป็นความจริง..."

 secrets.1012.t:0 "มิตรและชู้รัก"
 secrets.1012.close_relation:0 "เป็นการยากที่จะซ่อนความลับจากมิตรสหายที่แท้จริง และข้ารู้มานานแล้วถึงความสนใจของ [first_lover.GetTitledFirstNamePossessive] ที่มีต่อ [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('lover'))] ของข้า [lover.GetTitledFirstName]\n\nบัดนี้ข้าได้ค้นพบว่ามันเป็นมากกว่าความสนใจ คนทั้งสองกำลังมีความสัมพันธ์ชู้สาวกันอย่างลับๆ!"
 secrets.1012.desc:0 "เป็นการยากที่จะซ่อนความลับจากมิตรสหายที่แท้จริง และข้ารู้มานานแล้วว่า [first_lover.GetTitledFirstName] มีความสนใจใน [lover.GetTitledFirstName]\n\nบัดนี้ข้าได้ค้นพบว่ามันเป็นมากกว่าความสนใจ คนทั้งสองกำลังมีความสัมพันธ์ชู้สาวกันอย่างลับๆ!"
 secrets.1012.a:0 "ไม่น่าแปลกใจเลยที่ [first_lover.GetFirstNameNoTooltip] อยากจะเก็บเรื่องนี้เป็นความลับ"

 secrets.1101.t:0 "สายเลือดของเรา"
 secrets.1101.opening:0 "การเรียนรู้ความจริง ทำให้ทุกชิ้นส่วนเข้าที่"
 secrets.1101.friendly:0 "แม้เราจะมีความคล้ายคลึงกัน แต่ก็มีความแตกต่างอย่างมากระหว่างเรา และบัดนี้ข้าเข้าใจดียิ่งขึ้นว่าทำไม"
 secrets.1101.unfriendly:0 "ข้าน่าจะรู้ว่ามีความหมายเบื้องหลังความแตกต่างของเรามากกว่าแค่ความขัดแย้งที่ไม่สิ้นสุด"
 secrets.1101.end:0 "\n\n[bastard.GetTitledFirstName] มิใช่ [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('bastard'))] โดยสมบูรณ์ของข้า แต่แท้จริงแล้วคือ [bastard.Custom('GetDaughterSon')] ของ [real_father.GetTitledFirstName]!"
 secrets.1101.a:0 "ข้าแทบไม่อยากจะเชื่อ"

 secrets.1102.friendly:0 "ตอนแรกข้าไม่แน่ใจ แต่วิธีที่ [father.Char.GetSheHe] เน้นย้ำ "#EMP [ROOT.Char.Custom('SisterBrother')]#!" เมื่อทักทายข้า ทำให้มันชัดเจนดังกลางวัน"
 secrets.1102.unfriendly:0 "ตอนแรกข้าไม่แน่ใจ แต่วิธีการเยาะเย้ยที่ [father.GetSheHe] เน้นย้ำ "#EMP [ROOT.Char.Custom('SisterBrother')]#!" เมื่อ [father.GetSheHe] ทักทายข้า ทำให้มันชัดเจนดังกลางวัน"
 secrets.1102.end:0 "\n\n[father.GetTitledFirstName] รู้ว่าใครคือบิดาที่แท้จริงของข้า"
 secrets.1102.a:0 "[father.GetSheHe] จะทำอย่างไรกับความรู้นี้?"

 secrets.2002.t:0 "ไม่อาจให้อภัยได้?"
 secrets.2002.desc:0 "ข้าเกือบจะหวังว่าตนไม่เคยรู้เรื่องนี้เลย! ไม่น่าเชื่อว่า [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('secret_holder'))] ของข้า [secret_holder.GetTitledFirstName] จะสามารถสังหารผู้คนได้...\n\nแม้ แต่ [murdered_character.GetTitledFirstName] ก็ไม่สมควรได้รับจุดจบอันน่าอัปยศ เช่นนี้"
 secrets.2002.a:0 "ตำหนิ [secret_holder.GetFirstNameNoTooltip] สำหรับอาชญากรรมของ [secret_holder.GetHerHis]!"
 secrets.2002.a.tt:0 "#F [secret_holder.GetFirstNameNoTooltip] อาจสำนึกผิดก็ได้#!."
 secrets.2002.b:0 "อา เอาเถอะ การเมืองมันก็อัปลักษณ์ เช่นนี้แหละ"

 secrets.2003.desc:0 "[ROOT.Char.Custom2('RelationToMe', SCOPE.sC('close_character'))] ของข้ามาหาข้า ด้วยสีหน้าสับสนบนใบหน้าของ [close_character.GetHerHis]\n\n"ข้ารู้เรื่องที่เจ้าทำกับ [murdered_character.GetTitledFirstName]," [close_character.GetFirstName] บอกข้า "ไม่น่าเชื่อว่าเจ้าจะสามารถก่ออาชญากรรม เช่นนั้นได้... มันหลอกหลอนความคิดข้า""
 secrets.2003.a:0 "ข้าทำในสิ่งที่ข้าต้องทำ"
 secrets.2003.b:0 "ข้าเสียใจกับสิ่งที่ข้าทำ ทุกวันที่ตื่นขึ้นมา!"

 secrets.2004.desc:0 "แม้ข้าจะพูดจาแข็งกร้าว แต่ข้าก็ไม่คาดคิดว่าจะได้รับการตอบสนอง เช่นนี้จาก [secret_holder.GetTitledFirstName] เมื่อข้าเผชิญหน้ากับ [secret_holder.GetHerHim] เกี่ยวกับการตายของ [murdered_character.GetTitledFirstName]\n\n"เจ้าไม่รู้หรือว่าเรื่องนี้หลอกหลอนข้าเพียงใด?" [secret_holder.GetSheHe] ถาม "ช่างโล่งใจเหลือเกินที่ในที่สุดก็ได้บอกเล่าความเสียใจของข้าแก่ใครสักคน""
 secrets.2004.a:0 "บางที [secret_holder.GetSheHe] อาจได้รับการให้อภัย ในเวลาที่เหมาะสม"
 secrets.2004.b:0 "อา ข้าไม่เคยโกรธเจ้าได้ลงเลย [target.GetFirstNameNoTooltip]!"

 secrets.3001.t:0 "คอยดูแลข้า"
 secrets.3001.opening:0 "[ROOT.Char.Custom2('RelationToMe', SCOPE.sC('close_character'))] ของข้า [close_character.GetTitledFirstName] มาหาข้า ด้วยสีหน้ากังวลบนใบหน้าของ [close_character.GetHerHis]"
 secrets.3001.scheme_owner_known:0 "\n\n"ข้าพบหนึ่งในสายลับที่ช่วยเหลือ[known_scheme_owner.GetTitledFirstName] ในแผนการ[known_scheme_owner.GetHerHis] ต่อต้านท่านแล้ว! [agent.GetTitledFirstName] กำลังพยายามส่งรายงานให้[known_scheme_owner.GetFirstName] กลางดึก""
 secrets.3001.scheme_known:0 "\n\n"ข้าพบสายลับคนหนึ่งที่ช่วยเหลือในแผนการต่อต้านท่าน! [agent.GetTitledFirstName] กำลังพยายามส่งรายงานให้ผู้สั่งการของ [agent.GetHerHis] กลางดึก""
 secrets.3001.scheme_not_known:0 "\n\n"ข้าพบสายลับคนหนึ่งที่ช่วยเหลือในแผนการต่อต้านท่าน! [agent.GetTitledFirstName] กำลังพยายามส่งรายงานให้ผู้สั่งการของ [agent.GetHerHis] กลางดึก""
 secrets.3001.a:0 "ขอบใจท่าน [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('close_character'))]!"

 secrets.4001.t: "การโกงข้อสอบถูกเปิดโปง"
 secrets.4001.desc: "[ROOT.Char.Custom2('RelationToMe', SCOPE.sC('minister'))] ของข้า [minister.GetTitledFirstName] เข้ามาในคฤหาสน์ของข้าพร้อมทหารยามข้างกาย [minister.GetHerHis]\n\n"ข้าผิดหวังในตัวเจ้ามาก [ROOT.Char.GetFirstNameNoTooltip]! เจ้าเคยมีหน้าที่การงานที่ดี แต่มันจบลงแล้ว" [minister.GetSheHe] ฟาดมือของ [minister.GetHerHis] ลงบนโต๊ะของข้า ทิ้งเอกสารไว้ฉบับหนึ่ง "นี่คือหลักฐานที่ปฏิเสธไม่ได้ คำให้การของพยานหลายปาก ยืนยันว่าเจ้าได้โกง เพื่อให้สอบผ่าน""
 secrets.4001.a: ""ไร้สาระ! พยานบุคคลเชื่อถือไม่ได้""
 secrets.4001.b: ""ถึงอย่างนั้น ข้าก็เป็นข้ารับใช้ที่ภักดีของโอรสแห่งสวรรค์""
 secrets.4001.c: ""ตุ๊กตาดินเผากลัวฝน คำโกหกกลัวความจริง""
 exam_cheater_bribe_t: "คนโกงการสอบติดสินบน"
 exam_cheater_reimburse_t: "คนโกงการสอบชดใช้คืน"
 exam_cheater_guilty_t: "คนโกงการสอบมีความผิด"
