 msg_grandchild_born_toast_title: "หลานเกิด"
 msg_grandchild_born_toast_desc_twins: "[mother.GetTitledFirstName] ได้ให้กำเนิดหลานแฝดแก่ท่าน"
 msg_grandchild_born_toast_desc: "[mother.GetTitledFirstName] ได้ให้กำเนิดหลาน[child.Custom('GetDaughterSon')]แก่ท่าน"
 
 msg_royal_child_born_toast_title: "ทายาทราชวงศ์"
 msg_royal_child_born_toast_desc_twins: "[non_royal_parent.GetTitledFirstName] ได้ให้กำเนิดทายาทแฝดแห่ง [ceremonial_house|E] ([child.GetHouse.GetBaseName])"
 msg_royal_child_born_toast_desc: "[non_royal_parent.GetTitledFirstName] ได้ให้กำเนิด[child.Custom('GetDaughterSon')]แห่ง [ceremonial_house|E] ([child.GetHouse.GetBaseName])"
 msg_royal_child_born_toast_desc_twins_father: "[non_royal_parent.GetTitledFirstName] ได้เป็นบิดาของทายาทแฝดแห่ง [ceremonial_house|E] ([child.GetHouse.GetBaseName])"
 msg_royal_child_born_toast_desc_father: "[non_royal_parent.GetTitledFirstName] ได้เป็นบิดาของ[child.Custom('GetDaughterSon')]แห่ง [ceremonial_house|E] ([child.GetHouse.GetBaseName])"

 birth.0002.t:0 "บุตรธิดาทั้งหมดของข้า"
 birth.0002.desc:0 "ทุกครั้งที่มีการเกิด ความเป็นมิตรที่แสดงต่อข้าก็เพิ่มพูนขึ้น เมื่อข้าอุ้มทารกแรกเกิดไว้ในอ้อมแขน ข้าได้รับการต้อนรับด้วยความอบอุ่นและเมตตายิ่งกว่าครั้งใด ข้าคาดว่าข้าคงมีบุตรธิดารวมกันมากมายน่าประทับใจทีเดียว..."
 birth.0002.a:0 "ความเมตตาอันเกิดจากการถือกำเนิด!"

 birth.1001.t:0 "[child.Custom('GetDaughterSon')|U] ของข้า"
 birth.1001.heir.t:0 "[child.Custom('GetDaughterSon')|U] และทายาทของข้า"
 birth.1001.daughters.t:0 "ธิดาของข้า"
 birth.1001.sons.t:0 "บุตรของข้า"
 birth.1001.children.t:0 "ทารกน้อยของข้า"
 birth.1001.first_birth_good.desc:0 "เมื่อการบีบรัดตัวครั้งแรกเริ่มขึ้น ความสงบอันยิ่งใหญ่ก็เข้ามาสู่ข้า ไม่มีที่ว่างสำหรับความกังวลก่อนหน้านี้ — ข้ากำลังจะสร้างหนึ่งในปาฏิหาริย์อันยิ่งใหญ่ที่สุดของชีวิต หลังจากการต่อสู้อันยาวนาน แต่รุ่งโรจน์ ข้าก็ได้ให้กำเนิด"
 birth.1001.first_birth_scary.desc:0 "ข้าได้พูดคุยกับมารดาและหมอตำแยมานับไม่ถ้วน นำคำแนะนำของพวกนางมาใส่ใจ ทว่า เมื่อถึงเวลาของข้า ข้าตระหนักว่าไม่มีการเตรียมการใดจะเพียงพอได้เลย\n\nความเจ็บปวดนั้นท่วมท้นและข้ากลัวว่าชีวิตจะหาไม่ แต่ข้ารอดมาได้ และบัดนี้ข้ามี"
 birth.1001.many_births.desc:0 "ทุกครั้งที่ให้กำเนิด มันง่ายขึ้นเล็กน้อย — ทว่าข้าไม่เคยหยุดทึ่งในความเข้มข้นของประสบการณ์ และความแข็งแกร่งของตนเอง อีกครั้งหนึ่ง ข้าได้นำชีวิตใหม่มาสู่โลกนี้ ในรูปลักษณ์ของ"
 birth.1001.not_first_birth.desc:0 "ความโล่งใจของข้านั้นยิ่งใหญ่ และความปิติยินดียิ่งใหญ่กว่า! ข้าได้ให้กำเนิด"
 birth.1001.sondaughter.desc:0 "[child.Custom('GetDaughterSon')] น้อยผู้น่ารักสมบูรณ์แบบ!\n\n"
 birth.1001.daughters.desc:0 "ธิดาน้อยผู้น่ารักสมบูรณ์แบบสองคน!\n\n"
 birth.1001.sons.desc:0 "บุตรน้อยผู้น่ารักสมบูรณ์แบบสองคน!\n\n"
 birth.1001.children.desc:0 "บุตรธิดาน้อยผู้น่ารักสมบูรณ์แบบสองคน!\n\n"
 birth.1001.same_gender_heir.desc:0 "วันหนึ่ง ลูกเอ๋ย เจ้าจะสืบทอดมรดกของข้า นามใดเล่าจะคู่ควรกับ [ROOT.Char.GetTitleAsNameNoTooltip]?"
 birth.1001.other_gender_heir.desc:0 "วันหนึ่ง ลูกเอ๋ย เจ้าจะสืบทอดมรดกของข้า นามใดเล่าจะคู่ควรกับ [child.GetLadyLord] ผู้ยิ่งใหญ่ เช่นนี้?"
 birth.1001.end_fallback.desc:0 "เจ้าจะเติบโตเป็นผู้ใด ลูกข้า และข้าจะเรียกเจ้าว่ากระไรดี?"
 birth.1001.twins_heir.desc:0 "ลูกรักของข้า คนหนึ่งในพวกเจ้าจะเติบโตขึ้นเพื่อสืบทอดมรดกของข้า และอีกคนจะคงอยู่ในเงาของ [ROOT.Char.GetPlayerHeir.GetHerHis] เสมอไป ข้าหวังว่าพวกเจ้าจะรักกัน ไม่ว่าจะเกิดอะไรขึ้นก็ตาม"
 birth.1001.twins.desc:0 "พวกเจ้าจะเติบโตเป็นผู้ใด ลูกรัก และข้าจะเรียกพวกเจ้าว่ากระไรดี?"
 birth.1001.taltos.desc:0 "[child.Custom('GetBirthOmen')] ที่ [child.Custom('GetDaughterSon')] ของข้ามีติดตัวมานั้น บ่งชี้อย่างชัดเจนว่า [child.GetHerHim] คือ [child.Custom('GetTaltosTerm')] ผู้ถูกเลือกโดย [child.GetFaith.PantheonTerm] เพื่อรับใช้ภารกิจเฉพาะอย่าง แม้ข้ายังไม่ทราบว่าภารกิจนั้นคือสิ่งใด ข้าก็ยังคงต้องมอบนามอันเหมาะสมให้แก่บุตรของข้า"
 birth.1001.taltos_unfaithful.desc:0 "[child.Custom('GetDaughterSon')] ของข้ามี [child.Custom('GetBirthOmen')] ซึ่งเหล่า [child.Custom('DefaultPriestTitlePlural')] [child.GetFaith.GetAdjective] อ้างว่าบ่งชี้ว่า [child.GetHerHim] มีบางสิ่งที่พิเศษ ข้าไม่เข้าใจ แต่ข้าก็ยังคงต้องตัดสินใจเลือกนามให้ [child.Custom('GetDaughterSon')] ของข้า..."

 birth.1001.desc:0 "ข้าได้ให้กำเนิด [child.Custom('GetDaughterSon')] ผู้งดงาม!"
 birth.1001.desc.twin:0 "ข้าได้ให้กำเนิด [child.Custom('TwinDaughtersSonsChildren')] ผู้งดงาม!"
 birth.1001.desc.twin_dead_father:0 "ข้าได้ให้กำเนิด [child.Custom('TwinDaughtersSonsChildren')] ผู้งดงาม! [father.GetFirstName] คงจะรักใคร่เอ็นดูพวกเขายิ่งนัก..."
 birth.1001.desc_dead_father:0 "ข้าได้ให้กำเนิด [child.Custom('GetDaughterSon')] ผู้งดงาม! [father.GetFirstName] คงจะรักใคร่เอ็นดูเขายิ่งนัก..."
 birth.1001.a:0 "ขอให้เจ้าเติบโตแข็งแรงและเฉลียวฉลาดเถิด [child.Custom('GetDaughterSon')] ของข้า"
 birth.1001.b:0 "ขอให้พวกเจ้าเติบโตแข็งแรงและเฉลียวฉลาดเถิด [child.Custom('TwinDaughtersSonsChildren')] ของข้า"

 birth.1002.opening:0 "ข้าได้ให้กำเนิด [child.Custom('GetDaughterSon')] น้อยผู้งดงาม [child.GetSheHe|U] ถือกำเนิดมาในโลกนี้โดยไม่รู้เดียงสาถึงความลับที่ข้าต้องรักษาไว้"
 birth.1002.opening.twin:0 "ข้าได้ให้กำเนิด [child.Custom('TwinDaughtersSonsChildren')] ผู้งดงามสองคน พวกเขาถือกำเนิดมาในโลกนี้โดยไม่รู้เดียงสาถึงความลับที่ข้าต้องรักษาไว้"
 birth.1002.true_father:0 "ข้าเกรงว่าจะเกิดอะไรขึ้นหากมีผู้ใดล่วงรู้ว่า [real_father.Custom2('MyCharacterIntroductionNoComma', ROOT.Char)] คือบิดาที่แท้จริง"
 birth.1002.unmarried:0 "ว่าบิดาของ [child.GetHerHis] แท้จริงแล้วคือ [real_father.GetFullName]"
 birth.1002.unmarried.twin:0 "ว่าบิดาของพวกเขาแท้จริงแล้วคือ [real_father.GetFullName]"
 birth.1002.girl_name.desc:0 "\n\nโอ้ ลูกน้อยเอ๋ย นามของเจ้าจะเป็นกระไร?"
 birth.1002.boy_name.desc:0 "\n\nส่วนหนึ่งในใจข้าอยากตั้งนามบุตรชายตาม [real_father.GetFirstNameNoTooltip] แต่ข้าเกรงว่านั่นคงไม่เป็นการฉลาดนัก..."
 birth.1002.twin_name.desc:0 "\n\nโอ้ ลูกๆ ของข้า ข้าจะตั้งนามพวกเจ้าว่ากระไรดี?"
 birth.1002.a:0 "เงียบเสียเถิด [child.Custom('GetDaughterSon')] ของข้า"
 birth.1002.b:0 "เงียบเสียเถิด [child.Custom('TwinDaughtersSonsChildren')] ของข้า"
 birth.1002.a.tt:0 "โลกภายนอกหารู้ไม่ถึงสายเลือดที่แท้จริงของ [child.GetFirstNamePossessiveNoTooltip]"
 birth.1002.b.tt:0 "โลกภายนอกหารู้ไม่ถึงสายเลือดที่แท้จริงของพวกเขา"
 birth.1002.c:0 "ข้าสงสัยว่าบัดนี้ [real_father.GetFirstNameNoTooltip] อยู่ที่ใด..."

 birth.1003.loves_mother.desc:1 "โอ้ [mother.GetFirstName] เจ้าช่างกล้าหาญยิ่งนัก! แข็งแกร่งยิ่งนัก! ถ้อยคำใดมิอาจบรรยายความรักที่ข้ามีต่อเจ้าได้ และบัดนี้เรามี"
 birth.1003.likes_mother.desc:0 "ด้วยรอยยิ้มอันอ่อนล้า แต่เปี่ยมสุข [mother.GetFirstName] มอบให้แก่ข้า"
 birth.1003.dislikes_mother.desc:1 "สรรเสริญ [ROOT.Char.GetFaith.FertilityGodName] เถิด [mother.GetFirstNameNoTooltip] ได้ให้กำเนิด"
 birth.1003.sondaughter.desc:0 "[child.Custom('GetDaughterSon')] น้อยผู้น่ารักสมบูรณ์แบบ!\n\n"
 birth.1003.daughters.desc:0 "ธิดาน้อยผู้น่ารักสมบูรณ์แบบสองคน!\n\n"
 birth.1003.sons.desc:0 "บุตรน้อยผู้น่ารักสมบูรณ์แบบสองคน!\n\n"
 birth.1003.children.desc:0 "บุตรธิดาน้อยผู้น่ารักสมบูรณ์แบบสองคน!\n\n"
 birth.1003.a:0 "ขอให้เจ้าเติบโตแข็งแรงและเฉลียวฉลาดเถิด [child.Custom('GetDaughterSon')] ของข้า"
 birth.1003.b:0 "ขอให้เจ้าเติบโตแข็งแรงและเฉลียวฉลาด!"

 birth.1005.t:0 "ไร้บิดา"
 birth.1005.desc.twin:0 "บุตรธิดาผู้งดงามของข้ากำลังพักผ่อน โดยหารู้ไม่ถึงชีวิตอันท้าทายที่พวกเขาถือกำเนิดมา โลกไม่รู้ว่าบิดาของพวกเขาคือผู้ใด และพวกเขาเองก็อาจไม่มีวันรู้เลย"
 birth.1005.desc:0 "[child.Custom('GetDaughterSon')] ที่สวยงามของข้ากำลังพักผ่อน โดยไม่รู้ถึงชีวิตที่ท้าทายที่ [child.GetSheHe] เกิดมา โลกไม่รู้ว่าใครคือบิดา [child.GetHerHis] และ [child.GetSheHe] อาจไม่มีวันรู้ [child.GetHerselfHimself]"
 birth.1005.a:0 "นี่คือภาระที่เราต้องแบกรับ"

 birth.1006.t:0 "กำเนิดบุตรนอกกฎหมาย"
 birth.1006.opening:0 "บัดนี้ไม่มีข้อกังขาแม้ แต่น้อยในใจข้า [mother.Custom2('MyCharacterIntroduction', ROOT.Char)|U] ได้ให้กำเนิด"
 birth.1006.desc.twin:0 "ฝาแฝด และเราทั้งคู่ต่างรู้ดีว่าข้าคือบิดาของพวกเขา"
 birth.1006.desc:0 "[child.Custom('GetDaughterSon')] และเราทั้งคู่ต่างรู้ดีว่าข้าคือบิดาของ [child.GetHerHis]"
 birth.1006.not_known:0 "\n\nโชคดีที่ [spouse_of_mother.Custom2('HerHisCharacterIntroduction', SCOPE.sC('mother'))] เชื่อว่าเป็นของ [spouse_of_mother.GetHerHis]"
 birth.1006.unmarried:0 "\n\nโชคดีที่ [mother.GetFirstNameNoTooltip] ยังคงปิดปากเงียบเรื่องข้า และไม่มีผู้ใดอื่นล่วงรู้ความจริง อย่างน้อยก็ในตอนนี้..."
 birth.1006.a:0 "ข้าต้องระมัดระวังเรื่องนี้อย่างยิ่ง"
 birth.1006.a.tt:1 "ท่านเก็บความลับไว้กับตัว"
 birth.1006.a.message_desc:0 "บิดาที่แท้จริงรู้"
 birth.1006.a.mother_message:0 "[real_father.GetTitledFirstName] ได้ล่วงรู้ว่า [real_father.GetSheHe] คือบิดาที่แท้จริง"
 birth.1006.b:0 "โลกจะต้องรับรู้ถึงบุตรของข้า!"
 birth.1006.bastard_explanation:0 "ท่านได้ทราบถึงการเกิดของ [child.GetFirstName] มารดาคือ [mother.GetShortUIName] ได้รับความลับ [secret.GetName]"

 birth.1010.t:0 "บุตรแห่งราชวงศ์ของข้า"
 birth.1010.t_twins:0 "บุตรธิดาแห่งราชวงศ์ของข้า"
 birth.1010.desc.twin:0 "[mother.Custom2('MyCharacterIntroduction', ROOT.Char)|U] ได้ให้กำเนิด [child.Custom('TwinDaughtersSonsChildren')] สองคน!\n\nเนื่องจากเด็กน้อยทั้งสองเป็นส่วนหนึ่งของราชวงศ์ [ROOT.Char.GetDynasty.GetName] พวกเขาจึงควรได้รับพรด้วยนามอันเป็นมงคล"
 birth.1010.desc:0 "[mother.Custom2('MyCharacterIntroduction', ROOT.Char)|U] ได้ให้กำเนิด[child.Custom('GetDaughterSon')]!\n\nในเมื่อเจ้าตัวน้อยนี้คือผลผลิตจากตระกูล [ROOT.Char.GetDynasty.GetName] [child.GetSheHe] ควรได้รับนามอันคู่ควรแก่สายเลือดของ [child.GetHerHis]"

 birth.1100.title:0 "กำเนิด [child.Custom('GetTaltosTerm')]"
 birth.1100.message:0 "เหล่า [child.Custom('DefaultPriestTitlePlural')] ได้ระบุว่า [child.Custom2('MyCharacterIntroduction', ROOT.Char)] คือ [child.Custom('GetTaltosTerm')]\n\nผู้ถูกเลือกโดย [child.GetFaith.PantheonTerm] เพื่อจุดประสงค์อันลึกลับ อนาคตของเด็กผู้นี้จะเป็น เช่นไร?"

 known_bastard_birth_event_tooltip:0 "[child.GetFirstNameNoTooltip] จะเป็น [bastard|E] แห่งตระกูล [child.GetHouse.GetBaseName]"
 legitimized_known_bastard_birth_event_tooltip:0 "[child.GetFirstNameNoTooltip] จะเป็น [legitimized_bastard|E] แห่งตระกูล [child.GetHouse.GetBaseName]"

 birth.2001.t:0 "พรแห่งความไม่รู้"
 birth.2001.desc.mother.standard:0 "[child.Custom('GetDaughterSon')] แรกเกิดของข้านอนหลับอย่างแสนหวาน โดยไม่รู้ถึงคำสาปที่จะตามติด [child.GetHerHim] ไปตลอดชีวิต [child.GetHerHis] การเป็นลูกนอกสมรสไม่ใช่เรื่องง่ายในโลกนี้ และการเป็นมารดาของลูกนอกสมรสก็ เช่นกัน\n\nแม้ ในขณะที่ลูกน้อยของข้าหลับใหล ข้าก็ยังคงตื่นอยู่กับทางเลือกที่ข้าต้องตัดสินใจ"
 birth.2001.desc.mother.twins:0 "ทารกแรกเกิดของข้าหลับใหลอย่างอ่อนหวาน โดยหารู้ไม่ถึงคำสาปที่จะติดตามพวกเขาไปตลอดชีวิต การเป็นบุตรนอกกฎหมายไม่ใช่เรื่องง่ายในโลกนี้ และการเป็นมารดาของบุตรนอกกฎหมายก็ เช่นกัน\n\nแม้ทารกน้อยของข้าจะหลับใหล ข้ากลับต้องตื่นอยู่กับทางเลือกที่ต้องตัดสินใจ"
 birth.2001.desc.father.standard:0 "นอกสมรส [mother.GetTitledFirstName] ได้ให้กำเนิด [child.Custom('GetDaughterSon')] แก่เรา แม้ข้าควรจะปิติยินดี แต่ใจข้ากลับหนักอึ้งด้วยความกังขาและความกลัว\n\nและจะเป็น เช่นนี้ต่อไปจนกว่าข้าจะได้ตัดสินใจ"
 birth.2001.desc.father.twins:0 "นอกสมรส [mother.GetTitledFirstName] ได้ให้กำเนิดบุตรธิดาแก่เรา แม้ข้าควรจะปิติยินดี แต่ใจข้ากลับหนักอึ้งด้วยความกังขาและความกลัว\n\nและจะเป็น เช่นนี้ต่อไปจนกว่าข้าจะได้ตัดสินใจ"
 birth.2001.a.standard:0 "ข้าจะรับรอง [child.GetHerHim] ให้เป็นบุตรของข้า!"
 birth.2001.a.twins:0 "ข้าจะรับรองพวกเขาให้เป็นบุตรของข้า!"
 birth.2001.b.standard:0 "ข้าไม่อาจ ทำให้ตระกูลเสื่อมเสียเกียรติด้วยการรับรองบุตรนอกกฎหมาย..."
 birth.2001.b.no_legitimization_in_faith:0 "ถูกลิขิตให้มีชีวิตเยี่ยงบุตรนอกกฎหมาย..."
 bastard_remains_bastard_tt:0 "[child.GetShortUIName|U] ยังคงเป็น [bastard|E] ที่ไม่ได้รับการรับรอง"

 birth.2002.t:0 "พรสองเท่า"
 birth.2002.start:0 "นี่คือวันที่ควรค่าแก่การเฉลิมฉลองอย่างแท้จริง!"
 birth.2002.desc.standard:0 "ไม่เพียง แต่ข้าได้รับพรด้วย [child.Custom('GetDaughterSon')] แรกเกิด – [legitimizer.GetMotherFather] ของ [child.GetHerHis] คือ [legitimizer.GetTitledFirstName] ได้เลือกที่จะรับรอง [child.GetHerHim]!"
 birth.2002.desc.twins:0 "ไม่เพียง แต่ข้าได้รับพรด้วยฝาแฝดแรกเกิด — [legitimizer.GetMotherFather] ของพวกเขา คือ [legitimizer.GetTitledFirstName] ได้เลือกที่จะรับรองพวกเขา!"
 birth.2002.end:0 "\n\nหลายเดือนที่ผ่านมาเต็มไปด้วยความกังขาและความกลัว แต่วันนี้ใจข้ารู้สึกเบาดุจขนนก"
 birth.2002.a:0 "อนาคตยังคงมีความหวัง"

 birth.2003.t:0 "การเริ่มต้นที่ยากลำบาก"
 birth.2003.desc.standard_start:0 "ข้าปรารถนาจะเฉลิมฉลองการเกิดของ [child.Custom('GetDaughterSon')] ของเรา แต่ [legitimizer.GetTitledFirstName] ได้แสดงชัดเจนว่าทารกน้อยจะไม่ถูกนับเป็นสมาชิกที่แท้จริงของตระกูล [legitimizer.GetHerHis]"
 birth.2003.desc.twin_start:0 "ข้าปรารถนาจะเฉลิมฉลองการเกิดของบุตรธิดาของเรา แต่ [legitimizer.GetTitledFirstName] ได้แสดงชัดเจนว่าทารกน้อยทั้งสองจะไม่ถูกนับเป็นสมาชิกที่แท้จริงของตระกูล [legitimizer.GetHerHis]"
 birth.2003.desc.landed_end:0 "\n\nตราบาปของการเป็นบุตรนอกกฎหมายมิอาจลบเลือนได้หมดสิ้น แม้การยอมรับจาก [legitimizer.GetTitleTierName] คงจะช่วยได้บ้าง..."
 birth.2003.desc.unlanded_end:0 "\n\nตราบาปของการเป็นบุตรนอกกฎหมายมิอาจลบเลือนได้หมดสิ้น แม้การยอมรับจาก [legitimizer.GetLadyLord] คงจะช่วยได้บ้าง..."
 birth.2003.a:0 "ข้าหวังว่าเรื่องราวจะเป็นอื่นไปนะ [child.GetFirstNameNoTooltip] น้อยเอ๋ย!"


 birth.2004.t:0 "ความเมตตาของ [secondary_legitimizer.GetMotherFather|U]"
 birth.2004.desc.standard:0 "ปรากฏว่า [child.Custom('GetDaughterSon')] แรกเกิดของข้าอาจมีอนาคตอันดีรออยู่ก็เป็นได้ [secondary_legitimizer.GetMotherFather] ของ [child.GetHerHis|U] คือ [secondary_legitimizer.GetTitledFirstName] ได้ต้อนรับ [child.GetHerHim] เข้าสู่ตระกูล [secondary_legitimizer.GetDynastyName] แล้ว"
 birth.2004.desc.twins:0 "ปรากฏว่าทารกแรกเกิดของข้าอาจมีอนาคตอันดีรออยู่ก็เป็นได้ [secondary_legitimizer.GetMotherFather] ของพวกเขา คือ [secondary_legitimizer.GetTitledFirstName] ได้ต้อนรับพวกเขาเข้าสู่ตระกูล [secondary_legitimizer.GetDynastyName] แล้ว"
 birth.2004.a.standard:0 "จง ทำให้พวกเขาภูมิใจเถิด [child.Custom('GetDaughterSon')] ของข้า"
 birth.2004.a.twins:0 "จง ทำให้พวกเขาภูมิใจเถิด ลูกๆ ของข้า"

 birth.2011.t:0 "[child.Custom('GetDaughterSon')] ของข้า"
 birth.2011.desc:0 "แม้จะปฏิสนธินอกพันธะการสมรส [child.Custom('GetDaughterSon')] แรกเกิดของข้าก็ได้ถือกำเนิดมาในโลกนี้อย่างปลอดภัย\n\n[child.GetSheHe|U] เกิดในตระกูล [legitimizer.GetHouse.GetBaseName] และ [child.GetSheHe] จะถูกเลี้ยงดูในฐานะนั้น"


 birth.2102.t:0 "ทายาทของ [real_father.GetTitledFirstNamePossessiveNoTooltip|U]"
 birth.2102.desc:0 "[ROOT.Char.Custom2('RelationToMe', SCOPE.sC('mother'))] ของข้า [mother.GetTitledFirstName] ได้ให้กำเนิดบุตรที่เกิดจากชายอื่น บัดนี้ [mother.GetSheHe] กำลังให้นม [child.Custom('GetDaughterSon')] ของ [real_father.GetTitledFirstNamePossessive] พวกเขาเรียก [child.GetHerHim] ว่า [child.GetFirstName]"
 birth.2102.desc.twin:1 "[ROOT.Char.Custom2('RelationToMe', SCOPE.sC('mother'))] ของข้า [mother.GetTitledFirstName] ได้ให้กำเนิด [child.Custom('TwinDaughtersSonsChildren')] ของ [real_father.GetTitledFirstNamePossessive] พวกเขาเรียกขานว่า [child.GetFirstName] และ [child_2.GetFirstName]"
 birth.2102.a:0 "ข้าควรจะทำ เช่นไรกับเรื่องนี้?"

 birth.2104.t:0 "เด็กประหลาด"
 birth.2104.desc:0 "[ROOT.Char.Custom2('RelationToMe', SCOPE.sC('real_father'))] ของข้า [real_father.GetTitledFirstName] ได้มีบุตรกับ [mother.GetTitledFirstName] บัดนี้ [mother.GetFirstName] กำลังให้นมทายาทของ [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('real_father'))] ของข้า"
 birth.2104.desc.twin:0 "[ROOT.Char.Custom2('RelationToMe', SCOPE.sC('real_father'))] ของข้า [real_father.GetTitledFirstName] ได้มีบุตรธิดากับ [mother.GetTitledFirstName] บัดนี้ [mother.GetFirstName] กำลังให้นมทายาทของ [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('real_father'))] ของข้า"
 birth.2104.a:0 "ข้าควรจะทำ เช่นไรกับเรื่องนี้?"

 every_child_adult_non_bastard:0 "บุตรธิดาที่บรรลุนิติภาวะและไม่ใช่บุตรนอกกฎหมายทั้งหมดของข้า"

 birth.3001.t:0 "โอบอุ้มโดยความตาย"
 birth.3001.desc_other_child:0 ""เบ่งอีกเฮือกเดียว [ROOT.Char.Custom('FormOfAddressForLiege')]! ทารกใกล้คลอดแล้ว!" เสียงกรีดร้องหลุดจากริมฝีปากข้าขณะที่ข้าเบ่งสุดแรงเป็นครั้งสุดท้าย ความเจ็บปวดอยู่ทุกหนแห่ง มากเกินไป ท่วมท้น — และแล้ว มันก็จบลง ข้า... ข้าทำได้\n\n"[dummy_gender.GetSheHe] ปลอดภัยดีหรือไม่?" ข้าแทบจำเสียงตัวเองไม่ได้ "[dummy_gender.GetSheHe]... เป็น[dummy_gender.Custom('GirlBoy')]หรือ?"\n\nหมอตำแยไม่ตอบข้า ไม่แม้ แต่จะมองข้า ไม่เลย นางมองเพียงทารกที่ไม่ไหวติงในอ้อมแขนของนางเท่านั้น"
 birth.3001.a:1 "ไม่... เหตุใด [dummy_gender.GetSheHe] จึงไม่หายใจ?! #EMP ทำอะไรสักอย่างสิ!#!"
 birth.3001.a.tt:1 "@death_icon! [dummy_gender.Custom('DaughterSon')] ของท่านตายคลอด"

 birth.3002.desc:0 "เมื่อ [ROOT.Char.Custom('GetDoor')] ของ [ROOT.Char.Custom('GetChamber')] ทำคลอดเปิดออก ข้ามิได้รับการต้อนรับด้วยรอยยิ้มของเหล่าหมอตำแยและเสียงร้องของทารก แต่เป็นเสียงร่ำไห้อันแสนปวดใจของ [mother.GetTitledFirstNamePossessive]\n\n"ข้าเสียใจอย่างสุดซึ้ง [ROOT.Char.Custom('FormOfAddressForLiege')]" หมอตำแยไม่สบตาข้า ในอ้อมแขนของนางมีห่อผ้าเล็ก ๆ "[dummy_gender.Custom('DaughterSon')]ของท่าน... [dummy_gender.GetSheHe|U] ไปสู่ [ROOT.Char.GetFaith.PositiveAfterLife] แล้ว""
 birth.3002.a:0 "[dummy_gender.Custom('DaughterSon')] ของข้า? ใน... ใน [ROOT.Char.GetFaith.PositiveAfterLife] หรือ?"

 birth.3011.desc_twin:0 "ฝาแฝดช่างสมบูรณ์แบบ ใบหน้าเล็กๆ ของพวกเขา กลิ่นกาย... ข้าอยากอยู่ในชั่วขณะนี้ตลอดไป แต่หมอตำแยให้ข้าอุ้มพวกเขาเพียงไม่กี่ลมหายใจ ข้าพยายามคัดค้านเมื่อนางนำพวกเขาไปจากข้า แต่แขนข้าอ่อนแรงและข้าพยายามหาคำพูด\n\n"อย่ากังวลไปเลยเพคะ ท่าน [ROOT.Char.GetTitleAsNameNoTooltip] [child.Custom('TwinDaughtersSonsChildren')] ของท่านแข็งแรงและสุขภาพดี บัดนี้ท่านคือผู้ที่เราห่วงใย"\n\n"
 birth.3011.desc:0 "[child.Custom('DaughterSon')] ของข้าสมบูรณ์แบบ ใบหน้าเล็กๆ [child.GetHerHis|U] กลิ่น [child.GetSheHe]... ข้าอยากอยู่ในช่วงเวลานี้ตลอดไป แต่หมอตำแยให้ข้าอุ้ม [child.GetHerHim] เพียงไม่กี่ลมหายใจ ข้าพยายามคัดค้านเมื่อนางเอา [child.GetHerHim] ไปจากข้า แต่แขนของข้าอ่อนแรงและข้าพยายามหาคำพูด\n\n"อย่ากังวลไปเลย [ROOT.Char.GetTitleAsNameNoTooltip] ของข้า [child.Custom('DaughterSon')] ของท่านแข็งแรงและมีสุขภาพดี ท่านคือสิ่งที่เรากังวลตอนนี้"\n\n"
 birth.3011.adventurer: "ขณะที่ข้าเอนกายลงบนเตียง โลกก็มืดมนลง..."
 birth.3011.landed: "ขณะที่เหล่านางกำนัลของข้าวิ่งวุ่นไปมาอย่างร้อนรน โลกก็มืดมนลง..."
 birth.3011.twin.a:1 "ได้โปรด... นามของพวกเขา..."
 birth.3011.a:0 "ได้โปรด... นามของ [child.GetHerHis|U]..."

 birth.3012.start.desc:0 "เมื่อหมอตำแยเดินออกจาก [ROOT.Char.Custom('GetChamber')] ทำคลอดในที่สุด พร้อมห่อผ้าที่ร้องไห้เบา ๆ ในอ้อมแขน ความโล่งใจก็ท่วมท้นข้า\n\nแล้วข้าก็เห็นสีหน้าของนาง\n\n"ข้าเสียใจ [ROOT.Char.Custom('FormOfAddressForLiege')] [mother.GetLadyLord|U] [mother.GetFirstNameNoTooltip]..." นางพูดไม่ออก แต่น้ำเสียงของนางบอกทุกสิ่ง\n\nหนึ่งชีวิตได้ดับสูญไป แต่"
 birth.3012.desc_twin:0 "สองชีวิตใหม่เพิ่งเริ่มต้น ข้าต้องเข้มแข็งเพื่อ [child.Custom('TwinDaughtersSonsChildren')] ของข้า"
 birth.3012.desc:0 "ชีวิตใหม่เพิ่งเริ่มต้น ข้าต้องเข้มแข็งเพื่อ [child.Custom('DaughterSon')] ของข้า"
 birth.3012.a:0 "ช่างเป็นการเริ่มต้นที่น่าเศร้าสลด..."

 birth.3021.desc:0 "เสียงหายใจหอบของข้าเป็นเสียงเดียวที่แทรกผ่านความเงียบใน [ROOT.Char.Custom('GetChamber')] คลอด ข้ามองหาใน [ROOT.Char.Custom('GetRoom')] เพื่อหารอยยิ้มให้กำลังใจ สิ่งใดก็ได้ที่จะช่วยให้ข้าผ่านความเจ็บปวดไปได้ สิ่งเดียวที่ข้าเห็นคือความกลัวของข้าเองสะท้อนกลับมา\n\nเมื่อเด็กคลอดออกมาในที่สุด เสียงร้องที่รอคอยกลับเงียบหาย "เหตุใด [dummy_gender.GetSheHe] จึงไม่ร้อง?" ถ้อยคำรู้สึกหนักอึ้งในปากข้า ทุกสิ่งรู้สึกหนักอึ้ง\n\nข้าบังคับริมฝีปากให้เอ่ยคำพูดอีกครั้ง"
 birth.3021.a:0 "เหตุใด... คือ... [dummy_gender.GetSheHe]..."


 birth.3022.desc:0 "ขณะที่ข้ารออยู่ด้านนอก [ROOT.Char.Custom('GetChamber')] ทำคลอด แต่ละนาทีรู้สึกราวกับชั่วชีวิต เสียงกรีดร้องของ [mother.GetFirstNamePossessive] เงียบไปแล้ว โดยไม่มีเสียงร้องของทารกมาแทนที่ มีบางอย่างผิดปกติ ข้ารู้สึกได้ถึงกระดูก\n\n[ROOT.Char.Custom('GetDoor')] เปิดออก สีหน้าอันเลวร้ายของหมอตำแยยืนยันความกลัวทั้งหมดของข้า\n\n"ข้าเสียใจอย่างสุดซึ้ง [ROOT.Char.Custom('FormOfAddressForLiege')] [mother.GetLadyLord|U] [mother.GetFirstNameNoTooltip]... [dummy_gender.Custom('DaughterSon')]ของท่าน... ทั้งสองไปสู่ [ROOT.Char.GetFaith.PositiveAfterLife] แล้ว""
 birth.3022.a:1 "เหตุใดกัน?! [ROOT.Char.GetFaith.FertilityGodName|U] ข้าทำสิ่งใดไปจึงต้องเผชิญชะตากรรม เช่นนี้?"
 birth.3022.a.buddhism:0 "เราทำสิ่งใดไปจึงต้องเผชิญชะตากรรม เช่นนี้?!"

 birth.3031.t:0 "โอบอุ้มโดยความเจ็บป่วย"
 birth.3031.start.desc:0 "ทารกทุกคนร้องไห้ แต่กับ [child.GetFirstName] น้อย น้ำตาไม่มีที่สิ้นสุด ข้าต้องการอย่างยิ่งให้หมอตำแยคลายความกังวลของข้า แต่คิ้วที่ขมวดของนางกลับ ทำให้ทุกอย่างแย่ลง\n\n"
 birth.3031.princessprince.desc:0 ""[child.GetLadyLord] น้อย"
 birth.3031.daughterson.desc:0 ""[child.Custom('DaughterSon')] ของท่าน"
 birth.3031.end.desc:0 "มีน้ำหนักตัวไม่เพิ่มขึ้นเท่าที่ [child.GetSheHe] ควรจะเป็น พวกเราจะดูแล [child.GetHerHim] อย่างดีที่สุด [ROOT.Char.Custom('FormOfAddressForLiege')] แต่ท้ายที่สุดแล้ว ชีวิตของ [child.GetHerHis] อยู่ในหัตถ์ของ [ROOT.Char.GetFaith.FateGodNamePossessive]""
 birth.3031.a:0 "เงียบเสียเถิด [child.GetFirstNameNoTooltip]! ได้โปรดอย่าร้องไห้เลย!"

 birth.3034.t:0 "เติบโตแข็งแรง"
 birth.3034.desc:0 "เด็กคนอื่นๆ ส่วนใหญ่แข็งแรงกว่าข้า เวลาเราเล่นกัน ข้าต้องนั่งพักบ่อยๆ แต่วันนี้ ตอนที่เราวิ่งแข่งกันไปที่คอกม้า ข้าชนะ!"
 birth.3034.a:0 "[ROOT.Char.Custom('child_favorite_toy')] ของข้าอยู่ที่ไหน? มาเล่นกันเถอะ!"

 birth.3035.desc:0 "ความอ่อนแอที่รบกวน [child.Custom('GetDaughterSon')] ของข้าตั้งแต่ [child.GetHerHis] เกิด ในที่สุดก็ได้คลายไปจาก [child.GetHerHim] แล้ว! ความโล่งใจท่วมท้นข้าเมื่อเห็น [child.GetFirstName] วิ่งเล่นกับเด็กคนอื่นๆ"
 birth.3035.a:0 "ขอให้เจ้าเติบโตแข็งแรงเถิด [child.GetFirstNameNoTooltip]"

 birth.3041.t:0 "อ่อนล้า"
 birth.3041.start.desc:0 "เป็นเวลาหลายสัปดาห์แล้วที่ข้าให้กำเนิด"
 birth.3041.desc_twins:0 "[child.Custom('TwinDaughtersSonsChildren')],"
 birth.3041.one_child.desc:0 "[child.GetFirstNameNoTooltip] น้อย,"
 birth.3041.end:0 "ทว่าข้ายังคงต้องนอนอยู่บนเตียง เมื่อวันเวลาผ่านไปโดยอาการไม่ดีขึ้นเท่าใดนัก ความปิติยินดีของข้าก็ถูกกลืนกินด้วยความอ่อนล้าอย่างสาหัส"
 birth.3041.a:0 "บัดนี้เรี่ยวแรงของข้าควรจะกลับคืนมาแล้วมิใช่หรือ?"

 birth.9002.t:0 "นามนั้นสำคัญไฉน?"
 birth.9002.start.desc:0 "ขณะที่ทารกน้อยอยู่ในอ้อมแขนของ [suggester.GetHerHis]"
 birth.9002.worrying.desc:0 "[suggester.GetTitledFirstName] เงยหน้ามองข้าด้วยแววตากังวล [suggester.GetHerHis]"
 birth.9002.tears.desc:0 "[suggester.GetTitledFirstName] เช็ดน้ำตาจากแก้มของ [suggester.GetHerHis] และเอ่ยกับข้าโดยไม่ละสายตาจาก [child.Custom('GetDaughterSon')] ของเรา"
 birth.9002.pride.desc:0 "[suggester.GetTitledFirstName] เงยหน้ามองข้า เชิดหน้าขึ้นและดวงตาเปล่งประกายด้วยความภาคภูมิใจ"
 birth.9002.conviction.desc:0 "[suggester.GetTitledFirstName] เงยหน้ามองข้า ดวงตาของ [suggester.GetHerHis] เปล่งประกายด้วยความเชื่อมั่นอันแรงกล้า"
 birth.9002.surprisingly_calm.desc:0 "[suggester.GetTitledFirstName] เงยหน้ามองข้า ใบหน้าของ [suggester.GetHerHis] สงบนิ่งอย่างน่าประหลาดใจ"
 birth.9002.calm.desc:0 "[suggester.GetTitledFirstName] เงยหน้ามองข้า ใบหน้าของ [suggester.GetHerHis] คือภาพแห่งความสงบ"
 birth.9002.devotion.desc:0 "สายตาของ [suggester.GetTitledFirstNamePossessive] สบกับข้า ดวงตาของ [suggester.GetHerHis|U] เปี่ยมด้วยความรักและความภักดี"
 newline.desc:0 "\n\n"
 birth.9002.love.desc:0 ""ที่รัก,"
 birth.9002.dear_spouse.desc:0 ""[ROOT.Char.GetWifeHusband|U] ที่รักยิ่ง,"
 birth.9002.spouse.desc:0 ""[ROOT.Char.GetWifeHusband|U],"
 birth.9002.suggester_relative.desc:0 "เราจะตั้งนาม [child.GetHerHim] ว่า [namesake.GetFirstNameNoTooltip] ตาม [suggester.Custom2('RelationToMeShort', SCOPE.sC('namesake'))] ผู้ [namesake.Custom('ComplimentAdjective')] ของข้าได้หรือไม่?""
 birth.9002.namer_relative.desc:0 "บางทีเราควรตั้งนาม [child.GetHerHim] ว่า [namesake.GetFirstNameNoTooltip]? ตาม [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('namesake'))] ผู้ [namesake.Custom('ComplimentAdjective')] ของท่าน?""
 birth.9002.suggesters_name.desc:0 "ข้าคิดว่าเราควรตั้งนาม [child.GetHerHim] ว่า [suggester.GetFirstNameNoTooltip] ตามข้า ท่านว่าอย่างไร?""
 birth.9002.namers_name.desc:0 "ให้เราตั้งนาม [child.GetHerHim] ว่า [ROOT.Char.GetFirstNameNoTooltip] ตามท่านเถิด""
 birth.9002.nice_name.desc:0 "ข้าคิดดูแล้ว ข้าอยากให้เราตั้งนาม [child.GetHerHim] ว่า [namesake.GetFirstNameNoTooltip] ข้าชอบนามนี้เสมอมา""
 birth.9002.religious_god.desc:0 "เราควรตั้งนาม [child.GetHerHim] ว่า [SCOPE.GetFlagName('name_suggestion')] เพื่อเป็นเกียรติแด่เทพเจ้าผู้ยิ่งใหญ่!""
 birth.9002.religious_godess.desc:0 "เราควรตั้งนาม [child.GetHerHim] ว่า [SCOPE.GetFlagName('name_suggestion')] เพื่อเป็นเกียรติแด่เทพีผู้ยิ่งใหญ่!""
 birth.9002.religious_apostle.desc:0 "เราควรตั้งนาม [child.GetHerHim] ว่า [SCOPE.GetFlagName('name_suggestion')] เพื่อเป็นเกียรติแด่อัครสาวกผู้เปี่ยมศรัทธา""
 birth.9002.religious_holy_virgin.desc:0 "เราควรตั้งนาม [child.GetHerHim] ว่า [SCOPE.GetFlagName('name_suggestion')] เพื่อเป็นเกียรติแด่พรหมจารีอันศักดิ์สิทธิ์""
 birth.9002.religious_fallback.desc:0 "เราควรตั้งนาม [child.GetHerHim] ตาม [SCOPE.GetFlagName('name_suggestion')] ผู้รุ่งโรจน์!""
 birth.9002.lunatic.desc:0 "ข้ามีความคิดเยี่ยมที่สุด! เราควรตั้งนาม [child.GetHerHim] ว่า [SCOPE.GetFlagName('name_suggestion')]! [child.GetSheHe] ดูไม่เหมือน [SCOPE.GetFlagName('name_suggestion')] น้อยหรือ?""
 birth.9002.creator.desc:0 "ให้เราตั้งนามทารกน้อยของเราว่า [SCOPE.GetFlagName('name_suggestion')] เพื่อเป็นเกียรติแด่พระผู้สร้างของเรา!""
 birth.9002.possessed.desc:0 "ข้าสัมผัสได้ถึงการมีอยู่ของ [child.GetHerHis|U] [child.GetSheHe|U] เรียกร้องให้เราตั้งนาม [child.Custom('DaughterSon')] ของเราว่า [SCOPE.GetFlagName('name_suggestion')]""

 birth.9002.a1:0 "เป็นความคิดที่ดี [namesake.GetFirstNameNoTooltip] ก็แล้วกัน"
 birth.9002.a2:0 "เป็นความคิดที่ดี [SCOPE.GetFlagName('name_suggestion')] ก็แล้วกัน"
 birth.9002.a.tt.1:0 "เราตั้งนามบุตรของเราว่า [namesake.GetFirstNameNoTooltip]"
 birth.9002.a.tt.2:0 "เราตั้งนามบุตรของเราว่า [SCOPE.GetFlagName('name_suggestion')]"
 birth.9002.a.rename: "[SCOPE.GetFlagName('name_suggestion')]"
 birth.9002.b1:0 "อันที่จริง ข้าคิดชื่ออื่นไว้ในใจแล้ว..."
 birth.9002.b2:0 "อะไรนะ?! นั่นเป็นความคิดที่แย่มาก!"
 birth.9002.b.tt:1 "ท่านจะตั้งนาม [child.GetHerHim] ที่เหมาะสมกว่านี้"

 birth.9003.desc:0 "ข้าค่อยๆ อุ้มทารกน้อยจากอ้อมแขนของ [suggester.GetTitledFirstNamePossessive] และมองเข้าไปในดวงตาน้อยๆ อันสมบูรณ์แบบของ [child.GetHerHis] เจ้าจะเติบโตเป็นผู้ใด?"
 birth.9003.a:0 "ดีขึ้นมาก"

 birth.9004.t:0 "นามนั้นสำคัญไฉน?"
 birth.9004.desc.me:0 "[ROOT.Char.GetFirstNameNoTooltip]\n\nช่างเป็นนามที่จืดชืด ข้าคิด เช่นนั้นบางครั้ง พลางใคร่ครวญว่านักประวัติศาสตร์ในอนาคตจะอ่านมันอย่างไร\n\nทว่าข้าคือ [ROOT.Char.GetTitleAsNameNoTooltip] และหากข้าปรารถนาจะถูกเรียกขานต่างออกไป แน่นอนว่าข้าเพียงต้องแจ้งให้โลกรับรู้?"
 birth.9004.desc:0 "[child.GetFirstNameNoTooltip]\n\nทีแรกข้าก็ชอบนามนี้อยู่ แต่บัดนี้มันฟังดูแปลกหูเสียแล้ว [child.GetSheHe] จะคิดอย่างไรกับนามของ [child.GetHerHis] เมื่อเติบใหญ่?\n\nบางทีข้าควรเปลี่ยนเป็นนามที่ดีกว่านี้?"
 birth.9004.a:0 "อา นามที่ดีกว่า #EMP มาก#!"
 birth.9004.b:0 "เมื่อคิดดูอีกที ข้าว่า [ROOT.Char.GetFirstNameNoTooltip] ก็ดีอยู่แล้ว..."
 birth.9004.b.other:0 "อันที่จริง [child.GetFirstNameNoTooltip] ก็ค่อนข้างดีทีเดียว..."
 birth.9004.b.tt:0 "ท่านใช้นามเดิมของท่าน"
 birth.9004.b.tt.other:0 "[child.GetFirstNameNoTooltip] ใช้นามเดิมของ [child.GetHerHis]"
