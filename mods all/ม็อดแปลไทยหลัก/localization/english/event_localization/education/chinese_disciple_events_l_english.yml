  # Event 0021 - Mentor's Evaluation
  chinese_students.0021.t: "การตัดสินของเทพพยากรณ์"
  chinese_students.0021.desc: "[ROOT.Char.Custom2('RelationToMe',SCOPE.sC('divination_student'))] ของข้า [divination_student.GetShortUIName] ออกมาจากห้องทำนาย จิตใจสับสนอลหม่านจากผลกระทบของคำไขแห่งอี้จิง\n\n\"[divination_student.Custom2('RelationToMe',ROOT.Char)|U] มันได้ถูกแสดงแก่ข้าว่า"

  chinese_students.0021.desc.heaven.success: "เส้นทึบทั้งหกเผยพลังสร้างสรรค์อันบริสุทธิ์ของเฉียน เฉก เช่นสวรรค์โอบอุ้มทุกสิ่งเบื้องล่าง ดังนั้นผู้ปกครองจึงต้องรวบรวมความแข็งแกร่งที่ขัดเกลาด้วยปัญญา\""
  chinese_students.0021.desc.heaven.failure: "เส้นทึบทั้งหกหมายถึงพลังอันไร้ขีดจำกัด! จักรพรรดิควรปกครองด้วยกำปั้นเหล็ก บดขยี้ผู้ต่อต้านทั้งหมดดัง เช่นสวรรค์บดขยี้ผู้ท้าทาย!\""
  chinese_students.0021.desc.thunder.success: "การกระทำที่เด็ดขาดในเวลาที่เหมาะสมนำมา ซึ่งความสำเร็จ สอดคล้องกับสัญลักษณ์เจิ้น ดุจดั่งอัสนีปลุกชีวิตที่หลับใหลในฤดูใบไม้ผลิ ภาวะผู้นำที่แท้จริงย่อมเป็นแรงบันดาลใจให้ผู้อื่นลงมือทำ\""
  chinese_students.0021.desc.thunder.failure: "ดังอัสนีฟาดฟันรวดเร็วและดังสนั่น เราต้อง ทำให้ทุกคนตัวสั่น! ความลังเลคือความอ่อนแอ และเทพพยากรณ์ต้องการกำลังในทันที!\""
  chinese_students.0021.desc.water.success: "ดั่งสายน้ำไหลผ่านสิ่งกีดขวาง ข่าน สอนเราว่าปัญญาที่แท้จริงอยู่ในการตระหนักถึงอันตรายและค้นหาเส้นทางที่มีแรงต้านทานน้อยที่สุด\""
  chinese_students.0021.desc.water.failure: "ดั่งสายน้ำทำลายทุกสิ่งที่ขวางหน้า เราควรเอาชนะศัตรูของเราดั่งอุทกภัย จมดิ่งทุกการต่อต้าน!\""
  chinese_students.0021.desc.mountain.success: "ความนิ่งสงบนำมา ซึ่งความกระจ่างแจ้ง ด้วยการรักษาจิตใจให้สงบและร่างกายหยุดพัก เกิ้น เผยให้เห็นเส้นทางที่แท้จริงเบื้องหน้าโดยปราศจากสิ่งรบกวน\""
  chinese_students.0021.desc.mountain.failure: "ภูผาบดขยี้ผู้อยู่เบื้องล่าง! ดังนั้นเราควรไม่เคลื่อนไหวและดื้อรั้น ปฏิเสธที่จะยอมแพ้ไม่ว่าจะเกิดอะไรขึ้น!\""
  chinese_students.0021.desc.wind.success: "ความอุตสาหะอันอ่อนโยนเอาชนะความแข็งแกร่งที่ตายตัว ดั่งสายลมที่ปั้น แต่งภูมิทัศน์เมื่อเวลาผ่านไป อิทธิพลอันละเอียดอ่อนของซวิ่น บรรลุสิ่งที่กำลังดุร้ายทำไม่ได้\""
  chinese_students.0021.desc.wind.failure: "ดั่งพายุ เราสามารถกลบเสียงผู้ต่อต้านด้วยการพูดให้มากขึ้นและดังขึ้น! เพื่อชนะการโต้วาทีเพื่ออนาคต [ROOT.Char.GetTopLiege.GetPrimaryTitle.GetAdjectiveNoTooltip] เราต้องเป็นผู้ที่พูดอย่างทรงพลังที่สุด!\""

  chinese_students.0021.positive_heaven.best: "ความเข้าใจในระเบียบแห่งสวรรค์ของ [divination_student.GetHerHis|U] แสดงถึงปัญญาในการปกครองที่แท้จริง!"
  chinese_students.0021.positive_heaven.worst: "แม้จะลำบาก แต่ความทุ่มเทต่อความเป็นผู้นำของ [divination_student.GetHerHis] ก็น่าประทับใจ"
  chinese_students.0021.positive_thunder.best: "[divination_student.GetSheHe|U] เข้าใจธรรมชาติของการกระทำที่เด็ดขาดอย่างถ่องแท้!"
  chinese_students.0021.positive_thunder.worst: "ความกล้าหาญของ [divination_student.GetHerHis|U] ในการเผชิญหน้ากับความท้าทายของอัสนีนั้นน่าชื่นชม"
  chinese_students.0021.positive_water.best: "การอ่านของ [divination_student.GetHerHis|U] ไหลลื่นไปกับการปรับตัวอย่างเป็นธรรมชาติ!"
  chinese_students.0021.positive_water.worst: "ความเพียรพยายามของ [divination_student.GetHerHis|U] ต่อความลี้ลับของวารีนั้นน่าชมเชย"
  chinese_students.0021.positive_mountain.best: "ความนิ่งสงบของ [divination_student.GetHerHis|U] เผยให้เห็นข้อมูลเชิงลึกอันลึกซึ้ง!"
  chinese_students.0021.positive_mountain.worst: "การศึกษาภูผาอย่างจริงจังของ [divination_student.GetHerHis|U] สมควรได้รับการยอมรับ"
  chinese_students.0021.positive_wind.best: "[divination_student.GetSheHe|U] จับอิทธิพลอันละเอียดอ่อนของสายลมได้อย่างสมบูรณ์แบบ!"
  chinese_students.0021.positive_wind.worst: "ปัญญาของ [divination_student.GetHerHis|U] แสดงให้เห็นในความเข้าใจเรื่องอิทธิพล"

  chinese_students.0021.negative_heaven: "[divination_student.GetSheHe|U] ขาดความลึกซึ้งในหลักการปกครองของสวรรค์"
  chinese_students.0021.negative_thunder: "พลังแห่งการตัดสินใจของอัสนีเล็ดลอด [divination_student.GetHerHim] ไป จงกระทำด้วยความมุ่งมั่น"
  chinese_students.0021.negative_water: "ความยืดหยุ่นเล็ดลอด [divination_student.GetHerHim] ไป จำเป็นอย่างยิ่งต่อปัญญา"
  chinese_students.0021.negative_mountain: "จิตวิญญาณของ [divination_student.GetHerHis|U] ขาดความนิ่งสงบ จงแสวงหาการไตร่ตรอง"
