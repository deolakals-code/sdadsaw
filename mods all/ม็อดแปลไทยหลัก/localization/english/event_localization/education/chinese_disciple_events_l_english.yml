l_english: 

  # Event 0002 - Rivalry During Teaching
  chinese_students.0002.t:0 "ขาดวินัย"
  chinese_students.0002.desc:0 ""[ROOT.Char.Custom('TeachingsAccordingToMovement')]."\n\nข้าหยุด เพื่อให้ถ้อยคำซึมซับ แต่ [second_student.GetName] ก็ฉวยโอกาสนี้ ด้วยการเหลือบมองอย่างมีจริตไปยัง [first_student.GetName] [second_student.GetSheHe] ก็กระแอมในลำคอของ[second_student.GetHerHis] "[ROOT.Char.Custom('TeachingResponsesAccordingToMovement')]" [second_student.GetSheHe] ตอบกลับ\n\nสองคนนี้ไม่ลงรอยกันมาตลอดสัปดาห์แล้ว"

  # Options for Event 0002
  chinese_students.0002.a:0 "การแข่งขันที่เป็นประโยชน์ก็ไม่ผิดอะไร!"
  chinese_students.0002.a.tooltip:0 "ศิษย์ทั้งสองจะได้รับบารมี กลายเป็นการแข่งขันกันมากขึ้น และชื่นชมการชี้แนะของท่าน ท่านอาจได้รับความเครียดขึ้นอยู่กับอุปนิสัยของท่าน"

  chinese_students.0002.b:0 "การได้รับความโปรดปรานจากตระกูล [most_renowned_student.GetHouse.GetNameNoTooltip] อาจเป็นประโยชน์"
  chinese_students.0002.b.tooltip:0 "ศิษย์จากราชวงศ์ที่มีชื่อเสียงที่สุดจะได้รับบารมีและความชื่นชม ( เช่นเดียวกับประมุขราชวงศ์ของพวกเขา) ส่วนอีกคนจะขุ่นเคืองในความลำเอียงของท่าน"

  chinese_students.0002.c:0 "[underdog.GetShortUINameNoTooltip] ต้องเรียนรู้สถานะของ[underdog.GetHerHis]"
  chinese_students.0002.c.tooltip:0 "ผู้ที่เป็นรองจะสูญเสียบารมีและได้รับความเครียด ในขณะที่ผู้ที่เหนือกว่าจะได้รับบารมี ผู้ที่เป็นรองจะขุ่นเคืองในความเข้มงวดของท่าน"

  chinese_students.0002.d:0 "[overdog.GetShortUINameNoTooltip] ควรรู้ดีกว่านี้!"
  chinese_students.0002.d.tooltip:0 "ผู้ที่เหนือกว่าจะสูญเสียบารมีและได้รับความเครียด ในขณะที่ผู้ที่เป็นรองจะได้รับบารมี ผู้ที่เหนือกว่าจะขุ่นเคืองในความเข้มงวดของท่าน"

  chinese_students.0002.e:0 "ทั้งคู่สมควรได้รับบทเรียนเรื่องความถ่อมตน"
  chinese_students.0002.e.tooltip:0 "ศิษย์ทั้งสองจะถูกตำหนิ ทำให้เกิดความเครียดและความขุ่นเคือง ท่านจะได้รับความเครียดบ้างจากการหยุดชะงัก แต่ก็จะได้รับบารมีบ้างจากการบังคับใช้วินัย"

  # Event 0003 - After the Rivalry Lesson
  chinese_students.0003.t: "$chinese_students.0002.t$"

  # Dynamic descriptions
  chinese_students.0003.desc.intro: ""[mentor.Custom('TeachingsAccordingToMovement')]."\n\nขณะที่ [ROOT.Char.Custom2('RelationToMe',SCOPE.sC('mentor'))] ของข้า [mentor.GetTitledFirstName] ถ่ายทอดปัญญา [ROOT.Char.Custom2('RelationToMe',SCOPE.sC('second_student'))] ของข้า [second_student.GetTitledFirstName] ก็กระแอมในลำคอของ[second_student.GetHerHis] และตอบกลับว่า "[ROOT.Char.Custom('TeachingResponsesAccordingToMovement')]" พลางเหลือบมองมาที่ข้า\n\n"

  chinese_students.0003.desc.encourage_both: "[ROOT.Char.Custom2('RelationToMe',SCOPE.sC('mentor'))] ของเรากระตุ้นการแข่งขัน บัดนี้การแข่งขันจะเข้มข้นขึ้นในทุกบทเรียน"
  chinese_students.0003.desc.punish_both: "[ROOT.Char.Custom2('RelationToMe',SCOPE.sC('mentor'))] ของเราตำหนิเราทั้งคู่อย่างเผ็ดร้อน"
  chinese_students.0003.desc.favor: "[ROOT.Char.Custom2('RelationToMe',SCOPE.sC('mentor'))] ของเราพูดตัดบท [second_student.GetHerHim] และสอนต่อเพียงแค่จ้องเขม็งไปในทิศทางของ[second_student.GetHerHis]"
  chinese_students.0003.desc.disfavor: "[ROOT.Char.Custom2('RelationToMe',SCOPE.sC('mentor'))] ของเรารับฟัง [second_student.GetHerHim] อย่างเมตตาและขมวดคิ้วมาทางข้าชั่วขณะ ข้ารู้สึกอับอายจนหูร้อนผ่าว"

  # Options for Event 0003
  chinese_students.0003.a: "ข้าจะพิสูจน์ให้ [second_student.GetTitledFirstNameNoTooltip] เห็นว่าคิดผิด!"
  chinese_students.0003.b: "ไม่สำคัญนัก ความสงบคือจุดแข็งของข้า"
  chinese_students.0003.c: "ให้ทุกคนรู้ว่าข้าเป็นฝ่ายชนะ!"
  chinese_students.0003.d: "ชัยชนะเรียกร้องความถ่อมตน"
  chinese_students.0003.e: "ข้าจะแก้แค้นให้จงได้!"
  chinese_students.0003.f: "ข้าจะเรียนรู้จากความล้มเหลวครั้งนี้"

  # Opinion Modifiers
  opinion_mentor_appreciation:0 "ชื่นชมการชี้แนะของอาจารย์"
  opinion_mentor_favoritism_positive:0 "ชื่นชมที่ได้รับความโปรดปราน"
  opinion_mentor_favoritism_negative:0 "ขุ่นเคืองความลำเอียง"
  opinion_mentor_strict_negative:0 "ขุ่นเคืองความเข้มงวดของอาจารย์"

  TeachingsAccordingToMovementProHegemon_Teaching: "แกนหมุนแห่งสวรรค์ แม้มองไม่เห็น แต่ก็ขับเคลื่อนทุกสิ่งใต้หล้า เมื่อคุณธรรมตั้งมั่นณศูนย์กลางแห่งอาณาจักร ความสามัคคีก็บังเกิด"
  TeachingsAccordingToMovementExpansion_Teaching: "เมื่อตลิ่งพังทลาย อาจมีเพียงไม่กี่คนที่ล้มตาย แต่กลับหล่อเลี้ยงผืนนาใหม่เพื่อผู้คนมากมาย ฉันใดก็ฉันนั้น ความยิ่งใหญ่เผยตัวในความกล้าที่จะโอบรับดินแดนไกลโพ้น"
  TeachingsAccordingToMovementAdvancement_Teaching: "การดูแลสวนภายในกำแพงเติมเต็มอากาศด้วยกลิ่นหอมที่ดึงดูดผู้อื่นเข้ามาใกล้ ความแข็งแกร่งและเกียรติยศที่แท้จริงเติบโตจากรากที่หยั่งลึกในดินที่ได้รับการพรวนอย่างดีเท่านั้น"
  TeachingsAccordingToMovementConservative_Teaching: "แม้จะเงียบสงัดในโถงแห่งบรรพชน แต่จงฟังให้ดี แล้วท่านจะได้ยินเสียงสะท้อนอันยั่งยืนที่จะนำทางทุกย่างก้าว จงให้เกียรติเส้นทางที่เหยียบย่ำมา ซึ่งนำเรามาสู่ช่วงเวลานี้"
  TeachingsAccordingToMovementUndecided_Teaching: "เมื่อลมเปลี่ยนทิศ ผู้มีปัญญาย่อมนำใบเรือเพื่อรับพลังของมัน การร่ายรำของการยับยั้งชั่งใจและความทะเยอทะยาน ประเพณีและการเปลี่ยนแปลง การแสวงหาความสมดุลชั่วนิรันดร์ ควรสถิตนำทางท่านทั้งในการปกครองและชีวิต"
  TeachingsAccordingToMovementFallback_Teaching: "แม้ตะเกียงโดดเดี่ยวก็ขจัดความมืดมิดได้ ปัญญามิจำเป็นต้องมีธงนำทาง"

  TeachingsAccordingToMovementProHegemon_Response: "มีผู้ที่สรรเสริญแกนกลางเสียงดัง จนลืมหน้าที่ของตนในฐานะซี่ล้อที่จะยึดวงล้อไว้ด้วยกัน"
  TeachingsAccordingToMovementExpansion_Response: "ข้าเคยเห็นบางคนมุ่งมั่นกับผืนนาใหม่ จนละเลยการรักษาสันติสุขในสวนของตนเอง"
  TeachingsAccordingToMovementAdvancement_Response: "บ้างก็ไล่ตามบุปผาไกลโพ้นและเรียกมันว่าเกียรติยศ ทว่าลืมเลือนผลไม้ที่ค้ำจุนบ้านของตนเอง"
  TeachingsAccordingToMovementConservative_Response: "ข้าเกรงว่าผู้ที่ยึดติดกับอดีตมากเกินไปจะไม่สามารถไถพรวนดินแดนใหม่ได้ แม้ว่าผืนนาเก่าจะรกร้างก็ตาม"
  TeachingsAccordingToMovementUndecided_Response: "น่าเศร้า ข้าเฝ้ามองหลายคนสรรเสริญความสมดุลเพื่อเป็นข้ออ้างในการนิ่งเฉย ขณะที่โลกหมุนผ่านพวกเขาไป"
  TeachingsAccordingToMovementFallback_Response: "มีบางคนที่บินว่อนจากตะเกียงหนึ่งไปยังอีกตะเกียงหนึ่ง ดุจแมลงเม่าที่ถูกดึงดูดเข้าหาเปลวไฟทุกดวง"

  # A Test of Wisdom: The Blank Scroll
  chinese_students.0010.t: "ม้วนคัมภีร์เปล่า"
  chinese_students.0010.desc: "[ROOT.Char.Custom2('RelationToMe',SCOPE.sC('mentor'))] ของข้า [mentor.GetTitledFirstName] เข้ามาหาข้า ถือม้วนคัมภีร์อันวิจิตรไว้ในมือของ [mentor.GetHerHis] มันบริสุทธิ์และยังมิแตะต้องหมึก เผยให้เห็นผืนผ้าใบว่างเปล่าแห่งความเป็นไปได้\n\n"ม้วนคัมภีร์เปล่านี้คือบททดสอบปัญญาและอุปนิสัยของเจ้า" [mentor.GetSheHe] กล่าวอย่างเคร่งขรึม "สิ่งที่เจ้าเขียนลงไปสะท้อนถึงจิตวิญญาณของเจ้า จงเลือกถ้อยคำอย่างระมัดระวัง ศิษย์ผู้อ่อนเยาว์"\n\n[mentor.GetSheHe|U] ทิ้งข้าไว้กับพู่กัน หมึก และความคิดของข้าเท่านั้น"

  # Strong areas - Safe choices
  chinese_students.0010.a.strength: "โอกาสในการปฏิรูปกฎหมายที่ล้าสมัยของอาณาจักร!"
  chinese_students.0010.b.strength: "บทกวีถึง [ROOT.Char.Custom2('RelationToMe',SCOPE.sC('beloved'))] ของข้า เปี่ยมไปด้วยการพาดพิงและการเล่นคำ!"
  chinese_students.0010.c.strength.china: "เพียงโอรสแห่งสวรรค์ [ROOT.Char.GetTopLiege.GetHerHim]self เท่านั้นที่คู่ควรแก่ฝีพู่กันของข้า!"
  chinese_students.0010.c.strength.other: "เพียง [ROOT.Char.GetTopLiege.GetShortUINameNoTooltip] เท่านั้นที่คู่ควรแก่ฝีพู่กันของข้า!"
  chinese_students.0010.d.strength: "ปรัชญาหลั่งไหลจากจิตใจของข้าสู่ม้วนคัมภีร์นี้อย่างเป็นธรรมชาติ!"
  chinese_students.0010.e.strength: "กลยุทธ์ทางการทหารคือสิ่งที่พรสวรรค์ของข้าฉายแสงเจิดจ้าที่สุด!"
  
  # Weak areas - Growth opportunities
  chinese_students.0010.a.weakness: "แม้ว่าการออกกฎหมายจะท้าทายข้า แต่ข้าต้องลองพยายามดู..."
  chinese_students.0010.b.weakness: "แม้ถ้อยคำจะเงอะงะ แต่ข้าจะแสดงความรู้สึกที่มีต่อ [ROOT.Char.Custom2('RelationToMe',SCOPE.sC('beloved'))] ของข้า..."
  chinese_students.0010.c.weakness.china: "ข้าจะพยายามเขียนบทกวีสดุดีแด่องค์โอรสแห่งสวรรค์..."
  chinese_students.0010.c.weakness.other: "ข้าจะพยายามเขียนบทกวีสดุดีแด่ [ROOT.Char.GetTopLiege.GetShortUINameNoTooltip]..."
  chinese_students.0010.d.weakness: "ปรัชญาทดสอบขีดจำกัดของข้า แต่บทความนี้อาจขยายจิตใจของข้า..."
  chinese_students.0010.e.weakness: "การสงคราม ทำให้ข้าสับสน แต่กองทัพ [ROOT.Char.GetTopLiege.GetPrimaryTitle.GetAdjectiveNoTooltip] ต้องการแนวคิดใหม่ๆ..."

  chinese_students.0010.f: "สัจธรรมอันลึกซึ้งที่สุดอยู่ในถ้อยคำที่มิได้เอื้อนเอ่ย"
  chinese_students.0010.tt: "#weak ความพยายามจะถูกตัดสิน...#!"

  chinese_students.0010.law.success.tt: "ข้าอาจได้รับ [GetModifier('wrote_law_modifier').GetNameWithTooltip]"
  chinese_students.0010.poem.success.tt: "ข้าอาจได้รับ [GetModifier('wrote_poem_loved_one_modifier').GetNameWithTooltip]"
  chinese_students.0010.ode.success.tt: "ข้าอาจได้รับ [GetModifier('wrote_ode_to_liege_modifier').GetNameWithTooltip]"
  chinese_students.0010.treatise.success.tt: "ข้าอาจได้รับ [GetModifier('wrote_philosophical_treatise_modifier').GetNameWithTooltip]"
  chinese_students.0010.stratagem.success.tt: "ข้าอาจได้รับ [GetModifier('wrote_strategy_scroll_modifier').GetNameWithTooltip]"
  chinese_students.0010.blank.success.tt: "ข้าอาจได้รับ [GetModifier('left_scroll_blank_modifier').GetNameWithTooltip]"

  chinese_students.0010.failure.tt: "ข้าอาจได้รับประสบการณ์อันล้ำค่า"

  chinese_students.0010.success: "งานเขียนคุณภาพสูง"
  chinese_students.0010.failure: "งานเขียนต่ำกว่ามาตรฐาน"
  chinese_students.0010.success_blank: "อาจารย์เข้าใจวิสัยทัศน์ของท่าน"
  chinese_students.0010.failure_blank: "วิสัยทัศน์ของท่านคลุมเครือเกินไป"

  # Mentor evaluates the student's scroll
  chinese_students.0011.t: "ช่วงเวลาแห่งการเรียนรู้"
  chinese_students.0011.desc.intro: "ศิษย์ของข้า [scroll_student.GetShortUIName] ปรากฏตัวที่หน้าประตู ถือม้วนคัมภีร์ที่เขียนด้วยลายมืออันงดงามอย่างนอบน้อม [scroll_student.GetSheHe|U] ยื่นมันให้ด้วยมือสั่นเทา กังวลต่อคำตัดสินของข้า\n\nข้าคลี่มันออกอย่างระมัดระวังเพื่อตรวจสอบสิ่งที่ [scroll_student.GetSheHe] เลือกที่จะเขียน ปรากฏว่าเป็น "

  chinese_students.0011.desc.law: "ข้อเสนอกฎหมายใหม่ เกี่ยวกับรายละเอียดปลีกย่อยของการปกครองที่ดี"
  chinese_students.0011.desc.love_letter: "จดหมายรักถึง [beloved.GetShortUIName] เปี่ยมไปด้วยความรู้สึกอันอ่อนโยน"
  chinese_students.0011.desc.emperor_ode: "บทกวีสดุดีถึงความรุ่งโรจน์ของ [ROOT.Char.GetTopLiege.GetShortUIName] สรรเสริญคุณธรรมมากมายของ [ROOT.Char.GetTopLiege.GetHerHis]"
  chinese_students.0011.desc.treatise: "บทความเกี่ยวกับปรัชญา สำรวจความสัมพันธ์ระหว่างห้าธาตุและสี่เสาหลัก"
  chinese_students.0011.desc.strategy: "บทความเกี่ยวกับกลยุทธ์ทางการทหาร เสนอกลยุทธ์นอกกรอบจำนวนหนึ่งที่สามารถใช้ในการทัพของกองทัพ [scroll_student.GetTopLiege.GetPrimaryTitle.GetAdjectiveNoTooltip]"
  chinese_students.0011.desc.blank: "ว่างเปล่าโดยสิ้นเชิง!"
  chinese_students.0011.desc.conclusion: "\n\nมันพิสูจน์ให้เห็นหน้าต่างที่เปิดเผยจิตใจและอุปนิสัยของ [scroll_student.GetHerHis]"

  chinese_students.0011.desc.quality_success: "คุณภาพของผลงานนี้คู่ควรแก่การจัดแสดงในห้องสมุด [scroll_student.GetTopLiege.GetCapitalLocation.GetNameNoTooltip]!"
  chinese_students.0011.desc.quality_failure: "น่าเสียดาย แม้ว่า [scroll_student.GetHerHis] จะพยายามอย่างมาก แต่มัน... ก็ไม่ดีนัก"
  chinese_students.0011.desc.quality_success.blank: "ช่างเป็นทางเลือกที่น่าสนใจและลึกซึ้งยิ่งนัก!"
  chinese_students.0011.desc.quality_failure.blank: "[scroll_student.GetSheHe] คิดอะไรอยู่กันแน่?!"
  chinese_students.0011.self_improvement: "พอรับได้ แต่ข้าเชื่อว่า [scroll_student.GetSheHe] ทำได้ดีกว่านี้"
  
  # Dynamic positive evaluation descriptions by scroll type
  chinese_students.0011.positive_law: "กฎหมายนี้แสดงถึงความเข้าใจและปัญญาอันน่าทึ่ง"
  chinese_students.0011.positive_love: "ถ้อยคำช่างอ่อนโยน! อารมณ์นั้นจริงแท้และน่าประทับใจ"
  chinese_students.0011.positive_emperor: "เครื่องบรรณาการอันคมคาย คู่ควรแด่องค์โอรสแห่งสวรรค์"
  chinese_students.0011.positive_philosophy: "ข้อมูลเชิงลึกทางปรัชญาเหล่านี้เผยให้เห็นสติปัญญาอันลึกซึ้ง"
  chinese_students.0011.positive_strategy: "กลยุทธ์เหล่านี้แสดงถึงจิตใจเชิงยุทธวิธีที่มีแวว"
  chinese_students.0011.positive_blank: "ยอดเยี่ยม! ปัญญาที่แท้จริงที่สุดมิอาจพบได้ในถ้อยคำที่เขียนไว้"
  
  chinese_students.0011.positive_law.worst: "ความเข้าใจในเรื่องกฎหมายของ [scroll_student.GetHerHis|U] พัฒนาขึ้นทุกวัน!"
  chinese_students.0011.positive_love.worst: "[scroll_student.GetSheHe|U] กำลังเรียนรู้ศิลปะอันวิจิตรของการเล่นคำที่ยั่วยวน ข้าเห็นนะ!"
  chinese_students.0011.positive_emperor.worst: "[scroll_student.GetSheHe|U] แสดงพรสวรรค์ที่ไม่คาดคิดในศิลปะแห่งการแสดงความเคารพ!"
  chinese_students.0011.positive_philosophy.worst: "ความเข้าใจแนวคิดทางปรัชญาของ [scroll_student.GetHerHis|U] ก้าวหน้าอย่างรวดเร็ว!"
  chinese_students.0011.positive_strategy.worst: "[scroll_student.GetSheHe|U] แสดงความกระจ่างแจ้งที่เพิ่งค้นพบในเรื่องการทหาร!"

  # Dynamic negative evaluation descriptions by scroll type
  chinese_students.0011.negative_law: "ความพยายามในการปกครองที่หยาบเขิน [scroll_student.GetSheHe|U] ยังต้องเรียนรู้อีกมาก"
  chinese_students.0011.negative_love: "ความรู้สึกซ้ำซากที่ห่อหุ้มด้วยภาษาสวยหรู น่าผิดหวังจริง"
  chinese_students.0011.negative_emperor: "คำสอพลอที่กลวงเปล่าเผยให้เห็นจิตใจที่ตื้นเขิน"
  chinese_students.0011.negative_philosophy: "[scroll_student.GetSheHe|U] เพียงแค่พูดตามความคิดของผู้อื่นโดยปราศจากความเข้าใจ"
  chinese_students.0011.negative_strategy: "[scroll_student.GetSheHe|U] ทำให้ [ROOT.Char.GetTopLiege.GetPrimaryTitle.GetDefinitiveNameNoTooltip] ตกอยู่ในความเสี่ยง เพียงเพื่อก้าวไปข้างหน้า"
  chinese_students.0011.negative_blank: "มีสาระมากพอๆ กับในจิตใจของ [scroll_student.GetHerHis]"

