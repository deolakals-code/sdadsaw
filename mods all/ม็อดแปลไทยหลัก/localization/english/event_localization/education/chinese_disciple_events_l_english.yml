  # I Ching Divination Events (0020/0021)
  chinese_students.0020.t: "ปรึกษามรรคา"
  chinese_students.0020.desc: "[ROOT.Char.Custom2('RelationToMe',SCOPE.sC('mentor'))] ของข้า [mentor.GetTitledFirstName] แผ่ก้านอี้เจาโบราณต่อหน้าเรา พื้นผิวที่ผุกร่อนของมันจับแสงเทียนที่ริบหรี่ "คำพยากรณ์มีความรู้อนันต์ ศิษย์ผู้อ่อนเยาว์" [mentor.GetSheHe] กล่าวอย่างเคารพ "แต่มันจะพูดกับผู้ที่เข้าหาด้วยทักษะและความจริงใจเท่านั้น เจ้าอ่านอะไรได้จากพวกมันบ้าง?"\n\nสัญลักษณ์อี้จิงของ "

  chinese_students.0020.desc.heaven: "[Glossary('สวรรค์','I_CHING_HEAVEN_GLOSS')]"
  chinese_students.0020.desc.thunder: "[Glossary('สายฟ้า','I_CHING_THUNDER_GLOSS')]"
  chinese_students.0020.desc.water: "[Glossary('น้ำ','I_CHING_WATER_GLOSS')]"
  chinese_students.0020.desc.mountain: "[Glossary('ภูเขา','I_CHING_MOUNTAIN_GLOSS')]"
  chinese_students.0020.desc.wind: "[Glossary('สายลม','I_CHING_WIND_GLOSS')]"

  comma_space: "-"
  comma_space_and: "-"

  chinese_students.0020.desc.conclusion: "ปรากฏขึ้นอย่างชัดเจนต่อหน้าข้าขณะที่ [mentor.GetSheHe] พูด ข้ารู้สึกว่าพวกมันกำลังรอคอยอย่างอดทนให้ข้าเปิดเผยรูปแบบแห่งจักรวาลที่นำทางโลก"

  chinese_students.0020.a.strength: "สวรรค์แสดงทางให้ข้าเสมอ!"
  chinese_students.0020.a.weakness: "บางทีความลี้ลับของสวรรค์อาจไม่รอดพ้นข้าในวันนี้..."
  chinese_students.0020.b.strength: "อัสนีคืออาณาเขตของข้า!"
  chinese_students.0020.b.weakness: "นี่อาจเป็นชั่วขณะที่ข้าจะเข้าถึงพลังแห่งอัสนี..."
  chinese_students.0020.c.strength: "วารีสะท้อนความเข้าใจของข้าอย่างสมบูรณ์แบบ!"
  chinese_students.0020.c.weakness: "ปัญญาแห่งวารีนั้นเข้าใจยาก เช่นเดียวกับธรรมชาติของมัน..."
  chinese_students.0020.d.strength: "ข้าปีนป่ายภูผามาหลายครั้งแล้ว!"
  chinese_students.0020.d.weakness: "ภูผาตั้งตระหง่านหนักอึ้งในใจข้า..."
  chinese_students.0020.e.strength: "สายลมเป็นที่รู้จักของข้า!"
  chinese_students.0020.e.weakness: "ความละเอียดอ่อนของสายลม ทำให้ข้าสับสน..."

  I_CHING_HEAVEN_GLOSS: "สัญลักษณ์แห่งสวรรค์ หมายถึงระเบียบแห่งสวรรค์ การปกครอง และความเป็นผู้นำ มันรวบรวมหลักการของอำนาจและโครงสร้าง นำทางผู้ที่พยายามปกครองด้วยปัญญาและคุณธรรม"
  I_CHING_THUNDER_GLOSS: "สัญลักษณ์แห่งอัสนี เป็นสัญลักษณ์ของพลัง อำนาจ และความสามารถในการบังคับใช้เจตจำนงของตน มันสอนถึงความสำคัญของความแข็งแกร่งและความเด็ดขาดเมื่อเผชิญกับความทุกข์ยาก"
  I_CHING_WATER_GLOSS: "สัญลักษณ์แห่งวารี เป็นสัญลักษณ์ของการปรับตัว การไหลลื่น และความสามารถในการฝ่าฟันความท้าทายของชีวิต มันสอนถึงความสำคัญของความยืดหยุ่นและความอดทนเมื่อเผชิญกับความทุกข์ยาก"
  I_CHING_MOUNTAIN_GLOSS: "สัญลักษณ์แห่งภูผา เป็นสัญลักษณ์ของความมั่นคง ความแข็งแกร่ง และความสามารถในการอดทนต่อความยากลำบาก มันสอนถึงความสำคัญของความพากเพียรและความทรหดอดทนเมื่อเผชิญกับความทุกข์ยาก"
  I_CHING_WIND_GLOSS: "สัญลักษณ์แห่งสายลม เป็นสัญลักษณ์ของการเปลี่ยนแปลง ความยืดหยุ่น และความสามารถในการปรับตัวให้เข้ากับสถานการณ์ใหม่ๆ มันสอนถึงความสำคัญของการปรับตัวและความอดทนเมื่อเผชิญกับความทุกข์ยาก"

