l_english: 
 south_asia.0001.t:0 "ศักราชใหม่"
 south_asia.0001.desc:0 "ฝูงชนโห่ร้องพระนามของข้าพเจ้าขณะที่ข้าพเจ้าชำระล้างร่างกายในสายน้ำแห่งน้ำพุสวรรค์ ข้าพเจ้าผงาดขึ้นในฐานะจักรวรรติ ผู้ปกครองโดยชอบธรรมและเปี่ยมเมตตาแห่งโลกทั้งใบ\n\nเหล่า [ROOT.Char.GetFaith.AltPriestTermPlural] ของข้าพเจ้าบอกข้าพเจ้าว่าถึงเวลาแล้วที่โลกจะได้รับการนำทางด้วยแสงสว่างของข้าพเจ้า แต่ข้าพเจ้าไม่ต้องการคำรับรองจากพวกเขา ขณะที่ข้าพเจ้าทอดสายตามองข้ามที่ราบ ข้าพเจ้ารู้สึกได้ในจิตวิญญาณ"
 south_asia.0001.a:0 "โลกเอ่ยขานนามของข้าพเจ้า"

 south_asia.0002.t:0 "จักรวรรติ"
 south_asia.0002.intro:0 "ฝูงชนเดินทางมาเป็นเวลาหลายวัน หรือแม้กระทั่งหลายสัปดาห์เพื่อเข้าร่วมพิธี ชีวิตทั้งชีวิตของ [chakravarti.GetTitledFirstNamePossessive] ได้นำมาสู่ช่วงเวลานี้"
 south_asia.0002.text:0 "\n\nข้าพเจ้าเฝ้ามองด้วยความเงียบงันขณะที่ [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('chakravarti'))] ของข้าพเจ้าปรากฏกายขึ้นจากน้ำพุศักดิ์สิทธิ์ เหล่า [chakravarti.GetFaith.AltPriestTermPlural] ของ [chakravarti.GetHerHis|U] ประกาศให้ [chakravarti.GetHerHim] เป็นจักรวรรติ [chakravarti.GetLadyLord] ผู้เปี่ยมเมตตาของเรา\n\nบัดนี้ไม่มีผู้ใดสามารถโต้แย้งได้ว่า [chakravarti.GetSheHe] คือผู้ปกครองโดยชอบธรรมแห่งโลกทั้งใบ"
 south_asia.0002.a:0 "ข้าพเจ้ารู้สึกเป็นเกียรติที่ได้เป็นประจักษ์พยานในช่วงเวลานี้"
 south_asia.0002.b:0 "ขอให้ข้าพเจ้าได้หมอบกายลงแทบพระบาทด้วยความปิติยินดี!"

 south_asia.0003.text:0 "\n\nเป็นเพียงเมื่อ [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('chakravarti'))] ของข้าพเจ้าปรากฏกายขึ้นจากน้ำพุศักดิ์สิทธิ์เท่านั้นที่พลังอำนาจเต็มเปี่ยมแห่งช่วงเวลานั้นกระทบใจข้าพเจ้า เหล่า [chakravarti.GetFaith.AltPriestTermPlural] ของ [chakravarti.GetHerHis|U] ประกาศให้ [chakravarti.GetHerHim] เป็นจักรวรรติ ผู้ปกครองโดยชอบธรรมแห่งโลกทั้งใบ\n\nขณะที่ [chakravarti.GetTitledFirstName] ทอดสายตามองเหนือที่ราบเบื้องล่าง ข้าพเจ้าอดไม่ได้ที่จะรู้สึกว่ามันเป็นความจริง"
 south_asia.0003.a:0 "ขอให้ข้าพเจ้าได้ร่วมในชัยชนะของพระองค์ด้วยเถิด เจ้าเหนือหัวของข้าพเจ้า!"
 south_asia.0003.b:0 "สิ่งใดต่อไปสำหรับผู้ปกครองแห่งโลก?"

 south_asia.0004.relevant_religion:0 "ผู้แจ้งข่าวเดินทางมาเป็นกลุ่มใหญ่เพื่อนำข่าวสารจากจักรวรรดิอินเดีย เป็นครั้งแรกในยุคสมัยที่จักรวรรติได้ถือกำเนิดขึ้น"
 south_asia.0004.desc:0 "ผู้แจ้งข่าวเดินทางมาเป็นจำนวนมากจากดินแดนอินเดีย ประกาศการถือกำเนิดของ "จักรวรรติ" ของพวกเขา พรรณนาถึงความเมตตาของ [chakravarti.GetHerHis] อย่างกระตือรือร้น"
 south_asia.0004.text:0 "\n\nด้วยพิธีกรรมอันยิ่งใหญ่และฝูงชนผู้ศรัทธาแทบพระบาท[chakravarti.GetHerHis] [chakravarti.GetTitledFirstName] ได้ทรงรับเอาฐานะของผู้ปกครองโดยชอบธรรมแห่งโลกทั้งใบ"
 south_asia.0004.a:0 "[chakravarti.GetSheHe] จะเป็นภัยคุกคามใหม่ หรือพันธมิตรผู้ยิ่งใหญ่?"
 south_asia.0004.b:0 "ปล่อยให้ [ROOT.Char.Custom('GetDerogatoryNonbelieverPlural')] พวกนั้นเก็บข้อกล่าวอ้างอันน่าหัวเราะของพวกมันไว้เถิด!"

 south_asia.0011.t:0 "สายน้ำศักดิ์สิทธิ์"
 south_asia.0011.desc:0 "ตลอดทั้งวัน ตั้งแต่รุ่งอรุณจนถึงพลบค่ำ ข้าพเจ้ายืนอยู่ในแม่น้ำที่ไหลเชี่ยวระดับเอว รองน้ำไว้ในมือ ข้าพเจ้าชูน้ำขึ้นสู่ท้องฟ้า ก่อนจะปล่อยให้มันไหลลงมา ครั้งแล้วครั้งเล่า\n\nข้าพเจ้าตัวสั่นเมื่อกลับขึ้นสู่พื้นดินแห้ง ที่ ซึ่งข้าพเจ้าได้รับการต้อนรับจากเหล่า [ROOT.Char.GetFaith.PriestNeuterPlural] ผู้ใต้บังคับบัญชา ข้าพเจ้าได้สาบานว่าจะปกป้องไม่เพียง แต่น้ำที่ไหลผ่านมือข้าพเจ้าในวันนี้ แต่ รวมถึงแม่น้ำทั้งสาย และผ่านทางนั้น คือความเป็นนิรันดร์ของการดำรงอยู่"
 south_asia.0011.a:0 "ไม่มีผู้ใดสามารถสงสัยในความทุ่มเทของข้าพเจ้าต่อ [ROOT.Char.GetFaith.HighGodName] ได้"

 south_asia.0012.desc:0 "ด้วยการควบคุมตลอดทั้งสายของแม่น้ำคงคา [ruler_of_ganges.GetTitledFirstName] ได้อ้างสิทธิ์ในการพิทักษ์ทางจิตวิญญาณเหนือน้ำศักดิ์สิทธิ์ของมัน เป็นอำนาจที่ไม่เคยมีมาก่อนสำหรับผู้ใดที่จะอ้างสิทธิ์ แต่เหล่า [ruler_of_ganges.GetFaith.PriestNeuterPlural] ได้ประกาศว่าเป็นความจริง"
 south_asia.0012.a.like:0 "ดูเหมือนว่าความเป็นนิรันดร์จะมีผู้พิทักษ์คนใหม่"
 south_asia.0012.a.dislike:0 "ราวกับว่าจะมีใครเคารพนักฉวยโอกาส เช่น [ruler_of_ganges.GetHerHim]!"

 south_asia.0013.t:0 "จุดมุ่งหมายอันศักดิ์สิทธิ์ของข้าพเจ้าถูกช่วงชิง"
 south_asia.0013.desc:0 "ด้วยการสูญเสียดินแดนของข้าพเจ้า อำนาจของข้าพเจ้าเหนือแม่น้ำคงคาจึงไม่เป็นที่เคารพอีกต่อไปโดยประชาชนและเหล่า [ROOT.Char.GetFaith.PriestNeuterPlural] แห่งอาณาจักรของข้าพเจ้า! แทนที่ [ruler_of_ganges.GetTitledFirstName] ได้อ้างสิทธิ์ในตำแหน่งที่ข้าพเจ้าเคยบัญชาการในฐานะผู้ดูแลแม่น้ำศักดิ์สิทธิ์"
 south_asia.0013.a:0 "เจ้าคนกำเริบเสิบสานนั่นเป็นเพียงนักต้มตุ๋น!"

 south_asia.0021.t:0 "[founder.GetTitleAsNameNoTooltip] แห่ง $k_bene_israel$"
 south_asia.0021.desc:0 "ถูกบังคับให้ใช้ชีวิตเร่ร่อนและอาศัยอยู่ในวงล้อมเล็กๆ ทั่วโลก ชาวยิวขาดบ้านที่จะเรียกเป็นของตนเอง ดูเหมือนว่าศตวรรษแห่งการพเนจรจะสิ้นสุดลงในที่สุด\n\n[founder.GetNameNoTooltip] ได้รับการสวมมงกุฎเป็น [founder.GetTitleAsNameNoTooltip] แห่ง $k_bene_israel$ แม้ไม่น่าเป็นไปได้ ดูเหมือนว่าชาวยิวได้พบบ้านของพวกเขาตามแนวชายฝั่งตะวันตกของอินเดีย ด้วยการฟื้นฟู [founder.GetFaith.ReligiousHeadTitleName] และการประกาศอิสราเอลใหม่ [founder.GetTitledFirstNameNoTooltip] เชื่อว่า [founder.GetHerselfHimself] กำลังนำพาสู่ยุคทองใหม่สำหรับผู้ติดตามศาสนายูดายทั่วโลก"
 south_asia.0021.a:0 "บ้านใหม่สำหรับเรา!"
 south_asia.0021.b:0 "มีเพียงอิสราเอลเดียวเท่านั้น!"
 south_asia.0021.c:0 "ช่างเป็นการสวมมงกุฎที่ไม่น่าเป็นไปได้"
 
 
 south_asia.0030.t:0 "การเผยแผ่ศรัทธาเถรวาท"
 south_asia.0030.desc:0 "แม้ว่าเราจะเป็นหนึ่งในฐานที่มั่นสุดท้ายของคำสอนเถรวาท ขุนนางของเรายังคงนับถือศรัทธาอย่างกระตือรือร้น อย่างไรก็ตาม สามัญชนยังคงรักษาความภาคภูมิใจอย่างแรงกล้าในวิถีดั้งเดิมของพวกเขา และการบูชาเทพเจ้านัตอันมุ่งร้ายของพวกเขายังคงแพร่หลาย\n\nผู้ปกครองที่รอบคอบอาจพบว่าเป็นการฉลาดที่จะประนีประนอมเมื่อต้องจัดการกับเรื่อง เช่นนี้ แต่บางทีแนวทางที่เข้มงวดกว่าอาจจำเป็น..."
 south_asia.0030.a:0 "ชาวนาที่คิดอะไรง่ายๆ เหล่านี้จำเป็นต้องถูกควบคุม!"
 south_asia.0030.b:0 "พวกเขายินดีที่จะบูชาเทพเจ้าเก่าแก่ของพวกเขา ภายในขอบเขตที่เหมาะสม"
 south_asia.0030.c:0 "ข้าจะจัดการเรื่องนี้ทีหลัง"
 south_asia.0030.a.tt:0 "เคาน์ตีทั้งหมดในภูมิภาคพม่า"
 south_asia.0030.a.ari.tt:0 "ข้าหลวงอารีทั้งหมด"
 south_asia.0030.b.theravada.tt:0 "ข้าหลวงเถรวาททั้งหมด"

 south_asia.0031.t:0 "สถานการณ์ทางศาสนาบานปลาย"
 south_asia.0031.desc:0 "การเป็นผู้บุกรุกทางวัฒนธรรมเป็นเรื่องหนึ่ง การยืนยันอำนาจนำทางศาสนาเป็นอีกเรื่องหนึ่ง สามัญชนโกรธแค้น และไม่มีการขาดแคลนเสียงพึมพำเยาะเย้ยเมื่อเอ่ยชื่อท่านในหมู่ผู้ที่ยึดถือประเพณีดั้งเดิมในราชสำนัก [ari_vassal.GetTitledFirstName] ก็เป็นหนึ่งในนั้น\n\nมือของข้าพเจ้ายังคงสามารถเปิดออกในฐานะผู้สร้างสันติ หรือกำแน่นเป็นหมัดของผู้ปกครองที่ไม่ให้อภัย หรือยิ่งไปกว่านั้น ข้าพเจ้าสามารถถอนมือออกไปทั้งหมดและปล่อยให้เปลวไฟมอดดับไปเองตามกาลเวลา ข้าพเจ้าต้องเลือกอย่างชาญฉลาด..."
 south_asia.0031.a:0 "บดขยี้ฝูงชน และระบุตัวผู้ใดก็ตามที่กล้าปกป้องพวกเขา"
 south_asia.0031.b:0 "เราไม่สามารถทนต่อการทำลายล้างอาณาจักรได้"
 south_asia.0031.c:0 "ส่งสาร ประหารหัวโจกต่อหน้าสาธารณชน"
 south_asia.0031.d:0 "ข้าพเจ้าได้ทำมากเท่าที่ข้าพเจ้าสามารถทำได้แล้ว"
 south_asia.0031.a.tt:0 "เคาน์ตีทั้งหมด"
 south_asia.0031.b.theravada:0 "ข้าหลวงเถรวาททั้งหมด"
 south_asia.0031.c.all.tt:0 "ข้าหลวงอื่นๆ ทั้งหมด"

 south_asia.0032.t:0 "ความตึงเครียดทางศาสนาคลี่คลาย"
 south_asia.0032.desc:0 "เทพเจ้าพื้นบ้านพม่าดั้งเดิมยังคงฝังรากลึก โดยเฉพาะอย่างยิ่งในพื้นที่ชนบท การเพิกถอนสิทธิ์ของประชาชนในการบูชาตามที่พวกเขาต้องการจะก่อให้เกิดผลเสียมากกว่าผลดี ดังนั้นการนำเทพองค์ที่สามสิบเจ็ด — ท้าวสักกะเทวราช เทพผู้พิทักษ์ในพุทธศาสนา — เข้าสู่หมู่เทพในฐานะองค์แรกและสำคัญที่สุดจึงได้รับการตอบรับอย่างเป็นมิตรโดยสิ้นเชิง\n\nโอกาสทองบัดนี้อยู่เบื้องหน้าท่านแล้ว ดินแดนศูนย์กลางดั้งเดิมของพุทธศาสนา [ROOT.Char.GetFaith.GetAdjective] อยู่ในลังกา แต่ก็ถูกคุกคามอย่างต่อเนื่องโดยอำนาจบนแผ่นดินใหญ่ หรืออีกทางหนึ่ง อาจถึงเวลาแล้วที่เราจะตัดสินใจเส้นทางของศรัทธาที่เพิ่งแข็งแกร่งขึ้นของเรา"
 south_asia.0032.a:0 "เชิญผู้ลี้ภัยทางศาสนาจากลังกามายังราชสำนักของท่าน"
 south_asia.0032.b:0 "เราจะเป็นผู้ดูแล [ROOT.Char.GetFaith.GetNameNoTooltip] แต่เพียงผู้เดียว"
 south_asia.0032.a.tt:0 "[guests|E] ชาวลังกามาถึง"
 south_asia.0032.a.ruler.tt:0 "ผู้ปกครองชาวสิงหลเถรวาททั้งหมด"
 south_asia.0032.a.lankan:0 "ผู้ลี้ภัยทางศาสนาชาวลังกาได้มาถึงราชสำนักของท่านแล้ว"

 south_asia.0033.t:0 "เจตจำนงทางศาสนาถูกบังคับใช้"
 south_asia.0033.desc:0 "ผู้ก่อความไม่สงบทางศาสนาหายไปแล้ว ผู้ที่กล้าหาญและโง่เขลาพอที่จะต่อต้านถูกสังหาร แต่ส่วนใหญ่ปิดปากเงียบและก้มหน้าด้วยความกลัวการประหัตประหาร ผู้นำศาสนา [ari_vassal.GetFaith.GetAdjective] หนีไปยังชนบทที่พวกเขาสามารถประกอบพิธีกรรมตามความเชื่อของตนต่อไปได้\n\nคำถามตอนนี้หันไปหาผู้ที่อยู่ในราชสำนัก ซึ่งเคยแสดงการสนับสนุนอย่างโจ่งแจ้ง แต่บัดนี้กลับพบว่าลิ้นของพวกเขานิ่งเงียบสนิท"
 south_asia.0033.a:0 "ทุกคนในราชสำนักของข้าพเจ้าต้องยอมรับการยึดมั่นในศรัทธาที่แท้จริง!"
 south_asia.0033.b:0 "เลือดหลั่งไหลมามากพอแล้ว ปล่อยพวกเขาไป"
 south_asia.0033.c:0 "เจ้าเคยมีโอกาสแล้ว ทหาร!"
 
 south_asia.0034.t:0 "ความขัดแย้งทางศาสนาถูกหลีกเลี่ยง"
 south_asia.0034.desc:0 "การผลักดันประเทศไปสู่ปากเหวของสงครามกลางเมืองเพื่อปกป้องศรัทธาแสดงให้เห็นถึงความกระตือรือร้น แต่การรู้ว่าเมื่อใดควรยั้งมือแสดงให้เห็นถึงความเมตตา ประชาชนยังคงบ่นพึมพำ แต่ก็ช่างเถิด\n\nความแตกแยกทางศาสนาในหุบเขาอิรวดี ยังคงอยู่ แต่อย่างน้อยการปกครองของข้าพเจ้าเหนือดินแดนนั้นยังคงอยู่ และความเป็นไปได้ของการเปลี่ยนศาสนาเพิ่มเติมผ่านวิธีการตามปกติยังคงเป็นไปได้"
 south_asia.0034.a:0 "พระสิทธัตถะโคตมะคงจะเห็นชอบในความเมตตาของข้าพเจ้า"
 south_asia.0034.b:0 "และเราจะเปลี่ยนศาสนาพวกเขา"
 south_asia.0034.counties:0 "เคาน์ตีทั้งหมด"
 south_asia.0034.vassals:0 "ข้าหลวงทั้งหมด"
 south_asia.0034.aricounties:0 "เคาน์ตีอารีทั้งหมด"
 
 south_asia.0035.t:0 "การรักษาดินแดนบ้านเกิดของเถรวาท"
 south_asia.0035.desc:0 "ผู้ติดตามที่แท้จริงของแนวคิดของพระพุทธเจ้าทุกคนสามารถชื่นชมความสำคัญอันศักดิ์สิทธิ์ของการรักษาพระวจนะของพระองค์ได้ พระไตรปิฎกบาลี แม้จะเขียนขึ้นหลายร้อยปีหลังจากการปรินิพพานของพระสิทธัตถะโคตมะ ก็เป็นตัวแทนของชุดคำสอนที่ถูกต้องที่สุดของพระพุทธเจ้าในโลกที่รู้จัก\n\nด้วยกลอุบายทางการเมืองบนแผ่นดินใหญ่อินเดีย มีภัยคุกคามที่เพิ่มขึ้นต่อความปลอดภัยของคัมภีร์อันศักดิ์สิทธิ์ เช่นนี้ในดินแดนบ้านเกิด [ROOT.Char.GetFaith.GetAdjective] บนคาบสมุทรลังกา ข้าพเจ้าต้องดำเนินการ!"
 south_asia.0035.a:0 "เราจะส่ง [ROOT.Char.GetFaith.GetAdherentNameNoTooltip] ผู้ศรัทธา ไปช่วยรักษาศรัทธา"
 south_asia.0035.b:0 "ส่งทูต และเสนอพันธะแห่งมิตรภาพ"
 south_asia.0035.b.theravada.tt:0 "ผู้ปกครองเถรวาทอิสระใดๆ"
 south_asia.0035.a.lanka:0 "เคาน์ตีทั้งหมดในลังกา"
 
 south_asia.0036.t:0 "การจัดการกับชาวอารี"
 south_asia.0036.desc:0 "เมื่ออนาคตของศรัทธานอกหุบเขาอิรวดีมั่นคงแล้ว คำถามที่เหลืออยู่คือจะทำอย่างไรกับพระสงฆ์ [ari_faith.GetName] ที่เหลืออยู่ ซึ่งยังคงมีอำนาจมาก แต่กลับโอ้อวดความมัวเมาในกามสุขทุกครั้งที่มีโอกาส อิทธิพลของพวกเขาสามารถถูกบ่อนทำลายได้ แต่ก็ไม่สามารถประเมินต่ำเกินไปได้\n\nผู้นำศาสนาที่ดื่มไวน์และบูชายัญสัตว์เหล่านี้ต้องถูกจัดการ แต่ต้องจัดการอย่างละเอียดอ่อน เกรงว่าการประหัตประหารพวกเขาจะถูกมองว่าเป็นภัยคุกคามต่อสันติภาพที่ยังเปราะบางในภูมิภาค"
 south_asia.0036.a:0 "ประชาชนจำเป็นต้องรู้ถึงบาปของพวกเขา แบ่งแยกและปกครอง"
 south_asia.0036.b:0 "พวกเขาสามารถเปลี่ยนศาสนา หรือหนีไปยังป่าและภูเขาได้"
 south_asia.0036.b.tt:0 "เคาน์ตีอื่นๆ ทั้งหมดในพม่า"
 
 south_asia.0037.t:0 "ศรัทธามั่นคง"
 south_asia.0037.desc:0 "ขณะที่ร่องรอยสุดท้ายของอำนาจของพระสงฆ์ละลายหายไป ราวกับว่าหินโม่ได้ถูกยกออกจากบ่าของข้าพเจ้า ความสัมพันธ์ทางศาสนาในอาณาจักรมีความปรองดอง ศรัทธากำลังเจริญรุ่งเรือง และประชาชนมองข้าพเจ้าอย่างถูกต้องในฐานะผู้นำของพวกเขาทั้งทางการเมืองและจิตวิญญาณ\n\nการเดินทางอันยิ่งใหญ่ของข้าพเจ้าสิ้นสุดลงแล้ว และอาณาจักรของข้าพเจ้าสามารถเรียกตนเองได้อย่างถูกต้องว่าเป็นฐานที่มั่นที่แท้จริงของศรัทธา [ROOT.Char.GetFaith.GetName] ที่แข็งแกร่งและสมบูรณ์"
 south_asia.0037.a:0 "เราจะสร้างศรัทธาให้แข็งแกร่งยิ่งขึ้นไปอีก!"
 south_asia.0037.b:0 "ข้าพเจ้าเพียงปฏิบัติตามพระประสงค์ของพระพุทธเจ้า"
 south_asia.0037.b.tt:0 "ข้าหลวงทั้งหมด"

 south_asia.0038.t:0 "ความแตกแยกครั้งใหญ่"
 south_asia.0038.desc: "เป็นเวลาหลายปีแล้วที่ผู้ศรัทธาทั่วหุบเขาอิรวดีต้องเผชิญกับการแบ่งแยกทางศาสนาอย่างแท้จริง ชนชั้นสูงที่อาศัยอยู่ในเมืองและพวกพ้องของพวกเขานับถือ [proselytiser.GetFaith.GetName] ในขณะที่สามัญชนและผู้ที่อาศัยอยู่ในป่าอันกว้างใหญ่ของหุบเขายังคงบูชาเทพเจ้าและวิญญาณที่หลากหลายของศาสนาอารี\n\nนายเหนือหัวของข้า [proselytiser.GetFullName] ได้มอบภารกิจนี้แก่ตัว[proselytiser.GetHerHim]เองในการเยียวยาความแตกแยกนี้และสถาปนาศาสนาเถรวาทให้เป็นศาสนาหลักในดินแดนของ [proselytiser.GetHerHis] และโดยนัยยะแล้ว ในดินแดนของข้าด้วย แม้กระทั่งตอนนี้ พระสงฆ์ของ [proselytiser.GetHerHis] ก็กวาดล้างไปทั่วดินแดนของข้า ปรับเปลี่ยนภูมิทัศน์ทางศาสนาตามภาพที่พวกเขาต้องการ"
 south_asia.0038.a:0 "ศรัทธาเถรวาทจะเจริญรุ่งเรือง!"
 south_asia.0038.b:0 "นี่เป็นการกระทำที่อุกอาจ!"
 south_asia.0038.c:0 "นี่ไม่ใช่อะไรมากไปกว่าเรื่องไร้สาระตามปกติ"
 south_asia.0038.tt:0 "[counties|E] หลายแห่งของท่านอาจเปลี่ยนไปนับถือศรัทธาเถรวาท"

 south_asia.0039.t:0 "ผู้คลั่งศาสนาที่โหดร้าย"
 south_asia.0039.desc:0 "งานเผยแผ่ศาสนาของ [proselytiser.GetFullName] ดูเหมือนจะดำเนินไปได้ไม่ดีนัก แนวทางที่แข็งกร้าวของ [proselytiser.GetHerHis|U] ในการเผยแผ่ศรัทธาเถรวาท ส่งผลให้เกิดความโกลาหลและการประท้วง ซึ่งต่อมาถูกบดขยี้อย่างโหดเหี้ยม\n\nขุนนางชายหรือหญิงใดๆ ที่กล้าปกป้องผู้ยึดมั่นในศรัทธาอารีที่ถูกโจมตี ไม่ว่าจะหายตัวไปหรือตอนนี้ยืนยันว่าพวกเขาถูกอ้างคำพูดผิด และไม่มีใครกล้าท้าทายความอดทนของเจ้าเหนือหัวผู้คลั่งศาสนาของพวกเขา\n\nไม่ว่าจะมีผลกระทบเพิ่มเติมสำหรับผู้ที่รู้กันว่าอยู่ฝ่ายผู้ถูกกดขี่หรือไม่นั้นยังคงต้องรอดูกันต่อไป..."
 south_asia.0039.a:0 "มันไม่มากไปกว่าสิ่งที่พวกเขาสมควรได้รับ"
 south_asia.0039.b:0 "สักวันหนึ่ง ผู้ศรัทธาที่ล้มตายจะได้รับการแก้แค้น"
 south_asia.0039.c:0 "ก็เป็นเพียงแค่การทะเลาะวิวาทไร้สาระระหว่าง [ROOT.Char.Custom('GetDerogatoryNonbelieverPlural')]"

 south_asia.0040.t:0 "ศรัทธาที่มั่นคง?"
 south_asia.0040.desc:1 "[proselytiser.GetFullName], เจ้าเหนือหัวของข้าพเจ้าและผู้ปกครองดินแดนเหล่านี้ ได้ทำงานอย่างหนักเพื่อเปลี่ยนศาสนาของประชากรให้เป็นศรัทธาของ [proselytiser.GetHerHis], [proselytiser.GetFaith.GetName] ขณะที่กลอุบายของ [proselytiser.GetHerHis] ดำเนินไป เป็นไปไม่ได้ที่จะหยุดยั้งกระแสของนักเทศน์และภาณกะที่เดินทางผ่านดินแดนของข้าพเจ้าเพื่อเผยแผ่ศรัทธาของพวกเขา และของ [proselytiser.GetLadyLord] ของพวกเขา\n\nแม้ว่าเถรวาทจะหยั่งราก ผู้ยึดมั่นในศรัทธาอารีดั้งเดิมก็ละลายหายไปในฐานที่มั่นในป่ารอบเทือกเขาอาระกัน จำนวนลดน้อยลงและหลีกเลี่ยงการบูชาอย่างเปิดเผย"
 south_asia.0040.a:0 "ยอดเยี่ยม! ศรัทธาที่แท้จริงจะเจริญรุ่งเรือง!"
 south_asia.0040.b:0 "การกระทำเหล่านี้จะไม่ถูกลืมเลือน"
 south_asia.0040.c:0 "นี่ไม่ใช่เรื่องที่ข้าพเจ้าต้องกังวลจริงๆ"
 south_asia.0040.tt:0 "[counties|E] หลายแห่งของท่านอาจเปลี่ยนไปนับถือศรัทธาเถรวาท"

 south_asia.0041.t:0 "ของขวัญจากต่างแดน"
 south_asia.0041.desc:0 "เป็นพระสงฆ์รูปที่ห้าของวันที่ผ่านราชสำนักของข้าพเจ้าที่กระตุ้นความสนใจของข้าพเจ้า เป็นเรื่องยากที่สมาชิกของศรัทธาจะพบเห็นได้ทั่วไปในที่โล่งแจ้ง การสอบถามอย่างรวดเร็วเผยให้เห็นเหตุผลของกระแสใหม่ของผู้ศรัทธาที่หลั่งไหลเข้ามาในดินแดนของข้าพเจ้า\n\n[proselytiser.GetFullName], [proselytiser.GetLadyLord] ชาวต่างชาติ ได้สถาปนาศรัทธา [proselytiser.GetFaith.GetName] ทั่วอาณาจักรของ [proselytiser.GetHerHis] และข่าวได้ไปถึงพวกเขาเกี่ยวกับความยากลำบากและความทุกข์ทรมานที่ศรัทธาร่วมกันของเราได้เผชิญในอาณาจักรของข้าพเจ้าตลอดหลายชั่วอายุคนที่ผ่านมา เช่นกัน\n\nเพื่อเป็นการตอบสนอง [proselytiser.GerSheHe] ได้ส่งภิกษุจำนวนมากมาช่วยเผยแผ่และสนับสนุนศรัทธาในดินแดนบ้านเกิดของบรรพบุรุษ"
 south_asia.0041.a:0 "ข้าพเจ้าจะไม่ลืมท่าทีนี้"

 
 south_asia.0050.t: "อาณาจักรแห่งฮินดูสถาน"
 south_asia.0050.desc: "เมารยะ, กุษาณะ, คุปตะ, ปาละ, และประติหาร, เป็นเวลาหลายพันปีที่ราบลุ่มสินธุ-คงคาเป็นทั้งที่ตั้งและสมรภูมิของจักรวรรดิอันยิ่งใหญ่มากมาย ผู้ปกครองบางคนเป็นชาวต่างชาติและอีกมากมายผงาดขึ้นจากอนุทวีปเอง\n\nราชวงศ์ [founder.GetHouse.GetNameNoTooltip] ไม่ได้เก่าแก่เท่า แต่เราได้สร้างอาณาจักรของเราเองขึ้นมาในที่ที่ราชวงศ์เหล่านี้ทั้งหมดล้มเหลว บัดนี้ถึงเวลาแล้วที่เราจะสร้างจักรวรรดิ และกลไกการปกครอง เพื่อปกครองผู้คนและศรัทธาอันหลากหลายที่อาศัยอยู่ในดินแดนเหล่านี้ทั้งหมด"
 south_asia.0050.a: "ราชธานีแห่งใหม่จะตั้งอยู่ที่เดลี!"
 south_asia.0050.b: "เราจะ ทำให้ลาฮอร์เป็นศูนย์กลางของจักรวรรดิ"
 south_asia.0050.c: "จักรวรรดิจะถูกปกครองจาก [founder.GetCapitalLocation.GetTitle.GetNameNoTierNoTooltip]"
 
 south_asia.0051.t: "รัฐสุลต่านแห่ง [founder.GetCapitalLocation.GetTitle.GetNameNoTierNoTooltip]"
 south_asia.0051.desc: "ข่าวมาถึงเราว่าราชวงศ์ [founder.GetHouse.GetNameNoTooltip] ได้รวมอำนาจเหนือที่ราบลุ่มสินธุ-คงคา ก่อตั้งจักรวรรดิอิสลามใหม่บนซากปรักหักพังที่เหลือโดยราชวงศ์ฮินดูและพุทธในอดีต\n\nสถาปนา [founder.GetHerselfHimself] เป็น [founder.GetFullName] ด้วยความทะเยอทะยานของจักรวรรดิที่จะปกครองอินเดียทั้งหมดจาก [founder.GetCapitalLocation.GetTitle.GetNameNoTierNoTooltip], [founder.GetFirstNameNoTooltip] กำลังเติบโตอย่างรวดเร็วจนเป็นที่หวาดกลัวและชื่นชม"
 south_asia.0051.a: "$middle_europe_decisions.0016.a$"
 south_asia.0051.b: "เราจะบดขยี้พวกกำเริบเสิบสานที่อวดดีเหล่านี้!"
 south_asia.0051.c: "ในที่สุดก็มีผู้ชนะแห่งศรัทธาที่แท้จริง!"
 south_asia.0051.d: "พัฒนาการที่น่ากังวล"
 south_asia.0051.e: "$middle_europe_decisions.0016.d$"
