l_english: 
 spymaster_task.0311.t:0 "ความลับถูกเปิดเผย"
 spymaster_task.0311.councillor_liege_opening:0 "ขณะปฏิบัติหน้าที่ของ [councillor.GetHerHis] ในฐานะ [councillor.GetCouncilTitle] ของข้า [councillor.GetTitledFirstName] ได้เปิดเผยความลับที่ [secret_holder.Custom2('MyCharacterIntroductionNoComma', ROOT.Char)] เก็บงำไว้"
 spymaster_task.0311.spymaster_opening:0 "ขณะสืบสวนให้แก่ [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('councillor_liege'))] ของข้า, [councillor_liege.GetTitledFirstName], ข้าได้เปิดโปงความลับที่ [secret_holder.Custom2('MyCharacterIntroductionNoComma', ROOT.Char)] เก็บงำไว้"
 spymaster_task.0311.notification:0 "[councillor.GetCouncilTitle]: ความลับถูกเปิดเผย"
 
 spymaster_task.0341.t:0 "จารกรรม: ความวิปริต"
 spymaster_task.0311.secret_deviant.shared:0 "\n\nข้าไม่อยากจะเชื่อถึงวิธีการอันน่าขยะแขยงที่ [secret_holder.GetSheHe] แสวงหาความสุขสำราญ แค่คิดก็ชวนให้ [secret_holder.GetWomanMan] ที่ดีงามคนใดก็ตามรู้สึกขยะแขยงแล้ว แต่ [secret_holder.GetSheHe] กลับเต็มใจยิ่งกว่า... อันที่จริง กระตือรือร้นเสียด้วยซ้ำ!"
 spymaster_task.0311.secret_deviant:1 "\n\nวิธีการที่ [secret_holder.GetSheHe] แสวงหาความสุขสำราญนั้นน่าขยะแขยงเกินกว่าที่ [secret_holder.GetWomanMan] ผู้ดีงามคนใดจะนึกถึงได้ แต่ [secret_holder.GetSheHe] ไม่เพียงแค่เต็มใจ แต่กลับกระตือรือร้น! มันช่างรู้สึกผิดธรรมชาติและน่าสะอิดสะเอียน ไม่สิ — มัน #emphasis คือ#! ความผิดธรรมชาติและน่าสะอิดสะเอียน เป็นการล่วงละเมิดต่อ [ROOT.Char.GetFaith.HighGodName]!"
 spymaster_task.0341.a:0 "คนรับใช้! เอาถังมาให้ข้าก่อนที่ข้าจะ— #EMP *อ้วก*#!"
 spymaster_task.0341.a.deviant:0 "บรรยายอีกครั้ง ให้ละเอียดที่สุดเท่าที่จะทำได้..."
 spymaster_task.0341.a.detached:0 "น่าขยะแขยงอย่างที่สุด แต่ก็มีประโยชน์ที่ได้รู้"

 spymaster_task.0342.t:0 "จารกรรม: การสมสู่ผิดธรรมชาติ"
 spymaster_task.0311.sodomy.accepted:1 "\n\n[secret_holder.GetSheHe|U] เพลิดเพลินกับการอยู่ใกล้ชิดสนิทสนมกับ [secret_holder.GetWomenMen] อื่น ๆ เพื่อนร่วมศาสนา [secret_holder.GetFaith.GetAdherentNamePlural] ของ [secret_holder.GetHerHis|U] ถือว่านี่เป็นบาปร้ายแรง และ แม้ว่านั่นจะไม่สมเหตุสมผลนัก แต่มันก็อาจ ทำให้ข้าได้เปรียบ..."
 spymaster_task.0311.secret_sodomy.illegal_shared:0 "\n\n[secret_holder.GetSheHe|U] เพลิดเพลินกับการอยู่ใกล้ชิดสนิทสนมกับ [secret_holder.GetWomenMen] อื่น ๆ อย่างไรก็ตาม ไม่เหมือนข้า [secret_holder.GetFirstName] ปกปิดบาปของ [secret_holder.GetHerHis] ได้ไม่ดีพอ"
 spymaster_task.0311.secret_sodomy.illegal:0 "\n\n[secret_holder.GetSheHe|U] ได้เพลิดเพลินกับการอยู่ใกล้ชิดสนิทสนมกับ [secret_holder.GetWomenMen] อื่น ๆ ช่างโง่เขลาเสียจริงที่คิดว่าบาป เช่นนั้นต่อ [ROOT.Char.GetFaith.HighGodName] จะไม่มีใครสังเกตเห็น..."
 spymaster_task.0342.a:0 "เจ้าจะต้องเสียใจที่ยอมจำนนต่อความปรารถนาของตน, [secret_holder.GetFirstNameNoTooltip]."

 spymaster_task.0343.t:0 "จารกรรม: การพยายามฆ่า"
 spymaster_task.0311.secret_murder_attempt.targeting_me:0 "\n\n[secret_holder.GetSheHe|U] คือ [secret_holder.GetWomanMan] ผู้อยู่เบื้องหลังความพยายามลอบสังหารข้าที่ล้มเหลว! ในที่สุดก็ถึงเวลาชำระแค้น..."
 spymaster_task.0311.secret_murder_attempt.close_to_me:0 "\n\n[secret_holder.GetSheHe|U] คือ [secret_holder.GetWomanMan] ผู้อยู่เบื้องหลังความพยายามลอบสังหาร [murder_target.GetTitledFirstName], [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('murder_target'))] ของข้า ที่ล้มเหลว! ในที่สุดก็ถึงเวลาชำระแค้น..."
 spymaster_task.0311.secret_murder_attempt.other:0 "\n\n[secret_holder.GetSheHe|U] คือ [secret_holder.GetWomanMan] ผู้อยู่เบื้องหลังความพยายามลอบสังหาร [murder_target.GetTitledFirstName] ที่ล้มเหลว!"
 spymaster_task.0343.a:0 "ไม่น่าเชื่อว่า [secret_holder.GetFirstNameNoTooltip] จะตกต่ำถึงเพียงนี้"
 spymaster_task.0343.murder_back:0 "เห็นไหม การกระทำของข้านั้นชอบธรรมอย่างยิ่ง"

 spymaster_task.0344.t:0 "จารกรรม: การฆาตกรรม"
 spymaster_task.0311.secret_murder.sadistic:0 "\n\nดูเหมือนว่า [secret_holder.GetSheHe|U] จะอยู่เบื้องหลังการตายก่อนวัยอันควรของ [murder_target.GetTitledFirstName]."
 spymaster_task.0311.secret_murder.callous:0 "\n\n[secret_holder.GetSheHe|U] วางแผนและวางอุบายเพื่อสังหาร [murder_target.GetTitledFirstName]! โลกนี้ไม่มีที่ว่างสำหรับคนอ่อนแอและขี้ขลาด เช่น [secret_holder.GetHerHim]."
 spymaster_task.0311.secret_murder.close_to_me.vengeful:2 "\n\n[secret_holder.GetSheHe|U] คือฆาตกรผู้อยู่เบื้องหลังการตายของ [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('murder_target'))] ของข้า, [murder_target.GetTitledFirstName]! [secret_holder.GetFirstName] ต้องชดใช้ด้วยชีวิตของ [secret_holder.GetHerHis] และทุกสิ่งที่ [secret_holder.GetHerHim] รัก!"
 spymaster_task.0311.secret_murder.close_to_me:1 "\n\nในที่สุดความจริงก็ถูกเปิดเผยแก่ข้า [secret_holder.GetSheHe|U] คือ [secret_holder.GetWomanMan] ผู้วางแผนสังหาร [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('murder_target'))] ของข้า, [murder_target.GetTitledFirstName]."
 spymaster_task.0311.secret_murder.close_to_me_regret:0 "มันจะหลีกเลี่ยงได้หรือไม่ หากเพียงข้ารู้เร็วกว่านี้?"
 spymaster_task.0311.secret_murder.other:0 "\n\n[secret_holder.GetSheHe|U] วางแผนการจากเงามืด เพื่อให้ [murder_target.GetTitledFirstName] ถูกสังหาร!"
 spymaster_task.0344.a.sadistic:0 "หืม ข้าจะปรุง แต่งการลงโทษอันสาสมที่น่าสะพรึงกลัวได้อย่างไร?"
 spymaster_task.0344.a.callous:0 "ข้าไม่ควรปล่อยให้สุนัขบ้าเพ่นพ่าน"
 spymaster_task.0344.a:0 "ไม่เพียง แต่โหดร้ายและไร้หัวใจ แต่ยังไร้เกียรติอีกด้วย!"
 spymaster_task.0344.b:0 "ข้าชอบธรรมอย่างสมบูรณ์ ไม่มีใครตัดสินข้าได้"

 spymaster_task.0345.t:0 "จารกรรม: การกินเนื้อคน"
 spymaster_task.0311.secret_cannibal.shared:0 "\n\nดูเหมือนว่า [secret_holder.GetSheHe|U] จะเพลิดเพลินกับสิ่งดี ๆ ในชีวิต อาจจะเป็น [ROOT.Char.Custom('RegionalDrink')] สักถ้วย และเนื้อแดงนุ่ม ๆ สักคำ"
 spymaster_task.0311.secret_cannibal:0 "\n\nในบรรดาสิ่งชั่วร้ายทั้งปวง [secret_holder.GetSheHe] สนองความหิวของ [secret_holder.GetHerHis] ด้วยเนื้อคน! จะมีอะไรน่าสะอิดสะเอียนและวิปลาสไปกว่านี้อีกหรือ?!"
 spymaster_task.0345.a.cannibal:0 "ข้าหวังว่า [secret_holder.GetSheHe] จะเชิญข้าไปร่วมงานเลี้ยงในเร็ววัน"
 spymaster_task.0345.a:0 "โอ้ มนุษยชาติอันโสมม เจ้าจะไม่หยุด ทำให้ข้าขยะแขยงเลยหรือ?"

 spymaster_task.0346.t:0 "จารกรรม: ชู้รัก"
 spymaster_task.0311.secret_lover.consort:0 "\n\n[ROOT.Char.Custom2('RelationToMe', SCOPE.sC('secret_holder'))] ของข้าเอง ได้เอา [lover.Custom2('MyCharacterIntroduction', ROOT.Char)] มาเป็นชู้รัก!"
 spymaster_task.0311.secret_lover.consort_is_lover:0 "\n\n[secret_holder.GetSheHe|U] ได้เอา [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('lover'))] ของข้า, [lover.GetTitledFirstName], มาเป็นชู้รักของ [secret_holder.GetHerHis]!"
 spymaster_task.0311.secret_lover.lover_close_to_me:1 "\n\n[secret_holder.GetSheHe|U] ได้เอา [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('lover'))] ของข้า, [lover.GetTitledFirstName], มาเป็นชู้รัก ใครจะบอกได้ว่ามันเกิดขึ้นได้อย่างไร แต่ช่างเป็นความอัปยศอดสูอย่างยิ่งสำหรับพวกเขาทั้งคู่หากเรื่องนี้แพร่งพรายออกไป!"
 spymaster_task.0311.secret_lover.lustful:0 "\n\n[secret_holder.GetSheHe|U] ได้เสพสังวาสกับ [lover.GetTitledFirstName], ลูบไล้มือของ [secret_holder.GetHerHis] ไปทั่วสรรพางค์กายของ [lover.GetFirstNamePossessiveNoTooltip], ประกบปากจุมพิตกันในสารพัดวิธี... โอ้, ช่างเป็นเรื่องอื้อฉาวเสียนี่กระไรหากเรื่องนี้แพร่งพรายสู่สาธารณะ!"
 spymaster_task.0311.secret_lover:0 "\n\n[secret_holder.GetSheHe|U] ได้แอบเอา [lover.Custom2('MyCharacterIntroduction', ROOT.Char)] มาเป็นชู้รัก"
 spymaster_task.0346.a.consort:0 "ช่างน่าเดือดดาล!"
 spymaster_task.0346.a.close:0 "เรื่องนี้กำลังจะซับซ้อนขึ้น"
 spymaster_task.0346.a:0 "นี่เป็นข้อมูลที่มีประโยชน์..."

 spymaster_task.0347.t:0 "จารกรรม: ผู้ไร้ศรัทธา"
 spymaster_task.0311.secret_non_believer.shared:0 "\n\nเช่นเดียวกับข้า [secret_holder.GetSheHe] มีข้อกังขาเกี่ยวกับความศรัทธาของ [secret_holder.GetHerHis] ต่อ [ROOT.Char.GetFaith.HighGodName]. ไม่เหมือนข้า [secret_holder.GetSheHe] ไม่รู้วิธีซ่อนมันได้ดีเท่าที่ [secret_holder.GetSheHe] ควรจะทำ"
 spymaster_task.0311.secret_non_believer.other_faith:1 "\n\nดูเหมือนว่า [secret_holder.GetSheHe] อาจจะเริ่มเห็นความจริงของเทพเจ้าจอมปลอม [secret_holder.GetFaith.HighGodName]. แน่นอนว่า เพื่อนร่วมศาสนา [secret_holder.GetFaith.GetAdherentNamePlural] ของ [secret_holder.GetHerHis] ไม่น่าจะเข้าใจได้เท่าข้า"
 spymaster_task.0311.secret_non_believer.other_sect:0 "\n\nดูเหมือนว่า [secret_holder.GetSheHe] อาจจะเริ่มหันเหออกจากเส้นทาง [ROOT.Char.GetFaith.GetAdjective] โดยหันไปรับคำสอนที่ผิด ๆ ของ [secret_holder.GetFaith.GetAdherentNamePlural] แทน [secret_holder.GetFaith.HighGodName] คงต้องร่ำไห้ที่เห็นบทเรียนของ [secret_holder.GetFaith.HighGodHerHis] ถูกบิดเบือนไป เช่นนั้น"
 spymaster_task.0311.secret_non_believer:0 "\n\nดูเหมือนว่า [secret_holder.GetSheHe|U] กำลังมีข้อกังขาเกี่ยวกับหลักคำสอน [secret_holder.GetFaith.GetAdjective]. โอ้ [secret_holder.GetFirstNameNoTooltip]... เหล่า [secret_holder.GetFaith.AltPriestTermPlural] จะว่าอย่างไร?"
 spymaster_task.0347.a:0 "สัญญาณของจิตวิญญาณที่อ่อนแอ"

 spymaster_task.0348.t:0 "จารกรรม: การสมสู่ร่วมสายโลหิต"
 spymaster_task.0311.secret_incest:0 "\n\n[secret_holder.GetSheHe|U] ได้ก่อบาปอันชั่วร้ายที่สุด อาชญากรรมต่อ [ROOT.Char.GetFaith.HighGodName] [ROOT.Char.GetFaith.HighGodHerselfHimself]! มีเพียงผู้ที่ป่วยทางจิตอย่างแท้จริงเท่านั้นที่จะมีความสัมพันธ์ทางกามารมณ์กับครอบครัวใกล้ชิดของตน"
 spymaster_task.0311.secret_incest.shared:0 "\n\nแม้ว่าสำหรับข้าจะเห็นได้ชัดว่าความรักไม่มีขอบเขต แต่โลกคงจะตอบสนองด้วยความสยดสยองและการประณามต่อวิธีการที่ [secret_holder.GetFirstNameNoTooltip] ได้โอบรับความปรารถนาของ [secret_holder.GetHerHis]..."
 spymaster_task.0348.a.shared:0 "มันต้องเป็น เช่นนี้"
 spymaster_task.0348.a.lustful:0 "ครอบครัวของเจ้าเอง...? โอ้ ข้าไม่ควรแม้ แต่จะคิดถึงมัน #EMP ไม่#! ควร..."
 spymaster_task.0348.a:0 "ข้าต้องประณามการสมสู่อันไม่บริสุทธิ์ เช่นนี้!"

 spymaster_task.0349.t:0 "จารกรรม: เวทมนตร์คาถา"
 spymaster_task.0311.secret_witch.shared:0 "\n\nดูเหมือนว่า [secret_holder.GetSheHe] กำลังมองหาคำตอบนอกเหนือขอบเขตของโลกนี้ เช่นกัน โอ้ สิ่งที่ [secret_holder.GetSheHe] ต้องเคยเห็น... หากเพียง แต่เราจะเปิดเผยเกี่ยวกับความรู้ของเราได้"
 spymaster_task.0311.secret_witch.zealous:0 "\n\nมีหลักฐานว่า [secret_holder.GetSheHe] อาจกำลังเข้าร่วมในพิธีกรรมลับ ซึ่งต้องเป็นการติดต่อกับวิญญาณชั่วร้ายอย่างแน่นอน! [secret_holder.GetSheHe|U] แน่นอนว่าต้องเต้นรำเปลือยกายกับปีศาจที่ยั่วยวน แสงระยิบระยับของเปลวไฟลูบไล้ร่างกายของพวกเขาขณะที่พวกเขา..."
 spymaster_task.0311.secret_witch.zealous_end:0 "ช่างเป็นความคิดที่น่าขยะแขยง!"
 spymaster_task.0311.secret_witch:0 "\n\nมีหลักฐานว่า [secret_holder.GetSheHe] อาจกำลังเข้าร่วมในพิธีกรรมลับ จะมีจุดประสงค์อื่นใดสำหรับสิ่ง เช่นนั้น นอกจากการติดต่อกับวิญญาณชั่วร้าย และอาจเป็นการสมสู่กับปีศาจ?!"
 spymaster_task.0349.a.zealous:0 "ความคิดถึงความงามเหนือโลกต้องไม่ยั่วยวนข้า!"
 spymaster_task.0349.a:0 "[secret_holder.GetSheHe] กำลังวางแผนชั่วร้ายอะไรอยู่?"

 spymaster_task.0350.t:0 "จารกรรม: ลูกนอกสมรส"
 spymaster_task.0311.secret_bastard.i_am_real_father:1 "\n\nไม่เพียง แต่ [bastard.GetTitledFirstName] จะเป็นลูกนอกสมรสจริง ๆ แต่... ข้าคือบิดาที่แท้จริงของ [bastard.GetHerHis]!"
 spymaster_task.0311.secret_bastard.i_am_not_father:1 "\n\n[bastard.GetTitledFirstName] ไม่ใช่ลูกที่แท้จริงของข้า แต่เป็น [bastard.Custom('DaughterSon')] ของ [secret_holder.Custom2('MyCharacterIntroductionNoComma', ROOT.Char)]!"
 spymaster_task.0311.secret_bastard.i_am_not_real_father:0 "\n\n[bastard.GetTitledFirstName] ไม่ใช่ลูกที่แท้จริงของข้า แต่เป็น [bastard.Custom('DaughterSon')] ของ [actual_father.Custom2('MyCharacterIntroductionNoComma', ROOT.Char)]!"
 spymaster_task.0311.secret_bastard.father_is_interesting:1 "\n\nอันที่จริง [bastard.GetTitledFirstName] คือลูกนอกสมรสของ [mother.GetTitledFirstName] และ [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('actual_father'))] ของข้า, [actual_father.GetTitledFirstName]!"
 spymaster_task.0311.secret_bastard:1 "\n\nอันที่จริง [bastard.GetTitledFirstName] คือลูกนอกสมรสของ [mother.GetTitledFirstName] และ [actual_father.GetTitledFirstName]!"
 spymaster_task.0350.a.related:0 "ท่านปิดบังเรื่องนี้จากข้าได้อย่างไร, [mother.GetFirstNameNoTooltip]?"
 spymaster_task.0350.a:0 "เหลือเชื่อ!"

 spymaster_task.0353.t: "จารกรรม: ผู้แอบนับถือ [secret_holder.GetSecretFaith.GetAdherentNameNoTooltip]"
 spymaster_task.0311.secret_crypto_religionist.cynical_uncompassionate: "\n\nเช่นนั้น [secret_holder.GetSheHe] ก็ยังคงปฏิบัติ [secret_holder.GetSecretFaith.GetName] อย่างลับ ๆ สินะ ช่างโง่เขลาเสียจริงที่ [secret_holder.GetHerHim] ยึดติดกับเทวรูปของ [secret_holder.GetHerHis] แม้ต้องเผชิญหน้ากับความตาย! คนโง่เหล่านี้จะเรียนรู้ได้เมื่อใดกัน?"
 spymaster_task.0311.secret_crypto_religionist.cynical_compassionate: "\n\nดูเหมือนว่า [secret_holder.GetSheHe] ยังคงปฏิบัติ [secret_holder.GetSecretFaith.GetName] อย่างลับ ๆ ช่างแปลกประหลาดที่เห็นใครบางคนยึดมั่นในศรัทธาหนึ่งมากกว่าอีกศรัทธาหนึ่ง พวกเขาไม่เห็นหรือว่ามัน ทำให้พวกเขาตกอยู่ในอันตรายเพียงใด?"
 spymaster_task.0311.secret_crypto_religionist.shared_secret: "\n\nดูเหมือนว่า [secret_holder.GetSheHe] ต้องซ่อนความเชื่อของ [secret_holder.GetHerHis] ใน [secret_holder.GetSecretFaith.GetName] จากสายตาของสาธารณชน เช่นเดียวกับที่ข้าซ่อน [root_crypto_faith.GetName] ของข้า อย่างไรก็ตาม เหตุใด [secret_holder.GetSheHe] จึงบูชาศรัทธาจอมปลอมของ [secret_holder.GetHerHis] โดยเสี่ยงภัยด้วยตนเองนั้น ยังคงเป็นปริศนา"
 spymaster_task.0311.secret_crypto_religionist.shared_faith: "\n\nเช่นนั้น ดูเหมือนว่า [secret_holder.GetSheHe] คือเพื่อนร่วมศาสนา [ROOT.Char.GetFaith.GetAdherentName] ของข้า แต่เป็นผู้ไร้ศรัทธาที่ซ่อนความเชื่อของ [secret_holder.GetHerHis] ไว้ในเงามืด [ROOT.Char.GetFaith.HighGodName] จะตรัสว่าอย่างไรกับการขาดศรัทธา เช่นนี้?"
 spymaster_task.0311.secret_crypto_religionist.shared_faith_taqiya: "\n\nเช่นนั้น ดูเหมือนว่า [secret_holder.GetSheHe] คือเพื่อนร่วมศาสนา [root_crypto_faith.GetAdherentName] ของข้า ไม่ผิดที่ [secret_holder.GetHerHim] จะปฏิบัติในเงามืด แต่ข้าสงสัยว่าเพื่อนร่วมศาสนา [secret_holder.GetFaith.GetAdherentNamePlural] ของ [secret_holder.GetHerHis] จะคิด เช่นเดียวกันหรือไม่?"
 spymaster_task.0311.secret_crypto_religionist.shared_faith_shared_secret: "\n\nเช่นนั้น ดูเหมือนว่าเราทั้งคู่ต้องปฏิบัติ [secret_holder.GetSecretFaith.GetName] ในเงามืด ข้าสงสัยว่าควรทำอย่างไรกับข้อมูลนี้ดี?"
 spymaster_task.0311.secret_crypto_religionist: "\n\n[secret_holder.GetSheHe|U] เป็น [secret_holder.GetFaith.GetAdherentName] ในเวลากลางวัน แต่เมื่อค่ำลงกลับปฏิบัติ [secret_holder.GetSecretFaith.GetName] ด้วยเสียงกระซิบแผ่วเบา โอ้ สิ่งที่ข้าสามารถทำได้ด้วยข้อมูลนี้..."
 spymaster_task.0353.a.shared_faith_shared_secret: "จำนวนพวกเราเพิ่มขึ้น"
 spymaster_task.0353.a.cynical: "ความโง่เขลาของ [secret_holder.GetHerHis|U] คือผลประโยชน์ของข้า"
 spymaster_task.0353.a: "เหล่า [secret_holder.GetFaith.AltPriestTermPlural] จะไม่ให้อภัยเรื่องนี้"

 spymaster_task.0359.t:0 "จารกรรม: การค้นพบ"
 spymaster_task.0359.a:0 "น่าสนใจมาก..."

 spymaster_task.0381.opening:0 "[councillor.Custom2('AppropriateGreetingPositive', SCOPE.sC('councillor_liege'))]"
 spymaster_task.0381.desc_your_court:1 "ในการทำงานของข้าที่ราชสำนักของท่าน ข้าล้มเหลวในการค้นหาความลับใด ๆ ที่ [character_to_hook.Custom2('YourCharacterIntroduction', target_character)] อาจมี"
 spymaster_task.0381.desc_other_court:1 "ในการสืบสวน [target_character.GetTitledFirstName] ของข้า, [character_to_hook.Custom2('HerHisCharacterIntroduction', target_character)] ดูเหมือนจะเป็นผู้ที่น่าจะเก็บงำความจริงอันดำมืดไว้มากที่สุด โชคร้าย, ไม่ว่าข้าจะขุดคุ้ยมากเพียงใด, [character_to_hook.GetTitleAsNameNoTooltip] ผู้ดูน่าสงสัยภายนอกผู้นี้ ก็ดูเหมือนจะไม่ได้ซ่อนเร้นสิ่งใดไว้เลย"
 spymaster_task.0381.desc:2 "\n\nอย่างไรก็ตาม, ความจริงไม่จำเป็นต้องมาขัดขวางภารกิจที่อยู่เบื้องหน้าข้า เราสามารถจัดฉากให้ [character_to_hook.GetFirstNameNoTooltip] มีความลับ, ที่จะทำลาย [character_to_hook.GetHerHim] อย่างแน่นอนหากมันแพร่งพรายออกไป"
 spymaster_task.0381.a:0 "จัดการให้เรียบร้อย"
 spymaster_task.0381.a.truth_is_relative_unlock:0 "ตัวเลือกนี้ใช้ได้ เพราะข้ามีคุณสมบัติ [GetPerk('truth_is_relative_perk').GetName(GetPlayer)]"
 spymaster_task.0381.b:0 "ไม่มีเหตุผลใดที่เราไม่ควรเป็นมิตรกันแทน"
 spymaster_task.0381.b.flavor:0 "ตราบใดที่ [character_to_hook.GetSheHe] รู้ว่าข้าสามารถเป็นศัตรูของ [character_to_hook.GetHerHis] ได้ง่ายเพียงใด"

 spymaster_task.0399.opening:0 "[councillor.Custom2('AppropriateGreeting', SCOPE.sC('councillor_liege'))]"
 spymaster_task.0399.desc:1 "แม้จะพยายามอย่างเต็มที่แล้ว สายลับของข้าก็ยังไม่สามารถเปิดโปงความลับใด ๆ ได้"
 spymaster_task.0399.home_court:0 "ที่ราชสำนักแห่งนี้"
 spymaster_task.0399.other_court:0 "ที่ราชสำนักของ [target_character.GetTitledFirstNamePossessive]."
 spymaster_task.0399.nothing_to_find:1 "\n\nข้าไม่เชื่อว่าเราจะพบเจออะไรได้เลย ที่นี่เงียบสงัดยิ่งกว่าป่าช้าตอนเที่ยงวัน"
 spymaster_task.0399.something_here:0 "\n\nอย่างไรก็ตาม ข้ายังคงเชื่อว่ามีบางอย่างเกิดขึ้นในเงามืด ข้าเพียงต้องการเวลาอีกเล็กน้อยเพื่อสืบให้รู้ว่ามันคืออะไร"
 spymaster_task.0399.a.recommended:0 "ดีมาก เจ้ารู้ดีที่สุด"
 spymaster_task.0399.a.counter:0 "ไม่ อย่าเสียเวลาไปมากกว่านี้เลย"
 spymaster_task.0399.a.tt:0 "[councillor.GetCouncilTitle] [councillor.GetFirstNameNoTooltip] เปลี่ยนภารกิจเป็น [GetCouncilTaskType('task_disrupt_schemes').GetName|V]"
 spymaster_task.0399.b.recommended:0 "หากมี #EMP สิ่งใด#! เราจะหามันให้พบ"
 spymaster_task.0399.b.counter:0 "ข้าไม่แน่ใจนัก ทำต่อไป!"
 spymaster_task.0399.b.tt:0 "[councillor.GetCouncilTitle] [councillor.GetFirstNameNoTooltip] ยังคงปฏิบัติภารกิจ [GetCouncilTaskType('task_find_secrets').GetName|V]"

 spymaster_task.1001.t:0 ""อุบัติเหตุ""
 spymaster_task.1001.desc:0 "คำขอโทษ [councillor.GetTitledFirstNamePossessive] #EMP ฟังดู#! จริงใจ แต่ข้อผิดพลาดนั้นดูน่าขบขันเกินกว่าที่จะเป็นความจริงได้\n\n"ท่านนายเหนือหัว" [councillor.GetCouncilTitle] ของข้าอธิบาย "มันเป็นเพียงเรื่องของการส่งจดหมายผิดซองไปกับผู้ส่งสารที่ผิดคนเท่านั้นเอง" [councillor.GetSheHe|U] กลั้นหายใจ [councillor.GetHerHis] "ดังนั้น นั่นคือเหตุผลที่เอกสารเอาผิดเหล่านั้นสูญหายไป""
 spymaster_task.1001.a:0 "เจ้ามัน [councillor.Custom2('InsultNoun', ROOT.Char)] โดยแท้!"
 spymaster_task.1001.b:0 "ทุกคนย่อมทำผิดพลาดได้, [councillor.GetFirstNameNoTooltip]."
 spymaster_task.1001.a.tt:1 "มีคนในอาณาจักรของท่านได้ล่วงรู้ความลับ [secrets|E] ของท่านหนึ่งอย่าง\n\n"
 spymaster.1001.notification:0 "เอกสารลับสูญหาย"

 spymaster_task.1002.greeting:1 "ถึงผู้ที่เกี่ยวข้อง..."
 spymaster_task.1002.desc:0 "ข้าได้แนบเอกสารมัดตัวมาด้วย ข้าขอย้ำว่าท่านห้ามพูดเรื่องนี้กับผู้ใด แม้ แต่เจ้านายของข้า, [councillor_liege.GetTitledFirstName], ก็ไม่ทราบว่าเอกสารเหล่านี้มีอยู่ และต้องคงเป็น เช่นนั้นต่อไป"
 spymaster_task.1002.a:0 "ข้าไม่คิดว่าข้าควรจะได้รับสิ่งนี้..."
 spymaster_task.1002.a.tt:1 "#F ...แต่ข้าเป็นใครกันที่จะปฏิเสธของขวัญจาก [councillor.GetCouncilTitle]?#!"
 spymaster_task.1003.a.tt:1 "มีคนในอาณาจักรของท่านได้ล่วงรู้ความลับ [secrets|E] อย่างหนึ่งของ [courtier.GetTitledFirstNamePossessiveNoTooltip]\n\n"
 spymaster_task.1003.notification:0 "จดหมายลับสูญหาย"

 spymaster_task.1101.desc_opening:0 "ข้าได้เปิดโปงแผนการอันชั่วร้ายโดย [owner.GetTitledFirstName]"
 spymaster_task.1101.murder:0 "ที่จะสังหารท่าน!"
 spymaster_task.1101.abduct:0 "ที่จะลักพาตัวท่าน!"
 spymaster_task.1101.spy_on:0 "ที่จะเปิดโปงความลับทั้งหมดของท่าน!"
 spymaster_task.1101.fallback:0 "ต่อต้านท่าน!"
 spymaster_task.1101.ending:0 "\n\nสายลับของ [owner.GetHerHis|U] กำลังถูกรวบตัวขณะที่ข้าเขียนข้อความนี้ แต่ถึง แม้ว่า [owner.GetFirstName] จะถูกขัดขวางในตอนนี้ [owner.GetSheHe] ก็ยังคงเป็นภัยคุกคามต่ออนาคต\nเว้น แต่เราจะดำเนินการ นั่นคือ..."
 spymaster_task.1101.a:0 "โลกนี้อาจไม่ใหญ่พอสำหรับเราสองคน"
 spymaster_task.1101.exposure_tt:0 "แผนการถูกเปิดโปงแล้ว"

 spymaster_task.2001.t:0 "ข้อกล่าวหาที่ว่างเปล่า"
 spymaster_task.2001.desc:0 "[ROOT.Char.Custom2('RelationToMe', SCOPE.sC('councillor'))] ของข้าได้นำตัว [ROOT.Char.Custom('DefaultPriestTitle')], [accused_priest.GetFirstName], มาเพื่อเปิดโปงและพิพากษาแผนการสมคบคิดอันยิ่งใหญ่ อย่างไรก็ตาม, เมื่อ [ROOT.Char.Custom('DefaultPriestTitle')] ปฏิเสธที่จะสารภาพ, [councillor.GetTitledFirstName] ก็ไม่มีหลักฐานหรือสิ่งสนับสนุนใด ๆ สำหรับข้อกล่าวหาของ [councillor.GetHerHis] เลย"
 spymaster_task.2001.a:0 "ได้โปรดหยุด ทำให้ข้าอับอายเสียที, [councillor.GetFirstNameNoTooltip]."
 spymaster_task.2001.b:0 "[ROOT.Char.Custom('DefaultPriestTitle')] ต้องมีความผิดใน #EMP บางสิ่ง#! อย่างแน่นอน"
 spymaster_task.2001.c: "เจ้าควรเข้าร่วมราชสำนักของข้า, [accused_priest.GetFirstNameNoTooltip]"
 spymaster_task.2002.notification:0 "ชื่อเสียงด้านการใช้วิธีสกปรก"

 spymaster_task.2003.t:0 "แผนการที่คลี่คลาย"
 spymaster_task.2003.desc:0 "[councillor.GetCouncilTitle] ของข้าดูเป็นทางการผิดปกติเมื่อเข้ามาหาข้าที่ราชสำนัก "[ROOT.Char.Custom('FormOfAddressForLiege')|U], ท่านเคยพิจารณาหรือไม่ว่าการวางแผนในเงามืดอาจไม่ใช่วิธีที่ดีที่สุดในการได้มา ซึ่งสิ่งที่ท่านต้องการ?" มันเป็นคำกล่าวที่น่าประหลาดใจ, แต่ในที่สุด [councillor.GetTitledFirstName] ก็เข้าประเด็น\n\n"ดูเหมือนว่า... เอ่อ, สายลับทุกคนใน [scheme.GetName] ได้หยุดตอบจดหมายของข้าแล้ว ราวกับว่าไม่มีสิ่งใดเคยเกิดขึ้นเลย""
 spymaster_task.2003.a:0 "เจ้าทำแผนการพังหมดสิ้นแล้วหรือ?"

 spymaster_task.2102.t:0 "ความรู้ที่ซ่อนเร้น"
 spymaster_task.2102.desc:0 "การดูแลเครือข่ายสายลับทั่วอาณาจักรในนามของ [councillor_liege.GetTitledFirstName] นั้นมีข้อดีของมัน ข้ามักจะค้นพบสิ่งที่ข้าไม่ได้มองหาอยู่บ่อยครั้ง ตัวอย่าง เช่น หลักฐานความลับของ [secret_owner.GetTitledFirstNamePossessive]..."
 spymaster_task.2102.a:0 "[councillor_liege.GetFirstNameNoTooltip] คงจะสนใจเรื่องนี้"
 spymaster_task.2102.b:0 "ข่าวลือนั่นน่ะหรือ? ข้าคิดว่า [councillor_liege.GetTitleTierName] คงอยากจะฟังมัน"
 spymaster_task.2102.c:0 "ไม่จำเป็นต้องแบ่งปันเรื่องนี้"
 spymaster_task.2102.c.tt:1 "ท่านต้องระวังสิ่งที่เจ้านายของท่านอาจเชื่อว่าท่านกำลังปิดบังจาก [councillor_liege.GetHerHim]"
 spymaster_task.2103.notification:0 "[councillor.GetCouncilTitle] ค้นพบความลับ"
 
 spymaster_task.3001.opening:0 "[target_character.Custom2('AppropriateGreeting', ROOT.Char)]"
 spymaster_task.3001.desc:0 "เป็นที่ประจักษ์ชัดอย่างเจ็บปวดว่า [councillor.GetCouncilTitle] ของท่าน, [councillor.GetTitledFirstName], ได้ส่งสายลับมายังราชสำนักของข้า ข้าไม่รู้ว่าพวกเขากำลังมองหาอะไร เพราะข้ารับใช้ของข้าและตัวข้าไม่มีอะไรต้องปิดบัง แต่ข้าขอวิงวอนท่าน โปรดสั่งให้พวกเขาหยุด"
 spymaster_task.3001.a:0 "ท่านแค่คิดไปเอง!"
 spymaster_task.3001.continue_snooping:0 "[councillor.GetFirstNameNoTooltip] ยังคงสอดแนมต่อไป"
 spymaster_task.3001.b:0 "เป็นความเข้าใจผิดที่โชคร้าย มันจบลงแล้วตอนนี้"

 spymaster_task.3002.t:0 "สายลับในราชสำนัก"
 spymaster_task.3002.opening:0 "ขณะที่ข้อความลับถูกส่งต่อกันด้วยเสียงกระซิบในราชสำนัก เป็นที่ชัดเจนว่าสายลับของ [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('councillor_liege'))] ของข้ากำลังขุดคุ้ยหาความลับ"
 spymaster_task.3002.end:0 "อย่างไรก็ตาม เมื่อข้าเข้าพบ [councillor_liege.GetTitledFirstName] เกี่ยวกับเรื่องนี้ [councillor_liege.GetSheHe] กลับปฏิเสธทุกอย่าง!"
 spymaster_task.3002.a:0 "[councillor_liege.GetSheHe] กำลังวางแผนอะไรอยู่?"

 spymaster_task.3003.end:1 "โชคดีที่ [councillor_liege.GetTitledFirstName] ได้สัญญาว่าแผนการร้ายของ [councillor.GetCouncilTitle] ของ [councillor_liege.GetHerHis] จะสิ้นสุดลงทันที"
 spymaster_task.3003.a:0 "แต่ทำไมพวกเขาถึงมาอยู่ที่นี่ตั้งแต่แรก?"
 
 spymaster_task.3004.desc:0 "ท่านคงไม่เชื่อหรอกว่าสายลับของ [councillor.GetCouncilTitle] ของท่านจะไม่มีใครสังเกตเห็นในราชสำนักของข้าตลอดไป? ข้าขอสั่งให้ท่านหยุดพฤติกรรมกบฏนี้ทันที!"
 spymaster_task.3004.a:0 "ท่านคงคิดไปเอง..."
 spymaster_task.3004.b:0 "เป็นความผิดพลาดเล็กน้อย ฝ่าบาท เพียงเท่านั้น!"

 spymaster_task.3005.opening:0 "ข้าได้ค้นพบสายลับในราชสำนักของข้า เห็นได้ชัดว่าอยู่ในการจ้างวานของ [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('councillor_liege'))] ของข้า, [councillor_liege.GetTitledFirstName]!"
 spymaster_task.3005.end:0 "\n\nอย่างไรก็ตาม เมื่อข้าเรียกร้องให้ถอนตัวพวกเขาออกไป [councillor_liege.GetTitleTierName] กลับปฏิเสธทุกอย่าง!"
 spymaster_task.3005.a:0 "เจ้าคนร้ายจองหอง!"

 spymaster_task.3006.end:0 "\n\nเมื่อถูกสั่งให้ถอนตัวพวกเขาออกไป [councillor_liege.GetTitleTierName] ก็ยอมจำนน แต่ข้าอาจจะต้องจับตาดูต่อไป..."
 spymaster_task.3006.a:0 "เสียงกระซิบอันมืดมนนำหน้าการกระทำอันชั่วร้าย"

 spymaster_task.3007.desc:0 "สายลับที่ขุดคุ้ยหาความลับได้รบกวนราชสำนักของข้า และลองนึกภาพความประหลาดใจของข้าเมื่อพบว่าพวกเขาอยู่ในการจ้างวานของ [councillor.GetCouncilTitle] ของท่าน! โปรดหยุดยั้งเรื่องน่าหัวเราะเยาะนี้ทันที!"
 spymaster_task.3007.a:0 "ข้าไม่รู้อะไรเกี่ยวกับสายลับใด ๆ ทั้งสิ้น, [target_character.GetFirstNameNoTooltip]."
 spymaster_task.3007.b:0 "โอ้ พวกเขาคงหลงทางระหว่างกลับบ้าน!"

 spymaster_task.3009.end:0 "เมื่อถูกร้องขอให้ถอนตัวพวกเขาออกไป [councillor_liege.GetTitleTierName] ก็ยอมจำนน แต่ข้าอาจจะต้องจับตาดูต่อไป..."
