l_english: 
 councillor_spouse_diplomacy.1001.desc:0 "ชื่อเสียงวงศ์ตระกูล"
 councillor_spouse_diplomacy.1002.desc:0 "ไกล่เกลี่ยความขัดแย้งระหว่างพี่น้อง"
 councillor_spouse_diplomacy.1003.desc:0 "ความสัมพันธ์ระหว่างพี่น้องดีขึ้น"
 councillor_spouse_diplomacy.1004.desc:0 "การฝึกฝนทางการทูต"
 councillor_spouse_diplomacy.1004.desc_diplo_councillor:0 "สอนโดย [councillor.GetTitleAsName]"
 councillor_spouse_diplomacy.1005.desc:0 "การฝึกฝนทางการทูต"
 councillor_spouse_diplomacy.1006.desc:0 "ด้วยความอุตสาหะของ [councillor.GetTitledFirstNamePossessive] [councillor.GetSheHe] จึงเจรจากับผู้คนได้ดีขึ้น"
 councillor_spouse_diplomacy.1007.desc:0 "การแลกเปลี่ยนฉันมิตร"

 councillor_spouse_diplomacy.2001.t_female:1 "[councillor.GetCouncilTitle]: หญิงโสดผู้เพียบพร้อม"
 councillor_spouse_diplomacy.2001.t_male:1 "[councillor.GetCouncilTitle]: ชายโสดผู้เพียบพร้อม"
 councillor_spouse_diplomacy.2001.desc_mother:0 "[councillor.GetTitledFirstName] มองดู [ROOT.Char.Custom('ChildChildrenGender')] ของเราด้วย [councillor.Custom('quirk_pos_noun')] ตามปกติของ [councillor.GetHerHis] "ไม่มีบุตรคนใดของเราที่ควรจะไร้คู่ครอง""
 councillor_spouse_diplomacy.2001.desc:0 "[councillor.GetTitledFirstName] มองดู [ROOT.Char.Custom('ChildChildrenGender')] ของข้าด้วย [councillor.Custom('quirk_pos_noun')] ตามปกติของ [councillor.GetHerHis] "ไม่มีบุตรคนใดของท่านที่ควรจะไร้คู่ครอง""
 councillor_spouse_diplomacy.2001.desc_end:0 ""หากท่านอนุญาตให้ข้าสอนพวกเขา ในไม่ช้าจะมีผู้หมายปองมาเข้าแถวรออยู่เต็มถนนด้านนอก!""
 councillor_spouse_diplomacy.2001.a:0 "ทายาทของข้า [child_heir.GetTitledFirstNameNoTooltip] ควรได้รับการสอนสั่ง"
 councillor_spouse_diplomacy.2001.b:0 "พวกเขาทุกคนควรได้รับการฝึกสอนบ้าง"
 councillor_spouse_diplomacy.2001.b.all_kids:0 "บุตรที่ยังไม่ได้สมรสทั้งหมดของข้า:"
 councillor_spouse_diplomacy.2001.c:0 "ข้าอยากให้ท่านสอนกิริยามารยาทอันน่าชื่นชมแก่ข้าแทน!"

 councillor_spouse_diplomacy.2002.t:1 "[councillor.GetCouncilTitle]: ทวีความชื่นชอบ"
 councillor_spouse_diplomacy.2002.desc:0 ""การบ่มเพาะความสัมพันธ์ระหว่างผู้ปกครองรุ่นต่อไปเป็นหน้าที่ที่เราไม่ควรละเลย" [councillor.GetTitledFirstName] กล่าว\n\n"ข้าหลวงผู้ทรงอิทธิพลบางคนของท่านมีบุตร ซึ่งข้ามั่นใจว่า [child_heir.GetTitledFirstName] จะได้รับประโยชน์จากการรู้จัก""
 councillor_spouse_diplomacy.2002.a:0 "[vassal_heir_1.GetTitledFirstNameNoTooltip] ดูเหมือนจะเป็น [vassal_heir_1.Custom('WomanManGirlBoy')] ที่มีชื่อเสียงดี"
 councillor_spouse_diplomacy.2002.b:0 "[vassal_heir_2.GetTitledFirstNameNoTooltip] น่าจะเป็นผู้มีอิทธิพลที่ดี!"
 councillor_spouse_diplomacy.2002.c:0 "ข้าได้ยินเรื่องดีๆ เกี่ยวกับ [vassal_heir_3.GetTitledFirstNameNoTooltip]"
 councillor_spouse_diplomacy.2002.d:0 "[ROOT.Char.Custom2('RelationToMe', SCOPE.sC('child_heir'))] ของข้าจะดูแล [child_heir.GetHerHis] ตัวเองได้ดี"

 councillor_spouse_diplomacy.2003.t:1 "[councillor.GetCouncilTitle]: โอกาสแห่งสันติภาพ"
 councillor_spouse_diplomacy.2003.desc:0 "ทันทีที่ข้าเห็น [rival.GetTitledFirstName] [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('rival'))] ของข้า อยู่อีกฟากหนึ่งของ [ROOT.Char.GetFaith.HouseOfWorship] ข้าก็เริ่มหันหลังกลับ, แต่ที่ข้าประหลาดใจคือ [councillor.GetTitledFirstName] กลับกวักมือเรียก [rival.Custom2('InsultNoun', ROOT.Char)] ผู้นั้น [councillor.Custom('quirk_pos_adverb')] มาหาพวกเรา\n\n"[rival.GetSheHe|U] ได้ตกลงที่จะพบท่านบนพื้นที่เป็นกลางแล้ว ช่างโชคร้ายนักที่ [ROOT.Char.Custom2('WomenMenPeople', SCOPE.sC('rival'))] [SCOPE.Custom('PersonalityGetSharedTraitDescriptionFromFlag')] สองคน เช่นพวกท่านกำลังขัดแย้งกัน ท่านไม่คิดหรือว่าถึงเวลาที่จะต้องสมานฉันท์กันแล้ว?""
 councillor_spouse_diplomacy.2003.a:0 "ท่านอาจจะพูดถูก..."
 councillor_spouse_diplomacy.2003.b:0 "ข้าจะไป "แก้ไข" ใบหน้าของ [rival.GetHerHis]!"
 councillor_spouse_diplomacy.2003.c:0 "ท่านเรียก [rival.GetHerHim] ว่า [SCOPE.Custom('PersonalityGetSharedTraitDescriptionFromFlag')] งั้นรึ?! ให้ข้าเปิดเผยธาตุแท้ของ [rival.GetHerHis] เถอะ..."

 councillor_spouse_diplomacy.2004.t:1 "[councillor.GetCouncilTitle]: การอ้างสิทธิ์เพื่อผลประโยชน์"
 councillor_spouse_diplomacy.2004.desc:1 "[ROOT.Char.Custom2('RelationToMe', SCOPE.sC('councillor'))] ของข้า [councillor.GetTitledFirstName] พา [claimant.GetWomanMan] ผู้หนึ่งมาเข้าเฝ้าข้าอย่างกระตือรือร้น\n\n"ข้า แต่ [ROOT.Char.GetTitleTierName] โปรดอนุญาตให้ข้าแนะนำท่านให้รู้จักกับ [claimant.GetTitledFirstName] ผู้มีสิทธิ์เรียกร้องใน [title_to_claim.GetName]"\n\n[claimant.GetFirstName] คำนับต่อหน้าข้า และกล่าวว่า "นับเป็นเกียรติอย่างยิ่ง [claimant.Custom2('RelationToMeAddress', ROOT.Char)] น่าเศร้าที่ [title_to_claim.GetNameNoTier] คงจะยังอยู่ไกลเกินเอื้อมสำหรับข้า หากปราศจาก... ผู้อุปถัมภ์อยู่เคียงข้างข้า""
 councillor_spouse_diplomacy.2004.a:0 "ข้าอาจจะพอช่วยท่านในเรื่องนั้นได้"
 councillor_spouse_diplomacy.2004.a.tt:0 "#F เมื่อ [claimant.GetFirstNameNoTooltip] พำนักอยู่ที่ราชสำนักของข้า ข้าจะสามารถผลักดันสิทธิ์เรียกร้องของ [claimant.GetHerHis] ได้เมื่อถึงเวลาอันควร#!"
 councillor_spouse_diplomacy.2004.b:0 "ขอให้โชคดีกับเรื่องนั้น"
 councillor_spouse_diplomacy.2004.c:0 "คุก. กระดาษหนัง. นกพิราบส่งถึง [current_holder.GetTitledFirstNameNoTooltip]. ตามลำดับนั้น"
 councillor_spouse_diplomacy.2004.c.tt:0 "#F ข้าจะแจ้งให้ [current_holder.GetTitleTierName] ทราบว่า [claimant.GetFirstNameNoTooltip] ไม่เป็นภัยคุกคามอีกต่อไป#!"
