l_english: 
 central_asia.0001.t:0 "โลกเบื้องหน้าข้า"
 central_asia.0001.desc:0 "เหล่าหัวหน้าเผ่าต่างรู้ดีว่าเหตุใดจึงถูกเรียกตัวมา เราใช้เวลายาวนานในค่ำคืนอันเงียบสงัดภายในกระโจมหลวง และพวกเขาได้เรียกทั้งหมอผีและแม่ทัพมาพูดต่อหน้า หาได้มีการโต้แย้งไม่ ข้าออกมาจากกระโจมเมื่อแสงแรกแห่งรุ่งอรุณทาบทาขอบฟ้า และกองทัพที่มาชุมนุมกันทั้งหมดก็ตื่นรออยู่แล้ว\n\nพวกเขาทักทายข้า โดยรู้ว่าข้ามิใช่เพียงผู้ปกครองของพวกเขา ข้าคือผู้ปกครองแห่งจักรวาล — เจงกิสข่าน"
 central_asia.0001.a:0 "ณ ที่นี้ การพิชิตของข้าได้เริ่มต้นขึ้นอย่างแท้จริง"
 central_asia.0001.mongol_invasion_cb:0 "ข้าสามารถใช้[mongol_invasion_casus_belli|E]ได้"

 central_asia.0002.t:0 "เจงกิสข่าน"
 central_asia.0002.desc:0 "ข้าถูกเรียกตัวโดยนายเหนือของข้าไปยังสภามหาคุรุลไท, การรวมตัวของผู้นำตระกูลและข้าหลวงทุกคนในอาณาจักร เรารู้ดีว่า เพราะเหตุใด, และไม่เคยมีข้อกังขาใดๆ ในการประชุมหารือตลอดทั้งคืนที่จัดขึ้นในกระโจมที่อบอวลไปด้วยควัน [genghis_khan.GetFullNameNoTooltip] คือ [genghis_khan.GetLadyLord] แห่งจักรวาล — เจงกิส ข่าน\n\nไม่มีพิธีราชาภิเษก, เพราะผู้ใดเล่าจะตัดสิน [genghis_khan.GetHerHim] ได้? แต่ ทว่า, [genghis_khan.GetSheHe] ได้ประกาศแถลงการณ์ต่อหน้ากองทัพที่มาชุมนุมของ [genghis_khan.GetHerHis]\n\n"วันนี้ เราจะยาตราทัพและพิชิตทุกสิ่งที่อยู่ใต้ฟากฟ้าอันยิ่งใหญ่!""
 central_asia.0002.a:0 "โลกจะสั่นสะเทือนต่อหน้าเรา!"

 central_asia.0003.desc:0 "ผู้แจ้งข่าวนำข่าวสารมาแจ้งแก่เราถึงผู้ปกครองคนใหม่บนทุ่งหญ้าสเตปป์ ผู้ที่เรียกตนเองว่า "เจงกิสข่าน" ผู้ประกาศตนเป็นผู้ปกครองแห่งจักรวาล กองทัพชนเผ่าเร่ร่อนที่รวมเป็นหนึ่ง ซึ่งประกอบด้วยพลม้าและนักรบกำลังหลั่งไหลออกมาเพื่อปราบปรามผู้ที่ไม่ยอมคุกเข่า\n\nแน่นอนว่านี่เป็นการกล่าวอ้างที่น่าขัน แต่ข่าวการล่มสลายของนครใหญ่ๆ ต่อหน้าผู้พิชิตอันโหดเหี้ยมก็ได้มาถึงเรา เช่นกัน..."
 central_asia.0003.a.distant:0 "อีกไม่นานเรื่องทั้งหมดนี้ก็จะผ่านไป"
 central_asia.0003.a.neighbor:0 "เราต้องเตรียมตัวให้พร้อม ความยากลำบากรออยู่เบื้องหน้า"

 central_asia.0011.t:0 "แหล่งกำเนิดแห่งทุ่งหญ้าสเตปป์"
 central_asia.0011.desc:0 "มรดกแห่งอดีตกาลมิใช่เพียงสัญลักษณ์อันทรงพลัง แต่เป็นพลังชี้นำในตัวของมันเอง ดัง เช่นที่เคยเป็นมา ชนชาติต่างๆ ที่กระจัดกระจายในดินแดนนี้จะรวมเป็นหนึ่งและถูกนำภายใต้ธงแห่งแบกเตรีย ธงของข้า\n\nด้วยเสียงกีบเท้าม้าดังกึกก้องและเสียงฝีเท้าเดินทัพ ทุกผู้ที่เดินทางระหว่างตะวันออกและตะวันตกจะรู้ว่าเราปกครองผืนฟ้าอันกว้างใหญ่"
 central_asia.0011.a:0 "เราแบกรับความแข็งแกร่งของชนชาติมากมาย!"

 central_asia.0012.desc:0 "[ROOT.Char.Custom2('RelationToMe', SCOPE.sC('bactrian_emperor'))]ของข้า, [bactrian_emperor.GetTitledFirstName], ได้อ้างสิทธิ์ในดินแดนโบราณแห่งแบกเตรีย และตั้งใจที่จะปกครองดินแดนเหล่านั้นเป็นหนึ่งเดียว ดัง เช่นที่กษัตริย์เคยทำในสมัยโบราณ\n\nสำหรับผู้ที่เดินทางระหว่างตะวันออกและตะวันตก ดินแดนนี้อาจดูเหมือนไม่เอื้ออำนวย แต่เรารู้ว่ามันเต็มไปด้วยชีวิตชีวาอย่างแท้จริง"
 central_asia.0012.a:0 "เราแบกรับความแข็งแกร่งของชนชาติมากมาย!"

 central_asia.0013.desc:0 "[bactrian_emperor.GetFullName]ได้อ้างสิทธิ์ในดินแดนทั้งหมดของแบกเตรียโบราณ และประกาศให้[bactrian_emperor.GetHerselfHimself]เป็นผู้ปกครองที่แท้จริงเพียงผู้เดียว อย่างไรก็ตาม ดูเหมือนว่าคนโง่ผู้นี้จะมองข้ามรายละเอียดเล็กน้อยไปอย่างหนึ่ง ดินแดนบางส่วนที่[bactrian_emperor.GetSheHe]อ้างสิทธิ์นั้นเป็นของข้า!"
 central_asia.0013.a:0 "[bactrian_emperor.GetSheHe|U]สามารถเอามันไปได้จากมืออันเย็นเฉียบและไร้ชีวิตของข้าเท่านั้น!"
