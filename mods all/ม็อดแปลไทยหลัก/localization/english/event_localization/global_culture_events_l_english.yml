l_english: 
 global_culture.custom.change_culture:1 "เคาน์ตีและตัวละคร [old_culture.GetName] ทั้งหมดในอาณาจักรของท่านกลายเป็น [new_culture.GetName]"
 global_culture.custom.merge_culture:1 "เคาน์ตีและตัวละคร [old_culture_1.GetName] และ [old_culture_2.GetName] ทั้งหมดในอาณาจักรของท่านกลายเป็น [new_culture.GetName]"
 global_culture.custom.keep_culture:1 "เคาน์ตีและตัวละคร [old_culture.GetName] ในอาณาจักรของท่านยังคงวัฒนธรรมเดิมไว้"
 global_culture.custom.trigger:0 "ท่านไม่ได้ควบคุมเคาน์ตี [CHARACTER.GetCulture.GetName] อย่างน้อย 80% ทั้งหมด"

 # Visigoth Split
 global_culture.0002.t:0 "ชะตากรรมของชาววิซิกอท"
 global_culture.0002.desc:0 "นานมาแล้ว บรรพชนของเราได้อพยพมายังคาบสมุทรไอบีเรียและสร้างถิ่นฐานแรกเริ่ม เราอาศัยอยู่ที่นี่มาหลายชั่วอายุคนนับ แต่นั้น ผืนดินหล่อหลอมเรามากเท่ากับที่เราหล่อหลอมผืนดิน\n\nถึงเวลาแล้วที่เราจะถามตนเองว่า เรายังคงเป็นชาววิซิกอทอยู่หรือไม่? หรือเรากลายเป็นสิ่งใหม่โดยสิ้นเชิงแล้ว?"
 global_culture.0002.a:0 "กาลเวลาเปลี่ยนแปลงไป และเราต้องเปลี่ยนแปลงตาม"
 global_culture.0002.b:0 "เราจะไม่ละทิ้งประเพณีของบรรพชน!"

 global_culture.0005.t:0 "$global_culture.0002.t$"
 global_culture.0005.desc:0 "เมื่อชาววิซิกอทอพยพเข้ามาในคาบสมุทรไอบีเรียครั้งแรก พวกเขาเป็นคนต่างถิ่นในดินแดนใหม่และแปลกตา\n\nสิ่งนี้เปลี่ยนแปลงไปตลอดหลายชั่วอายุคน เมื่อผืนดินหล่อหลอมพวกเขามากเท่ากับที่พวกเขาหล่อหลอมผืนดินเอง เมื่อเวลาผ่านไป ชุมชนต่างๆ ของชาววิซิกอทก็เริ่มแตกต่างและแยกออกจากกัน\n\nแม้จะมีมรดกร่วมกัน ชุมชนใหม่เหล่านี้ — [castilian.GetName], [catalan.GetName], [occitan.GetName] และ [andalusian.GetName] — ก็ไม่ยอมรับ ซึ่งกันและกันว่าเป็นญาติพี่น้องอีกต่อไป"
 global_culture.0005.a:0 "มีเพียงกาลเวลาเท่านั้นที่จะบอกได้ว่าสิ่งนี้ส่งผลกระทบต่อภูมิภาคอย่างไร"

 # Norse Split
 global_culture.0012.t:0 "ชะตากรรมของชาวนอร์ส"
 global_culture.0012.desc:0 "ด้วยการอาศัยอยู่ในดินแดนอันทุรกันดารแห่งสแกนดิเนเวีย ผู้คนของเรามีประวัติศาสตร์ในการสร้างความเจริญรุ่งเรืองและการอยู่รอดผ่านการค้า การปล้นสะดม และการต่อสู้ในฐานะทหารรับจ้าง\n\nเมื่อเวลาผ่านไป สิ่งนี้นำไปสู่การสะสมความมั่งคั่งอันยิ่งใหญ่ ทำให้ผู้คนของเราปักหลักและตั้งถิ่นฐานในบ้านเรือนถาวรด้วยความถี่ที่มากขึ้น\n\nบัดนี้ การตั้งถิ่นฐานเหล่านี้ได้เริ่มแตกต่างกันทางวัฒนธรรม เนื่องจากประเพณีและแม้กระทั่งภาษาของพวกเขาเปลี่ยนแปลงไปเพื่อตอบสนองความต้องการของวิถีชีวิตใหม่"
 global_culture.0012.a:0 "เราต้องสร้างความเจริญรุ่งเรืองของเราเองเป็นอันดับแรกและสำคัญที่สุด"
 global_culture.0012.b:0 "ยอมรับไม่ได้! ชาวนอร์ส #EMP จะต้อง#! คงความเป็นปึกแผ่น"

 global_culture.0015.t:0 "$global_culture.0012.t$"
 global_culture.0015.desc:0 "พ่อค้า นักปล้น และทหารรับจ้าง... ชาวนอร์สได้เดินทางจากสแกนดิเนเวียไปทั่วยุโรปและไกลกว่านั้นมานาน ทิ้งร่องรอยไว้ทุกที่ที่พวกเขาไป\n\nบัดนี้ ดูเหมือนว่ายุคนี้อาจกำลังจะสิ้นสุดลง เนื่องจากความแตกต่างทางวัฒนธรรมและความขัดแย้งระหว่างตระกูลได้นำไปสู่การก่อกำเนิดอัตลักษณ์ที่แตกต่างกันของชาว [danish.GetName], [swedish.GetName] และ [norwegian.GetName] ในหมู่พวกเขา"
 global_culture.0015.desc_norse:0 "พ่อค้า นักปล้น และทหารรับจ้าง... บรรพชนชาวนอร์สของเราได้เดินทางจากสแกนดิเนเวียไปทั่วยุโรปและไกลกว่านั้นมานาน ทิ้งร่องรอยไว้ทุกที่ที่พวกเขาไป\n\nบัดนี้ ดูเหมือนว่ายุคนี้อาจกำลังจะสิ้นสุดลง เนื่องจากมาตุภูมิของเราแตกแยกด้วยความแตกต่างทางวัฒนธรรมและความขัดแย้งระหว่างตระกูล กลายเป็นอัตลักษณ์ [danish.GetName], [swedish.GetName] และ [norwegian.GetName]"
 global_culture.0015.a:0 "สิ่งนี้มีความหมายต่ออนาคตของยุโรปอย่างไร?"
 global_culture.0015.b:0 "สิ่งนี้มีความหมายต่ออนาคตของผู้คนของเราอย่างไร?"

 # Scottish Split
 global_culture.0032.t:0 "การรุ่งเรืองของชาวสกอต"
 global_culture.0032.desc:1 "แม้ว่าเราจะมีต้นกำเนิดร่วมกับชาวแองโกล-แซกซอนอื่นๆ ตระกูลของเราที่อาศัยอยู่ในที่ราบลุ่มทางตอนเหนือของบริเตนได้เริ่มแตกต่างกันทางวัฒนธรรมและภาษา ขณะที่เราปรับตัวเข้ากับชีวิตในภูมิประเทศที่ขรุขระ\n\nผู้คนของเราจำนวนมากกำลังเรียกร้องหาอัตลักษณ์ทางวัฒนธรรมที่เป็นเอกลักษณ์ที่เราสามารถเรียกได้ว่าเป็นของเราเอง สิ่งที่เราสามารถภาคภูมิใจได้..."
 global_culture.0032.a:0 "เราคือชาวสกอต บัดนี้และตลอดไป!"
 global_culture.0032.b:0 "เราไม่ควรหันหลังให้กับเพื่อนร่วมชาติของเรา"

 global_culture.0035.t:0 "$global_culture.0032.t$"
 global_culture.0035.desc:1 "แม้ว่าพวกเขาจะมีต้นกำเนิดร่วมกับชาวแองโกล-แซกซอนอื่นๆ ตระกูลที่อาศัยอยู่ในที่ราบลุ่มทางตอนเหนือของบริเตนได้ปรับตัวเข้ากับชีวิตในภูมิประเทศที่ขรุขระ\n\nด้วยความแตกต่างทางวัฒนธรรมและภาษาจากเพื่อนร่วมชาติเดิม ชาว [scottish.GetName] เหล่านี้ได้ยอมรับอัตลักษณ์ทางวัฒนธรรมใหม่ของตนอย่างกระตือรือร้น"
 global_culture.0035.a:0 "พวกเขาจะสามารถเจริญรุ่งเรืองได้ด้วยตนเองหรือไม่?"


 # Norman Merge
 global_culture.3002.t:0 "การรุ่งเรืองของชาวนอร์มัน"
 global_culture.3002.desc:1 "ดินแดนทางตอนเหนือของฝรั่งเศสได้มอบผืนดินอันเขียวชอุ่มและอุดมสมบูรณ์ให้ผู้คนของเราได้ตั้งถิ่นฐานและขยายตัว\n\nโดยการรับเอาประเพณีบางอย่างจากคนท้องถิ่น เราจะสามารถปรับตัวเข้ากับภูมิภาคนี้ได้ดียิ่งขึ้น"
 global_culture.3002.a:0 "แด่มิตรสหายใหม่และการเริ่มต้นใหม่!"

 global_culture.3003.t:0 "$global_culture.3002.t$"
 global_culture.3003.desc:0 "เราอยู่ห่างไกลจากดินแดนที่บรรพชนชาวนอร์สของเราเรียกว่าบ้าน แต่ดินแดนทางตอนเหนือของฝรั่งเศสเหล่านี้คือสิ่งที่เราคิดว่าเป็นประเทศของเรา ในฐานะผู้นำของผู้คนของข้า เป็นความรับผิดชอบของข้าที่จะต้องสร้างความเจริญรุ่งเรืองในอนาคต และหากเราจะเจริญรุ่งเรือง เราก็ต้องปรับตัวเข้ากับสภาพแวดล้อมใหม่ของเรา เราต้องเรียนรู้จากผู้คนที่บรรพชนของพวกเขาใช้ประโยชน์จากผืนดินอันอุดมสมบูรณ์เหล่านี้\n\nด้วยประกาศิตนี้ เราจะเปลี่ยนวิถีชีวิตของเราเพื่อประโยชน์แก่ญาติพี่น้องของเรา เราจะสร้างเส้นทางใหม่ในฐานะผู้คนของเราเอง"
 global_culture.3003.a:0 "นับจากวันนี้เป็นต้นไป เราเรียกตนเองว่าชาวนอร์มัน!"

 global_culture.3005.t:0 "$global_culture.3002.t$"
 global_culture.3005.desc:0 "กลุ่มผู้ตั้งถิ่นฐานชาวนอร์สที่มาจากสแกนดิเนเวียได้ตั้งรกรากบนชายฝั่งทางตอนเหนือของฝรั่งเศส สร้างบ้านใหม่ให้ตนเองที่นั่น\n\nผู้นำของพวกเขา [norman_founder.GetTitledFirstName] ได้มีประกาศิตว่าผู้คนของ [norman_founder.GetHerHis] จะรับเอาขนบธรรมเนียมและประเพณีท้องถิ่นหลายอย่างมาใช้ เพื่อให้แน่ใจว่าพวกเขาจะเจริญรุ่งเรืองในดินแดนใหม่นี้"
 global_culture.3005.a:0 "สิ่งนี้มีความหมายต่อภูมิภาคอย่างไร?"

 global_culture.3011.t:0 "การแพร่กระจายของวัฒนธรรม [sicilian.GetNameNoTooltip]"
 global_culture.3011.desc:0 "การผสมผสานอันหลากหลายของผู้คนในอิตาลีตอนใต้และซิซิลีได้ก่อให้เกิดวัฒนธรรมที่เป็นเอกลักษณ์ ซึ่งได้รับผลกระทบจากอิทธิพลมากมาย\n\nบัดนี้เป็นที่ชัดเจนแล้วว่าผู้คนใน [county_to_change.GetName] ไม่ได้มองว่าตนเองเป็น [old_culture.GetName] อีกต่อไป แต่เป็นชาว [sicilian.GetCollectiveNoun] พื้นเมือง!"
 global_culture.3011.a:0 "พัฒนาการที่น่าสนใจ..."

 global_culture.3012.a:0 "ยอดเยี่ยม!"

 global_culture.4011.t: "การแพร่กระจายของวัฒนธรรม [goryeo.GetNameNoTooltip]"
 global_culture.4011.desc: "ผู้คนในสามอาณาจักรได้เริ่มแบ่งปันอัตลักษณ์ร่วมที่กว้างขึ้นหลังจากการรวมเป็นหนึ่ง ก่อให้เกิดวัฒนธรรมที่เป็นเอกลักษณ์ ซึ่งสะท้อนถึงอิทธิพลมากมาย\n\nบัดนี้เป็นที่ชัดเจนแล้วว่าผู้คนใน [county_to_change.GetName] ไม่ได้มองว่าตนเองเป็น [old_culture.GetName] อีกต่อไป แต่เป็นชาว [goryeo.GetCollectiveNoun] โดยกำเนิด!"
