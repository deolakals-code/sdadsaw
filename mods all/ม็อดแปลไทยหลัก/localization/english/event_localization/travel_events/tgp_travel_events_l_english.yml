l_english: 
 tgp_travel_events.0025.t: "เรื่องครอบครัวต้องมาก่อน"
 tgp_travel_events.0025.desc: ""ท่าน [ROOT.Char.GetTitleAsNameNoTooltip] หม่อมฉันอยากชมทิวทัศน์! ท่านโปรดให้รถม้าของหม่อมฉันนำหน้าได้หรือไม่? ทิวทัศน์ถูกบดบังไปหมดเมื่ออยู่ด้านหลังรถม้าของท่าน" [spouse.GetTitledFirstName] เอ่ยถามข้า ระหว่างที่หยุดพักใน [ROOT.Char.GetCurrentLocation.GetName] [spouse.GetSheHe|U] หาววอดโดยใช้มือปิดปาก [spouse.GetHerHis] พลางมองมาที่ข้าด้วยสายตาพร่ามัว \n\nก่อนที่ข้าจะมีโอกาสได้ตอบ [crusty_person.GetTitledFirstName] ก็ก้าวเข้ามาพร้อมรอยยิ้มหวานเลี่ยน "แน่นอนว่า พวกเราต้องไม่ลืมลำดับที่คู่สมรสอันเหมาะสมพึงปฏิบัติตาม ความเหมาะสมบังคับให้ [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('spouse'))] ของท่านยังคงอยู่ในตำแหน่งที่จัดไว้ให้ [spouse.GetHerHis]""
 tgp_travel_events.0025.a: "ตาม แต่ [spouse.GetTitleAsNameNoTooltip] ประสงค์"
 tgp_travel_events.0025.a.tt: "ความสัมพันธ์ของท่านกับ [spouse.GetTitledFirstName] จะมีโอกาสมีบุตรมากขึ้น"
 soulmate_travel_bond: "[CHARACTER.GetShortUIName|U] และ [TARGET_CHARACTER.GetShortUIName] ผูกพันกันระหว่างการเดินทางร่วมกัน เตาผิงในคืนนั้นช่างอบอุ่น"
 lover_travel_bond: "[CHARACTER.GetShortUIName|U] และ [TARGET_CHARACTER.GetShortUIName] ผูกพันกันระหว่างการเดินทางร่วมกัน เตาผิงในคืนนั้นช่างอบอุ่น"
 tgp_travel_events.0025.b: "[crusty_person.GetTitledFirstName] กำลังพยายามยุแยงให้เราแตกกันหรือ?"
 tgp_travel_events.0025.b.flavor: "ข้าต้องจับตาดู [crusty_person.GetHerHim] อย่างระมัดระวัง"
 tgp_travel_events.0025.b.success: "ท่านค้นพบสิ่งที่ [crusty_person.GetTitledFirstName] ซ่อนเร้นไว้จริงๆ"
 tgp_travel_events.0025.b.failure: "ท่านล้มเหลวในการค้นพบสิ่งที่ [crusty_person.GetTitledFirstName] ซ่อนเร้นไว้จริงๆ"
 tgp_travel_events.0025.c: "ที่รัก เจ้าไปนั่งด้านหลังเถิด"
 tgp_travel_events.0025.d: "ทุกคนเงียบ!"
 tgp_travel_events.0030.t: "บทกวีริมทาง"
 tgp_travel_events.0030.desc: "เมื่อมาถึงทางแยก ข้าพบเห็นบทกวีมากมายติดอยู่บนแผ่นป้ายบอกเขตแดน \n\nดูเหมือนว่าบทกวีเหล่านี้จะเขียนขึ้นโดยนักเดินทางคนอื่นๆ บางบทถึงกับกล่าวถึงสถานที่ห่างไกลอย่าง [poem_province.Custom('TerrainInspirationLoc')] แห่ง [poem_province.GetName]\n\nมีบทกวีหนึ่งที่ดึงดูดสายตาข้าเป็นพิเศษ มันพรรณนาถึง "
 tgp_travel_events.0030.desc.wanderer_poem: "การเดินทางมากมายที่กวีได้ประสบมาในชีวิต และความรุ่มรวยที่ผืนฟ้ากว้างใหญ่มอบให้แก่จิตวิญญาณ"
 tgp_travel_events.0030.desc.diplomacy_poem: "ข้อพิพาทอันเลวร้ายระหว่างสองตระกูลขุนนาง ที่แตกแยกกันด้วยเรื่องข้อพิพาทมรดก"
 tgp_travel_events.0030.desc.martial_poem: "สงครามมากมายที่กวีผู้นี้ได้ต่อสู้ ในฐานะนักรบผู้ใช้ทั้งดาบและปากกาได้อย่างเชี่ยวชาญ"
 tgp_travel_events.0030.desc.stewardship_poem: "บททดสอบมากมายของขุนนางผู้หนึ่ง ที่ต้องดิ้นรนผ่านพ้นภัยแล้งและความอดอยาก"
 tgp_travel_events.0030.desc.intrigue_poem: "ความรักอันลึกซึ้งร้อนแรงระหว่างทายาทสองคนจากตระกูลที่เป็นศัตรูกัน"
 tgp_travel_events.0030.desc.learning_poem: "การพรรณนาภาพชนบทที่โดดเด่นเป็นพิเศษ เห็นได้ชัดว่าเขียนขึ้นโดยกวีผู้เชี่ยวชาญ"
 tgp_travel_events.0030.desc.fallback: "$tgp_travel_events.0030.desc.wanderer_poem$"
 tgp_travel_events.0030.a: "ลองถอดความนัยจากบทกวีหนึ่งบท"
 tgp_travel_events.0030.a.success: "ท่านตีความบทกวีได้สำเร็จ"
 tgp_travel_events.0030.a.failure: "ท่านตีความบทกวีล้มเหลว"
 tgp_travel_events.0030.b: "ช่างแปลกตาดีแท้!"
 tgp_travel_events.0035.t: "รากฐานอ่อนแอ"
 tgp_travel_events.0035.desc: "ขณะกำลังฝ่าฟัน [ROOT.Char.Custom('TerrainStruggleLoc')] ข้าก็เห็น "
 tgp_travel_events.0035.desc.farmlands: "ทิวเขาที่ทอดตัวเป็นลูกคลื่นแห่ง [farming_county.GetProvince.GetName] เปิดกว้างอยู่เบื้องหน้าข้า"
 tgp_travel_events.0035.desc.ricefields: "นาขั้นบันไดแห่ง [farming_county.GetProvince.GetName] แผ่กว้างอยู่เบื้องหน้าข้า"
 tgp_travel_events.0035.desc.outro: "\n\nชาวนาผู้หนึ่งยืนอยู่ข้างทาง หลังก้มงออยู่เหนือล้อเกวียนที่หลุดออกจากเกวียน [farmer_char.GetHerHis] [farmer_char.GetSheHe|U] มองเห็นข้าและคณะผู้ติดตาม และสีหน้า [farmer_char.GetHerHis] ก็เปลี่ยนไปเป็นดั่งบิดามารดาผู้เข้มงวด "ท่านเกณฑ์ลูกชายข้าไปรบในสงครามของท่าน หากเขาอยู่ที่นี่ ข้าก็คงไม่ต้องทำงานตรากตรำ เช่นนี้" \n\nเมื่อมองออกไปทั่วทุ่งนา ข้าสังเกตเห็นว่ามีชาวนากระจัดกระจายอยู่บางตาเพียงใด พวกเขาคงต้องเผชิญชะตากรรมคล้ายกัน"
 tgp_travel_events.0035.a: "หยุดและช่วยเหลือ [farmer_char.GetHerHim]"
 tgp_travel_events.0035.b: "ข้าควรปรับปรุงสภาพความเป็นอยู่ให้ชาวนาของข้า"
 tgp_travel_events.0035.c: "ข้าไม่มีเวลา!"
 tgp_travel_events.0040.t: "ขนของวัว"
 tgp_travel_events.0040.desc: "ความซ้ำซากจำเจของการเดินทางยิ่งเลวร้ายลงด้วยเสียงจักจั่นที่ร้องระงมอยู่ในพงหญ้า แต่ขณะที่ข้ากำลังเลี้ยวโค้ง "
 tgp_travel_events.0040.desc.farmlands: "กำแพงหิน ข้าก็เหลือบไปเห็นชาวนาคนหนึ่งกำลังหยอกล้อเด็กอย่างแรงๆ ในทุ่งนาใกล้ๆ ถัดจากวัวตัวใหญ่เป็นพิเศษ"
 tgp_travel_events.0040.desc.ricefields: "คันนา ข้าก็เหลือบไปเห็นชาวนาคนหนึ่งกำลังหยอกล้อเด็กอย่างแรงๆ ในน้ำ ถัดจากวัวตัวใหญ่เป็นพิเศษ"
 tgp_travel_events.0040.desc.outro: "\n\n"ท่าน [ROOT.Char.GetTitleAsNameNoTooltip]!" ชาวนาตะโกนเรียกข้า "วัวตัวนี้เป็นของข้า มันถูกขโมยไปจากคอกของข้าเมื่อคืนนี้! ต้องเป็นฝีมือของ [parent.GetMotherFather] ที่ไร้ประโยชน์ [farmer_child.GetHerHis] อีกเป็นแน่ [parent.GetMotherFather] [farmer_child.GetHerHis] เป็นทั้งขี้เมาและขโมย และ [farmer_child.Custom('GirlBoy')] ผู้นี้ก็คอยปกปิดอาชญากรรมของ[parent.GetHerHis] เสมอ" \n\nข้ามองไปที่เด็ก [farmer_child.GetSheHe|U] หน้าซีดเผือดและตัวสั่นเทาทั่วร่างอย่างเห็นได้ชัด"
 tgp_travel_events.0040.a: "ประหาร [parent.GetMotherFather] [farmer_child.GetHerHis] เพื่อเป็นเยี่ยงอย่าง"
 tgp_travel_events.0040.b: "เด็กคนนี้สามารถทำงานชดใช้หนี้ในราชสำนักได้"
 tgp_travel_events.0040.c: "ปล่อยผ่านไปเถิด"
 tgp_travel_events.0041.t: "หนี้ที่ได้รับการชดใช้"
 tgp_travel_events.0041.desc: "เมื่อฤดูกาลผันเปลี่ยน การพำนักในราชสำนักของ [farmer_child.GetTitledFirstName] ก็มาถึงจุดสิ้นสุด \n\nเริ่มแรก [farmer_child.GetSheHe] รับใช้เป็นคนดูแลคอกม้าที่แข็งแรงและไว้ใจได้ "
 tgp_travel_events.0041.desc.court_position: "จากนั้นก็ก้าวหน้าสู่ตำแหน่ง [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('farmer_child'))] การทำงานหนัก [farmer_child.GetHerHis] ได้พัฒนาการศึกษา [farmer_child.GetHerHis] และเปลี่ยน [farmer_child.GetHerHim] ให้กลายเป็น [farmer_child.GetWomanMan] ผู้น่าเกรงขาม!"
 tgp_travel_events.0041.desc.knight: "จากนั้นก็เปลี่ยนไปเป็นอัศวินในกองทัพของข้า"
 tgp_travel_events.0041.desc.stables: "และทำงานอย่างใกล้ชิดกับม้าตลอดหลายปี เลี้ยงดูม้าศึกชั้นดีได้มากมาย"
 tgp_travel_events.0041.desc.kitchens: "จากนั้นก็ย้ายไปทำงานใต้บังคับบัญชาของพ่อครัวในห้องครัว ขัดกระทะ และปอกผักนับไม่ถ้วน"
 tgp_travel_events.0041.desc.study: "จากนั้นก็ย้ายไปทำงานใต้อาณัติของเหล่าบัณฑิตในราชสำนัก ถือตลับหมึก และดูแลหอจดหมายเหตุ"
 tgp_travel_events.0041.desc.fallback: "$tgp_travel_events.0041.desc.study$"
 tgp_travel_events.0041.desc.alive: "[farmer_child.GetSheHe|U] ได้เรียนรู้หลายสิ่งอย่างชัดเจนระหว่างการพำนัก [farmer_child.GetHerHis] \n\nบัดนี้ ถึงเวลาปลดปล่อย [farmer_child.GetHerHim] กลับไปหา [parent.GetMotherFather] ขี้เมา [farmer_child.GetHerHis] และทุ่งนาแห่ง [thieving_county.GetProvince.GetName] แล้ว"
 tgp_travel_events.0041.desc.dead: "\n\n[parent.GetMotherFather] ขี้เมา [farmer_child.GetHerHis] ได้สิ้นใจไปแล้ว และเป็นหน้าที่ของ [farmer_child.GetTitledFirstName] ที่ต้องกลับไปดูแลที่ดินของตระกูล"
 tgp_travel_events.0041.a: "ข้ามั่นใจว่า [farmer_child.GetSheHe] จะทำได้ดีเมื่อกลับบ้านไป"
 tgp_travel_events.0041.tt_pay_first: "#weak... but I must pay homage to the family as recompense.#!"
 tgp_travel_events.0041.c: "[farmer_child.GetTitledFirstName] ควรจะยังคงเป็นนายกองม้าของข้าต่อไป"
 tgp_travel_events.0041.d: "[farmer_child.GetTitledFirstName] ควรจะยังคงเป็นพนักงานเชิญถ้วยของข้าต่อไป"
 tgp_travel_events.0041.e: "[farmer_child.GetTitledFirstName] ควรจะยังคงเป็นกวีประจำราชสำนักของข้าต่อไป"
 tgp_travel_events.0041.f: "[farmer_child.GetTitledFirstName] ควรจะยังคงอยู่ในราชสำนักในฐานะครูสอนพิเศษต่อไป"
 tgp_travel_events.0041.g: "[farmer_child.GetTitledFirstName] จะยังคงรับใช้ข้าต่อไป!"
 tgp_travel_events.0041.g.tt: "[farmer_child.GetTitledFirstName] ยังคงรับใช้ในฐานะ [THIS.Char.Custom2('RelationToMeShort', SCOPE.sC('farmer_child'))] ของท่านต่อไป"
 tgp_travel_events.0045.t: "วิธีการทำฟาร์มที่ยังไม่พัฒนา"
 tgp_travel_events.0045.desc: "จากสันเขาที่มองเห็นทุ่งนาของ [foreign_county.GetName] ข้าสังเกตเห็นชาวนากำลังตรากตรำทำงานในดินและหลังสู้ฟ้าหน้าสู้ดินขณะที่พวกเขาหว่านเมล็ดพืชด้วยมือ \n\nเท่าที่ข้าจำความได้ พวกเราใช้เครื่องเจาะเมล็ดพันธุ์ที่บ้านเกิด ดูเหมือนว่าชาวตะวันตกเหล่านี้จะยังไม่ได้ทำการค้นพบ เช่นนั้น"
 tgp_travel_events.0045.a: "บางทีข้าอาจจะจัดการค้าขายกับผู้ปกครองของพวกเขาได้"
 tgp_travel_events.0045.b: "ข้าสามารถพยายามสอนวิถีทางของเราให้พวกเขาได้"
 tgp_travel_events.0045.b.flavor: "หวังว่าท่าทางมือที่ชัดเจนและภาพวาดจะช่วยข้ามผ่านกำแพงภาษาได้"
 tgp_travel_events.0045.b.success: "ข้าได้แสดงให้เห็นถึงความเหนือกว่าของวัฒนธรรมขงจื๊อที่มีการศึกษาและนวัตกรรม"
 tgp_travel_events.0045.b.failure: "การแลกเปลี่ยนนี้ก่อให้เกิดความทึ่งอยู่บ้าง แต่ข้าล้มเหลวในการสื่อสารประเด็นของข้า"
 cultural_acceptance_taught_methods: "[cultural_acceptance|E] ระหว่างชาว [foreign_county.GetCulture.GetCollectiveNoun] และชาว [foreign_county.GetCulture.GetCollectiveNoun] เพิ่มขึ้น [minor_cultural_acceptance_gain]"
 tgp_travel_events.0045.c: "นี่ไม่ใช่ธุระกงการของข้า"
