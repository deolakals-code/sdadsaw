 travel_danger_events.1011.c_frostbite_treatment_none_success:0 "[frostbite_victim.GetSheHe|U] ทนได้ครั้งหนึ่ง [frostbite_victim.GetSheHe] จะทำได้อีกครั้ง!"
 travel_danger_events.1011.c_frostbite_treatment_none_failure:0 "ครั้งนี้ [frostbite_victim.GetSheHe] จะไม่เป็นไร เราต้องไปเดี๋ยวนี้!"

 travel_danger_events.1012.t:0 "$travel_danger_prefix$ ผลไม้ล่อใจ"
 travel_danger_events.1012.desc:0 "เส้นทางของเรานำเราผ่านส่วนที่อันตรายของ [ROOT.Char.GetCurrentLocation.GetName] ขณะที่ข้าสอดส่องหาอันตรายข้างหน้า พุ่มไม้ที่สั่นไหวก็ดึงดูดความสนใจของข้า อาจเป็นสัตว์ป่าหรือไม่? ขณะที่ข้าเตรียมพร้อมรับการปะทะ [poisonous_plant_eater.GetFirstName] ก็กระโดดออกมาจากพุ่มไม้แทน ถือต้นไม้อยู่\n\n"เจ้า ทำให้ข้าตกใจ [poisonous_plant_eater.GetFirstNameNoTooltip]! อย่างไรก็ตาม ให้ข้าดูหน่อยว่าเจ้ามีอะไรที่นี่ ผลไม้ชนิดหนึ่งหรือ?"
 travel_danger_events.1012.desc_food_taster:0 "$travel_danger_events.1012.desc$ เราควรถาม [food_taster.GetFirstName] เกี่ยวกับเรื่องนี้"\n\n"ข้าต้องบอกว่า มันเป็นของแปลกที่น่าสนใจและไม่มีอะไรบ่งบอกถึงอันตรายในทันที อย่างไรก็ตาม..." "ถ้าอย่างนั้นก็ปลอดภัยที่จะกินสินะ!" [poisonous_plant_eater.GetFirstNameNoTooltip] ขัดจังหวะอย่างรวดเร็ว"
 travel_danger_events.1012.desc_unknown:0 "$travel_danger_events.1012.desc$" ข้าอุทาน\n\n"ใช่! มันดูและมีกลิ่น #EMP หอมอร่อยมาก#! ข้าสงสัยว่ารสชาติจะเป็นอย่างไร? บางที ข้าจะลองชิมสักคำเล็กๆ?" [poisonous_plant_eater.GetSheHe] กล่าว"
 travel_danger_events.1012.desc_again:0 "อีกครั้งที่เส้นทางข้างหน้าอันตราย ดังนั้นเพื่อความปลอดภัยเราจึงต้องพักค้างคืน ขณะที่คนอื่นๆ ตั้งค่าย ข้าจับได้ว่า [poisonous_plant_eater.GetFirstName] กำลังเก็บผลไม้ที่ไม่รู้จักอีกชนิดหนึ่ง\n\n"ข้าชื่นชมความอยากรู้อยากเห็นของเจ้า [poisonous_plant_eater.GetFirstNameNoTooltip]"\n\nข้ายิ้ม แต่ [poisonous_plant_eater.GetSheHe] กลับมองข้าอย่างซุกซน แล้วก็โพล่งออกมาว่า:\n\n"ข้าขอโทษ [poisonous_plant_eater.Custom2('RelationToMe', ROOT.Char)] ของข้า แต่ข้าอดใจไม่ไหว!" ขณะที่ [poisonous_plant_eater.GetSheHe] พยายามฝังฟันของ [poisonous_plant_eater.GetHerHis] ลงในผลไม้"
 travel_danger_events.1012.a:0 ""เดี๋ยวก่อน จะเป็นอย่างไรถ้ามันมีพิษ?!""
 travel_danger_events.1012.a_again:0 ""หยุดเอา #EMP ทุกอย่าง#! เข้าปากเสียที!""
 travel_danger_events.1012.a.tt:0 "ท่านคว้าต้นไม้แล้วโยนทิ้งไป"
 travel_danger_events.1012.regular_plant:0 "มันเป็นพืชที่ไม่เป็นอันตรายเลย"
 travel_danger_events.1012.touched_poisonous_plant:0 "ผื่นปรากฏขึ้นในบริเวณที่สัมผัสกับพืช"
 travel_danger_events.1012.b:0 "ให้ [poisonous_plant_eater.GetFirstNameNoTooltip] กินมัน"
 travel_danger_events.1012.ate_poisonous_plant:0 "มัน ทำให้ปวดท้องอย่างรุนแรง"
 travel_danger_events.1012.ate_delicious_plant:0 "มันช่วยฟื้นฟูร่างกายและจิตใจ"
 travel_danger_events.1012.c:0 ""ต่อเมื่อข้าได้ลองก่อน!""
 travel_danger_events.1012.c.tt:0 "ท่านหยิบผลไม้มากิน"
 
 travel_danger_events.1013.t:0 "$travel_danger_prefix$ หนีไปหรือหลงทาง?"
 travel_danger_events.1013.desc:0 "ขณะที่เราสามารถผ่านเส้นทางอันตรายใน [ROOT.Char.GetCurrentLocation.GetName] ได้ ทันใดนั้นความรู้สึกแปลกๆ ว่ามีใครบางคนหายไปก็รบกวนข้า ข้าจำไม่ได้ว่าเห็น [runaway_character.GetFirstName] ตลอดทั้งวัน\n\n"
 travel_danger_events.1013.desc_rival:0 "$travel_danger_events.1013.desc$ไม่ใช่ว่าข้าบ่น การไม่ต้องเห็นหน้าคู่ปรับของข้านับเป็นวันดีๆ ในความคิดของข้า อย่างไรก็ตาม มันอาจ ทำให้สหายคนอื่นๆ ของข้ากลัวที่จะเดินทางต่อไปใน [ROOT.Char.GetCurrentLocation.Custom('TerrainTypeProvince')]"
 travel_danger_events.1013.desc_lover:0 "$travel_danger_events.1013.desc$ในขณะเดียวกัน ผู้คนต่างพูดซ้ำๆ ถึงข่าวลือว่า [runaway_character.GetSheHe] ต้องการพบกับ [current_location_holder.GetTitledFirstName] ข้ารู้ว่าเรากำลังผ่านดินแดนของ [current_location_holder.GetHerHis] แต่ข้าไม่แน่ใจว่าทำไม [runaway_character.GetFirstNameNoTooltip] ถึงทำ เช่นนั้น? ข้าพนันได้เลยว่า [runaway_character.GetSheHe] แค่หลงทางอยู่ที่ไหนสักแห่งใน [ROOT.Char.GetCurrentLocation.Custom('TerrainTypeProvince')] ในขณะที่เรากำลังพูดกันอยู่!"
 travel_danger_events.1013.desc_knight:0 "$travel_danger_events.1013.desc$เขาทำหน้าที่ระวังหลังขณะที่เราเข้าสู่จังหวัดที่เสียหายจากสงคราม ข้าคิดว่านั่นไม่ใช่ความคิดที่ดีที่สุดเมื่อรู้ถึงความกล้าหาญของ [runaway_character.GetHerHis] [runaway_character.GetSheHe] อาจจะกำลังมุ่งหน้าไปแนวหน้าแล้วก็ได้! เว้น แต่ว่า [runaway_character.GetSheHe] แค่หลงทางอยู่ที่ไหนสักแห่งใน [ROOT.Char.GetCurrentLocation.Custom('TerrainTypeProvince')]?"
 travel_danger_events.1013.desc_child:0 "$travel_danger_events.1013.desc$นั่นน่าเป็นห่วง [runaway_character.GetSheHe] ยังเป็นแค่เด็ก! จะเป็นอย่างไรถ้า [runaway_character.GetSheHe] หลงทางอยู่ที่ไหนสักแห่งใน [ROOT.Char.GetCurrentLocation.Custom('TerrainTypeProvince')] ระหว่างทาง? [runaway_character.GetSheHe|U] อาจจะเหงา และที่สำคัญกว่านั้นคือ กำลังหิวโหย!"
 travel_danger_events.1013.a:0 "จัดตั้งกลุ่มค้นหาสำหรับ [runaway_character.GetHerHim]"
 travel_danger_events.1013.success:0 "กลุ่มค้นหาพบ [runaway_character.GetFirstNameNoTooltip]"
 travel_danger_events.1013.success_root:0 "ท่านพบ [runaway_character.GetFirstNameNoTooltip]"
 travel_danger_events.1013.failure:0 "ไม่พบ [runaway_character.GetFirstNameNoTooltip] ที่ไหนเลย"
 travel_danger_events.1013.failure_root:0 "ท่านเดินเตร็ดเตร่อยู่ใน [ROOT.Char.GetCurrentLocation.Custom('TerrainTypeProvince')] อย่างไร้จุดหมาย"
 travel_danger_events.1013.runaway_joins:0 "[runaway_character.GetFirstNameNoTooltip] เข้าร่วมราชสำนักของท่าน"
 travel_danger_events.1013.runaway_return:0 "กลับเข้าร่วม [entourage|E]"
 travel_danger_events.1013.b:0 "ข้าจะหา [runaway_character.GetHerHim] เอง!"
