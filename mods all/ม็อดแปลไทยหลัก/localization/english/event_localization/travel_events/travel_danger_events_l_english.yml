 travel_danger_events.1011.b_root_knows_winter:0 "ข้าเองก็เป็นผู้เชี่ยวชาญด้านฤดูหนาวอยู่บ้าง"
 travel_danger_events.1011.b_frostbite_treatment_root_failure:0 "บางทีข้าอาจจะทำพลาดในครั้งแรก แต่ตอนนี้ข้ารู้ดีขึ้นแล้ว!"
 travel_danger_events.1011.b_physician_knows_winter:0 "[court_physician.GetNameNoTooltip] รู้เรื่องฤดูหนาวดีกว่าพวกเราทุกคน!"
 travel_danger_events.1011.b_frostbite_treatment_physician_failure:0 "บางที [court_physician.GetNameNoTooltip] อาจจะทำได้ดีกว่านี้ในครั้งนี้?"
