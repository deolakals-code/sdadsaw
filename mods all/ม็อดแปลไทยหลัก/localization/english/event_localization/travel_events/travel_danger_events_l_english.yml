 travel_danger_events.1020.t.wetlands: "ความวิบัติ"
 travel_danger_events.1020.t.floodplains: "ความหวาดกลัว"
 travel_danger_events.1020.t.jungle: "ภยันตราย"
 travel_danger_events.1020.t.taiga: "ความหวาดผวา"
 travel_danger_events.1020.desc.intro: "เราเดินทางรอนแรมมาหลายวันเพื่อไปยังจุดหมายปลายทาง ผู้ติดตามเหนื่อยล้า และม้าศึกคู่ใจของข้า [ROOT.Char.Custom('WarhorseStoryName')] ก็ เช่นกัน ขณะที่ข้ากำลังจะลงจากหลังม้า มีบางอย่าง ทำให้ [ROOT.Char.Custom('HorseStoryMareStallion')] ของข้าตกใจ และ [ROOT.Char.Custom('HorseStorySheHe')] ก็วิ่งเตลิดไปในทิศทางสุ่ม ข้าพยายามเกาะไว้สุดชีวิตก่อนจะถูกโยนลงพื้นเสียงดังตุ้บ\n\nขณะที่ข้าค่อย ๆ ลุกขึ้นจากการตก [ROOT.Char.Custom('WarhorseStoryName')] ก็เริ่มส่งเสียงร้องในระยะไกล และผู้ติดตามทั้งหมดของข้าก็วิ่งตามไปติด ๆ เพื่อดูว่าเกิดอะไรขึ้น\n\nม้าของข้ากำลังต่อสู้เพื่อชีวิตของ [ROOT.Char.Custom('HorseStoryHerHis')]#!"
 travel_danger_events.1020.wetlands: "หนองบึงกำลังกลืนกิน [ROOT.Char.Custom('HorseStoryHerHim')] ทีละน้อย"
 travel_danger_events.1020.floodplains: "ย่ำฝ่ากระแสน้ำไปอย่างไร้ผล"
 travel_danger_events.1020.jungle: "ทรายไหลลงข้างลำตัวของ [ROOT.Char.Custom('HorseStoryHerHis')] จมลงสู่หลุมทรายอย่างช้า ๆ แต่มั่นคง"
 travel_danger_events.1020.taiga: "พยายามหาทางออกจากหลุมยุบ — ความพยายามที่ไร้ผล"
 travel_danger_events.1020.a: ""สู้กับมัน [ROOT.Char.Custom('WarhorseStoryName')]!""
 travel_danger_events.1020.a.success: "ท่านช่วย [ROOT.Char.Custom('WarhorseStoryName')] ไว้ได้"
 travel_danger_events.1020.a.failure: "[ROOT.Char.Custom('WarhorseStoryName')] ถูกดึงลงไป"
 travel_danger_events.1020.b: ""อย่ามัว แต่ยืนอยู่ตรงนั้น ทำ #EMP อะไรสักอย่าง#สิ!""
 travel_danger_events.1020.b.success: "[horse_helper.GetFirstNameNoTooltip] ช่วย [ROOT.Char.Custom('WarhorseStoryName')] ไว้ได้"
 travel_danger_events.1020.b.failure: "ทั้ง [horse_helper.GetFirstNameNoTooltip] และ [ROOT.Char.Custom('WarhorseStoryName')] ถูกดึงลงไป"
 travel_danger_events.1020.c: "ไม่มีอะไรที่เราทำได้..."
