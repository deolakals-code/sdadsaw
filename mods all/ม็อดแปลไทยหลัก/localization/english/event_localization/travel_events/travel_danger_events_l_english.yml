l_english: 

# Travel Danger Event Prefix
 travel_danger_prefix:0 "อันตราย:"

#travel_danger_events.0001.t: "Bandits!"
#travel_danger_events.0001.desc: "You have encountered bandits because of low control!"
#travel_danger_events.0001.a: "Run"
#travel_danger_events.0001.b: "Fight"

# Hills Terrain
 travel_danger_events.1000.t:1 "$travel_danger_prefix$ เรื่องเล็กกลายเป็นเรื่องใหญ่"
 travel_danger_events.1000.desc:0 "ถนนกลายเป็นเนินเขาอย่างไม่น่าเชื่อในช่วงสองสามชั่วโมงที่ผ่านมา และทุกคนเริ่มเหนื่อยล้า เมื่อมองไม่เห็นจุดสิ้นสุดของเนินเขา [travel_leader.GetFirstName] [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('travel_leader'))] ของข้า ก็เข้ามาหาและกล่าวว่า:\n\n"[ROOT.Char.Custom('FormOfAddressForLiege')|U] สัตว์พาหนะของเราไม่สามารถไปต่อ เช่นนี้ได้อีกนาน สัตว์ที่น่าสงสารเหล่านี้ต้องการพักผ่อน มิฉะนั้นข้าเกรงว่าพวกมันจะล้มลง! เราต้องหยุดพัก!"\n\n[travel_leader.GetSheHe|U] รู้ดีว่านี่จะ ทำให้การเดินทางของเราไปยัง [destination.GetName] ล่าช้า..."
 travel_danger_events.1000.a:0 "[travel_leader.GetSheHe|U] พูดถูก เป็นการฉลาดที่จะพักผ่อน"
 travel_danger_events.1000.b:0 ""ข้าจะไม่ยอมให้ล่าช้า เราเดินทางต่อไป!""

 travel_danger_events.1001.t:0 "$travel_danger_events.1000.t$"
 travel_danger_events.1001.desc:0 "ข้าเร่งเดินทางต่อไปอีกเล็กน้อย ตั้งใจจะไปให้ถึง [destination.GetName] ตามแผน ขณะที่เราขึ้นสู่ยอดเนินที่ใหญ่ที่สุด ข้าคิดว่าความยากลำบากของเราอาจจะสิ้นสุดลงในที่สุด เมื่อ...\n\n#EMP ตุ้บ! ... ตุ้บ, ตุ้บ, ตุ้บ!#!\n\nข้าหันไปมองหาต้นตอของเสียงและต้องตกตะลึงเมื่อเห็นสัตว์พาหนะทั้งหมดของเราเริ่มล้มลงกับพื้น! ดูเหมือนว่า [travel_leader.GetFirstName] พูดถูก... สัตว์ที่น่าสงสารเหล่านี้ทนความเครียดได้เพียงเท่านี้ ข้าควรจะฟังเมื่อมีโอกาส"
 travel_danger_events.1001.a:0 ""[travel_leader.GetFirstNameNoTooltip], ไปยังเมืองที่ใกล้ที่สุดและซื้อสัตว์พาหนะใหม่มา""
 travel_danger_events.1001.b:0 ""เราเดินทางต่อด้วยเท้า!""

 travel_danger_events.1002.t:1 "$travel_danger_prefix$ ทางลาดชันอันตราย"
 travel_danger_events.1002.desc:0 "ขณะที่เราเดินทางผ่าน [current_location.GetName] ข้าชื่นชมทิวทัศน์อันงดงามจากไหล่เขา เมื่อข้าละสายตากลับมามองเส้นทางหินข้างหน้า ข้าตระหนักว่าเราถูกล้อมรอบด้วยกลุ่มคนพาล! [bandit.GetWomanMan] ที่น่าเกรงขามคนหนึ่ง ซึ่งน่าจะเป็นหัวหน้าของพวกมัน ก้าวออกมาขวางหน้ากองคาราวานของเรา\n\n"การเดินทางผ่านภูเขาเหล่านี้มีค่าใช้จ่าย ไม่ว่าเจ้าจะเป็นใครก็ตาม ใครก็ตามที่ผ่านภูเขาของข้าต้องจ่าย""
 travel_danger_events.1002.a:0 ""มาคุยกันดีๆ เถอะ""
 travel_danger_events.1002.a.success:0 "ท่านเกลี้ยกล่อมโจรป่าสำเร็จ"
 travel_danger_events.1002.a.success.desc:0 "ท่านและคณะผู้ติดตามเดินทางผ่านช่องเขาได้อย่างอิสระ"
 travel_danger_events.1002.a.failure:0 "ท่านเกลี้ยกล่อมโจรป่าไม่สำเร็จ"
 travel_danger_events.1002.a.failure.desc:0 "ท่านจ่ายเงินให้โจรป่าเพื่ออนุญาตให้ผ่านทาง"
 travel_danger_events.1002.b:0 ""ข้าจะไม่ยอมแพ้ง่ายๆ #EMP สู้!#!""
 travel_danger_events.1002.b.success:1 "ท่านเอาชนะโจรป่าได้"
 travel_danger_events.1002.b.success.desc:0 "$travel_danger_events.1002.a.success.desc$"
 travel_danger_events.1002.b.failure:1 "โจรป่าเอาชนะท่านได้"
 travel_danger_events.1002.b.failure.desc:0 "$travel_danger_events.1002.a.failure.desc$"
 travel_danger_events.1002.c:0 ""ทหาร! จัดการเจ้าพวกโง่เง่าเหล่านี้!""
 travel_danger_events.1002.c.tt:0 "ท่านส่งทหารองครักษ์จาก [travel_option|E] ไปจัดการกับโจรป่า"
 travel_danger_events.1002.d:0 ""จะเป็นอย่างไรถ้าข้าจ้างพวกเจ้าให้นำทางเราผ่านภูเขาแทน?"
 travel_danger_events.1002.e:0 "มันเป็นดินแดนของพวกเขา..."

 travel_danger_events.1003.t:1 "$travel_danger_prefix$ ก้นบึงที่เปียกแฉะ"
 travel_danger_events.1003.desc:0 "ข้ารู้ว่าเราต้องเดินทางอย่างระมัดระวังผ่านหนองบึงของ [current_location.GetName] สถานที่น่าขนลุกแห่งนี้ ทำให้ข้าไม่สบายใจอย่างยิ่งและมีอันตรายมากมายที่ต้องระวัง คณะผู้ติดตามของข้าได้รับคำสั่งให้ใช้ความระมัดระวังทุกอย่างตามนั้น\n\nเมื่อมองย้อนกลับไปจากหัวขบวน ข้านับจำนวนสหายของข้า...\n\n#EMP พวกเราหายไปคนหนึ่ง!#!"
 travel_danger_events.1003.a:0 "ข้าสามารถส่งนายกองคาราวานของข้า [travel_leader.GetFirstNameNoTooltip] ไปตามหาผู้พลัดหลงได้"
 travel_danger_events.1003.b.success:0 "พบสหายที่หายไป"
 travel_danger_events.1003.b.success.desc:0 "[missing_companion.GetShortUIName] กลับเข้าร่วมคณะผู้ติดตามของท่าน"
 travel_danger_events.1003.b.failure:0 "สหายที่หายไปสูญหาย"
 travel_danger_events.1003.b:0 "พวกเขาคงตายไปแล้ว ทิ้งพวกเขาไว้"

 travel_danger_events.1006.t:1 "$travel_danger_prefix$ ต้นไม้ที่คุ้นเคย"
 travel_danger_events.1006.desc:0 ""เราไม่เคยเห็นต้นไม้ใหญ่นั่นมาก่อนหรือ? ข้าสาบานได้ว่าเรากำลังเดินวนเป็นวงกลม!" นายกองคาราวานของข้า [travel_leader.GetName] ตะโกน\n\nบางที [travel_leader.GetSheHe] อาจจะพูดถูก... เราไม่เห็นวี่แววว่าจะออกจากป่านี้ได้เลยเป็นเวลาหลายชั่วโมงแล้ว เรายังคงอยู่ #EMP ใน#! [current_location.GetName] หรือไม่? แนวต้นไม้ที่หนาทึบ ทำให้ไม่สามารถบอกเวลาของวัน หรือแม้แต่ทิศทางที่เรากำลังมุ่งหน้าไปได้\n\nด้วยอัตรานี้ เราจะไม่มีวันไปถึง [destination.GetName]..."
 travel_danger_events.1006.a:0 "ข้ารู้ #EMP แน่ชัด#! ว่าเราอยู่ที่ไหน!"
 travel_danger_events.1006.a.success:0 "ท่านพบเส้นทางที่ถูกต้อง"
 travel_danger_events.1006.a.success.desc:0 "ได้รับประสบการณ์ด้านอันตราย"
 travel_danger_events.1006.a.failure:0 "ท่านพยายามหาเส้นทางที่ถูกต้องอย่างยากลำบาก"
 travel_danger_events.1006.b:0 "ส่งคนไปหาผู้นำทางท้องถิ่น"
 travel_danger_events.1006.b.hire_guide:0 "ท่านค้นหาผู้นำทางเพื่อจ้าง"
 travel_danger_events.1006.c:0 "ส่งหน่วยสอดแนมล่วงหน้าไป"
 travel_danger_events.1006.c.major_speed_decrease:0 "การเดินทางของท่านล่าช้าอย่างมาก"
 travel_danger_events.1006.c.minor_speed_decrease:0 "การเดินทางของท่านล่าช้าเล็กน้อย"

 travel_danger_events.1007.t:1 "$travel_danger_prefix$ ไม่มีน้ำสักหยด"
 travel_danger_events.1007.desc:0 "การเดินทางของเราไปยัง [destination.GetName] โชคไม่ดีที่นำเราผ่านดินแดนรกร้างของ [current_location.GetName] โดยตรง เราไม่ได้เตรียมพร้อมที่จะเดินทางไกลขนาดนี้โดยไม่มีแหล่งน้ำเลย และสหายของข้าหลายคนเริ่มดูแย่เหมือน [ROOT.Char.Custom('RegionalRootVegetablePlural')] แห้งๆ\n\nข้าต้องทำอะไรบางอย่าง... และต้องเร็ว!"
 travel_danger_events.1007.a:0 "ข้ารู้จักโอเอซิสใกล้ๆ ที่อาจเป็นทางรอดของเรา"
 travel_danger_events.1007.a.tt:0 "แผนการเดินทางของท่านจะถูกเปลี่ยนเส้นทางไปยังโอเอซิส"
 travel_danger_events.1007.b:0 "[ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('water_hider'))] ของข้า [water_hider.GetFirstNameNoTooltip] ดื่มน้ำเหมือน #EMP ม้า#! ไม่เอาอีกแล้ว!"
 travel_danger_events.1007.b.success:0 "สหายได้รับแรงบันดาลใจ"
 travel_danger_events.1007.b.success.desc:0 "[water_hider.GetFirstName] ตาย เพราะกระหายน้ำ"
 travel_danger_events.1007.b.failure:0 "ไม่สามารถสร้างแรงบันดาลใจให้สหายได้"
 travel_danger_events.1007.b.failure.desc:0 "[water_hider.GetFirstName] ขาดน้ำอย่างรุนแรง"
 travel_danger_events.1007.c:0 "เราต้องเดินทางต่อไป"
 travel_danger_events.1007.c.tt:0 "ท่านสอบปากคำ [water_hider.GetFirstName] เกี่ยวกับแหล่งน้ำลับ"
 travel_danger_events.1007.c.success:0 "พบน้ำจากการสอบปากคำ"
 travel_danger_events.1007.c.failure:0 "ไม่พบน้ำจากการสอบปากคำ"
 dehydrated_modifier: "ขาดน้ำ"
 dehydrated_modifier_desc: "ตัวละครนี้ขาดน้ำหลังจากเดินทางในทะเลทราย"
 travel_danger_events.1007.d: "โชคดีที่เรานำน้ำสำรองมาด้วย!"

 travel_danger_events.1008.t:1 "$travel_danger_prefix$ ผลพวง"
 travel_danger_events.1008.desc:0 "การเดินทางของเราได้นำเราผ่าน [current_location.GetName] สิ่งที่เคยเป็น [current_location_barony.Custom('BaronyTownType')] ที่น่ารักได้กลายเป็นเพียงเงาของสิ่งที่เคยเป็น\n\nกองซากปรักหักพังที่เคยเป็นบ้านเรือนคุกรุ่นไปด้วยควัน ถูกบดขยี้จากการทำลายล้างด้วยน้ำมือของกองทัพที่โหดเหี้ยม [zombie.GetWomanMan] คนหนึ่ง ร้องไห้และเปรอะเปื้อนไปด้วยฝุ่น กำลังค้นหาสิ่งที่อาจเคยเป็นฟาร์มเพื่อหาสิ่งของที่เหลืออยู่ของ [zombie.GetHerHis]\n\n[zombie.GetSheHe|U] สังเกตเห็นเรา ซึ่งดูแปลกแยกอย่างชัดเจนในดินแดนรกร้างนี้ และพุ่งเข้าหาคณะผู้ติดตามของเรา!"
 travel_danger_events.1008.a:0 ""ทหาร! หยุด [zombie.GetWomanMan] นั่น!""
 travel_danger_events.1008.a.tt:0 "[zombie.GetFirstNameNoTooltip] ถูกสังหารตามคำสั่งของท่าน"
 travel_danger_events.1008.b:0 "ข้ามั่นใจว่า [zombie.GetSheHe] ไม่ได้มีเจตนาร้ายต่อเรา"
 travel_danger_events.1008.c:0 ""#EMP หยุด!#! รับสิ่งนี้ไปแล้วไปตามทางของเจ้า""
 travel_danger_events.1008.good_intentions:0 "[zombie.GetFirstNameNoTooltip] ไม่มีเจตนาร้าย"
 travel_danger_events.1008.bad_intentions:0 "[zombie.GetFirstNameNoTooltip] มีเจตนาร้าย"

 travel_danger_events.1009.t:0 "$travel_danger_events.1008.t$, เจตนาดี"
 travel_danger_events.1009.desc:0 "[zombie.GetWomanMan] ผู้ผอมโซรีบเคลื่อนที่ข้ามพื้นดินระหว่างเรา โดยไม่สนใจร่างกายนับสิบที่เกลื่อนอยู่บนพื้นเลย [zombie.GetSheHe|U] ก้มศีรษะ [zombie.GetHerHis] และกล่าวกับข้า:\n\n "[ROOT.Char.Custom('FormOfAddressForLiege')|U] บ้านของข้าถูกเผาจนวอดวายและการทำมาหากินของข้าก็ถูกพรากไป ข้ายอมจำนนต่อความเมตตาของท่าน #EMP ได้โปรดช่วยข้าด้วย!#!""
 travel_danger_events.1009.a:0 ""เจ้าคนน่าสงสาร...""
 travel_danger_events.1009.b:0 "#EMP ฆ่า [zombie.GetHerHim] เสียเถอะ!#!"
 travel_danger_events.1009.c:0 ""ข้าจะรับเจ้าไว้ในความคุ้มครองของข้า!""
 travel_danger_events.1009.d:0 "ไม่ใช่ปัญหาของข้าจริงๆ ใช่ไหม?"

 travel_danger_events.1010.t:0 "$travel_danger_events.1008.t$, เจตนาร้าย"
 travel_danger_events.1010.desc:0 "[zombie.GetWomanMan] ผอมโซรีบเข้ามาใกล้เราอย่างรวดเร็ว โดยไม่สนใจร่างกายนับสิบที่เกลื่อนกลาดอยู่บนพื้น [zombie.GetSheHe|U] พุ่งเข้าใส่ข้า ด้วยปากที่แยกเขี้ยวและแววตา [zombie.GetHerHis] ที่เต็มไปด้วยความบ้าคลั่ง"
 travel_danger_events.1010.a:0 ""ข้าจัดการเองได้!""
 travel_danger_events.1010.a.success:0 "ขับไล่คนน่าสังเวชได้"
 travel_danger_events.1010.a.failure:0 "บาดเจ็บโดยคนน่าสังเวช"
 travel_danger_events.1010.b:0 "#EMP ทหาร!#!"
 travel_danger_events.1010.b.success:0 "ขับไล่คนน่าสังเวชได้"
 travel_danger_events.1010.b.failure:0 "สมาชิกคณะผู้ติดตามบาดเจ็บ"
 travel_danger_events.1010.tt:0 "[zombie.GetFirstNameNoTooltip] หนีไปอย่างรวดเร็ว"

 travel_danger_events.1011.t:0 "$travel_danger_prefix$ ถูกความเย็นกัด"
 travel_danger_events.1011.t_twice:0 "$travel_danger_prefix$ ทรมานจากความเย็น"
 travel_danger_events.1011.t_thrice:0 "$travel_danger_prefix$ แผลน้ำแข็งกัดถึงตาย"
 travel_danger_events.1011.desc:0 "หิมะตกมาสองสามวันแล้วและความหนาวเย็นก็ทนไม่ได้ ข้ามองไปรอบๆ และเห็นว่าคณะผู้ติดตามของข้าก็กำลังลำบาก เช่นกัน ดังนั้นข้าจึงตัดสินใจเดินทางด้วยเท้าไปพร้อมกับพวกเขา หลังจากที่เราเดินฝ่าพายุหิมะไปอีกชั่วโมง [frostbite_victim.GetTitledFirstName] ดึงข้าไปข้างๆ ขณะที่ตัวสั่น [frostbite_victim.GetSheHe] ร้องออกมาว่า:\n\n"ได้โปรด [frostbite_victim.Custom2('RelationToMeShort', ROOT.Char)] ของข้า ข้าไม่รู้สึกถึง [frostbite_victim.Custom('GetFrostbittenBodyPart')] ของข้าอีกต่อไปแล้ว!""
 travel_danger_events.1011.desc_frostbite_twice:0 "อีกครั้งที่การเดินทางส่งผลกระทบอย่างหนักต่อกองคาราวานของเรา พายุหิมะที่ตกอย่างต่อเนื่องและอุณหภูมิที่ต่ำมาก ทำให้เราต้องตั้งค่าย ข้าไปตรวจดู [frostbite_victim.GetTitledFirstName] เนื่องจาก [frostbite_victim.GetSheHe] เคยได้รับบาดเจ็บจากแผลน้ำแข็งกัดมาก่อน และตอนนี้ [frostbite_victim.GetSheHe] นอนอยู่บนเตียงชั่วคราว\n\n"ข้ารู้สึกไม่ค่อยดีเลย [frostbite_victim.Custom2('RelationToMeShort', ROOT.Char)] ของข้า" อย่างที่ข้าคาดไว้ ความหนาวเย็นได้เล่นงาน [frostbite_victim.Custom('GetFrostbittenBodyPart')] ที่น่าสงสารของ [frostbite_victim.GetNamePossessiveNoTooltip] อีกครั้ง!"
 travel_danger_events.1011.desc_frostbite_thrice:0 "ฤดูหนาว ทำให้เราประหลาดใจอีกครั้งด้วยการปฏิบัติที่โหดร้าย ถนนมีลมแรงและลื่น ทัศนวิสัยต่ำพอๆ กับขวัญกำลังใจของเรา ข้าต้องไปตรวจดู [frostbite_victim.GetTitledFirstName] เนื่องจาก [frostbite_victim.GetSheHe] ได้รับบาดเจ็บจากแผลน้ำแข็งกัดมาแล้วสองครั้ง\n\n"หนาวเหลือเกิน [frostbite_victim.Custom2('RelationToMeShort', ROOT.Char)] ของข้า" [frostbite_victim.GetSheHe|U] กระซิบกับข้า ขณะที่ [frostbite_victim.GetSheHe] เป็นลม ความหนาวเย็นได้เล่นงาน [frostbite_victim.GetNameNoTooltip] ที่น่าสงสารเป็นครั้งที่สาม และในที่สุดมันก็กำลังพรากลมหายใจสุดท้ายไปจาก [frostbite_victim.GetHerHim]"
 travel_danger_events.1011.desc_head:0 "$travel_danger_events.1011.desc$ ข้ามองดู [frostbite_victim.Custom('GetFrostbittenBodyPart')] ใกล้ๆ ปลายปกคลุมไปด้วยน้ำแข็งและบวมเล็กน้อย ข้าคิดว่ามันอาจจะแย่ลงถ้าข้าไม่ทำอะไรเลย!"
 travel_danger_events.1011.desc_upper_limb:0 "$travel_danger_events.1011.desc$ [frostbite_victim.GetSheHe] พยายามกำหมัด แต่ความเจ็บปวดนั้นรุนแรงเกินไป [frostbite_victim.Custom('GetFrostbittenBodyPart')] ของ [frostbite_victim.GetHerHis] บวมและเปลี่ยนเป็นสีน้ำเงินและดำทุกเฉด"
 travel_danger_events.1011.desc_lower_limb:0 "$travel_danger_events.1011.desc$ ข้าสั่งให้ [frostbite_victim.GetHerHim] ถอดรองเท้าบูท [frostbite_victim.GetHerHis] ออกและดูที่ [frostbite_victim.Custom('GetFrostbittenBodyPart')] มันกลายเป็นสีน้ำเงินเข้มไปหมดแล้ว และ ณ จุดนี้อาจสายเกินไปที่จะรักษามันไว้"
 travel_danger_events.1011.desc_head_twice:0 "$travel_danger_events.1011.desc_frostbite_twice$ ครั้งนี้ข้าตรวจดู [frostbite_victim.Custom('GetFrostbittenBodyPart')] ของ [frostbite_victim.GetHerHis] และเปรียบเทียบกับหู มันมีสีน้ำเงินอ่อนกว่า อย่างไรก็ตาม อาจเป็น เพราะแผลน้ำแข็งกัดที่ [frostbite_victim.Custom('GetFrostbittenBodyPart')] ยังคงสดใหม่อยู่"
 travel_danger_events.1011.desc_upper_limb_twice:0 "$travel_danger_events.1011.desc_frostbite_twice$ แผลน้ำแข็งกัดที่นิ้วเก่าแย่ลงไปอีก และตอนนี้มันลามไปทั่วทั้ง [frostbite_victim.Custom('GetFrostbittenBodyPart')] ด้วยอัตรานี้ [frostbite_victim.GetSheHe] จะเสียแขนของ [frostbite_victim.GetHerHis] ไป!"
 travel_danger_events.1011.desc_lower_limb_twice:0 "$travel_danger_events.1011.desc_frostbite_twice$ ข้าจับรองเท้าบูทของ [frostbite_victim.GetHerHis] เพื่อช่วย [frostbite_victim.GetHerHim] ถอดออก เราพยายามอยู่ครู่หนึ่ง แต่ในที่สุดเราก็สามารถเปิดเผย [frostbite_victim.Custom('GetFrostbittenBodyPart')] ที่บวมได้ [frostbite_victim.GetSheHe|U] จะเสียขาทั้งหมดในไม่ช้า!"
 travel_danger_events.1011.desc_head_thrice:0 "$travel_danger_events.1011.desc_frostbite_thrice$ แผลน้ำแข็งกัดลุกลามไปยัง [frostbite_victim.Custom('GetFrostbittenBodyPart')] อีกข้าง และตอนนี้ใบหน้าทั้งหมดของ [frostbite_victim.GetHerHis] เป็นสีน้ำเงินเข้มและเย็นเหมือนน้ำแข็ง เป็นไปได้อย่างไร?!"
 travel_danger_events.1011.desc_upper_limb_thrice:0 "$travel_danger_events.1011.desc_frostbite_thrice$ การสูญเสีย [frostbite_victim.Custom('GetFrostbittenBodyPart')] ทำให้แผลน้ำแข็งกัดแพร่กระจายไปยังส่วนบนของร่างกายได้ง่ายขึ้น หน้าอกและคอของ [frostbite_victim.GetHerHis] กำลังคล้ำขึ้นทุกนาที"
 travel_danger_events.1011.desc_lower_limb_thrice:0 "$travel_danger_events.1011.desc_frostbite_thrice$ หลังจากสูญเสีย [frostbite_victim.Custom('GetFrostbittenBodyPart')] จากแผลน้ำแข็งกัดครั้งก่อน ความหนาวเย็นก็พุ่งตรงไปที่ช่องท้อง และทั้งร่างกายก็ค่อยๆ เปลี่ยนเป็นสีน้ำเงิน"
 travel_danger_events.1011.a:0 "มาเผา [to_be_burned.GetNameNoTooltip] เพื่อให้ [frostbite_victim.GetHerHim] อบอุ่นขึ้น"
 travel_danger_events.1011.a.success:0 "[frostbite_victim.GetTitledFirstNameNoTooltip] รู้สึกอุ่นขึ้น"
