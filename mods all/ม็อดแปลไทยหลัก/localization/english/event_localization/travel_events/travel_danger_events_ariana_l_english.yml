l_english: 
  travel_danger_events.7000.t: "$travel_danger_prefix$ อสรพิษ!"
  travel_danger_events.7000.desc_intro: "ขณะที่เรามุ่งหน้าไปยัง [destination.GetName] เราหยุดพักครู่หนึ่ง"
  travel_danger_events.7000.desc_desert: "บ้างก็เดินสำรวจเนินทราย บ้างก็พักผ่อนในร่มเงาของกองคาราวาน ดวงอาทิตย์อยู่ตรงศีรษะพอดี และความร้อนก็แผดเผาอย่างหนักหน่วง ข้ามองดู [snake_victim.GetTitledFirstName] ค่อยๆ เดินย่ำไปบนผืนทราย แต่ทันใดนั้น [snake_victim.GetSheHe] ก็ทรุดเข่าลงกับพื้น กุมขาของ [snake_victim.GetHerHis] ไว้"
  travel_danger_events.7000.desc_oasis: "ส่วนใหญ่รวมตัวกันรอบโอเอซิส ดื่มน้ำเย็นและล้างฝุ่นออกจากใบหน้า [snake_victim.GetName] จุ่มมือของ [snake_victim.GetHerHis] ลงไปในน้ำ และทันใดนั้น [snake_victim.GetSheHe] ก็สะดุ้งถอยหลังพร้อมกับกรีดร้อง"
  travel_danger_events.7000.desc_mountains: "หลายคนออกไปค้นหาแหล่งอาหารหรือน้ำ ขณะที่คนอื่นๆ พักผ่อนในร่มเงาของต้นไม้ ข้าสังเกตเห็น [snake_victim.GetName] กำลังหาของป่าในพงหญ้ารก แต่ทันใดนั้น [snake_victim.GetSheHe] ก็กระโดดถอยหลังพร้อมกับร้องเสียงหลง"
  travel_danger_events.7000.desc_hills: "หลายคนนั่งล้อมวงรอบกองไฟ ให้ความอบอุ่นและแบ่งปันเรื่องราว [snake_victim.GetName] อยู่ห่างออกไป บางทีอาจจะกำลังมองหาสัตว์ป่า [snake_victim.GetSheHe] เอื้อมมือเข้าไปในพงหญ้า แต่ก็ร้องเสียงแหลมออกมาทันทีหลังจากนั้น"
  travel_danger_events.7000.desc_floodplains: "คนสองสามคนออกไปตักน้ำในบริเวณใกล้เคียง และคนอื่นๆ อยู่เฝ้ากองคาราวานและมองหาที่ดินแห้ง [snake_victim.GetName] จุ่มคนโทของ [snake_victim.GetHerHis] ลงไปในน้ำ แต่ก็ดึงกลับอย่างรวดเร็วพร้อมกับร้องด้วยความเจ็บปวด"
  travel_danger_events.7000.desc: "\n\n[snake_victim.GetSheHe|U] ถูก [current_location.Custom('GetRandomRegionalPoisonousSnake')] กัด! ในที่สุดอสรพิษก็ปล่อยเขี้ยวของมันออกจากเนื้อของ [snake_victim.GetHerHis] แต่เห็นได้ชัดว่าพิษกำลังส่งผล"
  travel_danger_events.7000.desc_recent: "แม้สถานการณ์จะเลวร้าย [snake_victim.GetSheHe] ก็มิใช่คนแปลกหน้าต่ออันตรายเช่นนี้..." #Haha get it? Stranger danger? No? Okay.
  travel_danger_events.7000.a_1: "เราจะรอจนกว่าอาการของ [snake_victim.GetHerHis] จะดีขึ้น"
  travel_danger_events.7000.a_2: "หวังว่า เมื่อเวลาผ่านไป [snake_victim.GetSheHe] จะฟื้นตัว"
  travel_danger_events.7000.a_3: "ปล่อยให้ร่างกายของ [snake_victim.GetHerHis] ได้พักผ่อนจะดีที่สุด"
  every_victim_relation_tt: "สมาชิกครอบครัวทุกคนของ [snake_victim.GetName]:"
  travel_danger_events.7000.a_recover: "[snake_victim.GetSheHe|U] ฟื้นจากพิษ"
  travel_danger_events.7000.a_dont_recover: "อาการของ [snake_victim.GetSheHe|U] ยังคงเหมือนเดิม"
  travel_danger_events.7000.a_dont_recover_die: "[snake_victim.GetSheHe|U] ทนพิษบาดแผลไม่ไหว"
  travel_danger_events.7000.b: "บางทีพิษอาจจะรักษาได้..."
  travel_danger_events.7000.b_flavor: "ท่านพยายามรักษาพิษด้วยตนเอง"
  travel_danger_events.7000.treatment_good: "การรักษาประสบผลสำเร็จ"
  travel_danger_events.7000.treatment_bad: "พิษไม่ตอบสนองต่อการรักษา"
  travel_danger_events.7000.c: "อา บางทีใครบางคนใน [current_location.GetNameNoTooltip] อาจช่วยได้"
  travel_danger_events.7000.c_tt: "ท่านจ่ายเงินให้คนท้องถิ่นเพื่อพยายามรักษาพิษ"
  travel_danger_events.7000.d_physician: "[treatment_giver.GetNameNoTooltip] เป็นผู้รักษาที่ชำนาญ"
  travel_danger_events.7000.c_known: "[current_location.GetTitle.GetHolder.GetNameNoTooltip] พำนักอยู่ที่นี่ [current_location.GetTitle.GetHolder.GetSheHe] สามารถช่วยได้"
  travel_danger_events.7000.c_known_tt: "ท่านใช้ความสัมพันธ์ของท่านกับ [current_location.GetTitle.GetHolder.GetName] เพื่อหาผู้รักษาที่ดีในท้องถิ่น"
  travel_danger_events.7000.d: "[treatment_giver.GetNameNoTooltip] ค่อนข้างฉลาด บางที [treatment_giver.GetSheHe] อาจช่วยได้"
  travel_danger_events.7000.e_flavor: "จงให้อาหารแก่ [snake_victim.GetHerHim] เพื่อให้ [snake_victim.GetSheHe] มีโอกาสฟื้นตัวสูงขึ้น"
  travel_danger_events.7000.d_tt: "[treatment_giver.GetName] พยายามรักษาพิษ"
  travel_danger_events.7000.d_tt_phys: "[treatment_giver.GetName] รักษา [snake_victim.GetFirstName]"
  travel_danger_events.7000.e: "ให้ [snake_victim.GetFirstNameNoTooltip] ได้รับอาหารมื้อเย็นเพิ่มเป็นพิเศษในคืนนี้"
  travel_danger_events.7000.f_sea: "ให้กระแสน้ำพัดพา [snake_victim.GetHerHim] ไป!"
  travel_danger_events.7000.f: "ข้าไม่สนใจที่จะเห็น [snake_victim.GetHerHim] ทนทุกข์ทรมาน"
  travel_danger_events.7000.g: "พอแล้ว ไปกันต่อเถอะ"
