l_english: 
#Travel Danger Events
#Sea: Someone falls overboard
 travel_danger_events.4000.t:0 "$travel_danger_prefix$ [overboard_character.GetWomanMan|U] ตกทะเล!"
 travel_danger_events.4000.desc: "ผืนน้ำที่ปั่นป่วนนั้นเพียงพอที่จะ ทำให้กะลาสีผู้มีประสบการณ์เมาเรือได้ ขณะที่เราโคลงเคลงไปมาบนคลื่น ผู้คนบนเรือค่อยๆ เคลื่อนตัวไปหาที่หลบภัยด้านล่าง\n\nข้าสังเกตเห็น [overboard_character.GetTitledFirstName] มองออกไปนอกราวบันไดก่อนจะหันกลับเพื่อหาทางของ[overboard_character.GetHerHis]ไปยังดาดฟ้าท้องเรือ — แต่ก่อนที่ใครจะทันได้ตอบสนอง เรือก็เหวี่ยงไปด้านข้างอย่างแรงและ [overboard_character.GetSheHe] ก็ตกลงไปในน้ำสีดำมืด"
 travel_danger_events.4000.desc.again:0 "ทะเลไม่ปรานีเรานักระหว่างทางไปยัง [destination.GetNameNoTooltip] ขณะที่เรายังคงเผชิญกับความปั่นป่วนในการเดินเรือ ทันทีที่กัปตันตะโกนเตือน ผู้คนก็รีบลงไปใต้ท้องเรือเร็วกว่าเดิมในครั้งนี้\n\nอย่างไรก็ตาม [overboard_character.GetTitledFirstName] อ้อยอิ่งนานเกินไปและตกลงทะเลพร้อมเสียง #EMP ต๋อม#! เบาๆ!!"
 travel_danger_events.4000.desc.seriously:0 "ดูเหมือนว่าเราคงไปปลุกความพิโรธของ [ROOT.Char.GetFaith.WaterGodName] เข้าเสียแล้ว ทะเลกำลังบ้าคลั่งอีกครั้งและผู้คนต่างรีบลงไปใต้ท้องเรือ ก่อนที่กัปตันจะทันได้ตะโกนเตือนเสียอีก\n\nขณะที่ข้ารีบลงไปใต้ท้องเรือ ข้าเหลือบไปเห็น [overboard_character.GetTitledFirstName] สะดุดเชือกที่หลุดลุ่ยจากราวลูกกรง ลูกเรือคนหนึ่งรีบเข้าไปช่วย [overboard_character.GetHerHis] แต่ก็สายเกินไป และเมื่อเรือโคลงครั้งต่อไป [overboard_character.GetFirstNameNoTooltip] ก็ดิ่งลงสู่ห้วงลึก!"
 travel_danger_events.4000.a:0 "เราต้องช่วย [overboard_character.GetHerHim]!"
 travel_danger_events.4000.a_again:0 "ไม่นะอีกแล้ว! ช่วย [overboard_character.GetHerHim]!"
 travel_danger_events.4000.a_seriously:0 "จริงจังหรือนี่? [overboard_character.GetFirstNameNoTooltip], เกาะไว้!"
 travel_danger_events.4000.a.saved.t:0 "รอดชีวิต"
 travel_danger_events.4000.a.saved.desc:0 "ลูกเรือค้นหาในเกลียวคลื่นและช่วย [overboard_character.GetShortUIName] ไว้ได้"
 travel_danger_events.4000.a.wounded.t:0 "รอดชีวิต แต่บาดเจ็บ"
 travel_danger_events.4000.a.wounded.desc:0 "ลูกเรือช่วย [overboard_character.GetShortUIName] ไว้ได้ แต่ [overboard_character.GetSheHe] ได้รับบาดเจ็บจากการตก"
 travel_danger_events.4000.a.failure.t:0 "เสียชีวิต"
 travel_danger_events.4000.a.failure.desc:0 "[overboard_character.GetShortUIName] จมน้ำ"
 travel_danger_events.4000.b:0 "ไม่มีเวลาแล้ว! ข้าจะช่วย [overboard_character.GetHerHim] เอง!"
 travel_danger_events.4000.b_travel_leader:0 "[travel_leader.GetFirstNameNoTooltip], เร็วเข้า!"
 travel_danger_events.4000.b.flavor:0 "[overboard_character.GetFirstNameNoTooltip] #EMP ต้อง#! รอด!"
 travel_danger_events.4000.c:0 "สายเกินไปแล้ว"
 travel_danger_events.4000.c.flavor:0 "ลมส่งท้ายจะ ทำให้เราไปได้เร็วขึ้น!"
 #Illness, an entourage member falls ill
 travel_danger_events.4010.t:1 "$travel_danger_prefix$ ไม่เป็นไรหรอก"
 travel_danger_events.4010.desc:0 "การเดินทางผ่านสภาพแวดล้อมที่บางครั้งก็โหดร้ายนั้นส่งผลกระตุ้นต่อสภาพจิตใจและความแข็งแรงของ #EMP ข้า#! เป็นอย่างน้อย\n\nอย่างไรก็ตาม เมื่อข้ามองไปที่ [ill_character.GetTitledFirstName] [ill_character.GetSheHe] ดูเหมือนจะไม่ค่อยสบายนัก การเคลื่อนไหวของ [ill_character.GetHerHis|U] ดูลำบาก [ill_character.GetHerHis] หายใจหนักและมีอาการไอเป็นพักๆ สั่นสะท้านไปทั่วร่างของ [ill_character.GetHerHis] — เห็นได้ชัดว่า [ill_character.GetSheHe] ไม่สบาย"
 travel_danger_events.4010.desc_again:0 "เรากำลังจะเก็บค่ายในตอนเช้า ระหว่างทางไปยัง [destination.GetNameNoTooltip] เมื่อข้าพบ [ill_character.GetTitledFirstName] ในที่พักของ [ill_character.GetHerHis] หายใจหอบและซีดเผือด [ill_character.GetSheHe|U] ทำหน้าเหยเกเมื่อข้าจ้องมอง และไอโขลกออกมาเสียงดัง\n\n[ill_character.GetFirstNameNoTooltip] ติดโรคอะไรมาด้วยหรือ? นี่คือโรคระบาดหรือไม่?"
 travel_danger_events.4010.desc_sea:0 "ขณะที่เราล่องเรือไปยัง [destination.GetNameNoTooltip] อากาศทะเลที่สดชื่นนั้นส่งผลดีต่อสุขภาพและความเป็นอยู่ที่ดีของ #EMP ข้า#! เป็นอย่างน้อย อย่างไรก็ตาม ไม่ใช่ทุกคนที่จะโชคดี เช่นนั้น\n\nข้าสังเกตเห็นว่า [ill_character.GetTitledFirstName] มีอาการทรุดลงในช่วงสองสามวันที่ผ่านมา และตอนนี้ไม่ต้องสงสัยเลยว่า [ill_character.GetSheHe] ได้ติดโรคบางอย่างเข้าแล้ว"
 travel_danger_events.4010.desc_sea_again:0 "เราคืบหน้าไปได้ดีในการเดินทางสู่ [destination.GetNameNoTooltip] ซึ่งข้าพบว่าเป็นการเติมพลังอย่างยิ่ง อย่างไรก็ตาม ดูเหมือนว่า [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('ill_character'))] ของข้า [ill_character.GetTitledFirstName] กำลังประสบกับสิ่งที่ตรงกันข้าม\n\nเช้านี้ข้าพบ [ill_character.GetHerHim] — พิงราวลูกกรงอย่างหนักพร้อมกับไอเสียงแหบแห้ง — และเห็นได้ชัดว่า [ill_character.GetSheHe] ดูเหมือนจะติดโรคอะไรบางอย่างมาด้วย นี่คือโรคระบาดหรือไม่?"
 travel_danger_events.4010.a:0 "เราควรให้ [ill_character.GetHerHim] พักผ่อนและฟื้นตัวเต็มที่"
 travel_danger_events.4010.a_sea:0 "หาท่าเรือ เพื่อให้ [ill_character.GetFirstNameNoTooltip] ได้พักผ่อนและฟื้นตัวเต็มที่"
 travel_danger_events.4010.b:0 "ข้าคิดว่าข้ารู้วิธีรักษา"
 travel_danger_events.4010.b.flavor:0 "กิ่งไม้นี้หน่อย อันนั้นนิด..."
 travel_danger_events.4010.b.tt:0 "[ill_character.GetShortUINamePossessive] มีอาการ [GetTrait('pneumonic').GetName( GetNullCharacter )]"
 travel_danger_events.4010.b.cured.t:0 "หายดี"
 travel_danger_events.4010.b.cured.desc:0 "[ill_character.GetSheHe|U] ฟื้นตัวเต็มที่แล้ว"
 travel_danger_events.4010.b.worsened.t:0 "อาการแย่ลง"
 travel_danger_events.4010.b.worsened.desc:0 "อาการของ [ill_character.GetHerHis|U] แย่ลง"
 travel_danger_events.4010.c:0 "[medicine_person.GetTitledFirstNameNoTooltip], ท่านช่วยรักษา [ill_character.GetHerHim] ได้หรือไม่?"
 travel_danger_events.4010.d:0 "เอาล่ะ ข้ามี #EMP สิ่งนั้น#! พอดี..."
 travel_danger_events.4010.d.flavor:0 "โอกาสที่จะกำจัด [ill_character.GetHerHim] ให้สิ้นซาก!"
 travel_danger_events.4010.d.poisoned.t:0 "เสียชีวิต"
 travel_danger_events.4010.d.poisoned.desc:0 "ท่านวางยาพิษ [ill_character.GetHerHim] สำเร็จ"
 travel_danger_events.4010.d.failure.t:0 "ถูกจับได้"
 travel_danger_events.4010.d.failure.desc:0 "[ill_character.GetSheHe|U] รู้ทัน"
 travel_danger_events.4010.e:0 "ก็แค่ไอเล็กน้อย"
 travel_danger_events.4010.e.flavor:0 "ข้าเคยเห็นที่แย่กว่านี้"
 travel_danger_events.4010.e.pneumonic.t:0 "ปอดบวม"
 travel_danger_events.4010.e.no_change.t:0 "ไม่มีการเปลี่ยนแปลง"
 every_patient_entourage_tt:0 "สมาชิกคณะผู้ติดตามทุกคนที่เป็น [GetTrait('patient').GetName( GetNullCharacter )]"
