 travel_events.2013.a_rough_terrain:0 "ท่านกลายเป็นผู้เชี่ยวชาญในภูมิประเทศทุรกันดาร"
 travel_events.2013.a_reckless:0 "ท่านกลายเป็นคนบ้าบิ่น"
 travel_events.2013.a_failed:0 "การฝึกล้มเหลว"
