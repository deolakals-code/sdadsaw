 travel_events.2013.e:0 "น่าเสียดาย, เรารีบ"

#Visit a logging camp - Burn off some stress chopping wood
 travel_events.2014.t:0 "สับ, สับ"
 travel_events.2014.desc:0 "เขียงขนาดใหญ่กลางค่ายตัดไม้ของ [ROOT.Char.GetCurrentLocation.GetName] ถูกใช้งานมามาก ดูเหมือนว่ามันอยู่ที่นั่นมาตลอด, แม้กระทั่งก่อนที่มนุษย์จะเดินบนโลกนี้\n\nไหล่ของข้าตึงและแขนท่อนล่างสั่นเล็กน้อยจากความเครียดที่สะสมขณะที่ข้าเข้าใกล้ท่อนไม้ที่งดงาม\n\nข้าค่อยๆ วางท่อนไม้ที่ถูกทิ้งไว้บนแท่นและ, ในการเคลื่อนไหวที่รวดเร็วครั้งเดียว, ข้ายกขวานขึ้น"
 travel_events.2014.a:0 "#EMP ฮูร่าาาห์!#!"
 travel_events.2014.a_flavor:0 "เอา #EMP นี่#! ไป, ความเครียด!"
 travel_events.2014.a_stress_tt:0 "ความเครียดลดลง"
 travel_events.2014.a_great_stress_desc:0 "ท่านลดความเครียดลงอย่างมาก"
 travel_events.2014.a_stress_desc:0 "ท่านลดความเครียดลง"
 travel_events.2014.a_injured_tt:0 "ได้รับบาดเจ็บ"
 travel_events.2014.a_injured_desc:0 "ท่านเผลอทำร้ายตัวเองจนพิการ"
 travel_events.2014.b:0 "... ไม่, งานใช้แรงงานต่ำต้อยเกินไปสำหรับข้า"
 travel_events.2014.b_flavor:0 "ท่านลดขวานลง"

#Visit a peat quarry - Try not to fall asleep
 travel_events.2015.t:0 "พีท, บอกข้าอีกสิ..."
 travel_events.2015.desc:0 "[quarry_guide.GetTitledFirstName|U] กระวนกระวายด้วยความยินดีแบบเด็กๆ ขณะที่ [quarry_guide.GetSheHe] นำการเยี่ยมชมเหมืองพีทใน [ROOT.Char.GetCurrentLocation.GetName] ของข้า ด้วยเหตุผลบางอย่างที่เข้าใจไม่ได้, [quarry_guide.GetSheHe] ดูเหมือนจะคิดว่าสถานที่แห่งนี้คืออัญมณีในมงกุฎหญ้าของ [quarry_guide.GetHerHis]\n\nข้ามองออกไปเหนือทุ่งที่ถูกทำลาย, ทั้งหมดเป็นสีน้ำตาลและเขียวอมเทา\nเปลือกตาของข้าหนักอึ้งขึ้นเรื่อยๆ ช่วงนี้, การนอนหลับหลีกเลี่ยงข้า ช้าๆ พวกมันเลื่อนปิดลง...\n\nทันใดนั้นข้าก็สะดุ้งตื่น, มือของ [quarry_guide.GetFirstNamePossessiveNoTooltip] อยู่ที่แขนเสื้อข้า\n"... ข้า #EMP น่าเบื่อ#! หรือ?""
 travel_events.2015.a:0 "ข้าแค่กำลังซึมซับทุกอย่าง!"
 travel_events.2015.a_convinced_tt:0 "เชื่อ"
 travel_events.2015.a_convinced_desc:0 "ท่านสามารถโน้มน้าว [quarry_guide.GetShortUIName] ได้"
 travel_events.2015.a_insulted_tt:0 "ถูกดูหมิ่น"
 travel_events.2015.a_insulted_desc:0 "[quarry_guide.GetShortUIName] รู้สึกถูกดูหมิ่น"
 travel_events.2015.b:0 "ดูถุงเงินนี่สิ..."
 travel_events.2015.b_flavor:0 "ท่านติดสินบน [quarry_guide.GetShortUIName]"
#Visit a hill farm - Bull rush!
 travel_events.2016.t:0 "กระทิงสำหรับท่านหรือ?"
 travel_events.2016.desc:1 "เสียงร้องมอๆ อย่างอ่อนโยนและกลิ่นมูลสัตว์ไม่ใช่ทั้งหมดที่ทุ่งหญ้าบนเนินเขาของ [ROOT.Char.GetCurrentLocation.GetName] มอบให้กับนักเดินทาง นอกจากนี้ยังมีเสียงกรีดร้องของคนงานในฟาร์ม, เสียงคำรามดังสนั่น, และวัวกระทิงที่หลุดออกมาบนถนนเบื้องหน้าเรา\n\nสัตว์ร้ายขนาดมหึมาพุ่งไปมาด้วยความทุกข์ทรมานอย่างใหญ่หลวง, จนกระทั่งมันจับจ้องไปที่เหยื่อ: [entourage_member.GetFirstName], บนหลังม้าที่ตื่นตระหนกของ [entourage_member.GetHerHis]\n\nมีประตูเปิดอยู่เพื่อกักขังสัตว์ร้ายไว้ข้างหลัง — พวกเราคนหนึ่งแค่ต้องการความกล้าหาญพอที่จะล่อมัน!"
 travel_events.2016.a:0 "มาทางนี้สิ เจ้าวัวกระทิง [bull_loc.Custom2('InsultAdjective', ROOT.Char)]!"
 travel_events.2016.a_captured.tt:0 "จับได้"
 travel_events.2016.a_captured.desc:0 "ท่านจับวัวกระทิงได้สำเร็จ"
 travel_events.2016.a_wounded.tt:0 "$travel_events.2001.c_failure.tt$"
 travel_events.2016.a_wounded.desc:0 "วัวกระทิงถูกจับได้ แต่ท่านได้รับบาดเจ็บ"
 travel_events.2016.b:1 "[guard_type_character.GetFirstNameNoTooltip], #EMP ทำอะไรสักอย่าง!#!"
 travel_events.2016.b_putdown.tt:0 "กำจัด"
 travel_events.2016.b_putdown.desc:1 "[guard_type_character.GetShortUIName] ปลดปล่อยวัวกระทิงจากความทุกข์ทรมาน"
 travel_events.2016.b_wounded.desc:1 "[guard_type_character.GetShortUIName] ได้รับบาดเจ็บ"
 travel_events.2016.c:0 "อย่าเสี่ยงดีกว่า"
 travel_events.2016.c_escaped.tt:0 "หนีรอด"
 travel_events.2016.c_escaped.desc:1 "[entourage_member.GetShortUIName] หนีการพุ่งชนของวัวกระทิงได้อย่างหวุดหวิด"
 travel_events.2016.c_wounded.desc:0 "[entourage_member.GetShortUIName] ได้รับบาดเจ็บ"

#Visit a 'haunted' mansion (farm estate) - Enter at your own peril
 travel_events.haunted_manor.t:0 "คฤหาสน์ 'ผีสิง'"
 travel_events.2017.t:0 "$travel_events.haunted_manor.t$"
 travel_events.2017.desc:0 "ขณะที่เราเดินไปตามโถงทางเดินของคฤหาสน์ใน [ROOT.Char.GetCurrentLocation.GetName] [estate_character.GetTitledFirstName] เจ้าของที่ดินท้องถิ่น ก็หันมาหาข้า "ว่ากันว่าส่วนนี้ของคฤหาสน์มีผีสิง [ROOT.Char.Custom('FormOfAddressForLiege')]"\n\nข้ามองไปรอบ ๆ อย่างลังเล โถงทางเดินมืดกว่าที่ข้าคาดไว้เล็กน้อย แสงเทียนริบหรี่ตามเชิงเทียน\n\nเมื่อเราหยุดที่ห้องโถงอาหารเก่า [estate_character.GetFirstNameNoTooltip] ก็หันมาหาข้าอีกครั้ง คราวนี้พร้อมกับรอยยิ้มกริ่ม "ท่านอยากจะให้ข้านำชมคฤหาสน์ #EMP ผีสิง#! แห่งนี้หรือไม่""
 travel_events.2017.a: ""โอ้, #EMP น่าสนใจยิ่งนัก!#!""
 travel_events.2017.a_tt:0 "ท่านเข้าสู่คฤหาสน์"
 travel_events.2017.b:0 "เรื่องนี้จะไม่เกิดขึ้น"
 travel_events.2017.b_tt:0 "ท่านออกจากคฤหาสน์"

#Go with the pack or explore on your own?
 travel_events.2018.t:0 "$travel_events.haunted_manor.t$: เส้นทางข้างหน้า"
 travel_events.2018.desc:0 "เรากำลังเดินไปตามโถงทางเดินที่มืดและร้างผู้คน เฟอร์นิเจอร์ไม่กี่ชิ้นที่เราพบล้วนถูกคลุมด้วยผ้าปูที่นอน, เพิ่มบรรยากาศน่าขนลุก\n\nนั่น... หนู... หรือ? ข้ารีบตามคณะเดินทางของข้าให้ทัน\n\n[estate_character.GetTitledFirstName|U] หันมาเผชิญหน้ากับเรา, หรี่ตาขณะที่ [estate_character.GetSheHe] เอ่ยคำว่า "... และผ่านทางนี้, ท่านลอร์ดและท่านหญิง""
 travel_events.2018.a:0 "อยู่ตามเส้นทางดีกว่า"
 travel_events.2018.a_tt:0 "ท่านอยู่กับคณะเดินทางของท่าน"
 travel_events.2018.b:0 "แล้วซอกนี้คืออะไร..."
 travel_events.2018.b_tt:0 "ท่านอาจพบบางสิ่งที่น่าสนใจ"
 travel_events.2018.c:0 "ข้าจะออกไปจากที่นี่!"

#Oh look, someone is trying to murder you
 travel_events.2019.t:0 "$travel_events.haunted_manor.t$: การทรยศที่คฤหาสน์"
 travel_events.2019.desc:0 "ข้าเดินไปตามทางด้านซ้าย, เข้าไปทางซุ้มประตูเตี้ยๆ ข้างหน้าข้าคือประตูกล, แง้มอยู่เล็กน้อย\n\nความมืดมิดถูกทำลายด้วยแสงไฟริบหรี่ที่มาจากชั้นล่าง ข้าค่อยๆ ปีนลงบันได, เพียงเพื่อพบ... #EMP บุคคลในผ้าคลุมพร้อมกริช?!#!\n\nข้าสแกนสภาพแวดล้อมอย่างสิ้นหวังขณะที่นักฆ่าเข้าใกล้ข้าอย่างรวดเร็ว"
 travel_events.2019.a: ""ดูนั่น! ข้างหลังเจ้า!""
 travel_events.2019.a_tt:0 "พยายามผลักตู้ใส่นักฆ่า"
 travel_events.2019.a_retaliate.tt:0 "การตอบโต้"
 travel_events.2019.a_retaliate.desc:0 "ตู้ทับกะโหลกนักฆ่าแตก"
 travel_events.2019.a_retaliate.effect_tt:0 "นักฆ่าตาย"
 travel_events.2019.a_death.desc:0 "ท่านตาย"
 travel_events.2019.b: ""ข้าสามารถเติมเหรียญให้เต็มกระเป๋าเจ้าได้!""
 travel_events.2019.b_tt:0 "พยายามติดสินบนนักฆ่า"
 travel_events.2019.b_paid_off.tt:0 "จ่ายเงินแล้ว"
 travel_events.2019.b_paid_off.desc:0 "นักฆ่าได้รับสินบนและหลบหนีไป"
 travel_events.2019.a_paid_off.effect_tt:0 "นักฆ่าหลบหนีไป"
 travel_events.2019.c: ""เตรียมพร้อม, เจ้าคนเลว!""
 travel_events.2019.c_tt:0 "ต่อสู้กับนักฆ่า"
 travel_events.2019.c_retaliate.desc:0 "ท่านสังหารนักฆ่า"
 travel_events.2019.expose_effect_tt:0 "เปิดโปงสายลับ"

#You found a very weird mendicant character
 travel_events.2020.t:0 "$travel_events.haunted_manor.t$: แม่มดคนไหน?"
 travel_events.2020.desc_witch:0 "ทันใดนั้นข้าก็เกิดความอยากสำรวจทางเดินแคบๆ ทางขวามือ ขณะที่ข้าเดินไปตามโถงทางเดิน, แสงอบอุ่นจากประตูที่เปิดอยู่ก็ทักทายข้า\n\nห้องเต็มไปด้วยเครื่องใช้ทุกชนิด ข้าจำสมุนไพรบางชนิดได้, หม้อกลั่น, เบ้าหลอม, ขวดแก้ว, หม้อ, กาต้มน้ำ... มันคือการแสดงออกอันรุ่งโรจน์ของการเล่นแร่แปรธาตุ\n\n[mendicant_character.GetWomanMan] ยิ้มแย้มทักทายข้า: "สวัสดี [ROOT.Char.Custom('SisterBrother')] ร่วมศรัทธา ชื่อของข้าคือ [mendicant_character.GetFirstNameNoTooltip] และนานมากแล้วที่ไม่มีใครมาเยือนประตูบ้านข้า ท่านต้องการเครื่องดื่มหรือไม่?" [mendicant_character.GetSheHe|U] ชี้ไปที่กาต้มน้ำที่ [mendicant_character.GetSheHe] กำลังดูแลอยู่"
 travel_events.2020.desc: "ข้าแยกตัวออกจากกลุ่ม เดินผ่านโถงทางเดินที่มืดกว่าเดิม จนกระทั่งมาถึงประตูบานหนึ่ง ข้าเห็นแสงส่องลอดออกมาตามขอบ\n\nข้าค่อยๆ ผลักประตูเปิดออกและได้รับการต้อนรับด้วยเสียงฟู่ต่ำๆ กลางห้องที่แออัดไปด้วยหนังสือ ขวด และเครื่องมือเคมีทุกชนิด มี [mendicant_character.GetWomanMan] คนหนึ่งยืนอยู่\n\nกลิ่นเหม็นโชยออกมาจากหม้อต้มที่ [mendicant_character.GetSheHe] กำลังดูแลอยู่ โดยไม่หันศีรษะของ[mendicant_character.GetHerHis]มา [mendicant_character.GetSheHe] กล่าวว่า \"ท่านต้องการบ้างไหม? ปกติแล้วมันได้ผลดีเยี่ยม\""
 travel_events.2020.a: ""ข้าไม่รังเกียจที่จะลองชานั่นสักหน่อย""
 travel_events.2020.b: ""เจ้าอาจมีประโยชน์ในราชสำนักของข้า, รู้ไหม""
 travel_events.2020.c: ""ชิมเจ้าตอนนี้; ชาไว้ทีหลัง""
 travel_events.2020.d: ""เอ่อ... ทางไปทัวร์อยู่ทางไหน?""

#You found a shiny bauble
 travel_events.2021.t:0 "$travel_events.haunted_manor.t$: ของที่ยืมมา"
 travel_events.2021.desc_intro:0 "ข้าเข้าไปทางประตูแคบๆ และได้รับการต้อนรับด้วยความสว่างสลัวๆ ที่มาจากหน้าต่างที่ถูกปิดคลุม ห้องดูเหมือนจะเป็นห้องทำงานเก่า"
 travel_events.2021.desc_illustrious:0 "\n\nทันทีความสนใจของข้าก็หันไปที่ [new_trinket.GetName] อันบริสุทธิ์, วางไว้อย่างระมัดระวังบนแท่นกลางห้อง ข้าเข้าใกล้มันอย่างระมัดระวัง\n\nมันเป็นงานศิลปะอย่างแท้จริง, แต่ละรายละเอียดงดงามยิ่งกว่าส่วนถัดไป ข้าชื่นชมความงามของมันครู่หนึ่ง"
 travel_events.2021.desc_famed:0 "\n\nข้ามองไปรอบๆ ห้องและอดไม่ได้ที่จะสังเกตเห็น [new_trinket.GetName] ที่สร้างขึ้นอย่างเชี่ยวชาญ มันวางอยู่บนสิ่งที่ดูเหมือนจะเป็นแท่น, ดึงดูดความสนใจของข้า\n\nชิ้นนี้ไม่ควรวางไว้ในที่โล่ง เช่นนี้จริงๆ, เป็นเป้าหมายที่แท้จริงสำหรับผู้ปล้นสะดมและโจร ข้าเข้าใกล้มันอย่างระมัดระวัง"
 travel_events.2021.desc_masterwork:0 "\n\nวางอยู่ตรงกลางห้องบนแท่นคือ [new_trinket.GetName] ข้าเข้าใกล้มันอย่างระมัดระวัง\n\nใครกันที่เป็นเจ้าของสิ่งนี้? มันอยู่ในสภาพดีเยี่ยมอย่างน่าทึ่ง, เมื่อพิจารณาจากสถานที่ที่เก็บไว้"
 travel_events.2021.desc_common:0 "\n\nเมื่อดวงตาของข้าคุ้นเคยกับสภาพแวดล้อมใหม่, ข้าสังเกตเห็นสิ่งของที่น่าสนใจวางอยู่บนโต๊ะข้างหน้าต่าง\n\n[new_trinket.GetName] อาจดูไม่เหมือนอะไรมากนักในโลกนี้, แต่ข้าจำฝีมือที่ใช้สร้างมันได้ มันเป็นงานที่มั่นคง"
 travel_events.2021.desc_bad:0 "\n\nข้าสำรวจห้อง, ขอบคุณสำหรับแสงเพิ่มเติมที่มาจากหน้าต่าง ขณะที่ข้ากำลังจะจากไป, ข้าสังเกตเห็นบางอย่างบนกองเศษหินเศษปูนในมุมห้อง\n\n นั่น... #EMP ของสิ่งหนึ่ง?#! ที่มีจุดประสงค์? ข้าลังเลอยู่ครู่หนึ่ง"
 travel_events.2021.a:0 "นี่เป็นส่วนเสริมที่ยอดเยี่ยมสำหรับคอลเลกชันของข้า"
 travel_events.2021.a_bad:0 "... ข้าต้องทำหรือ?"
 travel_events.2021.b:0 "ข้าไม่ควรทำดีกว่า"
 travel_events.2021.b_tt:0 "ท่านเพิกเฉยต่อ [new_trinket.GetName]"

#Resolution: You were joshed / You found a bauble / You survived the murder attempt / You came back from the mendicant
 travel_events.2022.t:0 "$travel_events.haunted_manor.t$: ปลอดภัยดี"
 travel_events.2022.desc_pack:0 "ขณะที่เราเดินผ่านซุ้มประตูเข้าไปในห้องถัดไป, รูปร่างขนาดใหญ่ก็แกว่งลงมาที่เราทันที ทั้งกลุ่มกระโดดและร้องเสียงหลง\n\nขณะที่ข้ามองขึ้นไป, ร่างมืดดูเหมือนจะเป็นโครงกระดูก, ห่อด้วยผ้าคลุมสีดำ ข้าขมวดคิ้วขณะที่ [estate_character.GetTitledFirstName|U] หัวเราะและยิ้มให้เรา\n\n"ท่านน่าจะเห็นสีหน้าของพวกท่านนะ, ท่านลอร์ดและท่านหญิง!" [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('entourage_member_one'))] [entourage_member_one.GetTitledFirstName] ของข้า, กระสับกระส่ายอย่างเห็นได้ชัดและเข้าใกล้ [estate_character.GetTitledFirstNameNoTooltip] ด้วยมือที่ยกขึ้น"
 travel_events.2022.desc_murder:0 "ด้วยความมึนงงจากการเพิ่งหนีนักฆ่ามาได้, ข้าโซเซยืนขึ้น #EMP เกิดอะไรขึ้นกันแน่?#!\n\nตัวสั่น, ข้าปีนกลับขึ้นบันไดและกลับลงไปตามโถงทางเดินไปยังห้องอาหาร ความเครียดของข้าถูกแทนที่ด้วยความโกรธในไม่ช้า #EMP [estate_character.GetTitledFirstName] มีส่วนรู้เห็นในเรื่องนี้หรือไม่?#!\n\nเมื่อข้ามาถึงกลุ่มที่รวมตัวกันในที่สุด, ข้าแทบไม่สังเกตเห็นโครงกระดูกที่ห่อหุ้มแขวนอยู่จากซุ้มประตู\n\nดวงตาของข้าเต็มไปด้วยความโกรธแค้น, ข้าจ้องมอง [estate_character.GetFirstNameNoTooltip], ผู้ ซึ่งมองข้าด้วยความสับสน"
 travel_events.2022.desc_mendicant:0 "หลังจากออกจากห้องพักของนักบวชขอทาน ข้าก็ติดตามเสียงกลับไปยังห้องโถงหลักได้อย่างง่ายดาย\n\nกลุ่มคนดูท่าทางสั่นกระสับกระส่าย แต่ก็โล่งใจ และข้าเห็นร่างมืดทะมึนห้อยอยู่ที่ซุ้มประตูโค้งเหนือพวกเขา [estate_character.GetTitledFirstName|U] หันกลับมาอย่างรวดเร็วและสะดุ้งเล็กน้อยเมื่อเห็นข้า\n\n"[ROOT.Char.Custom('FormOfAddressForLiege')|U]! ท่านออกไปตามลำพังหรือ มันไม่ปลอดภัยนะ ท่านรู้หรือไม่!" [estate_character.GetSheHe|U] หรี่ตาของ [estate_character.GetHerHis] ลง"
 travel_events.2022.desc_mendicant_recruit:0 "ข้าและสหายใหม่ของข้า [mendicant_character.GetTitledFirstName] ออกจากห้องพักของ [mendicant_character.GetHerHis] และเดินทางกลับไปยังกลุ่มในห้องโถงหลัก\n\n[mendicant_character.GetFirstNameNoTooltip] ส่งเสียงขึ้นจมูกเมื่อ [mendicant_character.GetSheHe] สังเกตเห็นร่างมืดทะมึนห้อยลงมาจากซุ้มประตูที่กลุ่มต้องเดินผ่าน ทำให้ผู้นำทางของเรา [estate_character.GetTitledFirstName] หมุนตัวกลับ\n\nดวงตาของ [estate_character.GetHerHis|U] เบิกกว้างเมื่อ [estate_character.GetSheHe] สังเกตเห็น [mendicant_character.GetFirstNameNoTooltip] "นี่ #EMP ใครกัน!#! นาย [ROOT.Char.GetLadyLord] ของข้า ท่านจะวิ่งหนีไปแบบนั้นไม่ได้! มันไม่ปลอดภัย!""
 travel_events.2022.desc_bauble:0 "พร้อมกับของชิ้นใหม่ในกระเป๋า ข้าเดินทอดน่องไปตามโถงทางเดินที่มืดและแคบ ในที่สุดข้าก็พบกลุ่มคนที่เหลือในห้องอาหารที่ส่วนท้ายของคฤหาสน์\n\nมีร่างมืดทะมึนขนาดใหญ่ห้อยลงมาจากซุ้มประตูโค้งหนึ่งของห้อง และข้าอดสงสัยไม่ได้ว่ามันมีไว้เพื่อจุดประสงค์ใด อีกทั้ง คนอื่น ๆ ดูเหมือนจะกระสับกระส่ายเล็กน้อย... ?\n\n[estate_character.GetTitledFirstName|U] สะดุ้งและหันมาทางข้า "[ROOT.Char.Custom('FormOfAddressForLiege')|U]! ท่านไปทำอะไรมา โถงทางเดินมืด ๆ เหล่านี้ไม่ปลอดภัยหากไปคนเดียวนะ!""
 travel_events.2022.desc_joshed:0 "ข้าคลำหาในความมืด, พยายามอย่างดีที่สุดที่จะเพิกเฉยต่อความรู้สึกตื่นตระหนกเล็กน้อยที่ความมืดกระตุ้นในตัวข้า ข้ารีบผ่านประตูถัดไป, พยายามหากลุ่ม...\n\n...และ #EMP ทันใดนั้น#! ร่างมืดขนาดใหญ่ก็แกว่งลงมาทับข้า ข้ากรีดร้องด้วยความประหลาดใจ\n\nเมื่อข้าได้สติ, ข้าพบกลุ่มยืนอยู่ในห้องที่ข้าเพิ่งเข้ามา [estate_character.GetTitledFirstName] หายใจลำบากผ่านเสียงหัวเราะ, และชี้มาที่ข้า "ท... ท่าน [ROOT.Char.GetLadyLord] #EMP *สูดจมูก*#! ท่าน... ท่าน... ท่านสนุกไหม?""
 travel_events.2022.a: ""ข้าเพิ่งรอดชีวิตจากความพยายามฆ่า, ที่วางแผนโดย #EMP เจ้า!#!""
 travel_events.2022.a_slain.tt:0 "สังหารผู้กระทำผิด"
 travel_events.2022.a_slain.desc:0 "ท่านสังหาร [estate_character.GetShortUIName]"
 travel_events.2022.a_escape.tt:0 "ผู้กระทำผิดหลบหนี"
 travel_events.2022.a_escape.desc:0 "[estate_character.GetShortUIName] ทำร้ายท่านและหลบหนีไป"
 travel_events.2022.b: ""ทหาร! คนผู้นี้มีส่วนเกี่ยวข้องในแผนการฆ่าข้า!""
 travel_events.2022.b_slain.desc:0 "[estate_character.GetShortUIName] ถูกสังหารโดย [travel_leader.GetShortUIName]"
 travel_events.2022.b_escape.desc:0 "[estate_character.GetShortUIName] ทำร้าย [travel_leader.GetShortUIName] และหลบหนีไป"
 travel_events.2022.c: ""ท่านอาจต้องการค้นหาแม่มดในบ้าน""
 travel_events.2022.d: ""อันที่จริง, ข้าพบแม่มดคนนี้, [mendicant_character.GetFirstNameNoTooltip]""
 travel_events.2022.e: ""ดูเหมือนจะเป็นบ้านธรรมดาๆ สำหรับข้า""
 travel_events.2022.f_pack:0 "ข้าไม่ควรเข้าไปยุ่ง"
 travel_events.2022.f: ""เจ้าคนเลว!""
 travel_events.2022.g_pack: ""[entourage_member_one.GetFirstNameNoTooltip], อย่า""
 travel_events.2022.g: ""โอ้. ฮ่าฮ่า, ใช่แล้ว!""

#You ratted out the witch; have a curse(?) dream
 travel_events.2024.t:0 "$travel_events.haunted_manor.t$: ขอให้เจ้าเป็นฝี"
 travel_events.2024.desc:0 "[mendicant_character.GetFirstName] จ้องมองข้า [mendicant_character.GetSheHe|U] ยังคงจ้องมองข้า ข้าพยายามหนีโดยวิ่งผ่านโถงทางเดิน — แต่ [mendicant_character.GetSheHe] ตามมา ดวงตาของ [mendicant_character.GetHerHis|U] อยู่ทุกหนทุกแห่ง\n\n"ข้า... รู้..." [mendicant_character.GetSheHe] กระซิบ เมื่อข้าหันไปวิ่ง, ข้าสะดุดและตกลงไปในหลุมที่มืดมิดจนแม้ แต่เทียนพันเล่มก็ส่องสว่างไม่ได้ ข้ายังคงตกลงไป, ตกลงไป...\n\nทันใดนั้นข้าก็สะดุ้งตื่น, เหงื่อท่วมตัว"
 travel_events.2024.a:0 "ทั้งหมดเป็น... ฝันร้ายหรือ?"

#Visit your own farm estate - Tax or don't tax your hospitable subject
 travel_events.2025.t:0 "เจ้าบ้านผู้มีน้ำใจ"
 travel_events.2025.desc:0 "เมื่อมาถึงที่ดินฟาร์มใน [ROOT.Char.GetCurrentLocation.GetName] ในช่วงก่อนค่ำ [estate_owner.GetFirstName] ก็สวมบทบาทเป็นเจ้าบ้านผู้มีเมตตากรุณายิ่ง คอยดูแลทุกความต้องการของเรา\n\nต่อมาในตอนเย็น มีงานเลี้ยงฉลองเพื่อเป็นเกียรติแก่ข้า และ [ROOT.Char.Custom('RegionalDrink')] ก็เปรียบได้ว่าไหลรินไม่ขาดสาย จนกระทั่งเราเริ่มเห็นแสงอรุณรุ่งที่ขอบฟ้า\n\nเช้าวันรุ่งขึ้น [estate_owner.GetFirstNameNoTooltip] เข้ามาหาข้า: "[ROOT.Char.Custom('FormOfAddressForLiege')|U] พวกเราเพลิดเพลินอย่างยิ่งที่ได้ต้อนรับท่าน และงานเลี้ยงนี้จะ ทำให้พวกเราอบอุ่นใจไปอีกหลายคืน" [estate_owner.GetSheHe] ยิ้มและพยักหน้า"
 travel_events.2025.a: ""... สต็อก [ROOT.Char.Custom('RegionalDrink')] ของเจ้าตรงกับอัตราภาษีของเจ้าหรือไม่?""
 travel_events.2025.b: ""ท่านเป็นเจ้าบ้านที่มีน้ำใจที่สุด, [estate_owner.GetFirstNameNoTooltip]""
 travel_events.2025.c: ""เพื่อเป็นการแลกเปลี่ยน, ให้ข้าแบ่งปันแนวคิดในการปรับปรุงบางอย่าง""

#Visit someone else's farm estate - Pay or don't pay for the hospitality
 travel_events.2026.t:0 "ให้ทิปเจ้าบ้าน"
 travel_events.2026.desc_intro:0 "ช่วงบ่ายกำลังเคลื่อนเข้าสู่ค่ำคืนอย่างรวดเร็วขณะที่เราเข้าสู่คฤหาสน์ฟาร์มท้องถิ่นของ [ROOT.Char.GetCurrentLocation.GetName] เจ้าของคฤหาสน์ [estate_owner.GetFirstName] ทักทายเราอย่างอบอุ่น, และสัญญาว่าจะจัดงานเลี้ยงหรูหราให้เรา\n\nเมื่อเริ่มงานเลี้ยง, เราทานอาหาร"
 travel_events.2026.desc_carnivore:0 "สัตว์ย่างนานาชนิด, สตูว์, ซุป, ขนมปัง และอื่นๆ อีกมากมาย"
 travel_events.2026.desc_vegetarians:0 "อาหารมังสวิรัติอันหลากหลายน่าอัศจรรย์, บางอย่างข้าไม่เคยได้ยินชื่อมาก่อน"
 travel_events.2026.desc_outro:0 "\n\nในตอนเช้า [estate_owner.GetFirstNameNoTooltip] เข้ามาหาข้าขณะที่ข้ากำลังเพลิดเพลินกับอาหารเช้า "[ROOT.Char.Custom('FormOfAddressForLiege')|U] การจัดงานเลี้ยงที่ #EMP หรูหราฟุ่มเฟือย#! เช่นเมื่อวานนี้อาจมีค่าใช้จ่าย #EMP สูง...#!""
 travel_events.2026.a: ""#EMP เจ้า#! ควรจ่าย #EMP ข้า#! สำหรับเกียรติยศที่ข้านำมาสู่ #EMP ฟาร์ม#! ของเจ้า""
 travel_events.2026.b: ""ให้ข้าชดเชยให้ท่าน""
 travel_events.2026.c: ""บางที [county_liege.GetTitledFirstNameNoTooltip] และข้าอาจตกลงกันได้""
 travel_events.2026.d: ""เจ้า #EMP กล้า#! อย่างไร!""
#Visit your own quarry - Encounter hungry workers
 travel_events.2027.t:0 "การทะเลาะวิวาทที่เหมืองหิน"
 travel_events.2027.desc:1 "เมื่อย่างเข้าสู่เหมืองหินท้องถิ่นที่ [ROOT.Char.GetCurrentLocation.GetName] ข้าสังเกตเห็นเด็ก ๆ ผอมเกร็งมอมแมมหลายคนกำลังช่วยพ่อแม่ที่หิวโหยของพวกเขาทำงานหนัก ดูเหมือนว่าอาหารในบริเวณนี้จะขาดแคลน\n\nถัดขึ้นไปบนลานเหมือง หัวหน้าคนงานเหมือง [foreman_character.GetFirstName] กำลังโต้เถียงกับ [peasant_leader.GetFirstName] ซึ่งดูเหมือนจะเป็นโฆษกของคนงาน "นี่มัน #EMP ยอมรับไม่ได้#!!" [peasant_leader.GetFirstNameNoTooltip] ตะโกน\n\n"พวกเราไม่สามารถหาซื้ออาหารได้เพียงพอและต้องทนหิวเข้านอนมาหลายเดือนแล้ว ลูก ๆ ของเรากำลังอดอยากและกำลังวังชาของเราก็ถดถอยลง จากการทำงานหนัก เช่นนี้ ทั้งหมดที่พวกเราต้องการคือการขึ้นค่าจ้างเพียง #EMP น้อยนิด#!..." [peasant_leader.GetSheHe|U] พูดเสียงแผ่วลงเมื่อ [peasant_leader.GetSheHe] สังเกตเห็นการมาของข้า"
 travel_events.2027.a: ""คนงานที่ปลอดภัยและได้รับอาหารเพียงพอมีประสิทธิภาพมากกว่า""
 travel_events.2027.b: ""ความหิวช่วยรักษาแรงจูงใจ""
 travel_events.2027.c: ""เข้าแถว, #EMP ชาวนา#!""
 travel_events.2027.d: ""ทำไมไม่กินหัวหน้าคนงานล่ะ?""

#Visit someone else's quarry - Encounter an architect
 travel_events.2028.t:0 "บทสรุปของสถาปนิก"
 travel_events.2028.desc:1 "[budding_architect.GetFirstName] กำลังจมอยู่ในห้วงความคิดขณะที่คณะผู้ติดตามของเราเข้าสู่เหมืองหินแห่ง [ROOT.Char.GetCurrentLocation.GetName] [budding_architect.GetSheHe|U] กำลังโน้มตัวเหนือโต๊ะไม้ที่ตัดอย่างหยาบ ๆ จดจ่ออยู่กับการวาดบางสิ่งบนม้วนกระดาษ\n\nข้าโน้มตัวเข้าไปใกล้เหนือไหล่ของ [budding_architect.GetHerHis] ดึงความสนใจของ [budding_architect.GetHerHis] "[ROOT.Char.Custom('FormOfAddressForLiege')|U]! ข้ามิได้สังเกตเห็นท่าน ขออภัยอย่างสูง!"\n\nข้าเอ่ยถามว่า [budding_architect.GetSheHe] กำลังทำสิ่งใดอยู่ และ [budding_architect.GetFirstNameNoTooltip] ก็ตอบกลับมา\n"โอ้ ข้ากำลังร่างความคิดของข้าเกี่ยวกับการก่อสร้างและการวางรากฐาน ข้าเป็นสถาปนิกที่ค่อนข้างเก่งกาจทีเดียว ท่านก็เห็น" [budding_architect.GetSheHe] ยิ้มอย่างเขินอาย"
 travel_events.2028.a_architect: ""สิ่งเหล่านี้ค่อนข้างดี ข้าจะเอาอันหนึ่ง!""
 travel_events.2028.a: ""สถาปนิกท่านว่า? ข้าจะเอาภาพวาดอันหนึ่ง!""
 holding_blueprint:0 "ภาพวาดสถาปนิก"
 holding_blueprint_desc:0 "ม้วนกระดาษที่มีภาพวาดพร้อมความรู้เกี่ยวกับวิธีการสร้างอาคารบางอย่างอย่างมีประสิทธิภาพที่สุด"
 travel_events.2028.b:0 "ทักษะของท่านจะมีประโยชน์ที่ราชสำนักของข้า"
 travel_events.2028.b.tt:0 "[budding_architect.GetShortUIName] จะทำงานด้วยเงินเดือนที่ต่ำกว่าเป็นเวลา 20 ปี"
 trainee_salary_mod:0 "เงินเดือนผู้ไม่มีประสบการณ์"
 travel_events.2028.c:0 "นั่น... ดี... ทำงานดีต่อไป"

#Visit a cereal field - Encounter a heathen
 travel_events.2029.t:1 "การตื่นรู้"
 travel_events.2029.desc:1 "เป็นเวลาค่ำคืนและ [crop_circler.GetWomanMan] กำลังทำงานหนักเมื่อเรามาถึงทุ่งธัญพืชทางใต้ของ [ROOT.Char.GetCurrentLocation.GetName] [crop_circler.GetSheHe|U] ดูเหมือนกำลัง ทำให้พืชผลแบนราบอย่างรวดเร็ว, โดยใช้แผ่นไม้แบนขนาดใหญ่และหินหนัก\n\nข้าขมวดคิ้วขณะที่ข้ามอง [crop_circler.GetWomanMan] ทำงานของ [crop_circler.GetHerHis], แล้วสอบถามว่า [crop_circler.GetSheHe] กำลังทำอะไรกันแน่\n\n[crop_circler.GetSheHe|U] สะดุ้ง, แล้วเริ่มพูดจาโผงผางยาวเหยียดเกี่ยวกับว่าเราทุกคนต้องตื่นขึ้นและพบกับเจ้านายที่แท้จริงของเราแทนที่จะซ่อนอยู่หลังคำสอน [crop_circler.GetFaith.GetReligion.GetAdjectiveNoTooltip] ที่ผิดๆ ข้าถอยหลังไปสองสามก้าวด้วยความประหลาดใจ"
 travel_events.2029.a: ""หยุดนะ, เจ้าคนนอกรีต!""
 travel_events.2029.b: ""เจ้ากล้าดียังไงมาดูหมิ่น [ROOT.Char.GetFaith.GetReligion.GetNameNoTooltip]!""
 travel_events.2029.c: ""บอกข้าเพิ่มเติมเกี่ยวกับ #EMP เจ้านายที่แท้จริง#! เหล่านี้""
 travel_events.2029.d: ""อืม... ก็ได้""

#Cereal field potential follow-up
 travel_events.2030.t:0 "คำสารภาพของผู้ไม่เชื่อ"
 travel_events.2030.desc:0 "ในตอนเช้า [entourage_chaplain.GetTitledFirstName] เข้ามาหาข้า บิดมือของ [entourage_chaplain.GetHerHis] ไปมา "[ROOT.Char.Custom('FormOfAddressForLiege')|U] และ [entourage_chaplain.Custom2('RelationToMe', ROOT.Char)] ของข้า ข้ามีเรื่องสารภาพที่น่าสะพรึงกลัวอย่างยิ่งจะกล่าว""\n\n[entourage_chaplain.GetSheHe|U] ถอนหายใจอย่างหนัก "แม้ว่าข้าจะมิได้ปักใจเชื่อ...คำสอน...อันวิปลาส... เช่น [crop_circler.Custom('GetLassLad')] ผู้นั้นเมื่อคืนนี้ แต่ข้าก็มี... #EMP ข้อสงสัย.#!" [entourage_chaplain.GetFirstNameNoTooltip] มองข้าอย่างใกล้ชิด มองหาความเห็นอกเห็นใจต่อสถานการณ์อันยากลำบากของ [entourage_chaplain.GetHerHis]\n\n"ข้าเพียงแค่ไม่แน่ใจว่า [entourage_chaplain.GetFaith.HighGodName] มีอยู่จริงและเฝ้าดูพวกเราอยู่หรือไม่" [entourage_chaplain.GetSheHe|U] กล่าวจบ พร้อมกับหยุดเว้นจังหวะอย่างมีนัยสำคัญ"
 travel_events.2030.a: ""ไม่เป็นไรหรอก""
 travel_events.2030.b: ""นี่มัน #EMP รับไม่ได้#!!""

#Visit another cereal field - Encounter a gardener
 travel_events.2031.t:0 "ครรภ์แห่งปฐพี"
 travel_events.2031.desc:0 "ทุ่งนาของ [ROOT.Char.GetCurrentLocation.GetName] เป็นภาพที่น่าชม ทุกพืชผลกำลังเบ่งบาน, ทุกใบเขียวขจี, ทุกต้นอวบอิ่ม\n\nข้ารีบตามหาแหล่งที่มาของความเขียวขจี, เห็น [gardener_character.GetWomanMan] ยืนอยู่ในทุ่ง, ดูเหมือนกำลังบรรยายบางอย่างให้กับกลุ่มผู้ฟัง "ชื่อของข้าคือ [gardener_character.Custom('MistressMaster')|U] [gardener_character.GetFirstName]"\n\n[gardener_character.GetSheHe|U] สังเกตเห็นข้าในระยะไกลและหันมาทางข้า "ความรู้ด้านการทำสวนของข้านั้นกว้างขวาง, ใช่, กว้างขวางอย่างหาที่เปรียบมิได้ — ดังนั้นอยู่สักครู่, และฟัง""
 travel_events.2031.a: ""ทำให้ข้าสนใจแล้ว!""
 travel_events.2031.a_down_to_earth.t:0 "ติดดิน"
 travel_events.2031.b: ""[ROOT.Char.GetTitleAsNameNoTooltip|U]? ทำ #EMP สวน#!?""

#Visit a ramparts/forest fort - Encounter a herbalist/physician
 travel_events.2032.t:0 "สมุนไพรหนึ่งสำหรับท่าน..."
 travel_events.2032.desc:0 "โครงสร้างป้องกันที่น่าประทับใจบนยอด [ROOT.Char.GetCurrentLocation.GetName] [ROOT.Char.GetCurrentLocation.GetTerrain.GetNameNoTooltip|l] นั้นค่อนข้างน่าทึ่ง ขณะที่ข้าเดินไปตามแนวนอก, ข้าสังเกตเห็นบุคคลแปลกประหลาดในระยะไกล\n\n[herbalist_character.GetSheHe|U] ดูเหมือนกำลังพึมพำกับ [herbalist_character.GetHerselfHimself], ตลอดเวลาหยุดเพื่อย่อตัวและเก็บสิ่งที่ดูเหมือนจะเป็นสมุนไพรชนิดต่างๆ มันเกือบจะเหมือนกับว่า [herbalist_character.GetSheHe] กำลังพูดคุยกับ... #EMP สมุนไพร#!?\n\nข้าเข้าใกล้ [herbalist_character.GetHerHim] อย่างระมัดระวัง, และ [herbalist_character.GetSheHe] เงยหน้าขึ้น, สมุนไพรต่างๆ แสดงอยู่ในฝ่ามือ [herbalist_character.GetHerHis] ข้าสังเกตเห็นประกายความอยากรู้อยากเห็นเบื้องหลังดวงตา [herbalist_character.GetHerHis], เสนอคำถามที่ไม่ได้พูดออกมา"
 travel_events.2032.a: ""แล้วสมุนไพรนี้ทำอะไรได้บ้าง?""
 travel_events.2032.a_poisonous.tt:1 "ท่านจัดหาสมุนไพรพิษบางอย่างที่ท่านสามารถนำไปใช้กับ [GetScheme('murder').GetTypeName] [scheme|E] ครั้งต่อไปของท่านได้"
 travel_events.2032.a_poisonous.t:0 "จัดหาสมุนไพรแล้ว"
 travel_events.2032.a_poisonous.desc:1 "ท่านพบสมุนไพรพิษบางอย่าง"
 travel_events.2032.a_learning.tt:0 "ทักษะดีขึ้น"
 travel_events.2032.b: ""ท่านสนใจที่จะเป็นแพทย์ส่วนตัวของข้าหรือไม่?""
 travel_events.2032.c: ""นี่เป็นการเสียเวลาของข้า""

#Visit some hunting grounds - If you have a prisoner with you; manhunt!
 travel_events.2033.t:0 "นักโทษหลบหนี!"
 travel_events.2033.desc_intro:0 "ทันทีที่เราย่างเข้าสู่พื้นที่ล่าสัตว์แห่ง [ROOT.Char.GetCurrentLocation.GetName] ทหารองครักษ์ของข้าก็วิ่งเข้ามาหา สภาพหอบเหนื่อยและตื่นตระหนกเล็กน้อย "[ROOT.Char.Custom('FormOfAddressForLiege')|U]! [prisoner.GetTitledFirstName] ผู้ [prisoner.Custom2('InsultAdjective', ROOT.Char)] ผู้นั้นหลบหนีจากเครื่องพันธนาการของเราไปได้!"\n\nสายตาของข้ากวาดไปยังชายป่าทันที เพื่อมองหาสัญญาณการเคลื่อนไหว แต่ก็ไม่พบสิ่งใด"
 travel_events.2033.desc_manhunt:0 "นี่หมายถึงสิ่งเดียวเท่านั้น #EMP การล่ามนุษย์!#!\n\n"
 travel_events.2033.desc_manhunt_previous:0 "ประกายแห่งความสุขนั้นขณะที่ข้าระลึกถึงการล่ามนุษย์ครั้งสุดท้ายของข้า ทำให้ข้ากระวนกระวายใจ ความตื่นเต้น อันตราย ข้ารอไม่ไหวแล้ว"
 travel_events.2033.desc_manhunt_first:0 "นานมาแล้วที่ข้าต้องการลองฝีมือกับเหยื่อที่เข้าใจยากและอันตรายที่สุดของธรรมชาติ รอยยิ้มปรากฏที่มุมปากของข้า"
 travel_events.2033.desc:0 "ด้วยความตกตะลึงเล็กน้อยจากการแหกคุก, ข้าพิจารณาสถานการณ์อย่างรอบคอบ\n\nแน่นอนว่าเราควรนำนักโทษที่หลบหนีมาลงโทษ?"
 travel_events.2033.a_manhunt:0 "#EMP น่าตื่นเต้น!#!"
 travel_events.2033.a_cannibal:0 "อา ใช่, นักโทษ; เนื้อขาวอีกชนิดหนึ่ง"
 travel_events.2033.a_manhunt_tt:0 "เป้าหมายที่หลบหนีการล่ามนุษย์อาจกลับมาเพื่อแก้แค้น"
 travel_events.2033.a_manhunt.tt:0 "การล่ามนุษย์สำเร็จ"
 travel_events.2033.a_manhunt.desc:1 "[prisoner.GetShortUIName] ถูกล่าและสังหาร"
 travel_events.2033.a_caught_trophy.desc:1 "[prisoner.GetShortUIName] ถูกล่าและกลายเป็นถ้วยรางวัล"
 travel_events.2033.a_caught_eaten.tt:0 "กินนักโทษ"
 travel_events.2033.a_caught_eaten.desc:0 "[prisoner.GetShortUIName] ถูกจับและกิน"
 travel_events.2033.a_escaped.tt:0 "นักโทษหลบหนี"
 travel_events.2033.a_escaped.desc:0 "[prisoner.GetShortUIName] หลุดรอดจากเงื้อมมือของท่าน"
 travel_events.2033.a_killed.desc:0 "[prisoner.GetShortUIName] ฆ่าท่านและหลบหนีไป"
 travel_events.2033.a_accident.desc:0 "ท่านสะดุดและคอหัก"
 manhunt_skull_cup:0 "ถ้วยกะโหลกศีรษะจากการล่ามนุษย์"
 manhunt_skull_cup_desc:0 "ถ้วยกะโหลกศีรษะนี้เป็นถ้วยรางวัลจากการล่ามนุษย์ [new_skull_cup.MakeScope.Var('skull_origin').Char.GetUIName] ที่ประสบความสำเร็จ ณ พื้นที่ล่าสัตว์ [ROOT.Char.GetCurrentLocation.GetName] [ROOT.Char.GetCurrentLocation.GetTerrain.GetNameNoTooltip|l]"
 manhunt_skull_cup_desc_fallback:0 "ถ้วยกะโหลกศีรษะนี้เป็นถ้วยรางวัลจากการล่ามนุษย์ที่ประสบความสำเร็จ"
 travel_events.2033.b:0 "... ข้าว่าเราควรจับ [prisoner.GetHerHim]?"
 travel_events.2033.b_caught.tt:0 "จับนักโทษได้"
 travel_events.2033.b_caught.desc:0 "[prisoner.GetShortUIName] ถูกจับ"
 travel_events.2033.b_caught.effect:0 "[prisoner.GetShortUIName] ยังคงเป็นนักโทษของท่าน"
 travel_events.2033.c:0 "ปล่อย [prisoner.GetFirstNameNoTooltip] วิ่งไป ป่ายังไงก็จะจัดการ [prisoner.GetHerHim] เอง"

#Your escaped manhunted prisoner seeks revenge
 travel_events.2034.t:0 "กรรมตามสนอง..."
 travel_events.2034.desc_intro:0 "รุ่งเช้าเริ่มปรากฏในค่ายของเราที่ [ROOT.Char.GetCurrentLocation.GetName] [ROOT.Char.GetCurrentLocation.GetTerrain.GetNameNoTooltip|l] ข้าหาวและยืดตัวเบาๆ, พลิกตัวไปด้านข้าง\n\nด้วยความง่วงงุน ข้าลุกขึ้นและเข้าใกล้ทางเข้าเต็นท์เพื่อสูดอากาศบริสุทธิ์ยามเช้า ทันใดนั้น, ขนที่ต้นคอของข้าก็ลุกชัน, "
 travel_events.2034.desc:0 "และหางตาของข้าเห็น [vengeful_prisoner.GetTitledFirstName], ชักมีดออกมา\n\n[vengeful_prisoner.GetSheHe|U] ยิ้มอย่างเย้ยหยัน "[ROOT.Char.GetTitledFirstNameNoTooltip|U], ยินดีที่ได้พบท่านอีกครั้ง คราวนี้ #EMP ข้า#! จะเป็นผู้ล่ามนุษย์" ข้ากระพริบตา, ตกตะลึงชั่วขณะ"
 travel_events.2034.desc_long_time:0 "และหางตาของข้าเห็น [vengeful_prisoner.GetWomanMan] คนหนึ่ง, ชักมีดออกมา\n\n[vengeful_prisoner.GetSheHe|U] ยิ้มอย่างเย้ยหยัน "ท่านจำข้าไม่ได้, ใช่ไหม? แต่ข้าจำ #EMP ท่าน#! ได้, [ROOT.Char.GetTitledFirstNameNoTooltip] และการล่ามนุษย์ #EMP อันซาดิสม์#! ของท่าน" ความทรงจำเลือนรางกลับมาหาข้า นักโทษที่หลบหนี #EMP [vengeful_prisoner.GetTitledFirstName]#!...?"
 travel_events.2034.a:0 "ท่านไม่ต้องทำ เช่นนี้!"
 travel_events.2034.a_overpowered_desc:0 "ท่านเอาชนะ [vengeful_prisoner.GetShortUIName] ได้"
 travel_events.2034.a_overpowered_effect:0 "ท่านจะได้ตัดสินชะตากรรมของ [vengeful_prisoner.GetShortUINamePossessive]"
 travel_events.2034.a_death_desc:0 "$travel_events.2019.a_death.desc$"
 travel_events.2034.b:0 "#EMP [bodyguard.GetFirstNameNoTooltip]!!#!"
 travel_events.2034.b_overpowered_desc:0 "[bodyguard.GetShortUIName] เอาชนะ [vengeful_prisoner.GetShortUIName] ได้"
 travel_events.2034.b_death_tt:0 "สังหารนักโทษที่หลบหนี"
 travel_events.2034.b_death_desc:0 "[bodyguard.GetShortUIName] สังหาร [vengeful_prisoner.GetShortUIName]"
#Decide their fate
 travel_events.2035.t:0 "...กรรมตามทัน"
 travel_events.2035.desc:0 "[vengeful_prisoner.GetTitledFirstName|U] กำลังคุกเข่าอยู่เบื้องหน้าข้า ถูกพันธนาการไว้และไม่สามารถเคลื่อนไหวได้ หลังจากความตื่นตระหนกในตอนแรก บัดนี้ทหารองครักษ์ของข้าก็อัดแน่นเต็มกระโจม\n\n[vengeful_prisoner.GetSheHe|U] ก้มหน้ามองพื้นอย่างดื้อรั้นและปฏิเสธที่จะสบตาข้า ข้าควรทำ เช่นไรกับ [vengeful_prisoner.Custom2('InsultNoun', ROOT.Char)] ผู้นี้ดี"
 travel_events.2035.a:0 "ความตายคือสิ่งที่เจ้าสมควรได้รับ"
 travel_events.2035.b:0 "เจ้าควรกลับเข้าคุก"
 travel_events.2035.c:0 "ข้าจะให้อภัย"

#Your escaped/reformed prisoner is... pretty peaceful actually
 travel_events.2036.t:0 "จุดจบ?"
 travel_events.2036.desc_intro:0 "เราเข้าสู่ประตูหมู่บ้านเล็กๆ ที่ [ROOT.Char.GetCurrentLocation.GetName] ผู้คนที่นี่ดูสงบสุข, ใช้ชีวิตประจำวันและช่วยเหลือ ซึ่งกันและกัน\n\nขณะสำรวจชาวบ้านอย่างไม่เป็นทางการ, ความรู้สึกคุ้นเคยก็แล่นผ่านข้า "
 travel_events.2036.desc_reformed:0 "ที่ศาลเจ้าท้องถิ่น, ข้าจำนักโทษที่หลบหนีของข้าได้ทันที, [peaceful_prisoner.GetTitledFirstName], กำลังสนทนาอย่างอ่อนโยนกับผู้นำทางจิตวิญญาณ\n\nนี่มันเรื่องบังเอิญอะไรกัน! ข้าจ้องมองขณะที่ [peaceful_prisoner.GetSheHe] ช่วยเหลือนักบวชทำงานเล็กๆ น้อยๆ, ดูเหมือนจะสงบสุข"
 travel_events.2036.desc:0 "ข้าจำนักโทษที่หลบหนีของข้าได้ทันที, [peaceful_prisoner.GetTitledFirstName], กำลังหัวเราะและช่วยเหลือผู้อาวุโสคนหนึ่งในหมู่บ้านชนบท\n\n[peaceful_prisoner.GetSheHe|U] ดูเหมือนจะพอใจกับสถานการณ์ของ [peaceful_prisoner.GetHerHis]"
 travel_events.2036.a:0 "อยู่ใครอยู่มัน"
 travel_events.2036.a_criminal:0 "ข้าว่าแม้ แต่อาชญากรก็กลับตัวได้"
 travel_events.2036.a_reformed:0 "ตราบใดที่ [peaceful_prisoner.GetSheHe] ไม่พยายามฆ่าข้าอีกครั้ง"
 travel_events.2036.b:0 "[peaceful_prisoner.GetTitledFirstNameNoTooltip|U] มากับ #EMP ข้า#! "
 travel_events.2036.b_criminal:0 "เคยเป็นอาชญากร, ก็ยังเป็นอาชญากร"
 travel_events.2036.b_reformed:0 "#EMP ...ไม่#!, ข้าไม่รู้สึกปลอดภัยเมื่อรู้ว่า [peaceful_prisoner.GetSheHe] อยู่ข้างนอกนั่น"

#Visit some hunting grounds - Sadistic county holder is manhunting
 travel_events.2037.t:0 "นักล่ามนุษย์"
 travel_events.2037.desc:0 "เราพบ [2037_county_liege.GetTitledFirstName], ผู้ปกครอง [ROOT.Char.GetCurrentLocation.GetName], และคณะเดินทางของ [2037_county_liege.GetHerHis] ที่พื้นที่ล่าสัตว์ท้องถิ่น\n\nหลังจากการแลกเปลี่ยนคำทักทายอย่างสุภาพ, [2037_county_liege.GetSheHe] มองข้าด้วยรอยยิ้มเจ้าเล่ห์: "ท่านสนใจที่จะเข้าร่วมกีฬาที่สูงส่งที่สุดกับข้าหรือไม่, "
 travel_events.2037.desc_child:0 "เจ้าตัวเล็ก?" "
 travel_events.2037.desc_adult:0 "[2037_county_liege.Custom2('RelationToMeShort', ROOT.Char)] ของข้า?" "
 travel_events.2037.desc_segway:1 "[2037_county_liege.GetSheHe|U] พยักหน้าให้นักโทษในโซ่ตรวนที่ขอบป่า"
 travel_events.2037.desc_outro_segway_adult:1 "\n\nข้าตระหนักในไม่ช้าว่า #EMP กีฬา#! อะไรที่ [2037_county_liege.GetSheHe] กำลังอ้างถึง"
 travel_events.2037.desc_outro_child:1 "\n\nความอยากรู้อยากเห็นของข้าถูกกระตุ้นอย่างแน่นอน เกมนี้จะเป็นอะไรไปได้... ? วิ่งไล่จับ?\n\nขณะที่ข้าพิจารณาข้อเสนอ, ข้าสังเกตเห็น [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('entourage_character'))] [entourage_character.GetTitledFirstName] ของข้ากำลังมองหาความสนใจจากข้าและส่ายศีรษะ [entourage_character.GetHerHis] อย่างระมัดระวัง"
 travel_events.2037.desc_outro_manhunter:0 "ในฐานะนักล่ามนุษย์ผู้มีประสบการณ์, ข้อเสนอนี้กระตุ้นความสนใจของข้า"
 travel_events.2037.desc_outro:1 "#EMP การล่ามนุษย์#! ข้ารู้สึกขยะแขยงอย่างแท้จริง... หรือข้าสนใจ?"
 travel_events.2037.a:0 "ฟังดูน่าสนใจพอ..."
 travel_events.2037.a_child:0 "ข้าจะเล่น!"
 travel_events.2037.a_manhunted:0 "เริ่มกันเลย"
 travel_events.2037.a_your_kill.desc:1 "ท่านล่าและสังหาร [2037_manhunt_prisoner.GetShortUIName]"
 travel_events.2037.a_their_kill.tt:0 "[2037_county_liege.GetShortUINameNoTooltip] เป็นผู้สังหาร"
 travel_events.2037.a_their_kill.desc:1 "[2037_manhunt_prisoner.GetShortUIName] ถูกล่าและสังหารโดย [2037_county_liege.GetShortUIName]"
 travel_events.2037.b:0 "ข้าอาจมีประโยชน์สำหรับนักโทษคนนั้น, หากท่านไม่ว่าอะไร"
 travel_events.2037.b_child:0 "ข้าอยากให้ [2037_manhunt_prisoner.GetFirstNameNoTooltip] มากับข้ามากกว่า"
 travel_events.2037.c:0 "ท่านบ้าไปแล้วหรือ?"
 travel_events.2037.c_child:0 "ไม่ นี่ดูเหมือนเกมที่ชั่วร้าย"

#Visit some hunting grounds - Friendly competition with an entourage member
 travel_events.2038.t:0 "เป้าหมายที่แท้จริง"
 travel_events.2038.desc:0 "เต็มไปด้วยสัตว์ป่าทุกชนิด, [entourage_character.GetTitledFirstName] และข้าเห็นพ้องกันว่า [ROOT.Char.GetCurrentLocation.GetName] จะเป็นสถานที่ที่ยอดเยี่ยมสำหรับการล่าสัตว์\n\nในขณะที่เราไม่มีเวลาอยู่เพื่อการออกล่าสัตว์อย่างเหมาะสม, ขณะที่เราเดินทางผ่านพื้นที่ ข้าเห็นกระต่ายป่าบริสุทธิ์ตัวหนึ่งที่ขอบป่า มันมีเครื่องหมายแปลกๆ บนขนของมัน และข้าส่งสัญญาณให้ [entourage_character.GetFirstNameNoTooltip] สำรวจสัตว์ตัวนั้น\n\nเมื่อ [entourage_character.GetSheHe] เห็นกระต่าย, [entourage_character.GetSheHe] ก็ยิ้ม "ท่านจะว่าอย่างไรกับการพนันฉันมิตร, [entourage_character.Custom2('RelationToMeShort', ROOT.Char)]? ใครก็ตามที่ยิงเพื่อนตัวน้อยบริสุทธิ์คนนั้นด้วยลูกธนูชนะ""
 travel_events.2038.a:0 "ฟังดูเหมือนข้อตกลงสำหรับข้า!"
 travel_events.2038.a_your_kill.tt:0 "ท่านเป็นผู้สังหาร"
 travel_events.2038.a_your_kill.desc:0 "ลูกธนูของท่านเจาะหัวใจกระต่ายอย่างไม่มีที่ติ"
 travel_events.2038.a_their_kill.tt:0 "[entourage_character.GetShortUINameNoTooltip] เป็นผู้สังหาร"
 travel_events.2038.a_their_kill.desc:0 "กระต่ายถูกสังหารโดย [entourage_character.GetShortUIName]"
 lucky_rabbits_paw:0 "อุ้งเท้ากระต่ายนำโชค"
 lucky_rabbits_paw_desc:0 "อุ้งเท้าจากกระต่ายบริสุทธิ์ที่ไม่เหมือนใคร, ถูกยิงในการล่าสัตว์ฉันมิตรกับ [entourage_character.GetTitledFirstName] ที่พื้นที่ล่าสัตว์ [ROOT.Char.GetCurrentLocation.GetName]"
 travel_events.2038.b:0 "#EMP โอ้ ไม่นะ#!, ดวงอาทิตย์เข้าตาข้า!"
 travel_events.2038.c:0 "...หึ, ข้าไม่มีเวลาสำหรับเรื่องนี้"

#Follow-up hunt outcome
 travel_events.2039.t:0 "เป้าหมายที่แท้จริงที่สุด"
 travel_events.2039.desc_child_won:1 "[entourage_character.GetTitledFirstName] วิ่งไล่ตามกระต่าย, เตรียมคันธนู, ไม่สนใจการหลอกลวงที่อ่อนแอของลูกธนูที่ยิงออกไปอย่างไม่ดีของข้า\n\nหลังจากต่อสู้กับพงไม้อยู่ครู่หนึ่ง, [entourage_character.GetTitledFirstNameNoTooltip] ก็ร้องเสียงแหลมอย่างมีชัยและพุ่งไปข้างหน้า, หยิบซากสัตว์บริสุทธิ์ขึ้นมาพร้อมลูกธนูที่ปักแน่นอยู่ในลำตัวเล็กๆ ของมัน ข้าปรบมือขณะที่ [entourage_character.GetSheHe] ยิ้มให้ข้า"
 travel_events.2039.desc_won:1 "กระต่ายอยู่ในสายตา, เราทั้งคู่ค่อยๆ เคลื่อนเข้าใกล้กระต่ายอย่างมีจุดหมาย, เล็งไปที่ร่างเล็กๆ ของมันขณะที่มันกำลังแทะฟางชิ้นหนึ่ง ข้าดึงสายธนู — และปล่อย — ขณะที่ลูกธนูพุ่ง #EMP ตรงเข้าสู่ร่างของสัตว์#! \n\nแรงกระแทกกะทันหัน ทำให้มันกระเด็นไปสองสามก้าว, จากนั้นร่างเล็กๆ ก็ทรุดลงกับพื้น, ไม่เคลื่อนไหว ข้าคำรามอย่างมีชัย, และ [entourage_character.GetTitledFirstName] ก็ร่วมโห่ร้องกับข้า "ยิงได้ดี," [entourage_character.GetSheHe] ร้อง, ขณะที่ข้าพุ่งไปข้างหน้าเพื่อเก็บถ้วยรางวัล"
 travel_events.2039.desc_lost:1 "[entourage_character.GetTitledFirstName] อยู่ข้างหน้าข้าสองสามก้าว, ขณะที่เราพยายามเข้าใกล้กระต่ายเพื่อยิง ข้าพยายามตามให้ทัน, ขณะที่ [entourage_character.GetSheHe] เล็งลูกธนูไปที่สัตว์และ, ในการเคลื่อนไหวที่รวดเร็วครั้งเดียว, ปล่อยมันตรงเข้าสู่ร่างเล็กๆ ของสิ่งมีชีวิต\n\n[entourage_character.GetFirstNameNoTooltip] ทำท่าทางแห่งชัยชนะและตะโกนขณะที่กระต่ายล้มลงกับพื้น, และ [entourage_character.GetSheHe] ก็รีบไปข้างหน้าเพื่อเก็บซาก ข้าปรบมือด้วยความชื่นชม"
 travel_events.2039.a:0 "ยิงได้ดี!"
 travel_events.2039.a_trinket.t:0 "ได้รับเครื่องประดับเล็กๆ"
 travel_events.2039.a_win:0 "นี่สนุกมาก!"
 travel_events.2039.a_cynical:0 "ข้าเคยเห็นที่แย่กว่านี้"

#The rescued manhunt prisoner from travel_events.2037 turns out to be a psycho
 travel_events.2040.t:0 "การหยุดพัก"
 travel_events.2040.intro:0 "คืนหนึ่งขณะที่เรานั่งอยู่ข้างกองไฟ, ข้ามองขึ้นไปและตระหนักว่าข้าอยู่ตามลำพังกับ [2037_manhunt_prisoner.GetTitledFirstName] ดวงตาของ [2037_manhunt_prisoner.GetHerHis|U] สะท้อนเปลวไฟที่ริบหรี่ขณะที่ [2037_manhunt_prisoner.GetSheHe] จ้องมองข้า\n\n"
 travel_events.2040.desc_child:0 ""ทำไม [2037_county_liege.GetWomanMan] ที่น่ากลัวคนนั้นถึงพยายาม ทำให้เจ้าตายที่นั่น?" ข้าโพล่งออกมา [2037_manhunt_prisoner.GetTitledFirstNameNoTooltip] ลังเลอยู่ครู่หนึ่ง, แล้วมองไปทางอื่นขณะที่ [2037_manhunt_prisoner.GetSheHe] ตอบ:"
 travel_events.2040.desc:0 "ข้าไม่เคยถาม [2037_manhunt_prisoner.GetHerHim] เลยว่าทำไม [2037_manhunt_prisoner.GetSheHe] ถึงถูกจำคุก, ข้าตระหนัก จากนั้น, ราวกับว่า [2037_manhunt_prisoner.GetSheHe] อ่านใจข้าได้, [2037_manhunt_prisoner.GetTitledFirstNameNoTooltip] ก็พึมพำ:"
 travel_events.2040.outro:0 "\n\n"ราวกับว่าเนื้อหนังของ [2040_previous_victim.GetHerHis] ร้องขอการปลดปล่อย, ท่านเห็นไหม," ความคิดถึงอันน่าสยดสยองคืบคลานเข้ามาในเสียงของ [2037_manhunt_prisoner.GetHerHis]"
 travel_events.2040.a:0 "...นั่นเป็นปรัชญามาก"
 travel_events.2040.a_child:0 "ข้าก็เคยทำเรื่องไม่ดีเหมือนกัน"
 travel_events.2040.a.flavor:0 "ใครจะอันตรายไปกว่าคนบ้า?"
 travel_events.2040.a.flavor_child:0 "ข้ามั่นใจว่า [2037_manhunt_prisoner.GetSheHe] จะไม่ทำร้าย #EMP ข้า#!, ใช่ไหม?"
 travel_events.2040.a.tt:0 "[2037_manhunt_prisoner.GetShortUIName] จะทำงานเป็น [GetCourtPositionType('bodyguard_court_position').GetName()] ของท่านโดยไม่คิดค่าจ้าง"
 insane_bodyguard_salary_mod:0 "องครักษ์วิปลาส"
 travel_events.2040.b:0 "ฆาตกรสมควรอยู่หลังลูกกรง"
 travel_events.2040.b_child:0 "การทำร้ายผู้คนไม่ถูกต้อง"
 travel_events.2040.b.flavor:0 "นั่นคือเหตุผลที่ [2037_manhunt_prisoner.GetSheHe] ถูกจำคุก..."
 travel_events.2040.b.flavor_child:0 "[2037_manhunt_prisoner.GetTitledFirstNameNoTooltip] ทำให้ข้ากลัว..."
 travel_events.2040.c:0 "#EMP ข้าไม่สามารถทนให้ฆาตกรมีชีวิตอยู่ได้!#!"
 travel_events.2040.c.flavor:0 "ตาต่อตา ฟันต่อฟัน"
 travel_events.2040.c_slay.t:0 "สังหารฆาตกร"
 travel_events.2040.c_slay.desc:0 "ท่านสังหาร [2037_manhunt_prisoner.GetShortUIName]"
 travel_events.2040.c_wounded.t:0 "$travel_events.2001.c_failure.tt$"
 travel_events.2040.c_wounded.desc:0 "ท่านสังหาร [2037_manhunt_prisoner.GetShortUIName], แต่ได้รับบาดเจ็บ"
 travel_events.2040.c_incapable.t:0 "บาดเจ็บสาหัส"
 travel_events.2040.c_incapable.desc:0 "ท่านได้รับบาดเจ็บสาหัสในการต่อสู้, และ [2037_manhunt_prisoner.GetShortUIName] หลบหนีไป"
 travel_events.2040.c_death.desc:0 "ท่านตาย"

#Ruler Events#
#Visiting Ruler: Someone is trying to assassinate the Target Ruler!
 travel_events_life_or_death.t:0 "ความเป็นความตาย"
 travel_events.2100.t:0 "$travel_events_life_or_death.t$"
 travel_events.2100.desc_intro:0 "เรากำลังทำเวลาได้ดีในความพยายามที่จะไปถึง [ROOT.Char.GetTravelPlan.GetData.GetNextDestination.GetProvince.GetName], และ "
 travel_events.2100.desc_intro_trees:0 "ป่าทึบของ [ROOT.Char.GetCurrentLocation.GetName] ไม่สามารถเทียบได้กับไหวพริบของผู้นำทางท้องถิ่นของเรา\n\nเมื่อต้นไม้แผ่ออก, ข้าเห็นกลุ่มนักเดินทางกลุ่มที่สอง, กำลังเดินทางอยู่ข้างหน้า"
 travel_events.2100.desc_intro_hills:0 "ลมพัดอยู่ข้างหลังเราขณะที่เราเดินทางผ่านเนินลาดของ [ROOT.Char.GetCurrentLocation.GetName] [ROOT.Char.GetCurrentLocation.GetTerrain.GetNameNoTooltip|l]\n\nไกลออกไปข้างหน้าเรา, คณะเดินทางอีกกลุ่มหนึ่งก็กำลังเดินทางผ่านเนินเขา เช่นกัน"
 travel_events.2100.desc_intro_flats:0 "ที่ราบของ [ROOT.Char.GetCurrentLocation.GetName] ทำให้เราลดการป้องกันลงได้ชั่วขณะ\n\nเมื่อเราไปถึงยอดหุบเขาและมองลงไปเบื้องล่าง, ข้าสังเกตเห็นคณะเดินทางอีกกลุ่มหนึ่งกำลังก้าวไปข้างหน้าอย่างขยันขันแข็ง"
 travel_events.2100.desc_relation_in:0 "ขณะที่ข้าหรี่ตา, ข้าตระหนักว่าผู้ปกครองของคณะเดินทางกลุ่มนั้นคือ"
 travel_events.2100.desc_negative_segway:0 "[murder_target.Custom('InsultAdjectiveGeneric')] คนนั้น"
 travel_events.2100.desc_positive_segway:0 "[ROOT.Char.Custom2('RelationToMe', SCOPE.sC('murder_target'))] ของข้า"
 travel_events.2100.desc_relation_out:0 "[murder_target.GetTitledFirstName]"
 travel_events.2100.desc_no_relation_traveller:0 "พวกเขาดูเหมือนกำลังชมทิวทัศน์, แทบจะวิ่งเล่นและเที่ยวชมพื้นที่ท้องถิ่น"
 travel_events.2100.desc_no_relation_liege:0 "พวกเขาดูเหมือนกำลังสำรวจพื้นที่, จดบันทึกและสนทนาเกี่ยวกับทิวทัศน์"
 travel_events.2100.desc_trees:0 "แต่มีบางอย่างไม่ถูกต้อง เมื่อสำรวจแนวต้นไม้, ข้ายังตรวจพบบุคคลในผ้าคลุมที่น่าสงสัยกลุ่มหนึ่ง, ดูเหมือนกำลังรอให้กลุ่มนักเดินทางเข้ามาใกล้ขึ้น"
 travel_events.2100.desc_hills:0 "แต่พวกนักขี่ม้าสวมหน้ากากเหล่านั้นคืออะไร, ชักอาวุธออกมา, กำลังเข้ามาจากทางตะวันตก... ?"
 travel_events.2100.desc_flats:0 "ยังคงสังเกตกลุ่มอยู่, ดูเหมือนว่านักขี่ม้าสวมหน้ากากพร้อมอาวุธที่ยกขึ้นกำลังเข้ามาอย่างรวดเร็วจากทางตะวันออก!"
 travel_events.2100.desc_outro:0 "\n\nนี่ดูเหมือนการซุ่มโจมตี, และ "
 travel_events.2100.desc_outro_negative:0 "ข้าลังเล ข้าควรเข้าไปยุ่งในสิ่งที่ดูเหมือนจะเป็นความตายที่แน่นอนสำหรับ [murder_target.GetTitledFirstNameNoTooltip] หรือไม่?"
 travel_events.2100.desc_outro_positive:0 "ไม่ต้องสงสัยเลยในใจข้า ข้าต้องช่วย [murder_target.GetTitledFirstNameNoTooltip]!"
 travel_events.2100.desc_outro_default:0 "ข้าลังเล มันเป็นความรับผิดชอบของข้าจริงๆ หรือที่จะปกป้องนักเดินทางคนอื่นๆ?"
 travel_events.2100.a:0 "ทำไม #EMP ข้า#! ต้องเข้าไปเกี่ยวข้อง?"
 travel_events.2100.a_rival:0 "ไปให้พ้นๆ เสียที"
 travel_events.2100.a_nemesis:0 "#EMP ในที่สุด!#!"
 travel_events.2100.a_stealthy_entourage.tt:0 "คณะเดินทางที่ซ่อนตัว"
 travel_events.2100.a_stealthy_entourage.desc:0 "ท่านและคณะเดินทางของท่านยังคงซ่อนตัวอยู่"
 travel_events.2100.a_stealthy_outcome.tt:0 "หาก [murder_target.GetShortUIName] รอดชีวิต, [murder_target.GetSheHe] จะไม่มีวันรู้ว่าท่านอยู่ที่นี่"
 travel_events.2100.a_nonstealthy_entourage.tt:0 "คณะเดินทางที่ถูกเปิดเผย"
 travel_events.2100.a_nonstealthy_entourage.desc:0 "การปรากฏตัวของท่านถูกสังเกตเห็นโดย [murder_target.GetShortUIName]"
 travel_events.2100.a_nonstealthy_outcome.tt:0 "หาก [murder_target.GetShortUIName] รอดชีวิต, [murder_target.GetSheHe] จะจำสิ่งนี้ได้"
 travel_events.2100.b:0 "ข้าต้องลงมือ!"
 travel_events.2100.b.tt:0 "ท่านเข้าไปขัดขวางความพยายามลอบสังหาร [murder_target.GetShortUIName]"
 travel_events.2100.b_outcome_tt:0 "[murder_target.GetShortUIName] จะจำสิ่งนี้ได้"

#Target Ruler: You are being assassinated
 travel_events.2101.t:1 "$travel_danger_prefix$ $travel_events_life_or_death.t$, นักฆ่า!"
 travel_events.2101.desc:0 "ขณะสำรวจดินแดน [ROOT.Char.GetCurrentLocation.GetName], ดวงอาทิตย์อยู่สูงและมีลมพัดเบาๆ ข้ามองไปรอบๆ และไตร่ตรองถึงความจริงที่ว่าพื้นที่ค่อนข้างรกร้าง, ยกเว้นนกอพยพบางตัวที่อยู่สูงขึ้นไปบนท้องฟ้า\n\nขณะที่ข้าก้มลงเพื่อปรับรองเท้าบู๊ต, ทันใดนั้นข้าก็สะดุ้งตัวตรงเมื่อเราได้ยินเสียงนักขี่ม้าเข้ามาใกล้ ร่างในผ้าคลุมดูเหมือนจะมาจากทุกทิศทาง, และก่อนที่ข้าจะรู้ตัว คนร้ายคนหนึ่งก็อยู่ตรงหน้าข้า, ชักดาบออกมาและพุ่งเข้าใส่คอข้า!"
 travel_events.2101.a:0 "เจ้ากล้าดียังไง!"
 travel_events.2101.a_guards:0 "[bodyguard.GetNameNoTooltip]!!"
 travel_events.2101.a_assassin_death.tt:0 "สังหารนักฆ่า"
 travel_events.2101.a_bodyguard_kill.desc:0 "นักฆ่าถูกสังหารโดย [bodyguard.GetShortUIName]"
 travel_events.2101.a_bodyguard_wounded.tt:0 "องครักษ์บาดเจ็บ"
 travel_events.2101.a_bodyguard_wounded.desc:0 "[bodyguard.GetShortUIName] สังหารนักฆ่า แต่ได้รับบาดเจ็บ"
 travel_events.2101.a_assassin_death.desc:0 "ท่านสังหารนักฆ่า"
 travel_events.2101.a_death.desc:0 "ท่านตาย"
 travel_events.2101.a_ruler_assassinated.tt:0 "[murder_target.GetShortUIName] เสียชีวิต"
 travel_events.2101.a_ruler_assassinated.desc:0 "[murder_target.GetShortUIName] ถูกลอบสังหารขณะเยี่ยมชม [visiting_ruler.MakeScope.Var('assassination_location').GetProvince.GetName]"
 travel_events.2101.a_ruler_survived.tt:0 "[murder_target.GetShortUIName] รอดชีวิต"
 travel_events.2101.a_ruler_survived.desc:0 "[murder_target.GetShortUIName] รอดชีวิตจากความพยายามลอบสังหารใน [visiting_ruler.MakeScope.Var('assassination_location').GetProvince.GetName]"

#Target Ruler: Wait a minute, didn't I see Visiting Ruler??
 travel_events.2102.t:1 "$travel_danger_prefix$ $travel_events_life_or_death.t$, ถูกทรยศ"
 travel_events.2102.desc:0 "การต่อสู้ดำเนินต่อไปราวกับเป็นเวลาหลายชั่วโมง, แต่ในความเป็นจริงมันกินเวลาเพียงไม่กี่นาที นักฆ่าถูกขับไล่ออกไป, และเรารอดชีวิตโดยไม่ได้รับบาดเจ็บ\n\nข้าสำรวจสนามรบและพบหลักฐานของแผนการฆาตกรรมที่วางแผนไว้กับข้าบนศพหนึ่ง ในสภาวะตื่นตัวที่สูงขึ้น ข้ายังสังเกตเห็นธงผืนหนึ่งหายไปจากสายตา [visiting_ruler.GetTitledFirstName]?"
 travel_events.2102.desc_negative:0 "\n\nแน่นอน ข้าคงไร้เหตุผลที่จะคาดหวังการสนับสนุนจากคนอย่าง [visiting_ruler.GetFirstNameNoTooltip] และพรรคพวกของ [visiting_ruler.GetHerHis] ขอให้คำสาปแช่งอยู่บนหลุมศพของ [visiting_ruler.GetHerHis]"
 travel_events.2102.desc_positive:0 "\n\n[visiting_ruler.GetSheHe] ทำได้อย่างไร? ข้า... คาดหวังมากกว่านี้จาก [visiting_ruler.GetHerHim] ดวงตาของข้าปิดลงครึ่งหนึ่งขณะที่ความเจ็บปวดจากการทรยศนี้ทำร้ายข้ามากกว่าที่ดาบใดๆ จะทำได้"
 travel_events.2102.desc_default:0 "\n\n[visiting_ruler.GetSheHe|U] เห็นเหตุการณ์ที่เกิดขึ้นโดยไม่ช่วยเหลือข้าในยามต้องการ? ท่าทีที่ไม่เกี่ยวข้องอย่างก้าวร้าวนี้พิสูจน์ให้เห็นอย่างแท้จริงว่าท่านสามารถพึ่งพาใครได้หรือไม่"
 travel_events.2102.a:0 "นี่แสดงถึงลักษณะนิสัย [visiting_ruler.Custom('InsultAdjectiveGeneric')] ของ [visiting_ruler.GetTitledFirstNamePossessiveNoTooltip] อย่างแท้จริง"

#Visiting Ruler: Letter event - Target Ruler knows you what you did (or rather, didn't do)
 travel_events.2103.t:0 "[murder_target.Custom2('AppropriateGreetingNegative', ROOT.Char )]"
 travel_events.2103.desc_intro:0 "[murder_target.Custom2('NegativeSupplimentaryGreeting', ROOT.Char )]"
 travel_events.2103.desc_negative:0 "\n\nข้าไม่ได้คาดหวังอะไรน้อยไปกว่าความปรารถนาของเจ้าที่จะเฝ้าดูลมหายใจสุดท้ายของข้าจางหายไปในป่าของ [ROOT.Var('assassination_location').GetProvince.GetName] [ROOT.Var('assassination_location').GetProvince.GetTerrain.GetNameNoTooltip|l]\n\nแท้จริงแล้วข้าจะลิ้มรสวันที่ประกายแห่งชีวิตดับไปจากบ่อส้วมที่เจ้าเรียกว่าดวงตา, [visiting_ruler.Custom('InsultAdjectiveGeneric')] [murder_target.Custom2('RelationToMe', SCOPE.sC( 'visiting_ruler' ))] ของข้า"
 travel_events.2103.desc_positive:0 "\n\nเจ้าทำได้อย่างไร, [murder_target.Custom2('RelationToMe', SCOPE.sC( 'visiting_ruler' ))] ของข้า? เจ้าทิ้งข้าให้ตายกลาง [ROOT.Var('assassination_location').GetProvince.GetName] [ROOT.Var('assassination_location').GetProvince.GetTerrain.GetNameNoTooltip|l] ได้อย่างไร? ข้าจะจำสิ่งนี้ไว้, เจ้าแน่ใจได้เลย"
 travel_events.2103.desc_default:0 "\n\n[ROOT.Char.GetTitledFirstName], ข้าคาดหวังความเหมาะสมของมนุษย์ธรรมดาและการเคารพชีวิต เช่นเดียวกับผู้ศรัทธาที่ดีทุกคน การที่เจ้าทิ้งข้าให้ตายกลาง [ROOT.Var('assassination_location').GetProvince.GetName] [ROOT.Var('assassination_location').GetProvince.GetTerrain.GetNameNoTooltip|l] น่าเสียดายที่บ่งบอกถึงลักษณะนิสัยของเจ้าว่าต่ำกว่า [ROOT.Char.GetWomanMan] ที่ยำเกรงพระเจ้า ข้าจะจำสิ่งนี้ไว้"
 travel_events.2103.a:0 "อืม, [murder_target.GetSheHe] #EMP รอดชีวิต#! แล้วนี่นา"

#Visiting Ruler: You heroically thwart the assassination of Target Ruler
 travel_events.2104.t:1 "$travel_danger_prefix$ $travel_events_life_or_death.t$, วิธีช่วยชีวิต"
 travel_events.2104.desc:0 "ข้าและคณะเดินทางของข้าขี่ม้าพุ่งเข้าใส่นักฆ่าที่คาดว่าจะเป็น, ทำให้พวกมันตกใจอย่างสิ้นเชิง เจ้าต้องไร้ความสามารถแค่ไหนถึงไม่มีมุมมองที่ชัดเจนด้านหลังของเจ้า?\n\nเราฟันฝ่าพวกที่ต่อต้านเพียงไม่กี่คนได้อย่างง่ายดาย, และที่เหลือก็วิ่งหนีเข้าไปในป่า ข้ามองขึ้นไปเห็น [murder_target.GetTitledFirstName] จ้องมองข้า, ตาเบิกกว้างและปากอ้าเล็กน้อย\n\nเมื่อ [murder_target.GetSheHe] ตั้งสติได้, ลักษณะใบหน้าของ [murder_target.GetHerHis] ก็ปรับเปลี่ยน, แต่ [murder_target.GetSheHe] ยังคงดูประหลาดใจและขอบคุณสำหรับการแทรกแซงของข้า [murder_target.GetSheHe|U] กวักมือเรียกให้ข้าเข้าไปหา"
 travel_events.2104.a:0 "นั่นคือความดีของข้าสำหรับวันนี้"
 travel_events.2104.a_shy:0 "มันเป็นสิ่งที่ถูกต้องที่ต้องทำ"

#Target Ruler: Visiting Ruler thwarted your assassination
 travel_events.2105.t:0 "$travel_events.2104.t$"
 travel_events.2105.desc_intro:0 "ขณะสำรวจดินแดน [ROOT.Char.GetCurrentLocation.GetName], ทันใดนั้นเราก็ถูกนักฆ่ารุมล้อม และ, ดูเหมือนจะมาจากไหนไม่รู้, [visiting_ruler.GetTitledFirstName] และคณะเดินทางของ [visiting_ruler.GetHerHis] ก็ขี่ม้ามา, พุ่งเข้าใส่และยกอาวุธขึ้น, ตรงเข้าสู่ฝูงนักฆ่า!\n\n"
 travel_events.2105.desc_negative:0 "ข้ามองด้วยความประหลาดใจขณะที่ [ROOT.Char.Custom2('GetRivalNemesis', SCOPE.sC('visiting_ruler'))] ของข้าฟันนักฆ่าซ้ายขวา, ส่วนที่เหลือวิ่งหนีด้วยความหวาดกลัว [visiting_ruler.GetFirstNameNoTooltip] วนกลับมา, แล้วหยุดอยู่ตรงหน้าข้า: "ดูเหมือนท่านต้องการความช่วยเหลือ," [visiting_ruler.GetSheHe] คำราม\n\nข้าลังเล ในขณะที่ [visiting_ruler.GetSheHe] #EMP เพิ่ง#! ช่วยชีวิตข้า, ข้าจะเชื่อใจ [visiting_ruler.GetHerHim] ได้อย่างไร...? ข้าพยักหน้าอย่างไม่เต็มใจ"
 travel_events.2105.desc_positive:0 "ดวงตาของข้าเต็มไปด้วยความสุขขณะที่ข้ามองผู้ช่วยชีวิตและ [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('visiting_ruler'))] [visiting_ruler.GetFirstNameNoTooltip] ขับไล่นักฆ่าออกไป, แล้ววนเป็นวงกว้างและกลับมาที่คณะเดินทางของข้า: "[visiting_ruler.Custom2('RelationToMe', ROOT.Char)] ของข้า! ท่านเป็นอย่างไรบ้าง?" [visiting_ruler.GetSheHe|U] ยิ้มให้ข้า"
 travel_events.2105.desc_default:0 "การช่วยเหลือคนแปลกหน้า — สำหรับทุกจุดประสงค์ — ในยามต้องการพิสูจน์ให้เห็นอย่างแท้จริงว่ามีแผนการของพระเจ้า นี่ต้องเป็นสัญญาณจาก [ROOT.Char.GetFaith.HighGodName] ว่าการเดินทางของเราได้รับพร\n\nผู้ช่วยชีวิตของข้าวนกลับมาหาข้าและพยักหน้าอย่างสุภาพ ข้ายิ้มตอบและรวบรวมคำพูด "[ROOT.Char.GetFaith.HighGodName] อวยพรท่าน, ท่าน [visiting_ruler.GetLadyLord]!""
 travel_events.2105.a:0 "ท่านเป็นจิตวิญญาณอันสูงส่งอย่างแท้จริง!"
 travel_events.2105.a_cynical:0 "ข้าซาบซึ้งในความรู้สึก"
 travel_events.2105.a.tt:0 "[visiting_ruler.GetShortUIName] มาช่วยเหลือท่าน!"

#County Liege: You notice a Travelling Ruler coming under attack
 travel_events.2107.t:1 "$travel_danger_prefix$ $travel_events_life_or_death.t$, ที่หลบภัย"
 travel_events.2107.desc_intro_plains:0 "ขณะที่ดวงอาทิตย์กำลังจะตกดิน, ข้ามองออกไปเหนือ [holding_location.GetTerrain.GetNameNoTooltip|l] จากห้องพักของข้าที่ [holding_location.GetName] ในระยะไกล, กลุ่มนักเดินทางกำลังเดินทางผ่านทุ่งหญ้าที่แผ่กว้างอยู่ข้างหน้าพวกเขา "
 travel_events.2107.desc_intro_desert:0 "ลมพัดเอื่อยๆ ในผืนทรายนอก [holding_location.GetName], ส่งฝุ่นผงเล็กๆ หมุนวนไปทุกทิศทาง ขณะที่ข้ามองดวงอาทิตย์ที่กำลังเคลื่อนคล้อยนอกป้อมปราการ, ข้าสังเกตเห็นกลุ่มนักเดินทางกำลังก้าวเดินอย่างขยันขันแข็งข้ามผืนทราย "
 travel_events.2107.desc_intro_wetlands:0 "ขณะที่ดวงอาทิตย์กำลังตกดิน, [holding_location.GetTerrain.GetNameNoTooltip|l] นอก [holding_location.GetName] มีสีสันที่โดดเด่นในเย็นวันนี้ จากความศักดิ์สิทธิ์ของป้อมปราการของข้า ข้าสังเกตสีสันที่เปลี่ยนไปและความมืดที่ใกล้เข้ามา, และขณะทำ เช่นนั้น ข้าสังเกตเห็นกลุ่มนักเดินทางที่อยู่ไกลออกไปนอกที่ดิน, กำลังเดินทางผ่านถนนโคลน "
 travel_events.2107.desc_intro_forest:0 "ขณะที่ดวงอาทิตย์กำลังตกดิน, ป่ารอบๆ [holding_location.GetName] ก็มืดลง จากความศักดิ์สิทธิ์ของป้อมปราการของข้า ข้าศึกษาแสงยามเย็นและขณะทำ เช่นนั้น ข้าสังเกตเห็นกลุ่มนักเดินทางกำลังเดินทางผ่านขอบป่า "
 travel_events.2107.desc_intro_mountains:0 "อากาศสดชื่นขณะที่ข้ายื่นศีรษะออกไปนอกอาคาร, มองลงไปที่หุบเขาเบื้องล่าง [holding_location.GetName] ข้าชื่นชมความแตกต่างของอุณหภูมิขณะที่ข้าสังเกตสัตว์ป่าและ, ข้าสังเกตเห็น, กลุ่มนักเดินทางที่กำลังเดินทางอย่างขยันขันแข็งผ่านหุบเขา "
 travel_events.2107.desc_intro_hills:0 "เนินลาดที่อ่อนโยนรอบๆ [holding_location.GetName] นั้นสบายตาขณะที่ข้ามองออกไปนอกอาคารและลงไปตามเนินเขาไปยังสระน้ำเล็กๆ เบื้องล่าง กลุ่มนักเดินทางดูเหมือนกำลังเดินทางรอบสระน้ำ, ก้าวไปข้างหน้าสู่จุดหมายปลายทางของพวกเขา "
 travel_events.2107.desc_intro_jungle:0 "ป่าร้อนและชื้นตามปกติ, และจากความศักดิ์สิทธิ์ของป้อมปราการของข้า ข้ามองขึ้นไปบนต้นไม้เหนือ [holding_location.GetName] เพื่อเหลือบมองนกสีสันสดใสที่ทำรังอยู่ด้านบน หางตาของข้า, ข้าสังเกตเห็นกลุ่มนักเดินทางกำลังเดินทางไปตามพงไม้ทางทิศเหนือ "
 travel_events.2107.desc_intro:0 "ท้องฟ้าแทบไม่มีเมฆขณะที่ข้าใช้เวลาช่วงบ่ายในเขตชานเมือง [holding_location.GetName] ระหว่างทางกลับไปยังที่ดิน, ข้าสังเกตเห็นกลุ่มนักเดินทางกำลังเดินทางอยู่นอกเขตเมืองเพียงเล็กน้อย "
 travel_events.2107.desc_segway:0 "\n\nเมื่อข้ามองใกล้ขึ้น ข้าตระหนักว่าผู้นำกลุ่มไม่ใช่ใครอื่นนอกจาก [travelling_ruler.GetTitledFirstName] และคณะเดินทางของ [travelling_ruler.GetHerHis] ขณะศึกษาการเคลื่อนไหวของพวกเขาอย่างไม่เป็นทางการ, ข้ามองขึ้นไปโดยสัญชาตญาณเมื่อฝูงนักขี่ม้าเข้าใกล้กลุ่มที่สงบสุขอย่างรวดเร็ว\n\nเมื่อนักขี่ม้าเข้ามาใกล้ขึ้น, พวกเขาก็เริ่มยกอาวุธขึ้น "
 travel_events.2107.desc_outro_negative:0 "นี่น่าจะน่าสนใจ"
 travel_events.2107.desc_outro_positive:0 "ข้าต้องทำอะไรสักอย่าง!"
 travel_events.2107.desc_outro_family:0 "เลือดข้นกว่าน้ำ, หรืออย่างที่พวกเขากล่าว?"
 travel_events.2107.desc_outro:0 "นักเดินทางกำลังจะถูกทำร้ายอย่างชัดเจน, บนดินแดน #EMP ของข้า#! "
 travel_events.2107.a:0 "เป็นหน้าที่ของเราที่จะเข้าไปแทรกแซง"
 travel_events.2107.a_christian:0 "เป็นสิ่งที่ [ROOT.Char.GetFaith.GetAdjectiveNoTooltip] ที่ดีทุกคนจะทำ"
 travel_events.2107.a_outcome_tt:0 "[travelling_ruler.GetShortUIName] จะจำสิ่งนี้ได้"
 travel_events.2107.b:0 "นี่อันตรายเกินไป"
 travel_events.2107.b_negative:0 "ไปให้พ้นๆ เสียที"
 travel_events.2107.b_outcome_tt:0 "หาก [travelling_ruler.GetShortUIName] รอดชีวิต, [travelling_ruler.GetSheHe] จะจำสิ่งนี้ได้"

#Travelling Ruler: You are saved by County Liege
 travel_events.2108.t:1 "$travel_danger_prefix$ $travel_events_life_or_death.t$, รอดชีวิต"
 travel_events.2108.desc_intro:1 "ขณะเดินทางผ่าน [holding_location.GetTerrain.GetNameNoTooltip|l] บริเวณชานเมือง [holding_location.GetName], ทันใดนั้นเราก็ถูกโจมตีโดยฝูงนักขี่ม้าโจร, กระหายเลือด นักขี่ม้าอีกกลุ่มหนึ่งเข้ามาใกล้อย่างรวดเร็วจากที่ดินใกล้เคียง, นำโดย [province_liege.GetTitledFirstName]!"
 travel_events.2108.desc_negative:0 "\n\nข้าเก็บความประหลาดใจไว้ก่อน, เพราะการได้รับการช่วยเหลือจากไม่ใช่ใครอื่นนอกจาก [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('province_liege'))] ของข้าไม่ใช่สิ่งที่ข้าคาดหวังอย่างแน่นอน!"
 travel_events.2108.desc_positive:0 "\n\nหัวใจข้าอบอุ่นขณะที่ [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('province_liege'))] [province_liege.GetFirstNameNoTooltip] ของข้านำการบุกเข้าใส่ด้านหลังที่ไม่ได้รับการป้องกันของกลุ่มคนเลว"
 travel_events.2108.desc:0 "\n\nข้าประทับใจอย่างยิ่งในท่าทีเห็นแก่ผู้อื่นของ [province_liege.GetTitleAsNameNoTooltip] ท้องถิ่น, และข้าสรรเสริญ [ROOT.Char.GetFaith.HighGodName] ที่พวกเขามาถึงทันเวลาพอดี"
 travel_events.2108.desc_segway:0 "\n\n[province_liege.GetFirstNameNoTooltip] วนกลับมาพร้อมรอยยิ้มแห่งชัยชนะบนใบหน้า [province_liege.GetHerHis]: "
 travel_events.2108.desc_outro_negative:0 ""ข้าไม่สามารถปล่อยให้ใครอื่นได้รับความสุขจากการจบชีวิต [province_liege.Custom2('RelationToMe', ROOT.Char)] ของข้าได้, ใช่ไหม?" ข้าลังเลอยู่ครู่หนึ่ง, แล้วตอบโต้"
 travel_events.2108.desc_outro_positive:0 ""ท่านบาดเจ็บหรือไม่? โปรดมาร่วมรับการต้อนรับจากเราที่ [holding_location.GetNameNoTooltip], เมื่อความยุ่งเหยิงนี้ถูกจัดการเรียบร้อยแล้ว""
 travel_events.2108.desc_outro:0 ""ท่านควรเข้าร่วมรับการต้อนรับแบบ [province_liege.GetCulture.GetNameNoTooltip] จากเราที่ [holding_location.GetNameNoTooltip]!""
 travel_events.2108.a:0 "จะเป็นเกียรติอย่างยิ่ง!"
 travel_events.2108.a_negative:0 "ดีใจที่ยังมีชีวิตอยู่, ข้าว่านะ"
 travel_events.2108.a.tt:0 "[province_liege.GetShortUIName] มาช่วยเหลือท่าน!"

#County Liege: You save Travelling Ruler
 travel_events.2109.t:0 "$travel_events.2108.t$"
 travel_events.2109.desc_intro:0 "พวกโจรไม่รู้ว่าอะไรชนพวกมัน ข้านำนักรบที่เก่งที่สุดของเราเข้าสู่การรบนอก [holding_location.GetName] และเราฟันฝ่ากลุ่มเหมือนเนยบนวันฤดูร้อนที่ร้อนระอุ"
 travel_events.2109.desc_negative:0 "\n\n[ROOT.Char.Custom2('RelationToMe', SCOPE.sC('travelling_ruler'))] [travelling_ruler.GetTitledFirstName] ของข้ายืนตะลึง, ราวกับถูกฟ้าผ่า, มองดูการบุกและการป้องกันที่ประสบความสำเร็จของเราต่อกลุ่มเดินทางของ [travelling_ruler.GetHerHis]"
 travel_events.2109.desc_positive:0 "\n\n[travelling_ruler.GetTitledFirstName] และคณะเดินทางของ [travelling_ruler.GetHerHis] กำลังเชียร์เราขณะที่เราทำการโต้กลับครั้งสุดท้ายต่อพวกคนเลว"
 travel_events.2109.desc:0 "\n\n[travelling_ruler.GetTitledFirstName] มองเราอย่างใกล้ชิดขณะที่เราจัดการพวกคนเลว, แล้วอ่อนลงเล็กน้อยเมื่อเห็นได้ชัดว่าเราเป็นมิตร"
 travel_events.2109.desc_segway:0 "\n\nเมื่อผู้โจมตีถูกส่งให้หนีไปในที่สุด, ข้าวนกลับไปหา [travelling_ruler.GetFirstNameNoTooltip], "
 travel_events.2109.desc_outro_negative: "ซึ่งตอนนี้ดูเหมือนจะฟื้นคืนสติสัมปชัญญะของ[travelling_ruler.GetHerHis]แล้ว [travelling_ruler.GetSheHe|U] พยักหน้าให้ข้าอย่างเป็นมิตร \"ไม่มีอะไรที่เราจัดการไม่ได้ แต่มันก็ดีที่ไม่ต้องออกแรงมากเกินไป\" [travelling_ruler.GetSheHe] ยอมรับ"
 travel_events.2109.desc_outro_positive:0 "ผู้ ซึ่งกำลังเข้ามาหาข้าอย่างรวดเร็ว "[ROOT.Char.Custom2('RelationToMe', SCOPE.sC('province_liege'))] ของข้า! ข้าหวังว่าเราจะได้พบกันอีกครั้งภายใต้สถานการณ์ที่เลวร้ายน้อยกว่านี้," [travelling_ruler.GetSheHe] อุทาน"
 travel_events.2109.desc_outro:0 "ผู้ ซึ่งตอนนี้ดูเหมือนจะสบายใจกับการปรากฏตัวของเรามากขึ้น "สหายข้า, ขอบคุณที่ช่วยเหลือเราในยามต้องการ," [travelling_ruler.GetSheHe] กล่าว, ยิ้มให้ข้า"
 travel_events.2109.a:0 "แผ่นดินปลอดภัยอีกครั้ง"
 travel_events.2109.a_negative:0 "ข้าแค่อยากหลีกเลี่ยงการจัดการความยุ่งเหยิงที่ใหญ่กว่านี้"
 travel_events.2109.a_positive:0 "ยินดีรับใช้, [province_liege.Custom2('RelationToMe', SCOPE.sC('travelling_ruler'))]!"
 travel_events.2109.a_hurt.tt:0 "[ROOT.Char.Custom('KnightCultureNoTooltip')] บาดเจ็บ"
 travel_events.2109.a_first_hurt.desc:0 "[first_potential_hurt_knight.GetShortUIName] ได้รับบาดเจ็บในการรบ"
 travel_events.2109.a_second_hurt.desc:0 "[second_potential_hurt_knight.GetShortUIName] ได้รับบาดเจ็บในการรบ"
 travel_events.2109.a_third_hurt.desc:0 "[third_potential_hurt_knight.GetShortUIName] ได้รับบาดเจ็บในการรบ"
 travel_events.2109.a_none_hurt.tt:0 "ไม่ได้รับบาดเจ็บ"
 travel_events.2109.a_none_hurt.desc:0 "ไม่มี [ROOT.Char.Custom('KnightCulturePluralNoTooltipLowercase')] ของท่านได้รับบาดเจ็บในการรบ"

#Travelling Ruler: You get ruthlessly attacked
 travel_events.2110.t:1 "$travel_danger_prefix$ $travel_events_life_or_death.t$, ถูกทอดทิ้ง"
 travel_events.2110.desc:0 "ขณะเดินทางผ่าน [holding_location.GetTerrain.GetNameNoTooltip|l] บริเวณชานเมือง [holding_location.GetName], ทันใดนั้นเราก็ถูกโจมตีโดยฝูงนักขี่ม้าโจร, กระหายเลือด เราอยู่ใกล้ที่ดินมาก, แน่นอนว่า [province_liege.GetTitledFirstName] จะส่งความช่วยเหลือมา?\n\nเมื่อเวลาผ่านไปและเราถูกไล่ล่าโดยพวกคนเลว, หลีกเลี่ยงการต่อสู้เป็นเวลานานที่สุด, ก็เห็นได้ชัดอย่างเจ็บปวดว่าไม่มีความช่วยเหลือใดๆ มาถึง"
 travel_events.2110.desc_negative:0 "ข้าไม่แน่ใจว่าข้าคาดหวังสิ่งใดจาก [travelling_ruler.Custom2('InsultNoun', ROOT.Char)] อย่าง [province_liege.GetFirstNameNoTooltip] แต่ถึงกระนั้น นี่ก็ยังต่ำตมเกินกว่า [province_liege.GetHerHim] จะทำ"
 travel_events.2110.desc_positive:0 "ข้ารู้สึกเจ็บแปลบที่หน้าอกขณะที่ข้าตระหนักถึงการทรยศที่เพิ่งเกิดขึ้นโดย [province_liege.GetTitledFirstNameNoTooltip]"
 travel_events.2110.desc_neutral:0 "ผู้ปกครองจะปล่อยให้นักขี่ม้าที่มุ่งร้าย เช่นนี้อาศัยอยู่ในเขตแดนของ [province_liege.GetHerHis] ได้อย่างไร?"
 travel_events.2110.desc_outro:0 "\n\n[ROOT.Char.Custom('KnightCultureNoTooltipLowercase')] [knight_to_sacrifice.GetTitledFirstName] ของข้าขี่ม้ามาข้างๆ ข้า, สีหน้าเคร่งขรึมในดวงตา [knight_to_sacrifice.GetHerHis] เราทั้งคู่รู้กลยุทธ์ที่เราเคยฝึกฝนในอดีต"
 travel_events.2110.a:0 "เรายืนหยัดเป็นหนึ่งเดียว"
 travel_events.2110.a_unscathed.tt:0 "ไม่ได้รับบาดเจ็บ"
 travel_events.2110.a_unscathed.desc:0 "ท่านรอดชีวิตจากการรบโดยไม่ได้รับบาดเจ็บ"
 travel_events.2110.a_injured.tt:0 "บาดเจ็บ"
 travel_events.2110.a_injured.desc:0 "ท่านรอดชีวิตจากการรบ แต่ได้รับบาดเจ็บ"
 travel_events.2110.a_severely_injured.tt:0 "บาดเจ็บสาหัส"
 travel_events.2110.a_severely_injured.desc:0 "ท่านได้รับบาดเจ็บสาหัสในการรบ"
 travel_events.2110.a_death:0 "ท่านถูกสังหารในการรบ"
 travel_events.2110.b:0 "[knight_to_sacrifice.GetFirstNameNoTooltip], ท่านรู้ว่าต้องทำอะไร"
 travel_events.2110.b_tt:0 "[knight_to_sacrifice.GetShortUIName] อยู่ข้างหลังเพื่อเบี่ยงเบนความสนใจของผู้โจมตี"

#County Liege: You observe the attack on Travelling Ruler
 travel_events.2111.t:1 "$travel_danger_prefix$ $travel_events.2110.t$"
 travel_events.2111.desc_sacrifice:0 "ดวงอาทิตย์กำลังตกดินเหนือ [holding_location.GetTerrain.GetNameNoTooltip|l] ขณะที่ข้าสังเกตฉากตรงหน้าข้า หากข้าคาดหวังการรบเต็มรูปแบบ, ข้าคิดผิด\n\nดูเหมือนว่า [travelling_ruler.GetTitledFirstName] ได้สั่งให้มีตัวล่อและถอยทัพ, หมายความว่า [travelling_ruler.Custom('KnightCulturePluralNoTooltipLowercase')] คนหนึ่งของ [travelling_ruler.GetHerHis] อยู่ข้างหลังเพื่อช่วยชีวิตส่วนที่เหลือของคณะ ในขณะเดียวกัน คณะเดินทางได้จัดระเบียบใหม่และกำลังมุ่งหน้าไปยังสุดเขตเมือง\n\nดูเหมือนจะได้ผล, เนื่องจากนักขี่ม้าเพิกเฉยต่อกลุ่มที่หลบหนีและมุ่งเป้าไปที่ทหารโดดเดี่ยวแทน, กลืนกิน [knight_to_sacrifice.GetHerHim] ไปจากสายตาข้า หวังว่าจุดจบจะรวดเร็ว"
 travel_events.2111.desc_unscathed:0 "ขณะที่ดวงอาทิตย์ แต่งแต้มท้องฟ้าเป็นสีแดงเมื่อมันลับขอบฟ้า, การรบตรงหน้าข้าก็ แต่งแต้มพื้นดินเป็นสีแดง อย่างไรก็ตาม, ดูเหมือนว่านี่เป็นเพียงเลือดโจรเท่านั้น\n\nกลุ่มเดินทางกำลังแสดงความสามารถที่น่าประหลาดใจเมื่อเผชิญกับการโจมตีกะทันหัน, และกำลังต่อสู้อย่างสุดกำลัง — ในที่สุดก็บังคับให้พวกคนเลวหนีไป พวกมันเพียงแค่โยนอาวุธและถอยกลับไปทางที่พวกมันมาอย่างรวดเร็ว\n\n[travelling_ruler.GetTitledFirstName] ทำท่าทางท้าทายไปทางที่ดินของข้า, และข้าเลิกคิ้วด้วยความประหลาดใจเงียบๆ นี่ #EMP ไม่คาดคิด#! ที่สุด"
 travel_events.2111.desc_survived:0 "ขณะที่ดวงอาทิตย์ตกดินเหนือ [holding_location.GetTerrain.GetNameNoTooltip|l], ทั้งสองกลุ่มก็ปะทะกันเป็นกลุ่มก้อนของอาวุธและความเจ็บปวด ข้าสังเกตขณะที่ความตกใจครั้งแรกของคณะเดินทางจางหายไปและพวกเขาก็ลุกขึ้นยืนอย่างขยันขันแข็ง, ผลักดันนักขี่ม้าติดอาวุธกลับไป\n\n[travelling_ruler.GetTitledFirstName] เป็นผู้นำขณะที่การโต้กลับมาถึง, รวดเร็วและอันตราย, ลงมาที่พวกโจรที่สกปรก คนเลวคนหนึ่งดูเหมือนจะสามารถโจมตี [travelling_ruler.GetFirstNameNoTooltip] ได้ค่อนข้างรุนแรง, แต่ในไม่ช้าก็ถูกตอบโต้โดย [travelling_ruler.Custom('KnightCulturePluralNoTooltipLowercase')] คนหนึ่งของ [travelling_ruler.GetHerHis]\n\nนักขี่ม้าที่ยังหายใจและสามารถจากไปได้ก็ออกจากที่เกิดเหตุ, รวดเร็วและกะทันหันเหมือนตอนที่พวกเขาปรากฏตัว ทิ้งไว้เบื้องหลัง, ศพและสัตว์ที่ตาย; แต่เป็นการรวมตัวของนักเดินทางที่สุขภาพดีอย่างน่าประหลาดใจ"
 travel_events.2111.desc_died:0 "ขณะที่ดวงอาทิตย์ แต่งแต้มท้องฟ้าเป็นสีแดงเมื่อมันลับขอบฟ้า, การรบตรงหน้าข้าก็ แต่งแต้มพื้นดินเป็นสีแดง ข้าสังเกตอย่างกระตือรือร้น, พยายามแยกแยะว่าฝ่ายใดได้เปรียบ\n\nความสงสัยของข้ากระจ่างในไม่ช้าเมื่อนักขี่ม้าที่ตัวใหญ่และเทอะทะคนหนึ่งคำรามอย่างมีชัย, ยกแขน [rider.GetHerHis] ขึ้นฟ้า มือข้างหนึ่งถือดาบ, อีกข้าง... ศีรษะของ [travelling_ruler.GetTitledFirstName]"
 travel_events.2111.desc_negative_outro:0 "\n\nข้าถอนหายใจอย่างโล่งอก ในที่สุด [travelling_ruler.Custom2('InsultNoun', ROOT.Char)] ผู้นั้นก็ไม่เป็นหนามยอกอกข้าอีกต่อไป"
 travel_events.2111.desc_positive_outro:0 "\n\nข้ากระพริบตาสองสามครั้ง, ไม่เข้าใจสิ่งที่เพิ่งเกิดขึ้นอย่างถ่องแท้ ใช่, ข้าว่านี่คือจุดจบของ [travelling_ruler.GetHerHim]..."
 travel_events.2111.desc_outro:0 "\n\nข้ารู้สึกว่างเปล่าอย่างน่าประหลาดใจ, เพิ่งได้เห็นการฆาตกรรม [travelling_ruler.GetTitledFirstNameNoTooltip] ข้าควรทำอะไรบางอย่างเกี่ยวกับนักขี่ม้าเหล่านั้น"
 travel_events.2111.a:0 "กลยุทธ์ที่น่าสนใจ"
 travel_events.2111.a_compassionate:0 "ข้าทำอะไรลงไป..."
 travel_events.2111.a_sadist:0 "น่าบันเทิง!"
 travel_events.2111.a_dead:0 "มันต้องเกิดขึ้นในที่สุด"
