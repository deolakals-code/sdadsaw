#Visit a plantation - Fire!
 travel_events.2012.t:0 "ไฟไหม้!"
 travel_events.2012.desc:0 "เราขี่ม้าผ่านดินแดนที่เต็มไปด้วยเกษตรกรรม จุดแวะพักต่อไปของเราคือไร่ท้องถิ่นที่ [ROOT.Char.GetCurrentLocation.GetName], แต่เมื่อข้าเห็นประตูอยู่ห่างออกไปประมาณร้อยก้าว, มีบางอย่างผิดปกติ...\n\nข้าสูดกลิ่นฉุนของ... ควัน? ควัน? ไฟไหม้! ทันใดนั้นข้าก็สังเกตเห็นเสาควันที่ก่อตัวขึ้นเหนือไร่\n\nเสาควันนั้นหนาและหนัก — ใหญ่เกินกว่าจะมาจากคนงานคนหนึ่งที่กำลังเผาเศษซากที่กระจัดกระจาย"
 travel_events.2012.a:0 "[guard_type_character.GetFirstNameNoTooltip], เร็วเข้า! เอาถังพวกนั้นมา!"
 travel_events.2012.a_unscathed:0 "ดับไฟแล้ว"
 travel_events.2012.a_unscathed_desc:0 "[guard_type_character.GetShortUIName] ดับไฟ"
 travel_events.2012.a_scarred:0 "ดับไฟ แต่มีแผลเป็น"
 travel_events.2012.a_scarred_desc:0 "[guard_type_character.GetShortUIName] ดับไฟ แต่มีแผลเป็น"
 travel_events.2012.a_death:0 "ดับไฟ แต่เสียชีวิต"
 travel_events.2012.a_death_desc:0 "[guard_type_character.GetShortUIName] ดับไฟ แต่เสียชีวิตในกระบวนการ"
 travel_events.2012.b:0 "ไปอพยพผู้คนออกจากโรงทำงานกันเถอะ!"
 travel_events.2012.b_unscathed:0 "ไม่ได้รับบาดเจ็บ"
 travel_events.2012.b_unscathed_desc:0 "ท่านช่วยคนงานโดยไม่ได้รับบาดเจ็บ"
 travel_events.2012.b_scarred:0 "มีแผลเป็น"
 travel_events.2012.b_scarred_desc:0 "ท่านช่วยคนงาน แต่มีแผลเป็น"
 travel_events.2012.b_tt:0 "ความเห็นของคณะเดินทางที่มีต่อท่านเพิ่มขึ้นอย่างมาก"
 travel_events.2012.c:0 "#EMP อืม#!, ถ้างั้น, นี่ไม่ใช่โอกาสหรือ..."
 travel_events.2012.c_secret:0 "การปล้นสะดมลับ"
 travel_events.2012.c_secret_desc:0 "การปล้นสะดมของท่านยังคงเป็นความลับ"
 travel_events.2012.c_revealed:0 "การปล้นสะดมถูกเปิดเผย"
 travel_events.2012.c_revealed_desc:0 "การปล้นสะดมของท่านถูกเปิดเผยโดย [county_liege.GetShortUIName]"
 travel_events.2012.c_tt:0 "สมาชิกคณะเดินทางของท่านสูญเสียความเห็นต่อท่านไปอย่างมาก"
 travel_events.2012.d:0 "เราไม่เคยอยู่ที่นี่"
 travel_events.2012.d_flavor:0 "คณะเดินทางแอบย่องออกไปอย่างเงียบๆ"
 travel_events.2012.d_tt:0 "สมาชิกคณะเดินทางของท่านสูญเสียความเห็นต่อท่าน"

#Visit a hillfort - Train to gain military skillz
 travel_events.2013.t:0 "ความรู้ที่เสริมกำลัง"
 travel_events.2013.intro:0 "ระดับความสูงและอากาศที่สดชื่นของ [ROOT.Char.GetCurrentLocation.GetName] มีคุณภาพที่สดชื่นมากขณะที่เราเดินทางผ่านป้อมปราการบนเนินเขาท้องถิ่น"
 travel_events.2013.martial:0 "\n\nข้าจ้องมองทหารที่กำลังฝึกอยู่เบื้องล่างด้วยสายตาที่เฉียบแหลม กลยุทธ์ของพวกเขาไม่ได้แปลกใหม่สำหรับข้าเลย, ผู้ ซึ่งได้รับการฝึกฝนในศิลปะการต่อสู้"
 travel_events.2013.default:0 "\n\nทหารในหุบเขาเบื้องล่างดูเหมือนกำลังฝึกฝนเทคนิคการฝึกที่หายากบางอย่างที่ข้าไม่เคยเห็นมาก่อน ข้าเข้าไปใกล้ขึ้น, ไม่สามารถยับยั้งความอยากรู้อยากเห็นของข้าได้"
 travel_events.2013.outro:0 "\n\nขณะกำลังทำ เช่นนั้น กัปตันท้องถิ่น [local_captain.GetFirstNameNoTooltip] ก็เข้ามาหาข้า: "ท่านประสงค์จะเข้าร่วมด้วยหรือไม่ [ROOT.Char.Custom('FormOfAddressForLiege')]?""
 travel_events.2013.rough_terrain:0 "กลายเป็นผู้เชี่ยวชาญในภูมิประเทศทุรกันดาร"
 travel_events.2013.reckless:0 "กลายเป็นคนบ้าบิ่น"
 travel_events.2013.a:0 "ข้าพร้อมสำหรับความท้าทายเสมอ!"
