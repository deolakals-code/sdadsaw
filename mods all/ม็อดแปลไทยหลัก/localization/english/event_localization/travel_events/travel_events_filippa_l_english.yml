l_english: 
#Travel Flavor Events
#Good omen? - Encounter a duck
 travel_events.2000.t:0 "เป็ดอะไรกัน?"
 travel_events.2000.desc:0 "วันเดินทางบนท้องถนนค่อนข้างสงบและไม่มีอะไรโดดเด่นจนถึงตอนนี้ เราอยู่ที่ไหนสักแห่งนอก [ROOT.Char.GetCurrentLocation.GetName] และข้าหลับตาลงขณะที่พาหนะของข้านำข้าไปข้างหน้า, ทีละก้าวอย่างมั่นคง\n\nขณะที่สายลมบรรเลงเพลงอันไพเราะผ่านยอดไม้, เสียงอื่นก็ลอยมาตามสายลม, และไม่ใช่จากคณะเดินทางของเรา นั่น... เสียงร้องก้าบๆ หรือ?\n\n"
 travel_events.2000.desc_meh_memory:0 "ข้าสำรวจรอบๆ เพื่อหาสัตว์ปีก ครั้งสุดท้ายที่ข้าตามเป็ดเข้าไปในป่า เรื่องราวกลายเป็น... กระอักกระอ่วน"
 travel_events.2000.desc_delicious_memory:0 "ครั้งสุดท้ายที่ข้าตามเป็ดเข้าไปในป่า ข้าได้อาหารมื้อ #EMP อร่อยเลิศ#! บางทีนี่อาจเป็นวันโชคดีของข้า?"
 travel_events.2000.desc_good_memory:0 "ข้าระลึกถึงครั้งสุดท้ายที่ข้าเจอเป็ดในป่าด้วยความรักใคร่ มันนำข้าไปสู่รังของลูกเป็ดขนปุย #EMP มากมาย#! "
 travel_events.2000.desc_bad_memory:0 "ข้าลังเลอยู่ครู่หนึ่ง, นึกถึงครั้งสุดท้ายที่ข้าตามเป็ดเข้าไปในป่า มันจบไม่สวยเลย"
 travel_events.2000.desc_default:0 "ข้าแยกแยะได้ว่าเสียงนั้นมาจากพุ่มไม้ทางขวามือของข้า"
 travel_events.2000.a:0 "นั่นเป็นลางดี"
 travel_events.2000.a_sadist:0 "นี่มันไร้สาระ"
 travel_events.2000.b:0 "ตามเป็ดตัวนั้นไป!"
 travel_events.2000.b_sadist:0 "ข้าว่าข้าตามมันไปก็ได้..."
 travel_events.2000.b.tt:0 "ท่านตามเป็ดไปครู่หนึ่ง"
 travel_events.2000.c:0 "อี้, สัตว์ปีกน่ารำคาญ! ไปให้พ้น!"
 travel_events.2000.c.tt:0 "ท่านโยนก้อนกรวดไปทางเสียงร้องก้าบๆ"

#Duck follow-up
 travel_events.2001.t_positive:0 "นี่คือ..."
 travel_events.2001.t_negative:0 "นั่นไม่ใช่เป็ด!"
 travel_events.2001.t:0 "ก้าบ!"
 travel_events.2001.intro:0 "ข้าลงจากหลังม้าและหาเป็ดในพุ่มไม้ใกล้ๆ มันเริ่มเดินเตาะแตะเข้าไปในป่า, และข้าเดินตามไป"
 travel_events.2001.desc_positive:0 "\n\nขณะที่ข้าเดินต่อไป, เสียงร้องก้าบๆ เบาๆ ก็ค่อยๆ มีเสียงร้องจิ๊บๆ เล็กๆ เข้าร่วม — ตอนแรกแผ่วเบา แต่ดังขึ้นเรื่อยๆ — เมื่อข้าเลี้ยวผ่านพุ่มไม้ถัดไป, ข้าไม่เห็นเป็ดตัวเดียว, แต่เป็น #EMP ฝูงใหญ่#! ของเป็ดและรังลูกเป็ด!"
 travel_events.2001.desc_positive_sadist:0 "\n\nข้ารู้สึกท้องร้องขณะที่ข้ามองภาพเป็ดและลูกเป็ดเนื้อนุ่ม"
 travel_events.2001.desc_positive_default:0 "\n\nข้ารู้สึกเข่าอ่อนขณะที่ข้ามองความนุ่มฟูของทั้งหมด"
 travel_events.2001.desc_negative:0 "\n\nขณะที่ข้าหลงทางห่างจากคณะเดินทางของข้าไปเรื่อยๆ, ความหนาวเย็นก็แล่นวาบไปตามสันหลังของข้า มีบางอย่างกำลังจ้องมองข้าอยู่หรือ?\n\nทันใดนั้น, [ROOT.Char.Custom('RegionalFerociousAnimal')] ก็ปรากฏตัวขึ้นที่ขอบพงไม้! มันส่งเสียงและมองข้าด้วยดวงตาโกรธเกรี้ยว"
 travel_events.2001.desc:0 "\n\nทันใดนั้น, เป็ดก็หยุดและเอียงหัวมาทางข้า, สับสนอย่างชัดเจนว่าเหตุใดจึงมีมนุษย์ตามมา\n\nข้ายิ้มให้เป็ด, พยายามคลายความตึงเครียด, แต่เป็ดก็ดิ้นพรวด, กระพือปีกและบินหนีไป"
 travel_events.2001.a:0 "นี่มัน... #EMP มากเกินไปแล้ว!#!"
 travel_events.2001.a_tt:0 "#EMP น่าพึงพอใจ#!"
 travel_events.2001.a_tt_death:0 "ความน่ารักนั้นมากเกินไปสำหรับหัวใจอันอ่อนแอของท่าน"
 travel_events.2001.b:0 "พวกนี้คงทำเป็นเป็ดย่างชั้นเลิศ..."
 travel_events.2001.b_success.tt:0 "อาหารมื้อดี"
 travel_events.2001.b_failure.tt:0 "สำลักมัน"
 travel_events.2001.c:0 "นี่มัน #EMP แย่แล้ว!#!"
 travel_events.2001.c_success.tt:0 "สำเร็จ"
 travel_events.2001.c_ran:0 "ท่านวิ่งหนีได้สำเร็จ"
 travel_events.2001.c_failure.tt:0 "บาดเจ็บ"
 travel_events.2001.c_hit_and_ran:0 "ท่านถูกโจมตี แต่หนีไปได้"
 travel_events.2001.c_critical_failure:0 "สัตว์ร้ายทำร้ายท่านจนพิการ"
 travel_events.2001.d:0 "เตรียมพร้อม!"
 travel_events.2001.d_scare_beast:0 "ท่าน ทำให้สัตว์ร้ายตกใจกลัวหนีไป"
 travel_events.2001.d_beast_hit:0 "สัตว์ร้ายตอบโต้ แต่หนีไป"
 travel_events.2001.e:0 "ช่างเป็นการไล่... #EMP เป็ด#! ที่บ้าบออะไร เช่นนี้?"

#Crossing an ant path - Ignore or don't ignore your guide
 travel_events.2002.t:0 "เส้นทางที่ถูกเหยียบย่ำ"
 travel_events.2002.desc:0 "ขบวนเดินทางได้หยุดชะงักลงในระยะใกล้เพียงขว้างหินจาก [ROOT.Char.GetCurrentLocation.GetName] ข้าเหลือบไปเห็น [guide_leader.GetFirstName] ผู้เป็น [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('guide_leader'))] ของข้า ลงจากม้าและกำลังจ้องมองบางสิ่งบนพื้นอย่างตั้งอกตั้งใจ เหล่าผู้ติดตามคนอื่น ๆ ได้มารวมกลุ่มกันรอบตัว [guide_leader.GetHerHim]\n\n[guide_leader.GetFirstNameNoTooltip] เงยหน้าขึ้นขณะที่ข้าเข้าไปใกล้ "[ROOT.Char.Custom('FormOfAddressForLiege')|U] ที่นี่มีทางเดินมดขอรับ ข้าอาจจะเชื่อโชคลางอยู่บ้าง แต่ท่านไม่ควรเดินข้ามทางเดินมดเป็นอันขาด""\n\n[guide_leader.GetSheHe|U] หยุดชั่วครู่ "ท่านทวด[great_grand_parent.Custom('MotherFather')]ของข้าเคยทำ และ [great_grand_parent.GetSheHe] ก็มิเคยได้กลับบ้านอีกเลย""
 travel_events.2002.a:0 "#EMP ก็ได้#! เราจะหาเส้นทางอื่น"
 travel_events.2002.b:1 "นี่มันไร้สาระ ข้าจะเป็นผู้นำทางเอง!"
 travel_events.2002.c:0 "ข้ามีวิธีแก้ความเชื่อโชคลางของเจ้าพอดี"
 travel_competent_guide_tt:0 "ท่านเป็นผู้นำทางที่มีความสามารถ"
 travel.competent_guide:0 "$travel_competent_guide_tt$"
 travel_get_lost_tt:0 "ท่านหลงทาง"

#Visit the local military place (barrack/military camp/regiment grounds) - Try to improve your martial
 travel_events.2003.t:0 "การศึกษาด้านการทหาร"
 travel_events.2003.intro:0 "[local_captain.GetFirstName], ผู้กองท้องถิ่น, และนายทหารของ [local_captain.GetHerHis] สองสามคนทักทายข้าขณะที่คณะเดินทางของข้าเข้าสู่ค่ายทหารของ [ROOT.Char.GetCurrentLocation.GetName]"
 travel_events.2003.desc_barracks:0 "ข้ารีบลงจากหลังม้า, กระตือรือร้นที่จะตรวจสอบโรงทหารท้องถิ่น, ซึ่งเต็มไปด้วยกิจกรรมอย่างแท้จริง"
 travel_events.2003.desc_regiment:0 "ข้าสังเกตการณ์พื้นที่กรมทหารครู่หนึ่งแล้วจึงลงจากหลังม้า, กลุ่มทหารกำลังง่วนอยู่กับแผนการรบ"
 travel_events.2003.desc_camp:1 "ขณะที่ [local_captain.GetSheHe] เดินจากไป, ข้ารีบลงจากหลังม้าและตาม [local_captain.GetHerHim] ไปดูอุปกรณ์ล้อมเมืองล่าสุด"
 travel_events.2003.outro:0 "\n\nข้าพยักหน้า ชื่นชมความโกลาหลอันเป็นระเบียบที่ข้ากำลังประจักษ์\n"บัดนี้ [ROOT.Char.Custom('FormOfAddressForLiege')] ประสงค์จะทำสิ่งใดต่อไปหรือขอรับ" [local_captain.GetFirstNameNoTooltip] มองข้าอย่างคาดหวัง"
 travel_events.2003.a:0 "ข้าไม่รังเกียจที่จะประลองฝีมือสักหน่อย!"
 travel_events.2003.a_sparring_tt:0 "ท่านประลองฝีมือกับกองทหารได้สำเร็จ"
 travel_events.2003.a_wounded_tt:0 "ท่านได้รับบาดเจ็บโดยบังเอิญ"
 travel_events.2003.b:0 "นั่นมันเครื่องมืออะไร?"
 travel_events.2003.b_success_tt:0 "เรียนรู้การทหาร"
 travel_events.2003.b_learn_tt:0 "ท่านเรียนรู้บางอย่างจากการศึกษาอุปกรณ์"
 travel_events.2003.b_failure_tt:0 "ถูกจับได้"
 travel_events.2003.b_spy_tt:0 "[county_liege.GetShortUIName] คิดว่าท่านอาจกำลังสอดแนม"
 travel_events.2003.b_cut_tt:0 "ท่านเผลอทำตัวเองบาดเจ็บกับอุปกรณ์"
 travel_events.2003.c:0 "เจ้าควรเข้าร่วมกับข้า"
 travel_events.2003.c_success_tt:0 "การเกณฑ์ลับ"
 travel_events.2003.c_secret_tt:0 "[county_liege.GetShortUIName] ไม่พบการลักลอบเกณฑ์คนของท่าน"
 travel_events.2003.c_found_out_tt:0 "[county_liege.GetShortUIName] พบการลักลอบเกณฑ์คนของท่าน"
 travel_events.2003.d:0 "อันที่จริงข้ามีที่ต้องไป..."

#Visit (your own) crappy pasture - Try to address or ignore the issues
 travel_events.2004.t:0 "ทุ่งหญ้าในภาพ"
 travel_events.2004.desc:0 "กลิ่นเน่าเหม็นโชยเข้าจมูกข้าราวกับหมัดอันฉุน ปศุสัตว์ดูไม่ค่อยดีนักขณะที่ข้าเหลือบมองไปรอบๆ ทุ่งหญ้าใกล้เคียงที่ [ROOT.Char.GetCurrentLocation.GetName]\n\nชาวนาที่ทำงานที่นี่ลากเท้าและเดินเตร็ดเตร่อย่างไร้จุดหมายพยายามทำท่าเหมือนยุ่ง การขาดแรงจูงใจและขวัญกำลังใจอย่างชัดเจนของพวกเขากำลังส่งผลกระทบต่อประชากรทั้งหมด ดูเหมือนว่าการพัฒนาพื้นที่ได้หยุดชะงักลงอย่างเห็นได้ชัด\n\nข้าสั่นด้วยความไม่เชื่อขณะที่ผู้นำท้องถิ่น, [local_farmer.GetFirstName], เข้ามาหาข้า ช่างเป็นหลุมที่บริหารจัดการผิดพลาดอะไร เช่นนี้!"
 travel_events.2004.a:0 "หมูตาบอดยังบริหารที่นี่ได้ดีกว่าเจ้า, [local_farmer.GetFirstNameNoTooltip]"
 travel_events.2004.a_success_tt:0 "รับคำวิจารณ์"
 travel_events.2004.a_critique_success_tt:0 "[local_farmer.GetShortUIName] รับคำวิจารณ์ของท่าน"
 travel_events.2004.a_failure_tt:0 "ปฏิเสธคำวิจารณ์"
 travel_events.2004.a_critique_reject_tt:0 "[local_farmer.GetShortUIName] ปฏิเสธคำวิจารณ์ของท่าน"
 travel_events.2004.b:0 "ข้าต้องการม้าของเจ้า เดี๋ยวนี้"
 travel_events.2004.c:0 "ข้ามีเรื่องที่ดีกว่าต้องทำ"

#Visit another ruler's pasture - Give advice or sabotage the pasture
 travel_events.2005.t:0 "ทุ่งหญ้าของผู้อื่น"
 travel_events.2005.desc:0 "ในวันดี ๆ เช่นนี้ อากาศก็ช่างเป็นใจ ทุ่งหญ้าแห่ง [ROOT.Char.GetCurrentLocation.GetName] ดูเขียวชอุ่ม และเหล่าปศุสัตว์ท้องถิ่นก็กำลังกระโดดโลดเต้นส่งเสียงร้องอย่างร่าเริงตามประสาของมัน ลูกวัวน้อยเดินเคียงข้างแม่ของมัน ขนของพวกมันเป็นมันเงาและสะอาดสะอ้าน\n\nโดยรวมแล้ว สถานที่แห่งนี้ได้รับการจัดการอย่างมีความสามารถยิ่ง แม้ข้าจะสังเกตเห็นความแปลกประหลาดเล็กน้อยสองสามอย่างที่ข้าคงจะจัดการแตกต่างออกไปบ้าง\n\nผู้นำชาวนา [local_farmer.Custom('MatriarchPatriarch')] ท้องถิ่นเดินเข้ามาหาข้า "อรุณสวัสดิ์ [ROOT.Char.Custom('FormOfAddressForLiege')]! เหล่าสัตว์งามเหล่านี้ช่างเป็นภาพที่น่าชื่นชมมิใช่หรือ""
 travel_events.2005.a:1 "ข้าน่าจะนำบางอย่างกลับไปใช้ที่บ้านได้!"
 travel_events.2005.a_success_tt:0 "คำแนะนำสำเร็จ"
 travel_events.2005.a_implemented_tt:0 "คำแนะนำของท่านถูกนำไปใช้อย่างสำเร็จ"
 travel_events.2005.a_failure_tt:0 "ตีความคำแนะนำผิด"
 travel_events.2005.a_misinterpreted_tt:0 "คำแนะนำของท่านถูกตีความผิดไปอย่างสิ้นเชิง"
 travel_events.2005.b:0 "มาดูกันว่าเราจะปรับปรุงสิ่งต่างๆ ที่นี่ได้หรือไม่"
 #travel_events.2005.b_success_tt:0 "Sabotage Successful"
 #travel_events.2005.b_sabotage_tt:0 "Your sabotage is successful and secretive"
 #travel_events.2005.b_failure_tt:0 "Sabotage Averted"
 #travel_events.2005.b_averted_tt:0 "Your #EMP sabotage#! actually fixes some local problems"
 travel_events.2005.c:0 "ข้ามั่นใจว่า [county_liege.GetTitledFirstNameNoTooltip] สามารถดูแลทุ่งหญ้าของ [county_liege.GetHerHis] เองได้"
#Visit a camel farm - Get defiled by a camel
 travel_events.2006.t:0 "อูฐอีกแล้วหรือ?"
 travel_events.2006.desc:0 "ดวงอาทิตย์อยู่สูงเหนือฟาร์มอูฐใน [ROOT.Char.GetCurrentLocation.GetName], และข้าหาที่ร่มใต้หนังกำบังที่ขึงไว้เหนือบางพื้นที่ของฟาร์ม เสียงครืดคราดอย่างกะทันหัน ทำให้ข้าสะดุ้ง, และข้าหันกลับไป\n\nข้างๆ ข้า, สัตว์ร้ายที่สง่างามตัวหนึ่งมีความคิดเดียวกันและเข้ามาหลบในร่ม ข้าเอนตัวไปลูบหัวยาวๆ ของมัน, ทันใดนั้นสัตว์ตัวนั้น #EMP ก็ฟาดหน้าผากข้าอย่างรวดเร็วและถ่มน้ำลายใส่แก้มข้า#! \n\nเมื่อข้าตั้งสติได้ ข้าเห็นเจ้าของมันยืนอยู่ห่างออกไปประมาณยี่สิบก้าว, ตกตะลึง"
 travel_events.2006.a:0 "เจ้าและสัตว์ร้ายของเจ้าต้องเรียนรู้มารยาทบ้าง!"
 travel_events.2006.a_tt:0 "ท่านเฆี่ยนสัตว์ร้ายและเจ้าของมัน"
 travel_events.2006.b:0 "หัวของสัตว์ร้ายตัวนี้จะเป็นคำเตือนที่ #EMP ดี#! ทีเดียว"
 travel_events.2006.b_tt:0 "ท่านตัดหัวอูฐ"
 travel_events.2006_camel_head:0 "หัวอูฐ"
 travel_events.2006_camel_head_desc:0 "หัวของอูฐที่ไม่เชื่อฟัง"
 travel_events.2006.c:1 "สัตว์ร้ายก็เป็นเพียงสิ่งมีชีวิตที่ไร้ความคิด"

#Visit an elephant pen - Train with the elephants
 travel_events.2007.t:0 "ช้างมหัศจรรย์"
 travel_events.2007.desc_memory:0 "ข้ามองสัตว์ร้ายขนาดมหึมาที่คอกช้าง [ROOT.Char.GetCurrentLocation.GetName] อย่างสงสัย, ยังคงบอบช้ำเล็กน้อยจากตอนที่ "
 travel_events.2007.desc_memory_rival:0 "คู่แข่ง "
 travel_events.2007.desc_memory_nemesis:0 "ศัตรูคู่อาฆาต "
 travel_events.2007.desc_memory_segway:0 "[crushing_person.GetTitledFirstName] เกือบจะให้ช้างนั่งทับข้า "
 travel_events.2007.desc_memory_here:0 "ณ จุดนี้พอดี"
 travel_events.2007.desc_memory_not_here:0 "ใน [elephant_memory.Var('elephant_location').GetProvince.GetName] [elephant_memory.Var('elephant_location').GetTerrain.GetName]"
 travel_events.2007.desc_default:0 "สัตว์ร้ายที่สง่างามที่คอกช้าง [ROOT.Char.GetCurrentLocation.GetName] น่าประทับใจอย่างแท้จริง ข้ามองพวกมันแบกท่อนซุงและเข้าร่วมการออกกำลังกายทุกรูปแบบ"
 travel_events.2007.desc_outro:0 "\n\nขณะที่ข้าสังเกตช้างปฏิบัติหน้าที่, ข้าได้ยินควาญช้างสองสามคนกำลังสนทนาเกี่ยวกับวิธีการต่างๆ ที่พวกเขาฝึกกับสัตว์เหล่านี้\n\nฟังดูเหมือนเป็นการออกกำลังกายที่หนักหน่วงทีเดียว, และยอมรับว่ามันกระตุ้นความสนใจของข้า"
 travel_events.2007.a:0 "นี่เทียบไม่ได้กับ #EMP [ROOT.Char.GetTitleAsNameNoTooltip|U]#! เลย"
 travel_events.2007.a_success_tt:0 "การฝึกที่มีประสิทธิภาพ"
 travel_events.2007.a_efficient_training_tt:0 "การฝึกดำเนินไปอย่างยอดเยี่ยม"
 travel_events.2007.a_soft_success_tt:0 "การฝึกพอใช้ได้"
 travel_events.2007.a_alright_training_tt:0 "การฝึกพอใช้ได้"
 travel_events.2007.a_failure_tt:0 "การฝึกที่แย่มาก"
 travel_events.2007.a_failed_training_tt:0 "ท่านสะดุดขาตัวเอง"
 travel_events.2007.b:0 "ข้าจะไม่เสียเวลาของข้า"

#Visit an elephant pen, your rival is on site - Attempt to crush your rival?
 travel_events.2008.t:0 "นั่งลงสิ"
 travel_events.2008.desc:0 "หยาดเหงื่อยังคงไหลอาบใบหน้าข้าขณะที่ความร้อนอบอ้าวของป่าดงดิบถาโถมเข้าใส่ เมื่อหยุดปาดเหงื่อ ข้าก็เหลือบไปเห็น [elephant_rival.GetTitledFirstName] [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('elephant_rival'))] ผู้เป็น [elephant_rival.Custom2('InsultNoun', ROOT.Char)] ของข้า อยู่ตรงคอกช้างท้องถิ่นของ [ROOT.Char.GetCurrentLocation.GetName]\n\n[elephant_rival.GetSheHe|U] ทำท่าทางหยาบคายมาทางข้าและหัวเราะเสียงดังลั่น ไม่ต้องสงสัยเลยว่ากำลังเยาะเย้ยข้า ข้ากัดกรามแน่น\n\nทันใดนั้นข้าก็สังเกตเห็นว่า [elephant_rival.GetTitledFirstNameNoTooltip] กำลังยืนอยู่ #EMP ด้านหลังช้างพอดี#! และเจ้าสัตว์ร้ายกำลังเคลื่อนไหว ข้าสามารถเรียกความสนใจจากควาญช้างของมันได้ทัน"
 travel_events.2008.a:0 "[ROOT.Char.Custom('RandomElephantName')], #EMP นั่งลง#! "
 travel_events.2008.a_success_tt:0 "ช้างทับ"
 travel_events.2008.a_crushed_tt:0 "[elephant_rival.GetShortUIName] ถูกช้างทับ"
 travel_events.2008.a_soft_success_tt:0 "เกือบถูกทับ"
 travel_events.2008.a_wounded_tt:0 "[elephant_rival.GetShortUIName] ได้รับบาดเจ็บ"
 travel_events.2008.a_failure_tt:0 "[elephant_rival.GetTitledFirstNameNoTooltip] หนีไปได้"
 travel_events.2008.a_scotfree_tt:0 "[elephant_rival.GetShortUIName] หนีช้างไปได้"
 travel_events.2008.b:0 "[elephant_rival.GetTitledFirstNameNoTooltip], ระวัง!"

#Visit an orchard - Kid falls out of tree
 travel_events.2010.t:0 "กิ่งไม้หัก"
 travel_events.2010.temperate_summer:0 "สายลมอุ่นๆ ลูบไล้คอข้าขณะที่ข้าเดินเล่นในสวนผลไม้ของ [ROOT.Char.GetCurrentLocation.GetName] ต้นไม้เหยียดกิ่งก้านอย่างอ่อนโยนสู่ท้องฟ้า, แต่งแต้มด้วยส่วนผสมของยอดอ่อนและผลไม้ที่กำลังก่อตัว"
 travel_events.2010.temperate_winter:0 "มีอากาศหนาวเย็น, และลมหายใจของข้ากลายเป็นไอหมอกเล็กๆ ขณะที่ข้าเดินทางผ่านสวนผลไม้ของ [ROOT.Char.GetCurrentLocation.GetName] ต้นไม้ดูเหมือนจะห่อตัวเล็กน้อยในความหนาวเย็น, โหยหาวันที่อบอุ่นกว่า"
 travel_events.2010.tropical_summer:0 "ความร้อนอบอ้าวขณะที่ข้าเดินผ่านสวนผลไม้ของ [ROOT.Char.GetCurrentLocation.GetName] รอบตัวข้า, ต้นไม้กำลังออกดอกเต็มที่, เฉลิมฉลองฤดูกาล"
 travel_events.2010.tropical_winter:0 "ในที่สุดก็ถึงเวลาที่อากาศอบอุ่นพอที่จะเดินเล่นในสวนผลไม้ของ [ROOT.Char.GetCurrentLocation.GetName], และข้าก็คว้าโอกาสนั้นไว้ ต้นไม้พักตัว, แต่ยังคงเขียวขจี, รอคอยฤดูกาลที่อบอุ่นกว่า"
 travel_events.2010.fallback:0 "ต้นไม้เหยียดกิ่งก้านสู่ท้องฟ้าขณะที่ข้าเดินไปตามแถวของลำต้นที่ปลูกไว้อย่างระมัดระวังในสวนผลไม้ท้องถิ่นที่ [ROOT.Char.GetCurrentLocation.GetName] เป็นวันที่ดีสำหรับการเดินเล่น"
 travel_events.2010.desc:0 "\n\nทันใดนั้น, เสียงกรีดร้องแหลมสูงก็ดังขึ้นในอากาศ ข้าเร่งฝีเท้าเพียงเพื่อพบ "
 travel_events.2010.entourage:0 "[ROOT.Char.Custom2('RelationToMe', SCOPE.sC('fallen_child'))] [fallen_child.GetFirstName] ของข้า "
 travel_events.2010.peasant:0 "เด็กชาวนาคนหนึ่ง "
 travel_events.2010.outro:0 "อยู่ใต้ต้นไม้, ร่างกายบอบช้ำและสะอื้นไห้อย่างรุนแรง\n\nดูเหมือนว่า [fallen_child.GetSheHe] พยายามปีนต้นไม้, ก่อนที่จะลื่นและตกลงมาที่พื้น ท่อนกระดูกท่อนหนึ่งยื่นออกมาในมุมที่แปลกประหลาด"
 travel_events.2010.a:0 "ต้นไม้เหล่านี้เป็นอันตรายต่อสุขภาพ!"
 travel_events.2010.a_flavor:0 "เผาที่นี่ให้ราบ!"
 travel_events.2010.a_tt:0 "อาการบาดเจ็บของ [fallen_child.GetShortUINamePossessive] อาจแย่ลง"
 travel_events.2010.a_tt_2: "[ROOT.Char.GetTitledFirstName] เผาสวนผลไม้ของท่านใน [location_county.GetNameNoTier]!"
 travel_events.2010.b:0 "เจ้าคิดอะไรอยู่, [fallen_child.GetFirstNameNoTooltip]!"
 travel_events.2010.b_tt:0 "ได้รับลักษณะ"
 travel_events.2010.c:0 "โอ๋ๆ ไม่เป็นไรนะ"
 travel_events.2010.c_physician:0 "ให้หมอดูอาการเจ้าหน่อย, เด็กน้อย"
 travel_events.2010.c_physician_tt:0 "[court_physician.GetShortUIName] รักษา [fallen_child.GetShortUIName]"
 travel_events.2010.d:0 "[fallen_child.Custom('GirlBoyPlural')|U] ก็คือ [fallen_child.Custom('GirlBoyPlural')]"

