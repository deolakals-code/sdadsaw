l_english: 

#Grotesque Events
 travel_events.3000.t:0 "สิ่งมีชีวิตวิรูป"
 travel_events.3000.desc:1 "ข้าไม่ค่อยเห็น [traveller_monk.Custom2('MyCharacterIntroduction', ROOT.Char)] ตื่นเต้น เช่นนี้มาก่อน ดวงตาของ[traveller_monk.GetHerHis|U]ดูเหมือนจะกลืนกินหนังสือที่ประดับประดาอย่างหรูหรา — บางครั้งข้าก็แอบดูแผนที่ด้านในได้\n\nเช้าวันหนึ่ง ในที่สุด [traveller_monk.GetSheHe] ก็เข้ามาหาข้าเกี่ยวกับสิ่งที่[traveller_monk.GetHerHis]ค้นพบ:\n\n\"ข้า แต่ท่าน มีข่าวลือว่าดินแดนแห่ง [ROOT.Char.GetCurrentLocation.GetName] เป็นที่อยู่ของผู้คนที่ไม่ธรรมดา! กล่าวกันว่า [ROOT.Char.Custom('GetGrotesquePlural')] ท่องไปในนครเหล่านี้\""
 travel_events.3000.a:0 "ข้าต้องเห็นสิ่งมีชีวิตเหล่านี้ #EMP เดี๋ยวนี้!#!"
 travel_events.3000.a.tt:1 "ท่านจะค้นหาสิ่งมีชีวิตเหล่านี้ต่อไป"
 travel_events.3000.b:0 "ได้โปรด [traveller_monk.GetFirstNameNoTooltip] บอกข้าเกี่ยวกับพวกมันเพิ่มเติม"
 travel_events.3000.c:0 "แล้วจะทำไมกับพวกมันเล่า? เรามีคนประหลาดที่บ้านมากพอแล้ว"
 travel_events.3000.d:0 "ข้าต้องเห็นพวกมันและกลับมารายงานสิ่งที่ข้าค้นพบ"
 travel_events.3000_interest_modifier:0 "ความสนใจในสิ่งวิรูป"
 grotesque_rush_modifier:0 "เร่งรีบค้นหาสิ่งวิรูป"
 grotesque_scholar_modifier:0 "เร่งรีบวิจัยสิ่งวิรูป"
 satiated_curiosity:0 "ความอยากรู้อยากเห็นที่ได้รับการตอบสนอง"
 get_grotesque_cynocephalus:0 "ไซโนเซฟาลัส มนุษย์หัวสุนัข"
 get_grotesque_blemee:0 "เบล็มมี ผู้ไร้ศีรษะ ซึ่งมีใบหน้าอยู่บนหน้าอก"
 get_grotesque_sciapod:0 "สเกียพอด สิ่งมีชีวิตคล้ายคนแคระมีเท้าใหญ่เพียงข้างเดียว"
 get_grotesque_cynocephaly:0 "ไซโนเซฟาลี เหล่ามนุษย์หัวสุนัข"
 get_grotesque_blemmyae:0 "เบล็มไมอี เหล่าผู้ไร้ศีรษะ ซึ่งมีใบหน้าอยู่บนหน้าอก"
 get_grotesque_sciapodes:0 "สเกียโพเดส เหล่าสิ่งมีชีวิตคล้ายคนแคระมีเท้าใหญ่เพียงข้างเดียว"
 
 travel_events.3001.t:0 "ความผิดหวังอันวิรูป"
 travel_events.3001.desc_intro:0 "ทุกครั้งที่เราไปถึงถิ่นฐานใหม่ ข้าจะใช้เวลาสักครู่มองไปรอบๆ พยายามค้นหาสิ่งมีชีวิตวิรูปที่ข้าเคยเห็นในแผนที่ของ [traveller_monk.GetTitledFirstNamePossessiveNoTooltip] "
 travel_events.3001.desc_cynical:0 "โอกาสที่จะพิสูจน์ว่า[traveller_monk.GetHerHim]ผิด"
 travel_events.3001.desc.fallback:0 "ความอยากรู้อยากเห็นมันมากเกินไปจริงๆ"
 travel_events.3001.desc.outro:2 "\n\nเมื่อเรามาถึง [grotesque_place.GetNameNoTooltip] [traveller_monk.GetSheHe] ก็มาหาข้า กอดหนังสือของ [traveller_monk.GetHerHis] ไว้แน่น\n\n"[ROOT.Char.Custom('FormOfAddressForLiege')|U]... เราได้ติดตามข้อบ่งชี้ทั้งหมดแล้ว แต่กลับไม่พบสิ่งมีชีวิตเหล่านี้เลย ข้าเพิ่งตระหนักได้ว่า บางทีพวกมันอาจเป็นเพียงเรื่องที่ แต่งขึ้นเท่านั้น""
 travel_events.3001.a:0 "โอ้... ได้..."
 travel_events.3001.b:0 "เจ้า #EMP สัญญา#! กับข้าแล้วว่าจะมีสัตว์ประหลาด"
 travel_events.3001.b_sadistic:0 "ข้าจะสอนเจ้าไม่ให้โกหกเจ้านายของเจ้า"
 travel_events.3001.c:0 "ฮ่า! ข้ารู้อยู่แล้ว!"
 travel_events.3001.d:0 "พวกมัน #EMP ต้อง#! อยู่ที่ไหนสักแห่ง"
 travel_events.3001.e:0 "คนทางบ้านจะรู้ได้อย่างไรว่าพวกมัน #EMP ไม่ได้#! อยู่ที่นี่?"
 cryptid_obssessed:0 "หมกมุ่นกับสิ่งวิรูป"
 travel_events.3001.e.success:0 "ท่านโน้มน้าวผู้คนเกี่ยวกับสิ่งที่ท่านเห็นได้สำเร็จ"
 travel_events.3001.e.failure:0 "ไม่มีใครเชื่อการผจญภัยอันวิรูปของท่าน"
 cryptid_obssessed_rush:0 "แรงผลักดันจากความหมกมุ่นในสิ่งวิรูป"
 
 #Pet Travel Events
 travel_events.3010.t:0 "มุ่งหน้ากลับบ้าน"
 travel_events.3010.intro:0 "หลังจากการเดินทางอันยาวนานตลอดวัน ขอบฟ้าเริ่มเปลี่ยนเป็นสีอบอุ่น ข้าหยุดพักสักครู่ หลับตา หายใจ\n\n"
 travel_events.3010.desc: "\"ระวัง!\" [pet_rescuer.Custom2('MyCharacterIntroduction', ROOT.Char)] กรีดร้อง ชี้ไปที่ [ROOT.Char.GetCurrentLocation.GetTerrain.GetNameNoTooltip|l] ที่อยู่นอกเส้นทางที่เราตามไป\n\nสิ่งที่ดูเหมือนสัตว์ฟันแทะขนาดเล็กกำลังวิ่งเข้าไปในป่า"
 travel_events.3010.alone: "เดี๋ยวก่อน! [ROOT.Char.Custom( 'DogStoryName' )] อยู่ไหน? ข้าไม่เห็น [ROOT.Char.Custom( 'DogStoryHerHim' )] มา... ข้าสูดหายใจเข้าลึก เมื่อเห็นการเคลื่อนไหวใน [ROOT.Char.GetCurrentLocation.GetTerrain.GetNameNoTooltip|l] ที่อยู่นอกเส้นทาง!\n\nสิ่งที่ดูเหมือนสัตว์ฟันแทะขนาดเล็กกำลังวิ่งเข้าไปในป่า"
 travel_events.3010.exotic:0 "และบางสิ่งที่ #EMP คุ้นเคยอย่างอันตราย#! ก็ตามไปติดๆ"
 travel_events.3010.cat:0 "และไล่ตามมันไป คือร่างสี [ROOT.Char.Custom('CatFurColor')] ที่ข้าจำได้ง่ายดาย"
 travel_events.3010.dog:0 "และไล่ตามมันไป คือร่างสี [ROOT.Char.Custom('DogFurColor')] ที่ข้าจำได้ง่ายดาย"
 travel_events.3010.a_dog:0 "ไม่นะ! [ROOT.Char.Custom( 'DogStoryName' )]! [pet_rescuer.GetTitledFirstNameNoTooltip] ตาม [ROOT.Char.Custom('DogStoryHerHim')] ไป!"
 travel_events.3010.a_cat:0 "ไม่นะ [ROOT.Char.Custom( 'CatStoryName' )]! [pet_rescuer.GetTitledFirstNameNoTooltip] ตาม [ROOT.Char.Custom('CatStoryHerHim')] ไป!"
 travel_events.3010.a_exotic:0 "[pet_rescuer.GetTitledFirstNameNoTooltip] จับสัตว์เลี้ยงของข้ามาก่อนที่ใครจะได้รับอันตราย!"
 travel_events.3010.a.success:0 "[pet_rescuer.GetTitledFirstNameNoTooltip] พบสัตว์เลี้ยงของท่าน"
 travel_events.3010.a.failure:0 "[pet_rescuer.GetTitledFirstNameNoTooltip] หลงทางขณะพยายามหาสัตว์เลี้ยงของท่าน"
 travel_events.3010.a.failure_toast:0 "[pet_rescuer.GetTitledFirstNameNoTooltip] หลงทางขณะพยายามหาสัตว์เลี้ยงของท่าน"
 travel_events.3010.b.tt1:0 "สัตว์เลี้ยงของท่านจะหายไปตลอดกาล"
 travel_events.3010.b.tt2:0 "สัตว์เลี้ยงของท่านจะหาทางกลับมาเอง"
 travel_events.3010.b.tt3:0 "ท่านพบสัตว์เลี้ยงของท่าน และบางสิ่งบางอย่าง"
 travel_events.3010.b_dog:0 "[ROOT.Char.Custom( 'DogStoryName' )] ฉลาดกว่าพวกเราทุกคน [ROOT.Char.Custom('DogStorySheHe')] จะหาทางกลับมาเอง"
 travel_events.3010.b_cat:0 "[ROOT.Char.Custom( 'CatStoryName' )] ฉลาดกว่าพวกเราทุกคน [ROOT.Char.Custom('CatStorySheHe')] จะหาทางกลับมาเอง"
 travel_events.3010.b_exotic:0 "#EMP ชิ!#! ถ้าจะมีอะไร ก็คือผู้คนในดินแดนเหล่านี้ต่างหากที่ควรจะกังวล"
 ill_find_you:0 "ข้าจะหาเจ้าเจอเอง ที่รักของข้า"
 travel_events.3010.c_dog:0 "$ill_find_you$ [ROOT.Char.Custom( 'DogStoryName' )]!"
 travel_events.3010.c_cat:0 "$ill_find_you$ [ROOT.Char.Custom( 'CatStoryName' )]!"
 travel_events.3010.c_exotic:0 "ถึงแม้จะอันตราย แต่เขาก็ยังเป็นลูกชายที่หายไปของข้า! ข้าจะหาเจ้าเจอ!"
 travel_events.3010.c.success:0 "ท่านพบสัตว์เลี้ยงของท่าน"
 travel_events.3010.c.failure:0 "ท่านหลงทางขณะพยายามหาสัตว์เลี้ยงของท่าน"
 travel_events.3010.c.failure_toast:0 "ท่านหลงทางขณะพยายามหาสัตว์เลี้ยงของท่าน"
 after_him:0 "เร็วเข้า! #EMP ทุกคน#! ตาม"
 travel_events.3010.e_dog:0 "$after_him$ [ROOT.Char.Custom('DogStoryHerHim')] ไป!"
 travel_events.3010.e_cat:0 "$after_him$ [ROOT.Char.Custom('CatStoryHerHim')] ไป!"
 travel_events.3010.e_exotic:0 "$after_him$ เขาไป!"
 travel_events.3010.d:0 "บางวิญญาณไม่ได้ถูกกำหนดมาให้อยู่ในกรงขัง ไปเถิด สหายข้า"
 pet_rescue_modifier:0 "ความล่าช้าในการค้นหาสัตว์เลี้ยง"
 travel_events.3010.b.tt:0 "มันอาจจะกลับมาเอง..."
 
 travel_events.3011.t:0 "อยู่นี่เอง!"
 travel_events.3011.intro:0 "ใช้เวลาไม่นานในการตามรอยเสียงคำรามและกิ่งไม้หักไปยังต้นกำเนิด "
 travel_events.3011.exotic:0 "นักล่าที่รักของข้านั่งอยู่บนกองใบไม้ เลียอุ้งเท้าที่เปื้อนเลือดของเหยื่อ\n\nกระรอกแทบจำไม่ได้ อยู่ข้างๆ เขา"
 travel_events.3011.dog:0 "[ROOT.Char.Custom( 'DogStoryName' )] นั่งอยู่บนกองใบไม้ เลียอุ้งเท้าสี [ROOT.Char.Custom( 'DogFurColor' )] ของ [ROOT.Char.Custom( 'DogStoryHerHis' )] ที่เปื้อนเลือดของเหยื่อของ [ROOT.Char.Custom( 'DogStoryHerHis' )]\n\nกระรอกแทบจำไม่ได้ อยู่ข้างๆ [ROOT.Char.Custom( 'DogStoryHerHim' )]"
 travel_events.3011.cat:0 "[ROOT.Char.Custom( 'CatStoryName' )] นั่งอยู่บนกองใบไม้ เลียอุ้งเท้าสี [ROOT.Char.Custom( 'CatFurColor' )] ของ [ROOT.Char.Custom( 'CatStoryHerHis' )] ที่เปื้อนเลือดของเหยื่อของ [ROOT.Char.Custom( 'CatStoryHerHis' )]\n\nกระรอกแทบจำไม่ได้ อยู่ข้างๆ [ROOT.Char.Custom( 'CatStoryHerHim' )]"
 travel_events.3011.a:0 "ฮ่า! ข้ารู้อยู่แล้วว่าเจ้าจะสำเร็จ! ทำได้ดีมาก!"
 travel_events.3011.b:0 "ข้าจะไม่ละสายตาไปจากเจ้าอีกเลย"
 adventurous_pet_modifier:0 "สัตว์เลี้ยงนักผจญภัย"
 
 travel_events.3012.t:0 "มุ่งหน้ากลับบ้าน: อยู่นี่เอง... เหรอ?"
 travel_events.3012.exotic:0 "\n\nเขามองมาที่ข้า ยกเว้นว่าเขาดูเหมือนจะจำข้าไม่ได้"
 travel_events.3012.dog:0 "\n\n[ROOT.Char.Custom('DogStorySheHe')|U] เงยดวงตาสี [ROOT.Char.Custom('DogEyeColor')] ของ [ROOT.Char.Custom( 'DogStoryHerHis' )] มองมาที่ข้า ยกเว้นว่า [ROOT.Char.Custom( 'DogStorySheHe' )] ดูเหมือนจะจำข้าไม่ได้"
 travel_events.3012.cat:0 "\n\n[ROOT.Char.Custom( 'CatStorySheHe' ) |U] เงยดวงตาสี [ROOT.Char.Custom('CatEyeColor')] ของ [ROOT.Char.Custom( 'CatStoryHerHis' )] มองมาที่ข้า ยกเว้นว่า [ROOT.Char.Custom( 'CatStorySheHe' )] ดูเหมือนจะจำข้าไม่ได้"
 travel_events.3012.a:0 "ข้าเห็นว่าเจ้าได้พบบ้านที่ดีกว่าสำหรับเจ้าแล้ว เจ้าเป็นอิสระที่จะไป"
 travel_events.3012.c:0 "ข้าไม่ได้คาดหวังน้อยไปกว่านี้จากเจ้าเลย สหายข้า"
 feral_pet_modifier:0 "สัตว์เลี้ยงดุร้าย"
 feral_pet_love_modifier:0 "สัตว์เลี้ยงดุร้ายที่น่ารัก"
 
 #Encounters in Distant Court Events
 travel_events.3020.t:0 "การต้อนรับอันอบอุ่น"
 travel_events.3020.desc:0 "เสียงดนตรีบรรเลงให้เราเมื่อเรามาถึง และตัวตลกกำลังโยนของเล่นอย่างอันตรายใกล้กองไฟ เด็กๆ เงียบกริบทันทีที่เห็นเราและชี้มาที่เราอย่างเขินอายจากด้านหลังพ่อแม่ของพวกเขา [foreign_ruler.GetTitledFirstName] ยิ้มจากบนแท่น\n\n\"สหายผู้เป็นที่ชื่นชมของข้า!\" [foreign_ruler.GetSheHe] เข้ามาหาข้า อ้าแขน[foreign_ruler.GetHerHis]ออกในท่าทางเชื้อเชิญ \"เรารอท่านอยู่ตั้งแต่ทราบข่าวการมาถึงของท่าน ได้โปรด ข้าขอร้อง พักอยู่กับเรานานเท่าที่ท่านต้องการ และบอกได้เลยหากท่านต้องการสิ่งใด\""
 travel_events.3020.a:0 "เราต้องการความช่วยเหลือในการเดินทางไปยัง [next_province.GetNameNoTooltip]"
 travel_events.3020.a_home:0 "เราต้องการความช่วยเหลือในการเดินทางกลับบ้าน"
 travel_events.3020.b:0 "เราขาดแคลนเสบียงเล็กน้อย ตอนนี้ที่ท่านพูด..."
 travel_events.3020.b.success:0 "ท่านโน้มน้าวให้ [foreign_ruler.GetTitledFirstNameNoTooltip] ให้ยืมเสบียงพิเศษบางส่วนได้สำเร็จ"
 travel_events.3020.b.failure:0 "[foreign_ruler.GetTitledFirstNameNoTooltip] รู้สึกขุ่นเคืองกับคำขอของท่าน"
 travel_events.3020.c:0 "มีทหารรักษาการณ์เพิ่มอีกสองสามคนย่อมเป็นสิ่งที่ดีเสมอ"
 travel_events.3020.c.success:0 "ท่านโน้มน้าวให้ [foreign_ruler.GetTitledFirstNameNoTooltip] ให้ยืมทหารรักษาการณ์พิเศษบางส่วนได้สำเร็จ"
 travel_events.3020.d:0 "ข้ายินดีที่จะเพลิดเพลินกับความเป็นเพื่อนของท่านอีกสักหน่อย"
 travel_events.3020.d.tt:1 "ท่านจะเพลิดเพลินกับการต้อนรับของ [foreign_ruler.GetTitledFirstNameNoTooltip] อีกสองสัปดาห์"
 travel_events.3020.e:0 "เราสามารถหารือเรื่องนี้ได้ดีขึ้น... ในห้องพักของท่าน"
 travel_events.3020.e.success:0 "[foreign_ruler.GetFirstNameNoTooltip] ยอมรับการเกี้ยวพาราสีของท่าน"
 travel_events.3020.e.failure:0 "[foreign_ruler.GetFirstNameNoTooltip] ปฏิเสธการเกี้ยวพาราสีของท่าน"
 travel_events.3020.f:0 "เจ้าหลอกข้าด้วยการต้อนรับจอมปลอมของเจ้าไม่ได้หรอก! ข้าไปล่ะ!"
 more_supplies_modifier:0 "ความช่วยเหลือด้านเสบียง"
 more_men_modifier:0 "ความช่วยเหลือด้านการทหาร"
 
 travel_events.3021.t:0 "ในเรื่องของศาสนา"
 travel_events.3021.intro:0 "\"อ้า ท่านอยู่นี่เอง!\" [foreign_ruler.GetTitledFirstName] ทำท่าทางให้เข้าใกล้[foreign_ruler.GetHerHim]ทันทีที่ข้าเข้าสู่ห้องบัลลังก์\n\n\"เรารอท่านอยู่! [foreign_theologian.GetTitledFirstName] เป็นข้าราชบริพารที่ทรงคุณธรรมที่สุดของข้า และข้าอยากจะฟังท่านทั้งสองสนทนาเรื่องราวอันสูงส่งจริงๆ \""
 travel_events.3021.different_faiths:0 "บอกข้าที เหตุใดจึงควรพิจารณาว่า [ROOT.Char.GetFaith.GetName] เป็นความจริงยิ่งกว่า [foreign_theologian.GetFaith.GetName]?\""
 travel_events.3021.same_faith:0 "ให้เราพูดคุยเกี่ยวกับธรรมชาติของ [ROOT.Char.GetFaith.HighGodName] กันเถอะ\""
