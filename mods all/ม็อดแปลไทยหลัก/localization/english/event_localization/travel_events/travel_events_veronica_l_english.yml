 #Church Visiting Event
 travel_events.3090.t:0 "ประตูที่ปิดอยู่"
 travel_events.3090.desc_intro:0 "อ้า ข้าจำเรื่องเล่าเกี่ยวกับ [church_visit_holder.Custom('GetFaithTemple')] ของ [church_visit_location.GetNameNoTooltip] ได้ดีเพียงใด ว่ามันสูงตระหง่านเพียงใด ปราการอันโอ่อ่าของ [ROOT.Char.GetFaith.HighGodName] หินที่สามารถสร้างสวรรค์ได้ทั้งหลัง ความเงียบ — และการสวดภาวนา\n\nภูมิประเทศอันอ้างว้างในโทนสีน้ำตาลของหมู่บ้านทอดตัวอยู่เบื้องหน้าเรา ถนนที่เต็มไปด้วยโคลน ทางเท้าที่เก่าแก่ตามกาลเวลา แต่ [church_visit_holder.Custom('GetFaithTemple')] อยู่ที่นั่น ตามที่สัญญาไว้"
 travel_events.3090.desc_zealous:0 "\n\nสีสันอันแข็งกร้าวของมัน ทำให้ข้าลืมสีซีเปียและความมืดมนทั้งหมด ความปรารถนาอันใกล้เข้ามาที่จะเยี่ยมชมมันเข้าครอบงำข้า"
 travel_events.3090.desc_cynical:0 "\n\nอย่างน้อยมันก็สวยงามในแง่สุนทรียศาสตร์"
 travel_events.3090.desc_outro:1 "\n\n"เอ่อ... [ROOT.Char.Custom('FormOfAddressForLiege')]" นักบวชผู้หนึ่งวางมัดฟืนลงใกล้กับผนังด้านหนึ่ง "ขออภัยด้วย แต่ [church_visit_holder.Custom('GetFaithTemple')] ปิดเพื่อเตรียมการสำหรับ [activity.GetNameNoTooltip]""
 travel_events.3090.a:0 "ข้ามาไกลขนาดนี้เพื่อดูมัน #EMP และข้าจะดู#!."
 travel_events.3090.a.success:0 "ท่านโน้มน้าวให้นักบวชท้องถิ่นเปิด [church_visit_holder.Custom('GetFaithTemple')] ได้สำเร็จ"
 travel_events.3090.a.failure:0 "ท่านล้มเหลวในความพยายามโน้มน้าว"
 travel_events.3090.b:0 "เราแค่รอจนกว่าจะไม่มีใครอยู่แถวนี้..."
 travel_events.3090.b.success:0 "ท่านเข้า [church_visit_holder.Custom('GetFaithTemple')] ได้สำเร็จ"
 travel_events.3090.b.success_desc:0 "ท่านค้นพบเอกสารบางอย่างที่ไม่ควรเห็น..."
 travel_events.3090.b.failure:0 "ท่านถูกจับได้ขณะพยายามแอบเข้าไปใน [church_visit_holder.Custom('GetFaithTemple')]"
 travel_events.3090.c:0 "พวกเจ้า พังประตูลงถ้าจำเป็น"
 travel_events.3090.d:0 "อืม ช่างโชคร้ายเสียจริง เดินทางกันต่อเถอะ"
