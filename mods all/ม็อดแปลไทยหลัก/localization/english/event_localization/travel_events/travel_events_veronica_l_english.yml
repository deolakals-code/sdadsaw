 #Weak Steppe Horses Events
 travel_events.3100.t:0 "$travel_danger_prefix$ สัตว์พาหนะที่อ่อนแอ"
 travel_events.3100.desc_intro:1 "เรารู้ว่าการเดินทางผ่านทุ่งหญ้าสเตปป์ของ [horses_steppe_location.GetName] จะไม่ง่าย เราเดินทัพจนถึงกลางคืนโดยไม่หยุดพัก มาถึงจุดหมายต่อไปช้ามากจนเราไม่ได้ทานอาหารเย็นด้วยซ้ำ ม้าของเราร้องเสียงหลง ปฏิเสธที่จะออกจากน้ำทุกครั้งที่เราพบธารน้ำ"
 travel_events.3100.desc_steppe:0 "แม้ว่าพวกมันจะคุ้นเคยกับทุ่งหญ้าสเตปป์ที่บ้าน แต่พวกมันก็ยังเป็นสัตว์และต้องการการพักผ่อน"
 travel_events.3100.desc_outro:1 "\n\nพ่อค้าท้องถิ่นคนหนึ่งมาหาเราไม่นานหลังจากได้ยินคำบ่นของเรา ชี้ไปที่โรงนาไม้ด้านหลัง[local_merchant.GetHerHim] ซึ่งเต็มไปด้วยม้าท้องถิ่น\n\n\"ข้ามีม้าที่ดีที่สุดที่ท่านเคยพบ แข็งแรงและทนทาน\""
 travel_events.3100.a:0 "ช่างโชคดีเสียนี่กระไร! เอาพ่อม้าที่ดีที่สุดของเจ้ามาให้ข้า!"
 travel_events.3100.b:0 "พวกมันจะต้องทน ไม่มีค่าใช้จ่ายเพิ่มอีกแล้ว"
 travel_events.3100.b.success:0 "ม้าของท่านรอดชีวิตจากการเดินทาง"
 travel_events.3100.b.failure:0 "ม้าของท่านต้องหยุดพักตลอดเวลา"
 travel_events.3100.c:0 "บางทีเราอาจจะได้พวกมันมา #EMP ฟรี#!..."
 travel_events.3100.c.success:0 "ท่านขโมยม้าได้สำเร็จ"
 travel_events.3100.c.failure:0 "พ่อค้าบังคับให้ท่านจ่ายค่าขโมย"
 travel_events.3100.d:0 "ฮ่า! ม้า #EMP พวกนี้#! เคยเห็นสิ่งที่แย่กว่านี้มามากแล้ว!"
 bought_horses_modifier:0 "ม้าที่ดีกว่า"
 pushed_horses_good_modifier:0 "ผลักดันม้าสำเร็จ"
 pushed_horses_bad_modifier:0 "ผลักดันม้า"
 
 tour_travel.3110.t:0 "การหยุดพักระหว่างทาง"
 tour_travel.3110.desc:0 "เดินทางผ่านถนนที่เต็มไปด้วยโคลนของ [ghino_di_tacco_location.GetName] ผู้คนเป็นภาพที่หาได้ยาก บ้านร้าง ทรุดโทรม เด็กคนหนึ่งเล่นกับสุนัขอย่างเงียบๆ แล้วซ่อนตัวเมื่อเห็นคณะเดินทางของเรา นักบวชท้องถิ่นชี้ไปที่บ้านของ [ghino_di_tacco_scope.GetLadyLord] และเราก็ตามไป\n\n\"ท่าน [ROOT.Char.GetTitledFirstNameNoTooltip] ที่ข้าชื่นชม!\" [ghino_di_tacco_scope.GetTitledFirstName] ต้อนรับเราในโถงทางเดินที่เต็มไปด้วยฝุ่น\n\n\"เป็นเกียรติอย่างยิ่งที่ท่านมาเยี่ยมเยือนอาณาเขตอันต่ำต้อยของเรา หากท่านต้องการ โปรดพักค้างคืนและร่วมรับประทานอาหารเย็นกับเรา!\""
 tour_travel.3110.a:0 "\"ข้ายินดีรับคำเชิญของท่าน\""
 tour_travel.3110.a.tt:0 "ท่านรับคำเชิญไปงานเลี้ยง"
 tour_travel.3110.b:0 "\"นี่... ไม่ได้มาตรฐานของข้า เราต้องเดินทางต่อ\""
 tour_travel.3110.c:0 "\"ไม่มีอะไรจะ ทำให้ข้ามีความสุขไปกว่านี้อีกแล้ว! ข้าถึงกับพา $court_jester_court_position$ ของข้ามาด้วย\""
 
 tour_travel.3111.t:0 "การหยุดพักระหว่างทาง: งานเลี้ยง"
 tour_travel.3111.desc_intro:0 "ตะเกียงน้ำมันให้แสงสลัวจนแทบมองไม่เห็น คนรับใช้ชราเสิร์ฟอาหารให้เรา: ปลา ไม่ใส่เครื่องเทศ\n\n[ghino_di_tacco_scope.GetTitledFirstNameNoTooltip] ดูประหม่าเกินไปเล็กน้อย พูดถึงความยากลำบากในการปกครองพื้นที่ที่ยากจน เช่นนี้ การเก็บภาษีที่เป็นไปไม่ได้ \"นักบวชคนสุดท้ายที่เรามีจากไปหลังจากอยู่ได้เพียงสองสามเดือน\" [ghino_di_tacco_scope.GetSheHe] พึมพำ วางไวน์เจือจางลง\n\n"
 tour_travel.3111.desc_breaking_down:0 "[ghino_di_tacco_scope.GetSheHe|U] ร้องไห้ออกมาทันทีหลังจากนั้น ซบหน้า[ghino_di_tacco_scope.GetHerHis]ลงในมือ[ghino_di_tacco_scope.GetHerHis] \"ข้า... ต้องซื่อสัตย์กับท่าน เจตนาของข้าในการเชิญท่านมาที่นี่คือการขโมยของจากท่าน ท่าน [ROOT.Char.GetLadyLord] ที่รัก ข้าหวังว่าท่านจะให้อภัยข้า\""
 tour_travel.3111.desc_committed:0 "[ghino_di_tacco_scope.GetSheHe|U] รีบขอตัว[ghino_di_tacco_scope.GetHerselfHimself]ไปเข้าส้วม ชนเข้ากับข้าโดยบังเอิญระหว่างทาง"
 tour_travel.3111.a:1 "\"นี่ รับนี่ไปและอย่าขโมยอีกเลย\""
 tour_travel.3111.b:0 "\"ให้เราทุกคนลืมไปว่าเรื่องนี้เคยเกิดขึ้น\""
 tour_travel.3111.c:0 "\"ตอนนี้ #EMP เจ้า#! จะต้องชดใช้สำหรับสิ่งนี้\""
 tour_travel.3111.d:0 "\"ทหารรักษาการณ์ของข้าจะคุยกับเจ้า\""
 tour_travel.3111.e:0 "\"เดี๋ยวก่อน... ท่านกำลังทำอะไร?\""
 tour_travel.3111.e.success:0 "ท่านสังเกตเห็นว่า [ghino_di_tacco_scope.GetFirstNameNoTooltip] กำลังพยายามขโมยของจากกระเป๋าของท่าน"
 tour_travel.3111.e.failure:0 "ท่านไม่สังเกตเห็นว่า [ghino_di_tacco_scope.GetFirstNameNoTooltip] ได้ขโมยของจากท่านไปแล้ว"
 generous_donations_modifier:0 "การบริจาคอย่างใจกว้าง"
 
 #Forest Fire Events
 travel_events.3120.t:0 "$travel_danger_prefix$ ไฟใน [wooded_location.GetTerrain.GetNameNoTooltip]"
 travel_events.3120.desc:0 "การเดินเล่นที่น่ารื่นรมย์ผ่าน [wooded_location.GetNameNoTooltip] [wooded_location.GetTerrain.GetNameNoTooltip|l] ทำให้ข้าชื่นชมทิวทัศน์รอบตัวเราอย่างแท้จริง: สีเขียวส่องสว่าง อิ่มตัวเหมือนชุดของดัชเชสที่ทำจากผ้าเนื้อดีที่สุด — รังสีของดวงอาทิตย์ กรองผ่านยอดไม้เหมือนน้ำเหลืองของเทพ\n\nกลิ่นฉุน บางทีอาจเป็นกองไฟ ข้าหันไปหาคณะเดินทางของข้าและสังเกตใบหน้าที่ซีดเผือดของหัวหน้ากองคาราวาน [travel_leader.GetFirstNameNoTooltip] \"#EMP ไฟ!#!\" [travel_leader.GetSheHe] กรีดร้อง ชี้ไปที่เปลวไฟที่ไม่ไกลนัก ซึ่ง [endangered_character.GetNameNoTooltip] ติดอยู่"
 travel_events.3120.a:0 "\"[travel_leader.GetFirstNameNoTooltip] ช่วย [endangered_character.GetHerHim] ด้วย!\""
 travel_events.3120.a.big_success:1 "[endangered_character.GetFirstNameNoTooltip] ได้รับการช่วยเหลือ"
 travel_events.3120.a.success:1 "[endangered_character.GetFirstNameNoTooltip] ได้รับการช่วยเหลือด้วยความยากลำบากอย่างยิ่ง"
 travel_events.3120.a.failure:1 "[endangered_character.GetFirstNameNoTooltip] ไม่ได้รับการช่วยเหลือ"
 travel_events.3120.b:0 "ไม่มีอะไรที่เราทำได้..."
 travel_events.3120.c:0 "ข้าจะช่วย [endangered_character.GetFirstNameNoTooltip] เอง!"
 travel_events.3120.d:0 "\"[prowess_entourage_member.GetFirstNameNoTooltip] เจ้าไป!\""
 travel_events.3120.d.big_success:0 "[prowess_entourage_member.GetFirstNameNoTooltip] ช่วยเหลือ [endangered_character.GetFirstNameNoTooltip] ได้โดยไม่ได้รับอันตราย"
 travel_events.3120.d.success:0 "[prowess_entourage_member.GetFirstNameNoTooltip] สามารถช่วยเหลือ [endangered_character.GetFirstNameNoTooltip] ได้ด้วยความยากลำบากอย่างยิ่ง"
 travel_events.3120.d.failure:0 "[prowess_entourage_member.GetFirstNameNoTooltip] ไม่สามารถช่วยเหลือ [endangered_character.GetFirstNameNoTooltip] ได้"
 
 #Rival Assassin Events
 travel_events.3130.t:0 "$travel_danger_prefix$ เสน่ห์นักฆ่า"
 travel_events.3130.desc:3 "การเดินทางในดินแดนของ [rival_scope.GetTitledFirstName] [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('rival_scope'))] ของข้า ทำให้คณะเดินทางของข้ากระวนกระวาย แม้กระทั่งตื่นตระหนก เมื่อได้ยินเสียงที่ไม่รู้จักเพียงครั้งเดียว เราก็คว้าอาวุธขึ้นมา และดูเถิด — เงาลึกลับอยู่ท่ามกลางเกวียนของเรา!\n\n\"สวัสดีตอนเย็น!\" ผู้บุกรุกยิ้มอย่างมีเล่ห์เหลี่ยม เล่นกับใบมีด \"หาก #EMP เพียงแต่#! เราได้พบกันในสถานการณ์ที่น่าพอใจกว่านี้...\" [sexy_assassin.GetSheHe] ทำหน้ามุ่ย \"ถึงกระนั้น! [rival_scope.GetTitledFirstNameNoTooltip] ประสงค์ให้ข้า #EMP ต้อนรับ#! ท่าน\""
 travel_events.3130.a:1 "\"เจ้าโง่! ข้าจะ ทำให้เจ้าชดใช้สำหรับสิ่งนี้!\""
 travel_events.3130.a.success:1 "ทหารรักษาการณ์ของท่านประหารนักฆ่า"
 travel_events.3130.a.failure:0 "นักฆ่า ทำให้ท่านบาดเจ็บและหลบหนีไป"
 travel_events.3130.b:1 "\"ทหาร! จับ [sexy_assassin.GetHerHim]!\""
 travel_events.3130.b.success:0 "ท่านเอาชนะนักฆ่าและส่งพวกเขากลับไปพร้อมจดหมาย"
 travel_events.3130.c:1 "\"หรือเจ้าจะเข้าร่วมกับสายลับ #EMP ของข้า#!...\""
 travel_events.3130.d:1 "\"สถานการณ์ที่น่าพอใจ ท่านว่าอย่างนั้น...?\""
 travel_events.3130.e:0 "\"ไปซะ ข้าไม่อยากเห็นหน้าเจ้าอีก\""
 executed_assassin_modifier:0 "หลีกเลี่ยงการลอบสังหาร"
 sent_assassin_back_modifier:0 "ค้นพบสายลับ"
 
 #Army Tries to Capture Entourage Member Events
 travel_events.3140.t:0 "$travel_danger_prefix$ การข้ามแดนที่เลวร้าย"
 travel_events.3140.desc:1 "พืชผลที่ถูกเผา ทุ่งนาที่แห้งแล้ง ของริบจากสงคราม ฝีเท้าของเราเร็วขึ้นหลังจากที่เราเห็นศพแรก\n\nเส้นทางเดียวที่เป็นไปได้ผ่านค่ายทหาร ข้ามองไปข้างหลัง: ไม่มีทางอื่น ข้าพยักหน้าให้ทหารรักษาการณ์ของข้าและพวกเขาก็พยักหน้าตอบ กระชับดาบในมือให้แน่น\n\nผู้บัญชาการกองทัพยืนอยู่ที่ทางเข้าค่าย: \"พันธมิตรของศัตรูสินะ?\" [hostile_commander.GetSheHe] ถาม เกาจมูก[hostile_commander.GetHerHis] \"ขอดูเชลยสักคนได้ไหม?\" [hostile_commander.GetSheHe|U] ชี้ไปที่ [entourage_member.GetTitledFirstName] อย่างชัดเจน"
 travel_events.3140.a:0 "ดูธงของเราสิ เราไม่ใช่ศัตรู"
 travel_events.3140.a.success:0 "ท่านโน้มน้าวผู้บัญชาการได้สำเร็จ"
 travel_events.3140.a.failure:0 "ผู้บัญชาการปฏิเสธที่จะฟัง"
 travel_events.3140.b:0 "เจ้าจะต้องเอาชนะข้าก่อนถึงจะเอา [entourage_member.GetHerHim] ไปได้!"
 travel_events.3140.b.success:0 "ท่านชนะการต่อสู้"
 travel_events.3140.b.failure:0 "ผู้บัญชาการชนะการต่อสู้"
 travel_events.3140.c:0 "บางทีเราอาจจะตกลงกันได้?"
 
 #Rival/Nemesis in Entourage Events
 travel_events.3150.t:1 "เสียงกระซิบแปลกๆ"
 travel_events.3150.desc:1 "ข้าสังเกตเห็นว่า [rival_scope.GetTitledFirstName] หลบหน้าข้ามากกว่าปกติ [rival_scope.GetSheHe|U] มักจะนั่งที่ปลายอีกด้านของโต๊ะเสมอเมื่อเราได้รับเชิญไปงานเลี้ยง และปฏิเสธที่จะอยู่ร่วมกับข้าอย่างต่อเนื่องระหว่างตั้งแคมป์\n\nเราอาจมีความสัมพันธ์ที่ไม่ดีนัก แต่ท่าที เช่นนั้นเริ่ม ทำให้ข้าเหนื่อยหน่าย โดยเฉพาะอย่างยิ่งเมื่อข้าได้ยิน [rival_scope.GetHerHim] กล่าวร้ายข้าว่า: "[ROOT.Char.GetFirstNameNoTooltip] เป็น [ROOT.Char.Custom2('InsultNoun', SCOPE.sC('rival_scope'))] [ROOT.Char.Custom2('InsultAdjective', SCOPE.sC('rival_scope'))] ข้าจะเป็น [ROOT.Char.GetTitleAsNameNoTooltip] ที่ดีกว่า [ROOT.Char.GetHerHim] เป็นไหน ๆ" "
 travel_events.3150.a:0 "เจ้าอยากรู้ว่าเป็นอย่างไรใช่ไหม? ข้าจะแสดงให้เจ้าดู!"
 travel_events.3150.a.success:0 "ท่านชนะการต่อสู้กับ [rival_scope.GetFirstNameNoTooltip] และ ทำให้[rival_scope.GetHerHim]จากไป"
 travel_events.3150.a.failure:0 "[rival_scope.GetFirstNameNoTooltip] ชนะการต่อสู้และจากไป"
 travel_events.3150.b:1 "หัวหน้ากองคาราวาน [travel_leader.GetFirstNameNoTooltip] จัดการเรื่องนี้"
 travel_events.3150.b.success:0 "[travel_leader.GetFirstNameNoTooltip] ชนะการต่อสู้และ ทำให้ [rival_scope.GetFirstNameNoTooltip] จากไป"
 travel_events.3150.b.tt:0 "[travel_leader.GetFirstName] ตำหนิ [rival_scope.GetFirstName] เบาๆ"
 travel_events.3150.c:0 "เจ้าจะจบชีวิตในคุกใต้ดิน"
 travel_events.3150.d:0 "ไปให้พ้นสายตาข้า #EMP เดี๋ยวนี้.#!"
 travel_events.3150.e:0 "นั่นเสียงลมที่ข้าได้ยินหรือเปล่า?"
 travel_humiliation_modifier:0 "ความอัปยศจากการกบฏ"
 
 #Crows Events
 travel_events.3160.t:0 "$travel_danger_prefix$ ฝูงกา"
 travel_events.3160.desc_battle:0 "พื้นดินชุ่มโชกไปด้วยเลือด ก้าวของเราช้าลง ราวกับว่าเรากำลังลุยผ่านหนองน้ำ ศพยังคงกระจัดกระจายอยู่รอบๆ รอการเก็บกู้ ส่วนใหญ่คงสูญเสียทรัพย์สินที่สำคัญที่สุดไปแล้ว แต่ชายบางคนยืนกรานที่จะค้นหาพวกมัน\n\nขณะที่เราเข้าใกล้ร่างต่างๆ เราเห็นว่าเราไม่ใช่คนเดียวที่พยายามทำ เช่นนั้น และฝูงการ้องเสียงดังแหลมใส่เรา จากนั้นก็โผลงมาในอากาศเพื่อโจมตีข้า"
 travel_events.3160.desc_fallback:1 "ป่าไม้ทอดยาวไปเรื่อยๆ เช่นเดียวกับเส้นทาง เช่นเดียวกับข้า เราผ่านต้นไม้ต้นแรกและมันเหมือนกับการล่วงล้ำเข้าไปในอาณาเขตที่แตกต่างออกไป สิ่งมีชีวิต กลางคืน เราฝ่าฟันพืชพรรณและพูดคุยอย่างร่าเริงเกี่ยวกับการเดินทางของเรา เราเห็นนก และเราเห็นผลไม้\n\nอากาศพัดใบไม้และเราก็ไปต่อ มีรังมากขึ้นบนกิ่งไม้เหล่านี้แล้ว\n\nฝูงการ้องเสียงดังแหลม จากนั้นก็โผลงมาในอากาศมุ่งหน้าสู่ #EMP ข้า#!."
 travel_events.3160.desc_outro:0 "ข้าใช้แขนบังใบหน้าและกรีดร้องเมื่อรู้สึกถึงจะงอยปากของพวกมัน พยายามเจาะเข้ามาในผิวหนังของข้า"
 travel_events.3160.a:0 "[travel_leader.GetFirstNameNoTooltip]! ช่วยข้าด้วย!"
 travel_events.3160.b:0 "เอาขนมปังนี่ไป! ปล่อยข้าไป!"
 travel_events.3160.c:0 "ข้าจะแสดงให้เจ้าดู!"
 travel_events.3160.c.success:0 "ท่านต่อสู้ขับไล่ฝูงกาไปได้"
 travel_events.3160.c.failure:0 "ฝูงกาสามารถ ทำให้ท่านบาดเจ็บได้"
 
