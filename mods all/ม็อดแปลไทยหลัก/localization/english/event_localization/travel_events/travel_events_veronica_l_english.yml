 travel_events.3022.t:0 "งานเฉลิมฉลอง"
 travel_events.3022.desc:1 "พวงมาลัยดอกไม้อันหรูหราประดับประดาห้องบัลลังก์ ในแสงเทียนอันนุ่มนวลของโถง แขกเหรื่อร้องเพลงด้วยเสียงอันมีชีวิตชีวา\n\n\"อ้า ท่านอยู่นี่เอง!\" [foreign_ruler.GetTitledFirstName] ตบมือ[foreign_ruler.GetHerHis] กระตุ้นให้นักร้องและนักดนตรีเงียบเสียงลงอย่างเชื่อฟัง\n\n\"เรากำลังจะเริ่มเต้นรำเพื่อเป็นเกียรติแก่ท่าน [ROOT.Char.GetTitledFirstNameNoTooltip] ทุกคน จับมือกัน! ตั้งวงกลม!\""
 travel_events.3022.a:0 "ข้ายินดีเข้าร่วมกับท่าน!"
 travel_events.3022.b:1 "#EMP อะฮ่า!#! ข้ารอช่วงเวลา เช่นนี้อยู่!"
 travel_events.3022.b.success:0 "ท่านสร้างความประทับใจให้ราชสำนักของ [foreign_ruler.GetTitledFirstNameNoTooltip] ด้วยท่าเต้นของท่าน"
 travel_events.3022.b.failure:0 "ท่านทำตัวเป็นตัวตลกต่อหน้าราชสำนักของ [foreign_ruler.GetTitledFirstNameNoTooltip]"
 travel_events.3022.c:1 "ข้าอยากจะแค่ฟังบทสนทนามากกว่า..."
