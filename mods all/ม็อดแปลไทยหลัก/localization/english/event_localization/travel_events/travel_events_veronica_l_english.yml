 travel_events.3081.t:0 "อัศวินพเนจร[knight_errant.Custom('KnightCultureNoTooltip')]: ภารกิจ"
 travel_events.3081.desc:0 "[knight_errant.Custom('KnightCultureNoTooltipLowercase')] นำเราไปยังทุ่งโล่งเล็กๆ ที่มีน้ำพุธรรมชาติส่องประกายระยิบระยับ แสงสะท้อนบนพื้นผิวของมันด้วยประกายอันเป็นสุขและ ทำให้น้ำดูสว่างมากจนรู้สึกเหมือนเป็นดวงอาทิตย์ดวงที่สอง\n\n\"ระวัง สัตว์ร้าย! ผู้พิทักษ์!\" [knight_errant.Custom('KnightCultureNoTooltipLowercase')] ชี้ไปที่ [ROOT.Char.Custom('GetAnimalType')] ซึ่งยืนอยู่ระหว่างเรากับน้ำพุ"
 travel_events.3081.a:0 "\"อย่ากลัว! ข้าจะสู้กับมันเอง\""
 travel_events.3081.a.success:0 "ท่านฆ่าสัตว์ร้ายได้"
