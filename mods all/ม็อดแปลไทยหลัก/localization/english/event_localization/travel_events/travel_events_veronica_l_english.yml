 vigorous_dancer_modifier.desc:0 "ความเชี่ยวชาญอันน่าทึ่งของตัวละครนี้ในการเต้นจิ๊กที่คึกคักที่สุดเป็นแรงบันดาลใจให้พวกเขาฝึกฝนบ่อยครั้งและสร้างความประทับใจทุกครั้งที่เป็นไปได้"
 
 #Infatuated Knight event
 travel_events.3030.t:0 "ของขวัญจากต่างแดน"
 travel_events.3030.desc:0 "ไม่ใช่ครั้งแรกที่ข้าจับได้ว่า [fleeing_knight.Custom2('MyCharacterIntroduction', ROOT.Char)] ง่วนอยู่กับดอกไม้บางชนิดที่[fleeing_knight.GetSheHe]เก็บมาระหว่างทาง บางครั้งข้าสาบานได้เลยว่าข้าได้ยิน[fleeing_knight.GetHerHim]ถอนหายใจ มองข้ามที่ดินของ [ROOT.Char.GetCurrentLocation.GetNameNoTooltip] ไป\n\n\"[ROOT.Char.Custom('GetCourtOwner')] ของข้า\" [fleeing_knight.GetSheHe] กล่าว \"ไม่ใช่ความลับที่หัวใจของข้าได้พบบ้านใหม่ไกลบ้าน อนิจจา จิตวิญญาณของข้าเจ็บปวดเพื่อ [foreign_lady_scope.GetTitledFirstName] ความปรารถนาของข้าไม่มีที่สิ้นสุด ดวงตาของ[foreign_lady_scope.GetHerHis] เส้นผมของ[foreign_lady_scope.GetHerHis]... ข้าปรารถนาเพียงคำทักทาย ข้ายอมตายเพื่อคำพูดสักคำ ได้โปรด ข้าขอร้อง ให้ข้าอยู่กับ[foreign_lady_scope.GetHerHim]เถิด\""
 travel_events.3030.a:0 "ข้าเป็นใครที่จะไปยุ่งเกี่ยวกับเรื่องที่สูงส่งกว่า?"
 travel_events.3030.b:0 "เจ้ากำลังจะกลับบ้าน #EMP กับข้า#!."
 travel_events.3030.c:0 "เราไม่มีเวลาสำหรับความหลงใหลแบบเด็กๆ เช่นนี้"
 travel_events.3030.c.success:0 "ท่านโน้มน้าวให้ [fleeing_knight.GetHerHim] อยู่ต่อได้สำเร็จ"
 travel_events.3030.c.failure:0 "คำพูดของท่านล้มเหลว"
 travel_events.3030.d:0 "เรามีที่ว่างเพียงพอใน [ROOT.Char.Custom('GetCourt')] ของเราที่จะต้อนรับท่านทั้งสอง"
 travel_events.3030.e:0 "ดวงตาของ[foreign_lady_scope.GetHerHis|U]ช่างสวยงามจริงๆ และผมของ[foreign_lady_scope.GetHerHis]ก็ดูนุ่มเหลือเกิน..."
 travel_events.3030.f:0 "ข้า #EMP เกลียด#! ความรัก ตัดหัวพวกมันซะ"
 
 #Curious Bishop event
 travel_events.3040.t:0 "ความสนใจอันตราย"
 travel_events.3040.desc:1 "ทุกเช้านับตั้งแต่เรามาถึง [ROOT.Char.GetCurrentLocation.GetNameNoTooltip] [bishop.Custom2('MyCharacterIntroduction', ROOT.Char)] จะละจากเสลี่ยงของ [bishop.GetHerHis] และเคลื่อนตัวหายไปจากสายตาข้าอย่างเงียบ ๆ ครั้งนี้ข้าตัดสินใจติดตามเส้นทางของ [bishop.GetHerHis] ไปและพบ [bishop.GetHerHim] กำลังสนทนาอย่างออกรสกับ [foreign_bishop.Custom('GetActualBishopTitle')] ท้องถิ่น [foreign_bishop.GetFirstName]\n\nพิธีเริ่มต้นขึ้นและแสงเทียนส่องสว่างไปยัง [foreign_bishop.GetFirstNameNoTooltip] ขณะที่เงาทอดยาวเล่นล้อบนผนังราวกับใบไม้ในฤดูใบไม้ร่วง "[bishop.GetFirstNameNoTooltip]" ข้าเรียก [bishop.GetHerHim] หลังจบพิธี "ท่านกำลังทำอะไร"\n\n"[ROOT.Char.Custom('FormOfAddressForLiege')|U] ข้าเพิ่งตระหนักได้ว่า อาจมีสัจธรรมมากกว่าหนึ่งเดียว""
 travel_events.3040.a:0 "พิธีน่าประทับใจจริงๆ..."
 travel_events.3040.b:0 "นี่มันไร้สาระ! #EMP ไร้สาระ!#!"
 travel_events.3040.c:0 "มีช่องว่างสำหรับการโต้เถียงอย่างสงบที่นี่"
 travel_events.3040.c.success:0 "ท่านโน้มน้าว [bishop.GetFirstNameNoTooltip] ว่ามีความจริงเพียงหนึ่งเดียว"
 travel_events.3040.c.failure:0 "[bishop.GetFirstNameNoTooltip] โกรธเคืองในความคิดคับแคบของท่าน"
 travel_events.3040.d:0 "ไม่มีที่ว่างสำหรับความสงบที่นี่! ชักดาบของเจ้าออกมา!"
 travel_events.3040.d.success:0 "แขนอันแข็งแกร่งของท่านโน้มน้าว [bishop.GetShortUIName] ได้สำเร็จ"
 travel_events.3040.d.failure:0 "[bishop.GetShortUIName] โกรธเคืองในความรุนแรงของท่าน"
 broadened_horizons_modifier:0 "เปิดโลกทัศน์ให้กว้างขึ้น"
 firm_convictions_modifier:0 "ความเชื่อมั่นอันแน่วแน่"
 
 #The Hermit events
 travel_events.3060.t:0 "ฤๅษี"
 travel_events.3060.desc.intro: "ถ้ำเล็กๆ โผล่ออกมาจากพืชพรรณเหมือนซุ้มหินในมหาวิหาร ตรงทางเข้ามีโต๊ะไม้เล็กๆ และแผงลอย มีคนทิ้งตะเกียงที่จุดไฟไว้บนนั้น"
 travel_events.3060.desc.travel_leader: "\n\n"ระวัง [ROOT.Char.Custom('FormOfAddressForLiege')]" [travel_leader.GetTitledFirstName] ยื่นแขนของ [travel_leader.GetHerHis] ออกมากั้นหน้าอกข้า "ดินแดนแถบนี้มีโจรป่า""\n\n"ท่านช่างด่วนกล่าวหานัก" ร่างหนึ่งยืนอยู่ในเงามืดสลัวที่ปากถ้ำ "ข้าเป็นเพียงฤาษีตนหนึ่ง ส่วนท่าน... ท่านกลับมีตำแหน่งถึง [ROOT.Char.GetTitleAsNameNoTooltip]""
 travel_events.3060.desc.on_your_own: "คนนอกคอกกระมัง หรืออาจเป็นที่ซ่อนของโจร?\n\n\"อย่ากลัวไปเลย ท่าน [ROOT.Char.GetTitleAsNameNoTooltip]\" ร่างที่ส่องสว่างสลัวๆ ยืนอยู่ที่ทางเข้าถ้ำ \"ข้าเป็นเพียงฤๅษี แสวงหาปัญญาในป่าเก่าแก่เหล่านี้\""
 travel_events.3060.a:0 "ฤๅษีจะเป็นส่วนเสริมที่ยอดเยี่ยมในคณะเดินทางของข้า"
 travel_events.3060.b:0 "ช่างโชคดีเสียนี่กระไร! ได้โปรด บอกข้าเกี่ยวกับอนาคตของข้า"
 travel_events.3060.c:0 "ไปกันเถอะ... ไปกันเถอะ"
 impending_doom_modifier:0 "ลางร้ายที่ใกล้เข้ามา"
 impending_doom_modifier_desc:0 "ตัวละครนี้รู้สึกถึงลางร้ายที่ใกล้เข้ามาหลังจากเพิกเฉยต่อฤๅษี"
 ignored_hermit:0 "เพิกเฉยต่อฤๅษี"
 hermit_tells_your_future_tt:0 "ท่านจะได้รับคำทำนาย..."
 
 travel_events.3061.t:0 "ฤๅษี: คำทำนาย"
 travel_events.3061.intro:0 "ฤๅษีใช้เวลาครู่หนึ่งก่อนตอบ [hermit_scope.GetSheHe|U] ลุกขึ้นและรอจนกว่าข้าจะตามไป มีสมุนไพรบางอย่างกระจัดกระจายอยู่รอบๆ และสิ่งที่ดูเหมือนจะเป็นเตียงนอนแบบง่ายๆ [hermit_scope.GetSheHe|U] หันมาหาข้าเมื่อเราอยู่ห่างจากคณะเดินทางของข้า และด้วยเสียงที่ทุ้มลึกผิดปกติ ตอบว่า:\n\n"
 travel_events.3061.desc_good:0 "\"ท่านจักพบผู้ที่แสวงหา\""
 travel_events.3061.desc_normal:0 "\"ไฟจักเอ่ยวาจาและเงินจักไหลจากกีบเท้าของวัวที่ส่งเสียงร้อง\""
 travel_events.3061.desc_bad:0 "\"น้ำจักไหลผ่านไป แต่ท่านจักไม่\""
 travel_events.3061.a:0 "ช่างลึกซึ้งเสียจริง"
 travel_events.3061.a.tt:0 "ท่านจะจดจำสิ่งนี้ไว้"
 
 travel_events.3062.t:0 "ฤๅษีของข้าอยู่ที่ไหน?"
 travel_events.3062.desc:0 "[hermit_owner.GetTitledFirstName] ให้การต้อนรับอย่างอบอุ่นเมื่อเรามาถึงป้อมปราการของ[hermit_owner.GetHerHis] อย่างไรก็ตาม ทหารรักษาการณ์ของ[hermit_owner.GetHerHis]ดูเหมือนจะหัวเราะคิกคักและพึมพำเมื่อเห็นเรา ชี้ไปที่คณะเดินทางของเรา\n\n\"ท่าน [ROOT.Char.GetTitleAsNameNoTooltip] [ROOT.Char.GetFirstNameNoTooltip] ที่รัก! เป็นเกียรติอย่างยิ่งที่ได้ต้อนรับท่านสู่…\" [hermit_owner.GetFirstNameNoTooltip] หยุดกลางประโยค ใบหน้าของ[hermit_owner.GetHerHis]ซีดเผือด \"ท่านกำลังทำอะไรกับฤๅษี #EMP ของข้า#!?\""
 travel_events.3062.a:0 "ข้าไม่ได้ตั้งใจจะขโมยข้าราชบริพารของท่าน"
 travel_events.3062.b:0 "เอาล่ะ ตอนนี้ [hermit_scope.GetSheHe] เป็น $cave_hermit_court_position$ #EMP ของข้า#! แล้ว"
 travel_events.3062.b.tt:0 "[hermit_scope.GetShortUIName] จะจ้างเป็น $cave_hermit_court_position$ ได้ถูกลงในอีก #bold 5 ปี#! ข้างหน้า!"
 travel_events.3062.c:1 "ทำไมเราไม่ให้ [hermit_scope.GetHerHim] ตัดสินใจว่าจะรับใช้ใคร?"
 travel_events.3062.c.success:0 "ท่านโน้มน้าวให้ [hermit_scope.GetShortUINameNoTooltip] อยู่กับท่านได้สำเร็จ"
 travel_events.3062.c.failure:0 "[hermit_scope.GetShortUINameNoTooltip] จะอยู่ที่ราชสำนักของ [hermit_owner.GetShortUINameNoTooltip]"
 found_hermit_mod:0 "เงินเดือนฤๅษีที่พบ"
 
 #Bandit event
 travel_events.3070.t:1 "$travel_danger_prefix$ โจรบนสะพาน"
 travel_events.3070.desc:0 "เสียงกระซิบแผ่วเบาของแม่น้ำที่เราตามมาครู่หนึ่งดังขึ้นแล้ว สมาชิกบางคนในคณะเดินทางพูดถึงการหยุดพักสั้นๆ เอาน้ำจืด พักเท้า\n\nมีสะพานหินเมื่อเส้นทางเลี้ยว ชายสองคนนั่งพิงราวสะพาน คนหนึ่งตีอีกคนด้านข้างแล้วชี้ไปที่กลุ่มของเรา [bandit_scope.GetWomanMan] คนที่สามขึ้นมาจากฝั่ง อีกคนมองมาที่เราหลังจากถ่มน้ำลายลงแม่น้ำ\n\n\"ท่านรู้ไหม\" [bandit_scope.GetSheHe] กล่าว \"นี่จริงๆ แล้วเป็นสะพานเก็บค่าผ่านทาง\""
 travel_events.3070.a:0 "ข้าเข้าใจ"
 travel_events.3070.b:0 "กล้าหาญมากที่เจ้ากล้าเสนอ เช่นนั้น [knight_scope.GetTitledFirstNameNoTooltip] แสดงให้[bandit_scope.GetHerHim]ดู"
 travel_events.3070.b.success:0 "[knight_scope.GetShortUINameNoTooltip] เอาชนะพวกโจรได้"
 travel_events.3070.b.failure:0 "พวกโจรโจมตี [knight_scope.GetShortUINameNoTooltip]"
 travel_events.3070.c:0 "เจ้าคิดว่าเจ้ากำลังพูดอยู่กับใคร? ข้าคือ #EMP [ROOT.Char.GetTitleAsNameNoTooltip]#!!"
 travel_events.3070.c.success:0 "ท่านข่มขู่พวกโจรได้สำเร็จ"
 travel_events.3070.c.failure:0 "พวกโจรไม่เชื่อท่าน"
 
 #Knight Errant events
 travel_events.3080.t:0 "อัศวินพเนจร[knight_errant.Custom('KnightCultureNoTooltip')]"
 travel_events.3080.desc_intro:1 "เป็นที่ทราบกันดีว่าผู้คนแห่ง [ROOT.Char.GetCurrentLocation.GetNameNoTooltip] ดูจะแสดงความเลื่อมใสเป็นพิเศษต่อเหล่า [knight_errant.Custom('KnightCulturePluralNoTooltipLowercase')] และตำนานของพวกเขา\n\n"[ROOT.Char.Custom('FormOfAddressForLiege')|U]" [knight_errant.Custom('KnightCultureNoTooltipLowercase')] ผู้นั้นกล่าว พลางก้มศีรษะของ[knight_errant.GetHerHis]ลง "ช่างเป็นโชคดียิ่งที่ท่านและข้าได้มาพบกัน ณ ทางแยกนี้ ด้วยข้ากำลังค้นหาน้ำพุวิเศษ ซึ่งกล่าวกันว่าน้ำของมันสามารถรักษาได้ทุกโรค หากท่านจะช่วยข้าในภารกิจนี้ ข้าจะขอถวายความเคารพต่อท่าน""
 travel_events.3080.desc_anagnorisis:1 "\n\n[same_culture_companion.GetTitledFirstName] รีบพูดขัดขึ้นมา: "เดี๋ยวก่อน [ROOT.Char.Custom('FormOfAddressForLiege')]! ข้ารู้จัก [knight_errant.Custom('KnightCultureNoTooltipLowercase')] ผู้นี้ นี่คือ [knight_errant.GetFirstName]!""
 travel_events.3080.a:0 "ข้าจะไม่มีวันทิ้ง [knight_errant.Custom('KnightCultureNoTooltipLowercase')] ไว้โดยไม่มีใครดูแล นำทางไป!"
 travel_events.3080.a.tt:0 "ท่านติดตาม [knight_errant.Custom('KnightCultureNoTooltipLowercase')]"
 travel_events.3080.b:0 "เข้าร่วมกับข้าและลืมเรื่องไร้สาระนั้นเสีย"
 travel_events.3080.b.success:0 "ท่านโน้มน้าว [knight_errant.Custom('KnightCultureNoTooltipLowercase')] ได้สำเร็จ"
 travel_events.3080.b.failure:0 "[knight_errant.Custom('KnightCultureNoTooltipLowercase')] จากไปโดยไม่เชื่อ"
