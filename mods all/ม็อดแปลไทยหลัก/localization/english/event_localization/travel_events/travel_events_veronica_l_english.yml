 travel_events.3081.b.success:0 "การล่อของท่านได้ผล"
 travel_events.3081.c:0 "\"ตอนนี้ #EMP เจ้า#! จะเป็นตัวล่อที่ดี\""
 travel_events.3081.d:0 "ช่างเป็นการผจญภัยอะไร เช่นนี้! ช่างเป็นแรงบันดาลใจ!"
