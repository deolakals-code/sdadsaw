l_english: 
 
 travel_danger_events.5000.t:0 "$travel_danger_prefix$ คณะเดินทางเจ้าปัญหา"
 travel_danger_events.5000.intro.land:0 "ขณะที่เราเดินทางผ่าน [location.GetName] ขบวนของเราได้หยุดพัก ณ ที่โล่ง ซึ่งล้อมรอบด้วย [location.Custom('GetProvinceFoliageDesc')] ข้าเดินเข้าไปใกล้เสียงเอะอะเพียงเพื่อพบว่า [entourage_member_one.GetFirstName] และ [entourage_member_two.GetFirstName] กำลังโต้เถียงกันอย่างดุเดือด\n\n"
 travel_danger_events.5000.intro.sea:0 "เมื่อได้ยินเสียงตุ้บตั้บหลายครั้งและเสียงกรีดร้องด้วยความโกรธดังมาจากด้านนอก ข้ารีบขึ้นมาจากใต้ดาดฟ้าเพียงเพื่อพบว่า [entourage_member_one.GetFirstName] และ [entourage_member_two.GetFirstName] กำลังโต้เถียงกันอย่างตึงเครียด\n\n"
 travel_danger_events.5000.craven:0 "\"เหตุใดเจ้าจึงทรมานข้า เช่นนี้ [entourage_member_two.GetFirstNameNoTooltip]? ข้าเกลียดการถูก ทำให้ตกใจจากด้านหลัง โดยเฉพาะอย่างยิ่งเมื่อเราเดินทางผ่าน [location.Custom('GetTerrainLandPlural')] เหล่านี้!\"\n\n\"โอ้ ไม่เอาน่า มันเป็นเพียงการล้อเล่น! รวบรวมความกล้าหาญสักหน่อย — เพื่อพวกเราทุกคน...\""
 travel_danger_events.5000.brave:0 ""ลุกขึ้นสู้ ไอ้ [entourage_member_two.Custom2('InsultNoun', SCOPE.sC('entourage_member_one'))] ขี้มูกโป่ง และ #EMP สู้กับข้า#!! แสดงคุณค่าของเจ้าให้ข้าเห็น! คนขี้ขลาดอย่างเจ้าไม่มีสิทธิ์ในการเดินทางครั้งนี้!" [entourage_member_one.GetFirstNameNoTooltip] ถ่มน้ำลายลงพื้น\n\n[entourage_member_two.GetFirstNameNoTooltip] ทำได้เพียงหมอบด้วยความกลัว ร้องไห้เงียบ ๆ กับ [entourage_member_two.GetHerselfHimself]"
 travel_danger_events.5000.chaste:0 ""เจ้าจะหยุดพล่ามเรื่อง... #EMP กิจการ#อันตัณหาจัดของเจ้าได้หรือยัง ไอ้ [entourage_member_two.Custom2('InsultNounSexual', SCOPE.sC('entourage_member_one'))]! ข้าจะไม่ฟังมันอีกต่อไป!" [entourage_member_one.GetFirstNameNoTooltip] ปิดหน้า [entourage_member_one.GetHerHis] ด้วยความอับอาย\n\n"อย่ามาทำเป็น [entourage_member_one.GetFirstNameNoTooltip]! ข้าปฏิเสธที่จะอับอายในความต้องการ..." [entourage_member_two.GetFirstNameNoTooltip] ตอบอย่างขุ่นเคือง"
 travel_danger_events.5000.stubborn:0 "\"ข้าสาบานต่อท่านว่าเรากำลังไปผิดทาง! ข้าจะไม่ก้าวต่อไปอีกแม้ แต่ก้าวเดียวจนกว่าเราจะแก้ไขปัญหานี้!\" [entourage_member_one.GetFirstNameNoTooltip] ตะโกน\n\n\"#EMP เจ้าคนดื้อด้านหัวแข็ง!#! เจ้ามองไม่เห็นหรือว่าคณะเดินทางทั้งหมดนี้เหนื่อยหน่ายกับเจ้าและ [entourage_member_one.Custom('PointOfRidicule')] ของเจ้าแล้ว?\""
 travel_danger_events.5000.generous:0 "\"เป็นครั้งสุดท้ายแล้ว [entourage_member_two.GetFirstNameNoTooltip] ข้าไม่มีอะไรเหลือให้แบ่งปันอีกแล้ว! เจ้ากล้าดีอย่างไรมาขอทองคำเพิ่มอีกหลังจากที่ข้าปล่อยให้เจ้ารีดเลือดข้าจนหมดตัว!\" [entourage_member_one.GetFirstNameNoTooltip] ตะคอกอย่างโกรธเคือง\n\n\"แต่ข้าต้องการอีก! อย่าตระหนี่นักสิ [entourage_member_one.GetFirstNameNoTooltip]!\""
 travel_danger_events.5000.gregarious:0 "\"ไม่เอาน่า [entourage_member_two.GetFirstNameNoTooltip] ข้าแค่พยายามฆ่าเวลา เราไม่ควรทำความรู้จักกันสักหน่อยหรือ?\" [entourage_member_one.GetFirstNameNoTooltip] อุทาน สีหน้าเศร้าสร้อยปรากฏบนใบหน้าของ[entourage_member_one.GetHerHis]\n\n[entourage_member_two.GetFirstNameNoTooltip] ตัวสั่นด้วยความอึดอัด ดูเหมือนพร้อมที่จะวิ่งหนีกลับไปยัง [ROOT.Char.GetCapitalLocation.GetNameNoTooltip]"
 travel_danger_events.5000.shy:0 "[entourage_member_one.GetFirstNameNoTooltip] รู้สึกไม่สบายใจ หันมาหาข้าและอธิบายว่า "[entourage_member_two.GetFirstNameNoTooltip] ไม่ยอมปล่อยข้าไว้ตามลำพัง! บอก [entourage_member_one.Custom2('InsultNoun', SCOPE.sC('entourage_member_two'))] [entourage_member_one.Custom2('InsultAdjective', SCOPE.sC('entourage_member_two'))] ตนนี้ทีว่าข้าต้องการความสงบ!"\n\n"ข้าแค่ล้อเล่นเรื่อง [entourage_member_one.Custom2('PointOfRidicule', SCOPE.sC('entourage_member_two'))] ของ [entourage_member_one.GetFirstNamePossessiveNoTooltip] เท่านั้นเอง จริง ๆ นะ!""
 travel_danger_events.5000.just:0 ""เจ้ากล้าดีอย่างไรมาชนข้าตกม้า [entourage_member_one.GetFirstNameNoTooltip]! ไอ้ [entourage_member_one.Custom2('InsultNoun', SCOPE.sC('entourage_member_two'))] [entourage_member_one.Custom2('InsultAdjective', SCOPE.sC('entourage_member_two'))]!" [entourage_member_two.GetFirstNameNoTooltip] อุทาน ขณะนอนคว่ำหน้าอยู่บน [location.Custom('GetProvinceGroundDesc')]\n\n"ข้าไม่สามารถรับผิดชอบต่อการขาดทักษะที่ชัดเจนของเจ้าได้" [entourage_member_one.GetFirstNameNoTooltip] ตอบกลับด้วยรอยยิ้มเย้ยหยัน"
 travel_danger_events.5000.patient:0 "\"...และนั่นคือวิธีที่ข้าจัดการหลุดพ้นจากสถานการณ์อันสิ้นหวัง เช่นนั้นได้เมื่อข้าไปเยือน [location.GetNameNoTooltip] มาก่อน เรื่องนี้ ทำให้ข้านึกถึงอีกเรื่องหนึ่งจริงๆ...\"\n\n\"#EMP อย่าพูดอีกแม้แต่คำเดียว [entourage_member_one.GetFirstNameNoTooltip]!#!\" [entourage_member_two.GetFirstNameNoTooltip] ขัดจังหวะ"
 travel_danger_events.5000.impatient:0 "[entourage_member_one.GetFirstNameNoTooltip] กำลังคร่ำครวญเสียงดัง \"เราจะไปถึง [next_destination.GetName] #EMP เมื่อไหร่#! กัน? ข้าทนเดินทางต่อไปอีกไมล์เดียวก็ไม่ไหวแล้ว!\"\n\n\"เราจะไปถึงเมื่อเราไปถึง! การคร่ำครวญอย่างไม่รู้คุณของเจ้านำมา ซึ่งอารมณ์ขุ่นมัวให้กับคณะเดินทางที่เหลือเท่านั้น หากเป็นเรื่องของข้า เราคงทิ้งเจ้าไว้ที่ [random_visited_province.GetNameNoTooltip] แล้ว!\""
 travel_danger_events.5000.temperate:0 "\"เจ้าหมูตะกละ บาปหนา! เจ้าคิดถึงเรื่องอื่นนอกจากอาหารไม่ได้เลยหรือไงแม้เพียงชั่วโมงเดียว!\"\n\n \"แต่ข้า #EMP หิววววว#! เหลือเกิน! ข้าคิดได้ แต่เรื่อง [entourage_member_two.Custom('GetExpensiveDessert')] ทั้งหมดที่เราทิ้งไว้เบื้องหลังใน [ROOT.Char.GetCapitalLocation.GetNameNoTooltip]\" [entourage_member_two.GetFirstNameNoTooltip] คร่ำครวญ น้ำลายสายหนึ่งค่อยๆ ไหลย้อยออกจากปากของ[entourage_member_two.GetHerHis]"
 travel_danger_events.5000.paranoid:0 ""เจ้าถูกส่งมาที่นี่เพื่อฆ่าข้า! อย่ามาโกหกข้า ไอ้สายลับ [entourage_member_two.Custom2('InsultAdjective', SCOPE.sC('entourage_member_one'))]!" [entourage_member_one.GetFirstNameNoTooltip] กรีดร้องด้วยความตื่นตระหนกสุดขีด\n\n"ใจเย็น ๆ [entourage_member_one.GetFirstNameNoTooltip]! นี่ข้าเอง! เจ้าคิด เช่นนั้นได้อย่างไร?" [entourage_member_two.GetFirstNameNoTooltip] ตอบกลับ พยายาม ทำให้ [entourage_member_one.GetWomanMan] สงบลง"
 travel_danger_events.5000.zealous:0 "[entourage_member_one.GetFirstNameNoTooltip] ดูเหมือนกำลังยกย่องคุณธรรมของ [entourage_member_one.GetFaith.GetNameNoTooltip] \"... แต่เจ้าไม่เข้าใจความสำคัญของ [entourage_member_one.GetFaith.HighGodName] ต่อการดำเนินชีวิตที่ดี มันสำคัญยิ่งที่ — \"\n\n\"#EMP ไม่เอาอีกแล้ว!#!\" [entourage_member_two.GetFirstNameNoTooltip] กลอกตา[entourage_member_two.GetHerHis] \"[entourage_member_two.GetFaith.HighGodName] หากท่านกำลังฟังอยู่ โปรดช่วยข้าให้พ้นจาก [entourage_member_one.Custom('InsultNoun')] ผู้นี้ด้วยเถิด ข้าขอร้อง!\""
 travel_danger_events.5000.fallback:0 ""ข้าจะไม่ทนความโง่เขลาของเจ้าอีกต่อไป ไอ้ [entourage_member_two.Custom2('InsultNoun', SCOPE.sC('entourage_member_one'))] [entourage_member_two.Custom2('InsultAdjective', SCOPE.sC('entourage_member_one'))]!" [entourage_member_one.GetFirstNameNoTooltip] กระทืบเท้า [entourage_member_one.GetHerHis] ลงบน [location.Custom('GetProvinceGroundDesc')]\n\n"เจ้าต่างหากที่คร่ำครวญมาตลอดการเดินทางนี้! ร้องโวยวายว่า '#EMP ถึงหรือยัง?#!' ทุกทางแยก!" [entourage_member_two.GetFirstNameNoTooltip] โต้กลับ"

 travel_danger_events.5000.a:0 "ไม่เอาน่า แน่นอนว่าพวกเจ้าสองคนสามารถคืนดีกันได้"
 travel_danger_events.5000.a.success:0 "ท่านโน้มน้าวให้ [entourage_member_one.GetFirstNameNoTooltip] และ [entourage_member_two.GetFirstNameNoTooltip] ยุติความขัดแย้งได้"
 travel_danger_events.5000.a.failure:0 "[entourage_member_one.GetFirstNameNoTooltip] และ [entourage_member_two.GetFirstNameNoTooltip] ไม่สามารถยุติความขัดแย้งได้"
 entourage_member_one_leaves.tt:0 "[entourage_member_one.GetFirstNameNoTooltip] ออกจากคณะเดินทางของท่าน"
 entourage_member_two_leaves.tt:0 "[entourage_member_two.GetFirstNameNoTooltip] ออกจากคณะเดินทางของท่าน"
 travel_danger_events.5000.b:0 "เราไม่มีเวลาสำหรับการทะเลาะวิวาทเล็กน้อยของพวกเจ้า!"
 travel_danger_events.5000.c:0 "มีเพียงวิธีเดียวที่จะแก้ไขปัญหานี้ได้"
 travel_danger_events.5000.c.success:0 "[entourage_member_one.GetFirstNameNoTooltip] ชนะ"
 travel_danger_events.5000.c.failure:0 "[entourage_member_two.GetFirstNameNoTooltip] ชนะ"

 travel_danger_events.5010.t:0 "$travel_danger_prefix$ ไม่มีห้องว่าง"
 travel_danger_events.5010.desc.intro:0 "หลังจากเดินทางอย่างเหน็ดเหนื่อยมาหลายวัน เราได้หยุดพักที่โรงเตี๊ยมแห่งหนึ่งที่นี่ใน [location.GetName] เพื่อหาที่พักสำหรับค่ำคืนนี้ ข้าส่ง [travel_leader.GetName] [ROOT.Char.Custom2('RelationToMeShort', travel_leader )] ของข้าไปสอบถามเกี่ยวกับที่พักที่เป็นไปได้ ทว่า สีหน้าเศร้าสร้อยบนใบหน้าของ[travel_leader.GetHerHis]ขณะที่เขากลับมายังคณะเดินทางนั้นไม่เป็นลางดีเลย\n\n"
 travel_danger_events.5010.desc.seriously:0 ""[ROOT.Char.Custom('FormOfAddressForLiege')|U] อย่างที่ท่านอาจเดาได้..."\n\n[travel_leader.GetSheHe|U] ก้มศีรษะของ[travel_leader.GetHerHis]ลงอย่างสิ้นหวัง ไอ้ [angry_char.Custom2('InsultNoun', ROOT.Char)] [angry_char.Custom2('InsultAdjective', ROOT.Char)] [angry_char.GetTitledFirstName] นั่น ตั้งใจจะ ทำให้การเดินทางครั้งนี้เป็นนรกบนดินสำหรับข้า!"
 travel_danger_events.5010.desc.again:0 ""[ROOT.Char.Custom('FormOfAddressForLiege')|U] อีกแล้วขอรับ เจ้าของโรงเตี๊ยมแห่งนี้บอกว่าพวกเขา #EMP เต็มหมดแล้ว!#! ดูเหมือนว่า [angry_char.GetName] จะได้กระจายข่าวการมาถึงของเราในแถบนี้""
 travel_danger_events.5010.desc:0 ""[ROOT.Char.Custom('FormOfAddressForLiege')|U] เจ้าของโรงเตี๊ยมบอกว่าพวกเขาเต็มจนล้น ทั้ง ๆ ที่มีลูกค้าน้อยมากในห้องส่วนกลาง ข้าสงสัยว่าเขาอาจปฏิเสธ เพราะดินแดนเหล่านี้เป็นของ [angry_char.GetName]...""

 travel_danger_events.5010.a_seriously:0 "[angry_char.GetFirstNameNoTooltip] จะต้องเสียใจในวันนี้..."
 travel_danger_events.5010.a_again:0 "#EMP อีกแล้วหรือ?!# ให้ตายสิ ไอ้ [angry_char.Custom2('InsultNoun', ROOT.Char)] นั่น!"
 travel_danger_events.5010.a:0 "ไม่เป็นไร เราจะหาที่พักที่อื่น"
 travel_danger_events.5010.b_seriously:0 "#EMP ให้. ข้า. เข้าไป!#!"
 travel_danger_events.5010.b:0 "ไม่มีใครปฏิเสธการพักผ่อนของ [ROOT.Char.GetTitledFirstNameNoTooltip]"
 travel_danger_events.5010.b.flavor:0 "ท่านพยายามใช้กำลังบุกเข้าไปในโรงเตี๊ยม"
 travel_danger_events.5010.b.success:0 "เจ้าของโรงเตี๊ยมถูกกำราบ"
 travel_danger_events.5010.b.failure:0 "เจ้าของโรงเตี๊ยมป้องกันตัวขับไล่ท่านออกไป"
 travel_danger_events.5010.c:0 "ข้าจะพูดคุยกับเจ้าของโรงเตี๊ยม"
 travel_danger_events.5010.c.flavor:0 "ท่านพยายามโน้มน้าวเจ้าของโรงเตี๊ยมให้อนุญาตให้ท่านและคณะเดินทางของท่านเข้าพัก"
 travel_danger_events.5010.c.success:0 "เจ้าของโรงเตี๊ยมถูกโน้มน้าว"
 travel_danger_events.5010.c.failure:0 "เจ้าของโรงเตี๊ยมไม่ถูกโน้มน้าว"
