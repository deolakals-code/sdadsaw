l_english: 
 hold_court_decision:0 "ออกว่าราชการ"
 hold_court_decision_desc:0 "เพื่อที่จะเป็นผู้ปกครองที่ประสบความสำเร็จ ข้าพเจ้าต้องตัดสินปัญหาและสถานการณ์ต่างๆ ที่เกิดขึ้นภายในขอบเขตอิทธิพลของข้าพเจ้าอย่างแท้จริง\n\nโดยการเชิญข้าแผ่นดินทั้งหมดของข้าพเจ้าอย่างเป็นทางการให้เดินทางมายัง [ROOT.Char.Custom('ResidenceBuilding')] ของข้าพเจ้าและถวายฎีกาขอความช่วยเหลือ ข้าพเจ้าจะสามารถรับทราบข่าวสาร ชักจูงดุลอำนาจ และแสดงให้โลกเห็นอย่างประจักษ์ว่าข้าพเจ้าคือผู้ปกครอง"
 hold_court_decision_tooltip:0 "ใช้อำนาจของท่านโดย [holding_court|E]"
 hold_court_decision_effects:0 "ท่านเชิญแขกและข้าราชบริพารของท่านมาร้องขอความช่วยเหลือจากท่าน:\n$EFFECT_LIST_BULLET$ ท่านอาจได้เรียนรู้เกี่ยวกับโอกาสพิเศษ\n$EFFECT_LIST_BULLET$ ท่านอาจสามารถมีอิทธิพลต่อสถานการณ์ในอาณาจักรต่างแดนได้\n$EFFECT_LIST_BULLET$ ท่านอาจได้รับความยิ่งใหญ่ของราชสำนักเพิ่มเติม\n$EFFECT_LIST_BULLET$ ท่านอาจได้รับหรือสูญเสียความเห็น ชื่อเสียง ทองคำ และอื่น ๆ"
 hold_court_decision_confirm:0 "รับฟังฎีกา"
 hold_court_gain_grandeur_tooltip:0 "ท่านจะเพิ่ม [court_grandeur|E] ของท่าน"
 hold_court_gain_legitimacy_tooltip: "ท่านจะเพิ่ม [legitimacy|E] ของท่าน"
