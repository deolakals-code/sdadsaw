l_english: 
 major_decisions.0100.t:0 "สายเลือดศักดิ์สิทธิ์"
 major_decisions.0100.desc.temporal:0 "ด้วยความศรัทธาอันบริสุทธิ์และการทำงานอย่างไม่หยุดยั้งของข้าพเจ้า ข้าพเจ้าได้ผูกพันตำแหน่งอันศักดิ์สิทธิ์ที่สุดของศาสนา [scoped_ruler.GetFaith.GetAdjective] เข้ากับตระกูล [scoped_ruler.GetDynasty.GetBaseName] อย่างแยกไม่ออก\n\nผู้คนจำนวนมากขึ้นในหมู่นักบวชและผู้ศรัทธาได้เริ่มมองว่าตระกูลของข้าพเจ้าเป็นผู้ดูแลที่ได้รับเลือกสรรสำหรับสิ่งศักดิ์สิทธิ์และเป็นผู้ประกาศเจตจำนงแห่งสวรรค์"
 major_decisions.0100.desc.spiritual:0 "ความศรัทธาอันแน่วแน่ของข้าพเจ้าต่อผู้แทนของ [scoped_ruler.GetFaith.HighGodNamePossessive] บนโลกนี้มิได้ถูกมองข้าม \n\n[scoped_pope.GetTitledFirstName] ได้ยอมรับการอุทิศตนของตระกูลข้าพเจ้าอย่างเป็นทางการ และสถาปนานามของเราให้เป็นผู้พิทักษ์นิรันดร์แห่งศรัทธา [scoped_ruler.GetFaith.GetAdjective]"
 major_decisions.0100.a:0 "เราเป็นมากกว่าปุถุชนธรรมดาเล็กน้อย"
 major_decisions.0100.b:0 "คุณธรรมอันไร้ที่ติ!"
 major_decisions.0102.desc.temporal:0 "ด้วยความประพฤติอันไร้ที่ติและการปกครองอันทรงธรรมของ [scoped_ruler.GetHerHis] [scoped_ruler.GetTitledFirstName] กำลังจะได้รับการจารึกชื่อให้เป็นอมตะในฐานะเสาหลักแห่ง [scoped_ruler.GetFaith.GetName]\n\n[scoped_ruler.GetSheHe|U] ได้กลายเป็น [scoped_ruler.GetTitleTierName] ผู้ทรงอิทธิพลและเป็นที่เคารพนับถือมากที่สุดในประวัติศาสตร์ยุคหลังอย่างไม่ต้องสงสัย และบางคนอ้างว่าอาจมีสายเลือดศักดิ์สิทธิ์ไหลเวียนอยู่ในเส้นเลือดของ [scoped_ruler.GetHerHis]"
 major_decisions.0102.desc.spiritual:1 "ความสำเร็จของ [scoped_ruler.GetTitledFirstName] นั้นยิ่งใหญ่ถึงขนาดที่ [scoped_pope.GetFaith.ReligiousHeadName] [scoped_pope.GetHerselfHimself] ได้ยอมรับบทบาทสำคัญของ [scoped_ruler.GetHerHis] ในการปกป้องและเผยแพร่คุณธรรม [scoped_ruler.GetFaith.GetAdjective] อย่างเป็นทางการ\n\nตระกูล [scoped_ruler.GetDynasty.GetBaseName] จะได้รับการจดจำไปอีกนานในด้านความศรัทธาและความมุ่งมั่นอันแรงกล้า ด้วยความประพฤติอันไร้ที่ติของ [scoped_ruler.GetWomanMan] ผู้ยิ่งใหญ่นี้"
 major_decisions.0102.a:0 "เราอยู่ในยุคสมัยอันเป็นมงคล"
 major_decisions.0102.b:0 "พวกเขาเป็นแบบอย่างแก่เราทุกคน!"
 major_decisions.0103.desc.temporal:0 "[scoped_ruler.GetTitledFirstName] ได้อุทิศชีวิตของ [scoped_ruler.GetHerHis] เพื่อคลุมผ้าคลุมแห่งความสูงส่งอันศักดิ์สิทธิ์ให้กับนามตระกูลของเรา และผลแห่งการทำงานหนักของ [scoped_ruler.GetHerHis] ก็ปรากฏให้เห็นในที่สุด \n\nผู้คนจำนวนมากขึ้นในหมู่นักบวชและผู้ศรัทธาได้เริ่มมองว่าตระกูลของเราเป็นผู้ดูแลที่ได้รับเลือกสรรสำหรับสิ่งศักดิ์สิทธิ์และเป็นผู้ประกาศเจตจำนงแห่งสวรรค์"
 major_decisions.0103.desc.spiritual:0 "[scoped_ruler.GetTitledFirstName] ได้อุทิศชีวิตของ [scoped_ruler.GetHerHis] เพื่อเอาใจคณะสงฆ์ [scoped_ruler.GetFaith.GetAdjective] และผลแห่งการทำงานหนักของ [scoped_ruler.GetHerHis] ก็ปรากฏให้เห็นในที่สุด \n\n[scoped_pope.GetTitledFirstName] ได้ยอมรับการอุทิศตนของตระกูลเราอย่างเป็นทางการ และสถาปนานามของเราให้เป็นผู้พิทักษ์นิรันดร์แห่งศรัทธา"
 major_decisions.0103.a:0 "เราทุกคนควรขอบคุณ [scoped_ruler.GetHerHim]"
 major_decisions.0103.b:0 "ยังคงมีการดูหมิ่นศาสนาจาก [scoped_ruler.GetFirstNameNoTooltip] อีก..."


#STRENGTHEN BLOODLINE
 major_decisions.0500.t:0 "ความแข็งแกร่งแห่ง [ROOT.Char.GetDynasty.GetBaseNameNoTooltip]"
 major_decisions.0500.desc:0 "เป็นเวลาหลายชั่วอายุคน ตระกูลของเราเป็นที่รู้จักในด้านความแข็งแกร่งของสายเลือด พละกำลัง ความงาม และสติปัญญา ล้วนเป็นคุณลักษณะที่เกี่ยวข้องกับนาม [ROOT.Char.GetDynasty.GetBaseNameNoTooltip]\n\nความเป็นเลิศของข้าพเจ้าเองเป็นเพียงเครื่องยืนยันสิ่งนี้ — คุณสมบัติที่ดีที่สุดทั้งหมดของตระกูลเราอยู่ในบุคคลที่สมบูรณ์แบบเพียงคนเดียว นามและพรสวรรค์ของข้าพเจ้าจะคงอยู่ผ่านผู้สืบสกุลของข้าพเจ้าไปอีกหลายศตวรรษ"
 major_decisions.0500.a:0 "เรามีอนาคตที่สดใสรออยู่!"

 #DYNASTY OF MANY CROWNS
 major_decisions.0501.desc:0 "ผ่านการสมรสที่วางแผนอย่างรอบคอบ พันธมิตร และการพิชิต ตระกูล [ROOT.Char.GetDynasty.GetBaseNameNoTooltip] ได้เข้าสู่ตำแหน่งอันชอบธรรมท่ามกลางมหาอำนาจที่แท้จริงของโลกที่รู้จัก\n\n[realm_1.GetNameNoTierNoTooltip|U], [realm_2.GetNameNoTierNoTooltip|U], [realm_3.GetNameNoTierNoTooltip|U], [realm_4.GetNameNoTierNoTooltip|U]... อาณาเขตของเราแผ่ขยายไปไกล มงกุฎมากมายอยู่บนศีรษะของเรา แต่โดยสายเลือด เราเป็นหนึ่งเดียวกัน"
 major_decisions.0501.a:0 "ขอให้มรดกของเราคงอยู่ชั่วนิรันดร์!"

 major_decisions.0001.t:0 "ยุคใหม่"
 major_decisions.0001.desc:0 "วิถีเก่าได้รับใช้เรามาอย่างดี และเราจะให้เกียรติเสมอไป อย่างไรก็ตาม ในฐานะ [ROOT.Char.GetTitleAsNameNoTooltip] แห่ง [ROOT.Char.GetPrimaryTitle.GetNameNoTierNoTooltip] ข้าพเจ้าได้ข้อสรุปว่าเราต้องนำระบบฟิวดัลและหลักการของมันมาใช้ หากเราจะเจริญรุ่งเรืองต่อไป มันคือก้าวย่างสำคัญบนเส้นทางสู่ความยิ่งใหญ่ของเรา!"
 major_decisions.0001.a:0 "[ROOT.Char.GetPrimaryTitle.GetNameNoTierNoTooltip] จงเจริญ!"

 major_decisions.0002.opening:0 "[actor.Custom2('AppropriateGreeting', ROOT.Char)]"

 major_decisions.0200.t:0 "กลับสู่รากเหง้า"
 major_decisions.0200.desc:0 "แม้ว่าข้าพเจ้าจะคุ้นเคยกับระบบลำดับชั้นที่เข้มงวดและเหล่าไพร่ที่ไม่ตั้งคำถามเมื่อทำไร่ไถนา ข้าพเจ้ากลับพบว่าตนเองปกครองเพียงชนเผ่าที่ไม่เชื่อฟัง ผู้คนเหล่านี้ไม่เคารพข้าพเจ้า พวกเขาเคารพเพียงความแข็งแกร่งเท่านั้น\n\nข้าพเจ้าจะแสดงความแข็งแกร่งให้พวกเขาเห็น! ข้าพเจ้าจะสละเครื่องประดับแห่งราชอำนาจที่ข้าแผ่นดินของข้าพเจ้าเกลียดชัง และยึดครองใจพวกเขาด้วยดาบที่ชูขึ้น!"
 major_decisions.0200.a:0 "ข้าจะพิสูจน์คุณค่าของข้า!"

 #Dai Viet
 major_decisions.4000.t: "รัชสมัยแห่งจักรพรรดิแดนใต้"
 major_decisions.4000.desc: "จากดินแดนศักดิ์สิทธิ์ของบรรพบุรุษสู่สายน้ำอันมิรู้จบแห่งสามเหลี่ยมปากแม่น้ำโขง ชัยชนะอันกึกก้องของข้านั้นมิอาจปฏิเสธได้\n\nผู้คนของเราดิ้นรนมานานหลายศตวรรษเพื่อตระหนักถึงศักยภาพที่แท้จริงของตนในการต่อต้านผู้กดขี่จากแดนเหนือ และบัดนี้เรายืนหยัดเป็นหนึ่งเดียวเพื่อเผชิญกับภยันตรายที่ใหญ่หลวงยิ่งกว่า\n\nจงให้อาณาจักรทั้งหลายรับรู้ว่าข้า [ROOT.Char.GetTitleAsNameNoTooltip] แห่ง [ROOT.Char.GetPrimaryTitle.GetNameNoTierNoTooltip] และสายเลือดอันศักดิ์สิทธิ์ของข้า จักเป็นผู้พิทักษ์ที่แท้จริงของดินแดนเหล่านี้"
 major_decisions.4000.a: "สวรรค์จงอำนวยพรแก่ญาติวงศ์ของข้า!"
 major_decisions.4000.b: "นี่คือธงของ #italic เรา#!"
 major_decisions.4000.c: "ข้ายืนต้านตะวันเพื่อมอบร่มเงาแก่ปวงชนของข้า"
 major_decisions.4001.t: "การก่อตั้งจักรวรรดิเวียด"
 major_decisions.4001.desc: "ข่าวคราวจากแดนไกลรายงานการประกาศตนเป็นจักรวรรดิ โดยประกาศให้ [founder.GetFullNameNoTooltip] เป็นผู้ปกครอง หลังจากความพยายามอย่างหนักเพื่อรักษาเอกราชอธิปไตย พวกเขาได้รับความเชี่ยวชาญในการก่อตั้งบ้านเกิดเมืองนอนเพื่อผู้คนของตน\n\nเราคงจักได้เห็นว่าความมั่นคงนี้จะยืนยาวไปได้นานเพียงใด ก่อนที่คู่แข่งอันตรายจะคุกคามด้วยการจับตามองอย่างเป็นปฏิปักษ์"
 major_decisions.4001.a: "ยินดีต้อนรับสู่โต๊ะกลม"
 major_decisions.4001.b: "เพิ่มมาอีกหนึ่ง?"

 #Majapahit
 major_decisions.5000.t: "พิธีกรรมสู่เทวภาวะ"
 major_decisions.5000.desc: "ด้วยการก่อร่างจักรวรรดิของข้า [ritual_guide.GetTitledFirstName] ได้นำข้าไปยังวิหารยามรุ่งอรุณเพื่อสรุปการเดินทางที่กำลังจะมาถึงของเรา\n\n"จักรวาลแห่งเทวภาวะหมุนรอบตัวท่าน [ROOT.Char.GetTitleAsNameNoTooltip] ของข้า ท่านมิใช่ผู้แสวงหาอีกต่อไป แต่เป็นผู้รังสรรค์ ท่านจะบรรลุสิ่งนี้ด้วยการซึมซับเถ้าธุลีแห่งเมอราปี หรือชำระจิตวิญญาณของท่านใต้สายน้ำตกแห่งศรีฤๅไม่?" [ritual_guide.GetSheHe] สรุปด้วยน้ำเสียงที่สงบ\n\nข้าต้องกำหนดเส้นทางสำหรับเหล่าพสกนิกรและตัวข้าเอง"
 major_decisions.5000.a: "ข้าจักต้องเป็นหนึ่งเดียวกับภูเขาเมอราปี พ่นไฟและเถ้าถ่าน!"
 major_decisions.5000.b: "โอม ศรีเสดานา จงผูกพันเราไว้กับจิตวิญญาณแห่งโลก"
 major_decisions.5001.t: "กำเนิดแห่งมัชปาหิต"
 major_decisions.5001.desc: "เหล่าที่ปรึกษาของข้าได้บอกข้าถึงการก่อตั้งจักรวรรดิเกาะแห่ง [founder.GetPrimaryTitle.GetNameNoTierNoTooltip]\n\nแม้ว่าพวกเขาจะอ้างว่า [founder.GetTitleAsNameNoTooltip] นั้นถูกมองโดยผู้คนของ [founder.GetHerHis] ว่าเป็นผู้กอบกู้ศรัทธาและวัฒนธรรมของพวกเขา เรายังมิอาจล่วงรู้ได้ว่าควรคาดหวังสิ่งใดเกี่ยวกับแรงจูงใจของพวกเขาต่อไป\n\nข้าจะรอดูว่าพวกเขาตัดสินใจที่จะเป็นมิตรหรือเป็นศัตรูต่ออาณาเขตของข้า"
 major_decisions.5001.a: "ในตอนนี้ เรามีปัญหาของเราเอง"
 major_decisions.5001.b: "ท้ายที่สุด ก็แค่ผู้ท้าชิงอำนาจอีกคนหนึ่ง"

 #Ryukyu (Ruucuu)
 major_decisions.6000.t: "มรดกสืบทอดแห่งริวกิว"
 major_decisions.6000.desc: ""ชาวเกาะทั้งปวงล้วนสดุดีท่าน, [founder.GetTitleAsNameNoTooltip] ของข้า สาส์นได้ถูกส่งไปยังผู้นำตระกูลทั้งหลาย, เหล่าข้าไพร่ผู้ต่ำต้อยของท่าน, เกี่ยวกับการสถาปนาธงผืนใหม่ของเรา บัลลังก์แห่งริวกิวกำลังรอคอยท่านมาประทับอย่างร้อนรน," [antiquarian.GetTitledFirstName] เอ่ยขึ้น, หลังจากการกล่าวสุนทรพจน์อันยาวเหยียด\n\nการได้เป็น [founder.GetTitleAsNameNoTooltip] นั้นช่างดีนัก, ทว่าเวลาของข้าในโลกนี้มีจำกัด, เช่นเดียวกับเหล่าบุตรของข้า ข้าจักต้องเสริมความแข็งแกร่งและจารึกการปกครองของเราให้เป็นอมตะด้วยมรดกสืบทอดอันจักคงอยู่ไปอีกนับหลายชั่วอายุคน"
 major_decisions.6000.a: "จงสร้างสรรค์สิ่งประดิษฐ์อันเป็นแรงบันดาลใจให้แก่ผู้คนของข้า"
 major_decisions.6000.b: "จงนำวัตถุโบราณมาให้ข้า อันเป็นสัญลักษณ์แห่งอำนาจจักรวรรดิของเรา"
 ryukyu_artifact_regalia_craft_tt: "#italic เครื่องราชกกุธภัณฑ์#! [artifact|E] จะถูกส่งมอบ #bold ภายในหนึ่งปี#!:\n[GetModifier( 'ryukyu_empire_shaku_modifier' ).GetNameWithTooltip]"
 ryukyu_artifact_crown_craft_tt: "#italic มงกุฎ#! [artifact|E] จะถูกส่งมอบ #bold ภายในหนึ่งปี#!:\n[GetModifier( 'ryukyu_empire_crown_modifier' ).GetNameWithTooltip]"
 ryukyu_empire_shaku_modifier: "ชาคุแห่งสามขุนเขา"
 ryukyu_empire_crown_modifier: "มงกุฎแห่งมังกร"

 major_decisions.6001.t: "ชาคุแห่งจักรพรรดิ"
 major_decisions.6001.desc: "ชาคุอันเป็นที่รอคอยมานาน, อันคู่ควรแด่ [ROOT.Char.GetTitleAsNameNoTooltip] ที่แท้จริง ได้ถูกสร้างขึ้นตามข้อกำหนดของข้า มันเหนือความคาดหมายทั้งปวง และย่อมจักเน้นย้ำบทบาทของข้าในฐานะผู้ไกล่เกลี่ยระหว่างอาณาราษฎรและจิตวิญญาณอันศักดิ์สิทธิ์อย่างมิต้องสงสัย\n\nผู้คนของข้าจักมิประสบกับความเกียจคร้านหรือความเศร้าโศก ในขณะที่สร้างจักรวรรดิอันตระการตาของข้า แน่นอนว่า, การทำงานเพื่อจุดประสงค์อันศักดิ์สิทธิ์ เช่นนี้ย่อมขจัดอุปสรรคทั้งปวง"
 major_decisions.6001.a: "เป็นหนึ่งเดียว, เราจักยกสามขุนเขาขึ้นสู่ฟากฟ้า!"

 major_decisions.6002.t: "มงกุฎมังกร"
 major_decisions.6002.desc: "ตามที่ได้ตระเตรียมไว้, [antiquarian.GetTitledFirstName] ถวายมงกุฎองค์ใหม่ของข้า, อันเป็นสัญลักษณ์แห่งความเต็มใจของจักรวรรดิข้าที่จะสำรวจสิ่งเร้นลับ และยืนหยัดอย่างมั่นคงต่อภยันตรายของการนิ่งเฉย\n\nทั่วทั้งโลกหล้าจักได้ประจักษ์และสรรเสริญชาวริวกิวในไม่ช้า, และนามของข้าจักถูกจดจำด้วยความยำเกรงและความรุ่งโรจน์ เหล่าลูกหลานของข้าจักสวมสัญลักษณ์แห่งความกล้าหาญนี้ด้วยความภาคภูมิ และท้าทายเหล่าศัตรูของพวกเขา"
 major_decisions.6002.a: "พลังอำนาจของเราจักดังก้องกังวานไปชั่วนิจนิรันดร์"

 major_decisions.6003.t: "การตื่นขึ้นของชาวริวกิว"
 major_decisions.6003.desc: "ข้าได้ทราบมาว่ามีจักรพรรดิองค์หนึ่งผงาดขึ้นมาจากหมู่เกาะริวกิว, ประกาศอำนาจเหนือที่ราบอันเขียวขจีและขุนเขาในตำนาน, รวบรวมตระกูลต่างๆ ให้อยู่ภายใต้ธงผืนเดียว\n\nมิใช่เรื่องง่ายที่จะยึดเหนี่ยวจักรวรรดิไว้ด้วยกัน, โดยเฉพาะอย่างยิ่งเมื่อทรัพยากรมีจำกัด เราจักคอยเฝ้าดูว่าผลลัพธ์จากเรื่องนี้จะเป็น เช่นไร"
 major_decisions.6003.a: "ควรค่าแก่การยกย่องสำหรับจุดเริ่มต้นอันต่ำต้อย เช่นนั้น"
 major_decisions.6003.b: "ถึงกระนั้น, ข้าก็หาได้ประทับใจไม่"

 #Siam
 major_decisions.7000.t: "รุ่งอรุณแห่งความสุข"
 major_decisions.7000.desc: "ขณะที่ข้าเดินเข้าสู่ห้องโถง, กลิ่นกำยานตลบอบอวลในอากาศ, และเสียงฆ้องสัมฤทธิ์ดังก้องไปทั่วพื้นที่, ประกาศการมาถึงของข้า เหล่าสมาชิกสภาและอาลักษณ์หลวงทักทายข้าจากบัลลังก์เตี้ยของพวกเขา\n\nหลังจากแลกเปลี่ยนถ้อยคำทักทายตามพิธีการ, สมาชิกสภาหลายคนเสนอคำแนะนำเกี่ยวกับลำดับความสำคัญของความเป็นกษัตริย์ของข้า: การเลือกด้านการลงทุนที่จะกำหนดมรดกของชาวไท\n\nขณะที่พวกเขาไม่สามารถหาข้อสรุปได้, ข้าจึงเริ่มรวบรวมความคิดสุดท้ายของข้าเกี่ยวกับเรื่องนี้"
 major_decisions.7000.a: "เราควรสนับสนุนโรงผลิตเครื่องปั้นดินเผาสังคโลกแห่ง [kingdom_capital.GetNameNoTier]"
 major_decisions.7000.b: "เหล่านักรบของเราสมควรได้รับสิ่งที่ดีกว่านี้ หากเราปรารถนาที่จะอยู่เหนือคู่แข่งของเรา"
 major_decisions.7000.c: "การส่งเสริมคุณค่าของชาวไทควรเป็นความพยายามอย่างต่อเนื่องของข้า"
 siam_kingdom_sangkhalok_workshops_county_modifier: "โรงผลิตสังคโลกที่ได้รับการสนับสนุน"
 siam_kingdom_sangkhalok_workshops_province_modifier: "การค้าสังคโลกที่เฟื่องฟู"
 siam_kingdom_military_modifier: "พื้นที่ทหารที่ได้รับทุน"
 siam_kingdom_culture_modifier: "วัฒนธรรมอันเรืองรอง"

 major_decisions.7001.t: "การผงาดขึ้นของชาวไท"
 major_decisions.7001.desc: "ลึกเข้าไปในป่าลึก, ที่ ซึ่งบางคนรู้จักในนามสุวรรณภูมิ, [founder.GetNameNoTierNoTooltip] ได้ขึ้นสู่อำนาจในฐานะ [founder.GetTitleAsNameNoTooltip] แห่ง [founder.GetPrimaryTitle.GetNameNoTierNoTooltip] และท้าทายชะตากรรมของผู้คนของ [founder.GetHerHis]\n\nชาวไทใช้เวลาหลายปีในการค้นหาบ้านเกิด, ร่อนเร่ด้วยความภาคภูมิในฐานะชนร่อนเร่ของภูมิภาค และค่อยๆ เดินทางลงใต้\n\nอิทธิพลของพวกเขาจะคงอยู่ผ่านกาลเวลาหรือไม่?"
 major_decisions.7001.a: "อีกหนึ่งรายที่ถูกโยนเข้าไปในพายุเฮอริเคน"
 major_decisions.7001.b: "พวกเขาเป็นภัยคุกคามต่อเรารึ? เราจะได้เห็นกัน"

 #Brunei Kingdom
 major_decisions.8000.t: "ดินแดนแห่งสันติสุข"
 major_decisions.8000.desc: "[imam.GetTitledFirstName] ผู้ ซึ่งจะเป็นผู้นำการละหมาดวันศุกร์ที่จะถึงนี้ เตือนข้าถึงธรรมเนียมการเตรียมคุฏบะห์ในนามของ [founder.GetTitleAsNameNoTooltip] นอกเหนือจากบทสวดและโองการที่จำเป็นแล้ว [imam.GetSheHe] ถามข้าเกี่ยวกับส่วนที่จะต้องอ่านให้บรรดาผู้ศรัทธาฟังเพื่อประกาศอำนาจอธิปไตยและการปกครองของข้าที่มีต่อพวกเขา"
 major_decisions.8000.a: "จงแจ้งให้พวกเขาทราบถึงวีรกรรมของ [founder.GetTitleAsNameNoTooltip] ของพวกเขา"
 major_decisions.8000.b: "การสรรเสริญทั้งมวลเป็นสิทธิ์ของอัลลอฮ์เท่านั้น"
 brunei_kingdom_khutbah_prestige_option_modifier: "ผู้พิทักษ์ประชาคมมุสลิม"
 brunei_kingdom_khutbah_piety_option_modifier: "แสงสว่างแห่งประชาคมมุสลิม"

 #Brunei Empire
 major_decisions.9000.t: "ของขวัญแห่งการขึ้นครองราชย์ของจักรพรรดิ"
 major_decisions.9000.desc: "ด้วยรากฐานจากประเพณีอิสลามของเรา เป็นที่คาดหวังในฐานะ [founder.GetTitleAsNameNoTooltip] ที่จะมอบสิ่งตอบแทนแก่นักรบผู้ได้รับพร นักเดินทางในดินแดนของข้า และผู้ยากไร้ ด้วยเหรียญกษาปณ์ที่เพิ่งผลิตใหม่ในนามของข้า"
 major_decisions.9000.desc_steward: "\n\n[ROOT.Char.GetCouncillorPosition('councillor_steward').GetPositionName] ของข้า [steward.GetTitledFirstName] กำลังถามถึงระดับความเอื้อเฟื้อที่ข้าเต็มใจจะมอบให้แก่ราษฎรผู้ภักดี ในฐานะผู้ปกป้องของพวกเขา"
 major_decisions.9000.a: "ให้ผู้ศรัทธาล่วงรู้ถึงความเอื้อเฟื้อของ [founder.GetTitleAsNameNoTooltip] ของพวกเขา!"
 major_decisions.9000.b: "ขออัลลอฮ์ทรงตอบรับซอดาเกาะห์ของเรา"
 brunei_empire_high_sadaqah_modifier: "แจกจ่ายซอดาเกาะห์อย่างเหลือเฟือ"
 brunei_empire_low_sadaqah_modifier: "แจกจ่ายซอดาเกาะห์"
