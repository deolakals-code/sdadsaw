l_english: 
# Restoring Roman Empire as Byzantium, by Henrik Thyrwall & Flavio Verna
 roman_restoration.0001.t:0 "รุ่งอรุณแห่งยุคใหม่"
 roman_restoration.0001.desc.intro:0 "สหาย ชาวโรมัน เพื่อนร่วมชาติ จงเงี่ยหูฟังข้าเถิด!\n\nหลังจากการฟื้นฟูดินแดนที่สูญหายไปเมื่อหลายศตวรรษก่อนอย่างน่าอัศจรรย์ จักรวรรดิโรมันได้ถือกำเนิดขึ้นใหม่แล้ว! ยุโรปได้อดทนต่อช่วงเวลาอันมืดมนนับตั้งแต่พวกอนารยชนบุกโจมตีพรมแดนของจักรวรรดิ แต่บัดนี้ยุคใหม่ที่สดใสได้เริ่มต้นขึ้นแล้วสำหรับอารยธรรมทั้งปวง"
 roman_restoration.0001.desc.greeks:0 "\n\nรัฐโรมันจะไม่ถูกเรียกขานว่าเป็น "จักรวรรดิแห่งชาวกรีก" โดยผู้อ้างสิทธิ์อันอิจฉาในตะวันตกอีกต่อไป แต่จะได้รับการยอมรับว่าเป็นทายาทที่แท้จริงแห่งมรดกของโรม"
 roman_restoration.0001.desc.other:0 "\n\nในที่ ซึ่งผู้อ้างสิทธิ์ชาวกรีกนับไม่ถ้วนล้มเหลว ต้องใช้ [scoped_emperor.GetCulture.GetName] เพียงคนเดียวจึงจะสำเร็จ ฟื้นฟู "จักรวรรดิแห่งชาวกรีก" ที่ล้มเหลว"
 roman_restoration.0001.desc.christians:0 "จักรวรรดิโรมัน (Imperium Romanum) ยืนหยัดอย่างแข็งแกร่งอีกครั้ง ฟื้นคืนสู่ความรุ่งโรจน์ในอดีตภายใต้การปกครองอันรู้แจ้งของข้า พร้อมที่จะเผยแพร่อารยธรรม ความปลอดภัย และแสงสว่างอันศักดิ์สิทธิ์แห่งพระเจ้าของเราไปยังทุกมุมของโลกที่รู้จัก เพื่อวุฒิสภาและประชาชนแห่งโรม!"
 roman_restoration.0001.desc.hellenics:0 "จักรวรรดิโรมัน (Imperium Romanum) ยืนหยัดอย่างแข็งแกร่งอีกครั้ง ฟื้นคืนสู่ความรุ่งโรจน์และศาสนาในอดีตภายใต้การปกครองอันรู้แจ้งของข้า \n\nกองทัพลีเจียนใหม่จะเดินทัพไปยังจังหวัดที่เหลือ ซึ่งยังคงปฏิเสธอำนาจอธิปไตยของจักรวรรดิใหม่นี้ และสร้างสันติภาพโรมัน (สันติภาพโรมัน) ใหม่ขึ้นจากช่วงเวลาอันมืดมนเหล่านี้ เพื่อวุฒิสภาและประชาชนแห่งโรม!"
 roman_restoration.0001.desc.fallback: "จักรวรรดิโรมัน (Imperium Romanum) ยืนหยัดอย่างแข็งแกร่งอีกครั้ง ฟื้นคืนสู่ความรุ่งโรจน์ในอดีตภายใต้การปกครองอันรู้แจ้งของข้า พร้อมที่จะเผยแพร่อารยธรรม ความปลอดภัย และความรักของ [ROOT.Char.GetFaith.HighGodName] ไปยังทุกมุมของโลกที่รู้จัก เพื่อวุฒิสภาและประชาชนแห่งโรม!"
 roman_restoration.0001.a:0 "จงคงอยู่ชั่วนิรันดร์!"
 roman_restoration.0002.t:0 "ยุคที่สองแห่งโรม"
 roman_restoration.0002.desc:0 "ชาวไบแซนไทน์ ซึ่งก่อนหน้านี้ถูกเรียกขานว่าเป็น "จักรวรรดิแห่งชาวกรีก" โดยหลายคนในตะวันตก ได้จัดการทวงคืนดินแดนที่สูญหายไปได้มากพอที่จะประกาศฟื้นฟูจักรวรรดิโรมัน!"
 roman_restoration.0002.desc.christians:0 "\n\nไม่อาจปฏิเสธได้อีกต่อไปว่าพวกเขาคือผู้สืบทอดที่แท้จริงของโรมและมรดกอันรุ่งโรจน์ ยุคใหม่มาถึงแล้ว"
 roman_restoration.0002.desc.hellenics:0 "\n\nน่าประหลาดใจยิ่งกว่านั้น จักรวรรดิโรมันใหม่นี้ได้ปฏิเสธศาสนาคริสต์และหันไปนับถือเทพเจ้าเพแกนในอดีต! หากไม่หยุดยั้งในไม่ช้า กระแสคลื่นแห่งลัทธินอกรีตใหม่นี้อาจคุกคามการอยู่รอดของศาสนาคริสต์ได้!"
 roman_restoration.0002.a:0 "เป็นความจริงได้หรือ?"
 roman_restoration.0002.b:0 "แต่... แล้วจักรวรรดิของข้าเล่า?"
 roman_restoration.0002.c:0 "จุดจบใกล้เข้ามาแล้ว!"
 roman_restoration.0002.d:0 "ข้าจะหยุดยั้งพวกเขา!"
 roman_restoration.0002.e:0 "ข้าเข้าใจแล้ว..."

# Restoring Roman Empire as HRE, by Flavio Verna
 roman_restoration.0003.t:0 "ศักดิ์สิทธิ์และโรมัน"
 roman_restoration.0003.desc.greeks:0 "ช่างน่าขันที่จักรวรรดิ ซึ่งครั้งหนึ่งเคยถูกชาวไบแซนไทน์ป้ายสีว่าเป็นผู้อ้างสิทธิ์อันป่าเถื่อน จะถูกนำไปสู่ความรุ่งโรจน์ชั่วนิรันดร์ภายใต้การนำของชาวกรีก...\n\n"
 roman_restoration.0003.desc.other:0 ""
 roman_restoration.0003.desc:1 "ความฝันของชาร์เลอมาญได้สำเร็จลุล่วงแล้วด้วยการกระทำอันกล้าหาญของข้า จักรวรรดิโรมันอันศักดิ์สิทธิ์ได้ผงาดขึ้นสู่ตำแหน่งอันชอบธรรมในฐานะผู้สืบทอดที่แท้จริงของโรม อ้างสิทธิ์ปกครองทั้งตะวันออกและตะวันตก \n\nนี่คือจุดเริ่มต้นของยุคใหม่แห่งสันติภาพและความเจริญรุ่งเรืองสำหรับ [ROOT.Char.GetFaith.GetAdherentNamePluralNoTooltip] ทุกหนแห่ง กองทัพลีเจียนอันศักดิ์สิทธิ์ของจักรวรรดินี้จะเผยแพร่สารอันศักดิ์สิทธิ์แห่งพระเจ้าของเราไปยังทุกมุมโลกจนกว่าคริสตจักรสากลที่แท้จริงจะได้รับการสถาปนา เพื่อ [ROOT.Char.GetFaith.HighGodName|U] และ [scoped_emperor.GetTitleTierName] แห่งโรม!"
 roman_restoration.0003.a:0 "จงคงอยู่ชั่วนิรันดร์!"
 roman_restoration.0004.t:0 "ศักดิ์สิทธิ์และโรมัน"
 roman_restoration.0004.desc.byzantines:0 "เรื่องที่ไม่น่าเชื่อได้เกิดขึ้นแล้ว! ผู้อ้างสิทธิ์แห่งตะวันตกได้กรุยทางอันนองเลือดในจังหวัดทางตะวันออกและยึดครองดินแดนใจกลางของจักรวรรดิอันรุ่งโรจน์ของเรา\n\nหลังจากฟื้นฟูจังหวัดโบราณส่วนใหญ่ภายใต้การปกครองของ [scoped_emperor.GetHerHis] [scoped_emperor.GetTitledFirstName] ได้ประกาศฟื้นฟูจักรวรรดิโรมันภายใต้การนำอันป่าเถื่อนของ [scoped_emperor.GetHerHis]"
 roman_restoration.0004.desc.others:1 "นับตั้งแต่ชาร์เลอมาญได้รับการสวมมงกุฎโดยพระสันตะปาปาลีโอที่ 3 จักรวรรดิแห่งชาวกรีกมองด้วยความดูถูกต่อสิ่งที่เรียกว่าผู้อ้างสิทธิ์ในตะวันตก ทว่า [scoped_emperor.GetTitledFirstName] ได้บรรลุสิ่งที่เป็นไปไม่ได้: การฟื้นฟูพรมแดนตะวันออกและตะวันตกจากสมัยโบราณ\n\nจักรวรรดิใหม่นี้ ซึ่งหล่อหลอมขึ้นภายใต้แสงสว่างอันศักดิ์สิทธิ์ของ [scoped_emperor.GetFaith.HealthGodName] ยืนหยัดในฐานะจักรวรรดิโรมัน (Imperium Romanum) ที่แท้จริงเพียงหนึ่งเดียว พร้อมที่จะนำระเบียบมาสู่โลกอันมืดมน"
 roman_restoration.0004.a:0 "เป็นไปได้อย่างไร...?"
 roman_restoration.0004.b:0 "พวกเขายังคงเป็นผู้อ้างสิทธิ์!"

# New Emperor becomes Augustus, by Flavio Verna
 roman_restoration.0005.t:0 "ออกัสตัส"
 roman_restoration.0005.desc.regular:0 "ได้รับการแซ่ซ้องจากวุฒิสภาและกองทัพ ข้าได้รับการยอมรับว่าเป็นผู้ปกครองโดยชอบธรรมของจักรวรรดิโรมันที่ฟื้นฟูขึ้นใหม่ \n\nไม่มีเกียรติยศหรือความรับผิดชอบใดยิ่งใหญ่ไปกว่านี้ที่จะมอบให้กับ [ROOT.Char.GetWomanMan] เพียงคนเดียว ข้าต้องแน่ใจว่าดำเนินชีวิตตามความคาดหวังของไพร่ฟ้าข้าแผ่นดินหากข้าปรารถนาที่จะอยู่ในอำนาจต่อไปนานๆ"
 roman_restoration.0005.desc.holy:0 "ได้รับการแซ่ซ้องจากคณะสงฆ์ [ROOT.Char.GetFaith.GetAdjective] และกองทัพ ข้าได้รับการยอมรับว่าเป็นผู้ปกครองโดยชอบธรรมของจักรวรรดิโรมันที่ฟื้นฟูขึ้นใหม่ \n\nด้วยพระคุณของ [ROOT.Char.GetFaith.HighGodName] ข้าจะสามารถปกครองอย่างยุติธรรมและเป็นเวลายาวนาน"
 roman_restoration.0005.a:0 "ไชโย ซีซาร์!"

# Old Emperor loses Augustus, by Flavio Verna
 roman_restoration.0006.t:0 "จักรพรรดิองค์ใหม่"
 roman_restoration.0006.desc:0 "ด้วยการสูญเสียความชอบธรรมทั้งหมด ข้าไม่สามารถอ้างสิทธิ์ในตำแหน่งออกัสตัสได้อีกต่อไป บัดนี้จักรวรรดิเป็นของ [new_holder.GetTitledFirstName]"
 roman_restoration.0006.a:0 "ข้าจะกลับมา!"

# Old Roman Provinces are Restored, by Henrik Thyrwall & Flavio Verna
 roman_restoration.0010.t:0 "จังหวัดซีเรียปาเลสไตน์"
 roman_restoration.0010.desc:0 "จังหวัดซีเรียปาเลสไตน์โบราณทั้งหมดได้รับการปลดปล่อยจากเงื้อมมืออันชั่วร้ายของพวกอนารยชนและฟื้นฟูสู่จักรวรรดิโรมัน (Imperium Romanum) ในที่สุด จะมีการจัดงานเฉลิมฉลองชัยชนะอันยิ่งใหญ่เพื่อวีรบุรุษผู้กล้าหาญที่บรรลุความสำเร็จนี้ ขอให้ชื่อของพวกเขาสะท้อนก้องไปชั่วนิรันดร์!"
 roman_restoration.0010.a:0 "จักรวรรดิจงเจริญ!"
 roman_restoration.0011.t:0 "จังหวัดอียิปตัส"
 roman_restoration.0011.desc:0 "ช่วงเวลาอันมืดมนสิ้นสุดลงแล้วสำหรับชาวอียิปตัส เมื่อการปกครองของโรมันได้ฟื้นคืนสู่จังหวัดอีกครั้ง ดินแดนแห่งฟาโรห์เคยทำหน้าที่เป็นอู่ข้าวอู่น้ำของจักรวรรดิเก่า และจะกลายเป็นรากฐานสำคัญในการสร้างความเจริญรุ่งเรืองอย่างต่อเนื่องของรัฐโรมันอันรุ่งโรจน์อีกครั้ง"
 roman_restoration.0012.t:0 "จังหวัดไซเรไนกา"
 roman_restoration.0012.desc:0 "พลเมืองแห่งไซเรไนกาสามารถชื่นชมยินดีได้ เมื่อกฎหมายโรมันได้รับการบังคับใช้อีกครั้งในดินแดนอันแห้งแล้งนี้ จังหวัดโรมันโบราณอีกแห่งได้กลับคืนสู่อ้อมอกของจักรวรรดิที่ยิ่งใหญ่ที่สุดเท่าที่โลกอารยะเคยเห็นมา ขออย่าให้ต้องทนทุกข์ทรมานจากการสัมผัสอันโหดร้ายของพวกอนารยชนอีกเลย"
 roman_restoration.0013.t:0 "จังหวัดแอฟริกา"
 roman_restoration.0013.desc:0 "อินทรีทองคำแห่งโรมส่องประกายอีกครั้งเหนืออดีตจังหวัดแอฟริกาของโรมัน ดัง เช่นเมื่อหลายศตวรรษก่อน กองทหารของจักรวรรดิกำลังเดินทัพผ่านนครคาร์เธจ ศัตรูคู่อาฆาตโบราณของโรม เป็นข้อพิสูจน์ที่ชัดเจนว่าประวัติศาสตร์ซ้ำรอยจริงๆ"
 roman_restoration.0014.t:0 "จังหวัดอิลลิริคุม"
 roman_restoration.0014.desc:0 "อดีตจังหวัดอิลลิริคุมของโรมันได้รับการฟื้นฟูคืนสู่เจ้าของโดยชอบธรรมในจักรวรรดิโรมัน (Imperium Romanum) ที่ฟื้นคืนชีพอีกครั้ง ด้วยชายฝั่งตะวันออกของทะเลเอเดรียติกที่มั่นคง แหล่งเกณฑ์ทหารที่สำคัญนี้อาจพิสูจน์ได้ว่ามีความสำคัญอย่างยิ่งในแคมเปญในอนาคตเพื่อทวงคืนพรมแดนที่เหมาะสมของโรมทางตะวันตก"
 roman_restoration.0015.t:0 "จังหวัดอิตาเลีย"
 roman_restoration.0015.desc:0 "เป็นครั้งที่สองนับตั้งแต่การล่มสลายของจักรวรรดิตะวันตก อิตาลีได้รับการปลดปล่อยและฟื้นฟูสู่การปกครองของโรมันที่เหมาะสม — หวังว่าจะเป็นการถาวรในครั้งนี้ นครโรมอันยิ่งใหญ่เองก็อยู่ภายใต้การควบคุมของข้าแล้ว และแม้ แต่ทหารที่แข็งกร้าวก็ยังหลั่งน้ำตาเมื่อธงชัยของจักรวรรดิโบกสะบัดในสายลมจากเสาตราจัน"
 roman_restoration.0016.t:0 "จังหวัดกัลลิอา"
 roman_restoration.0016.desc:0 "กอล ซึ่งคิดกันมานานว่าสูญเสียไปจากการปกครองของโรมันตลอดกาล ได้ยอมจำนนต่อโรมและถูกรวมกลับเข้าสู่จักรวรรดิ จังหวัดนี้เปลี่ยนแปลงไปมากนับตั้งแต่ซีซาร์ทำศึกในดินแดนนี้เมื่อกว่าพันปีก่อน แต่จะไม่ต้องทนทุกข์ภายใต้การปกครองของกษัตริย์ที่ตั้งตนขึ้นเองหรือจักรพรรดิจอมปลอมอีกต่อไป"
 roman_restoration.0017.t:0 "จังหวัดแกร์มานิอา"
 roman_restoration.0017.desc:0 "บัดนี้จักรวรรดิโรมันได้ขยายพรมแดนเกินกว่าที่เคยอ้างสิทธิ์แม้ภายใต้ [GetScriptedCharacterByHistoryID( '145279' ).GetFirstName] ผู้ยิ่งใหญ่ แกร์มานิอา ซึ่งเป็นหายนะของกองทัพโรมันมาโดยตลอด ในที่สุดก็ได้รับการสยบและรวมเข้ากับจักรวรรดิ บัดนี้จะถูกปกครองโดยผู้สืบทอดที่แท้จริงของรัฐโรมัน — ไม่ใช่จักรวรรดิจอมปลอมที่แสร้งทำเป็น เช่นนั้น"
 roman_restoration.0018.t:0 "จังหวัดบริตันนิอา"
 roman_restoration.0018.desc:0 "ถูกทอดทิ้งอย่างโหดร้ายให้อยู่ตามลำพังเมื่อกองทหารโรมันละทิ้งจังหวัดบริตันนิอาในศตวรรษที่ 5 ในที่สุดชาวบริตันก็สามารถชื่นชมยินดีได้ เพราะหลังจากทนทุกข์ทรมานมาหลายศตวรรษแห่งความมืดมน ในที่สุดการปกครองของโรมันก็ได้รับการฟื้นฟูสู่เกาะเล็กๆ ของพวกเขา และพวกเขาก็อาจถือว่าตนเองเป็นไพร่ฟ้าข้าแผ่นดินของจักรวรรดิอีกครั้ง"
 roman_restoration.0019.t:0 "จังหวัดฮิสปานิอา"
 roman_restoration.0019.desc:0 "อำนาจและอิทธิพลของจักรวรรดิโรมันบัดนี้แผ่ขยายไปถึงอดีตจังหวัดฮิสปานิอาอีกครั้ง ดินแดนนี้ได้รับความทุกข์ทรมานอย่างมากจากการปะทะกันตามแนวชายแดนอย่างต่อเนื่องโดยขุนนางมุสลิมและคาทอลิกที่ทะเลาะวิวาทกัน แต่บัดนี้อาจได้รู้จักสันติภาพอีกครั้งเมื่อสันติภาพโรมัน (สันติภาพโรมัน) ปกคลุมคาบสมุทร"
 roman_restoration.0020.t:0 "จังหวัดมอเรตานิอา"
 roman_restoration.0020.desc:0 "แม่ทัพผู้ยิ่งใหญ่ เบลิซาริอุส ได้ยึดคืนส่วนต่างๆ ของมอเรตานิอาจากพวกแวนดัลป่าเถื่อนในศตวรรษที่ 6 แต่ในที่สุดก็สูญเสียทั้งหมดให้กับชาวอาหรับในการรุกคืบอย่างไม่หยุดยั้งข้ามแอฟริกาเหนือ บัดนี้เมื่อเคาน์ตีนี้ได้รับการฟื้นฟูสู่การควบคุมของโรมันอย่างสมบูรณ์หลังจากหลายศตวรรษแห่งการปกครองที่ผิดพลาด ก็อาจเจริญรุ่งเรืองได้อีกครั้ง"
 roman_restoration.0021.t:0 "จังหวัดเมโสโปเตเมีย"
 roman_restoration.0021.desc:0 "จักรพรรดิตราจันพิชิตเมโสโปเตเมียจากจักรวรรดิพาร์เธียและจัดตั้งเป็นจังหวัดของโรมัน แต่ถูกละทิ้งโดยผู้สืบทอดตำแหน่งของพระองค์ จักรพรรดิเฮเดรียน เพียงไม่กี่ปีต่อมา บัดนี้แม่น้ำยูเฟรติสและไทกริสอยู่ภายใต้การอุปถัมภ์ของโรมันอีกครั้ง และครั้งนี้อาจจะอยู่ต่อไป"
 roman_restoration.0022.t:0 "จังหวัดคาเลโดเนีย"
 roman_restoration.0022.desc:0 "บัดนี้พรมแดนของโรมได้รุกหน้าไปไกลเกินซากปรักหักพังโบราณของทั้งกำแพงเฮเดรียนและกำแพงอันโตนิน จนในที่สุดก็รวมคาเลโดเนียทั้งหมดไว้ด้วย ดินแดนที่แข็งกระด้างและไม่น่าให้อภัยนี้เป็นบ้านของผู้คนสายพันธุ์แปลกประหลาด แต่พวกเขาก็จะถูกเปลี่ยนให้เป็นพลเมืองโรมันที่มีประสิทธิผล"
 roman_restoration.0023.t:0 "จังหวัดฮิเบอร์เนีย"
 roman_restoration.0023.desc:0 "เกาะฮิเบอร์เนียเป็นส่วนเพิ่มเติมล่าสุดในอาณาเขตที่ขยายตัวอย่างต่อเนื่องของจักรวรรดิโรมัน ดินแดนแห่งเนินเขาที่ลาดเอียงเบาๆ และทุ่งหญ้าสีเขียวนี้ไม่เคยถูกพิชิตโดยจักรวรรดิเก่า แต่มันควรจะกลายเป็นศักดินาที่น่าปกครองหากไม่คำนึงถึงฝนหรือผู้ตั้งถิ่นฐานชาวนอร์สที่มีกลิ่นเหม็นตามแนวชายฝั่ง"
 roman_restoration.0024.t:1 "พรมแดนจักรวรรดิฟื้นฟู"
 roman_restoration.0024.desc.intro:0 "เรื่องราวการฟื้นตัวอันรุ่งโรจน์ของจักรวรรดิโรมันจะถูกเล่าขานไปตลอดกาล ผู้โชคร้ายที่ต้องมีชีวิตอยู่ในช่วงวันอันมืดมนเมื่อพวกอนารยชนปล้นสะดมกรุงโรมตามอำเภอใจ หรือผู้รุกรานชาวอาหรับกวาดล้างเข้ามาจากทะเลทราย คงไม่กล้าฝันถึงวันนี้ จังหวัดเก่าแก่ทั้งหมดได้รับการทวงคืน และบัดนี้จักรวรรดิแผ่ขยายไปไกลกว่าที่เป็นมาเกือบพันปี"
 roman_restoration.0024.desc.christian:0 "\n\nระฆังโบสถ์ทั่วยุโรปกำลังดังขึ้นเพื่อเฉลิมฉลองโอกาสอันสำคัญนี้ และชายหญิงทั้งในโรมและคอนสแตนติโนเปิลต่างหลั่งน้ำตาแห่งความปิติยินดี เพื่อประโยชน์ของมวลมนุษยชาติ สันติภาพโรมัน (สันติภาพโรมัน) ใหม่จะต้องคงอยู่ต่อไป มิฉะนั้นโลกจะดำดิ่งสู่ยุคมืดแห่งความไม่รู้และความป่าเถื่อนอีกครั้ง ปราศจากแสงนำทางของโรม"
 roman_restoration.0024.desc.hellenic:0 "\n\nโดยการสลัดทิ้งน้ำหนักของเทพเจ้าที่ตายแล้วแห่งชาวกาลิลี และกลับมานับถือเทพเจ้าโอลิมปัสอีกครั้ง จักรวรรดิของซีซาร์และออกัสตัสได้ฟื้นคืนชีพจากเถ้าถ่าน เพื่อประโยชน์ของมวลมนุษยชาติ สันติภาพโรมัน (สันติภาพโรมัน) ใหม่จะต้องคงอยู่ต่อไป มิฉะนั้นโลกจะดำดิ่งสู่ยุคมืดแห่งความไม่รู้และความป่าเถื่อนอีกครั้ง ปราศจากแสงนำทางของโรม"
 roman_restoration.0024.desc.fallback:0 "\n\nผู้คนนับไม่ถ้วนจากทุกเชื้อชาติและลัทธิทั่วยุโรปกำลังเฉลิมฉลองโอกาสอันสำคัญนี้ และชายหญิงทั้งในโรมและคอนสแตนติโนเปิลต่างหลั่งน้ำตาแห่งความปิติยินดี เพื่อประโยชน์ของมวลมนุษยชาติ สันติภาพโรมัน (สันติภาพโรมัน) ใหม่จะต้องคงอยู่ต่อไป มิฉะนั้นโลกจะดำดิ่งสู่ยุคมืดแห่งความไม่รู้และความป่าเถื่อนอีกครั้ง ปราศจากแสงนำทางของโรม"

# Schism is mended, by Henrik Thyrwall & Flavio Verna
 roman_restoration.0100.t:0 "มหาศาสนเภทได้รับการเยียวยา"
 roman_restoration.0100.desc.intro:1 "ในที่สุด มหาศาสนเภทก็ได้รับการเยียวยาแล้ว"
 roman_restoration.0100.desc.orthodox:0 "\n\nบิชอปผู้หยิ่งยโสในโรมจะไม่สามารถอ้างสิทธิ์ความเป็นใหญ่โดยมิชอบเหนือเพื่อนร่วมตำแหน่งได้อีกต่อไป โดยเพิกเฉยหรือฝ่าฝืนคำสั่งตามบัญญัติศาสนาอย่างเปิดเผย ด้วยการรวมศูนย์อำนาจของปัญจาธิปไตย (Pentarchy) ภายใต้การปกครองของจักรวรรดิออร์โธดอกซ์ ความเชื่อคาทอลิกจึงมีอิทธิพลน้อยลงต่อผู้คนในยุโรป \n\nเป็นเพียงเรื่องของเวลาก่อนที่คนส่วนน้อยที่ยังคงยึดติดกับพิธีกรรมที่ล้าสมัยและนอกรีตจะถูกนำเข้ามาสู่คริสตจักรสากลที่แท้จริง"
 roman_restoration.0100.desc.catholic:0 "\n\nการต่อสู้ยาวนานหลายศตวรรษของสถาบันสันตะปาปาเพื่อยืนยันความเป็นใหญ่เหนือปัญจาธิปไตย (Pentarchy) ได้สิ้นสุดลงแล้ว ด้วยการรวมศูนย์อำนาจของที่นั่งดั้งเดิมภายใต้การปกครองของคาทอลิก คณะสงฆ์ออร์โธดอกซ์ถูกบังคับให้ยอมจำนนต่ออำนาจที่ไม่อาจปฏิเสธได้ของบัลลังก์แห่งนักบุญเปโตร \n\nคนส่วนน้อยในหมู่พวกเขาที่ยังคงยึดติดกับพิธีกรรมที่ล้าสมัยและนอกรีตจะถูกนำเข้ามาสู่คริสตจักรสากลที่แท้จริงในไม่ช้า ไม่ทางใดก็ทางหนึ่ง"
 roman_restoration.0100.desc.generic:0 "\n\nด้วยปัญจาธิปไตย (Pentarchy) อยู่ภายใต้การควบคุมของ [mending_faith.GetAdjective] อย่างมั่นคง ในเหตุการณ์ที่ไม่คาดฝัน ทั้งพระสันตะปาปาในโรมและอัครบิดรแห่งคอนสแตนติโนเปิลไม่สามารถปฏิเสธความเป็นใหญ่ของ [mending_faith.GetName] เหนือสาขาอื่นๆ ของศาสนาคริสต์ได้อีกต่อไป"
 roman_restoration.0100.a:0 "คริสตจักรสากลได้รับการฟื้นฟูแล้ว!"
 roman_restoration.0101.desc.intro:0 "มหาศาสนเภทที่รบกวนศาสนาคริสต์มานานได้สิ้นสุดลงแล้ว"
 roman_restoration.0101.desc.orthodox:0 "\n\nหลังจากการพิชิตที่นั่งสากลทั้งหมดของปัญจาธิปไตย (Pentarchy) ดั้งเดิมโดย [scoped_emperor.GetTitledFirstName] ศาสนจักรออร์โธดอกซ์สามารถบังคับให้โลกคาทอลิกส่วนใหญ่ยอมรับอำนาจของตนในฐานะสาขาที่ถูกต้องตามกฎหมายเพียงหนึ่งเดียวของศาสนาคริสต์ ชนชั้นสูงวาติกันที่ทุจริตถูกบังคับให้ลี้ภัย และผู้สนับสนุนของพวกเขาก็ลดน้อยลงทุกวัน"
 roman_restoration.0101.desc.catholic:0 "\n\nหลังจากการพิชิตที่นั่งสากลทั้งหมดของปัญจาธิปไตย (Pentarchy) ดั้งเดิมโดย [scoped_emperor.GetTitledFirstName] สันตะสำนัก (Holy See) ได้บรรลุความทะเยอทะยานอันยาวนานในการถอนรากถอนโคนศาสนจักรออร์โธดอกซ์และกลายเป็นสาขาที่ถูกต้องตามกฎหมายเพียงหนึ่งเดียวของศาสนาคริสต์ ด้วยอัครบิดรถูกบังคับให้ลี้ภัยและนักเทววิทยาออร์โธดอกซ์ที่มีชื่อเสียงจำนวนมากยอมจำนนต่ออำนาจของบัลลังก์แห่งนักบุญเปโตร ศาสนาออร์โธดอกซ์อาจจะค่อยๆ เลือนหายไปในไม่ช้า"
 roman_restoration.0101.desc.generic:0 "\n\nหลังจากการพิชิตที่นั่งสากลทั้งหมดของปัญจาธิปไตย (Pentarchy) ดั้งเดิมโดย [scoped_emperor.GetTitledFirstName] ศาสนจักร [mending_faith.GetAdjective] ได้บังคับทางของตนให้กลายเป็นสาขาที่ถูกต้องตามกฎหมายเพียงหนึ่งเดียวของศาสนาคริสต์ในสายตาของหลายคน ด้วยทั้งสถาบันสันตะปาปาและอัครบิดรสากลถูกถอนรากถอนโคนจากที่นั่งอำนาจดั้งเดิม ผู้ติดตามออร์โธดอกซ์และคาทอลิกจำนวนมากกำลังแห่กันไปที่คริสตจักรสากลใหม่"
 roman_restoration.0101.a:0 "หากลมกำลังพัดไปทางนี้..."
 roman_restoration.0101.b:0 "พวกนอกรีต! ทั้งหมดเลย!"
 roman_restoration.0102.a:0 "ข่าวที่น่ากังวล..."

# Restored Patriarchate Events, by Henrik Thyrwall & Flavio Verna
 roman_restoration.0104.t:0 "อัครบิดรแห่งอันทิโอก"
 roman_restoration.0104.desc:0 "เมื่อนครกลับมาอยู่ภายใต้การควบคุมของโรมัน อัครบิดรแห่งอันทิโอกได้รับการฟื้นฟูอย่างเหมาะสมในฐานะหนึ่งในที่นั่งของบิชอปแห่งปัญจาธิปไตย (Pentarchy) ในศาสนจักรออร์โธดอกซ์ตะวันออก เดิมก่อตั้งโดยนักบุญเปโตรอัครทูต ซึ่งถือเป็นพระสันตะปาปาองค์แรกโดยศาสนจักรคาทอลิกตะวันตก"
 roman_restoration.0104.a:0 "สรรเสริญพระเจ้า!"
 roman_restoration.0105.t:0 "อัครบิดรแห่งเยรูซาเลม"
 roman_restoration.0105.desc:0 "เมื่อนครกลับมาอยู่ภายใต้การควบคุมของโรมัน อัครบิดรแห่งเยรูซาเลมได้รับการฟื้นฟูอย่างเหมาะสมในฐานะหนึ่งในที่นั่งของบิชอปแห่งปัญจาธิปไตย (Pentarchy) ในศาสนจักรออร์โธดอกซ์ตะวันออก เดิมก่อตั้งโดยนักบุญยากอบผู้ชอบธรรม ซึ่งได้รับการ แต่งตั้งให้เป็นประมุขของศาสนจักรในเยรูซาเลมไม่นานหลังจากการสิ้นพระชนม์ของพระเยซู"
 roman_restoration.0106.t:0 "อัครบิดรแห่งอเล็กซานเดรีย"
 roman_restoration.0106.desc:0 "เมื่อนครกลับมาอยู่ภายใต้การควบคุมของโรมัน อัครบิดรแห่งอเล็กซานเดรียได้รับการฟื้นฟูอย่างเหมาะสมในฐานะหนึ่งในที่นั่งของบิชอปแห่งปัญจาธิปไตย (Pentarchy) ในศาสนจักรออร์โธดอกซ์ตะวันออก เดิมก่อตั้งโดยนักบุญมาระโกผู้นิพนธ์พระวรสาร ซึ่งกลายเป็นอัครบิดรองค์แรกของอเล็กซานเดรีย"
 roman_restoration.0107.t:0 "อัครบิดรแห่งโรม"
 roman_restoration.0107.desc:0 "เมื่อนครกลับมาอยู่ภายใต้การควบคุมของโรมัน อัครบิดรแห่งโรมได้รับการฟื้นฟูอย่างเหมาะสมในฐานะหนึ่งในที่นั่งของบิชอปแห่งปัญจาธิปไตย (Pentarchy) ในศาสนจักรออร์โธดอกซ์ตะวันออก หากอัครบิดรทั้งห้าในประวัติศาสตร์กลับคืนสู่ปัญจาธิปไตย มหาศาสนเภทระหว่างศาสนจักรตะวันออกและตะวันตกอาจได้รับการเยียวยาในที่สุด"
 roman_restoration.0120.t:0 "อัครบิดรทำลายรูปเคารพ"
 roman_restoration.0120.desc:0 "เมื่อนครคอนสแตนติโนเปิลอันยิ่งใหญ่อยู่ในมือของพวกทำลายรูปเคารพ อัครบิดรองค์ใหม่ได้รับการ แต่งตั้งให้ดูแลศาสนจักรตะวันออก ด้วยความช่วยเหลือของ [new_pope.GetFaith.HighGodName] [new_pope.GetFirstName] จะพิสูจน์ให้เห็นว่าเป็นผู้นำที่มีคุณธรรมและเอาใจใส่มากกว่าบรรพบุรุษสากลของ [new_pope.GetHerHis] \n\nอัครบิดรใหม่นี้จะยืนหยัดต่อต้านความฟุ่มเฟือย การทุจริต และการบูชารูปเคารพของบรรพบุรุษอย่างแน่นอน และนำพายุคใหม่ที่รุ่งโรจน์มาสู่ผู้ศรัทธาในลัทธิทำลายรูปเคารพทุกคน"

# Imposing the Iconoclast Patriarchate, by Flavio Verna
 roman_restoration.0120.a:0 "โค่นล้มรูปเคารพอันดูหมิ่นเหล่านี้!"
 roman_restoration.0121.desc.orthodox:0 "เมื่อนครคอนสแตนติโนเปิลอันยิ่งใหญ่ตกอยู่ในเงื้อมมือของพวกนอกรีต [reformer.GetTitledFirstName] ผู้ทำลายรูปเคารพอันชั่วร้ายได้ แต่งตั้งอัครบิดรจอมปลอมให้กับศาสนจักรสากล ขับไล่พระราชาคณะออร์โธดอกซ์ทั้งหมดออกจากตำแหน่ง\n\nหากทรราชผู้นี้ไม่ถูกโค่นล้มในไม่ช้าและการดูหมิ่นศาสนาของ [reformer.GetHerHis] ไม่ได้รับการแก้ไข นี่อาจเป็นจุดเริ่มต้นของจุดจบสำหรับศาสนจักรออร์โธดอกซ์"
 roman_restoration.0121.desc.iconoclast:0 "เมื่อนครคอนสแตนติโนเปิลอันยิ่งใหญ่อยู่ในมือของพวกทำลายรูปเคารพ อัครบิดรองค์ใหม่ได้รับการ แต่งตั้งให้ดูแลศาสนจักรตะวันออกโดย [reformer.GetTitledFirstName] ด้วยความช่วยเหลือของ [new_pope.GetFaith.HighGodName] [new_pope.GetFirstName] จะพิสูจน์ให้เห็นว่าเป็นผู้นำที่มีคุณธรรมและเอาใจใส่มากกว่าบรรพบุรุษสากลของ [new_pope.GetHerHis] \n\nอัครบิดรใหม่นี้จะยืนหยัดต่อต้านความฟุ่มเฟือย การทุจริต และการบูชารูปเคารพของบรรพบุรุษอย่างแน่นอน และนำพายุคใหม่ที่รุ่งโรจน์มาสู่ผู้ศรัทธาในลัทธิทำลายรูปเคารพทุกคน"
 roman_restoration.0121.desc.other:0 "เมื่อนครคอนสแตนติโนเปิลอันยิ่งใหญ่อยู่ในมือของพวกทำลายรูปเคารพ อัครบิดรองค์ใหม่ได้รับการ แต่งตั้งให้ดูแลศาสนจักรตะวันออกโดย [reformer.GetTitledFirstName]\n\nและด้วยคณะสงฆ์ออร์โธดอกซ์รุ่นเก่าส่วนใหญ่ถูกปลดออกจากตำแหน่ง ถูกจับกุม หรือถูกบังคับให้ลี้ภัย ความเชื่อสากลจึงถูกลดสถานะลงเป็นลัทธินอกรีต"
 roman_restoration.0121.a:0 "พวกป่าเถื่อน!"
 roman_restoration.0121.b:0 "ถึงเวลาเสียที!"
 roman_restoration.0121.c:0 "ข้าเข้าใจแล้ว..."

# Restoring the Ecumenical Patriarchate, by Flavio Verna
 roman_restoration.0122.t:0 "อัครบิดรสากล"
 roman_restoration.0122.desc:0 "การลี้ภัยอันโชคร้ายของอัครบิดรสากลได้สิ้นสุดลงแล้ว\n\nศาสนจักรที่แท้จริงเพียงหนึ่งเดียวได้กลับคืนสู่คอนสแตนติโนเปิล พร้อมที่จะนำพาโลกคริสเตียนด้วยมือที่มั่นคง แต่อ่อนโยน"
 roman_restoration.0122.a:0 "รุ่งโรจน์!"
 roman_restoration.0123.desc.orthodox:0 "การลี้ภัยอันโชคร้ายของอัครบิดรสากลได้สิ้นสุดลงแล้ว\n\nด้วยการนำอันเปี่ยมศรัทธาของ [reformer.GetTitledFirstName] ศาสนจักรที่แท้จริงเพียงหนึ่งเดียวได้กลับคืนสู่คอนสแตนติโนเปิล พร้อมที่จะนำพาโลกคริสเตียนด้วยมือที่มั่นคง แต่อ่อนโยน"
 roman_restoration.0123.desc.iconoclast:0 "กลุ่มสมคบคิดของพวกบูชารูปเคารพอันชั่วร้ายที่จัดตั้งโดย [reformer.GetTitledFirstName] ได้เข้ายึดครองคอนสแตนติโนเปิลและฟื้นฟูอัครบิดรนอกรีตที่ทุจริตในอดีต หากพวกเขาไม่ถูกหยุดยั้งในไม่ช้า ลัทธิทำลายรูปเคารพอาจจะค่อยๆ เลือนหายไป!"
 roman_restoration.0123.desc.other:0 "การลี้ภัยอันโชคร้ายของอัครบิดรสากลได้สิ้นสุดลงแล้ว\n\nด้วยการนำอันเปี่ยมศรัทธาของ [reformer.GetTitledFirstName] ศาสนจักรตะวันออกได้กลับคืนสู่ที่นั่งอันชอบธรรมในคอนสแตนติโนเปิล"
 roman_restoration.0123.a:0 "ในที่สุด เหตุผลก็กลับคืนสู่ศาสนจักรแล้ว!"
 roman_restoration.0123.b:0 "พวกบูชารูปเคารพชั่วร้าย ทั้งหมดเลย!"
 roman_restoration.0123.c:0 "ข้าเข้าใจแล้ว..."

# Restoring the Papacy, by Flavio Verna
 roman_restoration.0124.t:0 "สันตะสำนัก"
 roman_restoration.0124.desc:0 "ยุคแห่งความวุ่นวายและความสิ้นหวังสำหรับโลกคาทอลิกได้สิ้นสุดลงแล้ว: ด้วยพระสันตะปาปาองค์ใหม่ที่ฟื้นคืนสู่ที่นั่งประวัติศาสตร์แห่งโรม ศาสนจักรที่แท้จริงเพียงหนึ่งเดียวสามารถฟื้นตัวจากความพ่ายแพ้อันหายนะที่ประสบมาในยุคหลังได้ในที่สุด\n\nด้วยความช่วยเหลือของ [new_pope.GetFaith.HighGodName] [new_pope.GetTitledFirstName] จะนำระเบียบและความมั่นคงมาสู่คณะสงฆ์คาทอลิกที่เคยกระจัดกระจายไปทั่วยุโรป และสถาปนาลำดับชั้นที่เข้มงวดให้กับศาสนจักรอีกครั้ง"
 roman_restoration.0124.a:0 "สันตะสำนักได้ฟื้นคืนชีพจากเถ้าถ่านแล้ว!"
 roman_restoration.0125.desc.catholic:0 "ด้วยการแทรกแซงอันศักดิ์สิทธิ์ของ [reformer.GetTitledFirstName] ยุคแห่งความวุ่นวายและความสิ้นหวังสำหรับโลกคาทอลิกได้สิ้นสุดลงแล้ว: ด้วยพระสันตะปาปาองค์ใหม่ที่ฟื้นคืนสู่ที่นั่งประวัติศาสตร์แห่งโรม ศาสนจักรที่แท้จริงเพียงหนึ่งเดียวสามารถฟื้นตัวจากความพ่ายแพ้อันหายนะที่ประสบมาในยุคหลังได้ในที่สุด\n\nด้วยความช่วยเหลือของ [new_pope.GetFaith.HighGodName] [new_pope.GetTitledFirstName] จะนำระเบียบและความมั่นคงมาสู่คณะสงฆ์คาทอลิกที่เคยกระจัดกระจายไปทั่วยุโรป และสถาปนาลำดับชั้นที่เข้มงวดให้กับศาสนจักรอีกครั้ง"
 roman_restoration.0125.desc.other:0 "หลังจากสูญเสียที่นั่งดั้งเดิมและผู้สนับสนุนส่วนใหญ่ไป ศาสนจักรคาทอลิกถูกหลายคนมองว่าใกล้จะล่มสลาย ทว่า ด้วยการแทรกแซงอันเปี่ยมศรัทธาของ [reformer.GetTitledFirstName] พระสันตะปาปาองค์ใหม่ได้ครองราชย์ในโรมอีกครั้ง\n\nเมื่อสันตะสำนักได้รับการฟื้นฟูในที่สุด ชาวคาทอลิกอาจสามารถทวงคืนตำแหน่งของตนในฐานะสาขาหลักของศาสนาคริสต์ได้"
 roman_restoration.0125.a:0 "พระมารดาศาสนจักรของเรากลับเป็นปึกแผ่นอีกครั้ง!"
 roman_restoration.0125.b:0 "น่าสนใจ..."

# Destroying the Papacy, by Flavio Verna
 roman_restoration.0130.t:0 "การยุบสถาบันสันตะปาปา"
 roman_restoration.0130.desc.muslim:1 "การปกครองของชาวคริสต์เหนือกรุงโรมได้สิ้นสุดลงแล้ว \n\nด้วยความพยายามอย่างทุ่มเทของผู้รับใช้อันภักดีจำนวนมากของ [scoped_destroyer.GetFaith.HighGodName] อิตาลีทั้งหมดได้ตกอยู่ภายใต้การปกครองของ [scoped_destroyer.GetFaith.GetAdjective] ผู้ศรัทธาได้ทำงานอย่างไม่รู้จักเหน็ดเหนื่อยเพื่อขจัดรูปเคารพอันดูหมิ่นทั้งหมด และนำคณะสงฆ์ที่เสื่อมทราม ซึ่งปกครองดินแดนเหล่านี้มารับโทษ"
 roman_restoration.0130.desc.hellenic:1 "ทรราชย์ของชาวกาลิลีเหนือยุโรปได้สิ้นสุดลงแล้ว\n\nเป็นเวลาหลายศตวรรษที่พวกคลั่งลัทธิที่ได้รับการยกย่องเหล่านี้ได้รับอิสระในการใส่ร้ายและทำลายอนุสรณ์สถานโบราณของผู้พิทักษ์อันศักดิ์สิทธิ์ของเรา แต่ไม่ใช่อีกต่อไป! โดยการฟื้นฟูการปกครองของ [scoped_destroyer.GetFaith.GetAdjective] เหนือกรุงโรมและคาบสมุทรอิตาลี เราได้บดขยี้หัวใจของศาสนจักรแห่งเทพเจ้าช่างไม้"
 roman_restoration.0130.desc.fallback:0 "หลังจากหลายศตวรรษที่ถูกดูหมิ่นและหลอกลวงโดยมิชชันนารีของพวกเขา ในที่สุดผู้ติดตามของ [scoped_destroyer.GetFaith.HighGodName] ก็ได้แก้แค้นผู้ติดตามของเทพเจ้าคริสต์ \n\nดินแดนใจกลางแห่งศรัทธาของพวกเขาถูกพิชิตด้วยความโปรดปรานของเทพเจ้าของเรา โบสถ์ของพวกเขาถูกปล้นสะดม นักบวชของพวกเขาถูกริบอำนาจและศักดิ์ศรีทั้งหมด ด้วยการรุกรานอันรุ่งโรจน์ของข้า ข้าได้กำจัดศาสนาขี้ขลาดนี้ให้หมดไปจากโลก และล้างแค้นความอัปยศที่เกิดแก่ดินแดนและบรรพบุรุษของเราจากการหลอกลวงของพวกเขา"
 roman_restoration.0130.desc.pope.submission:0 "\n\nเมื่อเผชิญกับอำนาจสูงสุดทางศาสนาที่ไม่อาจปฏิเสธได้ของเรา อดีตพระสันตะปาปา [scoped_pope.GetFullName] ถึงกับประกาศถอนคำพูดต่อสาธารณะเกี่ยวกับความเชื่อ [catholic.GetAdjectiveNoTooltip] และเปลี่ยนมานับถือ [scoped_destroyer.GetFaith.GetNameNoTooltip]!"
 roman_restoration.0130.desc.pope.crucifixion:0 "\n\n[scoped_pope.GetFirstName] ซึ่งยังคงยึดมั่นอย่างท้าทายในตำแหน่งที่ไม่สมควรได้รับคือ ปอนติเฟกซ์ มักซิมุส ถูกตรึงกางเขนท่ามกลางซากปรักหักพังที่ลุกไหม้ของวาติกัน ดังนั้นจึงสิ้นสุดสายเลือดอันน่าอดสูของสังฆราชคริสเตียนแห่งโรม"
 roman_restoration.0130.desc.pope.sacrificed:0 "\n\nมหาวิหารของวาติกันได้รับการชำระให้บริสุทธิ์และอุทิศใหม่ให้กับ [scoped_destroyer.GetFaith.HighGodName] โดยใช้เลือดของ [scoped_pope.GetTitledFirstName] [scoped_pope.GetHerselfHimself] ซึ่งถูกบูชายัญบนแท่นบูชาที่ [scoped_pope.GetSheHe] เคยใช้เทศนา"
 roman_restoration.0130.desc.no_pope:0 "\n\n[catholic.BishopNeuterPlural] ที่ไร้ระเบียบได้พยายามรวบรวม [catholic.GetAdherentNamePluralNoTooltip] ที่เสียขวัญเป็นรายบุคคล แต่หากไม่มี [catholic.ReligiousHeadName] ที่แท้จริงมานำพวกเขา ก็เป็นที่ชัดเจนว่ายุคแห่งอำนาจของพระสันตะปาปาสิ้นสุดลงแล้ว"
 roman_restoration.0130.a.a:0 "[scoped_destroyer.GetFaith.HighGodName] ได้ประทานพรแก่เรา!"
 roman_restoration.0130.a.b:0 "นี่คือเวลาแห่งการฟื้นคืนชีพของเรา!"
 roman_restoration.0130.a.c:0 "ท้ายที่สุดแล้ว เทพเจ้าที่ตายแล้วของพวกเขาก็ปกป้องพวกเขาไม่ได้"
 roman_restoration.0131.desc.faithful:0 "ด้วยการทัพพิชิตอย่างไม่หยุดยั้งของ [scoped_destroyer.GetTitledFirstNamePossessive] คาบสมุทรอิตาลีทั้งหมดได้ตกอยู่ภายใต้การปกครองของ [scoped_destroyer.GetFaith.GetAdjective]\n\nด้วยความช่วยเหลือของ [scoped_destroyer.GetFaith.HighGodNamePossessive] [scoped_destroyer.GetSheHe] ได้ตามล่ากลุ่มคาทอลิกที่เหลืออยู่ทั้งหมดที่ยังคงรวมตัวกันในอิตาลี และริบทรัพย์สินและอิทธิพลของสังฆมณฑลหลักทั้งหมด ซึ่งเป็นการทำลายอำนาจของศาสนจักรจอมปลอมอย่างรุนแรง"
 roman_restoration.0131.desc.christians:0 "การทัพอันน่าสะพรึงกลัวของ [scoped_destroyer.GetTitledFirstName] ได้นำความพินาศและความมืดมนมาสู่ใจกลางของพระมารดาศาสนจักรอันศักดิ์สิทธิ์ของเรา!\n\nคนนอกรีตอันชั่วร้ายได้ริบสมบัติและศักดิ์ศรีทั้งหมดของสถาบันสันตะปาปา สังหารนักเทววิทยาจำนวนนับไม่ถ้วนอย่างโหดเหี้ยม และจะไม่หยุดจนกว่า [scoped_destroyer.GetSheHe] จะนำศาสนาคริสต์ทั้งหมดมาอยู่ใต้บังคับบัญชา ด้วยวาติกันถูกทำลายและลำดับชั้นของมันอยู่ในสภาพยุ่งเหยิง ความเชื่อคาทอลิกจึงถูกลดสถานะลงเป็นลัทธิที่ไร้ระเบียบ"
 roman_restoration.0131.desc.fallback:0 "การทัพพิชิตอันกล้าหาญของ [scoped_destroyer.GetTitledFirstName] ได้นำความพินาศและความมืดมนมาสู่ใจกลางของศาสนจักรคาทอลิก!\n\nหลังจากริบสมบัติและศักดิ์ศรีส่วนใหญ่ของสถาบันสันตะปาปาไปแล้ว ดูเหมือนว่า [scoped_destroyer.GetSheHe] จะพอใจก็ต่อเมื่อศาสนาคริสต์ทั้งหมดอยู่ใต้บังคับบัญชา ด้วยวาติกันถูกทำลายและลำดับชั้นของมันอยู่ในสภาพยุ่งเหยิง ความเชื่อคาทอลิกจึงถูกลดสถานะลงเป็นลัทธิที่ไร้ระเบียบ"
 roman_restoration.0131.a.a:0 "ถึงเวลาที่ใครสักคนจะทำเสียที"
 roman_restoration.0131.a.b:0 "จุดจบใกล้เข้ามาแล้ว!"
 roman_restoration.0131.a.c:0 "ข้าเข้าใจแล้ว..."

# Unifying Italy, by Flavio Verna
 roman_restoration.0140.t:0 "จักรวรรดิอิตาลี"
 roman_restoration.0140.desc:0 "นับตั้งแต่การล่มสลายของจักรวรรดิตะวันตก คาบสมุทรอิตาลีได้แตกแยกออกเป็นนครรัฐที่กบฏ บิชอปที่โลภมาก และผู้พิชิตอนารยชน\n\nทว่า ภายใต้การปกครองของราชวงศ์ข้า อิตาลีได้ละทิ้งการต่อสู้ภายในอันหยุมหยิมและรวมเป็นปึกแผ่นอีกครั้ง ฟื้นคืนชีพขึ้นมาเป็นมหาอำนาจที่โดดเด่นในตะวันตก เราจะไม่เป็นรางวัลที่ต้องแย่งชิงกันระหว่างชาวแฟรงก์และชาวกรีกอีกต่อไป หรือถูกกระทำอย่างโหดร้ายโดยโจรสลัดและผู้อ้างสิทธิ์อนารยชน นับจากนี้ไป เราทวงคืนตำแหน่งของเราในฐานะทายาทที่แท้จริงของจักรวรรดิโรมัน!"
 roman_restoration.0140.a:0 "ความพากเพียรเอาชนะทุกสิ่ง!"
 roman_restoration.0141.desc:0 "นับตั้งแต่การล่มสลายของจักรวรรดิตะวันตก คาบสมุทรอิตาลีได้แตกแยกออกเป็นนครรัฐที่กบฏ บิชอปที่โลภมาก และผู้พิชิตอนารยชน ความรุ่งโรจน์ในอดีตถูกผลาญไปกับการต่อสู้ภายในอันหยุมหยิม\n\nทว่า ภายใต้การปกครองของ [scoped_ruler.GetTitledFirstNamePossessive] อิตาลีได้รวมเป็นปึกแผ่นอีกครั้ง ฟื้นคืนชีพขึ้นมาเป็นมหาอำนาจที่โดดเด่นในตะวันตก ครั้งหนึ่งเคยถูกแย่งชิงระหว่างชาวแฟรงก์และชาวกรีก บัดนี้ได้กลายเป็นจักรวรรดิในสิทธิของตนเอง ปกครองเหนือใจกลางดินแดนโรมันเก่าแก่"
 roman_restoration.0141.a:0 "นี่เป็นเรื่องโชคร้าย"
 roman_restoration.0141.b:0 "น่าสนใจ..."

# Restoring Roman Empire as Italy, by Flavio Verna
 roman_restoration.0150.t:0 "จากโรมสู่โรม"
 roman_restoration.0150.desc:0 "เป็นที่ชัดเจนแล้วว่าไม่มีความพยายามใดที่จะฟื้นฟูจักรวรรดิที่แตกสลายในอดีตจะประสบความสำเร็จ ตราบใดที่ยังถูกไล่ตามโดยชาวเยอรมันป่าเถื่อนหรือชาวกรีกที่อ่อนแอ\n\nเป็นเพียงผ่านการเสียสละของชาวอิตาลีเท่านั้นที่โรมได้กลับคืนสู่ตำแหน่งอันชอบธรรมในฐานะราชินีแห่งนครอีกครั้ง\n\n"
 roman_restoration.0150.a:0 "ถนนทุกสายมุ่งสู่โรม"
 roman_restoration.0151.t:0 "ยุคที่สองแห่งโรม"
 roman_restoration.0151.desc.byzantines:0 "เรื่องที่ไม่น่าเชื่อได้เกิดขึ้นแล้ว! นครรัฐเล็กๆ ของอิตาลีสามารถรวมตัวกันภายใต้ธงผืนเดียวและกรุยทางอันนองเลือดเข้าสู่จังหวัดตะวันออกของเราในความพยายามที่จะฟื้นฟูจักรวรรดิในอดีต\n\nหลังจากฟื้นฟูจังหวัดโบราณส่วนใหญ่ภายใต้การปกครองของ [scoped_emperor.GetHerHis] [scoped_emperor.GetTitledFirstName] ได้ประกาศฟื้นฟูจักรวรรดิโรมันภายใต้การนำอันป่าเถื่อนของ [scoped_emperor.GetHerHis] ด้วยความชอบธรรมเพียงน้อยนิดที่เราเหลืออยู่ เราไม่สามารถปฏิเสธคำกล่าวอ้างอันน่าหัวเราะนี้ได้อีกต่อไป"
 roman_restoration.0151.desc.others:0 "จักรวรรดิอิตาลีที่กำลังรุ่งเรืองสามารถทวงคืนจังหวัดเก่าแก่ได้มากพอภายใต้การนำของ [scoped_emperor.GetTitledFirstName] เพื่อประกาศตนเป็นจักรวรรดิโรมันที่ถือกำเนิดใหม่\n\nด้วยการดูหมิ่นผู้อ้างสิทธิ์ทั้งทางเหนือและตะวันออก ชาติใหม่นี้พยายามที่จะฟื้นฟูพรมแดนโบราณของตนต่อต้านศัตรูทั้งหมด"
 
# Roman Empire dismantles pretenders, by Flavio Verna
 roman_restoration.0160.t:0 "ผู้อ้างสิทธิ์"
 roman_restoration.0160.desc:0 "เป็นเวลานานเกินไปแล้วที่เราอดทนต่อผู้อ้างสิทธิ์ป่าเถื่อนทางเหนือที่ประดับประดาตนเองด้วยศักดิ์ศรีของจักรวรรดิที่ไม่สมควรได้รับ โรมอยู่ภายใต้การควบคุมของจักรวรรดิที่แท้จริงอย่างมั่นคง และสหพันธรัฐอันน่าสมเพชของขุนศึกเยอรมันที่เคยพยายามปกครองตะวันตกได้ถูกผลักดันไปไกลกว่าแม่น้ำไรน์ สู่ป่าเถื่อนที่ ซึ่งมันควรอยู่\n\nถึงเวลาแล้วที่จะสอนบทเรียนสุดท้ายแก่พวกอนารยชนเหล่านี้และริบจักรวรรดิจอมปลอมของพวกเขาไปเสียให้สิ้นซาก"
 roman_restoration.0160.a:0 "กองทัพลีเจียนของเราจะบดขยี้พวกเขา!"
 roman_restoration.0161.t:0 "การชำระแค้นของโรมัน"
 roman_restoration.0161.desc:1 "[byz_emperor.GetTitledFirstName] ได้ประณามข้าต่อสาธารณะว่าเป็น [hre_emperor.GetTitleTierName] จอมปลอม และพร้อมที่จะปลดปล่อยพลังอันน่าสะพรึงกลัวของ [byz_emperor.GetPrimaryTitle.GetName] ต่อประชาชนของข้า\n\nยังไม่เพียงพอที่พรรคพวกของ [byz_emperor.GetHerHis] จะขับไล่เราให้ไกลออกไปจากดินแดนของเรา โรมจะไม่พอใจจนกว่าจะได้พิชิตผู้อ้างสิทธิ์ในความรุ่งโรจน์ทั้งหมด"
 roman_restoration.0161.a:0 "เรายังมีแรงสู้!"
 roman_restoration.0162.t:0 "ชาวแฟรงก์พ้นแม่น้ำไรน์"
 roman_restoration.0162.desc:0 "สำเร็จแล้ว การทัพอันยิ่งใหญ่ของเราได้ทำลายสิ่งที่เรียกว่าจักรวรรดิโรมันอันศักดิ์สิทธิ์จนเกินกว่าจะซ่อมแซมได้ [hre_emperor.GetTitledFirstName] ถูก ทำให้อับอายอย่างที่สุดและถูกริบศักดิ์ศรีของจักรวรรดิทั้งหมด [hre_emperor.GetSheHe|U] ไม่มีอำนาจหรือทรัพยากรที่จะรวมชนเผ่าป่าเถื่อนของเยอรมนีภายใต้ธงผืนเดียวอีกต่อไป"
 roman_restoration.0162.a:0 "และไปให้พ้นเสียที!"
 roman_restoration.0163.t:0 "การชำระแค้นของโรมัน"
 roman_restoration.0163.desc:0 "ชาวโรมันที่ฟื้นคืนชีพได้ทำลายจักรวรรดิของชาวเยอรมันจนจำไม่ได้ หลังจากความพ่ายแพ้อย่างย่อยยับต่อกองทัพลีเจียนของพวกเขา คำพูดของข้ามีอิทธิพลน้อยลงต่ออดีตข้าหลวงของข้า นี่คือจุดจบของความฝันของชาร์เลอมาญ"
 roman_restoration.0163.a:0 "เรื่องนี้เกิดขึ้นได้อย่างไร?"
 roman_restoration.0164.t:0 "ชาวแฟรงก์โต้กลับ"
 roman_restoration.0164.desc:0 "เหนือความคาดหมายทั้งหมด [hre_emperor.GetTitledFirstName] สามารถตั้งรับอย่างมีประสิทธิภาพต่อกองทัพลีเจียนของข้าได้! ด้วยชัยชนะของ [hre_emperor.GetHerHis] [hre_emperor.GetSheHe] ได้มอบความชอบธรรมใหม่ให้กับจักรวรรดิที่ง่อนแง่นของ [hre_emperor.GetHerHis] และ ทำให้ชื่อเสียงของข้าเสื่อมเสียจนเกินกว่าจะแก้ไขได้"
 roman_restoration.0164.a:0 "แล้วอินทรีของข้าเล่า?!"
 roman_restoration.0165.t:0 "ชาวแฟรงก์โต้กลับ"
 roman_restoration.0165.desc:1 "ความภาคภูมิใจของชาวโรมันคือหายนะของพวกเขา แม้ว่า [byz_emperor.GetHerHis] จะโอ้อวดเพียงใด กองทัพลีเจียนของ [byz_emperor.GetTitledFirstNamePossessive] ก็พิสูจน์แล้วว่าไม่สามารถยืนหยัดต่อสู้กับ $knight_culture_player_plural_no_tooltip_lowercase$ ผู้ภักดีของข้าได้ ด้วยการป้องกันอันแน่วแน่ของข้า ข้าได้มอบศักดิ์ศรีใหม่ให้กับบรรดาศักดิ์ของข้า"
 roman_restoration.0165.a:0 "และอย่ากลับมาอีก!"

 roman_restoration.0170.t:0 "ผู้อ้างสิทธิ์"
 roman_restoration.0170.desc:0 "เป็นเวลานานเกินไปแล้วที่เราอนุญาตให้เศษซากอันอ่อนแอของจักรวรรดิจัสติเนียนยึดติดกับศักดิ์ศรีของบรรดาศักดิ์ที่พวกเขาได้ ทำให้เสื่อมเสียไปนานแล้วผ่านขบวนพาเหรดที่ไม่สิ้นสุดของกษัตริย์ที่ไร้ความสามารถ ใจแคบ และเสื่อมทราม\n\nทั้งอิตาลีและกรีซอยู่ภายใต้การควบคุมของเราแล้ว ในขณะที่พวกเขาถูกลดทอนลงเหลือเพียงระบอบเผด็จการตะวันออกที่เสื่อมโทรม โลภและอาฆาตแค้นเกินกว่าจะยอมรับว่าเวลาของพวกเขาสิ้นสุดลงนานแล้ว"
 roman_restoration.0170.a:0 "เราจะให้กำลังใจที่จำเป็น"
 roman_restoration.0171.t:0 "การชำระแค้นของโรมัน"
 roman_restoration.0171.desc:1 "[hre_emperor.GetTitledFirstName] ได้ประณามข้าต่อสาธารณะว่าเป็น [byz_emperor.GetTitleTierName] จอมปลอม และพร้อมที่จะปลดปล่อยพลังอันน่าสะพรึงกลัวของ [hre_emperor.GetPrimaryTitle.GetName] ต่อประชาชนของข้า\n\nยังไม่เพียงพอที่พรรคพวกของ [hre_emperor.GetHerHis] จะขับไล่เราให้ไกลออกไปจากดินแดนของเรา โรมจะไม่พอใจจนกว่าจะได้พิชิตผู้อ้างสิทธิ์ในความรุ่งโรจน์ทั้งหมด"
 roman_restoration.0171.a:0 "เราคือทายาทที่แท้จริงเพียงหนึ่งเดียวของโรม!"
 roman_restoration.0172.t:0 "ไบแซนทิออนพังทลาย"
 roman_restoration.0172.desc:0 "สำเร็จแล้ว ซากที่ทุจริตของจักรวรรดิแห่งชาวกรีกถูกกวาดล้างออกจากชายฝั่งกรีซและเอเชียไมเนอร์ ด้วยผู้นำและข้าราชการถูกริบอำนาจและกองทัพพิการ [byz_emperor.GetTitledFirstName] ไม่สามารถสนับสนุนราชสำนักอันเสื่อมทรามที่เต็มไปด้วยคนประจบสอพลอและคนแทงข้างหลังได้อีกต่อไป หรือแผ่อำนาจของ [byz_emperor.GetHerHis] ออกไปนอกกำแพงวังของ [byz_emperor.GetHerHis]"
 roman_restoration.0172.a:0 "ถึงเวลาเสียที"
 roman_restoration.0173.t:0 "การชำระแค้นของโรมัน"
 roman_restoration.0173.desc:0 "จักรวรรดิของเราอยู่ในสภาพยุ่งเหยิง หลังจากการทัพอันก้าวร้าวเพื่อสร้างความอัปยศอดสูและการทำลายล้าง ฝูงชนป่าเถื่อนของ [hre_emperor.GetTitledFirstName] ทิ้งข้าไว้กับซากปรักหักพังและนครรัฐที่ทำสงครามกันเท่านั้น บรรดาศักดิ์ที่ข้าเคยดำรงอยู่ไม่เหลือศักดิ์ศรีของจักรวรรดิอีกต่อไป"
 roman_restoration.0173.a:0 "เจ้าพวกปีศาจ!"
 roman_restoration.0174.t:0 "ชาวกรีกโต้กลับ"
 roman_restoration.0174.desc:0 "เหนือความคาดหมายทั้งหมด [byz_emperor.GetTitledFirstName] สามารถตั้งรับอย่างมีประสิทธิภาพต่อกองกำลังของข้าได้! ด้วยชัยชนะของ [byz_emperor.GetHerHis] [byz_emperor.GetSheHe] ได้มอบความชอบธรรมใหม่ให้กับจักรวรรดิที่ง่อนแง่นของ [byz_emperor.GetHerHis] และ ทำให้ชื่อเสียงของข้าเสื่อมเสียจนเกินกว่าจะแก้ไขได้"
 roman_restoration.0174.a:0 "เรื่องนี้เกิดขึ้นได้อย่างไร?!"
 roman_restoration.0175.t:0 "ชาวกรีกโต้กลับ"
 roman_restoration.0175.desc:0 "นักปราชญ์จะถกเถียงกันไปอีกนานถึงความโง่เขลาประเภทใดที่ดึงดูดให้ [hre_emperor.GetTitledFirstName] ทำสงครามกับทายาทที่แท้จริงของโรม ความพยายามอันน่าสมเพชของผู้อ้างสิทธิ์ผู้นี้ที่จะริบสิทธิ์อันศักดิ์สิทธิ์ของข้าในการปกครองยุโรป ส่งผลให้เกิดความพ่ายแพ้ที่คาดเดาได้และน่าอัปยศอดสูเท่านั้น"
 roman_restoration.0175.a:0 "ไม่เคยมีข้อสงสัยใดๆ เกี่ยวกับเรื่องนี้"
 ######## Byz emp reclaims Constantinople
 roman_restoration.1200.t: "นครอันเป็นที่ปรารถนาของโลก"
 roman_restoration.1200.desc: "ในที่สุด นครคอนสแตนติโนเปิลอันยิ่งใหญ่ สัญญาณส่องสว่างแห่งจักรวรรดิตะวันออก ได้กลับคืนสู่เราแล้ว!\n\nฝูงชนที่ชื่นชมยินดีเบียดเสียดกันบน [Glossary( 'เมเซ', 'MESE_GLOSS' )] ที่ประดับประดาด้วยธงทิว ตั้งแต่ประตูธีโอโดเซียนไปจนถึงพระราชวังใหญ่ และเสียงร้องของพวกเขา ต้อนรับการกลับบ้านของ [ROOT.Char.GetPrimaryTitle.GetAdjectiveNoTooltip] สามารถได้ยินไปถึงอีกฝั่งของบอสพอรัส\n\nอีกหลายศตวรรษต่อจากนี้ จะเป็นที่จดจำว่าข้า [ROOT.Char.GetFirstNameRegnal] ได้นำอัญมณีโรมันอันล้ำค่าที่สุดนี้กลับคืนสู่อ้อมอกของจักรวรรดิ"
 MESE_GLOSS: "#EMP Mese#! หรือ 'ถนนสายกลาง' คือถนนสายหลักของคอนสแตนติโนเปิล และเป็นเส้นทางสำหรับขบวนแห่และชัยชนะ ใจกลางของถนนซึ่งประดับด้วยเสาหินเรียกว่า #EMP Regia#! หรือ 'ถนนหลวง' ทอดยาวไปทางทิศตะวันตกจากฮาเกียโซเฟีย ผ่าน[Glossary( 'fora', 'FORUM_GLOSS' )]แต่ละแห่งของเมือง ก่อนจะแยกออกไปยังประตูต่างๆ ในกำแพงของธีโอโดเซียส"
 FORUM_GLOSS: "ฟอรัม (Forum) ซึ่งแผลงเป็นภาษากรีกว่า #EMP ฟอรอส#! (Fóros) เป็นคำศัพท์โรมันสำหรับจัตุรัสสาธารณะขนาดใหญ่ ที่อุทิศให้กับการประชุมสาธารณะและตลาด และมักประดับประดาด้วยของที่ยึดมาได้จากสงครามและรูปปั้น"
 roman_restoration.1200.a: "ที่ประทับอันชอบธรรมของบัลลังก์จักรวรรดิกลับคืนมาแล้ว!"
 roman_restoration.1200.b.rome: "โรมผู้พิชิต!"
 roman_restoration.1200.b: "นครแห่งคอนสแตนตินปลอดภัยอีกครั้ง"
 half_price_chariot_race_tooltip: "ท่านอาจจัด [activity|E] #V $activity_chariot_race$#! ในราคาครึ่งหนึ่ง"
 half_price_chariot_race_flag_desc: "การฟื้นฟู"
 free_triumph_tooltip: "ท่านอาจใช้ [decision|E] #V $hold_triumph_decision$#! ได้ฟรี"
 ######## Byz emp reclaims Constantinople from you by Isabella Welch
 roman_restoration.1204.t:0 "เจ้า [ROOT.Char.Custom('GirlBoy')] ต่ำช้า,"
 roman_restoration.1204.desc_vassal:0 "ข้าดึงเจ้าขึ้นมาจากความโสโครก และข้าก็โยนเจ้ากลับไปได้! เจ้าไม่ได้คิด #EMP จริงๆ#! หรอกนะว่า #EMP คอนสแตนติโนเปิล#! เสาหลักสุดท้ายแห่งความรู้แจ้งบนโลกอันน่ารังเกียจนี้ จะเป็นของเจ้าได้จริงๆ! แม้ แต่ปลายเล็บเท้าเล็กที่สุดของเจ้าก็ไม่คู่ควรที่จะเหยียบย่ำบนอิฐอันแวววาวของมัน! คืนมันมา มิฉะนั้นโกลเดนฮอร์นจะเป็นหลุมจมน้ำของเจ้า — ข้าจะโยนเจ้าลงไปเอง หากจำเป็น"
 roman_restoration.1204.a:0 "ข้าเพียงแค่ดูแลมันไว้ให้ท่านเท่านั้น!"
 roman_restoration.1204.b:0 "ข้าหวังว่าก้นที่น่ารำคาญของเจ้าจะโดนเสี้ยนตำบนบัลลังก์นะ"
 
 roman_restoration.0130.desc.pope.exile: "\n\nThe former Pope [scoped_pope.GetFullName] escaped our grasp, fleeing into exile with a handful of loyal servants. The office [scoped_pope.GetSheHe] once held, however, is no more."
 roman_restoration.0132.t: "The Antichrist Shatters My Throne"
 roman_restoration.0132.desc: "[catholic.GetAdherentNamePluralNoTooltip] everywhere wake without a shepherd. The Papacy is dissolved, my clergy scattered, the holiest of relics carried off as spoil. Rome is now the dominion of the Antichrist [scoped_destroyer.GetTitledFirstName]."
 roman_restoration.0132.a: "This ministry must take to the road."
 roman_restoration.0132.b: "Then let it end with me."
 roman_restoration.0132.c: "The flock can still be shepherded from [translation_see.GetNameNoTierNoTooltip]."
 roman_restoration.0132.c.tt: "You take [translation_see.GetNameNoTierNoTooltip]. Your old [clerical_region|E] in Rome is destroyed."
 roman_restoration.0132.d: "Everything falls to [alt_1.GetFirstNameNoTooltipRegnal]."
