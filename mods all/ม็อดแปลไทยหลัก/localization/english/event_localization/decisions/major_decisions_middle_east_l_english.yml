l_english: 
# Forming Outremer, by Flavio Verna
 middle_east_decisions.0001.t:0 "จักรวรรดิสวรรค์"
 middle_east_decisions.0001.desc:0 "นับตั้งแต่การรุ่งเรืองของมูฮัมหมัด ศาสนาอิสลามได้กลายเป็นพลังที่ต้องคำนึงถึงทั่วทั้งตะวันออก และเป็นภัยคุกคามที่ปรากฏต่อผู้นับถือพระคริสต์ ทว่า ด้วยความพยายามของข้าพเจ้าในการรักษาดินแดนศักดิ์สิทธิ์ สิ่งนี้จึงไม่เป็น เช่นนั้นอีกต่อไป \n\nข้าพเจ้าได้ขับไล่พวกนอกรีตออกจากชายฝั่งทะเลเมดิเตอร์เรเนียนและไล่ตามพวกเขาผ่านทะเลทรายอันร้อนระอุแห่งอาระเบีย ข้าพเจ้าได้ปักไม้กางเขนศักดิ์สิทธิ์แห่งพระเจ้าของเราจากทะเลสู่ทะเล และสร้างจักรวรรดิสวรรค์ที่แท้จริงขึ้นเหนือจันทร์เสี้ยวที่แตกสลายของศาสดาจอมปลอม"
 middle_east_decisions.0001.a:0 "ขอพระเจ้าทรงเมตตาพวกเขาเถิด เพราะข้าพเจ้าไม่มี"
 middle_east_decisions.0002.desc.christians:0 "นับตั้งแต่การรุ่งเรืองของมูฮัมหมัด ศาสนาอิสลามได้กลายเป็นพลังที่ต้องคำนึงถึงทั่วทั้งตะวันออก และเป็นภัยคุกคามที่ปรากฏต่อผู้นับถือพระคริสต์ ทว่า ด้วยความพยายามของ [scoped_ruler.GetTitledFirstName] ในการรักษาดินแดนศักดิ์สิทธิ์ สิ่งนี้จึงไม่เป็น เช่นนั้นอีกต่อไป \n\nด้วยพรจาก [scoped_ruler.GetFaith.HighGodName] [scoped_ruler.GetFirstName] ได้ขับไล่พวกนอกรีตออกจากชายฝั่งทะเลเมดิเตอร์เรเนียนและไล่ตามพวกเขาผ่านทะเลทรายอันร้อนระอุแห่งอาระเบีย [scoped_ruler.GetSheHe|U] ได้ปักไม้กางเขนศักดิ์สิทธิ์แห่งพระเจ้าของเราจากทะเลสู่ทะเล และสร้างจักรวรรดิสวรรค์ที่แท้จริงขึ้นเหนือจันทร์เสี้ยวที่แตกสลายของศาสดาจอมปลอม"
 middle_east_decisions.0002.desc.muslims:0 "ฝูงชนป่าเถื่อนของนักรบครูเสด [scoped_ruler.GetTitledFirstName] ได้นำความพินาศเกินกว่าจะเข้าใจมาสู่ผู้ติดตามของ [ROOT.Char.GetFaith.HighGodName]!\n\nพวกบูชารูปเคารพอันชั่วร้ายเหล่านี้ได้ยึดครองสถานที่ศักดิ์สิทธิ์ทั้งหมดของศาสนาเรา แม้ แต่นครศักดิ์สิทธิ์เมกกะก็ตกอยู่ภายใต้เงื้อมมือของพวกหมูดูหมิ่นศาสนาเหล่านี้ หากผู้ติดตามที่แท้จริงของศาสดาไม่ทวงคืนอาระเบียในไม่ช้า นี่อาจเป็นจุดเริ่มต้นของจุดจบของอิสลาม"
 middle_east_decisions.0002.desc.others:0 "นับตั้งแต่การรุ่งเรืองของมูฮัมหมัด ศาสนาอิสลามได้กลายเป็นพลังที่ต้องคำนึงถึงทั่วทั้งตะวันออก ทว่า ด้วยความพยายามของ [scoped_ruler.GetTitledFirstName] ในการรักษาดินแดนศักดิ์สิทธิ์ สิ่งนี้จึงไม่เป็น เช่นนั้นอีกต่อไป \n\n[scoped_ruler.GetTitleTierName] ชาว [scoped_ruler.GetFaith.GetAdjective] ผู้นี้ได้ขับไล่ผู้ติดตามของอัลลอฮ์ออกจากชายฝั่งทะเลเมดิเตอร์เรเนียนและไล่ตามพวกเขาผ่านทะเลทรายอันร้อนระอุแห่งอาระเบีย [scoped_ruler.GetSheHe|U] ได้ปักไม้กางเขนศักดิ์สิทธิ์จากทะเลสู่ทะเล และสร้างสิ่งที่ [scoped_ruler.GetSheHe] เรียกว่าจักรวรรดิสวรรค์ขึ้นเหนือจันทร์เสี้ยวที่แตกสลายของศาสดา"
 middle_east_decisions.0002.a:0 "สรรเสริญแด่พระเจ้าของเรา!"
 middle_east_decisions.0002.b:0 "ขอคำสาปแช่งนับพันตกแก่ตระกูลของ [scoped_ruler.GetHerHis]!"
 middle_east_decisions.0002.c:0 "ข้าเข้าใจแล้ว..."

# Restoring the Sunni Caliphate, by Flavio Verna
 middle_east_decisions.0003.t:0 "รัฐเคาะลีฟะฮ์ใหม่"
 middle_east_decisions.0003.desc:0 "นับตั้งแต่การยึดครองดินแดนศักดิ์สิทธิ์โดยพวกนอกรีต ผู้ติดตามที่แท้จริงของศาสดาได้กระจัดกระจายไปทั่วทุกสารทิศ ปราศจากผู้นำหรือเจตจำนงที่จะดำเนินศึกศักดิ์สิทธิ์ต่อไป\n\nสิ่งนี้จะสิ้นสุดลงในวันนี้ ด้วยความเมตตาของ [reformer.GetFaith.HighGodNamePossessive] ข้าพเจ้าได้ทวงคืนเมกกะและเมดินา และหยุดยั้งกระแสของพวกนอกรีตที่หลั่งไหลเข้าสู่อาระเบีย ด้วยการสนับสนุนจากบัณฑิตแห่งคัมภีร์ที่เคารพนับถือหลายท่าน ข้าพเจ้าได้รับการยอมรับให้เป็นคอลีฟะฮ์องค์ใหม่แห่ง [reformer.GetFaith.GetName] และข้าพเจ้าพร้อมที่จะนำผู้ติดตามของข้าพเจ้าต่อสู้กับพวกบูชารูปเคารพอันชั่วร้ายที่ยังคงสร้างมลทินให้กับมาตุภูมิของเรา!"
 middle_east_decisions.0003.a:0 "อัลลอฮุอักบัร!"
 middle_east_decisions.0004.desc.ashari:0 "นับตั้งแต่การยึดครองดินแดนศักดิ์สิทธิ์โดยพวกนอกรีต ผู้ติดตามที่แท้จริงของศาสดาได้กระจัดกระจายไปทั่วทุกสารทิศ ปราศจากผู้นำหรือเจตจำนงที่จะดำเนินศึกศักดิ์สิทธิ์ต่อไป\n\nสิ่งนี้จะสิ้นสุดลงในวันนี้ ด้วยความเมตตาของ [reformer.GetFaith.HighGodNamePossessive] [reformer.GetFirstName] ได้ทวงคืนเมกกะและเมดินา และหยุดยั้งกระแสของพวกนอกรีตที่หลั่งไหลเข้าสู่อาระเบีย ด้วยการสนับสนุนจากบัณฑิตแห่งคัมภีร์ที่เคารพนับถือหลายท่าน [reformer.GetSheHe] ได้รับการยอมรับให้เป็นคอลีฟะฮ์องค์ใหม่แห่ง [reformer.GetFaith.GetName] และพร้อมที่จะนำผู้ติดตามของ [reformer.GetHerHis] ต่อสู้กับพวกบูชารูปเคารพอันชั่วร้ายที่ยังคงสร้างมลทินให้กับมาตุภูมิของเรา"
 middle_east_decisions.0004.desc.other:0 "นับตั้งแต่การยึดครองดินแดนศักดิ์สิทธิ์โดยพวกนอกรีต ผู้ติดตามของ [reformer.GetFaith.GetName] ได้กระจัดกระจายไปทั่วทุกสารทิศ ปราศจากผู้นำหรือเจตจำนงที่จะดำเนินศึกศักดิ์สิทธิ์ต่อไป\n\nทว่า ดูเหมือนว่าในที่สุดพวกเขาก็ได้รวมตัวกันอีกครั้ง ภายใต้การนำอันชาญฉลาดของ [reformer.GetFirstName] หลังจากทวงคืนนครศักดิ์สิทธิ์เมกกะและเมดินา และ ทำให้การอ้างสิทธิ์ของ [reformer.GetHerHis] ในฐานะคอลีฟะฮ์องค์ใหม่มีความชอบธรรม [reformer.GetFirstName] ก็พร้อมที่จะดำเนินมหาสงครามต่อต้านพวกนอกรีตต่อไป"
 middle_east_decisions.0004.a:0 "อัลลอฮุอักบัร!"
 middle_east_decisions.0004.b:0 "ข้าว่า ปีศาจที่รู้จักย่อมดีกว่าปีศาจที่ไม่รู้จัก..."

# Creating Israel, by Flavio Verna
 middle_east_decisions.0005.t:0 "ดินแดนพันธสัญญา"
 middle_east_decisions.0005.desc:0 "เมื่อเยรูซาเลมและดินแดนพันธสัญญาอยู่ภายใต้การควบคุมของชาวยิว ถึงเวลาแล้วสำหรับการสร้างสหราชอาณาจักรใหม่นามว่าอิสราเอล — เช่นเดียวกับอาณาจักรอันยิ่งใหญ่ในสมัยโบราณภายใต้ดาวิดและโซโลมอน\n\nในที่สุด ชาวยิวผู้ทนทุกข์ทรมานมานานก็ได้ควบคุมชะตากรรมของตนเองอีกครั้ง ดินแดนศักดิ์สิทธิ์จะไม่ถูกฉีกขาดโดยขุนศึกชาวคริสต์และมุสลิมที่ทำสงครามกันอีกต่อไป ขอให้อาณาจักรใหม่นี้นำมา ซึ่งยุคแห่งสันติภาพและความเจริญรุ่งเรืองแก่ภูมิภาค!"
 middle_east_decisions.0005.a:0 "อิสราเอลจงเจริญ!"
 middle_east_decisions.0006.desc.others:0 "หลังจากนำเยรูซาเล็มกลับคืนสู่การควบคุมของชาวยิว [scoped_ruler.GetTitledFirstName] ได้ตัดสินใจประกาศ [scoped_ruler.GetHerselfHimself] เป็น [scoped_ruler.GetTitleTierName] แห่งอิสราเอลที่ฟื้นฟูขึ้นใหม่\n\nการพลัดถิ่นอันยาวนานของชาวยิวอาจสิ้นสุดลงในที่สุด เนื่องจากชุมชนจำนวนมากของพวกเขาตัดสินใจเดินทางกลับสู่ดินแดนแห่งพันธสัญญา"
 middle_east_decisions.0006.a:0 "ถึงเวลาแล้ว!"
 middle_east_decisions.0006.b:0 "ข้าเข้าใจแล้ว..."

# Restore Jewish High Priesthood, by Flavio Verna
 middle_east_decisions.0007.t:0 "คณะปุโรหิต [scoped_ruler.GetFaith.GetAdjective] ใหม่"
 middle_east_decisions.0007.desc.intro:0 "ไม่มีโคเฮน – มหาปุโรหิตแห่งศาสนายูดาห์ – อีกเลยนับตั้งแต่ชาวโรมันทำลายพระวิหารหลังที่สองเมื่อราวหนึ่งพันปีก่อน ในที่สุด ตำแหน่งนี้ก็ได้รับการเติมเต็ม และคณะมหาปุโรหิตก็ได้รับการสถาปนาขึ้นใหม่\n\n"
 middle_east_decisions.0007.desc.me:0 "ในฐานะผู้นำชาวยิวผู้ทรงอิทธิพลและเคร่งศาสนา ชนชั้นปุโรหิตได้ตัดสินแล้วว่าข้าพเจ้าคือผู้ที่เหมาะสมที่สุดที่จะนำศาสนายิวเข้าสู่ยุคใหม่ แม้ว่าข้าพเจ้าจะขาดสายเลือดดั้งเดิมของอาโรนที่จำเป็นต่อการเป็นโคเฮน กาดอล แต่ทั้งปุโรหิตและฆราวาสต่างเฉลิมฉลองการ แต่งตั้งข้าพเจ้าให้เป็นประมุขแห่งคณะมหาปุโรหิต"
 middle_east_decisions.0007.desc.not_me:0 "เช่นเดียวกับปุโรหิตชาวยิวในสมัยโบราณ ตามธรรมเนียมแล้ว โคเฮน กาดอล จำเป็นต้องเป็นผู้สืบเชื้อสายมาจากอาโรน พี่ชายของโมเสส เนื่องจากการขาดผู้สมัครที่เหมาะสม ข้อกำหนดนี้จึงได้รับการยกเว้น แต่กระนั้น มหาปุโรหิตองค์ใหม่ก็ยังคงได้รับความเคารพจากชุมชนศาสนา [ROOT.Char.GetFaith.GetAdjective]"
 middle_east_decisions.0007.a:0 "ขอให้ความเป็นผู้นำของ [new_priest.GetHerHis] เป็นแรงบันดาลใจให้เรา!"
 middle_east_decisions.0007.a.me:0 "ความเป็นผู้นำของข้าพเจ้าจะเป็นแรงบันดาลใจให้เราทุกคน!"
 middle_east_decisions.0008.desc.others:0 "หลังจากการสถาปนาการมีอยู่ของชาวยิวอย่างมีนัยสำคัญในเยรูซาเลมขึ้นใหม่ [scoped_ruler.GetTitledFirstName] ได้ส่งเสริมการก่อตั้งคณะมหาปุโรหิต [new_priest.GetFaith.GetAdjective] ใหม่เพื่อนำชาวอิสราเอล\n\nนำโดย [new_priest.GetTitledFirstName] คาดว่าคณะสงฆ์นี้จะนำความสามัคคีและการชี้นำมาสู่ชุมชนที่กำลังเติบโตของอิสราเอล"
 middle_east_decisions.0008.a:0 "ขอให้ความเป็นผู้นำของ [new_priest.GetHerHis] เป็นแรงบันดาลใจให้เรา!"
 middle_east_decisions.0008.b:0 "ข้าเข้าใจแล้ว..."

# Restore Zoroastrian High Priesthood, by Flavio Verna
 middle_east_decisions.0009.t:0 "คณะปุโรหิต [scoped_ruler.GetFaith.GetAdjective] ใหม่"
 middle_east_decisions.0009.desc:0 "หลังจากการพลัดถิ่นและการกดขี่ข่มเหงภายหลังการพิชิตของชาวอาหรับ ศาสนาโซโรอัสเตอร์ได้รับการยอมรับจากชาวเปอร์เซียว่าเป็นหนทางที่แท้จริงเพียงหนึ่งเดียวสู่ความชอบธรรม [scoped_ruler.GetTitledFirstName] ได้มีคำสั่งให้สถาปนาตำแหน่ง [new_priest.GetTitleTierName] ซึ่งเป็นปุโรหิตแห่งปุโรหิต เพื่อปกครองเหนือลำดับชั้นสงฆ์ที่ฟื้นฟูขึ้นใหม่\n\n[new_priest.GetTitleTierName] จะทำหน้าที่เป็นผู้มีอำนาจทางศาสนาสูงสุดในโลก [scoped_ruler.GetFaith.GetAdjective] โดยมีอำนาจตั้งแต่การอวยพรการเดินทางทางทหารในอนาคตไปจนถึงการอนุญาตให้หย่าร้างแก่คู่สมรส"
 middle_east_decisions.0009.a:0 "เปลวไฟนิรันดร์ลุกโชนอีกครั้ง!"
 middle_east_decisions.0010.desc.muslims:0 "ผู้ติดตามที่ถูกสาปแช่งของ [scoped_ruler.GetFaith.HighGodName] ได้ทวงคืนดินแดนและอิทธิพลมากพอที่จะสถาปนาคณะปุโรหิตที่ดูหมิ่นศาสนาขึ้นใหม่ภายใต้การคุ้มครองของ [scoped_ruler.GetTitledFirstName]\n\nหากไม่หยุดยั้งในไม่ช้า พวกนอกรีตที่บูชาปีศาจเหล่านี้อาจพลิกกระแสการขยายตัวของอิสลามในเปอร์เซีย สร้างมลทินให้กับจิตใจของข้าแผ่นดินที่ไม่รู้ตัวด้วยคำโกหกและการบิดเบือน"
 middle_east_decisions.0010.desc.others:0 "ผู้ติดตามที่แปลกประหลาด บูชาไฟ ของ [scoped_ruler.GetFaith.HighGodName] ได้ทวงคืนดินแดนเปอร์เซียของบรรพบุรุษมากพอที่จะสถาปนาคณะปุโรหิตที่ใช้งานได้ขึ้นใหม่\n\nหากไม่หยุดยั้งในไม่ช้า พวกเขาอาจพลิกกระแสการขยายตัวของอิสลามและฟื้นฟูเอเชียภายใต้การคุ้มครองของเทพเจ้าเก่าแก่ของพวกเขา"
 middle_east_decisions.0010.a:0 "เกียรติแด่ [scoped_ruler.GetFaith.HighGodName]!"
 middle_east_decisions.0010.b:0 "ปีศาจของพวกเขาจะไม่ปกป้องพวกเขาจากอำนาจของ [ROOT.Char.GetFaith.HighGodName]!"
 middle_east_decisions.0010.c:0 "...บูชาไฟ?"

# The Saoyshant appears, by Flavio Verna
 middle_east_decisions.0011.t:0 "ผู้ถูกเลือกแห่งโซโรอัสเตอร์"
 middle_east_decisions.0011.desc:0 "นับตั้งแต่จักรวรรดิซาเซเนียนยอมจำนนต่อการรุกรานของชาวอาหรับ เปอร์เซียต้องทนทุกข์ภายใต้แอกของผู้ปกครองชาวโมฮัมเหม็ด เศษซากสุดท้ายของระเบียบโซโรอัสเตอร์เก่าได้ถอยร่นขึ้นเหนือไปยังที่ราบแห่งเอเชียกลาง แต่บัดนี้ ในที่สุด การปกครองของโซโรอัสเตอร์เหนือเปอร์เซียก็ได้รับการฟื้นฟูแล้ว\n\nการฟื้นตัวอย่างน่าอัศจรรย์นี้สามารถอธิบายได้ด้วยความเป็นผู้นำอันยอดเยี่ยมของข้าพเจ้าเท่านั้น และนักบวชจำนวนมากได้ประกาศให้ข้าพเจ้าเป็นเซาชยันต์ — ผู้ช่วยให้รอดของโลกที่โซโรอัสเตอร์เองได้กล่าวถึงเมื่อหลายพันปีก่อน หลังจากยอมรับบทบาทนี้ ข้าพเจ้าได้รับการเคารพนับถือในฐานะสัญลักษณ์อันศักดิ์สิทธิ์โดยชาวโซโรอัสเตอร์ทุกหนทุกแห่ง"
 middle_east_decisions.0011.a:0 "ข้าพเจ้าจะนำผลประโยชน์มาสู่ทุกคน"
 all_held_counties:0 "เคาน์ตีของพวกนอกรีตทั้งหมด"
 middle_east_decisions.0013.desc:0 "นับตั้งแต่จักรวรรดิซาเซเนียนยอมจำนนต่อการรุกรานของชาวอาหรับ เปอร์เซียต้องทนทุกข์ภายใต้แอกของผู้ปกครองชาวโมฮัมเหม็ด เศษซากสุดท้ายของระเบียบโซโรอัสเตอร์เก่าได้ถอยร่นขึ้นเหนือไปยังที่ราบแห่งเอเชียกลาง แต่บัดนี้ ในที่สุด การปกครองของโซโรอัสเตอร์เหนือเปอร์เซียก็ได้รับการฟื้นฟูแล้ว\n\nการฟื้นตัวอย่างน่าอัศจรรย์นี้สามารถอธิบายได้ด้วยความเป็นผู้นำอันยอดเยี่ยมของ [scoped_ruler.GetFirstNamePossessive] เท่านั้น และนักบวชจำนวนมากได้ประกาศให้ [scoped_ruler.GetHerHim] เป็นเซาชยันต์ — ผู้ช่วยให้รอดของโลกที่โซโรอัสเตอร์เองได้กล่าวถึงเมื่อหลายพันปีก่อน หลังจากยอมรับบทบาทนี้ [scoped_ruler.GetTitledFirstNameNoTooltip] ได้รับการเคารพนับถือในฐานะสัญลักษณ์อันศักดิ์สิทธิ์โดยชาวโซโรอัสเตอร์ทุกหนทุกแห่ง"
 middle_east_decisions.0013.desc.muslims:0 "ครั้งหนึ่งเคยถูกลดสถานะเป็นผู้อาศัยในทะเลทรายที่ถูกเนรเทศ นักบวชบูชาไฟของโซโรอัสเตอร์ผู้ดูหมิ่นศาสนาที่ถูกสาปแช่งได้ฟื้นคืนชีพจากเถ้าถ่านและอ้างสิทธิ์ในบัลลังก์แห่งเปอร์เซีย!\n\nเต็มไปด้วยความภาคภูมิใจอันบ้าคลั่ง [scoped_ruler.GetTitleTierName] ของพวกเขาได้ตัดสินใจประกาศ [scoped_ruler.GetHerselfHimself] เป็นเทพเจ้าที่มีชีวิต"
 middle_east_decisions.0013.desc.others:0 "นับตั้งแต่จักรวรรดิซาเซเนียนยอมจำนนต่อการรุกรานของชาวอาหรับ ผู้ติดตามของโซโรอัสเตอร์ก็ต้องหลบหนี การพลัดถิ่นของพวกเขาสิ้นสุดลงในยุคหลัง ๆ เนื่องจากผู้ศรัทธา [scoped_ruler.GetFaith.GetAdjective] สามารถฟื้นฟูจักรวรรดิโบราณของตนได้\n\nเนื่องจากมีส่วนรับผิดชอบไม่น้อยต่อเหตุการณ์พลิกผันที่ไม่คาดคิดนี้ [scoped_ruler.GetTitleTierName] ของพวกเขาจึงตัดสินใจประกาศ [scoped_ruler.GetHerselfHimself] เป็นเซาชยันต์ ผู้กอบกู้ตามคำทำนายแห่งลัทธิของพวกเขา"
 middle_east_decisions.0013.a:0 "ขอให้ [scoped_ruler.GetSheHe] นำผลประโยชน์มาสู่เราทุกคน!"
 middle_east_decisions.0013.b:0 "ความบ้าคลั่งและเวทมนตร์ปีศาจ!"
 middle_east_decisions.0013.c:0 "ข้าเข้าใจแล้ว..."

# Create Sultanate of Rum, by Flavio Verna
 middle_east_decisions.0014.t:0 "โรมใหม่"
 middle_east_decisions.0014.desc:0 "ด้วยการพิชิตดินแดนอันอุดมสมบูรณ์แห่งเอเชียไมเนอร์ ข้าพเจ้าได้สะสมอำนาจมากพอที่จะก่อตั้งรัฐสุลต่านใหม่ ซึ่งแน่นอนว่าจะยิ่งใหญ่กว่าโรมเองเสียอีก\n\nยังมีงานที่ต้องทำอีกมาก ทว่าข้าพเจ้าไม่สงสัยเลยว่านักประวัติศาสตร์จะจารึกช่วงเวลานี้ไว้ว่าเป็นหนึ่งในก้าวย่างอันยิ่งใหญ่ในการพิชิตยุโรปโดยผู้ติดตามของ [scoped_ruler.GetFaith.HighGodName]"
 middle_east_decisions.0014.a:0 "ขอให้ตะวันตกสั่นสะท้าน!"
 middle_east_decisions.0015.desc.liege:0 "หลังจากชัยชนะหลายครั้งในอานาโตเลีย [scoped_ruler.GetTitledFirstName] ได้ตัดสินใจสวมมงกุฎให้ [scoped_ruler.GetHerselfHimself] เป็น [scoped_ruler.GetTitleTierName] แห่งรูม โดยอ้างว่า [scoped_ruler.GetSheHe] ไม่มีความจงรักภักดีต่อข้าพเจ้าอีกต่อไป และจะดำเนินศึกต่อต้านพวกนอกรีตตามเงื่อนไขของ [scoped_ruler.GetHerHis] เอง"
 middle_east_decisions.0015.desc.romans:0 "ขุนศึกป่าเถื่อน [scoped_ruler.GetTitledFirstName] ได้กรุยทางของ [scoped_ruler.GetHerHis] ผ่านอานาโตเลียและสถาปนาสุลต่านรัฐใหม่ขึ้นในภูมิภาค\n\nราวกับว่านี่ยังเป็นการดูหมิ่นไม่เพียงพอ ในการแสดงความโอหังอันน่ารังเกียจ [scoped_ruler.GetSheHe] ได้ตัดสินใจอ้างสิทธิ์ในตำแหน่ง [scoped_ruler.GetTitleTierName] แห่งโรมให้กับ [scoped_ruler.GetHerselfHimself]"
 middle_east_decisions.0015.desc.others:0 "มณฑลอันอุดมสมบูรณ์แห่งเอเชียไมเนอร์ ซึ่งครั้งหนึ่งเคยเป็นฐานที่มั่นของศาสนาคริสต์ บัดนี้ได้ตกอยู่ภายใต้การปกครองของ [scoped_ruler.GetTitledFirstName] ผู้ ซึ่งได้ก่อตั้งรัฐสุลต่านใหม่ขึ้นในภูมิภาค"
 middle_east_decisions.0015.a:0 "[scoped_ruler.GetSheHe] กล้าดีอย่างไร!"
 middle_east_decisions.0015.b:0 "ข้าเข้าใจแล้ว..."

 # Revive the Armenian Empire, by Ewan Cowhig Croft
 middle_east_decisions.1001.t:0 "อินทรีใหม่ผงาด"
 middle_east_decisions.1001.desc:0 "เป็นเวลาหลายศตวรรษแล้วที่อาร์เมเนียได้แผ่อิทธิพลระดับนี้ครั้งสุดท้ายในเลแวนต์และคอเคซัส จักรวรรดิคู่แห่งตะวันออกและตะวันตกได้ทุบตีเราจนเลือดตกยางออกครั้งแล้วครั้งเล่า บางครั้งตะวันตกพูดภาษาละติน บางครั้งกรีก และบางครั้งตะวันออกพูดภาษาเปอร์เซีย บางครั้งอาหรับ แต่จักรวรรดิเหล่านี้มักต่อสู้กันเสมอ และดินแดนโบราณของเราดูเหมือนจะเป็นสมรภูมิเสมอ\n\nหลังจากวันนี้ จะไม่มีอีกต่อไป ข้าพเจ้าได้แกะสลักอาณาเขตเก่าของทีกราเนสมหาราชขึ้นใหม่ และธงอินทรีแห่งอาร์เมเนียยิ่งใหญ่ก็ผงาดขึ้นอีกครั้ง!"
 middle_east_decisions.1001.a:0 "ข้าพเจ้าจะก้าวไปสู่สิ่งที่ยิ่งใหญ่กว่านี้อีก!"
 middle_east_decisions.1001.b:0 "ความสำเร็จไม่น้อยลงเพียง เพราะเป็นการซ้ำรอย"
 middle_east_decisions.1002.desc:0 "สถานการณ์แปลกประหลาดได้ก่อตัวขึ้นในเทือกเขาคอเคซัสมาสักระยะหนึ่งแล้ว แม้จะมีความเป็นไปได้น้อยนิด [founder.GetFullNameNoTooltip] ก็ประสบความสำเร็จในการสร้างอาณาจักรอันกว้างใหญ่ไพศาล แผ่ขยายจากทะเลแคสเปียนทางตะวันออกไปยังชายฝั่งทะเลเมดิเตอร์เรเนียนทางตะวันตก แม้จะไม่สมบูรณ์แบบ แต่สิ่งนี้ก็ได้สร้างจักรวรรดิที่ตายไปนานแล้วของทีกราเนสมหาราชขึ้นมาใหม่โดยคร่าวๆ ซึ่งเป็นสถานการณ์ที่ผู้ประกาศของ [founder.GetFullNameNoTooltip] รีบป่าวประกาศ\n\nธงอินทรีแห่งอาร์เมเนียยิ่งใหญ่ผงาดขึ้นอีกครั้ง แต่จะนานแค่ไหน?"
 middle_east_decisions.1002.a:0 "ศักดิ์ศรีของจักรวรรดิต้องการมากกว่าแค่ดินแดน"
 middle_east_decisions.1002.b:0 "ครั้งนี้ จะไม่มีใครฉีกเราออกจากกันได้"
 middle_east_decisions.1002.c:0 "เป็นเพียงเชิงอรรถ เช่นเดียวกับบรรพบุรุษของมัน"

 # Found the Empire of Beth Nahrain, by Anna Johansson
 middle_east_major_decisions.1020.t: "บ้านแห่งแม่น้ำ"
 middle_east_major_decisions.1020.desc: "จะเป็นไปได้หรือไม่ที่จะรวมอาณาจักรต่างๆ รอบแม่น้ำไทกริสและยูเฟรติสไว้ภายใต้ธงผืนเดียวกัน? จักรวรรดิอันกว้างใหญ่ไพศาลจนกษัตริย์และราชินีในอดีตต้องอิจฉา!"
 middle_east_major_decisions.1020.tt: "เผยแพร่และรวม [culture|E] $assyrian$"
 middle_east_major_decisions.1020.lack_nestorian: "หากท่านเป็นผู้นับถือ [faith|E] [GetFaithByKey('nestorian').GetAdherentName] อยู่แล้ว จะได้รับตัวเลือก [GetTrait('crusader_king').GetName( GetNullCharacter )]"
 middle_east_major_decisions.1020.promote_culture.tt: "ความสามารถของ [GetPlayer.GetCouncillorPosition( 'councillor_steward' ).GetPositionName] ของข้าพเจ้าในการทำ [councillor_task|E] $task_promote_culture|V$ จะมีประสิทธิภาพมากขึ้นใน [counties|E] ที่มี [GetModifier('promote_culture_beth_nahrain_modifier').GetNameWithTooltip] อยู่"
 promote_culture_beth_nahrain_modifier_custom_desc: "ทุกเคาน์ตีภายในเบธ นาห์เรน ที่ไม่มี [culture|E] $assyrian$"
 promote_culture_beth_nahrain_modifier: "การไหลขึ้นลง"
 promote_culture_beth_nahrain_modifier_desc: "อิทธิพลของ $assyrian$ กลายเป็นส่วนหนึ่งของชีวิตที่ยอมรับได้ในภูมิภาคนี้แล้ว และผู้อยู่อาศัยก็พร้อมที่จะยอมรับขนบธรรมเนียมและค่านิยมของ $assyrian$ มากขึ้น"
 middle_east_major_decisions.1020.learning.desc: "หากท่านมุ่งเน้น [empire|E] ของท่านไปที่ [learning|E]"
 learning_beth_nahrain_house_modifier: "ความรู้คืออำนาจ"
 learning_beth_nahrain_house_modifier_desc: "การพิชิตตะวันออกกลางได้ฟื้นฟูวัฒนธรรมซีเรียค ทำให้พวกเขาสามารถขยายภูมิปัญญาของตนได้"
 middle_east_major_decisions.1020.martial.desc: "หากท่านมุ่งเน้น [empire|E] ของท่านไปที่ [martial|E]"
 martial_beth_nahrain_house_modifier: "วินัยและระเบียบ"
 martial_beth_nahrain_house_modifier_desc: "การพิชิตตะวันออกกลางได้ฟื้นฟูวัฒนธรรมซีเรียค ทำลายล้างสมรภูมิเพื่อขยายพรมแดนของตน"
 middle_east_major_decisions.1020.nestorian.desc: "หากท่านมุ่งเน้น [empire|E] ของท่านไปที่ [faith|E] [GetFaithByKey('nestorian').GetAdherentName]"
 middle_east_major_decisions.1020.no_faith.desc: "หากท่านเลือกที่จะเปลี่ยนมานับถือ [faith|E] [GetFaithByKey('nestorian').GetAdherentName]"
 completely_controls_jazira_mesopotamia_tt: "[completely_controls|E] [GetTitleByKey('k_jazira').GetNameNoTier] และ [GetTitleByKey('k_mesopotamia').GetNameNoTier]"
 has_titles_jazira_mesopotamia_tt: "มี [title|E] ของ [GetTitleByKey('k_jazira').GetNameNoTier] และ [GetTitleByKey('k_mesopotamia').GetNameNoTier]"
 has_title_and_completely_control_jerusalem_tt: "[completely_control|E] และถือครอง [GetTitleByKey('k_jerusalem').GetName]"
 has_title_and_completely_control_syria_tt: "[completely_control|E] และถือครอง [GetTitleByKey('k_syria').GetName]"
 found_empire_of_beth_nahrain_decision_confirm: "ขอให้แม่น้ำไหลรวมเป็นหนึ่ง!"
 middle_east_major_decisions.1020_fervor: "การก่อตั้งเบธ นาห์เรน"

 middle_east_decisions.1020.t: "จักรวรรดิเบธ นาห์เรน"
 middle_east_decisions.1020.desc: "เช่นเดียวกับแม่น้ำที่ไหลอย่างมั่นคง จักรวรรดินี้ ซึ่งบัดนี้อยู่เบื้องหน้าข้าพเจ้าก็จะเติบโต เช่นกัน\n\nการรวมดินแดนเหล่านี้จะยืนหยัดผ่านการทดสอบของกาลเวลา — ข้าพเจ้าเพียงแค่ต้องผลักดันพวกเขาไปในทิศทางที่ถูกต้องเล็กน้อย เพื่อให้เป็น เช่นนั้นต่อไป\n\nเพราะบัดนี้ข้าพเจ้าต้องเลือกเส้นทางข้างหน้า เพื่อนำทางผู้คนของข้าพเจ้าผ่านคลื่นแห่งการเปลี่ยนแปลงนับไม่ถ้วนที่จะมาถึง"
 middle_east_decisions.1020.a: "ปากกาทรงพลังกว่าดาบ"
 middle_east_decisions.1020.b: "สมรภูมิเรียกหา"
 middle_east_decisions.1020.c: "ข้าพเจ้าเชื่อในศรัทธาของข้าพเจ้า"
 middle_east_decisions.1020.d: "มาแสดงศรัทธา #EMP ที่แท้จริง#! ให้พวกเขาเห็น!"
 beth_nahrain_crusader_desc: "การบรรจบกัน เชื่อมโยงจักรวรรดิเป็นหนึ่งเดียว"
 
 # Dar al-Islam
 middle_east_decisions.1100.t: "ดารุลอิสลาม"
 middle_east_decisions.1100.desc: "นับตั้งแต่สมัยกาหลิบรอชิดูน ศาสนาอิสลามก็มิเคยได้ยืนหยัดเป็นหนึ่งเดียวภายใต้ธงผืนเดียวกัน นำทางด้วยจุดประสงค์หนึ่งเดียว วิสัยทัศน์หนึ่งเดียว [Glossary( 'ดารุลอิสลาม', 'DAR_AL_ISLAM_GLOSS' )] ที่แท้จริง\n\nจากทุกมุมโลก เหล่า [GetReligionByKey('islam_religion').GetAdherentNamePluralNoTooltip] บัดนี้ต่างเดินทางมายัง [ROOT.Char.GetCapitalLocation.GetNameNoTooltip] ผู้แสวงบุญและเจ้าชาย นักปราชญ์และทหาร จากทะเลทรายอันไกลโพ้นและท่าเรืออันแออัด จากทุกสำนักและทุกนิกาย พวกเขามาชุมนุมกันเบื้องหน้าข้า — เพื่อก้มศีรษะ เพื่อปฏิญาณหัวใจ\n\nมีเพียงกาลเวลาที่จะบอกได้ว่าความเป็นหนึ่งเดียวนี้จะคงอยู่ – หรือถูกลิขิตให้เลือนหายไปในประวัติศาสตร์อีกครั้ง บัดนี้ มวลชนจะได้ประจักษ์ถึงสันติสุขอันครอบคลุมทั่วหล้าของอิสลาม"
 middle_east_decisions.1100.a: "โลกทั้งใบจักต้องเป็นของเหล่าพหุอิสลาม!"
 DAR_AL_ISLAM_GLOSS: "#bold ดารุลอิสลาม#! (ดารุลอิสลาม)#!, แปลว่า "พหุอิสลาม" (house of Islam), เป็นคำที่หมายถึงดินแดนภายใต้อำนาจอธิปไตยของมุสลิม ซึ่งปกครองเหนือพสกนิกรทั้งที่เป็นมุสลิมและไม่ใช่มุสลิม"
 
 middle_east_decisions.1101.intro: "นับตั้งแต่สมัยกาหลิบรอชิดูน ศาสนาอิสลามก็มิเคยเป็นกองกำลังที่รวมเป็นหนึ่งเดียว ทว่า ดูเหมือนว่า [dar_al_islam_ruler.GetShortUIName] ได้ทำสิ่งที่เป็นไปไม่ได้และสร้าง [Glossary( 'ดารุลอิสลาม', 'DAR_AL_ISLAM_GLOSS' )] หนึ่งเดียวที่แท้จริงขึ้นมา"
 middle_east_decisions.1101.islam_desc: "เหล่า [GetReligionByKey('islam_religion').GetAdherentNamePluralNoTooltip] จากทั่วทุกมุมโลกกำลังหลั่งไหลไปอยู่ใต้ธงของ [dar_al_islam_ruler.GetHerHis] มอบความแข็งแกร่ง ความมั่นคง และความรุ่งเรืองที่การปกครองใหม่นี้ถูกลิขิตให้นำมา"
 middle_east_decisions.1101.other_desc: "กาลเวลาจะเป็นเครื่องพิสูจน์ว่า [dar_al_islam_ruler.GetTitleAsNameNoTooltip] ผู้นี้จะปกครอง เช่นไร เราจำต้องหยุดและสงสัย ว่าสิ่งนี้จะหมายความว่าอย่างไรต่อโลกส่วนที่เหลือ?"
 middle_east_decisions.1101.a: "ทรงพระเจริญ [dar_al_islam_ruler.GetTitleAsNameNoTooltip]!"
 middle_east_decisions.1101.b: "บางที ข้าเองก็ควรเข้าร่วมกับ [dar_al_islam_ruler.GetHerHim] หรือไม่?"
 middle_east_decisions.1101.c: "ช่างเป็นเหตุการณ์ที่น่าตระหนกยิ่งนัก"
 
 middle_east_decisions.1102.desc: "นี่หมายความว่าข้ามิได้เป็นผู้มีอำนาจทางศาสนาของศรัทธา [ROOT.Char.GetFaith.GetName] อีกต่อไป และข้า ก็ เช่นเดียวกับ [GetReligionByKey('islam_religion').GetAdherentName] อื่นๆ จักต้องยอมจำนนต่อ [dar_al_islam_ruler.GetTitleAsNameNoTooltip] องค์ใหม่"
 middle_east_decisions.1102.a: "กาลเวลาจะบอกเองว่า [dar_al_islam_ruler.GetSheHe] คู่ควรหรือไม่"
 middle_east_decisions.0004.desc.sunni:0 "Ever since the infidel occupation of the holy land, the true followers of the Prophet have been scattered to the four winds, without the leadership or will to resume the sacred struggle.\n\nThis ends today. By [reformer.GetFaith.HighGodNamePossessive] mercy, [reformer.GetFirstName] has reclaimed Mecca and Medina and stopped the tide of infidels swarming Arabia. With the backing of several respected scholars of the book, [reformer.GetSheHe] has been recognized as the new Caliph of [reformer.GetFaith.GetName] and stands ready to lead [reformer.GetHerHis] followers against the wicked idolaters still polluting our homeland."
