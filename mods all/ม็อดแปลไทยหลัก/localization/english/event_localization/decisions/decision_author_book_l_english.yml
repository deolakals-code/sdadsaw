 author_book.0001.t: "คุณธรรมแห่งบทกวี"
 author_book.0001.desc: "มีเพียงไม่กี่ประเภทที่จะบริสุทธิ์และทรงพลังเท่า [Glossary( 'กวีนิพนธ์ฉือ', 'CI_GLOSS' )] บทกวีต่างท่อนสามารถถ่ายทอดหัวข้อหรืออารมณ์ที่แตกต่างกันได้ เปิดโอกาสให้กวีคนโปรดทั้งหลายของข้าได้แสดงความรู้สึกอันลึกซึ้งออกมาอย่างกระชับและงดงาม\n\nบัดนี้ถึงเวลาแล้วที่ข้าจะบรรจงถ้อยคำของข้าลงในทำนอง ข้าต้องเลือกอย่างระมัดระวังว่าจะใช้ทำนองใด"
 CI_GLOSS: "#bold กวีนิพนธ์ฉือ#! — รูปแบบหนึ่งของบทกวี ซึ่งได้รับความนิยมเพิ่มขึ้นในสมัยราชวงศ์ถังและซ่ง\nบทกวีมีไว้เพื่อขับขานและปรับแก่นเรื่องให้เข้ากับท่อนบทร้อยกรองที่มีความยาวต่างกันไป เพื่อให้เข้ากับทำนองที่เกี่ยวข้อง\n\nเนื่องจากตัวบทกวีฉือเองมักจะหยิบยืมอักขระจากบทกวีเก่าก่อน ความหมายตามตัวอักษรจึงอาจคลุมเครือหากปราศจากการฝึกฝนที่เพียงพอ"


 author_book.0001.a: "ข้าจะใช้ #italic [SCOPE.Custom('GetCiPoemName')]#!"
 author_book.0001.a.tt: "#italic [SCOPE.Custom('GetCiPoemName')]#! จะเป็นชื่อบทกวีของข้า"
