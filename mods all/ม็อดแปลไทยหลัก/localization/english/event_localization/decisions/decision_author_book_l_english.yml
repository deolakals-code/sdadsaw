 author_book.0004.t: "ว่าด้วยคุณธรรมในยุคสมัยของเรา"
 author_book.0004.desc: "ขณะที่ข้านั่งลงที่โต๊ะเพื่อครุ่นคิดถึงงานที่รออยู่เบื้องหน้า สายตาของข้าก็พลันไปเห็น [Glossary( 'จตุรสมบัติแห่งห้องหนังสือ', 'FOUR_TREASURES')] ในฐานะบัณฑิต นี่คือเครื่องมือในวิชาชีพของข้า ด้วยสิ่งเหล่านี้ ข้าสามารถใช้เหตุผลและให้ความกระจ่างแก่ผู้อื่นได้\n\nแต่ข้าควรจะกล่าวถึงสิ่งใดเล่า?\n\nข้าอาจจะลองให้มุมมองใหม่แก่เหตุการณ์ในอดีต หรือข้าอาจจะเริ่มต้นบางสิ่งที่ร่วมสมัยกว่าโดยการวิเคราะห์การกระทำอันดีงามโดยใช้เหตุการณ์ล่าสุด"
