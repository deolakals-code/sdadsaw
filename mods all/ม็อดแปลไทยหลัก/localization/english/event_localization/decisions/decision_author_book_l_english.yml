 monograph_description_quality_weak: "แม้ว่าจะเป็นประโยชน์ในฐานะบทนำ แต่หนังสือเล่มนี้ส่วนใหญ่คัดลอกมาจากงานก่อนหน้า"
 monograph_description_quality_mid: "หนังสือเล่มนี้มีข้อมูลเชิงลึกที่เป็นต้นฉบับหลายประการในสาขานี้"
 monograph_description_quality_great: "หนังสือเล่มนี้เขียนขึ้นด้วยความชัดเจนและยอดเยี่ยม และมีแววว่าจะเป็นข้อมูลอ้างอิงที่ยอดเยี่ยมสำหรับบัณฑิตรุ่นต่อๆ ไป"
 
 author_book.1000.t: "[newly_created_artifact.GetNameNoTooltip]"
 author_book.1000.poem_intro.desc: "ขณะที่ข้าขับขานบทกวีที่เพิ่ง แต่งใหม่ให้ [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('trusted_influencer'))] [trusted_influencer.GetFirstName] ฟัง ข้าอดไม่ได้ที่จะรู้สึกภาคภูมิใจในสิ่งที่ข้าได้ทำสำเร็จ หัวข้อ [SCOPE.Custom('GetCiPoemTheme')] เป็นสิ่งที่ข้ารู้สึกว่าไม่เคยมีใครจับใจความได้ เช่นนี้มาก่อน ข้ามองไปที่ [trusted_influencer.GetFirstNameNoTooltip] อย่างคาดหวัง รอคอยการประเมินผลงานของข้าจาก [trusted_influencer.GetHerHis]\n\n"
 author_book.1000.poem_weak.desc: ""ทุกสิ่งล้วนมีความงาม แต่ไม่ใช่ทุกคนที่จะมองเห็น" [trusted_influencer.GetHerHis] กล่าวด้วย—สิ่งที่คงจะเป็นความชื่นชมกระมัง?\n\nบางทีผลงานที่เพิ่งสร้างนี้อาจจะไม่งดงามเท่าที่ข้าหวังไว้"
 author_book.1000.poem_mid.desc: ""เป็นผลงานที่น่าประทับใจ" [trusted_influencer.GetSheHe] มองข้าอย่างชื่นชมหลังจากเงียบไปนานราวชั่วนิรันดร์"
 author_book.1000.poem_great.desc: ""เรียนรู้สิ่งใหม่ขณะทบทวนสิ่งเก่า แล้วท่านอาจกลายเป็นครูของผู้อื่นได้" [trusted_influencer.GetSheHe|U] ชื่นชมผลงานชิ้นเอกใหม่ของข้าอย่างชัดเจน"

 author_book.1000.prose_intro.desc: "การเขียนเชิงโต้แย้งเป็นสิ่งที่ควรจะเกิดขึ้นโดยธรรมชาติสำหรับบัณฑิตทุกคน ในบทความของข้าเกี่ยวกับ [SCOPE.Custom('GetProseTheme')] ข้าได้ฝึกฝนทักษะในการใช้ตัวอย่างเพื่อสนับสนุนข้อความยืนยันหลัก\n\n"
 author_book.1000.prose_weak.desc: ""เหตุผลของท่านฟังดูดี แต่ข้าเห็นจุดที่ควรปรับปรุงเล็กน้อย" คือสิ่งที่ [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('trusted_influencer'))] [trusted_influencer.GetFirstName] ของข้าบอกข้า [trusted_influencer.GetSheHe] ตั้งใจจะสนับสนุนอย่างชัดเจน จากนั้นก็อธิบายข้อสังเกตบางประการในบทความของข้าที่ [trusted_influencer.GetSheHe] กลัวว่าผู้อ่านอาจพลาดไป"
 author_book.1000.prose_mid.desc: ""นี่เป็นงานเขียนที่ดี ท่านจับสาระสำคัญของปัญหาได้ดี" คือสิ่งที่ [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('trusted_influencer'))] [trusted_influencer.GetFirstName] ของข้ากล่าว ในฐานะผู้อ่านคนแรกของผลงานข้า"
 author_book.1000.prose_great.desc: ""ท่านสามารถพูดได้อย่างชัดเจนแจ่มแจ้ง ซึ่งน้อยคนนักในยุคของเราจะครอบครอง!" [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('trusted_influencer'))] [trusted_influencer.GetFirstName] ของข้าประกาศ\nเห็นได้ชัดว่าข้าสามารถกระตุ้นอารมณ์ที่แท้จริงด้วยถ้อยคำของข้าได้"

 author_book.1000.scholarship_intro.desc: "ไม่ใช่ความพยายามที่รวดเร็ว แต่ในที่สุดข้าก็มาถึงจุดสิ้นสุด เอกสารวิชาการฉบับใหม่ของข้าเกี่ยวกับ [SCOPE.Custom('GetMonographTopic')] เสร็จสมบูรณ์แล้ว และเวลาที่ข้าใช้ไปกับการค้นคว้าเอกสารที่เกี่ยวข้อง ทำให้ข้าเชี่ยวชาญในหัวข้อนี้มากขึ้นกว่าที่เคย\n\n"
 author_book.1000.scholarship_weak.desc: ""เป็นก้าวสำคัญในอาชีพของท่าน!" [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('trusted_influencer'))] [trusted_influencer.GetFirstName] ของข้าประกาศ และข้าเห็นความภาคภูมิใจในดวงตาของ [trusted_influencer.GetHerHis] ถึงกระนั้น ข้าก็สงสัยว่าข้าจะทำได้ดีกว่านี้หรือไม่หากได้รับโอกาสครั้งที่สอง"
 author_book.1000.scholarship_mid.desc: ""หนังสือที่มีความสามารถและให้ข้อมูล ซึ่งข้าจะแนะนำให้ผู้อื่น!" คือสิ่งที่ [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('trusted_influencer'))] [trusted_influencer.GetFirstName] ของข้ากล่าวเมื่อ [trusted_influencer.GetSheHe] อ่านจบทั้งหมด\nข้าควรจะมีความสุขกับงานของข้า แต่ก็ยากที่จะไม่รู้สึกว่าข้าสามารถเขียนสิ่งที่ดียิ่งขึ้นไปอีกในอนาคต"
 author_book.1000.scholarship_great.desc: ""ผลงานชิ้นเอกที่จะจารึกชื่อของท่านไว้ท่ามกลางนักประพันธ์ที่ยิ่งใหญ่ที่สุดในยุคของเรา!"\nผู้อ่านคนแรกของข้า [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('trusted_influencer'))] [trusted_influencer.GetFirstName] ของข้า กล่าวหลังจากอ่านงานจบ นี่คือความสำเร็จที่ข้าจะไม่ลืมในเร็ววันนี้"

 author_book.1000.a: "ข้าได้เรียนรู้มากมายจากประสบการณ์นี้"
 author_book.1000.b: "เป็นผลงานที่ทำได้ดี"
 author_book.1000.c: "เห็นได้ชัดว่าข้ามีความสามารถ"
 author_book.1000.d: ""นี่จะเป็นของขวัญจากข้าถึงท่าน!""
