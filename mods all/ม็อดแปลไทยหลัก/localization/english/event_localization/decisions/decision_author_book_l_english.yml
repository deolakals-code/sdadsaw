 prose_quality_weak: "งานเขียนตรงประเด็น แต่ไม่ได้โดดเด่นกว่างานของคนร่วมสมัยในทางใดที่ชัดเจน"
 prose_quality_mid: "งานชิ้นนี้รวบรวมขึ้นอย่างชำนาญโดยผู้เชี่ยวชาญในประเภทนี้ และถือเป็นงานที่น่าสนใจสำหรับบัณฑิตทุกคน"
 prose_quality_great: "รูปแบบวรรณกรรมที่เรียบง่ายแสดงให้เห็นถึงความเชี่ยวชาญทางภาษาอย่างยิ่ง การโต้แย้งถูกนำเสนออย่างเชี่ยวชาญ ซึ่งน่าประทับใจสำหรับนักเขียนร่วมสมัยทุกคน"

 author_book.0005.t: "การพรรณนาโลก"
 author_book.0005.desc: "ด้วยความพยายามอย่างยิ่งยวด จิตใจสามารถทะลุทะลวงความหมายเบื้องหลังธรรมชาติของโลกได้ การอธิบายและจัดระเบียบข้อสังเกตเหล่านี้เป็นข้อความ เพื่อให้ผู้อื่นได้เรียนรู้ถือเป็นสิ่งที่ยิ่งใหญ่กว่า แต่ก็ต้องใช้ความพยายามและเวลามากกว่า เช่นกัน\n\nขณะที่ข้านั่งลงเพื่อร่างแผนสำหรับเอกสารวิชาการฉบับใหม่ ข้าต้องตัดสินใจว่าจะมุ่งเน้นไปที่ด้านใด คณิตศาสตร์และภูมิศาสตร์ต่างก็เป็นวิชาที่คู่ควร ซึ่งเพื่อนร่วมงานหลายคนของข้าก็สนใจ เช่นกัน"
