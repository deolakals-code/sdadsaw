l_english: 
 jewish_events.0001.t:0 "อวสานแห่งธรรมเนียมพหุภรรยาของชาว[ROOT.Char.GetFaith.GetAdjectiveNoTooltip]"
 jewish_events.0001.desc:0 "ตลอดหลายศตวรรษที่ผ่านมา ยังคงเป็นที่คลุมเครือว่าการมีภรรยาหลายคนนั้นเป็นที่อนุญาตหรือไม่ แต่หลังจากการประชุมสภาย่อยของเหล่ารับบีผู้ทรงอิทธิพลที่สุดแห่ง [ROOT.Char.GetFaith.GetName] ได้มีการตัดสินว่าการมีภรรยาหลายคนมิใช่ธรรมเนียมปฏิบัติที่ได้รับอนุญาตตามหลักศรัทธา[ROOT.Char.GetFaith.GetAdjectiveNoTooltip]อีกต่อไป\n\nการตัดสินใจนี้มีแรงจูงใจหลักมาจากความกังวลว่าบุคคลเพียงผู้เดียวอาจไม่สามารถดูแลเลี้ยงดูภรรยาหลายคนได้อย่างเพียงพอ และธรรมเนียมการมีภรรยาหลายคนอาจนำไปสู่การที่เหล่าภรรยากระทำการอันเป็นบาปด้วยความอิจฉาริษยาต่อกัน"
 jewish_events.0001.a:0 "ให้เป็นไป เช่นนั้นเถิด"
 jewish_events.0001.b:0 "พวกเราชาว[ROOT.Char.GetCulture.GetCollectiveNoun]จะไม่ละทิ้งวิถีทางของเรา!"
 jewish_events.0001.c:0 "ข้าคิดว่าเหล่ารับบีลืมตนไปแล้ว"
