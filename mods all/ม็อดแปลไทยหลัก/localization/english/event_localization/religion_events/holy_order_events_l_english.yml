l_english: 
 holy_order_hired_message:0 "จ้างกองทัพศักดิ์สิทธิ์"
 holy_order.hired_message:1 "[holy_order.GetName] ได้รับการเรียกจาก [actor.GetUIName]"
 holy_order_hired_by_enemy_message:0 "กองทัพศักดิ์สิทธิ์ของศัตรู"
 holy_order.hired_by_enemy:1 "[holy_order.GetName] ได้รับการเรียกจาก [actor.GetUIName] และบัดนี้ยืนหยัดต่อต้านเรา"
 holy_order.destroyed_message:1 "[title.GetName] ได้ถูกทำลายแล้ว"
 holy_order_expanded:0 "กองทัพศักดิ์สิทธิ์ขยายตัว"
 holy_order.new_lease:1 "บัดนี้ [holy_order.GetName] กำลังเช่า [barony.GetName] จาก [former_holder.GetTitledFirstName]"

 holy_order.0001.t:0 "กองทัพศักดิ์สิทธิ์"
 holy_order.0001.desc_opening:0 "[recipient.Custom2('MyCharacterIntroductionNoComma', ROOT.Char)|U] ยืนรอข้าอยู่ด้านนอก พร้อมด้วยข้าวของและผู้ติดตามของ [recipient.GetHerHis] เตรียมพร้อมออกเดินทาง\n\n"
 holy_order.0001.desc:0 ""แล้ว นายหญิง/นายท่าน [root.GetLadyLord] ของข้า การเดินทางครั้งนี้จะนำข้าพเจ้าไปที่ใด?""
 holy_order.0001.desc_relation:0 ""เช่นนั้นแล้ว [recipient.Custom2('RelationToMeShort', ROOT.Char)] การเดินทางนี้จะนำพาข้าไปที่ใด?""
 holy_order.0001.a:0 "เจ้ากำลังจะไปยัง [holy_order_1.GetName]"
 holy_order.0001.b:0 "[holy_order_2.GetName] คือจุดหมายปลายทางของเจ้า"
 holy_order.0001.c:0 "แดนไกล ไปยัง [recipient.GetHerHim]!"
 holy_order.0001.d:0 "บัดนี้เจ้าเป็นปัญหาสำหรับ [holy_order_4.GetName] แล้ว"
 holy_order.0001.e:0 "ข้าทำพลาดไป— เจ้าควรอยู่ที่นี่!"

 holy_order.0002.desc:0 "ข้าจะตอบรับการเรียกเพื่อรับใช้อำนาจที่สูงส่งกว่า และข้าขอบคุณท่านที่นำข้าสู่เส้นทางแห่งความชอบธรรมนี้"
 holy_order.0002.a:0 "ข้ามั่นใจว่าเจ้าจะรับใช้ [ROOT.Char.GetFaith.HighGodName] ได้เป็นอย่างดี!"

 char_interaction.0001.opening_low_piety:0 "สำหรับ[ROOT.GetCharacter.Custom('GetSinfulShameful')] เช่นเจ้า ที่คลานมาหาคณะนักบวชอันศักดิ์สิทธิ์ของ [ROOT.Char.GetFaith.HighGodName]... เจ้าควรใส่ใจกับการไถ่วิญญาณของตน ก่อนที่จะกังวลเรื่องทรัพย์สมบัติทางโลก"
 holy_order.0200.desc_opening:0 "[recipient.Custom2('AppropriateGreetingPositive', ROOT.Char )]"
 holy_order.0200.desc:0 "ข้าได้ยินคำร้องขอทองคำของท่านแล้ว และ [order.GetName] จะตอบรับการเรียกของท่าน"
 holy_order.0200.a:0 "[ROOT.Char.GetFaith.HighGodName] ทรงเมตตาข้า!"
 holy_order.0200.b:0 "แต่... แต่ข้าต้องการเงิน!"

 holy_order.0202.second_time:0 "ข้าขอเตือนท่านอีกครั้งว่าท่านเป็นหนี้กองทัพของข้า #bold [ROOT.Var('loan_amount_owed').GetValue|0]#! ทอง"
 holy_order.0202.opening:0 "ท่านเป็นหนี้กองทัพของข้า #bold [ROOT.Var('loan_amount_owed').GetValue|0]#! ทอง"
 holy_order.0202.desc:0 "หากท่านไม่คืนทอง เราจะหาหนทางอื่นให้ท่านชดใช้แก่เรา — หนทางที่ [ROOT.Char.GetFaith.HighGodName] พอพระทัย แต่อาจไม่เป็นที่พอใจของท่านนัก"
 holy_order.0202.a:0 "แน่นอน ข้าจะเคารพข้อตกลงของเรา"
 holy_order.0202.a_no:0 "ข้าจะจ่าย! เพียงให้ข้าหาทองก่อน..."
 holy_order.0202.a._not.tt:0 "@warning_icon! #X [gold_i][gold|E] ไม่เพียงพอ#!"
 holy_order.0202.b_christian:0 "ความอดทนมิใช่คุณธรรมดอกหรือ?"
 holy_order.0202.b:0 "ในฐานะผู้ศรัทธา เช่นกัน... โปรดให้เวลาข้าเพิ่มอีกสักหน่อย!"
 holy_order.0202.b.tt:0 "[recipient.GetTitledFirstNameNoTooltip] จะให้เวลาท่านอีก 5 ปี"
 holy_order.0202.c:0 "บางทีเราอาจหาหนทางชำระหนี้แบบอื่นได้...?"
 holy_order.0202.c.tt:0 "@warning_icon! #X [recipient.GetTitleAsNameNoTooltip] จะขออะไรบางอย่างจากท่าน#!"
 holy_order.0202.d:0 "ทองคำมีประโยชน์มากกว่าเมื่ออยู่ในมือข้า!"

 holy_order.0203.desc:0 "ข้าไม่มองผู้ที่ผิดคำพูดในแง่ดี และ [ROOT.Char.GetFaith.HighGodNameAlternate] ก็ เช่นกัน เพื่อแก้ไขการดูหมิ่นนี้ ท่านจะต้องให้เช่า [province.GetName] แก่เรา เพื่อที่เราจะได้ดำเนินงานของ [ROOT.Char.GetFaith.HighGodNamePossessive] ต่อไป"
 holy_order.0203.a:0 "แน่นอน [province.GetNameNoTierNoTooltip] จะเป็นของท่าน"
 holy_order.0203.b:0 "นี่เป็นข้อเรียกร้องที่ไร้สาระ!"

 holy_order.0204.desc:0 "ข้าไม่มองผู้ที่ผิดคำพูดในแง่ดี และ [ROOT.Char.GetFaith.HighGodNameAlternate] ก็ เช่นกัน เพื่อแก้ไขการดูหมิ่นนี้ ท่านจะต้องส่ง [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('child'))] ของท่าน [child.GetTitledFirstName] มาให้เราเพื่อทำงานของ [ROOT.Char.GetFaith.HighGodNamePossessive]"
 holy_order.0204.a:0 "ข้า... ข้าจะส่ง [child.GetHerHim] ไปตามทางของ [child.GetHerHis]"
 holy_order.0204.a.tt:1 "ท่านจะไม่เป็นหนี้ทองคำแก่กองทัพอีกต่อไป"

 holy_order.0205.desc:0 "เรื่องราวทั้งหมดเกี่ยวกับเงินกู้นี้เป็นการแสดงความโลภอันน่าละอายของท่าน ข้าจะ ทำให้แน่ใจว่า [ROOT.Char.GetFaith.ReligiousHeadName] ได้ยินเรื่องนี้!"
 holy_order.0205.a:0 "ให้ตายสิ!"

 holy_order_letter.opening:0 "สหายผู้รับใช้แห่ง [ROOT.Char.GetFaith.HighGodNameAlternate]"
 holy_order.1001.intro:1 "เมื่อกองทัพ [holy_order.GetName] ของเราเติบโตขึ้น เราต้องการที่ดินเพิ่มขึ้นเพื่อใช้ในการจัดระเบียบการป้องกันศรัทธา [ROOT.Char.GetFaith.GetAdjective]"
 holy_order.1001.end:0 "\n\n[target_barony.GetName] เหมาะสมอย่างยิ่งกับวัตถุประสงค์ของเรา และเราปรารถนาที่จะเช่าเพื่อรับใช้ภารกิจของเรา"
 holy_order.1001.a:0 "คำขอของท่านได้รับการอนุมัติแล้ว เพื่อ [ROOT.Char.GetFaith.HighGodName]!"
 holy_order.1001.b:0 "[alternative_barony.GetNameNoTierNoTooltip] จะไม่รับใช้ท่านได้ดีเท่ากันหรือ?"
 holy_order.1001.c:1 "ไม่ ข้าจะไม่มอบที่ดินนี้ให้ท่าน"

 holy_order.2001.t:0 "วัตถุประสงค์อันศักดิ์สิทธิ์"
 holy_order.2001.desc:0 "เมื่อ [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('child'))] ของข้า [child.GetFirstName] มาหาข้า ข้าเข้าใจอย่างรวดเร็วว่า [child.GetSheHe] มีเรื่องสำคัญมากที่จะหารือ\n\n"[ROOT.Char.Custom('MotherFather')|U] ชีวิตของลูกที่นี่จะอยู่ภายใต้เงาของผู้อื่นตลอดไป ให้ลูกเข้าร่วม [holy_order.GetName] และรับใช้ [child.GetFaith.HighGodName] แทนเถิด ลูกได้ไตร่ตรองเรื่องนี้มามากแล้ว และนี่คือสิ่งที่ลูกปรารถนาจะทำ""
 holy_order.2001.a:0 "ให้ [child.GetFaith.HighGodNameAlternate] นำทางเจ้าเถิด [child.Custom('DaughterSon')] ของข้า"
 holy_order.2001.b:0 "มันอาจไม่ยิ่งใหญ่ แต่ข้ามีแผนสำหรับเจ้าที่นี่"

 holy_order.2002.desc:0 "เมื่อ [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('sibling'))] ของข้า [sibling.GetTitledFirstName] บอกแผนการของ [sibling.GetHerHis] แก่ข้า เป็นที่ชัดเจนว่า [sibling.GetSheHe] ได้ไตร่ตรองเรื่องนี้มานานแล้ว\n\n"มีสิ่งเล็กน้อยสำหรับข้าที่นี่ และหากข้าจะต้องรับใช้ใครสักคน ข้าขอรับใช้ [sibling.GetFaith.HighGodName] [sibling.GetFaith.HighGodHerselfHimself] เสียดีกว่า ข้ากำลังจะเข้าร่วม [holy_order.GetName]""
 holy_order.2002.a:0 "ข้าเข้าใจการตัดสินใจของเจ้า [sibling.Custom('SisterBrother')]"
 holy_order.2002.b:0 "โอ้ เจ้าจะ #EMP ไม่#! ทำ เช่นนั้นเด็ดขาด!"

 holy_order.2003.opening:0 "[grandmaster.Custom2('AppropriateGreetingPositive', ROOT.Char)|U]"
 holy_order.2003.desc:1 "ย่อมมีความต้องการนักรบที่แท้จริงอยู่เสมอเพื่อหยุดยั้งภัยคุกคามใดๆ ต่อศรัทธา [grandmaster.GetFaith.GetAdjective]\nด้วยความถนัดหลายด้านและโอกาสในการสืบทอดมรดกเพียงน้อยนิด ข้าเชื่อว่า [child.Custom('DaughterSon')] ของท่าน [child.GetTitledFirstName] สามารถมีชีวิตที่ดีขึ้นได้ในการรับใช้ [holy_order_scope.GetName] กับพวกเรา [child.GetSheHe] จะได้รับการฝึกฝน เรียนรู้ และนำเกียรติยศอันยิ่งใหญ่มาสู่ชื่อของท่าน"
 holy_order.2003.a:0 "ชีวิตของ [child.GetHersHis|U] จะเป็นชีวิตของผู้ศรัทธา [child.GetFaith.GetAdherentName] ที่แท้จริง"
 holy_order.2003.child_joins_order:0 "[child.GetFirstName] ได้รับ [GetTrait('order_member').GetName( child.Self )] และเข้าร่วมราชสำนักของ [grandmaster.GetTitledFirstNameNoTooltip]"
 holy_order.2003.b:0 "บางทีท่านอาจฝึก [alternative_child.GetFirstNameNoTooltip] แทนได้หรือไม่?"
 holy_order.2003.alternative_child_joins_order:0 "[alternative_child.GetFirstName] ได้รับ [GetTrait('order_member').GetName( alternative_child.Self )] และเข้าร่วมราชสำนักของ [grandmaster.GetTitledFirstNameNoTooltip]"
 holy_order.2003.c:0 "ที่ของ [child.GetHerHis|U] อยู่ที่นี่กับข้า"

 holy_order.2004.opening:0 "[child.Custom2('AppropriateGreetingPositive', ROOT.Char)]"
 holy_order.2004.desc:0 "ลูกได้อุทิศชีวิตให้กับ [child.GetFaith.HighGodNameAlternate] แต่ [child.GetFaith.HighGodNameSheHe] คงไม่ปรารถนาให้ลูกละเลยครอบครัวของตนเอง\n\n[grandmaster.GetTitledFirstName] ได้อนุญาตให้ลูกกลับไปใช้ชีวิตเดิม และกลับมาเป็นส่วนหนึ่งของ [ROOT.Char.Custom('GetCourt')] ของท่านอีกครั้ง"
 holy_order.2004.a:0 "ยินดีต้อนรับกลับบ้าน [child.Custom('DaughterSon')] ของข้า!"
 holy_order.2004.b:0 "ไม่ ที่นี่ไม่มีที่สำหรับเจ้าอีกต่อไปแล้ว"

 holy_order.2005.t:0 "การกลับบ้าน"
 holy_order.2005.desc:0 "การมาเยือนของ [child.GetTitledFirstNamePossessive] ยาวนานกว่าปกติ เพียงเมื่อ [child.Custom('DaughterSon')] ของข้าได้ปักหลัก [child.GetHerselfHimself] อยู่ใน [ROOT.Char.Custom('GetCourt')] ของข้า — กิน [child.GetHerselfHimself] อย่างตะกละตะกลามด้วยอาหารของข้าและก่อกวนคนรับใช้ของข้า — ข้าจึงได้เอ่ยถึงเรื่องการกลับไปยัง [holy_order.GetName] การตอบสนองของ [child.GetHerHis|U] นั้นกระตือรือร้นอย่างน่าเสียดาย\n\n"ท่านยังไม่ได้ยินหรือ [ROOT.Char.Custom('MotherFather')]? [grandmaster.GetTitledFirstName] ช่างใจกว้างเหลือเกินที่ปลดข้าออกจากหน้าที่ต่อ [child.GetFaith.GetName]! ในที่สุดข้าก็ได้กลับบ้าน มาอยู่กับครอบครัว""
 holy_order.2005.a:0 "โอ้ เจ้า... จะอยู่ที่นี่ถาวรหรือ?"

 holy_order.destroyed_title:0 "กองทัพศักดิ์สิทธิ์ถูกยุบ"
 holy_order.2031.opening: "[actor.GetCustom('SisterBrother')|U],"
 monastic_holy_order_expanded: "Monastic Order Expands"
 holy_order.0001.desc_demand: ""I suppose there is honor in this..." [recipient.GetSheHe] grumbles, "my dying to claim some strange heathen land. I thought I would die fighting for [actor.GetPrimaryTitle.GetNameNoTier]..."\n\n[recipient.GetSheHe|U] mounts [recipient.GetHerHis] horse, asking: "Where am I to go?""
 holy_order.0001.toast_puppeteer:0 "[recipient.GetShortUIName] accepted [puppet_or_actor.GetShortUINamePossessive] summons to a military order"
 holy_order.0002.desc_angry: "I have spoken the sacred words and, just as your will has bound me, now I am bound to [ROOT.Char.GetFaith.HighGodName]."
 holy_order.0002.a_demand: "Good. Now go await [ROOT.Char.GetFaith.PositiveAfterLife] in silence."
 holy_order.0002.toast_puppeteer:0 "[recipient.GetShortUIName] took the vows at [puppet_or_actor.GetShortUINamePossessive] request"
 holy_order.1011.intro: "In the [target_barony.GetName], there is good land to be tended, and a fine [grandmaster.GetFaith.HouseOfWorship] that would be well-served by a cloister of my [grandmaster.Custom('SistersBrothers')]."
 holy_order.1011.end: "\n\nWould you act as our broker, so that the [holy_order.GetName] might establish a monastery there?"
 holy_order.1011.a: "The Order may lease [target_barony.GetNameNoTierNoTooltip]."
 holy_order.1011.b: "There is tranquility in [alternative_barony.GetNameNoTierNoTooltip]?"
 holy_order.1011.c: "I fear you must send your [grandmaster.Custom('SistersBrothers')] elsewhere."
 holy_order.2010.t: "A New Monastic Order"
 holy_order.2010.desc: "Hermits, mystics, and dissatisfied disciples from older orders have gathered in [barony.GetNameNoTier] and labored, for years, to build their new home in the wilderness. A [leader.GetWomanMan] named [leader.Custom('SisterBrother')|U] [leader.GetFirstName] has risen as the natural head of this burgeoning Order, '[leader.GetPrimaryTitle.GetName]'... but #EMP my#! august voice has yet to be heard on this matter. I have yet, also, to propose a holy precept to enshrine as the heart of this Order's way of life.\n\nWhat shall this chorus of pure devotees sing of in [barony.GetNameNoTierNoTooltip]? What shall they labor to live in full, to think and write on? And who shall lead them in this?"
 holy_order.2010.4: "[tenet_4.GetName( order_rite )], and [monk_tenet_1.Custom('SisterBrother')|U] [monk_tenet_1.GetFirstNameNoTooltip]."
 holy_order.2010.5: "[tenet_5.GetName( order_rite )], and [monk_tenet_2.Custom('SisterBrother')|U] [monk_tenet_2.GetFirstNameNoTooltip]."
 holy_order.2010.6: "[tenet_6.GetName( order_rite )], and [monk_tenet_3.Custom('SisterBrother')|U] [monk_tenet_3.GetFirstNameNoTooltip]."
 holy_order.2010.d: "[tenet_1.GetName( order_rite )], and [monk_tenet_1.Custom('SisterBrother')|U] [monk_tenet_1.GetFirstNameNoTooltip]."
 holy_order.2010.e: "[tenet_2.GetName( order_rite )], and [monk_tenet_2.Custom('SisterBrother')|U] [monk_tenet_2.GetFirstNameNoTooltip]."
 holy_order.2010.f: "[tenet_3.GetName( order_rite )], and [monk_tenet_3.Custom('SisterBrother')|U] [monk_tenet_3.GetFirstNameNoTooltip]."
 monastic_tenet_pick_tt: "[tenet_pick.GetName( order_rite )] will be the [core_tenet|E] advocated by [monastic_order.GetName]"
 monastic_order_tenet_advocated_tt: "[monastic_order.GetName] advocate for [tenet_pick.GetName( order_rite )]"
 founded_monastic_order_modifier: "Founded Monastic Order"
 founded_monastic_order_modifier_desc: "This wise ruler aided in the conception and creation of a new monastic order, by doing so launching a new appeal directly to the divine."
 pick_becomes_monastic_order_leader_tt: "[chosen_leader.GetShortUIName] becomes [ruler|E] of [monastic_order.GetName]"
 pick_remains_monastic_order_leader_tt: "[chosen_leader.GetShortUIName] remains [ruler|E] of [monastic_order.GetName]"
 holy_order.2009.t: "The Building of a Monastery"
 holy_order.2009.desc: "Amidst quiet [province.GetTerrain.GetNameNoTooltip|l], in a place beloved of the [province.GetCulture.GetCollectiveNoun], I lay the first stone that will one-day bear the monastery of [province.GetName].\n\nMy laborers join with simple oblates to raise walls from the earth, to bring prayerful hymns from their industrious bodies. The first honored monastics — like [potential_leader.Custom('SisterBrother')|U] [potential_leader.GetName] — have come to walk this place too, and draw up plans for chantries and refectories.\n\nIn a matter of years, a new order will be born here. And, alongside stone and [ROOT.Char.Custom('GetWritingMaterial')], this order will need more sworn members."
 holy_order.2009.a: "This new order must be guided by those I support."
 holy_order.2009.b: "Many monastics chafe under their current order..."
 holy_order.2009.b.tt: "...and would abandon their superiors for the mastery of this new order, for freedom to write a new rule."
 holy_order.2009.c: "Gather wild ascetics and zealous youths."
 monastic_order_creation_increased_spiritual_fulfillment: "[interactions|E] with the [monastic_holy_order|E] will provide increased [spiritual_fulfillment|E] for #high 50 years#!"
 monastic_founder_become_saint_tt: "[chosen_leader.GetShortUIName] will become a [GetTrait('saint').GetName( chosen_leader.Self )] after [chosen_leader.GetHerHis] death, if [chosen_leader.GetSheHe] has #high 65+#! [GetTrait('devoted').GetName( chosen_leader.Self )] [trait_level_track_xp|E] or a [piety_level|E] of at least @piety_level_4_icon_christian! [GetModifier( 'piety_level_4' ).GetNameWithTooltip|L]"
 holy_order.2020.t: "Monastic Vows"
 holy_order.2020.desc: "At my insistence, [recipient.GetFirstNamePossessive] turns [recipient.GetHerHis] newly-robed back away from my [ROOT.Char.Custom('ResidenceBuilding')], from the [ROOT.Char.Custom('KnightCulturePluralNoTooltip')|l] and nobility of the profane world. [recipient.GetSheHe|U] is inducted into [archabbot.GetPrimaryTitle.GetName].\n\nLike the other [recipient.Custom('SistersBrothers')] of [recipient.GetHerHis] Order, [recipient.GetFirstNameNoTooltip] swears duty and fidelity to their holy community. [recipient.GetSheHe|U] commits [recipient.GetHerHis] flesh to [recipient.GetFaith.HighGodName], and [recipient.GetHerHis] mind to the reverence of [recipient.GetFaith.PositiveAfterLife].\n\n[recipient.GetFirstNameNoTooltip] shall reside in [archabbot.GetCapitalLocation.GetName], or another of the Order's sanctuaries, and there begin [recipient.GetHerHis] life of study and contemplation."
 holy_order.2020.aa: "The Order has gained an industrious mind."
 holy_order.2020.aa.tt: "[recipient.GetFirstNamePossessiveNoTooltip] skills of stewardship will well-serve their ceaseless labors."
 holy_order.2020.a: "The Order has gained a wise disciple."
 holy_order.2020.a.tt: "No place in this mortal world could be more right for the learned [recipient.GetFirstNameNoTooltip]."
 holy_order.2020.b: "The [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('recipient'))] of their Patron is no scullery-[recipient.Custom('GirlBoy')]..."
 holy_order.2020.c: "A 'donation' will ensure [recipient.GetFirstNameNoTooltip] is pampered."
 holy_order.2020.d: "[recipient.GetHerHis|U] life belongs to the Order now."
 holy_order.2020.toast_puppeteer:0 "[recipient.GetShortUIName] joined a monastic order at [puppet_or_actor.GetShortUINamePossessive] request"
