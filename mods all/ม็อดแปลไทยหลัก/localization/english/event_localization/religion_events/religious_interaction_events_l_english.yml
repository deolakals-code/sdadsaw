#######################################################

#I have been left in the sun to die!
 religious_interaction.2100.t:0 "[imprisoner.GetFaith.HighGodNamePossessive|U] พิพากษา"
 religious_interaction.2100.desc:1 "หลังจากอยู่ในห้องขังมืดมิดมานานเท่าใดก็มิอาจทราบได้ [ROOT.Char.GetFaith.HighGodName] แสงแดดจ้า ทำให้ตาพร่ามัว ทหารยามที่คุมตัวข้าออกจาก [imprisoner.Custom('FortifiedBuilding')] ไปยังถิ่นทุรกันดารนั้นดูเคร่งขรึมอย่างน่าประหลาด — ถึงขั้นเป็นพิธีรีตอง\n\n"
 religious_interaction.2100.descwaterlogged: "ขณะที่ดวงอาทิตย์ส่องแสงเจิดจ้า พื้นดินเฉอะแฉะที่ข้ายืนอยู่ก็ส่งเสียงและดูดเท้าข้า ไม่นานข้าก็เห็นผู้คุมขังข้า [imprisoner.GetTitledFirstName] เดินเข้ามาอย่างอิ่มอกอิ่มใจ แต่ค่อนข้างระมัดระวังข้ามพื้นหญ้าที่เปียกชุ่ม พร้อมด้วย [imprisoner.Custom('DefaultPriestTitlePlural')] หลายคน\n\n"
 religious_interaction.2100.descpleasant: "ดวงอาทิตย์ส่องแสงเจิดจ้า พื้นดินที่ข้ายืนอยู่ดูอุดมสมบูรณ์และเขียวชอุ่ม ไม่นานข้าก็เห็นผู้คุมขังข้า [imprisoner.GetTitledFirstName] เดินเข้ามา — ด้วยท่าทีไม่แน่ใจนัก — พร้อมด้วย [imprisoner.Custom('DefaultPriestTitlePlural')] หลายคน\n\n"
 religious_interaction.2100.descforest: "ดวงอาทิตย์ส่องแสงเจิดจ้า ลำแสงสาดส่องเป็นหย่อม ๆ ผ่านหมู่ไม้ ไม่นานข้าก็เห็นผู้คุมขัง [imprisoner.GetTitledFirstName] กำลังฝ่าฟันพงหนามของ [imprisoner.GetHerHis] พร้อมด้วย [imprisoner.Custom('DefaultPriestTitlePlural')] หลายคน\n\n"
 religious_interaction.2100.descoasis: "ดวงอาทิตย์แผดเผาในทะเลทราย สะท้อนผิวน้ำโอเอซิส ไม่นานข้าก็เห็นผู้คุมขังข้า [imprisoner.GetTitledFirstName] เดินลุยน้ำเข้ามา พร้อมด้วย [imprisoner.Custom('DefaultPriestTitlePlural')] หลายคน\n\n"
 religious_interaction.2100.deschostile: "ขณะที่ข้าจับจ้องไปที่ [imprisoner.GetTitledFirstName] ขนาบข้างด้วย [imprisoner.Custom('DefaultPriestTitlePlural')] นับสิบ จุดประสงค์ของการเดินทางเล็กๆ ของเราก็ชัดเจนขึ้น\n\n"[ROOT.Char.GetFullNameNoTooltip] เจ้าจะถูกทิ้งไว้ที่นี่ ผูกติดกับเสานี้ และ [imprisoner.GetFaith.HighGodName] จะเป็นผู้ตัดสินชะตากรรมของเจ้า หากเจ้าบริสุทธิ์ เจ้าจะมีชีวิตรอด แต่หากเจ้ามีความผิด เจ้าจะต้องพินาศ""
 religious_interaction.2100.middledefault: ""สำหรับการล่วงละเมิดของเจ้า เจ้าจะถูกพิพากษาโดย [imprisoner.GetFaith.HighGodName|U] ผู้ทรงฤทธานุภาพ" [imprisoner.GetSheHe|U] ตะโกนก้อง ทหารยามก้าวไปข้างหน้าและมัดแขนขาข้าเข้ากับเสา [imprisoner.Custom('DefaultPriestTitlePlural')] เริ่มสวดบทสวดศพ แขนเหยียดออก จากนั้นคณะก็ถอยกลับไป ข้าอยู่ตามลำพัง คาดว่าจะตาย เพราะความกระหายน้ำ"
 religious_interaction.2100.middleoasis: ""สำหรับการล่วงละเมิดของเจ้า เจ้าจะถูกพิพากษาโดย [imprisoner.GetFaith.HighGodName|U] ผู้ทรงฤทธานุภาพ" [imprisoner.GetSheHe|U] ตะโกนก้อง ทหารยามก้าวไปข้างหน้าและมัดแขนขาข้าเข้ากับเสา ลึกถึงอกในโอเอซิส [imprisoner.Custom('DefaultPriestTitlePlural')] เริ่มสวดบทสวดศพ แขนเหยียดออก จากนั้นคณะก็ถอยกลับไป ข้าอยู่ตามลำพัง คาดว่าจะตาย เพราะความกระหายน้ำ"
 religious_interaction.2100.endwaterlogged: "\n\nข้ามองไปรอบๆ สภาพแวดล้อมที่ชุ่มน้ำของข้า"
 religious_interaction.2100.endpleasant: "\n\nข้ามองไปรอบๆ สภาพแวดล้อมที่น่ารื่นรมย์ของข้า"
 religious_interaction.2100.endforest: "\n\nข้ามองไปรอบๆ สภาพแวดล้อมที่เขียวขจีของข้า"
 religious_interaction.2100.endoasis: "\n\nข้ามองลงไปในน้ำ"
 religious_interaction.2100.a.believer:0 "[imprisoner.GetFaith.HighGodName|U] จะพิพากษาข้าอย่างยุติธรรม!"
 religious_interaction.2100.a.unbeliever:0 "พวกเจ้าจะ #EMP ทิ้ง#! ข้าไว้ที่นี่รึ?!"
 religious_interaction.2100.a.confused: "เอ่อ..."
 religious_interaction.2100.a.success:0 "ท่านรอดชีวิตจากการทดลอง"
 religious_interaction.2100.a.failure:0 "ท่านพินาศภายใต้แสงอาทิตย์"

#I have survived!
 religious_interaction.2101.t:0 "ความเมตตาแห่ง [imprisoner.GetFaith.HighGodNamePossessive|U]"
 religious_interaction.2101.start.desc:0 "น้ำ ข้าต้องการน้ำ! คอข้า หัวข้า ผิวข้า — มันร้อนเป็นไฟไปหมด!\n\n[ROOT.Char.GetFaith.DevilName] อยู่ที่นี่จริงหรือ หัวเราะเยาะความทุกข์ของข้า? [ROOT.Char.GetFaith.WaterGodName] ยื่นขวดน้ำให้ข้าหรือไม่? ข้าดื่มแล้วดื่มเล่า แต่ความกระหายก็ไม่ดับ"
 religious_interaction.2101.end.desc:0 "\n\nเมื่อ [imprisoner.GetTitledFirstName] กลับมาและขวดน้ำถูกกดแนบกับริมฝีปากข้า ความมัวซัวในใจข้าก็จางหายไป [imprisoner.GetTitleAsNameNoTooltip] ดูผิดหวังเล็กน้อยที่พบว่าข้ายังมีชีวิตอยู่ แต่เทพเจ้าได้ตรัสแล้ว"
 religious_interaction.2101.desc.pleasant: "ข้าเกือบจะ #EMP เพลิดเพลิน#! กับวันที่ถูกมัดอยู่ข้างนอก นกขับขาน ดวงอาทิตย์ให้ความอบอุ่นแก่ผิวข้า และสายฝนที่โปรยปรายลงมา ทำให้ข้าสดชื่นและดับกระหาย\n\nเมื่อ [imprisoner.GetTitledFirstName] กลับมา [imprisoner.GetSheHe] โกรธอย่างเห็นได้ชัดกับความกระปรี้กระเปร่าและอารมณ์ดีโดยทั่วไปของข้า แต่ไม่มีทางหนีพ้นเงื่อนไขที่ [imprisoner.GetSheHe] [imprisoner.GetHerselfHimself] ได้ตั้งไว้: เทพเจ้าได้ตรัสแล้ว!"
 religious_interaction.2101.desc.oasis: "ข้าเกือบจะ #EMP เพลิดเพลิน#! กับวันที่ถูกแขวนอยู่ในน้ำเย็นๆ ของโอเอซิส แม้ดวงอาทิตย์จะแผดเผาอย่างรุนแรง แต่เชือกของข้าก็หลวมพอที่ข้าจะโน้มตัวลงและดื่มน้ำได้อย่างเต็มที่\n\nเมื่อ [imprisoner.GetTitledFirstName] กลับมา [imprisoner.GetSheHe] โกรธอย่างเห็นได้ชัดกับสุขภาพที่ดีของข้า แต่ไม่มีทางหนีพ้นเงื่อนไขที่ [imprisoner.GetSheHe] [imprisoner.GetHerselfHimself] ได้ตั้งไว้: เทพเจ้าได้ตรัสแล้ว!"
 religious_interaction.2101.a:0 "ข้าบริสุทธิ์!"

#They survived...
 religious_interaction.2102.desc:0 "ในคืนสุดท้ายก่อนการพิจารณาคดีของ [prisoner.GetTitledFirstNamePossessive] เราพบ [prisoner.GetHerHim] หมดสติ แต่ยังคงหายใจอยู่\n\n\"นี่คือปาฏิหาริย์!\" [ROOT.Char.Custom('DefaultPriestTitle')] ประกาศ มือชูขึ้นสู่สวรรค์ \"[ROOT.Char.GetFaith.HighGodName|U] ได้ตรัสแล้ว! [prisoner.GetWomanMan] ผู้นี้บริสุทธิ์!\""
 religious_interaction.2102.oasis: "ขณะที่ข้าเข้าใกล้ [prisoner.GetTitledFirstName] ลุยน้ำในโอเอซิสที่ [prisoner.GetSheHe] ถูกมัดไว้กับเสา เราพบว่า [prisoner.GetHerHim] ไม่เพียง แต่มีสติ แต่ยังสุขภาพดีโดยสิ้นเชิง\n\n"นี่คือปาฏิหาริย์!" [ROOT.Char.Custom('DefaultPriestTitle')] ประกาศ มือชูขึ้นสู่สวรรค์ "[ROOT.Char.GetFaith.HighGodName|U] ได้ตรัสแล้ว! [prisoner.GetWomanMan] ผู้นี้บริสุทธิ์!"\n\nข้ากัดฟันด้วยความหงุดหงิดขณะที่ [ROOT.Char.Custom('DefaultPriestTitlePlural')] แก้เชือกให้ [prisoner.GetFirstNameNoTooltip] ทำไมเราต้องทิ้ง [prisoner.GetSheHe] ไว้ #EMP ที่นี่#! ด้วย?!"
 religious_interaction.2102.pleasant: "ขณะที่ข้าเข้าใกล้ [prisoner.GetTitledFirstName] ลุยน้ำในโอเอซิสที่ [prisoner.GetSheHe] ถูกมัดไว้กับเสา เราพบว่า [prisoner.GetHerHim] ไม่เพียง แต่มีสติ แต่แทบจะ #EMP ยิ้ม#! อยู่\n\n"นี่คือปาฏิหาริย์!" [ROOT.Char.Custom('DefaultPriestTitle')] ประกาศ มือชูขึ้นสู่สวรรค์ "[ROOT.Char.GetFaith.HighGodName|U] ได้ตรัสแล้ว! [prisoner.GetWomanMan] ผู้นี้บริสุทธิ์!"\n\nข้ากัดฟันด้วยความหงุดหงิดขณะที่ [ROOT.Char.Custom('DefaultPriestTitlePlural')] แก้เชือกให้ [prisoner.GetFirstNameNoTooltip] ทำไมเราต้องทิ้ง [prisoner.GetSheHe] ไว้ #EMP ที่นี่#! ด้วย?!"
 religious_interaction.2102.a:0 "เป็นพระประสงค์ของ [ROOT.Char.GetFaith.HighGodNamePossessive|U]"
 religious_interaction.2102.b:0 "[prisoner.GetSheHe|U] ดูเหมือนตายแล้วสำหรับข้า..."
 religious_interaction.2102.b.tt:0 "[ROOT.Char.GetFaith.HighGodName|U] ไม่ได้ #EMP ถูก#! เสมอไป!"
 religious_interaction.2102.b.success:0 "การแทรกแซงของท่านไม่ถูกค้นพบ"
 religious_interaction.2102.b.failure:0 "ท่านถูกเปิดโปงว่าเป็นฆาตกร"

#I have died...
 religious_interaction.2103.t: "ความพิโรธแห่ง [imprisoner.GetFaith.HighGodNamePossessive|U]"
 religious_interaction.2103.end.desc:0 "\n\nหากนี่คือพระประสงค์ของ [ROOT.Char.GetFaith.HighGodHerHis|U] บางทีข้าสมควรได้รับสิ่งนี้ บางทีข้า... ชั่วร้าย"
 religious_interaction.2103.desc.pleasant: "ข้าช่างมั่นใจในตนเอง ช่างโง่เขลา การอยู่กลางแจ้งนานขนาดนี้จะทำร้าย [ROOT.Char.GetWomanMan] ใดๆ ก็ตาม ข้าเห็นแล้วตอนนี้ ดวงอาทิตย์แผดเผาในตอนกลางวัน ลมพัดกระหน่ำข้าในตอนกลางคืน และท้องฟ้ายังคงแจ่มใสอย่างน่าสะพรึงกลัว ปราศจากเมฆใดๆ อย่างไร้ความปรานี\n\nน้ำ น้ำ มันอยู่รอบตัวข้า ถูกกักขังอยู่ในอ้อมกอดของธรรมชาติ แต่ไม่มีสักหยดที่ข้าดื่มได้ หัวข้าห้อยตกลงอย่างสิ้นหวัง"
 religious_interaction.2103.desc.waterlogged: "แม้ลมจะพัดกระหน่ำและดวงอาทิตย์จะแผดเผาผิวข้า อย่างน้อยข้าก็สดชื่นด้วยกระแสน้ำที่ไหลเข้ามาอย่างต่อ เนื่องจากเมฆฝนที่กระหน่ำลงมาในบริเวณนี้ ข้ายิ้มให้กับท้องฟ้าขณะที่เมฆฝนเริ่มก่อตัวอีกครั้ง\n\nทันใดนั้นโลกก็เริ่มโคลงเคลง ทีละน้อยในตอนแรก จากนั้นเร็วขึ้นและเร็วขึ้น ข้าใช้เวลาครู่หนึ่งจึงตระหนักว่าเสาของข้าเสียสมดุลและกำลังล้มลงไปในสระน้ำตรงหน้าข้า!\n\nขณะที่ข้ากระแทกลงไปในน้ำ ข้าดิ้นรนอย่างบ้าคลั่งเพื่อหนี แต่มันไร้ประโยชน์ แขนขาทั้งหมดของข้าถูกมัด และน้ำหนักของท่อนซุงก็กดข้าลึกลงไปในสระน้ำตื้น ข้ากรีดร้อง แต่ไม่มีเสียงเล็ดลอดออกมา และน้ำก็ไหลเข้าปากข้าเพื่อเติมเต็มความว่างเปล่า"
 religious_interaction.2103.desc.oasis: "ขณะที่ข้ารับการทดลอง ดวงอาทิตย์อันร้อนแรงแผดเผาผิวข้า อย่างน้อยข้าก็สดชื่นด้วยน้ำที่ซัดสาดหน้าอกข้า ขณะที่ข้าถูกแขวนตัวตรงอยู่ในน้ำของโอเอซิส\n\nทันใดนั้นโลกก็เริ่มโคลงเคลง ทีละน้อยในตอนแรก จากนั้นเร็วขึ้นและเร็วขึ้น ข้าใช้เวลาครู่หนึ่งจึงตระหนักว่าทรายอ่อนใต้เสาของข้าทรุดตัวลง ทำให้ข้าล้มลงไปในโอเอซิสตรงหน้าข้า!\n\nขณะที่ข้ากระแทกลงไปในน้ำ ข้าดิ้นรนอย่างบ้าคลั่งเพื่อหนี แต่มันไร้ประโยชน์ แขนขาทั้งหมดของข้าถูกมัด และน้ำหนักของท่อนซุงก็กดข้าลึกลงไปในน้ำ ข้ากรีดร้อง แต่ไม่มีเสียงเล็ดลอดออกมา และน้ำก็ไหลเข้าปากข้าเพื่อเติมเต็มความว่างเปล่า"
 religious_interaction.2103.a:0 "ข้า... ข้าเหนื่อยเหลือเกิน..."
 religious_interaction.2103.b: "#DIE1 บลุ-#! #DIE2 บลุบ...#!"

#They died!
 religious_interaction.2104.desc:0 "ในคืนสุดท้ายก่อนการพิจารณาคดีของ [prisoner.GetTitledFirstNamePossessive] [prisoner.GetSheHe] ไม่ขยับเขยื้อนเมื่อเราเข้าใกล้ คนรับใช้คนหนึ่งนำขวดน้ำไปจ่อริมฝีปากที่แห้งผากของ [prisoner.GetHerHis] แต่น้ำกลับไหลลงคางของ [prisoner.GetHerHis] โดยไม่มีการตอบสนอง\n\n\"[ROOT.Char.GetFaith.HighGodName|U] ได้ตรัสแล้ว!\" [ROOT.Char.Custom('DefaultPriestTitle')] ประกาศ มือชูขึ้นสู่สวรรค์ \"[prisoner.GetWomanMan] ผู้นี้มีความผิด!\""
 religious_interaction.2104.desc.drowned: "ขณะที่เราเข้าใกล้ที่ที่เราทิ้ง [prisoner.GetTitledFirstName] ผูกติดกับเสา ก็เห็นได้ชัดอย่างรวดเร็วว่ามีบางอย่างผิดปกติ เสาของ [prisoner.GetHerHis|U] น่าจะล้มไปข้างหน้า ลงไปในสระน้ำที่เราทิ้ง [prisoner.GetHerHim] ไว้ข้างๆ เชือกที่เรามัดแขนขาของ [prisoner.GetHerHis] นั้นแข็งแรงพอ และด้วยน้ำหนักของท่อนซุงที่กดทับ [prisoner.GetHerHim] [prisoner.GetSheHe] ไม่มีโอกาสรอดเลย\n\n"[ROOT.Char.GetFaith.HighGodName|U] ได้ตรัสแล้ว!" [ROOT.Char.Custom('DefaultPriestTitle')] ประกาศ มือชูขึ้นสู่สวรรค์ "[prisoner.GetWomanMan] ผู้นี้มีความผิด!""
 religious_interaction.2104.desc.oasisdrowned: "ขณะที่เราเข้าใกล้ที่ที่เราทิ้ง [prisoner.GetTitledFirstName] ผูกติดกับเสา ก็เห็นได้ชัดอย่างรวดเร็วว่ามีบางอย่างผิดปกติ เสาของ [prisoner.GetHerHis|U] น่าจะล้มไปข้างหน้า ลงไปในโอเอซิสที่เราทิ้ง [prisoner.GetHerHim] ไว้ข้างๆ เชือกที่เรามัดแขนขาของ [prisoner.GetHerHis] นั้นแข็งแรงพอ และด้วยน้ำหนักของท่อนซุงที่กดทับ [prisoner.GetHerHim] [prisoner.GetSheHe] ไม่มีโอกาสรอดเลย\n\n"[ROOT.Char.GetFaith.HighGodName|U] ได้ตรัสแล้ว!" [ROOT.Char.Custom('DefaultPriestTitle')] ประกาศ มือชูขึ้นสู่สวรรค์ "[prisoner.GetWomanMan] ผู้นี้มีความผิด!""
 religious_interaction.2104.b.drowned: "อืม ข้าว่านั่นก็เป็นวิธีมองอย่างหนึ่ง..."

##############################################
### Literalist Debate by Ewan Cowhig Croft ###
##############################################

 religious_interaction.2400.t:0 "การโต้วาทีครั้งใหญ่"
 religious_interaction.2400.desc:0 "มหาดเล็กสั่นเทาด้วยความกลัวขณะที่ [recipient.GetSheHe] อ่านจดหมายอันเผ็ดร้อนของ [actor.GetTitledFirstNamePossessive] ให้ข้าฟัง ท้าทายข้าให้โต้วาทีสาธารณะเกี่ยวกับคุณธรรมและโทษทัณฑ์ของศรัทธาร่วมกันของเรา และตั้งคำถามถึงการยึดมั่นในหลักธรรมพื้นฐานของ [recipient.GetFaith.GetNameNoTooltip] ของข้า\n\nคนรับใช้ของข้าพูดตะกุกตะกักด้วยน้ำเสียงของจดหมายที่ไม่ต้องสงสัยเลยเกี่ยวกับความคิดเห็นของ [actor.GetShortUINamePossessiveNoTooltip] ที่มีต่อความศรัทธาของข้า"
 religious_interaction.2400.a:0 "เจ้าคนถ่อยนั่น! รับคำท้า!"
 religious_interaction.2400.a.tt_success:0 "การโต้วาทีในที่สาธารณะ ทำให้อับอาย [actor.GetShortUINameNoTooltip]"
 religious_interaction.2400.a.tt_fail:0 "[actor.GetShortUINameNoTooltip] ประสบความสำเร็จในการตั้งคำถามถึงศรัทธาของข้า"
 religious_interaction.2400.b:0 "ข้าจะไม่ ทำให้พระนามของ [recipient.GetFaith.HighGodNamePossessive] ต้องมัวหมองด้วยเรื่องตลกนี้"
 religious_interaction.2400.b.tt:0 "[actor.GetShortUINameNoTooltip] จะได้รับแจ้ง"
 religious_interaction.2400.b_turned_down:0 "[recipient.GetShortUIName|U] ได้ปฏิเสธคำท้าโต้วาทีของข้า"

 used_literalist_debate_modifier:0 "เพิ่งโต้วาที"
 used_literalist_debate_modifier_desc:0 "ตัวละครนี้เพิ่งเริ่มการโต้วาทีเกี่ยวกับหลักการพื้นฐานของศรัทธาของพวกเขา"
 literally_debated_modifier:0 "เพิ่งโต้วาที"
 literally_debated_modifier_desc:0 "ตัวละครนี้เพิ่งเข้าร่วมการโต้วาทีเกี่ยวกับหลักการพื้นฐานของศรัทธาของพวกเขา"

 religious_interaction.2401.desc_intro:0 "คู่ต่อสู้ของข้าและข้าพบกันในห้องโถงใหญ่ใน [debate_locale.GetNameNoTierNoTooltip] ยืนอยู่บนโต๊ะโยกเยกห่างกันเพียงไม่กี่ฟุต ล้อมรอบด้วยฝูงชนที่กระตือรือร้น ความเงียบสงัดปกคลุมฝูงชน ทุกคนรอคอยการโต้วาทีที่จะเริ่มขึ้น\n\n"
 religious_interaction.2401.desc_won:0 "ตลอดระยะเวลาหนึ่งชั่วโมง ข้าทำลาย [recipient.GetTitledFirstName] โจมตีความศรัทธาของ [recipient.GetHerHis] สำนึกในคุณธรรมของ [recipient.GetHerHis] และถึงกับตั้งคำถามถึงความจงรักภักดีของ [recipient.GetHerHis] ต่อ [actor.GetFaith.HighGodName] ฝูงชนโหดร้าย ปาไข่เน่าและกะหล่ำปลีขึ้นราใส่ [recipient.GetTitledFirstNameNoTooltip] จนกระทั่ง [recipient.GetSheHe] หนีออกจากห้องโถงไป"
 religious_interaction.2401.desc_lost:0 "การโจมตีด้วยวาจาของ [recipient.GetTitledFirstNamePossessive] เริ่มขึ้นทันที แทบไม่เปิดโอกาสให้ข้าโต้แย้ง และไม่นานฝูงชนก็ตัดสินผู้ชนะ\n\nข้าพยายามต่อไปอีกสองสามนาที ฝ่าห่าผักเน่า แต่ในที่สุดข้าก็ถูกบังคับให้ล่าถอยเมื่อชาวบ้านคนหนึ่งขว้างไก่เป็นๆ มาที่หัวข้า"
 religious_interaction.2401.a_won:0 "ข้าไม่เป็นที่รักของ [actor.GetFaith.HighGodName] หรือ?"
 religious_interaction.2401.a_lost:0 "คนเหล่านี้ไม่เข้าใจ [actor.GetFaith.GetReligion.GetNameNoTooltip]!"

 religious_interaction.2402.desc_won:0 "แม้ว่า [actor.GetTitledFirstNamePossessive] จะมีท่าทีโอหังในการท้าทายข้าโต้วาที แต่ความมุ่งมั่นของ [actor.GetHerHis] ก็ละลายไปต่อหน้าพายุคำพูดอันเฉียบคมและคำวิจารณ์อันเคร่งศาสนาของข้า ไม่นานฝูงชนก็เข้าร่วม และคู่ต่อสู้ของข้าก็ล่าถอยภายใต้ห่าผักขึ้นราและไก่ตัวผู้ที่ดุร้ายเป็นพิเศษตัวหนึ่ง"
 religious_interaction.2402.desc_lost:0 "แม้ว่าข้าจะพยายามอย่างดีที่สุด แต่ [actor.GetTitledFirstName] ได้ค้นคว้าข้อโต้แย้งของ [actor.GetHerHis] มาเป็นอย่างดีอย่างชัดเจน และ ทำให้ฝูงชนเชื่อฟัง [actor.GetHerHis] แทบจะในทันที [actor.GetSheHe|U] ยังคงตำหนิข้าต่อไปนานกว่าหนึ่งชั่วโมง กล่าวหาข้าในทุกความชั่วร้าย และถึงกับบอกเป็นนัยว่าความภักดีของข้าต่อ [recipient.GetFaith.HighGodName] เป็นที่น่าสงสัย\n\nในที่สุด ข้าก็หนีไป ตามด้วยห่าผลิตผลเน่าเสียจากฝูงชน"

 religious_interaction.2403.desc:0 "[victim.GetTitledFirstName] ไม่มีโอกาสแม้ แต่น้อย แม้ว่า [victim.GetSheHe] จะเชื่อว่า [victim.GetHerselfHimself] เตรียมตัวมาอย่างดี ข้าปัดเป่าข้อโต้แย้งอันอ่อนแอของ [victim.GetHerHis] ราวกับแมลงวัน ทุกครั้งที่โต้แย้ง [victim.GetFirstNameNoTooltip] ก็สะดุ้งราวกับถูกตี เมื่อเวลาผ่านไป [victim.GetSheHe] ดูเหมือนจะไม่สามารถปกป้อง [victim.GetHerselfHimself] ได้จนแม้ แต่ฝูงชนก็เงียบไป\n\n"...และนั่นคือเหตุผล" ข้าพูดขณะยกมือขึ้นอย่างน่าทึ่ง นิ้วชี้กล่าวหาชี้ไปทั่วห้อง "ว่าเจ้าจะไม่มีวัน—"\nข้าหยุดเมื่อตระหนักว่า [victim.GetFirstNameNoTooltip] กำลังหอบหายใจและกุม"
 religious_interaction.2403.conclusion_either:0 "หน้าอกของ [victim.GetHerHis]"
 religious_interaction.2403.conclusion_man:1 "แขนของ [victim.GetHerHis]"
 religious_interaction.2403.conclusion_woman:1 "ท้องของ [victim.GetHerHis]"
 religious_interaction.2403.a.low_compassion:0 ""เลือกทางขี้ขลาดสินะ ข้าเห็น""
 religious_interaction.2403.a.zealous:0 ""ดูเหมือนว่า [ROOT.Char.GetFaith.PantheonTerm] [ROOT.Char.GetFaith.PantheonTermHasHave] ได้เลือกผู้ชนะแล้ว""
 religious_interaction.2403.a.stubborn:0 ""เฮ้ ข้ายังพูดไม่จบ!""
 religious_interaction.2403.a:0 ""ท่าน... ท่านเป็นอะไรหรือไม่?""
 religious_interaction.2403.a.tt:0 "[victim.GetShortUIName] หัวใจวายและ [character_death_dies|E]"

 religious_interaction.2500.desc:0 "การที่ท่านกลับใจได้... ต้องเป็นสัญญาณจาก [ROOT.Char.GetFaith.HighGodNameAlternate] แน่! ท่านยินดีเข้าร่วมศรัทธาที่แท้จริง"
 religious_interaction.2500.a:0 "สรรเสริญ [ROOT.Char.GetFaith.HighGodName]!"

 religious_interaction.2501.desc:0 "ท่านต้องล้อเล่นแน่ๆ? ความพยายามอันโปร่งใสของท่านในการหลบหนีทางการเมืองจะไม่มีวันขัดขวางความพิโรธของ [recipient.GetFaith.HighGodName] ได้!"
 
 #########################
 # Exaltation of Pain tenet
 #########################

 religious_interaction.2600.t: "บทเรียนแห่งพระคุณ"
 religious_interaction.2600.desc.recipient: "[actor.GetTitledFirstName|U]ค่อยๆ จูงมือข้าไปยังชุดเครื่องมือทั้งมีคมและไม่มีคมที่เราจะใช้ในพิธีกรรมครั้งนี้ ใบมีดเล่มหนึ่งสะท้อนแสง และข้ารู้สึกถึงความสงบที่แผ่ซ่านเข้ามาในใจข้า\n\nเมื่อถือเครื่องมือไว้ในมือ ข้าส่งสัญญาณให้[actor.GetHerHim]หันหลัง ขณะที่[actor.GetSheHe]เลิกเสื้อของ[actor.GetHerHis]ขึ้น เผยให้เห็นผิวหนังบริสุทธิ์บนแผ่นหลัง ข้าเริ่มลงมือ และไม่ช้าเสียงครางต่ำๆ และเสียงฮึดฮัดก็เปลี่ยนเป็นเสียงฮัมเบาๆ ในลำคอของ[actor.GetHerHis]\n\nข้ารู้แล้วว่าจะใช้เครื่องมือชิ้นใดเพื่อขัดเกลาพระคุณของตนเองให้ละเมียดยิ่งขึ้น"
 religious_interaction.2600.desc.actor: "[recipient.GetTitledFirstName|U]พิจารณาเครื่องมือแห่งการข้ามพ้นอย่างระมัดระวัง, ตัวสั่นเล็กน้อยด้วยความคาดหวัง\n\nข้าคว้าข้อมือของ[recipient.GetHerHis] วางใบมีดคมกริบลงในมือของ[recipient.GetHerHis] และค่อยๆ กดมันลงบนอกของข้า "ค่อยๆ อย่างแผ่วเบา ใช่หรือไม่? ทำมือให้นิ่งเข้าไว้ เรากำลังเดินอยู่บนเส้นด้ายบางๆ ที่นี่"\n\n[recipient.GetFirstNameNoTooltip]มองตาข้าแล้วพยักหน้า จากนั้นก็เริ่มปลดกระดุมเสื้อของ[recipient.GetHerHis]เอง เผยให้เห็นผืนผิวหนังบริสุทธิ์ไร้รอยแผลเป็น ซึ่งในไม่ช้าจะได้รับพระคุณแห่ง[recipient.GetFaith.HighGodName]"
 religious_interaction.2600.a: ""ให้เราข้ามพ้นไปด้วยกันเถิด""

 religious_interaction.2610.desc: "โชคร้ายที่ข้ามีภารกิจสำคัญบางอย่างที่ต้องดูแลในครั้งนี้... แต่ขอให้เรานมัสการด้วยความศรัทธาอันแรงกล้ายิ่งขึ้นในครั้งหน้าเถิด!"
 religious_interaction.2610.a: "น่าเสียดายยิ่งนัก"

 attempted_transcendence_together_opinion: "พยายามข้ามพ้นไปด้วยกัน"
 religious_interaction.excommunication.opening: "[excommunication_issuer.Custom2('AppropriateGreeting', ROOT.Char)]"
 TITLE_TIER_REASON: "[puppet_or_actor.GetShortUINamePossessive|U] [title_tier|E]: $VALUE|=+0$"
 EXCOMMUNICATED_REASON: "[puppet_or_actor.GetShortUIName|U] [CharAreIs(puppet_or_actor)] [GetTrait('excommunicated').GetName( actor.Self )]: $VALUE|=+0$"
 custom.every_order_tenet_accepted: "#high [TopScope.GetValue('order_tenet_accepted_count')|0]#! "
 religious_interaction.1.price_feud: "\n\nBut this will hardly cleave you two in twain, will it? Thus, I have sent vile accusations against [secondary_recipient.GetFirstName] to all House [secondary_recipient.GetHouse.GetName], on your behalf.\n\nYour [actor.Custom2('RelationToMePossessive', SCOPE.sC('secondary_recipient'))] family does now seem interested in a... #EMP permanent#! separation."
 religious_interaction.1.price_lease: "\n\nThis false pronouncement has its price: the lease of [barony_to_lease.GetName] to the [lease_order.GetName]. And should you cast aside these servants of the faith, as you have your [actor.Custom2('RelationToMeShort', SCOPE.sC('secondary_recipient'))]... your soul will be doubly stained."
 religious_interaction.1.price_hook: "\n\nConsider the favor your [recipient.GetTitleAsName] has done you with this suspect declaration. Consider, too: it is as good to give as it is to receive."
 religious_interaction.1.price_vows: "\n\nThese are tenuous grounds... and so I have produced evidence that, before [secondary_recipient.GetSheHe] became your [actor.Custom2('RelationToMeShort', SCOPE.sC('secondary_recipient'))], [secondary_recipient.GetFirstNameNoTooltip] made the vows of a [joining_order_title.GetAdjective] [secondary_recipient.Custom('SisterBrother')].\n\nI will personally ensure [secondary_recipient.GetHerHis] devotion unto death."
 religious_interaction.1.price_none: "\n\nThis is a farce, of course. A sordid transaction that has filthied my soul. But I cannot, in good conscience, force you to share a marital bed with [secondary_recipient.GetFirstNameNoTooltip] any longer."
 religious_interaction.1.a_feud: "You evil [recipient.GetFaith.PriestNeuter]! What have you done?!?"
 religious_interaction.1.a_hook: "Free of a [actor.Custom2('RelationToMeShort', SCOPE.sC('secondary_recipient'))]... and saddled by a [recipient.GetTitleAsNameNoTooltip]."
 religious_interaction.6.price_feud: "\n\nBut this will hardly cleave the two in twain, will it? Thus, I have sent vile accusations against [secondary_recipient.GetFirstName] to all House [secondary_recipient.GetHouse.GetName], on [actor.GetFirstNamePossessiveNoTooltip] behalf.\n\n[actor.GetHerHis|U] [actor.Custom2('RelationToMePossessive', SCOPE.sC('secondary_recipient'))] family does now seem interested in a... #EMP permanent#! separation."
 religious_interaction.6.price_lease: "\n\nThis false pronouncement has its price: the lease of [barony_to_lease.GetName] to the [lease_order.GetName]. And should [secondary_recipient.GetFirstNameNoTooltip] cast aside these servants of the faith, as you have [actor.GetHerHis] [actor.Custom2('RelationToMeShort', SCOPE.sC('secondary_recipient'))]... [actor.GetHerHis] soul will be doubly stained."
 religious_interaction.6.price_hook: "\n\nConsider the favor your [recipient.GetTitleAsName] has done you with this suspect declaration. Consider, too: it is as good to give as it is to receive."
 religious_interaction.6.price_vows: "\n\nThese are tenuous grounds... and so I have produced evidence that, before [secondary_recipient.GetSheHe] became [actor.GetFirstNamePossessiveNoTooltip] [actor.Custom2('RelationToMeShort', SCOPE.sC('secondary_recipient'))], [secondary_recipient.GetFirstNameNoTooltip] made the vows of a [joining_order_title.GetAdjective] [secondary_recipient.Custom('SisterBrother')].\n\nI will personally ensure [secondary_recipient.GetHerHis] devotion unto death."
 religious_interaction.6.price_none: "\n\nThis is a farce, of course. A sordid transaction that has filthied my soul. But I cannot, in good conscience, force [actor.GetFirstNameNoTooltip] to share a marital bed with [secondary_recipient.GetFirstNameNoTooltip] any longer."
 religious_interaction.3.desc_subordinate: "On behalf of all [actor.GetFaith.HighGodNamePossessive] representatives on Earth, I grant your request."
 religious_interaction.1010_subordinate: "As your intercessor into the most sacred of [actor.GetFaith.GetAdjective] ears, the holiest of [actor.GetFaith.GetAdjective] hearts, I pass down to you reprieve from the burden of your sins.\n\nYour generous donation has earned you forgiveness."
 religious_interaction.1020.requested: "I have heard disturbing reports from [actor.GetTitledFirstName] about your misdeeds. At [actor.GetHerHis] urging, I have excommunicated you from the [recipient.GetFaith.GetAdjective] faith.\n\nMay [recipient.GetFaith.HighGodName] have mercy on your soul."
 religious_interaction.1020.sin: "Disturbing reports from [actor.GetTitledFirstName] speak to your [my_sinful_trait.GetName( ROOT.Char )] nature. At [actor.GetHerHis] urging, I have excommunicated you from the [recipient.GetFaith.GetAdjective] faith.\n\nMay [recipient.GetFaith.HighGodName] have mercy on your soul."
 religious_interaction.1020.empire: "Your claim to empire has divided the [recipient.GetFaith.GetAdjective] faith. At [actor.GetTitledFirstNamePossessive] urging, I have excommunicated you."
 religious_interaction.1020.a.tt_petition: "#help Gain [piety|E]. After one year, petition your [head_of_faith|E] in person and choose #high $petition_head_of_faith_decision_option_repentance$#!. See [Concept( 'excommunicated_recovery', 'recovery options' )|E].#!"
 religious_interaction.1020.a.tt_declaration: "#help Gain [piety|E]. After one year, use #high $declaration_of_repentance_interaction$#! with a valid cleric. See [Concept( 'excommunicated_recovery', 'recovery options' )|E].#!"
 religious_interaction.1020.a: "I will accept my penance and seek absolution"
 religious_interaction.1020.b: "Curse [actor.GetFirstNameNoTooltip] for this!"
 religious_interaction.1020.b.tt: "#help Lose [stress|E]. Progress toward [rivalry|E] with [actor.GetShortUIName].#!"
 religious_interaction.1020.c: "Curse the [recipient.GetTitleAsNameNoTooltip] for listening to [actor.GetHerHim]!"
 religious_interaction.1020.c.tt: "#help Lose [stress|E]. Progress toward [rivalry|E] with [recipient.GetShortUIName]. [GetTrait('cynical').GetName( GetNullCharacter )], [GetTrait('wrathful').GetName( GetNullCharacter )], and [GetTrait('arbitrary').GetName( GetNullCharacter )] [courtiers|E] approve.#!"
 religious_interaction.1021.generic: "We may all err, for we are born in sin. Alas in you, I do not see even an attempt to walk the path of Christ."
 religious_interaction.1021.empire: "In these end days, you have put your ambition before the needs of Christendom. Your claim to empire is a canker on the body of the Church!"
 religious_interaction.1021.clergy_hostility: "Our enmity is no secret. Yet it is for your love of sin, for your contumacy, that I cast you out."
 religious_interaction.1021.sin: "Your [my_sinful_trait.GetName( ROOT.Char )] nature is known to all. I can not let your example lead the flock astray."
 religious_interaction.1021.conclusion: "\n\nYou are excommunicated from the [actor.GetFaith.GetAdjective] faith. May [actor.GetFaith.HighGodName] have mercy on your soul."
 religious_interaction.1021.a: "I submit to the judgment of the Church."
 religious_interaction.1021.b: "My crown is from [recipient.GetFaith.HighGodName], not from the [actor.GetTitleAsNameNoTooltip]!"
 religious_interaction.1021.b.tt: "#help Lose [stress|E]. Progress toward [rivalry|E] with [actor.GetShortUIName]. [GetTrait('cynical').GetName( GetNullCharacter )], [GetTrait('wrathful').GetName( GetNullCharacter )], and [GetTrait('arbitrary').GetName( GetNullCharacter )] [courtiers|E] approve.#!"
