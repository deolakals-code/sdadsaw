l_english: 
 religious_interaction.1.opening:0 "[recipient.Custom2('AppropriateGreeting', ROOT.Char)]"
 religious_interaction.1.desc:0 "หลังจากสวดภาวนาและไตร่ตรองอย่างถี่ถ้วน ข้าได้ตัดสินใจที่จะอนุมัติคำขอของท่านให้หย่าร้าง [secondary_recipient.GetWifeHusband] ของท่าน [secondary_recipient.GetFirstNameNoTooltip],"
 religious_interaction.1.consanguinity:0 "ด้วยเหตุแห่งการสมรสร่วมสายโลหิต"
 religious_interaction.1.fallback:0 "ด้วยเหตุแห่งการต้องสงสัยว่าคบชู้"
 religious_interaction.1.adultery:0 "ด้วยเหตุแห่งการคบชู้"
 religious_interaction.1.different_faith:0 "ด้วยเหตุแห่งการมิได้ยึดมั่นในศรัทธาที่แท้จริง"
 religious_interaction.1.eunuch:0 "ด้วยเหตุแห่งการมิได้มีความพร้อมเพียงพอ"
 religious_interaction.1.a:0 "ข้าขออภัย [secondary_recipient.GetFirstNameNoTooltip]"
 
 religious_interaction.2.desc:0 "หลังจากไตร่ตรองอย่างถี่ถ้วน ข้าได้ตัดสินใจว่าเป็นการดีที่สุดสำหรับตระกูลของเราที่จะอนุมัติคำขอของท่านให้หย่าร้าง [secondary_recipient.GetWifeHusband] ของท่าน [secondary_recipient.GetFirstNameNoTooltip],"
 religious_interaction.2.infertility:0 "ด้วยเหตุแห่งการปฏิเสธที่จะสมสู่ในการสมรส"
 religious_interaction.2.adultery:0 "ด้วยเหตุแห่งการละเมิดความศักดิ์สิทธิ์ของการสมรสโดยการสมสู่กับผู้อื่น"
 
 religious_interaction.3.desc:0 "ข้าได้พิจารณาสภาพอันเลวร้ายของท่านแล้ว และตัดสินใจที่จะอนุมัติคำขอของท่าน"
 religious_interaction.3.defensive_war:0 "ขอให้ทุนทรัพย์นี้ช่วยท่านปกป้องศรัทธาจาก [war_target.GetTitledFirstName] และฝูงชนชาว [war_target.GetFaith.GetAdjective] ที่รุกรานของ [war_target.GetHerHis]!"
 religious_interaction.2.offensive_war:0 "ขอให้ทุนทรัพย์นี้นำชัยชนะมาสู่ท่านในสงครามกับ [war_target.GetTitledFirstName]!"
 religious_interaction.3.fallback:0 "ขอให้ทุนทรัพย์นี้ช่วยท่านเผยแผ่ศรัทธาที่แท้จริงในดินแดนของท่าน!"
 religious_interaction.3.a:0 "สรรเสริญ [ROOT.Char.GetFaith.WealthGodName] การคืนภาษีมาถึงแล้ว!"
 religious_interaction.3.b:0 "ทุนทรัพย์นี้จะนำชัยชนะมาสู่ข้า!"
 religious_interaction.3.c:0 "ข้าจะใช้ทรัพย์สมบัตินี้อย่างชาญฉลาด"
 religious_interaction.3.d:0 "ทองคำนี้จะเยียวยาคลังที่ว่างเปล่าของข้า!"

 religious_interaction.32.desc:0 "ข้าได้พิจารณาคำขอของท่านแล้ว และตัดสินใจที่จะปฏิเสธ"
 religious_interaction.32.a:0 "โอ้ ไม่นะ!"

 religious_interaction.4.desc:0 "ข้าได้พิจารณาคำขอของท่านแล้ว และตัดสินใจที่จะยอมรับการอ้างสิทธิ์ของท่านใน [target.GetName]"
 religious_interaction.4.child:0 "เนื่องจาก [secondary_recipient.GetTitledFirstName] เป็นเพียงเด็ก ท่านจึงมีสิทธิ์ที่จะเข้ามาแทรกแซง"
 religious_interaction.4.they_are_female:0 "เนื่องจาก [secondary_recipient.GetTitledFirstName] เป็นสตรี ท่านจึงมีสิทธิ์ที่จะเข้ามาแทรกแซง"
 religious_interaction.4.they_are_male:0 "เนื่องจาก [secondary_recipient.GetTitledFirstName] เป็นบุรุษ ท่านจึงมีสิทธิ์ที่จะเข้ามาแทรกแซง"
 religious_interaction.4.fallback:0 "มีหลักฐานที่ไม่อาจปฏิเสธได้ปรากฏขึ้นว่าบรรพบุรุษของท่านเคยปกครองดินแดนนี้ในสมัยโบราณจริง"
 religious_interaction.4.a:0 "ข้าจะพิสูจน์ตนเองว่าเป็นผู้ปกครองที่คู่ควร!"

 religious_interaction.42.desc:0 "ข้าได้พิจารณาคำขอของท่านสำหรับสิทธิ์ใน [target.GetName] แล้ว และตัดสินใจที่จะปฏิเสธ"
 religious_interaction.42.a:0 "ให้ตายสิ!"

 religious_interaction.5.child:0 "เนื่องจากความเป็นผู้เยาว์ของท่าน,"
 religious_interaction.5.they_are_female:0 "เนื่องจากสถานะความเป็นสตรีของท่าน,"
 religious_interaction.5.they_are_male:0 "เนื่องจากสถานะความเป็นบุรุษของท่าน,"
 religious_interaction.5.fallback:0 "เนื่องจากการขาดความศรัทธาอย่างเห็นได้ชัดของท่าน,"
 religious_interaction.5.outro:0 "ซึ่งเป็นสภาวะที่สร้างความกังวลใจให้แก่ศาสนจักรอย่างยิ่ง"
 religious_interaction.5.outro_different_recipient: "ข้าได้มอบสิทธิ์ใน [target.GetName] ให้แก่ [actor.GetName] ตามคำขอของ[actor.GetHerHis]"
 religious_interaction.5.self: "ข้าได้ตัดสินใจที่จะไล่ตามสิทธิ์ใน [target.GetName] ของข้า เนื่องจากมันคือสิทธิอันชอบธรรมของข้า"
 religious_interaction.5.a:0 "นี่มันเรื่องอัปยศ!"

 religious_interaction.6.opening:0 "[recipient.Custom2('AppropriateGreeting', ROOT.Char)]"
 religious_interaction.6.desc:0 "หลังจากสวดภาวนาและไตร่ตรองอย่างถี่ถ้วน ข้าได้ตัดสินใจที่จะอนุมัติคำขอของท่านให้หย่าร้าง [secondary_actor.GetFirstNameNoTooltip] และ [secondary_recipient.GetWifeHusband] ของพวกเขา [secondary_recipient.GetFirstNameNoTooltip],"
 religious_interaction.6.consanguinity:0 "ด้วยเหตุแห่งการสมรสร่วมสายโลหิต"
 religious_interaction.6.fallback:0 "ด้วยเหตุแห่งการต้องสงสัยว่าคบชู้"
 religious_interaction.6.adultery:0 "ด้วยเหตุแห่งการคบชู้"
 religious_interaction.6.different_faith:0 "ด้วยเหตุแห่งการมิได้ยึดมั่นในศรัทธาที่แท้จริง"
 religious_interaction.6.eunuch:0 "ด้วยเหตุแห่งการมิได้มีความพร้อมเพียงพอ"
 religious_interaction.6.a:0 "ข้าขออภัย [secondary_recipient.GetFirstNameNoTooltip]"

 religious_interaction.1001.t.fatwa:0 "ฟัตวาประกาศแล้ว!"
 religious_interaction.1001.t:0 "การประณามทางกฎหมาย!"
 religious_interaction.1001.desc:1 "[ROOT.Char.Custom2('RelationToMe', SCOPE.sC('actor'))] ของข้า [actor.GetTitledFirstName] ได้เห็นข้าถูกประณามว่าเป็นคนบาปในคำประกาศที่ออกโดย [actor.GetFaith.PriestNeuterPlural] ของ [actor.GetHerHis]!\n\nสิ่งนี้อาจถูกใช้เป็นพื้นฐานทางกฎหมายเพื่อโต้แย้งว่าข้าไม่เหมาะสมที่จะปกครองดินแดน [recipient.GetFaith.GetAdjective]"
 religious_interaction.1001.a:0 "หาก [actor.GetSheHe] มิใช่เจ้าเหนือหัวของข้า ข้าคงจะ..."
 religious_interaction.1001.a.revoke_tt:0 "[actor.GetTitledFirstName] สามารถ [revoke|E] ตำแหน่งหนึ่งของข้าได้"

 # Religious Head of Faith Interactions
 religious_interaction.1010:0 "เป็นเรื่องน่ายกย่องที่ท่านพยายามไถ่บาป ข้ายอมรับการบริจาคอันใจกว้างของท่านและส่งพรของข้าเป็นการตอบแทน"
 religious_interaction.1011:0 "การกระทำผิดของท่านรุนแรงเกินกว่าจะไถ่ถอนได้ด้วยเพียงทองคำ หากท่านปรารถนาที่จะไถ่บาปอย่างแท้จริง ท่านต้องเปลี่ยนวิถีทางของท่านและพิสูจน์ให้ข้าเห็นว่าท่านแสวงหาการให้อภัยอย่างแท้จริง เมื่อนั้นข้าจึงจะยอมรับการบริจาคของท่าน"
 religious_interaction.1020:0 "ข้าได้ยินข่าวที่น่ากังวลบางอย่างจาก [actor.GetTitledFirstName] เกี่ยวกับการกระทำผิดของท่าน"
 religious_interaction.1021:0 "ท่านอาจเรียกตนเองว่าเป็น [actor.GetFaith.GetAdherentName] แต่การกระทำของท่านพิสูจน์ว่าท่านไม่ได้ดำเนินตามเส้นทางของ [actor.GetFaith.HighGodName] อย่างแท้จริง เนื่องจากข้าไม่สามารถอนุญาตให้พฤติกรรมชั่วร้ายของท่านซ่อนอยู่เบื้องหลังหน้ากากแห่งความชอบธรรมของ [actor.GetFaith.GetAdjective] ได้ ข้าจึงไม่มีทางเลือกอื่นนอกจากขับไล่ท่านออกจากศรัทธา ขอ [actor.GetFaith.HighGodName] ทรงเมตตาวิญญาณของท่านด้วยเถิด"
 religious_interaction.1022:0 "ข้ารู้สึกไม่สบายใจอย่างยิ่งกับเรื่องราวที่ท่านเล่าถึงการกระทำผิดของ [secondary_recipient.GetTitledFirstNamePossessive] มันเจ็บปวดที่ต้องทำ เช่นนี้ แต่ข้าเห็นด้วยว่าเพื่อประโยชน์ของศรัทธา [actor.GetFaith.GetAdjective] [secondary_recipient.GetSheHe] จะต้องถูกขับออกจากศาสนา"
 religious_interaction.1023:0 "ท่านกำลังคิดอะไรอยู่ในการพยายามขับไล่เพื่อน [actor.GetFaith.GetAdherentName] ออกจากศาสนา? ศรัทธา [actor.GetFaith.GetAdjective] ไม่ใช่เครื่องมือที่จะใช้เพื่อผลประโยชน์ทางการเมือง! ท่านควรนับว่าโชคดีที่ข้าไม่ขับไล่ท่านออกจากศาสนา เพราะการร้องขอ เช่นนี้"
 religious_interaction.1024:0 "ข้าเห็นว่าท่านได้สำนึกผิดในบาปของท่านอย่างแท้จริงและได้พยายามอย่างยิ่งที่จะไถ่ถอนตนเอง แม้ว่าการล่วงละเมิดต่อศรัทธา [actor.GetFaith.GetAdjective] ของท่านจะร้ายแรงยิ่งนัก แต่การกระทำล่าสุดของท่าน ทำให้ข้าเชื่อว่าท่านสมควรได้รับโอกาสอีกครั้ง\n\nด้วยเหตุนี้ ข้าจึงขอยกเลิกการขับไล่ออกจากศาสนาของท่านและต้อนรับท่านกลับสู่ศรัทธา [actor.GetFaith.GetAdjective]"
 religious_interaction.1025:0 "ท่านคิดว่าข้าขับไล่ผู้คนออกจากศาสนาอย่างง่ายดายหรือ? ท่านคิดว่าคำขอโทษครึ่งๆ กลางๆ เพียงพอที่จะชดเชยหรือ? อ้อนวอนไปเถิด ท่านจะไม่ได้รับอนุญาตให้กลับเข้าสู่ศรัทธา [actor.GetFaith.GetAdjective] จนกว่าท่านจะพิสูจน์ว่าท่านได้เปลี่ยนวิถีทางชั่วร้ายของท่านแล้ว"
 religious_interaction.1030:0 "หลังจากไตร่ตรองเป็นเวลานาน ข้าได้ข้อสรุปว่าคำพูดของท่านเป็นความจริงและชาญฉลาด ข้าจะเข้าร่วมนิกายสงฆ์และเริ่มต้นชีวิตใหม่ในการรับใช้ [actor.GetFaith.HighGodName] เพียงผู้เดียว"
 religious_interaction.1031:0 "ข้อเสนอแนะของท่านให้ข้าถอนรากถอนโคนชีวิตทั้งชีวิตและหนีไปยังอารามอันโดดเดี่ยวบางแห่งนั้นไร้สาระ ข้ามีความสุขในที่ที่ข้าอยู่ และข้าไม่มีแผนที่จะเปลี่ยนแปลงสิ่งนั้น"
 religious_interaction.1000.positive:0 "ข้ายินดีที่ [recipient.GetFirstNameNoTooltip] เห็นความชาญฉลาดในคำขอของข้า"
 religious_interaction.1000.negative:0 "โชคร้ายเสียจริง..."
 religious_interaction.1000.strong_negative:0 "ให้ตายสิ!"
 religious_interaction.1024.positive:0 "ข้ายินดีที่ [recipient.GetFirstNameNoTooltip] เห็นความชาญฉลาดในการกระทำนี้"

 religious_interaction.2002.desc:0 "ข้าตัดสินใจที่จะติดตามท่านเข้าสู่แสงสว่างและเปลี่ยนมานับถือ [ROOT.Char.GetFaith.GetName]!"
 religious_interaction.2002.a:0 "สรรเสริญแด่ [ROOT.Char.GetFaith.HighGodName]!"

 religious_interaction.2003.desc:0 "ศรัทธาของข้าแข็งแกร่งเกินกว่าจะถูกชักจูงด้วยคำพูดทางโลกของท่าน ข้าขอรับรางวัลของข้าใน [recipient.GetFaith.DivineRealm] เสียดีกว่า"
 religious_interaction.2003.hooking_out:0 "\n\nข้ายังต้องการเตือนท่านว่าท่านเป็นหนี้ข้า และไม่ควรไล่ตามข้าเพียง เพราะข้าเป็นผู้ศรัทธาที่แท้จริง"
 religious_interaction.2003.a:0 "ข้าเพียงปรารถนาความรอดของท่าน"
 religious_interaction.2003.b:0 "เช่นนั้น ท่านจะต้องชดใช้ในโลกนี้!"
 religious_interaction.2003.c:0 "อย่าคิดว่าข้าจะปล่อยให้ท่านรอดพ้นไปได้!"
 religious_interaction.2003.d:0 "โอ้ ข้าคิดว่าท่านจะเชื่อในสิ่งที่ข้าบอกให้ท่านเชื่ออย่างแน่นอน"

 religious_interaction.2011.desc:0 "ข้ายินดีเข้าร่วมการสรรเสริญของท่าน แต่ค่าใช้จ่ายมหาศาลในการปรับปรุง [recipient.GetFaith.HouseOfWorshipPlural] และการเผยแผ่ศาสนาในหมู่ไพร่ของข้า...\n\nหากท่านจะช่วยจ่ายค่าใช้จ่ายเหล่านี้ ข้ายินดีอย่างยิ่งที่จะสวดภาวนาเพื่อ [ROOT.Char.GetFaith.HighGodName] ของท่าน"
 religious_interaction.2011.a:0 "ทุกอย่างเพื่อศรัทธา"
 religious_interaction.2011.b:0 "ข้าจะไม่จ่ายเพื่อความรอดนิรันดร์ของท่าน!"
 religious_interaction.2011.c:0 "ท่านจะทำสิ่งนี้เพื่อบางสิ่งที่ล้ำค่ากว่าทองคำมาก"

 religious_interaction.2012.desc:0 "ข้าเห็นความชาญฉลาดในศรัทธาของท่าน แต่ข้าหวังว่าท่านจะเข้าใจว่ามันเป็นเส้นทางที่ยาวไกลและคดเคี้ยวเพียงใดจากความมืดสู่แสงสว่าง\n\nบางทีหากท่านสัญญาว่าจะสนับสนุนข้าในทุกวิถีทางที่ข้าต้องการ การเดินทางก็คงจะง่ายขึ้น"
 religious_interaction.2012.a:0 "ข้ายอมรับ เพื่อประโยชน์ของผู้ศรัทธาทุกหนทุกแห่ง"
 religious_interaction.2012.b:0 "ข้าจะไม่ต่อรองเพื่อวิญญาณของท่าน!"
 religious_interaction.2012.c:0 "ท่านมีหนี้อื่นที่ต้องชดใช้ให้ข้าก่อน"

 religious_interaction.2021.opening:0 "[actor.Custom2('AppropriateGreeting', ROOT.Char)]"
 religious_interaction.2021.desc:0 "[actor.Custom2('AppropriateGreeting', ROOT.Char)]\nถึงเวลาแล้วที่ท่านจะติดตามข้าเข้าสู่แสงสว่าง [actor.Custom2('RelationToMe', SCOPE.sC('recipient'))] ของข้า เมื่อพิจารณาถึงทุกสิ่งที่ท่านเป็นหนี้ข้า ข้าขอเรียกร้องให้ท่านเปลี่ยนมานับถือ [actor.GetFaith.GetName]!"
 religious_interaction.2021.a:0 "ข้า... ตกลง [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('actor'))] ของข้า"
 
