l_english: 
 faith_creation.1001.t.schism:0 "การแตกแยกของ [reformed_faith.GetAdjectiveNoTooltip]"
 faith_creation.1001.t.reformation:0 "การปฏิรูปของ [reformed_faith.GetAdjectiveNoTooltip]"
 faith_creation.1001.desc.schism:0 "การแตกแยกครั้งใหม่ภายใน [reformed_faith.GetReligion.GetName] ได้เกิดขึ้นเมื่อ [reformer.GetTitledFirstName] และผู้ติดตามของ [reformer.GetHerHis] ได้แยกตัวออกจากศรัทธา [old_faith.GetAdjective] เพื่อก่อตั้งขบวนการทางศาสนาใหม่"
 faith_creation.1001.desc.reformation:0 "[reformer.GetTitledFirstName] บุคคลสำคัญในหมู่ [reformed_faith.GetAdherentNamePlural] ได้รวบรวม [reformer.Custom('DefaultPriestTitle')] ทุกคนในแผ่นดินเพื่อหารือเกี่ยวกับความเชื่อของพวกเขาและสถาปนาหลักคำสอนอย่างเป็นทางการสำหรับศรัทธานอกรีต"
 faith_creation.1001.desc.schism.personal:0 "[old_faith.AltPriestTermPlural] [old_faith.GetAdjective] ได้หลงทางและไม่อาจไว้วางใจให้นำทางเราได้อีกต่อไป เพื่อแก้ไขปัญหานี้ ข้าได้รวบรวมกลุ่ม [reformer.Custom('DefaultPriestTitlePlural')] ที่คัดสรรแล้วเพื่อหารือเกี่ยวกับอนาคตของศรัทธาของเรา"
 faith_creation.1001.desc.reformation.personal:0 "ในที่สุด ข้าก็สามารถรวบรวม [reformer.Custom('DefaultPriestTitle')] ที่สำคัญทุกคนในโลกเข้าด้วยกัน เพื่อให้พวกเขาสามารถหารือเกี่ยวกับความเชื่อของเราและสถาปนาหลักคำสอนอย่างเป็นทางการเพื่อนำทางศรัทธาของเราสู่อนาคต"

#Pick one line from this set (Outlook):
 faith_creation.1001.desc.outlook.ghw:0 "\n\n[reformer.Custom('DefaultPriestTitlePlural')] ผู้เปี่ยมศรัทธากำลังพูดถึงการเปิด [reformed_faith.GHWNamePlural] เพื่อเผยแพร่ศรัทธาใหม่ของพวกเขาไปทั่วโลกและ"
 faith_creation.1001.desc.outlook.pacifism:0 "\n\n[reformer.Custom('DefaultPriestTitlePlural')] [reformed_faith.GetAdjectiveNoTooltip] เหล่านี้ได้ประณามความรุนแรงและการนองเลือด โดยกล่าวว่าสงครามนำไปสู่ความทุกข์และความเกลียดชังเท่านั้น และ"
 faith_creation.1001.desc.outlook.dogmatic:0 "\n\n[reformer.Custom('DefaultPriestTitlePlural')] เหล่านี้ได้ประกาศให้ [reformed_faith.GetNameNoTooltip] เป็นศรัทธาแท้หนึ่งเดียว และ"
 faith_creation.1001.desc.outlook.accepting:0 "\n\n[reformer.Custom('DefaultPriestTitlePlural')] [reformed_faith.GetAdjectiveNoTooltip] เหล่านี้กำลังส่งเสริมความร่วมมือและความอดทนอดกลั้น แม้กระทั่งต่อผู้ที่ไม่เชื่อ และ"
 faith_creation.1001.desc.outlook.fallback:0 "\n\n[reformer.Custom('DefaultPriestTitlePlural')] [reformed_faith.GetAdjectiveNoTooltip] เหล่านี้ได้นำมุมมองที่เป็นจริงและสมดุลมาใช้กับศรัทธาอื่น ๆ และ"

#And one line from this second set (Beliefs):
 faith_creation.1001.desc.belief.sacrifice:0 "อ้างว่าหนทางเดียวที่จะแสดงความเลื่อมใสอย่างเหมาะสมคือการถวายเกียรติแด่ [reformed_faith.HighGodName] ด้วยการบูชายัญมนุษย์!"
 faith_creation.1001.desc.belief.indulgent:0 "ส่งเสริมให้ผู้นับถือตามใจกิเลสตัณหาและใช้ชีวิตอย่างเต็มที่"
 faith_creation.1001.desc.belief.incest:0 "กำลังอนุมัติการ แต่งงานของญาติสนิท โดยอ้างว่าสายสัมพันธ์ในครอบครัวเป็นสิ่งศักดิ์สิทธิ์และการ แต่งงาน เช่นนั้นได้รับพร"
 faith_creation.1001.desc.belief.aniconism:0 "ปฏิเสธการใช้สัญลักษณ์ทางศาสนาใด ๆ ทั้งสิ้น โดยอ้างว่าเพียงรูปจำลองไม่สามารถจับภาพความยิ่งใหญ่ของ [reformed_faith.HighGodName] ได้"
 faith_creation.1001.desc.belief.ascetic:0 "กำลังส่งเสริมการบำเพ็ญตบะในหมู่ผู้ติดตาม โดยอ้างว่าการแสวงหาทางวัตถุขัดขวางเส้นทางสู่การบรรลุทางจิตวิญญาณ"
 faith_creation.1001.desc.belief.spirits:0 "ได้ขอความช่วยเหลือจากเหล่าวิญญาณเพื่อช่วยนำทางผู้ศรัทธาผ่านช่วงเวลาที่วุ่นวายเหล่านี้"
 faith_creation.1001.desc.belief.superstition:0 "ความเชื่องมงายโบราณและเรื่องราวปรัมปรามากมายได้รับการยอมรับในหลักคำสอนอย่างเป็นทางการ"
 faith_creation.1001.desc.belief.nature:0 "มีความเคารพอย่างสูงต่อธรรมชาติ แสวงหาที่จะอนุรักษ์และปกป้องจากผู้ที่จะแสวงหาผลประโยชน์เพื่อตนเอง"
 faith_creation.1001.desc.belief.community:0 "ศรัทธาใหม่ได้ผสมผสานเข้ากับประเพณีทางวัฒนธรรมของผู้ติดตามเพื่อสร้างชุมชนที่แน่นแฟ้นของ [reformed_faith.GetAdherentNamePluralNoTooltip] ซึ่งลังเลที่จะยอมรับคนนอก"
 faith_creation.1001.desc.belief.fallback:0 "กำลังขอให้ผู้นับถือทุกคนละทิ้งข้อพิพาทเก่า ๆ และรวมตัวกันเพื่อประโยชน์ของศรัทธาใหม่"

#End with a reference to 
 faith_creation.1001.desc.temporal:0 "\n\n[reformer.GetFirstNameNoTooltip] ได้เลือกที่จะนำขบวนการ [reformed_faith.GetAdjectiveNoTooltip] ที่กำลังเติบโตนี้ด้วยตนเองและได้รับตำแหน่ง [reformed_faith.ReligiousHeadName] ซึ่งเป็นตำแหน่งอันสูงส่งที่คาดว่า [reformer.GetSheHe] จะส่งต่อไปยังทายาทของ [reformer.GetHerHis]"
 faith_creation.1001.desc.temporal.personal:0 "\n\nข้าได้เลือกที่จะนำขบวนการ [reformed_faith.GetAdjectiveNoTooltip] ที่กำลังเติบโตนี้ด้วยตนเองและได้รับตำแหน่ง [reformed_faith.ReligiousHeadName] ซึ่งเป็นตำแหน่งอันสูงส่งที่ข้าจะส่งต่อไปยังลูกหลานของข้า"
 faith_creation.1001.desc.spiritual:0 "\n\n[reformer.Custom('DefaultPriestTitlePlural')] [reformed_faith.GetAdjectiveNoTooltip] ได้เลือก [reformed_hof.GetFirstNameNoTooltip] เป็น [reformed_faith.ReligiousHeadName] คนใหม่ของพวกเขา ผู้ ซึ่งจะกำหนดหลักคำสอนทางศาสนาและตัดสินข้อพิพาทระหว่างศรัทธาสำหรับโลก [reformed_faith.GetAdjectiveNoTooltip] ทั้งหมด"
 faith_creation.1001.desc.spiritual.sameold:0 "\n\n[reformer.Custom('DefaultPriestTitlePlural')] [reformed_faith.GetAdjectiveNoTooltip] ได้เลือกที่จะคง [reformed_hof.GetFirstNameNoTooltip] ไว้เป็น [reformed_faith.ReligiousHeadName] ของพวกเขา [reformer.GetSheHe] จะยังคงกำหนดหลักคำสอนทางศาสนาและตัดสินข้อพิพาทระหว่างศรัทธาสำหรับโลก [reformed_faith.GetAdjectiveNoTooltip] ทั้งหมดต่อไป"
 faith_creation.1001.desc.no_head:0 "\n\nขบวนการที่กำลังเติบโตได้ตัดสินใจที่จะไม่ แต่งตั้งประมุขทางศาสนา โดยเลือกที่จะให้ [reformer.Custom('DefaultPriestTitle')] แต่ละคนกำหนดคำสอนที่เหมาะสมสำหรับ [reformed_faith.HouseOfWorship] ของตนเองแทน"
 faith_creation.1001.desc.no_holy_sites:0 "\n\n[reformed_faith.GetAdherentNamePluralNoTooltip] รอคอยการมาถึงตามคำพยากรณ์ของ [reformed_faith.ReligiousHeadName] ของพวกเขาอย่างใจจดใจจ่อ ผู้นำผู้ยิ่งใหญ่ที่จะรวบรวมผู้ศรัทธาทั้งหมดไว้เบื้องหลังและนำพาสู่ยุคทองใหม่ของ [reformed_faith.GetAdjectiveNoTooltip]"

 faith_creation.1001.o.frightened:0 "[ROOT.Char.GetFaith.random_GoodGodNames] โปรดช่วยเราให้พ้นจาก [second.Custom('GetUnbelieverNamePlural')] กระหายเลือดเหล่านี้!"
 faith_creation.1001.o.heretical:0 "พวกนอกรีตเหล่านี้จะต้องชดใช้ความผิดต่อ [ROOT.Char.GetFaith.HighGodName]!"
 faith_creation.1001.o.crusader:0 "[ROOT.Char.GetFaith.GHWName] สักครั้งสองครั้งจะ ทำให้ [second.Custom('GetUnbelieverNamePlural')] เหล่านี้รู้สำนึก!"
 faith_creation.1001.o.interested:0 "เราควรจับตาดูพัฒนาการใหม่นี้..."
 faith_creation.1001.o.uninterested:0 "ไม่สำคัญว่า [second.Custom('GetUnbelieverNamePlural')] เหล่านี้จะเชื่ออะไร"
 faith_creation.1001.o.getreaction:0 "[ROOT.Char.Custom2('GetFaithCreationReaction', reformer)]"
 faith_creation.1001.o.personal:0 "โลกจะได้เห็นว่า [ROOT.Char.GetFaith.HighGodName] โปรดปรานเรา!"

 faith_creation.1010.t:0 "[HoF.GetFirstNameNoTooltip] ได้รับการประกาศเป็น [faith.ReligiousHeadName|U]"
 faith_creation.1010.desc.start:0 "แม้ว่าความชอบธรรมแห่งศรัทธาของเราไม่เคยเป็นที่สงสัย แต่ช่วงเวลาที่เราถูกบังคับให้อดทนโดยไม่มีผู้นำทางจิตวิญญาณนั้นช่างยากลำบาก ในที่สุดความยากลำบากนี้ก็สิ้นสุดลงแล้ว เนื่องจาก"
 faith_creation.1010.desc.temporal.personal:0 "ในที่สุดข้าก็สามารถโน้มน้าวให้ [faith.AltPriestTermPlural] ยอมรับข้าเป็น [faith.ReligiousHeadName|U] หนึ่งเดียวที่แท้จริงได้"
 faith_creation.1010.desc.temporal:0 "[HoF.GetTitledFirstName] สามารถโน้มน้าวให้ [faith.AltPriestTermPlural] ยอมรับ [HoF.GetHerHim] เป็น [faith.ReligiousHeadName|U] หนึ่งเดียวที่แท้จริงได้"
 faith_creation.1010.desc.spiritual:0 "[faith.AltPriestTermPlural] ได้ประชุมกันเพื่อเลือก [HoF.GetFirstName] เป็น [faith.ReligiousHeadName|U] หนึ่งเดียวที่แท้จริง"
 faith_creation.1010.desc.end:0 "\n\nเมื่อผู้ศรัทธารวมเป็นหนึ่งเดียวภายใต้ผู้นำคนเดียวในที่สุด ดูเหมือนว่ายุคทองใหม่สำหรับ [faith.GetNameNoTooltip] กำลังจะมาถึง"
 faith_creation.1010.desc.end.personal:0 "\n\nเมื่อผู้ศรัทธารวมเป็นหนึ่งเดียวภายใต้ข้าในที่สุด ข้าจะนำ [faith.GetNameNoTooltip] เข้าสู่ยุคทองใหม่!"

 faith_creation.1010.a:0 "ความรุ่งโรจน์แด่ [faith.HighGodName]!"

 faith_creation.1011.message.title:0 "สถาปนาประมุขทางศาสนา"
 faith_creation.1011.message.desc:0 "[faith.AltPriestTermPlural] [faith.GetAdjective] ได้ประกาศให้ [faith.ReligiousHeadName|U] [HoF.GetFirstName] เป็น [head_of_faith|E] ของพวกเขา"
 faith_creation.1001.desc.schism.personal.hof: "I will kneel no longer while [old_hof.GetTitledFirstName] and the [old_faith.GetAdjective] [old_faith.AltPriestTermPlural] lead the faithful astray. I have gathered [reformer.Custom('DefaultPriestTitlePlural')] who share my conviction, and from the [old_rite.GetAdjective] rite we kept, we have forged a faith that owes [old_faith.GetName] nothing."
 faith_creation.1001.desc.schism.hof: "[reformer.GetTitledFirstName] has cast off the authority of [old_hof.GetTitledFirstName] and leads [reformer.GetHerHis] followers away from [old_faith.GetName]. Their [old_rite.GetAdjective] rite has grown into a faith that now answers only to itself."
 faith_creation.1001.desc.belief.pain: "teach that the flesh must be humbled through hardship and pain, for suffering purifies the soul and draws the faithful nearer to [reformed_faith.HighGodName]."
 faith_creation.1001.desc.belief.iconoclasm: "insist that the earthly idols which mimic divine visages be cast down and burned wherever they may be found."
 faith_creation.1001.desc.belief.militant: "teach that the faithful are soldiers first and foremost, sent to spread the faith on the edge of a blade."
 faith_creation.1001.desc.belief.veneration: "venerate the holy departed as intercessors, honoring their relics and calling upon their names in prayer."
 faith_creation.1001.desc.belief.sacraments: "teach that holy grace flows unto mankind only through the sacred rites, and the ordained few."
 faith_creation.1001.desc.belief.penance: "teach that each soul is born with a stain that is cleansed only by confession and penance."
 faith_creation.1001.desc.belief.christology: "have settled a great question of doctrine, fixing the very nature of the divine in terms all the faithful are bound to profess."
 faith_creation.1001.desc.belief.rebirth: "teach that the soul rides a great wheel of rebirth, each life shaped by the deeds of the last."
 faith_creation.1001.desc.belief.learning: "prize learning over almost everything, teaching that to study the world is to know the mind of [reformed_faith.HighGodName] more truly."
 faith_creation.1001.desc.belief.law: "place sacred law over all things, insisting that each line of doctrine be obeyed exactly."
 faith_creation.1001.desc.belief.missionary: "have sworn to bring their teaching to each corner of the earth, so that not a soul remains in darkness."
 faith_creation.1001.desc.belief.hierarchy: "teach that all things have a rightful place, and that harmony flows only when each soul honors the order over it."
 faith_creation.1001.desc.belief.charity: "bid their followers answer hardship with charity, tending the poor, the sick, and the stranger alike."
 faith_creation.1001.desc.belief.family: "count the bonds of blood as sacred, teaching that honoring one's forebears and rearing many children is worship in itself."
 faith_creation.1001.desc.belief.sacred_sites: "build great monuments of stone as testaments to their devotion, holy ground made to outlast generations."
 faith_creation.1001.desc.belief.worldly: "take a pragmatic approach to devotion, trusting that donatives, compromise, and well-placed silences serve the faith as surely as prayer."
 faith_creation.1001.desc.belief.syncretic: "weave the beliefs of their neighbors into their creed, trusting that many paths lead to the same truth."
 faith_creation.1001.o.free_holy_site_actions: "Gain #V [reformed_faith.MakeScope.Var('free_holy_site_actions').GetValue|0]#! free actions to create, demote, elevate, adopt or abandon [holy_sites|E]"
 faith_creation.1002.t: "A Rite Torn Away"
 faith_creation.1002.t.new_faith: "A Faith of Our Own"
 faith_creation.1002.desc.intro.founder: "My [old_rite.GetAdjective] rite has drifted — prayer by prayer, tenet by tenet — and has ceased to be [old_faith.GetName]."
 faith_creation.1002.desc.intro.member: "Our [old_rite.GetAdjective] rite has drifted under [founder.GetTitledFirstName] — prayer by prayer, tenet by tenet — and has ceased to be [old_faith.GetName]."
 faith_creation.1002.desc.intro.observer: "The [old_rite.GetAdjective] rite of [founder.GetTitledFirstName] has drifted — prayer by prayer, tenet by tenet — and has ceased to be [old_faith.GetName]."
 faith_creation.1002.desc.anathema.hof: "\n\n[old_hof.GetTitledFirstName] pronounces judgment: the wayward flock is cast out, severed root and branch."
 faith_creation.1002.desc.anathema.no_hof: "\n\nThe [old_faith.AltPriestTermPlural] of [old_faith.GetName] pronounce judgment from every altar: the wayward flock is cast out, severed root and branch."
 faith_creation.1002.desc.new_head.personal: "The burden of all that follows is mine: I am, as long as I live, [new_faith.ReligiousHeadName|U] of [new_faith.GetName]."
 faith_creation.1002.desc.new_head.founder: "Those they followed into exile, they follow still — [founder.GetFirstNameNoTooltip], [new_faith.ReligiousHeadName|U] of [new_faith.GetName]."
 faith_creation.1002.desc.new_head.other: "[new_hof.GetTitledFirstName] now stands as [new_faith.ReligiousHeadName|U] of [new_faith.GetName]."
 faith_creation.1002.desc.new_head.none: "The new flock lacks a shepherd of any kind; its [new_faith.AltPriestTermPlural] answer only to themselves."
 faith_creation.1002.desc.outro.new_faith: "\n\nA faith of our making, a law of our making — a creed that is newly-voiced, but may already be answered by [old_faith.GetAdherentNamePlural] with censure and with the sword."
 faith_creation.1002.desc.outro.old_faith: "\n\nAll the lands and souls professing [old_rite.GetName] forsake [old_faith.GetName] in a single proclamation. They are strangers to us henceforth — and soon, perhaps, enemies as well."
 faith_creation.1002.a: "Our own faith, at last."
 faith_creation.1002.a.founder: "The path was always ours — now the name is too."
 faith_creation.1002.b: "Heretics, now and forever."
 faith_creation.1002.b.hof: "Let them learn how cold it is outside the fold."
 faith_creation.1002.consequences.tt: "[new_faith.GetName] is a wholly separate [faith|E]:\n$EFFECT_LIST_BULLET$All [characters|E] and [counties|E] of the initiating [rite|E] belong to the new faith\n$EFFECT_LIST_BULLET$[faith_hostility|E] applies between [new_faith.GetName] and [old_faith.GetName], which may allow [holy_wars|E]\n$EFFECT_LIST_BULLET$The [faiths|E] no longer share a [head_of_faith|E]"
 faith_creation.1002.a.free_holy_site_actions: "[new_faith.GetName] gains #V [new_faith.MakeScope.Var('free_holy_site_actions').GetValue|0]#! free actions to create, demote, elevate, adopt or abandon [holy_sites|E]"
 faith_creation.1002.a.lost_ecumenism: "[new_faith.GetName] loses [GetDoctrineType('special_doctrine_ecumenical_christian').GetBaseName]"
 faith_creation.1021.t: "A Rite Within the Fold"
 faith_creation.1021.t.founder: "A Rite of Our Own"
 faith_creation.1021.desc.intro.founder: "[new_rite.GetName] is firmly established, and its followers look to me. We remain [old_faith.GetAdherentNamePlural], though we have parted from [source_rite.GetName]."
 faith_creation.1021.desc.intro.observer: "[founder.GetTitledFirstName] has established a new rite within [old_faith.GetName]. Known to its followers as [new_rite.GetName], it does keep the [old_faith.GetAdjective] faith... in its own fashion."
 faith_creation.1021.desc.divergence.minor: "\n\nIt parts from the [source_rite.GetAdjective] in small things only. "
 faith_creation.1021.desc.divergence.moderate: "\n\nTo those who follow [source_rite.GetName], this new rite's practices are rather strange. "
 faith_creation.1021.desc.divergence.major: "\n\nIts practices stray far enough from the [source_rite.GetAdjectiveNoTooltip] to draw suspicion. "
 faith_creation.1021.desc.differing.tenet: "The sharpest difference is [differing_tenet.GetBaseName]."
 faith_creation.1021.desc.differing.doctrine: "The sharpest difference is [differing_doctrine.GetDescriptiveName]."
 faith_creation.1021.desc.differing.fallback: "No single practice marks the divide."
 faith_creation.1021.desc.outro.founder.mainline: "\n\nWe have parted from the mainline rite, the very measure by which [old_faith.GetNameNoTooltip] judges all others. If they name it presumption, so be it."
 faith_creation.1021.desc.outro.founder.branch: "\n\nWe were always an offshoot, a branch; henceforth we are a branch of our making, and guide ourselves."
 faith_creation.1021.desc.outro.observer: "\n\nNew rites spring up often enough. This one may take root, wither, or fester into heresy; time will tell."
 faith_creation.1021.a.founder: "Let it spread quietly, among the devout."
 faith_creation.1021.b.founder: "Let the whole realm hear of it."
 faith_creation.1021.a: "A living faith has room for many rites."
 faith_creation.1021.b: "Every heresy begins as a novelty."
