l_english: 
 child_personality.0001.t:0 "บุคคลผู้คุกคาม"
 child_personality.0001.opening:0 "เมื่อใดก็ตามที่ข้าเห็น [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('bully'))] ของข้า [bully.GetTitledFirstName] [bully.GetSheHe] ก็มักจะมีวิธีใหม่ๆ มาคอยรังแกข้าเสมอ"
 child_personality.0001.bullying_1:0 "\n\nครานี้ [bully.GetSheHe] ขู่ว่าจะจับหัวข้ายัดทะลุกำแพงส้วม!"
 child_personality.0001.bullying_2:1 "\n\nครานี้ [bully.GetSheHe] ตามข้าทั้งวัน ทำเสียงเห่าและเรียกข้าว่าหมาข้างถนน!"
 child_personality.0001.bullying_3:1 "\n\nครานี้ [bully.GetSheHe] ปัดเชิงเทียนล้มแล้วโยนความผิดให้ข้า!"
 child_personality.0001.end:0 "\n\n[bully.GetSheHe|U] ทำให้ข้ากลัว แต่ข้าจะทำกระไรได้?"
 child_personality.0001.no_bully_fallback:0 "บุตรสาวของ [ROOT.GetCharacter.Custom('lowly_servant_type')] เป็นคนพาลที่ร้ายกาจนัก เมื่อใดก็ตามที่ข้าเห็นนาง นางก็มักจะมีวิธีใหม่ๆ มาคอยรังแกข้าเสมอ นางช่างตัวใหญ่และแข็งแรง ข้าจะทำกระไรได้เล่า?"
 child_personality.0001.a:0 "อย่างน้อยข้าก็เก่งกาจเรื่องการซ่อนตัวขึ้นมาก มากทีเดียว"
 child_personality.0001.b:0 "อย่างไรเสียข้าก็อยากอยู่ในห้องทั้งวันอยู่แล้ว"
 child_personality.0001.c:0 "บางทีข้าอาจจะ ทำให้ [bully.GetHerHim] ถูกแขวนคอ เพราะเรื่องนี้ได้?"

 child_personality.0002.t:0 "อาชญากร"
 child_personality.0002.guardian:0 "ขณะเดินผ่านถนนกับ [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('guardian'))] ของข้า [guardian.GetTitledFirstName] เราผ่านขื่อคา ชายผู้หนึ่งถูกจองจำอยู่ที่นั่น กำลังร้องขอน้ำ หรือสิ่งใดก็ได้ที่จะบรรเทาชะตากรรมของเขา"
 child_personality.0002.no_guardian:0 "ขณะเดินผ่านถนน เราผ่านขื่อคา ชายผู้หนึ่งถูกจองจำอยู่ที่นั่น กำลังร้องขอน้ำ หรือสิ่งใดก็ได้ที่จะบรรเทาชะตากรรมของเขา"
 child_personality.0002.a:0 "อาชญากรนั่นไม่ควรแม้ แต่จะกล้ามองข้า!"
 child_personality.0002.b:0 "ข้าจะไปตักน้ำจากบ่อมาให้เขา"
 child_personality.0002.c:0 "น้ำรึ? ข้าหวังว่าโคลนนี่คงจะใช้ได้นะ!"

 child_personality.0003.t:0 "จับได้!"
 child_personality.0003.guardian:0 "[ROOT.Char.Custom2('RelationToMe', SCOPE.sC('guardian'))] ของข้า [guardian.GetTitledFirstName] จับข้าได้ขณะขโมยของจากหีบเดินทางของ [robbed_guest.GetTitledFirstNamePossessive] ระหว่างที่ [robbed_guest.GetSheHe] มาเยือนปราสาท [guardian.GetFirstName] ขู่จะลงโทษและต้องการคำอธิบาย"
 child_personality.0003.no_guardian:0 "ข้าถูกจับได้ขณะขโมยของจากหีบเดินทางของ [robbed_guest.GetTitledFirstNamePossessive] ระหว่างที่ [robbed_guest.GetSheHe] มาเยือนปราสาท [robbed_guest.GetFirstName] ขู่จะลงโทษและต้องการคำอธิบาย"
 child_personality.0003.a:0 "ข้า... ถูกเด็กคนอื่นท้าให้เล่นเกมน่ะ"
 child_personality.0003.b:0 "ข้าคิดว่าจะรอดไปได้ แต่ข้าจะไม่ทำอีกแล้ว"
 child_personality.0003.c:0 "ข้าไม่มีสิทธิ์ในสิ่งใดๆ มากไปกว่าผู้อื่น"

 child_personality.0004.t:0 "แรงบันดาลใจจากราชสำนัก"
 child_personality.0004.desc:1 "ข้าประทับใจในตัว $knight_culture_player_plural_no_tooltip_lowercase$ คนหนึ่งในครัวเรือนอย่างยิ่ง ในที่สุดข้าก็ได้พบหน้าเขา และข้าก็ยังคงประทับใจไม่น้อยลงเลย ข้าจะจดจำคำพูดของเขาไปตลอดชีวิต"
 child_personality.0004.desc_knight:0 "ข้าประทับใจในตัว $knight_culture_player_plural_no_tooltip_lowercase$ คนหนึ่งในครัวเรือนอย่างยิ่ง ในที่สุดข้าก็ได้พบหน้า [knight.GetHerHim] และข้าก็ยังคงประทับใจไม่น้อยลงเลย ข้าจะจดจำคำพูด [knight.GetHerHis] ไปตลอดชีวิต"
 child_personality.0004.a:0 ""จงให้สิ่งที่ผู้อื่นสมควรได้รับ แล้วเจ้าจะได้รับส่วนของเจ้าเป็นการตอบแทน""
 child_personality.0004.b:0 ""จงทำงานหนัก แล้วเจ้าจะเชี่ยวชาญในทุกสิ่งได้""
 child_personality.0004.c:0 ""ความยิ่งใหญ่ต้องใช้เวลา จงพร้อมที่จะคว้ามันไว้เมื่อเวลานั้นมาถึง""

 child_personality.0005.t:0 "เวลาเล่น"
 child_personality.0005.desc:1 "ข้ากำลังเล่นกับเด็กคนอื่นๆ อยู่เมื่อ [doing_push.GetFirstName] พยายามผลักข้าให้ล้ม!\n\n[doing_push.GetSheHe|U] ตามรังควานข้าตลอดเวลา พยายามผลักข้าทุกครั้งที่มีโอกาส... มันเริ่ม ทำให้ข้าหงุดหงิดแล้ว ข้าควรทำอะไรสักอย่างกับเรื่องนี้"
 child_personality.0005.a:0 "ข้าจะแสดงให้เจ้าเห็นว่าเกิดอะไรขึ้นกับคนที่ผลักข้า!"
 child_personality.0005.b:0 "ทำไมเจ้าถึงผลักข้า? ข้าแค่อยากเล่นกับเจ้า"
 child_personality.0005.c:0 "โอ้ เดี๋ยวก่อน ข้าเพิ่งนึกเกมอื่นออก!"

 child_personality.0006.t:0 "การปฏิเสธอันแสนเจ็บปวด"
 child_personality.0006.desc_crush:0 "โอ้ ข้าใช้เวลาทั้งวันทั้งคืนคิดถึง [crush.GetTitledFirstName] และหัวใจข้าก็เต้นระรัวทุกครั้งที่เห็น [crush.GetHerHim] ในโถงปราสาท! \n\nทว่า เมื่อข้าเข้าไปหา [crush.GetHerHim] พร้อมความรู้สึกของข้า [crush.GetSheHe] กลับปฏิเสธข้าพร้อมเสียงหัวเราะ เหยียบย่ำหัวใจข้าใต้เท้า [crush.GetHerHis] ขณะที่ [crush.GetSheHe] เดินจากไป"
 child_personality.0006.desc:0 "[child.Custom('servant_for_romance')] สามัญชนได้ขโมยหัวใจข้าไป! ทุกสายตาที่มองมาทางข้า ทำให้หัวใจข้าเต้นระรัว\n\nทว่า เมื่อเข้าไปบอกความรู้สึก [child.Custom('servant_for_romance')] กลับปฏิเสธข้าพร้อมเสียงหัวเราะ!"
 child_personality.0006.a_crush:0 "ข้าจะแสดงให้ [crush.GetHerHim] เห็นว่าการปฏิเสธข้า เช่นนั้นหมายความว่าอย่างไร!"
 child_personality.0006.a:0 "ข้าจะแสดงให้พวกเขาเห็นว่าการปฏิเสธข้า เช่นนั้นหมายความว่าอย่างไร!"
 child_personality.0006.b:0 "หากนี่คือความรัก ข้าไม่ต้องการข้องเกี่ยวกับมัน"
 child_personality.0006.c_crush:0 "[crush.GetSheHe] คิดจริงๆ หรือว่าข้ายอมแพ้ง่ายๆ เช่นนั้น?"
 child_personality.0006.c:0 "พวกเขาคิดจริงๆ หรือว่าข้ายอมแพ้ง่ายๆ เช่นนั้น?"

 child_personality.0007.t:0 "การตัดสิน"
 child_personality.0007.desc:0 "[ROOT.Char.Custom2('RelationToMe', SCOPE.sC('guardian'))] ของข้า [guardian.GetTitledFirstName] พูดกับข้าเกี่ยวกับโทษประหารชีวิตที่โจรชั้นต่ำผู้หนึ่งได้รับเมื่อสองวันก่อน\n\n[guardian.GetSheHe|U] อยากรู้ว่าข้าคิดอย่างไรกับการลงโทษที่รุนแรง เช่นนี้สำหรับอาชญากรรมเล็กน้อย เช่นนั้น"
 child_personality.0007.a:0 "มันมากเกินไป การลงโทษควรสมกับความผิด"
 child_personality.0007.b:0 "นี่ไม่ใช่กฎหมายของอาณาจักรแห่งพระเจ้า"
 child_personality.0007.c:0 "เราทุกคนควรพอใจในสิ่งที่เรามีอยู่แล้ว"

 child_personality.0008.t:0 "งานเลี้ยงสำหรับประสาทสัมผัส"
 child_personality.0008.desc:1 "การอยู่ในงานเลี้ยงคือความประทับใจที่ถาโถมเข้ามา ผู้คนกำลังพูดคุย กลิ่นอาหารนานาชนิดอบอวลในหัวข้า แขกสวมเสื้อผ้าสวยงาม คนรับใช้ถือจานไม่รู้จบ และ—\n"
 child_personality.0008.serving_wench:0 "\nการขยิบตาของสาวใช้ผู้นั้นเมื่อครู่หมายความว่ากระไร?"
 child_personality.0008.servant_boy:0 "\nการขยิบตาของเด็กรับใช้ชายผู้นั้นเมื่อครู่หมายความว่ากระไร?"
 child_personality.0008.desc_not_server:1 "\nข้าไม่อาจหยุดทึ่งกับความน่าประทับใจของทุกสิ่งได้! ช่างเป็นการแสดงอำนาจที่ยอดเยี่ยมอะไร เช่นนี้"
 child_personality.0008.a:0 "ทุกอย่างช่างแวววาวเหลือเกิน!"
 child_personality.0008.b:0 "การพูดคุยกับผู้ใหญ่ช่างสนุกสนาน!"
 child_personality.0008.c:0 "ข้าหยุดหมกมุ่นกับแววตาของคนรับใช้ผู้นั้นไม่ได้เลย!"

 child_personality.0009.t:0 "นักเทศน์รุ่นเยาว์"
 child_personality.0009.desc:1 "ข้าเฝ้ามอง [ROOT.Char.Custom2('RelationDescriptor', SCOPE.sC('child_preacher'))] [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('child_preacher'))] ของข้า [child_preacher.GetTitledFirstName] พูดคุยกับเด็กคนอื่นๆ เกี่ยวกับ [child_preacher.GetFaith.random_GoodGodNames] พวกเขาหัวเราะเยาะและมอง [child_preacher.GetHerHim] ด้วยสายตาไม่ดีอยู่ครู่หนึ่งก่อนจะเริ่มผลักไส แม้จะถูกเยาะเย้ย [child_preacher.GetSheHe] ก็พยายามสอนต่อไป จนกระทั่งถูกชกครั้งแรก"
 child_personality.0009.desc_fallback:1 "ข้าเฝ้ามองเพื่อนของข้าพูดคุยกับเด็กคนอื่นๆ เกี่ยวกับ [ROOT.Char.GetFaith.random_GoodGodNames] พวกเขาหัวเราะเยาะและมองด้วยสายตาไม่ดีอยู่ครู่หนึ่งก่อนจะเริ่มผลักไส แม้จะถูกเยาะเย้ย เพื่อนของข้าก็พยายามสอนต่อไป จนกระทั่งถูกชกครั้งแรก"
 child_personality.0009.a:0 "ข้าจะปกป้องเจ้าเอง!"
 child_personality.0009.a.tt:1 "มีโอกาสที่เจ้าจะได้รับบาดเจ็บ"
 child_personality.0009.b:0 "พวกเราหยุดเดี๋ยวนี้แล้วมาคุยกันเถอะ"
 child_personality.0009.c:0 "นี่คือวิธีที่พวกเจ้าปฏิบัติต่อผู้ที่ประกาศพระวจนะของพระเจ้ารึ!?"
 child_personality.0009.d:0 "นี่น่าจะสนุกนะ!"

 child_personality.0010.t:0 "ชีวิตในมือข้า"
 child_personality.0010.desc:0 "[ROOT.Char.Custom2('RelationToMe', SCOPE.sC('guardian'))] ของข้า [guardian.GetTitledFirstName] พาข้าไปที่ป่าเพื่อเล่นธนู เมื่อวิ่งออกไปตามลำพัง ไม่นานข้าก็พบกวางตัวเมียที่บาดเจ็บ กำลังพยายามเดินกะเผลกหนีข้า"
 child_personality.0010.a:0 "นี่จะเป็นสัตว์ใหญ่ที่สุดที่ข้าเคยล่าได้!"
 child_personality.0010.b:0 "มันช่างเชื่องช้า ข้าอาจแทงมันแล้วเฝ้าดูมันเลือดออกจนตาย"
 child_personality.0010.c:0 "นี่คือบททดสอบที่ [guardian.GetFirstNameNoTooltip] วางไว้ ใช่หรือไม่?"

 child_personality.0011.t:0 "สิ่งปรารถนาของข้า"
 child_personality.0011.desc:0 "ข้าอยากได้ [ROOT.GetCharacter.Custom('child_object_of_interest_indefinite')] มานานแล้ว และ [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('guardian'))] ของข้า [guardian.GetTitledFirstName] ก็สัญญาว่าจะหามาให้ข้าในสามเดือนหากข้าเริ่มตั้งใจเรียนมากขึ้น"
 child_personality.0011.a:0 "ข้าค่อนข้างชอบการเรียนแบบที่ข้าทำอยู่แล้ว"
 child_personality.0011.b:0 "โอ้ ข้าไม่ค่อยอยากได้แล้วล่ะ"
 child_personality.0011.c:0 "ข้าจะตั้งใจเรียน!"

 child_personality.0012.t:0 "งานเลี้ยงอันวุ่นวาย"
 child_personality.0012.desc:0 "งานเลี้ยงนี้เสียงดัง ผู้ใหญ่น่าเบื่อ และอาหารก็ไม่ค่อยอร่อย\n\n[ROOT.Char.Custom2('RelationToMe', SCOPE.sC('guardian'))] ของข้า [guardian.GetFirstName] ดูเหมือนจะกำลังเพลิดเพลิน [guardian.GetHerselfHimself] อยู่ ดังนั้นข้าจึงไม่สามารถเรียกความสนใจ [guardian.GetHerHis] เพื่อบอก [guardian.GetHerHim] ว่าข้าไม่อยากอยู่ที่นี่"
 child_personality.0012.a:0 "ข้ากำลังแอบหนีออกไป บางทีอาจมีเด็กคนอื่นๆ อยู่แถวนี้"
 child_personality.0012.b:0 "ข้ารับมือกับคนเยอะขนาดนี้ไม่ไหว! ได้เวลาซ่อนใต้โต๊ะแล้ว"
 child_personality.0012.c:0 "อย่างน้อยข้าก็กินต่อไปได้ตราบเท่าที่ข้ายังอยู่ที่นี่!"

 child_personality.0021.t:0 "บุคลิกภาพที่ก่อตัว"
 child_personality.0021.desc:0 "หนึ่งในไม่กี่สิ่งที่ปลอบประโลมใจข้าในการถูกจองจำคือการเฝ้ามองผู้คน แม้จะเป็นจากหลังลูกกรงก็ตาม"
 child_personality.0021.serving_wench:0 "– ทุกเช้าข้าหวังว่าจะได้เห็นสาวใช้แสนสวยคนนั้นเพียงสักแวบเดียว"
 child_personality.0021.servant_boy:0 "– ทุกเช้าข้าหวังว่าจะได้เห็นเด็กรับใช้ชายรูปงามคนนั้นเพียงสักแวบเดียว"
 child_personality.0021.desc_no_gender:0 "– ทุกเช้าข้าหวังว่าจะได้เห็นคนรับใช้หน้าตาดีคนใดคนหนึ่งเพียงสักแวบเดียว"
 child_personality.0021.a:0 "แล้วจินตนาการของข้าก็จะจัดการที่เหลือเอง..."

 child_personality.0022.desc:0 "ข้าคุ้นเคยกับการอยู่คนเดียว ไม่มีใครให้คุยด้วย ไม่มีใครให้เล่นด้วย ไม่มีใครให้เรียนรู้ด้วย แค่คิดว่าจะมีคนอื่นมาสัมผัสตัวข้าตอนนี้..."
 child_personality.0022.a:0 "มัน ทำให้ข้าขนลุกซู่!"

 child_personality.0023.desc:0 "ข้าไม่เคยรู้ว่าจะได้กินมื้อต่อไปเมื่อใด ดังนั้นเมื่อมีจานอาหารมาให้ ข้าจึงกินทุกอย่างบนจานนั้นโดยไม่ลังเล ไม่ว่าจะมากเท่าใดก็ตาม\n\nเมื่ออิ่มแล้วเท่านั้นข้าจึงรู้สึกสบายใจขึ้นบ้าง"
 child_personality.0023.a:0 "มันเป็นหนึ่งในไม่กี่ความสุขที่ข้ามี!"

 child_personality.0024.desc:0 "ข้าไม่เคยรู้ว่าจะได้กินมื้อต่อไปเมื่อใด ดังนั้นเมื่อมีจานอาหารมาให้ ข้าจึงบังคับตัวเองให้แบ่งปันอาหารและพอใจกับสิ่งที่ได้รับ\n\nในตอนแรกมันยาก แต่ตอนนี้มันกลายเป็นธรรมชาติที่สองไปแล้ว"
 child_personality.0024.a:0 "ความพอประมาณคือกุญแจสำคัญ"

 child_personality.0025.desc:0 "ช้อนที่ถูกทิ้ง ก้อนกรวดแวววาว จานแตก... ครั้งหนึ่งข้าคงเคยเยาะเย้ยของเล็กๆ น้อยๆ เช่นนี้ แต่ข้าได้ตระหนักแล้วว่าไม่มีสิ่งใดไร้ค่าอย่างแท้จริง!"
 child_personality.0025.a:0 "ข้ารวบรวมสมบัติทุกชิ้นที่หาเจอ"

 child_personality.0026.desc:0 "เมื่อคนเราไม่มีอะไรเลย การกระทำด้วยความเมตตาหมายถึงทุกสิ่ง – ข้าได้เรียนรู้สิ่งนี้มาอย่างยากลำบาก มันน่าทึ่งที่คิดถึงผลกระทบที่ข้าสามารถมีต่อผู้คนได้ด้วยการกระทำที่เอื้อเฟื้อเผื่อแผ่อย่างเรียบง่าย!"
 child_personality.0026.a:0 "สิ่งที่เป็นของข้าคือ... ของทุกคน!"

 child_personality.0027.desc:0 "วันเวลาของข้าผ่านไปอย่างเกียจคร้านในความมัวเมา ติดอยู่หลังลูกกรงเหล่านี้ ข้าตื่น ข้าเดินไปมา ข้า – หวังว่า – ได้กิน...\n\nมันไม่ต่างกันเลยไม่ว่าข้าจะพยายามหากิจกรรมทำใน แต่ละวันหรือไม่ มันไม่ต่างกันเลยไม่ว่าข้าจะพยายามหรือไม่ก็ตาม"
 child_personality.0027.a:0 "ข้าจะกลับไปนอนต่อ"

 child_personality.0028.desc:0 "วันเวลาของข้าผ่านไปอย่างเกียจคร้านในความมัวเมา ติดอยู่หลังลูกกรงเหล่านี้ ข้าตื่น ข้าเดินไปมา ข้า – หวังว่า – ได้กิน...\n\nเพื่อเติมเต็มวันเวลาของข้าด้วยบางสิ่ง ข้าได้เรียนรู้ที่จะมอบหมายงานให้ตัวเอง และ ทำให้สำเร็จลุล่วงไปด้วยดี"
 child_personality.0028.a:0 "ความขยันหมั่นเพียรคือกุญแจสำคัญ!"

 child_personality.0029.desc:0 "เหล่าทหารยามน่าสมเพชที่ติดตามข้าทุกฝีก้าว, [imprisoner.GetTitledFirstName] ผู้เป็น[imprisoner.Custom2('InsultAdjective', ROOT.Char)] [imprisoner.Custom2('InsultNoun', ROOT.Char)] ที่คุมขังข้าไว้, เหล่าหนูที่วิ่งพล่านในมุมมืด... มีความโกรธเกรี้ยวเติบโตอยู่ภายในตัวข้า และมันแข็งแกร่งขึ้นทุกวันที่ผ่านไป!"
 child_personality.0029.a:0 "ข้า... แค่... อ๊ากกก!"

 child_personality.0030.desc:0 "มีเพียงน้อยนิดที่ข้าสามารถทำเพื่อส่งผลต่อสถานการณ์ของข้าได้ ทั้งในชีวิตประจำวันและในภาพรวม มีเพียงน้อยนิดที่ต้องทำ และน้อยนิดที่จะพูด"
 child_personality.0030.a:0 "ข้าได้เรียนรู้ที่จะยอมรับมัน"

 child_personality.0031.desc:0 "มีเพียงน้อยนิดที่ข้าสามารถทำเพื่อส่งผลต่อสถานการณ์ของข้าได้ ทั้งในชีวิตประจำวันและในภาพรวม ข้าเพียงแค่ต้องรอและดูว่าจะเกิดอะไรขึ้น"
 child_personality.0031.a:0 "ความอดทนคือกุญแจสำคัญ"

 child_personality.0032.desc:0 "หากการติดอยู่หลังลูกกรงได้สอนอะไรข้า มันคือสิ่งต่างๆ รอไม่ได้ เจ้าไม่เคยรู้ว่าจะเกิดอะไรขึ้นในหนึ่งวัน ในหนึ่งชั่วโมง ในหนึ่งนาที! ข้าจะมีชีวิตอยู่หรือไม่?"
 child_personality.0032.a:0 "ข้าไม่อาจเสียเวลาที่มีอยู่ได้!"

 child_personality.0033.desc:0 "เมื่อพวกเขาโยนข้าเข้ามาที่นี่ ข้าสงสัย ทำไมพวกเขาถึงขังข้าไว้หลังลูกกรง?\n\nเมื่อวันเวลาผ่านไป ข้าได้ตระหนักว่านั่นเป็น เพราะพวกเขากลัวข้า พวกเขากลัวสิ่งที่ข้าจะเป็น ดังนั้นพวกเขาจึงขังข้าไว้"
 child_personality.0033.a:0 "ข้าเก่งกาจถึงเพียงนั้น!"

 child_personality.0034.desc:0 "เมื่อพวกเขาโยนข้าเข้ามาที่นี่ ข้าสงสัย ทำไมพวกเขาถึงขังข้าไว้หลังลูกกรง?\n\nเมื่อวันเวลาผ่านไป ข้าได้ตระหนักว่าข้าคงทำบางอย่างที่สมควรได้รับมัน และข้าควรจะขอบคุณสำหรับทุกสิ่งที่ชีวิตตัดสินใจมอบให้ข้าแม้จะเป็น เช่นนั้น"
 child_personality.0034.a:0 "ข้าไม่ได้ขออะไรมาก"

 child_personality.0035.desc:0 "หากการติดอยู่หลังลูกกรงได้สอนอะไรข้า มันคือไม่มีอะไรในชีวิตนี้ได้มาฟรี เพื่อให้ได้สิ่งที่เจ้าต้องการ เจ้าต้องโกงและเจ้าต้องโกหก ข้าโชคดีที่ทหารยามของข้าหลอกง่ายเหลือเกิน!"
 child_personality.0035.a:0 "มี แต่คนโง่เท่านั้นที่พูดความจริง"

 child_personality.0036.desc:0 "หากการติดอยู่หลังลูกกรงได้สอนอะไรข้า มันคือผู้คนไม่ลังเลที่จะลงโทษ และสิ่งที่ดีที่สุดที่ข้าสามารถทำได้คือไม่ให้เหตุผลใดๆ แก่พวกเขา นอกจากนี้ มีคน #EMP คอยจับตาดูอยู่เสมอ#!"
 child_personality.0036.a:0 "การโกหกนำมา ซึ่งปัญหาอยู่แล้ว"

 child_personality.0037.desc:0 "ทหารยามนอกคุกของข้าแข็งแรงพอๆ กับที่ขมขื่น และพวกเขาเฝ้าดูทุกการเคลื่อนไหวของข้า\n\nแต่เมื่อข้าพยายามซ่อน มันเป็นเพียงเรื่องของเวลาก่อนที่หนู หรือสิ่งที่เลวร้ายกว่านั้น จะย่องเข้ามาหาข้า!"
 child_personality.0037.a:0 "ทุกวันนำมา ซึ่งความกลัวใหม่..."

 child_personality.0038.desc:0 "ทหารยามนอกคุกของข้าแข็งแรงพอๆ กับที่ขมขื่น และพวกเขาเฝ้าดูทุกการเคลื่อนไหวของข้า มีหนูอยู่ในความมืด และทุกวันนำมา ซึ่งความสยดสยองใหม่\n\n[imprisoner.GetTitledFirstName] จะต้องยกระดับ [imprisoner.GetHerHis] เกมหาก [imprisoner.GetSheHe] ต้องการ ทำให้ข้ากลัวตอนนี้!"
 child_personality.0038.a:0 "ข้าไม่กลัวสิ่งใด"

 child_personality.0039.desc:0 "เป็นเวลานานแล้วที่ข้าไม่ได้เห็นคนอื่น และข้าไม่รู้ว่าข้าเสียใจหรือโล่งใจ\n\nในแง่หนึ่ง ข้าโหยหาการติดต่อทางสังคม #EMP ใดๆ#! หลังจากอยู่หลังลูกกรงมานาน แต่อีกแง่หนึ่ง ข้าไม่รู้ว่าจะพูดอะไรอีกต่อไป..."
 child_personality.0039.a:0 "ผู้คนน่ากลัว!"

 child_personality.0040.desc:0 "การใช้เวลาทั้งวันทุกวันหลังลูกกรงมัน #EMP น่าเบื่อ#! เหลือเกิน! หนึ่งในไม่กี่สิ่งที่ ทำให้ข้ามีความสุขคือบทสนทนาที่ข้าสามารถเริ่มกับทหารยามได้ พวกเขาอาจเป็นคนป่าเถื่อน แต่บางคนก็น่าสนใจอย่างน่าประหลาดใจ!"
 child_personality.0040.a:0 "ได้โปรด เล่าให้ข้าฟังอีก!"

 child_personality.0041.desc:0 "การคิดถึงทุกสิ่งที่ผ่านข้าไปขณะที่ข้าสูญเปล่าอยู่หลังลูกกรงเหล่านี้ ทำให้ข้านอนไม่หลับในตอนกลางคืน โอกาสเหล่านั้นทั้งหมด หายไป...\n\nเมื่อข้าออกจากคุกเน่าๆ แห่งนี้ได้ในที่สุด ข้าจะชดเชยเวลาทั้งหมดที่ข้าเสียไป!"
 child_personality.0041.a:0 "ไม่มีอะไรจะหยุดข้าได้!"

 child_personality.0042.desc:0 "การติดอยู่ในคุกนี้สอนข้าว่าข้าไม่ต้องการอะไรมากนักในการดำรงชีวิต ความหรูหราและความมั่งคั่งไม่มีคุณค่าในตัวเอง\n\nเมื่อข้าออกจากที่นี่ได้ในที่สุด ข้าจะทะนุถนอมทุกสิ่งที่ข้ามี!"
 child_personality.0042.a:0 "ไม่ว่าจะมีค่าเพียงใด"

 child_personality.0043.desc:0 "หลังลูกกรงเหล่านี้ ข้าได้เรียนรู้บทเรียนอันมีค่า: คนเดียวที่เจ้าสามารถไว้วางใจได้อย่างแท้จริงคือตัวเจ้าเอง ความคิดเห็นของผู้อื่นมีความหมายอะไรในท้ายที่สุด? แล้วคนอื่นมีความสำคัญอะไรเลย?"
 child_personality.0043.a:0 "พวกเขาไม่มีความสำคัญ!"

 child_personality.0044.desc:0 "ความอยุติธรรมที่ข้าเห็นในคุกนี้ – ทั้งจากทหารยามและนักโทษคนอื่นๆ – เพียงพอที่จะ ทำให้ข้าฝันร้าย\n\nหากเราไม่สามารถปฏิบัติต่อกันอย่างยุติธรรม แล้วจะมีประโยชน์อะไร?!"
 child_personality.0044.a:0 "หากไร้กฎหมาย เราก็ไม่ต่างจากสัตว์เดรัจฉาน"

 child_personality.0045.desc:0 "ผู้คนเห็นแก่ตัว หากเวลาของข้าหลังลูกกรงได้สอนอะไรข้า มันคือสิ่งนี้\n\nอาหารมื้อที่ดีอย่างไม่คาดคิด? นักโทษจะทำทุกวิถีทางเพื่อขโมยจากกันและกัน ทหารยามที่เยาะเย้ยขอให้พวกเขาสละ [ROOT.Char.GetFaith.HighGodName] เพื่อแลกกับของรางวัล? ไม่ลังเลเลย"
 child_personality.0045.a:0 "ผู้คนสนใจ แต่ตัวเองเท่านั้น"

 child_personality.0046.desc:0 "สิ่งเดียวที่คงที่ตลอดเวลาของข้าหลังลูกกรงคือ [ROOT.Char.GetFaith.HighGodNameAlternate] เมื่อใดก็ตามที่ข้าท้อแท้ เมื่อใดก็ตามที่ข้าสงสัย [ROOT.Char.GetFaith.HighGodNameSheHe] อยู่เคียงข้างข้าในคำอธิษฐานของข้า\n\nเมื่อวันเวลาผ่านไป ข้ายิ่งมั่นใจมากขึ้นเรื่อยๆ ว่าไม่มีอะไรสำคัญอย่างแท้จริงนอกจากศรัทธาของข้า"
 child_personality.0046.a:0 "สรรเสริญ [ROOT.Char.GetFaith.HighGodName]!"

 child_personality.0047.desc:0 "ไม่ว่าข้าจะไปที่ใด ทหารยามก็อยู่ที่นั่น คอยเฝ้ามอง แม้เมื่อข้าเชื่อว่าอยู่ตามลำพัง พวกเขาก็แสดงความคิดเห็นในภายหลัง ซึ่ง ทำให้ข้ามั่นใจว่าพวกเขาเห็นทุกอย่าง ว่าข้ามีสายตาจับจ้องอยู่เสมอ"
 child_personality.0047.a:0 "มีคนคอยจับตาดูอยู่เสมอ..."

 child_personality.0048.desc:0 "[imprisoner.GetTitledFirstName] กล่าวว่าข้าจะมีเสื้อผ้าใส่และมีอาหารกิน และข้าก็ได้รับ ทหารยามสัญญาว่าข้าจะไม่ได้เห็นแสงตะวัน และข้าก็ไม่ได้เห็น\n\nสิ่งหนึ่งที่ข้ามั่นใจมากขึ้นหลังลูกกรงเหล่านี้คือผู้คนมักจะพูดความจริง"
 child_personality.0048.a:0 "ข้าเชื่อใจพวกเขา"

 child_personality.0049.desc:0 "มีความสุขเพียงน้อยนิดที่จะพบได้หลังลูกกรงเหล่านี้ และท่าทีแห่งความเมตตาที่เล็กน้อยที่สุดก็มีความหมายอย่างยิ่ง การได้เห็นความสุขในดวงตาของผู้อื่น การได้เห็นจิตวิญญาณของพวกเขาสูงขึ้น... ไม่มีอะไร ทำให้ข้าสงบได้เท่านี้"
 child_personality.0049.a:0 "ความเมตตาคือทั้งหมดที่สำคัญ"

 child_personality.0050.desc:0 "ความอยุติธรรมที่ข้าเห็นในคุกนี้ – ทั้งจากทหารยามและนักโทษคนอื่นๆ – เพียงพอที่จะ ทำให้ข้าฝันร้าย หรือ... เคยเป็น ตอนนี้ไม่มีอะไร ทำให้ข้าประหลาดใจได้อีกต่อไป"
 child_personality.0050.a:0 "ทุกคนสามารถโหดร้ายได้"

 child_personality.0051.desc:0 "ความสุขหาได้ยากหลังลูกกรงเหล่านี้ ทหารยามไม่เป็นมิตรพอๆ กับที่แข็งแรง [imprisoner.GetTitledFirstName] ไม่ห้วนก็เป็นศัตรู และเพื่อนนักโทษของข้าก็เจ็บปวดเกินกว่าจะให้ความบันเทิงแก่ข้า หรือ... ข้าเคยคิด เช่นนั้น เมื่อใดก็ตามที่คนใดคนหนึ่งเจ็บปวด ข้ารู้สึกถึงเศษเสี้ยวของความสุขที่ก่อตัวขึ้นในจิตวิญญาณของข้า"
 child_personality.0051.a:0 "ความรู้สึกนี้... ข้าต้องการอีก!"

 child_personality.0052.desc:0 "คนอื่นตัดสินใจว่าข้าจะกินอะไร นอนเมื่อใดและที่ไหน ไปที่ไหน... สิ่งเดียวที่ข้ามีหลังลูกกรงเหล่านี้คือความเชื่อมั่นของข้า และข้าจะไม่ประนีประนอม"
 child_personality.0052.a:0 "ข้าคือสิ่งเดียวที่คงที่ในสถานที่แห่งนี้"

 child_personality.0053.desc:0 "เป็นเวลานานมากแล้วที่ข้าเป็นอิสระจนข้าจำไม่ได้ว่าการกุมชีวิตไว้ในมือตัวเองเป็นอย่างไร การตัดสินใจด้วยตัวเอง ตอนนี้แม้ แต่คำถามที่ตรงไปตรงมาที่สุดก็ ทำให้ข้าสับสนได้\n\nแม้ว่าบางครั้งข้าจะมีปัญหาในการรู้ความชอบของตัวเอง แต่มันก็เปิดประตูมากมาย เช่นกัน!"
 child_personality.0053.a:0 "ใครจะรู้ว่าข้าต้องการทำอะไร?"

 child_personality.0054.desc:0 "หากมีคนดูถูกเจ้า และเจ้ายินดีให้อภัยและลืม พวกเขาจะดูถูกเจ้าอีกแน่นอน ทหารยาม และนักโทษคนอื่นๆ ได้สอนข้า เช่นนั้น\n\nโชคดีที่มีเพียงน้อยนิดที่ต้องทำในคุกนี้ นอกจากการจดจำ"
 child_personality.0054.a:0 "[imprisoner.GetTitledFirstNameNoTooltip] ข้าจะแก้แค้นให้ได้"

 child_personality.0055.desc:0 "เมื่อเจ้าติดอยู่กับคนเดิมๆ วันแล้ววันเล่า เจ้าจะตระหนักว่าไม่มีอะไรขาวหรือดำ ผู้คนมักมีเหตุผลในการกระทำของตน และส่วนใหญ่ทุกคนพยายามอย่างดีที่สุด\n\nข้าคงมี แต่ศัตรูรอบตัวในคุกนี้หากข้าไม่ให้อภัย"
 child_personality.0055.a:0 "การเก็บความแค้นไว้มี แต่จะนำมา ซึ่งความเจ็บปวด"

 child_personality.0061.t:0 "อิทธิพลของผู้ดูแล"
 child_personality.0061.desc_opening:0 "ข้าไม่ชอบความเหงา แต่ข้าก็พยายามดิ้นรนที่จะเพลิดเพลินกับการอยู่ร่วมกับผู้อื่น มีความรู้สึกกังวลอยู่เสมอว่าข้ากำลังทำตัวเป็นตัวตลกในระหว่างการปฏิสัมพันธ์ทางสังคม"
 child_personality.0061.desc_shy:0 "ดังนั้นข้าจึงรู้สึกผูกพันอย่างแรงกล้ากับ [guardian.GetTitledFirstNameNoTooltip] [ROOT.GetCharacter.Custom2('RelationToMe' , guardian)] ของข้า ผู้ ซึ่งดูเหมือนจะถูกรบกวนด้วยความคิดคล้ายๆ กัน"
 child_personality.0061.desc_gregarious:0 "[guardian.GetTitledFirstNameNoTooltip] [ROOT.GetCharacter.Custom2('RelationToMe' , guardian)] ของข้า ตรงกันข้ามกับข้าโดยสิ้นเชิงในเรื่องนั้น"
 child_personality.0061.desc_fallback:0 "ข้าไม่รู้ว่าข้าอยู่คนเดียวกับความคิดเหล่านี้หรือไม่..."
 child_personality.0061.desc_ending:0 "ข้าเหลือบเห็น [guardian.GetTitledFirstNameNoTooltip] ในระหว่างงานสังคม ซึ่งผู้เข้าร่วมทุกคนมีเครื่องดื่มในมือ และรอยยิ้มกว้าง บางทีอาจมีความจริงบางอย่างในคำกล่าวที่ว่าสุราช่วยให้ผ่อนคลาย"
 child_personality.0061.a:0 "มันอาจเป็นยารักษาความขี้อายของข้าได้หรือไม่?"
 child_personality.0061.a.tt:0 "#EMP มีโอกาสที่คุณจะพัฒนาทักษะการทูตและมีแนวโน้มที่จะดื่มมากขึ้น#! "
 child_personality.0061.b:0 "ไม่ ความขี้อายของข้าคือบททดสอบจาก [ROOT.Char.GetFaith.HighGodName]! นี่ต้องเป็น [ROOT.Char.GetFaith.DevilName] ที่กำลังล่อลวงข้า!"

 my_ward_or_child:0 "[ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('child'))] ของข้า "
 child_personality.101.desc:0 "[child.GetTitledFirstName] มาหาข้าเพื่อบ่นเรื่อง [bully.GetTitledFirstName] รังแก [child.GetHerHim]"
 child_personality.101.desc_no_bully:0 "[child.GetTitledFirstName] มาหาข้าเพื่อบ่นเรื่อง [child.Custom('GetDaughterSon')] ของ [child.Custom('lowly_servant_type')] รังแก [child.GetHerHim]"
 child_personality.101.craven:1 "\n\n[child.GetSheHe|U] หลบซ่อนไปทั่วปราสาทเพื่อหลีกเลี่ยงการเผชิญหน้ากับเด็กอีกคน"
 child_personality.101.lazy:1 "\n\n[child.GetSheHe|U] อยู่ แต่บนเตียงมาหลายวันเพื่อหลีกเลี่ยงการเผชิญหน้ากับเด็กอีกคน"
 child_personality.101.arbitrary:0 "\n\n[child.GetSheHe|U] เริ่มถามว่าจะให้คนถูกแขวนคอได้อย่างไร หาก [child.GetSheHe] รู้สึกว่าควรจะเป็น เช่นนั้น"
 child_personality.1011.t:1 "[child.GetFirstNameNoTooltip] หลบซ่อนตัว"
 child_personality.1012.t:0 "ขังตัวเองอยู่ในห้อง [child.GetHerHis]"
 child_personality.1013.t:0 "คำถามเรื่องการลงโทษ"
 child_personality.101.confirm_craven:0 "ดีแล้ว อย่าหาเรื่องเดือดร้อนโดยไม่จำเป็น"
 child_personality.101.confirm_lazy:0 "เจ้าไม่จำเป็นต้องเผชิญโลกหากเจ้าไม่ต้องการ"
 child_personality.1013.confirm_arbitrary:0 "เจตจำนงของเจ้าคือกฎหมายเดียวที่สำคัญอย่างแท้จริง"
 child_personality.101.lazy_change:0 "ทำไมไม่ซ่อนตัวอยู่ในห้องของเจ้าแทนล่ะ?"
 child_personality.101.arbitrary_change:0 "คนพาลสมควรได้รับการลงโทษใดๆ ก็ตามที่เจ้าจินตนาการได้"
 child_personality.101.craven_change:0 "จงแน่ใจว่าเจ้าซ่อนตัวอยู่เสมอไม่ว่าจะไปที่ใด!"
 child_personality.1021.t:0 "ชาวนาผู้ไม่คู่ควร"
 child_personality.1022.t:0 "บรรเทาความเจ็บปวด"
 child_personality.1023.t:0 "โรยเกลือบนแผล"
 child_personality.102.desc_court_location:2 "ขณะที่ข้าอยู่ใน [court_location.Custom('BaronyTownType')] กับ [child.GetTitledFirstName] ความสนใจ [child.GetHerHis] ถูกดึงดูดโดยอาชญากรที่ถูกล่ามโซ่ไว้ในขื่อคา"
 child_personality.102.desc:1 "ขณะที่ข้าอยู่ที่ตลาดกับ [child.GetTitledFirstName] ความสนใจ [child.GetHerHis] ถูกดึงดูดโดยอาชญากรที่ถูกล่ามโซ่ไว้ในขื่อคา"
 child_personality.102.arrogant:1 "\n\n[child.GetFirstNameNoTooltip] เชิดหน้า [child.GetHerHis] ขึ้นและทำทีเป็นเมินเฉยต่อคำร้องขอน้ำของอาชญากร"
 child_personality.102.compassionate:1 "\n\nเมื่อชายผู้นั้นร้องขอน้ำ [child.GetFirstNameNoTooltip] ก็รับปากทันทีว่าจะนำมาให้ และในไม่ช้าก็กลับมาจากบ่อน้ำใกล้ๆ ให้อาชญากรดื่มจากมือ [child.GetHerHis] ที่ประคองไว้"
 child_personality.102.callous:1 "\n\n[child.GetFirstNameNoTooltip] มองเขาอยู่ครู่หนึ่ง เมื่อเขาไม่ทำอะไรนอกจากไอและร้องขอน้ำ [child.GetFirstNameNoTooltip] ก็กลอกตา [child.GetHerHis] และเดินต่อไป"
 child_personality.102.confirm_arrogant:0 "ดีแล้ว ให้มันรู้ที่ต่ำที่สูงเสียบ้าง"
 child_personality.102.confirm_compassionate:0 "หากไร้ความเมตตา โลกก็จะพังทลาย"
 child_personality.102.confirm_callous:0 "อาชญากรไม่สมควรได้รับสิ่งใดนอกจากความดูถูกจากเจ้า"
 child_personality.102.arrogant_change:0 "อาชญากรผู้นี้ไม่คู่ควรแม้ แต่ความสนใจของเจ้า"
 child_personality.102.compassionate_change:0 "ไม่ได้นะลูก จงนำน้ำไปให้ชายผู้น่าสงสารตามที่เขาร้องขอ"
 child_personality.102.callous_change:0 "ถ่มน้ำลายใส่เขา ทุบตีเขา เขาไม่สมควรได้รับสิ่งใดน้อยไปกว่านี้"

 child_personality.103.desc:1 "ข้าตกใจเมื่อจับได้ว่า [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('child'))] ของข้า [child.GetTitledFirstName] พยายามขโมยของจากหีบเดินทางของ [robbed_guest.GetTitledFirstName] ที่มาเยือน"
 child_personality.103.deceitful:0 "\n[child.GetSheHe|U] โทษว่าเป็นเกมที่เด็กอีกคนคิดขึ้น แต่ข้ารู้ว่า [child.GetSheHe] กำลังโกหก"
 child_personality.103.honest:0 "\n[child.GetSheHe|U] สารภาพว่า [child.GetSheHe] คิดว่า [child.GetSheHe] จะรอดไปได้ แต่ตอนนี้รู้แล้วว่ามันผิด"
 child_personality.103.humble:0 "\n[child.GetSheHe|U] กล่าวสุนทรพจน์ที่น่าประทับใจให้ข้าฟังว่าตอนนี้ [child.GetSheHe] เข้าใจแล้วว่าทำไมสิ่งที่ [child.GetSheHe] ทำจึงผิด"
 child_personality.1031.t:0 "ผลตอบแทนของคนโกหก"
 child_personality.1032.t:0 "ผู้รับใช้ความซื่อสัตย์"
 child_personality.1033.t:0 "ผู้ถ่อมตนย่อมเป็นสุข"
 child_personality.103.confirm_deceitful:0 "เจ้าต้องเรียนรู้ที่จะหลุดรอดจากการโกหกของเจ้า"
 child_personality.103.confirm_honest:0 "ความซื่อสัตย์จะรับใช้เจ้าได้ดีที่สุดในระยะยาวนะลูก"
 child_personality.103.confirm_humble:0 "เราทุกคนเป็นเพียงส่วนเล็กๆ ของโลก"
 child_personality.103.deceitful_change:0 "ไม่ได้ เราต้องปกปิดความผิดของเจ้า!"
 child_personality.103.honest_change:0 "จงซื่อสัตย์ แล้วเจ้าจะเห็นผู้อื่นเปิดใจให้เจ้า"
 child_personality.103.humble_change:0 "เราทุกคนถูกชี้นำโดยกฎเกณฑ์ที่ยิ่งใหญ่กว่าตัวเรานะลูก"
 
 child_personality.1041.t:0 "ของขวัญแห่งความเอื้อเฟื้อ"
 child_personality.1042.t:0 "ความตรากตรำและการทำงานหนัก"
 child_personality.1043.t:0 "ทุกสิ่งต้องใช้เวลา"
 child_personality.104.desc:2 "[child.Custom2('MyCharacterIntroduction', ROOT.Char)|U] ประทับใจในตัว $knight_culture_player_plural_no_tooltip$ คนหนึ่งในครัวเรือนมานานมากแล้ว หลังจากได้พบหน้ากันในที่สุด [child.GetSheHe] ก็เอา แต่พูดทวนคำพูดของนักรบผู้นั้นกับ [child.GetHerselfHimself]"
 child_personality.104.generous:0 "\n\n"จงให้สิ่งที่ผู้อื่นสมควรได้รับ แล้วเจ้าจะได้รับส่วนของเจ้าเป็นการตอบแทน""
 child_personality.104.diligent:0 "\n\n"จงทำงานหนัก แล้วเจ้าจะเชี่ยวชาญในทุกสิ่งได้""
 child_personality.104.patient:0 "\n\n"ความยิ่งใหญ่ต้องใช้เวลา จงพร้อมที่จะคว้ามันไว้เมื่อเวลานั้นมาถึง""
 child_personality.104.confirm_generous:0 "เมื่อผู้อื่นเติบโตรอบตัว [child.GetHerHim] [child.GetSheHe] ก็จะเติบโต เช่นกัน"
 child_personality.104.confirm_diligent:0 "แน่นอน การทำงานหนักจะนำพา [child.GetHerHim] ไปยังที่ที่ [child.GetSheHe] ต้องการ"
 child_personality.104.confirm_patient:0 "ใช่ โอกาสย่อมมาถึงเสมอเมื่อถึงเวลา"
 child_personality.104.generous_change:0 "[child.GetSheHe|U] ต้องไม่ลืมบทบาทของผู้อื่นในความยิ่งใหญ่ [child.GetHerHis]"
 child_personality.104.diligent_change:0 "[child.GetSheHe|U] ต้องได้รับการสอนว่าการทำงานหนักย่อมให้ผลลัพธ์เสมอ"
 child_personality.104.patient_change:0 "ทุกสิ่งต้องให้เวลา [child.GetFirstNameNoTooltip] ที่รัก"

