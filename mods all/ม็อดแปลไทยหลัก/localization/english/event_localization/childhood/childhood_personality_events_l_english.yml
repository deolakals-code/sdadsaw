 child_personality.1072.t:0 "ในนามแห่งพระเจ้า"
 child_personality.1073.t:0 "แรงบันดาลใจสู่ความพอประมาณ"
 child_personality.107.desc:0 "หลังจากการตัดสินประหารชีวิตโจรชั้นต่ำผู้หนึ่ง ข้าถาม [child.Custom2('MyCharacterIntroduction', ROOT.Char)] ว่า [child.GetSheHe] คิดอย่างไร"
 child_personality.107.just:0 "\n\n[child.GetSheHe|U] ตอบว่าโทษนั้นรุนแรงเกินไปสำหรับอาชญากรรมเล็กน้อย เช่นนั้น"
 child_personality.107.cynical:0 "\n\n[child.GetSheHe|U] แสดงความสงสัยว่าจะมีพระเจ้าองค์ใดต้องการให้อาณาจักรถูกปกครองด้วยกฎหมายที่รุนแรง เช่นนั้นหรือไม่"
 child_personality.107.temperate:0 "\n\n[child.GetSheHe|U] อ้างว่า [child.GetSheHe] ได้เรียนรู้บทเรียนเกี่ยวกับการไม่เอื้อมคว้าเกินกว่าที่ตนจะรับมือได้"
 child_personality.107.confirm_just:0 "การลงโทษนั้นไม่สมกับความผิดจริงๆ"
 child_personality.107.confirm_cynical:0 "อย่าคาดหวังว่าจะได้เห็นความยุติธรรมของ [child.GetFaith.HighGodNamePossessive]"
 child_personality.107.confirm_temperate:0 "การเอื้อมคว้าเกินตัวอาจเป็นอันตรายอย่างยิ่ง"
 child_personality.107.just_change:0 "[child.GetSheHe|U] ต้องได้รับการสอนถึงการบังคับใช้กฎหมายที่เหมาะสม"
 child_personality.107.cynical_change:0 "ถึงเวลาแสดงให้ [child.GetHerHim] เห็นว่า [ROOT.Char.GetFaith.HighGodName] สนใจน้อยเพียงใด"
 child_personality.107.temperate_change:0 "นี่คือบทเรียนของความพอประมาณในทุกสิ่ง"
 child_personality.1081.t:0 "สายตาแหลมคม"
 child_personality.1082.t:0 "การสร้างความคุ้นเคย"
 child_personality.1083.t:0 "การแลกเปลี่ยนที่ไม่เหมาะสม"
 child_personality.108.desc:0 "[child.GetTitledFirstName] ดูเหมือนจะเพลิดเพลินกับงานเลี้ยงล่าสุดของเราอย่างมาก!"
 child_personality.108.greedy:0 "\nเหนือสิ่งอื่นใด [child.GetSheHe] ไม่สามารถหยุดพูดถึงเสื้อผ้าหรูหราและทองคำแวววาวที่ [child.GetSheHe] เห็นที่นั่นได้"
 child_personality.108.gregarious:0 "\n[child.GetSheHe|U] เข้ากันได้ดีกับทุกคนที่ [child.GetSheHe] พูดคุยด้วย แม้ แต่แขกผู้ใหญ่"
 child_personality.108.lustful:1 "\nหลังจากนั้น [child.GetSheHe] ก็ไม่สามารถหยุดพูดถึงความรู้สึกที่การสบตากับคนรับใช้ที่อายุน้อยกว่าคนหนึ่งก่อให้เกิดในตัว [child.GetHerHim] ได้"
 child_personality.108.confirm_greedy:0 "นี่คือเครื่องประดับแห่งอำนาจ ซึ่งโลกของเราถูกปกครอง"
 child_personality.108.confirm_gregarious:0 "การผูกมิตรไม่เคยเสียหาย"
 child_personality.108.confirm_lustful:0 "โอ้ เจ้าเด็กซนนี่กำลังจะโตเป็นหนุ่มเป็นสาวแล้วรึ [child.GetSheHe]?"
 child_personality.108.greedy_change:0 "จงสังเกตว่าคุณค่าที่แท้จริงอยู่ในเครื่องประดับแห่งอำนาจอันมีราคาแพง!"
 child_personality.108.gregarious_change:0 "ข้าจะแสดงให้ [child.GetHerHim] เห็นวิธีผูกมิตรในงานเลี้ยง!"
 child_personality.108.lustful_change:0 "ข้าเห็นนะว่าเจ้ามองคนรับใช้คนนั้นอย่างไร [child.GetFirstNameNoTooltip]"
 child_personality.1091.t:0 "เข้าร่วมวง"
 child_personality.1092.t:0 "ผู้ไกล่เกลี่ยรุ่นเยาว์"
 child_personality.1093.t:0 "ผู้พิทักษ์ศรัทธา"
 child_personality.109.desc:0 "วันนี้เกิดความวุ่นวายขึ้นในหมู่เด็กๆ [child_preacher.GetTitledFirstName] พยายามเทศนาในหมู่เพื่อนรุ่นเยาว์ [child_preacher.GetHerHis] และกลายเป็นเป้าหมายของการทะเลาะวิวาทเล็กๆ"
 child_personality.109.desc_fallback:0 "วันนี้เกิดความวุ่นวายขึ้นในหมู่เด็กๆ เด็กคนหนึ่งพยายามเทศนาในหมู่เพื่อนรุ่นเยาว์ และกลายเป็นเป้าหมายของการทะเลาะวิวาทเล็กๆ"
 child_personality.109.brave:0 "\n\n[child.GetTitledFirstName] เข้าแทรกแซงและทำสิ่งที่ [child.GetSheHe] ทำได้เพื่อปกป้อง [child_preacher.GetHerHim]"
 child_personality.109.brave_fallback:0 "\n\n[child.GetTitledFirstName] เข้าแทรกแซงและทำสิ่งที่ [child.GetSheHe] ทำได้เพื่อปกป้องนักเทศน์น้อยผู้นั้น"
 child_personality.109.calm:0 "\n\n[child.GetTitledFirstName] เข้าแทรกแซง และสามารถหยุดการต่อสู้ได้ก่อนที่ใครจะได้รับบาดเจ็บ"
 child_personality.109.zealous:1 "\n\n[child.GetTitledFirstName] โกรธจัดที่ใครก็ตามสามารถตั้งเป้าหมายไปที่ผู้ที่พยายามพูดในนามของ [child.GetFaith.random_GoodGodNames] และไล่เด็กคนอื่นๆ ออกไป"
 child_personality.109.confirm_brave:0 "อย่าถอยหนีจากความท้าทาย [child.GetFirstNameNoTooltip]"
 child_personality.109.confirm_calm:0 "การรักษาความสงบเมื่อเผชิญกับแรงกดดันเป็นสิ่งสำคัญอย่างยิ่ง"
 child_personality.109.confirm_zealous:0 "เจ้าจะรับใช้พระเจ้าได้ดีนะลูก!"
 child_personality.109.brave_change:0 "อย่ากลัว พุ่งเข้าไปเมื่อเจ้าต้องทำ"
 child_personality.109.calm_change:0 "ให้ข้าบอกเจ้าว่าเจ้าจะไกล่เกลี่ยเรื่องนี้ได้อย่างไร..."
 child_personality.109.zealous_change:0 "อย่าปล่อยให้ใครดูหมิ่นพระเจ้า เช่นนั้น"
 child_personality.1101.t:0 "ด้วยความมั่นใจ"
 child_personality.1102.t:0 "ด้วยความยินดี"
 child_personality.1103.t:0 "ด้วยความสงสัย"
 child_personality.110.desc:0 "ข้าพา [child.GetFirstName] ออกไปเล่นธนู และน่าประหลาดใจที่ [child.GetSheHe] วิ่งไปเจอกวางตัวเมียที่บาดเจ็บ"
 child_personality.110.ambitious:1 "\n\n[child.GetSheHe|U] ไม่ลังเลแม้ แต่น้อยที่จะล้มมันลง"
 child_personality.110.sadistic:1 "\n\nเมื่อ [child.GetSheHe] แสดงสัตว์นั้นให้ข้าดู บาดแผลของมันเป็นหลักฐานของการตายอย่างช้าๆ และทรมาน [child.GetFirstNameNoTooltip] เพียงแค่ยิ้ม"
 child_personality.110.paranoid:0 "\n\nภายหลัง [child.GetSheHe|U] ต่อว่าข้า โดยคิดว่าข้าจัดฉากเหตุการณ์ทั้งหมดขึ้นเพื่อเป็นการทดสอบบางอย่าง"
 child_personality.110.confirm_ambitious:0 "ความยิ่งใหญ่รอเจ้าอยู่ [child.GetFirstNameNoTooltip]"
 child_personality.110.confirm_sadistic:0 "มันก็แค่สัตว์ตัวหนึ่ง"
 child_personality.110.confirm_paranoid:1 "ใช่ มันเป็นการทดสอบแน่นอน ทำได้ดีมาก [child.GetFirstNameNoTooltip]"
 child_personality.110.ambitious_change:0 "ถ้า เช่นนั้นจงแสดงให้ข้าเห็นว่าเจ้าสามารถล้มสัตว์ด้วยตัวเองได้!"
 child_personality.110.sadistic_change:0 "ย่อมมีคนต้องทนทุกข์เสมอ จงแน่ใจว่าไม่ใช่เจ้า"
 child_personality.110.paranoid_change:0 "นี่คือบททดสอบ ข้าหวังว่าเจ้าจะทำได้ดีขึ้นในครั้งต่อไป"
 child_personality.1111.t:0 "ค่อนข้างพอใจ"
 child_personality.1112.t:0 "ใจที่เปลี่ยนไป"
 child_personality.1113.t:0 "เชื่อใจข้า"
 child_personality.111.desc:0 "[child.GetTitledFirstName] ขอ [child.Custom('child_object_of_interest_indefinite')] จากข้ามานานแล้ว และข้าบอก [child.GetHerHim] ว่าข้าจะหามาให้ [child.GetHerHim] ในสามเดือนหาก [child.GetSheHe] แสดงความตั้งใจในการเรียน [child.GetHerHis] มากขึ้น"
 child_personality.111.content:0 "\n\n[child.GetSheHe|U] ตอบว่า [child.GetSheHe] พอใจกับการอุทิศตนให้กับการเรียน [child.GetHerHis] ในปัจจุบันแล้ว ไม่ว่าจะมีรางวัลหรือไม่ก็ตาม"
 child_personality.111.fickle:1 "\n\n[child.GetSheHe|U] เพียงแค่ปัดข้อเสนอของข้าทิ้งไป โดยบอกว่า [child.GetSheHe] ไม่สนใจเรื่องนั้นอีกต่อไปแล้ว"
 child_personality.111.trusting:0 "\n\nนับตั้งแต่ข้าให้สัญญา [child.GetSheHe] ก็เพิ่มความพยายามในการเรียน [child.GetHerHis] เป็นสองเท่า"
 child_personality.111.confirm_content:0 "เราทุกคนเรียนรู้ที่จะอยู่กับชะตาชีวิตของเรา"
 child_personality.111.confirm_fickle:0 "ใจที่เปลี่ยนแปลงคือใจที่แข็งแรง"
 child_personality.111.confirm_trusting:0 "ข้าไม่มีวันหลอกลวงเจ้า [child.GetFirstNameNoTooltip]"
 child_personality.111.content_change:0 "[child.GetSheHe|U] ต้องมุ่งเน้นไปที่พรที่ [child.GetSheHe] มีอยู่แล้ว"
 child_personality.111.fickle_change:0 "ข้าควรสอน [child.GetHerHim] ถึงวิธีคิดที่ยืดหยุ่นมากขึ้น"
 child_personality.111.trusting_change:1 "[child.GetFirstNameNoTooltip] ต้องได้รับการสอนให้เชื่อคำพูดของข้า"
 child_personality.1121.t:0 "หลบหนีไป"
 child_personality.1122.t:0 "ความสันโดษในห้องโถงใหญ่"
 child_personality.1123.t:0 "นักชิมตัวน้อย"
 child_personality.112.desc:0 "[child.GetTitledFirstName] ดูเหมือนจะมีช่วงเวลาที่ยากลำบากในงานเลี้ยงล่าสุดของเรา"
 child_personality.112.impatient:0 "[child.GetSheHe|U] แอบหนีออกไป แต่เนิ่นๆ และไม่มีใครเห็นอีกเลยตลอดช่วงเย็นที่เหลือ"
 child_personality.112.shy:0 "[child.GetSheHe|U] หลบเข้าไปใต้โต๊ะตัวหนึ่งและซ่อนตัวจากผู้คนที่นั่นตลอดมื้ออาหาร"
 child_personality.112.gluttonous:0 "[child.GetSheHe|U] ซุกหน้า [child.GetHerHis] อยู่กับอาหาร [child.GetHerHis] และการพูดคุยเพียงอย่างเดียวที่ [child.GetSheHe] ทำคือการขออาหาร หมดจานแล้วจานเล่า"
 child_personality.112.confirm_impatient:0 "หากเจ้ามีสิ่งที่ดีกว่าต้องทำ ก็จงทำสิ่งเหล่านั้นแทน"
 child_personality.112.confirm_shy:0 "สิ่งสำคัญคือแขกทราบว่าเจ้าอยู่ที่นั่น"
 child_personality.112.confirm_gluttonous:0 "อาหารเป็นความสุขเสมอ!"
 child_personality.112.impatient_change:0 "หากมันเป็นงานที่น่าเบื่อ เจ้าก็ควรจะจากไปเสีย"
 child_personality.112.shy_change:0 "เป็นหน้าที่ที่จะต้องปรากฏตัว ไม่ว่าเจ้าจะต้องการหรือไม่ก็ตาม!"
 child_personality.112.gluttonous_change:0 "จงมุ่งความสนใจไปที่อาหารหากการสมาคมรบกวนเจ้า"

 child_personality.2001.t:0 "คลาดสายตา"
 child_personality.2001.desc:0 "ข้าชอบเล่นกับ [child.GetTitledFirstName] บอก [child.GetHerHim] เมื่อ [child.GetSheHe] ทำตัวแปลกๆ บางครั้งก็ผลัก [child.GetHerHim] เล่นนิดหน่อย"
 child_personality.2001.craven:0 "\n\nข้าสาบานเลย หากข้าไม่รู้ดีกว่านี้ ข้าคงบอกว่า [child.GetSheHe] กำลังซ่อนตัวจากข้า"
 child_personality.2001.a:0 "[child.GetSheHe] เป็นอะไร ขี้ขลาดรึ?"

 child_personality.2002.t:0 "ขังตัวเอง"
 child_personality.2002.lazy:0 "\n\nตอนนี้ [child.GetSheHe] เอา แต่ขังตัวเองอยู่ในห้อง [child.GetHerHis] ทั้งวัน ไม่ทำอะไรเลย"
 child_personality.2002.a:0 "[child.GetSheHe|U] ไม่สนุกเลย"

 child_personality.2003.t:0 "ข้อเรียกร้องไร้เหตุผล"
 child_personality.2003.arbitrary:0 "\n\nตอนนี้ [child.GetSheHe] ทนไม่ไหวแล้ว และวิ่งไปหาพวกผู้ใหญ่ บอกพวกเขาว่าข้าควรถูกแขวนคอ เพราะเรื่องนี้!"
 child_personality.2003.a:0 "นั่นมันรุนแรงไปแล้ว!"

 child_personality.2004.t:0 "จากศัตรูสู่มิตรภาพ"
 child_personality.2004.desc:0 "ข้าคิดว่า [child.GetTitledFirstName] จะสู้กับข้าหลังจากข้าเผลอผลัก [child.GetHerHim] ขณะเล่น แต่ความโกรธ [child.GetHerHis] ก็หายไปอย่างรวดเร็ว\n\nแทนที่จะเป็น เช่นนั้น เราเริ่มพูดคุยกัน แล้วก็เล่นกันต่อ มันสนุกมาก และตอนนี้เราก็เล่นด้วยกันทุกวัน!"
 child_personality.2004.a:0 "ข้าดีใจที่มีเพื่อนอย่าง [child.GetFirstNameNoTooltip] อยู่ใกล้ๆ"

 child_personality.2005.t:0 "ความพากเพียร"
 child_personality.2005.desc:0 "[child.GetTitledFirstName] ขอให้ข้าเล่นและไปเดินเล่นกับ [child.GetHerHim] หลายครั้งมาก จนในที่สุดข้าต้อง ทำให้ชัดเจนว่าข้าแค่ไม่ต้องการ\n\nแม้จะท้อแท้ในตอนแรก แต่ในไม่ช้าก็เห็นได้ชัดว่า [child.GetSheHe] จะไม่ยอมแพ้ที่จะพยายาม ทำให้ข้าชอบ [child.GetHerHim]"
 child_personality.2005.a:0 "[child.GetSheHe|U] ต้องหยุดได้แล้ว!"
 child_personality.2005.b:0 "น่ารักดีนะที่ [child.GetSheHe] ไม่ยอมแพ้"
 child_personality.2005.c:0 "[child.GetFirstNameNoTooltip]? นั่นผู้ใดรึ?"

 child_personality.2006.t:0 "ผู้ช่วยชีวิตข้า"
 child_personality.2006.opening:0 "ข้าพยายามสอนเด็กคนอื่นๆ ในสิ่งที่ข้ารู้เกี่ยวกับพระเจ้า แต่พวกเขากลับเริ่มเยาะเย้ยข้าและชูกำปั้นใส่ข้า"
 child_personality.2006.bully:0 "แม้ว่า [child.GetSheHe] จะเคยปฏิบัติต่อข้าอย่างไรในอดีต [child.GetTitledFirstName] ก็เป็นคนเดียวที่กล้าเข้ามาแทรกแซง และ ทำให้แน่ใจว่าข้าปลอดภัย"
 child_personality.2006.victim:0 "แม้ว่าข้าจะเคยปฏิบัติต่อ [child.GetHerHim] อย่างไรในอดีต [child.GetTitledFirstName] ก็เป็นคนเดียวที่กล้าเข้ามาแทรกแซง และ ทำให้แน่ใจว่าข้าปลอดภัย"
 child_personality.2006.desc:0 "คนเดียวที่กล้าเข้ามาแทรกแซงคือ [child.GetTitledFirstName] ผู้ ซึ่ง ทำให้แน่ใจว่าข้าปลอดภัย"
 child_personality.2006.a:0 "เราสนิทกันตั้งแต่นั้นมา"

 child_personality.2007.t:0 "การเผชิญหน้า"
 child_personality.2007.desc:1 "[child_preacher.GetTitledFirstName] กำลังพูดคุยกับเด็กๆ หลายคนเกี่ยวกับ [child_preacher.GetFaith.HighGodName] และเริ่ม ทำให้ข้ารำคาญ\n\nข้าแค่ผลัก [child_preacher.GetHerHim] เล่นนิดหน่อยเท่านั้น แต่ [child.GetTitledFirstName] ก็เข้ามาทุบตีข้าอย่างรุนแรงโดยไม่ทันตั้งตัว พร้อมกับบอกให้ข้าปล่อย [child_preacher.GetFirstName] ไว้ตามลำพัง"
 child_personality.2007.a:0 "ข้าก็แค่สนุกนิดหน่อยเอง เจ้าโง่!"

 #Curious 
 child_personality.3001.t:1 "อะไร? ทำไม? อย่างไร?"
 child_personality.3001.desc:0 "มีอะไรให้ดู ให้ดม ให้สัมผัสมากมาย! เจ้ามาจากไหน? ทำไมท้องฟ้าถึงเป็นสีฟ้า? มีอะไรอยู่หลังเนินเขานั่น? ได้โปรด ได้โปรด ข้าอยากไปหาคำตอบ!"
 child_personality.3001.a:1 "มีคำถามมากมายเหลือเกิน!"

 child_personality.3001.message:0 "[ROOT.Char.Custom2('RelationToMe', personality_child)] ของข้า [personality_child.GetTitledFirstName] เต็มไปด้วยคำถามเสมอ!"

 child_personality.3002.desc:1 "ไม่มีช่วงเวลาที่เงียบสงบเลย! [ROOT.GetCharacter.Custom2('RelationToMe' , personality_child) ] ของข้า [personality_child.GetTitledFirstName] ช่างเต็มไปด้วยคำถาม! ข้าพยายามอย่างดีที่สุดที่จะส่งเสริมความอยากรู้อยากเห็น [personality_child.GetHerHis] แต่บางครั้งข้าก็อดไม่ได้ที่จะเหนื่อยล้ากับกระแสความคิดและคำถามที่ไม่หยุดหย่อน"
 child_personality.3002.a:1 "เมื่อพ่อและแม่รักกันมาก..."

 #Rowdy
 child_personality.3003.t:0 "ไฟที่กำลังลุกโชน"
 child_personality.3003.desc:0 "[ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('guardian'))] ของข้า [guardian.GetFirstName] เอา แต่สั่งให้ข้านั่งนิ่งๆ และเงียบๆ ทั้งๆ ที่ข้าบอก [guardian.GetHerHim] ว่ามันเป็นไปไม่ได้! มันเหมือนกับว่าแขนขาของข้ากำลังเคลื่อนไหวด้วยตัวเอง และถ้าข้าไม่ตามไป พวกมันจะหลุดออกและวิ่งหนีไปโดยไม่มีข้า!"
 child_personality.3003.a:0 "ข้าจะทำตามใจข้า!"

 child_personality.3003.message:0 "[ROOT.Char.Custom2('RelationToMe',personality_child)] ของข้า [personality_child.GetTitledFirstName] มักจะหาเรื่องทำอยู่เสมอ!"

 child_personality.3004.t:0 "ตัวป่วนที่กำลังก่อตัว"
 child_personality.3004.desc:0 "แม้ว่าข้าจะคาดหวังความซุกซนจาก [ROOT.GetCharacter.Custom2('RelationToMe' , personality_child) ] ของข้า [personality_child.GetTitledFirstName] อยู่แล้ว แต่ความคิดสร้างสรรค์ [personality_child.GetHerHis] ก็ ทำให้ข้าต้องตื่นตัวอยู่เสมอ เมื่อไม่ใช่การแกล้ง ก็เป็นการทะเลาะวิวาท ครูสอนพิเศษที่ไม่พอใจ หรือเข่าถลอกจากกการผจญภัยที่ผิดพลาด"
 child_personality.3004.a:0 "ไม่มีวันน่าเบื่อเลย!"

#Bossy
 child_personality.3005.t:0 "ผู้ปกครองในอนาคต"
 child_personality.3005.desc:0 "[ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('guardian'))] ของข้า [guardian.GetFirstName] เอา แต่ขอให้ข้าปล่อยให้เด็กคนอื่นๆ เลือกเกมที่จะเล่นบ้าง แต่ทำไมข้าต้องทำ ในเมื่อข้ารู้เสมอว่าเกมไหนดีที่สุด? ข้าเบื่อ [guardian.GetHerHim] และผู้ใหญ่คนอื่นๆ ที่คอยบอกข้าว่าต้องทำอะไรเต็มทีแล้ว!"
 child_personality.3005.a:0 "พวกเขาไม่ใช่เจ้านายข้า!"

 child_personality.3005.message:0 "[ROOT.Char.Custom2('RelationToMe',personality_child)] ของข้า [personality_child.GetTitledFirstName] รู้จริงๆ ว่า [personality_child.GetSheHe] ต้องการอะไร!"

 child_personality.3006.desc:0 "ความคิดเห็นและความต้องการของ [ROOT.GetCharacter.Custom2('RelationToMe' , personality_child) ] ของข้า [personality_child.GetTitledFirstName] ไม่มีที่สิ้นสุด ครึ่งหนึ่งของเวลา [personality_child.GetSheHe] พยายามบอกข้าว่าต้องทำอะไร แทนที่จะเป็นในทางกลับกัน!"
 child_personality.3006.a:0 "น่าเกรงขามหรือน่ารำคาญ — มันเป็นเส้นบางๆ ที่ต้องเดิน"

 #Charming
 child_personality.3007.t:0 "ทำงานอย่างชาญฉลาด ไม่ใช่ทำงานหนัก"
 child_personality.3007.desc:0 ""จงทำตัวดีและทำงานหนัก" [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('guardian'))] ของข้า [guardian.GetFirstName] เอา แต่บอกข้า ข้าพยายามอย่างดีที่สุด แต่บางครั้งมันก็เหนื่อยเกินไป! มันไม่ฉลาดกว่าหรือที่จะโกงและโกหกเล็กน้อย เพื่อให้ได้สิ่งที่ข้าต้องการ?!"
 child_personality.3007.a:0 "แล้วทุกคนก็หลอกง่ายเหลือเกินด้วย!"

 child_personality.3007.message:0 "[ROOT.Char.Custom2('RelationToMe',personality_child)] ของข้า [personality_child.GetTitledFirstName] ทั้งหลอกลวงและเจ้าเล่ห์!"

 child_personality.3008.t:0 "รอยยิ้มหวานและคำโกหกเล็กๆ"
 child_personality.3008.desc:1 "เช่นเดียวกับเด็กคนอื่นๆ ในวัย [personality_child.GetHerHis] [ROOT.GetCharacter.Custom2('RelationToMe' , personality_child)] ของข้า [personality_child.GetTitledFirstName] บางครั้งก็โกหกและทดสอบขอบเขต ทว่า [personality_child.GetSheHe] มักหลีกเลี่ยงความสงสัยด้วยท่าทีที่อ่อนหวาน [personality_child.GetHerHis] และผู้คนมักให้อภัย [personality_child.GetHerHim] เสมอเมื่อ [personality_child.GetSheHe] ถูกจับได้\n\nข้าสงสัยว่า [personality_child.GetSheHe] รอดพ้นไปได้มากแค่ไหน..."
 child_personality.3008.a:0 "ข้าจะจับตาดูคนนี้ไว้"

 #Pensive
 child_personality.3009.t:1 "จมอยู่ในความคิด"
 child_personality.3009.desc:1 "[ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('guardian'))] ของข้า [guardian.GetFirstName] บอกข้าว่าข้าควรเล่นกับเด็กคนอื่นๆ แต่พวกเขาก็เสียงดังเหลือเกิน! มันต้องเงียบ ข้าถึงจะได้ยินความคิดของข้า!"
 child_personality.3009.a:1 "มีอะไรให้คิดมากมายเหลือเกิน..."

 child_personality.3009.message:0 "[ROOT.Char.Custom2('RelationToMe',personality_child)] ของข้า [personality_child.GetTitledFirstName] มักจะจมอยู่ในความคิด!"

 child_personality.3010.t:1 "จมอยู่ในความคิด"
 child_personality.3010.desc:1 "[ROOT.GetCharacter.Custom2('RelationToMe' , personality_child)] ของข้า [personality_child.GetTitledFirstName] เป็นเด็กที่สงบผิดปกติ เมื่อคนอื่นๆ เล่นเกมที่โลดโผน [personality_child.GetFirstNameNoTooltip] มักจะถอยไปอยู่มุมเงียบๆ [personality_child.GetSheHe|U] ไม่ค่อยพูดมากนัก แต่ข้าบอกได้ว่า [personality_child.GetSheHe] กำลังคิดอะไรบางอย่างอยู่เสมอ"
 child_personality.3010.a:1 "ข้าสงสัยว่ามีอะไรอยู่ในใจ [personality_child.GetHerHis]?"


