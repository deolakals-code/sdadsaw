 child_personality.1062.t:0 "การหมดความสนใจ"
 child_personality.1063.t:0 "การยืนกราน"
 child_personality.106.desc:0 "[child.GetTitledFirstName] แอบชอบ [crush.GetTitledFirstName] มาสักพักแล้ว ทว่า เมื่อ [child.GetSheHe] สารภาพความรู้สึก [child.GetHerHis] ในที่สุด [crush.GetFirstName] กลับตอบโต้อย่างรุนแรง"
 child_personality.106.vengeful:0 "\n\nตอนนี้ [child.GetFirstName] พึมพำทุกครั้งที่ [crush.GetSheHe] เดินผ่าน"
 child_personality.106.chaste:0 "\n\nการถูกปฏิเสธดูเหมือนจะ ทำให้ [child.GetFirstName] ระแวดระวังต่อแรงดึงดูดใดๆ ก็ตาม"
 child_personality.106.stubborn:0 "\n\nอย่างไรก็ตาม [child.GetFirstName] ยังคงตามตื๊อ [crush.GetHerHim] อย่างไม่ลดละ"
 child_personality.106.confirm_vengeful:0 "อา กิเลสตัณหาแบบเด็กๆ"
 child_personality.106.confirm_chaste:0 "ไม่ควรยุ่งเกี่ยวกับเรื่องตัณหาเลย"
 child_personality.106.confirm_stubborn:0 "หากล้มเหลวในตอนแรก สิ่งเดียวที่ทำได้คือพยายามอีกครั้ง"
 child_personality.106.vengeful_change:0 "[child.GetFirstNameNoTooltip] ไม่ควรปล่อยให้ใครปฏิบัติต่อ [child.GetHerHim] เช่นนั้น!"
 child_personality.106.chaste_change:0 "บางทีความรักอาจไม่ใช่สำหรับ [child.GetFirstNameNoTooltip]..."
 child_personality.106.stubborn_change:0 "[child.GetFirstNameNoTooltip] ไม่ควรยอมแพ้ง่ายๆ เช่นนั้น!"
