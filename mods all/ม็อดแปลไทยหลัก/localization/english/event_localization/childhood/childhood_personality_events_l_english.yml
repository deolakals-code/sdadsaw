 child_personality.105.desc:0 "ข้ากำลังเฝ้าดู [child.GetTitledFirstName] เล่นกับเด็กคนอื่นๆ อยู่เมื่อ [doing_push.GetTitledFirstName] พยายามผลัก [child.GetHerHim] ให้ล้ม"
 child_personality.105.wrathful:0 "ในไม่ช้าก็เกิดการทะเลาะวิวาทขึ้นในหมู่เด็กๆ!"
 child_personality.105.forgiving:0 "\n[child.GetFirstName] รับมือกับมันได้อย่างใจเย็น และนั่งลงคุยกับ [doing_push.GetFirstName] แทน"
 child_personality.105.fickle:0 "ช่วงเวลานั้นอยู่ไม่นานนัก เนื่องจาก [child.GetFirstName] ในไม่ช้าก็ได้สร้างเกมใหม่ขึ้นมาทั้งหมด และลืมเกมก่อนหน้านี้ไปโดยสิ้นเชิง"
 child_personality.105.confirm_wrathful:0 "[child.GetFirstNameNoTooltip] ตอบโต้ได้ดีเท่าที่ [child.GetSheHe] ได้รับ!"
 child_personality.105.confirm_forgiving:0 "[child.GetFirstNameNoTooltip] รู้จักหันแก้มอีกข้างให้เมื่อจำเป็น"
 child_personality.105.confirm_fickle:0 "การก้าวต่อไปมักเป็นแนวทางที่ดีที่สุด"
 child_personality.105.wrathful_change:0 "[child.GetSheHe|U] ต้องไม่ยอมให้ใครมาเหยียบย่ำ [child.GetHerHim]!"
 child_personality.105.forgiving_change:1 "[child.GetFirstNameNoTooltip] ต้องได้รับการสอนให้หันแก้มอีกข้าง"
 child_personality.105.fickle_change:1 "[child.GetFirstNameNoTooltip] ไม่ควรจมอยู่กับเรื่อง เช่นนี้"
