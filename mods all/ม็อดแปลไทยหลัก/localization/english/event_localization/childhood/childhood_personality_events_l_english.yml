 child_personality.4011.t:0 "แรงดึงดูดที่ผลิบาน"
 child_personality.4011.desc_opening:0 "ซุกตัวอยู่บนเตียงใต้ผืนหนัง [ROOT.Char.Custom('GetAnimalType')] ข้าผล็อยหลับไปในความอบอุ่นมัวๆ\n\n"
 child_personality.4011.desc_1:0 "[ROOT.Char.Custom('GetAnimalType')] อันสง่างามยืนอยู่ตรงหน้าข้า กระตุ้นให้ข้าตามมันเข้าไปใน [ROOT.Char.Custom('TerrainType')] เมื่อเราไปถึงทุ่งโล่ง หัวใจข้าเริ่มเต้นแรง ร่างกายข้าสั่นสะท้าน จิตวิญญาณข้า #EMP โหยหา#! เมื่อข้าหันกลับ [ROOT.Char.Custom('GetAnimalType')] ก็หายไป และแทนที่ด้วย..."
 child_personality.4011.desc_2:0 "เบื้องหน้าข้ามีคนผู้หนึ่งนอนอยู่ ปกคลุมด้วยหมอก กวักมือเชิญชวน เมื่อข้าเข้าร่วมกับพวกเขา สัมผัสพวกเขา หมอกก็เริ่มจางลง และแทนที่ด้วยความอบอุ่นที่ซึมซาบไปทั่วผิวหนังของเรา ข้าก้มลงจูบพวกเขา เมื่อข้าถอยกลับ ข้าได้รับการต้อนรับด้วยรอยยิ้มอันอบอุ่นจาก..."
 child_personality.4011.desc_3:0 "ข้าสะดุ้งตื่นกลางดึก – หน้าอกกระเพื่อมและผิวหนังสั่นสะท้าน ข้าไม่เคยรู้สึก เช่นนี้มาก่อน ข้าป่วยหรือ? ข้าฝันถึงอะไร? ทั้งหมดที่ข้าจำได้คือ..."
 child_personality.4011.a:0 "... เด็กชาย"
 child_personality.4011.b:0 "... เด็กหญิง"
 child_personality.4011.c:0 "... เด็กหญิง หรือว่าเป็นเด็กชาย? ข้าจำได้ไม่ชัดเจน"
 child_personality.4011.d:0 "... คนผู้หนึ่ง จริงๆ แล้ว ข้าแค่ดีใจที่มันเป็นเพียงความฝัน"

 child_personality.4012.desc:0 "มีคนบอกข้าว่าเป็นเรื่องธรรมชาติที่จะรู้สึกดึงดูดต่อคนบางคน – ว่าเมื่อถึงเวลา ข้าจะต้องการรู้จักพวกเขาอย่างใกล้ชิด\n\nข้าพยายามทำความเข้าใจว่ามันหมายถึงอะไร แต่ความคืบหน้าเดียวที่ข้าทำได้คือการตระหนักว่ามันสนุกที่จะสำรวจความลึกลับนี้ก็ต่อเมื่อมี [ROOT.Char.Custom('GirlBoyPlural')] คนอื่นๆ อยู่รอบๆ"
 child_personality.4012.a:1 "[ROOT.Char.Custom('GirlBoyPlural')|U] ดีที่สุดจริงๆ!"

 child_personality.4013.desc:0 "ขณะเล่นกับเด็กคนอื่นๆ ข้าพบว่าข้าไม่รังเกียจหากถูกจับคู่กับเด็กหญิงหรือเด็กชายสำหรับเกมที่ใกล้ชิดกว่าของเรา เด็กคนอื่นๆ จำนวนมากดูเหมือนจะมีความชอบ และบางคนถึงกับทำเรื่องใหญ่โต แต่ข้าไม่เข้าใจว่าทำไม"
 child_personality.4013.a:0 "ทั้งเด็กหญิงและเด็กชายช่างน่าสนใจเหลือเกิน!"

 child_personality.4014.desc:0 "ทุกคนรอบตัวข้าดูเหมือนกระตือรือร้นที่จะจับคู่กัน – ยิ้มและเล่นเกมจูบและสัมผัสกับเด็กคนอื่นๆ เมื่อข้าไม่แสดงความสนใจ พวกเขาดูสับสน และ [dummy_opposite_gender.Custom('GirlBoyPlural')] บอกข้าว่าข้าควรชอบพวกเขามากกว่านี้"
 child_personality.4014.a:0 "ข้าไม่เข้าใจจริงๆ..."

 child_personality.4015.desc:0 "ขณะที่ข้ามองดู [ROOT.Char.Custom('OppositeGenderedLowlyServantType')] หนุ่มสาวเดินผ่านไป เหงื่อท่วมกายจากงานหนัก แต่แก้ม [dummy_opposite_gender.GetHerHis] แดงระเรื่อ ข้าก็หลงใหล ความรู้สึกนี้คืออะไร? ความปรารถนานี้?"
 child_personality.4015.a:0 "[dummy_opposite_gender.Custom('GirlBoyPlural')|U] ช่างน่าหลงใหลเหลือเกิน!"
 child_personality.4015.b:0 "ข้ารู้ว่า [crush.GetSheHe] เป็นเพียงสามัญชน... แต่โอ้ หัวใจข้า!"


 #Reincarnation, by Mathilda Bjarnehed
 child_personality.9900.t:0 "ถอดแบบกันมา"
 child_personality.9900.start.desc:1 "ผู้คนเอา แต่บอกข้าว่าข้าถอดแบบมาจาก [ROOT.Char.Custom2('RelationToMe', ancestor)] ของข้า [ancestor.GetTitledFirstName] ข้าไม่เคยพบ [ancestor.GetHerHim] แต่พวกเขายิ้มเมื่อพูด เช่นนั้น ดังนั้นมันคงเป็นเรื่องดี\n\n"
 child_personality.9900.start.sinful.desc:0 "ผู้คนเอา แต่บอกข้าว่าข้าถอดแบบมาจาก [ROOT.Char.Custom2('RelationToMe', ancestor)] ของข้า [ancestor.GetTitledFirstName] ข้าไม่เคยพบ [ancestor.GetHerHim] แต่เห็นได้ชัดว่า [ancestor.GetSheHe] เป็น [ancestor.GetWomanMan] ที่ชั่วร้าย\n\n"
 child_personality.9900.mother.desc:0 "มารดาข้าบอกว่าข้า"
 child_personality.9900.father.desc:0 "บิดาข้าบอกว่าข้า"
 child_personality.9900.nurse.desc:0 "แม่นมข้าบอกว่าข้า"
 child_personality.9900.temperate.desc:0 "รู้จักประมาณตนและควบคุมตนเองได้เสมอ,"
 child_personality.9900.greedy.desc:0 "มองหาโอกาสใหม่อยู่เสมอ,"
 child_personality.9900.generous.desc:0 "ไม่เห็นแก่ตัว,"
 child_personality.9900.diligent.desc:0 "เป็นนักเรียนที่เอาใจใส่และกระตือรือร้น,"
 child_personality.9900.calm.desc:0 "สงบและมีเหตุผล,"
 child_personality.9900.arrogant.desc:1 "เป็น [child.Custom('GirlBoy')] ที่หยิ่งทะนงและสูงศักดิ์,"
 child_personality.9900.humble.desc:0 "เป็นจิตวิญญาณที่ถ่อมตน,"
 child_personality.9900.deceitful.desc:1 "เป็น [child.Custom('GirlBoy')] ที่เจ้าเล่ห์,"
 child_personality.9900.honest.desc:0 "พูด แต่ความจริงเสมอ,"
 child_personality.9900.brave.desc:0 "ไม่กลัวสิ่งใด,"
 child_personality.9900.gregarious.desc:0 "เก่งกาจในการผูกมิตรใหม่,"
 child_personality.9900.ambitious.desc:0 "ถูกลิขิตมาเพื่อความยิ่งใหญ่,"
 child_personality.9900.just.desc:0 "ยุติธรรมและเป็นกลาง,"
 child_personality.9900.zealous.desc:1 "ผู้ติดตามที่เปี่ยมศรัทธาแห่ง[child.GetFaith.GetNameNoTooltip],"
 child_personality.9900.compassionate.desc:0 "เป็นจิตวิญญาณที่ใจดีและอ่อนโยน,"
 child_personality.9900.stubborn.desc:0 "ไม่ใช่คนที่จะยอมแพ้ง่ายๆ,"
 child_personality.9900.forgiving.desc:0 "ไม่เคยเก็บความแค้น,"
 child_personality.9900.sinful.temperate.desc:0 "ไม่กระตือรือร้นที่จะเพลิดเพลินกับความสุขของชีวิต,"
 child_personality.9900.sinful.greedy.desc:0 "เห็นแก่ตัวและไม่เต็มใจที่จะแบ่งปัน,"
 child_personality.9900.sinful.generous.desc:1 "มักจะสุรุ่ยสุร่ายเงินทอง,"
 child_personality.9900.sinful.diligent.desc:0 "กระตือรือร้นจนน่ารำคาญ,"
 child_personality.9900.sinful.calm.desc:0 "ไร้อารมณ์อย่างน่าประหลาด,"
 child_personality.9900.sinful.arrogant.desc:0 "หยิ่งยโสและโอหัง,"
 child_personality.9900.sinful.humble.desc:0 "ขาดความมั่นใจในตนเองโดยสิ้นเชิง,"
 child_personality.9900.sinful.deceitful.desc:0 "เป็นคนโกหกเจ้าเล่ห์,"
 child_personality.9900.sinful.honest.desc:0 "ซื่อสัตย์จนน่ารังเกียจ,"
 child_personality.9900.sinful.brave.desc:0 "เต็มไปด้วยความอวดดี,"
 child_personality.9900.sinful.gregarious.desc:0 "เป็นมิตรมากเกินไป,"
 child_personality.9900.sinful.ambitious.desc:0 "เรียกร้องของเล่นใหม่อยู่เสมอ,"
 child_personality.9900.sinful.just.desc:0 "เป็นคนอวดดีที่ทำตัวเหนือกว่าผู้อื่น,"
 child_personality.9900.sinful.zealous.desc:1 "ผู้ติดตามที่มืดบอดแห่ง[child.GetFaith.GetNameNoTooltip],"
 child_personality.9900.sinful.compassionate.desc:0 "ถูกบดบังด้วยความเห็นอกเห็นใจ,"
 child_personality.9900.sinful.stubborn.desc:0 "ดื้อรั้นอย่างไม่ย่อท้อ,"
 child_personality.9900.sinful.forgiving.desc:0 "พร้อมที่จะให้อภัยการดูถูกมากเกินไป,"
 child_personality.9900.lunatic.desc:1 "เต็มไปด้วยความคิด "แปลกๆ""
 child_personality.9900.dull.desc:1 "เป็น [child.Custom('GirlBoy')] ที่ "ช่างคิด","
 child_personality.9900.shrewd.desc:1 "เป็น [child.Custom('GirlBoy')] ที่ฉลาดหลักแหลม,"
 child_personality.9900.strong.desc:0 "แข็งแรงมาก,"
 child_personality.9900.end.desc:2 "เหมือนกับ [child.Custom2('RelationToMe', ancestor)] ของข้า [ancestor.GetFirstNameNoTooltip]!"
 child_personality.9900.sinful.postscript.desc:0 "ยิ่งผู้คนพูดถึงเรื่องนี้มากเท่าไหร่ ข้าก็ยิ่งถูกปฏิบัติแย่ลงเท่านั้น ข้าถึงกับถูกกล่าวหาในสิ่งที่ข้าไม่ได้ทำ!"
 child_personality.9900.a.dull:0 "ข้าใช้เวลาคิดมากจริงๆ..."
 child_personality.9900.a:0 "ข้าจะ ทำให้ [ancestor.GetHerHim] ภูมิใจ!"
 child_personality.9900.a.sinful:0 "นี่มันไม่ยุติธรรม! ทำไมข้าต้องถูกตัดสินจากการกระทำ [ancestor.GetHerHis] ด้วย?"

 child_personality.9901.t:0 "เกิดใหม่"
 child_personality.9901.start.desc:1 "[child.Custom2('MyCharacterIntroduction', ROOT.Char)|U] ถอดแบบมาจาก [child.GetHerHis] [child.Custom2('RelationToMe', ancestor)], [ancestor.GetTitledFirstName]! แต่ความคล้ายคลึงไม่ได้อยู่แค่เพียงผิวเผิน — มันลึกซึ้งกว่านั้นมาก\n\n[child.GetFirstNameNoTooltip] เป็น"
 child_personality.9901.dull.desc:0 "ค่อนข้างช้า พูดง่ายๆ ก็คือ,"
 child_personality.9901.end.desc:0 "เหมือนกับ [child.GetHerHis] [child.Custom2('RelationToMe', ancestor)] ก่อนหน้า [child.GetHerHim] บางทีอาจเป็น [ancestor.GetTitledFirstNameNoTooltip] จริงๆ ที่กลับมาเดินบนโลกนี้อีกครั้ง?"
 child_personality.9901.a:0 "จักรวาลเต็มไปด้วยความลึกลับอันศักดิ์สิทธิ์"

