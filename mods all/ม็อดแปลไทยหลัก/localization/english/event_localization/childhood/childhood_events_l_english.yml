l_english: 
 childhood.0002.t:0 "นัดเล่น"
 childhood.0002.opening:0 "[crush.GetTitledFirstName] เป็นคนที่อยู่ด้วยแล้วสนุกมาก!\n\n"
 childhood.0002.loud:0 "[crush.GetSheHe|U] มักจะเรียกร้องความสนใจมาก แต่ข้าไม่ถือสา ทุกครั้งที่ข้าเห็น[crush.GetHerHim] วันของข้าก็ดีขึ้น!"
 childhood.0002.quiet:0 "[crush.GetSheHe|U] ส่วนใหญ่จะขี้อายเล็กน้อย แต่[crush.GetSheHe]ก็ยัง ทำให้ทุกครั้งที่ข้าเห็น[crush.GetHerHim]เป็นพิเศษ!"
 childhood.0002.fallback:0 "ทุกครั้งที่ข้าเห็น[crush.GetHerHim] วันของข้าก็ดีขึ้น และข้าหวังว่าเราจะได้เล่นด้วยกันตลอดเวลา"
 childhood.0002.end:1 "\n\nเมื่อใดก็ตามที่สายตาเราประสานกัน ท้องของข้าก็เต็มไปด้วยผีเสื้อ... โอ้ ข้าสงสัยว่า[crush.GetSheHe]จะชอบ[ROOT.Char.GetCurrentLocation.Custom('get_region_flower_type')]ที่ข้าเจอนี้หรือไม่?"
 childhood.0002.a:1 "ดอกไม้นี้สำหรับเจ้า [crush.GetFirstNameNoTooltip]!"
 childhood.0002.b:0 "ไม่... เราควรเป็นแค่เพื่อนกัน"
 crush_returned:0 "[crush.GetFirstNameNoTooltip] ก็ชอบเจ้า เช่นกัน!"
 crush_crushed:0 "[crush.GetFirstNameNoTooltip] ต้องการเป็นแค่เพื่อน..."

 childhood.0004.t:0 "มิตรภาพที่ผลิบาน"
 childhood.0004.desc1:0 "ข้าได้เล่นกับ[friend.GetTitledFirstName]บ่อยครั้งในช่วงนี้ วันก่อน[friend.GetSheHe]ยังให้ข้ายืม[friend.Custom('child_favorite_toy')]สุดโปรดของ[friend.GetHerHis]! เราเข้ากันได้ดีจริงๆ และเราสนุกกันมาก!"
 childhood.0004.desc2:0 "[friend.GetTitledFirstName] และข้าใช้เวลาอยู่ด้วยกันมากในช่วงนี้ พูดคุยและเล่นสนุกกัน เราสนุกกันมาก!"
 childhood.0004.desc3:0 "ข้าใช้เวลาอยู่กับ[friend.GetFirstName]มากเมื่อเร็วๆ นี้"
 childhood_0004.desc3_rowdy:0 "[friend.GetSheHe|U] มักจะมีเรื่องสนุกๆ ทำอยู่เสมอ และเวลาที่เราใช้ร่วมกันไม่เคยน่าเบื่อเลย!"
 childhood_0004.desc3_curious:0 "[friend.GetSheHe|U] รู้ทุกเรื่องที่เกิดขึ้นในราชสำนัก บทสนทนาของเราไม่เคยน่าเบื่อเลย!"
 childhood_0004.desc3_charming:0 "ไม่มีใคร ทำให้ข้าหัวเราะได้เหมือน[friend.GetSheHe]!"
 childhood_0004.desc3_pensive:0 "[friend.GetSheHe|U] มักจะถามคำถามที่ถูกต้องเสมอ เข้าถึงความจริงของทุกบทสนทนาและการอภิปราย ข้าไม่เคยเบื่อเลยเมื่ออยู่กับ[friend.GetHerHim]!"
 childhood_0004.desc3_bossy:0 "[friend.GetSheHe|U] รู้เสมอว่าเราควรทำอะไรเมื่อพบกัน และข้าไม่เคยเบื่อเลยเมื่ออยู่กับ[friend.GetHerHim]!"
 childhood_0004.desc3_fallback:0 "เราสนุกด้วยกันเสมอ ไม่ว่าเราจะเล่นเกมโปรดเกมใดเกมหนึ่งหรือแค่พูดคุยกัน!"
 childhood.0004.a:0 "[friend.GetSheHe|U] เป็นเพื่อนที่ดีมาก!"
 childhood.0004.b:0 "ข้าสนุกกับการเล่นกับ[friend.GetHerHim]จริงๆ!"
 childhood.0004.c:0 "เพื่อนที่ดีกว่า[friend.GetHerHim]นั้นหายาก!"
 childhood.0004.a_alt:0 "มาสาบานกันเถอะ - เป็นเพื่อนกัน#EMP ตลอดไป!#!"
 childhood.0004.c_alt:0 "เจ้า#EMP คนเขลา#! ที่มาเชื่อใจข้า, #EMP [child.Custom2('InsultNoun', ROOT.Char)]!#!"
 childhood.0004.d:0 "...เจ้าต้องการ[friend.Custom('child_favorite_toy')] #EMP คืน#!? ไม่มีทาง!"

 childhood.0006.t:0 "ความสนใจที่ไม่พึงประสงค์"
 childhood.0006.opening:0 "[bully.GetTitledFirstName] รังควานข้ามานานแล้ว\n\n"
 childhood.0006.mean:0 "[bully.GetSheHe|U] ช่างร้ายกาจ เยาะเย้ยข้าและผลักไสข้า"
 childhood.0006.loud:0 "เด็กคนอื่นๆ หลายคนเชื่อฟัง[bully.GetHerHim] และ[bully.GetSheHe]ใช้อิทธิพลของ[bully.GetHerHis]เพื่อ ทำให้พวกเขาต่อต้านข้า"
 childhood.0006.quiet:0 "[bully.GetSheHe|U] มักจะไม่เป็นที่สังเกต เข้ามาทำร้ายข้าเมื่อไม่มีใครมอง"
 childhood.0006.nice:0 "[bully.GetSheHe|U] ทำให้ทุกคนเชื่อว่า[bully.GetSheHe]เป็นนักบุญ แต่[bully.GetSheHe]เยาะเย้ยข้าอย่างไม่หยุดหย่อนสำหรับทุกความผิดพลาดเล็กน้อยที่ข้าทำ"
 childhood.0006.fallback:0 "[bully.GetSheHe|U] ฉวยทุกโอกาสที่จะจ้องมองและเยาะเย้ยข้า"
 childhood.0006.toy:0 "มิใช่เพียงเท่านั้น... [bully.GetSheHe] ทำ[ROOT.Char.Custom('child_favorite_toy')]ชิ้นโปรดของข้าพัง, เจ้า#EMP [bully.Custom2('InsultNoun', ROOT.Char)]!#!"
 childhood.0006.end:0 "ข้าไม่สามารถ ทำให้[bully.GetHerHim]หยุดได้ ไม่ว่าข้าจะทำอะไรก็ตาม!"
 childhood.0006.a:0 "[bully.GetSheHe|U] แย่ที่สุด!"
 childhood.0006.b:0 "กรอด... ข้าจะซัดเจ้าให้สลบ!"
 childhood.0006.b.critical_success:0 "ท่านซัด[bully.GetHerHim]จนตาย"
 childhood.0006.b.success:0 "ท่านซัด[bully.GetHerHim]และ[bully.GetSheHe]เลิกรังควานท่าน"
 childhood.0006.b.failure:0 "[bully.GetSheHe|U] ซัดท่าน"
 childhood.0006.b.critical_failure:0 "[bully.GetSheHe|U] ซัดท่านอย่างหนัก"
 childhood.0006.b.death:0 "[bully.GetSheHe|U] ซัดท่าน#EMP จนตาย#!"
 childhood.0006.c:0 "ฟังนะ ข้าจะจ่ายให้เจ้าห้าเหรียญทองเพื่อไปให้พ้น"
 childhood.0006.c_leave:0 "[bully.GetSheHe|U] #EMP ไม่#! ไปให้พ้น"

 childhood.0008.t:0 "การจัดการความโกรธ"
 childhood.0008.desc:0 "[ROOT.GetCharacter.Custom2('RelationToMe' , SCOPE.sC('victim'))]ของข้า [victim.GetTitledFirstName] กำลัง ทำให้ข้าหงุดหงิด\n\n"
 childhood.0008.mean:0 "[victim.GetSheHe|U] ฉวยทุกโอกาสที่จะยั่วโมโหข้า ดูเหมือนจะมีความสุขกับความรำคาญและความเจ็บปวดที่[victim.GetSheHe]ก่อขึ้น"
 childhood.0008.loud:0 "[victim.GetSheHe|U] พูดพล่ามไม่หยุด ไม่ว่าจะเป็นเรื่องอะไรและไม่ว่าข้าจะบอก[victim.GetHerHim]ว่าข้าไม่สนใจแค่ไหน มันไม่เคยจบ!"
 childhood.0008.quiet:0 "ข้าพยายาม ทำให้[victim.GetHerHim]พูด แสดงความคิดเห็น พูด#EMP อะไรก็ได้#!...! ไม่ว่าข้าจะทำอะไร [victim.GetSheHe]ก็ยิ่งเก็บตัวมากขึ้นเรื่อยๆ มีอะไรผิดปกติกับ[victim.GetHerHim]กันแน่?!"
 childhood.0008.nice:0 "[victim.GetSheHe|U] เป็น#EMP คนดี#!เสมอ เทศนาเกี่ยวกับคุณธรรมอย่างหนึ่งแล้วอย่างเล่า การบรรยายอย่างต่อเนื่องของ[victim.GetHerHis|U]กำลังส่งผลตรงกันข้ามกับข้า..."
 childhood.0008.fallback:0 "[victim.GetSheHe|U] ขวางทางข้าเสมอ [victim.GetSheHe]พูดถึงเรื่องที่น่าเบื่อที่สุด [victim.GetSheHe]จัดการพูดผิดเรื่องผิดเวลาในทุกบทสนทนาอยู่เสมอ..."
 childhood.0008.a:1 "นั่นจะเป็นบทเรียนให้[victim.GetHerHim]สำหรับการทำตัวน่ารำคาญ!"
 childhood.0008.b:1 "ครั้งต่อไปที่เราพบกัน ข้าจะ#EMP พยายาม#! ทำตัวดี..."
 childhood.0008.c:0 "โอ้ ข้า#EMP เกลียด#! [victim.GetHerHim]เพียงใด! [victim.GetSheHe|U]ควรจะ... ตายไปเสียดีกว่า"

 childhood.0009.t:0 "การตามใจอย่างบริสุทธิ์"
 childhood.0009.opening:0 "การที่ในที่สุดสามารถสั่งสอน[victim.GetFirstName]ให้อยู่ในที่ของ[victim.GetHerHis]ได้ ทำให้อารมณ์ของข้าดีขึ้นอย่างมาก\n\n"
 childhood.0009.desc1:0 "เกมโปรดเกมหนึ่งที่เราเล่นคือการดูว่าข้าสามารถผลัก[victim.GetHerHim]ได้กี่ครั้งก่อนที่[victim.GetSheHe]จะทนไม่ไหว!"
 childhood.0009.desc2:0 "ข้าเริ่มติดตาม[victim.GetHerHim]ไปรอบๆ วิพากษ์วิจารณ์ทุกการเคลื่อนไหวของ[victim.GetHerHis]ให้ดังที่สุดเท่าที่จะทำได้"
 childhood.0009.desc3:0 "ข้ายืม[victim.Custom('child_favorite_toy')]สุดโปรดของ[victim.GetHerHis] และตอนนี้[victim.GetSheHe]ต้องทำตามที่ข้าบอก[victim.GetHerHim]!"
 childhood.0009.fallback:0 "ข้าเจอ[victim.Custom('child_favorite_toy')]สุดโปรดของ[victim.GetHerHis]โดยบังเอิญ และการซ่อนมันและเฝ้าดู[victim.GetHerHim]ค้นหาอย่างสิ้นหวังเป็นไฮไลท์ของสัปดาห์ของข้า!"
 childhood.0009.a:0 "มันก็แค่สนุกๆ!"

 childhood.0012.t:0 "ได้รับความสนใจ"
 childhood.0012.desc:0 "เมื่อข้าเล่นกับ[crush_holder.GetTitledFirstName]วันก่อน [crush_holder.GetSheHe]เอาใจใส่ข้าเป็นพิเศษ ข้าไม่เคยรู้สึกกับ[crush_holder.GetHerHim]แบบนี้มาก่อน แต่บางทีข้าอาจจะเริ่มเห็น[crush_holder.GetHerHim]เป็นมากกว่าเพื่อน"
 childhood.0012.a:0 "[crush_holder.GetTitledFirstNameNoTooltip], ข้าว่าข้าชอบเจ้านะ!"
 childhood.0012.b:0 "[crush_holder.GetTitledFirstNameNoTooltip] มิได้เป็นอันใดเกินเลยกว่าสหาย"

 childhood.0013.t:0 "ปฏิสัมพันธ์ฉันท์มิตร"
 childhood.0013.desc:0 "ช่วงนี้ ข้ากับ[child.GetTitledFirstName]ใช้เวลาอยู่ด้วยกันมาก\n\n"
 childhood.0013.desc1:0 "วันก่อนข้ายังให้[child.GetHerHim]ยืม[child.Custom('child_favorite_toy')]สุดโปรดของข้า! เราเข้ากันได้ดีจริงๆ และเราสนุกกันมาก!"
 childhood.0013.desc2:0 "[child.GetTitledFirstName] และข้าใช้เวลาอยู่ด้วยกันมากในช่วงนี้ พูดคุยและเล่นสนุกกัน เราสนุกกันมาก!"
 childhood.0013.desc3:0 ""
 childhood.0013.desc3_rowdy:0 "[child.GetSheHe|U] ทนกับการเล่นพิเรนทร์ของข้าได้เสมอและติดตามข้าไปในการผจญภัยทั้งหมดของข้า เวลาที่เราใช้ร่วมกันไม่เคยน่าเบื่อเลย!"
 childhood.0013.desc3_curious:0 "[child.GetSheHe|U] เก่งมากในการฟังเรื่องซุบซิบและข่าวลือทั้งหมดที่ข้าได้ยินในราชสำนัก ให้ความเห็นที่ลึกซึ้งและมุมมองใหม่ๆ"
 childhood.0013.desc3_charming:0 "ไม่มีใครหัวเราะกับมุกตลกของข้าได้มากเท่า[child.GetSheHe]!"
 childhood.0013.desc3_pensive:0 "[child.GetSheHe|U] ชื่นชมการอยู่ร่วมกับข้าเสมอ รับฟังความคิดของข้าและพูดคุยกับข้าเป็นเวลานาน"
 childhood.0013.desc3_bossy:0 "[child.GetSheHe|U] ทำตามที่ข้านำเสมอ ข้าไม่เคยเบื่อเลยเมื่ออยู่กับ[child.GetHerHim]!"
 childhood.0013.desc_fallback:0 "[child.GetSheHe|U] อยู่ด้วยแล้วสนุกเสมอ ทั้งตอนที่เราเล่นและตอนที่มีเรื่องต้องพูดคุยกัน!"
 childhood.0013.desc_end:0 "ข้าสนุกกับการอยู่ร่วมกับ[child.GetHerHis]จริงๆ และข้าคิดว่าเราสองคนจะสนิทกันไปอีกนาน"
 childhood.0013.a:0 "ข้าดีใจมากที่เรารู้จักกัน!"

 childhood.0910.t:0 "ความทรมานที่ไม่สิ้นสุด"
 childhood.0910.opening:0 "สิ่งที่[bully.GetTitledFirstName] ทำให้ข้าต้องเผชิญในวัยเด็กยังคงหนักอึ้งอยู่ในใจข้า"
 childhood.0910.desc1:0 "สายตา การหัวเราะเยาะ ความเจ็บปวด... ทุกครั้งที่ข้าเห็น[bully.GetHerHim] อารมณ์ของข้าต้องขุ่นมัวอย่างแน่นอน\n\nตอนนี้[bully.GetSheHe|U]อาจจะโตเป็นผู้ใหญ่แล้ว แต่ข้ารู้ว่า[bully.GetSheHe]จะไม่มีวันเป็นคนดีได้!"
 childhood.0910.desc2:0 "\n\nบางครั้งข้ายังคงได้ยินเสียงหัวเราะเยาะเย้ยของ[bully.GetHerHis]ขณะที่[bully.GetSheHe]กระทืบ[ROOT.Char.Custom('child_favorite_toy')]สุดที่รักของข้าลงกับพื้น"
 childhood.0910.a:0 "ข้าจะไม่มีวันให้อภัย[bully.GetHerHim]!"

 childhood.0911.t:0 "การตามใจในวัยเด็ก"
 childhood.0911.desc_rival:0 "[victim.GetTitledFirstName] อาจจะโตเป็นผู้ใหญ่แล้วตอนนี้ แต่นั่นไม่ได้หมายความว่า[victim.GetSheHe]ได้ให้อภัยข้าสำหรับสิ่งที่ข้า ทำให้[victim.GetHerHim]ต้องเผชิญเมื่อเราทั้งคู่ยังเด็ก\n\nก็ดีเหมือนกัน เพราะความเกลียดชังที่ข้ามีต่อ[victim.GetHerHim]ก็เติบโตขึ้นเท่าๆ กัน!"
 childhood.0911.opening:0 "ข้าสงสัยว่า[victim.GetTitledFirstName]จำสิ่งที่ข้า ทำให้[victim.GetHerHim]ต้องเผชิญเมื่อเราทั้งคู่ยังเด็กได้หรือไม่"
 childhood.0911.desc1:0 "\n\nอย่างไรก็ตาม ตอนนี้[victim.GetSheHe]กำลังเติบโตขึ้น ข้าต้องทิ้งการตามใจแบบเด็กๆ เหล่านั้นไว้เบื้องหลังและมุ่งเน้นไปที่สิ่งอื่น"
 childhood.0911.desc2:0 "ข้าจะจดจำใบหน้าที่หวาดกลัวของ[victim.GetHerHis]เสมอเมื่อข้าทำลาย[victim.Custom('child_favorite_toy')]ของ[victim.GetHerHis] มันตลกมาก!\n\nอย่างไรก็ตาม ตอนนี้[victim.GetSheHe]กำลังเติบโตขึ้น ข้าต้องทิ้งการตามใจแบบเด็กๆ ไว้เบื้องหลังและมุ่งเน้นไปที่สิ่งอื่น"
 childhood.0911.a:0 "แล้วพบกัน, [victim.GetTitledFirstNameNoTooltip]"

 childhood.0998.t:0 "ความรู้สึกที่เติบโต"
 childhood.0998.desc:0 "ข้าจดจำช่วงเวลาดีๆ ทั้งหมดที่ข้าเคยมีร่วมกับ[crush.GetTitledFirstName]ในวัยเด็กได้อย่างชัดเจน\n\n[crush.GetSheHe|U] จะเป็นที่รักของข้าเสมอ แม้ว่าจะไม่มีอะไรเกิดขึ้นระหว่างเราเมื่อเราโตขึ้น!"
 childhood.0998.a:0 "ข้าโชคดีที่ได้รู้จัก[crush.GetHerHim]"

 childhood.0999.t:0 "ความรู้สึกที่เติบโต"
 childhood.0999.desc:1 "ข้าจดจำช่วงเวลาดีๆ ทั้งหมดที่ข้าเคยมีร่วมกับ[root_crush.GetTitledFirstName]เมื่อเรายังเด็กได้อย่างชัดเจน\n\nแม้ว่าตอนนี้[root_crush.GetSheHe]จะเข้าสู่โลกของผู้ใหญ่แล้ว [root_crush.GetSheHe]ก็จะเป็นที่รักของข้าเสมอ!"
 childhood.0999.desc_unrequited:1 "แม้ว่า[root_crush.GetSheHe]จะไม่เคยตอบสนองความรู้สึกของข้าเลยก็ตาม..."
 childhood.0999.a:1 "ข้าโชคดีที่ได้รู้จัก[root_crush.GetHerHim]"

 childhood.1000.t:0 "มิตรภาพอันลึกซึ้ง"
 childhood.1000.desc:0 "[friend_to_crush.GetTitledFirstName] เป็นเพื่อนที่ดีจริงๆ! \n\nเมื่อใดก็ตามที่เราใช้เวลาอยู่ด้วยกัน ข้าก็มีความสุขเสมอ และ[friend_to_crush.GetSheHe]เข้าใจข้าอย่างที่ไม่มีใครทำได้ \n\nแม้ว่าเราจะเป็นเพื่อนที่ดีต่อกันมาก บางครั้งข้าก็สงสัยว่าข้าไม่ได้ต้องการอะไรมากกว่านี้จากความสัมพันธ์ของเรา..."
 childhood.1000.a:0 "ข้าคิดว่าข้าชอบ[friend_to_crush.GetHerHim]มากกว่าเพื่อน!"
 childhood.1000.c:1 "[friend_to_crush.GetSheHe|U] เป็นเพื่อน ไม่มีอะไรมากไปกว่านั้น!"
 childhood.1000.b:0 "ข้าเอา[friend_to_crush.Custom('FavoriteTreatDemand')]มาให้เจ้า... อยากจับมือกันไหม?"
 sweet_opinion:0 "อ่อนหวานมาก"
 crush_crushed_hard:0 "[crush.GetFirstNameNoTooltip] ไม่ต้องการเป็นเพื่อนอีกต่อไป..."
 risks_childhood.1000:0 "ไม่มีใครบอกได้ว่า[friend_to_crush.GetFirstNameNoTooltip]จะตอบสนองอย่างไร..."

 childhood.1001.t:0 "การยืนหยัดครั้งสุดท้าย"
 childhood.1001.opening:0 "ความทรมานที่ไม่สิ้นสุดที่[bully.GetTitledFirstName]กระทำต่อข้าต้องหยุดลง! [bully.GetSheHe|U] แกล้งข้าอย่างโหดเหี้ยม ผลักไสข้าและ ทำให้ข้าอับอาย\n\n"
 childhood.1001.desc:0 "สิ่งนี้จะดำเนินต่อไปไม่ได้! ถึงเวลาที่ข้าจะแสดงให้[bully.GetHerHim]เห็นว่า[bully.GetSheHe]กำลังยุ่งอยู่กับใคร"
 childhood.1001.fallback:0 "แม้ว่าสิ่งนี้จะ ทำให้ข้าหนักใจ แต่ข้าก็ไม่มีอำนาจที่จะหยุด[bully.GetHerHim]ได้!"
 childhood.1001.a:1 "เกี่ยวกับความไร้มารยาทของเจ้า..."
 childhood.1001.a.success:0 "ข้าสอนบทเรียนให้[bully.GetTitledFirstNameNoTooltip]"
 childhood.1001.a.failure:0 "[bully.GetTitledFirstNameNoTooltip] ซ้อมข้า"
 childhood.1001.b:0 "มาคุยกันเรื่องพฤติกรรมของเจ้ากันเถอะ..."
 childhood.1001.b.success:0 "ข้าโน้มน้าวให้[bully.GetTitledFirstNameNoTooltip]เลิกรังแกข้า"
 childhood.1001.c:0 "สาปแช่งเจ้า [bully.GetTitledFirstNameNoTooltip]"
 childhood.1001.d:0 "[adult_friend.GetFirstNameNoTooltip] ท่านเป็นผู้ใหญ่ – โปรดช่วยข้าด้วย!"

 childhood.1002.t:0 "[guardian_parent.Custom('MotherFather')|U]ผู้สนับสนุน"
 childhood.1002.desc1:0 "โอ๊ย! ขณะเล่นในสวนกับ[friend.GetTitledFirstName] ข้าล้มลงและเข่าถลอก [guardian_parent.Custom('MotherFather')]ของข้าอยู่อีกฟากหนึ่งของสนาม กำลังเพลิดเพลินกับอากาศดี และ[friend.GetTitledFirstName]กระตุ้นให้ข้าไปหา[guardian_parent.GetHerHim]"
 childhood.1002.desc2:0 "โอ๊ย! ขณะเล่นกับ[ROOT.Char.Custom('child_favorite_toy')]ของข้า ข้าล้มลงและเข่าถลอก ทันทีที่ข้าลุกขึ้นยืน [guardian_parent.Custom('MotherFather')]ของข้าก็เดินมาตามทางข้างๆ ข้า ถามว่าข้าเป็นอะไรหรือไม่"
 childhood.1002.desc2_add:0 "\n\n"จงกล้าหาญ [ROOT.Char.Custom('GetDaughterSon')]" [guardian_parent.GetSheHe|U] กล่าว "เดี๋ยวมันก็หายดี ข้าอยู่ที่นี่เพื่อช่วย – แค่ฟังสิ่งที่ข้าจะพูด แล้วเจ้าจะเรียนรู้วิธีหลีกเลี่ยงไม่ให้สิ่งนี้เกิดขึ้นอีก""
 childhood.1002.desc3:0 "ขณะที่ข้ากำลังศึกษาหนังสือที่ข้าควรจะศึกษาให้ลึกซึ้งยิ่งขึ้น ข้าตระหนักว่าข้ามีปัญหาในการทำความเข้าใจความแตกต่างที่ละเอียดอ่อนของหัวข้อนั้น \n\nอีกไม่นานข้าควรจะนำเสนอเนื้อหาต่อ[guardian_parent.Custom('MotherFather')]ของข้า แต่ถ้าข้าทำต่อไปด้วยตัวเอง ข้าอาจจะต้องติดอยู่กับหนังสือเล่มนี้ทั้งคืน"
 childhood.1002.a:0 "[guardian_parent.Custom('MotherFather')|U] โปรดช่วยข้าด้วย!"
 childhood.1002.b:0 "ข้าจัดการเรื่องนี้ด้วยตัวเองได้"
 childhood.1002.b_1:0 "มันไม่เป็นไปด้วยดี"
 childhood.1002.b_2:1 "ท่านทำได้ดีมาก"

 childhood.1003.t:0 "ความเจ็บปวดของการเติบโต"
 childhood.1003.desc1:0 "ข้ากำลังเพลิดเพลินกับอากาศ ฟังเสียงหัวเราะของ[child.Custom('GetDaughterSon')]ของข้า [child.GetTitledFirstName] และเพื่อนของ[child.GetHerHis] [friend.GetTitledFirstName] ทันใดนั้นข้าก็เห็น[child.GetTitledFirstName]ล้มลงและเข่าบาดเจ็บ [child.GetSheHe|U]เข้ามาหาข้า หลังจากเพื่อนของ[child.GetHerHis]กระตุ้นเล็กน้อย และขอความช่วยเหลือจากข้าในการดูแลอาการบาดเจ็บ"
 childhood.1003.desc2:0 "ข้ากำลังเดินเล่นในสวน เพลิดเพลินกับอากาศ เมื่อข้าเห็น[child.Custom('GetDaughterSon')]ของข้า [child.GetTitledFirstName] ล้มลงและเข่าถลอกขณะเล่นกับ[child.Custom('child_favorite_toy')]ของ[child.GetHerHis] เมื่อข้าเข้าไปหา[child.GetHerHim] ถามว่า[child.GetSheHe]เป็นอะไรหรือไม่ [child.GetSheHe]ขอความช่วยเหลือจากข้าในการดูแลอาการบาดเจ็บ"
 childhood.1003.desc3:0 "ข้าได้มอบหมายงานที่ท้าทายให้กับ[child.Custom('GetDaughterSon')]ของข้า [child.GetTitledFirstName] โดยขอให้[child.GetHerHim]อ่านหนังสือที่ซับซ้อนในเวลาเพียงไม่กี่วัน เย็นวันก่อนที่[child.GetSheHe]ควรจะนำเสนอเนื้อหาให้ข้า [child.GetSheHe]มาหาข้าและขอความช่วยเหลือจากข้า"
 childhood.1003.a:0 "ข้าดีใจที่[child.GetSheHe]สามารถพึ่งพาข้าได้!"

 childhood.1004.t:0 "จิตใจที่เหนื่อยล้า"
 childhood.1004.desc:1 ""เจ้านอนหลับเพียงพอหรือไม่?"\n\nคำถามที่เต็มไปด้วยความกังวลของ[guardian_parent.Custom('MotherFatherPossessive')]เตือนข้าว่าช่วงนี้ข้านอนหลับไม่สนิท ความกดดันอย่างต่อเนื่องที่ต้องทำงานทุกอย่างให้ดีมีน้ำหนักมากกว่าความปรารถนาที่จะนอนหลับของข้า\n\n[guardian_parent.GetSheHe|U] บอกให้ข้าหยุดพักในตอนเย็นและเข้านอน แต่หัวค่ำ และเป็นข้อเสนอที่ข้ายินดีรับ"
 childhood.1004.a:0 "ขอบคุณ [guardian_parent.Custom('MotherFather')]"
 childhood.1004.b:0 "โอกาสอันดีที่จะอ่านหนังสือบนเตียง!"
 childhood.1004.c:0 "ข้าจะอยู่ต่อและทำของขวัญให้[guardian_parent.Custom('MotherFather')]ของข้า!"

 childhood.1005.t:0 "จิตใจที่เหนื่อยล้า"
 childhood.1005.desc:1 ""เจ้าใช้เวลาทั้งหมดไปทำอะไร?!"\n\nข้อกล่าวหาของ[guardian_parent.Custom('MotherFatherPossessive')]หนักอึ้งอยู่ในใจข้า ข้าพยายามทำงานทุกอย่างที่ได้รับมอบหมายให้เสร็จ แต่[guardian_parent.GetSheHe]ดูเหมือนจะไม่เคยพอใจเลย"
 childhood.1005.a:0 "ข้าจะพยายาม ทำให้ดีขึ้น!"
 childhood.1005.b:0 "ข้าพยายามอย่างเต็มที่แล้ว"
 childhood.1005.c:0 "#EMP ท่านบอกข้าไม่ได้หรอกว่าต้องทำอะไร [guardian_parent.Custom('MotherFather')]!#!"

 childhood.1006.t:0 "เมื่อสิ่งที่ตรงกันข้ามปะทะกัน"
 childhood.1006.desc:0 "[guardian_parent.Custom('MotherFather')] ของข้าไม่เคยปล่อยให้ข้าอยู่ตามลำพังอีกเลย นับ แต่ [guardian_parent.GetSheHe] ตัดสินว่าข้าไม่ขยันหมั่นเพียรพอ [guardian_parent.GetSheHe] ก็ถือเป็นภาระของ [guardian_parent.GetHerselfHimself] ที่จะไม่ยอมให้ข้าได้พักผ่อนอีก\n\n[guardian_parent.GetSheHe|U] ถึงกับบ่นทันทีที่ข้าพยายามแอบไปงีบหลับสักครู่!"
 childhood.1006.a:0 "[guardian_parent.Custom('MotherFather')|U] ไม่เคยมีความสุขเลย!"
 childhood.1006.b:0 "ข้าเดาว่าข้าจะลองดู..."
 childhood.1006.c:0 "ZZZzzz#DIE1 zzz#!#DIE2 zzz...#!"

 childhood.1007.t:0 "เงาที่เติบโต"
 childhood.1007.opening:0 "[bully.GetTitledFirstName] ช่างน่ารำคาญนัก!\n\n"
 childhood.1007.young_malicious:0 "ข้ากำลังเล่นกับ[ROOT.Char.Custom('child_favorite_toy')]สุดที่รักของข้าเมื่อ[bully.GetSheHe]บุกเข้ามาในห้องและฉีก[ROOT.Char.Custom('child_favorite_toy')]ออกจากมือข้า"
 childhood.1007.young_extroverted:0 "[bully.GetSheHe|U] โกหกเกี่ยวกับข้าให้เด็กคนอื่นๆ ฟังเสมอ ทำให้พวกเขาชอบข้าน้อยลง"
 childhood.1007.young_dominant:0 "เมื่อข้ากำลังเล่นในสวนกับเด็กคนอื่นๆ [bully.GetSheHe]ก็เข้ามาสั่งให้ทุกคนหยุดเล่นกับข้าทันที"
 childhood.1007.young_emotional:0 "ข้าแค่เดินผ่าน[bully.GetHerHim]ในห้องโถง ทันใดนั้น[bully.GetSheHe]ก็เริ่มร้องไห้เสียงดัง บอกว่าข้าตี[bully.GetHerHim]"
 childhood.1007.malicious:0 "ข้ากำลังเดินเล่นในสวน ทันใดนั้น[bully.GetSheHe]ก็ออกมาจากพุ่มไม้ ผลักข้าลงไปในโคลน [bully.GetSheHe|U] ยังหัวเราะตลอดเวลา"
 childhood.1007.dominant:0 "[bully.GetSheHe|U] เห็นได้ชัดว่าสั่งให้เด็กคนอื่นๆ หลีกเลี่ยงข้า และตอนนี้พวกเขาทั้งหมดเงียบลงเมื่อใดก็ตามที่ข้าอยู่ใกล้ ข้ารู้ว่าเป็นความผิดของ[bully.GetHerHis]และเด็กคนอื่นๆ ไม่ได้หมายความตามนั้น แต่มันก็ยังเจ็บปวด"
 childhood.1007.extroverted:0 "ยามใดที่ [bully.GetSheHe] มีโอกาส [bully.GetSheHe] จะพยายามสุดความสามารถ [bully.GetHerHis] เพื่อโน้มน้าวให้เด็กคนอื่นเชื่อว่าข้าเป็นบุคคลที่น่ารังเกียจ [bully.GetSheHe|U] กล่าวเท็จและ แต่งเรื่องราว และมีเพียงข้าผู้เดียวที่รู้ว่ามันมิใช่ความจริง"
 childhood.1007.fallback:0 "ขณะที่ข้าเดินผ่าน [bully.GetHerHim] [bully.GetSheHe] ก็ยื่นขาของ [bully.GetHerHis] ออกมาขัดขาข้าทันที!"
 childhood.1007.end:0 "\n\n[bully.GetSheHe|U] ไม่ยอมปล่อยข้าไป ข้าไม่รู้จะทำอย่างไร"
 childhood.1007.a:0 "[bully.GetSheHe|U] แย่ที่สุด!"
 childhood.1007.b:0 "[bully.GetFirstNameNoTooltip|U] #EMP ต้อง#! สามารถเห็นเหตุผลได้!"
 childhood.1007.b.success:0 "ในที่สุด[bully.GetSheHe|U]ก็เห็นเหตุผล"
 childhood.1007.b.failure:0 "[bully.GetSheHe|U] รังแกหนักขึ้นเป็นสองเท่า"
 childhood.1007.c:0 "*#DIE1 บ่นพึมพำ#! #DIE2 บ่นพึมพำ*#! ข้าจะระบายความคับข้องใจใส่[victim.GetFirstNameNoTooltip]..."
 childhood.1007.d:0 "ไม่ #EMP ข้าคือคนที่รังแก.#!"
 childhood.1007.d.success:0 "ท่านพลิกสถานการณ์กับ[bully.GetFirstNameNoTooltip]"
 childhood.1007.d.failure:0 "[bully.GetFirstNameNoTooltip] ไม่ยอมแพ้"
 childhood.1007.c.toast:0 "[child.GetFirstNameNoTooltip] รังแกท่าน"

 childhood.1008.t:0 "การรับมือที่ไม่ธรรมดา"
 childhood.1008.opening:0 "ในที่สุด[victim.GetTitledFirstName]ก็มีประโยชน์!\n\nชีวิตค่อนข้างเครียดในช่วงนี้ แต่[victim.GetSheHe]ช่วยให้ข้าผ่อนคลายได้\n\n"
 childhood.1008.1:0 "ข้าเจอ[victim.GetHerHim]ในห้องโถง และทันทีที่[victim.GetSheHe]กำลังเดินผ่านข้าไป ข้าก็ยื่นขาออกไปขัดขา[victim.GetHerHim] สีหน้าของ[victim.GetHerHis]นั้นประเมินค่าไม่ได้!"
 childhood.1008.2:0 "เมื่อใดก็ตามที่เราสนทนากัน ข้าจะตั้งคำถามกับทุกสิ่งที่[victim.GetSheHe]พูดและล้อเลียนข้อสรุปที่[victim.GetSheHe]นำเสนอ"
 childhood.1008.3:0 "ทันทีที่[victim.GetSheHe]กำลังจะกัดขนมปังในมื้อเช้า ข้าก็ทุบหลัง[victim.GetHerHim] ความเละเทะบนโต๊ะนั้นค่อนข้างน่าขยะแขยง แต่เสียงที่[victim.GetSheHe]ทำนั้นตลกมาก!"
 childhood.1008.a:0 "มันช่วยระบายความเครียด!"
 childhood.1008.b:0 "มาต่อด้วยการซ้อมดีๆ กันเถอะ!"
 childhood.1008.c:0 "[extra_bully.GetFirstNameNoTooltip]! ช่วยข้ารังแกเจ้า[victim.Custom2('InsultAdjective', ROOT.Char)] [victim.Custom2('InsultNoun', ROOT.Char)]ผู้นี้ที!"

 childhood.1009.t:0 "ความกังวลของเพื่อน"
 childhood.1009.opening:0 "[friend.GetTitledFirstName] เป็นเพื่อนที่ดี [friend.GetSheHe|U] สังเกตเห็นว่ามีบางอย่าง ทำให้ข้าหนักใจ และ[friend.GetSheHe]โน้มน้าวให้ข้าแบ่งปันความคิดกับ[friend.GetHerHim]\n\n"
 childhood.1009.1:0 ""พวกเรามาที่นี่เพื่อทำอะไรกันแน่? แผนการของ[ROOT.Char.GetFaith.FateGodNamePossessive]สำหรับพวกเราทุกคนคืออะไร?""
 childhood.1009.2:0 ""แท้จริงแล้วข้าควรจะเป็นอะไรเมื่อข้าโตขึ้น?""
 childhood.1009.3:0 ""เจ้าจะรู้ได้อย่างไรว่าความรักของใครบางคนที่มีต่อเจ้านั้นเป็นของจริง?""
 childhood.1009.end:0 "\n\nแค่ได้พูดคุยกับ[friend.GetHerHim]ก็ ทำให้ข้ารู้สึกดีขึ้นแล้ว!"
 childhood.1009.a:0 "ข้าโชคดีที่มีเพื่อนดีๆ เช่นนี้"
 childhood.1009.b:0 "เจ้าใจดีมาก ข้าอยากให้เจ้ามี[ROOT.Char.Custom('child_favorite_toy')]ของข้า!"
 gave_toy_opinion:0 "ให้ของเล่น"
 childhood.1009.c:0 "เจ้าช่างฉลาดนัก [friend.GetFirstNameNoTooltip] บอกข้าเพิ่มเติม!"

 childhood.1010.t:0 "อยู่ในใจเสมอ"
 childhood.1010.opening:0 "ข้าหยุดคิดถึง[crush.GetTitledFirstName]ไม่ได้เลย ทั้งรอยยิ้มและวิธีพูดของ[crush.GetSheHe]\n\n"
 childhood.1010.returned:0 "เพียงแค่รู้ว่าความรู้สึกของข้าได้รับการตอบสนองก็นำความสุขมาให้ข้าและ ทำให้ใจข้าสงบ"
 childhood.1010.not_returned:0 "ความจริงที่ว่า[crush.GetSheHe]ดูเหมือนจะไม่ตอบสนองความรู้สึกของข้า ทำให้ใจข้าหนักอึ้ง"
 childhood.1010.a:1 "[crush.GetTitledFirstNameNoTooltip] ที่รักของข้า!"
 childhood.1010.b:0 "โอ้ อนิจจา!"
 childhood.1010.c:0 "ความรักคือเรื่องโกหก... #EMP เรื่องโกหก!#!"
 childhood.1010.d:0 "[crush.GetFirstNameNoTooltip] ข้าเอา[ROOT.Char.Custom('SeductionGiftTypeIndefiniteSimple')]มาให้เจ้า!"
 childhood.1010.d.effect:0 "ของขวัญอีกชิ้นอาจ ทำให้ใจของ[crush.GetHerHis]ละลาย... หรือทำลายใจของท่านอีกครั้ง"
 childhood.1010.e:0 "โอ้ หัวใจของข้าเต้นระรัวด้วยความยินดีและปรีดาเมื่อเห็นเจ้า!"
 hopeless_romantic_modifier:0 "โรแมนติกสิ้นหวัง"
 hopeless_romantic_modifier_desc:0 "ตัวละครนี้เชื่อมั่นในความโรแมนติกและความรักแบบอัศวินอย่างแรงกล้า และเป็น เช่นนั้นมาตั้งแต่อายุยังน้อย\n[GetScheme('courting').GetTypeName] [success_chance|E]: #P +10%#!"

 childhood.1011.t:0 "วิถีแห่งหัวใจ"
 childhood.1011.opening:0 "ข้าสังเกตเห็นว่า[crush_returned.GetTitledFirstName]ให้ความสนใจข้าเป็นพิเศษเมื่อเร็วๆ นี้ ชื่นชมทั้งมุกตลกและความคิดเห็นของข้า\n\n"
 childhood.1011.returned:1 "รู้สึกดีที่ได้รับการชื่นชม เช่นนี้ และมัน ทำให้ข้าตระหนักว่า[crush_returned.GetFirstNameNoTooltip]น่ารักเพียงใด\n\nอันที่จริงข้าคิดว่าข้าอาจจะสนใจ[crush_returned.GetHerHim]เท่าๆ กับที่[crush_returned.GetSheHe]สนใจข้า!"
 childhood.1011.not_returned:0 "แม้ว่าการชื่นชมจะดี แต่มันก็เริ่มน่ารำคาญ ทำไม[crush_returned.GetSheHe]ไม่ปล่อยข้าไปตามลำพัง?"
 childhood.1011.a:1 "[crush_returned.GetFirstNameNoTooltip] ข้าคิดว่าข้าชอบเจ้า"
 childhood.1011.b:0 "[crush_returned.GetSheHe|U] กำลัง ทำให้ข้าหงุดหงิด"
 childhood.1011.c:0 "ไม่ หัวใจของข้าเป็นของ[true_crush.GetFirstNameNoTooltip]!"
 heartbroken_opinion:0 "ใจสลาย"

 childhood.1012.t:0 "การลงโทษที่รุนแรง"
 childhood.1012.desc:0 "ข้ารู้ว่าข้ากำลังมีปัญหากับการเรียนเมื่อเร็วๆ นี้ และข้ารู้ว่า[guardian_parent.Custom('MotherFather')]ของข้าผิดหวังในตัวข้า สิ่งที่ข้าไม่เคยคาดคิดคือ[guardian_parent.GetHerHim]จะถึงขั้นเอาของเล่นสุดโปรดของข้า [ROOT.Char.Custom('child_favorite_toy')]สุดที่รักของข้า ไปจากข้า!\n\n"
 childhood.1012.desc_2:0 ""โยนเข้าเตาผิงไปเลย" [guardian_parent.Custom('MotherFather')|U] กล่าว พลางโยนมันเข้าไปในเปลวไฟ "ทีนี้บางทีเจ้าอาจจะพิจารณาใหม่เรื่องการเป็น[ROOT.Char.Custom('GetDaughterSon')]ที่ไร้ค่า เช่นนี้"\n\n"
 childhood.1012.desc2:0 "สิ่งที่แย่ที่สุดคือ[guardian_parent.GetSheHe]ดูเหมือนจะไม่แยแสต่อความทุกข์ของข้า"
 childhood.1012.desc3:0 "สิ่งที่แย่ที่สุดคือ[guardian_parent.GetSheHe]ดูเหมือนจะสนุกกับความทุกข์ของข้า"
 childhood.1012.a:0 "[guardian_parent.GetSheHe|U] ช่างโหดร้ายนัก!"
 childhood.1012.b:0 "ทำ... ทำ#EMP ได้อย่างไร!#! ข้าเกลียดท่าน!"
 cruel_upbringing_modifier:0 "การเลี้ยงดูที่โหดร้าย"
 cruel_upbringing_modifier_desc:0 "ตัวละครนี้ถูกเลี้ยงดูมาด้วยความไม่ไว้วางใจและความโหดร้าย"

 childhood.1013.t:0 "การทำลาย[victim.Custom('child_favorite_toy')|U]"
 childhood.1013.desc:0 "ข้าพบ[ROOT.GetCharacter.Custom2('RelationToMe' , SCOPE.sC('victim'))]ของข้า [victim.GetFirstName] กำลังเล่นกับ[victim.Custom('child_favorite_toy')]ของ[victim.GetHerHis]ในสวน ส่งเสียงโห่ร้องและหัวเราะ\n\n[victim.GetSheHe|U] ไม่มีสิทธิ์ที่จะมีความสุขขนาดนั้น และมีอะไรพิเศษเกี่ยวกับ[victim.Custom('child_favorite_toy')]โง่ๆ นั่นกันแน่? มันแตกเหมือนของเก่าๆ ทั่วไปเมื่อข้าคว้ามันมาจากมือของ[victim.GetHerHis]และทุบมัน"
 childhood.1013.a:0 "ท่านน่าจะได้เห็นสีหน้าของ[victim.GetHerHis]!"
 childhood.1013.b:0 "ข้า... ข้าไม่อยากเชื่อในสิ่งที่ข้าทำลงไป... ข้าเป็น#EMP [ROOT.Char.Custom('GirlBoy')]ที่แย่!#!"

 childhood.1014.t:0 "การทำลาย[ROOT.Char.Custom('child_favorite_toy')|U]"
 childhood.1014.desc:0 "[bully.GetTitledFirstName] ผู้ทรมานข้าอย่างต่อเนื่อง ได้ทำลาย[ROOT.Char.Custom('child_favorite_toy')]อันล้ำค่าของข้า! ขณะที่ข้ากำลังเล่น [bully.GetSheHe]เดินเข้ามาหาข้าอย่างใจเย็นและคว้าของเล่นไปจากมือข้า กระทืบมันลงกับพื้น\n\n"ใครกันที่ยังเล่นกับ[ROOT.Char.Custom('child_favorite_toy')]ตอนนี้?""
 childhood.1014.a:0 "[bully.GetSheHe|U] น่ากลัวมาก!"

 childhood.1015.t:0 "การแก้ปัญหาทางการทูต"
 childhood.1015.desc:1 "ตามคำยืนกรานของ[educator.GetTitledFirstName] [ROOT.GetCharacter.Custom2('RelationToMe' , SCOPE.sC('study_friend'))]ของข้า [study_friend.GetFirstName] และข้าได้ติดตามการเจรจาที่กำลังดำเนินอยู่เกี่ยวกับการมีส่วนร่วมของราชวงศ์ในการบริหารท้องถิ่นของ[province.GetName]\n\nในระหว่างการหารือ ข้าอดไม่ได้ที่จะสังเกตเห็นว่า[province_holder.GetTitledFirstName]ไม่รู้เรื่องเกี่ยวกับการประสานงานความพยายามดังกล่าวเลย และ เนื่องจากข้าได้ศึกษาเรื่องนี้มาระยะหนึ่งแล้ว ข้าควรจะเข้าไปแทรกแซง"
 childhood.1015.a:0 ""ถ้าท่านจะฟังข้าสักครู่...""
 childhood.1015.b:1 "ข้ามีอะไรต้องเรียนรู้อีกมาก – ข้าควรจะฟัง"
 childhood.1015.b.tt:2 "สิ่งนี้จะส่งเสริมการศึกษาทั้งของ[study_friend.GetFirstNamePossessiveNoTooltip]และของท่านในด้าน[diplomacy|E]"
 childhood.1015.a.flavor:0 "ทำไมพวกเขาถึงหัวเราะ? ความคิดของข้า#MP ยอดเยี่ยม!#!"

 childhood.1016.t:0 "เรื่องการทหาร"
 childhood.1016.desc:0 "[ROOT.GetCharacter.Custom2('RelationToMe' , SCOPE.sC('study_friend'))]ของข้า [study_friend.GetFirstName] และข้ากำลังดูกองทหารทำการรบจำลองนอกเมือง ซึ่งเป็นส่วนหนึ่งของการศึกษาของเรา\n\n"ตอนนี้ วนไปโจมตีปีกของพวกมัน!" [commander.GetTitledFirstName] ตะโกน และก่อนที่ข้าจะรู้ตัว ข้าก็ได้ก้าวไปข้างหน้าและดึงดูดความสนใจของ[commander.GetHerHis]"
 childhood.1016.a:0 ""อันที่จริง ข้าคิดว่าการโจมตีโดยตรงจะได้ผลดีกว่า""
 childhood.1016.b:1 "ข้าโบกมือให้[commander.GetHerHim] – ข้าควรจะดูเฉยๆ"
 childhood.1016.b.tt:1 "สิ่งนี้จะส่งเสริมการศึกษาทั้งของ[study_friend.GetFirstNamePossessiveNoTooltip]และของท่านในด้าน[martial|E]"

 childhood.1017.t:0 "เรื่องเกี่ยวกับธัญพืช"
 childhood.1017.desc:2 "การเจรจากับ[province_holder.GetTitledFirstName]แห่ง[province.GetName]เกี่ยวกับการจัดการธัญพืชของพื้นที่ดำเนินมาหลายชั่วโมงแล้ว [ROOT.GetCharacter.Custom2('RelationToMe' , SCOPE.sC('study_friend'))]ของข้า [study_friend.GetFirstName] เหลือบมองมาทางข้าในช่วงครึ่งชั่วโมงที่ผ่านมา ทำให้ข้ารู้ว่าข้าไม่ได้อยู่ในความทุกข์นี้เพียงลำพัง\n\nขณะที่ทุกคนออกจากห้องประชุมเพื่อพักผ่อน ข้าเห็นบัญชีแยกประเภทเปิดอยู่บนโต๊ะของ[province_holder.GetTitledFirstNamePossessive] บันทึกเกี่ยวกับการจัดการข้าวสาลีถูกขีดเขียนไว้ทั่วหน้า และด้วยการเปลี่ยนแปลงเล็กน้อย ข้าอาจส่งผลกระทบอย่างรุนแรงต่อการผลิตของพื้นที่"
 childhood.1017.a:1 "ข้าสงสัยว่าการเปลี่ยนตัวเลขเหล่านี้จะทำอะไรได้บ้าง?"
 childhood.1017.a.tt:1 "บางครั้งท่านเรียนรู้จากการทำผิดพลาด – สิ่งนี้จะส่งเสริมการศึกษาทั้งของ[study_friend.GetFirstNamePossessiveNoTooltip]และของท่านในด้าน[stewardship|E]"
 childhood.1017.b:0 "ปล่อยไว้อย่างนั้นดีกว่า"

 childhood.1018.t:0 "เหตุการณ์น่าสนใจ"
 childhood.1018.desc:0 "หากมีสิ่งหนึ่งที่[educator.GetTitledFirstName]พยายามปลูกฝังในตัวข้า ก็คือบางครั้งการโกหกก็จำเป็น\n\nขณะที่[ROOT.GetCharacter.Custom2('RelationToMe' , SCOPE.sC('study_friend'))]ของข้า [study_friend.GetFirstName] และข้าได้ยิน[province_holder.GetTitledFirstName]แห่ง[province.GetName]พูดถึงการปลอมแปลงตัวเลขในรายงานภาษีของ[province_holder.GetHerHis]เพื่ออาจ ทำให้พื้นที่เจริญรุ่งเรือง ข้าพบว่าตัวเองกำลังคิดถึงบทเรียนของ[educator.GetFirstNamePossessive]"
 childhood.1018.a:2 "ข้อมูลนี้ต้องไปถึง[educator.GetFirstNameNoTooltip]!"
 childhood.1018.a.tt:2 "สิ่งนี้จะส่งเสริมการศึกษาทั้งของ[study_friend.GetFirstNamePossessiveNoTooltip]และของท่านในด้าน[intrigue|E]"
 childhood.1018.b:0 "พวกเขา#EMP ต้องการ#! เงินพิเศษนั้นจริงๆ"

 childhood.1019.t:0 "จะอ่านหรือไม่ควรอ่าน"
 childhood.1019.desc:0 "[ROOT.GetCharacter.Custom2('RelationToMe' , SCOPE.sC('study_friend'))]ของข้า [study_friend.GetFirstName] และข้าได้รับมอบหมายให้นำส่งกองหนังสือให้กับผู้แทนจาก[province.GetName] ความอยากที่จะใช้เวลาสักสองสามนาที หรือสองสามวันเพื่อศึกษามันนั้นแทบจะต้านทานไม่ได้\n\nการที่การส่งมอบหนังสืออย่างรวดเร็วมีความสำคัญอย่างยิ่งต่อผลผลิตอย่างต่อเนื่องของพื้นที่นั้นยิ่งเพิ่มความอยากรู้อยากเห็นของเรา"
 childhood.1019.a:1 "เราจะ ทำให้แน่ใจว่าหนังสือได้รับการศึกษา#EMP อย่างละเอียดถี่ถ้วน#!"
 childhood.1019.a.tt1:1 "สิ่งนี้จะส่งเสริมการศึกษาทั้งของ[study_friend.GetFirstNamePossessiveNoTooltip]และของท่านในด้าน[learning|E]"
 childhood.1019.a.tt2:1 "สิ่งนี้จะส่งเสริมการศึกษาทั้งของ[study_friend.GetFirstNamePossessiveNoTooltip]และของท่านในด้าน[stewardship|E]"
 childhood.1019.b:1 "หนังสือจะไปถึงจุดหมายปลายทางตรงเวลา!"


 childhood.2001.t:0 "ลูกแมว"
 childhood.2001.desc_educator:0 "ขณะที่ข้ากำลังเล่นอยู่ภายใต้การดูแลของ[educator.GetTitledFirstNamePossessive] ทันใดนั้นข้าก็ได้ยินเสียง มันเล็กและอ่อนแอ แต่มันอยู่ที่นั่น!"
 childhood.2001.desc:0 "ขณะที่ข้ากำลังเล่นอยู่ใกล้[ROOT.Char.Custom('TerrainType')] ทันใดนั้นข้าก็ได้ยินเสียง มันเล็กและอ่อนแอ แต่มันอยู่ที่นั่น!"
 childhood.2001.desc_ending:0 "\n\nข้ามองหาทุกพุ่มไม้ ใต้ทุกก้อนหิน ในทุกทิศทาง และ... นั่นไง! ลูกแมวตัวเล็กๆ กำลังนั่งอยู่ใต้พุ่มไม้หนาม ตามลำพัง"
 childhood.2001.a:0 "ตอนนี้มันเป็นแมวของข้าแล้ว!"
 childhood.2001.b:0 "[educator.GetTitledFirstNameNoTooltip] ดูเหงาบางครั้ง..."
 childhood.2001.c:0 "ข้าสงสัยว่ามันซ่อนอะไรไว้ข้างใน...!"
 gift_of_cat_opinion:0 "ได้รับของขวัญเป็นแมว"
 gift_of_dog_opinion:0 "ได้รับของขวัญเป็นสุนัข"

 childhood.2002.desc:1 "ข้าอยู่ข้างนอกกับ[ward.GetTitledFirstName] ขณะที่[ward.GetSheHe]หายตัวไปทันที แต่ก่อนที่ข้าจะมีเวลาต้องกังวลจริงๆ [ward.GetSheHe]ก็วิ่งกลับมา อุ้มลูกแมวตัวเล็กๆ ไว้ในมือของ[ward.GetHerHis]!\n\n"[educator.GetFirstNameNoTooltip], [educator.GetFirstNameNoTooltip]! ดูสิว่าข้าเจออะไร มันเป็นของขวัญสำหรับท่าน!""
 childhood.2002.a:0 "ขอบคุณ!"
 childhood.2002.b:0 "อี๋ เอาไปคืนที่ที่เจ้าเจอมา"
 childhood.2002.c:0 "โอ้ เจ้าเจอของขวัญ#EMP ของข้า#! สำหรับ#EMP เจ้า#!! แล้วเราจะจัดการกับหนี้สินอย่างไร?"
 childhood.2002.d:0 "ในที่สุด ก็มีอะไรให้ทรมาน!"

 childhood.2003.t:0 "ลูกสุนัข"
 childhood.2003.desc_educator:0 "ข้ากำลังเดินเล่นกับ[educator.GetTitledFirstName]เมื่อข้าได้ยินเสียงนั้น มันเป็นเสียงเล็กๆ อ่อนแอและหวาดกลัว"
 childhood.2003.desc_friend:0 "ข้ากำลังเล่นกับ[friend.GetTitledFirstName]เมื่อข้าได้ยินเสียงนั้น มันเป็นเสียงเล็กๆ อ่อนแอและหวาดกลัว"
 childhood.2003.desc:0 "ข้ากำลังเล่นอยู่เมื่อข้าได้ยินเสียงนั้น มันเป็นเสียงเล็กๆ อ่อนแอและหวาดกลัว"
 childhood.2003.desc_ending:0 "\n\nข้ามองหาไปทั่ว – ใต้ทุกก้อนหิน รอบทุกมุม หลังทุกพุ่มไม้ – และในที่สุดข้าก็เจอมัน! ลูกสุนัขตัวเล็กๆ ตามลำพัง นั่งอยู่ระหว่างก้อนหินสองก้อน"
 childhood.2003.a:0 "ตอนนี้มันเป็นหมาของข้าแล้ว!"
 childhood.2003.b:1 "นี่ [friend.GetFirstNameNoTooltip] เอามันไป"
 childhood.2003.c:0 "[educator.GetTitledFirstNameNoTooltip] ดูเหงาบางครั้ง..."
 childhood.2003.d:0 "ข้าสงสัยว่ามันซ่อนอะไรไว้ข้างใน...!"

 childhood.2004.desc:1 "ข้าอยู่ข้างนอกกับ[ward.GetTitledFirstName] ขณะที่[ward.GetSheHe]หายตัวไปทันที แต่ก่อนที่ข้าจะมีเวลาต้องกังวลจริงๆ [ward.GetSheHe]ก็วิ่งกลับมา อุ้มลูกสุนัขตัวเล็กๆ ไว้ในมือของ[ward.GetHerHis]!\n\n"[educator.GetFirstNameNoTooltip], [educator.GetFirstNameNoTooltip]! ดูสิว่าข้าเจออะไร มันเป็นของขวัญสำหรับท่าน!"

 childhood.2005.desc:0 "ข้ากำลังเล่นกับ[ward.GetTitledFirstName]เมื่อ[ward.GetSheHe]หายตัวเข้าไปใน[ROOT.Char.Custom('TerrainType')]ทันที [ward.getSheHe]ไปไหน? ข้าหมุนตัวเป็นวงกลม มองหา และทันใดนั้น[ward.GetSheHe]ก็ปรากฏตัวขึ้นอีกครั้ง ยื่นลูกสุนัขตัวเล็กๆ มาทางข้า\n\n"[friend.GetFirstNameNoTooltip]! มันสำหรับเจ้า!""
 childhood.2005.a:0 "ลูกหมา!!!"
 childhood.2005.b:0 "อี๋ เอามันออกไป"

 childhood.2006.desc:0 "ข้ากำลังเล่นกับ[ward.GetTitledFirstName]เมื่อ[ward.GetSheHe]หายตัวเข้าไปใน[ROOT.Char.Custom('TerrainType')]ทันที [ward.getSheHe]ไปไหน? ข้าหมุนตัวเป็นวงกลม มองหา และทันใดนั้น[ward.GetSheHe]ก็ปรากฏตัวขึ้นอีกครั้ง ยื่นลูกแมวตัวเล็กๆ มาทางข้า\n\n"[friend.GetFirstNameNoTooltip]! มันสำหรับเจ้า!""
 childhood.2006.a:0 "ลูกแมว!!!"
 childhood.2006.b:0 "อี๋ เอามันออกไป"

 childhood.2010.t:0 "ความคาดหวัง"
 childhood.2010.desc_opening:0 ""ท่านอยู่เคียงข้างข้าเสมอ และข้าหวังว่าท่านจะรู้ว่าข้าขอบคุณ"\n\n"
 childhood.2010.desc_shy:0 "[ward.Custom2('MyCharacterIntroduction', ROOT.Char)|U] เข้ามาหาข้าในการแสดงความกล้าหาญและเปิดเผยที่หาได้ยาก"
 childhood.2010.desc_mean:0 "[ward.Custom2('MyCharacterIntroduction', ROOT.Char)|U] เข้ามาหาข้าในการแสดงความซื่อสัตย์ที่หาได้ยาก"
 childhood.2010.desc_proud:0 "[ward.Custom2('MyCharacterIntroduction', ROOT.Char)|U] เข้ามาหาข้าในการแสดงความขอบคุณที่หาได้ยาก"
 childhood.2010.desc_fallback:0 "[ward.Custom2('MyCharacterIntroduction', ROOT.Char)|U] เข้ามาหาข้าในช่วงเวลาแห่งการใคร่ครวญที่หาได้ยาก"
 childhood.2010.a:0 "เมื่อข้าต้องการ ข้าคาดหวังให้ท่านอยู่เคียงข้างข้า เช่นกัน"
 childhood.2010.b:0 "นั่นคือความหมายของการเป็นผู้ปกครอง"

 childhood.2011.desc:0 "[guardian.Custom2('MyCharacterIntroduction', ROOT.Char)|U] ทำงานหนักเป็นพิเศษในการศึกษาของข้าเมื่อเร็วๆ นี้ ข้าขอบคุณ แต่[guardian.GetSheHe]ก็ ทำให้ชัดเจนว่าข้าถูกคาดหวังให้ตอบแทนการทำงานหนักของ[guardian.GetHerHis]ในอนาคต มันเป็นสิ่งที่ต้องทำ ข้ามั่นใจว่า[guardian.GetSheHe]ถูกต้อง"
 childhood.2011.tt:0 "สิ่งนี้ส่งเสริมการศึกษาของท่านเล็กน้อย"
 childhood.2011.a:0 "อย่างไรเสีย[guardian.GetSheHe|U]ก็เป็นครูของข้า"

 childhood.2100.t:0 "ภ คือ ภาษา"
 childhood.2100.desc:1 "ผู้ปกครองของข้า [educator.GetTitledFirstName] สอนข้าอย่างดี บางครั้งข้าได้ยิน[educator.GetHerHim]พูดภาษา[educator.GetCulture.GetLanguage.GetNameNoTooltip] — ข้าคิดว่าเป็นภาษาที่[educator.GetSheHe]พูดที่บ้าน\n\nแม้ว่า[educator.GetSheHe]ส่วนใหญ่จะพูดภาษา[ROOT.Char.GetCulture.GetLanguage.GetNameNoTooltip]กับข้า [educator.GetSheHe]ก็พยายามสอนภาษาแม่ของ[educator.GetHerHis]ให้ข้าบ้าง\n\nการจำสองภาษาในหัวนั้นยาก... แต่บางทีมันอาจจะคุ้มค่ากับความพยายาม?"
 childhood.2100.a:0 "ข้าควรจะฟังและตั้งใจ บางทีข้าอาจจะเรียนรู้?"
 childhood.2100.b_hash:0 "ไม่ล่ะ ข้าอยากไปเล่นมากกว่า!"
 learn_language_ongoing.2100.a.success:0 "ท่านเรียนรู้ภาษาของ[educator.GetFirstNamePossessiveNoTooltip]"
 learn_language_ongoing.2100.a.success_parent:0 "[ward.Custom('GetDaughterSon')|U] เรียนรู้ภาษา!"
 learn_language_ongoing.2100.a.success_parent_desc:0 "[educator.GetFirstNamePossessiveNoTooltip] สอน[ward.GetFirstName]ภาษา[educator.GetCulture.GetLanguage.GetName] [language|E]"
 learn_language_ongoing.2100.a.failure:0 "ท่านล้มเหลวในการเรียนรู้ภาษาของ[educator.GetFirstNamePossessiveNoTooltip]"

 childhood.2200.t:0 "ท่านพูดภาษาของข้าหรือไม่?"
 childhood.2200.desc:0 "ขณะที่ข้าติดตาม[educator.GetNameNoTooltip] ข้าพบว่า[educator.GetHerHim]พูดภาษาของราชสำนักรอบตัวข้า และข้าเริ่มเข้าใจมันอย่างน่าประหลาด หากข้าพยายาม ข้าอาจจะเชี่ยวชาญในภาษาของราชสำนักของเรา!"
 childhood.2200.a:0 "ข้าพูดได้เหมือนผู้ใหญ่เลย!"
 childhood.2200.b:2 "ช่างน่าเบื่อหน่าย, พูด[ROOT.Char.GetCulture.GetLanguage.GetNameNoTooltip]เถิด!"

 childhood.2300.t:0 "ภาษาในสายตระกูลของข้า"
 childhood.2300.desc:0 "[ROOT.GetCharacter.Custom2('RelationToMeShort', SCOPE.sC('parent'))]ของข้าแทรกคำภาษา[parent.GetCulture.GetLanguage.GetName]เป็นครั้งคราว และข้าพบว่าตัวเองเข้าใจภาษาได้ดีขึ้น ข้ามั่นใจว่าหากข้าพยายาม ข้าอาจจะเชี่ยวชาญพอที่จะพูดคุยกับ[ROOT.GetCharacter.Custom2('RelationToMeShort', SCOPE.sC('parent'))]ในรูปแบบใหม่!"
 childhood.2300.a:0 "ข้าพูดได้เหมือน[parent.Custom('GetMamaPapa')]เลย!"
 childhood.2300.b:0 "นี่มันน่าเบื่อ! ทำไมต้องเรียนภาษา[parent.GetCulture.GetLanguage.GetNameNoTooltip]ด้วย!?"
 childhood.2300.a.success_parent_desc:2 "[ward.GetFirstName] เรียนรู้ภาษา[parent.GetCulture.GetLanguage.GetName] [language|E] ผ่านการสังเกต"

 childhood.2400.t:0 "ยุคแห่งเหตุผล"
 childhood.2400.desc:0 "การให้การศึกษาแก่[questioning_ward.GetFirstName]นั้นคุ้มค่า แต่ก็ไม่ง่ายเสมอไป วันนี้[questioning_ward.GetSheHe]ต้องการ "ถามคำถามง่ายๆ เกี่ยวกับ[ROOT.Char.GetFaith.GetName]" แต่ในไม่ช้าคำถามของ[questioning_ward.GetHerHis]ก็ลุกลามกลายเป็นความสงสัยอย่างรุนแรงต่อศรัทธาของเรา\n\n[questioning_ward.GetFirstNameNoTooltip] กำลัง#EMP ตั้งคำถาม#! กับ[ROOT.Char.GetFaith.GetNameNoTooltip]อยู่หรือเปล่า?"
 childhood.2400.a.neutral:0 "ให้ข้าคลายความสงสัยของเจ้า"
 childhood.2400.a.zealous:0 "ข้าจะลบความสงสัยเหล่านี้ออกจากใจเจ้า"
 childhood.2400.a.toast.succ:0 "[questioning_ward.GetTitledFirstName] เชื่อมั่นในศรัทธาของท่าน"
 childhood.2400.a.toast.fail:0 "[questioning_ward.GetTitledFirstName] ยังคงมีความสงสัยของ[questioning_ward.GetHerHis]"
 childhood.2400.b:0 "[ROOT.Char.Custom2('RelationToMe', SCOPE.sC('realm_priest'))|U] [realm_priest.GetFirstNameNoTooltip] สามารถตอบคำถามเหล่านี้ได้ดียิ่งกว่า"
 childhood.2400.b.toast.succ:0 "[ROOT.Char.Custom('MyPriestTitle')|U] [realm_priest.GetFirstName] ได้โน้มน้าว[questioning_ward.GetTitledFirstName]"
 childhood.2400.b.toast.fail:0 "[ROOT.Char.Custom('MyPriestTitle')|U] [realm_priest.GetFirstName] ไม่สามารถโน้มน้าว[questioning_ward.GetTitledFirstName]ได้"
 childhood.2400.c:0 "เจ้า#EMP ก็#! มีเหตุผล..."
 childhood.2400.d:0 "เจ้าผิดที่บอกเรื่องนี้กับข้า [questioning_ward.GetFirstNameNoTooltip]"

 childhood.2410.desc.intro:0 "[questioning_ward.GetFirstNameNoTooltip] ถอนหายใจอย่างโล่งอก เช่นเดียวกับข้า ขณะที่เรา แต่ละคนแบ่งปันความไม่เชื่อของเรา ช่องว่างระหว่าง "
 childhood.2410.desc.parentchild:0 "[ROOT.Char.Custom('MotherFather')] และ [questioning_ward.Custom('GetDaughterSon')]"
 childhood.2410.desc.guardianward:0 "ผู้ปกครองและผู้อยู่ในอุปถัมภ์"
 childhood.2410.desc.outro:0 "ก็แคบลงเล็กน้อย"
 childhood.2410.a:0 "นี่จะเป็นความลับของเรา"
