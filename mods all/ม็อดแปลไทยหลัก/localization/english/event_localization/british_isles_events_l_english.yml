 british_isles.1022.t:0 "$british_isles.1011.t$"
 british_isles.1022.desc:0 "ดูเหมือนว่าในการพยายามเสริมสร้างอำนาจส่วนตัวของตนเอง [ntd_actor.GetTitledFirstName] และ [ntd_recipient.GetTitledFirstName] ได้ลงนามในสนธิสัญญาอันชั่วร้าย แบ่งอาณาจักร$k_england$ระหว่างกัน!\n\nนับจากนี้ไป พื้นที่ที่อยู่ภายใต้การควบคุมของชาวนอร์สในปัจจุบันจะอยู่ภายใต้$k_danelaw_article$$k_danelaw$ ในขณะที่รัฐพื้นเมืองที่เหลืออยู่ได้รับการยอมรับว่าเป็นดินแดน$k_england_adj$"
 british_isles.1022.a:0 "นี่คือการทรยศต่อ[dummy_gender.GetWomenMen]ประเทศของพวกเขาอย่างหน้าด้านอะไร เช่นนี้?"
 british_isles.1022.a.tt:0 "$k_england$ และ $k_danelaw_article$$k_danelaw$ จะถูก[de_jure_partitioned|E]"

 british_isles.1051.t:0 "[partition_winner.GetTierAsNameNoTooltip]ที่รวมเป็นหนึ่ง"
 british_isles.1051.desc:0 "ในที่สุด ก็ไม่มีใครสามารถโต้แย้งการปกครองของข้าในฐานะ[victor.GetTitleAsNameNoTooltip]#EMP ที่แท้จริง#!แห่ง[england.GetNameNoTierNoTooltip]ได้ เมื่อจัดการกับรัฐผู้แอบอ้างแล้ว อำนาจสูงสุดของข้าเหนือบริทาเนียทั้งหมดก็เกือบจะแน่นอนแล้ว"
 british_isles.1051.a:0 "หนึ่งอาณาจักร หนึ่ง[victor.GetTitleAsNameNoTooltip]!"
 british_isles.1051.a.tt:0 "[de_jure_partition|E]ระหว่าง$k_england$และ$k_danelaw_article$$k_danelaw$สิ้นสุดลง"

 british_isles.1052.t:0 "$british_isles.1051.t$"
 british_isles.1052.desc:0 "[loser.GetFaith.FateGodName|U]เล่นตลกอันโหดร้ายกับข้าในวันนี้ มอบชัยชนะอย่างเด็ดขาดให้กับ[victor.GetTitledFirstName]ในการต่อสู้เพื่อ$k_england$\n\nแม้ว่าข้าจะไม่สามารถอ้างสิทธิ์ในการปกครองดินแดนที่ข้าเคยทำได้อีกต่อไป แต่เรื่องนี้ยังไม่ยุติ ตราบใดที่สายเลือดของข้ายังคงหายใจอยู่"
 british_isles.1052.a:0 "จะต้อง#EMP มี#!การชำระแค้นสำหรับการดูหมิ่นครั้งนี้"
 british_isles.1052.a.tt:0 "$british_isles.1051.a.tt$"

 british_isles.1053.t:0 "$british_isles.1051.t$"
 british_isles.1053.desc:0 "เหตุการณ์ล่าสุด ทำให้[victor.GetTitledFirstName]เป็นผู้ท้าชิงที่จริงจังเพียงคนเดียวสำหรับบัลลังก์$k_england_adj$ แม้ว่าไม่ใช่ทุกคนที่จะยอมก้มหัวให้กับกษัตริย์ผู้ยินดีปรีดา แต่ก็สามารถกล่าวได้อย่างน้อยว่า$k_england$นั้น โดยจิตวิญญาณแล้ว กลับมาเป็นปึกแผ่นอีกครั้ง"
 british_isles.1053.a:0 "เสถียรภาพสำหรับ$k_england$ในที่สุด?"
 british_isles.1053.a.tt:0 "$british_isles.1051.a.tt$"

 british_isles.1061.t:0 "กฎหมายแห่งแผ่นดิน"
 british_isles.1061.desc:0 "เป็นเวลาหลายปีแล้วที่ชาวสแกนดิเนเวียมาถึงชายฝั่งอันอุดมสมบูรณ์เหล่านี้เป็นครั้งแรก หลายปีแห่งการนองเลือด ความรุนแรง และอารมณ์ที่ปะทะกัน แต่ก็ รวมถึงการแลกเปลี่ยน การพัฒนา และการหลอมรวม\n\nลูกหลานของผู้ตั้งถิ่นฐานกลุ่มแรกเหล่านั้นไม่ใช่ชาวนอร์สอย่างแท้จริงอีกต่อไป และคนท้องถิ่นก็ไม่ใช่$anglo_saxon_collective_noun$คนเดิมเหมือนตอนที่ชาวสแกนดิเนเวียมาถึงครั้งแรก\n\nตอนนี้เราเป็นใครนั้น บางทีอาจยากที่จะกล่าว\n\nเว้น แต่ว่าเราคือทุกคนที่มาก่อนเรา ทั้งดีและร้าย และประวัติศาสตร์ของเราจะเป็น$k_daneland_adj$นับจากนี้ไป"
 british_isles.1061.a:0 "เราจะเขียนมันไปด้วยกัน"

 british_isles.1062.t:0 "$british_isles.1061.t$"
 british_isles.1062.desc:0 "เจ้าสารเลว! เจ้าคนชั่ว! เจ้า [founder.Custom2('InsultAdjective', ROOT.Char)], [founder.Custom2('InsultAdjective', ROOT.Char)] #EMP [founder.Custom2('InsultNoun', ROOT.Char)]!#!\n\nแม้ว่าอาณาจักร $k_england$ และ $k_danelaw_article$$k_danelaw$ จะถูกแบ่งแยกมานานเกินไป #EMP ทุกคน#! ต่างรู้ดีว่า สักวันหนึ่ง ดินแดนทั้งสองจะต้องกลับมารวมกัน\n\nจนกระทั่งวันนี้\n\nในการประกาศอันยิ่งใหญ่และโอ้อวด [founder.GetTitledFirstName] ได้สละสิทธิ์อย่างเป็นทางการในการอ้างสิทธิ์ควบคุม $k_england$ และด้วยเหตุนี้ จึงได้ทำลายความหวังในการรวมอาณาจักรของข้าเข้ากับดินแดน $k_danelaw_article$$k_danelaw$ อย่างง่ายดาย!"
 british_isles.1062.a:0 "ดินแดนของ[founder.GetHerHis|U]เคยเป็น$k_england_adj$มาก่อน และ#EMP จะ#!เป็น$k_england_adj$อีกครั้ง"

 british_isles.1063.t:0 "$british_isles.1061.t$"
 british_isles.1063.desc:0 "เป็นเวลาหลายปีแล้วที่$k_england$ถูกแบ่งแยกระหว่างดินแดนของ[england.GetTitledFirstName] และ[founder.GetTitledFirstName] แม้ว่าทั้งสองจะมีอันดับเท่าเทียมกันในนาม แต่ความเข้าใจโดยปริยายก็คือ แต่ละอาณาจักรต้องการกำจัดอีกฝ่ายและยกระดับกษัตริย์ของตนให้เป็นผู้ปกครองเพียงผู้เดียวของ$k_england$ที่รวมเป็นหนึ่ง\n\nไม่ใช่อีกต่อไป\n\nในรูปแบบที่น่าทึ่ง [founder.GetTitledFirstNameNoTooltip]ได้ประกาศว่า[founder.GetSheHe]กำลังสละสิทธิ์ในการปกครองเหนือส่วนที่เหลือของอาณาจักร และ[founder.GetSheHe]จะปกครองอาณาจักรที่เป็นอิสระและมีอำนาจอธิปไตยต่อไป"
 british_isles.1063.a:0 "บางทีสิ่งนี้อาจจะ ทำให้อารมณ์บางอย่างสงบลง..."
 british_isles.1063.a.tt:0 "$british_isles.1051.a.tt$"
