l_english: 
 bell_special_yearly.1000.t:0 "ระฆังแห่ง[ROOT.Char.GetCapitalLocation.GetTitle.GetNameNoTierNoTooltip]"
 bell_special_yearly.1000.desc:0 "[steward.GetCouncilTitle]ของข้า [steward.GetFirstName] ได้แนะนำให้ข้าสำรวจโบสถ์ร้างใกล้เคียงจากสมัยวิซิกอธ\n\nท่ามกลางเพดานโค้งทรงถังและซุ้มโค้งเกือกม้า มีหอระฆังที่เคยงดงามครั้งหนึ่ง พร้อมระฆังที่ชำรุดหลายใบ ซึ่งไม่มีลูกตุ้มระฆัง\n\nขณะที่ข้าเดินเตร่ไปในซากปรักหักพัง ข้าได้ยินเสียงกีบม้าดังกรอบแกรบ เมื่อมองลอดผ่านรู ข้าเห็น[faction_member_1.GetTitledFirstName] กำลังเข้ามาใกล้ [faction_member_1.GetSheHe] อาจคิดว่าสถานที่แห่งนี้อาจเป็นที่ซ่อนสำหรับกลุ่มกบฏทรยศของเขาหรือไม่?"
 # [faction_member_1_faction.GetName]
 bell_special_yearly.1000.a:0 "ข้าสังหาร [faction_member_1.GetHerHim] ได้โดยไม่มีผู้ใดเห็น!"
 bell_special_yearly.1000.a.tt:0 "ท่านย่องเข้าหา [faction_member_1.GetTitledFirstName] และพยายามสังหาร [faction_member_1.GetHerHim]"
 bell_special_yearly.1000.b:0 "ข้าควรหลบเลี่ยงไปอย่างเงียบเชียบ"

 bell_special_yearly.1500.desc:0 "ข้าซ่อนตัวอยู่ในห้องโถงหน้าโบสถ์ และได้ยินเพียงเสียงหัวใจที่เต้นระรัวด้วยความกระหายเลือดของข้า และเสียงฝีเท้าของ[faction_member_1.GetTitledFirstNamePossessive]\n\nขณะที่[faction_member_1.GetSheHe] ก้าวเข้ามาในห้อง ข้าฟาดศีรษะ[faction_member_1.GetHerHis] ด้วยเศษซากปรักหักพัง และ[faction_member_1.GetSheHe] ก็ล้มลงกับพื้น\n\nขณะที่ข้าฟาดซ้ำแล้วซ้ำเล่า ความคิดชั่ววูบก็เข้ามาบดบังทัศนวิสัยที่ย้อมด้วยเลือดของข้า ความฝันถึงหอระฆังเก่าแก่แห่งนี้ที่ส่งเสียงดนตรีอีกครั้ง โดยมีศีรษะของศัตรูทั้งหมดของข้าเป็นลูกตุ้มระฆัง"
 bell_special_yearly.1500.a:0 "คนโฉดเจ้าปัญหาอีกคน จักเข้าร่วมวงบรรเลงของข้า!"
 bell_special_yearly.1500.a.tt:0 "ท่านเสาะหาเหยื่อรายต่อไป"
 bell_special_yearly.1500.discovery.tt:0 "โอกาสที่ท่านจะถูกค้นพบเพิ่มขึ้น"
 bell_special_yearly.1500.b:0 "ข้าควรกลับบ้านและพักผ่อน"
 bell_special_yearly.1500.b.tt:0 "ท่านหยุดสะสมศีรษะสำหรับระฆัง"

 bell_special_yearly.2000.desc:1 "ข้าเรียกร้องให้ [faction_member_2.GetTitledFirstName] ผู้น่ารังเกียจ มาเยี่ยมเยือน [ROOT.Char.Custom('FortifiedBuilding')] ของข้า และปลอมตัวเป็นนักขับลำ ในชุดปลอมตัว ข้าป่าวประกาศว่า '[ROOT.Char.GetTitledFirstName] มีบัญชาให้ท่านฟังบทประพันธ์ใหม่อันน่าอัศจรรย์ ซึ่งคิดค้นขึ้นที่นี่ในเมืองหลวง!'\n\nเมื่อ [faction_member_2.GetSheHe] เข้ามาข้างใน ข้าบังคับ [faction_member_2.GetHerHim] เข้าไปในห้องตามลำพัง ที่นั่น ข้าบรรเลง #italic cansos#! ที่น่าเบื่อที่สุดเท่าที่ข้าจะทำได้เป็นเวลาหลายชั่วโมง จนกระทั่งเจ้าคนโง่นั่นผล็อยหลับไป\n\nข้าทำงานอย่างรวดเร็ว — ข้ารัดคอศัตรูด้วยสายลูทเส้นหนึ่ง ซ่อนศีรษะ [Select_CString(ROOT.Char.IsFemale,'ไว้ใต้กระโปรง','ไว้ในเสื้อคลุม')] และวิ่งหนีไปตามโถงทางเดินก่อนที่ผู้ใดจะทันกะพริบตา"
 bell_special_yearly.2000.a:0 "ระฆังยังมีศีรษะไม่พอ!"
 bell_special_yearly.2000.b:0 "นี่เป็นอาชญากรรมที่งดงาม — ข้าไม่ควรเสี่ยง ทำให้มันแปดเปื้อน"

#Dropping an organ out of a window
 bell_special_yearly.3000.desc:0 "ข้าได้บังคับให้มีการเยือนอย่างเป็นทางการที่[faction_member_3.Custom('FortifiedBuilding')]ของ[faction_member_3.GetTitledFirstNamePossessive] โดยอ้างว่าพยายามขจัดความตึงเครียดกับกลุ่มกบฏ[faction_member_3.GetHerHis] ในระหว่างการหยุดพักการเจรจา ข้าตรวจสอบห้องดนตรี[faction_member_3.GetHerHis] และขออยู่ตามลำพังเพื่อเล่นดนตรี\n\nห้องดนตรีมีหน้าต่างบานใหญ่อยู่เหนือสวนของ[faction_member_3.Custom('FortifiedBuilding')] — พร้อมออร์แกนท่อขนาดใหญ่ทีเดียวอยู่ข้างๆ ช่วงเวลานี้ช่างสมบูรณ์แบบเกินไป\n\nขณะที่[faction_member_3.GetFirstNameNoTooltip] เดินออกไปใต้หน้าต่างเพื่อหาความสงบสักครู่ ข้าก็ผลักออร์แกน มันเหวี่ยงไปในอากาศ และทับ[faction_member_3.GetHerHim] ที่อยู่ด้านล่าง ข้าหัวเราะคิกคัก รีบไปเก็บศีรษะก่อนที่การตายจะถูกสังเกตเห็น"
 bell_special_yearly.3000.a:0 "ระฆังจะต้องงดงามวิจิตร!"
 bell_special_yearly.3000.b:0 "อุบัติเหตุออร์แกนประหลาดเกิดขึ้นได้ทุกวัน"

#[faction_member_3_faction.GetName]
 bell_special_yearly.4000.desc:0 "ข้านั่งเล่นในสวน เหม่อลอยเล่นกับดอกกุหลาบ เด็ดหัวพวกมันทิ้งทีละดอก\n\nข้าสงสัยว่าจะทำอย่างไรกับหอระฆังของข้า มันถูกลิขิตให้บรรเลงเพลงหรือไม่?"
 bell_special_yearly.4000.desc_discoverer:0 "\n\nขณะที่ข้าครุ่นคิดเรื่องนี้ ข้าสังเกตเห็น [bell_discoverer.GetTitledFirstName] หนึ่งในพวกคนโง่ที่ยังคงโศกเศร้าต่อเหยื่อของการหายตัวไป กำลังจ้องมองข้าอยู่ในสวน ข้าหัวเราะเบาๆ และเกือบจะอยากบอก [bell_discoverer.GetHerHim] ณ ตรงนั้น"
 bell_special_yearly.4000.a:0 "ข้าควรจัดคอนเสิร์ตใหญ่ที่โบสถ์!"
 bell_special_yearly.4000.a.tt:0 "ทุกคนรับรู้ถึงการสังหารของท่าน"
 bell_special_yearly.4000.b:0 "ไม่จำเป็นต้องมีผู้ใดรู้ถึงความบันเทิงส่วนตัวของข้า"
 bell_discovery_success_effect:0 "ระฆังยังคงเป็นความลับ"
 bell_discovery_failure_effect:0 "ระฆังถูกค้นพบ"


 bell_special_yearly.5000.desc:0 "คืนหนึ่งข้าขี่ม้าออกไปเยี่ยมชมระฆังของข้าและดื่มด่ำกับความชั่วร้ายอันรุ่งโรจน์ของมัน ข้าประหลาดใจที่เห็นคบเพลิงวูบไหวอยู่แล้วเมื่อข้าเข้าไปในซากปรักหักพัง\n\nทีแรก ข้านึกว่าวิญญาณของชาววิซิกอธไม่พอใจที่ข้า ทำให้โบสถ์ของพวกเขามัวหมอง แต่แล้ว [bell_discoverer.GetTitledFirstName] ก็ดึงผ้าคลุมศีรษะออก \"ข้ารู้สึกเหมือนได้เดินทางไปยัง [bell_discoverer.GetFaith.NegativeAfterLife] และจะอยู่ที่นั่นไปตลอดชีวิต หลังจากได้เปิดโปงความน่าสะอิดสะเอียนที่เจ้าได้ก่อขึ้น เจ้าจงไปสมทบกับเหยื่อของเจ้าเสียเถิด เจ้าสัตว์ประหลาด!\"\n\nข้ารับรู้ถึงคมเหล็กที่เฉือนผ่านคอเพียงชั่วครู่ แล้วทุกอย่างก็ดับวูบไป"
 bell_special_yearly.5000.a:0 "บรรเลงส่งข้าที [bell_discoverer.GetTitledFirstNameNoTooltip]"


 bell_special_yearly.6000.desc:0 "มีการจัดคอนเสิร์ตในซากปรักหักพังวิซิกอธสำหรับราชสำนักทั้งหมดของข้า โดยสัญญาถึงค่ำคืนแห่งดนตรีในโบสถ์เก่าแก่ใต้แสงเทียน\n\nการแสดงตามปกติโดยนักดนตรีดำเนินไปขณะที่แขกบางคนบ่นเรื่องกลิ่นประหลาด เราเพลิดเพลินกับท่วงทำนองเบาๆ ด้วยขลุ่ยและเครื่องสายที่ดีด และบทเพลงก็โศกเศร้ามากขึ้นเมื่อค่ำคืนดำเนินไป\n\nในช่วงสุดท้าย เหล่าคนรับใช้ทำตามคำสั่งของข้า รีบเร่งไปตีระฆังให้เข้ากับจังหวะเพลงสุดท้าย เสียงกรีดร้องของเหล่าข้าราชสำนักประสานกับเสียงของคณะนักร้องประสานเสียง ขณะที่ทุกคนได้เห็นศีรษะที่สั่นคลอนและส่งเสียงดังกังวานของข้า!"
 bell_special_yearly.6000.a:0 "ช่างเป็นดนตรีที่ไพเราะ!"
 bell_special_yearly.6000.b:0 "พวกเจ้าที่เหลือจักต้องไปสมทบกับพวกมัน หากขัดขืนข้า!"

