l_english: 
 peasant_affair.1001.t:0 "การพบกันอีกครั้งที่ไม่คาดฝัน"
 peasant_affair.1001.desc_opening:0 ""[ROOT.Char.Custom('FormOfAddressForLiege')|U] หัวใจของข้ามิอาจสงบสุขได้จนกว่าจะได้พบท่านอีกครั้ง! นี่ข้าเอง [peasant_character.GetFirstNameNoTooltip] แน่นอนว่าท่านย่อมจำข้าได้ [ROOT.Char.Custom('LoverPetName')] ของข้า?"\n\n"
 peasant_affair.1001.desc_child: "ข้าไม่อยากเชื่อสายตาตนเอง: [peasant_character.GetWomanMan] ผู้งดงามที่ข้าเคยหลงใหลเมื่อหลายจันทราก่อน, [peasant_character.GetMotherFather] ของ [peasant_child.GetTitledFirstName] [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('peasant_child'))] สุดที่รักของข้า, ได้ปรากฏตัวขึ้นที่ [ROOT.Char.Custom('GetCourtType')|l]"
 peasant_affair.1001.desc_their_child: "ข้าไม่อยากเชื่อสายตาตนเอง: [peasant_character.GetWomanMan] ผู้งดงามที่ข้าเคยหลงใหลเมื่อหลายจันทราก่อนได้ปรากฏตัวขึ้นที่ [ROOT.Char.Custom('GetCourtType')|l] ข้างกาย [peasant_character.GetHerHim] คือผู้ที่ดูเหมือนจะเป็น [peasant_child.Custom('GetDaughterSon')] ของ [peasant_character.GetHerHis], และข้าอดไม่ได้ที่จะนึกถึงอายุของ [peasant_child.GetHerHis]..."
 peasant_affair.1001.desc_rakish_night: "ข้าไม่อยากเชื่อสายตาตนเอง: [peasant_character.GetWomanMan] ผู้งดงามที่ข้าเคยหลงใหลเมื่อหลายจันทราก่อนในค่ำคืนอันโลดโผนไร้ขีดจำกัดได้ปรากฏตัวขึ้นที่ [ROOT.Char.Custom('GetCourtType')|l]"
 peasant_affair.1001.desc: "ข้าไม่อยากเชื่อสายตาตนเอง: [peasant_character.GetWomanMan] ผู้งดงามที่ข้าบังเอิญพบเจอภายนอก [ROOT.Char.Custom('FortifiedBuilding')] ของข้าเมื่อหลายจันทราก่อนได้ปรากฏตัวขึ้นที่ [ROOT.Char.Custom('GetCourtType')|l]"
 peasant_affair.1001.a_1: "อยู่ที่นี่เป็นส่วนหนึ่งของ [ROOT.Char.Custom('GetCourtType')|l] ของข้าเถิด, ข้ายืนกราน!"
 peasant_affair.1001.a_2:0 "[peasant_character.GetFirstNameNoTooltip] สินะ? เจ้าพักอยู่ที่นี่ได้ตามสบาย"
 peasant_affair.1001.b:0 "[peasant_child.GetFirstNameNoTooltip] สมควรได้รับ [peasant_character.GetMotherFather] ของ [peasant_child.GetHerHis]..."
 peasant_affair.1001.c:0 "เจ้าจะหาที่พักพิงที่นี่ไม่ได้"

 peasant_affair.2001.t:0 "[peasant_character.GetWomanMan|U] ที่ข้าใฝ่ฝันถึง"
 peasant_affair.2001.desc_opening:0 "ข้าตื่นขึ้นอีกครั้งพร้อมหัวใจที่เต้นระรัวและความเร่าร้อนที่ยังคุกรุ่นอยู่ในกาย\n\n"
 peasant_affair.2001.desc_rakish_night:1 "หลายคืนผ่านไปนับตั้งแต่ข้าร่วมเตียงกับ [peasant_character.GetWomanMan] ผู้งดงามที่ข้าบังเอิญพบเจอระหว่างการท่องราตรีครั้งหนึ่ง, แต่ความปรารถนาของข้ากลับเพิ่มพูนขึ้น..."
 peasant_affair.2001.desc_known_father:1 "หลายคืนผ่านไปนับตั้งแต่ข้าร่วมเตียงกับ [peasant_character.GetTitledFirstName], [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('peasant_character'))] ของข้า, แต่ความปรารถนาของข้ากลับเพิ่มพูนขึ้น..."
 peasant_affair.2001.desc_unknown_peasant:1 "หลายคืนผ่านไปนับตั้งแต่ข้าร่วมเตียงกับ [peasant_character.GetWomanMan] ผู้งดงามที่ข้าบังเอิญพบเจอภายนอก [ROOT.Char.Custom('FortifiedBuilding')] ของข้า, แต่ความปรารถนาของข้ากลับเพิ่มพูนขึ้น..."
 peasant_affair.2001.desc_child:0 "โดยเฉพาะอย่างยิ่งเมื่อ [peasant_child.GetTitledFirstName], [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('peasant_child'))] สุดที่รักของข้า, ผลผลิตจากความสัมพันธ์อันเร่าร้อนของเรา, เป็นเครื่องเตือนใจถึง [peasant_character.GetHerHim] อยู่เสมอ!"
 peasant_affair.2001.a:0 "ข้าต้องตามหา [peasant_character.GetHerHim] ให้พบ!"
 peasant_affair.2001.a.tt:0 "#F เริ่มการค้นหาทันที!#!"
 peasant_affair.2001.b:0 "จะเป็นการดีที่สุดหากข้าลืม [peasant_character.GetHerHim] เสีย"
 peasant_affair.2001.c:0 "ข้าจะไม่หวั่นไหว, นี่คือบททดสอบความตั้งใจมั่นของข้า!"

 peasant_affair.2002.desc_opening:0 ""[ROOT.Char.Custom('FormOfAddressForLiege')|U] พวกเราไม่พบร่องรอยของชาวบ้านที่ท่านให้เราค้นหาเลย ด้วยทรัพยากรที่จำกัดในการกำจัดของข้า มีเพียงเท่านี้ที่ข้าสามารถทำได้..."\n\n"
 peasant_affair.2002.desc_child: "แม้ ในขณะที่ [searching_character.GetTitledFirstName] [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('searching_character'))] ของข้ากำลังโค้งคำนับและประจบประแจง, สายตาของข้าก็จับจ้องไปยังใบหน้าที่อยากรู้อยากเห็นของ [peasant_child.GetTitledFirstName] [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('peasant_child'))] ของข้า"
 peasant_affair.2002.desc: "แม้ ในขณะที่ [searching_character.GetTitledFirstName] [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('searching_character'))] ของข้ากำลังโค้งคำนับและประจบประแจง, ความคิดของข้าก็ล่องลอยไปถึงค่ำคืนอันน่าอัศจรรย์นั้น..."
 peasant_affair.2002.a:0 "ข้าต้องได้ [peasant_character.GetHerHim] มา, ไม่ว่าจะต้องแลกด้วยอะไรก็ตาม!"
 peasant_affair.2002.b:0 "แน่นอนว่าไม่มีไพร่คนใดควรค่าแก่การลงทุนถึงเพียงนี้"

 peasant_affair.2003.desc_opening:0 ""[ROOT.Char.Custom('FormOfAddressForLiege')|U] ข้านำตัว [peasant_character.GetTitledFirstName] มาเสนอต่อท่าน ตามที่ท่านยืนกราน"\n\n"
 peasant_affair.2003.desc_dead_brought_child:0 ""[ROOT.Char.Custom('FormOfAddressForLiege')|U] ข้านำข่าวมาแจ้ง [peasant_character.GetWomanMan] ที่ท่านให้เราตามหาได้จากโลกนี้ไปอย่างน่าเศร้าแล้ว แต่เราได้นำตัว [peasant_child.Custom('GetDaughterSon')] ของ [peasant_character.GetHerHis] มาให้ท่าน"\n\nช่างเป็นเรื่องตลกร้ายอะไร เช่นนี้ ที่ได้พบ [peasant_character.GetHerHim] ในที่สุดเพียงเพื่อจะสูญเสีย [peasant_character.GetHerHim] ไปตลอดกาล! แต่ [peasant_child.Custom('GirlBoy')] ผู้นั้น [peasant_child.GetSheHe] อาจเป็นลูกของข้า...?"
 peasant_affair.2003.desc_dead: ""[ROOT.Char.Custom('FormOfAddressForLiege')|U] ข้านำข่าวมาแจ้ง [peasant_character.GetWomanMan] ที่ท่านให้เราตามหาได้จากโลกนี้ไปอย่างน่าเศร้าแล้ว"\n\nช่างเป็นเรื่องตลกร้ายอะไร เช่นนี้ ที่ได้พบ [peasant_character.GetHerHim] ในที่สุดเพียงเพื่อจะสูญเสีย [peasant_character.GetHerHim] ไปตลอดกาล!"
 peasant_affair.2003.desc_dislike: "ชาวนา[peasant_character.GetWomanMan] ในฝันของข้าต่อสู้กับการจับกุมของ[searching_character.GetTitledFirstNamePossessive] ใบหน้า[peasant_character.GetHerHis] บิดเบี้ยวด้วยความโกรธและความกลัว\n\n"ได้โปรดเถิด ท่าน[ROOT.Char.GetLadyLord] ปล่อยข้าไป! คืนนั้นเป็นความผิดพลาด ข้าเพียงต้องการอยู่ตามลำพัง""
 peasant_affair.2003.desc_dislike_their_child: "[peasant_character.GetWomanMan] ชาวบ้านในฝันของข้าดิ้นรนต่อสู้การจับกุมของ [searching_character.GetTitledFirstNamePossessive] ใบหน้าของ [peasant_character.GetHerHis] บิดเบี้ยวด้วยความโกรธและความกลัว ขณะที่ [peasant_character.GetSheHe] กอดรัด [peasant_child.Custom('GetDaughterSon')] ของ [peasant_character.GetHerHis] ไว้แนบกาย\n\n"ได้โปรดเถิด [ROOT.Char.Custom('FormOfAddressForLiege')] ปล่อยเราไป! ข้าเพียงปรารถนาที่จะเลี้ยงดู [peasant_child.Custom('GetDaughterSon')] #EMP ของข้า#! แต่เพียงลำพัง""
 peasant_affair.2003.desc_their_child:0 "ในที่สุด! ขณะที่ [peasant_character.GetSheHe] ยืนอยู่เบื้องหน้าข้า ข้ารู้สึกราวกับว่าช่วงเวลาที่เราเคยมีร่วมกันไม่เคยสิ้นสุดลง อย่างไรก็ตาม, ข้างกาย [peasant_character.GetHerHim] คือผู้ที่ดูเหมือนจะเป็น [peasant_child.Custom('GetDaughterSon')] ของ [peasant_character.GetHerHis], และข้าอดไม่ได้ที่จะนึกถึงอายุของ [peasant_child.GetHerHis]..."
 peasant_affair.2003.desc:0 "ในที่สุด! ขณะที่ [peasant_character.GetSheHe] ยืนอยู่เบื้องหน้าข้า ข้ารู้สึกราวกับว่าช่วงเวลาที่เราเคยมีร่วมกันไม่เคยสิ้นสุดลง ดูจากรอยยิ้มอันอบอุ่นของ [peasant_character.GetHerHis] แล้ว [peasant_character.GetSheHe] ก็ยังไม่ลืมข้า เช่นกัน"
 peasant_affair.2003.a_alive: "ได้โปรด [peasant_character.GetFirstNameNoTooltip], อยู่ที่นี่ที่ [ROOT.Char.Custom('GetCourtType')|l] เถิด"
 peasant_affair.2003.a_dead: "ได้โปรด [peasant_child.GetFirstNameNoTooltip], อยู่ที่นี่ที่ [ROOT.Char.Custom('GetCourtType')|l] เถิด"
 peasant_affair.2003.b:0 "[peasant_child.GetFirstNameNoTooltip], ลูกข้า, ข้าอยากให้เจ้าพบกับ [peasant_character.GetMotherFather] ของเจ้า"
 peasant_affair.2003.c:0 "ในที่สุดเจ้าก็มาถึง... กักตัว [peasant_character.GetWomanMan] ผู้นั้นไว้!"
 peasant_affair.2003.c.tt:0 "#F [peasant_character.GetWomanMan] ที่มีอำนาจต่อรองกับข้าเช่นนี้จะปล่อยให้เดินอิสระไม่ได้!#!"
 peasant_affair.2003.d:0 "ส่งเด็กนั่นไปเสีย!"
 peasant_affair.2003.d.tt:0 "#F ลืมเรื่องวุ่นวายทั้งหมดนี้ไปเสียเถอะ#!"
 peasant_affair.2003.e:0 "ช่างเป็นโชคชะตาที่โหดร้าย!"
 peasant_affair.2003.f:0 "นั่นลูกข้าใช่หรือไม่?! พาตัว [peasant_child.GetHerHim] มา!"
 peasant_affair.2003.g:0 "ปล่อย [peasant_character.GetHerHim] เดี๋ยวนี้! เจ้าเป็นอิสระที่จะไป"

 peasant_affair.2004.desc_opening:0 ""[ROOT.Char.Custom('FormOfAddressForLiege')|U] พวกเราไม่พบร่องรอยของชาวบ้านที่ท่านให้เราค้นหาเลย มีความเป็นไปได้สูงว่า [peasant_character.GetSheHe] เสียชีวิตไปแล้ว..."\n\n"
 peasant_affair.2004.a:0 "ที่จะไม่ได้พบ [peasant_character.GetHerHim] อีก... ช่างทรมานเหลือเกิน!"

 peasant_affair.3001.t:0 "คำขอเล็กน้อย เช่นนี้"
 peasant_affair.3001.available_desc:0 "[peasant_character.GetFirstName] [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('peasant_character'))] ของข้ามาหาข้าพร้อมกับสิ่งที่ [peasant_character.GetSheHe] คิดว่าเป็นคำขออันถ่อมตน\n\n"ยอดรักของข้า, ท่านรู้ว่า [peasant_child.GetTitledFirstName] เป็นบุตรของท่าน ได้โปรดยอมรับ [peasant_child.GetHerHim] เป็นส่วนหนึ่งในเชื้อสายของท่าน""
 peasant_affair.3001.unavailable_desc:0 "\n\n[peasant_character.GetSheHe] ไม่ตระหนักหรือว่าเมื่อมี [other_spouse.GetTitledFirstName] [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('other_spouse'))] ของข้าอยู่, เรื่องต่างๆ ไม่ได้อยู่ในมือข้าทั้งหมด?"
 peasant_affair.3001.a:0 "ข้าจะยอมรับ [peasant_child.GetTitledFirstNameNoTooltip] ในสายเลือดและนามของข้า"
 peasant_affair.3001.b: "เด็กอาจเป็นสายเลือดของข้า, แต่จะไม่ได้นามของข้า"
 peasant_affair.3001.c:0 "แท้จริงแล้ว, บุตรนอกสมรสนั้นเป็นของข้า"
 peasant_affair.3001.d:0 "ข้าจะไม่มีวันทำ เช่นนั้น!"
 peasant_affair.3001.d.tt:0 "ข้า ทำให้ [peasant_character.GetTitledFirstNameNoTooltip] ชัดเจนว่ามันจะไม่มีวันเกิดขึ้น"

 peasant_affair.3002.t:0 "คำขอเล็กน้อย เช่นนี้"
 peasant_affair.3002.available_desc:0 "[peasant_character.GetFirstName] [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('peasant_character'))] ของข้ามาหาข้าพร้อมกับสิ่งที่ [peasant_character.GetSheHe] คิดว่าเป็นคำขออันถ่อมตน\n\n"ท่านรู้ดีเท่ากับข้าว่า [peasant_child.GetTitledFirstName] เป็นของข้า ข้าขอร้องท่าน, ได้โปรด ทำให้เป็นที่รับรู้""
 peasant_affair.3002.unavailable_desc:0 "\n\n[peasant_character.GetSheHe] ไม่ตระหนักหรือว่าเมื่อมี [other_spouse.GetTitledFirstName] [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('other_spouse'))] ของข้าอยู่, เรื่องต่างๆ ไม่ได้ง่ายดาย เช่นนั้น!"
 peasant_affair.3002.a:0 "เป็นเรื่องถูกต้องแล้วที่ [peasant_child.GetSheHe] ควรรู้จักเชื้อสายของ [peasant_child.GetHerHis]"
 peasant_affair.3002.b:0 "ไม่, ข้าทำไม่ได้"

 peasant_affair.3003.t:0 "ความทรงจำ"
 peasant_affair.3003.desc:0 ""แน่นอนว่าท่านจำช่วงเวลาที่เราใช้ร่วมกันได้ดีเท่ากับข้าใช่หรือไม่?" [peasant_character.GetTitledFirstName] ได้พบข้าตามลำพังในโถงทางเดิน [peasant_character.GetSheHe|U] เอนตัวเข้ามาใกล้เพื่อกระซิบข้างหูข้า "สิ่งที่เราเคยมี... ข้าไม่อาจยอมแพ้ได้""
 peasant_affair.3003.a:0 "[ROOT.Char.GetFaith.HighGodName] โปรดช่วยข้าด้วย, ข้าจะปฏิเสธได้อย่างไร?"
 peasant_affair.3003.b:0 "มันอันตรายแม้กระทั่งการที่เราถูกพบเห็นอยู่ด้วยกัน!"

 peasant_affair.3004.t:0 "โอกาส"
 peasant_affair.3004.desc:0 "[peasant_character.GetTitledFirstName] ดูครุ่นคิดขณะที่ [peasant_character.GetSheHe] [peasant_character.Custom('quirk_pos_present')] "ท่านต้องการ [peasant_character.Custom('WifeHusband')]," [peasant_character.GetSheHe] กล่าวในที่สุด "ข้ารู้ว่าข้าไม่ได้เกิดในตระกูลสูงศักดิ์, แต่ลองคิดถึงทุกสิ่งที่เรามีร่วมกัน...""
 peasant_affair.3004.a:0 "เป็นได้เพียงเจ้าเท่านั้น"
 peasant_affair.3004.b:0 "เราไม่อาจสมรสกันได้, แต่นั่นไม่ได้หมายความว่าเราจะอยู่ด้วยกันไม่ได้"
 peasant_affair.3004.c:0 "เจ้าไม่อาจเป็น [peasant_character.Custom('WifeHusband')] ของข้าได้, แต่เจ้าเป็นของข้า"
 peasant_affair.3004.d:0 "การสมรสเป็นเรื่องที่เป็นไปไม่ได้"
