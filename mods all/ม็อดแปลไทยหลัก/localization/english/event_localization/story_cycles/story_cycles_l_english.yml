 IMAGINARY_FRIEND_INFORMATION_STRING: "เพื่อนในจินตนาการของท่านชื่อ [Story.MakeScope.Var('imaginary_friend_name').Char.GetShortUINameNoTooltip] ท่านจะมีโอกาสพูดคุยกับ[Story.MakeScope.Var('imaginary_friend_name').Char.GetHerHim]เป็นครั้งคราว"
