 not_yet_chosen: "ยังไม่ได้เลือก"
 story_cycle_pet_dog: "สุนัขสัตว์เลี้ยง"
 story_cycle_pet_dog_desc: "#F สุนัขคู่ใจเดินเคียงข้างท่าน คอยคุ้มครองและมอบความจงรักภักดีที่มนุษย์น้อยคนนักจะเทียบได้#!"
 DOG_INFORMATION_STRING: "สุนัขของท่านชื่อ #V [Story.Custom('DogStoryNameAll')]#!\nขนของ[Story.Custom('DogStoryHerHisAll')|U]มีสี[Story.Custom('DogFurColorAll')] ดวงตาของ[Story.Custom('DogStoryHerHisAll')]มีสี[Story.Custom('DogEyeColorAll')] และ[Story.Custom('DogStorySheHeAll')]เป็น[Story.Custom('DogStoryPuppyOrAgeAll')]\n[Story.Custom('DogStorySheHeAll')|U]เป็น[Story.Custom('DogStoryGirlBoyAll')]ที่แสนดี"
