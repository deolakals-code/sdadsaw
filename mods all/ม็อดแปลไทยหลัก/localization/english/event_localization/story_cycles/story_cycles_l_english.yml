 cat_age_proper: "อายุ [Story.MakeScope.Var('cat_age_variable').GetValue|0] ปี"
 story_cycle_pet_cat: "แมวสัตว์เลี้ยง"
 story_cycle_pet_cat_desc: "#F แมวผู้งามสง่าคอยอยู่เป็นเพื่อนท่าน นักล่าผู้ปราดเปรียวที่มอบความรักให้ตามอำเภอใจของมันเท่านั้น#!"
 CAT_INFORMATION_STRING: "แมวของท่านชื่อ #V [Story.Custom('CatStoryNameAll')]#!\nขนของ[Story.Custom('CatStoryHerHisAll')|U]มีสี[Story.Custom('CatFurColorAll')] ดวงตาของ[Story.Custom('CatStoryHerHisAll')]มีสี[Story.Custom('CatEyeColorAll')] และ[Story.Custom('CatStorySheHeAll')]เป็น[Story.Custom('CatStoryKittenOrAgeAll')][Story.Custom('CatStupidOrNotStupidAll')]"
 dumb_but_sweet_orange_boy: "\n[Story.Custom('CatStorySheHeAll')|U]เป็น[Story.Custom('CatStoryGirlBoyAll')]สี[Story.Custom('CatFurColorAll')]ที่โง่เขลา แต่น่ารักมาก"
 story_cycle_pet_eagle: "อินทรีนักล่า"
 story_cycle_pet_eagle_desc: "#F นกอินทรีนักล่าเกาะอยู่บนถุงมือของท่าน มันคอยเฝ้าระวัง หิวโหยอยู่เสมอ และนำพาความตายจากเบื้องบน#!"
 EAGLE_INFORMATION_STRING: "นกอินทรีของท่านชื่อ #V [Story.Custom('EagleStoryNameAll')]#!\n[Story.Custom('EagleStorySheHeAll')|U] อายุ [Story.MakeScope.Var('eagle_age_variable').GetValue|0] ปี"
 bp2_hostage_loyalty: "ตัวประกันผู้ภักดี"
 bp2_hostage_loyalty_desc: "หนึ่งใน[hostages|E]ของท่านเริ่มจะเปิดใจยอมรับท่านและวิถีทางของท่าน"
 hostage: "[hostage|E]"
 HOSTAGE_STORY_PRACTICAL_INFORMATION_STRING: "[hostage|E]ของท่าน [Story.MakeScope.Var('hostage_target').Char.GetUIName] กำลังเติบโตขึ้นใน[court|E]ของท่าน ซึ่งส่งผลต่อความภักดีของ[Story.MakeScope.Var('hostage_target').Char.GetHerHis] รักษา[opinion|E]ของ[Story.MakeScope.Var('hostage_target').Char.GetHerHim]ให้สูง และเลือกตัวเลือกที่เหมาะสมในเหตุการณ์ต่างๆ เพื่อให้[Story.MakeScope.Var('hostage_target').Char.GetSheHe]มีแนวโน้มที่จะภักดีต่อท่านมากขึ้นเมื่อ[Story.MakeScope.Var('hostage_target').Char.GetSheHe]เติบโตเป็นผู้ใหญ่\n\nความภักดีในปัจจุบัน: [Story.MakeScope.Var('theon_points').GetValue|0+]"
 LOYALTY_LABEL: "แต้มความภักดี"
 claimant: "[claimant|E]"
 diverted_crusaders: "ครูเสดที่ถูกเบี่ยงเบน"
 frankokratia_story: "ฟรังโกคราเตีย"
 frankokratia_story_desc: "ผู้อ้างสิทธิ์ใน [GetTitleByKey('e_byzantium').GetName|l] ได้ล่อลวงเหล่านักฉวยโอกาสชาวตะวันตกจากสงครามครูเสดของพวกเขา หันดาบแห่งความโลภเข้าสู่หัวใจของคริสตจักรเสียเอง..."
 FRANKOKRATIA_STORY_PRACTICAL_INFORMATION_STRING: "[war|E] ที่ต่อต้าน [GetTitleByKey('e_byzantium').GetHolder.GetShortUIName] จะเป็นตัวกำหนดอนาคตของ [GetTitleByKey('e_byzantium').GetName|l] ไม่ว่า [claimant|E] [Story.MakeScope.Var('byz_claimant').Char.GetUIName] จะยึดบัลลังก์ได้สำเร็จ โดยจ่ายผลตอบแทนให้กองทหารครูเสดสำหรับความพยายามของพวกเขา — หรือ [GetTitleByKey('e_latin_empire').GetBaseName] แห่งใหม่จะถูกสถาปนาขึ้นภายใต้การปกครองแบบ [GetFaithByKey('catholic').GetAdjective]"
 story_conqueror: "ผู้พิชิต"
 story_conqueror_desc: "ความทะเยอทะยานของท่านไร้ขอบเขต! โลกทั้งใบอยู่ตรงหน้าท่าน พร้อมให้ไขว่คว้า"
 CONQUEROR_STORY_PRACTICAL_INFORMATION_STRING: "ผู้พิชิตจะได้รับโบนัสอันทรงพลังมากมาย เช่น การลด [factions|E], การเข้าถึง [vassalize_casus_belli|E], และเหตุการณ์อันทรงพลังในบางโอกาส\n\nท่านจะสิ้นสุดการเป็นผู้พิชิตหาก:\n$BULLET_WITH_TAB$ท่านไม่ได้เป็น [independent|E]\n$BULLET_WITH_TAB$ยศของท่านลดลงเป็น [count|E]\n$BULLET_WITH_TAB$ท่านกลายเป็น [unlanded|E]\n$BULLET_WITH_TAB$ท่านไม่ได้ทำ [war|E] เป็นเวลา #V 10#! ปี\n$BULLET_WITH_TAB$ท่านมี [debt|E] ท่วมตัว\n$BULLET_WITH_TAB$ท่านพ่ายแพ้ใน [wars|E] #V 3#! ครั้งหรือมากกว่า\n$BULLET_WITH_TAB$ท่านกลายเป็น [GetTrait('incapable').GetName( GetNullCharacter )]"
 story_destiny_child: "บุตรแห่งโชคชะตา"
 story_destiny_child_desc: "เด็กที่มีอนาคตอันยิ่งใหญ่ได้ถือกำเนิดขึ้น ราวกับถูกเลือกโดยชะตากรรม"
 DESTINY_CHILD_STORY_PRACTICAL_INFORMATION_STRING: "นานทีปีหน เด็กผู้ถูกลิขิตมาให้ยิ่งใหญ่จะถือกำเนิดขึ้น พวกเขาพัฒนาเร็วกว่าปกติและก้าวไปสู่จุดสูงสุดที่ผู้อื่นมิอาจเอื้อมถึง\n\nจงดูแล [Story.MakeScope.Var('destiny_child').Char.GetUIName] ให้ดี และพิจารณาปั้น[Story.MakeScope.Var('destiny_child').Char.GetHerHim]ให้เป็น [player_heir|E] ของท่าน — ตัวอย่างเช่น การแต่งตั้ง[Story.MakeScope.Var('destiny_child').Char.GetHerHim]เป็น [designated_heir|E] ของท่าน"
 CHILD_OF_DESTINY: "เด็กแห่งโชคชะตา"
 story_cycle_martial_lifestyle_warhorse: "ม้าศึก"
 story_cycle_martial_lifestyle_warhorse_desc: "ท่านมีม้าศึกที่ได้รับการฝึกฝนมาเป็นอย่างดี ขอให้ศัตรูของท่านจงตัวสั่นเทายามที่ท่านควบม้าเข้าใส่"
 WARHORSE_STORY_PRACTICAL_INFORMATION_STRING: "ม้าศึกของท่านชื่อ #V [Story.Custom('WarhorseStoryNameAll')]#! [Story.Custom('HorseStorySheHeAll')|U]เป็น[Story.Custom('HorseStoryMareStallionAll')]"
 DOPPELGANGER: "[Glossary( 'ดอปเปลแกงเกอร์', 'DOPPELGANGER_GLOSS' )]ของท่าน"
 story_doppelganger: "เงาสะท้อนในโคลนตม"
 DOPPELGANGER_GLOSS: "ผู้ที่มีหน้าตาเหมือนกันหรือเป็นตัวแทนของคนที่มีชีวิตอยู่ มักพบกันโดยบังเอิญ ในนิทานพื้นบ้านของเยอรมัน สิ่งนี้คือการปรากฏตัวอันน่าประหลาดและเป็นลางร้าย — การเห็นร่างแฝดของตนเองอาจเป็นลางบอกเหตุถึงความเจ็บป่วยหรือความตาย"
 story_doppelganger_desc: "พบชาวบ้านผู้หนึ่งที่มีใบหน้าเหมือนท่านราวกับแกะ — เป็น[Glossary( 'ดอปเปลแกงเกอร์', 'DOPPELGANGER_GLOSS' )]ของแท้เลยทีเดียว..."
 DOPPELGANGER_STORY_PRACTICAL_INFORMATION_STRING: "ชาวบ้านที่หน้าตาและพูดจาเหมือนท่านเป๊ะ อาจเป็นโอกาส... หรือคำสาป สำหรับตอนนี้ [Story.MakeScope.Var('doppelganger_character').Char.GetUIName] พำนักอยู่ใน [court|E] ของท่าน"
 story_cycle_hunt_mystical_animal: "การล่าสัตว์ลี้ลับ"
 story_cycle_hunt_mystical_animal_desc: "ระหว่างการล่าสัตว์ ท่านเหลือบไปเห็นสัตว์สีขาวอันลี้ลับ การจับมันได้จะเปรียบดั่งการค้นพบจอกศักดิ์สิทธิ์!"
 WHITE_ANIMAL_INFORMATION_STRING: "ท่านกำลังตามรอย #V [Story.MakeScope.Var('animal_type').GetFlagName|U]สีขาว#!\n\nการจับมันได้จะนำมาซึ่งรางวัลอันยิ่งใหญ่ — แต่ท่านจะได้รับ [stress|E] ทุกครั้งที่[Story.MakeScope.Var('animal_type').GetFlagName]หลบหนีไปได้ บางครั้ง [GetModifier('hunt_sighting_legendary_modifier').GetNameWithTooltip] จะช่วยให้ท่านได้ตามล่าต่อไป\n\nเผชิญหน้ากับ[Story.MakeScope.Var('animal_type').GetFlagName]สีขาว: [Story.MakeScope.Var('encounters').GetValue|0V] ครั้ง #weak (ตั้งแต่ครั้งแรก)#!"
 LEGENDARY_COUNTY_LABEL: "ถิ่นอาศัยปัจจุบันของ[Story.MakeScope.Var('animal_type').GetFlagName|U]สีขาว"
 story_sycophant: "จอมสอพลอ"
 story_sycophant_desc: "ข้าราชสำนักคนหนึ่งของท่าน ซึ่งเป็นจอมสอพลออย่างเห็นได้ชัด กำลังสร้างความขุ่นเคืองให้แก่ข้าหลวงของท่านด้วยการมีตัวตนอยู่ของพวกเขา"
 SYCOPHANT_INFORMATION_STRING: "[Story.MakeScope.Var('sycophant_character').Char.GetShortUIName] [Story.GetOwner.Custom2( 'RelationToMeShort', Story.MakeScope.Var('sycophant_character').Char )]ของข้า และ [Story.MakeScope.Var('jealous_character').Char.GetShortUIName] [Story.GetOwner.Custom2( 'RelationToMeShort', Story.MakeScope.Var('jealous_character').Char )]ของข้า กำลังขัดแย้งกันอย่างหนัก ข้าสามารถเลือกคนโปรดได้ แต่การทำเช่นนั้นย่อมทำให้ฝ่ายใดฝ่ายหนึ่งโกรธแค้นอย่างแน่นอน เวลาเท่านั้นที่จะบอกได้ว่าสถานการณ์นี้จะจบลงอย่างไร..."
 SYCOPHANT_LABEL: "จอมสอพลอ"
 JEALOUS_VASSAL_LABEL: "ข้าหลวงที่ขี้อิจฉาที่สุดของข้า"
 story_cycle_pet_rock: "หินสัตว์เลี้ยง"
 story_cycle_pet_rock_desc: "หินสัตว์เลี้ยงอยู่เคียงข้างท่าน ใบหน้าที่ไม่เคยเปลี่ยนแปรของมันช่างเข้ากับรสนิยมการหาเพื่อนอันแปลกประหลาดของท่านได้เป็นอย่างดี"
 PET_ROCK_INFORMATION_STRING: "หินของท่านชื่อ #V [Story.GetOwner.Custom('RockStoryName')]#!\nผิวขรุขระของ[Story.GetOwner.Custom('RockStoryHerHis')|U]มีสี[Story.GetOwner.Custom('RockColor')]"
 story_cycle_admin_eunuch: "ขันทีผู้โดดเด่น"
 story_cycle_admin_eunuch_desc: "ขันทีที่มีทักษะพิเศษคนหนึ่งได้หาทางเข้ามาในราชสำนักของท่าน มันคือโอกาส หรือภัยคุกคามกันแน่..?"
 EUNUCH_INFORMATION_STRING: "เมื่อเวลาผ่านไป ท่านจะมีโอกาสมอบอำนาจและอิทธิพลที่มากขึ้นแก่ [Story.MakeScope.Var('eunuch').Char.GetShortUIName] การทำเช่นนั้นจะเพิ่มความแข็งแกร่งของ [modifier|E] [GetModifier('admin_eunuch_liege_4_modifier').GetNameWithTooltip]\n\nแต่จงระวังให้ดี — การปฏิเสธ[Story.MakeScope.Var('eunuch').Char.GetHerHim] หรือมอบอำนาจให้[Story.MakeScope.Var('eunuch').Char.GetHerHim] #EMP มากเกินไป#! โดยไม่รับประกันความภักดีของ[Story.MakeScope.Var('eunuch').Char.GetHerHis] ผลที่ตามมาอาจร้ายแรงกว่าที่คิด...\n\nท่านได้ปฏิเสธคำขอของ[Story.MakeScope.Var('eunuch').Char.GetHerHis]ไปแล้ว [Story.MakeScope.Var('eunuch_refusals').GetValue|0V] ครั้งจนถึงปัจจุบัน"
 EUNUCH_LABEL: "ขันที"
 UPSET_COURTIERS: "ผู้ใต้ปกครองที่ไม่พอใจขันที"
 POETRY_BOOK_LABEL: "สมุดบทกวีของข้า"
 commission_epic_story: "ว่าจ้างประพันธ์มหากาพย์"
 commission_epic_story_desc: "ท่านกำลังว่าจ้างให้แต่งมหากาพย์อันยิ่งใหญ่เพื่อบันทึกวีรกรรมของตระกูลท่าน"
 EPIC_INFORMATION_STRING: "[Story.GetOwner.Custom('CommissionEpicScribe')][AddTextIf(Story.MakeScope.Var('composer').IsSet, Concatenate(Concatenate(', ', Story.MakeScope.Var('composer').Char.GetShortUIName), ','))] ของท่านกำลังสร้าง[Story.Custom('CompositionTypeAll')]ระดับมหากาพย์เพื่อเพิ่ม [dynasty_prestige|E] ให้แก่ [dynasty|E] [Story.GetOwner.GetDynasty.GetName] และได้รับ [artifact|E]\n\nโอกาสที่จะได้[Story.Custom('CompositionTypeAll')]ที่ยอดเยี่ยมเป็นพิเศษคือ: [Story.MakeScope.Var('final_outcome_chance').GetValue|0+/%]"
 COMPOSER: "ผู้ประพันธ์มหากาพย์ของท่าน"
 story_foreign_raised_reformer: "นักปฏิรูปที่เติบโตในต่างแดน"
 story_foreign_raised_reformer_desc: "ท่านเติบโตมาไกลจากดินแดนที่ท่านเรียกว่าบ้านในปัจจุบัน\nช่างแตกต่างเหลือเกิน... แต่จะเกิดอะไรขึ้นถ้าบ้านของท่านกลายเป็นเหมือนที่นั่น?"
 REFORMER_INFORMATION_STRING: "ท่านเติบโตใน [Story.MakeScope.Var('advanced_realm').Title.GetBaseName] โดยได้รับการเลี้ยงดูจาก [Story.MakeScope.Var('foreign_educator').Char.GetShortUIName] ซึ่งเป็นผู้นับถือ[Story.MakeScope.Var('advanced_culture_faith').Faith.GetAdjective]ใน [Story.MakeScope.Var('advanced_culture').Culture.GetName] ท่านประทับใจใน [culture|E] [Story.MakeScope.Var('advanced_culture').Culture.GetName] และปรารถนาที่จะทำให้ผู้คนของท่านเป็นเหมือนพวกเขามากขึ้น\n\nท่านจะเริ่มมีโอกาสได้รับแต้มปฏิรูปหรือแต้มตอกย้ำ:\n$BULLET_WITH_TAB$#indent_newline:7 ด้วยการมุ่งสู่การปฏิรูป ท่านจะได้รับ [innovations|E], [cultural_acceptance|E], [traditions|E], หรือแม้กระทั่ง [GetBuilding('generic_university').GetName] โปรดจำไว้ว่า การปฏิรูปเป็นกระบวนการที่ยาวนานและมีค่าใช้จ่ายสูง#!\n$BULLET_WITH_TAB$#indent_newline:7 ด้วยการมุ่งสู่การตอกย้ำ ท่านจะได้รับ [opinion|E] ของ [vassal|E], [dynasty_prestige|E], โบนัสสำหรับ [war|E] ในรูปแบบของ [casus_bellis|E] และ [special_troops|E]#!"
 REFORM_LABEL: "ความคืบหน้าในการปฏิรูป [culture|E] ของท่าน"
