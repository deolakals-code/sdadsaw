 marriage_effect.1001.t:0 "ความรักมีชัย"
 marriage_effect.1001.desc:1 "โอ้ [spouse.GetTitledFirstName], [spouse.Custom('LoverPetName')] ของข้าพเจ้า! เมื่อคิดว่าบัดนี้ข้าพเจ้าสามารถโอบกอดท่านได้อย่างเปิดเผย ด้วยพรจากทั้ง [ROOT.Char.GetFaith.FertilityGodName] และผู้คนรอบข้าง... ข้าพเจ้าคือ [ROOT.Char.GetWomanMan] ที่มีความสุขที่สุดในโลก!"
 marriage_effect.1001.a:0 "มานี่สิ, [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('spouse') )] ของข้าพเจ้า!"

 marriage_effect.1002.desc:1 "โอ้ [spouse_2.GetTitledFirstName], [spouse_2.Custom('LoverPetName')] ของข้าพเจ้า! เมื่อคิดว่าบัดนี้ข้าพเจ้าสามารถโอบกอดท่านได้อย่างเปิดเผย ด้วยพรจากทั้ง [ROOT.Char.GetFaith.FertilityGodName] และผู้คนรอบข้าง... ข้าพเจ้าคือ [ROOT.Char.GetWomanMan] ที่มีความสุขที่สุดในโลก!"
 marriage_effect.1002.a:0 "มานี่สิ, [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('spouse_2') )] ของข้าพเจ้า!"


 marriage_effect.2001.t:0 "งานเฉลิมฉลองพิธีสมรส"
 marriage_effect.2001.desc.start_normal:0 "ด้วยการสมรสของข้าพเจ้ากับ [new_spouse.GetTitledFirstName] อาณาจักรคาดหวังให้เราจัดงานเฉลิมฉลองพิธีสมรสที่หรูหราอย่างเหมาะสม"
 marriage_effect.2001.desc.start_divine_marriage:0 "ด้วยการสมรสของข้าพเจ้ากับ [new_spouse.Custom2('MyCharacterIntroduction', ROOT.Char)] อาณาจักรต่างรอคอยงานเลี้ยงรับรองอันยิ่งใหญ่เพื่อเฉลิมฉลองการรวมสายเลือดเทพเจ้าของเราอย่างใจจดใจจ่อ"
 marriage_effect.2001.desc.start_prison:0 "คู่สมรสใหม่ของข้าพเจ้า [new_spouse.GetTitledFirstName] กำลังถูกคุมขังอยู่ในขณะนี้ ถึงกระนั้น การสมรสของเราก็ยังสมบูรณ์และอาณาจักรยังคงคาดหวังงานเฉลิมฉลองพิธีสมรสที่หรูหรา"
 marriage_effect.2001.desc.end:0 "\n\nเป็นสิทธิ์อันชอบธรรมของข้าพเจ้าที่จะเรียกเก็บภาษีช่วยราชการเป็นส่วนหนึ่งของงานนี้ แต่บางคนอาจถือว่าเป็นการไร้รสนิยมที่จะเรียกเก็บภาษีเพิ่มเติมในช่วงเวลาแห่งความปิติยินดี..."
 marriage_effect.2001.a:0 "แน่นอน ข้าจะเก็บมัน! ใครกันจะจ่ายค่างาน แต่งของตัวเอง?"
 marriage_effect.2001.b:0 "ข้าจะให้เหล่าข้าแผ่นดินของข้าเพลิดเพลินกับงานเฉลิมฉลองโดยปราศจากความกังวลหรือภาระ"
