l_english: 
 marriage_effect.0001.t:0 "ทำให้ถูกต้อง"
 marriage_effect.0001.desc.multiple:0 "ในที่สุดทุกสิ่งก็เป็นไปตามที่ควรจะเป็น ความลับที่คอยคุกคาม [illegitimate_child.Custom('TwinDaughtersSonsChildren')] ของข้าพเจ้าไม่อาจทำร้ายเราได้อีกต่อไป บัดนี้บิดาของพวกเขา [new_spouse.GetTitledFirstName] และข้าพเจ้าได้สมรสกันอย่างถูกต้องตามกฎหมายแล้ว"
 marriage_effect.0001.desc.child:0 "ข้าพเจ้าใช้เวลาหลายคืนนอนไม่หลับด้วยความกังวลเกี่ยวกับ [illegitimate_child.Custom('GetDaughterSon')] ของข้าพเจ้า [illegitimate_child.GetTitledFirstName] และสิ่งที่จะเกิดขึ้นกับเราหากความจริงเรื่องบิดามารดาของ [illegitimate_child.GetHerHis] ถูกเปิดเผย\n\nบัดนี้บิดาของ [illegitimate_child.GetHerHis] [new_spouse.GetTitledFirstName] และข้าพเจ้าได้สมรสกันอย่างถูกต้องตามกฎหมายแล้ว ความกลัวเก่าๆ ของข้าพเจ้าก็อาจจะคลายลงได้ในที่สุด"
 marriage_effect.0001.desc.pregnancy:0 "ตั้งแต่วันที่ข้าพเจ้ารู้ว่าตั้งครรภ์ ข้าพเจ้าก็กังวลใจอย่างหนักเกี่ยวกับอนาคตของบุตร ในที่สุดข้าพเจ้าก็พ้นจากความกลัว บัดนี้บิดาของบุตร [new_spouse.GetTitledFirstName] และข้าพเจ้าได้สมรสกันอย่างถูกต้องตามกฎหมายแล้ว"
 marriage_effect.0001.a:0 "ความลับนี้จะไม่หลอกหลอนข้าพเจ้าอีกต่อไป"

 marriage_effect.0002.desc.multiple:0 "ในที่สุดทุกสิ่งก็เป็นไปตามที่ควรจะเป็น ความลับที่คอยคุกคาม [illegitimate_child.Custom('TwinDaughtersSonsChildren')] ของข้าพเจ้าไม่อาจทำร้ายพวกเขาหรือมารดาของพวกเขา [real_mother.GetTitledFirstName] ได้อีกต่อไป บัดนี้เราได้สมรสกันอย่างถูกต้องตามกฎหมายแล้ว"
 marriage_effect.0002.desc.child:0 "ข้าพเจ้าใช้เวลาหลายคืนนอนไม่หลับด้วยความกังวลเกี่ยวกับ [illegitimate_child.Custom('GetDaughterSon')] ของข้าพเจ้า [illegitimate_child.GetTitledFirstName] และสิ่งที่จะเกิดขึ้นกับ [illegitimate_child.GetHerHim] หากความจริงเรื่องบิดามารดาของ [illegitimate_child.GetHerHis] ถูกเปิดเผย\n\nบัดนี้มารดาของ [illegitimate_child.GetHerHis] [real_mother.GetTitledFirstName] และข้าพเจ้าได้สมรสกันอย่างถูกต้องตามกฎหมายแล้ว ความกลัวเก่าๆ ของข้าพเจ้าก็อาจจะคลายลงได้ในที่สุด"
 marriage_effect.0002.desc.pregnancy:0 "ตั้งแต่วันที่ข้าพเจ้ารู้ว่า [real_mother.GetTitledFirstName] ตั้งครรภ์บุตรของเรา ข้าพเจ้าก็กังวลใจอย่างหนักเกี่ยวกับอนาคตของบุตร บัดนี้เราได้สมรสกันอย่างถูกต้องตามกฎหมายแล้ว ความกลัวของข้าพเจ้าก็อาจจะคลี่คลายลงได้ในที่สุด"
 marriage_effect.0002.desc.pregnancy_not_knowing:0 "[real_mother.Custom2('MyCharacterIntroduction', ROOT.Char)|U] เข้ามาหาข้าพเจ้าพร้อมกับวางมือบนท้องของ [real_mother.GetHerHis]\n\n"ข้าพเจ้ามิได้บอกท่านก่อนหน้านี้ แต่... บุตรที่ข้าพเจ้าอุ้มท้องอยู่คือบุตรของท่าน บัดนี้เราได้สมรสกันอย่างถูกต้องตามกฎหมายแล้ว ความลับนี้ก็ไม่อาจทำอันตรายใดๆ ได้""
 marriage_effect.0001.a_not_knowing:0 "โอ้, ข้า– ข้ายินดี"

 marriage_effect.0003.desc.pregnancy:0 "ตั้งแต่วันที่ข้าพเจ้ารู้ว่า [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('real_mother') )] ของข้าพเจ้า [real_mother.GetTitledFirstName] ตั้งครรภ์บุตรของ [new_spouse.GetTitledFirstNamePossessive] ข้าพเจ้าก็เก็บงำความลับของพวกเขไว้แนบอก บัดนี้พวกเขาได้สมรสกันอย่างถูกต้องตามกฎหมายแล้ว ข้าพเจ้าก็สามารถผ่อนคลายได้ในที่สุด"
 marriage_effect.0003.desc.multiple:0 "ข้าพเจ้าเป็นห่วง [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('real_mother') )] ของข้าพเจ้า [real_mother.GetTitledFirstName] และ [illegitimate_child.Custom('TwinDaughtersSonsChildren')] ของ [real_mother.GetHerHis] มาโดยตลอดนับตั้งแต่พวกเขาเกิดมา โดยรู้ว่าพวกเขาเกิดจากการสมสู่ที่ผิดทำนองคลองธรรมของ [real_mother.GetHerHis] กับ [new_spouse.GetTitledFirstName]\n\nบัดนี้ [new_spouse.GetTitledFirstName] และ [real_mother.GetFirstName] ได้สมรสกันอย่างถูกต้องตามกฎหมายแล้ว ความกลัวเก่าๆ ของข้าพเจ้าก็อาจจะคลายลงได้ในที่สุด"
 marriage_effect.0003.desc:0 "ข้าพเจ้าเป็นห่วง [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('real_mother') )] ของข้าพเจ้า [real_mother.GetTitledFirstName] และ [illegitimate_child.Custom('GetDaughterSon')] ของ [real_mother.GetHerHis] [illegitimate_child.GetTitledFirstName] มาโดยตลอดนับตั้งแต่เด็กคนนั้นเกิดมา โดยรู้ว่าเด็กคนนั้นเกิดจากการสมสู่ที่ผิดทำนองคลองธรรมของ [real_mother.GetHerHis] กับ [new_spouse.GetTitledFirstName]\n\nบัดนี้ [new_spouse.GetTitledFirstName] และ [real_mother.GetFirstName] ได้สมรสกันอย่างถูกต้องตามกฎหมายแล้ว ความกลัวเก่าๆ ของข้าพเจ้าก็อาจจะคลายลงได้ในที่สุด"

