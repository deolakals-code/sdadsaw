l_english: 
 send_poem_interaction:0 "ส่งบทกวี"
 send_poem_interaction_desc:0 "ส่งผลงานส่วนตัวอันซาบซึ้งถึง [recipient.GetTitledFirstNameNoTooltip]"
 send_poem_interaction.positive_auto_accept.tt:0 "เนื่องจากบทกวีนี้เป็นไปในทางบวก [recipient.GetFirstNameNoTooltip] อาจยอมรับทันทีหาก [recipient.GetSheHe] มี [opinion|E] ที่ดีต่อท่านเพียงพอ"
 SEND_POEM_ROMANCE:0 "ผลงานเกี่ยวกับความรักใคร่"
 SEND_POEM_MOURNING:0 "ผลงานเกี่ยวกับการไว้อาลัย"
 SEND_POEM_LEGACY:0 "ผลงานเกี่ยวกับสิ่งที่ทิ้งไว้เบื้องหลัง"
 SEND_POEM_STRIFE:0 "ผลงานเกี่ยวกับการต่อสู้ดิ้นรน"
 SEND_POEM_INCOMPETENCE:0 "ผลงานที่ให้รายละเอียดถึงความไร้สามารถของพวกเขา"

 send_poem_interaction.success:0 "บทกวีได้รับการยกย่อง"
 send_poem_interaction.failure:0 "บทกวีถูกเยาะเย้ย"

 trait_specific_interactions.000.generate_poem:1 "#POE [actor.Custom('GeneratePoem_Title')]#!\n[actor.Custom('GeneratePoem_Intro_Rhyming')]\n[actor.Custom('GeneratePoem_Outro_Rhyming')]"
 trait_specific_interactions.000.intro.part1:0 "ผลงานล่าสุดของ [actor.GetTitledFirstName] [recipient.Custom2('RelationToMe', SCOPE.sC('actor'))] ของข้า ได้กลายเป็นที่นิยมอย่างยิ่งใน [actor.Custom('GetCourt')] เมื่อเร็วๆ นี้:"
 trait_specific_interactions.000.intro.part3:0 "และ [actor.GetFirstNameNoTooltip] ได้อุทิศมันให้แก่ #EMP ข้า#! อย่างเปิดเผย"
 trait_specific_interactions.000.outro:0 "จนถึงบัดนี้ ข้ายังเก็บความคิดไว้กับตนเอง แต่เสียงเล่าลือได้ดังกระหึ่มเกินกว่าจะเพิกเฉยได้อีกต่อไป"

 trait_specific_interactions.0001.t:0 "สัมผัสแห่งรัก"
 trait_specific_interactions.0001.desc.intro:0 "$trait_specific_interactions.000.intro.part1$ ผลงานชิ้นนี้เกี่ยวกับความรู้สึกรักและความใคร่ $trait_specific_interactions.000.intro.part3$"
 trait_specific_interactions.0001.desc.poem:0 "\n\n$trait_specific_interactions.000.generate_poem$\n\n"
 trait_specific_interactions.0001.desc.outro:0 "$trait_specific_interactions.000.outro$"
 trait_specific_interactions.0001.a:0 "ข้าไม่รู้แน่ชัดว่ารู้สึกอย่างไรเกี่ยวกับเรื่องนี้..."
 trait_specific_interactions.0001.b:0 "[actor.GetFirstNameNoTooltip] ข้าเห็นได้ว่านี่ #EMP จริงใจ#! อย่างแท้จริง!"
 trait_specific_interactions.0001.c:0 "ชิ เรื่องไร้สาระ!"

 trait_specific_interactions.0011.t:0 "การปลอบประโลมในบทประพันธ์"
 trait_specific_interactions.0011.desc.intro:0 "$trait_specific_interactions.000.intro.part1$ ผลงานชิ้นนี้เกี่ยวกับความรู้สึกเศร้าโศกและการสูญเสีย $trait_specific_interactions.000.intro.part3$"
 trait_specific_interactions.0011.desc.poem:0 "\n\n$trait_specific_interactions.000.generate_poem$\n\n"
 trait_specific_interactions.0011.desc.outro:0 "$trait_specific_interactions.000.outro$"
 trait_specific_interactions.0011.a:0 "$trait_specific_interactions.0001.a$"
 trait_specific_interactions.0011.b:0 "$trait_specific_interactions.0001.b$"
 trait_specific_interactions.0011.c:0 "$trait_specific_interactions.0001.c$"

 trait_specific_interactions.0021.t:0 "บทกวีว่าด้วยสิ่งที่ทิ้งไว้เบื้องหลัง"
 trait_specific_interactions.0021.desc.intro:0 "$trait_specific_interactions.000.intro.part1$ ผลงานชิ้นนี้เกี่ยวกับความทรงจำและสิ่งที่เราทิ้งไว้เบื้องหลัง $trait_specific_interactions.000.intro.part3$"
 trait_specific_interactions.0021.desc.poem:0 "\n\n$trait_specific_interactions.000.generate_poem$\n\n"
 trait_specific_interactions.0021.desc.outro:0 "$trait_specific_interactions.000.outro$"
 trait_specific_interactions.0021.a:0 "$trait_specific_interactions.0001.a$"
 trait_specific_interactions.0021.b:0 "$trait_specific_interactions.0001.b$"

 trait_specific_interactions.0031.t:0 "มุ่งมั่นท่ามกลางความขัดแย้ง"
 trait_specific_interactions.0031.desc.intro:0 "$trait_specific_interactions.000.intro.part1$ ผลงานชิ้นนี้เกี่ยวกับความสำเร็จและความยิ่งใหญ่ที่เพิ่มพูน $trait_specific_interactions.000.intro.part3$"
 trait_specific_interactions.0031.desc.poem:0 "\n\n$trait_specific_interactions.000.generate_poem$\n\n"
 trait_specific_interactions.0031.desc.outro:0 "$trait_specific_interactions.000.outro$"
 trait_specific_interactions.0031.a:0 "$trait_specific_interactions.0001.a$"
 trait_specific_interactions.0031.b:0 "$trait_specific_interactions.0001.b$"

 trait_specific_interactions.0041.t:0 "[recipient.GetTitleAsNameNoTooltip] ผู้ชั่วร้าย"
 trait_specific_interactions.0041.desc.intro:0 "$trait_specific_interactions.000.intro.part1$ ผลงานชิ้นนี้เป็นการดูหมิ่น ยั่วยุ และอุทิศ #EMP โดยเฉพาะ#! ให้แก่ข้าและ "การผสมผสานอันเป็นเอกลักษณ์ของความไร้สามารถและความไม่รู้จักยับยั้ง" ของข้า"
 trait_specific_interactions.0041.desc.poem:0 "\n\n$trait_specific_interactions.000.generate_poem$\n\n"
 trait_specific_interactions.0041.desc.outro:0 "$trait_specific_interactions.000.outro$"
 trait_specific_interactions.0041.a:0 "$trait_specific_interactions.0001.a$"
 trait_specific_interactions.0041.b:0 "อืมม์ ใช่ #EMP ช่าง. น่าขบขัน. เสียจริง!#!"
