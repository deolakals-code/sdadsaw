l_english: 
 witch.1001.message:0 "การชักนำสู่ลัทธิแม่มด"
 child_witch_conversion_success_effect.desc:0 "[child.GetFirstNameNoTooltip] ถูกโน้มน้าว"
 child_witch_conversion_failure_effect.desc:0 "[child.GetFirstNameNoTooltip] ยังคงสงสัย"
 child_witch_conversion_critical_failure_effect.desc:0 "[child.GetFirstNameNoTooltip] เปิดเผยความลับของข้า"
 child_witch_conversion_critical_failure_effect.liege.desc:0 "[child.GetFirstNameNoTooltip] เปิดเผยผู้พิทักษ์ที่เป็นแม่มด"

 witch.1002.t:0 "วัยแห่งการหยั่งรู้"
 witch.1002.desc:0 "[child.Custom2('MyCharacterIntroduction', ROOT.Char)|U] กำลังอยู่ในช่วงคาบเกี่ยวระหว่างวัยเด็กและวัยผู้ใหญ่ ข้าได้สอน [child.GetHerHim] มากพอที่จะเข้าใจความจริง และ [child.GetSheHe] ก็ยังเยาว์พอที่จะเปิดใจ หากข้าต้องการชักนำ [child.GetHerHim] เข้าสู่การรับใช้ [ROOT.Char.GetFaith.WitchGodName] ก็ต้องเป็นบัดนี้ มิ เช่นนั้นก็ไม่มีโอกาสอีกแล้ว"
 witch.1002.a:0 "[child.GetSheHe|U] สมควรได้รู้ถึงพลังอำนาจของ [ROOT.Char.GetFaith.WitchGodHerHis|U]"
 witch.1002.b:0 "[child.GetFirstNameNoTooltip] เป็นกรณีที่สิ้นหวังแล้ว"

 witch.1003.t:0 "ความรู้ที่ซ่อนเร้น"
 witch.1003.desc:0 "มีบางสิ่งที่ [guardian.Custom2('MyCharacterIntroduction', ROOT.Char)] ได้บอกแก่ข้า ซึ่งไม่มีผู้ใดเคยเอ่ยถึง เราไม่เคยเจาะลึกในหัวข้อเหล่านี้ และข้ารู้ดีว่าไม่ควรถามคำถาม \n\nอย่างไรก็ตาม เย็นวันนี้ มีบางอย่างที่รู้สึกแตกต่างไประหว่างเรา ขณะที่เรานั่งลงเพื่ออ่านหนังสือ [guardian.GetSheHe] ถามว่ามีสิ่งใดที่ข้าสงสัยใคร่รู้หรือไม่..."
 witch.1003.a:0 "ใช่ บอกข้ามาให้หมด! ได้โปรด!"
 witch.1003.b:0 "ไม่ ข้าไม่คิด เช่นนั้น..."
 witch.1003.c:0 "นี่มันการดูหมิ่นศาสนา!"

 witch.2001.t:1 "$convert_to_witch$: ถึงเวลาแล้ว"
 witch.2001.start.desc:0 "ข้าไม่อาจบังคับให้ [target.GetFirstName] มองเห็นความจริงได้ แต่ข้าได้ทำทุกวิถีทางเพื่อเปิดใจ [target.GetHerHis] ต่อสิ่งนั้นแล้ว"
 witch.2001.secrecy.desc:0 "ข้าภาวนาต่อ [owner.GetFaith.WitchGodName] ขอให้ [target.GetFirstNameNoTooltip] ได้เชื่อมโยงกับบางสิ่งในการสนทนาอันบริสุทธิ์ของเราและในตำราศักดิ์สิทธิ์ที่ข้าทิ้งไว้ในห้องของ [target.GetHerHis]"
 witch.2001.no_secrecy.desc:0 "ข้าภาวนาต่อ [owner.GetFaith.WitchGodName] ขอให้ [target.GetFirstNameNoTooltip] ได้เชื่อมโยงกับบางสิ่งในการสนทนาอันยาวนานเหล่านั้นและในตำราศักดิ์สิทธิ์ที่ข้ามอบให้ [target.GetHerHim]"
 witch.2001.end.desc:0 "\n\nบัดนี้ข้าต้องไปหา [target.GetHerHim] และยื่นคำเชิญสู่การร่วมสังสรรค์กับ [owner.GetFaith.WitchGodHerHis|U] — หรือ มิฉะนั้นก็ล้มเลิกความพยายามนี้เสีย"
 witch.2001.a:0 "[target.GetSheHe|U] สมควรที่จะตัดสินใจด้วย [target.GetHerHis] เอง"
 witch.2001.b1:0 "ความเสี่ยงมันมากเกินไป"
 witch.2001.b2:0 "[target.GetFirstNameNoTooltip] ยังไม่พร้อม"
 witch.2001.a.tt:1 "ท่านดำเนินการตามแผนเพื่อชักนำ [target.GetShortUIName] สู่เส้นทางของ [owner.GetFaith.WitchGodName]"

 witch.2002.t:0 "ผู้รับใช้แห่ง [owner.GetFaith.WitchGodName]"
 witch.2002.start.desc:0 "ขณะที่ข้าลืมตาขึ้นในความมืด ข้าก็รู้สึกถึงลางร้ายอย่างท่วมท้นในทันที มีใครกำลังจับตามองข้าอยู่หรือ?\n\n"เจ้าพร้อมที่จะยอมรับความจริงแล้วหรือยัง [ROOT.Char.GetFirstNameNoTooltip]?""
 witch.2002.discovery.desc:0 "ข้าจำเสียงนั้นได้ทุกที่ ต้องเป็น [owner.Custom2('MyCharacterIntroductionNoComma', ROOT.Char)] แน่"
 witch.2002.no_discovery.desc:0 "ข้าลุกขึ้นนั่ง ตื่นเต็มตาในทันใด ข้ามองหารอบๆ เพื่อหาต้นตอของเสียง [owner.GetWomanMan] ที่ไม่คุ้นเคย แต่มีเพียงเงาเท่านั้น"
 witch.2002.end.desc:0 "\n\n"[owner.GetFaith.WitchGodName|U] มอบพรของ [owner.GetFaith.WitchGodHerHis|U] แก่เจ้า เจ้าจะยอมรับหรือไม่?""
 witch.2002.a:0 "ด้วยสุดใจของข้า!"
 witch.2002.b:0 "ข้าไม่ต้องการยุ่งเกี่ยวกับเรื่องนี้ ไปให้พ้น เจ้าปีศาจ!"
 witch.2002.c:0 "โลกจะได้รู้ถึงบาปของเจ้า [owner.GetFirstNameNoTooltip]!"

 witch.2003.t:1 "$convert_to_witch$: ศิษย์ใหม่"
 witch.2003.desc:0 "ข้ามองร่างที่หลับใหลของ [target.GetFirstName] ขณะที่ข้าส่งคำอธิษฐานสั้นๆ ถึง [owner.GetFaith.WitchGodName] ทันทีที่คำกระซิบสุดท้ายหลุดจากริมฝีปากข้า [target.GetSheHe] ก็ขยับตัว ราวกับว่าจิตใต้สำนึกของ [target.GetHerHis] รอคอยช่วงเวลานี้อยู่\n\nเมื่อข้าก้าวออกจากเงามืดและมอบพรของ [owner.GetFaith.WitchGodHerHis|U] แก่ [target.GetFirstNameNoTooltip] ไม่มีแววตาแห่งความกลัวหรือลังเลในดวงตาของ [target.GetHerHis] ไม่เลย การยอมรับของ [target.GetHerHis] นั้นเต็มใจและกระหายใคร่รู้"

 witch.2003.a:0 "ยินดีต้อนรับสู่การร่วมชุมนุมของเรา [target.Custom('SisterBrother')|U]"
 witch.2003.b:0 "บัดนี้ข้าสามารถแสดงตัวตนที่แท้จริงของข้าให้ [target.GetHerHim] เห็นได้ในที่สุด"
 witch.2003.b.tt:0 "[target.GetShortUIName|U] ต้องรู้ถึง [secret|E] ของท่าน เพื่อที่จะได้รับเชิญเข้าร่วม $activity_witch_ritual$"
 witch.2003.c:0 "[target.GetSheHe|U] ต้องค้นพบเส้นทางของ [target.GetHerHis] เอง"

 witch.2003.message:0 "แม่มดเปิดเผย [owner.GetHerselfHimself] แก่ข้า"

 witch.2004.t:1 "$convert_to_witch$: จิตใจที่ปิดกั้น หัวใจที่เย็นชา"
 witch.2004.start.desc:0 "[target.GetFirstName] ขยับตัวตื่นจากนิทราขณะที่ข้า [SelectLocalization( IsLandlessAdventurer(target), 'witch.2004.start_target_laamp', 'witch.2004.start_target_landed')] "ใครน่ะ?" [target.GetSheHe] ถามด้วยเสียงสั่นเครือ\n\n"นามของข้าไม่สำคัญ ข้ามาที่นี่เพื่อรับใช้ [owner.GetFaith.WitchGodName]"\n\n"
 witch.2004.start_target_landed: "ปีนเข้าทางหน้าต่าง"
 witch.2004.start_target_laamp: "คลานเข้าไปในเต็นท์"
 witch.2004.discovered.desc:0 "[target.GetFirstNameNoTooltip] หรี่ตา "[ROOT.Char.GetFirstNameNoTooltip] นั่นเจ้าหรือ? '[owner.GetFaith.WitchGodName|U]'? นี่มันเรื่องไร้สาระอะไรกัน?!"
 witch.2004.not_discovered.desc:0 "[target.GetFirstNameNoTooltip] ตะเกียกตะกายลงจากเตียง เอื้อมมือไปหยิบบางอย่างบนโต๊ะข้างเตียงของ [target.GetHerHis] คงไม่ใช่ของดีแน่ "ข้าไม่ต้องการยุ่งเกี่ยวกับเจ้าหรือคำโกหกของเจ้า! ไปให้พ้น เจ้าปีศาจ!" [target.GetFirstNameNoTooltip] ตะโกน และข้าก็ไม่รอช้าที่จะเชื่อฟัง"
 witch.2004.a:0 "ขออภัย ผิด [target.Custom('GetChamber')]!"
 witch.2005.toast: "ค้นพบแม่มด"

 witch.2005.end.desc:0 "[ROOT.Char.GetFirstNameNoTooltip] นั่นเจ้าหรือ? '[owner.GetFaith.WitchGodName|U]'? [target.GetLiege.Custom2('MyCharacterIntroduction', target)|U] จะต้องได้ยินเรื่องการดูหมิ่นศาสนาของเจ้า!""
 witch.2005.a:0 "ได้โปรด มันไม่ใช่สิ่งที่ท่านคิด!"
 witch.2005.a.tt:0 "อันที่จริง มันอาจจะ #EMP ใช่เลย#! อย่างที่ [target.GetSheHe] คิด..."

 witch.2006.t:0 "$convert_to_witch$: การเปิดเผย"
 witch.2006.desc:0 "[target.Custom2('MyCharacterIntroduction', ROOT.Char)|U] ไม่ได้อยู่บนเตียงของ [target.GetHerHis] ขณะที่ข้าแอบย่องผ่านหน้าต่างของ [target.GetHerHis] ในภารกิจจาก [owner.GetFaith.WitchGodName] เขาจะไปไหนได้–\n\n"นั่นใคร?!"\n\nข้าหันขวับไปพบ [target.GetTitledFirstName] กำลังนั่งยองๆ เหนือรูปดาวห้าแฉกที่วาดไว้บนพื้น"
 witch.2006.a:0 "โอ้ ท่านอยู่แล้ว...! สวัสดี [target.Custom('SisterBrother')|U]!"

 witch.2007.t:0 "พันธมิตรที่ซ่อนเร้น"
 witch.2007.desc:0 "ข้ากำลังอยู่ระหว่างพิธีกรรมยามค่ำคืนเพื่อเป็นเกียรติแด่ [owner.GetFaith.WitchGodName] เมื่อมีเสียงดังขึ้นข้างหลังข้า โจรหรือ? แขกหรือ? หรือนักฆ่า?!\n\nขณะที่ข้าหันขวับไป ข้าก็เผชิญหน้ากับ [owner.Custom2('MyCharacterIntroduction', ROOT.Char)] ซึ่ง แต่งกายด้วยเสื้อคลุมสีเข้มประดับด้วยเครื่องหมายอันเป็นเอกลักษณ์ของ [owner.GetFaith.WitchGodName] – ชุดคลาสสิกสำหรับการเปลี่ยนศาสนา"
 witch.2007.a:1 "ไม่จำเป็นต้องทำ เช่นนั้นกับข้า #EMP [owner.Custom('SisterBrother')|U]#!!"

 witch.2010.t:1 "$convert_to_witchcraft_key$: ได้ยินเข้า"
 witch.talk.2010:1 "[target.GetFirstName] และข้าสนทนากันเรื่อง [owner.GetFaith.WitchGodName] และเจตจำนงของ [owner.GetFaith.WitchGodHerHis] เป็นเวลาหลายชั่วโมง เมื่อท้องฟ้าเปลี่ยนเป็นสีฟ้าจางๆ ที่ขอบฟ้า เราก็กล่าวคำอำลา"
 witch.leave.2010:0 "เมื่อข้าได้ถ่ายทอดปัญญาอันสำคัญที่สุดของ [ROOT.Char.GetFaith.WitchGodHerHis|U] ให้แก่ [target.GetFirstName] และมอบตำราเวทมนตร์ส่วนตัวของ [target.GetHerHis] ให้ [target.GetHerHim] แล้ว ข้าก็จากไป"
 witch.end.2010:0 "\n\nขณะที่ข้าเปิดประตูห้อง ข้าได้ยินเสียงฝีเท้าวิ่งหายไปตามทางเดินอย่างรวดเร็ว มีใครแอบฟังอยู่หรือ?"
 witch.2010.a:0 "ให้ [ROOT.Char.GetFaith.HighGodName] ถูกสาปแช่งไปเสีย!"
 witch.2010.a.tt:1 "มีคนรู้ [secret|E] ของท่าน"
 witch.2010.message:0 "ความลับถูกค้นพบ"

 convert_to_witchcraft_key:0 "ชักนำสู่ลัทธิแม่มด"
 convert_to_witchcraft_interaction:1 "$convert_to_witchcraft_key$ #weak (แผนการ)#!"
 convert_to_witchcraft_interaction_desc:0 "พยายามชักนำ [recipient.GetShortUINameNoTooltip] สู่วิถีแห่ง [actor.GetFaith.WitchGodName]"
 convert_to_witchcraft:2 "$convert_to_witchcraft_key$"
 convert_to_witchcraft_desc:0 "ข้าจะนำ [SCHEME.GetTargetCharacter.GetShortUINameNoTooltip] สู่เส้นทางของ [SCHEME.GetOwner.GetFaith.WitchGodName] และแสดงให้ [SCHEME.GetTargetCharacter.GetHerHim] เห็นถึงขอบเขตอำนาจที่แท้จริงของ [SCHEME.GetOwner.GetFaith.WitchGodHerHis|U]"
 convert_to_witchcraft_desc_general:0 "นำเป้าหมายสู่เส้นทางที่แท้จริงและแสดงให้พวกเขาเห็นถึงขอบเขตของพลังอำนาจนี้"
 convert_to_witchcraft_action:0 "ชักนำ"
 convert_to_witchcraft_interaction_notification:0 "ชักนำสู่ลัทธิแม่มด"
 convert_to_witchcraft_scheme_invalidated_title:0 "@scheme_icon! แผนการชักนำสู่ลัทธิแม่มดสิ้นสุดลง"
 convert_to_witchcraft_general_desc:1 "แผนการเพื่อนำเป้าหมายเข้าสู่ลัทธิแม่มดโดยหวังว่าจะขยายชุมนุมของพวกเขา"


 ### REVEAL AS WITCH INTERACTION ###
 reveal_as_witch_interaction:0 "เปิดเผยตนว่าเป็นแม่มด"
 reveal_as_witch_interaction_desc:0 "เปิดเผยความศรัทธาของท่านต่อ [actor.GetFaith.WitchGodName] แก่เพื่อน [GetTrait('witch').GetName( GetNullCharacter )]"

 witch.2900.t:0 "[actor.Custom2('AppropriateGreetingPositive', ROOT.Char )]"
 witch.2900.desc:1 "ท่านเป็นแรงบันดาลใจให้ข้ามานาน และข้ารู้สึกว่าท่านสมควรได้รับรู้สิ่งที่ข้าปิดบังจากโลก\n\nข้าเองก็เป็นผู้ติดตาม [actor.GetFaith.WitchGodName] และเป็นศิษย์แห่งความลี้ลับของ [actor.GetFaith.WitchGodHerHis|U] ข้าหวังว่าความพยายามร่วมกันของเราจะ ทำให้เราใกล้ชิดกันมากขึ้น\n\nขอให้ [actor.GetFaith.WitchGodMistressMaster] ผู้ชาญฉลาดของเราคุ้มครองท่าน"
 witch.2900.a:0 "พวกเรามีจำนวนเพิ่มขึ้น!"

 witch.2901.t:0 "[recipient.Custom2('AppropriateGreetingPositive', ROOT.Char )]"
 witch.2901.desc:0 "ข้ายินดีที่ได้ยินถึงการรับใช้อันซื่อสัตย์ของท่านต่อ [ROOT.Char.GetFaith.WitchGodMistressMaster] ผู้ชาญฉลาดของเรา! ขอให้ [ROOT.Char.GetFaith.WitchGodSheHe|U] คุ้มครองท่านและนำทางท่านสู่เส้นทางแห่งความจริง"
 witch.2901.a:0 "และขอให้ [ROOT.Char.GetFaith.WitchGodSheHe|U] คุ้มครองท่าน!"

 ####GRAND RITE####

 #Activity & decision
 host_witch_ritual_decision:0 "จัดมหาพิธีกรรม"
 host_witch_ritual_decision_desc:0 "เราจะบูชา [ROOT.Char.GetFaith.WitchGodName] และเจาะลึกสู่ความลี้ลับของ [ROOT.Char.GetFaith.WitchGodHerHis|U]! $activity_witch_ritual$ เป็นโอกาสอันยอดเยี่ยมในการสังสรรค์และแลกเปลี่ยนความรู้กับเพื่อนแม่มดของข้า"
 host_witch_ritual_decision_tooltip:0 "จัดพิธีกรรม"
 host_witch_ritual_decision_confirm:0 "ให้พิธีกรรมเริ่มต้น!"
 activity_witch_ritual:0 "มหาพิธีกรรม"
 activity_witch_ritual_name:0 "มหาพิธีกรรมของ [ACTIVITY.GetOwner.GetNamePossessiveOrMy|U]"
 activity_witch_ritual_owner:0 "เจ้าภาพ"
 activity_witch_ritual_desc:3 "ผู้ติดตามที่แท้จริง ซึ่งมี [trait|E] [GetTrait('witch').GetName( GetNullCharacter )] ได้รับเชิญให้เฉลิมฉลองอำนาจของ [GetPlayer.GetFaith.WitchGodName] และเจาะลึกสู่ความลี้ลับ"
 activity_witch_ritual_destination_selection:0 "ท่านสามารถจัด $activity_witch_ritual$ ได้เฉพาะใน [capital|E] ของท่านเท่านั้น"
 activity_witch_ritual_selection_tooltip:0 "บูชา [GetPlayer.GetFaith.WitchGodName] และยอมรับของประทานอันมืดมิดของ [GetPlayer.GetFaith.WitchGodHerHis|U]\n\nรางวัลที่คาดว่าจะได้รับ:\n$BULLET_WITH_TAB$[opinion_i] [opinion|E]\n$BULLET_WITH_TAB$[stress_loss_i] การสูญเสีย [stress|E]"
 activity_witch_ritual_province_capital_desc: "นี่คือ [capital|E] ของท่าน"
 activity_witch_ritual_province_domicile_desc: "นี่คือ [domicile|E] ของท่าน"
 activity_witch_ritual_province_both_desc: "$activity_witch_ritual_province_capital_desc$ และ [domicile|E]"
