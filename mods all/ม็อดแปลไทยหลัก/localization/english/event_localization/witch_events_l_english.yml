 ### Court chaplain / other clergy is an idiot ###
 witch.4001.t:0 "การพิพากษาอันศักดิ์สิทธิ์"
 witch.4001.start.desc:0 "[annoying_clergy.Custom2('MyCharacterIntroduction', ROOT.Char)|U] กำลัง ทำให้ข้าหงุดหงิดจริงๆ! ไม่มีสักครู่ที่ [annoying_clergy.GetSheHe] จะไม่พร่ำบ่นไม่หยุดเกี่ยวกับ [annoying_clergy.GetFaith.HighGodName] และเจตจำนงของ [annoying_clergy.GetFaith.HighGodHerHis|U]\n\n[annoying_clergy.GetSheHe|U] ชอบเป็นพิเศษที่จะบอกทุกคนว่า [annoying_clergy.GetFaith.HighGodNameAlternate]"
 witch.4001.forgiving.desc:0 "คิดว่าการให้อภัยคือความอ่อนแอ"
 witch.4001.deceitful.desc:0 "จะลงโทษคนโกหก"
 witch.4001.gluttonous.desc:0 "ลงโทษผู้ที่เพลิดเพลินกับอาหารและเครื่องดื่ม"
 witch.4001.wrathful.desc:0 "จะลงโทษผู้ที่มีอารมณ์ร้าย"
 witch.4001.greedy.desc:0 "จะลงโทษผู้ที่โลภในทรัพย์สมบัติ"
 witch.4001.arbitrary.desc:0 "เรียกร้องให้เรายุติธรรมและเที่ยงธรรม"
 witch.4001.sadistic.desc:0 "จะลงโทษผู้ที่โหดร้ายต่อผู้อื่น"
 witch.4001.craven.desc:0 "จะลงโทษผู้ที่ขี้ขลาดและระมัดระวังเกินไป"
 witch.4001.lustful.desc:0 "จะลงโทษหญิงแพศยาและผู้ล่วงประเวณี"
 witch.4001.vengeful.desc:0 "เรียกร้องให้เราหันแก้มอีกข้างให้"
 witch.4001.arrogant.desc:0 "คิดว่าการภูมิใจในความสำเร็จของตนเป็นบาป"
 witch.4001.fallback.desc:0 "จะลงโทษคนบาป"
 witch.4001.witch.desc:0 "แต่เหตุใดข้าต้องฟัง [annoying_clergy.GetHerHim] ในเมื่อ [ROOT.Char.GetFaith.WitchGodName] โอบรับเราอย่างที่เราเป็น ทั้งข้อบกพร่องและทุกสิ่ง? ช่างเป็นชีวิตที่น่าเศร้าเสียนี่กระไรที่ [annoying_clergy.GetFirstNameNoTooltip] ต้องมี!"
 witch.4001.impious.desc:0 "[annoying_clergy.GetFaith.HighGodName] เป็นไอ้สารเลวที่ชอบตัดสินคนอื่น!"
 witch.4001.a:0 "ข้าจะ ทำให้ [annoying_clergy.GetHerHim] เป็นตัวตลกของ [capital.GetNameNoTooltip]!"
 witch.4001.a.tt:0 "[annoying_clergy.GetFaith.HighGodName] ไม่ใช่คนเดียวที่สามารถตัดสินได้!"
 witch.4001.a.success:0 "ท่าน ทำให้ [annoying_clergy.GetShortUINameNoTooltip] กลายเป็นคนโง่"
 witch.4001.a.failure:0 "[annoying_clergy.GetShortUINameNoTooltip] ค้นพบแผนการของท่าน"
 witch.4001.c:0 "การทำตัวเหมือนคนเคร่งศาสนาที่อ่อนแอจะ ทำให้ [annoying_clergy.GetHerHim] หุบปากได้"
 witch.4001.b:0 "[annoying_clergy.GetSheHe|U] จะไม่รู้ว่าควรเชื่ออะไรเมื่อข้าจัดการกับ [annoying_clergy.GetHerHim] เสร็จแล้ว"
 witch.4001.b.success:0 "ท่านทำลายศรัทธาของ [annoying_clergy.GetShortUINamePossessiveNoTooltip] ใน [annoying_clergy.GetFaith.HighGodName]"
 witch.4001.b.neutral:0 "[annoying_clergy.GetShortUINameNoTooltip] ไม่แน่ใจ"
 witch.4001.b.neutral.tt:0 "ท่านอาจเลือกที่จะยอมแพ้หรือพยายามต่อไป"
 witch.4001.b.failure:0 "ท่านล้มเหลวในการมีอิทธิพลต่อ [annoying_clergy.GetShortUINameNoTooltip]"
 witch_4001_corruption_success_effect.tt:0 "ท่านสามารถ [blackmail|E] [annoying_clergy.GetShortUIName] เกี่ยวกับ [secret|E] ของ [annoying_clergy.GetHerHis]"
 witch.4002.witch.desc:0 "[ROOT.Char.GetFaith.WitchGodName|U] ต้องช่วยเหลือข้าแน่ เพราะแผนของข้าดำเนินไปได้ดีเกินคาด!\n\n"
 witch.4002.impious.desc:0 "แผนของข้าสมบูรณ์แบบ!\n\n"
 witch.4002.gluttonous.desc: "[annoying_clergy.GetTitledFirstName] สวาปามตัว[annoying_clergy.GetHerselfHimself]ด้วยเค้กผสมยาที่ข้าส่งไปยังห้องพักของ [annoying_clergy.GetHerHis] อย่างตะกละตะกลาม จากนั้น [annoying_clergy.GetSheHe|U] ก็เดินเตร็ดเตร่ไปทั่วเมืองโดยมีแยมและเศษขนมเปื้อนรอบปากของ [annoying_clergy.GetHerHis] ก่อนจะผล็อยหลับไปบนขั้นบันไดของ [annoying_clergy.GetFaith.HouseOfWorship]!"
 witch.4002.lustful.desc:0 "ข้าเขียนบทกวีที่โจ่งแจ้งเป็นพิเศษเกี่ยวกับ [lustful_desc.Custom2('MyCharacterIntroduction', ROOT.Char)] และ "[lustful_desc.Custom('ObjectifiedFeature')]" ของ [lustful_desc.GetHerHis] ปลอมลายเซ็นของ [annoying_clergy.GetTitledFirstNamePossessive] และส่งไปยังห้องของ [lustful_desc.GetLadyLord] [lustful_desc.GetFirstName] #EMP ไม่#! พอใจกับการอุทิศให้ และ [lustful_desc.GetSheHe] ก็ไม่ได้เก็บเรื่องนี้เป็นความลับ"
 witch.4002.craven.desc:0 "ขณะที่ [annoying_clergy.GetTitledFirstName] กำลังหลับ ข้าแอบใส่หนูเข้าไปในผ้าปูที่นอนของ [annoying_clergy.GetHerHis] ข้าแทบไม่มีเวลาซ่อนตัวก่อนที่ [annoying_clergy.GetSheHe] จะตื่นขึ้นพร้อมกับเสียงกรีดร้อง โยน [annoying_clergy.GetHerselfHimself] ออกจากเตียงและวิ่งออกจากประตูไป — เปลือยกายเหมือนวันที่ [annoying_clergy.GetSheHe] เกิด!"
 witch.4002.vengeful.desc:0 "ข้าติดสินบนเสมียนให้โน้มน้าว [annoying_clergy.GetTitledFirstName] ว่า [vengeful_desc.Custom2('MyCharacterIntroduction', ROOT.Char)] ได้ดูถูก [annoying_clergy.GetHerHim] ลับหลัง [annoying_clergy.GetHerHis] วันต่อมา [annoying_clergy.GetFirstNameNoTooltip] ก็หยาบคายอย่างเหลือเชื่อต่อ [vengeful_desc.GetFirstNameNoTooltip] ที่น่าสงสารทุกครั้งที่ [annoying_clergy.GetSheHe] มีโอกาส ในที่สุด [vengeful_desc.GetFirstNameNoTooltip] ก็เผชิญหน้ากับ [annoying_clergy.GetHerHim] เกี่ยวกับพฤติกรรมอันมุ่งร้ายของ [annoying_clergy.GetHerHis] [annoying_clergy.GetFirstNameNoTooltip] ไม่มีอะไรจะแก้ตัว"
 witch.4002.wrathful.desc:0 "ข้ารู้ดีว่า [annoying_clergy.GetTitledFirstName] เป็นคนขี้เมาที่ร้ายกาจ และ [annoying_clergy.GetSheHe] ก็หลงใหลคนรับใช้คนหนึ่งของข้าเล็กน้อย ข้าให้ [wrathful_desc.GetWomanMan] นำเหล้าที่แพงมากและแรงยิ่งกว่าไปยังห้องของ [annoying_clergy.GetTitledFirstNamePossessiveNoTooltip] ด้วยแรงจูงใจจากคำสัญญาว่าจะได้เลื่อนตำแหน่ง [wrathful_desc.GetSheHe] ทำให้ [annoying_clergy.GetHerHim] เมาทันเวลาสำหรับ [annoying_clergy.Custom('GetReligiousRite')]"
 witch.4002.arrogant.desc:0 "แม้ว่า [annoying_clergy.GetSheHe] จะพยายามซ่อนมันไว้ แต่ข้ารู้ว่า [annoying_clergy.GetTitledFirstName] กังวลเรื่องรูปลักษณ์ของ [annoying_clergy.GetHerHis] มาก [annoying_clergy.GetSheHe|U] มียาทา ซึ่ง [annoying_clergy.GetSheHe] ทาอย่างเคร่งครัดทุกเช้า ข้าแอบเข้าไปในห้องของ [annoying_clergy.GetHerHis] และเติมสมุนไพรที่ระคายเคืองลงไป วันรุ่งขึ้น ใบหน้าของ [annoying_clergy.GetTitledFirstNamePossessiveNoTooltip] ก็เต็มไปด้วยผื่นลมพิษ!"
 witch.4002.end.desc:0 "\n\nมันเป็นเรื่องเดียวที่ข้าราชบริพารของข้าพูดถึงเมื่อคืนนี้ [annoying_clergy.GetFirstNameNoTooltip] จะไม่มีวันลืมเรื่องนี้ได้เลย!"
 witch.4002.a:0 "สมควรแล้วสำหรับ [annoying_clergy.GetHerHim]!"

 witch.4003.desc:0 "ขณะซ่อนตัวในทางลับหลังห้องของ [annoying_clergy.GetTitledFirstNamePossessive] ข้าแอบฟังเสียงครวญครางและถอนหายใจของ [annoying_clergy.Custom('WomanManPossessive')] [annoying_clergy.Custom2('InsultAdjective', ROOT.Char)] อย่างร่าเริง [annoying_clergy.GetSheHe|U] ได้อ่านตำราที่ข้าทิ้งไว้บนเตียงของ [annoying_clergy.GetHerHis] — อันที่จริง [annoying_clergy.GetSheHe] ไม่สามารถวางมันลงได้เลย\n\nความจริงภายในนั้นดูเหมือนจะส่งผลกระทบสำคัญต่อศรัทธาของ [annoying_clergy.GetHerHis] "โอ้ [annoying_clergy.GetFaith.HighGodNameAlternate]! ข้าต้องการสัญญาณ! ข้าเคยเชื่อในพระองค์ ปฏิบัติตามเจตจำนงของพระองค์บนโลก แต่บัดนี้... ทั้งหมดที่ข้าเห็นคือความขัดแย้ง ความเชื่อผิดๆ... คำโกหก!"\n\nเสียงของ [annoying_clergy.GetTitledFirstNamePossessiveNoTooltip] แตกสลายเป็นเสียงสะอื้นไห้ที่จับใจความไม่ได้"
 witch.4003.a:0 "ข้าจากไป งานของข้าเสร็จสมบูรณ์แล้ว"
 witch.4003.b:0 "[annoying_clergy.GetSheHe|U] พร้อมสำหรับความจริงที่ยิ่งใหญ่กว่าแล้ว"
 witch.4003.c:0 "[annoying_clergy.GetSheHe|U] จะกลายเป็นศิษย์ของข้า!"

 witch.4004.desc:0 "ภายใต้หน้ากากอันไร้เดียงสาของการสอบถามทางเทววิทยา ข้าได้หว่านความสงสัยลงในใจของ [annoying_clergy.GetTitledFirstNamePossessive] ข้าบอกได้ว่าศรัทธาของ [annoying_clergy.GetHerHis] กำลังสั่นคลอนจากคำตอบที่ไม่แน่นอนของ [annoying_clergy.GetHerHis] และเงาแห่งความกังวลที่ปรากฏบนใบหน้าของ [annoying_clergy.GetHerHis] เมื่อ [annoying_clergy.GetSheHe] คิดว่าไม่มีใครมองอยู่\n\nข้ายังไปไม่ถึงจุดนั้น แต่ความพยายามครั้งสุดท้าย #EMP ควรจะ#! ทำลาย [annoying_clergy.GetHerHim] ได้"
 witch.4004.a:0 "มันเป็นความพยายามที่คุ้มค่า!"
 witch.4004.b:0 "เวลาของข้าควรใช้กับเรื่องอื่นดีกว่า"

 witch.4005.desc:0 "ข้าทิ้งตำราแห่งความจริงอันน่าอึดอัดไว้ในห้องของ [annoying_clergy.GetTitledFirstNamePossessive] แต่ข้าเห็น [annoying_clergy.GetHerHim] โยนมันเข้ากองไฟหลังจากอ่านไปเพียงไม่กี่หน้า ความท้าทายนี้ต้องเสริมสร้างศรัทธาของ [annoying_clergy.GetHerHis] ให้แข็งแกร่งขึ้นแน่ — ข้าไม่สามารถตรวจจับความไม่แน่นอนใดๆ ในใจของ [annoying_clergy.GetHerHis] ได้อีกต่อไป"
 witch.4005.a:0 "[annoying_clergy.GetSheHe|U] ไม่คู่ควรอยู่แล้ว!"

#PERSONAL WITCH RITUAL
 witch.4010.t:0 "ของประทานของ [ROOT.Char.GetFaith.WitchGodHerHis|U] นั้นมากมาย"
 witch.4010.desc:1 "ข้าเทของประทานลงบนผืนดิน สมุนไพร นม และน้ำผึ้ง หลับตาลงและควันฉุนเข้าจมูก ข้ายกแขนขึ้นสู่ดวงจันทร์\n\n"[ROOT.Char.GetFaith.WitchGodMistressMaster|U]! ผู้รู้ความจริงทั้งปวง [ROOT.Char.GetFaith.WitchGodMotherFather] แห่งพลังอำนาจทั้งมวล! โปรดรับของขวัญอันต่ำต้อยของข้า และโปรดชี้แนะแก่ข้าเป็นการตอบแทน!"\n\nข้าขอ [ROOT.Char.GetFaith.WitchGodName] เพื่อ..."
 witch.4010.a:0 "โชคในศิลปะแห่งความรัก"
 witch.4010.b:0 "เสน่ห์และไหวพริบ"
 witch.4010.c:0 "ความคิดของนักยุทธศาสตร์"
 witch.4010.d:0 "ความคิดเรื่องเหรียญและระเบียบ"
 witch.4010.e:0 "ความช่วยเหลือจากเงามืด"
 witch.4010.f:0 "ปัญญาและไหวพริบ"
 witch.4010.g:0 "โชคกับคมดาบ"
 witch.4010.h:0 "ความสงบทางใจ"

# Witch friends: prayer, by Mathilda Bjarnehed
 witch.4020.t:0 "การรับหรือการให้"
 witch.4020.two_witches.desc:0 "[prayer_witch_1.Custom2('MyCharacterIntroduction', ROOT.Char)|U] และ [prayer_witch_2.Custom2('MyCharacterIntroduction', ROOT.Char)] ได้เข้าร่วมกับข้าเพื่อ"
 witch.4020.one_witch.desc:0 "[prayer_witch_1.Custom2('MyCharacterIntroduction', ROOT.Char)|U] ได้เข้าร่วมกับข้าเพื่อ"
 witch.4020.full_moon.desc:0 "พิธีกรรมคืนวันเพ็ญ"
 witch.4020.new_moon.desc:0 "พิธีกรรมคืนเดือนมืด"
 witch.4020.equinox.desc:0 "พิธีกรรมวิษุวัต"
 witch.4020.solstice.desc:0 "พิธีกรรมอายัน" # Corrected from equinox
 witch.4020.end.desc:0 "เพื่อเป็นเกียรติแด่ [ROOT.Char.GetFaith.WitchGodName] ในฐานะเจ้าภาพ เป็นหน้าที่ของข้าที่จะนำพวกเราสวดภาวนา"
 witch.4020.a:0 "[ROOT.Char.GetFaith.WitchGodMistressMaster|U] ผู้ปรีชาญาณ โปรดนำความสงบและความกระจ่างมาสู่ [prayer_witch_1.GetFirstNameNoTooltip]!"
 witch.4020.b:0 "โปรดประทานพรของท่านแก่ [prayer_witch_2.GetFirstNameNoTooltip]!"
 witch.4020.c:0 "[ROOT.Char.GetFaith.WitchGodMotherFather|U] แห่งความลับ โปรดประทานพลังของท่านแก่ข้า!"

 witch.4030.t:0 "ความลับที่หุ้มด้วยหนัง"
 witch.4030.no_friend.desc:1 "ผู้ติดต่อของข้าได้ส่งตำราที่เขียนด้วยรหัสแปลกๆ มาให้ข้า ปกหนังของมันประดับด้วยสัญลักษณ์ของ [ROOT.Char.GetFaith.WitchGodMistressMaster|U] ของข้า\n\nข้าเพิ่งถอดรหัสได้เพียงไม่กี่หน้าแรกเท่านั้น แต่มันน่าหลงใหลอย่างยิ่ง"
 witch.4030.friend.desc:1 "[ROOT.GetCharacter.Custom2('RelationToMeShort' , SCOPE.sC('witch_friend'))] ที่ดีของข้า [witch_friend.GetTitledFirstName] ได้นำตำราที่เขียนด้วยรหัสแปลกๆ มาให้ข้า ปกหนังของมันประดับด้วยสัญลักษณ์ของ [ROOT.Char.GetFaith.WitchGodMistressMaster|U] ของเรา\n\n[witch_friend.GetSheHe|U] เพิ่งถอดรหัสได้เพียงไม่กี่หน้าแรกเท่านั้น แต่มันน่าหลงใหลอย่างยิ่ง"

 witch.4030.friend.a:0 "เราจะไขความลับของมันด้วยกัน"
 witch.4030.no_friend.a:0 "ข้าจะไขความลับของมัน ไม่ว่าจะใช้เวลานานเท่าใด!"
 witch.4030.b:0 "ข้ารู้จักผู้ศรัทธาร่วมคนหนึ่งที่จะจ่ายทองอย่างงามเพื่อสิ่งนี้"
 witch.4030.c:0 "แม้ แต่ [convince_target_1.GetTitledFirstNameNoTooltip] ก็จะถูกล่อลวงด้วยความลับเหล่านี้"
 witch.4030.c.success:0 "[convince_target_1.GetShortUIName|U] หลงใหลในตำรา"
 witch.4030.c.failure:0 "[convince_target_1.GetShortUIName|U] เผาตำรา"
 witch.4030.d:0 "[convince_target_2.GetTitledFirstNameNoTooltip] จะพบว่าสิ่งนี้ #EMP น่าสนใจ#! อย่างยิ่ง"
 witch.4030.d.success:0 "[convince_target_2.GetShortUIName|U] หลงใหลในตำรา"
 witch.4030.d.failure:0 "[convince_target_2.GetShortUIName|U] เผาตำรา"

 witch.4031.start.desc:0 "ข้ามองเห็นตำราได้อย่างชัดเจน ซึ่งข้าทิ้งไว้ท่ามกลางสิ่งของของ [convince_target.GetTitledFirstNamePossessive] จากรูแอบมองหลัง [convince_target.Custom('GetChamber')] ของ [convince_target.GetHerHis] สายตาของ [convince_target.GetHerHis|U] ถูกดึงดูดไปที่มันทันทีที่ [convince_target.GetSheHe] ก้าวข้ามธรณีประตู ราวกับว่าหนังสือเล่มนั้นมีเวทมนตร์แปลกๆ ของตัวเอง\n\n"
 witch.4031.end.desc:0 "เมื่อ [convince_target.GetFirstNameNoTooltip] อ่านหน้าที่แปลเสร็จแล้ว [convince_target.GetSheHe] ก็เริ่มเดินไปมา ในที่สุด แรงดึงดูดของตำราดูเหมือนจะต้านทานไม่ได้ [convince_target.GetSheHe] รีบคว้าปากกาขนนกของ [convince_target.GetHerHis]"
 witch.4031.a:0 "ถูกต้องแล้ว สหายข้า เจาะลึกลงไป ลึกลงไปอีก..."

 witch.4032.end.desc:0 "[convince_target.GetFirstNameNoTooltip] ไม่แม้ แต่จะเปิดหนังสือ เสียงหอบหายใจดังออกมาจากริมฝีปากของ [convince_target.GetHerHis] เมื่อ [convince_target.GetSheHe] เห็นสัญลักษณ์แปลกๆ และ [convince_target.GetSheHe] ก็โยนมันทิ้งไปจาก [convince.GetHerselfHimself]"
 witch.4032.a:0 "#EMP ไม่!#! ขอให้ [ROOT.Char.GetFaith.HighGodName] สาปแช่งคนโง่ไร้กระดูกสันหลังผู้นี้!"
