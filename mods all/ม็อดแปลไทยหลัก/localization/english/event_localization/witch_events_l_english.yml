 #Invitation
 witch.3001.t:0 "ถึง [ROOT.Char.Custom('SisterBrother')|U] [ROOT.Char.GetFirstNameNoTooltip] ที่รัก,"
 witch.3001.desc:0 "ถึงเวลาสำหรับ $activity_witch_ritual$ ของชุมนุมแม่มด [host.GetHouse.GetBaseNameNoTooltip] แล้ว ข้าขอเชิญท่านมาบูชา [ROOT.Char.GetFaith.WitchGodName] ในคืนวันเพ็ญ เราจะร่วมกันขับขานพระนามของ [ROOT.Char.GetFaith.WitchGodHerHis|U] และเจาะลึกสู่ความลี้ลับของ [ROOT.Char.GetFaith.WitchGodHerHis|U]!"
 witch.3001.a:0 "ข้ารอไม่ไหวแล้ว!"
 witch.3001.b:0 "ข้ายอมกินทากสักชามเสียดีกว่า"

 #Uninvited guest
 witch.3003.t:2 "แขกที่ไม่ได้รับเชิญ"
 witch.3003.desc:1 "ขณะที่เพื่อนแม่มดของข้าเดินทางมาถึง [capital.GetNameNoTooltip] ข้าเหลือบไปเห็นใบหน้าที่ไม่คุ้นเคย\n\nเมื่อข้าไปทักทาย [inviter.Custom2('MyCharacterIntroduction', ROOT.Char)], [inviter.GetSheHe] แนะนำ [new_guest.GetWomanMan] แปลกหน้าว่าเป็น [new_guest.GetFirstName] ปรากฏว่าพวกเขาเป็นคนรู้จักเก่า และ [inviter.GetFirstNameNoTooltip] ถามว่า [new_guest.GetFirstNameNoTooltip] สามารถเข้าร่วมพิธีกรรมของเราได้หรือไม่"
 witch.3003.a:0 "ยิ่งมากยิ่งสนุก!"
 witch.3003.b:0 "ท่านจะเป็นแขกผู้มีเกียรติของข้า [new_guest.GetFirstNameNoTooltip]"
 witch.3003.c:0 "$activity_witch_ritual$ เป็นเรื่องส่วนตัว"

 #No one attended
 witch.3002.t:1 "ขาดความศรัทธา"
 witch.3002.desc:0 "ไม่มีใครตอบรับคำเชิญของข้าเลยแม้ แต่คนเดียว พวกเขาไม่สมควรได้รับพรจาก [ROOT.Char.GetFaith.WitchGodName]!"
 witch.3002.a:0 "พวกเขาจะได้รู้ถึงความพิโรธของ [ROOT.Char.GetFaith.WitchGodHerHis|U]"

 #Starting event
 every_grand_rite_participant:0 "แขกทุกคนที่ $activity_witch_ritual$"
 witch.3010.t:2 "จันทร์เพ็ญขึ้น"
 witch.3010.desc:0 "ขณะที่ดวงจันทร์ลอยขึ้นสู่สรวงสวรรค์ เป็นสัญญาณการมาถึงของ [ROOT.Char.GetFaith.WitchGodHerHis|U] ข้ารู้สึกได้ว่าร่างกายของข้าตอบสนองต่อพลังงานแปลกประหลาดในอากาศ เงาร่างรอบกองไฟใหญ่นั้นเงียบสงัด ไม่เคลื่อนไหว รอคอยสิ่งที่จะมาถึง\n\nในฐานะเจ้าภาพของการชุมนุมนี้ เป็นหน้าที่ของข้าที่จะเริ่มพิธีกรรม ข้าจะ..."
 witch.3010.a:0 "อ่านจากตำราเวทมนตร์โบราณ"
 witch.3010.a.great:0 "การแปลของข้าน่าประทับใจ"
 witch.3010.a.poor:0 "การแปลของข้าแย่"
 witch.3010.b:0 "เล่นกลกับเสียงและเงา"
 witch.3010.b.great:0 "กลของข้าน่าตื่นตาตื่นใจ"
 witch.3010.b.poor:0 "กลของข้าน่าหัวเราะ"
 witch.3010.c:0 "อาศัยเสน่ห์ของข้าและด้นสด"
 witch.3010.c.great:0 "การด้นสดของข้าสร้างแรงบันดาลใจ"
 witch.3010.c.poor:0 "การด้นสดของข้าไม่ปะติดปะต่อ"
 witch.3010.d:0 "ถวายเครื่องบูชาอันยิ่งใหญ่"
 witch.3010.e:0 "สวดภาวนาตามประเพณี"
 witch.3010.e.tt:0 "[activity.GetName] ดำเนินต่อไปตามปกติ"

 #What to do after the rite
 witch.3014.host.great_translation.desc:0 "ถ้อยคำโบราณนั้นแปลกประหลาด แต่กลับสื่อสารกับข้าในระดับสัญชาตญาณ มันถักทอรูปแบบอันน่าหลงใหล เต็มไปด้วยความงามและคำมั่นสัญญา แขกของข้าตกอยู่ในภวังค์อย่างสิ้นเชิง\n\nขณะที่ข้าปิดตำราเวทมนตร์ด้วยท่าทางอันน่าทึ่ง เสียงโห่ร้องยินดีของพวกเขาก็ดังก้องไปทั่วลานโล่ง"
 witch.3014.host.poor_translation.desc:0 "ไม่ว่าข้าจะพยายามเพียงใด ถ้อยคำโบราณก็ไม่สามารถเข้าใจได้ สีหน้าของแขกเปลี่ยนจากกระตือรือร้น เป็นสับสน และเป็นผิดหวัง ก่อนที่ข้าจะ ทำให้ตัวเองขายหน้าไปมากกว่านี้ ข้าด้นสดตอนจบที่น่าผิดหวังน้อยลงเล็กน้อย ฝูงชนแยกย้ายกันไปอย่างรวดเร็วเมื่อข้าเสร็จสิ้น"
 witch.3014.host.great_tricks.desc:0 "พรของ [ROOT.Char.GetFaith.WitchGodName] นั้นมีมากมาย และหนึ่งในนั้นคือการรู้ว่าเมื่อใดควรใช้เล่ห์กลเล็กน้อย ด้วยความช่วยเหลือของกระจกเงา เขา และผู้ช่วยที่เต็มใจ ข้าได้จัดการแสดงอันน่าตื่นตาตื่นใจ อากาศอบอวลไปด้วยความตื่นเต้นระคนความกลัว ข้าจำไม่ได้ว่าครั้งสุดท้ายที่รู้สึกมีชีวิตชีวา เช่นนี้คือเมื่อใด!"
 witch.3014.host.poor_tricks.desc:0 "แม้ว่ากลของข้าจะใช้ได้ผลดีเมื่อข้าฝึกซ้อมคนเดียวในห้อง แต่ดูเหมือนว่าคืนนี้ข้าจะประหม่า ไม่มีใครเชื่อเลย — ข้าถึงกับได้ยินเสียงใครบางคนกลั้นหัวเราะอยู่ด้านหลังฝูงชน ก่อนที่ข้าจะ ทำให้ตัวเองขายหน้าไปมากกว่านี้ ข้าด้นสดตอนจบพิธีอย่างรวดเร็ว"
 witch.3014.host.great_improvisation.desc:0 "ขณะที่ข้านำฝูงชนผ่านพิธี ข้าศึกษาปฏิกิริยาของพวกเขาอย่างระมัดระวังและปรับเปลี่ยนคำพูดของข้าตามนั้น ไม่นานนัก ข้าก็โต้คลื่นแห่งความตื่นเต้นของพวกเขา เสียงเชียร์อันเร่าร้อนเป็นเชื้อเพลิงให้ข้าขณะที่ข้าสร้างไปสู่จุดสุดยอดอันงดงาม เราไปถึงจุดนั้นด้วยกัน ส่งเสียงหอนเรียกนามของ [ROOT.Char.GetFaith.WitchGodHerHis|U] สู่ดวงจันทร์เป็นหนึ่งเดียว"
 witch.3014.host.poor_improvisation.desc:0 "บางทีข้าควรจะเตรียมตัวให้ดีกว่านี้ การด้นสดของข้าขาดความกระตือรือร้นและวกวน ข้ารู้ว่าข้ากำลังสูญเสียความสนใจของฝูงชน ดังนั้นในท้ายที่สุด ข้าจึงหันไปใช้คำอธิษฐานตามประเพณี ฝูงชนแยกย้ายกันไปอย่างรวดเร็วเมื่อข้าเสร็จสิ้น"
 witch.3014.host.offering.desc:0 "เราทุกคนต่างรู้ดีถึงความโปรดปรานของ [ROOT.Char.GetFaith.WitchGodHerHis|U] ที่มีต่ออาหารและเครื่องดื่มอันหรูหรา โต๊ะนั้นหนักอึ้งไปด้วยขนมหวาน ถังไวน์ ผลไม้แปลกตา และพายเนย เราถวายสิ่งที่ดีที่สุดแด่ [ROOT.Char.GetFaith.WitchGodName] ร่วมกัน ก่อนที่เราจะเลี้ยงฉลองส่วนที่เหลือด้วยตนเอง"
 witch.3014.host.fallback.desc:0 "คำอธิษฐานเก่าแก่อาจไม่ซับซ้อน แต่ก็ไม่ใช่เรื่องง่าย สั้นและตรงประเด็น พวกมันบรรจุความจริงอันศักดิ์สิทธิ์และทรงพลังที่สุดของ [ROOT.Char.GetFaith.WitchGodHerHis|U] การท่องซ้ำอีกครั้งเปรียบเสมือนการตกอยู่ในอ้อมกอดอันปลอดภัยของมารดา"
 witch.3014.guest.start.desc:0 "ในยามเย็นของมหาพิธีกรรม เรารวมตัวกันในลานโล่งอันเงียบสงบ กองไฟใหญ่ให้ความอบอุ่นแก่หลังของเรา และอากาศก็อบอวลไปด้วยความตื่นเต้น"
 witch.3014.guest.good.desc:0 "[host.GetTitledFirstName] นำเราผ่านพิธีอันน่าตื่นตาตื่นใจ คำอธิษฐานโบราณหลั่งไหลออกจากลิ้นของเราเป็นรูปแบบอันน่าหลงใหล เต็มไปด้วยความงามและคำมั่นสัญญา เราเริ่มเต้นรำ สร้างไปสู่จุดสุดยอดอันงดงาม เราไปถึงจุดนั้นด้วยกัน ส่งเสียงหอนเรียกนามของ [ROOT.Char.GetFaith.WitchGodHerHis|U] สู่ดวงจันทร์เป็นหนึ่งเดียว"
 witch.3014.guest.bad.desc:0 "[host.GetTitledFirstName] นำเราผ่านพิธีอันน่าอึดอัด [host.GetSheHe|U] พยายามอย่างหนักที่จะ ทำให้ค่ำคืนนี้พิเศษ แต่ความพยายามของ [host.GetHerHis] นั้นอ่อนแอ อย่างน้อยรายชื่อแขกก็ยังน่าสนใจ..."
 witch.3014.guest.fallback.desc:0 "[host.GetTitledFirstName] นำเราผ่านพิธีด้วยถ้อยคำและท่าทางที่ถูกต้องทั้งหมด คำอธิษฐานโบราณหลั่งไหลออกจากลิ้นของเราเป็นรูปแบบอันน่าหลงใหล แต่ความงามและพลังที่มักจะมาพร้อมกับมันกลับลดน้อยลง [host.GetTitledFirstNameNoTooltip] ทำได้ดีพอสมควร แต่ถึงกระนั้นก็ยังมีบางอย่างขาดหายไป"
 witch.3014.host.end.desc:0 "\n\nบัดนี้พิธีหลักได้เสร็จสิ้นลงแล้ว แขกของข้าและข้ามีอิสระที่จะบูชาตามที่เราพอใจ"
 witch.3014.guest.end.desc:0 "\n\nบัดนี้พิธีหลักได้เสร็จสิ้นลงแล้ว เรามีอิสระที่จะบูชาตามที่เราพอใจ"
 witch.3014.a:0 "ทดลองสมุนไพรร่วมกับ [herbalist.GetFirstNameNoTooltip]"
 witch.3014.a.knowledge:0 "[herbalist.GetFirstNameNoTooltip] สอนสิ่งใหม่แก่ข้า"
 witch.3014.a.inspiration:0 "การสนทนาสร้างแรงบันดาลใจ"
 witch.3014.b.start:0 "ขอให้ [teacher.GetFirstNameNoTooltip] สอนข้าในศิลปะแห่ง"
 witch.3014.b.diplomacy:0 "เสน่ห์"
 witch.3014.b.martial:0 "กลยุทธ์"
 witch.3014.b.stewardship:0 "การค้า"
 witch.3014.b.intrigue:0 "การวางแผน"
 witch.3014.b.learning:0 "กวีนิพนธ์"
 witch.3014.c:0 "แบ่งปันของประทานทางกามารมณ์ของ [ROOT.Char.GetFaith.WitchGodHerHis|U] กับใครสักคน"
 witch.3014.c.tt:1 "ท่านพยายามหาคนที่มีแรงกระตุ้นคล้ายกัน"
 witch.3014.d:0 "ใช้เวลากับ [new_guest.GetFirstNameNoTooltip] ผู้ [new_guest.Custom('ComplimentAdjective')]"
 witch.3014.e:0 "[sex_partner.Custom('LoverPetName')] ของข้าอยู่ที่ไหน? ข้าปรารถนาสัมผัสของ [sex_partner.GetHerHis]..."
 witch.3014.d.move_in:0 "เราเข้ากันได้ดีเยี่ยม"
 witch.3014.d.friend:0 "เราเข้ากันได้ดี"
 witch.3014.d.enemy:0 "เราโต้เถียงกันอย่างเผ็ดร้อน"
 witch.3014.f:1 "หัวเราะ ดื่ม เต้นรำ — เพลิดเพลินกับพรของ [ROOT.Char.GetFaith.WitchGodHerHis|U]!"

 #Regular seduction event
 witch.3015.t:1 "ริมสระน้ำ"
 witch.3015.start.desc:0 "พลังของ [ROOT.Char.GetFaith.WitchGodName] กำลังเต้นระรัวในเส้นเลือดของข้าขณะที่ข้าเดินเข้าไปในป่า เสียงครวญครางประสานกันต้อนรับข้า — ข้าไม่ใช่คนเดียวที่ปรารถนาเพื่อนในคืนนี้\n\n"
 witch.3015.new_guest.desc:0 "ข้าบังเอิญพบคนรู้จักใหม่ของข้า [sex_partner.GetFirstName] ริมสระน้ำใต้แสงจันทร์"
 witch.3015.regular.desc:0 "ข้าพบ [sex_partner.Custom2('MyCharacterIntroduction', ROOT.Char)] ริมสระน้ำใต้แสงจันทร์"
 witch.3015.end.desc:0 "ขณะที่ข้ามองเข้าไปในดวงตาของ [sex_partner.GetHerHis] ทุกอย่างก็เข้าที่เข้าทาง นี่คือเจตจำนงของ [ROOT.Char.GetFaith.WitchGodHerHis|U] [sex_partner.GetSheHe|U] กวักมือเรียกข้าเข้ามาใกล้..."
 witch.3015.a:0 "ให้เราบูชาร่วมกันเถิด"
 witch.3015.b:0 "ข้า... กำลังมองหาคนอื่นอยู่"
 witch.3015.b.tt:1 "ท่านใช้เวลาทั้งคืนตามลำพัง"

 #Lover/spouse seduction event
 witch.3016.t:1 "ดวงดาวเรียงตัว"
 witch.3016.end.desc:0 "เสียงที่คุ้นเคยเรียกหาข้า — คือ [sex_partner.Custom2('MyCharacterIntroductionNoComma', ROOT.Char)] ขณะที่ข้าหันไปสบตากับ [sex_partner.GetHerHis] ทุกอย่างก็เข้าที่เข้าทาง เราสองคน... มันคือเจตจำนงของ [ROOT.Char.GetFaith.WitchGodHerHis|U] เราถูกกำหนดมาให้อยู่ด้วยกัน"
 witch.3016.a:0 "ตลอดไป"
 witch.3016.b:0 "ข้า... ข้ายังไม่พร้อมสำหรับเรื่องนี้"

 #Soulmate seduction event
 witch.3017.end.desc:0 "ข้าไม่เห็นว่า [sex_partner.GetFirstName] ไปที่ไหน แต่ข้าไม่จำเป็นต้องเห็น ข้าถูกดึงดูดเข้าหา [sex_partner.GetHerHim] เหมือนแม่เหล็กดึงดูดเหล็ก เมื่อข้าพบ [sex_partner.GetHerHim] ไม่มีแววประหลาดใจในดวงตาอันงดงามของ [sex_partner.GetHerHis] — มีเพียงความรักและความปรารถนา"
 witch.3017.a:0 "ข้าเฝ้าปรารถนาท่านเพียงใด"
 witch.3017.b:0 "ข้า... ลืมบางอย่าง! ขออภัย!"

