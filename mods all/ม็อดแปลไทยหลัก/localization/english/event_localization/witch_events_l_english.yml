 witch.3098.t:1 "จนกว่าจะถึงครั้งหน้า"
 witch.3098.start.desc:0 "แขกของข้าและข้า"
 witch.3098.end.desc:0 "ได้บูชา [ROOT.Char.GetFaith.WitchGodName] แลกเปลี่ยนความรู้ศักดิ์สิทธิ์ และผูกพันธะอันลึกซึ้ง จิตใจของข้าเต็มไปด้วยความคิดใหม่ๆ แต่ร่างกายของข้าต้องการพักผ่อนอย่างยิ่ง เตียงอุ่นๆ ไม่เคยน่าดึงดูดใจเท่านี้มาก่อน"
 witch.3098.a:0 "ขอให้ [ROOT.Char.GetFaith.WitchGodSheHe|U] คุ้มครองเราจนกว่าจะถึง $activity_witch_ritual$ ครั้งต่อไป"
 witch.3099.start.desc:0 "ร่วมกัน เรา"
 witch.3099.tt:0 "ท่านเดินทางกลับบ้านเมื่อ $activity_witch_ritual$ สิ้นสุดลง"


