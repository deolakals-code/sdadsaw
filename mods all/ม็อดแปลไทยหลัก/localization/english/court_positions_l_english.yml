 court_astrologer_celestial: "นักพยากรณ์"
 court_astrologer_celestial_desc: "$court_astrologer_celestial$ เฝ้าดูฟากฟ้าเพื่อทำนายชะตากรรมที่อาจรอพวกเราอยู่"
 travel_leader_celestial_imperial: "ผู้เบิกทาง"
 travel_leader_celestial_imperial_desc: "$travel_leader_celestial_imperial$ ช่วยเหลือท่านยามเดินทางและรับผิดชอบกำหนดการเดินทางทั้งหมด พวกเขามุ่งหมายให้แน่ใจว่าท่านจะไปถึงจุดหมายปลายทางอย่างปลอดภัยและตรงเวลา"
 travel_leader_celestial: "หน่วยสอดแนมล่วงหน้า"
 travel_leader_celestial_desc: "$travel_leader_celestial$ ช่วยเหลือท่านยามเดินทางและรับผิดชอบกำหนดการเดินทางทั้งหมด พวกเขามุ่งหมายให้แน่ใจว่าท่านจะไปถึงจุดหมายปลายทางอย่างปลอดภัยและตรงเวลา"
 antiquarian_celestial: "ผู้ดูแลสมบัติ"
 antiquarian_celestial_desc: "$antiquarian_celestial$ รับผิดชอบการบำรุงรักษา การดูแล และการจัดหาโบราณวัตถุ"
 seneschal_celestial: "หัวหน้าผู้ดูแล"
 seneschal_celestial_desc: "$seneschal_celestial$ รับบทบาทสำคัญในชีวิตประจำวันของราชสำนัก โดยดูแลเหล่าคนรับใช้และ ทำให้ทุกอย่างดำเนินไปอย่างราบรื่น"
 court_tutor_celestial: "อาจารย์ผู้รอบรู้"
 court_tutor_celestial_desc: "$court_tutor_celestial$ รับผิดชอบ [education|E] ของเด็กทุกคนในราชสำนัก และทักษะของพวกเขาจะมีผลต่ออิทธิพลที่พวกเขามีต่อนักเรียน เด็ก ๆ ยังคงสามารถมี [guardians|E] ส่วนตัวได้"
 chief_eunuch_celestial_imperial: "มหาดเล็กหลวง"
 chief_eunuch_celestial_imperial_desc: "$chief_eunuch_celestial_imperial$ เป็นคนรับใช้ที่ไว้ใจได้ ซึ่งรับผิดชอบเหล่าขันทีในราชสำนัก แทบไม่มีสิ่งใดเกิดขึ้นโดยที่พวกเขาไม่ได้ยิน ทั้งในหมู่คนรับใช้และเชื้อพระวงศ์"
 chief_eunuch_celestial: "มหาดเล็กขันที"
 chief_eunuch_celestial_desc: "$chief_eunuch_celestial$ เป็นคนรับใช้ที่ไว้ใจได้ ซึ่งรับผิดชอบเหล่าขันทีในราชสำนัก แทบไม่มีสิ่งใดเกิดขึ้นโดยที่พวกเขาไม่ได้ยิน ทั้งในหมู่คนรับใช้และเชื้อพระวงศ์"
 master_of_horse_celestial_imperial: "เจ้ากรมม้า"
 master_of_horse_celestial_imperial_desc: "$master_of_horse_celestial_imperial$ รับผิดชอบม้าทรงสง่างามและโรงม้าของเจ้าศักดินา พวกเขามีงานที่ต้องทำอย่างหนัก เนื่องจากม้าที่ได้รับการดูแลอย่างดีนั้นเป็นคุณประโยชน์ทั้งในสนามรบและบนท้องถนน"
 master_of_horse_celestial: "นายโรงม้า"
 master_of_horse_celestial_desc: "$master_of_horse_celestial$ รับผิดชอบม้าทรงสง่างามและโรงม้าของเจ้าศักดินา พวกเขามีงานที่ต้องทำอย่างหนัก เนื่องจากม้าที่ได้รับการดูแลอย่างดีนั้นเป็นคุณประโยชน์ทั้งในสนามรบและบนท้องถนน"
 master_of_hunt_celestial: "ผู้ควบคุมการล่าสัตว์"
 master_of_hunt_celestial_desc: "$master_of_hunt_celestial$ รับผิดชอบคณะล่าสัตว์ใด ๆ ที่สมาชิกราชสำนักของเจ้าศักดินาจัดขึ้น พวกเขายังรับผิดชอบคอกสุนัขและสุนัขในนั้นด้วย"
 cave_hermit_celestial: "ฤๅษีผู้ปราดเปรื่อง"
 cave_hermit_celestial_desc: "$cave_hermit_celestial$ คือผู้ที่จะอาศัยในบริเวณปราสาทของท่านและให้ความบันเทิงแก่แขกของท่านด้วยคำทำนายและปริศนา บางคนกล่าวว่าพวกเขาอาจเป็นผู้มีญาณวิเศษจริง ๆ"
 court_gardener_celestial_imperial: "หัวหน้าคนสวน"
 court_gardener_celestial_imperial_desc: "$court_gardener_celestial_imperial$ รับผิดชอบความเป็นอยู่ที่ดีของสวนที่ ของเจ้าศักดินาของตน โดยทุ่มเทเวลาและทักษะเพื่อ ทำให้สวนงอกงามอย่างแท้จริง"
 court_gardener_celestial: "คนสวน"
 court_gardener_celestial_desc: "$court_gardener_celestial$ รับผิดชอบความเป็นอยู่ที่ดีของสวนที่ ของเจ้าศักดินาของตน โดยทุ่มเทเวลาและทักษะเพื่อ ทำให้สวนงอกงามอย่างแท้จริง"
 chronicler_celestial_imperial: "มหาอาลักษณ์"
 chronicler_celestial_imperial_desc: "$chronicler_celestial_imperial$ ได้รับมอบหมายให้บันทึกการกระทำของนายจ้างลงบนหน้ากระดาษ"
 chronicler_celestial: "ผู้บันทึก"
 chronicler_celestial_desc: "$chronicler_celestial$ ได้รับมอบหมายให้บันทึกการกระทำของนายจ้างลงบนหน้ากระดาษ"
 champion_celestial_imperial: "ขุนพลพยัคฆ์"
 champion_celestial_imperial_desc: "$champion_celestial_imperial$ คือนักสู้ผู้มีทักษะและอันตรายที่สามารถเป็นตัวแทนเจ้าศักดินาในการประลอง"
 champion_celestial: "ทหารพยัคฆ์"
 champion_celestial_desc: "$champion_celestial$ คือนักสู้ผู้มีทักษะและอันตรายที่สามารถเป็นตัวแทนเจ้าศักดินาในการประลอง"
 court_brewmaster_celestial: "พนักงานดูแลไวน์"
 court_brewmaster_celestial_desc: "$court_brewmaster_celestial$ เป็นตัวแทนที่ได้รับเลือกให้มีปฏิสัมพันธ์โดยตรงกับผู้ผลิตเบียร์ในอาณาจักร เพื่อให้แน่ใจว่าเจ้าศักดินาจะได้ครอบครองเครื่องดื่มที่ดีที่สุด"
 lady_in_waiting_celestial_imperial: "นางสนองพระโอษฐ์"
 lady_in_waiting_celestial_imperial_desc: "$lady_in_waiting_celestial_imperial$ คือผู้ช่วยและสหายของราชินีหรือจักรพรรดินี คอยดูแลทุกความต้องการและเติมเต็มทุกความปรารถนา"
 lady_in_waiting_celestial: "นางกำนัล"
 lady_in_waiting_celestial_desc: "$lady_in_waiting_celestial$ คือผู้ช่วยและสหายของราชินีหรือจักรพรรดินี คอยดูแลทุกความต้องการและเติมเต็มทุกความปรารถนา"
 royal_architect_celestial: "นายช่างใหญ่"
 royal_architect_celestial_desc: "$royal_architect_celestial$ ดูแลโครงการก่อสร้างอันทรงเกียรติใด ๆ ภายในอาณาจักร ไม่มีการวางอิฐแม้ แต่ก้อนเดียว หรือใช้เวลาแม้ แต่วินาทีเดียว หากไม่ได้รับอนุญาตโดยชัดแจ้งจากพวกเขา"
 court_poet_celestial: "กวีเอก"
 court_poet_celestial_desc: "$court_poet_celestial$ คือผู้เชี่ยวชาญด้านถ้อยคำและบทกวี มอบความบันเทิง การกระตุ้นทางปัญญา และประสบการณ์ทางอารมณ์แก่เจ้าศักดินาและทุกคนในราชสำนัก"
 court_musician_celestial_imperial: "ปรมาจารย์ด้านดนตรี"
 court_musician_celestial_imperial_desc: "$court_musician_celestial_imperial$ คือศิลปินผู้ขับร้องและบรรเลงเครื่องดนตรีเพื่อสร้างความบันเทิงแก่เจ้าศักดินาและราชสำนัก"
 court_musician_celestial: "นักดนตรี"
 court_musician_celestial_desc: "$court_musician_celestial$ คือศิลปินผู้ขับร้องและบรรเลงเครื่องดนตรีเพื่อสร้างความบันเทิงแก่เจ้าศักดินาและราชสำนัก"
 bodyguard_celestial_imperial: "ทหารราชองครักษ์"
 bodyguard_celestial_imperial_desc: "$bodyguard_celestial_imperial$ คือแนวป้องกันสุดท้ายต่อผู้โจมตีใด ๆ ก็ตาม พวกเขาจะติดตามผู้ที่ตนคุ้มกันไปทุกที่ และจะไม่ลังเลที่จะเอาตัวเองเข้าขวางอันตรายใด ๆ ที่อาจซุ่มซ่อนอยู่"
 bodyguard_celestial: "ทหารรักษาการณ์ประจำครัวเรือน"
 bodyguard_celestial_desc: "$bodyguard_celestial$ คือแนวป้องกันสุดท้ายต่อผู้โจมตีใด ๆ ก็ตาม พวกเขาจะติดตามผู้ที่ตนคุ้มกันไปทุกที่ และจะไม่ลังเลที่จะเอาตัวเองเข้าขวางอันตรายใด ๆ ที่อาจซุ่มซ่อนอยู่"
 court_artificer_celestial_imperial: "ช่างศิลป์หลวง"
 court_artificer_celestial_imperial_desc: "$court_artificer_celestial_imperial$ คือผู้ที่พิสูจน์ตนเองแล้วว่าสามารถสร้างสรรค์สิ่งที่ยอดเยี่ยมได้ แม้ส่วนใหญ่จะใช้เวลาอยู่ในราชสำนักของท่าน แต่ก็หวังว่าแรงบันดาลใจจะเกิดขึ้นอีกครั้ง"
 court_artificer_celestial: "ช่างศิลป์"
 court_artificer_celestial_desc: "$court_artificer_celestial$ คือผู้ที่พิสูจน์ตนเองแล้วว่าสามารถสร้างสรรค์สิ่งที่ยอดเยี่ยมได้ แม้ส่วนใหญ่จะใช้เวลาอยู่ในราชสำนักของท่าน แต่ก็หวังว่าแรงบันดาลใจจะเกิดขึ้นอีกครั้ง"

 grand_preceptor_court_position: "มหาอาจารย์"
 grand_preceptor_court_position_desc: "$grand_preceptor_court_position$ คือเสาหลักทางศีลธรรมของราชสำนัก หน้าที่ของพวกเขาคือการเป็นดั่งประทีปแห่งความชอบธรรม เพื่อให้ผู้อื่นชื่นชมและเอาเป็นแบบอย่าง"
 grand_preceptor_court_position_task_instill_righteousness: "ปลูกฝังคุณธรรมความชอบธรรม"
 grand_preceptor_court_position_task_instill_righteousness_desc: "$grand_preceptor_court_position$ จะอุทิศตนเพื่อการบ่มเพาะศีลธรรมแก่เจ้าศักดินา"
 grand_preceptor_court_position_task_propagate_civic_virtue: "เผยแพร่คุณธรรมพลเมือง"
 grand_preceptor_court_position_task_propagate_civic_virtue_desc: "$grand_preceptor_court_position$ จะรับบทบาทนำในการเผยแพร่คุณธรรมทางศีลธรรมในหมู่ประชากรทั่วไป"
 grand_preceptor_court_position_task_exalt_imperial_deeds: "ยกย่องการกระทำของจักรพรรดิ"
 grand_preceptor_court_position_task_exalt_imperial_deeds_desc: "ในฐานะ $grand_preceptor_court_position$ ถ้อยคำของตัวละครนี้มีอำนาจทางศีลธรรมอันยิ่งใหญ่ และมีผู้คนมากมายที่พร้อมจะยอมรับคำกล่าวของพวกเขาว่าเป็นความจริง"

 grand_preceptor_powerfuL_family_score_desc: "$grand_preceptor_court_position$"

 grand_guardian_court_position: "มหาผู้พิทักษ์"
 grand_guardian_court_position_desc: "$grand_guardian_court_position$ คือดาบและโล่แห่งอาณาจักร ผู้ ซึ่งเป็นที่เคารพนับถือในประสบการณ์การต่อสู้และปัญญาเชิงกลยุทธ์"
 grand_guardian_court_position_task_guard_the_capital: "พิทักษ์เมืองหลวง"
 grand_guardian_court_position_task_guard_the_capital_desc: "$grand_guardian_court_position$ จะรับผิดชอบการคุ้มครองความปลอดภัยของเมืองหลวงแห่งจักรวรรดิ"
 grand_guardian_court_position_task_shield_the_realm: "ปกป้องอาณาจักร"
 grand_guardian_court_position_task_shield_the_realm_desc: "$grand_guardian_court_position$ จะใช้ทักษะทางยุทธศาสตร์อันน่าเกรงขามของตนในการป้องกันอาณาจักรโดยรวม"
 grand_guardian_court_position_task_instill_martial_discipline: "ปลูกฝังวินัยทหาร"
 grand_guardian_court_position_task_instill_martial_discipline_desc: "$grand_guardian_court_position$ จะพยายามปลูกฝังบทเรียนที่สั่งสมมาจากอาชีพการงานอันโดดเด่นของตนให้แก่ผู้ที่ขาดประสบการณ์"
 grand_guardian_guard_the_capital_modifier: "ได้รับการพิทักษ์โดยมหาผู้พิทักษ์"
 MODIFIER_DEFINITION_VALUE_GRAND_GUARDIAN_APTITUDE: "\t#weak เพิ่มขึ้นต่อระดับ [aptitude|E] ของ $grand_guardian_court_position$#!"

 grand_guardian_powerfuL_family_score_desc: "$grand_guardian_court_position$"

 grand_mentor_court_position: "มหาพี่เลี้ยง"
 grand_mentor_court_position_desc: "$grand_mentor_court_position$ ดูแลการขัดเกลาทางปัญญาของราชวงศ์ และได้รับมอบหมายหน้าที่อันหนักอึ้งในการ ทำให้แน่ใจว่าคนรุ่นต่อไปจะเจริญรอยตามแบบอย่างอันสูงส่งของบรรพบุรุษ"

 grand_mentor_court_position_task_edify_heirs: "สั่งสอนทายาทจักรพรรดิ"
 grand_mentor_court_position_task_edify_heirs_desc: "$grand_mentor_court_position$ จะอุทิศวันเวลาให้กับการบ่มเพาะคนรุ่นต่อไปอย่างขยันขันแข็ง"
 grand_mentor_edify_heirs_tt: "ทุกเดือน สมาชิกของ [house|E] ผู้ปกครองที่เป็น [courtiers|E] หรือ [direct_vassals|E] ของ [liege|E] อาจได้รับ [diplomacy_i][stewardship_i][learning_i][martial_i][skills|E], [GetTrait('governor').GetName( GetPlayer )] หรือ [GetTrait('confucian_education').GetName( GetPlayer )] [trait_level_track_xp|E]"
 grand_mentor_edify_heirs_fallback: "ทุกเดือน สมาชิกของ [house|E] ผู้ปกครองที่เป็น [courtiers|E] หรือ [direct_vassals|E] ของ [liege|E] อาจได้รับ [diplomacy_i][stewardship_i][learning_i][martial_i][skills|E], [GetTrait('governor').GetName( GetPlayer )] หรือ [GetTrait('confucian_education').GetName( GetPlayer )] [trait_level_track_xp|E]"

 grand_mentor_court_position_task_teach_liege: "ขัดเกลาจักรพรรดิ"
 grand_mentor_court_position_task_teach_liege_desc: "$grand_mentor_court_position$ จะดูแลการขัดเกลาเจ้าศักดินาของตนโดยเฉพาะ"
 grand_mentor_teach_liege_tt: "ทุกเดือน [liege|E] อาจได้รับ [diplomacy_i][stewardship_i][learning_i][martial_i][skills|E], [GetTrait('governor').GetName( GetPlayer )] หรือ [GetTrait('confucian_education').GetName( GetPlayer )] [trait_level_track_xp|E]"
 grand_mentor_teach_liege_fallback: "ทุกเดือน [liege|E] อาจได้รับ [diplomacy_i][stewardship_i][learning_i][martial_i][skills|E], [GetTrait('governor').GetName( GetPlayer )] หรือ [GetTrait('confucian_education').GetName( GetPlayer )] [trait_level_track_xp|E]"

 grand_mentor_court_position_task_train_officials: "บ่มเพาะขุนนางผู้ทรงคุณ"
 grand_mentor_court_position_task_train_officials_desc: "$grand_mentor_court_position$ จะดูแลให้ขุนนางของอาณาจักรมีทักษะทัดเทียมกับสติปัญญาและคุณธรรมของพวกเขา"
 grand_mentor_train_officials_tt: "ทุกเดือน ผู้ดำรง [court_position|E] หรือ [direct_vassal|E] อาจได้รับ [diplomacy_i][stewardship_i][learning_i][martial_i][skills|E], [GetTrait('governor').GetName( GetPlayer )] หรือ [GetTrait('confucian_education').GetName( GetPlayer )] [trait_level_track_xp|E] หรือ [merit|E]"
 grand_mentor_train_officials_fallback: "ทุกเดือน ผู้ดำรง [court_position|E] หรือ [direct_vassal|E] อาจได้รับ [diplomacy_i][stewardship_i][learning_i][martial_i][skills|E], [GetTrait('governor').GetName( GetPlayer )] หรือ [GetTrait('confucian_education').GetName( GetPlayer )] [trait_level_track_xp|E] หรือ [merit|E]"

 grand_mentor_mentoring_title: "กำลังสั่งสอน [target_character.GetFullNameNoTooltip]"
 grand_mentor_mentoring_notification_desc: "[ROOT.Char.GetShortUIName|U] ได้พัฒนาทักษะของ [target_character.GetTitledFirstNamePossessive]"

 grand_mentor_powerfuL_family_score_desc: "$grand_mentor_court_position$"

 fire_dragon_engineer_court_position: "วิศวกรมังกรเพลิง"
 fire_dragon_engineer_court_position_desc: "$fire_dragon_engineer_court_position$ คือผู้เชี่ยวชาญด้านอาวุธปืน จัดหาเครื่องมือสงครามพ่นไฟอันน่าเกรงขามให้แก่กองทัพ"
 fire_dragon_engineer_court_position_forge_fire_dragons: "สร้างมังกรเพลิง"
 fire_dragon_engineer_court_position_forge_fire_dragons_desc: "$fire_dragon_engineer_court_position$ จะมุ่งเน้นพลังงานไปที่การสร้างอาวุธปืน โดยรักษาคลังแสงให้มีอยู่มากมายและพร้อมใช้อยู่เสมอ"
 fire_dragon_engineer_court_position_command_artillery: "บัญชาการปืนใหญ่"
 fire_dragon_engineer_court_position_command_artillery_desc: "$fire_dragon_engineer_court_position$ จะควบคุมการใช้งานและการใช้เครื่องมือทำลายล้างของตนในสนามรบเป็นการส่วนตัว"

 keeper_of_the_harem_court_position: "ผู้ดูแลฮาเร็ม"
 keeper_of_the_harem_court_position_desc: "$keeper_of_the_harem_court_position$ ดำรงตำแหน่งที่มีความสำคัญไม่น้อยในฮาเร็มหลวง ดูแลทุกสิ่งตั้งแต่เครื่องนุ่งห่มของเหล่านางสนมไปจนถึงการกำหนดเวลาอันเป็นมงคลสำหรับการถวายตัว"

 keeper_of_the_harem_court_position_task_maintain_decorum: "รักษาความเรียบร้อยของฮาเร็ม"
 keeper_of_the_harem_court_position_task_maintain_decorum_desc: "$keeper_of_the_harem_court_position$ จะมุ่งเน้นไปที่การปราบปรามเล่ห์อุบายอันชั่วร้ายของฮาเร็ม และปกป้องฮาเร็มจากการสอดส่องอันไม่พึงประสงค์จากโลกภายนอก"
 keeper_of_the_harem_maintaining_decorum.tt: "$keeper_of_the_harem_court_position$ จะขัดขวาง [schemes|U] ที่มุ่งเป้าไปที่สมาชิกของฮาเร็มอย่างมีนัยสำคัญ"

 keeper_of_the_harem_court_position_task_attend_to_wellness: "ดูแลสุขภาพของนางสนม"
 keeper_of_the_harem_court_position_task_attend_to_wellness_desc: "$keeper_of_the_harem_court_position$ จะให้ความสนใจเป็นพิเศษต่อสุขภาพและความเป็นอยู่ที่ดีของฮาเร็ม โดยรักษาผู้ป่วยและแบ่งเบาภาระของพวกนาง"
 keeper_of_the_harem_attend_to_wellness.tt: "$keeper_of_the_harem_court_position$ จะมองหาและดูแลสมาชิกฮาเร็มที่ป่วยทุกเดือน บรรเทาความเครียดและอาการป่วยไข้ของพวกนาง"

 keeper_of_the_harem_court_position_task_select_palace_beauties: "คัดเลือกโฉมงามเข้าวัง"
 keeper_of_the_harem_court_position_task_select_palace_beauties_desc: "$keeper_of_the_harem_court_position$ จะทบทวนองค์ประกอบของฮาเร็มเป็นระยะ ปลดเกษียณผู้สูงอายุและไร้บุตรอย่างนุ่มนวล พร้อมทั้งรับสมัครผู้มีความสามารถและงดงามมาทดแทน"
 keeper_of_the_harem_select_palace_beauties.tt: "ทุกปี $keeper_of_the_harem_court_position$ อาจปลดเกษียณนางสนมที่สูงอายุและไร้บุตรหนึ่งคน และรับสมัครนางสนมใหม่หนึ่งคนเข้าฮาเร็ม"

 court_guru_court_position: "คุรุ"
 court_guru_court_position_desc: "คุรุทำหน้าที่เป็นทั้งที่ปรึกษาและปราชญ์ ให้คำแนะนำแก่ผู้ปกครองเกี่ยวกับข้อกังวลทางโลกและความจริงอันศักดิ์สิทธิ์"
 guru_teach_learning: "ส่องสว่างจิตใจ"
 guru_teach_learning_desc: "คุรุแบ่งปันตำราศักดิ์สิทธิ์และภูมิปัญญาทางวิชาการเพื่อลับสติปัญญาของเจ้าศักดินา"
 guru_teach_diplomacy: "ขัดเกลาวาจา"
 guru_teach_diplomacy_desc: "คุรุสั่งสอนในเรื่องวาทศิลป์ในราชสำนัก ความเงียบที่เหมาะสม และศิลปะแห่งการโน้มน้าวใจอย่างสง่างาม"
 guru_teach_intrigue: "ลับประสาทสัมผัส"
 guru_teach_intrigue_desc: "ผ่านนิทานอุทาหรณ์และเกมอันแยบยล คุรุฝึกฝนผู้ปกครองให้มองเห็นแรงจูงใจที่ซ่อนอยู่และล่อลวงอย่างสุขุม"

 court_brahmin_court_position: "พราหมณ์ราชสำนัก"
 court_brahmin_court_position_desc: "พราหมณ์ราชสำนักเป็นนักบวชผู้น่าเคารพที่พบได้ทั้งในราชสำนักฮินดูและพุทธ มีหน้าที่ประกอบพิธีกรรม ดูแลพระราชพิธี และส่งเสริมความชอบธรรมของผู้ปกครอง"
 court_brahmin_court_position_task_increase_tribute: "เพิ่มเครื่องบรรณาการ"
