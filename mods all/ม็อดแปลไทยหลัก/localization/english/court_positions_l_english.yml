 court_physician_celestial_imperial: "แพทย์หลวง"
 court_physician_celestial_imperial_desc: "$court_physician_celestial_imperial$ มีหน้าที่รับผิดชอบต่อสุขภาพและความเป็นอยู่ที่ดีของ [court|E] ที่ตนสังกัด พวกเขาจะรักษาโรคและเย็บบาดแผลอย่างสุดความสามารถ"
 court_physician_celestial: "แพทย์ใหญ่"
 court_physician_celestial_desc: "$court_physician_celestial$ มีหน้าที่รับผิดชอบต่อสุขภาพและความเป็นอยู่ที่ดีของ [court|E] ที่ตนสังกัด พวกเขาจะรักษาโรคและเย็บบาดแผลอย่างสุดความสามารถ"
 court_astrologer_celestial_imperial: "โหรหลวง"
