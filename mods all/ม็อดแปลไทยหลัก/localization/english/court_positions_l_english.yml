 court_poet_court_position:0 "กวีหลวง"
 court_poet_employer_custom_effect_description:2 "$BULLET$อาจได้รับ [inspired|E] แบบสุ่ม"
 court_poet_court_position_desc:1 "$court_poet_court_position$ เป็นผู้เชี่ยวชาญด้านคำและบทกวี มอบความบันเทิง การกระตุ้นทางปัญญา และประสบการณ์ทางอารมณ์ให้กับเจ้าเหนือหัวและทุกคนในราชสำนัก"
 poet_inspired_message:0 "แรงบันดาลใจมาเยือน!"
 poet_inspired_effect:0 "[GetCourtPositionType('court_poet_court_position').GetName()] [inspired_poet.GetFirstName] ของท่านได้รับ [inspiration|E]"
 courtier_inspired_message: "$poet_inspired_message$"
 courtier_inspired_effect: "[courtier|E] ของท่าน [inspired_courtier.GetFirstName] ได้รับ @inspiration_icon![inspiration|E]"
 court_poet_skald: "สกัลด์ประจำราชสำนัก"
 court_poet_skald_desc: "$court_poet_skald$ เป็นผู้เชี่ยวชาญด้านถ้อยคำและบทกวี ผู้มอบความบันเทิง การกระตุ้นทางสติปัญญา และประสบการณ์ทางอารมณ์แก่เจ้านายและผู้คนทั้งปวงในราชสำนัก"

 bodyguard_court_position:0 "องครักษ์"
 bodyguard_court_position_nomadic: "เคชิก"
 bodyguard_employer_custom_effect_description:3 "$BULLET$มีโอกาสป้องกันแผนการ [GetScheme('murder').GetTypeName] [schemes|E] ลอบสังหาร#!\n#indent_newline:3 $BULLET$ลดความเสี่ยงที่ท่านจะเสียชีวิตหรือถูกจับใน [battles|E] ที่ท่านทั้งสองเข้าร่วมรบ#!#!"
 stooge_employer_custom_effect_description: "$BULLET$ปลดล็อกตัวเลือกพิเศษในเหตุการณ์\n#indent_newline:3 $BULLET$ปลดล็อกการตัดสินใจ $humiliate_the_stooge_decision$ [decision|E]#!#!"
 bodyguard_court_position_desc:1 "$bodyguard_court_position$ คือแนวป้องกันสุดท้ายต่อผู้โจมตีทั้งหมด ไม่ว่าผู้ที่พวกเขาคุ้มกันจะไปที่ใด พวกเขาก็ตามไป และพวกเขาจะไม่ลังเลที่จะเอาตัวเองเข้าขวางอันตรายใดๆ ที่อาจซุ่มซ่อนอยู่"
 bodyguard_court_position_nomadic_desc: "$bodyguard_court_position_nomadic$ ได้รับเกียรติให้ถวายการอารักขาแด่เจ้าเหนือหัว ทั้งในยามศึกและยามสงบ แบ่งเป็นกองอารักขากลางวันและกองอารักขากลางคืน พวกเขาย่อมพร้อมสละชีพได้ทุกเมื่อ"

 champion_court_position:1 "ยอดฝีมือส่วนตัว"
 champion_employer_custom_effect_description:3 "$BULLET$สามารถเข้าร่วม [single_combat_duel_plural|E] บางอย่างแทนท่านได้\n[AddLocalizationIf( HasDlcFeature( 'tours_and_tournaments' ), 'champion_employer_custom_effect_description_TOTO_DLC' )]"
 champion_employer_custom_effect_description_TOTO_DLC:1 "$BULLET$ได้รับ [prestige|E] ให้ท่านเมื่อแข่งขันใน [GetActivityType( 'activity_tournament' ).GetName]"
 champion_court_position_desc:1 "$champion_court_position$ เป็นนักสู้ที่มีทักษะและอันตราย ซึ่งสามารถเป็นตัวแทนของเจ้าเหนือหัวในการประลองได้"
 champion_compete_task: "แข่งขันในนาม"
 champion_compete_task_desc: "ตัวละครนี้กำลังเข้าร่วมการประลองในท้องถิ่นทั่วอาณาจักรอย่างแข็งขันในนามของเจ้าเหนือหัวของตน"
 champion_exercise_ruler: "ออกกำลังกายกับผู้ปกครอง"
 champion_exercise_ruler_desc: "ตัวละครนี้ได้รับมอบหมายให้ดูแลให้เจ้าเหนือหัวของตนมีสุขภาพดีและแข็งแรง"
 champion_exercise_ruler_fallback_tt: "[liege|E] อาจได้รับ [prowess_i][prowess_skill|E] ทุกเดือน"
 champion_exercise_ruler_title: "ออกกำลังกายกับ [ROOT.Char.GetShortUIName]"
 champion_exercise_ruler_notification_desc: "[liege.GetShortUIName|U] [CharHaveHas( liege )] ได้รับการสั่งสอนจาก [ROOT.Char.GetShortUIName]"
 champion_improve_self: "พัฒนาทักษะ"
 champion_improve_self_desc: "ตัวละครนี้กำลังมุ่งเน้นไปที่การพัฒนาทักษะของตนในฐานะยอดฝีมือส่วนตัว"
