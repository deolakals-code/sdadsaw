 court_tutor_court_position:0 "พระอาจารย์ / อาจารย์"
 court_tutor_court_position_desc:1 "$court_tutor_court_position$ รับผิดชอบดูแล [education|E] ของเด็กทุกคนในราชสำนัก และทักษะของพวกเขาจะมีอิทธิพลต่อการมีอิทธิพลต่อนักเรียนมากน้อยเพียงใด เด็กๆ ยังคงสามารถมี [guardians|E] ส่วนตัวได้"
 court_tutor_employer_custom_effect_description:3 "$BULLET$ทำหน้าที่เป็น [guardian|E] สำหรับ [children|E] ที่ไม่มีผู้ดูแล\n$BULLET$ปลดล็อกปฏิสัมพันธ์ #V $make_child_learn_language_interaction$#! [interaction|E]"
 court_tutor_improve_others: "สอนราชสำนัก"
 court_tutor_improve_others_desc: "ตัวละครนี้ได้รับมอบหมายให้ช่วยเหลือส่วนที่เหลือของราชสำนัก"
 court_tutor_improve_others_title: "สอนโดย [ROOT.Char.GetName]"
