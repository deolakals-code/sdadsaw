 cherbi_court_position: "เชอร์บิ"
 cherbi_court_position_fallback: "หัวหน้าองครักษ์"
 cherbi_court_position_desc: "$cherbi_court_position$ ดูแล $bodyguard_court_position_nomadic$, รับประกันความปลอดภัยของเจ้าเหนือหัว ในฐานะหัวหน้าผู้ดูแลความปลอดภัยของเจ้าเหนือหัว จึงเป็นหนึ่งในตำแหน่งอันทรงเกียรติที่สุดของชนเผ่า"
