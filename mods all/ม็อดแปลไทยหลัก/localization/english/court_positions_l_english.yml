 court_tutor_improve_others_fallback_tt: "[liege|E], [heir|E] ของเจ้าเหนือหัว หรือผู้ดำรงตำแหน่ง [court_position|E] อื่นๆ ที่ [court|E] อาจได้รับ [diplomacy_i][stewardship_i][learning_i][martial_i][skills|E] หรือ [traits|E] ทุกเดือน"
 court_tutor_teach_kids: "ให้การศึกษาแก่เด็ก"
 court_tutor_teach_kids_desc: "ตัวละครนี้กำลังทำหน้าที่เกินกว่าหน้าที่ในการให้การศึกษาแก่เด็กๆ ในราชสำนัก"
 court_tutor_teach_kids_title: "พระอาจารย์สอนเด็ก"
 court_tutor_teach_kids_notification_desc: "[court_owner.Custom2('RelationToMeShort', SCOPE.sC('child') )] ของท่านได้รับการสอนจาก [court_tutor_scope.GetShortUIName]"
 court_tutor_teach_kids_notification_desc_you: "ท่านได้รับการสั่งสอนจาก [court_tutor_scope.GetShortUIName]"
 court_tutor_teach_kids_tt: "[children|E] ที่ [court|E] มีโอกาสที่จะเพิ่ม [diplomacy_i][stewardship_i][learning_i][martial_i][skills|E] หนึ่งอย่างของพวกเขาขึ้น #p +1#! หรือ #p +2#! ทุกปี"
 
 royal_architect_court_position:0 "สถาปนิกหลวง"
 royal_architect_court_position_desc:1 "$royal_architect_court_position$ ดูแลโครงการก่อสร้างอันทรงเกียรติใดๆ ภายในอาณาจักร ไม่มีการวางอิฐก้อนเดียว หรือใช้เวลาแม้ แต่วินาทีเดียว โดยไม่ได้รับอนุญาตอย่างชัดแจ้งจากพวกเขา"
 royal_architect_fortify_lands: "เสริมความแข็งแกร่งให้ดินแดน"
 royal_architect_fortify_lands_desc: "ตัวละครนี้ได้รับมอบหมายให้ดูแลความปลอดภัยของดินแดนและประชาชนของเจ้าเหนือหัวของตน"
 royal_architect_public_works: "การโยธา"
