 yurtchi_court_position_fallback: "พลาธิการ"
 yurtchi_court_position_desc: "$yurtchi_court_position$ ดูแลการจัดระเบียบและความเป็นอยู่ของชนเผ่า ตลอดจนดูแลให้ชนเผ่ามีความพร้อมรบอย่างดี"
