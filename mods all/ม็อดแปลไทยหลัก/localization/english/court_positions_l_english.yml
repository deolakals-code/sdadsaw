 court_physician_tradition_bonus:0 "จาก [culture_tradition|E]"
 court_physician_court_position_desc:1 "$court_physician_court_position$ รับผิดชอบต่อสุขภาพและความเป็นอยู่ที่ดีของ [court|E] ที่พวกเขาอยู่ พวกเขาจะรักษาโรคและเย็บบาดแผลอย่างสุดความสามารถ"
 court_physician_employer_custom_effect_description:4 "$BULLET$ดำเนินการ [medical_treatments|E]"
 court_physician_not_employed_or_away_tt: "ท่านไม่มี [GetCourtPositionType('court_physician_court_position').GetName()] หรือพวกเขาไม่ได้อยู่กับท่าน"
 
 hire_physician_decision:0 "ค้นหาแพทย์หลวง"
 hire_physician_decision_tooltip:3 "คนรับใช้ของท่านจะแนะนำผู้สมัครที่เหมาะสมจำนวนหนึ่งสำหรับตำแหน่ง [GetCourtPositionType('court_physician_court_position').GetName()]"
 hire_physician_decision_desc: "$court_physician_court_position$ เป็นสิ่งจำเป็นในการดูแลผู้ป่วยและผู้บาดเจ็บที่ [ROOT.Char.Custom('GetCourtLower')] ของข้าพเจ้า ข้าพเจ้าจะขอให้คนรับใช้นำเสนอผู้สมัครที่เหมาะสมจำนวนหนึ่ง"
 hire_physician_decision_effect_tooltip:4 "ท่านจะได้รับเสนอชื่อผู้สมัคร [GetCourtPositionType('court_physician_court_position').GetName()] กลุ่มหนึ่ง และอาจจ้างหนึ่งในนั้นโดยเสียค่าธรรมเนียมและเงินเดือนรายเดือน [gold_i][SCOPE.ScriptValue('court_position_physician_salary')]"
 hire_physician_decision_confirm:0 "เริ่มการค้นหา"
 
