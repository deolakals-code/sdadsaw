 antiquarian_employer_custom_effect_reforge_description: "$BULLET$ ทำให้ท่านสามารถ [reforge|E] [artifacts|E] ได้\n"

 chief_eunuch_court_position:1 "หัวหน้าขันที"
 chief_eunuch_court_position_desc:1 "$chief_eunuch_court_position$ เป็นคนรับใช้ที่ไว้ใจได้ รับผิดชอบดูแลขันทีในราชสำนัก ไม่ค่อยมีอะไรเกิดขึ้นที่พวกเขาไม่ได้ยิน ทั้งในหมู่คนรับใช้และเชื้อพระวงศ์"
 keeper_of_swans_court_position:0 "ผู้ดูแลหงส์หลวง"
 keeper_of_swans_court_position_desc:1 "$keeper_of_swans_court_position$ รับผิดชอบดูแลหงส์หลวง การนับจำนวนสิ่งมหัศจรรย์มีปีกที่เจ้าเหนือหัวของตนอ้างสิทธิ์และดูแลพวกมัน ตำแหน่งนี้มาพร้อมกับความรับผิดชอบอันใหญ่หลวง"

 master_of_horse_court_position:0 "เจ้ากรมม้า"
 master_of_horse_court_position_desc:1 "$master_of_horse_court_position$ รับผิดชอบดูแลม้าทรงและคอกม้าอันสง่างามของเจ้าเหนือหัว พวกเขามีงานที่ต้องทำมากมาย เนื่องจากม้าที่ได้รับการดูแลอย่างดีเป็นประโยชน์ทั้งในสนามรบและบนท้องถนน"
 master_of_horse_oversee_breeding: "ดูแลการเพาะพันธุ์"
 master_of_horse_oversee_breeding_desc: "ตัวละครนี้ได้รับมอบหมายให้ดูแลการเพาะพันธุ์ม้าในคอกม้าหลวง"
 master_of_horse_mightiest_warhorse: "การดูแลม้าศึก"
 master_of_horse_mightiest_warhorse_desc: "มีเพียงม้าที่ดีที่สุดเท่านั้นที่คู่ควรกับผู้ปกครองที่รักสงคราม"

 court_jester_court_position:0 "ตัวตลกหลวง"
 court_jester_employer_custom_effect_description:1 "$BULLET$ปลดล็อกการตัดสินใจ #V $jester_entertainment_decision$#! [decision|E]"
 court_jester_court_position_desc:1 "$court_jester_court_position$ – คนโง่เขลา – อยู่ที่นั่นเพื่อสร้างความบันเทิงให้กับทั้งเจ้าเหนือหัวและแขกที่มาเยือนราชสำนัก ในขณะที่การพูดจาคมคายอาจได้รับการชื่นชมเป็นครั้งคราว การล้มอย่างน่าเกลียดมักจะเรียกเสียงหัวเราะได้เสมอ"
 master_of_hunt_court_position:0 "เจ้ากรมการล่าสัตว์"
 master_of_hunt_court_position_nomadic: "นายพรานหลวง"
 master_of_hunt_employer_custom_effect_description:4 "$BULLET$[GetActivityType('activity_hunt').GetName] [hunt_success_chance_no_prefix|E] เพิ่มขึ้นตาม [aptitude|E]"
 master_of_hunt_employee_custom_effect_description: "เพิ่ม [hunt_success_chance_no_prefix|E] ใน [GetActivityType('activity_hunt').GetName]"
 master_of_hunt_court_position_desc:1 "$master_of_hunt_court_position$ รับผิดชอบต่อคณะล่าสัตว์ใดๆ ที่สมาชิกในราชสำนักของเจ้าเหนือหัวจัดขึ้น พวกเขายังรับผิดชอบดูแลคอกสุนัขและสุนัขในนั้นด้วย"
 master_of_hunt_court_position_nomadic_desc: "$master_of_hunt_court_position_nomadic$ มีหน้าที่รับผิดชอบในการจัดขบวนป่าใหญ่ และประกันความสำเร็จในการล่าสัตว์เพื่อเจ้าเหนือหัวของตน"
 high_almoner_court_position:0 "สมุหพระอัลโมนเนอร์"
 high_almoner_court_position_desc:1 "$high_almoner_court_position$ รับผิดชอบแจกจ่ายทานให้กับคนยากจนที่สมควรได้รับและราษฎรอื่นๆ ที่ต้องการความช่วยเหลือ"
 cupbearer_court_position:0 "พนักงานเชิญจอก"
 cupbearer_employer_custom_effect_description:3 "$BULLET$โอกาสในการหยุดยั้งแผนการ [GetScheme('murder').GetTypeName] [schemes|E] ด้วยยาพิษ#!"
 cupbearer_court_position_desc:1 "$cupbearer_court_position$ รับผิดชอบในการรินเครื่องดื่มที่โต๊ะเสวยและดูแลให้แน่ใจว่าถ้วยของทุกคนไม่เคยว่างเปล่า"

 seneschal_court_position:0 "เซเนสชาล"
 seneschal_court_position_desc:1 "$seneschal_court_position$ มีบทบาทสำคัญในชีวิตประจำวันของครัวเรือนหลวง บริหารจัดการคนรับใช้และ ทำให้ทุกอย่างดำเนินไปอย่างราบรื่น"
 seneschal_improve_court: "จัดระเบียบราชสำนัก"
 seneschal_improve_court_desc: "ตัวละครนี้กำลังจัดระเบียบราชสำนัก เพื่อให้แน่ใจว่าทุกคนทำงานของตน"
 seneschal_improve_court_task_tt: "@aptitude:4:color_green![aptitude|E] ของ [court_positions|E] อื่นๆ: #p +[SCOPE.ScriptValue('seneschal_improve_court_value')|0]#!"
 seneschal_improve_court_task_fallback_tt: "@aptitude:4:color_green![aptitude|E] ของ [court_positions|E] อื่นๆ: #p +2/+10#!"
 seneschal_improve_domain: "จัดการเขตปกครอง"
 seneschal_improve_domain_desc: "ตัวละครนี้ได้รับมอบหมายให้จัดการอาณาจักรของเจ้าเหนือหัวของตน"
 seneschal_handling_estate: "จัดการคฤหาสน์"
 seneschal_handling_estate_desc: "ตัวละครนี้ได้รับมอบหมายให้ดูแลคฤหาสน์ของเจ้าเหนือหัวของตน"

 antiquarian_court_position:0 "นักสะสมโบราณวัตถุ"
