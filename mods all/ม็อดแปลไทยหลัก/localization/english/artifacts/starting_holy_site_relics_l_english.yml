l_english:
 artifact_relic_peter_bones_name: "อัฐิของนักบุญเปโตร"
 artifact_relic_peter_bones_desc: "อัฐิของอัครสาวกเปโตร ผู้เป็นหัวหน้าเหล่าอัครสาวกและอธิการองค์แรกแห่งโรม"
 artifact_relic_paul_bones_name: "อัฐิของนักบุญเปาโล"
 artifact_relic_paul_bones_desc: "อัฐิของอัครสาวกเปาโล ผู้พลีชีพที่อากวาซัลเวียส"
 artifact_relic_crown_of_thorns_name: "มงกุฎหนาม"
 artifact_relic_crown_of_thorns_desc: "มงกุฎหนามที่ถูกกดลงบนพระเศียรของพระคริสต์ก่อนการตรึงกางเขน"
 artifact_relic_baptist_arm_name: "แขนขวาของนักบุญยอห์นผู้ให้บัพติศมา"
 artifact_relic_baptist_arm_desc: "ท่อนแขนขวาของยอห์นผู้ให้บัพติศมา เล่าขานว่าเป็นมือที่ให้บัพติศมาแด่พระคริสต์ในแม่น้ำจอร์แดน"
 artifact_relic_true_cross_name: "เศษไม้กางเขนแท้"
 artifact_relic_true_cross_desc: "เสี้ยนไม้จากกางเขนที่พระคริสต์ถูกตรึง ประดิษฐานไว้ในหีบบรรจุพระธาตุหุ้มทอง"
 artifact_relic_bones_of_james_name: "อัฐิของนักบุญเจมส์"
 artifact_relic_bones_of_james_desc: "อัฐิของอัครสาวกเจมส์ผู้เฒ่า ซึ่งดึงดูดผู้แสวงบุญจากทั่วคริสตจักร"
 artifact_relic_mark_name: "ศีรษะของนักบุญมาระโก"
 artifact_relic_mark_desc: "ศีรษะที่ถูกตัดขาดของมาระโกผู้นิพนธ์พระวรสาร ผู้ก่อตั้งศาสนจักรแห่งอเล็กซานเดรีย"
 artifact_relic_lance_antioch_name: "หอกศักดิ์สิทธิ์แห่งอันทิโอก"
 artifact_relic_lance_antioch_desc: "ปลายหอกเหล็กที่เล่าขานว่าแทงทะลุสีข้างของพระคริสต์"
 artifact_relic_tabot_name: "ทาบอตแห่งพันธสัญญา"
 artifact_relic_tabot_desc: "แผ่นศิลาที่ผ่านการถวายตัว เป็นตัวแทนของหีบพันธสัญญา ได้รับการเคารพบูชาว่าเป็นพระธาตุศักดิ์สิทธิ์ที่สุดของเอธิโอเปีย"
 artifact_relic_nine_saints_name: "อัฐิของนักบุญทั้งเก้า"
 artifact_relic_nine_saints_desc: "อัฐิของนักบุญทั้งเก้า ซึ่งเป็นพระภิกษุชาวซีเรียที่หนีข้อพิพาทแห่งคาลซีดอนไปยังอักซุม และก่อตั้งอารามแห่งแรกของเอธิโอเปีย หยั่งรากคริสต์ศาสนาแบบเมียฟิซิตไปทั่วที่ราบสูง"
 artifact_relic_thomas_name: "พระธาตุของอัครสาวกโทมัส"
 artifact_relic_thomas_desc: "อัฐิและปลายหอกเปื้อนเลือดของอัครสาวกโทมัส ผู้เล่าขานกันว่านำศรัทธามาสู่รัฐเกรละและพลีชีพที่นั่น"
 artifact_relic_augustine_pallium_name: "ผ้าพาลเลียมของนักบุญออกัสติน"
 artifact_relic_augustine_pallium_desc: "ผ้าพาลเลียมที่ออกัสตินแห่งแคนเทอร์เบอรีสวมใส่ อาร์ชบิชอปองค์แรกและอัครทูตผู้นำศาสนามาสู่ชาวอังกฤษ"
 artifact_relic_three_magi_name: "พระธาตุของโหราจารย์ทั้งสาม"
 artifact_relic_three_magi_desc: "อัฐิของนักปราชญ์ทั้งสามผู้ตามดาวไปยังเบธเลเฮม"
 artifact_relic_becket_name: "พระธาตุของนักบุญโทมัส เบ็กเก็ต"
 artifact_relic_becket_desc: "อาภรณ์ชุ่มเลือดและกะโหลกของโทมัส เบ็กเก็ต ผู้พลีชีพในมหาวิหารของตนเองเมื่อปี 1170 และได้รับการยกย่องอย่างรวดเร็วว่าเป็นนักบุญผู้ยิ่งใหญ่ที่สุดของคริสตจักรอังกฤษ"
 artifact_relic_ursula_name: "อัฐิของนักบุญอุร์ซูลา"
 artifact_relic_ursula_desc: "อัฐิของอุร์ซูลาและเหล่าหญิงพรหมจารีผู้พลีชีพที่ร่วมทางกับนาง ขุดพบในสุสานของเมืองโคโลญ"
 artifact_relic_ignatius_name: "อัฐิของนักบุญอิกเนเชียส"
 artifact_relic_ignatius_desc: "อัฐิของอิกเนเชียส อัครบิดรองค์ที่สองแห่งอันทิโอกและศิษย์ของอัครสาวกยอห์น ผู้พลีชีพที่กรุงโรมในรัชสมัยจักรพรรดิทราจัน"
 artifact_relic_black_stone_name: "เศษศิลาดำ"
 artifact_relic_black_stone_desc: "เศษหินสีดำขัดเงาที่แยกออกมาจากศิลาดำแห่งกะอ์บะฮ์ ซึ่งท่านศาสดาทรงจุมพิตด้วยพระองค์เอง และผู้แสวงบุญฮัจญ์ทุกคนเคารพบูชา"
 artifact_relic_dhulfiqar_name: "ซุลฟิการ"
 artifact_relic_dhulfiqar_desc: "ดาบปลายแยกของท่านศาสดา เล่าขานว่าทรงมอบแก่อะลี และได้รับการเคารพทั่วอุมมะฮ์ในฐานะสัญลักษณ์ของการปกครองที่พระเจ้าทรงรับรอง"
 artifact_relic_buraq_footprint_name: "รอยเท้าของบุรอก"
 artifact_relic_buraq_footprint_desc: "ศิลาที่มีรอยกีบเท้าซึ่งบุรอกทิ้งไว้ เมื่อท่านศาสดาเสด็จขึ้นสู่สรวงสวรรค์จากศิลาฐานราก ณ นครเยรูซาเลม"
 artifact_relic_sword_of_ali_name: "ดาบของอะลี"
 artifact_relic_sword_of_ali_desc: "คมดาบที่เชื่อกันว่าอะลี อิบน์ อบี ฏอลิบ เคยใช้ในสมรภูมิบะดร์และศิฟฟีน"
 artifact_relic_abu_hanifa_turban_name: "ผ้าโพกศีรษะของอบู ฮะนีฟะฮ์"
 artifact_relic_abu_hanifa_turban_desc: "ผ้าโพกศีรษะนักปราชญ์ของอบู ฮะนีฟะฮ์ อัน-นุอ์มาน ผู้ก่อตั้งมัซฮับฮะนาฟี เสาหลักแห่งนิติศาสตร์สุหนี่สำหรับผู้แสวงบุญฮะนาฟีทุกคน"
 artifact_relic_prophet_sandals_name: "รองเท้าแตะของท่านศาสดา"
 artifact_relic_prophet_sandals_desc: "รองเท้าแตะหนังที่เล่าขานว่าท่านศาสดาทรงสวมใส่ ช่างฝีมือผู้ศรัทธาทั่วอุมมะฮ์ลอกแบบเป็นรูปนะอ์ลไม่รู้จบ"
 artifact_relic_western_wall_name: "ศิลาแห่งกำแพงตะวันตก"
 artifact_relic_western_wall_desc: "ศิลาที่สกัดขึ้นรูปจากกำแพงกันดินด้านตะวันตกของลานพระวิหารหลังที่สอง เป็นหนึ่งในซากเพียงไม่กี่ชิ้นที่ยังยืนอยู่หลังโรมันทำลายพระวิหารเมื่อปี ค.ศ. 70"
 artifact_relic_tablets_name: "เศษแผ่นศิลา"
 artifact_relic_tablets_desc: "เศษหินที่เล่าขานว่าแตกออกมาจากแผ่นศิลาบัญญัติบนภูเขาซีนาย เมื่อโมเสสขว้างมันลงด้วยความโกรธ"
 artifact_relic_bodhi_leaf_name: "ใบแห่งต้นโพธิ์"
 artifact_relic_bodhi_leaf_desc: "ใบไม้ที่เก็บรักษาไว้จากต้นโพธิ์ ณ พุทธคยา ซึ่งพระพุทธเจ้าทรงตรัสรู้ใต้ร่มไม้นั้น"
 artifact_relic_vajrasana_name: "เศษวัชราสนะ"
 artifact_relic_vajrasana_desc: "เศษชิ้นขัดเงาของวัชราสนะ บัลลังก์เพชรใต้ต้นโพธิ์ที่พระพุทธเจ้าประทับนิ่งไม่ไหวติงจนถึงนาทีแห่งการตรัสรู้"
 artifact_relic_dhamek_name: "พระสารีริกธาตุแห่งธรรมเมขสถูป"
 artifact_relic_dhamek_desc: "พระธาตุศักดิ์สิทธิ์ของพระพุทธเจ้าจากสารนาถ สถานที่ที่พระองค์ทรงแสดงธรรมแก่เหล่าสาวกกลุ่มแรก"
 artifact_relic_jowo_name: "โจโว ศากยมุนี"
 artifact_relic_jowo_desc: "พระพุทธรูปที่ผ่านการอัญเชิญของพระพุทธเจ้าในวัยหนุ่ม นำมาจากจีน และชาวทิเบตถือว่าเป็นพระพุทธรูปที่ศักดิ์สิทธิ์ที่สุด"
 artifact_relic_sacred_tooth_name: "พระเขี้ยวแก้วของพระพุทธเจ้า"
 artifact_relic_sacred_tooth_desc: "พระเขี้ยวแก้วเบื้องซ้ายของพระพุทธเจ้า อัญเชิญมาจากกลิงคะในศตวรรษที่ 4 เป็นเครื่องคุ้มครองราชบัลลังก์ ผู้ใดครอบครองย่อมได้รับความชอบธรรมเหนือผู้ปกครองทั้งปวง"
 artifact_relic_lingam_name: "ศิวลึงค์วิศวนาถ"
 artifact_relic_lingam_desc: "เศษศักดิ์สิทธิ์ของศิวลึงค์จากมหาเทวสถานแห่งพาราณสี นครศักดิ์สิทธิ์ที่สุดริมฝั่งแม่น้ำคงคา"
 artifact_relic_trishul_name: "ตรีศูลของพระศิวะ"
 artifact_relic_trishul_desc: "พระตรีศูลสามง่ามที่เล่าขานว่าพระศิวะทรงถือด้วยพระองค์เอง เป็นสัญลักษณ์แห่งอำนาจของเทพเจ้าเหนือการสร้าง การรักษา และการทำลาย"
 artifact_relic_krishna_stone_name: "ศิลาแห่งการประสูติของพระกฤษณะ"
 artifact_relic_krishna_stone_desc: "ศิลาสึกกร่อนจากกฤษณะชันมภูมิแห่งมถุรา สถานที่ที่ประเพณีระบุว่าเป็นที่ประสูติของพระกฤษณะ"
 artifact_relic_rama_footprint_name: "รอยพระบาทของพระราม"
 artifact_relic_rama_footprint_desc: "ศิลาที่มีรอยพระบาทของพระรามเอง อัญเชิญมาจากอโยธยา ถิ่นประสูติของพระองค์"
 artifact_relic_palitana_tirtha_name: "ตีรถะแห่งปาลีตานา"
 artifact_relic_palitana_tirtha_desc: "ศิลาพระธาตุศักดิ์สิทธิ์จากเทือกเขาศัตรุนชัยที่ปาลีตานา ตีรถะที่ศักดิ์สิทธิ์ที่สุดในประเพณีเชน"
 artifact_relic_parshvanatha_paduka_name: "จรณะปาทุกาของปารศวนาถ"
 artifact_relic_parshvanatha_paduka_desc: "จรณะปาทุกา ศิลาที่มีรอยประทับพระบาทของปารศวนาถ ตีรถังกรองค์ที่ยี่สิบสาม"
 artifact_relic_shikharji_nishidhi_name: "นิศีธิของเหล่าตีรถังกร"
 artifact_relic_shikharji_nishidhi_desc: "ศิลานิศีธิอนุสรณ์จากยอดเขาสัมเมต-ศิขร ซึ่งตีรถังกรยี่สิบองค์จากยี่สิบสี่องค์บรรลุโมกษะ ตีรถะที่ศักดิ์สิทธิ์ที่สุดของศาสนาเชน"
 artifact_relic_atash_bahram_name: "ถ่านไฟแห่งอาดูร์ฟาร์นบาก"
 artifact_relic_atash_bahram_desc: "ถ่านไฟที่คุกรุ่นซึ่งอัญเชิญมาจากอาตาช บาห์ราม ไฟศักดิ์สิทธิ์ของเหล่านักบวช ซึ่งยังคงได้รับการดูแลที่วิหารไฟ"
 artifact_relic_yggdrasil_branch_name: "กิ่งแห่งยกกดราซิล"
 artifact_relic_yggdrasil_branch_desc: "กิ่งไม้ที่เล่าขานว่าร่วงลงมาจากต้นไม้ศักดิ์สิทธิ์ ณ วิหารอุปป์ซอลา ซึ่งร่างของเครื่องสังเวยที่ถูกสังหารยังคงแขวนอยู่"
 artifact_relic_perun_idol_name: "เทวรูปของเปรุน"
 artifact_relic_perun_idol_desc: "เทวรูปไม้ของเปรุน เทพเจ้าสายฟ้าและเจ้าแห่งเหล่าเทพสลาฟ ที่เจ้าชายวลาดิเมียร์ทรงตั้งขึ้น"
 artifact_relic_suldetug_name: "ธงซึลเดอตุก"
 artifact_relic_suldetug_desc: "ธงสีดำทำจากหางจามรี เป็นภาชนะวิญญาณของเทพเจ้าแห่งสงคราม ที่ถูกแบกนำหน้าข่านแห่งทุ่งหญ้าสเตปป์"
 artifact_relic_yata_kagami_name: "ยาตะ โนะ คางามิ"
 artifact_relic_yata_kagami_desc: "กระจกสัมฤทธิ์ที่เชื่อกันว่าเป็นหนึ่งในสามสิ่งศักดิ์สิทธิ์แห่งราชวงศ์ญี่ปุ่น เล่าขานว่าล่อเทพีสุริยะอามาเทราสึให้ออกมาจากถ้ำ"
 artifact_relic_shin_no_mihashira_name: "ชิน โนะ มิฮาชิระ"
 artifact_relic_shin_no_mihashira_desc: "เสี้ยนไม้ของชิน โนะ มิฮาชิระ เสากลางศักดิ์สิทธิ์ที่ฝังอยู่ใต้ศาลชั้นในสุดของไนกู ถือเป็นความลับที่ซ่อนเร้นและศักดิ์สิทธิ์ที่สุดของอิเซะ และได้รับการสร้างใหม่ทุกครั้งที่มีพิธีชิกิเน็นเซ็งกู"
 artifact_relic_kong_tomb_name: "ศิลาจารึกแห่งสุสานขง"
 artifact_relic_kong_tomb_desc: "แผ่นศิลาแกะสลักจากสุสานของขงจื๊อที่ฉฺวี่ฝู ซึ่งตระกูลขงเคารพบูชามาหลายชั่วอายุคน"
 artifact_relic_analects_name: "คัมภีร์หลุนอวี่ของขงจื๊อ"
 artifact_relic_analects_desc: "ฉบับคัดลอกแต่โบราณบนซีกไม้ไผ่ของหลุนอวี่ ซึ่งรวบรวมวาจาของท่านอาจารย์ขง ที่บัณฑิตจีนศึกษากันมาหลายชั่วอายุคน"
 artifact_relic_athena_promachos_name: "เศษรูปปั้นอะธีนาโปรมาคอส"
 artifact_relic_athena_promachos_desc: "เศษสัมฤทธิ์จากรูปปั้นอะธีนายักษ์ที่ครั้งหนึ่งเคยตั้งเฝ้าอะโครโพลิส"
 artifact_relic_opa_oranmiyan_name: "โอปา โอรันมิยัน"
 artifact_relic_opa_oranmiyan_desc: "คทาหินแกรนิตของกษัตริย์ในตำนานโอรันมิยันแห่งอีเฟ แหล่งกำเนิดบรรพบุรุษของชาวโยรูบา"
 artifact_relic_oshe_shango_name: "โอเช ชางโก"
 artifact_relic_oshe_shango_desc: "โอเช ชางโก ขวานสองหน้าที่หล่อขึ้นตามรูปแฝดหินสายฟ้าของเทพแห่งพายุชางโก ที่นักบวชของพระองค์ชูขึ้นสูงในการร่ายรำอย่างเปี่ยมปีติ"
 artifact_misc_relic_idol_name: "เทวรูปศักดิ์สิทธิ์"
 artifact_misc_relic_idol_desc: "เทวรูปแกะสลัก ที่ประทับทางกายของเทพเจ้าระหว่างพิธีกรรม"
 artifact_misc_relic_stele_name: "ศิลาจารึกบรรพชน"
 artifact_misc_relic_stele_desc: "แผ่นศิลาจารึกที่ระบุสายตระกูลของเหล่านักบวช เป็นพยานข้ามหลายชั่วอายุคน"
 artifact_misc_relic_mask_name: "หน้ากากพิธีกรรม"
 artifact_misc_relic_mask_desc: "หน้ากากพิธีที่สวมในพิธีกรรมชั้นสูงสุด เป็นภาชนะรองรับการปรากฏของพระเจ้า"
 artifact_misc_relic_banner_name: "ธงศักดิ์สิทธิ์"
 artifact_misc_relic_banner_desc: "ผ่านการถวายตัวเพื่อใช้ในพิธีกรรมยิ่งใหญ่ที่จัดขึ้นในสถานศักดิ์สิทธิ์ชั้นสูง ผืนผ้าของธงนี้อบอวลด้วยควันเครื่องสังเวยตลอดกาล"
