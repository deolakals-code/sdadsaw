 jewelled_slippers:0 "รองเท้าประดับอัญมณี"
 jewelled_slippers_description:0 "รองเท้าประดับอัญมณีคู่สวย การสวมใส่มัน ทำให้รู้สึกเหมือนสามารถหาทางกลับบ้านได้เสมอ"
 witchcraft_book:0 "ตำรายาสมุนไพร"
 witchcraft_book_description:0 "หนังสือที่เคยเป็นของแม่มดแห่ง [ROOT.Char.GetCurrentLocation.GetTitle.GetNameNoTier] หน้ากระดาษเต็มไปด้วยยาสมุนไพรง่ายๆ ที่ทำขึ้นเพื่อปรับสมดุลธาตุในร่างกาย"
