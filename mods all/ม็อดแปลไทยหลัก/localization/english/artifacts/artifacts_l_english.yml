 tiny_sculpture_trinket_description:1 "ประติมากรรมขนาดจิ๋วของ [statue_owner.GetTitledFirstNameNoTooltip] ขนาดพกพาและพร้อมที่จะปกครอง สร้างสรรค์โดย [inspiration_owner.GetTitledFirstNameNoTooltip]"
 tiny_box_trinket_name:0 "กล่องขนาดจิ๋ว"
 tiny_box_trinket_description:0 "กล่องขนาดเล็ก แต่ลึกลับ บางทีมันอาจจะปลดปล่อยบาปหนึ่งประการสู่โลกเมื่อเปิดออก สร้างสรรค์โดย [inspiration_owner.GetTitledFirstNameNoTooltip]"
 tiny_chest_trinket_name:0 "หีบขนาดจิ๋ว"
 tiny_chest_trinket_description:0 "หีบขนาดเล็กที่ล็อกไว้ขนาดเท่าหัวแม่มือ มันส่งเสียงกรุ๊งกริ๊งเมื่อเขย่า เผยให้เห็นสิ่งที่อยู่ข้างใน สร้างสรรค์โดย [inspiration_owner.GetTitledFirstNameNoTooltip]"
 tiny_cabinet_trinket_name:0 "ตู้ขนาดจิ๋ว"
 tiny_cabinet_trinket_description:0 "ตู้ที่เล็กพอที่ควรเก็บไว้ในตู้อื่นเพื่อป้องกันไม่ให้ถูกเหยียบ สร้างสรรค์โดย [inspiration_owner.GetTitledFirstNameNoTooltip]"
 tiny_throne_trinket_name:0 "บัลลังก์ขนาดจิ๋ว"
 tiny_throne_trinket_description:0 "บัลลังก์ที่เหมาะสำหรับหนูหรือสัตว์ฟันแทะอื่นๆ ที่จะปกครองจากบัลลังก์นี้ สร้างสรรค์โดย [inspiration_owner.GetTitledFirstNameNoTooltip]"


#fund_inspiration.6301 same sex love poems
 prince_archivist_love_poem_name:0 "ข้าคือจันทรา เจ้าคือสุริยา"
 prince_archivist_love_poem_description:0 "บทลำนำรักของชายสองคน - เจ้าชายและบรรณารักษ์ เฝ้ามองดาวบนยอดหอคอยห่างไกลจากสายตาผู้คนและอยู่ร่วมกันท่ามกลางหมู่ดาว มีข่าวลือว่าบรรณารักษ์คนนั้นอิงจากประสบการณ์ของผู้ประพันธ์ [inspiration_owner.GetTitledFirstNamePossessiveNoTooltip]"
 witch_queen_love_poem_name:0 "หัวใจที่สลายไป"
 witch_queen_love_poem_description:0 "บทกวีเกี่ยวกับหญิงสองคนที่รักกัน แม่มดและราชินีที่หลงทางในป่าใกล้กระท่อมของนาง ทั้งสองต่างปลอบประโลมใจในช่วงเวลาที่ห่างไกลจากสังคม มีเสียงกระซิบว่าแม่มดคนนั้นเป็นภาพล้อเลียนตนเองจากผู้ประพันธ์ [inspiration_owner.GetTitledFirstNameNoTooltip]"

