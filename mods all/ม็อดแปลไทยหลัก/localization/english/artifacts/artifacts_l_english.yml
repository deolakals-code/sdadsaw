 # FP3 artifacts
 artifact_oxus_bracelet_name: "กำไลออกซุส"
 artifact_oxus_bracelet_description: "กล่าวกันว่ากำไลฝีมืออันยอดเยี่ยมนี้มาจากดินแดน $k_transoxiana$ แม้ว่างานลงยาและหินกึ่งมีค่าที่ฝังไว้จะหายไปนานแล้ว แต่ทองคำยังคงความแวววาว กำไล เช่นนี้เป็นของขวัญแห่งเกียรติยศในราชสำนักของราชาธิราชในสมัยโบราณ ดังนั้นบางทีมันอาจเคยถูกสวมใส่โดยขุนนางผู้ยิ่งใหญ่ในบาบิโลน"
 fp3_incense_burner_sculpture: "ประติมากรรมกระถางธูป"
 fp3_incense_burner_sculpture_desc: "กระถางธูปรูปแมวนี้พ่นควันหอมออกมาจากรูจำนวนมากบนตัว หัวที่มีดวงตาฝังอัญมณีมีบานพับ เพื่อให้สามารถวางธูปที่จุดแล้วไว้ข้างในได้"
 fp3_ancient_drinking_vessel: "ภาชนะดื่มอะคีเมนิด"
 fp3_ancient_drinking_vessel_desc: "ถ้วยอันวิจิตรนี้มีส่วนปลายล่างเป็นรูปแพะ มันถูกสร้างขึ้นในยุคที่ถูกลืมเลือน ทว่าความงดงามของมันหาได้จางหายไปไม่"
 artifact_sassanian_sword_name: "ดาบซาซาเนียน"
 artifact_sassanian_sword_description: "กล่าวกันว่าเป็นของที่หลงเหลือจากยุคซาซาเนียนเก่า ดาบเล่มนี้ $sassanian_sword_description_base$ ทำให้เป็นภาพที่งดงามน่าชม แม้ว่าปัจจุบันจะเปราะบางเกินกว่าจะนำไปใช้ในการต่อสู้ บางทีดาบเล่มนี้อาจเคยถูกถือโดยวีรบุรุษที่หายไปตามกาลเวลา?"
 artifact_sassanian_replica_sword_name: "ดาบสไตล์ซาซาเนียน"
 sassanian_sword_description_base: "ประดับด้วยอัญมณีหลายเม็ดและมีลวดลายอันวิจิตร"
 famed_replica_sassanian_sword_description: "ดาบเล่มนี้ได้รับแรงบันดาลใจจากภาพของยุคอดีตอันรุ่งโรจน์ หวนนึกถึงอดีตอันกล้าหาญของบรรพบุรุษของผู้สร้าง มัน $sassanian_sword_description_base$ ทำให้เป็นภาพที่งดงามน่าชม ขณะถือดาบเล่มนี้ ผู้ถือจะฉายภาพของกษัตริย์ในตำนานแห่งอดีต"
 masterwork_replica_sassanian_sword_description: "ดาบเล่มนี้มีเจตนาอย่างชัดเจนที่จะเลียนแบบอาวุธในยุคเก่า หวนนึกถึงอดีตอันกล้าหาญของบรรพบุรุษของผู้สร้าง มัน $sassanian_sword_description_base$ แม้จะเป็นเสียงสะท้อนอันห่างไกลจากอดีต แต่ก็สามารถจินตนาการว่าตนเองเป็นขุนนางผู้ยิ่งใหญ่ในยุคอดีตเมื่อถือดาบเล่มนี้"
 common_replica_sassanian_sword_description: "ของเลียนแบบอันย่ำแย่นี้ช่างเป็นการลบหลู่บรรพบุรุษของผู้สร้างเสียจริง มันฝังด้วยหินราคาถูกและตกแต่งด้วยลวดลายที่หยาบกระด้างไม่สม่ำเสมอ ผู้ใดที่พกมันไว้ในฝัก คงดูเหมือนคนโง่เขลาผู้หลงผิด ที่ปรารถนาจะหวนคืนสู่วันวานที่ผ่านพ้นไปแสนนาน"

#CE1 Artifacts
 artifact_magnificent_crown_name: "มงกุฎอันงดงาม"
 artifact_magnificent_crown_description: "ลายลวดอันสวยงามและลวดลายที่สร้างขึ้นอย่างประณีตของมงกุฎนี้ล้วนเน้นย้ำถึงเหตุผลที่แท้จริงของการดำรงอยู่ของมัน: ภาพนูนที่แกะสลักของบรรพบุรุษของ [ROOT.Char.GetFirstNamePossessive] อ้างถึงอำนาจของพวกเขาและผสานเข้ากับอำนาจของ [ROOT.Char.GetHerHis] เอง"
 artifact_splendid_necklace_name: "สร้อยคออันวิจิตร"
 artifact_splendid_necklace_description: "สร้อยคอชั้นดีนี้ประดับด้วยตราอาร์มของตระกูล [artifact.GetOwner.GetHouse.GetBaseName] ไม่ทิ้งข้อสงสัยใดๆ เกี่ยวกับความชอบธรรมของผู้ถือ"
 artifact_fine_brooch_name: "เข็มกลัดชั้นดี"
 artifact_fine_brooch_description: "การอ้างถึงชื่อตระกูล [artifact.GetOwner.GetHouse.GetBaseName] อย่างแนบเนียนรอบขอบเข็มกลัดนี้ ทำให้ข่าวความชอบธรรมของพวกเขาแพร่กระจายไปอย่างรวดเร็ว"

 medicine_jar: "โถยา"
 medicine_jar_desc: "เครื่องปั้นดินเผาเคลือบบางนี้บรรจุสมุนไพรหายากและมีฤทธิ์แรง แร่ธาตุบำบัด และชิ้นส่วนสัตว์แห้งต่างๆ - ทั้งหมดนี้แพทย์ใช้ในการรักษาโรคและปรับสมดุลธาตุ"
 whale_fat_candles_name: "เทียนไขมันวาฬ"
 whale_fat_candles_description: "เทียนเหล่านี้ทำจากไขมันของเลเวียธานที่น่าสะพรึงกลัว พวกมันดูน่ากลัวด้วยแท่งไขมันวาฬ"

 warenne_coin: "เหรียญวาเรนน์"
 warenne_coin_description: "เหรียญนี้มีตราลายตารางหมากรุกสีน้ำเงินและสีเหลืองของราชวงศ์วาเรนน์อยู่ด้านหน้า คราบเลือดสีเข้มเปื้อนอยู่ที่ขอบ"

 traitors_head: "ศีรษะคนทรยศ"
 traitors_head_description: "ศีรษะที่ถูกตัดออกจากเจ้าของอย่างเรียบร้อย มันเป็นเหมือนข้อความมากกว่าของที่ระลึก"
 
