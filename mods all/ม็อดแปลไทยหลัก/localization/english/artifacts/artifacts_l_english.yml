 naked_tapestry_description:0 "ภาพเปลือยของ [inspiration_owner.GetTitledFirstName] ที่โอเอซิสริมหาด กำลังพัด [inspiration_owner.GetHerselfHimself] ด้วยใบไม้ และเปล่งประกายด้วยหยดน้ำใสราวคริสตัล"

 frogspawn_jar_name:0 "โหลไข่กบ"
 frogspawn_jar_description:0 "โหลที่เต็มไปด้วยไข่กบที่กระฉอกไปมา และลูกอ๊อดที่ฟักออกมาไม่กี่ตัว ส่งมาให้ [ROOT.Char.GetTitledFirstNameNoTooltip] โดย [inspiration_owner.GetTitledFirstName] เพื่อบ่งบอกถึงความน่าสะพรึงกลัวของโลกภายนอก\n\nดิ้นดุ๊กดิ๊ก!"
 beaver_book_name:1 "ปราสาทของบีเวอร์"
 beaver_book_description:0 "หนังสือเกี่ยวกับสถาปัตยกรรมและเทคนิคการก่อสร้างของบีเวอร์ เขียนขึ้นพร้อมภาพร่างโดย [inspiration_owner.GetTitledFirstName] ระหว่างการเดินทางของ [inspiration_owner.GetHerHis]"
 crocodile_tapestry_name:0 "พรมจระเข้"
 crocodile_tapestry_description:0 "พรมรูปจระเข้ที่สร้างขึ้นตามความสามารถที่ดีที่สุดของ [inspiration_owner.GetTitledFirstNamePossessive] สัตว์ร้ายตัวนี้มีสีแดงสด มีเขี้ยวหลายชั้น ตุ่มพิษ และหางมีหนาม มันล้อมรอบด้วยรังไข่ในถ้ำหลังน้ำตก"
 mountain_rock_name:0 "หินภูเขา"
 mountain_rock_description:0 "หินก้อนใหญ่ที่ [inspiration_owner.GetTitledFirstName] แบกมาอย่างยากลำบากตลอดทางจาก [mountain_location.GetName]"
 
 # Game start additional unique artifacts
 reichskrone_name:0 "ไรชส์โครเนอ"
 reichskrone_description:1 "นี่คือสัญลักษณ์แห่งตำแหน่งจักรพรรดิโรมันอันศักดิ์สิทธิ์ รับประกันว่าจะดึงดูดความสนใจของดยุกทุกคนที่ผ่านไปมา"
 nikephoros_crown_name:0 "มงกุฎแห่งนีเกโฟรอสที่ 2 โฟกัส"
 nikephoros_crown_description:2 "นี่คือมงกุฎของหนึ่งในนักวางกลยุทธ์ที่เก่งกาจที่สุดเท่าที่เคยมีมาในสายเลือดจักรวรรดิ ล้มเหลวในสงครามทางตะวันตกของจักรวรรดิ แต่เป็นผู้พิชิตทางตะวันออก"
 skull_cap_charlemagne_name:0 "กะโหลกศีรษะของชาร์เลอมาญ"
 skull_cap_charlemagne_description:0 "กะโหลกศีรษะของชาร์เลอมาญถูกเก็บไว้ในกล่องนี้ บางทีปัญญาของเขาอาจสถิตอยู่กับเจ้าของ"
 papal_tiara_name:0 "เทียร่าของพระสันตะปาปา"
 papal_tiara_description:1 "นี่คือหมวกไมเตอร์ประดับอัญมณีพร้อมมงกุฎทองคำ ซึ่งเป็นสัญลักษณ์ของตำแหน่งพระสันตะปาปา แต่มันจะไม่ดูสง่างามที่สุดบนศีรษะของท่านหรือ?"
 essen_crown_name:0 "คินเดอร์โครเนอ"
 essen_crown_description:1 "บ้างก็ว่านี่คือมงกุฎที่สร้างขึ้นสำหรับพิธีราชาภิเษกของออตโตที่ 3 ในเอสเซิน บ้างก็ว่ามีไว้สำหรับสวมมงกุฎรูปปั้นพระแม่มารี ไม่ว่าจะทางใด มันเล็กมาก แต่ท่านอาจจะพยายามบีบมันลงบนศีรษะของท่านได้"
 monomachus_crown_name:1 "มงกุฎโมโนมาคัส"
 monomachus_crown_description:1 "นี่คือมงกุฎที่ประกอบด้วยแผ่นทองคำแสดงภาพเหมือนของคอนสแตนตินที่ 9 โมโนมาคัส พระมเหสีโซอี พระขนิษฐาธีโอโดรา และรูปนักเต้นเชิงเปรียบเทียบ"
 edmund_head_name:1 "ศีรษะนักบุญเอ็ดมันด์"
 edmund_head_description:0 "เอ็ดมันด์เรียกร้องให้ตนเองเป็นนักบุญตั้งแต่วินาทีที่เกิด ตำนานเล่าว่าเขาเป็นกษัตริย์แห่งอีสต์แองเกลียผู้ยอมเป็นเครื่องสังเวยแก่พวกไวกิ้งแทนที่จะปล่อยให้ประชาชนของเขาถูกสังหาร"
 dhammapada_name:0 "ธรรมบท"
 dhammapada_description:1 "นี่คือชุดคำสอนของพระพุทธเจ้า ผูกไว้ในคัมภีร์ใบลานอย่างดี"
 excalibur_name:0 "'เอ็กซ์คาลิเบอร์'"
 excalibur_description:0 "แทบไม่มีผู้ปกครองคนใดในบริเตนที่ไม่กล่าวอ้างว่าเป็นเจ้าของเอ็กซ์คาลิเบอร์ที่แท้จริง สงครามต่างๆ จ่ายด้วยการขายเอ็กซ์คาลิเบอร์ และท่านต้องหวังว่าแขกของท่านจะไม่จับได้ว่ามีคนอื่นแสดงดาบเล่มนี้อยู่"
 vinaya_pitaka_name:0 "วินัยปิฎก"
 vinaya_pitaka_description:0 "คัมภีร์พุทธศาสนาจากสามส่วนของพระไตรปิฎกภาษาบาลี ข้อความนี้เป็นคำแนะนำเกี่ยวกับข้อปฏิบัติทางวินัยสำหรับพระภิกษุและภิกษุณี"
 sutta_pitaka_name:0 "สุตตันตปิฎก"
 sutta_pitaka_description:1 "คัมภีร์พุทธศาสนานิกายเถรวาทอ้างอิงจากการสังคายนาครั้งแรกหลังการปรินิพพานของพระพุทธเจ้า ประกอบด้วยบทกวีและพระธรรมเทศนาจำนวนมากที่เชื่อว่าเป็นของพระพุทธเจ้าและสาวกของพระองค์ เป็นส่วนหนึ่งของพระไตรปิฎกภาษาบาลี"
 abhidhamma_pitaka_name:0 "อภิธรรมปิฎก"
 abhidhamma_pitaka_description:0 "งานวิชาการโดยละเอียดที่วิเคราะห์คำสอนของพระพุทธเจ้า เป็นส่วนหนึ่งของพระไตรปิฎกภาษาบาลี"




