 artifact_slot_untyped: "สิ่งประดิษฐ์ที่ถูกทำลาย             " # ใช่ แท็บมีเจตนา

 artifact_tale_of_genji: "ตำนานเก็นจิ"
 artifact_tale_of_genji_description: "ตำนานเก็นจิ ซึ่งคาดว่าได้รับแรงบันดาลใจจากชีวิตของมินาโมโตะ $TO_ru$ เป็นผลงานคล้ายนวนิยายที่เขียนโดยท่านหญิงมุราซากิ โดยมีรายละเอียดเรื่องราวชีวิตและความรักของเจ้าชายเก็นจิผู้เป็นตัวละครสมมติ โอรสขององค์จักรพรรดิ"
 artifact_pillow_book: "หนังสือข้างหมอน"
 artifact_pillow_book_description: "เขียนขึ้นโดยกวีและนางในราชสำนัก เซ โชนะงน เพื่อเป็นอนุทินส่วนตัวของนาง สิ่งที่เรียกกันว่าหนังสือข้างหมอนนี้ เผยให้เห็นเรื่องซุบซิบประจำวัน เรื่องรักใคร่ และเรื่องราวดราม่าของชนชั้นสูงญี่ปุ่น"
