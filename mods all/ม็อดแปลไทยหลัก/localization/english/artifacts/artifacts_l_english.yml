 # Easter eggs
 easteregg_artifact_elisabeth_plush:0 "ตุ๊กตาหมาจิ้งจอกของเอลิซาเบธ"
 easteregg_artifact_elisabeth_plush_description:0 "ตุ๊กตาหมาจิ้งจอกของเอลิซาเบธเป็นของเล่นที่เป็นที่รักมากและอยู่กับเธอเกือบตลอดชีวิต มักเห็นเอลิซาเบธพูดคุยกับมันขณะที่เธอถักทอรหัสลับอันซับซ้อนสำหรับใครก็ตามที่อาจจ้างบริการของเธอ มันปลอบโยนและเป็นแรงบันดาลใจให้ผู้ถือเลียนแบบความเจ้าเล่ห์ของหมาจิ้งจอก"
 easteregg_artifact_nicks_redolence: "น้ำหอมสุดท้าย"
 easteregg_artifact_nicks_redolence_description: "ขวดเล็กๆ ที่มีน้ำหอม — [ROOT.Char.Custom('GetComplexColor')] — อยู่ในนั้น รับรองว่าจะ ทำให้ทั้งขุนนางและสุภาพสตรีหลงใหลเมื่อได้กลิ่น จารึกเล็กๆ บนจุกปิดอ่านว่า #EMP "และบัดนี้ จุดจบใกล้เข้ามาแล้ว..."#!"
 easteregg_artifact_chad_book:0 "เอนิอิดฉบับมีคำอธิบายประกอบ"
 easteregg_artifact_chad_book_description:0 "สำเนาเอนิอิดของเวอร์จิลที่เป็นที่รักและมีภาพประกอบสวยงาม ถูกบดบังด้วยลายมือหวัดๆ มากมาย — บ้างไร้สาระ บ้างลึกซึ้ง"
 easteregg_artifact_chad_dagger:0 "กริชเล่มนั้น"
 easteregg_artifact_chad_dagger_description:0 "ประกายของมันหม่นหมองจากคราบเลือดที่แห้งกรัง ถึงกระนั้นมันก็ยังคงกระหายเลือดอยู่เสมอ"
 easteregg_artifact_veronica_book:0 "แหวนของลอร์ด"
 easteregg_artifact_veronica_book_description:0 "การอ้างอิงที่ซ่อนเร้นอย่างบางเบา ในรูปแบบหนังสือ เขียนด้วยภาษาโปรตุเกสชั้นเลิศ"
 easteregg_artifact_map_lohmander: "กำหนดการเดินทางเก่า"
 easteregg_artifact_map_lohmander_description: "หนังสือเล่มเล็กหุ้มหนังเล่มนี้บรรจุเรื่องราวของอาลักษณ์ชาวสแกนดิเนเวียและการเดินทางของเขาจากตะวันตกไปยังอินเดีย ให้รายละเอียดเกี่ยวกับอันตราย ถนน และอุปกรณ์ที่จำเป็น ตั้งแต่สถานที่ที่จะนำน้ำไปจนถึงสถานที่ที่คุณอาจต้องการรองเท้าบู๊ตที่เหมาะสม และอื่นๆ นอกจากนี้ยังมีข้อมูลจำนวนมากเกี่ยวกับอาหารหรือการเต้นรำในท้องถิ่น\n\nข้างในยังมีแผนที่พับจำนวนหนึ่ง แสดงภาพอนุทวีปและสถานที่อื่นๆ อีกมากมาย พร้อมบันทึกเกี่ยวกับสถานที่ห่างไกลและชื่อในยุคอดีต"

 easteregg_artifact_jason_sword:0 "ดาบแห่งนักบุญมาร์ติน"
