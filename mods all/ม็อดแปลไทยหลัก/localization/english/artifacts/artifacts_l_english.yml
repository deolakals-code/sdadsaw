 # yearly.4081
 translated_arabic_book_de_materia_medica_name:0 "#italic ว่าด้วยวัตถุทางการแพทย์#!"
 translated_arabic_book_de_materia_medica_desc:0 "สำเนาภาพประกอบตำรับยาห้าเล่มของไดออสคอริดีสเกี่ยวกับสรรพคุณทางยาของพืชต่างๆ เขียนขึ้นในอเล็กซานเดรียโบราณ $translated_arabic_book_shared_desc$"
 translated_arabic_book_on_ascensions_name:0 "#italic ว่าด้วยการขึ้นสู่สวรรค์#!"
 translated_arabic_book_on_ascensions_desc:0 "สำเนาตำราดาราศาสตร์ของฮิปซิเคิลส์เกี่ยวกับการเคลื่อนที่ของจักรราศีผ่านท้องฟ้า เขียนขึ้นในอเล็กซานเดรียโบราณและ $translated_arabic_book_shared_desc$"
 translated_arabic_book_elements_name:0 "#italic ธาตุ#!"
 translated_arabic_book_elements_desc:0 "สำเนาตำราคณิตศาสตร์สิบสามเล่มของยูคลิดเกี่ยวกับเรขาคณิต ตรรกศาสตร์ และบทพิสูจน์ เขียนขึ้นในอเล็กซานเดรียโบราณและ $translated_arabic_book_shared_desc$"
 translated_arabic_book_on_the_soul_name:0 "#italic ว่าด้วยจิตวิญญาณ#!"
 translated_arabic_book_on_the_soul_desc:0 "สำเนาตำราจิตวิทยาสามเล่มโบราณของอริสโตเติลเกี่ยวกับธรรมชาติของจิตวิญญาณและแนวโน้มของมัน $translated_arabic_book_shared_desc$"
 translated_arabic_book_thucydides_name:0 "#italic ประวัติศาสตร์ของทิวซิดิดีส#!"
 translated_arabic_book_thucydides_desc:0 "สำเนาบันทึกโบราณของทิวซิดิดีสเกี่ยวกับสงครามเพโลพอนนีเซียนระหว่างเอเธนส์และสปาร์ตา $translated_arabic_book_shared_desc$"
 translated_arabic_book_plutarch_name:0 "#italic ชีวประวัติของพลูทาร์ก#!"
 translated_arabic_book_plutarch_desc:0 "สำเนาชีวประวัติเปรียบเทียบของผู้นำโบราณที่โดดเด่นและลักษณะทางศีลธรรมของพวกเขาโดยพลูทาร์ก $translated_arabic_book_shared_desc$"
 translated_arabic_book_shared_desc:0 "แปลเป็นภาษาอาหรับจากภาษากรีกดั้งเดิมสำหรับ [ROOT.Char.GetTitledFirstNameNoTooltipRegnal]"
 
 # hold_court.4300
 dress_me_artifact_desc:0 "อาภรณ์อันวิจิตรที่สร้างขึ้นโดยช่างตัดเสื้อที่เก่งกาจที่สุด สั่งทำโดย [ROOT.Char.GetTitledFirstNameNoTooltipRegnal] เพื่อสร้างความประทับใจให้แก่ราชสำนักของ [ROOT.Char.GetHerHis] ด้วยความงดงาม"

 # martial_authority.4000-5
 improvised_halberd_desc:0 "ง้าวที่ดัดแปลงอย่างเร่งรีบนี้มียอดเป็นขอสับ ทำให้เป็นอาวุธชั่วคราวที่มีประโยชน์ในยามคับขัน"
 improvised_dagger_desc:0 "กริชชั่วคราวนี้สร้างขึ้นจากการดัดแปลงอุปกรณ์ทำฟาร์ม และยังคงความสะดวกในการใช้งานและความสามารถในการตัด"
 improvised_billhook_desc:0 "ขอสับมือเดียวนี้ใช้สำหรับตัดกิ่งไม้จากพุ่มไม้ แม้จะไม่เหมาะกับกษัตริย์ แต่ใบมีดโค้งของมันก็สามารถหาช่องว่างในเกราะได้อย่างน่าประหลาดใจ"

