 lucky_coin:0 "เหรียญนำโชค [ROOT.Char.GetCurrentLocation.GetCulture.GetNameNoTooltip]"
 lucky_coin.desc:1 "เหรียญ [ROOT.Char.GetCurrentLocation.GetCulture.GetNameNoTooltip] พื้นเมืองของ [ROOT.Char.GetCurrentLocation.GetNameNoTooltip]\n\nพื้นผิวที่เคยประทับตราตอนนี้เรียบเนียน เนื่องจากการถูและหมุนเล่นอย่างต่อเนื่อง"
