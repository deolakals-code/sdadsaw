# Additional Historical Artifacts
 artifact_pedestal_koh_i_noor_name:0 "ขุนเขาแห่งแสง"
 artifact_pedestal_koh_i_noor_description:0 "นี่คือเพชรที่มีขนาดและความใสที่ไม่มีใครเทียบได้ กล่าวกันว่าถูกขุดพบในเหมืองทางตะวันออกเฉียงใต้ของอินเดีย แต่ต้นกำเนิดที่แท้จริงของมันน่าจะไม่เป็นที่ทราบแน่ชัด"
 artifact_jewelled_danda_name:0 "ฑัณฑะประดับอัญมณี"
 artifact_jewelled_danda_description:0 "นี่คือคทาประดับอัญมณีจากอินเดีย สัญลักษณ์สูงสุดแห่งอำนาจราชวงศ์และความสามารถของกษัตริย์ในการลงโทษอาณาประชาราษฎร์"
 artifact_aruval_name:0 "อารุวัลโบราณ"
 artifact_aruval_description:0 "กล่าวกันว่าอารุวัลยาวเล่มนี้เก่าแก่มากจนเป็นไปได้ว่าการุปปุสวามีเคยใช้มันมาก่อน"
 artifact_khanda_name:0 "ขัณฑะในพิธี"
 artifact_khanda_description:0 "ขัณฑะเล่มนี้สร้างขึ้นสำหรับพิธีการมากกว่าการต่อสู้ และเป็นเครื่องเตือนใจมาหลายชั่วอายุคนถึงความจำเป็นในการขจัดม่านแห่งอวิชชา"
 artifact_makarakundala_name:0 "มกรกุณฑล"
 artifact_makarakundala_description:0 "นี่คือต่างหูเหมือนที่เหล่าเทพสวมใส่ บ้างก็อ้างว่าคู่พิเศษนี้เคยเป็นของเทพเจ้า"
 artifact_cintamani_name:0 "หินจินดามณี"
 artifact_cintamani_hindu_description:0 "นี่คือหินที่กล่าวกันว่าเคยตกลงมาจากท้องฟ้า บ้างอ้างว่าเคยเป็นของพระวิษณุหรือพญานาค และยังนำความเจริญรุ่งเรืองมาสู่เจ้าของอีกด้วย"
 artifact_cintamani_buddhist_description:0 "นี่คือหินที่กล่าวกันว่าเคยตกลงมาจากท้องฟ้า บ้างอ้างว่าเคยถูกถือครองโดยพระโพธิสัตว์อวโลกิเตศวรและพระกษิติครรภ์ และยังบันดาลความปรารถนาของผู้ที่ครอบครองอีกด้วย"
 artifact_navaratna_name:0 "นพรัตน์"
 artifact_navaratna_description:0 "สร้อยอัญมณีเก้าชนิด มีทับทิมเม็ดใหญ่อยู่ตรงกลาง เป็นสัญลักษณ์ของเทพนพเคราะห์ทั้งเก้าในศาสนาฮินดู"
 artifact_shankha_conch_name:0 "สังข์"
 artifact_shankha_conch_description:0 "สัญลักษณ์ของพระวิษณุ สังข์โบราณนี้ใช้เป็นเครื่องเป่าในพิธีกรรมทางศาสนาและกล่าวกันว่าเป็นสัญลักษณ์ของความเจริญรุ่งเรืองและคุณธรรม"
 artifact_pedestal_great_diamond_name:0 "เพชรเม็ดใหญ่"
 artifact_pedestal_great_diamond_description:0 "กล่าวกันว่าอัญมณีขนาดมหึมานี้เคยประดับรูปปั้นในวัด ก่อนที่จะถูกผู้บุกรุกโลภมากขโมยไป"
 al_taj_crown_name:0 "อัล-ทาจ อัล-ชารีฟ"
 al_taj_crown_description:0 "'มงกุฎอันทรงเกียรติ' หรือ 'ผ้าโพกแห่งความเคารพ' คือมงกุฎในขบวนแห่ตามประเพณีของกาหลิบฟาติมียะห์ ประดับด้วยอัญมณีขนาดมหึมา 'อัล-ยาติมา'"
 qadib_al_mulk_name:0 "กอดิบ อัล-มุลก์"
 qadib_al_mulk_description:0 "คทาในขบวนแห่ของกาหลิบฟาติมียะห์ หุ้มด้วยทองคำและประดับด้วยไข่มุกและอัญมณี"
 ryukyu_shaku_name: "ชะกุแห่งสามบรรพต"
 ryukyu_shaku_description: "คทาประกอบพิธีลงรัก แกะสลักจากไม้ซีดาร์ศักดิ์สิทธิ์จากเกาะ เป็นสัญลักษณ์ของการรวมกลุ่มตระกูลต่าง ๆ ภายใต้อาณัติสวรรค์หนึ่งเดียว"
 ryukyu_crown_name: "มงกุฎมังกร"
 ryukyu_crown_description: "เครื่องประดับประดับปะการัง ยอดประดับด้วยมังกรทะเลสีทองกุมไข่มุกแห่งปัญญา ประกายแสงสะท้อนข้ามคลื่น เป็นสัญญาณแห่งอำนาจและความรุ่งเรือง"
 al_sayf_al_khass_name:0 "อัล-ซัยฟ์ อัล-คาส"
 al_sayf_al_khass_description:0 "กล่าวกันว่าดาบประดับอัญมณีเล่มนี้ทำจากสายฟ้า เก็บไว้ในฝักทองคำจารึก ซึ่งแทบไม่เคยถูกนำออกมา เนื่องจากความสำคัญทางพิธีการในกาหลิบ"
 al_dawat_name:0 "อัล-ดาวาต"
 al_dawat_description:0 "นี่คือที่หมึกทำจากทองคำและปะการัง มีบทบาทพิเศษในพิธีการของกาหลิบมาเป็นเวลานาน"
 al_hafir_name:0 "อัล-ฮาฟีร์"
 al_hafir_description:0 "ทับทิมสีแดงนี้ รู้จักกันในชื่อ อัล-ฮาฟีร์ หรือ 'กีบม้า' มีคุณภาพที่หาได้ยากในโลกนี้ มันถูกเย็บติดกับผ้าไหมโดยมีแท่งมรกตล้อมรอบเป็นวงกลม ตามประเพณี มันประดับอยู่บนหน้าม้าของกาหลิบ"
 artifact_wall_banner_thankfulness_name:0 "ธงแห่งความกตัญญู"
 artifact_wall_banner_thankfulness_description:0 "ธงผ้าไหมสีขาวนี้จารึกด้วยอักษรทองคำและพันรอบหอกทองคำ ตามประเพณี ธงนี้และธงคู่ของมันถูกถือในขบวนแห่ของกาหลิบ"
 artifact_arms_of_alex_name:0 "เกราะของอเล็กซานเดอร์"
 artifact_arms_of_alex_description:0 "กล่าวกันว่าชุดเกราะผ้าลินินเคลือบโบราณชุดนี้เคยเป็นของอเล็กซานเดอร์มหาราช แม้จะไม่เหมาะที่จะสวมใส่อีกต่อไป แต่ตัวเกราะเองก็สืบทอดมรดกของผู้พิชิตผู้ยิ่งใหญ่ ซึ่งเป็นที่รู้จักตั้งแต่ทะเลเมดิเตอร์เรเนียนไปจนถึงขอบของอินเดีย"
 artifact_pedestal_al_jabal_name:0 "อัล-จาบัล"
 artifact_pedestal_al_jabal_description:0 "นี่คือแหวนที่ประดับด้วยทับทิมเม็ดใหญ่ที่รู้จักกันในชื่อ อัล-จาบัล หรือ 'ภูเขา' หินมีขนาดใหญ่หาที่เปรียบมิได้ และกล่าวกันว่าแหวนวงนี้เคยถูกสวมใส่โดยจักรพรรดิซาซาเนียนแห่งเปอร์เซีย"
 artifact_pedestal_al_yatima_name:0 "อัล-ยาติมา"
 artifact_pedestal_al_yatima_description:0 "รู้จักกันในชื่อ อัล-ยาติมา ('เด็กกำพร้า') กล่าวกันว่าไข่มุกขนาดมหึมานี้ไม่เหมือนใครในโลกนี้ เป็นดั่งกำพร้าท่ามกลางตระกูลอัญมณีและไข่มุก"
 artifact_dagger_of_rostam_name:0 "กริชของรอสตัม"
 artifact_dagger_of_rostam_description:0 "อ้างกันว่ากริชอันวิจิตรเล่มนี้คือเล่มที่รอสตัมใช้สังหารเดวาขาว"
 artifact_spear_of_ascalon_name:0 "อัสคาลอน"
 artifact_spear_of_ascalon_description:0 "กล่าวกันว่าหอกเก่าที่หักนี้เป็นชิ้นส่วนของหอกที่นักบุญจอร์จใช้สังหารมังกรแห่งเบรุต"
 artifact_zomorrodnegar_name:0 "ชัมชีร์-เอ โซมอร์รอดเนการ์"
 artifact_zomorrodnegar_description:0 "กล่าวกันว่าดาบประดับมรกตเล่มนี้คือดาบในตำนานของโซโลมอน ใช้สังหารปีศาจฟูลัด-เซเรห์"
 artifact_muhammads_epistles_name:0 "จดหมายจากมูฮัมหมัด"
 artifact_muhammads_epistles_description:1 "จดหมายฉบับนี้เป็นส่วนหนึ่งของการติดต่อระหว่างศาสดามูฮัมหมัดและผู้ปกครอง [newly_created_artifact.Custom('EpistleReciever')|U]"
 epistle_syria:0 "ซีเรีย"
 epistle_arabia:0 "ชนเผ่าอาหรับ"
 epistle_persia:0 "เปอร์เซีย"
 epistle_byzantium:0 "จักรวรรดิโรมันตะวันออก"
 epistle_bahrain:0 "บาห์เรน"
 artifact_kaves_apron_name:0 "ผ้ากันเปื้อนของคาเวห์"
 artifact_kaves_apron_description:0 "กล่าวกันว่าธงที่ขาดรุ่งริ่งนี้คือธงในตำนานที่คาเวห์ ช่างตีเหล็กชาวเปอร์เซีย ทำจากผ้ากันเปื้อนของเขา เพื่อรวบรวมผู้คนต่อต้านผู้ปกครองที่ชั่วร้าย"
 artifact_joyeuse_name:0 "ฌัวเยิซ"
 artifact_joyeuse_description:1 "ดาบแห่งชาร์เลอมาญ ตีขึ้นเพื่อบรรจุหอกแห่งลองกินุส ฌัวเยิซเป็นสัญลักษณ์ทั้งความกล้าหาญของอัศวินและมรดกแห่งราชวงศ์ของจักรวรรดิชาร์เลอมาญ"
 artifact_durendal_name:0 "ดูเรนดัล"
 artifact_durendal_description:0 "อ้างกันว่าดาบสั้นและหนักเล่มนี้คือดูเรนดัลในตำนาน ซ่อนโดยโรลันด์ ในขณะที่เขากำลังจะตาย เพื่อปฏิเสธไม่ให้มันตกไปอยู่ในมือศัตรูของราชบัลลังก์"
 artifact_curtana_name:0 "คูร์ทานา"
 artifact_curtana_description:0 "อ้างกันว่านี่คือคูร์ทานา ดาบแห่งความเมตตา ดาบในตำนานนี้เคยถูกใช้โดยทริสตันต่อสู้กับมอร์โฮลต์ นี่อาจเป็นสาเหตุที่ปลายดาบหายไป ชิ้นส่วนที่หายไปในกะโหลกหนาของยักษ์ไอริช"
 artifact_ring_angelica_name:0 "แหวนของแองเจลิกา"
 artifact_ring_angelica_description:0 "แหวนที่กล่าวกันว่าเป็นวงเดียวกับที่แองเจลิกาสวมใส่ ซึ่งเป็นที่รู้จักจากเรื่องราวของโรลันด์และชาร์เลอมาญ พลังของมันคงเสื่อมไปแล้ว เนื่องจากดูเหมือนจะไม่มอบการล่องหนอีกต่อไป แต่ก็ยังคงเป็นสัญลักษณ์อันงดงามของเจ้าหญิงที่จากไปนานแล้วผู้นี้"
 artifact_olifant_name:0 "โอลิฟานต์"
 artifact_olifant_description:0 "เขาสัตว์งาช้างขนาดใหญ่ ปกคลุมด้วยงานแกะสลักอันวิจิตร บ้างอ้างว่าเป็นเขาอันเดียวกับที่โรลันด์ใช้เรียกความช่วยเหลือก่อนตายในสมรภูมิรอนเซอโวซ์"
 artifact_colada_name:0 "โกลาดา"
 artifact_colada_description:0 "มีข่าวลือว่าเป็นหนึ่งในดาบของเอลซิด ใบดาบนี้เป็นแรงบันดาลใจให้ทุกคนที่ปรารถนาคุณธรรมของอัศวิน เช่นเขา"
 artifact_aram_name:0 "อารัม"
 artifact_aram_description:0 "หอกโบราณสีคล้ำเล่มนี้ผ่านกาลเวลามาหลายชั่วอายุคน มันเก่าแก่มากจนหลายคนเชื่อว่าเป็นหอกอารัมในตำนาน ซึ่งเป็นที่รู้จักจากเรื่องราวของจังกัร"
 artifact_ikenga_name:0 "อิเกงกา"
 artifact_ikenga_description:0 "อ้างกันว่ารูปปั้นมีเขาขนาดเล็กนี้มอบความสำเร็จและชัยชนะแก่เจ้าของ"
 artifact_mmaagha_kamalu_name:0 "มมาฆา คามาลู"
 artifact_mmaagha_kamalu_description:0 "นี่คือดาบในพิธีอันหรูหราและเก่าแก่มาก อ้างกันว่าเคยเป็นของคามาลู เทพเจ้าแห่งสงครามของชาวอิกโบ"
 artifact_bronze_head_name:0 "ศีรษะสำริด"
 artifact_bronze_head_description:0 "ศีรษะสำริดที่เหมือนจริงนี้จับภาพลักษณะของผู้ปกครองที่เสียชีวิตไปนานแล้วได้อย่างละเอียด ดูเหมือนประติมากรรมมากกว่าสิ่งที่หล่อด้วยโลหะ ศีรษะประดับด้วยมงกุฎเพื่อแสดงสถานะของกษัตริย์ที่ปรากฎ"
 artifact_crystal_carving_name:0 "งานแกะสลักคริสตัล"
 artifact_crystal_carving_description:0 "ชิ้นส่วนเขี้ยวหนุมานใสรูปสี่เหลี่ยมผืนผ้าชิ้นนี้เกือบจะโปร่งใสสมบูรณ์แบบ และพื้นผิวส่วนใหญ่ปกคลุมด้วยงานแกะสลักอันวิจิตร เป็นวัตถุที่สวยงามมาก แม้จะไม่ชัดเจนว่ามีประโยชน์ใช้สอยอย่างไร"
 artifact_ibeji_name:0 "อิเบจิ"
 artifact_ibeji_description:0 "นี่คือประติมากรรมไม้ขนาดเล็กที่แสดงภาพฝาแฝดผู้ล่วงลับ เชื่อกันว่าจะนำความมั่งคั่งและโชคลาภมาให้หากครอบครัวดูแลรักษา ประดับด้วยทรงผมที่ประณีตและค่อนข้างสูง"
 artifact_kantele_name:0 "กันเตเลโบราณ"
 artifact_kantele_description:0 "เครื่องสายไม้นี้สืบทอดกันมาหลายชั่วอายุคน มีข่าวลืออ้างว่าอาจมีอายุย้อนไปถึงสมัยของไวแนเมยเนนเอง"
 artifact_sledovik_name:0 "สเลโดวิก"
 artifact_sledovik_description:0 "ก้อนหินใหญ่ก้อนนี้ปกคลุมไปด้วยรอยเท้าที่ฝังลึกลงไปในเนื้อหิน เป็นแท่นบูชามาหลายปี และเชื่อกันว่ารอยเท้าเหล่านี้เป็นของนักบุญท้องถิ่น"
 artifact_nagelring_name:0 "นาเกลริง"
 artifact_nagelring_description:0 "ตามประเพณี ดาบเก่าแก่เล่มนี้เชื่อมโยงกับดีทริช ฟอน แบร์น ในตำนานและค่อนข้างเป็นที่นิยม การเชื่อมโยงนี้ ทำให้สิ่งของชิ้นนี้มีชื่อเสียงเกินกว่าที่ควรจะเป็น"
 artifact_kladenets_name:0 "คลาเดเนตส์"
 artifact_kladenets_description:1 "แม้จะผ่านช่วงเวลาที่ดีกว่านี้มาแล้ว กล่าวกันว่าดาบเหล็กกล้าเก่าเล่มนี้คือคลาเดเนตส์ในตำนาน ดาบที่สามารถเหวี่ยงตัวเองได้ ในสภาพปัจจุบัน มันแทบจะใช้งานไม่ได้เลย แต่การมีอยู่ของมันก็เรียกร้องความเคารพจากผู้ที่เชื่อในต้นกำเนิดเหนือธรรมชาติของมัน"
 artifact_legbiter_name:0 "เลกไบเตอร์"
 artifact_legbiter_description:0 "ดาบที่คมกริบพร้อมด้ามงาช้าง กล่าวกันว่าอาวุธนี้เคยเป็นของกษัตริย์ผู้ยิ่งใหญ่ แมกนัส โอลาฟสัน แห่งนอร์เวย์"
 artifact_quernbiter_name:0 "เควียร์น-ไบเตอร์"
 artifact_quernbiter_description:0 "ดาบเล่มนี้เคยถูกใช้โดยกษัตริย์โฮกุนแห่งนอร์เวย์เอง และในเวลานั้นกล่าวกันว่าคมมากจนสามารถตัดผ่านหินโม่ได้"
 artifact_dragvandil_name:0 "ดรักวันดิล"
 artifact_dragvandil_description:0 "ดาบที่กล่าวกันว่าเคยเป็นของเอกิล สกัลลากริมส์สัน ชาวนา กวี และนักรบ ซึ่งเป็นที่รู้จักจากตำนานของเอกิล"
 artifact_szczerbiec_name:0 "เชอร์เบียตส์"
 artifact_szczerbiec_description:1 "กล่าวกันว่าทูตสวรรค์มอบให้กษัตริย์โบเลสลาฟผู้กล้าหาญ อ้างกันว่าดาบเล่มนี้คือเล่มที่ใช้ฟันประตูทองคำแห่งเคียฟ มันมีความสำคัญเชิงสัญลักษณ์อย่างมหาศาล"
 artifact_chinese_caligraphy_name:1 "ศิลปะการเขียนอักษรจีน"
 artifact_chinese_caligraphy_description:0 "กระดาษอันบอบบางชิ้นนี้ปกคลุมไปด้วยสัญลักษณ์ที่แปลกตา แต่สวยงามและแม่นยำมาก กล่าวกันว่ามาจากดินแดนจีนอันไกลโพ้นทางตะวันออก"
 artifact_ruyi_name:0 "หรูอี้"
 artifact_ruyi_description:0 "นี่คือคทาหยกขนาดเล็ก ปกคลุมด้วยสัญลักษณ์และเครื่องประดับจีน"
 turquoise_throne_name:0 "บัลลังก์เทอร์ควอยซ์"
 turquoise_throne_description:0 "บัลลังก์หลวงประดับอัญมณีนี้สร้างขึ้นตามแบบบัลลังก์ในตำนานของกษัตริย์เปอร์เซียจากชาห์นาเมห์ โครงไม้มะเกลือประดับด้วยเทอร์ควอยซ์นับไม่ถ้วน รวมถึงแผ่นทองคำบริสุทธิ์เคลือบสีเทอร์ควอยซ์ ความงามอันน่าทึ่งนี้สามารถทำได้โดยช่างฝีมือชั้นนำในสาขาของตนเท่านั้น"
 peacock_throne_name:0 "บัลลังก์นกยูง"
 peacock_throne_description:0 "บัลลังก์อันหรูหรานี้มีจุดมุ่งหมายเพื่อสร้างที่ประทับของจัมชีดขึ้นมาใหม่ กล่าวกันว่าช่างฝีมือจากทั่วโลกมารวมตัวกันเพื่อประกอบทองคำ เงิน และอัญมณีล้ำค่าหลายร้อยเม็ดเข้ากับบัลลังก์ที่ตั้งอยู่ตรงหน้าท่าน"
 artifact_banner_islam_name:0 "ธงศักดิ์สิทธิ์ของมูฮัมหมัด"
 artifact_banner_islam_description:0 "กล่าวกันว่านี่คือธงศักดิ์สิทธิ์ของมูฮัมหมัด ของที่ระลึกจากสมัยของศาสดาและสัญลักษณ์ของศรัทธาอิสลามทั้งหมด"
 artifact_spear_of_the_prophet_name:0 "หอกของศาสดา"
 artifact_spear_of_the_prophet_description:0 "ตามรายงาน หอกของมูฮัมหมัด นำมาเป็นของขวัญโดยผู้ปกครองแห่งอบิสซิเนียแก่อัล-ซุบัยร์ บิน อัล-เอาวาม"
 artifact_mantle_of_the_prophet_islam_name:0 "เสื้อคลุมของศาสดา"
 artifact_mantle_of_the_prophet_description:0 "สืบทอดมาหลายศตวรรษจากกาหลิบองค์หนึ่งไปยังอีกองค์หนึ่ง นี่คือเสื้อคลุมของศาสดา ตามประเพณี กาหลิบจะสวมใส่ในช่วงวันหยุดเทศกาลทั้งหมด ทำให้เขามีบรรยากาศแห่งความสงบและศักดิ์ศรีที่เหนือกว่า"
 afarganyu_name:0 "อาฟาร์กันยู"
 artifact_afarganyu_description:0 "ภาชนะขนาดใหญ่นี้เป็นที่จุดไฟศักดิ์สิทธิ์ ซึ่งเป็นศูนย์กลางของพิธีกรรมหลายอย่างของศาสนาโซโรอัสเตอร์ จารึกเก่าแก่กล่าวถึงบุคคลที่บริจาคให้แก่คณะนักบวช แต่เดิม"
 siddhachakra_name:0 "สิทธจักร"
 artifact_siddhachakra_description:0 "นี่คือแผนภาพลึกลับที่ชาวเชนใช้ในการบูชา ตรงกลางมีดอกบัวบานล้อมรอบด้วยเทพบนกลีบดอกไม้ สัญลักษณ์ที่เชื่อมโยงกับตำนานของกษัตริย์ศรีปาละและพระมเหสีมายานสุนทรี"
 artifact_staff_kakusandha:0 "ไม้เท้าของพระกกุสันธพุทธเจ้า"
 artifact_staff_kakusandha_desc:0 "พระกกุสันธพุทธเจ้า พระพุทธเจ้าองค์แรกแห่งภัทรกัปปัจจุบัน ทรงเป็นเจ้าของไม้เท้านี้ ทั้งเพื่อป้องกันสัตว์อันตรายและไล่สัตว์เล็กๆ เพื่อไม่ให้ถูกพระภิกษุจรเหยียบย่ำ"
 water_filter_konagamana:1 "เครื่องกรองน้ำของพระโกนาคมนพุทธเจ้า"
 water_filter_konagamana_desc:0 "พระโกนาคมนพุทธเจ้า พระพุทธเจ้าองค์ที่สองแห่งภัทรกัปปัจจุบัน ทรงพกเครื่องกรองน้ำนี้ติดตัวไปในการเดินทาง ผ้าผืนเรียบง่ายนี้มีประโยชน์สองประการ ทั้งเป็นเครื่องกรองน้ำดื่มและ เพื่อให้แน่ใจว่าแมลงต่างๆ ถูกกรองออกอย่างปลอดภัยและด้วยความเมตตา"
 robe_kassapa:2 "ชิ้นส่วนจีวรของพระกัสสปพุทธเจ้า"
 robe_kassapa_desc:0 "พระกัสสปพุทธเจ้า พระพุทธเจ้าองค์ที่สามแห่งภัทรกัปปัจจุบัน ทรงครองจีวรนี้เป็นส่วนใหญ่ในชีวิตประจำวัน ผ้าเนื้อหยาบที่น่าประหลาดใจนี้เป็นที่เคารพบูชาเป็นพิเศษ เนื่องจากเป็นหนึ่งในไม่กี่ชิ้นที่ทราบกันว่าเป็นเครื่องนุ่งห่มของพระพุทธเจ้าที่ยังคงหลงเหลืออยู่"
