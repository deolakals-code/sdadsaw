 blooded_blade:0 "ดาบอาบเลือด"
 blooded_blade_description:0 "ลวดลายหมุนวนและหยักบนอาวุธนี้เป็นตัวบ่งชี้ที่ละเอียดอ่อนถึงความเปราะบางสัมพัทธ์ของดาบ แต่ยัง รวมถึงมรดกของมันด้วย: อาวุธที่ชุบในเลือดของ [ROOT.Char.GetTitledFirstName]"
