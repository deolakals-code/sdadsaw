 kurgan_saddle_description:1 "อานม้าที่ [inspiration_owner.GetTitledFirstName] ฉกมาจากสุสานไซเธียน อายุกว่าพันปี ได้รับการอนุรักษ์ไว้ในอากาศที่กักขังของสุสาน ท่ามกลางร่างม้าดองหลายสิบตัว บางทีเราอาจเรียนรู้อะไรบางอย่างจากวิถีของนักรบบนหลังม้าโบราณได้"
