 immaculate_witchy_bones:0 "กระดูกแม่มดอันบริสุทธิ์"
 immaculate_witchy_bones_description:0 "กองกระดูกที่เคยเป็นของแม่มดแห่ง [ROOT.Char.GetCurrentLocation.GetTitle.GetNameNoTier] แม้หลังจากการเผาของ [witch_scope.GetHerHis] กระดูกก็ยังคงบริสุทธิ์"
 mysterious_lamp:0 "ตะเกียงลึกลับ"
 mysterious_lamp_description:0 "ตะเกียงทองคำส่องประกาย ประดับด้วยอัญมณี รู้สึกถึงพลังจักรวาลอันมหาศาลเมื่อถือมัน"
 mysterious_puzzle:0 "ปริศนาลึกลับ"
 mysterious_puzzle_description:0 "ปริศนาทองคำหรูหราที่ปกคลุมด้วยการแกะสลักเป็นภาษาต่างประเทศ กล่าวกันว่าเคยเป็นของปรมาจารย์แห่งเกมผู้ทรงพลัง"
 lunchbox:0 "กล่องถนอมอาหาร"
 lunchbox_description:0 "กล่องที่ปิดสนิท ซึ่งดูเหมือนจะยืดอายุการบริโภคของอาหารที่ใส่ไว้ข้างใน"

