 mythical_creature_figurine.desc:1 "รูปปั้นที่แสดงภาพ [SCOPE.Custom('RegionalMythicalCreatureLower')] [new_trinket.Custom('ArtifactAnimalAdjective')] นี้ดูเหมือนจะ [ROOT.Char.Custom('TrinketLookAdverbFollowup')] [ROOT.Char.Custom('TrinketLookAdjective')] พร้อมอัญมณีเม็ดเล็กๆ สุกใสที่เป็นของพื้นเมือง [ROOT.Char.GetCurrentLocation.GetNameNoTooltip]"
 st_davids_taper:1 "เทียนเรียวของนักบุญเดวิด"
