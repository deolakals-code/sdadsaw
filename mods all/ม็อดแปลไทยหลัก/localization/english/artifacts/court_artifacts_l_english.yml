 artifact_book_title:0 "[newly_created_artifact.GetFeatureText( 'book_title' )]"
 artifact_book_description:0 "[newly_created_artifact.Custom('ArtifactBookDescType')] [newly_created_artifact.GetFeatureText( 'book_decoration' )]"
 artifact_book_title_based_desc:0 "หนังสือ [ROOT.Artifact.GetOwner.Custom('ArtifactArticleBookContentQuality')|U] ที่ให้รายละเอียดเกี่ยวกับการเสียสละและการทำงานหนักทั้งหมดเพื่อ ทำให้ [ROOT.Artifact.GetFeatureText( 'book_topic' )] เป็นไปได้ ตัวอักษรมีคุณภาพระดับ [ROOT.Artifact.GetOwner.Custom('ArtifactQuality')] และมีการประดับตก แต่งอย่าง [ROOT.Artifact.GetOwner.Custom('ArtifactAdverbWealth')]"
 artifact_book_other_desc_1:0 "ตำรา [ROOT.Artifact.GetOwner.Custom('ArtifactArticleWealth')|U] ที่แสดงความเข้าใจระดับ [ROOT.Artifact.GetOwner.Custom('ArtifactArticleBookContentQuality')] ในเรื่อง [ROOT.Artifact.GetFeatureText( 'book_subject' )] โดยกล่าวถึงหัวข้อต่าง ๆ เช่น [ROOT.Artifact.GetFeatureText( 'book_topic' )]"
 artifact_book_other_desc_2:0 "หนังสือเกี่ยวกับ [ROOT.Artifact.GetFeatureText( 'book_topic' )] – เต็มไปด้วยความคิดเห็นระดับ [ROOT.Artifact.GetOwner.Custom('ArtifactBookContentQuality')] และภาพประกอบอย่าง [ROOT.Artifact.GetOwner.Custom('ArtifactAdverbWealth')]"
 artifact_book_other_desc_3:0 "งานเขียน [ROOT.Artifact.GetOwner.Custom('ArtifactArticleBookContentQuality')|U] ที่อภิปรายอย่างกว้างขวางเกี่ยวกับ [ROOT.Artifact.GetFeatureText( 'book_topic' )] ประดับตก แต่งและมีภาพประกอบอย่าง [ROOT.Artifact.GetOwner.Custom('ArtifactAdverbWealth')]"
 artifact_book_other_desc_4:0 "หนังสือ [ROOT.Artifact.GetOwner.Custom('ArtifactArticleWealth')|U] ที่แสดงความเข้าใจระดับ [ROOT.Artifact.GetOwner.Custom('ArtifactArticleBookContentQuality')] ในเรื่อง [ROOT.Artifact.GetFeatureText( 'book_subject' )] โดยให้รายละเอียดเกี่ยวกับ [ROOT.Artifact.GetFeatureText( 'book_topic' )]"
 artifact_book_other_desc_5:0 "ต้นฉบับ [ROOT.Artifact.GetOwner.Custom('ArtifactArticleWealth')|U] ที่ให้รายละเอียดระดับ [ROOT.Artifact.GetOwner.Custom('ArtifactBookContentQuality')] เกี่ยวกับ [ROOT.Artifact.GetFeatureText( 'book_topic' )] หน้ากระดาษมีการประดับตก แต่งอย่างกว้างขวางและมีภาพประกอบมากมาย ที่โดดเด่นที่สุดคือภาพหอยทากขนาดใหญ่"
