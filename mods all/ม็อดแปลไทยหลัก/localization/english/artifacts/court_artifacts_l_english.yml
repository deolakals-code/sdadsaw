 # Decorations for wooden furniture.
 feature_wood_decoration_none:0 "เนื้อไม้ถูกขัดจนเรียบเนียน"
 feature_wood_decoration_varnish:0 "เนื้อไม้ถูกเคลือบเงา เพื่อให้มีความเงางาม สีเข้ม และดูหรูหรา"
 feature_wood_decoration_hsb_inlay:0 "เนื้อไม้ประดับตก แต่งด้วย [Artifact.GetFeatureText( 'decoration_material_inlay_HSB' )]"
 feature_wood_decoration_painted_pattern:0 "เนื้อไม้ถูกทาสีด้วย [Artifact.GetFeatureText( 'decoration_pattern' )]"

 # Thrones 
 artifact_throne_charlemagne_name:1 "บัลลังก์แห่งชาร์เลอมาญ"
 artifact_throne_charlemagne_description:0 "บัลลังก์ที่เรียบง่าย แต่โอ่อ่า ปราศจากเครื่องประดับ สร้างจากหินอ่อนแท้ มีข่าวลือว่าแผ่นหินนำมาจากโบสถ์พระคูหาศักดิ์สิทธิ์ในเยรูซาเลม"
 artifact_throne_solomon_name:1 "บัลลังก์แห่งโซโลมอน"
 artifact_throne_solomon_description:0 "บัลลังก์อันหรูหราโอ่อ่า มีข่าวลือว่าเคยเป็นของกษัตริย์โซโลมอนในตำนาน สร้างจากงาช้างและปิดทอง ประดับด้วยอัญมณีล้ำค่ามากมาย และมีประติมากรรมโลหะรูปสัตว์ต่าง ๆ ประดับขั้นบันไดที่ทอดขึ้นสู่บัลลังก์"
 artifact_throne_stone_scone_name:1 "ศิลาแห่งสโคน"
 artifact_throne_stone_scone:0 "ที่ประทับเรียบง่ายทำจากหินทรายสีแดง ซึ่งกษัตริย์แห่งอัลบาทุกพระองค์ได้ประกอบพิธีราชาภิเษกบนศิลานี้นับตั้งแต่รัชสมัยพระเจ้าเคนเนธที่ 1"
 artifact_byz_throne_name: "บัลลังก์ไบแซนไทน์แห่งโซโลมอน"
 artifact_byz_throne_description: "บัลลังก์อันสง่างาม ซึ่งผู้ปกครองไบแซนไทน์ใช้บริหารความยุติธรรมด้วยพระปรีชาสามารถเทียบเท่ากษัตริย์ในพระคัมภีร์ ลักษณะเด่นที่สุดคือกลไกที่ซ่อนอยู่ ซึ่ง ทำให้บัลลังก์สามารถยกสูงขึ้นถึงเพดานแล้วลดระดับลงมาได้"

 # Banner
 artifact_wall_banner_battle_name:1 "ธงศึก [epic_loser.GetPrimaryTitle.GetAdjectiveNoTooltip]"
 artifact_wall_banner_battle_description:1 "ธงศึกของกองทัพแห่ง [epic_loser.GetPrimaryTitle.GetName] ยึดมาจากกองกำลังของพวกเขาหลังยุทธการที่ [epic_battle_location.GetName]"
 artifact_wall_banner_royal_name:0 "ธงหลวง [target.GetAdjectiveNoTooltip]"
 artifact_wall_banner_royal_description:1 "นี่คือธงของ [target.GetNameNoTooltip] สร้างขึ้นเพื่อเป็นเกียรติแก่การดำรงตำแหน่งของ [target.GetHolder.GetTitledFirstNameRegnal]"
 artifact_wall_banner_house_name:0 "ธงประจำตระกูล [target.GetBaseNameNoTooltip]"
 artifact_wall_banner_house_description:1 "นี่คือธงของตระกูล [target.GetBaseName] สัญลักษณ์แห่งอำนาจของครอบครัวและทายาท"
 artifact_wall_banner_dynasty_name:0 "ธงประจำราชวงศ์ [target.GetBaseNameNoTooltip]"
 artifact_wall_banner_dynasty_description:1 "นี่คือธงของราชวงศ์ [target.GetBaseName] สัญลักษณ์แห่งอำนาจของสายเลือดและสมาชิกทุกคน ได้รับการสั่งทำโดย [newly_created_artifact.MakeScope.Var('banner_commissioner').Char.GetNameRegnal]"
 artifact_wall_banner_name:1 "ธง [target.GetAdjectiveNoTooltip]"
 artifact_wall_banner_description:3 "นี่คือธง [target.GetAdjective] สัญลักษณ์แห่งอำนาจของ [target.GetHolder.GetTitleAsName]"

 artifact_wall_banner_kaviani_name:0 "เดรัฟช์ คาวิอานี"
 artifact_wall_banner_kaviani:1 "นี่คือ เดรัฟช์ คาวิอานี ในตำนาน — ธงหลวงของจักรวรรดิซาเซเนียนที่ล่มสลาย สัญลักษณ์แห่งอัตลักษณ์และความภาคภูมิใจของผู้สืบทอดจักรวรรดิเปอร์เซีย"
 artifact_wall_big_edessa_name:1 "รูปแห่งเอเดสซา"
 artifact_wall_big_edessa:2 "นี่คือ แมนดิเลียน ผืนผ้าที่มีภาพใบหน้าของพระเยซูอย่างน่าอัศจรรย์ ซึ่งเป็นรูปเคารพชิ้นแรกของศาสนาคริสต์ ต้นกำเนิดเกี่ยวข้องกับกษัตริย์อับการ์แห่งเอเดสซา"

 # Shield
 artifact_wall_shield:0 "โล่ติดผนัง"
 artifact_wall_shield_name:0 "โล่ $artifact_name_prefix$"
 artifact_wall_shield_description:1 "โล่ไม้ด้วยฝีมือระดับ [SCOPE.Custom('ArtifactQuality')] สร้างจากแผ่นไม้ [newly_created_artifact.GetFeatureText( 'shaft_wood' )] ที่แข็งแรง และยึดเข้าด้วยกันด้วยขอบ [newly_created_artifact.GetFeatureText( 'head_metal' )] ขอบโล่ประดับด้วย [newly_created_artifact.GetFeatureText( 'decoration_material_inlay_HSB' )] และทาสีเป็นรูป [newly_created_artifact.GetFeatureText( 'decoration_pattern' )]"
 artifact_wall_shield_special:0 "$artifact_wall_shield$"
 artifact_wall_axe_description:0 "$artifact_axe_description$"
 artifact_wall_sword_description:0 "$artifact_sword_description$"
 artifact_wall_spear_description:0 "$artifact_spear_description$"
 artifact_wall_hammer_description:0 "$artifact_hammer_description$"
 artifact_wall_mace_description:0 "$artifact_mace_description$"
 artifact_wall_dagger_description:0 "$artifact_dagger_description$"

 artifact_wall_cid_sword_name:0 "ทิโซนา"
 artifact_wall_el_cids_sword:1 "นี่คือดาบยาวสามฟุตที่มีจารึกว่า "ทิโซนา" มีข่าวลือว่าขุนศึกผู้โด่งดัง เอล ซิด ได้ดาบนี้มาจากการเอาชนะเจ้าของเดิม การปรากฏของดาบเล่มนี้เพียงอย่างเดียวก็ปลุกเร้าความรู้สึกน่าเกรงขามทางทหารได้"

 artifact_radzig_kobyla_longsword_name:0 "ดาบยาวของรัดซิก โคบีลา"
 artifact_henrys_longsword_name:0 "ดาบยาวของเฮนรี่"
 artifact_radzig_kobyla_longsword_description:0 "ข่าวลืออ้างว่าดาบเล่มนี้ถูกตีขึ้นเพื่อ "เซอร์ รัดซิก โคบีลา" และคาดว่าสูญหายไปนานแสนนาน จนกระทั่งถูกค้นพบโดยชายผู้หิวโหยคนหนึ่งในการเดินทางเพื่อล้างแค้นของเขา"

 artifact_wall_sword_muhammad_name:1 "ดาบแห่งมุฮัมมัด"
 artifact_wall_sword_muhammad:0 "หนึ่งในดาบเก้าเล่มที่แท้จริงของศาสดามุฮัมมัด นี่คือ [SCOPE.Custom('MuhammadSword')]"
 artifact_wall_sword_muhammad_aladb:0 "อัล-อัดบ์ — มุฮัมมัดใช้ในยุทธการที่บะดัรและอุฮุด"
 artifact_wall_sword_muhammad_almathur:0 "อัล-มะษูร — บิดาส่งต่อให้มุฮัมมัด"
 artifact_wall_sword_muhammad_arrasub:0 "อัร-รอซูบ — มรดกตกทอดของตระกูลมุฮัมมัด"
 artifact_wall_sword_muhammad_albattar:0 "อัล-บัตตาร — มุฮัมมัดยึดมาเป็นของเชลยจากเผ่าบะนู ก็อยนุเกาะอ์"
 artifact_wall_sword_muhammad_haft:0 "ฮัฟต์ — มุฮัมมัดยึดมาเป็นของเชลยจากเผ่าบะนู ก็อยนุเกาะอ์"
 artifact_wall_sword_muhammad_qali:0 "ก็อลอี — มุฮัมมัดยึดมาเป็นของเชลยจากเผ่าบะนู ก็อยนุเกาะอ์"
 artifact_wall_sword_muhammad_dhu:0 "ซุลฟิการ์ — มุฮัมมัดยึดมาเป็นของเชลยในยุทธการที่บะดัร"
 artifact_wall_sword_muhammad_mikhdham:0 "อัล-มิคฎอม — มุฮัมมัดส่งต่อให้แก่ อะลี อิบน์ อะบี ฏอลิบ ลูกพี่ลูกน้องและบุตรเขย"
 artifact_wall_sword_muhammad_alqadib:0 "อัล-เกาะฎีบ — ดาบที่เก็บไว้ในบ้านของมุฮัมมัด"
 artifact_wall_sword_attila_name:1 "ดาบแห่งพระเจ้า"
 artifact_wall_sword_attila_description:0 "ดาบในตำนานของอัตติลา หัวหน้าเผ่าฮั่น ผู้เป็นหายนะแห่งพระเจ้า หรือที่รู้จักในนาม ดาบแห่งมาร์ส"

 artifact_sword_goujian_name: "ดาบของโกวเจี้ยน"
 artifact_sword_goujian: "กล่าวกันว่าดาบโบราณเล่มนี้เคยเป็นของโกวเจี้ยน อ๋องแห่งแคว้นเยว่ แม้จะมีรูปแบบที่ล้าสมัย แต่ดาบเล่มนี้ก็แสดงให้เห็นถึงงานฝีมืออันยอดเยี่ยม อักษรเคลือบทองแบบตราประทับนกและหนอนปรากฏให้เห็นใกล้กับด้ามดาบ"
 artifact_sword_goujian_refulgence: "[gujian_sword.GetDesc]\n\nเชื่อกันว่านี่คือดาบ "จรัสแสง" ซึ่งโกวเจี้ยนสวมใส่เมื่อครั้งไปขอคำแนะนำจากขงจื๊อ"
 artifact_sword_goujian_purity: "[gujian_sword.GetDesc]\n\nเชื่อกันว่านี่คือดาบ "บริสุทธิ์""

 # Animals (used in ArtifactAnimalType)
 animal_type_cat:0 "แมว"
 animal_type_dog:0 "สุนัข"
 animal_type_fox:0 "สุนัขจิ้งจอก"
