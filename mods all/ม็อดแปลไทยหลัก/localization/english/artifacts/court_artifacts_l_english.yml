 feature_book_topic_alchemy_the_great_book_of_mercy:0 "สำเนางานเขียนเกี่ยวกับการเล่นแร่แปรธาตุของ ญาบิร อิบนุ ฮัยยาน เรื่อง ตำราเมตตาอันยิ่งใหญ่ ระดับ [Artifact.GetOwner.Custom('ArtifactArticleBookContentQuality')|U] พร้อมภาพประกอบและประดับตก แต่งอย่าง [Artifact.GetOwner.Custom('ArtifactAdverbWealth')]"
 feature_book_title_alchemy_the_book_of_seventy:0 "ตำราเจ็ดสิบ"
 feature_book_topic_alchemy_the_book_of_seventy:0 "สำเนาคู่มือฉบับสมบูรณ์ของ ญาบิร อิบนุ ฮัยยาน ระดับ [Artifact.GetOwner.Custom('ArtifactArticleBookContentQuality')|U] ที่อธิบายการสร้างยาอายุวัฒนะ ทฤษฎีเกี่ยวกับธาตุทั้งสี่ และการใช้สารจากสัตว์ในการเล่นแร่แปรธาตุ"
 feature_book_title_alchemy_mercury:0 "$artifact_name_prefix_artifact_scope$ คู่มือปรอท"
 feature_book_topic_alchemy_mercury:1 "ตำรา [Artifact.GetOwner.Custom('ArtifactArticleWealth')|U] ที่มีคำแนะนำระดับ [Artifact.GetOwner.Custom('ArtifactArticleBookContentQuality')] สำหรับการทำสีย้อมสีแดงชาด – ซึ่งเป็นที่ต้องการสำหรับใช้ในภาพประกอบ – โดยการรวมกำมะถันและปรอท"
 feature_book_title_alchemy_arsenic:0 "$artifact_name_prefix_artifact_scope$ ราชันย์แห่งยาพิษ"
 feature_book_topic_alchemy_arsenic:1 "ตำรา [Artifact.GetOwner.Custom('ArtifactArticleWealth')|U] ที่มีคำแนะนำระดับ [Artifact.GetOwner.Custom('ArtifactArticleBookContentQuality')] สำหรับการเตรียมสารหนูโลหะ ซึ่งเป็นยาพิษร้ายแรงและแนบเนียน"
 feature_book_title_alchemy_gold:0 "$artifact_name_prefix_artifact_scope$ ตำราแปรธาตุทองคำ"
 feature_book_topic_alchemy_gold:1 "ตำรา [Artifact.GetOwner.Custom('ArtifactArticleWealth')|U] ที่มีคำแนะนำระดับ [Artifact.GetOwner.Custom('ArtifactArticleBookContentQuality')] สำหรับการแปรธาตุทองคำจากตะกั่วและโลหะฐานอื่น ๆ ผู้อ่านพึงระวังว่าผลลัพธ์อาจแตกต่างกันไป"
 feature_book_title_alchemy_silver:0 "$artifact_name_prefix_artifact_scope$ ตำราแปรธาตุเงิน"
 feature_book_topic_alchemy_silver:1 "ตำรา [Artifact.GetOwner.Custom('ArtifactArticleWealth')|U] ที่มีคำแนะนำระดับ [Artifact.GetOwner.Custom('ArtifactArticleBookContentQuality')] สำหรับการแปรธาตุเงินจากทองแดงและโลหะฐานอื่น ๆ ผู้อ่านพึงระวังว่าผลลัพธ์อาจแตกต่างกันไป"

# relationships
 feature_book_title_soulmate:0 "$artifact_name_prefix_artifact_scope$ ความภักดี"
 feature_book_topic_soulmate:0 "ต้นฉบับ [Artifact.GetOwner.Custom('ArtifactArticleWealth')|U] ที่ประดับตก แต่งอย่างมีสีสัน ถ่ายทอดความภักดีที่ [Artifact.GetOwner.GetTitledFirstName] รู้สึกต่อ [Artifact.GetOwner.MakeScope.Var('book_topic_relationship').Char.GetTitledFirstName] อย่าง [Artifact.GetOwner.Custom('ArtifactAdverbBookContentQuality')] – ทำให้ความรักของพวกเขากลายเป็นอมตะ"
 feature_book_title_nemesis:0 "ความเกลียดชังอันไม่ดับสูญของ [Artifact.GetOwner.GetTitledFirstName]"
