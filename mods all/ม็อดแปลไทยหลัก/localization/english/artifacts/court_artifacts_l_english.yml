 ##############################
 # Procedural court artifacts #
 ##############################

 # Wall Decorations - Large
 artifact_wall_tapestry_name:0 "$artifact_name_prefix$ Tapestry"
 artifact_wall_tapestry_description:1 "A large [newly_created_artifact.GetFeatureText( 'generic_material_cloth' )] tapestry of [SCOPE.Custom('ArtifactQuality')] craftsmanship. [newly_created_artifact.GetFeatureText( 'tapestry_scene' )]"
 feature_tapestry_scene_religious:0 "ผืนผ้าปักแสดงฉากสำคัญหลายฉากจากคัมภีร์ของศาสนา [Artifact.GetOwner.GetFaith.GetAdjectiveNoTooltip]"
 feature_tapestry_scene_historical:0 "ผืนผ้าปักแสดงการก่อตั้ง [Artifact.GetOwner.GetPrimaryTitle.GetName] และเหตุการณ์สำคัญทางประวัติศาสตร์อื่น ๆ ที่นำไปสู่รัชสมัยของ [Artifact.GetOwner.GetTitledFirstName]"
 feature_tapestry_scene_geometric_patterns:0 "ผืนผ้าทอขึ้นเป็นลวดลายอันวิจิตรของรูปทรงเรขาคณิตที่สอดประสานกัน"
 feature_tapestry_scene_hunt:0 "ผืนผ้าปักแสดงฉากการล่าสัตว์: นักล่าหลายคนถือธนูและหอก ล้อมรอบสัตว์ที่บาดเจ็บและกำลังจะปลิดชีพมัน"
 feature_tapestry_scene_myth:0 "เทพเจ้าโบราณ สัตว์ประหลาดน่าเกรงขาม และวีรบุรุษผู้กล้าหาญถูกทอลงบนผืนผ้านี้ แสดงฉากจากตำนานปรัมปรา"
 feature_tapestry_scene_calligraphic:0 "ผืนผ้าทอขึ้นเป็นลวดลายอันวิจิตร ซึ่งตัวอักษรวิจิตรบรรจงผสมผสานเข้ากับรูปทรงเรขาคณิตได้อย่างลงตัว"
 feature_tapestry_scene_bucolic:0 "ผืนผ้าปักแสดงฉากอันเงียบสงบของชีวิตประจำวันในท้องทุ่งตลอดทั้งปี: บ้างหว่านเมล็ด บ้างไถนา และบ้างเก็บเกี่ยวผลผลิต"
 feature_tapestry_scene_battle:0 "ผืนผ้าปักแสดงจุดเปลี่ยนของยุทธการอันเลื่องชื่อที่ [Artifact.GetOwner.MakeScope.Var('epic_battle_location').Province.GetName] ซึ่ง [Artifact.GetOwner.GetTitledFirstName] ได้รับชัยชนะเหนือ [Artifact.GetOwner.MakeScope.Var('epic_loser').Char.GetTitledFirstName]"
 feature_tapestry_scene_coronation:0 "[Artifact.GetOwner.GetTitledFirstName|U] ปรากฏอยู่ ณ ศูนย์กลางของฉากระหว่างพิธีราชาภิเษกของ [Artifact.GetOwner.GetHerHis] ประทับบนราชบัลลังก์ท่ามกลางฝูงชนที่โห่ร้องยินดี"
 feature_tapestry_scene_ships:0 "ผืนผ้าปักแสดงกองเรืออันเกรียงไกรกำลังแล่นในทะเล — บนเรือ แต่ละลำ นักรบติดอาวุธกำลังสอดส่องขอบฟ้าเพื่อมองหาศัตรู"
 feature_tapestry_scene_animals:0 "ผืนผ้าปักแสดงภาพสัตว์นักล่า ตรงกลางเป็นสิงโตทรงพลังตะครุบกวางที่ดิ้นรนหนีอย่างเปล่าประโยชน์"
 feature_tapestry_scene_banquet:0 "ผืนผ้าปักแสดงงานเลี้ยงอันหรูหราในราชสำนักของ [Artifact.GetOwner.GetTitledFirstName]: แขกผู้มีเกียรตินั่งอยู่ที่โต๊ะอาหารอันโอชะ ขณะที่ผู้ให้ความบันเทิงเล่นดนตรีและเต้นรำ"
 feature_tapestry_scene_hearing:0 "ผืนผ้าปักแสดงการพิจารณาคดีในราชสำนัก: [Artifact.GetOwner.GetTitledFirstName] ประทับอย่างสง่างาม ณ ศูนย์กลางของฉาก ขณะที่ข้าในบังคับ ทูต ศัตรูผู้พ่ายแพ้ และข้ารับใช้รอเข้าแถวถวายความเคารพ"
 feature_tapestry_scene_garden:0 "สวนอันงดงามปรากฏบนผืนผ้า: หญ้าเขียวขจี ดอกไม้บานสะพรั่งหลากสีสัน และต้นไม้ที่เต็มไปด้วยผลดูราวกับจะสูงเทียมฟ้า"
 create_artifact_tapestry_tooltip:0 "[inspiration_owner.GetShortUIName] ได้สร้างพรมผนังขนาดใหญ่ด้วยฝีมือระดับ [SCOPE.Custom('ArtifactQuality')]"

 # Thrones
 artifact_throne_special:0 "$artifact_throne$"
 artifact_throne_name:0 "บัลลังก์ $artifact_name_prefix$"
 artifact_throne_description:1 "ราชบัลลังก์อันสง่างามด้วยฝีมือระดับ [SCOPE.Custom('ArtifactQuality')] โครงสร้างทำจากเสาไม้ [newly_created_artifact.GetFeatureText( 'generic_material_wood' )] แท้ และเบาะรองนั่งบุด้วยหมอนอิง [newly_created_artifact.GetFeatureText( 'generic_material_cloth' )]"
 create_artifact_throne_tooltip:0 "[inspiration_owner.GetShortUIName] ได้สร้างราชบัลลังก์อันสง่างามด้วยฝีมือระดับ [SCOPE.Custom('ArtifactQuality')]"

