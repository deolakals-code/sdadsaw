 artifact_pedestal_sakanoue_sword_name: "บันเกะ โนะ โฮเค็น" # 坂家宝剣
 artifact_pedestal_sakanoue_sword_desc: "ดาบเล่มนี้เคยถูกใช้โดยแม่ทัพชื่อดัง $dynn_Sakanoue$ $Tamuramaro$ และกล่าวกันว่าใช้ปกป้องราชสำนัก ถูกถวายแด่ราชสำนักโดย $Saga_JP$ $king_tenno_male_japanese$ เมื่อ $Tamuramaro$ สิ้นชีพ"
 artifact_higekiri_sword_name: "ฮิเงคิริ"
 artifact_higekiri_sword_desc: "ดาบ 'ผู้ตัดเครา' นี้ ได้รับการสั่งทำขึ้นพร้อมกับฮิซามารุโดย $dynn_Minamoto$ โนะ $Mitsunaka$ และสืบทอดกันมาในตระกูล $Seiwa$ $dynn_Minamoto$"
 artifact_hizamaru_sword_name: "ฮิซามารุ"
 artifact_hizamaru_sword_desc: "ดาบนี้ได้รับการสั่งทำขึ้นพร้อมกับฮิเงคิริโดย $dynn_Minamoto$ โนะ $Mitsunaka$ และสืบทอดกันมาในตระกูล $Seiwa$ $dynn_Minamoto$"
 artifact_dojigiri_sword_name: "โดจิกิริ"
 artifact_dojigiri_sword_desc: "ดาบเล่มนี้ถูกตีขึ้นโดยช่างตีดาบชื่อดัง $Yasutsuna_4$ เพื่อ $dynn_Fujiwara$ $Toshihito$ และสืบทอดต่อกันมาในตระกูล $dynn_Fujiwara$"
 artifact_mikazuki_munechika_sword_name: "มิกะซึกิ"
 artifact_mikazuki_munechika_sword_desc: "ดาบ 'จันทร์เสี้ยว' นี้ ถูกตีขึ้นโดยช่างตีดาบผู้เลื่องชื่อ $dynn_SanjO_$ $Munechika_2$ ในรัชสมัยของ $IchijO_$ $king_tenno_male_japanese$"
 artifact_odenta_sword_name: "โอเด็นตะ"
 artifact_odenta_sword_desc: "ดาบนี้ถูกตีขึ้นโดยช่างตีดาบผู้เลื่องชื่อ $Mitsuyo$ ในรัชสมัยของ $Shirakawa$ $king_tenno_male_japanese$"
 artifact_pedestal_hamayumi_bow_name: "ฮะมะยุมิ" # 破魔弓
 artifact_pedestal_hamayumi_bow_desc: "'คันธนูทำลายอสูร' ถูกใช้โดย $dynn_Minamoto$ $Yorimasa$ ผู้ ซึ่งถูกเรียกตัวไปยังราชสำนักเพื่อขับไล่วิญญาณชั่วร้าย"
 artifact_pedestal_seven_branched_sword_name: "ชิจิชิโต" # 七支刀
 artifact_pedestal_seven_branched_sword_desc: "'ดาบเจ็ดแขนง' ดาบเหล็กที่มีเจ็ดแขนงคล้ายเปลวเพลิง กล่าวกันว่าเป็นของขวัญแห่งมิตรภาพแก่ $king_tenno_male_japanese$ ส่งข้ามทะเลมาจากกษัตริย์แห่งแพ็กเจเมื่อนานมาแล้ว"
 artifact_pedestal_gyerimro_dagger_name: "กริชต่างแดน"
 artifact_pedestal_gyerimro_dagger_desc: "กริชที่สร้างขึ้นอย่างวิจิตรเล่มนี้ ทั้งด้ามจับและฝักทำจากทองคำสลักซับซ้อนประดับอัญมณีล้ำค่า เป็นสมบัติล้ำค่าของราชสำนักชิลลา และกล่าวกันว่ามาจากดินแดนไกลโพ้นทางตะวันตก"
 artifact_karakawa_armor_name: "คาระคาวะ" # 唐皮
 artifact_karakawa_armor_desc: "ชุดเกราะโอโยโรอิที่สร้างขึ้นอย่างประณีตชุดนี้ เป็นของสืบทอดประจำตระกูลไทระ และกล่าวกันว่าเป็นของขวัญจากหลานชายของ $Kanmu$ $king_tenno_male_japanese$"
 artifact_nukemaru_sword_name: "นุเกะมารุ" # 抜丸
 artifact_nukemaru_sword_desc: "กล่าวกันว่าเทพีอามะเทราสึได้มอบดาบนี้แก่นายพรานในอิเสะ ดาบเล่มนี้ถูกซื้อโดย $dynn_Taira$ $Tadamori$ และกล่าวกันว่ามันได้ชักตัวเองออกจากฝักเมื่อมีงูมาคุกคามการนอนหลับของเขา"
 artifact_kogarasumaru_sword_name: "โคการาสุมารุ" # 小烏丸
 artifact_kogarasumaru_sword_desc: "'อีกาน้อย' ถูกตีขึ้นโดยอามากุนิเพื่อราชสำนัก และต่อมา $Suzaku$ $king_tenno_male_japanese$ ได้พระราชทานแก่ $dynn_Taira$ $Sadamori$ ในความดีความชอบจากกบฏโจเฮย์-เท็นเกียว"
 artifact_statue_green_amitabha_buddha_name: "พระอมิตาภพุทธะศิลาเขียว"
 artifact_statue_green_amitabha_buddha_descripton: "พระพุทธรูปอมิตาภะอันงดงามองค์นี้ดูราวกับถูกแกะสลักจากหินสีเขียวชิ้นเดียว ฐานประดับด้วยกลีบบัวและลวดลายระลอกคลื่น\n\nเล่าขานกันว่าพระพุทธรูปองค์นี้ปรากฏขึ้นอย่างปาฏิหาริย์จากซากปรักหักพังของเจดีย์ที่พังทลายลงไม่นานหลังการสร้าง"
