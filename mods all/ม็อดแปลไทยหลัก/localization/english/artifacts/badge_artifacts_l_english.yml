 prosperity_badge_name_1: "เครื่องประดับขัดมันแห่ง[newly_created_artifact.MakeScope.Var('pilgrim_badge_location').GetProvince.GetNameNoTooltip]"
 prosperity_badge_name_2: "เข็มกลัดแวววาวแห่ง[newly_created_artifact.MakeScope.Var('pilgrim_badge_location').GetProvince.GetNameNoTooltip]"
 prosperity_badge_name_3: "เข็มกลัดงดงามเลิศล้ำแห่ง[newly_created_artifact.MakeScope.Var('pilgrim_badge_location').GetProvince.GetNameNoTooltip]"
 virility_badge_name_1: "เข็มกลัดอันมั่นคงแห่ง[newly_created_artifact.MakeScope.Var('pilgrim_badge_location').GetProvince.GetNameNoTooltip]"
 virility_badge_name_2: "เครื่องประดับอันได้รับพรแห่ง[newly_created_artifact.MakeScope.Var('pilgrim_badge_location').GetProvince.GetNameNoTooltip]"
 wisdom_badge_name_1: "เข็มกลัดลึกลับแห่ง[newly_created_artifact.MakeScope.Var('pilgrim_badge_location').GetProvince.GetNameNoTooltip]"
 wisdom_badge_name_2: "เครื่องประดับไร้มลทินแห่ง[newly_created_artifact.MakeScope.Var('pilgrim_badge_location').GetProvince.GetNameNoTooltip]"
 generic_badge_protection_desc: "เข็มกลัดผู้แสวงบุญอันแข็งแรง ได้มาจาก[newly_created_artifact.MakeScope.Var('pilgrim_badge_location').GetProvince.GetNameNoTooltip] เล่าลือกันว่าช่วยคุ้มครองผู้สวมใส่"
 generic_badge_prosperity_desc: "เข็มกลัดผู้แสวงบุญอันแวววาว ได้มาจาก[newly_created_artifact.MakeScope.Var('pilgrim_badge_location').GetProvince.GetNameNoTooltip] เล่าลือกันว่านำความเจริญรุ่งเรืองมาสู่ผู้สวมใส่"
 generic_badge_virility_desc: "เข็มกลัดผู้แสวงบุญที่เปล่งประกายด้วยศรัทธาแรงกล้า ได้มาจาก[newly_created_artifact.MakeScope.Var('pilgrim_badge_location').GetProvince.GetNameNoTooltip] เล่าลือกันว่านำพลังชายชาตรีมาสู่ผู้สวมใส่"
 generic_badge_wisdom_desc: "เข็มกลัดผู้แสวงบุญอันเร้นลับ ได้มาจาก[newly_created_artifact.MakeScope.Var('pilgrim_badge_location').GetProvince.GetNameNoTooltip] เล่าลือกันว่าดลใจให้ผู้สวมใส่เกิดปัญญาและครุ่นคิดใคร่ครวญ"
