l_english:
 maria_conch_name: "สังข์นักบุญมารีอา"
 maria_conch_description: "เข็มกลัดผู้แสวงบุญที่ได้รับเมื่อออกเดินทางแสวงบุญ"
 maria_conch_description_protection: "เข็มกลัดผู้แสวงบุญเพื่อการคุ้มครองที่ได้รับเมื่อออกเดินทางแสวงบุญไปยัง[badge_location.GetProvince.GetBaronyNameExplicitly]"
 maria_conch_description_prosperity: "เข็มกลัดผู้แสวงบุญเพื่อความเจริญรุ่งเรืองที่ได้รับเมื่อออกเดินทางแสวงบุญไปยัง[badge_location.GetProvince.GetBaronyNameExplicitly]"
 santiago_badge_name: "หอยเชลล์ของนักบุญเจมส์"
 santiago_badge_description: "เข็มกลัดผู้แสวงบุญรูปหอยเชลล์ เพื่อระลึกถึงการแสวงบุญตามเส้นทางของนักบุญเจมส์ผ่านกามีโนเดซานเตียโกสู่สถานศักดิ์สิทธิ์ในซานเตียโกเดกอมโปสเตลา"
 jerusalem_badge_name: "กางเขนเยรูซาเลม"
 jerusalem_badge_description: "เข็มกลัดผู้แสวงบุญรูปกางเขนสี่เหลี่ยม ประณีตและละเอียดอ่อน เพื่อระลึกถึงการแสวงบุญสู่นครศักดิ์สิทธิ์เยรูซาเลม"
 rome_badge_name: "กุญแจของนักบุญเปโตร"
 rome_badge_description: "เข็มกลัดผู้แสวงบุญรูปพวงกุญแจ มีภาพนักบุญเปโตรและนักบุญเปาโลที่มีรัศมีเหนือเศียร เพื่อระลึกถึงการแสวงบุญสู่นครศักดิ์สิทธิ์โรม"
 generic_badge_name_1: "เข็มกลัดจิ๋วแห่ง[newly_created_artifact.MakeScope.Var('pilgrim_badge_location').GetProvince.GetNameNoTooltip]"
