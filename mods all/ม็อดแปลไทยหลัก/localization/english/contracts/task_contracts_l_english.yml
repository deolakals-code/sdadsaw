 ep3_contract_event.0095.t: "$ep3_contract_event.0092.t$"
 ep3_contract_event.0095.desc: "ข่าวมาถึงข้า: การสนับสนุนข้อกังวลของประชาชนทั่วไปของข้าได้กระตุ้นให้พวกเขาลงมือ! ผู้คนแข็งแกร่งรวมตัวกันเป็นกลุ่มอย่างภาคภูมิใจ โห่ร้องชื่อข้าและเขย่าอาวุธที่ทำขึ้นเอง—พร้อมสำหรับการลุกฮือ! โชคไม่ดีที่ข่าวนี้มาถึง [task_contract_councillor.GetName] ด้วย\n\n"ข้าคิดว่าเรามีข้อตกลงกันแล้ว? ว่าท่านกำลังรวบรวมคนโง่เหล่านั้นเพื่อ ทำให้พวกเขาตกใจ! ไม่ใช่ โดย [task_contract_councillor.GetFaith.GoodGodNames] เพื่อ #EMP ร้องไห้#! กับชะตากรรมของคนพาลเหล่านั้น! และตอนนี้ #EMP อะไร#!—ท่านจะเข้าร่วมกับสามัญชนในการก่อกบฏ!?""
 ep3_contract_event.0095.a: ""สิทธิ์เพื่อชาวนา!""
 ep3_contract_event.0095.a_2: "ข้าจะนำพวกเขาในสงครามเท่านั้น"
 ep3_contract_event.0095.a_become_landed: "@warning_icon! #X หากท่านชนะสงคราม ท่านจะกลายเป็น [landed|E]#!"
 ep3_contract_event.0095.a_remain_laamp: "@alert_icon! #alert_trial หากท่านชนะสงคราม ท่านจะยังคงเป็น [adventurer|E]#!"
 ep3_contract_event.0095.b: "อันที่จริงพวกเขา... อยู่ตามลำพัง"
 ep3_contract_event.0095.c: ""ไม่ เดี๋ยวก่อน: ข้าอธิบายทุกอย่างได้!""
