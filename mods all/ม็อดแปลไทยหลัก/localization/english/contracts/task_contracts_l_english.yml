 ep3_contract_event.0011.desc: "ข้าถูกนำตัวมาต่อหน้า [task_contract_target.GetTitledFirstName] [task_contract_target.GetHerselfHimself]\n\n"ท่านมาตามคำสั่งของ [task_contract_employer.GetTitledFirstNamePossessive] [task_contract_target.Custom2('RelationToMeShort',task_contract_employer)] ของข้า ใช่หรือไม่? มาด้วยธุระอันใด?"\n\n"
 ep3_contract_event.0011.desc_vip: "$ep3_contract_event.0011.desc$[task_contract_object.GetName] ก้าวไปข้างหน้า "ท่าน [task_contract_target.GetTitledFirstNameNoTooltip] ผู้ทรงเกียรติ ข้าพูดในนามของ [task_contract_employer.GetNameNoTooltip]! แต่สาส์นที่ข้านำมานั้นเหมาะสำหรับหูของท่านเท่านั้น"\n\n"มาเถิด" [task_contract_target.GetTitleAsNameNoTooltip] ตอบอย่างมืดมน "เราจะพูดคุยกันในห้องของข้า [ROOT.Char.GetTitledFirstNameNoTooltip] การรับใช้ของท่านเป็นที่รับทราบแล้ว — ท่านอาจพักเป็นแขกใน [task_contract_destination.GetHolding.GetType.GetName|l] ของข้าได้!""
 ep3_contract_event.0011.desc_artifact: "$ep3_contract_event.0011.desc$ข้านำ [escorted_artifact.GetName] ออกมา ท่ามกลางความตกตะลึงของราชสำนัก\n\n"ของขวัญชั้นเลิศ!" [task_contract_target.GetTitleAsNameNoTooltip] ร้องลั่น "ท่านทำได้ดีมาก นักผจญภัย ท่านอาจพักอยู่ต่อ และเพลิดเพลินกับความสุขสำราญของ [task_contract_destination.GetName]""
 ep3_contract_event.0011.desc_ward: "$ep3_contract_event.0011.desc$ข้าตบหลังของ [task_contract_object.GetFirstNamePossessive] เป็นครั้งสุดท้าย พลางนำ [task_contract_object.GetHerHim] ไปข้างหน้า "ข้าได้นำเยาวชนผู้สูงศักดิ์ ผู้สมควรได้รับการศึกษาอันประณีตมา"\n\n"
 ep3_contract_event.0011.desc_ward_accepted: "[task_contract_target.GetTitledFirstNameNoTooltip] รับการคารวะของ [task_contract_object.Custom('GirlBoy')] พลางกล่าวว่า: "นับ แต่นี้ไป [task_contract_object.Custom('GirlBoy')] ข้าจะเป็นครูและผู้ปกครองของเจ้า และหาก [ROOT.Char.GetSheHe] ปรารถนา สหายร่วมเดินทางของเจ้าก็อาจพักอยู่ที่นี่ได้ชั่วระยะเวลาหนึ่ง""
 ep3_contract_event.0011.desc_ward_too_old: "ข้าเกรงว่า" [task_contract_target.GetTitleAsNameNoTooltip] ตอบ พลางมองดูเยาวชนที่อยู่ต่อหน้า[task_contract_target.GetHerHim] "การเดินทางได้ ทำให้ [task_contract_object.GetWomanMan] ผู้นี้เป็นผู้ใหญ่แล้ว ข้าคงไม่ลดตัวลงไปปฏิบัติต่อ[task_contract_object.GetHerHim]ราวกับเด็กไร้เดียงสาตาโต""
 ep3_contract_event.0011.desc_ward_limit: "ข้าเกรงว่า" [task_contract_target.GetTitleAsNameNoTooltip] ตอบ "ข้าแบกรับภาระเด็กๆ ที่ร้องไห้กระจองอแงมากเกินไปแล้ว ไม่มีที่ว่างในราชสำนักของข้าสำหรับผู้อยู่ในอุปถัมภ์อีกคน""
 ep3_contract_event.0011.desc_gold: ""ท่าน [task_contract_target.GetName] ผู้สูงศักดิ์!" ข้าประกาศ "หีบใบนี้เต็มไปด้วยทองคำ เงิน และอัญมณี คัดสรรมาเพื่อท่านจากคลังสมบัติอันกว้างใหญ่ของ [task_contract_employer.GetName]!"\n\n[task_contract_target.GetTitledFirstNameNoTooltip] กระโดดลงจากบัลลังก์ของ[task_contract_target.GetHerHis]: "สรรเสริญ [task_contract_target.GetFaith.HighGodName] และสรรเสริญ [task_contract_employer.GetTitledFirstNameNoTooltip]! น้อยคนนักที่จะรู้จักความเอื้อเฟื้อ เช่นนี้! ขอบคุณท่าน นักเดินทาง ท่านยินดีต้อนรับอย่างยิ่งที่จะพักอยู่ใน [task_contract_destination.GetName]... โดยเฉพาะอย่างยิ่งหากมีเหรียญหลงเหลืออยู่รอบกระโจมของท่าน..."
 ep3_contract_event.0011.desc_explorer: "\n\n"ข้าไม่แน่ใจว่าจะมาถึง!" [task_contract_object.GetName] หอบหายใจ "แต่ท่านเป็นผู้นำทางที่มั่นคงผ่านทุกภยันตราย! ขอบคุณ ค่าจ้างของท่านสมควรได้รับแล้ว และท่านต้องยอมรับ — [task_contract_destination.GetNameNoTooltip] นั้นน่าทึ่งมาก!"
 ep3_contract_event.0011.desc_explorer_building: "เราอยู่ใน [task_contract_destination.GetName] และในที่สุด จุดหมายปลายทางของเราก็อยู่ตรงหน้า เราเข้าใกล้ [task_contract_destination.GetHolding.GetSpecialBuildingType.GetName]$ep3_contract_event.0011.desc_explorer$""
 ep3_contract_event.0011.desc_explorer_other: "ในที่สุด เราก็มาถึง [task_contract_destination.GetTerrain.GetName] ของ [task_contract_destination.GetTitle.GetName]: จุดหมายปลายทางของ [task_contract_object.GetNamePossessive]$ep3_contract_event.0011.desc_explorer$""
 ep3_contract_event.0011.desc_animal_dog: "$ep3_contract_event.0011.desc$ข้าแทบจะจับ [task_contract_target.Custom('DogStoryName')] ไว้ไม่อยู่ สุนัขหลุดออกจากสายจูง กระโจนเข้าใส่ [task_contract_target.GetTitledFirstNameNoTooltip] ชน[task_contract_target.GetHerHim]ล้มลงและเลียหน้าของ[task_contract_target.GetHerHis]"
 ep3_contract_event.0011.desc_animal_cat: "$ep3_contract_event.0011.desc$[task_contract_target.Custom('CatStoryName')] โผล่ออกมาจากตะกร้า เมื่อสังเกตเห็น [task_contract_target.GetTitledFirstNameNoTooltip] แมวก็เริ่มส่งเสียงคราง"
 ep3_contract_event.0011.desc_animal_dog_hate: "$ep3_contract_event.0011.desc_animal_dog$\n\n"เอาหมาสกปรกนี่ออกไปจากตัวข้า! กลิ่นของมัน — น่ารังเกียจจริงๆ! สาปแช่ง [task_contract_employer.GetTitledFirstNameNoTooltip] ที่ ทำให้ท้องพระโรงของข้าแปดเปื้อนด้วยสัตว์ร้ายตัวนี้!"
 ep3_contract_event.0011.desc_animal_dog_love: "$ep3_contract_event.0011.desc_animal_dog$\n\n"ท่านมอบความสุขให้ข้าอะไร เช่นนี้! ขอบคุณ นักเดินทาง ท่านได้อวยพรอาณาจักรของข้าด้วยสัตว์ตัวนี้ และยินดีต้อนรับให้อยู่ในนั้นนานเท่าที่ท่านต้องการ""
 ep3_contract_event.0011.desc_animal_cat_hate: "$ep3_contract_event.0011.desc_animal_cat$\n\n"นั่นแมวหรือ!? เอาปีศาจตัวน้อยผอมโซนั่นออกไปจากที่นี่! โอ้ย หัวข้าปวดแล้ว! จมูกข้าเหมือนจะระเบิด!"
 ep3_contract_event.0011.desc_animal_cat_love: "$ep3_contract_event.0011.desc_animal_cat$\n\n"โอ้ นั่น [task_contract_target.Custom('CatStoryName')] หรือ? [task_contract_employer.GetTitledFirstNameNoTooltip] ช่างใจกว้างเหลือเกิน! สำหรับส่วนของท่านในเรื่องนี้ นักเดินทาง ท่านอาจพักอยู่ที่นี่นานเท่าที่ท่านต้องการ""
 ep3_contract_event.0011.desc_construction: "ข้ามองไปยังสถานที่ก่อสร้างใน [task_contract_destination.GetName] ขณะที่คนงานขนถ่ายวัสดุที่ข้าได้มา [task_contract_employer.GetName] [task_contract_employer.GetHerselfHimself] ก็เข้ามาหาข้า\n\n"การส่งมอบที่ทันเวลา [ROOT.Char.GetTitleAsName]!" [task_contract_employer.GetTitleTierName] กล่าว "อย่างไรก็ตาม อย่างที่ท่านเห็น มันยังคงต้องใช้เวลาประมาณ [task_contract_destination.GetHolding.GetConstructionTimeLeft] เพื่อสร้าง [task_contract_destination.GetHolding.GetConstructingHoldingType.GetName] ให้เสร็จ ข้าต้องการกำลังคนเพิ่ม เพื่อให้มันเสร็จ"\n\n"ท่านจะอยู่ใน [task_contract_destination.GetNameNoTooltip] และให้กำลังคนของท่านช่วยงานคนงานของข้าหรือไม่?""
 ep3_contract_event.0011.a: "ข้ายินดีที่จะย้ายค่ายของข้าไปยัง [task_contract_destination.GetNameNoTooltip]"
 ep3_contract_event.0011.b: "ข้าอยากให้ [task_contract_object.GetTitledFirstNameNoTooltip] เข้าร่วมกับเราอย่างถาวร"
 ep3_contract_event.0011.c: "บางทีนั่นอาจเปลี่ยนใจท่านได้?"
 ep3_contract_event.0011.d_end: "ข้าควรกลับไปที่ค่ายของข้า"
 ep3_contract_event.0011.d_continue: "ข้าควรเดินทางต่อไป"
 ep3_contract_event.0011.reward: "ท่านทำสัญญาจ้าง [task_contract.GetType.GetName] เสร็จสมบูรณ์และจะได้รับรางวัลจาก [task_contract_employer.GetTitledFirstNameNoTooltip]"
 ep3_contract_event.0011.construction_invalidation: "@warning_icon! #X หากตำแหน่ง [camp|E] เปลี่ยนแปลง ตัวปรับแต่งจะถูกลบออกและ [task_contract|E] จะกลายเป็นโมฆะ#! "
 ep3_contract_event.0011.construction_reward: "หากท่านคง [camp|E] ของท่านไว้ใน [task_contract_destination.GetName] จนกว่าการก่อสร้างจะเสร็จสิ้น [task_contract|E] จะ #P เสร็จสมบูรณ์#!:"

 ep3_contract_event.0012.opening_angry: "[task_contract_employer.Custom2('AppropriateGreetingNegative', ROOT.Char)]"
 ep3_contract_event.0012.opening: "[task_contract_employer.Custom2('AppropriateGreetingPositive', ROOT.Char)]"
 ep3_contract_event.0012.desc_employer_dead_outro: "ข้ายกเลิกภาระผูกพันของท่าน: [ROOT.Char.Custom('GetInvalidatedContractType')] ไม่ต้องกังวล รับทองคำไปเป็นค่าชดเชย"
 ep3_contract_event.0012.desc_employer_dead: "ข้าต้องแจ้งให้ท่านทราบว่าผู้ดำรงตำแหน่งก่อนหน้าข้า [task_contract_employer.GetTitledFirstName] ได้เสียชีวิตแล้ว ในฐานะนายจ้างคนใหม่ของท่าน $ep3_contract_event.0012.desc_employer_dead_outro$"
 ep3_contract_event.0012.desc_unlanded_employer: "และด้วยเหตุนี้ [ROOT.Char.Custom('GetInvalidatedContractType')] ของท่านจึงไม่จำเป็นอีกต่อไป"
 ep3_contract_event.0012.desc_unlanded_employer_is_imprisoned: "ข้าต้องแจ้งให้ท่านทราบว่าข้าไม่ใช่ [task_contract_employer.GetWomanMan] อิสระอีกต่อไป $ep3_contract_event.0012.desc_unlanded_employer$"
 ep3_contract_event.0012.desc_target_dead: "ข้าต้องแจ้งให้ท่านทราบว่า [task_contract_target.GetTitledFirstName] [task_contract_employer.Custom2('RelationToMeShort',task_contract_target)] ของข้า ได้เสียชีวิตแล้ว เนื่องจากสถานการณ์ $ep3_contract_event.0012.desc_employer_dead_outro$"
 ep3_contract_event.0012.desc_prisoner_free: "ข้าต้องแจ้งให้ท่านทราบว่า [task_contract_object.GetFirstName] [task_contract_employer.Custom2('RelationToMeShort',task_contract_object)] ของข้า ออกจากคุกแล้ว ข้าไม่แน่ใจว่าท่านมีส่วนเกี่ยวข้องหรือไม่ แต่ $ep3_contract_event.0012.desc_employer_dead_outro$"
 ep3_contract_event.0012.desc_dead_intro: "ความไร้ความสามารถของท่านน่าตกตะลึงและความโกรธแค้นของข้าสุดจะประมาณได้ ท่านปล่อยให้"
 ep3_contract_event.0012.desc_escortee_dead: "$ep3_contract_event.0012.desc_dead_intro$ [task_contract_object.GetFirstName] $ep3_contract_event.0012.desc_dead_outro$"
 ep3_contract_event.0012.desc_pet_dead: "$ep3_contract_event.0012.desc_dead_intro$ [ROOT.Char.Custom('CatOrDogStoryName')] $ep3_contract_event.0012.desc_dead_outro$"
 ep3_contract_event.0012.desc_dead_outro: "ตายได้? ท่านตกลงที่จะ [ROOT.Char.Custom('GetInvalidatedContractType')]! ข้าหวังว่าจะไม่ได้เจอท่านอีก ไม่ว่าจะด้วยวิธีใด #EMP ก็ตาม#!."
 ep3_contract_event.0012.desc_not_vassal: "จงยินดีเถิด ด้วยข้ามิได้เป็นข้าหลวงของ [task_contract_target.Custom2('InsultAdjective', SCOPE.sC('task_contract_employer'))] [task_contract_target.GetName] อีกต่อไป $ep3_contract_event.0012.desc_employer_dead_outro$"
 ep3_contract_event.0012.desc_faction_disbanded: "สถานการณ์ได้นำไปสู่การยุบกลุ่มอิทธิพลของเรา $ep3_contract_event.0012.desc_employer_dead_outro$"
 ep3_contract_event.0012.a: "ข่าวเศร้า แต่เหรียญไม่กี่เหรียญก็ยังดีกว่าไม่มีเลย"
 ep3_contract_event.0012.b: "ไม่มีอะไรที่ข้าทำได้"
 ep3_contract_event.0012.c: "เดินทางต่อไปยัง [travel_destination.GetNameNoTooltip] กันเถอะ"

 ep3_contract_event.0013.opening_success: "[task_contract_employer.Custom2('AppropriateGreetingPositive', ROOT.Char)]"
 ep3_contract_event.0013.opening_failure: "[task_contract_employer.Custom2('AppropriateGreetingNegative', ROOT.Char)]"
 ep3_contract_event.0013.desc_success: "การมีส่วนร่วมของท่านมีความสำคัญอย่างยิ่งต่อชัยชนะในสงครามของข้า และความกล้าหาญของทหารรับจ้างของท่านเป็นที่ชื่นชมอย่างมากจากนักรบของข้า\n\nขอให้การจ่ายเงินนี้ช่วยท่านในการเฉลิมฉลองชัยชนะอันยิ่งใหญ่ของเรา!"
 ep3_contract_event.0013.desc_failure: "เจ้าสมควรถูกขนานนามว่า 'ผู้ผิดคำสัตย์' สำหรับความล้มเหลวอันน่าสมเพชของเจ้าที่ไม่ปรากฏตัวในสนามรบ!\n\nข้า ผู้ ซึ่งควรจะได้ต่อสู้เคียงบ่าเคียงไหล่เจ้า บัดนี้ขอกล่าวขานเจ้าว่า [ROOT.Char.Custom2('InsultAdjective', SCOPE.sC('task_contract_employer'))] [ROOT.Char.Custom2('InsultNoun', SCOPE.sC('task_contract_employer'))] และเป็นผู้นำของเหล่าคนขลาดเขลา""
 ep3_contract_event.0013.a: "การต่อสู้เคียงบ่าเคียงไหล่ถือเป็นเกียรติ"
 ep3_contract_event.0013.b: "'ผู้ผิดสัตย์' ฟังดูไม่เลวร้ายนัก..."

 treasure_hunting_contract_decision: "ค้นหาสมบัติ"
 treasure_hunting_contract_decision_desc: "การผจญภัยอันน่าตื่นเต้นรอคอยผู้กล้าหาญพอที่จะเสี่ยงภัยไปยังดินแดนอันห่างไกล เพื่อแสวงหาข่าวคราวเกี่ยวกับทองคำ อัญมณี สมบัติ และชื่อเสียง ข้าจะยอมจำนนต่อสิ่งยั่วยวนอันต่ำช้าหรือไม่? ต่อการเดินทางที่อันตรายถึงชีวิต? หรือข้าจะปฏิบัติตามภาระผูกพันของข้า?"
 treasure_hunting_contract_decision_tooltip: "เลือกจุดหมายปลายทางเพื่อ [travel|E] ไปที่นั่นและค้นหาสมบัติ"
 treasure_hunting_contract_decision_effect: "เริ่ม [traveling|E] ไปยังตำแหน่งสุ่มใน [region|E] ที่เลือกของโลก"
