 ep3_contract_event.0092.t: "$contract_event_prefix$ $laamp_help_increase_control_contract_contract$"
 ep3_contract_event.0092.desc: "[task_contract_councillor.GetName] [task_contract_councillor.GetCouncilTitle] ของ [task_contract_councillor_liege.GetPrimaryTitle.GetNameNoTierPossessive] มาเยี่ยมค่ายพักแรมของข้าในวันนี้ ทันทีที่เราอยู่ตามลำพัง [task_contract_councillor.GetSheHe] ก็เริ่มพึมพำ\n\n"น่าอายที่จะยอมรับ... แต่ข้าต้องการความช่วยเหลือจากท่านในการจัดการกับชาวนาที่ไม่เชื่อฟังของ [task_contract_destination.GetName]" [task_contract_councillor.GetCouncilTitle|l] ถอนหายใจและทำหน้าบึ้ง\n\n"พวกเขาเย้ยหยันอำนาจของ [task_contract_councillor_liege.GetTitleAsNamePossessive]!"
 ep3_contract_event.0092.desc_taxes: "คนเก็บภาษีถูกปิดประตูใส่และปาหินใส่! ภาษีและอากรโบราณถูกเพิกเฉย ทุกที่ที่ข้าหันไป""
 ep3_contract_event.0092.desc_bandits: "พวกเขารวมตัวกันเป็นกองกำลังติดอาวุธ อ้างว่าถูกพวกนอกกฎหมายคุกคาม! ทั้งภูมิภาคกำลังกลายเป็นกองทัพที่ไม่เชื่อฟังขนาดใหญ่...""
 ep3_contract_event.0092.desc_riots: "ข้าสงสัยอิทธิพลจากต่างชาติ ที่ยุยงคนธรรมดาให้ทำสิ่งที่น่ารังเกียจ... ซึ่งพวกเขาต้องหยุดทันที!""
 ep3_contract_event.0092.desc_low_control: "ข้าควบคุมพวกเขาไม่ได้! พวกเขาเฆี่ยนตีและ ทำให้อับอายทุกคนที่ข้าส่งไป ท้าทายให้ข้าใช้กำลังเต็มที่—พฤติกรรมของพวกเขาเป็นรอยด่างพร้อย ที่ ทำให้ทั้งอาณาจักรเสื่อมเสีย!""
 ep3_contract_event.0092.a: "ให้ข้าจัดการกับพวกเขาเอง!"
 ep3_contract_event.0092.a_tt: "$ep3_contract_event.0094.travel_without_domicile$"
 ep3_contract_event.0092.b: "ข้าจะย้ายค่ายไปที่นั่น"
 ep3_contract_event.0092.b_tt: "$ep3_contract_event.0094.travel_with_domicile$"
 ep3_contract_event.0093.t: "$ep3_contract_event.0092.t$"
 ep3_contract_event.0093.desc: "เมื่อเรามาถึง [task_contract_destination.GetName] ข้ารีบรวบรวมพวกหัวโจกที่แย่ที่สุด และเรียกร้องให้พวกเขาอธิบายตนเอง [corrupt_province_peasant.GetName] ชาวนาที่มีชื่อเสียงคนหนึ่ง พูดแทนคนอื่นๆ\n\n"
 ep3_contract_event.0093.desc_taxes: ""ภาษีสิบชักหนึ่งนั้นสูง แต่เราก็จ่าย! อากรที่เราจ่ายสำหรับสินค้าของเรา ทำให้เราแทบไม่เหลืออะไรเลย! เราแบกรับการจ่ายเงินเหล่านี้—และ [task_contract_councillor_liege.GetTitledFirstName] ยังเรียกร้องจากเรามากขึ้นอีก— ในขณะที่คนเก็บภาษีร่ำรวยขึ้นเรื่อยๆ มันคือ #EMP พวกเขา#! ที่ท่านควรเผชิญหน้า!""
 ep3_contract_event.0093.desc_bandits: ""เรากลัวความปลอดภัยของลูกหลานเรา เป็นหน้าที่ของ [task_contract_councillor_liege.GetTitledFirstNamePossessive] ที่จะปกป้องเรา แต่ [task_contract_councillor_liege.GetSheHe] สนใจ แต่จะควบคุมเรา! หากดาบชั้นดีของ [task_contract_councillor_liege.GetHerHis] จะไม่ฟันพวกนอกกฎหมายที่ถูกสาปแช่ง ประชาชนของข้าจะมอบชีวิตลูกหลานของพวกเขาให้กับเคียว คราด และลูกธนูของพวกเขาเอง!""
 ep3_contract_event.0093.desc_riots: ""ความคิดของเราเป็นของเราเอง! ราวกับว่าเราจะต้อนรับการแทรกแซงจากคนนอก—บาห์! เราปฏิเสธ เช่นกัน การมีอยู่ของพวกประจบสอพลอและอันธพาลของ [task_contract_councillor_liege.GetTitledFirstNamePossessive]! เราจัดการเรื่องท้องถิ่นของเราเองไม่ได้หรือ โดยไม่ถูกรบกวน?""
 ep3_contract_event.0093.desc_low_control: ""เป็นหน้าที่ของเราที่จะถูกปกครอง— แต่ [task_contract_councillor_liege.GetTitledFirstName] ทำ เช่นนั้นอย่างไม่ยุติธรรม! ด้วยความโกลาหลที่แพร่หลายในแผ่นดิน ในขณะที่เราแทบจะไม่สามารถรักษาทรัพย์สินของเราไว้ได้ [task_contract_councillor_liege.GetSheHe] ยังคงขับไล่เราให้ทำงานให้ [task_contract_councillor_liege.GetHerHim] เหมือนม้างาน! เราทำงานหนักโดยไม่มีคำสัญญาว่าจะปลอดภัยจากสงคราม โรคภัยไข้เจ็บ และอื่นๆ!""
 ep3_contract_event.0093.a: ""เงียบปากคนของเจ้าเสีย หรือ #EMP ตาย#! ไอ้ชาวนา!""
 ep3_contract_event.0093.b: "ข้าทนความอยุติธรรม เช่นนี้ไม่ได้"
 ep3_contract_event.0093.a_win: "ท่านช่วยแสดงอำนาจของ [task_contract_councillor.GetCouncilTitleFirstNamePossessive]"
 ep3_contract_event.0093.a_lose: "แต่ท่านต้องทิ้ง [ROOT.Char.GetWomenMen] บางคนไว้ข้างหลัง"
 every_lowborn_follower: "ทุก [follower|E] ที่เป็น [lowborn|E]"
 ep3_contract_event.0094.t: "$ep3_contract_event.0092.t$"
 ep3_contract_event.0094.desc: "เมื่อการทดสอบอันอึกทึกของการบังคับให้ผู้นำชาวนา แต่ละคนยอมจำนนต่อเจตจำนงของข้าเสร็จสิ้นลง เราก็ออกเดินทางอีกครั้ง [task_contract_councillor.GetName] พูดถึงจุดหมายต่อไปของเรา\n\n"เราจะไปที่ [corrupt_province.GetName] ไม่ว่าจะดีหรือร้าย กลุ่มคนร้ายในท้องถิ่นเป็นเรื่องที่น่ากังวลอย่างยิ่ง"
