 ep3_contract_event.0020.t: "$contract_event_prefix$ $laamp_cultural_minority_contract_contract$"
 ep3_contract_event.0020.desc: "กลุ่มชาว [task_contract_employer.GetCulture.GetCollectiveNoun] กลุ่มหนึ่งเข้ามาในค่ายของข้า ประสงค์จะสนทนาด้วย\n\n"คารวะ ท่านนักผจญภัย!" ผู้ที่อาวุโสที่สุดในกลุ่มเริ่มกล่าว "พวกเรามาจาก [task_contract_destination.GetName] ดินแดนใกล้เคียง ที่ ซึ่งการปกครองของ [task_contract_employer.GetNamePossessive] นั้นยุติธรรม สอดคล้องกับประเพณีอันสูงส่งของชาว [task_contract_employer.GetCulture.GetNameNoTooltip]!" เสียงเชียร์เบาๆ แด่นามของ [task_contract_employer.GetTitledFirstNamePossessiveNoTooltip] ทำให้ผู้อาวุโสชะงักไปครู่หนึ่ง ก่อนจะกล่าวต่อ:\n\n"อย่างไรก็ตาม เจ้าเหนือหัวของ [task_contract_employer.GetHerHis] คือ [task_contract_target.GetName] เป็นชาวต่างชาติและไม่คุ้นเคยกับวิถีของเรา ในนามของ [task_contract_employer.GetTitledFirstNameNoTooltip] พวกเราวิงวอน โปรดช่วยพวกเรารับประกันเสรีภาพทางวัฒนธรรมภายใต้การปกครองของ [task_contract_target.GetTitleAsNamePossessive] ด้วยเถิด!""
 ep3_contract_event.0020.a: "วางใจเถิด ข้ามีหนทางเข้าถึง [task_contract_target.GetHerHim]!"
 ep3_contract_event.0020.b: "ข้าเรียนรู้กลเม็ดบางอย่างเพื่อโน้มน้าวชาว [task_contract_target.GetCulture.GetCollectiveNounNoTooltip] มาเป็นพวก"
 ep3_contract_event.0020.c: "ข้าสามารถไปเยี่ยมเยียน [task_contract_target.GetHerHim] พร้อมกับคนของข้าที่เก่งที่สุด!"
 ep3_contract_event.0020.d: "มันต้องมีอุบายที่น่าเชื่อถือ #EMP บางอย่าง#! ภายใต้กฎหมายของ [task_contract_target.GetPrimaryTitle.GetAdjectiveNoTooltip]"
 ep3_contract_event.0020.e: "ลองดูซิว่าข้าจะใช้เหตุผลกับชาว [task_contract_target.GetCulture.GetNameNoTooltip] ได้หรือไม่"
 ep3_contract_event.0020.tt: "[scheme|E] ที่ประสบความสำเร็จจะ ส่งผลให้ [task_contract_employer.GetShortUIName] ได้รับ [obligation|E] [GetSubjectContractType( 'title_revocation_rights' ).GetObligationName( 'title_revocation_rights_protected' )]"
 ep3_contract_event.0020.agents_intrigue: "$schemes.tt.agent_packages.list_boilerplate$\n$EFFECT_LIST_BULLET$[success_chance_max_i] [GetAgentSlotType( 'agent_thug' ).GetName]\n$EFFECT_LIST_BULLET$[success_chance_max_i] [GetAgentSlotType( 'agent_shill' ).GetName]\n$EFFECT_LIST_BULLET$[success_chance_max_i] [GetAgentSlotType( 'agent_wrangler' ).GetName]\n$EFFECT_LIST_BULLET$[scheme_speed_i] [GetAgentSlotType( 'agent_infiltrator' ).GetName]\n$EFFECT_LIST_BULLET$[scheme_speed_i] [GetAgentSlotType( 'agent_socialite' ).GetName]"
 ep3_contract_event.0020.agents_martial: "$schemes.tt.agent_packages.list_boilerplate$\n$EFFECT_LIST_BULLET$[success_chance_max_i] [GetAgentSlotType( 'agent_muscle' ).GetName]\n$EFFECT_LIST_BULLET$[success_chance_max_i] [GetAgentSlotType( 'agent_thug' ).GetName]\n$EFFECT_LIST_BULLET$[success_chance_max_i] [GetAgentSlotType( 'agent_bodyguard' ).GetName]\n$EFFECT_LIST_BULLET$[scheme_speed_i] [GetAgentSlotType( 'agent_footpad' ).GetName]\n$EFFECT_LIST_BULLET$[scheme_speed_i] [GetAgentSlotType( 'agent_tracker' ).GetName]"
 ep3_contract_event.0020.agents_learning: "$schemes.tt.agent_packages.list_boilerplate$\n$EFFECT_LIST_BULLET$[success_chance_max_i] [GetAgentSlotType( 'agent_bailiff' ).GetName]\n$EFFECT_LIST_BULLET$[success_chance_max_i] [GetAgentSlotType( 'agent_scribe' ).GetName]\n$EFFECT_LIST_BULLET$[success_chance_max_i] [GetAgentSlotType( 'agent_diplomat' ).GetName]\n$EFFECT_LIST_BULLET$[scheme_speed_i] [GetAgentSlotType( 'agent_theologian' ).GetName]\n$EFFECT_LIST_BULLET$[scheme_speed_i] [GetAgentSlotType( 'agent_justiciar_speed' ).GetName]"
 ep3_contract_event.0020.agents_diplomacy: "$schemes.tt.agent_packages.list_boilerplate$\n$EFFECT_LIST_BULLET$[success_chance_max_i] [GetAgentSlotType( 'agent_diplomat' ).GetName]\n$EFFECT_LIST_BULLET$[success_chance_max_i] [GetAgentSlotType( 'agent_shill' ).GetName]\n$EFFECT_LIST_BULLET$[success_chance_max_i] [GetAgentSlotType( 'agent_scribe' ).GetName]\n$EFFECT_LIST_BULLET$[scheme_speed_i] [GetAgentSlotType( 'agent_socialite' ).GetName]\n$EFFECT_LIST_BULLET$[scheme_speed_i] [GetAgentSlotType( 'agent_herald' ).GetName]"
