 ep3_contract_event.0575.desc.duel: "ร่างไร้ชีวิตของยามทรุดลงกับพื้น และข้าก็กำลังตัดกระเป๋าเงิน กุญแจ และอื่นๆ ทั้งหมดออก ข้าพบเหรียญและ [newly_created_artifact.GetName] แต่ไม่มีเวลาให้เสียอีกแล้ว\n\n"
 ep3_contract_event.0575.desc.success: "เราต้องเคลื่อนไหวอย่างรวดเร็ว โซ่ตรวนหลุดออก ตกลงบนพื้นพร้อมเสียง #EMP ดังแคร้ง#! จากนั้นเราก็จากไป ผ่านประตูคุก ผ่านประตูทางเข้า เลี้ยวหัวมุม และออกสู่แสงสว่างยามกลางวัน อิสรภาพ\n\n"ข้าขอบคุณท่านไม่หมด!" [task_contract_employer.GetFirstName] กล่าว ลมหายใจของ [task_contract_employer.GetHerHis] ยังคงหอบจากการออกแรง "ข้าเป็นหนี้บุญคุณท่าน การรับใช้ท่านของข้าเริ่มต้น ณ บัดนี้""
 ep3_contract_event.0575.desc.failure: "การแหกคุกเป็นหายนะ [task_contract_employer.GetFirstName] ยังคงถูกล่ามโซ่ไว้กับกำแพง และความหวังใดๆ ที่จะได้รับการรับใช้จาก [task_contract_employer.GetHerHis] เป็นรางวัลสำหรับการช่วยเหลือก็พังทลายลง\n\nสิ่งที่ข้าทำได้คือเดินกลับไปที่ม้าของข้า—อย่างไม่เปิดเผย เพราะข้าอาจถูกไล่ตาม—และเตรียมพร้อมที่จะกลับไปยังที่ที่ข้าจากมา"
 ep3_contract_event.0575.a: "ยินดีที่ได้ท่านมาร่วม!"
 ep3_contract_event.0575.b: "น่าเสียดาย"
 ep3_pilfered_brooch: "เข็มกลัดเงินปิดทอง"

 laamp_find_secret_contract_contract: "เปิดโปงความลับ"
 laamp_find_secret_contract_desc_title: "สนองความอยากรู้ของข้า..."
 laamp_find_secret_contract_desc: "ต้องการสายตาและหูที่เจ้าเล่ห์ใน [TaskContract.GetEmployer.GetCurrentLocation.GetNameNoTooltip] สำหรับงานค้นหาความลับส่วนตัว ผู้รับงานต้องสุขุมรอบคอบ"
 laamp_find_secret_contract_request: "[task_contract|E] นี้ต้องการให้ท่าน [travel|E] ไปยัง [TaskContract.GetLocation.GetName]"

 ep3_contract_event.0580.t: "ข้อมูลลับ"
 ep3_contract_event.0580.desc: "ความสงสัยของ [task_contract_employer.GetTitledFirstNamePossessive] ตกอยู่ที่ [task_contract_employer.Custom2('RelationToMeShort', SCOPE.sC('secret_haver'))] ของ [task_contract_employer.GetHerHis] คือ [secret_haver.GetTitledFirstName] ดังนั้นข้าจึงพบว่าตัวเองกำลังสะกดรอยตาม [secret_haver.GetHerHim] ผ่านห้องโถงของ [secret_haver.GetFaith.HouseOfWorship]\n\n[secret_haver.GetSheHe|U] กำลังปรึกษาหารืออย่างลึกซึ้งกับ [secret_haver.GetHerselfHimself] อย่างเห็นได้ชัด ข้าลองก้าวเข้าไปใกล้อีกสองสามก้าว ซ่อนตัวอยู่หลังกำแพงที่ยื่นออกมา\n\nข้า #EMP เกือบจะ#! ได้ยินเสียงกระซิบของ [secret_haver.GetHerHis] ไม่ว่าจะเป็นคำสารภาพต่อ [secret_haver.GetFaith.HighGodName] หรือแค่พึมพำอย่างบ้าคลั่ง ข้าก็ยังไม่แน่ใจ..."
 ep3_contract_event.0580.a: "ขยับเข้าไปใกล้อีกนิด..."
 ep3_contract_event.0580.a.success: "ท่านแอบเข้าไปใกล้พอที่จะได้ยิน"
 ep3_contract_event.0580.a.failure: "ท่านไม่สามารถเข้าใจได้"
 ep3_contract_event.0580.b: "บางทีถ้าข้าแค่ #EMP แสร้งทำ#! ว่าข้ารู้..."
 ep3_contract_event.0580.b.success: "[task_contract_employer.GetFirstNameNoTooltip] เชื่อคำโกหกของท่าน"
 ep3_contract_event.0580.b.failure: "[task_contract_employer.GetFirstNameNoTooltip] ไม่เชื่อท่านเลย"
 ep3_contract_event.0580.c: "ข้าเบื่อการซ่อนตัวแล้ว"
 ep3_contract_event.0580.c.tt: "การข่มขู่ ซึ่งหน้าอาจสำเร็จในที่ที่การแอบฟังล้มเหลว"
 ep3_contract_event.0580.c.neutral.tt: "[secret_haver.GetFirstNameNoTooltip] มีรอยยิ้มแปลกๆ บนใบหน้าของ [secret_haver.GetHerHis]..."
 ep3_contract_event.0580.c.success: "การข่มขู่ของท่านได้ผล"
 ep3_contract_event.0580.c.failure: "[secret_haver.GetFirstNameNoTooltip] เยาะเย้ยการข่มขู่ของท่าน"
 ep3_contract_event.0580.c.neutral: "[secret_haver.GetFirstNameNoTooltip] เสนอข้อตกลง"

 ep3_contract_event.0581.t: "$ep3_contract_event.0580.t$: ข้อตกลงใหม่"
 ep3_contract_event.0581.desc: "ขณะที่ข้าเข้าใกล้ [secret_haver.GetTitledFirstName] อย่างคุกคาม [secret_haver.GetSheHe] ยกมือขึ้นเป็นการวิงวอน\n\n"เดี๋ยวก่อน! ข้ารู้ว่าท่านได้ยินเพียงพอแล้ว ข้ารู้ว่าท่านจะเค้นส่วนที่เหลือออกจากข้าได้ แต่ข้ามีข้อเสนอ"\n\n"ข้ารู้ดีว่าใครส่งท่านมาทำสิ่งนี้ นายจ้างของท่านไม่ได้ปราศจากความลับอย่างที่ [task_contract_employer.GetSheHe] แสดงออก"\n\n"หากข้ามอบสิ่งเหล่านี้ให้ท่าน..." [secret_haver.GetSheHe] ยื่นถุงทองคำเล็กๆ ออกมา ถอดแหวนออกจากนิ้วของ [secret_haver.GetHerHis] ขณะที่ [secret_haver.GetSheHe] ทำ เช่นนั้น "...บางทีท่านอาจถูกชักชวนให้นำพวกมันและความรู้นั้นไปกับท่าน และเก็บความลับของข้าไว้?""
 ep3_contract_event.0581.a: "ข้ามีสัญญาที่ต้อง ทำให้สำเร็จ"
 ep3_contract_event.0581.b: "เป็นข้อเสนอที่น่าดึงดูดใจ..."

 ep3_contract_event.0585.t.success: "$ep3_contract_event.0580.t$: สำเร็จ"
 ep3_contract_event.0585.t.failure: "$ep3_contract_event.0580.t$: ล้มเหลว"
 ep3_contract_event.0585.desc.success: ""ยอดเยี่ยม! ยอดเยี่ยม!" [task_contract_employer.GetTitledFirstName] โห่ร้อง ขณะที่ข้านำข่าวมาให้ [task_contract_employer.GetHerHim] "ข้าสงสัยอยู่แล้ว แน่นอน แต่การได้รับการยืนยัน..."\n\n[task_contract_employer.GetSheHe|U] โบกมือให้ยามนำค่าจ้างของข้ามาข้างหน้า ลูบคางของ [task_contract_employer.GetHerHis] อย่างครุ่นคิด\n\n"รางวัลของท่าน หากข้าต้องการความช่วยเหลือในอนาคต อย่าลังเลที่จะตอบรับคำเรียกของข้า ลาก่อน [ROOT.Char.GetTitledFirstNameNoTooltip]""
 ep3_contract_event.0585.desc.failure: ""เจ้าคนเขลา เจ้า [ROOT.Char.Custom2('InsultAdjective', SCOPE.sC('task_contract_employer'))] [ROOT.Char.Custom2('InsultNoun', SCOPE.sC('task_contract_employer'))]!" [task_contract_employer.GetTitledFirstName] ไม่ได้ประทับใจในความพยายามของข้ามากนักในการเปิดโปงความลับของ [secret_haver.GetFirstNamePossessive]\n\n"ข้า#EMP ต้อง#! รู้ความลับนั่นให้ได้! ทุกคนที่ข้าส่งไป ไม่ไร้ความสามารถก็เป็นพวกโป้ปดมดเท็จ! ข้าเคยนึกว่าเจ้าจะทำได้ดีกว่าพวกนั้น" [task_contract_employer.GetSheHe|U] ชี้ไปที่ประตู พลางเบ้ปาก\n\n"ไสหัวไป หวังว่าเส้นทางของเราจะไม่บรรจบกันอีก [ROOT.Char.GetTitledFirstNameNoTooltip]""
 ep3_contract_event.0585.desc.liedsuccessfully: ""จริงหรือ?" ข้ารออย่างกลั้นหายใจขณะที่ [task_contract_employer.GetTitledFirstName] พิจารณาคำโกหกที่โจ่งแจ้งของข้า "ใช่... ใช่! นั่นมัน #EMP สมเหตุสมผล#! อย่างยิ่ง!"\n\nข้าถอนหายใจอย่างโล่งอกขณะที่ [task_contract_employer.GetSheHe] โบกมือให้ยามนำรางวัลของข้ามาข้างหน้า\n\n"มันไม่เหมือนกับที่ข้าคาดหวังไว้ แน่นอน แต่เมื่อท่าน #EMP คิด#! เกี่ยวกับมัน..." [task_contract_employer.GetSheHe] ไม่ได้พูดกับข้าอีกต่อไปแล้ว แต่พูดกับ [task_contract_employer.GetHerselfHimself]\n\nถึงเวลาต้องรีบหนีแล้ว"
 ep3_contract_event.0585.a: "ยอดเยี่ยม"
 ep3_contract_event.0585.b: "ให้ตายสิ!"

 laamp_eliminate_heir_contract_contract: "กำจัดทายาท"
 laamp_eliminate_heir_contract_desc_title: "นักฆ่าแห่งหนทางเปิด"
 laamp_eliminate_heir_contract_desc: "ต้องการดาบที่เชี่ยวชาญและเงียบเชียบสำหรับ... การจัดการปัญหาครอบครัว มีเส้นสายสำคัญและรางวัลมากมายเป็นข้อเสนอ"
 laamp_eliminate_heir_contract_request: "[task_contract|E] นี้ต้องการให้ท่าน [travel|E] ไปยัง [TaskContract.GetLocation.GetName]"

 ep3_contract_event.0590.t: "งานเปื้อนเลือด"
 ep3_contract_event.0590.desc: "ทายาทเจ้าปัญหาของ [task_contract_employer.GetTitledFirstNamePossessive] คือ [heir.GetTitledFirstName] ค่อนข้างประมาทเล็กน้อยเมื่อพูดถึงการป้องกันส่วนตัว การออกไปเที่ยวยามดึกอาจช่วยผ่อนคลายได้ แต่คมดาบอีกด้านกำลังจะเข้ามา...\n\nทว่า มีบางอย่างหยุดมือข้าไว้ ข้าได้รับสัญญาให้ทำงาน แต่รู้สึก... ไม่ถูกต้อง\n\nบางทีอาจมีทางอื่น?""
 ep3_contract_event.0590.a: "พอแค่นี้ ถึงเวลาตายแล้ว [heir.GetFirstNameNoTooltip]"
 ep3_contract_event.0590.a.success: "[heir.GetFirstNameNoTooltip] ตายอย่างเงียบๆ"
 ep3_contract_event.0590.a.failure: "[heir.GetFirstNameNoTooltip] ได้ยินท่านเข้ามาและหนีไป"
 ep3_contract_event.0590.b: "บางทีข้าอาจ ทำให้ [heir.GetHerHim] หมดสติได้?"
 ep3_contract_event.0590.b.success: "[heir.GetFirstNameNoTooltip] ล้มลงกองกับพื้น"
 ep3_contract_event.0590.b.failure: "[heir.GetFirstNameNoTooltip] ได้ยินท่านเข้ามา"
 ep3_contract_event.0590.b.fatalbonk: "ท่านตี [heir.GetHerHim] แรง #EMP เกินไป#! นิดหน่อย"
 ep3_contract_event.0590.c: "บางทีถ้าข้าอธิบายสถานการณ์..."
 ep3_contract_event.0590.c.success: "[heir.GetFirstNameNoTooltip] ตกลงที่จะไปกับท่าน"
 ep3_contract_event.0590.c.failure: "[heir.GetFirstNameNoTooltip] เยาะเย้ยเรื่องราวของท่าน"
 ep3_contract_event.0590.c.critfailure: "ท่านเผลอบอกไปว่าใครส่งท่านมา"

 ep3_contract_event.0591.t: "$ep3_contract_event.0590.t$: โอกาสครั้งที่สอง"
 ep3_contract_event.0591.desc.knockedout: "ข้านั่งอยู่บนก้อนหินบริเวณรอบนอกของ [location.GetName] มองดู [heir.GetTitledFirstName] ค่อยๆ ฟื้นคืนสติ การตีที่ศีรษะของ [heir.GetHerHis] ของข้าเห็นได้ชัดว่าพอเหมาะพอดี: [heir.GetSheHe] จะปวดศีรษะอยู่หนึ่งวัน แต่ไม่ควรมีความเสียหายถาวรใดๆ\n\nข้าใช้เวลาครู่หนึ่งเพื่ออธิบายสถานการณ์ เมื่อพิจารณาถึงความเปลี่ยนแปลงครั้งใหญ่ในชีวิตของ [heir.GetHerHis] แล้ว [heir.GetFirstNameNoTooltip] ก็รับมือกับมันได้ดีอย่างน่าทึ่ง\n\n"ขอบคุณที่ไว้ชีวิตข้า" [heir.GetSheHe|U] กล่าว พลางผูกกระเป๋าเข้ากับม้าที่ข้านำมาให้ "ข้าจะไม่ลืมบุญคุณนี้ หวังว่าเราจะได้พบกันอีก" กล่าวจบ [heir.GetSheHe] ก็เริ่มควบม้าจากไปช้าๆ ยกมือขึ้นเพื่อบอกลา"
 ep3_contract_event.0591.desc.camewillingly: "ข้านั่งอยู่บนก้อนหิน มองดู [heir.GetTitledFirstName] ผูกกระเป๋าเข้ากับม้าของ [heir.GetHerHis] การเดินทางมายังชานเมือง [location.GetName] นี้คือเวลาทั้งหมดที่ข้าต้องการเพื่ออธิบายสถานการณ์ และ [heir.GetFirstNameNoTooltip] ก็ยินดีที่จะตามมา แต่โดยดี\n\n"ขอบคุณที่ไว้ชีวิตข้า" [heir.GetSheHe|U] กล่าว เมื่อผูกกระเป๋าเสร็จ "ข้าจะไม่ลืมมัน ข้าหวังว่าเส้นทางของเราจะมาบรรจบกันอีก" ด้วยคำพูดนั้น [heir.GetSheHe] ก็เริ่มควบม้าจากไป โบกมือลา"
 ep3_contract_event.0591.a: ""ขอให้โชคดี!"

 ep3_contract_event.0595.t: "$ep3_contract_event.0590.t$: การกระทำที่ไม่สำเร็จ"
 ep3_contract_event.0595.desc: "ความพยายามของข้าในการทำตามความปรารถนาของ [task_contract_employer.GetFirstNamePossessive] พังทลายลง\n\n[heir.GetFirstName|U] ยังมีชีวิตอยู่ เป็นหนามยอกอกของ [task_contract_employer.GetFirstNamePossessiveNoTooltip] สำหรับข้า ข้าต้องออกจาก [location.GetName] อย่างรวดเร็ว มิฉะนั้นความโกรธของนายจ้างข้าอาจตามหาข้าเจอ"
 ep3_contract_event.0595.a: "กลับสู่ท้องถนน..."
 ep3_contract_event.0093.taxes: ""Here, let me help with the ledgers...""
 ep3_contract_event.0093.taxes_win: "You manage to handle it"
 ep3_contract_event.0093.taxes_lose: "The peasants make you pay for it, and some more"
 EVENT_WINDOW_OPTION_AVAILABLE_INCREASE_CONTROL_TAXES: "This option is available because of this county's abusive taxes"
 ep3_contract_event.0093.bandits: ""Could you tell me where their camp is?""
