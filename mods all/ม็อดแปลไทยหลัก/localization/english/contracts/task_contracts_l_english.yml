 ep3_contract_event.0570.t: "ผู้ช่วยเหลือ"
 ep3_contract_event.0570.desc: "เมื่อมาถึง [location.GetName] การสอบถามเล็กน้อยก็นำข้าไปยังสถานที่ที่ข้ากำลังค้นหา ข้าพบ [task_contract_employer.GetFirstName] ที่ตกทุกข์ได้ยากถูกล่ามโซ่ไว้กับกำแพงภายในอาคารที่มีการป้องกันเบาบาง\n\nยามคนหนึ่งเดินตรวจตราตามตารางเวลาปกติ และข้าฉวยโอกาสในช่วงเวลาที่ [prisonguard.GetSheHe] ไม่อยู่เพื่อแอบเข้าไปใกล้ห้องขังของ [task_contract_employer.GetFirstNamePossessiveNoTooltip]\n\n"ท่านมาช่วยข้าหรือ?" [task_contract_employer.GetSheHe] ถามอย่างอ่อนแรง "ได้โปรด เร็วเข้า: ท่านต้องปล่อยข้าให้เป็นอิสระก่อนที่พวกสารเลวที่คุมขังข้าจะกลับมา!""
 ep3_contract_event.0570.a: "รอจนกว่า [prisonguard.GetSheHe] จะกลับมา พร้อมดาบในมือ"
 ep3_contract_event.0570.a.tt: "#V ประลอง#! กับ [prisonguard.GetFirstNameNoTooltip]\n[prowess|E] ของท่าน: [prowess_i]#V [root_for_loc.GetProwess]#!\n[prowess|E] ของ [prisonguard.GetFirstNamePossessive]: [prowess_i]#V [prisonguard.GetProwess]#!"
