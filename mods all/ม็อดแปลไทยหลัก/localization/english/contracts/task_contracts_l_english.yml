 ep3_contract_event.0510.t: "สิทธิ์ในการปกครอง"
 ep3_contract_event.0510.desc: "ข้ามาถึง [location.GetName] และพบว่ามันอยู่ในสภาพโกลาหลเล็กน้อย คนตัวเล็กๆ ไม่พอใจอย่างเห็นได้ชัด และหัวโจกของพวกเขา — [peasant.GetWomanMan] ชื่อ [peasant.GetFirstName] — กำลังด่าทอฝูงชนที่รวมตัวกัน\n\n\"[task_contract_employer.GetTitledFirstName]? เป็น #EMP [task_contract_employer.GetTitleAsNameNoTooltip]#! อะไรกัน [task_contract_employer.GetSheHe]!\" [peasant.GetSheHe|U] คำราม \"เราเคยมีผู้ปกครอง #EMP ตัวจริง#! ได้รับการ แต่งตั้งโดย [peasant.GetFaith.FateGodName]!\"\n\nคำพูดนั้นเต็มไปด้วยอารมณ์ แต่ฝูงชนส่วนใหญ่ลังเลอย่างเห็นได้ชัดเกี่ยวกับความภักดีของพวกเขา"
 ep3_contract_event.0510.a: "หากข้าโน้มน้าวคนท้องถิ่นผู้นี้ได้ คนอื่นๆ ก็จะคล้อยตาม"
 ep3_contract_event.0510.a.success: "ท่านโน้มน้าว [peasant.GetHerHim] และผู้ฟังคนใดก็ตามได้สำเร็จ"
 ep3_contract_event.0510.a.failure: "ท่านล้มเหลวในการให้เหตุผลที่น่าเชื่อถือ"
 ep3_contract_event.0510.a.critfailure: "วาทศิลป์ของท่านล้มเหลวอย่างสิ้นเชิง"
 ep3_contract_event.0510.b: "อำนาจคือความถูกต้อง..."
 ep3_contract_event.0510.b.success: "การข่มขู่ของท่านได้ผล"
 ep3_contract_event.0510.b.failure: "[peasant.GetFirstNameNoTooltip] เยาะเย้ยการข่มขู่ของท่าน"
 ep3_contract_event.0510.b.critfailure: "ท่านตัดสินสถานการณ์ผิดพลาด และปัญหา #EMP ที่แท้จริง#! ก็ก่อตัวขึ้น"
 ep3_contract_event.0510.c: "บางทีถุงทองอาจเปลี่ยนความภักดีของชาวนาผู้นี้ได้..."

 ep3_contract_event.0520.t.success: "$ep3_contract_event.0510.t$: สำเร็จ"
 ep3_contract_event.0520.t.failure: "$ep3_contract_event.0510.t$: ล้มเหลว"
 ep3_contract_event.0520.t.critfailure: "$ep3_contract_event.0510.t$: ล้มเหลวอย่างยิ่ง"
 ep3_contract_event.0520.desc.success: "ชาวนาที่ก่อความวุ่นวายนั้นมุ่งมั่น แต่ความมุ่งมั่นทั้งหมดก็พังทลายลงต่อหน้าความเชื่อมั่นของข้า ฝูงชน ซึ่งในตอนแรกเกือบจะถูกปลุกปั่นให้ใช้ความรุนแรง ในไม่ช้าก็เริ่มเงียบลง\n\nในที่สุด พวกเขาก็แยกย้ายกันไป ประกาศความศรัทธาในตำแหน่งอันชอบธรรมของ [task_contract_employer.GetTitledFirstNamePossessive] ในฐานะผู้ปกครอง [location.GetName] ตัวแทนของนายจ้างข้าวางอาวุธ แสดงความขอบคุณสำหรับงานของข้าและมอบรางวัลที่ข้าสมควรได้รับ"
 ep3_contract_event.0520.desc.failure: "สถานการณ์หลุดมือเราไป—อย่างรวดเร็ว ข้าไม่ได้คาดหวังไฟและวาทศิลป์จากชาวนาธรรมดา แต่คำตอบโต้ที่ดังกึกก้องของ [peasant.GetFirstNamePossessive] ต่อคำพูดที่อ่อนแอของข้า ทำให้ฝูงชนโกรธแค้น\n\nข้ารีบถอยหนี! กลุ่มคนร้ายกำลังโห่ร้องและขว้างปาหิน ซ้ำเติมทุกคำดูถูกที่ผู้นำของพวกเขากล่าว\n\n[task_contract_employer.GetTitledFirstName] จะไม่ชอบสิ่งนี้แน่..."
 ep3_contract_event.0520.desc.critfailure: "ข้าไม่ได้คาดหวังป้อมปราการแห่งการต่อต้านที่แท้จริงเลย\n\nความพยายามของข้าในการใช้กำลังกับชาวนาล้มเหลวไม่เป็นท่า และสถานการณ์ก็เลวร้ายลงอย่างรวดเร็วจนน่าสะพรึงกลัว ขณะที่ข้าหันหลังหนี เสื้อคลุมของข้าเปียกโชกไปด้วยน้ำลายและข้าถูกขว้างปาด้วยผักเน่าจำนวนมาก\n\nจากที่เห็น ชื่อเสียงของ [task_contract_employer.GetTitledFirstNamePossessive] กำลังเปลี่ยนแปลงไปในทางที่ #EMP แตกต่าง#! อย่างสิ้นเชิงจากที่ข้าสัญญากับ [task_contract_employer.GetHerHim]..."
 ep3_contract_event.0520.a: "ยอดเยี่ยม"
 ep3_contract_event.0520.b: "เอาเถอะ... ข้าพยายามแล้ว"

 laamp_rid_councillor_contract_contract: "กำจัดผู้ก่อปัญหา"
 laamp_rid_councillor_contract_desc_title: "ต้องการนักแก้ปัญหาที่มุ่งมั่น"
 laamp_rid_councillor_contract_desc: "[TaskContract.GetEmployer.GetTitledFirstName] เรียกร้องหาดาบที่มีประสิทธิภาพและสุขุมเพื่อกำจัด [TaskContract.GetEmployer.GetHerHim] จาก... #EMP ตัวละครที่ก่อความวุ่นวาย#! มีรางวัลพิเศษสำหรับความรอบคอบและประสิทธิภาพ"
 laamp_rid_councillor_contract_request: "[task_contract|E] นี้ต้องการให้ท่าน [travel|E] ไปยัง [TaskContract.GetLocation.GetName]"

 ep3_contract_event.0550.t: "ผู้ก่อปัญหา: สาส์นในความมืด"
 ep3_contract_event.0550.desc: "ข้ามาถึงสถานที่ที่ตกลงกันไว้ใน [location.GetName] มีคนอยู่ไม่กี่คน แต่ข้าเห็นใครบางคนกำลังเข้ามา: ห่อหุ้มตั้งแต่หัวจรดเท้าด้วยเสื้อคลุม ร่างลับๆ นี้กระซิบกับข้า\n\n"เจ้าคือ [ROOT.Char.GetFirstNameNoTooltip] ใช่ไหม?"\n\nข้าพยักหน้า และ [messenger.GetSheHe] ก็ยัดสาส์นใส่มือข้าโดยไม่พูดอะไร รีบจากไป ผู้ส่งสารก็หายกลับเข้าไปในความมืดในไม่ช้า\n\nเห็นได้ชัดว่า [task_contract_employer.GetTitledFirstName] มุ่งมั่นที่จะไม่ให้เรื่องนี้สืบสาวไปถึง [task_contract_employer.GetHerHim] ได้..."
 ep3_contract_event.0550.a: "มาดูกันว่ามีอะไรรอข้าอยู่..."
 ep3_contract_event.0550.a.tt: "เปิดจดหมาย"

 ep3_contract_event.0555.desc: "ข้าหวังว่าท่านจะเข้าใจถึงความจำเป็นในการใช้ความสุขุมรอบคอบ ความสิ้นหวังบีบบังคับให้ข้าต้องทำ เช่นนี้ ดังนั้นข้าจึงไม่อาจเปิดเผยตัวตนได้\n\nเป้าหมายของท่านคือ [councillor.GetName] [councillor.GetSheHe|U] ต้องถูกกำจัด... ไม่ว่าจะจากอำนาจหรือจากโลกนี้ไปเลย: ข้าไม่สนใจ\n\nท่านอาจพบ [councillor.GetHerHim] คืนนี้ ที่สถานที่ ซึ่งรู้จักกันในนาม [ROOT.Char.Custom('GetPubName')] จงทำลายสาส์นนี้และอย่าพูดถึงมันอีก"
 ep3_contract_event.0555.a: "อา... ข้าต้องกำจัด [councillor.GetActiveCouncilTask.GetPositionName] ที่ไม่เชื่อฟัง"

 ep3_contract_event.0560.t: "ผู้ก่อปัญหา: [councillor.GetActiveCouncilTask.GetPositionName] ที่ก่อความวุ่นวาย"
 ep3_contract_event.0560.desc: "โรงเตี๊ยมอยู่ใกล้ๆ ขณะที่ข้าแอบมองผ่านทางเข้าด้านหลัง ข้าเห็น [councillor.GetActiveCouncilTask.GetPositionName] ของ [task_contract_employer.GetTitleAsNamePossessiveNoTooltip] กำลังเพลิดเพลินกับค่ำคืนอันอึกทึกครึกโครม โดยไม่รู้ถึงอันตรายใดๆ\n\nนี่อาจเป็นงานง่ายๆ... แค่บุกเข้าไปแล้วสับ [councillor.GetTitledFirstName] เป็นชิ้นๆ แต่บางทีวิธีการที่แนบเนียนกว่านี้อาจทำได้ เช่นกัน?\n\nบางที... ข้าอาจปล่อยให้ [councillor.GetWomanMan] ที่โชคร้ายมีชีวิตอยู่?"
 ep3_contract_event.0560.a: "#EMP บุกเข้าทางประตูหน้า!#!"
 ep3_contract_event.0560.a.success: "การต่อสู้จบลงอย่างรวดเร็ว โดยไม่มีพยานรอดชีวิต"
 ep3_contract_event.0560.a.neutral: "[councillor.GetFirstNameNoTooltip] ตายในการต่อสู้"
 ep3_contract_event.0560.a.failure: "ท่านซุ่มโจมตีพลาดและต้องหนี"
 ep3_contract_event.0560.a.critfailure: "การต่อสู้ดำเนินไปอย่างเลวร้าย"
 ep3_contract_event.0560.b: "มีดในห้องส้วมคงพอใช้ได้"
 ep3_contract_event.0560.b.success: "มันได้ผลอย่างสมบูรณ์แบบ"
 ep3_contract_event.0560.b.neutral: "มีการต่อสู้เกิดขึ้น และผู้คนสังเกตเห็นการหลบหนีของท่าน"
 ep3_contract_event.0560.b.failure: "สัญญาณเตือนดังขึ้น ขัดขวางท่าน"
 ep3_contract_event.0560.c: "บางทีอาจวางยาพิษในเครื่องดื่มของ [councillor.GetHerHis]?"
 ep3_contract_event.0560.c.critsuccess: "ไม่มีใครตรวจพบยาพิษ"
 ep3_contract_event.0560.c.success: "กว่าจะสังเกตเห็นยาพิษ ก็สายเกินไปแล้ว"
 ep3_contract_event.0560.c.failure: "[councillor.GetFirstNameNoTooltip] เพียงแค่ล้มป่วย"
 ep3_contract_event.0560.c.critfailure: "ท่านถูกจับได้ขณะวางยาพิษ"
 ep3_contract_event.0560.d: "การลักพาตัวที่มีประสิทธิภาพอาจให้ผล เช่นเดียวกัน..."
 ep3_contract_event.0560.d.critsuccess: "ท่านลักพาตัว [councillor.GetFirstNameNoTooltip] ได้สำเร็จ"
 ep3_contract_event.0560.d.success: "เป้าหมายของท่านต่อสู้ และต้องถูกปราบปราม"
 ep3_contract_event.0560.d.failure: "[councillor.GetFirstNameNoTooltip] หนีไปได้"
