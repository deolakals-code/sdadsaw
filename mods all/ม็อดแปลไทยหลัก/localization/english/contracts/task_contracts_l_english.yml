 laamp_transport_vip_contract: "คุ้มกันทูต"
 laamp_transport_vip_desc_title: "เหล่าทหารหาญผู้กล้า,"
 laamp_transport_vip_desc: "ทูตอันสูงศักดิ์ของ [TaskContract.GetEmployer.GetTitleAsNameNoTooltip] ต้องการการคุ้มกันจากโจรภัยและอุบัติเหตุ และยินดีรับความช่วยเหลือจากนักเดินทางผู้ช่ำชอง"
 laamp_transport_ward_contract: "การส่งตัวผู้อยู่ในอุปถัมภ์"
 laamp_transport_ward_desc_title: "เหล่าทหารรับจ้างผู้ทรงเกียรติและมีความรับผิดชอบ,"
 laamp_transport_ward_desc: "[TaskContract.GetEmployer.GetTitleAsNameNoTooltip] จะมอบรางวัลแก่ผู้ใดก็ตามที่เต็มใจคุ้มกันบุตรของ[TaskContract.GetEmployer.GetHerHis] ในการเดินทางไปยังราชสำนักของผู้ปกครอง"
 laamp_transport_explorer_contract: "นักสำรวจผู้กระตือรือร้น"
 laamp_transport_explorer_desc_title: "เหล่าทหารรับจ้างผู้ไว้ใจได้,"
 laamp_transport_explorer_desc: "[TaskContract.GetEmployer.GetTitleAsNameNoTooltip] ผู้ใฝ่รู้ กำลังมองหาผู้ร่วมทางและการคุ้มกันระหว่างการผจญภัยครั้งต่อไปของ[TaskContract.GetEmployer.GetHerHis]"
 laamp_transport_artifact_contract: "การส่งมอบโบราณวัตถุ"
 laamp_transport_artifact_desc_title: "เหล่านักเดินทางผู้ซื่อสัตย์และมีฐานะ,"
 laamp_transport_artifact_desc: "มรดกตกทอดอันล้ำค่ากำลังจะเปลี่ยนมือ [TaskContract.GetEmployer.GetTitleAsNameNoTooltip] ต้องการผู้ที่สามารถรับรองได้ว่าสิ่งของจะถึงที่หมายอย่างปลอดภัย"
 laamp_transport_gold_contract: "ของขวัญทองคำ"
 laamp_transport_gold_desc_title: "ท่านผู้แข็งแกร่งและระแวดระวัง,"
 laamp_transport_gold_desc: "ขบวนสินค้าสำคัญกำลังจะออกเดินทางจาก [TaskContract.GetEmployer.GetCurrentLocation.GetNameNoTooltip] [TaskContract.GetEmployer.GetTitleAsNameNoTooltip] มอบรางวัลใหญ่แก่ผู้ใดก็ตามที่เต็มใจคุ้มกันตลอดเส้นทาง"
 laamp_transport_animal_contract: "ของขวัญมีชีวิต"
 laamp_transport_animal_desc_title: "เหล่านักเดินทางผู้ใจอ่อน,"
 laamp_transport_animal_desc: "สัตว์เลี้ยงแสนรักของ [TaskContract.GetEmployer.GetTitleAsNameNoTooltip] ต้องการการคุ้มกันบนท้องถนน"
 laamp_construction_contract_contract: "งานก่อสร้าง"
 laamp_construction_contract_desc_title: "เหล่าพ่อค้าผู้มากประสบการณ์และมีไหวพริบ,"
 laamp_construction_contract_desc: "โครงการก่อสร้างตามคำสั่งของ [TaskContract.GetEmployer.GetTitleAsNameNoTooltip] กำลังขาดแคลนวัสดุ มีเงินรางวัลก้อนโตสำหรับการจัดหาวัสดุก่อสร้างใหม่"
 laamp_treasure_hunting_contract_contract: "ล่าสมบัติ"
 laamp_treasure_hunting_contract_desc_title: "เหล่านักผจญภัยผู้ชาญฉลาด,"
 laamp_treasure_hunting_contract_desc: "ข่าวลือเรื่องสมบัติในตำนานได้ยินไปถึงหูของ [TaskContract.GetEmployer.GetTitleAsNameNoTooltip] [TaskContract.GetEmployer.GetSheHe|U] ปรารถนาให้นักผจญภัยผู้มีความสามารถไปพิสูจน์คำกล่าวอ้างเหล่านี้"
 laamp_join_war_contract_contract: "ยืนหยัดเคียงข้างเรา"
 laamp_join_war_contract_desc_title: "จงชักดาบเคียงข้างผู้ชอบธรรม!"
 laamp_join_war_contract_desc: "ต้องการความช่วยเหลือทางทหารใน [TaskContract.GetEmployer.GetPrimaryTitle.GetBaseNameNoTier] ที่เสียหายจากสงคราม เป็นเวลา [TaskContract.MakeScope.Var('task_contract_war').War.MakeScope().ScriptValue('task_contract_war_duration_value')] วัน"
 laamp_raid_contract_contract: "ปล้นชิงเชลย"
 laamp_raid_contract_desc_title: "เหล่าผู้ปล้นสะดมชายแดนผู้ไร้ความปรานี,"
 laamp_raid_contract_desc: "[TaskContract.GetEmployer.GetTitleAsNameNoTooltip] กำลังมองหานายกองผู้กล้าหาญ ซึ่งมีทักษะในการจับเหยื่อทั้งเป็น เพื่อส่งสาส์นไปยังศัตรูของ[TaskContract.GetEmployer.GetHerHis]..."
 laamp_help_claimant_contract_contract: "ทวงสิทธิ์ของข้า"
 laamp_help_claimant_contract_desc_title: "ผู้แสวงหาอุดมการณ์อันสูงส่ง,"
 laamp_help_claimant_contract_desc: "[TaskContract.GetEmployer.GetTitleAsNameNoTooltip] กำลังมองหาผู้สนับสนุนสิทธิ์อันชอบธรรม: ผู้ที่เต็มใจทวงสิทธิ์อันชอบธรรมของ[TaskContract.GetEmployer.GetHerHis] เหนือ [TaskContract.MakeScope.Var('task_contract_title').Title.GetName] จาก [TaskContract.MakeScope.Var('task_contract_target').Char.GetTitledFirstName]"
 laamp_steal_artifact_contract_contract: "ทวงคืนโบราณวัตถุ"
 laamp_steal_artifact_contract_desc_title: "เหล่าคนพาลผู้ละโมบ,"
 laamp_steal_artifact_contract_desc: "[TaskContract.GetEmployer.GetTitleAsNameNoTooltip] จะมอบรางวัลแก่ผู้ใดก็ตามที่เต็มใจนำสิ่งที่[TaskContract.GetEmployer.GetHerHis] ควรได้รับโดยชอบธรรมกลับคืนมา — [TaskContract.MakeScope.Var('task_contract_object').Artifact.GetName]"
 laamp_cultural_minority_contract_contract: "ปกป้องมรดกทางวัฒนธรรม"
 laamp_cultural_minority_contract_desc_title: "โปรดฟังความทุกข์ยากของเรา!"
 laamp_cultural_minority_contract_desc: "[TaskContract.GetEmployer.GetTitledFirstNameNoTooltip] แสวงหาความช่วยเหลือจากเพื่อนร่วม [TaskContract.GetEmployer.GetCulture.GetCollectiveNoun] — หรือผู้ใดก็ตามที่เต็มใจเรียกร้องสิทธิ์ของพวกเขากับ [TaskContract.GetEmployer.GetLiege.GetName]"
 laamp_religious_minority_contract_contract: "พิทักษ์ผู้ศรัทธา"
 laamp_religious_minority_contract_desc_title: "ความยุติธรรมภายใต้ [TaskContract.GetEmployer.GetFaith.PositiveAfterLife]!"
 laamp_religious_minority_contract_desc: "[TaskContract.GetEmployer.GetTitleAsNameNoTooltip] แสวงหาเพื่อนร่วม [TaskContract.GetEmployer.GetFaith.GetAdherentNamePlural] หรือผู้เห็นอกเห็นใจที่เต็มใจ: ผู้ใดก็ตามที่จะเจรจากับ [TaskContract.GetEmployer.GetLiege.GetName] เพื่อการคุ้มครองทางศาสนาของพวกเขา"
 laamp_prison_break_contract_contract: "แหกคุก"
 laamp_prison_break_contract_desc_title: "ผู้ที่เคลื่อนไหวอย่างอิสระยิ่ง,"
 laamp_prison_break_contract_desc: "[TaskContract.GetEmployer.GetTitledFirstNameNoTooltip] กำลังค้นหาบุคคลที่หลบหลีกเก่ง มีญาติที่ถูกคุมขัง ซึ่ง[TaskContract.GetEmployer.GetSheHe]อยากให้เป็นอิสระอย่างยิ่ง"
 laamp_join_faction_contract_contract: "สนับสนุนกลุ่มอิทธิพล"
 laamp_join_faction_contract_desc_title: "ผู้เห็นต่างทุกหมู่เหล่า,"
 laamp_join_faction_contract_desc: "[TaskContract.GetEmployer.GetTitleAsNameNoTooltip] เบื่อหน่ายกับการปกครองของ [TaskContract.GetTarget.GetNamePossessive] [TaskContract.GetEmployer.GetSheHe|U] ส่งคำเชิญเปิดสำหรับทุกคนที่ต่อต้าน [TaskContract.GetTarget.GetTitledFirstNameNoTooltip] ให้เข้าร่วม [TaskContract.MakeScope.Var('task_contract_faction').Faction.GetName]"
 laamp_join_faction_contract_request: "[task_contract|E] นี้ต้องการให้ท่านเข้าร่วม [faction|E]"
 laamp_help_faith_conversion_contract_contract: "หน้าที่เผยแผ่ศาสนา"
 laamp_help_faith_conversion_contract_desc_title: "เหล่าสาวกผู้กระตือรือร้นของ [TaskContract.GetEmployer.GetFaith.CreatorName],"
 laamp_help_faith_conversion_contract_desc: "[SelectLocalization(ObjectsEqual(TaskContract.GetEmployer,TaskContract.GetTarget.GetLiege),'laamp_council_task_contract_desc_liege','laamp_council_task_contract_desc_councillor')] เผยแผ่พระวจนะของ [TaskContract.GetEmployer.GetFaith.HighGodName] ใน [TaskContract.GetLocation.GetName] ผู้ศรัทธาที่มีความสามารถจะได้รับการต้อนรับให้มาช่วยเปล่งเสียง"
 laamp_help_faith_conversion_contract_request: "[task_contract|E] นี้ต้องการให้ท่าน [travel|E] ไปยัง [county|E] ที่กำลังมีการ [convert_county|E] ดำเนินอยู่"
 laamp_fight_faith_conversion_contract_contract: "ปิดปากนักเผยแผ่ศาสนา"
 laamp_fight_faith_conversion_contract_desc_title: "ผู้ศรัทธากำลังถูกคุกคาม!"
 laamp_fight_faith_conversion_contract_desc: "นักเผยแผ่ศาสนา [TaskContract.MakeScope.Var('task_contract_councillor').Char.GetFaith.GetAdjectiveNoTooltip] รังควานชุมชน [TaskContract.GetEmployer.GetFaith.GetAdjectiveNoTooltip] เรากำลังมองหานักเจรจาผู้ชำนาญหรืออันธพาลที่น่าเกรงขามเพื่อจัดการกับพวกนอกรีตเหล่านี้"
 laamp_fight_faith_conversion_contract_request: "[task_contract|E] นี้ต้องการให้ท่าน [travel|E] ไปยัง [county|E] ที่กำลังมีการ [convert_county|E] ดำเนินอยู่ หรือ [realm_priest_possessive|E] [liege|E]"
 laamp_help_train_commanders_contract_contract: "ครูฝึกอัศวิน"
 laamp_help_train_commanders_contract_desc_title: "ทหารผ่านศึกรับจ้าง,"
 laamp_help_train_commanders_contract_desc: "[SelectLocalization(ObjectsEqual(TaskContract.GetEmployer,TaskContract.GetTarget.GetLiege),'laamp_council_task_contract_desc_liege','laamp_council_task_contract_desc_councillor')] ปรารถนาที่จะรักษา [TaskContract.GetEmployer.Custom('KnightCulturePluralNoTooltip')|l] ของ[TaskContract.GetEmployer.GetHerHis] ให้อยู่ในสภาพพร้อมรบ กำลังมองหาผู้บัญชาการหรือนักดาบผู้มีประสบการณ์เพื่อถ่ายทอดความรู้"
 laamp_help_train_commanders_contract_request: "[task_contract|E] นี้ต้องการให้ท่านใช้ $task_contract_train_knight_interaction$ [character_interaction|E] กับ [knights|E] [contractor_possessive|E]"
 task_contract_train_knight_interaction: "ฝึกฝนอัศวิน"
 task_contract_train_knight_interaction_desc: "การฝึกฝนเพื่อเพิ่ม [prowess|E] หรือสอน [commander_trait|E] ให้แก่ [recipient.Custom('KnightCulturePlural')] ของ [recipient.GetFirstNamePossessive]"
 recipient_secondary_task_contract_train_knight_interaction: "ผู้รับการฝึก"
 task_contract_train_knight_interaction.tt: "มีโอกาสเพิ่ม [prowess|E] หรือเรียนรู้ [commander_trait|E]"
 laamp_help_find_secrets_contract_contract: "ดวงตาในเงามืด"
 laamp_help_find_secrets_contract_desc_title: "จุ๊ๆ!"
 laamp_help_find_secrets_contract_desc: "ต้องการผู้สังเกตการณ์ที่ชาญฉลาดใน [TaskContract.GetLocation.GetName] [TaskContract.GetEmployer.GetTitleAsNameNoTooltip] ต้องการจับตาดูเพื่อนบ้านของ [TaskContract.GetEmployer.GetHerHis] และการกระทำของพวกเขา [TaskContract.GetEmployer.GetSheHe|U] เพียงแค่อยากรู้อยากเห็น... นั่นคือทั้งหมดที่ท่านต้องรู้"
 laamp_help_find_secrets_contract_request: "[task_contract|E] นี้ต้องการให้ท่านทำ [GetScheme('laamp_help_find_secrets_scheme').GetTypeName] [scheme|E] ให้สำเร็จ"
 laamp_help_fabricate_claim_contract_contract: "สิทธิ์อันถูกลืม"
 laamp_help_fabricate_claim_contract_desc_title: "เหล่าบัณฑิตผู้คงแก่เรียน,"
 laamp_help_fabricate_claim_contract_desc: "$laamp_council_task_contract_desc_liege$ คือเจ้าของโดยชอบธรรมของ [TaskContract.MakeScope.Var('task_contract_destination').Province.GetName] [TaskContract.GetEmployer.GetSheHe|U] เพียงแค่ทำหลักฐานหายไป! จงกู้คืนสิทธิ์โบราณเหล่านี้ แล้วท่านจะได้รับรางวัลเป็นความกตัญญูที่ไม่รู้ลืม"
 laamp_council_task_contract_desc_liege: "[TaskContract.GetEmployer.GetTitleAsNameNoTooltip]"
 laamp_council_task_contract_desc_councillor: "เจ้าเหนือหัวของข้า [TaskContract.GetTarget.GetName],"
 laamp_help_fabricate_claim_contract_request: "[task_contract|E] นี้ต้องการให้ท่านทำ [GetScheme('generate_claim').GetTypeName] [scheme|E] ให้สำเร็จ"
 laamp_help_increase_control_contract_contract: "ต่อสู้การทุจริต"
 laamp_help_increase_control_contract_desc_title: "ผู้ถือกระบอง,"
 laamp_help_increase_control_contract_desc: "[TaskContract.GetTarget.GetPrimaryTitle.GetNameNoTierNoTooltip] กำลังเดือดร้อนจากโจรผู้ร้ายที่ชุกชุม ข้าราชการขูดรีด และชาวนาที่ตื่นตระหนก ผู้ใดก็ตามที่เต็มใจควบคุมพวกเขาทั้งหมดให้อยู่ในระเบียบจะได้รับรางวัล"
 laamp_help_increase_control_contract_request: "[task_contract|E] นี้ต้องการให้ท่าน [travel|E] ไปยัง [counties|E] [contractor_possessive|E] ที่มี [county_control|E] ต่ำ"
 laamp_transport_contract.transport_failed: "สัญญาจ้างล้มเหลว"
 laamp_transport_contract.success: "สัญญาจ้างเสร็จสมบูรณ์"
 laamp_transport_contract.success_late: "สัญญาจ้างเสร็จสมบูรณ์ล่าช้า"
 laamp_transport_contract.contract_completion_limit: "สัญญาจ้างหมดเวลา"
 complete_task_contract_interaction: "เดินทางเพื่อทำสัญญาจ้างให้เสร็จสิ้น"
