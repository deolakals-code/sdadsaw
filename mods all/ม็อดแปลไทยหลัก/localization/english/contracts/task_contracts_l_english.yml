 EVENT_WINDOW_OPTION_AVAILABLE_INCREASE_CONTROL_RIOTS: "This option is available due to the riots happening in this county"
 ep3_contract_event.0093.low_control: ""This is a grace from your [task_contract_councillor_liege.GetTitleAsNameNoTooltip]...""
 ep3_contract_event.0093.low_control_win: "You convince the peasants"
