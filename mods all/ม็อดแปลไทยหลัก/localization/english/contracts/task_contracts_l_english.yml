 ep3_contract_event.0021.t: "$contract_event_prefix$ $laamp_religious_minority_contract_contract$"
 ep3_contract_event.0021.desc: "กลุ่ม [task_contract_employer.GetFaith.GetAdherentNamePlural] กลุ่มหนึ่งเข้ามาในค่ายของข้า ประสงค์จะสนทนาด้วย\n\n"คารวะ ท่านนักผจญภัย!" ผู้ที่อาวุโสที่สุดในกลุ่มเริ่มกล่าว "พวกเรามาจาก [task_contract_destination.GetName] ดินแดนใกล้เคียง ที่ ซึ่งการปกครองอันเปี่ยมศรัทธาของ [task_contract_employer.GetNamePossessive] ดำเนินตาม [task_contract_employer.GetFaith.ReligiousText] อันศักดิ์สิทธิ์!" เสียงเชียร์เบาๆ แด่พระนามของ [task_contract_employer.GetFaith.HighGodNamePossessive] ทำให้ผู้อาวุโสชะงักไปครู่หนึ่ง ก่อนจะกล่าวต่อ:\n\n"อย่างไรก็ตาม เจ้าเหนือหัวของ [task_contract_employer.GetHerHis] คือ [task_contract_target.GetName] เป็น [task_contract_employer.Custom2('GetUnbelieverTerm', task_contract_target)] ผู้ไม่ใส่ใจวิถีของเราเท่าใดนัก ในนามแห่ง [task_contract_employer.GetFaith.HighGodName] พวกเราวิงวอน โปรดช่วยพวกเรารับประกันเสรีภาพทางศาสนาภายใต้การปกครองของ [task_contract_target.GetPrimaryTitle.GetTierAsNamePossessiveNoTooltip] นี้ด้วยเถิด!""
 ep3_contract_event.0021.a: "$ep3_contract_event.0020.a$"
 ep3_contract_event.0021.b: "ข้าเรียนรู้กลเม็ดบางอย่างเพื่อโน้มน้าวเหล่า [task_contract_target.GetFaith.GetAdherentNamePluralNoTooltip] มาเป็นพวก"
 ep3_contract_event.0021.c: "$ep3_contract_event.0020.c$"
 ep3_contract_event.0021.d: "ข้าจะหาบางอย่างใน [task_contract_target.GetFaith.ReligiousText] เพื่อโน้มน้าว [task_contract_target.GetHerHim]"
 ep3_contract_event.0021.e: "$ep3_contract_event.0020.e$"
 ep3_contract_event.0021.tt: "[scheme|E] ที่ประสบความสำเร็จจะ ส่งผลให้ [task_contract_target.GetShortUIName] มอบ [obligation|E] [GetSubjectContractType( 'religious_rights' ).GetObligationName( 'religious_rights_protected' )] ให้แก่ [task_contract_employer.GetShortUIName]"
 cultural_acceptance_laamp_cultural_minority_contract: "ความพยายามของ [adventurer|E] ทำให้ได้รับ [obligation|E] [GetSubjectContractType( 'title_revocation_rights' ).GetObligationName( 'title_revocation_rights_protected' )] ต่อต้านนายเหนือหัวต่างชาติ"
 ep3_contract_event.0030.t: "$contract_event_prefix$ $laamp_prison_break_contract_contract$"
 ep3_contract_event.0030.desc: ""ไอ้ [task_contract_target.Custom2('InsultAdjective', SCOPE.sC('task_contract_employer'))] [task_contract_target.Custom2('InsultNoun', SCOPE.sC('task_contract_employer'))] [task_contract_target.GetName] เอ๊ย!" เสียงสบถอันดังลั่นจากนอกกระโจมปลุกข้าให้ตื่น\n\n"นั่นผู้ใด? ผู้ใดมารบกวนข้ายามค่ำคืน ถึงในค่ายของข้าเอง?" ข้าเอ่ยถาม ทั้งที่ยังกึ่งหลับกึ่งตื่น\n\n"ข้าเอง [task_contract_employer.GetName]!" ผู้บุกรุกประกาศอย่างภาคภูมิ "เร่งมือเข้า อย่ามัวเสียเวลา! [task_contract_object.Custom2('MyCharacterIntroduction', task_contract_employer)|U] ถูกจับตัวไปเป็นเชลยโดยไอ้ [task_contract_target.Custom2('InsultAdjective', SCOPE.sC('task_contract_employer'))] [task_contract_target.Custom2('InsultNoun', SCOPE.sC('task_contract_employer'))] [task_contract_target.GetTitledFirstNameNoTooltip]" เมื่อเห็นความสับสนของข้า [task_contract_employer.GetSheHe] จึงกล่าวเสริมว่า:\n\n"ข้าจะจ่ายอย่างงาม หากท่านสามารถช่วย [task_contract_object.GetHerHim] ออกมาได้!""
 ep3_contract_event.0030.a: "$ep3_contract_event.0020.a$"
 ep3_contract_event.0030.b: "ข้าจะเริ่มวางแผนแหกคุกทันที!"
 ep3_contract_event.0030.c: "เรื่องนี้รอถึงเช้าได้"
 ep3_contract_event.0030.c.tt: "ปลดล็อก $prison_break_contract_interaction$ [interaction|E]"
 ep3_contract_event.0030.agents: "$schemes.tt.agent_packages.list_boilerplate$\n$EFFECT_LIST_BULLET$[success_chance_max_i] [GetAgentSlotType( 'agent_thief' ).GetName]\n$EFFECT_LIST_BULLET$[success_chance_max_i] [GetAgentSlotType( 'agent_thug' ).GetName]\n$EFFECT_LIST_BULLET$[scheme_speed_i] [GetAgentSlotType( 'agent_infiltrator' ).GetName]\n$EFFECT_LIST_BULLET$[secrecy_i] [GetAgentSlotType( 'agent_lookout' ).GetName]\n$EFFECT_LIST_BULLET$[secrecy_i] [GetAgentSlotType( 'agent_decoy' ).GetName]"

 treasure_map_prefix: "แผนที่ขุมทรัพย์"
 ep3_contract_event.0040.t: "$treasure_map_prefix$: แผนที่ขาดสะบั้น"
 ep3_contract_event.0040.desc: "ขณะที่ข้าหยิบแผนที่ขุมทรัพย์ออกมาดูอีกครั้งด้วยความสับสน แผนที่ดันไปเกี่ยวกับบางอย่างในย่ามจนเกิดเสียง #EMP "แคว-ว-วก"#!\n\nแผนที่ของข้าฉีกขาดกลางเป็นชิ้นเล็กชิ้นน้อยร่วงหล่นสู่พื้น\n\nข้ายืนตะลึง ถือเศษแผนที่— ซึ่งบัดนี้แทบไร้ประโยชน์—ไว้ในมือ"
 ep3_contract_event.0040.a: "นายจ้างของข้าคงไม่ชอบใจแน่"
 ep3_contract_event.0040.a_travel: "แต่—ข้าเพิ่งจะ... ช่างเถอะ"
 ep3_contract_event.0040.b: "อยู่ตรงนี้ต่อไปก็ได้"

 ep3_contract_event.0041.t_dead: "$treasure_map_prefix$: ชั่วนิรันดร์มิรอ [task_contract_employer.GetWomanMan|U]"
 ep3_contract_event.0041.t_incapable: "$treasure_map_prefix$: ราตรีกาลมาเยือน"
 ep3_contract_event.0041.desc_intro: "ยามเฝ้ากองไฟขวางทางข้าขณะเดินไปยังกระโจมของ [task_contract_employer.GetTitledFirstNamePossessive]: "[ROOT.Char.GetTitleAsNameNoTooltip|U] อย่าเลย... [task_contract_employer.GetSheHe] ไปแล้ว [ROOT.Char.Custom('MistressMaster')]"
 ep3_contract_event.0041.desc_dead: "$ep3_contract_event.0041.desc_intro$\n\nข้าเข้าไปในกระโจม และชั่วขณะหนึ่ง [task_contract_employer.GetFirstNameNoTooltip] ดูเหมือนเพียงแค่หลับใหล— จนกระทั่งข้าสังเกตเห็นใบหน้าของ [task_contract_employer.GetHerHis] ค่อยๆ ซีดเผือดลงสู่ความตาย\n\nข้ายังคงตกตะลึง"
 ep3_contract_event.0041.desc_incapable: "$ep3_contract_event.0041.desc_intro$\n\nข้าเข้าไปในกระโจม พบ [task_contract_employer.GetFirstNameNoTooltip] กองอยู่บนพื้น ยังมีชีวิต แต่... เพียงแค่... #EMP ไม่อยู่ที่นี่แล้ว#!.\n\nข้ายังคงตกตะลึง ช่วยพยุง [task_contract_employer.GetHerHim] นั่งพิงเตียง แล้วจึง"
 ep3_contract_event.0041.desc_outro: "กวาดตามองไปรอบๆ พยายามหาแผนที่ขุมทรัพย์ แต่ก็ตระหนักได้อย่างรวดเร็วว่ามันไม่ได้อยู่ที่นี่\n\nบัดนี้ ข้าไม่อาจทำการค้นหาสมบัติชิ้นสุดท้ายให้เสร็จสิ้นได้อีกต่อไป..."
 ep3_contract_event.0041.a: "เราควรกลับไป"
 ep3_contract_event.0041.a.tt: "ย้าย [camp|E] ของท่านไปยัง [THIS.Char.GetCurrentLocation.GetNameNoTooltip]"
 ep3_contract_event.0041.a.flavor_dead: "ขอ [task_contract_employer.GetFaith.HighGodName] โปรดประทานความสงบแก่ดวงวิญญาณของ [task_contract_employer.GetHerHis]"
 ep3_contract_event.0041.a.flavor_incapable: "ช่างเป็นสภาพที่น่าสะพรึงกลัว... ของการดำรงอยู่?"
 ep3_contract_event.0041.b: "อย่างไรเสีย ก็ไม่มีอะไรให้กลับไปหาแล้ว"
 treasure_map_employer_is_incapable.tt: "[task_contract_employer.GetShortUIName|U] ได้รับ [trait|E] [GetTrait('incapable').GetName( GetNullCharacter )]"
 treasure_map_disappeared.tt: "หาแผนที่ไม่พบ!"
 

 ep3_contract_event.0043.t: "$treasure_map_prefix$: สิ่งที่หลุดลอยไป"
 ep3_contract_event.0043.desc: "[task_contract_employer.GetTitledFirstName] เดินมาหาข้าและตบไหล่: "ช่างเป็น [ROOT.Char.Custom('GetLassLad')] ที่ดีนัก! ข้าซาบซึ้งในความช่วยเหลือของเจ้าในการเดินทางครั้งสุดท้ายนี้อย่างแท้จริง"\n\n[task_contract_employer.GetSheHe|U] ยื่น [0043_treasure_map.GetName] ที่เก่าคร่ำคร่าให้ รอยย่นรอบดวงตาของ [task_contract_employer.GetHerHis] อ่อนลงขณะที่ [task_contract_employer.GetSheHe] ยิ้ม "มันอาจดูไม่เท่าไหร่ แต่ข้าต่อสู้กับ [task_contract_employer.GetFaith.DevilName] [task_contract_employer.GetFaith.DevilHerselfHimself] เพื่อให้ได้สิ่งนี้มา จงดูแลมันให้ดี"\n\nหยุดครู่หนึ่ง เพื่อให้คำพูดซึมซับ [task_contract_employer.GetWomanMan] ชราก็หัวเราะลั่น: "เมื่อใดก็ตามที่เจ้าพร้อม—เรามีขุมทรัพย์ให้ขุด!"
 ep3_contract_event.0043.a: "ออกเดินทางกันเถอะ!"
 ep3_contract_event.0043.a.tt: "เปิดมุมมอง [decision|E] [GetDecisionWithKey('treasure_map_contract_decision').GetName]"
 ep3_contract_event.0043.b: "ข้าจะจัดการมันเอง อีกไม่นาน"

 ep3_contract_event.0045.t: "$treasure_map_prefix$: ของในมือ..."
 ep3_contract_event.0045.desc_intro_artifact: "ยามรุ่งอรุณ เรามาถึง [excavation_location.GetName]—ณ จุดที่ควรเป็นเครื่องหมายบน [0045_treasure_map.GetName] ข้าเริ่มค้นหาสถานที่ที่เหมาะสม ซึ่งอาจมีคนซ่อนสมบัติไว้\n\nไกลสุดลูกหูลูกตา มีเพียง [excavation_location.GetTerrain.GetNameNoTooltip|l] อันเงียบสงัดทอดยาว: เป็นฉากหลังอันงดงามให้กับการค้นหาของข้า"
 ep3_contract_event.0045.desc_artifact_historical: "$ep3_contract_event.0045.desc_intro_artifact$\n\nในที่สุด ข้าก็ค้นพบเนินดินใต้พุ่มไม้สองสามพุ่มที่จัดเรียงอย่างเป็นระเบียบ #EMP เกินไป#! ที่จะเป็นไปตามธรรมชาติ ขณะที่ข้าเริ่มขุด ข้ากระทบบางอย่าง และข้าค่อยๆ ขุดมันขึ้นมาอย่างระมัดระวังเพื่อพบว่ามันคือ... [treasure_artifact_historical.GetName]!?"
 ep3_contract_event.0045.desc_artifact_jewelry: "$ep3_contract_event.0045.desc_intro_artifact$\n\nลึกเข้าไปในหมู่ไม้โบราณใกล้เคียง ข้าสังเกตเห็นบางอย่างในโพรงไม้โพรงหนึ่ง เมื่อสอดมือเข้าไปในต้นไม้ ข้าดึงออกมา... [treasure_artifact_jewelry.GetName]"
 ep3_contract_event.0045.desc_intro_gold: "เรามาถึงชนบทของ [excavation_location.GetName] ในช่วงบ่ายแก่ๆ และเริ่มมองหาเบาะแสว่าเครื่องหมายบน [0045_treasure_map.GetName] อาจชี้ไปที่ใด\n\nขณะเดินสำรวจ [excavation_location.GetTerrain.GetNameNoTooltip|l] ข้าสังเกตเห็นโพรงที่ซ่อนอยู่อย่างดีในหน้าผาหิน มันนำไปสู่ถ้ำเล็กๆ"
 ep3_contract_event.0045.desc_gold_great: "$ep3_contract_event.0045.desc_intro_gold$\n\nภายในถ้ำ การตก แต่งแสดงภาพกิจกรรมแปลกประหลาดและน่าสยดสยองต่างๆ มีหีบไม้ฝุ่นเขรอะรออยู่\n\nข้าเปิดมันออก และพบทองคำ เครื่องประดับ และของมีค่าจำนวนมาก!"
 ep3_contract_event.0045.desc_gold_mediocre: "$ep3_contract_event.0045.desc_intro_gold$\n\nภายในถ้ำ ซึ่งดูเหมือนถูกลืมเลือนไปนานแล้ว เป็นที่อยู่ของวัตถุกระจัดกระจาย\n\nเมื่อยกสิ่งที่ดูเหมือนโกศโบราณ—และหนักอย่างน่าประหลาดใจ—ขึ้น ข้าพบเหรียญทองคำจำนวนพอสมควรอยู่ภายใน"
 ep3_contract_event.0045.desc_gold_poor: "$ep3_contract_event.0045.desc_intro_gold$\n\nภายในถ้ำดูเหมือนจะเป็นศาลลับของเทพเจ้าลึกลับบางองค์... และภายใต้สายตาของวิญญาณที่ไม่คุ้นเคย ข้าไม่พบสิ่งใดมีค่านอกจากลูกปัดทองคำเพียงชิ้นเดียวบนจานเครื่องบูชา"
 ep3_contract_event.0045.desc_intro_scenery: "เมื่อเรามาถึงชานเมือง [excavation_location.GetName] ข้าตามเครื่องหมายบน [0045_treasure_map.GetName] ผ่านหน้าผาและพงหญ้าและ..."
 ep3_contract_event.0045.desc_riches_in_scenery_dry: "$ep3_contract_event.0045.desc_intro_scenery$\n\n[excavation_location.GetTerrain.GetNameNoTooltip|l] เปิดออกสู่โอเอซิสอันน่าทึ่ง น้ำเย็นมอบการพักผ่อนจากความร้อนที่ไม่ลดละ และระลอกคลื่นเคลื่อนผ่านผิวน้ำขณะที่ปลาหลากสีสันเริงระบำอยู่เบื้องล่าง\n\nข้าคิดว่า—แม้ในช่วงเวลาที่ยากลำบากที่สุด—ที่หลบภัยอันเงียบสงบเหล่านี้ยังคงไม่เปลี่ยนแปลง: ในสถานที่อันสงบสุข เช่นนี้ เราจะรู้สึกถึงความใกล้ชิดกับ [ROOT.Char.GetFaith.HighGodName]..."
 ep3_contract_event.0045.desc_riches_in_scenery: "$ep3_contract_event.0045.desc_intro_scenery$\n\n[excavation_location.GetTerrain.GetNameNoTooltip|l] เปิดออกสู่แหล่งน้ำพุอันงดงาม นกและสัตว์กินหญ้าจำนวนมากอาศัยอยู่ในบริเวณนี้ โดยไม่ถูกรบกวนจากโลกภายนอก\n\nข้าครุ่นคิดถึงความงามของสถานที่แห่งนี้ และวิธีที่สิ่งมีชีวิตทั้งหมดดำรงอยู่ในลำดับชั้นอันอ่อนโยน: แมลง ปลา นก และสัตว์ร้าย\n\nความอบอุ่นก่อตัวขึ้นในอกของข้า นี่คือความรู้สึกอันศักดิ์สิทธิ์: ไม่ต้องสงสัยเลย!"
 ep3_contract_event.0045.desc_pillaged: "$ep3_contract_event.0045.desc_intro_gold$\n\nหลังจากผ่านไปชั่วโมงกว่าเล็กน้อย ข้าพบหลุมที่ถูกปิดไว้บางส่วนพร้อมหีบไม้เล็กๆ อยู่ข้างใน มันเกือบจะว่างเปล่า... เว้น แต่เครื่องประดับเล็กๆ น้อยๆ ของชาว [excavation_location.GetCulture.GetNameNoTooltip] เพียงหยิบมือ"

 ep3_contract_event.0045.a: "ข่าวดีสำหรับ [task_contract_employer.GetTitledFirstNameNoTooltip]!"
 ep3_contract_event.0045.a_artifact_historical: "[task_contract_employer.GetTitledFirstNameNoTooltip] จะต้อง #EMP ตื่นเต้นยินดี!#!"
 ep3_contract_event.0045.a_pillaged: "หืม ข้าว่านายจ้างของข้าควรได้รับแจ้ง..."
 ep3_contract_event.0045.b: "ใครเจอก็เป็นของคนนั้น"
 ep3_contract_event.0045.b_artifact_historical: "นี่เป็นของ... #EMP ข้า!#!"
 ep3_contract_event.0045.b_pillaged: "ไม่มีอะไรให้ฉลองมากนักที่นี่"
 ep3_contract_event.0045.b.flavor_reforged: "ข้าจะหลอมสิ่งนี้ใหม่ให้เป็นของมีประโยชน์"
 ep3_contract_event.0045.b.flavor: "ข้าจะเก็บสิ่งนี้ไว้ใช้ทีหลัง"

 ep3_contract_event.0050.t: "$treasure_map_prefix$: ...ดีกว่าของที่ยังไม่ได้มา"
 ep3_contract_event.0050.desc_artifact_historical: ""[treasure_artifact_historical.GetName]!" [task_contract_employer.GetTitledFirstName] หอบหายใจ ขณะที่ข้ายื่น [treasure_artifact_historical.Custom('ArtifactType')] ให้\n\n"ขอให้พรสถิตแก่เจ้า สหายเอ๋ย ที่นำสิ่งนี้มาให้ข้า ข้าเข้าใจดีว่ามันอาจยากเหลือจะพรรณนาที่จะต้องพรากจากสมบัติ เช่นนี้..."\n\n[task_contract_employer.GetSheHe|U] ยิ้มอย่างขอบคุณ "ข้าว่าปัญญาของมารดาข้ายังคงเป็นจริง: เราสามารถมีศรัทธาในความเมตตาของคนแปลกหน้าได้จริงๆ""
 ep3_contract_event.0045.desc_intro: "[task_contract_employer.GetFirstName] แทบจะเก็บความตื่นเต้นของ [task_contract_employer.GetHerHis] ไว้ไม่อยู่ขณะที่ข้ากลับไปยังกระโจมของ [task_contract_employer.GetHerHis]"
 ep3_contract_event.0050.desc_artifact_jewelry: "$ep3_contract_event.0045.desc_intro$ "งดงามยิ่ง! ดูศิลปะอันแปลกประหลาดนั่นสิ!"\n\n[task_contract_employer.GetSheHe|U] พินิจพิเคราะห์รายละเอียดเล็กๆ น้อยๆ ของ [treasure_artifact_jewelry.GetName] แทบจะครางด้วยความยินดี และส่งยิ้มให้ข้า "เจ้าได้รับความขอบคุณอย่างไม่สิ้นสุดจากข้าสำหรับสิ่งนี้""
 ep3_contract_event.0050.desc_gold: "$ep3_contract_event.0045.desc_intro$ "ทองคำรึ เจ้าว่า? ช่างเป็นสมบัติชิ้นสุดท้ายที่ดีเสียนี่กระไร!"\n\nความเศร้าสร้อยเล็กน้อย ซึ่งไม่ต้องสงสัยเลยว่าเกิดจากความคิดถึงจุดสิ้นสุดของการผจญภัย วาบผ่านใบหน้าของ [task_contract_employer.GetHerHis] ขณะที่ [task_contract_employer.GetSheHe] สรุปเรื่องนี้ "ข้าขอบคุณสำหรับโชคลาภทองคำนี้ ที่ส่งมอบมาอย่างซื่อสัตย์ ไปเถิด พร้อมกับคำขอบคุณของข้า""
 ep3_contract_event.0050.desc_scenic: "$ep3_contract_event.0045.desc_intro$ "นั่น... ฟังดูน่าทึ่งอย่างแท้จริง ข้าใช้เวลามากมายในชีวิตค้นหาความมั่งคั่ง เครื่องประดับเล็กๆ น้อยๆ สิ่งของที่แวววาว นี่..."\n\n[task_contract_employer.GetSheHe|U] หยุดครู่หนึ่ง จมอยู่ในความคิด: "...นี่คือที่ที่ข้าจะใช้ชีวิตในวันสุดท้ายอย่างสงบ ขอบคุณ สหายข้า""
 ep3_contract_event.0050.desc_pillaged: "$ep3_contract_event.0045.desc_intro$ "มันถูกรื้อค้นไปแล้วรึ?"\n\n[task_contract_employer.GetSheHe|U] ถอนหายใจหนัก "ชีวิตนักผจญภัยไม่ได้จบลงด้วยเสียงดัง แต่จบลงด้วย... เสียงครวญครางกระมัง เอาเถอะ เจ้าตามใจข้าในเรื่องโง่เขลานี้ และได้รับคำขอบคุณจากข้า""
 ep3_contract_event.0050.a: "ยินดีที่ได้ทำธุรกิจกับท่าน"
 ep3_contract_event.0060.t: "$contract_event_prefix$ $laamp_help_claimant_contract_contract$"
 ep3_contract_event.0060.desc: "คณะเดินทางของ [task_contract_employer.GetCulture.GetCollectiveNoun] ซึ่งหอกของพวกเขาประดับด้วยธงทิวที่เย็บขึ้นใหม่สีสันสดใส ได้หยุดพักที่ค่ายของข้า หนึ่งใน [task_contract_employer.Custom('KnightCulturePluralNoTooltip')|l] นาม [commander.GetName] นำคำร้องขอจากนายของ[commander.GetHerHis]มาให้ข้า\n\n"[task_contract_employer.GetName] กำลังเตรียมกองทัพของ[task_contract_employer.GetHerHis]เพื่อจู่โจม [task_contract_target.Custom2('InsultAdjective', SCOPE.sC('task_contract_employer'))] [task_contract_target.GetName] และ — ด้วยคมหอกคมดาบ — ทวงคืนสิ่งที่พึงเป็นของ[task_contract_employer.GetHersHis]โดยชอบธรรม!"\n\n"และเมื่อธงของเราโบกสะบัดเหนือ [task_contract.MakeScope.Var('task_contract_title').Title.GetNameNoTier] จะมีทรัพย์เชลยอย่างดีแจกจ่ายให้แก่ทุกคนที่ต่อสู้เพื่อสิทธิ์ในการอ้างสิทธิ์ของ [task_contract_employer.GetTitleAsNamePossessiveNoTooltip]!""
 ep3_contract_event.0060.a: "$ep3_contract_event.0008.a$"
 ep3_contract_event.0060.join_war: "[task_contract_taker.GetShortUIName|U] จะเข้าร่วม [war|E] ในฐานะผู้โจมตี"

