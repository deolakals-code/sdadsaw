 ep3_contract_event.0009.desc: "$ep3_contract_event.0001.desc$"[task_contract_employer.GetTitledFirstNameNoTooltip] คือเจ้าของโดยชอบธรรมของ [task_contract_object.GetName] ซึ่ง [task_contract_target.Custom2('InsultAdjective', SCOPE.sC('task_contract_employer'))] [task_contract_target.GetName] ยึดครองไว้โดยมิชอบ นายเหนือหัวของข้าปรารถนาให้ท่านนำมันกลับคืนมา — ไม่ว่าจะด้วยวิธีใดก็ตาม!""
