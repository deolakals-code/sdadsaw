 ep3_contract_event.0565.t.critsuccess: "ผู้ก่อปัญหา: สำเร็จอย่างยอดเยี่ยม"
 ep3_contract_event.0565.t.success: "ผู้ก่อปัญหา: สำเร็จ"
 ep3_contract_event.0565.t.failure: "ผู้ก่อปัญหา: ล้มเหลว"
 ep3_contract_event.0565.t.critfailure: "ผู้ก่อปัญหา: ล้มเหลวอย่างยิ่ง"
 ep3_contract_event.0565.desc.critsuccess: "การสังหาร [councillor.GetTitledFirstName] นั้นรวดเร็วและโหดเหี้ยม [councillor.GetWomanMan] ผู้นั้นตายอย่างน่าอดสู ถูกปิดปากก่อนที่สหายของ[councillor.GetHerHis]จะทันได้ส่งเสียงร้องโวยวาย\n\nแสงสว่างอันเยียบเย็นแห่งรุ่งอรุณชะล้างบาปของข้าจนเกือบหมดสิ้น การอาบน้ำในลำธารแถบนั้นก็ช่วยชำระล้างส่วนที่เหลือ\n\nสายลับผู้หนึ่งรออยู่บนฝั่ง — จะใช่คนเดิมกับเมื่อก่อนหรือไม่ ข้าก็มิอาจบอกได้ — พร้อมกับถุงหนักอึ้งหลายใบ\n\n"[task_contract_employer.GetTitleAsNameNoTooltip] ขอบคุณท่านสำหรับผลงาน [task_contract_employer.GetSheHe|U] ได้มอบของขวัญเพิ่มเติมเพื่อเป็นสัญลักษณ์แห่งความขอบคุณของ[task_contract_employer.GetHerHis]""
 ep3_contract_event.0565.desc.success: "[councillor.GetTitledFirstFirstName] ไม่อยู่แล้ว การกระทำรุนแรงนั้นไม่ได้สมบูรณ์แบบ แต่ความจริงก็คือ: ข้าได้สังหารเป้าหมายของข้าแล้ว\n\nแสงสว่างอันเย็นชาของวันใหม่ชำระล้างบาปของข้าเกือบหมดสิ้น; การอาบน้ำในลำธารใกล้เคียงช่วยชำระล้างส่วนที่เหลือ\n\nสายลับคนหนึ่งรออยู่ที่ริมฝั่ง—ไม่ว่าจะเป็นคนเดิมหรือไม่ ข้าบอกไม่ได้—พร้อมกับถุงหนักๆ ห้อยจากอานม้าของ [messenger.GetHerHis]\n\n"[task_contract_employer.GetTitleAsNameNoTooltip] ขอบคุณท่านสำหรับงานของท่าน การรับใช้ของท่านจะถูกจดจำ""
 ep3_contract_event.0565.desc.failure: "ถึงกระนั้น เสียงโหยหวน เสียงจานและเก้าอี้ที่ถูกขว้างปา เสียงทุบตีหนักๆ ยังคงดังก้องอยู่ในหูข้า ข้าขัดมืออย่างบ้าคลั่ง แต่ลำธารนี้ไม่อาจชำระล้างร่องรอยแห่งความล้มเหลวได้\n\nช่างเป็นเรื่องยุ่งเหยิง [councillor.GetTitledFirstName] ยังมีชีวิตอยู่ และสัญญาของข้ากับ [task_contract_employer.GetTitledFirstName] ก็เป็นโมฆะ ข้าไม่ควรอยู่ที่นี่นานนัก มิฉะนั้นการแก้แค้นจากแหล่งใดแหล่งหนึ่งอาจตามหาข้าเจอ"
 ep3_contract_event.0565.desc.critfailure: "หายนะโดยสิ้นเชิง! ความโกรธเกรี้ยวทั้งหมดของสถานประกอบการอันหยาบกระด้างหันมาต่อต้านข้า และข้าโชคดีที่หนีรอดมาได้ด้วยชีวิต\n\nขณะทำความสะอาดบาดแผลในแม่น้ำใกล้เคียง ข้าเอาโคลนพอกตัวและพยายามเก็บสัมภาระของข้ากลับคืนมาอย่างยากลำบาก\n\nข้าต้องหนีต่อไป... [councillor.GetTitledFirstName] ยังมีชีวิตอยู่ และ [task_contract_employer.GetTitledFirstName] จะต้องโกรธข้ามาก มีเพียง [ROOT.Char.GetWomanMan] ที่โง่เขลาเท่านั้นที่จะอยู่ที่นี่"
 ep3_contract_event.0565.a: "[councillor.GetSheHe|U] จะไม่มีใครได้ยินข่าวอีกเลย"
 ep3_contract_event.0565.b: "ให้ตายสิ"

