 ep3_contract_event.0001.t_construction: "$ep3_contract_event.0001.t$ $laamp_construction_contract_contract$"
 ep3_contract_event.0001.desc: "คณะผู้แทนจาก [task_contract_employer.GetName] เดินทอดน่องผ่านม่านกระโจมใหญ่ของข้า\n\n"คารวะ ท่านนักผจญภัย!" ทูตผู้หนึ่งกล่าว "หนทางในโลกนี้มีมากมายและเต็มไปด้วยอันตราย: หากท่านจะทำงานให้ [task_contract_employer.GetPrimaryTitle.GetNameNoTier] เจ้าเหนือหัวของข้าจะจ่ายค่าความเชี่ยวชาญของท่านอย่างงาม"\n\n"
 ep3_contract_event.0001.desc_intro_explorer: "ทิ้งล่อที่บรรทุกของหนักของ [task_contract_employer.GetHerHis] ให้หอบหายใจอยู่ข้างนอก [task_contract_employer.GetName] ถูกนำเข้าไปในเต็นท์ของข้า\n\n\"สวัสดี! ว่ากันว่าท่านเป็น [ROOT.Char.GetWomanMan] แห่งโลก: บางทีอาจเป็นผู้ที่มีความกล้าพอที่จะผจญภัยไปไกลเคียงข้างนักสำรวจที่อยากรู้อยากเห็นตลอดเวลา เช่นข้า?\"\n\n"
 ep3_contract_event.0001.desc_vip: "\"ข้า [task_contract_object.GetName] เป็นผู้รับใช้ที่ภักดีที่สุดของ [task_contract_employer.GetTitleAsNameNoTooltip] เป็นคำพูดของ [task_contract_employer.GetHerHis] ที่ข้าต้องนำไปยัง [task_contract_destination.GetTitle.GetNameNoTier] ไปยังห้องโถงของ [task_contract_target.GetTitledFirstName] จงนำทางข้า ปกป้องข้า และมอบความไว้วางใจว่าสาส์นของข้าจะไม่ตกเป็นเหยื่อของสายตาที่สอดรู้สอดเห็น!\""
 ep3_contract_event.0001.desc_artifact: "\"[escorted_artifact.GetName] อันล้ำค่าของ [task_contract_employer.GetHerHis|U] จะถูกมอบหมายให้ท่าน นำมันไปยัง [task_contract_destination.GetTitle.GetName] ที่ ซึ่ง [task_contract_target.GetTitledFirstName] นั่งอยู่ เพราะ [escorted_artifact.GetNameNoTooltip] ได้รับการสัญญาไว้เป็นของขวัญอันสูงค่า และจงระวัง! หากสมบัติอันศักดิ์สิทธิ์นี้ไม่ไปถึงที่หมาย ผลที่ตามมาจะร้ายแรง\""
 ep3_contract_event.0001.desc_child: "\"'จงปกป้อง [task_contract_object.Custom2('MyCharacterIntroduction', task_contract_employer)]!' [task_contract_employer.GetTitleAsNameNoTooltip] บัญชา [task_contract_object.Custom('GirlBoy')] จะได้รับการศึกษาที่ไม่เหมือนใครใน [task_contract_destination.GetTitle.GetNameNoTier] ที่ ซึ่ง [task_contract_target.GetTitledFirstName] ผู้ชาญฉลาดรอคอย [task_contract_object.GetHerHim] อยู่ จงดูแลเด็กคนนี้ไว้ใกล้ตัวท่าน: ชะตากรรมของ [task_contract_object.GetHerHis] มีความสำคัญอย่างยิ่งต่ออนาคตของ [task_contract_employer.GetPrimaryTitle.GetNameNoTierNoTooltip]!\""
 ep3_contract_event.0001.desc_gold: ""เรานำหีบใบใหญ่ที่เต็มไปด้วยอัญมณี น้ำหอม และโลหะมีค่ามาด้วย ท่านจะต้องนำสิ่งนี้ไปยัง [task_contract_destination.GetTitle.GetNameNoTier] และมอบให้แก่ [task_contract_target.GetTitledFirstName] ด้วยพิธีการอันยิ่งใหญ่ ของขวัญอันหรูหราที่สุด ซึ่งจะ ทำให้ [task_contract_target.GetTitleAsNameNoTooltip] เป็นหนี้บุญคุณเจ้าเหนือหัวของข้าอย่างลึกซึ้ง: มันต้องได้รับการคุ้มกันอย่างใกล้ชิด""
 ep3_contract_event.0001.desc_explorer: "ได้โปรด พาข้าไปยัง [task_contract_destination.GetTitle.GetName] คุ้มครองข้าระหว่างทาง แล้วข้าจะตอบแทนท่านด้วยเหรียญอย่างงาม!""
 ep3_contract_event.0001.desc_explorer_intro: ""ข้าได้ยินมาว่า [task_contract_destination.GetHolding.GetSpecialBuildingType.GetName]"
 ep3_contract_event.0001.desc_capitals: ""นักเดินทางต่างชื่นชม [task_contract_destination.GetCounty.GetTitle.GetHolder.GetPrimaryTitle.GetDefinitiveName] ว่ามีเมืองหลวงที่ยิ่งใหญ่และงดงามที่สุด บางทีอาจงดงามที่สุดในบรรดาดินแดนแถบนั้น"
 ep3_contract_event.0001.desc_special_buildings_martial: "$ep3_contract_event.0001.desc_explorer_intro$ เป็นเครื่องยืนยันอันยิ่งใหญ่ถึงความรุ่งโรจน์ทางการทหารในอดีต"
 ep3_contract_event.0001.desc_special_buildings_learning: "$ep3_contract_event.0001.desc_explorer_intro$ เป็นศูนย์กลางการเรียนรู้และแหล่งเก็บความรู้อันยิ่งใหญ่"
 ep3_contract_event.0001.desc_special_buildings_religious: "$ep3_contract_event.0001.desc_explorer_intro$ เป็นหนึ่งในสถานที่หายากที่ผู้มาเยือนจะได้สัมผัสถึงการประทับอยู่ของสิ่งศักดิ์สิทธิ์อย่างแท้จริง"
 ep3_contract_event.0001.desc_special_buildings_diplomatic: "$ep3_contract_event.0001.desc_explorer_intro$ เป็นสถานที่แห่งอำนาจอันเลื่องชื่อ ที่ ซึ่งควรเข้าใกล้ด้วยความเคารพและมารยาทเท่านั้น"
 ep3_contract_event.0001.desc_special_buildings_economic: "$ep3_contract_event.0001.desc_explorer_intro$ เป็นแหล่งความมั่งคั่งอันยิ่งใหญ่ เป็นที่รู้จักของพ่อค้าทั่วทุกดินแดน"
 ep3_contract_event.0001.desc_grand_city: ""ข้าปรารถนาจะไปเยือนนครอันยิ่งใหญ่ สวรรค์แห่งเมืองที่มีพลเมืองภาคภูมิใจ ถนนกว้างขวาง และตลาดที่คึกคัก"
 ep3_contract_event.0001.desc_special_buildings_wonder: "$ep3_contract_event.0001.desc_explorer_intro$ เป็นสิ่งมหัศจรรย์อย่างแท้จริง — ภาพที่บางคนกล่าวขานว่าราวกับเวทมนตร์"
 ep3_contract_event.0001.desc_mausoleum_at_halicarnassus: ""ว่ากันว่า $TRAVEL_POINT_OF_INTEREST_TT_poi_mausoleum_at_halicarnassus$ เป็นอนุสรณ์สถานสูงตระหง่านแด่หนึ่งในผู้ปกครองสมัยโบราณ ไม่เหมือนสิ่งใดที่สร้างขึ้นโดยคนในยุคของเรา..."
 ep3_contract_event.0001.desc_lighthouse_of_alexandria: ""มีประภาคารใดที่ทอดสายตาเหนือทะเลเมดิเตอร์เรเนียนอย่างภาคภูมิใจยิ่งกว่า $TRAVEL_POINT_OF_INTEREST_TT_poi_lighthouse_of_alexandria$? ข้าปรารถนาที่จะเห็นแสงอันสูงส่งนั้นด้วยตาของข้าเอง"
 ep3_contract_event.0001.desc_natural_feature: "$ep3_contract_event.0001.desc_explorer_intro$ เป็นหนึ่งในสิ่งสร้างสรรค์อันยอดเยี่ยมที่สุดของ [task_contract_employer.GetFaith.HighGodNamePossessive] เป็นภาพที่น่าทึ่งอย่างแท้จริง"
 ep3_contract_event.0001.desc_animal: ""[task_contract_employer.Custom('CatOrDogStoryName')] สัตว์เลี้ยงแสนรักของ [task_contract_employer.GetTitleAsNameNoTooltip] ได้ดึงดูดใจของ [task_contract_target.GetTitledFirstName] ดังนั้น เจ้าเหนือหัวของข้าจึงทรงตกลงอย่างกรุณาที่จะส่งสัตว์ตัวนี้ไปยัง [task_contract_destination.GetTitle.GetNameNoTier] ข้าขอฝากความปลอดภัยของ [task_contract_employer.Custom('CatOrDogStoryName')] ผู้น่ารักไว้กับท่านได้หรือไม่?""
 ep3_contract_event.0001.desc_construction: ""[task_contract_employer.GetTitleAsNameNoTooltip] กำลังสร้าง [task_contract_destination.GetHolding.GetConstructingHoldingType.GetName] ใน [task_contract_destination.GetTitle.GetNameNoTier] และคาดว่าจะมีการส่งมอบไม้และหิน เมื่อท่านไปถึงสถานที่ก่อสร้าง เราสามารถเจรจาภาระผูกพันเพิ่มเติมได้""
 ep3_contract_event.0001.vip: "[task_contract_object.GetTitledFirstNameNoTooltip] จะเดินทางอย่างปลอดภัยและรวดเร็ว!"
 ep3_contract_event.0001.child: "[task_contract_object.GetNameNoTooltip] จะได้รับการดูแลอย่างดี"
 ep3_contract_event.0001.explorer: "[task_contract_destination.GetNameNoTooltip] ช่างยิ่งใหญ่เสียนี่กระไร! ไปกันเถอะ!"
 ep3_contract_event.0001.artifact: "ข้าจะดูแลโบราณวัตถุนี้อย่างดี"
 ep3_contract_event.0001.gold: "ข้าจะเดินทางโดยให้หีบใบนี้อยู่ในสายตาเสมอ"
 ep3_contract_event.0001.animal: "[task_contract_employer.Custom('CatOrDogStoryName')] จะเดินทางบนหมอนผ้าซาติน"
 ep3_contract_event.0001.construction: "ข้าจะส่งมอบวัสดุทันที"
 ep3_contract_event.0001.with_domicile: "ค่ายทั้งหมดของข้าจะเดินทางไปยัง [task_contract_destination.GetNameNoTooltip]"
 ep3_contract_event.0001.with_domicile.tt: "การย้าย [camp|E] ของท่านไปยัง [task_contract_destination.GetNameNoTooltip] จะใช้ [provisions_i][provisions|E]"
 ep3_contract_event.0001.invalidate: "ข้าไม่ต้องการสัญญาจ้างนี้"
 ep3_contract_event.0001.tt_vip: "ท่านจะ [travel|E] ไปยัง [task_contract_destination.GetName] เพื่อคุ้มกัน [task_contract_object.GetName] ไปสู่ [court|E] ของ [task_contract_target.GetName]"
 ep3_contract_event.0001.tt_ward: "ท่านจะ [travel|E] ไปยัง [task_contract_destination.GetName] เพื่อให้แน่ใจว่า [task_contract_object.GetName] จะได้เริ่มการศึกษาของ [task_contract_object.GetHerHis]"
 ep3_contract_event.0001.tt_explorer: "ท่านจะ [travel|E] ไปยัง [task_contract_destination.GetName] พร้อมกับนักสำรวจ [task_contract_object.GetName]"
 ep3_contract_event.0001.tt_gold: "ท่านจะ [travel|E] ไปยัง [task_contract_destination.GetName] เพื่อส่งมอบของขวัญของ [task_contract_employer.GetNamePossessive] ให้แก่ [task_contract_target.GetName]"
 ep3_contract_event.0001.tt_animal: "ท่านจะ [travel|E] ไปยัง [task_contract_target.GetName] เพื่อคุ้มกัน [task_contract_employer.Custom('CatOrDogStoryName')]"
 ep3_contract_event.0001.tt_artifact: "ท่านจะ [travel|E] ไปยัง [task_contract_destination.GetName] และมอบ [escorted_artifact.GetNameNoTooltip] ของ [task_contract_employer.GetNamePossessive] ให้แก่ [task_contract_target.GetName]"
 ep3_contract_event.0001.tt_construction: "ท่านจะ [travel|E] ไปยัง [task_contract_destination.GetName] และส่งมอบวัสดุก่อสร้างให้แก่ [task_contract_employer.GetName]"
 ep3_contract_event.0001.tt_increase_control: "ท่านจะ [travel|E] ไปยัง [county|E] [task_contract_councillor_liege.GetPrimaryTitle.GetAdjective] ที่มีความฉ้อฉล [county_corruption|E] หรือมี [county_control|E] ต่ำ"
 ep3_contract_event.0003.t: "$contract_event_prefix$ ปล้นชิงเชลย"
 ep3_contract_event.0003.desc: "$ep3_contract_event.0001.desc$"ศัตรูคู่อาฆาตของ[task_contract_employer.GetHerHis|U] ซึ่งก็คือ [task_contract_target.Custom2('InsultAdjective', SCOPE.sC('task_contract_employer'))] [task_contract_target.GetName] ได้สร้างความเดือดร้อนเมื่อเร็วๆ นี้ นายเหนือหัวของข้าประสงค์ให้ท่านไปลดทอนความยโสของ[task_contract_target.GetHerHim] ด้วยการจับกุมคนของ[task_contract_target.GetHerHis]""
 ep3_contract_event.0003.a: "ชูธงขึ้น! เราจะเคลื่อนทัพออกไปทันที!"
 ep3_contract_event.0003.b: "$ep3_contract_event.0001.invalidate$"
 ep3_contract_event.0004.opening: "[task_contract_employer.Custom2('AppropriateGreetingPositive', ROOT.Char)]"
 ep3_contract_event.0004.opening_failure: "[task_contract_employer.Custom2('AppropriateGreetingNegative', ROOT.Char)]"
 ep3_contract_event.0004.desc: "ความพยายามอย่างแข็งขันของท่านในสงครามของข้าเป็นที่ซาบซึ้งอย่างยิ่ง! จงเพลิดเพลินกับทองคำที่ท่านสมควรได้รับเถิด [ROOT.Char.GetWomanMan] ที่ดีของข้า!"
 ep3_contract_event.0004.desc_failure: "ชื่อเสียงด้านการทหารของท่านถูกกล่าวเกินจริงไปมาก ท่านได้ผิดสัญญากับข้า — ท่านควรละอายใจตัวเอง!"
 ep3_contract_event.0004.a: "ข้าไม่ควรถามว่า [task_contract_employer.GetSheHe] จะทำอะไรกับพวกเขาดีกว่า"
 ep3_contract_event.0004.b: "ข้าแค่โชคไม่ดี..."
 ep3_contract_event.0004.success: "เชลยถูกส่งตัวไปยัง [prison|E] ของ [task_contract_employer.GetNamePossessive]:"
 ep3_contract_event.0005.t: "$contract_event_prefix$ $laamp_treasure_hunting_contract_contract$"
 ep3_contract_event.0005.desc: "$ep3_contract_event.0001.desc$"[task_contract_employer.GetNameNoTooltip] มีวิสัยทัศน์อันยิ่งใหญ่ในการรวบรวมงานฝีมือหลากหลายชนิดจากสถานที่แปลกใหม่ อย่างไรก็ตาม หน้าที่ของ [task_contract_employer.GetHerHis] ไม่สามารถละทิ้งได้ ดังนั้น [task_contract_employer.GetSheHe] จึงเสนอโอกาสให้ท่านค้นหาโลกเพื่อหาสิ่งประดิษฐ์ที่เหมาะสมสำหรับคอลเลกชันของ [task_contract_employer.GetHerHis]""
 ep3_contract_event.0005.a: "ข้าควรเลือกสถานที่ได้แล้ว!"
 ep3_contract_event.0005.a_tt: "เปิด $treasure_hunting_contract_decision$ [decision|E]"
 ep3_contract_event.0005.b: "$ep3_contract_event.0001.invalidate$"
 ep3_contract_event.0006.t: "$ep3_contract_event.0005.t$"
 ep3_contract_event.0006.desc: "ข้ามาถึง [task_contract_destination.GetName] เยี่ยมชม [task_contract_destination.Custom('GetGuildType')] ท้องถิ่นเพื่อตามหาร่องรอยของสิ่งน่าสนใจในบริเวณนั้น... แต่ก็ไม่สำเร็จ ข้าแวะที่"
 ep3_contract_event.0006.desc_locals: "โรงเตี๊ยม ที่ ซึ่งข้าแอบฟังบทสนทนาที่น่าสนใจระหว่างนักนินทาสองคน\n\n"ข้าบอกท่านแล้ว [local_2.GetFirstName]: [newly_created_artifact.GetName] ถูกซ่อนอยู่ใน [task_contract_destination.GetTerrain.GetNameNoTooltip|l] ของเรา! และข้ารู้ว่ามันอยู่ที่ไหน!" หนึ่งใน [local_1.GetCulture.GetCollectiveNounNoTooltip] กระซิบ\n\n"จุ๊ๆ [local_1.GetFirstName] มีคนมองเราอยู่..." อีกคนส่งเสียงฟ่อ พลางชี้มาที่ข้า"
 ep3_contract_event.0006.desc_locals_temple: "[task_contract_destination.Custom('GetLocationFaithTemple')]\n\n"ยินดีต้อนรับ นักเดินทาง!" [local_1.GetFaith.PriestNeuter] ท้องถิ่นทักทาย "ข่าวว่าท่านกำลังแสวงหาสมบัติทางโลก อืม... ข้าอาจมีบางอย่างจะบอกท่านเกี่ยวกับ [newly_created_artifact.GetName]"\n\n"แต่ก็ต่อเมื่อท่านได้รับความโปรดปรานจาก [local_1.GetFaith.WealthGodName]..."
 ep3_contract_event.0006.desc_locals_city: "ตลาด ที่ ซึ่งข้าถูกพ่อค้าเร่คว้าตัวไว้ที่ทางเข้า\n\n"คารวะ นักเดินทาง! โอ้ ท่านดูเหมือนพ่อค้าผู้ช่ำชอง ข้าบังเอิญมีทุกสิ่งที่ท่านต้องการ ตั้งแต่หัวจรดเท้า ก้นจรดศอก! ข้าขอเสนอสินค้าพิเศษให้ท่านสนใจได้หรือไม่... [newly_created_artifact.GetName]?""
 ep3_contract_event.0006.desc_locals_castle: "ประตูสู่ [task_contract_destination.GetHolding.GetType.GetName|l] ที่ ซึ่งข้าสังเกตเห็นชาวบ้านคู่หนึ่ง\n\n"ข้าไม่ได้หลอกท่านนะ [local_2.GetFirstName]! ตระกูล [local_ruler.GetDynastyHouseName] ได้ [newly_created_artifact.GetName] มา! ข้าเพิ่งเห็นพวกเขาถือมันเข้าไปใน [local_ruler.Custom('ResidenceBuilding')]" [local_1.GetCulture.GetNameNoTooltip] คนแรกพูด\n\n"มันไม่ง่ายหรอก [local_1.GetFirstName]... แต่บางที #EMP เรา#! อาจจะเอามันมาได้" คนที่สองตอบ ดวงตาของ[local_2.GetHerHis]เป็นประกาย"
 ep3_contract_event.0006.castle: ""ขออภัย แต่บางทีเราอาจร่วมมือกันได้?""
