 ep3_contract_event.0007.desc_castle_castle: "เราบุกตอนเที่ยงคืน ภายใต้ท้องฟ้ายามค่ำคืนที่มืดมิด เราลอบเข้าไปใน [task_contract_destination.GetHolding.GetType.GetName|l] โดยไม่มีใครสังเกตเห็น ด้วยการนำทางของ [local_1.GetFirstNamePossessive] เราจึงพบ [newly_created_artifact.GetName] อย่างรวดเร็ว อย่างไรก็ตาม — ระหว่างทางออก — ยามรักษาการณ์เห็นเรา! ข้าคว้าโบราณวัตถุแล้ววิ่งหนี ขณะที่ทหารยามกรูกันออกมาจากทุกมุม ผู้สมรู้ร่วมคิดของข้าและข้าพลัดหลงกัน\n\nหลังจากการไล่ล่าอันยาวนาน ข้าลงเอยในเงามืดหลังกำแพง ข้าได้ยินเสียงหอบหายใจของ [local_2.GetFirstName] แต่ไกล:\n\n"[ROOT.Char.GetSheHe|U] ขโมยสิ่งที่เป็นของเราโดยชอบธรรม ไอ้ปีศาจ!"
 ep3_contract_event.0007.desc_church_church: "ข้าทรุดเข่าลงและเริ่มสวดบทจาก [local_1.GetFaith.ReligiousText]\n\n"ข้าได้เห็นและได้ยินเพียงพอแล้ว ท่านเป็น [ROOT.Char.GetWomanMan] ของ [local_1.GetFaith.HighGodName] อย่างแน่นอน!" [local_1.GetName] กล่าวชื่นชม ประทับใจอย่างเห็นได้ชัด "ท่านไม่ต้องมองหาที่ไหนอีกแล้ว ข้ามอบ [newly_created_artifact.GetName] ให้แก่ท่าน จงดูแลมันให้ดี เพราะมันเป็นของขวัญไม่เพียง แต่จากข้า แต่จาก [local_1.GetFaith.HighGodName] ด้วย!""
 ep3_contract_event.0007.desc_city_city: ""ราคาของท่านสูงลิ่ว... และข้าเป็นเพียงนักเดินทางผู้ยากไร้" ข้าพยายามต่อรอง "ข้าต้องจ่ายเงินให้คนของข้า และเลี้ยงม้าของเรา นี่ — คือทั้งหมดที่ข้าจ่ายไหว เราตกลงกันได้ไหม?"\n\n[local_1.GetFirstName] ดูเหมือนจะไม่เชื่อข้า แต่[local_1.GetSheHe]เป็นนักต่อรองผู้ช่ำชอง ดังนั้น[local_1.GetSheHe]จึงรีบยื่นข้อเสนอโต้กลับ "ข้าจะรับเท่านั้น ใช่ แต่ข้าต้องให้ท่านดูสิ่งนี้ก่อน" [local_1.GetSheHe|U] เผยให้เห็น [newly_created_artifact.GetName] "ดู #EMP ความงาม#! นี้สิ ข้อเสนอจำกัด เฉพาะท่านเท่านั้น ข้ายินดีขายทั้งสองชิ้นในราคาสมเหตุสมผล!""
 ep3_contract_event.0007.desc_castle_buy: "[local_1.GetFirstName] และ [local_2.GetFirstName] ปรึกษาหารือกันอยู่ครู่หนึ่ง\n\n"มันเป็นความเสี่ยงใหญ่หลวงที่เรากำลังจะทำ... แต่ก็เป็นข้อเสนอที่ใจกว้าง เช่นกัน ท่านจะได้รางวัลของเราไป #EMP หาก#! เราจัดการให้ได้มันมา"\n\nคืนนั้น ข้าไปยังจุดนัดพบด้านนอกปราสาท และได้ยินเสียงโกลาหลดังมาจากหลังกำแพง [local_1.GetFirstNameNoTooltip] และ [local_2.GetFirstNameNoTooltip] ปีนป่ายลงมาจากก้อนหินเหนือข้า\n\n"หนีเร็ว! เรามีแขกไม่ได้รับเชิญ!" [local_1.GetFirstNameNoTooltip] ตะโกน ขณะที่ [local_1.GetSheHe] วิ่งผ่านข้าไป เราวิ่งหนีเข้าไปใน [task_contract_destination.GetTerrain.GetName|l] จนกระทั่งถึงที่ปลอดภัย\n\n"ข้าว่าท่านติดหนี้เราสองเท่านะ" [local_2.GetFirstNameNoTooltip] กล่าว ขณะยังพยายามหอบหายใจของ [local_2.GetHerHis] อยู่"
 ep3_contract_event.0007.desc_city_buy: ""ช่างเป็นข้อเสนอที่ใจกว้างเสียนี่กระไร! ได้โปรด รับ [newly_created_artifact.GetName] ไปเถิด! ยินดีที่ได้ทำธุรกิจกับท่าน!" [local_1.GetFirstName] ดูเหมือนจะท่วมท้นด้วยข้อเสนอของข้า\n\nบางที ข้าอาจต่อรองราคาที่ดีกว่านี้ได้...? คราวหน้า ข้าต้องอดทนมากกว่านี้..."
 ep3_contract_event.0007.desc_church_buy: ""ข้าเป็น [ROOT.Char.GetWomanMan] ของ [ROOT.Char.GetFaith.HighGodName] และมีเพียง [ROOT.Char.GetFaith.HighGodName] เท่านั้นที่ตัดสินข้าได้!" ข้าตะโกน โต้กลับ [local_1.GetFaith.PriestNeuter] อย่างแข็งกร้าว "แต่ข้าเสนอผลประโยชน์ทันทีให้ท่าน: เหรียญ!"\n\n"ท่านพยายามติดสินบนผู้รับใช้ของ [local_1.GetFaith.HighGodName] จริงๆ หรือ...?" [local_1.GetFirstName] ตอบ รู้สึกขุ่นเคืองในตอนแรก แต่ยิ่ง[local_1.GetSheHe]จ้องมองถุงเงินนานเท่าไหร่ มันก็ยิ่งดูน่าดึงดูดใจมากขึ้นเท่านั้น\n\n"เรา #EMP จำเป็น#! ต้องซ่อมหลังคาของ [task_contract_destination.Custom('GetLocationFaithTemple')] เอา [newly_created_artifact.GetName] ไป และอย่าพูดถึงข้อตกลงของเราอีก!""
 ep3_contract_event.0007.desc_castle_intimidate: "\"เจ้าคิดว่าเจ้าเป็นใคร?\" [local_1.GetFirstName] เยาะเย้ยอย่างอวดดี \"พวกเรามีจำนวนมากกว่าเจ้าสองต่อหนึ่ง!\"\n\n\"เจ้าแน่ใจรึ?\" ข้าตอบ พลางส่งสัญญาณให้คนของข้าล้อมพวกเขาไว้ \"เอาล่ะ ได้โปรด... เอา [newly_created_artifact.GetName] มาให้ข้า\"\n\nเราพบกันอีกครั้งในคืนถัดมา [local_1.GetFirstNameNoTooltip] และ [local_2.GetFirstName] ดูเหนื่อยล้าและพ่ายแพ้\n\n\"เราเกือบถูกจับได้ที่นั่น ข้าหวังว่าสิ่งประดิษฐ์นี้จะมีความหมายกับเจ้ามากนะ!\" คนหนึ่งกล่าว พลางยื่นรางวัลให้ข้าด้วยสีหน้าเจ็บปวด"
 ep3_contract_event.0007.desc_city_intimidate: "ข้าส่งสัญญาณให้ผู้ติดตามบุกเข้าไปในร้านค้าของพ่อค้า ที่ ซึ่งเราเอาชนะเจ้าของร้านที่อยู่คนเดียวได้อย่างรวดเร็ว\n\n"ได้โปรด ข้าเป็นแค่เสมียน! ข้ามีครอบครัวต้องเลี้ยงดู และร้านนี้คือทั้งหมดที่ข้ามี!" [local_1.GetFirstName] อ้อนวอน\n\n"[follower.GetFirstName] แสดงให้ [local_1.GetHerHim] เห็นว่าเราไม่ได้ล้อเล่น!" ข้าสั่งอันธพาลที่ข้าเลือก และ[follower.GetSheHe]เอื้อมมือไปหยิบชั้นวางที่ไม่มั่นคง ซึ่งเต็มไปด้วยสินค้าที่บอบบาง ทันทีที่[follower.GetSheHe]กำลังจะคว่ำเคาน์เตอร์ พ่อค้าก็โยน[local_1.GetHerselfHimself]ขวางทาง\n\n"ข้าขอร้อง หยุด! แค่เอาสิ่งที่ท่านต้องการไปแล้วก็ไปเสีย!""
 ep3_contract_event.0007.desc_church_intimidate: ""[follower.GetFirstName]! เราเจอคนหัวแข็งเข้าแล้ว!" ข้าเรียกผู้ติดตาม พวกเขากรูเข้าไปใน [task_contract_destination.Custom('GetLocationFaithTemple')]\n\n"ได้โปรด แสดงความเคารพบ้าง! ถอยไป!" [local_1.GetFirstName] อ้อนวอน แต่มันสายเกินไปแล้ว สหายของข้าถูกปล่อยออกมา ฉกฉวยเครื่องบูชา จวนเจียนจะขโมยและทำลายทุกสิ่งที่ทำได้ เห็นได้ชัดว่าสู้ไม่ได้และมีจำนวนน้อยกว่า [local_1.GetNameNoTooltip] จึงยอมจำนน\n\n"ก็ได้ ก็ได้! เอา [newly_created_artifact.GetName] ไป พวกนอกรีต! แต่ไว้ชีวิตสถานที่ศักดิ์สิทธิ์นี้ด้วย""
 ep3_contract_event.0007.desc_library: ""ขอบคุณสำหรับข้อเสนอ แต่บางทีท่านอาจรู้ว่าข้าจะหาคฤหาสน์ร้างหรือป้อมปราการที่ไม่ได้ใช้งานได้ที่ไหน...?" ข้าถาม ไม่นานก็โน้มน้าวให้ [local_1.GetFirstName] ชี้ทางไปยังห้องโถงที่ปรักหักพังอย่างไม่เต็มใจ\n\nเมื่อข้าก้าวเข้าไปข้างใน ข้าตกตะลึงอย่างสิ้นเชิงกับจำนวนตำราเก่าแก่ที่กระจัดกระจายอยู่ตามห้องที่เต็มไปด้วยใยแมงมุม ข้าใช้เวลาทั้งคืนค้นหาในสิ่งเหล่านี้ จากนั้น ลึกลงไปใต้ห้องใต้ดิน ข้าค้นพบแผนที่ที่เขียนด้วยลายมือ — บนนั้น เครื่องหมาย 'X' ระบุจุดใกล้เคียง!\n\nคนของข้าและข้าไปถึงที่นั่นตอนรุ่งสาง ไม่กี่พลั่วต่อมา [follower.GetFirstName] ก็เรียกข้า\n\n"หีบ! มันเต็มไปด้วยเหรียญ! และ นี่อะไร? มีบันทึกเรียกมันว่า "[newly_created_artifact.GetName]""
 ep3_contract_event.0007.desc_explore: "แทนที่จะพึ่งพา [local_1.GetFirstName] ปากพล่อยคนนั้นและข่าวลือแปลกๆ ข้าตัดสินใจย้อนกลับไปยังอาคารที่ดูเหมือนร้าง\n\nขั้นแรก เราฝ่าฟันสวนที่รกทึบของมัน จากนั้น เราทนกลิ่นอับชื้นของห้องต่างๆ อย่างน้อยเราก็แน่ใจได้ว่าสถานที่นั้นร้าง เพื่อครอบคลุมพื้นที่ให้เร็วที่สุด สหายของข้าจึงแยกย้ายกันไป หลังจากนั้นไม่นาน [follower.GetFirstName] ก็เรียกข้าไปที่ห้องนอนใหญ่:\n\n"นี่อยู่ใต้เตียง" [follower.GetSheHe] กล่าว พลางชี้ไปที่หีบขึ้นสนิม "เต็มไปด้วยเหรียญ! และนี่อาจเป็น — [newly_created_artifact.GetName]?""
 ep3_contract_event.0007.a: "ทำไมข้าจะไม่เอามันไว้เองล่ะ?"
 ep3_contract_event.0007.b: "ยอดเยี่ยม! ส่งมันไปให้ [task_contract_employer.GetTitledFirstNameNoTooltip]"
 ep3_contract_event.0007.castle: ""เดี๋ยวก่อน มันไม่ใช่อย่างนั้น ข้ายังอยู่กับพวกท่าน!""
 ep3_contract_event.0007.castle_buy: ""ตกลง แต่ก็ต่อเมื่อท่านเข้าร่วมกับข้า""
 ep3_contract_event.0007.city_city: "ข้าจะเอาทั้งหมด"
 ep3_contract_event.0008.t: "$contract_event_prefix$ $laamp_join_war_contract_contract$"
 ep3_contract_event.0008.desc: "กลุ่มทหารม้าเล็กๆ ที่อานม้ากัดแวะที่ค่ายของข้า และหนึ่งในผู้มาเยือนเหล่านี้เข้ามาในกระโจมใหญ่ของข้า\n\n"ข้าคือนายกองของหน่วยสอดแนม [task_contract_employer.GetPrimaryTitle.GetAdjective] เหล่านี้ และข้าพูดในนามของ [task_contract_employer.GetTitledFirstName] ของเรา" ทหารเริ่มกล่าว "เจ้าเหนือหัวของข้าสนใจในกลุ่มนักสู้เล็กๆ ที่แข็งแกร่งของท่าน"\n\n"[task_contract_war.Custom('WarCasusBelliShort')] ทำให้ [task_contract_employer.GetTitleAsNameNoTooltip] นอนไม่หลับ ศัตรูของเรากำลังต่อสู้อย่างดุเดือด — ดังนั้นข้าจึงถูกส่งมาจ้างดาบของท่าน! ท่านจะให้ [task_contract_employer.GetPrimaryTitle.GetNameNoTierNoTooltip] ยืมจิตวิญญาณนักสู้ของท่านหรือไม่?""
 ep3_contract_event.0008.a: "ฟังดูเป็นเหตุผลอันชอบธรรม! ข้าจะช่วยเหลือ [task_contract_employer.GetHerHim]"
 ep3_contract_event.0008.b: "$ep3_contract_event.0001.invalidate$"
