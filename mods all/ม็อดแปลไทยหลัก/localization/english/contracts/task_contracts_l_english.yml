 ep3_contract_event.0100.t: "$contract_event_prefix$ $laamp_help_find_secrets_contract_contract$"
 ep3_contract_event.0100.desc: "ข้าควรจะพบกับ [task_contract_councillor.GetCouncilTitleFirstName] ของ [task_contract_councillor_liege.GetNamePossessive] แต่เมื่อข้ามาถึง [task_contract_destination.GetName] [task_contract_destination.GetHolding.GetType.GetName|l] ดูเหมือนจะว่างเปล่า... ไม่มีใครอยู่เลย?\n\n"ท่านดูสับสนนะ นักผจญภัย" เสียงกระซิบดังมาจากเงามืด "ท่านเหมาะกับงานนี้จริงๆ หรือ? สิ่งที่เราต้องการคือคนที่ระแวดระวัง รอบคอบ แนบเนียน..."\n\nข้ามองไปรอบๆ อย่างตื่นตระหนก: เสียงดูเหมือนจะมาจากทิศทางที่ต่างกันใน แต่ละคำ\n\n"ท่านดูเหมือนจะไม่มีคุณสมบัติเหล่านั้นเลย..." เสียงนั้นกล่าว ขณะที่ [task_contract_councillor.GetNameNoTooltip] ปรากฏตัวขึ้นข้างหลังข้า"
 ep3_contract_event.0100.a: "โอ้ [task_contract_councillor.GetSheHe] เก่ง แต่ข้าทำได้ดีกว่า!"
