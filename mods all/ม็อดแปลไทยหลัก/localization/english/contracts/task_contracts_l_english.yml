 ep3_contract_event.0070.t: "$contract_event_prefix$ $laamp_join_faction_contract_contract$"
 ep3_contract_event.0070.desc: "กองกำลังติดอาวุธ ภายใต้ธงของ [task_contract_employer.GetName] มาเยี่ยมเยือนค่ายของข้า\n\n"คารวะท่าน [ROOT.Char.GetTitledFirstNameNoTooltip]! กล่าวกันว่าท่านสนใจในอุดมการณ์ของเรา ดังนั้นพวกเราจึงมาเพื่อพูดถึงศัตรูของเรา คือ [task_contract_target.Custom2('InsultAdjective', SCOPE.sC('task_contract_employer'))] [task_contract_target.GetName] ""
 ep3_contract_event.0070.desc_fallback_faction: "$ep3_contract_event.0070.desc$วิธีที่ [task_contract_target.GetSheHe] คลานอยู่ใต้ผิวหนังของข้าแผ่นดินของ [task_contract_target.GetHerHis] ฉีกกระชากเราจากภายใน! เราปรารถนาที่จะฉายแสงให้ [task_contract_target.GetHerHim] เห็น แสดงให้เห็นว่า [task_contract_target.GetHerHim] เป็นหนอนแมลงที่ชั่วช้าเพียงใด!"\n\n"ที่เลวร้ายไปกว่านั้น..."
 ep3_contract_event.0070.desc_liberty_faction: "$ep3_contract_event.0070.desc$[task_contract_target.GetSheHe|U] บีบคออาณาจักรของเรา; [task_contract_target.GetSheHe] รัดคอเหล่าขุนนางด้วยอำนาจที่สั่งสมมา!"\n\nมันเหลือทน! และ..."
 ep3_contract_event.0070.desc_independence_faction: "$ep3_contract_event.0070.desc$[task_contract_target.GetSheHe|U] เป็นเจ้าเหนือหัวที่ไร้ความสามารถ—ไม่คู่ควร! #EMP ไม่คู่ควร!#! พวกเราข้าแผ่นดินควรจะยืนหยัดด้วยตนเองจะดีกว่า\n\nยิ่งไปกว่านั้น..."
 ep3_contract_event.0070.desc_claimant_faction: "$ep3_contract_event.0070.desc$[task_contract_target.GetSheHe|U] เป็นผู้ปกครองที่ไม่คู่ควรและไม่ชอบธรรมของ [task_contract_faction.GetSpecialTitle.GetName] ความหวังของเราอยู่กับ [task_contract_faction.GetSpecialCharacter.GetName]: ผู้นำที่แท้จริง ผู้ [task_contract_faction.GetSpecialCharacter.Custom('PersonalityGetPositiveTraitDesc')] เท่าที่ [task_contract_faction.GetSpecialCharacter.GetSheHe] เป็น [task_contract_faction.GetSpecialCharacter.Custom('DescriptorPositiveStandalone')]!"\n\nและ [task_contract_target.GetTitledFirstNameNoTooltip]..."
 ep3_contract_event.0070.desc_nation_fracturing_faction: "$ep3_contract_event.0070.desc$ไม่เพียง แต่ [task_contract_target.GetSheHe] ไม่เหมาะกับมงกุฎ แต่ [task_contract_faction.GetSpecialTitle.GetName] ทั้งหมดก็เน่าเฟะถึงแก่น! เราเชื่อว่าไม่มีอะไรสามารถช่วยอาณาจักรที่ถูกสาปนี้ได้"\n\n"หนทางเดียวข้างหน้าคือการทำลายมันและสร้างขึ้นใหม่จากเถ้าถ่าน!"
 ep3_contract_event.0070.desc_liege_taxes: "ภาษีของ [task_contract_target.GetHerHis] บีบเค้นทุกเหรียญสุดท้ายจากข้าและประชาชนของข้า!""
 ep3_contract_event.0070.desc_liege_levies: "การเกณฑ์ทหารของ [task_contract_target.GetHerHis] เรียกแรงงานคนสุดท้ายจากทุ่งนาของข้า!""
 ep3_contract_event.0070.desc_liege_culture: "[task_contract_target.GetSheHe] เป็นชาว [task_contract_target.GetCulture.GetName] อย่างไม่ละอาย!""
 ep3_contract_event.0070.desc_liege_faith: "[task_contract_target.GetSheHe] เป็น [task_contract_target.GetFaith.GetAdherentName] อย่างแท้จริง!""
 ep3_contract_event.0070.desc_liege_fallback: "[task_contract_target.GetSheHe] เป็นคน [task_contract_target.Custom('DescriptorNegativeStandalone')]!""
 ep3_contract_event.0070.desc_outro: "[task_contract_employer.Custom('KnightCultureNoTooltip')|l] ผู้นำถ่มน้ำลาย ยื่นมือออกมา "ท่านจะเข้าร่วมกับเราหรือไม่?""
 ep3_contract_event.0070.a: "ข้าต้องการที่ดินส่วนหนึ่งของ [task_contract_target.GetFirstNamePossessiveNoTooltip]!"
 ep3_contract_event.0070.b: "เป็นอุดมการณ์ที่ชอบธรรมโดยแท้!"
 ep3_contract_event.0080.t: "$contract_event_prefix$ $laamp_help_fabricate_claim_contract_contract$"
 ep3_contract_event.0080.desc: "ค่ายของข้าได้รับเกียรติจากการมาเยือนของ [task_contract_councillor.GetCouncilTitleFirstName] แห่ง [task_contract_councillor_liege.GetPrimaryTitle.GetNameNoTier]\n\n"คารวะ [ROOT.Char.GetTitledFirstNameNoTooltip] ท่านดูเป็น [ROOT.Char.GetWomanMan] ที่มีไหวพริบ... เนื่องจากท่านสืบรู้แล้วว่าแท้จริงแล้วเรากำลังทำอะไรกันอยู่ลับๆ" [task_contract_councillor.GetFirstNameNoTooltip] วางมือของ [task_contract_councillor.GetHerHis] บนไหล่ข้า "ท่านเห็นไหม [task_contract_target.GetName]... [task_contract_target.GetSheHe] เป็นผู้ชิงบัลลังก์ ข้ารู้เรื่องนั้น [task_contract_employer.GetTitledFirstNameNoTooltip] รู้เรื่องนั้น และท่านก็รู้เรื่องนั้น" [task_contract_councillor.GetSheHe|U] ตบหน้าอกข้า\n\n"สมมติว่าท่านบังเอิญ #EMP พบ#! หลักฐานการอ้างสิทธิ์ตามบรรพบุรุษของเจ้าเหนือหัวข้า? ท่านจะบอกให้ทุกคนรู้ #EMP ความจริง#! หรือไม่?"
 ep3_contract_event.0080.open_start_generate_claim_interaction: "เปิด [character_interaction|E] เพื่อเริ่ม [scheme|E] [GetScheme('generate_claim').GetTypeName]"
 ep3_contract_event.0080.a: "ให้ข้าดูว่าข้าทำอะไรได้บ้าง"
 ep3_contract_event.0082.t: "$contract_event_prefix$ $laamp_fight_faith_conversion_contract_contract$"
 ep3_contract_event.0082.desc: "คณะผู้แทนของ [task_contract_employer.GetFaith.GetAdherentNamePluralNoTooltip] ผู้ศรัทธามาเยี่ยมค่ายของข้า นำเสนอคำร้องขอที่ปลุกเร้าเลือดลม\n\n"โอ้ ท่าน [ROOT.Char.GetTitledFirstNameNoTooltip] ผู้ยิ่งใหญ่!" พวกเขากล่าว "เราเป็นเพียงกลุ่ม [task_contract_employer.GetFaith.DevoteeNeuterPlural] ที่ยากจน "ทั้งวันทั้งคืน เราถูกรังควานโดยมิชชันนารีที่ส่งมาจาก [task_contract_councillor_liege.GetCapitalLocation.GetName] โดย [task_contract_councillor_liege.GetTitledFirstName]! เราถูกบังคับให้หนีมาที่นี่— เพราะในบ้านของเรา [task_contract_councillor.GetCouncilTitleFirstName] [task_contract_councillor.GetHerselfHimself] กระทำการชั่วร้าย! [task_contract_councillor.GetSheHe|U] บังคับเปลี่ยนศาสนาผู้ที่ [task_contract_councillor.GetSheHe] จับตัวได้!"\n\nผู้ลี้ภัยที่ซอมซ่อคุกเข่าลงด้วยความสิ้นหวัง\n\n"ในนามของ [task_contract_employer.GetTitledFirstNamePossessive]—ในนามแห่ง [task_contract_employer.GetFaith.HighGodNamePossessive]—โปรดช่วยเราด้วย!""
 ep3_contract_event.0082.a: "ข้าจะพยายามหยุดยั้ง [task_contract_councillor.GetCouncilTitleFirstNameNoTooltip]!"
 ep3_contract_event.0082.b: "ข้าจะพูดคุยกับ [task_contract_councillor_liege.GetTitledFirstNameNoTooltip] ใน [task_contract_councillor_liege.GetCapitalLocation.GetNameNoTooltip] เมืองหลวงของ [task_contract_councillor_liege.GetHerHis]"
 ep3_contract_event.0082.to_destination: "ท่านจะเดินทางไปยัง [task_contract_destination.GetName] เพื่อหยุดยั้งงานเผยแผ่ศาสนาของ [task_contract_target.GetCouncilTitleFirstNamePossessive]"
 ep3_contract_event.0082.to_liege: "ท่านจะเดินทางไปยัง [task_contract_councillor_liege.GetName] เพื่อโน้มน้าวให้ [task_contract_councillor_liege.GetHerHim] เรียกตัว [task_contract_councillor.GetCouncilTitleFirstName] กลับ"
 ep3_contract_event.0083.t: "$ep3_contract_event.0082.t$"
 ep3_contract_event.0083.desc: "เรามาถึง [task_contract_destination.GetName] ขณะที่ [task_contract_employer.GetName] ก้าวเข้าไปใน [task_contract_destination.Custom('GetLocationFaithTemple')] ของ [task_contract_employer.GetHerHis] เสียงกรีดร้องด้วยความโศกเศร้าดังออกมาจากก้นบึ้งหัวใจของ [task_contract_employer.GetHerHis]!\n\n"#EMP ทุกอย่างพังพินาศ!#! [task_contract_employer.GetFaith.ReligiousSymbol] ถูกขโมย! [task_contract_employer.GetFaith.ReligiousSymbol2] ถูกเหยียบย่ำลงกับพื้น! ข้าอยากจะกรีดร้องทุกคำใน [task_contract_employer.GetFaith.ReligiousText] ออกมา! ใครกันช่างกล้ารื้อค้นสถานที่แห่งนี้และจุดไฟเผา? ใครเล่า นอกจากไอ้ [task_contract_councillor.Custom('InsultAdjective')] [task_contract_councillor.GetTitledFirstName]!"\n\n"ท่านเข้าใจแล้วใช่ไหม [ROOT.Char.GetTitledFirstNameNoTooltip]!" [task_contract_employer.GetFirstNameNoTooltip] ชี้ไปที่ [task_contract_employer.GetFaith.ReligiousSymbol3] ที่ถูกลบหลู่ "เราไม่อาจใช้ชีวิต เช่นนี้ได้อีกต่อไป!""
 ep3_contract_event.0083.a: ""มากำจัด [task_contract_councillor.GetNameNoTooltip] ออกไปกันเถอะ""
 ep3_contract_event.0083.b: ""[task_contract_councillor.GetNameNoTooltip] จะเข้าใจ แต่เพียงอำนาจเท่านั้น""
 ep3_contract_event.0083.c: ""แน่นอน ข้าสามารถใช้เหตุผลกับ [task_contract_councillor.GetFaith.PriestNeuter] ชาว [task_contract_councillor.GetFaith.GetAdjectiveNoTooltip] ได้?""
 ep3_contract_event.0083.d: "หนีไป [task_contract_employer.GetFirstNameNoTooltip]! ท่านปลอดภัยเมื่ออยู่กับข้า"
 ep3_contract_event.0083.a_win: "ท่านจับกุม [task_contract_councillor.GetCouncilTitleFirstNameNoTooltip] ได้สำเร็จ"
 ep3_contract_event.0083.a_lose: "ท่านล้มเหลวในการจับกุม [task_contract_councillor.GetCouncilTitleFirstNameNoTooltip]"
 ep3_contract_event.0083.b_win: "ท่านข่มขู่ [task_contract_councillor.GetCouncilTitleFirstNameNoTooltip] ได้สำเร็จ"
 ep3_contract_event.0083.b_lose: "ท่านล้มเหลวในการข่มขู่ [task_contract_councillor.GetCouncilTitleFirstNameNoTooltip]"
 ep3_contract_event.0083.c_win: "ท่านเจรจาการอยู่ร่วมกันอย่างสันติกับ [task_contract_councillor.GetCouncilTitleFirstNameNoTooltip] ได้สำเร็จ"
 ep3_contract_event.0083.c_lose: "ท่านแพ้การโต้วาทีกับ [task_contract_councillor.GetCouncilTitleFirstNameNoTooltip]"
 ep3_contract_event.0084.t: "$ep3_contract_event.0082.t$"
 ep3_contract_event.0084.desc: "หลังจากดึงเชือกสร้างความวุ่นวายใน [task_contract_destination.GetName] ข้าก็สามารถเข้าเฝ้า [task_contract_councillor_liege.GetName] ได้สำเร็จ\n\n"[task_contract_councillor_liege.GetTitleAsNameNoTooltip]!" ข้ากล่าว "ในนามของ [task_contract_employer.GetTitledFirstName] และเหล่า [task_contract_employer.GetFaith.GetAdherentNamePlural] ในดินแดนของท่าน ข้ามาเข้าเฝ้าท่าน [task_contract_councillor.GetCouncilTitleFirstName] ของท่านได้กระทำการอันน่ารังเกียจต่อชุมชนของพวกเขา และสมควรได้รับการลงโทษ! ความยุติธรรม เช่นนี้มิใช่หนทางแห่ง [task_contract_councillor_liege.GetFaith.HighGodName] ของท่านหรอกหรือ?"\n\n[task_contract_councillor_liege.GetTitledFirstNameNoTooltip] ขมวดคิ้ว\n\n"จริงแท้ ข้าไม่ใช่ทรราชย์ ข้าจะรับฟังคำร้องของท่านอย่างเต็มที่ และหลังจากนั้นข้าจึงจะตัดสินชะตากรรมของ [task_contract_councillor.GetCouncilTitle] ของข้าและเหล่า [task_contract_employer.GetFaith.GetAdherentNamePluralNoTooltip] ทั้งหมดในอาณาจักรของข้า""
 ep3_contract_event.0084.a: "เหล่า [task_contract_employer.GetFaith.GetAdherentNamePluralNoTooltip] ควรปกครองตนเอง"
 ep3_contract_event.0084.a_win_rights: "แด่ [task_contract_employer.GetFirstNameNoTooltip]: [task_contract_destination.GetCounty.GetTitle.GetNameNoTierNoTooltip] และสิทธิ์ในการคุ้มครอง"
 ep3_contract_event.0084.a_win_rights.tt: "ได้รับ [obligation|E] [GetSubjectContractType( 'religious_rights' ).GetObligationName( 'religious_rights_protected' )]"
 ep3_contract_event.0084.a_win: "[task_contract_employer.GetTitledFirstNameNoTooltip] ได้รับ [task_contract_destination.GetCounty.GetTitle.GetNameNoTooltip]"
 ep3_contract_event.0084.a_lost: "ท่านโน้มน้าว [task_contract_councillor_liege.GetTitledFirstNameNoTooltip] ไม่สำเร็จ"
 ep3_contract_event.0084.b: "ประชาชนของท่านควรเรียนรู้ที่จะอยู่ร่วมกัน"
 ep3_contract_event.0084.b_win: "[task_contract_councillor_liege.GetTitledFirstNameNoTooltip] จะหยุดพยายามเปลี่ยนศาสนา [task_contract_destination.GetCounty.GetTitle.GetNameNoTierNoTooltip]"
 ep3_contract_event.0084.b_lost: "$ep3_contract_event.0084.a_lost$"
 ep3_contract_event.0085.t: "$contract_event_prefix$ $laamp_help_faith_conversion_contract_contract$"
 ep3_contract_event.0085.desc: "[task_contract_destination.GetName] คือ"
 ep3_contract_event.0085.desc_good: "[task_contract_destination.GetName] ดูค่อนข้างเงียบสงบนับตั้งแต่ข้ามาถึง ข้าเห็น [task_contract_councillor.GetCouncilTitleFirstName] ของ [task_contract_councillor_liege.GetNamePossessive] ถูกรายล้อมไปด้วยกลุ่ม [task_contract_destination.County.GetFaith.GetAdherentNamePlural] ท้องถิ่น\n\n"คารวะ ท่านผู้เดินทาง! ข้ากำลังจะท่องบางอย่างจาก [task_contract_councillor.GetFaith.ReligiousText] ให้เหล่าสาวกของข้าฟัง" [task_contract_councillor.GetSheHe|U] ชี้ไปที่ชาวบ้าน "บางทีท่านอาจชี้แนะนิทานเปรียบเทียบที่ท่านชื่นชอบให้เราได้?""
 ep3_contract_event.0085.desc_bad: "ใน [task_contract_destination.GetName], [task_contract_destination.Custom('GetLocationFaithTemple')] ท้องถิ่นกำลังลุกเป็นไฟ! ข้าพบ [task_contract_councillor.GetCouncilTitleFirstName] ของ [task_contract_councillor_liege.GetNamePossessive] อยู่บริเวณชานเมือง; [task_contract_councillor.Custom('WomenMenPeople_GenderPreference')] ของ [task_contract_councillor.GetHerHis] มีศีรษะของชาว [task_contract_destination.County.GetFaith.GetName] เสียบอยู่บนปลายดาบ\n\n"อา มาทันเวลาพอดี! พวกชาวนาเหล่านั้นไม่เคารพนักเทศน์ของเรา ดังนั้นเราจึงตัดสินใจแสดงให้พวกเขาเห็นถึงพลังที่แท้จริงของ [task_contract_councillor.GetFaith.HighGodName]" [task_contract_councillor.GetTitledFirstNameNoTooltip] กำลังเพลิดเพลินกับ [task_contract_councillor.GetHerselfHimself] อย่างเห็นได้ชัด\n\n"ได้โปรด เมตตาด้วย!" ผู้รอดชีวิตอ้อนวอน "เราเป็นเพียง [task_contract_destination.County.GetFaith.DevoteeNeuterPlural] ที่เรียบง่าย เราไม่มีเจตนาร้าย: โปรดปล่อยให้เราอยู่อย่างสงบ!""
 ep3_contract_event.0085.a: "นี่มันบ้าไปแล้ว ต้องหยุด [task_contract_councillor.GetTitledFirstNameNoTooltip] ให้ได้!"
 ep3_contract_event.0085.a_win_critical: "ท่านจับกุม [task_contract_councillor.GetTitledFirstNameNoTooltip] ได้สำเร็จ"
 ep3_contract_event.0085.a_win: "ท่านขับไล่มิชชันนารีทั้งหมดไปได้"
 ep3_contract_event.0085.a_lose: "ท่านล้มเหลวในการจับกุม [task_contract_councillor.GetTitledFirstNameNoTooltip] และสัญญา"
 ep3_contract_event.0085.b: "ข้าคิดว่าข้าจะ #EMP เพลิดเพลิน#! กับงานเผยแผ่ศาสนานี้"
 ep3_contract_event.0085.c: "ข้าจะสอนพวกเขาเกี่ยวกับ [task_contract_councillor.GetFaith.GoodGodNames]"
 ep3_contract_event.0085.c_win: "พวกเขาเข้าใจนิทานเปรียบเทียบ"
 ep3_contract_event.0085.c_lose: "พวกเขาพลาดประเด็นสำคัญของเรื่อง"
 ep3_contract_event.0085.d: "ข้าจะเตือนพวกเขาเกี่ยวกับ [task_contract_councillor.GetFaith.EvilGodNames]!"
 ep3_contract_event.0085.d_win: "พวกเขาเข้าใจนิทานเปรียบเทียบ"
 ep3_contract_event.0085.d_lose: "พวกเขาหวาดกลัว [task_contract_councillor.GetFaith.EvilGodName]"
 ep3_contract_event.0090.t: "$contract_event_prefix$ ครูฝึกของ [task_contract_employer.Custom('KnightCulturePluralNoTooltip')]"
 ep3_contract_event.0090.desc: "เมื่อข้ามาถึง ข้าได้รับการต้อนรับจาก [task_contract_councillor.GetCouncilTitleFirstName] ของ [task_contract_councillor_liege.GetNamePossessive]\n\n"ข้ายินดีที่ท่านมาได้ เรากำลังต้องการผู้เชี่ยวชาญด้านการสงคราม เนื่องจากผู้บัญชาการของเราค่อนข้างขาดการศึกษา" [task_contract_councillor.GetCouncilTitleFirstNameNoTooltip] ก้มศีรษะของ [task_contract_councillor.GetHerHis] และกล่าวเสริมอย่างรวดเร็ว: "อย่างน้อย... ตามที่เจ้าเหนือหัวของเรากล่าว"\n\n"เอาล่ะ ข้ายินดีที่จะเชิญท่านเข้ามา แต่ [task_contract_councillor_liege.GetTitleAsNameNoTooltip] ของข้าคาดหวังให้ท่านเริ่มการฝึกทันที เลือกผู้ใดก็ได้ที่ท่านต้องการและให้พวกเขาติดอาวุธ""
 ep3_contract_event.0090.a: "ให้ข้าดู [task_contract_councillor_liege.Custom('WomenMenPeople_GenderPreference')] เหล่านั้น!"
 ep3_contract_event.0090.opens_task_contract_train_knight_interaction: "เปิด $task_contract_train_knight_interaction$ [character_interaction|E]"
 ep3_contract_event.0091.t: "$ep3_contract_event.0090.t$"
 ep3_contract_event.0091.desc: "เพื่อที่จะรู้ว่าข้ากำลังรับมือกับอะไร ข้าเชิญ [knight.GetName] มาประลองกับ"
 ep3_contract_event.0091.desc_me: "ข้า\n\n"เราตั้งท่า รอจังหวะเปิดช่อง"
 ep3_contract_event.0091.desc_me_high_prowess: "[knight.GetFirstNameNoTooltip] โจมตีก่อน เป็นการโจมตีต่อเนื่องด้วย [knight.Custom('signature_weapon')] ของ [knight.GetHerHis] ข้าไม่ทันตั้งตัว: ข้าพยายามตั้งหลักและตอบโต้ด้วยการโจมตีของข้าเองสองสามครั้ง อย่างไรก็ตาม [knight.GetSheHe] ปัดป้อง [ROOT.Char.Custom('signature_weapon')] ของข้าได้อย่างง่ายดาย""
 ep3_contract_event.0091.desc_me_low_prowess: "การป้องกันของ [knight.GetFirstNamePossessiveNoTooltip] อ่อนลงก่อน เปิดช่องให้การโจมตีสองสามครั้ง แต่แม่นยำจาก [helper.Custom('signature_weapon')] ของข้า เห็นได้ชัดว่า [knight.GetSheHe] ไม่ใช่คู่ต่อสู้ของข้า""
 ep3_contract_event.0091.desc_helper: "[helper.GetName]\n\n"พวกเขาตั้งท่า รอจังหวะเปิดช่อง""
 ep3_contract_event.0091.desc_high_prowess: "[knight.GetNameNoTooltip] โจมตีก่อน เป็นการโจมตีต่อเนื่องใส่ [helper.GetFirstNameNoTooltip] ด้วย [knight.Custom('signature_weapon')] ของ [knight.GetHerHis] [helper.GetFirstNameNoTooltip] ดูหมดหนทาง เห็นได้ชัดว่าสู้ศัตรูไม่ได้""
 ep3_contract_event.0091.desc_low_prowess: "การป้องกันของ [knight.GetFirstNamePossessiveNoTooltip] อ่อนลงก่อน เปิดช่องให้การโจมตีสองสามครั้ง แต่แม่นยำจาก [helper.Custom('signature_weapon')] ของ [helper.GetFirstNamePossessive] [knight.GetSheHe|U] มีปัญหาแม้กระทั่งการยืน ดูเหมือนว่านี่จะเป็นบทเรียนที่ค่อนข้างยาวนาน...""
 ep3_contract_event.0091.desc_outro: "\n\nข้าหยุดการประลองก่อนที่มันจะนองเลือด "ขอบคุณสำหรับความพยายามของท่าน [knight.GetFirstNameNoTooltip] ข้าเห็นเพียงพอแล้วที่จะรู้ว่าจะดำเนินการสอนท่านต่อไปอย่างไร""
 ep3_contract_event.0091.a: "ข้าเองก็อยากได้คนแบบนี้!"
 ep3_contract_event.0091.b: "การสอน [trait_to_teach.GetNameNoTooltip( ROOT.Char )] ให้ [knight.GetHerHim] น่าจะง่าย!"
 ep3_contract_event.0091.c: ""[helper.GetFirstNameNoTooltip] ให้บทเรียนส่วนตัวแก่ [knight.GetHerHim]""
 ep3_contract_event.0091.d: "[knight.GetFirstNameNoTooltip] ควรทำตามการเคลื่อนไหวของข้า"
