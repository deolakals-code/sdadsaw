 #Conclusion
 laamp_base_learning_contract_events.4017.t: "$laamp_base_learning_contract_events_prefix.4011$: บทสรุป"
 laamp_base_learning_contract_events.4017.desc.success.critical: "[employer.GetTitledFirstName] แทบจะเต้นรำเข้ามาในห้องเมื่อข้ากลับมา: "#EMP ยอดเยี่ยม!#! แกะหลงทางกลับสู่คอก; ทั้งหมดเลย แม้ แต่ [mentioned_disputee.GetFirstName] ที่น่ารำคาญนั่น..."\n\n[employer.GetSheHe|U] หันไปหยิบถุงที่หนักอึ้งด้วยเหรียญ และยื่นให้ทันที: "ท่านสมควรได้รับทุกส่วนของสิ่งนี้ ท่านทำได้ ขอบคุณ และแจ้งให้ข้าทราบ หากเส้นทางของท่านนำท่านมายัง [employer.GetCapitalLocation.GetTitle.GetNameNoTierNoTooltip] อีกครั้ง!"\n\nข้ายิ้มและพยักหน้า"
 laamp_base_learning_contract_events.4017.desc.success.standard: "[employer.GetTitledFirstName] พยักหน้าอย่างสุขุมและเม้มริมฝีปากของ [employer.GetHerHis]: "งานสำเร็จลุล่วงไปด้วยดี ส่วนใหญ่ส่งจดหมายมาหาข้าเกี่ยวกับข้อพิพาทของเรา โดยระบุความถูกต้องของข้าในเรื่องนี้"\n\n[employer.GetSheHe|U] ลังเลครู่หนึ่ง แล้วเสริมว่า: "ข้าไม่สงสัยเลยว่าที่เหลือจะเปลี่ยนใจ ข้า #EMP ถูกต้อง#! อยู่แล้ว"\n\nข้าพยักหน้าอย่างสุภาพและหันหลังกลับเพื่อจากไป"
 laamp_base_learning_contract_events.4017.desc.success.qualified: "[employer.GetTitledFirstName] ขมวดคิ้วเมื่อข้ากลับมาถึง [employer.GetCapitalLocation.GetTitle.GetNameNoTierNoTooltip]: "อืม นี่พอรับได้ แม้ว่าข้าอาจจะคาดหวังมากกว่านี้เล็กน้อย"\n\n[employer.GetSheHe|U] หันกลับไป พึมพำกับ [employer.GetHerselfHimself]: "บางทีคนต่อไปอาจจะทำได้ดีกว่า..."\n\nเมื่อตระหนักถึงการมีอยู่ของข้าต่อไป [employer.GetSheHe] ชี้ไปที่กระเป๋าบาง ๆ ข้างประตู: "เอาล่ะ เชิญตามสบาย ข้าเชื่อว่าท่านจะหาทางออกเจอ""
 laamp_base_learning_contract_events.4017.desc.failure: "[employer.GetTitledFirstName] เยาะเย้ยเมื่อข้าเข้าห้อง: "โอ้ ท่านอุตส่าห์กลับมา? หลังจากแสดงผลงานที่ย่ำแย่ เช่นนี้?"\n\n[employer.GetSheHe|U] ส่ายหน้าของ [employer.GetHerHis] อย่างไม่ใส่ใจ: "ท่านรู้เรื่องแรกเกี่ยวกับ [employer.GetFaith.GetNameNoTooltip] หรือไม่? โชคดีที่มันไม่ได้กล่าวถึงการจัดการกับ #EMP คนโง่เง่า#! "\n\n[employer.GetSheHe|U] หันหลังกลับเพื่อจากไป และข้าอ้อยอิ่งอยู่ครู่หนึ่งก่อนจะเดินไปตามโถงทางเดิน มองหาทางออก"
 laamp_base_learning_contract_events.4017.a: ""พิจารณาสิ่งนี้: ข้าได้หว่านเมล็ดพันธุ์แห่งความสงสัยแล้ว""
 laamp_base_learning_contract_events.4017.a.tt: "พวกเขาจะกลับสู่คอก ข้า #EMP รู้#! "
 laamp_base_learning_contract_events.4017.a.success.tt: "[employer.GetShortUIName] ถูกโน้มน้าว"
 laamp_base_learning_contract_events.4017.a.failure.tt: "ท่านไม่สามารถโน้มน้าว [employer.GetShortUIName] ได้"
 laamp_base_learning_contract_events.4017.b.success_critical: ""[employer.GetFaith.HighGodNameAlternate] นำทางข้า""
 laamp_base_learning_contract_events.4017.b.success_standard: ""ใช้แรงผลักดันเพียงเล็กน้อย""
 laamp_base_learning_contract_events.4017.b.success_qualified: ""ข้ามั่นใจว่าพวกเขาจะเปลี่ยนใจ""
 laamp_base_learning_contract_events.4017.b.failure_standard: "$laamp_base_learning_contract_events.4005.a.failure_standard$"

 #Create a work of learning for a ruler
 laamp_base_4021_request: "[task_contract|E] นี้ต้องการให้ท่านสร้างต้นฉบับสำหรับ [TaskContract.GetEmployer.GetTitleAsNameNoTooltip] แห่ง [TaskContract.GetEmployer.GetPrimaryTitle.GetNameNoTier] ส่วนใหญ่ผ่านการท้าทาย [skill|E] ด้าน [learning|E] แต่ยังอาจ รวมถึงการท้าทายใน [skills|E] อื่น ๆ ที่เกี่ยวข้อง [lifestyle_traits|E] และประสบการณ์ [travel|E]"
 laamp_base_learning_contract_events_prefix.4021: "ต้นฉบับ"
 laamp_base_learning_contract_events.4021.t: "$laamp_base_learning_contract_events_prefix.4021$: อะไรอยู่ในงานเขียน"
 laamp_base_learning_contract_events.4021.desc: "ข้าฮัมเพลงขณะมองไปรอบ ๆ ห้องทำงานของ [employer.GetTitledFirstNamePossessive] มีต้นฉบับ บทคัดย่อ และเรื่องสั้นมากมายรวมอยู่ที่นี่ ในกองที่เป็นระเบียบและเรียงรายอยู่บนชั้นวาง\n\nงานเขียนไม่จำเป็นต้องตัดสินด้วยความยาวเสมอไปใช่ไหม? แม้ แต่การเอ่ยถึงคำเดียวก็สามารถกระตุ้นอารมณ์ที่ซับซ้อนได้\n\nแต่ก่อนอื่น: ข้ามีความสามารถในการสร้างงานเขียนขนาดไหน?"
 laamp_base_learning_contract_events.4021.a: "ทำให้มันเรียบง่ายดีกว่า"
 laamp_base_learning_contract_events.4021.a.tt: "ตกลงที่ #V 3#! บท"
 laamp_base_learning_contract_events.4021.b: "งานสร้างสรรค์ของข้าจะ #EMP ครอบคลุม#!."
 laamp_base_learning_contract_events.4021.b.tt: "มุ่งสู่ #V 5#! บท\n$EFFECT_LIST_BULLET$โอกาสเพิ่มเติมที่จะได้รับคะแนน [skill|E] ในบทสุดท้าย"
 laamp_base_learning_contract_events.4021.tt.chapter_explanation: "#TUT ยิ่งมีบทมาก ท่านจะเผชิญกับความท้าทายมากขึ้น รางวัลจะซ้อนทับกัน แต่ความยากก็จะเพิ่มขึ้นด้วย#! "
 laamp_base_learning_contract_events.4021.tt.explanation: "#TUT เพื่อทำ [task_contract|E] ให้สำเร็จ:\n$EFFECT_LIST_BULLET$ทำความท้าทายด้าน [learning|E] ให้สำเร็จ, ความท้าทายรวมใน [skill|E] อื่นที่เกี่ยวข้อง หรือดึงจากประสบการณ์ [traveling|E] ของท่าน\n$EFFECT_LIST_BULLET$ชนะหนึ่งในสามของการท้าทายของท่านเพื่อ #P ความสำเร็จตามเกณฑ์#!\n$EFFECT_LIST_BULLET$ชนะสองในสามของการท้าทายของท่านเพื่อ #P ความสำเร็จ#! ธรรมดา\n$EFFECT_LIST_BULLET$ชนะการท้าทายทั้งหมดของท่านเพื่อ #P ความสำเร็จอันยอดเยี่ยม#!#!"

 laamp_base_learning_contract_events.4025.t.first: "$laamp_base_learning_contract_events_prefix.4021$: จุดเริ่มต้นอันถ่อมตน"
 laamp_base_learning_contract_events.4025.t.last: "$laamp_base_learning_contract_events_prefix.4021$: บทสุดท้าย"
 laamp_base_learning_contract_events.4025.t: "$laamp_base_learning_contract_events_prefix.4021$: บทต่อไป"
 #Intro
 laamp_base_learning_contract_events.4025.desc.intro.first: "ข้าจ้องมองหน้ากระดาษเปล่าตรงหน้า #EMP คำพูด#! ทำไมการเริ่มต้นถึงยากเสมอ?"
 laamp_base_learning_contract_events.4025.desc.intro.final_shot: "เช็ดเม็ดเหงื่อออกจากหน้าผาก จิตใจของข้ายังคงหมุนวน งานของข้าใกล้จะเสร็จสมบูรณ์แล้ว — แต่ข้าทำได้ดีแค่ไหน? สิ่งนี้นำเสนอได้หรือไม่? "
 laamp_base_learning_contract_events.4025.desc.intro.last: "อ่านลายมือขีดเขียนของข้า ข้าเปล่งเสียงคำรามอย่างพอใจ ตรงประเด็นและกระชับ สิ่งนี้น่าจะ ทำให้ [employer.GetTitledFirstName] พอใจได้ใช่ไหม?"
 laamp_base_learning_contract_events.4025.desc.intro.inspiration: "ความคิดหนึ่งผุดขึ้นมาในใจข้า [SCOPE.Custom('GetInspirationTopic')|U] มันไม่ยากเลยใช่ไหม? ยิ่งข้าคิดถึงมันมากเท่าไหร่ ข้าก็ยิ่งรู้สึกได้รับแรงบันดาลใจที่จะแบ่งปันความรู้ของข้าในเรื่องนี้มากขึ้นเท่านั้น"
 laamp_base_learning_contract_events.4025.desc.intro.01: "หลังจากนั้นครู่หนึ่ง ขณะที่ข้าเข้าที่เข้าทาง ข้าพบว่าตัวเองกำลังขีดเขียนไปเรื่อย ๆ เติมหน้าแล้วหน้าเล่าด้วยความคิดและข้อสังเกตที่เกี่ยวข้องกับ [SCOPE.Custom('GetLatestTopic')]"
 laamp_base_learning_contract_events.4025.desc.intro.02: "ขณะที่ข้านั่งเขียน ข้าเพลิดเพลินกับเสียงนกร้องอันไพเราะ ซึ่งดังมาจากสวนอันงดงามของ [employer.GetCapitalLocation.GetTitle.GetNameNoTierNoTooltip]"
 laamp_base_learning_contract_events.4025.desc.intro.03: "เวลาผ่านไปอย่างรวดเร็วขณะที่ข้านั่งข้างแท่นอ่าน บันทึกข้อสังเกตและมุมมองเล็ก ๆ น้อย ๆ ของข้าเกี่ยวกับ [SCOPE.Custom('GetLatestTopic')]"
 #Mid
 laamp_base_learning_contract_events.4025.desc.first: "[ROOT.Char.Custom('WritingInstrument')] ลูบคางของข้าเบา ๆ ข้าครุ่นคิดอย่างรอบคอบว่าต้นฉบับควรเกี่ยวกับอะไร"
 laamp_base_learning_contract_events.4025.desc.final_shot: "แสงตะวันจางหายไปข้างนอกขณะที่ข้านั่งใต้แสงเทียน ตอนนี้รู้สึกหนาวเย็นอย่างเห็นได้ชัด เหลือเพียงความคิดเรื่องความไม่เพียงพอของตัวเอง แม้ แต่อาหารชิ้นเล็กชิ้นน้อยที่มาบ่อย ๆ ก็ไม่ ทำให้อารมณ์ของข้าดีขึ้น"
 laamp_base_learning_contract_events.4025.desc.last: "จานซ้อนกันสูงขึ้นเรื่อย ๆ ขณะที่ข้าเพลิดเพลินกับเศษเสี้ยวสุดท้ายของการต้อนรับ บัดนี้เมื่องานของข้าที่นี่ใกล้จะสิ้นสุดลงแล้ว คนรับใช้ตระหนี่เรื่องอาหารมากขึ้นหรือเปล่า หรือข้าคิดไปเอง...?"
 laamp_base_learning_contract_events.4025.desc.01: "แสงตะวันจางหายไปข้างนอกและข้านั่งใต้แสงเทียนในห้องทำงานของ [employer.GetTitledFirstNamePossessive] เพลิดเพลินกับการต้อนรับที่มาพร้อมกับการเป็นอาลักษณ์ทำงาน"
 laamp_base_learning_contract_events.4025.desc.02: "คนรับใช้แวะมาเป็นครั้งคราว ทำความสะอาดห้องอย่างเงียบ ๆ หรือจัดหาอาหารชิ้นเล็กชิ้นน้อย; แต่ระมัดระวังอย่างยิ่งที่จะเงียบและปิดประตูอย่างระมัดระวังระหว่างทางออกไป"
 laamp_base_learning_contract_events.4025.desc.03: "นาน ๆ ครั้ง เมื่อไม่ได้ออกไปข้างนอก [employer.GetTitledFirstName] จะโผล่ศีรษะของ [employer.GetHerHis] เข้ามาในห้องทำงาน จ้องมองหน้ากระดาษที่เปื้อนหมึกของความคืบหน้าของข้า [employer.GetSheHe|U] ฮัมเพลงแล้วจากไป ดูเหมือนยุ่งอยู่กับเรื่องสำคัญกว่า"
 #Outro
 laamp_base_learning_contract_events.4025.desc.outro.first.has_topic: "[employer.GetTitledFirstName] ต้องการคัมภีร์ที่เกี่ยวข้องกับ [SCOPE.Custom('GetPreferedTopic')] ประเด็นที่ถูกต้องสำหรับข้าที่จะพิจารณา ตอนนี้ ข้าจะเริ่มจากตรงไหน..."
 laamp_base_learning_contract_events.4025.desc.outro.first.no_topic: "ปล่อยให้สายตาของข้ากวาดไปทั่วห้องอีกครั้ง ข้าค้นหาในใจเพื่อหาหัวข้อที่เหมาะสมที่จะเริ่มต้นบทของข้าด้วย..."
 laamp_base_learning_contract_events.4025.desc.outro.final_shot: "ข้าครุ่นคิดเรื่องนี้ แล้วยืดตัวตรงเล็กน้อย ข้ามีสองทางเลือก — ยอมรับข้อบกพร่องของข้า หรือ — ข้าพองอก — ข้าพยายามครั้งสุดท้าย #EMP อย่างเหมาะสม#! "
 laamp_base_learning_contract_events.4025.desc.outro.01: "เมื่อยอมรับสิ่งนี้แล้ว ข้าก็ไปยังคำถามที่เกี่ยวข้องมากขึ้นในการพยายามตัดสินใจว่าข้าควรเขียนเกี่ยวกับ [SCOPE.Custom('GetLatestTopic')] ต่อไปหรือไม่ หรือจะฉลาดกว่าหากจะกระจายความหลากหลาย..."
 laamp_base_learning_contract_events.4025.desc.outro.02: "ข้าไตร่ตรองเรื่องนี้ ตลอดเวลาที่พิจารณาว่าบทต่อไปควรเกี่ยวกับอะไร..."
 laamp_base_learning_contract_events.4025.desc.outro.03: "ความคิดยังคงอยู่ในใจข้า ข้าหันความสนใจกลับไปที่หน้ากระดาษ — [SCOPE.Custom('GetLatestTopic')] ยังคงเกี่ยวข้องที่จะเขียนเกี่ยวกับ...?"

 laamp_base_learning_contract_events.4025.a: "ข้าจะ ทำให้พวกเขาตื่นตาด้วยปัญญาของข้า!"
 laamp_base_learning_contract_events.4025.a.second: "ปัญญาอีกเล็กน้อยคงไม่เสียหาย"
 laamp_base_learning_contract_events.4025.b: "ข้อความเกี่ยวกับทักษะทางสังคมน่าจะมีประโยชน์"
 laamp_base_learning_contract_events.4025.b.second: "ทฤษฎีบทเกี่ยวกับการทูตอีกข้อคงจะดี"
 laamp_base_learning_contract_events.4025.c: "ความรู้ทางการทหารของข้าน่าจะถ่ายทอดได้ดี"
 laamp_base_learning_contract_events.4025.c.second: "อีกส่วนที่เกี่ยวกับผู้บัญชาการ บางที?"
 laamp_base_learning_contract_events.4025.d: "ส คือ การดูแล หัวข้อแบบข้าเลย"
 laamp_base_learning_contract_events.4025.d.second: "ครั้งนี้ มาพูดถึงประสิทธิภาพกัน"
 laamp_base_learning_contract_events.4025.e: "บทความเกี่ยวกับการหลอกลวงหนึ่งบท กำลังมา"
 laamp_base_learning_contract_events.4025.e.second: "อีกบทเกี่ยวกับความรอบคอบ อาจจะ"
 laamp_base_learning_contract_events.4025.f: "ข้ามีเรื่องราวการเดินทางมากมายที่จะเล่า"
 laamp_base_learning_contract_events.4025.f.second: "เกร็ดเล็กเกร็ดน้อยจากการเดินทางอีกรอบก็น่าจะดี"
 laamp_base_learning_contract_events.4025.g: "การจาริกแสวงบุญ มีอะไรที่ #EMP ศักดิ์สิทธิ์#! กว่านี้อีกไหม?"
 laamp_base_learning_contract_events.4025.g.second: "เราเคยเสร็จสิ้นการจาริกแสวงบุญจริง ๆ หรือ?"
 laamp_base_learning_contract_events.4025.h: "#EMP สิ่งมหัศจรรย์#! ที่ข้าเคยเห็น ข้าจะเขียนเกี่ยวกับสิ่งนั้น"
