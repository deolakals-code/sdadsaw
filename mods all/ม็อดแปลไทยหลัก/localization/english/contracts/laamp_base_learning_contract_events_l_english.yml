 laamp_base_learning_contract_events.4015.t: "$laamp_base_learning_contract_events_prefix.4011$: [ROOT.Char.GetCurrentLocation.GetNameNoTooltip]"
 laamp_base_learning_contract_events.4015.desc.surroundings.alley: "ข้าเห็น [challenge_character.GetTitledFirstName] ในตรอกซอกซอยแห่งหนึ่งของ [ROOT.Char.GetCurrentLocation.GetNameNoTooltip] ขณะที่ข้ามุ่งหน้าไปยังที่พำนักของ [challenge_character.GetHerHis] [challenge_character.GetSheHe|U] หรี่ตาและเริ่มขยับเข้ามาใกล้เมื่อข้าเข้าใกล้"
 laamp_base_learning_contract_events.4015.desc.surroundings.market: "ที่มุมหนึ่งของตลาด ข้าพบ [challenge_character.GetTitledFirstName] กำลังตรวจสอบ [challenge_character.Custom('GetTradeGoods')] ที่พ่อค้าท้องถิ่นกำลังเร่ขายอย่างละเอียด [challenge_character.GetSheHe|U] เงยหน้าขึ้นเมื่อข้าเข้าใกล้"
 laamp_base_learning_contract_events.4015.desc.surroundings.outdoors_temple: "สายลมพัดอ่อน ๆ ต้อนรับข้าขณะที่ข้าเข้าสู่พื้นที่ศักดิ์สิทธิ์ของ [ROOT.Char.GetCurrentLocation.GetNameNoTooltip] [challenge_character.GetTitledFirstName] กำลังเดินเล่นสบาย ๆ อยู่ข้างหน้าเล็กน้อย ในที่สุดก็ชะลอความเร็วและหันมาหาข้าเมื่อข้าเข้าใกล้"
 laamp_base_learning_contract_events.4015.desc.surroundings.temple: "[challenge_character.GetTitledFirstName] เพิ่งออกจาก [challenge_character.GetFaith.HouseOfWorship] เมื่อข้ามาถึง [challenge_character.GetSheHe|U] เอียงศีรษะของ [challenge_character.GetHerHis] เมื่อ [challenge_character.GetSheHe] สังเกตเห็นข้าเดินเข้าไปหา [challenge_character.GetHerHim]"
 laamp_base_learning_contract_events.4015.desc.surroundings.study: "เมื่อข้ามาถึง ข้าพบ [challenge_character.GetTitledFirstName] กำลังจดจ่ออยู่กับแผนที่ในห้องทำงานของ [challenge_character.GetHerHis] โดยไม่เงยหน้าขึ้น [challenge_character.GetSheHe] คำราม รับรู้ถึงการมีอยู่ของข้า"
 laamp_base_learning_contract_events.4015.desc.surroundings.physician: "ข้าพบ [challenge_character.GetTitledFirstName] ที่ห้องทำงานของแพทย์ กำลังสนทนากับสมาชิกสองคนของ [challenge_character.GetHerHis] [challenge_character.GetFaith.AltPriestTermPlural] ทั้งสามคนหยุดพูดทันทีเมื่อข้าเดินเข้าไปใกล้ มองข้าอย่างสงสัย"
 laamp_base_learning_contract_events.4015.desc.surroundings.council_chamber: "เมื่อข้ามาถึง [challenge_character.GetTitledFirstName] อยู่ในห้องสภา กำลังมองออกไปนอกหน้าต่างอย่างโหยหา [challenge_character.GetSheHe|U] ค่อย ๆ หันกลับมาเมื่อได้ยินเสียงฝีเท้าของข้า"
 laamp_base_learning_contract_events.4015.desc.surroundings.corridor: "เมื่อข้ามาถึง [challenge_character.GetTitledFirstName] กำลังเดินครุ่นคิดไปตามโถงทางเดินยาวแห่งหนึ่ง [challenge_character.GetSheHe|U] หันกลับมามองข้าเมื่อข้าเข้าใกล้"
 laamp_base_learning_contract_events.4015.desc.surroundings.relaxing_room: "[challenge_character.GetTitledFirstName] เอนกายอย่างสบายอารมณ์อยู่บนเก้าอี้บุนวมขณะที่ข้าเดินเข้าไปในห้องพักผ่อน [challenge_character.GetSheHe|U] ผงกศีรษะของ [challenge_character.GetHerHis] ขึ้นเมื่อข้าเข้าไปใกล้"
 laamp_base_learning_contract_events.4015.desc.local_mood.disapproval: ""[employer.GetSheHe|U] มักจะทึ่มเล็กน้อยเกี่ยวกับเรื่องนั้น" [challenge_character.GetSheHe] ยอมรับขณะที่ข้าอธิบายเหตุผลในการมาเยือนของข้า "ข้าไม่เห็นด้วยกับมุมมองของ [employer.GetHerHis] อย่างแน่นอน และข้าสงสัยว่าข้าจะเห็นด้วย""
 laamp_base_learning_contract_events.4015.desc.local_mood.anger: ""You come here, interrupting me, over #EMP that#!? Such a petty [employer.GetTitleAsName], my word!" [challenge_character.GetSheHe|U] clenches [challenge_character.GetHerHis] fists, takes a couple of deep breaths and attempts to calm down. "There is nothing you can say to make me agree with that #EMP [employer.Custom2('InsultNounClumsy', SCOPE.sC('challenge_character'))]#!!""
 laamp_base_learning_contract_events.4015.desc.local_mood.admiration: ""ข้าเสียใจที่ [employer.GetSheHe] รู้สึก เช่นนั้น แต่ความภักดีของข้าอยู่กับ [challenge_character.GetFaith.GetNameNoTooltip] เป็นอันดับแรกและสำคัญที่สุด ข้าเกรงว่าจะไม่มีอะไรมากที่ท่านจะทำได้ที่นี่" [challenge_character.GetSheHe] กล่าวอย่างขอโทษ"
 laamp_base_learning_contract_events.4015.desc.local_mood.indifferent: ""อะไรจากใครนะตอนนี้? เอ่อ แน่นอน ข้าเดาว่าเราคุยกันได้ สงสัยว่ามันจะเปลี่ยนอะไรได้มากนัก แต่ถ้ามัน ทำให้ท่านรู้สึกดีขึ้น""
 laamp_base_learning_contract_events.4015.desc.local_mood.indifferent.02: "ดวงตาของ [challenge_character.GetHerHis|U] เบิกกว้างและกระพริบสองสามครั้งก่อนที่ [challenge_character.GetSheHe] จะตระหนักว่าข้าหมายถึงอะไร: "ข้าเข้าใจแล้ว เป็นเรื่องน่าเสียดายที่ [employer.GetSheHe] รู้สึก เช่นนั้น แต่เราคงต้องตกลงที่จะไม่เห็นด้วย" [challenge_character.GetSheHe] ขมวดคิ้วของ [challenge_character.GetHerHis]"
 laamp_base_learning_contract_events.4015.desc.local_mood.thinking: ""โอ้? ความขัดแย้งเล็กน้อยนั่น? ข้าไม่ได้คิดอะไรมากเกี่ยวกับมัน แต่ถ้าท่านมีข้อโต้แย้งเพิ่มเติมที่จะนำเสนอ เชิญเลย" [challenge_character.GetSheHe|U] ยักไหล่: "ข้าไม่ได้ตั้งใจจะ ทำให้ [employer.GetHerHim] โกรธเป็นพิเศษ แม้ว่าเราจะไม่จำเป็นต้องเห็นด้วยในประเด็นนั้นก็ตาม""
 laamp_base_learning_contract_events.4015.desc.outro: "ข้าฮัมเพลงเห็นด้วย ขณะที่ข้าวางแผนเส้นทางที่ดีที่สุดข้างหน้าอย่างระมัดระวัง"
 laamp_base_learning_contract_events.4015.desc.outro_priest.intro: "ทางขวาของข้า นักบวชประจำค่ายของข้า [camp_priest.GetFirstName]"
 laamp_base_learning_contract_events.4015.desc.outro_priest: "$laamp_base_learning_contract_events.4015.desc.outro_priest.intro$ ฮัมเพลงและพยักหน้า เตรียมความเชื่อมั่นทางจิตวิญญาณของ [camp_priest.GetHerHis] ในใจ"
 laamp_base_learning_contract_events.4015.desc.outro_priest.wary: "$laamp_base_learning_contract_events.4015.desc.outro_priest.intro$ เริ่มดูเหนื่อยล้าเล็กน้อย ขณะที่ดวงตาของ [camp_priest.GetHerHis] หรี่ลงขณะพิจารณาข้อโต้แย้ง"
 laamp_base_learning_contract_events.4015.desc.outro_priest.exhausted: "$laamp_base_learning_contract_events.4015.desc.outro_priest.intro$ ดูทรุดโทรมอย่างเห็นได้ชัด จ้องมองไปยังอีเธอร์เป็นครั้งคราว ข้าวางมือเบา ๆ บนไหล่ของ [camp_priest.GetHerHis]"

