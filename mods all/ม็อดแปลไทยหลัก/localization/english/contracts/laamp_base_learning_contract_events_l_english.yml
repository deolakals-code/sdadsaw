 laamp_base_4011_request: "[task_contract|E] นี้ต้องการให้ท่านเดินทางไปยังดินแดนของ [TaskContract.GetEmployer.GetTitledFirstNamePossessive] และยุติข้อพิพาททางเทววิทยาในท้องถิ่นจำนวนหนึ่ง ผ่านการท้าทาย [skill|E] ด้าน [learning|E], [piety_level|E], [traits|E] ทางศาสนาที่เกี่ยวข้อง, [piety|E] หรือ [stress|E]"
 laamp_base_learning_contract_events_prefix.4011: "ปัญหาทางเทววิทยา"

 laamp_base_learning_contract_events.4011.t: "$laamp_base_learning_contract_events_prefix.4011$: การออกเดินทาง"
 laamp_base_learning_contract_events.4011.desc: "รุ่งอรุณมาถึงแล้ว และข้าได้รวบรวมคณะผู้ติดตามเพื่อเดินทางไปยังที่พำนักของ [employer.GetTitledFirstNamePossessive] ใน [employer.GetCapitalLocation.GetTitle.GetNameNoTierNoTooltip]\n\nม้าขยับตัวไปมาอย่างกระสับกระส่าย และข้าเหลือบมองค่ายเป็นครั้งสุดท้ายก่อนออกเดินทาง"
 laamp_base_learning_contract_events.4011.a: "เรารีบไปกันเถอะ!"
 laamp_base_learning_contract_events.4011.a.tt: "@camp_travel_short_icon! ท่าน [travel|E] โดยไม่มี [domicile|E] ของท่าน"
 laamp_base_learning_contract_events.4011.tt.destination_list.5_destinations: "ท่านเริ่ม [traveling|E] ทันทีไปยัง [employer_location_destination.GetName] จากนั้นไป [destination_1.GetNameNoTier] จากนั้นไป [destination_2.GetNameNoTier] จากนั้นไป [destination_3.GetNameNoTier] จากนั้นไป [destination_4.GetNameNoTier] จากนั้นไป [destination_5.GetNameNoTier] และสุดท้ายกลับไปที่ [employer_location_destination.GetName]"
 laamp_base_learning_contract_events.4011.tt.destination_list.4_destinations: "ท่านเริ่ม [traveling|E] ทันทีไปยัง [employer_location_destination.GetName] จากนั้นไป [destination_1.GetNameNoTier] จากนั้นไป [destination_2.GetNameNoTier] จากนั้นไป [destination_3.GetNameNoTier] จากนั้นไป [destination_4.GetNameNoTier] และสุดท้ายกลับไปที่ [employer_location_destination.GetName]"
 laamp_base_learning_contract_events.4011.tt.destination_list.3_destinations: "ท่านเริ่ม [traveling|E] ทันทีไปยัง [employer_location_destination.GetName] จากนั้นไป [destination_1.GetNameNoTier] จากนั้นไป [destination_2.GetNameNoTier] จากนั้นไป [destination_3.GetNameNoTier] และสุดท้ายกลับไปที่ [employer_location_destination.GetName]"
 laamp_base_learning_contract_events.4011.tt.explanation: "#TUT เพื่อทำ [task_contract|E] ให้สำเร็จ:\n$EFFECT_LIST_BULLET$ทำความท้าทายด้าน [learning|E] ให้สำเร็จ, ใช้ [piety_level|E] ของท่าน, ใช้ [fame_traits|E] ทางศาสนา หรือโน้มน้าวผู้ถือครองปลายทางด้วยวิธีการ #EMP ไร้ศรัทธา#! \n$EFFECT_LIST_BULLET$ชนะหนึ่งในสามของการท้าทายของท่านเพื่อ #P ความสำเร็จตามเกณฑ์#!\n$EFFECT_LIST_BULLET$ชนะสองในสามของการท้าทายของท่านเพื่อ #P ความสำเร็จ#! ธรรมดา\n$EFFECT_LIST_BULLET$ชนะการท้าทายทั้งหมดของท่านเพื่อ #P ความสำเร็จอันยอดเยี่ยม#!\n\n@alert_icon! #alert_trial การยกเลิก [travel|E] จะทำให้ [task_contract|E] เป็นโมฆะ#!#!"
 
 laamp_base_learning_contract_events.4014.t: "$laamp_base_learning_contract_events_prefix.4011$: มือชี้นำ"
 laamp_base_learning_contract_events.4014.desc: ""... และนั่นคือตอนที่ [dummy_gender.GetSheHe] เริ่ม #EMP หัวเราะคิกคัก!#!" ความโกรธเคืองของ [employer.GetTitledFirstNamePossessive] นั้นชัดเจน\n\n"ข้าเคยมีการสนทนาทางเทววิทยา #EMP มากมาย#! ในชีวิตของข้า และ [employer.GetFaith.HighGodNameAlternate|l] ทรงทราบว่าข้าพยายามอดทน อย่างไรก็ตาม ไพร่ฟ้าบางคนของข้าอาจต้องการ #EMP การกระตุ้นเพิ่มเติม#! เพื่อเห็นแสงสว่าง บางที #EMP ท่าน#! อาจเป็นผู้นำทางจิตวิญญาณนั้นได้"\n\n[employer.GetSheHe|U] พยักหน้าให้ [employer.GetHerselfHimself] ดูเหมือนพอใจกับวิธีแก้ปัญหาของ [employer.GetHerHis]: "[employer.GetFaith.HighGodName] อวยพรท่านในการเดินทางของท่าน ไปเถิด""
 laamp_base_learning_contract_events.4014.a: ""ข้าจะ ทำให้ดีที่สุด""
 laamp_base_learning_contract_events.4014.a.tt: "เริ่มเดินทางไปยัง [destination_1.GetNameNoTier]"

 laamp_base_learning_contract_events.4015.tt.current_total.sub_t1: "#TUT ท่านมีคะแนน #V [task_contract.MakeScope.Var('wins_tally').GetValue]#! จาก #V [task_contract.MakeScope.Var('win_t1_threshold').GetValue]#! เพื่อไปสู่ #P ความสำเร็จตามเกณฑ์#!#!"
 laamp_base_learning_contract_events.4015.tt.current_total.sub_t2: "#TUT ท่านมีคะแนน #V [task_contract.MakeScope.Var('wins_tally').GetValue]#! จาก #V [task_contract.MakeScope.Var('win_t2_threshold').GetValue]#! เพื่อไปสู่ #P ความสำเร็จ#! #WEAK (ปัจจุบันท่านได้รับความสำเร็จตามเกณฑ์แล้ว)#!#!"
 laamp_base_learning_contract_events.4015.tt.current_total.sub_t3: "#TUT ท่านมีคะแนน #V [task_contract.MakeScope.Var('wins_tally').GetValue]#! จาก #V [task_contract.MakeScope.Var('win_t3_threshold').GetValue]#! เพื่อไปสู่ #P ความสำเร็จอันยอดเยี่ยม#! #WEAK (ปัจจุบันท่านได้รับความสำเร็จแล้ว)#!#!"
 laamp_base_learning_contract_events.4015.tt.disputes_left: "#TUT ท่านเหลือข้อพิพาทอีก #V [task_contract.MakeScope.Var('opportunities_left_tally').GetValue]#! จาก #V [task_contract.MakeScope.Var('win_t3_threshold').GetValue]#! ข้อพิพาท#!"
