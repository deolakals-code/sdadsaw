 #Go Big or Go Home
 laamp_base_learning_contract_events.4110.t: "$laamp_base_learning_contract_events_prefix.4100$: ความพยายามครั้งสุดท้าย"
 laamp_base_learning_contract_events.4110.desc: "ข้าตระหนักถึงความล้มเหลวที่ใกล้เข้ามาเมื่อสายตาของ [child_to_educate.GetFirstNamePossessive] เริ่มล่องลอยไปในอีเธอร์อีกครั้ง\n\nด้วยเหตุผลบางอย่าง เด็กคนนี้ช่าง #EMP ไม่เปิดรับ#!... ข้ากำหมัดและหายใจเข้าลึก ๆ สองสามครั้ง บางทีข้าอาจจะเข้าหามันผิดมุม?\n\nเวลาของเราใกล้จะหมดแล้ว และข้าควรพยายามครั้ง #EMP สุดท้าย#! เพื่อเข้าถึงและสอนเยาวชน #EMP บางสิ่ง#! ที่สำคัญ"
 laamp_base_learning_contract_events.4110.a: ""เฮ้ [child_to_educate.Custom('ChildPetName')] ประสบการณ์ของเจ้ากับ...""
 laamp_base_learning_contract_events.4110.b: ""เจ้ารู้คำ [alternative_language_culture.GetLanguage.GetNameNoTooltip] สำหรับ #EMP ขี้มูก#! หรือไม่?""
 laamp_base_learning_contract_events.4110.b.tt: "ท่านไม่รู้ [language|E] มากกว่า [child_to_educate.GetShortUIName] อีกหนึ่งภาษา"
 laamp_base_learning_contract_events.4110.c: "ไม่ [child_to_educate.GetSheHe|U] เป็นกรณีที่สิ้นหวัง"
 laamp_base_learning_contract_events.4110.c.tt: "@alert_icon! #alert_trial ความล้มเหลวของ [task_contract|E] ใกล้เข้ามาแล้ว#! "
 #Conclusion
 laamp_base_learning_contract_events.4120.t: "$laamp_base_learning_contract_events_prefix.4100$: การสอบ"
 laamp_base_learning_contract_events.4120.desc.success: "[employer.GetTitledFirstName] มีสีหน้าที่ไม่อาจหยั่งรู้ได้ เกือบจะชื่นชม:\n\n"ท่านมีแนวทางการศึกษาที่ไม่ธรรมดาอย่างแน่นอน และ [child_to_educate.GetFirstName] ก็ได้รับมุมมองใหม่ ๆ หนึ่งหรือสองอย่าง... ข้าอาจจะติดต่อกลับไปอีก หากต้องการบริการของท่านในอนาคต"\n\nข้าพยักหน้าและก้มศีรษะเล็กน้อย ขณะที่ข้าหันหลังกลับเพื่อจากไป"
 laamp_base_learning_contract_events.4120.desc.success_critical: "[employer.GetTitledFirstName] พยายามระงับความดีใจจนตัวลอยของ [employer.GetHerHis]:\n\n"เยี่ยม! วิธีการที่ไม่ธรรมดาของท่านดูเหมือนจะประสบความสำเร็จอย่างมาก! [child_to_educate.GetFirstName] หนุ่มน้อยเริ่มแสดงสัญญาณของความคิดและแนวคิดที่เฉียบแหลมมากขึ้นแล้ว!"\n\n"มุมโจมตี มารยาททางสังคม เศรษฐศาสตร์... ผลงานยอดเยี่ยม! ขอบคุณ และ #EMP อย่าลืม#! แจ้งให้ข้าทราบในครั้งต่อไปที่ท่านอยู่ในพื้นที่!" [employer.GetTitleAsNameNoTooltip] อุทานและแสดงท่าทางตื่นเต้น\n\nรอยยิ้มเล็กน้อยปรากฏบนริมฝีปากของข้าขณะที่ข้าพยักหน้า"
 laamp_base_learning_contract_events.4120.desc.failure: "[employer.GetTitledFirstName] ส่ายหน้าของ [employer.GetHerHis] อย่างไม่เชื่อ:\n\n"ข้าจะไม่โกหก; ข้าคาดหวังมากกว่านี้จากท่าน นี่เป็นการแสดงการสอนพิเศษที่น่าสมเพช — การปล่อยให้ [child_to_educate.GetFirstName] เตร็ดเตร่อยู่ในป่าคงจะ #EMP ให้ความรู้#! มากกว่านี้ ตอนนี้ ไปให้พ้นและอย่ามาเหยียบธรณีประตูของข้าอีก"\n\nข้ารู้สึกถึงความอับอายจากภารกิจที่ล้มเหลวปรากฏขึ้นบนแก้มของข้าขณะที่ข้าหันหลังกลับเพื่อจากไป"
 laamp_base_learning_contract_events.4120.a.success_standard: ""ขอบคุณมาก""
 laamp_base_learning_contract_events.4120.a.success_critical: ""เป็น เพราะ [child_to_educate.GetHerHim] ทั้งหมด""
 laamp_base_learning_contract_events.4120.a.failure_standard: "เด็กคนนี้สิ้นหวัง... หรือบางทีอาจเป็นข้า"
 
