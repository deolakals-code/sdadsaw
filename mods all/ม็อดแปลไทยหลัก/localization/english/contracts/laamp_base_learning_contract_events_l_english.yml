 #Intro
 laamp_base_learning_contract_events.4100.desc.intro.first_time: "[child_to_educate.GetFirstName] มองข้าอย่างสงสัย แต่คาดหวัง ขณะที่เราพบกันในครั้งแรก"
 laamp_base_learning_contract_events.4100.desc.intro.stress: "ขณะที่ข้าก้าวเข้าไปใกล้ [child_to_educate.GetFirstName] ถอยหลังโดยสัญชาตญาณ ดวงตาของ [child_to_educate.GetHerHis] หรี่ลงด้วยความสงสัย"
 laamp_base_learning_contract_events.4100.desc.intro.support_no_support: "สีหน้าสับสนปรากฏบนใบหน้าของ [child_to_educate.GetFirstNamePossessive] ชั่วครู่ ขณะที่ [child_to_educate.GetSheHe] ครุ่นคิดว่าผู้ช่วยของข้าจากครั้งที่แล้วหายไปไหน"
 laamp_base_learning_contract_events.4100.desc.intro.support: "[child_to_educate.GetFirstName] ตรวจสอบ [support_person.GetFirstName] ด้วยสายตาอยากรู้อยากเห็นขณะที่เราเข้าใกล้"
 laamp_base_learning_contract_events.4100.desc.intro.learning: "[child_to_educate.GetFirstName] มองข้าอย่างไม่อาจหยั่งรู้ได้ขณะที่เราพบกันในครั้งต่อไป"
 laamp_base_learning_contract_events.4100.desc.intro.topic: "ขณะที่เรากลับมาพบกัน [child_to_educate.GetFirstName] เอียงศีรษะของ [child_to_educate.GetHerHis] ขณะที่ข้าสรุปหัวข้อของครั้งที่แล้ว"
 #Surroundings
 laamp_base_learning_contract_events.4100.desc.surroundings.alley_day: "\n\nตรอกซอกซอยเต็มไปด้วยกิจกรรม พ่อค้าเคลื่อนไหวอย่างรวดเร็วระหว่างจัตุรัส, "
 laamp_base_learning_contract_events.4100.desc.surroundings.gallows: "\n\nฝูงชนที่ตะแลงแกงเพิ่งสลายตัว ความกระหายเลือดของพวกเขาได้รับการตอบสนอง, "
 laamp_base_learning_contract_events.4100.desc.surroundings.market: "\n\nสินค้ากำลังแลกเปลี่ยนมือและความต้องการกำลังได้รับการตอบสนองที่ตลาด, "
 laamp_base_learning_contract_events.4100.desc.surroundings.docks: "\n\nเรือประมงเพิ่งเข้าเทียบท่าและผลผลิตจากทะเลกำลังถูกขนถ่าย, "
 laamp_base_learning_contract_events.4100.desc.surroundings.armory: "\n\nเตาหลอมคำราม อาวุธวางซ้อนกันในมุมของคลังอาวุธ, "
 laamp_base_learning_contract_events.4100.desc.surroundings.garden: "\n\nสวนอันเงียบสงบรองรับโอกาสในการสอนมากมาย, "
 laamp_base_learning_contract_events.4100.desc.surroundings.tavern: "\n\nโรงเตี๊ยมรวบรวมลูกค้าประจำและผู้มาเยือนมากมาย, "
 laamp_base_learning_contract_events.4100.desc.surroundings.temple: "\n\n[ROOT.Char.GetCurrentLocation.GetCounty.GetFaith.GetAdherentNamePluralNoTooltip] หลายคนเดินเตร่อย่างสงบในพื้นที่ศักดิ์สิทธิ์, "
 laamp_base_learning_contract_events.4100.desc.surroundings.throneroom: "\n\nคนรับใช้เดินไปมาในห้องบัลลังก์, "
 laamp_base_learning_contract_events.4100.desc.surroundings.farmlands: "\n\nขบวนชาวบ้านที่มาและไปเดินทางข้ามพื้นที่เกษตรกรรมที่ราบเรียบ, "
 laamp_base_learning_contract_events.4100.desc.surroundings.plains: "\n\nสายลมพัดผ่านที่ราบ สัมผัสลมหายใจของพวกเขารู้สึกได้โดยทุกคนที่ผ่านไป, "
 laamp_base_learning_contract_events.4100.desc.surroundings.steppe: "\n\nทุ่งหญ้าสเตปป์ดูเหมือนจะทอดยาวไปไม่สิ้นสุด ขณะที่เราอยู่บริเวณขอบนอกของที่ดิน, "
 laamp_base_learning_contract_events.4100.desc.surroundings.desert: "\n\nทราย ทราย ทราย สุดลูกหูลูกตา เราเดินเตร่อยู่บริเวณรอบนอกของที่ดิน, "
 laamp_base_learning_contract_events.4100.desc.surroundings.drylands: "\n\nพื้นที่แห้งแล้งไม่ได้เก็บน้ำไว้มากนัก แต่เรายังคงผ่านกลุ่มนักเดินทางหลายกลุ่ม, "
 laamp_base_learning_contract_events.4100.desc.surroundings.oasis: "\n\nโอเอซิส ซึ่งตั้งอยู่บริเวณรอบนอกของที่ดิน ดึงดูดผู้มาเยือนจำนวนมาก, "
 laamp_base_learning_contract_events.4100.desc.surroundings.hills: "\n\nเนินเขาที่ทอดตัวเป็นลูกคลื่นเป็นที่อยู่ของ [ROOT.Char.Custom('RegionalFarmAnimalPlural')] ที่กำลังเล็มหญ้าอยู่มากมาย, "
 laamp_base_learning_contract_events.4100.desc.surroundings.mountains: "\n\nไหล่เขาท้องถิ่นมีนักเดินทางและกิจกรรมทุกประเภท, "
 laamp_base_learning_contract_events.4100.desc.surroundings.wetlands: "\n\nศัตรูพืชทุกชนิดเรียกพื้นที่ชุ่มน้ำที่เป็นหนองว่าบ้าน ขณะที่นักเดินทางที่ไม่ระวังตัวค้นพบในไม่ช้า, "
 laamp_base_learning_contract_events.4100.desc.surroundings.foggy_forest: "\n\nหมอกเรืองแสงปกคลุมป่า ขณะที่ชาวบ้านกำลังเตรียมอาหารมื้อต่อไปในบริเวณใกล้เคียง, "
 laamp_base_learning_contract_events.4100.desc.surroundings.managed_forest: "\n\nค่ายตัดไม้ใกล้เคียงเต็มไปด้วยกิจกรรม, "
 laamp_base_learning_contract_events.4100.desc.surroundings.pine_forest: "\n\nคนหาของป่าส่งเสียงกรอบแกรบในพุ่มไม้ เก็บเกี่ยวอาหารอันโอชะในท้องถิ่น, "
 laamp_base_learning_contract_events.4100.desc.surroundings.forest: "\n\nเราบังเอิญพบค่ายนักผจญภัยที่เป็นมิตรในท้องถิ่นในป่า, "
 laamp_base_learning_contract_events.4100.desc.surroundings.forest_cave: "\n\n[ROOT.Char.GetWomanMan] ผู้รอบรู้ในท้องถิ่นที่อาศัยอยู่ในถ้ำดึงดูดฝูงชนจำนวนมาก, "
 laamp_base_learning_contract_events.4100.desc.surroundings.snowy_forest: "\n\nชาวบ้านกำลังติดตามรอยเท้าสัตว์ในหิมะ, "
 #Topic
 laamp_base_learning_contract_events.4100.desc.topic.diplomacy: "และข้าเห็นโอกาสมากมายที่จะสอน [child_to_educate.GetFirstNameNoTooltip] เพิ่มเติมเกี่ยวกับความสง่างามของการปฏิสัมพันธ์ทางสังคม"
 laamp_base_learning_contract_events.4100.desc.topic.martial: "และขณะที่ข้าสำรวจสภาพแวดล้อมของเรา ข้าก็สอดส่องหาจุดได้เปรียบจำนวนหนึ่งที่ข้าควรสอน [child_to_educate.GetFirstNameNoTooltip] เกี่ยวกับ"
 laamp_base_learning_contract_events.4100.desc.topic.stewardship: "และมองไปรอบ ๆ ข้าระบุโอกาสมากมายในการปรับปรุงองค์กรปัจจุบัน; สิ่งที่ [child_to_educate.GetFirstNameNoTooltip] ควรได้รับแจ้ง"
 laamp_base_learning_contract_events.4100.desc.topic.intrigue: "และขณะที่เราเดินไปตามทาง ข้าจับตามองสภาพแวดล้อมของเราอย่างระมัดระวัง — ทักษะที่ [child_to_educate.GetFirstNameNoTooltip] ควรได้รับรู้"
 laamp_base_learning_contract_events.4100.desc.topic.learning: "และข้าระบุตำแหน่ง [ROOT.Char.Custom('GetScientificObjects')] ที่จะเป็นประโยชน์สำหรับ [child_to_educate.GetFirstNameNoTooltip] ที่จะได้รับทราบ"
 laamp_base_learning_contract_events.4100.desc.topic.prowess: "และข้าเริ่มสังเกตเห็นมุมอันตรายต่าง ๆ ที่เราอาจถูกซุ่มโจมตีได้ทันที — สิ่งที่ข้าควรสอน [child_to_educate.GetFirstNameNoTooltip] เกี่ยวกับ"
 #Distraction
 laamp_base_learning_contract_events.4100.desc.distraction.stress: "\n\nเด็กเดินตามหลังข้า มองไปทางอื่นอย่างเห็นได้ชัดและไม่สนใจข้าทุกครั้งที่ข้าเหลือบมอง [child_to_educate.GetHerHim] เตรียมพร้อมสำหรับการระเบิดความไม่อดทนครั้งต่อไปของข้า ขมวดคิ้ว ข้าครุ่นคิดถึงสถานการณ์"
 laamp_base_learning_contract_events.4100.desc.distraction.hobbyhorse: "\n\nข้างหลังข้า ลูกศิษย์ของข้ากำลังล่องลอยไป หยิบม้าไม้ของ [child_to_educate.GetHerHis] จากแผงใกล้ ๆ [child_to_educate.GetSheHe|U] เริ่มขี่ไปรอบ ๆ วิ่งเล่นอย่างร่าเริงรอบบริเวณ"
 laamp_base_learning_contract_events.4100.desc.distraction.attention: "\n\nทว่าเมื่อข้าหันกลับไป [child_to_educate.Custom('GirlBoy')] ผู้นั้นกลับหยุดนิ่งอยู่กับรอยเท้า [child_to_educate.GetHerHis] กำลังพินิจพิเคราะห์ท่อนไม้ขนาดเท่าแขนที่ [child_to_educate.GetSheHe] พบอยู่บนพื้นอย่างตั้งอกตั้งใจ โดย [child_to_educate.GetSheHe] ไม่ตอบสนองต่อเสียงเรียกของข้าเลยแม้ แต่น้อย"
 laamp_base_learning_contract_events.4100.desc.distraction.dog: "\n\nแล้วราวกับมาจากอากาศธาตุ [ROOT.Char.Custom('get_region_dog_type')] ตัวใหญ่ก็วิ่งเข้ามาหาเด็ก อยากเล่นอย่างยิ่ง [child_to_educate.Custom('GirlBoy')] กรีดร้องด้วยความดีใจและเริ่มเล่นกับสุนัขทันที"
 laamp_base_learning_contract_events.4100.desc.distraction.running: "\n\nทันใดนั้น [child_to_educate.GetCulture.GetNameNoTooltip] [child_to_educate.Custom('GirlBoy')] หนุ่มสาวก็มีแววตาบ้าคลั่งและเริ่มตะโกนว่า: "โจรมาแล้ว!" และเกือบจะหัวเราะคิกคักจนหัวหลุดขณะที่ [child_to_educate.GetSheHe] วิ่งไปมากับผู้ดูแลของ [child_to_educate.GetHerHis]"
 laamp_base_learning_contract_events.4100.desc.distraction.crushing: "\n\nข้างหน้า [dummy_gender.Custom('GirlBoy')] ชาวนาที่โดดเด่นดูเหมือนจะ ทำให้ลูกศิษย์ของข้าหลงใหล [child_to_educate.GetSheHe|U] ย่องไปรอบ ๆ สังเกต [dummy_gender.Custom('GirlBoy')] ที่กำลังแบกเสบียงอย่างตั้งใจ และ #EMP ไม่สนใจ#! การมีอยู่ของข้าอย่างเห็นได้ชัด"
 laamp_base_learning_contract_events.4100.desc.distraction.other_kids: "\n\nเด็กคนอื่น ๆ กำลังวิ่งเล่นเกมชั่วคราว ดึงดูดความสนใจของ [child_to_educate.Custom('GirlBoy')] [child_to_educate.GetSheHe|U] วิ่งเข้าไปหาพวกเขา เข้าร่วมการแข่งขันก่อนที่ข้าจะหยุด [child_to_educate.GetHerHim] ได้"
 laamp_base_learning_contract_events.4100.desc.distraction.friends: "\n\nลูกศิษย์ของข้าดูเหมือนจะพาเพื่อนมาด้วย ซึ่งก็ไม่เป็นไร แต่พวกเขาดูเหมือนจะไม่สนใจฟังการบรรยายของข้าเลย ทำให้ข้าผิดหวัง ข้าอดกลั้นไม่ให้ขมวดคิ้วขณะที่พวกเขาทะเลาะและหยอกล้อกัน"
 laamp_base_learning_contract_events.4100.desc.distraction.hiding: "\n\n[child_to_educate.Custom('GirlBoy')] ดูเหมือนจะเข้าสู่ช่วงขี้เล่น ขณะที่ [child_to_educate.GetSheHe] โผล่เข้าและออกจากที่ซ่อนอย่างหมกมุ่น พยายามหนีข้า ข้าพยายามระงับความหงุดหงิดที่เพิ่มขึ้น"
 laamp_base_learning_contract_events.4100.desc.distraction.unimpressed: "\n\nไม่ทันที่คำทักทายเบื้องต้นจะสิ้นสุดลง เด็กคนนั้นด้วยเหตุผลบางอย่างก็เอนหลังและเริ่มไม่สนใจข้า หลับตาของ [child_to_educate.GetHerHis] และแสร้งทำเป็นหลับกลางคันระหว่างการบรรยายของข้า"
 #Outro
 laamp_base_learning_contract_events.4100.desc.outro_body: "โบกมือให้ข้าจากที่ไกล ๆ พร้อมที่จะช่วยเหลือหากจำเป็น"
