 laamp_base_learning_contract_events.4001.t.martial: "$laamp_base_learning_contract_events_prefix.4001$: สันติภาพผ่านสงคราม"
 laamp_base_learning_contract_events.4001.t.stewardship: "$laamp_base_learning_contract_events_prefix.4001$: เมื่อทองคำเอ่ย"
 laamp_base_learning_contract_events.4001.t.intrigue: "$laamp_base_learning_contract_events_prefix.4001$: ทุกลิ้นนิ่งเงียบ"
 laamp_base_learning_contract_events.4001.t.learning: "$laamp_base_learning_contract_events_prefix.4001$: วาจาศักดิ์สิทธิ์"
 laamp_base_learning_contract_events.4001.desc.01: "แสงตะวันค่อย ๆ จางหายไปขณะที่ข้านั่งอยู่ในห้องของ [employer.GetTitledFirstNamePossessive] ใต้แสงเทียน คัดลอกเส้นหมึกหยิกหยอยจากแผ่นหนึ่งไปยังอีกแผ่นหนึ่งอย่างบ้าคลั่ง\n\nเปลือกตาของข้าเริ่มหย่อนลง และข้าเผลอหลับไปชั่วครู่ก่อนจะสะดุ้งตื่น เท่าที่ข้าบอกได้ ข้อความเฉพาะตอนนี้ดูเหมือนจะเกี่ยวข้องกับ [SCOPE.Custom('GetScriptTopic')] — แต่ให้ตายเถอะ #EMP [ROOT.Char.GetFaith.HighGodName]#! มันช่างน่าเบื่อ #EMP เสียจริง#!."
 laamp_base_learning_contract_events.4001.desc.02: "สองสามวันผ่านไป และข้ากำลังคัดลอกต้นฉบับอยู่ อย่างไรก็ตาม ข้อความปัจจุบันแห้งแล้งยิ่งกว่ากรวดที่ตากแดด...\n\nจิตใจของข้าเริ่มล่องลอยไปเรื่องอื่น และข้ากระพริบตาสองสามครั้งเพื่อบังคับตัวเองกลับสู่โลกแห่งความเป็นจริง สาระสำคัญของข้อความดูเหมือนจะเกี่ยวข้องกับ [SCOPE.Custom('GetScriptTopic')] ซึ่งในตัวมันเองก็ไม่ได้น่าเบื่อโดยเนื้อแท้"
 laamp_base_learning_contract_events.4001.desc.03: "ข้าใกล้จะคัดลอกต้นฉบับเสร็จแล้ว ซึ่งดำเนินไป [SCOPE.Custom('GetScoreAdjective')] จนถึงตอนนี้ อีกครั้งที่อาลักษณ์ของต้นฉบับนี้ใช้วิธีการที่ #EMP น่าเบื่อที่สุด#! เท่าที่จะเป็นไปได้กับเนื้อหา\n\nสายตาของข้าจับจ้องไปที่ผู้ดูแล ซึ่งเป็นภาพที่น่าสนใจกว่ามาก จนกระทั่ง [attendant.GetSheHe] มองข้าอย่างสงสัย กระตุ้นให้ข้ากลับไปที่ข้อความ ข้อความนั้นดูเหมือนจะเกี่ยวข้องกับ [SCOPE.Custom('GetScriptTopic')] ซึ่งน่าจะดึงดูดผู้อ่าน — หากมันไม่แข็งทื่อนัก"
 laamp_base_learning_contract_events.4001.desc.final_shot: "หน้ากระดาษที่เขียนไปครึ่ง ๆ กลาง ๆ; รอยหมึกหยด; ปากกาขนนก #EMP เกลื่อนกลาด#! ข้าขยับขมับขณะครุ่นคิดถึงความโกลาหลที่เกิดจากการคัดลอกที่ไม่สำเร็จของข้า\n\nสายตาของผู้ดูแลของ [employer.GetTitledFirstNamePossessive] กำลังเผาไหม้เป็นรูที่หลังของข้า ขณะที่ข้ากลัวที่จะหันกลับไปเผชิญกับความล้มเหลวที่ใกล้เข้ามา\n\nแต่แล้ว ขณะที่ข้าศึกษา [ROOT.Char.Custom('GetMarginalia')] ที่ร่างไว้ในขอบกระดาษ ข้าก็ยืดตัวตรงด้วยแรงฮึดสู้ขึ้นมาทันที: #EMP ล้มเหลว?#! ข้าแค่ต้องรีบผ่านหน้าสุดท้ายเหล่านี้ไป!"
 laamp_base_learning_contract_events.4001.outro.01: "\n\nข้าลากนิ้วที่เปื้อนหมึกไปตาม [ROOT.Char.Custom('GetMarginalia')] ในขอบกระดาษ บางทีข้าควรปรับปรุงข้อความสักหน่อย เพื่อให้มันน่าดึงดูดยิ่งขึ้น?"
 laamp_base_learning_contract_events.4001.outro.02: "\n\nข้าสังเกต [ROOT.Char.Custom('GetMarginalia')] ที่ขีดเขียนไว้ในขอบกระดาษอย่างไม่ใส่ใจ ขณะที่ข้าครุ่นคิดถึงสถานการณ์"
 laamp_base_learning_contract_events.4001.outro.03: "\n\nข้าพิจารณาหนทางที่ดีที่สุดข้างหน้าขณะชื่นชมภาพวาดขอบกระดาษของ [ROOT.Char.Custom('GetMarginalia')]"
 laamp_base_learning_contract_events.4001.outro.secret: "\n\nขณะครุ่นคิด ข้าสังเกตเห็นลายมือขีดเขียนอีกอันที่กล่าวถึง [employer.GetTitleAsNameNoTooltip] ในขอบกระดาษ หากเพียง แต่ข้าจะใช้เวลาตีความมัน..."
 laamp_base_learning_contract_events.4001.a: "ลองตก แต่งมันสักหน่อยเป็นไร..."
 laamp_base_learning_contract_events.4001.b: "ข้าสามารถดึงแรงบันดาลใจจากประสบการณ์ของข้าเองได้!"
 laamp_base_learning_contract_events.4001.b.unavailable: "หากเพียง แต่ข้ามีประสบการณ์ในหัวข้อนี้มากกว่านี้"
 laamp_base_learning_contract_events.4001.b.tt.unavailable: "ท่านไม่มี [lifestyle_traits|E] ที่เหมาะสมสำหรับข้อความนี้"
 laamp_base_learning_contract_events.4001.b.tt.used: "ท่านได้ดึงจาก [lifestyle_trait|E] นี้สำหรับต้นฉบับนี้แล้ว"
 laamp_base_learning_contract_events.4001.b.flavor.unlearned: "แต่ข้าจะร่างมันขึ้นมาได้อย่างไร..."
 laamp_base_learning_contract_events.4001.c: "อืม... ข้าเห็นความคล้ายคลึงกับ [additional_language_culture.GetLanguage.GetNameNoTooltip]"
 laamp_base_learning_contract_events.4001.c.tt.used: "ท่านได้ใช้ความรู้ [language|E] ของท่านสำหรับต้นฉบับนี้แล้ว"
 laamp_base_learning_contract_events.4001.c.unavailable: "ข้าหวังว่าข้าจะมีความรู้มากกว่านี้"
 laamp_base_learning_contract_events.4001.c.tt.unavailable: "ท่านรู้เพียง [language|E] เดียว"
 laamp_base_learning_contract_events.4001.d: "ยึดตามต้นฉบับเดิมเถอะ"
 laamp_base_learning_contract_events.4001.d.secret: "ข้าจะใช้เวลาเพิ่มเติมในการตีความ"
 laamp_base_learning_contract_events.4001.d.flavor.unlearned: "เส้นหยิกหยอยนั่น... อาจหมายถึงอะไร..."
 laamp_base_learning_contract_events.4001.d.flavor.unwind: "ทำไมต้องทำมากขึ้นในเมื่อข้าทำน้อยลงได้"
 laamp_base_learning_contract_events.4001.d.secret.tt: "ท่านเรียนรู้ [secret|E] ของ [employer.GetShortUINamePossessive]"
 laamp_base_learning_contract_events.4001.e: "ข้าควรตั้งใจทำงานดีกว่า"
 laamp_base_learning_contract_events.4001.f: "ไม่ มันจบแล้ว"
 laamp_base_learning_contract_events.4001.f.tt: "$laamp_base_learning_contract_events.4110.c.tt$"
 #Conclusion
 laamp_base_learning_contract_events.4005.t: "$laamp_base_learning_contract_events_prefix.4001$: การเสร็จสิ้น"
 laamp_base_learning_contract_events.4005.desc.success.critical: "[employer.GetTitledFirstName] พยายามระงับความดีใจจนตัวลอยของ [employer.GetHerHis]:\n\n"เยี่ยม! วิธีการที่ไม่ธรรมดาของท่านดูเหมือนจะประสบความสำเร็จอย่างมาก! [child_to_educate.GetFirstName] หนุ่มน้อยเริ่มแสดงสัญญาณของความคิดและแนวคิดที่เฉียบแหลมมากขึ้นแล้ว!"\n\n"มุมโจมตี มารยาททางสังคม เศรษฐศาสตร์... ผลงานยอดเยี่ยม! ขอบคุณ และ #EMP อย่าลืม#! แจ้งให้ข้าทราบในครั้งต่อไปที่ท่านอยู่ในพื้นที่!" [employer.GetTitleAsNameNoTooltip] อุทานและแสดงท่าทางตื่นเต้น\n\nรอยยิ้มเล็กน้อยปรากฏบนริมฝีปากของข้าขณะที่ข้าพยักหน้า"
 laamp_base_learning_contract_events.4005.desc.success: "[employer.GetTitledFirstName] พลิกหน้ากระดาษไปมา สีหน้าแสดงความสนใจ: "อืม ต้นฉบับนี้น่าสนใจกว่าที่ข้าจำได้...\n\n[employer.GetSheHe|U] ยื่นต้นฉบับให้ผู้ดูแลของ [employer.GetHerHis]: "ศึกษาเรื่องนี้แล้วเรามาประชุมกันตอนเย็น"\n\nหันมาหาข้า [employer.GetTitledFirstNameNoTooltip] ยิ้มเล็กน้อย ยื่นถุงหนัก ๆ ให้ข้า: "ทำได้ดีมาก ตามที่ตกลงกัน นี่คือรางวัลของท่าน""
 laamp_base_learning_contract_events.4005.desc.success.qualified: "[employer.GetTitledFirstName] เม้มริมฝีปากของ [employer.GetHerHis] ขณะที่ [employer.GetSheHe] ตรวจสอบต้นฉบับ: \"มันเป็นแบบจำลองของชิ้นงานต้นฉบับจริงๆ ขอบคุณสำหรับการส่งมอบที่เชื่อถือได้ของท่าน\"\n\n[employer.GetSheHe|U] หันหลังกลับเพื่อจากไป แต่หยุดครู่หนึ่งเพื่อกล่าวว่า: \"โอ้ ท่านสามารถรับรางวัลของท่านได้ที่ประตู เชิญตามสบาย\"\n\nข้าเห็นกระเป๋าข้างประตูขณะที่ข้าหันหลังกลับเพื่อจากไป"
 laamp_base_learning_contract_events.4005.desc.failure: "[employer.GetTitledFirstName] ส่ายหน้าของ [employer.GetHerHis]:\n\n"นี่มัน... อะไรกัน... นี่มันรับไม่ได้ ท่านทำลายห้องของข้า #EMP และ#! ผลาญทรัพยากรการเขียนอันมีค่าไป"\n\n[employer.GetSheHe|U] กัดฟันของ [employer.GetHerHis]: "ไปซะ เดี๋ยวนี้ ก่อนที่ข้าจะรู้สึก #EMP เมตตา#! น้อยลง"\n\nข้ารีบวิ่งไปที่ประตู"
 laamp_base_learning_contract_events.4005.a.success_critical: ""เป็นงานง่าย ๆ""
 laamp_base_learning_contract_events.4005.a.success_standard: ""ขอบคุณมาก""
 laamp_base_learning_contract_events.4005.a.success_qualified: ""ต้นฉบับหนึ่งฉบับ ส่งมอบแล้ว""
 laamp_base_learning_contract_events.4005.a.failure_standard: ""เข้าใจแล้ว""

