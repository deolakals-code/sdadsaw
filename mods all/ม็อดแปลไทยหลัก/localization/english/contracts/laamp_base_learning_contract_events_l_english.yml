#Conclusion
 laamp_base_learning_contract_events.4027.t: "$laamp_base_learning_contract_events_prefix.4021$: บทสรุป"
 laamp_base_learning_contract_events.4027.desc.success.critical: "[employer.GetTitledFirstName] พลิกหน้ากระดาษของต้นฉบับไปมา หยุดเพื่อพิจารณาชิ้นส่วนจาก แต่ละหน้า "ข้าจะบอกว่า..."\n\n[employer.GetSheHe|U] หันกลับมาและยื่นต้นฉบับให้ผู้ดูแลของ [employer.GetHerHis] อย่างนุ่มนวล "ท่านเห็นสิ่งนี้ไหม? ข้าอาจจะนำสิ่งนี้ไป #EMP จัดแสดง#! ช่างเป็นคัมภีร์ที่น่าทึ่ง"\n\nปรบมือเบา ๆ [employer.GetSheHe] เอนตัวเข้ามาอย่างซุกซน "ข้าชอบภาพวาดขอบกระดาษ #EMP ชิ้นนั้น#! เป็นพิเศษ ทำได้ดีมาก! เพลิดเพลินกับรางวัลของท่าน และแจ้งให้ข้าทราบหากท่านกลับมาที่ [employer.GetCapitalLocation.GetTitle.GetNameNoTierNoTooltip] อีกครั้ง"\n\nข้ายืดตัวอย่างภาคภูมิใจและพยักหน้า"
 laamp_base_learning_contract_events.4027.desc.success.standard: "มองต้นฉบับอย่างสงสัย [employer.GetTitledFirstName] ฮัมเพลงและพยักหน้า "โดยรวมแล้วเป็นงานที่ทำได้ดี — ข้าจะนำไปวางบนชั้นวางพร้อมกับงานอื่น ๆ"\n\n[employer.GetSheHe|U] ยื่นกระเป๋าขนาดพอเหมาะให้ "ข้าเชื่อว่าสิ่งนี้น่าจะชดเชยเวลาของท่านได้"\n\n"แจ้งให้ข้าทราบหากท่านต้องการลองอีกครั้งในภายหลัง" [employer.GetSheHe] กล่าวจบ ขณะที่ [employer.GetSheHe] หันหลังกลับเพื่อจากไป\n\nข้ารับกระเป๋าและพยักหน้าอย่างสุภาพ"
 laamp_base_learning_contract_events.4027.desc.success.qualified: ""ไม่... ไม่ใช่สิ่งที่ข้าคิดไว้เสียทีเดียว แน่นอนว่าเป็น #EMP งานเขียนชิ้นหนึ่ง#! แต่... " [employer.GetTitledFirstName] ย่นจมูกเล็กน้อยขณะที่ [employer.GetSheHe] ยื่นต้นฉบับให้ผู้ดูแลของ [employer.GetHerHis]\n\n"...บางทีข้าจะวางไว้ในกองใดกองหนึ่ง ข้าเชื่อว่าท่านหาทางออกเองได้ใช่ไหม?" โดยไม่รอคำตอบของข้า [employer.GetSheHe] ก็ออกจากห้องไปแล้ว\n\nข้าหยิบกระเป๋าใบเล็กข้างประตูและเริ่มเดินไปตามโถงทางเดินเพื่อหาทางออก"
 laamp_base_learning_contract_events.4027.desc.failure: ""นี่มัน... ประเภทไหนกัน..."" [employer.GetTitledFirstName] หยุดครู่หนึ่งก่อนจะโยนต้นฉบับให้ผู้ดูแลของ [employer.GetHerHis]\n\n"ท่านกล้าใช้หมึกและกระดาษที่หามาได้ยากของข้ากับ... #EMP เรื่องไร้สาระ#! นี้หรือ?"\n\nตอนนี้เดินวนเป็นวงกลมเล็ก ๆ อย่างบ้าคลั่ง [employer.GetSheHe] ขยับขมับของ [employer.GetHerHis]: "ข้าเชิญท่านมาที่บ้านของข้า ห้อง #EMP ทำงาน#! ของข้า!! และ #EMP นี่#! คือสิ่งที่ท่านคิดขึ้นมาได้? ข้าอยากจะเรียกทหารมาจัดการกับการทรยศนี้เสียจริง!""
 laamp_base_learning_contract_events.4027.a: ""พิจารณาสิ่งนี้: ท่านมีต้นฉบับที่ไม่เหมือนใครอยู่ในมือ""
 laamp_base_learning_contract_events.4027.a.tt: "มัน #EMP เป็น#! งานเขียนชิ้นเยี่ยม"
