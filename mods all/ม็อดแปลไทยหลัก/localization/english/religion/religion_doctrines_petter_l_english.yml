l_english: 
 doctrine_muhammad_succession_name:0 "การสืบทอดตำแหน่งของมุฮัมมัด"
 doctrine_muhammad_succession_desc:0 "คำถามว่าใครคือผู้สืบทอดตำแหน่งผู้นำทางจิตวิญญาณของชุมชนมุสลิมต่อจากมุฮัมมัดโดยชอบธรรมนั้นเป็นคำถามสำคัญยิ่ง"
 muhammad_succession_sunni_doctrine_name:0 "ซุนนี"
 muhammad_succession_sunni_doctrine_desc:0 "อะบูบักร์ได้รับเลือกจากประชาคมอุมมะฮ์ให้เป็นผู้นำโดยชอบธรรม ทั้งทางการเมืองและศาสนา"
 doctrine_parameter_hostility_override_muhammad_succession_sunni_doctrine_1:1 "ถือว่า [faiths|E] ซุนนีอื่น ๆ เป็น [GetHostilityLevelName( TOKEN_PARAMETER.GetIntValue )|V]"
 doctrine_parameter_hostility_override_muhammad_succession_sunni_doctrine: "ถือว่า [faiths|E] ซุนนีอื่น ๆ เป็น [GetHostilityLevelName( TOKEN_PARAMETER.GetIntValue )|V]"
 muhammad_succession_shia_doctrine_name:0 "ชีอะฮ์"
 muhammad_succession_shia_doctrine_desc:0 "อะลีได้รับการ แต่งตั้งจากมุฮัมมัดให้เป็นผู้นำแห่งประชาคมอุมมะฮ์ และสายเลือดแห่งผู้นำทางจิตวิญญาณสามารถสืบย้อนได้ผ่านทางท่านเท่านั้น"
 doctrine_parameter_hostility_override_muhammad_succession_shia_doctrine_1: "ถือว่า [faiths|E] ชีอะฮ์อื่น ๆ เป็น [GetHostilityLevelName( TOKEN_PARAMETER.GetIntValue )|V]"
 doctrine_parameter_hostility_override_muhammad_succession_shia_doctrine: "ถือว่า [faiths|E] ชีอะฮ์อื่น ๆ เป็น [GetHostilityLevelName( TOKEN_PARAMETER.GetIntValue )|V]"
 muhammad_succession_muhakkima_doctrine_name:0 "มุฮักกิมะฮ์"
 muhammad_succession_muhakkima_doctrine_desc:0 "อะลีคือผู้สืบทอดตำแหน่งโดยชอบธรรมของมุฮัมมัด และการยอมรับการตัดสินชี้ขาดของท่านในช่วงฟิตนะฮ์ครั้งแรกจึงขัดต่อพระประสงค์ของอัลลอฮ์! มีเพียงพระองค์เท่านั้นที่สามารถตัดสินผู้นำที่เหมาะสมสำหรับเราได้"
 doctrine_parameter_hostility_override_muhammad_succession_muhakkima_doctrine_1: "ถือว่า [faiths|E] มุฮักกิมะฮ์อื่น ๆ เป็น [GetHostilityLevelName( TOKEN_PARAMETER.GetIntValue )|V]"
 doctrine_parameter_hostility_override_muhammad_succession_muhakkima_doctrine: "ถือว่า [faiths|E] มุฮักกิมะฮ์อื่น ๆ เป็น [GetHostilityLevelName( TOKEN_PARAMETER.GetIntValue )|V]"
 muhammad_succession_zandaqa_doctrine_name:0 "ซันดะเกาะฮ์"
 muhammad_succession_zandaqa_doctrine_desc:0 "แม้ว่าเราอาจสืบสายของศาสดาอย่างถูกต้องหรือไม่ตามทัศนะของมุสลิมอื่น ๆ ความเชื่อของเราก็ ทำให้เราถูกมองว่าเป็นพวกนอกคอกอยู่ดี ให้คนบาปเรียกเราว่าซันดะเกาะฮ์เถิด: เรารู้ความจริง!"
