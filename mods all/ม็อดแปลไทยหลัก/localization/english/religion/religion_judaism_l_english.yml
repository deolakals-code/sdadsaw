 #Malabar
 malabarism:0 "ลัทธิมาลาบาร์"
 malabarism_adj:0 "มาลาบารี"
 malabarism_adherent:0 "ชาวมาลาบารี"
 malabarism_adherent_plural:0 "ชาวมาลาบารี"
 malabarism_desc:1 "ขณะที่ลูกหลานของเผ่าอิสราเอลกระจายไปทั่วโลก พวกเขาสร้างชุมชนเล็กๆ จากตะวันตกไปตะวันออก ทำหน้าที่เสมือนเผ่าของตนเอง หรือที่เรียกว่าชาวยิวโคชิน พวกเขาได้สร้างบ้านใหม่ในอาณาจักรโคชินทางตอนใต้ของอินเดีย ที่นั่นพวกเขาผสมผสานกับคนท้องถิ่นและแลกเปลี่ยนวัฒนธรรม"

 #Samaritan
 samaritan:0 "ลัทธิสะมาเรีย"
 samaritan_adj:0 "สะมาเรีย"
 samaritan_adherent:0 "ชาวสะมาเรีย"
 samaritan_adherent_plural:0 "ชาวสะมาเรีย"
 samaritan_desc:0 "สืบเชื้อสายมาจากเผ่าที่ตั้งรกรากในสะมาเรีย ชาวสะมาเรียปฏิบัติตามโทราห์ฉบับดั้งเดิมที่ไม่เปลี่ยนแปลง ด้วยวิธีนี้ พวกเขาจึงปฏิบัติศาสนาที่แท้จริงของโมเสส รับใช้หน้าที่โดยตรงที่พระเจ้าประทานให้"

 #Kabarism
 kabarism:1 "ลัทธิคูซาร์"
 kabarism_adj:1 "คูซาไรต์"
 kabarism_adherent:1 "คูซารี"
 kabarism_adherent_plural:1 "คูซารี"
 kabarism_desc:2 "ในฐานะชุมชนผู้เปลี่ยนศาสนา ชาวคูซารีปฏิบัติตามการตีความฮาลาคาห์แบบรับบีทั่วไป แม้จะเปลี่ยนศาสนามานานแล้ว พวกเขายังคงยึดถือความเชื่อและประเพณีท้องถิ่นบางอย่างด้วยความเคารพทางศาสนา"
 
 #Merkabah
 merkabah:0 "เมอร์คาบาห์"
 merkabah_adj:0 "เมอร์คาบาห์"
 merkabah_adherent:0 "ผู้นับถือเมอร์คาบาห์"
 merkabah_adherent_plural:0 "ผู้นับถือเมอร์คาบาห์"
 merkabah_desc:0 "รหัสยลัทธิเมอร์คาบาห์เป็นนิกายหนึ่งของรหัสยลัทธิยูดาห์ที่ได้รับอิทธิพลบางส่วนจากคำสอนไญยนิยม ความเชื่อนี้มีศูนย์กลางอยู่ที่นิมิต การใช้ชีวิตแบบนักพรตเพื่อเข้าร่วมบัลลังก์ของพระเจ้า"

 doctrine_temple_authority_name:0 "อำนาจฮาลาคาห์"
 doctrine_temple_authority_desc:0 "ฮาลาคาห์หมายถึงชุดกฎหมายและกฎเกณฑ์ที่ชาวยิวต้องดำเนินชีวิตตาม หลังจากพลัดถิ่นมาหลายศตวรรษ กลุ่มชาวยิวได้แตกแยกออกเป็นสำนักคิดต่างๆ มากมายเกี่ยวกับวิธีการตีความฮาลาคาห์อย่างเหมาะสม"
 temple_authority_rabbinic_doctrine_name:0 "แบบรับบี"
 temple_authority_rabbinic_doctrine_desc:0 "ชาวยิวแบบรับบีเชื่อว่าฮาลาคาห์สามารถตีความได้โดยรับบีเท่านั้น พวกเขาเชื่อในโทราห์ฉบับลายลักษณ์อักษรและโทราห์มุขปาฐะ ซึ่งถ่ายทอดผ่านเหล่ารับบี ความเชื่อแบบรับบีทั้งหมดถูกประมวลไว้ในทัลมุดบาบิโลน ซึ่งถือเป็นแหล่งข้อมูลหลักในการตีความและเผยแพร่ฮาลาคาห์"
 temple_authority_toric_doctrine_name:0 "แบบโทราห์"
 temple_authority_toric_doctrine_desc:0 "ศาสนายูดาห์แบบโทราห์ปฏิเสธทัลมุดและโทราห์มุขปาฐะ โดยมอบอำนาจให้แก่โทราห์ฉบับลายลักษณ์อักษรเพียงอย่างเดียว รับบีไม่สามารถเปลี่ยนแปลงหรือปรับเปลี่ยนฮาลาคาห์ได้ หน้าที่ของพวกเขาคือการตีความความหมายตามตัวอักษรของโทราห์เท่านั้น"
 temple_authority_kohanim_doctrine_name:0 "แบบโคฮานิม"
 temple_authority_kohanim_doctrine_desc:0 "ศาสนายูดาห์แบบโคฮานิมยืนยันว่าโคเฮนคือผู้มีอำนาจสูงสุดในเรื่องศาสนาทั้งหมด รวมถึงฮาลาคาห์ โคเฮนต้องสืบเชื้อสายทางบิดามาจากอาโรน พี่ชายของโมเสส"
 temple_authority_samaritan_torah_doctrine_name:0 "แบบสะมาเรีย"
 temple_authority_samaritan_torah_doctrine_desc:0 "ชาวสะมาเรียปฏิเสธอำนาจของโทราห์โดยสิ้นเชิง แต่กลับมอบอำนาจสูงสุดให้แก่โทราห์สะมาเรีย การปฏิเสธโทราห์ของพวกเขา ทำให้เพื่อนร่วมศาสนามองว่าพวกเขาเป็นพวกนอกรีตโดยทั่วไป"
 doctrine_parameter_hostility_override_temple_authority_samaritan_torah_doctrine:0 "พิจารณา [faiths|E] [GetFaithDoctrine('temple_authority_samaritan_torah_doctrine').GetBaseName] ว่าเป็น [GetHostilityLevelName( TOKEN_PARAMETER.GetIntValue )|V]"
