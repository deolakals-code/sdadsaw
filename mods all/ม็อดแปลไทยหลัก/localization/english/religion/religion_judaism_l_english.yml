 #Rabbinism
 rabbinism:0 "ศาสนายูดาห์แบบรับบี"
 rabbinism_adj:0 "แบบรับบี"
 rabbinism_adherent:0 "ผู้นับถือศาสนายูดาห์แบบรับบี"
 rabbinism_adherent_plural:0 "ผู้นับถือศาสนายูดาห์แบบรับบี"
 rabbinism_desc:1 "ศาสนายูดาห์แบบรับบีเน้นย้ำบทบาทของรับบีในฐานะผู้ตีความธรรมบัญญัติทางศาสนาแห่งฮาลาคาห์ กฎหมายและประเพณีคือสิ่งที่รับรองว่าพันธสัญญากับองค์พระผู้เป็นเจ้าจะได้รับการรักษา และเหล่ารับบีคือผู้พิทักษ์กฎหมายเหล่านั้น"

 #Karaite
 karaism:0 "ลัทธิคาราอิซึม"
 karaism_adj:0 "คาราอิซึม"
 karaism_adherent:0 "ชาวคาราอิซึม"
 karaism_adherent_plural:0 "ชาวคาราอิซึม"
 karaism_desc:0 "ในเรื่องธรรมบัญญัติทางศาสนา ทานัคเพียงอย่างเดียวคืออำนาจสูงสุดและสัมบูรณ์ บทบาทของรับบีไม่ใช่การประเมินและปรับเปลี่ยนกฎแห่งพันธสัญญา แต่คือการตีความตามความหมายตามตัวอักษร"

 #Haymanot
 haymanot:0 "ฮายมานอต"
 haymanot_adj:0 "ฮายมานอต"
 haymanot_adherent:0 "ชาวฮายมานอต"
 haymanot_adherent_plural:0 "ชาวฮายมานอต"
 haymanot_desc:0 "รับบี หรือ คาเฮน ตัดสินในเรื่องธรรมบัญญัติทางศาสนา แต่พวกเขาทำงานร่วมกับวงผู้อาวุโสที่ตัดสินในเรื่องประเพณีและวิถีชีวิต"
