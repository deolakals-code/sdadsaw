 biliku_religion_adherent: "นักคาวารา"
 biliku_religion_adherent_plural: "ชาวนักคาวารา"
 biliku_religion_desc: "นี่คือความเชื่อในหมู่เทพเจ้าผู้มีความสัมพันธ์ซับซ้อนกับมนุษยชาติ เรื่องราวของชาวนักคาวาราหลายเรื่องเกี่ยวข้องกับบรรพบุรุษผู้ยิ่งใหญ่ที่ต่อสู้กับเทพเจ้าหลักในศรัทธาของตน บางคนมองว่าเทพเจ้าหลักเป็นเทพีแมงมุมเพศหญิง ในขณะที่คนอื่น ๆ มองว่าเป็นเทพจิ้งจกเพศชาย ในทุกฉบับของเรื่องราว พระผู้สร้างได้ขว้างคบเพลิงใส่บรรพบุรุษผู้ยิ่งใหญ่ที่ขโมยไฟ แล้วจึงหายตัวไปจากโลกวัตถุนี้ด้วยความเหนื่อยหน่ายในมนุษยชาติ พระผู้สร้างได้ทิ้งเหล่าบุตรของตนไว้เบื้องหลัง ผู้ ซึ่งอยู่ในรูปลักษณ์ของสายลมเพื่อนำทั้งรางวัลและการลงทัณฑ์มาสู่มนุษย์"

