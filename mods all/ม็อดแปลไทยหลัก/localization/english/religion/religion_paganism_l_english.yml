 north_african_religion_desc:0 "ความเชื่อดั้งเดิมของชาวเบอร์เบอร์ปฏิบัติตามลัทธิบูชาผู้วายชนม์ และเชื่อว่าเมื่อผู้หนึ่งจากโลกนี้ไป ผู้นั้นจะกลายเป็นดั่งเทพในวงศ์ตระกูลของตน การบูชาศิลาและการก่อสร้างหินตั้งขนาดมหึมานำพาผู้ศรัทธาเข้าใกล้ทวยเทพมากขึ้น โดยมีเทพเจ้าหลักรองจากพระผู้สร้างคือเทพสุริยันและเทพจันทรา แม้ในหมู่ผู้ติดตามศรัทธาอื่น ๆ การผสานความเชื่อกับประเพณีพื้นบ้านแอฟริกาเหนือก็เป็นเรื่องปกติ"
 
