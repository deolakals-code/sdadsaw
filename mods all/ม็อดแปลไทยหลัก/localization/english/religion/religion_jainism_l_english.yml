 #Digambara
 digambara:0 "ทิคัมพร"
 digambara_adj:0 "ทิคัมพร"
 digambara_adherent:0 "ผู้นับถือทิคัมพร"
 digambara_adherent_plural:0 "ผู้นับถือทิคัมพร"
 digambara_desc:0 "เกวลญาณปลดปล่อยร่างกายจากความต้องการทางกายภาพทั้งหมด อย่างไรก็ตาม จิตวิญญาณสามารถปลดปล่อยได้ก็ต่อเมื่อเปลือยกายโดยสมบูรณ์ ซึ่งเป็นเหตุผลว่าทำไมพระสงฆ์ทิคัมพรจึงต้องดำรงชีวิตโดยปราศจากเสื้อผ้า"

 #Svetambara
 svetambara:0 "เศวตัมพร"
 svetambara_adj:0 "เศวตัมพร"
 svetambara_adherent:0 "ผู้นับถือเศวตัมพร"
 svetambara_adherent_plural:0 "ผู้นับถือเศวตัมพร"
 svetambara_desc:0 "เกวลญาณเป็นสภาวะของจิตวิญญาณ ไม่ใช่สภาวะทางกายภาพ ด้วยการดำเนินชีวิตที่ดีงาม บุคคลสามารถบรรลุสรรพัญญูญาณและหลุดพ้นจากวัฏสงสารอันไม่มีที่สิ้นสุด ช่วงเวลาแห่งโมกษะเองนั้นสามารถบรรลุได้ผ่านความตายเท่านั้น เมื่อบุคคลกลายเป็นสิทธะ"
