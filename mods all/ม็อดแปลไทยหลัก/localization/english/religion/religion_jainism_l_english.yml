 yapaniya_desc:1 "ศรัทธาของชาวเชนยาปนียะมีความคล้ายคลึงกับทั้งประเพณีเศวตัมพรและทิคัมพร ซึ่งกระตุ้นความศรัทธาของผู้ศรัทธาทั้งสองนิกาย นักบวชยาปนียะคาดว่าจะต้องเปลือยกาย เช่นเดียวกับนักบวชทิคัมพร แต่พวกเขาไม่ได้ยึดถือกฎเกณฑ์ที่เข้มงวดของทิคัมพร ศรัทธานี้ยังเชื่อว่าสตรีสามารถบรรลุโมกษะได้ และนักบวชหญิงเป็นเรื่องปกติในศรัทธานี้"
 yapaniya_devotee_male:0 "สาธุ"
 yapaniya_devotee_male_plural:0 "สาธุ"
 yapaniya_devotee_female:0 "สาธวี"
