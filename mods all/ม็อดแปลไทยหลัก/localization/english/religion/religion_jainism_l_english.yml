 svetambara_devotee_male_plural:0 "สาธุ"
 svetambara_devotee_female:0 "สาธวี"
 svetambara_devotee_female_plural:0 "สาธวี"

 #Yapaniya
 yapaniya:0 "ยาปนียะ"
 yapaniya_adj:0 "ยาปนียะ"
 yapaniya_adherent:0 "ผู้นับถือยาปนียะ"
