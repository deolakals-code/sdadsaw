 jain_faith_adherent:0 "Jain"
 jain_faith_adherent_plural:0 "Jains"
 jain_faith_desc:0 "Jainism is an ancient Indian religion teaching that the path to liberation and bliss is through lives of harmlessness and renunciation. Followers seek to purify the soul through strict non-violence, truthfulness, and ascetic discipline."
