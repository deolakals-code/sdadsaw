 jainism_religion_desc:0 "ชาวเชนแสวงหาหนทางตามครูทั้งยี่สิบสี่ท่าน คือ ตีรถังกร เพื่อหลุดพ้นจากวัฏสงสารอันเป็นนิรันดร์ของโลกด้วยการบรรลุสรรพัญญูญาณ คือ เกวลญาณ อหิงสาและการดำเนินชีวิตที่ดีงามเป็นหัวใจสำคัญของศาสนาเชน และบทสวดที่สำคัญที่สุดกล่าวว่า \"หน้าที่ของวิญญาณคือการช่วยเหลือ ซึ่งกันและกัน\""
