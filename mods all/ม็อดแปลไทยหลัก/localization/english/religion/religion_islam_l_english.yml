 #Ash'ari
 ashari:0 "อัชอะรียะฮ์"
 ashari_adj:0 "อัชอะรี"
 ashari_adherent:0 "ชาวอัชอะรี"
 ashari_adherent_plural:0 "ชาวอัชอะรี"
 ashari_desc:0 "สำนักคิดเทววิทยาดั้งเดิมที่เชื่อว่าอัลลอฮ์ทรงสร้างทุกช่วงเวลา แต่มนุษย์มีเจตจำนงเสรีที่จะเลือกระหว่างความดี—สิ่งที่พระผู้เป็นเจ้าทรงบัญชา—และความชั่ว—สิ่งที่พระผู้เป็นเจ้าทรงห้าม"

 #Muwalladism
 muwalladi:0 "มุวัลลัด"
 muwalladi_adj:0 "มุวัลลัด"
 muwalladi_adherent:0 "ชาวมุวัลลัด"
 muwalladi_adherent_plural:0 "ชาวมุวัลลัด"
 muwalladi_desc:1 "ห่างไกลจากศูนย์กลางของโลกอาหรับ ชาวมุสลิมไอบีเรียปรับตัวเข้ากับความเป็นจริงของการปกครองภูมิภาคที่มีประชากรคริสเตียนและยิวจำนวนมาก ซึ่งมีประเพณีแปลกประหลาดและต่างชาติ"

 #Masmudism
 masmudi:1 "อัลโมฮาด"
 masmudi_adj:1 "อัลโมฮาดี"
 masmudi_adherent:1 "ชาวอัลโมฮาดี"
 masmudi_adherent_plural:1 "ชาวอัลโมฮาดี"
 masmudi_desc:2 "ขบวนการปฏิรูปของศาสนาอิสลามนิกายซุนนีที่มีต้นกำเนิดจากชนเผ่าเบอร์เบอร์ในแอฟริกาเหนือ ขบวนการอัลโมฮาดมองว่าตนเองเป็นพวกเอกนิยมและเทศนาหลักคำสอนเรื่องเอกเทวนิยมอันบริสุทธิ์"
 masmudi_religious_head_title:0 "เคาะลีฟะฮ์"
 masmudi_religious_head_title_name:0 "รัฐเคาะลีฟะฮ์"

 #Mu'tazila
 mutazila:0 "มุอ์ตะซิละฮ์"
 mutazila_adj:0 "มุอ์ตะซิลี"
 mutazila_adherent:0 "ชาวมุอ์ตะซิละฮ์"
 mutazila_adherent_plural:0 "ชาวมุอ์ตะซิละฮ์"
 mutazila_desc:0 "สำนักคิดเทววิทยาเหตุผลนิยมที่ยืนยันว่าอัลกุรอาน #EMP ไม่ได้#! ดำรงอยู่ร่วมกับพระผู้เป็นเจ้าชั่วนิรันดร์ เนื่องจากพระผู้เป็นเจ้าต้องมีอยู่ก่อนพระวจนะของพระองค์เอง"

 #Maturidi
 maturidi:0 "มาตุรีดียะฮ์"
 maturidi_adj:0 "มาตุรีดี"
 maturidi_adherent:0 "ชาวมาตุรีดี"
 maturidi_adherent_plural:0 "ชาวมาตุรีดี"
 maturidi_desc:0 "เทววิทยาเหตุผลนิยมที่สนับสนุนว่าจริยธรรมมีอยู่จริงอย่างเป็นรูปธรรม ซึ่งได้มาจากคุณลักษณะอันเป็นนิรันดร์ของพระผู้เป็นเจ้า ดังนั้นมนุษย์จึงต้องแสวงหาทางเลือกทางจริยธรรม"
 
 #Quranism
 quranist:0 "กุรอานนิยม"
 quranist_adj:0 "กุรอานนิยม"
 quranist_adherent:0 "ชาวกุรอานนิยม"
 quranist_adherent_plural:0 "ชาวกุรอานนิยม"
 quranist_desc:0 "การตีความศาสนาอิสลามตามตัวอักษรที่เน้นว่าอัลกุรอานเป็นแหล่งเดียวของปัญญาอันศักดิ์สิทธิ์ และควรปฏิบัติตามอย่างเคร่งครัด โดยไม่สนใจหะดีษและฟัตวา"

 #Ismaili
 ismaili:0 "อิสมาอีลียะฮ์"
 ismaili_adj:0 "อิสมาอีลี"
 ismaili_adherent:0 "ชาวอิสมาอีลี"
 ismaili_adherent_plural:0 "ชาวอิสมาอีลี"
 ismaili_desc:0 "นิกายชีอะฮ์ที่ถือว่าสายของอิมามที่แท้จริง—ผู้เปี่ยมด้วยความรู้อันศักดิ์สิทธิ์และปราศจากข้อผิดพลาด—สืบทอดผ่านอิสมาอีล บิน ญะอ์ฟัร พวกเขายังเป็นที่รู้จักในนามผู้นับถือเจ็ดอิมาม เนื่องจากอิสมาอีลเป็นอิมามองค์ที่เจ็ดหลังจากมุฮัมมัด"

 #Qarmatians
 qarmatian:0 "ก็อรมาฏียะฮ์"
 qarmatian_adj:0 "ก็อรมาฏี"
 qarmatian_adherent:0 "ชาวก็อรมาฏี"
 qarmatian_adherent_plural:0 "ชาวก็อรมาฏี"
 qarmatian_desc:0 "สาขาหนึ่งของอิสมาอีลียะฮ์ที่ผสมผสานองค์ประกอบของศาสนาโซโรอัสเตอร์ จำนวนอิมามถูกกำหนดไว้ล่วงหน้าโดยพระผู้เป็นเจ้าให้มีเจ็ดองค์ ดังนั้นจึงไม่สามารถมีอิมามเพิ่มได้อีกก่อนที่อิมามองค์ที่เจ็ด—มุฮัมมัด อิบน์ อิสมาอีล—จะกลับมานำทางผู้ศรัทธา"

 #Nizari
 nizari:0 "นิซารียะฮ์"
 nizari_adj:0 "นิซารี"
 nizari_adherent:0 "ชาวนิซารี"
 nizari_adherent_plural:0 "ชาวนิซารี"
 nizari_desc:0 "นิกายเหตุผลนิยมที่เน้นการใช้เหตุผลในการตีความอัลกุรอานและหะดีษ การเป็นอิมามเป็นการสืบทอดทางสายเลือด และพวกเขาสืบสายการสืบทอดไปยังอะลี"
 
 #Zayidi
 zayidi:0 "ซัยดียะฮ์"
 zayidi_adj:0 "ซัยดี"
 zayidi_adherent:0 "ชาวซัยดี"
 zayidi_adherent_plural:0 "ชาวซัยดี"
 zayidi_desc:0 "อิมามที่แท้จริงไม่ใช่ผู้ที่ไม่มีข้อผิดพลาด แต่ถูกนิยามโดยการต่อสู้กับการทุจริตและความชั่วร้าย ดังนั้น ชาวซัยดีจึงถูกนิยามโดยความเชื่อที่ว่าซัยด์ อิบน์ อะลีเป็นผู้สืบทอดตำแหน่งอิมามโดยชอบธรรม เนื่องจากการกบฏของท่านต่อราชวงศ์อุมัยยะฮ์"

 #Imamism (Twelver)
 imami:0 "อิมามียะฮ์"
 imami_adj:0 "อิมามี"
 imami_adherent:0 "ชาวอิมามี"
 imami_adherent_plural:0 "ชาวอิมามี"
 imami_desc:0 "ชาวอิมามีเชื่อว่าอิมามสิบสององค์ได้รับการพยากรณ์ว่าจะนำประชาคมอุมมะฮ์ และอิมามองค์ที่สิบสอง อิมามซะมาน กำลังรอคอยที่จะกลับมานำชาวมุสลิมเข้าสู่วันพิพากษา"
