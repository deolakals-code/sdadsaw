 #
 ghulat:1 "อิคติลาฟ"
 ghulat_adj:1 "อิคติลาฟี"
 ghulat_adherent:1 "ชาวอิคติลาฟี"
 ghulat_adherent_plural:1 "ชาวอิคติลาฟี"
 ghulat_desc:1 "ชาวอิคติลาฟีเชื่อในธรรมชาติอันศักดิ์สิทธิ์ของอิมามผู้ไม่มีข้อผิดพลาด เริ่มต้นด้วยอะลี พระผู้เป็นเจ้าไม่เพียง แต่ทรง แต่งตั้งและดลใจพวกเขาเท่านั้น แต่ยังสถิตอยู่ในพวกเขาบางส่วนเพื่อนำทางการกระทำของพวกเขา และโดยขยายผลไปยังประชาคมอุมมะฮ์ทั้งหมด"

 alawite:0 "อะละวียะฮ์"
 alawite_adj:0 "อะละวี"
 alawite_adherent:0 "ชาวอะละวี"
 alawite_adherent_plural:0 "ชาวอะละวี"
 alawite_desc:0 "คำสอนทางศาสนาของชาวอะละวีเป็นความลับ และอัลกุรอานเป็นเพียงหนึ่งในคัมภีร์ศักดิ์สิทธิ์ของพวกเขา นอกเหนือจากความเชื่อในการสืบทอดตำแหน่งอิมามผ่านทางอะลีแล้ว ชาวอะละวียังเชื่อในการกลับชาติมาเกิด และเชื่อว่าสรรพสิ่งทั้งปวงเคยเป็นดวงดาวที่ถูกขับไล่ออกจากสวรรค์ ซึ่งบัดนี้ต้องกลับมาสร้างคุณงามความดีและดำเนินชีวิตอย่างศรัทธาเพื่อกลับคืนสู่ที่เดิม"

 #Alevis
 alevi:0 "อะเลวี"
 alevi_adj:0 "อะเลวี"
 alevi_adherent:0 "ชาวอะเลวี"
 alevi_adherent_plural:0 "ชาวอะเลวี"
 alevi_desc:0 "ชาวอะเลวีเชื่อในการสืบทอดตำแหน่งของอิมามสิบสององค์ แต่ยังปฏิบัติตามประเพณีอื่น ๆ อีกมากมายตามที่ระบุไว้ในชุดคัมภีร์ศักดิ์สิทธิ์ของพวกเขา คือ บูยุรุกส์ ในประเพณีอะเลวี พระผู้เป็นเจ้าคือสัจธรรม และมุฮัมมัดกับอะลีคือการสำแดงของพระองค์ในโลก"
