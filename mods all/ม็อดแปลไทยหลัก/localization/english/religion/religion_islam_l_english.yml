 druze_adj:0 "ดรูซ"
 druze_adherent:0 "ชาวดรูซ"
 druze_adherent_plural:1 "ชาวดรูซ"
 druze_desc:0 "มาจากภูเขาแห่งดรูซ ศรัทธาของชาวดรูซปฏิบัติตามหลักการหลายประการของอิสมาอีลียะฮ์ แต่ยัง รวมถึงความเชื่อแบบนอสติกในเทววิทยาอันลึกลับที่มุ่งเน้นไปที่สัจธรรมแห่งการดำรงอยู่"
