 ibadi_adj:0 "อิบาฎี"
 ibadi_adherent:0 "ชาวอิบาฎี"
 ibadi_adherent_plural:0 "ชาวอิบาฎี"
 ibadi_desc:0 "ชาวอิบาฎีไม่เชื่อว่าจำเป็นที่อิสลามทั้งหมดจะต้องถูกปกครองโดยเคาะลีฟะฮ์หรืออิมาม หากไม่มีผู้สมัครที่เหมาะสม ดังนั้นพวกเขาจึงเป็นมุฮักกิมะฮ์ ไม่ยอมรับทั้งสายของอะลีหรือผู้สืบทอดของอะบูบักร์ว่าเป็นผู้นำที่คู่ควร"

