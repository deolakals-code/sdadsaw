 azariqa_adherent:0 "ชาวอะซาริเกาะฮ์"
 azariqa_adherent_plural:0 "ชาวอะซาริเกาะฮ์"
 azariqa_desc:0 "เนื่องจากไม่ยอมรับผู้สืบทอดที่คู่ควรต่อจากมุฮัมมัด ชาวอะซาริเกาะฮ์จึงถือเป็นสิทธิ์และหน้าที่ของตนที่จะต่อสู้กับผู้นำใด ๆ ที่ไม่ยึดมั่นในคุณค่าแห่งศรัทธาของตน อันที่จริง ความแตกต่างใด ๆ ในการตีความศรัทธาจะถือว่าผู้นั้นเป็นผู้ไร้ศรัทธา"

 #Najdat
 najdat:0 "นัจดัต"
 najdat_adj:0 "นัจดัต"
 najdat_adherent:0 "ชาวนัจดาตี"
 najdat_adherent_plural:0 "ชาวนัจดาตี"
 najdat_desc:0 "ผู้ยึดมั่นในสาขานัจดาตีของเคาะวาริจเชื่อมั่นอย่างแน่วแน่ในการสถาปนาผู้นำมุสลิมผ่านฉันทามติของผู้ศรัทธา ผู้นำไม่ใช่ผู้ไม่มีข้อผิดพลาด แต่ผ่านทางชุมชน พวกเขาได้รับเลือกจากพระผู้เป็นเจ้า"
 
 #Sufri
 sufri:0 "ศุฟรี"
 sufri_adj:0 "ศุฟรี"
 sufri_adherent:0 "ชาวศุฟรี"
 sufri_adherent_plural:0 "ชาวศุฟรี"
 sufri_desc:0 "ชาวศุฟรีเชื่อในการนำทางและความเป็นผู้นำอันศักดิ์สิทธิ์ผ่านการตีความพระวจนะของพระผู้เป็นเจ้า แทนที่จะเป็นการสืบทอดทางสายเลือด พระประสงค์ของพระผู้เป็นเจ้าเป็นที่รู้จักในฐานะการแสดงออกถึงเจตจำนงของประชาคมอุมมะฮ์ ตราบใดที่ผู้คนในประชาคมอุมมะฮ์มีความรอบรู้ในอัลกุรอาน"

 #Hafizi
 hafizi:0 "ฮาฟิซี"
 hafizi_adj:0 "ฮาฟิซี"
 hafizi_adherent:0 "ชาวฮาฟิซี"
 hafizi_adherent_plural:0 "ชาวฮาฟิซี"
 hafizi_desc:0 "ชาวฮาฟิซีให้ความสำคัญกับการสนับสนุนผู้ที่พวกเขาถือว่าเป็นเคาะลีฟะฮ์ที่แท้จริงเหนือสิ่งอื่นใด ตลอดจนต่อต้านความพยายามใด ๆ ทั้งหมดที่จะโค่นล้มหรือปลดพวกเขาออกจากตำแหน่ง ในความพ่ายแพ้ พวกเขาถูกนิยามโดยการกบฏเพื่ออุดมการณ์อันคู่ควร และในชัยชนะ คือการยึดมั่นอย่างภาคภูมิใจต่อเจตจำนงของผู้นำของตน"
 sadr_al_islam: "Sadr al-Islam"
 sadr_al_islam_adj: "Muslim"
 sadr_al_islam_adherent: "Muslim"
 sadr_al_islam_adherent_plural: "Muslims"
 sadr_al_islam_desc: "In its purest form, before the emergence of schools of thought, Muslims were led by the Prophet himself with divine revelation. His sunnah was followed by the companions and the tabi'un of the first few generations."
 sunni: "Sunni"
 sunni_adj: "Sunni"
 sunni_adherent: "Sunni"
 sunni_adherent_plural: "Sunnis"
 sunni_desc: "Sunni refers to followers of Muhammad's practices, known as the sunna. Sunni Islamic jurisprudence primarily relies on the Quran, hadith, and ijma (scholarly consensus) as its foundational sources."
 shia: "Shia"
 shia_adj: "Shia"
 shia_adherent: "Shi'ite"
 shia_adherent_plural: "Shi'ites"
 shia_desc: "A branch of Islam that believes leadership should stay within the Prophet Muhammad's family and be passed down through divinely guided Imams. It focuses on devotion to the Prophet's household."
 kharijite: "Kharijite"
 kharijite_adj: "Kharijite"
 kharijite_adherent: "Kharijite"
 kharijite_adherent_plural: "Kharijites"
 kharijite_desc: "An early Islamic group believed leadership should be based on piety, not lineage, and sinful rulers could be removed. They emerged during the Shia upheavals, rejected both sides, and declared grave sinners outside Islam."
