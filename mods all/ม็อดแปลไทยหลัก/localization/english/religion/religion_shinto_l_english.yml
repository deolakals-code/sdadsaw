 # Shinto
 shinto: "ชินโต" # 神道
 shinto_adj: "ชินโต"
 shinto_adherent: "ชาวชินโต"
 shinto_adherent_plural: "ชาวชินโต"
 shinto_desc: "โลกวิญญาณอยู่รอบตัวเรา และเหล่าดวงวิญญาณสถิตอยู่ทั่วทุกหนแห่งในโลก ทุกสิ่งสามารถถูกสิงสถิตได้โดยพลังเหนือธรรมชาติ — เตียงนอน ภูเขา หรือแม้กระทั่งพายุฝน การรักษาสมดุลกับโลกวิญญาณนี้จึงเป็นสิ่งสำคัญ รวมถึงการให้ความเคารพและการยอมรับตามสมควร"
 # Shugendo
 shugendo: "ชูเก็นโด" # 修験道
 shugendo_adj: "ชูเก็นโด"
 shugendo_adherent: "ชาวชูเก็นโด"
 shugendo_adherent_plural: "ชาวชูเก็นโด"
 shugendo_desc: "หนทางสู่พลังทางจิตวิญญาณนั้นต้องผ่านการฝึกฝนตน เพื่อที่จะเข้าใจโลกวิญญาณ เหล่าผู้ติดตามชูเก็นโดจะประกอบพิธีกรรมมากมาย และเสาะแสวงหาสถานที่อันศักดิ์สิทธิ์ที่สุด ที่ ซึ่งกำแพงกั้นระหว่างโลกมนุษย์และโลกวิญญาณนั้นบางเบาที่สุด"
 shugendo_devotee: "ยามาบูชิ" # 山伏
 shugendo_devoteeplural: "เหล่ายามาบูชิ"
 shinto_faith: "Shintōism"
 shinto_faith_adj: "Shintōist"
 shinto_faith_adherent: "Shintōist"
 shinto_faith_adherent_plural: "Shintōists"
 shinto_faith_desc: "Shintōism is the indigenous spiritual tradition of Japan, centered on the veneration of kami—the myriad spirits that inhabit the natural world. Its practitioners maintain harmony with nature through ritual purification and communal celebration."
