 shintoism_religion_desc: "ลัทธิชินโตครอบคลุมถึงความเชื่อพื้นบ้านก่อนยุคพุทธศาสนาแห่งหมู่เกาะญี่ปุ่น หัวใจสำคัญคือการตระหนักถึงจิตวิญญาณอันมีชีวิต หรือคามิ แห่งโลกธรรมชาติ และความจำเป็นที่จะต้องกราบไหว้บูชาและเอาอกเอาใจพวกเขาอย่างถ่อมตน เพื่อหลีกเลี่ยงความพิโรธและรับพรจากพวกเขา"

