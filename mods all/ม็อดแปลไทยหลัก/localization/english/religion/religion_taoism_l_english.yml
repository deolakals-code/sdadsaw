 #Zhengyi
 zhengyi:0 "เจิ้งอี"
 zhengyi_adj:0 "เจิ้งอี"
 zhengyi_adherent:0 "ผู้นับถือเจิ้งอี"
 zhengyi_adherent_plural:0 "ผู้นับถือเจิ้งอี"
 zhengyi_desc:0 "แตกต่างจากสำนักเต๋าอื่น ๆ ผู้นับถือเจิ้งอีปฏิบัติตามลำดับชั้นทางเทววิทยาที่เข้มงวดภายใต้เทียนซือ ผู้ปฏิบัติสร้างและขายยันต์ป้องกันเพื่อป้องกันการสูญเสียชี่ พลังงานชีวิตที่หล่อเลี้ยงสิ่งมีชีวิตทั้งปวง"
 
 zhengyi_positive_afterlife:0 "วังแห่งความมืดอันยิ่งใหญ่"
 zhengyi_negative_afterlife:0 "คุกปฐพี"

 #Shangqing
 shangqing:0 "ซ่างชิง"
 shangqing_adj:0 "ซ่างชิง"
 shangqing_adherent:0 "ผู้นับถือซ่างชิง"
 shangqing_adherent_plural:0 "ผู้นับถือซ่างชิง"
 shangqing_desc:0 "ลัทธิเต๋าซ่างชิงเป็นรูปแบบที่โดดเด่นของลัทธิเต๋าในสมัยราชวงศ์ถัง ผู้ติดตามพยายามประสานตนเองเข้ากับจักรวาลผ่านการทำสมาธิและการออกกำลังกาย ตรงข้ามกับการใช้ยันต์และการเล่นแร่แปรธาตุที่ใช้โดยสาขาอื่น ๆ ของลัทธิเต๋า"

 #Quanzhen
 quanzhen:0 "ฉวนเจิน"
 quanzhen_adj:0 "ฉวนเจิน"
 quanzhen_adherent:0 "ผู้นับถือฉวนเจิน"
 quanzhen_adherent_plural:0 "ผู้นับถือฉวนเจิน"
 quanzhen_desc:0 "ผู้ติดตามลัทธิเต๋าฉวนเจินฝึกฝนการเล่นแร่แปรธาตุภายในเพื่อ ทำให้ร่างกายสมบูรณ์แบบและประสานตนเองเข้ากับเต๋า ผ่านกระบวนการนี้ ผู้ปฏิบัติจะบรรลุอายุยืนยาวทางกายภาพและความเป็นอมตะทางจิตวิญญาณ"
