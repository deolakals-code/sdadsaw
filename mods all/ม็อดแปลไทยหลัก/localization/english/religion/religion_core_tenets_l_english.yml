 tenet_extinction_of_dharma_desc: "เหล่าอสูรเดินปะปนบนผืนปฐพีในคราบของผู้เคร่งศาสนาและผู้ศรัทธา; ผู้ใดสังหารหนึ่งจักก้าวเข้าสู่ความเป็นพุทธะหนึ่งก้าว, ผู้ใดสังหารสิบจักก้าวเข้าสู่ความเป็นพุทธะสิบก้าว"

 tenet_cranial_trophies_name: "เครื่องบรรณาการกะโหลก"
 tenet_cranial_trophies_desc: "ศีรษะคือภาชนะบรรจุแก่นแท้ของเจ้าของ. ด้วยการตัดมันและสกัดเอาสิ่งที่อยู่ภายในออกมา เราสามารถอ้างสิทธิ์ในพลังงานทางจิตวิญญาณอันทรงพลังเพื่อตนเองได้"
 doctrine_parameter_killing_bestows_heads: "เป็นไปได้ที่จะได้รับ [artifact|E] เครื่องบรรณาการกะโหลก เมื่อ [executing|E] ตัวละครอื่น, สังหารพวกเขาใน [single_combat_duel|E], หรือฆ่าพวกเขาใน [battle|E]"
 doctrine_parameter_decapitation_steals_prestige_as_piety: "เมื่อได้รับ [artifact|E] เครื่องบรรณาการกะโหลก, ผู้สังหารจะได้รับ [piety|E] เพิ่มเติมตามสัดส่วนของ [prestige|E] ของผู้ตาย"

 tenet_benevolent_governance_name: "การปกครองอันเมตตา"
 tenet_benevolent_governance_desc: "ผู้ที่ปกครองเหนือมวลชนมีหน้าที่ทางศีลธรรมในการส่งเสริมสิ่งที่ดงามและละเว้นจากสิ่งที่ชั่วร้าย. มีเพียงการยึดมั่นในหลักการนี้เท่านั้นที่ผู้ปกครองจะสามารถเป็นผู้เที่ยงธรรมอย่างแท้จริงได้"
 tenet_filial_piety_name: "ความกตัญญูกตเวที"
 tenet_filial_piety_desc: "ความกตัญญูกตเวทีและการเชื่อฟังผู้อาวุโสเป็นพื้นฐานในการบรรลุความดีงามของมนุษย์. เมื่อบิดามารดาของเรายังมีชีวิตอยู่, เรารับใช้พวกเขาด้วยความเหมาะสม; เมื่อพวกเขาถึงแก่กรรม, เราฝังศพพวกเขาด้วยความเหมาะสม, และจากนั้นบูชาพวกเขาด้วยความเหมาะสม"
 tenet_harmonious_society_name: "สังคมอันปรองดอง"
 tenet_harmonious_society_desc: "ทุกสิ่งต้องสมดุล: ปัจเจกบุคคล, ธรรมชาติ, สังคม. โอรสแห่งสวรรค์เป็นผู้กำหนดจังหวะ และเราปฏิบัติตามเสียงสวดของพระองค์"
