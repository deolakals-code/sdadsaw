 doctrine_parameter_sway_scheme_piety: "[schemes|E] [GetScheme('sway').GetTypeName] ที่ประสบความสำเร็จ ซึ่งเป้าหมายคือ [liege|E] หรือ [vassals|E] ของท่านจะให้ [piety_i][piety|E]"
 doctrine_parameter_more_often_zealots: "[vassals|E] มีแนวโน้มที่จะมี [vassal_stance|E] [GetVassalStance( 'zealot' ).GetTextIcon][GetVassalStance( 'zealot' ).GetName] มากขึ้น"
