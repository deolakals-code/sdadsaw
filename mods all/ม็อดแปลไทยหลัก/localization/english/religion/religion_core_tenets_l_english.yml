 tenet_pursuit_of_power_name:0 "การแสวงหาอำนาจ"
 tenet_pursuit_of_power_desc:0 "สิ่งที่ชอบธรรมและไม่ชอบธรรมนั้นไม่จีรัง ถูกกำหนดโดยผู้ที่กุมอำนาจอยู่ในปัจจุบัน ซึ่งหมายความว่าการแสวงหาอำนาจเป็นสาเหตุเดียวที่ชอบธรรมอย่างแท้จริง"

