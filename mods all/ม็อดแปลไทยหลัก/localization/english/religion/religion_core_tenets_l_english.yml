 tenet_sacred_destruction_desc: "มิอาจมีการสร้างสรรค์หากปราศจากการทำลาย. เพื่อให้สิ่งใหม่เริ่มต้น สิ่งเก่าต้องจบสิ้น"
 doctrine_parameter_successful_sieges_give_piety: "การชนะ [siege|E] เชิงรุกจะให้ [piety|E] และทำลาย [development|E] ของ [county|E] มากขึ้น"
