 doctrine_parameter_hostility_override_special_doctrine_is_gnostic_faith:0 ""
 doctrine_parameter_granting_titles_gives_stress:0 "การมอบ [titles|E] จะช่วยลด [stress|E] ตามสัดส่วน"

 tenet_mendicant_preachers_name:0 "นักเทศน์ภิกขาจาร"
 tenet_mendicant_preachers_desc:0 "มิชชันนารีของเราเดินทางไปทั่วทุกสารทิศโดยไม่มีสิ่งใดติดตัวนอกจากเสื้อผ้าที่สวมใส่ พวกเขาดำรงชีวิตอยู่ได้ด้วยความเอื้อเฟื้อของผู้ที่พวกเขาไปเยี่ยมเยียน และแบ่งปันความรู้เกี่ยวกับศรัทธาที่แท้จริงเป็นการตอบแทน"
 doctrine_parameter_mendicant_preachers_conversion_active:0 "ความเร็วในการเปลี่ยนศรัทธาเคาน์ตี: #P +33#!"

 tenet_communal_identity_name:0 "อัตลักษณ์ชุมชน"
 tenet_communal_identity_desc:0 "ศรัทธาและวัฒนธรรมของเราเชื่อมโยงกันอย่างแท้จริง แนวปฏิบัตินี้เสริมสร้างความผูกพันในชุมชนของเรา แม้ว่าจะมีแนวโน้มที่จะกีดกันชาวต่างชาติก็ตาม"
 doctrine_parameter_same_communal_identity_opinion_active:0 "[opinion|E] #P +10#! กับตัวละครที่มี [faith|E] เดียวกัน"
 doctrine_parameter_same_culture_conversion_bonus_active:1 "ความเร็วในการเปลี่ยนศรัทธาใน [counties|E] ที่มี [culture|E] ของข้าพเจ้า: #P +50%#!"
 doctrine_parameter_same_faith_promote_culture_bonus_active:1 "ความเร็วในการส่งเสริมวัฒนธรรมใน [counties|E] ที่มี [faith|E] ของข้าพเจ้า: #P +50%#!"
 doctrine_parameter_other_culture_conversion_penalty_active:1 "ความเร็วในการเปลี่ยนศรัทธาใน [counties|E] ที่มี [culture|E] แตกต่างกัน: #N -50%#!"

 tenet_pentarchy_name:0 "สังฆาธิปไตย"
 tenet_pentarchy_alternate_name:0 "ปัญจาธิปไตย"
 tenet_pentarchy_desc:0 "สถานที่ศักดิ์สิทธิ์ของเราเป็นมากกว่าสถานที่ศักดิ์สิทธิ์ — แต่เป็นศูนย์กลางอำนาจที่ผู้นำทางศาสนาของเราปกครอง"

 tenet_aniconism_name:0 "อรูปนิยม"
 tenet_aniconism_desc:0 "การบูชารูปเคารพได้บดบังผู้คนจำนวนมากเกินไปจากความจริงอันศักดิ์สิทธิ์ เราจะขับไล่รูปเคารพทั้งหมดออกจากสถานที่ศักดิ์สิทธิ์ของเรา เพื่อให้ผู้ศรัทธาของเราไม่ตกไปสู่กับดักนั้น"
 doctrine_parameter_reforging_artifacts_costs_piety:0 "[rulers|E] ของ [faith|E] นี้ต้องใช้ [piety|E] เพื่อ [reforge|E] หรือ [repair|E] [artifacts|E]"
 doctrine_parameter_destroying_artifacts_is_pious:0 "[rulers|E] ของ [faith|E] นี้สามารถทำลาย [artifacts|E] เพื่อรับ [piety|E] ได้"
 destroying_artifacts_is_not_pious_tt:0 "[faith|E] ของท่านไม่สามารถทำลาย [artifacts|E] เพื่อรับ [piety|E] ได้"
 artifact_is_rarer_than_masterwork_tt:0 "[artifact|E] นี้มี [rarity|E] สูงกว่าระดับ Masterwork"

 tenet_alexandrian_catechism_name:0 "คำสอนแห่งอเล็กซานเดรีย"
 tenet_alexandrian_catechism_desc:0 "โรงเรียนคำสอนแห่งอเล็กซานเดรียมีประเพณีอันยาวนานในการส่งเสริมให้นักเทววิทยาคิดวิเคราะห์และตั้งคำถามกับสภาพที่เป็นอยู่\n\nแม้ว่าโรงเรียนจะถูกทำลายทางกายภาพไปแล้ว เรายังคงสืบทอดประเพณีเหล่านี้ต่อไป"
 tenet_islamic_rationalism_name: "เหตุผลนิยมอิสลาม"
 tenet_islamic_rationalism_desc: "เนื่องจาก [ROOT.Faith.HighGodNameAlternate] ทรงยุติธรรมและปรีชาญาณ [ROOT.Faith.HighGodNameSheHe|U] จึงไม่สามารถขัดต่อเหตุผลหรือเพิกเฉยต่อความเป็นอยู่ที่ดีของสรรพสิ่งที่ [ROOT.Faith.HighGodHerHis|U] ทรงสร้างได้ เพียงผ่านเหตุผลที่ไม่ต้องพึ่งพาสิ่งใดเท่านั้นที่เราจะหวังเข้าใจส่วนของเราในงานอันยิ่งใหญ่ของ [ROOT.Faith.HighGodHerHis|U] และแยกแยะความดีออกจากความชั่วได้"

 tenet_hedonistic_name:0 "สุขนิยม"
 tenet_hedonistic_desc:0 "พระเจ้าทรงเติมเต็มโลกนี้ด้วยความสุขสำราญมากมาย เพื่อให้เราได้ดื่มด่ำและเพลิดเพลิน — การไม่เข้าร่วมในสิ่งเหล่านั้นถือเป็นการดูหมิ่นต่องานสร้างโลกของพระองค์เอง"
 doctrine_parameter_piety_from_feasts_active:1 "การจัด [GetActivityType('activity_feast').GetName] จะได้รับ [piety|E]"
 doctrine_parameter_piety_from_festivals_active: "[AddLocalizationIf( HasDlcFeature( 'all_under_heaven' ), 'doctrine_parameter_piety_from_festivals_active_auh')]" # Only show if you have AUH
 doctrine_parameter_piety_from_festivals_active_auh: "การจัด [GetActivityType('activity_festival').GetName] จะได้รับ [piety|E]"

 tenet_carnal_exaltation_name:0 "การเชิดชูทางกามารมณ์"
 tenet_carnal_exaltation_desc:0 "ความสุขทางเนื้อหนังนั้นสูงส่งในลักษณะที่เหนือกว่าประสบการณ์ทางโลกอื่น ๆ ทำให้เราเข้าใกล้พระเจ้ามากขึ้น เราควรเชิดชูความปรารถนาทางเพศของเราและแสวงหาโอกาสที่จะเติมเต็มความปรารถนาเหล่านั้น"

 tenet_polyamory_name:0 "พหุสมร"
 tenet_polyamory_desc:0 "ความรักที่เรามีต่อกันควรปราศจากเงื่อนไข เช่นเดียวกับความรักของ [ROOT.Faith.FertilityGodNamePossessive] ที่มีต่อเรา เราต้องละทิ้งแนวคิดที่ล้าสมัยเรื่องการที่คนคนหนึ่งเป็นเจ้าของความรักของอีกคนหนึ่ง"
 doctrine_parameter_no_unfaithfulness_penalty_active:0 "ผู้นับถือจะไม่ได้รับบทลงโทษทาง [opinion|E] หรือ [imprisonment_reasons|E] ต่อคู่สมรสหรือชู้รักของคู่สมรสสำหรับการมีความสัมพันธ์นอกสมรส"

 tenet_unrelenting_faith_name:0 "ศรัทธาอันไม่ย่อท้อ"
 tenet_unrelenting_faith_desc:0 "ความเชื่อมั่นของเราแข็งแกร่ง และเรายินดีที่จะต่อสู้และตายเพื่อศรัทธาของเรา ไม่ว่าโอกาสจะเลวร้ายเพียงใด เราจะไม่ยอมจำนน"
 tenet_unrelenting_faith_zandik_name: "กบฏอันชอบธรรม"
 tenet_unrelenting_faith_zandik_desc: "เราไม่ปรารถนาที่จะทำร้ายจิตวิญญาณใด ๆ หรือสิ่งใด ๆ แต่หากวิถีทางของเราถูกคุกคาม เราจะปกป้องมันด้วยความดุร้ายอย่างไม่ลดละ"

 tenet_rite_name:0 "จารีตพิธี"
 tenet_rite_desc:0 "ความเชื่อของเราไม่ได้แตกต่างจากศรัทธาแม่ของเรามากนัก... เหตุใดเราจึงต้องโต้เถียงเรื่องรายละเอียดปลีกย่อยในเมื่อเราเห็นพ้องต้องกันในประเด็นหลักของหลักคำสอน และที่สำคัญที่สุดคือ อำนาจสูงสุดในการตัดสินชี้ขาด?"
 doctrine_parameter_maintains_head_of_faith_on_creation:0 "[faiths|E] ใหม่จะยังคงรักษา [head_of_faith|E] เดิมไว้เมื่อก่อตั้ง"
