 doctrine_parameter_invasion_cb_enabled:0 "[rulers|E] ที่มีชื่อเสียงสามารถใช้ [casus_belli|E] การรุกรานได้หนึ่งครั้งต่อชีวิต"
 doctrine_parameter_great_holy_wars_active_if_reformed:1 "หากมีอยู่ [head_of_faith|E] สามารถประกาศ [great_holy_wars|E] ได้ หาก [faith|E] นี้เป็นแบบ [organized|E]"

 tenet_ancestor_worship_name:0 "การบูชาบรรพบุรุษ"
 tenet_ancestor_worship_desc:0 "บรรพบุรุษของเราเฝ้าดูเราจากโลกหลังความตาย นำทางเราและชี้ทางให้เราก้าวต่อไป ด้วยเหตุนี้เราจึงต้องเคารพและให้เกียรติพวกเขา"

 tenet_adorcism_name:0 "การบูชาวิญญาณ"
 tenet_adorcism_desc:0 "วิญญาณแห่งโลกนี้สามารถสร้างผลงานอันยิ่งใหญ่ได้ทั้งดีและชั่ว โดยการให้เกียรติและเคารพพวกเขา เราทำได้เพียงหวังว่าพวกเขาจะทำความดีต่อเราและทำความชั่วต่อศัตรูของเรา"
 doctrine_parameter_spirit_possession_active:1 "เปิดใช้งาน [decision|E] 'ขอความช่วยเหลือจากวิญญาณ'"

 tenet_ritual_celebrations_name:0 "การเฉลิมฉลองตามพิธีกรรม"
 tenet_ritual_celebrations_desc:1 "การนมัสการพระเจ้าเป็นสิ่งที่ควรยกย่องและแบ่งปันกับชุมชนของเรา การจัดเทศกาลอันยิ่งใหญ่เพื่อเป็นเกียรติและสรรเสริญพระเจ้านำพาเราทุกคนมารวมกัน"
 doctrine_parameter_mandatory_feast_attendance:0 "[vassals|E] มีแนวโน้มมากขึ้นที่จะเข้าร่วมงานเลี้ยงของท่าน ผู้ที่ยังคงปฏิเสธที่จะมาจะสูญเสีย [piety|E] จากการกระทำดังกล่าว"

 tenet_sky_burials_name:0 "พิธีศพบนฟ้า"
 tenet_sky_burials_desc:1 "ผู้ตายไม่ควรถูกกักขังอยู่ใต้ดิน — เป็นการดีกว่ามากที่จะปล่อยให้พวกเขาถูกนกแร้งกิน ซึ่งเป็นการกระทำอันเอื้อเฟื้อครั้งสุดท้ายที่พวกเขาสามารถเลี้ยงดูโลกที่เคยเลี้ยงดูพวกเขาได้"
 doctrine_parameter_sky_burials_active:3 "[rulers|E] สามารถจัดพิธีศพบนฟ้าให้บรรพบุรุษของตนได้ โดยได้รับ [piety|E] และ ทำให้ [vassals|E] พอใจ\n$EFFECT_LIST_BULLET$สามารถสร้าง [duchy_building|E] [GetBuilding('charnel_grounds_01').GetName] ได้"
 can_build_towers_of_silence_active_name: "ความสามารถในการใช้ [duchy_building|E] [GetBuilding('tower_of_silence_01').GetName]"
 doctrine_parameter_can_build_towers_of_silence_active: "[vassals|E] อาจสร้าง [duchy_building|E] [GetBuilding('tower_of_silence_01').GetName] เพื่อเสริมความกระตือรือร้นของ [county|E] — #EMP หาก#! [faith|E] ของ [liege|E] ของพวกเขาไม่ได้เข้าร่วมใน $tenet_sky_burials_name$"

 tenet_sacred_childbirth_name:0 "การคลอดบุตรอันศักดิ์สิทธิ์"
 tenet_sacred_childbirth_alternate_name:0 "คูดิกิส เลมติ"
 tenet_sacred_childbirth_desc:0 "โรงอาบน้ำที่มารดาให้กำเนิดบุตรจะต้องได้รับการชำระล้างและเตรียมพร้อมด้วยพิธีกรรมที่เหมาะสม เพื่อกระตุ้นให้พระเจ้าประทานพรแก่เราในระหว่างการคลอดบุตร"
 doctrine_parameter_safer_childbirths_active:0 "มารดามีโอกาสเสียชีวิตในการคลอดบุตร #P น้อยลง#! "
 doctrine_parameter_healthier_children_active:0 "เด็กมีโอกาสเจ็บป่วยหรือตายคลอด #P น้อยลง#! "
 doctrine_parameter_piety_from_childbirth_active:0 "มารดาและบิดาได้รับ [piety|E] เมื่อบุตรของตนเกิด"
 piety_from_childbirth_toast:0 "การคลอดบุตรอันศักดิ์สิทธิ์"

 tenet_sanctity_of_nature_name:0 "ความศักดิ์สิทธิ์ของธรรมชาติ"
 tenet_sanctity_of_nature_desc:1 "โลกธรรมชาติคือการสร้างสรรค์ของพระเจ้า และเราเป็นเพียงแขกในนั้น เราต้องเคารพและให้เกียรติต้นไม้ทุกต้น สัตว์ทุกตัว และแม้ แต่พื้นดินเอง"
