 tenet_warmonger_desc:0 "ศรัทธาและสงครามเป็นของคู่กัน ผู้ที่ปฏิเสธที่จะต่อสู้ในนามของพระเจ้าไม่สามารถเรียกได้ว่าเป็นผู้ศรัทธาที่แท้จริง"
 doctrine_parameter_conquest_cb_enabled:0 "[rulers|E] มี [casus_belli|E] การพิชิตต่อผู้ปกครองเพื่อนบ้าน"
