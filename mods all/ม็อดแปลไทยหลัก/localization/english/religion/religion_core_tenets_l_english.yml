 tenet_struggle_submission_desc:0 "พระประสงค์ของพระเจ้าคือบ่อเกิดแห่งความดีทั้งปวง ดังนั้นการดำรงอยู่อย่างดีจึงตั้งอยู่บนพื้นฐานของการยอมจำนนต่อพระประสงค์นั้น ซึ่งแสดงออกผ่านการดิ้นรน เพื่อให้เป็นไปตามนั้น"
