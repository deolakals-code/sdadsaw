 doctrine_parameter_believes_in_harmony_with_nature_invisible:0 ""

 tenet_mystical_birthright_name:0 "สิทธิ์โดยกำเนิดอันเป็นมงคล"
 tenet_mystical_birthright_alternate:0 "ตาลโตส ซือเลเตช"
 tenet_mystical_birthright_desc:0 "เราทุกคนเกิดมาพร้อมกับโชคชะตา ที่สำคัญที่สุดคือชะตาของ ตาลโตส — ผู้ที่ได้รับเลือกตั้งแต่เกิดให้ใช้พลังเวทมนตร์และกลายเป็นผู้นำทางจิตวิญญาณที่ยิ่งใหญ่"
 doctrine_parameter_mystic_birthright_active:1 "เด็กอาจเกิดมาพร้อมกับลักษณะนิสัย [GetTrait('lifestyle_mystic').GetName( GetNullCharacter )] ได้ยาก"

 tenet_astrology_name:0 "โหราศาสตร์"
 tenet_astrology_desc:0 "ท้องฟ้ายามค่ำคืนคือหน้าต่างของเราสู่แดนศักดิ์สิทธิ์ ความลับและความลี้ลับอันยิ่งใหญ่ของโลกถูกเขียนไว้ที่นั่น เปิดให้ทุกคนได้เรียนรู้หากพวกเขารู้ว่าจะมองหาที่ใด"
 doctrine_parameter_divine_the_stars_active:0 "อนุญาตให้ผู้นับถือทำนายดวงดาวและพยากรณ์อนาคตของตนได้"
 tenet_divination_name: "การทำนาย"
 tenet_divination_desc: "ชะตากรรมของมนุษย์และอนาคตของโลกถูกเขียนไว้ในดวงดาวและในสัญญาณที่ซ่อนเร้น และผ่านพิธีกรรม ความฝัน และลางบอกเหตุ ผู้ปฏิบัติที่เชี่ยวชาญสามารถทำนายความลับเหล่านี้จากวิญญาณที่อยู่เหนือกว่าได้"

 tenet_sun_worship_name:0 "การบูชาพระอาทิตย์"
 tenet_sun_worship_desc:0 "ผู้ให้แสงสว่าง ผู้ให้ชีวิต เปลวไฟที่ลุกโชนตลอดกาล — มันครองราชย์อยู่สูงบนท้องฟ้าในฐานะเจ้าผู้ครองโลกที่แท้จริง"
 doctrine_parameter_summer_festivals_active:0 "การจัดงานเลี้ยงในฤดูร้อนจะได้รับ [piety|E]"
 doctrine_parameter_trial_by_sun_active:0 "[criminals|E] ที่ถูกคุมขังสามารถถูกตัดสินให้เข้ารับการพิจารณาคดีด้วยพระอาทิตย์ได้"

