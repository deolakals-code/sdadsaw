 #Abrahamic Tenets
 tenet_communion_name:0 "ศีลมหาสนิท"
 tenet_communion_desc:0 "พิธีกรรมของเรามิใช่เป็นเพียงสัญลักษณ์ — แต่เป็นการอัญเชิญการประทับอยู่ของพระเจ้าโดยแท้จริง ผู้ที่ไม่สามารถหรือไม่เข้าร่วมปฏิบัติกับเรามิอาจเป็นผู้ศรัทธาที่แท้จริงได้"
 doctrine_parameter_seek_indulgences_active:1 "ตัวละครอาจ #V ขอซื้อใบล้างบาป#! จาก [head_of_faith|E] ของตน โดยจ่าย [gold|E] เพื่อแลกกับ [piety|E]"
 doctrine_parameter_seek_indulgences_active_2:0 "ตัวละครที่ได้กระทำความผิดทาง [criminal|E] อาจ #V ขอซื้อใบล้างบาป#! เพื่อได้รับการอภัยโทษแทน"
 doctrine_parameter_excommunication_active:0 "[heads_of_faith|E] ฝ่ายจิตวิญญาณอาจ [excommunicate|E] ตัวละครอื่นใน [faith|E] ของตนได้"
 tenet_excommunicated:0 "[GetTrait('excommunicated').GetName( GetNullCharacter )]"

 tenet_armed_pilgrimages_name:0 "การจาริกแสวงบุญติดอาวุธ"
 tenet_armed_pilgrimages_desc:0 "ผู้แสวงบุญของเราเดินทางข้ามโลกเพื่อเยี่ยมชมสถานที่ศักดิ์สิทธิ์ของเรา — เรายินดีที่จะจับดาบเพื่อปกป้องพวกเขาให้ปลอดภัยจากผู้ใดก็ตามที่จะทำร้ายพวกเขา"
 doctrine_parameter_cheaper_holy_wars_active:0 "[rulers|E] ของ [faith|E] นี้ใช้ [piety|E] น้อยลง #P -20%#! ในการประกาศ [holy_wars|E]"
 doctrine_parameter_great_holy_wars_active:1 "หากมีอยู่ [head_of_faith|E] สามารถประกาศ [great_holy_war|E] ได้เมื่อ [faith|E] มี [fervor|E] สูง"
 doctrine_parameter_ghw_no_hof_conversion_buffs_active:0 "หากไม่มี [head_of_faith|E] ผู้นับถือจะได้รับโบนัสสำหรับ [councillor_task|E] [convert_county|E] ต่อ [holy_site|E] ที่ควบคุมอยู่"
 doctrine_parameter_pilgrimage_decision_active:1 "ตัวละครของ [faith|E] นี้จะได้รับโบนัสเพิ่มเติมเมื่อสำเร็จ [pilgrimage|E]"

 tenet_monasticism_name:0 "ชีวิตอารามวาสี"
 tenet_monasticism_desc:0 "ความสุขจากอาหารและเครื่องดื่มชั้นเลิศมี แต่จะ ทำให้เราไขว้เขวจากการรับใช้พระเจ้า การแยกตัวอยู่ในอารามอันห่างไกลเป็นวิธีที่ดีที่สุดในการหลีกเลี่ยงสิ่งล่อใจเหล่านี้"
 doctrine_parameter_take_vows_active:0 "[courtiers|E] สามารถปฏิญาณตนและกลายเป็น [GetTrait('devoted').GetName( GetNullCharacter )] ได้"

 tenet_divine_marriage_name:0 "การสมรสอันศักดิ์สิทธิ์"
 tenet_divine_marriage_xwedodah: "เควดอดาห์"
 tenet_divine_marriage_desc: "โดยการสมรสกับญาติสนิท เราได้เจริญรอยตามการสมรสอันศักดิ์สิทธิ์ของสิ่งมีชีวิตแรกเริ่มในการสร้างโลก คุณสมบัติที่ดีจะถูกส่งต่อในสายตระกูลของเรา และด้วยเหตุนี้เราจึงได้รับความบริสุทธิ์และความโปรดปรานในการต่อสู้อันเป็นนิรันดร์กับความชั่วร้าย"
 doctrine_parameter_divine_marriage_opinion:0 "ผู้นับถือที่สมรสกับสมาชิก [close_family|E] จะมี [opinion|E] $VALUE|0+=$ จาก [vassals|E] ที่มี [faith|E] เดียวกัน"
 doctrine_parameter_divine_marriage_piety_gain_active:2 "โบนัสการสมรสแบบ [GetFaithDoctrine('doctrine_monogamy').GetBaseName] ยังมอบ [piety|E] จำนวนมากหากท่านสมรสกับสมาชิก [close_family|E]"
 
 tenet_pacifism_name:0 "สันตินิยม"
 tenet_pacifism_desc:0 "ความรุนแรงเป็นการกระทำอันน่ารังเกียจ ซึ่งนำไปสู่ความทุกข์ ความเจ็บปวด และความเสียใจเท่านั้น โดยการพยายามหลีกเลี่ยงเมื่อใดก็ตามที่เป็นไปได้ เราสามารถสร้างสังคมที่เข้มแข็งและมั่นคงยิ่งขึ้น เพื่อให้ผู้ศรัทธาได้อาศัยอยู่"
 doctrine_parameter_holy_wars_forbidden:0 "ไม่สามารถประกาศ [holy_wars|E] หรือ [raid|E] ได้"
 doctrine_parameter_pacifist_opinion_active:0 ""
 pacifist_opinion_active_opinion_name:0 "สหายผู้รักสันติ"
 pacifist_opinion_active_county_opinion_name:0 "เคาน์ตีสหายผู้รักสันติ"
 doctrine_parameter_opinion_of_pacifist_opinion_active:0 "[opinion|E] ต่อผู้รักสันติคนอื่น: $VALUE|+=0$"
 doctrine_parameter_piety_from_long_peace:0 "ผู้ปกครองที่อยู่ในภาวะสันติเป็นเวลาอย่างน้อยสองปี จะมีการเปลี่ยนแปลง [piety|E] $VALUE|+$ ใน แต่ละเดือน"
 PIETY_LONG_PEACE:0 "สันติภาพอันยาวนาน"

 tenet_vows_of_poverty_name:0 "ปฏิญาณความยากจน"
 tenet_vows_of_poverty_desc:0 "เงินตรา ทำให้จิตใจของมนุษย์เสื่อมทรามและผลักไสพวกเขาให้ออกห่างจากศรัทธาที่แท้จริง เราต้องหลีกเลี่ยงการแสวงหาความมั่งคั่งทางวัตถุหากเราต้องการมุ่งเน้นไปที่สิ่งที่สำคัญอย่างแท้จริง"
 doctrine_parameter_vows_of_poverty_active:0 "[rulers|E] สามารถ [decide|E] ที่จะปฏิญาณความยากจน ลดรายได้ [tax|E] รายเดือน แต่เพิ่มการได้รับ [piety|E] รายเดือน"

 tenet_human_sacrifice_name:0 "การบูชายัญมนุษย์"
 tenet_human_sacrifice_desc:0 "วิธีที่ดีที่สุดในการพิสูจน์ความจงรักภักดีของเราคือผ่านการบูชายัญ การบูชายัญที่มีค่าที่สุดที่เราสามารถถวายได้คือการบูชายัญชีวิตมนุษย์"
 doctrine_parameter_human_sacrifice_active:1 "[executions|E] จะได้รับ [piety|E] แทนที่จะเสีย [piety|E]\n$EFFECT_LIST_BULLET$[executions|E] ไม่เสีย [prestige|E] เมื่อ [sharing_power|E]"
 doctrine_parameter_flower_war_cb_active:0 "มอบ [casus_belli|E] [flowery_war|E] ต่ออาณาจักรเพื่อนบ้าน"

 tenet_gruesome_festivals_blot_name:0 "พิธีโบลต"
 tenet_gruesome_festivals_name:0 "เทศกาลอันน่าสยดสยอง"
 tenet_gruesome_festivals_desc:0 "เราทุกคนเกิดมาในกองเลือด เรารอดชีวิตด้วยเลือดของปศุสัตว์ ครอบครัว ศัตรูของเรา เป็นเรื่องธรรมดาที่ [ROOT.Faith.PantheonTerm] จะเรียกร้องส่วนแบ่งอันชอบธรรมของพวกเขา"
 gruesome_festivals_active_name:0 "ความสามารถในการประกอบพิธีบูชายัญครั้งใหญ่"
 doctrine_parameter_gruesome_festivals_active:0 "สามารถจัดพิธีบูชายัญครั้งใหญ่ได้ประมาณทศวรรษละครั้งเพื่อ [county_opinion|E] และผู้ใต้ปกครองที่มี [faith|E] เดียวกัน"

 tenet_volcanic_veneration_name:0 "การบูชาภูเขาไฟ"
 tenet_volcanic_veneration_desc:0 "มีสิ่งศักดิ์สิทธิ์น้อยสิ่งนักที่จะเทียบเท่าผืนดินแรกเกิดที่พวยพุ่งออกมาจากหลุมเพลิงแห่งบ้านเกิดของเรา เราใช้ชีวิตอยู่บนขอบเหวแห่งหายนะ อยู่ภายใต้ความเมตตาของ [ROOT.Faith.PantheonTerm] ตลอดไป"
 tenet_cthonic_redoubts_name:0 "ป้อมปราการใต้พิภพ"
 tenet_cthonic_redoubts_desc:0 "ไม่มีที่พักพิงใดดีไปกว่ารากเหง้าของโลก ไม่มีป้อมปราการใดแข็งแกร่งไปกว่าสันเขาที่ยื่นออกมา ไม่มีการจาริกแสวงบุญใดศักดิ์สิทธิ์ไปกว่าเส้นทางที่ซ่อนเร้นของมัน เรามองลงมายังสรรพสิ่งที่สร้างขึ้นจากยอดเขาสูงตระหง่านเหล่านี้และสัมผัสถึงน้ำหนักที่แท้จริงของพระเจ้า"
 doctrine_parameter_easier_to_convert_faith_in_mountains:0 "ความเร็ว [convert_county|E] ใน [terrain|E] ภูเขา: #P +[EmptyScope.ScriptValue('easier_to_convert_faith_in_mountains_bonus_loc_control')|0]%#!"
 doctrine_parameter_easier_to_convert_culture_in_same_faith_mountains:0 "ความเร็ว [promote_culture|E] ใน [terrain|E] ภูเขาที่มี [faith|E] เดียวกัน: #P +[EmptyScope.ScriptValue('promote_culture_easier_to_convert_culture_in_same_faith_mountains_bonus_loc_control')|0]%#!"
 doctrine_parameter_harder_to_convert_faith_away_in_mountains:0 "ความเร็ว [convert_county|E] ของศัตรูใน [terrain|E] ภูเขา: #P [EmptyScope.ScriptValue('harder_to_convert_faith_away_in_mountains_malus_loc_control')|0]%#!"

 tenet_consolamentum_name:1 "เอ็นดูรา"
 tenet_consolamentum_name_alternate:0 "การฆ่าตัวตายตามพิธีกรรม"
 tenet_consolamentum_desc:0 "เมื่อเราแก่ชราหรือเจ็บป่วย เราจะประกอบพิธีกรรมเพื่อชำระล้างจิตวิญญาณของเราให้พ้นจากบาป เมื่อเสร็จสิ้นแล้ว เราจะจบชีวิตของเราอย่างรวดเร็วและเด็ดขาด เพื่อไม่ให้บาปมีโอกาสเข้าครอบงำเราอีกครั้ง"
 doctrine_parameter_consolamentum_active:1 "ผู้นับถือสามารถ [decide|E] ที่จะจบชีวิตตนเองเมื่อแก่ชรา ไร้ความสามารถ หรือใกล้ตาย การกระทำดังกล่าวจะไม่ได้รับบทลงโทษตามปกติจากการฆ่าตัวตาย"

 tenet_gnosticism_name:0 "ไญยนิยม"
 tenet_gnosticism_desc:0 "ด้วยความรู้ ประกายศักดิ์สิทธิ์ที่สถิตอยู่ภายในมนุษย์ทุกคนอาจได้รับการปลดปล่อยและกลับคืนสู่แหล่งกำเนิดบนสวรรค์ในแดนวิญญาณ"
