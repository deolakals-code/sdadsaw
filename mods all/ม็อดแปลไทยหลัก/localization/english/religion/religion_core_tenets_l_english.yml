 tenet_pursuit_of_knowledge_name: "การแสวงหาความรู้"
 tenet_pursuit_of_knowledge_desc: "ผู้ที่เปี่ยมด้วยความรู้โดยกำเนิดนั้นเหนือกว่าผู้ใด. ผู้ที่แสวงหาความรู้อย่างตั้งใจมาเป็นอันดับสอง. ผู้ที่ทื่อเขลาและไม่แสวงหาการเรียนรู้คือชนชั้นต่ำที่สุด"
