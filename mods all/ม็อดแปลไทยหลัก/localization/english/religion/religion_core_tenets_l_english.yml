 tenet_false_conversion_sanction_name:0 "การอนุญาตให้เปลี่ยนศรัทธาหลอกลวง"
 tenet_temporal_condemnation_taqiya:0 "ตะกียะฮ์"
 tenet_anusim:0 "อานูซิม"
 tenet_false_conversion_sanction_desc:0 "หากชีวิตของท่านถูกคุกคาม เป็นที่ยอมรับได้ที่จะยอมรับศรัทธาที่ผิดพลาด ตราบใดที่ท่านยังคงรักษาความจริงไว้ในใจ"
 doctrine_parameter_sanctioned_false_conversion:0 "ความต้านทานการเปลี่ยนศรัทธา: #P +30%#!\n$EFFECT_LIST_BULLET$[characters|E] และ [counties|E] อาจเปลี่ยนกลับมานับถือ [faith|E] นี้ได้ในบางครั้งหากถูกชักนำไปในทางที่ผิด"

 tenet_tax_nonbelievers_name:0 "การเก็บภาษีผู้ไม่ศรัทธา"
 tenet_tax_nonbelievers_desc:0 "การรับราชการทหารมีไว้สำหรับผู้ศรัทธาเท่านั้น ในขณะที่มีการเรียกเก็บภาษีจากผู้ไม่ศรัทธาเพื่อเป็นการตอบแทนการคุ้มครองที่พวกเขาได้รับ"
 tenet_tax_nonbelievers_jizya_name:0 "ภาษีญิซยะฮ์"

 tenet_literalism_name:0 "อักษรนิยม"
 tenet_literalism_desc:0 "คัมภีร์ศักดิ์สิทธิ์ของเรากล่าวถึงเจตจำนงของพระเจ้าไว้อย่างชัดเจน และการตีความของมนุษย์มีคุณค่าจำกัด"
 doctrine_parameter_literalist_debate_enabled:0 "อาจโต้วาทีกับขุนนางอื่น ๆ ในอาณาจักรโดยเสีย [opinion|E] เพื่อได้รับหรือสูญเสีย [piety|E]"

 tenet_legalism_name:0 "นิตินิยม"
 tenet_legalism_desc:0 "กฎหมายของเราเป็นผลมาจากภูมิปัญญาและความศรัทธาหลายชั่วอายุคน และการยึดถือกฎหมายเหล่านั้นถือเป็นความศรัทธาโดยเนื้อแท้ คนบาป ไม่ว่าจะเป็นใคร จะไม่มีวันอยู่เหนือกฎหมาย"
 doctrine_parameter_legalism_reduced_faction_virtues:0 "[vassals|E] และ [counties|E] มีแนวโน้มน้อยลงที่จะเข้าร่วม [factions|E] ต่อต้านผู้ปกครองที่ [virtuous|E]"
 doctrine_parameter_legalism_increased_faction_sins:0 "[vassals|E] และ [counties|E] มีแนวโน้มมากขึ้นที่จะเข้าร่วม [factions|E] ต่อต้านผู้ปกครองที่ [sinful|E]"
