 doctrine_parameter_legalism_modified_law_costs_2:0 "เพิ่มค่าใช้จ่ายด้านกฎหมายขึ้น #N 10%#! สำหรับ แต่ละ [sin|E] ที่ผู้ปกครองมี"
 doctrine_parameter_legalism_trust_just_leader_active:1 "[electors|E] ภายใต้ประเภท [succession|E] แบบเลือกตั้งมีแนวโน้มมากขึ้นที่จะลงคะแนนให้กับตัวเลือกของ [liege|E] ของตนหากเจ้าเหนือหัวของพวกเขาคือ $trait_just$"
 tenet_legalism_law_cost_tooltip:0 "[legalism|E]:\n  บาปและคุณธรรมของข้าพเจ้าส่งผลกระทบต่อสิ่งนี้โดย: [SCOPE.ScriptValue('legalism_law_cost_modifier')|-0%]"
 
 tenet_reincarnation_name:0 "การกลับชาติมาเกิด"
 tenet_reincarnation_desc:0 "เราได้ใช้ชีวิตมาหลายชาติภพก่อนหน้านี้ และจะยังคงใช้ชีวิตต่อไปอีกหลายชาติภพหลังจากนี้ ทุกความตายเป็นเพียงจุดเริ่มต้นของสิ่งใหม่"
 tenet_reincarnation_zoroastrian_name: "รัจอะฮ์"
 tenet_reincarnation_zoroastrian_desc: "เช่นเดียวกับที่เทพเจ้าสามารถจุติในร่างมนุษย์ได้ เราก็อาจเกิดใหม่ได้ เช่นกัน ผู้ทำความดีจะได้รับรางวัลเป็นรูปลักษณ์แห่งความงามและความบริสุทธิ์ และในที่สุดอาจกลายเป็นทูตสวรรค์แห่งแสงบริสุทธิ์"
 doctrine_parameter_reincarnation_resistance_to_conversion:0 "ความต้านทานการเปลี่ยนศรัทธาเคาน์ตี: #P +20%#!"
 doctrine_parameter_reincarnation_events_active:1 "เด็กมีโอกาสที่จะถูกพิจารณาว่าเป็นการกลับชาติมาเกิดของบรรพบุรุษ ทำให้ได้รับโบนัส [piety|E] และ [opinion|E]"

 tenet_esotericism_name:0 "คุยหลัทธิ"
 tenet_esotericism_kabbalah:0 "คับบาลาห์"
 tenet_esotericism_desc:0 "ความลี้ลับอันยิ่งใหญ่ของพระเจ้าอาจอยู่เหนือความเข้าใจของมนุษย์ แต่นั่นไม่ใช่ข้ออ้างสำหรับความไม่รู้ การดำรงอยู่ของสิ่งเหล่านั้นเองกระตุ้นให้เราแสวงหาความรู้และความเข้าใจเกี่ยวกับโลกรอบตัวเรา"
 doctrine_parameter_tenet_esotericism_mystic_education:2 "เด็กที่มี [education_focus|E] ด้าน [learning|E] อาจได้รับลักษณะนิสัย [GetTrait('lifestyle_mystic').GetName( GetNullCharacter )] หากพวกเขาทำผลงานการศึกษาได้ดี"
 tenet_esotericism_kabbalah_desc:0 "คำสอนของคับบาลาห์นำมา ซึ่งความเข้าใจของมนุษย์เกี่ยวกับความสัมพันธ์ระหว่างพระเจ้าผู้เป็นนิรันดร์ ธรรมชาติแห่งอนันต์ที่เรียกว่า เอน โซฟ และการสร้างโลกของพระเจ้า คับบาลาห์เป็นพื้นฐานสำหรับเวทมนตร์คาถาของชาวยิวทั้งหมด และผู้ปฏิบัติคับบาลาห์มักจะมีส่วนร่วมกับสำนักยิวอื่น ๆ"
 tenet_religious_kabbalah_cost_tooltip:0 "คับบาลาห์: #P -10%#!"

 #Eastern Tenets
 tenet_adaptive_name:0 "ปรับตัวได้"
 tenet_adaptive_desc:0 "การยึดมั่นในข้อจำกัดเก่า ๆ อย่างเคร่งครัดมี แต่จะทำร้ายผู้ศรัทธา ตราบใดที่เรายังคงยึดมั่นในความเชื่อหลักของศรัทธาของเรา เราอาจปรับกฎหมายของเราให้เข้ากับโลกรอบตัวได้"
 doctrine_parameter_tenet_adaptive_conversion_resistance:0 "ความต้านทานการเปลี่ยนศรัทธาเคาน์ตี: #P +30%#!"
 doctrine_parameter_reduced_vassal_religion_discontent:1 "[vassals|E] นอกรีตมีแนวโน้มน้อยลงที่จะเข้าร่วม [factions|E] เรียกร้องเอกราชและประชานิยม"
 doctrine_parameter_immaterial_harmony_conversion_cost_reduced: "ค่าใช้จ่าย [piety_i|E][piety|E] ในการเปลี่ยนไปนับถือ [faith|E] อื่นที่มี [doctrine|E] นี้: #P -50%#!"
 doctrine_parameter_immaterial_harmony_buddhist_take_vows: "[faiths|E] ที่เป็น [GetReligionByKey('buddhism_religion').GetAdjective] อาจใช้ [interaction|E] #V $take_vows_interaction$#!"

 tenet_inner_journey_name:0 "การเดินทางภายใน"
 tenet_inner_journey_desc:0 "เพียงแค่เข้าใจตนเองเท่านั้นที่เราจะเข้าใจโลกได้ การเดินทางเพื่อค้นพบตนเองมีความสำคัญพอ ๆ กับความยาวนานและความยากลำบาก"
 doctrine_parameter_meditation_mechanics_active:0 "ตัวละครสามารถ [decide|E] ที่จะทำสมาธิในที่ ความเงียบสงบ, ลด [stress|E] และอาจได้รับข้อมูลเชิงลึกทางเทววิทยา"

 tenet_dharmic_pacifism_name:0 "สันตินิยมแบบธรรมะ"
 tenet_dharmic_pacifism_desc:0 "เราทุกคนเป็นส่วนหนึ่งของระเบียบจักรวาล ความรุนแรงต่อสิ่งใด ๆ คือความรุนแรงต่อทุกสิ่ง รวมถึงตนเองด้วย"

 tenet_bhakti_name:0 "ภักติ"
 tenet_bhakti_patron_god_name:0 "เทพอุปถัมภ์"
 tenet_bhakti_desc:0 "มนุษย์ไม่สามารถดำเนินชีวิตให้สมกับพระสิริอันสมบูรณ์ของพระเจ้าได้ แต่โดยการเลือกแง่มุมหนึ่งของความเป็นพระเจ้าเพื่อเลียนแบบ บูชา และอุทิศตน เราสามารถเข้าใกล้พระองค์ได้มากกว่าที่จะเป็นไปได้"
 doctrine_parameter_select_personal_god_active:1 "ผู้ปกครองสามารถ [decide|E] ที่จะเลือกอวตารส่วนตัวเพื่อเคารพบูชา โดยจะได้รับโบนัสที่เกี่ยวข้อง"

 tenet_asceticism_name:0 "สมถะนิยม"
 tenet_asceticism_desc:0 "การแสวงหาทางวัตถุนิยม ทำให้เรามองไม่เห็นความจริงอันศักดิ์สิทธิ์ เพียงแค่การอุทิศตนเพื่อใช้ชีวิตเรียบง่ายปราศจากความหรูหราเท่านั้นจึงจะบรรลุการรู้แจ้งทางจิตวิญญาณได้ "

 tenet_ritual_hospitality_name:0 "การต้อนรับตามพิธีกรรม"
 tenet_ritual_hospitality_alternate_name:0 "พิธีบูชา"
 tenet_ritual_hospitality_desc:0 "การต้อนรับขับสู้เป็นหนึ่งในคุณธรรมอันยิ่งใหญ่ที่สุดที่มนุษยชาติสามารถแสดงออกได้ แขกในบ้านของเรา ไม่ว่าจะเป็นมนุษย์หรือเทพเจ้า ควรได้รับการปฏิบัติด้วยเกียรติและความเคารพสูงสุดเสมอ"
 doctrine_parameter_host_honored_guests_active:0 "[rulers|E] สามารถต้อนรับตัวละครอื่น ๆ ในฐานะแขกผู้มีเกียรติ โดยใช้ [piety|E] เพื่อแลกกับ [opinion|E] ที่เพิ่มขึ้น"

