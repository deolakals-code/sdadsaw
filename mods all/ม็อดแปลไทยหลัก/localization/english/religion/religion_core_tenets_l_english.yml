 tenet_religious_legal_pronouncements_name:0 "กฎหมายศาสนา"
 tenet_religious_legal_pronouncements_hisbah: "ฮิสบะฮ์"
 tenet_religious_legal_pronouncements_fatwa:0 "ฟัตวา"
 tenet_religious_legal_pronouncements_halakha:0 "ฮาลาคา"
 tenet_religious_legal_pronouncements_desc:0 "เส้นแบ่งระหว่างข้อโต้แย้งทางเทววิทยาและกฎหมายนั้นบางเบา และคุณสมบัติทางจิตวิญญาณสามารถและควรได้รับการพิจารณาในการตัดสินคดีทางโลก"
 doctrine_parameter_temporal_condemnation_enabled:0 "ผู้ปกครองที่มี [learning|E] สูงอาจประณามข้าหลวง [sinful|E] ของตน ยิ่งข้าหลวงทำบาปมากเท่าใด ผู้ปกครองของพวกเขาก็ยิ่งต้องการการเรียนรู้น้อยลงเท่านั้นในการประณามพวกเขา\n$EFFECT_LIST_BULLET$ข้าหลวงที่ถูกประณามจะถูกมองว่าเป็น [criminals|E] และอาจถูกเพิกถอนตำแหน่งได้"
