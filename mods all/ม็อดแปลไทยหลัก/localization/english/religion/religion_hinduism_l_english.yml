 krishnaism_adj:0 "กฤษณนิยม"
 krishnaism_adherent:0 "ผู้นับถือลัทธิกฤษณนิยม"
 krishnaism_adherent_plural:0 "ผู้นับถือลัทธิกฤษณนิยม"
 krishnaism_desc:0 "พระกฤษณะคือรูปลักษณ์ที่แท้จริงของพระผู้สูงสุด และพระวิษณุคืออวตารของพระองค์เมื่อทรงปรากฏรูปเป็นผู้ทรงอำนาจทุกอย่าง ผ่านอวตารอันศักดิ์สิทธิ์ของพระองค์ พระองค์ทรงดำรงอยู่ในทุกสรรพสิ่ง"
 krishnaism_high_god_name:0 "พระกฤษณะ"
