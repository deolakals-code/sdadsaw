 advaitism_adherent_plural:0 "ผู้นับถืออไทฺวตเวทานต์"
 advaitism_desc:0 "แตกต่างจากความเชื่อฮินดูหลายแขนง อไทฺวตเวทานต์เน้นย้ำความเป็นหนึ่งเดียวของอาตมัน ตัวตนที่แท้จริง กับพรหมัน ความจริงแท้สูงสุด และเชื่อว่าโมกษะสามารถบรรลุได้ทั้งในชีวิตนี้และหลังความตาย"

