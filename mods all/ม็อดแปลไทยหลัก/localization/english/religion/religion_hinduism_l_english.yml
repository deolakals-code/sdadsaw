 #Smartism
 smartism:1 "ลัทธิสมารตะ"
 smartism_adj:1 "สมารตะ"
 smartism_adherent:1 "สมารตะ"
 smartism_adherent_plural:1 "สมารตะ"
 smartism_desc:0 "ประเพณีสมารตะปฏิเสธการบูชาเทพเจ้าองค์ใดองค์หนึ่ง พรหมันเป็นหนึ่งเดียวและเป็นนิรันดร์ และพระวิษณุ พระเทวี พระศิวะ พระพิฆเนศ และพระสูรยะ ได้รับการบูชาในฐานะอวตารที่เท่าเทียมกันของพระผู้สูงสุด การบูชาปัจเจกบุคคลใดๆ ถือเป็นก้าวหนึ่งสู่การบรรลุความเข้าใจและความเป็นหนึ่งเดียวกับพรหมัน"

