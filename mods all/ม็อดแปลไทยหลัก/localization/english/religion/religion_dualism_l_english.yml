 sethianism_desc:0 "พระเจ้าผู้มิอาจหยั่งรู้ได้แผ่ขยายการดำรงอยู่ทั้งหมดสู่เพลโรมาอันสมบูรณ์แบบ ซึ่งเต็มไปด้วยเอออนอันประเสริฐ โดยมีบาร์เบโล พระมารดา-บิดา เป็นองค์แรก\nความเสื่อมทรามก่อให้เกิดการดำรงอยู่ของยัลดาบอธ ผู้ขโมยเศษเสี้ยวแห่งความเป็นทิพย์และสร้างโลกวัตถุขึ้นมา อย่างไรก็ตาม เมื่อเขาสร้างมนุษยชาติ เขากลับมอบประกายแห่งความเป็นทิพย์ที่ขโมยมาให้แก่มนุษย์โดยบังเอิญ ยัลดาบอธจะใช้เวลาชั่วนิรันดร์พยายามทวงคืนพลังของตน ในขณะที่มนุษยชาติต้องพยายามกลับคืนสู่บาร์เบโลและพระเจ้าผู้มิอาจหยั่งรู้"
