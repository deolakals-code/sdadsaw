 priscillianism_adherent_plural:0 "ผู้นับถือพริสซิลเลียน"
 priscillianism_desc:0 "มีอาณาจักรสองแห่งดำรงอยู่ คือ อาณาจักรแห่งแสงสว่างและอาณาจักรแห่งความมืด จิตวิญญาณของมนุษย์ถูกกำหนดให้พิชิตอาณาจักรแห่งความมืด แต่กลับตกต่ำและถูกกักขังอยู่ในแดนวัตถุ ในหมู่มนุษย์มีปฐมบรรพบุรุษแห่งแสงสิบสององค์ที่ไม่สามารถเอาชนะความมืดได้ เนื่องจากพวกเขาถูกแบ่งแยกระหว่างร่างกายและจิตวิญญาณ ดังนั้น พระเจ้าจึงส่งพระผู้ช่วยให้รอดมายังโลก และโดยผ่านความตายของพระองค์ ทำให้การปลดปล่อยจิตวิญญาณของมนุษย์เป็นไปได้อีกครั้ง"
