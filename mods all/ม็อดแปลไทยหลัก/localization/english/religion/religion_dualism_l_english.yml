 mingism_desc: "ตามหลักคำสอนของพระพุทธเจ้าหมอหนี (Buddha Móní), อาณาจักรสวรรค์แห่งแสงสว่างกำลังถูกปิดล้อมโดยอาณาจักรแห่งความมืด, และทั้งปวงต่างรอคอยวันที่จอมเทพผู้เจิดจรัส (Radiant Lord), ผู้ ซึ่งดวงอาทิตย์และดวงจันทร์ต่างแสดงความเคารพ, จะส่งสารของพระองค์มายังโลกเพื่อเผยแผ่การตรัสรู้และปลดปล่อยผู้คนจากความทุกข์ทรมาน"

