 yazidi_desc:0 "ชาวยาซิดีเชื่อว่าพระเจ้าทรงสร้างโลกและทรงมอบให้อยู่ภายใต้การคุ้มครองของทูตสวรรค์เจ็ดองค์ ผู้เป็นเอกในหมู่พวกเขาคือ ตาอูเซ เมเล็ก ทูตสวรรค์นกยูง ในตอนแรก ทูตสวรรค์นกยูงได้ตกจากพระคุณของพระเจ้า แต่น้ำตาแห่งความสำนึกผิดของพระองค์ได้ดับไฟในคุกของพระองค์ และพระองค์ก็ได้กลับคืนสู่พระเจ้าอีกครั้ง ในทำนองเดียวกัน เราทุกคนต่างแสวงหาการกลับคืนสู่พระเจ้าเมื่อสิ้นสุดชีวิตอันยาวนานหลายชาติภพ"
