 acharya_desc: "อาจารยะ, นิกายย่อยของพุทธศาสนวัชรยาน, ตกผลึกในศตวรรษที่เก้าด้วยการผสมผสานและบูรณาการของพิธีกรรมจีนและการปฏิบัติเชิงตันตระของทิเบต, ก่อให้เกิดการแสดงออก ซึ่งการปฏิบัติและการบูชาทางพุทธศาสนาอันมีลักษณะเฉพาะในระดับภูมิภาค"

