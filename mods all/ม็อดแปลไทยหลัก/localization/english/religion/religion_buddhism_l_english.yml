 maitreya_desc: "ยุคของพระศากยมุนีพุทธเจ้าได้สิ้นสุดลงและพระเมตไตรยพุทธเจ้าได้เสด็จลงมาสู่โลกแล้ว, หรือดังที่เหล่าผู้ยกย่องและน้อมรับพระเมตไตรยเป็นพระผู้ไถ่ตามคำทำนายของพวกเขาเชื่อ. มีเพียงผ่านการทำลายระเบียบเก่าเท่านั้นที่โลกจะได้รับการช่วยเหลือ"
