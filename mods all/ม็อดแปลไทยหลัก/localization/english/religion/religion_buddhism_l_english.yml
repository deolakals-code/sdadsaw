 dhyana: "ฌาน"
 dhyana_adj: "ฌาน"
 dhyana_adherent: "ผู้นับถือฌาน"
 dhyana_adherent_plural: "เหล่าผู้นับถือฌาน"
 dhyana_desc: "พุทธศาสนานิกายฌานเน้นย้ำอย่างยิ่งยวดต่อการทำสมาธิอย่างลึกซึ้งและถ่องแท้ว่าเป็นหนทางเดียวอันเป็นไปได้สู่การตรัสรู้ — บุคคลสามารถบรรลุความเข้าใจอันถ่องแท้ได้เพียงผ่านการพิจารณาตนภายในและการใคร่ครวญเท่านั้น, มิใช่ผ่านการศึกษาคัมภีร์"

 vinaya: "วินัย"
 vinaya_adj: "วินัย"
 vinaya_adherent: "ผู้นับถือวินัย"
 vinaya_adherent_plural: "เหล่าผู้นับถือวินัย"
 vinaya_desc: "เหล่าผู้นับถือพุทธศาสนานิกายวินัยยึดมั่นตนเองและผู้อื่นตามมาตรฐานทางศีลธรรมและจริยธรรมอันเคร่งครัด, ด้วยเหตุว่าการมีวินัยในตนเองคือรากฐานอันจำเป็นสำหรับการแสวงหาปัญญาอันลึกซึ้ง"
 
 pundarika: "ปุณฑริก"
 pundarika_adj: "ปุณฑริก"
 pundarika_adherent: "ผู้นับถือปุณฑริก"
 pundarika_adherent_plural: "เหล่าผู้นับถือปุณฑริก"
 pundarika_desc: "สัทธรรมปุณฑริกสูตร (The Lotus Sutra) ได้รับการเคารพบูชายิ่งกว่าคัมภีร์อื่นใดในพุทธศาสนานิกายปุณฑริก, ซึ่งเน้นย้ำมนตราและพิธีกรรมอันซับซ้อน และมีต้นกำเนิดจากการผสมผสานขององค์ประกอบเชิงตันตระและรหัสยนัยที่ถ่ายทอดสู่จีนตามเส้นทางสายไหม"

 sukhavati: "สุขาวดี"
 sukhavati_adj: "สุขาวดี"
 sukhavati_adherent: "ผู้นับถือสุขาวดี"
 sukhavati_adherent_plural: "เหล่าผู้นับถือสุขาวดี"
 sukhavati_desc: "สุขาวดี, หรือพุทธศาสนานิกายแดนสุขาวดี, สอนว่าหนทางดั้งเดิมสู่การตรัสรู้นั้นเป็นไปไม่ได้อีกต่อไป. อย่างไรก็ตาม, โดยการอ้างถึงความเมตตาของพระอมิตาภะด้วยการสวดพระนามของท่าน, ผู้นั้นอาจได้ไปเกิดใหม่ในแดนสุขาวดีของพระองค์หลังความตาย, ไม่ว่าจะเป็นภิกษุหรือคฤหัสถ์ก็ตาม"

 yogacara: "โยคาจาร"
 yogacara_adj: "โยคาจาร"
 yogacara_adherent: "ผู้นับถือโยคาจาร"
 yogacara_adherent_plural: "เหล่าผู้นับถือโยคาจาร"
 yogacara_desc: "เหล่าพุทธศาสนิกชนนิกายโยคาจารตั้งคำถามต่อสิ่งที่ผู้อื่นยึดถือเป็นเรื่องปกติมาตลอดชีวิต, โดยปฏิบัติต่อโลวัตถุว่าไม่มีอะไรมากไปกว่าการสำแดงออก ซึ่งจิตสำนึกของตนเอง"

 avatamsaka: "อวตังสกะ"
 avatamsaka_adj: "อวตังสกะ"
 avatamsaka_adherent: "ผู้นับถืออวตังสกะ"
 avatamsaka_adherent_plural: "เหล่าผู้นับถืออวตังสกะ"
 avatamsaka_desc: "เหล่าพุทธศาสนิกชนนิกายอวตังสกะยกย่องอวตังสกสูตร (Flower Garland Sutra) ว่าเป็นแหล่งกำเนิดสูงสุดแห่งสัจธรรม, ซึ่งกล่าวถึงโลกอันไร้ขอบเขต, ถึงจักรวาลทั้งมวลที่บรรจุอยู่ภายในธุลีเพียงเม็ดเดียว"

 mantrayana: "มันตรยาน"
 mantrayana_adj: "มันตรยาน"
 mantrayana_adherent: "ผู้นับถือมันตรยาน"
 mantrayana_adherent_plural: "เหล่าผู้นับถือมันตรยาน"
 mantrayana_desc: "เหล่าพุทธศาสนิกชนนิกายมันตรยานเพิ่มพูนความเข้าใจในสิ่งที่ลึกซึ้งและเร่งการเดินทางทางจิตวิญญาณของพวกเขาด้วยชุดพิธีกรรมรหัสยนัยและเครื่องมือลี้ลับ"

