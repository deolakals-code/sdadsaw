 buddhism_religion_desc:0 "ศาสนาพุทธดำเนินตามคำสอนของพระโคตมพุทธเจ้าและเหล่า 'ผู้รู้แจ้ง' ในลำดับถัดมา เพื่อเอาชนะความทุกข์แห่งการดำรงอยู่ อันเกิดจากวงจรแห่งความเปลี่ยนแปลงอันไม่สิ้นสุดผ่านความตายและการเกิดใหม่ การบรรลุการรู้แจ้งคือหนทางสู่การหลุดพ้นจากสังสารวัฏ ไปสู่ความดับสูญแห่งนิพพาน"
