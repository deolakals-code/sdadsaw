 #Ari
 ari:0 "อริ"
 ari_adj:0 "อริ"
 ari_adherent:0 "ชาวอริ"
 ari_adherent_plural:0 "ชาวอริ"
 ari_desc:0 "ความเชื่อแบบอริผสมผสานองค์ประกอบจากพุทธศาสนานิกายตันตระ การบูชาภูตผี การบูชานาคตามประเพณีดั้งเดิม รวมถึงศาสนาฮินดู ผู้บูชาอริถือเป็นพุทธศาสนิกชน แม้ว่าแนวปฏิบัติของพวกเขาจะถูกมองว่าค่อนข้างนอกรีตก็ตาม"

 #Theravada
 theravada:0 "เถรวาท"
 theravada_adj:0 "เถรวาท"
 theravada_adherent:0 "ชาวเถรวาท"
 theravada_adherent_plural:0 "ชาวเถรวาท"
 theravada_desc:0 "หนทางสู่การรู้แจ้งนั้นต้องผ่านประสบการณ์ส่วนตน การใคร่ครวญ และการใช้เหตุผล พระโคตมพุทธเจ้าทรงค้นพบหนทางสู่นิพพานด้วยพระองค์เอง และหนทางเดียวที่จะค้นพบวิถีทางที่คล้ายคลึงกันได้ คือการประสบ เรียนรู้ และศึกษาการดำรงอยู่ของตนเอง"

 #Mahayana
 mahayana:0 "มหายาน"
 mahayana_adj:0 "มหายาน"
 mahayana_adherent:0 "ชาวมหายาน"
 mahayana_adherent_plural:0 "ชาวมหายาน"
 mahayana_desc:0 "การหลุดพ้นจากสังสารวัฏมิใช่เพียงสิ่งที่กระทำโดยลำพัง แต่เป็นประสบการณ์ที่แบ่งปันกันในหมู่สัตว์ผู้มีชีวิต การบรรลุพุทธภาวะเป็นเพียงก้าวหนึ่งบนหนทางอันยาวไกล เพื่อให้สรรพสัตว์ทั้งหลายได้หลุดพ้นสู่นิพพาน และนั่นคือเป้าหมายอันประเสริฐของสังสารวัฏ"

 #Vajrayana
