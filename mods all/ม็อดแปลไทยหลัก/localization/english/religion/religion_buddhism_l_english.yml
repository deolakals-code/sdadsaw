 vajrayana_desc:0 "แรงจูงใจสู่พุทธภาวะมีความสำคัญอย่างยิ่ง และการรู้แจ้งที่แท้จริงจะบรรลุได้ก็ต่อเมื่อแสวงหาเพื่อประโยชน์สุขของสรรพสัตว์ทั้งปวง สรรพสัตว์ทั้งหลายล้วนเกิดมาพร้อมจิตที่รู้แจ้ง แต่ถูกบดบังด้วยการดำรงอยู่ การฝึกฝนเพื่อมองเห็นสัจธรรมของโลกและจักรวาลจึงเป็นการปลดล็อกการรู้แจ้งที่มีมา แต่กำเนิดของตน"
