 GLOSS_NEMBUTSU: "การสวดพระนามของพระอมิตาภะคือการปฏิบัติเจริญสติแบบพุทธโบราณที่ได้รับความสนใจอย่างมากในนิกายของเอเชียตะวันออก. รู้จักกันในชื่อ 'เนียนฝอ' (Nianfo) ในจีน, หรือ 'เน็มบุตสึ' (Nembutsu) ในญี่ปุ่น, การปฏิบัตินี้ได้รับการพิจารณาโดยบางนิกายว่าเป็นการอ้างถึงความเมตตาของพระอมิตาภะโดยตรง, ซึ่งด้วยพระคุณของพระองค์ ผู้นั้นอาจได้รับอนุญาตให้เข้าสู่แดนสุขาวดี, ไม่ว่าจะเป็นภิกษุหรือคฤหัสถ์ก็ตาม"
