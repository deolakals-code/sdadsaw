#EP3 Traditions
 tradition_ep3_indomitable_azatani_name: "อาซาทานีผู้ไม่ย่อท้อ"
 tradition_ep3_indomitable_azatani_desc: "สำหรับขุนนางผู้หยิ่งทะนงอย่างดุเดือดของวัฒนธรรมนี้ ผู้ควบม้าลงมาจากฐานที่มั่นสูงตระหง่าน "บาดแผลจากกริชย่อมหายได้ แต่บาดแผลจากลิ้น — ไม่มีวัน!""
 culture_parameter_house_hostility_more_common: "[rulers|E]กระทำการอย่างก้าวร้าวต่อ[houses|E]อื่นมากขึ้น"
 culture_parameter_vassals_more_likely_to_refuse_demands: "[characters|E]มีแนวโน้มที่จะปฏิเสธการ[imprisonment|E], การ[retractions|E] และการ[revocations|E]มากขึ้น"

 tradition_ep3_audacious_cadets_name: "บุตรคนรองผู้กล้าหาญ"
 tradition_ep3_audacious_cadets_desc: "ฝูงชนที่ไม่สงบของบุตรชายคนเล็กกำหนดวัฒนธรรมนี้ ทหารม้าเหล่านี้ผู้กล้าหาญและไร้ยางอาย ไล่ตามความฝันของการผจญภัยในแดนไกล ความโหดร้ายของทหารรับจ้าง และการพิชิตอันรุ่งโรจน์"

 culture_parameter_ambitious_trait_more_common: "[trait|E][GetTrait('ambitious').GetName( GetNullCharacter )] พบได้บ่อยขึ้น"
 culture_parameter_reduced_bodyguard_aptitude: "ลด[aptitude|E]ของ[GetCourtPositionType('bodyguard_court_position').GetName()]"

 tradition_ep3_imperial_tagmata_name: "ทากมาตาแห่งจักรวรรดิ"
 tradition_ep3_imperial_tagmata_desc: "กองทหารชั้นยอดติดอาวุธอย่างดีเป็นแกนหลักของการทัพของวัฒนธรรมนี้ กองทหารที่หยิ่งยโสของพวกเขาไม่ค่อยคำนึงถึงขุนนางนักรบชั้นผู้น้อยและการกระทำที่บ้าบิ่นส่วนบุคคล แต่พวกเขากลับให้เกียรติวินัยและชื่ออันศักดิ์สิทธิ์ของหน่วยของตน #EMP เอ็กซ์คูบิโทอิ! สโคลัย! ฮิคาณาโทอิ!#!"

 domain_counties_with_stables_desc: "[culture_head|E]ไม่ได้ครอบครอง[counties|E]#high 8#! แห่งที่มี$building_type_stables_01$สร้างขึ้นใน[holdings|E]แห่งใดแห่งหนึ่ง"

 tradition_ep3_roman_ceremonies_name: "พิธีกรรมโรมัน"
 tradition_ep3_roman_ceremonies_desc: "จักรพรรดิในอดีตได้มอบความยิ่งใหญ่ที่ยังคงอยู่ พิธีกรรมอันงดงาม ความเกรงขามต่อตำแหน่งจักรพรรดิ... และชีวิตสาธารณะที่เต็มไปด้วยความไม่สงบ ให้แก่วัฒนธรรมนี้"

 tradition_ep3_palace_politics_name: "การเมืองในวัง"
 tradition_ep3_palace_politics_desc: "ขันทีผู้ทรงอำนาจและคนประจบสอพลอในชุดผ้าไหมควบคุมกลไกทางการเมืองอันกว้างใหญ่ สร้างความประทับใจด้วยเครื่องประดับหรูหรา ประจบประแจงด้วยเกียรติยศ และวางแผนอย่างชั่วร้ายในนามของความก้าวหน้า"
 culture_head_court_grandeur_desc: "[culture_head|E]ไม่มี[court_grandeur_level|E]ระดับ #high 8#! หรือสูงกว่า"
