 tradition_chinese_arts_name: "ศิลปะจีน"
 tradition_chinese_arts_desc: "วิถีแห่งปากกา วิถีแห่งพู่กัน ล้วนเป็นองค์ประกอบสำคัญสำหรับวัฒนธรรมนี้ แทนที่จะพึ่งพาเพียงอำนาจทางการทหารหรือการบริหารที่ซับซ้อน ชาวจีนให้ความสำคัญกับการขัดเกลาศิลปะทุกรูปแบบให้สมบูรณ์แบบ"
