 tradition_intensive_farming_desc: "วัฒนธรรมนี้ให้คุณค่าอย่างสูงกับชนชั้นเกษตรกรขนาดใหญ่ที่สนับสนุนประชากรที่ไม่ได้ทำการเกษตร ด้วยประสบการณ์นับพันปี พวกเขาสามารถเพิ่มผลผลิตข้าวสาลีและข้าวได้อย่างมาก ขึ้นอยู่กับสิ่งที่เหมาะสมกับสถานการณ์ในท้องถิ่นมากที่สุด"

