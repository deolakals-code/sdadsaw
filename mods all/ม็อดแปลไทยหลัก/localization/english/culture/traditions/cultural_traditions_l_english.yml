 culture_emergence_events.0001.t:0 "การผสมผสานทางวัฒนธรรม"
 culture_emergence_events.0001.desc:0 "ข้าคือชาว[ROOT.Char.GetCulture.GetName] แต่ผู้คนในเมืองหลวงของข้า [capital_county_scope.GetBaseName] คือชาว[hybdridization_offer_culture.GetName] ระยะหลังมานี้ ข้าเห็นข้าแผ่นดินชาว[hybdridization_offer_culture.GetNameNoTooltip]ของข้าเลียนแบบวิถีของข้าและชาว[ROOT.Char.GetCulture.GetNameNoTooltip]\n\nพวกเขากำลังผสมผสานประเพณีของเรา บ้างก็เก่า บ้างก็ใหม่ - แต่สิ่งที่สำคัญที่สุดคือพวกเขายอมรับการปกครองของข้ามากขึ้น!\n\nบางทีควรส่งเสริมพัฒนาการนี้หรือไม่?"
 culture_emergence_events.0001.a:0 "หากพวกเขาทำเหมือนข้า ข้าก็จะทำเหมือนพวกเขา ไม่ช้าเราจะเป็นหนึ่งเดียวกัน"
 culture_emergence_events.0001.b:0 "ความชื่นชมของพวกเขาก็เพียงพอแล้ว!"
