tradition_cultivation_desc: "การปรับร่างกาย ลมหายใจ และจิตใจ จนกว่าโคลนตมแห่งหัวใจจะสงบนิ่ง และคุณธรรมภายในจะผุดขึ้นดั่งน้ำใส"

