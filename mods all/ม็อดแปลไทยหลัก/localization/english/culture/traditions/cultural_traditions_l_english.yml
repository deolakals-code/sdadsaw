 culture_emergence_events.0005.t: "ตำนานแห่งโรแมนช์"
 culture_emergence_events.0005.desc: "ขณะที่ [county_scope.GetNameNoTierNoTooltip] กำลังเฉลิมฉลองการถือกำเนิดของ [new_culture_scope.GetName] ข้าสังเกตเห็นว่าผู้คน #italic บ้านนอก#! บางส่วนของดินแดนยังคงพูดภาษาถิ่นที่ไม่เหมือนกับที่ข้าคิดว่า [new_culture_scope.GetNameNoTooltip] เป็น\n\nไพร่ผู้หนึ่งบังเอิญอยู่ใกล้ถนนขณะที่ข้าผ่านไป กำลังพูดคุยกับใครบางคนในทุ่งนา "เจ้าตรงนั้น!" ข้าตวาด "เจ้าพูดภาษาอะไรกัน?"\n\n[rustic_peasant.GetWomanMan] หยุดชั่วครู่ "ข้าคิดว่า" [rustic_peasant.GetSheHe] ตอบช้า ๆ เป็นภาษา [ROOT.Char.GetCulture.GetLanguage.GetNameNoTooltip] "พวกเราเรียกมันว่า #italic โรแมนช์#! น่ะขอรับ"\n\n'โรแมนช์' งั้นรึ? นี่คือสิ่งที่ผู้คนของข้าเป็นอย่างแท้จริงหรือ?"
 culture_emergence_events.0005.a: "ลิ้นของพวกเราต้องเป็นโรแมนช์ เช่นเดียวกับใจของเรา"
 culture_emergence_events.0005.a.tt: "[new_culture_scope.GetNameNoTooltip] จะใช้ชื่อโรแมนช์ #bold เท่านั้น#!"
 culture_emergence_events.0005.b: "โรแมนช์จะกลายเป็นส่วนหนึ่งของภาพกระเบื้องโมเสก [new_culture_scope.GetName]"
 culture_emergence_events.0005.b.tt: "[new_culture_scope.GetNameNoTooltip] จะใช้ชื่อโรแมนช์ #bold เพิ่มเติมจาก#! ชื่อปัจจุบัน"
 culture_emergence_events.0005.c: "ภาษาไพร่ เช่นนี้ไม่มีค่าใดต่อ [new_culture_scope.GetName]!"
