 culture_tradition_events.0002.t:0 "ประลองกับ[GetPlayer.Custom( 'KnightCultureNoTooltip' )]: บทสรุป"
 culture_tradition_events.0002.desc:0 "ข้าลดอาวุธลงและหันไปหา[recipient.GetTitledFirstName] ปรบมือให้[recipient.GetHerHim]ตามธรรมเนียม [recipient.GetSheHe|U]ก็ทำ เช่นเดียวกัน\n\n"
 culture_tradition_events.0002.desc_actor_victor_good:0 ""สู้ได้ดีมาก ท่าน[actor.GetTitleTierName|U]! ท่านเอาชนะข้าได้อย่างขาวสะอาด" [recipient.GetFirstNameNoTooltip]กล่าว\n"การฝึกฝนนี้จะเป็นประโยชน์แก่เราอย่างแน่นอน หากมีสงครามในอนาคตของ[actor.GetPrimaryTitle.GetNameNoTierNoTooltip]"\n\nนี่ช่างกระปรี้กระเปร่า ข้ารู้สึกแข็งแรงและพร้อม!"
 culture_tradition_events.0002.desc_actor_victor_bad:0 ""สู้ได้ดีมาก ท่าน[actor.GetTitleTierName|U] ข้าพ่ายแพ้อย่างราบคาบ" [recipient.GetFirstNameNoTooltip]คร่ำครวญ\n"แต่จำไว้ อย่าให้ชัยชนะนี้ ทำให้ท่านเหลิง ข้าไม่ใช่ศัตรูของท่าน พวกเขายังคงอยู่ข้างนอกนั่น"\n\nปัดโธ่! ข้ารู้สึกสบายดี!"
 culture_tradition_events.0002.desc_recipient_victor_good:0 ""สู้ได้ดีมาก ท่าน[actor.GetTitleTierName|U] ข้าชนะรอบนี้!" [recipient.GetFirstNameNoTooltip]กล่าวด้วยน้ำเสียงนักกีฬา "ตอนนี้เราพร้อมที่จะเผชิญหน้ากับทุกสิ่ง!"\n\nแน่นอน เราพร้อมแล้ว บางทีข้าควรพิจารณาการพิชิตครั้งต่อไป?"
 culture_tradition_events.0002.desc_recipient_victor_bad:0 ""สู้ได้ดีมาก ท่าน[actor.GetTitleTierName|U] ข้าขออภัยหาก ทำให้ท่านบาดเจ็บ ชั่วขณะหนึ่งข้าตกอยู่ในภวังค์ — ข้าและอาวุธเป็นหนึ่งเดียวกัน..." [recipient.GetFirstNameNoTooltip]กล่าวขอโทษ\n"บางทีท่านอาจต้องการพักผ่อนสักหน่อย?"\n\nไร้สาระ ข้าแข็งแรงเหมือนหมาโรงฆ่าสัตว์!"
 culture_tradition_events.0002.a:0 "เป็นการต่อสู้ที่ดี!"
 culture_tradition_events.0002.b:0 "ข้าอาจจะแพ้ แต่มันเป็นการฝึกที่ดี!"
 
