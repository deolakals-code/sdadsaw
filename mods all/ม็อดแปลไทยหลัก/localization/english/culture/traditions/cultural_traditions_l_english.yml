 culture_emergence_events.0002.t:0 "อัตลักษณ์ใหม่"
 culture_emergence_events.0002.desc:0 "ผู้คนของข้า ชาว[ROOT.Char.GetCulture.GetCollectiveNoun] เป็นชนชาติที่ภาคภูมิและแพร่หลาย\n\nแม้ว่าเราจะคล้ายคลึงกันเพียงใด ข้าก็ไม่อาจปฏิเสธได้ว่าข้าแผ่นดินของข้าเริ่มมีพฤติกรรมแตกต่างจากชาว[ROOT.Char.GetCulture.GetCollectiveNounNoTooltip]ที่อื่น บางครั้งถึงกับมีความขัดแย้งระหว่างกลุ่มชาว[ROOT.Char.GetCulture.GetNameNoTooltip]ที่มาเยือนกับผู้ที่อยู่ภายใต้การปกครองของข้า\n\nเรากำลังพัฒนาอัตลักษณ์ใหม่ เราคือชาว[ROOT.Char.GetCulture.GetNameNoTooltip] - แต่ในขณะเดียวกันก็ไม่ใช่ บางทีควรส่งเสริมพัฒนาการนี้หรือไม่?"
 culture_emergence_events.0002.a:0 "เราจะสร้างอัตลักษณ์ใหม่ที่แข็งแกร่งขึ้น!"
 culture_emergence_events.0002.b:0 "เราคือชาว[ROOT.Char.GetCulture.GetCollectiveNounNoTooltip]และไม่มีอะไรอื่น! จงอยู่ในแถว!"
