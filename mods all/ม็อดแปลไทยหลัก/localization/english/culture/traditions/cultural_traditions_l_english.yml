 tradition_fortress_mastery_name: "ความเชี่ยวชาญด้านป้อมปราการ"
 tradition_fortress_mastery_desc: "วัฒนธรรมนี้มีธรรมเนียมปฏิบัติอันยาวนานในด้านความชาญฉลาดในการป้องกัน พวกเขาใช้ภูมิประเทศท้องถิ่นเพื่อปกป้องบ้านเกิดเมืองนอนและขับไล่ผู้รุกราน พวกเขาผสานทักษะนี้เข้ากับความเชี่ยวชาญด้านธนูและกองทหารอันคล่องแคล่ว ซึ่งสามารถเอาชนะศัตรูหน้าไหนได้ด้วยการเคลื่อนพล"
