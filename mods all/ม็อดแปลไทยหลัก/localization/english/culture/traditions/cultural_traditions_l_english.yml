 mpo_siberian_permafrost_modifier: "ชั้นดินเยือกแข็งคงตัวไซบีเรีย"
 mpo_siberian_permafrost_modifier_desc: "ดินที่เยือกแข็งมานับพันปี ไร้ซึ่งทางเข้าถึงน้ำบาดาล พืชพรรณเบาบาง ภูมิประเทศเปลี่ยนแปลงทุกปี เนื่องจากการละลายและการแข็งตัวซ้ำแล้วซ้ำเล่า ผู้ที่อาศัยอยู่ที่นี่ต้องใช้เวลาหลายศตวรรษในการปรับตัวเพื่อทำให้ดินแดนเหล่านี้เป็นของตน ทุกคนและทุกสิ่งอื่นใดจะพินาศและร่วมวงกับซากโบราณใต้ผืนน้ำแข็ง\n\n#weak ตัวปรับแต่งนี้สามารถลบออกได้โดย [interaction|E] #V $feudalize_holding_interaction$#! หรือ #V $demand_admin_interaction$#! หรือหลังจากพิชิตแดนเหนือทั้งหมดแล้วโดย [decision|E] #V $expand_the_steppe_decision_generic$#! สำหรับภูมิภาค #V $dlc_mpo_steppe_siberia_further_expansion_tooltip$#!#!\n\n"

