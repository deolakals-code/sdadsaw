 culture_parameter_can_castrate_prisoners:0 "[rulers|E] สามารถตอน [prisoners|E] ได้"
 culture_parameter_children_can_be_born_in_the_purple:2 "[children|E] ที่เกิดจาก [ruler|E] ที่ถือครอง $e_byzantium$ อาจได้รับ [trait|E] [GetTrait('born_in_the_purple').GetName( GetNullCharacter )] การมีลักษณะนิสัยเกิดในตระกูลสูงส่งจะเพิ่มคะแนนผู้สมัครของตัวละครภายใต้ $acclamation_succession_law$"
