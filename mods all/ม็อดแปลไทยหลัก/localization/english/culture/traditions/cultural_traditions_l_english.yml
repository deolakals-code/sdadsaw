l_english: 
 # Ethoses
 ethos_bellicose_name:0 "กระหายสงคราม"
 ethos_bellicose_desc:1 "วัฒนธรรมนี้ถือว่าความขัดแย้งและความรุนแรงเป็นสภาวะที่จำเป็นของการดำรงอยู่; ฝังรากลึกในผู้คนคือแนวคิดที่ว่าควรยืนหยัดและต่อสู้เพื่อตนเอง"
 ethos_stoic_name:0 "อดทน"
 ethos_stoic_desc:1 "วัฒนธรรมนี้เชื่อในการยืนหยัดอย่างแข็งแกร่งดุจภูผา รับมือกับความยากลำบากทั้งปวงที่ชีวิตอาจถาโถมเข้ามา และอดทนต่อมันทั้งหมดด้วยความมุ่งมั่นอันแข็งกร้าวและจิตวิญญาณที่ไม่ย่อท้อ"
 ethos_bureaucratic_name:1 "ระบบราชการ"
 ethos_bureaucratic_desc:2 "ไม่มีวัฒนธรรมใดคงอยู่ได้นานกว่าบันทึกที่เก่าแก่ที่สุด และวัฒนธรรมนี้เชื่อในการทำบัญชีอย่างพิถีพิถันเพื่อรับประกันความเป็นอมตะ"
 ethos_spiritual_name:0 "จิตวิญญาณ"
 ethos_spiritual_desc:1 "ในขณะที่บางวัฒนธรรมหันไปหาสงครามและบางวัฒนธรรมหันไปหาความรู้ทางโลก วัฒนธรรมนี้วางใจในสิ่งเดียวที่คงที่ตลอดประวัติศาสตร์ - สิ่งศักดิ์สิทธิ์ จิตวิญญาณเป็นหนทางเดียวที่จะก้าวไปข้างหน้าในโลกที่โหดร้ายและไร้ความปรานี"
 ethos_courtly_name:1 "พิธีรีตอง"
 ethos_courtly_desc_nhc:1 "พิธีรีตองของชีวิตในราชสำนักเป็นส่วนสำคัญของวัฒนธรรมนี้จนกลายเป็นส่วนหลักของพฤติกรรมทางสังคมของผู้คน มีที่สำหรับทุกคน และทุกคนอยู่ในที่ของตน"
 ethos_egalitarian_name:0 "เสมอภาค"
 ethos_egalitarian_desc:1 "การไม่ยอมรับความแตกต่างและการโดดเดี่ยวอาจเป็นหนทางสำหรับผู้อื่น แต่วัฒนธรรมนี้ตระหนักดีว่าการยอมรับความแตกต่างนั้นดีกว่าการทำลายล้างมัน"
 ethos_communal_name:0 "ชุมชนนิยม"
 ethos_communal_desc:1 "วัฒนธรรมนี้ให้ความสำคัญกับสายสัมพันธ์ของชุมชนเหนือสิ่งอื่นใด ส่งเสริมความภักดีและความทุ่มเทอันยิ่งใหญ่โดยการทำงานร่วมกันเพื่อเป้าหมายร่วมกัน"

 # Martial Customs
 martial_custom_equal_name:0 "เท่าเทียม"
 martial_custom_equal_desc:2 "ในวัฒนธรรมนี้ บุคคลที่มีร่างกายแข็งแรงทุกคนในครัวเรือนอาจจับอาวุธเพื่อเจ้าเหนือหัวของตนเมื่อถูกเรียกตัว"
 martial_custom_male_only_name:0 "ชายเท่านั้น"
 martial_custom_male_only_desc:0 "วัฒนธรรมนี้ถือว่ามีเพียงผู้ชายเท่านั้นที่แข็งแรงและทรหดพอที่จะต่อสู้ในสนามรบ"
 martial_custom_female_only_name:0 "หญิงเท่านั้น"
 martial_custom_female_only_desc:0 "วัฒนธรรมนี้ถือว่ามีเพียงผู้หญิงเท่านั้นที่แข็งแรงและทรหดพอที่จะต่อสู้ในสนามรบ"
 ## ^The above descs mirror each other deliberately.
 
 # Traditions
 tradition_court_eunuchs_name:0 "ขันทีในราชสำนัก"
 tradition_court_eunuchs_desc:1 "วัฒนธรรมนี้ใช้ขันทีอย่างกว้างขวางในราชสำนัก โดยดำรงตำแหน่งตั้งแต่คนรับใช้ในบ้านไปจนถึงผู้บริหารระบบราชการและแม้ แต่ผู้บัญชาการทหาร ชายที่ไร้ความปรารถนานั้นง่ายต่อการไว้วางใจ"
 tradition_byzantine_succession_name:1 "ประเพณีไบแซนไทน์"
 tradition_byzantine_succession_desc:1 "วัฒนธรรมนี้มีความเกี่ยวข้องอย่างใกล้ชิดกับประเพณีของจักรวรรดิโรมันตะวันออกและมรดกตกทอดในรูปแบบของประมวลกฎเกณฑ์การปฏิบัติในราชสำนักที่ซับซ้อนและละเอียดอ่อน"
 tradition_african_tolerance_name:0 "ความอดกลั้นแบบแอฟริกัน"
 tradition_african_tolerance_desc:1 "แม้บางคนจะประณามว่าเป็นความอ่อนแอ แต่อาณาจักรที่ก่อตั้งขึ้นบนความเข้าใจและความอดกลั้นคืออาณาจักรที่สร้างขึ้นบนรากฐานที่มั่นคง"
 tradition_memories_of_bactria_name:0 "ความทรงจำแห่งแบกเตรีย"
 tradition_memories_of_bactria_desc:1 "สิ่งที่ประดิษฐานอยู่ในความทรงจำทางวัฒนธรรมของผู้คนเหล่านี้คืออุดมคติของดินแดนอันสมบูรณ์แบบแห่งแบกเตรีย มงกุฎอันงดงามแห่งตะวันออก ซึ่งเวลาของมันจะมาถึงอีกครั้ง"
 tradition_equal_inheritance_name:0 "การสืบทอดมรดกอย่างเท่าเทียม"
 tradition_equal_inheritance_desc:0 "วัฒนธรรมนี้มีประวัติศาสตร์ของผู้ปกครองที่แบ่งดินแดนของตนให้กับบุตรหลานทุกคน แม้ แต่ผู้ที่ปกติจะถูกกีดกัน"
 tradition_equal_inheritance_link:0 "การสืบทอดมรดกอย่างเท่าเทียม"
 tradition_the_witenagemot_name:0 "สภาวิเทนาเกมอท"
 tradition_the_witenagemot_desc:1 "วัฒนธรรมนี้มีประวัติศาสตร์อันยาวนานในการจัดการประชุมที่ประกอบด้วยผู้มีอำนาจปกครองของแผ่นดิน เพื่ออภิปรายเรื่องการเมือง กฎหมาย การคลัง และที่สำคัญที่สุดคือ วิธีที่ดีที่สุดในการ... #EMP ถวายคำแนะนำ#! แก่ผู้ปกครอง"
 tradition_things_name:1 "การประชุมทิง"
 tradition_things_desc:1 "ในสแกนดิเนเวีย ระยะทางและความทุรกันดาร ทำให้อำนาจจากส่วนกลางไม่มีประสิทธิภาพ เมื่อต้องแก้ไขข้อพิพาทและตัดสินใจ #EMP การประชุมทิง #!จะถูกจัดขึ้น ซึ่งเป็นการรวมตัวของคนระดับเดียวกันโดยมีผู้ประกาศกฎหมายเป็นประธาน"
 tradition_caravaneers_name:0 "พ่อค้ากองคาราวาน"
 tradition_caravaneers_desc:1 "วัฒนธรรมนี้ผสมผสานเข้ากับการค้าของภูมิภาคได้เป็นอย่างดี และผู้คนมีความเกี่ยวข้องอย่างยิ่งกับการค้ากองคาราวาน"
 tradition_xenophilic_name:0 "ชอบชาวต่างชาติ"
 tradition_xenophilic_desc:0 "วัฒนธรรมนี้เปิดรับทุกคนและหลงใหลในทุกวัฒนธรรมอย่างแท้จริง"
 tradition_legalistic_name:0 "นิยมกฎหมาย"
 tradition_legalistic_desc:1 "วัฒนธรรมนี้ถือว่าหลักนิติธรรมและการประมวลกฎหมายเป็นตัวชี้วัดที่สำคัญที่สุดของสังคมที่มีอารยธรรม"
 tradition_warrior_culture_name:0 "วัฒนธรรมนักรบ"
 tradition_warrior_culture_desc:0 "วัฒนธรรมนี้ให้ความสำคัญกับความสามารถทางการรบและความแข็งแกร่งเหนือสิ่งอื่นใด เด็กๆ ถูกเลี้ยงดูให้รู้วิธีต่อสู้ และไม่สนับสนุนให้ศึกษาเล่าเรียน ความอ่อนแอเป็นสิ่งที่ยอมรับไม่ได้"
 tradition_philosopher_culture_name:0 "วัฒนธรรมนักปราชญ์"
 tradition_philosopher_culture_desc:0 "วัฒนธรรมนี้ส่งเสริมความคิดและการไตร่ตรองตนเอง"
 tradition_chivalry_name:0 "อัศวินธรรม"
 tradition_chivalry_desc:1 "วัฒนธรรมนี้ได้น้อมรับอัศวินธรรมและประมวลกฎเกณฑ์การปฏิบัติของอัศวินเป็นวิธีการทางสังคมในการควบคุมพฤติกรรม ความสามารถทางการรบ หน้าที่ เกียรติยศ และศีลธรรมเป็นสิ่งที่ได้รับการยกย่อง เช่นเดียวกับบทกวีที่ไม่ดีและวรรณกรรมโรแมนติก"
 tradition_hit_and_run_name:0 "นักยุทธวิธีตีแล้วหนี"
 tradition_hit_and_run_desc:0 "วัฒนธรรมนี้เชี่ยวชาญในการใช้หน่วยรบเกราะเบาเพื่อโจมตีศัตรูอย่างหนักหน่วง แล้วถอยกลับ"
 tradition_stand_and_fight_name:0 "ยืนหยัดสู้!"
 tradition_stand_and_fight_desc:0 "นักรบจากวัฒนธรรมนี้ไม่ยอมแพ้และไม่หวั่นไหว พวกเขาไม่ถอยกลับ - แม้จะต้องเผชิญกับโอกาสที่เสียเปรียบอย่างท่วมท้น ไม่ว่าจะดีหรือร้าย"
 tradition_horse_lords_name:0 "จ้าวอาชา"
 tradition_horse_lords_desc:0 "วัฒนธรรมนี้เชี่ยวชาญเรื่องม้าและการใช้ม้าในการทำสงคราม"
 tradition_adaptive_skirmishing_name:0 "พลรบประชิดที่ปรับตัวได้"
 tradition_adaptive_skirmishing_desc:0 "วัฒนธรรมนี้รู้วิธีส่งพลรบประชิดเข้าสู่สนามรบอย่างมีประสิทธิภาพในทุกสภาพแวดล้อม"
 tradition_formation_fighting_name:0 "ผู้เชี่ยวชาญการรบแบบกระบวนทัพ"
 tradition_formation_fighting_desc:0 "วัฒนธรรมนี้รู้วิธีสร้างการทำงานร่วมกันระหว่างหน่วยรบประเภทต่างๆ โดยใช้กระบวนทัพป้องกันที่มีประสิทธิภาพ"
 tradition_republican_legacy_name:0 "มรดกสาธารณรัฐ"
 tradition_republican_legacy_desc:1 "วัฒนธรรมนี้มีประวัติศาสตร์อันยาวนานของค่านิยมสาธารณรัฐ ซึ่งชนชั้นในเมืองมีความสำคัญเท่าเทียมกับเจ้าของที่ดินในชนบท"
 tradition_hereditary_hierarchy_name:0 "ลำดับชั้นทางสายเลือด"
 tradition_hereditary_hierarchy_desc:0 "ฝังรากลึกในวัฒนธรรมนี้ว่าความเป็นผู้นำสืบทอดทางสายเลือด ชนชั้นสูงผูกพันกับปราสาทหิน และโครงสร้างศักดินาไม่สั่นคลอน พวกเขาไม่ลืมง่ายๆ ผู้ที่ฝ่าฝืนประมวลกฎศักดินา"
 tradition_theocratic_autonomy_name:0 "เอกราชทางศาสนจักร"
 tradition_theocratic_autonomy_desc:1 "ผู้มีอำนาจทางศาสนาในวัฒนธรรมนี้ได้รับอิสระอย่างมากจากผู้ปกครองฝ่ายอาณาจักร และได้รับความเคารพและการเชื่อฟังจากประชาชน"
 tradition_saharan_nomads_name:0 "ชนเผ่าเร่ร่อนซาฮารา"
 tradition_saharan_nomads_desc:1 "วัฒนธรรมนี้คุ้นเคยกับทะเลทรายซาฮาราเป็นอย่างดี ซึ่งพวกเขาได้เดินทางข้ามมานานหลายศตวรรษ เชื่อมต่อทะเลเมดิเตอร์เรเนียนกับอาณาจักรใต้ซาฮาราแห่งซาเฮล"
 tradition_himalayan_settlers_name:0 "ผู้ตั้งถิ่นฐานหิมาลัย"
 tradition_himalayan_settlers_desc:1 "วัฒนธรรมนี้ได้สร้างบ้านอยู่บน 'หลังคาโลก' ที่ ซึ่งอากาศบริสุทธิ์ แต่หนาวเย็น และฤดูหนาวยาวนานและยากลำบาก พวกเขาภูมิใจที่วัฒนธรรมเบื้องล่างเพียงไม่กี่แห่งจะสามารถดำรงชีวิตได้ดีเท่ากับผู้คนเหล่านี้ ท่ามกลางยอดเขาและที่ราบสูงที่ มิฉะนั้นแล้วมีเพียงแกะเท่านั้นที่สามารถเจริญเติบโตได้"
 tradition_esteemed_hospitality_name:0 "การต้อนรับอันทรงเกียรติ"
 tradition_esteemed_hospitality_desc:0 "ในวัฒนธรรมนี้ ผู้ปกครองเป็นที่รู้จัก และคาดหวังว่าจะต้อนรับทุกคนที่อาจมายังราชสำนักของตนด้วยอ้อมแขนที่เปิดกว้าง การต้อนรับแขกและผู้มาเยือนอย่างน่าตื่นตาตื่นใจ"
 tradition_hard_working_name:0 "ขยันหมั่นเพียร"
 tradition_hard_working_desc:1 "วัฒนธรรมนี้สอนและประดิษฐานแนวคิดเรื่องความขยันหมั่นเพียรและการทำงานหนักเพื่อชุมชนของตน"
 tradition_loyal_soldiers_name:1 "ข้าแผ่นดินผู้ภักดี"
 tradition_loyal_soldiers_desc:2 "สำหรับวัฒนธรรมนี้ การรับใช้เจ้าเหนือหัวและประเทศชาติเป็นทั้งสิ่งสูงส่งและยุติธรรม - เป็นทั้งหน้าที่และสิทธิพิเศษ แทนที่จะเป็นการจัดการที่โลภหรือภาระที่ไม่พึงประสงค์"
 tradition_female_only_inheritance_name:0 "มาตาธิปไตย"
 tradition_female_only_inheritance_desc:1 "วัฒนธรรมนี้บังคับใช้ลำดับชั้นแบบมาตาธิปไตย ซึ่งชนชั้นปกครองส่วนใหญ่ประกอบด้วยผู้หญิง"
 tradition_pacifism_name:0 "สันตินิยม"
 tradition_pacifism_desc:1 "สำหรับวัฒนธรรมนี้ การใช้กำลังไม่สามารถให้เหตุผลได้เลย มีเพียงการดำเนินตามเส้นทางแห่งอหิงสาเท่านั้นที่ผู้คนจะสามารถอยู่ร่วมกันอย่างสันติได้อย่างแท้จริง"
 tradition_scientific_curiosity_name:0 "ความใฝ่รู้ทางวิทยาศาสตร์"
 tradition_scientific_curiosity_desc:1 "คนส่วนใหญ่มองซ้าย ขวา หลัง และหน้าเพื่อหาคำตอบ ไม่ใช่คนเหล่านี้ คนเหล่านี้มองขึ้นไป"
 tradition_spartan_name:0 "สมถะ"
 tradition_spartan_desc:1 "วัฒนธรรมนี้ไม่ให้ความสำคัญกับเครื่องประดับแห่งอำนาจ - พิธีรีตอง ความมั่งคั่ง การตก แต่งที่ไร้จุดหมาย วัฒนธรรมนี้สนใจในอำนาจมากกว่า โดยเฉพาะอย่างยิ่งในรูปแบบของกำแพงและป้อมปราการที่สูงตระหง่าน"
 tradition_tribe_unity_name:0 "เอกภาพชนเผ่า"
 tradition_tribe_unity_desc:1 "วัฒนธรรมนี้เน้นย้ำถึงสายสัมพันธ์ทางครอบครัวและชุมชนที่ผู้คนมีร่วมกัน ผลักดันให้พวกเขาระลึกถึงมรดกร่วมกัน"
 tradition_astute_diplomats_name:0 "นักการทูตผู้หลักแหลม"
 tradition_astute_diplomats_desc:1 "เป็นแนวคิดทั่วไปในวัฒนธรรมนี้ว่าการแสดงออกถึงความเหนือกว่าที่บริสุทธิ์ที่สุดคือความสามารถในการปราบศัตรูโดยไม่ต้องต่อสู้"
 tradition_collective_lands_name:0 "ที่ดินส่วนรวม"
 tradition_collective_lands_desc:1 "แนวคิดที่ว่าบุคคลเป็นเจ้าของที่ดินเป็นการส่วนตัวนั้นแปลกแยกสำหรับวัฒนธรรมนี้ ที่ดินเป็นของทุกคน เพื่อประโยชน์ส่วนรวม"
 tradition_horse_breeder_name:0 "นักเพาะพันธุ์ม้า"
 tradition_horse_breeder_desc:1 "วัฒนธรรมนี้ได้สั่งสมความรู้และประสบการณ์อย่างอุตสาหะในศิลปะและศาสตร์อันประณีตของการเพาะพันธุ์ม้า ไม่ว่าจะเป็นม้าศึกหรือม้าเร็ว ม้าของผู้คนเหล่านี้มีชื่อเสียงในด้านความเหนือกว่า"
 tradition_hunters_name:0 "นักล่าผู้ชำนาญ"
 tradition_hunters_desc:1 "ด้วยแรงผลักดันจากความจำเป็นทางเศรษฐกิจ หรือบางทีอาจเป็นความคาดหวังทางสังคม วัฒนธรรมนี้ได้ปรับปรุงการล่าของตนให้เป็นศิลปะที่แม่นยำและเกือบจะงดงาม"
 tradition_sacred_mountains_name:0 "ภูเขาศักดิ์สิทธิ์"
 tradition_sacred_mountains_desc:1 "วัฒนธรรมนี้ถือว่าภูเขาเป็นการเชื่อมต่อกับสิ่งศักดิ์สิทธิ์ และปฏิบัติต่อภูเขาด้วยความเคารพและนับถือ"
 tradition_culinary_art_name:0 "ศิลปินแห่งการครัว"
 tradition_culinary_art_desc:1 "อาหารไม่ใช่แค่เครื่องยังชีพสำหรับวัฒนธรรมนี้ มันเป็นทั้งศิลปะและพิธีกรรม เป็นจุดศูนย์รวมของครอบครัวและชุมชน"
 tradition_festivities_name:0 "เทศกาลเฉลิมฉลองบ่อยครั้ง"
 tradition_festivities_desc:1 "ความถี่และความสนุกสนานที่วัฒนธรรมนี้จัดงานเฉลิมฉลองอาจถูกมองว่าหยาบคายสำหรับผู้อื่น แต่งานเลี้ยงก็คืองานเลี้ยง!"
 tradition_tea_ceremony_name:0 "พิธีชงชา"
 tradition_tea_ceremony_desc:1 "บางครั้ง สิ่งที่ต้องการเพื่อ ทำให้ทุกอย่างดีขึ้นคือชาดีๆ สักถ้วย"
 tradition_vegetarianism_name:0 "มังสวิรัติ"
 tradition_vegetarianism_desc:1 "วัฒนธรรมนี้ได้พัฒนาความรังเกียจอย่างรุนแรงต่อการบริโภคเนื้อสัตว์ และปฏิบัติตามหลักมังสวิรัติทั่วทั้งสังคม"
 tradition_alpine_supremacy_name:0 "ความเป็นเลิศแห่งเทือกเขาแอลป์"
 tradition_alpine_supremacy_desc:1 "ผู้คนในวัฒนธรรมนี้ได้ปรับตัวให้เข้ากับการใช้ชีวิตในและรอบๆ บริเวณภูเขา ความรู้และความเชี่ยวชาญของพวกเขาในสภาพอากาศแบบเทือกเขาแอลป์นั้นไม่เป็นสองรองใคร"
 tradition_seafaring_name:0 "นักเดินเรือ"
 tradition_seafaring_desc:1 "สำหรับวัฒนธรรมนี้ เสียงเรียกแห่งท้องทะเลนั้นแรงเกินกว่าจะต้านทานได้ และพวกเขาใช้ชีวิตเพื่อล่องเรือเหมือนความฝันบนมหาสมุทรที่ใสสะอาด หรือขี่บนยอดคลื่นของพายุที่บ้าคลั่ง"
 tradition_strength_display_name:0 "การแสดงพลัง"
 tradition_strength_display_desc:1 "เพียงแค่มีพละกำลังนั้นไม่เพียงพอ ท่านต้อง #EMP แสดง#! พลังของท่านต่อหน้าผู้อื่น เพื่อที่ท่านจะได้รู้ว่าท่านสามารถเผชิญหน้ากับคู่ต่อสู้ที่คู่ควร หรือต่อสู้เคียงข้างพันธมิตรที่มีค่า"
 tradition_mystical_ancestors_name:0 "บรรพบุรุษลึกลับ"
 tradition_mystical_ancestors_desc:1 "เชื้อสายมีความสำคัญอย่างยิ่งต่อวัฒนธรรมนี้ ถึงขนาดที่บรรพบุรุษกลายเป็นสิ่งมีชีวิตในตำนานและเทพนิยาย โดยมีผู้คนมากมายอ้างว่าเป็นลูกหลานของพวกเขา"
 tradition_priestly_caste_name:0 "วรรณะนักบวช"
 tradition_priestly_caste_desc:1 "วัฒนธรรมนี้บังคับใช้ระบบวรรณะเพื่อยกระดับฐานะนักบวชในสังคม สำหรับพวกเขา บุคคลที่ได้รับมอบหมายให้ตีความพระประสงค์ของสิ่งศักดิ์สิทธิ์จะต้องได้รับการปกป้องและเชื่อฟัง"
 tradition_religion_blending_name:0 "การผสมผสานศาสนา"
 tradition_religion_blending_desc:1 "สมาชิกของวัฒนธรรมนี้มักอาศัยอยู่ร่วมกับผู้ที่มีศรัทธาและความเชื่อต่างกัน และทำได้ดีในการนำองค์ประกอบต่างชาติมาปรับใช้ในการสักการะของตนเอง"
 tradition_religious_festivities_name:0 "เทศกาลทางศาสนา"
 tradition_religious_festivities_desc:1 "การเคลื่อนที่ของดวงอาทิตย์และดวงดาวไม่เกี่ยวข้องกับแนวคิดเรื่องเวลาของวัฒนธรรมนี้ แต่กลับเป็นวิธีที่นิยมกว่ามากในการนับวันเวลาคือเทศกาลและการเฉลิมฉลองทางศาสนาที่มีอยู่มากมายเป็นประจำ ซึ่งทุกคนได้รับเชิญ!"
 tradition_religious_patronage_name:0 "การอุปถัมภ์ทางศาสนา"
 tradition_religious_patronage_desc:1 "เพื่อความรอดของจิตวิญญาณ เราต้องอุทิศตนให้กับงานที่มีความสำคัญทางศาสนา ท่านไม่สามารถซื้อการไถ่บาปได้ แต่การมีวัดของนักบวชขับร้องสรรเสริญท่าน #EMP ช่วยได้#! "
 tradition_medicinal_plants_name:0 "หมอยาสมุนไพร"
 tradition_medicinal_plants_desc:1 "วัฒนธรรมนี้ได้พัฒนาความรู้เกี่ยวกับสรรพคุณทางยาของพืชและต้นไม้มานานแล้ว สำหรับพวกเขา ความเจ็บป่วยส่วนใหญ่สามารถรักษาได้ด้วยยาพอก ยาทา หรือยาต้มที่เหมาะสม"
 tradition_storytellers_name:0 "นักเล่าเรื่อง"
 tradition_storytellers_desc:1 "วัฒนธรรมนี้มีประเพณีมุขปาฐะที่แข็งแกร่งและต่อเนื่อง อดีตได้รับการอนุรักษ์ผ่านการเล่าเรื่องตามพิธีกรรม ซึ่งวีรบุรุษและตำนานในอดีตได้รับการถ่ายทอดจากรุ่นสู่รุ่น"
 tradition_sacred_hunts_name:0 "การล่าศักดิ์สิทธิ์"
 tradition_sacred_hunts_desc:1 "การล่าไม่ใช่กีฬาหรือการพักผ่อนหย่อนใจ มันคือการแสดงออกที่บริสุทธิ์ที่สุดของประสบการณ์มนุษย์ ซึ่งเราอาจเชื่อมต่อกับสิ่งศักดิ์สิทธิ์โดยการแสดงความเชี่ยวชาญเหนือธรรมชาติ"
 tradition_wedding_ceremonies_name:1 "พิธีสมรส"
 tradition_wedding_ceremonies_desc:1 "สำหรับวัฒนธรรมนี้ การรวมตัวกันของคนสองคนในการ แต่งงานถือเป็นเรื่องสาธารณะและพิธีกรรมอย่างสูง"
 tradition_music_theory_name:0 "นักทฤษฎีดนตรี"
 tradition_music_theory_desc:1 "วัฒนธรรมนี้ปฏิบัติต่อดนตรีเกือบจะเป็นภาษาของสิ่งศักดิ์สิทธิ์ ดังนั้นบุคคลจำนวนมากจึงใฝ่หาการศึกษาดนตรีอันสูงส่งและมีชื่อเสียงตั้งแต่อายุยังน้อย"
 tradition_poetry_name:0 "บทกวีอันประณีต"
 tradition_poetry_desc:0 "บทกวีถือเป็นศิลปะอันสูงส่งในวัฒนธรรมนี้ และหลายคนใช้เวลาในการร้อยเรียงถ้อยคำเข้าด้วยกันด้วยความหมายและความคิด"
 tradition_culture_blending_name:0 "การผสมผสานวัฒนธรรม"
 tradition_culture_blending_desc:1 "สมาชิกของวัฒนธรรมนี้มักอาศัยอยู่เคียงข้างผู้คนจากวัฒนธรรมอื่น จากการสัมผัส พวกเขาจึงเชี่ยวชาญในการผสมผสานภาษา ประเพณี และขนบธรรมเนียมต่างชาติเข้ากับชีวิตของตนเอง"
 tradition_family_entrepreneurship_name:0 "ธุรกิจครอบครัว"
 tradition_family_entrepreneurship_desc:2 "วัฒนธรรมนี้ส่งเสริมให้ธุรกิจพัฒนาไปตามสายเลือดของครอบครัว แต่ละรุ่นรับเครื่องมือและเทคนิคการค้าจากรุ่นก่อน สร้างประเพณีความเชี่ยวชาญระดับบรรพบุรุษที่แข็งแกร่ง"
 tradition_fishermen_name:0 "ชาวประมงผู้ชำนาญ"
 tradition_fishermen_desc:1 "ใครๆ ก็ตกปลาได้ แต่การทำ เช่นนั้นด้วยทักษะที่ ทำให้จับปลาได้มากมาย ไม่ว่ากระแสน้ำหรือลมจะเป็นอย่างไร เป็นพรสวรรค์ที่หาได้ยากกว่า ไม่มีใครรู้จักชายฝั่ง บก หรือทะเลดีไปกว่าชาวประมงเหล่านี้"
 tradition_metal_craftsmanship_name:0 "ช่างโลหะ"
 tradition_metal_craftsmanship_desc:1 "วัฒนธรรมนี้เข้าถึงเหล็กได้ง่ายมานานหลายศตวรรษ เมื่อเวลาผ่านไป พวกเขาได้พัฒนาความเข้าใจเกี่ยวกับโลหะจนถึงระดับที่ชื่อของพวกเขากลายเป็นคำพ้องความหมายสำหรับอาวุธและชุดเกราะที่ทนทานและมีคุณภาพสูง"
 tradition_isolationist_name:0 "สันโดษ"
 tradition_isolationist_desc:0 "วัฒนธรรมนี้ชอบที่จะอยู่ตามลำพัง และไม่ค่อยมองออกไปนอกขอบเขตของตนเอง"
 tradition_winter_warriors_name:0 "นักรบเหมันต์"
 tradition_winter_warriors_desc:0 "วัฒนธรรมนี้คุ้นเคยกับความเป็นจริงที่ลมแรงและความหนาวเหน็บนำมา"
 tradition_forest_fighters_name:0 "นักรบพงไพร"
 tradition_forest_fighters_desc:0 "วัฒนธรรมนี้เชี่ยวชาญในการต่อสู้ในป่า"
 tradition_mountaineers_name:0 "นักรบภูเขา"
 tradition_mountaineers_desc:0 "ทหารของวัฒนธรรมนี้แบกทุกสิ่งที่จำเป็นในการเดินทางข้ามภูเขา"
 tradition_warriors_of_the_dry_name:0 "นักรบแดนแห้งแล้ง"
 tradition_warriors_of_the_dry_desc:0 "วัฒนธรรมนี้เชี่ยวชาญศิลปะการต่อสู้ในสภาพอากาศที่แห้งแล้งมาก"
 tradition_highland_warriors_name:0 "นักรบที่สูง"
 tradition_highland_warriors_desc:0 "นักรบของวัฒนธรรมนี้ต่อสู้ได้ดีบนเนินเขาและหุบเขาในบ้านเกิดที่เป็นเนินเขาของพวกเขา"
 tradition_jungle_warriors_name:0 "นักรบป่าดงดิบ"
 tradition_jungle_warriors_desc:0 "นักรบของวัฒนธรรมนี้รู้วิธีเดินทางผ่านป่าดงดิบที่อันตรายเป็นอย่างดี"
 tradition_only_the_strong_name:0 "เฉพาะผู้แข็งแกร่ง"
 tradition_only_the_strong_desc:0 "วัฒนธรรมนี้ให้ความสำคัญอย่างยิ่งกับการมีนักรบที่ได้รับการฝึกฝนมาอย่างดีเพียงไม่กี่คน หากท่านไม่ใช่สุดยอดของสุดยอด ท่านก็ไม่ได้รับอนุญาตให้รับใช้"
 tradition_warriors_by_merit_name:0 "นักรบตามความสามารถ"
 tradition_warriors_by_merit_desc:0 "วัฒนธรรมนี้เชื่อว่าหากท่านได้พิสูจน์ตัวเองว่ามีความสามารถในฐานะนักรบ ท่านควรได้รับอนุญาตให้ต่อสู้ — ไม่ว่าท่านจะเป็นใครก็ตาม"
 tradition_warrior_monks_name:0 "นักบวชนักรบ"
 tradition_warrior_monks_desc:0 "วัฒนธรรมนี้เชื่อว่าหากท่านเลือกที่จะศึกษาเทววิทยา ท่านก็ต้องสามารถปกป้องศรัทธาของท่านได้ เช่นกัน"
 tradition_talent_acquisition_name:0 "การยอมรับผู้มีความสามารถ"
 tradition_talent_acquisition_desc:0 ""ฆ่าข้าเสียหากท่านต้องการ แต่หากท่านไว้ชีวิตข้า ข้าจะรับใช้ท่านอย่างภักดี""
 tradition_strength_in_numbers_name:0 "พลังแห่งจำนวน"
 tradition_strength_in_numbers_desc:0 "วัฒนธรรมนี้ละทิ้งการมีกองทหารชั้นยอด และหันไปนิยมกองทัพขนาดใหญ่แทน"
 tradition_frugal_armorsmiths_name:0 "ช่างเกราะผู้ประหยัด"
 tradition_frugal_armorsmiths_desc:0 "ในขณะที่ชุดเกราะคุณภาพสูงอาจช่วยชีวิตคนหนึ่งได้ การมีชุดเกราะที่ดีสิบชุดอาจชนะการต่อสู้ได้"
 tradition_malleable_invaders_name:0 "ผู้รุกรานที่ปรับตัวได้"
 tradition_malleable_invaders_desc:1 "เราจะยึดครองดินแดนของท่าน ลูกหลานของท่าน ประเพณีของท่าน และ #EMP อนาคต#! ของท่าน"
 tradition_quarrelsome_name:0 "ชอบทะเลาะวิวาท"
 tradition_quarrelsome_desc:0 "ความขัดแย้งตามแนวชายแดนเป็นเรื่องปกติสำหรับผู้ปกครองของวัฒนธรรมนี้ ที่ดินมักเปลี่ยนมือด้วยวิธีการที่ไม่ยุติธรรม"
 tradition_swords_for_hire_name:0 "ดาบรับจ้าง"
 tradition_swords_for_hire_desc:0 "วัฒนธรรมนี้มองว่างานทหารรับจ้างเป็นที่นิยมและสนับสนุนให้นักรบแสวงหาเกียรติยศในฐานะทหารรับจ้างระหว่างสงคราม"
 tradition_reverence_for_veterans_name:0 "ความเคารพทหารผ่านศึก"
 tradition_reverence_for_veterans_desc:0 "วัฒนธรรมนี้ไม่ดูถูกผู้ที่ไม่สามารถต่อสู้ได้อีกต่อไป เนื่องจากอาการบาดเจ็บ แต่กลับเฉลิมฉลองพวกเขาในฐานะวีรบุรุษและใช้พวกเขาเป็นครู"
 tradition_stalwart_defenders_name:0 "ผู้พิทักษ์ผู้แข็งแกร่ง"
 tradition_stalwart_defenders_desc:0 "การปกป้องสิ่งที่เป็นของตนเองมีความสำคัญสูงสุดต่อวัฒนธรรมนี้"
 tradition_battlefield_looters_name:0 "ผู้ปล้นสะดมในสนามรบ"
 tradition_battlefield_looters_desc:0 "ในวัฒนธรรมนี้ การต่อสู้ไม่ได้ทำเพื่อเกียรติภูมิ แต่เพื่อผลกำไร ใครจะสนใจสถานะของตนเองหากท่านไม่สามารถจ่ายค่าสงครามได้?"
 tradition_fervent_temple_builders_name:0 "ผู้สร้างวัดอย่างแรงกล้า"
 tradition_fervent_temple_builders_desc:0 "วัฒนธรรมนี้พบว่าการสร้างวัดเป็นเส้นทางตรงที่สุดสู่สิ่งศักดิ์สิทธิ์ ผู้ปกครองที่ศรัทธาแรงกล้าคาดว่าจะสร้างวัดหลายแห่งและยิ่งใหญ่"
 tradition_lords_of_the_elephant_name:0 "จ้าวคชสาร"
 tradition_lords_of_the_elephant_desc:0 "วัฒนธรรมนี้เคารพช้าง เปรียบเสมือนเชื้อพระวงศ์ พวกเขาเชี่ยวชาญในการจับช้าง ฝึกช้าง และใช้ช้างเพื่อผลกระทบที่ร้ายแรงในสงคราม"
 tradition_zealous_people_name:0 "ผู้ศรัทธาอย่างแรงกล้า"
 tradition_zealous_people_desc:0 "ผู้คนในวัฒนธรรมนี้มีความกระตือรือร้นและอุทิศตนต่อศรัทธาของตนเป็นพิเศษ"
 tradition_welcoming_name:1 "มีเสน่ห์"
 tradition_welcoming_desc:1 "ผู้คนในวัฒนธรรมนี้เก่งกาจในเรื่องการทูต และมารยาททางสังคมมีค่าเหนือสิ่งอื่นใด"
 tradition_agrarian_name:0 "เกษตรกรรม"
 tradition_agrarian_desc:0 "วัฒนธรรมนี้เป็นเกษตรกรรมอย่างชัดเจน ดินแดนของพวกเขาผลิตพืชผลมากมายสำหรับกองทัพที่หิวโหย แม้ว่าการไม่ต้องดิ้นรนเพื่ออาหารหมายถึงชาวนาจำนวนมากสำหรับกองทัพเกณฑ์ แต่ก็หมายความว่าทหาร แต่ละคนไม่ได้รับแรงจูงใจเท่ากับผู้ที่มาจากภูมิภาคที่โหดร้ายกว่า"
 tradition_eye_for_an_eye_name:0 "ตาต่อตา ฟันต่อฟัน"
 tradition_eye_for_an_eye_desc:0 "ในวัฒนธรรมนี้ การดูถูกเหยียดหยามไม่ใช่สิ่งที่ควรลืม หรือให้อภัย ผู้คนสามารถเก็บความแค้นไว้ได้นาน และการแก้แค้นก็ดำเนินไปด้วยความหลงใหล"
 tradition_forbearing_name:0 "อดทนอดกลั้น"
 tradition_forbearing_desc:1 "ในวัฒนธรรมนี้ การอดทนและยับยั้งชั่งใจเมื่อเผชิญกับความทุกข์ยากเป็นเรื่องปกติ"
 tradition_equitable_name:0 "ยุติธรรม"
 tradition_equitable_desc:0 "ในวัฒนธรรมนี้ ความจริงและความยุติธรรมที่ไม่ลำเอียงมีค่าสูงส่ง"
 tradition_charitable_name:0 "ใจบุญสุนทาน"
 tradition_charitable_desc:0 "ไม่ว่าจะมีศรัทธาใด ผู้คนในวัฒนธรรมนี้มีแรงจูงใจที่จะสนับสนุนผู้ที่ด้อยโอกาสกว่า"
 tradition_modest_name:0 "ถ่อมตน"
 tradition_modest_desc:0 "วัฒนธรรมนี้ให้ความสำคัญกับความถ่อมตน ไม่ควรทำตัวเด่นเกินไปหรือคิดว่าตนเองดีกว่าผู้อื่น"
 tradition_hill_dwellers_name:0 "ชาวเนินเขา"
 tradition_hill_dwellers_desc:0 "วัฒนธรรมนี้คุ้นเคยกับเนินเขา และรู้วิธีใช้ประโยชน์จากที่ดินอย่างมีประสิทธิภาพ"
 tradition_forest_folk_name:0 "ชาวป่า"
 tradition_forest_folk_desc:0 "วัฒนธรรมนี้อาศัยอยู่ใกล้ป่าใหญ่ และรู้วิธีหาของป่า"
 tradition_mountain_homes_name:0 "บ้านภูเขา"
 tradition_mountain_homes_desc:0 "วัฒนธรรมนี้รู้วิธีใช้ชีวิตและเจริญเติบโตบนที่ราบสูงใกล้กับความลาดชันอันโหดร้ายของภูเขา"
 tradition_dryland_dwellers_name:0 "ชาวแดนแห้งแล้ง"
 tradition_dryland_dwellers_desc:0 "วัฒนธรรมนี้คุ้นเคยกับการใช้ชีวิตในสภาพอากาศแห้งแล้ง และรู้ว่าจะหาน้ำได้ที่ไหนและจะใช้ประโยชน์จากที่ดินได้อย่างไร"
 tradition_jungle_dwellers_name:0 "ชาวป่าดงดิบ"
 tradition_jungle_dwellers_desc:0 "วัฒนธรรมนี้อาศัยอยู่ใกล้ป่าดงดิบ และรู้วิธีเก็บเกี่ยวความร่ำรวยของมัน"
 tradition_faith_bound_name:0 "ผูกพันด้วยศรัทธา"
 tradition_faith_bound_desc:0 "ในวัฒนธรรมนี้ การมีศรัทธาที่แตกต่างกันหมายความว่าท่านไม่มีสิทธิ์ในการสืบทอด"
 tradition_by_the_sword_name:0 "ด้วยคมดาบ"
 tradition_by_the_sword_desc:0 "สมาชิกของวัฒนธรรมนี้เชื่อว่ามิชชันนารีที่ดีที่สุดคือผู้ที่ถือดาบ แม้ว่าการสนับสนุนสงครามศักดิ์สิทธิ์จะแพร่หลาย แต่แรงจูงใจก็ถูกตรวจสอบ เพื่อให้แน่ใจว่าอำนาจศักดิ์สิทธิ์จะเห็นชอบ"
 tradition_language_scholars_name:0 "นักภาษาศาสตร์"
 tradition_language_scholars_desc:0 "การเรียนรู้คำพูดของเพื่อนบ้าน ทำให้ท่านเข้าใกล้ภาษาของสิ่งศักดิ์สิทธิ์ไปอีกก้าวหนึ่ง"
 tradition_pastoralists_name:0 "ผู้เลี้ยงปศุสัตว์"
 tradition_pastoralists_desc:0 "วัฒนธรรมนี้คุ้นเคยกับภูมิประเทศที่กว้างและเปิดโล่ง ซึ่งพวกเขาเลี้ยงสัตว์ฝูงใหญ่"
 tradition_desert_nomads_name:1 "นักเดินทางทะเลทราย"
 tradition_desert_nomads_desc:1 "วัฒนธรรมนี้ไม่แปลกหน้ากับสภาพแวดล้อมที่โหดร้ายของทะเลทราย และเชี่ยวชาญในการใช้อูฐเพื่อช่วยในการเดินทาง การทำสงคราม และชีวิตประจำวัน"
 tradition_gardening_name:0 "สถาปนิกสวน"
 tradition_gardening_desc:0 "วัฒนธรรมนี้มีประเพณีอันยาวนานในการสร้างและบำรุงรักษาสวนประเภทต่างๆ สร้างสวรรค์เล็กๆ ให้กับตนเอง"
 can_appoint_court_gardener_name: "[GetCultureTradition('tradition_gardening').GetName]"
 tradition_monogamous_name:0 "ผัวเดียวเมียเดียว"
 tradition_monogamous_desc:0 "ในวัฒนธรรมนี้ คนๆ หนึ่งจะมีคู่สมรสเพียงคนเดียว โดยไม่คำนึงถึงศรัทธา"
 tradition_polygamous_name:0 "หลายคู่ครอง"
 tradition_polygamous_desc:0 "ในวัฒนธรรมนี้ คนๆ หนึ่งมักจะมีคู่สมรสหลายคน โดยไม่คำนึงถึงศรัทธา"
 tradition_concubines_name:1 "นางสนม"
 tradition_concubines_desc:1 "ผู้ปกครองของวัฒนธรรมนี้มักจะมีนางสนมจำนวนหนึ่งในครัวเรือน โดยไม่คำนึงถึงศรัทธาของพวกเขา"
 tradition_mendicant_mystics_name:0 "นักพรตภิกขาจาร"
 tradition_mendicant_mystics_desc:1 "ผู้ศักดิ์สิทธิ์ของวัฒนธรรมนี้เชื่อมั่นอย่างยิ่งว่าศรัทธาควรได้รับการเผยแผ่ในสนาม และผู้ที่เคร่งศาสนาที่สุดของพวกเขามักจะเดินทางไปทั่วโลก"
 tradition_parochialism_name:0 "คติท้องถิ่นนิยม"
 tradition_parochialism_desc:0 "ชาวเมืองของวัฒนธรรมนี้มีการแข่งขันสูงและเป็นอิสระอย่างดุเดือด พวกเขาลงทุนเงินและพลังงานจำนวนมาก เพื่อให้แน่ใจว่าเมือง #EMP ของพวกเขา#! ยิ่งใหญ่ที่สุด"
 tradition_martial_admiration_name:0 "ความชื่นชมในการทหาร"
 tradition_martial_admiration_desc:0 "ผู้ที่เต็มใจจับดาบและต่อสู้เพื่อวัฒนธรรมของตนสมควรได้รับการชื่นชม ไม่ว่าโอกาสจะเป็นอย่างไร"
 tradition_chanson_de_geste_name:0 "บทเพลงวีรกรรม"
 tradition_chanson_de_geste_desc:0 "วัฒนธรรมนี้ให้ความสำคัญกับการกระทำอันกล้าหาญของบรรพบุรุษที่ล่วงลับไปนานแล้ว การเล่าขานชีวิตของอัศวินอย่างกีโยม หรือโรลองด์ จะเป็นแรงบันดาลใจให้คนรุ่นหลัง"
 tradition_ruling_caste_name:0 "วรรณะผู้ปกครอง"
 tradition_ruling_caste_desc:0 "ผู้ปกครองของวัฒนธรรมนี้คุ้นเคยกับการปกครองไพร่ฟ้าที่ไม่ใช่วัฒนธรรมของตนเอง พวกเขารู้วิธีปราบปรามการกบฏอย่างมีประสิทธิภาพ แม้ว่าจะต้องแลกมาด้วยการรับรู้ของสาธารณชนก็ตาม"
 tradition_staunch_traditionalists_name:0 "ผู้ยึดมั่นในจารีตดั้งเดิม"
 tradition_staunch_traditionalists_desc:1 "ประเพณีคือประเพณี มันไม่สามารถเคลื่อนย้ายและเปลี่ยนแปลงไม่ได้ เราต้องพร้อมและเต็มใจที่จะยืนหยัดเพื่อสิ่งที่ ทำให้เราเป็นเรา"
 tradition_sacred_groves_name:0 "ป่าศักดิ์สิทธิ์"
 tradition_sacred_groves_desc:0 "ต้นไม้ถือเป็นสิ่งศักดิ์สิทธิ์โดยวัฒนธรรมนี้ ป่าคือสิ่งมีชีวิตที่ควรได้รับการดูแล—ไม่ใช่ถูกทำลาย"
 tradition_hold_the_line_name:0 "รักษาแนวรบ"
 tradition_hold_the_line_desc:1 "วัฒนธรรมนี้จะ ทำให้ทหารทุกคนรู้สึกภาคภูมิใจในความแข็งแกร่งของตน คำปราศรัยปลุกใจของผู้บัญชาการ ทำให้ทหารมีแรงบันดาลใจจนถึงที่สุด"
 tradition_legendary_noble_families_name:0 "ตระกูลขุนนางในตำนาน"
 tradition_legendary_noble_families_desc:1 "เว้นแต่ท่านจะเชื่อมโยงกับตระกูลขุนนางตระกูลใดตระกูลหนึ่งที่ช่วยหล่อหลอมชะตากรรมของวัฒนธรรมนี้ ท่านก็ไม่มีอะไรเลย"
 tradition_castle_keepers_name:0 "ผู้พิทักษ์ปราสาท"
 tradition_castle_keepers_desc:1 "การรุกไม่ใช่การป้องกันที่ดี การป้องกันที่ดีคือการมีปราสาทมากที่สุดในโลกที่รู้จัก"
 tradition_city_keepers_name:0 "ผู้พิทักษ์นคร"
 tradition_city_keepers_desc:1 "เมืองคือหัวใจของเมืองที่เต้นระรัวของวัฒนธรรมนี้ และพวกเขาปรารถนาให้มหานครทุกแห่งของตนกลายเป็นอัญมณีที่น่าอิจฉา ซึ่งเป็นที่รู้จักไปทั่วโลก"
 tradition_fractious_name:0 "แตกแยก"
 tradition_fractious_desc:1 "ศัตรูของศัตรูข้า #EMP ก็คือ#! ศัตรูข้า เช่นกัน"
 tradition_runestones_name:1 "ผู้สร้างรูนสโตน"
 tradition_runestones_desc:1 "ความตาย การพิชิต การได้มา ซึ่งยศศักดิ์ — สิ่งเหล่านี้ไม่ใช่สิ่งที่กำหนดชีวิตในหมู่ชนชั้นสูงหรือ? ที่ใดที่คนของเราไป ที่นั่นก็มีเครื่องหมายแห่งคุณค่าชีวิตของเรา"
 tradition_insular_spirit_name:0 "จิตวิญญาณแห่งการปิดกั้น"
 tradition_insular_spirit_desc:1 "วัฒนธรรมนี้มุ่งมั่นที่จะไม่เบี่ยงเบนไปจากวิถีดั้งเดิม และจะต่อสู้เพื่อคนของตนที่ถูกโจมตีโดยวัฒนธรรมอื่น"
 tradition_monastic_communities_name:0 "ชุมชนอาราม"
 tradition_monastic_communities_desc:1 "วัฒนธรรมนี้มีประวัติศาสตร์อันยาวนานในการส่งลูกหลานขุนนางไปรับใช้ศาสนา นักคิดทางการเมืองที่เคารพนับถือมักเกิดขึ้นจากคณะสงฆ์"
 tradition_roman_legacy_name:1 "มรดกโรมันตะวันออก"
 tradition_roman_legacy_desc:1 "การจัดระเบียบทางทหารของจักรวรรดิโรมันยังคงอยู่ในความทรงจำที่มีชีวิตภายในวัฒนธรรมนี้ กองทัพอาชีพเป็นที่นิยมมากกว่ากองทหารเกณฑ์"
 tradition_longbow_competitions_name:0 "การแข่งขันธนูยาว"
 tradition_longbow_competitions_desc:1 "วัฒนธรรมนี้ชื่นชอบธนูที่ทรงพลังกว่าที่คนส่วนใหญ่จะสามารถง้างได้ และการฝึกฝนกับพวกมันสัปดาห์ละครั้งก็เป็นที่รักพอๆ กับพิธีกรรมบูชาใดๆ ทุกหนทุกแห่งตั้งแต่หมู่บ้านที่ห่างไกลที่สุดไปจนถึงมหานครที่ใหญ่ที่สุด"
 tradition_illyrian_grit_name:0 "ความทรหดแบบอิลลิเรียน"
 tradition_illyrian_grit_desc:1 "วัฒนธรรมนี้อาจต่อสู้กับตัวเองอยู่เสมอ แต่จะลุกขึ้นต่อสู้กับผู้รุกรานร่วมกันเมื่อถึงเวลา"
 tradition_maritime_mercantilism_name:0 "พาณิชยนาวี"
 tradition_maritime_mercantilism_desc:1 "โลกอาจถูกปกครองโดยกองทัพ แต่วัฒนธรรมนี้รู้ดีว่ามันถูกควบคุมอย่างแท้จริงโดยใครก็ตามที่ครอบงำการไหลเวียนของทองคำข้ามทะเล"
 tradition_sacral_kingship_name:0 "กษัตริย์ศักดิ์สิทธิ์"
 tradition_sacral_kingship_desc:1 "ผู้ปกครองในวัฒนธรรมนี้ถือว่าเป็นเทพเจ้า หรือความเป็นกษัตริย์ถูกมองว่าเป็นคุณธรรมอันศักดิ์สิทธิ์ กษัตริย์คืออะไรเมื่อเทียบกับเทพเจ้า?"
 tradition_reavers_name:0 "ผู้ปล้นสะดม"
 tradition_reavers_desc:1 "หลายคนในวัฒนธรรมนี้ที่อาศัยอยู่บนชายฝั่งลองเสี่ยงขึ้นเรือเพื่อไปขโมยของจากท่าเรืออื่น แม้ว่าเจ้าเหนือหัวโดยตรงของพวกเขาจะไม่เห็นด้วย แต่ผู้ปกครองทุกคนรู้ดีว่ามันจะ ทำให้ทหารเก่งขึ้นเมื่อถึงเวลา"
 tradition_practiced_pirates_name:0 "โจรสลัดผู้ช่ำชอง"
 tradition_practiced_pirates_desc:1 "การบุกท่าเรือ จุดไฟเผา และเอาทุกอย่างที่ไม่ได้ตอกตะปูอาจไม่สูงส่ง แต่มัน #EMP ทำกำไรได้#! "
 tradition_determined_independence_name:0 "เอกราชอันแน่วแน่"
 tradition_determined_independence_desc:1 "ตายเสียดีกว่ายอมจำนน! ผู้ปกครองจากวัฒนธรรมนี้ไม่พบความพ่ายแพ้ใดเลวร้ายไปกว่าการเป็นข้าในบังคับ และจะทำทุกอย่างเพื่อเป็นนายของตนเอง"
 tradition_merciful_blindings_name:0 "การ ทำให้ตาบอดอย่างเมตตา"
 tradition_merciful_blindings_desc:1 "ไม่ว่าใครจะทำผิดเกินกว่าจะให้อภัยไปไกลแค่ไหน วัฒนธรรมนี้คิดว่าการควักลูกตาออกดีกว่าการแทงทะลุหัวใจ"
 tradition_reindeer_hunters_name:0 "นักล่ากวางเรนเดียร์"
 tradition_reindeer_hunters_desc:1 "การไล่ล่ากวางเป็นเพียงการเต้นรำบนน้ำค้างแข็งตลอดกาลของไทกา วัฒนธรรมนี้ได้เรียนรู้ที่จะใช้อุปกรณ์ล่าสัตว์ที่มีอยู่ให้คุ้มค่าที่สุด"
 tradition_mountaineer_ruralism_name:0 "ชนบทนิยมชาวเขา"
 tradition_mountaineer_ruralism_desc:1 "จากต้นกำเนิดในเนินเขาของป่าโบฮีเมีย ไปจนถึงหน้าผาของเทือกเขาโอเรและทาทรา คนส่วนใหญ่ในวัฒนธรรมนี้ไม่เพียง แต่รู้วิธีเดินทางข้ามดินแดนที่เป็นหิน แต่ยังรับมือกับชีวิตบนภูเขาได้อย่างง่ายดาย"
 tradition_life_is_just_a_joke_name:0 "ชีวิตเป็นเพียงเรื่องตลก"
 tradition_life_is_just_a_joke_desc:1 "วัฒนธรรมนี้จะหัวเราะบนเขียงโดยมีขวานอยู่เหนือศีรษะ"
 tradition_steppe_tolerance_name:0 "ความอดกลั้นแห่งทุ่งหญ้าสเตปป์"
 tradition_steppe_tolerance_desc:1 "ผู้ที่อาศัยอยู่บนทุ่งหญ้าสเตปป์จะมีอะไรเหมือนกันมากมายกับผู้ที่มีวิถีชีวิตแบบเดียวกัน คนแปลกหน้าอาจบูชาแตกต่างกัน แต่พวกเขาก็ยังคงใช้ชีวิตอยู่บนหลังม้า"
 tradition_nubian_warrior_queens_name:0 "ราชินีนักรบ"
 tradition_nubian_warrior_queens_desc:0 "ผู้ที่อาศัยอยู่ในแอฟริกาตะวันออกจดจำราชินีนักรบผู้ยิ่งใหญ่ที่เคยยืนหยัดต่อสู้กับผู้รุกรานและก่อตั้งอาณาจักรบนดินแดนคูชได้เป็นอย่างดี เพื่อนบ้านของเราอาจยืนกรานในความเหนือกว่าของผู้ชาย แต่เราสืบสายเลือดผ่านทางมารดา และเสียงโห่ร้องในสงครามของผู้หญิงนูเบียที่ทรงพลังส่ง "ชาย" ต่างชาติเหล่านี้วิ่งหนีกลับบ้าน"
 tradition_nubian_warrior_kings_name:0 "กษัตริย์นักรบ"
 tradition_nubian_warrior_kings_desc:0 "ผู้ที่อาศัยอยู่ในแอฟริกาตะวันออกจดจำกษัตริย์นักรบผู้ยิ่งใหญ่ที่เคยยืนหยัดต่อสู้กับผู้รุกรานและก่อตั้งอาณาจักรบนดินแดนคูชได้เป็นอย่างดี เพื่อนบ้านของเราอาจยืนกรานในความเหนือกว่าของผู้หญิง แต่เราสืบสายเลือดผ่านทางบิดา และเสียงโห่ร้องในสงครามของผู้ชายชาวนูเบียที่ทรงพลังส่ง "หญิง" ต่างชาติเหล่านี้วิ่งหนีกลับบ้าน"
 tradition_maritime_mangroves_name:0 "ป่าชายเลนทางทะเล"
 tradition_maritime_mangroves_desc:1 "วัฒนธรรมนี้ได้เรียนรู้ที่จะล่องเรือในพื้นที่ลุ่มที่วัฒนธรรมอื่นพบว่าไม่สามารถผ่านได้ "พวกเขาใช้สิ่งนี้เพื่อสร้างฐานที่เข้าถึงไม่ได้ ซึ่งใช้ในการค้า ปล้นสะดม และสำรวจโลก""
 tradition_mixed_governance_name:0 "การปกครองแบบผสม"
 tradition_mixed_governance_desc:1 "วัฒนธรรมนี้ถือว่าทุกความคิดควรค่าแก่การรับฟัง และทุกวิถีทางใหม่ในการปกครองควรค่าแก่การลอง ผู้ปกครองสนับสนุนให้ข้าในบังคับปกครองตามที่เห็นสมควร"
 tradition_ritual_scarrification_name:0 "การกรีดผิวเป็นพิธีกรรม"
 tradition_ritual_scarrification_desc:1 "วัฒนธรรมนี้เคารพผู้ที่เนื้อหนังได้ลิ้มรสคมดาบ ไม่ว่าจะเพื่อพิสูจน์ความกล้าหาญ หรือเพื่อสร้างลวดลายที่สวยงาม พวกเขากรีดผิวหนังของตนเอง"
 tradition_hidden_cities_name:0 "นครเร้นลับ"
 tradition_hidden_cities_desc:2 "ไม่ว่าพวกเขาจะอยู่บนต้นไม้ในป่า หรือได้รับการปกป้องจากเขาวงกตตามธรรมชาติ ชาวต่างชาติอาจไม่รู้ด้วยซ้ำว่าเมืองของวัฒนธรรมนี้มีอยู่จริง นับประสาอะไรกับการรู้วิธีปิดล้อมพวกเขา"
 tradition_hereditary_bards_name:0 "นักกวีสืบทอดทางสายเลือด"
 tradition_hereditary_bards_desc:1 "สำหรับบางวัฒนธรรม มีเรื่องราวที่สืบทอดกันมารุ่นต่อรุ่น มีค่าเท่ากับโฉนดที่ดินใดๆ"
 tradition_ancient_miners_name:0 "นักขุดแร่โบราณ"
 tradition_ancient_miners_desc:1 "วัฒนธรรมนี้รายล้อมไปด้วยวัตถุดิบ แร่ และอัญมณีที่ยังไม่ได้เจียระไนมาโดยตลอด พวกเขามีความสามารถพิเศษในการค้นหาสถานที่สำหรับการขุดเหมือง"
 tradition_wetlanders_name:0 "ชาวพื้นที่ชุ่มน้ำ"
 tradition_wetlanders_desc:1 "วัฒนธรรมนี้เชี่ยวชาญในหนองบึงและที่ลุ่ม แม้ว่าบางครั้งชีวิตจะเป็นการต่อสู้กับเชื้อรา แต่พวกเขาก็ได้เรียนรู้ที่จะใช้ประโยชน์จากพีท"
 tradition_diasporic_name:0 "พลัดถิ่น"
 tradition_diasporic_desc:1 "ผู้คนในวัฒนธรรมนี้ได้สูญเสียบ้านเกิดที่พวกเขาเคยรัก บางคนเดินทางไปทั่วโลกเพื่อค้นหาสถานที่ที่พวกเขาอาจเริ่มต้นใหม่ได้"
 tradition_sorcerous_metallurgy_name:0 "โลหะวิทยาอาคม"
 tradition_sorcerous_metallurgy_desc:1 "มีนักเล่นแร่แปรธาตุในวัฒนธรรมนี้ที่พยายามเปลี่ยนโลหะให้เป็นทองคำมากพอๆ กับช่างตีเหล็กที่ตีอาวุธ จะเป็นไรไปหากความมั่งคั่งและอาวุธยุทโธปกรณ์ของวัฒนธรรมนี้ได้รับการเสริมพลังด้วยเวทมนตร์คาถา?"
 tradition_polders_name:0 "โพลเดอร์"
 tradition_polders_desc:0 "วัฒนธรรมนี้มีประเพณีอันยาวนานในการถมที่ดินจากทะเลโดยรอบ สิ่งนี้ ทำให้พวกเขาสามารถใช้ประโยชน์จากสิ่งที่ปกติจะเป็นพื้นทะเลตื้นสำหรับการทำฟาร์มและการก่อสร้าง"
 tradition_caucasian_wolves_name:0 "หมาป่าคอเคซัส"
 tradition_caucasian_wolves_desc:0 "หลังจากใช้เวลาหลายศตวรรษในการสร้างบ้านรอบประตูคอเคซัส วัฒนธรรมนี้ก็คุ้นเคยกับทุกสิ่งที่เกี่ยวข้องกับการทำสงครามบนภูเขาเป็นอย่างดี"
 tradition_artisans_name:0 "ช่างฝีมือผู้เชี่ยวชาญ"
 tradition_artisans_desc:0 "เด็กๆ ในวัฒนธรรมนี้มักจะสืบทอดอาชีพของพ่อแม่ สั่งสมความรู้และทักษะที่กว้างขวางสำหรับงานฝีมือของตนจากรุ่นสู่รุ่น"

 # Debug Traditions
 tradition_debug_name:0 "วิถีปรวนแปร"
 tradition_debug_desc:0 "วัฒนธรรมนี้เป็นที่รู้จักในด้านจุดยืนที่หลากหลายและขัดแย้งกันมากมาย"

 # FP1 Traditions
 tradition_fp1_coastal_warriors_name:0 "นักรบชายฝั่ง"
 tradition_fp1_coastal_warriors_desc:1 "เรามักจะถูกดึงดูดไปยังชายฝั่งเสมอ ความเค็มของอากาศทะเล เสียงนกนางนวลร้อง กลิ่นปลาควัน... นักรบคนใดเล่าจะเลือกที่จะอยู่ห่างไกลจากน้ำและอิสรภาพของมัน?"
 tradition_fp1_performative_honour_name:0 "เกียรติยศเชิงแสดง"
 tradition_fp1_performative_honour_desc:1 "เกียรติยศเกิดมาพร้อมกับเรา ใช่ แต่เกียรติยศก็ได้รับและสูญเสียไปจากการกระทำ เช่นกัน โดยการไล่ตามและแก้แค้นการดูถูก หรือล้มเหลวที่จะทำ เช่นนั้น ทหารก็กลายเป็นเดนมนุษย์ ในขณะที่ลูกหมาก็เติบโตเป็นนักรบ"
 tradition_fp1_northern_stories_name:0 "ตำนานแดนเหนือ"
 tradition_fp1_northern_stories_desc:1 "ชีวิตถูกดำเนินไป เล่าขาน และจดจำผ่านมุมมองของนิทาน สิ่งที่เราพูด และสิ่งที่ผู้คนพูดถึงเรา มีความสำคัญพอๆ กับสิ่งที่เราทำ เราจำสิ่งนั้นได้ และมันแสดงให้เห็นในเรื่องราวของเรา"
 tradition_fp1_trials_by_combat_name:0 "การตัดสินคดีด้วยการประลอง"
 tradition_fp1_trials_by_combat_desc:1 "คำพูดเป็นสิ่งทดแทนอาวุธของคนขี้ขลาด ทำไมต้องปล่อยให้ความยุติธรรมอยู่ในมือของกฎหมายที่เสื่อมโทรมและผู้พิพากษาที่ทุจริต ในเมื่อข้อพิพาทสามารถตัดสินได้เร็วกว่าและยุติธรรมกว่าด้วยคมดาบ?"
 tradition_fp1_the_right_to_prove_name:0 "สิทธิ์ในการพิสูจน์"
 tradition_fp1_the_right_to_prove_desc:0 "แม้ว่าไม่ใช่ทุกคนที่เกิดมาเป็นนักสู้ แต่ด้วยความกล้าหาญที่เหมาะสมและแขนที่ถือดาบแข็งแรง ใครๆ ก็สามารถแสดงให้เห็นว่าตนเองเป็นนักรบในหัวใจและกลายเป็นนักรบในการกระทำได้"

 # Tradition effects - Base Title
 culture_parameter_city_buildings_more_county_opinion:0 "[holdings|E] ใน [city|E] ให้ [county_opinion|E] มากขึ้นต่อระดับ"
 culture_parameter_monastic_expectations:1 "[characters|E] ของ [culture|E] นี้มีแนวโน้มที่จะยอมรับการปฏิญาณตนมากขึ้น โดยเฉพาะบุตรที่ยังไม่บรรลุนิติภาวะของท่าน"
