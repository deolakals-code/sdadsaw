 tradition_maritime_way_of_life_name: "วิถีชีวิตทางทะเล"
 tradition_maritime_way_of_life_desc: "ตั้งแต่กาลก่อน เรือคาตามารัน (Catamarans) ของวัฒนธรรมนี้ถูกพบเห็นบนเส้นขอบฟ้า การเดินทางทางทะเลอันยาวนานเป็นธรรมชาติที่สองของคนเหล่านี้\nสำหรับผู้ที่ถือว่าชีวิตในทะเลเป็นเรื่องธรรมชาติ ไม่มีขีดจำกัดว่าพวกเขาจะตั้งถิ่นฐานที่ไหน ค้าขายอย่างไร หรือปล้นสะดมใคร"

 tradition_nudists_name: "ชีเปลือย"
 tradition_nudists_desc: "ผู้ยึดมั่นในวัฒนธรรมนี้ไม่เชื่อในการปกป้องร่างกายจากองค์ประกอบต่าง ๆ โดยเลือกที่จะใช้ชีวิตตามที่ผู้สร้างได้สร้างพวกเขามาแทน"

 tradition_stratified_society_name: "สังคมแบ่งชนชั้น"
 tradition_stratified_society_desc: "มีผู้ที่เกิดมาเพื่อนำ และผู้ที่เกิดมาเพื่อรับใช้ ใน $tradition_stratified_society_name$ ความเป็นจริงของสิทธิพิเศษทางสายเลือดมักอยู่เหนือหลักการของความสามารถ และความใกล้ชิดกับอำนาจคือทุกสิ่ง"
 culture_parameter_family_shares_merit: "เมื่อไปถึง [merit|E] @merit_level_5_icon![GetModifier( 'merit_level_5' ).GetNameWithTooltip|L] [close_family_member|E] เพศที่พึงประสงค์ทุกคนที่อยู่ต่ำกว่าระดับนี้จะได้รับ [merit|E] จำนวนมาก"
 culture_parameter_family_skips_exams: "นอกจากนี้ [close_family_members|E] เหล่านั้นจะถูกปฏิบัติเสมือนว่าผ่าน @provincial_exam_icon! [GetActivityType( 'activity_local_examination' ).GetName] แล้ว"
 culture_parameter_marrying_into_the_ruling_family_gives_influence: "เมื่อ [independent_ruler|E] แต่งงานกับ [character|E] ภายใน [realm|E] เดียวกันและมี [tradition|E] นี้ร่วมกัน [house_head|e] ของ [spouse_possessive|e] จะได้รับ [influence|E] มหาศาล"
