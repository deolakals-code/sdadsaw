 culture_parameter_devoted_trait_bonuses:0 "[traits|E] [GetTrait('devoted').GetName( GetNullCharacter )] มีโบนัสเพิ่มเติม"
 tradition_strong_kinship_name:0 "เครือญาติเข้มแข็ง"
 tradition_strong_kinship_desc:0 "วัฒนธรรมนี้มีประเพณีเครือญาติที่แข็งแกร่งภายในครอบครัวขยาย หรือตระกูล ในยามต้องการ ผู้ปกครองจะสามารถพึ่งพาญาติของตนได้เสมอ"
 tradition_amharic_highlanders_name:0 "ชาวที่สูงอัมฮารา"
 tradition_amharic_highlanders_desc:0 "ที่ราบสูงอัมฮาราค่อนข้างเหมาะสำหรับการทำฟาร์มตราบเท่าที่เรารู้วิธีที่ดีที่สุดในการจัดการเรื่องนี้ เป็นเวลาหลายชั่วอายุคนที่ผู้คนเหล่านี้ทำงานและอาศัยอยู่ในสภาพแวดล้อมนี้ เจริญรุ่งเรือง ในขณะที่พัฒนาประเพณีและขนบธรรมเนียมของตนเอง"

