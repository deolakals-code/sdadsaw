 culture_parameter_allows_adoption: "[characters|E]แห่ง[culture|E]นี้สามารถเสนอ[adoption|E]ให้แก่[children|E]ที่ไม่ได้เกี่ยวข้องโดยตรงกับ[rulers|E]ใดๆ"
