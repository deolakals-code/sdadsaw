 culture_tradition_events.3000.t: "พบเห็นหมี"
 culture_tradition_events.3000.desc: "นายพรานใน [bear_sighting.GetName] ได้พบเห็น [bear_sighting_county.Custom('GetAnimalGroup')] [bear_sighting_county.Custom('GetAnimalPlural')] กำลังท่องไปใน [bear_sighting.Custom('GetTerrainTypePlural')] — รอยเท้ากว้างในโคลน ต้นไม้มีรอยเล็บ พุ่มไม้หัก\n\nหากข้า [GetActivityType('activity_hunt').GetName|l] และสังหารหรือจับตัวหนึ่งได้ เหล่าวิญญาณจะต้องสังเกตเห็นอย่างแน่นอน"
 culture_tradition_events.3000.a: "ข้าควรเตรียมหอกของข้า..."
