 culture_parameter_strong_traits_more_valued:1 "[traits|E] เช่น [GetTrait('strong').GetName( GetNullCharacter )] หรือ [GetTrait('physique_good_1').GetName( GetNullCharacter )] ถูกมองว่า [prestigious|E][prestige_i]"
