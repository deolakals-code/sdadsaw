 remove_marriage_traditions:0 "[culture|E][culture_scope.GetName] สูญเสีย[traditions|E]ที่เปลี่ยนแปลง[marriage|E]ใดๆ ที่ขัดแย้งกับ[doctrines|E]ของ[faith_scope.GetName]"
 culture_tradition_events.0100.t:0 "ความขัดแย้งระหว่างวัฒนธรรมและศรัทธา"
 culture_tradition_events.0100.desc:0 "สาส์นจาก[head_of_faith.GetTitledFirstName]มาถึงแล้ว เริ่มต้นด้วยคำทักทายอันน่าพอใจ และสรุปความสำคัญที่ข้ามีต่อสายตาของชาว[culture_scope.GetName]\n\n"
 culture_tradition_events.0100.tradition_monogamous:0 ""ท่านต้องเข้าใจว่าตราบใดที่ผู้คนของท่านยังคงปฏิบัติการมีคู่สมรสคนเดียว ท่านกำลังละเมิดหลักคำสอนของชาว[faith_scope.GetAdjective]! ข้าเพียงปรารถนาความรอดของท่าน หน้าที่ของชาว[faith_scope.GetAdjectiveNoTooltip]ที่ดีทุกคนไม่สามารถบรรลุได้ด้วยคู่สมรสเพียงคนเดียว" สาส์นระบุ"
 culture_tradition_events.0100.tradition_polygamous:0 ""การปฏิบัติการมีคู่สมรสหลายคนของท่านขัดต่อหลักคำสอนของชาว[faith_scope.GetAdjective]อย่างเคร่งครัด และเป็นบาปในสายพระเนตรของ[faith_scope.HighGodName]! ข้าเพียงปรารถนาความรอดของท่าน โปรดนำผู้คนของท่านไปสู่แสงสว่างและละทิ้งคู่สมรสส่วนเกิน!" สาส์นระบุ"
 culture_tradition_events.0100.tradition_concubines:0 ""การปฏิบัติการมีนางบำเรอของท่านไม่ได้รับการสนับสนุนจากหลักคำสอนของชาว[faith_scope.GetAdjective] มีเพียงการ แต่งงานที่เหมาะสมเท่านั้นที่[faith_scope.HighGodName]จะยิ้มให้แก่ผู้คนของท่าน! ข้าเพียงปรารถนาความรอดของท่าน จงละทิ้งนางบำเรอของท่าน เพื่อประโยชน์ของเราทุกคน" สาส์นระบุ"
 culture_tradition_events.0100.end:0 "\n\nช่างเป็นภาวะที่กลืนไม่เข้าคายไม่ออก... ข้าให้ความสำคัญกับสิ่งใดมากกว่ากัน? ประเพณีของผู้คนของข้า หรือหลักคำสอนแห่งศรัทธาของเรา?"
 culture_tradition_events.0100.a:0 "เราต้องรักษาหลักคำสอนของชาว[faith_scope.GetAdjectiveNoTooltip]"
 culture_tradition_events.0100.b:0 "ประเพณีของผู้คนของข้าสำคัญกว่า!"

 culture_tradition_events.0101.t:0 "ความคิดของนักพรต"
 culture_tradition_events.0101.desc:0 "เป็นเรื่องยากพอที่ข้าจะมีโอกาสรับประทานอาหารอย่างเงียบๆ โดยไม่มีคนประจบสอพลอหรือเรื่องราชการมารบกวน แต่คืนนี้ข้าทำได้ อาหารค่ำที่สงบเงียบ และโอกาสพักผ่อนกล้ามเนื้อทางสังคมของข้า\n\nภายในไม่กี่วินาที ประตูก็พังออกจากบานพับอย่างน่าเศร้า และ[mendicant_mystic.GetFaith.PriestNeuter]คนหนึ่งก็บุกเข้ามาในห้อง [mendicant_mystic.GetSheHe|U]ถือไม้เท้าที่บิดเบี้ยว ยังคงเต็มไปด้วยเศษไม้จากการทุบประตูให้พังในครั้งเดียว\n\n"ท่าน[ROOT.Char.GetTitleAsNameNoTooltip]ผู้สูงศักดิ์ ข้ามาพร้อมข้อเสนอ! ด้วยค่าตอบแทนเล็กน้อย ข้า #EMP [mendicant_mystic.GetFirstName]#! จะแบ่งปันความรู้เกี่ยวกับวิถีโบราณของผู้คนของเรากับเด็กๆ ในราชสำนักของท่าน!""
 culture_tradition_events.0101.a:0 "แน่นอน ท่าน[mendicant_mystic.GetFaith.PriestNeuter]ผู้สูงศักดิ์ โปรดวางไม้เท้าลง"
 culture_tradition_events.0101.a.tt:0 "[children|E]ทุกคนที่มีอยู่ใน[court|E]จะได้รับการส่งเสริม[education|E]ที่กำลังดำเนินอยู่"
 culture_tradition_events.0101.b:0 "นี่มันไม่มากไปหน่อยหรือสำหรับงานของ[mendicant_mystic.GetFaith.HighGodNamePossessive]?"
 culture_tradition_events.0101.b.tt.success:0 "ท่านโต้เถียงให้นักพรตยอมลดราคา"
 culture_tradition_events.0101.b.tt.failure:0 "นักพรตออกจากราชสำนักของท่านไปด้วยความรังเกียจ"
 culture_tradition_events.0101.c:0 "ไปให้พ้น เจ้าขอทาน ข้ากำลังพยายามกินอาหารเย็น!"

 culture_tradition_events.0111.t:0 "คำปราศรัยของนักพรต"
 culture_tradition_events.0111.desc:0 ""...นี่คือเหตุผลที่เราต้องยอมตนต่อพระเมตตาของ [mendicant_mystic.GetFaith.HighGodName] ทุกขณะจิตในทุกวันของชีวิตเรา ท่านเข้าใจหรือไม่? ให้ข้ากล่าวต่อหรือไม่?"\n\nสอง. ชั่วโมง. เต็ม.\n\nข้าไม่รู้ด้วยซ้ำว่า [mendicant_mystic.GetName] หาทาง [mendicant_mystic.GetHerHis] เข้ามาในห้องพักของข้าได้อย่างไร แต่ [mendicant_mystic.GetFaith.PriestNeuter] ผู้นี้ได้เทศนาสั่งสอนข้าเกี่ยวกับรายละเอียดปลีกย่อยของเทววิทยา [mendicant_mystic.GetFaith.GetName] เป็นเวลา #EMP สอง. ชั่วโมง. เต็ม.#! \n\nในที่สุด [mendicant_mystic.GetWomanMan] ผู้นั้นก็เงียบลง มองมาที่ข้าเพื่อรอคำตอบ ข้ารู้สึกว่าตาของข้าเริ่มกระตุก"
 culture_tradition_events.0111.a:0 "ช่างเป็นคำพูดที่สร้างแรงบันดาลใจ!"
 culture_tradition_events.0111.b:0 "ท่านพูดส่วนของท่านแล้ว ตอนนี้ให้ข้าพูดส่วนของข้าบ้าง..."
 culture_tradition_events.0111.a.tt.success:0 "ท่านหักล้างข้อโต้แย้งของนักพรต"
 culture_tradition_events.0111.a.tt.failure:0 "ท่านพูดตะกุกตะกัก"
 culture_tradition_events.0111.c:0 "ใครปล่อยคนจรจัดคนนี้เข้ามาในบ้านข้า? ทหาร! ช่วยด้วย!"

 culture_tradition_events.0121.t:0 "การรับใช้ของนักพรต"
 culture_tradition_events.0121.desc:0 "แทบไม่เหมือนกับอาชีพของ [mendicant_mystic.GetHerHis] [mendicant_mystic.GetFirstName] ได้รออย่างอดทนในห้องรอก่อนที่ข้าจะอนุญาตให้ [mendicant_mystic.GetHerHim] เข้าเฝ้า\n\n[mendicant_mystic.GetFaith.PriestNeuter] ดูประหม่าเมื่อข้าเข้าไป แต่ก็รีบกล่าวสุนทรพจน์ทันทีที่ข้ามาถึง\n\n"[ROOT.Char.Custom('FormOfAddressForLiege')|U] ข้าเป็นนักบวชเร่ร่อนมาพักหนึ่งแล้ว และแม้นี่เป็นงานของ [mendicant_mystic.GetFaith.HighGodNamePossessive] แต่มันก็หนักหนาทั้งกายและใจ เช่นเดียวกับที่มันบำรุงเลี้ยงจิตวิญญาณ"\n\n"หากท่านต้องการข้า ข้าจะแขวนไม้เท้าของนักเดินทางและรับใช้ท่านในราชสำนักอย่างสุดความสามารถ ท-ท่านจะรับข้าไว้หรือไม่?""
 culture_tradition_events.0121.a:0 "ข้าสามารถใช้[mendicant_mystic.GetWomanMan]ที่มีความสามารถ เช่นท่านได้อย่างแน่นอน..."
 culture_tradition_events.0121.b:0 "ท่าน[mendicant_mystic.GetFaith.PriestNeuter]ผู้ภักดี ท่านว่า..."
 culture_tradition_events.0121.c:0 "หน้าตาแบบนั้น #EMP กลิ่น#! แบบนั้น แล้วท่านอยากอยู่ที่นี่?"

 culture_tradition_events.0131.t:0 "ความพิโรธของนักพรต"
 # Big credit to the greatest NPC of 2011.
 culture_tradition_events.0131.desc:0 ""[ROOT.Char.GetTitleAsNameNoTooltip]? เจ้าเป็นเพียงหนอน #EMP ดิ้นรนอยู่ในความโสโครก#! แห่งความเสื่อมทรามของเจ้าเอง! จงสำนึกบาปของเจ้าต่อหน้า[mendicant_mystic.GetFaith.HighGodName]! [mendicant_mystic.GetFaith.HighGodName]ผู้ทรงพลัง! [mendicant_mystic.GetFaith.HighGodName]ผู้ไม่ผิดพลาด! [mendicant_mystic.GetFaith.HighGodName]ผู้มิอาจโจมตีได้!"\n\nให้ตายสิ [mendicant_mystic.GetFaith.PriestNeuter]ที่น่ารำคาญคนนี้ มันแย่พอแล้วตอนที่[mendicant_mystic.GetSheHe]อยู่ตรงหัวมุมถนน! ถ้าข้า#EMP เคย#! รู้ว่าใครปล่อย[mendicant_mystic.GetFirstName]เข้ามาใน#EMP บ้าน#! ของข้า ข้าจะควักลูกตาของพวกเขาออกมา [mendicant_mystic.GetSheHe]อยู่ที่นี่ไม่ถึงสิบนาทีและข้าก็เริ่มปวดหัวคลัสเตอร์แล้ว\n\nข้าทนคำพูดพล่ามของนักพรตไม่ไหวแล้ว ข้าต้องดำเนินการอย่างรวดเร็ว ในขณะที่มีช่วงหยุดตามธรรมชาติในการพร่ำเพ้อของ[mendicant_mystic.GetHerHis]"
 culture_tradition_events.0131.a:0 "บาป#EMP ของข้า#!? มาพูดถึง#EMP เจ้า#! กันเถอะ"
 culture_tradition_events.0131.a.tt.success:0 "ท่านพิสูจน์ว่านักพรตเป็นคนหน้าซื่อใจคดอย่างสิ้นเชิง"
 culture_tradition_events.0131.a.tt.failure:0 "นักพรตแสดงให้เห็นว่าท่านเป็นคนโง่"
 culture_tradition_events.0131.b:0 "ท่าน... ท่านจะสอนให้ข้าดีขึ้นหรือไม่?"
 culture_tradition_events.0131.b.tt.success:0 "นักพรตช่วยให้ท่านเอาชนะความล้มเหลวของท่าน"
 culture_tradition_events.0131.b.tt.failure:0 "ท่านถูกครอบงำด้วยความปวดร้าวทางจิตใจ"
 culture_tradition_events.0131.c:0 "#EMP ดิ้นรนอยู่ในความโสโครก?#! โยนคนบ้าคนนี้ลงไปในบ่อส้วมที่ใกล้ที่สุด!"

 culture_tradition_events.0141.t:0 "การต่อรองของนักพรต"
 culture_tradition_events.0141.desc:0 ""ท่านไม่เห็นหรือ [ROOT.Char.Custom('FormOfAddressForLiege')] ว่าท่านกำลังเสี่ยงจิตวิญญาณของท่านกับ... แนวคิด [ROOT.Char.GetFaith.GetName] นี้? ให้ข้านำท่านสู่แสงสว่างแห่งความเชื่อ [mendicant_mystic.GetFaith.GetAdjective] ที่แท้จริง และช่วยท่านให้พ้นจากความทุกข์นิรันดร์!"\n\nในฐานะ [mendicant_mystic.GetFaith.PriestNeuter] นักบวชเร่ร่อน [mendicant_mystic.GetFirstName] คุ้นเคยกับการเทศนาแก่ชาว [ROOT.Char.GetCulture.GetName] ผู้ไม่เชื่อ แต่เทคนิคที่ใช้ได้ผลกับไพร่ไม่จำเป็นต้องใช้ได้ผลกับขุนนาง\n\nความเงียบเข้าปกคลุมระหว่างเรา และข้าพบว่าตัวเองกำลังจ้องลึกเข้าไปในดวงตาของ [mendicant_mystic.GetWomanMan] มองดูแสงแห่งความหวังและความปรารถนาที่เต้นระริกอยู่เบื้องหลัง"
 culture_tradition_events.0141.a:0 "ข้าพบว่าคำพูดของท่านน่าสนใจ ท่าน[mendicant_mystic.GetFaith.PriestNeuter]"
 culture_tradition_events.0141.b:0 "โปรดให้ข้าอธิบายข้อดีของความเชื่อ[ROOT.Char.GetFaith.GetNameNoTooltip]..."
 culture_tradition_events.0141.b.tt.success:0 "ท่านให้ความกระจ่างแก่[mendicant_mystic.GetFirstNameNoTooltip]"
 culture_tradition_events.0141.b.tt.failure:0 "ท่านยังคงขัดแย้งกัน"
 culture_tradition_events.0141.c:0 "[mendicant_mystic.GetFaith.HighGodName]ของท่าน! [mendicant_mystic.GetFaith.HighGodNameSheHe|U]มีกองทหารเกณฑ์เท่าไหร่?"

