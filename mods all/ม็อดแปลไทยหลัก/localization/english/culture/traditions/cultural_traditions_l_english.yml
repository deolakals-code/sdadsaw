 culture_tradition_events.3100.t: "การบูชายัญหมี"
 culture_tradition_events.3100.desc: "พวกเราผูกมัดหมีใหญ่ในความเงียบ เหล่านายพรานร้องเพลงเสียงต่ำ เสียงมั่นคง ควันลอยขึ้นพร้อมกับกลิ่นของต้นสปรูซ\n\nข้าคุกเข่า กดหน้าผากลงบนจมูกของมัน และกระซิบขอบคุณก่อนที่ใบมีดจะตกลงมา พวกเราจะแบ่งปันเนื้อของมัน เพื่อให้พละกำลังของมันอาจคงอยู่ท่ามกลางพวกเรา"
