 #Descs
 fled_riot_at_races_memory_desc:0 "ข้าหนีเอาตัวรอด ขณะที่สนามแข่งม้าในการประลองของข้าเกิดการจลาจลขึ้น และแขกเหรื่อจำนวนมากได้รับบาดเจ็บ"
 fled_riot_at_races_memory_desc_second_perspective:0 "ท่านหนีเอาตัวรอด ขณะที่สนามแข่งม้าในการประลองของท่านเกิดการจลาจลขึ้น และแขกเหรื่อจำนวนมากได้รับบาดเจ็บ"
 fled_riot_at_races_memory_desc_third_perspective:0 "[owner.GetName] หนีเอาตัวรอด ขณะที่สนามแข่งม้าในการประลองของ [owner.GetHerHis] เกิดการจลาจลขึ้น และแขกเหรื่อจำนวนมากได้รับบาดเจ็บ"
 failed_riot_at_races_memory_desc:0 "ข้าล้มเหลวในการป้องกันความรุนแรงของฝูงชน ซึ่งทำลายการแข่งม้าของข้าและ ทำให้แขกเหรื่อจำนวนมากบาดเจ็บ"
 failed_riot_at_races_memory_desc_second_perspective:0 "ท่านล้มเหลวในการป้องกันความรุนแรงของฝูงชน ซึ่งทำลายการแข่งม้าของท่านและ ทำให้แขกเหรื่อจำนวนมากบาดเจ็บ"
 failed_riot_at_races_memory_desc_third_perspective:0 "[owner.GetName] ล้มเหลวในการป้องกันความรุนแรงของฝูงชน ซึ่งทำลายการแข่งม้าของ [owner.HerHis] และ ทำให้แขกเหรื่อจำนวนมากบาดเจ็บ"
 calmed_the_crowd_memory_desc:0 "ด้วยถ้อยคำอันเคร่งขรึมและสละสลวยเพียงอย่างเดียว ข้าสามารถสงบฝูงชนอันกว้างใหญ่และก่อการจลาจลได้"
 calmed_the_crowd_memory_desc_second_perspective:0 "ด้วยถ้อยคำอันเคร่งขรึมและสละสลวยเพียงอย่างเดียว ท่านสามารถสงบฝูงชนอันกว้างใหญ่และก่อการจลาจลได้"
 calmed_the_crowd_memory_desc_third_perspective:0 "ด้วยสุนทรพจน์อันยิ่งใหญ่และของกำนัลนานาชนิด [owner.GetName] สามารถสงบฝูงชนอันกว้างใหญ่และก่อการจลาจลได้"

 #Titles
 fled_riot_at_races_memory:0 "หนีเอาตัวรอดขณะเกิดการจลาจล ณ สนามแข่งม้า"
 failed_riot_at_races_memory:0 "ล้มเหลวในการป้องกันฝูงชนที่แข่งม้าจากการก่อจลาจลอย่างรุนแรง"
 calmed_the_crowd_memory:0 "ระงับฝูงชนที่ก่อการจลาจลด้วยสุนทรพจน์อันยอดเยี่ยม"
 
