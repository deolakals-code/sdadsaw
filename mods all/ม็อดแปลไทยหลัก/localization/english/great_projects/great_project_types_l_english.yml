l_english: 
 great_project_type_great_wall: "ปรับปรุงกำแพงเมืองจีน"
 great_project_type_great_wall_desc: "กำแพงเมืองจีนตั้งตระหง่านเป็นประจักษ์พยานถึงทักษะทางวิศวกรรมและความอัจฉริยะของบรรพชนในการป้องปรามผู้รุกราน ทว่า เฉก เช่นสรรพสิ่ง กาลเวลาก็ได้ทิ้งร่องรอยไว้ กำแพงแห่งนี้จึงต้องการการปรับปรุงอย่างเร่งด่วน"
 great_project_type_great_wall_province_has_great_wall: "[province.GetNameNoTooltip] มีส่วนหนึ่งของ [GetBuilding('the_great_wall_01').GetName] ตั้งอยู่"
 great_project_type_great_wall_province_gains_great_wall: "[provinces|E] ที่ได้รับทุนสนับสนุน [great_project_contributions|E] จะได้รับการยกระดับส่วนของ [building|E] [GetBuilding('the_great_wall_04').GetName]"
 great_project_type_great_wall_possessive: "แห่งกำแพงเมืองจีน"
 great_project_type_great_wall_contribution_master_builder: "ว่าจ้างยอดนายช่างและเริ่มการก่อสร้าง"
 great_project_type_great_wall_contribution_master_builder_desc: "ป้อมปราการต้องได้รับการจัดการอย่างจริงจัง! ผู้มีสติปัญญาหลักแหลมที่สุดจักต้องได้รับมอบหมายให้ดูแล [great_project|e] นี้ เพื่อให้มั่นใจว่าใช้วัสดุที่ดีที่สุด จ้างวานแรงงานที่แข็งแกร่งที่สุด และสร้างกำแพงที่แข็งแกร่งที่สุด"
