 great_project_type_mandala_capital_02_contribution_brick: "อิฐ"
 great_project_type_mandala_capital_02_contribution_brick_desc: "สิ่งยิ่งใหญ่ไม่อาจสร้างจากความว่างเปล่า เราจะจัดหาอิฐทั้งหมดที่ [great_project|E] ต้องการเพื่อทำงานใน $building_mandala_capital_02$ ให้เสร็จสิ้น"

 great_project_type_mandala_capital_02_contribution_tiles: "กองกระเบื้อง"
 great_project_type_mandala_capital_02_contribution_tiles_desc: "หลังคาที่ดีคือหลังคาที่มุงกระเบื้อง เราจะส่งกระเบื้องที่ดีที่สุดของเราไปยัง [great_project|E] และปกป้องมันจากความชื้น!"

 great_project_type_mandala_capital_02_contribution_shallow_pools: "สระน้ำตื้น"
 great_project_type_mandala_capital_02_contribution_shallow_pools_desc: "องค์ประกอบทางน้ำมีความจำเป็นในการให้ความเย็นสบาย แต่ยังเชื่อมโยงเราเข้ากับภพภูมิศักดิ์สิทธิ์ด้วย"

 great_project_type_mandala_capital_02_contribution_work_force: "$great_project_type_mandala_capital_01_contribution_work_force$"
 great_project_type_mandala_capital_02_contribution_work_force_desc: "งานใหญ่ย่อมต้องการแรงงานมหาศาล! เราต้องจัดหากำลังคนเพิ่มสำหรับ [great_project|E] เพื่อบูรณะ $building_mandala_capital_02$ นี้ให้เสร็จสิ้น"

 great_project_type_mandala_capital_02_contribution_decorative_tiles: "กระเบื้องตก แต่ง"
 great_project_type_mandala_capital_02_contribution_decorative_tiles_desc: "ให้เราเพลิดเพลินและเพิ่มกระเบื้องตก แต่งบนหลังคา ขอบโค้งมน การแกะสลักอันประณีต ความงดงามที่มากขึ้นเพื่อสร้างความเจริญตาเจริญใจแก่ทั้งเทพและมนุษย์"

 great_project_type_mandala_capital_02_contribution_decorated_domes: "โดมประดับ"
 great_project_type_mandala_capital_02_contribution_decorated_domes_desc: "โดมที่ดีคือโดมที่กลม พวกมันจะกลม มีสัน และลวดลายที่น่าสนใจในไม่ช้า"

 great_project_type_mandala_capital_02_contribution_family_statues: "รูปปั้นศักดิ์สิทธิ์ของทายาท"
 great_project_type_mandala_capital_02_contribution_family_statues_desc: "เหล่าทายาทแห่งสายเลือดศักดิ์สิทธิ์ของเราจะมีใบหน้าอันสูงส่งสลักไว้ในรูปปั้นหิน เพื่อให้พวกเขาเป็นที่จดจำไปตลอดกาล"


 great_project_type_mandala_capital_03: "$great_project_type_mandala_capital_02$"
 great_project_type_mandala_capital_03_desc: "$great_project_type_mandala_capital_02_desc$"
 great_project_type_mandala_capital_03_possessive: "$building_mandala_capital_03$'s"

 great_project_type_mandala_capital_03_contribution_rite_of_worthiness: "พิธีกรรมแห่งความคู่ควร"
 great_project_type_mandala_capital_03_contribution_rite_of_worthiness_desc: "เราจะพิสูจน์ความคู่ควรของเราในการได้รับอนุญาตให้พัฒนา [GetBuilding('mandala_capital_01').GetTypeName] ของเราต่อไป ก้าวขึ้นสู่หน้าประวัติศาสตร์!"

 great_project_type_mandala_capital_03_contribution_volcanic_stone: "หินภูเขาไฟ"
 great_project_type_mandala_capital_03_contribution_volcanic_stone_desc: "ความทะเยอทะยานอันสูงส่งที่สุดต้องการรากฐานที่มั่นคงที่สุด เราจะจัดหาหินภูเขาไฟที่ [great_project|E] ต้องการเพื่อสร้างรากฐานที่มั่นคง ซึ่งจะคงอยู่ตลอดไป"

 great_project_type_mandala_capital_03_contribution_corbel_gateways: "ซุ้มประตูหินเท้าแขน"
 great_project_type_mandala_capital_03_contribution_corbel_gateways_desc: "เมื่อเราขยายวัด เราต้องการโครงที่เหมาะสมเพื่อรองรับการก่อสร้าง ซุ้มประตูเหล่านี้จะช่วยนำทางผู้ที่สัญจรไปมาในบริเวณเพื่อแสวงหาการตรัสรู้"

 great_project_type_mandala_capital_03_contribution_divine_statues: "รูปปั้นเทพ"
 great_project_type_mandala_capital_03_contribution_divine_statues_desc: "ศีรษะขนาดยักษ์เหล่านี้อาจดูน่าเกรงขาม แต่โดยเนื้อแท้แล้ว พวกมัน ทำให้สถานที่แห่งนี้ศักดิ์สิทธิ์ ปลูกฝังความรู้สึกของบรรยากาศและคุณธรรม"

 great_project_type_mandala_capital_03_contribution_work_force: "$great_project_type_mandala_capital_01_contribution_work_force$"
 great_project_type_mandala_capital_03_contribution_work_force_desc: "เพื่อไปให้ถึงสวรรค์ เราต้องทำงานหนัก ต้องการคนเพิ่มในการสร้าง $building_mandala_capital_03$ และการสนับสนุนของเราจะได้รับรางวัลอย่างงาม"

 great_project_type_mandala_capital_03_contribution_creation_aspect: "รูปปั้นแห่งการสร้างสรรค์"
 great_project_type_mandala_capital_03_contribution_creation_aspect_desc: "ศีรษะขนาดยักษ์เหล่านี้จ้องมองไปไกล กำลังครุ่นคิดถึงการวางแผน การจัดระเบียบ — ค้ำจุนชีวิตในภพนี้และภพหน้า พวกมันมีความคล้ายคลึงอย่างน่าทึ่งกับผู้ปกครองอันศักดิ์สิทธิ์ของเรา"

 great_project_type_mandala_capital_03_contribution_serenity_aspect: "รูปปั้นแห่งความสงบ"
 great_project_type_mandala_capital_03_contribution_serenity_aspect_desc: "ศีรษะขนาดยักษ์เหล่านี้มีความรู้สึกสงบสุขและเยือกเย็น ดูเหมือนจะบรรลุการตรัสรู้แล้ว พวกมันมีความคล้ายคลึงอย่างน่าทึ่งกับผู้ปกครองอันศักดิ์สิทธิ์ของเรา"

 great_project_type_mandala_capital_03_contribution_destruction_aspect: "รูปปั้นแห่งการทำลายล้าง"
 great_project_type_mandala_capital_03_contribution_destruction_aspect_desc: "ศีรษะขนาดยักษ์เหล่านี้มีใบหน้าบูดบึ้งน่าสะพรึงกลัว พร้อมที่จะวิ่งและพุ่งเข้าใส่ศัตรูที่กล้าบุกรุกเข้ามาในดินแดนศักดิ์สิทธิ์นี้ พวกมันมีความคล้ายคลึงอย่างน่าทึ่งกับผู้ปกครองอันศักดิ์สิทธิ์ของเรา"

 great_project_type_mandala_capital_03_contribution_trickery_aspect: "รูปปั้นแห่งอุบาย"
 great_project_type_mandala_capital_03_contribution_trickery_aspect_desc: "ศีรษะขนาดยักษ์เหล่านี้มีรอยยิ้มเจ้าเล่ห์และปลูกฝังความรู้สึกว่าพวกมันมองทะลุตัวท่าน — ทั้งในความหมายตามตัวอักษรและเชิงปรัชญา พวกมันมีความคล้ายคลึงอย่างน่าทึ่งกับผู้ปกครองอันศักดิ์สิทธิ์ของเรา"
 
 great_project_type_mandala_capital_03_contribution_gilded_domes: "โดมปิดทอง"
 great_project_type_mandala_capital_03_contribution_gilded_domes_desc: "เพื่อเปล่งประกายความงดงามอย่างแท้จริง โดมของ $building_mandala_capital_03$ ต้องถูกปิดด้วยทองคำเนื้อดีที่สุดเท่าที่จะหาได้"

 great_project_type_mandala_capital_03_contribution_family_temple_compound: "เขตอารามประจำตระกูล"
 great_project_type_mandala_capital_03_contribution_family_temple_compound_desc: "เขตศักดิ์สิทธิ์สำหรับการเคารพบูชาบุตรธิดาของผู้ปกครองอันศักดิ์สิทธิ์ผู้สร้างวัดอันยิ่งใหญ่เหล่านี้"

 great_project_type_mandala_capital_04: "$great_project_type_mandala_capital_02$"
 great_project_type_mandala_capital_04_desc: "$great_project_type_mandala_capital_02_desc$"
 great_project_type_mandala_capital_04_possessive: "$building_mandala_capital_04$'s"

 great_project_type_mandala_capital_04_contribution_rite_of_worthiness: "พิธีกรรมแห่งความคู่ควร"
 great_project_type_mandala_capital_04_contribution_rite_of_worthiness_desc: "เราจะพิสูจน์คุณค่าอันมิอาจปฏิเสธได้ของเราในการได้รับอนุญาตให้พัฒนา [GetBuilding('mandala_capital_01').GetTypeName] ของเราต่อไป สร้างเครื่องหมายของเราไว้บนโลกใบนี้!"

 great_project_type_mandala_capital_04_contribution_slabs_of_granite: "แผ่นหินแกรนิต"
 great_project_type_mandala_capital_04_contribution_slabs_of_granite_desc: "ภาพอมตะเพียงหนึ่งเดียวคือภาพที่สลักไว้ในงานหิน เราจะจัดหาหินที่ดีที่สุดเพื่อสร้างงานศิลปะสำหรับ $building_mandala_capital_04$ ซึ่งจะคงอยู่ชั่วนิรันดร์"

 great_project_type_mandala_capital_04_contribution_zaungdans: "ซาวง์ดาน"
 great_project_type_mandala_capital_04_contribution_zaungdans_desc: "บันไดศักดิ์สิทธิ์เป็นส่วนสำคัญในการเคลื่อนที่ขึ้นสูง และด้วยเหตุนี้จึงเข้าใกล้ความเป็นเทพมากขึ้น นอกจากนี้ยังเป็นจุดที่ยอดเยี่ยมสำหรับแผงตลาดและความจำเป็นอื่น ๆ"

 great_project_type_mandala_capital_04_contribution_gilded_shrines: "ศาลปิดทอง"
 great_project_type_mandala_capital_04_contribution_gilded_shrines_desc: "เราจะมีศาลที่มีเทวรูป และเทพ แต่ละองค์ที่สถิตอยู่ในเทวรูป แต่ละองค์จะแสดงความเมตตาต่อเราและช่วยเหลือผู้ปกครองอันศักดิ์สิทธิ์ของเรา"

 great_project_type_mandala_capital_04_contribution_work_force: "$great_project_type_mandala_capital_01_contribution_work_force$"
 great_project_type_mandala_capital_04_contribution_work_force_desc: "งานที่ยิ่งใหญ่ เช่นนี้ไม่เพียงต้องการกำลังกายและหยาดเหงื่อเท่านั้น แต่ยังต้องการสายตาที่เฉียบแหลม เครื่องมือที่ละเอียดอ่อน และจิตใจของช่างฝีมือ แรงงานที่เราจัดหาให้จะไม่เพียงแค่ขนย้ายวัสดุพื้นฐานไปมา แต่จะสร้างผลงานศิลปะอันซับซ้อนที่ [great_project|E] ต้องการอย่างยิ่งยวด"

 great_project_type_mandala_capital_04_contribution_bell_stupas: "สถูปทรงระฆัง"
 great_project_type_mandala_capital_04_contribution_bell_stupas_desc: "หินอ่อนที่ดีที่สุดจะถูกมอบให้แก่ $building_mandala_capital_05$ เพื่อที่มันจะได้ตั้งอยู่บนรากฐานที่สง่างามที่สุด"

 great_project_type_mandala_capital_04_contribution_bejeweled_domes: "โดมประดับอัญมณี"
 great_project_type_mandala_capital_04_contribution_bejeweled_domes_desc: "สวรรค์จะต้องส่องแสงมายัง $building_mandala_capital_04$ นี้ และเราจะจัดหาอัญมณีที่ [great_project|E] ต้องการ เพื่อให้มันดูราวกับว่าดวงดาวได้พักพิงอยู่ท่ามกลางเสาของหมู่อาคารอันศักดิ์สิทธิ์นี้"

 great_project_type_mandala_capital_04_contribution_family_temple_complex: "หมู่อารามประจำตระกูล"
 great_project_type_mandala_capital_04_contribution_family_temple_complex_desc: "ทายาทขององค์เทวราชาผู้ยิ่งใหญ่ของเราจะได้รับเกียรติด้วยหมู่อารามของตนเองภายในเมืองหลวง ที่นี่พวกเขาจะได้รับการเคารพบูชานานก่อนที่พวกเขาจะขึ้นครองอำนาจ"


 great_project_type_mandala_capital_05: "$great_project_type_mandala_capital_02$"
 great_project_type_mandala_capital_05_desc: "$great_project_type_mandala_capital_02_desc$"
 great_project_type_mandala_capital_05_possessive: "$building_mandala_capital_05$'s"

 great_project_type_mandala_capital_05_contribution_rite_of_worthiness: "พิธีกรรมแห่งความคู่ควร"
 great_project_type_mandala_capital_05_contribution_rite_of_worthiness_desc: "เราจะพิสูจน์คุณค่าอันมิอาจปฏิเสธได้ของเราในการได้รับอนุญาตให้พัฒนา [GetBuilding('mandala_capital_01').GetTypeName] ของเราต่อไป เปลี่ยนมันให้เป็นสิ่งที่เหนือธรรมชาติอย่างแท้จริง!"

 great_project_type_mandala_capital_05_contribution_marble_foundation: "ฐานหินอ่อน"
 great_project_type_mandala_capital_05_contribution_marble_foundation_desc: "หินอ่อนที่ดีที่สุดจะถูกมอบให้แก่ $building_mandala_capital_05$ เพื่อที่มันจะได้ตั้งอยู่บนรากฐานที่สง่างามที่สุด"

 great_project_type_mandala_capital_05_contribution_divine_barays: "บารายศักดิ์สิทธิ์"
 great_project_type_mandala_capital_05_contribution_divine_barays_desc: "โครงสร้างของเราจะมีสระน้ำที่ลึกที่สุด สระที่จะปกป้องเราจากศัตรู รวมถึงเชื่อมโยงเราเข้ากับภพภูมิวิญญาณ"

 great_project_type_mandala_capital_05_contribution_work_force: "$great_project_type_mandala_capital_01_contribution_work_force$"
 great_project_type_mandala_capital_05_contribution_work_force_desc: "เราจะจัดหาแรงงานทุกทักษะ ตั้งแต่ไพร่ที่ต่ำต้อยที่สุดไปจนถึงนักปราชญ์ที่ฉลาดที่สุด รวบรวมจากทุกมุมของอาณาจักร เพื่อช่วยในการก่อสร้าง $building_mandala_capital_05$"

 great_project_type_mandala_capital_05_contribution_bejeweled_reliefs: "ภาพนูนต่ำประดับอัญมณี"
 great_project_type_mandala_capital_05_contribution_bejeweled_reliefs_desc: "เหล่านางรำสวรรค์จะปกคลุมกำแพง เผยความสง่างามขณะย่างกราย พร้อมด้วยอาภรณ์ประดับอัญมณีอันน่าอัศจรรย์"

 great_project_type_mandala_capital_05_contribution_bunga_mas_forest: "ป่าบุหงามาศ"
 great_project_type_mandala_capital_05_contribution_bunga_mas_forest_desc: "การเคารพบูชาอนุสาวรีย์อันสูงส่งและชอบธรรม เช่นนี้ต้องการของขวัญที่ประณีตและลึกซึ้งยิ่งขึ้น เราจะจัดหาต้นไม้และดอกไม้ที่ทำจากทองคำ ซึ่งรังสรรค์อย่างวิจิตรโดยช่างฝีมือชั้นเลิศที่สุด ให้แก่ $building_mandala_capital_05$"

 great_project_type_mandala_capital_05_contribution_dynastic_temple_complex: "เขตอารามประจำราชวงศ์"
 great_project_type_mandala_capital_05_contribution_dynastic_temple_complex_desc: "ส่วนหนึ่งของหมู่อารามหลวงสำหรับองค์เทวราชาของเราจะอุทิศให้กับการเคารพบูชาสายเลือดและทายาทของเรา"

 great_project_error_plan_mandala_capital: "ขาดข้อกำหนดในการวางแผนการขยายเมืองหลวงมณฑล"

 only_single_great_project_type_allowed: "[great_project|E] ประเภทนี้ #bold ยังไม่ได้#! ถูกวางแผนหรือกำลังดำเนินการอยู่"
 you_are_owner_of_the_project: "ท่านคือเจ้าของ [great_project|E]"
 great_project_type_minister_project_culture: "หลอมรวมพื้นที่ให้เป็นจีน"
 minister_project_culture_name_chinese: "ทำให้พื้นที่เป็นจีน"
 minister_project_culture_name_default: "เปลี่ยนวัฒนธรรมพื้นที่"
 great_project_type_minister_project_culture_desc: "เราจะเป็นหนึ่งเดียวกันอย่างแท้จริงได้อย่างไรหากปราศจากค่านิยมร่วมกัน? ความแตกต่างอาจก่อให้เกิดความขัดแย้งและความไม่สงบ เราสามารถแก้ไขปัญหาเหล่านี้ได้ อย่างน้อยก็บางส่วน ด้วยความพยายามหลอมรวมในระยะยาว หนึ่งอาณาจักร หนึ่งปวงชน"
