 ACHIEVEMENT_DESC_inspirational_achievement:1 "[sponsor|E] [inspirations|E] ที่ประสบความสำเร็จ 30 ครั้งในเกมเดียว"
 ACHIEVEMENT_DESC_one_of_a_kind_achievement:1 "ได้รับ [artifact|E] ระดับมหากาพย์จากแรงบันดาลใจของนักผจญภัย"
 ACHIEVEMENT_DESC_true_tolerance_achievement:0 "ปกครอง [realm|E] ที่มีอย่างน้อย 10 [cultures|E] ซึ่งมี [cultural_acceptance|E] 95% ขึ้นไป"
 ACHIEVEMENT_DESC_delusions_of_grandeur_achievement:0 "มีระดับสูงกว่า [court_grandeur_expectations|E] ของท่านอย่างน้อย 6 ระดับ"
 ACHIEVEMENT_DESC_bod_chen_po_achievement:1 "ในฐานะสมาชิกของ [dynasty|E] พูเจล สร้างจักรวรรดิทิเบตขึ้นใหม่"
 ACHIEVEMENT_DESC_turkish_eagle_achievement:0 "เริ่มต้นในฐานะสมาชิกคนใดก็ได้ของ [house|E] เซลจุก ในปี 1066 ยกเว้น อัลป์ อาร์สลัน ก่อตั้ง Rum และสร้าง [hybrid_culture|E] ระหว่าง Oghuz และ Greek"

 ACHIEVEMENT_DESC_rise_of_the_ghurids_achievement:0 "เริ่มต้นในฐานะดยุกแห่ง กูร์ ในปี 867 หรือ 1066 พิชิต [region|E] ของ [GetGeographicalRegion('dlc_ep1_achievement_rise_of_the_ghurids').GetName]"
 ACHIEVEMENT_DESC_brave_and_bold_achievement:1 "เริ่มต้นในฐานะราชวงศ์ เปียสต์ ในปี 867 ปกครองโปแลนด์ ยอมรับระบบฟิวดัล และเป็นเจ้าของเครื่องราชกกุธภัณฑ์ มงกุฎ อาวุธ และเกราะ ระดับมีชื่อเสียงหรือเลื่องชื่อ"
 ACHIEVEMENT_DESC_lingua_franca_achievement:1 "ทำให้ [royal_courts|E] ทั้งหมดในโลกพูด [court_language|E] ของท่าน $rd_character_blocked_from_achievement$"
 ACHIEVEMENT_DESC_beta_israel_achievement:2 "ในฐานะกษัตริย์ชาวยิวในแอฟริกาตะวันออก สร้าง [culture|E] แตกแขนงของท่าน $rd_character_blocked_from_achievement$"
 ACHIEVEMENT_DESC_they_belong_in_a_museum_achievement:0 "แต่งตั้ง [character|E] ที่มี [inspiration|E] การผจญภัยที่เสร็จสมบูรณ์เป็น $antiquarian_court_position$ ของท่าน"
 ACHIEVEMENT_DESC_i_made_this_achievement:0 "ปล้นสะดม [artifact|E] ที่ท่านไม่มี [artifact_claim|E] และส่งต่อให้ [heir|E] ของท่าน"
 ACHIEVEMENT_DESC_nobody_comes_to_fika_achievement:1 "โดยมีเคาน์ตี Fika เป็น [primary_title|E] ของท่าน สร้าง [culture|E] แตกแขนงของท่านและเผยแพร่ไปยัง 30 [counties|E] ที่ท่านหรือ [vassals|E] ของท่านถือครอง"

 ACHIEVEMENT_DESC_the_true_royal_court_achievement:0 "ในฐานะ [vassal|E] ของ [emperor|E] มี [court_grandeur|E] สูงกว่าพวกเขา"


