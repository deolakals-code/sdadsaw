l_english: 
 # Murder save: food taster
 court_position.9001.t:0 "$murder_save_header$ $food_taster_court_position$"
 court_position.9001.desc:0 "ความพยายามลอบสังหาร [target.GetTitledFirstNamePossessive] ของข้าถูกขัดขวาง!\n\nสายลับของข้าล้มเหลวในการคำนึงถึงพนักงานชิมอาหารของ [target.GetTitledFirstNamePossessive] และยาพิษไม่เคยไปถึงจานของ [target.GetHerHis] เลยด้วยซ้ำ"
 court_position.9001.food_taster_dies:0 "\n\nอย่างน้อยพนักงานชิมอาหารก็ตาย เพราะยาพิษ [food_taster.GetTitledFirstName] จะไม่มาขวางทางข้าอีกต่อไป"

 court_position.9002.desc:0 "มีมือสังหารพยายามลอบสังหารข้า! โชคดีที่พนักงานชิมอาหารที่ข้าไว้วางใจ [food_taster.GetFirstName] กำลังทำหน้าที่ของ [food_taster.GetHerHis] และยาพิษไม่เคยไปถึงจานของข้าเลยด้วยซ้ำ"
 court_position.9002.food_taster_dies:0 "น่าเศร้าที่ [food_taster.GetFirstNameNoTooltip] ได้รับยาพิษมากเกินไปและไม่สามารถช่วยชีวิตไว้ได้"
 court_position.9002.owner_discovered:0 "\n\nไม่ต้องสงสัยเลยว่าทั้งหมดนี้เป็นการกระทำของ [owner.Custom2('MyCharacterIntroductionNoComma', ROOT.Char)]!"

 # Murder save: cupbearer
 court_position.9011.t:0 "$murder_save_header$ $cupbearer_court_position$"
 court_position.9011.desc:0 "ความพยายามลอบสังหาร [target.GetTitledFirstNamePossessive] ของข้าล้มเหลว!\n\nคนของข้ามิได้ตระเตรียมการรับมือพนักงานเชิญจอกสุราของ [target.GetHerHis] และ แม้ว่ายาพิษจะลงไปในเครื่องดื่มของ [target.GetTitledFirstNamePossessive] แล้ว มันก็ไปได้ไกลเพียงแค่ริมฝีปากของ [cupbearer.GetTitledFirstNamePossessive] เท่านั้น"
 court_position.9011.cupbearer_dies:0 "\n\nอย่างน้อยพนักงานเชิญจอกก็ตาย เพราะยาพิษ [cupbearer.GetSheHe|U] จะไม่มาขวางทางข้าอีกต่อไป"

 court_position.9012.desc:0 "มีมือสังหารพยายามลอบสังหารข้า! โชคดีที่พนักงานเชิญจอกของข้า [cupbearer.GetFirstName] ได้ถือวิสาสะช่วย [cupbearer.GetHerselfHimself] จิบ [ROOT.Char.Custom('RegionalDrink')] ของข้าก่อนที่จะเสิร์ฟให้ข้าในวันนี้"
 court_position.9012.cupbearer_dies:0 "น่าเศร้าที่ [cupbearer.GetFirstNameNoTooltip] ได้รับยาพิษมากเกินไปและไม่สามารถช่วยชีวิตไว้ได้ มีบทเรียนบางอย่างอยู่ที่นี่เกี่ยวกับการถือวิสาสะมากเกินไป..."

 # Murder save: bodyguard
 court_position.9021.t:0 "$murder_save_header$ $bodyguard_court_position$"
 court_position.9021.desc:0 "ความพยายามลอบสังหาร [target.GetTitledFirstNamePossessive] ของข้าล้มเหลว!\n\nองครักษ์ [bodyguard.Custom2('InsultAdjective', ROOT.Char)] ของ [target.GetHerHis|U] เอาชนะนักฆ่าที่ข้าส่งไปได้ และ [target.GetFirstNameNoTooltip] ก็มิได้รับแม้ แต่รอยขีดข่วน!"
 court_position.9021.bodyguard_dies:0 "\n\nอย่างน้อยองครักษ์ก็ตายจากอาการบาดเจ็บของ [bodyguard.GetHerHis] และจะไม่มาขวางทางข้าอีกต่อไป"

 court_position.9022.desc:0 "มีมือสังหารพยายามลอบสังหารข้า!\n\nขณะที่ข้ากำลังเดินผ่านโถงทางเดินที่ว่างเปล่าในตอนดึก มือสังหารก็กระโจนออกมาจากเงามืดทันที และข้าไม่อยากจะคิดเลยว่าจะเกิดอะไรขึ้นหากองครักษ์ที่ข้าไว้วางใจ [bodyguard.GetTitledFirstName] ไม่ได้ติดตามข้ามาด้วย"
 court_position.9022.bodyguard_dies:0 "\n\nน่าเศร้าที่ [bodyguard.GetSheHe] ได้รับบาดเจ็บสาหัสในการต่อสู้ที่ตามมาและไม่สามารถช่วยชีวิตไว้ได้"
