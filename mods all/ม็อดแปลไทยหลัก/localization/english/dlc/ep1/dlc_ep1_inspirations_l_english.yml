 weapon_inspiration:0 "แรงบันดาลใจด้านอาวุธ"
 weapon_inspiration_desc:1 "ตัวละครที่มีแรงบันดาลใจด้านอาวุธคือผู้ [inspired|E] ที่จะตี [artifact|E] ประเภทอาวุธ ซึ่งอาจ รวมถึงสิ่งใดก็ได้ตั้งแต่ดาบไปจนถึงหอก และจะพกพาไว้ในมือ"
 armor_inspiration:0 "แรงบันดาลใจด้านชุดเกราะ"
 armor_inspiration_desc:3 "ตัวละครที่มีแรงบันดาลใจด้านชุดเกราะคือผู้ [inspired|E] ที่จะตี [artifact|E] ประเภทชุดเกราะหรือโล่ ซึ่งอาจ รวมถึงสิ่งใดก็ได้ตั้งแต่เกราะโซ่ไปจนถึงเกราะแผ่น"
 book_inspiration:0 "แรงบันดาลใจด้านหนังสือ"
 book_inspiration_desc:1 "ตัวละครที่มีแรงบันดาลใจด้านหนังสือคือผู้ [inspired|E] ที่จะเขียนและผลิต [artifact|E] ประเภทหนังสือ หัวข้อที่ครอบคลุมอาจแตกต่างกันอย่างมาก – เช่นเดียวกับคุณภาพ – แต่จะ ส่งผลให้เกิดหนังสือที่คู่ควรกับราชวงศ์"
 weaver_inspiration:0 "แรงบันดาลใจด้านการทอผ้า"
 weaver_inspiration_desc:1 "ตัวละครที่มีแรงบันดาลใจด้านการทอผ้าคือผู้ [inspired|E] ที่จะทอ [artifact|E] ประเภทพรมผนัง ภาพและฉากที่ปรากฎอาจแตกต่างกันอย่างมาก – เช่นเดียวกับคุณภาพ – แต่จะ ส่งผลให้เกิดพรมผนังที่เหมาะสำหรับประดับผนังใน [royal_court|E] ของท่าน"
 adventure_inspiration:0 "แรงบันดาลใจด้านการผจญภัย"
 adventure_inspiration_desc:0 "ตัวละครที่มีแรงบันดาลใจด้านการผจญภัยคือผู้ [inspired|E] ที่จะออกผจญภัยครั้งใหญ่และนำ [artifact|E] กลับมาให้ท่าน สิ่งประดิษฐ์ล้ำค่าที่ได้จากแรงบันดาลใจนี้อาจแตกต่างกันอย่างมาก และอาจเป็นอะไรก็ได้ตั้งแต่กะโหลกของสัตว์ร้ายทรงพลังไปจนถึงมรดกตกทอดที่ถูกขโมยมา"
 artisan_inspiration:0 "แรงบันดาลใจด้านช่างฝีมือ"
 artisan_inspiration_desc:1 "ตัวละครที่มีแรงบันดาลใจด้านช่างฝีมือคือผู้ [inspired|E] ที่จะใช้ความรู้ความเชี่ยวชาญเฉพาะทางของตนในการผลิต [artifact|E] ที่มีฝีมือประณีต ช่างไม้และช่างตัดเสื้อเป็นตัวอย่างของความเชี่ยวชาญของช่างฝีมือ"
 smith_inspiration:0 "แรงบันดาลใจด้านช่างโลหะ"
 smith_inspiration_desc:0 "ตัวละครที่มีแรงบันดาลใจด้านช่างโลหะคือผู้ [inspired|E] ที่จะตีสิ่งที่หรูหราและเล็กกว่าดาบหรือชุดเกราะ เหล่านี้คือศิลปินที่สร้างมงกุฎและถ้วย ซึ่งส่องประกายและประดับด้วยอัญมณี"
 alchemy_inspiration:0 "แรงบันดาลใจด้านการเล่นแร่แปรธาตุ"
 alchemy_inspiration_desc:0 "ตัวละครที่มีแรงบันดาลใจด้านการเล่นแร่แปรธาตุคือผู้ [inspired|E] ที่จะสำรวจ, ทำให้บริสุทธิ์, และสร้างสารและโลหะ, สร้างยาอายุวัฒนะ, และท้ายที่สุดคือ ทำให้ร่างกายและจิตวิญญาณของมนุษย์สมบูรณ์แบบ"
 research_inspiration: "แรงบันดาลใจด้านการวิจัย"
 research_inspiration_desc: "ตัวละครที่มีแรงบันดาลใจด้านการวิจัยคือผู้ [inspired|E] ที่จะค้นพบความรู้ใหม่เพื่อประโยชน์ของ [sponsor|E] ของพวกเขา หากประสบความสำเร็จ พวกเขาจะปรับปรุงการเรียนรู้ภายใน [dynasty|E] ของผู้อุปถัมภ์ หรือแม้กระทั่งค้นพบ [innovation|E] ใหม่สำหรับวัฒนธรรมของพวกเขา"
 bow_inspiration: "แรงบันดาลใจคันธนู"
 bow_inspiration_desc: "ตัวละครที่มีแรงบันดาลใจคันธนูจะ [inspired|E] ให้ขึ้นสาย [artifact|E] คันธนู ซึ่งอาจ รวมถึงอะไรก็ได้ตั้งแต่คันธนูประกอบไปจนถึงหน้าไม้ และมันจะถูกถือไว้ในมือ"

