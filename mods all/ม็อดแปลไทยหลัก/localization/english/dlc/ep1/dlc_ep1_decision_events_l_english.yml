l_english: 
 ep1_decision.0101.t:0 "ขับไล่พวกเก่าแก่"
 ep1_decision.0101.desc:0 "พวกอู้! พวกขี้เกียจ! พวกไม่ทำอะไรเลย!\n\nราชสำนักของข้า #EMP เต็มไปด้วย#! พวกปรสิตดุจเพลี้ยในสวน ถูกจัดให้อยู่ในทุกห้องที่มี ว่างเว้นจากการกรนทั้งวันทั้งคืน และทิ้งหม้อถ่ายเรี่ยราดไปทั่วโถงอันคับแคบ\n\nไม่อาจทนได้อีกต่อไป เราเพียงแค่ #EMP ไม่มีที่ว่าง#! ให้กับคนแปลกหน้าพเนจรเหล่านี้ทั้งหมด"
 ep1_decision.0101.a:0 "[capital.GetNameNoTierNoTooltip] ไม่ใช่โรงเตี๊ยม จงไปเสีย พวกปลิง!"
 ep1_decision.0101.b:0 "ทุกคนที่ไร้งานหรือไร้สายเลือดข้า #EMP ออกไป#!!"
 ep1_decision.0101.c:0 "ข้าว่าเราน่าจะเอาเตียงไปไว้ในคอกม้าได้กระมัง..."

 ep1_decision.0111.t:0 "การตก แต่งอันโอ่อ่า"
 ep1_decision.0111.desc:0 "มีผู้เหมาะสมหลายรายที่จะเป็นแบบอย่างในการตก แต่งใหม่ ปรากฏตัวขึ้น ณ ที่ใกล้ตัวและน่าสังเกตที่สุดสำหรับข้า: ดินแดนของ [option_1.GetTitledFirstName], [option_2.GetTitledFirstName] และ [option_3.GetTitledFirstName]\n\nการเลือกรูปแบบที่ถือว่ามีชื่อเสียงมากกว่าราชสำนักของข้าจะเป็นการถ่อมตนส่วนตัว แต่จะ ทำให้ข้ายืมบรรยากาศความยิ่งใหญ่ของดินแดนต่างแดนมาได้บ้าง\n\nในทางกลับกัน การเลียนแบบดินแดนที่ด้อยกว่าจะแสดงถึงความใจกว้างและสร้างตำนานของข้าในต่างแดน โดยต้องแลกกับชื่อเสียงบางส่วนในบ้านเกิด"
 ep1_decision.0111.toast.t:0 "[ROOT.Char.GetTitledFirstName] ได้เลียนแบบโถงหนึ่งของข้า"
 ep1_decision.0111.a.greater_cgv:0 "ราชสำนัก [option_1.GetPrimaryTitle.GetAdjectiveNoTooltip|U] นั้นช่างโอ่อ่าเสียจริง"
 ep1_decision.0111.a.lesser_cgv:0 "ผู้คนของ [option_1.GetPrimaryTitle.GetNamePossessiveNoTooltip|U] #EMP น่าจะ#! ต้องการความเมตตาจากข้า"
 ep1_decision.0111.b.greater_cgv:0 "ข้าพบว่าสถาปัตยกรรม [option_2.GetPrimaryTitle.GetAdjectiveNoTooltip] นั้นน่าหลงใหลยิ่งนัก!"
 ep1_decision.0111.b.lesser_cgv:0 "สถาปัตยกรรม [option_2.GetPrimaryTitle.GetAdjectiveNoTooltip] นั้นหยาบ แต่ก็สร้างแรงบันดาลใจ!"
 ep1_decision.0111.c.greater_cgv:0 "บางทีอาจเป็นโถงเลี้ยงในแบบ [option_3.GetPrimaryTitle.GetAdjectiveNoTooltip]?"
 ep1_decision.0111.c.lesser_cgv:0 "บางทีโถงเลี้ยงแบบ [option_3.GetPrimaryTitle.GetAdjectiveNoTooltip] หยาบๆ อาจเป็นของแปลกใหม่?"
 ep1_decision.0111.d:0 "ทั้งหมดนี้ดู #EMP น่าตกใจ#! ที่เป็นต่างชาติเหลือเกิน..."
 ep1_decision.0111.d.tt:0 "[gold|E] ของท่านจะได้รับคืน"
 
 promote_other_culture_development_decision_name:0 "เฉลิมฉลองวัฒนธรรมอื่น"
 promote_other_culture_development_decision_desc:0 "ให้เราตอบแทนผู้ที่รับใช้เราอย่างภักดี เพื่อที่พวกเขาจะได้เติบโตและพัฒนาไปพร้อมกับราชวงศ์ที่พวกเขาได้รับใช้อย่างซื่อสัตย์!"
 promote_other_culture_development_decision_tooltip:0 "ปรับปรุงการพัฒนาของ [counties|E] จาก [cultures|E] ที่แตกต่างกัน ซึ่งมี [cultural_acceptance|E] สูง"
 promote_other_culture_development_decision_not_acceptance_tt:0 "ไม่มี [culture|E] ใดที่มี [cultural_acceptance|E] สูงกว่า #V 75%#! ใน [realm|E] ของท่าน"
 promote_other_culture_development_decision_confirm:0 "แจกจ่ายเหรียญ"
 promote_other_culture_development_decision_effect_summary:0 "ทุก [county|E] ที่เป็น [current_culture.GetName] ใน [realm|E] จะได้รับ [GetModifier('promote_culture_modifier' ).GetNameWithTooltip|L] เป็นเวลา 10 ปี"
 promote_other_culture_development_decision_no_effect:0 "ทุก [county|E] ใน [realm|E] จาก [culture|E] ที่มี [cultural_acceptance|E] สูงกว่า #V 75%#! จะได้รับ [GetModifier('promote_culture_modifier' ).GetNameWithTooltip|L] เป็นเวลา 10 ปี"
 promote_culture_leader_modifier:0 "การเฉลิมฉลองความหลากหลายทางวัฒนธรรม"

 ep1_decision.0201.t:0 "นักภาษาศาสตร์ในราชสำนัก"
 ep1_decision.0201.desc:1 "ในที่สุดการค้นหานักภาษาศาสตร์ [target_court_language.GetCourtLanguage.GetName] ก็บังเกิดผล ผู้สมัครได้ถูกนำเสนอต่อหน้าข้า แต่ละคนมีความเชี่ยวชาญในภาษาต่างประเทศเป็นของตนเอง"
 ep1_decision.0201.tt.aptitude:0 "[aptitude|E] ของ [selected_linguist.GetUINamePossessive] คือ [selected_linguist.GetCourtPositionAptitude( GetCourtPositionType( 'court_tutor_court_position' ) )]"
 ep1_decision.0201.a:2 "[good_linguist.GetNameNoTooltip] เป็นนักภาษาศาสตร์ [target_court_language.GetCourtLanguage.GetNameNoTooltip] ที่มีชื่อเสียง"
 ep1_decision.0201.b:0 "[medium_linguist.GetNameNoTooltip] คงจะทำงานได้"
 ep1_decision.0201.c:1 "[scholarly_linguist.GetNameNoTooltip] เป็นผู้เชี่ยวชาญ [target_court_language.GetCourtLanguage.GetNameNoTooltip] ที่มีชื่อเสียงโด่งดัง!"
 ep1_decision.0201.d:0 "ข้ารู้ว่า [cheap_linguist.GetNameNoTooltip] แทบจะทำงานให้ฟรี!"
 ep1_decision.0201.e:0 "คิดดูอีกที..."
 learn_court_language_toast_title:1 "จ้างครูสอน [target_court_language.GetCourtLanguage.GetName] แล้ว"
 ep1_decision.0111.desc.1: "The only likely redecorating candidate present, the nearest and most noteworthy to me: the realm of [option_1.GetTitledFirstName]."
 ep1_decision.0111.desc.2: "Two likely redecorating candidates present themselves, those nearest and most noteworthy to me: the realms of [option_1.GetTitledFirstName] and [option_2.GetTitledFirstName]."
 ep1_decision.0111.desc.3: "Several likely redecorating candidates present themselves, those nearest and most noteworthy to me: the realms of [option_1.GetTitledFirstName], [option_2.GetTitledFirstName], and [option_3.GetTitledFirstName]."
 ep1_decision.0111.desc.outro: "\n\nSelecting a style that's considered more renowned than my own court would be personally humbling but lend me some of the foreign realm's air of grandeur.\n\nConversely, emulating a lesser realm would show magnanimity and build my legend abroad at the cost of some reputation at home."
 ep1_decision.0111.d.single: "It seems quite #EMP alarmingly#! foreign..."
