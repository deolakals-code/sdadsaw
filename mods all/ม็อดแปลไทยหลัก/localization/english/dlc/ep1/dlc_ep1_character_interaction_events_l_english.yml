l_english: 
 
 # Indebt Guest Loc
 ep1_character_interaction.0001.t:0 "การชดใช้ที่สมเหตุสมผล"
 ep1_character_interaction.0001.desc.intro:0 "[recipient.GetFirstName] ดู #EMP หวาดกลัว#! อย่างเห็นได้ชัด ขณะที่คนรับใช้ถูกนำตัวออกมาทีละคนเพื่อกล่าวหา [recipient.GetHerHim] แต่ละคนยืนยันว่า [recipient.GetSheHe]"
 ep1_character_interaction.0001.desc.lustful:0 "ได้ ทำให้เครื่องนอนราคาแพงส่วนใหญ่ของราชสำนักแปดเปื้อนอย่างไม่อาจแก้ไขได้"
 ep1_character_interaction.0001.desc.chaste:0 "เคลื่อนย้ายหรือบดบังงานศิลปะใดๆ ที่ [recipient.GetSheHe] เห็นว่าไม่เหมาะสมอยู่เสมอ ทำให้พวกเขาต้องเสียเวลาหลายชั่วโมงต่อวันในการจัดของให้เข้าที่ และ"
 ep1_character_interaction.0001.desc.gluttonous:0 "ได้กินมากกว่าคนอื่นๆ ในราชสำนักรวมกันเสียอีกโดย [recipient.GetHerselfHimself]"
 ep1_character_interaction.0001.desc.temperate:0 "ได้ขับไล่พ่อครัวที่ดีที่สุดของเราไปสามคนด้วยการเมินหน้าหนีอาหารเย็นมื้อแล้วมื้อเล่าของ [recipient.GetHerHis],"
 ep1_character_interaction.0001.desc.greedy:0 "ถูกพบเห็นกำลังเฉือนโลหะมีค่าออกจากเครื่องประดับที่แพงที่สุดของเรา"
 ep1_character_interaction.0001.desc.generous:0 "ได้มอบทรัพย์สินของราชสำนักซ้ำแล้วซ้ำเล่าราวกับเป็นของ [recipient.GetHerHis] เอง"
 ep1_character_interaction.0001.desc.lazy:0 "ใช้เวลาของพวกเขาไปกับงานเล็กๆ น้อยๆ มากกว่าที่คนอื่นๆ ในราชสำนักใช้กับงานสำคัญเสียอีก"
 ep1_character_interaction.0001.desc.diligent:0 "ได้บังคับให้พวกเขาทำงานซ้ำจนสมบูรณ์แบบโดยไม่คำนึงถึงปริมาณงาน"
 ep1_character_interaction.0001.desc.wrathful:0 "ได้โยนที่นั่งสำหรับคนเดียวส่วนใหญ่ออกจากระเบียงของ [recipient.GetHerHis]"
 ep1_character_interaction.0001.desc.calm:0 "ได้ ทำให้มื้อเย็นล่าช้าสัปดาห์แล้วสัปดาห์เล่าด้วยการครุ่นคิดใคร่ครวญอย่างสงบว่า[recipient.GetSheHe]ชอบอาหารจานไหนมากกว่า"
 ep1_character_interaction.0001.desc.patient:0 "มอบหมายงานที่ต้องใช้เวลาหลายสัปดาห์หรือหลายเดือนในการ ทำให้เสร็จอยู่เสมอ"
 ep1_character_interaction.0001.desc.impatient:0 "มอบหมายงานให้พวกเขาวันละหลายร้อยอย่าง แทบจะไม่รอให้เริ่มงานหนึ่งก่อนที่จะเพิ่มงานถัดไป และ"
 ep1_character_interaction.0001.desc.arrogant:0 "ปฏิเสธที่จะให้คนรับใช้ทั่วไปทำงานให้ [recipient.GetHerHim] ยืนกรานที่จะใช้เวลาของเจ้าหน้าที่ชั้นนำ และ"
 ep1_character_interaction.0001.desc.humble:0 "แสร้งทำเป็นถ่อมตนเท่านั้น และแท้จริงแล้วใช้เวลาของ [recipient.GetHerHis] ไปกับการชี้นำเจ้าหน้าที่อย่างหยิ่งยโส ความโกลาหลคือ"
 ep1_character_interaction.0001.desc.deceitful:0 "ดูเหมือนจะสนุกกับการเผยแพร่ข้อมูลเท็จโดยไม่มีเหตุผลชัดเจน ก่อความโกลาหลไปทั่วราชสำนัก และ"
 ep1_character_interaction.0001.desc.honest:0 "ทำให้พวกเขาอับอายเป็นประจำทุกวันด้วยความคิดเห็นที่ตรงไปตรงมาเกี่ยวกับรูปลักษณ์ ทัศนคติ และจรรยาบรรณในการทำงานของพวกเขา เฉพาะเจ้าหน้าที่ที่สูญเสียไปก็คือ"
 ep1_character_interaction.0001.desc.craven:0 "บังคับให้พวกเขาขัดถูอาหารทุกอย่างที่ [recipient.GetSheHe] กินด้วยสบู่ เพราะกลัวยาพิษ"
 ep1_character_interaction.0001.desc.brave:0 "ไม่เคยปฏิเสธโอกาสเพียงเล็กน้อยที่จะต่อสู้ ทำให้เกิดการทำความสะอาดส่วนใหญ่โดย [recipient.GetHerselfHimself] และ"
 ep1_character_interaction.0001.desc.shy:0 "ตื่นตระหนกตลอดเวลาเมื่อคนรับใช้เข้ามาในที่ประทับของ [recipient.GetHerHis] โดยไม่คาดคิด ทำให้เกิดความล่าช้าทุกที่ที่ [recipient.GetSheHe] ไป และ"
 ep1_character_interaction.0001.desc.gregarious:0 "จัดงานเลี้ยงส่วนตัวอย่างหรูหราจากห้องเก็บเสบียงของราชสำนักอยู่เสมอ"
 ep1_character_interaction.0001.desc.ambitious:0 "บังคับให้พวกเขายืนอยู่ในฝูงชนเป็นเวลาหลายชั่วโมงและปรบมือให้กับสุนทรพจน์ของ [recipient.GetHerHis] อยู่เสมอ"
 ep1_character_interaction.0001.desc.content:0 "สนับสนุนให้พวกเขาทำงานค้างไว้ครึ่งๆ กลางๆ หรือไม่ทำเลยอยู่เสมอ ซึ่งจริงๆ แล้ว ทำให้มีงานมากขึ้นในภายหลัง และ"
 ep1_character_interaction.0001.desc.arbitrary:0 "ขอให้พวกเขาทำผิดกฎหมายเล็กๆ น้อยๆ ในนามของ [recipient.GetHerHis] เป็นประจำ ส่งผลให้ต้องเสียค่าปรับ"
 ep1_character_interaction.0001.desc.just:0 "ได้รายงานความไม่เหมาะสมเล็กๆ น้อยๆ จำนวนมากในหมู่เจ้าหน้าที่ จนพวกเขาใช้เวลาโต้เถียงกันเรื่องความผิดที่รับรู้มากกว่าทำงาน"
 ep1_character_interaction.0001.desc.cynical:0 "ได้ทำบางอย่างที่ไม่สามารถเอ่ยถึงได้กับประตู [actor.GetFaith.HouseOfWorship] ส่วนตัวของราชสำนัก"
 ep1_character_interaction.0001.desc.zealous:0 "ใช้เวลาหลายชั่วโมงใน แต่ละวันไปกับการเทศนาและความคลั่งไคล้ศาสนาของ [recipient.GetHerHis]"
 ep1_character_interaction.0001.desc.paranoid:0 "ยืนกรานที่จะดูแลทุกงานของพวกเขาเป็นการส่วนตัว เพราะกลัวการหลอกลวง"
 ep1_character_interaction.0001.desc.trusting:0 "นำคนหลอกลวงและมิจฉาชีพเข้ามาในโถงอย่างต่อเนื่องเพื่อหลอกลวงและปล้นสะดม"
 ep1_character_interaction.0001.desc.compassionate:0 "ได้มอบห้องเก็บเสบียงเกือบทั้งหมดให้กับขอทานไร้บ้าน"
 ep1_character_interaction.0001.desc.callous:0 "ได้ทารุณกรรมเจ้าหน้าที่โดยไม่สำนึกผิด ทำให้หลายคนต้องจากไป และ"
 ep1_character_interaction.0001.desc.sadistic:0 "ได้ทำร้ายแพะรางวัลด้วยมีดปังตอ"
 ep1_character_interaction.0001.desc.stubborn:0 "ได้ยั่วยุให้เกิดการโต้เถียงกับข้ารับใช้ของขุนนางที่มาเยือน ความเสียหายคือ"
 ep1_character_interaction.0001.desc.fickle:0 "ใช้คนจำนวนมากไปกับคำขอที่เปลี่ยนแปลงตลอดเวลา"
 ep1_character_interaction.0001.desc.vengeful:0 "ทำลายเครื่องใช้บนโต๊ะอาหารราคาแพงอย่างสม่ำเสมอด้วยความอาฆาตแค้นเล็กน้อย"
 ep1_character_interaction.0001.desc.forgiving:0 "แสร้งทำเป็นให้อภัยเท่านั้น และแทนที่จะเป็น เช่นนั้น $ep1_character_interaction.0001.desc.vengeful$"
 ep1_character_interaction.0001.desc.fallback_1:0 "พยายามเลี้ยงฝูงไก่ในห้องของ [recipient.GetHerHis] ทำให้เกิดความเสียหาย"
 ep1_character_interaction.0001.desc.fallback_2:0 "ทำลายห้องสุขาส่วนตัวของข้าพเจ้าอย่างสิ้นเชิง ทำให้เกิดความเสียหาย"
 ep1_character_interaction.0001.desc.fallback_3:0 "แลกม้าพ่อพันธุ์รางวัลตัวหนึ่งของข้าพเจ้ากับแพะ "วิเศษ""
 ep1_character_interaction.0001.desc.fallback_4:0 "เป็นผู้รับผิดชอบ แต่เพียงผู้เดียวต่อเหตุเพลิงไหม้ที่เผาปีกตะวันตก"
 ep1_character_interaction.0001.desc.fallback_5:0 "ทำให้บัลลังก์ของข้าพเจ้าเสื่อมเสียด้วยภาพวาดกราฟฟิตีที่แสดงถึงทรัพย์สินของ [recipient.GetHerHis]"
 ep1_character_interaction.0001.desc.outro:0 "(ถูกกล่าวหาว่า) ทำให้ข้าต้องเสียทรัพย์สินส่วนตัวไปจำนวนไม่น้อย\n\n[recipient.GetWomanMan] แทบจะเริ่มพูดตะกุกตะกักเกี่ยวกับความบริสุทธิ์ของ[recipient.GetHerHis]และแผนการสมคบคิดเมื่อข้ายกมือขึ้น\n\n"เห็นได้ชัดว่าเจ้าได้ล่วงละเมิดแล้ว [recipient.GetFirstNameNoTooltip] ข้า #EMP อาจจะ#! มองข้ามการกระทำผิดของเจ้า หากเจ้ายินดีที่จะให้คำสัญญา #EMP เล็กน้อย#! กับข้า..."
 ep1_character_interaction.0001.a:0 "*หัวเราะเสียงดัง* ใช่แล้ว [actor_nemesis.GetFirstNameNoTooltip] จะไม่มีวันรู้ทันเรื่องนี้!"
 ep1_character_interaction.0001.b:0 "ยอดเยี่ยม! บัดนี้ เจ้าจงไปส่งตัวที่ราชสำนักของ [actor_rival.GetFirstNamePossessiveNoTooltip]..."
 ep1_character_interaction.0001.c:0 "จงไปให้พ้นจนกว่าข้าจะต้องการเจ้า!"
 ep1_character_interaction.0001.d:0 "โดยธรรมชาติแล้ว เจ้าจะอยู่ที่นี่ ที่ ซึ่งข้าสามารถจับตาดูเจ้าได้"
