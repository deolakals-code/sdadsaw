 # Events
 steal_herd_event_title: "ขโมยฝูงสัตว์:"
 steal_herd_outcome.1001.t: "$steal_herd_event_title$ สำเร็จ!"
 steal_herd_outcome.1001.desc: "[courtier.GetName] [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('courtier'))] ของข้า ขี่ม้าเข้ามาในค่ายอย่างภาคภูมิใจ คนเลี้ยงแกะที่ไม่คุ้นเคยคนหนึ่งจูงปศุสัตว์ตาม [courtier.GetHerHim] มาทางข้า\n\n"จากค่ายของ [target.GetTitledFirstName]!" [courtier.GetSheHe|U] อุทาน ขณะที่ข้าสั่งการให้คนเลี้ยงแกะดูแลสัตว์ใหม่ของข้า ข้าก็อดที่จะยิ้มอย่างเจ้าเล่ห์ไม่ได้ ฝูงสัตว์ของข้าแข็งแกร่งขึ้นเรื่อยๆ และด้วยต้นทุนเพียงเล็กน้อย"
 steal_herd_outcome.1001.a: "ข้าขอบคุณสำหรับ 'ความเอื้ออาทร' ของเจ้า [target.GetFirstNameNoTooltip]!"

 steal_herd_outcome.1003.desc: "[courtier.GetSheHe|U] ลงลึกในรายละเอียดการโจรกรรมของเรา รวมถึงความเชี่ยวชาญของเราในการเอาชนะการป้องกันของ [target.GetFirstNamePossessiveNoTooltip] เพราะเราแทรกซึมเข้าค่ายของ [target.GetFirstNamePossessiveNoTooltip] ได้อย่างง่ายดาย ข้าจึงสงสัยว่าข้าจะสามารถเอาสิ่งใดจากเงื้อมมือของ [target.GetHerHis] ได้อีก..."
 steal_herd_outcome.1003.a: "[courtier.GetFirstNameNoTooltip] เจ้าช่วยอธิบายอีกครั้งได้หรือไม่?"
 steal_herd_outcome.1003.a_desc: "ท่านพยายามขโมย [herd|E] ของ [target.GetFirstNamePossessiveNoTooltip] เพิ่มเติม"
 steal_herd_outcome.1003.win: "การโจรกรรมของท่านดำเนินต่อไป"
 steal_herd_outcome.1003.lose: "ท่านไม่สามารถเอาไปได้มากกว่านี้"
 steal_herd_outcome.1003.b: "ข้าอยากจะค้นคลังสมบัติของ [target.GetHerHis]"
 steal_herd_outcome.1003.b_desc: "ท่านพยายามขโมยทองคำจาก [target.GetFirstNameNoTooltip]"
 steal_herd_outcome.1003.c: "[target.GetPrimarySpouse.GetFirstName] ก็เป็นของ [target.GetFirstNameNoTooltip] เช่นกัน สำหรับตอนนี้"
 steal_herd_outcome.1003.c_tt: "ข้าเริ่ม [scheme|E] [GetScheme('seduce').GetTypeName] กับ [target.GetPrimarySpouse.GetFirstName] ด้วย #V โอกาสสำเร็จ#! ที่ #p เพิ่มขึ้น#!"
 mpo_steal_herd_seduce_modifier: "สัมผัสแห่งผู้เลี้ยงสัตว์"
 mpo_steal_herd_murder_modifier: "สายลับในทุ่งหญ้า"
 steal_herd_outcome.1003.d: "บางทีอาจจะเป็นชีวิตของ [target.GetHerHis|U]?"
 steal_herd_outcome.1003.d_tt: "ข้าเริ่ม [scheme|E] [GetScheme('murder').GetTypeName] กับ [target.GetFirstName] ด้วย #V โอกาสสำเร็จ#! ที่ #p เพิ่มขึ้น#!"
 steal_herd_outcome.1003.e: "ข้าเอาไปมากพอแล้วสำหรับตอนนี้"

 steal_herd_outcome.1002.t: "$steal_herd_event_title$ ฝูงสัตว์ถูกขโมย!"
 steal_herd_outcome.1002.desc: "[spymaster.GetName] มาหาข้าพร้อมข่าวร้าย "[ROOT.Char.GetFirstName] สัตว์บางส่วนที่เราเลี้ยงไว้ในลานคอกได้หายไปโดยไม่ทราบสาเหตุ"\n\n[spymaster.GetSheHe|U] กระแอมในลำคอ [spymaster.GetHerHis] แล้วกล่าวต่อ "หลังจากการสืบสวนอย่างถี่ถ้วน ดูเหมือนว่า [owner.GetName] ได้ส่งคนรับใช้บางคนมา 'รับ' ฝูงสัตว์คืนไป และได้กล่อมคนเลี้ยงสัตว์ว่าเป็นการกระทำตามคำสั่งของท่าน""
 steal_herd_outcome.1002.desc_monies: "\n\nหลังจากได้ยินการเปิดเผยนี้ ข้าสังเกตเห็นหีบใบหนึ่ง ซึ่งครั้งหนึ่งเคยเต็มไปด้วยเครื่องประดับล้ำค่า บัดนี้กลับลดน้อยลง เมื่อรู้ว่าผู้กระทำผิดคือคนเดียวกัน ข้าก็ถอนหายใจ"
 steal_herd_outcome.1002.a: "ขอให้เจ้าจงมีชีวิตชั่วนิรันดร์ใน [ROOT.Char.GetFaith.NegativeAfterLife] เถิด [owner.GetFirstNameNoTooltip]!"

 steal_herd_outcome.2001.t: "$steal_herd_event_title$ ล้มเหลว"
 steal_herd_outcome.2001.desc: "แผนการขโมยฝูงสัตว์จาก [target.GetTitledFirstName] ของข้าได้ดำเนินการตามแผนแล้ว แต่ [courtier.GetTitledFirstName] [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('courtier'))] ของข้ากลับมามือเปล่า ไม่ได้แม้ แต่ปอยขนแกะมาแสดงชัยชนะ\n\n"[owner.GetFirstNameNoTooltip] ข้าขออภัย [target.GetFirstNameNoTooltip] รู้ทันเราเสียแล้ว" [courtier.GetFirstNameNoTooltip] ถอนหายใจ "โชคดีที่เราหนีออกมาก่อนที่พลม้าของ [target.GetHerHis] จะตามทัน""
 steal_herd_outcome.2001.a: "[target.GetFirstNameNoTooltip] ต้องได้รับการคุ้มครองจากสวรรค์แน่ๆ..."

 steal_herd_outcome.2002.desc: "[courtier.GetName] นำข้าออกไปข้างนอก และข้าก็ต้องตกใจเมื่อพบว่าฝูงสัตว์หายไป!\n\n[courtier.GetFirstNameNoTooltip] อธิบายว่าเราล้มเหลวในการขโมยฝูงสัตว์จาก [target.GetTitledFirstName] แต่แทนที่จะปล่อยให้พลม้าของเราหนีไป [target.GetSheHe] กลับแก้แค้นทันที และส่งกองกำลังตาม [courtier.GetFirstNameNoTooltip] และคนอื่นๆ ที่เกี่ยวข้องมายังทุ่งหญ้าของข้า พลม้าของ [target.GetHerHis|U] เอาแกะและปศุสัตว์อื่นๆ ไป แล้วก็จากไปอย่างรวดเร็ว"
 steal_herd_outcome.2002.a: "เราช่างไร้ความสามารถ เช่นนี้ได้อย่างไร?!"

 steal_herd_outcome.2003.t: "ฝูงสัตว์ของ [owner.GetTitledFirstName]"
 steal_herd_outcome.2003.desc: "เกิดความโกลาหลขึ้น และ [courtier.GetName] ก็เข้ามาพร้อมกับมัน [courtier.GetSheHe|U] ยิ้มพลางทำท่าให้ข้าก้าวออกไปที่ลานค่าย\n\nข้างนอก [courtier.GetSheHe] ชี้ไปยังฝูงแกะและม้า ซึ่งถูกนำทางโดยพลม้าคนหนึ่งของข้า [courtier.GetFirstNameNoTooltip] มองมาที่ข้าอย่างตั้งใจ "ช่างกล้าเสียจริง เจ้า [owner.GetFirstNameNoTooltip] นั่น!" [courtier.GetSheHe] กล่าว "[owner.GetSheHe|U] พยายามจะบ่อนทำลาย #italic ท่าน#! และเอาฝูงสัตว์ของท่านไป! โชคดีที่ [courtier.GetFaith.HighGodName] มีแผนอื่น สัตว์ชั้นดีเหล่านี้เป็นของ [owner.GetFirstNameNoTooltip] [owner.GetHerHim]self""
 steal_herd_outcome.2003.a: "ความล้มเหลวของเจ้าเป็นประโยชน์ต่อข้าในวันนี้ [owner.GetFirstNameNoTooltip]!"
 
 steal_herd_ongoing.1001.t: "$steal_herd_event_title$ ทหารยาม"
 steal_herd_ongoing.1001.desc: "เพื่อที่จะขโมยฝูงสัตว์ของ [target.GetTitledFirstNamePossessive] ข้าต้องรู้จักดินแดนและผู้คนของ [target.GetHerHis] ดังนั้นข้าจึงออกไปสังเกตการณ์ว่าทุ่งหญ้าใดอยู่ใกล้บ้านของ [target.GetHerHis] และทุ่งหญ้าใดอยู่ไกลและเปลี่ยวร้าง\n\nขณะสังเกตการณ์บนที่สูงใกล้ [target.GetCapitalLocation.GetTitle.GetName] เหล่านักรบที่นำโดย [target_knight.GetWomanMan] บนหลังม้าก็เข้ามาใกล้คณะผู้ติดตามของข้าจากด้านหลัง "พวกเจ้ามีธุระอันใดที่นี่?" [target_knight.GetFirstName] ผู้นำของพวกเขาเอ่ยถาม"
 steal_herd_ongoing.1001.a: "ผู้ที่จะมาทดสอบความกล้าหาญของข้า!"
 steal_herd_ongoing.1001.a_win: "ท่านสร้างความประทับใจให้ [target_knight.GetFirstNameNoTooltip] ด้วยทักษะการต่อสู้ของท่าน"
 steal_herd_ongoing.1001.duel_desc: "ท่านพยายามเบี่ยงเบนความสนใจของ [target_knight.GetFirstNamePossessiveNoTooltip]"
 steal_herd_ongoing.1001.lose: "[target_knight.GetFirstNameNoTooltip] เอาชนะท่านได้"
 steal_herd_ongoing.1001.b: "ชื่นชมอาณาเขตของ [target.GetFirstNamePossessiveNoTooltip] แน่นอน"
 steal_herd_ongoing.1001.b_win: "[target_knight.GetFirstNameNoTooltip] ชื่นชมในความรู้สึกของท่าน"
 steal_herd_ongoing.1001.c: "เพลิดเพลินกับเครื่องดื่ม! ท่านจะร่วมด้วยหรือไม่?"
 steal_herd_ongoing.1001.c_win: "ท่านและ [target_knight.GetFirstNameNoTooltip] ดื่มกันทั้งคืน"
 steal_herd_ongoing.1001.c_win_big: "ท่านโน้มน้าวให้ [target_knight.GetFirstNameNoTooltip] ที่เมามายเข้าร่วมอุดมการณ์ของท่าน"
 steal_herd_ongoing.1001.d: "ไม่มีอะไร ข้าจะไปตามทางของข้า"

 steal_herd_ongoing.1002.t: "$steal_herd_event_title$ คนเลี้ยงแกะปลอมตัว"
 steal_herd_ongoing.1002.desc: "[chosen_agent.GetName] บอกข้าว่าคนเลี้ยงแกะของ [target.GetTitledFirstNamePossessive] มักจะล้มเหลวในการนำทางแกะแม้เพียงตัวเดียวในฝูงของ [target.GetHerHis]\n\n"เหตุใดเจ้าไม่สวมเครื่อง แต่งกายของคนเลี้ยงแกะเล่า? จงเดินทางไปยัง [target.GetFirstNameNoTooltip] และเสนอตัวที่จะ 'ช่วย' คนเลี้ยงแกะที่ไร้ความสามารถของ [target.GetHerHis]" ข้าแนะนำ [chosen_agent.GetFirstNameNoTooltip] [chosen_agent.GetSheHe|U] มองมาที่ข้าด้วยท่าทางกังวล และถอนหายใจ"
 steal_herd_ongoing.1002.a: "ไปเถิด [chosen_agent.GetFirstNameNoTooltip] ช่วย [target.GetHerHim] หน่อย!"
 steal_herd_ongoing.1002.b: "และข้ารู้ดีว่าเจ้าควรจะพูดอะไร..."
 steal_herd_ongoing.1002.c: "อันที่จริง ช่างมันเถอะ"
 steal_herd_ongoing.1002.duel_desc: "[chosen_agent.GetFirstName] ปลอมตัวเป็นคนเลี้ยงแกะ"
 steal_herd_ongoing.1002.win: "การปลอมตัวของ [chosen_agent.GetHerHis|U] น่าเชื่อถือ"
 steal_herd_ongoing.1002.b_tt: "ท่านช่วย [chosen_agent.GetFirstName] ในการปลอมตัวของ [chosen_agent.GetHerHis]"
 steal_herd_ongoing.1002.lose: "[chosen_agent.GetSheHe|U] ปลอมตัวได้ไม่แนบเนียน"

