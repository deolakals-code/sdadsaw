l_english: 
 mpo_temujin_flavor.0001.t: "มิได้ถูกทอดทิ้งอีกต่อไป"
 mpo_temujin_flavor.0001.desc: "ราตรีมืดมิดลง มีเพียง [jamukha.GetTitledFirstName] และข้าที่ยังคงอยู่ในค่าย\n\n"[ROOT.Char.GetFirstNameNoTooltip]" [jamukha.GetFirstNameNoTooltip] ชี้กริชของ [jamukha.GetHerHis] มาที่ข้า "ในยามสงคราม ข้าเคยต่อสู้เคียงข้างท่านเพื่อนำภรรยาของท่านกลับคืนมา ในยามสันติ ข้าจะรับฟังคำแนะนำของท่าน แลกเปลี่ยนของกำนัลกับท่าน และติดตามท่านไปจนกว่าขาของข้าจะมิอาจรับใช้อีกต่อไป"\n\nปลายกริชสัมผัสฝ่ามือของเขาและกรีดเป็นแผลลึก: "ให้โลหิตสาบานในสิ่งที่ลิ้นมิอาจเอ่ย""
 mpo_temujin_flavor.0001.a: ""ข้าจะอยู่กับท่านจนกว่าดวงตาของข้าจะขาวโพลน""
 mpo_temujin_flavor.0001.b: ""หมาป่ามิได้ต้องการแกะ""
 
 mpo_temujin_flavor.0010.t: "การอำลา"
 mpo_temujin_flavor.0010.desc.intro: ""ถึงเวลาแล้ว ท่าน [ROOT.GetCharacter.Custom('GetMongolHonorific')] [ROOT.Char.GetFirstNameNoTooltip]" [jamukha.GetFirstName] นั่งอยู่หน้ากองไฟ "ภายใต้การปกครองอันชอบธรรมของท่าน ข้าเจริญรุ่งเรือง แต่เมล็ดพันธุ์จะมิเติบโตภายใต้ร่มเงาของต้นไม้"\n\nเขาลุกขึ้นยืน"
 mpo_temujin_flavor.0010.desc.rejected: ""ท่านเคยปฏิเสธข้าครั้งหนึ่ง ข้าหวังว่าท่านจะเข้าใจ""
 mpo_temujin_flavor.0010.desc.blood_brothers: ""ณ หน้ากองไฟนี้เองที่เราเคยให้คำสัตย์ปฏิญาณ ซึ่งข้าตั้งใจจะรักษาไว้ แต่ผู้คนของข้าเรียกร้องอิสรภาพ""
 mpo_temujin_flavor.0010.desc.fallback: ""ผู้คนของข้าเพียงต้องการอิสรภาพ เช่นเดียวกับผู้คนของท่าน""
 mpo_temujin_flavor.0010.aa: ""ไปเถิด! ไปซ่อนตัวเหมือนหนอน เช่นเจ้าเถิด""
 mpo_temujin_flavor.0010.aa_remove_blood_brother: "ท่านหยุดการเป็น [blood_brothers|E] กับ [jamukha.GetShortUIName]"
 mpo_temujin_flavor.0010.a: ""ท่านกำลังบังคับให้ผู้คนของท่านกินดิน""
 mpo_temujin_flavor.0010.a.tt.success: "[jamukha.GetShortUIName] ถูกเยาะเย้ย"
 mpo_temujin_flavor.0010.a.tt.failure: "ดูเหมือนไม่มีผู้ใดกังวล"
 mpo_temujin_flavor.0010.b: ""#EMP อยู่ต่อเถิด.#!""
 mpo_temujin_flavor.0010.c: ""ท่านได้ตัดสินใจแล้ว""
 every_non_brave_compassionate_courtier: "[courtier|E] ทุกคนที่มิใช่ [GetTrait('brave').GetName( GetNullCharacter )] หรือ [GetTrait('compassionate').GetName( GetNullCharacter )]"
 
 mpo_temujin_flavor.0020.t: "การทรยศของ [jamukha.GetFirstNamePossessiveNoTooltip]"
 mpo_temujin_flavor.0020.desc.intro: ""[ROOT.Char.GetFirstNameNoTooltip]! [ROOT.Char.GetFirstNameNoTooltip]!" เสียงคุ้นเคยปลุกข้าในยามดึกสงัด "ข้าขออภัย แต่มันมาถึงจุดนี้แล้ว" [jamukha.GetFirstName] อยู่บนหลังม้าของ [jamukha.GetHerHis] ตรงหน้าประตูเต็นท์ของข้า\n\n"ข้ามาเพื่อเตือนท่าน""
 mpo_temujin_flavor.0020.desc.blood_brothers: "เพื่อโลหิตที่เราเคยหลั่งร่วมกัน""
 mpo_temujin_flavor.0020.desc.friend: "เพื่อมิตรภาพที่เราเคยมีร่วมกัน""
 mpo_temujin_flavor.0020.desc.rival: "ความเคารพที่ข้าจะแสดงต่อคู่ปรับที่คู่ควร""
 mpo_temujin_flavor.0020.desc.fallback: "ความเคารพที่ข้าจะแสดงต่ออดีต [ROOT.Char.GetLadyLord] ของข้า""
 mpo_temujin_flavor.0020.desc.outro: "\n\n"นับจากนี้ไป ข้าจะไล่ล่าและตามล่าท่าน ข้าจะฟันฝ่าสายน้ำลึกและกัดกร่อนศิลาอันส่องประกาย ไม่มีสิ่งใดที่ข้าจะไม่ทำเพื่อกำจัดท่าน — เพราะข้าคือผู้ที่เกิดมาเพื่อนำชาวมองโกลทั้งปวง — #EMP มิใช่ท่าน!#!""
 mpo_temujin_flavor.0020.a: ""ท่าน ผู้ที่ข้าเคยเรียกว่าน้อง...""
 mpo_temujin_flavor.0020.b: ""กริชของข้าจะพบกับคอของท่าน""
 mpo_temujin_flavor.0020.c: ""ท่านจะต้องเสียใจ!""
 temujin_jamukha_truce: "อดีตเจ้าเหนือหัว"
 mpo_temujin_flavor.0020.cb.tt: "[temujin.GetShortUIName] และ [jamukha.GetShortUIName] ได้รับ #high $retaliation_cb$#! [casus_bellis|E] ต่อกันและกัน"
 mpo_temujin_flavor.0020.jamukha_gok_requirement: "[jamukha.GetShortUIName] จะต้องถูกเอาชนะเพื่อดำเนินการ #high $mpo_become_greatest_of_khans_decision$#! [decision|E]"
 mpo_temujin_flavor.0020.a_war_win: "การชนะ [war|E] #high เชิงรุก#! ต่อ [jamukha.GetShortUIName] จะมอบ @legitimacy_icon![legitimacy|E] และ @prestige_icon![prestige|E] เพิ่มเติม"
 mpo_temujin_flavor.0020.b_murder: "ท่านได้รับโบนัส #P #EMP มหาศาล#!#! ต่อ [schemes|E] [GetScheme('murder').GetTypeName] ที่มุ่งเป้าไปยัง [jamukha.GetShortUIName]"
 TEMUJIN_JAMUKHA_MURDER_BONUS: "ท่านสาบานว่าจะสังหาร [target.GetShortUIName]: $VALUE|+0=$"
 temujin_jamukha_war_modifier: "การแก้แค้นของพี่น้อง"
 temujin_jamukha_war_modifier_desc: "ตัวละครนี้ถูกทรยศโดยบุคคลใกล้ชิด"
 temujin_jamukha_war_smaller_modifier: "การแก้แค้นอันนองเลือด"
 temujin_jamukha_war_smaller_modifier_desc: "ตัวละครนี้ถูกทรยศโดยบุคคลที่พวกเขาไว้ใจ"
 mpo_temujin_flavor.0020.remove_friend: "ท่านหยุดการเป็น [friends|E] กับ [jamukha.GetShortUIName]"
 
 mpo_temujin_flavor.0030.t: "ความผิดของตระกูล [mergid.GetDynastyNameNoTooltip]"
 mpo_temujin_flavor.0030.desc: ""[ROOT.Char.GetFirstNameNoTooltip]" [borte.GetFirstNameNoTooltip] เรียกเบาๆ พลางเข้ามาในเต็นท์ของข้า แก้มของ [borte.GetHerHis|U] แดงก่ำและผมของ [borte.GetHerHis] ยุ่งเหยิง "นับตั้งแต่ข้าถูกจับเป็นตัวประกันโดยตระกูล [mergid.GetDynastyName] ข้าก็รู้สึกไม่สบายกาย"\n\n[borte.GetSheHe|U] ใช้มือที่สั่นเทาปิดครรภ์ของ [borte.GetHerHis]"
 mpo_temujin_flavor.0030.a: ""[mergid.GetSheHe|U] จะต้องชดใช้เรื่องนี้""
 mpo_temujin_flavor.0030.b: ""#EMP ท่าน#! คือสิ่งที่สำคัญที่สุดที่นี่""
 mpo_temujin_flavor.0030.c: ""เหตุใดท่านจึงมารบกวนข้าด้วยเรื่องไร้สาระ เช่นนี้?""
 mpo_temujin_flavor.0030.a.tt: "ท่านได้รับ #high $retaliation_cb$#! [casus_belli|E] ต่อ [mergid.GetShortUIName]"
 mpo_temujin_flavor.0030.pregnancy_tt: "[borte.GetShortUIName] จะแสดงอาการตั้งครรภ์ในไม่ช้า"
 pregnancy.1002.d.borte: "ถึงเวลาอันน่าหวาดหวั่นแล้ว..."
 pregnancy.1002.a.borte: "มันจบลงแล้ว"
 birth.1003.desc.borte: "\n\nอย่างไรก็ตาม ความซื่อสัตย์ของ [mother.GetFirstNamePossessiveNoTooltip] นั้นน่ายกย่อง และเรื่องนี้จะต้องไม่ ทำให้ข้าไขว้เขวไปจากสิ่งที่อยู่ตรงหน้า"
 birth.1003.desc.empty: ""
