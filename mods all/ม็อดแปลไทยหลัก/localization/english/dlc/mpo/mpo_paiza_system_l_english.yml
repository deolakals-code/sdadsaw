 mpo_decisions_events.0110.t: "ในนามแห่ง [paiza_patron.GetTitleAsNameNoTooltip]"
 mpo_decisions_events.0110.desc: "ข้าคือข้ารับใช้ผู้ #EMP ภักดี#! ของ [paiza_patron.GetTitledFirstNamePossessive] ข้าถือนามของ [paiza_patron.GetHerHis] จารึกไว้ในโลหะและเจตจำนงของ [paiza_patron.GetHerHis] ในคำพูดและการกระทำของข้า ความแข็งแกร่งของข้าคือของ [paiza_patron.GetHerHis]\n\n[local_boi.GetName] ผู้อ่อนแอจะอ้อนวอนเท่าใดก็ได้ตามใจข้า มันจะไม่เปลี่ยนแปลงคำสั่งของกูรข่านที่ออกมาจากปากข้า\n\nทรัพย์สมบัติทั้งหมด สัตว์ที่เหมาะสมทั้งหมดจากดินแดนเหล่านี้ จะต้องถูกรวบรวมทันทีและนำมาให้ข้า เพราะความอ่อนแอของเจ้าดูหมิ่นอำนาจของ [paiza_patron.GetTitleAsNamePossessiveNoTooltip] และข้าจะนำมันทั้งหมดไปใช้... ในทางที่ #EMP ดีกว่า#!"
 mpo_decisions_events.0110.a: "รวบรวมทุกสิ่งที่เคลื่อนไหวได้!"
 mpo_decisions_events.0110.b: ""อย่าได้เอ่ยปากถึงเรื่องนี้เลยนะ เจ้าพวกสุนัข!""
 mpo_decisions_events.0110.c: "ข้าเปลี่ยนใจแล้ว"
 mpo_decisions_events.0110.d: "นี่มัน #EMP ผิด#! ถอยออกไป!"
 mpo_decisions_events.0110.b.success: "สำเร็จ"
 mpo_decisions_events.0110.b.success_desc: "ไม่มีคำพูดใดเกี่ยวกับสิ่งที่เกิดขึ้นที่นี่ไปถึงหูของ [paiza_patron.GetTitledFirstName]"
 mpo_decisions_events.0110.b.failure: "[paiza_patron.GetTitledFirstName] ได้ยินเกี่ยวกับการใช้อำนาจในทางมิชอบนี้"
 custom.mpo_resources_gained_abuse: "ของที่ปล้นมาจาก [counties|E] ในบริเวณใกล้เคียง"

 mpo_decisions_events.0111.t: "พระพิโรธแห่งกูรข่าน"
 mpo_decisions_events.0111.desc: "กูรข่านเปรียบดังทุ่งหญ้าสเตปป์ พลังอำนาจและเจตจำนงของ [paiza_patron.GetNamePossessive] แผ่ขยายไปทั่ว นามของ [paiza_patron.GetHerHis|U] ถูกกระซิบโดยสายลม\n\nข้าถือนามของ [paiza_patron.GetHerHis] ติดตัว จารึกไว้ในโลหะแห่งไป่ซา ข้าได้ใช้มันเพื่อสร้างความหวาดกลัวและความภักดีในใจผู้คน ดูเหมือนจะหลายครั้งเกินไปแล้ว\n\nบัดนี้ถึงตาข้าที่ต้องหวาดกลัว กูรข่านได้ยินถึงการกระทำของข้าและเรียกมันว่าการใช้วาจาของ [paiza_patron.GetHerHis] นามของ [paiza_patron.GetHerHis] ในทางมิชอบ และด้วยเหตุนั้น ข้าจะกลายเป็นตัวอย่างอันน่าสยดสยองให้ทั้งทุ่งหญ้าสเตปป์ได้เห็น"
 mpo_decisions_events.0111.a: "ข้ายินดีรับการตัดสิน"
 mpo_decisions_events.0111.b: ""อา แต่การกระทำของข้านั้นชอบธรรมนะ ท่านเห็นหรือไม่...""

 mpo_decisions_events.0112.t: "$mpo_decisions_events.0111.t$"
 mpo_decisions_events.0112.desc: "ข้าเป็นดั่งทุ่งหญ้าสเตปป์ พลังและเจตจำนงของข้าแผ่ไพศาลไปทั่วทุกแห่งหน นามของข้าถูกกระซิบโดยสายลม\n\nเหล่าพลขี่ม้าต่างพกพานามของข้าไปด้วย สลักไว้บนป้ายอาญาสิทธิ์โลหะของพวกเขา ทว่าบางคนกลับบิดเบือนมันดุจอสรพิษ เหล่าคนโฉดเขลาละโมบ เช่น [paiza_abuser.GetName] และ [paiza_abuser_1.GetName] เมื่อไม่นานมานี้ [paiza_abuser.GetSheHe] หมอบกายเยี่ยงหนอนของ [paiza_abuser.GetHerHis|U] ต่อหน้าข้า บัดนี้ [paiza_abuser.GetSheHe] กลับข่มเหงเหล่าข้าแผ่นดินผู้ภักดีของข้า ซึ่งกำลังมองมาที่ข้าเพื่อรอคำตอบ เพื่อความยุติธรรม ขอให้สายลมจงพัดพาเจตจำนงที่แท้จริงของข้าไปบัดนี้!\n\n"ข้าเพิ่งได้รับข่าวมา จงให้พวกมันรู้ว่า [ROOT.Char.GetTitledFirstNameNoTooltip] หาได้เกรงกลัวสุนัขตอนใดๆ ไม่ ทั้ง [paiza_abuser.GetFirstNameNoTooltip], [paiza_abuser_1.GetFirstNameNoTooltip], หรือผู้ใดก็ตาม นามของข้าก็คือนามของข้า!""
 mpo_decisions_events.0112.a: "นำศีรษะของพวกมันมาให้ข้า!"
 mpo_decisions_events.0112.a.desc: "[characters|E] อื่นๆ ที่มี [paiza|E] ของท่านจะเต็มใจใช้อำนาจของท่านในทางมิชอบน้อยลงหากทั้ง [paiza_abuser.GetFirstName] และ [paiza_abuser_1.GetFirstName] ตาย"
 mpo_decisions_events.0112.b: "ข้าจะปล่อยเรื่องนี้ไป... สำหรับตอนนี้"
 mpo_decisions_events.0112.c: "อย่ามารบกวนข้าอีกเลย"
 mpo_decisions_events.0112.c.flavor: "การใช้อำนาจของท่านในทางมิชอบจะเกิดขึ้นอีก แต่ท่านจะไม่ได้รับการแจ้งเตือนอีกต่อไป"


 mpo_paiza_abuse_counter_effect.random: "การกระทำของ [gurkhan|E] นั้นคาดเดาไม่ได้ดุจดังมนุษย์เท่านั้นที่จะเป็นได้"
 mpo_paiza_abuse_counter_effect.angry: "@warning_icon! [gurkhan|E] โกรธแค้นต่อการใช้อำนาจในทางมิชอบของท่านและเกือบจะแน่นอนว่าจะต้องตอบโต้"
 mpo_paiza_abuse_counter_effect.annoyed: "@alert_icon! [gurkhan|E] รำคาญใจต่อการใช้อำนาจในทางมิชอบของท่านและมีแนวโน้มที่จะตอบโต้"
 mpo_paiza_abuse_counter_effect.indifferent: "[gurkhan|E] ไม่แยแสต่อการใช้อำนาจในทางมิชอบของท่านและจะไม่ดำเนินการใดๆ ในครั้งนี้"
 mpo_paiza_abuse_counter_effect.khan_reaction_action: "@alert_icon! [gurkhan|E] จะตอบโต้อย่าง #EMP รุนแรง#!"
 mpo_paiza_abuse_counter_effect.khan_reaction_angry: "[gurkhan|E] จะ #EMP โกรธแค้น#! แต่จะไม่ดำเนินการใดๆ"
