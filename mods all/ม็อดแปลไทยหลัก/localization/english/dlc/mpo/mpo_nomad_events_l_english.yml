 nomad_events.0110.t: "จนมุม"
 nomad_events.0110.desc: "หิมะ. ต้นไม้เสียดสีกัน. เสียงคล้ายหมาป่าหอนอยู่ไกลๆ. แม้ว่า... จะไม่ไกลนักก็ตาม\n\n"ช่วยด้วย! ช่วยด้วย!" ไม่ยากที่จะจำเสียงของ [victim.GetTitledFirstNamePossessive] ได้ และข้าก็เริ่มวิ่งไปทางนั้น #EMP "ช่วยด้วย ได้โปรด!"#!\n\nเมื่อข้าไปถึง ข้าพบ [victim.GetFirstNameNoTooltip] หลบอยู่หลังก้อนหินบางก้อน และหมาป่าตัวหนึ่งกำลังเข้าใกล้ [victim.GetHerHim]"
 nomad_events.0110.a: ""เหล่า $knight_culture_player_plural_no_tooltip$ จัดการมัน!""
 nomad_events.0110.b: ""ข้าจะหักคอเจ้า เจ้าสัตว์ร้าย!""
 nomad_events.0110.b.success: "ท่านสามารถไล่สัตว์ร้ายไปได้"
 nomad_events.0110.b.failure: "สัตว์ร้ายทำร้ายท่าน"
 nomad_events.0110.c: ""วิ่งหนีไป [victim.GetFirstNameNoTooltip]!""
 nomad_events.0110.c.success: "[victim.GetShortUIName] วิ่งเร็วที่สุดเท่าที่ [victim.GetSheHe] เคยวิ่งมา"
 
 nomad_events.0120.t: "การขี่ม้ายามเย็น"
 nomad_events.0120.desc: "หมู่เมฆก่อตัวเป็นรูปสัตว์ต่างๆ เหนือศีรษะของเรา และ [companion.GetFirstName] กับข้าก็ขี่ม้าออกห่างจากค่ายไปเล็กน้อย\n\n"ท่านเคยไปไกลที่สุดที่ใด ท่าน [ROOT.Char.GetTitleAsNameNoTooltip]?"\n\n"สำหรับข้าแล้ว มันไม่ไกลนัก" มีความละอายในน้ำเสียงของ [companion.GetHerHis] "แต่สักวันหนึ่ง ข้าอยากจะไปยังดินแดนที่ไม่มีใครรู้จักภาษาของข้า""
 nomad_events.0120.a: ""ให้ข้ารู้จักเจ้าเถิด""
 nomad_events.0120.b: "โอกาสที่จะได้ทำความรู้จักกับ [companion.GetFirstNameNoTooltip] ให้ดีขึ้น..."
 nomad_events.0120.c: "ข้าต้องมุ่งเน้นไปที่การขี่ม้า"
