mpo_restless_for_migration_modifier: "กองทัพนักรบผู้กระสับกระส่าย"
mpo_restless_for_migration_modifier_desc: "พลม้าทุกคนของชนร่อนเร่ผู้นี้พร้อมที่จะโจมตีดินแดนใหม่"

mpo_bountiful_camels_modifier: "ฝูงอูฐอันอุดมสมบูรณ์"
mpo_bountiful_camels_modifier_desc: "ผู้คนของผู้ปกครองผู้นี้ปรับตัวเข้ากับชีวิตในทะเลทรายได้ดี มีฝูงอูฐมากมาย"
mpo_bountiful_sheep_modifier: "ฝูงแกะอันอุดมสมบูรณ์"
mpo_bountiful_sheep_modifier_desc: "ขนแกะ นมแกะ และเนื้อแกะเป็นหนึ่งในความกังวลหลักของผู้ปกครองผู้นี้และผู้คนของพวกเขา"
mpo_bountiful_hunting_modifier: "ค่ายล่าสัตว์"
mpo_bountiful_hunting_modifier_desc: "ชนร่อนเร่ของผู้ปกครองผู้นี้ส่วนใหญ่ยังชีพด้วยการล่าสัตว์"
mpo_bountiful_horses_modifier: "อาชาที่ได้รับการเลี้ยงดูอย่างดี"
mpo_bountiful_horses_modifier_desc: "กองทัพของชนร่อนเร่ผู้นี้ขี่ม้าอ้วนพีแข็งแรงอย่างรวดเร็ว พร้อมด้วยม้าสำรองมากมาย"
mpo_bountiful_hunting_cheaper_hunts_tt: "ค่าใช้จ่าย [GetActivityType( 'activity_hunt' ).GetName]: @gold_icon!#P -20%#! เป็นเวลา #high 10 ปี#!"

mpo_bountiful_sheep_cheaper_feasts_tt: "ค่าใช้จ่าย [GetActivityType( 'activity_feast' ).GetName] $feast_type_tsagaan_sar$: @gold_icon!#P -20%#! เป็นเวลา #high 10 ปี#!"
 
mpo_nomad_events.1110.t: "ทุ่งหญ้าชุ่มน้ำ"
mpo_nomad_events.1110.desc_river: "สายน้ำแห่งแม่น้ำสีเขียวขับขานบทเพลง"
mpo_nomad_events.1110.desc_sea: "คลื่นทะเลกว้างใหญ่ซัดสาดเข้าหาฝั่ง"
mpo_nomad_events.1110.desc_lake: "ผืนน้ำแห่งทะเลสาบสีฟ้าอันสงบนิ่งพักผ่อน"
mpo_nomad_events.1110.desc: "เลยค่ายของข้าไปเล็กน้อยใน [capital_province.GetTitle.GetNameNoTier]\n\nเหล่า [ROOT.Char.GetCulture.GetCollectiveNoun] ของข้ายืนอยู่ในน้ำตื้น ส่งเสียงโห่ร้องยินดีกับปลาตัวยาวเท่าดาบ เกล็ดสีน้ำตาลทึมของมันส่องประกายในแสงแดด [dummy_gender.GetWomanMan] ท้องถิ่นคนหนึ่งชูปลาตัวนั้นขึ้นสูง อวดอ้างถึงการจับได้\n\nปลาใหญ่ตัวนั้นเป็นเครื่องพิสูจน์ว่ามีเนื้อดีๆ ให้ได้มา — หากเหล่า [ROOT.Char.GetCulture.GetCollectiveNounNoTooltip] ของข้าใช้เวลาทั้งวันล่าสัตว์ที่หากินในน้ำ"
mpo_nomad_events.1110.a: "จงต่อเรือเพื่อล่องไปในน่านน้ำอันอุดมสมบูรณ์เหล่านี้"
mpo_nomad_events.1110.a_repeat: "เรือของเราจะรับใช้เราเป็นอย่างดี"
mpo_nomad_events.1110.b: "ข้าจะ #EMP ถ่วงน้ำ#! [dummy_gender.GetWomanMan] ผู้ใดก็ตามที่ลงจากหลังม้าของ [dummy_gender.GetHerHis]!"
mpo_nomad_events.1110.c: "ตาข่าย จงสานตาข่ายให้มากเข้าไว้"

custom.every_fishing_county_tt: "[county|E] ทุกแห่งใน [domain|E] ที่ติดชายฝั่ง ริมแม่น้ำ หรือริมทะเลสาบ"
fishing_counties_gold_scaling: "#weak การได้รับทองคำขึ้นอยู่กับเคาน์ตีในอาณาเขตที่ติดชายฝั่ง ริมแม่น้ำ และริมทะเลสาบ#!"
maritime_tradition_unlock_tt: "#weak มีให้เนื่องจาก [tradition|E] ทาง [cultural|E] เกี่ยวกับการเดินเรือ#!"
nomad_unlocked_fishing_yurt_flag_tt: "ท่านปลดล็อก #high $fishing_yurt_01_domicile_building$#! สำหรับ [yurt_building|E] #high $yurt_main_01_domicile_building$#! ของท่าน"

mpo_nomad_events.1120.t: "หมาป่าแห่งเหมันต์"
mpo_nomad_events.1120.desc: "ลมหนาวเหน็บมิได้หอนเพียงลำพังใน [capital_province.GetTitle.GetNameNoTier] ไม่ใช่ในฤดูหนาวอันเลวร้ายนี้ ไม่ใช่ในคืนนี้\n\n#EMP "หมาป่า! หมาป่าในฝูงแกะ!"#! เสียงร้องตะโกนดังขึ้น ขณะที่พลม้าของข้าและตัวข้าต่างรีบปีนขึ้นอานม้า\n\nฝูงแกะเบียดเสียดกัน ส่งเสียงร้องด้วยความหวาดกลัวอย่างสุดขีด สัตว์ร้ายขนสีดำสนิทลากขา ลากคอพวกมัน แล้ววิ่งหายไปในความมืดมิดแห่งป่ารกร้าง"
mpo_nomad_events.1120.a: "หมาป่ารึ? ปะ! พลม้าของข้านับไม่ถ้วน"
mpo_nomad_events.1120.a.flavor: "ไม่มีนักล่าใดใน [capital_county.GetNameNoTierNoTooltip] ที่จะสามารถหลุดรอดจากกองทัพของข้าไปได้..."
mpo_nomad_events.1120.b: "ขี่ม้าให้เร็ว — ต้อนพวกมันเข้ามา!"
mpo_nomad_events.1120.b.success: "ไม่มีหมาป่าใดเร็วกว่าม้าของท่าน"
mpo_nomad_events.1120.b.failure: "ในความโกลาหล หมาป่าหลุดรอดไปได้"
mpo_nomad_events.1120.c: "#EMP ลูกธนู! ลูกธนู!#! ข้าจะเอาหนังของพวกมัน!"
mpo_nomad_events.1120.c.success: "ลูกธนูของท่านปลิดชีพสัตว์ร้าย"
mpo_nomad_events.1120.c.failure: "ลูกธนูของท่านโดนม้าและแกะ"
mpo_nomad_events.1120.d: "หยุด! พวกมันเพียงแค่คัดแยกตัวที่อ่อนแอออกจากฝูงเท่านั้น"
mpo_nomad_events.1120.d.flavor: "ในฤดูกาลนี้ ไม่มีลูกแกะให้ถูกขโมย มีเพียงตัวแก่และตัวป่วยเท่านั้น เราไม่ควรปฏิเสธสิ่งเหล่านั้นต่อหมาป่า"
