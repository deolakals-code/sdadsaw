 nomad_events.0130.t: "ข้อตกลงที่ดี"
 nomad_events.0130.desc: "ชายแปลกหน้าผู้หนึ่งกำลังดึงบังเหียนม้าสองสามตัว พยายาม ทำให้พวกมันสงบลง\n\n"เงียบเดี๋ยวนี้," [merchant.GetSheHe] ปรามพวกมัน "อา ช่างเป็นการพบพานที่น่ายินดียิ่ง!" [merchant.GetSheHe] หันกาย [merchant.GetHerHis] มาทางข้าพร้อมรอยยิ้มกว้าง\n\n"หากข้าจะสามารถชักชวนให้ท่านสนใจซื้อสินค้าของข้าได้บ้าง," [merchant.GetSheHe] เสนอ, พลางชี้ไปที่ม้าเหล่านั้น, "ข้ายังมีแกะอีกจำนวนหนึ่งอยู่ตรงทุ่งนั้นด้วย""
 nomad_events.0130.a: ""ไปเสีย และทิ้งสัตว์ของเจ้าไว้""
 nomad_events.0130.b: ""ข้าอาจจะต้องการพ่อค้าที่ดีสักคน""
 nomad_events.0130.c: ""ข้ายินดีรับไว้บางส่วน""
 nomad_events.0130.d: ""ข้าไม่สนใจ""
 
 nomad_events.0140.t: "ห่างไกลจากบ้าน"
 nomad_events.0140.desc: ""...ท่านเห็น [merchant.GetHerHim] หรือไม่?", "ท่านคิดว่า [merchant.GetSheHe] มาจากที่ใด?", "แล้วท่านคิดอย่างไรกับเสื้อผ้าของ [merchant.GetHerHis]?"\n\nเสียงพึมพำแทบจะหลีกเลี่ยงไม่ได้ขณะที่ข้าเดินผ่านค่าย ไม่นานเหตุผลก็ปรากฏชัด: [merchant.GetWomanMan] แต่งกายแปลกประหลาดยืนอยู่ข้างกองไฟของข้า\n\n"คารวะท่าน [ROOT.GetCharacter.Custom('GetMongolHonorific')] [ROOT.GetCharacter.GetTitleAsNameNoTooltip] ข้าคือพ่อค้าชาว [merchant.GetFaith.GetAdjectiveNoTooltip] ผู้พลัดหลงมายังดินแดนแปลกถิ่นนี้ ข้าปรารถนาที่จะใช้เวลาสองสามปีในราชสำนักของท่าน""
 nomad_events.0140.a: ""บอกข้าเพิ่มเติมเกี่ยวกับ [merchant.GetFaith.GetNameNoTooltip] ของเจ้า...""
 nomad_events.0140.b: ""ค่ายของข้ายินดีต้อนรับเจ้า""
 nomad_events.0140.c: ""ไปเสีย เดี๋ยวนี้""
 nomad_events.0140.a.tt: "ท่านได้รับส่วนลด #P 50%#! สำหรับการเปลี่ยนไปนับถือ [merchant.GetFaith.GetName]"
 
 nomad_events.0150.t: "อีกสักถ้วย"
 nomad_events.0150.desc: "[Glossary( 'คูมิส', 'KUMIS_GLOSS')] ถูกส่งต่อกันในชามที่เติมจนเต็มปรี่ "นี่ นี่!" [companion.GetTitledFirstName] ทำท่าทาง พยายามจะขอเพิ่ม "ท่าน [ROOT.Char.GetTitleAsNameNoTooltip] ของเจ้าเรียกร้อง!" [companion.GetSheHe] หัวเราะ ยิ้มให้ข้า "พวกเจ้าช้าราวกับลูกม้า! เร็วเข้า!"\n\n"อา!" ในที่สุด ชามก็ถูกส่งมาถึงมือของ [companion.GetHerHis] และ [companion.GetSheHe] ก็ยื่นให้ข้าทันที\n\n"มาดื่มกันเถิด ท่าน [ROOT.Char.GetTitleAsNameNoTooltip] ที่ดีของข้า เพราะราตรียังเยาว์วัย และอีกไม่นานเราก็จะไม่เป็น เช่นนั้นแล้ว!""
 nomad_events.0150.a: ""เจ้ารู้หรือไม่ว่าใครคือคนขี้ขลาดตัวจริง? เจ้าโง่ [rival.GetFirstNameNoTooltip] นั่นไง""
 nomad_events.0150.a.tt: "ทางเลือกนี้มีอยู่ เนื่องจากท่านมี [rival|E]"
 nomad_events.0150.b: ""มาเลย!""
 nomad_events.0150.c: "โอกาสอันโอชะที่จะได้อวดพละกำลังของข้า"
 KUMIS_GLOSS: "เครื่องดื่มแอลกอฮอล์หมักที่ทำจากนมม้า เป็นที่นิยมทั่วไปในทุ่งหญ้าสเตปป์อันยิ่งใหญ่ รู้จักกันในชื่อ #EMP ไอรัก#! ในภาษามองโกล"
 friend_drank_together: "[CHARACTER.GetShortUIName|U] และ [TARGET_CHARACTER.GetShortUIName] ร่วมดื่มและพูดคุยตลกขบขันกันทั้งคืน"
 friend_drank_together_corresponding: "[TARGET_CHARACTER.GetShortUIName|U] และ [CHARACTER.GetShortUIName] ร่วมดื่มและพูดคุยตลกขบขันกันทั้งคืน"
 
 nomad_events.0160.t: "คำพูดอันไพเราะ"
 nomad_events.0160.desc.intro: ""มีบางอย่างที่ไม่เคยออกจากใจข้าเลย" [spouse.GetFirstName] กล่าวพลางนอนอยู่บนเตียง "ข้าสังเกตเห็นบางอย่างเกี่ยวกับท่านเมื่อไม่นานมานี้"\n\n"
 nomad_events.0160.desc.dread: ""การปรากฏตัวของท่าน ทำให้เหล่า [ROOT.Char.GetWomenMen] เต็มไปด้วยความหวาดกลัว พวกเขากรีดร้อง หนี และอ้อนวอนขอความเมตตาจากท่าน""
 nomad_events.0160.desc.prowess: ""ความชำนาญของท่านไร้เทียมทาน เหล่า [ROOT.Char.GetWomenMen] อื่นๆ ต่างมองท่านด้วยสายตาอิจฉาริษยา เต็มไปด้วยความอิจฉา"
 nomad_events.0160.desc.lover: ""ความรักที่ข้ามีต่อท่านเพิ่มพูนขึ้นทุกวัน ราวกับดอกไม้ป่า มันไม่มีวันตาย"
 nomad_events.0160.desc.brave: ""ความกล้าหาญของท่านเป็นแรงบันดาลใจให้เหล่า [ROOT.Char.GetWomenMen] และเติมเต็มหัวใจของพวกเขาด้วยความปรารถนาที่จะติดตามท่าน""
 nomad_events.0160.desc.generic: ""สติปัญญาของท่านแข็งแกร่งเท่าแขนของท่าน เหล่า [ROOT.Char.GetWomenMen|U] จะติดตามท่านไปทุกหนทุกแห่ง""
 nomad_events.0160.desc.outro: "ข้าให้ความสนใจมาโดยตลอด และข้าก็ประทับใจ"\n\n[spouse.GetSheHe|U] ทำท่าให้ข้าเข้าไปใกล้"
 nomad_events.0160.a: ""ในที่สุด เจ้าก็มีสติเสียที""
 nomad_events.0160.b: ""ข้าก็รักเจ้า เช่นกัน ยอดรักของข้า""
 nomad_events.0160.c: ""จงบอกทุกคนให้รู้""
 lover_admirable_thing: "[TARGET_CHARACTER.GetShortUIName|U] สารภาพความชื่นชมอย่างสุดซึ้งที่ [TARGET_CHARACTER.GetHerHis] มีต่อ [CHARACTER.GetShortUIName]"
 lover_admirable_thing_corresponding: "[CHARACTER.GetShortUIName|U] สารภาพความชื่นชมอย่างสุดซึ้งที่ [CHARACTER.GetHerHis] มีต่อ [TARGET_CHARACTER.GetShortUIName]"
 
 nomad_events.0170.t: "ผู้น่าสะพรึงกลัว"
 nomad_events.0170.desc: "[spouse.GetFirstName] นั่งอยู่ข้างเตาผิงเมื่อข้าเข้าไปในกระโจม เมื่อเห็นข้า [spouse.GetSheHe] ก็ถอนหายใจเบาๆ ด้วยความตกใจพลางลดสายตาลง\n\n[spouse.GetSheHe|U] ไม่พูดอะไรขณะที่ข้าเปลื้องผ้าและวักน้ำล้างหน้า หลังจากนั้นครู่หนึ่ง ความเงียบก็หนักอึ้งเกินไป:\n\n"ข้าต้องคุยกับท่าน ยอดรัก [ROOT.Char.GetTitleAsNameNoTooltip] ของข้า" เสียงของ [spouse.GetHerHis] แผ่วเบา "ทุกคนกลัวท่าน และข้าก็ไม่ต่างจากพวกเขา" [spouse.GetSheHe] สารภาพ"
 nomad_events.0170.a: ""เจ้าคิดว่าข้า #EMP อ่อนแอ#! หรือ?""
 nomad_events.0170.b: ""ข้าปล่อยให้ความโกรธครอบงำมานานเกินไปแล้ว""
 nomad_events.0170.c: ""มันเป็นหนทางเดียว""
 dread_spouse_modifier: "เป็นที่หวาดกลัวย่อมดีกว่า"
 dread_spouse_modifier_desc: "ดีกว่าเป็นที่รัก"
 
 nomad_events.0180.t: "ข้อต่อที่อ่อนแอที่สุด"
 nomad_events.0180.desc: "ข้าได้ยินเสียงหัวเราะของ [rival.GetTitledFirstNamePossessive] ก่อนที่จะเห็น [rival.GetHerHim] [rival.GetHerHis|U] เกือบจะหันหลังให้ข้า ลมหายใจของ [rival.GetHerHis] เหม็นกลิ่น [Glossary( 'คูมิส', 'KUMIS_GLOSS')]\n\n"#EMP ใคร#! จะปกครองพวกเราเมื่อ [ROOT.Char.GetTitledFirstNameNoTooltip] จากพวกเราไปสู่สรวงสวรรค์? จะเป็น [child.GetFirstName] หรือ? แขนของ [child.GetHerHis|U] อ่อนแอเสียจน [child.GetSheHe] แทบจะไม่สามารถป้องกันไม่ให้นิ้วของ [child.GetHerHis] เองหลุดร่วงได้"\n\n"ไม่ มันจะไม่ใช่ [child.GetFirstNameNoTooltip] ผู้อ่อนหวานและว่าง่ายอย่างแน่นอน""
 nomad_events.0180.a: ""เจ้าจะ #EMP ไม่มีวัน#! พูดถึงญาติข้า เช่นนั้นอีก""
 nomad_events.0180.b: "ถึงเวลาที่ [child.GetFirstNameNoTooltip] จะต้องเรียนรู้แล้ว"
 nomad_events.0180.c: "ปล่อยให้คำพูดของ [rival.GetFirstNamePossessiveNoTooltip] หายไปกับสายลม"
 
 nomad_events.0190.t: "ครั้งกระโน้น"
 nomad_events.0190.desc: ""ท่าน [Glossary( 'รับหมวกอย่างดี', 'TAKE_HAT_GLOSS')] ท่าน [ROOT.Char.GetTitleAsNameNoTooltip] ที่ดีของข้า" [friend.GetTitledFirstName] ดึงบังเหียนม้าของ [friend.GetHerHis] และตบหัวของมันจนสงบลงพลางหัวเราะ "โอย! ใจเย็นๆ!"\n\n[friend.GetSheHe|U] หันสายตากลับมาที่ข้า "ข้าไม่อยากจะเชื่อเลยว่าท่านยังเป็นคนเดิมเหมือนเมื่อหลายปีก่อน ท่านเคยคิดหรือไม่ว่าเราจะลงเอย เช่นนี้?"\n\nขณะที่ [friend.GetSheHe] พูด ข้าก็อดที่จะยิ้มไม่ได้เมื่อนึกถึงเมื่อ [memory.GetDescription]"
 nomad_events.0190.a: ""เจ้าใกล้ชิดกับใจข้าดุจสายเลือดของข้าเอง""
 nomad_events.0190.b: ""เมื่ออยู่กับเจ้า ข้ารู้สึกสบายใจ""
 nomad_events.0190.c: ""ฮ่า! และนั่นเป็นเพียงจุดเริ่มต้นเท่านั้น!""
 nomad_events.0190.d: ""ให้ต้นไม้ทุกต้นได้ยินเรื่องราวของเรา!""
 mpo_good_memory_modifier: "หัวใจอันอบอุ่น"
 mpo_good_memory_modifier_desc: "ความทรงจำที่ดีของตัวละครนี้เติมเต็มพวกเขาด้วยความสุข"
 TAKE_HAT_GLOSS: "สำนวนมองโกเลียอ้างอิงถึงอำนาจ ความเป็นกษัตริย์"
 friend_cute_memory: "[CHARACTER.GetShortUIName] และ [TARGET_CHARACTER.GetShortUIName] รำลึกถึงความทรงจำที่ดีร่วมกัน หลายปีต่อมา"
 friend_cute_memory_corresponding: "[TARGET_CHARACTER.GetShortUIName] และ [CHARACTER.GetShortUIName] รำลึกถึงความทรงจำที่ดีร่วมกัน หลายปีต่อมา"
 
 nomad_events.0200.t: "ในความฝันของข้า"
 nomad_events.0200.desc.intro: "[courtier.GetTitledFirstName] นั่งลงข้างข้าขณะที่ข้าดื่ม [Glossary( 'โบออล', 'BOL_GLOSS')] จนหมด ด้วยสายตาของ [courtier.GetHerHis] ที่จับจ้องไปยังเปลวไฟ [courtier.GetSheHe] ก็เริ่มพูดขึ้น:\n\n"ข้าฝันเมื่อคืนนี้ เหยี่ยวขาวตัวหนึ่งบินลงมา"
 nomad_events.0200.desc.good: "จากดวงจันทร์และเกาะบนมือของท่าน มันจุดไฟเผามือท่านแล้วบินจากไป""
 nomad_events.0200.desc.bad: "จากดวงอาทิตย์และถูกสุนัขป่ากัดกิน ร่างของมันนอนจมกองเลือด""
 nomad_events.0200.desc.outro: "\n\nความร้อนจากกองไฟดูเหมือนจะเพิ่มสูงขึ้น หน้าผากของข้าชุ่มไปด้วยเหงื่อ"
 nomad_events.0200.a: ""ข้าจะลิขิตชะตาของข้าเองบนกองกระดูกที่ล้มตาย""
 nomad_events.0200.b: ""ได้โปรด เรียนรู้ความหมายของสิ่งนี้""
 nomad_events.0200.c: ""ลางร้ายมี แต่จะหล่อหลอมให้ [ROOT.Char.GetWomenMen] ดียิ่งขึ้น""
 nomad_events.0200.d: ""มันจะเป็นไปตามที่ [ROOT.Char.GetFaith.HighGodName] เรียกร้อง""
 mpo_no_omens_modifier: "ผู้ลิขิตชะตาตนเอง"
 mpo_no_omens_modifier_desc: "ตัวละครนี้ไม่ปล่อยให้ความฝันกำหนดชะตากรรมของตน"
 
 nomad_events.0210.t: "ไม่มีสิ่งใดนอกจากรากไม้"
 nomad_events.0210.desc.intro: "สุนัขเดินเพ่นพ่านไปทั่วค่าย จำนวนของพวกมันลดน้อยลง กระดูกของพวกมันมองเห็นได้ผ่านผิวหนังบางๆ แกะตัวหนึ่งล้มตายเมื่อคืนนี้ พอรุ่งเช้าก็ไม่เหลือสิ่งใดเลย\n\n"
 nomad_events.0210.desc.spouse: ""ยอดรักของข้า..." [family.GetFirstName] เข้ามาหาข้า [family.GetSheHe] กำรากไม้หนึ่งกำมือแน่น "ข้าออกหาอาหารทั้งเช้า แต่ก็ได้มาเพียงเท่านี้""
 nomad_events.0210.desc.child: ""ท่าน [ROOT.Char.GetMotherFather|U]..." [family.GetFirstName] เข้ามาหาข้า ดวงตาของ [family.GetHerHis] แดงก่ำ และมือของ [family.GetHerHis] ถือรากไม้หนึ่งกำมือ "ข้ารวบรวมสิ่งเหล่านี้มาให้ท่าน... ข้าขอโทษที่หามาได้ไม่มากกว่านี้""
 nomad_events.0210.aa: "[courtier.GetShortUINameNoTooltip] ดูดีมากเมื่อเร็วๆ นี้..."
 nomad_events.0210.a: ""ข้าไม่ต้องการความสงสารของเจ้า""
 nomad_events.0210.b.child: ""ขอบใจเจ้ามาก ลูกข้า""
 nomad_events.0210.b.spouse: ""ยอดรักของข้า...""
 nomad_events.0210.c: ""ข้าจะไม่ทนเห็นเจ้าเป็น เช่นนี้""
 nomad_events_0210_c_tt: "การใช้ [character_interaction|E] $mpo_ask_for_herd_interaction$ จะ ส่งผลให้ได้รับการบริจาค [herd|E] มากขึ้นในช่วง #value 5#! ปีข้างหน้า"
 friend_offered_roots: "[TARGET_CHARACTER.GetShortUIName] เสนอรากไม้ที่หามาได้บางส่วนเพื่อช่วย [CHARACTER.GetShortUIName] ในยามที่ [CHARACTER.GetHerHis] ต้องการ"
 friend_offered_roots_corresponding: "[CHARACTER.GetShortUIName] เสนอรากไม้ที่หามาได้บางส่วนเพื่อช่วย [TARGET_CHARACTER.GetShortUIName] ในยามที่ [TARGET_CHARACTER.GetHerHis] ต้องการ"
 
 nomad_events.0220.t: "แขนที่อ่อนแอ"
 nomad_events.0220.desc: "[spouse.GetFirstName] แคะฟันของ [spouse.GetHerHis] ด้วยเศษไม้ นอนตะแคงอยู่ [spouse.GetSheHe|U] เหลือบมองเมื่อ [spouse.GetSheHe] สังเกตเห็นว่าข้าเข้าไปในกระโจมในที่สุด\n\n"วันนี้ท่านทำอะไรมาบ้าง?" [spouse.GetSheHe] ถาม "ท่านอาจจะลูบหัวลูกแกะที่พลัดหลง หรือจูบเล็บเท้าศัตรูของท่านกระมัง?"\n\n"ข้าไม่ได้ แต่งงานเพื่อ แต่งกับกิ่งไม้ที่อ่อนแอ ท่านต้องยืนหยัดให้แข็งแกร่งดุจ [ROOT.Char.GetCurrentLocation.Custom('GetRandomAppropriateTree')] อันยิ่งใหญ่""
 nomad_events.0220.a: ""เจ้าพูดถูก เรื่องนี้ต้องจบลง""
 nomad_events.0220.b: ""ข้าจะฝึกฝนให้มากที่สุดเท่าที่จะทำได้""
 nomad_events.0220.c: ""ไม่มีประโยชน์ที่จะต่อสู้กับธรรมชาติ ข้าเป็นอย่างที่ข้าเป็น""
 
 nomad_events.0230.t: "คิดถึงบ้าน"
 nomad_events.0230.desc: "เปลือกตาของข้าหนักอึ้งเมื่อลืมตาขึ้น ไม่มีร่องรอยของแสงอรุณ เสียงสะอื้นไห้เบาๆ ของ [spouse.GetFirstNamePossessive] ปรากฏชัดเจนหลังจากที่ข้าปรับตัวเข้ากับการตื่นนอนได้แล้ว\n\n"ข้า... ข้าขอโทษ ข้าไม่ได้ตั้งใจจะรบกวนการนอนหลับของท่าน ข้าแค่... ข้าคิดถึงบ้าน มันไม่เหมือนที่นี่เลย ดินแดนของชาว [ROOT.Char.GetCurrentLocation.GetCulture.GetNameNoTooltip] จะไม่มีวันรู้สึกเหมือนชาว [spouse.GetCulture.GetNameNoTooltip]""
 nomad_events.0230.a: ""ข้ารู้ว่ารู้สึกอย่างไร""
 nomad_events.0230.b: ""ข้าจะ ทำให้ที่นี่เป็นบ้านของเจ้า""
 nomad_events.0230.c: ""เจ้าต้องทิ้งอดีตไว้เบื้องหลัง""
 lover_homesick_comfort: "[CHARACTER.GetShortUIName] ปลอบโยน [TARGET_CHARACTER.GetShortUIName] เมื่อ [TARGET_CHARACTER.GetSheHe] รู้สึกคิดถึงบ้าน"
 lover_homesick_comfort_corresponding: "[TARGET_CHARACTER.GetShortUIName] ปลอบโยน [CHARACTER.GetShortUIName] เมื่อ [CHARACTER.GetSheHe] รู้สึกคิดถึงบ้าน"
 mpo_hardened_modifier: "ปลงตก"
 mpo_hardened_modifier_desc: "ตัวละครนี้เรียนรู้ว่าความคิดถึงเป็นสิ่งที่อันตราย"
 
 nomad_events.0240.t: "แขกที่ไม่คาดคิด"
 nomad_events.0240.desc: "เสียงร้องแบะๆ ดังไม่หยุดหย่อนรอบค่าย "ทำให้พวกมันหยุดที!" ข้าได้ยิน [courtier.GetTitledFirstName] คร่ำครวญพลางลูบหน้าผากของ [courtier.GetHerHis] ด้วยสีหน้าเจ็บปวด\n\n"อา ท่าน [ROOT.Char.GetTitleAsNameNoTooltip]! ในที่สุดท่านก็มาถึง!" [courtier.GetSheHe] ยิ้มพลางชี้ไปที่ฝูงแกะที่ยืนอยู่ข้าง [courtier.GetHerHim]\n\n"ผู้คนของเราพบฝูงสัตว์ที่พลัดหลงนี้ที่ชายแดนติดกับอาณาเขตของ [ruler.GetTitledFirstNamePossessive] เรามีเหตุผลให้เชื่อว่าพวกมันเป็นของ [ruler.GetHerHim]""
 nomad_events.0240.a: ""เก็บไว้ทั้งหมด ยกเว้นตัวหนึ่ง ส่งหัวของมันไปให้ [ruler.GetFirstNameNoTooltip]""
 nomad_events.0240.b: ""ส่งพวกมันกลับไปให้ [ruler.GetShortUINameNoTooltip]""
 nomad_events.0240.c: ""ช่างเป็นวันที่โชคดีเสียนี่กระไร""
 mpo_honorable_ruler: "คนเลี้ยงแกะผู้ทรงเกียรติ"
 mpo_honorable_ruler_desc: "ตัวละครนี้ได้คืนฝูงสัตว์ที่พลัดหลงบางส่วนให้กับเจ้าของที่แท้จริง"
 house_feud_stolen_herd: "ฝูงสัตว์ที่ถูกขโมย"
 house_feud_stolen_herd_flavor: "[ROOT.Var('house_feud_attacker').Char.GetFirstName] ยกระดับความเป็นอริที่มีอยู่แล้วกับ [ROOT.Var('house_feud_victim').Char.GetFirstName] เมื่อ [ROOT.Var('house_feud_attacker').Char.GetSheHe] ขโมยฝูงสัตว์ของ [ROOT.Var('house_feud_victim').Char.GetHerHis]"
 friend_returned_herd: "[CHARACTER.GetShortUIName] พิสูจน์ความเป็นผู้ทรงเกียรติโดยการคืนฝูงสัตว์ของ [TARGET_CHARACTER.GetShortUINamePossessive]"
 friend_returned_herd_corresponding: "[TARGET_CHARACTER.GetShortUIName] พิสูจน์ความเป็นผู้ทรงเกียรติโดยการคืนฝูงสัตว์ของ [CHARACTER.GetShortUINamePossessive]"
 
 nomad_events.0250.t: "[priest.GetWomanMan|U] แห่ง [priest.GetFaith.HighGodName]"
 nomad_events.0250.desc: ""ท่านผู้ทรง [ROOT.GetCharacter.Custom('GetMongolHonorific')|U] [ROOT.Char.GetTitleAsNameNoTooltip]" เสียงแปลกประหลาดเรียกขึ้น "เป็นเวลาหลายเดือนแล้วที่ [priest.GetFaith.HighGodName] ทำให้ข้าตามหาท่าน"\n\n"ในความฝันของข้า ข้าเห็นท่านนอนลงแทบเท้าหมาป่า ท่านอ้าปากที่เปื้อนเลือด และจากปากนั้น สัญลักษณ์ของ [priest.GetFaith.ReligiousSymbol] ก็หล่นลงมา""
 nomad_events.0250.a: ""ข้าจำคำทำนายได้เมื่อได้ยิน""
 nomad_events.0250.b: ""น่าสนใจ... อยู่กับพวกเราเถิด""
 nomad_events.0250.c: ""ไร้สาระ! ข้าเนรเทศเจ้า!""
 chosen_by_the_heavens_modifier: "ผู้ถูกเลือกโดยสวรรค์"
 chosen_by_the_heavens_modifier_desc: "ตัวละครนี้เชื่อมั่นว่าตนเองถูกเลือกโดยสวรรค์ และผู้คนของพวกเขาก็เห็นด้วย"
 
 nomad_events.0260.t: "เรื่องทางศาสนา"
 nomad_events.0260.desc: ""คารวะท่าน [ROOT.Char.GetName] นามของข้าคือ [priest.GetFullName]" [priest.GetWomanMan] ผู้แปลกประหลาดโค้งคำนับต่อหน้าข้า "ข้ามาจาก [distant_realm.GetBaseName] อันห่างไกลตามคำสั่งของท่าน [other_ruler.GetLadyLord] ของข้า ท่าน [other_ruler.GetTitledFirstName]"\n\n"ตามคำขอของ [other_ruler.GetHerHis] ข้ามาที่นี่เพื่อแสดงให้ท่านเห็นถึงวิถีแห่งศรัทธาที่แท้จริง [priest.GetFaith.GetName]""
 nomad_events.0260.a: ""เจ้ากล้าดูหมิ่นศรัทธาของข้าหรือ!?""
 nomad_events.0260.b: ""ข้าต้องการทราบข้อมูลเพิ่มเติมเกี่ยวกับ [priest.GetFaith.GetNameNoTooltip]""
 nomad_events.0260.c: ""เทพเจ้าเล็กน้อยของเจ้ามิอาจเทียบได้กับ [ROOT.Char.GetFaith.HighGodName]""
 nomad_events.0260.c.tt.crit_success: "ทุกคนประทับใจ"
 nomad_events.0260.c.tt.success: "[priest.GetShortUINameNoTooltip] ประทับใจ"
 nomad_events.0260.c.tt.failure: "ท่านดูเหมือนคนโง่"
 nomad_events.0260.d: ""ออกไปให้พ้นสายตาข้า""

 mpo_nomad_events.1080.t: "ผู้สวมแคนก์"
 mpo_nomad_events.1080.desc_high_intro: "[neighbor_ruler.GetTitledFirstName] ซึ่งเยิร์ตตั้งอยู่ใน [neighbor_county.GetBaseNameNoTier] ใกล้เคียง ขี่ม้าเข้ามาในทุ่งหญ้าของข้าโดยไม่ได้รับอนุญาต และดุจหมาป่าที่เข้าใกล้เหยื่อ พลม้าของข้าก็ล้อมรอบกลุ่มติดอาวุธของ [neighbor_ruler.GetHerHis]\n\n"ท่าน [ROOT.Char.GetTitleAsNameNoTooltip] ผู้ยิ่งใหญ่!""
 mpo_nomad_events.1080.desc_low_intro: "[neighbor_ruler.GetTitledFirstName] ผู้ปกครองใน [neighbor_county.GetNameNoTier] ใกล้เคียง ขี่ม้าเข้ามาในทุ่งหญ้าของข้า พร้อมกับเสียงร้องเตือนภัยที่ดังก้อง ข้ารวบรวมเหล่า [ROOT.Char.Custom('KnightCulturePluralNoTooltipLowercase')] ของข้าและเผชิญหน้ากับกลุ่มติดอาวุธของ [neighbor_ruler.GetHerHis]\n\n"เจ้า — ท่าน [ROOT.Char.GetTitleAsNameNoTooltip]!""
 mpo_nomad_events.1080.desc_1: "ทักทาย [neighbor_ruler.GetFirstNameNoTooltip] "เรากำลังล่า"
 mpo_nomad_events.1080.criminal: "อาชญากร"
 mpo_nomad_events.1080.desc_2: "ผู้หลบหนีเข้ามาใน [ROOT.Char.GetCapitalLocation.GetTerrain.GetNameNoTooltip|l] ของท่าน แม้จะสวม [Glossary( 'คัง', 'CANGUE_GLOSS' )] แห่งการลงทัณฑ์ [escaped_warrior.GetFirstName] ผู้นี้ก็ปีนป่ายราวกับแพะ แม้จะไม่ได้นอน [escaped_warrior.GetSheHe] ก็ฉลาดกว่านักสะกดรอยของข้า"\n\n"เหยื่อของเราอยู่ในอาณาเขตของท่าน ท่าน [ROOT.Char.GetTitleAsNameNoTooltip] — ท่านจะรับหน้าที่ล่าหรือไม่?""
 CANGUE_GLOSS: "เครื่องมือลงทัณฑ์ที่ใช้ในดินแดนทุ่งหญ้าสเตปป์และเอเชียตะวันออก #G แคนก์#! คือขื่อไม้หนักที่คล้องไว้บนบ่า การแบกเป็นเวลาหลายวันหรือหลายสัปดาห์จะ ทำให้หมดแรง อับอาย ขัดขวางการเคลื่อนไหว และอาจถึงขั้นอดอาหารตายได้ เนื่องจากผู้แบกไม่สามารถป้อนอาหารให้ตนเองได้"

 mpo_nomad_events.1080.a: "ผู้หลบหนีผู้นี้ดูมีทักษะและความสามารถ..."
 mpo_nomad_events.1080.a.flavor: "พละกำลังของ [escaped_warrior.GetFirstNamePossessiveNoTooltip] จะไม่เน่าเปื่อยไปภายใต้ #EMP แคนก์#! ไม่เลย มันจะเสริมความแข็งแกร่งให้กับกองทัพของข้า!"
 mpo_nomad_events.1080.b: "ไล่ [neighbor_ruler.GetFirstNameNoTooltip] ไปด้วยพายุลูกธนู"
 mpo_nomad_events.1080.b.flavor: "ผู้ลี้ภัยหรือไม่ก็ตาม [neighbor_ruler.GetTitleAsNameNoTooltip] ได้บุกรุกเข้ามาที่นี่ — และควรถูกส่งตัวหนีไปด้วยความเจ็บปวด!"
 mpo_nomad_events.1080.c: "เราจะไล่ล่าแพะหลงฝูงตัวนั้นลงมา"
BOUND_TO_FAMILY_WIDOW: "ท่านสาบานว่าจะดูแลแม่ม่ายของสมาชิกในครอบครัวของท่าน"


 ranged_and_searched_modifier: "ออกตระเวนและค้นหา"
 ranged_and_searched_modifier_desc: "กลุ่มขี่ม้าได้เดินทางไปทั่วทุกหุบเขา โพรง และยอดเขา... และในการทำ เช่นนั้นได้เปิดเผยทุ่งหญ้าที่กำบังและที่ซ่อนตัว"
 family_widow_cant_divorce_tt: "@alert_icon! #alert_trial ท่านไม่สามารถ [divorce|E] [widow.GetFirstName] ได้เป็นเวลา #high 10 ปี#!#!"
 family_widow_cant_dismiss_tt: "@alert_icon! #alert_trial ท่านไม่สามารถไล่ [widow.GetFirstName] ออกไปได้เป็นเวลา #high 10 ปี#!#!"
family_widow_seduce_romance_bonus_tt: "เมื่อมุ่งเป้าไปที่ [widow.GetFirstName] ด้วย [schemes|E] [GetScheme('seduce').GetTypeName] หรือ [GetScheme('courting').GetTypeName]: #P +20#! [success_chance|E]"
scheme_family_widow_seduce_romance: "ช่วยข้าให้พ้นจากความเป็นม่าย: $VALUE|0=-+$"
inspired_in_wifely_duties_modifier: "เป็นที่รักและเป็นแรงบันดาลใจ"
inspired_in_wifely_duties_modifier_desc: "สตรีผู้นี้บริหารครัวเรือนของตนด้วยความทุ่มเทอย่างแข็งขัน เพราะนางรู้ดีถึงความรักและความภักดีของญาติฝ่ายสามี"
concubine_lavished_attention_modifier: "ได้รับการปรนนิบัติอย่างฟุ่มเฟือย"
concubine_lavished_attention_modifier_desc: "สตรีผู้นี้เคยรู้จักความทุ่มเทของผู้ปกครองและความหรูหราทั้งปวงที่มาพร้อมกัน"
 truce_family_widow: "\nการพักรบที่ตกลงกันเมื่อ [ROOT.Char.GetShortUIName] แต่งงานกับแม่ม่าย [widow.GetShortUIName]"

mpo_nomad_events.1091.t: "ชะตาของแม่ม่าย"
mpo_nomad_events.1091.desc: "[ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('dead_husband'))|l] ของข้าตายแล้ว [dead_husband.GetFirstName] จากไปกับสายลม [widow.GetName] แม่ม่ายของ [dead_husband.GetHerHis|U] ซึ่งเป็นส่วนหนึ่งของครอบครัวเรานับตั้งแต่ [widow.GetSheHe] เข้ามาในเยิร์ตของ [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('dead_husband'))|l] ของข้าเป็นครั้งแรก กำลังโศกเศร้าและร่ำไห้\n\nหัวใจของ [widow.GetFirstNamePossessiveNoTooltip|U] อาจเป็นของตระกูล [ROOT.Char.GetHouse.GetName] แต่สถานที่ของ [widow.GetHerHis] กับเรา การคุ้มครองของ [widow.GetHerHis] บัดนี้ขึ้นอยู่กับข้า... ขึ้นอยู่กับหน้าที่ของข้าที่จะต้องรับสิ่งที่ [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('dead_husband'))|l] ของข้าได้ทิ้งไว้เบื้องหลัง\n\n"
mpo_nomad_events.1091.desc.marry: "ธรรมเนียมของเรากำหนดให้ข้า แต่งงานกับ [widow.GetTitledFirstNameNoTooltip] แม่ม่ายของ [dead_husband.GetHerHis]"
mpo_nomad_events.1091.desc.concubine: "ธรรมเนียมของเรากำหนดให้ข้ารับ [widow.GetTitledFirstNameNoTooltip] แม่ม่ายของ [dead_husband.GetHerHis] มาเป็นภรรยาน้อยของข้า"
mpo_nomad_events.1091.a: "#EMP ในที่สุด ― [widow.GetSheHe] ก็เป็นของข้า!#!"
mpo_nomad_events.1091.a.flavor: "ภรรยาของ [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('dead_husband'))|l] ของข้า #EMP เทพธิดา#! สมควรได้รับการอุทิศตนทุกเศษเสี้ยวและทุกหยาดหยดจากข้า"
mpo_nomad_events.1091.b: "การ แต่งงานของเราจะ ทำให้ [widow_relative.GetTitledFirstNameNoTooltip] พอใจ..."
mpo_nomad_events.1091.b.flavor: "...และข้าด้วย การ แต่งงานครั้งนี้จะให้ประโยชน์แก่ข้าเป็นอย่างดี"
mpo_nomad_events.1091.c: "ข้าจะมีของดีๆ #EMP ทั้งหมด#! ของ [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('dead_husband'))|l] ของข้า ใช่แล้ว"
mpo_nomad_events.1091.d: "ครอบครัวของข้าปกป้องพวกพ้องของตนเสมอ"
mpo_nomad_events.1091.e: "เจ้าจงไปขอทานกับเหล่าสุนัขเสียเถิด [widow.GetWomanMan]"

 mpo_nomad_events.1100.t: "ทุ่งหญ้าแห่ง [capital_province.GetTitle.GetNameNoTierNoTooltip]"
 mpo_nomad_events.1100.desc: "ฝูงปศุสัตว์ คนเลี้ยงแกะ และพลม้าที่ทำหน้าที่อย่างขยันขันแข็งท่องไปใน [capital_province.GetTerrain.GetNameNoTooltip|l] รอบๆ เยิร์ตใหญ่ของข้า เรากำลังใช้ดินแดนนี้ [capital_province.GetTitle.GetNameNoTier] ทุกพุ่มไม้เตี้ยแคระแกร็นและทุกใบหญ้าที่มี\n\n"
 mpo_nomad_events.1100.desc.camel: "แต่ในความแห้งแล้งและความร้อน มีพืชพรรณเติบโตเพียงเล็กน้อย ในบรรดาสัตว์สี่ชนิดในฝูงของเรา มีเพียงชนิดเดียวที่เมินเฉยต่อความว่างเปล่าและส่งเสียงร้องต้องการจะท่องไปใน [capital_province.GetTerrain.GetNameNoTooltip|l] — นั่นคืออูฐ\n\nขณะที่สัตว์อื่นๆ ของเราเล็มหญ้าในจุดที่ดีที่สุด เหล่าอูฐก็ท่องไปทั่ว [capital_province.GetTitle.GetNameNoTierNoTooltip]"
 mpo_nomad_events.1100.desc.sheep: "พื้นดินที่นี่แห้งแล้งและเต็มไปด้วยหิน อาหารหยาบๆ ของมันไม่ถูกปากม้าและวัวของเรา แต่สำหรับแกะและแพะ — นี่คือสวรรค์\n\nนมและขนสัตว์มีให้แก่เหล่า [ROOT.Char.GetCulture.GetCollectiveNoun] ของข้าอย่างอุดมสมบูรณ์"
 mpo_nomad_events.1100.desc.hunting: "แต่ที่นี่พืชพรรณขึ้นสูงเกินไป: มีทุ่งหญ้าเปิดโล่งเพียงเล็กน้อย ปศุสัตว์ของเราผอมโซ ขณะที่เหล่า [ROOT.Char.GetCulture.GetCollectiveNoun] ของข้าหันไปพึ่งคันธนูและนกล่าเหยื่อเพื่อยังชีพ\n\nเราค้าขายหนังงกวางแทนขนแกะ"
 mpo_nomad_events.1100.desc.horses: "ด้วยพระประสงค์แห่ง [ROOT.Char.GetFaith.HighGodNamePossessive] สถานที่ เช่นนี้จึงถูกจัดไว้สำหรับม้า: ทะเลหญ้าอันสงบ ที่ ซึ่งขาอันรวดเร็วและจิตวิญญาณอันสูงส่งรับใช้พาหนะของเราจนเป็นที่พอใจ\n\nณ ที่แห่งนี้ เหล่า [ROOT.Char.GetCulture.GetCollectiveNoun] ของข้าเลี้ยงดูอาชาของตนจนอ้วนพีและมีความสุขถ้วนหน้า"
 mpo_nomad_events.1100.a: "ณ ที่ใดมี [capital_province.GetTerrain.GetNameNoTooltip|l] เราคือเจ้าแห่งที่นั่น"
 mpo_nomad_events.1100.a.flavor: "การรู้จักสถานที่คือการรู้จักความอุดมสมบูรณ์ทั้งหมดที่มันมอบให้ ทั้งที่เปิดเผยและที่ซ่อนเร้น"
 mpo_nomad_events.1100.b: "ผู้คนของข้าไม่รักสถานที่แห่งนี้"
 mpo_nomad_events.1100.c.camel: "จงแลกสัตว์อื่นเป็นอูฐ!"
 mpo_nomad_events.1100.c.sheep: "ฤดูตกลูกแกะอันดีงามกำลังจะมาถึง"
 mpo_nomad_events.1100.c.hunting: "ณ ที่แห่งนี้ เราล่าหรือเราอดตาย"
 mpo_nomad_events.1100.c.horse: "ดินแดนสำหรับอาชา"

