 nomad_events.ill_advised.header: "คำแนะนำอันมิชอบ"
 nomad_events.0001.t: "$nomad_events.ill_advised.header$?"
 nomad_events.0001.desc: "เสียงย่ำเท้าอันหนักหน่วงและอึกทึกทำลายความเงียบงันยามค่ำคืน\n\n"ท่านต้องเห็น เช่นกันเป็นแน่, [ROOT.Char.Custom('FormOfAddressForLiege')]" [jealous_courtier.GetFirstName] [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('jealous_courtier'))|l] ของข้าตำหนิ ขณะที่ [jealous_courtier.GetSheHe] เข้ามาในเกอร์ (ger) ของข้า, "[achmach_scope.GetTitledFirstName] ทำงานของตนได้ยอดเยี่ยมเกินไปหน่อย [achmach_scope.GetSheHe|U] พูดมากเกินไป, ได้รับการสนับสนุนมากเกินไป, เข้าออกบ่อยเกินไป ทุกอย่างดูเหมือนจะเข้าทาง [achmach_scope.GetHerHis] ไปเสียหมด"\n\nดวงตาของ [jealous_courtier.GetFirstNamePossessiveNoTooltip] หรี่ลง, "จะเป็นไปได้หรือไม่, ท่าน [ROOT.GetCharacter.Custom('GetMongolHonorific')] [ROOT.Char.GetTitleAsNameNoTooltip] ของข้า, ว่า [achmach_scope.GetSheHe] กำลังใช้... ศาสตร์มืดบางอย่าง เพื่อให้ได้สิ่งที่ [achmach_scope.GetSheHe] ต้องการ?""
 nomad_events.0001.a: "[achmach_scope.GetSheHe|U] ออกไปแล้ว"
 nomad_events.0001.b: "เป็นเพียงคำพูดของคู่แข่งที่อิจฉาริษยา"
 achmach_firing_tt: "@alert_icon! [achmach_scope.GetShortUIName] ไม่สามารถจ้างได้อีกเป็นเวลา 5 ปี#!"
 
 nomad_events.0002.t: "$nomad_events.ill_advised.header$: คำถาม"
 nomad_events.0002.desc.calm: ""โปรดกล่าวตามสัตย์เถิด ท่าน [ROOT.GetCharacter.Custom('GetMongolHonorific')] [ROOT.Char.GetTitleAsNameNoTooltip]," [achmach_scope.GetTitledFirstName] ยืนกราน, พลางลดสุรเสียง [achmach_scope.GetHerHis] ลงจนแทบจะแยกไม่ออกจากเสียงประทุของกองไฟ "ข้าทำสิ่งใดผิดพลาดไปหรือ? ข้า ทำให้ท่านผิดหวังได้อย่างไร?"""
 nomad_events.0002.desc.angry: ""[achmach_scope.Custom('EyeEyes')] ของข้ามิอยากเชื่อเลยว่า [ROOT.Char.GetTitleAsNameNoTooltip] ผู้น่าเกรงขามของเราจะถูกหลอกลวงถึงเพียงนี้" [achmach_scope.GetTitledFirstNameNoTooltip] พูดเสียงสั่น, พลางเบือนใบหน้า [achmach_scope.GetHerHis] หนีจากกองไฟ "หากผู้ปกครอง เช่นท่านจักรับฟังข่าวลือ ข้าก็หวังว่าท่านจะแน่ใจได้ว่าข่าวลือใดเป็นความจริง""
 nomad_events.0002.desc.fallback: ""ข้าจะไม่ถามว่าเหตุใด ท่าน [ROOT.Char.GetTitleAsNameNoTooltip] ผู้น่าสะพรึงกลัวของข้า ข้าจึงถูกย้ายออกจากข้างกายท่าน แต่ข้าจะเตือนท่านบางอย่าง" [achmach_scope.GetTitledFirstNameNoTooltip] หันมาหาข้าหลังจากดื่ม [Glossary( 'คูมิส', 'KUMIS_GLOSS')] ของ [achmach_scope.GetHerHis] แล้ว"
 nomad_events.0002.desc.outro: "\n\n"เพียงแค่ครุ่นคิดสักครู่ และสงสัย... มีเหตุผลใดที่ [jealous_courtier.GetTitledFirstName] จะพูดจาว่าร้ายข้า? บางทีอาจมีใครบางคนกำลังพยายามกีดกันท่านออกจากผู้ที่ดูแลท่านมากที่สุด""
 nomad_events.0002.a: ""ข้าเสียใจที่ผลักไสเจ้าออกจากข้างกายข้า""
 nomad_events.0002.b: ""ข้าตัดสินใจแล้ว""
 
 nomad_events.0003.t: "$nomad_events.ill_advised.header$: ที่ใดมีควัน ที่นั่นมีไฟ"
 nomad_events.0003.desc.intro: "เตาไฟเหลือ แต่เถ้าถ่านเกือบทั้งหมดแล้วในยามนี้ บทสนทนาที่เมามายเงียบลงเรื่อยๆ ก่อนจะดังขึ้นอีกครั้ง [jealous_courtier_2.GetFirstName] [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('jealous_courtier_2'))|l] ของข้าเข้ามาหาข้าอย่างไม่ค่อยแนบเนียนนัก\n\n"
 nomad_events.0003.desc.rehired: ""ความเมตตาของท่านช่างยิ่งใหญ่นัก ท่านผู้ทรง [ROOT.GetCharacter.Custom('GetMongolHonorific')] [achmach_scope.GetTitledFirstName] คงต้องใช้อสูรร้ายทรงพลังเป็นแน่แท้จึงหลอกลวงท่านได้ถึงเพียงนี้""
 nomad_events.0003.desc.not_rehired: ""แม้จะผลักไส [achmach_scope.GetTitledFirstName] ออกจากข้างกายท่านแล้ว ข้าก็ยังเกรงว่าแผนการของ [achmach_scope.GetHerHis] จะยังไม่หยุดยั้ง""
 nomad_events.0003.desc.outro: "\n\n"ความเจ็บปวดที่ [achmach_scope.GetHerHim] สร้างขึ้นดูเหมือนจะไม่มีวันสิ้นสุด!" [jealous_courtier_2.GetSheHe] ถอนหายใจเสียงดัง "ไม่ต้องสงสัยเลยว่า [achmach_scope.GetSheHe] กระซิบคาถาต้องห้ามและมนตร์อันตราย เพราะเหล่า [dummy_attracted_gender.GetWomenMen] ของเราทุกคนต่างหนีไปสู่อ้อมแขนของ [achmach_scope.GetHerHis] หมดแล้ว!""
 nomad_events.0003.a: "ข้าเห็นด้วยอย่างยิ่งว่าเหตุใด..."
 nomad_events.0003.b: "เรื่องนี้จบแล้ว"
 nomad_events.0003.c: "#EMP ฮ่า ฮ่า ฮ่า!#!"
 nomad_events_0003_b_tt: "ธรรมชาติที่โลเลของท่านถูกมองในแง่ลบ"
 mpo_assertion_modifier: "ผู้นำผู้ปกป้อง"
 mpo_assertion_modifier_desc: "ตัวละครนี้ยืนยันอำนาจของตนเหนือที่ปรึกษาเจ้าชู้"
 nomad_events_0003_a_tt: "[scheme|E] ของท่านเริ่มต้นด้วยความคืบหน้าที่สูงขึ้นและ [modifier|E] [GetModifier('extra_success_chance_modifier').GetNameWithTooltip]"
 
 nomad_events.0004.opening: "ถึง [ROOT.Char.GetTitleAsNameNoTooltip] ผู้ทรงเมตตาที่สุด"
 nomad_events.0004.desc: "ข้าขอวิงวอนให้ท่านโปรดรับของขวัญอันต่ำต้อยนี้ที่ข้าได้รวบรวมมาด้วยความพยายามอย่างยิ่งยวด\n\nขอบพระคุณสำหรับความไว้วางใจอันยิ่งใหญ่ที่ท่านมีให้ข้า"
 nomad_events.0004.a: "ช่างเป็นรายละเอียดที่น่ารักเสียนี่กระไร"
 
 nomad_events.0005.desc: "เหล่าอีแร้งจะมาฉีกทึ้งเจ้าจนเปลือยเปล่า\n\nพึงระวัง"
 nomad_events.0005.a: "นี่มันอะไรกัน...?"
 nomad_events_0005_tt: "ท่านสามารถใช้ [character_interaction|E] $interrogate_interaction$ กับ [achmach_scope.GetShortUIName], [jealous_courtier.GetShortUIName] และ [jealous_courtier_2.GetShortUIName] ได้แล้ว"
 nomad_events_0005_tt_only_one: "ท่านสามารถใช้ [character_interaction|E] $interrogate_interaction$ กับ [achmach_scope.GetShortUIName] และ [jealous_courtier.GetShortUIName] เพื่อค้นหาความหมายของจดหมายลึกลับได้แล้ว"
 
 nomad_events.0006.t: "$nomad_events.ill_advised.header$: การสอบสวน"
 nomad_events.0006.desc.achmach: "กระโจมของ [recipient.GetTitledFirstNamePossessive] มืดเสียจนยากที่จะมองเห็นโดยไม่หรี่ตา [recipient.GetFirstNameNoTooltip] พักผ่อนอยู่บนเบาะ [ROOT.Char.Custom('GetSimpleColor')]\n\n"อา ท่านผู้ทรง [ROOT.GetCharacter.Custom('GetMongolHonorific')] เหตุใดท่านจึงประทานพรแก่ข้า เช่นนี้?""
 nomad_events.0006.desc.courtier: "[recipient.GetTitledFirstName] พักผ่อนอยู่บนเตียงของ [recipient.GetHerHis] จิบ [Glossary( 'โบออล', 'BOL_GLOSS')] อย่างสงบ\n\n"ท่านผู้ทรง [ROOT.GetCharacter.Custom('GetMongolHonorific')|U]!" [recipient.GetSheHe] ลุกขึ้นทันทีเมื่อข้าเข้าไป และยื่นชามของ [recipient.GetHerHis] ให้ข้า: "โปรดเถิด ข้าต้องสอบถามว่าเหตุใดท่านจึงมาเยี่ยมข้า""
 nomad_events.0006.desc.courtier_2: "[recipient.GetTitledFirstName] [recipient.Custom('quirk_pos_present')] ขณะที่ข้าเข้าไปในกระโจมของ [recipient.GetHerHis] กลิ่นหญ้าสดใหม่ยังคงติดอยู่ที่เสื้อผ้าของ [recipient.GetHerHis]\n\n"ท่าน [ROOT.GetCharacter.Custom('GetMongolHonorific')] [ROOT.GetCharacter.GetLadyLord] ของข้า! โปรดบอกข้าเถิด ข้าจะรับใช้ท่านได้อย่างไร?""
 nomad_events.0006.desc.calm: "\n\nข้ายื่นสาส์นให้ [recipient.GetHerHim] รอคอยคำอธิบาย"
 nomad_events.0006.desc.fallback: "\n\nข้าโยนสาส์นไปที่เท้าของ [recipient.GetHerHis] เรียกร้องคำอธิบาย"
 nomad_events.0006.desc.achmach_outro: "\n\n"อา ข้าเห็นแล้วว่าสาส์นของข้าถึงท่านแล้ว ข้าเคยเตือนท่านแล้ว ท่านผู้น่าเกรงขาม ข้าสามารถปล่อยให้สุนัขอดอยากจนพวกมันเดินไม่ได้อีกต่อไป เพื่อที่พวกมันจะได้ไม่กัดนายของมัน""
 nomad_events.0006.desc.courtier_outro: "\n\n"แน่นอน ท่านคงไม่เชื่อว่านั่นหมายถึงข้ากระมัง ท่าน [ROOT.Char.GetTitleAsNameNoTooltip] ของข้า ข้าเพียงแค่พยายามปกป้องท่านเท่านั้น!""
 nomad_events.0006.desc.courtier_outro_2: "\n\n[recipient.GetFirstNameNoTooltip] เกาต้นคอของ [recipient.GetHerHis] อย่างกระวนกระวายก่อนจะยืนกรานว่า: "ข้าไม่มีส่วนเกี่ยวข้องกับเรื่องนั้น""
 nomad_events.0006.a: "ข้าจะรีดความจริงจากเจ้าเหมือนรีดนมจากแม่ม้า"
 nomad_events.0006.b: "สาส์นนั้นเกี่ยวกับมนตร์ดำอย่างชัดเจน"
 nomad_events.0006.c: "เหตุใดเจ้าจึงดูกระวนกระวาย เช่นนี้?"
 nomad_events.0006.d: "จงเปลี่ยนศัตรูของข้าให้เป็นซากศพ"
 nomad_events.0006.e: "เจ้าเชื่อถือไม่ได้"
 nomad_events.0006.f: "ข้าเชื่อว่ามันไม่ได้หมายถึงเจ้า"
 bol: "โบล"
 BOL_GLOSS: "เครื่องดื่มหมักที่ทำจากน้ำผึ้ง คล้ายกับเหล้าน้ำผึ้ง (mead)"
 nomad_events_0006_d_tt: "[schemes|E] [GetScheme('murder').GetTypeName] ทั้งหมดของท่านจะมี [success_chance|E] สูงขึ้นตราบใดที่ [achmach_scope.GetShortUIName] ยังเป็น [councillor|E] ของท่าน"
 nomad_events_0006_c_success_info: "ท่านค้นพบสาเหตุของความไม่สบายใจ"
 nomad_events.0006.c.success: "[recipient.GetShortUIName] สารภาพ"
 nomad_events_0006_c_success_loyal: "พวกเขาเพียงแค่อิจฉา"
 nomad_events_0006_c_success_disloyal: "พวกเขาเห็นพิธีกรรมมืด"
 nomad_events.0006.c.failure: "เจตนาของ [recipient.GetShortUINamePossessive] ยังคงไม่ชัดเจน"
 
 ACHMACH_MURDER_BONUS: "คำสัญญาของที่ปรึกษาผู้มีทักษะ"
 
 nomad_events.0007.t: "$nomad_events.ill_advised.header$: เขากวางหัก"
 nomad_events.0007.desc.imprisoned: "มีคนน้อยนักที่เข้าใกล้นักโทษ การไม่มีเตาผิง ทำให้พวกเขาสั่นสะท้าน แต่เมื่อข้าเข้าไปใกล้ ข้าสังเกตเห็นว่า [achmach_scope.GetTitledFirstName] ไม่อยู่ที่ใดเลย"
 nomad_events.0007.desc.fallback: "ข้าเห็น [achmach_scope.GetTitledFirstName] ขอตัว [achmach_scope.GetHerselfHimself] ออกจากวงสุราและการต่อสู้ เร็วกว่าปกติมาก [achmach_scope.GetSheHe|U] เดินผ่านกระโจมของ [achmach_scope.GetHerHis] และมุ่งหน้าไปยังถิ่นทุรกันดาร"
 nomad_events.0007.desc.outro: "\n\nเสียงแตกหักฉับพลัน ทำให้ง่ายต่อการตามรอยเท้าของ [achmach_scope.GetHerHis] และข้าพบ [achmach_scope.GetHerHim] หมอบอยู่บนพื้น เงายาวของ [achmach_scope.GetHerHis] ทอดทับเครื่องมือบางอย่าง\n\n[achmach_scope.GetSheHe|U] หักเขากวางราวกับกิ่งไม้ที่เปราะบาง เศษเสี้ยวของมันกระเด็นไปทุกทิศทาง"
 nomad_events.0007.aa: "ข้ารู้อยู่แล้ว! [achmach_scope.GetSheHe|U] ต่อต้านข้า! ทุกคนต่อต้านข้า!"
 nomad_events.0007.a: "#EMP ฮ่า!#! ข้าเห็นเรื่องแบบนี้มาเป็นล้านครั้งแล้ว"
 nomad_events.0007.b: "เจ้ากำลังทำอะไร #EMP กันแน่#!?"
 nomad_events.0007.b.success: "ท่านแน่ใจในเจตนาของ [achmach_scope.GetShortUINamePossessive]"
 nomad_events.0007.b.failure: "เจตนาของ [achmach_scope.GetShortUINamePossessive] ยังคงไม่แน่นอนสำหรับท่าน"
 nomad_events.0007.c: "บอกความจริงข้ามา #EMP เดี๋ยวนี้#!."
 nomad_events_0007_b_success_info: "ท่านจะค้นพบธรรมชาติที่แท้จริงของพิธีกรรม"
 
 nomad_events.0008_0009.desc.intro: "ควันลอยออกมา ซีดขาวราวเนื้อศพ [achmach_scope.GetTitledFirstName] ร่ายคาถา จากนั้นก็เปล่งเสียงดังขึ้น [achmach_scope.GetSheHe] กล่าวว่า:\n\n"
 nomad_events.0008.t: "$nomad_events.ill_advised.header$: ความโปรดปรานแห่งสวรรค์"
 nomad_events.0008.desc: "$nomad_events.0008_0009.desc.intro$"ขอความโปรดปรานแห่ง [achmach_scope.GetFaith.HighGodName] คุ้มครองท่าน [ROOT.GetCharacter.Custom('GetMongolHonorific')] [ROOT.Char.GetTitleAsNameNoTooltip], [ROOT.Char.Custom('FormOfAddressForLiege')] ขอให้เหล่าศัตรูของ [ROOT.Char.GetHerHis] ร่วงหล่นสู่พื้นดั่งศิลาจากขุนเขาสูง"\n\n[achmach_scope.GetSheHe|U] หันกลับมาและเห็นข้า, [ROOT.Char.Custom2('QuirkPPPosOrNeg', SCOPE.sC('achmach_scope'))], "ท่าน [ROOT.GetCharacter.Custom('GetMongolHonorific')|U], ท้องฟ้าจะปกป้องท่านบัดนี้" [achmach_scope.GetSheHe] อธิบาย, พลางยื่นเครื่องรางที่ทำจากเขากวางให้ข้า"
 nomad_events.0008.a: "เทพ [achmach_scope.GetFaith.HighGodName] ที่เจ้าพูดถึง... บอกข้าเกี่ยวกับพวกเขาเพิ่มเติม"
 nomad_events.0008.b: "ข้าจะสวมสิ่งนี้เสมอ"
 nomad_events.0008.c: "นี่เป็นงานที่น่าประทับใจมาก! โปรดจงมุ่งเน้นไปที่มันเถิด"
 magic_amulet: "เครื่องรางคุ้มครอง"
 magic_amulet_desc: "เขากวางที่แตกหัก เปียกชุ่มด้วยเลือด ปลายเขาถูกเผาไหม้"
 nomad_events_0008_b_tt: "ให้สิทธิ์เข้าถึง [decision|E] $pray_to_protective_amulet_decision$ ตราบใดที่ [artifact|E] [newly_created_artifact.GetName] ยังคงสวมใส่อยู่"
 pray_to_protective_amulet_decision: "สวดอ้อนวอนต่อ $magic_amulet$"
 pray_to_protective_amulet_decision_desc: "เครื่องรางที่อุทิศเพื่อการคุ้มครอง"
 pray_to_protective_amulet_decision_confirm: "สวดอ้อนวอน"
