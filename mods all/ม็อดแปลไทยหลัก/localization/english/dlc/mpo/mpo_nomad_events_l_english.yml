 nomad_events.0100.t: "ไม่ใช่ฝูงสัตว์ของข้า"
 nomad_events.0100.desc: ""ท่านเชื่อเรื่องนี้ได้หรือไม่, [ROOT.Char.GetTitleAsNameNoTooltip]!?" [vassal_1.GetTitledFirstName] ควบม้ามาทางข้า "ไอ้ [vassal_2.Custom2('InsultAdjective', SCOPE.sC('vassal_1'))] [vassal_2.GetFirstName] นั่นขโมยสัตว์ของข้าไปบางส่วนเมื่อคืน, มันลอบเร้นเข้าไปในคอกดั่งหนอนไชผ่านรอยแยก"\n\n"ข้าขอเรียกร้องให้ส่งคืนทั้งหมดที่ถูกขโมยไป, มิฉะนั้นข้าจะยึดพวกมันกลับมาเอง""
 nomad_events.0100.aa: ""ข้าคิดว่าพวกนั้นเป็นของข้า""
 nomad_events.0100.a: ""[vassal_2.GetTitledFirstNameNoTooltip] จะต้องคืนฝูงสัตว์""
 nomad_events.0100.b: ""ข้าไม่เชื่อคำกล่าวหาเหล่านี้""
 nomad_events.0100.c: ""เจ้ามารบกวน [ROOT.Char.GetTitleAsNameNoTooltip] ของเจ้าด้วยเรื่องไร้สาระ เช่นนี้หรือ?""
