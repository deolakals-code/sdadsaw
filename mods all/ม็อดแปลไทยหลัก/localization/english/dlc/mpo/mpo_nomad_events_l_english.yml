 lover_evening_ride_corresponding: "[TARGET_CHARACTER.GetShortUIName|U] และ [CHARACTER.GetShortUIName] ร่วมขี่ม้ายามเย็นอันแสนโรแมนติก"
 friend_evening_ride: "[CHARACTER.GetShortUIName|U] และ [TARGET_CHARACTER.GetShortUIName] ผูกมิตรกันระหว่างการขี่ม้ายามเย็น"
