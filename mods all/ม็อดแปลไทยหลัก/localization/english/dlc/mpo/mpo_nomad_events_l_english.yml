 nomad_events.0010.t: "$nomad_events.ill_advised.header$: กริชในความมืด"
 nomad_events.0010.desc.intro: "ข้าฝันถึงท้องฟ้าอันไร้ขอบเขต หมู่เมฆหมุนวน หายลับไป ฝน และฟ้าร้องที่ไม่สิ้นสุด ข้ารู้สึกถึงหยดน้ำบนหน้าอกและความหนาวเย็นปลุกข้าให้ตื่น\n\n"
 nomad_events.0010.desc.loyal: "ร่างคลุมหน้าคลุมตายืนอยู่เหนือข้า มีดจ่ออยู่ที่คอข้า\n\n"ลงไป!" [achmach_scope.GetTitledFirstName] ผลักพวกเขาออกไปจากข้า และพวกเขาก็ร้องครางเมื่อหลังกระแทกกำแพง"
 nomad_events.0010.desc.disloyal: "[achmach_scope.GetTitledFirstName] ยืนอยู่เหนือข้า มีดจ่ออยู่ที่คอข้า ข้าผลัก [achmach_scope.GetHerHim] ลง แต่ [achmach_scope.GetSheHe] ก็ลุกขึ้นแทบจะในทันที"
