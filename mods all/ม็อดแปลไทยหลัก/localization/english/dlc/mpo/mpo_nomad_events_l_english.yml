 nomad_events.0009.desc: "$nomad_events.0008_0009.desc.intro$"ขอให้พระพิโรธแห่ง [achmach_scope.GetFaith.HighGodName] ตกอยู่กับ [ROOT.Char.GetTitledFirstNameNoTooltip] ผู้ไม่คู่ควร ขอให้ชีวิตของ [ROOT.Char.GetHerHis] สั้นและเต็มไปด้วยความเจ็บปวด"\n\n[achmach_scope.GetSheHe|U] หันกลับมาและเห็นข้า มือของ [achmach_scope.GetHerHis] กำเครื่องรางไว้ที่หน้าอกทันทีเพื่อป้องกันตัว"
