l_english: 
 feast_type_tsagaan_sar: "ซากาน ซาร์"
 feast_type_tsagaan_sar_desc: "$EFFECT_LIST_BULLET$ การอวยพรส่งท้ายเป็นวาระแห่งการรับของกำนัล อาทิ [herd|E] และ [gold|E]\n$EFFECT_LIST_BULLET$ นานาเหตุการณ์จักอำนวยโอกาส เพื่อให้ได้มา ซึ่ง [opinion|E]\n$EFFECT_LIST_BULLET$ ทางเลือกบางประการจักเอื้อให้เกิดการลด [stress|E]\n\n#weak จันทร์ขาวดวงใหม่ได้ปรากฏขึ้น - และเราต่างปรีดาปราโมทย์!#!"
 feast_type_tsagaan_sar_valid_tt: "ท่านได้เป็นเจ้าภาพจัดงาน ซากาน ซาร์ [GetActivityType('activity_feast').GetName] ภายในรอบ 5 ปีที่ล่วงมานี้"
 feast_type_tsagaan_sar_valid_tt_time: "งาน ซากาน ซาร์ จักสามารถจัดขึ้นได้เพียงตั้งแต่เดือนมกราคมจนถึงเดือนมีนาคม"

  # Events
 feast_tsagaan_sar_events.0001.t: "ค่ำคืนเบื้องหน้า"
 feast_tsagaan_sar_events.0001.desc: "เหล่าอาชามาชุมนุมกันนอกกระโจมในค่ายพัก เหล่าผู้ขี่ม้าต่างลูบไล้พวกมันเป็นครั้งสุดท้ายก่อนจะแยกย้ายไปสังสรรค์กับผู้อื่น เหล่าเยาวชนวิ่งเล่นหยอกล้อ เล่นไล่จับและแกล้งหยอกผู้หลักผู้ใหญ่ ทุกคนล้วน แต่งกายด้วยอาภรณ์สีขาวผ่อง เสื้อคลุมของพวกเขาถูกเย็บขึ้นใหม่ เฉก เช่นเดียวกับปีใหม่ที่มาถึง\n\nขณะที่เหล่า [ROOT.Char.Custom('GetWomenOrMenBasedOnFaith')] กำลังหยอกล้อปล้ำสู้กัน บรรยากาศกลับอบอวลด้วยความสงบสุข: การทะเลาะวิวาทเล็กๆ น้อยๆ และการพนันของพวกเขากลับเสริมสร้างความเป็นพี่น้องให้แน่นแฟ้นยิ่งขึ้น เหล่า [ROOT.Char.Custom('GetWomenOrMenBasedOnFaithOpposite')] เตรียมโต๊ะสำหรับงานเลี้ยง และกลิ่นเนื้อแกะก็โชยมาแตะจมูกข้า\n\nงานเลี้ยงนี้จักเป็นที่จดจำไปอีกนาน — ตราบเท่าที่ข้าใส่ใจกับ..."
 feast_tsagaan_sar_events.0001.a: "...หีบเหรียญกษาปณ์ที่ข้าจักได้รับ"
 feast_tsagaan_sar_events.0001.a_tt: "ท่านจักมีโอกาสได้รับ [gold|E] จากแขกเหรื่อมากขึ้น"
 feast_tsagaan_sar_events.0001.b: "...ของกำนัลเล็กน้อยใดๆ ที่ข้าได้รับ และเรื่องราวที่ของเหล่านั้นบอกเล่า"
 feast_tsagaan_sar_events.0001.b_tt: "ท่านจักมีโอกาสได้รับ [artifacts|E] จากแขกเหรื่อมากขึ้น"
 feast_tsagaan_sar_events.0001.c: "...เหล่าแขกเหรื่อ งานเลี้ยงคงไร้ความหมายหากขาดพวกเขา"
 feast_tsagaan_sar_events.0001.c_tt: "ท่านจักมีโอกาสได้รับ [hook|E] จากแขกเหรื่อมากขึ้น"
 feast_tsagaan_sar_events.0001.d: "...พระพรจาก [ROOT.Char.GetFaith.HighGodName] ในปีใหม่นี้"
 feast_tsagaan_sar_events.0001.d_tt: "ท่านจักมีโอกาสได้รับ [piety|E] จากแขกเหรื่อมากขึ้น"
 feast_tsagaan_sar_events.0001.e: "...อาหาร!"
 feast_tsagaan_sar_events.0001.f: "...การเฉลิมฉลอง!"
 feast_tsagaan_sar_events.0001_none: "ไม่มี [activity_guests|E] ท่านใดที่สามารถมอบของขวัญให้ท่านได้ในปีนี้"
 feast_tsagaan_sar_events.0001_tt: "#V [gifters_list_size]#! แขก #p จัก#! มอบของบางอย่างให้ท่าน"

 feast_tsagaan_sar_events.0002.t: "การเตรียมของขวัญ"
 feast_tsagaan_sar_events.0002.desc: "งานเฉลิมฉลองได้เริ่มขึ้นแล้ว และแม้ข้าจะรู้สึกขอบคุณ [host.GetName] สำหรับคำเชิญของ [host.GetHerHis] ข้าก็ยังครุ่นคิดถึงของขวัญที่ข้าต้องมอบให้ [host.GetHerHim] นี่เป็นเรื่องที่นอกเหนือไปจากธรรมเนียมปฏิบัติ: หาก แต่เป็นเรื่องของเกียรติยศ\n\nข้าสังเกตเห็นเหล่าขุนนางคนอื่นๆ นำหีบเหรียญกษาปณ์ต่างแดนมามอบให้ และเหล่าไพร่ก็นำถุงเล็กๆ บรรจุของมีค่ามาให้บ้าง คนอื่นๆ จูงม้ามา และดูแลพวกมันอย่างดีเพื่อเตรียมพร้อมสำหรับการพบเจ้าของใหม่ แขกบางคนมอบของกำนัลอันมิอาจจับต้องได้ โดยกล่าวคำสัตย์ปฏิญาณอันล้ำค่าแห่งความภักดี\n\nแต่คำถามก็เกิดขึ้นว่า ข้าจักสามารถสละสิ่งใดให้แก่ [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('host'))] ของข้า, [host.GetFirstNameNoTooltip] ได้บ้าง?"
 feast_tsagaan_sar_events.0002.desc_again: "อีกคราหนึ่ง ข้าจำต้องครุ่นคิดว่าจะแสดงความเคารพต่อ [host.GetName] ได้อย่างไร ข้าอาจจะขัดขืน โดยหวังว่า [host.GetSheHe] จะไม่ใส่ใจ หรือดีกว่านั้นคือ ไม่ทันสังเกตเห็น\n\nเวลามิได้อยู่ข้างข้า ด้วยนี่อาจเป็นโอกาสสุดท้ายของข้าที่จะจัดเตรียมบางสิ่งเพื่อ [host.GetHerHim]"
 feast_tsagaan_sar_events.0002.nothing_arrogant: "การปรากฏตัวของข้าก็เพียงพอแล้วสำหรับ [host.GetHerHim]"
 feast_tsagaan_sar_events.0002.nothing_fickle: "บางทีข้าค่อยตัดสินใจภายหลังได้กระมัง?"
 feast_tsagaan_sar_events.0002.nothing: "ดูเหมือนว่าไม่มีสิ่งใดที่ข้าสามารถมอบให้ได้เลย..."
 feast_tsagaan_sar_events.0002.herd_1: "แกะสองสามตัวคงจะดีสำหรับ [host.GetHerHim]"
 feast_tsagaan_sar_events.0002.herd_2: "ข้าพอมีม้าเหลืออยู่ตัวหนึ่ง..."
 feast_tsagaan_sar_events.0002.herd_3: "วัวควายหรือแกะ จะเลือกสิ่งใดดี?"
 feast_tsagaan_sar_events.0002.herd_4: "ดูเหมือนว่าฝูงสัตว์ของข้าก็น่าจะเหมาะสมดี"
 feast_tsagaan_sar_events.0002.herd_tt: "ท่านจักเลือกจำนวน [herd_i] [herd|E] ที่จะมอบให้ [host.GetName]"
 feast_tsagaan_sar_events.0002.gold_1: "ข้าคิดว่าข้าพอจะแบ่งเหรียญกษาปณ์ให้ [host.GetHerHim] ได้บ้าง"
 feast_tsagaan_sar_events.0002.gold_2: "ถุงทองคำหนึ่งใบน่าจะเพียงพอ!"
 feast_tsagaan_sar_events.0002.gold_3: "ข้าไม่ขัดข้องที่จะแบ่งปันความมั่งคั่งของข้ากับ [host.GetFirstNameNoTooltip]!"
 feast_tsagaan_sar_events.0002.gold_tt: "ท่านจักเลือกจำนวน [gold_i] [gold|E] ที่จะมอบให้ [host.GetName]"
 feast_tsagaan_sar_events.0002.artifact: "ข้าสามารถสละโบราณวัตถุชิ้นหนึ่งของข้าได้"
 feast_tsagaan_sar_events.0002.artifact_tt: "ท่านจักเลือก [artifact|E] ชิ้นหนึ่งเพื่อมอบให้ [host.GetName]"
 feast_tsagaan_sar_events.0002.loyalty: "ความภักดีของข้าคือของขวัญอันยิ่งใหญ่ที่สุด"
 feast_tsagaan_sar_events.0002.prestige: "ข้าจักกล่าวสรรเสริญ [host.GetHerHim] ให้เลื่องลือ!"
 feast_tsagaan_sar_events.0002.prestige_tt: "ท่านจักเผยแพร่ความยิ่งใหญ่ของ [host.GetFirstNamePossessiveNoTooltip] ซึ่งจัก ทำให้ [host.GetHerHim] ได้รับ [prestige_i] [prestige|E] ส่วนหนึ่งของท่าน"
 feast_tsagaan_sar_events.0002.blessing: "[host.GetFaith.HighGodName] จักอวยพร [host.GetHerHim] ข้าจัก ทำให้แน่ใจ"
 feast_tsagaan_sar_events.0002.blessing_tt: "ท่านจักมอบพรอันประเสริฐให้แก่ [host.GetFirstNameNoTooltip] ซึ่งจัก ทำให้ [host.GetHerHim] ได้รับ [piety_i] [piety|E] ส่วนหนึ่งของท่าน"
 feast_tsagaan_sar_events.0002.nothing_important: "@warning_icon! #warning ด้วยเหตุที่ท่านมีความสำคัญต่อ [host.GetFirstNameNoTooltip] [host.GetSheHe] จักรู้สึกขุ่นเคืองกับการกระทำนี้.#!"
 feast_tsagaan_sar_events.0002.nothing_tt: "เพราะท่านไม่มีสิ่งใดจะมอบให้ [host.GetFirstNameNoTooltip] [host.GetSheHe] จึงไม่ถือสา"
 feast_tsagaan_sar_events.0002.nothing_unimportant: "@warning_icon! #warning แม้ว่าท่านจะมิได้มีความสำคัญต่อ [host.GetFirstNameNoTooltip] แต่ [host.GetSheHe] อาจรู้สึกขุ่นเคืองกับการที่ท่านไม่มอบของขวัญ.#!"

 feast_tsagaan_sar_events.0003.herd: "ฝูงสัตว์ของข้าจักเป็นของขวัญอันยิ่งใหญ่สำหรับ [host.GetName] ผู้คนของ [host.GetHerHis|U] จักเจริญรุ่งเรือง เมื่อพวกเขาอพยพไปทั่วทุ่งหญ้าสเตปป์และออกรบบนหลังม้าของข้า แต่กระนั้น ก็ยังมีคำถามอยู่ว่า ข้าจักสละให้มากน้อยเพียงใด?"
 feast_tsagaan_sar_events.0003.gold: "เหรียญกษาปณ์มีค่าทุกหนแห่ง และข้ามั่นใจว่า [host.GetName] ก็คงเห็นด้วย อย่างไรก็ตาม ท้องพระคลังของข้ามิได้มีไม่สิ้นสุด และ [host.GetFirstNameNoTooltip] ก็สามารถรับได้เพียงจำนวนหนึ่งเท่านั้น"
 feast_tsagaan_sar_events.0003.prestige: "[host.GetName] เป็นที่รู้จักในหมู่ผู้คนของ [host.GetHerHis] ว่าเป็นผู้ [host.Custom('ComplimentAdjective')] และข้าปรารถนาที่จะเผยแพร่ความรู้สึกนั้น"
 feast_tsagaan_sar_events.0003.piety: "[host.GetFaith.HighGodName] จักทอดพระเนตร [host.GetName] ด้วยความโปรดปรานอย่างสูง แต่การจะทำ เช่นนั้นได้ ข้าต้องระลึกถึง [host.GetFaith.PositiveAfterLife] และทูลบอก [host.GetFaith.HighGodName] เกี่ยวกับคุณงามความดีของ [host.GetFirstNamePossessiveNoTooltip]"

 feast_tsagaan_sar_events.0003.minor.herd: "ม้าสักตัวก็น่าจะดี"
 feast_tsagaan_sar_events.0003.minor.herd_2: "แกะสักตัวสองตัว บางทีนะ"
 feast_tsagaan_sar_events.0003.medium.herd: "ฝูงวัวควายสักฝูงก็น่าจะเพียงพอ"
 feast_tsagaan_sar_events.0003.medium.herd_2: "ม้าหนึ่งฝูง พอสำหรับครอบครัวของ [host.GetHerHis]"
 feast_tsagaan_sar_events.0003.major.herd: "[host.GetFirstNameNoTooltip] จักมีฝูงสัตว์มากมายสุดลูกหูลูกตา!"
 feast_tsagaan_sar_events.0003.minor.gold: "ข้าจักโยนเหรียญกษาปณ์ให้ [host.GetHerHis] สักเล็กน้อย"
 feast_tsagaan_sar_events.0003.minor.gold_2: "ถุงเล็กๆ ถุงหนึ่งเท่านั้นเอง"
 feast_tsagaan_sar_events.0003.medium.gold: "หีบหนึ่งสำหรับ [host.GetTitleAsNameNoTooltip]!"
 feast_tsagaan_sar_events.0003.medium.gold_2: "[host.GetSheHe|U] สมควรได้รับมากกว่าแค่หยิบมือเดียว"
 feast_tsagaan_sar_events.0003.major.gold: "ขอให้คลังสมบัติของ [host.GetFirstNamePossessiveNoTooltip] เต็มเปี่ยมไปด้วยทรัพย์สิน!"
 feast_tsagaan_sar_events.0003.minor.prestige: "ผู้คนของข้าจักได้รู้จัก [host.GetFirstNameNoTooltip]"
 feast_tsagaan_sar_events.0003.medium.prestige: "ข้าจักขับขานบทเพลงสรรเสริญ [host.GetHerHim]!"
 feast_tsagaan_sar_events.0003.major.prestige: "นามของ [host.GetFirstNamePossessiveNoTooltip] จักก้องกังวานไปทั่วทั้งปฐพีและ [ROOT.Char.GetFaith.PositiveAfterLife]!"
 feast_tsagaan_sar_events.0003.minor.piety: "ข้ารู้ว่า [host.GetFirstNameNoTooltip] คือ [host.GetFaith.GetAdherentName] ที่แท้จริง!"
 feast_tsagaan_sar_events.0003.medium.piety: "ด้วยคำอธิษฐานของข้า [host.GetFirstNameNoTooltip] ย่อมมุ่งสู่ [host.GetFaith.PositiveAfterLife] อย่างแน่นอน"
 feast_tsagaan_sar_events.0003.major.piety: "นามของ [host.GetFirstNamePossessiveNoTooltip] จักเป็นที่รู้จักแก่เหล่า [host.GetFaith.GetAdherentNamePlural] ทั้งปวง!"
 feast_tsagaan_sar_events.0002.choose: "บางทีข้าควรเลือกสิ่งอื่นกระมัง"
 feast_tsagaan_sar_events.0002.choose_tt: "ท่านจักเลือกของขวัญชิ้นอื่นให้ [host.GetName]"
 feast_tsagaan_sar_events.0002.none: "อันที่จริง ข้าจะไม่ให้อะไร [host.GetFirstNameNoTooltip] เลย"

 feast_tsagaan_sar_events.0004.desc: "โชคดีที่คลังสิ่งของของข้ามิได้ว่างเปล่า และ [host.GetTitledFirstName] อาจพบประโยชน์ในของชิ้นหนึ่งของข้า\n\nอย่างไรก็ตาม มีคำถามอยู่ว่า [host.GetSheHe] จักชื่นชมชิ้นใด หรือข้าควรเลือกชิ้นที่เป็นประโยชน์ต่อข้าน้อยที่สุด.."
 feast_tsagaan_sar_events.0004.a: "ตกลงเป็น [artifact_1.GetName]!"
 feast_tsagaan_sar_events.0004.b: "อย่างไรเสียข้าก็ไม่ได้ต้องการ [artifact_2.GetName] อยู่แล้ว..."
 feast_tsagaan_sar_events.0004.c: "[host.GetSheHe|U] น่าจะรับ [artifact_3.GetName] ไปจากข้าได้นะ!"

 feast_tsagaan_sar_events.0100.t: "ของขวัญที่จัดการผิดพลาด"
 feast_tsagaan_sar_events.0100.desc: "ข้าราชสำนักของ [host.GetName] นามว่า [gift_collector.GetName] เข้ามาหาข้า "สวัสดี ท่าน [ROOT.Char.Custom('ComplimentAdjective')] [host.GetTitleAsNameNoTooltip] พวกเรายังไม่ได้รับของถวายของท่านแด่ [host.GetTitledFirstNameNoTooltip]" [gift_collector.GetFirstNameNoTooltip] กล่าว "อย่าบอกนะว่าท่านมามือเปล่า!" [gift_collector.GetSheHe] พูดเย้า\n\n"ท่านพูดเรื่องอันใดกัน?" ข้าตอบ "ข้าได้ให้ [ROOT.Char.Custom('GetTsagaanSarGiftDesc')] ไปแล้ว นั่นยังไม่เพียงพอสำหรับคนอย่าง [host.GetFirstNameNoTooltip] อีกหรือ?" [gift_collector.GetFirstNameNoTooltip] ถอนหายใจ "บางทีมันอาจจะไม่ได้ถูกนับรวมเข้าไปกระมัง?""
 feast_tsagaan_sar_events.0100.a: "ข้าจักเลือกของขวัญชิ้นอื่นให้ [host.GetHerHim]"
 feast_tsagaan_sar_events.0100.b: "ข้าพอจะสละเพิ่มได้อีกเล็กน้อยกระมัง..."
 feast_tsagaan_sar_events.0100.c: "ดูเหมือนว่า [host.GetSheHe] จักไม่ได้รับสิ่งใดในครั้งนี้!"
 feast_tsagaan_sar_events.0100.c_paranoid: "หายไปงั้นรึ? ข้าไม่เชื่อหรอก"

 feast_tsagaan_sar_events.0101.t: "อาชาตัวเมียอันสง่างาม"
 feast_tsagaan_sar_events.0101.desc: "จากอีกฟากของทุ่ง ข้าเห็นอาชาตัวหนึ่งงามสง่า ขนของมันขาวราวกับดวงจันทร์ มันช่างงดงามยิ่งนัก แม้ แต่หญิงสาวที่สวยที่สุดก็ยังไม่อาจเทียบได้ ด้วยแผงคอที่ยาวสลวยและดวงตาที่สุกใสราวกับดวงดาว\n\nผู้ขี่ม้า [horse_haver.GetName] สังเกตเห็นข้ากำลังจ้องมอง "ข้าเห็นแล้วว่าท่านมีสายตาแหลมคม" [horse_haver.GetFirstNameNoTooltip] กล่าว "ท่านจะลองขี่มันสักครู่ก็ได้นะ แต่โปรดระวังด้วย มันเป็นม้าที่พยศมาก""
 feast_tsagaan_sar_events.0101.a: "ข้าจักรับข้อเสนอของท่าน"
 feast_tsagaan_sar_events.0101.b: "ข้าสนใจข้อตกลงที่ #EMP ถาวร#! กว่านี้"
 feast_tsagaan_sar_events.0101.b.success: "[horse_haver.GetFirstNameNoTooltip] ตกลงขายม้าให้ท่าน"
 feast_tsagaan_sar_events.0101.b.failure: "[horse_haver.GetFirstNameNoTooltip] ไม่ต้องการจากกับอาชาตัวเมียตัวนั้น"
 feast_tsagaan_sar_events.0101.b.duel: "ท่านขอซื้ออาชาจาก [horse_haver.GetFirstNameNoTooltip]"
 feast_tsagaan_sar_events.0101.c: "แน่นอน แค่ 'ครู่เดียว' เท่านั้น"
 feast_tsagaan_sar_events.0101.c.duel: "ท่านพยายามขโมยม้าระหว่างที่ขี่มัน"
 feast_tsagaan_sar_events.0101.c.success: "ท่านขี่ม้าออกไปให้พ้นสายตาของ [horse_haver.GetFirstNamePossessiveNoTooltip]"
 feast_tsagaan_sar_events.0101.c.failure: "[horse_haver.GetFirstNameNoTooltip] ตามท่านทัน"
 rival_stole_my_horse: "[CHARACTER.GetShortUIName|U] ได้ขโมยม้าสุดที่รักของ [TARGET_CHARACTER.GetShortUINamePossessive|U]"
 rival_stole_my_horse_corresponding: "[TARGET_CHARACTER.GetShortUIName|U] ได้ขโมยม้าสุดที่รักของ [CHARACTER.GetShortUINamePossessive|U]"

 feast_tsagaan_sar_events.0200.t: "การละเล่นชากาย"
 feast_tsagaan_sar_events.0200.desc: ""สวัสดี [ROOT.Char.GetFirstNameNoTooltip]!" [gambler.GetName] เอ่ยทัก "ข้าเห็นว่าท่านพอมีเวลาว่าง ท่านจะมาร่วมเล่น [Glossary( 'ชากาย', 'SHAGAI_GLOSS' )] กับข้าสักตาหรือไม่?" [gambler.GetSheHe] ถาม พร้อมกับเทกระดูกข้อเท้าสองสามชิ้นลงบนมือของ [gambler.GetHerHis]\n\n[gambler.GetSheHe|U] นั่งขัดสมาธิบนพื้น พลางกวักมือเรียกให้ข้าทำตาม [gambler.GetFirstNameNoTooltip] ย้ำเตือนกติกาให้ข้าฟัง และเราก็ผลัดกันทอยกระดูก"
 ts_wager: "ท่านวางเดิมพัน [gold_i]"
 feast_tsagaan_sar_events.0200.a: "หากปราศจากความเสี่ยงแล้วจะสนุกได้อย่างไร?"
 feast_tsagaan_sar_events.0200.a_tt: "$ts_wager$#V [GetPlayer.MakeScope.ScriptValue('medium_gold_value')]#!"
 feast_tsagaan_sar_events.0200.b_tt: "$ts_wager$#V [GetPlayer.MakeScope.ScriptValue('minor_gold_value')]#!"
 feast_tsagaan_sar_events.0200.c_tt: "$ts_wager$#V [GetPlayer.MakeScope.ScriptValue('tiny_gold_value')]#!"
 feast_tsagaan_sar_events.0200.b: "ข้าพอจะลงเดิมพันได้มากกว่าจำนวนเล็กน้อยนั้น"
 feast_tsagaan_sar_events.0200.c: "ข้าจักเดิมพันเพียงเศษเสี้ยวเล็กน้อยจากทรัพย์สินของข้า"
 feast_tsagaan_sar_events.0200.d_content: "ข้าไม่จำเป็นต้องเล่นพนัน"
 feast_tsagaan_sar_events.0200.d: "ไม่ล่ะ แต่ขอบคุณ"
 feast_tsagaan_sar_events.0200_lose: "ท่านแพ้การละเล่น"
 feast_tsagaan_sar_events.0200_win: "ท่านชนะการละเล่น"
 friend_played_party_games: "[CHARACTER.GetShortUIName|U] สนิทสนมกับ [TARGET_CHARACTER.GetShortUIName] มากขึ้นจากการเล่นพนัน" # "games of chance" can be "การพนันขันต่อ"
 friend_played_party_games_corresponding: "[TARGET_CHARACTER.GetShortUIName|U] สนิทสนมกับ [CHARACTER.GetShortUIName] มากขึ้นจากการเล่นพนัน"
 SHAGAI_GLOSS: "#bold ชากาย#! คือการละเล่นทำนายโชคชะตาโดยใช้กระดูกข้อเท้าแกะหรือแพะ กระดูกเหล่านี้จะถูกทอยคล้ายลูกเต๋า และจะตกอยู่หน้าใดหน้าหนึ่งในสี่หน้า ได้แก่ ม้า แกะ อูฐ หรือแพะ ม้าและอูฐถือเป็นโชคดี ในขณะที่แกะและแพะไม่ถือเป็น เช่นนั้น"
 
 feast_tsagaan_sar_events.0210.t: "ปัญญาของผู้เลี้ยงแกะ"
 feast_tsagaan_sar_events.0210.desc: "หลายครอบครัวรวมตัวกันรอบกองไฟและโต๊ะอาหาร แบ่งปันอาหารและเรื่องราวต่างๆ ข้านั่งอยู่ข้างคนเลี้ยงแกะผู้รอบรู้นามว่า [herder.GetName] [herder.GetSheHe|U] เอนตัวเข้ามาหาข้า พลางชี้ไปยังฝูงแกะขนาดใหญ่ที่อยู่ไกลออกไป "พวกนั้นเป็นของข้า" [herder.GetFirstNameNoTooltip] กล่าว "เป็นของขวัญสำหรับ [ROOT.Char.GetInvolvedActivity.GetHost.GetTitleAsNameNoTooltip] ในปีนี้"\n\nข้ามองดูฝูงแกะ สังเกตความสงบของพวกมัน และทึ่งในจำนวนที่มากมายมหาศาล บางทีข้าควรจะขอคำแนะนำจาก [herder.GetFirstNameNoTooltip] เกี่ยวกับวิธีดูแลฝูงสัตว์ของข้าเอง"
 feast_tsagaan_sar_events.0210.a: "ถาม [herder.GetHerHim] ว่า [herder.GetSheHe] ดูแลฝูงสัตว์ขนาดใหญ่ เช่นนี้ได้อย่างไร"
 feast_tsagaan_sar_events.0210.tt: "ท่านจ่ายเงินให้ [herder.GetFirstNameNoTooltip] เพื่อขอคำแนะนำ"
 feast_tsagaan_sar_events.0210.b: "สอบถามเกี่ยวกับวิธีการเลี้ยงสัตว์อันชาญฉลาด"
 feast_tsagaan_sar_events.0210.c: "ข้าไม่ต้องการคำแนะนำ"

 feast_tsagaan_sar_events.0220.t: "การพบกันอีกครั้งของคู่ปรับ"
 feast_tsagaan_sar_events.0220.desc: "ข้าเผชิญหน้ากับ [old_rival.GetName], [old_rival.Custom2('InsultAdjectiveArticle', ROOT.Char)] "อา... ข้าเห็นว่าเจ้าอยู่ที่นี่, [ROOT.Char.GetFirstNameNoTooltip] ข้าหวังว่าเจ้าคงยังไม่ลืมอดีตของเรา, และความผิดที่เจ้าได้ทำไว้กับข้า" [old_rival.GetFirstNameNoTooltip] เย้ยหยัน\n\nข้ารู้สึกได้ถึงความตึงเครียดในวาจาของ [old_rival.GetHerHis], แต่ [old_rival.GetSheHe] ก็กล่าวต่ออย่างใจเย็นว่า, "เนื่องในวาระปีใหม่นี้, ข้าขอให้เราลืมเลือนความบาดหมางในอดีตเสีย""
 feast_tsagaan_sar_events.0220.a: "ข้าเห็นด้วย สันติภาพคือหนทางที่ดีที่สุด"
 feast_tsagaan_sar_events.0220.b: "โอ้ เราทำได้ #EMP มากกว่า#! นั้นเสียอีก"
 feast_tsagaan_sar_events.0220.b_flavor: "ประกายแห่งความปรารถนาจุดประกายขึ้น ซ่อนเร้นอยู่ภายใต้ความตึงเครียดในอดีต"
 feast_tsagaan_sar_events.0220_win: "[old_rival.GetSheHe|U] ตอบรับความรู้สึกของท่าน"
 feast_tsagaan_sar_events.0220_lose: "[old_rival.GetSheHe|U] ถูกขับไล่"
 feast_tsagaan_sar_events.0220.c: "เหตุใดไม่ยกระดับการให้อภัยไปอีกขั้นเล่า?"
 feast_tsagaan_sar_events.0220.d_vengeful: "ตราบใดที่เจ้ายังมีชีวิตอยู่ ไม่!"
 feast_tsagaan_sar_events.0220.d: "ไม่ ข้าไม่คิด เช่นนั้น"

 friend_feast_rivalry: "[CHARACTER.GetShortUIName|U] และ [TARGET_CHARACTER.GetShortUIName] ได้กลายเป็นสหายกันหลังจากละทิ้งความเป็นปรปักษ์ต่อกันระหว่างงานเลี้ยง"

 feast_tsagaan_sar_events.0230.t: "เสียงเพรียกแห่งจันทรา"
 feast_tsagaan_sar_events.0230.desc_intro: "ฝูงแขกเหรื่อจำนวนมากพากันไปยังกระโจมหลังหนึ่งที่อยู่ไกลออกไป พร้อมกับเสียงพูดคุยถึงการแสดงในหมู่ผู้คน ข้าตามความอึกทึกนั้นไป และมองดูขณะที่ทุกสายตาจับจ้องไปที่ [throat_singer.GetName] [throat_singer.GetSheHe|U] เปล่งเสียงขับขานบทเพลง เล่าขานถึง [throat_singer.Custom('GetRandomThroatSingingTheme')]\n\nเสียงนั้นคล้ายกับ"
 feast_tsagaan_sar_events.0230.desc_sygyt: "เสียงนกหวีดอันใสกังวาน ดุจสายลมพัดผ่านทิวไม้"
 feast_tsagaan_sar_events.0230.desc_hoomei: "เสียงลมกระหึ่ม ก่อตัวเป็นพายุ หรือตามกระแสลมที่วิหคทิ้งไว้เบื้องหลัง"
 feast_tsagaan_sar_events.0230.desc_kargyraa: "เสียงคำรามทุ้มลึกจากลำคอ ดุจเสียงอสนีบาตคำรน หรือเสียงขู่ของพยัคฆ์" # Bear -> พยัคฆ์ (Tiger) or หมี (Bear). Context suggests powerful sound.
 feast_tsagaan_sar_events.0230.desc_outro: "[observer.GetName] หันมาทางข้าและกระซิบว่า "[throat_singer.Custom('GetThroatSingingStyle')] ของ [throat_singer.GetHerHis|U] นั้นน่าประทับใจยิ่งนัก ท่านไม่คิด เช่นนั้นหรือ?"\n\nข้ามองดูขณะที่ [throat_singer.GetSheHe] ขับขานท่วงทำนองแรกจบลง และฝูงชนก็ปรบมือให้"
 feast_tsagaan_sar_events.0230.a: "[throat_singer.GetFirstNameNoTooltip] ช่างมีพรสวรรค์ยิ่งนัก"
 feast_tsagaan_sar_events.0230.b: "[throat_singer.GetSheHe|U] ควรจะพัฒนาได้อีก..."
 feast_tsagaan_sar_events.0230.b_tt: "ท่านโห่ใส่การแสดงของ [throat_singer.GetFirstNamePossessiveNoTooltip] ทำให้ [throat_singer.GetHerHim] ได้รับความอับอาย"
 feast_tsagaan_sar_events.0230.c: "บางทีข้าอาจจะร่วมขับขานบทเพลงกับ [throat_singer.GetHerHim]"
 feast_tsagaan_sar_events.0230.d: "อา ข้าก็ปรารถนาจะขับร้องในแบบ [throat_singer.Custom('GetThroatSingingStyle')|U] เช่นกัน!"
 feast_tsagaan_sar_events.0230.d.duel: "ท่านพยายามเลียนแบบลีลาของ [throat_singer.GetHerHis]"
 feast_tsagaan_sar_events.0230.d.success: "ความพยายามของท่านสำเร็จผล"
 feast_tsagaan_sar_events.0230.d_tt: "ท่านได้เรียนรู้รูปแบบการขับร้องโธรทซิงกิงแบบ [throat_singer.Custom('GetThroatSingingStyle')|U]"
 feast_tsagaan_sar_events.0230.d.failure: "ความพยายามของท่านล้มเหลว แต่ท่านก็ได้เรียนรู้บ้างเล็กน้อย"

 feast_tsagaan_sar_events.0240.t: "บทเพลงเป็นของขวัญ"
 feast_tsagaan_sar_events.0240.desc: "ขณะกำลังเพลิดเพลินกับการดื่มและหัวเราะกับ [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('audience'))] ของข้า [audience.GetFirstName] [audience.GetSheHe] ก็หยิบยกหัวข้อการขับร้องโธรทซิงกิงขึ้นมาพูดคุย ข้ากล่าวถึงประสบการณ์ของตนเองสั้นๆ และ [audience.GetSheHe] ก็ยิ้มกว้าง\n\n"ท่านสามารถขับร้องในแบบ [ROOT.Char.Custom('GetThroatSingingStyle')] ได้หรือ?" [audience.GetFirstNameNoTooltip] ถาม "ข้าอยากจะฟังเพลงสักเพลง!""
 feast_tsagaan_sar_events.0240.a: "เช่นนั้นแล้ว จงถือว่าเป็นของขวัญของท่านเถิด"
 feast_tsagaan_sar_events.0240.duel: "ท่านแสดงให้ [audience.GetFirstNameNoTooltip] ชม"
 feast_tsagaan_sar_events.0240.duel_new: "ท่านแสดงให้ [audience.GetFirstNameNoTooltip] ชมในรูปแบบใหม่"
 feast_tsagaan_sar_events.0240.success: "[audience.GetSheHe|U] หลงใหลในพรสวรรค์ของท่าน"
 feast_tsagaan_sar_events.0240.ok: "การแสดงของท่านสร้างความประทับใจให้ [audience.GetFirstNameNoTooltip] อยู่บ้าง"
 feast_tsagaan_sar_events.0240.sygyt: "ข้าตั้งใจจะลองขับร้องเพลงในแบบ [Glossary( 'ซิเกต', 'SYGYT_GLOSS' )] ดูสักครั้ง..."
 feast_tsagaan_sar_events.0240.hoomei: "แล้วเพลงในแบบ [Glossary( 'คูไม', 'HOOMEI_GLOSS' )] เล่าเป็นอย่างไร?"
 feast_tsagaan_sar_events.0240.kargyraa: "อันที่จริง ข้าอยากจะขับร้องในแบบ [Glossary( 'คาร์กีระ', 'KARGYRAA_GLOSS' )]"
 feast_tsagaan_sar_events.0240.d_shy: "ข้าไม่น่าพูดอะไรออกไปเลย"
 feast_tsagaan_sar_events.0240.d: "ข้าไม่ใช่นักแสดงที่เก่งกาจนัก"
 feast_tsagaan_sar_events.0240.success_sygyt_tt: "ท่านลืมรูปแบบเดิมของท่าน และเรียนรู้รูปแบบการขับร้องโธรทซิงกิงแบบซีกิต"
 feast_tsagaan_sar_events.0240.success_hoomei_tt: "ท่านลืมรูปแบบเดิมของท่าน และเรียนรู้รูปแบบการขับร้องโธรทซิงกิงแบบโฮเม"
 feast_tsagaan_sar_events.0240.success_kargyraa_tt: "ท่านลืมรูปแบบเดิมของท่าน และเรียนรู้รูปแบบการขับร้องโธรทซิงกิงแบบคาร์กีรา"
 SYGYT_GLOSS: "#bold ซีกิต#! คือรูปแบบหนึ่งของการขับร้องโธรทซิงกิงที่มักมีเสียงคล้ายนกหวีดหรือขลุ่ย ด้วยเสียงที่ใสและสูง จึงใช้เลียนเสียงลมโชยหรือเสียงนกร้อง"
 HOOMEI_GLOSS: "รูปแบบการขับร้องโธรทซิงกิงที่ได้รับความนิยมที่สุด #bold โฮเม#! หรือ #bold คูเม#! สามารถอธิบายได้ว่าเป็นเสียงหึ่งๆ คล้ายเสียงผึ้ง ซึ่งมักขับร้องในช่วงเสียงกลางของนักร้อง"
 KARGYRAA_GLOSS: "รูปแบบการขับร้องโธรทซิงกิงแบบเสียงทุ้มลึก เกือบจะเหมือนเสียงคำรามจากลำคอ รู้จักกันในชื่อ #bold คาร์กีรา#! การใช้เส้นเสียงเทียมของนักร้อง ทำให้เกิดเสียงที่ได้รับการเปรียบเทียบกับเสียงคำรามของสัตว์หรือเสียงฟ้าร้อง"

 friend_throat_singing: "[CHARACTER.GetShortUIName|U] และ [TARGET_CHARACTER.GetShortUIName] สนิทสนมกันมากขึ้นจากการแสดงขับร้องโธรทซิงกิง"
 rival_throat_singing: "[CHARACTER.GetShortUIName|U] ดูถูกการขับร้องโธรทซิงกิงของ [TARGET_CHARACTER.GetShortUINamePossessive|U]"
 rival_throat_singing_corresponding: "[TARGET_CHARACTER.GetShortUIName|U] ดูถูกการขับร้องโธรทซิงกิงของ [CHARACTER.GetShortUINamePossessive|U]"

 feast_tsagaan_sar_events.0250.t: "เหล่านักขี่แห่ง [ROOT.Char.GetInvolvedActivity.GetCurrentPhase.GetLocation.GetName]"
 feast_tsagaan_sar_events.0250.desc: "คนเลี้ยงม้านำฝูงม้าเข้ามา ขนของพวกมันส่องประกายในแสงจันทร์ แขกเหรื่อพากันมารุมล้อม ชื่นชมเหล่าอาชา [horse_rider_1.GetName] รีบร้อนขึ้นไปบนหลังม้าอย่างตื่นเต้น โดยมี [horse_rider_2.GetName] ตามไปติดๆ\n\n"ข้ากับเจ้า [horse_rider_1.GetFirstNameNoTooltip]!" [horse_rider_2.GetFirstNameNoTooltip] ร้องท้า [horse_rider_1.GetFirstNameNoTooltip] หัวเราะเบาๆ ตอบกลับ "อย่าเพิ่งใจร้อนไปเลย [horse_rider_2.GetFirstNameNoTooltip] เราต้องเก็บแรงไว้สำหรับการแข่งขัน!"\n\n[horse_rider_2.GetFirstNameNoTooltip] พยักหน้าเห็นด้วย "มีผู้ใดอยากจะร่วมกับเราอีกหรือไม่? หรือบางทีอาจจะวางเดิมพัน?" [horse_rider_2.GetSheHe|U] ถาม"
 feast_tsagaan_sar_events.0250.a: "[horse_rider_1.GetFirstNameNoTooltip] จักเป็นผู้ชนะ!"
 feast_tsagaan_sar_events.0250.a_tt: "ท่านพนันว่า [horse_rider_1.GetFirstNameNoTooltip] จักชนะการแข่งขัน"
 feast_tsagaan_sar_events.0250.b: "[horse_rider_2.GetFirstNameNoTooltip] ดูเหมือนจะเป็นคู่แข่งที่แข็งแกร่ง"
 feast_tsagaan_sar_events.0250.b_tt: "ท่านพนันว่า [horse_rider_2.GetFirstNameNoTooltip] จักชนะการแข่งขัน"
 feast_tsagaan_sar_events.0250.c: "ข้าสามารถเอาชนะพวกเจ้าทั้งสองได้!"
 feast_tsagaan_sar_events.0250.c_tt: "ท่านเข้าร่วมการแข่งขัน"
 feast_tsagaan_sar_events.0250.d: "ข้าจักคอยดูอยู่เฉยๆ"
 feast_tsagaan_sar_events.0250.after_tt: "การแข่งขันเริ่มขึ้น..."

 feast_tsagaan_sar_events.0251.desc_intro: "เหล่านักขี่พร้อมแล้ว และฝูงชนก็กระตือรือร้นที่จะได้เห็นผลลัพธ์ [horse_rider_1.GetName] และ [horse_rider_2.GetName] เตรียมพร้อม และแขกคนอื่นๆ ก็พร้อมที่จะชม"
 feast_tsagaan_sar_events.0251.desc_watch: "ข้าปีนขึ้นไปบนหลังม้าที่อยู่ใกล้ๆ และค่อยๆ ควบมันไปยังเนินเขา เพื่อให้มองเห็นเส้นทางการแข่งขันได้ชัดเจนยิ่งขึ้น พวกเขาออกตัวแล้ว และแขกเหรื่อก็ส่งเสียงเชียร์ขณะที่พวกเขากำลังควบม้าผ่าน [ROOT.Char.GetCurrentLocation.Custom('GetTerrainType')]"
 feast_tsagaan_sar_events.0251.desc_race: "ขณะที่ข้าขึ้นหลังม้า [horse_rider_1.GetFirstNameNoTooltip] และ [horse_rider_2.GetFirstNameNoTooltip] ก็ชายตามองข้า "เจ้าจะร่วมด้วยรึ?" [horse_rider_1.GetFirstNameNoTooltip] ถาม "ใช่แล้ว" ข้าตอบ และเราก็ออกตัว ควบม้าแข่งกันผ่าน [ROOT.Char.GetCurrentLocation.Custom('GetTerrainType')]\n\nเราขี่ไปด้วยความเร็วที่สม่ำเสมอ และข้าก็ครุ่นคิดอย่างรวดเร็วว่าจะชิงความได้เปรียบได้อย่างไร"
 feast_tsagaan_sar_events.0251.a: "ช่างเป็นนักขี่ที่ยอดเยี่ยมอะไร เช่นนี้!"
 feast_tsagaan_sar_events.0251.b: "การชน [horse_rider_1.GetFirstNameNoTooltip] เล็กน้อยน่าจะช่วยได้"
 feast_tsagaan_sar_events.0251.b.duel: "ท่านพยายามชน [horse_rider_1.GetFirstNameNoTooltip] ให้ตกจากหลังม้าของ [horse_rider_1.GetHerHis]"
 feast_tsagaan_sar_events.0251.b_tt: "#p [horse_rider_1.GetFirstNameNoTooltip] ตกออกจากการแข่งขัน#!"
 feast_tsagaan_sar_events.0251.c: "[horse_rider_2.GetFirstNameNoTooltip] ดูเหมือนจะเป็นปัญหา..."
 feast_tsagaan_sar_events.0251.c.duel: "ท่านพยายามชน [horse_rider_2.GetFirstNameNoTooltip] ให้ตกจากหลังม้าของ [horse_rider_2.GetHerHis]"
 feast_tsagaan_sar_events.0251.c_tt: "#p [horse_rider_2.GetFirstNameNoTooltip] ตกออกจากการแข่งขัน#!"
 feast_tsagaan_sar_events.0251.success: "ท่านขัดขวางนักขี่ได้สำเร็จ"
 feast_tsagaan_sar_events.0251.failure: "ท่านทำอันตรายนักขี่ไม่สำเร็จ"
 feast_tsagaan_sar_events.0251.lose: "#n ท่านตกออกจากการแข่งขัน#!"
 feast_tsagaan_sar_events.0251.d: "ข้าจักรักษาความเร็วของข้าไว้"
 feast_tsagaan_sar_events.0251.d.knocked_out_1: "[horse_rider_1.GetFirstNameNoTooltip] ตามไม่ทัน"
 feast_tsagaan_sar_events.0251.d.knocked_out_2: "[horse_rider_2.GetFirstNameNoTooltip] รั้งท้าย"
 feast_tsagaan_sar_events.0251.d.knocked_out_3: "ความเร็วของท่านช้าเกินไป"
 feast_tsagaan_sar_events.0251.after_tt: "การแข่งขันดำเนินต่อไป..."
 feast_tsagaan_sar_events.0251.d_title: "มีบางคนตกออกจากการแข่งขัน!"

 rival_cheated_horse_race: "[CHARACTER.GetShortUIName|U] โกงในการแข่งม้ากับ [TARGET_CHARACTER.GetShortUINamePossessive|U]"
 rival_cheated_horse_race_corresponding: "[TARGET_CHARACTER.GetShortUIName|U] โกงในการแข่งม้ากับ [CHARACTER.GetShortUINamePossessive|U]"

 feast_tsagaan_sar_events.0252.desc_knocked: "ข้ามองดูนักขี่ทั้งสองคนผ่านหน้าข้าไป และข้าก็อดรู้สึกอิจฉาเล็กน้อยไม่ได้ ข้าควรจะเป็นผู้ชนะ แต่ข้าไม่สามารถเทียบความเร็วของพวกเขาได้"
 feast_tsagaan_sar_events.0252.desc_knocked_1: "ข้าเหลือบมองข้างหลังขณะที่ [horse_rider_1.GetFirstNameNoTooltip] ตกจากหลังม้า และเหลือเพียง [horse_rider_2.GetFirstNameNoTooltip] เท่านั้น เราขับเคี่ยวกันอย่างสูสี และแขกเหรื่อก็ส่งเสียงเชียร์ด้วยความตื่นเต้น"
 feast_tsagaan_sar_events.0252.desc_knocked_2: "ข้าเหลือบมองข้างหลัง [horse_rider_2.GetFirstNameNoTooltip] ตกจากหลังม้า และเหลือเพียง [horse_rider_1.GetFirstNameNoTooltip] เท่านั้น เราขับเคี่ยวกันอย่างสูสี และแขกเหรื่อก็ส่งเสียงเชียร์ด้วยความตื่นเต้น"
 feast_tsagaan_sar_events.0252.desc_watch: "[horse_rider_1.GetFirstNameNoTooltip] และ [horse_rider_2.GetFirstNameNoTooltip] ขับเคี่ยวกันอย่างสูสี และฝูงชนต่างก็นั่งไม่ติดที่ นักขี่ใกล้ถึงเส้นชัยแล้ว และแขกเหรื่อก็กำลังเชียร์พวกเขาอยู่"
 feast_tsagaan_sar_events.0252.a: "แน่นอนว่า [final_opponent.GetFirstNameNoTooltip] คงไม่ว่าอะไรถ้าข้าชนะ..."
 feast_tsagaan_sar_events.0252.a.duel: "ท่านพยายามเอาชนะ [final_opponent.GetFirstNameNoTooltip] ด้วยเล่ห์เหลี่ยม"
 feast_tsagaan_sar_events.0252.success: "ท่านหลอกล่อ [final_opponent.GetFirstNameNoTooltip] ได้สำเร็จ"
 feast_tsagaan_sar_events.0252.failure: "[final_opponent.GetFirstNameNoTooltip] รู้ทันแผนของท่าน"
 feast_tsagaan_sar_events.0252.b: "มาดูกันว่าเรื่องนี้จะจบลงอย่างไร..."
 feast_tsagaan_sar_events.0252.c: "อีกเฮือกเดียว!"
 feast_tsagaan_sar_events.0252.after_tt: "การแข่งขันสิ้นสุดลง"

 feast_tsagaan_sar_events.0253.desc_lost: "[rider_winner.GetName] ควบม้าของ [rider_winner.GetHerHis] อย่างรวดเร็ว ทิ้งข้าไว้เบื้องหลัง ข้ามองดูขณะที่ [rider_winner.GetSheHe] ข้ามเส้นชัย และฝูงชนก็โห่ร้องด้วยความตื่นเต้น"
 feast_tsagaan_sar_events.0253.desc_won: "ข้าพยายามเฮือกสุดท้าย และม้าของข้าก็ทะยานนำหน้า [rider_winner.GetName] ไป ข้าข้ามเส้นชัย และฝูงชนก็โห่ร้องด้วยความตื่นเต้น"
 feast_tsagaan_sar_events.0253.desc_watch: "[horse_rider_1.GetName] และ [horse_rider_2.GetName] ค่อยๆ เร่งความเร็ว และผู้ชนะก็ยังไม่ชัดเจน ทันใดนั้น [rider_winner.GetFirstNameNoTooltip] ก็แซงขึ้นหน้า และข้ามเส้นชัยเป็นคนแรก ฝูงชนโห่ร้องด้วยความตื่นเต้น"
 feast_tsagaan_sar_events.0253.a: "ช่างเป็นการแสดงที่ยอดเยี่ยม!"
 feast_tsagaan_sar_events.0253.winner: "ข้าเก่งที่สุด!"
 feast_tsagaan_sar_events.0253.b: "น่าประทับใจมาก [rider_winner.GetFirstNameNoTooltip]"
 feast_tsagaan_sar_events.0253.c: "ข้าสมควรได้รับชัยชนะในครั้งหน้า"
 feast_tsagaan_sar_events.0253.d: "ข้าอยากได้นักขี่อย่างเจ้า [rider_winner.GetFirstNameNoTooltip]"
 feast_tsagaan_sar_events.0253.bet_tt: "ท่านชนะพนัน"

 feast_tsagaan_sar_events.0260.t: "อาภรณ์อันโอ่อ่าของ [drip_haver.GetFirstNamePossessiveNoTooltip]"
 feast_tsagaan_sar_events.0260.desc: "ข้ามองเห็น [drip_haver.GetName] แต่ไกล และพบว่าตนเองกำลังจ้องมองอาภรณ์อันงดงามของ [drip_haver.GetHerHis] [drip_haver.GetSheHe|U] ประดับกายด้วย [Glossary( 'ดีล', 'DEEL_GLOSS' )] ไหมสีขาวสวยงาม ตก แต่งด้วยขนนกอ่อนนุ่ม\n\n[drip_haver.GetFirstNameNoTooltip] เข้ามาหาข้า และ [drip_haver.GetSheHe] ก็ยิ้มอย่างเมามาย "อา [ROOT.Char.GetFirstNameNoTooltip]! ข้าหวังว่าท่านจะมีความสงบสุขในใจในค่ำคืนนี้" ข้าพยักหน้าเห็นด้วย และครุ่นคิดว่าจะพูดอะไรต่อไป"
 feast_tsagaan_sar_events.0260.a: "ชมเชย [drip_haver.GetHerHim] เรื่องเครื่อง แต่งกายของ [drip_haver.GetHerHis]"
 feast_tsagaan_sar_events.0260.b_shy: "เดินจากไปอย่างอึดอัดAwkwardly." # Awkwardly -> อย่างอึดอัดกระอ่วน / อย่างเก้อเขิน
 feast_tsagaan_sar_events.0260.b: "ขอตัวลาก่อน"

 friend_tsagaan_sar_compliment: "[CHARACTER.GetShortUIName|U] และ [TARGET_CHARACTER.GetShortUIName] กลายเป็นสหายกันหลังจาก [CHARACTER.GetShortUIName|U] ชมเชยเครื่อง แต่งกายของ [TARGET_CHARACTER.GetShortUINamePossessive|U]"

 feast_tsagaan_sar_events.0270.t: "การท้าทายด้วยจอก"
 feast_tsagaan_sar_events.0270.desc: "[drinker.GetName] เดินโซซัดโซเซมาหาข้า พร้อมด้วยจอก [Glossary( 'ไอรอก', 'AIRAG_GLOSS' )] ในมือ [drinker.GetSheHe|U] ยิ้มกริ่ม และยกจอกขึ้นเพื่อดื่มอวยพร "แด่ท่าน [ROOT.Char.GetFirstNameNoTooltip]!" [drinker.GetFirstNameNoTooltip] อุทาน\n\nข้ารับจอกมา และยกขึ้นจรดริมฝีปาก ไอรักนั้นแรงมาก และข้าก็รู้สึกถึงฤทธิ์ของมันเกือบจะในทันที "ข้าพนันได้เลยว่าข้าดื่มได้มากกว่าเจ้า" [drinker.GetFirstNameNoTooltip] ท้าทาย"
 AIRAG_GLOSS: "#bold ไอรัก#! หรือ #bold คูมิส#! คือเครื่องดื่มตามประเพณีของชาวมองโกลและกลุ่มชนเติร์ก ทำจากนมม้าหมัก"
 feast_tsagaan_sar_events.0270.win: "ท่านดื่มได้มากกว่า [drinker.GetFirstNameNoTooltip] มาก"
 feast_tsagaan_sar_events.0270.win_price: "ท่านดื่มได้มากกว่า [drinker.GetFirstNameNoTooltip] แต่ก็ต้องแลกมาด้วยบางอย่าง"
 feast_tsagaan_sar_events.0270.lose: "[drinker.GetFirstNameNoTooltip] ทำให้ท่านขายหน้า"
 feast_tsagaan_sar_events.0270.a: "ตกลง [drinker.GetFirstNameNoTooltip]!"
 feast_tsagaan_sar_events.0270.b: "คืนนี้ข้าดื่มมามากพอแล้ว"
 feast_tsagaan_sar_events.0270.b_paranoid: "เดี๋ยวนะ... เจ้าเพิ่งให้ข้าดื่มอะไรไป?"

 feast_tsagaan_sar_events.0280.t: "ปัญญาของผู้เฒ่า"
 feast_tsagaan_sar_events.0280.desc: "ในช่วงเวลาอันเงียบสงบ ข้าเห็น [elder.GetName] นั่งอยู่ตามลำพัง จมอยู่ในภวังค์ความคิด ข้าค่อยๆ สัมผัสไหล่ของ [elder.GetHerHis] เพื่อดูว่า [elder.GetSheHe] ยังตื่นอยู่หรือไม่ และ [elder.GetSheHe] ก็สะดุ้งตัวขึ้น ตกใจ\n\n"อา [ROOT.Char.GetFirstNameNoTooltip]" [elder.GetFirstNameNoTooltip] หัวเราะเบาๆ "ข้าขออภัย ข้าเคยร่วมงานเฉลิมฉลอง เช่นนี้มามากมายแล้ว แต่ก็ยังคงเติมจอกของตนจนล้นอยู่เสมอ ข้าหวังว่าท่านจะเพลิดเพลินนะ" ข้าโค้งคำนับอย่างเหมาะสม นั่งลงข้าง [elder.GetHerHim] และเราก็แบ่งปันช่วงเวลาแห่งความเงียบ [elder.GetSheHe|U] กุมมือข้า และเริ่มพูด\n\n"ข้าเห็นว่าท่านเป็นผู้ที่มีศักยภาพสูงส่ง [ROOT.Char.GetFirstNameNoTooltip] จงถามข้าถึงวิธีจัดการเรื่องใดๆ ก็ตาม แล้วข้าจะตอบตามความสามารถของข้า""
 feast_tsagaan_sar_events.0280.a: "บอกข้าเกี่ยวกับครอบครัวของข้า"
 feast_tsagaan_sar_events.0280.a_grow: "[elder.GetSheHe|U] แนะนำให้ท่านขยายครอบครัว"
 feast_tsagaan_sar_events.0280.a_strength: "[elder.GetSheHe|U] แนะนำให้ท่านเสริมสร้างความผูกพันในครอบครัว"
 feast_tsagaan_sar_events.0280.b: "บอกข้าเกี่ยวกับสงคราม"
 feast_tsagaan_sar_events.0280.b_defense: "[elder.GetSheHe|U] แนะนำให้ท่านมุ่งเน้นไปที่การป้องกันดินแดนของท่าน"
 feast_tsagaan_sar_events.0280.b_attack: "[elder.GetSheHe|U] แนะนำให้ท่านมุ่งเน้นไปที่การพิชิตศัตรูของท่าน"
 feast_tsagaan_sar_events.0280.c: "บอกข้าเกี่ยวกับฝูงสัตว์ของข้า"
 feast_tsagaan_sar_events.0280.c_tend: "[elder.GetSheHe|U] แนะนำให้ท่านดูแลฝูงสัตว์ของท่าน"
 feast_tsagaan_sar_events.0280.c_migrate: "[elder.GetSheHe|U] แนะนำให้ท่านอพยพพวกมัน"
 feast_tsagaan_sar_events.0280.d: "ข้าเพียงปรารถนาที่จะเพลิดเพลินกับการอยู่ร่วมกับท่าน"

 feast_tsagaan_sar_events.0290.t: "ปีแห่ง [ROOT.Char.Custom('GetLunarNewYearAnimal')|U]"
 feast_tsagaan_sar_events.0290.desc: "ค่ำคืนนั้นยาวนาน อบอวลไปด้วยเสียงหัวเราะและเสียงจอกกระทบกัน [wise_guy.GetName] รวบรวมผู้คนรอบกระโจมเพื่อดื่มอวยพร "พี่น้องทั้งหลาย!" [wise_guy.GetSheHe|U] ตะโกน\n\n"เมื่อจันทร์ใหม่ขึ้น เราต่างเคารพในพลังอำนาจของ [ROOT.Char.Custom('GetLunarNewYearAnimal')] และพรที่มันนำมา ขอให้เรา [ROOT.Char.Custom('GetLunarNewYearAnimalToastDesc')]" [wise_guy.GetFirstNameNoTooltip] ยกจอกของ [wise_guy.GetHerHis] ขึ้น และแขกเหรื่อก็ทำตาม ส่งเสียงเชียร์พร้อมเพรียงกัน"
 feast_tsagaan_sar_events.0290.a: "แด่ [ROOT.Char.Custom('GetLunarNewYearAnimal')]!"
 feast_tsagaan_sar_events.0290.b: "โอ้โห [wise_guy.GetFirstNameNoTooltip] ช่างรอบรู้เสียจริง"
 feast_tsagaan_sar_events.0300.t: "น้ำใจช่วยเหลือ"
 feast_tsagaan_sar_events.0300.desc: "ยามเย็นกำลังจะผ่านพ้นไป และข้าพบว่าตนเองอยู่ในมุมสงบของกระโจม [cleaner.GetName] ฮัมเพลงเบาๆ ขณะที่ [cleaner.GetSheHe] กำลังรีบเก็บกวาดบริเวณนั้นอย่างเร่งรีบ เก็บทุกเศษเล็กเศษน้อยที่ตกหล่นอยู่ แม้แขกของข้ายินดีที่จะสนุกสนานโดยมิต้องทำงานใดๆ แต่ [cleaner.GetFirstNameNoTooltip] ก็ได้อาสาด้วยตัว [cleaner.GetHerHim] เองที่จะทำความสะอาดตามหลังพวกเขา รักษาพื้นที่ให้สะอาดสดชื่นสำหรับปีใหม่"
 feast_tsagaan_sar_events.0300.a: "ขอบคุณสำหรับความเหนื่อยยากของท่าน [cleaner.GetFirstNameNoTooltip]"
 feast_tsagaan_sar_events.0300.a_tt: "ท่านแสดงความขอบคุณต่อ [cleaner.GetFirstNameNoTooltip]"
 feast_tsagaan_sar_events.0300.b: "อุ๊ย ดูเหมือนท่านจะมองข้ามไปจุดหนึ่งนะ"
 feast_tsagaan_sar_events.0300.b_tt: "ท่านจงใจ ทำให้รก เพื่อให้ [cleaner.GetFirstNameNoTooltip] เก็บกวาด"
 feast_tsagaan_sar_events.0300.c: "อา นั่นก็ดีนะ"

 feast_tsagaan_sar_events.0310.t: "คำสารภาพอันบ้าระห่ำ"
 feast_tsagaan_sar_events.0310.desc: ""ของขวัญสำหรับ [ROOT.Char.GetFirstName] น่ะหรือ? ฮ่า! ข้ายอมถูกอีกากินทั้งเป็นเสียดีกว่า" [bragger.GetName] โอ้้อวดกับ [bragger_friend.GetName] "ชู่ว์!" [bragger_friend.GetFirstNameNoTooltip] ส่งเสียงห้าม พลางเหลือบมองมาทางข้า "เจ้าไม่รู้หรอกว่าใครอาจจะกำลังฟังอยู่"\n\nแต่คำร้องขอของ [bragger_friend.GetFirstNamePossessiveNoTooltip] ก็สายเกินไปเสียแล้ว ข้าได้ยินคำพูดโอหังของ [bragger.GetHerHis] มากพอที่จะรู้ว่า [bragger.GetFirstNameNoTooltip] ไม่ได้มอบของขวัญให้ข้าในปีนี้"
 feast_tsagaan_sar_events.0310.a: "เจ้าไม่มีที่อยู่ในบ้านของข้า"
 feast_tsagaan_sar_events.0310.b: "จำเป็นต้องมีของกำนัลหากจะอยู่ต่อ"
 feast_tsagaan_sar_events.0310.b.duel: "ท่านพยายามยึดของขวัญจาก [bragger.GetFirstNameNoTooltip]"
 feast_tsagaan_sar_events.0310.b.success: "[bragger.GetFirstNameNoTooltip] ยอมอ่อนข้อและเลือกของขวัญ"
 feast_tsagaan_sar_events.0310.b.failure: "[bragger.GetFirstNameNoTooltip] ปฏิเสธที่จะให้ของขวัญแก่ท่าน"
 feast_tsagaan_sar_events.0310.c: "ข้าจักเพิกเฉยต่อคำพูดของ [bragger.GetHerHis] ในครั้งนี้"

 feast_tsagaan_sar_events.0320.t: "การให้เกียรติผู้อาวุโส"
 feast_tsagaan_sar_events.0320.desc: "เมื่อเวลาผ่านไป ปัญญาก็เพิ่มพูน มีผู้ที่ผ่านร้อนผ่านหนาวมาหลายจันทรา ถ่ายทอดเรื่องราวแห่งชัยชนะและบทเรียนชีวิต ร่างกายของพวกเขาอ่อนแอ ประสาทสัมผัสเลือนลาง แต่จิตใจยังคงเฉียบแหลม และคำพูดของพวกเขาก็มีความหมาย\n\nเมื่อเวลาของพวกเขาบนโลกนี้เหลือน้อยลง การแสดงความเคารพด้วยของกำนัลก็ไม่เสียหายอะไร"
 feast_tsagaan_sar_events.0320.a: "โปรยปรายของขวัญให้พวกเขา!"
 feast_tsagaan_sar_events.0320.a_tt: "[activity_guest|E] ทุกคนที่อายุมากกว่า #V 50#!:\n$EFFECT_LIST_BULLET$ได้รับ #p 10#! [opinion|E] จาก #V ท่าน#!"
 feast_tsagaan_sar_events.0320.b: "พวกเขาได้รับเกียรติเพียงพอแล้ว"

 feast_tsagaan_sar_events.0010.t: "เทศกาลซากานซาร์"
 feast_tsagaan_sar_events.0010.desc: ""[ROOT.Char.GetTitleAsNameNoTooltip]" [gift_collector.GetName] เอ่ยขึ้น "ถึงเวลารวบรวมของกำนัลจากแขกเหรื่อแล้ว ข้าหวังว่าท่านพร้อมที่จะรับมัน" [gift_collector.GetFirstNameNoTooltip] ชี้ไปยังทางเข้ากระโจม ที่ ซึ่งแขกเหรื่อเข้าแถวรอเพื่อมอบของขวัญ\n\nข้าพยักหน้าเห็นด้วย และเตรียมตัวสำหรับค่ำคืนที่เหลือ"
 feast_tsagaan_sar_events.0010.a: "นำของขวัญออกมา!"
 feast_tsagaan_sar_events.0010.a_tt: "โดยรวมแล้ว ท่านได้รับ:\n$EFFECT_LIST_BULLET$ [gold_i] #V [GetPlayer.MakeScope.Var('feast_gold_total').GetValue]#! [gold|E]\n$EFFECT_LIST_BULLET$ [herd_i] #V [GetPlayer.MakeScope.Var('feast_herd_total').GetValue]#! [herd|E]\n$EFFECT_LIST_BULLET$ [piety_i] #V [GetPlayer.MakeScope.Var('feast_piety_total').GetValue]#! [piety|E] \n$EFFECT_LIST_BULLET$ [prestige_i] #V [GetPlayer.MakeScope.Var('feast_prestige_total').GetValue]#! [prestige|E]"

 tsagaan_sar_gift_title: "ของขวัญซากานซาร์"
 tsagaan_sar_gift_received: "ได้รับของขวัญ"

# Modifiers
 stole_my_courtier_opinion: "ขโมยข้าราชสำนักของข้า"

 mpo_throatsinging_practice_modifier: "การฝึกฝนการขับร้องโธรทซิงกิง"
 mpo_throatsinging_practice_modifier_desc: "ตัวละครนี้ได้ฝึกฝนการขับร้องโธรทซิงกิง และกำลังฝึกปรือทักษะของตน"

 mpo_throatsinging_great_practice_modifier: "การฝึกฝนการขับร้องโธรทซิงกิงอย่างยอดเยี่ยม"
 mpo_throatsinging_great_practice_modifier_desc: "ตัวละครนี้ได้ฝึกฝนการขับร้องโธรทซิงกิง และกำลังเชี่ยวชาญในทักษะของตน"

 mpo_throatsinging_duet_modifier: "เสียงประสานคู่"
 mpo_throatsinging_duet_modifier_desc: "ตัวละครนี้ได้แสดงการขับร้องโธรทซิงกิงร่วมกับคู่หู และมีความกลมกลืนที่ยอดเยี่ยม"

 mpo_throatsinging_good_performance_modifier: "การแสดงอันน่าประทับใจ"
 mpo_throatsinging_good_performance_modifier_desc: "ตัวละครนี้เพิ่งแสดงการขับร้องโธรทซิงกิง และทำได้ดีเป็นที่ชื่นชอบของผู้ชม"

 mpo_throatsinging_great_performance_modifier: "การแสดงอันเชี่ยวชาญ"
 mpo_throatsinging_great_performance_modifier_desc: "ตัวละครนี้เพิ่งแสดงการขับร้องโธรทซิงกิง และ ทำให้ผู้ชมทึ่งในความสามารถ"

 mpo_big_herd_modifier: "ฝูงสัตว์ที่เติบโตขึ้นเรื่อยๆ"
 mpo_big_herd_modifier_desc: "ฝูงสัตว์ของตัวละครนี้ได้รับการดูแลจากคนเลี้ยงแกะผู้มีทักษะ และกำลังเพิ่มจำนวนมากขึ้น"

 mpo_efficent_herd_modifier: "การเลี้ยงสัตว์อย่างมีประสิทธิภาพ"
 mpo_efficent_herd_modifier_desc: "ตัวละครนี้ได้เรียนรู้วิธีการเลี้ยงสัตว์อย่างมีประสิทธิภาพจากคนเลี้ยงแกะผู้มีทักษะ"

 mpo_horse_ride_modifier: "การขี่ม้าอันสง่างาม"
 mpo_horse_ride_modifier_desc: "ตัวละครนี้เพิ่งขี่ม้าอันสง่างาม และรู้สึกดีกับมันมาก"

 mpo_appreciate_fashion_modifier: "การชื่นชมสิ่งสวยงาม"
 mpo_appreciate_fashion_modifier_desc: "ตัวละครนี้รู้สึกทึ่งในแฟชั่นของผู้อื่น และได้นำมาปรับใช้ในราชสำนักของตน"

 mpo_queasy_modifier: "อาการคลื่นไส้"
 mpo_queasy_modifier_desc: "ตัวละครนี้เพิ่งดื่มมากเกินไปเล็กน้อย"

 mpo_elder_family_grow_modifier: "คำแนะนำของผู้เฒ่า: การเติบโต"
 mpo_elder_family_grow_modifier_desc: "ตัวละครนี้ได้รับคำแนะนำจากผู้เฒ่าให้ขยายครอบครัว"
 
 mpo_elder_family_strength_modifier: "คำแนะนำของผู้เฒ่า: ความเข้มแข็ง"
 mpo_elder_family_strength_modifier_desc: "ตัวละครนี้ได้รับคำแนะนำจากผู้เฒ่าให้เสริมสร้างความผูกพันในครอบครัว"
 
 mpo_elder_war_defense_modifier: "คำแนะนำของผู้เฒ่า: การป้องกัน"
