 lunar_new_year_animal_monkey_desc: "เฉลียวฉลาดดุจดังมัน และปรับตัวได้ว่องไว"
 lunar_new_year_animal_rooster_desc: "เชิดหน้าด้วยความภาคภูมิ และมุมานะดุจดังมัน"
 lunar_new_year_animal_dog_desc: "เป็นมิตรและเป็นที่รักแก่ทุกคน และปกป้องผู้ที่เราห่วงใย"
 lunar_new_year_animal_pig_desc: "ดำเนินชีวิตอย่างมีวินัย และเพลิดเพลินกับผลแห่งการงานของเรา"
 lunar_new_year_animal_rat_desc: "เฉียบแหลมและมีไหวพริบ และหาทางรอดได้เสมอ"
 lunar_new_year_animal_ox_desc: "อบอุ่นและอดทน และจัดการทรัพย์สมบัติของเราอย่างชาญฉลาด"
 lunar_new_year_animal_tiger_desc: "กล้าแกร่งและดุร้าย ขณะที่ยังคงรักษาความแข็งแรงของเราไว้"
 lunar_new_year_animal_rabbit_desc: "สมาคมกับผู้อื่น และช่วยรักษาสันติภาพที่ยั่งยืน"
 lunar_new_year_animal_dragon_desc: "สร้างความแข็งแกร่งของเรา และตัดสินใจอย่างมีสติปัญญา"
 lunar_new_year_animal_snake_desc: "สงบนิ่งเมื่อเผชิญอันตราย และเป็นที่เคารพของผู้ที่เรานำ"
 lunar_new_year_animal_horse_desc: "เปิดใจท่องไปในทุกดินแดน ดุจอาชาที่พร้อมรับผู้ขี่ทุกคน"
 lunar_new_year_animal_sheep_desc: "อ่อนโยนหัวใจดุจขนแกะ และดูแลฝูงของท่าน"
