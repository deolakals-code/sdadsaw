 mpo_elder_war_attack_modifier: "คำแนะนำของผู้เฒ่า: การพิชิต"
 mpo_elder_war_attack_modifier_desc: "ตัวละครนี้ได้รับคำแนะนำจากผู้เฒ่าให้โจมตีศัตรูของตน"

 mpo_elder_flock_migrate_modifier: "คำแนะนำของผู้เฒ่า: การอพยพ"
