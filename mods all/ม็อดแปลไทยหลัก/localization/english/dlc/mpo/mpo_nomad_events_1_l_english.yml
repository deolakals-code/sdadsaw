mpo_nomad_events.1050.t: "ทุ่งหญ้าที่กว้างขึ้น"
mpo_nomad_events.1050.desc: "[herder.GetTitledFirstName], [herder.GetWomanMan] ท่าทางซอมซ่อผู้มีกลิ่นสาบแพะติดตัว, ประกาศตน [herder.GetHerselfHimself] ว่าเป็นผู้ดูแล [herder.GetCapitalLocation.GetTerrain.GetNameNoTooltip|l] ที่อยู่ใกล้เคียงของ [herder_county.GetNameNoTierPossessive]\n\n"คนเลี้ยงสัตว์ชาว [ROOT.Char.GetPrimaryTitle.GetAdjective] ของท่านมิได้ใส่ใจขอบเขตตามประเพณีเลย!" [herder.GetSheHe] กล่าว "ข้าย้ายฝูงสัตว์ไปยังพื้นที่ใหม่ แต่ดินกลับแห้งแล้ง! ลมพัดพาเสียงหัวเราะเยาะของพลขี่ม้าของท่าน และเสียงม้าอ้วนพีของพวกมันมา!"\n\n"เรามิอาจแบ่งปันผืนดินกันอย่างซื่อสัตย์ได้ดอกหรือ ท่าน [ROOT.Char.GetTitleAsName]?""
mpo_nomad_events.1050.a: "สำหรับข้า ขอบเขตดั้งเดิมนั้น #EMP ไม่มี#! ความหมาย"
mpo_nomad_events.1050.b: ""จงให้ยืมลิ้นอันซื่อสัตย์ของเจ้า และความกล้าหาญของเจ้าแก่ข้า!""
mpo_nomad_events.1050.b.flavor: "ข้าจะสร้างคนเลี้ยงแพะปากเหม็นเสียงดังผู้นี้ให้เป็นพลม้าผู้ทรงเกียรติ!"
mpo_nomad_events.1050.c: ""ข้าจะทำลายล้างผู้ที่ทำผิดต่อเจ้า""
mpo_nomad_events.1050.c.flavor: "ดูเหมือนว่าฝูงสัตว์ของข้าจะเติบโตเกินกว่าที่ข้าจะควบคุมได้..."
mpo_nomad_events.1050.d: ""#EMP จงหนีไปให้พ้นจากสัตว์ของข้า เจ้าคนเลี้ยงแพะ!#!""

mpo_nomad_events.1060.t: "การแลกเปลี่ยนด้วยแกะ"
mpo_nomad_events.1060.desc: "เลยทุ่งหญ้าของข้าไปเล็กน้อยคือถิ่นฐานของ [neighbor_province.GetName] สถานที่ ซึ่งก้องกังวานไปด้วยเสียงค้อนทุบ เสียงล้อเกวียนบดเบียด เสียงพูดคุยจอแจของฝูงชนชาว [county_culture.GetName] ที่หนาแน่น\n\nเราไปเยี่ยมเยือนเพื่อแลกเปลี่ยนสัตว์กับสินค้าสำเร็จรูป เหล่าพ่อค้าท้องนิ่มมองเราด้วยความสงสัยและความหวาดกลัว\n\n"ดูนั่นสิ อาวุธที่ทำจาก [neighbor.Custom('RegionalWeaponMetal')]! เสื้อผ้าอาภรณ์จาก [neighbor.Custom('RegionalFabric')] ชั้นดี!" สหายของข้าโห่ร้อง "และเหรียญที่ทำจากโลหะมีค่า!""
mpo_nomad_events.1060.a: "เจ้าคิดว่า #EMP นั่น#! คือมูลค่าของเหรียญเงินหรือ...?"
mpo_nomad_events.1060.a.flavor: "เจ้าพวกอ่อนแอที่ตั้งรกรากเหล่านี้จะได้เรียนรู้ในไม่ช้าว่าพวกเรา 'คนเถื่อน' ไม่ได้ถูกหลอกง่ายๆ เช่นนั้น..."
mpo_nomad_events.1060.b: ""ฉกชิงมาให้หมด! #EMP แล้วขี่ม้าหนีให้เร็ว!#!""
mpo_nomad_events.1060.b.flavor: "[ROOT.Char.Custom('GetDaughterSon')] แห่งทุ่งหญ้าสเตปป์ที่แท้จริงจะไม่เจรจากับผู้อ่อนแอ!"
mpo_nomad_events.1060.b.success: "กลุ่มของท่านหลบหนีไปพร้อมกับสินค้าที่ยึดมาได้"
mpo_nomad_events.1060.b.failure: "ท่านทิ้งของที่ปล้นมาได้เพื่อหลบหนีอย่างหวุดหวิด"
mpo_nomad_events.1060.c: ""จงนำหนังสัตว์ โยเกิร์ต ม้าชั้นดีมา!""
mpo_nomad_events.1060.c.flavor: "การค้าสินค้าของเรากับถิ่นฐานของ [neighbor.GetTopLiege.GetPrimaryTitle.GetAdjectiveNoTooltip] มี แต่จะให้ประโยชน์แก่เรา"

nomad_trading_mastery_modifier: "เจ้าสัวการค้า"
nomad_trading_mastery_modifier_desc: "ชนร่อนเร่ผู้นี้เข้าใจมูลค่าที่แท้จริงของเหรียญต่างชาติและสินค้าฟุ่มเฟือยเป็นอย่างดี บางทีอาจจะดีกว่าผู้ขายเสียอีก"

nomad_trading_partners_modifier: "ข้อตกลงการค้ากับผู้ตั้งถิ่นฐาน"
nomad_trading_partners_modifier_desc: "ชนร่อนเร่ผู้นี้มีส่วนร่วมอย่างแข็งขันในการค้าผลิตภัณฑ์จากสัตว์เลี้ยงเพื่อแลกกับเครื่องมือ ของฟุ่มเฟือย และเงินตรา"

mpo_nomad_events.1070.t: "พลัดหลงในราตรี"
mpo_nomad_events.1070.desc_intro: "ข้าตื่นขึ้น พร้อมกับลมหายใจของม้าในปากข้า\n\n"
mpo_nomad_events.1070.desc_has_horse: "ขณะที่อาชาของข้า [ROOT.Char.Custom('WarhorseStoryName')]"
mpo_nomad_events.1070.desc_new_horse: "ขณะที่อาชาที่ไม่คุ้นเคยตัวหนึ่ง"
mpo_nomad_events.1070.desc: "กำลังคลอเคลียข้า ลมพัดครวญครางไปทั่ว [ROOT.Char.GetCurrentLocation.GetTerrain.GetNameNoTooltip|l] เราสองอยู่ตามลำพังในป่ารกร้าง\n\nจิตใจของข้าราวกับก้อนหินเรียบ — #EMP เกิดอะไรขึ้น#! ระหว่างพลบค่ำที่แล้วกับรุ่งอรุณอันหนาวเหน็บนี้? ผู้คนของข้า... ทอดทิ้งข้าแล้วหรือ? ไม่! ความทรงจำปรากฏขึ้น"
mpo_nomad_events.1070.desc_spiritual: "นำพากระแสเสียงกระซิบของเหล่าภูตผี บอกเล่าถึงภวังค์อันศักดิ์สิทธิ์ที่ปลุกข้าจากที่นอน พาข้าไปยังม้าตัวหนึ่งที่ยืนอยู่ตามลำพังใต้แสงจันทร์..."
mpo_nomad_events.1070.desc_mental_thing: "เสียงสาปแช่งอันบ้าคลั่งยามเที่ยงคืนของข้าเอง: แม้ญาติพี่น้องจะพยายามปลอบโยนข้า ข้าก็มิอาจอยู่ท่ามกลางพวกเขาได้ ข้าออกไปในราตรีพร้อมกับม้าที่เงียบสงบตัวนี้เท่านั้น..."
mpo_nomad_events.1070.desc_new_drunk: "แบกถ้วย [Glossary( 'คูมิส', 'KUMIS_GLOSS')] หนักอึ้ง เสียงกีบม้า และความรู้สึกของแผงคอสีดำสนิทที่แนบแก้มข้า..."
mpo_nomad_events.1070.a: "เจ้าเป็นสัตว์ที่ซื่อสัตย์ ใช่หรือไม่?"
begin_warhorse_story_tt: "ม้าตัวนี้กลายเป็นตัวโปรดอันเป็นที่รักของท่าน"
mpo_nomad_events.1070.b: "จะไม่มีอีกแล้ว! ข้าสาบาน เจ้าม้า: #EMP จะไม่มีอีกแล้ว!#!"
mpo_nomad_events.1070.c: "เดชานุภาพแห่ง [ROOT.Char.GetFaith.HighGodNamePossessive] ได้นำข้ามายังสถานที่ศักดิ์สิทธิ์แห่งนี้"
mpo_nomad_events.1070.c.flavor: "ข้าไม่จำเป็นต้องตื่นตระหนก มีพลังธรรมชาติที่นี่ ซึ่งข้าเป็นมิตรด้วย และพวกมันจะนำทางข้ากลับบ้าน"
mpo_nomad_events.1070.d: "กลับบ้าน! ชนร่อนเร่มิเคยหลงทาง"
mpo_nomad_events.1070.d.flavor: "แม้เมื่อกะโหลกศีรษะของ [ROOT.Char.GetSheHe] ปวดร้าวเสียจนแทบมองไม่เห็น..."
mpo_nomad_events.1070.d.success: "ท่านตามรอยเท้าม้าของท่านกลับไป"
mpo_nomad_events.1070.d.failure: "ท่านหาทางกลับบ้านไม่พบก่อนค่ำคืนจะกลับมาเยือน"
mpo_nomad_events.1070.e: "แน่นอน เจ้าม้า เจ้าจำทางกลับได้ใช่หรือไม่..."

nomad_alone_in_adversity_modifier: "ไว้วางใจในอาชา"
nomad_alone_in_adversity_modifier_desc: "เมื่ออยู่ในสถานการณ์อันเลวร้าย ชนร่อนเร่ผู้นี้ไม่ไว้วางใจสิ่งใดมากไปกว่าสัญชาตญาณการเอาชีวิตรอดและความเร็วของอาชา"
