l_english: 

mpo_nomad_events.1000.t: "เศียรที่ได้รับการช่วยเหลือ"
mpo_nomad_events.1000.army_camp: "ผู้รอดชีวิตจากการต่อสู้อันนองเลือดที่ [beheaded_warrior_location.GetName] เข้าร่วมกับกองทัพของข้า พวกเขาควบม้าจนแทบสิ้นลมหายใจสุดท้าย จากสายรัดอานม้าของผู้หนึ่งห้อยต่อง แต่งด้วยศีรษะที่ชุ่มโชก — ซึ่งมีใบหน้าอันไร้วิญญาณของ"
mpo_nomad_events.1000.capital: "ผู้รอดชีวิตจากการต่อสู้อันนองเลือดที่ [beheaded_warrior_location.GetName] ส่งข่าวมาจากสมรภูมิ และพร้อมกับข่าวสารนั้น... คือศีรษะอันชุ่มโชกของ"
mpo_nomad_events.1000.family: "[beheaded_warrior.GetFirstName] [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('beheaded_warrior'))] ของข้า"
mpo_nomad_events.1000.vassal: "[beheaded_warrior.GetName] ข้ารับใช้ผู้เคยเกรียงไกรของข้า"
mpo_nomad_events.1000.councillor: "[beheaded_warrior.GetName] ที่ปรึกษาผู้ได้รับความไว้วางใจของข้า"
mpo_nomad_events.1000.generic_knight: "[beheaded_warrior.GetName] [ROOT.Char.Custom('KnightCultureNoTooltip')|l] ผู้ทรงเกียรติของข้า"
mpo_nomad_events.1000.desc: "\n\n"[beheaded_warrior.GetSheHe|U] ตายอย่างนักรบ ต่อสู้ฝ่าเข้าไปในใจกลางกองทัพนักรบของ [beheaded_warrior_foe.GetTitledFirstNamePossessive] จนกระทั่งศีรษะของ [beheaded_warrior.GetHerHis] ถูกฟันออกจากบ่า! ด้วยความรักที่มีต่อ [beheaded_warrior.GetHerHim] เหล่าพลม้าของเราจึงได้นำสิ่งที่พวกเขาสามารถนำกลับมาได้กลับมา"\n\nช่างเป็นจุดจบอันโหดร้าย... แต่เหล่าผู้อาวุโสผู้ปรีชาของเรากล่าวว่าศีรษะของนักรบผู้สูงศักดิ์ยังคงรักษาพลังและความมุ่งมั่นบางส่วนของ [beheaded_warrior.GetHerHis] ไว้"
mpo_nomad_events.1000.a: "ข้าจะให้เกียรติแก่ศีรษะของ [beheaded_warrior.GetWomanMan] ผู้ยิ่งใหญ่นี้"
mpo_nomad_events.1000.a.flavor: "[beheaded_warrior.GetTitledFirstNameNoTooltip] จะถูกวางไว้บนพรมสักหลาดสีขาว ที่ ซึ่งครัวเรือนของข้าจะถวายเครื่องดื่มตามพิธีและประกอบพิธีกรรมให้แก่ [beheaded_warrior.GetHerHim]"
mpo_nomad_events.1000.b: "[beheaded_warrior.GetFirstNameNoTooltip] สมควรอยู่กับผู้คนของ [beheaded_warrior.GetHerHis]"
mpo_nomad_events.1000.c: "ให้เหล่า [ROOT.Char.Custom('KnightCulturePluralNoTooltip')|l] ของข้าเคารพสหายผู้ล่วงลับของพวกเขา"
mpo_nomad_events.1000.d: "จงฝัง [beheaded_warrior.GetFirstNameNoTooltip] ลงดินเสีย"

mpo_warriors_grave_modifier: "สุสานนักรบผู้ถูกตัดเศียร"
mpo_warriors_grave_modifier_desc: "ศีรษะที่ถูกตัดออกจากร่างในการรบ ใบหน้าที่บิดเบี้ยวด้วยเสียงโห่ร้องแห่งสงครามถูกฝังอยู่ในผืนดินนี้ สุสานนี้มักมีครอบครัวที่ผู้เป็นที่รักได้ออกรบมาเยี่ยมเยียนอยู่เสมอ"

mpo_noble_warriors_grave_modifier: "สุสานชนชั้นสูงผู้ถูกตัดเศียร"
mpo_noble_warriors_grave_modifier_desc: "ศีรษะของผู้มีชื่อเสียงสูงส่งที่ถูกตัดออกจากร่างในการรบถูกฝังอยู่ในผืนดินนี้ สุสานของมันเป็นสถานที่ศักดิ์สิทธิ์ เป็นที่รู้จักและมีผู้มาเยี่ยมเยียนอยู่เสมอ"
custom.every_beheaded_family: "สมาชิก [close_family_member|E] ทุกคนของ [beheaded_warrior.GetShortUIName]"

warriors_head_artifact: "เศียรที่เคารพบูชาของ [beheaded_warrior.GetTitledFirstNamePossessiveNoTooltip|U]"
kin_head_artifact_desc: "ใบหน้าที่เน่าเปื่อยจนจำไม่ได้ของ [beheaded_warrior.GetFirstName] หน่อเนื้อเชื้อไขอันเป็นที่รักแห่งตระกูล [beheaded_warrior.GetHouse.GetName] ผู้ถูกสังหารโดยกองกำลังของ [beheaded_warrior_foe.GetNamePossessive] ที่ [beheaded_warrior_location.GetName]"
accolade_head_artifact_desc: "ซากอันน่าสยดสยองของ [beheaded_warrior.GetFirstName] [ROOT.Char.Custom('KnightCultureNoTooltip')|l] ผู้มีชื่อเสียง ซึ่งเป็นที่รู้จักในนาม '[beheaded_warrior_accolade.GetName]' เหล่านักรบของ [beheaded_warrior_foe.GetNamePossessive|U] อ้างเกียรติในการโค่นล้ม [beheaded_warrior.GetHerHim] ในสมรภูมิแห่ง [beheaded_warrior_location.GetName]"
warriors_head_artifact_desc: "ศีรษะที่ถูกสับขาดของ [ROOT.Char.Custom('KnightCultureNoTooltip')|l] [beheaded_warrior.GetFirstName] ผู้กล้าหาญ ซึ่งล้มลงในการต่อสู้กับกองทัพของ [beheaded_warrior_foe.GetNamePossessive] ที่ [beheaded_warrior_location.GetName] ได้รับการปฏิบัติด้วยความเคารพจากเพื่อนนักรบ แม้จะมีกลิ่นเหม็นเน่าก็ตาม"
keep_warrior_head_tt: "ท่านเก็บ [head_artifact.GetName] ไว้"

gain_illustrious_victim_head_artifact_tt: "สามารถเก็บศีรษะของ [victim.GetFirstNamePossessive] ไว้เป็น $illustrious$ [inventory_artifact|E] ได้"
gain_famed_victim_head_artifact_tt: "สามารถเก็บศีรษะของ [victim.GetFirstNamePossessive] ไว้เป็น $famed$ [inventory_artifact|E] ได้"
send_head_for_warscore_tt: "การส่งศีรษะของ [victim.GetFirstNamePossessive] ไปให้ [heir|E] ของ [victim.GetHerHis] อาจเพิ่มการยอมรับ [peace|E] ที่มีต่อ #high ท่าน#! ได้"
send_head_for_vassalization_tt: "การส่งศีรษะของ [victim.GetFirstNamePossessive] ไปให้ [heir|E] ของ [victim.GetHerHis] อาจเพิ่มการยอมรับ [vassalization|E] ได้"
send_head_for_hook_tt: "การส่งศีรษะของ [victim.GetFirstNamePossessive] ไปให้ [heir|E] ของ [victim.GetHerHis] อาจให้ [weak_hook|E] ได้"
send_head_for_prestige_tt: "อาจได้รับ [prestige|E] โดยการส่งศีรษะของ [victim.GetFirstNamePossessive] ไปให้ [heir|E] ของ [victim.GetHerHis]"
send_head_for_obedience_tt: "การส่งศีรษะของ [victim.GetFirstNamePossessive] ไปให้ [heir|E] ของ [victim.GetHerHis] อาจ ทำให้พวกเขา [obedient|E] ได้"
headless_heir_rises_to_challenge_tt: "#N หากผู้รับสาบานว่าจะแก้แค้นอย่างกล้าหาญ:#!"

mpo_nomad_events.1011.t: "การตัดเศียร"
mpo_nomad_events.1011.desc_execution_spite: "[victim.GetName] สบถสาปแช่ง และแม้ขณะที่คมดาบปลิดศีรษะของ [victim.GetHerHis] ก็ยังจ้องมองมาที่ข้าเขม็ง"
mpo_nomad_events.1011.desc_execution_beg: "[victim.GetName] พูดจาอ้อแอ้และอ้อนวอนขอชีวิต จากนั้น ด้วยการฟันอันหนักหน่วงเพียงครั้งเดียว ศีรษะของ [victim.GetHerHis] ก็ถูกตัดออกจากบ่า"
mpo_nomad_events.1011.desc_execution_pray: "ยังคงพึมพำบทสวด [victim.GetName] ถูกบังคับให้คุกเข่าลง จากนั้น การฟันอันหนักหน่วงเพียงครั้งเดียวก็แยกศีรษะของ [victim.GetHerHis] ออกจากบ่า"
mpo_nomad_events.1011.desc_bad_execution: "มิใช่ด้วยการฟันครั้งเดียวอย่างหมดจด แต่ด้วยการฟันอย่างหยาบๆ หลายครั้ง ศีรษะของ [victim.GetNamePossessive] จึงถูกสับออกจากร่างอันน่าสมเพชของ [victim.GetHerHis]"
mpo_nomad_events.1011.desc: "\n\nข้าสบตากับผู้ปกครองชาว [victim.GetCulture.GetName] ขณะที่ดวงตาของพวกเขากลิ้งไปมาเป็นครั้งสุดท้าย ขณะที่โลหิตของ [victim.GetHerHis] ซึมลงสู่พื้นดิน"
mpo_nomad_events.1011.desc_send_head: "\n\nหากผู้สืบทอดของ [victim.GetFirstNamePossessiveNoTooltip] [headless_heir.GetTitledFirstName] ได้ร่วมเห็นภาพอันน่าสยดสยองนี้ — [headless_heir.GetSheHe] อาจจะได้เรียนรู้ที่จะเกรงกลัวอำนาจของข้า เจตจำนงอันดุร้ายดุจหมาป่าของข้า..."
mpo_nomad_events.1011.desc_cant_send: "[victim.GetFirtNameNoTooltip] เป็นเพียงชิ้นเนื้อที่หมดสิ้นประโยชน์ เป็นอาหารของเหล่าอีแร้ง..."
mpo_nomad_events.1011.desc_keep_head: "\n\n...หรือบางทีศีรษะอันมีชื่อเสียงนี้สมควรอยู่กับผู้ที่ [ROOT.Char.GetSheHe] ได้มันมา"
mpo_nomad_events.1011.a: "อย่าให้ผู้ใดลืมเลือน [victim.GetTitleAsNameNoTooltip] ผู้ถูกตัดเศียรนี้"
mpo_nomad_events.1011.a.flavor: "และว่ามันคือ #EMP ข้า#! ผู้นี้นี่เองที่จบชีวิตอันรุ่งโรจน์ของ [victim.GetHerHis]!"
mpo_nomad_events.1011.b: "ส่ง 'ของขวัญ' นี้ไปให้ [headless_heir.GetTitledFirstNameNoTooltip]"
mpo_nomad_events.1011.b.success: "คำดูถูกอันโหดร้ายของท่าน ทำให้ [headless_heir.GetTitledFirstNameNoTooltip] หวาดกลัว"
mpo_nomad_events.1011.b.fail: "[headless_heir.GetTitledFirstNameNoTooltip] สาบานว่าจะแก้แค้นอย่างกล้าหาญ"
mpo_nomad_events.1011.b.flavor: "นายใหม่ของ [victim.GetPrimaryTitle.GetNameNoTierNoTooltip] ต้องรู้จุดจบเพียงอย่างเดียวของศัตรูของข้า! #EMP [headless_heir.GetSheHe|U] จะต้องมองมันให้เต็มตา!#!"
mpo_nomad_events.1011.c: "ทิ้ง [victim.GetFirstNameNoTooltip] ไว้ให้เหล่าอีแร้ง"
headless_heir_high_tier_warning_tt: "@alert_icon! #alert_trial คำเตือน: [headless_heir.GetShortUIName] ไม่เกรงกลัวท่าน!#!"
headless_heir_ignores_challenge_tt: "#P หากผู้รับหดหัวจากคำดูถูกนี้:#!"

mpo_nomad_events.1012.t: "[victim.GetTitleAsNameNoTooltip] กลับมาแล้ว"
mpo_nomad_events.1012.desc: "ข้าจำใจปล่อยให้เลือดเก่าหยดลงบนรองเท้าของข้า จับผิวหนังเย็นชืดด้วยนิ้วมือของข้า — เพราะศีรษะที่ถูกตัดขาดของ [victim.GetName] ได้ถูกส่งกลับมาให้ข้าแล้ว\n\n"คำดูถูก! การหยามเกียรติ!" เสียงร้องตะโกนดังก้องในหูของข้า ขณะที่เด็กๆ ร่ำไห้ เหล่า [ROOT.Char.Custom('KnightCulturePluralNoTooltip')|l] ของข้าเขย่าดาบและสาบานว่าจะแก้แค้น\n\nแต่ศีรษะที่ถูกทำลายนี้ถูกส่งมาเพียงเพื่อสร้างความหวาดกลัวในใจข้าเท่านั้นหรือ? หรือ... [executioner.GetTitledFirstName] ต้องการความเกลียดชังของข้า?"
mpo_nomad_events.1012.a: "การให้เกียรติแก่สิ่งที่เหลืออยู่ของ [victim.GetFirstNamePossessiveNoTooltip] สำคัญที่สุด"
mpo_nomad_events.1012.a_flavor: "'คำดูถูก' นี้เปิดโอกาสให้เราชำระล้าง ประดับตก แต่ง และสวดภาวนาก่อนศีรษะอันสูงศักดิ์ของ [victim.GetTitledFirstNamePossessiveNoTooltip]"
mpo_nomad_events.1012.b: "#EMP คำดูถูกนี้จะต้องได้รับการชำระแค้น!#!"
mpo_nomad_events.1012.b_flavor: "ข้าได้รับใบหน้าอันเปื้อนเลือดแห่งสงคราม เสียงอันไร้วิญญาณของ [victim.GetFirstName] ร้องเรียกหาโลหิตของ [executioner.GetTitledFirstNamePossessive]!"
mpo_nomad_events.1012.c: "ข้าต้องถอย มิฉะนั้นจะต้องเผชิญชะตากรรมนี้..."

peace_acceptance_head_scare_tt: "การยอมรับ [peace|E] ของ [headless_heir.GetShortUINamePossessive] ที่มีต่อ #high ท่าน#!: #P +30#! เป็นเวลา #high 20 ปี#!"
COWED_BY_SEVERED_HEAD_MODIFIER: "หวาดผวาจากการถูกตัดเศียรของบรรพบุรุษ: $VALUE|+=0$"
severed_head_revenge_modifier: "แสวงหาการแก้แค้นให้กับการถูกตัดเศียรของบรรพบุรุษ: $VALUE|+=0$"
severed_head_cb_revenge_tt: "ค่าใช้จ่าย [casus_belli|E] ต่อ #high [executioner.GetShortUIName]#!: #P -75%#!"
severed_head_vassalization_tt: "การยอมรับ [offer_vassalization|E] $ep3_laamps.0010.connector$ #high $demand_tributary_interaction$#! ของ [headless_heir.GetShortUINamePossessive|U] ที่มีต่อ [executioner.GetShortUIName]: #P +200#! เป็นเวลา #high 20 ปี#!"

mpo_nomad_events.1013: "นักฆ่าแห่ง [victim.GetTitledFirstNameNoTooltip]"
mpo_nomad_events.1013.desc_takes_it_sedentary: "ภัยคุกคามอันป่าเถื่อน ทำให้ [headless_heir.Custom('ResidenceBuilding')|l] ของข้ามัวหมอง — ศีรษะที่ถูกฉีกกระชากของขุนนางผู้สูงศักดิ์ บรรพบุรุษของข้าเอง\n\nได้โปรดเถิด จ้าวแห่งอาชา! ใน [headless_heir.GetPrimaryTitle.GetNameNoTier] พวกเราไม่ค่อยจัดการกับเรื่องน่าสยดสยอง เช่นนี้ และไม่ชอบมันเอาเสียเลย ข้าอยากจะเจรจากับท่านอย่างฉันมิตรมากกว่าที่จะถูกลดทอนอย่างโหดร้าย เช่นนี้"
mpo_nomad_events.1013.desc_takes_it: "เหล่า [victim.GetCulture.GetCollectiveNoun] ของ [victim.GetHerHis|U] หวังว่าจะได้เห็นหน้า [victim.GetHerHim] อีกครั้ง บัดนี้ ศีรษะของ [victim.GetHerHis] จมกองเลือด และหัวใจของพวกเขาดำมืดด้วยภาพอันผิดธรรมชาติ\n\nได้โปรดเถิด ให้ [victim.GetFirstName] ได้ไปสู่สุคติใน [headless_heir.GetFaith.PositiveAfterLife] โปรดละเว้นพวกเราจากพระพิโรธอันยิ่งใหญ่ของท่านด้วยเถิด!"
mpo_nomad_events.1013.desc_angeee: "ด้วยการส่งศีรษะของนายแห่ง [victim.GetPrimaryTitle.GetNameNoTierPossessive] มา ท่านได้ส่งใบหน้าอันเปื้อนเลือดแห่งสงครามมาให้ข้า ท่านได้ส่งริมฝีปากสีเทาที่ยังคงกรีดร้องหาการแก้แค้นมาให้ข้า\n\nข้าจะเห็นร่างอันมีชีวิตของเจ้าเน่าเปื่อย ข้าจะโค่นเจ้าเหมือนต้นไม้เก่าแก่\n\nข้าจะวางศีรษะของ [victim.GetFirstNamePossessive] ท่ามกลางกระดูกของเจ้า"
mpo_nomad_events.1013.a.cowed: "ดุจลูกแกะ [headless_heir.GetTitleAsNameNoTooltip] ร้องครวญคราง!"
mpo_nomad_events.1013.a.revenge: "และ ดังนั้น... [headless_heir.GetFirstNameNoTooltip] จึงสาบานว่าจะแก้แค้น"

executed_head_artifact: "เศียรราชันย์ของ [victim.GetTitledFirstNamePossessiveNoTooltip|U]"
executed_head_emperor_artifact_desc: "ยังคงสวมมงกุฎ ริมฝีปากสีเทาและคิ้วที่เสริมด้วยขนม้าถูกเย็บให้อยู่ในท่าทีอันโอหัง ศีรษะที่ถูกตัดขาดของ [victim.GetTitleAsNameNoTooltip] แห่ง [victim.GetPrimaryTitle.GetNameNoTier] สร้างทั้งความยำเกรงและความหวาดกลัว\n\nหากผู้ปกครองผู้ยิ่งใหญ่ เช่นนี้ยังต้องเผชิญชะตากรรมอันน่าสยดสยอง เช่นนี้ ความน่าสะพรึงกลัวใดเล่าจะรอคอยคนอื่นๆ ที่เหลืออยู่?"
executed_head_king_artifact_desc: "สิ่งที่หลงเหลือสุดท้ายของ [victim.GetName] ถูกเก็บรักษาและตก แต่งให้สมกับยศศักดิ์ในชีวิตของ [victim.GetHerHis] เป็นเครื่องยืนยันถึงเจตจำนงอันโหดเหี้ยมของผู้ที่เก็บรักษามันไว้"
nomad_defected_invite_desc: "ท่านเนรเทศตัวละครนี้ภายใน 5 ปีที่ผ่านมา"
nomad_defector_wont_come_back_tt: "ท่านไม่สามารถใช้ #high เชิญเข้าสู่ราชสำนัก#! กับ [rowdy_boy.GetShortUIName] ได้เป็นเวลา #high 5 ปี#!"
nomad_defector_family_tt: "สมาชิกครอบครัวของ [rowdy_boy.GetShortUINamePossessive] ออกจากราชสำนักของท่าน"
nomad_defector_family_wont_come_back_tt: "ท่านไม่สามารถใช้ #high เชิญเข้าสู่ราชสำนัก#! กับผู้ถูกเนรเทศเหล่านี้ได้เป็นเวลา #high 5 ปี#!"
nomad_defector_gain_all_courtiers_tt: "ได้รับเหล่า [courtiers|E] ที่ว่างงานบางส่วนของท่านไป"




mpo_nomad_events.1020.t: "ผู้หิวโหยที่สุดในหมู่พี่น้อง"
mpo_nomad_events.1020.desc: "[rowdy_boy.GetFirstName] [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('rowdy_boy'))] ของข้ากระสับกระส่ายมาพักหนึ่งแล้ว\n\n"แทะกระดูกจากอาหารของท่าน! ดูดนมเปรี้ยวในร่มเงาเยิร์ตของท่าน! นั่นคือชีวิต #EMP ของข้า#! หรือ?" [rowdy_boy.GetSheHe] ถ่มน้ำลาย "ข้าพร้อมที่จะเป็นผู้นำแล้ว [rowdy_boy.Custom2('RelationToMeShort', SCOPE.sC('root_scope'))]! และมีคนในหมู่กองทัพ [ROOT.Char.GetDomicile.GetCulture.GetName] ของท่านที่พร้อมจะติดตามข้า"\n\nนักรบตระกูล [rowdy_boy.GetHouse.GetName] ผู้หยิ่งทะนงที่ข้าเลี้ยงไว้เป็นสัตว์เลี้ยงไร้อำนาจ... กำลังแยกเขี้ยวของ [rowdy_boy.GetHerHis]"

mpo_nomad_events.1020.a: ""เงียบเสีย [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('rowdy_boy'))] จงรู้จักที่ต่ำที่สูงของเจ้า""
mpo_nomad_events.1020.b: ""ผู้ใดท้าทายข้า ผู้นั้น #EMP มิอาจมีชีวิตอยู่ได้!#!""
mpo_nomad_events.1020_duel_tt: "#V ประลองฝีมือ#! กับ [rowdy_boy.GetFirstName]\n@death_icon! #X การประลองนี้เดิมพันด้วยชีวิต!#!\nหากท่านชนะ ท่านจะได้รับ @skill_prowess_icon![prowess|E], @dread_icon![dread|E], @prestige_icon![prestige|E] และ @stress_icon![stress|E] หากท่านแพ้ [rowdy_boy.GetShortUIName] จะยึด [titles|E] ของท่านในฐานะ [primary_heir|E]\n\n[prowess|E] ของท่าน: [prowess_i]#V [root_scope.GetProwess]#!\n[prowess|E] ของ [rowdy_boy.GetFirstNamePossessive]: [prowess_i]#V [rowdy_boy.GetProwess]#!"
mpo_nomad_events.1020.c: ""ข้ามีทุ่งหญ้าเหลือเฟือ""
mpo_nomad_events.1020.c.flavor: "ปล่อยให้เจ้าคนกำเริบเสิบสานนั่นมีฝูงปศุสัตว์ของ [rowdy_boy.GetHerHis] เองเถอะ... ภายใต้อำนาจของข้า"
mpo_nomad_events.1020.d: ""จงขี่ม้าไปให้ไกล และจงสร้างชื่อเสียงให้แก่วงศ์ตระกูลของเจ้า!""
mpo_nomad_events.1020.d.flavor: "[rowdy_boy.GetFirstNameNoTooltip] จักมีทุกสิ่งที่ [rowdy_boy.GetSheHe] ต้องการเพื่อสถาปนา [rowdy_boy.GetHerselfHimself]."
mpo_nomad_events.1020.e: ""เจ้าจะไม่ยอมอยู่ต่อหรือ หาก [rowdy_boy.Custom2('RelationToMeShort', SCOPE.sC('root_scope'))] ของเจ้าปรารถนา เช่นนั้น?""
mpo_nomad_events.1020.e.success: "[rowdy_boy.GetFirstNameNoTooltip] ตกลงที่จะอยู่ต่อและรับใช้"
mpo_nomad_events.1020.e.failure: "[rowdy_boy.GetFirstNameNoTooltip] และผู้สนับสนุนของ [rowdy_boy.GetHerHis] หลบหนีไป"
mpo_nomad_events.1020.f: ""เจ้าถูกเนรเทศ [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('rowdy_boy'))]! ไปให้พ้น!""
mpo_nomad_events.1020.f.flavor: "เส้นทางแห่งอิสรภาพอันป่าเถื่อนและเปลี่ยวเหงารออยู่!"

attacked_family_opinion: "โจมตีสมาชิกครอบครัวของข้า"

mpo_nomad_events.1022.t: "ความตายของคนหัวแข็ง"
mpo_nomad_events.1022.desc: "ดุจเสือดาวที่กระโจนลงจากหน้าผาอย่างไม่ไตร่ตรอง ดุจเหยี่ยวที่โฉบลงจับเงาของตนเอง ดุจอูฐตัวผู้ที่งับส้นเท้าลูกของมัน... ข้าถูกครอบงำด้วยความพิโรธ\n\nเมื่อสิ้นสุดการประลองอันทรงเกียรติของเรา [rowdy_boy.GetFirstName] – [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('rowdy_boy'))] ของข้าเอง – นอนตายอยู่\n\nขณะที่เสียงกลองอันดังกึกก้องแห่งความโกรธแค้นอันชอบธรรมของข้าเริ่มสงบลง ข้าเริ่มได้ยินเสียงคร่ำครวญ ผู้คนของข้าร่ำไห้ต่อข้อพิสูจน์แห่งอำนาจของข้า"
mpo_nomad_events.1022.a: "ข้าได้ทำในสิ่งที่ [ROOT.Char.GetTitleAsNameNoTooltip] ต้องทำแล้ว"

mpo_quelled_family_dissent_modifier: "สังหารญาติผู้เห็นต่าง"
mpo_quelled_family_dissent_modifier_desc: "สมาชิกในครอบครัวผู้ท้าทายอำนาจอันน่าเกรงขามของตัวละครนี้... มีชีวิตอยู่ได้ไม่นาน"

mpo_nomad_events.1030.t: "การศึกษาในสามประการ"
mpo_nomad_events.1030.desc: "ขณะที่ข้าพิจารณาทักษะการรบของเหล่า [ROOT.Char.Custom('KnightCulturePluralNoTooltip')|l] ของข้า [child.GetFirstName] [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('child'))] ของข้าก็ถูกนำตัวมาให้ข้า\n\n"[child.Custom2('RelationToMeShort', SCOPE.sC('root_scope'))|U]" เด็กน้อยถาม "สิ่งใดเล่าคือหัวใจสำคัญในสามประการ"
mpo_nomad_events.1030.desc_mongolic: "[Glossary( 'นาดัม', 'NADAAM_GLOSS')]?"\n\n[ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('child'))] ของข้าอาจอุทิศ [child.GetHerselfHimself] ให้กับการทดสอบอันโหดเหี้ยมของ [Glossary( 'โบฮ์', 'BOKH_GLOSS')]"
mpo_nomad_events.1030.desc_non_mongolic: "กีฬาอันยิ่งใหญ่?"\n\n[ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('child'))] ของข้าอาจอุทิศ [child.GetHerselfHimself] ให้กับการทดสอบอันโหดเหี้ยมของมวยปล้ำ"
mpo_nomad_events.1030.desc.outro: "กับศิลปะอันละเอียดอ่อนของคันธนู... หรือบางที [child.GetSheHe] ควรจะฝึกฝนทักษะการขี่ม้า ซึ่งนำทางฝูงสัตว์ของเราและนำนักรบของเรากลับบ้านอย่างรวดเร็ว?""

NADAAM_GLOSS: "#bold เอริน กูรบัน นาคัม#! หรือ 'สามกีฬาของลูกผู้ชาย' เป็นกีฬาหลักที่ชาวมองโกลฝึกฝนมาตั้งแต่ยุคหินใหม่ และเป็นมหรสพหลักของเทศกาลและการแข่งขันต่างๆ ได้แก่: การยิงธนูประกอบ มวยปล้ำ และการแข่งม้าระยะไกล"
BOKH_GLOSS: "มวยปล้ำแบบดั้งเดิมของชาวมองโกลโบราณ ซึ่งเป้าหมายหลักคือการลากส่วนบนของร่างกายคู่ต่อสู้ลงกับพื้น บางรูปแบบอนุญาตให้ใช้เทคนิคต่างๆ เช่น การจับและเตะขา แต่โดยหลักแล้วเป็นการทดสอบพละกำลังและความมั่นคง และอาจกินเวลานานหลายชั่วโมง"

mpo_nomad_events.1030.a: "ปล่อยให้ข้าฝึกฝน!"
mpo_nomad_events.1030.a.flavor: "การมุ่งมั่นจนหอบเหนื่อยและปวดเมื่อยคือสิ่งสำคัญที่สุด!"
mpo_nomad_events.1030.b: "จงพิสูจน์ว่าเจ้าสามารถยืนหยัดมั่นคงดุจภูผา"
mpo_nomad_events.1030.c: "เจ้าจะชนะอาหารเย็นด้วยลูกธนูของเจ้า"
mpo_nomad_events.1030.c.flavor: "มาร์มอตนั้นฉลาดแกมโกงกว่าเป้าหมายใดๆ ในระยะยิงของเรา... แต่อย่างน้อยมันก็เป็นเป้าหมายที่ใหญ่กว่า"
mpo_nomad_events.1030.d: "จงได้รับความไว้วางใจจากอาชาเถิด [child.Custom('GirlBoy')]"
mpo_nomad_events.1030.d.flavor: "และบนหลังม้าที่เชื่อฟังของเจ้า เจ้าอาจจะขับขานบทเพลงและเข้าร่วมการแข่งม้าระยะไกลได้"


