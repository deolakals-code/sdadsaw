 mpo_nomad_events.1040.t: "บ้านนอกทุ่งหญ้าสเตปป์"
  mpo_nomad_events.1040.desc_duchy: "#EMP ไสหัวไป, [defender.GetTitledFirstName]!#! ออกไปพร้อมกับพวกขี้ขลาด ออกไปพร้อมกับ[defender.Custom('MistressMaster')]ผู้พ่ายแพ้แห่งสถานที่นี้! [ROOT.Char.GetTitleAsName] คนใหม่จะปกครองพวก[expelled_culture.GetCollectiveNoun]ที่อ่อนแอของ[defender.GetHerHis]แล้ว พวกมันจะต้องเรียนรู้ที่จะเอาใจ[ROOT.Char.GetHerHim] มิฉะนั้นพวกมันจะได้พบว่านี่เป็นเพียงรุ่งอรุณแห่งการถูกจองจำของพวกมันเท่านั้น!\n\n[target.GetBaseNameNoTier] จะเป็นบ้านที่ยอดเยี่ยมสำหรับผู้คนของข้า เราจะไม่ต้องถูกพัดพาไปเหมือนฝุ่นบนที่ราบอีกต่อไป! ที่นี่ ชีวิตที่ตั้งรกรากเป็นของเรา และหยาดเหงื่อแรงงานของคนท้องถิ่นจะรับใช้ความสะดวกสบายของเรา\n\nใน [ROOT.Char.GetCapitalLocation.GetName] ภายใน [ROOT.Char.Custom('ResidenceBuilding')] อันโอ่อ่าที่ปกครองเหนือ [ROOT.Char.GetCapitalLocation.GetTerrain.GetNameNoTooltip|l] ร่างกายที่เหนื่อยล้าจากสงครามของข้าจะได้พักผ่อน... ขณะที่จิตใจของข้าเริ่มครุ่นคิด"
 mpo_nomad_events.1040.desc: "#EMP ไสหัวไป, [defender.GetTitledFirstName]! ไสหัวไปซะ พวก[expelled_culture.GetCollectiveNoun]!#! จงแบกเด็กอ้วนท้วนของพวกเจ้าไว้บนบ่า ทิ้งความมั่งคั่งของพวกเจ้าไว้เบื้องหลัง จงหนีจากผู้ขี่ม้าชาว[ROOT.Char.GetCulture.GetName] และลูกธนูของ[dummy_soldier.GetHerHis]ซะ!\n\n[target.GetBaseNameNoTier] ถูกทิ้งไว้ให้ผู้คนของข้า เราจะไม่ต้องถูกพัดพาไปเหมือนฝุ่นบนที่ราบอีกต่อไป! ที่นี่ ชีวิตที่ตั้งรกรากเป็นของเรา: หยาดเหงื่อแรงงานของคนท้องถิ่นที่เหลืออยู่และสามัญชนของเราเองจะรับใช้ความสะดวกสบายของเรา\n\nใน [ROOT.Char.GetCapitalLocation.GetName] ภายใน [ROOT.Char.Custom('ResidenceBuilding')] อันโอ่อ่าที่ปกครองเหนือ [ROOT.Char.GetCapitalLocation.GetTerrain.GetNameNoTooltip|l] ร่างกายที่เหนื่อยล้าจากสงครามของข้าจะได้พักผ่อน... ขณะที่จิตใจของข้าเริ่มครุ่นคิด"
 mpo_nomad_events.1040.desc_tribal: "ที่ ซึ่ง [ROOT.Char.GetTitleAsNameNoTooltip] ผู้ตั้งรกรากจะค้นพบความแข็งแกร่ง"
 mpo_nomad_events.1040.desc_clan: "ตระกูลขุนนางของ [ROOT.Char.GetTitleAsNamePossessiveNoTooltip] และภาษีอากรมากมายของ [ROOT.Char.GetHerHis]"
 mpo_nomad_events.1040.desc_feudal: "กฎหมายของ [ROOT.Char.GetTitleAsNameNoTooltip] ในระบบฟิวดัล"

 mpo_nomad_events.1040.a: "การร่อนเร่ของผู้คนของข้าสิ้นสุดลงที่นี่"

