 mpo_fertility_dance_county_modifier_desc: "มีการชุมนุมครั้งใหญ่เกิดขึ้นในเคาน์ตีนี้ และทุกคนได้แบ่งปันความรู้ในฐานะคนเลี้ยงสัตว์"

