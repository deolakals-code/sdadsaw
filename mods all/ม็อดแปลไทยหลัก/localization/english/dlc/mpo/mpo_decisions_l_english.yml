 mpo_decisions_events.0202.learning_situation_2_flavor: "ท่านเสนอให้ศึกษาการออกแบบของเครื่องมือล้อม มองหาจุดอ่อนหรือแม้นวัตกรรมใหม่"
 mpo_decisions_events.0202.intrigue_situation_2: "หากอำนาจของพวกเขาอยู่ที่อาวุธ ก็จงแย่งชิงมันมาเสีย"
 mpo_decisions_events.0202.intrigue_situation_2_flavor: "ท่านเสนอต่อ [situation_alerter.GetFirstNameNoTooltip] ว่าท่านจะก่อวินาศกรรมเครื่องมือล้อม"
 mpo_decisions_events.0202.none_situation_2: "อพยพพลเรือน และปล่อยให้กำแพงพังทลายไป"
 mpo_decisions_events.0202.none_situation_2_flavor: "ท่านอธิบายให้ [situation_alerter.GetFirstNameNoTooltip] ฟังว่าท่านจะช่วยชีวิตผู้คน และปล่อยให้ศัตรูยึดป้อมปราการไป"
 mpo_decisions_events.0202.martial_situation_3: "รวบรวมผู้ภักดี และนำการต่อสู้ไปหาพวกมัน!"
 mpo_decisions_events.0202.martial_situation_3_flavor: "ท่านอธิบายให้ [situation_alerter.GetFirstNameNoTooltip] ฟังว่าท่านจะไม่เสียเวลาในการหยุดยั้งคนทรยศ"
 mpo_decisions_events.0202.learning_situation_3: "เรียนรู้แผนการของพวกมัน และ ทำให้แน่ใจว่ามันจะล้มเหลว"
 mpo_decisions_events.0202.learning_situation_3_flavor: "ท่านเสนอต่อ [situation_alerter.GetFirstNameNoTooltip] ว่าท่านจะวิเคราะห์แผนของศัตรู และหาทางหยุดยั้งมันจากระยะไกล"
 mpo_decisions_events.0202.intrigue_situation_3: "แสร้งเป็นพันธมิตรกับคนทรยศ และทำลายพวกมันจากภายใน"
 mpo_decisions_events.0202.intrigue_situation_3_flavor: "ท่านเสนอต่อ [situation_alerter.GetFirstNameNoTooltip] ว่าท่านจะแทรกซึมเข้าไปในหมู่คนทรยศ และก่อวินาศกรรมแผนการของพวกมัน"
 mpo_decisions_events.0202.none_situation_3: "จงให้ทุกคนรู้ถึงแผนการของเหล่าคนขลาด!"
 mpo_decisions_events.0202.none_situation_3_flavor: "ท่านอธิบายให้ [situation_alerter.GetFirstNameNoTooltip] ฟังว่าท่านจะเปิดโปงคนทรยศ และปล่อยให้ประชาชนตัดสินชะตากรรมของพวกมัน"

 mpo_decisions_events.0203.t: "ช่วงเวลาอันเงียบสงบ"
 mpo_decisions_events.0203.desc_intro: "จิตใจของข้าล่องลอยไปจากสนามรบ และข้าพบว่าตนเองอยู่ในสถานที่อันเงียบสงบ ข้าอยู่ตามลำพัง และมีเพียงเสียงใบไม้เสียดสีกันในสายลมด้านนอก"
 mpo_decisions_events.0203.desc: "โลหิตหลั่งไหลในสมรภูมิเหล่านี้ และชีวิตนับไม่ถ้วนต้องสูญสิ้นไป แต่มิใช่การสูญเปล่า และมิใช่ด้วยความเพลิดเพลิน ในยามนี้ข้าต้องระลึกถึงใบหน้าของผู้ที่ล้มหาย และนามของผู้ที่รอดชีวิต\n\nข้ากำลังทำสิ่งนี้เพื่อผู้ใด และด้วยเหตุผลใด?"
 mpo_decisions_events.0203.desc_mentor: "[commander_trait_mentor.GetNameNoTooltip] นั่งอยู่ใกล้ๆ และจ้องมองข้าอย่างตั้งใจ "ข้าเห็นเจ้ากำลังเป็นทุกข์" [commander_trait_mentor.GetSheHe] กล่าว "แต่เจ้าต้องถามตนเองว่า เจ้ากำลังต่อสู้เพื่อผู้ใด และด้วยเหตุผลใด?""
 mpo_decisions_events.0203.a: "เพื่อรับรองว่า [heir_person.GetName] จะได้ปกครอง เช่นเดียวกับข้า"
 mpo_decisions_events.0203.b: "เพื่อที่ข้าจะได้กลับไปหา [love_person.GetFirstName] [ROOT.Char.Custom2('RelationToMeShort', love_person)] ของข้า"
 mpo_decisions_events.0203.c: "เพื่อสังหารเหล่าศัตรูของข้า"
 mpo_decisions_events.0203.c_rival: "ตัวข้าเอง เพื่อที่ข้าจะได้มีชีวิตอยู่เพื่อชื่นชมยินดีในความตายของ [hate_person.GetNamePossessive]"
 mpo_decisions_events.0203.d: "เพื่อความรุ่งโรจน์แห่ง [ROOT.Char.GetPrimaryTitle.GetNameNoTier]!"
 mpo_decisions_events.0203.d_landless: "เพื่อเหล่าประชาราษฎร์ที่ข้านำพา"
 mpo_decisions_events.0203.e: "เพื่อเป็นเกียรติแด่ [ROOT.Char.GetFaith.HighGodName]!"
 mpo_decisions_events.0203.sentiment: "เพราะ [target_person.GetFirstName] ก็รู้สึก เช่นเดียวกัน:"
