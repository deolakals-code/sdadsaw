mpo_decisions_events.0020.t: "เปิดตัวทายาท"
mpo_decisions_events.0020.desc: "เลือดเนื้อเชื้อไขของข้า, [heir.GetFirstName] [ROOT.Char.Custom2('RelationToMeShort', loc_heir)] ของข้า, วันหนึ่งจักต้องเรียกร้องความภักดีจากผู้คนทั้งปวงในวงศ์ตระกูล [ROOT.Char.GetHouse.GetName] และจากชนชาติอื่นอีกมาก หากปราศจากสหายผู้เข้มแข็งคอยหนุนหลัง [heir.GetHerHim] แล้วไซร้ คำกล่าวของทายาทข้าอาจมิมีผู้ใดรับฟัง\n\nขณะที่เราขึ้นหลังอาชา ข้าได้นับจำนวนผู้ที่ยังภักดีต่อข้า"
mpo_decisions_events.0020.desc_multiple: "[target_1.GetTitledFirstName] ผู้ [target_1.Custom('ComplimentAdjective')] จะต้องให้ [heir.GetFirstNameNoTooltip] นั่งใกล้กองไฟของ [target_1.GetHerHis] เป็นแน่ แต่ผู้ใดเล่าที่ [heir.GetSheHe] #EMP จักต้อง#! สร้างความประทับใจให้มากที่สุด...?"
mpo_decisions_events.0020.desc_one: "พวกเขามีน้อยนัก และมีเพียงผู้เดียวที่ข้าไว้วางใจอย่างแท้จริง..."
