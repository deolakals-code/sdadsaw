 mpo_pax_mongolica_decision_tooltip: "ช่วยสร้างนครต่างๆ ในทุ่งหญ้าสเตปป์อันยิ่งใหญ่"
 pax_mongolica_ruler_modifier: "$mpo_nomad_legacy_5_name$"
 pax_mongolica_ruler_modifier_desc: "ตัวละครนี้ได้สร้างความมั่นใจว่านครต่างๆ ในทุ่งหญ้าสเตปป์อันยิ่งใหญ่มีการเชื่อมต่อที่ดี"
