 mpo_pax_mongolica_decision: "$mpo_nomad_legacy_5_name$"
 mpo_pax_mongolica_decision_desc: "ความรุ่งโรจน์แห่งราชวงศ์ของเราส่องประกายเหนือทุ่งหญ้าสเตปป์อันยิ่งใหญ่ นครทั้งหลายจักเจริญรุ่งเรือง ณ ที่ ซึ่งเคยเหลือเพียงเถ้าถ่าน\n\nเหล่าด่านหน้าจักถูกสถาปนาขึ้นเพื่อขับขานถึงความเมตตาปรานีของข่านเหนือข่านทั้งปวง"
