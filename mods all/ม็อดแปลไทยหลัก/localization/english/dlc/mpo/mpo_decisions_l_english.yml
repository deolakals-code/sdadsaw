 mpo_decisions_events.0300.t: "พิธีกรรมแห่งผืนดิน"
 mpo_decisions_events.0300.desc: "[shaman.GetTitledFirstName] แหงนมองท้องฟ้า ขับขานบทสวดแสดงความภักดีของ [shaman.GetHerHis] ต่อ [shaman.GetFaith.FertilityGodName]\n\n"บัดนี้ให้เราระลึกถึงวิธีที่บรรพชนของเราดูแลผืนดินนี้เป็นอย่างดี" [shaman.GetSheHe] กล่าว เชื้อเชิญให้ผู้อื่นแบ่งปันคำแนะนำ\n\n"เหล่าปู่ย่าตายายของเราได้เรียนรู้อะไรเกี่ยวกับลูกแกะแรกเกิดบ้าง? เหล่าทวดป้าน้าอาของเรากล่าวถึงผืนดินว่าอย่างไร?""
 mpo_decisions_events.0300.tt: "การชุมนุมใน [fertility_county.GetName] ได้เริ่มขึ้นแล้ว"
 mpo_decisions_events.0300.a: "[shaman.GetFaith.FertilityGodName] โปรดช่วยให้เราระลึกได้ด้วยเถิด"
 mpo_decisions_events.0300.b: "ข้าจะเข้าร่วมกับ [shaman.GetNameNoTooltip] ในการรำลึกของ [shaman.GetHerHis]"
 mpo_decisions_events.0300.b_tt: "ผลลัพธ์ของการชุมนุมจะมี #V ประสิทธิผลยิ่งขึ้น#!"
