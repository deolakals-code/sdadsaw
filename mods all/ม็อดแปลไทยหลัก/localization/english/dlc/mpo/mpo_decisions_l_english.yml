 mpo_decisions_events.0021.t: "ธรรมเนียมการทักทาย"
 mpo_decisions_events.0021.desc_intro: "ขณะที่ [friendship_target.GetSheHe] จัดเตรียมอาหารและเครื่องดื่มต้อนรับ"
 mpo_decisions_events.0021.desc_warm: "[ROOT.Char.Custom2('RelationToMe', friendship_target)] ของข้า [friendship_target.GetTitledFirstName] ดูเหมือนจะสงสัยว่าจะทำอย่างไรกับพวกเราดี [friendship_target.GetSheHe|U] นำเสนอของที่จับได้ในวันนั้นแก่เรา เราสนทนากันถึงเรื่องการล่าครั้งใหญ่ในอดีต [ROOT.Char.Custom2('RelationToMe', loc_heir)] ของข้าพูดน้อยและยิ้มอย่างเงียบๆ"
 mpo_decisions_events.0021.desc_cold: "[ROOT.Char.Custom2('RelationToMe', friendship_target)] ของข้า [friendship_target.GetTitledFirstName] นั้นดูอมทุกข์และเฉยเมยดุจกองหินเก่าแก่ และ แม้ว่า [ROOT.Char.Custom2('RelationToMeShort', loc_heir)] ของข้าจะล่วงรู้เจตนาของข้า [heir.GetFirstName] ก็เพียง แต่ [heir.Custom('quirk_pos_present')] จากนั้นก็ซึมซับความอบอุ่นจากกองไฟอย่างเงียบๆ"
 mpo_decisions_events.0021.desc: "\n\nเป็นข้าเองที่ต้องต้อนอาชาทั้งสองนี้เข้าคอกเดียวกัน ผู้ ซึ่งต้องสร้างความไว้วางใจให้ยืนยงกว่าชีวิตของข้า..."
 mpo_decisions_events.0021.a.success: "ท่านช่วยให้ [friendship_target.GetFirstNameNoTooltip] มองเห็นคุณสมบัติอันสูงส่งที่สุดของ [heir.GetFirstNamePossessiveNoTooltip]"
 mpo_decisions_events.0021.a: "เพียงคำพูดของข้าเท่านั้นที่จะผูกพันพวกเขาทั้งสองไว้ด้วยกัน"
 mpo_decisions_events.0021.a.flavor: "อาศัยความเชี่ยวชาญด้านการทูตของท่าน"
 mpo_decisions_events.0021.a.fail: "การปรากฏตัวของท่านบดบังรัศมีของ [heir.GetFirstNamePossessiveNoTooltip]"
 mpo_decisions_events.0021.b: ""เช่นเดียวกับท่าน [heir.GetFirstNameNoTooltip] ก็เป็น [lifestyle_trait.GetNameNoTooltip( loc_heir )|l]!""
 mpo_decisions_events.0021.b.flavor: "อาศัยความคล้ายคลึงกันระหว่างทายาทของท่านและ [ROOT.Char.Custom2('RelationToMeShort', friendship_target)] ของท่าน: ต่างก็เป็น [lifestyle_trait.GetNameNoTooltip( loc_heir )|l]"
 mpo_decisions_events.0021.b.success: "[heir.GetFirstNameNoTooltip] และ [friendship_target.GetFirstNameNoTooltip] เพลิดเพลินกับงานอดิเรกที่ทำร่วมกัน"
 mpo_decisions_events.0021.b.fail: "พวกเขาทะเลาะวิวาทและบาดหมางกัน"
 mpo_decisions_events.0021.c: "ทั้งสองต่างมีทักษะในกีฬาพื้นบ้าน"
 mpo_decisions_events.0021.c.flavor: "อาศัยประสบการณ์ [GetTrait('tourney_participant').GetName( GetNullCharacter )] ที่ทั้งสองมีร่วมกัน"
 mpo_decisions_events.0021.c.success: "มิตรภาพก่อเกิดจากการแข่งขัน"
 mpo_decisions_events.0021.c.fail: "[heir.GetFirstNameNoTooltip] และ [friendship_target.GetFirstNameNoTooltip] ปฏิบัติต่อกันอย่างหยาบกระด้างเกินไป"
 mpo_decisions_events.0021.d: "ทั้งสองช่างคล้ายคลึงกันยิ่งนัก"
 mpo_decisions_events.0021.d.flavor: "อาศัยลักษณะนิสัยที่ทั้งสองมีร่วมกัน"
 mpo_decisions_events.0021.d.success: "[heir.GetFirstNameNoTooltip] และ [friendship_target.GetFirstNameNoTooltip] ผูกสัมพันธ์กันผ่านลักษณะนิสัยที่คล้ายคลึงกัน"
 mpo_decisions_events.0021.d.fail: "ความคล้ายคลึงของพวกเขามิได้กระตุ้นความรู้สึกใดๆ"
 mpo_decisions_events.0021.e: ""เราต่างมีสายสัมพันธ์อันล้ำค่า และมัน #EMP จักต้อง#! ยั่งยืน""
 mpo_decisions_events.0021.e.flavor: "อาศัยสายสัมพันธ์ทางวัฒนธรรม ครอบครัว และส่วนตัวระหว่างท่านกับ [friendship_target.GetTitledFirstNameNoTooltip]"
 mpo_decisions_events.0021.e.success: "ท่านขยายความเรื่องเครือญาติกับ [friendship_target.GetFirstNameNoTooltip] ได้อย่างง่ายดาย"
 mpo_decisions_events.0021.e.fail: "[heir.GetFirstNameNoTooltip] มองเห็นเพียงคนแปลกหน้าที่เป็นมิตร"
 mpo_decisions_events.0021.f: "ของกำนัลจักช่วยยกระดับจิตใจของพวกเขา..."
 mpo_decisions_events.0021.f.flavor: "อาศัยความสุขเกษมจากความมั่งคั่ง"

 heir_friend_will_not_become_friends_tt: "[heir.GetFirstNameNoTooltip] และ [friendship_target.GetFirstNameNoTooltip] ยังมิได้เป็น [friends|E]"

 mpo_heir_friend_if_accept_tt: "หาก [friendship_target.GetShortUIName] ตอบรับ:"
 mpo_heir_friend_if_do_not_accept_tt: ""หาก [friendship_target.GetShortUIName] ไม่ตอบรับ:""

 mpo_decisions_events.0022.t: "ผู้มาเยือนจาก [root_scope.GetCapitalLocation.GetNameNoTooltip]"
 mpo_decisions_events.0022.desc_intro: "[ROOT.Char.Custom2('RelationToMeShort', root_scope)] ของข้า [root_scope.GetName] ได้มาเยือน [ROOT.Char.GetCapitalLocation.GetName] [heir.GetFirstName] ทายาทผู้ [heir.Custom('ComplimentAdjective')] ของ [root_scope.GetHerHis] โอบกอดข้า\n\nขณะที่ข้าพันผ้า [Glossary( 'คาตัก', 'KHATAG_GLOSS' )] รอบนิ้วนางและยื่นปลายผ้าเพื่อทักทาย"
 KHATAG_GLOSS: "ผ้าพันคอตามพิธีการทำจากผ้าไหมหรือหนังแกะ อันแสดงถึงความเคารพ ใช้เป็นของขวัญ เครื่องแสดงการต้อนรับ และเครื่องบูชาในสถานที่ศักดิ์สิทธิ์ #G ผ้าคาตัก#! มีต้นกำเนิดในทิเบต แต่ได้รับการยอมรับจากทั้งชาวพุทธและผู้ปฏิบัติตามลัทธิเตงริในทุ่งหญ้าสเตปป์ยูเรเชีย"
 mpo_decisions_events.0022.desc_personal_charm: "[root_scope.GetFirstNameNoTooltip] กล่าวถึง [root_scope.Custom2('RelationToMe', loc_heir)] ของตนอย่างสูงส่งว่า "ช่างเป็นชาว [heir.GetCulture.GetName] ที่แท้จริง! เป็น [heir.GetWomanMan] ผู้ถูกลิขิตโดยโชคชะตา! ข้าได้บอก [heir.GetFirstNameNoTooltip] ถึงการปกครองอัน [friendship_target.Custom('ComplimentAdjective')] ของท่านแล้ว [heir.GetSheHe|U] ปรารถนาที่จะรู้จักท่านให้ดียิ่งกว่าข้าเสียอีก""
 mpo_decisions_events.0022.desc_lifestyle: "[heir.GetFirstNameNoTooltip] กล่าวว่า "[lifestyle_trait.GetNameNoTooltip( loc_heir )|l] ผู้หนึ่งทักทายอีกผู้หนึ่ง! เราจะร่วมกันสนทนาถึงอำนาจและเครือญาติ และทำในสิ่งที่เราทั้งสองรักอย่างแท้จริง""
 mpo_decisions_events.0022.desc_sports: "[heir.GetFirstNameNoTooltip] เชิญข้าไปยังทุ่งโล่ง "ท่านและข้าต่างเป็นนายแห่งกีฬาเดียวกัน! ขณะที่เราสนทนาถึงเครือญาติและอำนาจ ขอให้เราได้ฝึกปรือทักษะของชาว [ROOT.Char.GetCulture.GetName]!""
 mpo_decisions_events.0022.desc_shared_traits: "[root_scope.GetFirstNameNoTooltip] หัวเราะ "[heir.GetFirstNameNoTooltip] คือเงาสะท้อนของท่านในผืนน้ำอย่างแท้จริง! [heir.GetSheHe|U] มีพฤติกรรมเหมือนกันทุกประการ ข้าบอก [heir.GetHerHim] เสมอว่า ท่านต่างหากที่คล้ายคลึงกับเขา ผู้ที่จะเข้าใจเขาได้ดีที่สุด และสนับสนุนเขาได้มากที่สุด!""
 mpo_decisions_events.0022.desc_kinship: "[heir.GetFirstNameNoTooltip] บีบไหล่ข้าแน่น\n\n"สำหรับ [heir.Custom2('RelationToMeShort', root_scope)] ของข้า ท่านคืออาชาผู้ภักดีที่ไม่ยอมออกนอกลู่นอกทาง แต่ท่านจะยังคงอยู่เคียงข้างพวกเราในอีกหลายปีข้างหน้าหรือไม่? ท่านจะตามหาข้าหรือไม่เมื่อร่างกายของ [root_scope.GetHerHis] เย็นชืดลง?""
 mpo_decisions_events.0022.desc_gift: "[root_scope.GetFirstNameNoTooltip] มอบ [Glossary( 'ดีลส์', 'DEEL_GLOSS' )] บุผ้าแคชเมียร์และบังเหียนม้าขาวสองตัวให้แก่ข้าและ [heir.GetFirstNameNoTooltip] "ในเมื่อท่านทั้งสองมั่งคั่งเหมือนกัน" [root_scope.GetSheHe] กล่าว "ก็ขอให้ท่านทั้งสองเป็นมิตรกันดุจเดียวกัน เพราะความมั่งคั่งจะเติบโตได้ก็ด้วยมิตรภาพเท่านั้น""
 DEEL_GLOSS: "เสื้อคลุมยาวพับทบกัน ซึ่งเป็นเครื่อง แต่งกายตามประเพณีของชนชาติในทุ่งหญ้าสเตปป์ สวมใส่โดยทั้งบุรุษและสตรี"
 mpo_decisions_events.0022.desc_outro: "\n\nผู้มาเยือนทั้งสองของข้ายังคงเล่าต่อไป ถึงเรื่องที่ [heir.GetFirstNameNoTooltip] จะได้เป็นผู้นำ [root_scope.GetHouse.GetName] ในวันหนึ่ง... และถึงตำแหน่งอันทรงเกียรติที่ข้าจะได้รับใน [root_scope.Custom('ResidenceBuilding')|l] ของ [heir.GetHerHis]"

 mpo_decisions_events.0022.a: ""#EMP วาจาใดๆ จงเลือนหาย!#! สายสัมพันธ์ของเราจักถูกสร้างขึ้นด้วยโลหิต""
 mpo_decisions_events.0022.b: ""เพื่อ [heir.GetSheHe] ผู้ ซึ่งถูกสัญญาไว้ ข้ายินดีเชื่อฟัง [root_scope.GetTitleAsNameNoTooltip] ของข้า!""
 mpo_decisions_events.0022.c: ""ขอให้ท่านกลับมาบ่อยครั้ง เพื่อนั่งข้างกองไฟของข้า""
 mpo_decisions_events.0022.d: "เราจะมีการสนทนาที่ให้ความกระจ่างแจ้งในเย็นนี้ หาได้มีสิ่งอื่นใดไม่"

 cultural_acceptance_friendly_visit: "การเยี่ยมเยียนฉันมิตรระหว่างขุนนาง"

 mpo_decisions_events.0023.t: "เหนือกว่าธรรมเนียมปฏิบัติ"
 mpo_decisions_events.0023.desc: "ถ่านไฟคุสุดท้ายยังคงคุโชน\n\nเราได้ร่วมรับประทานอาหารและสนทนากันจนดึกดื่น ปลุกเด็กๆ ที่หลับใหลให้ตื่นด้วยเสียงหัวเราะของเรา และ ทำให้พวกเขาหวาดผวาด้วยการขับร้องเพลงคอของเรา ข้าแทบไม่จำเป็นต้องขับร้อง หรือแม้ แต่พูดจา เมื่อ [friendship_target.GetTitledFirstName] และ [heir.GetFirstName] พูดคุยกันถึงความสนุกสนานในวันนี้ และฝันถึงสิ่งที่จะเกิดขึ้นในภายภาคหน้า\n\nค่ำคืนนี้ข้าได้นำพาสองดวงวิญญาณอันสูงส่งมาสู่มิตรภาพ"
 mpo_decisions_events.0023.desc_fail: "ถ่านไฟคุสุดท้ายยังคงคุโชน\n\nถึงกระนั้น เสียงหัวเราะก็ยังคงแผ่วเบา ถ้อยคำก็น่าฟัง แต่กลับโบยบินจากไปอย่างง่ายดายดุจดั่งปักษาตัวน้อย แม้ข้าจะพยายามชักจูงเพียงใด หัวใจอัน [friendship_target.Custom('ComplimentAdjective')] ของ [friendship_target.GetFirstName] ดูเหมือนจะถูกซ่อนเร้นจากทายาทของข้า\n\nข้าทำได้เพียงหวังว่า เมื่อข้าเหลือเพียงเถ้าธุลีและกระดูก พวกเขาอาจจะสามารถสร้างมิตรภาพขึ้นได้ในยามนั้น"
 mpo_decisions_events.0023.desc_accidental_friend: "บางที [ROOT.Char.Custom2('RelationToMeShort', accidental_friend)] ของข้า ผู้ ซึ่ง [friendship_target.GetTitledFirstName] #EMP ดูจะ#! หลงใหลอย่างที่สุด อาจจะนำพา [heir.GetFirstName] เข้าสู่กลุ่มเดียวกันนั้นก็เป็นได้!"

 mpo_decisions_events.0023.a: "ผู้สนับสนุนผู้ภักดีสำหรับ [heir.GetFirstNameNoTooltip]"
 mpo_decisions_events.0023.a_fail: "น่าผิดหวัง แต่ค่ำคืนนี้ก็ยังคงรื่นเริง"

 EVENT_WINDOW_OPTION_AVAILABLE_HASTILUDER: "ตัวเลือกนี้มีให้ เนื่องจากประสบการณ์ [GetTrait('tourney_participant').GetName( GetNullCharacter )]"

 study_commander_trait_decision: "ฝึกฝนศาสตร์แห่งการบัญชาการ"
 study_commander_trait_decision_desc: "ผู้คนแห่ง [ROOT.Char.GetPrimaryTitle.GetNameNoTier] เป็นภาพสะท้อนของผู้นำของพวกเขา ข้ามิอาจนิ่งดูดาย ในขณะที่พลเมืองของข้าล้มตายเพื่อแผ่นดิน และแม่ทัพนายกองของข้าก็มิได้เรียนรู้จากความผิดพลาด ข้าจักต้องกุมบังเหียน และนำพาพวกเขาไปสู่ความยิ่งใหญ่"
 study_commander_trait_decision_tooltip: "ได้รับ [stress|E] เพื่อแลกกับโอกาสในการได้รับ [commander_trait|E]"
 study_commander_trait_decision_confirm: "สู่ชัยชนะ!"
 study_commander_trait_decision_effect: "ท่านจะเริ่มการเดินทางที่ [Concept('stress','stressful')|E] เพื่อโอกาสในการได้รับ [commander_trait|E]"

 mpo_decisions_events.0200.t: "สู่ $study_commander_trait_decision$"
 mpo_decisions_events.0200.desc: "ข้ามุ่งหน้าไปยังคลังสรรพาวุธ เลือกดาบชั้นดีจากชั้นวาง ข้าสังเกตเหล่าทหาร การเคลื่อนไหว ความมึนเมา และการขาดวินัยของพวกเขา ก่อนที่ข้าจะรู้สึกขยะแขยง ข้าต้องเรียนรู้ที่จะนำพวกเขาเสียก่อน เหตุใดชายผู้หนึ่งจะใส่ใจปฏิบัติตามกฎหมาย หากกฎหมายมิได้ติดตามเขาไปเล่า?\n\nขณะที่ข้าจากมา ข้าสังเกตเห็น [commander_trait_mentor.GetName] เฝ้ามองข้าอยู่ แต่ไกล [commander_trait_mentor.GetSheHe|U] เป็นนักรบที่น่าเกรงขาม แม้จะอยู่ท่ามกลางผู้อ่อนแอในคลังสรรพาวุธนี้ บางที [commander_trait_mentor.GetSheHe] อาจสอนอะไรข้าได้บ้าง"
 mpo_decisions_events.0200.desc_my_mentor: "[commander_trait_mentor.GetSheHe|U] เคยช่วยเหลือข้าในความพยายามนี้มาก่อน ดังนั้นข้าอาจจะไปพบ [commander_trait_mentor.GetHerHim] อีกครั้ง"
 mpo_decisions_events.0200.desc_mentor: "[commander_trait_mentor.GetSheHe|U] เคยช่วยเหลือผู้อื่นในความพยายามนี้มาก่อน ดังนั้น [commander_trait_mentor.GetSheHe] จึงมีชื่อเสียงดี"
 mpo_decisions_events.0200.mentor: "ดูเหมือนว่า [commander_trait_mentor.GetSheHe] จะได้ศิษย์เอกคนใหม่"
 mpo_decisions_events.0200.my_mentor: "เราพบกันอีกแล้ว ท่าน [commander_trait_mentor.GetTitledFirstName]"
 mpo_decisions_events.0200.mentor_flavor: "ท่านขอความช่วยเหลือจาก [commander_trait_mentor.GetNameNoTooltip] ในการแสวงหาหนทางสู่การเป็นแม่ทัพที่ดียิ่งขึ้น"
 mpo_decisions_events.0200.mentor_traits: "เนื่องด้วย [commander_traits|E] ของ [commander_trait_mentor.GetNamePossessive]:"
 study_commander_trait_bonus: "เนื่องด้วย [traits|E] ของท่าน:"
 mpo_decisions_events.0200.a: "ข้าจักต้องทำสิ่งนี้ตามลำพัง"
 mpo_decisions_events.0200.alone: "การเดินทางของท่านจะค่อนข้าง #bold คาดเดาไม่ได้#! และ #bold ไร้การชี้นำ#!"
 mpo_decisions_events.0200.martial: "สติปัญญาด้านกลยุทธ์ของข้าเฉียบคม และเพียงพอแล้ว"
 mpo_decisions_events.0200.martial_flavor: "เส้นทางสู่ชัยชนะนั้นเปล่าเปลี่ยว แต่ท่านจะได้รับ #bold การชี้นำ#! จากความรู้ด้านการสงครามของท่าน"
 mpo_decisions_events.0200.learning: "ข้าพึงใจที่จะเรียนรู้จากบันทึกประวัติศาสตร์และปัญญาของเหล่าบัณฑิต"
 mpo_decisions_events.0200.learning_flavor: "ท่านจะได้รับ #bold การชี้นำ#! จากปัญญาแห่งสมรภูมิก่อนหน้า และงานเขียนของเหล่าแม่ทัพผู้ยิ่งใหญ่"
 mpo_decisions_events.0200.intrigue: "ข้าจักชิงไหวชิงพริบเหนือศัตรู และเอาชนะอริราชศัตรูของข้า"
 mpo_decisions_events.0200.intrigue_flavor: "ท่านจะได้รับ #bold การชี้นำ#! จากเล่ห์เหลี่ยมกลอุบายของท่าน ซึ่งขับเคลื่อนด้วยเสียงกระซิบจากราชสำนักและสนามรบ"

 mpo_decisions_events.0201.t: "บททดสอบแห่งการบัญชาการ"
 mpo_decisions_events.0201.desc_intro: "บัดนี้ข้าได้เริ่มการฝึกฝนอย่างจริงจังแล้ว ข้าต้องสำรวจจุดแข็งและจุดอ่อนของตน ข้าตระหนักดีว่าบ่อยครั้งที่ข้าเป็นคน [ROOT.Char.Custom('DescriptorNegativeStandalone')] แต่ข้ามิอาจปล่อยให้บาปนั้นเป็นเหตุแห่งความพินาศของข้าได้\n\nข้าต้องมุ่งเน้นไปที่จุดอ่อนที่สุดของตน"
 mpo_decisions_events.0201.desc_mentor: "\n\n"การต่อสู้ทุกครั้งย่อมแตกต่างกัน [ROOT.Char.GetFirstName]" [commander_trait_mentor.GetNameNoTooltip] กล่าว "เจ้าต้องเตรียมพร้อมสำหรับทุกสิ่งทุกอย่าง ศัตรูจะไม่รอให้เจ้าพร้อม จุดอ่อนของเจ้าในการรบคืออะไร? บอกข้ามา""
 mpo_decisions_events.0201.martial_1: "ในสนามรบ ข้าเป็นหนึ่งในหมู่มาก แต่เมื่ออยู่ตามลำพัง ข้าอ่อนแอ"
 study_commander_trait_option_mentor_desc: "ท่านกำลังเผชิญหน้ากับ [commander_trait_mentor.GetNameNoTooltip]"
 study_commander_trait_option_success: "ท่านได้เรียนรู้มากมายจากบททดสอบของท่าน"
 study_commander_trait_option_success_ok: "ท่านก้าวหน้าในการฝึกฝน"
 study_commander_trait_option_fail: "ท่านยังจับต้นชนปลายไม่ถูก"
 study_commander_trait_option_fail_ok: "ท่านยังห่างไกลจากการบรรลุศาสตร์แห่งการบัญชาการ"
 mpo_decisions_events.0201.martial_1_mentor_success: "ท่านเอาชนะ [commander_trait_mentor.GetNameNoTooltip] ในการประลอง"
 mpo_decisions_events.0201.martial_1_mentor_fail: "[commander_trait_mentor.GetNameNoTooltip] เอาชนะท่านได้"
 mpo_decisions_events.0201.martial_1_flavor: "จุดอ่อนของท่านคือการไม่สามารถต่อสู้ตามลำพังได้"
 mpo_decisions_events.0201.martial_1_tt: "ในความพยายามที่จะฝึกฝนทักษะการประลองของท่าน และประลองกับทหารในโรงทหาร"
 mpo_decisions_events.0201.martial_1_success: "ท่านเอาชนะคู่ต่อสู้ของท่านได้"
 mpo_decisions_events.0201.martial_1_fail: "ทหารเอาชนะท่านได้"
 mpo_decisions_events.0201.martial_2: "ข้าต้องเรียนรู้ที่จะต่อสู้ร่วมกับผู้อื่น"
 mpo_decisions_events.0201.martial_2_flavor: "จุดอ่อนของท่านคือการไม่สามารถต่อสู้ร่วมกับผู้อื่นได้"
 mpo_decisions_events.0201.martial_2_tt: "ท่านรวบรวมกลุ่มทหารเพื่อฝึกกระบวนทัพในลานฝึก"
 mpo_decisions_events.0201.martial_2_success: "ท่านนำการป้องกันที่มิอาจเจาะทะลวงได้"
 mpo_decisions_events.0201.martial_2_fail: "เหล่าทหารของท่านไร้ระเบียบและพ่ายแพ้โดยง่าย"
 mpo_decisions_events.0201.learning_1: "การรู้จักศัตรูคือครึ่งหนึ่งของชัยชนะ การนำทางในสนามรบคืออีกครึ่งหนึ่ง"
 mpo_decisions_events.0201.learning_1_flavor: "จุดอ่อนของท่านอยู่ที่การขาดความรู้เกี่ยวกับภูมิประเทศ"
 mpo_decisions_events.0201.learning_1_tt: "ท่านสำรวจผืนดิน มองหาจุดที่ดีที่สุดในการตั้งค่าย"
 mpo_decisions_events.0201.learning_1_mentor: "[commander_trait_mentor.GetNameNoTooltip] ช่วยเหลือท่านในการสำรวจ"
 mpo_decisions_events.0201.learning_1_success: "ท่านพบจุดที่สมบูรณ์แบบสำหรับการซุ่มโจมตีและการป้องกัน"
 mpo_decisions_events.0201.learning_1_fail: "ท่านหลงทางในป่ารกร้าง"
 mpo_decisions_events.0201.learning_2: "อาวุธให้ความได้เปรียบสูงสุด หากท่านสามารถใช้มันเป็น"
 mpo_decisions_events.0201.learning_2_flavor: "ท่านปรารถนาที่จะพัฒนาความรู้เกี่ยวกับอาวุธและเครื่องจักรกลในการล้อม"
 mpo_decisions_events.0201.learning_2_tt: "ท่านศึกษาความก้าวหน้าทางอาวุธ และวิธีที่สามารถนำมาใช้ให้เป็นประโยชน์แก่ท่าน"
 mpo_decisions_events.0201.learning_2_mentor: "[commander_trait_mentor.GetNameNoTooltip] อธิบายความซับซ้อนของอาวุธ"
 mpo_decisions_events.0201.learning_2_success: "ท่านสามารถใช้อาวุธได้อย่างมีประสิทธิภาพมากขึ้น และอาจปรับปรุงอาวุธที่ท่านมีอยู่ได้ด้วยซ้ำ"
 mpo_decisions_events.0201.learning_2_fail: "การเปลี่ยนแปลงในประวัติศาสตร์นั้นมากเกินกว่าที่ท่านจะเข้าใจได้"
 mpo_decisions_events.0201.intrigue_1_flavor: "ท่านปรารถนาที่จะพัฒนาความสามารถในการระดมพล หรือชักจูงศัตรูและพันธมิตรของท่าน"
 mpo_decisions_events.0201.intrigue_1: "ข้าต้องเข้าไปในจิตใจของผู้อื่น"
 mpo_decisions_events.0201.intrigue_1_tt: "ท่านรวบรวมกลุ่มชาวบ้าน และพยายามโน้มน้าวให้พวกเขาทำตามคำสั่งของท่าน"
 mpo_decisions_events.0201.intrigue_1_mentor: "[commander_trait_mentor.GetNameNoTooltip] ให้คำแนะนำแก่ท่านเกี่ยวกับการชักจูง"
 mpo_decisions_events.0201.intrigue_1_success: "ฝูงชนถูกโน้มน้าว แม้ในตอนแรกจะไม่เต็มใจก็ตาม"
 mpo_decisions_events.0201.intrigue_1_fail: "ดูเหมือนจะไม่มีใครฟังสิ่งที่ท่านพูด"
 mpo_decisions_events.0201.intrigue_2: "บางครั้ง หนทางที่ดีที่สุดสู่ชัยชนะคือการไม่ต่อสู้เลย"
 mpo_decisions_events.0201.intrigue_2_flavor: "ท่านปรารถนาที่จะพัฒนาความสามารถในการหลีกเลี่ยงความขัดแย้ง"
 mpo_decisions_events.0201.intrigue_2_tt: "ท่านพยายามโน้มน้าวฝูงชนให้วางอาวุธ"
 mpo_decisions_events.0201.intrigue_2_success: "ฝูงชนยอมรับเงื่อนไขของท่าน และท่านหลีกเลี่ยงการต่อสู้ได้"
 mpo_decisions_events.0201.intrigue_2_fail: "คำพูดของท่านยิ่ง ทำให้ฝูงชนโกรธเคืองมากขึ้น"
 mpo_decisions_events.0201.none_1: "ไม่มีผู้ใดยอมตามผู้ที่ปล่อยให้พวกเขาอดอยาก"
 mpo_decisions_events.0201.none_1_flavor: "ท่านปรารถนาที่จะเรียนรู้วิธีการปันส่วนเสบียงอย่างมีประสิทธิภาพมากขึ้น"
 mpo_decisions_events.0201.none_1_tt: "ท่านใคร่ครวญถึงวิธีที่ดีที่สุดในการจัดหาอาหารให้ทหารของท่าน"
 mpo_decisions_events.0201.none_1_success: "อาหารอุดมสมบูรณ์ และทหารของท่านก็อิ่มหนำสำราญ"
 mpo_decisions_events.0201.none_1_fail: "แผนของท่านล้มเหลว และทหารของท่านต้องหิวโหย"
 mpo_decisions_events.0201.none_2: "ความแข็งแกร่งคือขั้นแรก"
 mpo_decisions_events.0201.none_2_flavor: "ท่านปรารถนาที่จะพัฒนาความแข็งแกร่งทางร่างกายของท่าน"

 mpo_decisions_events.0202.t: "พัฒนาการที่ไม่คาดฝัน"
 mpo_decisions_events.0202.desc_battlefield: "เมื่อกลับมาจากสนามรบ"
 mpo_decisions_events.0202.desc_study: "เมื่อกลับมาจากการศึกษา"
 mpo_decisions_events.0202.desc_terrain: "เมื่อกลับมาจากการเดินทาง"
 mpo_decisions_events.0202.desc_town: "เมื่อกลับมาจากเมือง"
 mpo_decisions_events.0202.desc: "ข้าได้รับการต้อนรับจาก [situation_alerter.GetName] [situation_alerter.GetSheHe|U] เริ่มสนทนาถึงเหตุการณ์ล่าสุดที่ [situation_alerter.GetSheHe] เชื่อว่าข้าจะสนใจ"
 mpo_decisions_events.0202.desc_1_intro: "[situation_alerter.GetSheHe|U] อธิบายถึงสถานที่แห่งหนึ่ง ซึ่งอยู่ไม่ไกลจากที่นี่\n\n"และกลุ่มโจรได้เข้ายึดครองที่นั่นแล้ว" [situation_alerter.GetSheHe] กล่าว "เนื่องจาก""
 mpo_decisions_events.0202.desc_1_outro: "กองทัพประจำการไม่มีโอกาสเลย!" [situation_alerter.GetSheHe] อุทาน"
 mpo_decisions_events.0202.desc_2: "[situation_alerter.GetSheHe|U] เล่าให้ข้าฟังถึงป้อมปราการที่ถูกล้อม และเรื่องที่ฝ่ายป้องกันเสียพื้นที่อย่างรวดเร็ว "เพียงแค่เครื่องยิงหินระดมยิงครั้งเดียว กำแพงก็พังทลายลง" [situation_alerter.GetSheHe] กล่าวอย่างตื่นเต้น "ไม่น่าแปลกใจเลยที่เจ้าเมืองที่นั่นยอมจำนนอย่างรวดเร็ว เขาไม่สามารถต้านทานได้นาน""
 mpo_decisions_events.0202.desc_3: "[situation_alerter.GetSheHe|U] เล่าให้ข้าฟังถึงกลุ่มนายทหารและทหารที่ไม่พอใจ ซึ่งได้แปรพักตร์ ก่อแผนการบ่อนทำลายและโค่นล้มนายกองของตน "และในยามดึกสงัด – ถูกแทง!" [situation_alerter.GetSheHe] กล่าว "นายกองไม่ทันได้ระวังตัวเลย""
 mpo_decisions_events.0202.desc_outro: "\n\n[situation_alerter.GetFirstNameNoTooltip] กระแอมในลำคอ [situation_alerter.GetHerHis] แล้วเอ่ยว่า, "เช่นนั้น ท่านจักทำเยี่ยงไร?""
 mpo_decisions_events.0202.martial_situation_1: "ข้าจะเรียนรู้ภูมิประเทศ และใช้มันให้เป็นประโยชน์"
 mpo_decisions_events.0202.martial_situation_1_flavor: "ท่านบอก [situation_alerter.GetFirstNameNoTooltip] ถึงความสำคัญของการรู้จักดินแดนที่ท่านกำลังต่อสู้"
 mpo_decisions_events.0202.learning_situation_1: "พวกโจรมาจากที่ใดกัน?"
 mpo_decisions_events.0202.learning_situation_1_flavor: "ท่านอธิบายให้ [situation_alerter.GetFirstNameNoTooltip] ฟังว่าการเรียนรู้เกี่ยวกับศัตรูเป็นก้าวแรกสู่การเอาชนะพวกเขา"
 mpo_decisions_events.0202.success: "[situation_alerter.GetFirstNameNoTooltip] พยักหน้าเห็นด้วย"
 mpo_decisions_events.0202.fail: "[situation_alerter.GetFirstNameNoTooltip] มองข้าพลางเลิกคิ้วขึ้นข้างหนึ่ง"
