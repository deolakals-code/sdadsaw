 mpo_decisions_events.0120.t: "วิถีแห่งชนเผ่าเร่ร่อน"
 mpo_decisions_events.0120.desc.intro: "ถึงเวลาแล้วที่ข้าจะเปลี่ยนค่ายของข้าให้เป็นบางสิ่งที่ยิ่งใหญ่กว่า: ชุมชนที่เคลื่อนย้ายไปตามทุ่งหญ้าสเตปป์ตามฤดูกาลที่เปลี่ยนผัน\n\n"ข้าหวังว่าดินแดนเหล่านี้จะรับใช้ท่านเป็นอย่างดี" คนเลี้ยงสัตว์ผู้เคยนำผู้คนก่อนหน้าเราต้อนรับเราเข้าสู่กระโจมของ [herder.GetHerHis]"
 mpo_decisions_events.0120.desc.subject: "\n\n"[nomad.GetTitledFirstName] คือนายเหนือหัวของข้า" [herder.GetSheHe] กล่าวต่อด้วยน้ำเสียงเตือน "และบรรณาการคือสิ่งที่ [nomad.GetSheHe] เรียกร้อง""
 mpo_decisions_events.0120.a: ""ดินแดนเหล่านี้ก็เป็นของ [nomad.GetHerHis] อยู่แล้ว""
 mpo_decisions_events.0120.b: ""ข้ามาที่นี่มิใช่เพื่ออยู่ใต้อาณัติของผู้ใด""
