 confederation_kingdom_decision: "ยกระดับสมาพันธรัฐ"
 confederation_kingdom_decision_desc: "สิ่งที่เคยเป็นพันธะแห่งความจำเป็น — เหล่านักรบผู้สาบานตนว่าจะยืนหยัดต่อสู้พายุร่วมกัน — บัดนี้จักต้องกลายเป็นสิ่งที่ยิ่งใหญ่กว่าเดิม จงให้ผู้นำกองกำลังรบกลายเป็นขุนนาง หัวหน้าเผ่ากลายเป็นข้าหลวง และให้สมาพันธรัฐยืนหยัดเป็นหนึ่งเดียวภายใต้ธงผืนเดียว"
 confederation_kingdom_decision_tooltip: "ยุบ [confederation|E] และก่อตั้ง [kingdom|E] ใหม่ร่วมกับเหล่า [confederates|E]"
 confederation_kingdom_decision_confirm: "โดยมีข้าเป็น [ROOT.Char.Custom('get_queen_king')|U]!"
 mpo_decisions_events.0004.t: "การกำเนิดแห่ง [new_king_ruler.GetPrimaryTitle.GetTierAsNameNoTooltip|U]"
 mpo_decisions_events.0004.desc: "กาลครั้งหนึ่ง เราปกครองด้วยเจตจำนงของตนเอง กองกำลังรบของเราไม่ขึ้นต่อผู้ใด บัดนี้ เราคุกเข่า — มิใช่ในฐานะ [ROOT.Char.GetWomenMen] ผู้แตกพ่าย แต่ในฐานะข้าหลวง\n\nสิ่งที่เคยเป็นการรวมกลุ่มของผู้เท่าเทียมกันได้กลายเป็น [new_king_ruler.GetPrimaryTitle.GetTierAsName] และดาบของเรากำลังถวายสัตย์แด่ [new_king_ruler.GetTitledFirstNameNicknamed] — ผู้เป็นหนึ่งในหมู่ผู้เท่าเทียม...\n\n[new_king_ruler.GetPrimaryTitle.GetTierAsName] นี้อาจคงอยู่ หรืออาจล่มสลายไปดุจทุกสรรพสิ่ง"
 mpo_decisions_events.0004.a: "$mpo_decisions_events.0005.a$"
 mpo_decisions_events.0004.b: "ข้าจะไม่ขอมีส่วนร่วมในเรื่องนี้"
 mpo_decisions_events.0005.t: "$mpo_decisions_events.0004.t$"
 mpo_decisions_events.0005.desc: "ครั้งหนึ่ง พวกเราคือกองรบที่ผูกพันกันด้วยความจำเป็น ความเป็นหนึ่งเดียวของพวกเรานั้นช่างแสนสั้นดั่งฤดูกาล ทว่าบัดนี้ เราเป็นหนึ่งเดียวกันแล้ว สมาพันธรัฐได้กลายเป็นอสูรกายผู้ยิ่งใหญ่ และข้า — คือหัวของอสูรกายตนนั้น\n\nเหล่าผู้นำเผ่าที่เคยร่วมรบเคียงบ่าเคียงไหล่ข้า: บัดนี้พวกเขาคุกเข่าต่อหน้าคำบัญชาของข้า พวกเขาขนาบข้างบัลลังก์ของข้า พวกเขาร่ำร้องบทเพลงที่โต๊ะอาหารอันโอ่อ่าของข้า! เราได้ตกลงกันเรื่องการสืบทอดอำนาจอันชอบธรรม และดังนั้น เผ่าอื่นๆ จะรอคอยอย่างมีเกียรติเพื่อถึงคราวปกครองของตน\n\n[new_king_ruler.GetPrimaryTitle.GetTierAsName] องค์ใหม่ได้ถือกำเนิดขึ้นแล้ว และตราบเท่าที่ข้ายังมีชีวิตอยู่ ข้าคือองค์อธิปัตย์ของมัน"
 mpo_decisions_events.0005.a: "ขอให้เรารุ่งเรืองไปด้วยกันเทอญ!"
