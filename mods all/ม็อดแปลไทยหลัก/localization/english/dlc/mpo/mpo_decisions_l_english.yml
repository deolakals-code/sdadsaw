 leave_confederation_decision: "ละทิ้งสมาพันธ์"
 leave_confederation_decision_desc: "ข้ายืนหยัดปกป้องเหล่าสหายร่วมสมาพันธ์มานานพอแล้ว บัดนี้ ข้าจักยืนหยัดเพียงลำพัง และหากสมาพันธ์มิอาจอยู่รอดได้หากปราศจากข้า — มันก็สมควรแก่การล่มสลายสูญสิ้น!"
 leave_confederation_decision_confirm: "[ROOT.Char.GetFaith.HighGodName] ทรงคุ้มครอง แต่ข้าหาไม่"
