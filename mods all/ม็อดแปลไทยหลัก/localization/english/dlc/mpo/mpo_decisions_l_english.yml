 confederaton_blocks_faction: "เหล่า [vassals|E] ของ [confederation|E] มิอาจก่อตั้ง [faction|E] นี้ได้"
 mpo_confederation_member_modifier: "ทุ่งหญ้าเลี้ยงสัตว์สมาพันธ์"
 mpo_confederation_member_modifier_desc: "ด้วยการแบ่งปันทุ่งหญ้าเลี้ยงสัตว์ของเหล่าสมาชิกสมาพันธ์และเมืองขึ้นชั้นผู้น้อย ภาระต่อทุ่งหญ้าในบ้านเกิดจึงบรรเทาลง"
 confederation_modifier_tt: "เหล่า [confederates|E] ได้รับ [GetModifier('mpo_confederation_member_modifier').GetNameWithTooltip] และ [county_fertility|E] บางส่วน"
