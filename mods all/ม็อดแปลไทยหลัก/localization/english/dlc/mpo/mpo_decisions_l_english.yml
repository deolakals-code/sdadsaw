 mpo_decisions_events.0070.desc: "เหล่าชนเผ่าของข้าได้เสาะหา [great_court_astrologer_option.Custom('GetDaughterSon')] ของเหล่าหมอผี, พบฤๅษีในถ้ำของตน, คนแปลกหน้าผู้มีวาจาศักดิ์สิทธิ์, ผู้ถูกเนรเทศ ซึ่งร่อนเร่อยู่ในดินแดนรกร้าง — ทั้งหมดนี้เพื่อค้นหา $court_astrologer_court_position$ คนใหม่ของข้า\n\nเหล่าผู้ศักดิ์สิทธิ์ถูกนำตัวมายังเบื้องหน้าข้า ต่างก็เล่าขานถึงชะตาของข้า และกล่าวถึงลางบอกเหตุที่บังเกิดขึ้นในธรรมชาติ"
