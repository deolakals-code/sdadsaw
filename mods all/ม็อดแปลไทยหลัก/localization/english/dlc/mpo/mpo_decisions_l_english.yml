 mpo_decisions_events.0202.none_situation_1_flavor: "ท่านอธิบายให้ [situation_alerter.GetFirstNameNoTooltip] ฟังว่าวิธีที่ดีที่สุดในการเอาชนะศัตรูคือการเตรียมพร้อม"
 mpo_decisions_events.0202.martial_situation_2: "เหตุใดต้องหลบซ่อนหลังกำแพง? ทำลายสิ่งที่น่ารังเกียจนั่นเสีย!"
 mpo_decisions_events.0202.martial_situation_2_flavor: "ท่านอธิบายให้ [situation_alerter.GetFirstNameNoTooltip] ฟังว่าท่านจะทำลายเครื่องมือล้อมด้วยกำลัง"
