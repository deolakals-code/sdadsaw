 mpo_decisions_events.0400.t: "สันติภาพแห่งผืนดิน"
 mpo_decisions_events.0400.desc: ""...เครื่องเทศจากแดนไกลโพ้นตะวันออก!" "พริกไทยแท้ เก็บจากรังมังกร!" "ผ้าไหมเลิศล้ำ สีย้อมงดงามที่สุด!"\n\nเหล่าพ่อค้าตะโกนกวักมือเรียกทุกคนที่เต็มใจรับฟัง จัดแสดงสินค้าของตนด้วยความกระตือรือร้นอย่างยิ่งยวด\n\n"เป็น เช่นนี้ทุกหนทุกแห่ง ท่าน [ROOT.Char.GetTitleAsNameNoTooltip] ผู้ยิ่งใหญ่" [courtier.GetTitledFirstName] คารวะอย่างนอบน้อมขณะทักทาย [courtier.GetHerHis] "ทั่วทั้งโลกบัดนี้อยู่ภายใต้ปีกแห่งราชวงศ์ [ROOT.Char.GetDynasty.GetBaseNameNoTooltip] ผู้คนหลั่งไหลมายังนครของท่าน ด้วยแรงดึงดูดจากความเจริญรุ่งเรือง""
 mpo_decisions_events.0400.a: "จงเปิดประตูไว้"
 
 mpo_desperate_stance_decision: "ยามคับขัน"
 mpo_desperate_stance_decision_desc: "แผ่นดินแห้งแล้ง ลูกวัวล้มตายในท้องแม่ มิเคยได้เห็นแสงตะวัน เหล่าอาชาผ่ายผอมราวกับกิ่งไม้ ล้มลงพร้อมเสียงแตกหักอันน่าเวทนา\n\nหนทางมีเพียงหนึ่งเดียว: และนั่นคือการออกไป"
 mpo_desperate_stance_decision_confirm: "รวมพลประชาราษฎร์"
 mpo_desperate_stance_decision_tooltip: "รวมประชาราษฎร์ของท่านในการยืนหยัดครั้งสุดท้ายอย่างสิ้นหวัง"
