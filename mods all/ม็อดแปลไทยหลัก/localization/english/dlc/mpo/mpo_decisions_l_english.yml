 mpo_decisions_events.0002.t: "การละทิ้งสมาพันธ์"
 mpo_decisions_events.0002.desc: "ข่าวสารที่ส่งออกไปแพร่สะพัดอย่างรวดเร็ว และในไม่ช้า เสียงร้องโหยหวนด้วยความหวาดกลัวจาก [confederation.GetName] ก็ดังขึ้น — [ROOT.Char.GetName] ตัดขาดจากพวกเขาแล้ว!\n\n"
 mpo_decisions_events.0002.desc_confederation_survives: "บัดนี้เหล่าผู้อ่อนแอเหล่านี้จักพึ่งพากำลังของผู้ใดได้เล่า? ความเมตตาของผู้ใด? #EMP สันติสุขของผู้ใด?!#! สมาพันธ์ทำได้เพียงตกอยู่ในความโกลาหล\n\nความเจริญรุ่งเรืองจักเป็นของ [ROOT.Char.GetPrimaryTitle.GetNameNoTier] แต่เพียงผู้เดียว"
mpo_decisions_events.0002.desc_confederation_done: "เมื่อเหลือเพียง [other_confederate.GetTitledFirstName] ที่ยังคงยึดมั่นในคำสัตย์สาบาน... สมาพันธ์ก็มิได้ดำรงอยู่อีกต่อไป สันติสุขรึ? ความรุ่งเรืองรึ? สิ่งเหล่านั้น บัดนี้เป็นของผู้เข้มแข็ง แต่เพียงผู้เดียว"
 mpo_decisions_events.0002.a: "ข้าคือทุกสิ่งที่ไพร่ฟ้าข้าแผ่นดินต้องการ"

 mpo_decisions_events.0003.t: "ความสูญเสียของสมาพันธ์"
 mpo_decisions_events.0003.desc: "ลางร้ายอันหนักอึ้งปกคลุมเหนือเหล่าผู้คนของข้า ด้วย [leaver.GetTitledFirstName] ได้ละทิ้งคำมั่นสัญญาของ [leaver.GetHerHis] ที่จะยืนหยัดเคียงข้างเรา [leaver.GetSheHe|U] ได้ทอดทิ้งสมาพันธ์ของเราไปแล้ว พวกเราจะมิได้ขับเคี่ยวร่วมกับ [leaver.GetPrimaryTitle.GetNameNoTier] เพื่อต่อกรกับผู้ยิ่งใหญ่และทรงอำนาจอีกต่อไป\n\n"
 mpo_decisions_events.0003.desc_confederation_survives: "[confederation.GetName] อ่อนแอลงด้วยเหตุนี้ แต่เรายังคงยืนหยัดอยู่"
 mpo_decisions_events.0003.desc_confederation_done: "เมื่อข้า #EMP เพียงผู้เดียว#! ที่ยังคงภักดีต่อคำสัตย์สาบาน สมาพันธ์ของข้าก็หาได้มีความหมายใดอีกต่อไปไม่ มันได้สิ้นสุดลงแล้ว"
 mpo_decisions_events.0003.a: "คนทรยศ!"

