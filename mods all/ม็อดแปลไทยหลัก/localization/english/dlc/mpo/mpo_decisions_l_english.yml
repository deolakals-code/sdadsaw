mpo_valid_heir_friend_tt: "ข้าหลวงโดยตรง [direct_vassals|E], พันธมิตร [allies|E], หรือผู้เกี่ยวข้อง [relations|E] ใดๆ ของท่าน:\n$EFFECT_LIST_BULLET$มีอายุอย่างน้อย #V 12#! ปี\n$EFFECT_LIST_BULLET$มี [opinion|E] ต่อท่านอย่างน้อย #V 50#!\n$EFFECT_LIST_BULLET$#bold มิได้#! กำลังทำ [war|E] กับท่าน\n$EFFECT_LIST_BULLET$$not_friends_with_player_heir_tt$\n$EFFECT_LIST_BULLET$#bold มิได้#! เป็น [blood_brothers|E] กับ [player_heir|E] ของท่าน\n$EFFECT_LIST_BULLET$$not_bad_relation_with_player_heir_tt$\n$EFFECT_LIST_BULLET$#bold มิได้#! ถูกจองจำ\n$EFFECT_LIST_BULLET$#bold มิได้#! ไร้ความสามารถ\n$EFFECT_LIST_BULLET$$nomadic_government_or_philosophy_tt$\n$EFFECT_LIST_BULLET$บรรดาศักดิ์สูงสุดที่ถือครองมีระดับ [rank|E] เทียบเท่าหรือสูงกว่าระดับเคาน์ตี\n$EFFECT_LIST_BULLET$จักต้องเป็น [ally|E], [friend|E], [soulmate|E], [blood_brother|E] ของท่าน หรือ [vassal|E] ผู้ [obedient|E]"

mpo_decision_introduce_heir: "เปิดตัวทายาท"
introduce_heir_decision_desc: "หากผู้สืบทอดของข้าจักต้องเป็นนายเหนือชะตาชีวิตของ [ROOT.Char.GetPlayerHeir.GetHerHis] เอง [ROOT.Char.GetPlayerHeir.GetSheHe] จักต้องการสหายผู้ทรงเกียรติ ข้าจำต้อง ทำให้ใบหน้าของ [ROOT.Char.GetPlayerHeir.GetHerHis] เป็นที่รู้จัก ให้เสียงของ [ROOT.Char.GetPlayerHeir.GetHerHis] เป็นที่ได้ยินภายในเคหาสน์อาภรณ์แพรพรรณของเหล่าผู้ทรงอำนาจ\n\n[ROOT.Char.GetPlayerHeir.GetWomanMan] ผู้ยืนหยัดเดียวดายใต้ผืนฟ้าย่อมถูกลิขิตด้วยหายนะ"
introduce_heir_decision_tooltip: "ทำให้ [player_heir|E] ของท่านเป็น [friends|E] กับหนึ่งใน [vassals|E], [allies|E] หรือ [relations|E] ของท่าน"
