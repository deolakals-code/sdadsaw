 superior_max_military_strength_tt: "มีกำลังทหารอย่างน้อยสองเท่าของท่าน"
 confederation_threat_tt: "ผู้ปกครอง [ruler|E] ข้างเคียงใดๆ, [suzerain|E] ของผู้ปกครอง [ruler|E] ข้างเคียง หรือ [ruler|E] ใน [kingdom|E] อันเป็น [de_jure|E] เดียวกับ [capital|E] ของท่าน:\n$EFFECT_LIST_BULLET$$superior_max_military_strength_tt$\n$EFFECT_LIST_BULLET$#bold มิได้#! เป็น [allied|E] กับ #high ท่าน#!\n$EFFECT_LIST_BULLET$เป็นไปตามเงื่อนไขอย่างน้อยหนึ่งข้อ:\n  $EFFECT_LIST_BULLET$บรรดาศักดิ์สูงสุดที่ถือครองมีระดับ [rank|E] เทียบเท่าหรือสูงกว่าระดับอาณาจักร\n  $EFFECT_LIST_BULLET$$considers_faith_evil_tt$\n  $EFFECT_LIST_BULLET$มีลักษณะนิสัย: [GetTrait('conqueror').GetName( GetNullCharacter )]\n  $EFFECT_LIST_BULLET$มีลักษณะนิสัย: [GetTrait('greatest_of_khans').GetName( GetNullCharacter )]"
