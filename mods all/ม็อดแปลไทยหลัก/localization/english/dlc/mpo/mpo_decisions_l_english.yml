 mpo_decisions_events.0001.t: "การรวมพลชนเผ่า"
 mpo_decisions_events.0001.desc: "ด้วยพระประสงค์แห่ง [ROOT.Char.GetFaith.HighGodName] [ROOT.Char.GetPrimaryTitle.GetTierAsName] ของข้าอาจถูกหักสะบั้นดุจก้านศรเพียงดอกเดียว! ด้วยเผ่าอันสมถะของข้าต้องแบ่งปันดินแดน [home_kingdom.GetNameNoTier] ร่วมกับเหล่ากองกำลังนักรบ เช่นพวก [threat.GetCulture.GetCollectiveNoun] อันน่าเกรงขามของ [threat.GetTitledFirstNamePossessive]\n\nทว่า — หากเหล่าลูกศรแห่งพวกพ้องข้าถูกมัดรวมกับเหล่าสหายและญาติมิตรเล่า? ศัตรูจะสามารถกำบดขยี้เราได้โดยง่ายดายถึงเพียงนั้นเชียวหรือ?\n\n#EMP เหล่าพี่น้องเอ๋ย — อย่าได้เอ่ยนามนายเหนือหัวใด แต่จงเป็นกระบอกเสียงให้แก่ปวงชนเผ่า! เสียงที่จะเย้ยหยัน [threat.GetTitledFirstNameNoTooltip] และทั่วทั้งโลกหล้า!#!"
 mpo_decisions_events.0001.a: "ข้าจักต้องเสาะหาผู้ที่เต็มใจ"
 mpo_decisions_events.0001.b: "#EMP ชิ! ความขลาดเขลา!#!"

every_confederation_member: "[confederate|E] ร่วมสมาพันธ์ทุกคน"
