 mpo_decisions_events.0204.t: "เส้นทางสายใหม่"
 mpo_decisions_events.0204.desc: "เวลาผ่านไปบ้างแล้วนับตั้งแต่ข้าเริ่มฝึกฝน และข้าคิดว่าบัดนี้ข้าพร้อมที่จะเก็บเกี่ยวผลแห่งความพยายามของข้าแล้ว ถึงเวลาทดสอบความสามารถของข้า และดูว่าข้าได้กลายเป็นจ้าวแห่งศาสตร์การบัญชาการอย่างแท้จริงหรือไม่"
 mpo_decisions_events.0204.desc_mentor: "แน่นอน ข้ายินดีที่ได้รับคำแนะนำจาก [commander_trait_mentor.GetNamePossessive]"
