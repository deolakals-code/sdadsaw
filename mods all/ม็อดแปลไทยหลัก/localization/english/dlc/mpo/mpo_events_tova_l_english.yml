 mpo_heavens_favor_diplo_modifier.desc: "$mpo_heavens_favor_modifier.desc$"

 mpo_events_tova.0035.t: "บุรุษจากขุนเขา"
 mpo_events_tova.0035.desc: "[distressed_anda.GetTitledFirstName] ผู้เป็น [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('distressed_anda'))] ของข้า ตบแผ่นผ้าสักหลาดเปิดทางขณะบุกเข้ามาในเยิร์ตของข้า หน้าอกของเขากระเพื่อมขึ้นลงด้วยความคับข้องใจที่อัดอั้น \n\n"ฟังทางนี้!" เขาร้องอุทาน "[pregnant_woman.GetTitledFirstName] กำลังตั้งครรภ์ และข้ามั่นใจว่าเด็กคนนั้นไม่ใช่ลูกของข้า"\n\n"เมื่อข้าซักไซ้ นางบอกว่านางฝันเห็นหมีตัวหนึ่งลงมาจากภูเขาใหญ่ สัตว์ร้ายนั้นกลายเป็นควันในรูปร่างของบุรุษ จากนั้นควันก็ลอยมาปกคลุมท้องของนาง เช้าวันรุ่งขึ้น นางก็รู้สึกถึงสัญญาณแรกของการตั้งครรภ์""
 mpo_events_tova.0035.a: "จงยินดีเถิด! สวรรค์ประทานบุตรมาให้เจ้า"
 mpo_events_tova.0035.a.tt: "เด็กอาจเกิดมาพร้อมทักษะอันน่าทึ่ง"
 mpo_events_tova.0035.b: "นางป้อนคำโป้ปดให้เจ้าทั้งสิ้น"
 mpo_events_tova.0035.c: "นั่นเป็นเรื่องตลกที่สุดที่ข้าเคยได้ยินมา!"

 mpo_events_tova.0045.t: "สหายผู้ล้ำค่า"
 mpo_events_tova.0045.desc: ""ท่าน [ROOT.Char.GetTitleAsName], แม้มิตรภาพของเราจะเหนียวแน่นยิ่งกว่าคอแกะ ข้าก็ปรารถนาจะมอบของกำนัลให้ท่านเพื่อเป็นเครื่องหมายแห่งความภักดีอันมั่นคงของข้า" [generous_anda.GetTitledFirstName] ผู้เป็น [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('generous_anda'))] ของข้า บอกแก่ข้า ขณะที่เรานั่งผิงไฟรับความอบอุ่นร่วมกัน\n\n"
 mpo_events_tova.0045.desc_knucklebone: "เขาล้วงเข้าไปในกระเป๋าและหยิบถุงเล็ก ๆ ออกมา ซึ่งเมื่อเปิดออกก็เผยให้เห็นลูก [Glossary( 'ชากาย', 'ชาไก')] ถ่วงทองแดง จากนั้นเขาก็กล่าวต่อว่า "ข้าชนะการแข่งขันมามากมายด้วยลูกชาไกนี้ และข้ามั่นใจว่ามันจะนำโชคดีมาให้ท่าน""
 mpo_events_tova.0045.desc_herd: "เขาผายมือไปยังทุ่งหญ้าเลี้ยงแกะที่อยู่ไกลออกไปแล้วกล่าวต่อว่า "ข้านำฝูงแกะที่ข้าชนะมาจากการเล่น [Glossary( 'ชากาย', 'ชาไก')] ขอให้มันช่วยหล่อเลี้ยงและค้ำจุนท่านและครอบครัวของท่าน""
 mpo_events_tova.0045.desc_axe: "เขาเผยให้เห็นขวานศึก ขัดเงาอย่างดีและไม่ต้องสงสัยเลยว่าคมกริบ เช่นกัน จากนั้นเขาก็กล่าวต่อว่า "ข้าได้อาวุธนี้มาระหว่างการรบครั้งล่าสุดที่เราร่วมสู้ด้วยกัน โดยแย่งชิงมาจากมืออันเย็นเฉียบไร้ชีวิตของศัตรูที่ล้มตาย""
 mpo_events_tova.0045.a: "ขอบคุณสำหรับของกำนัลอันมีค่ายิ่ง"
 mpo_events_tova.0045.a.equipped_tt: "ได้รับ [gift.GetName]"
 mpo_events_tova.0045.b: "มิตรภาพของท่านคือของกำนัลเพียงสิ่งเดียวที่ข้าต้องการ"
 gifted_bone_name: "ลูกชาไกถ่วงทองแดง"
 gifted_bone_desc: "กระดูกข้อเท้าแกะฝังทองแดงสำหรับใช้ในการละเล่นยิงชาไก"
 gifted_axe_name: "ขวานแห่งชัยชนะ"
 gifted_axe_desc: "ขวานศึก สมดุลอย่างสมบูรณ์แบบ"

