l_english: 
 mpo_events_tova.0001.t: "การต้อนรับอันเย็นชา"
 mpo_events_tova.0001.desc: "ไม่นานหลังจากข้ากลับมา ข้าสังเกตเห็น [demanding_relation.GetTitledFirstName] เดินตามข้าด้วยสีหน้าคาดหวังปรากฏบนใบหน้าของ [demanding_relation.GetHerHis] เรามิได้พบกันมาสักพักแล้ว ด้วย [demanding_relation.GetSheHe] ยังคงอยู่ในราชสำนักระหว่างการเดินทางครั้งล่าสุดของข้า แต่เป็นที่ชัดเจนว่า [demanding_relation.GetSheHe] ปรารถนามากกว่าเพียงแค่การได้อยู่กับข้า \n\n[demanding_relation.GetSheHe|U] เงยหน้ามองข้าด้วยดวงตาเป็นประกายแล้วเอ่ยถาม, "ท่านนำสิ่งใดกลับมาฝากข้าจากการเดินทางหรือไม่?" \n\nข้าล้วงคลำไปตามกระเป๋าเสื้อ แต่ก็ไม่พบสิ่งใดนอกจาก [ROOT.Char.Custom('RandomWeirdObject')] ชิ้นหนึ่ง ข้าจำมิได้เลยว่ามันมาอยู่ในนี้ได้อย่างไร"
 mpo_events_tova.0001.a: "ให้ข้าเล่าเรื่องการเดินทางของข้าให้ฟังแทนเถิด"
 mpo_events_tova.0001.a.tt.failure: "ท่านมิอาจสร้างความประทับใจให้ [demanding_relation.GetTitledFirstName] ได้"
 mpo_events_tova.0001.a.tt.success: "ท่านสร้างความประทับใจให้ [demanding_relation.GetTitledFirstName]"
 mpo_events_tova.0001.b: "ข้าจะไปตลาดเพื่อซื้อของบางอย่างให้เจ้า"
 mpo_events_tova.0001.b.equipped_tt: "ซื้อ [wanderer_toy.GetName] ให้แก่ [demanding_relation.GetTitledFirstName] แล้ว"
 gifted_toy_name: "ม้าของเล่น"
 gifted_toy_desc: "ม้าไม้ของเล่น แกะสลักอย่างงดงามประณีต"
 mpo_events_tova.0001.c: "ข้าเต็มใจที่จะโป้ปดต่อเด็กหรือ?"
 mpo_events_tova.0001.c.tt.failure: "[demanding_relation.GetTitledFirstName] มิได้ถูกหลอกโดยง่าย"
 mpo_events_tova.0001.c.tt.success: "ท่าน ทำให้ [demanding_relation.GetTitledFirstName] เชื่อว่าของสิ่งนั้นเป็นของพิเศษ"
 
 mpo_events_tova.0002.t: "ท่วงทำนองจากแดนไกล"
 DynamicIntroLanded: "ขณะที่ข้าเดินทอดน่องไปตามโถงทางเดิน"
 DynamicIntroWanderer: "ขณะที่ข้าเดินผ่านค่ายพัก"
 mpo_events_tova.0002.desc: "[ROOT.Char.Custom('DynamicIntroLoc')] ข้าได้ยินเสียงดนตรีแผ่วเบาแว่วมาจากลานกลางอาคาร \n\nท่วงทำนองไหลรินประสานเป็นเสียงขับขานอันไพเราะ ซึ่ง ทำให้ข้าหยุดชะงักและรู้สึกโหยหาอดีตอย่างสุดซึ้ง ข้าไม่จำเป็นต้องได้ยินเนื้อเพลงก็รู้ว่าเพลงนี้เกี่ยวกับความคิดถึงบ้าน \n\nเมื่อตามเสียงไป ข้าก็ได้พบกับ [musician.GetTitledFirstName] ผู้เป็น [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('musician'))] ของข้า [musician.GetSheHe|U] ได้เดินทางมาไกลจากบ้านเกิด และกำลังบรรเลงเพลงของ [musician.GetHerHis] ราวกับจะรำลึกถึงถิ่นที่ [musician.GetSheHe] จากมา \n\nแท้จริงแล้ว หากข้าหลับตาลง ข้าสามารถจินตนาการเห็น [journey_province.Custom('TerrainInspirationLoc')] แห่ง [journey_province.GetName] ได้"
 mpo_events_tova.0002.a: "ข้าควรไปเยือนสถานที่แห่งนี้สักวันหนึ่ง"
 mpo_events_tova.0002.a.tt: "ท่านอาจได้รับค่าประสบการณ์ [wanderer_lifestyle|E] เพิ่มเติมหากท่านไปเยือน [journey_province.GetName] ใน [GetActivityType('activity_journey').GetName]"
 mpo_events_tova.0002.b: "ข้าจะใช้ความรักในเสียงดนตรีของข้าเพื่อชักชวน [musician.GetHerHim]"
 mpo_events_tova.0002.b.flavor: "แน่นอนว่าการรวมกลุ่มย่อมดีกว่าคอร์ดเดียวดายมิใช่หรือ?"
 mpo_events_tova.0002.b.tt.success: "ท่านชักชวน [musician.GetTitledFirstName] ให้เข้าร่วมกับท่านได้สำเร็จ"
 mpo_events_tova.0002.b.tt.failure: "ท่านมิอาจชักชวน [musician.GetTitledFirstName] ให้เข้าร่วมกับท่านได้"
 cultural_acceptance_enjoyed_music: "[cultural_acceptance|E] ระหว่างชาว [journey_province.GetCounty.GetCulture.GetCollectiveNoun] และชาว [journey_provice.GetCounty.GetCulture.GetCollectiveNoun] เพิ่มขึ้น [minor_cultural_acceptance_gain]"
 mpo_events_tova.0002.c: "นั่งลงสักครู่แล้วเพลิดเพลินกับเสียงดนตรี"

 mpo_events_tova.0003.t: "เรื่องตลกที่เลยเถิด"
 mpo_events_tova.0003.desc: "เสียงร้องอันเป็นลางร้ายของอีกาที่กินซากสัตว์ทักทายข้าขณะที่ข้าพ้นแนวป่าออกมา ที่นั่นข้าได้พบเห็นบ่วงเปล่าแกว่งไกวเบา ๆ จากกิ่งก้านของต้น [unruly_province.Custom('GetRandomRegionalWood')] ชายสามคนถูกพันธนาการด้วยโซ่ตรวนคุกเข่าอยู่ใต้บ่วงเหล่านั้น หนึ่งในนั้นดูคล้ายกับ [unruly_province_owner.GetTitledFirstName] อย่างยิ่ง \n\n"เจ้าพวกไพร่ชั้นต่ำเหล่านี้เยาะเย้ยการปกครองอันชอบธรรมของ [unruly_province_owner.GetTitleTierName] ของเรา!" เพชฌฆาตตะโกน "พวกมันคือกบฏชาวนาที่ปลอมตัวเป็นนักแสดง และการรณรงค์ใส่ร้ายป้ายสีของพวกมันจะจบลงด้วยความตาย" \n\n"ได้โปรดช่วยพวกเราด้วย" หนึ่งในผู้ถูกล่าวหาตะโกนเรียกข้า"
 mpo_events_tova.0003.a: ""อันที่จริงแล้ว นักแสดงเหล่านั้นเป็นของข้า และข้าต้องการพวกเขากลับคืน""
 mpo_events_tova.0003.a.tt: "ชักชวนนักแสดงโดย ทำให้เพชฌฆาตเชื่อว่าพวกเขาเป็นคนในบังคับของท่าน และมีเพียงท่านเท่านั้นที่ตัดสินชะตากรรมของพวกเขาได้"
 mpo_events_tova.0003.a.tt.success: "ท่าน ทำให้เพชฌฆาตเชื่อว่านักแสดงและชะตากรรมของพวกเขาเป็นของท่าน"
 mpo_events_tova.0003.a.tt.failure: "การหลอกลวงของท่านถูกจับได้ และ [unruly_province_owner.GetTitledFirstName] ได้ยินเรื่องการกระทำของท่าน"
 mpo_events_tova.0003.b: ""การลงโทษนี้ไม่สมกับความผิด""
 mpo_events_tova.0003.b.tt: "ทำให้เพชฌฆาตเชื่อให้ละเว้นชีวิตนักโทษ"
 mpo_events_tova.0003.b.tt.success: "ท่าน ทำให้เพชฌฆาตเชื่อให้ปล่อยตัวนักโทษ"
 mpo_events_tova.0003.b.tt.failure: "ท่านมิอาจ ทำให้เพชฌฆาตเชื่อได้ และ [unruly_province_owner.GetTitledFirstName] ไม่พอใจการแทรกแซงของท่าน"
 mpo_events_tova.0003.c: "ข้ามีที่ต้องไป ไปกันต่อเถิด"
 mpo_events_tova.0003.c.tt: "พวกมันสมควรถูกลงโทษอย่างสาสมสำหรับพฤติกรรมชั่วช้า!"

 mpo_events_tova.0004.t: "ความไม่ภักดีอย่างชัดแจ้ง"
 mpo_events_tova.0004.desc: "ความมืดมิดยามเย็นถูกปัดเป่าด้วยแสงจากกองไฟที่กำลังลุกโชน ที่ ซึ่งกลุ่มทหารประจำการของข้าร่วมรับประทานอาหารด้วยกัน \n\n"แม้ข้าจะหลับตาและบีบจมูก ข้าก็ยังลำบากที่จะกลืนอาหารห่วย ๆ นี่ลงไป ข้าทนกินข้าวต้มเละ ๆ นี่ต่อไปอีกไม่ไหวแล้ว หรือต้องคอยคุ้ยหาเมล็ดข้าวเน่า ๆ กินเป็นอาหารประจำวัน!" \n\nชายผู้ดูเหมือนจะเป็นหัวหน้ากลุ่มกล่าวขึ้น ตัดสินจากเสียงเชียร์และการตบบ่าอย่างแรงที่เขาได้รับจากคนอื่น ๆ"
 mpo_events_tova.0004.a: "การปันส่วนที่เข้มงวดขึ้นจะสอนระเบียบวินัยให้พวกมัน"
 mpo_events_tova.0004.a.flavor: "หวังว่าเหล่าทหารที่ไม่พอใจจะไม่ใช้มาตรการรุนแรงใด ๆ..."
 mpo_events_tova.0004.a.tt: "ท่านขายเสบียงกองทัพส่วนหนึ่งไป"
 mpo_events_tova.0004.b: "ข้าจะเอาหัวของหัวหน้าคนนั้นมา"
 mpo_events_tova.0004.b.tt: "เจ้าคนหนุ่มทะเยอทะยานถูกสังหารทันที"
 mpo_events_tova.0004.c: "ข้าจะจ่ายเงินเพื่อเสบียงที่ดีกว่านี้"

 mpo_events_tova.0005.t: "ทหารผู้สุขสันต์"
 mpo_events_tova.0005.desc: "กลุ่มควันลอยขึ้นเบื้องหน้า และแม้จะอยู่ไกลพอควร ข้าก็ได้กลิ่นเนื้อย่างอันหอมหวนชวนลิ้มลอง เมื่อตามกลิ่นไป ข้าพบกลุ่มทหารประจำการของข้ากำลังเพลิดเพลินกับนกกระทาย่างไม่ต่ำกว่าสามตัว \n\n"ข้าชักจะเคยชินกับชีวิตแบบนี้เสียแล้ว" เสียงดังที่สุดในกลุ่มประกาศ "ความสงบเงียบนี้ดีต่อจิตวิญญาณนัก และทุกที่ที่เราไป เหล่าชาวนามีอาหารเหลือเฟือ เราโชคดีที่ได้อยู่ในช่วงเวลาอันสงบสุข เช่นนี้ และรับใช้ [ROOT.Char.GetTitleTierName] ผู้ทรงเมตตาต่อผู้คนของ [ROOT.Char.GetHerHis]""
 mpo_events_tova.0005.a: "เฆี่ยนพวกขี้เกียจสันหลังยาวให้เข้ารูปเข้ารอย"
 mpo_events_tova.0005.b: "ลงโทษพวกมันฐานที่ไม่ระมัดระวังตัว"
 mpo_events_tova.0005.c: "จงรับความสุขและคำพูดดี ๆ ของพวกเขาไว้ในใจ"
 mpo_events_tova.0006.t: "กรรมตามสนอง"
 mpo_events_tova.0006.desc: "มีข่าวร้ายมาแจ้งพ่ะย่ะค่ะ ฝ่าบาท: เหล่าทหารของพระองค์ได้บุกปล้นและเผายุ้งฉางใน [maa_province.GetCounty.GetName] พวกมันโวยวายเรื่องท้องที่ว่างเปล่าและกล่าวอ้างอย่างทรยศว่าฝ่าบาททรงบังคับให้พวกมันขโมยและปล้นสะดมเพื่ออาหารประทังชีวิต \n\nบางส่วนหนีเข้าไปในป่าแถบชนบท ส่วนพวกที่ไม่ได้หนีก็ถูกสังหารทันทีโดยผู้ที่ภักดีต่อฝ่าบาท ดูเหมือนว่าความหิวโหย ทำให้คนสิ้นคิดได้พ่ะย่ะค่ะ"
 mpo_events_tova.0006.a: "เจ้าพวกสารเลว!"

 mpo_special_flavor_events.0001.t: "ทุ่งหญ้าสเตปป์แห่งผืนน้ำอันไร้ขอบเขต"
 mpo_special_flavor_events.0001.desc: "ข้าเคยได้ยินเรื่องเล่าขานเกี่ยวกับทะเล เกี่ยวกับความงามและความน่าสะพรึงกลัวของมัน และวิธีที่มันบดบังรัศมีแม้กระทั่งทุ่งหญ้าสเตปป์ทั้งในสองด้าน วันนี้ ข้าได้เห็นผืนน้ำอันกว้างใหญ่นั้นด้วยตาตนเองเป็นครั้งแรก\n\nและในที่สุดข้าก็เข้าใจถึงประกายในดวงตาของเหล่านักเล่าเรื่องขณะที่พวกเขาพยายามหาถ้อยคำมาบรรยายถึงผืนน้ำอันไร้ที่สิ้นสุด ข้านั่งลงและจ้องมองไปยังเส้นขอบฟ้า ที่ ซึ่งท้องนภาอันแจ่มใสคุ้นเคยของเทงกรีสัมผัสกับผืนน้ำสีครามอย่างนุ่มนวล\n\nข้ารู้สึกถึงละอองเค็มของทะเลที่ลูบไล้ใบหน้าอย่างแผ่วเบา จังหวะอันสงบนิ่งของเกลียวคลื่นขับกล่อมโสตประสาท ความสงบแห่งท้องทะเลนั้นท่วมท้นอย่างยิ่ง แม้จะเป็นเพียงชั่วขณะก็ตาม"
 mpo_special_flavor_events.0001.a: "ช่างยิ่งใหญ่ตระการตา..."
 mpo_special_flavor_events.0001.b: "ข้าคิดว่าจะอยู่ที่นี่สักพัก"

 mpo_events_tova.0025.t: "การละเล่นยิงชาไก"
 mpo_events_tova.0025.desc: "ข้าได้ยินเสียงเพลงแห่งการแข่งขันอันคุ้นเคย และ #EMP — แคร็ก!#! — เสียงของลูกกระดูกที่กระทบเป้าไม้ นานก่อนที่ [challenger_anda.GetTitledFirstName] ผู้เป็น [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('challenger_anda'))] ของข้า จะเข้ามาหาพร้อมประกายท้าทายในดวงตาของ [challenger_anda.GetHerHis] ซึ่งเห็นได้บ่อยครั้งกว่าเดิม\n\n"ว่าอย่างไร? มาร่วมทีมกันสักตาเพื่อเล่น [Glossary( 'ชากาย', 'ชาไก')] กันเถอะ!""
 mpo_events_tova.0025.a: "ให้เราชิงไหวชิงพริบเอาชนะคู่ต่อสู้"
 mpo_events_tova.0025.a.tt.success: "ท่านชนะการแข่งขันด้วยกลยุทธ์อันยอดเยี่ยม"
 mpo_events_tova.0025.a.tt.failure: "สติปัญญาของท่านพิสูจน์ว่าทื่อทึบ"
 mpo_events_tova.0025.b: "ข้าจะบดขยี้ลูกเต๋าของคู่ต่อสู้!"
 mpo_events_tova.0025.b.tt.success: "ท่านชนะการแข่งขันด้วยพละกำลังของท่าน"
 mpo_events_tova.0025.b.tt.failure: "พละกำลังของท่านพิสูจน์ว่าอ่อนแอ"
 mpo_events_tova.0025.c: "ไม่ใช่วันนี้ สหาย"
 mpo_sharp_wits_modifier: "ปฏิภาณเฉียบแหลม"
 mpo_sharp_wits_modifier.desc: "ตัวละครนี้ฝึกฝนประสาทสัมผัสและปฏิภาณให้เฉียบคมผ่านการใช้กลยุทธ์ในการละเล่นยิงชาไก"
 mpo_thunder_knuckles_modifier: "ข้อมืออสนี"
 mpo_thunder_knuckles_modifier.desc: "ตัวละครนี้ขว้างลูกชาไกด้วยพลังประดุจเสียงอสนีบาตอันกึกก้อง"

 mpo_events_tova.0030.t: "นิมิตอันสูงส่ง"
 mpo_events_tova.0030.desc: "เมื่อดวงอาทิตย์เพิ่งจะทาบทาขอบฟ้า [visionary.GetTitledFirstName] ผู้เป็น [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('visionary'))] ของข้า ก็รีบร้อนมาอยู่ข้างกายข้า แก้มแดงก่ำด้วยความตื่นเต้น ดวงตาเปล่งประกาย\n\n"ท่าน [ROOT.Char.GetTitleTierName], ข้าต้องเล่านิมิตที่ปรากฏแก่ข้าในฝันให้ท่านฟัง!" [visionary.GetSheHe] ร้องอุทาน "ข้าเห็น "
 mpo_events_tova.0030.desc_red: "วัวตัวผู้สีแดงมีกระดิ่งผูกอยู่ที่เขาของมัน กำลังส่ายหัวไปมา มันร้องคำรามว่า "
 mpo_events_tova.0030.desc_white: "เสือดาวสีขาวกระโจนลงมาจากหมู่เมฆและขีดข่วนทรายเป็นร่องลึก มันคำรามว่า "
 mpo_events_tova.0030.desc_green: "ไก่ตัวผู้สีเขียววิ่งอยู่บนรัศมีดวงอาทิตย์และสั่นสะบัดปีกของมัน มันขันว่า "
 mpo_events_tova.0030.desc_outro: "ว่า [ROOT.Char.GetTitledFirstNameNoTooltip] ผู้ยิ่งใหญ่ถูกลิขิตให้ปกครองทั้งสวรรค์และโลกหล้า!""
 mpo_events_tova.0030.a: "เจ้าได้รับพรสวรรค์พิเศษอย่างแท้จริง!"
 mpo_events_tova.0030.b: "สวรรค์ย่อมต้องโปรดปรานข้าและการกระทำของข้า"
 mpo_events_tova.0030.c: "เป็นเรื่องเล่าที่ดี"
 mpo_heavens_favor_modifier: "ความโปรดปรานจากสวรรค์"
 mpo_heavens_favor_modifier.desc: "ตัวละครนี้มีกำลังใจฮึกเหิมจากนิมิตอันเป็นมงคล"
 mpo_heavens_favor_martial_modifier: "$mpo_heavens_favor_modifier$"
 mpo_heavens_favor_martial_modifier.desc: "$mpo_heavens_favor_modifier.desc$"
