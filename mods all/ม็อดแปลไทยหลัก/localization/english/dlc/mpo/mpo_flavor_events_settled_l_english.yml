l_english: 
 mpo_flavor_events_settled.0001.t: "พายุที่คืบคลาน"
 mpo_flavor_events_settled.0001.desc: "ลมเยียบเย็นบาดแก้มข้าราวกับคมแก้ว ลมฟ้าอากาศระยะนี้เยียบเย็นผิดกว่าปกติ\n\nเสียงม้าร้องเรียกความสนใจของข้า ในขณะที่ข้ากำลังจะหันกลับเข้าไปข้างในพอดี ผู้ขี่แทบจะประคองบังเหียนมิได้\n\n"ช่วยด้วย..." [nomad.GetSheHe] พึมพำ จวนเจียนจะสิ้นแรงล้มลง "มหาเหมันต์มาเยือนแล้ว ผู้คนของข้ากำลังล้มตาย ในความพยายามหลีกหนีจากทุ่งหญ้าสเตปป์""
 mpo_flavor_events_settled.0001.aa: ""จงไปให้พ้น!""
 mpo_flavor_events_settled.0001.a: ""ให้พวกมันเข้ามา!""
 mpo_flavor_events_settled.0001.b: ""เราจักต้องเตรียมรับมือพวกชนเผ่าเร่ร่อนเหล่านี้""
 mpo_flavor_events_settled.0001.c: ""บัดนี้เจ้าพักได้แล้ว""
 mpo_settled_preparations_war_county_modifier: "การเตรียมพร้อมรบ"
 mpo_settled_preparations_war_county_modifier_desc: "ตัวละครนี้กำลังเตรียมการรับมือการรุกรานของชนเผ่าเร่ร่อนที่จวนจะถึง โดยการเสริมความแข็งแกร่งให้แก่กองทัพ"
 mpo_settled_preparations_building_county_modifier: "การเตรียมการอาณาเขต"
 mpo_settled_preparations_building_county_modifier_desc: "ตัวละครนี้กำลังเตรียมการรับมือการรุกรานของชนเผ่าเร่ร่อนที่จวนจะถึง ด้วยการตรวจตราให้แน่ใจว่าเหล่าเคาน์ตีของตนพร้อมรับสถานการณ์"
 mpo_flavor_events_settled.0001.tt: "@alert_icon! #alert_trial [nomads|E] อาจพยายามเข้ายึดครองอาณาเขตของพวกเรา#!"
 
 mpo_flavor_events_settled.0010.t: "จ้าวแห่งอาชา"
 mpo_flavor_events_settled.0010.desc: "#Emp "Ksk! Ksk!"#! [nomad.GetWomanMan] แปลกหน้าผู้หนึ่งตบข้างอาชาของ [nomad.GetHerHis] เบาๆ เพื่อให้มันสงบลง จากนั้นจึงเคลื่อนเข้ามาหาข้า\n\n"คารวะ ท่านผู้ทรงเกียรติ [ROOT.Char.GetTitleAsNameNoTooltip] ข้าเป็นราชทูตแห่งองค์ [nomad_lord.GetTitledFirstName] ผู้ยิ่งใหญ่ [nomad_lord.GetLadyLord] ของข้าได้ส่งข้ามาเพื่อเสนอการสงบศึกระหว่างชนของเราทั้งสองฝ่าย""
 mpo_flavor_events_settled.0010.a: ""ขอท่านโปรดรับเครื่องบรรณาการของข้าด้วยเถิด""
 mpo_flavor_events_settled.0010.b: ""ข้าเชื่อมั่นว่าเราจักสามารถบรรลุข้อตกลงกันได้""
 mpo_flavor_events_settled.0010.b_perk_tt: "[perk|E] [GetPerk('defensive_measures_perk').GetName( GetNullCharacter )] ของท่าน เอื้อให้ท่านสามารถเจรจาต่อรอง เพื่อให้ได้เงื่อนไขที่ดีกว่า"
 mpo_flavor_events_settled.0010.c: "#EMP ถ่มน้ำลายลงบนพื้นดิน.#!"
 mpo_flavor_events_settled.0010.d: ""จงนำความเคารพนับถือของข้าไปคารวะแด่ [nomad_lord.GetLadyLord] ของท่านด้วย""
