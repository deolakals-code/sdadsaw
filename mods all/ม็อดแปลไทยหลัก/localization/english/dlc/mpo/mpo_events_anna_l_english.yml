l_english: 

 mpo_events_anna.0001.t: "ฝึกปรือ แต่เยาว์วัย"
 mpo_events_anna.0001.desc: "ข้าและ [pushy_adult.GetFirstName] ผู้เป็น [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('pushy_adult'))] ของข้า กำลังเฝ้ามอง [child.GetFirstName] ผู้เป็น [child.Custom('GetDaughterSon')] ของข้า ขณะที่ [child.GetSheHe] กำลังวิ่งเล่นอย่างร่าเริงข้ามค่ายพักแรม โดยมีก้อนหินสองสามก้อนในมือ เตรียมพร้อมที่จะเล่น [pushy_adult.GetFirstNameNoTooltip] หันมาหาข้าอย่างกระตือรือร้นพร้อมรอยยิ้มกว้าง\n\n"ท่านไม่คิดหรือว่าถึงเวลาแล้วที่ [child.GetFirstNameNoTooltip] จะเรียนรู้วิธีขี่ม้าแทนที่จะเล่นเกมไร้สาระแบบเด็ก ๆ เช่นนี้? ข้าได้เตรียมลูกม้าที่เชื่องที่สุดไว้ตัวหนึ่งกับเชือกอีกจำนวนหนึ่ง ซึ่งน่าจะช่วยให้ [child.GetHerHim] ปลอดภัยระหว่างการขี่ครั้งแรกของ [child.GetHerHis]""

 mpo_events_anna.0001.a: "ให้ [child.GetFirstNameNoTooltip] ขึ้นม้าด้วยตนเอง"
 mpo_events_anna.0001.a.tt: "ข้าจะผูก [child.GetFirstNameNoTooltip] ติดกับม้าด้วยเชือก"
 mpo_events_anna.0001.a.toast.good: "[child.GetFirstNameNoTooltip] เรียนรู้วิธีขี่ม้า"
 mpo_events_anna.0001.a.toast.neutral: "[child.GetFirstNameNoTooltip] มิได้เรียนรู้วิธีขี่ม้า"
 mpo_events_anna.0001.a.toast.bad: "[child.GetFirstNameNoTooltip] ตกจากหลังม้า"
 mpo_events_anna.0001.b: "ขี่ม้าไปกับ [child.GetFirstNameNoTooltip] เพื่อให้พวกเขาได้เรียนรู้"
 mpo_events_anna.0001.c: ""[child.GetFirstNameNoTooltip] จะเข้าใจได้เองเมื่อถึงเวลาอันควร""

 mpo_events_anna.0005.t: "เรื่องเล่าจากอดีตกาล"
 mpo_events_anna.0005.desc: "เมื่อรัตติกาลมาเยือน หมู่ดาวส่องประกายเจิดจรัสจากมุมมืดที่สุดของฟากฟ้า กองไฟกำลังลุกวูบไหวอยู่ท่ามกลางเหล่าเยิร์ต เป็นภาพอันเชื้อเชิญสำหรับฝูงชนที่มารวมตัวกัน\n\n[storyteller.GetFirstName] นักเล่าเรื่องของเราในค่ำคืนนี้ มองไปในหมู่ฝูงชนที่ตื่นเต้น ราวกับกำลังมองหาบางสิ่ง หรือ #EMP บางคน#!.\n\nสายตาของเราสบกัน และ [storyteller.GetFirstNameNoTooltip] ก็กระโจนมาข้างหน้าในทิศทางของข้าทันที ทำให้กลุ่มคนถอยหลังด้วยความตระหนกเล็กน้อยจากการกระโจนนั้น นิ้วมือของ [storyteller.GetHerHim] ค่อยๆ ยกขึ้น และในที่สุดก็ชี้มาที่ข้า "บัดนี้ถึงตาของท่านแล้วที่จะเลือกเรื่องเล่าจากแดนไกลให้เล่าขานอีกครั้ง!""
 mpo_events_anna.0005.a: ""เล่าเรื่องอันอัศจรรย์พันลึกให้พวกเราฟังเถิด""
 mpo_events_anna.0005.a.tt: "อาชาพยศติดปีกโบยบิน เหล่าสิงสาราสัตว์สนทนากับมนุษย์ และลมฟ้าอากาศอันน่าสะพรึงกลัวที่ควบคุมโดยทวยเทพ"
 mpo_events_anna.0005.b: ""บางทีอาจเป็นเรื่องตลกขบขันให้พวกเราได้สรวลเสเฮฮาบ้างกระมัง?""
 mpo_events_anna.0005.b.tt: "เรื่องราวซุกซนของเหล่าบุรุษสูงวัย คำขอที่เข้าใจผิดเพี้ยน และการแข่งขันที่พลิกผันไปในทิศทางที่คาดไม่ถึงโดยสิ้นเชิง"
 mpo_events_anna.0005.c: ""ตำนานวีรกรรมอันหาญกล้า!""
 mpo_events_anna.0005.c.tt: "การยุทธ์อันรุ่งโรจน์ มิตรภาพดุจพี่น้องร่วมสาบาน และเหล่านักรบในตำนานผู้สร้างความหวาดหวั่นให้แก่เหล่าศัตรู"

 mpo_events_anna.0010.t: "ผิวปากดุจเสียงศร"
 mpo_events_anna.0010.desc: "ในระยะไกล ข้ามองเห็นม้าบางตัวในค่ายของเรากำลังเล็มหญ้าอย่างสงบสุข ข้าอยากจะทำความรู้จักพวกมันให้ดีขึ้น แต่การเรียกร้องความสนใจจากพวกมันช่างยากเย็นนัก ข้าพยายามทั้งโบกไม้โบกมือ เดินไปเดินมา และส่งเสียงร้อง — แต่กลับได้มาเพียงความเงียบงัน\n\nด้วยความหัวเสียกับความพยายามอันไร้ผล ข้าจึงหันหลังกลับและมุ่งหน้ากลับค่าย แต่กลับชนเข้ากับ [whistler.GetFirstName] อย่างจัง\n\n"เราคงต้องสอนกลเม็ดใหม่ๆ ให้ท่านไว้ใช้เรียกอาชาของท่านเสียแล้ว ตามข้ามา""
 mpo_events_anna.0010.a: "ตั้งใจฟังคำแนะนำอย่างถี่ถ้วน"
 mpo_events_anna.0010.a.tt.learning: "[learning skill|E] ของ [whistler.GetFirstNamePossessive] จะเพิ่มโอกาสสำเร็จของท่าน"
 mpo_events_anna.0010.a.tt.success: "ท่านผิวปากได้สำเร็จ"
 mpo_events_anna.0010.a.tt.failure: "ท่านมิเข้าใจคำแนะนำของ [whistler.GetFirstNamePossessiveNoTooltip]"
 mpo_events_anna.0010.b: ""ข้าจะเรียนเมื่อข้ารู้สึกอยากเรียนเอง!""

 mpo_events_anna.0015.t: "เศษเนื้อประทังชีวิต"
 mpo_events_anna.0015.desc: "เสียงร้องครวญครางแผ่วเบาของสัตว์เดรัจฉานดังก้องไปทั่วเนินเขา ด้วยความสงสัย ข้าจึงเข้าไปดูใกล้ๆ\n\nมีลูกกวางที่ถูกทอดทิ้งติดอยู่ใน [Glossary( 'คอนกสเต', 'KHOGSTE_GLOSS' )] กำลังพยายามดึงขาของมันออกอย่างสุดชีวิตพร้อมกับร้องเรียกหาความอบอุ่นจากแม่ของมัน — แต่ไร้ผล\n\nแม้ว่ามันจะไม่ใช่ของเราที่จะเอาไป แต่เราต้องทำทุกวิถีทางเพื่อความอยู่รอดในการเดินทางอันยากลำบากข้างหน้า"
 mpo_events_anna.0015.a: "ขโมยเหยื่อเพื่อเป็นเสบียง"
 mpo_events_anna.0015.b: "โป้ปดว่าเป็นกับดักของข้าตั้งแต่แรก"
 mpo_events_anna.0015.c: "ปล่อยสัตว์ เพื่อให้มันมีโอกาสเติบโต"
 mpo_events_anna.0015.d: "มันมิใช่ของที่ข้าจะเอาไปได้"
 KHOGSTE_GLOSS: "กับดักเท้าที่ถูกฝังและยึดไว้กับพื้นดิน ทำจากหินหลายชนิด"

 mpo_events_anna.0020.t: "แข่งกับเวลา"
 mpo_events_anna.0020.desc: "เสียงกีบม้าดังกึกก้องควบตะบึงข้ามทุ่งนา ตรงมายังพวกเรา เงาร่างของ [messenger.GetWomanMan] บนหลังม้าปรากฏขึ้น พยายามอย่างสุดกำลังที่จะไม่ตกจากอาชาของ [messenger.GetHerHis] ประคองตัวอย่างยากลำบาก\n\n[messenger.GetSheHe|U] หยุดกะทันหันเบื้องหน้าพวกเรา ค่อยๆ ลงจากม้าของ [messenger.GetHerHis] อย่างทุลักทุเลเห็นได้ชัด บาดแผลฉกรรจ์ปรากฏอยู่บนแผ่นหลังของ [messenger.GetHerHis] นับเป็นปาฏิหาริย์ที่ [messenger.GetSheHe] ยังคงยืนอยู่ได้\n\n“ท-ท่าน ต-ต-ต้อง ส-ส่ง... ข-ข-ขอร้อง...” เป็นคำพูดสุดท้ายที่ [messenger.GetSheHe] เค้นออกมาได้ ขณะชี้ไปยังขอบฟ้าอย่างเจ็บปวด พร้อมกับสาส์นลับในมือ ก่อนที่ [messenger.GetHerHis] จะหลับตาลงและล้มพับสิ้นใจ... "
 mpo_events_anna.0020.war_impact.tt: "ผลลัพธ์จากตัวเลือกของท่าน #EMP อาจ#! ส่งผลกระทบต่อผู้อื่นในที่อื่นได้"
 mpo_events_anna.0020.a: "รักษาบาดแผลของ [messenger.GetHerHis] เร็วเข้า!"
 mpo_events_anna.0020.a.toast.good: "ท่านรักษาผู้ส่งสาส์นได้สำเร็จ"
 mpo_events_anna.0020.a.toast.bad: "ท่านมิได้รักษาบาดแผลของผู้ส่งสาส์น"
 mpo_events_anna.0020.b: "รับคำสั่งเสียสุดท้ายของ [messenger.GetHerHis] เพื่อนำสาส์นไปส่งด้วยตนเอง"
 mpo_events_anna.0020.b.toast.good: "ท่านส่งสาส์นถึงคนต่อไปได้สำเร็จ"
 mpo_events_anna.0020.b.toast.bad: "ท่านหลงทาง มิสามารถส่งสาส์นต่อไปได้"
 mpo_events_anna.0020.c: "ข้าไม่รู้จักคนผู้นี้ และมิทราบว่า [messenger.GetSheHe] จะไว้ใจได้หรือไม่"
 mpo_events_anna.0020.c_flavor: "#EMP ปล้นศพของ [messenger.GetHerHis] เถิด ดูท่า [messenger.GetSheHe] คงไม่ต้องการมันอีกต่อไปแล้ว#!"

 mpo_events_anna.0025.t: "ท่วงทำนองอันคุ้นเคย"
 mpo_events_anna.0025.desc: "บทเพลงสามารถ ทำให้ผู้คนรู้สึกผูกพันกันมากขึ้นเป็นเวลาหลายศตวรรษหลังจากที่เพลงเหล่านั้นถูกประพันธ์ขึ้น บทเพลงอื่น ๆ สามารถสร้างแรงบันดาลใจ หรือนำพาความปลอบประโลมและการพักผ่อนอันเป็นที่ปรารถนามาให้เราในยามยากลำบาก บางบทเพลงมีไว้เพื่อปลุกขวัญกำลังใจของเราให้สู้ต่อไป บทเพลง เช่นนี้ยากที่จะเลือนหาย และเป็นส่วนหนึ่งของมรดกของเรา\n\nการเผชิญหน้ากับนักร้องผู้หนึ่ง ซึ่งนั่งอยู่บนโขดหินได้เตือนให้ข้าระลึกถึงสิ่งเหล่านี้ ขณะที่ข้ากำลังเคลิบเคลิ้มไปกับการแสดงของพวกเขา"
 mpo_events_anna.0025.a: "ลองเลียนเสียงและขับขานตาม"
 mpo_events_anna.0025.a.toast.success: "ท่านขับขานตาม [throat_singer.GetFirstName] ได้สำเร็จ"
 mpo_events_anna.0025.a.toast.failure: "จังหวะและระดับเสียงของท่านผิดเพี้ยนไปบ้าง"
 mpo_events_anna.0025.b: "ตั้งใจฟังและเพลิดเพลิน"
