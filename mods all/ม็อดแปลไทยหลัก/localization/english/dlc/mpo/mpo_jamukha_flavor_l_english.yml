jamukha_gain_from_defectors_tt: "#weak การได้รับ @herd_icon![herd|E] และ @prestige_icon![prestige|E] เนื่องมาจากการรวมพลของชาวมองโกลเพื่อทำสงคราม"
temujin_gain_from_defectors_tt: "$jamukha_gain_from_defectors_tt$"
 mpo_jamukha_flavor.0020.a: "#EMP "เจ้าสุนัขเลวทราม ผู้เคยเป็นน้องข้า!"#!"
 mpo_jamukha_flavor.0020.b: ""ความตายของเจ้าจักน่าสมเพชยิ่งนัก [temujin.GetFirstNameNoTooltip]...""
 mpo_jamukha_flavor.0020.c: ""ณ สมรภูมิรบ #EMP ชะตากรรมของเจ้าจักเป็นของข้า!#!""


 mpo_jamukha_flavor.0020.b_murder: "ท่านได้รับโบนัส #P #EMP มหาศาล#!#! ต่อ [schemes|E] [GetScheme('murder').GetTypeName] ที่มุ่งเป้าไปยัง [temujin.GetShortUIName]"
mpo_jamukha_flavor.0020.a_war_win: "การชนะ [war|E] #high เชิงรุก#! ต่อ [temujin.GetShortUIName] จะมอบ @legitimacy_icon![legitimacy|E] และ @prestige_icon![prestige|E] เพิ่มเติม"
