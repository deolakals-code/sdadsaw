 #St Peter's Basilica
 building_type_holy_site_st_peters_basilica_01: "$building_holy_site_st_peters_basilica_01$"
 building_type_holy_site_st_peters_basilica_01_desc: "$building_holy_site_st_peters_basilica_01_desc$"
 building_holy_site_st_peters_basilica_01: "มหาวิหารนักบุญเปโตร"
 building_holy_site_st_peters_basilica_01_desc: "สร้างขึ้นเหนือหลุมศพของนักบุญเปโตรที่เนินเขาติกันตามพระราชโองการของจักรพรรดิคอนสแตนตินที่ 1 หลังจากที่พระองค์เปลี่ยนมานับถือศาสนาคริสต์ มหาวิหารนักบุญเปโตรเป็นศูนย์กลางของคริสตจักรในโลกตะวันตก\n\nตามธรรมเนียมแล้ววิหารแห่งนี้เป็นที่พำนักของพระสันตะปาปาแห่งโรมันคาทอลิกและได้ขยายใหญ่โตขึ้นตลอดหลายศตวรรษจนกลายเป็นหมู่อาคารอันกว้างขวาง ปกป้องด้วยกำแพงเลโอไนน์"
 
 
 #Mont-Saint-Michel
 building_type_mont_st_michel_01: "มงแซ็งมีแชล"
 building_type_mont_st_michel_01_desc: "$building_mont_st_michel_01_desc$"
 building_mont_st_michel_01: "หอพระนักบุญโอแบร์ตแด่นักบุญไมเคิล"
 building_mont_st_michel_01_desc: "ในปี ค.ศ. 708 นักบุญโอแบร์ต บิชอปแห่งอาวรองช์ ได้นิมิตเห็นอัครทูตสวรรค์ไมเคิล สั่งให้ท่านสร้างหอพระบนเกาะที่มีน้ำขึ้นน้ำลงในบริเวณใกล้เคียง ในตอนแรกโอแบร์ตเพิกเฉยต่อนิมิตนี้ โดยคิดว่าเป็นกลอุบายของปีศาจ ในที่สุดอัครทูตสวรรค์ก็สามารถโน้มน้าวท่านได้ - ตามตำนานกล่าวว่าด้วยการใช้นิ้วจิ้มจนเป็นรูที่กะโหลกศีรษะของท่าน และบิชอปจึงสั่งให้สร้างสถานที่ศักดิ์สิทธิ์แห่งใหม่บนมงตงบ์\n\nประวัติศาสตร์ของมงแซ็งมีแชลจึงเริ่มต้นขึ้น"
 building_mont_st_michel_02: "อารามแบบโรมาเนสก์แห่งมงแซ็งมีแชล"
 building_mont_st_michel_02_desc: "โบสถ์แห่งใหม่ของอารามตั้งอยู่บนจุดสูงสุดของเกาะ เพื่อเป็นเครื่องยืนยันถึงอำนาจของพระเจ้าผู้ทรงอยู่เหนือทุกสิ่งในสวรรค์และโลก และเพื่อแสดงถึงความเฉลียวฉลาดของมนุษยชาติ\n\nภายใต้อาราม เมืองเล็กๆ ของผู้แสวงบุญและชาวประมงกำลังค่อยๆ เติบโตขึ้น"
 building_mont_st_michel_03: "เดอะแมร์เวย์"
 building_mont_st_michel_03_desc: "อารามได้รับการขยายด้วยระเบียงคด หอพระ โรงเก็บไวน์ ห้องอัศวิน และที่พักอาศัยมากมาย ก่อตัวเป็นหมู่อาคารแบบโกธิกที่เรียกได้ว่าเป็นสิ่งมหัศจรรย์ทางวิศวกรรม\n\nอารามมีป้อมปราการใหม่ที่น่าเกรงขาม และชุมชนข้างใต้ได้กลายเป็นเมืองที่สมบูรณ์ เป็นที่อยู่อาศัยของผู้แสวงบุญและชาวบ้านมากมาย"
 building_mont_st_michel_04: "ป้อมปราการอารามมงแซ็งมีแชล"
 building_mont_st_michel_04_desc: "สงครามเมื่อเร็วๆ นี้ ทำให้เห็นชัดเจนว่าแม้ แต่เกาะแห่งสันติภาพอย่างมงแซ็งมีแชลก็สามารถเป็นจุดยุทธศาสตร์ที่สำคัญได้ ด้วยเหตุนี้ โขดหินจึงได้รับการเสริมความแข็งแกร่งอย่างทั่วถึงด้วยกำแพงหนาและป้อมปราการ และมีการสร้างที่พักอาศัยใหม่หลายแห่งสำหรับกองทหารรักษาการณ์\n\nเมืองชายฝั่งนี้กลายเป้นเมืองที่มีชีวิตชีวา โดยมีบ้านเรือนปกคลุมเกือบทั่วทั้งเกาะ"
 
 
 #Sanchi Stupa
 building_type_sanchi_stupa_01: "$building_sanchi_stupa_01$"
 building_type_sanchi_stupa_01_desc: "$building_sanchi_stupa_01_desc$"
 building_sanchi_stupa_01: "มหาเจดีย์สาญจี"
 building_sanchi_stupa_01_desc: "มหาเจดีย์นี้สร้างขึ้นโดยจักรพรรดิอโศกแห่งราชวงศ์เมารยะในศตวรรษที่ 3 ก่อนคริสตกาล ใกล้กับสถานที่จัดพิธีอภิเษกสมรสของพระองค์กับพระนางเทวี โครงสร้างอันยิ่งใหญ่ที่บรรจุพระบรมสารีริกธาตุของพระพุทธเจ้าเป็นหนึ่งในสิ่งก่อสร้างเก่าแก่ที่สุดของประเภทนี้ และยังมีชื่อเสียงเรื่องซุ้มประตูโทรณะที่แกะสลักอย่างวิจิตรบรรจง"
 
 
 #Boudhanath
 building_type_boudhanath_01: "$building_boudhanath_01$"
 building_type_boudhanath_01_desc: "$building_boudhanath_01_desc$"
 building_boudhanath_01: "พุทธนาถ"
 building_boudhanath_01_desc: "มหาเจดีย์พุทธนาถแห่งกาฐมาณฑุ หรือที่รู้จักในชื่อจารุง กาศร และขาสะเจดีย์ เป็นหนึ่งในเจดีย์ที่ใหญ่ที่สุดในพุทธศาสนา และอาจเป็นจุดกำเนิดของพุทธศาสนานิกายทิเบต โดมและมณฑลขนาดมหึมาเป็นที่ประดิษฐานพระบรมสารีริกธาตุของพระพุทธเจ้าหลายพระองค์และวัตถุมงคลนับไม่ถ้วน\n\nเนื่องจากตั้งอยู่บนเส้นทางสายไหมโบราณระหว่างเนปาลและทิเบต นักเดินทางและพ่อค้าจึงมักแวะพักและสวดมนต์ที่นี่"
 
 
 #Grand Mosque of Yazd
 building_type_yazd_mosque_01: "$building_yazd_mosque_01$"
 building_type_yazd_mosque_01_desc: "$building_yazd_mosque_01_desc$"
 building_yazd_mosque_01: "มัสยิดหลวงแห่งยาซด์"
 building_yazd_mosque_01_desc: "สร้างขึ้นบนพื้นที่ของวิหารไฟจากศตวรรษที่ 4 อาคารอันเลื่องชื่อนี้สร้างความประหลาดใจแก่นักเดินทางและผู้แสวงบุญด้วยไอวานขนาดใหญ่ โดมกระเบื้อง และซุ้มประตูทางเข้าอันโอ่อ่าพร้อมหออะซานคู่ที่สูงเสียดฟ้า"
 
 
 #Qutb Minar
 building_type_qutb_minar_01: "$building_qutb_minar_01$"
 building_type_qutb_minar_01_desc: "$building_qutb_minar_01_desc$"
 building_qutb_minar_01: "เสาเหล็กแห่งเดลี"
 building_qutb_minar_01_desc: "เสาเหล็กอันยิ่งใหญ่แห่งเดลียืนหยัดเป็นสัญลักษณ์แห่งความรุ่งโรจน์ของพระเจ้าจันทรคุปต์ที่ 2 แม้ผู้ปกครองในยุคต่อมาจะจารึกชื่อของตนลงไป เช่นกัน แม้จะตั้งตระหง่านมาเป็นเวลานาน แต่ก็ไม่มีร่องรอยของสนิม – เป็นข้อพิสูจน์ถึงทักษะของช่างตีเหล็กชาวอินเดีย!"
 building_qutb_minar_02: "กุตบ์มีนาร์"
 building_qutb_minar_02_desc: "มัสยิดกุญวัต-อุล-อิสลาม มัสยิดหลวงที่รายล้อมพื้นที่เก่าแก่ที่เป็นที่ตั้งของเสาเหล็กแห่งเดลี สวมมงกุฎด้วยหออะซานขนาดมหึมาที่เรียกว่ากุตบ์มีนาร์\n\nอนุสาวรีย์อันงดงามแด่อำนาจของผู้ปกครองแห่งเดลี"
 building_qutb_minar_03: "มัสยิดกุญวัต-อุล-อิสลามส่วนขยาย"
 building_qutb_minar_03_desc: "คอมเพล็กซ์รอบกุตบ์มีนาร์ได้รับการขยายด้วยลานกว้าง ซุ้มประตู และสุสานอีกหลายแห่ง จนมีขนาดใหญ่โตระดับตำนาน"
 building_qutb_minar_04: "อะลัยมีนาร์"
 building_qutb_minar_04_desc: "หออะซานแห่งที่สองถูกเพิ่มเข้าไปในคอมเพล็กซ์ ออกแบบตามอย่างกุตบ์มีนาร์ แต่มีขนาดใหญ่กว่าถึงสองเท่า ยักษ์ใหญ่ที่สูงตระหง่านเหนือเดลีนี้คือจุดสูงสุดของสถาปัตยกรรมอินโด-อิสลาม"
