 fp2_every_major_same_faith_vassal_notifier:0 "ข้าในบังคับ [dyloc_powerful_vassal_faith.GetAdjective] ผู้ทรงอำนาจทุกคน"
 fp2_every_major_different_faith_vassal_notifier:0 "ข้าในบังคับที่ไม่ใช่ [dyloc_powerful_vassal_faith.GetAdjective] ผู้ทรงอำนาจทุกคน"
