 fp2_struggle.2050.desc_court:0 "เสียงกระซิบแพร่กระจายไปทั่วราชสำนักของข้าราวกับถ่านไฟที่กำลังลุกโชน รู้สึกราวกับว่าทุกคนรอบตัวข้าเชื่อว่า [fp2_2050_el_cid.GetFullName] กระทำการลับหลังข้า\n\nข่าวลือเรื่องเครื่องบรรณาการที่ถูกขโมย การทำสงครามโดยไม่ได้รับอนุญาต และการกระทำอื่นๆ ที่ ทำให้อำนาจของข้าถูกตั้งคำถามโดยราชสำนัก ข้าไม่สงสัยในความซื่อสัตย์ของ [fp2_2050_el_cid.GetFirstName] แต่ข้าจะสามารถเก็บชายที่ดึงดูดข่าวลือร้ายๆ เช่นนี้มาสู่ราชสำนักของข้าได้หรือไม่? ตอนนี้ไม่สามารถหยุดยั้งได้แล้ว และหากข้าไม่ดำเนินการในไม่ช้า ข้าจะถูกมองว่าอ่อนแอ"
 fp2_struggle.2050.desc_knights:0 "ขณะเดินไปตามโถง [ROOT.GetCharacter.Custom('FortifiedBuilding')] ข้าสังเกตเห็นว่า [ROOT.GetCharacter.Custom('KnightCulturePluralNoTooltipLowercase')] ทั้งหมดของข้าอยู่ในสภาพขวัญเสีย การปรากฏตัวของ [fp2_2050_el_cid.GetFullNameNicknamed] เป็นแรงบันดาลใจให้ทหารธรรมดาทำสิ่งที่ยิ่งใหญ่ แต่กลับ ทำให้ [ROOT.GetCharacter.Custom('KnightCultureNoTooltipLowercase')] ผู้สูงศักดิ์เหี่ยวเฉาไปในรัศมีของเขา\n\nในฐานะผู้บัญชาการที่มีพรสวรรค์และนักรบที่คู่ควรกับนิทาน ไม่มีข้อสงสัยเกี่ยวกับคุณค่าที่ [fp2_2050_el_cid.GetFirstNameNicknamed] นำมาสู่กองทัพของข้า แต่หากความแข็งแกร่งของชายคนหนึ่ง ทำให้เกิดความอ่อนแอในผู้อื่น... ข้าจะสามารถอนุญาตให้ตนเองเก็บอิทธิพล เช่นนี้ไว้ท่ามกลาง [ROOT.GetCharacter.Custom('KnightCulturePluralNoTooltipLowercase')] ของข้าได้จริงหรือ?"
 fp2_struggle.2050.desc_nobles:0 "ขุนนางจากทั่วทั้งอาณาจักรเข้ามาหาข้าเมื่อเร็วๆ นี้เพื่อแบ่งปันความกังวล เรื่องซุบซิบ และความคิดเห็นที่เป็นปฏิปักษ์อย่างเปิดเผยเกี่ยวกับ [ROOT.Char.Custom2('RelationToMe', fp2_2050_el_cid)] [fp2_2050_el_cid.GetFirstNameNicknamed] ของข้า เป็นที่ชัดเจนว่าขุนนางไม่ชอบการปฏิบัติต่อ [fp2_2050_el_cid.GetFirstName] อย่างลำเอียงของข้า และต้องการเห็น [ROOT.GetCharacter.Custom('KnightCultureNoTooltipLowercase')] ที่เพิ่งสร้างตัวขึ้นใหม่นี้ถูกเนรเทศออกไปก่อนที่สามัญชนคนใดจะพยายามเดินตามรอยเท้าเขา [fp2_2050_el_cid.GetFirstName] อาจเคยเป็นขุนนางมาก่อน แต่ตอนนี้เขาคือ [ROOT.GetCharacter.Custom('KnightCultureNoTooltipLowercase')] ที่สร้างตัวเองขึ้นมาและเป็นภัยคุกคามต่อโครงสร้างทางสังคมของอาณาจักร\n\nการตัดสินใจเป็นของข้า แต่การเก็บ [fp2_2050_el_cid.GetFirstName] ไว้รอบตัวเป็นอันตรายต่อสถานะของข้ากับขุนนาง"
 fp2_struggle.2050.desc_faith:0 "ทุกที่ที่ข้าไป ข้าเห็นการขาดความเคารพสะท้อนอยู่ในสายตาของ [ROOT.Char.Custom('DefaultPriestTitlePlural')] ของข้า ข่าวลือไร้สาระที่ว่าความกระหายในดินแดนและทองคำของข้าได้นำข้าหลงทางจาก [ROOT.GetCharacter.GetFaith.HighGodName] และไปเข้าข้างทหารรับจ้างไร้พระเจ้า เช่น [fp2_2050_el_cid.GetFirstNameNicknamed] ซึ่งไม่สนใจว่าพวกเขาต่อสู้เพื่อใคร\n\nจิตใจอันโง่เขลาของพวกเขาถูกบดบังด้วยภาพลวงตาอันโรแมนติกของการทำสงครามแบบอัศวินที่ ซึ่งมีเพียงผู้ศรัทธาเท่านั้นที่ปกป้องศรัทธาของตน เมื่อในความเป็นจริง เป็น เพราะคน เช่นเขาที่วิถีชีวิตของเราปลอดภัย อย่างไรก็ตาม หากข้าจะยังคงอยู่ในความโปรดปรานของนักบวชของข้า บางทีอาจถึงเวลาที่ข้าควรพิจารณาเนรเทศ [fp2_2050_el_cid.GetFirstName]"
 fp2_struggle.2050.a:0 "ข้าเชื่อใจ [ROOT.Char.Custom2('RelationToMe', fp2_2050_el_cid)] ของข้า และเขาจะอยู่ต่อ!"
 fp2_struggle.2050.a.serve_tooltip:0 "[fp2_2050_el_cid.GetFirstNameNicknamedNoTooltip] ยังคงรับใช้ท่านต่อไป"
 fp2_struggle.2050.a.notif.t:0 "[fp2_2050_el_cid.GetNicknameNoTooltip|U] ยังคงอยู่"
 fp2_struggle.2050.b:0 "[fp2_2050_el_cid.GetFirstNameNoTooltip] จะยังคงรับใช้ข้าต่อไป ไม่ว่า อย่างไรก็ตาม!"
 fp2_struggle.2050.c:0 "บางทีอาจถึงเวลาปล่อยเขาไป..."
 fp2_struggle.2050.c.notif:0 "[fp2_2050_el_cid.GetFirstNameNicknamedNoTooltip] จะแสวงหาการจ้างงานที่อื่น..."
 fp2_struggle.2051.t:0 "[fp2_2050_el_cid.GetFirstNameNicknamedNoTooltip]"
 fp2_struggle.2051.desc:0 "อัศวินผู้มีชื่อเสียงนามว่า [fp2_2050_el_cid.GetFullName] หรือที่รู้จักในนาม "[fp2_2050_el_cid.GetNicknameNoTooltip|U]" ได้มาถึงราชสำนักของข้าเพื่อมองหาเจ้านายที่จะรับใช้ เขาเป็นผู้บัญชาการที่มีพรสวรรค์อย่างไม่ต้องสงสัยและเป็นนักรบที่คู่ควรกับตำนาน\n\n[fp2_2050_el_cid.GetFirstNameNoTooltip] ไม่มีความลังเลที่จะทำงานกับใครก็ตามที่เต็มใจต้อนรับเขาด้วยอ้อมแขนที่เปิดกว้าง นี่เป็นโอกาสที่จะรับสมัครอัศวินที่สามารถพลิกกระแสการต่อสู้ได้ด้วยตัวคนเดียว"
 fp2_struggle.2051.a:0 "อ่า ยินดีต้อนรับ! ท่านจะได้รับตำแหน่งสูงในราชสำนักของข้า"
 fp2_struggle.2051.b:0 "ชายผู้มีพรสวรรค์ เช่นท่านย่อมเป็นที่ต้อนรับในอาณาจักรของข้าเสมอ"
 fp2_struggle.2051.c:0 "จงไปหางานที่อื่นเถิด [fp2_2050_el_cid.GetFirstNameNoTooltip]"

 # fp2_2004placeholder
 fp2_struggle.2004.t:0 "กองเรืออาร์มาดาที่ยิ่งใหญ่กว่า"
 fp2_struggle.2004.desc:1 "[ROOT.Char.Custom2('RelationToMe', SCOPE.sC('2004_scoped_steward'))] ของข้า [2004_scoped_steward.GetFirstName] แจ้งข้าว่านักบันทึกเหตุการณ์[2004_scoped_steward.GetHerHis]ได้กลับมาจากการเดินทางและศึกษาเทคโนโลยีทางเรือข้ามทะเลแล้ว [2004_scoped_steward.GetSheHe|U]กล่าวว่าด้วยเงินทุน เราสามารถออกแบบเรือลำใหม่ที่จะมีประสิทธิภาพเหนือกว่าเพื่อนบ้านของเราและนำไปสู่ยุคแห่งอำนาจทางทะเลสำหรับ [ROOT.Char.GetPrimaryTitle.GetNameNoTierNoTooltip]\n\nในทางกลับกัน [2004_scoped_marshal.GetCouncilTitleFirstName] ของข้า กลับอยากใช้ทองคำนั้นในสิ่งอื่นที่ไม่ใช่เรือค้าขาย"
 fp2_struggle.2004.a:0 "ถือว่าการลงทุนนี้ได้รับการสนับสนุนแล้ว"
 fp2_struggle.2004.a.a.desc:0 "แบบเรือใหม่ถูกนำมาใช้"
 fp2_struggle.2004.a.b.desc:0 "ช่างต่อเรือที่ [fp2_2004_dockyards.GetNameNoTierNoTooltip] กลายเป็นช่างฝีมือผู้มีชื่อเสียง"
 fp2_struggle.2004.b:0 "เงินทุนเหล่านั้นสามารถนำไปใช้ประโยชน์ที่ดีกว่าที่อื่นได้"
 fp2_struggle.2004.b.desc:0 "ท่านปัดความพยายามของ [2004_scoped_steward.GetFirstNameNoTooltip] ทิ้งไปและเก็บเงินทุนไว้"
 fp2_struggle.2004.c:0 "ข้าไม่ต้องการแบบเรือใหม่ ข้าต้องการเรือที่ทำจากเงินบริสุทธิ์!"
 fp2_struggle.2004.c.desc:0 "ท่านเสี่ยงเงินทุนของท่านเพื่อโอกาสที่จะได้รับชื่อเสียงอันโดดเด่น รวบรวมช่างฝีมือที่ยิ่งใหญ่ที่สุดเพื่อสร้างสิ่งที่เป็นไปไม่ได้—เรือที่ทำจากเงินบริสุทธิ์"
 fp2_struggle.2005.t:0 "กองเรืออาร์มาดาที่ล้ำยุค"
 fp2_struggle.2005.t.alt:0 "ช่างฝีมือชั้นครูแห่ง [fp2_2004_dockyards.GetNameNoTier]"
 fp2_struggle.2005.desc:0 "เรือลำใหม่มีลักษณะการออกแบบดังต่อไปนี้:"
 fp2_struggle.2005.desc.intro:0 ""ข้า แต่เจ้าเหนือหัว ในที่สุดเรือของเราก็พร้อมที่จะออกทะเลแล้ว!" [2005_scoped_steward.GetFirstName] กล่าว "ข้าเชื่อว่าท่านจะพอใจกับการออกแบบเป็นอย่างยิ่ง"\n\n"
 fp2_struggle.2005.desc.cirt.notif:0 "การออกแบบใหม่ประสบความสำเร็จอย่างโดดเด่น! อันที่จริง อู่ต่อเรือแห่งใหม่ได้ถูกจัดตั้งขึ้นใน [fp2_2004_dockyards.GetNameNoTier] เพียงเพื่อผลิตเรือที่ทันสมัยเหล่านี้\n\n"
 fp2_struggle.2005.desc.cirt.a.notif:0 "น่าเศร้าที่ในช่วงเวลาตั้งแต่เริ่มการก่อสร้าง [fp2_2004_dockyards.GetName] ได้ตกไปอยู่ในมือของ [fp2_2004_dockyards.GetHolder.GetName] เราสามารถรักษาแบบเรือไว้ได้ แต่อู่ต่อเรือตอนนี้เป็นของพวกเขาแล้ว\n\n"
 fp2_struggle.2005.desc.newdesigner.notif:0 "ผู้ออกแบบดั้งเดิม [2004_scoped_steward.GetFirstName] ไม่ได้อยู่กับเราอีกต่อไป แต่ [2005_scoped_steward.GetFirstNameNicknamed] สามารถรับช่วงต่อและทำโครงการให้เสร็จสิ้นได้โดยปราศจาก[2004_scoped_steward.GetHerHim]\n\n"
 fp2_struggle.2005.desc.bottom.generic:0 "ส่วนท้องเรือใช้"
 fp2_struggle.2005.desc.bottom.a:1 "$fp2_struggle.2005.desc.bottom.generic$ กระดูกงูท้องแบน ซึ่งช่วยให้การเดินเรือในน้ำนิ่งมีความมั่นคง "
 fp2_struggle.2005.desc.bottom.b:1 "$fp2_struggle.2005.desc.bottom.generic$ ผนังกั้นน้ำที่ออกแบบมาเพื่อป้องกันการจมเมื่อเกิดความเสียหาย "
 fp2_struggle.2005.desc.bottom.c:1 "$fp2_struggle.2005.desc.bottom.generic$ กระดูกงูที่แหลมและลึก สามารถตัดผ่านคลื่นด้วยความเร็วสูง! "
 fp2_struggle.2005.desc.bottom.d:1 "$fp2_struggle.2005.desc.bottom.generic$ โครงเรือแบบต่อเกล็ด ทำให้ตัวเรือแข็งแรงขึ้น แต่เบาลงพร้อมกัน "
 fp2_struggle.2005.desc.unique.init:0 "จากนั้น เหนือขึ้นไปคือส่วนที่โดดเด่นที่สุด คือ"
 fp2_struggle.2005.desc.unique.a:0 "$fp2_struggle.2005.desc.unique.init$ แขนค้ำยันคู่ขนาดใหญ่ ให้ความมั่นคงที่ไม่มีใครเทียบได้ "
 fp2_struggle.2005.desc.unique.b:0 "$fp2_struggle.2005.desc.unique.init$ ป้อมไม้ที่ยกสูงขึ้นที่ปลาย แต่ละด้านของตัวเรือ ช่วยให้พลธนูสามารถยิงธนูใส่ศัตรูได้ "
 fp2_struggle.2005.desc.unique.c:0 "$fp2_struggle.2005.desc.unique.init$ อาคารคล้ายปราสาทอันโอ่อ่าบนดาดฟ้าเรือ "
 fp2_struggle.2005.desc.unique.d:0 "$fp2_struggle.2005.desc.unique.init$ หลังคาไม้ที่คลุมด้วยหนามเพื่อป้องกันการบุกขึ้นเรือ "
 fp2_struggle.2005.desc.unique.e:0 "$fp2_struggle.2005.desc.unique.init$ ไม้กระทุ้งที่ด้านหน้า สำหรับเจาะทะลุเรือศัตรูในการเผชิญหน้าโดยตรง "
 fp2_struggle.2005.desc.sails.init:0 "สุดท้าย เรือใช้"
 fp2_struggle.2005.desc.sails.a:0 "$fp2_struggle.2005.desc.sails.init$ ใบเรือสี่เหลี่ยมขนาดใหญ่ซ้อนกัน ใช้ประโยชน์จากลมทะเลได้อย่างเต็มที่"
 fp2_struggle.2005.desc.sails.b:0 "$fp2_struggle.2005.desc.sails.init$ ใบเรือแบบลักเซลล์ขนาดใหญ่ซ้อนกัน เหมาะสำหรับเรือที่ทรงพลังที่สุด"
 fp2_struggle.2005.desc.sails.c:0 "$fp2_struggle.2005.desc.sails.init$ ระบบใบเรือตามยาวที่ซับซ้อนเพื่อความคล่องแคล่วสูงสุด"
 fp2_struggle.2005.desc.sails.d:0 "$fp2_struggle.2005.desc.sails.init$ ไม้พายขนาดใหญ่หลายแถว ทำให้เรือมั่นคงดั่งเจตจำนงของผู้ควบคุม"
 fp2_struggle.2005.desc.outro:0 "\n\n"น่าประทับใจที่สุด ใช่หรือไม่?" [2005_scoped_steward.GetFirstNameNicknamed] กล่าว"
 fp2_struggle.2005.desc.outro.crit:0 "\n\n"สิ่งนี้จะนำมา ซึ่งยุคแห่งอำนาจทางทะเลอย่างแน่นอน!" [2005_scoped_steward.GetFirstNameNicknamed] ประกาศอย่างภาคภูมิใจ"
 fp2_struggle.2005.a:0 "เจ้าทำได้ดีมาก"
 fp2_struggle.2005.a.a:0 "น่าเสียดายเรื่องอู่ต่อเรือ แต่อย่างน้อยเราก็มีเรือ"
 fp2_struggle.2005.desc.alt.a:1 "เงินที่จมลง"
 fp2_struggle.2005.desc.alt.a.desc:0 "ด้วยตระหนักดีว่าข่าวนี้จะสร้างความขุ่นเคืองเพียงใด [2005_scoped_steward.GetFirstName] ผู้เป็น[ROOT.Char.Custom2('RelationToMe', SCOPE.sC('2005_scoped_steward'))]ของข้า จึงเดินเข้ามาอย่างระมัดระวังเพื่อแจ้งผลลัพธ์ของความพยายามในการทำให้เงินลอยน้ำ\n\n"แม้พวกเราจะพยายามอย่างเต็มที่แล้ว แต่แนวคิดในการสร้างเรือจากโลหะนั้นช่างไร้สติ หลังจากการสร้างเสร็จสิ้น เรือลำนั้นได้ออกจากท่าและจมดิ่งลงสู่ก้นบึ้งของมหาสมุทรในทันที ส่วนสำคัญของท้องพระคลังเราบัดนี้จมอยู่ใต้เกลียวคลื่นอันโหดร้ายเกินกว่าจะเอื้อมถึง ข้าขอประทานอภัยขอรับฝ่าบาท"\n\n"
 fp2_struggle.2005.desc.alt.b:1 "เรือเงิน"
 fp2_struggle.2005.desc.alt.b.desc:0 "[ROOT.Char.Custom2('RelationToMe', SCOPE.sC('2005_scoped_steward'))] ของข้า [2005_scoped_steward.GetFirstName] รู้ว่านี่เป็นเพียงอุปกรณ์ประกอบฉากเพื่อการแสดงบางอย่าง เพื่อสร้างชื่อเสียง เรือที่ทำจากโลหะจะไม่มีวันลอยได้ ไม่ว่าเทคโนโลยีจะก้าวหน้าไปมากเพียงใด\n\nดังนั้น แทนที่จะทำงานอย่างจริงจังและพยายามทำสิ่งที่เป็นไปไม่ได้ [2005_scoped_steward.GetSheHe]จึงเคลือบเรือไม้ด้วยชั้นเงินบางๆ เพื่อหลอกลวงผู้พบเห็น ข้าและ "เรือโลหะ" ลำใหม่ของข้ากลายเป็นที่พูดถึงของเมืองและเป็นที่อิจฉาของโลก!\n\n"

 # fp2_struggle_event_2006
 fp2_struggle.2006.t:0 "พรมแดนแห่งศรัทธา"
 fp2_struggle.2006.desc:0 "[ROOT.Char.Custom2('RelationToMe', SCOPE.sC('fp2_2006_vassal_in_crisis'))] [fp2_2006_vassal_in_crisis.GetTitledFirstName] ของข้าเข้ามาหาข้าเป็นการส่วนตัวด้วยความสงสัยอย่างชัดเจนในดวงตา[fp2_2006_vassal_in_crisis.GetHerHis]\n\n[fp2_2006_vassal_in_crisis.GetSheHe|U]อธิบายให้ข้าฟังว่าศรัทธา[fp2_2006_vassal_in_crisis.GetHerHis]กำลังสั่นคลอน เนื่องจากเวลา[fp2_2006_vassal_in_crisis.GetHerHis]ที่ใช้ในการปกป้องพรมแดนจาก [fp2_2006_foreign_faith.GetNameNoTooltip] และการสังสรรค์กับศัตรู คำพูด[fp2_2006_vassal_in_crisis.GetHerHis]ไม่ใช่เรื่องล้อเล่น รู้สึกราวกับว่าความผิดพลาดเพียงเล็กน้อย อาจผลักดัน[fp2_2006_vassal_in_crisis.GetHerHim]ให้ออกห่างจาก [ROOT.Char.GetFaith.HighGodName]\n\nทว่า นี่เป็นโอกาสที่จะเสริมสร้างความศรัทธาของเรา ตลอดจนความสัมพันธ์ของเรา"
 fp2_struggle.2006.a:0 ""ใครก็ได้ไปตามนักบวชมาที!""
 fp2_struggle.2006.a.a:0 "[fp2_2006_vassal_in_crisis.GetTitledFirstNameNoTooltip] ยังคงสงสัย"
 fp2_struggle.2006.a.b:0 "[fp2_2006_vassal_in_crisis.GetTitledFirstNameNoTooltip] รู้สึกถูกคุกคามจากการปรากฏตัวของ [2006_scoped_chaplain.GetTitledFirstNameNoTooltip]"
 fp2_struggle.2006.a.c:0 "[2006_scoped_chaplain.GetCouncilTitleFirstNameNoTooltip] ปลอบประโลมศรัทธาของ [fp2_2006_vassal_in_crisis.GetTitledFirstNameNoTooltip]"
 fp2_struggle.2006.a.desc:1 "ท่านเรียก [2006_scoped_chaplain.GetCouncilTitleFirstNameNoTooltip] มาแก้ไขสถานการณ์ [fp2_2006_vassal_in_crisis.GetFirstNameNoTooltip] จะรู้สึกถูกทรยศ เพราะท่านบอกผู้อื่นเกี่ยวกับความทุกข์[fp2_2006_vassal_in_crisis.GetHerHis]"
 fp2_struggle.2006.b:0 "ข้าจะจุดประกายความศรัทธา[fp2_2006_vassal_in_crisis.GetHersHis]ด้วยตนเอง"
 fp2_struggle.2006.b.a.desc:0 "[fp2_2006_vassal_in_crisis.GetFirstNameNoTooltip] ไม่พอใจในความพยายาม"
 fp2_struggle.2006.b.b.desc:0 "ท่านปลอบประโลมความศรัทธาของ [fp2_2006_vassal_in_crisis.GetFirstNameNoTooltip]"
 fp2_struggle.2006.c:0 ""เลือกศรัทธาใดก็ได้ ตราบใดที่เจ้า #emphasis รับใช้#! #BER ข้า#!""
 fp2_struggle.2006.c.desc:0 "ท่านอนุญาตให้ [fp2_2006_vassal_in_crisis.GetFirstNameNoTooltip] เลือกศรัทธาตามความประสงค์[fp2_2006_vassal_in_crisis.GetHersHis]"
 fp2_struggle.2006.c.notif.t:0 "เสรีภาพแห่งมิตรภาพ"
 fp2_struggle.2006.d:0 "ขู่ว่าจะประณาม [fp2_2006_vassal_in_crisis.GetHerHim] ว่าเป็นพวกนอกรีต"
 fp2_struggle.2006.d.notif.t:0 "ต่อสู้กับความสงสัยด้วยความกลัว"
 fp2_struggle.2006.e:0 ""ลืมเรื่องศรัทธาไปเสีย #emphasis จงยอมรับเวทมนตร์คาถา!#!""
 fp2_struggle.2006.e.alreadywitch:0 "[fp2_2006_vassal_in_crisis.GetFirstName] เป็นแม่มดอยู่แล้ว! มันไม่ใช่วิกฤตศรัทธา [fp2_2006_vassal_in_crisis.GetFirstNameNoTooltip] แค่ต้องการเพื่อนที่สามารถเข้าใจ[fp2_2006_vassal_in_crisis.GetHerHim]ได้"
 fp2_struggle.2006.generic.notif.a.t:0 "ข้าในบังคับยอมรับ [fp2_2006_foreign_faith.GetNameNoTooltip]"
 fp2_struggle.2006.generic.notif.b.t:0 "ข้าในบังคับยังคงศรัทธา"
 fp2_struggle.2006.e.notif.t:0 "ผู้วิเศษที่เป็นมิตร"
 fp2_struggle.2006.e.tacticalwitchfaithchange:0 "เปลี่ยนไปนับถือ [fp2_2006_foreign_faith.GetName] เพื่อหลีกเลี่ยงการประหัตประหาร"

 # fp2_flavor_events_vero
 fp2_flavor.3001.t:0 "ขณะข้าใกล้ตาย"
 fp2_flavor.3001.desc:0 "ลมรู้สึกเย็นลงและวันเวลาดูมืดมน สั้นลง เงียบลง บัลลังก์ยังคงดูเหมือนเดิมกับวันที่ข้าได้นั่งครั้งแรก บัลลังก์จะดูเหมือนเดิมเสมอ แต่ข้าจะไม่\n\nถึงเวลาแล้วที่ข้าจะต้องเตรียมพร้อมสำหรับสิ่งที่หลีกเลี่ยงไม่ได้ และข้าจะสั่งทำคำจารึกบนหลุมศพก่อนที่ข้าจะจากไป เพื่อที่ข้าจะได้จากไปอย่างสงบ"
 fp2_flavor.3001.a:0 "เราจะใช้ภาษา [SCOPE.Custom('IberiaSacredLanguage')]"
 fp2_flavor.3001.b:0 "นั่นไม่ใช่ภาษาที่เราทุกคนพูด ข้าจะใช้ [ROOT.Char.GetCulture.GetLanguage.GetNameNoTooltip]"
 fp2_flavor.3001.c:0 "ข้าจะไม่แยกแยะใดๆ ใช้ทั้ง [SCOPE.Custom('IberiaSacredLanguage')] และ [ROOT.Char.GetCulture.GetLanguage.GetNameNoTooltip]"
 fp2_flavor.3001.d:0 "เราไม่ใช่คนเดียวที่อาศัยอยู่ที่นี่"
 IberiaSacredLanguage_hebrew:0 "ฮีบรู"
 IberiaRomanceLanguage_castilian:0 "คาสตีเลียน"
 IberiaRomanceLanguage_sephardi:0 "เซฟาร์ดี"
 IberiaRomanceLanguage_mozarabic:0 "โมซาราบิก"
 fp2_epitaph_modifier:0 "คำจารึกหลายภาษา"
 
 fp2_flavor.3011.t:0 "การเคลื่อนไหวที่ไม่คาดคิด"
 fp2_flavor.3011.desc:0 "สหายสนิทของข้า [fp2_flavor_3011_best_friend.GetFirstName] ไม่จำเป็นต้องประกาศตน [fp2_flavor_3011_best_friend.GetHerselfHimself] ก่อนเข้า [ROOT.Char.Custom('GetChamber')] ของข้า อ่า รอยยิ้มอันเปี่ยมสุข [fp2_flavor_3011_best_friend.GetHerHis] จะไม่มีวันหยุด ทำให้ข้ายินดี แต่... มีบางอย่างที่แตกต่างเกี่ยวกับ [fp2_flavor_3011_best_friend.GetHerHis] ในวันนี้ ผม [fp2_flavor_3011_best_friend.GetHerHis] ถูกจัดทรงอย่างสมบูรณ์แบบและเสื้อผ้า [fp2_flavor_3011_best_friend.GetHerHis] ก็หรูหราสง่างาม\n\n"[ROOT.Char.GetFirstNameNoTooltip] สหายรักของข้า! ทั้ง [ROOT.Char.Custom('ResidenceBuilding')]... และท่านอยู่ที่นี่คนเดียว! ไม่มีอะไรที่ข้าชอบมากไปกว่าการได้อยู่กับท่านอันมีค่า และถ้าข้าทำได้ — โอ้ พระเจ้า ถ้าข้าทำได้! — ข้าจะใช้เวลาทั้งวันทั้งคืนกับท่านใน [ROOT.Char.Custom('GetRoom')] แห่งนี้""
 fp2_flavor.3011.a:0 "และมีเตียงเพียงเตียงเดียว"
 fp2_flavor.3011.b:0 "ข้าจะหาที่พักที่คู่ควรกับท่าน!"
 fp2_flavor.3011.c_spouse:0 "ข้ามีคู่ครองแล้ว!"
 fp2_flavor.3011.c:0 "ข้าอยู่คนเดียวตามที่ข้าต้องการ"
 
 fp2_flavor.3021.t:0 "ยามเย็นอันไร้รสชาติ"
 fp2_flavor.3021.desc:0 "เมื่อมิตรสหายที่รักของข้า [fp2_flavor_3021_best_friend.GetFirstName] เชิญข้าในเย็นวันนี้ ข้าไม่ได้คาดหวังว่าข้าอยากจะกินหนังเปียกๆ ในถ้ำมากกว่า\n\nข้าหันหน้าหนีเมื่อแขกคนหนึ่งเปิดเผยบาดแผลติดเชื้อหนองของเขา: "แผลนี้ข้าได้มาตอนกำลังถ่ายหนัก!"\n\n"ช่างเป็นยามเย็นที่ดี ใช่หรือไม่?," [fp2_flavor_3021_best_friend.GetFirstNameNoTooltip] เข้ามาหาข้า ถือถ้วยอยู่ในมือ รอยยิ้มหน้าแดง[fp2_flavor_3021_best_friend.GetHerHis]ไม่สามารถมัวหมองได้แม้ แต่จากบรรยากาศที่น่าสังเวช การสนทนาที่น่าสังเวช และอาหารที่น่าสังเวช"
 fp2_flavor.3021.a:0 "ดีเท่าที่จะเป็นไปได้!"
 fp2_flavor.3021.b:0 "ช-ใช่ [fp2_flavor_3021_best_friend.GetFirstNameNoTooltip]... ข้า— ดูสิ ย-ยามเย็นนี้คือ—"
 fp2_flavor.3021.c:0 "[fp2_flavor_3021_best_friend.GetSheHe|U]ควรจะรู้ความจริง"
 fp2_flavor.3021.d:0 "อนิจจา ถึงเวลาต้องไปแล้ว"
 fp2_flavor.3021.b.success_tt:0 "[fp2_flavor_3021_best_friend.GetFirstNameNoTooltip] จะเข้าใจความกังวลของท่าน"
 fp2_flavor.3021.b.success:0 "การสนทนาที่ประสบความสำเร็จ"
 fp2_flavor.3021.b.fail:0 "การสนทนาที่น่าอับอาย"

 # fp2_james_events
 fp2_james.0001.t:0 "ชุมชน [fp2_james_0001_jewish_trader.GetFaith.GetAdherentNameNoTooltip] ที่เจริญรุ่งเรืองใน [fp2_james_0001_thriving_community.GetNameNoTierNoTooltip]"
 fp2_james.0001.desc:0 "การขยายท่าเรือการค้าใน [fp2_james_0001_thriving_community.GetNameNoTier] ทำให้กลายเป็นศูนย์กลางที่เจริญรุ่งเรืองสำหรับชาวยิวทั่วไอบีเรีย!\n\nสมาชิกของตระกูลการค้า [fp2_james_0001_jewish_trader.GetCulture.GetName] ที่สำคัญได้นำผู้คน[fp2_james_0001_jewish_trader.GetHerHis]เข้ามามากขึ้นเรื่อยๆ\n\nในไม่ช้า ที่นี่จะกลายเป็นหัวใจสำคัญของเครือข่ายการค้าของชาวยิวอันกว้างใหญ่ทั่วไอบีเรีย"
 fp2_james.0001.a:0 "หากพวกเขาไม่ใช่ [ROOT.Char.GetFaith.GetReligion.GetAdjective] พวกเขาก็ไม่เป็นที่ต้อนรับ!"
 fp2_james.0001.b:0 "บางที [fp2_james_0001_jewish_trader.GetSheHe] ควรเป็นลอร์ดของ [fp2_james_0001_thriving_community.GetNameNoTooltip]!"
 fp2_james.0001.c:0 "ช่างเป็นการพัฒนาที่ดีเสียนี่กระไร!"
 fp2_thriving_jewish_community_modifier:0 "ชุมชนชาวยิวที่เจริญรุ่งเรือง"
 fp2_thriving_jewish_community_modifier_desc:0 "เคาน์ตีนี้กำลังประสบกับความเฟื่องฟูทางเศรษฐกิจจากครอบครัวชาวยิวที่ร่ำรวย ซึ่งกำลังสร้างเครือข่ายการค้าผ่านพื้นที่นี้"
 fp2_jewish_community_denied_modifier:0 "คนท้องถิ่นถูกประหัตประหาร"
 fp2_jewish_community_denied_modifier_desc:0 "การเติบโตทางสังคมและเศรษฐกิจของพื้นที่นี้ถูกขัดขวางโดยกฎหมายที่เลือกปฏิบัติต่อชนกลุ่มน้อยทางศาสนา"
 fp2_conversos_persecution_modifier:0 "คอนเวอร์โซถูกประหัตประหาร" # Converso = ผู้เปลี่ยนศาสนา (จากยิวเป็นคริสต์)
 fp2_conversos_persecution_modifier_desc:0 "แม้จะเปลี่ยนมานับถือศาสนาคริสต์แล้ว อดีตชาวยิวและลูกหลานของพวกเขายังคงถูกประหัตประหารต่อไป"
 fp2_james.0002.t:0 "การเปลี่ยนศาสนาจอมปลอม"
 fp2_james.0002.desc:0 "มี [fp2_james_0002_conversos_character.GetFaith.GetAdherentName] จำนวนหนึ่งที่ถูกกล่าวหาว่าได้รับคำสั่งจากอดีต [fp2_james_0002_jewish_faith.PriestNeuterPlural] ของพวกเขาให้ประกาศการเปลี่ยนมานับถือศรัทธาที่แท้จริง แต่พวกเขายังคงปฏิบัติ [fp2_james_0002_jewish_faith.GetName] อย่างลับๆ!\n\nหากเป็นจริง สิ่งนี้จะบ่อนทำลายความพยายามใดๆ ในการเปลี่ยนชุมชนชาวยิวในไอบีเรียมานับถือศาสนาคริสต์\n\nหนึ่งในผู้นำของพวกเขา [fp2_james_0002_conversos_character.GetName] ถูกสงสัยว่าส่งเสริมคำสอนของชาวยิว"
 fp2_james.0002.a:0 "ข้าไม่สนใจ ไม่ว่าทางใดก็ตาม"
 fp2_james.0002.a.tt:0 "อนุญาตให้ [fp2_james_0002_conversos_character.GetNameNoTooltip] ทำตามที่[fp2_james_0002_conversos_character.GetSheHe]ต้องการ"
 fp2_james.0002.b:0 "ข้าควรสอบสวนพวกนอกรีตนี้"
 fp2_james.0002.c:0 "จริงหรือไม่ก็ตาม [fp2_james_0002_conversos_character.GetSheHe] จะเน่าเปื่อยในคุกใต้ดินของข้า!"
 fp2_james.0003.t:0 "ผู้ลี้ภัย [fp2_james_003_jewish_refugee_leader.GetFaith.GetAdherentNameNoTooltip]"
 fp2_james.0003.desc:0 "[fp2_james_003_jewish_refugee_leader.GetName] ได้หลบหนีจาก [fp2_james_003_intolerant_ruler.GetPrimaryTitle.GetNameNoTier] พร้อมกับเพื่อนร่วม [fp2_james_003_jewish_refugee_leader.GetFaith.GetAdherentNamePluralNoTooltip] จำนวนมาก[fp2_james_003_jewish_refugee_leader.GetHerHis]\n\n[fp2_james_003_jewish_refugee_leader.GetSheHe|U]มาหาข้าเพื่อขอร้องหาบ้านให้ผู้คน[fp2_james_003_jewish_refugee_leader.GetHerHis]และยินดีที่จะสาบานความจงรักภักดีต่อราชบัลลังก์ [fp2_james_003_jewish_refugee_leader.GetPrimaryTitle.GetAdjective] เพื่อแลกกับการคุ้มครองจากการประหัตประหาร"
 fp2_james.0003.a:0 "[fp2_james_0003_province_to_convert.GetNameNoTooltip] น่าจะได้รับประโยชน์จากผู้ตั้งถิ่นฐานเล็กน้อย"
 fp2_james.0003.b:0 "[fp2_james_003_jewish_refugee_leader.GetSheHe|U]จะต้องไปหาที่อื่น"
 fp2_james.0002.b.succesful_interrogation:0 "การสอบสวนประสบความสำเร็จ"
 fp2_james.0002.b.failed_interrogation:0 "การสอบสวนเป็นหายนะ"
 fp2_james_0002.b.failed_interrogation.tt:0 "ทุกเคาน์ตีคริสเตียนและยิวในอาณาจักรของท่าน"
 fp2_james.0002.a.offended_conversos:0 "ชาวคอนเวอร์โซรู้สึกขุ่นเคือง"
 fp2_james.0002.a.jewish_communities_thrive:0 "ชุมชนชาวยิวเจริญรุ่งเรือง!"
 fp2_james.0002.a.nothing_happened_toast:0 "ชาวคอนเวอร์โซเป็นคริสเตียนที่แท้จริง"
 cultural_acceptance_gain_conversos_tolerance:0 "การยอมรับคอนเวอร์โซ"
 cultural_acceptance_loss_conversos_tolerance:0 "การไม่ยอมรับคอนเวอร์โซ"
 fp2_james.0004.t:0 "ค่ำคืนแห่ง [fp2_james_0004_place_of_murder.GetAdjectiveNoTooltip]"
 fp2_james.0004.desc:0 "[fp2_james_0004_place_of_murder.GetName] เป็นสถานที่ที่ไร้ระเบียบ ซึ่งมีความเชื่อและการปกครองที่หลากหลาย แต่ละชุมชนที่แตกต่างกันมีผู้นำของตน ส่งผลให้เกิดเครือข่ายลำดับชั้นและความเป็นผู้นำที่ซับซ้อน ซึ่งไม่สามารถดำเนินต่อไปได้ หากพวกเขาทั้งหมดสวดภาวนาต่อ [ROOT.Char.GetFaith.HighGodName] ด้วยวิธีที่เหมาะสมและถูกต้อง และตอบสนองต่อผู้นำคนเดียวกัน ก็จะเพิ่มอิทธิพลของข้า\n\n[fp2_james_0004_murder_baron.GetName] ได้ก้าวออกมา โดยมุ่งหมายที่จะเป็นผู้นำคนใหม่[fp2_james_0004_place_of_murder.GetTierAsNamePossessiveNoTooltip|U]และจะจัดงานเลี้ยงที่[fp2_james_0004_murder_baron.GetSheHe]จะสังหารผู้นำศาสนาท้องถิ่นทั้งหมดเหมือนปศุสัตว์"
 fp2_james.0004.a:0 "ข้ารอที่จะได้ยินเสียงกรีดร้องของพวกเขาไม่ไหวแล้ว"
 fp2_james.0004.b:0 "ข้าไม่ใช่สัตว์ประหลาด #EMP โดยสิ้นเชิง#!"
 fp2_james.0005.t:0 "มุมมอง"
 fp2_james.0005.desc.intro:0 "[fp2_james_angry_priest.GetName] เข้ามาหาข้าในวันนี้เพื่อเรียกร้องว่า [ROOT.Char.GetFaith.HouseOfWorship] ที่เพิ่งเปลี่ยนศาสนามาใหม่หันหน้าไปผิดทิศทาง!"
 fp2_james.0005.desc.christian:0 "\n\nในสภาพเดิมที่เป็นมัสยิด มีเพียงมิห์รอบเท่านั้นที่หันหน้าไปทางทิศตะวันออกสู่เมกกะ แต่บัดนี้ในฐานะโบสถ์ที่เหมาะสม คาดว่าอาคารทั้งหลังจะหันหน้าไปทางทิศตะวันออก"
 fp2_james.0005.desc.muslim:0 "\n\nในฐานะอดีตโบสถ์ มัสยิดหันหน้าไปทางทิศตะวันออก ทำให้ไม่สามารถสร้างมิห์รอบเพื่อนำทางผู้ศรัทธาให้หันหน้าไปทางนครศักดิ์สิทธิ์ได้!"
 fp2_james.005.desc.outro:0 "\n\n[fp2_james_angry_priest.GetNameNoTooltip] โต้แย้งว่าเป็นไปไม่ได้ในทางปฏิบัติที่จะประกอบพิธีอย่างเหมาะสมในสภาพ เช่นนี้ และขอให้เราจัดสรรเงินทุนบางส่วนเพื่อหมุนอาคารทั้งหลังไปในทิศทางที่ถูกต้อง"
 fp2_james.0005.a:0 "อะไรก็ได้เพื่อศรัทธา!"
 fp2_james.0005.b:0 "เจ้ากำลังเสียเวลาของข้า"
 fp2_toledo_nights_modifier:0 "ผู้ปกครองท้องถิ่นถูกสังหารหมู่"
 fp2_toledo_nights_modifier_desc:1 "ผู้ปกครองศาสนาท้องถิ่นของเคาน์ตีนี้เพิ่งถูกสังหารหมู่"
 fp2_toledo_nights_fallout_modifier:0 "นักบวชถูกสังหารหมู่"
 fp2_toledo_nights_fallout_modifier_desc:0 "ผู้นำศาสนาเพิ่งถูกสังหารหมู่ในเมืองใกล้เคียง ก่อให้เกิดผลกระทบทั่วอาณาจักรนี้"
 fp2_correctly_facing_church:0 "ศาสนสถานที่หันถูกทิศ"
 fp2_correctly_facing_church_desc:1 "ศาสนสถานในเคาน์ตีนี้ถูกหมุนทีละอิฐ เพื่อให้แน่ใจว่าการนมัสการเป็นไปอย่างเหมาะสม"

 # fp2_nick_events (all three files)
 fp2_yearly.4001.t:0 "ชั่วโมงที่หก" # Siesta reference
 fp2_yearly.4001.desc:0 "พระเจ้าช่วย! การเป็น [ROOT.Char.GetTitleAsNameNoTooltip] ช่างเหน็ดเหนื่อยเสียจริง ข้าต้องทำงานหนักทั้งวันและเกือบทั้งคืนเพื่อจัดการทุกอย่างให้เรียบร้อย พวกชาวนาช่างมีชีวิตที่สุขสบายในแง่นั้น พวกเขาไม่มีแรงกดดัน เช่นนี้ ถ่วงพวกเขาลง ทำให้พวกเขาเหนื่อยล้าเหลือเกิน!\n\nบางทีการงีบหลับสักเล็กน้อยอาจจะดีต่อข้า? ข้าสามารถนอนหลับพักผ่อนจากความเหนื่อยล้าของมื้อกลางวันและพร้อมที่จะจัดการกับส่วนที่เหลือของวัน!"
 fp2_yearly.4001.a:0 "ไม่! ข้ามีงานต้องทำ!"
 fp2_yearly.4001.b:0 "อืม, #EMP น่าสุขใจยิ่งนัก.#!"

 fp2_yearly.4002.t:0 "อยู่ร่วมกันอย่างปรองดอง"
 fp2_yearly.4002.desc:0 "สีหน้าบูดบึ้งไม่พอใจของ [realm_priest.GetCouncilTitle] ของข้า [realm_priest.GetTitledFirstNamePossessive] เตรียมข้าไว้ล่วงหน้าสำหรับเรื่องไร้สาระที่น่ารำคาญ [ROOT.Char.GetFaith.HighGodName] บางอย่างที่แน่นอนว่าจะต้องเกิดขึ้น\n\n"[ROOT.Char.Custom('FormOfAddressForLiege')|U]" [realm_priest.GetSheHe] เริ่มต้น "มีเรื่องสำคัญร้ายแรงเกิดขึ้นภายในอาณาจักรของท่าน เคาน์ตี [interfaith_province.GetCounty.GetName] เต็มไปด้วยผู้คนที่ไม่ปฏิบัติตามศรัทธาที่แท้จริง! หากนั่นยังไม่เลวร้ายพอ พวกเขากำลังอาศัยอยู่เคียงข้างผู้ที่ปฏิบัติตาม! และ และ และ #EMP สมสู่#! กันและ-"\n\nข้าหลับตาลงขณะที่เสียงพึมพำอันไม่รู้จบยังคงดำเนินต่อไป ข้าไม่อยากจะคิดเลยว่า [realm_priest.GetSheHe] จะพูดยืดยาวต่อไปอย่างไรหากข้าไม่ทำอะไรบางอย่าง..."
 fp2_yearly.4002.a:0 "ปล่อยให้พวกเขาอยู่กันอย่างสงบเถิด [realm_priest.GetFirstNameNoTooltip]"
 fp2_yearly.4002.b:0 "ท่านพูดถูก เรื่องนี้จะดำเนินต่อไปไม่ได้"

 fp2_yearly.4003.t:0 "O Camiño เต๋อ Santiago" # The Way of St. James (เส้นทางนักบุญเจมส์) - Keeping the original name for flavor.
 fp2_yearly.4003.desc:0 "นครศักดิ์สิทธิ์ซานเตียโกเดกอมโปสเตลาเป็นแม่เหล็กดึงดูดผู้ศรัทธา ดึงดูดผู้แสวงบุญจากดินแดนใกล้และไกล เส้นทางไปยังนครนั้นจึงมีการเดินทางอย่างดี คดเคี้ยวไปยังสถานที่จากเชิงเขาพิรินี แน่นอน ที่ใดมีผู้คนที่ร่ำรวยพอที่จะเดินทางไปยังสถานที่ศักดิ์สิทธิ์ ที่นั่นก็มีผู้ที่ต้องการแสวงหาผลกำไรจากความไว้วางใจในพระผู้เป็นเจ้าของพวกเขา\n\nนี่เป็นรายงานฉบับที่ห้าของการปล้นสะดมอย่างรุนแรงโดยโจรในรอบห้าวันบนผืนดินที่ทอดผ่านอาณาเขตของข้า ซึ่งในที่สุดก็ผลักดันให้ [steward.GetCouncilTitle] [steward.GetFirstName] ของข้ามาปรึกษากับข้าเกี่ยวกับวิธีจัดการกับปัญหานี้"
 fp2_yearly.4003.a:0 "ข้าจะติดต่อนักรบศักดิ์สิทธิ์ใน [ho_province.GetProvince.GetCounty.GetNameNoTooltip]!"
 fp2_yearly.4003.b:0 "จ่ายเงินให้ทหารยามลาดตระเวนส่วนหนึ่งของถนน"
 fp2_yearly.4003.c:0 "[ROOT.Char.GetFaith.HighGodName] ช่วยเหลือผู้ที่ช่วยเหลือตนเอง..."
 fp2_yearly.4003.tt:0 "[holy_order|E] ท้องถิ่นจะลาดตระเวนถนนในเคาน์ตีของพวกเขา"
 fp2_yearly.4004.t:0 "ปรมาจารย์พเนจร"
 fp2_yearly.4004.desc:0 "ข้ากำลังเดินผ่านห้องพิจารณาคดีของข้า เมื่อการต่อสู้กันที่ปลายสุดของห้องดึงความสนใจของข้า [mozarab_wanderer.GetWomanMan] ร่างกำยำกำลังถูกทหารยามของข้าเข้ารุกไล่ เพียง แต่อาวุธของพวกเขาก็กระทบพื้นเสียงดังในชั่วพริบตา คนแปลกหน้าควงดาบของ [mozarab_wanderer.GetHerHis] เพื่อทำความเคารพต่อข้า\n\n"[ROOT.Char.Custom('FormOfAddressForLiege')|U]" [mozarab_wanderer.GetSheHe] เริ่มต้นขณะที่ข้าโบกมือไล่ทหารยามออกไป "ข้าพบว่าตนเองไม่มีนายเหนือหัวให้รับใช้ และเมื่อพิจารณาจากการป้องกันของท่านที่นี่ ท่านน่าจะต้องการความช่วยเหลือจากข้า"\n\nจากไม้กางเขนที่ [mozarab_wanderer.GetSheHe] สวมรอบคอของ [mozarab_wanderer.GetHerHis] ข้าอนุมานได้ว่า [mozarab_wanderer.GetSheHe] เป็น [mozarab_wanderer.GetFaith.GetAdherentName]"
 fp2_yearly.4004.a:0 "สำหรับ [mozarab_wanderer.GetWomanMan] ผู้มีพรสวรรค์ เช่นท่าน? แน่นอน!"
 fp2_yearly.4004.b:0 "ข้าอยากให้ $knight_culture_player_no_tooltip_lowercase$ ของข้าเป็น [ROOT.Char.GetFaith.GetAdherentNameNoTooltip] มากกว่า"
 fp2_yearly.4004.c:0 "ไปให้พ้น พวกนอกรีต!"
 fp2_yearly.4004.tt:0 "[mozarab_wanderer.GetName] ปฏิเสธที่จะเปลี่ยนศาสนาและกลับไปพเนจร"
 fp2_yearly.4004.b.succ:0 "[mozarab_wanderer.GetName] เข้าร่วมราชสำนักของท่าน"
 fp2_yearly.4004.b.fail:0 "[mozarab_wanderer.GetName] ปฏิเสธที่จะเปลี่ยนศาสนาและกลับไปพเนจร"
 fp2_yearly.4004.c.tt:0 "[mozarab_wanderer.GetName] กลับไปพเนจร"

 fp2_yearly.4005.t:0 "การจัดตั้งถิ่นฐานเฉพาะกลุ่ม"
 fp2_yearly.4005.desc.christian:0 "ชาว [mozarab_merchant.GetFaith.GetAdherentNamePlural] ครอบครองตำแหน่งที่ไม่เหมือนใครในสังคมไอบีเรีย " # Mozarab = ชาวคริสต์ที่อาศัยอยู่ภายใต้การปกครองของมุสลิมในไอบีเรีย
 fp2_yearly.4005.desc.muslim:0 "ราษฎร [mozarab_merchant.GetFaith.GetReligion.GetAdjectiveNoTooltip|U] ครอบครองตำแหน่งที่ไม่เหมือนใครในสังคมไอบีเรีย "
 fp2_yearly.4005.desc:0 "จึงเป็นเรื่องผิดปกติ ที่ได้เห็นพ่อค้าท้องถิ่นคนหนึ่งของพวกเขาขอเข้าเฝ้าข้า\n\n"พวกเรา [mozarab_merchant.GetFaith.GetAdherentNamePlural] มักจะต้องรับมือกับความ... ลำบากเป็นพิเศษในระดับหนึ่งเมื่อใช้ชีวิต" [mozarab_merchant.GetSheHe|U] พูดอย่างราบเรียบและปราศจากความเคียดแค้น แต่ก็มีความแข็งกร้าวในคำพูดของ [mozarab_merchant.GetHerHis] อย่างชัดเจน\n\n"ทั้งหมดที่เราต้องการคือพื้นที่เล็ก ๆ ในเมืองต่าง ๆ ใน [mozarab_quarter.GetName] เพื่อเรียกว่าเป็นของเราเองและอาศัยอยู่ท่ามกลางผู้คนของเรา ข้ามาที่นี่เพื่อยื่นคำร้องต่อท่าน [ROOT.Char.Custom('FormOfAddressForLiege')] เพื่อดูว่าท่านจะเมตตาอนุญาตสิ่งนี้แก่เราหรือไม่""
 fp2_yearly.4005.a:0 "ท่านเป็นที่ต้อนรับในเมืองของข้า"
 fp2_yearly.4005.b:0 "ข้าจะไม่ให้เจ้ามาสร้างมลทินให้เมืองของข้า!"

 fp2_yearly.4006.t:0 "สถาปนิกของ [ROOT.Char.GetFaith.HighGodNamePossessive]"
 fp2_yearly.4006.desc:0 "ช่างเป็นคนที่กล้าหาญที่เข้ามาทักท้วงข้าขณะที่ข้ากำลังออกจาก [ROOT.Char.GetFaith.HouseOfWorship] หลังจากการสักการะประจำวันของข้า แต่ [mozarab_priest.GetWomanMan] คนหนึ่งได้พยายามทำ เช่นนั้น ข้าสังเกตเห็นไม้กางเขนที่คล้องรอบคอของ [mozarab_priest.GetHerHis] ด้วยความสงสัยขณะที่ [mozarab_priest.GetSheHe] เริ่มพูด\n\n"[ROOT.Char.Custom('FormOfAddressForLiege')|U] ข้าขอเวลาท่านเพียงครู่เดียวเท่านั้น ทั้งหมดที่ข้าต้องการคือให้ฝูงแกะของข้าสามารถสักการะใน [mozarab_priest.GetFaith.HouseOfWorship] ดังที่ผู้ติดตามที่ดีของ [mozarab_priest.GetFaith.HighGodName] ควรกระทำ!" นักบวชผู้ประหม่าหยุด และมองข้าอย่างอ้อนวอน\n\nการปล่อยให้ [mozarab_priest.GetFaith.GetAdherentNamePlural] สร้างศาสนสถานจะ ทำให้การเปลี่ยนศาสนาพวกเขายากขึ้น แต่บางทีการผ่อนปรนบ้างอาจช่วยเสริมสร้างความสามัคคีในอาณาจักรของข้า?"
 fp2_yearly.4006.a:0 "ท่านได้รับความยินยอมจากข้าแล้ว สร้าง [mozarab_priest.GetFaith.HouseOfWorshipPlural] ของท่านเถิด"
 fp2_yearly.4006.b:0 "เจ้าจะ #EMP ไม่มีวัน#! สร้างกระท่อมของพวกนอกรีตเหล่านั้นบนแผ่นดินของข้า!"
 fp2_yearly.4007.t:0 "มองหาแล้วเจ้าจะพบเปลือกหอย"
 fp2_yearly.4007.desc:0 "ข้ากำลังเดินทางกลับจากการสวดมนต์ โดยมี [realm_priest.GetCouncilTitle] [realm_priest.GetFirstName] อยู่ข้างกาย เมื่อข้าเห็นแสงสีขาววาบบนพื้นดิน ก้มลงหยิบมันขึ้นมา ข้าพบวัตถุทรงกลมแข็งสีขาวเหมือนกระดูก: เปลือกหอยเชลล์\n\nเปลือกหอยดังกล่าวเป็นเครื่องหมายของผู้แสวงบุญที่เดินทางบนถนนสายนี้บนเส้นทางสู่ซานเตียโก และใครก็ตามที่ครอบครองมัน — โดยเฉพาะอย่างยิ่งอันที่มีเครื่องหมายของซานเตียโกประทับอยู่ — ได้สำเร็จการเดินทางอันยากลำบากแล้ว\n\nข้าพลิกเปลือกหอยในมืออย่างละโมบ ตระหนักถึงสายตาที่ไม่เห็นด้วยของ [realm_priest.GetFirstNameNoTooltip] ที่จ้องมองมาที่ด้านหลังกะโหลกศีรษะของข้า"
 fp2_yearly.4007.a:0 "ข้าจะเก็บสิ่งนี้ไว้ และเจ้าจะหุบปาก"
 fp2_yearly.4007.b:0 "ก็ได้ #EMP ก็ได้!#! ข้าจะทิ้งเปลือกหอยบ้าๆ นี่ไป"
 fp2_yearly.4007.c:0 "...เจ้าคิดว่าพวกเขาจะเชื่อใครกัน [realm_priest.GetFirstNameNoTooltip]?"
 fp2_yearly.4007.c.tt.flavour:0 "ถ้าข้าเก็บเปลือกหอยนี้ไว้ ใครจะบอกได้ว่ามัน #EMP ไม่ใช่#! ของจริง?"
 fp2_yearly.4007.c.tt.success:0 "ท่านเก็บเปลือกหอยที่น่าเชื่อถือไว้"
 fp2_yearly.4007.c.tt.fail:0 "[realm_priest.GetFirstNameNoTooltip] ตราหน้าเปลือกหอยว่าเป็นของปลอมได้อย่างง่ายดาย"

 fp2_yearly.4008.t:0 "นิทานข้างกองไฟ"
 fp2_yearly.4008.desc.intro:0 "ไฟแตกประทุ ส่งเงาทอดยาวบนผนังห้องพักคนรับใช้ หญิงชราผู้เหี่ยวย่น ทำให้เด็กๆ ตกตะลึงด้วยนิทานของนาง\n\n"
 fp2_yearly.4008.desc.basque.a:0 ""...อาตเช (Aatxe) เป็นวิญญาณถ้ำที่มักปรากฏในร่างสัตว์ร้ายของวัวแดง ปกป้องผู้คนจากอิทธิพลชั่วร้ายและโจมตีหัวขโมย""
 fp2_yearly.4008.desc.basque.b:0 ""...กาอูเอโก (Gaueko) เป็นวิญญาณแห่งราตรี เขาปฏิเสธที่จะอนุญาตให้มนุษย์ทำงานนอกบ้านหลังพลบค่ำ และการแสดงความกล้าหาญในยามค่ำคืนใดๆ — เช่น การโอ้อวดว่าไม่กลัวความมืด — จะดึงดูดความโกรธเกรี้ยวของเขา""
 fp2_yearly.4008.desc.galician.a:0 ""...โอฆันกานู (Ojáncanu) เป็นยักษ์กระหายเลือด ขนดก มีฟันมากกว่า [ROOT.Char.GetWomanMan] ถึงสองเท่า จุดอ่อนสำคัญของพวกมันคือเส้นผมสีขาวเส้นเดียวที่ — หากดึงออก — จะฆ่าพวกมันทันที""
 fp2_yearly.4008.desc.galician.b:0 ""...เอสตาเดอา (Estadea) คือคนตายพเนจรที่หลอกหลอนหมู่บ้านในเวลาเที่ยงคืน เดินโซเซไปตามทาง พวกเขาติดตามวิญญาณที่มีชีวิตที่ถูกสะกดจิต ซึ่งถูกบังคับให้นำทางพวกเขาไปจนถึงรุ่งสาง หากบุคคลนั้นไม่สามารถส่งต่อขบวนผีของตนไปยังผู้โชคร้ายคนอื่นได้ พวกเขาจะเหี่ยวเฉาและตายภายในไม่กี่สัปดาห์""
 fp2_yearly.4008.desc.castilian.a:0 ""...ม้าปีศาจ (Devil's Horses) ปรากฏตัวเมื่อผู้คนก่อกองไฟเพื่อชำระวิญญาณของตน ด้วยแผงคอสีดำสนิท ปีกแมลงปอ และปากฟูมฟาย พวกมันปรากฏตัวจากกองเถ้าถ่านพร้อมกับการระเบิด แต่ละตัวคือวิญญาณของคนบาปที่มีเรื่องราวของตัวเองที่จะบอกเล่า""
 fp2_yearly.4008.desc.castilian.b:0 ""...เวนโตลิเนส (Ventolines) เป็นวิญญาณแห่งอากาศที่ช่วยเหลือชาวเรือ มีลักษณะคล้ายทูตสวรรค์ ดวงตาสีเขียวอมฟ้าเหมือนฟองทะเล และปีกที่ดูเหมือนคลื่นซัดสาด พวกเขาอาศัยอยู่ในเมฆสีแดงเข้มยามพระอาทิตย์ตก หากชาวเรือที่ดีพบว่าตนเองอยู่ในภาวะไร้ลม เวนโตลิเนสจะพัดลมเข้าไปในใบเรือเพื่อพาพวกเขากลับเข้าฝั่ง""
 fp2_yearly.4008.desc.catalan.a:0 ""...โกโกโยนา (Cocollona) เป็นสัตว์ประหลาดแม่น้ำ เดิมทีเป็นแม่ชีไร้ศรัทธาที่ถูกลงโทษ เพราะบาปของนางและถูกคุมขัง ผู้คุมของนางอนุญาตให้นางออกไปข้างนอกได้เฉพาะเพื่อไปเยี่ยมแม่น้ำออนยาร์ ในที่สุด นางก็มีเกล็ดงอกขึ้นมา และตอนนี้นางก็ด้อมๆ มองๆ อยู่ใต้สะพานเพื่อรอเหยื่อที่ไม่สงสัย""
 fp2_yearly.4008.desc.catalan.b:0 ""...ดิป (Dip) ผู้โด่งดังคือสุนัขล่าเนื้อแห่งนรกและทูตของปีศาจ ฆาตกรดูดเลือด สัตว์คล้ายหมาป่าตัวนี้ท่องไปในทุ่งนาตอนกลางคืนเพื่อสังหารวัวและมนุษย์ผู้โชคร้าย ขาพิการข้างหนึ่ง ดวงตาสีแดงเรืองแสงของมันคือสิ่งสุดท้ายที่คนขี้เมาจำนวนมากที่เดินโซเซกลับบ้านได้เห็น""
 fp2_yearly.4008.desc.aragonese.a:0 ""...โอเมส เฮล (Omes Hail) เป็นยักษ์ที่เกี่ยวข้องกับภูเขา หากวิญญาณเหล่านี้ปรากฏให้เห็น พวกมันจะกลายเป็นเทือกเขาอันยิ่งใหญ่ที่ปกป้องเราจากศัตรู ด้วยความโกรธแค้นในชะตากรรมของตน วิญญาณจึงกรีดร้องและส่งก้อนหินกลิ้งลงมาตามเนินเขาและเข้าไปในหมู่บ้านเบื้องล่าง""
 fp2_yearly.4008.desc.aragonese.b:0 ""...บาซาฆวน (Basajaun) ผู้รักสงบและใจดีเป็นชายร่างใหญ่มีเครายาวถึงเท้า สูงกว่าคนปกติสองเท่า เขาลาดตระเวนในป่าโดยใช้ลำต้นไม้เป็นไม้เท้า เตือนคนเลี้ยงแกะถึงพายุที่กำลังจะมาถึง หรือแม้แต่ฝูงหมาป่าด้วยเสียงผิวปากแหบห้าว"
 fp2_yearly.4008.desc.spain.a:0 ""...กูเอเลเบร (Cuélebre) เป็นงูขนาดใหญ่มหึมา แม้ว่ามันจะแทบเป็นอมตะ แต่งูก็ขี้เกียจ และไม่ค่อยเคลื่อนไหวจากที่หลบภัยลึกในถ้ำ กล่าวกันว่าสมบัติของมันแทบจะเกินกว่าจะเข้าใจได้ และน้ำลายของมันสามารถรักษาโรคได้""
 fp2_yearly.4008.desc.spain.b:0 ""...โมรอส (Mouros) เป็นสิ่งมีชีวิตโบราณที่มีพลังอำนาจมหาศาล ซึ่งอาศัยอยู่ที่นี่มาตั้งแต่จุดเริ่มต้นของโลก ช่างโลหะผู้ยิ่งใหญ่ โมรอสไม่ค่อยปรากฏตัวเหนือพื้นดิน หญิงสาวของพวกมันเป็นผู้แปลงร่างที่ถูกสาป ซึ่งมีความงามยิ่งใหญ่และคอยปกป้องทางเดินใต้ดิน""
 fp2_yearly.4008.desc.spain.c:0 ""...อันฆานา (Anjana) เป็นนางฟ้าที่ดีและใจดีที่ดูแลป่าไม้ ด้วยรูม่านตาสีดำและปีกบางเบา พวกมันช่วยเหลือสัตว์ที่บาดเจ็บและผู้คนที่หลงทาง พวกมันเหยียบย่างเบาเสียจนกิ่งไม้ไม่หักภายใต้น้ำหนักของพวกมัน หากท่านพบกลีบกุหลาบสีสันสดใสของพวกมัน ท่านอาจมีความสุขไปจนตาย""
 fp2_yearly.4008.desc.ending:0 "\n\nไฟกระพือและดับลงเมื่อหญิงชราเล่าเรื่องจบและเร่งให้เด็กๆ เตรียมตัวเข้านอน"
 fp2_yearly.4008.a:0 "ช่างเป็นนิทานเก่าแก่ที่สนุกเสียนี่กระไร!"
 fp2_yearly.4008.b:0 "ฮ่า! เรื่องผีไร้สาระ!"
 fp2_yearly.4008.c:0 "เจ้าเล่านิทานได้ดีมาก หญิงชรา!"

 fp2_yearly.4009.t:0 "เจ้านายสีขาว" # Jaun Zuria = The White Lord
 fp2_yearly.4009.desc:0 "วันนี้เป็นวันพิเศษ ข้าเลี้ยวหัวมุมและเห็นเป้าหมายของข้า ต้นไม้มาลาโต (Malato Tree) จากตำนานของฆวน ซูเรีย (Jaun Zuria) เรื่องราวของนักรบหนุ่มผู้ขับไล่กองทัพกลับไปนั้นฝังแน่นอยู่ในใจของเด็กชาว [root_culture.GetName] ทุกคน\n\nข้าลูบมือไปบนลำต้นที่เป็นปุ่มปมและนิ้วมือของข้ามาหยุดอยู่ที่รอยผ่า กว้างเท่ากับนิ้ว ตามตำนานเล่าว่า ดาบเล่มหนึ่งถูกฝังไว้ที่นี่โดยผู้ติดตามของเจ้านายสีขาวเพื่อเป็นพยานถึงความตั้งใจแน่วแน่ที่จะติดตามเขาไปทุกหนทุกแห่ง"
 fp2_yearly.4009.a:0 "ข้าก็จะกำจัดศัตรูของประชาชนของเรา เช่นกัน!"
 fp2_yearly.4009.b:0 "ข้าเป็นมากกว่าแค่ [root_culture.GetNameNoTooltip]"
 fp2_yearly.4009.c:0 "ของที่ระลึกเล็กๆ น้อยๆ ของวันนี้คงจะดี"

 fp2_yearly.4010.t:0 "หมูหิน"
 fp2_yearly.4010.desc:0 "มันควรจะเป็นการเดินทางง่ายๆ เพื่อเยี่ยมชม [verraco_county.GetName] แต่ข้าได้พบกับบางสิ่งที่หายากและผิดปกติ\n\nสัตว์หินขนาดใหญ่ในรูปทรงของหมูป่ายืนอยู่ตรงหน้าข้าในทุ่งโล่งกว้าง จากสภาพที่ผุกร่อน ข้าเดาว่าพวกมันเก่าแก่มาก หากพวกมันเก่าแก่ขนาดนั้นจริงๆ อะไรกันแน่ที่ดลใจให้คนเหล่านี้ใช้ความพยายามสร้างหมูหินขนาดมหึมา?"
 fp2_yearly.4010.a:0 "บางทีนี่อาจเป็นสุสาน... สำหรับนักบุญ?"
 fp2_yearly.4010.a.success:0 "ผู้คนเชื่อในทฤษฎีของท่าน"
 fp2_yearly.4010.a.fail:0 "ผู้คนชี้ให้เห็นว่าสิ่งนี้ไม่มีมูลความจริง"
 fp2_yearly.4010.b:0 "สิ่งเหล่านี้ไม่มีประโยชน์ รื้อมันทิ้งเสีย"
 fp2_yearly.4010.c:0 "นี่คือรูปปั้นดูหมิ่นศาสนา! ทุบทิ้งเสีย!"
 fp2_yearly.4010.d:0 "เรื่องหมูๆ ทั้งหมดนี้ทำให้ข้าเบื่อ" # Pun: boar-ing -> boring
