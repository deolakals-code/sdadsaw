 fp2_struggle.1000.t:0 "โหมไฟ"
 fp2_struggle.1000.desc:1 "เกิดการปะทะกันระหว่างชาว [ROOT.Char.GetFaith.GetAdherentNameNoTooltip] และประชากรชาว [tension_county.GetCountyData.GetFaith.GetAdjectiveNoTooltip] ใน [tension_county.GetName] "ให้เราใช้โอกาสนี้" [tension_councillor.GetCouncilTitle] [tension_councillor.GetFirstName] ของข้าแนะนำ "เพื่อเกณฑ์อันธพาลรับจ้างจากบรรดาผู้ก่อจลาจลชาว [ROOT.Char.GetFaith.GetAdherentNameNoTooltip] และหากพวกเขายังคง #italic ฝึกฝน#! ต่อไปในเคาน์ตีบ้านเกิดของตน นั่นก็ไม่เลวร้าย เช่นกัน! อันที่จริงเราอาจจะ #italic สนับสนุน#! สิ่งนั้นด้วยซ้ำ..." \n\n ข้าจะปล่อยให้ [tension_county.GetNameNoTierNoTooltip] ลุกเป็นไฟเพื่อเกณฑ์พวกคลั่งศาสนาที่รุนแรงเหล่านี้หรือไม่?"
 fp2_struggle.1000.a:0 "ให้เราแพร่กระจายความเกลียดชัง...อย่างลับๆ"
 fp2_struggle.1000.b:0 "ข้าเชื่อใจให้เจ้าจัดการ"
 fp2_struggle.1000.c:0 "ไม่ ข้าจะพยายามคลี่คลายความตึงเครียด"
 fp2_struggle.1000.d:0 "หากข้าหยุดความบ้าคลั่งนี้ไม่ได้ บางทีผู้ปกครองชาว [minority_courtier.GetFaith.GetAdherentNameNoTooltip] อาจทำได้"
 
 
 not_my_problem_toast:0 "แม่เลี้ยงเดี่ยวและเด็กๆ ในอาณาจักรของท่านจะอดอยากไปอีกหลายปี"

 fp2_struggle.1001.t:0 "แม่ม่ายสงคราม"
 fp2_struggle.1001.desc:0 "[expectant_courtier.GetTitledFirstName] กำลังตั้งครรภ์ และได้มาครุ่นคิดถึงสถานการณ์ของเหล่ามารดาคนอื่น ๆ ใน [SelectLocalization( IsLandlessAdventurer( ROOT.Char ), 'camp', 'lands')] ของเรา - ผู้ที่ถูกทอดทิ้งจากสงครามและความโชคร้ายครั้งล่าสุด ให้ต้องดูแลบุตรเพียงลำพัง "พวกเราสามารถจัดตั้งกองทุนพิเศษได้นะ [ROOT.Char.Custom('FormOfAddressForLiege')] เพื่อจ่ายให้เหล่าแม่ลูกอ่อนผู้ไม่มีหนทางอื่นในการเลี้ยงชีพ ท้ายที่สุดแล้ว การเลี้ยงดูบุตรก็เป็นงานที่หนักหนาและน่าสรรเสริญ เช่นเดียวกับงานอื่น ๆ""
 fp2_struggle.1001.a:0 "เป็นความคิดที่ดี! ข้าจะสร้างกองทุนดังกล่าว"
 fp2_struggle.1001.b:1 "มีเพียงแม่ม่ายเท่านั้นที่จะได้รับการสนับสนุนจากข้า"
 fp2_struggle.1001.b.tt:0 "ศรัทธาของท่านไม่เห็นชอบกับสตรีที่มีบุตรนอกสมรส"
 fp2_struggle.1001.c:0 "พวกนางมาพักที่ [ROOT.Char.Custom('GetCourt')] ของข้าได้! เรามีอาหารอุดมสมบูรณ์!"
 fp2_struggle.1001.c.tt:0 "ท่านเชิญแม่เลี้ยงเดี่ยวที่ยากจนทั้งหมดในอาณาจักรของท่านมาพักที่ [ROOT.Char.Custom('GetCourt')] ของท่าน"
 fp2_struggle.1001.d:0 "แน่นอนว่า ข้าในบังคับผู้ใจบุญของข้าสามารถช่วยสนับสนุนกองทุนนี้ได้"
 fp2_struggle.1001.e:0 "ข้าคือ [ROOT.Char.GetTitleTierName] ของเจ้า ไม่ใช่แม่นม!"
 fp2_struggle.1001.specialdescpositive:0 "ข้าในบังคับที่ยินดีจ่ายจะได้รับ #positive_value +10#! #color_light_blue ความเห็น#! ต่อท่าน"
 fp2_struggle.1001.specialdescnegative:0 "ข้าในบังคับที่ไม่ยินดีจ่ายจะเสีย #negative_value -10#! #color_light_blue ความเห็น#! ต่อท่าน"
 
