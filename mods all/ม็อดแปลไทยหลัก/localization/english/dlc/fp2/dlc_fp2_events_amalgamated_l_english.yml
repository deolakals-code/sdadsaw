	##### Intro #####
 fp2_struggle.0501.t:1 "การต่อสู้แห่ง $iberian_struggle$"
 fp2_struggle.0501.desc:1 "คาบสมุทรไอบีเรียกำลังปั่นป่วน ความขัดแย้งอันเกิดจากอดีตอันยาวนาน คนนอกต่างโลภอยากได้ดินแดน และมหาอำนาจมุสลิมและคริสเตียนผู้ยิ่งใหญ่ต่างพยายามชักจูงผู้คน แต่ผู้ที่เกิดและตายบนผืนดินนี้เท่านั้นที่จะเป็นผู้กำหนดชะตากรรมในท้ายที่สุด\n\n"
 fp2_struggle.0501.desc.involved:0 "ข้าจะไม่ยอมให้วิสัยทัศน์ของข้าที่มีต่อมาตุภูมิต้องหลุดลอยไป ขอสาบานต่อ [ROOT.Char.GetFaith.HighGodName] ตระกูล [ROOT.Char.GetHouse.GetNameNoTooltip] จักฝ่าฟันพายุนี้ไปและเห็นความประสงค์ของข้าสำเร็จผล\n\n"
 fp2_struggle.0501.desc.interloper:0 "ถึงเวลาแล้วที่ข้าจะควบคุมสถานการณ์และชะตากรรมของข้า ข้ามองเห็นหมากทุกตัววางอยู่บนกระดาน ข้ารู้หนทางข้างหน้า และจะไม่มีสิ่งใดหยุดยั้งตระกูล [ROOT.Char.GetHouse.GetNameNoTooltip] ได้\n\n"
 fp2_struggle.0501.desc.mottocall:0 "[ROOT.Char.GetHouse.GetMotto]!"
 fp2_struggle.0501.a:0 "กุมชะตาไว้!"

	##### Hostility #####
	# Struggle Ender
 fp2_struggle.0900.t:0 "$struggle_iberia_ending_hostility_decision$"
 fp2_struggle.0900.opening.basque:0 "พวกเราชาว [ROOT.Char.GetCulture.GetNameNoTooltip] ได้อดทนต่อการรุกล้ำมานานหลายศตวรรษ: พวกวิซิกอธ, พวกกอล, พวกมัวร์... แต่เมื่อเวลาผ่านไป ความแข็งแกร่งของ แต่ละพวกก็อ่อนแอลง วันนี้ ชะตากรรมของไอบีเรียอยู่ในมือ #EMP ของเรา#! อีกครั้ง"
 fp2_struggle.0900.opening.andalusian:0 "ประวัติศาสตร์ของผู้คนของเราซับซ้อนเท่ากับความหลากหลายของเรา และเต็มไปด้วยภยันตรายเท่ากับความแข็งแกร่งของเรา อนาคตของไอบีเรียจะถูกตัดสินอีกครั้งโดยทายาทแห่งราชวงศ์อุมัยยะฮ์"
 fp2_struggle.0900.opening.iberian:0 "นานเกินไปแล้วที่ชาวไอบีเรียต้องทนทุกข์ทรมานด้วยน้ำมือของผู้รุกรานชาวมัวร์ วันนี้เราจะฟื้นฟูความหวังที่ทายาทโดยชอบธรรมแห่งโรมได้สูญเสียไปเมื่อหลายศตวรรษก่อน"
 fp2_struggle.0900.opening:0 "ความโกลาหลที่ไอบีเรียประสบในศตวรรษก่อนๆ ได้ทิ้งรอยด่างไว้ในใจของผู้อยู่อาศัยทุกคน วันนี้คือการเริ่มต้นบทต่อไปของคาบสมุทรแห่งนี้..."
 fp2_struggle.0900.desc:0 "\n\nบัดนี้ไม่มีอาณาจักรอื่นใดที่สามารถท้าทายอำนาจครอบงำของ [ROOT.Char.GetPrimaryTitle.GetAdjectiveNoTooltip] ในไอบีเรียได้อย่างแท้จริง หรือท้าทายเหล่านักบวชและผู้ตั้งถิ่นฐานที่นำพระวจนะของ [ROOT.Char.GetFaith.HighGodName] และอารยธรรม [ROOT.Char.GetCulture.GetName] มาสู่หมู่บ้านต่างๆ ได้\n\nสิ่งที่เหลืออยู่คือการประกาศชัยชนะนี้ หลังจากตัดสินใจแล้วว่าจะดำเนินการปกครองของเราต่อไปอย่างไร"
 fp2_struggle.0900.a:0 "นี่จักเป็นดินแดนแห่ง [ROOT.Char.GetFaith.HighGodNameAlternate]!"
 fp2_struggle.0900.b:0 "การตั้งถิ่นฐานบนคาบสมุทรนี้จะเป็นจุดสนใจหลักของเรา"
 fp2_struggle.0900.c:1 "[ROOT.Char.GetFaith.HighGodName] ได้ประทานไอบีเรียแก่ชาว [ROOT.Char.GetCulture.GetCollectiveNounNoTooltip]!"
	# Other Players
 fp2_struggle.0910.opening.involved:0 "แม้จะมาจากอาณาจักรอื่น การปลดปล่อยจากความไม่แน่นอนที่ครอบงำภูมิภาคมานานหลายศตวรรษอาจมาถึงแล้วในบัดนี้..."
 fp2_struggle.0910.opening:0 "ข่าวคราวความคืบหน้าล่าสุดบนคาบสมุทรไอบีเรียได้มาถึงราชสำนักของเราแล้ว สัญญาถึงการสิ้นสุดความขัดแย้งที่รบกวนภูมิภาคนี้"
 fp2_struggle.0910.desc:0 "\n\n[struggle_ender.GetName] ผู้ ซึ่งขณะนี้ควบคุมพื้นที่ส่วนใหญ่ของคาบสมุทร ได้ประกาศตน [struggle_ender.GetHerselfHimself] เป็นผู้ชนะสูงสุดของการต่อสู้ที่เริ่มต้นขึ้นเมื่อนานมาแล้วโดยการรุกรานของชาวมัวร์\n\n"
 fp2_struggle.0910.closing.faith:0 "[struggle_ender.GetSheHe|U] ได้ประกาศให้ไอบีเรียเป็นดินแดน [struggle_ender.GetFaith.GetAdjective] และหาก [struggle_ender.GetFaith.HighGodName] ทรงประสงค์ พวกนอกรีตและพวกนอกศาสนาทั้งหมดจะถูกขับไล่ออกจากอาณาเขตของ [struggle_ender.GetHerHis]"
 fp2_struggle.0910.closing.culture:0 "[struggle_ender.GetSheHe|U] ได้ประกาศว่าไอบีเรียเป็นของชาว [struggle_ender.GetCulture.GetName] และผู้รุกรานต่างชาติและผู้คนที่ถูกกดขี่ทั้งหมดยอมรับความจริงนี้"
 fp2_struggle.0910.closing.combined:0 "[struggle_ender.GetSheHe|U] ได้ประกาศว่าไอบีเรียและ [struggle_ender.GetPrimaryTitle.GetNameNoTier] เป็นหนึ่งเดียวกัน บัดนี้ถูกส่งมอบสู่มือของชาว [struggle_ender.GetFaith.GetAdjective] [struggle_ender.GetCulture.GetName] โดย [struggle_ender.GetFaith.HighGodName]..."
 fp2_struggle.0910.a:0 "เรื่องนี้ยังไม่จบ"
 fp2_struggle.0910.b:0 "น่าสนใจยิ่งนัก"
	##### Compromise #####
	# Struggle Ender
 fp2_struggle.0901.t:0 "$struggle_iberia_ending_compromise_decision$"
 fp2_struggle.0901.desc:1 "\n\nบัดนี้เป็นที่ชัดเจนแล้วว่าจะไม่มีวันสิ้นสุดวงจรการนองเลือดนี้หากสิ่งต่างๆ ยังคงดำเนินต่อไป คาบสมุทรนี้จะไม่สามารถรวมเป็นหนึ่งได้\n\nเราต้องพอใจกับ [ROOT.Char.GetPrimaryTitle.GetNameNoTierNoTooltip] และปล่อยให้ผู้มีอำนาจอื่นๆ ในไอบีเรียจัดการเรื่องของตนเองไปก่อน - สำหรับตอนนี้..."
 fp2_struggle.0901.a:0 "นี่เป็นสิ่งที่ดีที่สุดแล้ว"
 fp2_struggle.0901.tt:0 "[THIS.Char.GetPrimaryTitle.GetDeJureLiege.GetNameNoTier] ได้กลายเป็น [empire|E] โดย [de_jure|E]"
	# Other Players
 fp2_struggle.0911.desc:0 "\n\n[struggle_ender.GetTitledFirstName] ได้ประกาศอย่างเป็นทางการว่าจะละทิ้งความตั้งใจใดๆ ที่จะรวมคาบสมุทรภายใต้มงกุฎเดียวกัน และประกาศว่าผู้ใดก็ตามที่อ้างสิทธิ์ในตำแหน่งนั้นถือว่าไม่ชอบธรรม\n\nอาณาจักรที่แตกต่างกัน ซึ่งหล่อหลอมขึ้นจากการรุกรานและการยึดครองคืนมานานหลายศตวรรษ บัดนี้หยั่งรากลึกเกินกว่าจะรวมเป็นหนึ่งได้"
 fp2_struggle.0911.a:0 "เราจะไม่ลืมความฝันถึงฮิสปาเนีย..."
	##### Conciliation #####
	# Struggle Ender
 fp2_struggle.0902.t:0 "$struggle_iberia_ending_conciliation_decision$"
 fp2_struggle.0902.desc:0 "\n\nคำสาบานรับรองการคุ้มครอง ซึ่งมีเพียงข้าเท่านั้นที่อยู่ในฐานะที่จะบังคับใช้ได้ในขณะนี้ จะรับประกันว่าผู้คนที่หลากหลายในภูมิภาคนี้สามารถดำรงชีวิตและประกอบพิธีกรรมได้อย่างเสรี\n\nหาก [ROOT.Char.GetFaith.HighGodName] ทรงประสงค์ สงครามในอดีตจะยังคงอยู่ที่นั่น และเจ้าชายไอบีเรียองค์อื่นๆ จะเห็นประโยชน์ของการอยู่ร่วมกัน"
 fp2_struggle.0902.a:0 "ส่งผู้ประกาศสาส์นไป"
	# Other Players
 fp2_struggle.0912.desc:0 "\n\nผู้ประกาศสาส์นของ [struggle_ender.GetPrimaryTitle.GetAdjectiveNoTooltip] ได้ประกาศรับรองการเดินทางและการประกอบพิธีกรรมอย่างเสรีสำหรับทุกคน โดยบังคับใช้โดย [struggle_ender.GetTitledFirstName] ซึ่งได้รับการแซ่ซ้องสรรเสริญอย่างกว้างขวางจากสามัญชน\n\nหลายคนปรารถนาให้การนองเลือดในไอบีเรียสิ้นสุดลง บางทีสันติภาพ #EMP ครั้งนี้#! อาจเป็นสันติภาพที่ยั่งยืน"
 fp2_struggle.0912.a:0 "น่าประหลาดใจอย่างแน่นอน"

 # fp2_event_dan
 fp2_yearly.1001.t:0 "หมากรุกสอง"
 fp2_yearly.1001.desc:0 "หลังจากเอาชนะหมากรุกกับตัวเองได้อีกครั้ง ข้าอดคิดไม่ได้ว่าบางทีสติปัญญาอันสูงส่งของข้าอาจจะพัฒนากระดานนี้ได้บ้าง \n\nแต่การเปลี่ยนแปลงใดเล่าที่จะสมเหตุสมผลที่สุด?"
 fp2_yearly.1001.a:0 "เห็นได้ชัดว่าคิงอ่อนแอเกินไป"
 fp2_yearly.1001.b:0 "บิชอปควรจะแข็งแกร่งกว่านี้"
 fp2_yearly.1001.c:0 "เหตุใดข้าจึงทรมานเบี้ยไม่ได้?"


 fp2_yearly.1002.t:0 "สถานการณ์อันน่ากระอักกระอ่วน"
 fp2_yearly.1002.desc:1 "ยามดึกสงัด ข้าได้ยินเสียงประหลาดดังมาจากห้องหนึ่งสุดทางเดิน เมื่อแอบมองลอดประตูเข้าไป ข้าเห็น [ROOT.Char.Custom2('RelationToMeShort', deviant_courtier)] ของข้าเปลือยกาย ถูกมัด และกำลังถูกคนรับใช้เฆี่ยนตีด้วยท่อนไม้ ซึ่งดูเหมือนจะสวมเสื้อผ้าเก่าๆ ของข้าอยู่ หากนั่นยังไม่ประหลาดพอ [deviant_courtier.GetSheHe] ดูเหมือนจะชอบมันมาก\n\nระหว่างที่ถูกตี [deviant_courtier.GetSheHe] ร้องตะโกนว่า "ใช่! ลงโทษข้าสิ [ROOT.GetCharacter.GetNameNoTooltip], ข้าเป็น [ROOT.Char.Custom2('RelationToMeShort', deviant_courtier)] ตัวน้อยที่ดื้อด้านเหลือเกิน!""
 fp2_yearly.1002.b:0 "ข้าได้กลิ่นเรื่องที่จะใช้แบล็กเมล์ได้"
 fp2_yearly.1002.c:0 "นั่นดูน่าสนุก!"
 fp2_yearly.1002.a:0 "ข้าไปดีกว่า"
 

 fp2_yearly.1003.t:0 "ประลองทวนกับ... ยักษ์?"
 fp2_yearly.1003.desc:0 "ความโกลาหลในลานปราสาทดึงความสนใจของข้า เมื่อ [injured_knight.Custom2('MyCharacterIntroduction', ROOT.Char)] ถูกชาวนาหลายคนหามเข้ามา [injured_knight.GetSheHe|U] บาดเจ็บสาหัสอย่างเห็นได้ชัด\n\nเมื่อข้าถามว่าเกิดอะไรขึ้น พวกชาวนาบอกข้าว่าพวกเขาพบ [injured_knight.GetHerHim] ในทุ่งนา ที่ ซึ่ง [injured_knight.GetSheHe] อ้างว่าเพิ่งต่อสู้กับยักษ์ตนหนึ่งมาอย่างฉิวเฉียด\n\nผู้ติดตามของเขาดึงข้าไปข้างๆ หลังจากเรื่องจบลง "ความจริงคือ [injured_knight.GetSheHe] พยายามประลองทวนกับกังหันลมและพ่ายแพ้ขอรับนายท่าน แต่ชาวบ้านเหล่านี้ดูเหมือนจะเชื่อเรื่องของ [injured_knight.GetHerHis] มากทีเดียว""
 fp2_yearly.1003.a:0 "จงสรรเสริญอัศวินผู้กล้าหาญ ข้าจะซื้อม้าตัวใหม่ให้ [injured_knight.GetHerHim]"
 fp2_yearly.1003.b:0 "ข้าจะไม่ยอมทนกับเรื่องเหลวไหลในราชสำนักของข้า"

 fp2_yearly.1004.t:0 "เหยี่ยวแห่งกุเรช"
 fp2_yearly.1004.desc:0 "ข้ากำลังอ่านประวัติศาสตร์ของ [hawk_of_quraysh.GetName] ซึ่งรู้จักกันในนาม "เหยี่ยวแห่งกุเรช"\n\nการได้เรียนรู้เกี่ยวกับชีวิตของเขานั้นช่างสร้างแรงบันดาลใจได้อย่างน่าเหลือเชื่อ นับตั้งแต่การหลบหนีจาก[abbasid_dynasty.GetName] ไปจนถึงการสถาปนาราชวงศ์[hawk_dynasty.GetName]ในไอบีเรีย ข้าอดคิดไม่ได้ว่าข้าควรจะนำบางส่วนมาเป็นแบบอย่าง"
 fp2_yearly.1004.a:0 "ข้าเองก็สามารถสร้างแรงบันดาลใจให้คนของข้าได้ เช่นเดียวกับที่เขาทำที่การ์โมนา"
 fp2_yearly.1004.b:0 "การเจรจาทางการทูตของเขากับชาวเยเมนนั้นเป็นตำนาน"
 fp2_yearly.1004.c:0 "เราเป็นญาติกัน!"

 nick_the_hawk_of_quraysh:0 "เหยี่ยวแห่งกุเรช"


 fp2_hawk_of_quraysh_martial_modifier:0 "แรงบันดาลใจทางการทหาร"
 fp2_hawk_of_quraysh_martial_modifier_desc:0 "ตัวละครนี้ได้รับแรงบันดาลใจทางการทหารจากเหยี่ยวแห่งกุเรช"


 fp2_hawk_of_quraysh_diplomacy_modifier:0 "แรงบันดาลใจทางการทูต"
 fp2_hawk_of_quraysh_diplomacy_modifier_desc:0 "ตัวละครนี้ได้รับแรงบันดาลใจทางการทูตจากเหยี่ยวแห่งกุเรช"

 fp2_yearly.1005.t:0 "ไวกิ้งผู้หลงทาง"
 fp2_yearly.1005.desc:0 "[hidden_viking.GetWomanMan] ร่างใหญ่ถูกลากมาต่อหน้าข้า ทั้งดิ้นรนและตะโกน [hidden_viking.GetSheHe|U] เป็นนักรบไวกิ้งอย่างชัดเจน ประเภทที่สร้างความโกลาหลในอาณาจักรของเรามานานหลายทศวรรษ\n\n"โปรดเมตตาด้วย ข้าชื่อ [hidden_viking.GetName] และอาศัยอยู่ใน [viking_county.GetNameNoTooltip] มาหลายปีแล้ว ข้าถูกทิ้งไว้ข้างหลัง เพราะบาดเจ็บ ชาวบ้านช่วยข้าไว้ พวกเขาคือครอบครัวของข้าในตอนนี้"\n\nไวกิ้งคุกเข่าลง หวังว่าข้าจะไว้ชีวิต [hidden_viking.GetHerHis] ชาวนาหลายคนยืนยันเรื่องราวของ [hidden_viking.GetHerHis]"
 fp2_yearly.1005.a:1 "เจ้าอาจให้ความบันเทิงแก่ข้าราชบริพารของข้าด้วยเรื่องราวอันเป็นเอกลักษณ์ของเจ้า"
 fp2_yearly.1005.b:0 "การกระทำดีเพียงครั้งเดียวไม่อาจลบล้างความชั่วร้ายได้ — เจ้าต้องตาย"
 fp2_yearly.1005.c:0 "ตราบใดที่เจ้ารับใช้หมู่บ้าน เจ้าก็อาจมีชีวิตอยู่ต่อไปได้ในตอนนี้"


 fp2_yearly.1006.t:0 "เนยแข็งไวกิ้ง?"
 fp2_yearly.1006.desc:0 "ข้าหยุดที่แผงลอยริมทาง ซึ่งขายอาหารง่ายๆ พ่อค้าชื่อ [cheese_trader.GetName] เสนอขายสินค้าต่างๆ ให้ข้า ก่อนจะเอื้อมมือไปใต้แผงแล้วหยิบกล่องไม้แกะสลักออกมา\n\n"สำหรับท่านขอรับนายท่าน นี่คือเนยแข็งที่ดีที่สุดในอาณาจักร" [cheese_trader.GetSheHe|U] ยัดก้อนเล็กๆ ใส่มือข้า เอนตัวเข้ามาแล้วกระซิบอย่างมีลับลมคมในว่า "มันถูกสร้างขึ้นโดยไวกิ้งผู้ผลิตเนยแข็งที่นี่ในไอบีเรีย"\n\nแม้จะเป็นคำพูดที่แปลกประหลาด แต่เนยแข็งนั้นอร่อยอย่างเหลือเชื่อ"
 fp2_yearly.1006.a:0 "ข้าจะรับเนยแข็งของเจ้า แต่ไม่รับเรื่องไร้สาระของเจ้า"
 fp2_yearly.1006.b:0 "ข้าต้องตามหา "ไวกิ้งเนยแข็ง" เหล่านี้ให้พบ..."
 fp2.1006.b.tt:0 "ท่านส่งสายลับออกไปตามหา "ไวกิ้งเนยแข็ง""
 fp2_yearly.1006.c:0 "เรื่องไร้สาระสิ้นดี"


 fp2_yearly.1007.t:0 "$fp2_yearly.1006.t$"
 fp2_yearly.1007.desc:0 "[fake_cheese_viking.GetWomanMan] ผอมโซคนหนึ่งถูกนำตัวมาต่อหน้าข้า อย่างไรก็ตาม [fake_cheese_viking.GetWomanMan] ผู้น่าสมเพชตรงหน้าข้าแทบไม่เหมือนคนทำเนยแข็งเลย — ไม่ต้องพูดถึงไวกิ้ง\n\n"ข้าขออภัยจริงๆ แต่ข้าไม่ใช่ไวกิ้งจริงๆ มันเป็นแค่เรื่องโกหกเพื่อช่วยขายเนยแข็ง" [fake_cheese_viking.GetSheHe] พูดตะกุกตะกัก"
 fp2_yearly.1007.a:0 "โอ้ เอาเถอะ อย่างน้อยข้าก็ไขปริศนาได้แล้ว"
 fp2_yearly.1007.b:0 "ข้าต้องการกำไรครึ่งหนึ่ง และเนยแข็งครึ่งหนึ่งของเจ้า"

 fp2_respected_clergy_chess:0 "นักบวชผู้ทรงเกียรติในหมากรุก"
 fp2_respected_clergy_chess_desc:0 "เปลี่ยนกฎหมากรุก เพื่อให้เกียรติแก่นักบวช"

 fp2_cheese_artifact:0 "เนยแข็งบ่ม"
 fp2_cheese_artifact_desc:0 "แม้จะมีข่าวลือ เนยแข็งนี้ไม่ได้ทำโดยไวกิ้ง อย่างไรก็ตาม มันอร่อยอย่างยิ่ง"


 fp2_yearly.1008.t:0 "การบริโภคเนยแข็ง"
 fp2_yearly.1008.desc: "ถึงเวลาแล้ว ในส่วนลึกของห้องเก็บของข้ามีเนยแข็งที่น่าทึ่งที่สุดในโลกเท่าที่รู้จักกันอยู่ ซึ่งบ่มอย่างช้าๆ เพิ่มความเข้มข้นขึ้นเรื่อยๆ\n\n และบัดนี้ข้าจะบริโภคมัน"
 fp2_yearly.1008.a:0 "[ROOT.Char.GetFaith.HealthGodName|U] ทรงหลั่งน้ำตา นั่นเป็นเนยแข็งชั้นเลิศ"
 fp2_yearly.1008.b:0 "อันที่จริง ปล่อยให้เนยแข็งบ่มต่อไปอีกหน่อย"

