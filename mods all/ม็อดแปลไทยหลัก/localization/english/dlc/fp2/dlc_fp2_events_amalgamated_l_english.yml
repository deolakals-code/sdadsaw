 fp2_struggle.2000.t:0 "ตลาดไร้ระเบียบ"
 fp2_struggle.2000.desc:0 "ขณะสำรวจถนนในตลาด ข้าพบมุห์ตาซิบ [fp2_2000_market_inspector.GetFullName] ที่กำลังทุกข์ใจ พยายามบังคับใช้กฎระเบียบตลาดกับพ่อค้าเร่ "การจัดวางไร้ระเบียบ น้ำมันข้างประตูมัสยิด กระต่ายไม่ถลกหนัง และเนยแข็งในชาม! ขอสาบานต่ออัลลอฮ์ พวกเจ้าทุกคนควรฟังข้าเดี๋ยวนี้!"\n\nมุห์ตาซิบผู้นี้ #emphasis ควร#! ลงโทษการละเมิดกฎตลาด ด้วยความรุนแรงหากจำเป็น อย่างไรก็ตาม [fp2_2000_market_inspector.GetSheHe] กำลังถูกเพิกเฉยโดยพ่อค้าที่ตาบอด เพราะความโลภ\n\nข้าจะช่วย [fp2_2000_market_inspector.GetHerHim] ได้อย่างไรบ้าง?"
 fp2_struggle.2000.a:0 "เข้าแทรกแซงและขู่ว่าจะเรียกกอฎี"
 fp2_struggle.2000.a.desc:0 "มุห์ตาซิบแก้ไขเส้นทางของพ่อค้าที่หลงผิด\nกอฎีลงโทษพวกเขาตามคำตัดสิน"
 fp2_struggle.2000.a.a:0 "พ่อค้าเชื่อฟังคำพูดของท่าน แต่ยังไม่คล้อยตาม"
 fp2_struggle.2000.a.a.notif:0 "ระบบราชการที่บานปลาย"
 fp2_struggle.2000.a.b:0 "ท่านแก้ไขสถานการณ์อย่างสันติ"
 fp2_struggle.2000.a.b.notif:0 "การประนีประนอมที่ยอมรับได้"
 fp2_struggle.2000.b:0 "ตำหนิพวกเขาทั้งหมดอย่างรุนแรง!"
 fp2_struggle.2000.b.desc:0 "ข้าจะลงโทษทางกายภาพแก่พ่อค้าด้วยตนเอง"
 fp2_struggle.2000.b.notif:0 "การแสดงความขยันหมั่นเพียร"
 fp2_struggle.2000.b.notif.desc:0 "ตกใจที่เห็นมุห์ตาซิบถูกตำหนิ พ่อค้าจึงรีบเคลียร์ตลาด"
 fp2_struggle.2000.d:0 "เหตุใดกฎเกณฑ์จึงต้องขัดขวางธุรกิจ?"
 fp2_struggle.2000.d.desc:0 "การอนุญาตให้ค้าขายโดยไม่ต้องกังวลเรื่องธรรมเนียมจะเพิ่มการค้า แต่จะ ทำให้ตลาดค่อยๆ ขาดเสถียรภาพ"
 fp2_struggle.2000.e:0 "ข้าจะไม่ทนต่อการไม่เชื่อฟังนี้! ทหารยาม!"
 fp2_struggle.2000.f:0 "ในเมื่อเราทำเรื่องนี้แล้ว ทำไมเราไม่สร้างซ่องโสเภณีด้วยล่ะ?"
 fp2_struggle.2000.f.desc:0 "ท่านสนับสนุนให้พ่อค้าละเมิดฮิสบะฮ์ต่อไป พยายามคลี่คลายความตึงเครียด"
 fp2_struggle.2000.f.notif:0 "การผ่อนปรนต่อพ่อค้าต่างชาติ"
 fp2_struggle.2000.f.notif.desc:0 "การละเมิดกฎตลาดเพิ่มขึ้นเท่านั้น บัดนี้มุห์ตาซิบได้หยุดบังคับใช้กฎระเบียบแล้ว"
 fp2_struggle.2001.t:0 "หมู่บ้านที่ถูกทอดทิ้ง"
 fp2_struggle.2001.desc:0 "ขณะที่ข้าตรวจตราบริเวณ [ROOT.GetCharacter.Custom('FortifiedBuilding')] ของข้า ผู้อาวุโสชาวนาคนหนึ่งเข้ามาหาข้า\n\n"[ROOT.Char.GetLadyLord] ผู้ยิ่งใหญ่ โปรดเมตตาพวกเราและช่วยหมู่บ้านของเราให้พ้นจากการปกครองแบบเผด็จการของ [fp2_2001_desperate_county.GetHolder.GetName]" [fp2_2001_desperate_county.GetHolder.GetSheHe|U] ละเลยการตั้งถิ่นฐานของเรามานานเกินไปแล้ว ผู้คนปรารถนาผู้ปกครองคนใหม่ พวกเขาปรารถนาท่าน [ROOT.Char.GetLadyLord]""
 fp2_struggle.2001.desc.extra.a:0 "[fp2_2001_desperate_county.GetName] เป็นของพันธมิตรของท่าน [fp2_2001_desperate_county.GetHolder.GetName] การให้การสนับสนุนทางทหารแก่กบฏจะเป็นการกระทำที่เป็นปฏิปักษ์\n\n"
 fp2_struggle.2001.desc.extra.b:0 "[fp2_2001_desperate_county.GetHolder.GetName] ผู้เป็นเจ้าของ [fp2_2001_desperate_county.GetName] มีข้อตกลงพักรบกับท่านอยู่ การช่วยเหลือชาวนาจะเป็นการละเมิดข้อตกลงนี้"
 fp2_struggle.2001.a:0 "เจ้าได้คำสัตย์ของข้า [fp2_2001_desperate_county.GetNameNoTierNoTooltip] จะได้รับการปลดปล่อย!"
 fp2_struggle.2001.a.desc:0 "ท่านจะต้องยึด [fp2_2001_desperate_county.GetNameNoTier] ภายใน #bold ห้าปี#!."
 fp2_struggle.2001.a.a.desc:0 "[2001_scoped_chaplain.GetTitledFirstName] จะผิดหวังอย่างยิ่งหากท่านล้มเหลว"
 fp2_struggle.2001.a.notif:0 "ได้รับสิทธิ์อันชอบธรรม"
 fp2_struggle.2001.b:0 "เจ้าเต็มใจที่จะละทิ้ง [fp2_2001_desperate_elder.GetFaith.HighGodName] เพื่อสิ่งนั้นหรือไม่?"
 fp2_struggle.2001.b.desc:0 "ท่านจะต้องยึด [fp2_2001_desperate_county.GetNameNoTier] ภายใน #bold สิบปี#!."
 fp2_struggle.2001.b.notif:0 "[fp2_2001_desperate_county.GetNameNoTierNoTooltip] เปลี่ยนมานับถือ [ROOT.Char.GetFaith.GetNameNoTooltip]"
 fp2_struggle.2001.b.notif.desc:0 "ไม่ว่าจะด้วยความสมัครใจหรือความสิ้นหวัง หมู่บ้าน [fp2_2001_desperate_county.GetNameNoTier] ได้ยอมรับ [ROOT.Char.GetFaith.GetName]"
 fp2_struggle.2001.c:0 "พิสูจน์ความมุ่งมั่นของเจ้าให้ข้าเห็น ชี้หอกของเจ้าไปที่ [fp2_2001_desperate_county.GetHolder.GetFirstNameNoTooltip]!"
 fp2_struggle.2001.d:0 "บางทีเจ้าอาจเริ่มต้นด้วยการจ่ายบรรณาการให้ [ROOT.Char.GetLadyLord] คนใหม่ของเจ้า..."
 fp2_struggle.2001.d.notif:0 "ชาวบ้านผู้สิ้นหวังจ่ายค่าธรรมเนียมการปลดปล่อย"
 fp2_struggle.2001.d.notif.desc:0 "ชาวนาจาก [fp2_2001_desperate_county.GetName] ได้รวบรวมของมีค่าทุกชิ้นสุดท้ายที่พวกเขามีเพื่อจ่ายบรรณาการสำหรับการปลดปล่อย"
 fp2_struggle.2001.e:0 "ข้าเสียใจ แต่ผู้คนของเจ้าจะต้องช่วยเหลือตนเอง"
 fp2_struggle.2001.e.desc:0 "ท่านทอดทิ้งชาวนาให้อยู่ภายใต้ชะตากรรมภายใต้การปกครองของ [fp2_2001_desperate_county.GetHolder.GetName]"
 fp2_struggle.2001.f:0 "ข้าอยู่ข้าง [fp2_2001_desperate_county.GetHolder.GetTitleAsNameNoTooltip] และจะแจ้งให้ [fp2_2001_desperate_county.GetHolder.GetHerHim] ทราบถึงการทรยศของเจ้า!"
