l_english: 
 # dlc_fp2_flavor_events_oltner
 rice_fields_modifier:0 "ทุ่งนาข้าว"
 rice_fields_modifier_desc:1 "เหล่าไพร่ในเคาน์ตี้นี้กำลังปลูกข้าวอันอุดมคุณค่า ทำให้ท้องอิ่มและเป็นแรงบันดาลใจให้อาหารจานใหม่"
 fp2_flavor.0001.t:0 "พืชผลแห่งแนวคิดใหม่"
 fp2_flavor.0001.desc:0 "เมืองหลวงของ [rice_propagator.GetTitledFirstNamePossessive] นั้นรุ่งเรืองอย่างแท้จริง เหล่าไพร่แห่ง [rice_propagator_capital.GetNameNoTier] อ้วนท้วนสมบูรณ์และมีความสุข – และ #EMP มีผลิตผลยิ่งนัก!#!\n\nพวกมุสลิมได้นำพืชผลชนิดใหม่มาสู่ดินแดนของพวกเขา นั่นคือข้าว มันปลูกง่ายและเลี้ยงดูผู้คนได้เป็นอย่างดี นี่เป็นส่วนหนึ่งของความสำเร็จของพวกเขากระมัง? ข้าเองก็ไม่รังเกียจที่จะมีไพร่ที่มีผลิตผลมากขึ้น...\n\nบางทีข้าควรสร้างทุ่งนาข้าวในเมืองหลวงของข้าเอง? แต่ข้าควรจะเริ่มต้นอย่างไรดี?"
 fp2_flavor.0001.a:0 "ทองคำจะ ทำให้ [rice_propagator.GetFirstNamePossessiveNoTooltip] ปริปาก"
 fp2_flavor.0001.b:0 "แน่นอนว่า [rice_propagator.GetSheHe] ย่อมยินดีแบ่งปันกับมิตรสหายกระมัง?"
 fp2_flavor.0001.c:0 "ความลับจักต้องเป็นของข้า... ส่งสายลับไป"
 fp2_flavor.0001.d:0 "ช่างมันเถิด ข้าจะไม่ข้องเกี่ยวกับพวกมุสลิม"
 fp2_flavor.0001.b.success:0 "ท่านโน้มน้าว [rice_propagator.GetHerHim] ได้สำเร็จ"
 fp2_flavor.0001.b.failure:0 "[rice_propagator.GetFirstNameNoTooltip] รู้สึกถูกสบประมาท"
 fp2_flavor.0001.c.success:0 "สายลับของท่านขโมยความลับมาได้"
 fp2_flavor.0001.c.failure:0 "[rice_propagator.GetFirstNameNoTooltip] โกรธเกรี้ยว"

