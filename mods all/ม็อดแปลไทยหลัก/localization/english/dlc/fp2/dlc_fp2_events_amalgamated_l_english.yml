 fp2_struggle.2002.t.a:0 "หมู่บ้านที่ได้รับการปลดปล่อย"
 fp2_struggle.2002.t.b:0 "ภาระผูกพันที่ไม่บรรลุผล"
 fp2_struggle.2003.t:0 "กลุ่มนกหลงทาง"
 fp2_struggle.2003.desc:1 "กลุ่มทหารรับจ้างที่บาดเจ็บและท้อแท้ได้มาถึง [fp2_2003_county_town.GetName] ชาวบ้านอ้างว่าได้ยินการพูดคุยเรื่อง "การตั้งรกรากหลังจากปล้นเป้าหมายง่ายๆ" และเริ่มวิตกกังวล\n\nความตึงเครียดสูงและมีแนวโน้มที่จะเกิดความขัดแย้งหากข้าไม่เข้าแทรกแซง"
 fp2_struggle.2003.a:0 "วิงวอนให้พวกเขาจากไป"
 fp2_struggle.2003.a.a.notif:0 "โจรเมินคำวิงวอน"
 fp2_struggle.2003.a.b.notif:0 "การแก้ไขอย่างสันติ"
 fp2_struggle.2003.b:0 "เสนอตำแหน่งในกองทหารรักษาการณ์เมืองให้พวกเขา"
 fp2_struggle.2003.b.desc:0 "กองทหารรักษาการณ์สามารถใช้ทหารผ่านศึกได้ และการให้อาหารสัตว์ร้ายที่บาดเจ็บเป็นวิธีที่เร็วที่สุดในการ ทำให้เชื่อง"
 fp2_struggle.2003.c:0 "บังคับให้พวกเขาออกจากเมือง!"
 fp2_struggle.2003.c.desc:0 "ท่านจัดการโจมตีล่วงหน้า โดยใช้กองทหารรักษาการณ์ท้องถิ่นในการโจมตีแบบไม่ทันตั้งตัวเพื่อขับไล่พวกป่าเถื่อนออกไป\n"
 fp2_struggle.2003.c.a:0 "ทหารรับจ้างสังหารหมู่ทหาร"
 fp2_struggle.2003.c.b:0 "ทหารปราบทหารรับจ้าง"
 fp2_struggle.2003.c.b.notif:0 "ภัยคุกคามจากทหารรับจ้างถูกปราบปราม"
 fp2_struggle.2003.d:0 ""พวกเจ้าทุกคนดูเหมือนวัสดุทำฟาร์มชั้นดีสำหรับข้า!""
 fp2_struggle.2003.d.desc:0 "ท่านเสนอซื้อที่ดินทำกินและอุปกรณ์จากชาวบ้านและมอบให้กับทหารรับจ้าง"
 fp2_struggle.2003.e:0 "ให้ชาวบ้านจัดการเอง"
 fp2_struggle.2003.e.desc:0 "ความตึงเครียดสูงพออยู่แล้ว การยั่วยุพวกเขาจะก่อให้เกิดความเสี่ยงมากขึ้นเท่านั้น"
 fp2_struggle.2003.e.notif.a:0 "ทหารรับจ้างปล้นสะดมชนบท"
 fp2_struggle.2003.e.notif.b:0 "การยั่วยุของชาวนาจบลงด้วยโศกนาฏกรรม"
 fp2_struggle.2003.e.notif.b.desc:0 "ชาวบ้านเรียกร้องให้ทหารรับจ้างจากไป แต่นี่คือการยั่วยุทั้งหมดที่พวกเขาต้องการเพื่อโจมตี"
 fp2_struggle.2003.e.notif.c:0 "ทหารรับจ้างตั้งรกราก"
 fp2_struggle.2003.e.notif.c.desc:0 "ทหารรับจ้างชอบ [fp2_2003_county_town.GetName]"
 fp2_struggle.2007.t:0 "ปราสาทที่คู่ควรกับไอบีเรีย"
 fp2_struggle.2007.desc.main:1 "สุกงอมสำหรับการพัฒนาแล้ว," [fp2_2007_scoped_steward.GetCouncilTitleFirstName] ของข้ากล่าว "ด้วยเงินทุนของท่าน เราสามารถรักษาความปลอดภัยให้ [fp2_2007_free_real_estate.GetCounty.GetTitle.GetNameNoTier] จากศัตรูที่รอคอยของเราได้ในราคาที่ลดลง #emphasis อย่างมาก#! [2007_vassal_sponsor.GetTitledFirstName] ได้ยื่นคำร้องขอให้สร้าง [ROOT.Char.Custom('FortifiedBuilding')] สไตล์ [fp2_2007_foreign_faith.GetAdjective] ขึ้นบนนั้น โดยเสนอเหรียญของ [2007_vassal_sponsor.GetHerHis] เองบางส่วนเพื่อพยายามโน้มน้าวความคิดเห็นของท่าน อย่างไรก็ตาม ข้าในบังคับคนอื่นๆ ของท่านเรียกร้องให้ท่านยึดมั่นกับสถาปนิก [ROOT.Char.GetFaith.GetAdjective] ในท้องถิ่น ไม่ว่าท่านจะเลือกใคร นี่จะเป็นโอกาสทองในการเสริมสร้างความแข็งแกร่งให้กับอาณาจักรโดยรวม" ปัญหาเดียวคือ #EMP ใคร#! จะได้รับเลือกสำหรับโอกาสทองนี้..."
 fp2_struggle.2007.desc.a:0 ""ดินแดนของท่าน $fp2_struggle.2007.desc.main$""
 fp2_struggle.2007.desc.b:0 ""ดินแดนของ [fp2_2007_castle_holder.GetTitledFirstName] $fp2_struggle.2007.desc.main$""
 fp2_struggle.2007.a:0 "ข้าจะจ้างสถาปนิก [ROOT.Char.GetFaith.GetAdjectiveNoTooltip]"
 fp2_struggle.2007.a.castile:0 "ชาว [ROOT.Char.GetFaith.GetAdjectiveNoTooltip]? ชาว [fp2_2007_foreign_faith.GetAdjectiveNoTooltip]? ข้าต้องการสถาปนิก [fp2_2007_allegedprotocastilean.GetNameNoTooltip]!"
 fp2_struggle.2007.a.notif:0 "การก่อสร้างปราสาทจะเริ่มขึ้นที่ [fp2_2007_free_real_estate.GetName]"
 fp2_struggle.2007.a.major_vassal_flavor:0 "ความคิดเห็นของข้าในบังคับผู้ทรงอำนาจที่มีศรัทธาเดียวกันจะไม่เปลี่ยนแปลง เพราะนี่คือผลลัพธ์ที่คาดหวัง"
 fp2_struggle.2007.a.castile.favor:0 "ไม่มีใครจะคัดค้านชาว [fp2_2007_allegedprotocastilean.GetNameNoTooltip] เพราะพวกเขามีชื่อเสียงว่าเป็นสถาปนิกที่เป็นแบบอย่าง"
 fp2_struggle.2007.b:0 "ข้าจะจ้างสถาปนิก [fp2_2007_foreign_faith.GetAdjectiveNoTooltip]"
 fp2_struggle.2007.b.flavor:0 "การกระทำนี้จะถูกมองว่าเป็นการแสดงจุดยืนโดยไม่คำนึงถึงศรัทธา"
 fp2_struggle.2007.c:0 "ข้าจะออกแบบปราสาทด้วยตนเอง มันจะยากสักแค่ไหนกันเชียว?"
 fp2_struggle.2007.c.flavor:0 "การออกแบบปราสาทโดยไม่ใช้จ่ายทรัพย์สมบัติมหาศาลเป็นภารกิจที่ยากลำบากอย่างยิ่ง"
 fp2_struggle.2007.c.roco:0 "$royal_architect_court_position$ จะจัดการงานนี้"
 fp2_struggle.2007.c.notif.a.t:0 "รากฐานผุพัง โครงสร้างทรุดโทรม"
 fp2_struggle.2007.c.notif.a.desc:0 "แผนการสร้างปราสาทของท่านถูกหลอกหลอนด้วยความล้มเหลว"
 fp2_struggle.2007.c.notif.b.desc:0 "การออกแบบประสบความสำเร็จ"
 fp2_struggle.2007.d:1 "ข้าจะ #EMP ไม่#! ให้ทุนสร้างปราสาทใดๆ โดยเฉพาะอย่างยิ่งหากมันจะไม่ใช่ของข้า!"
 fp2_struggle.2007.d.alt:0 "ดินแดนเหล่านี้ไม่ปรารถนาปราสาท ปล่อยมันไว้เถิด"
 fp2_struggle.2008.t:0 "ความผิดของ [fps_2008_misdeed_actor.GetCouncilTitle]"
 fp2_struggle.2008.desc:0 "ในยามเย็น [fps_2008_misdeed_actor.GetCouncilTitleFirstName] นั่งอยู่ในห้องสภาอันสลัว สายตาและปากกาขนนก[fps_2008_misdeed_actor.GetHerHis|U]จดจ่ออยู่กับรายงานค่าใช้จ่ายที่ไม่สะดุดตา ทว่า ข้างกาย[fps_2008_misdeed_actor.GetHerHim]กลับมีแม่พิมพ์ดินเหนียวพร้อมตราหลวงวางอยู่ ซึ่งจำเป็นเพียงเมื่อ[fps_2008_misdeed_actor.GetSheHe]ตั้งใจจะฉ้อโกงแผ่นดินเท่านั้น ไม่น่าเชื่อว่า[fps_2008_misdeed_actor.GetWomanMan]ในตำแหน่ง[fps_2008_misdeed_actor.GetHerHis]จะกล้ากระทำการอันน่าอัปยศ เช่นนี้ต่อหน้าพระพักตร์[ROOT.Char.GetFaith.HighGodName]!\n\nน่าอัปยศ... แต่ก็เชี่ยวชาญนัก หากข้ามิได้จับ[fps_2008_misdeed_actor.GetHerHim]ได้คาหนังคาเขา คงไม่มีผู้ใดล่วงรู้ถึงแผนการ[fps_2008_misdeed_actor.GetHerHis]เป็นแน่"
 fp2_struggle.2008.a:0 "ข้าเห็นพอแล้ว จับเจ้าเข้าคุกเสีย!"
 fp2_struggle.2008.b.a:0 "สอนข้าปลอมแปลงเอกสาร แล้วข้าจะเมตตาเจ้า"
 fp2_struggle.2008.b.flavor:1 "ท่านปัดกวาดหลักฐานทิ้งไปเพื่อแลกกับความรู้ในศิลปะแห่งการหลอกลวง"
 fp2_struggle.2008.c:0 "เงินทุนเหล่านั้นมีไว้สำหรับข้า... ใช่หรือไม่?"
 fp2_struggle.2008.c.flavor:0 "ท่านซุกซ่อนหลักฐานการกระทำผิดไว้ใต้พรมและเข้าร่วมในแผนการทุจริต"
 fp2_struggle.2008.d:0 "เจ้าจะต้องถูกประจาน ณ จัตุรัสกลางเมือง"
 fp2_struggle.2008.d.flavor:0 "ท่านเปิดโปงการกระทำ[fps_2008_misdeed_actor.GetHerHis]ต่อหน้าสาธารณชน เพื่อให้พวกเขาตัดสิน[fps_2008_misdeed_actor.GetHerHim]ด้วยตนเอง เป็นการขัดต่อความปรารถนาที่จะเก็บเรื่องเป็นความลับของเหล่าข้าในบังคับและสมาชิกสภาของท่าน"
 fp2_struggle.2009.t:0 "จับหัวขโมยในตำนาน"
 fp2_struggle.2009.desc:0 ""เจ้าเลือกปราสาทผิดแล้ว ไอ้โง่!" จอมทัพของข้าตะโกนขณะที่[fp2_2009_marshal.GetSheHe]ใช้ดาบข่มขู่ผู้บุกรุกที่หวาดกลัว\n\nภายใต้แรงกดดันจากจอมทัพ [fp2_2009_garduna_young_thief.GetWomanMan]หนุ่มสาวผู้นั้นอธิบายว่า[fp2_2009_garduna_young_thief.GetSheHe]เป็นส่วนหนึ่งขององค์กรอาชญากรรมขนาดใหญ่ที่มีต้นกำเนิดจาก [fp2_2009_involved_ruler.GetPrimaryTitle.GetName] และอยู่ภายใต้การบัญชาการของ [fp2_2009_garduna_guild_master.GetFullNameNicknamed] ผู้น่าสะพรึงกลัว "เช่นนั้น เจ้ากำลังพยายามตั้งกิลด์โจรแห่งใหม่ใต้จมูกข้าอยู่สินะ?" ข้าถาม ซึ่งหัวขโมยเพียงพยักหน้า [fp2_2009_garduna_young_thief.GetSheHe|U]ยินดีแลกเปลี่ยนข้อมูลเพิ่มเติมเพื่อรักษาชีวิต[fp2_2009_garduna_young_thief.GetHerHis]ไว้"
 fp2_struggle.2009.a:0 "แผ่นดินนี้ไม่ใหญ่พอสำหรับ #EMP [Select_CString(ROOT.Char.IsFemale,'ราชินี','ราชา')]#! สององค์"
 fp2_struggle.2009.a.flavor:0 "ท่านปล่อยหัวขโมยไปเพื่อแลกกับที่ซ่อนของหัวหน้าพวกมัน จากนั้นจึงออกเดินทางเพื่อปราบพวกมันและรับสมญานาม "ผู้พิฆาตหัวขโมย""
 fp2_struggle.2009.b:0 "บอกข้ามาว่าพรรคพวกของเจ้าซ่อนตัวอยู่ที่ใด แล้วเจ้าอาจจะรอดชีวิต"
 fp2_struggle.2009.b.blues:0 "ได้รับ [trait|E] #TUT_KW [GetTrait('depressed_1').GetName(GetNullCharacter)]#! หลังจากขายเพื่อน[fp2_2009_garduna_young_thief.GetHerHis]"
 fp2_struggle.2009.c:0 "กิลด์โจรของเจ้าฟังดู... #emphasis น่าเก็บภาษี#! เสียจริง!"
 fp2_struggle.2009.d:0 "ทำงานให้ข้า ก่อกวน [fp2_2009_involved_ruler.GetPrimaryTitle.GetNameNoTooltip]"
 fp2_struggle.2009.d.flavor.st:0 "ท่านจ่ายเงินให้กิลด์โจร เพื่อให้ออกไปจากดินแดนของท่าน"
 fp2_struggle.2009.e:0 "ข้าจะมอบศีรษะที่ถูกตัดของเจ้าเป็นของขวัญแก่ [fp2_2009_involved_ruler.GetTitledFirstNameNoTooltip]"
 fp2_struggle.2009.e.a:0 "กิลด์โจรอาจตอบโต้ด้วยการสร้างความไม่มั่นคงในเคาน์ตีแบบสุ่ม"
	# Note to spanish translators: please translate this as "Cazando a la Martes Foina", saying Garduña is too blatant.
 fp2_struggle.2010.t:0 "ล่ามาร์เทนบีช"
 fp2_struggle.2010.desc:0 "หลังจากเดินทางไปยัง [fp2_2009_involved_capital_county.GetNameNoTierNoTooltip] ข้าได้เข้าไปในโบสถ์ร้าง [fp2_2009_garduna_guild_master.GetNameNoTooltip] กำลังรอการมาถึงของข้าอยู่\n\n"[ROOT.Char.GetFirstNameNoTooltip] สินะ? [ROOT.Char.Custom('signature_weapon')] ของท่านบอกข้าว่าท่านไม่ได้มาที่นี่เพื่อเสนอข้อตกลง แต่หัวขโมยนั้นใกล้เคียงกับพ่อค้ามากกว่าทหาร เราทั้งคู่สามารถจากไปอย่างพึงพอใจได้หากท่านจ่ายเงินให้ข้า แล้วข้าก็จะไม่มีธุระใดๆ กับ [ROOT.Char.GetPrimaryTitle.GetTierAsNameNoTooltip] ของท่านอีก""
 fp2_struggle.2010.b:0 "เตรียมตัวถูกตัดหัวเสียเถิด เจ้างูพิษ!"
 fp2_struggle.2010.c:0 "จ่ายค่าคุ้มครองฟังดูดีกว่าการต่อสู้..."
 fp2_struggle.2011.desc:0 "เมื่อ [fp2_2009_garduna_guild_master.GetFirstName] ถูกปราบลง กิลด์โจรและปฏิบัติการของพวกมันก็อ่อนแอลง"
 fp2_struggle.2011.a:0 "เป็น [Select_CString(ROOT.Char.IsFemale,'ราชินี','ราชา')] #DIE2 แห่งหัวขโมย#! นี่มันดีจริงๆ!"
 fp2_struggle.2012.t:0 "รายงานจากแหล่งข่าวท้องถิ่น:"
 fp2_struggle.2012.desc:0 "มีกลุ่มโจรโหดเหี้ยมกำลังปล้นสะดมใน [fp2_2009_involved_capital_county.GetNameNoTierNoTooltip] เป็นที่ชัดเจนว่ามีใครบางคนจงใจให้ทุนแก่เหล่าอาชญากรเหล่านี้เพื่อต่อต้านเรา ในตอนนี้ เป็นการฉลาดที่จะมอบหมายให้จอมทัพไปรักษาความปลอดภัยในภูมิภาค"
 fp2_struggle.2012.a:0 "ใครก็ตามที่ทำ เช่นนี้กำลังเล่นสกปรก!"
 fp2_struggle.2012.t.alt:1 "[fp2_2012_sender.Custom2('AppropriateGreetingPositive', ROOT.Char )]"
 fp2_struggle.2012.desc.alt:0 "พร้อมกับจดหมายฉบับนี้ ท่านจะพบศีรษะที่ถูกตัดของหนึ่งในหัวขโมยที่ก่อความวุ่นวายในดินแดนของเราทั้งสอง ข้าได้จัดการประหาร[fp2_2009_garduna_young_thief.GetHerHim]และแจ้งให้กองทหารรักษาการณ์ของท่านใน [fp2_2009_involved_capital_county.GetNameNoTier] ทราบถึงตำแหน่งที่พรรคพวก[fp2_2009_garduna_young_thief.GetHerHis]ซ่อนตัวอยู่"
 fp2_struggle.2012.a.alt:0 "[fp2_2009_has_gifted_head.GetFirstNameNoTooltip] นำของขวัญอันน่าพึงพอใจมาให้ข้า!"
 fp2_struggle.2013.t:0 "ความลับสู่เสรีภาพ"
 fp2_struggle.2013.desc:0 "[fp2_2013_prisoner_with_a_secret.GetFullNameRegnal] เป็นนักโทษภายใต้ความเมตตาของข้า ด้วยตระหนักดีถึงเรื่องนั้น [fp2_2013_prisoner_with_a_secret.GetSheHe]จึงได้ยื่นคำร้องขออย่างสิ้นหวัง... "ข้าจะบอกความลับของ [fp2_2013_secret_owner.GetFullNameRegnal] แก่ท่าน หากท่านปล่อยข้าไป""
 fp2_struggle.2013.a:0 "บอกความลับแก่ข้า แล้วเจ้าจะเป็นอิสระ [fp2_2013_prisoner_with_a_secret.GetWomanMan]"
 fp2_struggle.2013.a.a:0 "ท่านจะได้เรียนรู้ความลับ #TUT_KW ของ [fp2_2013_secret_owner.GetFirstName]#!"
 fp2_struggle.2013.b:0 "เหตุใดต้องต่อรอง ในเมื่อข้าทรมานเจ้าได้?"
 fp2_struggle.2013.b.b:0 "[fp2_2013_prisoner_with_a_secret.GetFirstNameNoTooltip] ต่อต้านการทรมาน"
 fp2_struggle.2013.c:0 "เจ้างูพิษทรยศ! [fp2_2013_secret_owner.GetFirstNameNoTooltip] จะต้องได้ยินเรื่องนี้!"
 fp2_struggle.2013.c.desc:0 "โดยไม่ได้เรียนรู้ความลับ ท่านตัดสินใจนำตัว [fp2_2013_prisoner_with_a_secret.GetFirstNameNoTooltip] ไปต่อหน้า [fp2_2013_secret_owner.GetFirstNameNoTooltip] เพื่อลงโทษการทรยศ[fp2_2013_prisoner_with_a_secret.GetHerHis]"
 fp2_struggle.2013.c.a:0 "[fp2_2013_secret_owner.GetFirstName] จะตัดสินชะตากรรมของ [fp2_2013_prisoner_with_a_secret.GetFirstNameNoTooltip]"
 fp2_struggle.2013.d:0 "ข้าไม่ให้สัญญาใดๆ บอกข้ามา แล้วข้าอาจจะคิดดูทีหลัง..."
 fp2_struggle.2014.t:0 "ถึง [ROOT.Char.GetNameNoTooltip] ผู้ทรงธรรม:"
 fp2_struggle.2014.desc.start:0 "ขอบคุณที่ส่งตัว [fp2_2013_prisoner_with_a_secret.GetNameNoTooltip] คืนมาให้ข้า "
 fp2_struggle.2014.desc.light:0 "แต่ข้าไม่เชื่อว่า[fp2_2013_prisoner_with_a_secret.GetSheHe]ได้ทำสิ่งใดที่สมควรแก่การลงโทษ ข้าได้ปล่อย[fp2_2013_prisoner_with_a_secret.GetHerHim]ไปโดยไม่ได้รับอันตราย$fp2_struggle.2014.desc.end$"
 fp2_struggle.2014.desc.heavy.start:0 "ข้าเข้าใจว่าไอ้หมูสกปรกนี่พยายามขายความลับของข้าเพื่อรักษาหนังหัว[fp2_2013_prisoner_with_a_secret.GetHerHis]ไว้"
 fp2_struggle.2014.desc.heavy.outcome.prison:0 "$fp2_struggle.2014.desc.heavy.start$ ข้าจะ ทำให้แน่ใจว่าทั้ง[fp2_2013_prisoner_with_a_secret.GetSheHe]และความลับจะไม่ได้เห็นแสงตะวันอีกเลย $fp2_struggle.2014.desc.end$"
 fp2_struggle.2014.desc.heavy.outcome.death:0 "$fp2_struggle.2014.desc.heavy.start$ แทนที่จะเป็น เช่นนั้น ข้าได้สั่งให้เพชฌฆาตของข้าลอกมันออกทั้งหมด! $fp2_struggle.2014.desc.end$"
 fp2_struggle.2014.desc.end:0 "\n\nท่านทำดีต่อข้า ข้าจะไม่ลืมบุญคุณครั้งนี้ ขอบคุณ"
 fp2_struggle.2014.b:0 "น่าเสียดายที่ [fp2_2013_prisoner_with_a_secret.GetFirstNameNoTooltip] ไม่ได้ถูกประหาร แต่อย่างน้อยข้าก็ได้รับความโปรดปราน"
 fp2_struggle.2015.t:0 "จดหมายที่ด้านหลัง"
 fp2_struggle.2015.desc:0 "ขณะเดินผ่านราชสำนัก ข้าสังเกตเห็นใบหน้าที่ไม่คุ้นเคยเข้ามาหา "ข้า แต่เจ้าเหนือหัวผู้ [ROOT.Char.Custom('ComplimentAdjective')] ที่สุดของข้า ข้าคือ [fp2_struggle_2015_peasant_to_murder.GetFirstName] อดีตข้าราชสำนักของ [fp2_struggle_2015_murder_requester_vassal.Custom2('YourCharacterIntroductionNoComma', ROOT.Char)] [fp2_struggle_2015_murder_requester_vassal.GetSheHe|U]ได้ขอให้ข้ามาปรากฏตัวต่อหน้าท่านและเข้าร่วมในราชสำนักของท่าน [fp2_struggle_2015_murder_requester_vassal.GetSheHe|U]ยังได้มอบจดหมายแนะนำตัวให้ข้า ซึ่งมีเพียงท่านเท่านั้นที่อ่านได้" จากนั้น [fp2_struggle_2015_peasant_to_murder.GetSheHe] ก็ยื่นจดหมายปิดผนึกให้ข้า\n\nหลังจากทำลายผนึก จดหมายเขียนไว้เพียงว่า: "#EMP ถึง [ROOT.Char.GetFirstName] โปรดลอบสังหารผู้ถือจดหมายฉบับนี้#! - [fp2_struggle_2015_murder_requester_vassal.GetFirstNameNoTooltip]""
 fp2_struggle.2015.a:0 ""ยินดีต้อนรับ! มา ดื่ม #DIE2 (ยาพิษ)#! [ROOT.Char.Custom('GetExpensiveDrink_Singular')] สักหน่อย""
 fp2_struggle.2015.a.a:0 "ท่านวางยาพิษผิดพลาด"
 fp2_struggle.2015.a.murder_scheme:0 "[fp2_struggle_2015_murder_requester_vassal.GetTitledFirstName] จะพยายามสังหาร [fp2_struggle_2015_peasant_to_murder.GetFirstName] ต่อไป"
 fp2_struggle.2015.a.b:0 "ข้าราชสำนักถูกวางยาพิษ!"
 fp2_struggle.2015.b:0 "ไม่สนใจจดหมายและยอมรับ [fp2_struggle_2015_peasant_to_murder.GetFirstNameNoTooltip] เข้าสู่ราชสำนักของท่าน"
 fp2_struggle.2015.c:0 ""เจ้าถูกหมายหัวแล้ว หนีไปเสีย趁ยังทำได้""
 fp2_struggle.2015.c.a:0 "[fp2_struggle_2015_peasant_to_murder.GetFirstNameNoTooltip] "ล้มเหลวอย่างลึกลับ" ในการหลบหนี"
 fp2_struggle.2015.c.b:0 "[fp2_struggle_2015_murder_requester_vassal.GetFirstNameNoTooltip] ถูกหลอกให้คิดว่า [fp2_struggle_2015_peasant_to_murder.GetFirstNameNoTooltip] ตายแล้ว"
 fp2_struggle.2016.t:0 "ถึง [ROOT.Char.GetFirstNameNoTooltip] ผู้โง่เขลา,"
 fp2_struggle.2016.desc:0 "ข้ารู้ว่าเจ้าได้สังหาร #DIE2 (ตามคำขอของข้า)#! ทูตผู้เป็นที่รักยิ่งของข้า [fp2_struggle_2015_peasant_to_murder.GetFirstNameNoTooltip] แต่ไม่ต้องกังวล ในฐานะข้าในบังคับผู้ภักดีของเจ้า ข้าจะเก็บความลับนี้ไว้ระหว่างเรา ตราบใดที่เรายังคงช่วยเหลือ ซึ่งกันและกัน ดั่ง เช่นมิตรสหายที่ดีที่เราเป็น"
 fp2_struggle.2016.a:0 "ข้าถูกหลอก! เจ้า [fp2_struggle_2015_murder_requester_vassal.Custom2('InsultNoun', ROOT.Char)] นั่น!"
 fp2_struggle.2018.t:1 "หมากรุกเพื่อมิตรสหาย"
 fp2_struggle.2018.t.outcome.a:0 "สร้างมิตรภาพ"
 fp2_struggle.2018.t.outcome.b:0 "เพลิดเพลินกับมิตรสหาย"
 fp2_struggle.2018.t.outcome.c:0 "ช่วงเวลาที่ไม่น่าเพลิดเพลิน"
 fp2_struggle.2018.desc.desc_combat_clarification:0 "ในใจข้า ดาบของเราปะทะกัน การต่อสู้อันดุเดือดของการวิเคราะห์เชิงกลยุทธ์และความมุ่งมั่นอย่างแท้จริง\n\nเราเป็นเพียงแค่การเคลื่อนหมากบนกระดาน แต่สมาธิอันเข้มข้น ทำให้ห้องและกระดานหายไปในห้วงอากาศ เหลือเพียงเราในสนามรบแห่งจินตนาการของเรา เคลื่อนหมากทีละตาเข้าใกล้ชัยชนะมากขึ้นเรื่อยๆ ต่อสู้อย่างดุเดือดเพื่อเบี้ยทุกตัว...\n\n"
 fp2_struggle.2018.desc.desc_intro:0 "เมื่อนาทีกลายเป็นชั่วโมงและพลบค่ำส่งสัญญาณสิ้นสุดเวลาของเราด้วยกัน [fp2_2017_gamervassal.GetFirstNameNoTooltip] กล่าวว่า... "
 fp2_struggle.2018.desc.good_intro_match:0 ""อ่า ช่างเป็นการแข่งขันที่น่าพึงพอใจ!"
 fp2_struggle.2018.desc.bad_intro_match:0 ""อืม ช่างเป็นการแข่งขัน... ท่านควรฝึกฝนบ่อยขึ้นจริงๆ การเดินหมากของท่านเรียบง่ายและคาดเดาได้ ไม่มีความสุขเลยที่ต้องเล่นกับคู่ต่อสู้ที่ไม่สามารถป้องกันตัวเองได้ ""
 fp2_struggle.2018.desc.fought_hard:0 "$fp2_struggle.2018.desc.good_intro_match$ ท่านสู้สุดใจจริงๆ ข้าขอชื่นชม "
 fp2_struggle.2018.desc.was_creative:0 "$fp2_struggle.2018.desc.good_intro_match$ ท่าน ทำให้ข้าประหลาดใจด้วยการเปิดหมากฮิปโปโปเตมัสฝั่งกษัตริย์ ช่างเป็นการเคลื่อนไหวที่กล้าหาญเสียนี่กระไร! "
 fp2_struggle.2018.desc.match_end_win:0 "และท่านก็ชนะด้วย สมควรแล้ว! "
 fp2_struggle.2018.desc.match_end_loss:0 "แต่ในที่สุด ข้าก็ยังชนะ "
 fp2_struggle.2018.desc.match_end_loss_noticed:0 "ข้ายังคงชนะได้ แม้ว่าข้าจะรู้สึกราวกับว่านั่นเป็นแผนของท่านมาโดยตลอด "
 fp2_struggle.2018.desc.social_pre_intro:0 "เราใช้เวลาดื่มและพูดคุยกันในหลากหลายหัวข้อ ตั้งแต่เรื่องง่ายๆ ในหมู่บ้านใกล้เคียงไปจนถึงผลการดวลระหว่าง [ROOT.Char.Custom('KnightCulturePluralNoTooltipLowercase')] "
 fp2_struggle.2018.desc.social_pre_intro_crit:0 "[fp2_2017_gamervassal.GetFirstName] หลงใหลในการสนทนาอย่างยิ่งและมีส่วนร่วมทุกย่างก้าว พูดคุยในหัวข้อต่างๆ ด้วยความกระตือรือร้นอย่างยิ่ง"
 fp2_struggle.2018.desc.social_pre_intro_good:0 "[fp2_2017_gamervassal.GetFirstName] เพลิดเพลินกับการสนทนาและการต้อนรับอย่างเห็นได้ชัด\n\n"
 fp2_struggle.2018.desc.social_pre_intro_bad:0 "[fp2_2017_gamervassal.GetFirstName] รู้สึกเบื่อและใจลอยตลอดเวลา...\n\n"
 fp2_struggle.2018.desc.social_intro:0 ""ข้าคิดว่าข้าดื่มพอแล้ว "
 fp2_struggle.2018.desc.social_good:0 "[ROOT.Char.Custom('GetExpensiveDrink_Singular')] นั้นยอดเยี่ยมมาก ขอบคุณ "
 fp2_struggle.2018.desc.outcome_0:0 "ข้าสนุกมาก ข้าควรมาเยี่ยมท่านบ่อยขึ้น!""
 fp2_struggle.2018.desc.outcome_1:0 "มันสนุกดี บางทีข้าจะมาเยี่ยมอีกครั้งในบางเวลา""
 fp2_struggle.2018.desc.outcome_2:0 "ข้าควรจะไปแล้ว [SCOPE.sC('fp2_2017_gamervassal').Custom2('RelationToMe', SCOPE.sC('fp2_2017_questgiver'))] ของข้าคงคิดถึงข้า ลาก่อน [ROOT.Char.GetFirstNameNoTooltip]""
 fp2_struggle.2018.a:0 "สำเร็จ! ข้าเอาชนะใจ [fp2_2017_gamervassal.GetHerHim] ได้แล้ว!"
 fp2_struggle.2018.b:0 "เราไม่ได้กลายเป็นเพื่อนกันเสียทีเดียว แต่ก็สนุกดี!"
 fp2_struggle.2018.c:0 "เอ่อ นั่นไม่ค่อยดีเท่าไหร่..."
 fp2_struggle.2020.t:1 "Açò és or, xata!"
 fp2_struggle.2020.desc:0 "ขณะเดินทางผ่าน [fp2_2020_valencia.GetName] หญิงชาวนาคนหนึ่งยื่นนมสดชื่นให้ข้าหนึ่งแก้ว ซึ่งมีรสหวานกว่าสิ่งใดที่ข้าเคยลิ้มลอง "เครื่องดื่มอันน่าอัศจรรย์ที่เจ้ามอบให้ข้านี้คืออะไร?" ข้าถาม ซึ่งนางตอบว่า "นมจากอัลมอนด์ดิน"\n\nไม่มีผู้ใดต้านทานเสน่ห์ของเครื่องดื่มนี้ได้ในวันฤดูร้อน ไม่มีเด็กคนใดหลีกเลี่ยงการยิ้มได้เมื่อได้รับนมหนึ่งแก้ว และไม่มีชาวบาเลนเซียคนใดที่ไม่ชอบของหวานนี้ #EMP เครื่องดื่มนี้ไม่ใช่นม แต่มันคือทองคำ!#!"
 fp2_struggle.2020.a:0 ""จากนี้ไป [fp2_2020_valencia.GetNameNoTooltip] จะปลูกเฉพาะอัลมอนด์ดินเท่านั้น!""
 fp2_struggle.2020.a.desc:0 "ท่านบังคับให้ชาวนาปลูกเฉพาะอัลมอนด์ดิน สร้างผลิตภัณฑ์หรูหราสำหรับเมืองหลวงของท่าน"
 fp2_struggle.2020.b:0 ""เอาถังทั้งหมดของเจ้ามาให้ข้า นี่จะเป็นศูนย์กลางของงานเลี้ยงครั้งต่อไปของข้า!""
 fp2_struggle.2020.c:0 ""ข้าจะไม่ตกหลุมพรางของเครื่องดื่มนี้ ไปให้พ้น!""
 fp2_struggle.2020.c.desc:0 "ด้วยใจที่หนักอึ้ง ท่านกำจัดความปรารถนาในออร์ชาตา (horchata) ได้รับชื่อเสียงจากการต่อต้านสิ่งยั่วยวนอันยิ่งใหญ่" # Note: Horchata is the name of the drink.
 fp2_struggle.2020.d:0 "ให้ทุนสนับสนุนการปลูกอัลมอนด์ดินเพิ่มเติมทั่วทุ่งนา"
 fp2_struggle.2021.t:0 "การกลับมาของราชาแห่งหัวขโมย"
 fp2_struggle.2021.desc:0 ""สวัสดี [ROOT.Char.GetFirstName] ข้าพนันได้เลยว่าท่านไม่คาดคิดว่าจะได้เจอข้าอีกครั้ง "
 fp2_struggle.2021.desc.alt.cutout:0 "โดยเฉพาะหลังจากที่ท่านทำลายองค์กรของข้าเมื่อหลายปีก่อน แต่การทำลายบางสิ่งก็ง่ายพอๆ กับการประกอบมันกลับคืน และข้าไม่ต้องการเล่นไล่จับอีกต่อไป ให้ข้าเดินทางอย่างปลอดภัยไปยัง [fp2_2021_old_napoly.GetNameNoTier] แล้วท่านจะไม่ต้องเห็นข้าอีกเลย กิลด์จะถูกสร้างขึ้นใหม่ห่างไกลจากท่านและความร่ำรวยของท่าน""
 fp2_struggle.2021.desc.alt.paidoff:0 "โดยเฉพาะเมื่อเราทำข้อตกลงที่จะไม่รบกวนท่านอีกต่อไป แต่กระเป๋าของข้าเริ่มรู้สึกเบาเกินไปอีกครั้ง นี่อาจเป็นดินแดนที่อุดมสมบูรณ์สำหรับอาชญากรรม แต่ไม่ใช่สำหรับจัดตั้งองค์กร ข้าต้องการย้ายสายลับและตัวข้าไปยัง [fp2_2021_old_napoly.GetNameNoTier] ให้เราเดินทางอย่างปลอดภัยแล้วท่านจะไม่ต้องกังวลเกี่ยวกับเราอีกต่อไป""
 fp2_struggle.2021.desc.alt.work:0 "แต่ข้าค่อนข้างชอบทำงานกับท่านครั้งล่าสุด และข้าขาดแคลน [ROOT.Char.GetWomenMen] ที่ไว้ใจได้ ข้าต้องการวางมือตอนนี้ที่ข้าได้เปรียบ ท่านรับประกันการเดินทางที่ปลอดภัยให้ข้าไปยัง [fp2_2021_old_napoly.GetNameNoTier] ได้หรือไม่?""
 fp2_struggle.2021.desc.alt.behead:0 "ข้าไม่ได้มาที่นี่เพื่อแก้แค้นให้ [fp2_2009_garduna_young_thief.GetFirstName] แต่เพื่อวางมือ นั่นเป็นศีรษะที่มากเกินไปหนึ่งหัว และข้ารู้ดีเกินไปว่าศีรษะของข้าอาจเป็นรายต่อไป ให้ข้าเดินทางอย่างปลอดภัยเพื่อไปยัง [fp2_2021_old_napoly.GetNameNoTier] แล้วท่านจะไม่ได้เห็นข้าอีกเลย ไม่จำเป็นต้องให้การประชุมครั้งนี้จบลงด้วยการนองเลือด""
 fp2_struggle.2021.desc.outro:1 "[fp2_2009_garduna_guild_master.GetFullNameNicknamed] กล่าว ขณะที่ถือถุงเหรียญอย่างประหม่าในมือข้างหนึ่งและอาวุธซ่อนเร้นในอีกข้างหนึ่ง"
 fp2_struggle.2021.a:0 ""ดีมาก ข้าจะช่วยเจ้าเดินทางไปอิตาลี""
 fp2_struggle.2021.a.alt:0 ""แทนที่จะเป็น เช่นนั้น ทำไมไม่เพียงแค่วางมือไปอิตาลีเล่า?""
 fp2_struggle.2021.a.a:0 "[fp2_2009_garduna_guild_master.GetFirstName] จะออกเดินทางไปยัง [fp2_2021_old_napoly.GetName] และหายตัวไป"
 fp2_struggle.2021.b:0 ""อันที่จริง ทำไมเจ้าไม่เข้าร่วมกองทัพของข้าแทนเล่า?""
 fp2_struggle.2021.c:0 ""ฟังดูเหนื่อยหน่าย ทำไมไม่มาเป็นสายลับแทนอาชญากรเล่า?""
 fp2_struggle.2021.c.flavor:0 "ท่านเสนอเงินให้ [fp2_2009_garduna_guild_master.GetFirstNameNoTooltip] เพียงพอที่จะดำเนินการเครือข่ายสายลับ เพื่อให้พวกเขาสามารถค้นหาความลับในนามของท่านได้"
 fp2_struggle.2021.c.a:0 "เครือข่ายสายลับจะค้นหาและรายงานความลับได้สูงสุดสองเรื่องจากผู้ปกครองคนอื่นที่เกี่ยวข้องกับการต่อสู้"
 fp2_struggle.2021.c.spynet.a:0 "เครือข่ายสายลับพบความลับ:"
 fp2_struggle.2021.c.spynet.b:0 "เครือข่ายสายลับล้มเหลวในการค้นหาความลับ"
 fp2_struggle.2021.c.spynet.b.desc:0 "เครือข่ายสายลับที่ดำเนินการโดย [fp2_2009_garduna_guild_master.GetFirstName] ล้มเหลวในการค้นหาความลับที่เกี่ยวข้อง แต่หัวหน้าสายลับของท่านได้เรียนรู้มากมายจากประสบการณ์..."
 fp2_struggle.2021.d:0 ""ไม่ เจ้าจะหนีไปไม่ได้ในครั้งนี้! เตรียมตัว!""
 fp2_struggle.2021.d.alt:0 "เจ้าพูดถูก ศีรษะของเจ้า #EMP จะ#! เป็นรายต่อไป! #BER จงพินาศ!#!"
 fp2_struggle.2021.d.a:0 "สังหารศัตรูเก่า"
 fp2_struggle.2021.d.b:0 "@warning_icon! ท่านจะเข้าสู่การดวลถึงตายกับ [dueltarget.GetFirstName]"
 fp2_struggle.2023.t:0 "กษัตริย์สำหรับกวี"
 fp2_struggle.2023.desc:1 "ข้าอยู่ในกระโจม ณ ค่ายพักแรมที่ติดกับ [fp2_2023_foreign_king.GetPrimaryTitle.GetName] ได้รับมอบหมายให้ประเมินความตึงเครียดระหว่างอาณาจักรของเรา ทันใดนั้น [fp2_2023_enemy_knight.GetWomanMan] คนหนึ่งเข้ามาในกระโจม เรียกร้องขอพบ "ผู้บัญชาการคนใหม่" โดยสัญชาตญาณ ข้าก้าวไปข้างหน้า\n\n"เช่นนั้น ท่านคือผู้บัญชาการคนใหม่? ดีมาก เลือกการท้าทายมา ผู้แพ้จ่ายค่าเครื่องดื่มให้ค่ายอีกฝ่ายคืนนี้!" [fp2_2023_enemy_knight.GetFirstName] ผู้บัญชาการค่ายต่างแดนกล่าว โดยไม่รู้ว่าข้าคือ [ROOT.Char.GetFirstNameRegnal] และไม่ใช่เพียงผู้นำทางทหาร"
 fp2_struggle.2023.a.desc:0 "ท่านบอกทหารว่าท่านเป็นใคร ยุติงานเลี้ยง และสั่งให้กองทหารของท่านทำท่าสควอทเป็นการลงโทษฐานสังสรรค์กับศัตรูขณะปฏิบัติหน้าที่"
 fp2_struggle.2023.a.a:1 ""เจ้าโง่ ข้าคือ [ROOT.GetCharacter.GetFullNameNoTooltip]!""
 fp2_struggle.2023.b:0 ""จงนำบทกวีที่ร้ายกาจที่สุดเกี่ยวกับเจ้าเหนือหัวของ แต่ละฝ่ายมา!""
 fp2_struggle.2023.b.desc:0 "ท่านทั้งสอง แต่งบทกวีเขียนถึงความเลวร้ายของผู้ปกครองอีกฝ่าย จากนั้นอ่านออกเสียงให้ฝูงชนที่ร่าเริงฟัง"
 fp2_struggle.2023.b.a:0 "ท่านเยาะเย้ย [fp2_2023_foreign_king.GetFirstNameRegnal]"
 fp2_struggle.2023.b.b:0 "บทกวีของท่านถูกเยาะเย้ย"
 fp2_struggle.2023.c:0 ""มาตัดสินกันด้วยการประลองฉันมิตร เตรียมพร้อม!""
 fp2_struggle.2023.c.desc:0 "ท่านเข้าร่วมการประลองที่ไม่ถึงตายกับผู้บัญชาการศัตรูเพื่อตัดสินว่าใครจะจ่ายค่าเครื่องดื่มหลังจากนั้น"
 fp2_struggle.2023.c.exptooltip:0 "ท่านมีโอกาสได้รับค่าประสบการณ์ [martial_lifestyle|E] เพิ่มเติมจากการประลอง"
 fp2_struggle.2023.c.a:0 "เอาชนะผู้บัญชาการศัตรู"
 fp2_struggle.2023.c.b:0 "พ่ายแพ้แก่ [fp2_2023_enemy_knight.GetNameNoTooltip]"
 fp2_struggle.2023.d:0 ""เหตุใดต้องรอจนถึงโรงเตี๊ยม? มาแข่งขันกันด้วยการดื่มเอลเถิด!""
