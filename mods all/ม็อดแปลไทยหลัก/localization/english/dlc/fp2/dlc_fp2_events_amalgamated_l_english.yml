 fp2_struggle.2025.t:0 "ทุกข์ เพราะความสำเร็จ"
 fp2_struggle.2025.desc:1 "อาบไล้แสงแดดอันอบอุ่นคือผืนดินที่มีทุ่งนาไม่ได้รับการดูแลและอาคารที่พังทลาย ลมกระซิบเสียงคร่ำครวญแห่งความโดดเดี่ยวผ่านก้อนหินที่ผุพัง นี่เป็นหนึ่งในหลายหมู่บ้าน เช่นนี้ใน [fp2_2025_razed_land.GetNameNoTier] ผู้อยู่อาศัยที่จากไปเมื่อสงครามมาถึงไม่เคยกลับมาเมื่อสงครามสิ้นสุดลงและธงของ [ROOT.Char.GetPrimaryTitle.GetName] โบกสะบัดอยู่เหนือมัน\n\n"งดงาม ใช่หรือไม่?" [ROOT.Char.Custom2('RelationToMe', fp2_2025_marshal)] [fp2_2025_marshal.GetFirstName] ของข้าถาม "นี่คือดินแดนอิสระ เหมาะแก่การฟื้นฟู เราสามารถสร้างอนุสาวรีย์แห่งความสำเร็จของเราได้ที่นี่""
 fp2_struggle.2025.a:0 "ราษฎรใหม่ของเราต้องการเวลาไว้ทุกข์ ไม่ใช่ต่อสู้..."
 fp2_struggle.2025.b:0 "ความคิดยอดเยี่ยม! ที่นี่จะตั้งตระหง่านด้วยอนุสาวรีย์ที่ยิ่งใหญ่ที่สุด!"
 fp2_struggle.2025.c:0 "เราจะฟื้นฟูเมืองนี้ให้กลับเป็นเหมือนเดิม"
 fp2_struggle.2025.d:0 "ข้าจะตั้งด่านชั่วคราวที่นี่เพื่อปกป้องดินแดนที่ได้มาใหม่"
