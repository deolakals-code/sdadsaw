 reading_avicenna_toast.failure:0 "ท่านอาจเข้าใจบางอย่างผิดไป..."
 reading_hippocrates_toast.success:0 "ท่านอ่านผลงานทั้งหมดของกาเลน"
 reading_hippocrates_toast.failure:0 "ทำไมภาษากรีกถึงยาก เช่นนี้?"
 rolling_in_filth_toast:0 "ราชสำนักของท่านเป็นอันตรายต่อสุขภาพ"

 fp2_struggle.1002.t:0 "ความก้าวหน้าของชาว [xenophilic_culture.GetNameNoTooltip]"
 fp2_struggle.1002.desc_early_golden_age:0 "นักปราชญ์ชาว [xenophilic_culture.GetNameNoTooltip] เพิ่งมีความก้าวหน้าอย่างมากในความรู้ทางการแพทย์ แต่พหูสูต [great_physician.GetFirstName] ถูกเนรเทศออกจากราชสำนักของ [neighboring_ruler.GetTitledFirstNamePossessive] [ROOT.GetCharacter.Custom2('RelationToMeShort', SCOPE.sC('neighboring_ruler'))] ของข้า เนื่องจาก #italic บทกวีและความผิดพลาด#! และกำลังมองหางานใหม่ \n\n"
 fp2_struggle.1002.desc_late_golden_age:0 "นักปราชญ์ชาว [xenophilic_culture.GetNameNoTooltip] ได้อุทิศตนให้กับการศึกษาด้านการแพทย์มานานแล้ว บัดนี้พหูสูต [great_physician.GetFirstName] กำลังมองหาที่จะเข้าร่วมราชสำนักของข้า แต่ [great_physician.GetSheHe] เพิ่งถูกเนรเทศออกจากราชสำนักของ [neighboring_ruler.GetTitledFirstNamePossessive] [ROOT.GetCharacter.Custom2('RelationToMeShort', SCOPE.sC('neighboring_ruler'))] ของข้า เนื่องจากการละเมิดที่ไม่เปิดเผย \n\n"
 fp2_struggle.1002.desc_post_golden_age_christian:0 "แม้ว่าบุคคล เช่น อเวร์โรเอส และ อัลบูคาซิส จะเสียชีวิตไปนานแล้ว แพทย์ชาว [xenophilic_culture.GetNameNoTooltip] ยังคงมีความรู้เป็นเลิศ บัดนี้พหูสูต [great_physician.GetFirstName] กำลังมองหางานใหม่ หลังจากถูกเนรเทศออกจากราชสำนักของ [neighboring_ruler.GetTitledFirstNamePossessive] [ROOT.GetCharacter.Custom2('RelationToMeShort', SCOPE.sC('neighboring_ruler'))] ของข้า เนื่องจากการละเมิดที่ไม่เปิดเผย \n\n"
 fp2_struggle.1002.desc_post_golden_age_unchristian:0 "แม้ว่าบุคคล เช่น อิบนุ รุชด์ และ อัล-ซาห์ราวี จะเสียชีวิตไปนานแล้ว แพทย์ชาว [xenophilic_culture.GetNameNoTooltip] ยังคงมีความรู้เป็นเลิศ บัดนี้พหูสูต [great_physician.GetFirstName] กำลังมองหางานใหม่ หลังจากถูกเนรเทศออกจากราชสำนักของ [neighboring_ruler.GetTitledFirstNamePossessive] [ROOT.GetCharacter.Custom2('RelationToMeShort', SCOPE.sC('neighboring_ruler'))] ของข้า เนื่องจากการละเมิดที่ไม่เปิดเผย \n\n"
 fp2_struggle.1002.desc_albucasis:0 ""แม้ทักษะของข้าจะพอประมาณ" เขากล่าว "ข้าเคยช่วยชีวิตทาสหญิงคนหนึ่งที่เชือดคอตัวเอง โดยเหลือเพียงเสียงแหบเล็กน้อยหลังจากนั้น และข้าอยากจะขอให้ท่านเปลี่ยนแปลงสุขอนามัยบางอย่าง..." \n\n"
 fp2_struggle.1002.desc_avenzoar:0 ""ข้าประกอบวิชาชีพแพทย์มาตลอดชีวิต" เขากล่าว "และเขียนตำราเกี่ยวกับระเบียบการเพื่อชีวิตที่มีสุขภาพดี แต่ข้าเป็นศัตรูตัวฉกาจของความเชื่องมงายและยารักษาโรคปลอมที่แม่มดและนักโหราศาสตร์เร่ขาย ดังนั้นข้าจึงอยากขอให้ท่านสั่งห้ามสิ่งเหล่านั้น..." \n\n"
 fp2_struggle.1002.desc_tufail:0 ""ข้าศึกษาทั้งสวรรค์ จิตใจ และความเจ็บป่วยทางกาย" [great_physician.GetSheHe] กล่าว "แต่ข้าเป็นผู้สนับสนุนประโยชน์ของการศึกษา #italic ร่างกายมนุษย์หลังความตาย#!... ท่านพอจะให้โอกาสข้าในการดำเนินการเรื่องนี้ได้หรือไม่?" \n\n"
 fp2_struggle.1002.desc_no_historical_physician_early:0 ""ข้าได้เรียนรู้มากมาย" [great_physician.GetSheHe] กล่าว "จากผลงานของคนโบราณ ทว่าข้าได้กอบกู้ความรู้ของพวกเขาจากห้วงเหวแห่งความเยิ่นเย้อ และสามารถใช้มันเพื่อประโยชน์ของท่านได้" \n\n"
 fp2_struggle.1002.desc_no_historical_physician_late:0 ""ข้าได้เรียนรู้มากมาย" [great_physician.GetSheHe] กล่าว "จากผลงานของอัล-ซาห์ราวีและอิบนุ ซีนา ทว่าข้าได้ปรับปรุงเทคนิคของพวกเขา ข้าสามารถลอกต้อกระจกและฝี และรักษาโรคที่เคยคิดว่ารักษาไม่ได้" \n\n"
 fp2_struggle.1002.desc_has_physician_and_is_christian:0 "แพทย์ประจำตัวคนปัจจุบันของข้า [scoped_physician.GetTitledFirstName] กระตุ้นข้าไม่ให้แทนที่ [scoped_physician.GetHerHim] ด้วยคนนอกศาสนานี้"
 fp2_struggle.1002.desc_has_physician_but_not_christian:0 "แพทย์ประจำตัวคนปัจจุบันของข้า [scoped_physician.GetTitledFirstName] กระตุ้นข้าไม่ให้แทนที่ [scoped_physician.GetHerHim] ด้วยคนประหลาดผู้นี้"
 fp2_struggle.1002.desc_has_no_physician_but_is_christian:0 "ข้าราชบริพารบางคนกระตุ้นข้าไม่ให้ข้องเกี่ยวกับคนนอกศาสนานี้"
 fp2_struggle.1002.desc_has_no_physician:0 "ข้าควรเสนอตำแหน่งในราชสำนักให้ [great_physician.GetWomanMan] ผู้นี้หรือไม่?"
 fp2_struggle.1002.a:0 "ข้าต้องการแพทย์คนใหม่..."
 fp2_struggle.1002.b:1 "ข้าสามารถซื้อตำราและเรียนรู้การแพทย์ด้วยตนเองได้"
 fp2_struggle.1002.b.tt:0 "ท่านพยายามเรียนรู้จากตำราการแพทย์อันยิ่งใหญ่"
 fp2_struggle.1002.c:0 "ข้าต้องการเจ้าไปทำไม? ข้าอ่านภาษากรีกเองได้"
 fp2_struggle.1002.c.tt:1 "ท่านซื้อผลงานของกาเลนและพยายามอ่าน"
 fp2_struggle.1002.d:0 "ข้าจะส่งเจ้ากลับไปหา [neighboring_ruler.GetTitledFirstNameNoTooltip]...ในโซ่ตรวน"
 fp2_struggle.1002.e:0 "สุขภาพของข้าดีอยู่แล้ว ขอบใจ"
 fp2_struggle.1002.f:0 "ไปให้พ้น นวัตกรรมควรมาจากพระเจ้าเท่านั้น"
 fp2_struggle.1002.physicianleaves:0 "[great_physician.GetFirstName] แสวงหางานที่อื่น"
 fp2_struggle.1001.physician_imprisoned:0 "[great_physician.GetFirstName] ถูกจองจำโดย [neighboring_ruler.GetName] ด้วยเหตุผลบางประการ" # Assuming this key belongs to event 1002

 fp2_struggle.1010.t:0 "จิตวิญญาณเหล็กกล้า"
 fp2_struggle.1010.desc:1 "[great_swordsmith.GetWomanMan] นามว่า [great_swordsmith.GetName] ได้มาถึงราชสำนักของข้า อ้างตนว่าเป็นสุดยอดช่างตีเหล็กผู้เดินทางมาไกลแสนไกล\n\n"[ROOT.Char.Custom('FormOfAddressForLiege')|U]" [great_swordsmith.GetSheHe] กล่าว "ตระกูลของข้าเป็นช่างตีดาบใน [toledo_holding.GetNameNoTierNoTooltip] มาตั้งแต่โบราณกาล และครั้งหนึ่งเคยทำ #italic falcatas#! ให้แก่กองทัพคาร์เธจ ไม่มีโลหะผสมใดจะแข็งแกร่งเท่ากับสิ่งที่ทำในไอบีเรีย และข้าสามารถ ทำให้มันสมบูรณ์แบบได้ ข้าสามารถสร้างอาวุธที่ดีที่สุดในโลก แต่เพื่อเป็นการตอบแทน ท่านต้องมอบคำสั่งบัญชาการสมาคมช่างตีเหล็กใน [blacksmith_county.GetNameNoTierNoTooltip] ให้ข้า แล้วพวกเขาจะได้เห็นว่าข้าเก่งกว่าพวกเขาทั้งหมดมาโดยตลอด!""
 fp2_struggle.1010.a:1 "ไม่ เจ้าจักต้องทำงานร่วมกับสมาคม เพื่อประโยชน์ของเราทุกคน"
 fp2_struggle.1010.b:1 "ไม่ว่าเจ้าจะมีความรู้ใด ข้าจะดึงมันออกมา..."
 fp2_struggle.1010.c:1 "เจ้าจักได้มัน หากเจ้าตีดาบให้กองทัพของข้า"
 fp2_struggle.1010.d:1 "ตีดาบที่ดีที่สุดของไอบีเรียให้ข้า แล้วสมาคมจะเป็นของเจ้า"
 fp2_struggle.1010.e:0 "ข้าจะไม่ ทำให้สมาคมโกรธเคืองเพื่อความทะนงตนของเจ้า"
 fp2_struggle.1010.smithgoesaway:1 "[great_swordsmith.GetNameNoTooltip] ไปรับตำแหน่งบัญชาการสมาคมช่างตีเหล็ก"
 fp2_struggle.1010.paranoid_rivals:1 "การติดอาวุธให้ทหารของท่านอาจ ทำให้ผู้ปกครองเพื่อนบ้านบางคนกังวล"
 fp2_struggle.1010.smithmakesweapon:1 "[great_swordsmith.GetNameNoTooltip] พักอยู่ในราชสำนักของท่านขณะตีดาบที่ท่านร้องขอ"
 fp2_struggle.1010.swordsmith_imprisoned:0 "ท่านจองจำและทรมาน [great_swordsmith.GetNameNoTooltip] เพื่อเรียนรู้ความลับของเขา"
 fp2_struggle.1010.compassionate_courtiers:0 "ไม่ใช่ข้าราชบริพารทุกคนของท่านที่จะเห็นด้วยกับเรื่องนี้"
 toledo_compromise_flavor:0 "ท่านบังคับให้เกิดการประนีประนอมระหว่าง [great_swordsmith.GetNameNoTooltip] และสมาคม"
 fp2_struggle.1010.swordsmith_leaves:0 "[great_swordsmith.GetNameNoTooltip] ไปยังราชสำนักอื่น"

 
 fp2_struggle.1011.t:1 ""ดาบแห่ง [blacksmith_county.GetNameNoTierNoTooltip]""
 fp2_struggle.1011.desc:1 ""เสร็จแล้ว" [great_swordsmith.GetName] กล่าว แต่ดูเหนื่อยล้าอย่างประหลาด\n\n"อาจเป็นไปได้ว่าวิญญาณบรรพบุรุษของข้านำทางข้าในการตีดาบนี้ เพราะมันคือดาบที่ดีที่สุดที่ข้าเคยสร้างมา ข้าจะไม่มีวันสร้างดาบ เช่นนี้ได้อีก และจะไม่มีใครในดินแดนนี้ทำได้ เช่นกัน เพราะความลับในการสร้างมัน ข้าจะนำติดตัวไปสู่หลุมศพ ข้าจะไปเดี๋ยวนี้ และอ้างสิทธิ์ในสมาคมที่ท่านสัญญากับข้า แม้ว่าชัยชนะนั้นจะรู้สึกว่างเปล่าอย่างประหลาดก็ตาม ถึงกระนั้น ท่านต้องตั้งชื่อดาบที่ข้าตีให้ท่าน""
 fp2_struggle.1011.a:1 "#italic มาร์ติเอลโล#!, ค้อน"
 fp2_struggle.1011.b:0 "#italic ติเนียบรา#!, ความมืด"
 fp2_struggle.1011.c:0 "#italic เวอร์เมโฮ#!, สีแดง"
 fp2_struggle.1011.d:0 "#italic ฮาร์กอนซา#!, ดั่งอัญมณีสีน้ำเงิน"
 fp2_struggle.1011.e:0 "#italic ซูเฮล#!, ผู้รุ่งโรจน์"
 fp2_struggle.1011.f:0 "#italic อัล-บัตตาร์#!, ผู้ตัด"
 fp2_struggle.1011.g:0 "#italic กาซีบ#!, แห่งด้ามจับอันแข็งแกร่ง"
 fp2_struggle.1011.h:0 "#italic ซูมูร์รุด#!, ดั่งมรกตอันเจิดจ้า"
 fp2_struggle.1011.i:0 "#italic ออร์ตซี#!, ดั่งสายฟ้า"
 fp2_struggle.1011.j:0 "#italic กาอูเอโก#!, วิญญาณแห่งราตรี"
 fp2_struggle.1011.k:0 "#italic กอร์รี#!, สีแดง"
 fp2_struggle.1011.l:0 "#italic ไอซ์โตโต#!, มีดเล่มน้อย"
 fp2_struggle.1011.m:0 "#italic เอสเครมิเร#!, นักดาบ"
 fp2_struggle.1011.n:0 "#italic โฟลยา#!, ใบไม้"
 fp2_struggle.1011.o:0 "#italic โปรเอซา#!, ความกล้าหาญ"
 fp2_struggle.1011.p:0 "#italic เตรบัลยาร์#!, ผู้ทรมาน"
 fp2_struggle.1011.q:0 "#italic ซูแฟกซ์#!, ดั่งวีรบุรุษผู้ยิ่งใหญ่ในสมัยโบราณ"
 fp2_struggle.1011.r:0 "#italic ทูเมลลัลต์#!, สีขาว"
 fp2_struggle.1011.s:0 "#italic อายูกู#!, แอก"
 fp2_struggle.1011.u:0 "ก็ต้อง #italic จิตวิญญาณเหล็กกล้า#! แน่นอน"
 fp2_struggle.1011.v:0 "ข้าค่อนข้างชอบ #italic มิสเซิลโท#!..."
 fp2_struggle.1011.w:0 "#italic ดาบผ่ามัวร์#, จะเป็นอะไรได้อีก?"
 fp2_struggle.1011.x:0 "#italic ดาบผู้ชิงบัลลังก์#! ดูจะเหมาะสม เมื่อพิจารณาถึงสิ่งที่เราทำกับสมาคม..."
 fp2_struggle.1011.swordsmith_leaves:0 "เมื่องานของเขาเสร็จสิ้น [great_swordsmith.GetName] ก็ออกจากราชสำนักของท่าน"
