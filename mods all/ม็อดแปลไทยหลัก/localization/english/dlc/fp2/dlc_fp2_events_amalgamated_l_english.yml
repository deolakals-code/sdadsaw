 awesome_toledo_sword_name:1 "ดาบของ [great_swordsmith.GetTitledFirstNamePossessiveNoTooltip]"
 awesome_toledo_sword_desc:0 "ดาบเล่มนี้เป็นผลงานชิ้นเอกของช่างตีเหล็ก [great_swordsmith.GetName] แห่ง [toledo_county.GetNameNoTierNoTooltip] ตีขึ้นโดยใช้เทคนิคลับที่ [great_swordsmith.GetSheHe] นำติดตัวไปสู่หลุมศพ [great_swordsmith.GetWomanMan] ผู้ปราดเปรื่อง แต่หยิ่งทะนง ว่ากันว่า [great_swordsmith.GetSheHe] ได้หล่อหลอมส่วนหนึ่งของจิตวิญญาณของ [great_swordsmith.GetHerHis] ลงในดาบ และแท้จริงแล้ว ดูเหมือนว่ามันจะมอบเจตจำนงเหล็กกล้าให้แก่ผู้ถือครอง"

 fp2_struggle.1012.t:1 "ผลงานชิ้นเอก"
 fp2_struggle.1012.desc:1 """เสร็จแล้ว" [great_swordsmith.GetName] กล่าว\n\n"นี่คือดาบที่ข้าสัญญาไว้กับท่าน หนึ่งในผลงานที่ดีที่สุดของข้า ใบดาบทำจากโลหะผสมที่ดีที่สุดเท่าที่จะจินตนาการได้ ซึ่งมีเพียงในไอบีเรียเท่านั้นที่ทำได้ มันมี #italic จิตวิญญาณเหล็กกล้า#! อย่างแท้จริง ดั่งที่พวกเขากล่าวกัน เป็นดาบที่คู่ควรกับ [Select_CString(ROOT.Char.IsFemale,'นายหญิงผู้สูงศักดิ์','นายท่านผู้ยิ่งใหญ่')] เช่นท่าน"""
 fp2_struggle.1012.a:0 "มัน...งดงามยิ่งนัก เจ้าไปโดยสันติเถิด "
 fp2_struggle.1012.b:0 "ยอดเยี่ยม ข้าไม่อาจโน้มน้าวให้เจ้าอยู่รับใช้ข้าได้หรือ?"
 fp2_struggle.1012.swordsmith_leaves:1 "เมื่อทำงานของ [great_swordsmith.GetHerHis] เสร็จสิ้น [great_swordsmith.GetName] ก็จากไปเพื่อรับตำแหน่งบัญชาการสมาคมช่างตีเหล็กตามที่ท่านสัญญาไว้"
 fp2_struggle.1012_swordsmith_stays:1 "[great_swordsmith.GetName] พักอยู่ในราชสำนักของท่าน"

 toledo_sword_name:0 "ดาบโตเลโด"
 toledo_sword_desc:0 "ดาบเล่มนี้เป็นผลงานชิ้นเอกของเหล็กกล้าโตเลโด แข็งแกร่งและทนทานเป็นพิเศษ มีจารึกเล็กๆ ใกล้โคนดาบระบุว่าตีขึ้นโดย #italic ช่างตีเหล็กผู้ยิ่งใหญ่#! [great_swordsmith.GetName] ใน [blacksmith_county.GetNameNoTierNoTooltip]"

 fp2_struggle.1050.t:0 "ฝันถึงความพินาศ"
 fp2_struggle.1050.desc_opening:1 "[visionary_spouse.GetTitledFirstName] มาหาข้าในความมืดมิดยามค่ำคืน ตัวร้อนและซีดเซียว "ข้าฝัน" [visionary_spouse.GetSheHe] กล่าว "ว่าข้าพบตัวเองอยู่ในทุ่งแห่งความตาย""
 fp2_struggle.1050.desc_christian:0 "เมืองของเราถูกทำลาย หอคอยโบสถ์ของเราพังทลาย ผู้คนของเราถูกเหยียบย่ำในกองเลือดของตนเอง"
 fp2_struggle.1050.desc_islamic:0 "ห้องสมุดของเราถูกเผา หออะซานของเราล้มลง พี่น้องของเราถูกตรึงกางเขน ถูกรุมทึ้งโดยนกกินซาก"
 fp2_struggle.1050.desc_rampaging_barbarian_heathen:0 "บ้านของเราถูกเผา ศิลาจารึกของเราล้มลง นักรบของเราถูกสังหารโดยปราศจากเกียรติยศหรือศักดิ์ศรี"
 fp2_struggle.1050.desc_non_barbarian_heathen:0 "เมืองของเราถูกทำลาย วิหารของเราถูกเผา ผู้คนของเราถูกสังหารหรือลากตัวไปสู่ชะตากรรมที่ไม่รู้จัก"
 fp2_struggle.1050.desc_islamic_heritage:0 "ข้าเห็นความพินาศสิ้นเชิงของทุกสิ่งที่เราสร้างขึ้นนับตั้งแต่บรรพบุรุษของเรามาถึงดินแดนนี้"\n\n"
 fp2_struggle.1050.desc_christian_bling_reference_drop:0 "วัตถุมงคลของนักบุญของเราถูกโยนเข้าไปในกองไฟที่โหมกระหน่ำ"\n\n"
 fp2_struggle.1050.desc_middle_neutral_version:0 "ทุกสิ่งที่เราสร้างขึ้นถูกทำลาย ความตายและความสิ้นหวังครอบงำแผ่นดิน"\n\n"
 fp2_struggle.1050.desc_love_and_warmth_ending:0 ""ได้โปรดเถิดที่รัก ช่วยข้าด้วย ข้ากลัวเหลือเกินว่าความฝันของข้าจะเป็นจริง ว่าสิ่งเหล่านี้จะเกิดขึ้น กอดข้าที ข้ารู้สึกหนาวเหลือเกิน""
 fp2_struggle.1050.desc_no_love_and_warmth_ending:0 ""ท่าน [ROOT.Char.GetWifeHusband] ที่รัก โปรดฟัง นี่ไม่ใช่ความเจ็บป่วยธรรมดาที่รุมเร้าข้า ข้าเกรงว่าความฝันของข้าจะเป็นจริง ว่าสิ่งเหล่านี้อาจเกิดขึ้น โปรดอย่าให้มันเกิดขึ้น ท่านต้องช่วยไอบีเรีย""
 fp2_struggle.1050.a:0 "เจ้าเป็นแม่มดหรือ?"
 fp2_struggle.1050.b:0 "ตั้งสติหน่อย [ROOT.GetCharacter.GetFaith.HighGodName] กำลังทดสอบศรัทธาของเจ้า"
 fp2_struggle.1050.c:0 "มาเถิด บอกข้าเกี่ยวกับนิมิตของเจ้าเพิ่มเติม"
 fp2_struggle.1050.d:0 "ปล่อยข้าอยู่ตามลำพัง ข้ากำลังวางแผนการพิชิตครั้งต่อไป"
 fp2_struggle.1050.spouse_imprisoned:0 "ท่านจองจำ [visionary_spouse.GetTitledFirstNameNoTooltip] ด้วยข้อสงสัยว่าเป็นแม่มด"
 fp2_struggle.1050.condition_might_improve:0 "อาการของ [visionary_spouse.GetTitledFirstNamePossessiveNoTooltip] อาจดีขึ้น"
 fp2_struggle.1050.condition_might_get_worse:0 "อาการของ [visionary_spouse.GetTitledFirstNamePossessiveNoTooltip] อาจแย่ลง"
 fp2_struggle.1050.condition_might_get_very_worse:0 "อาการของ [visionary_spouse.GetTitledFirstNamePossessiveNoTooltip] อาจแย่ลงมาก"
 comforting_spouse_visionary_toast.success:0 "ท่านปลอบโยน [visionary_spouse.GetTitledFirstName]"
 comforting_spouse_visionary.failure:0 "ท่านล้มเหลวในการปลอบโยน [visionary_spouse.GetTitledFirstName]"
 fp2_yearly.8004.t:0 "สำนักนักแปลแห่ง [translation_capital.GetNameNoTierNoTooltip]"
 fp2_yearly.8004.desc_opening:0 "ด้วยจิตวิญญาณแห่งการประนีประนอมที่ครอบงำในไอบีเรีย เหล่านักปราชญ์จากทั่วภูมิภาคได้ใช้เวลาอยู่ในห้องสมุดในอาณาเขตของข้า บางทีข้าอาจจะนำพลังงานของพวกเขาไปสู่สิ่งที่เป็นประโยชน์ได้...\n\n"
 fp2_yearly.8004.desc_chaplain:0 "[translation_enthusiast.GetCouncilTitle] [translation_enthusiast.GetTitledFirstName] ของข้ามีความคิด "เราควรจัดตั้งทีมแปล" [translation_enthusiast.GetSheHe] กล่าว "และข้าสามารถเป็นผู้นำได้ ให้เราค้นหาทั่วแผ่นดินเพื่อหานักแปลที่มีทักษะ แม้กระทั่งคนนอกศาสนา และให้พวกเขาทำงานภายใต้การอุปถัมภ์ของท่าน [translation_capital.GetNameNoTierNoTooltip] มีศักยภาพที่จะเป็นประภาคารแห่งการรู้แจ้ง หากท่านจะให้ทุนสนับสนุน!""
 fp2_yearly.8004.desc_wanderer:0 "นักพเนจรผู้คงแก่เรียน [translation_enthusiast.GetTitledFirstName] ได้เสนอโอกาสหนึ่ง "[ROOT.Char.Custom('FormOfAddressForLiege')|U]" [translation_enthusiast.GetSheHe] กล่าว "ข้าเชี่ยวชาญถึงสิบสองภาษา และสามารถช่วยท่านจัดตั้งทีมนักแปลได้ ให้พวกเราค้นหาแผ่นดินเพื่อหานักแปลผู้มีทักษะ และให้พวกเขาทำงานภายใต้การอุปถัมภ์ของท่าน [translation_capital.GetNameNoTierNoTooltip] อาจกลายเป็นสัญญาณแห่งการตื่นรู้ครั้งยิ่งใหญ่""
 fp2_yearly.8004.a:0 "ข้าจะ #italic ไม่#! ละเว้นค่าใช้จ่ายใดๆ ในการค้นหาคนที่ดีที่สุด"
 fp2_yearly.8004.b:0 "ในเมื่อเจ้ามีความสามารถ เช่นนี้ #italic เจ้า#! ก็แปลทั้งหมดได้"
 fp2_yearly.8004.c:0 "ห้องสมุดช่างน่ารำคาญเหลือเกิน..."
 recruiting_brilliance_toast.success:0 "ท่านพบนักแปลที่ยอดเยี่ยม"
 recruiting_mediocrity_toast.failure:0 "ท่านจ้างนักแปลธรรมดาๆ"

 fp2_yearly.8005.t:0 "ใต้ต้นสนหิน"
 fp2_yearly.8005.desc_opening:0 "ในความร้อนระอุตอนเที่ยงวัน พวกเขานั่งอยู่ในเงาใต้ต้นสนหินใหญ่ บรรเลงพิณลูทและขลุ่ย"
 fp2_yearly.8005.desc_iberian:0 "พวกเขาร้องเพลงเป็นภาษาโปรตุเกส-กาลิเซีย เป็นภาษาคาตาลัน เกี่ยวกับชีวิต การสูญเสีย ความรักอันหวานอมขมกลืน"
 fp2_yearly.8005.desc_arabic:0 "พวกเขาร้องเพลงเป็นภาษาอาหรับเกี่ยวกับความงาม ความรุ่งโรจน์ ความรักที่สูญเสียไปและพบเจออีกครั้ง"
 fp2_yearly.8005.desc_language_neutral:0 "พวกเขาร้องเพลงในหลายภาษา แต่หัวใจของข้าสามารถเข้าใจทุกคำ"
 fp2_yearly.8005.desc_middle_part:0 "ข้าได้ยินเสียงพวกเขาจากระเบียงของข้า และพวกเขากระตุ้นจิตวิญญาณของข้า\n\nทว่าข้าไม่รู้ตัวตนของนักดนตรีเหล่านี้ และเมื่อข้าออกจากห้องโถงอันสูงส่งและเข้าใกล้ต้นไม้ พวกเขาก็หายไปแล้ว"
 fp2_yearly.8005.desc_post_troubadours:0 "ข้าคิดว่ามีเพียงนักขับลำตรูบาดูร์แห่งอ็อกซิตาเนียเท่านั้นที่มีพรสวรรค์และไหวพริบ เช่นนี้ แต่บางทีข้าอาจเข้าใจผิด...\n\nข้าจะทำอย่างไรกับ #italic ความรู้สึก#! บ้าๆ เหล่านี้!?"
 fp2_yearly.8005.desc_pre_troubadours:0 "\n\nพวกเขาถูกส่งมาจาก [ROOT.Char.GetFaith.PositiveAfterLife|U] หรือ? พวกเขาเป็นภูตผีที่ [ROOT.Char.GetFaith.DevilName] สร้างขึ้นเพื่อล่อลวงข้าหรือไม่? อาจจะไม่... แต่ข้าจะทำอย่างไรกับ #italic ความรู้สึก#! บ้าๆ เหล่านี้!?"
 fp2_yearly.8005.a:0 "ความรักของข้าที่มีต่อ [courtly_lover.GetFirstNameNoTooltip] เติมเต็มหัวใจของข้าด้วยบทเพลง"
 fp2_yearly.8005.b:0 "ช่างงดงามเหลือเกิน..."
 fp2_yearly.8005.c:0 "ข้าควรสนับสนุนนักดนตรีให้มากขึ้น!"
 fp2_yearly.8005.d:0 "พอที! ข้าจะสั่งให้โค่นต้นไม้บ้าๆ นั่นลง"

 fp2_yearly.8002.t:0 "ปัญหาเรื่องอาหารการกิน"
 fp2_yearly.8002.desc:0 "เด็กสองคนกำลังเก็บหอยจากชายหาดใน [beached_whale_province.GetName] เมื่อพวกเขาพบซากสัตว์ขนาดมหึมา ชาวบ้านริมหาดอ้างว่าเนื้อของสัตว์ทะเลที่ตายแล้วนี้ยังไม่เน่าเปื่อย และอร่อย #italic มาก#! แต่ [preoccupied_ulama.GetCouncilTitle] [preoccupied_ulama.GetFirstName] ของข้าดึงข้าไปข้างๆ ระหว่างการประชุมสภา ดูเหมือนจะกังวล\n\n"การบริโภคเนื้อวาฬเป็นที่อนุญาตสำหรับพวกเราชาว [ROOT.Char.GetFaith.GetAdherentNamePluralNoTooltip] อย่างแท้จริงหรือ?" [preoccupied_ulama.GetSheHe] ครุ่นคิด "ข้าไม่สามารถตัดสินในเรื่องนี้ได้ เราควรรอคำแถลงจากนักปราชญ์ที่น่าเคารพนับถืออย่างสูง แต่ท่านควรห้ามผู้คนกินเนื้อของสัตว์ร้ายนี้ - เผื่อไว้...""
 fp2_yearly.8002.a:0 "ไม่ #italic ข้า#! สามารถ ทำให้มันเป็นที่อนุญาตได้"
 fp2_yearly.8002.b:0 "เอาเนื้อนั่นมาให้ข้าบ้าง! ข้า #italic ต้อง#! ชิมมัน"
 fp2_yearly.8002.c:0 "ตกลง ให้เรารอคำตัดสิน"
 fp2_yearly.8002.d:0 "มันต้อง #italic ห้าม#! กิน ข้าจะไปที่นั่นด้วยตนเองและเผามัน"
 exploding_whale_toast:0 "ซากสัตว์ระเบิดอย่างลึกลับ!"
 exploding_whale.tt:0 "ซากสัตว์ระเบิด!"
 healthy_whale_toast:0 "มันอร่อยมาก"
 unhealthy_whale_toast:0 "มีบางอย่างไม่ถูกต้อง..."

 fp2_yearly.8003.t:0 "เที่ยวบินแห่งจินตนาการ"
 fp2_yearly.8003.desc:0 "นักประดิษฐ์ผู้มีชื่อเสียง [flying_polymath.GetFirstName] ได้มาพบข้าพร้อมคำร้องที่แปลกประหลาด โดยถือปีกคู่หนึ่งที่ทำจากไม้และผ้าไหม \n\n"มนุษย์ปรารถนาที่จะทะยานผ่านสวรรค์มาเนิ่นนาน" [flying_polymath.GetSheHe] กล่าว "และข้าได้คำนวณแล้ว ข้าจะพิสูจน์ว่าเราทำได้! โปรดอนุญาตให้ข้ากระโดดจากหอคอยที่สูงที่สุดของ [ROOT.Char.Custom('ResidenceBuilding')] ของท่าน [ROOT.Char.Custom('FormOfAddressForLiege')] แล้วข้าจะรับใช้ท่านอย่างซื่อสัตย์หลังจากนั้น" \n\nโชคร้ายที่ [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('enthusiastic_child'))] ของข้า [enthusiastic_child.GetTitledFirstName] ได้รู้เรื่องนี้ และกำลังอ้อนวอนข้าให้ [enthusiastic_child.GetHerHim] ได้เห็นนักปราชญ์ชราผู้นี้บิน "
 fp2_yearly.8003.a:0 "ตกลง ข้าจะอนุญาต"
 fp2_yearly.8003.b:0 "ให้ข้ายืมปีกเหล่านั้น - #italic ข้า#! อยากบิน"
 fp2_yearly.8003.c:0 "ไม่ นี่มันบ้าสิ้นดี"
 flight_attempt_toast.success:0 "ท่านทะยานเหมือนนกอินทรี"
 flight_attempt_toast.failure:0 "ท่านร่วงลงสู่พื้น"
 fp2_yearly.8003_child_reaction:0 "ไม่อาจบอกได้ว่า [enthusiastic_child.GetFirstNameNoTooltip] จะมีปฏิกิริยาอย่างไรเมื่อเห็นสิ่งนี้"
 polymath_flight_attempt_toast.success:0 "[flying_polymath.GetFirstNameNoTooltip] บินได้!"
 polymath_flight_attempt_toast.failure:0 "[flying_polymath.GetFirstNameNoTooltip] ตกลงมาเสียชีวิต [flying_polymath.GetHerHis]"

 fp2_yearly.8001.t:0 "การรวมตัวของกอร์เตส"
 fp2_yearly.8001.desc:0 "[commoner_enthusiast.GetCouncilTitle] ของข้า [commoner_enthusiast.GetTitledFirstName] ได้ครุ่นคิดเรื่องการเงินของเรามานาน และตอนนี้เสนอว่าถึงเวลาที่จะรวบรวม #italic cortes#! ซึ่งเป็นรูปแบบใหม่ของรัฐสภาที่ตัวแทนผู้ได้รับเลือกตั้งของเทศบาลอิสระเข้าร่วมในการพิจารณาของสภาหลวง\n\n"เพื่อเป็นการตอบแทนสำหรับสิทธิพิเศษนี้" [commoner_enthusiast.GetSheHe] กล่าว "พวกเราสามารถเก็บภาษีเมืองต่าง ๆ ได้มากยิ่งขึ้น หากเราต้องการทองคำจริง ๆ [ROOT.Char.Custom('FormOfAddressForLiege')] เราอาจอนุญาตให้ชาวนาที่น่าสังเวชน้อยกว่าเข้าร่วมการประชุมของเราได้ แม้ว่าข้าจะแนะนำให้ต่อต้านสิ่งนั้น เนื่องจากมันจะ ทำให้เหล่าขุนนางโกรธเคืองอย่างแน่นอน""
 fp2_yearly.8001.a:0 "เชิญผู้แทนของเมืองต่างๆ"
 fp2_yearly.8001.b:0 "เชิญทุกคน! และข้าหมายถึง #italic ทุกคน#!."
 fp2_yearly.8001.c:0 "ไม่ พวกขุนนางรู้ดีที่สุด อย่างที่เราเป็นมาตลอด"
 fp2_flavor.8001_vassal_opinion:0 "ข้าในบังคับที่หวงแหนสิทธิพิเศษของตนจะไม่ชอบสิ่งนี้"

 fp2_yearly.8000.t:0 "การเผาไร่องุ่น"
 fp2_yearly.8000.desc_muslim_opening:0 "ไวน์ชั้นดีที่ผลิตในไอบีเรียเป็นที่ชื่นชอบของผู้ศรัทธาที่ตั้งรกรากอยู่ที่นี่มานาน ทว่าบัดนี้ [vinoclast_caliph.GetTitleTierName] [vinoclast_caliph.GetFirstName] ได้ตัดสินใจว่าสิ่งนี้จะต้องสิ้นสุดลง\n\n"ไวน์" ทูตของ [vinoclast_caliph.GetHerHis] [hof_emissary.GetTitledFirstName] ประกาศ "เป็นสิ่ง #italic ต้องห้าม (ฮะรอม)#! อย่างแน่นอน และทั้งการผลิตและการบริโภคไม่สามารถยอมรับได้อีกต่อไป ดังนั้นท่านต้องเผาไร่องุ่นใน [vineyard_county.GetName] ทิ้งเสีย""
 fp2_yearly.8000.desc_jewish_opening:0 "ไวน์ชั้นดีที่ผลิตในไอบีเรียเป็นที่ชื่นชอบของบรรพบุรุษของเราที่ตั้งรกรากอยู่ที่นี่มานาน ทว่าบัดนี้ [vinoclast_caliph.GetTitleTierName] [vinoclast_caliph.GetFirstName] ได้ตัดสินใจว่าสิ่งนี้จะต้องสิ้นสุดลง\n\n"ไวน์" ทูตของ [vinoclast_caliph.GetHerHis] [hof_emissary.GetTitledFirstName] ประกาศ "ไม่โคเชอร์อย่างแน่นอน และทั้งการผลิตและการบริโภคไม่สามารถยอมรับได้อีกต่อไป ดังนั้นท่านต้องเผาไร่องุ่นใน [vineyard_county.GetName] ทิ้งเสีย""
 fp2_yearly.8000.desc_jerez:0 "แต่ เนื่องจากเมือง [jerez_vineyards.GetNameNoTier] ของท่านมีไร่องุ่นที่ยิ่งใหญ่ที่สุดในไอบีเรียทั้งหมด เราจึงเข้าใจถึงความร้ายแรงของการเสียสละของท่าน และ [vinoclast_caliph.GetTitleTierName] จะไม่ลืมมัน ถึงกระนั้น ไร่องุ่นก็ต้องถูกเผา!""
 fp2_yearly.8000.desc_not_jerez:0 "[vinoclast_caliph.GetTitleTierName] เข้าใจถึงความเจ็บปวดที่อาจเกิดขึ้นกับชาวไร่องุ่นของท่าน แต่ลองนึกถึงที่ดินทั้งหมดที่ท่านจะปลดปล่อยเพื่อจุดประสงค์ที่ดีกว่าและชอบธรรมกว่า! ไร่องุ่นต้องถูกทำลาย""
 fp2_yearly.8000.a:0 "ทำลายไวน์ชั้นดี? [vinoclast_caliph.GetTitleTierName] เสียสติไปแล้วหรือ?"
 fp2_yearly.8000.b:0 "ข้าจะเผามันให้เป็นเถ้าถ่าน!"
 fp2_yearly.8000.c:0 "ไม่ ข้าต้องปกป้องชาวไร่องุ่น"

 fp2_struggle.1020.t:0 "ความตายของ [Select_CString(minority_councillor.IsFemale,'สมาชิกสภาสตรี','สมาชิกสภาบุรุษ')]"
 fp2_struggle.1020_desc_opening:1 "ช่างเป็นหายนะ! ท่ามกลางความตึงเครียดที่คุกรุ่นอยู่ใน [unrest_capital.GetNameNoTierNoTooltip] กลุ่มม็อบชาว [unrest_capital.GetCountyData.GetFaith.GetAdherentNamePluralNoTooltip] ที่โกรธแค้นได้กล่าวหาว่าสมาชิกสภาของข้า [minority_councillor.GetTitledFirstName] เป็นสาเหตุของความไม่พอใจของพวกเขา เนื่องจากความเชื่อแบบ [minority_councillor.GetFaith.GetAdherentNameNoTooltip] ของ [minority_councillor.GetHerHis]"
 fp2_struggle.1020_desc_beaten_by_mob:0 "ขณะที่ [minority_councillor.GetNameNoTooltip] กำลังเดินทาง [minority_councillor.GetHerHis] ไปยัง [ROOT.Char.Custom('ResidenceBuilding')] ของข้า กลุ่มคนร้ายได้รุมทำร้าย [minority_councillor.GetHerHim] และทุบตี [minority_councillor.GetHerHim] อย่างโหดเหี้ยมจนเสียชีวิต\n\n"
 fp2_struggle.1020_desc_burned_by_mob:0 "ในความมืดมิดยามค่ำคืน พวกเขาลอบเข้าไปใน [ROOT.Char.Custom('ResidenceBuilding')] ของข้า มัด [minority_councillor.GetNameNoTooltip] ไว้กับหูกทอผ้าแล้วจุดไฟเผา\n\n"
 fp2_struggle.1020_desc_hanged_and_disemboweled_by_mob:0 "พวกเขาจับตัว [minority_councillor.GetHerHim] ระหว่างทางไปประชุมสภา แขวน [minority_councillor.GetHerHim] ไว้ที่ประตู [ROOT.Char.Custom('ResidenceBuilding')] และกรีดท้องของ [minority_councillor.GetHerHis] ปล่อยให้เครื่องในร่วงหล่นลงสู่พื้นดินชื้นแฉะเบื้องล่าง\n\n"
 fp2_struggle.1020_desc_crucified_by_mob:0 "[minority_councillor.GetNameNoTooltip] กำลังไปเยี่ยมคนรู้จักที่นี่ใน [unrest_capital.GetNameNoTierNoTooltip] เมื่อกลุ่มม็อบที่โกรธแค้นจับตัว [minority_councillor.GetHerHim] และตอก [minority_councillor.GetHerHim] ติดกับกางเขนไม้ ซึ่ง [minority_councillor.GetSheHe] ก็เสียชีวิตในไม่ช้า\n\n"
 fp2_struggle.1020_desc_defenestrated_by_mob:0 "ด้วยความคลั่งแค้น พวกเขาสามารถบุกเข้าไปใน [ROOT.Char.Custom('ResidenceBuilding')] ของข้า จับตัว [minority_councillor.GetNameNoTooltip] และโยน [minority_councillor.GetHerHim] ออกจากหน้าต่างจนเสียชีวิต [minority_councillor.GetHerHis]\n\n"
 fp2_struggle.1020_desc_molten_silver_by_mob:0 "ด้วยความคลั่งแค้น พวกเขาบุกเข้าไปในห้องของ [minority_councillor.GetTitledFirstNamePossessiveNoTooltip] ใน [ROOT.Char.Custom('ResidenceBuilding')] ของข้า ที่ ซึ่งพวกเขาหลอมเครื่องประดับชั้นดีของ [minority_councillor.GetHerHis] แล้วกรอกลงคอของ [minority_councillor.GetHerHis]\n\n"
 fp2_struggle.1020_desc_torn_to_pieces_by_mob:0 "[minority_councillor.GetNameNoTooltip] กำลังเดินทาง [minority_councillor.GetHerHis] จากโรงอาบน้ำไปยัง [ROOT.Char.Custom('ResidenceBuilding')] ของข้า เมื่อกลุ่มคนร้ายที่โกรธแค้นได้รุมทำร้าย [minority_councillor.GetHerHim] ด้วยความแข็งแกร่งอันเกิดจากความเกลียดชัง พวกเขาฉีก [minority_councillor.GetHerHim] เป็นชิ้นๆ ด้วยมือเปล่า\n\n"
 fp2_struggle.1020_desc_councillor_had_family:0 "ครอบครัวของ [minority_councillor.GetTitledFirstNamePossessiveNoTooltip] โทษข้าสำหรับสิ่งที่เกิดขึ้น [councillor_executor.Custom2('HerHisCharacterIntroduction', minority_councillor)|U] ยืนอยู่ต่อหน้าข้าในขณะนี้ เรียกร้องให้ข้าขอโทษสำหรับการกระทำอันน่าสยดสยองนี้ต่อตระกูล [minority_councillor.GetDynastyName]"
 fp2_struggle.1020_desc_councillor_had_no_family_faith:0 "ผู้คนของ [minority_councillor.GetTitledFirstNamePossessiveNoTooltip] ดูเหมือนจะโทษ #italic ข้า #!สำหรับสิ่งที่เกิดขึ้น และ [councillor_executor.GetTitledFirstName] ผู้นำชุมชนชาว [minority_councillor.GetFaith.GetAdherentNameNoTooltip] ได้มาต่อหน้าข้าเพื่อขอให้ข้าชดเชยให้กับชาว [minority_councillor.GetFaith.GetAdherentNamePluralNoTooltip] ที่ถูกกดขี่ใน [unrest_capital.GetNameNoTierNoTooltip] สำหรับการกระทำอันมุ่งร้ายนี้"
 fp2_struggle.1020.a:0 "ขอการอภัยโทษจากราชวงศ์ [minority_councillor.GetDynastyNameNoTooltip]"
 fp2_struggle.1020.b:0 "จัดการเรื่องให้ถูกต้องกับผู้คนของ [minority_councillor.GetTitledFirstNamePossessiveNoTooltip]"
 fp2_struggle.1020.c:0 "ตามล่าผู้กระทำผิด"
 fp2_struggle.1020.d:0 "ส่งทหารไปฟื้นฟูความสงบเรียบร้อยใน [unrest_capital.GetNameNoTierNoTooltip]"
 
 fp2_yearly.8006.t:0 "ผู้ตั้งถิ่นฐานชาวซากอลิบา"
 fp2_yearly.8006.desc:0 "กลุ่มชาว #italic ซากอลิบา#! ผิวซีดหลายร้อยคน ชายและหญิงที่เป็นทาสจากดินแดนตะวันออกของยุโรป ได้หลบหนีออกจากอาณาจักรของ [former_master.GetTitledFirstName] [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('former_master'))] ของข้า แม้ [former_master.GetSheHe] จะพูดว่าพวกเขาเป็นที่รักยิ่งในกองทัพและฮาเร็มของ [former_master.GetHerHis] เพียงใด พวกเขาก็ได้ฝ่าฟันอันตรายมากมายเพื่อแสวงหาอิสรภาพในดินแดนของข้า\n\n"เราทุกคนมีรอยแผลเป็น" ผู้นำของพวกเขา [saqaliba_leader.GetFirstName] บอกข้า "บนร่างกาย หรือลึกเข้าไปข้างใน แต่เราแข็งแกร่งและมุ่งมั่น เราปรารถนาที่ดินของเราเอง ที่ ซึ่งเราสามารถพูดภาษาบรรพบุรุษของเราได้ หากท่านให้เราตั้งถิ่นฐานใน [saqaliba_barony.GetName] เราจะทำงานหนัก เพื่อให้มันเจริญรุ่งเรือง""
 fp2_yearly.8006.a:0 "ข้าอาจจะ แต่งตั้งเจ้าเป็นนายกเทศมนตรีได้ด้วยซ้ำ..."
 fp2_yearly.8006.b:0 "เจ้าอยู่ได้ แต่เพื่อนของเจ้าต้องไปที่อื่น"
 fp2_yearly.8006.c:0 "ข้าจะส่งเจ้ากลับไปหานายของเจ้า"
 furious_rival_8006.desc:0 "คู่แข่งของท่าน [former_master.GetTitledFirstNameNoTooltip] อาจอ้าง [claim|E] เหนือ [saqaliba_county.GetName]"
 fp2_yearly.8006.flavor.b.tt:0 "อย่างไม่เต็มใจ [saqaliba_leader.GetFirstNameNoTooltip] พักอยู่ในราชสำนักของท่าน ปล่อยให้ผู้ติดตามของ [saqaliba_leader.GetHerHis] หาเส้นทางของตนเอง"
 fp2_yearly.8006.flavor.c.tt:0 "ชาวซากอลิบาถูกส่งตัวกลับไปยัง [former_master.GetTitledFirstNameNoTooltip] โดยใช้กำลัง"

 # fp2_struggle_event_vero
 fp2_struggle.3001.t:0 "ราคาของสงคราม"
 fp2_struggle.3001.desc:0 "[struggle_3001_steward.Custom2('MyCharacterIntroduction', ROOT.Char)|U] เข้ามาในห้องด้วยท่าทีเคร่งขรึม "นาย [ROOT.GetCharacter.GetLadyLord] ของข้า" [struggle_3001_steward.GetSheHe] กล่าว "คลังของเราใกล้จะว่างเปล่าแล้ว มันอันตรายในยุคสมัย เช่นนี้" [struggle_3001_steward.GetSheHe|U] ไม่จำเป็นต้องพูดอะไรอีก ในความเงียบ ข้ามองเขาอย่างบึ้งตึง "[ROOT.Char.Custom('FormOfAddressForLiege')]..." [struggle_3001_steward.GetSheHe] พูดซ้ำขณะที่ข้าจากไป"
 fp2_struggle.3001.desc_no_war_intro:0 "\n\nทั้งหมดที่ข้ามีคือมงกุฎนี้ มงกุฎนี้และหน้าที่ที่จะรับใช้มันให้ดี แต่จะมีประโยชน์อันใดกับมงกุฎที่ไม่มีทรัพย์สมบัติค้ำจุน?"
 fp2_struggle.3001.desc_war_intro:0 "\n\nทั้งหมดที่ข้ามีคือมงกุฎนี้ มงกุฎนี้และหน้าที่ที่จะรับใช้มันให้ดี แต่จะมีประโยชน์อันใดกับมงกุฎที่จะถูกยึดไปอยู่ดีเมื่อข้าพ่ายแพ้?"
 fp2_struggle.3001.desc_outro:0 "ข้าเอื้อมมือไปสัมผัสวัสดุเย็นเฉียบของมัน — ทองคำ\n\nข้ารู้จักพ่อค้าไร้ศีลธรรมบางคนที่อาจจะสนใจมัน..."
 fp2_struggle.3001.a:0 "ข้าจะทำในสิ่งที่ต้องทำ"
 fp2_struggle.3001.a_flavour:0 "ท่านจะสูญเสียมงกุฎของท่าน"
 fp2_struggle.3001.b:0 "แต่มงกุฎอีกอันนั้นสิ..."
 fp2_struggle.3001.c:0 "เดี๋ยวก่อน! ข้าไม่ใช่คนเดียวที่มีมงกุฎในครัวเรือนนี้"
 fp2_struggle.3001.c_flavour:0 "คู่สมรสของท่านจะสูญเสียมงกุฎของพวกเขา"
 fp2_struggle.3001.d:0 "มงกุฎนี้จะหลุดออกจากหัวข้าก็ต่อเมื่อข้าตายแล้วเท่านั้น!"
 struggle_3001_spouse_crown_modifier:0 "มงกุฎถูกขาย"
 
 fp2_struggle.3011.t:0 "สตรีในยามคับขัน"
 fp2_struggle.3011.desc:1 ""[ROOT.GetCharacter.GetLadyLord] ของข้า! เรื่องที่ไม่น่าเชื่อได้เกิดขึ้นแล้ว!" [struggle_3011_marshal.Custom2('MyCharacterIntroduction', ROOT.Char)|U] ใช้เวลาครู่หนึ่งเพื่อหายใจ หน้าผาก [struggle_3011_marshal.GetHerHis] เปียกโชกไปด้วยเหงื่อ "เหล่าสตรีแห่ง [struggle_3011_county_town.GetNameNoTier] ได้จับอาวุธขึ้นปกป้องเมืองด้วยตนเอง""
 fp2_struggle.3011.desc_men:0 ""[ROOT.GetCharacter.GetLadyLord] ของข้า! เรื่องที่ไม่น่าเชื่อได้เกิดขึ้นแล้ว!" [struggle_3011_marshal.Custom2('MyCharacterIntroduction', ROOT.Char)|U] ใช้เวลาครู่หนึ่งเพื่อหายใจ หน้าผาก [struggle_3011_marshal.GetHerHis] เปียกโชกไปด้วยเหงื่อ "เหล่าชายหนุ่มแห่ง [struggle_3011_county_town.GetNameNoTierNoTooltip] ได้จับอาวุธขึ้นปกป้องเมืองด้วยตนเอง""
 fp2_struggle.3011.desc_outro:0 "\n\n[bishop.GetTitledFirstName] บุกเข้ามาในห้องตามมาในไม่ช้า "นี่มันผิดธรรมชาติ [ROOT.GetCharacter.GetLadyLord] ของข้า!" [bishop.GetSheHe] ร้องออกมา "ถ้าเราปล่อยให้พวกนางต่อสู้ ในไม่ช้าพวกนางก็จะขอที่ดินด้วย แล้วใครจะดูแลลูกๆ ล่ะ?"\n\n"ดาบก็คือดาบ" คำตอบของ [struggle_3011_marshal.GetFirstNameNoTooltip] นั้นทันที "แน่นอนว่าท่านเห็นด้วยใช่ไหม [ROOT.GetCharacter.GetLadyLord] ของข้า?""
 fp2_struggle.3011.a:0 "ข้าหวังว่าราษฎรทุกคนของข้าจะพร้อมปกป้องดินแดนของเรา เช่นนี้!"
 fp2_struggle.3011.b:0 "สตรีควรโอบอุ้มเพียงสิ่งเดียวในอ้อมแขน — ทารก"
 fp2_struggle.3011.b_men:0 "บุรุษควรโอบอุ้มเพียงสิ่งเดียวในอ้อมแขน — ทารก"
 fp2_struggle.3011.c:0 "แม่มด! #EMP แม่มด!#!"
 fp2_struggle.3011.d:0 "โอ้ สตรีผู้น่าสงสารเหล่านั้น! ข้าจะช่วยพวกนางให้พ้นจากความชั่วร้ายนี้!"
 fp2_order_of_the_hachet_modifier:0 "มิได้อยู่ในยามคับขัน"
 fp2_order_of_the_hachet_modifier_desc:0 "บุรุษและสตรีแห่งเคาน์ตีจักปกป้องมันอย่างเท่าเทียมกัน"
 fp2_punished_order_of_the_hachet_modifier:0 "บังคับสตรีสู่ยามคับขัน"
 fp2_punished_order_of_the_hachet_modifier_desc:0 "ในเคาน์ตีเหล่านี้ ผู้ที่ปกป้องดินแดนของตนโดยไม่ได้รับความเห็นชอบจากเจ้าเหนือหัวจะได้รับโทษรุนแรงกว่าผู้รุกราน"
 
 fp2_struggle.3021.t:0 "พระพิโรธแห่งสวรรค์"
 fp2_struggle.3021.desc:0 "ใบหน้าของ [struggle_3021_knight.Custom2('MyCharacterIntroduction', ROOT.Char)|U] บิดเบี้ยวด้วยความกลัวเมื่อข้าไปเยี่ยมค่ายทหาร [struggle_3021_courtier.GetTitledFirstName] กำลังพยายามช่วย [struggle_3021_knight.GetHerHim] และเลิกคิ้วเมื่อ [struggle_3021_courtier.GetSheHe] เห็นข้า\n\n"อย่างน้อยท่านจะบอก [ROOT.GetCharacter.GetLadyLord] ของท่านได้ไหมว่าเกิดอะไรขึ้น?"\n\n[struggle_3021_knight.GetFirstNameNoTooltip] เงยหน้า [struggle_3021_knight.GetHerHis] ขึ้นทันที "ฝะ-ฝ่าบาท... สิ่งที่ข้าเห็นนั้นไม่ควรมีใครเห็น ร่างต่างๆ กำลังขว้างก้อนหินที่ทำจากดินปืนสีดำจากเชิงเทิน ก้อนหินลุกเป็นไฟและส่งเสียงดังสนั่นเมื่อกระทบศัตรู พวกมันผ่าชายคนหนึ่งออกเป็นสองท่อน ฝ่าบาท!"\n\n[struggle_3021_courtier.GetFirstNameNoTooltip] พยักหน้าด้วยความสนใจ "บางที... ถ้าเรามีพลังนั้นบ้าง..."
 fp2_struggle.3021.a:0 "นี่คุ้มค่าแก่การค้นคว้าอย่างแน่นอน"
 fp2_struggle.3021.b:0 "ใครจะรู้ว่าสิ่งนี้อาจนำมา ซึ่งอันตรายใดบ้าง"
 fp2_struggle.3021.c:0 "ดินปืนสีดำเจ้าว่า... เครื่องเทศใหม่ที่ร้อนแรง"
 fp2_struggle.3021.d:0 "นี่คือการลงทัณฑ์จากสวรรค์!"
 fp2_struggle.3021.e:0 "สายฟ้าแด่เทพเจ้าสายฟ้า"
 bad_struggle_3021_courtier_desc:0 "[struggle_3021_courtier.GetTitledFirstNamePossessive] เสียชีวิตจากการค้นคว้าของ [struggle_3021_courtier.GetHerHis]"
 good_struggle_3021_courtier_desc:0 "[struggle_3021_courtier.GetTitledFirstNamePossessive] ประสบความสำเร็จกับการค้นคว้าของ [struggle_3021_courtier.GetHerHis]"
