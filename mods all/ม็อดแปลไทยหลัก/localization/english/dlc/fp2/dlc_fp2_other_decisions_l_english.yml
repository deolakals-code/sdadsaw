 fp2_other_decisions.1100.t:0 "อาณาจักรโตเลโด"
 fp2_other_decisions.1100.desc:0 "ด้วยความแข็งแกร่งของตำแหน่งของข้าที่เหนือข้อสงสัยใดๆ แล้ว พิธีราชาภิเษกใน [GetTitleByKey('c_toledo').GetNameNoTier] ก็ได้ดำเนินไปตามแผนในที่สุด\n\nถึงเวลาแล้วที่พวกเรา [ROOT.Char.GetFaith.GetAdherentNamePlural] จะสร้างอาณาเขตของเราเอง แยกออกจากอาณาจักรไตฟาเล็กๆ และดินแดนทางเหนือ อาณาจักรที่จะทัดเทียมอาณาจักรวิซิกอธในอดีต!"
 fp2_other_decisions.1100.a:0 "ขอให้อาณาจักรของเราเจริญรุ่งเรืองสืบไป"

 fp2_other_decisions.1101.desc:0 "ด้วยความแข็งแกร่งที่เพิ่มขึ้นเรื่อยๆ [toledo_former.GetTitledFirstName] ได้ประกอบพิธีราชาภิเษก [toledo_former.GetHerselfHimself] อย่างเป็นทางการใน [GetTitleByKey('c_toledo').GetNameNoTier]\n\nความแข็งแกร่งของอาณาจักร [toledo_former.GetFaith.GetAdjective] ใหม่นี้ ซึ่งรวมเอาดินแดนของอาณาจักรเก่าแก่ของไอบีเรียเข้าไว้ด้วยกัน บัดนี้เป็นที่ประจักษ์แล้ว\n\n"
 fp2_other_decisions.1101.stolen:1 "พวกหน้าใหม่ที่น่ารำคาญเหล่านี้จะต้องถูกจัดการไม่ช้าก็เร็ว!"
 fp2_other_decisions.1101.mozarab:0 "แม้ว่านี่จะเป็นลางดีสำหรับศรัทธาของเรา แต่มันอาจเป็นดาบสองคม..."
 fp2_other_decisions.1101.a:0 "พวกเขาจะอยู่ได้ไม่นาน!"
 fp2_other_decisions.1101.b:0 "เป็นเรื่องที่ต้องจับตาดู"
 fp2_other_decisions.1101.c:0 "น่าสนใจ"

 fp2_form_kingdom_toledo_modifier:0 "$fp2_other_decisions.1100.t$"
 fp2_form_kingdom_toledo_modifier_desc:0 "ตัวละครนี้ได้สถาปนาอาณาจักรใหม่โดยมีศูนย์กลางอยู่ที่เมืองหลวงเก่าของชาววิซิกอธ"
