 iberian_footholder_transfer_tt:0 "[THIS] [THIS.Title.GetName] [THIS.GetName]"

 fp2_other_decisions.1000.t:0 "$secure_iberian_foothold_decision_title$: การรวมอำนาจของ [iberian_footholder.GetPrimaryTitle.GetAdjectiveNoTooltip]"
 fp2_other_decisions.1000.involved_religion:0 "สงครามของอาณาจักรที่แตกแยกในไอบีเรียเกือบ ทำให้อาณาจักร [ROOT.Char.GetFaith.GetReligion.GetAdjective] ในภูมิภาคล่มสลาย\n\nหากปราศจากการแทรกแซงของเรา ผู้ศรัทธาใน [ROOT.Char.GetFaith.HighGodNamePossessive] คงถูกขับไล่ออกจากคาบสมุทรโดยพวกนอกรีตที่หยิ่งผยองในที่สุด\n\n"
 fp2_other_decisions.1000.desc:0 "ศรัทธาและผู้คนที่แตกแยกในไอบีเรียได้มอบโอกาสอันยิ่งใหญ่แก่เรา พวกเขามัว แต่ต่อสู้กันเองจนไม่สามารถต่อต้านการรุกรานคาบสมุทรของ [ROOT.Char.GetFaith.GetReligion.GetAdjective] ได้"
 fp2_other_decisions.1000.involved_faith:0 "เราคือผู้พิทักษ์อันชอบธรรมของ [ROOT.Char.GetFaith.GetAdherentNamePlural] แห่งตะวันตก บัดนี้ปลอดภัยภายใต้การคุ้มครองของ [ROOT.Char.GetPrimaryTitle.GetDefinitiveName]"
 fp2_other_decisions.1000.uninvolved_faith:0 "เป็นหน้าที่ของเราที่จะนำแสงสว่างแห่ง [ROOT.Char.GetFaith.GetName] มา ในฐานะส่วนหนึ่งของ [ROOT.Char.GetPrimaryTitle.GetDefinitiveName] ดินแดนเหล่านี้จะกลับมารุ่งเรืองและสงบสุขอีกครั้ง"
 fp2_other_decisions.1000.closing:0 "\n\nเมื่อถึงเวลา พวกเขาจะเห็นว่ายุคของเทพเจ้าจอมปลอมของพวกเขาได้สิ้นสุดลงแล้ว และจะยินดีที่ [ROOT.Char.GetFaith.HighGodName] ได้นำ [ROOT.Char.GetPrimaryTitle.GetDefinitiveName] ไปสู่ความรอดของภูมิภาค"
 fp2_other_decisions.1000.a:0 "ไอบีเรียต้องการสายเลือดใหม่"

 fp2_other_decisions.1001.involved_religion:0 "หลังสงครามนานหลายศตวรรษระหว่างชาวคริสต์และชาวมัวร์ในไอบีเรีย การต่อสู้ดิ้นรนของเรากลับถูกผู้สอดแทรก [iberian_footholder.GetPrimaryTitle.GetAdjective] ที่หยิ่งผยองฉวยโอกาส\n\n"
 fp2_other_decisions.1001.desc:0 "ด้วยความไขว้เขว ความอิจฉาริษยา และความประมาทเลินเล่อ พวกเราชาวไอบีเรียได้ปล่อยให้ผู้สอดแทรก [iberian_footholder.GetPrimaryTitle.GetAdjective] ฉวยโอกาสจากความแตกแยกในบ้านเกิดของเราและรุกรานอาณาจักรประวัติศาสตร์ของคาบสมุทร"
 fp2_other_decisions.1001.involved_faith:0 "[iberian_footholder.GetTitledFirstName] ได้ประกาศตน [iberian_footholder.GetHerselfHimself] เป็นผู้นำ [iberian_footholder.GetFaith.GetAdjectiveNoTooltip] ที่ชอบธรรมของคาบสมุทร โดยใช้ชัยชนะ [iberian_footholder.GetHerHis] เป็นข้อพิสูจน์ถึงความชอบธรรม [iberian_footholder.GetHerHis] เหนืออาณาจักร [iberian_footholder.GetFaith.GetReligion.GetAdjective] ที่กำลังเสื่อมโทรมของไอบีเรีย"
 fp2_other_decisions.1001.same_uninvolved_faith:0 "พวกเขาอ้างว่าความล้มเหลวของเราคือการลงโทษของ [ROOT.Char.GetFaith.HighGodNamePossessive] สำหรับการหลงผิดไปจากเส้นทางอันชอบธรรมของ [iberian_footholder.GetFaith.GetName] และ [iberian_footholder.GetTitledFirstName] คือผู้นำอันชอบธรรมของไอบีเรีย [ROOT.Char.GetFaith.GetReligion.GetAdjective]..."
 fp2_other_decisions.1001.uninvolved_faith:0 "ด้วยชัยชนะของ [iberian_footholder.GetHerHis] เป็นหลักฐาน [iberian_footholder.GetTitledFirstName] ได้ประกาศว่าศรัทธา [iberian_footholder.GetFaith.GetAdjective] ของ [iberian_footholder.GetHerHis] คือเส้นทาง [iberian_footholder.GetFaith.GetReligion.GetAdjective] ที่แท้จริง ซึ่งจะรวมคาบสมุทรทั้งหมดไว้ภายใต้ [iberian_footholder.GetFaith.HighGodName]"
 fp2_other_decisions.1001.closing:0 "\n\nขณะที่ [iberian_footholder.GetTitledFirstName] กำลังรวบรวมดินแดนของ [iberian_footholder.GetHerHis] ความแตกต่างในอดีตระหว่างชาวมุสลิมและชาวคริสต์ดูเหมือนจะจืดจางไปเมื่อเทียบกับการยึดครองของ [iberian_footholder.GetFaith.GetAdjective] นี้..."
 fp2_other_decisions.1001.a:0 "ไอ้พวกสอดแทรกน่ารังเกียจ"

 ### Council of Toledo Decision
 council_of_toledo_decision_title:0 "เรียกประชุมสภาแห่งโตเลโด"
 council_of_toledo_decision_desc_count:0 "เวลาจะมาถึงเพื่อเรียกประชุมสภาแห่ง [GetTitleByKey('c_toledo').GetNameNoTier] ครั้งที่ [SCOPE.ScriptValue('council_of_toledo_counter_value')][ROOT.Char.Custom('get_council_of_toledo_count_suffix')] และตัดสินปัญหาทางศาสนาของ [ROOT.Char.GetFaith.GetAdherentNamePlural] อีกครั้ง"
 council_of_toledo_decision_desc:0 "เป็นเวลาหลายศตวรรษที่มีการจัดสภาศาสนาขึ้นใน [GetTitleByKey('c_toledo').GetNameNoTier] ซึ่งนักบวชจากทั่วคริสต์จักรได้ตัดสินข้อพิพาทในยุคนั้น การจัดสภาครั้งที่ 19 จะเป็นการฟื้นฟูประเพณีวิซิกอธนี้"
 council_of_toledo_decision_tooltip:0 "จัดการชุมนุมของนักบวช [ROOT.Char.GetFaith.GetReligion.GetAdjective] ในโตเลโด"
 council_of_toledo_decision_confirm:0 "ถึงเวลาแล้ว"
 council_of_toledo_decision_toledo_holder_trigger:0 "ท่าน [hold|E] หรือปกครองเหนือ [GetTitleByKey('c_toledo').GetName] และ [ruler|E] ของมันนับถือศรัทธา [THIS.Char.GetFaith.GetName]"
 council_of_toledo_decision_toledo_faith_trigger:0 "[faith|E] คือ [THIS.Char.GetLiege.GetFaith.GetName]"
 council_of_toledo_decision_catalyst_tt:0 "[struggle_catalyst|E] อาจเกิดขึ้น"
 council_of_toledo_decision_tt:0 "รางวัลขึ้นอยู่กับผลลัพธ์ของสภา"
 # Event - Organization
 fp2_other_decisions.0700.council:0 "สภาแห่งโตเลโดครั้งที่ [SCOPE.ScriptValue('council_of_toledo_counter_value')][ROOT.Char.Custom('get_council_of_toledo_count_suffix')]"
 fp2_other_decisions.0700.t:0 "$fp2_other_decisions.0700.council$: การจัดตั้ง"
 fp2_other_decisions.0700.19:0 "[council_priest.GetTitledFirstName] ได้เริ่มเตรียมการสำหรับสภาศาสนาครั้งที่สิบเก้าใน [GetTitleByKey('c_toledo').GetNameNoTier] เพื่อให้สอดคล้องกับการประชุมสภาสงฆ์ของชาววิซิกอธในอดีต\n\nแม้ว่าอำนาจของ [GetTitleByKey('k_papal_state').GetDefinitiveName] จะขยายตัวขึ้นนับตั้งแต่การรุกรานของชาวมัวร์ แต่นักบวชของเรายังคงรักษาประเพณีและเอกราชของตนเองไว้ ถึงเวลาแล้วที่จะย้ำความสำคัญของไอบีเรียในฐานะสถานที่แห่งการเสวนาทางศาสนา\n\nการประชุมครั้งก่อนๆ มี [ROOT.Char.GetFaith.BishopNeuterPlural] จากทั่วคริสต์จักรรวมอยู่ด้วย แต่ไม่จำเป็นต้องเป็น เช่นนั้นอีกต่อไป..."
 fp2_other_decisions.0700.desc:0 "[ROOT.Char.GetFaith.BishopNeuterPlural] แห่งไอบีเรียต่างรอคอยสภาครั้งต่อไปอย่างใจจดใจจ่อ นับตั้งแต่ประเพณีแห่งโตเลโดได้รับการฟื้นฟู\n\n[council_priest.GetCouncilTitleFirstName] ได้เริ่มเตรียมการแล้ว แม้ว่าจะยังคงต้องตัดสินใจว่านักบวชจากประเพณีอื่นจะได้รับเชิญให้เข้าร่วมหรือไม่"
 fp2_other_decisions.0700.a:0 "มันจะเป็นการประชุมสภาสงฆ์ของชาวโมซาราบ"
 fp2_other_decisions.0700.b:0 "ศาสนบริกรทั้งหมดของ [ROOT.Char.GetFaith.HighGodNamePossessive] ยินดีต้อนรับในโตเลโด"
 fp2_other_decisions.0700.b.success:0 "บิชอปจากทั่วคริสต์จักรเข้าร่วม"
 fp2_other_decisions.0700.b.failure:0 "การเรียกประชุมที่โตเลโดถูกเพิกเฉย"
 fp2_other_decisions.0700.tt:0 "สภาแห่งโตเลโดครั้งที่ [SCOPE.ScriptValue('council_of_toledo_counter_value')][THIS.Char.Custom('get_council_of_toledo_count_suffix')] จะเริ่มในอีกหลายสัปดาห์"
 # Event - Arrival
 fp2_other_decisions.0701.t:0 "$fp2_other_decisions.0700.council$: ผู้เข้าร่วม"
 fp2_other_decisions.0701.opening.success:0 "ดูเหมือนว่าคำเชิญไปยัง [ROOT.Char.GetFaith.AltPriestTermPlural] [ROOT.Char.GetFaith.GetReligion.GetAdjective] ในวงกว้างจะได้รับการตอบรับเป็นอย่างดี [ROOT.Char.GetFaith.BishopNeuterPlural] ผู้ทรงเกียรติจำนวนมากจากดินแดนต่างแดนได้หลั่งไหลมายัง [GetTitleByKey('c_toledo').GetNameNoTier] อย่างกระตือรือร้น"
 fp2_other_decisions.0701.opening.failure:0 "การตอบรับคำเชิญของเราไปยังชุมชนทั่วคริสต์จักรนั้นเย็นชา [ROOT.Char.GetFaith.BishopNeuterPlural] จำนวนมากอ้างว่าสภาพอากาศเลวร้าย ทำให้ไม่สามารถเดินทางมาถึง [GetTitleByKey('c_toledo').GetNameNoTier] ได้ เหลือเพียงพระราชาคณะท้องถิ่นเข้าร่วมเท่านั้น...."
 fp2_other_decisions.0701.opening.catastrophe:0 "เราไม่เห็นบิชอป ดีคอน หรืออธิการอารามแม้ แต่คนเดียวจากนิกาย [ROOT.Char.GetFaith.GetReligion.GetAdjective] อื่นๆ ใน [GetTitleByKey('c_toledo').GetNameNoTier] ดูเหมือนว่าสภาของเราจะถูกมองด้วยความดูถูกหรือความโกรธเคืองจากภราดรภาพทั่วคริสต์จักรของเรา และมีเพียงพระราชาคณะท้องถิ่นเท่านั้นที่เข้าร่วม"
 fp2_other_decisions.0701.opening:0 "ผู้ยิ่งใหญ่และผู้ทรงคุณธรรมได้มาเยือน [GetTitleByKey('c_toledo').GetNameNoTier] เป็นตัวแทนของมุขมณฑลและอารามทั้งหมดของ [ROOT.Char.GetFaith.GetAdherentNamePlural]"
 fp2_other_decisions.0701.religious_head_bishop:0 "\n\nท่ามกลางพระราชาคณะผู้ต่ำต้อยคือ [portrait_bishop.GetTitledFirstName], [portrait_bishop.Custom('get_council_of_toledo_attendee_description')], ประมุขแห่งคริสตจักร [portrait_bishop.GetFaith.GetAdjective]"
 fp2_other_decisions.0701.powerful_bishop:0 "\n\nบางทีผู้ที่โดดเด่นที่สุดในหมู่พวกเขาคือ [portrait_bishop.GetTitledFirstName], [portrait_bishop.Custom('get_council_of_toledo_attendee_description')], พระราชาคณะ [portrait_bishop.GetFaith.GetAdjective] ผู้ทรงอิทธิพลอย่างยิ่ง"
 fp2_other_decisions.0701.saint_bishop:0 "\n\nผู้เข้าร่วมได้รับพรที่มี [portrait_bishop.GetFirstName], [portrait_bishop.Custom('get_council_of_toledo_attendee_description')], นักบุญ [portrait_bishop.GetFaith.GetAdjective] อยู่ท่ามกลางพวกเขา!"
 fp2_other_decisions.0701.theologian_bishop:0 "\n\nที่น่าสังเกตในหมู่พวกเขาคือ [portrait_bishop.GetFirstName], [portrait_bishop.Custom('get_council_of_toledo_attendee_description')], นักเทววิทยา [portrait_bishop.GetFaith.GetAdjective] ที่ได้รับการยอมรับอย่างกว้างขวาง"
 fp2_other_decisions.0701.bad_bishop:0 "\n\nหนึ่งในผู้ที่เป็นที่รู้จักมากที่สุดคือ [portrait_bishop.GetFirstName], [portrait_bishop.Custom('get_council_of_toledo_attendee_description')], ซึ่งความไร้ศรัทธาของเขาเป็นเรื่องตลกขบขันที่รู้จักกันทั่วคริสต์จักร"
 fp2_other_decisions.0701.senior_bishop:0 "\n\nผู้อาวุโสที่สุดในบรรดานักบวชทั้งหมดคือ [portrait_bishop.GetFirstName], [portrait_bishop.Custom('get_council_of_toledo_attendee_description')], [portrait_bishop.GetWomanMan] ผู้ทรงเกียรติแห่งศาสนจักร "
 fp2_other_decisions.0701.failure:0 "\n\nพ่อค้าในเมืองที่มีกำแพงล้อมรอบผิดหวังกับจำนวนผู้เข้าร่วมที่น้อย โดยได้เตรียมการสำหรับการมาเยือนของนักบวชจำนวนมาก น่าเสียดาย"
 fp2_other_decisions.0701.desc:0 "\n\nเมืองที่มีกำแพงล้อมรอบกำลังเห็นประโยชน์จากนักบวชที่มาเยือนแล้ว ซึ่งการค้าและการต้อนรับของพวกเขาเป็นที่คาดหวังของพ่อค้า"
 fp2_other_decisions.0701.a:0 "ยอดเยี่ยม"
 fp2_other_decisions.0701.b:0 "ความหยิ่งยโสย่อมนำมา ซึ่ง..."
 fp2_other_decisions.0701.c:0 "ดี"
 fp2_other_decisions.0701.tt:0 "สภาแห่งโตเลโดครั้งที่ [SCOPE.ScriptValue('council_of_toledo_counter_value')][THIS.Char.Custom('get_council_of_toledo_count_suffix')] เริ่มต้นขึ้น"
 # Event - Debate
 fp2_other_decisions.0702.t:0 "$fp2_other_decisions.0700.council$: การอภิปราย"
 fp2_other_decisions.0702.19:0 "หลายศตวรรษหลังจากการประชุมสภาครั้งสุดท้ายของอาร์ชบิชอปกุนเดริกภายใต้กษัตริย์วิตติซา [council_priest.GetCouncilTitleFirstName] ได้ฟื้นฟูประเพณีของเราโดยเปิดการชุมนุมครั้งที่สิบเก้าใน [GetTitleByKey('c_toledo').GetNameNoTier] อันเลื่องชื่อ\n\n"
 fp2_other_decisions.0702.opening:0 "สภาอีกครั้งได้เริ่มขึ้นใน [GetTitleByKey('c_toledo').GetNameNoTier] ครั้งนี้เปิดโดย [council_priest.GetCouncilTitleFirstName]\n\n"
 fp2_other_decisions.0702.present:0 "\n\nเมื่อสิ้นสุดสัปดาห์ ก็เห็นได้ชัดอย่างรวดเร็วว่า [debate_bishop.GetTitledFirstName] แห่ง [debate_bishop.GetTopLiege.GetPrimaryTitle.GetNameNoTierNoTooltip] ได้รับความสนใจจากที่ประชุมในเรื่องนี้ $fp2_other_decisions.0702.closing$"
 fp2_other_decisions.0702.second_hand:0 "\n\nเมื่อการเจรจาสิ้นสุดลง เป็นที่ชัดเจนว่า [debate_bishop.GetTitledFirstName] แห่ง [debate_bishop.GetTopLiege.GetPrimaryTitle.GetNameNoTierNoTooltip] ถูกมองว่าเป็นผู้นำของมุมมองนี้ $fp2_other_decisions.0702.closing$"
 fp2_other_decisions.0702.conversion:0 "หัวข้อหลักที่ว่าการเปลี่ยนศาสนาของพวกนอกรีตและคนนอกศาสนาเป็นหนทางเดียวที่จะรับประกันสันติภาพและปกป้อง [ROOT.Char.GetFaith.GetAdherentNamePlural] ได้ปรากฏขึ้นอย่างรวดเร็ว"
 fp2_other_decisions.0702.reform:0 "หัวข้อสำคัญคือ [ROOT.Char.GetFaith.GetAdherentNamePlural] ไม่ควรกลัวการปฏิรูปครั้งใหญ่ บัดนี้ตำแหน่งของคริสตจักรไอบีเรียมั่นคงแล้ว"
 fp2_other_decisions.0702.tolerance:0 "หัวข้อที่โดดเด่นคือ [ROOT.Char.GetFaith.GetAdherentNamePlural] ควรอดทนต่อคนนอกศาสนาที่รักสงบมากขึ้น แนวคิดนี้กลายเป็นจุดสนใจของการเจรจาอย่างรวดเร็ว"
 fp2_other_decisions.0702.rights:0 "หัวข้อหลักคือความกังวลเกี่ยวกับการปกป้องสิทธิโบราณของนักบวช [ROOT.Char.GetFaith.GetAdjective] และการซ่อมแซมโบสถ์"
 fp2_other_decisions.0702.hof:0 "น่าประหลาดใจที่ความรู้สึกว่า [ROOT.Char.GetFaith.GetAdherentNamePlural] ต้องการผู้นำทางจิตวิญญาณของตนเองเป็นข้อกังวลเร่งด่วนที่สุดของบิชอปหลายคนของเรา"
 fp2_other_decisions.0702.pope:0 "บรรยากาศแห่งความร่วมมือเกิดขึ้น โดยบิชอปหลายคนโต้แย้งให้มีความร่วมมือมากขึ้นระหว่าง [ROOT.Char.GetFaith.GetAdherentNamePlural] และพี่น้องร่วมคริสต์จักรของพวกเขา"
 fp2_other_decisions.0702.heresy:0 "พลังงานเร่งด่วนเข้าครอบงำการเจรจา เมื่อภัยคุกคามจาก [heretic_faith.GetAdherentNamePlural] พวกนอกรีต เช่นชาวพริสซิลเลียนและชาวอาเรียนในอดีต ถูกหยิบยกขึ้นมา"
 fp2_other_decisions.0702.closing:0 "ในขณะที่ [counter_bishop.GetTitledFirstName|U] แห่ง [counter_bishop.GetTopLiege.GetPrimaryTitle.GetNameNoTierNoTooltip] โต้แย้งข้อโต้แย้งของ [debate_bishop.GetHerHis] อย่างแข็งขันที่สุด"
 fp2_other_decisions.0702.a:0 "ข้าเห็นด้วยอย่างยิ่ง"
 fp2_other_decisions.0702.b.hof:0 "มันไม่ใช่พระประสงค์ของ [ROOT.Char.GetFaith.HighGodNamePossessive]"
 fp2_other_decisions.0702.b:0 "[debate_bishop.GetSheHe|U] จะถูกตะโกนไล่"
 council_of_toledo_ruler_effect_tt:0 "ทุก [ruler|E] ที่นับถือ [council_toledo_faith.GetAdjective]"
 # Event - Invalidated
 fp2_other_decisions.0703.t:0 "$fp2_other_decisions.0700.council$: เลื่อนออกไป"
 fp2_other_decisions.0703.war:0 "เนื่องจากการเริ่มต้นของสงคราม [council_priest.GetCouncilTitleFirstName] ได้เลื่อนสภาแห่งโตเลโดที่กำลังจะมาถึงออกไปก่อน"
 fp2_other_decisions.0703.control:0 "ด้วยการสูญเสีย [GetTitleByKey('c_toledo').GetNameNoTier] จึงไม่สามารถเป็นเจ้าภาพจัดการประชุมสภาแห่งโตเลโดที่กำลังจะมาถึงได้อีกต่อไป..."
 fp2_other_decisions.0703.desc:0 "\n\n[ROOT.Char.GetFaith.GetAdherentNamePlural] จะกลับมาจากความพ่ายแพ้นี้ในไม่ช้าอย่างไม่ต้องสงสัย..."
 fp2_other_decisions.0703.a:0 "น่าผิดหวัง"
 # Event - Ping
 fp2_other_decisions.0704.t:0 "$fp2_other_decisions.0700.council$"
 fp2_other_decisions.0704.success:0 "\n\nด้วยการสนับสนุนของ [council_toledo_host.GetTitledFirstNamePossessive] นักบวช [ROOT.Char.GetFaith.GetAdherentNamePlural] ได้ ทำให้เสียงของพวกเขาเป็นที่รับฟัง"
 fp2_other_decisions.0704.failure:0 "ดูเหมือนว่า [council_toledo_host.GetTitledFirstName] จะมีความคิดอื่น และได้วิ่งเต้นต่อต้านข้อเสนอเหล่านี้อย่างแข็งขัน"
 fp2_other_decisions.0704.a:0 "น่าสนใจ"
