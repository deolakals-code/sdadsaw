 fp2_council_opinion_other_effect_tt:0 "ผู้เข้าร่วมที่ไม่ใช่ชาวโมซาราบทุกคน"
 fp2_council_conversion_modifier_tt:0 "การเปลี่ยนศรัทธาในเคาน์ตีจะดำเนินไปเร็วขึ้นเมื่อต่อต้าน [religions|E] อื่นๆ ในขณะที่ตัวปรับ แต่งนี้มีอยู่"
