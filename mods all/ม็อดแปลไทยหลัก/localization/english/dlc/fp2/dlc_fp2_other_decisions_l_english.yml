 fp2_struggle_secure_iberian_foothold_religion_tt:0 "ท่าน [hold|E] อย่างน้อย #Z [SCOPE.ScriptValue('fp2_struggle_secure_iberian_foothold_religion_target_percent_value')|0]%#! ของ [counties|E] ที่นับถือ [faith|E] [THIS.Char.GetFaith.GetReligion.GetAdjective] ใน [region|E] [GetGeographicalRegion('world_europe_west_iberia').GetName] (ปัจจุบัน: [SCOPE.ScriptValue('fp2_struggle_secure_iberian_foothold_religion_percent_value')|1]%)\n"
 fp2_struggle_secure_iberian_foothold_outsider_tt:0 "ท่าน [hold|E] อย่างน้อย #Z [SCOPE.ScriptValue('fp2_struggle_secure_iberian_foothold_outsider_target_percent_value')|0]%#! ของ [counties|E] ใน [region|E] [GetGeographicalRegion('world_europe_west_iberia').GetName] (ปัจจุบัน: [SCOPE.ScriptValue('fp2_struggle_secure_iberian_foothold_outsider_percent_value')|0]%)\n"

 fp2_struggle_secure_iberian_foothold_empire_held_effect_tt: "ทุก [kingdom|E] [de_jure|E] ของ [GetTitleByKey('e_spain').GetNameNoTier] ที่ตรงตามเงื่อนไขด้านล่างจะกลายเป็นส่วนหนึ่ง [de_jure|E] ของ [THIS.Char.GetPrimaryTitle.GetNameNoTier]"
 fp2_struggle_secure_iberian_foothold_empire_dejure_effect_tt:0 "ทุก [kingdom|E] [de_jure|E] ของ [GetTitleByKey('e_spain').GetNameNoTier] ที่ตรงตามเงื่อนไขด้านล่างจะกลายเป็นส่วนหนึ่ง [de_jure|E] ของ [empire|E] ของ [THIS.Char.GetPrimaryTitle.GetDeJureLiege.GetNameNoTier]"

