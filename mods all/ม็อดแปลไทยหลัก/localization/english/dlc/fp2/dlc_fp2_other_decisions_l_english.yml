 fp2_small_council_modifier:0 "สภาแห่งโตเลโด"
 fp2_small_council_modifier_desc:0 "สภาท้องถิ่นของพระราชาคณะได้จัดขึ้นในโตเลโด นำความเจริญรุ่งเรืองมาสู่เมือง"
 fp2_big_council_modifier:0 "$fp2_small_council_modifier$"
 fp2_big_council_modifier_desc:0 "สภาขนาดใหญ่ของพระราชาคณะได้จัดขึ้นในโตเลโด นำความเจริญรุ่งเรืองอย่างยิ่งมาสู่เมือง"
 fp2_disappointing_council_modifier:0 "$fp2_small_council_modifier$"
 fp2_disappointing_council_modifier_desc:0 "สภาของพระราชาคณะที่มีผู้เข้าร่วมน้อยอย่างน่าผิดหวังได้จัดขึ้นในโตเลโด ทำให้พ่อค้าในเมืองต้องเสียค่าใช้จ่าย"
 fp2_stifled_council_modifier:0 "สภาที่ถูกขัดขวาง"
 fp2_stifled_council_modifier_desc:0 "การขัดแย้งกับสภาศาสนา ทำให้ตัวละครนี้ไม่เป็นที่นิยมในหมู่นักบวช"
 fp2_council_conversion_modifier:0 "สภาแห่งการเปลี่ยนศาสนา"
 fp2_council_conversion_modifier_desc:0 "สภาแห่งโตเลโดครั้งล่าสุดสนับสนุนการเปลี่ยนศาสนาของคนนอกศาสนาในอาณาจักรโมซาราบ"
 fp2_council_tolerance_modifier:0 "สภาแห่งการอดทนอดกลั้น"
 fp2_council_tolerance_modifier_desc:0 "สภาแห่งโตเลโดครั้งล่าสุดสนับสนุนการอดทนอดกลั้นระหว่างศาสนาต่างๆ ในไอบีเรีย"
 fp2_council_reform_modifier:0 "สภาแห่งการปฏิรูป"
 fp2_council_reform_modifier_desc:0 "สภาแห่งโตเลโดครั้งล่าสุดสนับสนุนการปฏิรูปคริสตจักรโมซาราบ เนื่องจากอำนาจใหม่ของมัน"
 fp2_council_rights_modifier:0 "สภาแห่งสิทธิ"
 fp2_council_rights_modifier_desc:0 "สภาแห่งโตเลโดครั้งล่าสุดสนับสนุนการคุ้มครองสิทธิของนักบวชและการซ่อมแซมโบสถ์"
 fp2_council_hof_modifier:0 "สภาแห่งความเป็นผู้นำ"
 fp2_council_hof_modifier_desc:0 "สภาแห่งโตเลโดครั้งล่าสุดสนับสนุนให้ชาวโมซาราบ แต่งตั้งประมุขแห่งศรัทธาของตนเอง"
 fp2_council_pope_modifier:0 "สภาแห่งความร่วมมือ"
 fp2_council_pope_modifier_desc:0 "สภาแห่งโตเลโดครั้งล่าสุดสนับสนุนความร่วมมือระหว่างชาวโมซาราบและโลกคริสเตียนในวงกว้าง"
 fp2_council_heresy_modifier:0 "สภาแห่งการไต่สวนศรัทธา"
 fp2_council_heresy_modifier_desc:0 "สภาแห่งโตเลโดครั้งล่าสุดสนับสนุนการกำจัดพวกนอกรีตที่เกิดขึ้นในไอบีเรีย"
