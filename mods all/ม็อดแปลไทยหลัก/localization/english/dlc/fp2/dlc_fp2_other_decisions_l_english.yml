 secure_iberian_foothold_decision_title:0 "ฐานที่มั่นในไอบีเรีย"
 secure_iberian_foothold_decision_desc:0 "รัฐที่ทำสงครามกันจนอ่อนแอในไอบีเรียได้เปิดประตูคาบสมุทรให้แก่คนนอก หากผู้ใดสามารถประกาศตนเป็นผู้นำ [ROOT.Char.GetFaith.GetReligion.GetAdjectiveNoTooltip] คนใหม่ของภูมิภาค หรือเป็นเพียงผู้รุกรานอันรุ่งโรจน์ ก็จะได้รับประโยชน์มากมาย"
 secure_iberian_foothold_decision_tooltip:0 "ผนวกส่วนหนึ่งของไอบีเรีย"
 secure_iberian_foothold_decision_confirm:0 "แด่ผู้แข็งแกร่งที่สุด"
