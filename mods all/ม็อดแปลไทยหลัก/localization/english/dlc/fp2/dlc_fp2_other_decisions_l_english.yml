 found_kingdom_toledo_decision_title:0 "สถาปนาอาณาจักรโตเลโด"
 found_kingdom_toledo_decision_desc:0 "นับตั้งแต่อาณาจักรวิซิกอธล่มสลายแก่ชาวมัวร์ [GetTitleByKey('c_toledo').GetNameNoTier] ก็ถูกลดความสำคัญลง ในฐานะเมืองหลวงของอาณาจักร [ROOT.Char.GetFaith.GetAdjective] ใหม่ มันจะเป็นที่ประทับของกษัตริย์อีกครั้ง"
