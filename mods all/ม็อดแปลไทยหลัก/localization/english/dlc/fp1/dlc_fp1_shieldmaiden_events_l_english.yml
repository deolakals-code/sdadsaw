l_english: 
 ##################################################
 # #Ordinary Events
 fp1_shieldmaiden.0001.t:0 "ผู้ที่อาจเป็น [shieldmaiden.Custom('ShieldPersonFemaleMale')]"
 fp1_shieldmaiden.0001.desc:0 "[ROOT.Char.Custom('FormOfAddressForLiege')|U], ข้ามาต่อหน้าท่านเพื่อขอโอกาสพิสูจน์ตนเอง," [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('shieldmaiden'))] ของข้า, [shieldmaiden.GetTitledFirstName], กล่าว ข้าขยับตัวเล็กน้อยบนบัลลังก์ด้วยความสนใจ, ขณะที่ราชสำนักรอบตัวเราต่างเงี่ยหูฟัง\n\n"แม้จะทัดเทียมกับ $knight_culture_player_plural_no_tooltip_lowercase$ ใด ๆ ของท่าน, ข้ากลับถูกห้ามมิให้เข้าร่วมในแนวโล่หรือบัญชาการกองทัพของท่าน ข้าขอท้าทาย [challenged_knight.GetTitledFirstName] ประลอง, เพื่อแสดงฝีมือในการรบของข้า""
 fp1_shieldmaiden.0001.a:0 "ดีมาก เจ้าประลองกับ [challenged_knight.GetTitledFirstNameNoTooltip] ได้"
 fp1_shieldmaiden.0001.a.tt_success:0 "[challenged_knight.GetFirstNameNoTooltip] เป็นฝ่ายมีชัย"
 fp1_shieldmaiden.0001.a.tt_failure:0 "[shieldmaiden.GetFirstNameNoTooltip] เป็นผู้ชนะ"
 fp1_shieldmaiden.0001.b:0 "[challenged_knight.GetFirstNameNoTooltip] รึ? โอ ไม่ เจ้าจะต้องสู้กับ #EMP ข้า#!!"
 fp1_shieldmaiden.0001.b.tt_success:0 "ท่านเอาชนะ [shieldmaiden.GetFirstNameNoTooltip]"
 fp1_shieldmaiden.0001.b.tt_failure:0 "[shieldmaiden.GetFirstNameNoTooltip] ทำให้ท่านเสียหลัก"
 fp1_shieldmaiden.0001.c:0 "เพียงแค่กล้าเอ่ยปากขอก็นับว่ากล้าหาญพอแล้ว"
 fp1_accepted_shieldmaiden_without_question:0 "ทุก [courtier|E] และ [vassal|E] ที่คิดว่า [shieldmaiden.GetWomenMen] สู้ไม่ได้"
 fp1_shieldmaiden.0001.d:0 "[shieldmaiden.Custom('ShieldPersonFemaleMale')] รึ? น่าขันสิ้นดี!"

 fp1_shieldmaiden.0011.t:0 "[shieldmaiden.Custom('ShieldPersonFemaleMale')] ขัดขวางการหลบหนี"
 fp1_shieldmaiden.0011.desc:0 "การสะเดาะกุญแจห้องขังของข้าพิสูจน์ว่าง่ายกว่าที่คาดไว้ การหลบเลี่ยงยามแล้วยามเล่ายากกว่า แต่ข้าก็ทำได้ ย่องไปดุจเงาออกจากคุกของข้า\n\nจนกระทั่งข้าแทบจะ #EMP ลิ้มรส#! อิสรภาพได้อยู่แล้ว มันก็ถูกฉกฉวยไปจากข้า เมื่อเลี้ยวหัวมุม [shieldmaiden.GetTitledFirstName], [shieldmaiden.Custom('ShieldPersonFemaleMale')|L] ของ [imprisoner.GetFirstNamePossessive] ปรากฏตัวออกมาจากความมืด\n\nข้าไม่ทันสังเกตเห็นกระบองของ [shieldmaiden.GetHerHis] ด้วยซ้ำ จนกระทั่งมันเหวี่ยงตรงมาที่ใบหน้าข้า"
 fp1_shieldmaiden.0011.a:0 "เดี๋ยว ไม่นะ อย่— อ๊ากกก!"
 fp1_shieldmaiden.0012.t:0 "$fp1_shieldmaiden.0011.t$"
 fp1_shieldmaiden.0012.desc:0 "[prisoner.GetTitledFirstName] ถูกนำกลับไปคุมขังในช่วงเช้ามืดของวันนี้ หลังจากเกือบหลบหนีสำเร็จในตอนกลางคืน\n\nดูเหมือนว่านักโทษจะลอบผ่านยามส่วนใหญ่ไปได้ ก่อนที่จะถูกสังเกตเห็นโดย [shieldmaiden.GetTitledFirstName] ซึ่งออกมาเดินเล่นยามดึก เพราะกระสับกระส่าย\n\n[shieldmaiden.Custom('ShieldPersonFemaleMale')] ของข้าลงมือทุบตี [prisoner.GetFirstNameNoTooltip] จนเลือดตกยางออก ในที่สุดจึงลาก [prisoner.GetHerHim] กลับไปหาผู้คุมของ [prisoner.GetHerHis]"
 fp1_shieldmaiden.0012.a:0 "ทำได้ยอดเยี่ยมมาก [shieldmaiden.GetFirstNameNoTooltip]"
 fp1_shieldmaiden.0012.b:0 "เหตุใดเจ้าจึงทุบตี [prisoner.GetHerHim] รุนแรงถึงเพียงนั้น?!"

 fp1_shieldmaiden.0021.t:0 "$murder_save_header$ [shieldmaiden.Custom('ShieldPersonFemaleMale')]"
 fp1_shieldmaiden.0021.desc.assassin:0 "นักฆ่าของข้าล้มเหลวในการสังหาร [target.GetTitledFirstName]! เห็นได้ชัดว่า [shieldmaiden.Custom('ShieldPersonFemaleMale')] ของ [target.GetFirstNamePossessiveNoTooltip] [shieldmaiden.GetTitledFirstName] เข้าขัดขวาง ปรากฏตัวเพียงไม่กี่วินาทีก่อนที่การฆาตกรรมจะเกิดขึ้นและจัดการนักฆ่ารับจ้างของข้า"
 fp1_shieldmaiden.0021.desc.thugs:0 "อันธพาลที่ข้าจ้างไปสังหาร [target.GetTitledFirstName] ล้มเหลวในภารกิจ! แม้จะมีความโหดเหี้ยม แต่ [shieldmaiden.Custom('ShieldPersonFemaleMale')] ของ [target.GetFirstNamePossessiveNoTooltip] ก็สามารถปกป้อง [target.GetHerHim] ให้พ้นภัยได้นานพอที่ยามของ [target.GetHerHis] จะสามารถรวมกำลังกันและจัดการโจรที่เหลือได้"
 fp1_shieldmaiden.0021.desc.mob:0 "ขณะที่กลุ่มคนที่ข้ายุยงให้สังหาร [target.GetTitledFirstName] สามารถลาก [target.GetHerHim] ลงจากหลังม้า [target.GetHerHis] ได้ พวกเขาก็ไม่สามารถทำงานให้เสร็จสิ้นได้ก่อนที่ [shieldmaiden.Custom('ShieldPersonFemaleMale')] ของ [target.GetFirstNamePossessiveNoTooltip] จะเข้ามาแทรกแซง [shieldmaiden.GetSheHe|U] สังหารชาวนาที่อยู่ในระยะโจมตีของ [target.GetFirstNameNoTooltip] อย่างไร้ความปรานี และ ทำให้คนอื่นๆ หวาดกลัวจนหนีไป"
 fp1_shieldmaiden.0021.desc.lured_into_forest:0 "ข้าคิดว่าแผนการของข้าที่จะ ทำให้ [target.GetTitledFirstName] หลงทางในป่าสำเร็จลุล่วงไปด้วยดีเมื่อค่ำคืนมาถึงโดยไม่มีวี่แววของ [target.Custom('GirlBoy')] ผู้หลงทาง\n\nโชคไม่ดีนัก ทันทีที่ข้ากำลังจะเข้านอน ข้าก็ได้รับข่าวว่า [shieldmaiden.Custom('ShieldPersonFemaleMale')] ของ [target.GetFirstNamePossessiveNoTooltip] โผล่ออกมาจากป่าพร้อมกับ [target.Custom('GirlBoy')] เห็นได้ชัดว่า [shieldmaiden.GetSheHe] รับหน้าที่ [shieldmaiden.GetHerselfHimself] ในการติดตามร่องรอยของ [target.GetFirstNamePossessiveNoTooltip] ผ่านป่าและพบเขาก่อนที่สัตว์ร้ายที่หิวโหยจะพบ"
 fp1_shieldmaiden.0021.desc.child_pushed:0 "[target.Custom('GirlBoy')] ตัวน้อยน่าโง่ที่จะเป็น [target.GetTitleAsNameNoTooltip] โง่พอที่จะตกหลุมพรางของข้า! [target.GetFirstName] ปีนขึ้นไปบนขอบระเบียงตามแผน และสายลับของข้าก็ผลัก [target.GetHerHim] ตกลงไปในอากาศ...\n\n.. แต่สิ่งที่ควรจะเป็นการตกที่ถึงตายกลับไม่เป็น เช่นนั้น เมื่อ [target.GetSheHe] ถูกรับไว้โดย [shieldmaiden.Custom('ShieldPersonFemaleMale')] ของ [target.GetHerHis] ก่อนที่จะถึงพื้น [target.GetSheHe|U] รอดชีวิตไปเห็นวันใหม่ และไม่น่าจะหลงกลอุบายนั้นอีก"
 fp1_shieldmaiden.0021.shieldmaiden_dies:0 "\n\nอย่างน้อยที่สุด [shieldmaiden.GetFirstNameNoTooltip] ก็จะไม่สร้างปัญหาให้ข้าอีก เนื่องจาก [shieldmaiden.GetSheHe] ได้ตายจากบาดแผลของ [shieldmaiden.GetHerHis]"
 fp1_shieldmaiden.0021.a:0 "มันจบแล้ว..."
 fp1_shieldmaiden.0021.b:0 "... มันยังไม่จบจนกว่าข้าจะบอกว่าจบ!"
 fp1_shieldmaiden.0022.t:0 "$murder_save_header$ [shieldmaiden.Custom('ShieldPersonFemaleMale')]"
 fp1_shieldmaiden.0022.desc.assassin:0 "ข้าเกือบ #EMP ตาย#! วันนี้! หาก [shieldmaiden.GetFirstName] ไม่สังเกตเห็นบางอย่างผิดปกติและตามข้ามายังห้องพัก ป่านนี้ข้าคงกลายเป็นศพไปแล้ว\n\nสิ่งแรกที่ข้าได้ยินเกี่ยวกับนักฆ่าคือ [shieldmaiden.GetFirstNameNoTooltip] พุ่งเข้าชนใครบางคนลงกับพื้นทันทีข้างหลังข้า จากนั้นมันก็เป็นภาพพร่ามัวของมีดและหมัด จนกระทั่งผู้โจมตีล้มลงตาย"
 fp1_shieldmaiden.0022.desc.assassin.shieldmaiden_dies:0 "\n\nน่าเศร้าที่ [shieldmaiden.GetFirstNameNoTooltip] ต้องชดใช้ด้วยราคาสูงสุด แม้ว่านักฆ่าจะตายแล้ว แต่บาดแผลของ [shieldmaiden.GetHerHis] ก็ถึงแก่ชีวิต"
 fp1_shieldmaiden.0022.desc.thugs:0 "ข้ากำลังเดินทางพร้อมคณะผู้ติดตามเมื่อมีเสียงตะโกนดังมาจากหมู่ไม้ "โจมตี! จัดการ [ROOT.Char.GetTitleTierName]!" การซุ่มโจมตี!\n\nนี่ไม่ใช่แค่โจรป่าที่ต้องการทองคำของข้า แต่เป็นอันธพาลที่ต้องการชีวิตข้า! [shieldmaiden.Custom('ShieldPersonFemaleMale')] ของข้า [shieldmaiden.GetFirstNameNoTooltip] รีบเข้ามาป้องกันข้า ใช้ร่างของ [shieldmaiden.GetHerHis] ขวางกั้นระหว่างโจรป่ากระหายเลือดกับตัวข้า\n\n[shieldmaiden.GetFirstNameNoTooltip|U] ทำการต่อสู้พลางถอยพลางขณะที่ศัตรูรุมเข้ามายังตำแหน่งของเราพร้อมกับตวัดดาบ แต่ในไม่ช้ายามคนอื่น ๆ ของข้าก็สามารถรวมกำลังมาป้องกันเราและฟันผู้โจมตีที่เหลือได้"
 fp1_shieldmaiden.0022.desc.thugs.shieldmaiden_dies:0 "เมื่อการต่อสู้สงบลงเท่านั้นที่ [shieldmaiden.GetSheHe] ทรุดลงกับพื้น และข้าจึงพบว่า [shieldmaiden.GetHerHis] มีบาดแผลลึก [shieldmaiden.GetSheHe] ปกป้องข้าอย่างแท้จริงจนถึงลมหายใจสุดท้าย..."
 fp1_shieldmaiden.0022.desc.mob:0 "ข้ากำลังขี่ม้าไปตามถนนของ [home_province.GetName] เมื่อฝูงชาวนาที่กรีดร้องและตะโกนกรูเข้ามายังคณะผู้ติดตามของข้า ก่อนที่ข้าจะรู้ว่าเกิดอะไรขึ้น ชาวบ้านก็ฉุดข้าลงจากหลังม้าและเริ่มทุบตีข้า!\n\n[shieldmaiden.Custom('ShieldPersonFemaleMale')] ของข้า [shieldmaiden.GetFirstName] รีบเข้ามาป้องกันข้าพร้อมกับ [shieldmaiden.Custom('signature_weapon')] ในมือ [shieldmaiden.Custom('SignatureWeaponWoundVerb1PresentParticiple')] ใส่ชาวนาที่กำลังทำร้ายข้าอย่างโหดเหี้ยม และอาจจะดูไม่สง่างามนัก ปกป้องข้าจากอันตรายเพิ่มเติมขณะที่ข้าถูกฝังอยู่ใต้ศพของพวกเขา"
 fp1_shieldmaiden.0022.desc.mob.shieldmaiden_lives:0 "\n\nหลังจากเสียงการต่อสู้เงียบลง [shieldmaiden.GetFirstNameNoTooltip] กลิ้งศพออกจากตัวข้าและช่วยพยุงข้าให้ลุกขึ้น นอกจากพวกเราแล้ว ถนนก็ร้างไปหมด ผู้สมรู้ร่วมคิดทั้งหมดตายหรือหนีไปแล้ว"
 fp1_shieldmaiden.0022.desc.mob.shieldmaiden_dies:0 "\n\nเมื่อข้าดึงตัวเองออกจากกองศพได้ ถนนก็ร้างไปแล้ว ยกเว้นร่างของผู้ตาย — [shieldmaiden.GetFirstNameNoTooltip] อยู่ในหมู่พวกเขาด้วย"
 fp1_shieldmaiden.0022.desc.lured_into_forest:0 "ข้ากำลังเล่นซ่อนหากับข้าราชสำนักบางคนในป่าเมื่อข้าตระหนักว่านานมากแล้วที่ข้าไม่ได้ยินใครตามหาข้า นานเกินไป\n\nข้าตะโกนเรียก แต่ไม่ได้ยินอะไรเลย ข้าถูกทอดทิ้ง... ข้าพยายามหาทางกลับบ้าน แต่ข้าไม่รู้ว่าทางไหนเป็นทางไหน และมันก็มืดลงอย่างรวดเร็ว\n\nในไม่ช้าข้าก็ได้ยินเสียงสัตว์ร้ายเคลื่อนไหวอยู่ท่ามกลางหมู่ไม้ แต่ก่อนที่พวกมันจะมาถึงตัวข้า [shieldmaiden.Custom('ShieldPersonFemaleMale')] ของข้า [shieldmaiden.GetFirstName] ก็มาถึง หายใจหอบและชูคบเพลิงลุกโชน ไฟดูเหมือนจะขับไล่สัตว์ร้าย ซึ่งรักษาระยะห่างขณะที่ [shieldmaiden.GetSheHe] หอบหายใจ "กลับ...บ้านกันเถอะ...ฝ่าบาท...""
 fp1_shieldmaiden.0022.desc.child_pushed:0 "\n\n#EMP ตุ้บ#! \n\nข้าตกลงสู่อ้อมแขนของ [shieldmaiden.Custom('ShieldPersonFemaleMale')] ของข้า, [shieldmaiden.GetFirstNameNoTooltip] "เด็กโง่! ถ้าข้ามาช่วยเจ้าไม่ทัน... ช่างเถอะ ไปหาที่ปลอดภัยกันเถอะ""
 fp1_shieldmaiden.0022.owner_discovered:0 "\n\nมีเพียงคนเดียวเท่านั้นที่อาจเป็นผู้รับผิดชอบต่อการโจมตีครั้งนี้: [owner.Custom2('MyCharacterIntroductionNoComma', ROOT.Char)]!"
 fp1_shieldmaiden.0022.a:0 "ใครกันที่ต้องการให้ #EMP ข้า#! ถูกฆ่า?"
 fp1_shieldmaiden.0022.b:0 "[owner.GetSheHe|U] จะต้องชดใช้สำหรับเรื่องนี้!"

 fp1_shieldmaiden.0032.t:0 "[shieldmaiden.Custom('ShieldPersonFemaleMale')] ได้รับประสบการณ์"
 fp1_shieldmaiden.0032.desc.root:1 "ระหว่างสงคราม การรักษาทักษะให้เฉียบคมเป็นสิ่งสำคัญ\n\nนโยบายนี้คือสิ่งที่ ทำให้ข้าลงไปที่ลานฝึก ทุบตี ทะเลาะวิวาท และดุด่าทหารของข้าอย่างโหดเหี้ยมในการรบจำลองครั้งที่สามของวัน\n\nพวกเขาร้องครวญครางเมื่อข้าเรียกพวกเขากลับมารวมกันเป็นครั้งที่สี่ ปล่อยให้พวกเขาร้องครวญครางไปเถอะ: ข้ามีการฝึกที่ต้องทำ"
 fp1_shieldmaiden.0032.desc.courtier:1 "การเฝ้าดู [shieldmaiden.GetTitledFirstName] ฝึกฝนเป็นประสบการณ์เสมอ [shieldmaiden.GetSheHe|U] ต่อสู้อย่างดุเดือด รุนแรง จนง่ายที่จะลืมว่า [shieldmaiden.GetSheHe] กำลังทำการปะทะจำลองเท่านั้น\n\nอุปกรณ์ที่เสียหายและทหารที่บอบช้ำเกลื่อนกลาดในสนาม ช่วงพักการต่อสู้ส่งเสียงครวญครางอย่างโล่งอกดังขึ้นจากคู่ซ้อมที่อ่อนแรงของ [shieldmaiden.GetHerHis]\n\nแต่แล้ว การพักก็สิ้นสุดลง และ [shieldmaiden.GetFirstNameNoTooltip] ก็กลับมาสู้อีกครั้ง"
 fp1_shieldmaiden.0032.a.root:0 "กำแพงโล่ของข้าไม่มีวันแตก!"
 fp1_shieldmaiden.0032.a.courtier:0 "ดูวิธีที่ [shieldmaiden.GetSheHe] บัญชาการกำแพงโล่นั่นสิ!"
 fp1_shieldmaiden.0032.b.root:0 "ข้าเหวี่ยงดาบแรงเท่า [shieldmaiden.GetFaith.WarGodName]!"
 fp1_shieldmaiden.0032.b.courtier:0 "ดู [shieldmaiden.GetHerHim] ตวัดดาบของ [shieldmaiden.GetHerHis] สิ!"
 fp1_shieldmaiden.0032.c.root:0 "ข้ามองเห็นทุกจุดอ่อนในศัตรูของข้า!"
 fp1_shieldmaiden.0032.c.courtier:0 "[shieldmaiden.GetSheHe|U] หาช่องว่างเจอเสมอ!"
