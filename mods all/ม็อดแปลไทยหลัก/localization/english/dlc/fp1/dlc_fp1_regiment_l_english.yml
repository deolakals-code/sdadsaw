l_english: 
 # Cultural MaA
 bondi:0 "บอนดิ"
 vigmen:0 "วิกเมน"
 varangian_veterans:0 "ทหารผ่านศึกวารังเจียน"
 jomsviking_pirates:0 "โจรสลัดยมส์ไวกิง"

 # MaA Flavour
 bondi_flavor:0 "#F บอนดิเป็นชนชั้นเจ้าของที่ดินอิสระ, มักเป็นนักเดินเรือผู้ชำนาญ, ใช้เรือยาว (longship) เพื่อค้าขายหรือออกปล้นสะดม (viking). พวกเขาต่อสู้โดยใช้หอกและโล่.#!"
 vigmen_flavor:0 "#F นักรบแนวหน้าสร้างกำแพงโล่อันแข็งแกร่งเพื่อปกป้องพลธนูที่อยู่ด้านหลัง. กลยุทธ์นี้ขัดขวางพลรบเบา (skirmishers) ขณะที่ช่วยให้รุกคืบหน้าได้อย่างมั่นคง.#!"
 varangian_veterans_flavor:0 "#F นักสำรวจ, นักผจญภัย, นักรบ, และทหารรับจ้างจากทั่วอาณานิคมนอร์ดิกอันห่างไกล. บางคนเคยรับใช้ในกององครักษ์วารังเจียนด้วยซ้ำ.#!"
 jomsviking_pirates_flavor:0 "#F หนึ่งในกลุ่มผู้รุกรานที่ฉาวโฉ่ที่สุดที่เคยล่องเรือในทะเลบอลติก, ยมส์ไวกิงเชี่ยวชาญในการสร้างความโกลาหลในสนามรบ, ยืดเยื้อการต่อสู้ก่อนที่จะเป็นเลิศในช่วงหลัง.#!"
