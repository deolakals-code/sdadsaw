 innovation_all_things:0 "มหาชุมนุมชน"
 innovation_all_things_desc:0 "ในหมู่ชนของเรา มีธรรมเนียมประเพณีอันแข็งแกร่งในการชุมนุมสาธารณะของเหล่าผู้ใหญ่ที่เป็นไทและมีอำนาจทั้งปวง, ซึ่งผู้ใดก็ตามสามารถร้องทุกข์ต่อผู้ปกครองได้ แน่นอนว่า สำหรับผู้ที่โดดเด่นในสายตาของสามัญชน, ย่อมมีอำนาจในการชักจูงฝูงชนได้..."
