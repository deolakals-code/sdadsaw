 innovation_varangian_adventurers:0 "นักผจญภัยชาววารังเจียน"
 innovation_varangian_adventurers_desc:0 "เราเป็นหนี้บุญคุณอันใดต่อแผ่นดินที่เราอาศัยอยู่รึ? หามิได้! หัวใจของอาณาจักรคือผู้คน, แล้วเรามิสมควรได้รับผืนดินอันอุดมที่สุด, มหาสมบัติอันยิ่งใหญ่ที่สุด, และราชวังอันวิจิตรที่สุดดอกรึ? การได้มา ซึ่งสิ่งเหล่านี้ง่ายดายเพียงแค่ #EMP การยึดครอง#! มันมาเท่านั้น!"
