 ACHIEVEMENT_DESC_faster_than_the_fox_achievement:1 "เริ่มต้นและคงอยู่เป็น$north_germanic_group$ $norse_pagan_adherent$ ประเภทใดก็ได้ [completely_control|E][kingdom|E] $k_sicily$ ก่อนปี 1047 $rd_character_blocked_from_achievement$"
