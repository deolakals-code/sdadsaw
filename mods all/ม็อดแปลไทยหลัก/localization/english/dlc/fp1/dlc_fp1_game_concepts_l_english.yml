 game_concept_designate_chief_sacrifice:0 "กำหนดเครื่องสังเวยหลัก"
 game_concept_designate_chief_sacrifice_article:0 "การกำหนดเครื่องสังเวยหลัก"
 game_concept_designate_chief_sacrifice_chief_sacrifice:0 "เครื่องสังเวยหลัก"
 game_concept_designate_chief_sacrifice_desc:0 "เมื่อจัดเทศกาลสังเวยอันยิ่งใหญ่ [characters|E]อาจกำหนดให้หนึ่งใน[prisoners|E]ของตนเป็นเครื่องสังเวยหลัก $game_concept_prisoner$ผู้นี้จะถูกสังหารเป็นคนแรก และอาจ ทำให้ผู้ประกอบพิธีได้รับ[piety|E]มากขึ้น\n\nเครื่องสังเวยที่พึงประสงค์คือ:\n$EFFECT_LIST_BULLET$ $game_concept_characters$ไร้ที่ดิน ซึ่งมี[faith|E]เป็น[faith_hostile|L]หรือ[faith_evil|L]\n$EFFECT_LIST_BULLET$ [landed|E]$game_concept_characters$ที่มี[rank|E]อย่างน้อยระดับ[count|E]\n$EFFECT_LIST_BULLET$ [heads_of_faith|E]( แม้ว่าสิ่งนี้อาจมีผลกระทบตามมา)"
 game_concept_varangian_adventure:0 "การผจญภัยแบบวารังเจียน"
 game_concept_varangian_adventures:0 "การผจญภัยแบบวารังเจียน"
 game_concept_varangian_adventuring:0 "การผจญภัย"
 game_concept_varangian_adventure_adventure:0 "การผจญภัย"
 game_concept_varangian_adventure_desc:0 "นี่คือ[war|E]ประเภทพิเศษ ซึ่งผู้โจมตีตั้งใจจะย้าย[realm|E]ของตนไปยัง[war_target|E]ทั้งหมด\n\nหากพวกเขาชนะ พวกเขาจะผนวก[counties|E]ที่เหมาะสมทันทีและย้าย[capital|E]ของตนไปที่นั่น ข้าในบังคับเก่าของพวกเขาจะกลายเป็นอิสระ และ$game_concept_counties$เก่าของพวกเขาจะถูกมอบให้กับขุนศึกท้องถิ่นที่เพิ่งตั้งตัว $game_concept_varangian_adventures$มีให้#EMP เฉพาะ#! สำหรับ[rulers|E]ระดับ[duke|E]และ$game_concept_count$-[title_tier|E]เท่านั้น โดยจะมีค่าใช้จ่ายเพิ่มขึ้นเรื่อยๆ ใน แต่ละ$game_concept_varangian_adventure_adventure$ที่ประสบความสำเร็จ\n\n[casus_belli|E]นี้#EMP ไม่มีทาง#! ใช้ได้หลังจาก$culture_era_tribal$[era|E] และไม่สามารถใช้กับ[cultures|E]อื่นที่สามารถ$game_concept_varangian_adventure_adventure$ได้ หรือใช้กับ$game_concept_rulers$เพื่อนบ้าน\n\n$north_germanic_group_collective_noun$ที่เริ่ม$game_concept_varangian_adventure$ครั้งแรกจะได้รับ[special_troops|E]โบนัสสูงสุดถึง [EmptyScope.ScriptValue('varangian_adventurers_standard_levy_cap_value')|0]นาย จำนวนจะเพิ่มขึ้นตามทุกเคาน์ตีที่มี[faith|E]และ[culture|E]เดียวกันที่พวกเขาควบคุมโดยสมบูรณ์ภายใน[GetGeographicalRegion('dlc_fp1_region_core_mainland_scandinavia').GetName]"
 game_concept_trial_by_combat:0 "การตัดสินคดีด้วยการประลอง"
 game_concept_trials_by_combat:0 "การตัดสินคดีด้วยการประลอง"
 game_concept_trial_by_combat_trial:0 "การตัดสินคดี"
 game_concept_trial_by_combat_combat:0 "การประลอง"
 game_concept_trial_by_combat_desc:0 "ในบาง[cultures|E] ปัญหาที่ไม่สามารถยุติได้ด้วยคำพูดหรือสงครามถือเป็นเหตุผลสำหรับ$game_concept_trial_by_combat$แทน หากยอมรับ [characters|E]ทั้งสองจะเข้าร่วม[single_combat_duel|E]เพื่อชิงถิ่นฐานที่เลือกไว้ล่วงหน้า หากฝ่ายผู้กระทำผิดชนะ พวกเขาจะพิสูจน์ความบริสุทธิ์ของตน\n\nข้อกำหนดทั่วไปสำหรับ$game_concept_trial_by_combat_trial$ดังกล่าวคือ:\n$EFFECT_LIST_BULLET$ท่านทั้งสองต้องมีวัฒนธรรมที่ถูกต้อง\n$EFFECT_LIST_BULLET$ท่านต้องมี[imprisonment_reason|E]ต่อพวกเขา ( ซึ่งจะถูกใช้ไป)\n$EFFECT_LIST_BULLET$พวกเขาต้องไม่ใช่[liege|E] [vassal|E] หรือ[guest|E] หรือ[courtier|E]ของท่านหรือ$game_concept_vassals$คนใดคนหนึ่งของท่าน\n\n$game_concept_characters$ที่ไม่เหมาะที่จะต่อสู้ด้วยตนเองยังคงสามารถถูกท้าทายได้ตราบเท่าที่พวกเขาเป็น[rulers|E] โดยเสนอชื่อ[knight|E]ให้ต่อสู้ในนามของพวกเขาแทน\n\n$game_concept_trial_by_combat_combat$อาจเลือกที่จะต่อสู้จนถึง[character_death_death|E]ได้ก็ต่อเมื่อฝ่ายผู้เสียหายเป็น[tribal|E]และ$game_concept_characters$ทั้งสองกำลังต่อสู้ด้วยตนเองใน$game_concept_single_combat_duel$ หากฝ่ายผู้กระทำผิดต้องเสนอชื่อตัวแทนเพื่อต่อสู้ในนามของพวกเขา $game_concept_character_death_death$ก็ไม่ใช่ทางเลือก"
