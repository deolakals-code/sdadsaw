l_english: 

 health.1015.t: "[SCOPE.Custom('EventTitleDisease')]: ความทุกข์ทรมานเล็กน้อย"
 health.1015.desc: "#EMP คันเหลือเกิน!#! ข้าตื่นขึ้นกลางดึกและพบว่าขาของข้ามีเลือดออก เล็บของข้าก็ เช่นกัน อาการคันรุนแรงมากจนข้าหยุดเกาให้ลึกลงไปไม่ได้\n\nข้าจุ่มหน้าลงในน้ำเย็นหวังว่ามันจะหายไป เงาสะท้อนของข้า — ดวงตาสีแดง"
 health.1015.court_physician.desc: "\n\n"[ROOT.Char.Custom('FormOfAddressForLiege')|U] นั่นคือโรคภัยที่รู้จักกันในนามโรคหัดพ่ะย่ะค่ะ""
 health.1015.a: "ข้าทนไม่ไหวแล้ว!"
 health.1016.t: "[SCOPE.Custom('EventTitleDisease')]: น้ำพุสีเลือด"
 health.1016.desc: "#EMP อ๊ากกก!#! ข้ากุมท้องด้วยความเจ็บปวด ข้าจำไม่ได้แล้วว่าใช้เวลาอยู่ในส้วมนี้ไปนานเท่าใด ชั่วโมง วัน? #EMP สัปดาห์?#! อ๊ากกกกกก อุจจาระปนเลือด ทำให้เจ็บปวดมากขึ้นทุกครั้ง กลิ่นก็ไม่ได้ช่วยอะไรเลย\n\nข้ารู้สึกเหมือนกำลังจะเป็นลม..."
 health.1016.court_physician.desc: "\n\n"ข้าเกรงว่าอาจเป็นโรคระบาดจากการปิดล้อม [ROOT.Char.Custom('FormOfAddressForLiege')].""
 health.1016.a: "ได้โปรด... ขอน้ำ"
 health.1017.t: "[SCOPE.Custom('EventTitleDisease')]: ความแผดเผา"
 health.1017.desc: "ข้าหยุดการเคลื่อนไหวไม่ได้ หยุด! หยุดเดี๋ยวนี้! แขนของข้าสั่นไม่หยุด และข้าเห็นนิ้วมือของข้าเปลี่ยนเป็นสีดำ อาการกระตุกแล่นไปทั่วร่าง — ราวกับว่าข้ากำลังเต้นรำ\n\nมันคือไฟทั้งหมด หยุดมัน! #EMP หยุดมันเดี๋ยวนี้!#!"
 health.1017.court_physician.desc: "\n\n"ดูเหมือนท่านจะโดนไฟของ [ROOT.Char.GetFaith.HouseholdGodName] [ROOT.Char.Custom('FormOfAddressForLiege')].""
 health.1017.a: "ทำให้มันหยุดที!"
 health.1112.t: "[SCOPE.Custom('EventTitleDisease')]: โอกาสที่จะหายใจ"
 health.1112.desc: "ข้านั่งลงบนเตียงและมองดูมือของข้า หงายฝ่ามือขึ้น ในที่สุด ผื่นก็หายไปและผิวของข้ากลับมาเป็นสีปกติแล้ว\n\nเกือบจะแปลกที่สามารถหายใจได้อีกครั้งโดยไม่มีอาการคันรุนแรงนั้น"
 health.1112.a: "ได้เวลากลับไปทำหน้าที่แล้ว"
 health.1112.a.tt: "บัดนี้ข้ามีภูมิคุ้มกันต่อ [GetTrait('measles').GetName( GetNullCharacter )]"
 health.1113.t: "[SCOPE.Custom('EventTitleDisease')]: การพักผ่อน"
 health.1113.desc: "ครั้งแรกที่ข้าสามารถคิดได้อย่างชัดเจนอีกครั้ง ข้าแทบไม่รู้ตัว หมอกที่เคยปกคลุมศีรษะของข้าดูเหมือนจะจางหายไปโดยไม่มีสัญญาณเตือน\n\nในที่สุดอาหารและน้ำก็สามารถอยู่ในร่างกายของข้าได้ และข้ารู้สึกอยาก [ROOT.Char.Custom('FavoriteTreatDemand')] อย่างรุนแรง"
 health.1113.a: "ได้เวลาไปหาอะไรกินแล้ว"
 health.1114.t: "[SCOPE.Custom('EventTitleDisease')]: กลับสู่สภาวะปกติ"
 health.1114.desc: "ข้าลุกออกจากเตียงและภาพนิ้วมือสีสุขภาพดีนั้นหาได้ยากราวกับกวางเผือก ในที่สุดร่างกายของข้าก็ประทานความสงบให้ข้า อาการกระตุกหายไปไหนหมด — ไม่มีการเต้นรำอีกต่อไป\n\nข้าถอนหายใจอย่างโล่งอก สันติสุข ข้าคิดถึงมันเพียงใด"
 health.1114.a: "ต่อจากนี้ข้าจะเต้นรำเฉพาะในงานเลี้ยงเท่านั้น"
 epidemic_events.0001.t: "มันเติบโตขึ้น"
 epidemic_events.0001.desc: "ราตรีมาเยือน ข้ากำโต๊ะวางแผนที่ทำจากไม้แน่น หลับตาลง เหงื่อหยดลงบนพื้นผิว อ่อนแอลงด้วย [disease_scope.GetNameNoTooltip( GetPlayer )|l] [ROOT.Char.Custom('disease_desc_short')] #EMP เกิดอะไรขึ้นกับข้ากันนี่?#!\n\nข้าได้ยินเสียงไออู้อี้ดังมาจากนอกกระโจม มันสายเกินไปแล้วสำหรับข้า — ข้าได้ แต่หวังว่ามันจะไม่ไปถึง [dummy_gender.GetWomenMen] ของข้า"
 epidemic_events.0001.a: "#EMP พินาศ!#!"
 epidemic_events.0001.a.toast: "การติดเชื้อเพิ่มขึ้น"
 epidemic_events.0001.a.christian: "#EMP [ROOT.Char.Custom('christian_curse')|U]#!."
 epidemic_infected_knights_modifier: "อัศวินติดเชื้อ"
 epidemic_infected_army_modifier: "กองทัพติดเชื้อ"
 christian_curse_bones: "ด้วยกระดูกแห่ง [ROOT.Char.GetFaith.HighGodNamePossessive]"
 christian_curse_nails: "ด้วยตะปูแห่ง [ROOT.Char.GetFaith.HighGodNamePossessive]"
 christian_curse_nails2: "ด้วยตะปูแห่ง $chistianity_good_god_christ$"
 christian_curse_arms: "ด้วยพระกรแห่ง [ROOT.Char.GetFaith.HighGodNamePossessive]"
 christian_curse_blood: "ด้วยโลหิตแห่ง $chistianity_good_god_christ$"
 christian_curse_death: "ด้วยความตายแห่ง [ROOT.Char.GetFaith.HighGodNamePossessive]"
 christian_curse_wounds: "ด้วยบาดแผลแห่ง [ROOT.Char.GetFaith.HighGodNamePossessive]"
 christian_curse_body: "ด้วยพระวรกายแห่ง [ROOT.Char.GetFaith.HighGodNamePossessive]"
 disease_desc_short_plague: "ถูกรุมเร้าด้วยฝีดำ"
 disease_desc_short_measles: "ถูกล้อมด้วยจุดแดง"
 disease_desc_short_dysentery: "ทุกข์ทรมานด้วยการขับถ่ายปนเลือด"
 disease_desc_short_ergotism: "ถูกลงโทษด้วยการเคลื่อนไหวผิดปกติ"
 disease_desc_short_typhus: "ทรมานด้วยไข้ในค่ายทหาร"
 disease_desc_short_consumption: "ทรุดโทรมด้วยอาการไอเป็นเลือด"
 disease_desc_short_smallpox: "เต็มไปด้วยแผลเป็นและผื่น"
 disease_desc_short_cancer: "อ่อนแอลงด้วยมะเร็ง"
 disease_desc_short_gout: "ทุกข์ทรมานด้วยข้อต่อบวม"
 disease_desc_short_pneumonic: "ทรุดโทรมด้วยอาการไอ"
 disease_desc_short_great_pox: "ทุกข์ทรมานด้วยแผลกามโรค"
 disease_desc_short_lovers_pox: "มีรอยแผลพุพองจากกามโรค"
 disease_desc_short_leper: "แบกรับภาระด้วยผิวหนังหลุดลอก"
 disease_desc_short_incapable: "ทรมานด้วยความไร้ความสามารถ"
 disease_desc_short_infirm: "ร่างกายอ่อนแอ"
 disease_desc_short_ill: "ทุกข์ทรมานด้วยโรคภัยไข้เจ็บ"

 epidemic_events.1000.t: "ลัทธิ [cult_epidemic.GetNameNoTooltip]"
 epidemic_events.1000.desc: "นักบวชตาขวางนาม [charismatic_priest.GetFirstName] เทศนาว่า [cult_epidemic.GetName] คือทัณฑ์สวรรค์ — และเพียงการบูชา [charismatic_priest.GetFaith.HighGodName|U] เท่านั้นที่จะช่วยเราได้ ฝูงชนพากันแห่แหนไปหา [charismatic_priest.GetHerHim] ด้วยถูกชักจูงจากไฟและความกลัว\n\nหากปล่อยไว้โดยไม่ตรวจสอบ ลัทธิโรคระบาดนี้อาจโค่นล้มการปกครองของชาว [ROOT.Char.GetFaith.GetAdjective] ใน [infected_county.GetName] และที่อื่นๆ ได้"
 epidemic_events.1000.a: "เผาเจ้าคนบ้านี่ซะ!"
 epidemic_events.1000.b: "ข้ามั่นใจว่านี่ไม่เป็นอันตราย"
 epidemic_events.1000.c: "ในที่สุด ข้าก็ได้พบ [charismatic_priest.GetFaith.HighGodName|U]!"
 epidemic_events.1010.t: "ภูตผีผู้น่าหลงใหล"
 epidemic_events.1010.desc: "[epidemic_scope.GetName|U] ย่างกรายในดินแดนของข้า — และบัดนี้ [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('superstitious_courtier'))] ของข้า [superstitious_courtier.GetFirstName] ก็กระซิบถึงสิ่งที่เลวร้ายกว่า\n\n"นาย [ROOT.Char.GetTitleAsNameNoTooltip|U] ของข้า" [superstitious_courtier.GetSheHe] อ้อนวอน "ความรักของท่านต่อ [dead_lover.GetFirstName] เป็นที่ประจักษ์ แต่โรคระบาดมาพร้อมกับความตาย เราต้องผนึกโลงศพของ [dead_lover.GetHerHis] — ตอกตะปูปิดตาย — ก่อนที่ [dead_lover.GetSheHe] จะฟื้นคืนชีพและแพร่คำสาป""
 epidemic_events.1010.a: ""เจ้ากล้าดียังไง!""
 epidemic_events.1010.b: "บางที [superstitious_courtier.GetSheHe] อาจจะพูดถูก..."
 epidemic_events.1010.c: "ตอกตะปูปิดโลงศพทุกใบในอาณาจักร!"
 all_realm_county_epidemic_scope: "[county|E] ทุกแห่งใน [realm|E] ที่มี [epidemic_scope.GetName]"
 epidemic_events.1020.t: "อากาศเสียเหนือ [epidemic_county.GetNameNoTierNoTooltip|U]"
 epidemic_events.1020.desc: "การค้าใน [epidemic_county.GetNameNoTier] เหี่ยวเฉา [miasma_courtier.Custom2('MyCharacterIntroduction', ROOT.Char)|U] โทษว่าเป็น เพราะไอเหม็นแห่งความตาย — และเสนอวิธีรักษาที่แปลกประหลาด\n\n"หากเราปลูกทุ่ง [epidemic_province.Custom('get_region_flower_type_plural')] หอมหวาน อากาศที่หอมกรุ่นอาจขับไล่โรคระบาดออกไปได้"\n\nประหลาดนัก แต่บางทีก็อาจไม่ประหลาดไปกว่าตัวโรคระบาดเอง"
 epidemic_events.1020.a: "มันคุ้มค่าที่จะลอง"
 epidemic_events.1020.b: "ช่างเป็นการสิ้นเปลืองทองคำเสียจริง"
 epidemic_events.1030.t: "ปลิง!"
 epidemic_events.1030.desc: "[leeched_courtier.Custom2('MyCharacterIntroduction', ROOT.Char)|U] พรวดพราดเข้ามา ตาเหลือก ถือถุงใส่ปลิงมาด้วย\n\n"ปลิงเป็นหนทางเดียวที่จะหยุด [epidemic_scope.GetName] ได้!" [leeched_courtier.GetSheHe] ร้องไห้\n\nธรรมเนียมกล่าวว่าควรใช้ปลิงภายใต้การดูแลของผู้เชี่ยวชาญเท่านั้น — แต่ยามนี้เป็นเวลาสิ้นหวัง เราจะมัวรอได้จริงๆ หรือ?"
 epidemic_events.1030.a: "แจกจ่ายปลิงให้ทุกคน!"
 epidemic_events.1030.a.success: "ปลิงพิสูจน์ว่าได้ผล"
 epidemic_events.1030.a.failure: "ปลิงเป็นอันตราย"
 epidemic_events.1030.b: "ให้เราปฏิบัติตามคำสอนที่มีอยู่"
 epidemic_events.1040.t: "ผู้โบยตีตนเองที่ราชสำนัก"
 epidemic_events.1040.desc.intro: "[epidemic_scope.GetName|U] ยังคงแพร่ระบาดไปทั่วอาณาจักรของข้า ทำลายล้างทุกสิ่งที่ขวางหน้า กลุ่มผู้คลั่งศาสนาได้ปรากฏตัวขึ้นในภูมิภาคที่ติดเชื้อ โดยอ้างว่าความรอดสามารถบรรลุได้ผ่านการโบยตีตนเอง\n\n"
 epidemic_events.1040.desc.mid.approves: "[ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('chaplain'))] ของข้า [chaplain.GetFirstName] เข้ามาใกล้ ดวงตาเป็นประกาย "ข้า แต่ฝ่าบาท — นี่คือการไถ่โทษจากสวรรค์ที่ปรากฏเป็นรูปธรรม เราต้องอวยพรให้เหตุของพวกเขา!""
 epidemic_events.1040.desc.mid: "[chaplain.Custom2('MyCharacterIntroduction', ROOT.Char)|U] โกรธจัด "มันเป็นพวกนอกรีต — วิปริตและอันตราย! ท่านต้องประณามมัน"\n\nฝูงชนโห่ร้องดังขึ้น"
 epidemic_events.1040.a: "นี่มันวิปริต!"
 epidemic_events.1040.b: "ข้ามั่นใจว่าพวกเขาไม่ได้ทำร้ายใครนอกจากตัวเอง"
 epidemic_events.1040.c: "หากสิ่งที่พวกเขาพูดเป็นความจริง ข้าก็จะโบยตีตนเอง!"
 epidemic_events.1050.t: "วันสิ้นโลก"
 epidemic_events.1050.desc: "ข้าพบ [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('chaplain'))|U] [chaplain.GetFirstName] เดินไปมาอยู่ข้างนอก ซีดเผือดและตกตะลึง "นาย [ROOT.Char.GetTitleAsNameNoTooltip|U] ของข้า — พวกนอกรีตร้องป่าวประกาศว่า [epidemic_scope.GetName] คือโทสะของ [ROOT.Char.GetFaith.HighGodNamePossessive] วันสิ้นโลกมาถึงเราแล้ว!"\n\nความรุนแรง ความตื่นตระหนก พวกคลั่งศาสนาเทศนาถึงหายนะตามท้องถนน\n\n"เราต้องลงมือ หรือ มิฉะนั้นความบ้าคลั่งของพวกเขาจะกลืนกินระเบียบเพียงน้อยนิดที่ยังเหลืออยู่""
 epidemic_events.1050.a: ""กำจัดพวกมันให้สิ้นซาก!""
 epidemic_events.1050.b: ""ส่งนักเทววิทยาที่เก่งที่สุดของท่านไปโต้แย้งกับพวกเขา!""
 epidemic_events.1050.b.tt.success: "ความกลัววันสิ้นโลกถูกปัดเป่า"
 epidemic_events.1050.b.tt.failure: "ผู้คนไม่เชื่อ"
 epidemic_events.1050.c: ""บางทีพวกเขาอาจจะพูดถูก...""
 story_plague_trials_title: "การพิจารณาคดีโรคระบาด:"
 epidemic_events.1060.t: "$story_plague_trials_title$ ผู้นำพาโรคห่า"
 epidemic_events.1060.desc.intro: "ผู้คนในอาณาจักรของข้ายังคงถูกรุมเร้าด้วย [epidemic_scope.GetName] และความเชื่องมงายก็แพร่หลายในหมู่พวกเขา ข้าได้รับแจ้งว่าพวกเขากำลังโทษโรคระบาดว่าเป็น เพราะ"
 epidemic_events.1060.desc.mid.cats: "คุณสมบัติเหนือธรรมชาติของแมว\n\nพวกเขาเชื่อว่าแมวบ้านทั่วไปกำลังนำพาโรคระบาดติดตัวมาและสาปแช่งคนทั่วไปด้วยการปรากฏตัวของพวกมัน ความเชื่อนี้แพร่หลายมากจนพื้นที่ที่ได้รับผลกระทบจากโรคระบาดมากที่สุดได้เริ่มสังหารแมวจำนวนมาก"
 epidemic_events.1060.desc.mid.dogs: "คุณสมบัติเหนือธรรมชาติของสุนัข\n\nสิ่งมีชีวิตที่ซื่อสัตย์และไว้วางใจได้มากที่สุด ในสายตาของไพร่ฟ้าข้าแผ่นดินที่ต่ำต้อยที่สุด กลับต้องรับผิดชอบต่อความทุกข์ทรมานและความตายภายในอาณาจักรของข้า ความเชื่อนี้แพร่หลายมากจนหลายพื้นที่กำลังตามล่าสัตว์น่าสงสารเหล่านี้อย่างแข็งขัน"
 epidemic_events.1060.desc.mid.faith: "ชาว [faith_to_blame.GetAdherentNamePlural] — ซึ่งถูกทนทนมานาน — บัดนี้ถูกมองว่าเป็นคำสาป "พวกเขา ทำให้สวรรค์พิโรธ" พวกไพร่กล่าว "และบัดนี้พวกเราต้องทนทุกข์ เพราะมัน" วิหารของพวกเขาถูกทำลาย คำสวดอ้อนวอนของพวกเขาหวนกลับมาทำร้ายตนเอง"
 epidemic_events.1060.desc.mid.trait: "ผู้ใดก็ตามที่แสดงความปรารถนาต้องห้าม ประเพณีแปลกประหลาด หรือความชั่วช้าที่น่ารังเกียจจะถูกจับกุม ข้อมือที่อ่อนปวกเปียก เรื่องตลกลามก หรือข้อกล่าวหาที่มีเลศนัย — ก็เพียงพอที่จะถูกสาปแช่งแล้ว"
 epidemic_events.1060.desc.mid2.witches: "พวกเขาโทษเวทมนตร์โดยเฉพาะ แต่ดูเหมือนจะไม่ชัดเจนว่าอะไรคือเวทมนตร์ในสายตาของชาวนา"
 epidemic_events.1060.desc.mid2.sin: "พวกเขาเชื่อว่าเราได้กลายเป็นคน [sinful_trait.GetName(ROOT.Char)] มากเกินไป และมีเพียงการสำนึกผิดครั้งใหญ่และการลงโทษอย่างรุนแรงเท่านั้นที่เราจะกลับไปใช้ชีวิตตามที่ [ROOT.Char.GetFaith.HighGodName] ประสงค์ให้เราเป็น"
 epidemic_events.1060.desc.outro: "\n\nการกระทำเหล่านี้ถูกประณามอย่างกว้างขวางโดย [ROOT.Char.GetFaith.PriestNeuterPlural] แห่งอาณาจักร แต่ถึงกระนั้นการพิจารณาคดีก็ยังคงดำเนินต่อไป"
 epidemic_events.1060.a: "ไม่มีอะไรที่ข้าสามารถทำได้"
 epidemic_events.1060.b: "หยุดพวกเขาทันที!"
 epidemic_events.1060.c: "บางทีคำตอบของเราอาจอยู่ใน [ROOT.Char.GetFaith.ReligiousText|U]"
 witch_trial_story_tt: "#EMP สิ่งเลวร้ายที่สุดอาจจะยังมาไม่ถึง...#!"
 epidemic_events.1061.t: "$story_plague_trials_title$ กองเพลิงสัตว์เลี้ยง"
 epidemic_events.1061.desc.intro: "ข้าตื่นขึ้นมาพบท้องฟ้าสว่างวาบสีส้มและควันคลุ้งในอากาศ พวกไพร่จุดไฟเผาเมืองหรือไร?\n\n"
 epidemic_events.1061.desc.mid.cats: "ไม่ใช่ — มันคือแมว [chaplain.GetTitledFirstName] แจ้งข้าว่าพวกมันกำลังถูกเผาทั้งเป็นเพื่อปัดเป่า [epidemic_scope.GetName]"
 epidemic_events.1061.desc.mid.dogs: "ไม่ใช่ — มันคือหมา [chaplain.GetTitledFirstName] แจ้งข้าว่าพวกมันกำลังถูกเผาทั้งเป็นเพื่อปัดเป่า [epidemic_scope.GetName]"
 epidemic_events.1061.desc.outro: "\n\n"ช่างเป็นเรื่องน่าสยดสยอง" [chaplain.GetSheHe] พึมพำ "แต่ก็เป็นที่นิยมมากทีเดียว""
 epidemic_events.1061.a: "ข้าคิดว่าไม่มีอะไรที่ข้าสามารถทำได้"
 epidemic_events.1061.a.success: "การเผาสัตว์ไม่มีผล"
 epidemic_events.1061.a.failure: "การเผาสัตว์กลับเพิ่มการติดเชื้อ"
 epidemic_events.1061.b: "สิ่งนี้ต้องหยุด!"
 epidemic_events.1061.c: "การทำร้ายสัตว์เหล่านี้ต้องกลายเป็นอาชญากรรม"
 epidemic_events.1062.t: "$story_plague_trials_title$ นักจับ"
 epidemic_events.1062.desc.intro: "กลุ่มพรานป่าบุกเข้ามาใน [ROOT.Char.Custom('GetCourt')] ของข้า กลิ่นเหงื่อและควันคละคลุ้ง\n\n"
 epidemic_events.1062.desc.mid.cats: ""ข้า แต่ฝ่าบาท มันคือพวกแมว สัตว์ร้ายที่ลื่นไหล — ตาลอบ, ไม่เคยหลับ ผู้คนบอกว่าพวกมันนำโรคระบาดมาพร้อมกับเสียงครางของมัน""
 epidemic_events.1062.desc.mid.dogs: ""นาย [ROOT.Char.GetTitleAsNameNoTooltip|U] ของข้า พวกหมามันต้องคำสาป ทุกคนรู้ดี ขอให้พวกเราชำระล้างให้สิ้นซาก — สัตว์ทุกตัว, หมาทุกตัว, จนกว่าโรคระบาดจะสิ้นสุด""
 epidemic_events.1062.desc.outro: "เราเป็นคนของประชาชน และเรายินดีที่จะตามล่าสัตว์ประหลาดเหล่านั้นทุกตัวจนกว่าโรคระบาดจะหายไป""
 epidemic_events.1062.a: "ฆ่าพวกมันให้หมด"
 epidemic_events.1062.a.no_effect: "การฆ่าสัตว์ไม่มีผล"
 epidemic_events.1062.a.success: "โรคระบาดบรรเทาลง"
 epidemic_events.1062.a.failure: "โรคระบาดแย่ลง"
 epidemic_events.1062.b: "จับพวกมันและนำมายังเมืองหลวง"
 epidemic_events.1062.b.no_effect: "สิ่งนี้ไม่มีผล"
 epidemic_events.1062.b.failure: "เมืองหลวงเต็มไปด้วยสัตว์บ้า"
 epidemic_events.1063.t: "$story_plague_trials_title$ จงสำนึกบาป!"
 epidemic_events.1063.desc.intro: "ใจกลาง [ROOT.Char.GetCurrentLocation.GetNameNoTooltip|U] เต็มไปด้วยเสียงตื่นตระหนกและสิ้นหวัง และเสียงที่ดังฝ่าเสียงคร่ำครวญของผู้ถูกสาปแช่งคือเสียงของนักเทศน์ข้างถนนธรรมดาคนหนึ่ง\n\n"จงสำนึกผิด! จงสำนึกผิด!"
 epidemic_events.1063.desc.mid.faith: "โรคระบาดนี้ไม่ได้เกิดจากชาว [faith_blamed.GetAdjective]! นี่เป็นผลมาจากบาปของเราเอง"
 epidemic_events.1063.desc.mid.sin: "โรคระบาดนี้เป็นการลงโทษจาก [ROOT.Char.GetFaith.HighGodName|U] สำหรับความอ่อนแอและความโน้มเอียงของเราที่จะเป็น [trait_blamed.GetName(ROOT.Char)]"
 epidemic_events.1063.desc.mid.witch: "ไม่ใช่แม่มดที่เราควรจับตามอง แต่เป็นตัวเราเอง! เราทุกคนไม่ใช่คนบาปหรือ?"
 epidemic_events.1063.desc.mid.cats: "การโทษโรคระบาดนี้ว่าเป็น เพราะสัตว์ที่น่าสมเพชและน่าเวทนาอย่างแมวนั้นไร้สาระ! เป็นบาปของเราเองที่เราควรพิจารณา!"
 epidemic_events.1063.desc.mid.dogs: "การโทษโรคระบาดนี้ว่าเป็น เพราะสุนัขปัญญาทึบนั้นไร้สาระ! เป็นจิตวิญญาณที่เสื่อมทรามของเราเองที่ต้องรับผิดชอบต่อสิ่งนี้"
 epidemic_events.1063.desc.outro: "มีเพียงการพยายามที่จะเป็น [virtuous_trait.GetName(ROOT.Char)] เท่านั้นที่เราจะหวังให้โรคระบาดสิ้นสุดลงได้"\n\nฝูงชนดูเหมือนจะหลงใหลในข้อความนี้มาก และนักเทศน์คนอื่นๆ ทั่วเมืองดูเหมือนจะถ่ายทอดข้อความเดียวกันด้วยความเชื่อมั่นและความกระตือรือร้นที่เท่าเทียมกัน ข้าอดไม่ได้ที่จะรู้สึกว่าบางทีอาจเป็นความอ่อนแอและบาปของข้าเองที่นำโรคระบาดนี้มาสู่ผู้คนของข้า"
 epidemic_events.1063.a: "ข้าสำนึกผิด!"
 epidemic_events.1063.b: "เรื่องไร้สาระ"
 epidemic_events.1063.c: "แน่นอนว่าข้าสามารถโต้แย้งกับนักเทศน์ข้างถนนธรรมดาได้"
 epidemic_events.1063.c.success: "ท่านห้ามปรามนักเทศน์ได้สำเร็จ"
 epidemic_events.1063.c.failure: "ท่าน ทำให้ตัวเองอับอาย"
 epidemic_events.1064.t: "$story_plague_trials_title$ กองเพลิงแห่งความบริสุทธิ์"
 epidemic_events.1064.desc.intro: "แม้ว่าข้าจะพยายามปราบปรามความเชื่อทางไสยศาสตร์ แต่การพิจารณาคดีแม่มดก็ปะทุขึ้นทั่วทั้งอาณาจักร และไม่มีที่ใดรุนแรงไปกว่าใน [witch_trial_county.GetNameNoTier] ที่นั่น [epidemic_scope.GetName] ได้เปลี่ยนความกลัวให้เป็นความบ้าคลั่ง\n\n"
 epidemic_events.1064.desc.mid.sin: "การพิจารณาคดีพยายามที่จะกำจัดคน [trait_blamed.GetName(ROOT.Char)] ในหมู่พวกเราและลงโทษพวกเขาอย่างรุนแรง บางครั้งถึงแก่ความตาย"
 epidemic_events.1064.desc.mid.witch: "การพิจารณาคดีพยายามที่จะเปิดโปงแม่มดด้วยวิธีการที่ป่าเถื่อนและไร้เหตุผล ซึ่งมักจะเป็นการพิจารณาคดีที่จะ ส่งผลให้เสียชีวิตไม่ว่าผู้ถูกกล่าวหาจะเป็นแม่มดหรือไม่ก็ตาม"
 epidemic_events.1064.desc.outro: "\n\nหากนี่คือความยุติธรรม มันก็ไม่ได้รับใช้ทั้ง [ROOT.Char.GetFaith.HighGodName|U] หรือราชบัลลังก์"
 epidemic_events.1064.a: "ส่งเจ้าพนักงานไปยัง [witch_trial_county.GetNameNoTierNoTooltip] เรื่องนี้ต้องจบที่นั่น"
 epidemic_events.1064.b: "การพิจารณาคดีต้องสิ้นสุด!"
 epidemic_events.1064.c: "เราต้องเทศนาต่อต้านการปฏิบัตินี้"
 epidemic_events.1064.c.success: "ข้อความของท่านน่าเชื่อถือ"
 epidemic_events.1064.c.failure: "การพิจารณาคดียังคงดำเนินต่อไป"
 epidemic_events.1065.t: "$story_plague_trials_title$ ความอัปยศ"
 epidemic_events.1065.desc.intro: "บัดนี้โรคระบาดแห่งความกลัวได้ลามมาถึงครัวเรือนของข้าเอง\n\nนักเทศน์ได้ปลุกปั่นมวลชนให้ต่อต้าน [shamed_buddy.Custom2('MyCharacterIntroduction', ROOT.Char)] พวกเขากล่าวหา [shamed_buddy.GetHerHim] ว่า "
 epidemic_events.1065.desc.mid.sin: "การเป็น [trait_blamed.GetName(shamed_buddy)]"
 epidemic_events.1065.desc.mid.witch: "เวทมนตร์"
 epidemic_events.1065.desc.outro: "สมสู่กับ [ROOT.Char.GetFaith.EvilGodNames] ทำบาปในผ้าไหม บัดนี้พวกเขาเรียกร้องให้มีการลงโทษ [shamed_buddy.GetHerHis] ต่อหน้าสาธารณชน — ลาก [shamed_buddy.GetHerHis] ออกจากโถง และบังคับให้สำนึกบาป\n\nการปฏิเสธพวกเขาเสี่ยงต่อการก่อกบฏ การยอมจำนนก็นำความอัปยศมาสู่ราชบัลลังก์"
 epidemic_events.1065.a: "ให้สิ่งที่พวกเขาต้องการแก่พวกเขา"
 epidemic_events.1065.b: "ข้าปฏิเสธ!"
 epidemic_events.1065.c: "ข้าจะไปแทน [shamed_buddy.GetHerHis]"
 epidemic_events.1066.t: "$story_plague_trials_title$ การขับไล่"
 epidemic_events.1066.desc: "ไม่มีคำพูดใดจะโน้มน้าวชาวไร่ชาวนาได้ — พวกเขาโทษชาว [faith_blamed.GetAdherentNamePlural] ว่าเป็นต้นเหตุของ [epidemic_scope.GetName] พ่อค้าของพวกเขาถูกคุกคาม บ้านเรือนถูกทำลาย หลายคนหนีไปแล้ว และการค้าก็เหี่ยวเฉา\n\nที่เลวร้ายไปกว่านั้น ในบางหมู่บ้าน พวกเขากำลังถูกตามล่า\n\nหากการข่มเหงนี้ยังคงดำเนินต่อไป อาณาจักรของข้าอาจต้องหลั่งเลือดจนแห้งเหือด — ไม่ใช่จากโรคระบาด แต่จากความกลัว"
 epidemic_events.1066.a: "พฤติกรรมนี้ต้องถูกลงโทษ"
 epidemic_events.1066.b: "นี่อยู่เหนือการควบคุมของข้า"
 epidemic_events.1066.c: "ข้าสามารถให้ที่หลบภัยในเมืองหลวงได้"
 epidemic_events.1067.t: "การหลั่งไหลของโรคระบาดชาว [faith_blamed.GetAdjectiveNoTooltip|U]"
 epidemic_events.1067.desc: "ขณะที่ [epidemic_scope.GetName] ทำลายล้างอาณาจักรของ [bigoted_ruler_that_everyone_hates.GetNamePossessive] ชาวนาที่นั่นยืนกรานที่จะโทษ [faith_blamed.GetAdherentNamePlural] ปัญหานี้แพร่หลายมากจนหลายคนถึงกับเริ่มหลบหนีจาก [bigoted_ruler_that_everyone_hates.GetPrimaryTitle.GetNameNoTierNoTooltip|U] และมายังดินแดนของข้า\n\nแม้ว่าการหลั่งไหลของผู้คนเข้ามาเพิ่มนี้จะนำมา ซึ่งการค้าและภาษี แต่ก็ปฏิเสธไม่ได้ว่าพวกเขากำลังมาจากสถานที่ที่เต็มไปด้วย [epidemic_scope.GetName] และไม่ต้องสงสัยเลยว่ากำลังนำอากาศเสียติดตัวมาด้วย แม้จะมีความเสี่ยงที่โรคระบาดจะแพร่กระจายเข้าสู่ดินแดนของข้าได้ง่ายขึ้น แต่โอกาสที่เกิดจากการหลั่งไหลของผู้ลี้ภัยเหล่านี้ก็ยากที่จะปฏิเสธ"
 epidemic_events.1067.a: "พวกเขายินดีต้อนรับที่นี่"
 epidemic_events.1067.b: "เราไม่สามารถเปิดประตูรับโรคระบาดได้"
 epidemic_events.1067.c: "ให้ที่หลบภัยในเมืองหลวง"
 every_bordering_county: "ทุกเคาน์ตีที่ติดกับ [bigoted_ruler_that_everyone_hates.GetName]"
 epidemic_events.1068.t: "$story_plague_trials_title$ ไร้เงินกู้"
 epidemic_events.1068.desc: "การล่าแม่มดที่กล่าวโทษชาว [faith_blamed.GetAdherentNamePlural] ว่าเป็นต้นเหตุของ [epidemic_scope.GetName] ได้บีบรัดการพาณิชย์ทั่วทั้งอาณาจักร\n\n[loneless_vassal.Custom2('MyCharacterIntroduction', ROOT.Char)|U] เดินโซซัดโซเซเข้ามาในราชสำนักเหมือนขอทาน "การข่มเหงได้ขับไล่ผู้ให้กู้ไปหมดแล้ว นาย [ROOT.Char.GetTitleAsNameNoTooltip|U] ของข้า ความกลัวการติดเชื้อ — และฝูงชน — ทำให้ทุกเหรียญเงียบกริบ การปล่อยดอกเบี้ยโหดได้หายไปแล้ว คลังของข้าว่างเปล่า ของท่านก็อาจตามมา""
 epidemic_events.1068.a: "[loneless_vassal.GetPrimaryTitle.GetNameNoTierNoTooltip|U] จะเป็นสถานที่ปลอดภัยสำหรับทุกคน"
 epidemic_events.1068.b: "ข้าสามารถเสนอเงินกู้ให้ท่านได้"
 epidemic_events.1068.c: "มันเป็นเรื่องโชคร้าย"
 all_of_vassals_holding: "ที่ดินทั้งหมดของ [loneless_vassal.GetNamePossessive]"
 epidemic_events.1100.t: "เงาทมิฬเหนือ [infected_county.GetNameNoTierNoTooltip|U]"
 epidemic_events.1100.desc.intro.apocalyptic: "ถนนใน [infected_county.GetNameNoTier] เงียบสงัด [ROOT.Char.GetFaith.DeathDeityName|U] ได้สาปแช่งโรคระบาดของ [ROOT.Char.GetFaith.DeathDeityHerHis] เหนือ"
 epidemic_events.1100.desc.intro.major: "การเดินผ่าน [infected_county.GetNameNoTier] คือการได้สัมผัสกับซิมโฟนีอันน่าสะพรึงกลัวของความทุกข์ทรมานของมนุษย์ โรคระบาดได้มาถึง"
 epidemic_events.1100.desc.intro.fallback: "การเดินผ่าน [infected_county.GetNameNoTier] เผยให้เห็นบางสิ่งที่น่ารังเกียจอย่างยิ่ง โรคระบาดได้มาถึง"
 epidemic_events.1100.desc.intro2.holy_site: "สถานที่ศักดิ์สิทธิ์ที่สุดแห่งนี้\n\n"
 epidemic_events.1100.desc.intro2.cool_place: "มหานครที่เคยรุ่งเรืองแห่งนี้\n\n"
 epidemic_events.1100.desc.intro2.backwater: "หมู่บ้านเล็กๆ ที่ไม่น่าสนใจแห่งนี้\n\n"
 epidemic_events.1100.desc.mid.typhus: "ผู้ติดเชื้อถูกปกคลุมตั้งแต่หัวจรดเท้าด้วยผื่นที่ร้อนเมื่อสัมผัส\n\n"
 epidemic_events.1100.desc.mid.bubonic_plague: "ฝีหนองสีดำปกคลุมผิวหนังของผู้ติดเชื้อ เต็มไปด้วยของเหลวเหม็นที่ปล่อยอากาศเสียออกมาเมื่อแตก\n\n"
 epidemic_events.1100.desc.mid.smallpox: "ผิวหนังของผู้ติดเชื้อเป็นสีแดงเข้มและปกคลุมไปด้วยตุ่มและก้อน แผลเป็นสดนับไม่ถ้วนปกคลุมผิวหนังจากการเกาไม่หยุด และดวงตาที่สิ้นหวังเหล่านั้นก็แดงก่ำ\n\n"
 epidemic_events.1100.desc.mid.measles: "ผิวหนังเป็นตุ่มของผู้ป่วยเป็นสีแดงสดและเจ็บปวดเมื่อสัมผัส พวกเขาเหงื่อออกแม้ในอากาศหนาว และพวกเขามีแววตาเหมือนคนเป็นโรคเรื้อน\n\n"
 epidemic_events.1100.desc.mid.dysentery: "เมื่อสบตากับผู้ติดเชื้อ พวกเขาดูว่างเปล่าและไร้ชีวิตชีวา ราวกับว่าวิญญาณอยู่ที่อื่น เสื้อผ้าของพวกเขาเปื้อนสีแดงเข้มบริเวณด้านหลัง และพวกเขากุมท้องราวกับจะหยุดไม่ให้มันหลุดออกมา\n\n"
 epidemic_events.1100.desc.mid.ergotism: "ผู้ติดเชื้อมักจะบิดเบี้ยวร่างกายในการเต้นรำที่ไม่บริสุทธิ์เป็นช่วงๆ สลับกับอาการคร่ำครวญอย่างไร้สติและการถ่ายอุจจาระตามท้องถนน\n\n"
 epidemic_events.1100.desc.mid.consumption: "ไม่ว่าจะไปที่ไหน ก็ไม่อาจหนีพ้นเสียงไอและสำลักไม่หยุดหย่อนของผู้ติดเชื้อ เลือดข้นเหนียวเปื้อนเสื้อผ้าของพวกเขาเป็นสีแดงเข้ม\n\n"
 epidemic_events.1100.desc.mid.fallback: "ประชากรถูกรุมเร้าด้วยสารน้ำในร่างกายที่ไม่ดีทุกประเภท ส่งผลให้อาการมีมากมายเกินกว่าจะเอ่ยชื่อได้\n\n"
 epidemic_events.1100.desc.mid2.apocalyptic: "แทบไม่มีวิญญาณใดในเมืองที่ไม่ถูกรุมเร้าด้วยโรคระบาดอันน่าสะพรึงกลัวนี้ และมันยังคงคืบคลานเข้าสู่ชนชั้นสูงอย่างรวดเร็ว"
 epidemic_events.1100.desc.mid2.major: "ประชากรชาวนาอย่างน้อยครึ่งหนึ่งติดเชื้อแล้ว และเป็นเพียงเรื่องของเวลาเท่านั้นที่มันจะแพร่กระจายไปยังชนชั้นสูง"
 epidemic_events.1100.desc.mid2.fallback: "แม้ว่าจำนวนจะยังคงต่ำ แต่ก็เป็นเพียงเรื่องของเวลาเท่านั้นที่มันจะแพร่กระจายต่อไป"
 epidemic_events.1100.desc.outro.capital: "ผู้คนต่างเรียกโรคนี้ว่า "[epidemic.GetName]" แล้ว และมันกำลังเกิดขึ้นที่หน้าประตูบ้านข้าเอง"
 epidemic_events.1100.desc.outro: "ผู้คนต่างเรียกโรคนี้ว่า "[epidemic.GetName]" แล้ว"
 epidemic_events.1100.a.already_has_it: "ข้าเกรงว่ามันจะสายเกินไปแล้ว..."
 epidemic_events.1100.a.compassionate: "ชาวนาที่ป่วยน่าสงสารเหล่านั้น..."
 epidemic_events.1100.a.callous: "เอาล่ะ ไม่มีอะไรที่ข้าสามารถทำได้"
 epidemic_events.1100.a.diligent: "ข้าจะคอยจับตาดู"
 epidemic_events.1100.a.paranoid: "ข้าจะ #EMP ไม่#! ออกจากห้องของข้า!"
 epidemic_events.1100.a.brave: "ข้ารอดชีวิตจากสิ่งที่เลวร้ายกว่านี้มาแล้ว"
 epidemic_events.1100.a.cannibal: "ช่างเป็นการสิ้นเปลืองเนื้อดีเสียจริง"
 epidemic_events.1100.a.eccentric: "ข้ารออยู่บนเรือไม่ได้หรือ?"
 epidemic_events.1100.a.zealous: "[ROOT.Char.GetFaith.HealthGodName|U] คุ้มครองเราด้วยเถิด"
 epidemic_events.1100.a: "ใครสักคนควรทำอะไรบางอย่าง"
 epidemic_events.1100.b: "เรียกหมอหลวงมา!"
 epidemic_events.1100.c: "ตามหมอหลวง!"
 look_for_physician_epidemic_tt: "ท่านจะค้นหา [GetCourtPositionType('court_physician_court_position').GetName()] เพื่อช่วยชดเชย [epidemic|E]"
 physician_will_help_epidemic_tt: "[GetCourtPositionType('court_physician_court_position').GetName()] ของท่านจะให้ทางเลือกมากมายเพื่อชดเชย [epidemic|E]"
 epidemic_events.1110.t: "ศพเกลื่อนถนน"
 epidemic_events.1110.desc: "[chaplain.Custom2('MyCharacterIntroduction', ROOT.Char)|U] มาถึงด้วยใบหน้าซีดเผือด\n\n"นาย [ROOT.Char.GetLadyLord] ของข้า ศพเน่าเปื่อยเกลื่อนถนน เราฝังไม่ทัน — ไอเหม็นหนาทึบ เราต้องเปิด [GetBuilding('burial_site_01').GetName] ใน [graveyard_county.GetName]"\n\n[chaplain.GetSheHe|U] ไม่ได้มาขออนุญาต [chaplain.GetSheHe|U] มาอ้อนวอน"
 epidemic_events.1110.a: "ตกลงตามนั้น"
 epidemic_events.1110.b: "สถานที่นั้นมีไว้สำหรับข้าและคนของข้าเท่านั้น"
 epidemic_events.1120.t: "ของขวัญอันน่าสยดสยอง"
 epidemic_events.1120.desc: "ขณะที่เราเข้าสู่ [flung_corpse_location.GetName] ความคิดอันชั่วร้ายก็ผุดขึ้นในใจข้า ทหารสองสามนายกำลังใกล้ตายด้วย [epidemic_scope.GetName] และอีกไม่นานก็จะจากโลกนี้ไป อย่างไรก็ตาม เป็นไปได้ที่พวกเขาจะรับใช้ข้าในสงครามนี้แม้ในความตาย\n\nไอพิษจากซากศพจะ ทำให้ทหารของข้าล้มป่วยมากขึ้นอย่างแน่นอน เว้น แต่เราจะกำจัดร่างเหล่านั้นเสียด้วยวิธีใดวิธีหนึ่ง บางทีเราอาจ ทำให้ [corpse_flingee.GetName] ยอมคุกเข่า [corpse_flingee.GetHerHis] จำนนได้โดยส่งของขวัญไปให้ [corpse_flingee.GetHerHim] ผ่านเครื่องยิงหิน..."
 epidemic_events.1120.a: "บรรจุศพขึ้น!"
 epidemic_events.1120.b: "นี่มันน่ารังเกียจ!"
 epidemic_events.1121.t: "ของขวัญจากเบื้องบน"
 epidemic_events.1121.desc: "กองกำลังของ [corpse_flinger.GetNamePossessive] ได้เข้ามาในดินแดนของข้าและดูเหมือนจะหยุดอยู่นอกที่ดินของข้า บางทีนี่อาจเป็นการเริ่มต้นของการล้อมเมือง\n\nไม่นานหลังจากที่พวกเขามาถึง ข้าได้ยินเสียงดังตูมและเสียงตบเปียกๆ จากข้างนอก ข้ารีบออกไปดูว่าอะไร ทำให้เกิดเสียงที่ไม่เหมือนโลก เช่นนี้ และสิ่งที่ข้าเห็น ทำให้ข้าหนาวสั่น\n\nซากศพที่แหลกเหลวอยู่ในแอ่งเนื้อและกระดูก ราวกับการจัดแสดงอันน่าสยดสยองในร้านขายเนื้อ ศพเห็นได้ชัดว่าเต็มไปด้วยโรคต่างถิ่นบางอย่าง และหากไม่มีการดำเนินการใดๆ จะต้องเกิดการระบาดอย่างแน่นอน"
 epidemic_events.1121.a: "โยนมันกลับไป!"
 plague_averted_tt: "โรคระบาดถูกป้องกันได้"
 plague_still_infects_tt: "ศพเละเกินกว่าจะเคลื่อนย้ายได้"
 epidemic_events.1121.b: "กักกันศพและทำความสะอาดสถานที่นี้!"
 epidemic_events.1121.b.success: "การกักกันประสบความสำเร็จ"
 epidemic_events.1121.b.failure: "การกักกันล้มเหลว"
 epidemic_events.1121.c: "แค่เอามันไปให้พ้นจากข้า!"
 epidemic_events.1122.t: "ของขวัญที่ส่งคืน"
 epidemic_events.1122.desc: "เสียงหวีดเบาๆ ดังขึ้นในอากาศเมื่อมีบางสิ่งปรากฏขึ้นนอกกำแพง [flung_corpse_location.GetName] เสียงหวีดดังขึ้นเรื่อยๆ จนกระทั่งวัตถุนั้นตกลงมาพร้อมเสียงดังแผละกลางค่าย\n\nเลือด กระดูก และฟันกองอยู่ในหลุม แทบจะไม่ติดอยู่กับเนื้อที่ไม่สามารถระบุได้ว่าเป็นของใคร ดูเหมือนว่า 'ของขวัญ' ของเราจะกลับมาหาเราแล้ว"
 epidemic_events.1122.a: "ตอนนี้มันเละเกินกว่าจะเคลื่อนย้ายได้แล้ว"
 epidemic_events.1122.b: "ตักพวกมันขึ้นมาแล้วลองอีกครั้ง!"
 epidemic_events.1122.b.success: "ท่านโยน 'ศพ' กลับไป"
 epidemic_events.1122.b.failure: "$plague_still_infects_tt$"
 epidemic_events.1123.t: "ฝนเนื้อ"
 epidemic_events.1123.desc: "ข้าได้ยินเสียงฝนตกปรอยๆ ที่ขอบหน้าต่าง ข้าขยับตัวเล็กน้อย เนื่องจากท้องฟ้าแจ่มใสเมื่อครั้งสุดท้ายที่ข้าใช้เวลามอง ดังนั้นข้าจึงมองออกไปข้างนอกและเห็นว่าท้องฟ้ายังคงเป็นสีฟ้า\n\nข้ายื่นมือออกไปนอกหน้าต่าง และข้าตกใจที่เห็นเลือดสีน้ำตาลเข้มเปียกนิ้วมือของข้า รอบๆ ข้างนอก ดินแดนของข้ากำลังเปียกโชกไปด้วยของเหลวเน่าเหม็นพร้อมกับเสียงดังแผละเป็นครั้งคราวของก้อนเนื้อ เห็นได้ชัดว่าศพถูกโยนอีกครั้ง แม้ว่าตอนนี้พวกมันจะถูกทรมานจากการทดสอบนี้จนเหลือเพียงก้อนเลือดและเนื้อเละๆ"
 epidemic_events.1123.a: "น่าสยดสยองอย่างยิ่ง"

