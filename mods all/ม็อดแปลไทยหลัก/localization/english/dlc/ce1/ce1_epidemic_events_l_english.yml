 epidemic_events.2001.t: "โรคระบาดแห่งสงคราม"
 epidemic_events.2001.desc: "[pleading_vassal.GetName|U] ทรุดเข่าของ[pleading_vassal.GetHerHis]ลง ตัวสั่นเทา\n\n"ข้า แต่ฝ่าบาท ข้ากำลังโดนโรคระบาดสองอย่างรุมเร้า [epidemic_scope.GetName|U] กำลังกลืนกินผู้คนของข้า และบัดนี้ [attacking_vassal.GetName] ก็กำลังมาเพื่อดินแดนของข้า ข้าไม่สามารถต่อสู้กับทั้งสองอย่างได้"\n\nเขาวางหีบทองคำใบเล็กๆ ลง — ทั้งหมดที่ [pleading_vassal.GetSheHe] สามารถนำมาได้\n\n"ข้าขอร้องท่าน ช่วยข้ายุติสงครามนี้ก่อนที่ทั้งสองอาณาจักรจะไม่รอด""
 epidemic_events.2001.a: "ข้ายินดีจ่ายเพื่อยุติความโง่เขลานี้"
 epidemic_events.2001.b: "เจ้านำ [epidemic_scope.GetNameNoTooltip] มาถึงหน้าประตู #EMP ของข้า#! ได้อย่างไร!"
 epidemic_events.2001.b.desc: "ทหาร! #EMP อย่างระมัดระวัง#! จับกุม [pleading_vassal.GetFirstNameNoTooltip] จากนั้น #EMP อย่างระมัดระวังยิ่งกว่า#! ล้างทุกสิ่งที่ [pleading_vassal.GetSheHe] สัมผัส!"
 epidemic_events.2001.c: "[attacking_vassal.GetTitledFirstNameNoTooltip] สามารถพูดคุยด้วยเหตุผลได้"
 epidemic_events.2001.c.success: "[attacking_vassal.GetFirstNameNoTooltip] ถูกโน้มน้าวให้ยุติ [vassal_war.GetName]"
 epidemic_events.2001.c.failure: "[vassal_war.GetName] ยังคงดำเนินต่อไป"
 epidemic_events.2001.epidemic_spread.t: "[pleading_vassal.GetFirstNameNoTooltip] ได้แพร่กระจาย [epidemic_scope.GetName]!"
 epidemic_events.2001.danger: "#color_red หากสงครามไม่ได้รับการแก้ไขอย่างรวดเร็ว อาจมีราคาที่ต้องจ่าย...#!"

 epidemic_events.2002.t: "โรคระบาดแห่งสงคราม: ผลที่ตามมา"
 epidemic_events.2002.desc: "ในขณะที่ [vassal_war.GetName|U] ยืดเยื้อต่อไป ผู้คนล้มตายเพื่อผืนดิน และผืนดินก็รับพวกเขากลับไปเป็นกองพะเนิน\n\nบัดนี้ [epidemic_scope.GetName] แพร่กระจายเร็วยิ่งขึ้น — ได้อาหารจากซากศพที่เน่าเปื่อย หมู่บ้านที่ว่างเปล่า และความบ้าคลั่งของการปิดล้อม ไม่มีฝ่ายใดชนะ มี แต่กำลังจะตายกันหมด"
 epidemic_events.2002.a: "โอ้ ตายจริง"

 epidemic_events.2003.t: "ศัตรูที่มองไม่เห็น"
 epidemic_events.2003.desc: ""ทหารของเราล้มลงโดยไม่ต้องต่อสู้ [epidemic_scope.GetName|U] คร่าชีวิตไปมากกว่าคมดาบใดๆ"\n\n[marshal.GetName] พูดอย่างแข็งกร้าว แต่เขาก็พูดถูก ตั้งแต่ [first_epidemic_province.GetName] ถึง [second_epidemic_province.GetName] โรงทหารว่างเปล่า ไม่มีนักรบเหลืออยู่ — มีเพียงชาวนากับโรคระบาด"
 epidemic_events.2003.a: "เพิ่มค่าจ้าง ทหารเกณฑ์จะวิ่งมา"
 epidemic_events.2003.a.flavor: "แม้ทหารที่ดีมักจะพบทองคำ แต่ทองคำไม่ค่อยพบทหารที่ดี"
 epidemic_events.2003.b: "ทหารก็เหมือนชาวนา จุดประสงค์เดียวในชีวิตของพวกเขาคือการตาย!"
 epidemic_events.2003.b.flavor: "มวลชนที่ไม่ได้รับการชำระล้างบางครั้งสามารถแทนที่นักรบที่มีทักษะได้ - หากมองไม่ใกล้เกินไป"
 epidemic_events.2003.c: "แค่ปิดประตูค่ายทหาร!"
 epidemic_events.2003.c.flavor: "หากไม่มีการฝึกซ้อมประจำวัน กองทหารของข้าจะมีประสิทธิภาพน้อยลง แต่หวังว่าพวกเขาจะมีชีวิตอยู่"

 epidemic_events.2005.t: "โถยา"
 epidemic_events.2005.desc: "ข้าเดินผ่านห้องทำงานของ [physician.GetNamePossessive] ทุกวัน ความหวาดกลัวต่อ [epidemic_scope.GetName] ไม่เคยจางหายไป เครื่องมือแปลกๆ ของ [physician.GetHerHis|U] มักจะไม่ช่วยให้สบายใจขึ้น — แต่ ทว่าวันนี้ ไหเคลือบสีใบหนึ่งกลับดึงดูดสายตาข้า\n\n"มันปกป้องข้า" [physician.GetSheHe] พูด พลางประคองมันไว้ "งานฝีมืออันน่าทึ่ง และเป็นโล่ป้องกันความเจ็บป่วย""
 epidemic_events.2005.a: "แน่นอนว่าข้าคือผู้ที่ควรได้รับการปกป้อง?"
 epidemic_events.2005.a.success: "[physician.GetFirstName] ยอมมอบโถให้"
 epidemic_events.2005.a.failure: "[physician.GetFirstName] ยังคงไม่เชื่อ"
 epidemic_events.2005.b: "โถนี้ช่วยชีวิตคนได้? เอามันมาให้ข้า!"
 epidemic_events.2005.b.success: "ท่านแย่ง [medicine_jar.GetName] มาจาก [physician.GetFirstName] ได้สำเร็จ"
 epidemic_events.2005.b.failure: "โถแตก!"
 epidemic_events.2005.c: "ถ้าท่านว่าอย่างนั้น โปรดทำต่อไป"

 epidemic_events.2006.t: "ความบ้าคลั่งในการเต้นรำ"
 epidemic_events.2006.desc: "ชาวนาคนหนึ่งบิดตัวไปมาในลานบ้านของข้า เท้ากระทืบพื้นเป็นจังหวะต่อเนื่องไม่หยุดหย่อนและน่าคลั่ง\n\n"อภัยให้ [dance_victim.GetHerHim] ด้วย ข้า แต่ฝ่าบาท" ผู้เห็นเหตุการณ์คนหนึ่งกล่าว "[dance_victim.GetFirstName] เต้นมาหลายวันแล้วโดยไม่หยุดพัก — คนอื่นๆ ถึงกับเข้าร่วมกับ [dance_victim.GetHerHim]! [dance_victim.GetSheHe|U] ไม่ยอมหยุด"\n\nหญิงสาวครวญคราง ใบหน้าของ [dance_victim.GetHerHim] บิดเบี้ยวด้วยความเจ็บปวดและปีติยินดี ความบ้าคลั่ง หรือบางสิ่งที่เลวร้ายกว่านั้น กำลังครอบงำ [dance_victim.GetHerHim]"
 epidemic_events.2006.a: "เต้นรำไม่หยุดพัก? #EMP ยอดเยี่ยม!#!"
 epidemic_events.2006.b: "ทุกการเต้นรำย่อมมีจุดสิ้นสุด #EMP ใช่ไหม?!#!"
 epidemic_events.2006.c: "เอาเชือกมามัด [dance_victim.GetHerHim] ไว้!"
 epidemic_events.2006.d: "ด้วยนามแห่ง [ROOT.Char.GetFaith.HighGodName] ข้าจะขับไล่เจ้า ปีศาจ!"
 
 epidemic_events.3000.t: "$travel_danger_prefix$ เลือดบนประตู"
 epidemic_events.3000.desc: "สีแดงเป็นสีเดียวที่มีอยู่ใน [epidemic_location.GetName] เสียงไอเป็นเสียงเดียวที่ได้ยิน เรากระตุ้นม้าของเราให้ไปต่อ แต่ข้าเห็น [companion.GetTitledFirstName] หน้าซีด ริมฝีปากของ [companion.GetHerHis] เม้มแน่นจนไร้สีเลือด\n\n"ช่วยด้วย..." ร่างหนึ่งที่เราเข้าใจผิดว่าเป็นศพขยับช้าๆ อย่างเจ็บปวด ร่างกายของ [sick_peasant.GetHerHis] [sick_peasant.Custom('disease_desc_short')]"
 epidemic_events.3000.a: ""ข้าไม่อาจเมินเฉยต่อสิ่งนี้ได้""
 epidemic_events.3000.b: ""[companion.GetFirstNameNoTooltip] ท่านอาจช่วยเหลือพวกเขาได้""
 epidemic_events.3000.c: ""เราไม่มีเวลาสำหรับเรื่องนี้""
 epidemic_events.3000.b.sick: "[companion.GetShortUIName] ล้มป่วย"
 
 epidemic_events.3010.t: "$travel_danger_prefix$ ซากศพ"
 epidemic_events.3010.desc: "เสบียงน้ำของเรากำลังจะหมดเมื่อเราเข้าสู่ [epidemic_location.GetName] หมู่บ้านที่ดูเหมือนร้างมีบ่อน้ำน่ารักอยู่ตรงกลาง และเราก็ผลักม้าของเราไปทางนั้น\n\nไม่นานหลังจากนั้น เหตุผลที่มันร้างก็ปรากฏชัดเจน\n\nศพนอนอยู่บนพื้น [sick_peasant.Custom('disease_desc_short')] และนกกินซากบินวนอยู่เหนือศีรษะซีดๆ ของพวกเขา ช่างเป็นภาพที่น่าสยดสยอง"
 epidemic_events.3010.a: "ข้าเคยอ่านเจอเกี่ยวกับน้ำปนเปื้อน..."
 epidemic_events.3010.b: "น้ำ! #EMP ในที่สุด!#!"
 epidemic_events.3010.b.sick: "ท่านล้มป่วย"
 epidemic_events.3010.c: "เราต้องเดินทางต่อไป"
 humour_knowledge_modifier: "ข้อสันนิษฐานด้านสติ"
 humour_knowledge_modifier_desc: "ตัวละครนี้สังเกตเห็นว่าชาวบ้านป่วยหลังจากดื่มน้ำจากบ่อน้ำที่ติดเชื้อ"
 no_water_modifier: "เสบียงน้ำขาดแคลน"
 no_water_modifier_desc: "ตัวละครนี้ไม่ได้หยุดดื่มน้ำจากบ่อน้ำ"

 ce1_flung_corpse: "โยนศพ"
 ce1_flung_corpse_desc: "ข้าโยนศพข้ามกำแพงเข้าไปในที่ดินของ [flingee.GetNamePossessive]"
 ce1_flung_corpse_desc_second_perspective: "ท่านโยนศพข้ามกำแพงเข้าไปในที่ดินของ [flingee.GetNamePossessive]"
 ce1_flung_corpse_desc_third_perspective: "[owner.GetName] โยนศพข้ามกำแพงเข้าไปในที่ดินของ [flingee.GetNamePossessive]"
 ce1_corpse_flung_at_me: "ข้าถูกโยนศพใส่"
 ce1_corpse_flung_at_me_desc: "[flingee.GetName] บรรจุศพลงในเครื่องยิงหินและโยนมันมาที่ที่ดินของข้า"
 ce1_corpse_flung_at_me_desc_second_perspective: "[flingee.GetName] บรรจุศพลงในเครื่องยิงหินและโยนมันมาที่ที่ดินของท่าน"
 ce1_corpse_flung_at_me_desc_third_perspective: "[flingee.GetName] บรรจุศพลงในเครื่องยิงหินและโยนมันมาที่ที่ดินของ [owner.GetNamePossessive]"
 ce1_meat_shower: "ฝนเนื้อ"
 ce1_meat_shower_desc: "[flinger.GetName] โยนศพเข้ามาในที่ดินของข้า ทำให้มันกลายเป็นฝนเลือดและเนื้อเละๆ"
 ce1_meat_shower_desc_second_perspective: "[flinger.GetName] โยนศพเข้ามาในที่ดินของท่าน ทำให้มันกลายเป็นฝนเลือดและเนื้อเละๆ"
 ce1_meat_shower_desc_third_perspective: "[flinger.GetName] โยนศพเข้ามาในที่ดินของ [owner.GetNamePossessive] ทำให้มันกลายเป็นฝนเลือดและเนื้อเละๆ"

 epidemic_events.5000.t: "ทำอะไรสักอย่าง!"
 epidemic_events.5000.desc: "รายงานอันน่าสลดใจอีกฉบับจาก [infected_county.GetName]\n\n[church_person.Custom2('MyCharacterIntroduction', ROOT.Char)|U] ยื่นมันมาให้ "ผู้คนต้องการให้ดำเนินการ!" [church_person.GetSheHe|U] โบกไม้โบกมืออย่างบ้าคลั่ง "กำจัดพวกสัตว์ร้าย — พวกมันแพร่ [epidemic.GetName]! [ROOT.Char.GetFaith.HighGodName] ประสงค์ เช่นนั้น!"\n\nข้าเหลือบมองแผ่นหนัง ดวงตาของ [church_person.GetHerHis|U] เป็นประกายด้วยความมุ่งมั่น ส่วนของข้า... เต็มไปด้วยความสงสัย"
 epidemic_events.5000.a: "เจ้ารู้ไหม หนูเหล่านั้นดูสกปรกพอ..."
 epidemic_events.5000.b: "แมวไป #EMP ทุกที่#! พวกมันต้องเป็นตัวการ"
 epidemic_events.5000.c: "สุนัขมักจะปกคลุมไปด้วยสิ่งสกปรก กำจัดพวกมันซะ!"
 epidemic_events.5000.d: "เราต้องคัดเลือกแกะ"
 epidemic_events.5000.e: "ไม่จำเป็น"

 epidemic_events.5001.t: "ปิดประตู!"
 epidemic_events.5001.desc: "[courtier.Custom2('MyCharacterIntroduction', ROOT.Char)|U] พรวดพราดเข้ามา ตาเหลือก แขนเต็มไปด้วย [ROOT.Char.Custom('GetWritingMaterial')]\n\n"[ROOT.Char.Custom('FormOfAddressForLiege')] ของข้า — [epidemic_county.GetNameNoTier] กำลังจมอยู่ในกองศพ! ถนนหนทางเต็มไปด้วยความตาย!" [courtier.GetSheHe|U] กระแทกจดหมายลง ข้าพยายามรื้อค้นกองเอกสารอันยุ่งเหยิง\n\nครั้งสุดท้ายที่ข้าได้ยิน [epidemic_scope.GetName] ยังอยู่ภายใต้การควบคุม..."
 epidemic_events.5001.a: ""ปิดมัน! ปิด #EMP ทุกอย่าง!#!""
 epidemic_events.5001.b: "ข้าเชื่อใจผู้ที่รับผิดชอบ [epidemic_county.GetName]"
 epidemic_events.5001.c: ""เจ้าไม่คิดว่าข้ามีเรื่องให้กังวลมากพอแล้วหรือ, [courtier.Custom2('InsultNoun', ROOT.Char)]?!""
 epidemic_events.5001.d: "ควรส่งความช่วยเหลือไป ในขณะที่ปัญหายังเพิ่งเริ่มต้น"
 epidemic_events.5001.e: "พวกเขาจะต้องรับมือกันเอง"

 epidemic_events.5002.t: "ความเงียบของชายฝั่ง"
 epidemic_events.5002.desc: "ขณะที่เราเดินไปด้วยกัน [steward.GetFirstName] กล่าวสุนทรพจน์อันหดหู่เกี่ยวกับโรคระบาดที่แพร่กระจายไปทั่ว [coastal_province.GetName] ในระยะไกล เรามองเห็นศพกองสุมกันตามแนวชายฝั่ง เรือที่ถูกทิ้งร้างเกยตื้นอยู่ใกล้ๆ ขณะที่ข้าหันกลับไปหา [steward.GetFirstNameNoTooltip] สีหน้าอยากรู้อยากเห็นก็เริ่มปรากฏบนใบหน้าของ [steward.GetHerHis]\n\n"จะเป็นอย่างไร หาก [ROOT.Char.Custom('FormOfAddressForLiege')]" [steward.GetSheHe] เริ่ม "จะเป็นอย่างไร หากเราเพียงแค่ ทำให้ศพเหล่านั้นกลายเป็นเรื่องไม่สำคัญ?"\n\nชะงักไปครู่หนึ่ง ข้าค่อยๆ เริ่มคลายแผนการนั้นออกมา เรือลำนั้นถูกทิ้งร้างอยู่แล้ว และศพเหล่านั้นก็ต้องถูกกำจัดไม่ทางใดก็ทางหนึ่ง..."
 epidemic_events.5002.a: "สงสัยว่าน้ำนี้ไหลไปทางไหน?"
 epidemic_events.5002.a.tt: "บางทีเราอาจ ทำให้เรือลำนี้กลายเป็นปัญหาของ #EMP คนอื่น#!..."
 epidemic_events.5002.b: ""บรรทุกมันขึ้นแล้วปล่อยลอยไป""
 epidemic_events.5002.b.success: "เรือไม่เคยถูกพบเห็นอีกเลย"
 epidemic_events.5002.b.failure: "เรือลอยกลับเข้าฝั่งในอีกไม่กี่วันต่อมา"
 epidemic_events.5002.b.criticalfailure: "เรือจม และศพถูกซัดกลับเข้าฝั่ง"
 epidemic_events.5002.c: "พวกเขาสมควรได้รับพิธีศพที่เหมาะสม"
 epidemic_events.5002.d: "เอาล่ะ อย่างน้อยเรือก็ดูเหมือนจะแล่นได้..."

 epidemic_events.5003.t: "หัตถ์แห่งการเยียวยา"
 epidemic_events.5003.desc: "โคลนและความทุกข์ยากเกาะติดอยู่ตามท้องถนนของ [location.GetName] — และเกาะติดชาวนาผู้ทิ้ง [peasant.GetHerselfHimself] ลงต่อหน้าม้าของข้า กอดเด็กที่บอบบางไว้\n\n"[ROOT.Char.Custom('FormOfAddressForLiege')] ของข้า ได้โปรด" [peasant.GetSheHe] อ้อนวอน "[child.GetSheHe|U] ป่วยหนักเหลือเกิน แต่สัมผัสแห่งราชันย์ของท่านอาจรักษา [child.GetHerHim] ได้..."\n\nสายฝนกระหน่ำลงมา เด็กน้อยโอนเอน"
 epidemic_events.5003.a: ""เอา #EMP สิ่งนั้น#! ไปให้พ้นจากข้า!""
 epidemic_events.5003.b: "เอาล่ะ ข้าสงสัยว่านี่จะช่วยได้ แต่..."
 epidemic_events.5003.b.tt: "การที่ชาวนาเชื่อว่าการสัมผัสของราชวงศ์ช่วยรักษาได้นั้นมีทั้งข้อดีและข้อเสีย..."
 epidemic_events.5003.b.criticalsuccess: "เด็กหายป่วยอย่างน่าอัศจรรย์"
 epidemic_events.5003.b.success: "การติดเชื้อยังคงอยู่ แต่พวกเขาดูมีความสุขขึ้น"
 epidemic_events.5003.b.failure: "เด็กป่วยหนักขึ้น"
 epidemic_events.5003.c: "แค่เดินต่อไป อย่าสบตาพวกเขา..."

 epidemic_events.5004.t: "คลื่นมนุษย์"
 epidemic_events.5004.desc: "เสียงคำราม เสียงโครมคราม — ประตูห้องโถงพระที่นั่งเปิดผางออก และฝูงชาวนาทะลักเข้ามา แก่ หนุ่ม ป่วย กลัว — ทุกสายตาจับจ้องมาที่ข้า\n\n"[ROOT.Char.Custom('FormOfAddressForLiege')|U]" หนึ่งในนั้นวิงวอน "ปกป้องพวกเราจาก [epidemic_scope.GetName] ด้วย ท่านต้องทำ"\n\nทหารยามของข้ายืนเตรียมพร้อม รอคำสั่งจากข้า"
 epidemic_events.5004.a: ""เข้ามาเลยทุกคน!""
 epidemic_events.5004.a.new_courtiers: "ข้าราชสำนักใหม่ทั้งหมดได้รับ #positive_value 40#! ความเห็นต่อ #color_white ท่าน#!"
 epidemic_events.5004.a.old_courtiers: "ข้าราชสำนักก่อนหน้าทั้งหมดเสีย #negative_value 10#! ความเห็นต่อ #color_white ท่าน#!"
 epidemic_events.5004.b: "ข้า #EMP ต้อง#! พูดคุยให้พวกเขาเลิกแผนการโง่ๆ นี้..."
 epidemic_events.5004.b.success: "พวกเขาเข้าใจความจำเป็นในการแยกตัว"
 epidemic_events.5004.b.failure: "พวกเขาต้องถูกบังคับให้ออกไป"
 epidemic_events.5004.c: "ทหาร! พาพวกเขาออกไปจากที่นี่!"

 epidemic_events.5005.t: "ชีวิตหรือทองคำ?"
 epidemic_events.5005.desc: "ทองคำไหลมาจากชายฝั่ง — และ [epidemic_scope.GetName] ก็ เช่นกัน\n\n[steward.Custom2('MyCharacterIntroduction', ROOT.Char)|U] มีแผน: พ่อค้าต้องแยกตัวก่อนขนถ่ายสินค้า "มันจะ ทำให้เราปลอดภัย" [steward.GetSheHe] ยืนกราน\n\nการตั้งด่านกักกันโรคหมายถึงภาษีที่น้อยลง ความปลอดภัยคุ้มค่ากับราคาที่ต้องจ่ายหรือไม่?"
 epidemic_events.5005.a: "ทำให้มันสี่สิบวัน และเฆี่ยนตีผู้ที่ไม่เห็นด้วย"
 epidemic_events.5005.a.coastal_quarantine: "ทุกจังหวัดชายฝั่งใน [realm|E]"
 epidemic_events.5005.a.landholders: "$barons_and_minor_landholders_vassals$ ทั้งหมด"
 epidemic_events.5005.b: "พวกเขาจะต้องแยกตัวเป็นเวลายี่สิบวันหลังจากขึ้นฝั่ง"
 epidemic_events.5005.b.success: "พวกเขาเข้าใจความจำเป็นในการแยกตัว"
 epidemic_events.5005.b.failure: "พวกเขาต้องถูกบังคับให้ออกไป"
 epidemic_events.5005.c: "เราไม่สามารถเสี่ยงที่จะ ทำให้เศรษฐกิจปั่นป่วนได้"

 epidemic_events.5006.t: "ไม่ใช่เรื่องตลก"
 epidemic_events.5006.desc: "เสียงหัวเราะดังก้องไปทั่วห้องโถง — แปลกพิกล เมื่อพิจารณาว่า [epidemic_scope.GetName] ยังคงอาละวาดอยู่ภายนอก\n\nข้าคว้าตัว [councillor.Custom2('MyCharacterIntroduction', ROOT.Char)] "มีเรื่องตลกอะไร?"\n\n[councillor.GetSheHe|U] ยิ้ม "พวกหมอหลวงบอกว่าความเจ็บป่วยมาจากอารมณ์ไม่ดี... ดังนั้นเรากำลังหัวเราะไล่มันไป!""
 epidemic_events.5006.a: "ท่านพูดถูกอย่างยิ่ง! ฮ่า ฮ่า ฮ่า! ฮี่ ฮี่!"
 epidemic_events.5006.b: "การวิงวอนต่อ [ROOT.Char.GetFaith.HighGodName] คือความรอดเดียวของเรา"
 epidemic_events.5006.c: "เอาล่ะ บางทีอาจมีอะไรบางอย่างในนั้น..."
 epidemic_events.5006.c.success: "ท่านรู้สึกดีขึ้นเล็กน้อยจริงๆ"
 epidemic_events.5006.c.failure: "ท่านดูไม่ค่อยน่าเชื่อถือ"
 epidemic_events.5006.d: "นี่มันไร้สาระสิ้นดี"

 epidemic_events.5007.t: "เวทมนตร์และการเยียวยาด้วยยา"
 epidemic_events.5007.desc: "ความโกลาหล — [accuser.Custom2('MyCharacterIntroduction', ROOT.Char)] นำฝูงชนที่เกรี้ยวกราด ไล่ต้อน [herbalist.Custom2('MyCharacterIntroduction', ROOT.Char)] จนมุม\n\n"แม่มดเก็บสมุนไพร!" [accuser.GetSheHe] คำราม "ทันทีที่ [herbalist.GetFirstNameNoTooltip] ก้าวเท้าออกไปข้างนอก [epidemic_scope.GetName] ก็ตามมา!"\n\n[herbalist.GetFirstNameNoTooltip] ยืนหยัดอย่างมั่นคง โบกมือปัดอย่างไม่ใยดีขณะที่เสียงดังขึ้น"
 epidemic_events.5007.a: ""พอแล้ว! การปรุงยาเป็นศิลปะอันสูงส่ง""
 epidemic_events.5007.b: "จองจำแม่มด!"
 epidemic_events.5007.c: ""ให้เราคิดเรื่องนี้ให้รอบคอบดีไหม?""
 epidemic_events.5007.c.success: "ท่านสามารถโน้มน้าวฝูงชนได้สำเร็จ"
 epidemic_events.5007.c.failure: "ฝูงชนเพิกเฉยต่อข้อโต้แย้งของท่าน"
 epidemic_events.5007.d: ""พอแล้ว! หยุดข้อกล่าวหาที่ไร้เหตุผลของเจ้าเสีย [accuser.GetFirstNameNoTooltip]""
 epidemic_events.5007.e: "บางทีถ้า [herbalist.GetFirstNameNoTooltip] สัญญาว่าจะเลิกงานฝีมือ...?"

 epidemic_events.5008.t: "ปลอดภัยและสบายดี"
 epidemic_events.5008.desc: "มันไม่ใช่เรื่อง #EMP ดี#! เสียทีเดียว [epidemic_scope.GetName] นี้ แต่เมื่อเวลาผ่านไปข้าก็เห็นประโยชน์บางอย่าง\n\nท้ายที่สุด ข้าแทบไม่มีแขกมาเยี่ยมเลยเป็นเวลาหลายวันแล้ว — อย่างที่ข้าชอบ! — และแม้ แต่คนรับใช้ก็ ทำให้ตัวเองหายาก เป็นการยากที่จะบอกว่าสิ่งนี้ป้องกันข้าจากการติดโรคได้มากน้อยเพียงใด แต่ข้าค่อนข้างพอใจกับผลลัพธ์\n\nถึงกระนั้น ข้าก็สงสัย บางทีข้าควรพยายามแสดงตัวบ้าง? มันเป็น #EMP ความเสี่ยง#! เหลือเกิน..."
 epidemic_events.5008.a: "ไม่มีใครได้รับอนุญาตให้พบข้าโดยไม่ได้รับอนุญาตจากข้า!"
 epidemic_events.5008.b: "ข้าต้องให้ไพร่ฟ้าข้าแผ่นดินเห็นหน้า"
 epidemic_events.5008.c: "[epidemic_scope.GetNameNoTooltip] เป็นข้ออ้างที่ดีอะไร เช่นนี้!"

 epidemic_events.5009.t: "กลิ่นที่ยังคงอยู่"
 epidemic_events.5009.desc: "ตลาดเหม็นคลุ้ง — แต่แผงหนึ่งกลับมีกลิ่นหอมอย่างน่าประหลาด\n\n"ถุงหอมสดใหม่! สมุนไพรชั้นเลิศ!" พ่อค้าตะโกน พลางยัดถุงหอมใส่มือข้า "ป้องกัน [epidemic_scope.GetName] ได้!"\n\nมันมีกลิ่นหอมน่าสนใจ... แม้ว่าราคาจะสูงลิ่วก็ตาม"
 epidemic_events.5009.a: ""ท่านมีขายกี่อัน?""
 epidemic_events.5009.b: "ข้าจะซื้อถุงหอม [newly_created_artifact.GetNameNoTooltip] ที่ดีที่สุดของเจ้า"
 epidemic_events.5009.b.success: "[merchant.GetSheHe|U] ยอมรับอย่างไม่เต็มใจ"
 epidemic_events.5009.b.failure: "[merchant.GetSheHe|U] ปฏิเสธที่จะลดราคา"
 epidemic_events.5009.b.criticalfailure: "[merchant.GetSheHe|U] ปฏิเสธที่จะขายอย่างโกรธเคือง"
 epidemic_events.5009.c: "อันเดียวคงไม่เป็นไร"
 epidemic_events.5009.d: "สิ่งเหล่านี้จะไม่ช่วยชีวิตใครได้"

 epidemic_events.5010.t: "ถนนที่แออัดของ [capital.GetBaseNameNoTierPossessiveNoTooltip]"
 epidemic_events.5010.opening: "ในที่สุดมันก็มาถึง โรคระบาดอันน่าสะพรึงกลัวคุกคามไปตามถนนของ [capital.GetBaseNameNoTier] เคียวอันไร้ความปรานีของมันฟาดฟันทุกคนที่ขวางหน้า\n\n"
 epidemic_events.5010.santiago: "บัดนี้มีเท้าอันมีค่าน้อยนิดที่เหยียบย่ำบนเส้นทางนักบุญยากอบ มีเพียงผู้ที่แข็งแกร่งและศรัทธาแรงกล้าที่สุดเท่านั้นที่ยังคงเดินตามเส้นทางสู่เมืองที่ประสบภัยพิบัติ แสวงหาความรอดจากผู้ทรงอำนาจสูงสุด แม้ว่าพวกเขาเองจะยอมจำนนต่อโรคร้ายที่น่ารังเกียจ\n\nจัตุรัสที่สวยงาม ซึ่งมักจะเต็มไปด้วยความร่าเริงและการแลกเปลี่ยนสินค้าด้วยไมตรีจิต กลายเป็นที่หลบภัยของผู้ถูกสาปแช่ง คนตายและผู้ที่กำลังจะตายส่งเสียงครืดคราดครั้งสุดท้ายที่นี่ โดดเดี่ยวอย่างน่าสมเพช"
 epidemic_events.5010.london: "กระแสน้ำที่อ่อนโยนของแม่น้ำเทมส์พัดพาสิ่งต่างๆ มากกว่าแค่ตะกอนและพ่อค้าในตอนนี้ ศพที่บวมอืดและซีดจางจากแสงแดดถูกพัดพาไปตามแม่น้ำ ใบหน้าที่ทุกข์ทรมานของพวกเขาแข็งทื่อเป็นรอยยิ้มแสยะเงียบๆ ฝีหนองที่แตกออกเป็นสีม่วงคล้ำตัดกับผิวสีซีด\n\nกำแพงโรมันเก่าแก่ ซึ่งหลายครั้งเคยเป็นผู้พิทักษ์จากการบุกรุกของสิ่งมีชีวิต บัดนี้ถูกค้ำยันด้วยคนตาย ถนนที่คดเคี้ยวและแคบกลายเป็นเขาวงกตของศพที่ซ้อนกัน หนูใช้กองศพเป็นทั้งที่หลบภัยและอาหาร"
 epidemic_events.5010.rome: "โรม! โรมอันรุ่งโรจน์ นครหลวงของโลก\n\nวิญญาณนับไม่ถ้วนได้เดินบนถนนที่น่าเคารพเหล่านี้ แต่จำนวนคนตายกลับเพิ่มขึ้นอย่างรวดเร็ววันแล้ววันเล่า โรคระบาดกวาดไปตามถนน ทำลายล้างทุกจัตุรัสที่สวยงามและซุ้มประตูอันรุ่งโรจน์ หินอ่อนเก่าแก่ยืนนิ่งเงียบ ช่วยอะไรไม่ได้กับการทรมานของสิ่งมีชีวิต ผู้ที่กำลังจะตายส่งเสียงครืดคราดครั้งสุดท้าย บนริมฝีปากของพวกเขามีคำพูดที่แทบไม่กล้าคิดถึงในยามที่ดีกว่า:\n\n"นครอมตะนั้นเป็นอมตะเพียงใด?""
 epidemic_events.5010.paris: "สายน้ำที่คดเคี้ยวของแม่น้ำแซนซัดสาดอย่างมีความสุขกับชายฝั่งของอีลเดอลาซิเต้ ขัดแย้งกับหายนะบนบก\n\nผู้ป่วยเดินโซซัดโซเซอย่างสิ้นหวังระหว่างอาคารที่ทรุดโทรม ที่ ซึ่งคนทำขนมปังเคยเร่ขายสินค้า บัดนี้มีกองศพนอนอยู่ ผู้ที่ยังมีชีวิตอยู่ไม่สามารถตามทันกระแสความเจ็บป่วยที่บีบรัดเมืองได้\n\nฉากนี้เกือบจะสงบสุข หากไม่ใช่ เพราะเสียงครวญครางและเสียงไอของผู้ที่กำลังจะตาย"
 epidemic_events.5010.constantinople: "นครแห่งความปรารถนาของโลก ราชินีแห่งนคร ประตูสู่ความสุข สี่แยกของโลก\n\nชื่ออันยิ่งใหญ่และสง่างาม เช่นนี้มอบให้กับมหานครอันยิ่งใหญ่ ซึ่งทอดตัวอยู่บนแหลมที่ส่องประกายมาตั้งแต่สมัยโบราณกาล ชื่อเดียวกันนั้นรู้สึกประชดประชันอย่างร้ายกาจในตอนนี้ โดยมีผู้ป่วยและผู้ที่อ่อนแอกำลังเดินฝ่าศพของผู้ที่ยอมจำนนไปแล้วอย่างน่าสังเวช\n\nพวกเขาได้รับความปลอบใจจากความรุ่งโรจน์ในอดีตเหล่านั้นหรือไม่ขณะที่พวกเขากำลังจะตาย?"
 epidemic_events.5010.prague: "ตลาดและจัตุรัสการค้าของเมือง ซึ่งปกติจะคึกคักไปด้วยกิจกรรม บัดนี้เงียบสงัด สะพานที่สง่างามข้ามแม่น้ำวัลตาวาอุดตันไปด้วยผู้ป่วย คนตาย ทำให้เกิดการจราจรติดขัดท่ามกลางช่วงสะพานด้านล่าง\n\nปราสาทวีเชฮราดมองลงมายังการสังหารหมู่อย่างเศร้าสร้อย กำแพงที่แข็งแกร่ง ซึ่งก่อตั้งโดยดยุคคร็อกเมื่อหลายชั่วอายุคนก่อน ไม่สามารถหยุดยั้งนักฆ่าที่ร้ายกาจและเงียบเชียบ เช่นโรคระบาดอันน่าสะพรึงกลัวได้\n\nนครร้อยยอดแหลมตายอย่างช้าๆ ยอดแหลมที่โอ้อวดเหล่านั้นไม่สามารถป้องกันไม่ให้ท้องฟ้าถล่มลงมาได้"
 epidemic_events.5010.toledo: "มีเมืองใดที่เป็นที่รู้จักในด้านเหล็กกล้ามากกว่าโตเลโด? สายน้ำของแม่น้ำเทกัสถูกใช้เพื่อชุบคมดาบนับล้านเล่ม แต่มีภัยคุกคามบางอย่างที่ไม่มีงานฝีมือชั้นดีใดๆ สามารถป้องกันได้\n\nเป็นเรื่องน่าขันอย่างยิ่งที่สถานที่ที่หลากหลาย เช่นนี้กลับรวมเป็นหนึ่งเดียวกันอย่างกะทันหันเมื่อเผชิญกับความทุกข์ยาก เช่นนี้ ความเจ็บป่วยฆ่าโดยไม่เลือกปฏิบัติ ทำให้ทุกคนล้มป่วยลงจากทุกชนชั้นในชีวิต\n\nโรงตีเหล็กโบราณเงียบสงัด ผู้ที่เคยทำงานที่นั่นหันมือที่ด้านหนาไปสวดอ้อนวอนแทนการทำงานหนัก ด้วยความหวังว่าสิ่งศักดิ์สิทธิ์อาจช่วยพวกเขาได้ในที่ ซึ่งอาวุธทำไม่ได้"
 epidemic_events.5010.cairo: "ไคโรโบราณเกินกว่าจะวัดได้ เฝ้าดูเมืองพี่น้องในเมมฟิสและเฮลิโอโปลิสรุ่งเรืองและล่มสลาย แต่ก็ยังคงยืนหยัดอย่างแข็งแกร่ง มันอดทนมามาก แต่จะต้องอดทนต่อไปอีก\n\nแม่น้ำไนล์ แม่น้ำแห่งชีวิต วันนี้แบกรับความตายไปด้วยขณะที่ไหล ศพที่เน่าเปื่อยถูกพัดพาไปตามสายน้ำเพื่อเน่าเปื่อยในดินดอนสามเหลี่ยมปากแม่น้ำที่เต็มไปด้วยโคลน ซึ่งเป็นจุดที่บรรจบกับทะเล แต่ก็มีศพมาแทนที่มากขึ้นเรื่อยๆ เครื่องวัดระดับน้ำไนล์อุดตันไปด้วยศพ ถูกโยนลงไปในคอหอยอย่างสิ้นหวังเพื่อประหยัดเวลา ประหยัดพื้นที่ ช่วยชีวิตผู้ที่ยังมีชีวิตอยู่\n\nเมืองเก่าแก่เหี่ยวเฉา"
 epidemic_events.5010.kanyakubja: "ไม่มีใครรู้ว่ามีกี่ชั่วอายุคนที่อาศัยและตายที่นี่ แต่ทุกคนเห็นพ้องกันว่าเมืองนี้เก่าแก่จนเหลือเชื่อ มันจะต้องใช้ประสบการณ์และภูมิปัญญาทั้งหมดเพื่อเอาชีวิตรอดจากภัยคุกคามนี้\n\nโรงกลั่นน้ำหอมที่มีชื่อเสียงยังคงผลิตน้ำมันหอมระเหยต่อไป ขวดหนังอูฐเต็มไปด้วยน้ำหอมและสวมรอบคอของผู้ที่มีสุขภาพดีเพื่อป้องกันกลิ่นเหม็น\n\nอย่างไรก็ตาม ที่อื่น เสียงเดียวที่สะท้อนจากกำแพงคือเสียงครวญครางของคนตายและผู้ที่กำลังจะตาย ศพของพวกเขาซ้อนกันสูงจนเหลือเชื่อในตรอกแคบๆ"
 epidemic_events.5010.varanasi: "เป็นที่รู้จักกันทั่วไปในชื่อเมืองแห่งแสงสว่าง แต่วาราณสีเป็นเมืองแห่งความตายมานานพอๆ กัน ดูเหมือนเหมาะสมแล้ว ที่มันควรจะเป็นเจ้าภาพจัดงานโรคระบาดที่ร้ายแรงที่สุดนี้\n\nในยามสุข แม่น้ำคงคาเต็มไปด้วยชีวิตชีวา บัดนี้ มันแบกรับ แต่คนตาย ศพที่บวมอืดของพวกเขาเกยตื้นบนริมฝั่งแม่น้ำ ถูกเตะออกไปโดยผู้คนที่ยังมีชีวิตอยู่เพียงไม่กี่คนที่กล้าออกไปข้างนอก\n\nเสียงร้องไห้และเสียงไอดังสะท้อนจากหินโบราณของเมืองยุคก่อนน้ำท่วมโลกนี้"
 epidemic_events.5010.fallback: "ถนนที่คดเคี้ยวและบ้านเรือนที่ซ้อนกัน ซึ่งปกติจะคึกคักไปด้วยฝูงชนที่หนาแน่น บัดนี้เงียบสงัด มีเพียงเสียงคร่ำครวญอันน่าสมเพชของผู้สูญเสียและเสียงไอเปียกๆ ของผู้ที่กำลังจะเข้าร่วมกับกองศพที่เพิ่มขึ้นเท่านั้นที่ทำลายความเงียบ"
 epidemic_events.5010.a: "การบริจาคทานอย่างน้อยอาจช่วยให้ผู้ที่กำลังจะตายจากไปอย่างสงบ"
 epidemic_events.5010.b: "#DIE1 เมือง...#! #DIE2 เมืองอันมีค่าของข้า...#!"
 epidemic_events.5010.b.win: "ท่านตัดสินใจที่จะสร้างใหม่"
 epidemic_events.5010.b.neutral: "ท่านกังวลเกี่ยวกับความท้าทาย"
 epidemic_events.5010.b.lose: "ท่านจมดิ่งสู่ความรู้สึกหวาดกลัว"

 epidemic_events.5900.t: "กาฬมรณะ"
 epidemic_events.5900.desc: "โรคระบาดคุกคามแผ่นดิน\n\nฝีหนองที่น่าสยดสยองและเดือดปุดๆ เติบโตขึ้นบนเหยื่อ ซึ่งเสียงร้องขอความช่วยเหลืออันน่าสมเพชของพวกเขาค่อยๆ ถูกบีบคั้นขณะที่พวกเขากระเสือกกระสนและจมลงในคอหอยที่เต็มไปด้วยหนองของตนเอง\n\nตั้งแต่ขอทานที่ต่ำต้อยที่สุดไปจนถึงจักรพรรดิที่ได้รับการยกย่องมากที่สุด ทุกคนต่างหวาดกลัวเคียวอันไร้ความปรานีของโรคระบาดที่ไร้ความปรานี ผู้ที่รอดชีวิตต้องเฝ้าดูอย่างช่วยไม่ได้ขณะที่ทุกคนรอบตัวพวกเขาล้มตาย\n\nผู้ศรัทธาหันไปหาสิ่งศักดิ์สิทธิ์เพื่อหาผู้ช่วยให้รอด และผู้มีอำนาจหันไปหาความร่ำรวยของพวกเขา แต่ไม่มีใครสามารถปลอดภัยได้อย่างแท้จริง หนวดปลาหมึกอันน่าสะพรึงกลัวแผ่ขยายไปทั่วแผ่นดิน บีบรัดมัน จนกระทั่งมันไม่หายใจอีกต่อไป\n\nกาฬมรณะมาถึงแล้ว [ROOT.Char.GetFaith.HighGodName] โปรดช่วยเราทุกคนด้วยเถิด"
 epidemic_events.5900.desc_asia: "มรณภัยกำลังย่างกรายในหมู่เรา\n\nผู้ติดเชื้อบวมเป่งไปด้วยตุ่มหนอง เสียงร้องของพวกเขาแปรเปลี่ยนเป็นเสียงครืดคราดในลำคอเมื่อลมหายใจล้มเหลว ในความตาย แม้ แต่ผู้ที่เสียงดังที่สุดก็เงียบงัน\n\nไม่มีผู้ใดรอดพ้น จากกรรมกรเท้าเปล่าไปจนถึงเจ้าชายในวัง กงล้อแห่งความทุกข์ทรมานหมุนวนไปเพื่อทุกคน ผู้ที่ยังมีชีวิตอยู่เหลือเพียงหน้าที่กวาดเถ้าถ่านจากธรณีประตูและนับเสื่อที่ว่างเปล่า\n\nบ้างสวดมนต์ บ้างยึดติดกับพิธีกรรมและยศถาบรรดาศักดิ์ — แต่ไม่มีคำสั่งใดหยุดยั้งความเสื่อมสลายได้ ไม่มีบุญกุศลใดชดเชยความสูญเสียได้ ดั่งสายหมอกในหุบเขา โรคระบาดแพร่กระจายไปโดยมองไม่เห็น แต่สัมผัสได้ในทุกเช้าที่เงียบสงัด\n\nมฤตยูดำมาถึงแล้ว สวรรค์โปรดเบือนหน้าหนี"
 epidemic_events.5900.christian: ""ข้า แต่พระบิดา ผู้สถิตในสวรรค์ พระนามของพระองค์จงเป็นที่เคารพสักการะ...""
 epidemic_events.5900.fallback: "ขอให้เราอดทนในยามที่มืดมนเหล่านี้"

 epidemic_events.5901.t: "ลึกถึงข้อศอก"
 epidemic_events.5901.desc: "ซากศพนอนอยู่บนโต๊ะ รายล้อมไปด้วยอุปกรณ์อันน่าขนลุกต่างๆ นานา เช่นเดียวกับหมอหลวงของข้า [physician.GetFirstName] และตัวข้าเอง\n\n"ข้าไม่แน่ใจ [ROOT.Char.Custom('FormOfAddressForLiege')]" [physician.GetFirstNameNoTooltip] เริ่มพูดอย่างกระวนกระวาย สายตาของ [physician.GetHerHis] จับจ้องอยู่ที่เท้าของ [physician.GetHerHis] อย่างมั่นคง "ข้าไม่รู้ว่าเราจะได้ประโยชน์อะไรจากศพนี้..."\n\n[physician.GetSheHe|U] รู้ดีว่าเรา #EMP สามารถ#! ทำอะไรได้ [physician.GetSheHe] เพียงแค่ไม่อยากให้ข้าขอมันจาก [physician.GetHerHim] การผ่าพิสูจน์ซากศพของผู้ติดเชื้ออาจ ทำให้เราได้เบาะแสอันล้ำค่าเกี่ยวกับวิธีต่อสู้กับมัน คำถามเดียวคือมีความเสี่ยงที่จะติดโรคร้ายแรงนี้หรือไม่..."
 epidemic_events.5901.a: ""ทำไมเราไม่ทำด้วยกันล่ะ?""
 epidemic_events.5901.a.tt: "ได้รับข้อมูลเชิงลึก"
 epidemic_events.5901.a.tt.plague: "ติดโรคระบาด"
 epidemic_events.5901.b: "ข้าต้องการการผ่าศพ"
 epidemic_events.5901.c: "เอาล่ะ เราจะทำโดยไม่มีมัน"

 epidemic_events.5902.t: "การข้ามพรมแดน"
 epidemic_events.5902.desc: "ข้าลงจากหลังม้าอย่างเร่งรีบ ผลักฝ่าฝูงทหารใน [border_province.GetName] ภายในเคาน์ตีชายแดน [border_county.GetNameNoTier] สาส์นจากจอมพลของข้า [marshal.GetFirstName] ได้ขอการตัดสินใจและการปรากฏตัวของข้า และเมื่อข้าเห็น [marshal.GetHerHim] ข้าก็เข้าใจว่าทำไม\n\nฝูงชนที่มอซอ เหนื่อยล้า และหิวโหย ยืนอยู่ตรงหน้าเราอย่างไม่แน่ใจ พวกเขาเห็นได้ชัดว่าเป็นผู้ลี้ภัยจากโรคระบาดอันโหดร้ายที่ยังคงทำลายล้างดินแดนอันห่างไกล แต่ไม่มีหลักประกันว่าพวกเขาจะรอดพ้นมาได้โดยไม่ได้รับอันตราย\n\nแม้ แต่ตอนนี้ ข้าก็เห็นชายคนหนึ่งในกลุ่มไอและสำลัก [marshal.GetFirstNameNoTooltip] ปิดปากของ [marshal.GetHerHis] อย่างไม่แน่ใจ"
 epidemic_events.5902.a: "เราไม่สามารถเสี่ยงได้ ฆ่าพวกเขาทั้งหมด"
 epidemic_events.5902.b: "บางทีเราอาจตั้งค่ายชั่วคราวได้"
 epidemic_events.5902.c: "ส่งพวกเขาไป"
 epidemic_events.5902.d: "ปล่อยให้พวกเขาผ่านไป"

 epidemic_events.5903.t: "ความสุขเรียบง่าย ที่ถูกทอดทิ้ง"
 epidemic_events.5903.desc: ""[ROOT.Char.GetFirstName]! ไม่!" เสียงของ [family.GetFirstName] ดังขึ้นเหนือเสียงม้าของข้าขณะที่มันเดินไปตามทาง [family.GetSheHe|U] วิ่งมาข้างๆ ข้า จ้องมองขึ้นมาอย่างตำหนิ\n\n"ท่านได้ยินสิ่งที่กำลังจะมาถึงแล้ว ความตายและโรคภัยไข้เจ็บทั้งหมดนั้น..." [family.GetSheHe] บิดมือของ [family.GetHerHis] อย่างไม่มีความสุข "ท่านต้องอยู่ที่นี่ ปลอดภัยและสบายดีภายใน [SelectLocalization( IsLandlessAdventurer( ROOT.Char ), 'ค่าย', 'กำแพง')] โปรดเถิด"\n\nข้าทำได้เพียงถอนหายใจ หากข้าออกจากประตูเร็วกว่านี้เล็กน้อย ข้าคงกำลังขี่ม้าอยู่ในชนบทตอนนี้ สูดอากาศธรรมชาติอย่างมีความสุข"
 epidemic_events.5903.a: "[family.GetSheHe|U] อาจจะพูดถูก"
 epidemic_events.5903.b: ""บา! ข้าจะไม่เป็นไร!""

 epidemic_events.5904.t: "นักเทศน์วันสิ้นโลก"
 epidemic_events.5904.desc: "ตลาดมักจะมีความวุ่นวายพอสมควร แต่วันนี้มีเสียงดังอึกทึกกึกก้องไปทั่วสถานที่ ข้าเห็นตัวการ ชายคนหนึ่งกำลังตะโกนสุดเสียงของ [doomsday_preacher.GetHerHis]\n\n"ยุคสุดท้ายมาถึงแล้ว!" [doomsday_preacher.GetSheHe] คร่ำครวญ ดุด่าผู้คนที่เดินผ่านไปมา "เราทุกคนจะพินาศ! ตามที่เขียนไว้!"\n\nเศษน้ำลายที่กระเด็นออกจากปากของนักเทศน์ ทำให้คนส่วนใหญ่รังเกียจ แต่ผู้ชมบางคนเริ่มเห็นด้วยเสียงดัง"
 epidemic_events.5904.a: "[doomsday_preacher.GetSheHe|U] พูดถูก! เราต้องเตรียมพร้อม!"
 epidemic_events.5904.b: "ทหาร? จับกุม [doomsday_preacher.GetWomanMan] คนนั้น"
 epidemic_events.5904.c: ""แสดงให้ข้าเห็นว่ามันเขียนไว้ที่ไหน พิสูจน์คำพูดของเจ้า""
 epidemic_events.5904.c.tt.success: "ท่านพิสูจน์ว่าพวกเขาผิด"
 epidemic_events.5904.c.tt.failure: "ท่านแพ้การโต้แย้ง"
 epidemic_events.5904.d: ""อย่าฟัง [doomsday_preacher.GetHerHim]!""
 epidemic_events.5904.d.tt: "บารอนีทั้งหมดรอบๆ [doomsday_province.GetName] มีโอกาส #color_white 15%#! ที่จะได้รับตัวปรับ แต่งเดียวกัน"

 epidemic_events.5905.t: "ความประหม่าที่แพร่กระจาย"
 epidemic_events.5905.desc: "เมื่อความตกตะลึงในตอนแรกต่อการปรากฏตัวของข้าจากนักพนันคลายลง โรงเตี๊ยมแห่งนี้ก็กลายเป็นสถานที่พักผ่อนที่ค่อนข้างดี อย่างไรก็ตาม เจ้าของร้านดูเหมือนจะค่อนข้างวิตก\n\n"ท่านรู้ไหม [ROOT.Char.Custom('FormOfAddressForLiege')] เกี่ยวกับโรคระบาดครั้งใหญ่น่ะ? ท่านได้ยินไหมว่ามันกำลังทำอะไรกับผู้คน? มันกำลัง ทำให้พวกเขา #EMP [ROOT.GetCharacter.Custom('GetPlagueEffect')]!#!" [peasant.GetSheHe] ทำท่าทางอย่างบ้าคลั่ง "นั่นคือสิ่งที่พวกเขาพูด! เราจะรอดได้อย่างไร?!"\n\n#EMP 'พวกเขา'#! ที่ยุ่งตลอดเวลา กำลังทำงานได้ดีอีกครั้ง..."
 epidemic_events.5905.a: ""ไม่จำเป็นต้องตื่นตระหนก เชื่อข้า ข้าเป็นหมอ""
 epidemic_events.5905.a.tt: "บารอนีทั้งหมดรอบๆ [province.GetName] มีโอกาส #color_white 50%#! ที่จะได้รับตัวปรับ แต่งเดียวกัน"
 epidemic_events.5905.b: ""ฟังดูเป็นไปได้สำหรับท่านหรือไม่?""
 epidemic_events.5905.b.tt.success: "ท่านโน้มน้าวพวกเขาได้สำเร็จ"
 epidemic_events.5905.b.tt.failure: "พวกเขาดูไม่เชื่อ"
 epidemic_events.5905.c: "การโต้แย้งกับ [peasant.GetHerHim] จะไม่ ทำให้ [peasant.GetHerHim] เชื่อข้าอยู่ดี"

 epidemic_events.5906.t: "พเนจร คลุ้มคลั่ง"
 epidemic_events.5906.desc: "ทหารยามมักจะไม่ค่อยกล้ารบกวนข้าในห้องสภาเท่าไหร่ แต่วันนี้พวกเขาบุกเข้ามาอย่างง่ายดาย โดยมีจอมพลของข้า [marshal.GetFirstName] เป็นผู้นำ ด้านหลังพวกเขา ถูกลากมาอย่างไม่สมเกียรติ คือร่างที่น่าสมเพชที่มีดวงตาเบิกกว้างและสิ่งที่ดูเหมือนจะเป็นแส้กำแน่นอยู่ในมือของ [flagellant.GetHerHis]\n\n"เราพบ [flagellant.GetHerHim] ใน [doomsday_province.GetName] เดินเตร่ไปตามถนน เฆี่ยนตี [flagellant.GetHerselfHimself] จนเลือดอาบด้วยสิ่งนั้น" [marshal.GetFirstNameNoTooltip|U] ชี้ไปที่แส้ "[flagellant.GetSheHe|U] กำลัง ทำให้ชาวบ้านหวาดกลัวจนแทบสิ้นสติ พร่ำเพ้อว่าโรคระบาดอันยิ่งใหญ่กำลังมาถึงเราและเราทุกคนต้องสำนึกผิด""
 epidemic_events.5906.a: ""เจ้าและพวกของเจ้ากำลังทำลายศรัทธา [ROOT.Char.GetFaith.GetAdjectiveNoTooltip]!""
 epidemic_events.5906.a.tt.success: "ท่านโต้แย้งประเด็นของท่านได้สำเร็จ"
 epidemic_events.5906.a.tt.failure: "ผู้โบยตียังคงแน่วแน่"
 epidemic_events.5906.b: "บางที [flagellant.GetSheHe] อาจมีประเด็น..."
 epidemic_events.5906.c: ""ขัง [flagellant.GetHerHim] ไว้ [marshal.GetFirstNameNoTooltip]""
 epidemic_events.5906.d: "ปล่อย [flagellant.GetHerHim] ไป พวกเขาไม่ได้ทำอันตรายใดๆ"
 epidemic_events.5906.d.tt: "บารอนีทั้งหมดรอบๆ [doomsday_province.GetName] มีโอกาส #color_white 25%#! ที่จะได้รับตัวปรับ แต่งเดียวกัน"
 fervor_loss_flagellants: "ผู้โบยตีตนเองพเนจรอย่างอิสระ"

 epidemic_events.5907.t: "อาการคันเล็กน้อย"
 epidemic_events.5907.desc: "เปลือกตาของข้ากระพือเปิดขณะที่แสงแดดยามเช้าส่องลงมา ข้าม้วนตัวลุกขึ้น ยืดตัว หาว และ... #EMP ไอ#!.\n\nคอของข้าเจ็บเล็กน้อย ดวงตาของข้าก็พร่ามัวกว่าปกติเล็กน้อย ข้าถึงกับรู้สึกคัดจมูกเล็กน้อย\n\nโอ้ ไม่นะ โปรดอย่าเป็นข้าเลย โปรดช่วยข้าให้พ้นจากชะตากรรมนี้ด้วยเถิด บอกข้าทีเถิด โอ้ [ROOT.Char.GetFaith.HighGodName] ว่าโรคระบาดอันน่าสะพรึงกลัวยังไม่ได้แพร่กระจายมาถึงดินแดนเหล่านี้และ ทำให้ข้าเป็นเหยื่อของมัน..."
 epidemic_events.5907.a: "หมอหลวงของข้าจะให้การรักษาที่ดีที่สุดแก่ข้า!"
 epidemic_events.5907.b: "มันไม่มีอะไร แน่นอนว่ามันไม่มีอะไร"
 epidemic_events.5907.b.success: "มันไม่มีอะไรจริงๆ"
 epidemic_events.5907.b.failure: "มันเป็นแค่หวัด"
 epidemic_events.5907.b.criticalfailure: "ท่านป่วยหนักจริงๆ"

 epidemic_events.5908.t: "คนกองศพแข็งทื่อ"
 epidemic_events.5908.desc: "ผู้ร้องทุกข์คนแรกของวันก้าวมาหาข้า และเห็นได้ชัดว่านี่ไม่ใช่ผู้มีตำแหน่งสูงส่งอะไร ดินและสิ่งสกปรกใต้เล็บมือของ [gravedigger.GetHerHis] ยืนยันสิ่งนั้น แม้ว่า [gravedigger.GetSheHe] จะพยายามอย่างชัดเจนที่จะปรากฏตัวให้ดูดี\n\n"ข้าเป็นตัวแทนของสัปเหร่อแห่ง [province.GetName] [ROOT.Char.Custom('FormOfAddressForLiege')]" [gravedigger.GetSheHe] เริ่ม "และเรามีคำร้องขอถึงท่าน โรคระบาดที่น่าสะพรึงกลัวกำลังคืบคลานเข้ามาหาเรา ในขณะที่เราพูด: อาชีพอันสูงส่งของเราจะเป็นที่ต้องการอย่างมากในไม่ช้า นั่นแน่นอน"\n\n"เราจะเป็นคนจัดการศพ เป็นคนที่เสี่ยงที่สุด" [gravedigger.GetSheHe|U] กล่าวต่อ "เพื่อเป็นการตอบแทน เราขอเพียงค่าตอบแทนเพิ่มขึ้นเล็กน้อย พระเมตตาของท่านพอจะแบ่งเหรียญให้ได้หรือไม่?""
 epidemic_events.5908.a: ""เจ้าจะขุดหลุมฝังศพตัวเองถ้าเจ้าถามอีกครั้ง""
 epidemic_events.5908.b: "ตรวจสอบให้แน่ใจว่าพวกเขาได้รับการชดเชยอย่างยุติธรรม"
 epidemic_events.5908.c: ""บา! ยังมีอีกมากที่เจ้าจากมา""

 epidemic_events.5999.t: "ขอบฟ้าที่มืดมนลง"
 epidemic_events.5999.desc: "สาส์นและข้อความต่างๆ กระจัดกระจายอยู่บนโต๊ะทำงานของข้า ทั้งหมดเกี่ยวกับเรื่องใดเรื่องหนึ่งโดยเฉพาะ ความตื่นตระหนกซึมออกมาจากคำพูด ก่อตัวเป็นบ่อแห่งความหวาดกลัวที่เพิ่มสูงขึ้นอย่างรวดเร็วในท้องของข้า\n\nความเจ็บป่วยเริ่มต้นด้วยอาการหนาวสั่นและมีไข้ ก่อนที่ฝีหนองที่เนื้อตายจะก่อตัวขึ้นใต้รักแร้ของผู้โชคร้าย ลมหายใจของพวกเขามาพร้อมกับเสียงหอบหายใจอันน่าสังเวชสลับกับการขับเลือดออกมา ริมฝีปากและนิ้วเท้าเปลี่ยนเป็นสีดำคล้ำ จากนั้นมันก็ฆ่าโดยไม่เลือกหน้า รวยและจน หนุ่มและแก่ ดยุคและผู้ถูกกดขี่\n\nรายงานมาจากดินแดนอันห่างไกลในตอนนี้ แต่นิ้วที่สั่นเทาของข้าไล่ตามวันที่\n\nมันกำลังใกล้เข้ามา"
 epidemic_events.5999.a: "ฮ่า! ปล่อยให้พวกเขาตายไป"
 epidemic_events.5999.a.tt: "มันอยู่ไกลมาก! เราอาจจะยินดีกับโชคร้ายของพวกเขาก็ได้"
 epidemic_events.5999.b: "เราต้องทำอะไรสักอย่าง!"
 epidemic_events.5999.b.tt: "ปิดอาคาร! ปิดประตู! ปลูกแปลงกุหลาบ!"
 epidemic_events.5999.c.christian: "#EMP "ข้าพเจ้ามองดู และดูเถิด ม้าสีเขียว..."#!"
 epidemic_events.5999.c.notchristian: "ลางร้ายแห่งกาลเวลาที่จะมาถึง..."

 epidemic_events.0110.t: "จากธุลีดิน"
 epidemic_events.0110.desc: "ในที่สุด โรคระบาดก็ได้จากอาณาจักรไปแล้ว และเราต้องถือโอกาสนี้ฟื้นตัวจากความโกลาหลที่มันทิ้งไว้เบื้องหลัง\n\nบัดนี้เราโผล่ออกมาจากซากปรักหักพังของโลกเก่า และถึงเวลาพิจารณาโลกใหม่แล้ว"
 epidemic_events.0110.desc.new_capital: "\n\nผู้รอดชีวิตจำนวนมากได้เริ่มย้ายไปยัง [new_preferred_capital.GetName] เป็นที่หลบภัยแห่งใหม่แล้ว และนี่อาจเป็นโอกาสที่น่าตื่นเต้นสำหรับเมืองหลวงแห่งใหม่"
 epidemic_events.0110.a: "[new_preferred_capital.GetNameNoTierNoTooltip|U] จะเป็นเมืองหลวงแห่งใหม่ที่ดีเยี่ยม"
 epidemic_events.0110.b: "เราต้องไม่เสียดายค่าใช้จ่ายในการสร้างใหม่"
 epidemic_events.0110.c: "ไม่มีอะไรที่ข้าสามารถทำได้"
 every_county_infected_10_years: "ทุก [county|E] ที่ติดเชื้อในช่วง 10 ปีที่ผ่านมา"

