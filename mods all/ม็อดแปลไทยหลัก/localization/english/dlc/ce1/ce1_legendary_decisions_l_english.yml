 CE1_ADVENTURER_WAR: "[ConcatIfNeitherEmpty('$ORDER|q$', ' ')][ATTACKER.GetPrimaryTitle.GetAdjective] การผจญภัยในตำนานเพื่อ [TITLE.GetBaseName]"
