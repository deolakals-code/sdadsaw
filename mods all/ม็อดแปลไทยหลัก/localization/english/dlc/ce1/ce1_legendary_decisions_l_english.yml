 legendary_adventure.troops_raised.tt: "เหล่านักผจญภัยมาถึงแล้ว"
 legendary_adventure_cb_tt: "ปลดล็อกผ่านการตัดสินใจ"
 launch_a_legendary_adventure_tt: "ได้รับสิทธิ์เข้าถึง[casus_belli|E]การผจญภัยในตำนานเพียงครั้งเดียว ทำให้ท่านสามารถละทิ้งอาณาจักรปัจจุบันและแสวงหาโชคลาภใน[kingdom|E]ต่างแดนได้"
 bonus_holy_war_tt: "ได้รับสิทธิ์เข้าถึง[casus_belli|E]สงครามศักดิ์สิทธิ์ระดับ[kingdom|E]เพิ่มเติมหนึ่งครั้ง"
 any_drifting_empire_tt: "อย่างใดอย่างหนึ่ง:\n$BULLET_WITH_TAB$ต้องมี [empire|E] ที่มีความคืบหน้าของ [de_jure_drift|E] เข้าสู่ [primary_title|E] ของท่าน\n$BULLET_WITH_TAB$ท่านถือครอง [title|E] [empire|E] เพิ่มเติม"
 any_drifting_kingdom_tt: "อย่างใดอย่างหนึ่ง:\n$BULLET_WITH_TAB$ต้องมี[kingdom|E]ที่มีความคืบหน้า[de_jure_drift|E]ไปยัง[primary_title|E]ของท่าน\n$BULLET_WITH_TAB$ท่านถือครอง[title|E]ระดับ[kingdom|E]เพิ่มเติม"
 any_drifting_duchy_tt: "อย่างใดอย่างหนึ่ง:\n$BULLET_WITH_TAB$ต้องมี [duchy|E] ที่มีความคืบหน้าของ [de_jure_drift|E] เข้าสู่ [primary_title|E] ของท่าน\n$BULLET_WITH_TAB$ท่านถือครอง [title|E] [duchy|E] เพิ่มเติม"
 not_already_de_jure_your_title_tt: "ตำแหน่งนี้ยังไม่ได้เป็นส่วนหนึ่งของ[primary_title|E]ของท่านโดย[de_jure|E]"
 legendary_conversion_tt: "เปลี่ยนพื้นที่ส่วนใหญ่ใน[realm|E]ของท่านเป็น[faith|E]ของท่านในทันที"
 leg_demand_fealty_v_attacker: "[defender.GetName] กลายเป็น[vassal|E]ของท่าน"
 leg_demand_fealty_v_neutral: "[defender.GetName] กลายเป็น[vassal|E]ของ [attacker.GetNamePossessive]"
 legend_demand_fealty: "เรียกร้องการยอมจำนนในท้องถิ่น"
 legend_demand_fealty_desc: "เรื่องราววีรกรรมในตำนานรายล้อมข้า บัดนี้ข้าเป็นมากกว่ามนุษย์ปุถุชน ข้าคือตำนานที่มีชีวิต และทุกคนต้องก้มหัวให้ข้า"
 legend_demand_fealty_tooltip: "$fifteen_year_vassalization_tt$"
 legend_demand_fealty_confirm: "ทุกคนจะต้องก้มหัวให้ข้า"
 launch_a_legendary_adventure: "เริ่มการผจญภัยในตำนาน"
 launch_a_legendary_adventure_desc: "ดูเหมือนว่าตำนานของข้าในแถบนี้จะสิ้นสุดลงแล้ว แต่ข้ายังคงโหยหาการสร้างวีรกรรมอันยิ่งใหญ่ต่อไปก่อนที่จะจากโลกนี้ไป มันต้องมีอะไรมากกว่านี้รออยู่ และข้าตั้งใจจะนำตำนานของข้าไปยังดินแดนอันห่างไกลและลี้ลับ!"
 launch_a_legendary_adventure_tooltip: "$launch_a_legendary_adventure_tt$"
 launch_a_legendary_adventure_confirm: "ตำนานไม่มีวันสิ้นสุด!"
 legendary_integration_e: "เชิดชูอาณาจักร"
 legendary_integration_e_desc: "ตำนานถูกเล่าขานไปทั่วแผ่นดินเพื่อตอกย้ำอำนาจการปกครองของข้า วาจาของข้าคือสิทธิ์ขาด และหากข้าประกาศว่าสองจักรวรรดิรวมเป็นหนึ่ง ก็ย่อมเป็น เช่นนั้น"
 legendary_integration_e_tooltip: "$select_empire_to_drift_tt$"
 legendary_integration_e_confirm: "ให้เป็นไปตามประสงค์ของข้า"
 control_the_entirety_of_title_empire_tt: "ท่านต้องควบคุม [empire|E] ทั้งหมด"
 legendary_integration_k: "ผนวกรวมอาณาจักร"
 legendary_integration_k_desc: "ตำนานถูกเล่าขานไปทั่วอาณาจักร ซึ่งตอกย้ำอำนาจการปกครองของข้า คำพูดของข้าถือเป็นที่สุด และหากข้าประกาศว่าสองอาณาจักรเป็นหนึ่งเดียวกัน มันก็จะเป็น เช่นนั้น"
 legendary_integration_k_tooltip: "$select_kingdom_to_drift_tt$"
 legendary_integration_k_confirm: "ให้เป็นไปตามประสงค์ของข้า"
 control_the_entirity_of_title_tt: "ท่านต้องควบคุม[kingdom|E]ทั้งหมด"
 legendary_integration_d: "ขยายอาณาจักร"
 legendary_integration_d_desc: "ตำนานถูกเล่าขานไปทั่วอาณาจักร ซึ่งตอกย้ำอำนาจการปกครองของข้า ความชอบธรรมที่เพิ่งค้นพบนี้สามารถใช้ประโยชน์เพื่อขยายสิ่งที่ถือเป็นดินแดนหลักของอาณาจักรข้า และเรียกร้องความสวามิภักดิ์ชั่วนิรันดร์จากดยุคต่างแดนในอดีตได้"
 legendary_integration_d_tooltip: "$select_duchy_to_drift_tt$"
 legendary_integration_d_confirm: "ให้เป็นไปตามประสงค์ของข้า"
 legendary_holy_war: "ยืนยันภารกิจศักดิ์สิทธิ์อีกครั้ง"
 legendary_holy_war_desc: "เรื่องราวในตำนานแห่งความศรัทธาของข้าได้สิ้นสุดลงแล้ว และ แม้ว่าจะได้รับการยกย่องจากผู้ศรัทธาที่แท้จริง แต่ก็แทบไม่ได้โน้มน้าวจิตใจของผู้ที่ไม่เชื่อเลย เราต้องเผยแพร่วิถีอันสันติของเราต่อไปด้วยวิธีเดียวที่เรารู้จัก: ด้วยคมดาบ"
 legendary_holy_war_tooltip: "$bonus_holy_war_tt$"
 legendary_holy_war_confirm: "ธงแห่งความชอบธรรมโบกสะบัด!"
 legendary_pacifism_spread: "เผยแผ่สันติวิธี"
 legendary_pacifism_spread_desc: "เรื่องราวอันเปี่ยมศรัทธาได้แพร่กระจายไปไกลเกินขอบเขตของข้าและกุมหัวใจของผู้ที่ไม่เชื่อ เรื่องราวแห่งสันติภาพและการอยู่ร่วมกันของเราคุกคามที่จะท้าทายขุนศึกที่ทะเลาะวิวาทกันตามชายแดนของเรา และด้วยการผลักดันเพียงเล็กน้อย พวกคนเถื่อนเหล่านี้จะเห็นคุณค่าของชีวิตที่ไม่ใช้ความรุนแรงอย่างแน่นอน"
 legendary_pacifism_spread_tooltip: "$legendary_pacifism_spread_tt$"
 legendary_pacifism_spread_confirm: "สันติภาพจะคงอยู่!"
 legendary_conversion: "เผยแผ่ศาสนาสู่อาณาจักร"
 legendary_conversion_desc: "เรื่องราวในตำนานแห่งความศรัทธาและความทุ่มเทได้กุมหัวใจของทุกคนในอาณาจักร ด้วยการสนับสนุนเพียงเล็กน้อย ผู้ที่ไม่เชื่อในอาณาจักรอาจได้รับการสนับสนุนให้สักการะในแบบที่ข้าทำ"
 legendary_conversion_tooltip: "$legendary_conversion_tt$"
 legendary_conversion_confirm: "ศรัทธาที่แท้จริงจะคงอยู่"
 ce1_decision_events.1020.conversion: "[liege_convert.GetFirstName] เปลี่ยนศาสนา!"
 ce1_decision_events.1000.t: "การผนวกรวมในตำนาน"
 ce1_decision_events.1000.desc: "ในฐานะ [ROOT.Char.GetTitleAsNameNoTooltip|U] ผู้ยิ่งใหญ่และมีชื่อเสียง ข้าถือครองตำแหน่งมากมายในอาณาจักรของข้า แม้ว่าไม่ใช่ทั้งหมดที่จะถือเป็นส่วนหนึ่งของ [ROOT.Char.GetPrimaryTitle.GetName] แต่การดูแลของข้าเหนือดินแดนเหล่านั้นได้ทิ้งร่องรอยไว้อย่างแน่นอน\n\nด้วยสถานะของข้าที่เป็นตำนานในขณะนี้ คำพูดของข้ามีน้ำหนักมาก และข้ารู้สึกว่ามีเพียงไม่กี่คนที่จะกล้าตั้งคำถามกับข้า หากข้าจะบอกว่ากลางวันเป็นกลางคืน มันก็จะถูกเขียนไว้ เช่นนั้น เช่นเดียวกัน หากข้าจะบอกว่า [kingdom_01.GetName] เป็นส่วนที่ชอบธรรมของ [ROOT.Char.GetPrimaryTitle.GetNameNoTooltip] มันก็จะถูกเขียนไว้ เช่นกัน"
 ce1_decision_events.1000.a.empire: "[kingdom_01.GetNameNoTooltip] เป็นของ [ROOT.Char.GetPrimaryTitle.GetAdjectiveNoTooltip] แล้ว!"
 ce1_decision_events.1000.a.kingdom: "[kingdom_01.GetNameNoTooltip] ไม่มีอีกต่อไป"
 ce1_decision_events.1000.b.empire: "[kingdom_02.GetNameNoTooltip] เป็นส่วนเติมเต็มที่ดีแก่จักรวรรดิ"
 ce1_decision_events.1000.b.kingdom: "[kingdom_02.GetNameNoTooltip] ไม่ใช่อาณาจักรที่แท้จริง แต่แรกแล้ว"
 ce1_decision_events.1000.c.empire: "[kingdom_03.GetNameNoTooltip] เป็นตัวเลือกที่ดีกว่า"
 ce1_decision_events.1000.c.kingdom: "[kingdom_03.GetNameNoTooltip] จะเป็น [ROOT.Char.GetPrimaryTitle.GetAdjectiveNoTooltip] ตลอดไป"
 ce1_decision_events.1000.d: "ข้าเลือก [kingdom_04.GetNameNoTooltip]"
 ce1_decision_events.1000.e: "ข้านึกไม่ออกว่าจะมีสิ่งใดเติมเต็มได้ดีกว่า [kingdom_05.GetNameNoTooltip]"
 ce1_decision_events.1000.f: "[kingdom_06.GetNameNoTooltip] ก็แล้วกัน"
 ce1_decision_events.1010.t: "$ce1_decision_events.1000.t$"
 ce1_decision_events.1010.desc: "ในฐานะ [ROOT.Char.GetTitleAsNameNoTooltip|U] ผู้มีชื่อเสียงระดับตำนาน ชื่อของข้าได้รับการเฉลิมฉลองไปทั่วอาณาจักรและไกลออกไป\n\nดินแดนบางแห่ง เช่น [duchy_01.GetName] มีอนาคตที่ไม่แน่นอน ไม่ว่าจะอยู่ภายในหรือภายนอก [ROOT.Char.GetPrimaryTitle.GetName] แต่ด้วยความนิยมของข้าที่จุดสูงสุดและสถานะของตำแหน่งเหล่านี้ที่ผันผวน ข้าสามารถใช้สถานะตำนานของข้าเพื่อตัดสินเรื่องนี้ให้เด็ดขาดได้"
 ce1_decision_events.1010.a: "[duchy_01.GetNameNoTooltip] เป็นของ [ROOT.Char.GetPrimaryTitle.GetAdjectiveNoTooltip] แล้ว!"
 ce1_decision_events.1010.b: "[duchy_02.GetNameNoTooltip] เป็นส่วนเติมเต็มที่ดีแก่อาณาจักรของข้า"
 ce1_decision_events.1010.c: "[duchy_03.GetNameNoTooltip] เป็นตัวเลือกที่ดีกว่า"
 ce1_decision_events.1010.d: "ข้าเลือก [duchy_04.GetNameNoTooltip]"
 ce1_decision_events.1010.e: "ข้านึกไม่ออกว่าจะมีสิ่งใดเติมเต็มได้ดีกว่า [duchy_05.GetNameNoTooltip]"
 ce1_decision_events.1010.f: "[duchy_06.GetNameNoTooltip] ก็แล้วกัน"
 ce1_decision_events.1015.t: "$ce1_decision_events.1000.t$"
 ce1_decision_events.1015.desc: "ในฐานะ [ROOT.Char.GetTitleAsNameNoTooltip|U] ผู้ยิ่งใหญ่และเลื่องชื่อ ข้าถือครองบรรดาศักดิ์มากมายในดินแดนของข้า แม้ว่าไม่ใช่ทั้งหมดจะถือว่าเป็นส่วนหนึ่งของ [ROOT.Char.GetPrimaryTitle.GetName] แต่การดูแลรักษาของข้าย่อมทิ้งร่องรอยไว้อย่างแน่นอน\n\nด้วยสถานะระดับตำนานของข้า วาจาของข้าย่อมมีน้ำหนักและข้ารู้สึกว่ามีเพียงไม่กี่คนที่กล้าตั้งคำถาม หากข้าจะบอกว่ากลางวันคือกลางคืน ก็คงจะถูกจารึกไว้ เช่นนั้น เช่นกัน หากข้าจะกล่าวว่า [empire_01.GetDefinitiveName] เป็นส่วนที่ถูกต้องชอบธรรมของ [ROOT.Char.GetPrimaryTitle.GetDefinitiveNameNoTooltip] มันก็ย่อมเป็น เช่นนั้น"
 ce1_decision_events.1015.a: "[empire_01.GetNameNoTooltip] เป็นของ [ROOT.Char.GetPrimaryTitle.GetAdjectiveNoTooltip] แล้ว!"
 ce1_decision_events.1015.b: "[empire_02.GetNameNoTooltip] เป็นส่วนเติมเต็มที่ดีแก่จักรวรรดิ"
 ce1_decision_events.1015.c: "[empire_03.GetNameNoTooltip] เป็นตัวเลือกที่ดีกว่า"
 ce1_decision_events.1015.d: "ข้าเลือก [empire_04.GetNameNoTooltip]"
 ce1_decision_events.1015.e: "ข้านึกไม่ออกว่าจะมีสิ่งใดเติมเต็มได้ดีกว่า [empire_05.GetNameNoTooltip]"
 ce1_decision_events.1015.f: "[empire_06.GetNameNoTooltip] ก็แล้วกัน"
 ce1_decision_events.1020.t: "สันติภาพในยุคของเรา"
 ce1_decision_events.1020.desc: "เรื่องราวของนักรบผู้แก้ไขความขัดแย้งไม่ใช่ด้วยคมดาบ แต่ด้วยคำพูดและเหตุผลของ[legendary_character.GetHerHis] ได้รับความนิยมอย่างล้นหลามไปทั่วอาณาจักร แม้ว่าข้าจะสวดอ้อนวอนต่อ [ROOT.Char.GetFaith.HighGodName|U] ตามวิถี [ROOT.Char.GetFaith.GetName] แบบดั้งเดิม ข้าก็อดไม่ได้ที่จะรู้สึกประทับใจในเรื่องราว [legendary_character.GetFaith.GetName] นี้\n\nบัดนี้อาณาจักรของข้าเต็มไปด้วยการพูดคุยเกี่ยวกับบุคคลในตำนานผู้นี้และพลังแห่งสันติภาพที่ศรัทธาของ[legendary_character.GetHerHis] ได้มอบให้แก่[legendary_character.GetHerHim] ข้าได้รับการเข้าเฝ้าในราชสำนักโดยนักเทศน์ [legendary_character.GetFaith.GetName] ผู้มาจาก [legendary_character.GetPrimaryTitle.GetName] และนี่อาจเป็นโอกาสของข้าที่จะเปลี่ยนไปสู่วิถีชีวิตที่สงบสุขยิ่งขึ้น"
 ce1_decision_events.1020.a: "ข้าทิ้งดาบของข้า"
 ce1_decision_events.1020.b: "นำพวกนอกรีตนี้ออกจากราชสำนักของข้า"
 ce1_decision_events.1021.t: "การเปลี่ยนศาสนาในตำนาน"
 ce1_decision_events.1021.desc: "เรื่องราวของนักรบผู้แก้ไขความขัดแย้งไม่ใช่ด้วยคมดาบ แต่ด้วยคำพูดและเหตุผลของ[legendary_character.GetHerHis] ได้รับความนิยมอย่างล้นหลามไปทั่วอาณาจักร [legendary_character.GetName|U] ได้สัมผัสหัวใจของผู้คนมากมาย รวมถึง [liege_convert.Custom2('MyCharacterIntroduction', ROOT.Char)] [liege_convert.GetSheHe|U] ได้ยอมรับศรัทธา [legendary_character.GetFaith.GetName] และละทิ้งความคิดเรื่องความรุนแรงทั้งหมด และกำลังเรียกร้องให้ราษฎรทั้งหมดของ[legendary_character.GetHerHis] ทำ เช่นเดียวกัน"
