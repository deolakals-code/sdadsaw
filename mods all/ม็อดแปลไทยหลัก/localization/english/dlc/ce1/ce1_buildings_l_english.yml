 building_legendary_shrine_desc: "ศาสนสถานแห่งนี้ไม่เพียง แต่เป็นความสำเร็จทางวิศวกรรมอันยิ่งใหญ่ในตัวเองเท่านั้น แต่ยังเป็นที่พำนักอันปลอดภัยสำหรับผู้แสวงบุญและผู้ศรัทธา และเป็นเครื่องพิสูจน์ถึงความศรัทธาของผู้สร้าง แม้จะไม่ถือว่าเป็นสถานที่ศักดิ์สิทธิ์ แต่ความงดงามของอาคารได้ ทำให้เคาน์ตีกลายเป็นศูนย์กลางทางศาสนาที่สำคัญในภูมิภาค"
 building_legendary_palace_desc: "พระราชวังอันยิ่งใหญ่และกว้างขวางพร้อมสวนและพื้นที่ล่าสัตว์โดยรอบ ที่พำนักอันหรูหรานี้ไม่เพียง แต่ให้ความสะดวกสบายและความบันเทิงแก่ผู้ปกครองที่พำนักอยู่เท่านั้น แต่ยังทำหน้าที่เป็นสัญลักษณ์แสดงสถานะของความมั่งคั่งและอำนาจอีกด้วย"
 building_legendary_statue_desc: "รูปปั้นของผู้ปกครองในตำนาน บัดนี้ถูก ทำให้เป็นอมตะในหิน อนุสาวรีย์นี้ไม่เพียง แต่เฉลิมฉลองการกระทำอันยิ่งใหญ่ของผู้สร้างเท่านั้น แต่ผู้ใดก็ตามที่ครอบครองมันในอาณาเขตของตนก็อ้างสิทธิ์ในการเป็นผู้ดูแลตำนานนั้นด้วย"
 building_legendary_watchtower_desc: "อนุสาวรีย์สูงตระหง่านขนาดมหึมานี้ไม่เพียง แต่ดูน่าเกรงขามเท่านั้น แต่ยังเป็นป้อมปราการที่ป้องกันได้อย่างดีเยี่ยมในตัวเอง และใช้เพื่อปกป้องอาณาจักรจากผู้รุกรานที่อาจเกิดขึ้น"
 building_legendary_hunting_lodge_desc: "สถานที่แห่งนี้มีชื่อเสียงในด้านสัตว์ป่าที่แปลกประหลาดและเป็นตำนาน ดังนั้นจึงมีการสร้างกระท่อมล่าสัตว์ขนาดใหญ่ขึ้นที่นี่เพื่อมอบความสะดวกสบายแก่นักล่าที่ต้องการสร้างชื่อเสียงให้เป็นอมตะ"
