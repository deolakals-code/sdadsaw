l_english: 
 ce1_lasting_line: "สายเลือดอันยั่งยืน"
 plague_cult_persecuted: "การกดขี่ลัทธิโรคระบาด"
 plague_cult_persecuted_desc: "นักบวชผู้เป็นที่นิยมและมีบารมีเพิ่งถูกประหารชีวิต เนื่องจากเผยแพร่ความเชื่อนอกรีต"
 plague_cult_embraced: "การยอมรับลัทธิโรคระบาด"
 plague_cult_embraced_desc: "นักบวชผู้เป็นที่นิยมและมีบารมีได้เทศนาความเชื่อนอกรีตในจังหวัดนี้ โดยอ้างว่าจะช่วยบรรเทาโรคระบาดได้"
 beset_by_revenants: "ถูกรังควานโดยผีดิบคืนชีพ"
 beset_by_revenants_desc: "ผู้คนในจังหวัดนี้เชื่อว่าผีดิบคืนชีพกำลังฟื้นจากหลุมศพและนำพาโรคระบาดและความเจ็บป่วยมาด้วย"
 revenant_expelled: "ขับไล่ผีดิบคืนชีพ"
 revenant_expelled_desc: "โลงศพของขุนนางผู้หนึ่งเพิ่งถูกตอกตะปูปิดตาย ทำให้ความกังวลของชาวบ้านเกี่ยวกับความเป็นไปได้ที่ผีดิบคืนชีพจะฟื้นจากหลุมศพสงบลง"
 revenants_expelled: "ขับไล่เหล่าผีดิบคืนชีพ"
 revenants_expelled_desc: "โลงศพทุกใบในเคาน์ตีนี้ถูกตอกตะปูปิดตายก่อนนำลงดิน ทำให้ความกังวลของชาวบ้านเกี่ยวกับความเป็นไปได้ที่ผีดิบคืนชีพจะฟื้นจากหลุมศพสงบลง"
 flowers_planted: "พฤกษาอุดมสมบูรณ์"
 flowers_planted_desc: "ทุ่งดอกไม้อันกว้างใหญ่ถูกเพาะปลูกขึ้นที่นี่เพื่อต่อสู้กับอากาศเสียจากโรคระบาด"
 miasma_ignored: "ไอพิษระบาด"
 miasma_ignored_desc: "อากาศเสียเต็มจังหวัดนี้ และชนชั้นปกครองปฏิเสธที่จะปลูกพืชหอมเพื่อแก้ปัญหานี้"
 medicating_with_leeches_good: "การรักษาด้วยปลิงสำเร็จผล"
 medicating_with_leeches_good_desc: "ตัวละครนี้ได้รักษาตนเองด้วยปลิง ทำให้ความต้านทานโรคโดยรวมดีขึ้น"
 medicating_with_leeches_bad: "การรักษาด้วยปลิงล้มเหลว"
 medicating_with_leeches_bad_desc: "ตัวละครนี้ได้รักษาตนเองด้วยปลิง ทำให้ง่วงซึมและเซื่องซึมโดยไม่มีสัญญาณการดีขึ้นที่แท้จริง"
 persecuted_flagellants: "การกดขี่นักพรตแส้"
 persecuted_flagellants_desc: "การโบยตีตนเองกลายเป็นเรื่องปกติอย่างยิ่งในเคาน์ตีนี้ และขุนนางท้องถิ่นได้ดำเนินคดีกับการปฏิบัตินี้อย่างโหดเหี้ยม แต่ก็ไร้ผล"
 rampant_flagellants: "การโบยตีตนเองระบาด"
 rampant_flagellants_desc: "ลัทธิสุดโต่งทางศาสนาได้ปฏิบัติการโบยตีตนเองในเคาน์ตีนี้ แม้ว่าผู้มีอำนาจทางศาสนาจะประณามการปฏิบัตินี้ก็ตาม"
 apocalyptic_inquisition: "การไต่สวนศรัทธาวันสิ้นโลก"
 apocalyptic_inquisition_desc: "ประชากรบางส่วนของเคาน์ตีนี้เชื่อมั่นว่าโรคระบาดครั้งล่าสุดเป็นสัญญาณของวันสิ้นโลก บัดนี้ประชากรทั้งหมดต้องถูกไต่สวนศรัทธา ไม่ว่าพวกเขาจะเชื่อในลัทธินี้หรือไม่ก็ตาม"
 plague_cult: "ลัทธิวันสิ้นโลก"
 plague_cult_desc: "ชายหญิงนับไม่ถ้วนทั่วเคาน์ตีนี้เชื่อว่าโรคระบาดครั้งล่าสุดเป็นสัญญาณของวันสิ้นโลก ทำให้เกิดความกลัวและความตื่นตระหนกไปทั่วเคาน์ตี"
 rampant_witch_trials: "การพิจารณาคดีโรคระบาด"
 rampant_witch_trials_desc: "ชาวบ้านในเคาน์ตีนี้ได้จัดการพิจารณาคดีกลุ่มคนที่พวกเขาโทษว่าเป็นต้นเหตุของโรคระบาดครั้งล่าสุด"
 witch_trials_slowed: "การพิจารณาคดีโรคระบาดถูกลงโทษ"
 witch_trials_slowed_desc: "$rampant_witch_trials_desc$ การปฏิบัตินี้ถูกประณามอย่างกว้างขวางโดยชนชั้นขุนนาง"
 protected_jews: "ผู้พิทักษ์ชาวยิว"
 protected_jews_desc: "ตัวละครนี้เป็นผู้สนับสนุนความปลอดภัยและการคุ้มครองนักเดินทางชาวยิวภายในอาณาจักรของตน ทำให้มีชื่อเสียงอย่างกว้างขวางในชุมชนชาวยิว"
 divine_guidance: "การชี้นำจากสวรรค์"
 divine_guidance_desc: "ประชากรท้องถิ่นของเคาน์ตีนี้เพิ่งได้รับการโน้มน้าวทางเทววิทยาให้ลดการกดขี่ชนกลุ่มน้อยลงอย่างมาก"
 plague_animals_loose: "สัตว์นำโรคระบาด"
 plague_animals_loose_desc: "เคาน์ตีนี้เต็มไปด้วยสัตว์ที่ชาวบ้านเชื่อว่าเป็นพาหะนำโรคระบาดและความเจ็บป่วย"
 royal_cats: "สัตว์หลวง: แมว"
 royal_cats_desc: "ตัวละครนี้ได้ประกาศให้แมวเป็นสัตว์หลวงของอาณาจักร และการทำร้ายพวกมันถือเป็นอาชญากรรมต่อราชบัลลังก์"
 royal_dogs: "สัตว์หลวง: สุนัข"
 royal_dogs_desc: "ตัวละครนี้ได้ประกาศให้สุนัขเป็นสัตว์หลวงของอาณาจักร และการทำร้ายพวกมันถือเป็นอาชญากรรมต่อราชบัลลังก์"
 lacking_cats_and_dogs_good: "สัตว์นำโรคระบาดลดลง"
 lacking_cats_and_dogs_good_desc: "การกำจัดสัตว์จรจัดครั้งล่าสุด ทำให้ประชากรสัตว์จรจัดในเคาน์ตีนี้ลดลงอย่างมาก ช่วยลดการแพร่กระจายของโรคระบาด"
 lacking_cats_and_dogs: "สัตว์ลดจำนวนลง"
 lacking_cats_and_dogs_desc: "การกำจัดสัตว์จรจัดครั้งล่าสุด ทำให้ประชากรสัตว์จรจัดในเคาน์ตีนี้ลดลงอย่างมาก ซึ่งกลับนำไปสู่การเพิ่มขึ้นของการติดเชื้อโรค"
 full_of_rabid_animals: "เต็มไปด้วยสัตว์บ้า"
 full_of_rabid_animals_desc: "สัตว์จรจัดนับไม่ถ้วนถูกนำเข้ามาในเคาน์ตีนี้และได้แพร่กระจายโรคไปทั่วประชากร"
 refused_to_repent: "ปฏิเสธการสำนึกผิด"
 refused_to_repent_desc: "ชาวบ้านในเคาน์ตีนี้เพิ่งเรียกร้องให้ขุนนางผู้หนึ่งถูกประจานต่อสาธารณะสำหรับบาปของตน และคำเรียกร้องนั้นถูกปฏิเสธ"
 witch_trials_obstructed: "ขัดขวางการพิจารณาคดีแม่มด"
 witch_trials_obstructed_desc: "$witch_trials_slowed_desc$"
 persecuted_minorities_expelled: "ขับไล่ชนกลุ่มน้อย"
 persecuted_minorities_expelled_desc: "ชนกลุ่มน้อยถูกขับไล่ออกจากเคาน์ตีนี้ ทำให้การค้าลดลงอย่างมาก"
 persecuted_minorities_protected: "คุ้มครองชนกลุ่มน้อยที่ถูกกดขี่"
 persecuted_minorities_protected_desc: "ชนกลุ่มน้อยที่อาจถูกกดขี่ในบ้านเกิดของตนได้รับที่ลี้ภัยที่นี่"
 plague_minorities_sanctuary: "ที่ลี้ภัยของชนกลุ่มน้อย"
 plague_minorities_sanctuary_desc: "ชนกลุ่มน้อยที่เพิ่งถูกขับไล่ออกจากบ้านเกิดได้รับที่พักพิงที่นี่ น่าเสียดายที่ชนกลุ่มน้อยเหล่านี้ถูกขับไล่ในช่วงโรคระบาดและพวกเขามักจะนำโรคจากบ้านเกิดติดตัวมาด้วย"
 plague_minorities_sanctuary_boosted: "ที่ลี้ภัยอันยิ่งใหญ่ของชนกลุ่มน้อย"
 plague_minorities_sanctuary_boosted_desc: "$plague_minorities_sanctuary_desc$"
 persecuted_minorities_financial_sanctuary: "ที่ลี้ภัยทางการเงิน"
 persecuted_minorities_financial_sanctuary_desc: "พ่อค้าต่างชาติและชนกลุ่มน้อยได้รับที่ลี้ภัยจากการกดขี่ในเคาน์ตีนี้"
 minority_persecution_forbidden: "ห้ามกดขี่ชนกลุ่มน้อย"
 minority_persecution_forbidden_desc: "ชาวบ้านที่นี่เพิ่งพยายามขับไล่ชนกลุ่มน้อยด้วยกำลัง แต่การปฏิบัตินี้ถูกห้ามโดยขุนนางท้องถิ่น"
 rats_eradicated: "กำจัดหนูสิ้นซาก"
 rats_eradicated_desc: "การกำจัดหนูทุกตัวที่พบเห็นอย่างรอบคอบนำไปสู่จังหวัดที่เจริญรุ่งเรืองมากขึ้น"
 pets_eradicated: "กำจัดสัตว์เลี้ยง"
 pets_eradicated_desc: "การกำจัดสัตว์เลี้ยงในท้องถิ่นอย่างโหดร้าย ทำให้หลายคนที่นี่โกรธแค้น"
 vectors_reduced: "พาหะนำโรคถูกลดจำนวน"
 vectors_reduced_desc: "การกำจัดประชากรแกะในท้องถิ่นส่วนใหญ่ได้ชะลอการแพร่กระจายของโรคระบาด"
 disastrous_cull: "การกำจัดอันหายนะ"
 disastrous_cull_desc: "การกำจัดประชากรแกะในท้องถิ่นส่วนใหญ่ได้สร้างความเสียหายต่อเศรษฐกิจท้องถิ่น"
 pleas_ignored: "คำวิงวอนถูกเพิกเฉย"
 pleas_ignored_desc: "ตัวละครนี้เพิกเฉยต่อคำวิงวอนของนักบวช และกลายเป็นศัตรูกับพวกเขาด้วยเหตุนี้"
 draconian_lockdown: "การปิดเมืองอย่างเข้มงวด"
 draconian_lockdown_desc: "ชุดกฎเกณฑ์ที่ลงโทษอย่างรุนแรงได้นำไปสู่ความเสียหายอย่างกว้างขวางต่อเศรษฐกิจท้องถิ่นที่นี่"
 trusted_ruler: "ผู้ปกครองที่น่าเชื่อถือ"
 trusted_ruler_desc: "ผู้ปกครองท้องถิ่นได้รับความไว้วางใจอย่างเต็มที่จากเจ้าเหนือหัวของพวกเขาที่นี่"
 supplies_sent: "ส่งเสบียง"
 supplies_sent_desc: "เสบียงถูกส่งมาที่นี่เพื่อต่อต้านภัยคุกคามจากโรคระบาดในท้องถิ่น"
 plight_ignored: "ชะตากรรมถูกเพิกเฉย"
 plight_ignored_desc: "โรคระบาดที่เพิ่งเริ่มขึ้นในจังหวัดนี้ถูกเพิกเฉยโดยผู้ปกครองอย่างสิ้นเชิง"
 dead_boats: "เรือมรณะ"
 dead_boats_desc: "เรือที่เต็มไปด้วยคนตายได้ถูกซัดขึ้นฝั่งที่นี่ แพร่กระจายการติดเชื้อและความพินาศ"
 clear_beaches: "ชายหาดสะอาด"
 clear_beaches_desc: "ชายหาดของจังหวัดนี้ปราศจากผู้ป่วยหรือผู้ใกล้ตาย"
 contaminated_beaches: "ชายหาดปนเปื้อน"
 contaminated_beaches_desc: "ชายหาดของจังหวัดนี้เป็นที่พักพิงของเรือที่เต็มไปด้วยคนตายเป็นครั้งคราว"
 pestilent_beaches: "ชายหาดแพร่เชื้อโรค"
 pestilent_beaches_desc: "ชายหาดของจังหวัดนี้เกลื่อนไปด้วยศพผู้ติดเชื้อ เป็นภาพที่น่าสยดสยองอย่างแท้จริง"
 respected_dead: "ให้เกียรติผู้ตาย"
 respected_dead_desc: "จังหวัดนี้ให้เกียรติผู้ตายอย่างเต็มที่ แม้จะอยู่ท่ามกลางโรคระบาด"
 health_first: "สุขภาพต้องมาก่อน"
 health_first_desc: "ตัวละครนี้พยายามให้ความสำคัญกับสุขภาพของตนเองเหนือผู้อื่น"
 dismissed_peasantry: "ให้เกียรติผู้ตาย"
 dismissed_peasantry_desc: "สามัญชนในจังหวัดนี้รู้สึกว่าถูกผู้ปกครองเมินเฉยและกีดกัน"
 miracle_worker: "ผู้สร้างปาฏิหาริย์"
 miracle_worker_desc: "ตัวละครนี้ถูกมองว่าดูเหมือนจะรักษาผู้ป่วยได้ด้วยการสัมผัสเพียงครั้งเดียว!"
 man_of_the_people: "ขุนนางติดดิน"
 man_of_the_people_desc: "ตัวละครนี้แสดงความเห็นอกเห็นใจต่อผู้น้อยกว่า แม้จะอยู่ท่ามกลางโรคระบาด"
 out_of_touch: "ไม่รับรู้ความเป็นจริง"
 out_of_touch_desc: "'สัมผัสแห่งราชันย์' ของตัวละครนี้ไม่ได้รักษาผู้ป่วยมากเท่ากับการส่งพวกเขาไปสู่ความตาย!"
 commoners_welcomed_in: "ต้อนรับสามัญชน"
 commoners_welcomed_in_desc: "สามัญชนในจังหวัดนี้ได้รับการต้อนรับจากเจ้าเหนือหัวของพวกเขา และทุกคนต่างรู้สึกขอบคุณในความมีน้ำใจ"
 commoners_turned_away: "ปฏิเสธสามัญชน"
 commoners_turned_away_desc: "สามัญชนในจังหวัดนี้ถูกเจ้าเหนือหัวปฏิเสธในยามที่ต้องการความช่วยเหลือ และหลายคนไม่พอใจอย่างยิ่ง"
 fears_allayed: "ความกลัวบรรเทาลง"
 fears_allayed_desc: "สามัญชนในจังหวัดนี้รู้สึกว่าความกลัวของพวกเขาบรรเทาลง และปฏิบัติตามคำสั่งอย่างมีความสุข"
 fears_ignored: "ความกลัวถูกเพิกเฉย"
 fears_ignored_desc: "สามัญชนในจังหวัดนี้รู้สึกว่าความกลัวของพวกเขาถูกเมินเฉย และยังคงบ่นพึมพำต่อไป"
 strict_coastal_quarantine: "การกักกันโรคชายฝั่งอย่างเข้มงวด"
 strict_coastal_quarantine_desc: "พ่อค้าที่เข้ามาในจังหวัดนี้ทางทะเลต้องกักตัวเองเป็นเวลาหลายวันก่อนที่จะสามารถขายสินค้าได้"
 coastal_quarantine: "การกักกันโรคชายฝั่ง"
 coastal_quarantine_desc: "พ่อค้าที่เข้ามาในจังหวัดนี้ทางทะเลต้องกักตัวเองเป็นระยะเวลาก่อนที่จะสามารถขายสินค้าได้"
 cackling_loon: "คนบ้าหัวเราะเสียงดัง"
 cackling_loon_desc: "นิสัยชอบหัวเราะกลบเกลื่อนปัญหาของตัวละครนี้ก็มีข้อเสีย #EMP บางอย่าง#!..."
 herbalist_suspicions: "ความสงสัยในหมอสมุนไพร"
 herbalist_suspicions_desc: "ทักษะด้านยาขี้ผึ้งและสมุนไพรของตัวละครนี้ ทำให้ตกเป็นเป้าของความสงสัยในช่วงเวลาโรคระบาด"
 absent_ruler: "ผู้ปกครองที่ไม่ปรากฏตัว"
 absent_ruler_desc: "ตัวละครนี้ตอบสนองต่อภัยคุกคามจากโรคระบาดที่ใกล้เข้ามาด้วยการปฏิเสธที่จะออกจากห้องพักของตนเอง"
 present_ruler: "ผู้ปกครองที่ปรากฏตัว"
 present_ruler_desc: "ตัวละครนี้เป็นผู้ปกครองที่กระตือรือร้นและปรากฏตัวให้เห็น แม้ในช่วงเวลาโรคระบาดและความพินาศ"
 hiding_from_epidemic: "หลบซ่อนจากโรคระบาด"
 hiding_from_epidemic_desc: "ตัวละครนี้ใช้เวลาเก็บตัวหลบภัย ยามเมื่อโรคระบาดโหมกระหน่ำทั่วดินแดนของตน\n\n[infection_chance|E]: #P -75%#!"
 sachet_protection: "ถุงเครื่องหอมป้องกัน"
 sachet_protection_desc: "ถุงเครื่องหอมที่ตัวละครนี้พกติดตัวอาจไม่ได้ป้องกันโรคจริงๆ แต่ก็ ทำให้ตนเองและคนรอบข้าง #EMP รู้สึก#! ปลอดภัยขึ้นอย่างแน่นอน"
 overly_fragrant: "หอมเกินไป"
 overly_fragrant_desc: "การใช้ถุงเครื่องหอมหลายถุงมากเกินไปของตัวละครนี้อาจไม่ได้ป้องกันโรคจริงๆ แต่ก็ ทำให้ #EMP ตนเอง#! รู้สึกดีขึ้นอย่างแน่นอน — แม้จะต้องแลกกับอาการน้ำตาไหลของผู้ที่อยู่ใกล้เคียงก็ตาม"
 ce1_legendary_feaster: "นักกินในตำนาน"
 ce1_legendary_feaster_desc: "ตัวละครนี้ได้เดินทางไปทั่วโลก เผยแพร่ตำนานของตนในงานกิจกรรมและงานเฉลิมฉลองต่างๆ ให้กับทุกคนที่รับฟัง"
 ce1_legendary_performance: "การแสดงในตำนาน"
 ce1_legendary_performance_desc: "ตัวละครนี้เพิ่งจัดการแสดงละครเกี่ยวกับตำนานของตน แม้ว่าจะไม่สามารถเข้าถึงผู้ชมที่ตั้งใจไว้ได้ แต่ดูเหมือนว่าเหล่าไพร่จะประทับใจอย่างมาก"
 ce1_legendary_taverns: "ตำนานท้องถิ่น"
 ce1_legendary_taverns_desc: "ตำนานของตัวละครนี้ได้รับการยอมรับอย่างกระตือรือร้นจากสามัญชนในอาณาจักร ทำให้การแพร่กระจายรวดเร็วขึ้นอย่างมาก ผู้คนเดินทางจากโรงเตี๊ยมหนึ่งไปยังอีกโรงเตี๊ยมหนึ่งเพื่อแบ่งปันตำนาน"
 ce1_legend_mocked: "ตำนานถูกเยาะเย้ย"
 ce1_legend_mocked_desc: "ตำนานของตัวละครนี้เพิ่งถูกเยาะเย้ยในเทศกาลวัฒนธรรม ทำให้ผู้อื่นอับอายเกินกว่าจะเสี่ยงเผยแพร่ต่อไป"
 studying_ancient_cultures: "ศึกษาวัฒนธรรมโบราณ"
 studying_ancient_cultures_desc: "ตัวละครนี้เพิ่งสำรวจซากปรักหักพังโบราณที่เคยเป็นของชนเผ่าโบราณ และได้รับความรู้แจ้งจากสิ่งที่ค้นพบที่นั่น"
 kids_legend_modifier: "ตำนานของเด็ก"
 kids_legend_modifier_desc: "เด็กๆ กำลังแสดงบทบาทตามตำนานของตัวละครนี้ ทำให้ตำนานแพร่กระจายเร็วขึ้น"
 legendary_holy_site: "สถานแสวงบุญในตำนาน"
 legendary_holy_site_desc: "แม้จะไม่มีความสำคัญต่อศรัทธา แต่ผู้แสวงบุญกำลังหลั่งไหลมายังเคาน์ตีนี้ เนื่องจากเรื่องราวในตำนานที่เปรียบเทียบสถานที่นี้กับสถานที่ศักดิ์สิทธิ์"
 legend_county_culture_builders: "วัฒนธรรมเมืองหลวง"
 legend_county_culture_builders_desc: "พลเมืองของสถานที่แห่งนี้ภูมิใจในความจริงที่ว่าบรรพบุรุษของพวกเขาคือผู้สร้างมันขึ้นมา"
 legend_character_culture_builders: "คุณูปการของผู้สร้าง"
 legend_character_culture_builders_desc: "ตัวละครนี้ยินดีที่จะสร้างความมั่นใจให้กับผู้อยู่อาศัยในเมืองหลวงของตนว่าบรรพบุรุษร่วมกันของพวกเขาได้สร้างถิ่นฐานอันยิ่งใหญ่ เช่นนี้ขึ้นมา และไม่มีใครอื่น"
 legend_humble_king: "ผู้ปกครองที่ถ่อมตน"
 legend_humble_king_desc: "การถ่อมตนของตัวละครนี้ในการกระทำอันศักดิ์สิทธิ์ ทำให้ได้รับความนับถือเป็นพิเศษในสายตาของผู้ศรัทธา"
 legend_mothers_boy: "แสดงความเคารพ"
 legend_mothers_boy_desc: "ความเคารพของตัวละครนี้ต่อบิดามารดาเป็นแบบอย่างให้ทุกคนปฏิบัติตาม"
 legend_charitable_donations: "การบริจาคเพื่อการกุศล"
 legend_charitable_donations_desc: "จังหวัดนี้ได้รับประโยชน์จากตัวอย่างการบริจาคเพื่อการกุศลมากมาย"
 legend_sick_hospitals: "โรงทานที่ใช้ประโยชน์อย่างดี"
 legend_sick_hospitals_desc: "พลเมืองของจังหวัดนี้รู้ว่าต้องไปที่โรงทานเป็นอันดับแรกหากล้มป่วย"
 legend_bloodthirsty_warrior: "นักรบกระหายเลือด"
 legend_bloodthirsty_warrior_desc: "ตัวละครนี้ภาคภูมิใจในความสามารถทางการทหารของตน"
 legend_stigmatic: "ผู้มีรอยแผลศักดิ์สิทธิ์"
 legend_stigmatic_desc: "ตัวละครนี้มีบาดแผลเก่าหลายแห่งในตำแหน่งที่เหมือนกับของพระเยซู"
 legend_culturally_sensitive: "ละเอียดอ่อนทางวัฒนธรรม"
 legend_culturally_sensitive_desc: "ตัวละครนี้เข้าใจถึงศักยภาพของความตึงเครียดระหว่างวัฒนธรรมที่แตกต่างกัน และใช้ความระมัดระวัง เพื่อให้แน่ใจว่าความตึงเครียดเหล่านั้นจะไม่ค่อยปะทุขึ้น"
 legend_visions_of_god: "นิมิตแห่งสวรรค์"
 legend_visions_of_god_desc: "ตัวละครนี้อ้างว่าการมองไม่เห็นของตนเกิดจากนิมิตศักดิ์สิทธิ์ที่ ทำให้ตาบอด"
 legend_holy_sacrifice: "การเสียสละอันศักดิ์สิทธิ์"
 legend_holy_sacrifice_desc: "ตัวละครนี้อ้างว่าตนได้สละดวงตาข้างหนึ่งให้กับสวรรค์"
 legend_gods_humble_servant: "ผู้รับใช้ที่ถ่อมตน"
 legend_gods_humble_servant_desc: "ตัวละครนี้อ้างว่าความผิดปกติทางสายตา ทำให้ตนถ่อมตนและเคร่งศาสนามากขึ้น"
 legend_sneaks_food: "แอบกินอาหาร"
 legend_sneaks_food_desc: "ตัวละครนี้กลัวที่จะถูกมองว่าไม่เคร่งศาสนา เพราะความฟุ่มเฟือย แต่ก็อดไม่ได้ที่จะแอบกินขนมขบเคี้ยวบ้างเป็นครั้งคราว"
 legend_fat_and_happy: "อ้วนและมีความสุข"
 legend_fat_and_happy_desc: "ตัวละครนี้ค่อนข้างอ้วนท้วน แต่ก็ยอมรับได้อย่างแน่นอน"
 legend_historical_bedecking: "เครื่อง แต่งกายโบราณ"
 legend_historical_bedecking_desc: "ตัวละครนี้สวมใส่เสื้อผ้าของชนเผ่าตนในอดีต เพื่อจงใจระลึกถึงความทรงจำของพวกเขา"
 legend_modern_ruler: "ผู้ปกครองสมัยใหม่"
 legend_modern_ruler_desc: "ตัวละครนี้ปฏิเสธที่จะยอมจำนนต่อกฎเกณฑ์ในอดีต และสร้างเส้นทางของตนเอง"
 legend_prayer_callus: "รอยด้านจากการสวดมนต์"
 legend_prayer_callus_desc: "ตัวละครนี้มี 'ซาบิบา' หรือ 'รอยด้านจากการสวดมนต์' ซึ่งเป็นรอยบนหน้าผากที่พิสูจน์ถึงความทุ่มเทขณะก้มกราบ"
 legend_bruised_head: "หน้าผากช้ำ"
 legend_bruised_head_desc: "ตัวละครนี้ ทำให้ตนเองบาดเจ็บเล็กน้อย ทำให้ปวดหัวเป็นครั้งคราว"
 legend_claimed_stigmatic: "อ้างว่ามีรอยแผลศักดิ์สิทธิ์"
 legend_claimed_stigmatic_desc: "ตัวละครนี้มีรอยแผลที่อ้างว่าคล้ายกับที่พระเยซูได้รับ สิ่งนี้ได้ก่อให้เกิดความขัดแย้งอย่างกว้างขวาง"
 mysterious_sword_giver_great: "แหล่งน้ำลี้ลับ"
 mysterious_sword_giver_great_desc: "ว่ากันว่ามีบุคคลลึกลับผู้ยิ่งใหญ่อาศัยอยู่ในแหล่งน้ำของเคาน์ตีนี้ มอบโชคชะตาลี้ลับให้กับทุกคนที่พบเจอ"
 mysterious_sword_giver: "แหล่งน้ำเรืองนาม"
 mysterious_sword_giver_desc: "$mysterious_sword_giver_great_desc$"
 ce1_evil_spirit: "วิญญาณชั่วร้าย"
 ce1_evil_spirit_desc: "ตัวละครนี้เชื่อว่าตนถูกวิญญาณชั่วร้ายเข้าสิง และด้วยเหตุนี้จึงหงุดหงิดและเอาแน่เอานอนไม่ได้อย่างมาก"
 angelic_founder: "การก่อตั้งโดยทูตสวรรค์"
 angelic_founder_desc: "สมาชิกของตระกูลนี้เห็นพ้องกันว่าการก่อตั้งของพวกเขาเริ่มต้นขึ้นโดยทูตสวรรค์"
 legendary_item: "ดินแดนต่างถิ่น"
 legendary_item_desc: "ผู้ปกครองท้องถิ่นที่นี่ได้นำดินจากดินแดนลี้ลับอันห่างไกลมา ทำให้หลายคนเชื่อว่าดินนั้นมีคุณสมบัติทางเวทมนตร์"
 legendary_item_personal: "การเดินทางในตำนาน"
 legendary_item_personal_desc: "ตัวละครนี้ได้เดินทางไปยังดินแดนอันห่างไกล เผยแพร่เรื่องราวตำนานของตนไปตลอดทาง"
 ce1_heartthrob: "ขวัญใจ"
 ce1_heartthrob_desc: "ตัวละครนี้กำลังอยู่ในภารกิจโรแมนติกในตำนาน และปฏิเสธที่จะเรียกแม้ แต่คนรักที่ใกล้ชิดที่สุดว่าเป็นรักแท้"
 ce1_legendary_battle: "การรบในตำนาน"
 ce1_legendary_battle_desc: "ตัวละครนี้เพิ่งเข้าร่วมการรบที่อาจเรียกได้ว่าเป็นตำนานในตัวเอง ซึ่งเป็นสัญญาณของวีรกรรมในตำนานที่ยิ่งใหญ่กว่าที่จะตามมา"
 legend_renowned_herbalist: "หมอสมุนไพรชื่อดัง"
 legend_renowned_herbalist_desc: "ตัวละครนี้คาดว่าจะได้พบกับพืชหายากที่ได้เรียนรู้มากมายจากพวกมัน"
 legend_eagle_eyed: "สายตาเหยี่ยว"
 legend_eagle_eyed_desc: "ตามคำบอกเล่า ตัวละครนี้ได้พิสูจน์ทักษะการยิงธนูของตนต่อทุกคนที่จะท้าทาย"
 legend_cannibal_scarred: "ศัตรูของมนุษย์กินคน"
 legend_cannibal_scarred_desc: "มีข่าวลือว่าตัวละครนี้ต่อสู้กับการโจมตีของมนุษย์กินคน ทำให้มีรอยแผลเป็น"
 legend_nick_of_time: "ทันเวลาพอดี"
 legend_nick_of_time_desc: "คาดว่าตัวละครนี้มาถึงทันเวลาพอดีพร้อมกับกำลังเสริมในระหว่างการรบที่สำคัญ"
 legend_well_organised: "มีการจัดการที่ดี"
 legend_well_organised_desc: "การมองการณ์ไกลของตัวละครนี้ในด้านการจัดการทางทหาร ทำให้ไม่ค่อยถูกจับได้เมื่อการรบมาถึง"
 legend_bravely_ran_away: "หนีไปอย่างกล้าหาญ"
 legend_bravely_ran_away_desc: "คาดว่าตัวละครนี้หันหลังหนีเมื่อการรบใกล้เข้ามา การที่มันกลับเป็นผลดีในที่สุดก็ป้องกันไม่ให้ผู้อื่นเยาะเย้ยอย่างเต็มที่ อย่างน้อยก็ เช่นนั้น"
 ce1_immortal: "แสวงหาความเป็นอมตะ"
 ce1_immortal_desc: "ตัวละครนี้กำลังอยู่ในภารกิจเพื่อค้นหาวิธีที่จะเป็นอมตะ"
 ce1_level_headed: "มีเหตุผล"
 ce1_level_headed_desc: "ตัวละครนี้เข้าใจว่าความฝันเป็นเพียงแค่นั้น ไม่มีอะไรมากไปกว่านั้น"
 ce1_accepted_mortality: "สงบใจ"
 ce1_accepted_mortality_desc: "ตัวละครนี้เพิ่งเผชิญหน้ากับความตายของตนเองและรู้สึกสบายใจในธรรมชาติที่ไม่จีรังของชีวิต"
 ce1_will_to_live: "วิกฤตอัตถิภาวนิยม"
 ce1_will_to_live_desc: "ตัวละครนี้หวาดกลัวความตายอย่างยิ่ง"
 ce1_forgiveness: "การให้อภัยจากภายใน"
 ce1_forgiveness_desc: "ตัวละครนี้เพิ่งเลือกที่จะให้อภัยคนที่ทำผิดต่อตนอย่างมาก"
 plague_tales: "เรื่องเล่าโรคระบาด"
 plague_tales_desc: "ความหวาดระแวงของตัวละครนี้เกี่ยวกับโรคระบาดที่อยู่ห่างไกล อย่างน้อยก็ถูกนำไปสู่การทำงานอย่างแข็งขันเพื่อปกป้องอาณาจักรของตนเอง"
 plague_insights_gained: "ได้รับข้อมูลเชิงลึกเกี่ยวกับโรคระบาด"
 plague_insights_gained_desc: "การชำแหละซากศพอย่างทันท่วงที ทำให้ตัวละครนี้ได้รับข้อมูลเชิงลึกอันมีค่าเกี่ยวกับผลกระทบของกาฬโรค"
 brutal_crackdown: "การปราบปรามอย่างโหดเหี้ยม"
 brutal_crackdown_desc: "การปราบปรามผู้ลี้ภัยอย่างโหดเหี้ยมที่ชายแดนได้เสริมสร้างอำนาจ แต่ก่อให้เกิดความโกรธแค้นอย่างมากในบารอนีนี้"
 shanty_towns: "ชุมชนแออัด"
 shanty_towns_desc: "การก่อสร้างชุมชนแออัดหลายแห่งที่ชายแดนของบารอนีนี้ ทำให้ผู้ลี้ภัยสามารถพักอาศัยได้อย่างกึ่งถาวร"
 border_defended: "ปกป้องชายแดน"
 border_defended_desc: "การปฏิเสธผู้ลี้ภัยที่ชายแดนของบารอนีนี้ ทำให้บางคนพอใจ แต่การชะลอตัวของการอพยพก็มีต้นทุนของมันเอง"
 refugees_coddled: "เอาใจผู้ลี้ภัย"
 refugees_coddled_desc: "ผู้ลี้ภัยที่หนีเข้ามาในบารอนีนี้ได้รับอนุญาตให้เข้ามาโดยไม่มีอุปสรรค"
 dangerous_rides: "การขี่ม้าที่อันตราย"
 dangerous_rides_desc: "การขี่ม้าเข้าไปในถิ่นทุรกันดารของตัวละครนี้เป็นอันตรายต่อทั้งตนเองและครอบครัว แต่ก็ช่วยให้อารมณ์ดีขึ้นอย่างน่าอัศจรรย์"
 cautious_rider: "นักขี่ม้าที่ระมัดระวัง"
 cautious_rider_desc: "ตัวละครนี้ปฏิเสธที่จะเป็นอันตรายต่อตนเองด้วยการขี่ม้าเข้าไปในชนบทที่อาจติดเชื้อ"
 overly_protective: "ปกป้องมากเกินไป"
 overly_protective_desc: "ความหวาดระแวงของตัวละครนี้ ทำให้เตรียมพร้อมอย่างละเอียดถี่ถ้วนสำหรับโรคระบาดที่กำลังจะมาถึง"
 mass_panic: "ความตื่นตระหนกครั้งใหญ่"
 mass_panic_desc: "บารอนีนี้ตกอยู่ในความตื่นตระหนกครั้งใหญ่เมื่อทราบข่าวโรคระบาดร้ายแรงกำลังมาถึง"
 allayed_fears: "ความกลัวบรรเทาลง"
 allayed_fears_desc: "ผู้คนในบารอนีนี้ได้รับการปลอบโยนความกลัวเกี่ยวกับโรคระบาดที่กำลังจะมาถึง"
 angry_crowds: "ฝูงชนโกรธแค้น"
 angry_crowds_desc: "ผู้คนในบารอนีนี้หวาดกลัวและโกรธแค้นเกี่ยวกับการจำคุกนักเทศน์วันสิ้นโลกจำนวนมาก"
 rumours_stifled: "ข่าวลือถูกระงับ"
 rumours_stifled_desc: "การทำงานอย่างมั่นใจในการระงับข่าวลือเกี่ยวกับโรคระบาดที่อยู่ห่างไกล ทำให้บารอนีนี้สงบลง"
 rumours_proliferated: "ข่าวลือแพร่กระจาย"
 rumours_proliferated_desc: "ความพยายามที่จะระงับข่าวลือในจังหวัดนี้ล้มเหลว และตอนนี้หลายคนตื่นตระหนกกับความคิดที่ว่าโรคระบาดจะมาถึงดินแดนของตน"
 uncaring_ruler: "ผู้ปกครองที่ไม่ใส่ใจ"
 uncaring_ruler_desc: "ผู้อยู่อาศัยในบารอนีนี้รู้สึกว่าถูกผู้ปกครองทอดทิ้ง"
 flagellants_acquiesce: "เอาใจนักพรตแส้"
 flagellants_acquiesce_desc: "ตัวละครนี้ได้เอาใจนักพรตแส้ที่ท่องไปตามเมืองและหมู่บ้านต่างๆ"
 pacified_flagellants: "นักพรตแส้สงบลง"
 pacified_flagellants_desc: "ผู้คนในบารอนีนี้ไม่ถูกรังควานโดยผู้พยากรณ์หายนะอีกต่อไป เนื่องจากนักพรตแส้ที่เร่ร่อนได้สงบลงแล้ว"
 eager_populace: "ประชากรกระตือรือร้น"
 eager_populace_desc: "ผู้คนในบารอนีนี้ได้รับฟังคำพูดของผู้พยากรณ์หายนะในท้องถิ่น และเต็มใจที่จะทำทุกอย่างเพื่อเตรียมพร้อม"
 unrestrained_flagellants: "นักพรตแส้ที่ไม่ถูกควบคุม"
 unrestrained_flagellants_desc: "ความพยายามที่ไม่ประสบความสำเร็จในการเอาใจนักพรตแส้ในบารอนีนี้ ทำให้จำนวนของพวกเขาเพิ่มขึ้น"
 regular_checkups: "การตรวจสุขภาพเป็นประจำ"
 regular_checkups_desc: "การให้ยาแพงเป็นประจำโดยแพทย์ของตัวละครนี้ ทำให้พวกเขามีสุขภาพดีที่สุดเท่าที่จะเป็นไปได้"
 under_the_weather: "รู้สึกไม่สบาย"
 under_the_weather_desc: "ตัวละครนี้รู้สึกไม่ค่อยสบายเล็กน้อย"
 gravediggers_threatened: "สัปเหร่อถูกคุกคาม"
 gravediggers_threatened_desc: "สัปเหร่อในบารอนีนี้ถูกคุกคามและขู่กรรโชก ทำให้ยากจนลงและมีแนวโน้มที่จะทำงานน้อยลงมาก"
 gravediggers_compensated: "สัปเหร่อได้รับการชดเชย"
 gravediggers_compensated_desc: "สัปเหร่อในบารอนีนี้ได้รับอนุญาตให้รับค่าจ้างพิเศษ ทำให้ขวัญกำลังใจดีขึ้น"
 gravediggers_replaced: "เปลี่ยนสัปเหร่อ"
 ce1_commoners_in_graves: "สุสานสามัญชน"
 ce1_commoners_in_graves_desc: "ตัวละครนี้เพิ่งเปิดส่วนสำหรับสามัญชนในสุสานหลวงของตน ทำให้ชาวบ้านพอใจ แต่ ทำให้ชื่อเสียงของตนมัวหมองในสายตาของขุนนางบางคน"
 ce1_common_graves: "หลุมศพสามัญ"
 ce1_common_graves_desc: "สามัญชนกำลังถูกนำไปฝังในสุสานในเคาน์ตีนี้ โดยมีค่าใช้จ่ายบางส่วน"
 ce1_bodies_in_the_street: "ศพเกลื่อนถนน"
 ce1_bodies_in_the_street_desc: "เมื่อสุสานเต็มและผู้ตายเพิ่มขึ้น ศพก็ถูกทิ้งให้เน่าเปื่อยอยู่ตามถนน"
 ce1_siege_corpse: "ซากศพติดโรค"
 ce1_siege_corpse_desc: "กองทัพศัตรูเพิ่งขว้างซากศพติดโรคเข้ามาในที่มั่นในเคาน์ตีนี้"
 ce1_quarantined_corpse: "ซากศพถูกกักกัน"
 ce1_quarantined_corpse_desc: "กองทัพศัตรูเพิ่งขว้างซากศพติดโรคเข้ามาในที่มั่นในเคาน์ตีนี้ แต่ซากศพถูกแยกออกจากประชากรส่วนใหญ่ได้สำเร็จ"
 ce1_heavily_ill: "ป่วยหนัก"
 ce1_heavily_ill_desc: "การสัมผัสใกล้ชิดกับซากศพติดโรคส่งผลเสียต่อสุขภาพของตัวละครนี้อย่างมาก"
 ce1_non_heretical_solution: "แยกศพ"
 ce1_non_heretical_solution_desc: "ศพที่ติดโรคระบาดกำลังถูกแยกออกจากผู้ที่มีสุขภาพดีในอาณาจักรของตัวละครนี้"
 ce1_unorthodox_epidemic_treatment: "การรักษานอกรีต"
 ce1_unorthodox_epidemic_treatment_desc: "ด้วยการปฏิบัติที่ลึกลับและนอกรีตอย่างสูง ตัวละครนี้ประสบความสำเร็จในการลดอัตราการแพร่กระจายของโรคระบาด"
 ce1_unorthodox_epidemic_treatment_bad: "การรักษานอกรีตที่ไม่สำเร็จ"
 ce1_unorthodox_epidemic_treatment_bad_desc: "ด้วยการปฏิบัติที่ลึกลับและนอกรีตอย่างสูง ตัวละครนี้ไม่ประสบความสำเร็จในการลดอัตราการแพร่กระจายของโรคระบาด"
 ce1_major_quarantine: "การกักกันโรคทั่วอาณาจักร"
 ce1_major_quarantine_desc: "ตัวละครนี้ได้ขังชาวบ้านไว้ในบ้านของพวกเขาในความพยายามที่จะป้องกันการแพร่กระจายของโรคระบาด"
 ce1_major_quarantine_county: "การกักกันโรค"
 ce1_major_quarantine_county_desc: "ไม่มีใครได้รับอนุญาตให้เข้าหรือออกจากเคาน์ตีนี้ เพื่อลดการแพร่กระจายของโรคระบาด"
 war_doctor: "แพทย์สนามรบ"
 war_doctor_desc: "แพทย์ชื่อดังและผู้ติดตามของเขาได้เดินทางไปตามสนามรบ ให้การดูแลที่มีคุณภาพสูงแก่ทหารที่ป่วยและเจ็บไข้"
 ce1_banishment_resistance: "ปลอดโรค"
 ce1_banishment_resistance_desc: "ข้าราชบริพารที่ป่วยหนักมากถูกเนรเทศออกจากราชสำนักของตัวละครนี้ ส่งผลให้การสัมผัสโรคลดลงอย่างมาก"
 minor_epidemic_treatment: "การป้องกันโรคระบาดเล็กน้อย"
 minor_epidemic_treatment_desc: "แพทย์ของตัวละครนี้เพิ่งสั่งมาตรการปานกลางเพื่อป้องกันการแพร่กระจายของโรคระบาดที่กำลังคืบคลานเข้ามา"
 major_epidemic_treatment: "การป้องกันโรคระบาดครั้งใหญ่"
 major_epidemic_treatment_desc: "แพทย์ของตัวละครนี้เพิ่งใช้มาตรการสุดขั้วเพื่อป้องกันการแพร่กระจายของโรคระบาดที่กำลังคืบคลานเข้ามา"
 critical_epidemic_treatment: "การป้องกันโรคระบาดลี้ลับ"
 critical_epidemic_treatment_desc: "แพทย์ลี้ลับได้แนะนำการรักษาที่รุนแรงและแปลกประหลาดสำหรับโรคระบาดที่กำลังคืบคลานเข้ามา และ แม้ว่าจะ ทำให้ผู้มีอำนาจทางศาสนาไม่พอใจ แต่ดูเหมือนว่าจะมีประสิทธิภาพสูง"
 minor_epidemic_treatment_failed: "การป้องกันโรคระบาดเล็กน้อยล้มเหลว"
 minor_epidemic_treatment_failed_desc: "แม้จะมีลักษณะปานกลาง แต่ความพยายามของตัวละครนี้ในการชะลอโรคระบาดที่กำลังคืบคลานเข้ามากลับส่งผลเสีย"
 major_epidemic_treatment_failed: "การป้องกันโรคระบาดครั้งใหญ่ล้มเหลว"
 major_epidemic_treatment_failed_desc: "ตัวละครนี้ใช้มาตรการรุนแรงเพื่อป้องกันการแพร่กระจายของโรคระบาดที่กำลังคืบคลานเข้ามา ซึ่งไม่เพียง แต่นำไปสู่ความซบเซาทางเศรษฐกิจ แต่ยังไม่มีประสิทธิภาพในการป้องกันการแพร่กระจายของโรคเลย"
 critical_epidemic_treatment_failed: "การป้องกันโรคระบาดลี้ลับล้มเหลว"
 critical_epidemic_treatment_failed_desc: "มาตรการที่ตัวละครนี้ใช้ในการรักษาผู้ที่ติดโรคระบาดไม่เพียง แต่ไม่มีประสิทธิภาพ แต่ลักษณะที่นอกรีตของพวกเขายัง ทำให้ผู้มีอำนาจทางศาสนาไม่พอใจอย่างมาก"
 ce1_royal_touch: "สัมผัสแห่งราชันย์"
 ce1_royal_touch_desc: "ผู้ป่วยและผู้ใกล้ตายในเคาน์ตีนี้เพิ่งได้รับการเยี่ยมเยียนจากเจ้าเหนือหัวของพวกเขา โดยมอบสัมผัสแห่งราชันย์ในรูปแบบของเหรียญที่ได้รับพร"
 funeral_unrelenting_devotion: "ความทุ่มเทที่ไม่ย่อท้อ"
 funeral_unrelenting_devotion_desc: "ตัวละครนี้ได้สาบานบนหลุมศพของบุคคลอันเป็นที่รักว่าจะกลายเป็นผู้ปกครองที่ดีขึ้น"
 funeral_comfort: "ได้รับการปลอบโยน"
 funeral_comfort_desc: "ตัวละครนี้เพิ่งเผชิญหน้ากับความตายของตนเอง และรู้สึกสบายใจในความหมายที่พบในชีวิตที่ไม่จีรัง เช่นนี้"
 funeral_existential_dread: "ความหวาดกลัวต่อการดำรงอยู่"
 funeral_existential_dread_desc: "ตัวละครนี้เพิ่งตระหนักว่าตนเองจะต้องตายในวันหนึ่ง พวกเขาไม่ชอบมันเลย"
 ce1_modest_leader: "ผู้นำที่ถ่อมตน"
 ce1_modest_leader_desc: "ตำนานในสนามรบของตัวละครนี้เติบโตควบคู่ไปกับท่าทีที่เงียบขรึมของตนเอง"
 ce1_black_thumb: "มือร้อนปลูกอะไรก็ตาย"
 ce1_black_thumb_desc: "ตัวละครนี้ไม่สนใจธรรมชาติเลยแม้ แต่น้อย"
 legend_chaste_faithful: "บริสุทธิ์, ซื่อสัตย์"
 legend_chaste_faithful_desc: "ผู้ที่ปฏิบัติตามตำนานนี้เป็นที่รู้จักในเรื่องความซื่อสัตย์"
 legend_lecherous_lewd: "มักมากในกาม, ลามก"
 legend_lecherous_lewd_desc: "ผู้ที่ปฏิบัติตามตำนานนี้มีชื่อเสียงในด้านวิถีทางที่ยั่วยวน"
 ce1_forward_thinking: "คิดไปข้างหน้า"
 ce1_forward_thinking_desc: "ตัวละครนี้ไม่สนใจวัฒนธรรมในอดีตอันไกลโพ้น ชอบที่จะใช้ชีวิตอยู่ในปัจจุบันอย่างมั่นคง"
 ce1_avenging_child: "เด็กผู้ล้างแค้น"
 ce1_avenging_child_desc: "ตัวละครนี้มุ่งมั่นที่จะล้างแค้นให้กับการตายของบิดามารดาด้วยน้ำมือของสัตว์ป่า"
 legend_palatial_palatable: "โอ่อ่า, น่ารับประทาน"
 legend_palatial_palatable_desc: "แท้จริงแล้ว ไม่มีอะไรยิ่งใหญ่ไปกว่าโต๊ะที่เต็มไปด้วยเนื้อสัตว์ที่แปลกใหม่ที่สุด!"
 ce1_consequentialist: "นักผลลัพธ์นิยม"
 ce1_consequentialist_desc: "ตัวละครนี้ชอบเตือนผู้คนว่าจุดหมายปลายทางคือส่วนสำคัญ ไม่ใช่การเดินทาง"
 legend_edifices_enduring: "สิ่งก่อสร้าง, ยั่งยืน"
 legend_edifices_enduring_desc: "การเรียนรู้จากช่างก่อสร้างในอดีตไม่ใช่เรื่องเลวร้าย: อันที่จริง การที่ผลงานของพวกเขายังคงยืนหยัดอย่างภาคภูมิในวันนี้เป็นเครื่องพิสูจน์ถึงทักษะของพวกเขา"
 legend_monophthalmic_mythical: "ตาเดียว, ในตำนาน"
 legend_monophthalmic_mythical_desc: "ไซคลอปส์เดินอยู่ท่ามกลางพวกเรา! หากท่านจับตาดูอย่างใกล้ชิด บางทีท่านอาจจะได้เห็นแวบหนึ่ง..."
 legendary_adventurer: "จิตวิญญาณนักผจญภัย"
 legendary_adventurer_desc: "ตัวละครนี้พร้อมที่จะละทิ้งอาณาจักรและเผยแพร่ตำนานของตนไปต่างแดน"
 epidemic_increased_maintance: "ค่าบำรุงรักษาเพิ่มขึ้น"
 epidemic_increased_maintance_desc: "ตัวละครนี้กำลังจ่ายค่าจ้างที่สูงขึ้นเพื่อทดแทนทหารที่เสียชีวิตจากโรคระบาด"
 epidemic_pressed_levies: "เกณฑ์ไพร่พล"
 epidemic_pressed_levies_desc: "ตัวละครนี้กำลังเกณฑ์ชาวนาเข้าสู่กองทหารประจำการของตน"
 epidemic_closed_barracks: "ปิดโรงทหาร"
 epidemic_closed_barracks_desc: "เพื่อหลีกเลี่ยงความสูญเสียที่ไม่จำเป็น ทหารจะถูกแยกตัว และไม่อนุญาตให้มีการฝึกใดๆ"
 ce1_gone_dancing: "เข้าร่วมการเต้นรำที่ไม่สิ้นสุด"
 ce1_gone_dancing_desc: "ตัวละครนี้ได้เข้าร่วมกับชาวนาในการเต้นรำที่ไม่สิ้นสุดของพวกเขา"
 fealty_demanded: "เรียกร้องความสวามิภักดิ์"
 fealty_demanded_desc: "ตัวละครนี้เรียกร้องความสวามิภักดิ์จากผู้ใต้บังคับบัญชา"
 legend_investments: "การลงทุนทางการเงิน"
 legend_investments_desc: "เคาน์ตีนี้ได้รับการลงทุนจำนวนมากจากการติดต่อของเจ้าเหนือหัว ทำให้เศรษฐกิจดีขึ้น"
 legend_loose_lips: "ปากสว่าง"
 legend_loose_lips_desc: "ตัวละครนี้เต็มใจที่จะให้ความโปรดปรานของตนถูกซื้อได้ ทำให้ผู้อื่นอาจโน้มน้าวตนได้"
 legend_esteemed_expanding: "เป็นที่นับถือ, ขยายตัว"
 legend_esteemed_expanding_desc: "ในบรรดาผู้สนับสนุนตำนานอันเป็นที่นับถือนี้ มีบุคคลสำคัญที่แท้จริงอยู่บ้าง"
 legend_irreverent_immoral: "ไม่เคารพ, ผิดศีลธรรม"
 legend_irreverent_immoral_desc: "การลงโทษตำนานนี้โดยผู้ที่อยู่เหนือการตำหนิได้ ทำให้มันมัวหมองอย่างหนัก"
 legend_wicked_ways: "วิถีทางอันชั่วร้าย"
 legend_wicked_ways_desc: "วิถีทางที่คาดว่าผิดบาปของตัวละครนี้ได้นำไปสู่ความยากลำบากในการเผยแพร่คำพูดเชิงบวกเกี่ยวกับการกระทำของตน"
 legend_errors_exonerated: "พ้นผิด"
 legend_errors_exonerated_desc: "วิถีทางที่ผิดบาปของตัวละครนี้ถูกฝังลึก เนื่องจากการสนับสนุนจากคนรอบข้าง"
 legend_principled_pious: "มีหลักการ, เคร่งศาสนา"
 legend_principled_pious_desc: "ทุกคนที่ส่งเสริมตำนานนี้ได้รับประโยชน์จากความซื่อสัตย์ในสายตาของสามัญชน"
 legend_saintly_sinless: "ดุจนักบุญ, ไร้บาป"
 legend_saintly_sinless_desc: "ผู้เผยแพร่ตำนานนี้ได้รับการยกย่องอย่างสูง จนกระทั่งเสริมสร้างตำนานนั้นเอง"
 healthy_court: "ราชสำนักที่แข็งแรง"
 healthy_court_desc: "การกระทำของตัวละครนี้ได้นำไปสู่ราชสำนักที่แข็งแรงและมีความสุข"
 strange_levity: "ความเบิกบานแปลกประหลาด"
 strange_levity_desc: "ทัศนคติที่เบิกบานต่อโศกนาฏกรรมของตัวละครนี้ไม่ใช่ทัศนคติที่ทุกคนชื่นชอบ"
 free_boats: "เรือฟรี"
 free_boats_desc: "ตัวละครนี้ได้รับประโยชน์จากเรือที่ถูกทิ้งร้างจำนวนหนึ่งที่ถูกซัดขึ้นฝั่ง ทำให้มีทางเลือกที่ดีขึ้นในการเดินทาง"
 corpse_piles: "กองซากศพ"
 corpse_piles_desc: "บารอนีนี้ประสบปัญหากองซากศพที่ติดโรคถูกทิ้งให้เน่าเปื่อยอยู่ตามชายฝั่ง"
 shattered_by_plague: "เสี่ยงต่อโรคระบาด"
 shattered_by_plague_desc: "เคาน์ตีที่มีชีวิตชีวาและหนาแน่นแห่งนี้อยู่ห่างจากการระบาดใหญ่เพียงแค่ไอครั้งเดียว"
 ravaged_by_plague: "อ่อนแอต่อโรคระบาด"
 ravaged_by_plague_desc: "ถนนที่พลุกพล่านของถิ่นฐานในเคาน์ตีนี้ ทำให้เป็นเหยื่อที่สุกงอมสำหรับโรคระบาดที่แพร่กระจาย"
 blighted_by_plague: "เปราะบางต่อโรคระบาด"
 blighted_by_plague_desc: "ความหนาแน่นของประชากรที่สูงกว่าค่าเฉลี่ยในเคาน์ตีนี้ ทำให้เปราะบางต่อการแพร่กระจายของโรคระบาด"
 struck_by_plague: "มีความเสี่ยงต่อโรคระบาด"
 struck_by_plague_desc: "เคาน์ตีนี้มีถิ่นฐานที่มีขนาดใหญ่พอที่จะ ทำให้โรคระบาดแพร่กระจายได้ง่ายขึ้นบ้าง"
 legend_secure_safe: "มั่นคง, ปลอดภัย"
 legend_secure_safe_desc: "ตำนานนี้มีชื่อเสียงในการนำผู้คนมารวมกัน ทำให้ศัตรูกลายเป็นมิตรแม้ในพื้นที่ที่ไม่คุ้นเคย"
 plague_new_capital: "เมืองหลวงใหม่"
 plague_new_capital_desc: "โรคระบาดครั้งล่าสุดได้ทำลายล้างดินแดนและ ทำให้เคาน์ตีนี้เป็นตัวเลือกที่เหมาะสมที่สุดที่จะกลายเป็นเมืองหลวงใหม่ของอาณาจักร"
 plague_alms_donations: "การบริจาคทาน"
 plague_alms_donations_desc: "คนยากจนและขัดสนในบารอนีนี้ได้รับประโยชน์จากการบริจาคทาน ทำให้ขวัญกำลังใจดีขึ้นและมีที่พักพิง"
 plague_determined_recover: "มุ่งมั่นที่จะฟื้นตัว"
 plague_determined_recover_desc: "แม้ว่าเมืองหลวงของตัวละครนี้จะถูกทำลายล้างโดยโรคระบาด แต่พวกเขาก็มุ่งมั่นที่จะฟื้นตัว"
 plague_the_long_road: "หนทางอันยาวไกล"
 plague_the_long_road_desc: "เมืองหลวงของตัวละครนี้ถูกทำลายล้างโดยโรคระบาด และพวกเขามุ่งมั่นที่จะฟื้นฟูแม้จะมีอุปสรรคก็ตาม"
 plague_crippling_sorrow: "ความโศกเศร้าที่บั่นทอน"
 plague_crippling_sorrow_desc: "เมืองหลวงของตัวละครนี้ถูกทำลายล้างโดยโรคระบาด และความตายและการทำลายล้างที่เกิดขึ้นได้ส่งพวกเขาไปสู่ความสิ้นหวังอย่างลึกซึ้ง"
 legend_tolerant_trusting: "ใจกว้าง, ไว้วางใจ"
 legend_tolerant_trusting_desc: "ตำนานนี้ได้รับอนุญาตให้เติบโตอย่างอิสระ เจ้าของสนับสนุนการ แต่งเติมโดยนักกวีพเนจร"
