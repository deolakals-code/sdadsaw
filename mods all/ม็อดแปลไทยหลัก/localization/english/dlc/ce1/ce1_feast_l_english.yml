l_english: 

 feast_type_legendary: "งานเลี้ยงระดับตำนาน"
 feast_type_legendary_desc: "$EFFECT_LIST_BULLET$ การ $feast_phase_toast$ จะเน้นไปที่ [legend|E] ของท่าน\n$EFFECT_LIST_BULLET$ เหตุการณ์ต่างๆ จะนำไปสู่โอกาสในการได้รับ [opinion|E]\n$EFFECT_LIST_BULLET$ ตัวเลือกบางอย่างจะช่วยให้ [stress|E] ลดลง\n\n#weak เรื่องราวที่จะเล่าขานไปชั่วกาลนาน#! "
 legendary_feast_valid_tt: "ท่าน #bold ยังไม่มี#! [promoted_legend|E]"
 feast.7204.t: "เรื่องเล่าขาน"
 feast.7204.desc: "เสียง [ROOT.GetCharacter.Custom('GetMusicalInstrumentPlural')] ดังก้องไปทั่วโถงของ [activity.GetCurrentPhase.GetLocation.GetNameNoTooltip] ขณะที่แขกเหรื่อจิบ [ROOT.Char.Custom('RegionalAlcoholicDrink')] หยดสุดท้าย เหนือพวกเขา เสียงของ [bard.GetTitledFirstName] ดังขึ้นอย่างไพเราะ\n\n"จงฟัง! จงฟัง! เพราะข้าจะเล่าเรื่องราวของ [ROOT.Char.GetPromotedLegend.GetName] ให้พวกท่านฟัง""
 feast.7204.a: "ทุกคนจะต้องพูดถึงเรื่องนี้!"
 feast.7204.b: "ฮ่า! อย่าลืมสิว่ามันคือตำนาน #EMP ของข้า#! น่ะ!"
 feast.7204.c: "แขกของข้าจะไม่มีวันลืมการแสดง เช่นนี้"
 feast.7204.d: "แด่อีกหลายๆ ครั้ง!"
 feast.7205.t: "เรื่องเล่าที่น่าฟัง"
 feast.7205.desc: "$feast.7204.desc$\n\nข้างๆ [bard.GetHerHim] [host.GetTitledFirstName] ยิ้มอย่างภาคภูมิใจ"
 feast.7205.a: "ช่างเป็นบทเพลงที่ยอดเยี่ยม!"
 feast.7205.b: "#EMP โอ้!#! พวกเขามี [host.Custom('GetExpensiveDessert')] ที่นี่ด้วย!"
 legendary_feast_legend_modifier: "เจ้าภาพระดับตำนาน"
 legendary_feast_legend_modifier_desc: "ตัวละครนี้มีตำนานของตนเองถูกขับขานในงานเลี้ยงใหญ่ — และยังคงดื่มด่ำกับความรุ่งโรจน์นั้นอยู่"
 legendary_feast_legend_boost_modifier: "งานเลี้ยงระดับตำนาน"
 legendary_feast_legend_boost_modifier_desc: "ตัวละครนี้มีตำนานของตนเองถูกขับขานในงานเลี้ยงใหญ่"
