 legend_events.1000.t: "ถึง [ROOT.Char.Custom2('InsultAdjective', SCOPE.sC('legend_owner'))] [ROOT.Char.GetTitledFirstNameNoTooltip],"
 legend_events.1000.desc: "ช่างมีนิสัยน่าละอาย เช่นนี้! ช่างหลอกลวงนัก! ข้าเสนอทองคำให้ท่านเพื่อส่งเสริมตำนานของข้า และท่านตอบแทนข้าด้วยการทิ้งมันไปเหมือนหมาป่วย"
