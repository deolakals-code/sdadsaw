 #Legend Chapters
 legend_chapter_opening_generic: "ตำนานของ [ROOT.Legend.GetProtagonist.GetNameNoTooltip] ยิ่งใหญ่และกว้างขวางดุจโลกหล้า เพราะวีรกรรมของ[ROOT.Legend.GetProtagonist.GetHerHis]นั้นหาที่เปรียบมิได้"
 legend_chapter_extra_deed_memory: "อย่างไรก็ตาม [ROOT.Legend.GetProtagonist.GetNameNoTooltip] ไม่ได้หยุดเพียงแค่นั้น เพราะ[ROOT.Legend.GetProtagonist.GetSheHe]ยังคงดำเนินต่อไปและด้วยความกล้าหาญอันยิ่งใหญ่ [ROOT.Legend.MakeScope.Var('extra_deed_memory').CharacterMemory.GetThirdPerspectiveDescription]"
 legend_chapter_motivation_generic: "เมื่อได้ยินข่าวลือคลุมเครือที่แพร่สะพัดไปทั่วแผ่นดิน [ROOT.Legend.GetProtagonist.GetFirstNameNoTooltip] ตั้งปณิธานในใจของ[ROOT.Legend.GetProtagonist.GetHerHis]ที่จะบรรลุภารกิจอันยากลำบากนี้"
 legend_chapter_motivation_evil: "ไม่ใช่คำวิงวอนของผู้คนหรือความสิ้นหวังที่แพร่ระบาดในแผ่นดินที่ ทำให้[ROOT.Legend.GetProtagonist.GetHerHim]แสวงหาการผจญภัย แต่เป็นความปรารถนาในใจอันมืดมิดของ[ROOT.Legend.GetProtagonist.GetHerHis]เอง"
 legend_chapter_motivation_peasant: "เมื่อชาวนาผู้น่าสงสาร สิ้นหวัง และน้ำตานองหน้า ขอเข้าเฝ้า[ROOT.Legend.GetProtagonist.GetHerHim] [ROOT.Legend.GetProtagonist.GetFirstNameNoTooltip] ผู้มีใจศรัทธา ไม่สามารถเพิกเฉยต่อคำวิงวอนของเขาได้และรีบออกเดินทางผจญภัยทันที"
 legend_chapter_motivation_spouse: "เมื่อคู่ครองของ[ROOT.Legend.GetProtagonist.GetFirstNamePossessiveNoTooltip|U]มาหา[ROOT.Legend.GetProtagonist.GetHerHim]ในเช้าวันหนึ่งพร้อมข่าวลือที่น่าตกใจ [ROOT.Legend.GetProtagonist.GetFirstNameNoTooltip] รีบเร่งและสัญญาว่าจะรักษาเกียรติแห่งความรักนิรันดร์ของพวกเขา"
 legend_chapter_motivation_honor_lady: "เมื่อดวงตาของ[ROOT.Legend.GetProtagonist.GetFirstNamePossessiveNoTooltip|U]สบกับดวงตาของคนรัก ทุกอย่างก็ถูกตัดสินแล้ว เมื่อฟังคำวิงวอนขอความช่วยเหลือและต้องการพิสูจน์ความกล้าหาญอันยิ่งใหญ่ของ[ROOT.Legend.GetProtagonist.GetHerHis] [ROOT.Legend.GetProtagonist.GetSheHe] จึงออกเดินทางผจญภัย"
 legend_chapter_discovery_generic: "[ROOT.Legend.GetProtagonist.GetNameNoTooltip] สำรวจ [Localize( location )] พร้อมกับคณะผู้ติดตามของ[ROOT.Legend.GetProtagonist.GetHerHis] และใช้เวลาไม่นาน[ROOT.Legend.GetProtagonist.GetHerHim]ก็พบสถานที่ที่แน่นอน"
 legend_chapter_hunt_generic: "[Localize( beast )|U] อยู่ที่นั่นแล้ว กำลังดื่มน้ำจากลำธาร มันเงยหน้าขึ้นและรุดหน้าเข้าหา [ROOT.Legend.GetProtagonist.GetFirstNameNoTooltip] อย่างรวดเร็ว หิวโหย แต่ [ROOT.Legend.GetProtagonist.GetFirstNameNoTooltip] เร็วกว่า และด้วยการฟันอย่างชำนาญ [ROOT.Legend.GetProtagonist.GetSheHe] สังหารสัตว์ร้ายนั้น"
 legend_chapter_battle_generic: "การต่อสู้ดุเดือด [ROOT.Legend.GetProtagonist.GetNameNoTooltip] เผชิญหน้ากับ [loser.GetNameNoTooltip] กลางสนามรบ ดวงตาของ[ROOT.Legend.GetProtagonist.GetHerHis]เต็มไปด้วยความกล้าหาญ [ROOT.Legend.GetProtagonist.GetSheHe|U] ชูอาวุธของ[ROOT.Legend.GetProtagonist.GetHerHis]ขึ้น และฟันเข้าที่หน้าอกของศัตรู เลือดไหลนอง ชัยชนะ"
 legend_chapter_conclusion_generic: "การเดินทางกลับบ้านไม่ใช่เรื่องง่าย แต่ [ROOT.Legend.GetProtagonist.GetTitledFirstNameNoTooltip] เข้าเมืองท่ามกลางเสียงโห่ร้องแห่งชัยชนะ และบัดนี้ขอให้เราทุกคนจงชื่นชมยินดีและเฉลิมฉลอง เพราะตำนานของ[ROOT.Legend.GetProtagonist.GetHerHis]ควรค่าแก่การสรรเสริญ!"
 legend_chapter_famous_deed_generic: "ตำนานของ[ROOT.Legend.GetProtagonist.GetFirstNamePossessiveNoTooltip|U]ถึงจุดสูงสุดในการผจญภัยอันน่าอัศจรรย์: วีรกรรมอันยิ่งใหญ่ทางการทหารของ[ROOT.Legend.GetProtagonist.GetHerHis]นั้นยิ่งใหญ่เสียจนกษัตริย์ทั้งปวงต่างประหลาดใจ และขุนนางและสามัญชนจำนวนมากมาพบ[ROOT.Legend.GetProtagonist.GetHerHis] เพราะพวกเขาปรารถนาที่จะเห็นตำนานตัวเป็นๆ"
 legend_chapter_extra_deed_generic: "อย่างไรก็ตาม นั่นไม่ใช่จุดจบของเรื่องราว เพราะเมื่อ [ROOT.Legend.GetProtagonist.GetFirstNameNoTooltip] เดินทางกลับบ้าน [ROOT.Legend.GetProtagonist.GetSheHe] ได้ช่วยเหลือผู้ที่ตกอยู่ในอันตรายและล้างแค้นให้กับการดูหมิ่นของพวกเขา โจร สัตว์ร้าย และผู้กระทำความชั่ว ไม่สามารถซ่อนตัวจากความโกรธเกรี้ยวของดาบของ[ROOT.Legend.GetProtagonist.GetHerHis]ได้"
 legend_chapter_opening_debug: "#D บทเปิด#!"
