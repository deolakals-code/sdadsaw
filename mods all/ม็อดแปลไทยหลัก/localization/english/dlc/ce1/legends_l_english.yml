 legend_chronicle_great_deed_faith_desc: "นำโดยศรัทธาของ[founder.GetHerHis]ใน[new_faith.HighGodName] [founder.GetName] ได้นำผู้ศรัทธา [new_faith.GetAdherentNamePlural] ไปสู่ชัยชนะเหนือ [old_faith.GetAdherentName] ซึ่งนำโดย [antagonist.GetName] ผู้น่ารังเกียจ"

 legend_chronicle_great_deed_title: "วีรกรรมอันยิ่งใหญ่เพื่อ [title.GetNameNoTooltip]"
 legend_chronicle_great_deed_title_desc: "ตลอดประวัติศาสตร์ ในบรรดาผู้ปกครองทั้งหมดของ [title.GetName] ไม่มีผู้ใดประสบความสำเร็จมากเท่านี้ จะไม่มีผู้ใดถูกกล่าวถึงก่อน [founder.GetName] ผู้ยิ่งใหญ่"

