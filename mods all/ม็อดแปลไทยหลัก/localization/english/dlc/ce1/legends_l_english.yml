 legend_events.0001.t: "ผู้บันทึกพงศาวดาร: พบตำนาน"
 legend_events.0001.desc.intro: "[chronicler.Custom2('MyCharacterIntroduction', ROOT.Char)|U] รีบเข้ามาทักทายข้าอย่างตื่นเต้นเมื่อข้าเข้าสู่ราชสำนัก\n\n"
 legend_events.0001.desc.mid.slew_dragon: ""ข้านำข่าวดีมายื่นถวาย ฝ่าบาท[ROOT.Char.GetTitleAsNameNoTooltip|U]! ข้าได้ค้นหาตำราและตำนานเกี่ยวกับ [legend_character.GetName] และข้ามีเหตุผลให้เชื่อว่า [legend_character.GetSheHe] ได้ต่อสู้และสังหารมังกร!"
 legend_events.0001.desc.mid.ancestral_saint: ""[ROOT.Char.GetFaith.HighGodName|U] กำลังยิ้มให้ราชวงศ์ของท่านในวันนี้ ฝ่าบาท[ROOT.Char.GetTitleAsNameNoTooltip|U] ข้าได้ค้นหาข้อมูลเกี่ยวกับบรรพบุรุษผู้เป็นมงคลของท่าน [legend_character.GetName] และข้าพบข้อมูลที่อาจ ทำให้[legend_character.GetHerHim]คู่ควรแก่การได้รับการยกย่องเป็น[GetTrait('saint').GetNameNoTooltip( ROOT.Char )]!"
 legend_events.0001.desc.mid.godly_descent: "[chronicler.GetSheHe|U] ทรุดลงคุกเข่า [chronicler.GetHerHis] และจุมพิตเท้าข้า "โอ้ ท่าน [ROOT.Char.GetTitleAsNameNoTooltip|U] ผู้ศักดิ์สิทธิ์ที่สุด ข้ามีเหตุผลอันหนักแน่นให้สงสัยว่าท่านคือผู้สืบสายเลือดของ [ROOT.Char.GetFaith.HighGodName|U] [ROOT.Char.GetFaith.HighGodHerselfHimself]!""
 legend_events.0001.desc.mid.old_godly_descent: ""สวัสดี ฝ่าบาท[ROOT.Char.GetTitleAsNameNoTooltip|U] หรือข้าควรจะเรียกท่านว่า '[ROOT.Char.Custom('GetDaughterSon')|U] แห่ง [legend_character.GetFaith.HighGodName|U]'? แท้จริงแล้ว ข้าได้ค้นหาบันทึกและเชื่อว่า 'เทพเจ้า' ของบรรพบุรุษของท่าน แท้จริงแล้วเป็นมนุษย์ผู้กล้าหาญที่กระทำวีรกรรมอันยิ่งใหญ่มากมาย"
 legend_events.0001.desc.mid.raised_by_animals: ""สวัสดี ฝ่าบาท[ROOT.Char.GetTitleAsNameNoTooltip|U] ท่านจำวัยเด็กตอนต้นของท่านได้มากน้อยเพียงใด? ตำราบางเล่มในหอจดหมายเหตุบ่งชี้ว่าท่านถูกเลี้ยงดูในป่าโดย[ROOT.Char.Custom('GetAnimalPlural')]"
 legend_events.0001.desc.mid.auspicious_stars: ""[ROOT.Char.GetFaith.HighGodName|U] ยิ้มให้เราในวันนี้ ฝ่าบาท[ROOT.Char.GetTitleAsNameNoTooltip] เช่นเดียวกับที่[ROOT.Char.GetFaith.HighGodNameSheHe]ทำในวันที่ท่านเกิด แท้จริงแล้ว ท่านเกิดภายใต้ดวงดาวอันเป็นมงคล สัญญาณแห่งวีรกรรมอันยิ่งใหญ่ที่ท่านจะกระทำในชีวิต"
 legend_events.0001.desc.mid.virgin_birth: ""[ROOT.Char.GetFaith.HighGodName|U] ยิ้มให้เราในวันนี้ ฝ่าบาท[ROOT.Char.GetTitleAsNameNoTooltip] เช่นเดียวกับที่[ROOT.Char.GetFaith.HighGodNameSheHe]ทำกับมารดาของท่านเมื่อท่านปฏิสนธิ แท้จริงแล้ว ท่านไม่ใช่ลูกนอกสมรส มารดาของท่านโชคดีพอที่จะได้รับพรด้วยการปฏิสนธินิรมล!"
 legend_events.0001.desc.mid.spoke_to_angels: ""ข้าจำได้หลายคืนก่อนเมื่อท่านบอกข้าว่าท่านได้รับการมาเยือนจากทูตสวรรค์ ฝ่าบาท[ROOT.Char.GetTitleAsNameNoTooltip|U] ข้ามีเหตุผลให้เชื่อว่านี่ไม่ใช่เพียงความฝัน แต่เป็นนิมิตจาก[ROOT.Char.GetFaith.PositiveAfterLife]"
 legend_events.0001.desc.mid.fought_the_devil: ""ข้าทราบว่าท่านถูกรบกวนด้วยฝันร้ายเมื่อเร็วๆ นี้ ข้ามีเหตุผลให้เชื่อว่านิมิตเหล่านี้คือภาพแวบของการต่อสู้ของท่านกับ[ROOT.Char.GetFaith.DevilName]ใน[ROOT.Char.GetFaith.NegativeAfterLife]"
 legend_events.0001.desc.mid.exotic_backstory: ""ฝ่าบาท[ROOT.Char.GetTitleAsNameNoTooltip|U] ท่านไม่เคยรู้สึกเหมือนเป็น[ROOT.Char.GetWomanMan]ชาว[ROOT.Char.GetCulture.GetName]เต็มตัวเลยใช่หรือไม่? ข้าเชื่อว่าหลายปีก่อน ท่านมาจากดินแดนลึกลับที่ห่างไกลจากที่นี่"
 legend_events.0001.desc.mid.ancient_people: ""ฝ่าบาท[ROOT.Char.GetTitleAsNameNoTooltip|U] ข้าได้ค้นหาบันทึกและพบข้อมูลบางอย่างที่บ่งชี้ว่าเชื้อสายของท่านสามารถสืบย้อนไปถึงราชวงศ์ [ancient_culture.GetName] อันยิ่งใหญ่ได้!"
 legend_events.0001.desc.outro: "บางคนอาจพบว่าเรื่องนี้ค่อนข้างเหลือเชื่อและต้องใช้ความพยายามพอสมควรในการพิสูจน์ว่าเป็นความจริง แต่มีพื้นฐานที่แข็งแกร่งพอที่จะ ทำให้ท่านกลายเป็นตำนานที่มีชีวิต!""
 legend_events.0001.a: "ยอดเยี่ยมมาก!"
 legend_events.0001.b: "แม้ แต่ข้าก็ยังยากที่จะเชื่อเรื่องนี้"
 legend_events.0010.t: "$chronicler_court_position$: ตำนานแพร่กระจาย"
 legend_events.0010.desc: "[chronicler.Custom2('MyCharacterIntroduction', ROOT.Char)|U] ทักทายข้าที่ราชสำนักเช้านี้ กระตือรือร้นด้วยข่าวที่ปลายลิ้นของ[chronicler.GetHerHis]\n\n"ฝ่าบาท[ROOT.Char.GetTitleAsNameNoTooltip|U] ข้าเชื่อว่า [potential_promoter.Custom2('YourCharacterIntroduction', ROOT.Char)] เกือบจะเชื่อในความจริงของ [ROOT.Char.GetPromotedLegend.GetName] แล้ว! [potential_promoter.GetSheHe|U] ทราบเรื่องราวและดูเหมือนจะหลงใหลในเรื่องนี้อย่างสิ้นเชิง แต่ยังไม่มั่นใจในความจริงเบื้องหลัง""
 legend_events.0010.a: "บางที [potential_promoter.GetSheHe] อาจถูกโน้มน้าวได้"
 legend_events.0010.a.success: "[potential_promoter.GetName] เชื่อแล้ว"
 legend_events.0010.a.failure: "[potential_promoter.GetName] ยังไม่เชื่อ"
 legend_events.0010.b: "บางทีการบิดเบือนความจริงอาจ ทำให้[potential_promoter.GetHerHim]เชื่อก็ได้"
 legend_events.0010.c: "[potential_promoter.GetSheHe|U] จะคิดอย่างไรก็ได้ตามใจ[potential_promoter.GetSheHe]"

 legend_events.0020.t: "การช่วงชิงตำนาน"
 legend_events.0020.desc: "แขกต่างชาติเข้าใกล้บัลลังก์ของข้าและประกาศเสียงดัง:\n\n"เป็นเวลาสักพักแล้วที่ข้ามาถึงราชสำนักของท่าน ข้าได้สังเกตอย่างละเอียดว่าท่านปกครองและจัดการเรื่องราวในอาณาจักรอย่างไร ทั้งเรื่องเล็กและเรื่องใหญ่ และข้าประทับใจอย่างสุดซึ้ง\n\nในหมู่ชาว[seed_presenter.GetCulture.GetCollectiveNoun] มีนิทานเก่าแก่เกี่ยวกับผู้ปกครองในตำนานจากราชวงศ์ที่โดดเด่น เป็นเรื่องราวที่มารดาของข้าเล่าให้ข้าฟังเมื่อนางยังเด็ก นางได้ยินครั้งแรกจากมารดาของนางเมื่อนานมาแล้ว\n\nและบัดนี้ ข้ามีความยินดีอย่างยิ่งที่จะบอกท่านว่าข้าคิดว่าท่านคือ [ROOT.Char.GetTitleAsNameNoTooltip|U] ในตำนานของชาว[seed_presenter.GetCulture.GetPrefix] และข้าเชื่อว่าบุตรที่แท้จริงของ [seed_presenter.GetCulture.GetName] ทุกคนย่อมเห็นด้วยกับข้าอย่างแน่นอน!""
 legend_events.0020.a: "ใช่! บรรพบุรุษของท่านพูดถึง [ROOT.Char.GetDynasty.GetNameNoTooltip]!"
 legend_events.0020.b: "[ROOT.Char.GetPrimaryTitle.GetNameNoTierNoTooltip] เป็นหัวข้อของนิทานชาว[seed_presenter.GetCulture.GetPrefixNoTooltip]"
 legend_events.0020.c: "ผู้ปกครองชาว[ROOT.Char.GetCulture.GetPrefixNoTooltip]ไม่สนใจว่าชาวนา[seed_presenter.GetCulture.GetCollectiveNounNoTooltip]จะพูดพล่ามอะไร"

