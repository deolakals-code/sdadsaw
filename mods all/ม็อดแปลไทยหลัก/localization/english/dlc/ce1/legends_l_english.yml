 legend_chapter_motivation_delicious_meats: "[Localize( beast )|U] เป็นที่รู้กันว่าดุร้ายและอันตราย แต่จุดประสงค์ของ[ROOT.Legend.GetProtagonist.GetFirstNamePossessiveNoTooltip|U]ไม่อาจถูกปฏิเสธได้ [ROOT.Legend.GetProtagonist.GetSheHe|U] ยืนกรานที่จะลิ้มรสเนื้อของมัน และกระตุ้น[ROOT.Legend.GetProtagonist.GetHerselfHimself]ให้ก้าวไปข้างหน้าเพื่อเติมเต็มความฝันนั้น"
 legend_chapter_motivation_dead_parent: "[Localize( beast )|U] เป็นสัตว์อันตรายอย่างแท้จริง แต่หัวใจของ[ROOT.Legend.GetProtagonist.GetFirstNamePossessiveNoTooltip|U]นั้นมั่นคง [ROOT.Legend.GetProtagonist.GetSheHe|U] มีความแค้นส่วนตัวต่อสัตว์ตัวนั้น เนื่องจากมีข่าวลือว่ามันได้สังหารบิดามารดาของ[ROOT.Legend.GetProtagonist.GetHerHis]"
 legend_chapter_motivation_great_venator: "ในเวลานี้ [ROOT.Legend.GetProtagonist.GetFirstNameNoTooltip|U] มีชื่อเสียงโด่งดังไปทั่วแผ่นดินในฐานะนายพรานที่ยิ่งใหญ่ที่สุดแล้ว แต่สำหรับ [ROOT.Legend.GetProtagonist.GetTitleAsNameNoTooltip|U] ผู้กล้าหาญ ความจริงนี้ยังคงต้องได้รับการพิสูจน์ต่อไป"
 legend_chapter_motivation_accomplished_hunter: "[ROOT.Legend.GetProtagonist.GetFirstNameNoTooltip|U] มุ่งมั่นที่จะพิสูจน์คุณค่าของ[ROOT.Legend.GetProtagonist.GetHerHis]ในฐานะนายพราน ในที่สุด [ROOT.Legend.GetProtagonist.GetSheHe|U] ก็มีโอกาสแสดงทักษะของ[ROOT.Legend.GetProtagonist.GetHerHis] เมื่อ [Localize( beast )|U] อันยิ่งใหญ่เข้ามาใกล้"
 legend_chapter_discovery_befriended_cyclops: "[ROOT.Legend.GetProtagonist.GetFirstNameNoTooltip|U] พิสูจน์ให้เห็นว่าเป็นมิตรกับทุกประเภทที่แปลกและผิดปกติที่พบบนท้องถนน แม้กระทั่งผูกมิตรกับไซคลอปส์ตัวใหญ่และขี้หงุดหงิด!"
 legend_chapter_discovery_cyclops: "ขณะที่ [ROOT.Legend.GetProtagonist.GetSheHe] เดินทาง [ROOT.Legend.GetProtagonist.GetSheHe] ได้พบกับผู้คนที่แปลกและผิดปกติที่สุด จนถึงขั้นค้นพบการมีอยู่ของไซคลอปส์ผู้ยิ่งใหญ่!"
 legend_chapter_discovery_renowned_herbalist: "ด้วยชื่อเสียงของ [ROOT.Legend.GetProtagonist.GetFirstNameNoTooltip|U] ในฐานะนักสมุนไพร ชื่อเสียงยิ่งเพิ่มพูนขึ้นเมื่อ [ROOT.Legend.GetProtagonist.GetSheHe] ค้นพบดงพืชมีพิษร้ายแรงและเล็ดลอดผ่านเถาวัลย์พิษของพวกมันไปได้"
 legend_chapter_discovery_evil_plants: "การเดินทางของ[ROOT.Legend.GetProtagonist.GetFirstNamePossessive|U]เต็มไปด้วยอันตรายตั้งแต่เริ่มต้น [ROOT.Legend.GetProtagonist.GetSheHe|U] ถึงกับถูกโจมตีโดยดงพืชมีพิษ ละอองเกสรของพวกมัน ทำให้ผู้ที่เข้ามาในระยะมึนงงและเวียนหัว"
 legend_chapter_discovery_legendary_archer: "การเดินทางของ[ROOT.Legend.GetProtagonist.GetFirstNamePossessive|U]นำ[ROOT.Legend.GetProtagonist.GetHerHim]ไปยังผืนดินที่มีนักธนูขี้โอ้อวดอยู่ ซึ่งท้าทาย[ROOT.Legend.GetProtagonist.GetLadyLord]ผู้ดีให้แข่งขันยิงธนู [ROOT.Legend.GetProtagonist.GetFirstNameNoTooltip] ยิงธนูของนักธนูคนนั้นขาดเป็นสองท่อนด้วยลูกธนูของ[ROOT.Legend.GetProtagonist.GetHerHis]เองทันที!"
 legend_chapter_discovery_archery_contest_won: "การเดินทางของ[ROOT.Legend.GetProtagonist.GetFirstNamePossessive|U]นำ[ROOT.Legend.GetProtagonist.GetHerHim]ไปยังผืนดินที่มีนักธนูขี้โอ้อวดอยู่ ซึ่งท้าทาย[ROOT.Legend.GetProtagonist.GetLadyLord]ผู้ดีให้แข่งขันยิงธนู การแข่งขันดุเดือด แต่ในที่สุด [ROOT.Legend.GetProtagonist.GetFirstNameNoTooltip] ก็พิสูจน์ให้เห็นว่ายิงได้แม่นยำกว่า"
 legend_chapter_discovery_bog_stronk: "เส้นทางของ[ROOT.Legend.GetProtagonist.GetFirstNamePossessive|U]นำ[ROOT.Legend.GetProtagonist.GetHerHim]ข้ามภูมิประเทศที่ทรยศ ที่ ซึ่งแม้ แต่พื้นดินก็พยายามดูด[ROOT.Legend.GetProtagonist.GetHerHim]ลงไปใต้พื้นผิว มีเพียงพละกำลังมหาศาลที่ [ROOT.Legend.GetProtagonist.GetFirstNameNoTooltip] มีเท่านั้นที่ ทำให้[ROOT.Legend.GetProtagonist.GetHerHim]หลุดพ้นได้"
 legend_chapter_discovery_bog_struggle: "เส้นทางของ[ROOT.Legend.GetProtagonist.GetFirstNamePossessive|U]นำ[ROOT.Legend.GetProtagonist.GetHerHim]ข้ามภูมิประเทศที่ทรยศ ที่ ซึ่งแม้ แต่พื้นดินก็พยายามดูด[ROOT.Legend.GetProtagonist.GetHerHim]ลงไปใต้พื้นผิว หลังจากดิ้นรนอย่างสุดกำลัง ในที่สุด [ROOT.Legend.GetProtagonist.GetFirstNameNoTooltip] ก็ปลดปล่อย[ROOT.Legend.GetProtagonist.GetHerselfHimself]จากผืนดินอันทรยศได้"
 legend_chapter_discovery_wildflower_expert: "การเดินทางของ[ROOT.Legend.GetProtagonist.GetFirstNamePossessive|U]พา[ROOT.Legend.GetProtagonist.GetHerHim]ไปยังดินแดนใหม่และแปลกตา ที่ ซึ่งแม้ แต่พืชพรรณก็ไม่คุ้นเคยและผิดปกติ แท้จริงแล้ว [ROOT.Legend.GetProtagonist.GetSheHe] ถึงกับพบพืชที่ไม่เคยเห็นมาก่อนหรือหลังจากนั้น ซ่อนตัวอยู่ในพุ่มไม้หนาทึบ"
 legend_chapter_discovery_cannibal_scarred: "[ROOT.Legend.GetProtagonist.GetFirstNameNoTooltip|U] เดินทางไปไกลและกว้างขวาง และถึงกับถูกโจมตีโดยมนุษย์กินคนผู้หิวโหย! [ROOT.Legend.GetProtagonist.GetSheHe|U] สังหารพวกมันไปมากมาย รอยแผลเป็นบนใบหน้าของ[ROOT.Legend.GetProtagonist.GetHerHis]เป็นเครื่องพิสูจน์ถึงการต่อสู้ไปตลอดชีวิตของ[ROOT.Legend.GetProtagonist.GetHerHis]"
 legend_chapter_discovery_cannibal_fight: "[ROOT.Legend.GetProtagonist.GetFirstNameNoTooltip|U] เดินทางไปไกลและกว้างขวาง และถึงกับถูกโจมตีโดยมนุษย์กินคนผู้หิวโหย! การต่อสู้ดำเนินไป จนกระทั่งพระอาทิตย์ตกดิน ทิ้งให้วีรบุรุษของเราเหนื่อยล้าขณะที่มนุษย์กินคนที่เหลือหลบหนีไป"
 legend_chapter_battle_enemy_commander: "ท่ามกลางความโกลาหล [ROOT.Legend.GetProtagonist.GetFirstNameNoTooltip|U] พบว่าตนเองเผชิญหน้ากับไม่ใช่ใครอื่นนอกจากผู้บัญชาการศัตรูผู้น่ารังเกียจ! หลังจากการดวลอันยิ่งใหญ่ คนเลวทรามนั้นถูก [ROOT.Legend.GetProtagonist.GetFirstNameNoTooltip|U] สังหาร เลือดไหลนองดาบของ[ROOT.Legend.GetProtagonist.GetHerHis]ขณะที่การต่อสู้หมุนวนอยู่รอบตัวพวกเขา"
 legend_chapter_battle_faked_retreat: "ความเฉียบแหลมทางยุทธวิธีของ[ROOT.Legend.GetProtagonist.GetFirstNamePossessive|U]ถูกทดสอบในเปลวเพลิงแห่งการต่อสู้ แต่ [ROOT.Legend.GetProtagonist.GetSheHe] พิสูจน์[ROOT.Legend.GetProtagonist.GetHerselfHimself]ว่าเท่าเทียมกับภารกิจ การแสร้งถอยอย่างมีเล่ห์เหลี่ยมรวบรวมศัตรูเข้ามาอยู่ในตำแหน่งที่เปราะบาง เพียง เพื่อให้วีรบุรุษผู้กล้าหาญของเราบุกไปข้างหน้าอีกครั้งและสังหารพวกเขา"
 legend_chapter_battle_flanking_success: "การเคลื่อนทัพที่ดุดันและยอดเยี่ยมในสนามรบของ[ROOT.Legend.GetProtagonist.GetFirstNamePossessive|U]ถูกแสดงให้เห็นอีกครั้ง เมื่อ [ROOT.Legend.GetProtagonist.GetSheHe] นำการโจมตีด้านข้างอันกึกก้องด้วยตนเอง ศัตรูขี้ขลาดลังเลแล้ววิ่งหนี การโจมตีเพียงครั้งเดียวตัดสินชัยชนะในวันนั้น"
 legend_chapter_battle_ravished_maiden: "ไม่เคยทิ้งผู้บริสุทธิ์ให้ตาย [ROOT.Legend.GetProtagonist.GetFirstNameNoTooltip|U] หาเวลาท่ามกลางการต่อสู้ ไม่เพียง แต่ช่วยเหลือ แต่ยัง #EMP ขยี้กาม#! หญิงสาวชาวบ้านหน้าตาดีที่หลงเข้ามาในอันตราย!"
 legend_chapter_battle_maiden_kiss: "เมื่อเผชิญหน้ากับชาวนาที่ช่วยเหลือตัวเองไม่ได้ — แต่สวยงามอย่างแท้จริง — ท่ามกลางความโกลาหลในการต่อสู้ [ROOT.Legend.GetProtagonist.GetFirstNameNoTooltip|U] พุ่งเข้าไปอุ้มพวกเขาออกไป วีรบุรุษของเราได้รับรางวัลเป็นจูบทันที ซึ่งเหมาะสมอย่างแท้จริงกับ[ROOT.Legend.GetProtagonist.GetWomanMan]ผู้มีความกล้าหาญ เช่นนี้!"
 legend_chapter_battle_wounded: "การต่อสู้ดุเดือดและการสู้รบโหดร้าย [ROOT.Legend.GetProtagonist.GetFirstNameNoTooltip|U] ได้รับบาดเจ็บสาหัสหลายครั้งอันเป็นผลมาจากมัน; เป็นราคาเล็กน้อยที่ต้องจ่ายสำหรับ[ROOT.Legend.GetProtagonist.GetWomanMan]ผู้มีความเชื่อมั่นและเกียรติยศ เช่นนี้!"
 legend_chapter_battle_reinforcement_arrival: "เมื่อการต่อสู้ถึงจุดสูงสุด [ROOT.Legend.GetProtagonist.GetFirstNameNoTooltip|U] [ROOT.Legend.GetProtagonist.GetHerselfHimself] มาถึงที่หัวขบวนของกองกำลังเสริม การต่อสู้จึงพลิกผันเป็นประโยชน์ต่อวีรบุรุษผู้กล้าหาญของเรา ซึ่งนำการบุกทะลวงลึกเข้าไปในแนวข้าศึก"
 legend_chapter_opening_new_faith: "[ROOT.Legend.GetProtagonist.GetNameNoTooltip|U] เกิดเมื่อศาสนา [ROOT.Legend.GetProperty( 'religion' ).Religion.GetNameNoTooltip] ได้ตกต่ำลงไปไกลจากพระประสงค์ของ[ROOT.Legend.GetProperty( 'faith' ).Faith.HighGodNamePossessive] นักเทศน์และ[ROOT.Legend.GetProperty( 'faith' ).Faith.PriestNeuterPlural]สนับสนุนลัทธินอกรีตในนามของ[ROOT.Legend.GetProperty( 'faith' ).Faith.HighGodHerHis|U]ขณะที่[ROOT.Legend.GetProperty( 'faith' ).Faith.HouseOfWorshipPlural]ผุพังและถูกทอดทิ้ง ผู้คนหันไปนับถือศาสนาอื่น เปิดทางให้คู่แข่งของ[ROOT.Legend.GetProperty( 'faith' ).Faith.HighGodNamePossessive]พิชิตใจมนุษย์"
 legend_chapter_motivation_new_faith: "เมื่อเห็นความอ่อนแอและความทุจริตของศรัทธา [ROOT.Legend.GetProtagonist.GetNameNoTooltip|U] จึงออกเดินทางพร้อมกับวิสัยทัศน์ใหม่สำหรับ [ROOT.Legend.GetProperty( 'religion' ).Religion.GetNameNoTooltip] — มุมมองใหม่เกี่ยวกับศรัทธา ซึ่งจะไม่อนุญาตให้มีการเบี่ยงเบนไปจากพระประสงค์ของ[ROOT.Legend.GetProperty( 'faith' ).Faith.PantheonTerm]; ศรัทธาที่แข็งแกร่งและเป็นหนึ่งเดียวแพร่กระจายไปทั่วทุกมุมโลก!"
 legend_chapter_famous_deed_new_faith: "เพื่อแสวงหาความสันโดษจากคำพูดไร้สาระของพวกนอกรีต [ROOT.Legend.GetProtagonist.GetFirstNameNoTooltip] ปีนขึ้นไปบนภูเขาที่สูงที่สุดในแผ่นดินโดยไม่มีอะไรนอกจากความเมตตาของ[ROOT.Legend.GetProperty( 'faith' ).Faith.HealthGodName]เพื่อความปลอดภัย ที่ยอดเขา เมฆแยกออกและ[ROOT.Legend.GetProperty( 'faith' ).Faith.PantheonTerm]ปรากฏต่อ[ROOT.Legend.GetProtagonist.GetHerHim]และมอบนิมิตให้แก่[ROOT.Legend.GetProtagonist.GetHerHim] โครงกระดูกของ[ROOT.Legend.GetProperty( 'faith' ).Faith.PriestNeuter]ชรานอนอยู่บนเตียงมรณะ ยึดติดกับชีวิตอย่างอิจฉาริษยาขณะที่[ROOT.Legend.GetProperty( 'faith' ).Faith.PriestNeuter]ที่ใหม่กว่าและอายุน้อยกว่ามากวางบรรพบุรุษของพวกเขาให้พักผ่อน นิมิตนี้ไม่ต้องสงสัยเลยว่าเป็นการบอกล่วงหน้าถึงพรของ[ROOT.Legend.GetProperty( 'faith' ).Faith.PantheonTerm]ต่อศรัทธา [ROOT.Legend.GetProperty( 'faith' ).Faith.GetNameNoTooltip] ใหม่"
 legend_chapter_extra_deed_new_faith: "มนุษยชาติสร้างคู่แข่งมากมายสำหรับ[ROOT.Legend.GetProperty( 'faith' ).Faith.PantheonTerm] และ[ROOT.Legend.GetProtagonist.GetFirstNamePossessiveNoTooltip]รื้อถอนพวกเขาทั้งหมด จึงรวบรวมฝูงแกะจำนวนมากมาสู่[ROOT.Legend.GetProtagonist.GetHerselfHimself]เพื่อเลี้ยงดู"
 legend_chapter_conclusion_new_faith: "ด้วยการรวบรวม[ROOT.Legend.GetProperty( 'faith' ).Faith.PriestNeuterPlural]และการเขียน[ROOT.Legend.GetProperty( 'faith' ).Faith.ReligiousText|U]ขึ้นใหม่ [ROOT.Legend.GetProperty( 'religion' ).Religion.GetNameNoTooltip|U] ก็ได้รับการฟื้นฟูในที่สุดตามนิมิตของ[ROOT.Legend.GetProperty( 'faith' ).Faith.PantheonTerm]!"
 legend_chapter_battle_legendary_battle: "$legendary_battle_desc$"
 legend_chapter_opening_struggle: "เกิดในพายุโกลาหล ณ ใจกลางของ [ROOT.Legend.GetProperty( 'struggle' ).GetFlagName] [ROOT.Legend.GetProtagonist.GetNameNoTooltip] ไม่มีความโน้มเอียงใดๆ ว่า[ROOT.Legend.GetProtagonist.GetSheHe]จะนำสันติภาพและความสงบเรียบร้อยมาสู่ภูมิภาค"
 legend_chapter_motivation_struggle: "เมื่อเห็นพี่น้องหันมาต่อสู้กันเอง — [ROOT.Legend.GetProtagonist.GetFaith.GetAdherentNameNoTooltip] ต่อสู้กับ [ROOT.Legend.GetProtagonist.GetFaith.GetAdherentNameNoTooltip] — [ROOT.Legend.GetProtagonist.GetFirstNameNoTooltip] เอ่ยเพียง "พอแล้ว" กับคนโง่เขลาที่ทะเลาะวิวาทกัน ซึ่งพยายามจะทำลายภูมิภาค มันชัดเจนสำหรับ[ROOT.Legend.GetProtagonist.GetHerHim]ว่าการต่อสู้ดิ้นรนของผู้คนของ[ROOT.Legend.GetProtagonist.GetHerHis]ต้องสิ้นสุดลง และอนาคตใหม่จะต้องถูกสร้างขึ้นจากซากปรักหักพังของ [ROOT.Legend.GetProperty( 'struggle' ).GetFlagName]"
 legend_chapter_extra_deed_struggle: "แม้จะมีความยิ่งใหญ่ทั้งหมดที่ [ROOT.Legend.GetProtagonist.GetFirstNameNoTooltip] ได้บรรลุแล้ว แต่ก็ยังมีผู้ที่สงสัยในวิสัยทัศน์ของ[ROOT.Legend.GetProtagonist.GetHerHis]ในการแก้ไข [ROOT.Legend.GetProperty( 'struggle' ).GetFlagName] ศัตรูของ[ROOT.Legend.GetProtagonist.GetHerHis]พ่ายแพ้ในไม่ช้าในสนามรบทั้งการโต้วาทีและสงคราม จนกระทั่งทุกคนคุกเข่าลงแทบเท้าของ[ROOT.Legend.GetProtagonist.GetHerHis]และขอความเมตตาจาก[ROOT.Legend.GetProtagonist.GetHerHis]"
 legend_chapter_conclusion_ended_struggle: "[ROOT.Legend.GetProtagonist.GetFirstNameNoTooltip|U] เห็นว่ากฎของโลกนั้นผิด แต่ เนื่องจากความพยายามของ[ROOT.Legend.GetProtagonist.GetHerHis] สิ่งที่เรียกว่า [ROOT.Legend.GetProperty( 'struggle' ).GetFlagName] ก็สิ้นสุดลงและภูมิภาคจะไม่มีวันเหมือนเดิมอีกต่อไป [ROOT.Legend.GetProtagonist.GetFirstNameNoTooltip|U] ปรากฏตัวในฐานะ [ROOT.Legend.GetProtagonist.GetTitleAsNameNoTooltip|U] ผู้มีชัยเหนือผู้อื่นทั้งหมด"
 legend_chapter_opening_priesthood_restoration: "[ROOT.Legend.GetProtagonist.GetNameNoTooltip|U] เข้ามาในโลกนี้ขณะที่ผู้ศรัทธา [ROOT.Legend.GetProperty( 'faith' ).Faith.GetAdjectiveNoTooltip] แตกกระจัดกระจายไปทั่วโลกในการพลัดถิ่นอันสิ้นหวัง ด้วยนิมิตของ [ROOT.Legend.GetProperty( 'faith' ).Faith.HouseOfWorship] อันยิ่งใหญ่ที่ตั้งตระหง่านเหนือการสร้างสรรค์ในใจของ[ROOT.Legend.GetProtagonist.GetHerHis] [ROOT.Legend.GetProtagonist.GetSheHe] รู้ว่า[ROOT.Legend.GetProtagonist.GetSheHe]ได้รับมอบหมายภารกิจศักดิ์สิทธิ์จาก [ROOT.Legend.GetProperty( 'faith' ).Faith.HighGodName] เพื่อรวม [ROOT.Legend.GetProperty( 'faith' ).Faith.GetAdherentNamePluralNoTooltip] ทั้งหมดเข้าด้วยกัน"
 legend_chapter_famous_deed_religious: "[ROOT.Legend.GetProtagonist.GetFirstNameNoTooltip|U] อุทิศ[ROOT.Legend.GetProtagonist.GetHerselfHimself]ให้กับ [ROOT.Legend.GetProperty( 'faith' ).Faith.HighGodName] และกระทำการทั้งหมดเพื่อพระประสงค์ของ[ROOT.Legend.GetProperty( 'faith' ).Faith.HighGodHerHis|U] ทุก[ROOT.Legend.GetProperty( 'faith' ).Faith.GetReligion.GetAdherentNameNoTooltip|U]ท่องไปทั่วแผ่นดินพร้อมกับชื่อ "[ROOT.Legend.GetProtagonist.GetFirstNameNoTooltip]" บนริมฝีปาก เล่าขานเรื่องราวเหตุการณ์ศักดิ์สิทธิ์นับไม่ถ้วนในนามของ[ROOT.Legend.GetProtagonist.GetHerHis]"
 legend_chapter_extra_deed_religious: "อย่างไรก็ตาม นั่นไม่ใช่จุดจบของเรื่องราว เพราะผู้ศรัทธายังคงถูกรังควานโดยโจรและผู้กระทำความชั่ว และตกเป็นทาสของพวกนอกรีต! [ROOT.Legend.GetProtagonist.GetFirstNameNoTooltip|U] ช่วยเหลือผู้ที่อยู่ภายใต้การปกครองแบบเผด็จการให้ลุกขึ้นสู่อ้อมกอดของ [ROOT.Legend.GetProperty( 'faith' ).Faith.HighGodName|U] มีชัยเหนือ [ROOT.Legend.GetProperty( 'faith' ).Faith.DevilName] และสมุนของ[ROOT.Legend.GetProperty( 'faith' ).Faith.DevilHerHis]"
 legend_chapter_conclusion_priesthood_restored: "นักบวชถูกรวบรวมและการพลัดถิ่นสิ้นสุดลง จะไม่มีวันอีกแล้วที่ [ROOT.Legend.GetProperty( 'faith' ).Faith.GetAdherentNamePluralNoTooltip] จะถูกทอดทิ้งโดยไม่มีผู้นำ ขณะที่ [ROOT.Legend.GetProtagonist.GetFirstNameNoTooltip] นำเข้าสู่ยุคใหม่ของ [ROOT.Legend.GetProperty( 'faith' ).Faith.ReligiousHeadName]"
 legend_chronicle_opening_exotic_backstory: "[ROOT.Legend.GetProtagonist.GetFirstNameNoTooltip|U] เดินทางมาจากดินแดนลึกลับอันห่างไกลของ [ROOT.Legend.GetProperty( 'location' ).GetFlagName] ในภารกิจ [ROOT.Legend.GetProtagonist.GetSheHe|U] เป็นวีรบุรุษในหมู่ประชาชนของ[ROOT.Legend.GetProtagonist.GetHerHis]เอง แต่บัดนี้ [ROOT.Legend.GetProtagonist.GetSheHe] เสนอที่จะมอบความเมตตาของ[ROOT.Legend.GetProtagonist.GetHerHis]ให้กับมุมเล็กๆ ของเราในโลกอันกว้างใหญ่และไม่มีที่สิ้นสุดนี้"
 legend_chronicle_motivation_exotic_backstory: "[ROOT.Legend.GetProtagonist.GetFirstNameNoTooltip|U] มองดูบ้านใหม่ของ[ROOT.Legend.GetProtagonist.GetHerHis]และร่ำไห้ เพราะเทคโนโลยีและวัฒนธรรมของมันนั้นล้าสมัยมากเมื่อเทียบกับสิ่งมหัศจรรย์ที่[ROOT.Legend.GetProtagonist.GetSheHe]คุ้นเคยใน [ROOT.Legend.GetProperty( 'location' ).GetFlagName] งานนั้นชัดเจน: [ROOT.Legend.GetProtagonist.GetFirstNameNoTooltip] ต้องเผยแพร่การรู้แจ้งของบ้านเกิดของ[ROOT.Legend.GetProtagonist.GetHerHis]ไปยังมุมนี้ของการสร้างสรรค์"
 legend_chronicle_conclusion_exotic_backstory: "หลายสิ่งหลายอย่างเปลี่ยนไปตั้งแต่ [ROOT.Legend.GetProtagonist.GetFirstNameNoTooltip] มาถึง ที่ ซึ่งครั้งหนึ่งชาวนาเคยเกลือกกลั้วอยู่ในความสกปรกและคนเถื่อนสูบเลือดจากแผ่นดิน [ROOT.Legend.GetProtagonist.GetFirstNameNoTooltip] ได้เผยแพร่แสงสว่างแห่งอารยธรรม แม้จะมีอุปสรรคมากมายในเส้นทางของ[ROOT.Legend.GetProtagonist.GetHerHis] เขาก็รวบรวมมันทั้งหมดเพื่อสร้าง [ROOT.Legend.GetProperty( 'location' ).GetFlagName] ใหม่ ทั่วทั้งอาณาจักร ทารกถูกตั้งชื่อตาม [ROOT.Legend.GetProtagonist.GetFirstNameNoTooltip] และมวลชนร้องเพลงขอบคุณสำหรับคนแปลกหน้าจาก [ROOT.Legend.GetProperty( 'location' ).GetFlagName] ผู้สร้างเมืองอันยิ่งใหญ่ของพวกเขา"

 legend_chronicle_divine_intervention_motivation: "[Localize( god )|U] ตรัสกับ [ROOT.Legend.GetProtagonist.GetFirstNameNoTooltip] ในแดนแห่งความฝันและมอบหมายภารกิจศักดิ์สิทธิ์ให้แก่[ROOT.Legend.GetProtagonist.GetHerHim] ตั้งแต่นั้นมา [ROOT.Legend.GetProtagonist.GetFirstNameNoTooltip|U] ได้สวดอ้อนวอนและค้นหาไปทั่วแผ่นดินเพื่อหาสัญญาณถึงธรรมชาติที่แท้จริงของภารกิจนี้จาก[ROOT.Legend.GetProtagonist.GetFaith.PantheonTerm]"
 legend_chapter_famous_deed_divine_intervention: "[ROOT.Legend.GetProtagonist.GetFirstNameNoTooltip|U] อุทิศ[ROOT.Legend.GetProtagonist.GetHerselfHimself]ให้กับ [Localize( god )] และกระทำการทั้งหมดตามพระประสงค์ของ[ROOT.Legend.GetProtagonist.GetFaith.PantheonTerm] หลังจากหลายวันหลายคืนที่ปลีกวิเวกสวดอ้อนวอน ในที่สุดธรรมชาติที่แท้จริงของภารกิจของ[ROOT.Legend.GetProtagonist.GetHerHis]ก็ถูกเปิดเผยแก่[ROOT.Legend.GetProtagonist.GetHerHim]!"
 legend_chapter_extra_deed_divine_intervention: "ดินแดนเต็มไปด้วยโจรไร้พระเจ้าที่จะทำร้ายผู้ศรัทธา แต่ด้วย [ROOT.Legend.GetProtagonist.GetFirstNameNoTooltip] และกลุ่มผู้ติดตามของ[ROOT.Legend.GetProtagonist.GetHerHis] คนรับใช้ของ[ROOT.Legend.GetProtagonist.GetFaith.DevilName|U]เหล่านี้ถูกไล่กลับไปยัง[ROOT.Legend.GetProtagonist.GetFaith.NegativeAfterLife|U]ที่ ซึ่งพวกเขาควรอยู่และผู้คนก็เป็นอิสระ [Localize( god )|U] ยิ้มให้ [ROOT.Legend.GetProtagonist.GetFirstNameNoTooltip] สำหรับความดีที่[ROOT.Legend.GetProtagonist.GetSheHe]ได้ทำ และภารกิจศักดิ์สิทธิ์ของ[ROOT.Legend.GetProtagonist.GetHerHis]เกือบจะถึงจุดสูงสุดแล้ว"
 legend_chapter_conclusion_divine_intervention: "[ROOT.Legend.GetProtagonist.GetFirstNameNoTooltip|U] ปกครองอย่างยุติธรรมและศรัทธา โดยมี [Localize( god )] เป็นผู้นำทางของ[ROOT.Legend.GetProtagonist.GetHerHis] แผนการอันศักดิ์สิทธิ์สำเร็จลุล่วง [ROOT.Legend.GetProtagonist.GetSheHe] ใช้ชีวิตอย่างมีเกียรติและศรัทธาอย่างยิ่ง"
 legend_chapter_opening_ancestral_glory: "[ROOT.Legend.GetProtagonist.GetNameNoTooltip|U] เกิดจากเนื้อหนังและสายเลือดของ[ROOT.Legend.Custom('GetAncestorNamePossessiveNoTooltip')]เอง ด้วยพลังธรรมชาติของเชื้อสายอันยิ่งใหญ่นี้ เคยมีข้อสงสัยหรือไม่ว่า[ROOT.Legend.GetProtagonist.GetSheHe]จะบรรลุสิ่งที่ยิ่งใหญ่?"
 legend_chapter_motivation_ancestral_glory: "ไม่มีข้อสงสัยในใจของ[ROOT.Legend.GetProtagonist.GetHerHis]; [ROOT.Legend.GetProtagonist.GetFirstNameNoTooltip] จะต้องรวม [ROOT.Legend.GetProperty( 'title' ).Title.GetBaseNameNoTooltip] ทั้งหมดภายใต้การปกครองของ[ROOT.Legend.GetProtagonist.GetHerHis] ในนามของ [ROOT.Legend.Custom('GetAncestorFirstNameNoTooltip')] การทะเลาะวิวาทของลอร์ดและเลดี้ชั้นผู้น้อยกำลังจะสิ้นสุดลง และทุกคนจะมาเรียก [ROOT.Legend.GetProtagonist.GetFirstNameNoTooltip] ว่าเจ้าเหนือหัวของพวกเขา"
 legend_chapter_famous_deed_ancestral_glory: "คนโง่จะรวมตัวกันเพื่อท้าทาย [ROOT.Legend.GetProtagonist.GetFirstNameNoTooltip] แต่พวกเขาก็เหมือนลมปะทะภูเขา ผู้ติดตามของ[ROOT.Legend.GetProtagonist.GetFirstNamePossessiveNoTooltip|U]เพิ่มขึ้นพร้อมกับการกระทำอันน่าอัศจรรย์ แต่ละครั้งที่[ROOT.Legend.GetProtagonist.GetSheHe]จะกระทำในนามของ[ROOT.Legend.GetProtagonist.GetFaith.PantheonTerm] และ[ROOT.Legend.GetProtagonist.GetSheHe]กลายเป็นภาพสะท้อนของ[ROOT.Legend.Custom('GetAncestorFirstNameNoTooltip')]อย่างแท้จริง"
 legend_chapter_extra_deed_ancestral_glory: "ชนบทที่สวยงามของ [ROOT.Legend.GetProperty( 'title' ).Title.GetBaseNameNoTooltip] ตกอยู่ภายใต้โจรและผู้ร้ายตั้งแต่สมัยของ[ROOT.Legend.Custom('GetAncestorFirstNamePossessiveNoTooltip')] แต่ [ROOT.Legend.GetProtagonist.GetFirstNameNoTooltip] ก็เริ่มแก้ไขความผิดและปกป้องผู้คนที่[ROOT.Legend.GetProtagonist.GetSheHe]จะปกครองอย่างชอบธรรมในไม่ช้า"
 legend_chapter_conclusion_ancestral_glory: "การเดินทางเต็มไปด้วยอันตราย แต่ด้วยทุกสิ่งที่ [ROOT.Legend.GetProtagonist.GetFirstNameNoTooltip] ได้ทำเพื่อ [ROOT.Legend.GetProperty( 'title' ).Title.GetBaseNameNoTooltip] และประชาชนของนาง จะมีข้อสงสัยใดๆ ได้หรือไม่ว่า[ROOT.Legend.GetProtagonist.GetSheHe]ถูกเลือกโดย[ROOT.Legend.GetProtagonist.GetFaith.PantheonTerm|U]ให้ปกครอง? จากเมืองไปจนถึงบ้านไร่ที่ต่ำต้อยที่สุด ทุกคนต่างร้องตะโกนชื่อ "[ROOT.Legend.GetProtagonist.GetFirstNameNoTooltip]" ด้วยความปิติยินดี!"
 legend_chapter_opening_ancient_people: "[ROOT.Legend.GetProtagonist.GetNameNoTooltip|U] เกิดมาในเชื้อสาย [ROOT.Legend.GetProperty( 'culture' ).Culture.GetNameNoTooltip] อันยิ่งใหญ่เพื่อปกครอง [ROOT.Legend.GetProperty( 'title' ).Title.GetBaseNameNoTooltip] ดังที่บรรพบุรุษของ[ROOT.Legend.GetProtagonist.GetHerHis]เคยทำ"
 legend_chapter_conclusion_ancient_people: "ด้วยแรงงานอันมหาศาล [ROOT.Legend.GetProtagonist.GetNameNoTooltip] ทำงานอย่างไม่รู้จักเหน็ดเหนื่อยเพื่อเปลี่ยน [ROOT.Legend.GetProperty( 'title' ).Title.GetNameNoTooltip] ให้เป็นภาพแห่งความสมบูรณ์แบบของ [ROOT.Legend.GetProperty( 'culture' ).Culture.GetNameNoTooltip] ต้องขอบคุณวีรกรรมในตำนานของ [ROOT.Legend.GetProtagonist.GetFirstNameNoTooltip] เท่านั้น ที่ ทำให้ผู้คนใน [ROOT.Legend.GetProperty( 'title' ).Title.GetNameNoTooltip] ร้องตะโกนด้วยความภาคภูมิใจในรากเหง้า [ROOT.Legend.GetProperty( 'culture' ).Culture.GetNameNoTooltip] ของพวกเขา!"
 legend_chapter_motivation_saintly_deed: "ภารกิจของ[ROOT.Legend.GetProtagonist.GetFirstNamePossessiveNoTooltip]จาก[ROOT.Legend.GetProtagonist.GetFaith.PantheonTerm]นั้นชัดเจน: [ROOT.Legend.GetProtagonist.GetSheHe] จะต้องทำสิ่งมหัศจรรย์! [ROOT.Legend.GetProperty('religion').Religion.GetAdherentNamePluralNoTooltip] ทุกคนเก็บ [ROOT.Legend.Custom('GetAncestorNameNoTooltip')] ไว้ในใจ แต่ไม่มีใครรู้ถึงปาฏิหาริย์ที่ [ROOT.Legend.GetProtagonist.GetFirstNameNoTooltip] ยังไม่ได้กระทำ!"
 legend_chapter_extra_deed_saintly_deed: "ถนนของผู้ศรัทธาถูกรบกวนโดยพวกไร้พระเจ้า และด้วยดาบที่ได้รับพรจากผู้ทรงอำนาจ [ROOT.Legend.GetProtagonist.GetFirstNameNoTooltip] ได้ไล่พวกเขาทั้งหมดไป แต่กระนั้นสัตว์ป่าและงูก็ยังคงเดินเข้ามาในเส้นทางและทำร้ายผู้ศรัทธา ดังนั้น [ROOT.Legend.GetProtagonist.GetFirstNameNoTooltip] จึงดึง [ROOT.Legend.GetProtagonist.Custom('GetMusicalInstrument')] ของ[ROOT.Legend.GetProtagonist.GetHerHis]ออกมาและขับไล่สิ่งสร้างของ[ROOT.Legend.GetProtagonist.GetFaith.CreatorNamePossessive]ออกจากดินแดน"
 legend_chapter_conclusion_saintly_deed: "[ROOT.Legend.GetProtagonist.GetFirstNameNoTooltip|U] ได้ทำงานอย่างไม่รู้จักเหน็ดเหนื่อยเพื่อ [ROOT.Legend.GetProperty('religion').Religion.GetNameNoTooltip] ทั้งหมดและต่อสู้กับสมุนของ[ROOT.Legend.GetProtagonist.GetFaith.DevilName]บนโลกนี้ แต่ในที่สุดการต่อสู้ดิ้นรนของ[ROOT.Legend.GetProtagonist.GetHerHis]ก็สิ้นสุดลง แผนการอันศักดิ์สิทธิ์สำเร็จลุล่วง [ROOT.Legend.GetProtagonist.GetSheHe] ใช้ชีวิตอย่างมีเกียรติและศรัทธาอย่างยิ่ง"
 legend_chapter_opening_mythical_descent: "เช่นเดียวกับสมาชิกทุกคนในตระกูล [ROOT.Legend.GetProtagonist.GetDynastyNameNoTooltip] ก่อนหน้า[ROOT.Legend.GetProtagonist.GetHerHim] [ROOT.Legend.GetProtagonist.GetNameNoTooltip] เกิดมาพร้อมกับสายเลือดของ [ROOT.Legend.GetProperty( 'beast' ).GetFlagName] ต้นกำเนิดที่ไม่ธรรมดาของ[ROOT.Legend.GetProtagonist.GetHerHis] ทำให้[ROOT.Legend.GetProtagonist.GetHerHim]อยู่เหนือผู้อื่นทั้งหมด ถูกลิขิตมาเพื่อความยิ่งใหญ่"
 legend_chapter_famous_deed_mythical_descent: "[ROOT.Legend.GetProtagonist.GetNameNoTooltip|U] ได้รับบาดเจ็บในการต่อสู้อันยิ่งใหญ่กับคนร้ายบางคนที่สงสัยในเชื้อสายของ[ROOT.Legend.GetProtagonist.GetHerHis] เลือดอันศักดิ์สิทธิ์ของ[ROOT.Legend.GetProtagonist.GetHerHis]กระจายไปทั่วทุ่ง เลือดส่องประกายแวววาวเหมือนอัญมณีที่เจียระไนใหม่ และภายในไม่กี่วัน ดินแดนที่ไม่เอื้ออำนวยก็กลับมาเบ่งบานด้วยดอกไม้สีสันงดงาม"
 legend_chapter_extra_deed_mythical_descent: "อย่างไรก็ตาม นี่ไม่ใช่จุดจบของเรื่องราว เนื่องจากหลายคนยังคงสงสัยในความเป็นเทพที่อยู่ในสายเลือดของ[ROOT.Legend.GetProtagonist.GetHerHis] ด้วยการใช้พลังอันยิ่งใหญ่ของ[ROOT.Legend.GetProtagonist.GetHerHis] [ROOT.Legend.GetProtagonist.GetFirstNameNoTooltip] ทำให้ผู้สงสัยของ[ROOT.Legend.GetProtagonist.GetHerHis]ต้องเผชิญกับภัยพิบัติจากสัตว์ร้ายครั้งใหญ่ พระราชวังและบ้านเรือนของพวกเขาเต็มไปด้วยเสียงเห่าหอนและเสียงกรีดร้องอันหิวโหย"
 legend_chapter_opening_godly_descent: "[ROOT.Legend.GetProperty( 'god' ).GetFlagName|U] ทำให้บรรพบุรุษของ[ROOT.Legend.GetProtagonist.GetNamePossessiveNoTooltip]ตั้งครรภ์และให้กำเนิด [ROOT.Legend.GetProtagonist.GetDynastyNameNoTooltip] คนแรกจากครรภ์ของโลก ตั้งแต่แรกเกิด สมาชิกทุกคนในตระกูล [ROOT.Legend.GetProtagonist.GetDynastyNameNoTooltip] ได้รับมอบหมายภารกิจจากเทพเจ้า เพื่อนำความเจริญรุ่งเรืองและศรัทธา [ROOT.Legend.GetProtagonist.GetFaith.GetNameNoTooltip] มาสู่ทุกมุมของ [ROOT.Legend.GetProperty( 'title' ).Title.GetBaseNameNoTooltip]"
 legend_chapter_famous_deed_war_won: "การสู้รบดำเนินไปมา และสงครามทาแผ่นดินให้เป็นสีแดงเข้มด้วยเลือดของผู้ชอบธรรมและคนร้ายในปริมาณเท่ากัน [ROOT.Legend.GetProperty( 'winner' ).Char.GetNameNoTooltip|U] ยังคงไม่หวั่นไหวขณะที่กองกำลังแห่งความชั่วร้ายพยายามเอาชนะกลยุทธ์ทางทหารอันเชี่ยวชาญของ[ROOT.Legend.GetProperty( 'winner' ).Char.GetHerHis] ในที่สุดความพยายามของพวกเขาก็ไร้ผล"
 legend_chapter_conclusion_war_won: "[ROOT.Legend.GetProperty( 'loser' ).Char.GetNameNoTooltip|U] และผู้ใต้บังคับบัญชาของ[ROOT.Legend.GetProperty( 'loser' ).Char.GetHerHis]ก้มหน้าต่ำใต้ธงที่หักสะบั้นและขอความเมตตาจาก[ROOT.Legend.GetProperty( 'winner' ).Char.GetFirstNamePossessiveNoTooltip] ในช่วงเวลาที่มืดมนกว่าของสงคราม [ROOT.Legend.GetProperty( 'winner' ).Char.GetSheHe] ทำได้เพียงจินตนาการว่า[ROOT.Legend.GetProperty( 'winner' ).Char.GetHerselfHimself]เป็นผู้รอดชีวิตจากสงคราม แต่[ROOT.Legend.GetProperty( 'winner' ).Char.GetSheHe]ปรากฏตัวในฐานะผู้ชนะ ผู้ชนะเพียงคนเดียว"
 legend_chapter_motivation_new_title: "นานก่อนที่ตระกูล [ROOT.Legend.GetProperty( 'founder' ).Char.GetDynastyNameNoTooltip] จะมาเป็นผู้ดูแล [ROOT.Legend.GetProperty( 'title' ).Title.GetBaseNameNoTooltip] [ROOT.Legend.GetProperty( 'founder' ).Char.GetNameNoTooltip] ได้รับนิมิตจาก[ROOT.Legend.GetProperty( 'founder' ).Char.GetFaith.PantheonTerm] ตั้งแต่วินาทีนั้น [ROOT.Legend.GetProperty( 'founder' ).Char.GetSheHe] รู้ว่า[ROOT.Legend.GetProperty( 'founder' ).Char.GetSheHe]เกิดมาเพื่อปกครอง"
 legend_chapter_famous_deed_new_title: "ดินแดนที่จะกลายเป็น [ROOT.Legend.GetProperty( 'title' ).Title.GetBaseNameNoTooltip] ถูกกดขี่ภายใต้หัวแม่เท้าของคนรับใช้ที่น่าสะพรึงกลัวของ[ROOT.Legend.GetProperty( 'founder' ).Char.GetFaith.DevilName] แต่ด้วยกองทัพอันยิ่งใหญ่ของ[ROOT.Legend.GetProperty( 'founder' ).Char.GetHerHis] [ROOT.Legend.GetProperty( 'founder' ).Char.GetNameNoTooltip] ปลดปล่อยหมู่บ้านแล้วหมู่บ้านเล่า เมืองแล้วเมืองเล่า ผู้คนจับอาวุธและโค่นล้มผู้ปกครองที่ชั่วร้ายของพวกเขาเพื่อรับใช้ [ROOT.Legend.GetProperty( 'founder' ).Char.GetFirstNameNoTooltip] เตรียมพร้อมที่จะตายเพื่อผู้ปกครองที่ชอบธรรมของพวกเขา [ROOT.Legend.GetProperty( 'founder' ).Char.GetFaith.HighGodName] ปฏิเสธการเสียสละของพวกเขา เพราะ[ROOT.Legend.GetProperty( 'founder' ).Char.GetFaith.HighGodNameSheHe|U]ประทานการคุ้มครองอันศักดิ์สิทธิ์ของ[ROOT.Legend.GetProperty( 'founder' ).Char.GetFaith.HighGodHerHis|U]ให้แก่พวกเขา ไม่มีดาบใดสามารถแตะต้องกองทัพที่กำลังเติบโตของ [ROOT.Legend.GetProperty( 'founder' ).Char.GetFirstNameNoTooltip] ได้ขณะที่[ROOT.Legend.GetProperty( 'founder' ).Char.GetSheHe]ปลดปล่อยผู้คนใน [ROOT.Legend.GetProperty( 'title' ).Title.GetBaseNameNoTooltip]"
 legend_chapter_conclusion_new_title: "การทะเลาะวิวาทของดยุกและขุนนางชั้นผู้น้อยไร้ชื่อในที่สุดก็สิ้นสุดลงเมื่อ [ROOT.Legend.GetProperty( 'founder' ).Char.GetNameNoTooltip] นำพวกเขาทั้งหมดมาสวามิภักดิ์เพื่อปฏิญาณความจงรักภักดีตลอดไปต่อ[ROOT.Legend.GetProperty( 'founder' ).Char.GetHerHim] ขณะที่ [ROOT.Legend.GetProperty( 'title' ).Title.GetBaseNameNoTooltip] ถือกำเนิดขึ้นใหม่ รูปร่างของโลกก็เปลี่ยนไปตลอดกาล"
 legend_chronicle_sacred_birth_opening: "ตั้งแต่วันที่[ROOT.Legend.GetProtagonist.GetSheHe]เกิด เป็นที่ชัดเจนว่า[ROOT.Legend.GetProtagonist.GetFaith.PantheonTerm]มีแผนการที่สูงส่งกว่าสำหรับ [ROOT.Legend.GetProtagonist.GetNameNoTooltip] [ROOT.Legend.Custom('GetBirthCircumstancesLegend')|U] ความยิ่งใหญ่ของ[ROOT.Legend.GetProtagonist.GetHerHis]ถูกกำหนดไว้ล่วงหน้าแล้ว"
 born_to_a_virgin_mother: "เกิดจากมารดาพรหมจรรย์"
 born_under_auspicious_stars: "เกิดภายใต้ดวงดาวอันเป็นมงคล"
 legend_chapter_motivation_sacred_birth: "[ROOT.Legend.GetProtagonist.GetFirstNameNoTooltip|U] ใช้เวลาหลายคืนนอนไม่หลับด้วยนิมิตเกี่ยวกับการเกิดของตนเอง จนกระทั่งในคืนแห่งโชคชะตา เป็น[ROOT.Legend.GetProtagonist.GetFaith.HighGodName|U]ที่ปรากฏต่อหน้า[ROOT.Legend.GetProtagonist.GetHerHim] [ROOT.Legend.GetProtagonist.GetFaith.HighGodName|U] ประกาศว่า [ROOT.Legend.GetProtagonist.GetFirstNameNoTooltip] ถูกวางไว้บนโลกเพื่อจุดประสงค์อันศักดิ์สิทธิ์ ซึ่งอยู่เหนือการเรียกร้องตามปกติของ[ROOT.Legend.GetProtagonist.GetWomanMan] ตั้งแต่วันนั้น [ROOT.Legend.GetProtagonist.GetFirstNameNoTooltip] รู้ว่าสถานการณ์การเกิดของ[ROOT.Legend.GetProtagonist.GetHerHis]ไม่ใช่ข่าวลือหรือเรื่องบังเอิญ แต่เป็นการแทรกแซงโดยตรงจาก[ROOT.Legend.GetProtagonist.GetFaith.PantheonTerm]!"
 legend_chapter_conclusion_sacred_birth: "ด้วยความสำเร็จอันยิ่งใหญ่ทั้งหมดที่ [ROOT.Legend.GetProtagonist.GetFirstNameNoTooltip] ได้ทำในนามของ[ROOT.Legend.GetProtagonist.GetFaith.PantheonTerm] [ROOT.Legend.GetProtagonist.GetSheHe] ได้รับการมาเยือนอีกครั้ง แม้ว่าครั้งนี้จะไม่ใช่เพียงความฝันหรือนิมิต [ROOT.Legend.GetProtagonist.GetFaith.HighGodName|U] ปรากฏในร่างจริงและมอบถ้วยน้ำให้ [ROOT.Legend.GetProtagonist.GetFirstNameNoTooltip] ดื่ม มอบสัมผัสแห่งความเป็นเทพให้แก่[ROOT.Legend.GetProtagonist.GetHerHim] มวลชนโห่ร้องชื่อของ[ROOT.Legend.GetProtagonist.GetFirstNamePossessiveNoTooltip|U] วิงวอนขอเพียงแค่ได้สัมผัสมืออันศักดิ์สิทธิ์และเยียวยาของ[ROOT.Legend.GetProtagonist.GetHerHis]"
 legend_chronicle_unsuspecting_opening: "[ROOT.Legend.GetProtagonist.GetNameNoTooltip|U] เกิดมาเหมือน[ROOT.Legend.GetProtagonist.GetWomanMan]ทั่วไป โดยไม่รู้ถึงความยิ่งใหญ่ที่[ROOT.Legend.GetProtagonist.GetSheHe]จะบรรลุในนามของ[ROOT.Legend.GetProtagonist.GetFaith.PantheonTerm]"
 legend_chapter_motivation_fought_devil: "ถูกทำลายด้วยฝันร้าย [ROOT.Legend.GetProtagonist.GetFirstNameNoTooltip] ถูกหลอกหลอนด้วยนิมิตของ[ROOT.Legend.GetProperty( 'faith' ).Faith.DevilName] ส่งเสียงขู่ฟ่อและทรมาน[ROOT.Legend.GetProtagonist.GetHerHim] ใน แต่ละวัน [ROOT.Legend.GetProtagonist.GetSheHe] ตื่นขึ้นจากการหลับใหลของ[ROOT.Legend.GetProtagonist.GetHerHis]ด้วยจุดมุ่งหมายที่ค้นพบใหม่และความรู้สึกว่า[ROOT.Legend.GetProtagonist.GetFaith.PantheonTerm]มีแผนการสำหรับ[ROOT.Legend.GetProtagonist.GetHerHim]"
 legend_chapter_famous_deed_fought_devil: "คืนหนึ่ง [ROOT.Legend.GetProperty( 'faith' ).Faith.DevilName|U] มาเยี่ยม [ROOT.Legend.GetProtagonist.GetFirstNameNoTooltip] พร้อมกับแส้และกลไกทรมานอันโหดร้ายทุกชนิดกระจายอยู่ทั่วผนังที่เปื้อนเลือด เปลือยกายและไม่หวั่นไหว [ROOT.Legend.GetProtagonist.GetFirstNameNoTooltip] ต่อสู้กับ[ROOT.Legend.GetProperty( 'faith' ).Faith.DevilName|U]ด้วยพละกำลังและความเชื่อมั่นของ[ROOT.Legend.GetProperty( 'faith' ).Faith.HighGodName|U]ที่เต้นอยู่ในร่างของ[ROOT.Legend.GetProtagonist.GetHerHis] ด้วย[ROOT.Legend.GetProperty( 'faith' ).Faith.DevilName|U]ที่ถูกตรึงอยู่ใต้[ROOT.Legend.GetProtagonist.GetHerHim]อย่างหมดหนทาง — สัตว์ร้ายน่าเกลียดส่งเสียงฟ่อและคำราม ความชั่วร้ายถูกขัดขวางโดยเพียง[ROOT.Legend.GetProtagonist.GetWomanMan]!"
 legend_chapter_extra_deed_fought_devil: "ไม่พอใจและเต็มไปด้วยความเกลียดชังต่อทุกสิ่งที่ดีงามและชอบธรรม [ROOT.Legend.GetProperty( 'faith' ).Faith.DevilName|U] ท้าทาย [ROOT.Legend.GetProtagonist.GetFirstNameNoTooltip] ให้แข่งขัน [ROOT.Legend.GetProtagonist.Custom('GetMusicalInstrument')] ท่วงทำนองที่ [ROOT.Legend.GetProtagonist.GetFirstNameNoTooltip] บรรเลง ทำให้[ROOT.Legend.GetProperty( 'faith' ).Faith.DevilName|U]ละลายหายไปใน[ROOT.Legend.GetProperty( 'faith' ).Faith.NegativeAfterLife|U] ท่วงทำนองนั้นเลือนหายไปจากใจของ[ROOT.Legend.GetProtagonist.GetHerHis]เหมือนควัน ไม่ต้องสงสัยเลยว่าศักดิ์สิทธิ์เกินไปสำหรับแดนมนุษย์"
 legend_chapter_conclusion_fought_devil: "เมื่อ[ROOT.Legend.GetProperty( 'faith' ).Faith.DevilName|U]พ่ายแพ้ [ROOT.Legend.GetProtagonist.GetFirstNameNoTooltip] อุทิศ[ROOT.Legend.GetProtagonist.GetHerselfHimself]ให้กับการปราบกองกำลังแห่งความชั่วร้ายในแดนมนุษย์ [ROOT.Legend.GetProtagonist.GetSheHe|U] มีรัศมีศักดิ์สิทธิ์ติดตัว[ROOT.Legend.GetProtagonist.GetHerHim]ไปตลอดชีวิตและทิ้งสันติภาพและอารยธรรมไว้เบื้องหลัง[ROOT.Legend.GetProtagonist.GetHerHis]"
 legend_chapter_famous_deed_tournament_won: "ความคิดและเสียงปะทะกันเท่าเทียมกับดาบในการแสดงศิลปะการต่อสู้อันยิ่งใหญ่ แต่ไม่มีความคิดใดฉลาดเท่าหรือดาบใดคมเท่าของ[ROOT.Legend.GetProtagonist.GetNamePossessiveNoTooltip]! ทีละคน ผู้เข้าแข่งขันเข้าแถวเพียงเพื่อถูก ทำให้ร้องไห้โดย [ROOT.Legend.GetProtagonist.GetFirstNameNoTooltip] ผู้ไม่มีใครแตะต้องได้"
 legend_chapter_extra_deed_tournament_won: "ไม่มีใครสามารถลืมความรุ่งโรจน์ของการประลองครั้งแรกของ[ROOT.Legend.GetProtagonist.GetNamePossessiveNoTooltip]ได้ แต่ชัยชนะเพียงครั้งเดียวไม่เพียงพอสำหรับ[ROOT.Legend.GetProtagonist.GetHerHim] ผู้เข้าแข่งขันคนอื่นๆ ล้อมรอบ[ROOT.Legend.GetProtagonist.GetHerHim]ในพายุแห่งดาบ แต่[ROOT.Legend.GetProtagonist.GetSheHe]ยังคงไม่หวั่นไหว [ROOT.Legend.GetProtagonist.GetSheHe|U] ได้รับชัยชนะท่ามกลางฝูงชนที่ตะโกนชื่อของ[ROOT.Legend.GetProtagonist.GetHerHis]!"
 legend_chronicle_opening_raised_by_animals: "ปราศจากอาหารหรือความหวังในการช่วยเหลือ [ROOT.Legend.GetProtagonist.GetNameNoTooltip] นอนหลงทางอยู่ข้างแม่น้ำเมื่อครั้งยังเป็นทารก จนกระทั่งแม่[ROOT.Legend.GetProperty( 'beast' ).GetFlagName]ผู้ยิ่งใหญ่พบ[ROOT.Legend.GetProtagonist.GetHerHim] นางให้นม[ROOT.Legend.GetProtagonist.GetHerHim]จากเต้านมของนาง ทำให้ทารกเติบโตเป็น[ROOT.Legend.GetProtagonist.GetWomanMan]ผู้มีพละกำลังมหาศาลพร้อมด้วยพละกำลังและความกล้าหาญทั้งหมดของ[ROOT.Legend.GetProperty( 'beast' ).GetFlagName]"
 legend_chapter_motivation_raised_by_animals: "เมื่อกลับสู่มนุษยชาติ [ROOT.Legend.GetProtagonist.GetFirstName] ค้นพบว่าความโกลาหลได้เข้าครอบงำแผ่นดิน เพื่อนบ้านทำร้ายเพื่อนบ้านเหมือน[ROOT.Legend.GetProperty( 'beast' ).GetFlagName]ทำร้ายเหยื่อ และ [ROOT.Legend.GetProtagonist.GetFirstName] รู้ว่าผู้คนของ[ROOT.Legend.GetProtagonist.GetHerHis]ต้องการผู้นำที่แข็งแกร่งเพื่อรวมฝูงไว้เบื้องหลังเป้าหมายร่วมกันของพวกเขา"
 legend_chapter_conclusion_raised_by_animals: "[ROOT.Legend.GetProtagonist.GetFirstName|U] ปกครองอย่างยุติธรรมเหมือนที่[ROOT.Legend.GetProperty( 'beast' ).GetFlagName]จะทำ แข็งแกร่งและภาคภูมิใจ แม้ว่า[ROOT.Legend.GetProtagonist.GetSheHe]จะไม่เคยเห็นแม่[ROOT.Legend.GetProperty( 'beast' ).GetFlagName]ของ[ROOT.Legend.GetProtagonist.GetHerHis]อีกเลย [ROOT.Legend.GetProtagonist.GetSheHe]ก็ไม่มีข้อสงสัยว่าผู้ส่งสารจาก[ROOT.Legend.GetProtagonist.GetFaith.PantheonTerm]นี้จะมองดูการปกครองของ[ROOT.Legend.GetProtagonist.GetHerHis]ด้วยความภาคภูมิใจอย่างยิ่ง ดินแดนยังคงเงียบสงบและสันติสุข โดยไม่มีศัตรูของ[ROOT.Legend.GetProtagonist.GetHerHis]คนใดกล้าก้าวล้ำเส้น เกรงว่าจะต้องเผชิญกับความโกรธเกรี้ยวของ[ROOT.Legend.GetProperty( 'beast' ).GetFlagName]"
 legend_chapter_extra_deed_recent_battle: "ระหว่างทางกลับบ้าน [ROOT.Legend.GetProtagonist.GetTitledFirstNameNoTooltip] ต่อสู้กับศัตรูของ[ROOT.Legend.GetProtagonist.GetHerHis]อย่างกล้าหาญ นำทัพด้วยความกล้าหาญและความสามารถทางยุทธวิธีที่ไม่มีใครเทียบได้ ด้วยดาบของ[ROOT.Legend.GetProtagonist.GetHerHis]ที่ชูสูงและความมุ่งมั่นที่ไม่สั่นคลอน เขาเป็นแรงบันดาลใจให้ได้รับชัยชนะเหนือศัตรูของ[ROOT.Legend.GetProtagonist.GetHerHis]"
 legend_chapter_extra_deed_recent_siege: "ระหว่างทางกลับบ้าน [ROOT.Legend.GetProtagonist.GetTitledFirstNameNoTooltip] นำการล้อมฐานที่มั่นของศัตรูด้วยความมุ่งมั่นที่ไม่ย่อท้อ ทำลายเมืองเหมือนแก้วที่เปราะบางที่สุด ด้วยกองกำลังของ[ROOT.Legend.GetProtagonist.GetHerHis]ที่จัดทัพและธงที่กางออก [ROOT.Legend.GetProtagonist.GetSheHe] เปิดฉากการบุกอย่างไม่หยุดยั้ง ทะลวงแนวป้องกันและคว้าชัยชนะ"
 legend_chapter_extra_deed_recent_imprisonment: "ในส่วนลึกของคุกใต้ดินที่มืดมิดที่สุด ถูกกีดกันอาหารและน้ำ ถูกล่ามโซ่และรายล้อมไปด้วยเงา [ROOT.Legend.GetProtagonist.GetTitledFirstNameNoTooltip] พบความมุ่งมั่นที่จำเป็นในการหลบหนี ด้วยฟันที่ขบแน่นและหัวใจที่ลุกโชนด้วยการต่อต้าน [ROOT.Legend.GetProtagonist.GetSheHe] วางแผนการหลบหนีของ[ROOT.Legend.GetProtagonist.GetHerHis] คืนแล้วคืนเล่า ด้วยการชักจูงอย่างมีเล่ห์เหลี่ยมและพลังแห่งเจตจำนงอันแท้จริง [ROOT.Legend.GetProtagonist.GetSheHe] ตามทางลับออกไปสู่แสงสว่างยามเช้า"
 legend_chapter_extra_deed_recent_tournament: "ระหว่างทางกลับบ้าน [ROOT.Legend.GetProtagonist.GetTitledFirstNameNoTooltip] หลงใหลในความงดงามของลานประลองอันรุ่งโรจน์ ด้วยดาบในมือและชุดเกราะที่ส่องประกายภายใต้แสงอาทิตย์ [ROOT.Legend.GetProtagonist.GetSheHe] เผชิญหน้ากับคู่ต่อสู้ที่น่าเกรงขามด้วยความมุ่งมั่นที่ไม่สั่นคลอน ผู้ชมโห่ร้อง สุภาพสตรีผู้งดงามและเด็กรับใช้ที่น่าประทับใจต่างทอดกายลงแทบเท้าของ[ROOT.Legend.GetProtagonist.GetHerHis]! ผู้ชนะ! อัศวินที่เก่งที่สุด!"
 legend_chapter_famous_deed_saintly_deed: "ท่ามกลางเสียงกระซิบแห่งความสงสัยและเงาแห่งความไม่เชื่อในหมู่ประชาชน [ROOT.Legend.GetProtagonist.GetTitledFirstNameNoTooltip] ยืนหยัดอย่างมั่นคงในศรัทธาของ[ROOT.Legend.GetProtagonist.GetHerHis] ทุกอย่างดูเหมือนจะสูญสิ้น เลือดทาทั่วสนามรบ หอกถูกปักลงบนพื้น ถูกทอดทิ้งโดยผู้ถือของมัน แต่ [ROOT.Legend.GetProtagonist.GetFirstNameNoTooltip] คุกเข่าลง ปากเต็มไปด้วยคำอธิษฐาน ดอกไม้เบ่งบานจากหอก ศัตรูทรุดตัวลงกับพื้น เมื่อได้เห็นปาฏิหาริย์"
 legend_chapter_famous_deed_holy_warrior: "เป็นผู้พิทักษ์ศรัทธาที่มั่นคงเสมอมา [ROOT.Legend.GetProtagonist.GetTitledFirstNameNoTooltip] แสดง[ROOT.Legend.GetProtagonist.GetHerselfHimself]ในฐานะวีรบุรุษที่แท้จริงในสงครามศักดิ์สิทธิ์ต่อต้านศัตรูของ[ROOT.Legend.GetProtagonist.GetFaith.HighGodName] [ROOT.Legend.GetProtagonist.GetSheHe|U] เดินทางไปยังดินแดนต่างถิ่น มุ่งมั่นที่จะฟื้นฟูสันติภาพและความเจริญรุ่งเรืองที่เทพเจ้าจอมปลอมได้พรากไปจากผู้คนที่ไม่รู้อิโหน่อิเหน่ของพวกเขา [ROOT.Legend.GetProtagonist.GetSheHe|U] แกะสลักสัญลักษณ์ของ[ROOT.Legend.GetProtagonist.GetFaith.GetNameNoTooltip]ลงบนแขนของ[ROOT.Legend.GetProtagonist.GetHerHis] เลือดไหลนองเหนือซากศพของพวกนอกรีต"
 legend_chapter_opening_legendary_battle: "ในพงศาวดารแห่งกาลเวลา มีเรื่องราวอันรุ่งโรจน์ของการต่อสู้ที่ดังก้องไปชั่วนิรันดร์ การต่อสู้ที่ [ROOT.Legend.GetProtagonist.GetTitledFirstNameNoTooltip] ยืนหยัดดุจยักษ์ใหญ่ท่ามกลางพายุแห่งสงคราม"
 legend_chapter_famous_deed_raised_by_animals: "ใน แต่ละวันที่ผ่านไป [ROOT.Legend.GetProtagonist.GetTitledFirstNameNoTooltip] เติบโตขึ้นในด้านพละกำลังและสติปัญญา ไม่ถูกครอบงำโดยความป่าเถื่อนของอารยธรรม เช่นเดียวกับผู้ก่อตั้งกรุงโรม [ROOT.Legend.GetProtagonist.GetFirstNameNoTooltip] โอบกอดโลกที่ให้ชีวิตแก่[ROOT.Legend.GetProtagonist.GetHerHim]และสอนชาวบ้านถึงความเชี่ยวชาญในการล่า สังหาร[ROOT.Legend.GetProtagonist.Custom('RegionalFerociousAnimal')]สีขาว"
 legend_chapter_conclusion_dead_loved_spouse: "เมื่อ [ROOT.Legend.GetProtagonist.GetTitledFirstNameNoTooltip] กลับถึงบ้าน หัวใจของ[ROOT.Legend.GetProtagonist.GetHerHis]รู้สึกเหมือนนกพิราบตัวน้อย กำลังจะโบยบินออกจากอกของ[ROOT.Legend.GetProtagonist.GetHerHis] เต็มไปด้วยอารมณ์ [ROOT.Legend.GetProtagonist.GetSheHe] รอไม่ไหวที่จะได้กลับมาพบกับรักแท้ของ[ROOT.Legend.GetProtagonist.GetHerHis] เสียงกรีดร้องอันน่าสะพรึงกลัว ความโศกเศร้าปกคลุมห้องโถงของปราสาท เพราะริมฝีปากซีดเซียวของคู่ครองของ[ROOT.Legend.GetProtagonist.GetHerHis]ไร้ ซึ่งชีวิต ในความเงียบสงัดแห่งความโดดเดี่ยวของ[ROOT.Legend.GetProtagonist.GetHerHis] ความทรงจำถึงความรักที่จุดไฟในใจของ[ROOT.Legend.GetProtagonist.GetHerHis]เติมเต็ม[ROOT.Legend.GetProtagonist.GetHerHim]ด้วยความเจ็บปวดอันแสนสาหัส ตำนานของ[ROOT.Legend.GetProtagonist.GetHerHis]จะมีค่าอะไร หาก[ROOT.Legend.GetProtagonist.GetSheHe]ไม่มีใครที่จะแบ่งปันด้วย?"
 legend_chapter_conclusion_point_of_interest: "ในการเดินทางอันกว้างใหญ่ของ[ROOT.Legend.GetProtagonist.GetTitledFirstNamePossessiveNoTooltip] [ROOT.Legend.GetProtagonist.GetSheHe] สะดุดกับสิ่งมหัศจรรย์อันน่าทึ่งที่ท้าทายขอบเขตของโลก — สถานที่ ซึ่งความงามของธรรมชาติผสมผสานอย่างลงตัวกับความเฉลียวฉลาดของมนุษย์ ยอดแหลมสูงตระหง่านของงานฝีมืออันประณีตเอื้อมไปสู่สวรรค์ รูปทรงอันสง่างามของมันอาบไล้ด้วยแสงอ่อนๆ ของรุ่งอรุณแรก [ROOT.Legend.GetProtagonist.GetFirstNameNoTooltip] สูดหายใจลึกๆ เพราะ[ROOT.Legend.GetProtagonist.GetSheHe]ไม่สามารถปรารถนาจุดจบที่ดีกว่านี้ได้"
 legend_chapter_motivation_child_mother: "ในทางเดินอันเงียบสงบของปราสาท ที่ ซึ่งเงาทอดตัวร่ายรำบนกำแพงหินและเสียงกระซิบของนิทานโบราณยังคงอบอวลอยู่ในอากาศ [ROOT.Legend.GetProtagonist.GetTitledFirstNameNoTooltip] อุ้มทารกแรกเกิดของ[ROOT.Legend.GetProtagonist.GetHerHis]ไว้ในอ้อมกอดอันอ่อนโยน ขณะที่[ROOT.Legend.GetProtagonist.GetSheHe]จ้องมองเข้าไปในดวงตาอันไร้เดียงสาของทารก หัวใจของ[ROOT.Legend.GetProtagonist.GetHerHis]ก็ลุกโชนด้วยความมุ่งมั่น มรดกใดที่[ROOT.Legend.GetProtagonist.GetSheHe]จะทิ้งไว้เบื้องหลัง? [ROOT.Legend.GetProtagonist.GetSheHe]ต้องการที่จะถูกจดจำในฐานะคนขี้ขลาด หลบภัยอยู่ท่ามกลางผ้าไหมและดอกไม้หรือไม่?"
 legend_chapter_motivation_child_father: "ในห้องอันเคร่งขรึมของบ้านบรรพบุรุษของ[ROOT.Legend.GetProtagonist.GetHerHis] ที่ ซึ่งแสงเทียนริบหรี่ทอดเงาลงบนพรมโบราณ [ROOT.Legend.GetProtagonist.GetTitledFirstNameNoTooltip] มองดูด้วยความเกรงขามถึงปาฏิหาริย์แห่งชีวิตที่ประทานแก่[ROOT.Legend.GetProtagonist.GetHerHim] ความมุ่งมั่นที่จะปกป้องมรดกของ[ROOT.Legend.GetProtagonist.GetHerHis]ได้ถือกำเนิดขึ้นพร้อมกับเด็กคนนั้น"
 legend_chapter_opening_witch: "ความสนใจในศาสตร์ลี้ลับของ[ROOT.Legend.GetProtagonist.GetTitledFirstNamePossessiveNoTooltip]ก่อให้เกิดความสงสัยมาโดยตลอด ข้อกล่าวหาเรื่องคาถาอาคมและเวทมนตร์หมุนวนอยู่รอบตัว[ROOT.Legend.GetProtagonist.GetHerHim] ทอดเงาดำมืดลงบนชื่อเสียงอันเคยรุ่งโรจน์ของ[ROOT.Legend.GetProtagonist.GetHerHis] ขณะที่อาสาสมัครผู้ภักดีของ[ROOT.Legend.GetProtagonist.GetHerHis]หันมาติดตามทุกย่างก้าวของ[ROOT.Legend.GetProtagonist.GetHerHis] [ROOT.Legend.GetProtagonist.GetSheHe] รู้สึกถึงน้ำหนักของความไม่ไว้วางใจที่กดทับ[ROOT.Legend.GetProtagonist.GetHerHim]"
 legend_chapter_motivation_celibacy: "ครั้งหนึ่งเคยประดับประดาด้วยเครื่อง แต่งกายของราชวงศ์ [ROOT.Legend.GetProtagonist.GetTitledFirstNameNoTooltip] ยืนอยู่ในชุดคลุมอันสมถะของ[ROOT.Legend.GetProtagonist.GetFaith.PriestNeuter] ถูกถอดเปลือยจากมงกุฎของ[ROOT.Legend.GetProtagonist.GetHerHis] แต่[ROOT.Legend.GetProtagonist.GetSheHe]ไม่เคยลืม[ROOT.Legend.GetProtagonist.GetFaith.HighGodName] เพราะความศรัทธาของ[ROOT.Legend.GetProtagonist.GetHerHis]ยิ่งลุกโชน สว่างไสว และเป็นนิรันดร์ ด้วยแรงบันดาลใจจากสวรรค์ที่เต้นอยู่ใน[ROOT.Legend.GetProtagonist.GetHerHim] [ROOT.Legend.GetProtagonist.GetFirstNameNoTooltip] ตั้งปณิธานที่จะสร้างเส้นทางที่จะ ทำให้ชื่อของ[ROOT.Legend.GetProtagonist.GetHerHis]เป็นอมตะตลอดไป"
 legend_chapter_opening_new_culture: "[ROOT.Legend.GetProtagonist.GetTitledFirstNameNoTooltip] เกิดเมื่อประเพณีเก่าแก่กลายเป็นสิ่งล้าสมัย ด้วยวิสัยทัศน์ในใจของ[ROOT.Legend.GetProtagonist.GetHerHis] [ROOT.Legend.GetProtagonist.GetSheHe] ตัดสินใจที่จะสร้างประเพณีของ[ROOT.Legend.GetProtagonist.GetHerHis]เอง — จึงสร้างวัฒนธรรม [ROOT.Legend.GetProtagonist.GetCulture.GetNameNoTooltip] ขึ้น"
 legend_chapter_opening_new_faith_generic: "[ROOT.Legend.GetProtagonist.GetNameNoTooltip|U] เกิดเมื่อศาสนาได้ตกต่ำลงไปไกลจากพระประสงค์ของ[ROOT.Legend.GetProtagonist.GetFaith.GetNameNoTooltip] นักเทศน์สนับสนุนลัทธินอกรีตในนามของ[ROOT.Legend.GetProtagonist.GetFaith.HighGodNamePossessive]ขณะที่ศรัทธาผุพังและถูกทอดทิ้ง ผู้คนหันไปนับถือศาสนาอื่น เปิดทางให้คู่แข่งของ[ROOT.Legend.GetProtagonist.GetFaith.HighGodNamePossessive]พิชิตใจมนุษย์"
