 game_concept_legend: "ตำนาน"
 game_concept_legend_i: "@legend_icon!"
 game_concept_legend_desc: "$game_concept_legend$ แสดงถึงการกระทำอันสำคัญที่ตัวละครได้บรรลุในชีวิต และถูกสร้างขึ้นจาก [legend_seeds|E]\n\nตำนานเป็นหนทางอันทรงพลังในการได้รับ[legitimacy|E] และรางวัลอื่นๆ ที่เป็นไปได้ เช่น การเพิ่ม[skill|E] โบนัส[opinion|E] [dynasty_prestige|E] [prestige|E] หรือ [piety|E] [baronies|E] ที่ $game_concept_legend$ ได้แพร่กระจายไปอาจได้รับผลกระทบเพิ่มเติม หากถูกครอบครองโดยเจ้าของ $game_concept_legend$ หรือ [legend_promoter|E]\n\n$game_concept_legends$ มี [legend_type|E] ที่ควบคุมรางวัลเหล่านั้น: อาจเป็นประเภทเสริมสร้างความชอบธรรม (Legitimizing), ศักดิ์สิทธิ์ (Holy) หรือวีรกรรม (Heroic) แต่ละ $game_concept_legend$ ยังมีระดับ [legend_quality|E] ซึ่งมีอิทธิพลต่อความแข็งแกร่งของรางวัลเหล่านั้น รวมถึงการแพร่กระจายด้วย"
 game_concept_owned_legend: "ตำนานที่ครอบครอง"
 game_concept_owning_legend: "การครอบครองตำนาน"
 game_concept_owned_legend_desc: "$game_concept_owned_legend$ คือ [legend|E] ที่ถูกครอบครองโดย [ruler|E] ซึ่งเป็นผู้ได้รับผลประโยชน์หลักจากผลกระทบของมัน\n\nเจ้าของ $game_concept_legend$ อาจเป็น [legend_protagonist|E] ของตำนานนั้น แต่ไม่จำเป็นเสมอไป\n\n$game_concept_legend$ ยังสามารถได้รับการสนับสนุนจาก [legend_promoters|E] ซึ่งจ่ายค่าสนับสนุนรายเดือนเพื่อรับส่วนแบ่งของโบนัสด้วย"
 game_concept_owning_legend_desc: "$game_concept_owned_legend_desc$"
 game_concept_promoted_legend: "ตำนานที่ส่งเสริม"
 game_concept_promoted_legend_desc: "$game_concept_promoted_legend$ คือ [legend|E] ที่ถูกครอบครองโดย [ruler|E] อื่น ซึ่งกำลังได้รับการสนับสนุนจาก [legend_promoters|E] ผู้จ่ายค่าสนับสนุนรายเดือนเพื่อรับส่วนแบ่งของโบนัสด้วย"
 game_concept_promoting_legend: "การส่งเสริม"
 game_concept_promoting_legend_desc: "$game_concept_promoting_legend$"
 game_concept_legend_promoter: "ผู้ส่งเสริมตำนาน"
 game_concept_legend_promoter_desc: "$game_concept_legend_promoter$ คือ [ruler|E] ที่สนับสนุน [legend|E] ของผู้ปกครองอื่น\n\n$game_concept_legend_promoter$ จะได้รับโบนัสเพิ่มเติม ซึ่งแตกต่างกันไปขึ้นอยู่กับ [legend_type|E] และ [legend_quality|E] ของ $game_concept_legend$ เพื่อแลกกับการจ่ายค่าสนับสนุนเป็น[gold|E]รายเดือน"
 game_concept_legend_promoters: "ผู้ส่งเสริมตำนาน"
 game_concept_legend_promoters_desc: "$game_concept_legend_promoter_desc$"
 game_concept_legends: "ตำนาน"
 game_concept_legends_desc: "$game_concept_legend_desc$"
 game_concept_legend_seed: "เค้าตำนาน"
 game_concept_legend_seed_desc: "[legend|E] ที่กำลังก่อตัว $game_concept_legend_seeds$ เป็นพื้นฐานของ $game_concept_legend$ และโดยการก่อตั้งมัน [ruler|E] อาจเริ่มต้น $game_concept_legend$ ได้\n\n$game_concept_legend_seeds$ สามารถได้รับจากการบรรลุเกณฑ์บางอย่าง เช่น การเป็นทายาทของชาร์เลอมาญ หรือโดยการกระทำอันเป็นตำนาน: [decisions|E] สำคัญ การชนะ [great_holy_war|E] การเป็น [king|E] หรือ [emperor|E] การจัด [activity|E] ใหญ่ การล่าสัตว์ในตำนาน เป็นต้น\n\n$game_concept_legend_seeds$ ที่ไม่ได้ใช้งานไม่มีค่าใช้จ่าย แต่ก็ไม่มีผลกระทบ การก่อตั้ง $game_concept_legend_seed$ เป็นครั้งแรกมีค่าใช้จ่ายเป็น[gold|E]"
 game_concept_legend_seeds: "เค้าตำนาน"
 game_concept_legend_seeds_desc: "$game_concept_legend_seed_desc$"
 game_concept_legend_quality: "คุณภาพตำนาน"
 game_concept_legend_quality_desc: "คุณภาพของ [legend|E] บ่งบอกถึงทั้งความแข็งแกร่งของผลกระทบและขอบเขตการแพร่กระจายของมัน รวมถึงส่งผลต่อรางวัลสุดท้ายด้วย $game_concept_legends$ สามารถเป็นระดับชื่อเสียง (Famed), รุ่งโรจน์ (Illustrious) หรือดุจเทพนิยาย (Mythical) — เพราะไม่มีสิ่งใดที่เป็น $game_concept_legend$ ธรรมดา\n\nคุณภาพสามารถเพิ่มขึ้นได้โดยการแพร่กระจายตำนานไปยัง [baronies|E] มากขึ้นและจ่ายค่าอัปเกรด\n\nเมื่อเจ้าของ $game_concept_legend$ เสียชีวิต ครอบครัวของพวกเขาสามารถสานต่อได้ โดยไม่กระทบต่อคุณภาพของมัน"
 game_concept_legend_famed: "ชื่อเสียง"
 game_concept_legend_famed_desc: "$game_concept_legend_quality_desc$"
 game_concept_legend_illustrious: "รุ่งโรจน์"
 game_concept_legend_illustrious_desc: "$game_concept_legend_quality_desc$"
 game_concept_legend_mythical: "ดุจเทพนิยาย"
 game_concept_legend_mythical_desc: "$game_concept_legend_quality_desc$"
 game_concept_legend_protagonist: "ตัวเอกตำนาน"
 game_concept_legend_protagonist_desc: "$game_concept_legend_protagonist$ คือตัวละครหลักของ [legend|E] ซึ่งการกระทำของพวกเขาถูกบรรยายไว้ในนั้น เจ้าของ $game_concept_legend$ อาจเป็น $game_concept_legend_protagonist$ ด้วยก็ได้ แต่ก็อาจเป็นสมาชิกคนใดก็ได้ในครอบครัวของพวกเขา — ไม่ว่าจะมีชีวิตอยู่หรือเสียชีวิตไปแล้ว ตราบใดที่พวกเขามีอายุ 16 ปี\n\n$game_concept_legend_protagonists$ ไม่ได้รับโบนัสพิเศษโดยตรง แต่เนื้อหาเกี่ยวกับ $game_concept_legend$ จะมุ่งเน้นไปที่พวกเขา อย่างไรก็ตาม พวกเขาจะมอบ #color_white เพิ่มเติม#! [legitimacy|E] ให้กับเจ้าของตำนาน โดยพิจารณาจากจำนวน [virtuous|E] [traits|E] ที่พวกเขามี\n\n$game_concept_legend_protagonist$ ต้องเป็นผู้ใหญ่ เพราะการกล่าวว่าทารกสังหารมังกรอาจเป็นเรื่องที่น่ากังขา"
 game_concept_legend_protagonists: "ตัวเอกตำนาน"
 game_concept_legend_protagonists_desc: "$game_concept_legend_protagonist_desc$"
 game_concept_legend_type: "ประเภทตำนาน"
 game_concept_legend_types: "ประเภทตำนาน"
 game_concept_legend_types_desc: "$game_concept_legend_type_desc$"
 game_concept_legend_type_desc: "[legend|E] มีประเภทที่ส่งผลต่อหมวดหมู่ของผลกระทบที่จะมอบให้ รวมถึงธีมของเนื้อหาด้วย\n\n$game_concept_legend_types$ ได้แก่ เสริมสร้างความชอบธรรม (Legitimizing), วีรกรรม (Heroic) และศักดิ์สิทธิ์ (Holy) ซึ่งมอบ [legitimacy|E], [prestige|E] และ [piety|E] ตามลำดับ"
 game_concept_legend_heroic: "ตำนานวีรกรรม"
 game_concept_legend_heroic_desc: "$game_concept_legend_type_desc$"
 game_concept_legend_holy: "ตำนานศักดิ์สิทธิ์"
 game_concept_legend_holy_desc: "$game_concept_legend_type_desc$"
 game_concept_legend_legitimizing: "ตำนานเสริมสร้างความชอบธรรม"
 game_concept_legend_legitimizing_desc: "$game_concept_legend_type_desc$"
 game_concept_legend_library: "หอตำนาน"
 game_concept_legend_library_i: "@legend_icon!"
 game_concept_legend_library_desc: "[legend_library|E] เก็บรักษา [legends|E] ที่เสร็จสมบูรณ์แล้ว ซึ่งแพร่กระจายมายัง [domain|E] ของท่าน ที่ท่านสร้างขึ้น หรือที่ท่านกำลังส่งเสริมอยู่\nท่านยังสามารถเพิ่ม [legends|E] ที่เสร็จสมบูรณ์แล้วได้หากท่านกำลังเดินทางผ่านพื้นที่แพร่กระจายของตำนานนั้น\n\nท่านสามารถลบ [legends|E] ออกจากหอตำนานของท่านได้ตามต้องการ"

 game_concept_ancestral_claim: "สิทธิ์เรียกร้องจากบรรพชน"
 game_concept_ancestral_claim_desc: "[casus_belli|E] สิทธิ์เรียกร้องจากบรรพชน ช่วยให้ท่านสามารถผนวกดินแดนทั้งหมดภายในตำแหน่งยศที่ท่านมีสิทธิ์เรียกร้อง ซึ่งได้รับผ่าน [legend|E] ประเภทเสริมสร้างความชอบธรรม"

 legend_heroic: "ตำนานวีรกรรม"
 legend_heroic_name: "ตำนานแห่ง [ROOT.Legend.GetOwner.GetNameNoTooltip]"
 legend_heroic_desc: "[ROOT.Legend.GetOwner.GetTitledFirstNameNoTooltip] มีชื่อเสียงเลื่องลือในด้านวีรกรรมของ[ROOT.Legend.GetOwner.GetHerHis]"
 legend_legitimizing: "ตำนานเสริมสร้างความชอบธรรม"
 legend_legitimizing_name: "พงศาวลีแห่ง [ROOT.Legend.GetOwner.GetNameNoTooltip]"
 legend_legitimizing_desc: "เชื้อสายแห่งราชวงศ์ [ROOT.Legend.GetOwner.GetDynasty.GetBaseNameNoTooltip] ได้ปกครองดินแดนเหล่านี้มานานหลายศตวรรษ"
 legend_holy: "ตำนานศักดิ์สิทธิ์"
 legend_holy_name: "ปาฏิหาริย์แห่ง [ROOT.Legend.GetOwner.GetNameNoTooltip]"
 legend_holy_desc: "ความศักดิ์สิทธิ์ที่ [ROOT.Legend.GetOwner.GetTitledFirstNameNoTooltip] แสดงออกมานั้นเป็นที่ชื่นชมของผู้ติดตาม [ROOT.Char.GetFaith.HighGodName] ทุกคน"

 legend_king_arthur: "มรดกแห่งอาเธอร์ เพนดรากอน"
 legend_king_arthur_desc: "กษัตริย์ผู้เคยอยู่และจะกลับมาในอนาคต ยังคงสืบเชื้อสายผ่านราชวงศ์นี้"
 legend_carolingian: "ทายาทแห่งชาร์เลอมาญ"
 legend_carolingian_desc: "มหาราชชาร์เลอมาญเคยปกครองดินแดนนี้มาก่อนราชวงศ์นี้ ซึ่งอ้างว่าเป็นผู้สืบเชื้อสายโดยตรงจากสายเลือดจักรพรรดิของพระองค์"
 legend_holy_warrior: "กำปั้นศักดิ์สิทธิ์"
 legend_holy_warrior_desc: "นักรบศักดิ์สิทธิ์ผู้ยิ่งใหญ่ วีรบุรุษผู้นี้ได้ต่อสู้อย่างกล้าหาญเพื่อศรัทธาของตน"
 legend_chapter_opening_holy_warrior: "นักรบผู้ยิ่งใหญ่แห่ง [religion.GetNameNoTooltip] ตำนานของ [ROOT.Legend.GetProtagonist.GetTitledFirstNameNoTooltip] เริ่มต้นด้วยการกำเนิดอันเป็นมงคล ตั้งแต่วัยเยาว์ [ROOT.Legend.GetProtagonist.GetSheHe] รู้สึกถึงเสียงเรียกของ [ROOT.Legend.GetProtagonist.GetFaith.HighGodName]"
 legend_el_cid: "บทเพลงแห่งเอลซิด"
 legend_el_cid_desc: "โรดริโก ดิอัซ เด บิบาร์ ครั้งหนึ่งเคยเป็นขุนนางชั้นผู้น้อยที่ไร้เกียรติ บัดนี้ได้กลายเป็นกษัตริย์ด้วยตนเอง"
 legend_alfred_of_wessex: "กษัตริย์ศักดิ์สิทธิ์"
 legend_alfred_of_wessex_desc: "[ancestor.GetNameNoTooltip|U] ต้านทานการรุกรานของชาวเหนือในอังกฤษ และยืนหยัดเป็นปราการและผู้เผยแผ่ศาสนาคริสต์"
 legend_sons_of_david: "ทายาทแห่งดาวิด"
 legend_sons_of_david_desc: "ดาวิด กษัตริย์แห่งอิสราเอล ได้รับการ แต่งตั้งจากพระเจ้า และสายเลือดของพระองค์ไหลเวียนอยู่ในเส้นเลือดของชาว [GetDynastyHouseByID('house_bagrationi').GetNameNoTooltip] ทุกคน"
 legend_peasant_emperor: "จากชาวนาสู่บาซิเลอุส"
 legend_peasant_emperor_desc: "เบซิลเกิดมาเป็นชาวนาและเข้ารับใช้จักรพรรดิ ก่อนที่จะอภิเษกสมรสกับธิดาของพระองค์และขึ้นสู่ตำแหน่งบาซิเลอุสด้วยตนเอง"
 legend_the_wheelwright: "ห้องเก็บของแห่งความอุดมสมบูรณ์"
 legend_the_wheelwright_desc: "ในวันเกิดครบรอบเจ็ดขวบของบุตรชาย ปิอาสต์ ช่างทำล้อ ได้รับการมาเยือนจากคนแปลกหน้าสองคน เพื่อเป็นการขอบคุณในความมีน้ำใจ คนแปลกหน้าได้ร่ายมนตร์ ทำให้ห้องเก็บของของปิอาสต์เต็มตลอดกาล"
 legend_vercingetorix: "ทายาทแห่งแวร์แซ็งเฌทอริกซ์"
 legend_vercingetorix_desc: "แวร์แซ็งเฌทอริกซ์เคยรวมเผ่ากอลล์ในการกบฏต่อต้านการรุกรานของโรมัน แม้ว่าเขาจะพ่ายแพ้แก่ซีซาร์ แต่จิตวิญญาณเคลต์ของเขายังคงอยู่ในสายเลือดของเรา"
 legend_saman_khudah: "ผู้สืบเชื้อสายแห่งบาห์ราม โชบิน"
 legend_saman_khudah_desc: "แม่ทัพ ผู้พิชิต และผู้แย่งชิงบัลลังก์ บาห์ราม โชบิน ได้ยึดบัลลังก์ซาเซเนียนมาเป็นของตน และสายเลือดวีรบุรุษของเขาไหลเวียนอยู่ในเส้นเลือดของเรา"
 legend_bahram_gur: "เชื้อสายกูร์"
 legend_bahram_gur_desc: "บาห์ราม กูร์ เป็นกษัตริย์นักรบผู้ยิ่งใหญ่ที่ต่อสู้และต้านทานผู้รุกรานนับไม่ถ้วน สายเลือดของเขาไหลเวียนอยู่ในเส้นเลือดของเรา ทำให้เราเป็นวีรบุรุษชาวเปอร์เซีย"
 bahram_gur: "บาห์ราม กูร์"
 legend_cadell: "สายเลือดแห่งคาเดลล์"
 legend_cadell_desc: "คาเดลล์เริ่มต้นชีวิตในฐานะทาสเด็กชาย และด้วยพรจากนักบุญที่ประทานให้ เขาได้ต่อสู้แย่งชิงอาณาจักรโพวีสมาจากวอร์ติเกิร์น"
 legend_descendants_of_brahman: "สายเลือดแห่งพระพรหม"
 legend_descendants_of_brahman_desc: "เราคือบุตรธิดาแห่งทวยเทพ พระพรหม พระวิษณุ สายเลือดของเราสามารถสืบย้อนไปถึงจุดเริ่มต้นของกาลเวลา"
 legend_gothic_kings: "กษัตริย์กอท"
 legend_gothic_kings_desc: "ชาวกอทนำมา ซึ่งการล่มสลายของโรมและก่อตั้งอาณาจักรของเรา เราคือทายาทของพวกเขา กษัตริย์และราชินีแห่งชาวกอท"
 legend_sons_of_rurik: "บุตรแห่งรูริค"
 legend_sons_of_rurik_desc: "เจ้าชายวารันเจียน รูริค นำกองทัพนักผจญภัยของเขาไปทางตะวันออกและสถาปนาอาณาจักรอันยิ่งใหญ่แห่งนอฟโกรอด เป็นสายเลือดในตำนานของเขาที่ไหลเวียนอยู่ในเส้นเลือดของเรา"
 legend_william_gellones: "ลา พรีซ ดอรองช์"
 legend_william_gellones_desc: "ผู้พิชิตกองทัพอิสลามในออรองช์ กีโยม เฌลโลน เป็นนักรบเพื่อศาสนาคริสต์และก่อตั้งอารามในเฌลโลน ซึ่งต่อมาเขาได้สละราชสมบัติเพื่อบวชเป็นพระและจำพรรษาที่นั่น"
 legend_edward_the_martyr: "เอ็ดเวิร์ด ผู้พลีชีพ"
 legend_edward_the_martyr_desc: "ถูกสังหารและฝังโดยปราศจากเกียรติยศ ร่างของเอ็ดเวิร์ด ผู้พลีชีพ ถูกพบว่าไม่เน่าเปื่อยหลังจากผ่านไปหนึ่งปี กล่าวกันว่าเขายอมรับความตายของตนเองด้วยความรักอันลึกซึ้งต่อพระคริสต์"
 legend_yazdagird_iii: "สายเลือดแห่ง [ancestor.GetFirstNameNoTooltip] ที่ 3"
 legend_yazdagird_iii_desc: "สายเลือดของชาห์ซาเซเนียนองค์สุดท้ายไหลเวียนอยู่ในเส้นเลือดของเรา แม้ว่า [ancestor.GetSheHe] จะถูกล้อมโดยชาวเติร์ก คาซาร์ และผู้รุกรานชาวอาหรับจากทุกทิศทาง [ancestor.GetSheHe] ยังคงภักดีต่อเปอร์เซียจนลมหายใจสุดท้ายของ[ancestor.GetHerHis]"
 legend_afrasiyab: "กษัตริย์แห่งตูราน: อฟราซิยาบ"
 legend_afrasiyab_desc: "กษัตริย์ผู้ยิ่งใหญ่แห่งตูรานและวีรบุรุษของชาวเติร์ก อฟราซิยาบเป็นศัตรูคู่อาฆาตของจักรวรรดิเปอร์เซียและเป็นกษัตริย์ที่ยิ่งใหญ่ที่สุดของตูราน สายเลือดอันน่าอัศจรรย์ของเขาไหลเวียนอยู่ในเส้นเลือดของเราและมอบสิทธิ์อันศักดิ์สิทธิ์ให้เราปกครองตูรานอีกครั้ง"
 legend_sceafa: "เชฟา หลานของโนอาห์"
 legend_sceafa_desc: "กษัตริย์ลอมบาร์ดโบราณ เชฟา คลานขึ้นมาจากทะเลเมื่อครั้งยังเป็นเด็กและได้ปกครองอังกฤษ เรารู้ว่าเขาเป็นหลานของโนอาห์ และจากเขาที่เราได้รับสายเลือดอันศักดิ์สิทธิ์"
 legend_new_troy_london: "ทรอยใหม่"
 legend_new_troy_london_desc: "บรูตัส ผู้ถูกเนรเทศจากทรอย ได้รับการนำทางโดยไดอาน่ามายังอัลเบียน หลังจากเอาชนะยักษ์ใหญ่ที่ครอบครองดินแดน เขาได้ก่อตั้ง โทรเอีย โนวา เมืองที่เรารู้จักกันในนามลอนดอนในปัจจุบัน"
 legend_corineus: "ลำนำแห่งคอรีเนอุส"
 legend_corineus_desc: "คอรีเนอุส นักรบโทรจันโบราณ เป็นผู้ก่อตั้งดั้งเดิมของคอร์นวอลล์ เขามายังบริทานเนียและสังหารยักษ์ที่ครอบครองพื้นที่และตั้งชื่อสถานที่ว่าคอร์นวอลล์ตามชื่อของเขาเอง"
 legend_scota: "บุตรแห่งสโกตา"
 legend_scota_desc: "จากสโกตา ธิดาของฟาโรห์อียิปต์ผู้ยิ่งใหญ่ ที่เราเรียกดินแดนของเราว่า "สกอตแลนด์" นางคือมารดาของชาวสกอตทุกคน และเป็นสายเลือดของฟาโรห์โบราณที่ไหลเวียนอยู่ในเส้นเลือดของเรา"
 legend_pyusawhti: "ทายาทแห่งเทพธิดามังกร"
 legend_pyusawhti_desc: "เกิดจากครรภ์ของเทพธิดามังกร และสืบเชื้อสายมาจากพระเจ้ามหาสมมติราช เรามีสายเลือดอันศักดิ์สิทธิ์และทรงพลังที่สุดสืบทอดมาในสายตระกูลของเรา"
 legend_tosny: "อัศวินหงส์"
 legend_tosny_desc: "โรเฌ เดอ โทสนี ผู้ยิ่งใหญ่ สืบเชื้อสายมาจากอัศวินหงส์ และเราสวมตราหงส์มาจนถึงทุกวันนี้เพื่อเป็นเกียรติแก่ตำนานของเขา"
 legend_menelik_i: "บุตรแห่งดาวิด"
 legend_menelik_i_desc: "ผู้ก่อตั้งราชวงศ์ของเรา เมเนลิกที่ 1 เป็นผลผลิตจากความรักระหว่างโซโลมอนแห่งอิสราเอลและราชินีแห่งชีบา"
 legend_kings_of_semien: "กษัตริย์แห่งเซเมียน"
 legend_kings_of_semien_desc: "เบตา อิสราเอล คืออาณาจักรยิวในตำนานที่ยังคงต่อต้านการเปลี่ยนมานับถือศาสนาคริสต์อย่างแข็งขัน เราสืบเชื้อสายมาจากเผ่าดานที่หลบหนีออกจากอิสราเอลในช่วงสงครามกลางเมืองระหว่างกองกำลังของเรโหโบอัมและเยโรโบอัม"
 legend_roman_heritage: "มรดกโรมัน"
 legend_roman_heritage_desc: "ครอบครัวของเราไม่เพียง แต่ปกครองในจักรวรรดิโรมันสมัยใหม่ เรายังเป็นข้าราชสำนักผู้มีอิทธิพลในโรมตั้งแต่สมัยสาธารณรัฐ"
 legend_hunnic_heritage: "มรดกฮัน"
 legend_hunnic_heritage_desc: "ผู้คนของเราสามารถสืบเชื้อสายย้อนกลับไปถึงตระกูลของชาวฮัน และผู้ก่อตั้งราชวงศ์ของเราคืออัตติลาผู้ดุร้ายที่ ทำให้โรมต้องคุกเข่า"
 legend_premysl: "เปรมิเซิล คนไถนา"
 legend_premysl_desc: "บรรพบุรุษของเราเริ่มต้นชีวิตในฐานะชาวนาธรรมดาในหมู่บ้านสตาดีเซ แต่ไม่นานเขาก็เป็นที่ต้องตาของลิบูเชและอภิเษกสมรสกับนางเพื่อเป็นเจ้าชายแห่งชาวเช็ก"
 legend_borjigin: "ผู้มาเยือนอันแวววาว"
 legend_borjigin_desc: "อลัน กัว มารดาของชาว [GetDynastyByID('11100').GetNameNoTooltip] ทุกคน ได้รับการมาเยือนจากร่างอันแวววาวแปลกประหลาดทุกวันทุกคืน ดุจสุนัขสีเหลืองตัวใหญ่ เขาคลานเข้ามาในกระโจมของนางผ่านแสงจันทร์ในเวลากลางคืนและแสงอาทิตย์ในเวลากลางวัน และมอบบุตรชายสามคนให้แก่นาง นางเตือนบุตรชายที่เกิดจากเทพเจ้าว่าพวกเขาต้องสามัคคีกันเหมือนลูกธนูห้าดอกรวมกัน มิฉะนั้นจะถูกหักเหมือนลูกธนูห้าดอกที่อยู่โดดเดี่ยว"
 legend_naga_descent: "สายเลือดแห่งนาค"
 legend_naga_descent_desc: "นาคเป็นสิ่งมีชีวิตครึ่งมนุษย์ครึ่งงูอันศักดิ์สิทธิ์ที่อาศัยอยู่ในบาดาล และบางครั้งสามารถข้ามมายังโลกของเราในร่างมนุษย์เต็มตัวได้ ครอบครัวของเราสามารถสืบเชื้อสายย้อนกลับไปถึงนาคตนหนึ่งที่เคยมาเยือนแคชเมียร์และสมสู่กับมนุษย์"
 legend_hieros_gamos_skirnismal: "ฮิเอรอส กามอส"
 legend_hieros_gamos_skirnismal_desc: "ฟยอลเนียร์ ผู้ก่อตั้งราชวงศ์อิงลิง เกิดจากครรภ์ของแกร์ดร์ในความรักของนางที่มีต่อเฟรย์ ใครเล่าจะครอบครองสายเลือดอันศักดิ์สิทธิ์ที่จำเป็นต่อการปกครองนอร์เวย์ได้นอกจากลูกหลานของฟยอลเนียร์?"
 legend_shibi_chakravarti: "ท้าวสิพี จักรวรรติ"
 legend_shibi_chakravarti_desc: "แบบอย่างแห่งความอ่อนน้อมถ่อมตนและความศรัทธา กษัตริย์สิพีผู้กล้าหาญได้รับมอบหมายให้ปกป้องฤๅษีอัคนี ซึ่งแปลงร่างเป็นนก เมื่อเหยี่ยวเรียกร้องให้เขาสละเนื้อของตนเองเพื่อช่วยนกพิราบ ท้าวสิพีได้มอบทั้งร่างของตนด้วยความเต็มใจ แต่ได้รับการไว้ชีวิตและได้รับรางวัลเป็นบุตรชาย กโปตโรมา เป็นสายเลือดของกษัตริย์ผู้เสียสละผู้นี้ที่ไหลเวียนอยู่ในเส้นเลือดของชาว [GetDynastyByID('1043008').GetNameNoTooltip] ทุกคน"
 legend_magi: "เหล่าบุตรแห่งโหราจารย์"
 legend_magi_desc: "หลังจากพระเยซูประสูติ เหล่าโหราจารย์ในพระคัมภีร์ได้มาเข้าเฝ้าพระองค์ พร้อมถวายเครื่องบรรณาการอันได้แก่ ทองคำ กำยาน และมดยอบ พระกิตติคุณมัทธิวระบุว่า ปราชญ์ทั้งสามได้เดินทางมาจากทิศตะวันออก\nนักเดินทางชาวตะวันตกผู้เข้าใจผิดอาจระบุว่าการปรากฏของดวงดาวแห่งเบธเลเฮมนั้นเกิดขึ้น ณ เมืองซาบาแห่งเปอร์เซีย\nแต่ดวงอาทิตย์กำลังขึ้นทางทิศตะวันออกไกลออกไป ความมั่งคั่งมาจากนครต่างๆ แต่ศรัทธาอันมิเสื่อมคลายนั้นมาจากทุ่งหญ้าสเตปป์อันทุรกันดาร\nพระคัมภีร์กล่าวถึงเมลคิออร์ คัสปาร์ และบัลธาซาร์ที่เดินทางกลับสู่มาตุภูมิของตนหลังจากถวายความเคารพแด่กษัตริย์แห่งชาวยิวผู้ประสูติใหม่ เลือดเนื้อเชื้อไขของพวกเขา เหล่าชาวเนสโตเรียนผู้เปี่ยมศรัทธา ยังคงนมัสการพระเจ้าเที่ยงแท้องค์เดียวและพระบุตรของพระองค์"
 legend_the_red_hand: "หัตถ์แดงแห่งอัลสเตอร์"
 legend_the_red_hand_desc: "กล่าวกันว่าในยุคแรกของไอร์แลนด์ มีคำสัญญาว่าผู้ใดวางมือบนอัลสเตอร์เป็นคนแรกจะได้รับสิทธิ์ในดินแดนนั้น และได้เป็นมหาราชแห่งไอร์แลนด์ เป็นบรรพบุรุษของเราที่มีปัญญาเฉือนมือของตนเองและขว้างไปยังอัลสเตอร์ ทำให้หญ้าสีมรกตเปื้อนเลือดของเขา"
 legend_ragnarr: "บุตรแห่ง $nick_lodbrok$"
 legend_ragnarr_desc: "กษัตริย์แห่งชาวเดนส์และผู้สังหารหนอนยักษ์ [ancestor.GetFirstNameNoTooltip] เป็นที่หวาดกลัวของชาวคริสต์และเป็นนักผจญภัยในตำนาน วีรกรรมอันยิ่งใหญ่ในชีวิตของ[ancestor.GetHerHis|U]มีมากมายเกินกว่าจะกล่าวถึง และด้วยสายเลือดของ[ancestor.GetHerHis]ที่ไหลเวียนอยู่ในตัวข้า จึงเป็นเรื่องถูกต้องที่ข้าจะอ้างสิทธิ์ในมรดกของ[ancestor.GetHerHis]และสร้างตำนานของข้าเอง!"
 legend_holy_site: "$legend_saintly_location_name$"
 legend_holy_site_desc: "$legend_saintly_location_desc$"
 legend_saintly_location_name: "[ROOT.Char.CustomFixedRandom('GetCustodianSynonym')|U] แห่งสถานศักดิ์สิทธิ์ของชาว[protagonist.GetFaith.GetAdjectiveNoTooltip]"
 legend_saintly_location_desc: "การครอบครองสถานศักดิ์สิทธิ์สำหรับ [faith.GetNameNoTooltip] เป็นเครื่องหมายแห่งความศักดิ์สิทธิ์ในตัวเอง"
 legend_chapter_opening_saintly_location: "ดินแดนแห่ง [location.GetNameNoTooltip] มีคุณค่าทางศาสนาสูงสุด และกล่าวกันว่าจากผืนดินนั้นมีน้ำมหัศจรรย์ผุดขึ้นมา สามารถรักษาโรคภัยไข้เจ็บทั้งปวงได้"
 legend_chapter_motivation_religious: "เมื่อ [ROOT.Legend.GetProtagonist.GetTitledFirstNameNoTooltip] ได้ยินเรื่องนี้ [ROOT.Legend.GetProtagonist.GetSheHe] รู้สึกอบอุ่นในใจอย่างยิ่ง เพราะความศรัทธาของ[ROOT.Legend.GetProtagonist.GetHerHis]นั้นยิ่งใหญ่มากจนเพียงแค่คิดถึงสถานที่ศักดิ์สิทธิ์ก็ ทำให้[ROOT.Legend.GetProtagonist.GetHerHim]น้ำตาไหล"
 legend_saintly_life_name: "ชีวิตอัน[ROOT.Char.CustomFixedRandom('GetPiousAdj')|U]ที่สุดของ [protagonist.GetTitledFirstNameNoTooltip]"
 legend_saintly_life_desc: "ชีวิตที่อุทิศตนของ [protagonist.GetTitledFirstNameNoTooltip] ได้มอบสถานะเกือบเทียบเท่านักบุญให้แก่[protagonist.GetHerHim]"
 legend_chapter_opening_saintly_life: "[ROOT.Legend.GetProtagonist.GetTitledFirstNameNoTooltip] เกิดมาพร้อมกับความรักอันลึกซึ้งต่อ [ROOT.Legend.GetProtagonist.GetFaith.HighGodName] และอุทิศทั้งชีวิตของ[ROOT.Legend.GetProtagonist.GetHerHis]เพื่อเป็นเกียรติแก่ศรัทธาของ[ROOT.Legend.GetProtagonist.GetHerHis]"
 holy_seed_toast: "ได้รับ[legend_seed|E]ศักดิ์สิทธิ์"
 holy_seed_toast_traits: "ธรรมชาติ[ROOT.Char.CustomFixedRandom('GetSaintlyTrait')]ของท่านเป็นที่ยอมรับ"
 legend_saintly_building_name: "ผู้สร้างอัน[ROOT.Char.CustomFixedRandom('GetPiousAdj')|U]แห่ง [location.GetNameNoTooltip]"
 legend_saintly_building_desc: "การสร้าง[ROOT.Char.GetFaith.HouseOfWorshipPlural]เป็นการกระทำที่ไม่เห็นแก่ตัว — เป็นข้อพิสูจน์อันยิ่งใหญ่ถึงจิตวิญญาณอันศรัทธา"
 legend_ancient_people_name: "[ROOT.Char.CustomFixedRandom('GetDescendantSynonym')|U]ชาว[culture.GetNameNoTooltip]"
 legend_ancient_people_desc: "ในสายเลือดของประชาชนของเราทุกคนไหลเวียนด้วยสายเลือดเดียวกับที่ไหลผ่านชาว[culture.GetCollectiveNoun]"
 legend_saintly_deed_name: "การกระทำอัน[ROOT.Char.CustomFixedRandom('GetPiousAdj')|U]ของ [ancestor.GetNameNoTooltip|U]"
 legend_saintly_deed_desc: "การกระทำอันศรัทธาของ[ancestor.GetShortUINamePossessive|U]ในนามของ [religion.GetName] นั้นคู่ควรแก่การเคารพบูชาอย่างแน่นอน"
 legend_saintly_descent_name: "[ROOT.Char.CustomFixedRandom('GetDescendantSynonym')|U] แห่ง [Localize( ancestor_flag )|U]"
 legend_saintly_descent_desc: "สายเลือดอันศักดิ์สิทธิ์ของ [Localize( ancestor_flag )] ไหลเวียนอยู่ในเส้นเลือดของเรา และด้วยสายเลือดนี้ เราจะกระทำปาฏิหาริย์"
 legend_mythical_descent_name: "สายเลือด[Localize( creature )|U]"
 legend_mythical_descent_desc: "บรรพบุรุษของข้าคนหนึ่งเป็น [Localize( creature )] ผู้ยิ่งใหญ่"
 legend_godly_descent_name: "สายเลือดแห่ง [Localize( god )|U]"
 legend_godly_descent_desc: "[Localize( god )|U] คือบรรพบุรุษของข้า และด้วยสายเลือดนั้นในเส้นเลือดของข้า ข้าจะกระทำสิ่งมหัศจรรย์"
 legend_chronicle_ancestral_glory_desc: "[ancestor.GetName] เป็น[ancestor.GetWomanMan]ผู้ยิ่งใหญ่อย่างแท้จริง เป็นที่เคารพนับถือของทุกคน"
 legend_chronicle_ancestral_glory_nohistory_desc: "บรรพบุรุษของเราเป็นหนึ่งในผู้ยิ่งใหญ่อย่างแท้จริง เป็นที่เคารพนับถือของทุกคน"
 legend_crusader: "[GetTrait('faith_warrior').GetNameNoTooltip( protagonist )] [ancestor.GetTitleAsNameNoTooltip|U]"
 legend_crusader_desc: "[protagonist.GetName] ได้กระทำการอันยิ่งใหญ่และศรัทธามากมายในการยึดครองดินแดนศักดิ์สิทธิ์"
 legend_chronicle_raised_by_animals: "เด็ก[Localize( beast )|U]"
 legend_chronicle_raised_by_animals_desc: "[protagonist.GetNameNoTooltip|U] ถูกเลี้ยงดูโดย [Localize( beast )|U] และประสบการณ์อันทรหดในธรรมชาติอันเป็นสิ่งสร้างของ[protagonist.GetFaith.CreatorNamePossessive] ทำให้[protagonist.GetHerHim]มีความพร้อมดุจเทพประทานในการปกครอง"
 legend_auspicious_birth: "การกำเนิดอันเป็นมงคล"
 legend_auspicious_birth_desc: "[protagonist.GetNameNoTooltip|U] เกิดเมื่อท้องฟ้ายามค่ำคืนเต็มไปด้วยดวงดาวอันเป็นมงคล เป็นสัญญาณที่แน่นอนถึงการกระทำอันยิ่งใหญ่ที่[protagonist.GetSheHe]ถูกลิขิตไว้"
 legend_virgin_birth: "ปฏิสนธินิรมล"
 legend_virgin_birth_desc: "มารดาของ[protagonist.GetMother.GetNameNoTooltip|U]ตั้งครรภ์โดยไม่ได้สมสู่กับสามีของ[protagonist.GetMother.GetHerHis]อย่างน่าประหลาดใจ แท้จริงแล้ว นี่คือสัญญาณว่า[protagonist.GetFaith.HighGodName|U] [protagonist.GetFaith.HighGodHerselfHimself] ได้ประทานบุตรให้แก่[protagonist.GetMother.GetHerHim]"
 legend_sacred_birth_name: "การกำเนิดอัน[ROOT.Char.CustomFixedRandom('GetPiousAdj')|U]ของ[protagonist.GetFirstNamePossessiveNoTooltip]"
 legend_sacred_birth_desc: "สถานการณ์การกำเนิดของ[protagonist.GetNamePossessiveNoTooltip]ถูกปกคลุมไปด้วยความลึกลับ เป็นสัญญาณที่แน่นอนว่า[protagonist.GetSheHe]ได้รับพรจาก[protagonist.GetFaith.HighGodName|U]ตั้งแต่แรกเริ่ม"
 legend_divine_intervention_name: "ได้รับพรจาก [Localize( god )|U]"
 legend_divine_intervention_desc: "[protagonist.GetNameNoTooltip|U] ได้สนทนากับ [Localize( god )] ในความฝันของ[protagonist.GetHerHis] มอบภารกิจอันศักดิ์สิทธิ์ให้แก่[protagonist.GetHerHim]"
 legend_fought_devil_name: "การต่อสู้กับ [protagonist.GetFaith.DevilName|U]"
 legend_fought_devil_desc: "ในความฝัน [protagonist.GetNameNoTooltip] ได้ต่อสู้กับ [protagonist.GetFaith.DevilName] [protagonist.GetFaith.DevilHerselfHimself] เป็นสัญญาณอันเป็นมงคลว่า[protagonist.GetSheHe]ถูกลิขิตให้ปราบความชั่วร้าย"
 legend_exotic_backstory_name: "มหากาพย์ของ[protagonist.GetNamePossessiveNoTooltip]"
 legend_exotic_backstory_desc: "[protagonist.GetName] เคยเดินทางไกล ไปจนถึง [Localize( location.GetString )] และกลับมาอีกครั้ง"
 pilgrim_legend_name: "ผู้แสวงบุญสู่โลก"
 pilgrim_legend_desc: "[ancestor.GetNamePossessive|U] อุทิศชีวิตของ[ancestor.GetHerHis]ให้กับการเดินทางอันไม่มีที่สิ้นสุดขึ้นสู่[ancestor.GetFaith.PositiveAfterLife] มีเพียง[ancestor.GetFaith.HighGodName|U]เท่านั้นที่รู้ถึงการกระทำทั้งหมดที่เกิดขึ้นบนเส้นทางศักดิ์สิทธิ์สู่ความรอดของ[ancestor.GetFirstNamePossessiveNoTooltip]"
 consecrated_blood_legend: "สายเลือดศักดิ์สิทธิ์"
 consecrated_blood_legend_desc: "สายเลือดของ[founder.GetNamePossessive|U]ไหลเวียนอยู่ในสมาชิกทุกคนของตระกูล [dynasty.GetName] ความจงรักภักดีของเราต่อ[founder.GetFaith.HighGodName|U]นั้นสมบูรณ์แบบและการกระทำของเราทำไปในนามของ[founder.GetFaith.HighGodHerHis|U]เท่านั้น"
 dyn_many_crown_legend: "อำนาจอธิปไตยแห่ง[dynasty.GetNameNoTooltip|U]"
 dyn_many_crown_legend_desc: "ไม่ว่าจะด้วยโชคชะตาหรือการออกแบบ อำนาจตกอยู่ในมือของ [dynasty.GetName] ดินแดนของเรามีมากมายและการกระทำของเรายิ่งใหญ่ และการครอบครองบัลลังก์ของโลกของเรานั้นถูกกำหนดไว้ล่วงหน้าแล้ว"
 legend_of_rome_name: "ซีซาร์องค์ใหม่"
 legend_of_israel_name: "[founder.GetTitleAsNameNoTooltip|U]องค์ใหม่แห่งอิสราเอล"
 legend_of_slavia_name: "จักรวรรดิแห่งชาวสลาฟ"
 legend_of_n_sea_name: "อำนาจเหนือทะเล"
 legend_of_mann_name: "โจรสลัด[founder.GetTitleAsNameNoTooltip|U]"
 legend_of_genghis_name: "ข่านผู้ยิ่งใหญ่ที่สุด"
 new_title_name: "[founder.GetTitleAsNameNoTooltip|U]องค์ใหม่"
 jewish_priesthood_name: "คำทำนายที่สมหวัง"
 zoroast_priesthood_name: "จุดไฟขึ้นใหม่"
 priesthood_restoration_name: "ฐานะปุโรหิตใหม่"
 iberian_ender_name: "ชะตากรรมแห่ง [GetTitleByKey('e_spain').GetNameNoTierNoTooltip|U]"
 persian_ender_name: "ชะตากรรมแห่ง [GetTitleByKey('e_persia').GetNameNoTierNoTooltip|U]"
 struggle_conclusion_name: "จุดจบของ [Localize(struggle.GetString)|U]"
 legendary_battle_name: "สมรภูมิแห่ง [location.GetName|U]"
 reformed_faith: "การรวมตัวของ [religion.GetNameNoTooltip|U]"
 new_faith_legend_name: "[faith.GetNameNoTooltip|U] ผู้มีชัย"
 khan_beater_name: "ผู้พิฆาตข่าน"
 legend_of_rome_desc: "โรม ซึ่งครั้งหนึ่งเคยลดน้อยลงเหลือเพียงความทรงจำอันห่างไกล บัดนี้ได้ผงาดขึ้นอีกครั้งพร้อมกับซีซาร์องค์ใหม่ พร้อมที่จะนำอารยธรรมมาสู่อีกยุคสมัยหนึ่ง"
 legend_of_israel_desc: "อิสราเอล อาณาจักรสำหรับประชากรผู้ถูกเลือกของพระเจ้า ถูกกดขี่โดยชาวอัสซีเรีย บาบิโลน และโรมัน การอพยพของเราออกจากดินแดนแห่งพันธสัญญาได้ส่งผู้คนของเราเดินทางไปทั่วโลก แต่บัดนี้อาณาจักรอิสราเอลใหม่ได้ผงาดขึ้นและประชากรของพระเจ้าได้อาศัยอยู่ในดินแดนนั้นอีกครั้ง!"
 legend_of_slavia_desc: "ชนชาติสลาฟแพร่กระจายไปทั่วยุโรป แต่บัดนี้ [founder.GetFirstName] ยืนหยัดในฐานะ [founder.GetTitleAsNameNoTooltip|U] คนแรกของชาวสลาฟทั้งหมด!"
 legend_of_n_sea_desc: "ทะเลเหนือเคยเป็นอาณาเขตของชาวเดนส์ และบัดนี้ภายใต้การปกครองของ [founder.GetName] จักรวรรดิได้ผงาดขึ้นเหนือคลื่น"
 legend_of_mann_desc: "ข้ามคลื่นแห่งบริทานเนีย เหล่ากะลาสีเล่าขานเรื่องราวของโจรสลัด[founder.GetTitleAsNameNoTooltip|U]ผู้ยิ่งใหญ่และน่าสะพรึงกลัว [founder.GetName] ผู้เป็นที่หวาดหวั่น แม้ แต่นักรบที่แข็งแกร่งที่สุดก็หน้าซีดเมื่อเห็นเรือเหล่านั้นปรากฏบนชายฝั่งของพวกเขา การยอมจำนนจะเป็นทางเลือกเดียว หากเพียง แต่[founder.GetTitleAsNameNoTooltip|U]จะยอมรับสิ่งนั้น"
 legend_of_genghis_desc: "ทุกสิ่งที่อยู่ใต้ฟากฟ้าเป็นของข่านผู้ยิ่งใหญ่ที่สุด ด้วยชาวมองโกลที่รวมเป็นหนึ่งภายใต้[founder.GetTitleAsNameNoTooltip|U]เพียงผู้เดียว หมาป่าหอนและอินทรีร่ำไห้ขณะที่เจงกีสข่านเผาชื่อของ[founder.GetHerHis]ไปทั่วโลก"
 new_title_desc: "[founder.GetTitleAsNameNoTooltip|U]องค์ใหม่ผงาดขึ้นจากเถ้าถ่านเพื่อนำความเจริญรุ่งเรืองภายใต้การปกครองอันเมตตาของ[founder.GetHerHis]"
 jewish_priesthood_desc: "การพลัดถิ่นคิดว่าจะคงอยู่ตลอดไป แต่ภายใต้ [founder.GetName] ฐานะปุโรหิตสูงสุดใหม่ได้ถือกำเนิดขึ้นเพื่อนำชาว [faith.GetName] ไปสู่ยุคใหม่ที่สดใสกว่าเดิม"
 zoroast_priesthood_desc: "ศรัทธาโซโรอัสเตอร์เคยนำโดยเมไจผู้ยิ่งใหญ่ในอดีต แต่ระเบียบนั้นถูกรื้อถอน ด้วยพระคุณของอาหุระมาซดา อนาฮิตา และมิถรา [protagonist.GetName] ได้ฟื้นฟูเมไจขึ้นใหม่"
 priesthood_restoration_desc: "[faith.GetName] ถูกลดทอนเหลือเพียงเถ้าถ่านด้วยมืออันโหดร้ายของกาลเวลา บัดนี้ ด้วยพระคุณของ[faith.HighGodName|U] [founder.GetName] สร้างฐานะปุโรหิตขึ้นใหม่"
 iberian_ender_desc: "การทะเลาะวิวาทของขุนนางไอบีเรียสิ้นสุดลงแล้ว และ [struggle_ender.GetFirstName] ปรากฏตัวในฐานะผู้กอบกู้ [struggle_ender.GetTitleAsNameNoTooltip|U] ผู้มีชัย"
 struggle_conclusion_desc: "[Localize(struggle.GetString)|U] สิ้นสุดลงแล้ว และ [struggle_ender.GetFirstName] ปรากฏตัวในฐานะวีรบุรุษที่จะนำพายุคใหม่มาสู่ภูมิภาค"
 khan_beater_desc: "'เจงกีสข่าน' ในตำนานตั้งใจที่จะนำทุกสิ่งที่อยู่ใต้ฟากฟ้าเข้ามาในจักรวรรดิของ[loser.GetHerHis] แต่ [winner.GetTitleAsNameNoTooltip|U] ผู้ยิ่งใหญ่ถูกขัดขวางโดย [winner.GetName] ผู้กล้าหาญ!"
 legendary_battle_desc: "[loser.GetName|U] พยายามทำลาย [winner.GetName] และ [loser.GetSheHe] เป็นคู่ต่อสู้ที่คู่ควรอย่างแท้จริง ด้วย [winner.GetFirstNameNoTooltip] ที่ได้รับชัยชนะ จะไม่มีที่สิ้นสุดสำหรับวีรกรรมอันกล้าหาญของ[winner.GetHerHis]!"
 reformed_faith_desc: "ศาสนาที่เป็นระบบตั้งใจที่จะทำลายวิถีเก่า แต่ภายใต้การนำทางอันชาญฉลาดและศรัทธาของ [reformer.GetName] ศรัทธา [faith.GetName] ได้ถูกนำเข้าสู่ยุคใหม่ ตำนานต่างๆ บัดนี้ถูกประมวลไว้ในคัมภีร์ศักดิ์สิทธิ์และมีการจัดตั้งชนชั้นนักบวชที่มีโครงสร้าง พระประสงค์ของ[faith.HighGodNamePossessive]จะสำเร็จ!"
 new_faith_legend_desc: "โบสถ์ที่อ่อนแอและทุจริตได้หลงทางไปไกลจากพระประสงค์ของ[faith.HighGodNamePossessive]สำหรับมนุษยชาติ ภายใต้การนำอันศักดิ์สิทธิ์ของ [reformer.GetName] ศรัทธาที่แท้จริง [faith.GetName] ได้ถือกำเนิดขึ้น"

