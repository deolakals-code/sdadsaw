 legend_chapter_opening_conqueror: "จากเถ้าถ่านจะไม่มีสิ่งใดเกิดใหม่ [ROOT.Legend.GetProtagonist.GetTitledFirstNamePossessiveNoTooltip]สาบานว่าจะกลายเป็นหายนะของ[ROOT.Legend.GetProtagonist.GetFaith.HighGodName]ยืนอยู่เหนือผืนดินสีแดงเข้ม และผืนดินจะเป็นสีแดงเข้มเท่านั้นนับจากนี้ไป"
