 ancient_culture_tome: "ตำรา [promoted_legend.GetProperty('culture').Culture.GetNameNoTooltip|U]"
 ancient_culture_tome_desc: "ตำราโบราณเล่มนี้ดูเหมือนจะบ่งชี้ถึงความเชื่อมโยงระหว่าง [promoted_legend.GetProperty('culture').Culture.GetCollectiveNoun] และ [ROOT.Char.GetCulture.GetCollectiveNoun]"
 ancient_culture_artifact: "รูปแกะสลัก [promoted_legend.GetProperty('culture').Culture.GetNameNoTooltip|U]"
 ancient_culture_artifact_desc: "รูปแกะสลักสัตว์โบราณที่สร้างขึ้นด้วยฝีมือของ [promoted_legend.GetProperty('culture').Culture.GetName] มันจางและแทบจำไม่ได้ แต่การถือชิ้นส่วนของอดีตไว้ในมือ ทำให้รู้สึกเชื่อมโยงกับมันในทางใดทางหนึ่ง"

 legend_chapter_punched_animal_great: "[ROOT.Legend.GetProtagonist.GetNameNoTooltip] วิ่งเข้าใส่ [Localize( beast )] ด้วยหมัดที่ง้างไว้และทุบสัตว์ร้ายจนแหลกเป็นชิ้นเล็กชิ้นน้อยด้วยการชกอันทรงพลังเพียงครั้งเดียวที่กะโหลกศีรษะ"
 legend_chapter_punched_animal_good: "[ROOT.Legend.GetProtagonist.GetNameNoTooltip] ถูก [Localize( beast )] กระโจนเข้าใส่ และต่อสู้กับสัตว์ร้ายในระยะประชิด แม้จะถูกจู่โจมโดยไม่ทันตั้งตัว [ROOT.Legend.GetProtagonist.GetSheHe] ก็สังหารสัตว์ร้ายด้วยมือเปล่าของ [ROOT.Legend.GetProtagonist.GetHerHis]"
 legend_chapter_punched_animal_bad: "[ROOT.Legend.GetProtagonist.GetNameNoTooltip] ถูก [Localize( beast )] กระโจนเข้าใส่ และต่อสู้กับสัตว์ร้ายในระยะประชิด แม้ว่าในที่สุด [ROOT.Legend.GetProtagonist.GetSheHe] จะต้องได้รับการช่วยเหลือจากคณะล่าสัตว์ของ [ROOT.Legend.GetProtagonist.GetHerHis] แต่สัตว์ร้ายก็ถูกสังหาร"
 legend_chapter_punched_animal_very_bad: "ท่ามกลางความสับสนของคณะล่าสัตว์ของ [ROOT.Legend.GetProtagonist.GetHerHis] [ROOT.Legend.GetProtagonist.GetNameNoTooltip] แยกตัวออกจากกลุ่มเพื่อโจมตี [Localize( beast )] ที่บริเวณส่วนล่าง หลังจาก ทำให้คณะตกอยู่ในอันตรายอย่างยิ่งและ ทำให้ [ROOT.Legend.GetProtagonist.GetHerselfHimself] เสื่อมเสียเกียรติ สัตว์ร้ายก็ถูกสังหาร"
 legend_chapter_person_of_lake_great: "[ROOT.Legend.GetProtagonist.GetNameNoTooltip|U] ได้เห็นสิ่งมีชีวิตจาก [ROOT.Legend.GetProtagonist.GetFaith.PositiveAfterLife] ผุดขึ้นมาจากน้ำ [ROOT.Legend.GetProtagonist.GetSheHe|U] พูดคุยกับพวกเขาและได้รับภารกิจจาก [ROOT.Legend.GetProtagonist.GetFaith.HighGodName|U]"
 legend_chapter_person_of_lake_good: "ขณะเดินเตร่ไปตามพื้นที่ชุ่มน้ำ [ROOT.Legend.GetProtagonist.GetNameNoTooltip] ได้พบกับบุคคลผู้ยิ่งใหญ่และฉลาดที่อาศัยอยู่ในน้ำ ซึ่งมอบภารกิจศักดิ์สิทธิ์ให้ [ROOT.Legend.GetProtagonist.GetHerHim]"
 legend_chapter_person_of_lake_bad: "ขณะเดินเตร่อย่างครึ่งหลับครึ่งตื่นจากการดื่มน้ำที่ไม่บริสุทธิ์ [ROOT.Legend.GetProtagonist.GetNameNoTooltip] เห็นนิมิตของบุคคลที่สวยงามและฉลาด ซึ่งชี้ทาง [ROOT.Legend.GetProtagonist.GetHerHim] ไปสู่โชคชะตาอันมหัศจรรย์ของ [ROOT.Legend.GetProtagonist.GetHerHis]"
 legend_chapter_person_of_lake_very_bad: "[ROOT.Legend.GetProtagonist.GetNameNoTooltip|U] ได้พบกับฤาษีเฒ่าผู้ซอมซ่อ น้ำลายฟูมปากและกรีดร้องคำทำนายใส่ใครก็ตามที่ยอมฟัง [ROOT.Legend.GetProtagonist.GetNameNoTooltip|U] เชื่อคำพูดของผู้อาศัยในหนองบึงผู้นี้และเลือกที่จะ ทำให้มันเป็นโชคชะตาของ [ROOT.Legend.GetProtagonist.GetHerHis]"
 legend_chapter_great_battle: "กองกำลังของ [ROOT.Legend.GetProtagonist.GetNamePossessive|U] ถูกต้อนจนมุมโดย [ROOT.Legend.MakeScope.Var('8141_commander').Char.GetNameNoTooltip] และกองทัพของ [ROOT.Legend.MakeScope.Var('8141_commander').Char.GetHerHis] การรบยาวนานและนองเลือด และชีวิตมากมายต้องสูญเสียไป แต่ [ROOT.Legend.GetProtagonist.GetNameNoTooltip] ก็ได้รับชัยชนะ ธงและอาวุธชุ่มโชกไปด้วยเลือดของศัตรูของ [ROOT.Legend.GetProtagonist.GetHerHis]"
 legend_chapter_battled_mighty_beast_good: "[ROOT.Legend.GetProtagonist.GetNameNoTooltip|U] ต่อสู้อย่างกล้าหาญและได้รับชัยชนะเหนือสัตว์ร้ายที่ยิ่งใหญ่และทรงพลัง แต่การต่อสู้ได้ทิ้งรอยแผลถาวรไว้บนร่างกายของ [ROOT.Legend.GetProtagonist.GetHerHis]"
 legend_chapter_battled_mighty_beast_bad: "[ROOT.Legend.GetProtagonist.GetNameNoTooltip|U] ตัดสินใจโจมตีสัตว์ร้ายที่ทรงพลังและได้รับบาดเจ็บถาวรในความพยายามที่ไร้ผล"
 legend_chapter_injured_evangelising_good: "[ROOT.Legend.GetProtagonist.GetNameNoTooltip|U] กำลังเผยแพร่ศรัทธาอย่างกล้าหาญในหมู่พวกนอกรีตและผู้ไม่เชื่อ เมื่อ [ROOT.Legend.GetProtagonist.GetSheHe] ถูกโจมตี เพราะความเชื่อของ [ROOT.Legend.GetProtagonist.GetHerHis] และพิการอย่างถาวร"
 legend_chapter_injured_evangelising_bad: "[ROOT.Legend.GetProtagonist.GetNameNoTooltip|U] กำลังเทศนาพวกนอกรีตในหมู่ชาวนาและได้รับบาดเจ็บจากกลุ่มผู้เชื่อที่แท้จริง"
 legend_chapter_mysterious_injury: "[ROOT.Legend.GetProtagonist.GetNameNoTooltip|U] [ROOT.Legend.GetProtagonist.Custom('GainedPermanentInjury')] ภายใต้สถานการณ์ที่คลุมเครือและลึกลับ เหตุการณ์ที่นำไปสู่ [ROOT.Legend.GetProtagonist.Custom('PermanentInjuryAdjective')] ของ [ROOT.Legend.GetProtagonist.GetHerHis] ยังคงเป็นเรื่องที่ไม่มีใครรู้ยกเว้น [ROOT.Legend.GetProtagonist.GetHerselfHimself]"
 legend_chapter_love: "[ROOT.Legend.GetProtagonist.GetNameNoTooltip|U] ได้ครองใจ [ROOT.Legend.MakeScope.Var('8160_soulmate').Char.GetNameNoTooltip] ความรักในชีวิตของ [ROOT.Legend.GetProtagonist.GetHerHis] สำหรับวีรกรรมอันยิ่งใหญ่ทั้งหมดที่ทำเพื่อผู้อื่น [ROOT.Legend.MakeScope.Var('8160_soulmate').Char.GetFirstNameNoTooltip] อยู่เคียงข้าง [ROOT.Legend.GetProtagonist.GetHerHim] ตลอดเวลา และว่ากันว่าความรักของพวกเขาเป็นของขวัญจาก [ROOT.Legend.GetProtagonist.GetFaith.FertilityGodName]"
 legend_chapter_immortal: "[ROOT.Legend.GetProtagonist.GetNameNoTooltip|U] ถูกปลุกให้ตื่นในตอนกลางคืนด้วยการมาเยือนอันน่าตกใจจาก [ROOT.Legend.GetProtagonist.GetFaith.DeathDeityName|U] นับตั้งแต่การมาเยือนอันน่าสะพรึงกลัวนี้ [ROOT.Legend.GetProtagonist.GetFirstNameNoTooltip] ตัดสินใจที่จะหลบหนีสิ่งที่ผู้อื่นเรียกว่าหลีกเลี่ยงไม่ได้และแสวงหาชีวิตนิรันดร์บนโลก"
 legend_chapter_immortal_child_conclusion: "ความกลัวของ [ROOT.Legend.GetProtagonist.GetNamePossessiveNoTooltip] เกี่ยวกับความเป็นนิรันดร์ของ [ROOT.Legend.GetProtagonist.GetFaith.PositiveAfterLife|U] ถูกระงับลงอย่างสิ้นเชิงด้วยการเกิดของ [ROOT.Legend.MakeScope.Var('8171_child').Char.GetNameNoTooltip] [ROOT.Legend.MakeScope.Var('8171_child').Char.Custom('GetDaughterSon')] ของ [ROOT.Legend.GetProtagonist.GetHerHis] ในตัวทารก [ROOT.Legend.GetProtagonist.GetFirstNameNoTooltip] เห็นอนาคตของ [ROOT.Legend.GetProtagonist.GetHerHis] เองและความเป็นนิรันดร์ของมรดกของ [ROOT.Legend.GetProtagonist.GetHerHis]"
 legend_chapter_accept_mortality_conclusion: "[ROOT.Legend.GetProtagonist.GetNameNoTooltip|U] ได้รับการมาเยือนจาก [ROOT.Legend.GetProtagonist.GetFaith.CreatorName] ผู้ ซึ่งพูดคุยกับ [ROOT.Legend.GetProtagonist.GetHerHim] โดยตรงเกี่ยวกับธรรมชาติของการสร้างสรรค์ และความงามของชีวิตที่มีขีดจำกัด [ROOT.Legend.GetProtagonist.GetSheHe|U] ออกมาจากการเผชิญหน้าในตำนานนี้ในฐานะ [ROOT.Legend.GetProtagonist.GetWomanMan] ที่เปลี่ยนไป สงบสุขกับธรรมชาติอันไม่จีรังของชีวิตและสันติสุขของ [ROOT.Legend.GetProtagonist.GetFaith.PositiveAfterLife|U]"
 legend_chapter_confronted_creator_conclusion: "[ROOT.Legend.GetProtagonist.GetNameNoTooltip|U] ได้รับการมาเยือนจาก [ROOT.Legend.GetProtagonist.GetFaith.CreatorName] ผู้ ซึ่งพูดคุยกับ [ROOT.Legend.GetProtagonist.GetHerHim] โดยตรงเกี่ยวกับธรรมชาติของการสร้างสรรค์ และความงามของชีวิตที่มีขีดจำกัด [ROOT.Legend.GetProtagonist.GetSheHe|U] ท้าทายแม้กระทั่งผู้สร้างของ [ROOT.Legend.GetProtagonist.GetHerHis] เองและสาบานว่าจะดำเนินภารกิจเพื่อความเป็นอมตะของ [ROOT.Legend.GetProtagonist.GetHerHis] ต่อไป"
 legend_chapter_revenge_quest: "[ROOT.Legend.GetProtagonist.GetNameNoTooltip|U] สาบานว่าจะแก้แค้น [ROOT.Legend.MakeScope.Var('8180_revenge_quest').Char.GetNameNoTooltip] สำหรับการฆาตกรรมบิดามารดาของ [ROOT.Legend.GetProtagonist.GetHerHis] ในฐานะตัวแทนของทุกสิ่งที่ยุติธรรมและชอบธรรมบนโลก [ROOT.Legend.GetProtagonist.GetNameNoTooltip] ตัดสินใจว่ามันเป็นจุดประสงค์ของ [ROOT.Legend.GetProtagonist.GetHerHis] ที่จะนำความยุติธรรมมาสู่คนร้ายผู้นี้"
 legend_chapter_revenge_quest_complete: "ในที่สุด [ROOT.Legend.MakeScope.Var('8180_revenge_quest').Char.GetNameNoTooltip] ก็ถูกสังหารและส่งไปยัง [ROOT.Legend.GetProtagonist.GetFaith.NegativeAfterLife] โดย [ROOT.Legend.GetProtagonist.GetNameNoTooltip]"
 legend_chapter_revenge_quest_divine_justice: "ดูเหมือนว่า [ROOT.Legend.GetProtagonist.GetFaith.HighGodName|U] จะเห็นด้วยกับการประเมินของ [ROOT.Legend.GetProtagonist.GetNamePossessive] และได้พรากชีวิต [ROOT.Legend.MakeScope.Var('8180_revenge_quest').Char.GetHerHis] ของ [ROOT.Legend.MakeScope.Var('8180_revenge_quest').Char.GetNameNoTooltip] ไป และส่ง [ROOT.Legend.MakeScope.Var('8180_revenge_quest').Char.GetHerHim] ไปยัง [ROOT.Legend.GetProtagonist.GetFaith.NegativeAfterLife] ด้วย [ROOT.Legend.GetProtagonist.GetFaith.HighGodHerselfHimself] เอง"
 legend_chapter_raised_by_animal: "[ROOT.Legend.GetProtagonist.GetNameNoTooltip|U] หลงทางเมื่อยังเป็นเด็กและได้รับการอุปถัมภ์และเลี้ยงดูโดย [ROOT.Legend.MakeScope.Var('animal_parent').GetFlagName] หลายคนคาดเดาว่านี่คือสาเหตุของความประหลาดที่ถูกกล่าวหาของ [ROOT.Legend.GetProtagonist.GetHerHis]"
 legend_chapter_forged_own_path: "[ROOT.Legend.GetProtagonist.GetNameNoTooltip|U] รู้ว่าการเดินทางข้างหน้าจะเต็มไปด้วยอันตราย แต่เส้นทางของ [ROOT.Legend.GetProtagonist.GetHerHis] ถูกกำหนดไว้ตั้งแต่ต้น ไม่เคยลังเล [ROOT.Legend.GetProtagonist.GetSheHe] วางแผนเส้นทางและจุดประสงค์ นำทางโดยเพียงแค่ความแข็งแกร่งของเจตจำนงของ [ROOT.Legend.GetProtagonist.GetHerHis] เอง"
 possessed_artifact_desc: "[witchy_artifact.GetDesc]\n\nบรรจุวิญญาณชั่วร้ายอันทรงพลังที่ถูกกักขังโดยแม่มดผู้ทรงพลัง"
 infidel_artifact_desc: "[infidel_weapon.GetDesc]\n\nอาวุธนี้ถูกใช้เพื่อสังหาร [memory.loser.GetFaith.GetAdherentNamePluralNoTooltip] 1000 คนใน [memory.GetName]"
 ce1_battle_artifact_desc: "[infidel_weapon.GetDesc]\n\nอาวุธนี้ได้รับการแกะสลักด้วยคำอธิบายของ [memory.GetName]"

