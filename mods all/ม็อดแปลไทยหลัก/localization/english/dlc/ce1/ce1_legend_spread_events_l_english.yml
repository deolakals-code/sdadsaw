 legend_spread_events.0070.t: "คู่ควรหรือไม่?"
 legend_spread_events.0070.desc: "นักร้องครอบครองเวทีไม้ เติมเต็มค่ำคืนด้วยเสียงดนตรี ขณะที่ข้าจิบ [ROOT.Char.Custom('RegionalAlcoholicDrink')] ของข้า ข้าหลับตาลงและปล่อยให้ตัวเองพักผ่อนครู่หนึ่ง\n\n"และบัดนี้! ทุกคนจงฟัง! ทุกคนจงฟัง! #EMP [ROOT.Char.GetPromotedLegend.GetName]#!!"\n\nเสียงโห่ร้องของ [ROOT.Char.Custom('GetCourtierPlural')] ของข้าดังไปทั่วห้อง — เสียงช้อนส้อมกระทบโต๊ะและเสียงหัวเราะดังลั่น ความคิดที่น่าสงสัยหลอกหลอนข้า ท่ามกลางความชื่นชมของ [ROOT.Char.Custom('GetCourt')]\n\nข้า... คู่ควรหรือไม่?"
 legend_spread_events.0070.a: "#EMP แน่นอน#! ข้าคู่ควร!"
 legend_spread_events.0070.b: "ข้า... ข้าไม่แน่ใจอีกต่อไปแล้ว"
 legend_spread_events.0070.c: "ข้าไม่คู่ควร! ข้าไม่คู่ควร! ข้า #EMP ไม่คู่ควร!#!"
 legend_spread_events.0070.d: "ข้าคิดว่าข้าคู่ควร"
 legend_spread_events.0070.a.tt: "ท่านจะไตร่ตรองเรื่องนี้"
 
 legend_spread_events.0071.t: "วีรบุรุษที่แท้จริง"
 legend_spread_events.0071.desc.intro: "น้ำผุดขึ้นมาจากส่วนลึกของน้ำพุ ฟองอากาศเล็กๆ แตกกระจายบนผิวน้ำ ข้ามองลงไปในสีฟ้าและเห็นเงาสะท้อนของตัวเอง\n\n"
 legend_spread_events.0071.desc.mid.arrogant: "แข็งแกร่ง หล่อเหลา #EMP คู่ควร#! "
 legend_spread_events.0071.desc.mid: "เงาแห่งความสงสัยอยู่เบื้องหลังดวงตาของข้า ข้าพยายามผลักมันกลับไป"
 legend_spread_events.0071.desc.promoter: "\n\n"[ROOT.Char.GetTitledFirstNameNoTooltip]...?" ข้าหันกลับไปเห็น [promoter.GetTitledFirstName] ยืนอยู่ข้างข้า "ได้โปรด เล่าตำนานของท่านให้ข้าฟัง ข้าเดินทางมาหลายวันหลายคืนเพื่อฟังมัน""
 legend_spread_events.0071.desc.fallback: "\n\n[ROOT.Char.Custom('GetFollowerOrVassalPlural')] ของข้า... พวกเขาเห็นอะไรในตัวข้า? ข้าเอื้อมมือไปแตะน้ำ พวกเขาเห็นอะไร? วีรบุรุษ...? ข้าหวัง เช่นนั้น อย่างน้อย"
 legend_spread_events.0071.a: ""จิตวิญญาณที่เหมือนกัน เข้าร่วมกับข้า""
 legend_spread_events.0071.b: "[other_promoter.GetFirstNameNoTooltip] อาจถูกโน้มน้าว... ตรงกันข้ามโดยสิ้นเชิง"
 legend_spread_events.0071.c: "ข้าต้องโน้มน้าวประชาชนของข้า"
 legend_spread_events.0071.d: "ข้าต้องเป็นวีรบุรุษเพื่อตัวเอง"
 legend_chain_arrogant_modifier: "วีรบุรุษที่แท้จริง"
 legend_chain_arrogant_modifier_desc: "ตัวละครนี้เต็มไปด้วยความมั่นใจในธรรมชาติแห่งวีรบุรุษของตน"
 legend_chain_kinda_arrogant_modifier: "วีรบุรุษผู้มั่นใจ"
 legend_chain_kinda_arrogant_modifier_desc: "ตัวละครนี้มุ่งมั่นที่จะแสดงให้ทุกคนเห็นถึงธรรมชาติแห่งวีรบุรุษของตน"
 
 legend_spread_events.0072.t: "การค้นหาคำตอบ"
 legend_spread_events.0072.desc.intro: "ข้าก้าวเข้าไปใน [ROOT.Char.Custom('GetFaithTemple')] และแสงก็ทาผนังด้วยโทนสีอ่อนของพลบค่ำ\n\n"
 legend_spread_events.0072.desc.mid.depressed: "ข้าสูดหายใจลึก [ROOT.Char.GetFaith.HighGodName] ข้า ทำให้ท่านผิดหวัง เป็นเพียงมนุษย์ ไม่คู่ควร ไร้ประโยชน์ #EMP น่าสมเพช#! \n\n"
 legend_spread_events.0072.desc.mid.fallback: "[ROOT.Char.GetFaith.HighGodName] ท่านเห็นข้าไหม? มีอะไรให้เห็นบ้าง? เป็นเพียงมนุษย์ บางทีอาจไม่คู่ควร บางทีอาจหลงทาง ไม่มีใครเหลือที่จะนำทางข้า\n\n"
 legend_spread_events.0072.desc.vassal: ""[ROOT.Char.GetTitledFirstNameNoTooltip]...?" ข้าไม่ทันสังเกตเห็นการปรากฏตัวของผู้อื่นในวิหาร [praying_vassal.GetTitledFirstName] ยืนอยู่ข้างข้า มือของ [praying_vassal.GetHerHis] ประสานกันในการสวดมนต์ "ข้าเดินทางมาหลายวันหลายคืนเพื่อฟังเกี่ยวกับตำนานของท่าน ข้ารู้ว่า [ROOT.Char.GetFaith.HighGodName] ก็กระตือรือร้นที่จะฟัง เช่นกัน""
 legend_spread_events.0072.desc.fallback: "ข้าเดินไปรอบๆ ห้อง ข้ามีความกังวลในตัวข้าชนิดที่ข้าไม่สามารถเปล่งเสียงออกมาได้ ศรัทธาของข้าสั่นคลอน การเป็นผู้ศักดิ์สิทธิ์หมายความว่าอย่างไร? หากข้าเป็นไม่ได้ ข้าจะพยายามอย่างน้อย"
 legend_spread_events.0072.a: "เพียงความคิดเห็นของ [ROOT.Char.GetFaith.HighGodNamePossessive] เท่านั้นที่สำคัญ"
 legend_spread_events.0072.b: ""[praying_vassal.GetFirstNameNoTooltip]... ท่านพูดถูก""
 legend_spread_events.0072.c: "ประชาชนของข้าต้องรู้ถึงความศรัทธาของข้า"
 legend_spread_events.0072.d: "ข้าจะหาความสบายใจใน [bishop.GetTitledFirstNameNoTooltip]"
 legend_chain_zealous_modifier: "ตำนานอันเคร่งศาสนา"
 legend_chain_zealous_modifier_desc: "ตัวละครนี้พบคำตอบที่ต้องการในพลังอำนาจที่สูงกว่า"
 
 legend_spread_events.0073.t: "โดดเดี่ยว?"
 legend_spread_events.0073.desc.intro: "อากาศเงียบสงบ ไม่เคลื่อนไหว ใบไม้เงียบสงบจนข้าบอกไม่ได้ว่าต้นไม้ทั้งหมดตายไปแล้วข้ามคืนหรือไม่\n\n"
 legend_spread_events.0073.desc.mid.depressed: "ข้าเองก็รู้สึก เช่นเดียวกัน\n\n"
 legend_spread_events.0073.desc.mid.fallback: "ข้าอยากจะอยู่ที่นี่เหลือเกิน ที่นี่ ที่ ซึ่งเสียงทรัมเป็ตไม่สามารถมาถึงข้าได้ ที่นี่ ที่ ซึ่งคำพูดของตำนานเป็นเพียงเสียงกระซิบที่แผ่วเบา\n\n"
 legend_spread_events.0073.desc.vassal: ""[ROOT.Char.GetTitledFirstNameNoTooltip]?" ข้าหันกลับไปพบ [fighting_vassal.GetTitledFirstName] จ้องมองมาที่ข้า มือของ [fighting_vassal.GetHerHis] วางอยู่บนดาบ เหงื่อไหลลงมาตามหน้าผากของ [fighting_vassal.GetHerHis] "ข้าเดินทางมาหลายวันหลายคืนเพื่อตามหาท่าน เสียงสะท้อนของตำนานของท่านได้เป็นแรงบันดาลใจให้ข้ากลายเป็นนักรบที่ดีขึ้น ได้โปรด เล่าเรื่องวีรกรรมของท่านให้ข้าฟัง""
 legend_spread_events.0073.desc.fallback: "ข้าหลับตาลง ความสว่างคมกริบของใบดาบผุดขึ้นมาในใจ แสงอาทิตย์สะท้อนบนเหล็กกล้า ดวงตาคู่อื่นด้วย สัตว์ร้าย บางที หรือศัตรู ข้ากำหมัด — ข้าเคยทำมันในอดีต ข้า #EMP ต้อง#! ทำมันต่อไป"
 legend_spread_events.0073.a: "มีการรบรอเราอยู่"
 legend_spread_events.0073.b: ""แน่นอน มาเถิด ฟัง""
 legend_spread_events.0073.c: "ข้าต้องสร้างแรงบันดาลใจให้ประชาชนของข้า"
 legend_spread_events.0073.d: "[marshal.GetTitledFirstNameNoTooltip] คอยหนุนหลังข้าเสมอ"
 legend_chain_army_modifier: "เกิดมาเพื่อรบ"
 legend_chain_army_modifier_desc: "ตัวละครนี้พบแรงจูงใจใหม่ในการรบที่จะมาถึง"
 legend_chain_marshal_modifier: "ตำนานการทหาร"
 legend_chain_marshal_modifier_desc: "ตัวละครนี้มุ่งเน้นไปที่การเป็นนักรบที่ดีที่สุดเท่าที่จะเป็นไปได้"
 
 legend_spread_events.0074.t: "ในถ้ำแห่งจิตใจ"
 legend_spread_events.0074.desc.intro: "ความมืดและความหนาวเย็นอาศัยอยู่ในสุสานใต้ดินเหล่านี้"
 legend_spread_events.0074.desc.mid.depressed: "ความเย้ายวนใจที่จะอยู่ที่นี่เข้ามาครอบงำข้า แค่ซ่อนตัว และลืมทุกสิ่งทุกอย่าง ความอยาก\n\n"
 legend_spread_events.0074.desc.mid.fallback: "จะเป็นอย่างไรถ้าข้าอยู่ที่นี่? ในความเงียบ หินและข้า หนูเป็นครั้งคราวเป็นผู้มาเยือนเพียงคนเดียวของข้า มีความสงบในนั้น\n\n"
 legend_spread_events.0074.desc.vassal: ""[ROOT.Char.GetTitledFirstNameNoTooltip]?" ร่างของ [wise_vassal.GetTitledFirstNamePossessive] ปรากฏขึ้นรอบมุม "ท่านกำลังทำอะไรอยู่ที่นี่? ช่างเป็นการเผชิญหน้าที่เป็นโชคชะตา ข้าเดินทางมาหลายวันหลายคืนเพื่อตามหาท่าน ตำนานของท่าน... ข้าต้องสารภาพว่ามัน ทำให้ข้าประทับใจ"\n\n"
 legend_spread_events.0074.desc.spouse: ""ที่รักของข้า..." [spouse.GetFirstName] ที่รักของข้ายืนอยู่ข้าง [wise_vassal.GetHerHim] "ข้าเป็นห่วงท่าน""
 legend_spread_events.0074.desc.fallback: "ข้าเดินตามทางเดินไปอย่างไร้จุดหมาย ไม่รู้จุดหมายปลายทาง ประมาท ความมืดทับถมความมืดทับถมความมืด หากข้าคู่ควรกับตำนานนี้... ข้าคงรู้สึกได้ ใช่ไหม? บางที บางที"
 legend_spread_events.0074.a: ""ที่รักของข้า... ข้าจะไม่ ทำให้ท่านผิดหวัง""
 legend_spread_events.0074.b: ""[wise_vassal.GetFirstNameNoTooltip] #EMP ท่าน#! ทำให้ข้าประทับใจ""
 legend_spread_events.0074.c: "ข้าไม่สามารถ ทำให้ประชาชนของข้าผิดหวังได้"
 legend_spread_events.0074.d: "[chancellor.GetTitledFirstNameNoTooltip] สามารถช่วยข้าในรายละเอียดทางการทูตได้"
 legend_chain_spouse_modifier: "การสนับสนุนอันล้ำค่า"
 legend_chain_spouse_modifier_desc: "ตัวละครนี้ประทับใจกับการสนับสนุนอันล้ำค่าของคู่สมรสต่อตำนานของตน"
 legend_chain_chancellor_modifier: "ตำนานอันคล่องแคล่ว"
 legend_chain_chancellor_modifier_desc: "ตัวละครนี้พึ่งพาความช่วยเหลือของอัครเสนาบดีเพื่อฟื้นความมั่นใจในตำนานของตน"
 
 legend_protagonist_legitimacy_miniscule_tt: "ท่านได้รับ [legitimacy|E] เพิ่มเติม #positive_value [SCOPE.ScriptValue('miniscule_legitimacy_gain')|0]#! จาก [legend_protagonist|E] ของท่าน"
 legend_protagonist_legitimacy_minor_tt: "ท่านได้รับ [legitimacy|E] เพิ่มเติม #positive_value [SCOPE.ScriptValue('minor_legitimacy_gain')|0]#! จาก [legend_protagonist|E] ของท่าน"
 legend_protagonist_legitimacy_medium_tt: "ท่านได้รับ [legitimacy|E] เพิ่มเติม #positive_value [SCOPE.ScriptValue('medium_legitimacy_gain')|0]#! จาก [legend_protagonist|E] ของท่าน"
 legend_protagonist_legitimacy_major_tt: "ท่านได้รับ [legitimacy|E] เพิ่มเติม #positive_value [SCOPE.ScriptValue('major_legitimacy_gain')|0]#! จาก [legend_protagonist|E] ของท่าน"

 legend_spread_events.5400.t: "การ แต่งเติมที่จำเป็น"
 legend_spread_events.5400.desc: ""หากข้าจะรบกวนท่านสักครู่ [ROOT.Char.Custom('FormOfAddressForLiege')]" [chronicler.GetFirstName] เริ่มต้น ด้วยน้ำเสียงออดอ้อนเล็กน้อยจนข้าไม่ชอบใจ "มันจะเป็นคุณประโยชน์อย่างใหญ่หลวงต่อเรา หากเราสามารถใส่รายละเอียดเพิ่มเติมลงใน [promoted_legend.GetName] ยิ่ง... #EMP ยิ่งใหญ่#! เท่าไหร่ ก็ยิ่งดี!" [chronicler.GetSheHe|U] มองข้าอย่างคาดหวัง\n\nเมล็ดพันธุ์แห่งการสมคบคิดเริ่มแตกหน่อในใจข้า การทบทวนเรื่องเล่าที่มีอยู่ด้วยรายละเอียดที่หรูหรามากขึ้นย่อมไม่เสียหาย แต่การแทนที่ส่วนนั้นของเรื่องเล่าด้วยเรื่องอื่นไปเลยก็มีข้อดีในตัวมันเอง..."
 legend_spread_events.5400.a: ""แน่นอน ข้าจะทบทวนมันอีกครั้ง!""
 legend_spread_events.5400.a.majorsuccess: "การ แต่งเติมของท่านเพิ่มเรื่องราวได้มาก"
 legend_spread_events.5400.a.minorsuccess: "การ แต่งเติมของท่านค่อนข้างเรียบง่าย"
 legend_spread_events.5400.b: ""อืม ท่านรู้ไหม มันมักจะถูกอ้างผิด..."
 legend_spread_events.5400.b.success: "การบิดเบือนของท่านน่าเชื่อถือ"
 legend_spread_events.5400.b.failure: "การปรับเปลี่ยนดูน่าสมเพชเล็กน้อย"
 legend_spread_events.5400.c: "บางทีอาจเป็นการดีที่สุดที่จะปล่อยให้เรื่องราวเติบโตตามธรรมชาติ?"

 legend_chapter_silver_tongued: "[ROOT.Legend.GetProtagonist.GetName|U] ถูกซุ่มโจมตีและก่อกวนครั้งแล้วครั้งเล่าโดยคนชั่วที่พยายามขัดขวาง [ROOT.Legend.GetProtagonist.GetHerHim] ในภารกิจอันชอบธรรมของ [ROOT.Legend.GetProtagonist.GetHerHis] อย่างไรก็ตาม ครั้งแล้วครั้งเล่า [ROOT.Legend.GetProtagonist.GetFirstName|U] ผู้มีไหวพริบก็เอาชนะพวกเขาและหลบหนีจากเงื้อมมือของพวกเขาได้"
 legend_chapter_easily_captured: "[ROOT.Legend.GetProtagonist.GetName|U] ถูกซุ่มโจมตีและก่อกวนครั้งแล้วครั้งเล่าโดยคนชั่วที่พยายามขัดขวาง [ROOT.Legend.GetProtagonist.GetHerHim] ในภารกิจอันชอบธรรมของ [ROOT.Legend.GetProtagonist.GetHerHis] หลายครั้งที่ [ROOT.Legend.GetProtagonist.GetFirstName|U] ถูกซุ่มโจมตีและต้องทนทุกข์ทรมานในที่คุมขัง ล่าช้าจากการไล่ตามเป้าหมายอันสูงส่งของ [ROOT.Legend.GetProtagonist.GetHerHis]"

 legend_spread_events.5405.t: "ข่าวลือจากป่า"
 legend_spread_events.5405.desc: ""เอาน่า [ROOT.Char.Custom('FormOfAddressForLiege')]!" [chronicler.GetFirstName] ยืนกรานในประเด็นหนึ่ง ขณะที่เรากำลังถกเถียงรายละเอียดเพิ่มเติมของ [promoted_legend.GetName]\n\n"ข้าต้องรู้- #EMP ผู้คน#! ต้องรู้" [chronicler.GetSheHe] ทำท่าทางยิ่งใหญ่ แต่ไร้จุดหมาย "ว่าข่าวลือเหล่านั้นมีจริงเพียงใด?" ข้าแทบจะอ้าปากถามไม่ทัน [chronicler.GetSheHe] ก็พูดต่อ\n\n"เรื่องที่ท่านเผชิญหน้ากับ [ROOT.Char.Custom('RegionalMythicalCreature')] อันทรงพลังในการเดินทางของท่านนั่นอย่างไร!""
 legend_spread_events.5405.a: ""ข้าทำจริงๆ!""
 legend_spread_events.5405.a.success: "เรื่องเล่าของท่านน่าสนใจ"
 legend_spread_events.5405.a.failure: "เรื่องเล่าของท่านขาดความน่าเชื่อถือ"
 legend_spread_events.5405.b: ""นั่นไร้สาระ แต่ข้า #EMP เห็น#! อย่างอื่น..."
 legend_spread_events.5405.b.success: "ท่านประสบความสำเร็จในการประดิษฐ์สัตว์ร้ายตัวใหม่ขึ้นมาทันที"
 legend_spread_events.5405.b.failure: "[chronicler.GetFirstNameNoTooltip] ไม่เชื่อท่าน"
 legend_spread_events.5405.c: ""ใครจะบอกได้? สิ่งมหัศจรรย์มากมายที่ข้าเห็น...""

 legend_chapter_discovery_mythical_beast: "ระหว่างการเดินทางของ [ROOT.Legend.GetProtagonist.GetHerHis] [ROOT.Legend.GetProtagonist.GetFirstName] ได้ค้นพบบางสิ่งที่ ทำให้ [ROOT.Legend.GetProtagonist.GetHerHim] สั่นสะเทือนไปถึงแก่น ตำนานเก่าแก่เกี่ยวกับสิ่งมีชีวิตในป่าและมหัศจรรย์ได้รับการพิสูจน์ว่าเป็นจริงเกินกว่าเงาแห่งความสงสัย และทุกคนต่างยกย่อง [ROOT.Legend.GetProtagonist.GetFirstName] สำหรับความกล้าหาญและจิตใจที่ใฝ่รู้ของ [ROOT.Legend.GetProtagonist.GetHerHis]"
 legend_chapter_discovery_new_myth: "ขณะที่ [ROOT.Legend.GetProtagonist.GetFirstName] ท่องไป [ROOT.Legend.GetProtagonist.GetSheHe] ได้พบเจอสิ่งที่เหนือกว่าความฝันใด ๆ ที่เคยมีเมื่อออกเดินทาง [ROOT.Legend.GetProtagonist.GetHerHis] สัตว์ประหลาดหายากและพิสดาร ขนาดใหญ่กว่าคนถึงสองเท่า มีหกขาและแขนงอกออกมาจากลำตัว! สัตว์ร้าย เช่นนี้ไม่เคยมีผู้ใดได้ยินมาก่อน และด้วยเหตุนี้ [ROOT.Legend.GetProtagonist.GetFirstName] จึงได้เพิ่มเรื่องราวเข้าไปในตำนานที่กำลังเติบโตของ [ROOT.Legend.GetName]"

 legend_spread_events.5410.t: "สิ่งที่อยู่ไกลออกไป?"
 legend_spread_events.5410.desc: "[ROOT.Char.Custom('GetWritingMaterialPlural')] ถูกเติมเต็มมากขึ้นเรื่อย ๆ ขณะที่ [chronicler.GetFirstName] บันทึกเรื่องราวของข้า การเดินทางข้ามเขาและลงหุบเขา ข้ามแม่น้ำอันยิ่งใหญ่ และแม้กระทั่ง...\n\n"ท่านเดินทางไปไกลถึงเพียงนั้นเชียวหรือ [ROOT.Char.Custom('FormOfAddressForLiege')]?" ดวงตาของ[chronicler.GetFirstNamePossessiveNoTooltip]เต็มไปด้วยความพิศวง "ไกลถึงมหาสมุทรอันป่าเถื่อนนั่น?"\n\nไม่มีผู้ใดรู้ว่าสิ่งใดอยู่นอกเหนือผืนน้ำที่ปลอดภัยและเป็นที่รู้จักของเรา อาจมีเพียงการคาดเดาที่เห็นพ้องต้องกันบ้าง แต่นี่คือโอกาสของข้าที่จะปั่นเรื่องของตัวเองหรือไม่?"
 legend_spread_events.5410.a: ""มีทวีปใหญ่อีกแห่งหนึ่ง ที่ ซึ่งผลไวน์เบอร์รี่เติบโต..."
 legend_spread_events.5410.a.flavor: "ข่าวลือ เช่นนี้แพร่สะพัดมาหลายปีแล้ว ท้ายที่สุด..."
 legend_spread_events.5410.a.success: "ข่าวการค้นพบของท่านแพร่กระจายราวกับไฟป่า"
 legend_spread_events.5410.a.failure: "[chronicler.GetFirstNameNoTooltip] ดูไม่แน่ใจกับการเปิดเผย"
 legend_spread_events.5410.b: "สัตว์ประหลาดดุร้ายอาศัยอยู่ในห้วงลึกอันเอาแน่เอานอนไม่ได้เหล่านั้น!"
 legend_spread_events.5410.c: "การสำรวจของเราถูกหยุดยั้งโดยการต่อสู้กับโจรสลัดที่ดุร้าย"
 legend_spread_events.5410.d: ""ที่นั่น? ไม่มีอะไรนอกจากมหาสมุทรและความตายที่มากขึ้น""

 sea_monsters_modifier: "สัตว์ประหลาดทะเล"
 sea_monsters_modifier_desc: "ตัวละครนี้ได้เห็นและต่อสู้กับยักษ์ใหญ่แห่งห้วงลึก"

 legend_chapter_discovery_vinland: "ขณะที่ [ROOT.Legend.GetProtagonist.GetFirstName] เดินทาง [ROOT.Legend.GetProtagonist.GetSheHe] ได้ค้นพบบางสิ่งที่ก่อนหน้านี้มีเพียงข่าวลือและพูดถึงอย่างเพ้อฝัน วินแลนด์ในตำนาน ดินแดนอันยิ่งใหญ่ทางตอนเหนือที่หนาวเหน็บ ไม่เพียง แต่มีอยู่จริง แต่ยังสามารถอาศัยอยู่ได้! แท้จริงแล้ว เรื่องราวอันยิ่งใหญ่จะมีบุคคลอื่นจารึกไว้อีกครั้ง คราวนี้พูดถึง [ROOT.Legend.GetProtagonist.GetFirstName]"
 legend_chapter_sea_monsters: "การเดินทางที่ [ROOT.Legend.GetProtagonist.GetFirstName] ได้ทำ ส่ง [ROOT.Legend.GetProtagonist.GetHerHim] ข้ามทะเล และ [ROOT.Legend.GetProtagonist.GetSheHe] ได้เห็นภาพที่น่าสะพรึงกลัวอย่างแท้จริง สัตว์ประหลาดทะเลยักษ์ที่ดิ้นรนรุมล้อมพวกเขาจากทุกทิศทาง และมีเพียงความสามารถในการเดินเรือของ [ROOT.Legend.GetProtagonist.GetFirstName] เท่านั้นที่นำพวกเขากลับบ้านได้อย่างปลอดภัย"

 legend_spread_events.5415.t: "คนธรรมดา?"
 legend_spread_events.5415.desc: "เรื่องเล่าอันยอดเยี่ยมของ [ROOT.Char.GetPromotedLegend.GetName] ยังคงแพร่กระจายต่อไป ผู้คนจากทุกชนชั้นในสังคมเริ่มที่จะถักทอมุมมองของตนเองเข้าไปในพรมอันอุดมสมบูรณ์ของมัน อย่างน้อย [chronicler.GetFirstName] ก็กล่าว เช่นนั้น\n\n"ลอร์ดและเลดี้ต่างก็มั่นใจว่าเรื่องเล่า เช่นนี้กำหนดสิทธิ์อันไม่อาจปฏิเสธได้ในการปกครองของพวกเขา" [chronicler.GetSheHe] ครุ่นคิด "แต่ถ้าท่านเดินเข้าไปในโรงเตี๊ยมท้องถิ่น มันจะเต็มไปด้วยผู้ที่กล่าวว่ามันอุทิศให้กับชาวบ้านธรรมดาของแผ่นดินและวิถีทางที่ซื่อสัตย์และขยันหมั่นเพียรของพวกเขา""
 legend_spread_events.5415.a: "มัน #EMP ชัดเจน#! ว่าเป็นเรื่องเล่าของขุนนาง"
 legend_spread_events.5415.b: "แน่นอนว่ามันเกี่ยวกับชาวบ้าน!"
 legend_spread_events.5415.c: "เห็นได้ชัดว่ามันเป็นเรื่องเล่าเกี่ยวกับ [protagonist.GetFirstNameNoTooltip] ไม่มีใครอื่น!"
 legend_spread_events.5415.c.protag: "...ท่านไม่ได้จดชื่อ #EMP ของข้า#! ลงไปมากพอหรือ?"

 legend_nobles_noted: "ขุนนาง, ถูกบันทึก"
 legend_nobles_noted_desc: "เรื่องเล่านี้เน้นไปที่วีรกรรมของขุนนาง และเสริมสร้างสิทธิ์ในการปกครองของพวกเขา"

 legend_commoners_celebrated: "สามัญชน, ได้รับการเฉลิมฉลอง"
 legend_commoners_celebrated_desc: "เรื่องเล่านี้เน้นไปที่ชาวนาที่ทำงานหนัก เสริมสร้างขวัญกำลังใจของพวกเขา"

 legend_spread_events.5420.t: "การดื่มในตำนาน"
 legend_spread_events.5420.desc: "[chronicler.GetFirstName] ยังคงจดบันทึกเรื่องเล่าเพิ่มเติมจาก [ROOT.Char.GetPromotedLegend.GetName] จนกระทั่งทันใดนั้น [chronicler.GetSheHe] ก็หยุดชั่วคราว รอยยิ้มเจ้าเล่ห์บนริมฝีปากของ [chronicler.GetHerHis]\n\n"ตอนนี้ ข้าได้ยินเรื่องราว #EMP ที่น่าสนใจ#! เรื่องหนึ่ง" [chronicler.GetSheHe] เริ่มต้นอย่างช้าๆ "เกี่ยวกับการแข่งขันดื่มเหล้ากับยักษ์กินคน ไม่น่าเชื่อ! วีรสตรี/วีรบุรุษ [ROOT.Char.Custom('GetHeroineHero')] ของเราทำได้อย่างไร ที่สามารถดื่มสิ่งมีชีวิต เช่นนั้นจนเมาหัวราน้ำได้! บางทีการสาธิตอาจ ทำให้ข้าซาบซึ้งในความสำเร็จ เช่นนั้นอย่างแท้จริง?"\n\nข้าไม่รู้ว่าเรื่องเล่าที่เกินจริงนี้มาจากไหน แต่ความภาคภูมิใจจำนวนหนึ่งเริ่มที่จะ ทำให้รู้สึกจั๊กจี้..."
 legend_spread_events.5420.a: "เอาถังมาให้ข้า แล้วข้าจะพิสูจน์!"
 legend_spread_events.5420.a.success: "ท่านดื่มหมดทั้งถัง"
 legend_spread_events.5420.a.failure: "ท่านหมดสติหลังจากดื่มไปไม่กี่ถ้วย"
 legend_spread_events.5420.b: "มันเกิดขึ้นแล้ว ท่านควรจะเชื่อ!"
 legend_spread_events.5420.b.success: "[chronicler.GetFirstNameNoTooltip] เชื่อ"
 legend_spread_events.5420.b.failure: "[chronicler.GetFirstNameNoTooltip] ยังคงไม่เชื่อ"
 legend_spread_events.5420.c: "ข้า... มัน... ข้าเป็น #EMP หวัด#! ที่แย่มากตอนนี้..."
 legend_spread_events.5420.c.tt: "ท่านสร้างชื่อเสียง"

