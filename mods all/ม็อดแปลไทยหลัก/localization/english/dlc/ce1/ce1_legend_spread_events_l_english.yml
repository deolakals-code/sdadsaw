l_english: 

legend_debug.0001.desc: "#D นี่คือเหตุการณ์ดีบัก#!"

legend_spread_events.0001.t: "เสียงอันไร้เดียงสา"
legend_spread_events.0001.desc: "[chronicler.GetFirstName] [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('chronicler'))] ของข้า ต้อนรับข้าด้วยรอยยิ้มอันกว้างขวางในห้องสมุดของ [chronicler.GetHerHis]\n\n"[ROOT.Char.Custom('FormOfAddressForLiege')|U] ในความพยายามของเราที่จะจดบันทึกตำนานของท่าน เราได้คิดที่จะส่งเด็ก ๆ ไปรอบ ๆ ตลาด เพื่อสรรเสริญวีรกรรมของ [ancestor.GetName] ขอรับ""
legend_spread_events.0001.a: ""ส่งพวกเขาออกไปทันที!""
legend_spread_events.0001.b: ""เราไม่มีทางพิสูจน์ได้ จงทำอย่างสุขุม""
legend_spread_events.0001.c: ""อันที่จริง... [my_child.GetShortUIName] สามารถเข้าร่วมกับพวกเขาได้""
legend_spread_events.0001.d: ""ข้าคือตำนาน #EMP ของข้า#! เอง""
legend_spread_events.0001.a.tt.success: "คำพูดของท่านดูน่าเชื่อถือ"
legend_spread_events.0001.a.tt.failure: "ไม่มีใครเชื่อเด็กๆ"
legend_my_own_ancestor_modifier: "ตำนานของข้าเอง"
legend_my_own_ancestor_modifier_desc: "ตัวละครนี้ถูกกำหนดให้กลายเป็นบรรพบุรุษในตำนานของตนเอง"

legend_spread_events.0010.t: "นักล่าที่แท้จริง"
legend_spread_events.0010.desc: "เสียงอันไพเราะดึงดูดความสนใจของข้าทันทีที่ข้าเปิด [ROOT.Char.Custom('GetDoor')] ของโถง [ROOT.Char.Custom('GetFollowerOrVassalPlural')] บางคนของข้าได้ล้อมรอบ [bard.GetFirstName] [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('bard'))] ของข้า ผู้ ซึ่งกำลังเล่น [bard.Custom('GetMusicalInstrument')] ของ [bard.GetHerHis] เกือบจะปีนขึ้นไปบนโต๊ะด้วยอารมณ์\n\n"และนี่คือ [ROOT.Char.GetSheHe]!" [bard.GetSheHe] ร้องออกมา "ท่าน [ROOT.Char.GetTitleAsNameNoTooltip] ของเราเอง ผู้ ซึ่งตำนานข้าขับขานอย่างกระตือรือร้น เพราะ [ROOT.Char.GetSheHe] ด้วยมือของ [ROOT.Char.GetHerHis] เอง ได้สังหาร..."
legend_spread_events.0010.a: "...มังกร!"
legend_spread_events.0010.a.tt.success: "ทั้งโถงโห่ร้อง!"
legend_spread_events.0010.a.tt.failure: "คำโกหกของท่านชัดเจนเกินไป"
legend_spread_events.0010.b: "...สัตว์ร้าย #EMP ตัวมหึมา#!"
legend_spread_events.0010.b.tt.success: "เหล่าข้าราชสำนักร้องเพลงไปกับท่าน"
legend_spread_events.0010.c: "...แค่หมีที่น่ารักตัวหนึ่ง"
legends_dragon_slayer: "ล่ามังกร"
legends_dragon_slayer_desc: "ตัวละครนี้อ้างว่าได้ล่ามังกร"

legend_spread_events.0020.t: "การสร้างข่าวลือ"
legend_spread_events.0020.desc.intro: "ขณะที่ข้าเดินลงบันไดและข้ามลาน ข้ามาถึงทางเดินแห่งหนึ่ง ซึ่งปกติพวกคนใช้จะเฝ้าดูเด็กๆ\n\nแต่ไม่ใช่พวกเขาที่ข้าพบ เสียงของ [courtier.GetTitledFirstNamePossessive] ดังมาถึงข้า ชัดเจน และข้าซ่อนตัวอยู่ท่ามกลางเสาหิน:\n\n"แล้ว [protagonist.GetTitledFirstName] ทำอะไรไปบ้างล่ะ? มีพวกเราคนไหนอยู่ที่นั่นเพื่อเห็นสิ่งที่เรียกว่า #EMP ตำนาน#! ของ [ROOT.Char.GetHerHis] ที่"
legend_spread_events.0020.desc.you_protag: "[ROOT.Char.GetSheHe]"
legend_spread_events.0020.desc.other_protag: "[ROOT.Char.GetTitledFirstName]"
legend_spread_events.0020.desc.outro: "ภูมิใจนักหนา ทำให้เราต้องขับขานตอนนี้?""
legend_spread_events.0020.a: "[courtier.GetSheHe|U] อยากจะพูดอะไรก็พูดไป ในคุกใต้ดิน"
legend_spread_events.0020.b: ""เจ้า! ตรงนั้น!""
legend_spread_events.0020.b.tt.success: "[courtier.GetShortUINameNoTooltip] ขออภัย"
legend_spread_events.0020.b.tt.failure: "[courtier.GetShortUINameNoTooltip] รู้สึกขุ่นเคือง"
legend_spread_events.0020.c: "แกล้งทำเป็นไม่ได้ยินอะไรดีกว่า..."
legend_put_out_rumors_modifier: "ตำนานที่ถูกจัดการ"
legend_put_out_rumors_modifier_desc: "ตัวละครนี้ได้จัดการกับข่าวลือที่สงสัยในตำนานของตน"
legend_sus_rumors_modifier: "ตำนานที่น่าสงสัย"
legend_sus_rumors_modifier_desc: "ตำนานที่ตัวละครนี้อ้างถึงถูกสงสัยโดยข้าราชสำนักของตน"

legend_spread_events.0030.t: "ท่านจำได้หรือไม่?"
legend_spread_events.0030.desc.intro: ""เช่นนั้น บอกข้าเถิด [ROOT.Char.Custom('FormOfAddressForLiege')]" เสียงของ[chronicler.GetFirstNamePossessive] [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('chronicler'))] ของข้า ดึงข้าออกจากภวังค์ความคิด และข้าพบว่า [chronicler.GetHerHim] กำลังโบกมือของ [chronicler.GetHerHis] ปากกาขนนกทำหมึกหกเรี่ยราดบนพื้น\n\n"
legend_spread_events.0030.desc.you_protag: ""แล้วตอนที่ [legend_memory.GetSecondPerspectiveDescription] ล่ะ? นั่นคุ้มค่าที่จะเพิ่มเข้าไปในตำนานของท่านอย่างแน่นอน...""
legend_spread_events.0030.desc.other_protag: ""แล้วตอนที่ [legend_memory.GetThirdPerspectiveDescription] ล่ะ? นั่นคุ้มค่าที่จะเพิ่มเข้าไปในตำนานของ [protagonist.GetHerHis] อย่างแน่นอน...""
legend_spread_events.0030.a: ""ครั้งที่แล้วท่านไม่ได้ยินข้าหรือ?""
legend_spread_events.0030.a.flavor: "#EMP หาว...#! ข้ามีเรื่องอื่นที่ดีกว่าให้ทำ"
legend_spread_events.0030.b: "อา นั่นเป็นโอกาสที่ #EMP ยอดเยี่ยม#! จริงๆ..."
legend_spread_events.0030.b.tt.success: "ทุกคนจำวีรกรรมอันยิ่งใหญ่ของท่านได้"
legend_spread_events.0030.b.tt.failure: "ผู้คนดูไม่ค่อยเชื่อ"
legend_spread_events.0030.c: "ข้าไม่รู้สึกว่าจำเป็นต้องพูดถึงมันอีก"
humble_content_courtiers_and_guests: "[courtiers|E] และ [guests|E] ที่ [GetTrait('humble').GetName( GetNullCharacter )] หรือ [GetTrait('content').GetName( GetNullCharacter )] ทั้งหมด"
legend_lazy_modifier: "ไม่ใช่ธุระของข้า"
legend_lazy_modifier_desc: "ตัวละครนี้ปล่อยให้การบันทึกรายละเอียดปลีกย่อยของตำนานของตนเป็นหน้าที่ของผู้อื่น"
legend_memory_deed_modifier: "ความทรงจำล่าสุด"
legend_memory_deed_modifier_desc: "วีรกรรมอันน่าทึ่งของตัวละครนี้ยังคงอยู่ในความทรงจำของผู้คนของตน"

legend_spread_events.0040.t: "คำร้องขออันโศกเศร้า"
legend_spread_events.0040.desc.intro: ""อา แสงสว่างสาดส่องอย่างน่าอภิรมย์ใน [SelectLocalization(IsLandlessAdventurer(ROOT.Char),'room_command_tent','room_throne_room')] เช้านี้ [ROOT.Char.Custom('FormOfAddressForLiege')]" [chronicler.GetFirstName] [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('chronicler'))] ของข้า เอ่ย ขณะเดินไปรอบ ๆ [ROOT.Char.Custom('GetRoom')]\n\n"มันช่าง ทำให้ข้านึกถึงวันที่โชคชะตาตัดสินใจเริ่มต้น"
legend_spread_events.0040.desc.you_protag: "ตำนานของท่าน... ท่านจำได้ไหมว่าท่านมีเมตตาเพียงใด"
legend_spread_events.0040.desc.other_protag: "ตำนานของ [protagonist.GetTitledFirstNamePossessive]... ท่านจำได้ไหมว่า [ROOT.Legend.GetProtagonist.GetSheHe] มีเมตตาเพียงใด"
legend_spread_events.0040.desc.outro: "ในการรับฟังคำวิงวอนอันสิ้นหวังของชาวนาผู้นั้น?" [chronicler.GetSheHe] กล่าว พร้อมขยิบตาอย่างมีความหมาย"
legend_spread_events.0040.a: ""#EMP ข้า#! เนี่ยนะจะฟังชาวนา?""
legend_spread_events.0040.b: ""อา ช่างเป็นจิตวิญญาณที่เคร่งศาสนาอะไร เช่นนี้!""
legend_spread_events.0040.b.tt.success: "ความศรัทธาของท่านน่าประทับใจ"
legend_spread_events.0040.b.tt.failure: "ความศรัทธาของท่านเป็นเรื่องโกหกอย่างชัดเจน"
legend_spread_events.0040.c: ""นั่นจะเพิ่มอะไรได้?""

legend_spread_events.0050.t: "ในการรับใช้ [honored_lady.GetLadyLord|U]"
legend_spread_events.0050.desc: ""#EMP และ [ROOT.Legend.GetProtagonist.GetSheHe] ก็องอาจ\nและ [honored_lady.GetSheHe] ก็งดงาม\nและ [ROOT.Legend.GetProtagonist.GetSheHe] ก็เป็นวีรบุรุษ\nและ [honored_lady.GetSheHe] ก็งดงามมมมม!#!"\n\nใช้เวลาไม่นานในการค้นหาว่าดนตรีมาจากไหน ในไม่ช้าข้าก็พบ [bard.GetTitledFirstName] กำลังตั้งสายเครื่องดนตรีของ [bard.GetHerHis] อย่างสนุกสนาน พิงอยู่บนม้านั่งหิน\n\n"อา ฝ่าบาท [ROOT.Char.GetLadyLord] ของข้า" ดวงตาของ [bard.GetHerHis] เป็นประกายทันที "จริงหรือไม่ที่เหตุผลของตำนานของท่านคือเพื่อสร้างความประทับใจให้ [honored_lady.GetTitledFirstName]?""
legend_spread_events.0050.a: ""เจ้ากล้าดียังไง!? ข้า #EMP แต่งงานแล้ว#!!""
legend_spread_events.0050.b: ""[honored_lady.GetSheHe|U] งดงามจริงๆ..."
legend_spread_events.0050.b.tt.success: "ท่าทีของท่านสร้างความประทับใจให้ [honored_lady.GetFirstNameNoTooltip]"
legend_spread_events.0050.b.tt.failure: "ท่าทีของท่าน ทำให้ [honored_lady.GetFirstNameNoTooltip] รังเกียจ"
legend_spread_events.0050.c: ""ข้าทำเพื่อตัวเอง""

legend_spread_events.0060.t: "มากกว่าตำนานคือเรื่องปรัมปรา"
legend_spread_events.0060.desc.intro: ""ขอเรียนสักครู่ ใต้ฝ่า [ROOT.Char.GetLadyLord|U] ของข้า" [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('courtier'))] [courtier.GetFirstName] เข้ามาหาข้า ด้วยสีหน้ากังวลบนใบหน้าของ [courtier.GetHerHis] "มันเกี่ยวกับเรื่อง"
legend_spread_events.0060.desc.you_protag: "ของท่าน"
legend_spread_events.0060.desc.other_protag: "ของ [ROOT.Legend.GetProtagonist.GetShortUINamePossessive]"
legend_spread_events.0060.desc.outro: "ตำนาน... มีคนได้ยิน [bad_vassal.GetTitledFirstName] สงสัยในเรื่องนี้ การซุบซิบนินทาในราชสำนักเริ่มสะท้อนคำพูดของ [bad_vassal.GetHerHim]"\n\n"หากท่านไม่หยุดมันให้ทันเวลา ข้าเกรงว่าชาวนาทุกคนในอาณาจักรนี้จะเชื่อว่ามันเป็นเรื่องโกหก""
legend_spread_events.0060.a: ""ไอ้ [bad_vassal.Custom2('InsultNoun', ROOT.Char)] ที่น่ารำคาญนั่น...""
legend_spread_events.0060.b: "คำพูดของข้าแข็งแกร่งกว่าของ [bad_vassal.GetHersHis]"
legend_spread_events.0060.b.tt.success: "ผู้คนเชื่อท่าน"
legend_spread_events.0060.b.tt.failure: "[bad_vassal.GetShortUIName] เป็นที่เชื่อถือ"
legend_spread_events.0060.c: "กล้าหาญนักที่ [bad_vassal.GetHerHim] ลองดีกับข้า..."
legend_spread_events.0060.d: "ปล่อยให้พวกเขาพูดไป"
legend_no_mocking_modifier: "ตำนานที่ได้รับความเคารพ"
legend_no_mocking_modifier_desc: "ตัวละครนี้ ทำให้การเยาะเย้ยตำนานของตนหยุดลงทันที"
legend_extra_mocking_modifier: "ตำนานที่ถูกเยาะเย้ย"
legend_extra_mocking_modifier_desc: "ตำนานของตัวละครนี้ถูกเยาะเย้ยโดยคนจำนวนมาก"
not_believable_modifier: "ทรยศอย่างเปิดเผย"
not_believable_modifier_desc: "คำโกหกของตัวละครนี้ต่อเจ้าเหนือหัวของตนถูกจับได้และย้อนกลับมาทำร้ายตนเอง"

legend_spread_events.5000.t: "รากฐานที่มั่นคง"
legend_spread_events.5000.desc: "ดวงอาทิตย์ส่องแสงเจิดจ้าลงมาใน [capital.GetName] ขณะที่ [chronicler.GetFirstName] และข้าเดินเตร่ไปตามถนนที่พลุกพล่าน เป็นถิ่นฐานที่ดี\n\nเป็นถิ่นฐานที่ดี #EMP มาก#! ทีเดียว ข้าคิด พลางมองไปรอบๆ งานก่ออิฐอันประณีตบนซุ้มประตูที่เราเดินผ่าน [chronicler.GetFirstNameNoTooltip] สังเกตเห็นสายตาของข้า\n\n"เป็นเกียรติแก่บรรพบุรุษของชนชาตินี้ที่พวกเขาสร้างสถานที่แห่งนี้ขึ้นมา" [chronicler.GetSheHe|U] เริ่มต้น "เป็นเกียรติมากเสียจนบางครั้งท่านสงสัยว่าพวกเขาทำมันจริงหรือไม่...""
legend_spread_events.5000.a: ""สถาปัตยกรรมนี้ #EMP เห็นได้ชัด#! ว่าไม่ใช่ต้นกำเนิดของ [culture.GetNameNoTooltip]!""
legend_spread_events.5000.b: "แน่นอนว่านี่ #EMP ต้อง#! สร้างโดยผู้ที่ไม่ใช่ [culture.GetCollectiveNounNoTooltip]?"
legend_spread_events.5000.b.tt.success: "ผู้คนดูเหมือนจะเชื่อ"
legend_spread_events.5000.b.tt.failure: "ชาวบ้านผู้หยิ่งทะนงปฏิเสธคำกล่าวอ้างของท่านอย่างโกรธเคือง"
legend_spread_events.5000.c: "แน่นอนว่างานก่ออิฐ เช่นนี้สามารถนำไปใช้ประโยชน์ได้ดีกว่านี้?"
legend_spread_events.5000.d: "บรรพบุรุษเหล่านั้นเป็นคนที่ขยันหมั่นเพียรอย่างแท้จริง"

legend_spread_events.5005.t: "พรจาก [parent.Custom('MotherFatherPossessive')|U]"
legend_spread_events.5005.desc: "การได้พบกับ [parent.GetMotherFather] [parent.GetFirstName] ของข้าเป็นความสุขที่หาได้ยากขึ้นในทุกวันนี้ แต่ที่นี่เราพบกันในสถานที่สักการะแห่งนี้ [chronicler.GetFirstName] รักษาระยะห่างอย่างให้เกียรติอยู่ด้านข้างขณะที่เราทักทายกัน\n\n"[ROOT.Char.GetFirstName]! ช่างน่าประหลาดใจ!" [parent.GetSheHe|U] ร้องออกมา โอบกอดข้า [parent.GetSheHe|U] ยิ้มอย่างอาลัยอาวรณ์ มองไปรอบๆ กำแพง "นี่ ทำให้ข้ารู้สึกเหมือนกลับไปเป็นหนุ่มสาวอีกครั้ง เจ้าเป็นเด็กที่เคร่งศาสนาเสมอ เจ้าเคยรู้ไหมว่าตอนที่เจ้ายังเป็นทารก เจ้าปฏิเสธที่จะกินอาหารในวันศักดิ์สิทธิ์?"\n\nข้า... ไม่รู้เรื่องนั้น ไม่"
legend_spread_events.5005.regular: "หางตาของข้า ข้าเห็น [chronicler.GetFirstNameNoTooltip] เริ่มเอื้อมมือไปหยิบ [ROOT.Char.Custom('GetWritingMaterial')] ของ [chronicler.GetHerHis]"
legend_spread_events.5005.parent_chronicler: "บางที ในฐานะผู้บันทึกเหตุการณ์ของข้า [parent.Custom('MotherFather')] ที่รักของข้าอาจจะถูกชักชวนให้จดบันทึกเรื่องนั้นลงไป?"
legend_spread_events.5005.a: ""[parent.Custom('MotherFather')|U] ได้โปรด ท่าน ทำให้ข้าอับอาย!""
legend_spread_events.5005.b: ""ได้โปรด เตือนความจำข้าที?""
legend_spread_events.5005.b.tt: "อืม นี่อาจช่วยเรื่องของข้าได้..."
legend_spread_events.5005.c: "พอเรื่องข้าแล้ว ท่าน #EMP เป็นอย่างไรบ้าง#! [parent.Custom('MotherFather')]?"

legend_spread_events.5010.t: "วางมือ"
legend_spread_events.5010.desc: "[chronicler.GetFirstName] นักพงศาวดารของข้า ถูกชนจนกระเด็น เมื่อร่างประหลาดร่างหนึ่งโซซัดโซเซเข้ามาหาข้าบนถนน ทหารยามของข้าก้าวเข้าขวางและจ่ออาวุธ แต่ชัดเจนว่าวิญญาณผู้น่าสงสารนี้มิได้ตั้งใจมาทำร้ายข้า\n\n"ได้โปรด!" ลมหายใจของ [sick.GetHerHis|U] แหบพร่าขณะที่ [sick.GetSheHe] เอ่ย "ข้าป่วยหนัก นี่คือทั้งหมดที่ข้าทำได้เพื่อออกมาที่นี่ เมื่อข้าเห็นท่านผ่านมา [ROOT.Char.Custom('FormOfAddressForLiege')]!"\n\n"ข้า... ได้ยินเรื่องปาฏิหาริย์ที่ท่านกระทำได้ เพียงสัมผัสเดียวเท่านั้นที่ข้าต้องการ!" [sick.GetSheHe|U] โซเซเข้ามาใกล้ แขนยื่นออกมาอย่างอ้อนวอน"
legend_spread_events.5010.a: ""ท่านต้องบริจาคให้กับผู้ที่ขัดสนกว่า""
legend_spread_events.5010.a.tt: "หากไม่มีอะไรอื่น การสนับสนุนการบริจาคให้กับผู้ขัดสนจะ ทำให้ #EMP ข้า#! ดูดี..."
legend_spread_events.5010.b: "อืม ถ้ามันได้ผล..."
legend_spread_events.5010.b.criticalsuccess: "บุคคลนั้นหายดี"
legend_spread_events.5010.b.success: "พวกเขาบอกว่ารู้สึกดีขึ้นบ้างแล้ว"
legend_spread_events.5010.b.failure: "ดูเหมือนจะไม่มีการเปลี่ยนแปลงใดๆ เลย"
legend_spread_events.5010.c: ""ได้โปรด ท่านต้องไปรับการรักษาที่เหมาะสม ที่โรงพยาบาลท้องถิ่น""

legend_spread_events.5015.t: "มรดกตกทอดเปื้อนเลือด"
legend_spread_events.5015.desc: "ข้าทดสอบคมดาบ ขณะที่ [chronicler.GetFirstName] นักพงศาวดารของข้า และข้า ตรวจตราคลังอาวุธใน [SelectLocalization( IsLandlessAdventurer( ROOT.Char ), 'my camp', 'location.GetName')] มันคมกริบและลับมาอย่างดี ทว่า [chronicler.GetFirstNameNoTooltip] กลับสนใจอาวุธอีกชิ้นที่แขวนอยู่บนผนัง\n\n"ข้าได้ยินเรื่องเล่ามากมายเกี่ยวกับอาวุธอันทรงพลังนี้ [ROOT.Char.Custom('FormOfAddressForLiege')]" [chronicler.GetSheHe|U] เอ่ยอย่างชื่นชม "ข้าได้ยินว่ามันสังหารคนไปครึ่งโหลด้วยน้ำมือท่านเพียงผู้เดียว!\n\n[artifact.GetName] แขวนอยู่อย่างสงบนิ่ง เป็นความจริงที่มันเป็นอาวุธคู่ใจและสังหารได้อย่างร้ายกาจมาตลอดอายุขัยของมัน คมดาบของมันอาบเลือดศัตรูครั้งแล้วครั้งเล่า คมดาบที่ดี คมดาบสีชาด"
legend_spread_events.5015.a: ""และมันจะคร่าชีวิตอีกมากมาย""
legend_spread_events.5015.b: ""อืม นั่นเป็นเพียงคนที่ข้าจำได้..."
legend_spread_events.5015.b.success: "เรื่องราวของอาวุธเติบโตขึ้น"
legend_spread_events.5015.b.failure: "บางคนมองเรื่องเล่าด้วยความสงสัย"
legend_spread_events.5015.c: ""ไม่มากไปกว่านั้นหรอก [chronicler.GetFirstNameNoTooltip]""
legend_spread_events.5015.c.tt: "[artifact.GetName] ได้รับตัวปรับ แต่งเชิงบวกแบบสุ่ม"

legend_spread_events.5020.t: "มลทิน"
legend_spread_events.5020.desc: "การเดินทางร่วมกันของเราไปตาม [SelectLocalization( IsLandlessAdventurer( ROOT.Char ), 'the camp', 'a corridor')] ในยามโพล้เพล้อันมืดสลัว ถูกขัดจังหวะโดย [chronicler.GetFirstName] นิ้วของ [chronicler.GetHerHis] ชี้ตรงมายังมือของข้าที่ถือตะเกียง\n\n"[ROOT.Char.Custom('FormOfAddressForLiege')|U]!" [chronicler.GetSheHe|U] อุทาน เสียงของ [chronicler.GetHerHis] สั่นเครือ "รอยนั่น บนมือท่าน! นั่นคือ... รอยแผลศักดิ์สิทธิ์หรือ?"\n\nข้าชำเลืองมองมือของข้า รอยด่างขนาดใหญ่ปกคลุมหลังมือ ตามจริงแล้ว ข้าแทบมิได้สังเกตเห็นมันด้วยซ้ำ ทว่า [chronicler.GetFirstNameNoTooltip] กลับจินตนาการไปไกลแล้ว\n\n"เราต้องบันทึกเรื่องนี้! ผู้คนต้องรู้! ท่านมีบาดแผลศักดิ์สิทธิ์ของพระคริสต์!""
legend_spread_events.5020.a: ""ท่านรู้ไหมว่าข้ามีอีกแผลที่ข้างลำตัวด้วย?""
legend_spread_events.5020.a.tt: "แผลเป็นเก่า บางทีมันอาจมีความหมาย?"
legend_spread_events.5020.b: "มัน #EMP น่าสนใจ#! ทีเดียว..."
legend_spread_events.5020.c: ""มันเป็นแค่รอยเก่าๆ [chronicler.GetFirstNameNoTooltip]""

legend_spread_events.5025.t: "ตำราฝุ่นเขรอะ"
legend_spread_events.5025.desc: "ความสงบเงียบใน [SelectLocalization( IsLandlessAdventurer( ROOT.Char ), 'tent', 'study')] ของข้า ถูกทำลายลงอย่างสิ้นเชิง เมื่อ [chronicler.GetFirstName] พรวดพราดเข้ามา แขนโอบอุ้มสิ่งที่ดูเหมือน [ROOT.Char.Custom('GetWritingMaterial')] เก่าแก่\n\n"[ROOT.Char.Custom('FormOfAddressForLiege')|U]!" [chronicler.GetSheHe|U] ร้อง "ดูเถิด ดูเถิด! เราพบคัมภีร์โบราณ!" [chronicler.GetSheHe] วางมันโครมลงบนโต๊ะของข้า แล้วใช้นิ้วจิ้มไปที่มันอย่างตื่นเต้น\n\n"มันเป็นภาษาโบราณที่เรามิอาจถอดความได้ แต่ท่าน..." [chronicler.GetSheHe] มองข้าอย่างเลื่อมใส "ท่านอาจจะทำได้! มันต้องเป็นผลงานของบรรพบุรุษท่านแน่!""
legend_spread_events.5025.a: ""ท่านพูดถูก [chronicler.GetFirstNameNoTooltip]! นี่แปลง่ายมาก!""
legend_spread_events.5025.b: "มาดูกันว่าข้าจะทำได้แค่ไหน..."
legend_spread_events.5025.b.success: "ท่านสามารถแปลมันได้"
legend_spread_events.5025.b.failure: "ภาษานั้นยากเกินกว่าที่ท่านจะเข้าใจ"
legend_spread_events.5025.c: ""ดูเหมือนจะไม่ใช่ภาษาของบรรพบุรุษข้า ข้าเกรงว่า""

legend_spread_events.5030.t: "มิตรในที่สูง"
legend_spread_events.5030.desc: "แม้ว่าภาระในการปกครองอาณาจักรจะไม่ค่อย ทำให้เส้นทางของเรามาบรรจบกัน โอกาสหนึ่งได้นำพา [vassal.GetFirstName] และข้ามาพบกัน [vassal.GetSheHe|U] ทักทายข้าอย่างอบอุ่น พร้อมประกายในดวงตาของ[vassal.GetHerHis]ราวกับรู้อะไรบางอย่าง\n\n"[ROOT.Char.GetFirstName] [ROOT.Char.Custom('FormOfAddressForLiege')]! ยินดียิ่งที่ได้พบท่าน!" [vassal.GetFirstNameNoTooltip] ตบไหล่ข้า "ท่านรู้หรือไม่ ข้าได้ยินเรื่องเล่า #EMP น่าทึ่ง#! เกี่ยวกับท่านเมื่อเร็ว ๆ นี้?" [vassal.GetSheHe|U] ยิ้มกว้างเมื่อเห็นข้าอึดอัดเล็กน้อย\n\n"ข้าค่อนข้างเพลิดเพลินกับมันทีเดียว บางทีท่านอาจช่วยเติมรายละเอียดให้ข้าฟังบ้าง?""
legend_spread_events.5030.a: ""ข้าจะเป็นหนี้บุญคุณหากท่านจะช่วยเผยแพร่ข่าว!""
legend_spread_events.5030.b: ""แน่นอน ตอนนี้ ครั้งหนึ่งข้า-""
legend_spread_events.5030.c: ""ยินดีที่ได้พบท่าน [vassal.GetFirstNameNoTooltip]""

legend_spread_events.5035.t: "เรื่องครอบครัว"
legend_spread_events.5035.desc: ""มันน่าสงสัยมาก ฝ่าบาท น่าสงสัยจริงๆ ข้าไม่แน่ใจว่าจะเข้าใจมันได้อย่างไร ท่านพอจะเข้าใจได้ไหม บางที?"\n\n[chronicler.GetFirstName] ยื่น [ROOT.Char.Custom('GetWritingMaterial')] ให้ข้า ซึ่งขุดขึ้นมาจากซอกมุมที่เต็มไปด้วยฝุ่นในบ้านบรรพบุรุษ ข้ามองมันอย่างสงสัย ข้าไม่แน่ใจว่า [chronicler.GetSheHe] หมายถึงอะไร โดยเฉพาะ-\n\n"ดูสิ เชื้อสายของท่านไม่ปรากฏในรายการนี้เลย" [chronicler.GetFirstNameNoTooltip] ชี้แจงด้วยสิ่งที่ข้ามั่นใจว่า [chronicler.GetSheHe] #EMP คิด#! ว่าเป็นเสน่ห์ที่เป็นประโยชน์ ในความเป็นจริง มันเพียงแค่ ทำให้อารมณ์ของข้าขุ่นมัวยิ่งขึ้น\n\nนี่อาจเป็นข่าวร้ายอย่างยิ่งสำหรับความพยายามในการสร้างความชอบธรรมของข้า"
legend_spread_events.5035.a: ""ทำลายสิ่งนี้เสีย และ [chronicler.GetFirstNameNoTooltip]...?""
legend_spread_events.5035.a.tt: ""หากมีคำพูดใดหลุดออกจากห้องนี้ ข้าจะ #EMP รู้#! ว่าเป็นเจ้า""
legend_spread_events.5035.b: ""ไร้สาระ! ดูสิ นั่นชื่อพ่อข้าอยู่ตรงนั้น!""
legend_spread_events.5035.b.success: "[chronicler.GetFirstNameNoTooltip] ยอมรับการแก้ไขอย่างมีความสุข"
legend_spread_events.5035.b.failure: "[chronicler.GetFirstNameNoTooltip] ไม่เชื่อ"
legend_spread_events.5035.c: "เราต้องเก็บเรื่องนี้เป็นความลับ #EMP ลับมาก#! "
legend_spread_events.5035.c.success: "ความลับยังคงถูกฝังกลบ"
legend_spread_events.5035.c.failure: "ความลับรั่วไหลออกไป"
legend_spread_events.5035.d: "เราจะต้องมองหาเอกสารอื่น"

legend_spread_events.5040.t: "พืชพรรณประจำตระกูล"
legend_spread_events.5040.desc: ""เพียงคำถามสุดท้าย [ROOT.Char.Custom('FormOfAddressForLiege')] แล้วข้าจะปล่อยท่านไป!" ความร่าเริงเสแสร้งของ[chronicler.GetFirstNamePossessive] มิได้ช่วยบรรเทาความเหนื่อยล้าที่ข้ารู้สึก ขณะที่เวลาที่เราใช้ในการพินิจพิเคราะห์ [ROOT.Char.Custom('GetWritingMaterial')] เพื่อประเมินสายตระกูลของข้า ยืดเยื้อออกไป [chronicler.GetSheHe|U] เคาะส่วนหนึ่งอย่างจริงจัง\n\n"ข้าเพียงไม่แน่ใจว่าผู้ใดควรอยู่ในส่วน #EMP เหล่านี้#! กันแน่" [chronicler.GetFirstNameNoTooltip] ขมวดคิ้วของ [chronicler.GetHerHis] อย่างกลัดกลุ้ม "ท่านพอจะทราบหรือไม่ [ROOT.Char.Custom('FormOfAddressForLiege')]?""
legend_spread_events.5040.a: "แน่ #EMP นอน#! ข้ารู้!"
legend_spread_events.5040.a.tt: "ไม่ ข้าไม่รู้ แต่คำโกหกที่ดี ทำให้ความรู้ซ้ำซ้อน..."
legend_spread_events.5040.b: "ข้ามั่นใจว่า [parent.GetMotherFather] ต้องรู้!"
legend_spread_events.5040.c.tt: "ข้าไม่รู้เลย แต่บางทีถ้าข้าน่าเชื่อถือพอ..."
legend_spread_events.5040.c.success: "เรื่อง แต่งของท่านน่าเชื่อถือ"
legend_spread_events.5040.c.failure: "คำโกหกของท่านชัดเจน"
legend_spread_events.5040.d: "ใส่ [ROOT.Char.Custom('RegionalMythicalCreature')] ลงไปตรงนั้นก็ได้ ข้าไม่สน!"
legend_spread_events.5040.d.success: "คนโง่เขลาบางคนเชื่อจริงๆ"
legend_spread_events.5040.d.failure: "ความประมาท ทำให้เกิดข้อสงสัยในแผนภูมิตระกูลของท่าน"

legend_spread_events.5045.t: "สักสองสามคำ?"
legend_spread_events.5045.desc: "[chronicler.GetFirstName] และข้ากำลังครุ่นคิดถึงเส้นทางที่จะเผยแพร่ข่าวความศรัทธาของข้าให้ไกลออกไป เมื่อ [chronicler.GetSheHe] คว้าแขนข้าและพยักพเยิด [imam.GetFirstName] [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('imam'))] ของข้า ได้เข้ามาในมัสยิด เริ่มเตรียมการสำหรับการสักการะในภายหลังอย่างชัดเจน\n\n"[ROOT.Char.Custom('FormOfAddressForLiege')|U]!" [chronicler.GetFirstNameNoTooltip] กระซิบ "นี่มัน #EMP ยอดเยี่ยม#! [imam.GetSheHe|U] กำลังเตรียม #EMP คุฏบะฮ์#! สำหรับวันนี้! เร็วเข้า ไปเกลี้ยกล่อม [imam.GetHerHim] ให้ใส่ชื่อท่านลงไปด้วย!"\n\nช่างเป็นความคิดที่ยอดเยี่ยม! ข้าเพียงสงสัยว่าต้องใช้อะไรบ้างเพื่อ ทำให้มันเป็นจริง..."
legend_spread_events.5045.a: "[imam.GetSheHe|U] จะไม่ปฏิเสธบุญคุณ"
legend_spread_events.5045.b: "สินบนอาจเสี่ยง แต่คุ้มค่า..."
legend_spread_events.5045.b.success: "[imam.GetSheHe|U] ยอมรับข้อเสนอของท่าน"
legend_spread_events.5045.b.failure: "[imam.GetSheHe|U] โกรธเคืองกับข้อเสนอของท่าน"
legend_spread_events.5045.c: "ข้าจะเกลี้ยกล่อม [imam.GetHerHim] เอง"
legend_spread_events.5045.c.success: "[imam.GetFirstNameNoTooltip] ตกลง"
legend_spread_events.5045.c.failure: "[imam.GetFirstNameNoTooltip] ไม่สนใจคำร้องขอของท่าน"
legend_spread_events.5045.d: ""อย่าโง่ไปหน่อยเลย [chronicler.GetFirstNameNoTooltip]""

legend_spread_events.5050.t: "การปรากฏตัว"
legend_spread_events.5050.desc: "ข้าน่าจะเห็นปัญหาที่กำลังมา เมื่อ [chronicler.GetFirstName] เดินเข้ามาใน [ROOT.Char.Custom('GetRoom')] โดยมีใบหน้าแปลกตาพ่วงมาด้วย\n\n"ขอข้าแนะนำ [jeweller.GetFirstName] [ROOT.Char.Custom('FormOfAddressForLiege')]" คนแปลกหน้าโค้งคำนับอย่างลึกซึ้ง "[jeweller.GetSheHe|U] เป็นช่างอัญมณีและช่างโลหะ ข้าคิดว่าท่านอาจต้องการชมผลงานบางส่วนของ [jeweller.GetHerHis]"\n\n"ข้าถือวิสาสะเตรียมบางอย่างที่เหมาะกับท่านโดยเฉพาะ และ... สิ่งที่ท่านกังวลในทุกวันนี้" [jeweller.GetFirstNameNoTooltip] เริ่มต้น พลางวางถาดลงบนโต๊ะ\n\n#EMP 'สิ่งที่ข้ากังวล?'#! [chronicler.GetFirstNameNoTooltip] คงจะยุ่งน่าดู"
legend_spread_events.5050.a: "มงกุฎนี้ค่อนข้างน่าทึ่ง"
legend_spread_events.5050.b: "สร้อยคอนี้ให้ความรู้สึกบางอย่าง"
legend_spread_events.5050.c: "ข้าไม่ได้มองหาที่จะใช้จ่าย #EMP มากขนาดนั้น#! ..."
legend_spread_events.5050.d: ""ท่านก้าวล้ำเส้น [chronicler.GetFirstNameNoTooltip]""

legend_spread_events.5055.t: "ทางเลือกทางวัฒนธรรม"
legend_spread_events.5055.desc: "ขณะที่ข้าใคร่ครวญว่าจะสวมใส่อะไรในวันนี้ คำแนะนำของ [chronicler.GetFirstNamePossessive] ก็เต็มไปด้วยความกระตือรือร้น "บางทีอาจจะเป็นสิ่งที่สร้างแรงบันดาลใจให้ข้าหลวงของท่าน ใต้ฝ่า [ROOT.Char.GetLiege.GetTitleAsNameNoTooltip] ของข้า? อะไรที่เป็นแบบดั้งเดิม?"\n\nหากข้าจะเอาใจเหล่าข้าราชบริพารของข้า ข้าควรจะปรากฏกายในแบบที่พวกเขาจินตนาการว่าผู้ปกครองควรจะเป็น ทว่าอาณาจักรของข้ามีวัฒนธรรมที่แตกต่างกันมากมาย\n\nเครื่อง แต่งกายอันสง่างามของข้าอาจเอาใจเพื่อนชาว [vassal1.GetCulture.GetName] เช่น [vassal1.GetTitledFirstName] แต่ผู้ที่อยู่นอกเหนือภูมิหลังร่วมกันของเรา — เช่น [vassal2.GetTitledFirstName] — จะรู้สึกถึงเพียงความแตกต่างที่ลึกซึ้งยิ่งขึ้นของเรา"
legend_spread_events.5055.a: "ทั้งสองกลุ่มสามารถเอาใจได้"
legend_spread_events.5055.a.tt: "การสวมเครื่องหมายจากทั้งวัฒนธรรม [vassal1.GetCulture.GetNameNoTooltip] และ [vassal2.GetCulture.GetNameNoTooltip] จะ ทำให้ข้าโดดเด่นในฐานะผู้ปกครองแห่งความอดทนและการเคารพ"
legend_spread_events.5055.b: "ข้าจะเป็นตัวแทนของประชาชนของข้า"
legend_spread_events.5055.c: "ไพร่ฟ้าข้าแผ่นดิน [vassal2.GetCulture.GetNameNoTooltip] ต้องการใครสักคนที่จะพึ่งพา"
legend_spread_events.5055.d: "ข้าควรหลีกเลี่ยงการสร้างศัตรู"
legend_spread_events.5055.d.tt: "การหลีกเลี่ยงความขัดแย้งนั้นง่ายกว่าการแสดงจุดยืนมาก"
5055_vassal1_culture: "ข้าหลวงทุกคนของวัฒนธรรม [vassal1.GetCulture.GetName] [culture|E]"
5055_vassal2_culture: "ข้าหลวงทุกคนของวัฒนธรรม [vassal2.GetCulture.GetName] [culture|E]"
5055_every_culture_vassal: "ข้าหลวงทุกคนของวัฒนธรรม [vassal1.GetCulture.GetName] และ [vassal2.GetCulture.GetName] [culture|E]"

legend_spread_events.5060.t: "ภาพศักดิ์สิทธิ์"
legend_spread_events.5060.opening: ""ท่านรู้ไหม ฝ่าบาท [ROOT.Char.GetLiege.GetTitleAsNameNoTooltip] ของข้า" [chronicler.GetFirstName] เริ่มต้นอย่างลังเลขณะที่เราเดินสับเปลี่ยนไปมาใน [ROOT.Char.Custom('GetCourtyard')] "ข้าลังเลที่จะกล่าวถึง แต่ผู้ศรัทธาจะต้องการทราบว่าท่านสูญเสีย"
legend_spread_events.5060.one_eyed: "ตาของท่านไปได้อย่างไร""
legend_spread_events.5060.blind: "ดวงตาของท่านไปได้อย่างไร""
legend_spread_events.5060.ending: "\n\nข้าหยุดนิ่ง เสียงสั่นเครือในเสียงของ [chronicler.GetFirstNamePossessiveNoTooltip] บ่งบอกถึงน้ำหนักของเรื่องมากกว่าที่ควรจะเป็น แต่ ทว่า ข้าครุ่นคิด ได้ยินเสียงสวดมนต์อันห่างไกลของ [ROOT.Char.GetFaith.PriestNeuterPlural] ลอยมาตามลม...\n\nบางทีถึงเวลาแล้วที่จะใช้ประโยชน์จากความเจ็บป่วยที่ถูกสาปแช่งนี้ให้กลายเป็นสิ่งที่สามารถเป็นประโยชน์ต่อข้าได้ในที่สุด?"
legend_spread_events.5060.a: ""[ROOT.Char.GetFaith.HighGodName] มาหาข้า และนิมิตนั้น ทำให้ข้าตาบอด!""
legend_spread_events.5060.b: ""[ROOT.Char.GetFaith.HighGodName] เอาไป เพื่อที่ข้าจะได้พิสูจน์ความศรัทธาของข้า!""
legend_spread_events.5060.c: ""ไม่ว่าสาเหตุจะเป็นอย่างไร มัน ทำให้ข้าถ่อมตนต่อหน้า [ROOT.Char.GetFaith.HighGodName]""
legend_spread_events.5060.d: ""มันเป็นเพียงอาการบาดเจ็บเก่าๆ [chronicler.GetFirstNameNoTooltip]""
legend_spread_events.5060.d.tt: "ไม่มีประโยชน์ที่จะโกหกเกี่ยวกับปัญหานี้"

legend_spread_events.5065.t: "ขนมปังศักดิ์สิทธิ์"
legend_spread_events.5065.desc: "ข้ากำลังเพลิดเพลินกับ [ROOT.Char.Custom('GetExpensiveDessert')] จานที่สองอย่างเต็มที่ เมื่อข้าสังเกตเห็น [chronicler.GetFirstName] มองข้าอย่างตำหนิ\n\n"ท่านรู้ไหม [ROOT.Char.Custom('FormOfAddressForLiege')]" [chronicler.GetSheHe] เริ่มอย่างนุ่มนวล "เมื่อพิจารณาว่าท่านกำลังพยายาม เอ่อ แสดงความศักดิ์สิทธิ์ของท่าน บางทีท่านอาจพิจารณาเพลา ๆ ลงสักหน่อย?"\n\nข้ามองลงไปที่อาหาร มันอร่อย แต่บางที [chronicler.GetFirstNameNoTooltip] อาจมีเหตุผล?"
legend_spread_events.5065.a: "บาห์ ข้ามีความสุขแบบนี้มากกว่า!"
legend_spread_events.5065.b: ""ท่านพูดถูก ข้าจะ ทำให้ดีขึ้น""
legend_spread_events.5065.c: "แค่เล็กน้อยที่นี่และที่นั่นคงไม่เป็นไรหรอก?"

legend_spread_events.5070.t: "การปรากฏตัวอันยิ่งใหญ่"
legend_spread_events.5070.desc: "ข้ายืนรอเสื้อผ้าขณะที่ [chronicler.GetFirstName] วุ่นวายอยู่รอบตัวข้า ปรับเสื้อผ้าของข้า เมื่อพอใจกับงานของ [chronicler.GetHerHis] แล้ว [chronicler.GetSheHe] ก็ครุ่นคิดเล็กน้อย\n\n"ข้าสงสัยอยู่" [chronicler.GetSheHe] เริ่มต้น "ว่าท่านอาจจะพิจารณาสไตล์ที่แตกต่างออกไปหรือไม่?" ข้าตอบสายตาของ [chronicler.GetHerHis] ด้วยความสงสัย\n\n"อืม ท่านพยายามที่จะเน้นย้ำความผูกพันกับบรรพบุรุษของท่าน บางทีมันอาจจะคุ้มค่าที่จะคิดถึงการนำเสนอตัวเองในภาพลักษณ์ของพวกเขา?""
legend_spread_events.5070.a: "ข้าจะ แต่งกายเหมือน [culture.GetCollectiveNounNoTooltip] คนแรก!"
legend_spread_events.5070.a.success: "ท่านได้รับการยกย่องจากการ แต่งกายของท่าน"
legend_spread_events.5070.a.failure: "ไม่มีใครเชื่อ"
legend_spread_events.5070.b: "บางทีคำใบ้ทางสไตล์เล็กๆ น้อยๆ อาจจะไม่เสียหาย..."
legend_spread_events.5070.c: "ข้าได้รับแรงบันดาลใจจากอดีต แต่ข้าไม่ยอมจำนนต่อมัน"
every_culture_vassal: "ข้าหลวงทุกคนใน [culture.GetNameNoTooltip] ของท่าน"

legend_spread_events.5075.t: "การบูชาอันแน่วแน่"
legend_spread_events.5075.desc: "[imam.GetFirstName] เดินผ่านข้าไปอย่างเร่งรีบโดยแทบไม่สนใจ แต่กลับ ทำให้ข้าหยุดชะงัก [chronicler.GetFirstName] สหายของข้า สังเกตเห็นความตกใจของข้า จึงเริ่มอธิบาย\n\n"มันคือรอยด้านจากการละหมาด" [chronicler.GetSheHe|U] เฝ้ามอง [imam.GetFaith.PriestNeuter] ที่กำลังเดินจากไปพร้อมกับข้าครู่หนึ่ง ยืดคอของ [chronicler.GetHerHis] เพื่อดูหน้าผากของ [imam.GetHerHis] "ผู้ที่อ้างตนว่าศักดิ์สิทธิ์พิสูจน์ความศรัทธาของตนด้วยการกราบด้วยแรงมากพอที่จะ ทำให้เกิดรอยนูนบนศีรษะ""
legend_spread_events.5075.a: "ต้องมีวิธีปลอมแปลงสิ่งนี้แน่ๆ..."
legend_spread_events.5075.a.success: "ผู้คนถูกหลอกได้ง่าย"
legend_spread_events.5075.a.failure: "การหลอกลวงของท่านล้มเหลว"
legend_spread_events.5075.b: "ข้าต้องละหมาด #EMP หนักขึ้น!#!"
legend_spread_events.5075.b.success: "มันได้ผล"
legend_spread_events.5075.b.failure: "โอ๊ย"
legend_spread_events.5075.c: "ช่างไร้สาระสิ้นดี"

legend_spread_events.5200.t: "เป้าหมายที่แปลกใหม่"
legend_spread_events.5200.desc: "[chronicler.GetFirstName] ใช้มือของ [chronicler.GetHerHis] ทำงานอีกครั้ง จดรายละเอียดตำนานของข้า\n\n"มีสิ่งหนึ่งที่ ทำให้ข้าฉงน" [chronicler.GetSheHe] ครุ่นคิด "เหตุใดท่านจึงเลือกที่จะล่าสัตว์ร้ายตัวนี้? เหตุใด ในบรรดาสัตว์ทั้งปวง ท่านจึงเลือกที่จะล่า [legend.GetProperty( 'beast' ).GetFlagName] ตัวนี้โดยเฉพาะ?""
legend_spread_events.5200.a: "ข้าปรารถนาที่จะลิ้มลอง #EMP เนื้อแปลกใหม่#! ของมัน"
legend_spread_events.5200.b: "มัน... ฆ่า [dead_parent.GetMotherFather] [dead_parent.GetFirstNameNoTooltip] ของข้า!"
legend_spread_events.5200.b.success: "เรื่องเล่าของท่านน่าเชื่อถือ"
legend_spread_events.5200.b.failure: "ทุกคนรู้อยู่แล้วว่าพวกเขาไม่ได้ตายแบบนั้น"
legend_spread_events.5200.c: "เพื่อเกียรติยศ แน่นอน"

legend_spread_events.5205.t: "การเป็นที่สุด"
legend_spread_events.5205.desc: "[chronicler.GetFirstName] บิดขี้เกียจเล็กน้อย พลางเอื้อมหยิบ [ROOT.Char.Custom('GetWritingMaterial')] เพิ่มเติมสำหรับกองที่กำลังสูงขึ้น\n\n"เช่นนั้น [ROOT.Char.Custom('FormOfAddressForLiege')]" [chronicler.GetSheHe] เริ่มอีกครั้งด้วยน้ำเสียงเรียบ ๆ "อธิบายให้ข้าฟังทีว่าเหตุใดท่านจึงมุ่งมั่นที่จะล่าศัตรูที่ดุร้ายอย่าง [legend.GetProperty( 'beast' ).GetFlagName]? แน่นอนว่ามันเป็นศัตรูที่อันตรายอย่างแท้จริง?""
legend_spread_events.5205.a: "นักล่าที่ยิ่งใหญ่ที่สุดในแผ่นดินจะทำอะไรได้อีก?"
legend_spread_events.5205.b: "ทั้งหมดนี้เป็นการไล่ตามเหยื่อที่อันตรายยิ่งกว่าเดิม..."
legend_spread_events.5205.b.tt: "...และตอนนี้ ข้ารู้วิธีที่จะหามันแล้ว"
legend_spread_events.5205.c: "ข้าจำเป็นต้องฝึกฝนทักษะการติดตามของข้า"
legend_spread_events.5205.d: "เพื่อพิสูจน์ทักษะของข้าในฐานะนักล่า"

legend_spread_events.5210.t: "โจรตาเดียว"
legend_spread_events.5210.desc: ""จริงหรือ?" [chronicler.GetFirstName] ควานหา [ROOT.Char.Custom('GetWritingMaterial')] เพิ่มเติมเพื่อจดบันทึก ในระหว่างที่ถามข้าเพื่อยืนยันเรื่องเล่า "ว่ากันว่ามีการเผชิญหน้ากับสิ่งมีชีวิตที่น่ารังเกียจทีเดียว"\n\n"ข้าได้ยินข่าวลือเกี่ยวกับมัน สิ่งมีชีวิตขนาดใหญ่เทอะทะที่มีตาเพียงข้างเดียว ไซคลอปส์ผู้ยิ่งใหญ่!""
legend_spread_events.5210.a: "และมันคิดว่าข้าเป็นเพื่อนไซคลอปส์ด้วย!"
legend_spread_events.5210.b: ""และมันเป็นสัตว์ร้ายที่ดุร้ายอย่างแท้จริง!""
legend_spread_events.5210.c: "ข้าคิดว่านั่นเป็นเพียงคนท้องถิ่น จริงๆ แล้ว"

legend_spread_events.5215.t: "เหลือเชื่อ-ใบไม้"
legend_spread_events.5215.desc: "ข้านั่งอยู่กับ [chronicler.GetFirstName] ขณะที่ [chronicler.GetSheHe] บันทึกตำนานของข้าเพิ่มเติม\n\n"ส่วนที่เกี่ยวกับพืชพันธุ์เป็นเรื่องจริงหรือไม่ [ROOT.Char.Custom('FormOfAddressForLiege')]?" การเลิกคิ้วอย่างสงสัยของข้า กระตุ้นให้ [chronicler.GetHerHim] พูดต่ออย่างชัดเจน "พืชที่ไม่เป็นมิตรน่ะสิ! พฤกษาใบยักษ์ที่สามารถวางยาท่านได้จากระยะไกลด้วยละอองเรณูของมัน!""
legend_spread_events.5215.a: "ข้าสามารถยืนยันความจริงของมันด้วยอำนาจบางอย่าง"
legend_spread_events.5215.b: "สถานการณ์ที่เลวร้าย แต่สามารถจัดการได้"
legend_spread_events.5215.c: "ไม่ แต่ข้าได้เรียนรู้ว่าพืช เช่นนั้นมีอยู่จริง!"

legend_spread_events.5216.t: "กีฬาพื้นบ้าน"
legend_spread_events.5216.desc: "ข้าเล่นลูกธนูที่หลงฝูงจากมัดที่พิงกำแพง ขณะที่ [chronicler.GetFirstName] ยังคงบันทึกตำนานของข้าต่อไป\n\n"นั่น ทำให้ข้านึกขึ้นได้ [ROOT.Char.Custom('FormOfAddressForLiege')]" [chronicler.GetFirstNameNoTooltip] เริ่มต้น พลางจ้องมองมัน "จริงหรือไม่ที่มีการท้าทาย? [ROOT.Char.Custom('GetLassLad')] ท้องถิ่น ผู้มีทักษะการยิงธนู ท้าทายผู้มาเยือนทุกคนในการประลองยิงธนู? ผู้ใดเป็นฝ่ายมีชัย?""
legend_spread_events.5216.a: ""ข้าชนะโดยการยิงลูกธนูของพวกเขาแตกเป็นสองเสี่ยงด้วยลูกธนูของข้าเอง!""
legend_spread_events.5216.b: "เป็นการชนะที่ง่ายดาย!"
legend_spread_events.5216.b.success: "ฟังดูน่าเชื่อถือ"
legend_spread_events.5216.b.failure: "ไม่มีใครเชื่อ"
legend_spread_events.5216.c: "มันเป็นแค่การฝึกซ้อม จริงๆ แล้ว"

legend_spread_events.5220.t: "กับดักธรรมชาติ"
legend_spread_events.5220.desc.start: "[chronicler.GetFirstName] มองข้าอย่างพิจารณา\n\n"ข้าได้ยินมาว่าในการเดินทางของท่าน ท่านได้เผชิญกับความท้าทายมากมาย" การพยักหน้าอย่างระมัดระวังของข้าดูเหมือนจะกระตุ้น [chronicler.GetHerHim] "ข้าได้ยินมาว่าท่านเกือบจะตกเป็นเหยื่อของ"
legend_spread_events.5220.desc.wet: "บึงโคลนเหม็นที่ดูดกลืน "
legend_spread_events.5220.desc.dry: "แอ่งทรายดูดที่เคลื่อนไหวและดูดกลืน "
legend_spread_events.5220.desc.ending: "พวกเขาบอกว่าท่านต้องต่อสู้เพื่ออิสรภาพ ว่าหากกำลังของท่านหมดลง ท่านคงต้องตาย!" [chronicler.GetSheHe|U] มองข้าอย่างคาดหวัง"
legend_spread_events.5220.a: ""อา มันไม่มีอะไรสำหรับ [ROOT.Char.GetWomanMan] ที่มีรูปร่างอย่างข้า!""
legend_spread_events.5220.b: "แน่นอน! ข้าดิ้นรนจนผ่านพ้นไปได้ในที่สุด"
legend_spread_events.5220.c: "มันเป็นเพียงพื้นที่ที่น้ำท่วมขัง"

legend_spread_events.5225.t: "พลังดอกไม้"
legend_spread_events.5225.desc: "ช่อดอกไม้เล็กๆ บนโต๊ะของข้าดูเหมือนจะดึงดูดความสนใจของ [chronicler.GetFirstNamePossessive]\n\n"ตอนนี้สิ่งนี้ ทำให้ข้านึกถึง ฝ่าบาท [ROOT.Char.GetLadyLord] ที่ดีของข้า" [chronicler.GetSheHe] เริ่มต้น "เรื่องเล่าที่ข้าได้ยินเกี่ยวกับท่าน ข้าได้ยินมาว่าท่านได้พบพืชที่ไม่เหมือนใครในการเดินทางของท่าน?" [chronicler.GetSheHe|U] เงยหน้ามองข้าอย่างรวดเร็ว\n\n"ท่านพอจะมีตัวอย่างติดตัวมาบ้างไหม?""
legend_spread_events.5225.a: ""แน่นอน!""
legend_spread_events.5225.a.tt: "นี่ไม่ใช่ดอกไม้ที่ไม่เหมือนใคร แต่อย่างใด แต่มันแปลกพอที่จะหลอกคนธรรมดาได้"
legend_spread_events.5225.b: "ข้ามีอยู่ดอกหนึ่งที่นี่!"
legend_spread_events.5225.b.tt: "อืม นี่ไม่ใช่ดอกไม้ที่ #EMP พบได้บ่อยที่สุด#! ..."
legend_spread_events.5225.b.success: "[chronicler.GetNameNoTooltip] ไม่เคยเห็นดอกไม้ เช่นนี้มาก่อน"
legend_spread_events.5225.b.failure: "[chronicler.GetNameNoTooltip] เคยเห็นตัวอย่าง เช่นนี้มามากมายแล้ว"
legend_spread_events.5225.c: "#EMP ดอกไม้?!#! แน่นอนว่าเราควรจะหารือเรื่องที่ยิ่งใหญ่กว่านี้?"
legend_spread_events.5225.d: ""เกรงว่าจะไม่มี""

legend_spread_events.5230.t: "รสนิยมเลือด"
legend_spread_events.5230.desc: "[chronicler.GetFirstName] พรวดพราดเข้ามาใน [ROOT.Char.Custom('GetRoom')] ของข้ามักจะเป็นลางบอกเหตุของคำถามแปลกๆ ที่จะตามมา และครั้งนี้ก็พิสูจน์ว่าไม่แตกต่างกัน\n\n"ฝ่าบาท [ROOT.Char.GetLadyLord]! ข้าเพิ่งได้ยินเรื่องเล่าที่อุกอาจที่สุด!" [chronicler.GetSheHe] ร้อง ควานหา [ROOT.Char.Custom('GetWritingMaterial')] เพิ่มเติม "พวกเขาบอกว่าท่านถูกทำร้ายโดย #EMP มนุษย์กินคน#! ในการเดินทางของท่าน! พวกกินคน ท่านเชื่อไหม?!"
legend_spread_events.5230.a: ""เห็นแผลเป็นนี้ไหม? นั่นมาจากหนึ่งในพวกนั้น""
legend_spread_events.5230.b: "...พูดตามตรง พวกเขารู้วิธีปรุงเนื้อจริงๆ"
legend_spread_events.5230.c: "และข้ารอดชีวิตมาเล่าเรื่อง!"
legend_spread_events.5230.d: "ข้าคิดว่าพวกเขาเป็นแค่โจร"

legend_spread_events.5235.t: "ตัวต่อตัว"
legend_spread_events.5235.desc: "ข้ากำลังเล่าเรื่องวีรกรรมของข้าในสนามรบให้ [chronicler.GetFirstName] ฟัง เมื่อ [chronicler.GetSheHe] ขัดจังหวะอย่างกะทันหัน\n\n""จริงหรือ? ท่านสังหารผู้บัญชาการศัตรูที่ชั่วร้ายในการต่อสู้ตัวต่อตัวจริงหรือ?" ดวงตาของ [chronicler.GetHerHis|U] เป็นประกายด้วยความเป็นไปได้ เห็นได้ชัดว่านี่เป็นเรื่องเล่าที่เกินจริงบางอย่างที่ซึมซับผ่านคำบอกเล่า\n\nข้าอยู่ที่นั่นจริงๆ ในการรบ แต่ความสับสนของการต่อสู้ระยะประชิด ทำให้มีความเป็นไปได้ของเหตุการณ์แทบทุกอย่าง..."
legend_spread_events.5235.a: "พวกเขาตายอย่างสาสมใต้คมดาบของข้า"
legend_spread_events.5235.b: "พวกเขาตายด้วยคมดาบของผู้ใดไม่สำคัญ"

legend_spread_events.5240.t: "ความสุขุมหรือความกล้าหาญ?"
legend_spread_events.5240.desc: "ด้วยการขีดเขียนอย่างเร่งรีบในถ้วยเมล็ดพืชที่คว่ำอยู่ [chronicler.GetFirstName] ทำเครื่องหมายลำดับของการรบในอดีต [chronicler.GetSheHe|U] เปลี่ยนแนวทางอย่างรวดเร็วเมื่อเห็นข้าเฝ้ามอง\n\n"ส่วนนี้คือส่วนที่ ทำให้ข้าสนใจมากที่สุด" [chronicler.GetSheHe|U] กล่าว จิ้มไปที่การกวาดผ่านเมล็ดพืช เช่นนั้น "ข้าได้ยินมาว่าท่านแสร้งทำเป็นถอยทัพที่นี่ แต่แล้ว ข้าก็ได้ยินข้อกล่าวหาที่ #EMP ไม่น่าฟัง#! กว่านั้น..."\n\nหัวใจขี้ขลาดของข้าเต้นระรัวด้วยความตื่นตระหนกแม้ แต่กับการสอบสวนที่สุภาพนี้"
legend_spread_events.5240.a: "มันเป็นการถอยทัพทางยุทธวิธีที่สมบูรณ์แบบ"
legend_spread_events.5240.b: "แน่... แน่นอนว่ามันเป็นการถอยทัพ #EMP ทางยุทธวิธี#! "
legend_spread_events.5240.b.success: "คำอธิบายของท่านฟังดูน่าเชื่อถือ"
legend_spread_events.5240.b.failure: "การประท้วงของท่านเพียงแค่ยืนยันความผิด"
legend_spread_events.5240.c: "...อย่าไปจมอยู่กับมันเลย"

legend_spread_events.5245.t: "การโจมตีที่เด็ดขาด"
legend_spread_events.5245.desc: "เวลาที่มากขึ้นกับ [chronicler.GetFirstName] หมายถึงเวลาที่มากขึ้นในการทบทวนการรบในอดีตอย่างเหน็ดเหนื่อย เพื่อให้ตำนานของข้าสามารถจดบันทึกได้ [chronicler.GetSheHe|U] สังเกตเห็นความไม่สนใจของข้าและพยายามใช้แนวทางที่แตกต่างออกไป\n\n"ตอนนี้ เมื่อปีกซ้ายของศัตรูพังทลายลงและเราบุกตะลุยเข้าสู่แนวหลังของพวกเขา" [chronicler.GetSheHe|U] เริ่มต้น "จริงหรือไม่ที่ท่านเป็นผู้นำการโจมตีโอบล้อมนั้น? ช่างเป็นอัจฉริยภาพที่แท้จริง!"
legend_spread_events.5245.a: ""ข้าทำเอง หลายคนตายใต้คมดาบของเรา""
legend_spread_events.5245.b: ""อันที่จริง ข้าเป็นผู้นำการโจมตีที่เด็ดขาดจากศูนย์กลาง""
legend_spread_events.5245.c: "ข้าเพียงแค่ดูแลการรบ"

legend_spread_events.5250.t: "การช่วยชีวิตผู้บริสุทธิ์"
legend_spread_events.5250.desc: ""ฝ่าบาท [ROOT.Char.GetLadyLord] ของข้า! โอ้ ฝ่าบาท [ROOT.Char.GetLadyLord] ของข้า!" การวิงวอนอย่างกระตือรือร้นของ [chronicler.GetFirstNamePossessive] ทำให้ข้าหยุดชะงัก "ข้าเพิ่งได้ยินเรื่องราวความยากลำบากทางความรักของท่านในสนามรบ! ชาวนาที่หลงทางและสับสน แต่งดงามอย่างแท้จริง เดินเตร่อยู่ในสนามรบ และ #EMP ท่าน#! ช่วย [ROOT.Char.Custom('GetHerHimOpposite')] ไว้!"\n\nเห็นได้ชัดว่า [chronicler.GetFirstNameNoTooltip] จะไม่ถูกห้ามปรามจากแนวทางการสอบสวนนี้"
legend_spread_events.5250.a: ""โอ้ ข้าช่วย [ROOT.Char.Custom('GetHerHimOpposite')] ไว้ ตรงเข้าไปใน #EMP เต็นท์#! ของข้าเลย!""
legend_spread_events.5250.b: ""ข้าได้รับจูบเป็นรางวัล ไม่น้อยเลย""
legend_spread_events.5250.c: ""ท่านคงสับสนข้ากับคนอื่น""

legend_spread_events.5255.t: "เรื่องเล่าสงคราม"
legend_spread_events.5255.desc: ""เมื่อได้ฟังเรื่องราวการรบของท่าน [ROOT.Char.Custom('FormOfAddressForLiege')]" [chronicler.GetFirstName] เอ่ย น้ำเสียงสั่นเครือเล็กน้อยราวกับเล่นละคร "ช่างน่าอัศจรรย์ใจนักที่ท่านรอดมาได้! ความตายและการสังหารทุกรูปแบบอยู่รอบตัวท่าน แต่ท่านก็ผ่านมันมาได้โดยมิได้รับบาดเจ็บ"\n\nทุกคนคงชอบเรื่องเล่าสงครามดี ๆ ข้าเดาว่า บางทีการปรุง แต่งเรื่องของข้าเล็กน้อยอาจช่วยเผยแพร่คำพูดออกไปได้?"
legend_spread_events.5255.a: ""แทบจะไม่ได้รับบาดเจ็บเลย [chronicler.GetFirstNameNoTooltip]""
legend_spread_events.5255.b: ""ท่านคิดว่าข้าได้แผลเป็นเหล่านี้มาจากไหนอีก?""
legend_spread_events.5255.c: ""เพียงแค่ขอบคุณ [ROOT.Char.GetFaith.HighGodName]""
legend_spread_events.5255.d: ""ข้าฝ่าฟันไปอย่างองอาจที่สุดเท่าที่จะทำได้!""

legend_spread_events.5260.t: "จังหวะที่ดี"
legend_spread_events.5260.desc: ""กองกำลังของเราถูกกดดันและก่อกวนอย่างหนัก" [chronicler.GetFirstName] ตัดผ่านภวังค์ของข้าขณะที่เราหารือเกี่ยวกับการรบในอดีต "แต่เราก็ยังคงได้รับชัยชนะ! ข้าได้ยินมาว่า อันที่จริงแล้ว #EMP ท่าน#! คือผู้ที่มาถึงในช่วงเวลาสำคัญพร้อมกับกำลังเสริม! ช่างเป็นการมาถึงที่ทันเวลาเพื่อรับประกันชัยชนะของเรา!"\n\nข่าวของ [promoted_legend.GetName] ต้องแพร่กระจายไปไกล และคำพูดเกี่ยวกับวีรกรรมอันกล้าหาญของข้าจะช่วยให้มันเป็น เช่นนั้น หากข้าเลือกที่จะรับเครดิตนี้ แน่นอน..."
legend_spread_events.5260.a: ""ข้ามาถึงทันเวลาพอดี""
legend_spread_events.5260.b: ""เราวางแผนไว้ล่วงหน้าอย่างดี""

legend_spread_events.5305.t: "การเป็นเพื่อนบ้านที่ดี"
legend_spread_events.5305.desc: "[chronicler.GetFirstName] จดคำพูดของข้าอย่างขะมักเขม้นขณะที่ข้าบอก ข้าต้องระมัดระวังในการเลือกคำพูด: [potential_promoter.GetFirstName] ผู้ปกครองเพื่อนบ้านของข้า อาจถูกชักจูงให้สนับสนุนเป้าหมายของข้าในการเผยแพร่ข่าวของ [promoted_legend.GetName] แต่การใช้ถ้อยคำที่ไม่ถูกต้องอาจฟังดู... หยิ่งยโส บางที\n\nข้าหยุดชั่วคราว [chronicler.GetFirstNameNoTooltip] ก็หยุด เช่นกัน รออย่างอดทน [potential_promoter.GetSheHe] #EMP ต้องการ#! ได้ยินอะไร?"
legend_spread_events.5305.a: "แน่นอนว่า [potential_promoter.GetSheHe] คงอยากเห็นเพื่อนร่วม [root_culture.GetName] ประสบความสำเร็จ!"
legend_spread_events.5305.a.success: "[potential_promoter.GetFirstNameNoTooltip] ตกลง"
legend_spread_events.5305.a.failure: "[potential_promoter.GetFirstNameNoTooltip] ไม่ประทับใจ"
legend_spread_events.5305.b: "บางที... การขู่เล็กน้อย"
legend_spread_events.5305.b.success: "[potential_promoter.GetFirstNameNoTooltip] หวาดกลัวอย่างเหมาะสม"
legend_spread_events.5305.b.failure: "[potential_promoter.GetFirstNameNoTooltip] ไม่สนใจคำขู่ของท่าน"
legend_spread_events.5305.c: "แน่นอนว่าการอุทธรณ์ต่อมิตรภาพฉันเพื่อนบ้านจะได้ผล?"
legend_spread_events.5305.c.success: "[potential_promoter.GetFirstNameNoTooltip] ยินยอม"
legend_spread_events.5305.c.failure: "[potential_promoter.GetFirstNameNoTooltip] ไม่สนใจคำร้องขอของท่าน"
legend_spread_events.5305.d: "บาห์ แค่ส่งไปตามนั้น"
legend_spread_events.5305.d.success: "[potential_promoter.GetFirstNameNoTooltip] ประทับใจ"

legend_spread_events.5310.t: "ผู้ประกาศตำนาน"
legend_spread_events.5310.desc: "ข้าอดไม่ได้ที่จะเดินไปมาอย่างกระสับกระส่ายขณะที่ [herald.GetFirstName] เตรียมเสบียงสำหรับการเยือน [herald.GetHerHis] ราชสำนักของ [potential_promoter.GetFirstName] ผู้ปกครองเพื่อนบ้านของข้า [herald.GetFirstNameNoTooltip|U] ได้รับมอบหมายอย่างชัดแจ้งให้เผยแพร่เรื่องราวของ [promoted_legend.GetName] โดยเฉพาะอย่างยิ่งคือการเข้าถึงตัว [potential_promoter.GetTitleAsNameNoTooltip] และชักชวนให้ [potential_promoter.GetHerHim] เข้าร่วมอุดมการณ์\n\nความสุขุมและความสง่างามเป็นสิ่งจำเป็นสำหรับภารกิจนี้ และบางทีอาจต้องมีสิ่งอื่น ๆ มาถ่วงดุลด้วย..."
legend_spread_events.5310.a: ""ใช้ไหวพริบของเจ้า!""
legend_spread_events.5310.a.success: "[potential_promoter.GetFirstNameNoTooltip] หลงเสน่ห์"
legend_spread_events.5310.a.failure: "[herald.GetFirstNameNoTooltip] ดูประจบประแจง"
legend_spread_events.5310.b: "ของขวัญทองคำนี้อาจเกลี้ยกล่อม [potential_promoter.GetHerHim]"
legend_spread_events.5310.b.success: "เสน่ห์ของทองคำพิสูจน์ว่าแข็งแกร่ง"
legend_spread_events.5310.b.failure: "[potential_promoter.GetFirstNameNoTooltip] ไม่หวั่นไหวกับของขวัญ"
legend_spread_events.5310.c: "แค่... ไปที่นั่นและอย่าทำพลาด"
legend_spread_events.5310.c.success: "[herald.GetFirstNameNoTooltip] พิสูจน์ว่ามีประสิทธิภาพ"

legend_spread_events.5315.t: "การเผยแพร่ข่าว"
legend_spread_events.5315.desc: "ข้าหยุดชั่วคราว และเขียน และหยุดชั่วคราว และเขียน...\n\nคำพูดสำหรับสาส์นนี้ต้องเลือกอย่างระมัดระวัง วลีที่หลวมๆ สำหรับข้อความของข้าถึง [vassal.GetFirstName] [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('vassal'))] ของข้า จะไม่ได้รับการพิจารณาอย่างเมตตา แต่การสนับสนุน [promoted_legend.GetName] ของ [vassal.GetHerHis] จะเป็นประโยชน์อย่างยิ่งหากข้าทำถูกต้อง\n\nตอนนี้ มาดูกัน อะไรกันแน่ #EMP ที่#! [vassal.GetFirstNameNoTooltip] จะเห็นชอบ?"
legend_spread_events.5315.a: "[vassal.GetSheHe|U] เป็นคนที่มุ่งมั่นทีเดียว!"
legend_spread_events.5315.a.success: "[vassal.GetFirstNameNoTooltip] พอใจ"
legend_spread_events.5315.a.failure: "ท่านเดาผิด"
legend_spread_events.5315.b: "[promoted_legend.GetNameNoTooltip] ยังสามารถเป็นเรื่องราวของ #EMP การแก้แค้น#! ได้ด้วย..."
legend_spread_events.5315.c: "บางทีข้าควรจะพูดความจริงให้มากที่สุดเท่าที่จะเป็นไปได้?"
legend_spread_events.5315.d: "ข้าสามารถใช้ถ้อยคำในลักษณะที่จะยกยอ [vassal.GetHerHim]..."

legend_spread_events.5320.t: "การหล่อลื่นปาก"
legend_spread_events.5320.desc: "ข้าหลวงมักจะเรียกร้องความสนใจจากเจ้าเหนือหัวของตน แต่ครั้งนี้โต๊ะนั้นกลับถูกพลิกกลับ [vassal.GetFirstName] จะเป็นประโยชน์อย่างยิ่งหากมี [vassal.GetHerHim] เป็นผู้สนับสนุน [promoted_legend.GetName] ข้าต้องพยายามทุกวิถีทาง เพื่อให้ [vassal.GetHerHim] อยู่ข้างข้า\n\nข้าต้องคิดอย่างรอบคอบว่าอะไรจะดีที่สุดในการดึงดูดสายตาของ [vassal.GetHerHis] บางทีอาจเป็นคำสัญญาว่าจะลงทุนในที่ดินของ [vassal.GetHerHis]? บางทีอาจเป็นคำสัญญาว่าจะให้ความช่วยเหลือ?"
legend_spread_events.5320.artifact: "\n\nสายตาของข้าเหลือบไปเห็น [artifact.GetName] ที่อีกด้านหนึ่งของห้อง [vassal.GetSheHe] จะหวั่นไหวกับของขวัญ เช่นนั้นหรือไม่?"
legend_spread_events.5320.a: "แน่นอนว่า [vassal.GetSheHe] จะไม่ปฏิเสธสิ่งนั้น?"
legend_spread_events.5320.a.success: "[vassal.GetFirstNameNoTooltip] ยอมรับอย่างขอบคุณ"
legend_spread_events.5320.a.failure: "[vassal.GetFirstNameNoTooltip] ปฏิเสธ"
legend_spread_events.5320.a.artifact: "[artifact.GetName] ของท่านได้รับตัวปรับ แต่ง [prestige|E] #negative_value เชิงลบ#!"
legend_spread_events.5320.b: "การลงทุนใน [capital_county.GetNameNoTierNoTooltip] อาจพิสูจน์ได้ว่าน่าเชื่อถือ"
legend_spread_events.5320.b.success: "[vassal.GetFirstNameNoTooltip] หลงใหลในข้อเสนอ"
legend_spread_events.5320.b.failure: "[vassal.GetFirstNameNoTooltip] ไม่ประทับใจ"
legend_spread_events.5320.c: "ความโปรดปรานของเจ้าเหนือหัวของ [vassal.GetHerHis|U] ควรจะเพียงพอ"
legend_spread_events.5320.d: "[vassal.GetSheHe|U] ควรจะทำตามข้าโดยไม่คำนึงถึงสิ่งใด!"
legend_spread_events.5320.d.success: "[vassal.GetFirstNameNoTooltip] ทำตามท่าน"

legend_spread_events.5325.t: "นกน้อย"
legend_spread_events.5325.desc: "สาส์น #EMP อีกฉบับ#! — ครั้งนี้จาก [legend_person.GetFirstName] — ถูกส่งมาให้ข้าโดยผู้ส่งสาร และข้ารู้อยู่แล้วว่ามันเกี่ยวกับอะไร เรื่องเล่าของ [promoted_legend.GetName] ได้แพร่กระจายไปไกลและกว้าง และปากต่อปากก็เริ่มนำพามันไปไกลยิ่งขึ้น\n\nมันเป็นเรื่องเล่าที่ค่อนข้างน่าสนใจทีเดียว บางทีอาจมีข้อได้เปรียบบางอย่างในการเข้าร่วมกับคนอย่าง [legend_person.GetFirstNameNoTooltip]?"
legend_spread_events.5325.protag: "\n\nหรือบางที อาจเป็นผลประโยชน์ทางวัตถุ? ตัวเอกของตำนาน [promoted_legend_owner.GetFirstName] มีส่วนได้ส่วนเสียในการแพร่กระจายของมัน [promoted_legend_owner.GetSheHe|U] ยังบังเอิญครอบครองความมั่งคั่งจำนวนพอสมควร บางทีสาส์นตอบกลับอาจจะเกิดผล?"
legend_spread_events.5325.a: "น้ำหนักคำพูดของข้าจะพิสูจน์ว่ามีค่า"
legend_spread_events.5325.b: "ข้าจะเข้าร่วมกลุ่มผู้เชื่อในที่สาธารณะ"
legend_spread_events.5325.c: "ข้าจะรับรองมัน แต่ต้องมีค่าตอบแทน..."
legend_spread_events.5325.c.success: "[promoted_legend_owner.GetFirstNameNoTooltip] หลงใหลในข้อเสนอ"
legend_spread_events.5325.c.failure: "[promoted_legend_owner.GetFirstNameNoTooltip] ไม่ประทับใจ"
legend_spread_events.5325.c.success.tt: "จดหมายของท่านได้รับการตอบรับอย่างดี"
legend_spread_events.5325.c.failure.tt: "จดหมายของท่านได้รับการตอบรับไม่ดี"
legend_spread_events.5325.d: "นี่มันเรื่องไร้สาระทั้งเพ!"
legend_spread_events.5325.stop_promoting_warning: "@alert_icon! #alert_trial นี่จะทำให้ท่านต้องทิ้ง [legend|E] ปัจจุบันของท่าน!#!"
legend_spread_events.5325.stop_promoting: "ข้าหยุดส่งเสริม [legend|E] ปัจจุบันของข้า"

legend_spread_events.5326.opening: "[ROOT.Char.Custom2('AppropriateGreetingPositive', promoted_legend_owner)]"
legend_spread_events.5326.desc: "ข้อเสนอของท่านมีข้อดีมากมาย! โปรดรับของขวัญนี้เป็นการตอบแทนความพยายามของท่านในการเผยแพร่ข่าวดีของ [promoted_legend.GetName]"
legend_spread_events.5326.a: "ยอดเยี่ยม!"
legend_spread_events.5326.b: "ข้าจะไม่ทิ้งเรื่องเล่าปัจจุบันของข้า"

legend_spread_events.5327.opening: "[ROOT.Char.Custom2('AppropriateGreetingNegative', promoted_legend_owner)]"
legend_spread_events.5327.desc: "ความพยายามติดสินบนของท่านช่างโง่เขลาและดูถูก! วีรกรรมอันเลื่องชื่อของข้าไม่ต้องการให้ลิ้นพิษของท่านเผยแพร่!"
legend_spread_events.5327.a: "บ้าจริง!"

legend_spread_events.5330.t: "เสียงกระซิบที่ไม่เหมาะสม"
legend_spread_events.5330.desc: "เรื่องเล่าที่ดีควรได้รับการผลักดันโดยคนดีใช่หรือไม่? แต่ข่าวคราวเกี่ยวกับวิถีทางอันบาปหนาและ [promoted_legend_owner.Custom('SinfulTrait')|l] ของ [promoted_legend_owner.GetFirstName] [promoted_legend_owner.GetWomanMan] ผู้ ซึ่งเร่ขาย [promoted_legend.GetName] อย่างต่อเนื่อง ยังคงมาถึงหูข้า\n\nข้าสามารถตีตัวออกห่างจากตัวละครที่มีชื่อเสียงไม่ดี เช่นนี้ได้ แต่การเกี่ยวข้องกับเรื่องเล่าที่มีชื่อเสียง เช่นนั้นก็ให้ประโยชน์แก่ข้าในตัวมันเอง..."
legend_spread_events.5330.a: "กล้าดียังไง [promoted_legend_owner.GetSheHe]! ข้าเป็น [ROOT.Char.GetFaith.GetAdherentNameNoTooltip] ที่เคร่งศาสนา!"
legend_spread_events.5330.b: "ข้าไม่สามารถเกี่ยวข้องกับ [promoted_legend_owner.GetHerHim] ได้"
legend_spread_events.5330.c: "ข้าจะทำเป็นมองไม่เห็นแค่ครั้งนี้..."
legend_spread_events.5330.c.success: "ชื่อเสียงของท่านช่วยส่งเสริม [promoted_legend_owner.GetFirstNamePossessiveNoTooltip]"

legend_spread_events.5335.t: "หัวข้อที่คู่ควร"
legend_spread_events.5335.desc: "เห็นได้ชัดว่า ข้าถูกคาดหวังให้พูดถึงเรื่องเล่าที่ดีของ [promoted_legend.GetName] แต่ต้องบอกว่ามันง่ายขึ้นมากด้วยท่าทีอันสง่างามและศีลธรรมอันสูงส่งของ [promoted_legend_owner.GetFirstName]\n\nขุนนางและสามัญชนต่างพูดถึงบุคลิกภาพอันดีงามของ [promoted_legend_owner.GetHerHis] และแน่นอนว่ามันไม่ได้ล้มเหลวที่จะมาถึงหูข้า"
legend_spread_events.5335.a: "ช่างเป็นพรที่ได้หล่อเลี้ยงตำนานของ [promoted_legend_owner.GetHerHis]!"
legend_spread_events.5335.b: "บางทีข้าอาจใช้ประโยชน์จากสิ่งนี้เพื่อส่งเสริมเป้าหมายของเราทั้งคู่..."
legend_spread_events.5335.c: "ข้าสามารถเรียนรู้อะไรบางอย่างจาก [promoted_legend_owner.GetHerHim] ได้หรือไม่?"
legend_spread_events.5335.c.success: "ท่านได้รับข้อมูลเชิงลึกบางอย่างจาก [promoted_legend_owner.GetFirstNameNoTooltip]"

 legend_spread_events.8000.t: "ตำราที่ซ่อนอยู่"
 legend_spread_events.8000.desc: "แม้จะพยายามทุกวิถีทาง แต่ก็ยังมีผู้ที่ปฏิเสธว่า [promoted_legend.GetProtagonist.GetCulture.GetName] คือทายาทที่แท้จริงของชาว [promoted_legend.GetProperty('culture').Culture.GetName] วันนี้ [chronicler.Custom2('MyCharacterIntroduction', ROOT.Char)] มาหาข้าพร้อมข้อมูลบางอย่างที่จะขจัดข้อสงสัยใดๆ เกี่ยวกับความชอบธรรมในคำกล่าวอ้างของข้า!\n\n[chronicler.GetSheHe|U] บอกข้าเกี่ยวกับตำราโบราณเล่มหนึ่ง [chronicler.GetSheHe] เชื่อว่ามีอยู่ที่ไหนสักแห่งใน [promoted_legend.GetProperty('original_region').GeographicalRegion.GetName] ที่ [province_to_visit.GetName] โดยเฉพาะ แหล่งข้อมูลอาจไม่น่าเชื่อถือ แต่หากข้าพยายามค้นหาตำราเล่มนี้ ข้าอาจจะยังพิสูจน์ความชอบธรรมของ [promoted_legend.GetName] ได้"
 legend_spread_events.8000.a: "ข้ากำลังจะไปผจญภัย!"
 legend_spread_events.8000.b: "ข้าจะอยู่บ้าน!"
 travel_to_tome_tt: "ท่านจะ [travel|E] ไปยัง [province_to_visit.GetName] ที่ ซึ่งท่านอาจพบตำราโบราณ"
 legend_spread_events.8001.t: "ตำรา [promoted_legend.GetProperty('culture').Culture.GetNameNoTooltip]: สูญหายไปตามกาลเวลา"
 legend_spread_events.8001.desc: "น่าเสียดายที่สถานการณ์บังคับให้ข้าต้องละทิ้งแผนการเดินทาง และร่องรอยหลักฐานที่ข้ากำลังติดตามอยู่ก็เย็นลง ไม่มีอะไรที่ข้าสามารถทำได้เพื่อไล่ตามตำราตอนนี้ และข้าเกรงว่ามันอาจจะสูญหายไปตามกาลเวลา"
 legend_spread_events.8001.a: "พุทโธ่!"
 legend_spread_events.8002.t: "ตำรา [promoted_legend.GetProperty('culture').Culture.GetNameNoTooltip]: การมาถึง"
 legend_spread_events.8002.desc: "ในที่สุดข้าก็มาถึง [province_to_visit.GetName] และหลังจากได้รับคำแนะนำอย่างรวดเร็วจากคนท้องถิ่น ข้าก็ได้พบซากปรักหักพังที่เชื่อกันว่ามีสุสานอยู่ อนุสาวรีย์ที่พังทลายของอารยธรรม [promoted_legend.GetProperty('culture').Culture.GetName] ที่เคยยิ่งใหญ่นี้ ทำให้ข้านึกถึง [promoted_legend.GetProperty('title').Title.GetNameNoTier] มาก ข้ามั่นใจว่าหลักฐานความเชื่อมโยงอยู่ที่ไหนสักแห่ง!\n\nซากปรักหักพังอยู่ในสภาพที่เปราะบาง ข้าได้ยินเสียงค้ำยันพังทลายและทรุดโทรมลงภายใต้น้ำหนักของกาลเวลา และข้าต้องเหยียบย่างอย่างระมัดระวังหากข้าไม่ต้องการเสี่ยงที่จะทำลายอนุสาวรีย์ทั้งหมด"
 legend_spread_events.8002.a: "จำเป็นต้องมีการศึกษาอย่างรอบคอบ"
 legend_spread_events.8002.b: "ช่างหัวซากปรักหักพัง ข้าต้องหาตำราเล่มนั้นให้เจอ!"
 legend_spread_events.8002.c: "มีอะไรให้เรียนรู้มากมายที่นี่ ช่างหัวตำรา!"
 legend_spread_events.8002.d: "ข้าเคยอ่านเกี่ยวกับสถานที่นี้! ข้ารู้ว่าจะต้องมองหาที่ไหน"
 legend_spread_events.8003.t: "ตำรา [promoted_legend.GetProperty('culture').Culture.GetNameNoTooltip]: ขุดพบ"
 legend_spread_events.8003.desc: "ข้าค้นหาซากปรักหักพังกับคณะเดินทางของข้ามาหลายวันแล้ว และข้ายังไม่พบสิ่งใดที่จะบ่งชี้ถึงความเชื่อมโยงระหว่าง [promoted_legend.GetProtagonist.GetCulture.GetCollectiveNoun] และ [promoted_legend.GetProperty('culture').Culture.GetCollectiveNoun] ทันใดนั้น คณะของข้าก็นำเสนอกล่องที่แตกครึ่งหนึ่งจากความโหดร้ายของกาลเวลาให้ข้า หนังสือที่หนาไปด้วยฝุ่นและสิ่งสกปรกอยู่ภายใน\n\nหลังจากเป่าและเขย่าสองสามครั้ง ข้าก็พบว่าหนังสือเล่มนี้เต็มไปด้วยสิ่งมีชีวิตจากเทพปกรณัม [promoted_legend.GetProperty('culture').Culture.GetName] ที่วาดในสไตล์ [promoted_legend.GetProtagonist.GetCulture.GetNameNoTooltip] อย่างชัดเจน! แม้ว่าคำพูดจะจางหายไปและสูญหายไปตามกาลเวลา ข้าก็ต้องเชื่อว่าหนังสือที่ยอดเยี่ยมเล่มนี้พิสูจน์ความเชื่อมโยงที่ชัดเจนระหว่างสองวัฒนธรรม!"
 legend_spread_events.8003.a: "ช่างเป็นการค้นพบที่น่าทึ่ง!"
 legend_spread_events.8004.t: "ตำรา [promoted_legend.GetProperty('culture').Culture.GetNameNoTooltip]: สูญหาย"
 legend_spread_events.8004.desc: "ข้าและคณะเดินทางของข้าได้ค้นหาซากปรักหักพังเหล่านี้อย่างดีที่สุดเท่าที่จะทำได้ แต่ก็ยังไม่พบร่องรอยของตำราที่ถูกกล่าวหานี้ อย่างไรก็ตาม มีวัตถุที่น่าสนใจจำนวนมากวางอยู่ท่ามกลางซากปรักหักพัง ซึ่งบางชิ้นไม่ต้องสงสัยเลยว่าสร้างขึ้นด้วยฝีมือของ [promoted_legend.GetProperty('culture').Culture.GetName]\n\nข้าเก็บรูปแกะสลักสัตว์เล็กๆ ที่ทำจากหินใส่กระเป๋าและเตรียมเดินทางกลับบ้าน"
 legend_spread_events.8004.a: "อย่างน้อยก็ไม่เสียเปล่าทั้งหมด"
 legend_spread_events.8010.t: "ร่างประหลาด"
 legend_spread_events.8010.desc: "เราหยุดพักระหว่างทาง ผู้ติดตามของข้าล้อมรอบที่โล่ง วุ่นวายกับการเฝ้าระวังโจรและรวบรวมเสบียง ปล่อยให้ข้าอยู่ตามลำพังชั่วครู่ สายลมพัดกองไฟที่กำลังประทุของข้าให้ดับวูบ ข้ารู้สึกถึงบางอย่างข้างหลัง และข้าหันไปเห็นคนแปลกหน้าเข้ามาในค่ายของข้า [challenger.GetSheHe|U] ยิ้มอย่างไม่แยแส ราวกับว่า [challenger.GetSheHe] อยู่ที่นั่นมาโดยตลอด\n\n"ช่างเป็นวันที่โชคดีอะไร เช่นนี้ที่ได้พบกับ 'ตำนาน' [ROOT.Char.GetHerselfHimself] [ROOT.Char.GetNameNoTooltip]" [challenger.GetSheHe|U] เผยอาวุธของ [challenger.GetHerHis] ให้ข้าเห็น "พิสูจน์ตัวเองว่าเป็นตำนานสิ [ROOT.Char.Custom2('InsultNoun', SCOPE.sC('challenger'))]""
 legend_spread_events.8010.a: ""การต่อสู้ของเราจะเป็นตำนาน""
 legend_spread_events.8010.b: ""ทหารยาม!""
 legend_spread_events.8012.t: "ตำนานก็ตายได้"
 legend_spread_events.8012.desc: "คณะเดินทางของข้ากลับมาทันเวลาพอดีที่จะเห็นข้าล้มลงแทบเท้า [challenger.GetHerHis] ทันทีที่ข้ายืนขึ้นเพื่อเผชิญหน้ากับคู่ต่อสู้ที่แข็งแกร่งและแปลกประหลาดของข้า [challenger.GetSheHe] ดูเหมือนจะหายตัวไปในถิ่นทุรกันดาร ราวกับว่า [challenger.GetSheHe] ไม่เคยอยู่ที่นั่นเลย"
 legend_spread_events.8012.a: "คนอื่นเห็น [challenger.GetHerHim] ใช่ไหม?"
 legend_spread_events.8012.b: "ไม่มีใครเห็นอะไรเลย"
 legend_spread_events.8013.t: "ชัยชนะในตำนาน"
 legend_spread_events.8013.desc: "คณะเดินทางของข้ากลับมาทันทีที่ข้าได้รับชัยชนะเหนือคู่ต่อสู้ลึกลับของข้า อาวุธของ [challenger.GetHerHis|U] ตกลงสู่พื้น และ [challenger.GetSheHe] เงยหน้ามองข้า ตะลึง\n\nข้าเรียกคณะเดินทางของข้า แต่เมื่อข้ามองกลับไปที่เท้าของข้า [challenger.GetSheHe] ก็หายไป ราวกับว่า [challenger.GetSheHe] ไม่เคยอยู่ที่นั่นเลย"
 legend_spread_events.8013.a: "ข้าชนะ... ข้าคิดว่านะ"
 legend_spread_events.8020.t: "พวกนอกรีต!"
 legend_spread_events.8020.desc: "ข้าถูกขัดจังหวะที่ [ROOT.Char.Custom('GetCourt')] ในวันนี้ เมื่อ [challenger.Custom2('MyCharacterIntroduction', ROOT.Char)] พุ่ง [challenger.GetHerselfHimself] เข้าหาข้า ชี้หน้าและกรีดร้องว่า "พวกนอกรีต!" ระหว่างทาง [challenger.GetHerHis]\n\n"[legend.GetName|U] อ้างว่า [legend.GetProtagonist.GetNameNoTooltip] มีพลังอำนาจเหนือกว่าแม้กระทั่ง [ROOT.Char.GetFaith.HighGodName] [ROOT.Char.GetFaith.HighGodHerselfHimself]! นี่คือการนอกรีตขั้นสูงสุด!"\n\nสำหรับข้าแล้ว [challenger.GetSheHe|U] ฟังดูเหมือนคนเสียสติ แต่เสียงพึมพำรอบ ๆ [ROOT.Char.Custom('GetRoom')] บ่งชี้ว่ามีบางคนเห็นด้วยกับ [challenger.GetHerHim] แล้ว"
 legend_spread_events.8020.a: "ข้าสามารถโน้มน้าวพวกเขาได้"
 legend_spread_events.8020.a.win: "ท่านชนะการโต้วาที"
 legend_spread_events.8020.a.lose: "ท่านแพ้การโต้วาที"
 legend_spread_events.8020.b: "เอา [challenger.Custom2('InsultNoun', ROOT.Char)] นี่ออกไปจาก [ROOT.Char.Custom('GetCourt')] ของข้า"
 legend_spread_events.8020.c: "ไม่ พลังศักดิ์สิทธิ์นั้นมาจาก #EMP [ROOT.Char.GetFaith.HighGodName]#! ต่างหาก"
 legend_spread_events.8030.t: "เหมือนท่าน"
 legend_spread_events.8030.desc: "ในระยะไกล ข้าได้ยินเสียง [child.Custom2('MyCharacterIntroduction', ROOT.Char)] หัวเราะขณะเล่นกับเพื่อนๆ ของ [child.GetHerHis]\n\n"ข้าคือ [legend.GetProtagonist.GetNameNoTooltip] ข้าคือวีรบุรุษ!" [child.GetSheHe|U] กำลังแสดง [legend.GetName] ให้เพื่อนๆ ที่ชื่นชมของ [child.GetHerHis] ดู\n\nเด็กๆ ทุกคนมอง [child.GetFirstNameNoTooltip] ด้วยความพิศวงและชื่นชม หลงใหลในเรื่องเล่า หัวใจของข้าพองโตเมื่อได้ยินชื่อและสถานที่ในตำนานเหล่านั้นผ่านริมฝีปากของคนรุ่นต่อไปด้วยความกระตือรือร้นและความกระตือรือร้น เช่นนี้ แม้ว่าวันหนึ่งเราทุกคนจะกลายเป็นผงธุลี แต่ตำนานจะไม่มีวันตาย"
 legend_spread_events.8030.a: "ปล่อย [child.GetHerHim] ไป"
 legend_spread_events.8030.b: "ข้าควรจะเสนอการขับขานของข้าเอง!"
 legend_spread_events.8040.t: "บรรพบุรุษผู้บาปหนา"
 legend_spread_events.8040.desc: ""ท่านจะอ้างสิทธิ์สืบเชื้อสายมาจากคนบาปชั่วช้า [ancestor.GetName] หรือ?" [challenger.Custom2('MyCharacterIntroduction', ROOT.Char)|U] ทักทายข้าเช้านี้ด้วยนิ้วชี้และแววตาบ้าคลั่งในดวงตาของ [challenger.GetHerHis] "ดูหมิ่นศาสนา! [ancestor.GetSheHe|U] เป็น [ancestor.GetWomanMan] ชั่วร้ายที่มีอบายมุขที่ไม่ศักดิ์สิทธิ์ [ancestor.GetSheHe|U] ไม่ใช่ [virtue_trait.GetName(ancestor)] อย่างที่เราทุกคนถูกชักนำให้เชื่อ [ancestor.GetSheHe] เป็น [sin_trait.GetName(ancestor)] คนบาปหากเคยมีมา!"\n\nพร้อมกับความเชื่อมั่นในเสียงของ [challenger.GetHerHis] [challenger.GetSheHe] ได้นำบันทึกและเกร็ดเล็กเกร็ดน้อยที่เขียนเกี่ยวกับพฤติกรรมที่ไม่เคร่งศาสนาของ [ancestor.GetNamePossessiveNoTooltip] มามากมาย ซึ่งไม่ได้ ทำให้คำกล่าวอ้างของข้าเกี่ยวกับเชื้อสายของ [ancestor.GetHerHis] ดูดีเลย..."
 legend_spread_events.8040.a: "นี่มันไร้สาระทั้งเพ แน่นอน"
 legend_spread_events.8040.a.win: "ท่านโน้มน้าว [challenger.GetHerHim]"
 legend_spread_events.8040.a.lose: "ชื่อเสียงของท่านมัวหมอง"
 legend_spread_events.8040.b: "ดูหมิ่นศาสนา ออกไปจาก [ROOT.Char.Custom('GetCourt')] ของข้า!"
 legend_spread_events.8050.t: "บรรพบุรุษผู้มีคุณธรรม"
 legend_spread_events.8050.desc: "[chronicler.Custom2('MyCharacterIntroduction', ROOT.Char)|U] รีบมาหาข้าเช้านี้ ถือ [chronicler.Custom('GetWritingMaterialPlural')] เก่าๆ กองหนึ่ง ใบหน้าของ [chronicler.GetHerHis] เปล่งประกายด้วยความกระตือรือร้น\n\n"ฝ่าบาท [ROOT.Char.GetTitleAsNameNoTooltip|U] ของข้า ข้ามีข่าวดี ข้ากำลังค้นหาข้อมูลเกี่ยวกับ [ancestor.GetName] และข้าได้พบหลักฐานที่บ่งชี้ว่าธรรมชาติ [sin_trait.GetName(ancestor)] ของ [ancestor.GetHerHis] ถูกกล่าวเกินจริง และ [ancestor.GetSheHe] จริงๆ แล้วค่อนข้าง [virtue_trait.GetName(ancestor)]!"\n\nมันคงจะยาก แต่ถ้าข้าสามารถพิสูจน์ได้ว่านี่เป็นเรื่องจริง มรดกของ [ancestor.GetNameNoTooltip] ก็จะยิ่งมีเกียรติมากขึ้น!"
 legend_spread_events.8050.a: "มันต้องเป็นเรื่องจริง!"
 legend_spread_events.8050.a.win: "ท่านโน้มน้าวทุกคน"
 legend_spread_events.8050.a.lose: "ท่านล้มเหลวในการโน้มน้าวใครเลย"
 legend_spread_events.8050.b: "มาเน้นเรื่องที่เราพิสูจน์ได้กันเถอะ"
 legend_spread_events.8050.c: "แต่... แล้ว #EMP ข้าล่ะ?!#!"
 legend_spread_events.8060.t: "คำสารภาพบนเตียงมรณะ"
 legend_spread_events.8060.desc: "ข้าได้รับการทักทายจาก [chronicler.Custom2('MyCharacterIntroduction', ROOT.Char)] ผู้ ซึ่งอ้างว่ามีข้อมูลใหม่เกี่ยวกับ [legend.GetName]\n\n[chronicler.GetSheHe|U] อ้างว่าบนเตียงมรณะของ [ancestor.GetNamePossessive] [ROOT.Char.GetFaith.HighGodName] ได้เข้ามาในหัวใจของ [ancestor.GetHerHis] และ ทำให้ [ancestor.GetHerHim] ตระหนักถึงคุณธรรมของ [ROOT.Char.GetFaith.GetName]\n\nในการกระทำสุดท้ายนี้ [ancestor.GetSheHe] ได้รับการไถ่บาปและถูกนำไปยัง [ROOT.Char.GetFaith.PositiveAfterLife]"
 legend_spread_events.8060.a: "แน่นอน [ancestor.GetSheHe] เป็น [ROOT.Char.GetFaith.GetAdherentNameNoTooltip]!"
 legend_spread_events.8060.a.win: "ท่านโน้มน้าวทุกคน"
 legend_spread_events.8060.a.lose: "คำกล่าวอ้างของท่านยังคงไม่น่าเชื่อถือ"
 legend_spread_events.8060.b: "#EMP คุณค่า#! ของ [ancestor.GetHerHis|U] อย่างน้อยก็เป็น [ROOT.Char.GetFaith.GetReligion.GetAdjectiveNoTooltip]"
 legend_spread_events.8070.t: "เหตุการณ์ศักดิ์สิทธิ์"
 legend_spread_events.8070.desc: "[chronicler.Custom2('MyCharacterIntroduction', ROOT.Char)|U] มาหาข้าวันนี้พร้อมกับข้อเสนอที่น่าสนใจ [chronicler.GetSheHe|U] อ้างว่า [chronicler.GetSheHe] สามารถบิดเบือนความจริงเล็กน้อยและเขียน [legend.GetName] ใหม่ให้เกิดขึ้นในดินแดนศักดิ์สิทธิ์ของ [holy_site.GetName] แทนที่จะเป็น [location.GetName] บนโลก\n\nนี่แน่นอนว่าจะเป็นการปลอมแปลง แต่มันจะเพิ่มความศรัทธาให้กับเรื่องเล่า"
 legend_spread_events.8070.a: "มาทำกันเถอะ"
 legend_spread_events.8070.a.win: "ทุกคนเชื่อ"
 legend_spread_events.8070.a.lose: "ไม่มีใครเชื่อ"
 legend_spread_events.8070.b: "ไม่ [location.GetNameNoTooltip] ก็แค่ #EMP เหมือน#! [holy_site.GetNameNoTooltip]"
 legend_spread_events.8080.t: "หมัดในตำนาน"
 legend_spread_events.8080.desc: "ข้ากำลังสนทนาอย่างครึกครื้นกับ [chronicler.Custom2('MyCharacterIntroduction', ROOT.Char)] และกลุ่มข้าราชสำนักของข้า ข้ากำลังเล่าเรื่อง [legend.GetName] เมื่อข้าถูกขัดจังหวะโดย [chronicler.GetNameNoTooltip]\n\n"เตือนข้าทีว่า [legend.GetProperty('beast').GetFlagName] ถูกสังหารอย่างไรกันแน่ ฝ่าบาท [ROOT.Char.GetTitleAsNameNoTooltip] ของข้า จริงหรือไม่ที่มันถูกทุบตีจนตายในระยะประชิด?""
 legend_spread_events.8080.a: "ใช่ นั่นคือสิ่งที่เกิดขึ้นอย่างแน่นอน"
 legend_spread_events.8080.a.crit_win: "ทุกคนเชื่อท่าน"
 legend_spread_events.8080.a.win: "ผู้คนดูเหมือนจะเชื่อท่าน"
 legend_spread_events.8080.a.lose: "ผู้คนดูเหมือนจะไม่เชื่อท่าน"
 legend_spread_events.8080.a.crit_lose: "ไม่มีใครเชื่อท่าน"
 legend_spread_events.8080.b: "มันถูกสังหารเหมือนที่นักล่าคนใดจะทำ"
 legend_spread_events.8090.t: "[person_of_the_lake.GetLadyLord|U] แห่ง [watery_place.GetProvince.GetTerrain.GetNameNoTooltip|U]"
 legend_spread_events.8090.desc: "[chronicler.Custom2('MyCharacterIntroduction', ROOT.Char)|U] กำลังคัดลอก [legend.GetName] ลงบน [chronicler.Custom('GetWritingMaterial')] ขณะที่ข้าบอกเล่าให้ [chronicler.GetHerHim] ฟังอีกครั้ง แต่ขณะที่ข้าเล่าถึงจุดเริ่มต้นของเรื่องเล่า [chronicler.GetSheHe] ก็หยุดบันทึกคำพูดของข้าลงบน [chronicler.Custom('GetWritingMaterial')]\n\n"ข้าอดไม่ได้ที่จะสังเกตเห็นบางอย่างขาดหายไปที่นี่ ฝ่าบาท [ROOT.Char.GetTitleAsNameNoTooltip|U] ของข้า [legend.GetProtagonist.GetShortUIName] ไม่ได้พบกับ [person_of_the_lake.GetWomanMan] ลึกลับใน [watery_place.GetName] หรือ? [person_of_the_lake.GetWomanMan] ผู้นั้นไม่ได้ผุดขึ้นมาจากน้ำและมอบภารกิจศักดิ์สิทธิ์ให้ [legend.GetProtagonist.GetShortUIName] หรือ?""
 legend_spread_events.8090.a: "อา ใช่ เราจะลืมได้อย่างไร"
 legend_spread_events.8090.b: "ไร้สาระ: ข้าสร้างมันขึ้นมาเอง!"
 legend_spread_events.8100.t: "ผีสิงที่สุด"
 legend_spread_events.8100.desc: "ข้าถูกปลุกให้ตื่นจากการหลับใหลด้วยเสียงฟ้าผ่าและเสียง [ROOT.Char.Custom('GetDoor')] ของข้าพังเปิดออก [superstitious_courtier.Custom2('MyCharacterIntroduction', ROOT.Char)] ยืนอยู่ที่ปลายเตียงของข้า\n\n"ข้าขออภัยที่ปลุกท่าน ฝ่าบาท [ROOT.Char.GetTitleAsNameNoTooltip|U] ของข้า แต่พวกเราหลายคนนอนไม่หลับ ข้าเชื่ออย่างยิ่งว่ามีวิญญาณชั่วร้ายทำงานอยู่ที่นี่ และมันต้องการจะเอาพวกเราทุกคนไป"\n\nแม้ว่าข้าจะหงุดหงิดเล็กน้อยที่ถูกปลุกดึกดื่น เช่นนี้ ข้าก็ค่อนข้างคุ้นเคยกับพิธีกรรมในการกักขังวิญญาณชั่วร้ายไว้ในวัตถุ..."
 legend_spread_events.8100.a: "ข้าจะใส่มันลงในสิ่งประดิษฐ์ของข้า!"
 legend_spread_events.8100.a.win: "ท่านใส่วิญญาณเข้าไป"
 legend_spread_events.8100.a.lose: "ท่านล้มเหลวในการร่ายคาถา"
 legend_spread_events.8100.a.crit_lose: "ท่านเกิดอาการชัก"
 legend_spread_events.8100.b: "เจ้าบ้าไปแล้วหรือ? ออกไป!"
 legend_spread_events.8100.c: "ข้ารู้ว่าจะต้องทำอย่างไร"
 legend_spread_events.8100.d: "ข้าจะดูดซับวิญญาณเข้ามาในตัวเอง!"
 artifact_dread_gain_mult_3_modifier: "น่าสะพรึงกลัว"
 legend_spread_events.8110.t: "เลือดของ [loser.GetFaith.GetAdherentNamePluralNoTooltip|U]"
 legend_spread_events.8110.desc: ""โอ้ เลิกพูดได้แล้ว ไม่มีทางที่เรื่องนั้นจะเกิดขึ้น"\n\n"ไม่ มันเป็นเรื่องจริง! [infidel_weapon.GetName|U] แดงฉานไปด้วยเลือดของ [loser.GetFaith.GetAdherentNamePluralNoTooltip] หนึ่งพันคน! [ROOT.Char.GetNameNoTooltip|U] สังหารพวกเขาทั้งหมด [ROOT.Char.GetHerselfHimself] ใน [memory.GetName]!"\n\n[courtier_1.Custom2('MyCharacterIntroduction', ROOT.Char)|U] และ [courtier_2.Custom2('MyCharacterIntroduction', ROOT.Char)] กำลังโต้เถียงกันอย่างดุเดือด แต่ก็เงียบลงเมื่อพวกเขารู้ว่าข้ากำลังฟังอยู่"
 legend_spread_events.8110.a: "เป็นเรื่องจริง ข้าสังหารพวกเขาทั้งหมดด้วยตัวเอง"
 legend_spread_events.8110.a.win: "ท่านโน้มน้าวพวกเขาทั้งคู่"
 legend_spread_events.8110.a.lose: "ท่านไม่น่าเชื่อถือ"
 legend_spread_events.8110.b: "ไม่ นี่ไม่เป็นความจริง"
 legend_spread_events.8110.c: "การรบนั้นยิ่งใหญ่และควรค่าแก่การระลึกถึง"
 travel_to_distant_land_tt: "ท่านจะ [travel|E] ไปยัง [distant_location.GetName]"
 legend_spread_events.8120.t: "[distant_title.GetBaseNameNoTooltip|U] ลึกลับ"
 legend_spread_events.8120.desc: "ข้าได้รับการทักทายอย่างสุภาพจาก [chronicler.Custom2('MyCharacterIntroduction', ROOT.Char)] ผู้ ซึ่งดูเหมือนจะตื่นเต้นดีใจ\n\n[chronicler.GetSheHe|U] บอกข้าเกี่ยวกับดินแดนลึกลับที่รู้จักกันในชื่อ "[distant_title.GetBaseNameNoTooltip|U]" และ [chronicler.GetSheHe] ก็คลี่แผนที่ไปยังดินแดนมหัศจรรย์นี้ต่อหน้าข้า [chronicler.GetSheHe|U] บอกข้าว่าแม่น้ำไหลด้วยน้ำนมและน้ำผึ้ง และแม้ แต่ชาวนาก็อ้วนท้วนด้วยความอุดมสมบูรณ์ของแผ่นดิน แม้ว่าปกติข้าจะไม่เคยเดินทางไปไกลขนาดนั้น แต่เรื่องราวการเดินทางอันกล้าหาญของข้าก็จะส่งผลต่อ [legend.GetName] อย่างแน่นอน!"
 legend_spread_events.8120.a: "ข้าต้องไปที่นั่น!"
 legend_spread_events.8120.b: "[distant_title.GetBaseNameNoTooltip|U]? ไม่มีสถานที่ เช่นนั้นอยู่จริง"
 legend_spread_events.8121.t: "ดินแดนห่างไกล: ถูกทอดทิ้ง"
 legend_spread_events.8121.desc: "แผนที่มหัศจรรย์ของข้าเกี่ยวกับ [distant_title.GetBaseNameNoTooltip|U] ได้สูญหายไป และข้าเกรงว่าข้าอาจจะไม่ได้เดินทางไปยังดินแดนนั้นในชั่วชีวิตของข้า"
 legend_spread_events.8121.a: "อนิจจา"
 legend_spread_events.8122.t: "ดินแดนห่างไกล: การมาถึง"
 legend_spread_events.8122.desc.intro: "ในที่สุด ข้าก็มาถึง [distant_location.GetName] อันห่างไกล และ"
 legend_spread_events.8122.desc.disappointing.sweden: "ความผิดหวังของข้านั้นสุดจะประมาณ ท้องฟ้ามืดดำในเวลากลางวัน อาหารไม่มีอะไรมากไปกว่าปลาดองและขนมปังเก่าๆ คนท้องถิ่นปฏิเสธที่จะพูดคุยกัน และความหนาวเย็นก็ทนไม่ได้"
 legend_spread_events.8122.desc.disappointing.tribal: "ข้าผิดหวังอย่างยิ่ง ข้าถูกสัญญาว่าจะได้เห็นมหานครสูงตระหง่าน แต่ทั้งหมดที่ข้าเห็นคือเต็นท์และกระท่อมไม่กี่หลัง"
 legend_spread_events.8122.desc.disappointing.wet: "ข้าเสียใจกับสิ่งที่ข้าเห็น หลังจากลุยน้ำ ข้าเห็นกระท่อมที่กระจัดกระจายไม่กี่หลังสร้างอยู่รอบๆ น้ำโคลน"
 legend_spread_events.8122.desc.disappointing.dry: "ข้าตกใจที่เห็นสภาพของสถานที่แห่งนี้ พุ่มไม้แห้งๆ ไม่กี่พุ่มกระจายอยู่บนภูมิทัศน์ที่ถูกทิ้งร้างของอาคารที่ทรุดโทรม แทบไม่มีสิ่งมีชีวิตให้เห็น"
 legend_spread_events.8122.desc.disappointing.fallback: "นี่ห่างไกลจากสิ่งที่ข้าถูกสัญญาไว้มาก ดินแดนมหัศจรรย์อันยิ่งใหญ่ของ "[distant_title.GetBaseNameNoTooltip|U]" ที่กระตุ้นจินตนาการของข้าเป็นเพียงแค่นั้น: จินตนาการ [distant_title.GetBaseNameNoTooltip] ที่แท้จริงนั้นเศร้าและต่ำต้อย"
 legend_spread_events.8122.desc.not_disappointing: "[distant_title.GetBaseNameNoTooltip] เป็นอย่างที่ข้าหวังไว้! สถานที่แปลกประหลาดนี้มีชีวิตชีวาด้วยผู้คน และกว้างขวางด้วยอารยธรรม แผงขายของในตลาดเต็มไปด้วยอาหาร และเมืองก็มีชีวิตชีวาด้วยการพูดคุย"
 legend_spread_events.8122.desc.slightly_disappointing: "[distant_title.GetBaseNameNoTooltip] ไม่ใช่สิ่งที่ข้าถูกสัญญาไว้เสียทีเดียว แม้ว่าจะเป็นถิ่นฐานที่น่าประทับใจ แต่แม่น้ำก็ไม่ได้ไหลด้วยน้ำนมและน้ำผึ้ง และความมั่งคั่งของขุนนางท้องถิ่นก็ดูเหมือนจะไม่น่าเหลือเชื่อเป็นพิเศษ"
 legend_spread_events.8122.desc.somewhat_disappointing: "ข้าอดไม่ได้ที่จะรู้สึกผิดหวังเล็กน้อย ในขณะที่เป็นถิ่นฐานที่เพียงพออย่างสมบูรณ์แบบ หากนี่คือสิ่งที่ดีที่สุดที่ [distant_title.GetBaseNameNoTooltip] มีให้ ความงดงามของมันก็ถูกกล่าวเกินจริงไปมาก"
 legend_spread_events.8122.desc.bridge: "\n\nข้าเดินทางไปยังสิ่งที่ข้าสันนิษฐานว่าเป็นบ้านของตระกูลขุนนาง และข้าได้รับการทักทายโดย"
 legend_spread_events.8122.desc.outro.same_culture: "[distant_courtier.GetWomanMan] ที่คุ้นเคยอย่างประหลาด [distant_courtier.GetName|U] แนะนำ [distant_courtier.GetHerselfHimself] เป็นภาษา [ROOT.Char.GetCulture.GetLanguage.GetNameNoTooltip] ที่สมบูรณ์แบบ และเรียกร้องให้รู้ว่าข้าต้องการอะไรจากราชสำนักของนายจ้างของพวกเขา [distant_liege.GetName]"
 legend_spread_events.8122.desc.outro.same_religion: "[distant_courtier.GetWomanMan] [ROOT.Char.GetFaith.GetReligion.GetAdherentNameNoTooltip] ที่ดี! ดูเหมือนว่าแม้ แต่ที่นี่ [ROOT.Char.GetFaith.HighGodName|U] ก็ได้รับการบูชาอย่างเหมาะสม [distant_courtier.GetSheHe|U] เรียกร้องให้รู้ว่าข้าเป็นใครและอะไรนำข้ามาไกลขนาดนี้"
 legend_spread_events.8122.desc.outro.fallback: "[distant_courtier.GetWomanMan] ขุนนางแปลกหน้า ท่าทีอันสูงศักดิ์ของข้าเห็นได้ชัดว่านำหน้าข้าไปแล้ว เนื่องจาก [distant_courtier.GetSheHe] ดูเหมือนจะกระตือรือร้นที่จะรู้ทันทีว่าข้าเป็นใครและอะไรนำข้ามาที่นี่"
 legend_spread_events.8122.a: "ข้าต้องการดูว่าผู้คนที่นี่ต่อสู้อย่างไร"
 legend_spread_events.8122.b: "ให้ข้าบอกนายท่านของท่านเกี่ยวกับ [legend.GetName]"
 legend_spread_events.8122.b.success: "ตำนานของท่านน่าสนใจ"
 legend_spread_events.8122.b.failure: "[distant_liege.GetFirstName] เบื่อหน่าย"
 legend_spread_events.8122.c: "ท่านมีของขวัญให้ข้าหรือไม่?"
 legend_spread_events.8124.t: "ดินแดนห่างไกล: ความพ่ายแพ้"
 legend_spread_events.8124.desc: "แม้ว่าข้าจะต่อสู้อย่างกล้าหาญ แต่ดูเหมือนว่าข้าจะไม่สามารถเทียบเคียงกับรูปแบบการต่อสู้ของนักรบ [distant_title.GetAdjective] ได้ แม้ว่าข้าจะพ่ายแพ้ แต่เพียงแค่ความจริงที่ว่าข้าได้ปะทะอาวุธกับชาวต่างชาติในดินแดนลึกลับนี้ก็จะช่วยเสริมสถานะในตำนานของข้า"
 legend_spread_events.8124.a: "อนิจจา"
 legend_spread_events.8125.t: "ดินแดนห่างไกล: ชัยชนะ"
 legend_spread_events.8125.desc: "คู่ต่อสู้ของข้าต่อสู้ในรูปแบบที่ข้าไม่เคยเห็นมาก่อน และ แม้ว่าในตอนแรกมันจะ ทำให้ข้าเสียหลัก แต่ข้าก็ได้รับชัยชนะ ตำนานชัยชนะของข้าเหนือนักรบ [distant_title.GetAdjective] จะแพร่กระจายไปไกลและกว้างอย่างไม่ต้องสงสัย"
 legend_spread_events.8125.a: "ยอดเยี่ยม"
 legend_spread_events.8125.b: "เข้าร่วมกับข้า!"
 legend_spread_events.8130.t: "การเริ่มต้นจากทูตสวรรค์"
 legend_spread_events.8130.desc: "[chronicler.Custom2('MyCharacterIntroduction', ROOT.Char)|U] มาหาข้าพร้อมข่าวเกี่ยวกับ [legend.GetName] [chronicler.GetSheHe|U] บอกข้าว่า [chronicler.GetSheHe] ได้พบบันทึกหลายฉบับที่ยืนยันว่า [founder.GetName] เป็นมากกว่า [founder.GetTitleAsNameNoTooltip] สิทธิ์ของ [founder.GetHerHis|U] ในฐานะผู้ปกครอง [legend_title.GetName] ได้รับมอบให้ [founder.GetHerHim] โดยทูตสวรรค์\n\nผู้ส่งสารจาก [ROOT.Char.GetFaith.PositiveAfterLife] นี้สัญญาว่าตระกูล [ROOT.Char.GetHouse.GetNameNoTooltip] จะปกครอง [legend_title.GetName] ตลอดไปและปฏิบัติตามพระประสงค์ของ [ROOT.Char.GetFaith.HighGodNamePossessive] บนโลก แม้ว่าจะเป็นคำกล่าวอ้างที่เหลือเชื่อ แต่ถ้าข้าสามารถ ทำให้คนเชื่อได้มากพอ ก็จะไม่มีใครตั้งคำถามกับการปกครองของข้า"
 legend_spread_events.8130.a: "นี่เป็นเรื่องจริง"
 legend_spread_events.8130.a.win: "คำกล่าวอ้างของท่านน่าเชื่อถือ"
 legend_spread_events.8130.a.lose: "คำกล่าวอ้างของท่านถูกมองว่าเป็นพวกนอกรีต"
 legend_spread_events.8130.b: "ไม่ นี่เป็นพวกนอกรีต"
 legend_spread_events.8141.t: "ชัยชนะในตำนาน"
 legend_spread_events.8141.desc: "ขณะที่กองกำลังของ [enemy_commander.GetNamePossessive] แตกพ่าย ข้าก็ปล่อยให้ตัวเองดื่มด่ำกับความรุ่งโรจน์ของตัวเอง รอบตัวข้าคือธงที่ขาดรุ่งริ่งและซากศพที่เน่าเปื่อยของผู้ที่ต่อต้านข้า ทหารคนหนึ่งนอนอยู่ข้างข้า ร้องไห้ด้วยความเจ็บปวด มือเปื้อนเลือดในลำไส้ของตัวเอง ข้าสูดหายใจลึกๆ รับอากาศแห่งความตายอันฉุนเฉียว กลิ่นแห่งชัยชนะ\n\nแท้จริงแล้วการรบครั้งนี้ตัดสินด้วยความเก่งกาจของข้าในฐานะอัศวินและกลยุทธ์ในฐานะผู้บัญชาการ นี่คือการรบที่จะ ทำให้ชื่อเสียงของข้าโด่งดังอย่างแน่นอน"
 legend_spread_events.8141.a: "ตำนานที่ควรค่าแก่การบอกเล่า"
 legend_spread_events.8141.b: "นี่คือลางบอกเหตุของสิ่งที่จะเกิดขึ้น"
 legend_spread_events.8150.t: "รอยแผลถาวร"
 legend_spread_events.8150.desc: "ขณะที่ข้าเลี้ยงฉลอง ข้ารู้สึกว่า [intrigued_guest.Custom2('MyCharacterIntroduction', ROOT.Char)] กำลังจ้องมอง [ROOT.Char.Custom('GetInjuredBodyPart')] ของข้าอย่างตั้งใจ ไม่ต้องสงสัยเลยว่าสนใจใน [ROOT.Char.Custom('PermanentInjuryAdjective')] ของข้า\n\nทันทีที่ข้า ทำให้ [intrigued_guest.GetHerHim] รู้ว่าข้าสังเกตเห็น [intrigued_guest.GetSheHe] ก็รีบมองไปทางอื่น ไม่ต้องสงสัยเลยว่าอับอายที่ถูกจับได้ว่ากำลังจ้องมองความพิการของข้า แม้ว่าข้าจะรู้สึกถูกดูถูกเล็กน้อยจากความหลงใหลของ [intrigued_guest.GetHerHis] แต่นี่ก็ให้โอกาสข้าในการเล่าเรื่องราวว่าอาการบาดเจ็บนี้เกิดขึ้นได้อย่างไร"
 legend_spread_events.8150.a: ""ข้าได้รับบาดเจ็บจากการต่อสู้กับสัตว์ร้ายผู้ยิ่งใหญ่!""
 legend_spread_events.8150.b: ""ข้าถูกพวกนอกรีตโจมตีขณะต่อสู้เพื่อ [ROOT.Char.GetFaith.HighGodName|U]""
 legend_spread_events.8150.c: ""มันเป็นเรื่องเล่าที่ข้าจะนำติดตัวไปสู่หลุมศพ""
 legend_spread_events.8150.d: ""ท่านไม่มีมารยาทหรือ? อย่าจ้อง!""
 legend_spread_events.8160.t: "ความรักในตำนาน"
 legend_spread_events.8160.desc: "หัวใจของข้าเต้นระรัวเมื่อนึกถึง [soulmate.GetHerHim] และแม้ขณะที่ข้านั่งอยู่ตามลำพังใน [SelectLocalization( IsLandlessAdventurer( ROOT.Char ), 'เต็นท์', 'ห้องทำงาน')] ของข้า ข้าก็เพียงแค่ปรารถนาที่จะขับขานความรักของเราให้ทุกคนที่เต็มใจฟัง [ROOT.Char.Custom('WritingInstrument')] ของข้าบนหน้ากระดาษ ความรู้สึกของข้าไหลผ่านหมึกเร็วกว่าที่ข้าจะเขียนได้\n\nขณะที่ข้าเติมหน้ากระดาษด้วยคำสรรเสริญ [soulmate.GetHerHis] ข้าอดไม่ได้ที่จะคิดว่าข้าจะ ทำให้ความรักของเราเป็นอมตะผ่าน [legend.GetName] ได้อย่างไร! แม้ว่าเรื่องเล่าจะเน้นไปที่ข้า แต่การชนะใจ [soulmate.Custom('PetName')] ที่รักของข้าจะเป็นส่วนเสริมที่ยอดเยี่ยมให้กับเรื่องเล่า"
 legend_spread_events.8160.a: "เราจะเป็นตำนานด้วยกัน"
 legend_spread_events.8160.b: "ไม่ เรื่องเล่านี้สำหรับข้าเพียงผู้เดียว"
 legend_spread_events.8170.t: "ระฆังส่งวิญญาณ"
 legend_spread_events.8170.desc.intro: "ข้ากลับเข้าห้องพักในเย็นวันหนึ่ง เหนื่อยล้าและอ่อนเพลียจากวันอันน่าเบื่อหน่ายและซ้ำซากอีกวัน ขณะที่ข้าเอนกายลงบนขอบแห่งการหลับใหล ข้าก็ถูกปลุกให้ตื่นขึ้นทันทีด้วยเสียงกรีดร้องแหลมคมของโลหะบนหิน\n\nข้ายิงตัวตื่นขึ้นและเห็นร่างเงาอยู่ที่ขอบเตียงของข้า รอยยิ้มแสยะฟันของ [ROOT.Char.GetFaith.DeathDeityHerHis] เป็นส่วนเดียวที่ส่องสว่างของ [ROOT.Char.GetFaith.DeathDeityHerHim] ที่ข้าเห็นได้ชัดเจน ข้าขยับตัวไม่ได้ ข้าทำได้เพียงจ้องมองขณะที่ [ROOT.Char.GetFaith.DeathDeitySheHe] ก้าวเข้ามาหาข้า กริชอยู่ในมือ\n\nแล้วทันใดนั้น ข้าก็ตื่นขึ้นอีกครั้ง"
 legend_spread_events.8170.desc.mid.taoist: "นี่เป็นสัญญาณที่ชัดเจนว่าพลังงานของข้าไม่ได้สอดคล้องอย่างกลมกลืนกับ [ROOT.Char.GetFaith.HighGodName|U]"
 legend_spread_events.8170.desc.mid.reincarnation: "แม้ว่าวิญญาณของข้าจะดำเนินต่อไปในวัฏจักรแห่งการเวียนว่ายตายเกิดในวันหนึ่ง ข้าก็ยังไม่พร้อม"
 legend_spread_events.8170.desc.mid.fallback: "[ROOT.Char.GetFaith.DeathDeitySheHe|U] ได้ทำเครื่องหมายข้าด้วยการมาเยือนครั้งนี้"
 legend_spread_events.8170.desc.outro: "ข้าเกรงว่าข้าจะถูก [ROOT.Char.GetFaith.DeathDeityName|U] มารับตัวไปในไม่ช้า โชคชะตาที่ข้าต้องเปลี่ยนแปลง!"
 legend_spread_events.8170.a: "ข้าต้องเป็นอมตะ"
 legend_spread_events.8170.b.chess: "[ROOT.Char.GetFaith.DeathDeitySheHe|U] คงแค่อยากเล่นหมากรุก"
 legend_spread_events.8170.b.fallback: "มันเป็นความฝัน เพียงแค่นี้ และไม่มีอะไรมากไปกว่านี้"
 legend_spread_events.8171.t: "เสียงสะท้อนแห่งอนาคต"
 legend_spread_events.8171.desc: "ขณะที่ข้าอุ้มทารกแรกเกิดไว้ในอ้อมแขน ข้าอดไม่ได้ที่จะเห็นใบหน้าของตัวเองสะท้อนอยู่ใน [child.GetHerHis] ทุกคนบอกข้าว่า [child.GetSheHe] หน้าตาเหมือนข้า และพวกเขาก็พูดถูก\n\nบางทีนี่อาจเป็นความเป็นอมตะแบบที่ข้ากำลังแสวงหา ใครสักคนที่จะสืบทอดมรดกของข้าต่อไปและสานต่อเรื่องราวของข้าเมื่อข้าจากไป"
 legend_spread_events.8171.a: "เรื่องราวไม่มีวันจบ"
 legend_spread_events.8172.t: "จุดประสงค์ของข้าคืออะไร?"
 legend_spread_events.8172.desc: "ทุกสิ่งมืดมิดรอบตัวข้า ข้างหน้า แสงโดดเดี่ยวอยู่ไกลๆ เหมือนสัญชาตญาณ ข้าเดินข้ามความว่างเปล่านี้ไปยังจุดแสงเดียว จนกระทั่งข้าได้รับการทักทายจากร่างโดดเดี่ยวที่ แต่งกายด้วยชุดขาวล้วน ซึ่งดูเหมือนข้าในเวอร์ชันที่แก่กว่า\n\n[ROOT.Char.GetSheHe|U] ยิ้มให้ข้าด้วยความอบอุ่นแบบที่ [ROOT.Char.GetMotherFather] เท่านั้นที่ให้ได้ และเชิญข้าให้นั่งข้าง [ROOT.Char.GetHerHim] ดื่มด่ำกับความอบอุ่นจากการปรากฏตัวของ [ROOT.Char.GetHerHis] ข้ารู้สึกถึงความปิติยินดีและสันติสุขอย่างอธิบายไม่ได้\n\n"เจ้ารู้ไหมว่าเหตุใดข้าจึงสร้างให้มนุษย์ต้องตาย [ROOT.Char.GetFirstNameNoTooltip]? มันคือสิ่งที่แยกเจ้าออกจากข้า เจ้ารู้ว่าชีวิตมีค่าเพียงใด ความเป็นนิรันดร์ของเจ้าใน [ROOT.Char.GetFaith.PositiveAfterLife] กำลังจะมาถึง แต่สำหรับตอนนี้ มีผู้คนเบื้องล่างรอเจ้าอยู่""
 legend_spread_events.8172.a: ""ข้าเข้าใจแล้ว ในที่สุดข้าก็เข้าใจ""
 legend_spread_events.8172.b: ""ไม่! ข้า #EMP จะ#! มีชีวิตอยู่ตลอดไป!""
 legend_spread_events.8172.c: ""ข้าคิดว่าข้าพร้อมแล้วตอนนี้""
 legend_spread_events.8172.a.flavor: "ท่านตื่นขึ้น เป็น [ROOT.Char.GetWomanMan] ที่เปลี่ยนไป!"
 legend_spread_events.8172.b.flavor: "ท่านตื่นขึ้นมาอย่างกระปรี้กระเปร่า"
 legend_spread_events.8172.c.flavor: "ท่านตัดสินใจจากไปอย่างเงียบๆ"
 legend_spread_events.8180.t: "การแก้แค้นอันชอบธรรม"
 legend_spread_events.8180.desc: "เมื่อเร็วๆ นี้ข้านอนไม่หลับทั้งคืน นึกถึงว่า [dead_parent.Custom2('MyCharacterIntroduction', ROOT.Char)] [dead_parent.GetDeathReason] ได้อย่างไร จะเชื่อในความยุติธรรมได้อย่างไรเมื่อ [killer.GetSheHe] ยังมีชีวิตอยู่และ [dead_parent.GetFirstNameNoTooltip] ควรจะตาย?\n\nแค่คิดถึง [killer.GetHerHim] ที่ยังคงเดินกร่างไปมาพร้อมอากาศในปอดของ [killer.GetHerHis] ก็ ทำให้เลือดข้าเดือดพล่านและข้าแค่อยากจะยุติมัน"
 legend_spread_events.8180.a: "[killer.GetNameNoTooltip] คือศัตรูของข้า"
 legend_spread_events.8180.b: "ข้าต้องเรียนรู้ที่จะให้อภัย"
 8180_bonus_if_you_kill_tt: "คุณภาพตำนานของท่านจะเพิ่มขึ้นอย่างมากหากท่านสังหาร [killer.GetName]"
 legend_spread_events.8181.t: "การฝัง [killer.Custom2('InsultNoun'), ROOT.Char|U]"
 legend_spread_events.8181.desc.intro: "ในที่สุด [killer.GetName] ก็สิ้นลมหายใจ และข้าสามารถถอนหายใจอย่างโล่งอกได้แล้วตอนนี้ที่ [killer.GetSheHe] ไม่ได้ ทำให้โลกสกปรกด้วยการปรากฏตัวของ [killer.GetHerHis]"
 legend_spread_events.8181.desc.mid.murder: "การส่ง [killer.GetHerHim] ไปยัง [ROOT.Char.GetFaith.NegativeAfterLife] ด้วยมือของข้าเองถือเป็นเกียรติอย่างยิ่ง"
 legend_spread_events.8181.desc.mid.fallback: "ข้าหวังว่าจะได้สังหาร [killer.Custom2('InsultNoun', ROOT.Char)] ด้วยตนเอง แต่ดูเหมือนว่า [ROOT.Char.GetFaith.HighGodName] มีแผนการของ [ROOT.Char.GetFaith.HighGodHerHis] เอง สำหรับ [killer.Custom2('InsultNoun', ROOT.Char)]"
 legend_spread_events.8181.desc.outro: "\n\nข้ารู้สึกว่า [dead_parent.Custom2('MyCharacterIntroduction', ROOT.Char)] อาจจะพักผ่อนอย่างสงบได้ในที่สุด และโลกก็เป็นอย่างที่ควรจะเป็น"
 legend_spread_events.8181.a: "ความยุติธรรมในที่สุด"
 legend_spread_events.8190.t: "เด็ก [ROOT.Char.MakeScope.Var('animal_type').GetFlagName|U]"
 legend_spread_events.8190.desc: "ข้านั่งสบายๆ ในห้องทำงานของข้าตอนดึกคืนหนึ่ง เล่าเรื่อง [legend.GetName] ให้ [chronicler.Custom2('MyCharacterIntroduction', ROOT.Char)] ฟัง เมื่อความคิดหนึ่งผุดขึ้นมาในใจข้า ข้ามักถูกเพื่อนร่วมงานเรียกว่า 'คนประหลาด' มีบางอย่างเกี่ยวกับข้าที่ ทำให้คนอื่นสร้างความสัมพันธ์กับข้าได้ยาก\n\nข้าพยายามนึกถึงวัยเด็กตอนต้นของข้าไม่ค่อยออก แต่ข้ารู้สึกผูกพันอย่างแรงกล้ากับ [ROOT.Char.MakeScope.Var('animal_type').GetFlagName] ผู้สูงศักดิ์ เกือบจะเหมือนความรู้สึกที่มีต่อแม่หรือพ่อ ข้ายืนตัวตรงทันที และ [chronicler.GetNameNoTooltip] ก็ทำ [chronicler.Custom('WritingInstrument')] ของ [chronicler.GetHerHis] หล่น ข้ากล้าที่จะยืนยัน เช่นนั้นหรือไม่? ข้ากล้าที่จะบอกว่าข้าถูกเลี้ยงดูโดย [ROOT.Char.MakeScope.Var('animal_type').GetFlagName] หรือไม่?"
 legend_spread_events.8190.a: "ข้ากล้า!"
 legend_spread_events.8190.a.win: "ท่านโน้มน้าว [chronicler.GetFirstNameNoTooltip]"
 legend_spread_events.8190.a.lose: "มีบางอย่างสูญหายไปในการแปล"
 legend_spread_events.8190.a.crit_lose: "[chronicler.GetFirstNameNoTooltip] ดูเหมือนจะเยาะเย้ยท่าน"
 legend_spread_events.8190.b: "ข้าไม่กล้า"

