l_english: 
 bejewelled_modifier:0 "ประดับด้วยอัญมณี"
 bejewelled_modifier_desc:0 "ตัวละครนี้ได้รับเครื่องประดับอันเป็นเอกลักษณ์และเปี่ยมด้วยความใส่ใจ"
 close_support_modifier:0 "การสนับสนุนอย่างใกล้ชิด"
 close_support_modifier_desc:0 "ตัวละครนี้ได้รับการสนับสนุนจากญาติสนิท"
 financial_support_modifier:0 "คำแนะนำทางการเงิน"
 financial_support_modifier_desc:0 "ตัวละครนี้ได้รับคำแนะนำทางการเงิน"
 bedrock_modifier:0 "สามคนอลเวง"
 bedrock_modifier_desc:0 "ตัวละครนี้ได้เผชิญหน้าอย่างใกล้ชิดกับคู่รักสองคนที่มีความสัมพันธ์ร่วมกัน"
 generous_friend_modifier:0 "มิตรสหายผู้เอื้อเฟื้อ"
 generous_friend_modifier_desc:0 "ตัวละครนี้เป็นที่รู้จักในด้านความเอื้อเฟื้อเผื่อแผ่ต่อมิตรสหาย"
 lumberjack_modifier:0 "คนตัดไม้"
 lumberjack_modifier_desc:0 "ตัวละครนี้มีความชำนาญในการถางทางผ่านป่าไม้"
 brawny_modifier:0 "กำยำ"
 brawny_modifier_desc:0 "ตัวละครนี้ได้ฝึกฝนร่างกายอย่างมีประสิทธิภาพและถือว่ามีรูปร่างสมส่วนแข็งแรง"
 bog_smell_modifier:0 "กลิ่นบึง"
 bog_smell_modifier_desc:0 "ความยากลำบากของตัวละครนี้ในพื้นที่ลุ่มชื้นแฉะได้ทิ้งกลิ่นบึงจางๆ ติดเสื้อผ้าของพวกเขาไว้"
 tolerant_opinion_modifier:0 "ยอมรับคนต่างศาสนา"
 tolerant_opinion_modifier_desc:0 "ตัวละครนี้ปฏิบัติต่อผู้ที่นับถือศาสนาต่างกันด้วยความเคารพ"
 stanky_modifier:0 "มีกลิ่นไม่พึงประสงค์"
 stanky_modifier_desc:0 "ตัวละครนี้มีกลิ่น...แปลกๆ เล็กน้อย"
 life_of_the_party_modifier:0 "ดาวเด่นของงานเลี้ยง"
 life_of_the_party_modifier_desc:0 "ตัวละครนี้ได้รับการยกย่องว่าไม่เคยจัดงานเลี้ยงที่น่าเบื่อเลย"
