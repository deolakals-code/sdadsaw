 # Feudal Favoritism
 bp1_yearly.8070.t:0 "การลำเอียงแบบ [ROOT.Char.GetGovernment.GetNameNoTooltip|U]"
 bp1_yearly.8070.opening:0 "[claim_vassal.GetTitledFirstName] นั่งเงียบขรึมมาตลอดทั้งเย็น แต่ในที่สุดก็ระเบิดอารมณ์ออกมาเมื่อข้าเอื้อมมือไปหยิบ [ROOT.Char.Custom('GetExpensiveMealAlt')]\n\n"ข้าไม่เข้าใจเลยว่าเหตุใดท่านจึงมอบ [claim_title.GetName] ให้แก่ [favorite_vassal.GetTitledFirstName]"
 bp1_yearly.8070.strength_strong:0 "สิทธิ์อันชอบธรรมของข้าในดินแดนเหล่านี้เป็นที่ยอมรับของทุกคน!"\n\n"
 bp1_yearly.8070.strength_weak:0 "ดินแดนเหล่านี้โดยชอบธรรมแล้วเป็นของข้า!"\n\n"
 bp1_yearly.8070.claim:0 ""เหตุใดท่านจึงลำเอียงมอบดินแดนเหล่านี้ให้ [favorite_vassal.GetHerHim] แทนที่จะเป็นข้า? ข้ามิได้เป็นข้าในบังคับผู้ภักดีหรือ?""
 bp1_yearly.8070.lowborn:0 ""การยกย่องคนชั้นต่ำผู้นี้ขึ้นมาแทนที่ข้าถือเป็นการดูหมิ่น!""
 bp1_yearly.8070.other:0 ""ข้าได้กระทำความผิดร้ายแรงอันใด ท่านจึงปฏิบัติต่อข้าอย่างน่าอดสู เช่นนี้?""
 bp1_yearly.8070.hostile:0 "\n\n"การมอบดินแดนให้แก่ [favorite_vassal.GetFaith.GetAdherentName] ที่น่าสาปแช่งแทนที่จะเป็นข้า!" [ROOT.Char.Custom2('RelationToMe', claim_vassal)] ของข้าพูดตะกุกตะกัก, "มันขัดต่อมโนธรรม!""
 bp1_yearly.8070.culture:0 "\n\n"ข้าหมายถึง..." [ROOT.Char.Custom2('RelationToMe', claim_vassal)] ของข้าพูดตะกุกตะกัก, "[favorite_vassal.GetSheHe|U] ไม่ใช่ชาว [claim_vassal.GetCulture.GetName] ด้วยซ้ำ!""
 bp1_yearly.8070.faith:0 "\n\n"ข้าหมายถึง..." [ROOT.Char.Custom2('RelationToMe', claim_vassal)] ของข้าพูดตะกุกตะกัก, "[favorite_vassal.GetSheHe|U] ไม่ใช่แม้ แต่ [ROOT.Char.GetFaith.GetAdherentName]!""
 bp1_yearly.8070.a:0 "[favorite_vassal.GetFirstNameNoTooltip] มีคุณสมบัติที่เจ้าขาดไป"
 bp1_yearly.8070.b:0 "อภัยให้ข้าด้วย [claim_vassal.GetFirstNameNoTooltip], [claim_title.GetNameNoTierNoTooltip] เป็นของเจ้า"
 bp1_yearly.8070.c:0 "ข้าจะมอบบรรดาศักดิ์อื่นให้เจ้าแทน"
 bp1_yearly.8070.d:0 "อย่าได้ตั้งคำถามกับการตัดสินใจของข้าอีก"
 bp1_yearly.8070.d.success:0 "[claim_vassal.GetTitledFirstNameNoTooltip] พอใจแล้ว"
 bp1_yearly.8070.d.failure:0 "[claim_vassal.GetTitledFirstNameNoTooltip] รู้สึกถูกดูหมิ่น"
 # Unwelcome Favor
 bp1_yearly.8100.t:0 "คนโปรดที่ไม่เป็นที่นิยม"
 bp1_yearly.8100.joke:1 "ข้ายังคงยิ้มให้กับเรื่องตลกที่ [ROOT.Char.Custom2('RelationToMe', sycophant_scope)] ของข้า, [sycophant_scope.GetFirstName], เล่าในที่ประชุมสภาเมื่อเช้านี้ เมื่อ [jealous_scope.GetTitledFirstName] คว้าแขนข้าไว้"
 bp1_yearly.8100.thighs:0 "ข้ากำลังเหม่อลอย ครุ่นคิดถึงต้นขาอันได้รูปของ [ROOT.Char.Custom2('RelationToMe', sycophant_scope)] ของข้า, [sycophant_scope.GetTitledFirstNamePossessive], เมื่อข้าได้ยินเสียง [jealous_scope.GetTitledFirstName] กระแอมอยู่ข้างหลังข้า"
 bp1_yearly.8100.desc:0 "\n\n"[jealous_scope.Custom2('RelationToMe', ROOT.Char)|U], ข้าตั้งใจจะคุยกับท่านอยู่แล้ว"
 bp1_yearly.8100.lover_known:0 "ความ... โปรดปรานที่ท่านมีต่อ [sycophant_scope.GetFirstNameNoTooltip] นั้นหาได้รอดพ้นสายตาผู้ใด และก่อให้เกิด... คำถามเกี่ยวกับเหตุผลของท่าน"\n\n"
 bp1_yearly.8100.lover_secret:0 "ข้าและคนอื่นๆ ในราชสำนัก ไม่สามารถเข้าใจเกียรติยศและความรับผิดชอบที่ท่านมอบให้ [sycophant_scope.GetHerHim] ได้ ขุนนางผู้ทรงเกียรติแห่งอาณาจักรย่อมมีประโยชน์ต่อท่านมากกว่าเป็นแน่"\n\n"
 bp1_yearly.8100.lover:0 "ข้ารู้ว่าท่านรู้สึก... รักใคร่ [sycophant_scope.GetHerHim] อย่างมาก แต่จริงๆ แล้ว ตำแหน่งในสภาเนี่ยนะ?"\n\n"
 bp1_yearly.8100.friend:0 "ข้าเข้าใจว่าท่านเป็นสหายสนิทกัน แต่ก็มีผู้ที่คิดว่าท่านให้ความสำคัญกับ [sycophant_scope.GetHerHim] มากกว่าสมาชิกสภาที่สมควรได้รับมากกว่า"\n\n"
 bp1_yearly.8100.faction:0 ""พูดตามตรง หากการดูหมิ่นเหล่านี้ไม่ได้รับการแก้ไข มีเพียง [jealous_scope.GetFaith.HighGodName] เท่านั้นที่รู้ว่าจะเกิดอะไรขึ้นกับ [ROOT.Char.GetPrimaryTitle.GetBaseNameNoTierNoTooltip]...""
 bp1_yearly.8100.hostile:0 ""ข้าหมายถึง ท่านไม่รู้หรือว่า [sycophant_scope.GetWomanMan] นั่นเป็น [sycophant_scope.Custom2('InsultNoun', SCOPE.sC('jealous_scope'))] ที่ [sycophant_scope.Custom2('InsultAdjective', SCOPE.sC('jealous_scope'))] เพียงใด?""
 bp1_yearly.8100.lowborn:0 ""ไม่เหมาะสมที่จะให้ความเห็นของสามัญชนอยู่เหนือ หรือแม้ แต่อยู่เคียงข้าง ขุนนางชั้นสูงสุดของ [ROOT.Char.GetPrimaryTitle.GetBaseNameNoTierPossessiveNoTooltip]""
 bp1_yearly.8100.rank:0 ""แน่นอนว่าความเห็นของ [jealous_scope.GetTitleAsNameNoTooltip] ควรอยู่เหนือกว่าความเห็นของเพียง [sycophant_scope.GetTitleAsNameNoTooltip]!""
 bp1_yearly.8100.faith:0 ""เป็นการฉลาดแล้วหรือที่จะรับฟัง [sycophant_scope.GetFaith.GetAdjective] [jealous_scope.Custom2('GetUnbelieverTerm', sycophant_scope)]?""
 bp1_yearly.8100.culture:0 ""แน่นอนว่าเสียงของชาว [jealous_scope.GetCulture.GetName] อีกคนย่อมรับใช้ท่านได้ดีกว่าคนนอกชาว [sycophant_scope.GetCulture.GetName] ผู้นี้?""
 bp1_yearly.8100.unskilled:0 ""นอกเหนือจากการดูหมิ่นแล้ว [sycophant_scope.GetWomanMan] ผู้นี้เห็นได้ชัดว่าไม่เหมาะสมกับตำแหน่ง [sycophant_scope.GetCouncilTitle]""
 bp1_yearly.8100.skilled:0 ""ไม่ว่า [sycophant_scope.GetSheHe] จะเป็น [sycophant_scope.GetCouncilTitle] ที่ดีเพียงใด การดูหมิ่นนี้ก็เห็นได้ชัดเจน""
 bp1_yearly.8100.jealous:0 ""ยกตัวอย่างข้าก็ได้ - [jealous_scope.GetTitleAsNameNoTooltip] ผู้ภักดีแห่ง [ROOT.Char.GetPrimaryTitle.GetNameNoTierNoTooltip]""
 bp1_yearly.8100.fallback:0 ""
