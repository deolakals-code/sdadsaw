 bp1_yearly.8040.a.brave:0 "ฟังดูเหมือนความขี้ขลาดสำหรับข้า"
 bp1_yearly.8040.a.arbitrary:0 "ข้าจะประพฤติตนอย่างไรก็ได้ตามใจชอบ"
 bp1_yearly.8040.a.just:0 "คงไม่ถูกต้องหากจะทำเป็นอื่น"
