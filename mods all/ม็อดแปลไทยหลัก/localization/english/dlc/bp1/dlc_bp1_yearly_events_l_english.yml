l_english: 
 #Purchase a gift for your partner(s)
 bp1_yearly.2000.t:0 "ของขวัญที่เหมาะสำหรับ..."
 bp1_yearly.2000.desc.intro:0 "ความจอแจวุ่นวายเห็นได้ชัดเจนท่ามกลางแผงขายของของพ่อค้าเร่ กระท่อมชั่วคราวถูกวางซ้อนกันจนถึงจันทัน และบรรจุของกระจุกกระจิกทุกประเภท "
 bp1_yearly.2000.desc.greed_flavor:0 "ของเหล่านี้ดูแพง... แต่บางทีมันอาจจะคุ้มค่า"
 bp1_yearly.2000.desc.not_greed_flavor:0 "ของเหล่านี้เปล่งประกายอย่างแท้จริงและจะเป็นของขวัญที่น่ารัก"
 bp1_yearly.2000.desc.single:1 "\n\nขณะที่ [bp1_yearly_2000_partner_a.GetTitledFirstName] และข้าเดินผ่านพ่อค้าคนหนึ่งที่ขายเครื่องประดับ [bp1_yearly_2000_partner_a.GetSheHe] ลังเลเล็กน้อยขณะที่ [bp1_yearly_2000_partner_a.GetSheHe] เอนตัวเข้าไปดูใกล้ๆ\n\nบางทีหนึ่งในสิ่งเหล่านี้อาจ ทำให้วันของ [ROOT.Char.Custom2('PartnerOpinionDescription', SCOPE.sC('bp1_yearly_2000_partner_a') )] [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('bp1_yearly_2000_partner_a'))] ของข้าสดใสขึ้น?"
 bp1_yearly.2000.desc.duo:1 "\n\nขณะที่ข้าเดินผ่านพ่อค้าคนหนึ่งที่ขายเครื่องประดับ ข้าลังเลและเอนตัวเข้าไปดูใกล้ๆ\n\nบางทีหนึ่งในสิ่งเหล่านี้อาจ ทำให้วันของ [bp1_yearly_2000_partner_a.GetTitledFirstName] หรือ [bp1_yearly_2000_partner_b.GetTitledFirstName] อันเป็นที่รักของข้าสดใสขึ้น?"
 bp1_yearly.2000.a_single:1 "[ROOT.Char.Custom('RandomJewelry')] ที่เหมาะสำหรับ [bp1_yearly_2000_partner_a.GetFirstNameNoTooltip]!"
 bp1_yearly.2000.a_duo:1 "[ROOT.Char.Custom('RandomJewelry')] ที่เหมาะสำหรับ [bp1_yearly_2000_partner_a.Custom('ComplimentAdjective')] [bp1_yearly_2000_partner_a.GetFirstNameNoTooltip] ของข้า"
 bp1_yearly.2000.b:1 "[ROOT.Char.Custom('RandomJewelry')] ชิ้นนี้จะดู [ROOT.Char.Custom('RandomPositiveLookAdjective')] บนรูปร่าง [bp1_yearly_2000_partner_b.Custom('ComplimentAdjective')] ของ [bp1_yearly_2000_partner_b.GetFirstNamePossessiveNoTooltip]"
 bp1_yearly.2000.c:0 "ทำไมต้องเลือกแค่ชิ้นเดียว!"
 bp1_yearly.2000.c_flavor:0 "มาตามใจพวกเขาทั้งคู่กันเถอะ!"
 bp1_yearly.2000.d:0 "ของขวัญจากการอยู่ร่วมกับข้าก็สว่างไสวพอแล้ว"
 #Follow-up event
 bp1_yearly.2001.t:0 "... ผู้ปกครอง"
 bp1_yearly.2001.t.first_title_duo:0 "... ผู้ปกครอง..."
 bp1_yearly.2001.t.second_title_duo:0 "... และ [ROOT.Char.GetWomanMan|U] ที่ดี"
 bp1_yearly.2001.desc.intro_high_opinion:0 ""[ROOT.Char.GetFirstNameNoTooltip] ที่รักยิ่งของข้า ดีใจเหลือเกินที่ได้พบท่าน!\n\nข้าเฝ้ามองท่านขณะที่ท่านปกครอง [ROOT.Char.Custom('GetRealmOrDomicile')] ของเราอย่างขยันขันแข็ง และอยากจะช่วยเหลือในทุกวิถีทางที่ข้าสามารถทำได้""
 bp1_yearly.2001.desc.intro:0 ""[bp1_yearly_2001_partner.Custom2('RelationToMeShort', ROOT.Char)|U] ดูเหมือนว่าเราไม่ค่อยได้เจอกันเลย!\n\nข้าอาจจะค้นพบข้อมูลเล็กๆ น้อยๆ ที่จะเป็นประโยชน์ต่อการปกครองของเรา""
 bp1_yearly.2001.desc.segway_secret_hook:0 "\n\n[bp1_yearly_2001_partner.GetSheHe|U] มองข้ามไหล่ของ [bp1_yearly_2001_partner.GetHerHis] "
 bp1_yearly.2001.desc.secret:0 ""ข้าได้ยินบางอย่างที่ท่านจะไม่อยากเชื่อเลย ตอนที่ฟังพวกคนรับใช้เมื่อวันก่อน""
 bp1_yearly.2001.desc.hook:0 ""ข้าอาจจะ... เอาล่ะ อย่าไปสนใจเลยว่าข้าทำอะไรไปในเรื่องนั้น แต่สิ่งที่ข้าจะบอกคือคนรู้จักร่วมกันคนหนึ่งเป็นหนี้บุญคุณข้า""
 bp1_yearly.2001.desc.segway_lover:0 "\n\nสายลมเงียบๆ พัดผ่านเส้นผมของ [bp1_yearly_2001_partner.GetHerHis] "
 bp1_yearly.2001.desc.lover:0 "และข้าอดไม่ได้ที่จะจ้องมองลักษณะ [ROOT.Char.Custom('RandomPositiveLookAdjective')] ของ [bp1_yearly_2001_partner.GetHerHis] พยายามสลักภาพเหล่านั้นไว้ในใจ"
 bp1_yearly.2001.desc.segway_modifier:0 "\n\nจากนั้น [bp1_yearly_2001_partner.GetSheHe] ก็ทำหน้าเหยเก ราวกับนึกถึงบางสิ่งที่สำคัญขึ้นมา "ข้าสามารถ "
 bp1_yearly.2001.desc.close_modifier:0 "จับตาดูพฤติกรรม...ที่ไม่เหมาะสม...ใดๆ ที่มุ่งมาทางเราได้""
 bp1_yearly.2001.desc.finance_modifier:0 "พิจารณาให้คำแนะนำทางการเงินที่ดีที่สุดแก่ท่านจากแหล่งข่าวของข้า""
 bp1_yearly.2001.desc.close_finance_modifier:0 "\n\n"หรืออีกทางหนึ่งคือพิจารณาให้คำแนะนำทางการเงินที่ดีที่สุดแก่ท่านจากแหล่งข่าวของข้า""
 bp1_yearly.2001.desc.fallback:0 "\n\n"...หรือจริงๆ แล้ว ข้าเข้าใจผิดไป ขออภัยที่ ทำให้ท่านเสียเวลา!""
 bp1_yearly.2001.desc.outro:0 "\n\n[bp1_yearly_2001_partner.GetSheHe|U] เอียงศีรษะของ [bp1_yearly_2001_partner.GetHerHis] และมองมาที่ข้าอย่างคาดหวัง"
 bp1_yearly.2001.a:0 "โอ้ ได้โปรดบอกความลับมาเถิด [ROOT.Char.Custom('PartnerOpinionHighDescription')] ของข้า!"
 bp1_yearly.2001.a.tt_secret:0 "ความลับของ [bp1_yearly_2001_secret_owner.GetTitledFirstNamePossessive]"
 bp1_yearly.2001.a_tt:0 "[bp1_yearly_2001_partner.GetShortUINameNoTooltip] จะแบ่งปันความลับกับท่าน"
 bp1_yearly.2001.b:0 "ข้าสนใจใน #EMP ตัวท่าน #! มากกว่า [ROOT.Char.Custom('LoverPetName')] ของข้า!"
 bp1_yearly.2001.c:0 "ท่านทำได้อย่างไร... ช่างเถอะ ได้โปรดบอกข้าที!"
 bp1_yearly.2001.c_tt:0 "[bp1_yearly_2001_partner.GetShortUINameNoTooltip] ให้ข้อมูลเกี่ยวกับเรื่องหนึ่งแก่ท่าน"
 bp1_yearly.2001.d:0 "ข้าเชื่อใจให้ท่านคอยหนุนหลัง [ROOT.Char.Custom('PartnerOpinionHighDescription')] ของข้า"
 bp1_yearly.2001.e:0 "ข้า #EMP อยาก #! ให้การเงินดีขึ้นบ้าง"
 #You catch your spouses/consorts being lovers
 bp1_yearly.2010.t:0 "สองเรือในราตรี"
 bp1_yearly.2010.desc.intro:0 "เมื่อมองแวบแรก โถงทางเดินดูเหมือนร้าง ด้วยก้าวที่มั่นคง ข้าเดินไปยังภารกิจแรกของวันนี้\n\nทันใดนั้น ข้าได้ยินเสียงหัวเราะคิกคักที่ถูกกลั้นไว้ และข้าหยุดนิ่งอยู่กับที่ ข้าเอนตัวไปข้างหน้าเพียงเพื่อเหลือบเห็น [bp1_yearly_2010_first_partner.GetShortUIName] และ [bp1_yearly_2010_second_partner.GetShortUIName],"
 bp1_yearly.2010.desc.default:0 "โอบกอดกันอย่างอ่อนโยนในแสงยามเช้า\n\n"[bp1_yearly_2010_second_partner.GetFirstNameNoTooltip] อย่าล้อเล่นกับข้าเลย [ROOT.Char.Custom('LoverPetName')] ของข้า..." [bp1_yearly_2010_first_partner.GetSheHe|U] ซบหน้าของ [bp1_yearly_2010_first_partner.GetHerHis] ลงบนคอของ [bp1_yearly_2010_second_partner.GetFirstNameNoTooltip]\n\n"เราสามารถใช้เวลาคืนพรุ่งนี้ด้วยกันได้ [ROOT.Char.Custom('LoverPetName')] ของข้า" [bp1_yearly_2010_second_partner.GetFirstNameNoTooltip] ตอบโต้ "ตราบใดที่ข้าได้ใช้เวลากลางวันกับท่าน สิ่งอื่นใดก็ไม่สำคัญ""
 bp1_yearly.2010.desc.lustful:0 "ร้อนแรงและหนักหน่วง กำลังทำ... โอ้ #EMP พระเจ้า #!.\n\nในเวลากลางวันแสกๆ? และพวกเขากำลังทำอะไรกับ #EMP [ROOT.Char.Custom('DeviantObjectNoun')] #! นั่น?!"
 bp1_yearly.2010.a:0 "นั่นช่างหวานชื่น และอาจมีประโยชน์"
 bp1_yearly.2010.a_lustful:0 "ข้าควรเริ่มจดบันทึก!"
 bp1_yearly.2010.a_tt:0 "มีอะไร #EMP อื่น #! อีกที่เกิดขึ้นใต้หลังคาของข้า..."
 bp1_yearly.2010.a_tt_lustful:0 "ข้า #EMP ชอบ #! สิ่งนี้!"
 bp1_yearly.2010.b:0 "บางทีพวกเขาอาจต้องการมือ #EMP ที่สาม #!..."
 bp1_yearly.2010.tt:0 "ช่างเป็นสถานการณ์!"
 bp1_yearly.2010.c:0 "นี่มันเรื่องน่าหัวเราะเยาะ!"
 bp1_yearly.2010.c_tt:0 "หัวใจข้าแตกสลาย"

 bp1_yearly.5100.t:0 "ศรกามเทพ"
 bp1_yearly.5100.desc:0 "[unloved_courtier.GetName] [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('unloved_courtier'))] ของข้า ดูหงอยเหงามานานกว่าสัปดาห์แล้ว และนี่เป็นเสียงถอนหายใจอย่างหนักอึ้งสิ้นหวังครั้งที่ห้าของวันที่ในที่สุดก็ ทำให้ข้าต้องเอ่ยถามไถ่ถึงปัญหาอย่างนุ่มนวล\n\n"ข้าเหงาเหลือเกิน ข้าเพียงต้องการใครสักคน! ใครสักคนที่อยู่เคียงข้างข้าในยามกลางวัน และร่วมเตียงกับข้าในยามค่ำคืน!" [unloved_courtier.GetSheHe|U] หยุดชะงัก แล้วส่ายศีรษะ [unloved_courtier.GetHerHis] อย่างเศร้าสร้อย\n\n"ข้ากำลังพูดอะไรอยู่? ท่านไม่เข้าใจความทุกข์ของข้าหรอก ใช่หรือไม่ [ROOT.Char.Custom('FormOfAddressForLiege')]? ดูท่านสิ! ท่านช่าง"
 bp1_yearly.5100.desc.male:0 "หล่อเหลาคมเข้ม!"
 bp1_yearly.5100.desc.female:0 "สวยงามตามธรรมชาติ!"
 bp1_yearly.5100.desc.swole:0 "มีเสน่ห์ และรูปร่างเหมือนรูปปั้น!"
 bp1_yearly.5100.desc.scarred:0 "ดูสูงศักดิ์ ด้วยรอยแผลเป็นเหล่านั้น!"
 bp1_yearly.5100.desc.fallback:0 "สมบูรณ์แบบ!"
 bp1_yearly.5100.desc.end:0 "เรื่องทั้งหมดนี้ไม่เคยเป็นปัญหาสำหรับท่านเลยใช่ไหม?""
 bp1_yearly.5100.a:0 "แค่เป็นตัวของตัวเอง [unloved_courtier.GetNameNoTooltip]!"
 bp1_yearly.5100.b:0 "ท่านพูดถูก มันไม่เคยเป็น!"
 bp1_yearly.5100.c:0 "ข้าจะช่วยท่าน!"
 bp1_yearly.5100.d:0 "อย่าหมดหวัง [unloved_courtier.GetNameNoTooltip]"
 bp1_yearly.5100.toast:0 "มันไม่ได้ผล"

 bp1_yearly.5101.t:0 "ศรกามเทพ: เป้าหมาย"
 bp1_yearly.5101.desc:0 ""ท่านจะทำ เช่นนั้นหรือ [ROOT.Char.Custom('FormOfAddressForLiege')]? ท่านจะช่วยข้าจริงๆ หรือ?"\n\nข้าจำได้ว่าใบหน้าของ [unloved_courtier.GetNamePossessive] สว่างไสวขึ้นมา เมื่อข้าตกลงอย่างค่อนข้างระแวดระวังที่จะช่วย [unloved_courtier.GetHerHim] ค้นหารัก ทว่า ข้าก็ไม่ใช่ผู้ช่ำชองในการเป็นแม่สื่อเสียทีเดียวนัก ดังนั้น ข้าจึงก้าวออกไปสู่ฝูงชนที่ขวักไขว่ใน [ROOT.Char.GetCapitalLocation.GetTitle.GetNameNoTier] เพื่อค้นหาคู่รักที่เป็นไปได้ ด้วยความหวังมากกว่าความมั่นใจ\n\nข้ากวาดสายตาไปทั่วจัตุรัสตลาด พิจารณาผู้ที่มีแววหลายคน แต่เพื่อ [unloved_courtier.GetNamePossessiveNoTooltip] แล้ว ข้าควรจะมองหาคนที่เหมาะสมกับ [unloved_courtier.GetHerHim] จริงๆ ใครสักคนที่..."
 bp1_yearly.5101.a:0 "...ที่เอาใจใส่และอ่อนไหว"
 bp1_yearly.5101.b:0 "...ที่ยุติธรรมและไม่ลำเอียง"
 bp1_yearly.5101.c:0 "...ที่เคร่งศาสนาและกระตือรือร้น"
 bp1_yearly.5101.d:0 "...จริงๆ แล้ว เลือกคนที่โดดเด่นที่สุดดีกว่า"

 bp1_yearly.5102.t:0 "ศรกามเทพ: ยิงเข้าเป้า"
 bp1_yearly.5102.desc:0 "ขณะที่ข้าค้นหาต่อไป ร่างหนึ่งก็สะดุดตาข้า [potential_lover.GetSheHe|U]"
 bp1_yearly.5102.desc.compassionate:0 "ซ่อนตัวอยู่ในมุมหนึ่งของจัตุรัส ดูเหมือนกำลังช่วยแมวจรจัดที่ต้องการน้ำอย่างยิ่ง ขณะที่ [potential_lover.GetWomanMan] ปลอบโยนสัตว์น่าสงสาร ข้าเริ่มจินตนาการถึง [ROOT.Char.Custom('GetCourtierPlural')] ที่น่าสังเวชคนหนึ่งได้รับความเห็นอกเห็นใจแบบเดียวกัน..."
 bp1_yearly.5102.desc.just:0 "ดูเหมือนกำลังอยู่ในกระบวนการแก้ไขข้อพิพาทระหว่างชาวนาสองคน [potential_lover.GetSheHe|U] ตั้งใจฟังเรื่องราวของชาวนา แต่ละฝ่าย และตัดสินอย่างยุติธรรม ซึ่งทั้งคู่ดูเหมือนจะเห็นด้วย"
 bp1_yearly.5102.desc.zealous:0 "กำลังตั้งใจฟังนักเทศน์ที่กำลังด่าทอฝูงชน สำหรับข้าแล้วมันฟังดูเหมือนเสียงเพ้อเจ้อของคนบ้า แต่ดวงตาของผู้ฟังลุกโชนด้วยความกระตือรือร้น และ [potential_lover.GetSheHe] พยักหน้าอย่างกระตือรือร้นตามคำพูดพล่ามทางศาสนา"
 bp1_yearly.5102.desc.peng:0 "คงยากที่จะพลาด: ล้อมรอบด้วยกลุ่มผู้ชื่นชม เสื้อผ้าที่ค่อนข้างเก่าของ [potential_lover.GetHerHis] บ่งบอกถึงรูปลักษณ์ที่โดดเด่น"
 bp1_yearly.5102.desc.end:0 "\n\nเพียงแค่คำเชิญไปยัง [ROOT.Char.Custom('GetCourt')] ของข้าและคำสัญญาเรื่องคู่ครองก็เพียงพอที่จะ ทำให้ [potential_lover.GetWomanMan] ผู้ถูกประจบประแจงและตื่นเต้น — [potential_lover.GetName] ตามชื่อที่ [potential_lover.GetHerHis] เปิดเผย — ติดตามมาด้วย เมื่อพรวดพราดเข้ามาทางประตูอย่างมีชัย ข้าก็เห็น [unloved_courtier.GetName] กำลังจมอยู่กับการคร่ำครวญอย่างเซื่องซึมตามปกติของ [unloved_courtier.GetHerHis] ที่อีกฟากหนึ่งของราชสำนัก\n\n[unloved_courtier.GetNameNoTooltip] หันมาหาข้าอย่างคาดหวัง ดวงตาเปล่งประกายอย่างมีความหวัง"
 bp1_yearly.5102.a:0 "[unloved_courtier.GetNameNoTooltip]! มานี่!"
 bp1_yearly.5102.b:0 "จริงๆ แล้ว บางทีท่านอาจจะอยากงดการพบปะ?"
 bp1_yearly.5102.c:0 ""ท่านดีเกินไปสำหรับ [unloved_courtier.GetWomanMan] ในระดับ [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('unloved_courtier'))] ของข้า""
 bp1_yearly.5102.a.success:0 "พวกเขาเข้ากันได้ดี"
 bp1_yearly.5102.a.failure:0 "ไม่มีประกายไฟ"

 # Your friend is concerned about your weight
 bp1_yearly.5301.t:0 "ปัญหาน้ำหนัก"
 bp1_yearly.5301.start:0 "ข้ารู้สึกถึงสายตาของ [concerned_friend.GetFirstNamePossessive] ที่จับจ้องมาที่ข้าตลอดทั้งเย็นขณะที่เราทานอาหาร "
 bp1_yearly.5301.thicc:0 "แต่เมื่อข้ารับ [ROOT.Char.Custom('GetExpensiveDessert')] จานที่สามอย่างมีความสุข กำปั้นของ [concerned_friend.GetHerHis] ก็ทุบโต๊ะทันที\n\n"ข้าปล่อยให้เรื่องนี้ดำเนินต่อไปไม่ได้แล้ว!" [concerned_friend.GetSheHe] ตะโกนใส่ข้า "ข้านั่งดูท่านกินจนตายไม่ได้ [ROOT.Char.GetFirstName]!"\n\nข้าโกรธเล็กน้อย แต่ยากที่จะทำหน้าไม่พอใจทั้งที่ปากเต็มไปด้วยอาหาร บางทีข้า #EMP อาจจะ #! ชอบของว่างเป็นครั้งคราว แต่มันเป็นธุรกิจที่เครียดในการบริหาร [ROOT.Char.GetPrimaryTitle.GetTierAsName]!"
 bp1_yearly.5301.thinn:0 "แต่เมื่อข้ายังคงเขี่ยอาหารจานแรกขณะที่อาหารจานต่อไปเรียงคิวเข้ามา กำปั้นของ [concerned_friend.GetHerHis] ก็ทุบโต๊ะทันที\n\n"ข้าปล่อยให้เรื่องนี้ดำเนินต่อไปไม่ได้แล้ว!" [concerned_friend.GetSheHe] ตะโกนใส่ข้า "ข้านั่งดูท่านผอมแห้งตายไม่ได้ [ROOT.Char.GetFirstName]!"\n\nข้าโกรธเล็กน้อย แต่ยากที่จะทำหน้าไม่พอใจหลังกองจานที่สูงขึ้น บางทีข้า #EMP อาจจะ #! ไม่ค่อยมีเวลากินมากนัก แต่มันเป็นธุรกิจที่ต้องใช้เวลาในการบริหาร [ROOT.Char.GetPrimaryTitle.GetTierAsName]!"
 bp1_yearly.5301.a:0 "รู้อะไรไหม [concerned_friend.GetFirstNameNoTooltip]? ท่านพูดถูก"
 bp1_yearly.5301.a.tt:0 "ท่านทั้งสองหาวิธี ทำให้ร่างกายแข็งแรง"
 bp1_yearly.5301.b:0 "ข้าไม่ได้อ้วนขนาดนั้น!"
 bp1_yearly.5301.b.tt:0 "ท่านมองหาวิธีพิสูจน์ประเด็นของท่าน"
 bp1_yearly.5301.c:0 "ข้าไม่ได้ผอมเกินไป!"
 bp1_yearly.5301.d:0 "ท่านนั่นแหละที่ควรพูดเรื่องรูปร่างหน้าตา!"
 bp1_yearly.5301.d.tt:0 "ท่านทั้งสองชกต่อยกันอย่างน่าสมเพชเล็กน้อย"
 bp1_yearly.5301.d.tt.win:0 "ท่านชนะการต่อสู้"
 bp1_yearly.5301.d.tt.lose:0 "ท่านแพ้การต่อสู้"

 bp1_yearly.5302.t:0 "$bp1_yearly.5301.t$: เส้นทางขรุขระ"
 bp1_yearly.5302.desc:0 "เป็นวันที่สดใสและมีแดดจ้า ข้าเห็นเหงื่อหยดจากคางของ [concerned_friend.GetFirstNamePossessive] ขณะที่ [concerned_friend.GetSheHe] ยังคงให้กำลังใจข้าต่อไป กระสอบหินบนหลังของข้าส่งเสียงครวญครางภายใต้น้ำหนัก และข้าก็ครวญคราง เช่นกันขณะที่ข้าโยนมันลงข้ามเส้นบนพื้นดินที่ [concerned_friend.GetFirstNameNoTooltip] ขีดไว้ด้วยกิ่งไม้ [concerned_friend.GetSheHe|U] ตบมือของ [concerned_friend.GetHerHis] อย่างยินดี\n\n"ท่านดูแข็งแรงขึ้นแล้ว! ข้าคิดว่าถึงเวลาที่จะก้าวไปสู่สิ่งที่ใหญ่กว่านี้เล็กน้อย"\n\n"ข้ารู้ว่าพวกเขากำลังดำเนินการระบายน้ำในทุ่งนาถัดไปและต้องการความช่วยเหลือ หรือถ้าท่านรู้สึกกล้าหาญ มีป่าละเมาะอยู่เหนือยอดเขาที่พวกเขากำลังตัดไม้อยู่ ท่านคิดว่าอย่างไร?""
 bp1_yearly.5302.a:0 "เอาขวานมาให้ข้า!"
 bp1_yearly.5302.a.tt:0 "ท่านมุ่งหน้าไปยังป่าละเมาะ"
 bp1_yearly.5302.b:0 "แค่ช่วยงานระบายน้ำก็พอแล้ว"
 bp1_yearly.5302.b.tt:0 "ท่านออกเดินทางไปยังทุ่งนาใกล้เคียง"

 bp1_yearly.5303.t:0 "$bp1_yearly.5301.t$: ฟันไม้"
 bp1_yearly.5303.desc:0 "การโค่นต้นไม้เป็นธุรกิจที่อันตรายสำหรับคนที่ไม่มีประสบการณ์ เช่นข้า แม้จะอยู่ภายใต้การดูแลอย่างใกล้ชิดของ [concerned_friend.GetFirstNamePossessive] การผสมผสานระหว่างการขาดความตระหนักและความพยายามของข้าได้ ส่งผลให้เกิดเหตุการณ์เฉียดตายมาแล้วสองสามครั้ง ข้าเสียบขวานลงในเนื้อไม้ของท่อนซุงใกล้ๆ หยุดพักเพื่อดื่มน้ำจากกระติกของข้า [concerned_friend.GetFirstNameNoTooltip] เข้ามาหาข้า ขวานของ [concerned_friend.GetHerHis] พาดอยู่บนไหล่ของ [concerned_friend.GetHerHis]\n\n"ข้าคิดว่าท่านพร้อมที่จะรับมือกับสิ่งที่ใหญ่กว่านี้เล็กน้อยแล้ว!" [concerned_friend.GetSheHe] พูดอย่างร่าเริง และชี้ด้วยขวานของ [concerned_friend.GetHerHis] ต้นไม้ที่ถูกชี้มีขนาดใหญ่ เป็นไม้เนื้อแข็งสูงตระหง่าน และข้ามองมันอย่างระแวดระวังขณะที่กล้ามเนื้อที่ปวดเมื่อยของข้าเกร็งตัวด้วยความคาดหวัง"
 bp1_yearly.5303.a:0 "เอาล่ะ มันจะยากสักแค่ไหนกันเชียว?"
 bp1_yearly.5303.a.criticalsuccess:0 "ท่านตัดต้นไม้ลงได้สำเร็จ!"
 bp1_yearly.5303.a.failure:0 "ท่านไม่สามารถตัดต้นไม้ลงได้หากไม่มีคนช่วย"
 bp1_yearly.5303.a.wounded:0 "ต้นไม้ล้มทับท่านระหว่างทางลง"
 bp1_yearly.5303.a.criticalfailure:0 "ต้นไม้ล้มทับท่านโดยตรง!"
 bp1_yearly.5303.b:0 "ท่านช่วยข้าหน่อยได้ไหม [concerned_friend.GetFirstNameNoTooltip]?"

 bp1_yearly.5304.t:0 "$bp1_yearly.5301.t$: มาตรฐานบึง"
 bp1_yearly.5304.desc:0 "พื้นที่ลุ่มน้ำขังที่ข้าอาสาช่วยเหลือนั้น ทำให้เหงื่อออก ข้าทำงานหนักเคียงข้างชาวนาที่ไม่สงสัยอะไรด้วยพลั่ว ขุดคูน้ำและขนย้ายกระสอบโคลนเปียกออกจากพื้นที่\n\n[concerned_friend.GetFirstName] และข้ากำลังพักผ่อน ยืนพักอยู่บนแถบแคบๆ ระหว่างบึงสองแห่ง เมื่อ [waterboy.GetFirstName] หนึ่งในเด็กที่ได้รับมอบหมายให้คอยส่งน้ำให้คนงาน เดินมาหาข้าพร้อมยื่นกระติกน้ำให้ ทันทีที่ข้าดื่มอึกหนึ่ง [waterboy.GetFirstNameNoTooltip] เอื้อมมือไปหยิบขวด เสียหลักและตกลงไปในบึงทันที!"
 bp1_yearly.5304.a:0 "เกาะไว้ เด็กน้อย! ข้าช่วยเจ้าเอง!"
 bp1_yearly.5304.b:0 "...จะมีใครนอกจากเราสังเกตเห็นไหมถ้า [waterboy.GetSheHe] จมน้ำ?"

 bp1_yearly.5305.t:0 "$bp1_yearly.5301.t$: สุขภาพแข็งแรง"
 bp1_yearly.5305.desc:0 "เมื่อเสร็จสิ้นภารกิจ ข้ากล่าวคำอำลาชาวนาที่ข้าทำงานเคียงข้างกับ [concerned_friend.GetFirstName] — พวกเขาโบกมือลาข้าอย่างร่าเริง โดยไม่สงสัยในต้นกำเนิดอันสูงศักดิ์ของข้าเลย — และกลับไปยังที่พักตามปกติของข้า แม้ว่ากล้ามเนื้อของข้าจะปวดเมื่อย แต่ข้ารู้สึกเปี่ยมไปด้วยพละกำลังและความมีชีวิตชีวา\n\nเมื่อเห็นอ่างน้ำขนาดใหญ่ที่อีกฟากหนึ่งของห้อง ข้าพยุงตัวลุกขึ้นและเดินเข้าไปหา ถอดเสื้อออก ในแสงเทียนริบหรี่ ข้ามองดูตัวเองในเงาสะท้อนของน้ำ"
 bp1_yearly.5305.a:0 "ข้าดูดีมาก!"
 bp1_yearly.5305.b:0 "ข้าเป็นหนี้บุญคุณท่านทั้งหมด [concerned_friend.GetFirstNameNoTooltip]"

 bp1_yearly.5306.t:0 "$bp1_yearly.5301.t$: ทดสอบพละกำลัง"
 bp1_yearly.5306.start:0 "ด้วยความโกรธ ข้าเดินกระทืบเท้าไปทั่ว [ROOT.Char.Custom('GetCourt')] โดยมี [concerned_friend.GetFirstName] ตามมาติดๆ\n\n"[ROOT.Char.GetFirstName]! ได้โปรด ท่านไม่ต้องพิสูจน์อะไรให้ข้าเห็น! เราลืมเรื่องที่ข้าพูดไปก็ได้!" [concerned_friend.GetSheHe] ถูกตัดบทด้วยการโบกมืออย่างดูถูกของข้าขณะที่ข้ากวาดตามองไปทั่วห้องเพื่อหาสิ่งที่ใหญ่โตพอเหมาะ กล้าดียังไง [concerned_friend.GetSheHe] มาดูหมิ่นเกียรติของข้า เช่นนั้น!\n\n"
 bp1_yearly.5306.artifact:0 "สายตาของข้าจับจ้องไปที่ [bulky_artifact.GetName] "
 bp1_yearly.5306.throne:0 "สายตาของข้าจับจ้องไปที่บัลลังก์ของข้า"
 bp1_yearly.5306.table: "สายตาของข้าจับจ้องไปที่โต๊ะหนักๆ ตัวหนึ่ง"
 bp1_yearly.5306.ending:0 "ท่ามกลางความสยดสยองของ [concerned_friend.GetFirstNamePossessiveNoTooltip] ข้าถอดเสื้อออกและจัดท่าทันทีเพื่อยกน้ำหนักมหาศาลของมัน"
 bp1_yearly.5306.a:0 "จงดูข้า [concerned_friend.GetFirstNameNoTooltip]!"
 bp1_yearly.5306.a.success:0 "ท่านยกมันขึ้นสู่อากาศ!"
 bp1_yearly.5306.a.failure:0 "ท่านเคล็ดหลัง"
 bp1_yearly.5306.a.criticalfailure:0 "ท่านทำมันหล่นทับตัวเอง!"
 bp1_yearly.5306.a.criticalsuccess:0 "ท่านยกมันขึ้นสู่อากาศ"
 bp1_yearly.5306.b:0 "...คิดดูอีกที บางทีท่านอาจจะพูดถูก"

 bp1_yearly.5800.t:0 "กลิ่นแปลกๆ"
 bp1_yearly.5800.desc:0 "ตื่นขึ้นมาในตอนเช้าข้างๆ [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('surprised_sniffer'))] ของข้า [surprised_sniffer.GetFirstName] ข้าถอนหายใจและยืดตัวอย่างเกียจคร้านเพียงเพื่อเหลือบเห็นที่รักของข้าย่นจมูกของ [surprised_sniffer.GetHerHis] ข้าอ้าปากเพื่อสอบถามเพิ่มเติม แต่กลับ ทำให้ [surprised_sniffer.GetFirstNameNoTooltip] ถอยห่างออกไปอีก\n\n"ฟังนะ [ROOT.Char.GetFirstName] ที่รักของข้า..." [surprised_sniffer.GetSheHe] เริ่มพูดอย่างรวดเร็ว ราวกับว่าคำพูดหลุดออกมาจากปากของ [surprised_sniffer.GetHerHis] โดยไม่ได้ตั้งใจ "เรื่องนี้พูดยาก แต่... ช่วงนี้ท่านไม่ค่อยมีกลิ่นสดชื่นเท่าไหร่"\n\nด้วยความงุนงง ข้าดมรักแร้ของตัวเองอย่างสงสัย #flatulence sniff#!\n\nเอาล่ะ บางที [surprised_sniffer.GetSheHe] อาจจะมีเหตุผล"
 bp1_yearly.5800.a:0 "เราต้องหาวิธีแก้ไขปัญหานี้!"
 bp1_yearly.5800.a.tt:0 "ท่านค้นหาวิธีแก้ไขปัญหา"
 bp1_yearly.5800.b:0 "มันไม่ได้ #EMP แย่ #! ขนาดนั้น!"

 bp1_yearly.5801.t:0 "$bp1_yearly.5800.t$: กลิ่นแรกสุดยอด"
 bp1_yearly.5801.desc:0 "ข้าหาวอย่างเหนื่อยอ่อนขณะที่ [surprised_sniffer.GetFirstName] นำข้าเข้าไปในเมืองใกล้เคียงอย่างตื่นเต้น [surprised_sniffer.GetSheHe|U] ยืนกรานที่จะเดินทางออกไปโดยเร็วที่สุด - ซึ่งเมื่อมองย้อนกลับไปแล้วค่อนข้างดูถูก - และเราเดินฝ่าฝูงชนเล็กๆ ไปยังที่ที่พ่อค้าผลไม้และสมุนไพรกำลังขายสินค้าของตน\n\n"เอาล่ะ!" [surprised_sniffer.GetFirstNameNoTooltip] พูดอย่างคาดหวัง "เลือกจากหนึ่งในสิ่งเหล่านี้ พวกมันจะ ทำให้กลิ่นแรกออกมาสดชื่นและหอมหวานเหมือนผลไม้!" [surprised_sniffer.GetSheHe|U] กลอกตาของ [surprised_sniffer.GetHerHis] เมื่อเห็นสีหน้าไม่พอใจของข้า\n\n"เรากำลังทำ #EMP น้ำหอม #! แน่นอน!""
 bp1_yearly.5801.a:0 "นี่คือมะเดื่อหรือ?"
 bp1_yearly.5801.b:0 "บางทีอาจจะเป็นสะระแหน่?"
 bp1_yearly.5801.c:0 "ข้าชอบกลิ่นมะนาว!"
 bp1_yearly.5801.d:0 "ทับทิมคงจะแพง..."
 bp1_yearly.5801.fig:0 "[perfume_bottle.GetDesc] มีกลิ่นของมะเดื่อ"
 bp1_yearly.5801.mint:0 "[perfume_bottle.GetDesc] มีกลิ่นของสะระแหน่"
 bp1_yearly.5801.lemon:0 "[perfume_bottle.GetDesc] มีกลิ่นของมะนาว"
 bp1_yearly.5801.pomegranate:0 "[perfume_bottle.GetDesc] มีกลิ่นของทับทิม"

 bp1_yearly.5802.t:0 "$bp1_yearly.5800.t$: จากใจกลาง"
 bp1_yearly.5802.desc:0 "หลังจากที่ข้าตัดสินใจไปเมื่อสัปดาห์ก่อน ข้าเกือบลืมเรื่องภารกิจของ [surprised_sniffer.GetFirstNamePossessive] ในการปรุงน้ำหอมให้ข้าไปแล้ว ข้าเพิ่งนึกขึ้นได้เมื่อ [surprised_sniffer.GetSheHe] หยุดกึกกลางถนนและหมุนตัวกลับบนส้นเท้าของ [surprised_sniffer.GetHerHis] ลากข้าไปยังร้านขายเครื่องเทศข้างทาง\n\n\"ของพวกนี้สมบูรณ์แบบมาก!\" [surprised_sniffer.GetSheHe] พูดเสียงหวาน \"อะไรก็ได้ที่นี่จะสมบูรณ์แบบสำหรับหัวใจของน้ำหอม!\"\n\nข้ามองดูเครื่องเทศและเครื่องหอมที่รวบรวมไว้ หลายอย่างแปลกตาและไม่คุ้นเคยสำหรับข้า"
 bp1_yearly.5802.a:0 "นี่คืออะไร... กระวาน?"
 bp1_yearly.5802.b:0 "ท่านบอกว่าท่านเรียกสิ่งนี้ว่าลูกจันทน์เทศหรือ?"
 bp1_yearly.5802.c:0 "อบเชยนี้หอมเหลือเกิน!"
 bp1_yearly.5802.d:0 "กำยานจะ ทำให้เกิดกลิ่นหอมอันศักดิ์สิทธิ์!"
 bp1_yearly.5802.cardamom:0 "[perfume_bottle.GetDesc] กระวานหอม"
 bp1_yearly.5802.nutmeg:0 "[perfume_bottle.GetDesc] ลูกจันทน์เทศฉุน"
 bp1_yearly.5802.cinnamon:0 "[perfume_bottle.GetDesc] อบเชยอบอุ่น"
 bp1_yearly.5802.frankincense:0 "[perfume_bottle.GetDesc] กำยานเผ็ดร้อน"

 bp1_yearly.5803.t:0 "$bp1_yearly.5800.t$: ฐานที่แข็งแกร่ง"
 bp1_yearly.5803.desc:0 "เมื่อเดินผ่านพ่อค้าที่ชายป่า ซึ่งขายสิ่งที่ดูเหมือนจะเป็นไม้ประเภทต่างๆ และผลิตภัณฑ์ที่เกี่ยวข้อง ข้าเพียงแค่รู้สึกหวาดกลัวขึ้นมาเป็นวินาทีก่อนที่ดวงตาของ [surprised_sniffer.GetFirstNamePossessive] จะสว่างขึ้นและ [surprised_sniffer.GetSheHe] ดึงข้าไปหาพวกเขา\n\n"ตอนนี้ #EMP สิ่งเหล่านี้ #! จะเหมาะกับวัตถุประสงค์ของเราอย่างแน่นอน!" [surprised_sniffer.GetSheHe|U] ชี้ไปที่ไม้หายากบางชนิดและยางไม้ของพวกมันที่กองอยู่ทางซ้ายของพ่อค้า "สิ่งเหล่านี้จะให้กลิ่นฐานที่ทรงพลัง และ ทำให้มันคงอยู่ได้ทั้งวัน!"
 bp1_yearly.5803.a:0 "โอ๊กเป็นไม้ชั้นดี!"
 bp1_yearly.5803.b:0 "ข้าชอบลักษณะของยางไม้เหล่านี้"
 bp1_yearly.5803.c:0 "ไม้จันทน์? ช่างเป็นไม้ที่ไม่ธรรมดา"
 bp1_yearly.5803.d:0 "ท่านเรียกเศษไม้นี้ว่า 'อูด'? มันหอมหวาน!"
 bp1_yearly.5803.oak:0 "[perfume_bottle.GetDesc] โอ๊กแข็งแกร่ง"
 bp1_yearly.5803.resin:0 "[perfume_bottle.GetDesc] ยางไม้อำพัน"
 bp1_yearly.5803.sandalwood:0 "[perfume_bottle.GetDesc] ไม้จันทน์เรียบเนียน"
 bp1_yearly.5803.oud:0 "[perfume_bottle.GetDesc] อูดเหนียว"

 bp1_yearly.5804.t:0 "$bp1_yearly.5800.t$: หยดสุดท้าย"
 bp1_yearly.5804.desc:0 "แม้จะไม่เต็มใจ แต่ข้าก็สนุกกับการตามหาส่วนผสมน้ำหอม ด้วยความคาดหวังบางอย่าง ข้าจึงได้ยินข่าวเกี่ยวกับพ่อค้าในเมืองท้องถิ่นคนหนึ่ง ซึ่งมีสินค้าหายากและเป็นที่ต้องการอย่างสูงหลายรายการที่อาจ ทำให้ข้าสนใจ\n\nข้ามองดูสินค้า หญ้าแห้งสองสามต้น ผงสีขาว และ... สิ่งที่ดูเหมือนหินสีเทาหม่นๆ ที่ร่วน?\n\nพ่อค้ามองมาที่ข้าอย่างคาดหวังขณะที่ [surprised_sniffer.GetFirstName] พิจารณาสินค้า"
 bp1_yearly.5804.a:0 "เอาล่ะ อย่างน้อยหญ้าแห้งนี้ก็หอมดี"
 bp1_yearly.5804.a.tt:0 "ท่านซื้อหญ้าแฝก"
 bp1_yearly.5804.b:0 "ข้าคิดว่าผงสีขาวนี้คงจะลดลงได้ดี"
 bp1_yearly.5804.b.tt:0 "ท่านซื้อการบูร"
 bp1_yearly.5804.c:0 "ท่านบอกว่านี่คือ #EMP อาเจียนวาฬ #!?!"
 bp1_yearly.5804.c.tt:0 "ท่านซื้ออำพันทะเล"
 bp1_yearly.5804.d:0 "ไม่มีสิ่งใดในนี้ดูมีประโยชน์เลย!"

 bp1_yearly.5805.t:0 "$bp1_yearly.5800.t$: กลิ่นหอมเย้ายวน"
 bp1_yearly.5805.desc:0 "หลังจากมอบส่วนผสมทั้งหมดที่รวบรวมไว้ให้กับช่างฝีมือท้องถิ่นเมื่อสองสามวันก่อน ด้วยความยินดีและความกังวล ข้าแกะห่อหนังของน้ำหอมที่ได้ออกมา\n\nข้างในเป็นขวดเล็กๆ เรียบง่าย บรรจุส่วนผสมของสีต่างๆ ตอนแรกเป็น [ROOT.Char.Custom('GetSimpleColor')] แต่เมื่อข้ายกขึ้นส่องกับแสง มันก็เปลี่ยนเป็น [ROOT.Char.Custom('GetComplexColor')]\n\nข้าเปิดจุกไม้ก๊อกหยาบๆ และประสาทรับกลิ่นของข้าก็ถูกสัมผัสด้วยกลิ่นหอม ข้าเรียก [surprised_sniffer.GetFirstName] อย่างตื่นเต้น และเราทั้งสองต่างประหลาดใจกับกลิ่นหอมที่ลอยฟุ้งไปทั่ว [ROOT.Char.Custom('GetRoom')]"
 bp1_yearly.5805.a:0 "ข้ารู้สึกเหมือนเป็น [ROOT.Char.GetWomanMan] ที่ร่ำรวยที่สุดในโลก!"
 bp1_yearly.5805.b:0 "ข้าจะเอาขวดแบ่งไป ที่รักของข้าสามารถเอาขวดนี้ไปได้"
 bp1_yearly.5805.vetiver:0 "[perfume_bottle.GetDesc] และหญ้าแฝกกลิ่นไม้ หนัง"
 bp1_yearly.5805.camphor:0 "[perfume_bottle.GetDesc] และการบูรกลิ่นสมุนไพร เครื่องเทศ"
 bp1_yearly.5805.ambergris:0 "[perfume_bottle.GetDesc] และอำพันทะเลกลิ่นหวาน ดิน"
 bp1_yearly.5805.blended:0 "[perfume_bottle.GetDesc] และให้กลิ่นหอมหวาน"
 
 bp1_yearly.5708.t:0 "มิตรสหายผู้ซื่อสัตย์"
 bp1_yearly.5708.start:0 "ข้ากำลังเดินไปตามตรอกที่พลุกพล่านกับมิตรสหายของข้า [heathen_friend.GetFirstName] เมื่อ [heathen_friend.GetSheHe] หายตัวไปทันที ข้าหันไปเห็น [heathen_friend.GetHerHim] กำลังสนทนาอย่างลึกซึ้งกับพ่อค้าที่สินค้าดูเหมือนจะเป็นของกระจุกกระจิกเล็กๆ น้อยๆ ส่วนใหญ่ [heathen_friend.GetFirstNameNoTooltip|U] ทำธุรกรรมของ [heathen_friend.GetHerHis] เสร็จแล้ว เดินกลับมาหาข้าพร้อมกับคลำของที่ซื้อมาใหม่ของ [heathen_friend.GetHerHis] อย่างเหม่อลอย\n\n"
 bp1_yearly.5708.normal:0 ""มันเป็นสัญลักษณ์ทางศาสนา ไม่ใช่ของศรัทธา [ROOT.Char.GetFaith.GetAdjective] ของท่าน [heathen_friend.Custom2('RelationToMeShort', ROOT.Char)] ของข้า แต่เป็นของข้า" [heathen_friend.GetSheHe] อธิบาย รอยยิ้มปรากฏบนใบหน้าของ [heathen_friend.GetHerHis] ขณะที่ [heathen_friend.GetSheHe] เหลือบเห็นสัญลักษณ์ของข้าเอง ซึ่งห้อยอยู่บนสร้อยคอรอบคอของข้า"
 bp1_yearly.5708.aniconist:0 ""มันเป็นธูปแท่งเล็กๆ [heathen_friend.Custom2('RelationToMeShort', ROOT.Char)] ของข้า ข้าพบว่ามันช่วยให้จิตใจของข้าจดจ่อขณะที่ข้าปฏิบัติศรัทธาของข้า" [heathen_friend.GetSheHe] อธิบาย รอยยิ้มปรากฏบนใบหน้าของ [heathen_friend.GetHerHis] ขณะที่ [heathen_friend.GetSheHe] มองมาที่ข้า"
 bp1_yearly.5708.end:0 ""ข้าซาบซึ้งเสมอที่ท่านปฏิบัติต่อข้าเป็นอย่างดีแม้จะมีความแตกต่างทางเทววิทยาของเรา""
 bp1_yearly.5708.a:0 "นี่มันเรื่องไร้สาระของคนนอกรีต!"
 bp1_yearly.5708.b:0 "เอาล่ะ ถ้า [heathen_friend.GetFirstNameNoTooltip] ไม่ได้แย่ขนาดนั้น งั้น..."
 bp1_yearly.5708.b.tt:0 "ข้าในบังคับต่าง [faith|E] ที่ [GetTrait('zealous').GetName( GetNullCharacter )] ทั้งหมดสูญเสีย #negative_value 10#! [opinion|E] ต่อท่าน"
 bp1_yearly.5708.c:0 "บางทีข้าอาจเรียนรู้อะไรบางอย่างจาก [heathen_friend.GetFirstNameNoTooltip] ได้?"
 bp1_yearly.5708.c.tt.success:0 "ท่านเรียนรู้เพิ่มเติมเกี่ยวกับวิถีทางของ [heathen_friend.GetFirstNamePossessiveNoTooltip]"
 bp1_yearly.5708.c.tt.failure:0 "ท่านล้มเหลวในการทำความเข้าใจวิถีทางของ [heathen_friend.GetFirstNamePossessiveNoTooltip]"
 
 bp1_yearly.5709.t:0 "ตะขอ สาย..."
 bp1_yearly.5709.desc:0 "ช่างเป็นวันที่ยอดเยี่ยมสำหรับการตกปลา! ข้ารู้สึกเหมือนไม่มีอะไรจะลบรอยยิ้มออกจากใบหน้าของข้าได้ หากไม่ใช่ เพราะเสียงข้างหลังข้าและคู่หูตกปลาของข้า [friend_backup.GetFirstName]\n\n"ดูสิว่าเราเจอใคร!" [rival_on_sight.GetFirstName] เห็นได้ชัดว่าเพิ่งกลับมาจากการตกปลาของ [rival_on_sight.GetHerHis] เอง ขนาบข้างด้วยร่างของ [rival_friend.GetFirstName] คนแรกเอื้อมมือลงไปคว้าปลาที่ดิ้นรนตัวหนึ่งของพวกเขา "ความคล้ายคลึงกันช่าง #EMP น่าทึ่ง #!!"\n\nข้าหันหลังกลับพร้อมกลอกตาอย่างน่าทึ่ง แต่เสียง #EMP ตุ้บ #! และความเปียกชื้นที่ไหลลงมาด้านหลังคอของข้า ทำให้ข้าหยุดนิ่ง ดวงตาของ [friend_backup.GetFirstNamePossessiveNoTooltip] หรี่ลงขณะที่ [friend_backup.GetSheHe] มองดูปลาที่ถูกโยนใส่เรา"
 bp1_yearly.5709.a:0 "เราตัดสินเรื่องนี้ด้วยกำปั้นของเรา!"
 bp1_yearly.5709.a.tt.success:0 "ท่านชนะการทะเลาะวิวาท"
 bp1_yearly.5709.a.tt.failure:0 "ท่านแพ้การทะเลาะวิวาท"
 bp1_yearly.5709.b:0 "[rival_on_sight.GetFirstNameNoTooltip] เจ้า [rival_on_sight.Custom2('InsultNoun', ROOT.Char)]! ประลองกับข้า!"
 bp1_yearly.5709.b.tt:0 "เริ่ม $game_concept_single_combat_duel$ กับ [rival_on_sight.GetFirstNameNoTooltip]"
 bp1_yearly.5709.c:0 "ข้าจะไม่เข้าไปยุ่งกับการทะเลาะวิวาทแบบเด็กๆ"
 bp1_yearly.5709.c.tt:0 "ท่านปล่อยให้พวกเขาทำพฤติกรรมแบบเด็กๆ ต่อไป"

 bp1_yearly.5711.t:0 "...และตัวถ่วง"
 bp1_yearly.5711.desc:0 "[rival_on_sight.GetFirstName] โซเซลุกขึ้นยืนหลังจากที่เราประลองกัน ยังคงท้าทายอย่างโง่เขลา [rival_on_sight.GetSheHe|U] อ้าปากของ [rival_on_sight.GetHerHis] เพื่อบ่น แต่แทบจะไม่ได้พูดอะไรออกมาเลยก่อนที่ข้าจะยัดปลาที่เพิ่งใช้เป็นอาวุธขว้างเข้าไปในปากนั้น ด้วยอาการโซเซ [rival_on_sight.GetFirstNameNoTooltip] เดินโซซัดโซเซอย่างอันตรายไปยังขอบท่าเรือ\n\nข้าก้าวไปข้างหน้าอย่างรวดเร็วและวางเท้าลงบนท้องของ [rival_on_sight.GetHerHis] อย่างเต็มที่ ชั่วขณะหนึ่งที่ดูเหมือนยาวนาน [rival_on_sight.GetSheHe] ลอยอยู่ในอากาศ: แขนหมุนคว้าง ดวงตาเบิกกว้าง ปลายังคงอยู่ในหน้า ก่อนจะร่วงลงมาตรงๆ ทันที\n\nเสียงน้ำกระเซ็นดังสนั่น ทำให้เกิดละอองน้ำขนาดใหญ่ และ [rival_friend.GetFirstName] ที่หวาดกลัวก็คลานไปที่ขอบท่าเรือเพื่อยื่นมือออกไปหาเพื่อนที่กำลังสำลักน้ำของ [rival_friend.GetHerHis]"
 bp1_yearly.5711.a:0 "เจ้าก็ลงไปได้เหมือนกัน!"
 bp1_yearly.5711.b:0 "ฮ่า ฮ่า! สมควรแล้ว!"

 bp1_yearly.5712.t:0 "มีอะไรผิดปกติหรือเปล่า?"
 bp1_yearly.5712.desc:0 "ด้วยความโกรธ ข้าผลักตัวเองลุกขึ้นยืนเพื่อเผชิญหน้ากับเสียงเยาะเย้ยเย้ยหยันของ [rival_on_sight.GetFirstName] และพรรคพวกของ [rival_on_sight.GetHerHis] [rival_friend.GetFirstName] อย่างไรก็ตาม เนื่องจากข้ายืนไม่มั่นคง การพยายามชี้หน้าอกของ [rival_on_sight.GetFirstNamePossessiveNoTooltip] กลับ ทำให้ข้าเดินผ่าน [rival_on_sight.GetHerHim] ไปทั้งหมด ใช้เพียงการกวาดข้อเท้าของข้า และทันใดนั้นการมองเห็นของข้าก็ถูกบดบังด้วยฝุ่นอีกครั้ง\n\n[rival_on_sight.GetFirstNameNoTooltip] ยิ้มอย่างยินดี ปรบมืออย่างประชดประชันขณะที่ข้าม้วนตัวนอนหงาย ความโกรธของข้าเพิ่มขึ้นอีกครั้ง แต่ทันทีที่ข้านั่งลง ปลาน่ารังเกียจตัวนั้นก็ตบหน้าข้าอย่างจังอีกครั้งด้วยเสียง #EMP ตบ #! ดังสนั่น [rival_on_sight.GetFirstNameNoTooltip] และ [rival_friend.GetFirstNameNoTooltip] ระเบิดเสียงหัวเราะออกมาขณะที่พวกเขาเดินจากไป ทิ้งให้ [friend_backup.GetFirstName] ที่เป็นห่วงต้องพยุงข้าลุกขึ้นยืนในที่สุด"
 bp1_yearly.5712.a:0 "ข้าจะไม่ลืมเรื่องนี้ [rival_on_sight.GetFirstNameNoTooltip]!"
 bp1_yearly.5712.b:0 "บางทีข้าควรจะอยู่ห่างๆ [rival_on_sight.GetHerHis]..."

 bp1_yearly.5713.t:0 "ความสัมพันธ์ที่ประมาท"
 bp1_yearly.5713.desc:0 "ข้าบอกได้เลยว่ามีบางอย่างผิดปกติกับ [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('destitute_spouse'))] ของข้า [destitute_spouse.GetFirstName] ทันทีที่เราอยู่บนเตียงด้วยกัน [destitute_spouse.GetSheHe|U] เห็นได้ชัดว่าใจลอย และข้าจับมือของ [destitute_spouse.GetHerHis] อย่างนุ่มนวลขณะที่ข้าถาม [destitute_spouse.GetHerHim] ว่าเกิดอะไรขึ้น\n\n"มันเป็น... เรื่องเงิน" [destitute_spouse.GetSheHe] ถอนหายใจ ใช้มือข้างที่ว่างลูบศีรษะของ [destitute_spouse.GetHerHis] "ข้ามีครอบครัวบางคนที่โชคไม่ดี และพวกเขากำลังจะสูญเสียบ้าน ข้าเคยใช้เวลาอยู่ที่นั่นตอนเด็กๆ..."\n\n[destitute_spouse.GetSheHe|U] มองมาที่ข้าอย่างอ้อนวอน "มี... มีอะไรที่เราทำได้ไหม? ข้ามั่นใจว่าพวกเขาจะคืนเงินให้เราได้ พวกเขาแค่ต้องการตั้งหลักได้ พวกเขาจะทำได้ ข้าสาบาน!"
 bp1_yearly.5713.a:0 "ข้าจะจัดการเอง ตอนนี้ ให้ข้า #EMP จัดการ #! กับ #EMP ท่าน... #!"
 bp1_yearly.5713.b:0 "พวกเขาจะได้ทุกสิ่งที่ต้องการ และมากกว่านั้น"
 bp1_yearly.5713.c:0 "ปล่อยให้เป็นหน้าที่ข้า"
 bp1_yearly.5713.d:0 "กล้าดียังไงมาขู่กรรโชกข้า?!"

 bp1_yearly.5714.t:0 "กล่าวคำอำลา"
 bp1_yearly.5714.desc:0 "มีหลุมลึกและไม่มีที่สิ้นสุดในหัวใจของข้า\n\n[deceased_pal.GetFirstName] เป็นเพื่อนคู่คิดและคนสนิทตลอดมา และการที่ [deceased_pal.GetHerHim] ถูกพรากไปจากชีวิตของข้ารู้สึกเหมือนบาดแผลร้ายแรงที่ข้าจะไม่มีวันหาย มือของข้ากำจดหมายที่ [deceased_pal.GetSheHe] ให้ข้า - จดหมาย #EMP ฉบับสุดท้าย #! ที่ [deceased_pal.GetSheHe] จะให้ข้า ข้าตระหนักอย่างขมขื่น ข้าพยายามอ่านมัน แต่ทั้งหมดที่ข้าทำได้คือเลื่อนมันออกจากใบหน้าของข้า เพื่อไม่ให้ถ้อยคำอันล้ำค่าที่อยู่ในนั้นถูกชะล้างไปด้วยน้ำตาของข้า\n\nแม้ว่าจะมีฝูงชนผู้โศกเศร้ามากมายรอบตัวข้า แต่ข้าไม่เคยรู้สึกโดดเดี่ยวเท่านี้มาก่อน"
 bp1_yearly.5714.a:0 "ข้าจะไม่มีวันลืมวันนี้"
 bp1_yearly.5714.a.catharsis:0 "#weak ท่านประสบกับการปลดปล่อยอารมณ์ในระดับหนึ่ง #!"
 bp1_yearly.5714.a.sad:0 "#weak ความโศกเศร้าของท่านไหลออกมาอย่างอิสระ #!"
 bp1_yearly.5714.a.reallysad:0 "#weak ความโศกเศร้าของท่านท่วมท้น #!"
 bp1_yearly.5714.a.depressed:0 "#weak ท่านตกอยู่ในภาวะซึมเศร้า #!"
 bp1_yearly.5714.b:0 "ข้าต้องเข้มแข็งและก้าวต่อไป"

 bp1_yearly.5715.t:0 "คนโง่พูดพล่าม"
 bp1_yearly.5715.desc:0 ""ไม่! มันไม่ได้ออกเสียงอย่างที่ท่านว่า! ปราชญ์ผู้น่านับถือที่ #EMP คิดค้น#! คำนี้ขึ้นมา กล่าวว่ามันออกเสียงอย่างที่ข้ากำลังพูดอยู่-"\n\n[gibbet_friend.GetFirstName] [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('gibbet_friend'))] ของข้า และตัวข้า กำลังถกเถียงกันอย่างดุเดือดโดยไม่มีทีท่าว่าจะลดละ หลังจากเดินผ่านตะแลงแกงที่อยู่ใกล้ๆ [gibbet_friend.GetSheHe] ก็ได้เอ่ยถึงมันขึ้นมา ด้วยความที่ข้าคล่องแคล่วในภาษา [ROOT.Char.GetCulture.GetLanguage.GetNameNoTooltip] ข้าจึงได้แก้ไขการออกเสียงของ[gibbet_friend.GetHerHis] ให้ [gibbet_friend.GetHerHim] อย่างนุ่มนวล — มันเริ่มต้นด้วยเสียงหนัก ไม่ใช่เสียงเบา #EMP อย่างชัดเจน#! — และ [gibbet_friend.GetSheHe] ก็ช่างกล้าที่จะไม่เห็นด้วย แถมยังไม่เห็นด้วยอย่างเสียงดังโวยวายเสียอีก!\n\n"ข้าไม่อยากจะเชื่อว่าท่านยังคงยึดมั่นในจุดยืนทางภาษาศาสตร์ที่ [ROOT.Char.Custom2('InsultAdjective', SCOPE.sC('gibbet_friend'))] เช่นนี้!" [gibbet_friend.GetSheHe] โพล่งออกมาอย่างหงุดหงิดในความดึงดันของข้า"
 bp1_yearly.5715.a:0 "เราจะตกลงที่จะไม่เห็นด้วย"
 bp1_yearly.5715.b:0 "มันเป็นอย่างที่ข้าพูด จบเรื่อง!"
 bp1_yearly.5715.c:0 "มันคือ 'ตะแลงแกง' และข้าจะพิสูจน์ให้ดู!"
 bp1_yearly.5715.c.tt.success:0 "ท่านชนะการโต้เถียง"
 bp1_yearly.5715.c.tt.failure:0 "ท่านแพ้การโต้เถียง"
 bp1_yearly.5716.t:0 "ไปให้พ้น [ROOT.Char.GetFaith.random_EvilGodNames]!"
 bp1_yearly.5716.desc:0 "ขณะเดินเตร่อยู่ใน [ROOT.Char.Custom('GetCourt')] ของข้า ข้าได้ยินเสียงดังขึ้น เสียงหนึ่งใกล้จะโกรธ ข้าเดินกลับไปและพบกับฉากที่ไม่ธรรมดา [book_burner.GetFirstName] กำลังยืนตระหง่านอยู่เหนือ [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('book_child'))] ของข้า [book_child.GetFirstName] ดุด่า [book_child.GetHerHim] แม้ขณะที่ [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('book_burner'))] ของข้าโยนหนังสืออีกเล่มเข้าไปในกองไฟที่กำลังลุกโชน\n\n"เจ้าจะไม่ได้อ่าน #EMP สิ่งสกปรกที่ไม่บริสุทธิ์ #! นี้อีกต่อไป!!" [book_burner.GetSheHe] คำราม ประณามหนังสืออีกเล่มให้มอดไหม้ "ไม่มีเด็กคนใดในครัวเรือนนี้จะต้องทนทุกข์จากอิทธิพลของ [ROOT.Char.GetFaith.DevilNamePossessive]!""
 bp1_yearly.5716.nobook:0 "\n\nข้าหยิบหนังสือเล่มหนึ่งจากกองที่ [book_burner.GetFirstNameNoTooltip] ทำเครื่องหมายไว้เพื่อทำลาย พบเพียงเนื้อหาที่ไม่เป็นพิษเป็นภัยเกี่ยวกับ... การสร้างปราสาทเล็กๆ จากดิน?"
 bp1_yearly.5716.yesbook:0 "\n\nข้าหยิบ [burned_book.GetName] จากกองที่ [book_burner.GetFirstNameNoTooltip] ทำเครื่องหมายไว้เพื่อทำลายในขณะเดียวกันกับที่ [book_burner.GetSheHe] คว้ามัน เช่นกัน"
 bp1_yearly.5716.a:0 "บาปนี้จะไม่อยู่!"
 bp1_yearly.5716.b:0 "เอาล่ะ อะไรก็ได้ เพื่อให้เกิดความสงบสุข..."
 bp1_yearly.5716.c:0 "หยุดเดี๋ยวนี้! เด็กต้องเรียนรู้!"

 bp1_yearly.5717.t:0 "ทะเลาะวิวาทตอนเมา"
 bp1_yearly.5717.desc:0 "โรงเตี๊ยมใน [tavern_county.GetNameNoTier] มักเป็นสถานที่อันสมบูรณ์แบบสำหรับการลืมเลือนปัญหาของโลกหล้า ทว่าค่ำคืนนี้กลับเป็นข้อยกเว้น\n\nโชคไม่เข้าข้างเอาเสียเลย เมื่อโต๊ะถัดจาก [bff_defender.GetFirstName] และข้าไปเพียงโต๊ะเดียวคือ [5717_nemesis.GetFirstName] ศัตรูคู่อาฆาตของข้าผู้เป็น [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('5717_nemesis'))] และ [5717_nemesis.GetSheHe] ก็ก่อความรำคาญนับตั้งแต่เรามาถึง เพียงแค่ [5717_nemesis.GetHerHis] ทำ [5717_nemesis.Custom('RegionalDrink')] หกใส่แขนข้าอีกครั้งโดย 'บังเอิญ' [bff_defender.GetFirstNameNoTooltip] ก็ลุกพรวดขึ้นยืนบนเท้า [bff_defender.GetHerHis] ทันที\n\n[5717_nemesis.GetFirstNameNoTooltip] ลุกขึ้นตาม และทั้งสองก็กำลังตั้งท่าจะปะทะกันอย่างเมามายในตอนที่ข้าพยุงตัวเองลุกขึ้นยืนได้ เช่นกัน"
 bp1_yearly.5717.a:0 "ตี [5717_nemesis.GetHerHim] เข้าที่หน้าของ [5717_nemesis.GetHerHis] เลย [bff_defender.GetFirstNameNoTooltip]!"
 bp1_yearly.5717.a.tt.win:0 "[bff_defender.GetNameNoTooltip] ชนะการต่อสู้"
 bp1_yearly.5717.a.tt.lose:0 "[bff_defender.GetNameNoTooltip] แพ้การต่อสู้"
 bp1_yearly.5717.b:0 "[5717_nemesis.GetSheHe|U] ไม่คุ้มค่าหรอกเพื่อน!"
 bp1_yearly.5717.c:0 "หลีกไป [5717_nemesis.GetFirstNameNoTooltip] เป็นของข้า"
 bp1_yearly.5717.c.tt:0 "#weak ท่านทั้งสองนำข้อพิพาทออกไปข้างนอก...! #!"
 bp1_yearly.5717.c.tt.duel:0 "เริ่ม [single_combat_duel|E] ระหว่างตัวท่านกับ [5717_nemesis.GetFirstNameNoTooltip]"

 bp1_yearly.5718.t.win:0 "ท่านชนะการต่อสู้"
 bp1_yearly.5718.t.lose:0 "ท่านแพ้การต่อสู้"

 bp1_yearly.5719.t:0 "สถานการณ์ภาษี"
 bp1_yearly.5719.start:0 "เป็นเวลาหลายวันแล้วที่อัครเสนาบดีของข้า [chancellor.GetFirstName] สังเกตเห็นรายได้ส่วนหนึ่งหายไปโดยไม่ทราบสาเหตุ ตอนนี้ เมื่อเห็นหลักฐานแล้ว ข้าพบว่าตัวเองกำลังเรียกข้าในบังคับของข้า [disloyal_vassal.GetFirstName] เข้ามาเพื่อสอบถามเรื่องราวให้กระจ่าง\n\nหลักฐานของ [chancellor.GetFirstNamePossessiveNoTooltip] นั้นชัดเจนและไม่อาจโต้แย้งได้ [disloyal_vassal.GetFirstNameNoTooltip] ได้ยักยอกภาษีที่มีไว้สำหรับข้า!"
 bp1_yearly.5719.normal:0 "[disloyal_vassal.GetTitleAsNameNoTooltip|l] ผู้ฉ้อฉลไม่ได้พยายามที่จะปกป้อง [disloyal_vassal.GetHerselfHimself] กลับยิ้มอย่างพึงพอใจ\n\n"มันเป็นความจริงทั้งหมด [ROOT.Char.Custom('FormOfAddressForLiege')] ข้าเพียงแค่อยากได้คลังสมบัติที่อ้วนพีขึ้นเท่านั้น"\n\nนี่คือการท้าทายอำนาจของข้าอย่างโจ่งแจ้ง"
 bp1_yearly.5719.terrified:0 "[disloyal_vassal.GetTitleAsNameNoTooltip|l] ที่ทุจริตพยายามปกป้อง [disloyal_vassal.GetHerselfHimself] แต่พยายามหาคำพูดไม่เจอ ตัวสั่นต่อหน้าความโกรธเกรี้ยวของข้า\n\nข้าเห็นความกลัวในดวงตาของ [disloyal_vassal.GetHerHis] ขณะที่ข้าเดินไปมาต่อหน้า [disloyal_vassal.GetHerHim] แสดงท่าทีชั่งใจในการตัดสินใจของข้า"
 bp1_yearly.5719.a:0 "เจ้าจะต้องชดใช้เงินนั้นและจดจำวันนี้ไว้!"
 bp1_yearly.5719.a.tt.dread:0 "#medium ตัวเลือกนี้มีให้ท่านเนื่องจากระดับ [dread|E] ที่สูงของท่าน #!"
 bp1_yearly.5719.b:0 "จ่ายเงินนั้นคืนมา เดี๋ยวนี้"
 bp1_yearly.5719.b.tt.win:0 "[disloyal_vassal.GetFirstNameNoTooltip] คืนเงินอย่างไม่พอใจ"
 bp1_yearly.5719.b.tt.lose:0 "[disloyal_vassal.GetFirstNameNoTooltip] เยาะเย้ยคำเรียกร้องของท่านอย่างเปิดเผย"
 bp1_yearly.5719.c:0 "บางทีเราอาจจะประนีประนอมกันได้?"
 bp1_yearly.5719.d:0 "แค่... แค่อย่าทำอีก!"

 bp1_yearly.5720.t:0 "ทดสอบพละกำลัง"
 bp1_yearly.5720.desc:0 "ข้าดื่ม [ROOT.Char.Custom('RegionalDrink')] ในมื้ออาหารนี้ไปหลายถ้วยแล้ว แต่การปรากฏตัวอันน่าชิงชังของ [rival_challenger.GetFirstName] กลับทำลายค่ำคืนของข้า\n\n"เจ้า [ROOT.Char.Custom2('InsultNoun', SCOPE.sC('rival_challenger'))]! เจ้า [ROOT.Char.Custom2('InsultNoun', SCOPE.sC('rival_challenger'))]!" [rival_challenger.GetSheHe] ตะโกนลั่น "เจ้าไม่สามารถเอาชนะแม้กระทั่งเด็กในการประลองกำลังได้หรอก! ข้าสามารถตรึงแขนของเจ้าไว้กับโต๊ะได้เดี๋ยวนี้ โดยแทบไม่ต้องออกแรงเลยด้วยซ้ำ!"
 bp1_yearly.5720.a:0 "แน่นอน ด้วยแขน #EMP ซ้าย #! ของเรา ใช่ไหม?"
 bp1_yearly.5720.a.tt:0 "นี่อาจจะไม่ ทำให้ข้าเป็นที่นิยมใน [THIS.Char.Custom('GetCourt')] แต่จะรู้สึก #EMP ยอดเยี่ยม #!..."
 bp1_yearly.5720.b:0 "ฮ่า! ฮ่า! มาเลย!"
 bp1_yearly.5720.b.tt.win:0 "ท่านเอาชนะ [rival_challenger.GetNameNoTooltip] ได้อย่างง่ายดาย"
 bp1_yearly.5720.b.tt.bigwin:0 "ท่านหักแขนของ [rival_challenger.GetNamePossessiveNoTooltip]"
 bp1_yearly.5720.c:0 "พิสูจน์สิ เจ้า [rival_challenger.Custom2('InsultNoun', ROOT.Char)]!"
 bp1_yearly.5720.c.tt.win:0 "ท่านเอาชนะ [rival_challenger.GetFirstNameNoTooltip]"
 bp1_yearly.5720.c.tt.lose:0 "[rival_challenger.GetFirstNameNoTooltip] กดแขนท่านลงบนโต๊ะ"
 bp1_yearly.5720.d:0 "ข้าจะไม่เข้าไปยุ่งกับเกมหยุมหยิมเหล่านี้"

 bp1_yearly.5721.t:0 "รอบกองไฟ"
 bp1_yearly.5721.desc:0 "ช่างเป็นคืนที่สวยงาม! กองไฟแตกปะทุและส่งเสียงดังป๊อบแป๊ะ พ่นควันขึ้นสู่ท้องฟ้ายามค่ำคืน ของหวานเคลือบน้ำผึ้งที่เสียบอยู่ที่ปลายไม้ของข้าค่อยๆ กลายเป็นคาราเมล และข้ามองดูสีที่ค่อยๆ เปลี่ยนไปของมันด้วยความสนใจ\n\nข้างๆ ข้า [marshmallow_friend.GetFirstName] กำลังทำ เช่นเดียวกันขณะที่ผู้ใหญ่ดื่ม [ROOT.Char.Custom('RegionalDrink')] และเล่าเรื่องราวเหตุการณ์ในอดีตให้กันฟัง หลายปีก่อนที่เราทั้งคู่จะเกิด\n\n[marshmallow_friend.GetSheHe|U] และข้ายังไม่ค่อยได้คุยกันมากนัก แต่คงจะดีถ้าได้คุยกับคนรุ่นราวคราวเดียวกันบ้าง..."
 bp1_yearly.5721.a:0 "เจ้า... เจ้าอยากเป็นเพื่อนกับข้าไหม [marshmallow_friend.GetFirstNameNoTooltip]?"
 bp1_yearly.5721.a.tt.yes:0 "ท่านสร้างมิตรภาพ"
 bp1_yearly.5721.a.tt.no:0 "[marshmallow_friend.GetFirstNameNoTooltip] ไม่สนใจ"
 bp1_yearly.5721.b:0 "นี่สนุกมาก!"
 bp1_yearly.5721.c:0 "ข้าอยากได้ของหวานอีกชิ้น..."
 bp1_yearly.5721.c.tt:0 "ด้วยการเบี่ยงเบนความสนใจเล็กน้อย ท่านอาจจะคว้าขนมหวานที่ [marshmallow_friend.GetSheHe] กำลังย่างอยู่ได้..."
 
 bp1_yearly.5722.t:0 "เครื่องยิงแมว"
 bp1_yearly.5722.desc:0 ""เราพบกันอีกแล้ว [ROOT.Char.GetFirstName] เจ้า [ROOT.Char.Custom('InsultNoun')]!" [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('rival_catapulter'))] ของข้า [rival_catapulter.GetFirstName] เยาะเย้ยขณะที่ [rival_catapulter.GetSheHe] เข้ามาทักทายข้าขณะที่ข้ากำลังตรวจสอบยุทโธปกรณ์ใหม่ "ในที่สุด เราสองคนผู้มีเกียรติ เราพบกันอย่างเท่าเทียม- ฮ่า! โดนแล้ว!"\n\nข้าใช้เวลาครู่หนึ่งในการประมวลผลว่า [rival_catapulter.GetFirstNameNoTooltip] เพิ่งอุ้มแมวของข้า [ROOT.Char.Custom('CatStoryName')] ขึ้นมา และอีกครู่หนึ่งในการตระหนักว่า [rival_catapulter.GetSheHe] กำลังวิ่งหนี เมื่อข้าหายตกใจ ข้าก็วิ่งตาม [rival_catapulter.GetHerHim] ไปเพียงเพื่อพบว่า [rival_catapulter.GetHerHim] กำลังบรรจุแมวสุดที่รักของข้าลงในเครื่องยิงหินใกล้ๆ!\n\nข้าก้าวเข้าไปหามันหนึ่งก้าว ยื่นมือออกไป แต่มันสายเกินไปแล้ว\n\n"เมี้ยววววว#DIE1 อ๊าววววว #!#DIE2 อ๊าววววว—#!""
 bp1_yearly.5722.a:0 "โอ้ ไม่นะ เจ้าทำไม่ได้!"
 bp1_yearly.5722.a.tt:0 "ท่านปล้ำ [rival_catapulter.GetFirstNameNoTooltip] ลงกับพื้นก่อนที่ [rival_catapulter.GetSheHe] จะหนีไปได้"
 bp1_yearly.5722.b:0 "[ROOT.Char.Custom('CatStoryName')]! #EMP ไม่นะ! #!"
 bp1_yearly.5722.c:0 "ข้าจะจัดการเจ้า [rival_catapulter.GetFirstNameNoTooltip]! ข้าสาบาน!"

 bp1_yearly.5723.t:0 "ยิงไกล"
 bp1_yearly.5723.desc:0 "ดวงตาของ [rival_catapulter.GetFirstNamePossessive] เบิกกว้างด้วยความประหลาดใจและความกลัวขณะที่ข้าปล้ำ [rival_catapulter.GetHerHim] ลงกับพื้น\n\n"เจ้าอาจทำร้ายข้าได้" ข้าพูดเสียงต่ำ ยืนขึ้นอีกครั้งและขอยามที่รวมตัวกันนำเชือกมาให้\n\n"เจ้าอาจทำร้ายครอบครัวของข้าได้ด้วยซ้ำ" ข้าพูดต่อ มัดมือและเท้าของเชลยผู้โชคร้ายของข้าเข้าด้วยกัน\n\n"แต่เจ้าทำผิดพลาดร้ายแรงที่ทำร้าย #EMP [ROOT.Char.Custom('CatStoryName')] #!." [rival_catapulter.GetFirstNameNoTooltip] แขนขาที่ถูกมัดสั่นเทา อ้าปากของ [rival_catapulter.GetHerHis] เพื่อขอร้อง\n\nข้าเอื้อมมือไปที่คันโยก"
 bp1_yearly.5723.a:0 "#EMP ปิ้ว! #!"
 bp1_yearly.5723.b:0 "ข้าจะไว้ชีวิตเจ้า เพื่อ [ROOT.Char.Custom('CatStoryName')]"

 bp1_yearly.5724.t:0 "[ROOT.Char.Custom('CatStoryName')]: แมวสบายดี"
 bp1_yearly.5724.desc:0 "สามวันที่ผ่านมาของข้าอยู่ภายใต้เมฆดำ [ROOT.Char.Custom('CatStoryName')] อันล้ำค่าและไร้เดียงสาของข้า... ราวกับว่าข้ายังคงได้ยินเสียงร้องเหมียวๆ อยู่ในตอนนี้\n\nไม่สิ เดี๋ยวก่อน... ข้า #EMP ได้ยิน #! เสียงร้องเหมียวๆ ข้าสาบานได้! เดินสะดุดไปทั่วห้องด้วยความตื่นเต้น ข้าสะดุดโต๊ะเล็กๆ สูงระดับหน้าแข้ง ด้วยความโมโห ข้าพยุงตัวเองลุกขึ้นยืน เสียงร้องเหมียวๆ อีกครั้ง ดังขึ้นและคร่ำครวญ ในที่สุดข้าก็ไปถึงประตูและกระชากเปิดออกเพื่อพบ [ROOT.Char.Custom('CatStoryName')] นั่งอยู่ที่นั่น: ปลอดภัยดีและรำคาญมาก!\n\nข้ากวาดแมวสุดที่รักของข้าเข้ามาในอ้อมแขนทันที ซบหน้าลงบนขนที่สกปรกและเต็มไปด้วยกิ่งไม้\n\n[ROOT.Char.Custom('CatStoryName')] ดิ้นรนอย่างโกรธเคืองในอ้อมกอดของข้า"
 bp1_yearly.5724.a:0 "[ROOT.Char.Custom('CatStoryName')]! เจ้า #EMP ยังมีชีวิตอยู่! #!"
 bp1_yearly.5724.b:0 "ข้าจะไม่ปล่อยเจ้าไปอีกแล้ว!"

 bp1_yearly.5725.t:0 "[khutulun.GetWomanMan|U] เถื่อน"
 bp1_yearly.5725.desc:1 ""#EMP ทำไม #! ท่านถึงไม่เคยได้ยินเรื่อง [khutulun.GetHerHim] [ROOT.Char.GetLadyLord] ของข้า?"\n\nข้ากลอกตาและส่งเสียงฮึดฮัดอย่างดูถูก การจะบอกว่าจินตนาการเพ้อฝันของ [matchmaker_courtier.GetFirstName] นั้นต่ำต้อยเกินไปสำหรับข้าในตอนนี้คงจะเป็นการพูดน้อยไป\n\n"พวกเขาบอกว่า [khutulun.GetSheHe] มีคำท้าเปิดสำหรับทุกคน [ROOT.Char.GetLadyLord] ของข้า!" [matchmaker_courtier.GetFirstNameNoTooltip] พยายามอีกครั้ง คราวนี้อย่างยืนกราน ลดเสียงของ [matchmaker_courtier.GetHerHis] ลงอย่างลับๆ [matchmaker_courtier.GetSheHe] พูดต่อ "ฟังนะ ข้ารู้ว่าท่านเบื่อคำถามเรื่องการ แต่งงานทั้งหมด [khutulun.GetWomanMan] ผู้นี้เสนอ [khutulun.GetHerHis] มือในการ แต่งงานให้กับทุกคนที่สามารถเอาชนะ [khutulun.GetHerHim] ในด้านความสามารถทางกายภาพได้"\n\nข้านั่งพิงและพิจารณาเรื่องราว [khutulun.GetWomanMan] ที่มีใจรักการต่อสู้? แน่นอนว่าข้าสามารถได้รับชัยชนะและได้ [khutulun.GetWifeHusband] ใหม่มาด้วย ไม่ว่าทักษะของพวกเขาจะเป็นอย่างไร"
 bp1_yearly.5725.a:0 "เอาล่ะ [matchmaker_courtier.GetFirstNameNoTooltip] เราจะขี่ม้าไปตรวจสอบ"
 bp1_yearly.5725.b:0 "พอได้แล้วกับเรื่องเล่าสูงๆ ของท่าน!"

 bp1_yearly.5726.t:0 "[khutulun.Custom('GetBrideGroom')|U] ที่บอบช้ำ"
 bp1_yearly.5726.desc:0 "หลังจากขี่ม้ามาทั้งวันอย่างหนัก เราก็มาถึงสถานที่ที่ [matchmaker_courtier.GetFirstName] ได้ยินว่าเหยื่อของเรามาบ่อยๆ เพื่อพบกับฉากที่น่าประหลาดใจ [khutulun.GetWomanMan] ที่คล่องแคล่วกำลังปล้ำอยู่กับ [dummy_gender.GetWomanMan] ที่ตัวใหญ่กว่ามาก\n\nโดยปกติแล้ว นี่แทบจะไม่ใช่การต่อสู้ที่ยุติธรรมเลย แต่เพียงชั่วครู่ต่อมา การต่อสู้ก็จบลงอย่างน่าประหลาดใจ ร่างแรกยิ้มกว้าง ช่วยคู่ต่อสู้ของ [khutulun.GetHerHis] ลุกขึ้นอย่างมีน้ำใจก่อนที่จะเหลือบตาของ [khutulun.GetHerHis] มามองข้า\n\n"ข้าไม่เคยเห็นท่านแถวนี้มาก่อน!" [khutulun.GetSheHe] ยิ้มเยาะขณะที่ [khutulun.GetSheHe] พูดกับข้า โค้งคำนับอย่างประชดประชัน "ข้าชื่อ [khutulun.GetFirstName] ข้ารู้ว่าท่านมาที่นี่ทำไม แต่ขอเตือนท่านไว้ก่อน: ใครก็ตามที่ ทำให้ข้าเสียเวลาจะต้องจ่ายเงินให้ข้าสำหรับความเดือดร้อนของข้า""
 bp1_yearly.5726.a:0 "ทักทาย [ROOT.Char.GetWifeHusband] คนใหม่ของเจ้าสิ [khutulun.GetFirstNameNoTooltip]!"
 bp1_yearly.5726.a.tt.win:0 "ท่านเอาชนะ [khutulun.GetFirstNameNoTooltip]"
 bp1_yearly.5726.a.tt.lose:0 "[khutulun.GetSheHe|U] เอาชนะท่าน"
 bp1_yearly.5726.b:0 "ความรอบคอบอาจเป็นส่วนที่ดีกว่าของความกล้าหาญที่นี่..."

 bp1_yearly.5727.t:0 "ระฆังวิวาห์?"
 bp1_yearly.5727.desc:0 "[khutulun.GetFirstName] หอบหายใจอย่างเหนื่อยอ่อนขณะที่เราคลายการกอดรัดกันอีกครั้ง ข้าก็ไม่ได้ดีไปกว่ากันมากนัก เป็นที่ชัดเจนว่า [khutulun.GetSheHe] ยังคงไม่ได้ แต่งงานได้อย่างไร [khutulun.GetSheHe|U] ยิ้ม พอใจกับความท้าทาย\n\n"ท่านจะเป็น [ROOT.Char.GetWomanMan] ที่ดีสำหรับข้า!" [khutulun.GetSheHe] กล่าว โดยไม่ละสายตาจากการเคลื่อนไหวของข้า "น่าเสียดายที่ข้าจะต้อง ทำให้ท่านผิดหวัง!"\n\n[khutulun.GetFirstNameNoTooltip] พุ่งเข้ามาอีกครั้ง แต่คราวนี้ข้าพร้อมแล้ว การก้าวหลบอย่างคล่องแคล่ว ทำให้ [khutulun.GetHerHim] เสียหลัก และการเกี่ยวขาของ [khutulun.GetHersHis] ทำให้ [khutulun.GetHerHim] ล้มลง\n\nใบหน้าของ [khutulun.GetHerHis|U] ผสมผสานระหว่างความตกใจ ความประหลาดใจ และความตื่นเต้นขณะที่ข้ายื่นมือออกไป"
 bp1_yearly.5727.a:0 "ข้อตกลงก็คือข้อตกลง งั้น"
 bp1_yearly.5727.b:0 "เอาล่ะ ข้าทำทุกอย่างที่ข้าต้องการที่นี่แล้ว"
 bp1_yearly.5727.c:0 "มี แต่สิ่งที่ดีที่สุดสำหรับ [khutulun.GetFirstNameNoTooltip]!"

 bp1_yearly.5728.t:0 "การแข่งขันที่เผาไหม้"
 bp1_yearly.5728.desc:0 "ประกายไฟจากกองไฟลอยขึ้นสู่ท้องฟ้ายามค่ำคืนอย่างเกียจคร้าน แต่ข้าไม่สามารถเพลิดเพลินกับฉากนั้นได้เหมือนปกติ\n\n[ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('rival_burner'))] ของข้า [rival_burner.GetFirstName] ยืนอย่างมีชัยอยู่หน้ากองไฟ ท้าทายให้ข้าเข้าใกล้ ในมือของ [rival_burner.GetHerHis] คือสิ่งประดิษฐ์ของข้าเอง: [burned_artifact.GetName] ซึ่งถูกขโมยไปจากข้าโดยงูตัวนั้น\n\n"อย่าเข้ามาใกล้อีกก้าว [ROOT.Char.GetFirstName]!" [rival_burner.GetSheHe] ตะโกนข้ามมา "ของกระจุกกระจิกอันล้ำค่าของเจ้าจะถูกเผาถ้าเจ้าขยับแม้ แต่นิดเดียว!"\n\n"[rival_burner.GetFirstNameNoTooltip]!" ข้าตะโกน "คืนสิ่งที่ข้าเป็นเจ้าของมาให้ข้า แล้วเราจะไม่มีเรื่องทะเลาะกันอีก!" [rival_burner.GetFirstNameNoTooltip] เพียงแค่ยิ้มตอบ และย้ายสมบัติของข้าไปเหนือกองไฟ"
 bp1_yearly.5728.a:0 "งั้นก็เผามันเลยสิ เจ้า [rival_burner.Custom2('InsultNoun', ROOT.Char)]!"
 bp1_yearly.5728.b:0 "ขโมย? เจ้ากลัวที่จะเผชิญหน้ากับข้าหรือ?"
 bp1_yearly.5728.b.tt.duel:0 "เริ่ม [single_combat_duel|E] ระหว่างตัวท่านกับ [rival_burner.GetFirstNameNoTooltip]"

 bp1_yearly.5729.tt.lose:0 "[rival_burner.GetFirstNameNoTooltip] เผาสมบัติ"

 bp1_yearly.5730.t:0 "ที่ใดมีควัน..."
 bp1_yearly.5730.desc:0 "[rival_burner.GetFirstName] พยายามลุกขึ้นยืน ทุบตีและฟกช้ำหลังจากที่เราประลองกัน ดวงตาของ [rival_burner.GetHerHis|U] ลุกโชนราวกับกองไฟที่ [rival_burner.GetSheHe] ยืนอยู่ข้างๆ ขณะที่ [rival_burner.GetSheHe] เห็นข้าเหน็บ [burned_artifact.GetName] ไว้ใต้แขน\n\nขณะที่เพื่อนร่วมทางของเราเดินกลับมาจากตำแหน่งก่อนหน้า ซึ่งอยู่ห่างออกไป การสนทนาของพวกเขาก็ค่อยๆ เงียบลงเมื่อพบว่าเราทั้งคู่กำลังเผชิญหน้ากัน คนหนึ่งเป็นผู้ชนะ คนหนึ่งเป็นผู้แพ้\n\nข้ามองดู [burned_artifact.GetNameNoTooltip] ของข้า แล้วหันกลับไปมอง [rival_burner.GetWomanMan] ที่เสี่ยงชีวิตและแขนขาเพื่อเผามัน"
 bp1_yearly.5730.a:0 "ให้สิ่งนี้เป็นบทเรียนแก่เจ้า"
 bp1_yearly.5730.b:0 "เอามันไป ขอให้มันเตือนเจ้าถึงคืนนี้เสมอ"
 bp1_yearly.5730.b.tt:0 "[burned_artifact.GetName] ได้รับตัวปรับ แต่ง #N negative#!"

 # Coveted Claim
 bp1_yearly.8000.t:0 "การอ้างสิทธิ์อันเป็นที่ปรารถนา"
 bp1_yearly.8000.desc:0 "[bp1_8000_informer.GetTitledFirstName] [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('bp1_8000_informer'))] ของข้า กระวนกระวายตลอดทั้งวัน เห็นได้ชัดว่าพยายามหาคำพูดที่เหมาะสม \n\nในที่สุด ขณะที่เรากำลังจะไปทานอาหาร [bp1_8000_informer.GetSheHe] เริ่มพูดอย่างอายๆ "[bp1_8000_informer.Custom2('RelationToMeShort', ROOT.Char)] ของข้า..."
 bp1_yearly.8000.desc_vassal:0 "พวกเขากล่าวกันว่า [bp1_8000_new_rival.GetTitledFirstName] [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('bp1_8000_new_rival'))] ของท่าน ยิ่งนับวันก็ยิ่งจริงจังกับการอ้างสิทธิ์ของ [bp1_8000_new_rival.GetHerHis] เหนือดินแดนของท่านมากขึ้นทุกที..."
 bp1_yearly.8000.desc_foreign:1 "ข้าได้ยินข่าวลือว่า [bp1_8000_new_rival.GetFirstName] [bp1_8000_new_rival.GetTitleAsNameNoTooltip] แห่ง [bp1_8000_new_rival.GetPrimaryTitle.GetBaseNameNoTier] มองว่าท่านเป็นจุดสนใจของความเป็นศัตรูของ [bp1_8000_new_rival.GetHerHis]..."
 bp1_yearly.8000.desc_single:0 "\n\n"[bp1_8000_new_rival.GetSheHe|U] พูดอย่างเปิดเผยถึง '[ROOT.Char.GetTitleAsNameNoTooltip] ที่ไม่ชอบธรรมแห่ง [bp1_8000_claimed_title.GetNameNoTier]' ซึ่งแย่งชิงดินแดนและรายได้อันชอบธรรมของ [bp1_8000_new_rival.GetHerHis] ทุกวัน""
 bp1_yearly.8000.desc_multi:0 "\n\n"[bp1_8000_new_rival.GetSheHe|U] ยืนยันว่า [bp1_8000_new_rival.GetSheHe] ได้รับความเสียหายเป็นการส่วนตัวจากการปกครองดินแดนอันชอบธรรมของ [bp1_8000_new_rival.GetHerHis] อย่างต่อเนื่อง โดยเฉพาะอย่างยิ่ง [bp1_8000_claimed_title.GetNameNoTier]""
 bp1_yearly.8000.a:0 "ฮ่า! เจ้า [bp1_8000_new_rival.Custom2('InsultNoun', ROOT.Char)] ที่แสนอำมหิตนั่น!"
 bp1_yearly.8000.b:0 "ข้าจะเขียนจดหมายถึง [bp1_8000_new_rival.GetFirstNameNoTooltip] ทันที"
 bp1_yearly.8000.b.success:0 "จดหมายของท่าน ทำให้ [bp1_8000_new_rival.GetTitledFirstNameNoTooltip] ใจอ่อนลง"
 bp1_yearly.8000.b.failure:0 "[bp1_8000_new_rival.GetTitledFirstNameNoTooltip] ไม่สนใจจดหมายของท่าน"
 bp1_yearly.8000.c:0 "นี่มันกบฏ งั้น"
 bp1_yearly.8000.c.success:0 "คนของท่านจับกุม [bp1_8000_new_rival.GetTitledFirstNameNoTooltip]"
 bp1_yearly.8000.c.failure:0 "[bp1_8000_new_rival.GetTitledFirstNameNoTooltip] หลบหนีไปได้"
 bp1_yearly.8000.d:0 "เรื่องไร้สาระ ข้ามั่นใจ"
 bp1_yearly.8000.d.rival:0 "ข่าวลือเป็นความจริง"
 bp1_yearly.8000.d.bluff:0 "[bp1_8000_new_rival.GetTitledFirstNameNoTooltip] กำลังขู่"
 bp1_yearly_8000_trusting_modifier:0 "เจ้าเหนือหัวผู้ไว้วางใจ"
 bp1_yearly_8000_trusting_modifier_desc:0 "ตัวละครนี้เป็นที่รู้จักในการให้ประโยชน์แก่ผู้ใต้บังคับบัญชาของตน"
 # Friends with Benefits
 bp1_yearly.8010.opening:0 "[bp1_8010_best_friend.Custom2('AppropriateGreeting', ROOT.Char)]"
 bp1_yearly.8010.desc:0 "ข้าขอบคุณ [bp1_8010_best_friend.GetFaith.HighGodName] ทุกวันที่ได้มี [ROOT.Char.Custom('GetFriendNoun')] ที่ดี เช่นท่าน — มีเพียงไม่กี่คนที่ข้าสามารถพูดได้อย่างปลอดภัยว่าข้าไว้วางใจ \n\nเราควรปรับผลประโยชน์ของเราให้ใกล้ชิดกันมากขึ้น และต่อสู้เคียงบ่าเคียงไหล่กัน มาเถิด [ROOT.Char.GetFirstNameNoTooltip] ศัตรูของเราจะเห็นว่าเราไม่ใช่คนที่จะมาล้อเล่นด้วย!"
 bp1_yearly.8010.a:0 "ใช่! ท่านจะได้ [bp1_8010_best_friend.Custom('SignatureWeaponNameOrType')] ของข้า!"
 bp1_yearly.8010.b:0 "ข้าไม่แน่ใจ [bp1_8010_best_friend.GetFirstNameNoTooltip]..."
 # Rival of my Rival
 bp1_yearly.8020.opening:0 "[bp1_8020_friend.Custom2('AppropriateGreeting', ROOT.Char)]"
 bp1_yearly.8020.desc:0 "ข้าได้ยินเรื่องข้อพิพาทของท่านกับ [bp1_8020_rival.GetFirstName] เจ้า [bp1_8020_rival.Custom2('InsultAdjective', SCOPE.sC('bp1_8020_friend'))] [bp1_8020_rival.Custom2('InsultNoun', SCOPE.sC('bp1_8020_friend'))] นั่นแล้ว ช่างเป็น [bp1_8020_rival.GetWomanMan] ที่น่ารังเกียจที่สุด\n\nเมื่อพิจารณาถึงผลประโยชน์ร่วมกันของเรา ข้ามั่นใจว่าเราจะเข้ากันได้ดี สหาย"
 bp1_yearly.8020.a:0 "ข้ารอคอยโอกาสที่จะหารือเรื่องนี้เพิ่มเติมอย่างใจจดใจจ่อ"
 bp1_yearly.8020.b:0 "ผู้ส่งสารช่างไม่น่าเชื่อถือเสียเลยในทุกวันนี้..."
 bp1_yearly.8020.b.flavor:0 "ส่งต่อจดหมายไปยัง [bp1_8020_rival.GetTitledFirstNameNoTooltip]"
 bp1_yearly.8020.b.joke:0 "[bp1_8020_rival.GetTitledFirstNameNoTooltip] ชื่นชมความเปิดเผยของท่าน"
 bp1_yearly.8020.b.insult:0 "ข้อความ ทำให้ [bp1_8020_rival.GetTitledFirstNameNoTooltip] โกรธเคือง"
 bp1_yearly.8020.c:0 "นี่เป็นการเล่นที่ต่ำช้า โดยผู้เล่นที่ต่ำช้า"
 bp1_yearly.8020.d:0 "ท่านไม่ใช่สหายของข้า [bp1_8020_friend.GetFirstNameNoTooltip]"
 # Diametrically Opposed
 bp1_yearly.8040.t:0 "แตกต่างสุดขั้ว"
 bp1_yearly.8040.desc.opening:0 "สหายข้า, [bp1_yearly_8040_friend.GetTitledFirstName], ดูห่างเหินกับข้าในช่วงสองสามวันที่ผ่านมา ทุกค่ำคืนต่างหลีกเลี่ยงคำเชิญร่วมโต๊ะอาหารของข้า\n\nวันนี้ [bp1_yearly_8040_friend.GetSheHe] พบข้าตามลำพังใน [ROOT.Char.Custom('GetChamber')] ของข้า "[ROOT.Char.GetFirstNameNoTooltip], ข้าขออภัย แต่ข้าต้องบอกท่านเรื่องนี้ ในฐานะสหายของท่าน"\n\n"ความ"
 bp1_yearly.8040.desc.diligent:0 "หมกมุ่นในงานและเรียกร้องผลลัพธ์อยู่เสมอของท่าน"
 bp1_yearly.8040.desc.brave:0 "เสี่ยงภัยโดยไม่จำเป็นและความห้าวหาญของท่าน"
 bp1_yearly.8040.desc.just:0 "พิถีพิถันในการตัดสินและพิจารณาหลักฐานของท่าน"
 bp1_yearly.8040.desc.compassionate:0 "อ่อนไหวต่อความทุกข์และความใส่ใจผู้อื่นของท่าน"
 bp1_yearly.8040.desc.fickle:0 "กลับคำอยู่เสมอและถูกชักจูงได้ง่ายของท่าน"
 bp1_yearly.8040.desc.temperate:0 "ห่างเหินจากโต๊ะเลี้ยงของท่าน"
 bp1_yearly.8040.desc.generous:0 "ใจกว้างพร้อมช่วยเหลือทุกคนที่เอ่ยขอของท่าน"
 bp1_yearly.8040.desc.humble:0 "ถ่อมตนและไม่ให้ความสำคัญกับตนเองของท่าน"
 bp1_yearly.8040.desc.honest:0 "ปฏิเสธที่จะหลอกลวงผู้อื่นแม้ในยามจำเป็นของท่าน"
 bp1_yearly.8040.desc.forgiving:0 "ไม่ถือสาคำดูหมิ่นและอดทนต่อความไม่ภักดีของท่าน"
 bp1_yearly.8040.desc.wrathful:0 "อารมณ์ร้ายและเกรี้ยวกราดอยู่เสมอของท่าน"
 bp1_yearly.8040.desc.calm:0 "สงบนิ่งเมื่อเผชิญหน้ากับความขุ่นเคืองอันชอบธรรมของท่าน"
 bp1_yearly.8040.desc.cynical:0 "กังขาในแผนการอันศักดิ์สิทธิ์ของ [ROOT.Char.GetFaith.HighGodNamePossessive] ของท่าน"
 bp1_yearly.8040.desc.zealous:0 "กระตือรือร้นที่จะทำตามเหล่า [ROOT.Char.GetFaith.AltPriestTermPlural] ของท่าน"
