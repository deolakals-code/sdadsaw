 bp1_yearly.8040.a.compassionate:0 "ข้าจะไม่ทำใจแข็งกระด้าง"
 bp1_yearly.8040.a.stubborn:0 "เจ้าเปลี่ยนใจข้าไม่ได้หรอก"
