 bp1_yearly.8131.t.sycophant:0 "เล่ห์เหลี่ยมของ [spymaster_scope.GetFirstNamePossessiveNoTooltip]"
 bp1_yearly.8131.t:0 "การพิสูจน์ความบริสุทธิ์ของ [sycophant_scope.GetFirstNamePossessiveNoTooltip]"
 bp1_yearly.8131.desc.sycophant:0 "ข้าประหลาดใจที่ถูกเรียกไปยังคุกใต้ดินลึกเข้าไปในส่วนลึกของข้า และไม่ใช่ใครอื่นนอกจาก [sycophant_scope.GetTitledFirstName] [ROOT.Char.Custom2('RelationToMe', sycophant_scope)] ของข้า\n\nที่นั่น ในห้องขัง ข้าพบ [sycophant_scope.GetHerHim] ที่ดูโล่งอกอย่างเห็นได้ชัด อยู่เคียงข้าง [murderous_scope.GetTitledFirstName] ที่ถูกล่ามโซ่และดูมีความสุขน้อยกว่าอย่างเห็นได้ชัด\n\nข้าสูดหายใจเฮือก "[sycophant_scope.GetFirstNameNoTooltip]! เจ้าทำอะ-" ก่อนที่ [sycophant_scope.GetSheHe] จะพูดแทรกขึ้นมา "เจ้า [murderous_scope.Custom2('InsultNoun', SCOPE.sC('sycophant_scope'))] นี่พยายามจะฆ่าข้า - ข้ามีคำสารภาพของนักเลงอันธพาลของ [murderous_scope.GetHerHis] เพื่อพิสูจน์!""
 bp1_yearly.8131.desc.spymaster:0 "ขณะที่ข้ากำลังเอนกายพักผ่อนกับ [sycophant_scope.GetTitledFirstName] [ROOT.Char.Custom2('RelationToMe', sycophant_scope)] ของข้า เราก็ได้รับสารจากหัวหน้าสายลับของข้า [spymaster_scope.GetTitledFirstName] สั่งให้เราทั้งคู่ไปยังคุกใต้ดินของข้า\n\nที่นั่น ในส่วนลึกอันอับชื้นของ [ROOT.GetCharacter.Custom('FortifiedBuilding')] ของข้า เราพบ [spymaster_scope.GetHerHim] พร้อมกับ [murderous_scope.GetTitledFirstName] ที่ดูน่าสังเวช ถูกล่ามโซ่ อยู่ข้างกาย [spymaster_scope.GetHerHis]\n\n"นี่คือผู้กระทำผิด [ROOT.Char.Custom('FormOfAddressForLiege')]" [spymaster_scope.GetSheHe] ประกาศก้อง "ไม่ต้องสงสัยเลย""
 bp1_yearly.8131.desc:0 "ข้าตึงเครียดด้วยความคาดหวังขณะที่ทหารยามของข้ามัดตัวสายลับที่จับได้เข้ามาในคุกใต้ดินของข้า ถูกมัด ถูกคลุมศีรษะ และคร่ำครวญ\n\n"มาเถิด, [sycophant_scope.GetFirstName], เราจะได้เห็นว่าใครพยายามจ้างนักฆ่าของเจ้า!"\n\nด้วยท่าทางโอ้อวด และเสียงอ้าปากค้าง พัศดีของข้าเปิดเผยว่าไม่ใช่ใครอื่นนอกจาก [murderous_scope.GetTitledFirstName]!\n\n[sycophant_scope.GetFirstNameNoTooltip] และข้าคำรามพร้อมกัน: "#EMP เจ้า!#!""
 bp1_yearly.8131.tt:0 "การมีส่วนร่วมของ [murderous_scope.GetTitledFirstNamePossessive] ใน [scheme|E] เพื่อ [sycophant_scheme.GetSchemeType.GetTypeNameNoTooltip] [sycophant_scope.GetFirstName] ถูกเปิดโปง"
 bp1_yearly.8131.a:0 "ดูเหมือนเจ้ามีเรื่องต้องอธิบายนะ, [murderous_scope.GetFirstNameNoTooltip]"
 bp1_yearly.8131.a.flavor:0 "ผ่าน #EMP ลูกกรง#! ห้องขังของเจ้า!!"
 bp1_yearly.8131.b:0 "[murderous_scope.GetSheHe|U] ได้เรียนรู้บทเรียนของ [murderous_scope.GetHerHis] แล้ว"
 bp1_yearly.8131.b.flavor:0 "มันไม่ใช่ #EMP การกบฏ#! เสียหน่อย"
 bp1_yearly.8131.c:0 "มีใครเกี่ยวข้องอีกบ้าง?"
 bp1_yearly.8131.c.flavor:0 "ส่งค้อนมาให้ข้า!"
 bp1_yearly.8131.torture:0 "ท่านจะ [torture|E] [murderous_scope.GetShortUIName]"
 bp1_yearly.8131.agent:0 "[agent|E] อีกคนที่เกี่ยวข้องใน [scheme|E] อาจถูกค้นพบ"
 bp1_yearly.8131.attempted:0 "[agent_scope.GetTitledFirstNameNoTooltip] มีส่วนเกี่ยวข้องในแผนการ!"
 released_attempted_murderer_opinion:0 "ปล่อยตัวผู้พยายามฆ่า"
 bp1_yearly.8132.t:0 "ความกลัวของ [sycophant_scope.GetFirstNamePossessiveNoTooltip]"
 bp1_yearly.8132.desc.sycophant:0 "[ROOT.Char.Custom2('RelationToMe', sycophant_scope)] ของข้า, [sycophant_scope.GetTitledFirstNamePossessive], กลับมาหาข้าด้วยความขุ่นเคืองยิ่งกว่าเดิม\n\nดูเหมือนว่า [sycophant_scope.GetSheHe] ได้ใช้ทางเลือกทั้งหมดที่มีอยู่กับ [sycophant_scope.GetHerHim] แล้วโดยไม่ได้เข้าใกล้การเปิดเผยหลักฐานของแผนการเลย\n\n"ข้าจะทำอย่างไรดี, [ROOT.Char.GetFirstNameNoTooltip]," [sycophant_scope.GetSheHe] ถอนหายใจ, "ข้าตกอยู่ในความเมตตาของศัตรูของข้า!""
 bp1_yearly.8132.desc.spymaster:1 "หัวหน้าสายลับของข้า, [spymaster_scope.GetTitledFirstNamePossessive], ในที่สุดก็ยอมรับว่า [spymaster_scope.GetSheHe] ไม่พบหลักฐานใดๆ เกี่ยวกับแผนการต่อต้าน [ROOT.Char.Custom2('RelationToMe', sycophant_scope)] ของข้า [sycophant_scope.GetFirstName]\n\n[spymaster_scope.GetSheHe|U] ถึงกับเสนอแนะว่าเหตุการณ์ทั้งหมดเป็นเพียงจินตนาการของ [sycophant_scope.GetFirstNamePossessiveNoTooltip]..."
 bp1_yearly.8132.desc:0 "ข้าได้ตรวจสอบความกังวลของ [ROOT.Char.Custom2('RelationToMe', sycophant_scope)] ของข้า, [sycophant_scope.GetTitledFirstNamePossessive], โดยให้คนเฝ้าดูห้องของ [sycophant_scope.GetHerHis] และสอบถามคนรับใช้ทั่ว [ROOT.GetCharacter.Custom('FortifiedBuilding')], แต่ก็ไร้ผล\n\n"บางทีอาจเป็นแค่คนรับใช้ทำความสะอาด?" ข้าเสนออย่างอ่อนแรง\n\n[sycophant_scope.GetSheHe|U] เดินไปมาในห้องของข้า เห็นได้ชัดว่าไม่เชื่อ"
 bp1_yearly.8132.a:0 "ข้าจะให้คนคุ้มกันเจ้า เผื่อไว้ก่อน"
 bp1_yearly.8132.a.flavor:0 "กันไว้ดีกว่าแก้"
 bp1_yearly.8132.b:0 "หรือเป็นการแกล้งกันเล่นๆ ที่ไม่เป็นอันตราย?"
 bp1_yearly.8132.b.flavor:0 "นี่เป็นการเสียเวลา"
 bp1_yearly.8134.t:0 "การหายตัวไปของ [sycophant_scope.GetFirstNamePossessiveNoTooltip]"
 bp1_yearly.8134.desc:0 "นานเกินไปแล้วที่ข้าไม่ได้รับข่าวคราวจาก [ROOT.Char.Custom2('RelationToMe', sycophant_scope)] ของข้า, [sycophant_scope.GetTitledFirstNamePossessive], และข้าเริ่มกลัวสิ่งที่เลวร้ายที่สุด\n\nหากมีภัยคุกคามต่อชีวิตของ [sycophant_scope.GetHerHis] จริงๆ... โอ้ [ROOT.Char.GetFaith.HighGodName]..."
 bp1_yearly.8134.a:0 "เจ้าอยู่ที่ไหน, [sycophant_scope.GetFirstNameNoTooltip]?"
 bp1_yearly.8134.a.flavor:0 "ข้าทำอะไรลงไป..."
 # Sycophant's revenge
 bp1_yearly.8140.t:0 "การแก้แค้นของ [sycophant_scope.GetFirstNamePossessiveNoTooltip]"
 bp1_yearly.8140.desc:0 "ขณะที่มองดูคอลเลกชัน [ROOT.Char.Custom('RegionalAlcoholicDrink')|U] ชั้นดีของข้า ข้าได้ยินเสียงคุ้นเคยของ [ROOT.Char.Custom2('RelationToMe', sycophant_scope)] ของข้า, [sycophant_scope.GetFirstName]\n\nซ่อนตัวอยู่ท่ามกลางถังไม้ [sycophant_scope.GetSheHe] กำลังสาปแช่งและสบถใส่ [jealous_scope.GetTitledFirstName] ให้คนรับใช้หรือใครสักคนฟัง\n\nทันทีที่ข้ากำลังจะหมดความสนใจ ข้าก็ได้ยินมัน ทำให้เลือดข้าเย็นยะเยือก, "ฆ่า [jealous_scope.GetTitledFirstName] เสีย!""
 bp1_yearly.8140.a:0 "[sycophant_scope.GetFirstNameNoTooltip]! ข้าได้ยินทุกคำ!"
 bp1_yearly.8140.a.flavor:0 "น่าละอายใจนัก!"
 bp1_yearly.8140.b:0 "ใช่! [jealous_scope.GetFirstNameNoTooltip] จะต้อง #EMP ตาย#!!"
 bp1_yearly.8140.b.flavor:0 "สนุกเสียที!"
 bp1_yearly.8140.c:0 "#EMP ข้าค่อยๆ ย่องหนีไป#!"
 bp1_yearly.8140.c.flavor:0 "ข้าไม่ได้ยิน #EMP อะไรทั้งนั้น#!"
 # Sycophant's joke
 bp1_yearly.8160.t:0 "เสน่ห์ของ [sycophant_scope.GetFirstNamePossessiveNoTooltip]"
 bp1_yearly.8160.desc:0 "[sycophant_scope.GetFirstName] [ROOT.Char.Custom2('RelationToMe', sycophant_scope)] ของข้า และตัวข้า กำลังเดินเล่นสบายๆ ในสวนของข้า หัวเราะเสียงดังกับบทกลอนที่ [sycophant_scope.GetSheHe] ได้ยินคนรับใช้พูด เมื่อ [jealous_scope.GetTitledFirstName] เดินขวางทางเรา\n\n[jealous_scope.GetSheHe|U] มองเราอย่างเข้มงวด "[ROOT.Char.Custom('FormOfAddressForLiege')|U] มีบางอย่างที่ข้าต้องการหารือ หากท่านพอมีเวลา?""
 bp1_yearly.8160.a:0 "ตกลง มันคืออะไร?"
 bp1_yearly.8160.a.flavor:0 "หวังว่าเรื่องนี้จะดีพอ!"
 bp1_yearly.8160.b:0 "มาร่วมกับเราสิ เจ้าต้องฟังเรื่องนี้!"
 bp1_yearly.8160.b.flavor:0 "อะไรจะ #EMP ผิดพลาด#! ได้เล่า?"
 bp1_yearly.8160.b.success:0 "[sycophant_scope.GetFirstNameNoTooltip] เอาชนะใจ [jealous_scope.GetHerHim] ได้"
 bp1_yearly.8160.b.failure:0 "นี่คือฟางเส้นสุดท้ายสำหรับ [jealous_scope.GetFirstNameNoTooltip]"
 bp1_yearly.8160.d:0 "ไม่ใช่ตอนนี้, [jealous_scope.GetFirstNameNoTooltip]!"
 bp1_yearly.8160.d.flavor:0 "เจ้าไม่เห็นหรือว่าข้า #EMP กำลังยุ่ง#!?"
 bp1_yearly.8161.t:0 "มนต์เสน่ห์ของ [sycophant_scope.GetFirstNamePossessiveNoTooltip]"
 bp1_yearly.8161.opening:1 "ขณะที่เสียงสะท้อนของเสียงประกอบสุดท้ายของ [sycophant_scope.GetTitledFirstNamePossessive] จางหายไปในเสียงนกร้อง สีหน้าของ [jealous_scope.GetTitledFirstNamePossessive] ยังคงจริงจัง เช่นเคย\n\n"
 bp1_yearly.8161.desc:0 "ช้าๆ จากมุมปากของ [jealous_scope.GetHerHis] รอยยิ้มจางๆ ปรากฏขึ้น แผ่กว้างเป็นรอยยิ้มกว้าง และในที่สุดก็แยกออกเพื่อปล่อยเสียงหัวเราะดังลั่น!\n\n"นั่น- #EMP *หอบ*#! นั่นมันตลกที่สุด- #EMP *หอบ*#! โอ้! ข้าเข้าใจเจ้าผิดไปหมดเลย, [sycophant_scope.GetFirstNameNoTooltip]! ไปหาอะไรกินกันเถอะ!""
 bp1_yearly.8161.a:0 "#EMP *ศอกสีข้าง*#! [ROOT.Char.Custom('GetLaughType')]"
 bp1_yearly.8161.a.flavor:0 "เจ้าเกือบหลอกข้าได้แล้ว!"
 bp1_yearly.8162.t:0 "ความผิดพลาดของ [sycophant_scope.GetFirstNamePossessiveNoTooltip]"
 bp1_yearly.8162.desc:1 "ข้ารู้สึกแย่มากที่มุกตลกนี้ไม่เข้าท่า\n\nความกลัวของข้าได้รับการยืนยันเมื่อครู่ต่อมา [jealous_scope.GetFirstNameNoTooltip] ถอนหายใจอย่างหนักหน่วง กลอกตาของ [jealous_scope.GetHerHis] และเดินจากไป\n\n[sycophant_scope.GetFirstName] ยักไหล่, "เอาน่า ช่างเป็นคนหัวโบราณเสียจริง...""
 bp1_yearly.8162.a:0 "ทำไมต้อง #EMP มุกนั้น#! ด้วยเล่า, [sycophant_scope.GetFirstNameNoTooltip]..."
 bp1_yearly.8162.a.flavor:0 "ใช้มุกของคนรับใช้ดีกว่านะ?"
 # Sycophant's friend
 bp1_yearly.8170.t:0 "สหายของ [sycophant_scope.GetFirstNamePossessiveNoTooltip]"
 bp1_yearly.8170.desc:0 "ข้าเจอ [ROOT.Char.Custom2('RelationToMe', sycophant_scope)] ของข้า, [sycophant_scope.GetFirstName], น้อยลงเรื่อยๆ ดูเหมือนว่า [sycophant_scope.GetSheHe] ใช้เวลาส่วนใหญ่อยู่กับ [ROOT.Char.Custom2('RelationToMe', friendly_scope)] ของข้า, [friendly_scope.GetTitledFirstName] แทน...\n\nข้าพบทั้งคู่; ตบต้นขาหัวเราะกับเรื่องตลกบางอย่าง; หัวเราะคิกคักเมื่อพวกเขามองมาที่ข้า\n\nข้าควรจะเข้าใจเรื่องนี้อย่างไรดี..."
 bp1_yearly.8170.a:0 "ข้าอยู่เหนือเรื่องนี้"
 bp1_yearly.8170.a.flavor:0 "ข้าจะไม่เสียเวลากับ [sycophant_scope.GetHerHim] อีกต่อไป"
 bp1_yearly.8170.b:0 "อา, [sycophant_scope.GetFirstNameNoTooltip], ขอคุยด้วยหน่อย?"
 bp1_yearly.8170.b.flavor:0 "ข้ารู้ว่า [sycophant_scope.GetSheHe] ชอบอะไร"
 bp1_yearly.8170.b.success:0 "[sycophant_scope.GetFirstNameNoTooltip] ตามมา"
 bp1_yearly.8170.b.failure:0 "[sycophant_scope.GetFirstNameNoTooltip] อยู่กับ [friendly_scope.GetFirstNameNoTooltip]"
 bp1_yearly.8170.c:0 "ข้าไม่ต้องการเจ้าอีกต่อไปแล้ว, [sycophant_scope.GetFirstNameNoTooltip]"
 bp1_yearly.8170.c.flavor:0 "หัวเราะให้สะใจไปเลยสิ!!"
 # Sycophant's ultimatum
 bp1_yearly.8180.t:0 "คำขาดของ [sycophant_scope.GetFirstNamePossessiveNoTooltip]"
 bp1_yearly.8180.desc:0 "[ROOT.Char.Custom2('RelationToMe', sycophant_scope)] ของข้า, [sycophant_scope.GetFirstName], ได้ขอเข้าเฝ้าเป็นการส่วนตัว ซึ่งเป็นพิธีรีตองที่ไม่ปกติที่บ่งบอกถึงข่าวร้ายเท่านั้น\n\n"[ROOT.Char.GetFirstNameNoTooltip]! [ROOT.Char.GetTitleAsNameNoTooltip]... ข้าทนไม่ไหวอีกต่อไปแล้ว! ท่านกีดกันข้า ยอมจำนนต่อ 'หน้าที่' ของท่าน ทั้งที่ท่านรู้ว่าข้าเป็นสมาชิกสภาที่ดีพร้อม!"\n\n"หากนี่คือวิธีที่ข้าจะได้รับการปฏิบัติ ข้าคงต้องมองหาโอกาสใหม่ๆ ข้าได้ยินมาว่า [new_realm.GetHolder.GetName] รู้วิธีตอบแทนข้าราชบริพารผู้ภักดี...""
 bp1_yearly.8180.a:0 "เจ้ารู้ว่าข้าเสียเจ้าไปไม่ได้, [sycophant_scope.GetFirstNameNoTooltip]"
 bp1_yearly.8180.a.flavor:0 "เจ้ารู้ดีเกินไป..."
 bp1_yearly.8180.b:0 "เอาน่า เจ้ารู้ว่ามันซับซ้อนกว่านั้น!"
 bp1_yearly.8180.b.flavor:0 "มีปัจจัยหลายอย่างเข้ามาเกี่ยวข้อง..."
 bp1_yearly.8180.b.success:0 "[sycophant_scope.GetFirstNameNoTooltip] อยู่ต่อ"
 bp1_yearly.8180.b.failure:0 "[sycophant_scope.GetFirstNameNoTooltip] จากไป"
 bp1_yearly.8180.c:0 "ไปสิ ถ้าเจ้าคิด เช่นนั้น!"
 bp1_yearly.8180.c.flavor:0 "ออกไป!"
 bp1_yearly.8180.d:0 "เจ้ากำลังขู่ว่าจะกบฏ!"
 bp1_yearly.8180.d.flavor:0 "ถ้าข้าไม่มีเจ้า..."
 # Sycophant's talents
 bp1_yearly.8190.t:0 "พรสวรรค์ของ [sycophant_scope.GetFirstNamePossessiveNoTooltip]"
 bp1_yearly.8190.opening:1 "ขณะข้ามลาน ข้ายินดีที่ในที่สุดก็ได้ยินใครบางคนชื่นชม [ROOT.Char.Custom2('RelationToMe', sycophant_scope)] ของข้า, [sycophant_scope.GetFirstName]\n\n"โอ้ อย่าไปฟังพวกองุ่นเปรี้ยวนั่นเลย," [friendly_scope.GetTitledFirstName] พูดเสียงสูง, "ท่านเป็น [sycophant_scope.GetCouncilTitle] ที่ดีที่สุดที่ [ROOT.Char.GetPrimaryTitle.GetBaseNameNoTierNoTooltip] เคยมีมาในรอบหลายปี - อย่างน้อยก็เท่าที่ #EMP ข้า#! รู้!"\n\n"
 bp1_yearly.8190.twitch:0 "ชั่วขณะหนึ่ง ข้ามั่นใจว่าเห็น [jealous_scope.GetTitledFirstName] ในคอกม้าที่มืดครึ้มฝั่งตรงข้ามลาน ตากระตุก ก่อนที่ [jealous_scope.GetSheHe] จะหายลับไปในความมืด"
 bp1_yearly.8190.desc:0 "ข้ารู้อยู่แล้วว่าสิ่งที่ข้าเห็นในตัว [sycophant_scope.GetHerHis] นั้นเป็นของจริง!"
 bp1_yearly.8190.a:0 "ในที่สุด ก็มีผู้ที่ชื่นชมในคุณลักษณะเหมือนกัน!"
 bp1_yearly.8190.a.flavor:0 "สมาคมผู้ชื่นชม [sycophant_scope.GetFirstNameNoTooltip] เติบโตขึ้น"
 bp1_yearly.8190.b:0 "นี่แน่ะ ไปเที่ยวกลางคืนกันเถอะ แค่เราสามคน!"
 bp1_yearly.8190.b.flavor:0 "จงใกล้ชิดกับสหายของท่าน"
 # Sycophant's rewards
 bp1_yearly.8191.t:0 "รางวัลของ [sycophant_scope.GetFirstNamePossessiveNoTooltip]"
 bp1_yearly.8191.opening:0 "การประชุมสภาอันยาวนานไม่รู้จบยังคงดำเนินต่อไปอย่างเชื่องช้า จนกระทั่งหูของข้าพลันผึ่งขึ้นกับน้ำเสียงอันไพเราะของ [sycophant_scope.GetFirstNamePossessive] [ROOT.Char.Custom2('RelationToMe', sycophant_scope)] ของข้า\n\n"มีธุระด่วน [ROOT.Char.Custom('FormOfAddressForLiege')] "
 bp1_yearly.8191.taken:0 "[ROOT.Char.GetPrimaryTitle.GetBaseNameNoTierNoTooltip] ต้องการ [sycophant_scope.Custom('GetTargetCourtPosition')] ที่มีความสามารถอย่างยิ่ง; ใครสักคนที่จะ [sycophant_scope.Custom('GetTargetCourtPositionDesc')] อย่างเหมาะสม... ภารกิจที่ [old_holder.GetTitledFirstName] ล้มเหลว #EMP อย่างสิ้นเชิง#.""
 bp1_yearly.8191.open:0 "[ROOT.Char.GetPrimaryTitle.GetBaseNameNoTierNoTooltip] ต้องการ [sycophant_scope.Custom('GetTargetCourtPosition')] อย่างยิ่ง; ใครสักคนที่จะดูแล [sycophant_scope.Custom('GetTargetCourtPositionDesc')]...""
 bp1_yearly.8191.arrogant:0 "\n\n[sycophant_scope.GetSheHe|U] ผายมือไปที่ [sycophant_scope.GetHerselfHimself] อย่างโอ้อวด, "ให้ข้าจัดการเรื่องนี้ให้ท่านเถิด เจ้าเหนือหัว งานประเภทนี้ต้องใช้ความชำนาญเป็นพิเศษ""
 bp1_yearly.8191.other:0 "\n\n[sycophant_scope.GetSheHe|U] วางมือของ [sycophant_scope.GetHerHis] บนหัวใจของ [sycophant_scope.GetHerHis], "แน่นอน #EMP ข้า#! ยินดีที่จะรับภาระสำคัญนี้ เจ้าเหนือหัว""
 bp1_yearly.8191.desc:0 "\n\n[annoyed_scope.GetTitledFirstName] เห็นได้ชัดว่ากำลังโกรธจัด"
 bp1_yearly.8191.a:0 "เป็นความคิดที่ยอดเยี่ยม, [sycophant_scope.GetFirstNameNoTooltip]!"
 bp1_yearly.8191.a.flavor:0 "ขอบคุณสวรรค์สำหรับ [sycophant_scope.GetFirstNameNoTooltip]"
 bp1_yearly.8191.b:0 "ใช่ ถึงเวลาที่ [old_holder.GetFirstNameNoTooltip] ต้องหลีกทางแล้ว!"
 bp1_yearly.8191.b.flavor:0 "[sycophant_scope.GetFirstNameNoTooltip] จะแสดงให้ [old_holder.GetHerHim] เห็นว่าต้องทำอย่างไร!"
 bp1_yearly.8191.c:0 "แล้วรับตำแหน่งที่ว่างอยู่แทนล่ะ?"
 bp1_yearly.8191.c.flavor:0 "พรสวรรค์ของ [sycophant_scope.GetFirstNameNoTooltip] นั้นไม่มีที่สิ้นสุด"
 bp1_yearly.8191.d:0 "ข้าคิดว่านี่เป็นงานสำหรับ [annoyed_scope.GetFirstNameNoTooltip]"
 bp1_yearly.8191.d.flavor:0 "[sycophant_scope.GetFirstNameNoTooltip] ไม่สามารถได้ #EMP ทุกอย่าง#! ไปเสียหมด!"
 bp1_yearly.8191.e:0 "ต้อง #EMP มี#! เรื่องเร่งด่วนกว่านี้สิ?"
 bp1_yearly.8191.e.flavor:0 "[sycophant_scope.GetFirstNameNoTooltip] จะทำใจได้เอง"
 # Sycophant's mistakes
 bp1_yearly.8192.t:0 "ความผิดพลาดของ [sycophant_scope.GetFirstNamePossessiveNoTooltip]"
 bp1_yearly.8192.desc:0 "ขณะที่ข้าใช้เวลาบนโซฟาเพื่อคิดว่าจะให้รางวัลแก่ [ROOT.Char.Custom2('RelationToMe', sycophant_scope)] ของข้า, [sycophant_scope.GetFirstNamePossessive], สำหรับผลงานอันยอดเยี่ยมเมื่อเร็วๆ นี้อย่างไรดี กลอนประตูก็คลิกเปิดเผยให้เห็น [insulting_scope.GetTitledFirstName]\n\n"อภัยให้ข้าด้วยที่พูดอย่างเปิดอก [ROOT.Char.GetLadyLord] ของข้า แต่เรื่องเกี่ยวกับ [sycophant_scope.GetFirstNameNoTooltip] นี้กำลังจะเกินควบคุมแล้ว!"\n\n"คนโง่นั่นไม่เหมาะที่จะเป็น [sycophant_scope.GetCouncilTitle]; ทุกวันที่ [sycophant_scope.GetSheHe] อยู่ในตำแหน่ง สิ่งต่างๆ จะยิ่งแย่ลง นำไปสู่ความพินาศของ [ROOT.Char.GetPrimaryTitle.GetBaseNameNoTierNoTooltip] ทั้งหมด!""
 bp1_yearly.8192.a:0 "ข้าไม่รู้เลยว่าเรื่องมันแย่ขนาดนี้..."
 bp1_yearly.8192.a.flavor:0 "ถึงเวลาที่ [sycophant_scope.GetFirstNameNoTooltip] ต้องไปแล้ว"
 bp1_yearly.8192.b:0 "ไม่มีที่ว่างสำหรับความอิจฉาริษยาเล็กๆ น้อยๆ ในสภาของข้า"
 bp1_yearly.8192.b.flavor:0 "คนเกลียดชังย่อมเกลียดชังเสมอ"
 bp1_yearly.8192.fired_tt:0 "[insulting_scope.GetShortUIName|U] ถูกไล่ออกจาก [council|E] ของท่านเป็นเวลา 5 ปี"
 bp1_yearly.8192.c:0 "#EMP *ถอนหายใจ*#! เจ้าไม่เห็นหรือว่าข้า #EMP กำลังยุ่ง#!, [insulting_scope.GetFirstNameNoTooltip]?"
 bp1_yearly.8192.c.flavor:0 "พรสวรรค์ของ [sycophant_scope.GetFirstNameNoTooltip] นั้นไม่มีที่สิ้นสุด"

 disgruntled_vassals_modifier:0 "ข้าในบังคับที่ไม่พอใจ"
 disgruntled_vassals_modifier_desc:0 "ตัวละครนี้ ทำให้ขุนนางผู้มีอำนาจของแผ่นดินไม่พอใจโดยการอุปถัมภ์คนโปรด"
 placated_vassals_modifier:0 "ข้าในบังคับที่พอใจ"
 placated_vassals_modifier_desc:0 "ตัวละครนี้ให้ความสำคัญกับขุนนางผู้มีอำนาจของแผ่นดินมากกว่าคนประจบสอพลอ"
 personal_guard_modifier:0 "องครักษ์ส่วนตัว"
 personal_guard_modifier_desc:0 "ตัวละครนี้ได้รับการ แต่งตั้งองครักษ์ส่วนตัวเพื่อคอยดูแล"
 raconteur_modifier:0 "นักเล่าเรื่อง"
 raconteur_modifier_desc:0 "ความสามารถในการเล่าเรื่องของตัวละครนี้แทบจะหาใครเทียบไม่ได้"
 toilet_humor_modifier:0 "อารมณ์ขันแบบห้องส้วม"
 toilet_humor_modifier_desc:0 "ตัวละครนี้มีชื่อเสียงในด้านอารมณ์ขันของตน"
 effective_agents_modifier:0 "สายลับที่มีประสิทธิภาพ"
 effective_agents_modifier_desc:0 "ตัวละครนี้เป็นที่หวาดกลัวในด้านขอบเขตและคุณภาพของสายลับ"
 spyamateur_modifier:0 "มือสมัครเล่นด้านสายลับ"
 spyamateur_modifier_desc:0 "ความสามารถของตัวละครนี้ในฐานะหัวหน้าผู้กระซิบยังขาดตกบกพร่องอยู่บ้าง"
 sycophant_story_failed_scheme_detection_modifier:0 "ตรวจไม่พบแผนการ"
 sycophant_story_failed_scheme_detection_modifier_desc:0 "แผนการนี้หลีกเลี่ยงการตรวจจับโดยผู้ที่อยู่ในตำแหน่งที่ดีที่สุดที่จะค้นพบได้"
 welcome_distraction_modifier:0 "สิ่งเบี่ยงเบนความสนใจที่น่ายินดี"
 welcome_distraction_modifier_desc:0 "ตัวละครนี้กำลังพักผ่อนหย่อนใจที่สมควรได้รับ"
 fanned_flame_modifier:0 "เปลวไฟที่ถูกโหมกระพือ"
 fanned_flame_modifier_desc:1 "กามารมณ์ของตัวละครนี้ถูกปลุกเร้าโดยการให้กำลังใจของคนสนิท"
 sycophant_story_tolerated_scheme_modifier:0 "แผนการที่ยอมให้เกิดขึ้น"
 sycophant_story_tolerated_scheme_modifier_desc:0 "แผนการนี้ได้รับอนุญาตให้ดำเนินไปตามครรลองของมัน"
