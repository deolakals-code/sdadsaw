 bp1_yearly.8040.a.trusting:0 "ขอบใจนะ เจ้าคอยหนุนหลังข้าเสมอ"
 bp1_yearly.8040.a.shy:0 "เจ้าปล่อยข้าไว้ตามลำพังได้หรือไม่?"
 bp1_yearly.8040.a.gregarious:0 "หลีกทางไป ผู้คนกำลังรอข้าอยู่"
 bp1_yearly.8040.a.lustful:0 "ข้าคิดว่าเจ้าอยู่คนเดียวนานเกินไปแล้ว"
 bp1_yearly.8040.a.chaste:0 "ข้าจะไม่ถูกล่อลวงง่ายๆ เช่นนั้น"
 bp1_yearly.8040.a.impatient:0 "ข้าไม่มีเวลาสำหรับเรื่องนี้"
 bp1_yearly.8040.a.patient:0 "ความรีบร้อนคือบ่อเกิดแห่งหายนะ"
 bp1_yearly.8040.a.content:0 "แล้วเมื่อใดเล่าจึงจะเพียงพอ?"
 bp1_yearly.8040.a.ambitious:0 "ข้าจะไม่ยอมล้าหลัง"
 bp1_yearly.8040.b:0 "ถือว่าเราเห็นต่างกันก็แล้วกัน! ทำใจให้สบายเถอะ"
 bp1_yearly.8040.b.success:0 "[bp1_yearly_8040_friend.GetTitledFirstNameNoTooltip] ยอมอ่อนข้อ"
 bp1_yearly.8040.b.failure:0 "[bp1_yearly_8040_friend.GetTitledFirstNameNoTooltip] ยังคงมีสีหน้าเย็นชา"
 bp1_yearly.8040.c:0 "เจ้าพูดถูก, [bp1_yearly_8040_friend.GetFirstNameNoTooltip]"
 bp_yearly_8040_trying_to_be_mindful_modifier:0 "พิจารณาข้อบกพร่อง"
 bp_yearly_8040_trying_to_be_mindful_modifier_desc:0 "ตัวละครนี้ถูกเผชิญหน้าเกี่ยวกับบุคลิกภาพของตน และกำลังพยายามที่จะมีสติระลึกรู้มากขึ้น"
 # A Murdered X
 bp1_yearly.8050.t:0 "[ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('victim_scope'))|U] ผู้ถูกสังหาร"
 bp1_yearly.8050.desc:0 "การสูญเสีย [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('victim_scope'))] อันเป็นที่รักของข้า, [victim_scope.GetFirstName], ช่างหนักหนานัก; ขบวนผู้ร่วมไว้อาลัยและคำปลอบโยนของพวกเขาเทียบไม่ได้เลยกับช่องว่างในใจข้า \n\nข้ายังไม่อยากเชื่อว่า [victim_scope.GetSheHe] [victim_scope.GetDeathReasonHideKiller], หรือว่า [murderer_scope.GetTitledFirstName], ผู้สังหาร [victim_scope.GetHerHis], ยังคงลอยนวลพ้นโทษ \n\n"
 bp1_yearly.8050.desc.prisoner:0 "แม้ว่า [murderer_scope.GetSheHe] จะเน่าเปื่อยอยู่ในคุกใต้ดินของ [murderer_scope.GetImprisonedBy.GetTitledFirstNameNoTooltip] ความรู้นั้นก็มิได้ดับความโกรธแค้นในใจข้า"
 bp1_yearly.8050.desc.free:0 "กำปั้นของข้าเกร็งแน่นและเลือดสูบฉีดในหูเมื่อข้านึกถึงไอ้เดรัจฉานนั่นที่เดินลอยนวล... เป็นการดูหมิ่นความยุติธรรม และต่อ [ROOT.Char.GetFaith.HighGodName]"
 bp1_yearly.8050.a:0 "สักวันหนึ่ง ข้าจะล้างแค้นให้เจ้า, [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('victim_scope'))]..."
 bp1_yearly.8050.b:0 "รอยเลือดสิ้นสุดที่นี่"
 # At My Mercy
 bp1_yearly.8060.t:0 "อยู่ในกำมือข้า"
 bp1_yearly.8060.opening:0 "ข้าใช้เวลาครู่หนึ่งสำรวจ [combat_location.GetTerrain.GetNameNoTooltip|l] ที่เกลื่อนกลาดของ [combat_location.GetNameNoTooltip] ซึ่งกระจัดกระจายไปด้วยศพชาว [primary_combat_winner.GetPrimaryTitle.GetAdjectiveNoTooltip] และ [primary_combat_loser.GetPrimaryTitle.GetAdjectiveNoTooltip] ก่อนจะหันไปหาเชลยศึกที่ถูกล่ามโซ่ \n\n"
 bp1_yearly.8060.desc.nemesis:0 "[captured_rival.GetTitledFirstName] เจ้า [captured_rival.Custom2('InsultNoun', ROOT.Char)] แห่ง [ROOT.Char.GetFaith.NegativeAfterLife] ที่น่ารังเกียจ ในที่สุดก็ตกอยู่ในมือข้า! ข้าฝันมานานที่จะได้กำจัด [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('captured_rival'))] ของข้า..."
 bp1_yearly.8060.desc.war_leader:0 "ในที่สุดข้าก็ได้ [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('captured_rival'))] ของข้า, [captured_rival.GetTitledFirstName], มาอยู่ในกำมือ และชัยชนะในสงครามของเราตอนนี้ก็แทบจะแน่นอนแล้ว...\n\n"ข้ายอมจำนน," [captured_rival.GetSheHe|U] คำราม, "ปล่อยข้าไปแล้วเจ้าจะได้สิ่งที่เจ้าต้องการ""
 bp1_yearly.8060.desc:0 "[ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('captured_rival'))] ของข้า, [captured_rival.GetTitledFirstName], จ้องมองข้าอย่างบึ้งตึง ทำให้หัวใจข้าอบอุ่น"
 bp1_yearly.8060.closing.multi:0 "\n\nเบื้องหลัง [captured_rival.GetHerHim], [captured_rival_2.GetTitledFirstName] ผู้ชั่วร้ายคุกเข่าอย่างกระวนกระวาย"
 bp1_yearly.8060.closing.ransom:0 "\n\n[captured_rival.GetSheHe|U] พูดตะกุกตะกัก ฟังดูสิ้นหวังเกินไปเล็กน้อย, "ข้ามีสิทธิ์ได้รับการไถ่ตัว!""
 bp1_yearly.8060.a.war_leader:0 "สงครามนี้จบแล้ว แต่สำหรับเจ้าเท่านั้น"
 bp1_yearly.8060.a.ransom:0 "สุนัขไม่มีสิทธิ์ได้รับการไถ่ตัว"
 bp1_yearly.8060.a:0 "วันเวลาของเจ้าหมดลงแล้ว ไอ้เดนมนุษย์"
 bp1_yearly.8060.b:0 "ฆ่า [captured_rival.GetHerHim] เสีย ฆ่าพวกมันทั้งหมด"
 bp1_yearly.8060.c:0 "ข้าจะ ทำให้แน่ใจว่าเจ้าจะไม่มีวันลืมวันนี้, [captured_rival.GetFirstNameNoTooltip]"
 bp1_yearly.8060.d:0 "จงจำความเมตตาของข้าไว้ ไอ้หนอน"
 bp1_yearly.8060.d.multi:0 "อย่าลืมความเมตตาของข้า ไอ้พวกน่าสมเพช"
 # At X's Mercy
 bp1_yearly.8061.t:0 "อยู่ในกำมือของ [combat_winner.GetTitledFirstNamePossessiveNoTooltip]"
 bp1_yearly.8061.desc:0 "ข้ายืนอยู่ ถูกทหารยามศัตรูจับตามอง บน [combat_location.GetTerrain.GetNameNoTooltip|l] อันโกลาหลของ [combat_location.GetNameNoTooltip] ขณะที่ไอ้สารเลวนั่น, [battle_rival_winner.GetTitledFirstName] สำรวจชัยชนะของ [battle_rival_winner.GetHerHis]\n\nในที่สุด [battle_rival_winner.GetSheHe|U] ก็เข้ามาใกล้ ชัก [battle_rival_winner.Custom('SignatureWeaponNameOrType')] ของ [battle_rival_winner.GetHerHis] ออกมาอย่างร่าเริงพร้อมประกายอันน่าสะพรึงกลัวในดวงตาของ [battle_rival_winner.GetHerHis]\n\n"
 bp1_yearly.8061.killed:0 "ข้าเห็นแล้วว่านี่คือจุดจบ..."
 bp1_yearly.8061.a:0 ""เจ้า [battle_rival_winner.Custom2('InsultAdjective', ROOT.Char)]-""
 bp1_yearly.8061.b:0 ""อย่าทำ เช่นนี้!""
