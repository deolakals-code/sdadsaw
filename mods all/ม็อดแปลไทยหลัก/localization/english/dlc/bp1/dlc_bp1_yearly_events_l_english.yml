 bp1_yearly.8100.a.hostile:0 "เจ้ากล้าดีอย่างไรมาพูดจาไม่ดีถึง [sycophant_scope.GetFirstNameNoTooltip]!"
 bp1_yearly.8100.a.flavor:0 "[jealous_scope.GetFirstNameNoTooltip] อาจเก็บความแค้นไว้"
 bp1_yearly.8100.b:0 "ข้าว่าเจ้าต้องการตำแหน่งของ [sycophant_scope.GetHerHis] เสียมากกว่า, [jealous_scope.GetFirstNameNoTooltip]"
 bp1_yearly.8100.b.flavor:0 "ข้าหวังว่า [sycophant_scope.GetFirstNameNoTooltip] จะเข้าใจ"
 bp1_yearly.8100.fired_tt:0 "[sycophant_scope.GetShortUIName|U] ถูกไล่ออกจาก [council|E] ของท่านเป็นเวลา 5 ปี"
 bp1_yearly.8100.c:0 "ตกลง ข้าจะปลด [sycophant_scope.GetFirstNameNoTooltip]"
 bp1_yearly.8100.c.flavor:0 "แม้ว่ามันจะ ทำให้ข้าเจ็บปวด..."
 bp1_yearly.8100.d.flavor:0 "[sycophant_scope.GetSheHe|U] ตลกมากจริงๆ นะ!"
 bp1_yearly.8100.d.success:0 "[sycophant_scope.GetTitledFirstNameNoTooltip] สร้างความประทับใจได้ดี"
 bp1_yearly.8100.d.failure:0 "[jealous_vassal.GetTitledFirstNameNoTooltip] ทน [sycophant_scope.GetWomanMan] ไม่ได้"
 bp1_yearly.8100.d.tt:0 "ตัวเลือกนี้ไม่สามารถใช้ได้ เนื่องจาก [jealous_scope.GetFirstNameNoTooltip] คือ [jealous_scope.Custom2('RelationToMe', sycophant_scope)|U] ของ [sycophant_scope.GetFirstNamePossessiveNoTooltip]"
 bp1_yearly.8100.reveal_tt:0 "[jealous_scope.GetTitledFirstName] อาจเปิดเผยความลับ [sycophant_secret.GetName] ของท่านและ [sycophant_scope.GetFirstNamePossessive]"
 bp1_yearly.8100.support:0 "[ROOT.Char.Custom2('RelationToMe', sycophant_scope)|U], [sycophant_scope.GetTitledFirstName], เป็นบุคคลที่ปลอบโยนในสภาของข้า พร้อมเสมอที่จะสนับสนุนข้า แม้ว่า [jealous_scope.GetTitledFirstName] จะรู้สึกแตกต่างออกไปอย่างชัดเจน"
 bp1_yearly.8100.knowledgeable:0 "ข้าพบว่าตัวเองพยักหน้าเห็นด้วยกับ [ROOT.Char.Custom2('RelationToMe', sycophant_scope)|U], [sycophant_scope.GetTitledFirstName], ช่างมีความรู้ ข้ายินดีที่มีสมาชิกสภาที่ไว้ใจได้และมีความสามารถ เช่นนี้ [jealous_scope.GetTitledFirstName] เห็นได้ชัดว่ารู้สึกแตกต่างออกไป"
 # Sycophant's secret
 bp1_yearly.8110.t:0 "ความลับของ [sycophant_scope.GetFirstNamePossessiveNoTooltip]"
 bp1_yearly.8110.desc:0 "ขณะที่ข้ากำลังเดินเล่นเงียบๆ ก่อนจะนอนหลับครั้งที่สอง จิตใจก็วอกแวกไปกับความคิดถึงดวงตาอันน่าหลงใหลของ [sycophant_scope.GetTitledFirstNamePossessive] [ROOT.Char.Custom2('RelationToMe', sycophant_scope)] ของข้า ข้าก็เหลือบไปเห็นร่างที่คุ้นเคยของ [revealer_scope.GetTitledFirstNamePossessive] กำลังเดินตรงเข้ามาหาข้า\n\n"อา [ROOT.Char.Custom('FormOfAddressForLiege')]... ข้าไม่สามารถอธิบายได้เลยว่าเหตุใดท่านจึงชื่นชม [sycophant_scope.GetFirstNameNoTooltip] มากมาย เช่นนี้ - #EMP จนกระทั่งบัดนี้#!."\n\n"
 bp1_yearly.8110.known_secret_homosexual:0 ""หลีกทางให้ข้าในบังคับที่สมควรได้รับมากกว่าในวงในของท่าน หรือข้าจะถูกบังคับให้นำความสัมพันธ์ผิดธรรมชาติของท่านมาเปิดเผย""
 bp1_yearly.8110.known_secret_adulterer:0 ""ปลด [sycophant_scope.GetHerHim] ออกจากสภาของท่าน หรือการคบชู้อันไร้ศีลธรรมของท่านจะเป็นที่รู้กันทั่ว""
 bp1_yearly.8110.known_secret_other:0 ""จงขับไล่ตัวปัญหา [sycophant_scope.Custom2('InsultAdjective', SCOPE.sC('revealer_scope'))] นั่นออกจากสภาของท่านเสีย หรือ มิฉะนั้นข้าจะถูกบังคับให้นำความสัมพันธ์ของท่านมาเปิดโปง""
 bp1_yearly.8110.c:0 "ตกลง..."
 bp1_yearly.8110.c.flavor:0 "...ตามใจเจ้า!"
 bp1_yearly.8110.d:0 "ข้าไม่อับอายในสิ่งใดทั้งสิ้น"
 bp1_yearly.8110.e:0 "เจ้าแน่ใจหรือว่า [secondary_scope.GetFirstNameNoTooltip] จะต้องการ เช่นนั้น?"
 every_powerful_vassal_tt:0 "ทุก [powerful_vassal|E]"
 # Sycophant's allure
 bp1_yearly.8120.t:0 "เสน่ห์ของ [sycophant_scope.GetFirstNamePossessiveNoTooltip]"
 bp1_yearly.8120.desc:0 "โอ้ [sycophant_scope.GetTitledFirstNamePossessive] ยอดเยี่ยม... ข้ากะพริบตาเพื่อหลุดจากภวังค์ เมื่อ [matchmaker_scope.GetTitledFirstName] ปรากฏตัวขึ้น ปิดประตูตามหลัง [matchmaker_scope.GetHerHim]\n\n"[ROOT.Char.Custom('FormOfAddressForLiege')|U] ข้ามาหาท่านเป็นการส่วนตัวด้วยเรื่องที่ละเอียดอ่อน..." [matchmaker_scope.GetSheHe|U] ลังเล "ท่านคิดว่า...ท่านอาจกำลังมอบหมายความรับผิดชอบและเกียรติยศให้ [sycophant_scope.GetFirstNameNoTooltip] เพราะท่าน... #EMP ชอบ#! [sycophant_scope.GetHerHim] หรือไม่?"\n\n[matchmaker_scope.GetFirstNameNoTooltip] ดึงคอเสื้อ [matchmaker_scope.GetHerHis] อย่างประหม่า\n\n"บางทีทุกคนอาจจะดีกว่านี้ หาก #EMP ท่าน#! ดูแล #EMP เรื่องนั้น#! และปล่อยตำแหน่งหน้าที่ให้กับเหล่าขุนนางของท่าน?""
 bp1_yearly.8120.a:0 "ออกไป"
 bp1_yearly.8120.a.flavor:0 "ข้าควรจะสั่งโบยเจ้า!"
 bp1_yearly.8120.b:0 "[sycophant_scope.GetFirstNameNoTooltip]? ห๊ะ ไม่มีทาง!"
 bp1_yearly.8120.seduce:0 "[scheme|E] จะมี [success_chance|E] เพิ่มขึ้น"
 bp1_yearly.8120.b.flavor:0 "ช่างเป็นความคิดที่ไร้สาระสิ้นดี!"
 bp1_yearly.8120.c:0 "อะไรนะ- #EMP โอ้...#! เจ้าอาจจะพูดถูก..."
 bp1_yearly.8120.c.flavor:0 "ท่านคิดว่า [sycophant_scope.GetSheHe] ชอบข้าด้วยหรือไม่?"
 bp1_yearly.8120.d:0 "เจ้า #EMP ช่าง#! เป็นคนช่างสังเกต แต่ข้าจะไม่ยอมอ่อนข้อ"
 bp1_yearly.8120.d.flavor:0 "อะไร ทำให้รู้กัน?"
 bp1_yearly.8121.t:0 "กลิ่นอายของ [sycophant_scope.GetFirstNamePossessiveNoTooltip]"
 bp1_yearly.8121.opening:0 "ความคิดเร่าร้อนคอยรบกวนข้าตั้งแต่คุยกับ [matchmaker_scope.GetTitledFirstName], ความฝันถึง [sycophant_scope.GetTitledFirstName] และข้า...\n\n"
 bp1_yearly.8121.homosexual:0 "ข้ารู้ว่านี่ไม่ใช่สิ่งที่ [ROOT.Char.GetFaith.HighGodName] ประสงค์ระหว่าง [ROOT.Char.GetWomanMan] คนหนึ่งกับอีกคน... โอ้ [ROOT.Char.GetFaith.PositiveAfterLife]!"
 bp1_yearly.8121.adultery:0 "คงไม่ถูกต้องที่จะทรยศ [ROOT.Char.GetConsort.GetTitledFirstName], แต่ [ROOT.Char.GetFaith.HighGodNameAlternate] ย่อมมีเหตุผลที่ ทำให้ข้ารู้สึก เช่นนี้เป็นแน่!"
 bp1_yearly.8121.other:0 "จะเป็นอย่างไรหาก [sycophant_scope.GetSheHe] รู้สึก เช่นเดียวกัน? ข้ากำลังทรมานตนเองโดยเปล่าประโยชน์หรือไม่? [ROOT.Char.GetFaith.FertilityGodName] โปรดช่วยข้าด้วย..."
 bp1_yearly.8121.desc:0 "\n\nข้าควรทำอย่างไรดี..."
 bp1_yearly.8121.a:0 "ข้าต้องทำตามหัวใจตนเอง"
 bp1_yearly.8121.a.flavor:0 "โอกาสนี้จะเสียไปไม่ได้"
 bp1_yearly.8121.b:0 "เรื่องนี้คงจบไม่สวยแน่..."
 bp1_yearly.8121.b.friend:0 "[sycophant_scope.GetSheHe|U] เป็นแค่สหาย! #EMP สหาย#!!"
 bp1_yearly.8121.b.flavor:0 "กลับไปทำงาน..."
 # Sycophant's enemies
 bp1_yearly.8130.t:0 "ศัตรูของ [sycophant_scope.GetFirstNamePossessiveNoTooltip]"
 bp1_yearly.8130.desc:0 "[ROOT.Char.Custom2('RelationToMe', sycophant_scope)] ของข้า, [sycophant_scope.GetTitledFirstName], พรวดพราดเข้ามาในห้องของข้า ชนโคมไฟล้มและเกือบ ทำให้เบาะรองนั่งติดไฟ\n\n"[ROOT.Char.GetFirstNameNoTooltip]! ข้ามั่นใจว่าข้าถูกสะกดรอยตาม!" [sycophant_scope.GetSheHe] ร้อง ชี้ไปทางด้านหลัง [sycophant_scope.GetHerHim]\n\n"มีคนซุ่มซ่อนอยู่นอกห้องของข้า; ข้าวของของข้าถูกย้ายที่!""
