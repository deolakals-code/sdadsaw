 bp1_yearly.8040.a.generous:0 "มีเพียงพอสำหรับทุกคน"
 bp1_yearly.8040.a.arrogant:0 "ข้าคือ [ROOT.Char.GetTitleAsNameNoTooltip]!"
 bp1_yearly.8040.a.humble:0 "ข้าเป็นเพียง [ROOT.Char.GetWomanMan] คนหนึ่ง เหมือนคนอื่นๆ นับไม่ถ้วน"
 bp1_yearly.8040.a.deceitful:0 "ความจริงไม่ได้ ทำให้เจ้าเป็นอิสระหรอก"
 bp1_yearly.8040.a.honest:0 "ความจริงคือ เจ้าเป็นคนโกหก"
 bp1_yearly.8040.a.vengeful:0 "ข้าจะจำเรื่องนี้ไว้เมื่อ #EMP เจ้า#! มาขอคบค้าสมาคมกับ #EMP ข้า#!"
 bp1_yearly.8040.a.forgiving:0 "อย่ากังวลไปเลย ข้าลืมความหยาบคายของเจ้าไปแล้ว"
 bp1_yearly.8040.a.wrathful:0 "เจ้า #EMP กล้าดีอย่างไร#! มาพูดกับข้า เช่นนี้?!"
 bp1_yearly.8040.a.calm:0 "หายใจลึกๆ ไม่จำเป็นต้องอารมณ์เสีย"
 bp1_yearly.8040.a.cynical:0 "#EMP แน่นอนว่า#! นั่นเป็นเรื่องที่ [ROOT.Char.GetFaith.HighGodName] ต้องตัดสินใจ ใช่หรือไม่?"
