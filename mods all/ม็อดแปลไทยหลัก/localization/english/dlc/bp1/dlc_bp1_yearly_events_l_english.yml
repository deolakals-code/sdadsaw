 bp1_yearly.8040.desc.trusting:0 "เชื่อมั่นในเจตนาของผู้อื่นโดยปริยายของท่าน"
 bp1_yearly.8040.desc.shy:0 "หลีกเลี่ยงการสนทนากับผู้อื่นของท่าน"
 bp1_yearly.8040.desc.gregarious:0 "วอกแวกไปกับการพูดคุยไร้สาระและความสนุกสนานของท่าน"
 bp1_yearly.8040.desc.lustful:0 "ตกเป็นทาสของกามารมณ์และสิ่งยั่วยวนของท่าน"
 bp1_yearly.8040.desc.chaste:0 "หลีกเลี่ยงความสุขทางเนื้อหนังของท่าน"
 bp1_yearly.8040.desc.impatient:0 "นิสัยบุ่มบ่ามรีบร้อนทำสิ่งต่างๆ ของท่าน"
 bp1_yearly.8040.desc.patient:0 "ระมัดระวังเกินเหตุและตอบสนองต่อเหตุการณ์อย่างเชื่องช้าของท่าน"
 bp1_yearly.8040.desc.content:0 "ขาดแรงผลักดันที่จะประสบความสำเร็จและเหนือกว่าผู้อื่นของท่าน"
 bp1_yearly.8040.desc.ambitious:0 "ความต้องการก้าวไปข้างหน้าอย่างไม่หยุดยั้ง โดยไม่มีที่สิ้นสุดของท่าน"
 bp1_yearly.8040.desc.closing:0 "— มัน ทำให้ท่านดูไม่ดี ท่านต้องเห็นแน่ว่าการประพฤติตน เช่นนี้ไม่เป็นผลดีต่อ [ROOT.Char.GetTitleAsNameNoTooltip] เลยใช่หรือไม่?""
 bp1_yearly.8040.a:0 "เจ้า #EMP กล้าดีอย่างไร#! มาพูดกับข้า เช่นนี้? ออกไป!"
