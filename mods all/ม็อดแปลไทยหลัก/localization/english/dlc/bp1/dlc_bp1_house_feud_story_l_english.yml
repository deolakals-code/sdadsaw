 # Game Concept
 game_concept_house_feud:0 "ความบาดหมางระหว่างตระกูล"
 game_concept_house_feuds: "ความบาดหมางระหว่างตระกูล"
 game_concept_house_feuding:0 "การบาดหมางระหว่างตระกูล"
 game_concept_house_feud_desc:4 "บางครั้ง ความเป็นอริอาจเติบโตเป็นการล้างแค้นต่อ [house|E] หนึ่งโดยเฉพาะ\n\n#help การสังหาร, [torturing|E], การสวมเขา, การปล้น, และการชนะ [wars|E] ต่อสมาชิกของ [house|E] เป้าหมายจะเพิ่มคะแนนให้ตระกูลของท่าน ในขณะที่การตกเป็นเหยื่อของการกระทำเหล่านี้จะลดคะแนนลง\n\nขณะที่ความบาดหมางดำเนินอยู่ สมาชิก [house|E] ทุกคนจะได้รับโบนัส [hostile_schemes|E] ต่อสมาชิกของ [house|E] เป้าหมาย และจะมีแนวโน้มที่จะกำหนดเป้าหมายสมาชิกของตระกูลนั้นมากขึ้น\n\nเมื่อความบาดหมางสิ้นสุดลง [house|E] ของท่านจะได้รับรางวัลตามความเสียหายสัมพัทธ์ที่สร้างให้กับศัตรู ตั้งแต่ [GetModifier('house_feud_terrible_modifier').GetNameWithTooltip] ถึง [GetModifier('house_feud_excellent_modifier').GetNameWithTooltip]"
