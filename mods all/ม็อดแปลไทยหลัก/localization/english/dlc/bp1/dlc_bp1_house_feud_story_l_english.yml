 action_ongoing_house_feud_desc:2 "ครอบครัวของท่านมองว่าตระกูล [recipient.GetHouse.GetBaseName] เป็นศัตรู และจะได้รับรางวัลจากการเอาชนะพวกเขา\n\n#help การสังหาร, [torturing|E], การคบชู้, การปล้นชิง, และการชนะ[wars|E] ต่อสมาชิกตระกูลนั้น จะช่วยเพิ่มคะแนนให้ตระกูลของท่าน ในขณะที่การตกเป็นเหยื่อของการกระทำเหล่านี้จะลดคะแนนลง#!\n"
