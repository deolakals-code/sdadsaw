l_english: 
 bp1_house_feud.0001.t:0 "ตระกูลอันน่าสาปแช่ง"
 bp1_house_feud.0001.desc:0 "ข้าอดทนต่อ [house_feud_rival.GetTitledFirstName] และความชั่วช้า [house_feud_rival.GetHerHis] มานานเกินไปแล้ว\n\nบางคราข้าฝันถึงการเหยียบย่ำตระกูล [house_feud_rival.GetHouse.GetBaseName] ให้จมดิน ลบครอบครัว [house_feud_rival.Custom2('InsultAdjective', ROOT.Char)] นั่นออกไปจากหน้าประวัติศาสตร์ พร้อมกับความทุกข์ระทมทั้งมวลที่พวกมันก่อไว้แก่ข้า\n\nข้านอนลืมตาโพลง ร้อนรุ่มด้วยความเกลียดชังของตนเอง แต่จะมีผู้ใดเล่าที่ควรค่าแก่การเป็นเป้าหมายของมันยิ่งไปกว่า [house_feud_rival.GetFirstNameNoTooltip]?"
 bp1_house_feud.0001.target:0 "\n\nข่าวลือนั้นจะเป็นจริงได้ฤๅ? นี่เป็นผลมาจาก [relation.Custom('GetFamilyFeudShort')] เมื่อนานมาแล้วงั้นรึ?"
 bp1_house_feud.0001.a:0 "ข้าจะ ทำให้มันเป็นภารกิจในชีวิต"
 bp1_house_feud.0001.b:0 "คงมีวิธีใช้พลังงานของข้าที่ดีกว่านี้..."
 bp1_house_feud.0002.t:0 "ความเป็นปึกแผ่นของราชวงศ์"
 bp1_house_feud.0002.desc:1 "[ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('house_feud_victim'))] ของข้า, [house_feud_victim.GetTitledFirstName], คร่ำครวญถึงความเลวทรามของคู่แข่งของ [house_feud_victim.GetHerHis], [house_feud_attacker.GetTitledFirstName] อยู่เสมอ\n\nทุกครั้งที่ข้าพบ [house_feud_victim.GetHerHim], [house_feud_victim.GetSheHe] จะกล่าวถึง [SCOPE.Custom('VenomousCreature')|U] แห่งตระกูล [house_feud_attacker.GetHouse.GetBaseName]' และกระตุ้นให้ข้าเสนอคำแนะนำหรือความช่วยเหลือในการโค่นล้ม [house_feud_attacker.GetHerHim]"
 bp1_house_feud.0002.a:0 "นี่ฟังดูเหมือนเรื่องในครอบครัว"
 bp1_house_feud.0002.b:0 "[house_feud_attacker.GetFirstNameNoTooltip] กล้าดีอย่างไรมาท้าทาย [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('house_feud_victim'))] ของข้า?"
 bp1_house_feud.0002.c:0 "[house_feud_victim.GetSheHe|U] ต้องแก้ปัญหาของ [house_feud_victim.GetHerHis] เอง"
 bp1_house_feud.0003.t:0 "ตาต่อตา ฟันต่อฟัน"
 bp1_house_feud.0003.desc:0 "ข้าเดินไปมาอยู่ด้านนอก [ROOT.Char.Custom('ResidenceBuilding')] ของข้า มิอาจปัดเป่าความทรงจำเกี่ยวกับ [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('house_feud_victim'))] ของข้า [house_feud_victim.GetTitledFirstName] ผู้ถูกพรากไปจากเราก่อนเวลา [house_feud_victim.GetHerHis] อันควรด้วยน้ำมือของ [house_feud_attacker.GetTitledFirstName]... สัตว์ร้ายจากตระกูล [house_feud_attacker.GetHouse.GetBaseName] อันชั่วช้านั่น!\n\nมีเพียงหนทางเดียวเท่านั้นที่เกียรติยศของข้าจะได้รับการฟื้นฟู และ [house_feud_victim.GetFirstNameNoTooltip] จะได้รับการแก้แค้น..."
 bp1_house_feud.0003.a:0 "ขอสาปแช่งตระกูล [house_feud_attacker.GetHouse.GetBaseNameNoTooltip]!"
 bp1_house_feud.0003.b:0 "ข้าจะส่ง [house_feud_attacker.GetFirstNameNoTooltip] ไปยัง [ROOT.Char.GetFaith.NegativeAfterLife] ด้วยตัวเอง!"
 bp1_house_feud.0003.c:0 "การแก้แค้นไม่อาจนำ [house_feud_victim.GetHerHim] กลับมาได้"
 bp1_house_feud.0004.t:0 "ศัตรูของ [ROOT.Char.Custom2('RelationToMePossessive', SCOPE.sC('old_house_head'))|U]"
 bp1_house_feud.0004.desc:0 "ด้วยการจากไปของ [old_house_head.GetTitledFirstNamePossessiveRegnal] ตำแหน่งผู้นำตระกูล [ROOT.Char.GetHouse.GetName] ตกเป็นของข้า พร้อมกับความรับผิดชอบในการปกป้องครอบครัว\n\nความเป็นศัตรูระหว่าง [house_feud_rival.GetTitledFirstName] และ [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('old_house_head'))] ของข้าไม่ใช่ความลับ ความเกลียดชังของ [old_house_head.GetFirstNamePossessiveNoTooltip] ต่อเหล่า [house_feud_rival.GetHouse.GetBaseName] แพร่กระจายเข้าสู่ชีวิตประจำวันของ [old_house_head.Custom('GetCourt')] แห่ง [old_house_head.GetPrimaryTitle.GetAdjectiveNoTooltip]\n\nข้าลังเลระหว่างการลืมข้อพิพาทเก่าๆ เหล่านี้ กับการเคารพความปรารถนาของ [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('old_house_head'))] ผู้ล่วงลับของข้า..."
 bp1_house_feud.0004.a:0 "ตระกูล [ROOT.Char.GetHouse.GetBaseNameNoTooltip] ไม่ลืมศัตรู"
 bp1_house_feud.0004.b:0 "ความเกลียดชังของ [old_house_head.GetFirstNamePossessiveNoTooltip] ตายไปพร้อมกับ [old_house_head.GetHerHim]"
 bp1_house_feud.0005.t:0 "เสน่ห์แห่งการล้างแค้น"
 bp1_house_feud.0005.desc:0 "ช่องว่างที่การตายของ [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('house_feud_victim'))] ของข้า, [house_feud_victim.GetFirstNamePossessive], ทิ้งไว้ในใจข้ายังคงอยู่ ถูกขุดคุ้ยเปิดออกทุกครั้งที่ข้านึกถึงฆาตกรชั่วช้าของ [house_feud_victim.GetHerHis] และความยุติธรรมที่ยังคงรอคอยการชำระ\n\nวันแล้ววันเล่า ตรรกะอันโหดร้ายของการแก้แค้นครอบงำความคิดข้า ถูกเติมเชื้อไฟทุกคืนในฝันอันกระสับกระส่าย ที่ ซึ่งข้าเห็น [house_feud_attacker.GetFirstName] และตระกูล [house_feud_attacker.GetHouse.GetBaseName] ทั้งหมดต้องทนทุกข์ทรมานด้วยความโศกเศร้า เช่นเดียวกับที่ครอบครัวข้าอดทน..."
 bp1_house_feud.0005.a:0 "'[ROOT.Char.GetHouse.GetMotto]!'"
 bp1_house_feud.0005.b:0 "[house_feud_attacker.GetFirstNameNoTooltip] จะหนีไปไม่ได้"
 bp1_house_feud.0005.c:0 "ไม่มีสิ่งใดนำ [house_feud_victim.GetFirstNameNoTooltip] กลับมาได้..."
 bp1_house_feud.0005.c.rival:0 "[ROOT.Char.GetFaith.HighGodName] จะลงทัณฑ์ความชั่วร้าย"
 bp1_house_feud.0006.t:0 "[house_feud_claim.GetBaseNameNoTierPossessiveNoTooltip] [house_feud_rival.GetTitleAsNameNoTooltip] ที่แท้จริง"
 bp1_house_feud.0006.desc:0 "ใบหน้ายิ้มเยาะ [house_feud_rival.GetTitledFirstNamePossessive] ปรากฏขึ้นในห้วงคำนึงข้าอีกครา ข้าผุดลุกขึ้นและปลีกตัวออกจากกองไฟด้วยข้ออ้างแย่ ๆ เดินวนเวียนอยู่ในความมืด\n\nข้ามิอาจสลัด [house_feud_rival.Custom2('InsultNoun', ROOT.Char)] นั่นออกไปจากใจได้; ความคิดที่ว่า [house_feud_rival.GetHerHim] และญาติ [house_feud_rival.GetHerHis] ยังลอยนวล กำลังปรีดาอยู่ใน [house_feud_rival.GetCapitalLocation.GetName]...\n\n"
 bp1_house_feud.0006.higher:0 "ขอสาบานต่อ [ROOT.Char.GetFaith.HighGodName], #EMP ข้า#! คือผู้ปกครองโดยชอบธรรมแห่ง [house_feud_claim.GetBaseNameNoTier]"
 bp1_house_feud.0006.same:0 "ข้าจะไม่มีวันสงบสุขจนกว่า [house_feud_claim.GetBaseNameNoTier] จะเป็นของข้าหรือ?"
 bp1_house_feud.0006.multi:0 "[house_feud_claim.GetBaseNameNoTier] และดินแดนอื่นๆ ที่ [house_feud_rival.GetTitledFirstName] ยึดครองอยู่ ต้องเป็นของข้า"
 bp1_house_feud.0006.previous:1 "ดินแดนของ [house_feud_previous.GetTitledFirstNamePossessive] จะกลับคืนสู่เรา"
 bp1_house_feud.0006.a:0 "ตระกูล [house_feud_rival.GetHouse.GetBaseNameNoTooltip] ต้องสิ้นสุด"
 bp1_house_feud.0006.b:0 "[house_feud_rival.GetFirstNameNoTooltip] คือปัญหา"
 bp1_house_feud.0006.c:0 "ดื่ม [ROOT.Char.Custom('RegionalAlcoholicDrink')] สักหน่อย คิดเรื่องอื่นบ้าง..."
 bp1_house_feud.0007.t:0 "คุกรุ่นในกรงขัง"
 bp1_house_feud.0007.house_arrest:0 "การถูกกักบริเวณในห้องของ [house_feud_attacker.GetTitledFirstNamePossessive] แม้จะดีกว่าคุกใต้ดิน แต่ก็ไม่ใช่หนทางที่จะมีชีวิตอยู่\n\nอาหารแย่—ความบันเทิงยิ่งแย่กว่า— แต่ข้ามีเวลามากมายที่จะสร้างความขุ่นเคืองต่อผู้คุมขังข้า"
 bp1_house_feud.0007.dungeon:0 "การถูกกักขังในคุกใต้ดินของ [house_feud_attacker.GetTitledFirstNamePossessive] มีเพียงเสียงจอแจห่างๆ ของ [house_feud_attacker.GetCapitalLocation.GetNameNoTooltip] และเสียงคำรามที่นานๆ ครั้งของทหารยามชาว [house_feud_attacker.GetCulture.GetNameNoTooltip] เป็นสิ่งกระตุ้น ข้ามีเวลามากมายที่จะสร้างความขุ่นเคืองต่อผู้คุมขังข้า"
 bp1_house_feud.0007.camp: "การต้องทนทุกข์อยู่ใน [house_feud_attacker.Custom('GetCourt')] ของ [house_feud_attacker.GetTitledFirstNamePossessive] อยู่ภายใต้ความเมตตาของธาตุต่างๆ และทหารยามที่คอยเยาะเย้ย ข้ามีเวลามากมายที่จะสร้างความขุ่นเคืองต่อผู้คุมขังข้า"
 bp1_house_feud.0007.desc:0 "\n\n[house_feud_attacker.GetSheHe|U] กักขังข้าไว้นานเกินกว่าเหตุ และข้าทำได้เพียงคาดเดาถึงแรงจูงใจที่เล็กน้อยหรือเอาแน่เอานอนไม่ได้ในการโอ้เอ้ของ [house_feud_attacker.GetHerHis] ข้าจนปัญญาแล้ว..."
 bp1_house_feud.0007.a:0 "ข้าจะทำลายตระกูลชั่วช้านี้"
 bp1_house_feud.0007.b:0 "สักวันหนึ่ง ข้าจะล่ามโซ่ [house_feud_attacker.GetFirstNameNoTooltip] เช่นนี้"
 bp1_house_feud.0007.c:0 "บางที [house_feud_attacker.GetSheHe] อาจมีเหตุผลที่ดี..."
 bp1_house_feud.0008.t:0 "การจองจำอันอยุติธรรม"
 bp1_house_feud.0008.desc:0 "กลิ่นหอมของสมุนไพรและสตูว์เข้มข้นลอยมาจากครัวใน [ROOT.Char.Custom('ResidenceBuilding')] และข้าไม่อาจขับไล่ชะตากรรมของ [house_feud_victim.GetFirstName] ที่รักออกจากใจได้"
 bp1_house_feud.0008.house_arrest:0 "\n\nข้าหวังว่าผู้คุมขังของ [house_feud_victim.GetHerHis], [house_feud_attacker.GetTitledFirstName], จะเลี้ยงดู [house_feud_victim.GetHerHim] อย่างดีภายใต้การกักบริเวณ - แต่ไม่มีชาว [ROOT.Char.GetHouse.GetBaseName] คนใดควรอยู่ภายใต้การควบคุม!"
 bp1_house_feud.0008.dungeon:0 "\n\nความคิดถึงสถานการณ์ของ [house_feud_victim.GetHerHis] ที่ถูกขังอยู่ในคุก [house_feud_attacker.GetPrimaryTitle.GetAdjectiveNoTooltip] เหมือนสัตว์ชั้นต่ำ... ชาว [ROOT.Char.GetHouse.GetBaseName]!"
 bp1_house_feud.0008.camp: "\n\nความคิดถึง [house_feud_victim.GetHerHim] ที่ถูกล่ามโซ่เหมือนสัตว์ชั้นต่ำใน [ROOT.Char.Custom('GetCourt')] ของ [house_feud_attacker.GetTitledFirstNamePossessive]... ชาว [ROOT.Char.GetHouse.GetBaseName]!"
 bp1_house_feud.0008.closing:0 "\n\nข้าโกรธขึ้นมาเมื่อนึกถึงหลายเดือนที่ [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('house_feud_victim'))] ของข้าต้องทนทุกข์ทรมานในกรงขัง [house_feud_attacker.GetFirstNameNoTooltip] ทำเกินไปแล้วที่ปฏิบัติต่อ [house_feud_victim.GetHerHim] เช่นนั้น ไม่ว่าจะเป็น [house_feud_attacker.GetTitleAsNameNoTooltip] หรือไม่ก็ตาม!"
 bp1_house_feud.0008.a:0 "การปฏิบัติอันโหดร้ายของ [house_feud_attacker.GetHouse.GetBaseNameNoTooltip] นี้จะไม่มีวันถูกลืม"
 bp1_house_feud.0008.b:0 "[house_feud_attacker.GetFirstNameNoTooltip] จะต้องชดใช้"
 bp1_house_feud.0008.c:0 "ข้าทำได้เพียงสวดภาวนาให้ [house_feud_victim.GetHerHis] ได้รับการปล่อยตัว"
 bp1_house_feud.0009.t:0 "[old_house_head.Custom2('RelationToMeShort', ROOT.Char)|U] ผู้เคียดแค้น"
 bp1_house_feud.0009.adult:0 "[ROOT.Char.GetCapitalLocation.GetName] ยังคงไว้ทุกข์ให้ [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('old_house_head'))] ของข้า ภายนอก [ROOT.Char.Custom('ResidenceBuilding')] ข้าสามารถหลีกหนีจากผู้ร่วมไว้อาลัย เสียงร่ำไห้คร่ำครวญถึง '[old_house_head.GetTitledFirstName]' ของพวกเขาไม่หยุดหย่อน และอยู่กับความคิดของข้าตามลำพัง\n\nมิน่าเชื่อว่า [old_house_head.GetSheHe] [old_house_head.GetDeathReasonHideKiller] โดย [house_feud_rival.GetTitledFirstName] ไอ้ [house_feud_rival.Custom2('InsultNoun', ROOT.Char)] แห่งตระกูล [house_feud_rival.GetHouse.GetBaseName] นั่น..."
 bp1_house_feud.0009.child:0 "เมื่อเวลาผ่านไป ข้าได้รับฟังเรื่องราวเกี่ยวกับ [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('old_house_head'))] ของข้ามากขึ้นเรื่อยๆ รวมถึงเรื่องที่ [old_house_head.GetSheHe] [old_house_head.GetDeathReasonHideKiller] โดย [house_feud_rival.GetTitledFirstName]..."
 bp1_house_feud.0009.reciprocate:0 "ข้าจะสอนให้ [house_feud_rival.GetHerHim] รู้ถึงราคาของการล้างแค้นของ [house_feud_rival.GetHerHis]!"
 bp1_house_feud.0009.new:0 "โชคชะตาช่างโหดร้าย!"
 bp1_house_feud.0009.closing:0 "\n\nหากจะมีความยุติธรรมในโลกนี้ และเกียรติของตระกูล [ROOT.Char.GetHouse.GetBaseName] ได้รับการฟื้นฟู ข้าอาจจะต้องเป็นผู้มอบมันด้วยตัวเอง"
 bp1_house_feud.0009.a:0 "'[house_feud_rival.GetHouse.GetBaseNameNoTooltip]' จะเป็นคำสาปนับจากนี้ไป"
 bp1_house_feud.0009.b:0 "สักวันหนึ่ง ข้าจะสังหาร [house_feud_rival.GetFirstNameNoTooltip]"
 bp1_house_feud.0009.c:0 "เลือดของชาว [ROOT.Char.GetHouse.GetBaseNameNoTooltip] ไหลนองพอแล้ว..."
 bp1_house_feud.0010.t:0 "การปฏิบัติอันไม่อาจให้อภัยได้"
 bp1_house_feud.0010.torture:0 "ความเจ็บปวดนั้นเหลือทน ไม่สิ้นสุด... ข้าไม่คิดว่า [house_feud_attacker.GetTitledFirstName] จะโหดร้ายป่าเถื่อนถึงเพียงนี้ ไม่ต้องพูดถึงการปฏิบัติต่อ [ROOT.Char.GetTitleAsNameNoTooltip] ขุนนาง เช่นนี้!\n\n"
 bp1_house_feud.0010.blinding:0 "ข้ายังไม่ยอมรับการสูญเสียการมองเห็นอย่างเต็มที่... บางทีข้าอาจประเมิน [house_feud_attacker.GetTitledFirstName] ต่ำไป... ข้าคงจะร่ำไห้เมื่อคิดว่าตอนนี้ข้าไร้หนทางช่วยเหลือเพียงใด หากความเจ็บปวดอนุญาต\n\n"
 bp1_house_feud.0010.castration:0 "ความเจ็บปวดจากการ... ถูกกระทำทารุณ... ของข้ายังคงอยู่ ทุกการขยับตัวเตือนให้ข้านึกถึงสิ่งที่ข้าสูญเสียไป การวางแผนแก้แค้น [house_feud_attacker.GetTitledFirstName] เป็นสิ่งเดียวที่ ทำให้ข้าไขว้เขว\n"
 bp1_house_feud.0010.house_arrest:0 "แม้ข้าจะดีใจที่ไม่ได้อยู่ในคุกใต้ดินของ [house_feud_attacker.GetHouse.GetBaseNameNoTooltip] แต่มันก็เป็นเพียงการปลอบใจเล็กน้อยในสถานการณ์ เช่นนี้ "
 bp1_house_feud.0010.dungeon:0 "ณ ที่นี่ ในหลุมอับชื้นนี้ ข้าตกต่ำถึงเพียงนี้ ด้วยน้ำมือของไอ้สารเลว [house_feud_attacker.GetHouse.GetBaseNameNoTooltip] นี้"
 bp1_house_feud.0010.free:0 "ข้าเป็นอิสระอีกครั้ง แต่ข้าจะไม่มีวันสมบูรณ์ [house_feud_attacker.GetFirstNameNoTooltip] เพียงผู้เดียวที่รู้ว่า [house_feud_attacker.GetSheHe] ทำให้ข้าต้องสูญเสียไปมากเพียงใด "
 bp1_house_feud.0010.a:0 "พวกมันทั้งหมดจะต้องปรารถนาว่าไม่เคยเกิดมา"
 bp1_house_feud.0010.b:0 "พวก [house_feud_existing.GetHouse.GetBaseNameNoTooltip] ได้เจอคู่ปรับแล้ว"
 bp1_house_feud.0010.c:0 "[house_feud_attacker.GetFirstNameNoTooltip] จะต้องชดใช้ ไม่ทางใดก็ทางหนึ่ง"
 bp1_house_feud.0010.d:0 "ข้าคิดว่าข้าพอแล้วกับความรุนแรง..."
 bp1_house_feud.0011.t:0 "[ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('house_feud_victim'))|U] ผู้ถูกทารุณ"
 bp1_house_feud.0011.torture:0 "ข้าแทบไม่อาจทนฟังเรื่องราวการทรมาน [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('house_feud_victim'))] ของข้า, [house_feud_victim.GetFirstNamePossessive], ด้วยน้ำมือของ [house_feud_attacker.GetTitledFirstName] ได้\n\n"
 bp1_house_feud.0011.blinding:0 "ข่าวการ #EMP ทำให้ตาบอด#! ของ [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('house_feud_victim'))] ของข้า, [house_feud_victim.GetTitledFirstNamePossessive], โดย [house_feud_attacker.GetTitledFirstName] ยังไม่ซึมซับเข้าสู่ใจข้าอย่างเต็มที่\n\n"
 bp1_house_feud.0011.castration:0 "ข่าวการ... #EMP ตอน#! [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('house_feud_victim'))] ของข้า, [house_feud_victim.GetFirstName], ปกคลุม [ROOT.Char.Custom('GetCourt')] อยู่\n\n"
 bp1_house_feud.0011.house_arrest:0 "สิ่งปลอบใจเพียงอย่างเดียวคือ [house_feud_victim.GetSheHe] รอดพ้นจาก [house_feud_attacker.Custom('GetDungeon')] แห่ง [house_feud_attacker.GetPrimaryTitle.GetBaseNameNoTierNoTooltip]..."
 bp1_house_feud.0011.dungeon:0 "ที่แย่ไปกว่านั้น [house_feud_victim.GetSheHe] ยังต้องทนทุกข์ทรมานใน [house_feud_attacker.Custom('GetDungeon')] แห่ง [house_feud_attacker.GetPrimaryTitle.GetBaseNameNoTierNoTooltip]..."
 bp1_house_feud.0011.camp:0 "ที่แย่ไปกว่านั้น [house_feud_victim.GetSheHe] ยังต้องทนทุกข์ทรมานใน [house_feud_attacker.Custom('GetDungeon')] อันโสโครก..."
 bp1_house_feud.0011.free:0 "แม้ว่า [house_feud_victim.GetSheHe] จะเป็นอิสระแล้วในตอนนี้ แต่การทารุณกรรมนี้จะยังคงอยู่กับ [house_feud_victim.GetHerHim] ไปตลอดชีวิตของ [house_feud_victim.GetHerHis]"
 bp1_house_feud.0011.closing:0 "\n\nข้าจะปล่อยให้ความอุกอาจของ [house_feud_attacker.GetHouse.GetBaseName] นี้ดำเนินต่อไปได้จริงหรือ?"
 bp1_house_feud.0011.a:0 "ชาว [house_feud_attacker.GetHouse.GetBaseNameNoTooltip] ทั้งหมดจะต้องชดใช้"
 bp1_house_feud.0011.b:0 "ข้าจะ ทำให้ [house_feud_attacker.GetFirstNameNoTooltip] ทรมาน"
 bp1_house_feud.0011.c:0 "ไม่มีอะไรที่ทำได้..."
 bp1_house_feud.0012.t:0 "สวมเขาให้สามี"
 bp1_house_feud.0012.t.female:0 "สวมมงกุฎให้ภรรยา" # หมายถึงการที่ภรรยาถูกนอกใจ
 bp1_house_feud.0012.desc:0 "การที่ล่วงรู้ว่า [ROOT.Char.Custom2('RelationToMePossessive', SCOPE.sC('house_feud_spouse'))] ของข้ามีความสัมพันธ์ทางกายกับ [house_feud_attacker.Custom2('InsultNoun', ROOT.Char)] ผู้นั้น [house_feud_attacker.GetTitledFirstName] มันกัดกินใจข้า\n\nการที่ถูกหัวเราะเยาะลับหลัง ในขณะที่ [house_feud_spouse.GetFirstName] กำลังสุขสบายอยู่ใน [ROOT.Char.Custom('ResidenceBuilding')] ของข้า..."
 bp1_house_feud.0012.good:1 "\n\n[house_feud_spouse.GetSheHe] ทำ เช่นนี้กับข้าได้อย่างไร?"
 bp1_house_feud.0012.bad:0 "\n\nข้าปรารถนาเหลือเกินว่าข้าไม่เคย แต่งงานกับ [house_feud_spouse.Custom2('InsultNoun', ROOT.Char)] ผู้นี้..."
 bp1_house_feud.0012.a:0 "ตระกูล [house_feud_attacker.GetHouse.GetBaseNameNoTooltip] ต้องถูกจัดการ"
 bp1_house_feud.0012.b:0 "ลืมตระกูล [house_feud_existing.GetHouse.GetBaseNameNoTooltip] ไปก่อน นี่มันเรื่องอื้อฉาว!"
 bp1_house_feud.0012.c:0 "ข้าจะฆ่า [house_feud_attacker.GetHerHim]"
 bp1_house_feud.0012.d:0 "นี่ไม่เป็นประโยชน์เลย..."
 bp1_house_feud.0013.t:0 "เกียรติยศของ [house_feud_spouse.Custom2('RelationToMePossessive', ROOT.Char)|U]"
 bp1_house_feud.0013.desc:0 "ข่าวการคบชู้ของ [house_feud_spouse.GetTitledFirstNamePossessive] แพร่กระจายออกไป และข้าอดไม่ได้ที่จะเห็นการดูถูกเหยียดหยามที่ซ่อนอยู่หลังรอยยิ้มของคนรับใช้และ [ROOT.Char.Custom('GetCourtier')] ทุกคน\n\n[house_feud_attacker.GetTitledFirstName] ทำให้ข้าและครอบครัวกลายเป็นตัวตลก..."
 bp1_house_feud.0013.a:0 "ชาว [house_feud_attacker.GetHouse.GetBaseNameNoTooltip] ทั้งหมดจะต้องชดใช้"
 bp1_house_feud.0013.b:0 "[house_feud_attacker.GetSheHe|U] ทำให้ตระกูล [house_feud_existing.GetHouse.GetBaseNameNoTooltip] ดูมีคุณธรรมไปเลย!"
 bp1_house_feud.0013.c:0 "ข้าจะ ทำให้ [house_feud_attacker.GetFirstNameNoTooltip] ทรมาน"
 bp1_house_feud.0013.d:0 "ทั้งหมดนี้เป็นอดีตไปแล้ว..."
 bp1_house_feud.0014.t:0 "ศักดิ์ศรีของ [ROOT.Char.Custom2('RelationToMePossessive', SCOPE.sC('house_feud_victim'))|U]"
 bp1_house_feud.0014.desc:0 "[house_feud_victim.GetTitledFirstName] ล้มเหลวในการดูแลบ้าน [house_feud_victim.GetHerHis] ให้เรียบร้อย; [house_feud_victim.Custom2('RelationToMeShort', SCOPE.sC('house_feud_spouse'))] [house_feud_victim.GetHerHis] [house_feud_spouse.GetTitledFirstNamePossessive] การลอบพบปะกับ [house_feud_attacker.GetTitledFirstName] ผู้ [house_feud_attacker.Custom2('InsultAdjective', ROOT.Char)] นำความอัปยศและการเยาะเย้ยมาสู่ครอบครัวของเรา...\n\nด้วยน้ำเสียงแผ่วเบา [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('house_feud_victim'))] ของข้าอธิบายทุกอย่างแก่ข้าท่ามกลางภาชนะใส่ [ROOT.Char.Custom('RegionalAlcoholicDrink')] ที่ฝุ่นจับ "เราต้องทำอะไรสักอย่างกับ [house_feud_attacker.Custom2('InsultNoun', SCOPE.sC('house_feud_victim'))] นั่น [house_feud_victim.Custom2('RelationToMeShort', ROOT.Char)] เรื่องนี้มิอาจปล่อยผ่านไปโดยไม่ทักท้วงได้!""
 bp1_house_feud.0014.a:0 "ตระกูล [house_feud_attacker.GetHouse.GetBaseNameNoTooltip] ล้ำเส้นแล้ว"
 bp1_house_feud.0014.b:0 "[house_feud_attacker.GetFirstNameNoTooltip] ไม่อาจลอยนวลไปได้"
 bp1_house_feud.0014.c:0 "การให้อภัยและลืมเลือนย่อมดีกว่า..."
 ### Ongoing Events ###
 bp1_house_feud.0100.t:0 "$story_cycle_house_feud_title$: ความขุ่นเคืองที่ไม่สมดุล"
 bp1_house_feud.0100.desc:0 "มันเป็นลางร้ายที่ [house_feud_rival.GetFirstName] ผู้ชั่วช้ายังคงเป็น [house_feud_rival.GetTitleAsNameNoTooltip] ในขณะที่ข้าเป็นเพียง [ROOT.Char.GetTitleAsNameNoTooltip] ต่ำต้อย... การปกป้องครอบครัวข้าจากศัตรูที่ทรงอำนาจ เช่นนี้ต้องใช้ความพยายามอย่างมาก\n\n[relation.Custom('GetFamilyFeudShortFlavor')|U] นั้นไม่ยุติธรรม บางทีความบาดหมางนี้อาจสร้างปัญหามากกว่าที่มันควรจะเป็น..."
 bp1_house_feud.0100.a:0 "แม้ แต่ [house_feud_rival.GetTitleAsNameNoTooltip] ก็ต้องเผชิญหน้ากับความยุติธรรม"
 bp1_house_feud.0100.b:0 "เรื่องนี้ดำเนินมานานพอแล้ว..."
 bp1_house_feud.0110.t:0 "$story_cycle_house_feud_title$: ศัตรูที่ด้อยกว่า"
 bp1_house_feud.0110.desc:0 "ความชั่วร้ายของ [house_feud_rival.GetTitledFirstName] และทั้งตระกูล [house_feud_rival.GetHouse.GetBaseName] นั้นปราศจากข้อสงสัย แต่เป็นการสมควรแล้วหรือที่ครอบครัวของ [ROOT.Char.GetTitleAsNameNoTooltip] จะไปทะเลาะเบาะแว้งกับครอบครัวของ [house_feud_rival.GetTitleAsNameNoTooltip]?\n\n[relation.Custom('GetFamilyFeudShortFlavor')] นั้นมิอาจให้อภัยได้ แต่เราควรลดเกียรติตนเองลงไปเสียเวลากับคน#EMP ชั้นต่ำ#! เช่นนั้นรึ?"
 bp1_house_feud.0110.a:0 "[house_feud_rival.GetTitleAsNameNoTooltip] หรือ [ROOT.Char.GetTitleAsNameNoTooltip] ความยุติธรรมต้องได้รับการชำระ"
 bp1_house_feud.0110.b:0 "ใช่ [house_feud_rival.GetSheHe] ต่ำต้อยเกินกว่าพลังงานของข้า..."
 bp1_house_feud.0200.t:0 "$story_cycle_house_feud_title$: มาตรการสิ้นหวัง"
 bp1_house_feud.0200.desc:0 "ความบาดหมางของเรากับตระกูล [house_feud_rival.GetHouse.GetBaseName] เป็นหายนะ เราเข้าใกล้การแก้แค้นไม่มากไปกว่าเดิม และความอุกอาจของพวกเขาก็ยังคงดำเนินต่อไป\n\nหากเราจะยุติการล้างแค้นนี้อย่างเหมาะสม บางทีอาจถึงเวลาที่จะต้องลงมือขั้นเด็ดขาด..."
 bp1_house_feud.0200.a:0 "ถึงเวลาของ [house_feud_rival.GetTitledFirstNamePossessiveNoTooltip] แล้ว"
 bp1_house_feud.0200.b:0 "วันเวลาของ [house_feud_target.GetTitledFirstNamePossessiveNoTooltip] ใกล้หมดลงแล้ว"
 bp1_house_feud.0200.c:0 "ข้ามีแผนอื่นสำหรับพวกเขา"
 bp1_house_feud.0200.d:0 "ไม่ นี่เป็นความผิดพลาด..."
 bp1_house_feud.0210.t:0 "$story_cycle_house_feud_title$: ค่าตอบแทนอันหนักหน่วง"
 bp1_house_feud.0210.desc:0 "การแก้แค้นยังห่างไกลจากการชำระต่อตระกูล [house_feud_rival.GetHouse.GetBaseName] นับตั้งแต่ความบาดหมางของเราเริ่มต้นขึ้น มีเพียงความอุกอาจเพิ่มเติมจาก [house_feud_rival.GetTitledFirstName] และฝูงอสรพิษของ [house_feud_rival.GetHerHis] เท่านั้น\n\nบางครั้งข้าสงสัยว่าเราประเมินศัตรูของเราต่ำไปหรือไม่ และมันจะไม่ดีกว่าหรือที่จะตัดขาดทุนก่อนที่จะสายเกินไป"
 bp1_house_feud.0210.recent:0 "[house_feud_recent_death.GetTitledFirstName] อาจคิด เช่นนั้น..."
 bp1_house_feud.0210.a:0 "ไม่ เราจะแสดงให้พวกเขาเห็น!"
 bp1_house_feud.0210.b:0 "พอแล้ว... พอแล้ว!"
 bp1_house_feud.0220.t:0 "$story_cycle_house_feud_title$: ขีดจำกัดของความอาฆาต"
 bp1_house_feud.0220.desc:0 "การเคลื่อนไหวอันชอบธรรมของเราต่อตระกูล [house_feud_rival.GetHouse.GetBaseName] มิได้ถูกมองข้ามไป; ค่อนข้างแน่ชัดว่าบัดนี้พวกมันเสียใจต่อ [relation.Custom('GetFamilyFeudShort')] แล้ว\n\nแม้ว่าเหล่าอมนุษย์ เช่นนั้นไม่สมควรได้รับความเมตตาหรือปรานี แต่บาดแผลดั้งเดิมได้รับการชดใช้แล้ว; การยืดเยื้อความขัดแย้งนี้ต่อไปอย่างไม่มีกำหนดอาจไม่เป็นประโยชน์สูงสุดต่อเรา"
 bp1_house_feud.0220.recent:0 "บางทีเลือดของ [house_feud_recent_kill.GetTitledFirstNamePossessive] ก็เพียงพอแล้ว..."
 bp1_house_feud.0220.a:0 "ไม่ เราเพิ่งเริ่มต้น"
 bp1_house_feud.0220.b:0 "มันจบแล้ว"
 bp1_house_feud.0300.t:0 "$story_cycle_house_feud_title$: การวิวาทอันน่าเบื่อหน่าย"
 bp1_house_feud.0300.desc:1 "ทุกคนในตระกูล [ROOT.Char.GetHouse.GetBaseNameNoTooltip] ต่างเคยได้ยินเรื่องราวต้นกำเนิดความบาดหมางของเรากับตระกูล [house_feud_rival.GetHouse.GetBaseNameNoTooltip]; ว่า [relation.Custom('GetFamilyFeudLongFlavor')]\n\nเรื่องเล่านี้ชักจะเก่าแก่เกินไปแล้ว เราสมควรที่จะสานต่อการอาฆาตแค้นนี้ไปตลอดกาล เพียง เพราะ [relation.Custom('GetFamilyFeudShort')] ที่เกิดขึ้นเมื่อหลายปีก่อนจริง ๆ รึ?"
 bp1_house_feud.0300.a:0 "ตระกูล [ROOT.Char.GetHouse.GetBaseNameNoTooltip] ไม่ลืมศัตรู"
 bp1_house_feud.0300.b:0 "เรื่องนี้ดำเนินมานานเกินไปแล้ว"
 bp1_house_feud.0410.t:0 "$story_cycle_house_feud_title$: ถูกคุกคามรุมล้อม"
 bp1_house_feud.0410.desc:1 ""ได้โปรด!" [house_feud_victim.GetTitledFirstName] ร้องครวญคราง "ความแค้นอันบ้าคลั่งนี้ต้องหยุดลง! ข้ากลัวที่จะไป #EMP ที่ไหนก็ตาม#! และข้าสะดุ้งเพียงแค่ได้ยินชื่อ [house_feud_rival.GetHouse.GetBaseName]!"\n\n[ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('house_feud_victim'))] ของข้าสั่นเทาอย่างเห็นได้ชัด... ข้าลังเลระหว่างความเสี่ยงที่เกิดขึ้นกับครอบครัวข้าและความจำเป็นที่จะต้องสั่งสอน [house_feud_rival.GetTitledFirstName] "
 bp1_house_feud.0410.a:0 "เจ้าพูดถูก... ถึงเวลาที่เรื่องนี้จะจบลงแล้ว"
 bp1_house_feud.0410.b:0 "ไม่ เราต้องทำสิ่งที่เราเริ่มต้นให้สำเร็จ"
 bp1_house_feud.0420.t:1 "$story_cycle_house_feud_title$: คำร้องขอของ [house_feud_liege.GetTitleAsNamePossessiveNoTooltip]"
 bp1_house_feud.0420.desc:0 "เป็นที่ชัดเจนแก่ข้าแล้วว่าเจ้าเหนือหัวของข้า, [house_feud_liege.GetTitledFirstName], ไม่เห็นด้วยกับข้อพิพาทของครอบครัวข้ากับ [house_feud_rival.GetTitledFirstName] และตระกูล [house_feud_rival.GetHouse.GetBaseName], และปรารถนาให้ความแตกแยกของ [house_feud_liege.GetPrimaryTitle.GetAdjectiveNoTooltip] เหล่านี้ได้รับการแก้ไข\n\n[house_feud_liege.GetSheHe] เป็นใครถึงมาเรียกร้องไม่ให้ความยุติธรรมได้รับการชำระ? แต่กระนั้น บางทีอาจไม่ฉลาดที่จะกระตุ้นความตึงเครียดเพิ่มเติม โดยเฉพาะกับ [house_feud_liege.GetTitleAsNameNoTooltip]..."
 bp1_house_feud.0420.a:0 "ข้าจะไม่มีวันให้อภัย [house_feud_rival.GetTitledFirstNameNoTooltip]"
 bp1_house_feud.0420.b:0 "ก็ได้..."
 ### Target Events ###
 bp1_house_feud.0500.t:0 "$story_cycle_house_feud_title$: เป้าหมายแห่งความโกรธแค้น"
 bp1_house_feud.0500.desc:0 "แม้คราแรกข้าจะสงสัย แต่บัดนี้ข้าเริ่มมั่นใจแล้ว เมื่อได้ยินเสียงซุบซิบนินทาใน [ROOT.Char.Custom('GetCourt')] ว่า [house_feud_rival.GetTitledFirstName] ต้องการศีรษะข้า ทั้งหมดเพียง เพราะ [relation.Custom('GetFamilyFeudShort')]\n\nทุกคนในตระกูล [ROOT.Char.GetHouse.GetName] ล้วนเป็นเป้าหมายของ [house_feud_rival.GetHerHim] เพียง เพราะความเกี่ยวข้องกับข้า และความเกลียดชังนี้ได้แทรกซึมจากผู้นำ ลงไปทั่วทั้งครอบครัว [house_feud_rival.Custom2('InsultAdjective', ROOT.Char)] [house_feud_rival.GetHerHis] แล้ว"
 bp1_house_feud.0500.a:0 "ตระกูล [house_feud_rival.GetFirstNameNoTooltip] จะต้องเสียใจ"
 bp1_house_feud.0500.b:0 "ข้ามีเรื่องกังวลที่ใหญ่กว่านี้"
 bp1_house_feud.0501.t:1 "$story_cycle_house_feud_title$: ความเป็นอริของ [house_feud_attacker.GetHouse.GetBaseNameNoTooltip]"
 bp1_house_feud.0501.reciprocating:1 "[house_feud_attacker.GetFirstName] ผู้ [house_feud_attacker.Custom2('InsultAdjective', ROOT.Char)] ได้ตอบโต้ความเป็นศัตรูอย่างเปิดเผยของครอบครัวเราด้วยความเป็นศัตรู [house_feud_attacker.GetHerHis] เอง ช่างเป็นการตอบสนองที่น่าสมเพชและใส่ร้ายป้ายสีต่อความคับข้องใจอันชอบธรรมของเรา"
 bp1_house_feud.0501.new:1 "ข้าได้ยินมาว่า [house_feud_attacker.GetTitledFirstName] [house_feud_attacker.Custom2('InsultNoun', ROOT.Char)] ผู้น่ารังเกียจ ได้สาบานว่าตระกูล [ROOT.Char.GetHouse.GetBaseName] จะเป็นศัตรูตลอดกาลของครอบครัว [house_feud_attacker.GetHerHis]"
 bp1_house_feud.0501.desc:0 "\n\nฮ่า ไม่น่าเชื่อว่า [relation.Custom('GetFamilyFeudShortFlavor')] จะ ทำให้พวก [house_feud_attacker.GetDynastyHouseName] เดือดดาลได้จริง ๆ!"
 bp1_house_feud.0501.a:0 "โอ้ ความรู้สึกนี้มัน #EMP ตรงกัน#!!"
 bp1_house_feud.0501.b:0 "ดูเหมือนว่าเราจะมีศัตรูใหม่"
 bp1_house_feud.0501.c:0 "ช่างไร้สาระสิ้นดี"
 bp1_house_feud.0501.c.busy:0 "ความสนใจของเราต้องอยู่ที่ตระกูล [house_feud_existing.GetBaseNameNoTooltip]"
 bp1_house_feud.0501.c.existing:0 "โง่เขลา โง่เขลามาก"
 bp1_house_feud.0502.t:0 "$story_cycle_house_feud_title$: ความตึงเครียดคลี่คลาย"
 bp1_house_feud.0502.desc:1 "การผ่อนคลายความตึงเครียด หากเป็นไปได้ ระหว่างตัวข้ากับ [house_feud_attacker.GetTitledFirstName] ดูเหมือนจะยืนยันว่า [house_feud_attacker.GetSheHe] ได้ละทิ้งความอาฆาตแค้นของ [house_feud_attacker.GetHerHis] ต่อตระกูล [ROOT.Char.GetHouse.GetBaseNameNoTooltip] แล้ว"
 bp1_house_feud.0502.another:1 "\n\nข้าได้รับแจ้งว่าบัดนี้ [house_feud_attacker.GetSheHe] ถูกครอบงำด้วยความเกลียดชังของ [house_feud_attacker.GetHerHis] ที่มีต่อ [house_feud_new.GetHeadOfHouse.GetTitledFirstName] และตระกูล [house_feud_new.GetBaseName]"
 bp1_house_feud.0502.peace:1 "\n\nยากที่จะเชื่อ แต่ข้าคงจะดีใจที่ได้ปลดเปลื้องความกังวลเกี่ยวกับภัยคุกคามจาก [house_feud_attacker.GetHouse.GetBaseNameNoTooltip]"
 bp1_house_feud.0502.a:0 "น้อยเกินไป สายเกินไป"
 bp1_house_feud.0502.b:0 "บางที #EMP ก็#! ถึงเวลาที่จะยุติเรื่องนี้แล้ว"
 bp1_house_feud.0502.c:0 "ถ้า เช่นนั้น การป้องกันของพวกเขาก็ลดลง!"
 bp1_house_feud.0502.d:0 "ทำไมข้าต้องเสียเวลากับเรื่องไร้สาระนี้ด้วย?"
 ### Notification Events ###
 bp1_house_feud.0600.t:0 "$story_cycle_house_feud_title$: ศัตรูร่วมกัน"
 bp1_house_feud.0600.desc:1 "ข้ากำลังครุ่นคิดถึงจดหมายถ้อยคำรุนแรงที่ได้รับจาก [ROOT.Char.Custom2('RelationToMeShort', house_head_scope)] ของข้า [house_head_scope.GetTitledFirstName] เมื่อเช้านี้\n\n[ROOT.Char.GetHouse.GetHeadOfHouse.GetSheHe|U] ได้แสดงความปรารถนาอันแรงกล้า [ROOT.Char.GetHouse.GetHeadOfHouse.GetHerHis] ว่าตระกูลเราทั้งมวลต้องประกาศตนเป็นศัตรูกับ 'พวกสุนัข [house_feud_rival.GetHouse.GetBaseName]'\n\nข้ามิอาจปกป้อง [relation.Custom('GetFamilyFeudShortFlavor')] ได้ - แต่ความเสี่ยงต่อครอบครัวของเราเล่าจะเป็น เช่นใด?"
 bp1_house_feud.0600.a:0 "ข้าไม่อาจปฏิเสธ [ROOT.Char.GetHouse.GetHeadOfHouse.GetFirstNameNoTooltip] ได้"
 bp1_house_feud.0600.b:0 "ถึงเวลาแล้ว!"
 bp1_house_feud.0600.c:0 "นี่จะไม่นำพาเราไปไหนเลย..."
 ### Scheme Events ###
 bp1_house_feud.0700.t:0 "$story_cycle_house_feud_title$: ผลไม้ต้องห้าม"
 bp1_house_feud.0700.desc:0 "ความสงสัยของข้าได้รับการยืนยันแล้ว [owner.GetTitledFirstName] ชาว [owner.GetHouse.GetBaseName] ที่น่ารังเกียจ แสวงหาความรักจากข้า...\n\n"
 bp1_house_feud.0700.desc_positive:0 "ข้าถูกบอกเสมอให้ระวังศัตรูของครอบครัวเรา แต่ข้าปฏิเสธไม่ได้ว่ามีความ... #EMp ตื่นเต้น#! บางอย่าง"
 bp1_house_feud.0700.desc_neutral:0 "บางที หากไม่ใช่ เพราะข้อพิพาทของครอบครัวเรา ข้าอาจพิจารณาการเกี้ยวพาราสีของ [owner.GetTitledFirstNamePossessive]"
 bp1_house_feud.0700.desc_negative:0 "ช่างเป็น [owner.GetWomanMan] ที่น่าขัน - [owner.GetSheHe] คิดว่าข้า พวกเรา เป็นคนโง่หรือ?"
 bp1_house_feud.0700.a:0 "ไปให้พ้น เจ้า [house_feud_rival.Custom2('InsultNoun', ROOT.Char)] แห่งตระกูล [house_feud_rival.GetHouse.GetBaseNameNoTooltip]!"
 bp1_house_feud.0700.b:0 "กุหลาบแม้เรียกชื่ออื่นก็ยังหอมหวาน"
 bp1_house_feud.0701.t:0 "เหยื่อผู้ระแวดระวัง"
 bp1_house_feud.0701.desc:0 ""สิ่งที่พวกเขาพูดเกี่ยวกับสติของชาว [owner.GetHouse.GetBaseName] ต้องเป็นความจริง หากเจ้าคิดว่าข้าจะฝันถึงการเกี้ยวพาราสีเจ้า ลองใช้ความพยายามหลอกลวงอันน่าขันของเจ้ากับคนอื่นเถิด"\n\n[target.GetFirstName] [target.Custom('quirk_neg_present')] ขณะที่ [target.GetSheHe] สาดคำดูถูกใส่ข้าอย่างโหดเหี้ยม"
 bp1_house_feud.0701.a:0 "ข้าคิดว่าเจ้า... ช่างเถอะ..."
 # Maintenance Events
 bp1_house_feud.0810.t:0 "$story_cycle_house_feud_title$: ถือคบเพลิงต่อไป"
 bp1_house_feud.0810.child:0 "ข้าได้ยินเรื่องราวมากมายเกี่ยวกับ [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('old_house_head'))] ของข้า, [old_house_head.GetTitledFirstName], และการทะเลาะวิวาทของ [old_house_head.GetHerHis] กับตระกูล [house_feud_rival.GetHouse.GetBaseName]"
 bp1_house_feud.0810.adult:0 "ด้วยการจากไปของ [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('old_house_head'))] ของข้า, [old_house_head.GetTitledFirstName], ตอนนี้ข้าพบว่าตัวเองกำลังตั้งคำถามกับข้อพิพาทของครอบครัวเรากับตระกูล [house_feud_rival.GetHouse.GetBaseName]"
 bp1_house_feud.0810.desc:0 "\n\n[relation.Custom('GetFamilyFeudShortFlavor')] อาจเรียกร้องการตอบโต้ แต่การสานต่อเรื่องนี้จะเป็นประโยชน์ต่อเราหรือไม่?\n\nตระกูล [ROOT.Char.GetHouse.GetBaseName] มองมาที่ข้าเพื่อความเป็นผู้นำ เพื่อรับประกันความอยู่รอดและเกียรติยศ แต่บางทีการไล่ล่าล้างแค้นนี้อาจ ทำให้เลือดตกยางออกมากเพียงพอแล้ว..."
 bp1_house_feud.0810.a:0 "ไม่ นั่นคือสิ่งที่ไอ้คางคก [house_feud_rival.GetHouse.GetBaseNameNoTooltip] ต้องการ!"
 bp1_house_feud.0810.b:0 "ใช่ ข้ามีเรื่องสำคัญกว่าที่ต้องกังวล"
 bp1_house_feud.0810.b.rival:0 "[house_feud_rival.GetFirstNameNoTooltip] เป็นไอ้เลว แต่ความบ้าคลั่งนี้ต้องจบลง"
 bp1_house_feud.0830.t:0 "$story_cycle_house_feud_title$: ความรู้สึกอันหอมหวานที่สุด"
 bp1_house_feud.0830.opening_drink:0 "ในที่สุดข้าก็สามารถเพลิดเพลินกับ [ROOT.Char.Custom('RegionalAlcoholicDrink')] สักถ้วย,"
 bp1_house_feud.0830.opening:0 "ในที่สุดข้าก็พักผ่อนได้อย่างสบายใจ,"
 bp1_house_feud.0830.desc:1 "ปลอดภัยโดยล่วงรู้ว่าตระกูล [first_rival.GetHouse.GetBaseName] ที่ถูกสาปแช่งได้ถูกลบล้างไปจากโลกแล้ว เป็นการยุติการล้างแค้นที่พวกมันยั่วยุอย่างโง่เขลาด้วย [relation.Custom('GetFamilyFeudShortFlavor')] เสียที"
 bp1_house_feud.0830.first_owner:0 "\n\nข้าได้รับชัยชนะ และไอ้โง่นั่น [first_rival.GetTitledFirstName] ในที่สุดก็อยู่ใน [ROOT.Char.GetFaith.NegativeAfterLife]!"
 bp1_house_feud.0830.fallback:0 "\n\nแม้ว่า [first_owner.GetTitledFirstName] จะไม่ได้มีชีวิตอยู่เพื่อเห็นวันนี้ ข้าหวังว่า [first_owner.GetSheHe] จะพอใจใน [ROOT.Char.GetFaith.PositiveAfterLife] ได้แล้ว"
 bp1_house_feud.0830.losing:0 "\n\nแม้ว่าพวกเขาจะสร้างความเสียหายอย่างใหญ่หลวงต่อครอบครัวของเราในปีต่อๆ มา แต่ก็ไม่มีความพึงพอใจหรือความโล่งใจใดยิ่งใหญ่ไปกว่าการรู้ว่าธงของพวกเขาจะไม่มีวันโบกสะบัดอีกต่อไป"
 bp1_house_feud.0830.winning:0 "\n\nเราทำลายล้างจำนวนของพวกเขาอย่างสิ้นเชิง ทำให้แน่ใจว่าไม่มีใครเสี่ยงที่จะข้ามเส้นกับครอบครัวของเราโดยไม่เตรียมพร้อมสำหรับราคาที่ต้องจ่ายอย่างหนัก"
 bp1_house_feud.0830.even:0 "\n\nทุกครั้งที่เราสร้างความสูญเสีย ก็มีการตอบโต้ แต่ตอนนี้เราได้ปิดหน้าสุดท้ายของเรื่องราวตระกูล [first_rival.GetHouse.GetBaseNameNoTooltip] แล้ว"
 bp1_house_feud.0830.a:0 "อย่าได้ข้ามเส้นตระกูล [ROOT.Char.GetHouse.GetBaseNameNoTooltip] เป็นอันขาด"
 bp1_house_feud.0840.t:0 "$story_cycle_house_feud_title$: ศัตรูคนต่อไป"
 bp1_house_feud.0840.desc:1 "ตระกูล [house_feud_rival.GetHouse.GetName] ที่น่ารังเกียจ ตอนนี้อยู่ในมือของ [house_feud_rival.GetFirstName] [house_feud_rival.GetTitleAsNameNoTooltip] ที่ชั่วร้ายไม่แพ้บรรพบุรุษของ [house_feud_rival.GetHerHis] อย่างแน่นอน"
 bp1_house_feud.0840.child:0 "ถึงกระนั้น [house_feud_rival.GetSheHe] ก็เป็นเพียง [house_feud_rival.Custom('GirlBoy')]..."
 bp1_house_feud.0840.closing:1 "\n\nทุกคนต่างรู้เรื่อง "[relation.Custom('GetFamilyFeudShortFlavor')]" แต่เรื่องของอนาคตเล่า?"
 bp1_house_feud.0840.a:0 "#EMP ไม่มีอะไร#! เปลี่ยนแปลง! ไอ้หมา [house_feud_rival.GetHouse.GetBaseNameNoTooltip] เหมือนกันหมด!"
 bp1_house_feud.0840.b:0 "เรื่องนี้ดำเนินมาไกลพอแล้ว"
 bp1_house_feud.0840.b.rival:0 "สาปแช่ง [house_feud_rival.GetFirstNameNoTooltip] แต่พอกันที"
 # Victory Events
 bp1_house_feud.7000.t:0 "$story_cycle_house_feud_title$: [ROOT.Char.GetTitleAsNameNoTooltip] โดยชอบธรรม"
 bp1_house_feud.7000.desc:1 "หลังผ่านความยากลำบากนานัปการ ในที่สุดเราก็ฉกฉวย [house_feud_title.GetNameNoTier] มาจากเงื้อมมือของ [previous_holder.GetTitledFirstName] และตระกูล [house_feud_rival.GetHouse.GetBaseName] ได้สำเร็จ!\n\nเมื่อความอยุติธรรมนี้ได้รับการแก้ไขแล้ว อาจเป็นการดีที่จะยุติข้อพิพาทเก่าแก่นี้เสีย มิฉะนั้นเหตุผลที่มันเริ่มต้นอาจสูญหายไปในการนองเลือด"
 bp1_house_feud.7000.a:0 "ตระกูล [house_feud_rival.GetHouse.GetBaseNameNoTooltip] ยังมีสิ่งที่ต้องชดใช้อีกมาก"
 bp1_house_feud.7000.b:0 "มันจบแล้ว เราชนะ"
 bp1_house_feud.7001.t:0 "$story_cycle_house_feud_title$: เลือดล้างเลือด"
 bp1_house_feud.7001.desc:0 "[house_feud_attacker.GetTitledFirstName] ฆาตกรชั่วช้าของ [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('house_feud_victim'))] ของข้า, [house_feud_victim.GetTitledFirstName], ในที่สุดก็ถูกกำจัดด้วยน้ำมือของเรา และเกียรติของครอบครัวเราจึงได้รับการฟื้นฟู\n\nเมื่อเป้าหมายของการล้างแค้นของตระกูล [ROOT.Char.GetHouse.GetBaseName] บรรลุผลแล้ว อาจเป็นการดีที่สุดที่จะทิ้ง... #EMP การวิวาท#! นี้ไว้เบื้องหลัง"
 bp1_house_feud.7001.a:0 "ข้ายังไม่จบกับ [house_feud_attacker.GetHouse.GetBaseNameNoTooltip]"
 bp1_house_feud.7001.b:0 "อย่า ทำให้โลกทั้งใบตาบอดเลย"
 bp1_house_feud.7002.t:0 "$story_cycle_house_feud_title$: ชะตากรรมที่เหมาะสม"
 bp1_house_feud.7002.opening:0 "[house_feud_attacker.GetTitledFirstName] ผู้ทรมาน [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('house_feud_victim'))] ของข้า, [house_feud_victim.GetTitledFirstName], อย่างไร้ความปรานี ได้ประสบชะตากรรมเดียวกันด้วยน้ำมือของเรา!"
 bp1_house_feud.7002.opening_self:0 "[house_feud_attacker.GetTitledFirstName] ผู้ทรมานข้าอย่างโหดเหี้ยม ได้ประสบชะตากรรมเดียวกันด้วยน้ำมือข้า!"
 bp1_house_feud.7002.desc:1 "\n\nบัดนี้เมื่อการล่วงละเมิดดั้งเดิมต่อตระกูล [ROOT.Char.GetHouse.GetBaseName] ได้รับการแก้แค้นแล้ว คำถามว่าเราจะทำสงครามกับตระกูล [house_feud_attacker.GetHouse.GetBaseName] นานเพียงใดก็ผุดขึ้น..."
 bp1_house_feud.7002.a:0 "ยังมีอะไรอีกมากที่ต้องทำ"
 bp1_house_feud.7002.b:0 "เราชนะแล้ว"
 bp1_house_feud.7003.t:0 "$story_cycle_house_feud_title$: การแก้แค้นอันมีพิษสง"
 bp1_house_feud.7003.opening:0 "[house_feud_attacker.GetTitledFirstName] ผู้ล่อลวง [house_feud_spouse.GetWifeHusband] ของ [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('house_feud_victim'))] ของข้า, [house_feud_victim.GetTitledFirstNamePossessive], [house_feud_spouse.GetTitledFirstName],"
 bp1_house_feud.7003.opening_self:0 "[house_feud_attacker.GetTitledFirstName] ผู้ล่อลวง [house_feud_spouse.GetWifeHusband] ของข้า, [house_feud_spouse.GetTitledFirstName],"
 bp1_house_feud.7003.desc:1 "ในที่สุดก็ประสบชะตากรรมเดียวกัน และด้วยน้ำมือของเรา!\n\nเมื่อความเสียหายนี้ได้รับการแก้ไขแล้ว การต่อสู้กับ [house_feud_rival.GetHouse.GetBaseNameNoTooltip] ดูเหมือนจะใกล้ถึงจุดสิ้นสุดตามธรรมชาติ"
 bp1_house_feud.7003.a:0 "นี่เป็นเพียงจุดเริ่มต้น!"
 bp1_house_feud.7003.b:0 "บทสรุปที่น่าพอใจ..."
