l_english: 
 bp1_yearly.4000.t:0 "ภาพสะท้อนแห่งครอบครัว"
 bp1_yearly.4000.desc:0 "ข้ายังจำวันที่ [family_memory.GetDescription] ได้ดี, [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('family_memory_participant'))] ผู้ [family_memory_participant.Custom('ComplimentAdjective')] ของข้า!\n\n"
 bp1_yearly.4000.desc.alive:0 "ความทรงจำ เช่นนี้ ทำให้ข้าสบายใจ ไม่ว่าจะเกิดอะไรขึ้น ข้ารู้ว่าครอบครัวของข้ายังอยู่เคียงข้าง และวงศ์ตระกูล [ROOT.Char.GetHouse.GetName] ยังคงแข็งแกร่ง"
 bp1_yearly.4000.desc.dead:0 "ข้าปรารถนาเหลือเกินให้ท่านยังอยู่ที่นี่ ยังมีเสียงหัวเราะอีกมากมายให้ได้ยิน ยังมีความขัดแย้งอีกมากมายให้คลี่คลาย ยังมีความทรงจำอีกมากมายให้สร้างสรรค์... วงศ์ตระกูล [ROOT.Char.GetHouse.GetName] อ่อนแอลง เพราะขาดท่านไป"
 bp1_yearly.4000.desc_end:0 "\n\n#EMP "[ROOT.Char.GetHouse.GetMotto]."#! ข้ากระซิบกับตนเอง"
 bp1_yearly.4000.a:0 "หากเพียงท่านอยู่ที่นี่เพื่อเอ่ยมันพร้อมกับข้า..."
 bp1_yearly.4000.b:0 "ข้าจะเก็บความคิดนี้ไว้ในใจ!"
 bp1_yearly.4000.c:0 "ข้าจะให้เกียรติความทรงจำของท่านด้วยบทกวี!"
 bp1_yearly.4000.c.success:0 "ครอบครัวของท่านซาบซึ้งในความตั้งใจนี้"
 bp1_yearly.4000.c.failure:0 "ท่านร่ำไห้ด้วยความเศร้าโศก"
 bp1_yearly.4000.d:0 "[family_memory_participant.GetFirstNameNoTooltip] สมควรได้รับของขวัญสำหรับความภักดีของ[family_memory_participant.GetHerHis]!"
 bp1_yearly.4000.family_first:0 "ขอให้วงศ์ตระกูล [ROOT.Char.GetHouse.GetNameNoTooltip] ยืนยงตลอดไป!"
 bp1_yearly.4001.desc:0 "เมื่อผู้ใกล้ชิดที่สุดของข้ามารวมตัวกัน ข้าจึงเริ่มขับขาน:\n\n#POE [ROOT.Char.Custom('GeneratePoem_Title')]#!\n[ROOT.Char.Custom('GeneratePoem_Intro_Rhyming')]\n[ROOT.Char.Custom('GeneratePoem_Outro_Rhyming')]\n\n"
 bp1_yearly.4001.desc.success_poem:0 "น้ำตาไหลอาบแก้มของผู้ที่มารวมตัวกัน ข้าคิดว่าข้าได้รำลึกถึงท่านอย่างสมเกียรติแล้ว, [family_memory_participant.GetFirstNameNoTooltip]"
 bp1_yearly.4001.desc.fail_poem:0 "...มันไม่ค่อยดีเท่าไหร่เลย ใช่หรือไม่?"
 bp1_yearly.4001.a:0 "ขอให้ท่านไปสู่สุคติ"
 bp1_yearly.4001.b:0 "ข้าได้ ทำให้ความทรงจำของท่านมัวหมองเสียแล้ว!"
 bp1_yearly.4010.t:0 "ผู้ปกครองที่ดีกว่า"
 bp1_yearly.4010.desc:0 "\"ที่รัก [ROOT.Char.GetWifeHusband] ของข้า ข้าเป็นห่วงเรื่องการศึกษาของ [child_to_change_guardian.Custom('GetDaughterSon')] [child_to_change_guardian.GetFirstNamePossessive] ของเรา\" [parent_that_want_guardian_change.GetWifeHusband] ของข้า [parent_that_want_guardian_change.GetFirstName] กล่าว ด้วยน้ำเสียงกังวลใน [parent_that_want_guardian_change.GetHerHis]\n\n"
 bp1_yearly.4010.desc.root:0 ""ความจริงคือ... ท่าน #EMP ยุ่งเกินไป#! ที่จะเลี้ยงดู [child_to_change_guardian.GetHerHim] "
 bp1_yearly.4010.desc.other:0 ""[current_guardian.GetFirstName] [current_guardian.Custom2('InsultNoun', SCOPE.sC('parent_that_want_guardian_change'))] นั่นไม่ใช่ผู้พิทักษ์ที่ดี [current_guardian.GetSheHe|U] ช่าง... #EMP [current_guardian.Custom2('InsultAdjective', SCOPE.sC('parent_that_want_guardian_change'))]!#! เกินไป ""
 bp1_yearly.4010.desc_end:0 "[child_to_change_guardian.Custom('GetDaughterSon')] ของเราต้องการผู้ปกครองที่ดีและทุ่มเท ใครสักคนอย่าง [proposed_guardian.GetFirstName] [child_to_change_guardian.Custom2('RelationToMeShort', SCOPE.sC('proposed_guardian'))] ผู้ [proposed_guardian.Custom('ComplimentAdjective')] ของข้า!" [parent_that_want_guardian_change.GetSheHe|U] กล่าวต่อ\n\n"ให้ข้าจัดการเรื่องนี้เลยหรือไม่?" [parent_that_want_guardian_change.GetSheHe|U] กล่าว พลางมองข้าอย่างมีความหวัง"
 bp1_yearly.4010.a:0 "แน่นอน ที่รัก [proposed_guardian.GetFirstNameNoTooltip] เป็นตัวเลือกที่ดีกว่า"
 bp1_yearly.4010.a_effect:0 "[education|E] ของ [child_to_change_guardian.GetFirstNamePossessive] ก้าวหน้าขึ้น"
 bp1_yearly.4010.b:0 "ข้าเลือก [current_guardian.GetFirstNameNoTooltip] ด้วยเหตุผลนะ, [parent_that_want_guardian_change.GetWomanMan]!"
 bp1_yearly.4010.b_alt:0 "ชิ! ข้ามีเวลาพอที่จะเลี้ยงดู [child_to_change_guardian.GetHerHim]!"
 bp1_yearly.4010.c:0 "ตัวเลือกของข้านั้นดีกว่า เชื่อข้าสิ!"
 bp1_yearly.4010.c_effect:0 "[education|E] ของ [child_to_change_guardian.GetFirstNamePossessive] ก้าวหน้าอย่างมาก"
 bp1_yearly.4020.t:0 "มิตรภาพแห่งบทกวี"
 bp1_yearly.4020.desc:1 "\"[ROOT.Char.GetFirstNameNoTooltip] สหายรักของข้า ข้าเพิ่งนึกถึงชัยชนะของท่านที่มีต่อ [war_memory_participant.GetTitledFirstName] อีกครั้ง — ดังนั้นข้าจึงตัดสินใจ แต่งบทกวีเกี่ยวกับชัยชนะของท่าน!\" [poetry_friend.GetFirstName] กล่าว พลางกระแอมในลำคอของ [poetry_friend.GetHerHis]:\n\n[poetry_artifact.GetName]\n[poetry_artifact.GetDesc]"
 bp1_yearly.4020.a:0 "ข้าจะให้ขับขานบทกวีนี้แก่ [ROOT.Char.Custom('GetCourt')]!"
 bp1_yearly.4020.b:0 "ขอบคุณ สหายข้า ข้าจะเก็บรักษากวีบทนี้ไว้ใกล้ตัว"
 bp1_yearly.4020.c:0 "ฮ่า! ข้าจะส่งสำเนาไปให้ทุกคนที่ [war_memory_participant.GetFirstNameNoTooltip] รู้จัก!"
 bp1_yearly.4020.d:0 "นี่มันมากเกินไป มีเพียง [ROOT.Char.GetFaith.HighGodName] เท่านั้นที่สมควรได้รับการสรรเสริญ เช่นนี้"
 bp1_yearly.4020.poetry:0 "[poetry_friend.Custom('GeneratePoem_Intro_Rhyming')]\n[poetry_friend.Custom('GeneratePoem_Outro_Rhyming')]"
 bp1_yearly.4020.poetry_title:0 "[poetry_friend.Custom('GeneratePoem_Title')]"
 artifact_poetry_name:0 "$bp1_yearly.4020.poetry_title$"
 artifact_poetry_description:1 "ผลงานกวีนิพนธ์อุทิศแด่ชัยชนะ [ROOT.Char.GetTitledFirstNamePossessive] เหนือ [war_memory_participant.GetTitledFirstName] ผู้ [war_memory_participant.Custom2('InsultAdjective', ROOT.Char)] ประพันธ์โดยสหายรัก [ROOT.Char.GetFirstNamePossessiveNoTooltip] [poetry_friend.GetTitledFirstName]\n\n$bp1_yearly.4020.poetry$"
 poetry_artifact_appended_desc:0 "ผลงานกวีนิพนธ์อุทิศแด่ชัยชนะ [ROOT.Char.GetTitledFirstNamePossessive] เหนือ [war_memory_participant.GetTitledFirstName] ผู้ [war_memory_participant.Custom2('InsultAdjective', ROOT.Char)] ประพันธ์โดยสหายรัก [ROOT.Char.GetFirstNamePossessiveNoTooltip] [poetry_friend.GetTitledFirstName]\n\nมีเนื้อความดังนี้:\n$artifact_poetry_description$"
 bp1_yearly.4020.a_effect:0 "[newly_created_artifact.GetName] ถูกสร้างเป็น [court_artifact|E] และจะได้รับค่าปรับปรุง [grandeur|E]"
 bp1_yearly.4020.b_effect:0 "ท่านได้รับ [artifact|E] [newly_created_artifact.GetName]"
 bp1_yearly.4030.t:0 "คู่แข่งผู้ยั่วยวน"
 bp1_yearly.4030.desc:0 ""[ROOT.Char.Custom('CulturalCurse')|U]!" ข้าตะโกนลั่นขณะอ่านจดหมาย\n\n[ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('marriage_rival'))] [marriage_rival.Custom2('InsultAdjective', ROOT.Char)] ของข้า [marriage_rival.GetFirstName] — ข้าขอถ่มน้ำลายรดนามของเจ้า!"
 bp1_yearly.4030.desc_bond_broken:0 "\n\nเจ้าไม่เพียง แต่ใช้เล่ห์เหลี่ยมและเสน่ห์เพื่อโน้มน้าวให้ [marriage_vassal.GetTitledFirstName] ข้าในบังคับของข้า แต่งงานกับเจ้าและทำลายพันธะของ [marriage_vassal.GetHerHis] กับ [spurned_partner.GetFirstName] — ไม่เลย — เจ้ายัง ทำให้ [marriage_vassal.GetTitledFirstNameNoTooltip] ต่อต้านข้าอีกด้วย!"
 bp1_yearly.4030.desc_no_broken_bonds:0 "\n\nเจ้าไม่เพียง แต่ใช้เล่ห์เหลี่ยมและเสน่ห์เพื่อโน้มน้าวให้ [marriage_vassal.GetTitledFirstName] ข้าในบังคับของข้า แต่งงานกับเจ้า — ไม่เลย — เจ้ายัง ทำให้ [marriage_vassal.GetTitledFirstNameNoTooltip] ต่อต้านข้าอีกด้วย!"
 bp1_yearly.4030.desc_end:0 "\n\nลิ้นพิษของเจ้ากำลังแพร่กระจายคำโกหกเกี่ยวกับข้าครั้งแล้วครั้งเล่า... เจ้าไม่ได้รัก [marriage_vassal.GetFirstNameNoTooltip] เจ้าเพียงแค่ต้องการให้ข้า #EMP ทุกข์ทรมาน!#!"
 bp1_yearly.4030.a:0 "ข้าต้องโน้มน้าว [marriage_vassal.GetFirstNameNoTooltip] ให้เห็นว่า [marriage_rival.GetFirstNameNoTooltip] ทรยศเพียงใด!"
 bp1_yearly.4030.b:0 "[marriage_vassal.GetSheHe|U] ทำลายพันธะของ [marriage_vassal.GetHerHis] รึ? เหล่า [ROOT.Char.GetFaith.PriestNeuterPlural] จะสาปแช่ง [marriage_vassal.GetHerHim] สำหรับเรื่องนั้น!"
 bp1_yearly.4030.c:0 "บางที [spurned_partner.GetFirstNameNoTooltip] อาจมีประโยชน์..."
 bp1_yearly.4030.d:0 "ชิ! [marriage_rival.Custom2('InsultNoun', ROOT.Char)] นั่นมิได้ทำสิ่งใดสำเร็จเลย!"
 distrustful:0 "ไม่ไว้วางใจ"
 bp1_yearly.4030.a.success:0 "[marriage_vassal.GetTitledFirstName] เชื่อและสำนึกผิด"
 bp1_yearly.4030.a.failure:0 "[marriage_vassal.GetTitledFirstName] คิดว่าท่านกำลังโกหกเพิ่มอีก"
 bp1_yearly.4030.b.success:0 "[marriage_vassal.GetTitledFirstName] เห็นความผิดพลาดในวิถีทางของ [marriage_vassal.GetHerHis]"
 bp1_yearly.4030.b.failure:0 "[marriage_vassal.GetTitledFirstName] ปัดป้องข้อโต้แย้งของเหล่า [ROOT.Char.GetFaith.PriestNeuterPlural]"
 bp1_yearly.4040.t:0 "[ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('kindly_grandmother'))|U] ผู้ใจดีของข้า"
 bp1_yearly.4040.desc.intro.1:0 ""โอ้ [ROOT.Char.GetFirstNameNoTooltip] ที่รักยิ่งของข้า — ข้ารักเจ้าเหลือเกิน!" [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('kindly_grandmother'))] ของข้า [kindly_grandmother.GetFirstName] กล่าวกับข้า พลางถือจานขนมแสนอร่อยมาให้ "ข้าทำ [ROOT.Char.Custom('FavoriteTreatDemand')] มาให้เจ้า ข้ารู้ว่ามันเป็นของโปรดของเจ้า!"\n\nโอ้ [kindly_grandmother.GetSheHe] รู้ใจข้าดีเหลือเกิน! แน่นอนว่ามันต่ำกว่าฐานะของ [kindly_grandmother.GetHerHis] ที่จะทำของ เช่นนี้ด้วยมือ แต่... ข้าเป็นใครกันที่จะปฏิเสธ?"
 bp1_yearly.4040.desc.intro.2:0 ""[ROOT.Char.Custom('FavoriteTreatDemand')] เพิ่มเติมสำหรับ [ROOT.Char.Custom('GirlBoy')] ตัวโตของข้า!" [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('kindly_grandmother'))] ของข้า [kindly_grandmother.GetFirstName] ตะโกนมาจากในครัว "มาเร็ว กินซะ!"\n\nอืมมม กลิ่นหอมเหลือเกิน... อีกสักคำคงไม่เป็นไรกระมัง?"
 bp1_yearly.4040.desc.feeding.1:0 ""[ROOT.Char.GetFirstNameNoTooltip] การที่เจ้าเพลิดเพลินกับ [ROOT.Char.Custom('FavoriteTreatDemand')] ของข้า ทำให้ข้าเป็น [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('kindly_grandmother'))] ที่มีความสุขที่สุดในโลก!" [kindly_grandmother.GetFirstName] ตะโกนอย่างมีความสุขจากในครัว "วันนี้ข้าทำมา #EMP เยอะเป็นพิเศษ#! เลยนะ! กินให้หมดเลย!"\n\n#flatulence เอิ้ก..!#! โอ้ มันไม่เคยหยุดเลย... แต่ข้าปฏิเสธและทำร้ายจิตใจ [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('kindly_grandmother'))] ที่รักของข้าไม่ได้ ใช่หรือไม่?"
 bp1_yearly.4040.desc.feeding.2:0 ""อันนี้ข้าปั้นเป็นรูป [ROOT.Char.Custom('GetLivestockFowlIndef')]!" [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('kindly_grandmother'))] ของข้า [kindly_grandmother.GetFirstName] ร้องเพลง พลางถือจาน [ROOT.Char.Custom('FavoriteTreatDemand')] มาอีกจาน "ดูสิ มันกำลังบินเข้าปากเจ้าเลย!"\n\nโอ้ ท่าน [ROOT.Char.GetFaith.HighGodName] ที่เคารพ นี่มันมากเกินไปแล้ว! แต่... ความรู้สึกของ [kindly_grandmother.GetHerHis] ข้าต้องคำนึงถึงสิ..."
 bp1_yearly.4040.desc.feeding.3:0 ""[ROOT.Char.GetFirstNameNoTooltip] เจ้าอยู่ไหน? ข้าต้ม [ROOT.Char.Custom('FavoriteTreatDemand')] ชุดนี้ในเนยเลยนะ!" [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('kindly_grandmother'))|U] [kindly_grandmother.GetFirstName] กระซิบ สายตาของ [kindly_grandmother.GetHerHis] กวาดมองหาข้าในครัว\n\nนี่มันชักจะเกินไปกันใหญ่แล้ว... #EMP ข้าควรทำอย่างไรดี!?#!"
 bp1_yearly.4040.desc.feeding.4:0 ""ใครจะรู้ว่า [ROOT.Char.Custom('FavoriteTreatDemand')] เข้ากันได้ดีกับ [ROOT.Char.Custom('GetExpensiveMeal')] — #EMP [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('kindly_grandmother'))]#! คนโปรดของเจ้ารู้ไงล่ะ!" [kindly_grandmother.GetFirstName] ตะโกน พลางถือจานอาหารที่น่าขยะแขยงที่สุดเท่าที่ข้าเคยเห็นมาในชีวิต "อาหารเย็นพร้อมแล้ว [ROOT.Char.GetFirstNameNoTooltip]!"\n\nไม่ว่าข้าจะซ่อนตัวดีแค่ไหน [kindly_grandmother.GetSheHe] ก็หาข้าเจอเสมอ! โอ้ ร่างกายที่อ้วนฉุของข้า!"
 bp1_yearly.4040.a:0 "ข้าอยากกิน [ROOT.Char.Custom('FavoriteTreatDemand')] ของท่าน!"
 bp1_yearly.4040.b:0 "ไม่ล่ะ ขอบคุณ ข้าไม่เป็นไร"
 bp1_yearly.4040.c:0 "อีกสักคำคงไม่เป็นไร..."
 bp1_yearly.4040.d:0 "ข้าพอแล้ว"
 bp1_yearly.4040.e:0 "ข้าทำร้ายจิตใจ #EMP [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('kindly_grandmother'))|U]...#! ไม่ได้"
 bp1_yearly.4040.f:0 "ข้ากินอีกคำไม่ไหว #EMP จริงๆ#! แล้ว!"
 bp1_yearly.4040.desc.dead:0 "โอ้ [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('kindly_grandmother'))] ที่รักของข้า เมื่อท่านจากไป จาน [ROOT.Char.Custom('FavoriteTreatDemand')] ที่ไม่มีวันหมดก็จะหยุดลง แต่ความโล่งใจนี้ช่างเป็นความรู้สึกที่ขมขื่น — ข้าอยากให้ท่านอยู่เคียงข้างข้ามากกว่าจากไปตลอดกาล\n\nลาก่อน [kindly_grandmother.GetFirstName] ขอให้ท่านไปสู่สุคติ"
 bp1_yearly.4040.dead:0 "บางทีข้าควรกิน [ROOT.Char.Custom('FavoriteTreatDemand')] เพื่อเป็นเกียรติแก่ท่าน"
 bp1_yearly.4040.family_first:0 "โอ้ [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('kindly_grandmother'))] ข้าอยากจะแค่พูดคุยกับท่านสักครู่มากกว่า!"
 #XXX: "XXX"
 
