l_english: 

 bp1_yearly.5001.t:0 "ฝันร้ายยามค่ำคืน"
 bp1_yearly.5001.desc:0 "เหตุใดข้าจึงตื่นขึ้น? สมองที่ยังงัวเงียของข้าไล่ตรวจสอบรายการในใจ ค่ำคืนนี้หนาวเย็น แต่ไม่ถึงกับเยือกแข็ง เตียงของข้าอบอุ่นและสบาย และ-\n\nมีเงาตะคุ่มอยู่ที่ปลายเตียงของข้า เมื่อมันเข้ามาใกล้ มันก็รวมตัวเป็นร่างของ [sibling_murderer.GetFirstName] [ROOT.Char.Custom2('RelationToMeShort', sibling_murderer)] ของข้า ข้าอ้าปากจะชี้ว่าห้องของ [sibling_murderer.GetHerHis] อยู่ถัดไปจากห้องของข้า เมื่อข้าสังเกตเห็นหมอนในมือของ [sibling_murderer.GetHerHis]\n\nเป็น เพราะแสงจันทร์อันเจิดจ้าเท่านั้นที่ ทำให้ข้าเห็นแววตาอันบ้าคลั่ง วิปลาส และกระหายเลือดในดวงตาของ [sibling_murderer.GetHerHis]"
 bp1_yearly.5001.a:0 "ข้าจะ #bold ฆ่า #!เจ้าสำหรับการทรยศครั้งนี้!"
 bp1_yearly.5001.b:0 "ไม่! ข้าไม่ยอมให้เจ้าทำ!"
 bp1_yearly.5001.c:0 "ช่วยด้วย!"
 bp1_yearly.5001.win.tt:0 "การเผชิญหน้าของท่านมีผลลัพธ์ในเชิงบวก"
 bp1_yearly.5001.lose.tt:0 "การเผชิญหน้าของท่านไม่เป็นไปด้วยดี"
 bp1_yearly.5001.shout.tt:0 "ท่านตะโกนขอความช่วยเหลือ หวังว่าจะมีใครได้ยิน"
 bp1_yearly.5001.kill.tt:0 "ท่านจับ [sibling_murderer.GetHerHim] ไว้ในกำมือได้"
 bp1_yearly.5001.die.tt:0 "ท่านพ่ายแพ้ในการต่อสู้"

 bp1_yearly.5002.t:0 "$bp1_yearly.5001.t$: ความทะเยอทะยานที่ถูกปฏิเสธ"
 bp1_yearly.5002.desc:0 "[sibling_murderer.GetFirstName] พุ่งเข้าใส่ข้าทันทีที่ [sibling_murderer.GetSheHe] เห็นข้าขยับตัว แต่ความตื่นตัวฉับพลัน ทำให้ข้ามีเรี่ยวแรง [sibling_murderer.GetFirstNameNoTooltip] ถูกสกัดไว้กลางเตียง หมัดของข้ากระแทกเข้าที่กรามของ [sibling_murderer.GetHerHim] พอดี\n\n[sibling_murderer.GetSheHe|U] เซถอยหลังอย่างอ่อนแรง และการโจมตีที่ตามมาอย่างสับสนก็ไม่อาจหยุดข้าจากการกระโจนเข้าใส่และกด [sibling_murderer.GetHerHim] ลงกับพื้นได้ ข้านั่งคร่อมอยู่บนอกของ [sibling_murderer.GetHerHis] อย่างมั่นคง การโจมตีอย่างรุนแรง ทำให้จมูกของ [sibling_murderer.GetFirstNamePossessiveNoTooltip] แตกละเอียดและศีรษะของ [sibling_murderer.GetHerHis] กระแทกกับพื้นหิน ลดทอนการต่อต้านอันดุเดือดของ [sibling_murderer.GetHerHis] ให้เหลือเพียงเสียงครวญครางน่าสมเพช\n\nในท่านี้เองที่ [guard.GetFirstName] — ซึ่งโชคดีที่มาถึงอย่างรวดเร็ว — พบข้า [sibling_murderer.GetFirstNameNoTooltip] จ้องมองพื้นอย่างบึ้งตึงขณะที่ข้าอธิบายสิ่งที่เกิดขึ้น"
 bp1_yearly.5002.a:0 "[ROOT.Char.Custom2('RelationToMeShort', sibling_murderer)] ของข้าเอง ท่านทำ เช่นนี้ได้ #EMP อย่างไร #!?"

 bp1_yearly.5003.t:0 "$bp1_yearly.5001.t$: เรมุส"
 bp1_yearly.5003.desc:0 "ข้านอนอยู่ เปลือยครึ่งท่อน อยู่ตามลำพัง และไม่ทันระวังตัว [sibling_murderer.GetFirstNameNoTooltip] ขึ้นมาคร่อมข้าก่อนที่ข้าจะทันได้ประมวลผลความตกใจและการทรยศด้วยซ้ำ [sibling_murderer.GetSheHe] กดแขนข้างหนึ่งของข้าไว้ใต้ขาของ [sibling_murderer.GetHerHis] แล้วใช้หมอนกดใบหน้าข้าด้วยมือข้างที่ว่าง ส่วนมืออีกข้างคว้าข้อมือที่สะบัดไปมาของข้าแล้วเกี่ยวไว้กับเสาเตียง\n\nช่วงเวลาระหว่างเสียงดังกร๊อบอันน่าสะอิดสะเอียนเมื่อ [sibling_murderer.GetSheHe] หักแขนข้า กับความเจ็บปวดอันเจิดจ้าที่แผ่ซ่านขึ้นไปถึงไหล่ รู้สึกราวกับนานเป็นชั่วโมง ขณะที่ข้อมือของข้าห้อยต่อง แต่งอย่างไร้ประโยชน์ แขนท่อนล่างที่แตกหักตะเกียกตะกายขึ้นไปอย่างสิ้นหวัง [sibling_murderer.GetSheHe] ก็เลื่อนมือของ [sibling_murderer.GetHerHis] มาที่คอของข้า\n\n”บัลลังก์เป็นของ #EMP ข้า!#!” [sibling_murderer.GetSheHe] ขู่ฟ่อ เลือนหายไปจากสายตา"
 bp1_yearly.5003.a:0 "[sibling_murderer.GetFirstNameNoTooltip]! #DIE1 ม-ไม่…#! #DIE2 [ROOT.Char.Custom2('RelationToMeShort', sibling_murderer)]...#!"

 bp1_yearly.5004.t:0 "$bp1_yearly.5001.t$: [guard.GetWomanMan|U] มือขวา"
 bp1_yearly.5004.desc:0 "[sibling_murderer.GetFirstName] พุ่งไปข้างหน้า ข้ามพื้นที่ระหว่าง [sibling_murderer.GetHerHim] กับหัวเตียงของข้าในชั่วพริบตา แต่มันสายเกินไปแล้ว เสียงร้องขอความช่วยเหลือของข้าหลุดออกจากลำคอไปครึ่งหนึ่งแล้วในตอนที่ [sibling_murderer.GetSheHe] ขยับตัวด้วยซ้ำ และ แม้ว่าหมอนจะอุดเสียงนั้นไว้ เสียงฝีเท้าที่ใกล้เข้ามาอย่างรวดเร็วก็ดังขึ้นแล้ว"
 bp1_yearly.5004.guard.death:0 "\n\nประตูเปิดผางออก และที่นั่น โชคดีเหลือเกิน ยืนอยู่คือ [guard.GetFirstName] [guard.GetSheHe|U] อ้าปากค้างและหันไปตะโกน แต่ก็ต้องเงียบเสียงลงเมื่อ [sibling_murderer.Custom2('RelationToMeShort', ROOT.Char)] ของข้าขู่ชื่อของ [guard.GetHerHis] ข้าทำได้เพียงฟังด้วยความสยดสยองที่เพิ่มขึ้นเรื่อยๆ ขณะที่ [sibling_murderer.GetFirstNameNoTooltip] ต่อรองอย่างรวดเร็วเพื่อแลกกับความเงียบและความภักดีของ [guard.GetFirstNamePossessiveNoTooltip]\n\nคลื่นความตื่นตระหนกที่ถาโถมท่วมท้นเอ่อล้นขึ้นในอกของข้าเมื่อเสียงฝีเท้าขยับอีกครั้ง ตามด้วยเสียง #EMP คลิก#! สุดท้ายอันน่าสะพรึงกลัวของสลักประตู"
 bp1_yearly.5004.guard.save:0 "\n\nประตูเปิดผางออก และที่นั่น โชคดีเหลือเกิน ยืนอยู่คือ [guard.GetFirstName] [guard.GetSheHe|U] อ้าปากค้างและตะโกนกลับไปทางด้านหลัง [guard.GetHerHis] ผ่านประตูที่เปิดอยู่ ชั่วครู่ต่อมา ทหารยามสองนายก็บุกเข้ามา ยกตัวผู้ที่พยายามจะสังหารข้าขึ้นจากเท้าของ [sibling_murderer.GetHersHis] และพาออกไปจากข้า \n\nส่วน [sibling_murderer.GetHersHis] นั้น [sibling_murderer.GetFirstNameNoTooltip] จ้องมองพื้นอย่างบึ้งตึง ไม่สามารถหรือไม่เต็มใจแม้ แต่จะพยายามปฏิเสธการกระทำของ [sibling_murderer.GetHerHis]"
 bp1_yearly.5004.parent.save:0 "\n\nประตูเปิดผางออก และในกรอบประตูนั้นคือ [sibling_parent.GetFirstName] [ROOT.Char.Custom2('RelationToMeShort', sibling_parent)] ของข้า [sibling_parent.GetHerHim] ใช้เวลาเพียงชั่ววินาทีในการรับรู้สิ่งที่เกิดขึ้น และ [sibling_parent.GetSheHe] ก็คำรามขอความช่วยเหลือแม้ ในขณะที่ [sibling_parent.GetSheHe] เหวี่ยงร่าง [sibling_murderer.GetFirstNameNoTooltip] ออกจากข้าและลงไปกองกับพื้น\n\nขณะที่ [sibling_parent.GetSheHe] ประคองศีรษะข้าไว้ในอ้อมแขนของ [sibling_parent.GetHerHis] การหลบหนีของ [ROOT.Char.Custom2('RelationToMeShort', sibling_murderer)] ของข้าไปยังประตูก็ถูกขัดขวางโดยการมาถึงของ [guard.GetFirstName] ซึ่งจับ [sibling_murderer.GetHerHim] ขึ้นและโยน [sibling_murderer.GetHerHim] กลับเข้ามาในห้อง"
 bp1_yearly.5004.parent.death:0 "\n\nประตูเปิดผางออก และในกรอบประตูนั้นคือ [sibling_parent.GetFirstName] [ROOT.Char.Custom2('RelationToMeShort', sibling_parent)] ของข้า ความโล่งใจในตอนแรกของข้าค่อยๆ เปลี่ยนเป็นความหวาดกลัวอันเยือกเย็นและมืดมนเมื่อข้าเห็นรอยยิ้มมุมปากบนริมฝีปากของ [ROOT.Char.Custom2('RelationToMePossessive', sibling_parent)] และดวงตาที่หรี่ลงอย่างมุ่งร้าย ส่วนผสมนั้น ทำให้ข้าปั่นป่วนในท้อง\n\n[sibling_parent.GetSheHe|U] หันหลังกลับและลอยตัวออกไปในโถงทางเดินราวกับว่า [sibling_parent.GetSheHe] ไม่มีความกังวลใดๆ ในโลก ดึงสลักประตูปิดตามหลัง [sibling_parent.GetHerHim]\n\n#EMP “คลิก”#! "

 bp1_yearly.5005.t:0 "ฝันร้ายยามค่ำคืน: ความกระหายในอำนาจ"

 bp1_yearly.5006.t:0 "$bp1_yearly.5001.t$: ความรักของ [ROOT.Char.Custom2('RelationToMePossessive', sibling_parent)|U]"
 bp1_yearly.5006.a:0 "[ROOT.Char.Custom2('RelationToMeShort', sibling_parent)|U]! ท่านช่วยข้าไว้!"

 bp1_yearly.5007.t:0 "$bp1_yearly.5001.t$: แนวโน้มการฆ่าบุตร"
 bp1_yearly.5007.a:0 "#DIE1 [ROOT.Char.Custom2('RelationToMeShort', sibling_parent)|U]!#! #DIE2 ...ได้โปรด!#!"

 bp1_yearly.5008.t:0 "$bp1_yearly.5001.t$: โรมุลุส"
 bp1_yearly.5008.desc:0 "[sibling_murderer.GetFirstName] รวดเร็ว แต่เห็นได้ชัดในทันทีว่า [sibling_murderer.GetSheHe] ประเมินข้าต่ำเกินไปอย่างร้ายแรง [sibling_murderer.GetSheHe|U] กระโจนข้ามห้อง แต่ข้าลุกออกจากเตียงและเคลื่อนไหวแล้ว และแรงส่งของ [sibling_murderer.GetFirstNamePossessiveNoTooltip] ก็ทรยศ [sibling_murderer.GetHerHim] เมื่อ [sibling_murderer.GetSheHe] สะดุดแผ่นหินที่ไม่เรียบและล้มคะมำ\n\nข้าก้าวไปข้างหน้าหนึ่งก้าวและเท้าของข้าก็เตะ [sibling_murderer.GetHerHim] ที่กำลังตะเกียกตะกายลุกขึ้นคุกเข่า ทำให้กะโหลกศีรษะของ [sibling_murderer.GetHerHis] กระแทกกับผนังดังกร๊อบ การเหวี่ยงแขนอย่างสุ่มสี่สุ่มห้าที่ตามมาของ [ROOT.Char.Custom2('RelationToMeShort', sibling_murderer)] นั้นไร้ทิศทางและพลาดเป้า และข้าใช้โอกาสนี้เอื้อมไปหยิบของที่โต๊ะข้างเตียง\n\n[sibling_murderer.GetFirstNameNoTooltip] หันขวับมาพบกับมีดเล่มเล็ก แต่คมกริบจ่ออยู่ที่คอของ [sibling_murderer.GetHerHis] เป็นครั้งแรกที่ข้าเห็นความกลัวอย่างแท้จริงในดวงตาของ [sibling_murderer.GetHerHis]"
 bp1_yearly.5008.a:0 "พวกเขาจะไม่มีวันพบศพของเจ้า, [sibling_murderer.GetFirstNameNoTooltip]"
 bp1_yearly.5008.b:0 "อย่ามาขวางทางข้าอีก เข้าใจหรือไม่?"

 bp1_yearly.5601.t:0 "ชีวิตที่มีสีสัน"
 bp1_yearly.5601.start:1 "ช่างเป็นวันที่น่าปรีดานัก! สายลมช่างสดชื่น แสงแดดก็อบอุ่น เหล่าแมลงส่งเสียงร้องอย่างมีความสุขในพงหญ้า ทุกสิ่งดูสว่างไสวและมีชีวิตชีวา และทั้งหมดนี้ก็ เพราะว่า [bp1_yearly_5601_dead_nemesis.GetFirstName] เจ้า [bp1_yearly_5601_dead_nemesis.Custom2('InsultAdjective', ROOT.Char)] [bp1_yearly_5601_dead_nemesis.Custom2('InsultNoun', ROOT.Char)] นั่น ในที่สุดก็ตายไปเสียทีอย่างเป็นสุข!\n\nข้าไม่สามารถเก็บรอยยิ้มไว้ได้ ขณะที่ขบวนสหายและครอบครัวของ [bp1_yearly_5601_dead_nemesis.GetHerHis] เดินเรียงแถวผ่านข้าไป เพื่อกล่าวคำอำลาครั้งสุดท้าย"
 bp1_yearly.5601.bodysnatcher:1 "แม้ว่าตอนนี้ [bp1_yearly_5601_dead_nemesis.GetSheHe] จะไม่สามารถพูดอะไรเพื่อหยุดพวกเขาได้ แต่ข้าก็รู้สึกขุ่นเคืองเล็กน้อยเมื่อคิดว่าครอบครัวของ [bp1_yearly_5601_dead_nemesis.GetFirstNamePossessiveNoTooltip] กล้าพอที่จะปกป้องเกียรติของ [bp1_yearly_5601_dead_nemesis.GetHerHis] อย่างเงียบๆ\n\nขบวนแห่ผ่านข้าไป มุ่งหน้าไปฝังศพ"
 bp1_yearly.5601.notinsane:0 "สีหน้าบึ้งตึงที่ข้าได้รับตอบกลับจากผู้โศกเศร้ายิ่ง ทำให้รอยยิ้มของข้ากว้างขึ้น ข้าหันหลังกลับเพื่อจากไป และดวงตาของขอทานหนุ่มก็เบิกกว้างเท่ากับรอยยิ้มเยาะของข้าเมื่อข้าโยนเหรียญให้เขาอย่างร่าเริง ซึ่งมีมูลค่ามากพอที่ทั้งครอบครัวของเขาจะกินดีอยู่ดีไปหลายสัปดาห์"
 bp1_yearly.5601.a:0 "ข้าจะแสดงให้พวกเขาเห็น!"
 bp1_yearly.5601.a.tt:0 "ท่านรอจนถึงค่ำคืน จากนั้นจึงออกเดินทางพร้อมกับพลั่ว..."
 bp1_yearly.5601.b:0 "นี่คือวันที่ดีที่สุดในชีวิตข้า!"
 bp1_yearly.5601.c:0 "ถึงเวลาที่จะก้าวต่อไปแล้ว"

 bp1_yearly.5602.t:0 "ก้าวหน้าในชีวิต"
 bp1_yearly.5602.desc:0 "อากาศยามค่ำคืนนิ่งและเงียบสงัด เสียงเดียวที่ได้ยินคือเสียงขูดของพลั่วของข้า ตักดินที่เพิ่งถมใหม่ขึ้นมาอย่างง่ายดาย กองดินข้างหลุมศพค่อยๆ ใหญ่ขึ้น และร่างของ [bp1_yearly_5601_dead_nemesis.GetFirstName] ก็ถูกเปิดเผยสู่อากาศบริสุทธิ์อีกครั้งหลังจากที่เพิ่งจากไปไม่นาน\n\nข้ากระชากผ้าคลุมหน้าของ [bp1_yearly_5601_dead_nemesis.GetHerHis] ออก ริมฝีปากของ [bp1_yearly_5601_dead_nemesis.GetHerHis|U] เผยอออก แยกเป็นรอยยิ้มแสยะ ดินและสิ่งสกปรกยังคงเกาะติดคอของ [bp1_yearly_5601_dead_nemesis.GetHerHis] อย่างชื้นแฉะขณะที่ข้ามอง [bp1_yearly_5601_dead_nemesis.GetHerHim] อย่างไม่แยแส\n\nข้าจับพลั่วอีกครั้ง เล็งไปที่คอเดียวกันนั้น โลหะ ซึ่งข้าลับคมด้วยมือตัวเองเมื่อเช้านี้ คมกริบราวกับใบมีดร้ายกาจ กระทืบหนึ่งครั้ง สองครั้ง สามครั้ง..."
 bp1_yearly.5602.a:0 "ข้าจะ ทำให้เจ้ามีประโยชน์เสียที"
 bp1_yearly.5602.b:0 "[ROOT.Char.GetFaith.HighGodName] ได้วิญญาณของเจ้าไปแล้ว หมูจะได้หัวของเจ้าไป!"

 bp1_yearly.5701.t:0 "ออกมาเล่นกันไหม?"
 bp1_yearly.5701.desc:0 "ข้ามั่นใจว่าความสัมพันธ์ของ [married_friend.GetFirstNamePossessive] กับคู่สมรส [friend_spouse.GetFirstName] ของ [married_friend.GetHerHis] นั้นมีความสุขและราบรื่นดี แต่พักหลังมานี้ [married_friend.GetSheHe] มีเวลาน้อยลงเรื่อยๆ ที่จะใช้กับข้า ซึ่งเป็นสหายรัก ในขณะที่ความสัมพันธ์ของพวกเขาลึกซึ้งขึ้น ทุกครั้งที่ข้าพยายามชวน [married_friend.GetHerHim] ออกไปข้างนอก แม้เพียงแค่เดินเล่นง่ายๆ [married_friend.GetSheHe] ก็ดูเหมือนจะติดภาระหน้าที่ในชีวิตสมรส\n\nข้าคิดถึงวันเก่าๆ ที่เราเคย"
 bp1_yearly.5701.desc.ladsladslads:0 "ออกไปเตร็ดเตร่ ดื่ม [ROOT.Char.Custom('RegionalDrink')] ชั้นเลิศจนอาเจียน แล้วก็ทำซ้ำอีกในคืนถัดไป!"
 bp1_yearly.5701.desc.nodrinky:0 "มีค่ำคืนที่ยอดเยี่ยมด้วยการดูพวกขี้เมาในท้องถิ่นล้มลุกคลุกคลานและทำตัวเองขายหน้า!"
 bp1_yearly.5701.desc.ending:0 "\n\nช่างเป็นช่วงเวลาที่เราเคยมีร่วมกัน! หากเพียง แต่ [friend_spouse.GetFirstNameNoTooltip] ที่ [friend_spouse.Custom2('InsultAdjective', ROOT.Char)] อันแสนชั่วร้ายนั่น ไม่ได้ขัดขวางเราจากการมีช่วงเวลา เช่นนั้นอีก..."
 bp1_yearly.5701.a:0 "[friend_spouse.GetSheHe|U] จะไม่กีดกันเราอีกต่อไป!"
 bp1_yearly.5701.b:0 "บางทีข้าอาจ ทำให้พวกเขาเห็นความผิดพลาดในวิถีทางของพวกเขาได้..."
 bp1_yearly.5701.c:0 "ข้าคิดว่าเราทั้งคู่ต่างก็ก้าวต่อไปแล้วกระมัง?"
 bp1_yearly.5701.tt.critical_success:0 "ความสัมพันธ์แตกหักอย่างไม่อาจแก้ไขได้"
 bp1_yearly.5701.tt.success:0 "เกิดรอยร้าวขึ้นระหว่างพวกเขา"
 bp1_yearly.5701.tt.failure:0 "ไม่มีใครพอใจท่าน"
 bp1_yearly.5701.tt.critical_failure:0 "ท่านผลักดันมากเกินไป"

 bp1_yearly.5702.t:0 "การแสดงอันยอดเยี่ยม"
 bp1_yearly.5702.desc:0 "[skilful_friend.GetFirstName] [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('skilful_friend'))] ของข้าช่างมีความสามารถยิ่งนัก!\n\n"
 bp1_yearly.5702.diplomacy:0 "เมื่อ [skilful_friend.GetSheHe] พูด ผู้คนต่างตั้งใจฟังทุกคำพูดของ [skilful_friend.GetHerHis] ลิ้นอันว่องไวของ [skilful_friend.GetHerHis|U] เคลือบคำพูดให้หวานหูจนแม้ แต่ผู้ที่มองโลกในแง่ร้ายและหงุดหงิดที่สุดก็อดไม่ได้ที่จะหลงใหลในคำพูดเหล่านั้น ข้าเชื่ออย่างแท้จริงว่า [skilful_friend.GetSheHe] สามารถขายไม้ให้กับป่าได้!"
 bp1_yearly.5702.martial:0 "ความเฉียบแหลมทางยุทธวิธีอันมหาศาลที่อยู่ในจิตใจของ [skilful_friend.GetHerHis] นั้น ทำให้ผู้บัญชาการที่เก่งกาจที่สุดในโลกต้องอับอาย ด้วยความสามารถที่ดูเหมือนจะมีมา แต่กำเนิดในการระบุและใช้ประโยชน์จากจุดอ่อนในสนามรบ [skilful_friend.GetFirstNameNoTooltip] จึงเป็นทรัพย์สินอันยิ่งใหญ่สำหรับ [ROOT.Char.GetLadyLord] ทุกคนที่รู้ถึงความสำคัญของการสงคราม"
 bp1_yearly.5702.stewardship:0 "การจะกล่าวว่า [skilful_friend.GetSheHe] มีหัวด้านการเงินนั้น ยังถือเป็นการกล่าวที่น้อยเกินไป เมื่อ [skilful_friend.GetSheHe] รับผิดชอบเรื่องการคลัง ไม่มีแม้ แต่เหรียญเดียวที่จะรอดพ้นสายตา [skilful_friend.GetHerHis] ไปได้ ราวกับใช้เวทมนตร์อย่างแท้จริงเมื่อต้องจัดการกับตัวเลขให้สมดุล"
 bp1_yearly.5702.intrigue:0 "ในบรรดาผู้คนที่ข้าเกลียดที่จะต้องเป็นศัตรูด้วย [skilful_friend.GetFirstNameNoTooltip] คงจะอยู่ในอันดับต้นๆ อย่างแน่นอน นักวางแผนผู้เชี่ยวชาญและนักวางอุบายที่ยอดเยี่ยม ทักษะของ [skilful_friend.GetHerHis] นั้นช่ำชองพอๆ กับการขโมยขนมหวานจากสาวใช้ในครัว เช่นเดียวกับการวางรากฐานสำหรับการล่มสลายของราชวงศ์"
 bp1_yearly.5702.learning:0 "สติปัญญาของ [skilful_friend.GetHerHis|U] ในฐานะนักปราชญ์นั้นล้ำเลิศอย่างแท้จริง และยากจะหาผู้ใดใน [ROOT.Char.Custom('GetCourt')] ของข้ามาเทียบเทียมได้ ความเข้าใจอย่างถ่องแท้ของ [skilful_friend.GetHerHis|U] ในเรื่องปรัชญาและเทววิทยานั้น ทำให้ [skilful_friend.GetHerHim] สามารถโต้เถียงได้อย่างทัดเทียมกับผู้นำทางศาสนาที่ศักดิ์สิทธิ์และฉลาดที่สุด และข้ายังไม่เคยเห็น [skilful_friend.GetHerHim] สะดุดเมื่อต้องเผชิญกับปัญหาทางปัญญาเลยแม้ แต่ครั้งเดียว แม้กระทั่งตอนนี้ ข้าก็ได้ยินเสียง [skilful_friend.GetHerHim] อยู่ใน [ROOT.Char.Custom('GetRoom')] อีกห้องหนึ่ง กำลังบรรยายในหัวข้อที่คลุมเครือด้วยทักษะและความคล่องแคล่วของช่างฝีมือ [skilful_friend.GetWomanMan] ชั้นครูผู้มีประสบการณ์หลายสิบปี"
 bp1_yearly.5702.prowess:0 "มีชื่อเสียงเลื่องลือไปทั่วแผ่นดินในฐานะนักสู้ผู้เก่งกาจอย่างแท้จริง ฝีมือดาบ [skilful_friend.GetWomanMan] ของ [skilful_friend.GetHerHis] นั้นไม่มีผู้ใดกังขา การเฝ้ามองวิธีที่ [skilful_friend.GetSheHe] โจมตีหุ่นซ้อมในลานฝึกด้วยพละกำลังและความสง่างามของปรมาจารย์อย่างแท้จริงนั้น ย่อมสร้างความหวาดหวั่นให้แก่หัวใจของนักประลองที่เจ้าเล่ห์ที่สุด"
 bp1_yearly.5702.fallback:0 "สำรอง"
 bp1_yearly.5702.ending:0 "\n\nบางทีข้าอาจจะขอให้ [skilful_friend.GetHerHim] ให้คำแนะนำและเคล็ดลับเกี่ยวกับความเชี่ยวชาญด้านนั้นแก่ข้าได้หรือไม่?"
 bp1_yearly.5702.a:0 "สอนข้าที, [skilful_friend.GetFirstNameNoTooltip]!"
 bp1_yearly.5702.a.tt.success:0 "[skilful_friend.GetFirstNameNoTooltip] สอนวิถีทางของ [skilful_friend.GetHerHis] ให้ท่าน"
 bp1_yearly.5702.a.tt.neutral:0 "ท่านไม่ได้เรียนรู้อะไรที่เป็นประโยชน์ แต่ขอบคุณ [skilful_friend.GetFirstNameNoTooltip] สำหรับความพยายาม"
 bp1_yearly.5702.a.tt.failure:0 "ท่านไร้ความสามารถมากจน [skilful_friend.GetFirstNameNoTooltip] ยอมแพ้ด้วยความหงุดหงิด"
 bp1_yearly.5702.b:0 "ข้าคิดว่าข้าเก่งพอๆ กับพวกเขา!"
 bp1_yearly.5702.b.tt.success:0 "ท่านชนะการแข่งขัน"
 bp1_yearly.5702.b.tt.failure:0 "ท่านแพ้การแข่งขัน"
 bp1_yearly.5702.c:0 "ข้าไม่มีวันไปถึงระดับของ [skilful_friend.GetHerHis] ได้!"

 bp1_yearly.5703.t:0 "คู่นอนประหลาด"
 bp1_yearly.5703.desc:0 "ข้านอนหงาย หอบหายใจและเหงื่อท่วม [rival_lover.GetFirstName] ผู้พิชิตทางเพศของข้าในคืนนี้ เหยียดยาวอย่างเกียจคร้านอยู่ข้างๆ ข้า ใครจะคิดว่าคู่แข่งที่ขมขื่น เช่นนี้จะกลายเป็นคู่รักที่... #EMP เข้ากันได้#! ขนาดนี้?\n\n”หลับตาลง” [rival_lover.GetFirstNameNoTooltip] พูดอย่างซุกซน รอยยิ้มขี้เล่นปรากฏที่มุมปากของ [rival_lover.GetHerHis] ข้ายอมทำตาม มือประสานกันเหนือศีรษะขณะที่ข้าอาบไล้ในแสงเรืองรองหลังเสร็จกิจ ทันใดนั้นข้อมือของข้าก็รู้สึกถึงเหล็กเย็นของกุญแจมือรอบๆ ทำให้ตาของข้าเบิกโพลงขึ้นมาอีกครั้ง เพื่อเห็นคู่รักของข้าปีนข้ามไปยังโต๊ะข้างเตียง\n\n”ข้ารอเวลานี้มานานแสนนานแล้ว” [rival_lover.GetSheHe] ขู่ฟ่อ แสงจันทร์สะท้อนบนใบมีด"
 bp1_yearly.5703.a:0 "ไม่! ได้โปรด ให้ข้าพูด!"
 bp1_yearly.5703.a.tt.success:0 "ท่านพูดเกลี้ยกล่อม [rival_lover.GetHerHim] ได้สำเร็จ"
 bp1_yearly.5703.a.tt.failure:0 "[rival_lover.GetFirstNameNoTooltip] ทำร้ายท่าน"
 bp1_yearly.5703.a.tt.criticalfailure:0 "[rival_lover.GetSheHe|U] ไม่แสดงความปรานี"
 bp1_yearly.5703.b:0 "เดี๋ยวก่อน! ท่านไม่ต้องการสิ่งนี้อีกหรือ?"
 bp1_yearly.5703.b.tt.success:0 "พลังแห่งการยั่วยวนของท่านช่วยท่านไว้"
 bp1_yearly.5703.b.tt.failure:0 "ท่านไม่ได้เก่งบนเตียงขนาดนั้น"
 bp1_yearly.5703.c:0 "ให้ข้าแสดงให้ท่านเห็นว่าทำไมถึงเป็นความคิดที่ไม่ดี..."

 bp1_yearly.5704.t:0 "งดงามยาม [seduced_rival.GetSheHe|U] โกรธ"
 bp1_yearly.5704.desc:0 "[seduced_rival.GetFirstName] อยู่ใน [ROOT.Char.GetChamber] ของข้าอีกครั้ง พล่ามเรื่องไร้สาระบางอย่างเกี่ยวกับว่าข้าทำผิดต่อ [seduced_rival.GetHerHim] อย่างไร ดวงตาของ [seduced_rival.GetHerHis|U] ลุกเป็นไฟขณะที่ [seduced_rival.GetSheHe] สาปแช่งชื่อข้าอีกครั้ง และความโกรธของ [seduced_rival.GetHerHis] ก็ยิ่งเพิ่มสูงขึ้นเมื่อข้าปัดเป่าความโกรธของ [seduced_rival.GetHerHis] ด้วยการส่ายศีรษะอย่างดูถูก\n\nขณะที่ [seduced_rival.GetSheHe] ยังคงด่าว่าข้าต่อไป แม้ว่าข้าจะโต้ตอบกลับไป ข้าก็พบว่าตัวเองกำลังพิจารณาดวงตาของ [seduced_rival.GetHerHis] อีกครั้ง ไม่นานหลังจากที่ข้าหลุดออกจากภวังค์เล็กๆ นั้น ข้าก็พบว่าสายตาของข้าเลื่อนไปจับจ้องที่ส่วนโค้งของแนวกรามของ [seduced_rival.GetHerHis] ซึ่งบิดเบี้ยวอย่างน่าทึ่งด้วยความโกรธ ข้าจ้องมองอย่างไม่รู้ตัว สังเกตเห็นว่าหน้าอกของ [seduced_rival.GetHerHis] กระเพื่อมขึ้นลงอย่างเชื้อเชิญขณะที่ [seduced_rival.GetSheHe] ยังคงด่าว่าต่อไป และ-\n\nข้าเข้าไปพัวพันกับเรื่อง #EMP อะไร #!กันนี่?"
 bp1_yearly.5704.a:0 "หวังว่าเราจะได้พบกัน #EMP บ่อยขึ้น #!นะ, [seduced_rival.GetFirstNameNoTooltip]"
 bp1_yearly.5704.b:0 "นี่มันไร้สาระสิ้นดี!"

 bp1_yearly.5705.t:0 "[lover_rival.GetSheHe|U] ไม่คุ้มค่าเลย!"
 bp1_yearly.5705.desc:0 "บางทีข้าอาจจะพอใจกับตัวเองมากเกินไปในช่วงหลังนี้? แน่นอนว่านั่นดูเหมือนจะเป็นสิ่งที่ผลักดันให้ [concerned_friend.GetFirstName] ต้องลงมือด้วยความโมโห สหายของข้าได้ต้อนข้าจนมุมและเผชิญหน้ากับข้าเกี่ยวกับความสัมพันธ์ที่... ซับซ้อนของข้ากับ [lover_rival.GetFirstName]\n\n"เจ้ากำลังทำตัวไร้สาระอย่างที่สุด!" [concerned_friend.GetSheHe] กล่าวอย่างราบเรียบ เห็นได้ชัดว่าหงุดหงิดกับท่าทางเพ้อฝันหลังเสร็จกิจของข้า [concerned_friend.GetSheHe] เอื้อมมือออกมาและจิ้มหน้าอกข้าด้วยนิ้วที่เหยียดตรง "เจ้า #EMP รู้ #!ว่าไม่มีอะไรดีๆ จะเกิดขึ้นจากเรื่องนี้! เจ้ากำลัง ทำให้ตัวเองตกต่ำ และเจ้ารู้ดี!""
 bp1_yearly.5705.a:0 "แต่... ท่านเคย #EMP เห็น #![lover_rival.GetHerHim] หรือยัง?!"
 bp1_yearly.5705.a.tt:0 "ตัวเลือกนี้มีให้ เนื่องจากความน่าดึงดูดใจที่โดดเด่นของ [lover_rival.GetFirstNamePossessiveNoTooltip]"
 bp1_yearly.5705.b:0 "ท่านแค่ไม่เข้าใจความสัมพันธ์ของเรา!"
 bp1_yearly.5705.c:0 "ข้ารู้ ข้ารู้ ท่านพูดถูก"

 bp1_yearly.5706.t:0 "บาปของ [SCOPE.sC('rival_child').Custom2('RelationToMeShort', SCOPE.sC('rival_parent'))|U]"
 bp1_yearly.5706.desc:0 "ขณะที่ข้าเดินทางไปทั่ว [meeting_county.GetProvince.GetCounty.GetName] ข้าพบ [rival_parent.Custom2('MyCharacterIntroduction', ROOT.Char)] กำลังรีบมาหาข้า เมื่อเร็วๆ นี้ เราแลกเปลี่ยนคำพูดเหน็บแนมกันอย่างรุนแรงทุกครั้งที่มีโอกาส ดังนั้นข้าจึงคาดว่า [rival_parent.GetHerHim] จะพ่นเรื่องไร้สาระที่น่ารังเกียจออกมา แต่ [rival_parent.GetFirstNameNoTooltip] กลับเดินผ่านไปอย่างเงียบๆ\n\nจากนั้นข้าจึงสังเกตเห็นใครบางคนอยู่ในการดูแลของ [rival_parent.GetFirstNamePossessiveNoTooltip]: [rival_child.Custom('GetDaughterSon')] ของ [rival_parent.GetHerHis], [rival_child.GetFirstName] [rival_child.GetSheHe|U] ยิ้มให้ข้าพร้อมกับเลิกคิ้วเล็กน้อยอย่างมีเลศนัย ก่อนที่จะรีบตาม [SCOPE.sC('rival_child').Custom2('RelationToMeShort', SCOPE.sC('rival_parent'))] ของ [rival_child.GetHerHis] ไป\n\nข้ามองดูทั้งคู่หายลับไป นี่มันเรื่องอะไรกัน...?"
 bp1_yearly.5706.a:0 "คงจะหยาบคายหากไม่ตอบสนองในทำนองเดียวกัน..."
 bp1_yearly.5706.a.tt:0 "แผนการยั่วยวนจะมีโอกาสสำเร็จเพิ่มขึ้น"
 bp1_yearly.5706.b:0 "ข้าจะไม่แตะต้องญาติของไอ้สกปรกนั่น!"

 bp1_yearly.5707.t:0 "บาปของ [SCOPE.sC('rival_child').Custom2('RelationToMeShort', SCOPE.sC('rival_parent'))|U]: คาหนังคาเขา"
 bp1_yearly.5707.start:0 "ข้าได้ยินเสียงฝีเท้าดังสนั่นชัดเจนแม้ ในขณะที่กำลังอยู่ในห้วงแห่งความปรารถนา และใบหน้าของข้าก็บิดเบี้ยวเป็นรอยยิ้มเยาะเย้ยเกือบจะโดยไม่สมัครใจ\n\n[rival_parent.GetFirstName|U] พรวดพราดเข้ามาใน [ROOT.Char.Custom('GetRoom')] และสีหน้าสยดสยองบนใบหน้าของ [rival_parent.GetHerHis] เมื่อความหวาดกลัวของ [rival_parent.GetHerHis] กลายเป็นความจริงนั้นช่างงดงามอย่างยิ่ง [rival_child.GetFirstName],"
 bp1_yearly.5707.child_dislike:0 "ทำให้ข้าประหลาดใจ ยิ้มกว้างพอๆ กับข้าเมื่อ [rival_child.GetSheHe] เห็น [SCOPE.sC('rival_child').Custom2('RelationToMeShort', SCOPE.sC('rival_parent'))] ของ [rival_child.GetHerHis] ที่ธรณีประตู [rival_child.GetSheHe|U] ถึงกับโอบแขนรอบตัวข้าเพื่อกอดข้าให้แน่นขึ้น ค่อนข้างมีชัยชนะ\n\n"บางทีตอนนี้ท่านอาจจะจริงจังกับข้าเสียที, #EMP [rival_child.GetHerHis]#!!""
 bp1_yearly.5707.child_deviant:0 "ทำให้ข้าประหลาดใจ ยิ้มกว้างพอๆ กับข้าเมื่อ [rival_child.GetSheHe] เห็น [SCOPE.sC('rival_child').Custom2('RelationToMeShort', SCOPE.sC('rival_parent'))] ของ [rival_child.GetHerHis] ที่ธรณีประตู [rival_child.GetSheHe|U] ทำให้ข้าประหลาดใจยิ่งขึ้นไปอีกเมื่อ ด้วยท่าทางโอ้อวด [rival_child.GetSheHe] โยนผ้าห่มกลับไปและเปิดเผยร่างของเราทั้งคู่!\n\n"ข้าจะชวนท่านมา #EMP ร่วมกับเราได้ไหม,#! [SCOPE.sC('rival_child').Custom2('RelationToMeShort', SCOPE.sC('rival_parent'))]?""
 bp1_yearly.5707.child_like:0 "ร้องเสียงหลงด้วยความประหลาดใจ ตะเกียกตะกายหาผ้าห่มมาปกปิดความเปลือยเปล่าของ [rival_child.GetHerHis]\n\nภายในชั่วพริบตา คำอธิบายก็ถูกเรียกร้องและข้อกล่าวหาก็ถูกสาดใส่กันขณะที่พ่อแม่และลูกตะโกนใส่กันเหนือร่างที่หมดแรงและพึงพอใจของข้า"
 bp1_yearly.5707.a:0 "ฮ่า! ฮ่า! จับได้แล้ว ไอ้สารเลว!"
 bp1_yearly.5707.a.deviant:0 "เกิดอะไรขึ้นในนามของ [ROOT.Char.GetFaith.HighGodNamePossessive] กันนี่?!"
 bp1_yearly.5707.a.doubledeviant:0 "...แล้วว่าไงล่ะ, [rival_parent.GetFirstNameNoTooltip]?"
 bp1_yearly.5707.b:0 "ได้โปรดเถอะ, [rival_child.GetFirstNameNoTooltip] กับข้ารักกัน!"
 bp1_yearly.5707.c:0 "ท่านเลี้ยงดูลูกหลานได้ดี, [rival_parent.GetFirstNameNoTooltip]!"

 bp1_yearly.5740.t:0 "ควานหาคำตอบ"
 bp1_yearly.5740.desc:0 "ข้าตื่นขึ้นอย่างงัวเงียด้วยเสียงนกร้อง แสงแดดยามเช้าสาดส่องเข้ามาใน [ROOT.Char.Custom('GetChamber')] ของข้า ข้าหาว ยืดตัว แล้วนอนลงอีกครั้ง อาบไล้ในความอบอุ่น เพียงครู่เดียวเท่านั้นที่ข้าสังเกตเห็นบางอย่าง\n\nวางอยู่ข้างๆ ข้า ซุกตัวอยู่บนหมอนอย่างสมบูรณ์แบบเหมือนกับที่ข้าซุกตัวอยู่ในผ้าห่ม คือวัตถุลึกลับอย่างแท้จริง\n\nขนาดกลาง สีขาวนวล ไม่มีลักษณะเด่นใดๆ เลย...\n\nไข่"
 bp1_yearly.5740.a:0 "นี่มัน... นี่มัน #EMP หมายความว่า #!อย่างไร?"
 bp1_yearly.5740.a.tt:0 "ข้าต้องหาตัวผู้กระทำผิดให้ได้!"
 bp1_yearly.5740.b:0 "แปลกจัง โอ้ ช่างมันเถอะ"
 bp1_yearly.5740.c:0 "ใครทำ เช่นนี้? พวกเขาอยู่ที่ไหน?! #EMP ทหารยาม!#!"

 bp1_yearly.5741.t:0 "$bp1_yearly.5740.t$: ถูกลวก"
 bp1_yearly.5741.desc:0 "จุดแรกที่ข้าไปคือห้องครัว ที่ ซึ่งคนรับใช้ขวักไขว่ไปมารอบๆ โต๊ะขณะเตรียมอาหาร แม้ แต่ตัวข้าเองก็ยังถูกไล่ออกจากกองอาหารหลายกอง สถานะของข้าในฐานะ [ROOT.Char.GetLadyLord] ของพวกเขาไม่ได้สร้างความประทับใจให้กับพ่อครัวแม่ครัวที่กำลังยุ่งอยู่เลยแม้ แต่น้อย\n\nในที่สุดข้าก็พบสิ่งที่ข้าตามหา: กองไข่ที่เกือบจะจัดเรียงไว้แล้ว! แต่ละฟองถูกวางไว้อย่างพอดีในหลุมฟางเล็กๆ ภายในลังไม้ขนาดใหญ่ที่เปิดด้านบน วางเรียงกันเป็นแถว แถวละสิบฟอง สิบ คูณ สิบ คูณ สิบ คูณ... แปด\n\nไข่หายไป #EMP สอง#! ฟอง!"
 bp1_yearly.5741.a:0 "อีกฟองรึ?! ข้าจะให้ #EMP ถลกหนัง#! ผู้กระทำผิด!"
 bp1_yearly.5741.a.tt:0 "จะไม่มีก้อนหินก้อนใดถูกปล่อยไว้โดยไม่พลิก!"
 bp1_yearly.5741.b:0 "ใครก็ตามที่ทำต้องเข้าถึงห้องครัวได้! ไขปริศนาได้แล้ว!"



 bp1_yearly.5742.t:0 "$bp1_yearly.5740.t$: ถูกปีศาจสิง!"
 bp1_yearly.5742.desc:0 "ข้าวิ่งลงบันไดไปยังห้องใต้ดิน ปล่อยให้ตัวเองสูดอากาศที่อับชื้นและเย็นสบายของมัน ชั้นวางอาหารและเครื่องดื่มเรียงรายอยู่มากมาย และแตกต่างอย่างสิ้นเชิงกับความวุ่นวายของห้องครัวด้านบน ชั้นล่างนี้ว่างเปล่าไม่มีผู้อื่น ข้าพยุงตัวบนชั้นวางเตี้ยๆ รวบรวมความคิด ใครก็ตามที่วางไข่ไว้ที่นั่นต้องเข้าถึงห้องพักของข้าได้ และเข้าถึงห้องครัวได้ และ...\n\nความคิดของข้าขาดหายไป มือของข้า ซึ่งล้วงเข้าไปในกระเป๋าเสื้ออย่างเหม่อลอย ได้หยุดนิ่ง นิ้วมือของข้า คลำหาอย่างไม่เชื่อสายตา ดึงวัตถุที่พวกมันสัมผัสออกมาจากเสื้อผ้าของข้า\n\nวัตถุนั้นแข็ง อุ่นเล็กน้อย #EMP รูปไข่#! "
 bp1_yearly.5742.a:0 "ได้อย่างไร? ได้อย่างไร?!"
 bp1_yearly.5742.b:0 "โชคดีอะไร เช่นนี้! ไข่ฟรี #EMP สอง#! ฟอง!"

 bp1_yearly.5743.t:0 "$bp1_yearly.5740.t$: ฟักแผนการ"
 bp1_yearly.5743.desc:0 "ราวกับอยู่ในภวังค์ ข้าพรวดพราดผ่านประตูเข้าไปในห้องพิจารณาคดีของข้า ตาเบิกโพลง ข้าในบังคับและครอบครัวของข้าเรียงรายอยู่เบื้องหน้าข้า [egg_spouse.Custom2('MyCharacterIntroduction', ROOT.Char)] และ [egg_friend.Custom2('MyCharacterIntroduction', ROOT.Char)] โดดเด่นเป็นพิเศษด้วยความสยดสยอง\n\n"ไข่! ไข่สองฟอง!" ข้าประกาศ ชูวัตถุทรงรีที่ไม่น่าสนใจนั้นให้พวกเขาดู "ใครเป็นคนทำ?! ใครทำ เช่นนี้? ข้าจะโยนเจ้าลงทะเล!"\n\nเสียงหัวเราะอย่างประหม่าและสับสนตามมา ข้ายกแขนขึ้นสูง และด้วยเสียงคำรามที่ไม่ปะติดปะต่อและดังสนั่น ข้าขว้างวัตถุที่น่ารังเกียจนั้นลงบนพื้นโดยตรง เสียงหัวเราะเงียบหายไป"
 bp1_yearly.5743.a:0 "[egg_spouse.GetFirstNameNoTooltip]! สารภาพมาเดี๋ยวนี้!"
 bp1_yearly.5743.a.tt.success:0 "ท่านเลือกผู้ต้องสงสัยได้ถูกต้อง"
 bp1_yearly.5743.a.tt.failure:0 "การคาดเดาของท่านไม่ถูกต้อง"
 bp1_yearly.5743.a.tt.outcome:0 "โอกาสของ"
 bp1_yearly.5743.b:0 "[egg_friend.GetFirstNameNoTooltip]! เจ้า [egg_friend.Custom2('InsultNoun', ROOT.Char)]!"
 bp1_yearly.5743.c:0 "ไม่มีใครในพวกเจ้าพ้นจากความสงสัย! #EMP ไม่มีเลย!#!"
 bp1_yearly.5743.c.tt.success:0 "ท่านเลือก... ทุกคน ได้ถูกต้อง"
 bp1_yearly.5743.c.tt:0 "ข้าราชบริพารทุกคน"

 bp1_yearly.5744.t:0 "$bp1_yearly.5740.t$: ถูกตี"
 bp1_yearly.5744.start:0 "ความโกรธเกรี้ยวในข้อกล่าวหาของข้า ทำให้น้ำหนักของข้อกล่าวหานั้นหนักอึ้ง แต่เมื่อเวลาผ่านไป ความงุนงงบน "
 bp1_yearly.5744.spouse:0 "ใบหน้าของ [egg_spouse.GetFirstNamePossessive]"
 bp1_yearly.5744.friend:0 "ใบหน้าของ [egg_friend.GetFirstNamePossessive]"
 bp1_yearly.5744.crowd:0 "ทุกใบหน้าในฝูงชน"
 bp1_yearly.5744.end:0 "ไม่เคยพลาดท่าแม้ แต่ครั้งเดียว ข้าพยายามก้าวไปข้างหน้าอีกก้าว แต่ทั้งร่างของข้ากลับทรุดฮวบและเริ่มโค่นล้ม\n\nในชั่วพริบตาต่อมา ข้าก็นอนหงายหลัง มองเห็นวงล้อมของใบหน้าที่เปี่ยมความกังวลอยู่รอบๆ มีผ้าชุบน้ำเย็นผืนหนึ่งกำลังซับที่ขมับของข้า\n\n"ไม่ ไม่ [ROOT.Char.Custom('FormOfAddressForLiege')]! ท่านต้องพักผ่อน พวกเราจะให้คนรับใช้มาช่วยทำความสะอาดท่านด้วย" ถ้อยคำที่ไร้ที่มานั้น ดังเข้ามาในหูพร้อมๆ กับที่มือของข้าสัมผัสแก้ม ปาดเอาไข่แดงของไข่ที่แตกละเอียด ซึ่งข้าล้มทับลงไปเต็มๆ ออกเบาๆ"
 bp1_yearly.5744.a:0 "…ข้าปวดหัว"
 bp1_yearly.5744.b:0 "ข้าจะหาตัวผู้กระทำผิดให้ได้! แค่... ไม่ใช่ตอนนี้"

 bp1_yearly.5745.t:0 "$bp1_yearly.5740.t$: การเล่นสกปรก"
 bp1_yearly.5745.desc:0 "การทำงานหนักมาทั้งวันย่อมได้รับรางวัลเป็นการพักผ่อนที่ดี! เตียงของข้า ใหญ่โตและสะดวกสบาย สว่างไสวด้วยแสงไฟที่ริบหรี่จากเตาผิง เปลวไฟที่แตกปะทุส่งเงาเต้นระริกไปทั่วผนัง ข้าเลื่อนตัวเข้าไปในอ้อมกอดอันอบอุ่นของมันอย่างสำนึกบุญคุณ ดึงผ้าห่มคลุมร่างที่เหนื่อยล้าของข้าและวางศีรษะลงบนหมอน\n\nตอนนั้นเองที่ข้าเห็นมัน ห่างจากข้าไม่ถึงช่วงแขน วางอยู่อย่างบริสุทธิ์บนหมอนของมันเอง สว่างไสวด้วยเปลวไฟที่ส่องประกายในเตาผิง\n\nไข่ฟองหนึ่ง"
 bp1_yearly.5745.a:0 "#DIE2 …ไม่ …ไม่#! #DIE1 ไม่ ไม่ ไม่#! #EMP ไม่นะะะะ!#!"
 bp1_yearly.5745.b:0 "เป็นฝีมือของ [egg_spouse.GetFirstNamePossessiveNoTooltip] ข้ารู้ดี"
 bp1_yearly.5745.c:0 "เป็นฝีมือของ [egg_friend.GetFirstNamePossessiveNoTooltip] แน่นอน!"
 bp1_yearly.5745.d:0 "ข้าขอปฏิเสธที่จะเข้าไปยุ่งเกี่ยวกับเรื่องตลกไร้สาระเหล่านี้อีกต่อไป!"
