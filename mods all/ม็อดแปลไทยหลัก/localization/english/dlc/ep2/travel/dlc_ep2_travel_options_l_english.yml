 ep3_travel_option_events.0001.t: "$adventurers_scout_for_talent_option$: ผู้ติดตามที่เต็มใจ"
 ep3_travel_option_events.0001.intro: "ข้าพบ[local_character.GetWomanMan]คนหนึ่งขณะเดินทางผ่าน[location.GetTitle.GetNameNoTier] [local_character.GetSheHe|U]เป็นคน[ROOT.Char.Custom2('QuirkAdjectivePosOrNeg', SCOPE.sC('local_character'))]และ[ROOT.Char.Custom2('QuirkPresentPosOrNeg', SCOPE.sC('local_character'))]ขณะที่ข้าเข้าใกล้\n\n"
 
 ep3_travel_option_events.0001.court_physician_court_position: ""ขอ[local_character.GetFaith.HighGodName|U]สถิตอยู่กับท่าน ข้าคือ[local_character.GetFullName] — หมอและหมอสมุนไพรประจำถิ่นของ[location.GetNameNoTooltip] ชาวบ้านหันมาหาข้าเพื่อรักษาอาการป่วยไข้: กระดูกหัก ผื่นคัน ข้ากระทั่งทำคลอดเป็นครั้งคราว ความหลงใหลในสุขภาพและธาตุต่างๆ ในร่างกาย ทำให้ข้าเกิดความปรารถนาที่จะเดินทาง ข้าต้องการออกสำรวจ"\n\n"
 ep3_travel_option_events.0001.bodyguard_court_position: ""สวัสดี ชื่อของข้าคือ[local_character.GetFullName] ข้ารู้วิธีจัดการคนเกเร ข้าเก่งเรื่องนี้มากด้วย ต่อยคนดูแลคอกม้าสลบในหมัดเดียวระหว่างการทะเลาะวิวาทเมื่อคืนก่อน ข้าทำเอง"\n\n"
 ep3_travel_option_events.0001.travel_leader_court_position: ""ฟังทางนี้! ท่านหลงทางหรือ นักเดินทาง? ชื่อของข้าคือ[local_character.GetFullName] ข้ารู้จักดินแดนเหล่านี้ดี ข้าต้อนฝูงแกะของข้าผ่าน[location.Custom('GetTerrainTypePlural')]ที่สวยงามเหล่านี้ทุกวัน แต่หัวใจของข้าเป็นของถนนหนทางอันห่างไกล การเป็นผู้บุกเบิกเส้นทาง ผู้นำทาง — นั่นคือความฝันของข้า"\n\n"
 ep3_travel_option_events.0001.second_camp_officer: ""ทักทาย ชื่อของข้าคือ[local_character.GetFullName] ข้าดูแลการบรรทุกเกวียนที่ตลาด[location.GetNameNoTooltip]มาหลายปี ข้าจัดระเบียบคนงานในฟาร์มหลายสิบคนที่โรงสีท้องถิ่น ใช่แล้ว มีอะไรบ้างที่ข้ายังไม่ได้ทำ..."\n\n"
 ep3_travel_option_events.0001.quartermaster_camp_officer: ""ข้าจัดระเบียบโกดังของ[location.GetNameNoTooltip]อย่างพิถีพิถัน ข้าทำรายการและบัญชีเพื่อบันทึกแอปเปิ้ล หัวหอม และเมล็ดธัญพืชทุกชิ้น แต่การอยู่ที่นี่ ทำให้ข้าเบื่อหน่าย"\n\n"
 ep3_travel_option_events.0001.armorer_camp_officer: ""ข้าทำงานที่โรงตีเหล็ก ซ่อมแซมเกราะโซ่และเกราะแผ่นสำหรับกองทหารรักษาการณ์[location.GetNameNoTooltip] แม้จะมีงานทำเสมอ ข้ารู้สึกถึงเสียงเรียกของถนนหนทางมานานแล้ว"\n\n"
 ep3_travel_option_events.0001.chief_forager_camp_officer: ""ข้าคือ[local_character.GetFullName] — ข้าใช้เวลาทั้งวันใน[location.Custom('GetTerrainTypePlural')] เก็บหาของป่าตาม[location.Custom('GetProvinceFoliageDesc')]และ[location.Custom('GetProvinceGroundDesc')]เพื่อหา[local_character.Custom('RegionalRootVegetablePlural')]และไข่[local_character.Custom('GetRandomRegionalWildDaytimeBird')] ข้านำสิ่งที่หาได้ไปที่ตลาด[location.GetNameNoTooltip]และขายให้กับนักเดินทางและคนพเนจร"\n\n"
 ep3_travel_option_events.0001.master_thief_camp_officer: ""ระวังกระเป๋าเงินของท่านให้ดี แถวนี้มีนักล้วงกระเป๋าเยอะ แน่นอน ข้าไม่มีวันขโมยจากคนอย่างท่าน... ไม่เลย สติปัญญาของข้าหลักแหลม และข้าอยากจะมุ่งเป้าไปที่ทรัพย์สมบัติอันห่างไกลมากกว่า"\n\n"
 ep3_travel_option_events.0001.head_porter_camp_officer: ""ทักทาย ชื่อของข้าคือ[local_character.GetFullName] ข้าเป็นคนขนของ — ข้าชอบอ้างว่าข้าแบก[location.GetNameNoTooltip]ทั้งหมดไว้บนหลัง ฮ่า ฮ่า! ข้าบรรจุหีบห่อและขนส่งวัตถุทุกชนิด: เครื่องปั้นดินเผา อาหาร อาวุธ ท่านว่ามาเลย"\n\n"
 ep3_travel_option_events.0001.head_groom_camp_officer: ""ขอ[local_character.GetFaith.HighGodName|U]สถิตอยู่กับท่าน ชื่อของข้าคือ[local_character.GetFullName] ข้าเป็นคนดูแลคอกม้าที่นี่ใน[location.GetNameNoTooltip] ข้าดูแลสัตว์หลายสิบตัว ทำคลอดลูกม้า และซ่อมแซมอานม้าที่ชำรุดและอุปกรณ์ขี่ม้าอื่นๆ"\n\n"
 ep3_travel_option_events.0001.huntperson_camp_officer: ""ยินดีที่ได้พบ — ข้าคือพราน[local_character.GetWomanMan] ชื่อของข้าคือ[local_character.GetFullName] และ[location.Custom('GetTerrainTypePlural')]แห่ง[location.GetNameNoTooltip]คือที่ที่ข้าล่าสัตว์ของข้า [location.Custom('TerrainTypeProvince')]เป็นที่อยู่ของสัตว์มากมาย ซึ่งทั้งหมดเป็นเหยื่อของข้า: [local_character.Custom('GetRegionalDeerType')], [local_character.Custom('GetRandomRegionalSmallGame')] และ[local_character.Custom('GetRandomRegionalWildDaytimeBird')]เหมือนกัน"\n\n"
 ep3_travel_option_events.0001.kennelperson_camp_officer: ""สวัสดี ข้าคือ[local_character.GetFullName] ข้าดูแลคอกสุนัขที่นี่ใน[location.GetNameNoTooltip] เพื่อนที่ดีที่สุดของมนุษย์ ข้าเรียกพวกมันอย่างนั้น สุนัขของข้า ลูกสุนัข[local_character.Custom('ComplimentAdjective')]ของข้า ข้าฝึกพวกมัน ดูแลพวกมัน เตรียมพวกมันให้พร้อมสำหรับการล่า — เพื่อนร่วมทางที่ซื่อสัตย์ไม่มีใครเทียบ ข้ารับรอง!"\n\n"
 ep3_travel_option_events.0001.chief_engineer_camp_officer: ""ข้าสร้างเครื่องยิงหินในโรงงานของ[location.GetNameNoTooltip] ทำงานหนักทั้งวันทั้งคืนเป็นเวลาหลายเดือน! แบกท่อนซุง ขันสปริง ตอกฟันเฟือง... ตอนนี้ข้าโหยหาถนนหนทาง"\n\n"
 ep3_travel_option_events.0001.witness_camp_officer: ""อา ข้าเห็นได้ว่าท่านยิ่งใหญ่เพียงใด! ค่ายของท่านยิ่งใหญ่เพียงใด! สถานที่แห่งนี้ [location.GetNameNoTooltip] มันเคยดี — แต่ไม่ใช่ตอนนี้แล้ว ข้าอยากออกไป ท่านเห็นได้ชัดว่าเป็นคน[ROOT.Char.Custom('ComplimentAdjective')] [ROOT.Char.Custom( 'RomanticComplimentAdjective')] เป็น[ROOT.Char.Custom('RomanticComplimentNoun')]ที่แท้จริง!"\n\n"
 ep3_travel_option_events.0001.person_haggler_camp_officer: ""ข้าคือ[local_character.GetFullName] ผู้คุม — ข้าทำงานในคุก[location.GetNameNoTooltip]ที่ ซึ่งข้าดูแลนักโทษ ข้าต่อรองเพื่ออิสรภาพของพวกเขา จากนั้นข้าก็ให้อาหาร ทำความสะอาด แต่งตัว และขนส่งพวกเขาเมื่อใดก็ตามที่มีการจ่ายค่าไถ่"\n\n"
 ep3_travel_option_events.0001.camp_cook_camp_officer: ""สวัสดี [ROOT.Char.Custom('RomanticComplimentNoun')] ท่านหิวหรือไม่? ข้าเป็นแม่ครัว ท่านเห็นไหม ข้าทำงานที่โรงเตี๊ยมท้องถิ่น ท่านคงไม่เชื่อว่าข้าทำอะไรได้บ้างกับ[local_character.Custom('RegionalRootVegetablePlural')]และ[local_character.Custom('GetRandomRegionalSmallGame')]! แต่โอ้ ข้าอยากจะทำงานกับวัตถุดิบที่แปลกใหม่กว่านี้เหลือเกิน..."\n\n"
 ep3_travel_option_events.0001.master_bard_camp_officer: ""ทักทาย ชื่อของข้าคือ[local_character.GetFullName]ผู้[local_character.Custom('ComplimentAdjective')]! ข้าเล่นดนตรีและร้องเพลงที่โรงเตี๊ยมท้องถิ่น แต่ความปรารถนาที่จะเดินทางท่องเที่ยวเต็มเปี่ยมในหัวใจของข้า! ข้าต้องหนีออกจากที่นี่ และไปยังที่ที่ดนตรีของข้าจะได้ยินไปทั่วโลก!"\n\n"
 ep3_travel_option_events.0001.stooge_camp_officer: ""ข้าเบื่อเต็มทนกับการถูกโขกสับราวกับหมาตัวหนึ่ง! ณ ที่นี้ หามีผู้ใดนับถือข้าไม่ ทุกผู้คนต่างพากันหัวร่อทันทีที่นาม '[local_character.GetFullName]' ถูกเอ่ยขาน อ้ายพวกเขลา! [local_character.Custom2('InsultNoun', ROOT.Char)|U]s! [ROOT.Char.Custom2('InsultNoun', ROOT.Char)|U]s! #EMP อ๊าาาา ข้าช่างเดือดดาลนัก — ข้าจักต้องไปจากที่นี่ให้จงได้!#!"\n\n"
 ep3_travel_option_events.0001.master_of_arms_camp_officer: ""ระวัง! ข้าคือ[local_character.GetFullName] หัวหน้ากองรักษาการณ์ที่กองทหารรักษาการณ์[location.GetNameNoTooltip] ข้าเฆี่ยนตีพวกเด็กอ่อนหัดให้เข้ารูปเข้ารอย และจัดเวรยามของทหารรักษาการณ์ ทุกคนพึ่งพาข้าให้บอกพวกเขาว่าต้องทำอะไร"\n\n"
 ep3_travel_option_events.0001.light_cavalry_captain_camp_officer: ""ขอ[local_character.GetFaith.HighGodName|U]สถิตอยู่กับท่าน ข้าคือ[local_character.GetFullName] ข้าเป็นหน่วยสอดแนม ผู้ส่งสาร และทหารม้านอกแถว — หัวใจของข้าอยู่ในป่าเขา ห่างไกลจากความน่าเบื่อของเมืองและหมู่บ้าน"\n\n"
 ep3_travel_option_events.0001.camelry_captain_camp_officer: ""อูฐคือชีวิตของข้า ข้าขี่พวกมันเข้าสู่สมรภูมินับครั้งไม่ถ้วน ไม่มีใครสามารถขวางทาง 'อูฐพิชิตของ[local_character.GetFullNamePossessive]' ได้ ข้าปรารถนาที่จะเห็นโลกอีกครั้ง ข้าปรารถนาที่จะพิชิตอีกครั้ง!"\n\n"
 ep3_travel_option_events.0001.elephantry_captain_camp_officer: ""ทักทาย ชื่อของข้าคือ[local_character.GetFullName] ข้าดูแลสัตว์ร้ายที่เราเรียกว่าช้าง ข้าดูแลขนและให้อาหารพวกมัน ไม่มีการบุกโจมตีใดที่ร้ายแรงเท่ากับการบุกจากยักษ์มีงาเหล่านี้"\n\n"
 ep3_travel_option_events.0001.heavy_cavalry_captain_camp_officer: ""ข้าคือ[local_character.GetFullName] และข้ารับใช้เป็น[local_character.Custom('KnightCultureNoTooltipLowercase')]ในกองรักษาการณ์ของ[location.GetNameNoTooltip] สวมเกราะเต็มยศและขี่ม้าหุ้มเกราะ ข้าได้บุกโจมตีศัตรูของอาณาจักรนับครั้งไม่ถ้วน"\n\n"
 ep3_travel_option_events.0001.horse_archer_captain_camp_officer: ""ข้าคือ[local_character.GetFullName] ตั้งแต่ข้ายังเป็นเด็กน้อย ข้าใช้ชีวิตอยู่บนอานม้า [local_character.GetFaith.HighGodName|U]ได้ประทานพรให้ข้าด้วยทักษะ ความอดทน และความพากเพียร ทั้งหมดที่ข้าต้องการคือธนูและม้า"\n\n"
 ep3_travel_option_events.0001.archer_captain_camp_officer: ""ทักทาย ข้าคือ[local_character.GetFullName] ยามเฝ้า ข้าตรวจตรา[location.Custom('GetTerrainTypePlural')]ของ[location.GetNameNoTooltip]จากยอดหอคอยของข้า หากโจรเข้ามาใกล้ ธนูของข้าจะเป็นผู้พูด แม้ว่าข้าจะเบื่อชีวิตที่อยู่กับที่นี้ — ข้าปรารถนาที่จะไปให้ไกลกว่าลูกธนูใดๆ ของข้า!"\n\n"
 ep3_travel_option_events.0001.heavy_infantry_captain_camp_officer: ""ทักทาย ชื่อของข้าคือ[local_character.GetFullName] ข้าสวมเกราะหนักและโล่ในราชการของกองทหารรักษาการณ์[location.GetNameNoTooltip] ทำมาหลายปีแล้ว แต่ลูกธนูล่าสุดเกือบจะปลิดชีวิตข้า และข้าก็เริ่มคิดว่าชีวิตมีอะไรมากกว่านี้"\n\n"
 ep3_travel_option_events.0001.light_infantry_captain_camp_officer: ""ข้าคือ[local_character.GetFullName] ทหารประจำการในกองทหารรักษาการณ์[location.GetNameNoTooltip] ตีแล้วหนี ขว้างหอก คว้าโล่เล็กและกริช — แล้วเข้าไปสังหาร ข้ารับใช้ที่นี่มานานพอแล้ว โลกมีอะไรให้มากกว่านี้"\n\n"
 ep3_travel_option_events.0001.pike_captain_camp_officer: ""ข้ารับใช้เป็นพลหอกในกองทหารรักษาการณ์[location.GetNameNoTooltip]มาหลายปี ข้ารู้ว่าต้องทำอย่างไร — ตั้งมั่น เผชิญหน้าศัตรู และรอรับการบุกโจมตีด้วยจิตใจที่แข็งแกร่งดุจเหล็กกล้า"\n\n"
 ep3_travel_option_events.0001.master_of_spoils_camp_officer: ""สวัสดี ข้าคือ[local_character.GetFullName] ข้าเบื่อที่จะอยู่คนเดียวขณะปล้นผู้คนตามถนนหนทาง ทองคำไม่มีความหมายหากไม่มีใครให้แบ่งปันด้วย... ท่านและคณะของท่านดูแข็งแกร่งมาก"\n\n"
 ep3_travel_option_events.0001.fallback: ""สวัสดี ข้าคือ[local_character.GetFullName] ข้าเบื่อที่จะเดินทางไปในดินแดนเหล่านี้ตามลำพัง ข้าทำงานแปลกๆ มามากมาย แต่ข้าไม่อยากจะอยู่กับที่อีกต่อไปแล้ว"\n\n"
 
 ep3_travel_option_events.0001.excellent: ""ข้าคือปรมาจารย์ในงานฝีมือของข้า" [local_character.GetSheHe|U] กล่าวอย่างมั่นใจ "เมื่อมีข้าอยู่เคียงข้างท่าน ท่านจะไร้เทียมทาน""
 ep3_travel_option_events.0001.good: ""ทักษะของข้าสามารถรับใช้ท่านได้ดี" [local_character.GetSheHe|U] กล่าวต่อ "เราจะหารือเรื่องค่าจ้างกันหรือไม่?""
 ep3_travel_option_events.0001.average: ""ข้ายินดีที่จะเข้าร่วมค่ายของท่าน" [local_character.GetSheHe|U] กล่าวต่อ "เหรียญเพียงไม่กี่เหรียญก็เพียงพอที่จะล่อข้าให้ออกจากที่นี่ได้""
 ep3_travel_option_events.0001.poor: ""ข้าอาจไม่ใช่คนที่ดีที่สุด แต่ข้ายินดี" [local_character.GetSheHe|U] กล่าว "เพียงแค่ทองคำไม่กี่ชิ้น ข้าก็จะเข้าร่วมค่ายของท่าน""
 ep3_travel_option_events.0001.terrible: ""โปรดเมตตาข้าผู้น่าสงสารและไร้ประโยชน์ด้วยเถิด!" [local_character.GetSheHe|U] หมอบคลาน "ข้าจะทำทุกอย่างเพื่อเหรียญ — ข้าจะแม้กระทั่งล้างส้วมด้วย#EMPรอยยิ้ม#!""
