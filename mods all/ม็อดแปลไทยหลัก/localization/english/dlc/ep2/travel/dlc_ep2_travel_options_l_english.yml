 # New Travel Options
 experienced_captains_option:0 "ว่าจ้างกัปตันผู้ช่ำชอง"
 experienced_captains_option_desc:0 "ท่านจะส่งข่าวเรียกกัปตันผู้มีประสบการณ์ให้เข้าร่วมคณะเดินทางของท่าน ซึ่งจะช่วยลดอันตรายจากการเดินทางข้ามทะเลและมหาสมุทรได้อย่างมาก"
 captain_recruited.t:0 "ว่าจ้างกัปตันแล้ว"
 captain_recruited.tt:0 "นักเดินเรือผู้มีลักษณะนิสัย [GetTrait('forder').GetName( GetNullCharacter )] จะเข้าร่วมคณะผู้ติดตามของท่าน $temporary_travel_character_limit_tt$"
 
 hire_experienced_mercenaries_option:0 "ว่าจ้างทหารรับจ้างคุ้มกัน"
 hire_experienced_mercenaries_option_desc:0 "ท่านจะว่าจ้างทหารรับจ้างผู้กรำศึกให้เข้าร่วมคณะเดินทางในฐานะผู้คุ้มกัน เพื่อเพิ่มความปลอดภัยและความเร็วโดยรวม"
 mercenary_leader.t:0 "ว่าจ้างหัวหน้าทหารรับจ้างแล้ว"
 mercenary_leader_recruited.tt:0 "ผู้นำกลุ่ม[mercenary|E] จะเข้าร่วมคณะผู้ติดตามของท่าน $temporary_travel_character_limit_tt$"
 available_mercenary.tt:0 "มี[mercenary|E]ที่ว่างและยังไม่ถูกจ้างอยู่ในระยะ"

 hire_jungle_expert_option:0 "ว่าจ้างผู้ชำนาญป่าดงดิบ"
 hire_jungle_expert_option_desc:0 "ท่านจะส่งข่าวเรียกผู้เชี่ยวชาญภูมิประเทศป่าดงดิบให้เข้าร่วมคณะเดินทางของท่าน ซึ่งจะช่วยลดอันตรายจากการเดินทางข้ามภูมิประเทศป่าดงดิบได้อย่างมาก"
 jungle_stalker_recruited.t:0 "ว่าจ้างผู้ชำนาญป่าดงดิบแล้ว"
 jungle_stalker_recruited.tt:0 "ผู้นำทางผู้มีลักษณะนิสัย [GetTrait('jungle_stalker').GetName( GetNullCharacter )] จะเข้าร่วมคณะผู้ติดตามของท่าน $temporary_travel_character_limit_tt$"

 hire_mountaineer_option:0 "ว่าจ้างนักปีนเขา"
 hire_mountaineer_option_desc:0 "ท่านจะส่งข่าวเรียกผู้เชี่ยวชาญภูมิประเทศภูเขาให้เข้าร่วมคณะเดินทางของท่าน ซึ่งจะช่วยลดอันตรายจากการเดินทางข้ามยอดเขาสูงได้อย่างมาก"
 mountaineer_recruited.t:0 "ว่าจ้างนักปีนเขาแล้ว"
 mountaineer_recruited.tt:0 "ผู้นำทางผู้มีลักษณะนิสัย [GetTrait('rough_terrain_expert').GetName( GetNullCharacter )] จะเข้าร่วมคณะผู้ติดตามของท่าน $temporary_travel_character_limit_tt$"

 hire_forder_option:0 "ว่าจ้างผู้ชำนาญพื้นที่ชุ่มน้ำ"
 hire_forder_option_desc:0 "ท่านจะส่งข่าวเรียกผู้เชี่ยวชาญภูมิประเทศพื้นที่ชุ่มน้ำให้เข้าร่วมคณะเดินทางของท่าน ซึ่งจะช่วยลดอันตรายจากการเดินทางผ่านพื้นที่ชุ่มน้ำและที่ราบน้ำท่วมถึงได้อย่างมาก"
 forder_recruited.t:0 "ว่าจ้างผู้ชำนาญพื้นที่ชุ่มน้ำแล้ว"
 forder_recruited.tt:0 "ผู้นำทางผู้มีลักษณะนิสัย [GetTrait('forder').GetName( GetNullCharacter )] จะเข้าร่วมคณะผู้ติดตามของท่าน $temporary_travel_character_limit_tt$"
 wetlands_danger_reduction.tt:0 "[travel|E] [travel_danger|E] ในจังหวัดที่มีภูมิประเทศพื้นที่ชุ่มน้ำหรือที่ราบน้ำท่วมถึง: @travel_danger_icon!#P -25#!"

 hire_rough_terrain_expert_option:0 "ว่าจ้างผู้นำทางป่าไม้"
 hire_rough_terrain_expert_option_desc:0 "ท่านจะส่งข่าวเรียกผู้เชี่ยวชาญภูมิประเทศป่าไม้ให้เข้าร่วมคณะเดินทางของท่าน ซึ่งจะช่วยลดอันตรายจากการเดินทางผ่านป่าได้อย่างมาก"
 rough_terrain_expert_recruited.t:0 "ว่าจ้างผู้นำทางป่าไม้แล้ว"
 rough_terrain_expert_recruited.tt:0 "ผู้นำทางผู้มีลักษณะนิสัย [GetTrait('forest_fighter').GetName( GetNullCharacter )] จะเข้าร่วมคณะผู้ติดตามของท่าน $temporary_travel_character_limit_tt$"

 hire_desert_warrior_option:0 "ว่าจ้างนักรบทะเลทราย"
 hire_desert_warrior_option_desc:0 "ท่านจะส่งข่าวเรียกผู้เชี่ยวชาญภูมิประเทศทะเลทรายให้เข้าร่วมคณะเดินทางของท่าน ซึ่งจะช่วยลดอันตรายจากการเดินทางผ่านดินแดนแห้งแล้งได้อย่างมาก"
 desert_warrior_recruited.t:0 "ว่าจ้างนักรบทะเลทรายแล้ว"
 desert_warrior_recruited.tt:0 "ผู้นำทางผู้มีลักษณะนิสัย [GetTrait('desert_warrior').GetName( GetNullCharacter )] จะเข้าร่วมคณะผู้ติดตามของท่าน $temporary_travel_character_limit_tt$"

 court_physician_option:1 "นำอุปกรณ์การแพทย์ไปด้วย"
 court_physician_option_suffix: "#weak (ป้องกันได้เฉพาะโรคระบาด)#!"
 court_physician_option_desc:2 "ท่านจะนำอุปกรณ์การแพทย์จำนวนมากติดตัวไปด้วยในการเดินทางเพื่อลด[travel_danger|E]จาก[epidemics|E]"
 court_physician_option_tt: "ท่านต้องจ้าง[GetCourtPositionType('court_physician_court_position').GetName]ที่มีสิทธิ์เดินทาง"

 cultural_ambassador_option:0 "ว่าจ้างทูตวัฒนธรรม"
 cultural_ambassador_option_desc:0 "ท่านว่าจ้างบุคคลหนึ่งให้ทำหน้าที่เป็นทูตวัฒนธรรมในการเดินทางของท่าน เพื่อเผยแพร่ข้อมูลเกี่ยวกับวัฒนธรรมของท่านไปยังทุกบารอนีที่ท่านเดินทางผ่าน"
 cultural_ambassador_recruited.t:0 "ว่าจ้างทูตวัฒนธรรมแล้ว"
 cultural_ambassador_recruited.tt:0 "เอกอัครราชทูตทางวัฒนธรรมผู้มี[diplomacy|E]สูง จะถูกเกณฑ์เข้าสู่คณะผู้ติดตามของท่าน $temporary_travel_character_limit_tt$"

 fancy_mounts_option:0 "พาหนะชั้นเลิศ"
 fancy_mounts_option_desc:0 "คนดูแลคอกม้าผู้มีประสบการณ์ของท่านจัดเตรียมพาหนะที่ดีที่สุดในอาณาจักรให้กับคณะเดินทางของท่าน"
 
 military_recruits_option:0 "ฝึกฝนอัศวิน"
 military_recruits_option_desc:0 "ท่านนำอัศวินที่อ่อนแอที่สุดของท่านไปด้วยเพื่อฝึกฝนและเรียนรู้จากความท้าทายที่จะเผชิญบนเส้นทาง"
 military_recruits_option.t:0 "อัศวินเข้าร่วมคณะเดินทาง"
 military_recruits_option.desc:0 "อัศวินที่ไร้ฝีมือที่สุดของท่านถูกเพิ่มเข้ามาในคณะเดินทาง เนื่องจากท่านเลือกตัวเลือกการเดินทาง $military_recruits_option$"
 travel_events.0060.notification.a:0 "ลักษณะนิสัยอัศวินพัฒนาขึ้น: [selected_knight.GetShortUIName]"
 travel_events.0060.notification_desc:0 "ทักษะของ[selected_knight.GetShortUINamePossessive]เพิ่มขึ้นจากประสบการณ์ที่ได้รับขณะเดินทางในคณะของท่าน#"
 travel_events.0060.notification.b:0 "อัศวิน #EMP พัฒนาขึ้นอย่างมาก#!"
 travel_events.0060.notification.c:0 "อัศวินพัฒนาขึ้น"
 travel_events.0060.notification.d:0 "อัศวินได้รับเกียรติยศ"

 superior_armaments_option:0 "ยุทโธปกรณ์ชั้นเลิศ"
 superior_armaments_option_desc:0 "ช่างตีเหล็กชั้นยอดของท่านจัดเตรียมอุปกรณ์และการเตรียมพร้อมที่ดีที่สุดสำหรับการเดินทางให้กับคณะของท่าน"

 anxious_option:0 "เร่งเดินทาง"
 anxious_option_desc:0 "โลกนี้เป็นสถานที่มืดมนและอันตราย ทางที่ดีควรรีบเร่งการเดินทางให้มากที่สุดเท่าที่จะเป็นไปได้"
 circumspect_option:0 "รอบคอบระมัดระวัง"
 circumspect_option_desc:0 "อย่าให้พวกเขารู้การเคลื่อนไหวครั้งต่อไปของท่าน"
 
 purchase_rough_terrain_gear_option: "จัดซื้ออุปกรณ์ผู้บุกเบิก"
 purchase_rough_terrain_gear_option_desc: "การเดินทางข้ามภูเขาและหนองบึงเป็นเรื่องท้าทาย — สำหรับผู้ที่ไม่ได้เตรียมพร้อม! ท่านจะซื้อตะขอปีนเขา เชือกเสริม และอุปกรณ์ทุกชนิดที่จำเป็นในการเดินทางข้ามเส้นทางที่อันตรายที่สุด"
 
 purchase_desert_gear_option: "จัดซื้อชุดนักสำรวจแดนแล้ง"
 purchase_desert_gear_option_desc:0 "ท่านจะซื้อผ้าคลุมหน้าเพื่อป้องกันทรายเข้าหน้า และอูฐที่แข็งแรงเพื่อช่วยในการเดินทางของท่าน"
 
 purchase_forest_gear_option: "จัดซื้อชุดอุปกรณ์ป่าดง"
 purchase_forest_gear_option_desc:0 "ป่าไม้ไม่รู้จักนาย — แต่ท่านจะ ทำให้มันเชื่องด้วยมีดยาว เลื่อย ขวาน และจาระบีล้อเสริม#EMPจำนวนมาก#! "
 
 adventurers_encourage_relationships_option: "ส่งเสริมความสัมพันธ์"
 adventurers_encourage_relationships_option_desc:0 "สายสัมพันธ์ที่แท้จริงและยั่งยืนไม่อาจบังคับได้ มันเกิดขึ้นจากความยากลำบากที่เผชิญร่วมกัน ถนนหนทางอาจเป็นนายหญิงที่โหดร้าย แต่สำหรับทุกความท้าทายที่เอาชนะได้ ความสัมพันธ์ใหม่ก็อาจก่อตัวขึ้น"
 adventurers_encourage_relationships_option.tt: "[followers|E]ของท่านอาจสร้าง[friendships|E] กลายเป็น[lovers|E] หรือ[marry|E]กันเองโดยธรรมชาติ — ไม่ว่าจะกับกันเองหรือกับ[wanderers|E]ขณะที่ท่าน[travel|E]ผ่าน[baronies|E] ทุกความสัมพันธ์ที่เกิดขึ้นด้วยวิธีนี้จะมอบ[prestige_i][prestige|E]ให้ท่าน\n#weak ([children|E] [spouses|E] หรือผู้อื่นที่ท่านห่วงใยจะไม่[marry|E]หรือมี[lovers|E] สิ่งนี้จะไม่ทำให้[followers|E]กลายเป็น[GetTrait('adulterer').GetName( GetNullCharacter )])#!"
 ep3_travel_option_events.0002.title: "[ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('courtier_to_marry'))|U]ของท่าน [courtier_to_marry.GetFirstName] แต่งงานกับ [marriage_material.GetFirstName]"
 ep3_travel_option_events.0003.title: "[ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('courtier_to_befriend'))|U]ของท่าน [courtier_to_befriend.GetFirstName] ผูกมิตรกับ [friend_target.GetFirstName]"
 ep3_travel_option_events.0004.title: "[ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('courtier_to_love'))|U]ของท่าน [courtier_to_love.GetFirstName] และ [pls_love_me.GetFirstName] กลายเป็นคู่รักกัน"
 
 adventurers_search_for_secrets_option: "ค้นหาความลับ"
 adventurers_search_for_secrets_option_desc:0 "ข่าวลือคือแผนที่สู่ขุมทรัพย์แห่งความลับ — แต่ต้องใช้สติปัญญาอันหลักแหลมในการติดตามมัน X คือจุดหมาย!"
 adventurers_search_for_secrets_option.tt: "เมื่อเดินทางผ่าน[barony|E] ท่านอาจเรียนรู้[secret|E]ของใครบางคนที่อาศัยอยู่ที่นั่น\n#weak (โอกาส % เท่ากับ[intrigue_i]ของท่าน)#!"
 adventurers_search_for_secrets_option.title: "[GetTravelOption('adventurers_search_for_secrets_option').GetName] สำเร็จ!"
 
 adventurers_proselytize_zealously_option: "เผยแผ่ศาสนาแก่คนท้องถิ่น"
 adventurers_proselytize_zealously_option_desc:0 "ในดินแดนอันห่างไกลของโลก พวกเขายังไม่เคยได้ยินถึงศรัทธาที่แท้จริง เป็นหน้าที่อันศักดิ์สิทธิ์ของเราที่จะแก้ไขสิ่งนี้"
 adventurers_proselytize_zealously_option.tt: "เมื่อเดินทางผ่าน[barony|E] ท่านอาจเปลี่ยน[wanderer|E]ที่อาศัยอยู่ที่นั่นให้มานับถือ[faith|E]ของท่านและได้รับ[piety_i][piety|E]\n#weak (โอกาส % เท่ากับ[learning_i]ของท่าน)#!"
 adventurers_proselytize_zealously_option.title: "[wanderer_to_convert.GetShortUIName] เปลี่ยนมานับถือ [ROOT.Char.GetFaith.GetName]!"
 
 adventurers_gather_inspiration_option: "รวบรวมแรงบันดาลใจ"
 adventurers_gather_inspiration_option_desc:0 "มีแรงบันดาลใจมากมายให้ค้นพบบนเส้นทาง — ทิวทัศน์ที่สวยงาม สถานที่สำคัญที่น่าประทับใจ และผู้คนที่น่าทึ่งให้พบเจอ มันกระตุ้นบ่อน้ำแห่งความคิดอย่างแท้จริง!"
 adventurers_gather_inspiration_option.tt: "เมื่อเดินทางผ่าน[barony|E] [follower|E]แบบสุ่มมีโอกาสที่จะได้รับ[inspired|E]\n#weak (โอกาส % เท่ากับหนึ่งในหกของ[stewardship_i]ของท่าน)#!"
 adventurers_gather_inspiration_option.title: "[ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('inspired_follower'))|U]ของท่าน [inspired_follower.GetFirstName] ได้รับแรงบันดาลใจ!"
 adventurers_gather_inspiration_option.effect: "[inspired_follower.GetUIName] ได้รับ [inspired_follower.GetCurrentInspiration.GetName] - [inspired_follower.Custom('InspirationTypeDescriptionFuturePresent')]\n\n[inspired_follower.Custom('InspiredPersonQuality')]"
 
 adventurers_make_local_deals_option: "การต่อรองเดิมพันสูง"
 adventurers_make_local_deals_option_desc:0 "มีข้อตกลงให้ทำได้#EMPเสมอ#! หากผู้คนรู้จักท่าน พวกเขาก็จะไว้วางใจท่าน และเต็มใจที่จะต่อรอง โชคไม่ดีที่มันหมายความว่าโจรก็รู้#EMPเช่นกัน#! ว่าจะเล็งเป้าหมายไปที่ใคร..."
 adventurers_make_local_deals_option.tt: "ยามเมื่อยาตราผ่าน [barony|E] ท่านจักได้รับ #V 25%#! ของมูลค่า [loot|E] ของที่ดิน เป็น [gold_i][gold|E]\n#weak (จักรับทองได้เพียงคราเดียวต่อหนึ่งที่ดิน)#!"
 
 adventurers_scout_for_talent_option: "เสาะหาผู้มีความสามารถ"
 adventurers_scout_for_talent_option_desc:0 "มีบุคคลผู้เจนโลกมากมายให้พบเจอระหว่างการเดินทางของท่าน — บางคนในนั้นย่อมกำลังมองหางานอย่างแน่นอน!"
 adventurers_scout_for_talent_option.tt: "เปิดใช้งานเหตุการณ์เพื่อเกณฑ์[wanderers|E]ด้วย[gold_i][gold|E]หากท่านมีตำแหน่งว่างสำหรับ[officers|E]"
