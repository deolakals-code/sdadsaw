 # Honse Anchery

 ep2_tournament_events.6501.t:1 "$tournament_contest_header$ ชื่อเสียงและโชคลาภ"
 ep2_tournament_events.6501.desc:1 "สายลมเบาๆ พัดผ่านทุ่งนาขณะที่ผู้เข้าแข่งขันอีกคนยิงธนู ฝูงชนให้ความเคารพและเงียบสงบ อันที่จริง เงียบและให้ความเคารพ #EMP เกินไป#! เล็กน้อย ข้าเกือบจะคิดว่าข้าได้ยินเสียงหาวท่ามกลางเสียงปรบมืออย่างสุภาพขณะที่สายธนูดังแผลงและลูกธนูปักเข้าเป้า\n\nข้าก้าวไปข้างหน้าเพื่อรับตาของข้า เสียงชื่นชมที่สุภาพ แต่กระจัดกระจายตามมา มันแทบจะไม่ใช่การรวมตัวที่มีชีวิตชีวา\n\nขณะที่ข้าขึ้นสายธนู ความคิดหนึ่ง — ไม่ใช่ความคิดที่ดีนัก แต่เป็นความคิดที่น่าตื่นเต้น — ล่องลอยเข้ามาในความคิดของข้า\n\nมาดูกันว่าพวกเขาจะหาวผ่านสิ่งนี้ไปได้อย่างไร!"
 ep2_tournament_events.6501.a:0 "ข้าจะถูกจดจำไปชั่วชีวิต!"
 ep2_tournament_events.6501.a.tt.win:1 "ท่านยิงโดนเป้าขณะทรงตัวบนขาเดียวบนเสารั้ว"
 ep2_tournament_events.6501.a.tt.lose:0 "ท่านลื่นล้ม"
 ep2_tournament_events.6501.b:0 "ข้าจะให้บางอย่างแก่พวกเขาเพื่อเชียร์!"
 ep2_tournament_events.6501.b.tt.win:1 "ท่านยิงโดนเป้าขณะปิดตา"
 ep2_tournament_events.6501.b.tt.lose:1 "ท่านยิงพลาด"
 ep2_tournament_events.6501.c:0 "คิดดูอีกที..."

 ep2_tournament_events.6502.t:1 "$tournament_contest_header$ แขนและขา" # Note: Title seems slightly off for the description, but translating as is.
 ep2_tournament_events.6502.desc:2 "ภาพและเสียงของการประลองทวนบนหลังม้าเป็นสิ่งที่น่าชมเสมอ เสียงหอกปะทะโล่ดังฝ่าเสียงกีบม้าที่ดังสนั่นขณะที่ม้ารอคอยส่งเสียงร้องและพ่นลมหายใจ\n\nขณะที่ข้ากำลังฟังอย่างตั้งใจ เสียงอื่นก็ดังขึ้นในสนาม เสียงร้องสั้นๆ แหลมๆ นำหน้าเสียงความโกลาหลที่รวมตัวกัน ข้ารีบไปรวมกลุ่มด้วย\n\nวงล้อมของผู้คนล้อมรอบ [versus_contestant.GetFirstName] ซึ่งเห็นได้ชัดว่าตกจากม้าของ [versus_contestant.GetHerHis] ก่อนการแข่งขันของ [versus_contestant.GetHerHis] แขนของ [versus_contestant.GetHerHis|U] ห้อยในมุมที่ค่อนข้างน่าสยดสยอง เป็นความเมตตาเล็กน้อยแล้ว ที่ [versus_contestant.GetSheHe] ดูเหมือนจะค่อนข้างมึนงงด้วย"
 ep2_tournament_events.6502.a:0 "เอาล่ะ มาช่วยท่านลุกขึ้น!"
 ep2_tournament_events.6502.a.tt:0 "ใช่ ช่วยท่านลุกขึ้น ด้วย #EMP แขน#! นั้น..."
 ep2_tournament_events.6502.b:0 "ตามหมอของข้ามา!"
 ep2_tournament_events.6502.b.tt.success:0 "[physician.GetFirstNameNoTooltip] ทำได้ดีมาก"
 ep2_tournament_events.6502.b.tt.failure:0 "[physician.GetFirstNameNoTooltip] ช่วยอะไรไม่ได้มากนัก"
 ep2_tournament_events.6502.c:0 "ไปหาความช่วยเหลือให้ท่านกันเถอะ"
 ep2_tournament_events.6502.d:0 "คนโง่ควรจะจับให้แน่นกว่านี้"

 ep2_tournament_events.6503.t:2 "$tournament_contest_header$ ยิงพลาด"
 ep2_tournament_events.6503.desc:2 "ข้าเฝ้าดูด้วยสายตาที่ช่ำชองขณะที่ [competitor1.GetFirstName] เริ่มเคลื่อน [competitor1.GetHerHis] เข้าหาเป้าหมาย ลูกศรดอกแรกพุ่งตรงและปักเข้าเป้า ดอกที่สองออกนอกลู่นอกทางมากกว่า #EMP มาก#! ทีเดียว\n\nเสียงร้องแหลม เสียงกรีดร้องโหยหวนดังแทรกอากาศ ลูกศรดอกที่สองไม่เพียงพลาดเป้า แต่ยังปลิวไปไกลจนตกอยู่ท่ามกลางกลุ่มผู้เข้าแข่งขันที่รออยู่ ตกลงไปปักที่ [competitor2.GetFirstName] อย่างแท้จริง!\n\nฝูงชนกรูกันเข้าไปหา [competitor2.GetWomanMan] ที่บาดเจ็บ [competitor2.GetSheHe|U] นอนหงายอยู่ กุมบาดแผล [competitor2.GetHerHis] ไว้ในความพยายามอย่างไร้ผลที่จะหยุดเลือด ลูกศรยังคงปักลึกครึ่งฝ่ามือในเนื้อ [competitor2.GetHerHis]"
 ep2_tournament_events.6503.a:0 "หลีกทาง! ข้ามียาของข้า"
 ep2_tournament_events.6503.b:1 "เรียกหมอ!"
 ep2_tournament_events.6503.c:0 "นี่ไม่ใช่เรื่องของข้าเลย"

