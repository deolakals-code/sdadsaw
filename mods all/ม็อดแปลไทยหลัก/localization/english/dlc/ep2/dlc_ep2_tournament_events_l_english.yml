l_english: 
 
 ep2_tournament_events.0001.t:1 "$tournament_versus_header$ นักสู้ผู้พิการ"
 ep2_tournament_events.0001.desc:0 "ข้าปัดฝุ่นผงออกจากดวงตา พลางทรงตัวให้มั่นคงขณะที่เสียงโห่ร้องและเสียงเชียร์ของฝูงชนดังกระหึ่มรอบตัว [versus_contestant.GetFirstName] อยู่ห่างออกไปเล็กน้อย เราทั้งคู่ต่างถอยห่างกันชั่วครู่เพื่อพักหายใจ\n\nเสียงโห่ร้องของผู้ดูค่อยๆ เงียบลงเมื่อเราเริ่มเดินวนหากันอย่างช้าๆ การเคลื่อนไหวผิดพลาดเพียงครั้งเดียวอาจตัดสินผลการต่อสู้ได้ในทันที ดวงตาของ [versus_contestant.GetFirstNamePossessiveNoTooltip] หรี่ลงแทบจะมองไม่เห็น\n\nขณะที่เราเดินวนกัน ข้าสังเกตเห็นฝุ่นฟุ้งเล็กน้อยใต้เท้าขวาของ [versus_contestant.GetFirstNamePossessiveNoTooltip] ทุกครั้งที่ [versus_contestant.GetSheHe] ก้าวเดิน มันดูราวกับว่า [versus_contestant.GetFirstNameNoTooltip] กำลัง... เดินกะเผลกเล็กน้อย?"
 ep2_tournament_events.0001.a:0 "หากข้าเบี่ยงไปทางขวาตรงนี้ ข้าจะสามารถค้นหาความจริงได้..."
 ep2_tournament_events.0001.b:0 ""ฮ่า! ข้าจับเจ้าได้แล้ว!""
 ep2_tournament_events.0001.c:0 "[versus_contestant.GetFirstNamePossessiveNoTooltip] เสแสร้ง ข้าจะสู้ในแบบของข้า"
 ep2_tournament_events.0001.a.tt:0 "การเคลื่อนไหวของท่านจะพิสูจน์ว่าคู่ต่อสู้ของท่านกำลังเสแสร้งหรือไม่"
 ep2_tournament_events.0001.b.tt.win:0 "ขาของ [versus_contestant.GetFirstNamePossessiveNoTooltip] ได้รับบาดเจ็บ"
 ep2_tournament_events.0001.b.tt.lose:0 "[versus_contestant.GetFirstNameNoTooltip] กำลังเสแสร้ง"

 ep2_tournament_events.0002.t:1 "$tournament_versus_header$ เอาใจฝูงชน"
 ep2_tournament_events.0002.desc:0 "#EMP ตุ้บ!#!\n\nร่างของข้ากระแทกเข้ากับกำแพงไม้ที่ขอบสนามประลอง [versus_contestant.GetFirstName] เหวี่ยงข้าไปที่นั่นด้วยเสียงคำราม ทันทีที่[versus_contestant.GetSheHe]ทำ เช่นนั้น ใบหน้าของ[versus_contestant.GetFirstNamePossessiveNoTooltip]ก็เปลี่ยนเป็นรอยยิ้มเยาะเย้ย และที่น่าประหลาดใจคือ[versus_contestant.GetSheHe]หันหลังให้ข้าโดยสิ้นเชิง\n\nยกแขนของ[versus_contestant.GetHerHis]ขึ้นสู่ฝูงชนที่โห่ร้อง [versus_contestant.GetSheHe]งอแขนของ[versus_contestant.GetHerHis]ขึ้นและเบ่งกล้ามเลียนแบบนักกล้าม[versus_contestant.GetWomanMan]พเนจร เสียงเชียร์จากฝูงชนดังขึ้นอีกครั้ง พวกชาวบ้านที่ไม่แน่นอนเหล่านั้นกำลังหลงเชื่อ!"
 ep2_tournament_events.0002.a:0 "#EMP นี่#! คือสิ่งที่ #EMP [ROOT.Char.GetWomanMan]# ที่แท้จริงเป็น!"
 ep2_tournament_events.0002.b:0 "เผชิญหน้าข้าสิ เจ้าคนขี้ขลาด!"
 ep2_tournament_events.0002.c:0 "ข้าจะสั่งสอน [versus_contestant.GetHerHim] ที่กล้าหันหลัง [versus_contestant.GetHerHis] ให้ข้า!"
 ep2_tournament_events.0002.a.tt:0 "เบ่งกล้ามให้ฝูงชนดู!"
 ep2_tournament_events.0002.c.tt:0 "โจมตีพวกเขาจากด้านหลัง"

 ep2_tournament_events.0003.t:1 "$tournament_versus_header$ การขอความเมตตาที่ถูกโต้แย้ง"
 ep2_tournament_events.0003.desc:0 "ฝุ่นฟุ้งกระจายรอบร่างของ[versus_contestant.GetFirstNamePossessive]ขณะที่[versus_contestant.GetSheHe]ล้มหงายหลังลงไปในดิน ข้ากำลังชนะการต่อสู้ครั้งนี้ และทุกคนก็รู้\n\nท่ามกลางเสียงอึกทึกครึกโครมจากฝูงชน [versus_contestant.GetFirstName] ลาก[versus_contestant.GetHerHim]self ไปที่หัวเข่าของ[versus_contestant.GetHerHis]และยื่นแขนทั้งสองข้างออกไป\n\n"พอแล้ว! ข้าพอแล้ว ไม่เอาอีกแล้ว" [versus_contestant.GetSheHe] ร้องออกมา"
 ep2_tournament_events.0003.desc.dread:0 "ข้าเห็นได้จากอาการสั่นเทาในร่างของ [versus_contestant.GetHerHis] ว่าไม่ใช่เพียงฝีมือของข้าเท่านั้นที่ ทำให้สูญเสียความตั้งใจที่จะสู้ [versus_contestant.GetFirstNameNoTooltip] หวาดกลัวข้า"
 ep2_tournament_events.0003.desc.wounded:0 "ความเจ็บปวดปรากฏชัดบนใบหน้าของ [versus_contestant.GetFirstNamePossessiveNoTooltip] [versus_contestant.GetSheHe] ไม่ใช่คนขี้ขลาด แต่คงเป็นเรื่องโง่เขลาหากพวกเขาจะสู้ต่อ"
 ep2_tournament_events.0003.desc.craven:0 "แม้ว่าบาดแผลของ [versus_contestant.GetFirstNamePossessiveNoTooltip] จากการประลองนี้จะชัดเจน แต่วิธีที่ [versus_contestant.GetSheHe] หลบตาข้าและตัวสั่นขณะที่ [versus_contestant.GetSheHe] อ้อนวอนนั้นทรยศต่อเหตุผลที่แท้จริงของการยอมจำนน: ความขี้ขลาดธรรมดา"
 ep2_tournament_events.0003.a:0 "เจ้ามันขี้ขลาดและน่าอัปยศ!"
 ep2_tournament_events.0003.b:0 "ข้าเข้าใจ โปรดลุกขึ้น การต่อสู้นี้จบลงแล้ว"
 ep2_tournament_events.0003.c:0 "บาดแผลของท่านดูร้ายแรง ไปหาหมอให้ท่านกันเถอะ"
 ep2_tournament_events.0003.d:0 "อย่าได้ท้าทายข้าอีก!"
 ep2_tournament_events.0003.e:0 "ท่านควรภูมิใจในการต่อสู้ของท่าน [versus_contestant.GetFirstNameNoTooltip]"

 ep2_tournament_events.0004.t:1 "$tournament_versus_header$ ความตายจากเบื้องบน"
 ep2_tournament_events.0004.desc:1 "ดาบของข้าปะทะกับดาบของคู่ต่อสู้ [versus_contestant.GetFirstNamePossessive] ประกายไฟกระเด็นเมื่ออาวุธทั้งสองเสียดสีกัน เราทั้งคู่ถอยกลับ เดินวนไปทางซ้าย\n\n[versus_contestant.GetFirstNameNoTooltip|U] เหวี่ยงดาบใส่ข้า ปลายดาบปักลงบนพื้นหลังจากผ่านร่างข้าไป รวดเร็วราวกับอสรพิษ ข้าก้าวเข้าไปเตะมันสุดแรง ดาบของ [versus_contestant.GetFirstNamePossessiveNoTooltip] หลุดจากมือ [versus_contestant.GetHerHis] หมุนคว้างไปในอากาศ ตกลงไป — ท่ามกลางความสยดสยองของเราทั้งคู่ — ท่ามกลางฝูงชน!\n\nเสียงกรีดร้องแหลมดังขึ้นในอากาศ เราทั้งคู่รีบไปดู [watching_crowd.GetFirstName] คุกเข่าอยู่ ดาบที่ลอยมากระแทกเข้าที่แขนของ [watching_crowd.GetHerHis] โดยตรง"
 ep2_tournament_events.0004.a:0 "[versus_contestant.GetFirstNameNoTooltip] เจ้า #EMP ทำได้อย่างไร#!?"
 ep2_tournament_events.0004.b:0 "[watching_crowd.GetFirstNameNoTooltip]! ท่านเป็นอะไรหรือไม่?"
 ep2_tournament_events.0004.b.success:0 "[watching_crowd.GetFirstNameNoTooltip] ยอมรับคำขอโทษของท่าน"
 ep2_tournament_events.0004.b.failure:0 "[watching_crowd.GetFirstNameNoTooltip] ไม่ให้อภัยท่าน"
 ep2_tournament_events.0004.c:0 "เอาล่ะ ไม่มีเวลาให้เสียแล้ว..."
 ep2_tournament_events.0004.c.tt:0 "ฟันใส่ขณะที่ [versus_contestant.GetSheHe] กำลังเสียสมาธิ!"

 ep2_tournament_events.0005.t:0 "$tournament_versus_header$ ไม่เลือกวิธีการ"
 ep2_tournament_events.0005.start:0 "ข้าเหวี่ยงแล้วเหวี่ยงอีก กระหน่ำใส่การป้องกันของ [versus_contestant.GetFirstNamePossessive] การผลักด้วยไหล่อย่างแรงส่ง [versus_contestant.GetHerHim] ลื่นถอยหลัง ขากางออก และข้าเห็นโอกาสทอง ด้วยสัญชาตญาณล้วนๆ ข้าเหวี่ยงขาเป็นวงกว้าง เท้ากระแทกเข้าที่หว่างขาของ [versus_contestant.GetHerHis] อย่างแรง #EMP ตุ้บ#!.\n\n"
 ep2_tournament_events.0005.eunuch:0 "การโจมตีตามด้วยการเหวี่ยงอย่างแรงของข้า ปะทะเข้ากับอาวุธของ [versus_contestant.GetFirstNamePossessiveNoTooltip] ดังเคร้ง มันผลัก [versus_contestant.GetHerHim] ให้ถอยหลังไป แต่ไหล่ของข้าก็ตกเมื่อนึกถึงรายละเอียดบางอย่างเกี่ยวกับ [versus_contestant.GetFirstNameNoTooltip]...\n\n"เตะข้าตรงนั้นก็ไร้ประโยชน์ [ROOT.Char.Custom('FormOfAddressForLiege')]!" [versus_contestant.GetSheHe|U] ตะโกนบอก พลางส่ายศีรษะของ[versus_contestant.GetHerHis] "อย่างน้อยก็ตั้งแต่เรื่องนั้นเกิดขึ้นล่ะนะ"\n\n #EMP จริงด้วยสิ#! [versus_contestant.GetFirstNameNoTooltip] เป็นขันที!"
 ep2_tournament_events.0005.pain:0 "[versus_contestant.GetFirstNameNoTooltip] ร้องออกมาเสียงดังระหว่างเสียงหอบ เสียงไอ และเสียงครวญคราง นิ้วที่สั่นเทาแทบจะจับอาวุธไม่อยู่ขณะที่ดวงตาของ [versus_contestant.GetHerHis] เหลือกทันทีด้วยความเจ็บปวด ภายในไม่กี่วินาที [versus_contestant.GetSheHe] ก็งอตัวลง แทบจะยืนไม่ไหว"
 ep2_tournament_events.0005.a:0 "ฮ่า! ข้าจับเจ้าได้แล้ว!"
 ep2_tournament_events.0005.b:0 "โอ้! โอ้ ขออภัย! ข้าไม่ได้ตั้งใจ!"
 ep2_tournament_events.0005.c:0 "อ่า ใช่ ข้าลืมเรื่องนั้นไป"

 ep2_tournament_events.0006.t:0 "$tournament_versus_header$ ช่องโหว่"
 ep2_tournament_events.0006.desc:0 "เสียงเหล็กเสียดสีกันดังก้องไปทั่วบริเวณขณะที่ [versus_contestant.GetFirstName] และข้าฟาดฟันกัน ขณะที่ [versus_contestant.GetSheHe] ถอยกลับ ข้าตามไป และเสียงดาบปะทะกันอีกครั้งส่งแรงสั่นสะเทือนขึ้นมาที่แขนของข้า\n\nทันใดนั้น โอกาสก็มาถึง: [versus_contestant.GetFirstNameNoTooltip] ลื่น เท้าของ [versus_contestant.GetHerHis] ไถล และข้าใช้ไหล่กระแทกเข้าที่กระดูกอกของ [versus_contestant.GetHerHis] ส่ง [versus_contestant.GetHerHim] ล้มลงไปกองกับพื้น\n\n[versus_contestant.GetFirstNameNoTooltip|U] ฟื้นตัวช้า และทันใดนั้นความคิดของข้าก็แวบกลับไปที่ตำราฝึกฝนที่ข้าใช้เวลาหลายชั่วโมงเรียนรู้ และสิ่งที่แปลกประหลาดที่พวกเขาแนะนำให้ทำหากมีความได้เปรียบที่ชัดเจนปรากฏขึ้น\n\nเกือบจะโดยไม่รู้ตัว ข้าเริ่มคลายเกลียวหัวท้ายดาบของข้า..."
 ep2_tournament_events.0006.a:0 "ในที่สุด! โอกาสมาแล้ว!"
 ep2_tournament_events.0006.a.tt:0 "ใช้หัวท้ายดาบเป็นอาวุธขว้าง!"
 ep2_tournament_events.0006.a.toast:0 "หัวท้ายดาบที่ถูกขว้างมาโดนหน้าท่าน!"
 ep2_tournament_events.0006.b:0 "รับไปซะ เจ้าคนพาล!"
 ep2_tournament_events.0006.b.tt:0 "เตะ [versus_contestant.GetWomanMan] ตอนที่พวกเขาล้มลงดีที่สุด..."
 ep2_tournament_events.0006.c:0 "ข้าควรปล่อยให้พวกเขาลุกขึ้นยืนก่อน"

 ep2_tournament_events.0007.t:0 "$tournament_versus_header$ ขอซื้อ..."
 ep2_tournament_events.0007.desc:0 "มีความสุขเพียงไม่กี่อย่างที่ยิ่งใหญ่เท่ากับการชนะการประลองอย่างง่ายดาย [versus_contestant.GetFirstName|U] คลานถอยหลังไปบนพื้นขรุขระ การฟาดฟันจากอาวุธของข้าแทบจะไม่ถูกปัดป้องขณะที่ข้าบุกเข้าไป การเหวี่ยงอย่างแรงอีกครั้งกระทบกับการป้องกันของ [versus_contestant.GetHerHis] และ [versus_contestant.GetSheHe] คว้าแขนข้าไว้ด้วยความสิ้นหวัง ข้ายิ้มแสยะ\n\n"เดี๋ยว #EMP เดี๋ยว!#!" [versus_contestant.GetFirstNameNoTooltip] กระซิบตะโกนใส่ข้าขณะที่เราต่อสู้กัน ดาบยังคงขัดกันอยู่ "ฟังข้าก่อน ข้าต้องการชัยชนะครั้งนี้!" การยักไหล่ครึ่งๆ กลางๆ ของข้า ทำให้ [versus_contestant.GetHerHim] ตื่นตระหนกยิ่งขึ้นไปอีก\n\n"หยุด! ข้าเป็น [versus_contestant.GetWomanMan] ที่ร่ำรวย ได้โปรด ข้าสามารถ ทำให้มันคุ้มค่าสำหรับท่านได้ ร้อย-... ร้อยเหรียญ เพื่อให้ท่านยอมแพ้!""
 ep2_tournament_events.0007.a:0 "ร้อยเหรียญ ท่านว่าอย่างนั้นรึ?"
 ep2_tournament_events.0007.b:0 "สมมติว่าเราไม่ต้องใช้ทองคำ แต่เพิ่มภาระผูกพันเข้าไป..."
 ep2_tournament_events.0007.c:0 "ท่านไม่สามารถซื้อทางออกจากเรื่องนี้ได้หรอก [versus_contestant.GetFirstNameNoTooltip]"
 
 ep2_tournament_events.0010.t:0 "$tournament_versus_header$ การพนันที่คำนวณไว้"
 ep2_tournament_events.0010.desc:0 "เวลาช้าลงเมื่อดาบของ [versus_contestant.GetFirstNamePossessive] โค้งลงมาจากด้านบน ใบดาบส่งเสียงหวีดหวิวผ่านอากาศ มันไม่ใช่การโจมตีเล็กน้อย หากข้ายังคงอยู่ที่เดิม มันจะสร้างความเสียหายให้ข้ามากเกินพอ\n\nเรื่องนี้ควรจะเป็นเรื่องง่าย เนื่องจากการโจมตีที่บ้าคลั่ง เช่นนี้เปิดช่องให้ผู้โจมตีถูกโต้กลับ แต่มีความรู้สึกกวนใจอยู่ที่หลังความคิดของข้า สีหน้าบิดเบี้ยว-คำรามที่ [versus_contestant.GetFirstNameNoTooltip] มีขณะที่ [versus_contestant.GetSheHe] เริ่มการโจมตีนั้นเข้าใจได้เมื่อพิจารณาถึงความพยายาม แต่ข้าคิดว่ามีความพึงพอใจเล็กน้อยอยู่ในนั้น ดวงตาของ [versus_contestant.GetHerHis|U] ก็ดูเหมือนจะเหลือบไปทางด้านข้างของข้าขณะที่ [versus_contestant.GetSheHe] เตรียมการเคลื่อนไหว นี่เป็นการลวงทั้งหมดหรือไม่?\n\nการโจมตีใกล้เข้ามาแล้ว ถึงเวลาต้องลงมือ"
 ep2_tournament_events.0010.a:0 "ข้าจับเจ้าได้แล้ว!"
 ep2_tournament_events.0010.a.success:0 "การโต้กลับของท่านได้ผล"
 ep2_tournament_events.0010.a.failure:0 "[versus_contestant.GetFirstNameNoTooltip] กำลังเสแสร้ง"
 ep2_tournament_events.0010.b:0 "ข้าขอป้องกันดีกว่าเสี่ยงโต้กลับ"
 ep2_tournament_events.0010.b.success:0 "การป้องกันของท่านสำเร็จ"
 ep2_tournament_events.0010.c:0 "อยู่รอดเพื่อสู้ในวันหน้าดีที่สุด"
 ep2_tournament_events.0010.c.tt:0 "การหลบไปด้านข้างง่ายๆ ทำให้เสียตำแหน่ง แต่ความรอบคอบเป็นส่วนที่ดีกว่าของความกล้าหาญในที่นี้"

 ep2_tournament_events.0011.t:0 "$tournament_versus_header$ ทางเลือกที่มีประโยชน์"
 ep2_tournament_events.0011.desc:0 "มันเกิดขึ้นในเสี้ยววินาที ขณะที่ดาบของเราปะทะกันเสียงดังสนั่น ด้ามดาบของ [versus_contestant.GetFirstNamePossessive] ลื่นผ่านไป กระแทกเข้าที่หลังมือถือดาบของข้า ข้าเซถอยหลังเพื่อหาพื้นที่ พลางกุมมือด้วยมืออีกข้าง ดาบถูกถือไว้อย่างอ่อนแรงข้างหน้าข้า\n\nความเจ็บปวดที่เต้นตุบๆ แผ่ซ่านขึ้นไปตามแขนขณะที่ข้าขยับนิ้วอย่างสงสัย มัน #EMP ดูเหมือน#! จะไม่ได้รับความเสียหายหนัก — หากเป็น เช่นนั้นเลย — แต่การตรวจสอบทำได้ยากขณะที่ข้าถอยหลังหลบการโจมตีจาก [versus_contestant.GetFirstNameNoTooltip] ที่กำลังรุกเข้ามา [versus_contestant.GetSheHe|U] ยิ้มกริ่ม เห็นความได้เปรียบอย่างชัดเจน และเหวี่ยงดาบอีกครั้งผ่านสีข้างข้าไป\n\nข้าไม่สามารถหลบไปเรื่อยๆ ได้ มือของข้าจะต้องได้รับการจัดการ ไม่ทางใดก็ทางหนึ่ง"
 ep2_tournament_events.0011.a:0 ""ฮ่า! เจ้าคิดว่าข้าฝึกด้วยมือเดียวรึ?!""
 ep2_tournament_events.0011.a.tt:0 "มือซ้ายของข้าก็ดีเท่ามือขวา!"
 ep2_tournament_events.0011.b:0 "มีเพียงสิ่งเดียวเท่านั้นสำหรับเรื่องนี้"
 ep2_tournament_events.0011.b.tt:0 "ถึงเวลาดูว่าบทเรียนมือข้างที่ไม่ถนัดนั้นได้ผลหรือไม่..."
 ep2_tournament_events.0011.b.success:0 "กลอุบายของท่านสำเร็จ"
 ep2_tournament_events.0011.b.failure:0 "[versus_contestant.GetFirstNameNoTooltip] ไม่สนใจ"
 ep2_tournament_events.0011.b.criticalfailure:0 "ท่านทำอาวุธหลุดมือไปเลย"
 ep2_tournament_events.0011.c:0 "ไม่ว่าจะเกิดอะไรขึ้น ข้าไม่ถอย!"
 ep2_tournament_events.0011.c.tt:0 "การเปลี่ยนไปใช้ท่าจับสองมืออาจบรรเทาความเจ็บปวดได้บ้าง แต่มันจะไม่ช่วยอะไรมากนักหากมือของข้าได้รับบาดเจ็บจริงๆ..."
 ep2_tournament_events.0011.c.opinion:0 "ผู้ดูทุกคนได้รับความเห็น #COLOR_GREEN +5#! ต่อท่าน"
 ep2_tournament_events.0011.c.success:0 "ท่านต่อสู้อย่างกล้าหาญ"
 ep2_tournament_events.0011.c.failure:0 "มือที่บาดเจ็บของท่านยอมแพ้"

 ep2_tournament_events.0012.t:0 "$tournament_versus_header$ สวมเสื้อคลุม"
 ep2_tournament_events.0012.desc:0 "ขณะที่ข้าก้าวไปข้างหน้าเพื่อปะทะกับ [versus_contestant.GetFirstName] [versus_contestant.GetSheHe] หยุดชะงักและลดอาวุธลง เสื้อคลุมของข้าพริ้วไหวรอบตัวในสายลมเบาๆ\n\n"ท่าน... จะสวมสิ่งนั้นหรือ?" [versus_contestant.GetSheHe|U] ถาม ใบหน้าของ [versus_contestant.GetHerHis] เต็มไปด้วยความสับสนและไม่น้อยไปกว่าความสงสัย "ข้าไม่ได้มาตัดสินแน่นอน ข้ามั่นใจว่าท่านดู #EMP ทันสมัย#! มาก"\n\nข้าไม่แน่ใจว่าข้าชื่นชมรอยยิ้มเยาะอย่างกะทันหันของ [versus_contestant.GetHersHis] หรือไม่"
 ep2_tournament_events.0012.intrigue:0 "มองผ่านคู่ต่อสู้ของข้าไป ข้าเห็นผู้หญิงคนหนึ่งในฝูงชนกำลังต่อสู้กับผ้าพันคอที่พัดปลิวไปตามลมที่พัดมาอีกครั้ง แผนการค่อยๆ ก่อตัวขึ้นช้าๆ แต่ก็ก่อตัวขึ้น..."
 ep2_tournament_events.0012.arrogant:0 "อันที่จริง ข้าอาจกล่าวได้ว่าข้าไม่ชื่นชมมันเลย [versus_contestant.GetSheHe] กล้าดีอย่างไรมาเยาะเย้ยข้าและเครื่อง แต่งกาย #EMP อันงดงาม#! ของข้า?!"
 ep2_tournament_events.0012.a:0 "ข้าจะแสดงให้ท่านเห็นว่าข้า #EMP ต่อสู้#! อย่างทันสมัยเพียงใด!"
 ep2_tournament_events.0012.b:0 "แน่ #EMP นอน#! ข้าจะไม่สู้ในชุดน- ย่าห์!"
 ep2_tournament_events.0012.b.tt:0 "มาดูกันว่า [versus_contestant.GetSheHe] จะสู้ได้ดีแค่ไหนเมื่อมีเสื้อคลุมโยนใส่หน้า [versus_contestant.GetHerHis]!"
 ep2_tournament_events.0012.c:0 "แน่นอนว่าไม่ โปรดรอสักครู่"
 ep2_tournament_events.0012.c.tt:0 "จริงๆ นะ 'เสื้อคลุมประลอง'? ข้า #EMP คิดอะไรอยู่#!?"
 ep2_tournament_events.0012.d:0 "ยอดฝีมือทุกคนเขาก็สู้กันแบบนี้ทั้งนั้นแหละ เจ้า [versus_contestant.Custom2('InsultNoun', ROOT.Char)]!"

 ep2_tournament_events.0020.t:0 "$tournament_versus_header$ การต่อสู้ด้วยคารม"
 ep2_tournament_events.0020.desc:1 "สายลมเบาๆ พัดผ่านรอบตัวเราขณะที่ [versus_contestant.GetFirstName] เข้ามาหาข้า ดาบเตรียมพร้อม ข้ามองหาความได้เปรียบใดๆ ดัง เช่นนักประลองที่ดีควรทำ ไม่มีพื้นไม่เรียบ ไม่มีแสงอาทิตย์ส่องตา [versus_contestant.GetHerHim] ไม่มีจุดอ่อนในท่าทางของ [versus_contestant.GetHerHis] ข้าเตรียมพร้อมที่จะสู้ อย่างยุติธรรม\n\nเสียงตะโกนจากฝูงชน — คนโง่บางคนตกจากเก้าอี้ ไม่ต้องสงสัย — ทำให้ [versus_contestant.GetFirstNameNoTooltip] หยุดชะงัก [versus_contestant.GetSheHe|U] กลับมาจดจ่อที่ข้าอีกครั้ง อย่างกระวนกระวาย ว่ากันว่าบางคนต้องการปราศจากสิ่งรบกวนเพื่อต่อสู้ บางที [versus_contestant.GetFirstNameNoTooltip] อาจเป็น [versus_contestant.GetWomanMan] เช่นนั้น?"
 ep2_tournament_events.0020.secret:0 "\n\nเกือบจะโดยไม่ได้ตั้งใจ ความรู้เล็กน้อยผุดขึ้นมาในหัวข้า ไม่ใช่ [versus_contestant.GetSheHe] หรือที่เป็นคน... อ่า ใช่ ใช่แล้ว!"
 ep2_tournament_events.0020.a:0 ""อะไรนะ [versus_contestant.GetFirstNameNoTooltip]? เจ้าทำ #EMP อะไรนะ?!#!""
 ep2_tournament_events.0020.a.tt:0 "เสียงดังฟังชัด เพื่อให้ทุกคนได้ยิน!"
 ep2_tournament_events.0020.b:0 "ข้ารู้ว่าเจ้าทำอะไร [versus_contestant.GetFirstNameNoTooltip]!"
 ep2_tournament_events.0020.b.tt:0 "กระซิบมัน ความลับที่บอกแก่ทุกคนไม่มีพลังอีกต่อไป!"
 ep2_tournament_events.0020.c:0 "การพูดเป็นจุดแข็งของข้าเสมอ"
 ep2_tournament_events.0020.c.success:0 "[versus_contestant.GetFirstNameNoTooltip] เสียสมาธิ เพราะคำพูดของท่าน"
 ep2_tournament_events.0020.c.failure:0 "[versus_contestant.GetFirstNameNoTooltip] ไม่เสียสมาธิ เพราะคำพูดของท่าน"
 ep2_tournament_events.0020.d:0 "ข้าควรจดจ่อกับการต่อสู้"

 ep2_tournament_events.0021.t:0 "$tournament_versus_header$ ความได้เปรียบใดๆ"
 ep2_tournament_events.0021.desc:0 "ดาบของ [versus_contestant.GetFirstNamePossessive] ครูดไปตามขอบดาบของข้า ประกายไฟกระจายขณะที่ข้าเซถอยหลัง [versus_contestant.GetSheHe|U] ยิ้มอย่างเคร่งขรึมเมื่อหลังของข้าชนกับขอบสนามประลอง และ [versus_contestant.GetSheHe] เดินวนเพื่อตัดทางข้ากับสิ่งกีดขวาง ข้าต้องการความได้เปรียบใดๆ ก็ตาม\n\nทันใดนั้น อย่างน่าอร่อย เศษเสี้ยวของการตระหนักรู้ว่ายเข้ามาในความคิดของข้า ข้าโง่เขลาเพียงใด! ในบรรดาสิ่งที่ต้องลืมทั้งหมด! บางทีตอนนี้อาจถึงเวลาที่จะใช้มัน...\n\n"เจ้าเสร็จแล้วหรือยัง [ROOT.Char.GetFirstName]?" [versus_contestant.GetSheHe|U] คำราม พลางชูอาวุธของ [versus_contestant.GetHerHis] "เจ้าดูเหมือนจะเสร็จแล้วสำหรับข้า""
 ep2_tournament_events.0021.a:0 ""แท้จริงแล้ว เจ้าพูดมากกว่า [family.GetFirstNameNoTooltip] เสียอีก""
 ep2_tournament_events.0021.b:0 ""[versus_contestant.Custom2('InsultNoun', ROOT.Char)|U] ข้า #EMP จัดการ#! [versus_contestant.Custom2('RelationToMeShort', SCOPE.sC('family') )] ของเจ้าแล้ว!""
 ep2_tournament_events.0021.c:0 "ไม่ยั่วยุ [versus_contestant.GetHerHim] น่าจะดีที่สุด..."

 # Melee

 ep2_tournament_events.1001.t:1 "$tournament_contest_header$ อาคารที่ถูกเผา"
 ep2_tournament_events.1001.desc:0 "ท่ามกลางเลือดและความโกลาหลของการตะลุมบอน แทบจะเป็นไปไม่ได้ที่จะรักษาทิศทาง มวลชนของผู้เข้าแข่งขันเบียดเสียดและโยกเยก - กองมนุษย์ที่ควบคุมไม่ได้ วิบัติจงมีแด่ผู้ใดก็ตามที่ขวางทางมัน! แน่นอน ชาวบ้านผู้โชคร้ายเพียงแค่ต้องรีบหลีกทางเพื่อหลีกเลี่ยงการทะเลาะวิวาท ปัญหานี้เด่นชัดขึ้นเล็กน้อย ข้าพิจารณา เมื่อเหยื่อคืออาคาร\n\nการตะลุมบอนได้ลุกลามเข้าไปใน [activity.GetCurrentPhase.GetLocation.GetBaronyNameExplicitly] อย่างแท้จริง และแม้กระทั่งตอนนี้ข้าก็เห็นผู้เข้าแข่งขันจากทั้งสองฝ่ายฉีกชิ้นส่วนของหน้าอาคารเพื่อใช้เป็นโล่ชั่วคราวหรือแม้กระทั่งขีปนาวุธ ข้าคิดว่าข้าได้ยินเสียงเปลวไฟแตกปะทุในระยะไกล..."
 ep2_tournament_events.1001.a:0 "หยุดนะ ไอ้พวกบ้า! สงบศึก!"
 ep2_tournament_events.1001.b:0 "ถ้าพวกเขาสู้กันที่นี่ ข้าก็จะสู้ด้วย"
 ep2_tournament_events.1001.c:0 "#EMP พอแล้ว!#! สงบศึก!"
 ep2_tournament_events.1001.c.success:0 "การตะลุมบอนหยุดลงชั่วคราว"
 ep2_tournament_events.1001.c.failure:0 "ไม่มีใครฟัง"
 ep2_tournament_events.1001.d:0 "บางทีถึงเวลาต้องไปแล้ว"

 ep2_tournament_events.1002.t:1 "$tournament_contest_header$ โครงการฟื้นฟู"
 ep2_tournament_events.1002.desc:0 "ข้าหลุดออกจากการต่อสู้อันดุเดือด มุ่งหน้ากลับไปยังค่าย แต่ในไม่ช้าข้าก็ตระหนักถึงการปรากฏตัวที่โกรธเกรี้ยว ซึ่งกำลังเข้ามาใกล้อย่างรวดเร็ว\n\n"ท่านมีอะไรจะแก้ตัวบ้าง?!" สีหน้าที่ไม่สะทกสะท้านของข้าแสดงให้เห็นถึงความสับสนของข้าต่อคำถามอย่างชัดเจน และสีหน้าของ[mayor.GetHerHis]ก็มืดลงไปอีก "หมู่บ้านของข้าอยู่ใน #EMP ซากปรักหักพัง!#!"\n\n[mayor.GetWomanMan]ที่ แต่งตัวดี — [mayor.GetFirstName] ตามที่[mayor.GetSheHe]แนะนำ[mayor.GetHerselfHimself]อย่างฉุนเฉียว — เป็นนายกเทศมนตรีของชุมชนที่ตอนนี้ค่อนข้างน่าสังเวช และเห็นได้ชัดว่าโทษข้าสำหรับสถานการณ์ที่เกิดขึ้น\n\n"แล้วไง? ท่านจะทำอะไรกับมัน? พวกเรากำลังจะสูญเสีย #EMP ทุกอย่าง#! ในฤดูหนาวหน้า!""
 ep2_tournament_events.1002.a:0 "บางทีข้าอาจช่วยท่านสร้างใหม่ได้?"
 ep2_tournament_events.1002.b:0 "ท่านช่างกล้าเสียจริง [mayor.GetFirstNameNoTooltip]"
 ep2_tournament_events.1002.b.tt:0 "ตัวเลือกนี้มีให้ เนื่องจากชื่อเสียงที่ [dread|E] ของท่าน"
 ep2_tournament_events.1002.c:0 "เอาล่ะ เอาล่ะ ข้าจะจ่าย"
 ep2_tournament_events.1002.d:0 "ไปให้พ้น! ข้าต้องการพักผ่อน!"

 ep2_tournament_events.1003.t:1 "$tournament_contest_header$ คมดาบที่ร่วงหล่น"
 ep2_tournament_events.1003.desc:0 "การตะลุมบอนปั่นป่วน กระหน่ำใส่ข้า ข้าถูกเหวี่ยงไปมา พยายามตอบโต้ให้สาสม ดาบฉีกเกราะ หอกกระทบกับแผ่นโลหะกลมของโล่\n\nอาวุธชิ้นหนึ่งฟาดผ่านสายตาข้า เล็งมาที่หัวข้า ข้าแทบจะไม่สามารถหลบได้ทัน หมุน [tournament_weapon.GetName] ของข้ารอบตัวเพื่อปัดป้อง การหลบหนีที่โชคดี\n\nข้าหันไปชู [tournament_weapon.GetType] อีกครั้ง เพียงเพื่อพบว่ามันถูกกระแทกหลุดจากมือข้าไปโดยสิ้นเชิง! มันตกลงสู่พื้นดินที่เต็มไปด้วยฝุ่น ถูกเตะไปมาโดยนักสู้ที่กำลังต่อสู้กัน"
 ep2_tournament_events.1003.a:0 "อ๊าก! อาวุธของข้า!"
 ep2_tournament_events.1003.a.tt.success:0 "ท่านเก็บมันกลับมาได้สำเร็จ"
 ep2_tournament_events.1003.a.tt.failure:0 "อาวุธถูกเตะออกไปไกลขึ้น"
 ep2_tournament_events.1003.b:0 "คงต้องรอทีหลัง"
 ep2_tournament_events.1003.b.tt:0 "อาวุธรองคงต้องพอใช้ไปก่อนสำหรับตอนนี้"

 ep2_tournament_events.1004.t:1 "$tournament_contest_header$ [comely_stray.Custom('GetLassLad')|U] ผู้หลงทาง"
 ep2_tournament_events.1004.desc:0 "แวบหนึ่ง ผ่านร่างที่กำลังต่อสู้กัน หมวกเกราะที่ฉีกขาด และฝุ่นที่หมุนวน นั่นคือวิญญาณหรือ? [comely_stray.GetSheHe|U] มีความงามราวกับนางฟ้าสำหรับ[comely_stray.GetHerHim]\n\nไม่ ไม่ใช่ มันไม่ใช่วิญญาณ: สลักอยู่บนใบหน้าที่น่ารักของ[comely_stray.GetHerHis]คือสีหน้าหวาดกลัวอย่างแท้จริงขณะที่[comely_stray.GetSheHe]มองหาทางออก\n\nทันทีที่ข้าอ้าปาก [comely_stray.GetSheHe]ก็สะดุดล้ม ข้อเท้าของ[comely_stray.GetHerHis]บิดจากการเหยียบหอกที่หลงทางอย่างงุ่มง่าม ดวงตาที่เศร้าสร้อยของ[comely_stray.GetHerHis]เอ่อล้นไปด้วยน้ำตาขณะที่[comely_stray.GetSheHe]หมอบหนีจากคมดาบที่หมุนวน"
 ep2_tournament_events.1004.a:0 "จับไว้แน่นๆ ที่รัก!"
 ep2_tournament_events.1004.a.tt:0 "ลืมการตะลุมบอนไปก่อน ข้ามีเรื่องสำคัญกว่าต้องทำ!"
 ep2_tournament_events.1004.c:0 "[rescuer_knight.GetFirstNameNoTooltip]! ช่วย [comely_stray.GetHerHim] ไปยังที่ปลอดภัย!"
 ep2_tournament_events.1004.d:0 "พวกเขาจะต้องดูแลตัวเอง"
 ep2_tournament_events.1004.d.escape.tt:0 "พวกเขาหนีไปได้อย่างปลอดภัย"
 ep2_tournament_events.1004.d.injured.tt:0 "พวกเขาได้รับบาดเจ็บ"
 ep2_tournament_events.1004.d.dead.tt:0 "พวกเขาพบจุดจบที่น่าเศร้า"

 ep2_tournament_events.1005.t:1 "$tournament_contest_header$ เล็งไปที่คอหอย"
 ep2_tournament_events.1005.desc:0 "รอบตัวข้า [ROOT.Char.GetWomenMen] ล้มลงจากการต่อสู้ที่ปั่นป่วน เลือดไหลอาบแขนขา โล่แตกเป็นสองท่อนเคียงข้างหอกที่หักและดาบที่ถูกทิ้งร้าง เกลื่อนกลาดในสนามรบ\n\nคู่ต่อสู้ไร้หน้าคนหนึ่งรุกเข้ามาหาข้า และข้าปัดป้องการโจมตีของ [ROOT.Char.GetHerHis] แรงสั่นสะเทือนเดินทางขึ้นมาตามแขนข้า ข้าหลบการโจมตีครั้งต่อไป พลาดด้วยการโจมตีของข้าเอง #X ก้าวเข้า#! ไปตามติด และ-\n\nการโต้กลับของพวกเขาพุ่งตรงมาใต้คางข้า หากข้ายังคงอยู่ที่เดิม มันคงพลาดไปแล้ว แต่กลับกลายเป็นว่าข้าถูกกระแทกเข้าที่คอหอยอย่างจัง ข้าเซถลาออกจากการต่อสู้ เอามือกุมบาดแผลอย่างช่วยไม่ได้ ทรุดลงคุกเข่า"
 ep2_tournament_events.1005.a:0 "...อึก!"
 ep2_tournament_events.1005.b:0 "ยอมจำนน! ข้ายอมจำนน..."
 ep2_tournament_events.1005.success: "ท้ายที่สุดก็เป็นแค่แผลถลอก"
 ep2_tournament_events.1005.fail: "จุดจบอันน่าสมเพช"
 ep2_tournament_events.1005.resign: "#V ท่าน#! ถอนตัวจากการประลอง"

 ep2_tournament_events.1006.t:0 "$tournament_header$ ถูกจับกุม"
 ep2_tournament_events.1006.start:0 "ข้ากระหน่ำใส่ [surrendering_knight.GetFirstName] ด้วยดาบของข้า ประกายไฟกระเด็นออกจากใบดาบขณะที่มันฉีกเกราะของ [surrendering_knight.GetHerHis] ถูกบังคับให้ถอยหลังและล้มลงด้วยการโจมตีที่หนักหน่วง ในที่สุด [surrendering_knight.GetSheHe] ก็โยนอาวุธของ [surrendering_knight.GetHerHis] ลงและยกแขนขึ้นเป็นสัญญาณยอมจำนน\n\n"
 ep2_tournament_events.1006.normal:0 "ข้าเดินนำ [surrendering_knight.GetFirstNameNoTooltip] ออกจากการต่อสู้ไปยังผู้ติดตามของข้า เพื่อจับตาดู [surrendering_knight.GetHerHim] ขณะที่ข้ากลับเข้าร่วมการต่อสู้ เป็นที่คาดหวังโดยทั่วไปว่าเชลยจะไถ่ตัวเองเพื่ออิสรภาพ [surrendering_knight.GetSheHe] ควรจะมีค่าไถ่เป็นจำนวนมาก!"
 ep2_tournament_events.1006.rival:0 "ข้าจ่ออาวุธไปที่ใบหน้าของ [surrendering_knight.GetFirstNamePossessiveNoTooltip] เพลิดเพลินกับความกลัวและความโกรธในดวงตาของ [surrendering_knight.GetHerHis] โดยปกติแล้วค่าไถ่เป็นทองคำหรืออุปกรณ์ก็เพียงพอสำหรับการยอมแพ้ แต่..."
 ep2_tournament_events.1006.broke:0 "ขณะที่ข้ารอคอยอย่างคาดหวัง [surrendering_knight.GetFirstNameNoTooltip] ถอนหายใจออกมา\n\n"ข้าจะไม่หลอกลวงท่าน ข้าไม่มีเงินจ่ายค่าไถ่ที่ท่านต้องการ นี่คือทั้งหมดที่ข้ามี" [surrendering_knight.GetSheHe|U] พูดอย่างเหนื่อยอ่อน ถือถุงเล็กๆ ที่เห็นได้ชัดว่ามีเหรียญน้อยมาก"
 ep2_tournament_events.1006.a:0 "เจ้าจะต้องเสียใจในวันที่เจ้าขวางทางข้า!"
 ep2_tournament_events.1006.b:0 "ข้าจะรับค่าไถ่!"
 ep2_tournament_events.1006.c:0 ""[artifact.GetNameNoTooltip]" รึ? ดูดีทีเดียว"
 ep2_tournament_events.1006.d:0 "เอาล่ะ ข้าคิดว่าข้าจะรับมันไว้"
 ep2_tournament_events.1006.e:0 "ไปเป็นอิสระเถิด คู่ต่อสู้ผู้สูงศักดิ์!"

 ep2_tournament_events.1007.t:0 "$tournament_header$ ที่หลบภัยอันแสนหวาน"
 ep2_tournament_events.1007.desc:0 "ด้วยความเหนื่อยล้า ข้าเดินโซเซเข้าไปในที่หลบภัยอันเรียบง่าย รอบตัวข้าคือผู้เข้าแข่งขันจากทั้งสองฝ่าย เกราะฉีกขาดและบิดเบี้ยว ดาบบิ่นและแตก ผู้ติดตามและคนรับใช้รีบวิ่งไปมาช่วยเหลือนายของตน\n\nข้าเห็นเพื่อนร่วมทีมสองสามคนกำลังพักฟื้น พวกเขาทักทายข้าอย่างเหนื่อยอ่อนขณะที่ข้าทรุดตัวลงข้างๆ พวกเขา เหนื่อยและปวดเมื่อย มองจากตำแหน่งในร่มของข้า ข้าเห็นพ่อค้าตลาดเจ้าความคิดกำลังเตรียมอาหารและเครื่องดื่มที่ประกอบขึ้นอย่างเร่งรีบเพื่อขายให้กับนักสู้ที่อ่อนล้า [teammate_1.GetFirstName] และ [teammate_2.GetFirstName] มองพ่อค้าด้วยความหวัง ขณะที่ [teammate_3.GetFirstName] พึมพำอะไรบางอย่างเกี่ยวกับการกล่าวสุนทรพจน์อย่างร่าเริงเสแสร้ง"
 ep2_tournament_events.1007.a:0 "กวักมือเรียกพ่อค้า"
 ep2_tournament_events.1007.a.tt.success:0 "เครื่องดื่ม ทำให้พวกท่านทุกคนสดชื่นขึ้น"
 ep2_tournament_events.1007.a.tt.bigsuccess:0 "อาหารและเครื่องดื่มยอดเยี่ยมมาก!"
 ep2_tournament_events.1007.a.result:1 "คะแนนทีมของท่าน #positive_value เพิ่มขึ้น#!"
 ep2_tournament_events.1007.a.bigresult:1 "คะแนนทีมของท่าน #positive_value เพิ่มขึ้นอย่างมาก#!"
 ep2_tournament_events.1007.b:0 ""มารวมกันตรงนี้ พวกเจ้า""
 ep2_tournament_events.1007.b.tt:0 "บางทีคำพูดที่สร้างแรงบันดาลใจอาจช่วยยกระดับจิตวิญญาณของพวกเขาได้?"
 ep2_tournament_events.1007.b.tt.success:0 "คำพูดของท่านฟื้นฟูความแข็งแกร่งของพวกเขา"
 ep2_tournament_events.1007.b.tt.failure:0 "สุนทรพจน์ดูเหมือนจะไม่มีผลกระทบมากนัก"
 ep2_tournament_events.1007.b.result:1 "คะแนนทีมของท่าน #positive_value เพิ่มขึ้น#!"
 ep2_tournament_events.1007.c:0 "ข้าควรปล่อยให้พวกเขาจัดการกันเองดีกว่า"

 ep2_tournament_events.1011.t:0 "$tournament_contest_header$ คู่ต่อสู้ผู้มีชื่อเสียง"
 ep2_tournament_events.1011.start:0 "ท่ามกลางเลือดและความโกลาหลของการตะลุมบอน ข้าสามารถมองเห็นร่างหนึ่งกำลังขี่ม้าเข้ามาหาข้า สัญลักษณ์ที่ห้อยจากคอม้าของพวกเขาเผยให้เห็นตัวตนของพวกเขาก่อนที่พวกเขาจะพูด: $knight_culture_player_no_tooltip_lowercase$ ผู้มีชื่อเสียงอย่างแท้จริงประดับสนามรบ\n\n"
 ep2_tournament_events.1011.unequal:0 ""[ROOT.Char.GetTitledFirstNameNoTooltip|U]!" [famous_knight.GetFirstName|U] คำรามเสียงดัง ควบม้าเข้ามาใกล้ด้วยฝีเท้าเร็ว เสียงดังชัดเจนข้ามสนามรบ [famous_knight.GetSheHe|U] ชูดาบของ [famous_knight.GetHerHis] ด้วยความชำนาญ เป็นผู้เชี่ยวชาญในสภาพแวดล้อมของ [famous_knight.GetHerHis] อย่างชัดเจน\n\n"ข้าต้องการประลองดาบกับท่าน มาเถิด เผชิญหน้าข้า และมาดูกันว่าใครในพวกเราจะแข็งแกร่งกว่า!""
 ep2_tournament_events.1011.equal:0 ""อ่า [ROOT.Char.GetTitledFirstNameNoTooltip|U]! นี่เป็นเกียรติอย่างแท้จริง!" [famous_knight.GetFirstName|U] ถอดหมวกเกราะของ [famous_knight.GetHerHis] ออกก่อนจะพูดต่อ\n\n"ในที่สุด $knight_culture_player_plural_no_tooltip_lowercase$ ที่ยิ่งใหญ่ที่สุดสองคนในโลกก็มาพบกัน ทหารผู้มีเกียรติสองคนที่แข่งขันกันในสนามรบอันนองเลือด เผชิญหน้ากันในที่สุด ข้าซ้อมช่วงเวลาแห่งโชคชะตานี้ในความฝันบ่อยเพียงใด! เครื่องราชกกุธภัณฑ์เพื่อสรุปความสูงส่งที่ไม่ได้เอ่ยออกมาของมิตรภาพของเรา—""
 ep2_tournament_events.1011.a:0 "มาดูกันว่ามิตรภาพนี้สูงส่งเพียงใด..."
 ep2_tournament_events.1011.a.tt:0 "การโยนก้อนดินใส่หน้า [famous_knight.GetHerHis] ขณะที่ [famous_knight.GetSheHe] กำลังพูดอยู่อาจเป็นการกระทำที่ไม่ซื่อสัตย์ แต่มันได้ผลแน่นอน!"
 ep2_tournament_events.1011.a.success:0 "ท่านชนะการต่อสู้"
 ep2_tournament_events.1011.a.failure:0 "ท่านแพ้การต่อสู้"
 ep2_tournament_events.1011.b:0 ""มาเถิด ศัตรูผู้สูงศักดิ์! ให้เราทดสอบตัวเองในการต่อสู้""
 ep2_tournament_events.1011.c:0 "ความรอบคอบอาจเป็นส่วนที่ดีกว่าของความกล้าหาญในที่นี้..."
 ep2_tournament_events.1011.d.success:0 "ท่านหลบหนีเข้าไปในการตะลุมบอนได้สำเร็จ"
 ep2_tournament_events.1011.d.failure:0 "[famous_knight.GetFirstNameNoTooltip] จับท่านได้"

 ep2_tournament_events.1012.t:0 "$tournament_contest_header$ จากพุ่มไม้"
 ep2_tournament_events.1012.desc:0 "พุ่มไม้แข็งแรงสั่นไหวและส่งเสียงกรอบแกรบขณะที่ข้าดันตัวผ่านไป ป่าละเมาะนี้อยู่ในจุดซุ่มโจมตีที่สมบูรณ์แบบ ติดกับเส้นทางไปยังจุดพักผ่อน\n\nข้าไม่ต้องรอนาน [caught_opponent.GetFirstName] เดินโซเซไปตามเส้นทาง เห็นได้ชัดว่ากำลังรอคอยการพักจากการต่อสู้ แสงแดดที่ส่องลอดใบไม้กระทบกับเกราะของ [caught_opponent.GetHerHis] ขณะที่เสียงใบไม้เสียดสีกันกลบเสียงการเข้าใกล้ของข้าผ่านพงหญ้า\n\nจับตาดู [caught_opponent.GetFirstNameNoTooltip] ในที่สุดข้าก็เข้าสู่ตำแหน่งที่ดีที่สุด ห่างจากจุดที่ [caught_opponent.GetSheHe] กำลังจะเหยียบเพียงสองก้าวเท่านั้น"
 ep2_tournament_events.1012.a:0 "ข้าเป็นเพียงเสียงกิ่งไม้เสียดสีกัน"
 ep2_tournament_events.1012.b:0 ""[caught_opponent.GetFirstNameNoTooltip]! เผชิญหน้าข้าในการต่อสู้อย่างมีเกียรติ!""
 ep2_tournament_events.1012.b.success:0 "ท่านชนะการประลอง"
 ep2_tournament_events.1012.b.failure:0 "ท่านแพ้การประลอง"
 ep2_tournament_events.1012.c:0 "ข้าต้องรวดเร็ว!"
 ep2_tournament_events.1012.c.success:0 "การซุ่มโจมตีสำเร็จ"
 ep2_tournament_events.1012.c.failure:0 "การซุ่มโจมตีล้มเหลวอย่างน่าสังเวช"
 ep2_tournament_events.1012.d:0 "มันไม่ถูกต้องที่จะชนะ เช่นนี้"

 ep2_tournament_events.1013.t:0 "$tournament_contest_header$ พื้นที่สูง"
 ep2_tournament_events.1013.desc:0 "ข้าหยุดม้าหลังจากโจมตีคู่ต่อสู้และมุ่งหน้ากลับเข้าสู่การต่อสู้ ขณะที่ข้าเข้าใกล้ ข้าเห็นร่างหนึ่งล้มลงจากม้า ถูกโจมตีจากด้านหลังโดยคู่ต่อสู้\n\nดูเหมือนจะไม่ได้รับบาดเจ็บ [felled_participant.GetFirstName] มองไปรอบๆ อย่างบ้าคลั่งหาม้าของ [felled_participant.GetHerHis] แต่มันหายไปนานแล้ว ตื่นตกใจ เพราะเสียงดัง\n\nข้าเข้าใกล้มากขึ้น จดจ่ออยู่กับชะตากรรมของ [felled_participant.GetHerHis] นั่งอยู่บนหลังม้าศึกของข้า [felled_participant.GetSheHe] ดูตัวเล็กมาก ไร้การป้องกัน มันคงไม่สมเกียรติ ผู้สังเกตการณ์อาจกล่าว เช่นนั้น แต่มีเกียรติน้อยมากในการต่อสู้..."
 ep2_tournament_events.1013.a:0 ""ท่านต้องการความช่วยเหลือหรือไม่ [felled_participant.GetFirstNameNoTooltip]?""
 ep2_tournament_events.1013.a.tt:0 "ป้องกัน [felled_participant.GetHerHim] ออกจากการต่อสู้จนกว่าผู้ดูแลจะนำม้าตัวอื่นมาให้ [felled_participant.GetHerHim]"
 ep2_tournament_events.1013.b:0 "เป็น เช่นนั้นเถิด #EMP ย่าห์!#!"
 ep2_tournament_events.1013.c:0 "เราจะตัดสินเรื่องนี้อย่างยุติธรรม ด้วยการเดินเท้า"
 ep2_tournament_events.1013.c.success:0 "ท่านชนะการประลอง"
 ep2_tournament_events.1013.c.failure:0 "ท่านแพ้การประลอง"
 ep2_tournament_events.1013.d:0 "นี่ไม่ใช่วิธีที่ข้าต่อสู้"
 ep2_tournament_events.1013.d.tt:0 "หันหลังกลับเพื่อค้นหาการต่อสู้ที่ยุติธรรมกว่า"

 ep2_tournament_events.1015.t:0 "$tournament_contest_header$ $knight_culture_player_no_tooltip$ ลึกลับ"
 ep2_tournament_events.1015.desc:0 "ม้าวิ่งผ่านไปในการต่อสู้ การโจมตีของข้าส่งข้าออกห่างจากความขัดแย้ง และข้าวนกลับเป็นวงกว้างเพื่อสังเกตการณ์\n\nทันใดนั้นสายตาของข้าก็จับจ้อง $knight_culture_player_no_tooltip_lowercase$ คนหนึ่งกำลังต่อสู้อย่างแข็งขัน ดุร้าย และมีทักษะไม่น้อย ทำให้คู่ต่อสู้ตกม้าแล้วลงจากหลังม้าเพื่อต่อสู้ต่อ พวกเขาเก่งกว่าคู่ต่อสู้ที่โชคร้ายอย่างเห็นได้ชัด และในไม่ช้าก็ ทำให้พวกเขาอยู่ในความเมตตา เก็บเงินค่าไถ่จำนวนมาก\n\nสัญลักษณ์เหล่านั้นดูคุ้นเคยสำหรับข้า แต่มันยากที่จะมองเห็น ข้าควบม้าเข้าไปใกล้และลงจากหลังม้า ตะโกนเรียกบุคคลนั้น แต่พวกเขากลับเดินจากไปอย่างแน่วแน่เพื่อค้นหาศัตรูใหม่"
 ep2_tournament_events.1015.a:0 "เอาล่ะ ข้าคิดว่าข้าสามารถเก็บเศษเล็กเศษน้อยของพวกเขาได้"
 ep2_tournament_events.1015.a.tt:0 "นี่เป็นโอกาสที่ดีที่จะเอาชนะคู่ต่อสู้ที่อ่อนแอและทำเงินเล็กน้อย!"
 ep2_tournament_events.1015.b:0 "ข้าต้องรู้ให้ได้ว่านั่นคือใคร!"
 ep2_tournament_events.1015.b.success:0 "ท่านจับคนแปลกหน้าได้"
 ep2_tournament_events.1015.b.failure:0 "พวกเขาหายไปในฝูงชน"
 ep2_tournament_events.1015.b.success.tt:0 "ท่านเผชิญหน้ากับบุคคลนั้น"
 ep2_tournament_events.1015.c:0 "ปล่อยให้พวกเขาจัดการกันเองดีที่สุด"

 ep2_tournament_events.1016.t:0 "$tournament_contest_header$ ไขปริศนา"
 ep2_tournament_events.1016.start:0 "เห็นได้ชัดอย่างรวดเร็วว่าการปรากฏตัวของข้าไม่เป็นที่ต้อนรับ $knight_culture_player_no_tooltip_lowercase$ เหลือบมองข้ามไหล่มาที่ข้าอย่างประหม่าและเดินวกวนผ่านการตะลุมบอนเพื่อสลัดข้าออก แต่ข้าจะไม่ยอมแพ้ ในที่สุดข้าก็ตามพวกเขาทัน เอามือแตะแขนพวกเขา และดึงหมวกเกราะออก ข้าอ้าปากค้างโดยไม่สมัครใจ\n\n"
 ep2_tournament_events.1016.mulan:0 ""ข้าหวังว่าข้าได้พิสูจน์ตัวเองว่าคู่ควรแล้ว" [mysterious_knight.GetFirstName] กล่าว พลางก้มศีรษะเล็กน้อย "ขอบคุณสำหรับความไว้วางใจในตัวข้า ตอนนี้ ให้ข้าตอบแทนมัน" [mysterious_knight.GetSheHe] ยกอาวุธของ [mysterious_knight.GetHerHis] ขึ้น แสงแดดกระทบกับใบดาบ"
 ep2_tournament_events.1016.mulanunknown:0 "เป็น #EMP [mysterious_knight.GetWomanMan]#!!\n\n"ได้โปรด ข้าขอร้องท่าน อย่าบอกใครเลย" [mysterious_knight.GetSheHe|U] อ้อนวอน [mysterious_knight.GetSheHe|U] มองลงไปที่พื้น แล้วเงยหน้ามองข้าอย่างมีความหวัง "ทั้งหมดที่ข้าต้องการคือได้รับอนุญาตให้พิสูจน์คุณค่าของข้า!"
 ep2_tournament_events.1016.relation:0 "ในบรรดาผู้คนทั้งหมด เป็น [ROOT.Char.Custom2('RelationToMeShort', mysterious_knight)] [mysterious_knight.GetFirstName] ของข้า! [mysterious_knight.GetSheHe|U] ทำได้เพียงยิ้มเล็กน้อยให้กับปากที่อ้าค้างของข้า และยื่นแขนชี้กลับไปที่การต่อสู้ที่หมุนวน\n\n"เราไม่มีเวลาเสียไปกับการถามคำถาม" [mysterious_knight.GetSheHe|U] ตัดบทการประท้วงของข้า "เรามีการต่อสู้ที่ต้องชนะ!""
 ep2_tournament_events.1016.a:0 "เอาล่ะ ระวังหลังให้ข้าด้วย!"
 ep2_tournament_events.1016.b:0 "ท่านต้องแสดงทักษะให้ข้าเห็น!"
 ep2_tournament_events.1016.b.tt:0 "การเฝ้าดูอย่างใกล้ชิดจะสอนบางสิ่งให้ท่านอย่างไม่ต้องสงสัย"
 ep2_tournament_events.1016.b.success:0 "ท่านเรียนรู้มากมาย"
 ep2_tournament_events.1016.b.failure:0 "ท่านเรียนรู้เล็กน้อย"
 ep2_tournament_events.1016.c:0 "ไม่! ท่านทำ เช่นนี้ไม่ได้ #EMP ทำ#! สิ่งนี้!"

 ep2_tournament_events.1017.t:0 "$tournament_contest_header$ จนมุม"
 ep2_tournament_events.1017.desc:0 "ถูกดึงลงจากอานม้าด้วยอาวุธด้ามยาว ข้าโซเซยืนขึ้น หัวของข้าดังอื้อ ผู้กระทำผิดหันมาหาข้าทันที\n\n"ขออภัยสำหรับการลงจอดที่ขรุขระ" [knight_1.GetFirstName] กล่าว "แต่เราจะไม่เสี่ยง" พวกเขาสามคน อาวุธครบมือ เป้าหมายของพวกเขาชัดเจน: ข้าเป็นเป้าหมายที่มีค่าสูง คนที่จะนำความร่ำรวยมาให้ในค่าไถ่\n\nขณะที่หัวของข้าเริ่มปลอดโปร่ง ข้าสามารถมองเห็นร่างสองร่างกำลังเข้ามาจากด้านหลังไหล่ของผู้โจมตี ประดับด้วยสีของทีมข้า ไอ้สารเลวสามคนที่ยิ้มกริ่มไม่รู้ถึงอันตรายที่ใกล้เข้ามา แต่การช่วยเหลือของข้าอยู่ใกล้แค่เอื้อมหากข้าต้องการ"
 ep2_tournament_events.1017.a:0 "ถอยไป #EMP สามคนนี้เป็นของข้า.#!"
 ep2_tournament_events.1017.a.success:0 "ท่านเอาชนะทั้งสามคนได้ด้วยตัวคนเดียว"
 ep2_tournament_events.1017.a.failure:0 "ท่านเสียเปรียบอย่างรุนแรง"
 ep2_tournament_events.1017.b:0 "ตอนนี้! จัดการพวกเขา!"
 ep2_tournament_events.1017.b.success:0 "ท่านจับพวกเขาโดยไม่ทันตั้งตัว"
 ep2_tournament_events.1017.b.failure:0 "พวกเขาจัดการถอยทัพอย่างต่อสู้ได้"

 ep2_tournament_events.1018.t:0 "$tournament_contest_header$ ตระกูลที่เป็นหนึ่งเดียว"
 ep2_tournament_events.1018.desc:0 "มองออกไปทั่วการตะลุมบอน ข้าเห็นเพื่อนร่วมทีมที่ถูกล้อมกำลังต่อสู้ด้วยเท้า ถูกล้อมรอบด้วยศัตรูสองคน การเหลือบมองอีกครั้งเผยให้เห็นสีที่เปื้อนโคลนและฉีกขาดที่ [family.GetSheHe] สวมใส่: ธงของตระกูล [ROOT.Char.GetHouse.GetName] อันสูงส่งของเรา\n\nข้าควบม้าศึกเข้าสู่การต่อสู้ ศัตรูคนหนึ่งกระเด็นไป อีกคนหนึ่ง ซึ่งถูกจู่โจมโดยไม่ทันตั้งตัว ถูกจัดการอย่างรวดเร็วด้วยดาบของเรารวมกัน [family.GetFirstName] ยิ้มอย่างขอบคุณ โค้งคำนับต่อหน้าข้าและม้าศึกของข้า\n\n"ขอบคุณท่าน พวกเขาคงจัดการข้าไปแล้ว" [family.GetSheHe|U] มองลงไปที่ผ้าที่หลุดลุ่ย แต่ยังคงสดใสที่เราทั้งคู่สวมใส่ ตบที่ตราสัญลักษณ์บนหัวใจของ [family.GetHerHis] "[ROOT.Char.GetHouse.GetMotto]""
 ep2_tournament_events.1018.a:0 ""[ROOT.Char.GetHouse.GetMotto]" [family.GetFirstNameNoTooltip]"
 ep2_tournament_events.1018.b:0 "ข้าจะปกป้องท่านเสมอ ตราบเท่าที่ข้ายังมีลมหายใจ"
 
 # Archery

 ep2_tournament_events.1501.t:0 "$tournament_contest_header$ กรุณาเงียบ!"
 ep2_tournament_events.1501.desc:0 "ฝูงชนพึมพำอย่างสงบขณะที่[competitor.GetFirstName]เข้าประจำที่ของ[competitor.GetHerHis] ข้าคิดว่าข้าจับคำพูดบางคำได้ตามลม และเห็นได้ชัดว่า[competitor.GetFirstNameNoTooltip]ก็ เช่นกัน [competitor.GetSheHe|U] หันมาอย่างค่อนข้างฉุนเฉียวและพูดกับฝูงชน\n\n"เงียบ! ให้เกียรติผู้เข้าแข่งขันบ้างสิ!" [competitor.GetSheHe|U] บ่นอย่างไม่พอใจ มีเสียงหัวเราะคิกคักตอบกลับมาเล็กน้อย เห็นได้ชัดว่า[competitor.GetSheHe]ต้องการความสงบและความเงียบในการยิงธนู แต่ — ข้าคิด ขณะที่[competitor.GetSheHe]หันไปชูกำปั้นใส่ฝูงชนอีกครั้ง — นี่อาจจะเกินไปหน่อย"
 ep2_tournament_events.1501.secret:0 "\n\nข้าปล่อยให้ความคิดล่องลอยกลับไปสู่สิ่งที่ข้าคิดว่าข้าได้ยินจากการพูดคุยของฝูงชน มันฟังดูค่อนข้าง #EMP ลามก#! อย่างน้อยก็พูดได้..."
 ep2_tournament_events.1501.a:0 ""เจ้าตรงนั้น เจ้าพูดว่าอะไรนะ?""
 ep2_tournament_events.1501.a.tt:0 "ฝูงชนนี้จะไม่สามารถเงียบเสียงได้อีกต่อไปเมื่อข่าวลือลามกนั้นถูกได้ยินเสียงดังฟังชัด!"
 ep2_tournament_events.1501.b:0 "โอ้ ไม่นะ ข้ารู้สึกคันคอขึ้นมา"
 ep2_tournament_events.1501.b.tt:0 "#EMP ไอ!#! #EMP ไอ!#!"
 ep2_tournament_events.1501.c:0 "ปล่อยให้ [competitor.GetHerHim] ทำต่อไปดีที่สุด"

 ep2_tournament_events.1502.t:0 "$tournament_contest_header$ พลศาสตร์ของลูกธนู"
 ep2_tournament_events.1502.desc:0 "ธงพลิ้วไหวและม้วนตัวไปรอบๆ ขณะที่ข้าก้าวขึ้นมายิงธนู ถูกลมพัดกระหน่ำ ฝุ่นหมุนวนผ่านข้าไปขณะที่ข้าขึ้นสายธนู ลมเปรี้ยว ทำให้ตาน้ำตาไหล\n\nข้ารอให้มันสงบลง\n\nข้ารอต่อไป\n\nข้าไม่คิดว่ามันจะหยุด"
 ep2_tournament_events.1502.secret:0 "\n\nข้าปล่อยให้ความคิดล่องลอยกลับไปสู่สิ่งที่ข้าคิดว่าข้าได้ยินจากการพูดคุยของฝูงชน มันฟังดูค่อนข้าง #EMP ลามก#! อย่างน้อยก็พูดได้..."
 ep2_tournament_events.1502.a:0 "ฮ่า! ลมแค่นี้หยุดข้าไม่ได้หรอก!"
 ep2_tournament_events.1502.b:0 ""อันที่จริง ยังไม่ถึงตาข้าเลยใช่ไหม?""
 ep2_tournament_events.1502.b.tt:0 "การชี้ให้ [contestant.GetFirstNameNoTooltip] ผู้น่าสงสารและโชคร้ายก้าวไปข้างหน้าเป็นคนต่อไปอาจจะได้ผล..."
 ep2_tournament_events.1502.b.success:0 "ผู้ตัดสินยอมรับ"
 ep2_tournament_events.1502.b.failure:0 "ท่านถูกบอกให้ทำต่อไป"
 ep2_tournament_events.1502.c:1 "บางทีถ้าข้ายิง #EMP ขวาง#! ลม..."
 ep2_tournament_events.1502.c.success:0 "ท่านยิงโดนเป้า"
 ep2_tournament_events.1502.c.failure:0 "ลมพิสูจน์ว่ารุนแรงเกินไป"

 ep2_tournament_events.1503.t:0 "$tournament_contest_header$ เบื่อหน่ายที่เป้ายิง"
 ep2_tournament_events.1503.desc:0 "#EMP แผลง!#!\n\nลูกธนูจากผู้เข้าแข่งขันหลุดออกจากคันธนูและปักเข้าที่เป้า เสียงปรบมือเบาๆ ตามมา ข้าพิงคันธนู เบื่อหน่าย รอคอยตาของข้า\n\n#EMP แผลง!#!\n\nลูกธนูอีกลูกปักเข้าเป้า [contestant.GetFirstName] เดินออกไปหยิบคันธนูของ [contestant.GetHerHis] ข้าต้องหา #EMP อะไรสักอย่าง#! ทำขณะรอ มิฉะนั้นข้าจะเสียสติ"
 ep2_tournament_events.1503.a:0 "...เครื่องหมายนั้นชั่วคราวมาก"
 ep2_tournament_events.1503.a.tt:0 "จะมีใครสังเกตไหมถ้าข้าลบมันออกและย้ายเครื่องหมายของเราถอยหลังไปสองสามก้าว?"
 ep2_tournament_events.1503.a.success:0 "ท่านทำสำเร็จ"
 ep2_tournament_events.1503.a.failure:0 "ท่านถูกจับได้"
 ep2_tournament_events.1503.b:0 "ข้าจะเดินไปคุยกับฝูงชน"
 ep2_tournament_events.1503.b.flavor:0 "ใครจะรู้ว่าอาจได้ยินข่าวลืออะไรบ้าง?"
 ep2_tournament_events.1503.b.tt:0 "ท่านค้นพบ [secret|E] เกี่ยวกับผู้เข้าแข่งขันคนอื่น"
 ep2_tournament_events.1503.b.success:0 "ท่านค้นพบความลับ"
 ep2_tournament_events.1503.b.failure:0 "ท่านพูดคุยแก้เบื่อ"
 ep2_tournament_events.1503.c:0 "ข้าคงต้องทนมันไปก่อน"

 # Wrestling

 ep2_tournament_events.2001.t:1 "$tournament_versus_header$ กลโกงสกปรก"
 ep2_tournament_events.2001.desc:1 "[versus_contestant.GetFirstName] และข้าอยู่บนพื้น กำลังยื้อยุดกัน การจับแขนดึงข้าเข้าสู่ตำแหน่งเสียเปรียบ และทันใดนั้น [versus_contestant.GetFirstNameNoTooltip] ก็อยู่บนตัวข้าและพยายามกดเพื่อชัยชนะ\n\nพื้นดินที่เต็มไปด้วยฝุ่นเคลื่อนไหวใต้ร่างที่เกร็งของเรา ใบหน้าของคู่ต่อสู้ของข้าถูไถไปตามพื้นขณะที่ [versus_contestant.GetSheHe] พยายามกดข้าลงกับพื้น มืออิสระของข้า คว้าหาหลักยึดใดๆ โดยไม่รู้ตัวกำรอบดิน ทำให้ข้ามีฝุ่นเต็มกำมือ ใบหน้าของ [versus_contestant.GetHerHis] อยู่ใกล้กับมือข้า ใกล้มาก..."
 ep2_tournament_events.2001.a:0 "ย่าห์!"
 ep2_tournament_events.2001.b:0 "นี่ไม่ใช่วิธีการต่อสู้"
 ep2_tournament_events.2001.b.success:0 "ท่านต่อสู้จนลุกขึ้นยืนได้"
 ep2_tournament_events.2001.b.failure:0 "[versus_contestant.GetFirstNameNoTooltip] กดท่านลงได้อย่างง่ายดาย"
 ep2_tournament_events.2001.a.tt:0 "โยนดินใส่หน้า [versus_contestant.GetHerHis]"

 ep2_tournament_events.2002.t:1 "$tournament_versus_header$ สอดรู้สอดเห็น"
 ep2_tournament_events.2002.desc:0 "[versus_contestant.GetFirstName] ทับลงบนตัวข้าอย่างแรง ขณะที่การปล้ำของ [versus_contestant.GetHerHis] ทำให้ข้าล้มลงกับพื้น ทันใดนั้นเราทั้งคู่ก็เริ่มต่อสู้เพื่อตำแหน่งที่ดีกว่า ข้าพยายามพลิก [versus_contestant.GetHerHim] ออกไป [versus_contestant.GetSheHe] พยายามใช้ประโยชน์จากช่องโหว่\n\n[versus_contestant.GetFirstNameNoTooltip] สอดแขนข้างหนึ่งของข้าไว้ใต้เข่าของ [versus_contestant.GetHerHis] และเริ่มพยายามจบการต่อสู้ทั้งหมด ด้วยความสิ้นหวัง มืออิสระของข้าคว้าหาบางสิ่ง บางอย่างที่จะใช้ ตาพร่ามัวไปครึ่งหนึ่ง เพราะฝุ่น ข้าสัมผัสได้ถึงอากาศ จากนั้นเป็นผ้าหยาบๆ ของชุดมวยปล้ำ จากนั้นทันใดนั้นก็เป็น... ร่องก้น?\n\nหากข้าไม่ทำอะไรสักอย่างในไม่ช้า การต่อสู้นี้ก็เหมือนแพ้ไปแล้ว และ ดังนั้นนิ้วโป้งของข้าจึงคลายออกจากกำปั้น..."
 ep2_tournament_events.2002.a:0 "ทุกอย่างยุติธรรมในความรักและมวยปล้ำ..."
 ep2_tournament_events.2002.b:0 "ข้าจะแพ้อย่างมีเกียรติหากจำเป็น!"
 ep2_tournament_events.2002.b.tt:0 "ถึงเวลาต่อสู้เพื่อหาทางออก!"
 ep2_tournament_events.2002.a.tt:0 "สมาชิกครอบครัวใกล้ชิดทุกคน"

 ep2_tournament_events.2003.t:1 "$tournament_versus_header$ การแทรกแซงจากภายนอก"
 ep2_tournament_events.2003.desc:0 ""เฮ้! เฮ้ กรรมการ!"\n\nข้าได้ยินเสียงเพื่อนของข้า [friend.GetFirstName] ด้วยความโล่งใจไม่น้อย การรบกวนที่น่ายินดี ทำให้ผู้ตัดสินเดินไปที่กำแพงเวที และคู่ต่อสู้ของข้า [versus_contestant.GetFirstName] ลังเลเพียงเสี้ยววินาที เพียงพอให้ศอกกระแทกหน้า ทำให้ [versus_contestant.GetHerHim] มึนงงชั่วขณะ\n\nฝูงชนไม่พอใจกับการเล่นตุกติก และสิ่งของต่างๆ เริ่มตกลงมาในเวที ผลไม้ ผัก แม้กระทั่งเก้าอี้เล็กๆ อันที่จริง เก้าอี้ดังกล่าวตกลงมาใกล้พอที่ข้าจะหยิบขึ้นมาได้ และหลังของกรรมการที่หันไปขณะที่เขาจัดการกับการก่อกวนของ [friend.GetFirstNamePossessiveNoTooltip] ทำให้ข้าเกิดความคิดเล็กๆ ขึ้นมา..."
 ep2_tournament_events.2003.a:0 ""#EMP อ๊าก!#! กรรมการ! [versus_contestant.GetSheHe|U] ตีข้าด้วยสิ่งนั้น!""
 ep2_tournament_events.2003.b:0 ""ทางนี้ [versus_contestant.GetFirstNameNoTooltip]!""
 ep2_tournament_events.2003.c:0 "พอได้แล้วกับเรื่องไร้สาระที่ไม่ซื่อสัตย์นี้"
 ep2_tournament_events.2003.a.tt:0 "โยนเก้าอี้ใส่มือของ [versus_contestant.GetFirstNamePossessiveNoTooltip] และกุมหัวของท่าน"
 ep2_tournament_events.2003.b.tt:0 "#EMP เคร้ง!#!"

 ep2_tournament_events.2004.t:1 "$tournament_versus_header$ การต่อสู้ที่หนักหน่วง"
 ep2_tournament_events.2004.desc:0 "แขนของข้าพยายามโอบรอบหลังท้องอันอุดมสมบูรณ์ของ [versus_contestant.GetFirstNamePossessive] อีกครั้ง และ เช่นเคย สิ่งที่ [versus_contestant.GetSheHe] ทำคือหัวเราะและส่งข้ากระเด็นไปชนกำแพงเวทีด้วยน้ำหนักตัวมหาศาลของ [versus_contestant.GetHerHis] [versus_contestant.GetSheHe|U] เดินย่างกรายมาหาข้า แก้มสั่นไหว ไขมันเป็นลอน ขณะที่ฝูงชนโห่ร้องด้วยความยินดี\n\nแม้ว่าขนาดที่ใหญ่โตของคู่ต่อสู้ของข้าจะเป็นข้อได้เปรียบ แต่ก็ไม่มีทางที่ปริมาตรทั้งหมดนั้นจะเป็นกล้ามเนื้อเพียงอย่างเดียว [versus_contestant.GetFirstNameNoTooltip] เริ่มเดินวนเพื่อจำกัดพื้นที่ที่มีให้ข้าอีกครั้ง แน่นอนว่าต้องมีวิธีใช้ประโยชน์จากสิ่งนี้?"
 ep2_tournament_events.2004.a:0 "บางทีถ้าข้า ทำให้ [versus_contestant.GetHerHim] เคลื่อนไหวไปรอบๆ..."
 ep2_tournament_events.2004.b:0 "แค่ยกพวกเขาขึ้นแล้วจบเรื่องซะ!"
 ep2_tournament_events.2004.c:0 "[versus_contestant.GetSheHe|U] ไม่ใช่คนเดียวที่มี #EMP ความอ้วน#! เล็กน้อย!!"
 ep2_tournament_events.2004.d:0 "หอคอยอันยิ่งใหญ่ไม่สามารถยืนหยัดได้หากไม่มีรากฐาน"
 ep2_tournament_events.2004.e:0 "ไม่มีเกียรติใดในการหลีกเลี่ยงการต่อสู้!"
 ep2_tournament_events.2004.d.tt.success:0 "ท่านโจมตีขาของ [versus_contestant.GetFirstNamePossessiveNoTooltip] ได้สำเร็จ"
 ep2_tournament_events.2004.d.tt.failure:0 "[versus_contestant.GetFirstName] ต้านทานการโจมตีของท่านได้อย่างง่ายดาย"

 ep2_tournament_events.2005.t:1 "$tournament_versus_header$ ปล้ำกับความใคร่"
 ep2_tournament_events.2005.desc:0 "ขณะที่ข้าปล้ำกับคู่ต่อสู้ [versus_contestant.GetFirstName] การลื่นเล็กน้อย ทำให้ข้ามีช่องโหว่ การทุ่มอย่างรวดเร็วส่ง [versus_contestant.GetHerHim] ลงไปที่พื้น แต่ [versus_contestant.GetSheHe] ลงอย่างสง่างาม และเราจบลงด้วยการนอนอกแนบอกบนพื้น เหงื่อไหลออกจากร่างของข้าและ [versus_contestant.GetFirstNamePossessiveNoTooltip] ขณะที่เราต่อสู้เพื่อตำแหน่ง ทำให้เราทั้งคู่ลื่น\n\n#EMP ลื่นมาก#! อย่างที่เกิดขึ้น ขณะที่เราแยกออกจากการกอดอีกครั้ง - ครั้งนี้อาจจะต่อสู้น้อยกว่าครั้งที่แล้ว? - ข้าตระหนักถึงใบหน้าที่แดงก่ำของ [versus_contestant.GetFirstNamePossessiveNoTooltip] ซึ่งข้าสงสัยว่าไม่ใช่แค่จากการออกแรง"
 ep2_tournament_events.2005.a:0 ""เราจะไปต่อกันที่อื่นที่เป็นส่วนตัวกว่านี้ไหม?""
 ep2_tournament_events.2005.b:0 ""ข้ากำลังสนุกกับการต่อสู้ของเรา [versus_contestant.GetFirstNameNoTooltip] #EMP มาก#! ทีเดียว""
 ep2_tournament_events.2005.c:0 "ฮ่า! [versus_contestant.GetSheHe|U] ลดการป้องกันของ[versus_contestant.GetHerHis]ลงแล้ว!"
 ep2_tournament_events.2005.b.tt.success:0 "[versus_contestant.GetFirstNameNoTooltip] สนใจในความก้าวหน้าของท่าน"
 ep2_tournament_events.2005.b.tt.failure:0 "[versus_contestant.GetFirstNameNoTooltip] รู้สึกปลื้ม แต่ปฏิเสธอย่างสุภาพ"
 ep2_tournament_events.2005.b.tt.criticalfailure:0 "ท่านอ่านภาษากายของ [versus_contestant.GetFirstNamePossessiveNoTooltip] ผิดพลาดอย่างมาก"

 ep2_tournament_events.2006.t:1 "$tournament_versus_header$ การแสดงพลัง"
 ep2_tournament_events.2006.desc:0 "ข้าแกล้งไปทางซ้ายแล้วไปทางขวา พุ่งเข้าใส่ขาของคู่ต่อสู้ [versus_contestant.GetFirstNamePossessive] แต่ [versus_contestant.GetSheHe] เร็วกว่า คว้าเอวข้า ยกข้าขึ้นไปในอากาศกลับหัว ท้องของ [versus_contestant.GetHerHis] ชิดหลังข้า ขาของข้าโบกไปมาอย่างช่วยไม่ได้\n\nเสียงโห่ร้องและเสียงเชียร์ของฝูงชนดังอยู่ในหูข้าขณะที่ข้าดิ้นรนเพื่อปลดปล่อยตัวเอง พยายามอย่างไร้ผลที่จะเข่าใส่หัวของ [versus_contestant.GetFirstNameNoTooltip] ยิ่งข้าดิ้นรนมากเท่าไหร่ ข้าก็ยิ่งรู้สึกว่าการจับกุมของศัตรูของข้าคลายลง ข้าพยายามมากขึ้น แต่ดูเหมือนว่า [versus_contestant.GetFirstNameNoTooltip] จะทนการดิ้นของข้าไม่ไหวแล้วและเพียงแค่... ปล่อยข้าลง\n\nพื้นดินพุ่งเข้ามาหาข้าอย่างกะทันหัน ความคิดสุดท้ายที่น่าสะพรึงกลัวของข้าคือการตระหนักว่าหัวของข้ากำลังจะรับแรงกระแทก-\n\n#X เคร้งงง.#!"
 ep2_tournament_events.2006.a:0 "..."

 ep2_tournament_events.2007.t:0 "การมีส่วนร่วมของผู้ชม"
 ep2_tournament_events.2007.desc:0 "ข้ากด [versus_contestant.GetFirstName] ลง กดไหล่ของ [versus_contestant.GetHerHis] ลงกับพื้น ข้าใกล้จะทำ เช่นนั้นได้แล้วเมื่อข้าได้ยินเสียงเรียกจากผู้ตัดสินที่กำลังดูอยู่ ใช้เวลาสักครู่กว่าข้าจะรู้ว่ามันเป็นผลดีต่อข้า และผู้ตัดสินกำลังให้คะแนนข้าสำหรับการล้ม!\n\nข้ายืนขึ้นอีกครั้ง อย่างไม่แน่ใจนัก ชั่งใจว่าข้าควรยอมรับความผิดพลาดของพวกเขาหรือไม่ เมื่อเสียงของฝูงชนดังขึ้นถึงขีดสุด ข้าหันไปเห็น [opponent_friend.GetFirstName] พุ่งเข้ามาหาข้าหลังจากกระโดดข้ามรั้ว ชี้ไม้ชี้มืออย่างโกรธเกรี้ยว\n\n"นี่มันไม่ยุติธรรม! ไหล่ของ [versus_contestant.GetHerHis|U] ยังไม่ #EMP ใกล้#! จะแตะพื้นเลย!" [opponent_friend.GetSheHe|U] ตะโกน คว้าข้อมือผู้ตัดสิน"
 ep2_tournament_events.2007.a:0 "ยาม! จับตัวปัญหานี้ออกไป!"
 ep2_tournament_events.2007.b:0 "ไหล่ของ [versus_contestant.GetHerHis|U] แตะพื้น #EMP แน่นอน#! แล้ว!"
 ep2_tournament_events.2007.b.tt.success:0 "ท่านชนะการโต้เถียง"
 ep2_tournament_events.2007.b.tt.failure:0 "ผู้ตัดสินเข้าข้าง [opponent_friend.GetFirstNameNoTooltip]"
 ep2_tournament_events.2007.c:0 "ไม่ ท่านพูดถูก ไม่มีการล้ม"

 # Fistfighting

 ep2_tournament_events.2501.t:0 "ทางเลือก ทางเลือก..."
 ep2_tournament_events.2501.desc:1 "การกระแทกไหล่อย่างดุร้ายจาก [versus_contestant.GetFirstName] กระแทกเข้าที่ซี่โครงของข้าและข้าล้มลงกับพื้น แต่ [versus_contestant.GetSheHe] ไม่ได้ตามข้าลงไปกด มันมีเหตุผลที่ดี เช่นกัน เพราะหมัดของข้าฟาดผ่านอากาศไปในจุดที่หัวของพวกเขาควรจะอยู่ ช่วงเวลาของการหยั่งเชิงของการต่อสู้ครั้งนี้เห็นได้ชัดว่าจบลงแล้ว\n\nเราทั้งคู่เดินวนกันอย่างระมัดระวัง [versus_contestant.GetFirstNameNoTooltip] มีรอยยิ้มเจ้าเล่ห์จางๆ มันคือความสงบก่อนพายุ และนักมวยปล้ำเจ้าเล่ห์ใช้ช่วงเวลาเหล่านี้ในการวางกลยุทธ์"
 ep2_tournament_events.2501.a:1 "เน้นไปที่การล็อคคอ"
 ep2_tournament_events.2501.b:1 "เน้นไปที่การกอดรัดลำตัว"
 ep2_tournament_events.2501.c:1 "แค่ ทำให้ [versus_contestant.GetHerHim] ล้มลงกับพื้น"
 ep2_tournament_events.2501.a.tt.criticalsuccess:0 "ท่าน ทำให้พวกเขาล้มลง"
 ep2_tournament_events.2501.a.tt.success:0 "มันได้ผลพอสมควร"
 ep2_tournament_events.2501.a.tt.failure:0 "กลยุทธ์ของท่านล้มเหลว"

 ep2_tournament_events.2502.t:0 "ข้อเคลื่อน"
 ep2_tournament_events.2502.desc:1 "ขณะที่ข้าแยกตัวออกจากการกอดรัดสั้นๆ กับ [versus_contestant.GetFirstName] ข้าจับ [versus_contestant.GetHerHim] โดยไม่ทันตั้งตัวและคว้าคอ [versus_contestant.GetHerHim]! โดยไม่ทันเตรียมตัว คอของ [versus_contestant.GetFirstNamePossessiveNoTooltip] ดังกร๊อบจากแรงกระแทก แรงนั้น ทำให้ [versus_contestant.GetHerHim] กรีดร้องด้วยความตื่นตระหนก\n\nฝูงชนโห่ร้อง แต่เสียงเชียร์ที่ดังสนั่นค่อยๆ เงียบลงเป็นเสียงกระซิบสับสนขณะที่ข้าคลายการจับกุม ทันทีที่แขนของข้าสัมผัส เสียง #EMP ป๊อก#! ที่น่าสะอิดสะเอียนส่งสัญญาณว่ามีบางอย่างไม่ปกติ และความเจ็บปวดที่สั่นสะเทือนผ่านนิ้วของข้ายืนยันถึงอาการข้อเคลื่อนบางอย่าง\n\n[versus_contestant.GetFirstNameNoTooltip] ยังคงรวบรวมสติ หากข้าตอบสนองอย่างรวดเร็ว บางที..."
 ep2_tournament_events.2502.a:0 "เอาล่ะ มีเพียงสิ่งเดียวเท่านั้นสำหรับเรื่องนี้"
 ep2_tournament_events.2502.b:0 "ถ้าข้าใช้มืออีกข้าง ข้าอาจจะยังชนะได้..."
 ep2_tournament_events.2502.c:0 "ข้าบาดเจ็บ! ข้าต้องยอมแพ้"
 ep2_tournament_events.2502.a.tt:0 "พยายามดันนิ้วกลับเข้าข้อต่อ"
 ep2_tournament_events.2502.a.tt.success:0 "การรักษาเฉพาะหน้าของท่านได้ผล"
 ep2_tournament_events.2502.a.tt.failure:0 "โอ๊ย! นั่นไม่ได้ช่วยอะไรเลย!"
 ep2_tournament_events.2502.b.tt:0 "สู้ต่อไป!"

 ep2_tournament_events.2503.t:0 "การขยิบตาที่อ่อนแอที่สุด"
 ep2_tournament_events.2503.desc:1 "แขนข้างหนึ่งรัดรอบกะโหลกศีรษะข้า และข้าตอบโต้ด้วยศอกที่รุนแรงเข้าที่ท้องของ [versus_contestant.GetFirstNamePossessive] ข้าหนีจากการจับกุมของ [versus_contestant.GetHerHis] และเข้าไปกอดรัดด้วยตัวเอง และเราก็ล็อคกัน แขนพันกัน หายใจหอบหนัก\n\nขณะที่เราต่อสู้กันในการจับกุมของกันและกัน ข้าสังเกตเห็นรอยยิ้มจางๆ ผ่านใบหน้าของคู่ต่อสู้ของข้า [versus_contestant.GetSheHe] ยิ้มเรื่องอะไร-\n\n#EMP อ๊าก!#! #EMP ตาข้า!#! นิ้วโป้งของ [versus_contestant.GetFirstNamePossessiveNoTooltip] อยู่ในเบ้าตาข้าอย่างมั่นคง และต้องใช้การโจมตีที่รุนแรงเข้าที่ใบหน้าเพื่อดึง [versus_contestant.GetHerHim] ออกไปจากข้า ข้าเซถอยหลัง เอามือกุมตาที่เสียหาย คู่ต่อสู้ที่พร่ามัวของข้าเดินเข้ามาหาข้า"
 ep2_tournament_events.2503.a:0 "เราจะเล่นกันแบบนั้นใช่ไหม?!"
 ep2_tournament_events.2503.b:0 "กรรมการ! #EMP กรรมการ!#!"
 ep2_tournament_events.2503.c:0 "เจ้าจะหนีไม่พ้นเรื่องนี้!"
 ep2_tournament_events.2503.d:0 "เจ้า [versus_contestant.Custom2('InsultAdjective', ROOT.Char)] [versus_contestant.Custom2('InsultNoun', ROOT.Char)]! เข้ามาใกล้ ๆ ให้ข้าตีได้หน่อยสิ!"
 ep2_tournament_events.2503.a.tt:0 "ท่านจิ้มตา [versus_contestant.GetHerHim] เพื่อแก้แค้น!"
 ep2_tournament_events.2503.b.tt.success:0 "[versus_contestant.GetFirstNameNoTooltip] ถูกตัดสิทธิ์"
 ep2_tournament_events.2503.b.tt.failure:0 "การต่อสู้ได้รับอนุญาตให้ดำเนินต่อไป"
 ep2_tournament_events.2503.c.tt:0 "ท่านต่อสู้ต่อไป!"

 ep2_tournament_events.2504.t:0 "พฤติกรรมที่ไม่เหมาะสม"
 ep2_tournament_events.2504.desc:1 "ข้าหันไปหาคู่ต่อสู้ [versus_contestant.GetFirstName] และกอดรัด [versus_contestant.GetHerHim] ด้วยท่าล็อคคอ ข้ากระชับการจับกุม แต่ [versus_contestant.GetSheHe] ดูเหมือนจะ #EMP เพลิดเพลิน#! กับการสัมผัส ข้าทุ่ม [versus_contestant.GetHerHim] ลงกับพื้น แต่ [versus_contestant.GetFirstNameNoTooltip] เพียงแค่อ่อนปวกเปียกและยอมรับมัน แววตาที่ไม่น่าไว้วางใจเริ่มเต้นระริกในดวงตาที่ดุร้ายของ [versus_contestant.GetHerHis]\n\nข้าลดตัวลงอย่างรวดเร็วเพื่อกด แต่ทันใดนั้นเป้าหมายของข้าก็กลายเป็นภาพเบลอของการเคลื่อนไหว กระแทกข้าออกไป ทำให้ข้าอยู่บนพื้น แทนที่จะไปกด [versus_contestant.GetSheHe] ขึ้นคร่อมข้าและเริ่มชกหน้าข้า! ด้วยความสิ้นหวัง ข้าชกเข้าที่ขมับของ [versus_contestant.GetHerHis] อย่างแรง แต่ในการตอบสนอง ปากที่เต็มไปด้วยฟองของ [versus_contestant.GetHerHis] ก็อ้าออก พุ่งไปข้างหน้า และ-\n\n#EMP "อ๊ากกกกกก! จมูกข้า!#!""
 ep2_tournament_events.2504.a:1 "นำพวกเขาออกจากเวทีนี้ทันที!"
 ep2_tournament_events.2504.b:0 "ตามหมอของข้ามา!"
 ep2_tournament_events.2504.c:0 "ใครก็ได้ หาหมอที!"
 ep2_tournament_events.2504.a.tt:0 "[versus_contestant.GetFirstNameNoTooltip] ถูกตัดสิทธิ์ทันที และท่านผ่านเข้ารอบต่อไป"
 ep2_tournament_events.2504.b.tt:0 "ลืมการแข่งขันไปก่อน ท่านต้องการหมอ!"
 ep2_tournament_events.2504.b.tt.criticalsuccess:0 "[physician.GetFirstNameNoTooltip] ทำงานได้อย่างน่าอัศจรรย์"
 ep2_tournament_events.2504.b.tt.success:0 "[physician.GetFirstNameNoTooltip] จัดการรักษาจมูกของท่านได้"
 ep2_tournament_events.2504.b.tt.failure:0 "แม้ แต่การดูแลของ [physician.GetFirstNamePossessiveNoTooltip] ก็ไม่สามารถรักษาจมูกของท่านได้"
 ep2_tournament_events.2504.c.tt:0 "มีการส่งคนวิ่งไปค้นหา $court_physician_court_position$ คนใหม่"

 ep2_tournament_events.2505.t:0 "รับการทุบตี"
 ep2_tournament_events.2505.desc:1 "แขนของข้าเจ็บ กล้ามเนื้อของข้าปวด\n\nไม่ใช่แค่คอของข้า ซึ่งทนทานต่อการกอดรัดที่แน่นหนามามากมาย ไม่ใช่แค่ลำตัวของข้า ซึ่งแทบจะนุ่มนิ่มไปแล้ว ไม่ใช่ #EMP แขนของข้าเอง#! รู้สึกเหมือนถูกม้าเหยียบย่ำโดย [ROOT.Char.GetFaith.DevilName] สิ่งปลอบใจเพียงอย่างเดียวของข้าคือ ขณะที่ข้ามอง [versus_contestant.GetHerHim] ผ่านลมหายใจที่ขาดห้วงและตาที่พร่ามัว ว่าคู่ต่อสู้ของข้า [versus_contestant.GetFirstName] ก็ไม่ได้ดีไปกว่าข้าเลย\n\nเราทั้งคู่โซเซอย่างไม่มั่นคงขณะเข้าใกล้กันอีกครั้ง เลือดไหลออกจากบาดแผลอย่างอิสระ เราเกือบจะอยู่ในระยะของกันและกันอีกครั้งเมื่อเราถูกดึงแยกออกจากกัน ผู้ตัดสินเข้ามาล้อมรอบเราทั้งคู่อย่างเป็นห่วง พวกเขากำลังเสนอ... เสมอกัน?"
 ep2_tournament_events.2505.a:0 "การต่อสู้ที่สูสี เช่นนี้ไม่จำเป็นต้องมีผู้แพ้"
 ep2_tournament_events.2505.b:1 "เสมอ?! ท่านจะต้องลากข้าออกจากเวทีนี้!"
 ep2_tournament_events.2505.b.tt.success:0 "ท่านชนะการต่อสู้"
 ep2_tournament_events.2505.b.tt.failure:0 "[versus_contestant.GetFirstNameNoTooltip] ชนะการต่อสู้"
 ep2_tournament_events.2505.b.tt.doublefailure:0 "ท่านทั้งคู่หมดสติด้วยความเหนื่อยล้า"
 ep2_tournament_events.2505.b.tt.sadistic:0 "ข้าราชบริพารและแขก [GetTrait('sadistic').GetName( GetNullCharacter )] ทั้งหมด"
 ep2_tournament_events.2505.b.tt.notsadistic:0 "ข้าราชบริพารและแขกที่ไม่ใช่ [GetTrait('sadistic').GetName( GetNullCharacter )] ทั้งหมด"

 ep2_tournament_events.2506.t:0 "มุมมองใหม่"
 ep2_tournament_events.2506.desc:2 "หลบการกอดรัดครั้งหนึ่ง พลาดการโต้กลับ...\n\nข้าพยายามตอบโต้ให้สาสม แต่มันคือทั้งหมดที่ข้าทำได้เพื่อต้านทานความพยายามอย่างบ้าคลั่งของ [versus_contestant.GetFirstNamePossessive] ที่จะล็อคข้าในการกอดรัด หลบการพยายามครั้งหนึ่ง โต้กลับอีกครั้ง วิ่งไปด้านข้าง แต่แล้ว [versus_contestant.GetSheHe] ก็คว้าข้าไว้\n\nการล็อคคอรัดรอบคอข้าเหมือนงูร้ายขณะที่มือของ [versus_contestant.GetHerHis] ดันไปอีกทาง ราวกับกำลังปลิดชีพสัตว์ร้าย ข้าหายใจไม่ออก ดวงตาของข้ารู้สึกพร้อมที่จะระเบิดออกจากเบ้า แก้มของข้าแดงก่ำด้วยเลือดที่ติดอยู่ และคอของข้าลั่นดังเอี๊ยดเหมือนกิ่งไม้ที่เปราะบาง\n\n#X แกร๊ก.#!\n\nโลกกลายเป็นขาวดำ ร่างกายของข้ากระตุก\n\nข้านอนคว่ำหน้า มองขึ้นไปบนท้องฟ้า"
 ep2_tournament_events.2506.a:0 "#DIE2 ...อึก!#!"

 ep2_tournament_events.2507.t:0 "การโจมตีที่ ทำให้งงงวย"
 ep2_tournament_events.2507.desc:1 "ไม่มีอะไรเหมือนการปล้ำที่ดีที่จะปลุกประสาทสัมผัสให้ตื่นขึ้นอย่างแท้จริง ทุกอย่างคมชัดขึ้น สว่างขึ้น ชัดเจนขึ้นทั้งเสียง ภาพ และกลิ่น มันเพียงพอที่จะ ทำให้ [ROOT.Char.GetWomanMan] รู้สึกเหมือนยอดมนุษย์! และบางทีการกีดกันประสาทสัมผัสหนึ่งอาจทำตรงกันข้าม...\n\nข้าหลบไปทางซ้ายอย่างดูถูกเพื่อหลีกเลี่ยงการกอดรัดที่เข้ามาจาก [versus_contestant.GetFirstName] และขณะที่ [versus_contestant.GetSheHe] ถอยกลับ ข้าก็ปล่อยการโจมตีด้วยสองมืออย่างแรงเข้าที่ศีรษะทั้งสองข้างของ [versus_contestant.GetHerHis]\n\n[versus_contestant.GetFirstNameNoTooltip] คำรามด้วยความเจ็บปวด เลือดหยดไหลออกจากหูของ [versus_contestant.GetHerHis] เห็นได้ชัดว่าการต่อสู้นี้กำลังจะจบลงอย่างรวดเร็ว แต่ความพยายามอย่างบ้าคลั่งในการกอดรัดที่ถูกโยนมาในทิศทางที่ไม่แน่นอนของข้าบ่งบอกว่า [versus_contestant.GetFirstNameNoTooltip] กำลังจะแก้แค้นหรือถูกโค่นล้มในการพยายาม"
 ep2_tournament_events.2507.a:0 "...ทำอีกครั้ง"
 ep2_tournament_events.2507.b:0 "มา ทำให้มันเร็วๆ กันเถอะ"
 ep2_tournament_events.2507.b.tt:0 "ชัยชนะแน่นอนแล้ว แต่การจบอย่างรวดเร็วยังคงเป็นการเมตตา"
 ep2_tournament_events.2507.c:0 ""ข้าคิดว่าท่านพอแล้ว [versus_contestant.GetFirstNameNoTooltip]""
 ep2_tournament_events.2507.c.success:0 "ท่านประสบความสำเร็จในการพูดคุยให้ [versus_contestant.GetFirstNameNoTooltip] ยอมจำนน"
 ep2_tournament_events.2507.c.failure:0 "[versus_contestant.GetFirstNameNoTooltip] ยังคงโจมตีที่โชคร้ายต่อไป"
 
 ### Jousting Events

 ep2_tournament_events.3501.t:2 "การแทงเป้าเพื่อเรียกร้องความสนใจ"
 ep2_tournament_events.3501.desc:1 "ภาพเบลอของการเคลื่อนไหว เสียงแตกดังสนั่น และหุ่นซ้อมรบก็แกว่งไปมาอย่างรุนแรงอีกครั้ง $knight_culture_player_no_tooltip_lowercase$หนุ่มผู้ ทำให้มันเคลื่อนไหวควบม้าผ่านไปโดยไม่ได้รับบาดเจ็บ และ[knight1.GetSheHe]ก็ทำความเคารพอย่างมีชัย ทำความเคารพอย่างมีชัย #EMP ต่อข้า#! ข้าตระหนัก ขณะที่[knight1.GetSheHe]จบการแสดงท่าทางอันหรูหราของ[knight1.GetHerHis]ด้วยการโค้งคำนับสั้นๆ จากบนอานม้า\n\n#EMP โครม!#! อัศวินอีกคนเข้าปะทะกับหุ่นซ้อมรบ มีทักษะคล้ายกัน คานหมุนพลาด[knight1.GetHerHim]ไปอย่างสวยงาม ทั้ง[knight2.GetWomanMan]และม้าก็ผ่านไปได้อย่างสบาย [knight2.GetSheHe|U] ควบคุมม้าของ[knight2.GetHerHis]ให้อยู่ข้างๆ $knight_culture_player_no_tooltip_lowercase$คนแรกและชูอาวุธของ[knight2.GetHerHis]อย่างโอ้อวด อีกครั้งในทิศทางของข้า ทั้งคู่ยกกระบังหน้าขึ้น และแม้จะอยู่ห่างไกลขนาดนี้ ข้าก็ยังเห็นพวกเขาจ้องมองกันอย่างไม่พอใจ"
 ep2_tournament_events.3501.a:0 "[knight1.GetFirstNameNoTooltip] ดูมีทักษะมาก"
 ep2_tournament_events.3501.b:0 "[knight2.GetFirstNameNoTooltip] คือตัวเลือกที่ดีที่สุดอย่างแน่นอน"
 ep2_tournament_events.3501.c:1 "ผู้ชนะจะได้รับความโปรดปรานจากข้า!"
 ep2_tournament_events.knight_1_wins:0 "[knight1.GetFirstName] ชนะ!"
 ep2_tournament_events.knight_2_wins:0 "[knight2.GetFirstName] ชนะ!"
 ep2_tournament_events.3501.d:0 "พอแล้ว! นี่เป็นพฤติกรรมเหมือนเด็ก"

 ep2_tournament_events.3502.t:2 "หายนะจากการก่อสร้าง"
 ep2_tournament_events.3502.desc:1 "ตุ้บ ตุ้บ ตุ้บ เสียงแตกที่ไม่สม่ำเสมอของหอกที่แตกหักให้จังหวะรองพื้นแก่เสียงทื่อๆ ของการกระแทกของหุ่นซ้อมแทงเป้า\n\nตุ้บ ตุ้บ #EMP ตุ้บ!#! นักแทงเป้าคนอื่นๆ ลองฝีมือ แต่ทันใดนั้นก็รู้สึกผิดปกติ เสียงกระแทกครั้งสุดท้ายฟังดูผิดปกติหรือไม่-\n\n[competitor.GetFirstName] เข้าใกล้หุ่นซ้อมแทงเป้าและการโจมตีอันมหาศาลที่ [competitor.GetSheHe] มอบให้มัน ทำให้มันแตกหักทั้งหมด เสาหมุนคว้างไปบนพื้น โครงสร้างเองก็โยกเยกอย่างน่าหวาดเสียวก่อนที่จะล้มลงกับพื้นพร้อมเสียงดังสนั่นในที่สุด"
 ep2_tournament_events.3502.a:0 "ใครรับผิดชอบเรื่องนั้น?! หาพวกเขา ลงโทษพวกเขา!"
 ep2_tournament_events.3502.b:0 "ช่างเป็นการประลองที่ดูแลรักษาได้อย่างน่าอับอาย"
 ep2_tournament_events.3502.c:0 "ข้าจะจ่ายค่าซ่อมแซมเอง"
 ep2_tournament_events.3502.d:0 "เป็นการโจมตีที่น่าประทับใจ [competitor.GetFirstNameNoTooltip]!"

 ep2_tournament_events.3503.t:1 "$tournament_header$ $knight_culture_player_no_tooltip$ ผู้โชคร้าย"
 ep2_tournament_events.3503.desc:1 "ฝูงชนกำลังส่งเสียงครืนๆ อย่างประหลาด ราวกับว่าครึ่งหนึ่งกำลังคร่ำครวญและอีกครึ่งหนึ่ง... ปลื้มปีติ? ข้ามองผ่านแถวต่างๆ ของผู้เข้าแข่งขันและถอนหายใจออกมาโดยไม่สมัครใจ [hapless_knight.GetFirstName] ใช้เวลาฝึกซ้อมทั้งหมดพลาดเป้าอย่างสวยงาม และกำลังเตรียมพร้อมสำหรับการแทงเป้าอีกครั้งในตอนนี้\n\nขณะที่ [hapless_knight.GetSheHe] เข้าใกล้มัน [hapless_knight.GetSheHe] ทำหอกของ [hapless_knight.GetHerHis] หลุดมือไปเลย ด้วยความตื่นตระหนก [hapless_knight.GetFirstNameNoTooltip] เงยหน้าขึ้นทันเวลาที่จะถูก #EMP กระแทก#! เข้าที่กลางลำตัวโดยหุ่นซ้อมแทงเป้า! แขนของ [hapless_knight.GetHerHis|U] ยื่นออกไปและคว้าเสาไว้อย่างบ้าคลั่ง แต่แรงผลักดันก็พา [hapless_knight.GetHerHim] ผ่านไป สองสามวินาทีต่อมา [hapless_knight.GetSheHe] ก็แกว่งไปมาที่ปลายเสาอย่างช่วยไม่ได้ ติดอยู่กลางอากาศ"
 ep2_tournament_events.3503.a:0 "ช่างเป็นพรสวรรค์ด้านตลกขบขันทางกายภาพ!"
 ep2_tournament_events.3503.a.tt.success:0 "[hapless_knight.GetFirstNameNoTooltip] ยอมรับข้อเสนอจ้างงานของท่าน"
 ep2_tournament_events.3503.a.tt.failure:0 "[hapless_knight.GetFirstNameNoTooltip] รำคาญกับข้อเสนอแนะ"
 ep2_tournament_events.3503.b:0 "[hapless_knight.GetSheHe|U] กำลัง ทำให้กีฬานี้เป็นเรื่องตลก! แบน [hapless_knight.GetHerHim]!"
 ep2_tournament_events.3503.b.tt.success:0 "[hapless_knight.GetFirstNameNoTooltip] ถูกไล่ออกจากกการแข่งขัน เนื่องจาก ทำให้เสียชื่อเสียง"
 ep2_tournament_events.3503.b.tt.failure:0 "[hapless_knight.GetFirstNameNoTooltip] จัดการอ้อนวอนคดีของ [hapless_knight.GetHerHis] ได้สำเร็จ"
 ep2_tournament_events.3503.c:0 "ข้าค่อนข้างชอบ [hapless_knight.GetHerHim] จริงๆ นะ"
 ep2_tournament_events.3503.d:0 "ฮ่า! #EMP ฮ่า!#!"

 ep2_tournament_events.3504.t:0 "ช้าเกินไป"
 ep2_tournament_events.3504.desc:0 "เมื่อข้าเติบโตขึ้น อาจารย์เก่าของข้าสอนข้าว่าลมหายใจสุดท้ายของข้าควรจะหมดไปก่อนที่หอกจะกระทบ\n\nหนึ่งก้าว สองก้าว สามก้าว เดิน ควบม้า ลดหอกลง จัดท่าใหม่ เล็งปลาย หายใจเข้า หายใจออก โจมตีเข้าเป้า\n\nสำเร็จ! หอกของข้าแตกเป็นเสี่ยงๆ แต่ข้าตระหนัก — ช้าเกินไป — ว่าม้าของข้ายังคงควบม้าอยู่ ไม่ใช่ควบเต็มที่ ความเจ็บปวดเกิดขึ้นทันทีและชัดเจนเมื่อกระบองที่ปลายเสา #X กระแทก#! เข้าที่หลังของข้า ทำให้ข้าตกจากอานม้าอย่างหมดจด\n\nข้าลอยอยู่ในอากาศ โลกหยุดนิ่ง โอ้ อาจารย์เก่าของข้าจะขมวดคิ้วเพียงใดหากข้าทำสิ่งใดไม่สมบูรณ์แบบ...\n\nโลกเริ่มเคลื่อนไหว พื้นดินพุ่งเข้ามาหาข้า และทันใดนั้นทุกอย่างก็มืดลง"
 ep2_tournament_events.3504.a:0 "..."

 ### Joust Events

 ep2_tournament_events.4001.t:1 "$tournament_versus_header$ ถูกฟัน"
 ep2_tournament_events.4001.desc:0 "ไปยังเครื่องหมาย จัดหอก พิงหลังบนอานม้า รอสัญญาณ เอนตัวไปข้างหน้า เล็ง-\n\nลำดับของการประลองทวนบนหลังม้าเกือบจะเป็นกลไกสำหรับข้าแล้วในตอนนี้ แต่เมื่อแรงกระแทกคู่สั่นสะเทือนผ่านตัวข้า ความเจ็บปวดที่แหลมคมและแผดเผาก็ลุกโชนขึ้นตามแขนข้า\n\nเลือดไหลออกมาอย่างอิสระจากบาดแผลที่กล้ามเนื้อต้นแขน หอกของคู่ต่อสู้ [versus_contestant.GetFirstNamePossessive] ได้ฟันเฉือนไปตามต้นแขนของข้าอย่างรุนแรง\n\nมันเป็นบาดแผลร้ายแรง ไม่มีใครกล่าวหาข้าว่าขี้ขลาดหากข้าถอนตัว และอันที่จริง คนรับใช้ที่กังวลหลายคนกำลังยืนกรานให้ข้าทำ เช่นนั้น"
 ep2_tournament_events.4001.a:0 "พาข้ากลับขึ้นม้า!"
 ep2_tournament_events.4001.a.tt:0 "[courtiers|E] และ [guests|E] ทั้งหมดได้รับความเห็น #COLOR_GREEN +10#! ต่อท่าน"
 ep2_tournament_events.4001.b:0 "ข้าแข็งแกร่งกว่านั้น"
 ep2_tournament_events.4001.c:0 "ความรอบคอบเป็นส่วนที่ดีกว่าของความกล้าหาญ"

 ep2_tournament_events.4002.t:1 "$tournament_versus_header$ ตกม้า"
 ep2_tournament_events.4002.desc:0 "ตุ้บ! เสียงไม้กระทบไม้ดังสนั่นบ่งบอกว่าการเล็งของข้าแม่นยำ และแรงที่อยู่เบื้องหลังมันมากพอที่จะ ทำให้ [versus_contestant.GetFirstName] โซเซอย่างน่าหวาดเสียวก่อนที่จะล้มลงกับพื้น ข้าหยุดม้าเมื่อสิ้นสุดการวิ่งและมองลงไปที่คู่ต่อสู้ของข้า\n\n[versus_contestant.GetFirstNameNoTooltip] ลากตัวเองขึ้นมายืน ดูเหมือนจะแค่จุกมากกว่าบาดเจ็บ แต่โล่ของ [versus_contestant.GetHerHis] แตกเป็นสองท่อนอยู่บนพื้นใกล้ๆ [versus_contestant.GetHerHim] [versus_contestant.GetSheHe|U] มองมันอย่างเศร้าสร้อยขณะที่คนรับใช้เก็บชิ้นส่วน เพิ่มมันลงในกองเล็กๆ ที่ข้ารู้ว่าเป็นโล่หลัก - และน่าจะเป็นโล่อื่นเพียงอันเดียว - ของ [versus_contestant.GetHerHis]"
 ep2_tournament_events.4002.a:0 "คนรับใช้! ไปเอาโล่สำรองอันหนึ่งของข้ามาให้ [versus_contestant.GetWomanMan] ผู้นี้!"
 ep2_tournament_events.4002.b:0 "ท่านบาดเจ็บหรือไม่? มาช่วยท่านลุกขึ้น!"
 ep2_tournament_events.4002.c:0 "นี่คือธรรมชาติของการประลองทวนบนหลังม้า"

 ep2_tournament_events.4003.t:1 "$tournament_versus_header$ ท่อนซุงอันยิ่งใหญ่"
 ep2_tournament_events.4003.desc:0 "ข้ากำลังควบม้าไปยังจุดเริ่มต้นเมื่อมีบางอย่าง ทำให้ข้าหยุดและหรี่ตา นอกจากว่าตาของข้าจะหลอกลวงข้า มีบางอย่างที่แปลกประหลาดอย่างแท้จริงกำลังเกิดขึ้นที่ปลายอีกด้านของลานประลองทวน\n\nคนรับใช้ของคู่ต่อสู้ [versus_contestant.GetFirstNamePossessive] กำลังดิ้นรนเพื่อยกหอกของพวกเขาขึ้นไปให้ [versus_contestant.GetHerHim] และด้วยเหตุผลที่ดี อาวุธยักษ์นั้นไม่เหมือนหอกไม้เท่าไหร่ แต่เหมือนท่อนซุงที่ถูกถอนรากถอนโคน ด้ามขนาดมหึมาที่ยาวเท่ากับชายสองคน\n\nข้ามองอย่างไม่เชื่อขณะที่ [versus_contestant.GetFirstNameNoTooltip] ยกมันขึ้นอย่างเย้ยหยัน พิงมันไว้กับคอม้าเพื่อความมั่นคง ฝูงชนส่งเสียงครืนๆ ด้วยความคาดหวังและความไม่ยุติธรรมผสมกัน เสียงที่ปะปนกันโต้เถียงกันว่าจะปล่อยไปหรือประท้วงความไม่เป็นธรรม"
 ep2_tournament_events.4003.a:0 "แน่นอนว่านี่ไม่ได้รับอนุญาต?!"
 ep2_tournament_events.4003.a.tt:0 "ตอนนี้ ผู้ตัดสินที่ใกล้ที่สุดอยู่ที่ไหน?"
 ep2_tournament_events.4003.b:0 "มาเถอะ ท่านแน่ใจหรือว่านี่คือวิธีที่ท่านต้องการชนะ?"
 ep2_tournament_events.4003.b.tt.win:0 "ท่านจัดการเกลี้ยกล่อม [versus_contestant.GetHerHim] ได้"
 ep2_tournament_events.4003.b.tt.lose:0 "ท่านล้มเหลวในการเกลี้ยกล่อม [versus_contestant.GetHerHim]"
 ep2_tournament_events.4003.c:0 "ต้นอ่อนที่โตเกินไปนั่นช่วยเจ้าจากข้าไม่ได้หรอก!"
 ep2_tournament_events.4003.c.tt.win:0 "ท่านเอาชนะความเสียเปรียบของท่านได้"
 ep2_tournament_events.4003.c.tt.lose:0 "หอกของ [versus_contestant.GetFirstNamePossessiveNoTooltip] พิสูจน์ว่ามากเกินกว่าจะเอาชนะได้"

 ep2_tournament_events.4004.t:1 "$tournament_versus_header$ ปัญหาที่เท้า"
 ep2_tournament_events.4004.desc:0 "ข้าปัดเป่าความประหม่าตามปกติก่อนการประลองทวนด้วยการยุ่งอยู่กับการตรวจสอบและตรวจสอบอุปกรณ์ต่างๆ ของข้าซ้ำแล้วซ้ำเล่า อย่างไรก็ตาม ขณะที่ข้าทำ เช่นนั้น ข้าก็ตระหนักถึงการปรากฏตัวข้างๆ ข้า คู่ต่อสู้ของข้า [versus_contestant.GetFirstName] กำลังเดินเท้าอย่างน่าสงสัย ดาบวางอยู่บนไหล่ของ [versus_contestant.GetHerHis] [versus_contestant.GetSheHe] เอนตัวไปข้างหน้าเพื่อพูดด้วยน้ำเสียงที่ค่อนข้างเป็นความลับ\n\n"[ROOT.Char.GetFirstName]! ท่านอยากจะยืดเส้นยืดสายกับข้าไหม?" [versus_contestant.GetSheHe] คำราม ในการตอบสนองต่อสีหน้าที่ไม่สะทกสะท้านของข้า [versus_contestant.GetSheHe] หัวเราะและชี้ไปที่พื้น\n\n"เรามาทำรอบนี้ด้วยการเดินเท้ากันดีไหม? พักเล็กน้อย เพื่อให้ฝูงชนได้เห็นอะไรที่แตกต่างออกไป?""
 ep2_tournament_events.4004.a:0 "ไม่สำคัญว่าข้าจะเอาชนะเจ้าได้อย่างไร!"
 ep2_tournament_events.4004.a.success:0 "ท่านเอาชนะ [versus_contestant.GetFirstNameNoTooltip] ด้วยคมดาบ"
 ep2_tournament_events.4004.a.failure:0 "ท่านล้มเหลวในการเอาชนะ [versus_contestant.GetFirstNameNoTooltip]"
 ep2_tournament_events.4004.b:0 "กลับขึ้นม้าของเจ้าไป เจ้าโง่"
 ep2_tournament_events.4004.c:0 "เดินเท้า ใช่ แต่ #EMP ด้วย#! หอก"

 ep2_tournament_events.4005.t:1 "$tournament_versus_header$ [versus_contestant.GetWomanMan|U] ผู้มีเกียรติ?"
 ep2_tournament_events.4005.desc:0 "แขนท่อนล่างของคู่ต่อสู้ [versus_contestant.GetFirstNamePossessive] ห้อยอย่างไม่มีประสิทธิภาพขณะที่ [versus_contestant.GetSheHe] เข้าประจำที่ สีหน้าบิดเบี้ยวกลายเป็นเสียงหอบที่กลั้นไว้ด้วยความเจ็บปวดขณะที่ [versus_contestant.GetSheHe] พยายามยกหอกของ [versus_contestant.GetHerHis] เห็นได้ชัดว่ารอบที่แล้วส่งผลกระทบอย่างรุนแรง\n\nข้ามองด้วยความประหลาดใจขณะที่คนรับใช้ของ [versus_contestant.GetFirstNamePossessiveNoTooltip] ยกหอกเข้าที่ มัดมันไว้กับต้นแขนของ [versus_contestant.GetHerHis] ดูเหมือนว่าความต้องการที่จะแสดงเกียรติของพวกเขา ทำให้คู่ต่อสู้ของข้ายังคงแข่งขันต่อไป แต่ไม่มีความหวังว่าพวกเขาจะชนะ\n\nข้าทำความเคารพด้วยหอกของข้าเองเป็นการตอบสนองขณะที่ฝูงชนเชียร์เราทั้งคู่"
 ep2_tournament_events.4005.a:0 "มันคงเป็นการไม่เคารพหากทำสิ่งใดนอกจาก ทำให้ดีที่สุด"
 ep2_tournament_events.4005.a.tt:0 "ท่านแทงเป้าใส่พวกเขาเหมือนกับที่ท่านทำกับคนอื่นๆ"
 ep2_tournament_events.4005.b:0 "เกียรติที่แสดงออกมาสมควรได้รับเกียรติในระดับเท่าเทียมกัน!"
 ep2_tournament_events.4005.b.tt:0 "ท่านให้คู่ต่อสู้ของท่านผ่านไปอย่างเมตตา ยกหอกของท่านขึ้นสู่ท้องฟ้า"
 ep2_tournament_events.4005.c:0 "โอกาสที่สมบูรณ์แบบ!"
 ep2_tournament_events.4005.c.tt:0 "ท่านกวาดหอกของท่านเป็นวงกว้าง รับประกันว่าจะ ทำให้คู่ต่อสู้ของท่านตกจากอานม้า"

 ep2_tournament_events.4006.t:1 "$tournament_versus_header$ ขอความเมตตา"
 ep2_tournament_events.4006.desc:0 "ม้าทั้งสองตัวเริ่มวิ่งเหยาะๆ หอกของข้าเริ่มลดลงสู่ตำแหน่ง แต่ข้าไม่เห็นการเคลื่อนไหวที่คล้ายกันจากคู่ต่อสู้ของข้า [versus_contestant.GetFirstName] แต่หอกของ [versus_contestant.GetHerHis] ชี้ห่างจากข้า ออกนอกเป้าหมายไปไกล\n\n'การผ่านอย่างเมตตา' เป็นที่รู้จักกันดีในหมู่ผู้ที่คุ้นเคยกับการประลองทวนบนหลังม้า เมื่อการผ่านได้เริ่มขึ้น การเล็งห่างจากคู่ต่อสู้โดยเจตนาจะส่งสัญญาณว่าท่านต้องการขอเริ่มใหม่ มันเป็นเรื่องของการให้เกียรติคู่แข่งของตนที่จะปฏิบัติตามคำขอนั้น\n\nแน่นอน นี่เป็นเพียงกรณีที่ท่าน #EMP เห็น#! ความปรารถนาของคู่ต่อสู้ของท่าน..."
 ep2_tournament_events.4006.a:0 "ข้าจะไม่รับชัยชนะง่ายๆ"
 ep2_tournament_events.4006.a.tt:0 "เคารพความปรารถนาของ [versus_contestant.GetFirstNamePossessiveNoTooltip] สำหรับการผ่านอย่างเมตตา"
 ep2_tournament_events.4006.b:0 "โอ้ ไม่นะ ดูเหมือนว่าข้าไม่ทันสังเกตคำขอของพวกเขา!"
 ep2_tournament_events.4006.b.tt:0 "ท่านไม่ปล่อยให้หอกของท่านสั่นคลอน"

 ep2_tournament_events.4007.t:1 "$tournament_versus_header$ หายนะและคนดูแลม้า"
 ep2_tournament_events.4007.desc:0 "[versus_contestant.GetFirstName|U] ขี่ม้าของ [versus_contestant.GetHerHis] ผ่านข้าไปหลังจากควบม้าผ่านไปหนึ่งรอบ [versus_contestant.GetHerHim]selfกำลังยุ่งอยู่กับบังเหียนม้าของ [versus_contestant.GetHerHis] ที่เดินงก ๆ เงิ่น ๆ อยู่ข้าง ๆ คือคนดูแลม้าของ [versus_contestant.GetHerHis] [groom.GetSheHe|U] สวมเสื้อผ้าที่ขาดรุ่งริ่งอย่างน่าประหลาดใจ ตะเข็บหลุดลุ่ย\n\n"เจ้าชื่ออะไร [groom.GetWomanMan] ของข้า?" [groom.GetSheHe|U] เงยหน้าขึ้นอย่างสะดุ้ง ขณะที่นายของ [groom.GetHerHis] และม้าเดินต่อไปโดยไม่มี [groom.GetHerHim]\n\n"[groom.GetFirstName] [ROOT.Char.Custom('FormOfAddressForLiege')]" ท่ามกลางคำตอบของ [groom.GetHerHis] เป็นไปไม่ได้ที่จะพลาดสายตาอิจฉาที่ [groom.GetHerHis] มองไปยังคนดูแลม้าของข้าที่ แต่งตัวภูมิฐาน ซึ่งกำลังดูแลม้าของข้าอยู่"
 ep2_tournament_events.4007.a:0 "ช่างเป็นสิ่งมีชีวิตที่น่าสังเวช!"
 ep2_tournament_events.4007.b:0 "เจ้าสนใจงานไหม?"
 ep2_tournament_events.4007.b.tt:0 "[versus_contestant.GetFirstNameNoTooltip] จะไม่ชอบสิ่งนี้..."
 ep2_tournament_events.4007.c:0 "บางทีเจ้าอยากจะทำเหรียญสักสองสามเหรียญ?"
 ep2_tournament_events.4007.c.tt:0 "เกลี้ยกล่อมให้ [groom.GetHerHim] ตบก้นม้าอย่างแรง"
 ep2_tournament_events.4007.d:0 "รับใช้นายของเจ้าให้ดี [groom.GetFirstNameNoTooltip]"

 ep2_tournament_events.4008.t:1 "$tournament_versus_header$ พวกเจ้าเป็นใคร?"
 ep2_tournament_events.4008.desc:0 "ขณะที่เสียงดังกระหึ่มลงมาจากอัฒจันทร์ ม้าของข้ากระดิกหูด้วยความไม่สบายใจเล็กน้อย ข้าตบแผงคอของมันอย่างปลอบโยน ฝูงชนแสดงความเป็นศัตรูอย่างมากในรอบนี้ อันที่จริง ขณะที่ข้าสแกนพวกเขา พวกเขาก็เริ่มร้องเพลง\n\n#EMP [ROOT.Char.Custom('GetNegativeChant')]#!\n\nบางคนถึงกับเอนตัวข้ามรั้ว และข้าสังเกตเห็นด้วยความตื่นตระหนกถึงใบหน้าที่โห่ร้อง น้ำลายฟูมปากในแถวหน้ากำลังกรีดร้องใส่ข้า"
 ep2_tournament_events.4008.a:0 "พวกเขาจะต้องรับมือกับชัยชนะของข้า!"
 ep2_tournament_events.4008.a.success:0 "ท่านสลัดการดูถูกของฝูงชนได้สำเร็จ"
 ep2_tournament_events.4008.a.failure:0 "ฝูงชนเข้ามาในหัวท่าน"
 ep2_tournament_events.4008.a.criticalfailure:0 "ท่านได้รับบาดเจ็บเล็กน้อยจากการที่ฝูงชนขว้างปาสิ่งของใส่ท่าน"
 ep2_tournament_events.4008.b:0 "ข้าไม่แน่ใจว่าการชนะจะเป็นประโยชน์สูงสุดของข้า..."
 ep2_tournament_events.4008.b.tt:0 "ล้มมวย"

 ep2_tournament_events.4009.t:1 "$tournament_versus_header$ อัศวินผู้ขัดสน"
 ep2_tournament_events.4009.desc:0 "เคร้ง! หอกสองอันแตกเป็นเสี่ยงๆ อย่างรุนแรงเมื่อกระทบเป้า ข้าม้วนตัวรับแรงสะท้อนตามที่ข้าถูกสอน ดึงตัวเองขึ้นตรงขณะที่ม้าของข้าชะลอความเร็วลงเป็นเดิน ขณะที่ข้าสลัดความมึนงงจากแรงกระแทกออกจากหัว ความโกลาหลที่เพิ่มขึ้นในฝูงชน ทำให้ข้าเหลือบมองกลับไปทางที่ข้ามา\n\nคู่ต่อสู้ของข้า [versus_contestant.GetFirstName] เห็นได้ชัดว่ากำลังเดือดร้อน ไม่ใช่ทางร่างกาย เท่าที่ข้าบอกได้ แต่ [versus_contestant.GetSheHe] กำลังมีส่วนร่วมในสิ่งที่ดูเหมือนจะเป็นการโต้เถียงหรือการสนทนากับคนรับใช้ที่โชคร้าย เข้าไปใกล้ขึ้น ข้าได้ยินเศษเสี้ยวของการโต้เถียงของพวกเขา\n\n"เจ้าหมายความว่าอย่างไรที่เราไม่มีอีกแล้ว? เจ้า #EMP ทำหาย#! อันสำรองเพียงอันเดียวของเรา?!"
 ep2_tournament_events.4009.desc.poor:0 "\n\nใช้เวลาสักครู่ แต่ทันใดนั้นข้าก็นึกขึ้นได้ บางทีข่าวลือเกี่ยวกับปัญหาทางการเงินในปัจจุบันของ [versus_contestant.GetFirstNamePossessiveNoTooltip] อาจมีความน่าเชื่อถือมากกว่าที่ข้าคิด..."
 ep2_tournament_events.4009.desc.lowborn:0 "\n\nมันค่อยๆ กระจ่างขึ้นสำหรับข้า [versus_contestant.GetFirstNameNoTooltip] ไม่ได้มาจากตระกูลขุนนาง เงินน่าจะหายากกว่าสำหรับพวกเขามากกว่าที่ข้าคาดไว้..."
 ep2_tournament_events.4009.a:0 "ฮ่า ฮ่า! ออกไปจากลานประลองทวนซะ เจ้า [versus_contestant.Custom2('InsultNoun', ROOT.Char)] ผู้ยากไร้!"
 ep2_tournament_events.4009.b:0 ""[versus_contestant.GetFirstNameNoTooltip]! ข้าขอเสนอหอกให้ท่านได้ไหม?""
 ep2_tournament_events.4009.c:0 "เอาล่ะ การแข่งขันต้องดำเนินต่อไป"

 #### Horse Racing

 ep2_tournament_events.4500.t:0 "$tournament_header$ นักขี่ม้า"
 ep2_tournament_events.4500.desc:0 "ม้าของข้าพร้อมแล้วแน่นอน แต่สัตว์ร้ายก็ไม่มีอะไรหากไม่มีนักขี่ม้าที่มีความสามารถมาควบคุมมัน ด้วยเหตุนี้ ข้าจึงพบว่าตัวเองมีนักขี่ม้าสามคนที่เป็นไปได้เรียงรายอยู่ตรงหน้าข้า ทั้งหมดต่างเรียกร้องเกียรติยศที่จะได้รับอนุญาตให้เป็นตัวแทนข้า\n\n"
 ep2_tournament_events.4500.knight:0 "คนแรกคือ [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('jockey1') )] [jockey1.GetFirstName] ของข้า เป็นผู้สมัครที่ยุติธรรมเมื่อพิจารณาจากประสบการณ์ของ [jockey1.GetHerHis] ในการจัดการม้าในอาชีพของ [jockey1.GetHerHis]"
 ep2_tournament_events.4500.guest:0 "อาสาสมัครอีกคนทันทีคือ [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('jockey2') )] [jockey2.GetFirstName] ของข้า ซึ่งบางทีอาจต้องการพิสูจน์ความมีน้ำใจของข้า"
 ep2_tournament_events.4500.nobody:0 "\n\nคนสุดท้ายเป็นคนแปลกหน้าสำหรับข้าโดยสิ้นเชิง เป็น [jockey3.GetWomanMan] ท้องถิ่นที่ไม่มีชื่อเสียงใดๆ เลย ซึ่งใช้ชื่อว่า [jockey3.GetFirstName]"
 ep2_tournament_events.4500.fallback:0 "ไม่มีใครในสามคนดูเหมือนจะเป็นผู้สมัครที่โดดเด่นเป็นพิเศษ - พวกเขาทั้งหมดเป็นคนแปลกหน้าสำหรับข้าโดยสิ้นเชิง และเห็นได้ชัดว่าเป็นเพียงสามัญชนที่มองหาโอกาสสร้างชื่อเสียงและโชคลาภ - แต่พวกเขาเป็นเพียงคนเดียวที่มีอยู่"
 ep2_tournament_events.4500.a:0 "เจ้าใช้ได้!"
 ep2_tournament_events.4500.b:0 "บางทีอาจเป็นเจ้า?"
 ep2_tournament_events.4500.c:0 "เอาล่ะ ข้าชอบการพนัน..."
 ep2_tournament_events.4500.knight.tt:0 "ไปกับ [jockey1.GetFirstNameNoTooltip] กันเถอะ"
 ep2_tournament_events.4500.guest.tt:0 "[jockey2.GetFirstNameNoTooltip] ดูเหมือนจะเป็นตัวเลือกที่ดี"
 ep2_tournament_events.4500.nobody.tt:0 "ทำไมไม่ลองเสี่ยงกับ [jockey3.GetFirstNameNoTooltip] ดูล่ะ?"

 #### Recital Events

 ep2_tournament_events.5501.t:2 "$tournament_contest_header$ ช่วงเวลาที่ถูกขโมย"
 ep2_tournament_events.5501.desc:0 "เสียงเชียร์ดังกระหึ่มจากฝูงชนที่รวมตัวกันขณะที่ [enemy.GetFirstName] จบการขับขานของ [enemy.GetHerHis] ด้วยท่าทางอันสง่างามและการโค้งคำนับ คนเดียวที่ไม่ผิวปากและปรบมือคือตัวข้าเอง\n\n#EMP อย่างไร#! [enemy.GetSheHe] ถึงรู้ได้? นี่เป็นการวางแผนหรือไม่? หรือบางที ด้วยกลไกบางอย่างของ [ROOT.Char.GetFaith.DevilName] มันเป็นเพียงเรื่องบังเอิญที่บทกวีของ [enemy.GetFirstNamePossessiveNoTooltip] จบลงเกือบจะ #EMP เหมือนกัน#! กับของข้าเอง?\n\nผู้ชมที่รวมตัวกันเงียบลงอย่างคาดหวัง ถึงตาข้าแล้ว"
 ep2_tournament_events.5501.a:0 "ข้าจะแสดงให้พวกเขาเห็นว่ามันเกี่ยวกับ #EMP การนำเสนอ#! ทั้งหมด"
 ep2_tournament_events.5501.b:0 "ถึงเวลาด้นสด!"
 ep2_tournament_events.5501.b.success:0 "ท่านด้นสดได้สำเร็จ"
 ep2_tournament_events.5501.b.failure:0 "ความพยายามของท่านเป็นหายนะ"
 ep2_tournament_events.5501.c:0 "นี่เป็นการวางแผน กรรมการ!"
 ep2_tournament_events.5501.c.success:0 "มัน #EMP เป็น#! กลอุบายจาก [enemy.GetFirstNameNoTooltip]"
 ep2_tournament_events.5501.c.failure:0 "ทุกคนคิดว่าท่านเป็นคนโง่ที่ไม่มีเหตุผล"

 ep2_tournament_events.5502.t:2 "$tournament_contest_header$ ทั้งหมดเป็นความเข้าใจผิด"
 ep2_tournament_events.5502.start:0 "ใช้เวลาเพียงบทกวีเดียวเท่านั้นก่อนที่เสียงพึมพำจะเริ่มขึ้น [contestant.GetFirstName] อยู่บนเวทีอย่าง #EMP หน้าด้าน#! ขับขานบทกวีจากเพลงพื้นบ้านยอดนิยม! เสียงบ่นที่ไม่พอใจในหมู่ฝูงชนเริ่มขึ้นขณะที่ [contestant.GetSheHe] ดำเนินต่อไป\n\n"
 ep2_tournament_events.5502.culture:0 "มีบางอย่างไม่ค่อยสมเหตุสมผล ข้าครุ่นคิด แน่นอนว่า [contestant.GetFirstNameNoTooltip] คงไม่คุ้นเคยกับเพลงนั้น เนื่องจาก [contestant.GetSheHe] เป็นคน [contestant.GetCulture.GetName] ความทรงจำเล็กๆ ผุดขึ้นมาในความคิดของข้าโดยไม่ได้ตั้งใจ: คนงานที่สร้างเวทีได้ผิวปากเพลงนั้นก่อนหน้านี้!"
 ep2_tournament_events.5502.friend:0 "ข้าตระหนักทันทีว่าเกิดอะไรขึ้น แม้ว่าฝูงชนจะยังคงก่อกวนเพื่อนของข้า [contestant.GetFirstNameNoTooltip] ต่อไป [contestant.GetSheHe|U] เป็นคน [contestant.GetCulture.GetName] และแน่นอนว่าคงเพิ่งได้ยินเพลงนี้โดยไม่รู้ว่ามันแพร่หลายเพียงใด!"
 ep2_tournament_events.5502.end:0 "\n\nกลับมาบนเวที [contestant.GetFirstNameNoTooltip] หยุดพูดขณะที่ฝูงชนระเบิดเสียงเยาะเย้ย ผักสองสามชนิดตกลงมาบน [contestant.GetHerHim] ขณะที่ [contestant.GetSheHe] ป้องกันตัวเองจากสิ่งของที่ถูกขว้างปา"
 ep2_tournament_events.5502.a:0 "พอแล้ว! นี่ไม่ใช่ความผิดของ [contestant.GetHerHis]!"
 ep2_tournament_events.5502.c.success:0 "ท่านเกลี้ยกล่อมฝูงชนได้สำเร็จ"
 ep2_tournament_events.5502.c.failure:0 "ฝูงชนเพิกเฉยต่อคำวิงวอนของท่าน"
 ep2_tournament_events.5502.b:0 "โห่! #EMP โห่!#!"
 ep2_tournament_events.5502.c:0 "เอาล่ะ นี่มันไม่เหมาะสมอย่างยิ่ง"

 ep2_tournament_events.5503.t:1 "$tournament_contest_header$ ตื่นเวที"
 ep2_tournament_events.5503.desc:1 "แตรเป่า! ฝูงชนโห่ร้องและตะโกน! ข้าขึ้นไปบนเวทีขับขาน โบกมือ ความเงียบสงัดลงเมื่อข้าทำท่ายืนอย่างวีรบุรุษ อกผาย แขนกางออก\n\nข้าอ้าปาก มันแห้ง มันแห้งมาก ข้าพยายามพูด แต่คำพูดไม่ออกมา ดวงตาหลายร้อยคู่จ้องมองมาที่ข้า\n\nทำไมข้าพูดไม่ได้?!"
 ep2_tournament_events.5503.rich:1 "ขณะที่เสียงพึมพำของฝูงชนดังขึ้น มือที่คลำไปมาของข้าก็ปิดลงบนบางสิ่ง บางสิ่งที่ใหญ่และเป็นหนัง: ถุงเงินของข้า"
 ep2_tournament_events.5503.seducer:1 "ความตื่นตระหนก ทำให้ข้าตัวสั่น ลมหายใจหอบออกมาในลักษณะที่... #EMP คุ้นเคย#! การเตือนความจำ... ว่าความหลงใหลไม่เคย ทำให้ข้าล้มเหลวมาก่อน..."
 ep2_tournament_events.5503.fallback:1 "ก้อนในท้องของข้า ซึ่งไม่รู้จักเมื่อครู่ก่อนหน้านี้ บีบรัดอย่างน่าสะอิดสะเอียน และเสียงพึมพำของฝูงชนก็ดังขึ้น"
 ep2_tournament_events.5503.a:0 "ต้องมีบางอย่างที่ข้าสามารถผ่านไปได้..."
 ep2_tournament_events.5503.a.tt:0 "โชคดีที่ข้ามีบทกวีเก่าๆ สองสามบทที่จำได้!"
 ep2_tournament_events.5503.b:0 "ดูเถิด! เหรียญฟรี!"
 ep2_tournament_events.5503.b.tt:0 "ข้าสามารถหลบหนีได้อย่างรวดเร็วขณะที่พวกเขาทั้งหมดแย่งชิงกัน!"
 ep2_tournament_events.5503.c:1 "#EMP การแสดงออกทางกายภาพ#! บางอย่างคงไม่ผิด"
 ep2_tournament_events.5503.c.tt:0 "นักพนันจะต้อง #EMP รัก#! สิ่งนี้!"
 ep2_tournament_events.5503.d:0 "ดูนั่น! ลิงสามหัว!"
 ep2_tournament_events.5503.d.win:0 "ท่านเบี่ยงเบนความสนใจของฝูงชนได้สำเร็จ"
 ep2_tournament_events.5503.d.lose:0 "ฝูงชนไม่ถูกหลอก"
 ep2_tournament_events.5503.e:1 ""อะ-#EMP แฮ่ม#! ดังที่ เอ่อ บรรพบุรุษของเราเคย ร-ร-ร้องเพลง...""

 ep2_tournament_events.5504.t:2 "$tournament_contest_header$ ความประสงค์ของสภาพอากาศ"
 ep2_tournament_events.5504.desc:0 "#BOL เปรี้ยง!#!\n\nแสงวาบของฟ้าผ่าอย่างกะทันหันนำหน้าเสียงคำรามของฟ้าร้อง และขณะที่ข้าเดินไปยังเวทีที่ยกสูง เห็นได้ชัดว่าสภาพอากาศที่น่ารื่นรมย์ก่อนหน้านี้ได้เปลี่ยนเป็นสภาพที่มืดครึ้มอย่างแน่นอน ไม่ทันที่ข้าจะก้าวขึ้นบันไดขั้นแรก ฝนก็เริ่มตก\n\nฝูงชนยืนรออย่างคาดหวัง ค่อนข้างไม่เต็มใจ เปียกโชกมากขึ้นทุกนาที ข้าอ้าปาก และเสียงดังสนั่นอีกครั้งก็ดังไปทั่วทั้งกลุ่ม ข้ามองขึ้นไปบนท้องฟ้า\n\nเอาล่ะ นี่จะเป็นความท้าทายทีเดียว"
 ep2_tournament_events.5504.a:0 "...และข้า #EMP รัก#! ความท้าทาย!"
 ep2_tournament_events.5504.a.success:0 "สภาพอากาศเพิ่มความเศร้าโศกให้กับคำพูดของท่าน"
 ep2_tournament_events.5504.a.failure:0 "ท่านถูกกลบด้วยเสียงพายุ"
 ep2_tournament_events.5504.b:0 "จะเป็นอย่างไรถ้าเราถูกฟ้าผ่า?!"

 ep2_tournament_events.5505.t:2 "$tournament_contest_header$ ฉวยโอกาส"
 ep2_tournament_events.5505.desc:0 "บทกวีอีกบทจบลง อีกหนึ่งความสำเร็จกับฝูงชน ข้ากำลังสนุกกับตัวเองมาก และการชื่นชมอย่างเสียงดังของฝูงชนยิ่ง ทำให้จิตวิญญาณของข้าสูงขึ้นไปอีก\n\nขณะที่ข้ารับเสียงปรบมือหลังจากบทกวีที่เฉียบแหลมเป็นพิเศษ ข้าเห็นคู่ต่อสู้คนหนึ่งของข้า [enemy.GetFirstName] กำลังซ้อมบทของ [enemy.GetHerHis] ด้วยสีหน้าบึ้งตึง การโห่ร้องที่ดังขึ้นอีกครั้งยืนยันความสงสัยของข้า: [enemy.GetSheHe] เห็นได้ชัดว่าไม่พอใจกับการต้อนรับที่ข้าได้รับ!\n\nเอาล่ะ บางที"
 ep2_tournament_events.5505.start.malevirgin:0 "คนขี้เหงาที่น่าเศร้า ไร้หญิงสาว"
 ep2_tournament_events.5505.start.femalevirgin:0 "คนขี้เหงาที่อ้วนเตี้ย ไร้ความรัก"
 ep2_tournament_events.5505.start.old:0 "[enemy.GetWomanMan] แก่ที่เหี่ยวย่น ทรุดโทรม"
 ep2_tournament_events.5505.start.fat:0 "คนอ้วนที่ร้องไห้ฟูมฟาย มันเยิ้ม"
 ep2_tournament_events.5505.start.soft:0 "คนโง่ที่อ่อนแอ ประจบประแจง"
 ep2_tournament_events.5505.start.compassionate:0 "วิญญาณที่โชคร้าย"
 ep2_tournament_events.5505.start.fallback:0 "[enemy.Custom2('InsultAdjective', ROOT.Char)] [enemy.Custom2('InsultNoun', ROOT.Char)]"
 ep2_tournament_events.5505.end:0 "ต้องการบทกวีที่เตรียมไว้ #EMP โดยเฉพาะ#! สำหรับ [enemy.GetHerHim]!\n\n"หาก [ROOT.Char.GetFaith.HighGodName] [ROOT.Char.GetFaith.HighGodHerselfHimself|U] อยู่ที่นี่ แน่นอนว่า [ROOT.Char.GetFaith.HighGodNameSheHe|U] จะกล่าวว่า...""
 ep2_tournament_events.5505.maidenless:0 "...[enemy.GetFirstNameNoTooltip] เป็นคู่นอนที่ #EMP น่าเศร้า#! อย่างแท้จริง!"
