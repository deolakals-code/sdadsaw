 ep2_wedding.1090.t:0 "คู่สร้างคู่สม...?"
 ep2_wedding.1090.desc:0 "ฝูงชนกำลังโห่ร้องและดื่มอวยพรให้คู่บ่าวสาว แต่ท่ามกลางพวกเขานั้น ดูเหมือนว่าข้าจะคลาดสายตาจาก [ROOT.Char.Custom2('RelationToMe', 1090_target)] ของข้า [1090_target.GetFirstName] ไป"
 ep2_wedding.1090.desc_already_matched:0 "\n\nหลังจากการค้นหาอย่างละเอียด ในที่สุดข้าก็พบ [1090_target.GetHerHim] ในบริเวณที่เงียบสงัด กำลังสนทนาอย่างลึกซึ้งกับไม่ใช่ใครอื่นนอกจาก [1090_match.GetTitledFirstName] คนเดียวกับที่ข้าเคยพยายามจับคู่ให้ [1090_target.GetHerHim] ก่อนหน้านี้! ข้าไม่คิดว่าข้าควรเข้าไปยุ่ง..."
 ep2_wedding.1090.desc_new_match:0 "\n\nหลังจากการค้นหาอย่างละเอียด ในที่สุดข้าก็พบ [1090_target.GetHerHim] นั่งอยู่ที่มุมห้องและจ้องมองด้วยความสนใจ และข้ากล้าพูดได้ว่าด้วยความปรารถนา ไปยัง [1090_match.GetTitledFirstName] ผู้ ซึ่งกำลังให้ความบันเทิงแก่กลุ่มแขกที่อึกทึกครึกโครมด้วยเรื่องตลกและเรื่องเล่าของ [1090_match.GetHerHis]"
