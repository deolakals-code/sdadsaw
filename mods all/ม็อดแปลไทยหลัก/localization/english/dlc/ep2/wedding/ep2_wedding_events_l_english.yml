 ep2_wedding.3200.c.failure:0 "[my_spouse.GetFirstNameNoTooltip] ปฏิเสธ"
 ep2_wedding.3200.d:0 "มาเถิดที่รัก มันจะไม่เป็นไร"
 ep2_wedding.3200.d.success:0 "[my_spouse.GetFirstNameNoTooltip] ยอมตาม"
 ep2_wedding.3200.d.failure:0 "[my_spouse.GetFirstNameNoTooltip] ไม่พอใจ"
 ep2_wedding.3200.e:0 "อย่าทำตัวงี่เง่าสิ มันเป็นประเพณี!"
