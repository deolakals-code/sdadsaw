 # An Exotic Show
 ep2_wedding.1070.t:0 "การแสดงอันแปลกตา"
 ep2_wedding.1070.desc_host:0 "ข้ามองไปรอบๆ ตัวด้วยรอยยิ้มพึงพอใจ บรรยากาศในงานเลี้ยงผ่อนคลาย และแขกเหรื่อกำลังพูดคุยกันอย่างเพลิดเพลิน สนุกสนานกับดนตรีและความบันเทิง โดยไม่รู้เลยว่าส่วนที่ดีที่สุดที่เราวางแผนไว้เพื่อ ทำให้พวกเขาประหลาดใจยังมาไม่ถึง ข้าส่งสัญญาณให้คนรับใช้ดำเนินการต่อ"
 ep2_wedding.1070.desc_guest:0 "ข้ากำลังสนุกสนานอย่างยิ่งในงานเลี้ยงฉลองวิวาห์ โดยเฉพาะอย่างยิ่ง [host.GetTitledFirstName] ไม่ได้ประหยัดค่าใช้จ่ายสำหรับความบันเทิงเลย! นักดนตรีที่เก่งที่สุดกำลังบรรเลงให้เราฟัง ขณะที่นักแสดงและนักปาหี่กำลังแสดงฝีมือ และนักขับลำนำกำลังขับขานบทกวีอันไพเราะ ข้าจึงค่อนข้างประหลาดใจเมื่อ [host.GetFirstNameNoTooltip] ส่งสัญญาณให้นำบางสิ่งเข้ามาเพิ่ม"
 ep2_wedding.1070.desc_mid:0 "\n\nคนรับใช้สี่คนกลับมาในไม่ช้า ลากกรงที่ขัง [host.Custom('GetAnimalTypeCaptive')] อันสง่างามเข้ามา ซึ่งเป็นตัวที่ยอดเยี่ยมที่สุดเท่าที่ข้าเคยเห็นมา"
 ep2_wedding.1070.desc_good:0 "สัตว์ร้ายกระสับกระส่ายเล็กน้อย แต่ลูกกรงแข็งแรง และทุกคนก็เพลิดเพลินกับการแสดงจากตำแหน่งที่ปลอดภัย"
 ep2_wedding.1070.desc_bad:0 "สัตว์ร้ายกระสับกระส่าย และข้ามองดูด้วยความรู้สึกเป็นลางร้ายขณะที่กรงส่งเสียงเอี๊ยดอ๊าดและครวญครางไปตามทุกการเคลื่อนไหวของมัน จากนั้น ด้วยเสียง #EMP แคร็ก#! อันน่าสะพรึงกลัว ลูกกรงสำคัญอันหนึ่งก็หักสะบั้น และความโกลาหลก็บังเกิดขึ้น"
 ep2_wedding.1070.desc_bad_target:0 "\n\n[1070_target.GetTitledFirstName] ถูกล้อมอย่างรวดเร็ว"
