l_english: 
 
 # MAINTENANCE
 ep2_wedding.0001.t:0 "[GetActivityType('activity_wedding').GetNameNoTooltip]: การหมั้นหมายสิ้นสุดลง"
 ep2_wedding.0001.desc:0 "เวลาช่างผ่านไปรวดเร็วนัก ข้าคิดว่ายังมีเวลาเหลือเฟือที่จะจัด [GetActivityType('activity_wedding').GetName] อย่างสมเกียรติ แต่จดหมายอันเกรี้ยวกราดจาก [spouse_2.GetTitledFirstName] เตือนข้าว่าความอดทนของ [spouse_2.GetHerHis] ได้หมดสิ้นลงแล้ว และเวลาของข้าก็หมดลง เช่นกัน"
 ep2_wedding.0001.desc_betrothed:0 "\n\nเนื่องจากล้มเหลวในการจัดพิธีวิวาห์ระหว่าง [spouse_1.GetTitledFirstName] และ [spouse_2.GetFirstNameNoTooltip] ภายในระยะเวลาที่ตกลงกันไว้ สัญญาหมั้นจึงถือเป็นโมฆะ"
 ep2_wedding.0001.desc_self:0 "\n\nเนื่องจากล้มเหลวในการจัดพิธีวิวาห์ระหว่างตัวข้ากับ [spouse_2.GetFirstNameNoTooltip] ภายในระยะเวลาที่ตกลงกันไว้ สัญญาหมั้นจึงถือเป็นโมฆะ"
 ep2_wedding.0001.desc_conclusion:0 "\n\n[spouse_2.GetFirstNameNoTooltip] ผิดหวังอย่างเห็นได้ชัดและย้ำเตือนข้าว่าจะมีผลที่ตามมา..."
 ep2_wedding.0001.a:0 "คงมิใช่บุพเพสันนิวาส"
 ep2_wedding.0002.t:0 "[GetActivityType('activity_wedding').GetNameNoTooltip]: การเสียชีวิตก่อนวัยอันควร"
 ep2_wedding.0002.desc:0 "ข่าวร้ายมาถึงข้าเมื่อเช้านี้: [dead_spouse.GetTitledFirstName] ผู้ ซึ่งสัญญาว่าจะ แต่งงานกับ [alive_spouse.GetTitledFirstName] ใน [GetActivityType('activity_wedding').GetName] ได้ถึงแก่กรรมแล้ว และแผนการอันรอบคอบทั้งหมดของข้าก็สูญเปล่า!\n\nถึงเวลาหาคู่ครองคนใหม่แล้ว"
 ep2_wedding.0002.a:0 "โศกนาฏกรรมแห่งชีวิต"
 ep2_wedding.0003.desc:0 "ไม่มีสิ่งใดเตรียมข้าให้พร้อมรับจดหมายที่ข้ากำลังถืออยู่ในมืออันสั่นเทานี้ได้: คู่หมั้นของข้า [dead_spouse.GetTitledFirstName] ผู้ ซึ่งข้าสัญญาว่าจะ แต่งงานด้วยใน [GetActivityType('activity_wedding').GetName] ได้จากไปอย่างกะทันหัน\n\nจะไม่มีงานเฉลิมฉลองสำหรับข้า และแผนการอันรอบคอบทั้งหมดของครอบครัวข้าก็สูญเปล่าไปแล้ว"
 ep2_wedding.0003.a:0 "ช่างเป็นโศกนาฏกรรมโดยแท้..."
 ep2_wedding.0100.t:0 "พิธีวิวาห์เริ่มขึ้น"
 ep2_wedding.0100.desc_host:1 "มันช่างเป็นความรู้สึกที่น่าอัศจรรย์เสมอเมื่อท่านได้วางแผนบางสิ่งมาเป็นเวลานาน — และใช้จ่าย #EMP เงินทองไปมากมาย#! กับมัน — และในที่สุดมันก็ #EMP มาถึง#! แล้ว!!\n\nทุกอย่างพร้อมแล้ว: การตก แต่งเข้าที่เข้าทาง แขกเหรื่อกำลังพูดคุยสังสรรค์ และเหล่าคนรับใช้ก็วิ่งวุ่นอยู่กับจานอาหารที่เต็มเปี่ยม"
 ep2_wedding.0100.desc_host_outro:0 "คู่สมรส [spouse_1.GetTitledFirstName] และ [spouse_2.GetTitledFirstName] ต่างก็อยู่ที่นี่แล้ว ดูเปล่งปลั่งในอาภรณ์ที่ดีที่สุด\n\nเมื่อข้าให้สัญญาณ ทุกคนจะเข้าประจำที่ และพิธีการจะเริ่มขึ้น"
 ep2_wedding.0100.desc_host_spouse:0 "$ep2_wedding.0100.desc_host$ ข้ากำลังเดินไปมาด้วยความตื่นเต้นและประหม่าเมื่อคู่ครองในอนาคตของข้า [my_spouse.GetTitledFirstName] ปรากฏตัวขึ้น เปล่งปลั่งในอาภรณ์อันงดงามที่สุดของ [my_spouse.GetHerHis]\n\nเราพร้อมที่จะเริ่มแล้ว"
 ep2_wedding.0100.desc_spouse:1 "ในที่สุดวันนั้นก็มาถึง — วันวิวาห์ของข้ากับ [my_spouse.GetTitledFirstName]!\n\nข้าทั้งตื่นเต้นและหวาดหวั่นเกี่ยวกับตัววันงานและอนาคตที่จะตามมา แต่ข้าก็อดประทับใจกับงานอันยิ่งใหญ่ที่จัดโดยเจ้าภาพผู้มีเมตตาของเรา [host.GetTitledFirstName] ไม่ได้\n\nเมื่อข้าเห็น [host.GetHerHim] โบกไม้โบกมือมาทางข้า ข้าก็รู้แล้ว ถึงเวลาเริ่มพิธีแล้ว"
 ep2_wedding.0100.desc_guest:1 "ข้ามองไปรอบตัวด้วยความตื่นเต้น\n\nทุกที่ที่ข้าทอดสายตาไป มีแขกเหรื่อสังสรรค์กัน ดอกไม้ประดับอยู่ทุกพื้นผิว คนรับใช้ขวักไขว่พร้อมจานอาหารเต็มมือ และเจ้าภาพผู้ภาคภูมิใจยิ่ง [host.GetTitledFirstName] กำลังตรวจสอบรายละเอียดขั้นสุดท้าย คู่สมรสที่ประหม่า แต่ตื่นเต้น [spouse_1.GetTitledFirstName] และ [spouse_2.GetTitledFirstName] กำลังยืนเตรียมพร้อม\n\nพิธีการกำลังจะเริ่มขึ้นแล้ว!"
 ep2_wedding.0100.desc_root_pregnant:0 "อย่างไรก็ตาม ขณะที่ข้าเดินไปยังคู่ครองของข้า ข้าอดสังเกตไม่ได้ถึงสายตาตัดสินของแขกทุกคนที่จ้องตรงมายังท้องที่ตั้งครรภ์อย่างเห็นได้ชัดของข้า โอ้ เอาเถอะ..."
 ep2_wedding.0100.desc_spouse_pregnant:0 "อย่างไรก็ตาม เป็นที่ประจักษ์ชัดในทันทีว่าความสนใจของทุกคน — รวมถึงตัวข้าเอง — ต่างจับจ้องไปที่ท้องอันตั้งครรภ์อย่างไม่อาจปฏิเสธได้ของเจ้าสาว... นี่คงจะน่ากระอักกระอ่วนใจไม่น้อย"
 ep2_wedding.0100.a:0 "ข้ารอไม่ไหวแล้ว!"
 ep2_wedding.0101.desc:0 "แผนการทั้งหมดของข้ากำลังจะบังเกิดผล\n\nแต่ในตอนนี้ ให้พิธีการเริ่มขึ้นเถิด!"
 ep2_wedding.0150.t:0 "พิธีวิวาห์"
 ep2_wedding.0150.desc:1 "ในที่สุดพิธีการก็ดำเนินมาถึงจุดสำคัญที่สุด\n\nพิธีกรรมตามประเพณีได้เสร็จสิ้นลงแล้ว และสิ่งที่เหลืออยู่คือคำสาบานสุดท้าย การยินยอมอย่างเป็นทางการ ตราประทับแห่งการสมรส! ขณะที่ทั้ง [spouse_1.GetTitledFirstName] และ [spouse_2.GetTitledFirstName] กล่าวว่า "ข้าตกลง" ฝูงชนก็เริ่มโห่ร้องยินดี และเราทุกคนต่างเป็นสักขีพยานในการเริ่มต้นชีวิตร่วมกันของพวกเขา"
 ep2_wedding.0150.a:0 "น่าตื่นเต้น!"
 ep2_wedding.0151.desc_diplo:0 "เบื้องหลังพิธีกรรมและพิธีการทั้งหมด งานวิวาห์คือเหตุการณ์ทางการเมืองเป็นอันดับแรกและสำคัญที่สุด ขณะที่พิธีดำเนินมาถึงจุดสำคัญ ใจของข้าก็มุ่งเน้นไปที่สิ่งที่จะเกิดขึ้นต่อไปแล้ว พันธมิตรจะคงอยู่หรือไม่? คู่สมรสใหม่ของข้าจะเป็นความช่วยเหลือที่ถูกต้องในการจัดการดินแดนของข้าหรือไม่?\n\nและถึงกระนั้น ก็ยังมีอีกคำถามหนึ่งที่ข้าต้องตอบก่อนหน้านั้น เนื่องจากถึงเวลาที่ข้าต้องให้ความยินยอมอย่างชัดแจ้งต่อการสมรสแล้ว$ep2_wedding.0151.desc_end$"
 ep2_wedding.0151.desc_religious:0 "ทุกขั้นตอนของพิธีล้วนมีความสำคัญ ท้ายที่สุดแล้ว ความศักดิ์สิทธิ์ของพิธีกรรมใดๆ ย่อมขึ้นอยู่กับการปฏิบัติตามทุกส่วนอย่างถูกต้อง\n\nข้าได้ให้ความสนใจอย่างใกล้ชิดกับทุกท่วงท่า ทุกคำพูด ทุกย่างก้าว — ไม่ใช่ทุกวันที่จะได้ประกอบพิธี #EMP วิวาห์#! ของตนเอง ตอนนี้ ช่วงเวลาที่สำคัญที่สุดได้มาถึงแล้ว และข้าต้องให้ความยินยอมต่อการรวมเป็นหนึ่งนี้$ep2_wedding.0151.desc_end$"
 ep2_wedding.0151.desc_party:0 "เมื่อพิธีดำเนินมาถึงจุดสำคัญในที่สุด และทั้งตัวข้าและคู่สมรสถูกถามถึงความยินยอมอย่างเป็นทางการ ข้าแทบไม่ได้ให้ความสนใจเลย ด้วยความตื่นเต้นกับการเฉลิมฉลองที่ใกล้เข้ามา: กองอาหารเลิศรส เครื่องดื่มไม่อั้น และใบหน้าที่มีความสุขมากมายที่จะแบ่งปันร่วมกัน — ข้านึกภาพสิ่งที่ดีกว่านี้ไม่ออก! แต่ในตอนนี้ มาจัดการเรื่องพิธีรีตองให้เสร็จสิ้นกันก่อน$ep2_wedding.0151.desc_end$"
 ep2_wedding.0151.desc_seducer:0 "พิธีวิวาห์ทั้งหมดล้วนเหมือนกัน: เป็นการฝึกฝนการกองคำพูดและคำสัญญาที่ว่างเปล่าให้สูงที่สุด ราวกับว่าความสุขและความพึงพอใจจะหาได้จากคนเพียงคนเดียว!\n\nขณะที่พิธีดำเนินมาถึงจุดสูงสุดและข้าถูกถามถึงความยินยอมอย่างเป็นทางการต่อการรวมเป็นหนึ่งและคำสาบานของข้า ข้าก็หัวเราะเยาะ เพราะคำถามนั้นฟังดูทั้งประชดประชันและไร้จุดหมาย$ep2_wedding.0151.desc_end$"
 ep2_wedding.0151.desc_shy:0 "ทุกสิ่งทุกอย่างช่างท่วมท้นเหลือเกิน: การตก แต่ง แขกเหรื่อที่พูดคุยกัน พิธีกรรมและพรที่ตามมาทีละอย่าง และสายตาที่จับจ้องของ [spouse_2.Custom('GetBrideGroom')] ของข้าที่จ้องมองมาที่ข้า ตัดสินทุกการเคลื่อนไหวของข้า\n\nทั้งหมดผสมผสานกันเป็นความโกลาหลที่ก่อให้เกิดความประหม่า จนกระทั่งถึงเวลาที่จะแบ่งปันคำสัญญาอย่างเป็นทางการของเรา — ซึ่งมาถึงเร็วเกินไป$ep2_wedding.0151.desc_end$"
 ep2_wedding.0151.desc_arrogant:0 "วันเพิ่งจะเริ่มต้นและข้าก็เบื่อหน่ายกับการพูดพล่ามไม่หยุดหย่อนของพวกที่เรียกตนเองว่าผู้มีอำนาจทางศาสนา พวกประจบสอพลอ และคนรับใช้ที่สับสน ไม่น่าแปลกใจเลยที่ข้าเดือดดาลตลอดพิธีส่วนใหญ่\n\nเมื่อถึงเวลาที่เราต้องให้ความยินยอมอย่างเป็นทางการต่อการสมรส ความอดทนของข้าก็เหลือน้อยเต็มที และข้าพบว่าตนเองตวาดตอบด้วยความรำคาญ$ep2_wedding.0151.desc_end$"
 ep2_wedding.0151.desc_paranoid:0 "ข้าแทบจำอะไรไม่ได้เลยจากพิธีทั้งหมด มัว แต่ยุ่งอยู่กับการมองหาศัตรูในทุกเงาและจินตนาการถึงสถานการณ์ที่น่าสะพรึงกลัวสำหรับอนาคตในใจ\n\nตอนนี้ ถึงเวลาที่จะประทับตราอย่างเป็นทางการในการรวมเป็นหนึ่งของเราโดยการให้ความยินยอม และข้าอดสงสัยไม่ได้ว่าข้ากำลังรับมิตรหรือศัตรูคู่อาฆาตเข้ามาในบ้าน$ep2_wedding.0151.desc_end$"
 ep2_wedding.0151.desc_appearance:0 "พิธีส่วนใหญ่ได้ดำเนินไปแล้ว\n\nขณะที่ข้ายืนเผชิญหน้ากับ [spouse_2.Custom('GetBrideGroom')] ของข้าเพื่อแสดงความยินยอมอย่างเป็นทางการต่อการสมรส ข้าก็ตัวสั่นอีกครั้ง พยายามประเมินจากสีหน้าของ [spouse_2.GetHerHis] ว่าร่างกายที่แตกสลายนี้ ทำให้ [spouse_2.GetHerHim] รังเกียจและจะเป็นอุปสรรคต่อความสุขของเราหรือไม่ จากนั้นก็ถึงตาข้าที่จะพูด$ep2_wedding.0151.desc_end$"
 ep2_wedding.0151.desc:1 "พิธีดำเนินไปอย่างรวดเร็ว ข้าแทบจำขั้นตอน พิธีกรรม และพรทั้งหมดที่ข้าได้ผ่านมาไม่ได้ และตอนนี้ก็ถึงเวลาสำหรับคำสาบานของเรา การยินยอมอย่างเป็นทางการ ตราประทับที่แท้จริงของการสมรส$ep2_wedding.0151.desc_end$"
 ep2_wedding.0151.desc_end:0 "\n\nข้าต้องการใช้ชีวิตที่เหลืออยู่กับ [spouse_2.GetFirstName] หรือไม่?"
 ep2_wedding.0151.desc.murder:0 "ถึงเวลาสำหรับคำสาบานของเราแล้ว "จงรับคำสาบานของข้าว่าข้าจะไม่รับผู้ใดเป็นคู่ครองนอกจากท่าน" ข้าพึมพำ "ตลอดไป" ข้าปลอบโยน [spouse_2.GetHerHis] บีบมือของ [spouse_2.GetHerHis]\n\nโชคดีที่ชีวิตที่เหลืออยู่ร่วมกันของเราจะสั้น #EMP อย่างไม่น่าเชื่อ#!."
 ep2_wedding.0151.a:0 "ข้าตกลง"
 ep2_wedding.0151.b:0 "ข้าไม่ตกลง!"
 ep2_wedding.0151.b.tt:0 "จะมีผลที่ตามมา..."
 ep2_wedding.0152.t:0 "ยกเลิกงานวิวาห์"
 ep2_wedding.0152.desc:0 "การปฏิเสธของข้าได้รับการตอบรับด้วยเสียงสูดลมหายใจอย่างประหลาดใจจากฝูงชน และความเงียบงันที่เต็มไปด้วยความไม่แน่นอน\n\nข้าเห็นใบหน้าของ [spouse_2.GetFirstNamePossessive] ค่อยๆ เปลี่ยนจากความตกตะลึงเป็นความโกรธเคือง และข้าก็ได้ยินเสียงซุบซิบนินทาที่ดังระเบิดขึ้นข้างหลังข้า แต่ข้าไม่สนใจ ข้าไม่อาจยอมรับการ แต่งงานกับ [spouse_2.GetFirstNameNoTooltip] ได้!\n\nข้าจะยอมรับผลที่ตามมาทุกประการ"
 ep2_wedding.0152.a:0 "ไม่ก็คือไม่"
 ep2_wedding.0200.t:0 "งานเลี้ยงฉลองวิวาห์เริ่มขึ้น"
 ep2_wedding.0200.desc_host:0 "เมื่อพิธีรีตองทั้งหมดผ่านพ้นไป ก็ถึงเวลาเฉลิมฉลอง!\n\nข้าส่งสัญญาณให้คนรับใช้นำอาหารและเครื่องดื่มออกมา และนำทางแขกไปยังสถานที่จัดเลี้ยง\n\nให้งานเลี้ยงฉลองวิวาห์เริ่มขึ้น!"
 ep2_wedding.0200.desc:0 "ส่วนที่เป็นทางการของงานวิวาห์ — พิธีการ — ได้ผ่านพ้นไปแล้วในที่สุด\n\nทุกคนต่างยิ้มแย้มด้วยความคาดหวังถึงอาหารมื้อใหญ่ ความบันเทิงที่น่าตื่นเต้น และความสนุกสนานโดยทั่วไปที่เรากำลังจะได้รับ\n\nมาเริ่มทานกันเถอะ!"
 ep2_wedding.0200.desc_spouse_dislike:0 "พิธีการได้สิ้นสุดลงโดยไม่มีอุปสรรคใดๆ และตอนนี้ข้าก็ได้ แต่งงานกับ [my_spouse.GetFirstName] ที่น่ารังเกียจ\n\nขณะที่เราย้ายไปยังสถานที่จัดเลี้ยง ข้าเห็นแขกที่มีความสุขอยู่รอบตัวข้า กระตือรือร้นที่จะเข้าร่วมในงานรื่นเริง ข้าหวังว่าข้าจะสามารถแบ่งปันความสุขของพวกเขาได้ ข้านั่งลง ณ ที่ที่จัดไว้ให้และสวดภาวนาขอความเข้มแข็งต่อ [ROOT.Char.GetFaith.HighGodName]\n\nและบัดนี้ ให้ละครฉากนี้เริ่มขึ้น!"
 ep2_wedding.0200.desc_spouse_like:0 "เมื่อพิธีสิ้นสุดลงและเราทุกคนย้ายไปยังสถานที่จัดเลี้ยง ข้าแอบยิ้มให้ตัวเอง นึกภาพถึงความสุขที่จะมาจากชีวิต แต่งงานของข้ากับ [my_spouse.GetFirstName]\n\nไม่ใช่ทุกคนที่จะโชคดีได้ แต่งงานกับคนที่น่ารัก เช่นนี้!\n\nข้าขอให้ทุกคนมีส่วนร่วมในความสุขของข้า และมาเริ่มทานกันเถอะ!"
 ep2_wedding.0200.desc_spouse_party:0 "รู้สึกเหมือนเวลาผ่านไปชั่วนิรันดร์นับตั้งแต่พิธีเริ่มขึ้น แต่ตอนนี้ข้าเป็นอิสระแล้ว ข้าตั้งตารอคอยส่วนที่ #EMP น่าสนใจ#! ที่สุดของวัน: งานเลี้ยง!\n\n...แน่นอน ข้ายังได้ #EMP คู่ครอง#! มาจากเรื่องทั้งหมดนี้ด้วย แต่ข้าจะมีเวลาคิดเกี่ยวกับเรื่องนี้เมื่ออาหารได้ ทำให้ใบหน้าของข้ามีรอยยิ้มอย่างเหมาะสม\n\nสำหรับตอนนี้ มาฉลองกันเถอะ!"
 ep2_wedding.0200.desc_spouse_shy:0 "หากข้าคิดว่าพิธีการนั้นเครียดอยู่แล้ว ไม่มีสิ่งใดเตรียมข้าให้พร้อมสำหรับความกระวนกระวายใจที่ข้ารู้สึกทันทีหลังจากนั้นได้\n\nงานเลี้ยงรออยู่ พร้อมกับการถาโถมของผู้มาอวยพร เสียงดัง นักแสดง และความตระหนักที่ค่อยๆ ก่อตัวขึ้นว่าข้าได้ แต่งงานอย่างเป็นทางการแล้วและชีวิตของข้ากำลังจะเปลี่ยนแปลงไปอย่างมาก\n\nดังนั้น ด้วยมือที่สั่นเล็กน้อย ข้าจึงเอื้อมหยิบถ้วยของข้าและยกขึ้นเพื่อเฉลิมฉลอง ให้งานรื่นเริงเริ่มขึ้น"
 ep2_wedding.0200.desc_spouse_arrogant:0 "เมื่อพิธีรีตองที่น่าเบื่อทั้งหมดเสร็จสิ้นลง เราทุกคนก็ย้ายไปยังสถานที่จัดเลี้ยง\n\nข้ารู้สึกว่าความอดทนของข้าใกล้จะหมดลงแล้วเมื่อคนรับใช้เริ่มนำอาหารออกมาทีละจาน #EMP ช้าอย่างน่าทรมาน#! และ [my_spouse.GetFirstName] มองมาที่ข้าด้วยความเป็นห่วง\n\nก่อนที่ข้าจะมีเวลาเสียใจกับเรื่องทั้งหมดมากขึ้น ข้าคว้าถ้วยของข้าและอุทานว่า "มาเริ่มงานเลี้ยงนี้กันเถอะ!""
 ep2_wedding.0200.desc_spouse_fallback:0 "พิธีการที่เป็นทางการสิ้นสุดลงแล้ว และข้าก็ได้ แต่งงานกับ [my_spouse.GetFirstName] อย่างเป็นทางการแล้ว คงต้องใช้เวลาสักพักกว่าจะชินกับความคิดนี้ และข้าก็ได้ แต่สงสัยกับตัวเองไปเรื่อยเปื่อยว่าชีวิตของข้าจะเป็นอย่างไรต่อไป\n\nอย่างไรก็ตาม ความคิดคำนึงของข้าก็ถูกขัดจังหวะอย่างรวดเร็วเมื่อขบวนงาน แต่งงานทั้งหมดเริ่มเคลื่อนไปยังสถานที่จัดเลี้ยง\n\nยังมีเวลาที่จะไตร่ตรองถึงอนาคต สำหรับตอนนี้ มาฉลองกันเถอะ!"
 ep2_wedding.0200.a:0 "เพลิดเพลิน!"
 ep2_wedding.0300.t:0 "ค่ำคืนวันวิวาห์เริ่มขึ้น"
 ep2_wedding.0300.desc:0 "ข้าเห็นว่าแขกทุกคนพึงพอใจและค่อนข้างเหนื่อยล้า แต่วันแห่งการเฉลิมฉลองยังไม่จบสิ้น\n\nข้ารีบจัดขบวนแห่เพื่อนำคู่บ่าวสาวไปยังห้องนอนของพวกเขา ให้คู่บ่าวสาวได้เฉลิมฉลองกัน #EMP เป็นส่วนตัว#! สำหรับพวกเราที่เหลืออยู่ มาดื่มกันอีกแก้วเถอะ!"
 ep2_wedding.0300.desc_spouse:0 "งานเลี้ยงเริ่มซาลงแล้ว ทุกคนอิ่มหนำและเหนื่อยล้า แต่วันนี้ยังไม่จบสิ้นสำหรับ [other_spouse.GetFirstName] และข้า\n\nขบวนแขกนำเราไปยังห้องนอนของเรา เพราะความชอบธรรมของงานวิวาห์ขึ้นอยู่กับการได้ร่วมหอลงโรง!"
 ep2_wedding.0300.desc_guest:0 "รู้สึกเหมือนข้าได้กิน ดื่ม สังสรรค์ เต้นรำ และร้องเพลงมาหลายวันแล้ว\n\nในไม่ช้า การเฉลิมฉลองจะค่อยๆ ซาลง และคู่สมรสจะกลับไปยังห้องส่วนตัวเพื่อการร่วมหอลงโรง สำหรับพวกเราที่เหลืออยู่ มาดื่มกันอีกแก้ว และมาดื่มอวยพรให้คู่สมรสกันเถอะ!"
 ep2_wedding.0300.a:0 "ถึงเวลาแล้ว!"
 every_attending_relative_of_spouse_2:0 "ญาติทุกคนของ [spouse_2.GetUIName] ที่เข้าร่วมงาน"
 ep2_wedding.0900.t:0 "งานวิวาห์เป็นโมฆะ"
 ep2_wedding.0900.desc:0 "ข่าวการเสียชีวิตอย่างกะทันหันของ [dead_spouse.GetTitledFirstNamePossessive] กระทบงานเลี้ยงวิวาห์ราวกับเสียงฟ้าร้องในวันแดดจ้า\n\nเสียงเพลงเงียบลง ใบหน้าที่ยิ้มแย้มเปลี่ยนเป็นน้ำตา ดอกไม้บนพื้นกระจัดกระจายและถูกเหยียบย่ำโดยฝูงชนที่โศกเศร้า\n\nช่างเป็นโศกนาฏกรรมโดยแท้ที่วันแห่งความสุข เช่นนี้กลับกลายเป็นวันแห่งการไว้ทุกข์..."
 ep2_wedding.0900.a:0 "ช่างเป็นโศกนาฏกรรมโดยแท้..."
 ep2_wedding.9000.tt:0 "[previous_host.GetUIName|U] ได้รับเงินคืนสำหรับ [GetActivityType('activity_wedding').GetName] ที่ถูกยกเลิก เป็นจำนวน [gold_i][THIS.Var('gwedding_gold_recoup_value').GetValue|V0]"
 ep2_wedding.0910.desc:0 "ข่าวการเสียชีวิตอย่างกะทันหันของ [dead_spouse.GetTitledFirstNamePossessive] กระทบกระเทือนจิตใจข้าอย่างลึกซึ้ง ไม่คาดฝันและน่าเศร้าสลดอย่างยิ่งในวันวิวาห์ของเราเอง\n\nเรายังไม่ได้ แต่งงานกันแม้ แต่วันเดียว แต่ท่านก็ถูกพรากไปจากข้าเสียแล้ว..."
 ep2_wedding.0910.a:0 "ปล่อยข้าไว้ทุกข์ตามลำพังเถิด..."
 ep2_wedding.9015.tt:0 "[ROOT.Char.GetUIName|U] ได้รับเงินคืนสำหรับ [GetActivityType('activity_wedding').GetName] ที่ถูกยกเลิก เป็นจำนวน [gold_i][THIS.Var('gwedding_gold_recoup_value').GetValue|V0]"
 ep2_wedding.0915.desc:0 "[previous_host.Custom2('MyCharacterIntroduction', ROOT.Char)] กำลังเป็นเจ้าภาพจัด [GetActivityType('activity_wedding').GetName] ในขณะที่ [previous_host.GetHerHis] ถึงแก่กรรม เป็นกิจกรรมอันน่าเพลิดเพลินที่ข้าไม่ได้รับเชิญ\n\nบัดนี้เมื่อ [previous_host.GetSheHe] จากไปแล้ว งานเลี้ยงก็ตกอยู่ในความโกลาหลและทุกคนถูกส่งกลับบ้านด้วยความผิดหวัง"
 ep2_wedding.0915.a:0 "ข้าน่าจะได้ไปอยู่ที่นั่น"
 ep2_wedding.0920.desc:0 "ข้าตั้งตารอคอยงานวิวาห์ของข้ากับ [free_spouse.GetTitledFirstName] เป็นอย่างยิ่ง แต่ดูเหมือนว่า [ROOT.Char.GetFaith.HouseholdGodName] มีแผนอื่นสำหรับข้า — หรือสำหรับ [free_spouse.GetFirstNameNoTooltip]\n\nแม้ว่าการหมั้นหมายจะยังคงอยู่ แต่สัญญาของงานวิวาห์อันยิ่งใหญ่ก็ถือเป็นโมฆะแล้ว"
 ep2_wedding.0920.a:0 "นี่ช่างน่าเศร้าเหลือเกิน..."
 ep2_wedding.0921.desc:0 "ข่าวการถูกจองจำของ [prisoner_spouse.GetTitledFirstNamePossessive] หยุดการเฉลิมฉลองทั้งหมด ดูเหมือนว่า [ROOT.Char.GetFaith.HouseholdGodName] มีแผนอื่นสำหรับ [prisoner_spouse.GetHerHim]\n\nแม้ว่าการหมั้นหมายจะยังคงอยู่ แต่สัญญาของงานวิวาห์อันยิ่งใหญ่ก็ถือเป็นโมฆะแล้ว"
 ep2_wedding.0921.a:0 "น่าผิดหวังยิ่งนัก"
 ep2_wedding.0950.t:0 "บทสรุป"
 ep2_wedding.0950.desc:0 "เมื่อ — #EMP ในที่สุด#! — แขกคนสุดท้ายจากไป ข้ามองไปรอบๆ สถานที่จัดงานที่ร้างผู้คน เศษอาหาร เครื่องดื่ม [ROOT.Char.Custom('RegionalDrink')] ที่หกเรี่ยราดบนพื้น เสียงหัวเราะของผู้คนที่ยังคงก้องอยู่ในอากาศ และรู้สึกพึงพอใจ\n\nช่างเป็นวันที่น่าอัศจรรย์! ข้าทำงานได้อย่างยอดเยี่ยมในการจัดงานนี้"
 ep2_grand_wedding_host_incentives_effect.tt:0 "ตัวละครอื่น ๆ จะมีแนวโน้มที่จะยอมรับข้อเสนอการ แต่งงานของตัวละครนี้มากขึ้นในอีก 20 ปีข้างหน้า"
 ep2_wedding.0950.a:0 "ขอบคุณทุกท่านที่มา!"
 ep2_wedding.0960.desc:0 "ดวงอาทิตย์ขึ้นในวันใหม่ — วันแรกของชีวิตข้ากับ [other_spouse.GetFirstName]\n\nถึงเวลาที่จะทิ้งการเฉลิมฉลองและความสนุกสนานไว้เบื้องหลัง แม้ว่ามันจะน่าเพลิดเพลินเพียงใดก็ตาม และก้าวต่อไปสู่ชีวิตปกติใหม่ของเรา"
 ep2_wedding.0970.desc:0 "แขกทุกคนทยอยจากไปทีละคน และถึงเวลาที่ข้าต้องจากไป เช่นกัน\n\nงานวิวาห์เป็นโอกาสอันดีที่จะได้สังสรรค์กับเพื่อนฝูงและผ่อนคลาย และข้าก็ออกจากสถานที่ไปด้วยความเหนื่อยล้าและพึงพอใจ ส่งความปรารถนาดีไปยังคู่สมรสเพื่อการครองคู่อันรุ่งเรืองและมีความสุข"
 ep2_wedding.0970.a:0 "ขอแสดงความยินดีอีกครั้ง!"
 ep2_wedding.0997.desc_intro:0 "การรอคอย [missing_spouse.GetFirstName] นั้นยาวนานเกินไป และบัดนี้เป็นที่แน่ชัดแล้วว่า [missing_spouse.GetSheHe] ได้หายตัวไประหว่างทาง\n\nในไม่ช้า ผู้คนก็เริ่มพูดคุยกัน ข่าวลือจากเมืองที่ไม่ไกลจากที่นี่กล่าวว่า [missing_spouse.GetSheHe] ถูกพบเห็นครั้งสุดท้ายในตลาดที่ไม่น่าไว้วางใจกำลังซื้อสมุนไพร ในขณะที่คนอื่นๆ สาบานได้ว่าเห็น [missing_spouse.GetHerHim] ครั้งสุดท้ายกำลังขึ้นเรือไปยังดินแดนอันห่างไกล"
 ep2_wedding.0997.desc_spouse:0 "\n\nไม่ว่าในกรณีใด เป็นที่แน่ชัดว่า [missing_spouse.GetFirstNameNoTooltip] ได้หนีไป เพราะ [missing_spouse.GetSheHe] ยอมใช้ชีวิต [missing_spouse.GetHerHis] อย่างคนจรจัดดีกว่า แต่งงานกับข้า"
 ep2_wedding.0997.desc_generic:0 "\n\nไม่ว่าในกรณีใด เป็นที่แน่ชัดว่า [missing_spouse.GetFirstNameNoTooltip] ได้หนีไป เพราะ [missing_spouse.GetSheHe] ยอมใช้ชีวิต [missing_spouse.GetHerHis] อย่างคนจรจัดดีกว่า แต่งงานกับ [other_spouse.GetFirstName]"
 ep2_wedding.0998.desc:0 "มันเป็นวันที่น่าเศร้าเสมอเมื่อความหวังทั้งหมดที่มาพร้อมกับงานวิวาห์ใหม่ต้องสูญเปล่า และการทำงานหนักทั้งหมดที่ทุ่มเทให้กับการจัดงานอันยิ่งใหญ่ต้องสูญเปล่า\n\nน่าเสียดายที่งานวิวาห์นี้ไม่ได้ถูกกำหนดมาให้เป็นจริง\n\nขณะที่คนรับใช้เริ่มทำความสะอาด แขกก็ทยอยจากไปเป็นกลุ่มๆ ด้วยความสับสนและผิดหวังเพื่อกลับไปยังบ้านของตน"
 ep2_wedding.0998.a:0 "น่าเสียดาย"
 ep2_wedding.0999.t:0 "$ep2_wedding.0900.t$"
 ep2_wedding.0999.desc:0 "ข่าวล่าสุดขัดจังหวะการเฉลิมฉลองและ ทำให้ทุกคนประหลาดใจและสับสน\n\nเห็นได้ชัดว่าสถานะและทรัพย์สินของเจ้าภาพไม่อนุญาตให้งานวิวาห์ดำเนินต่อไปได้ และหากไม่มีเจ้าภาพที่เข้มแข็งคอยดูแล เราก็ทำได้เพียงเดินทางกลับบ้านด้วยความผิดหวัง"
