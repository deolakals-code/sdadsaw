 wedding_barred_bedding_log_title:0 "ขัดขวางพิธีส่งตัว"
 wedding_barred_bedding_log:0 "[CHARACTER.GetShortUIName] ล็อกประตูขัดขวางผู้ร่วมพิธีส่งตัวเข้าหอของ [CHARACTER.GetHerHis] และ [TARGET_CHARACTER.GetShortUINamePossessive]"
 wedding_barred_doors_modifier:0 "ขัดขวางพิธีส่งตัว"
 wedding_barred_doors_modifier_desc:0 "ตัวละครนี้ได้รับความสงบใจโดยการล็อกประตูขัดขวางผู้ร่วมพิธีส่งตัวในคืนวันวิวาห์ของตน"
 wedding_barred_bedding_doors_opinion:0 "ขัดขวางพิธีส่งตัวเข้าหอ"
 wedding_forced_bedding_ceremony_opinion:0 "บังคับเข้าร่วมพิธีส่งตัวเข้าหอ"
 wedding_caved_to_bedding_opinion:0 "ยอมจำนนต่อพิธีส่งตัวเข้าหอ"

 ep2_wedding.3300.t:0 "ส่งตัวเข้าหอ"
 ep2_wedding.3300.opening:0 "[my_spouse.GetFirstName] และข้าถูกนำไปยังห้องหอโดยขบวนแห่วิวาห์อันอึกทึก เสียงตะโกนและเสียงหัวเราะที่ดังก้องประกาศถึงพิธีส่งตัวเข้าหอ\n\n"
 ep2_wedding.3300.blessing:0 "[officiant.GetCouncilTitleFirstName] อวยพรเตียงสมรสของเรา"
 ep2_wedding.3300.decorate:0 "[officiant.GetCouncilTitleFirstName] ประดับเตียงของเราด้วยดอกไม้และมาลัย"
 ep2_wedding.3300.flowers:0 "ขบวนแห่วางเราลงบนเตียงที่ประดับด้วยมาลัยและดอกไม้"
 ep2_wedding.3300.wine:0 "ก่อนที่จะห่มผ้าให้เรา รินไวน์เครื่องเทศรสแรงใส่ถ้วย และสั่งให้เราดื่มมัน"
 ep2_wedding.3300.anointing:0 "ก่อนที่จะห่มผ้าให้เรา เจิมเราทั้งคู่ตามธรรมเนียมของ [officiant.GetFaith.GetAdjectiveNoTooltip]"
 ep2_wedding.3300.lover:0 "เราจ้องมองกันอย่างมีความสุขขณะที่ขบวนแห่เริ่มจากไป ในที่สุดก็ได้อยู่ตามลำพัง!\n\n"
 ep2_wedding.3300.friend:0 "เราจับมือกันขณะที่ขบวนแห่ทยอยออกไป ไม่มีการจับคู่ใดจะดีไปกว่านี้อีกแล้ว\n\n"
 ep2_wedding.3300.hatred:0 "[my_spouse.GetWifeHusband] คนใหม่ของข้าหันมา ทำหน้าบึ้งด้วยความรังเกียจขณะที่ขบวนแห่จากไป\n\n"
 ep2_wedding.3300.unfriendly:0 "[my_spouse.GetWifeHusband] คนใหม่ของข้าดูไม่ค่อยกระตือรือร้นนักขณะที่ขบวนแห่จากไป\n\n"
 ep2_wedding.3300.friendly:0 "เราหันมามองหน้ากัน ทั้งคู่ตึงเครียดด้วยความคาดหวัง และขบวนแห่ก็ทยอยออกไป\n\n"
 ep2_wedding.3300.polite:0 "ข้าหันไปหา [my_spouse.GetFirstNameNoTooltip] ขณะที่ขบวนแห่จากไป "เอาล่ะ... [my_spouse.GetWifeHusband]... !"\n\n"
 ep2_wedding.3300.jester_self:0 "ก่อนที่ประตูจะปิด ตัวตลกของข้า [jester.GetFirstName] ทำท่าทางลามก คำรามและเห่าเหมือนสุนัขล่าเนื้อ"
 ep2_wedding.3300.jester:0 "ก่อนที่ประตูจะปิด ตัวตลกของ [my_spouse.GetFirstNamePossessiveNoTooltip] [jester.GetFirstName] ทำท่าทางลามก คำรามและเห่าเหมือนสุนัขล่าเนื้อ"
 ep2_wedding.3300.other_friend_self:0 "ก่อนที่ประตูจะปิด [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('friend'))] ของข้า [friend.GetTitledFirstName] ยิ้ม "โชคดี!""
 ep2_wedding.3300.other_friend:0 "ก่อนที่ประตูจะปิด [my_spouse.Custom2('RelationToMeShort', SCOPE.sC('friend'))] ของ [my_spouse.GetFirstNamePossessiveNoTooltip] [friend.GetTitledFirstName] ยิ้ม "โชคดี!""
 ep2_wedding.3300.other_spouse_self:0 "ก่อนที่ประตูจะปิด [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('other_spouse'))] ของข้า [other_spouse.GetFirstName] ส่งสายตาเจ็บปวดครั้งสุดท้ายมาทางเรา"
 ep2_wedding.3300.other_spouse:0 "ก่อนที่ประตูจะปิด [my_spouse.Custom2('RelationToMeShort', SCOPE.sC('other_spouse'))] ของ [my_spouse.GetFirstNamePossessiveNoTooltip] [other_spouse.GetFirstName] ส่งสายตาเจ็บปวดครั้งสุดท้ายมาทางเรา"
 ep2_wedding.3300.family:0 "ก่อนที่ประตูจะปิด [my_spouse.Custom2('RelationToMeShort', SCOPE.sC('family'))] ของ [my_spouse.GetFirstNamePossessiveNoTooltip] [family.GetFirstName] ร้อง "#EMP เยี่ยมมาก [my_spouse.Custom('GirlBoy')]!#!""
 ep2_wedding.3300.family_self:1 "ก่อนที่ประตูจะปิด [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('family'))] ของข้า [family.GetFirstName] ร้อง "#EMP เยี่ยมมาก [ROOT.Char.Custom('GirlBoy')]!#!""
 ep2_wedding.3300.fallback:0 "ประตูปิดกระแทกตามหลังพยานคนสุดท้าย ขบวนแห่อันอึกทึกยังคงดำเนินต่อไปตามโถงทางเดิน แม้ว่าครอบครัวต่างๆ จะคอยเงี่ยหูฟังอย่างไม่ต้องสงสัย"
 ep2_wedding.3300.a:0 "มานี่สิ ข้ารอคอยสิ่งนี้มาทั้งคืนแล้ว!"
 ep2_wedding.3300.a.success:0 "[my_spouse.GetWifeHusband] ของท่านรู้สึกปลื้มใจ"
 ep2_wedding.3300.a.failure:0 "[my_spouse.GetFirstNameNoTooltip] รู้สึกรังเกียจ"
 ep2_wedding.3300.b:0 "โอ้ — #EMP *หาว*#! — ข้าชักจะง่วงนอนเสียแล้ว..."
 ep2_wedding.3300.b.success:0 "ท่านดูถูก [my_spouse.GetWifeHusband] ของท่าน"
 ep2_wedding.3300.b.failure:0 "[my_spouse.GetFirstNameNoTooltip] รู้สึกโล่งใจ"
 ep2_wedding.3300.c:0 "ข้าคิดว่าข้าคงต้องการไวน์เพิ่มอีกหน่อยสำหรับเรื่องนี้!"
 ep2_wedding.3300.c.success:0 "[my_spouse.GetWifeHusband] ของท่านเห็นด้วย"
 ep2_wedding.3300.c.failure:0 "[my_spouse.GetFirstNameNoTooltip] รู้สึกขุ่นเคือง"
 ep2_wedding.3300.d:0 "เพื่อราชวงศ์ของข้า ข้าจะทำสิ่งนี้..."
 ep2_wedding.3300.d.success:0 "ท่านทั้งคู่มีช่วงเวลาที่ดีแม้จะไม่เต็มใจก็ตาม"
 ep2_wedding.3300.d.failure:0 "ท่านและ [my_spouse.GetFirstNameNoTooltip] ทำไปตามหน้าที่"

 ep2_wedding.3400.t:0 "การพบปะของตระกูล"
 ep2_wedding.3400.opening:0 "เมื่อคู่บ่าวสาวปลีกตัวไปพักผ่อนในยามเย็นแล้ว คบเพลิงก็ถูกจุดขึ้น เหยือกถูกเติม และนักดนตรีก็รวมตัวกันเพื่อเฉลิมฉลองต่อไปจนดึกดื่น\n\n"
 ep2_wedding.3400.drink_self:0 "หลายชั่วโมงต่อมา ข้าพบว่าตนเองกำลังมองลงไปในถ้วยอย่างเลือนลางไปยัง [other_family_relative.GetTitledFirstName] [other_family_spouse.Custom2('RelationToMeShort', other_family_relative)] ของ [other_family_spouse.Custom('GetBrideGroom')]"
 ep2_wedding.3400.hashish_self:0 "หลายชั่วโมงต่อมา ข้าพบว่าตนเองกำลังมองผ่านควันอย่างเลือนลางไปยัง [other_family_relative.GetTitledFirstName] [other_family_spouse.Custom2('RelationToMeShort', other_family_relative)] ของ [other_family_spouse.Custom('GetBrideGroom')]"
 ep2_wedding.3400.fallback_self:0 "หลายชั่วโมงต่อมา ข้าพบว่าตนเองกำลังกระพริบตามองไปยัง [other_family_relative.GetTitledFirstName] [other_family_spouse.Custom2('RelationToMeShort', other_family_relative)] ของ [other_family_spouse.Custom('GetBrideGroom')]"
 ep2_wedding.3400.drink:0 "ผู้ ซึ่งเพิ่งเกือบสำลัก [host.Custom('RegionalAlcoholicDrink')] ของ [other_family_relative.GetHerHis] ด้วยความขบขัน\n\n"
 ep2_wedding.3400.hashish:0 "ผู้ ซึ่งเพิ่งไออย่างควบคุมไม่ได้ด้วยความขบขัน\n\n"
 ep2_wedding.3400.fallback:0 "ผู้ ซึ่งหาวด้วยความพึงพอใจ\n\n"
 ep2_wedding.3400.drink_family:0 "[other_family_relative.GetSheHe|U] พูดเสียงอ้อแอ้ "ข้ายอมรับ! [ROOT.Char.Custom2('RelationToMeShort', my_family_spouse)] ของท่านเป็นคู่ที่เ- #EMP *อึก*#! เหมาะสมอย่างยิ่งสำหรับ [other_family_relative.Custom2('RelationToMeShort', other_family_spouse)] ของข้า! ข- #EMP *อึก*#! ขอให้พวกเขามีความสุข!""
 ep2_wedding.3400.drink_house:0 "[other_family_relative.GetSheHe|U] พูดเสียงอ้อแอ้ "ท่- #EMP *อึก*#! ท่านรู้ไหม ข้าไม่แน่ใจเกี่ยวกับพวก [ROOT.Char.GetHouse.GetBaseNameNoTooltip] ของท่าน แต- #EMP *อึก*#! แต่ท่านก็ใช้ได้!""
 ep2_wedding.3400.family:0 "ในที่สุด [other_family_relative.GetSheHe] ก็กล่าวว่า "ข้ายอมรับ! [ROOT.Char.Custom2('RelationToMeShort', my_family_spouse)] ของท่านเป็นคู่ที่เหมาะสมอย่างยิ่งสำหรับ [other_family_relative.Custom2('RelationToMeShort', other_family_spouse)] ของข้า! ขอให้พวกเขามีความสุข!""
 ep2_wedding.3400.house:0 "ในที่สุด [other_family_relative.GetSheHe] ก็กล่าวว่า "ท่านรู้ไหม ข้าไม่แน่ใจเกี่ยวกับพวก [ROOT.Char.GetHouse.GetBaseNameNoTooltip] ของท่าน แต่ท่านก็ใช้ได้!""
 ep2_wedding.3400.a:0 "เรื่องนี้ ทำให้ข้านึกขึ้นได้ ข้าต้องการความเห็นของท่าน!"
 ep2_wedding.3400.tt:0 "บทสนทนาที่ลึกซึ้ง"
 ep2_wedding.3400.b:0 "โอ้! [ROOT.Char.Custom2('RelationToMeShort', my_family_suitor)] ของข้าคงจะชอบท่านมาก!"
 ep2_wedding.3400.b.tt:0 "เคมีเข้ากันทันที"
 ep2_wedding.3400.b.success:0 "พวกเขาเข้ากันได้ดี"
 ep2_wedding.3400.b.failure:0 "พวกเขาเพียงแค่สุภาพต่อกัน"
 ep2_wedding.3400.c.drink:0 "เบียร์อีก! อีก!"
 ep2_wedding.3400.c.hashish:0 "ฮาชิชอีก! อีก!"
 ep2_wedding.3400.d:0 "เราต้องติดต่อกันนะ ตอนนี้เราเป็นครอบครัวเดียวกันแล้ว!"
 ep2_wedding.3400.e:0 "บอกข้าที [other_family_relative.GetWomenMen] ของตระกูล [other_family_relative.GetHouse.GetBaseNameNoTooltip] ทุกคนงดงาม เช่นนี้หรือ?"
 ep2_wedding.3400.e.success:0 "[other_family_relative.GetFirstNameNoTooltip] ใจละลาย"
 ep2_wedding.3400.e.failure:0 "[other_family_relative.GetFirstNameNoTooltip] ถอยห่าง"

 ep2_wedding.3410.t:0 "คู่แข่งใหม่"
 ep2_wedding.3410.opening:0 "ประตูปิดกระแทกตามหลังคู่บ่าวสาว เสียงหัวเราะและเสียงกรีดร้องที่อู้อี้ดังก้องไปตามโถงทางเดิน ข้าทรุดตัวลงนั่งในห้องจัดเลี้ยง ไม่สามารถหยุดคิดถึง [jealousy_focus.GetFirstName] และ [jealousy_usurper.GetFirstName] ได้...\n\n"
 ep2_wedding.3410.double:0 "พวกเขาทั้งคู่เป็นที่รักของข้า แต่ข้ากลัวว่ารุ่งอรุณจะนำมา ซึ่งการเปลี่ยนแปลงในความรักที่พวกเขามีต่อข้า ซึ่งบัดนี้กำลังมัวเมาอยู่ในห้วงแห่งงานรื่นเริง"
 ep2_wedding.3410.lover:0 "[ROOT.Char.Custom2('RelationToMeShort', jealousy_focus)] ของข้าเพลิดเพลินกับการสัมผัสของผู้อื่น — ข้ารู้ว่า [jealousy_focus.GetSheHe] มีความรับผิดชอบ แต่ความจริงนั้นไม่ได้บรรเทาหนามที่ทิ่มแทงหัวใจข้าเลย"
 ep2_wedding.3410.primary:0 "ข้ารู้ว่าข้ายังคงเป็น [ROOT.Char.GetWifeHusband] คนแรกและมีลำดับสูงสุดของ [jealousy_focus.GetFirstNamePossessive] แต่กลัวว่ารสนิยมใหม่ของ [jealousy_focus.GetHerHis] ที่มีต่อ [jealousy_usurper.GetWomanMan] คนใหม่จะนำมา ซึ่งอะไร"
 ep2_wedding.3410.secondary:0 "[jealousy_usurper.GetWifeHusband] อีกคนสำหรับคอลเลกชันของ [jealousy_focus.GetFirstNamePossessive] คู่แข่งอีกคนสำหรับเวลาและความรักของ [jealousy_focus.GetHerHis]"
 ep2_wedding.3410.double_opinion:0 "\n\n"แล้วข้าล่ะ? สาปแช่งสามเส้าอันทรมานนี้เสีย..."
 ep2_wedding.3410.positive_opinion:0 "\n\n[jealousy_focus.GetSheHe|U] จะไม่ลืมข้า... ใช่ไหม...?"
 ep2_wedding.3410.negative_opinion:0 "\n\nโอ้ ข้าฯ จะสนอันใดกัน?! เหตุใดเจ้า [jealousy_focus.Custom2('InsultNoun', ROOT.Char)] นั่นจึงกวนใจข้านัก..."
 ep2_wedding.3410.indifferent_opinion:0 "\n\nข้าฯ ต้องพิทักษ์ตำแหน่งของตนไว้ ก่อนที่เจ้า [jealousy_usurper.Custom2('InsultNoun', ROOT.Char)] นี่จะชิงมันไป"
 ep2_wedding.3410.a:0 "ข้าจะให้พวกเขารู้ว่า #EMP ข้า#! รู้สึกอย่างไร!"
 ep2_wedding.3410.a.flavor:0 "ประตูเหล่านั้นหยุดข้าไม่ได้!"
 ep2_wedding.3410.b:0 "[jealousy_focus.GetFirstNameNoTooltip] เป็น #EMP ของข้า!#!"
 ep2_wedding.3410.b.tt:0 "แผนการจะได้รับ [GetModifier('wedding_consorts_envy_modifier').GetNameWithTooltip]"
 ep2_wedding.3410.c:0 "หัวใจข้าแตกสลาย..."
 ep2_wedding.3410.d:0 "ความสนใจที่น้อยลงจาก [jealousy_focus.GetFirstNameNoTooltip] อาจมีข้อดีของมัน"
 every_usurper_close_family_tt:0 "สมาชิกครอบครัวใกล้ชิดของ [jealousy_usurper.Custom('GetBrideGroom')]"
 revealed_lover_wedding_night_opinion:0 "ผู้ลอบมีชู้ลับ"
 wedding_consorts_envy_modifier:0 "ความอิจฉาของพระสนม/ชายา"
 ruined_wedding_night_opinion:0 "คืนวันวิวาห์ที่ถูกทำลาย"
 wedding_old_news_modifier:0 "ข่าวเก่า"
 wedding_old_news_modifier_desc:0 "ตัวละครนี้ยินดีกับความสัมพันธ์ใหม่ของคู่ครอง โดยแสวงหาการพักผ่อน"

 ep2_wedding.3420.t:0 "สู่รัตติกาล"
 ep2_wedding.3420.opening:0 "คู่บ่าวสาวได้จากไปแล้ว ถูกส่งตัวโดยครอบครัวไปยังห้องนอนเพื่อประกอบพิธีสมรส พวกเราที่เหลือกลับไปยังห้องจัดเลี้ยงเพื่อเฉลิมฉลองและสังสรรค์\n\n"
 ep2_wedding.3420.eat:0 "ข้าพบว่าศีรษะของข้าหันตรงไปยังโต๊ะอาหาร กลิ่นหอมหวานของอาหารที่เหลืออยู่แทบจะต้านทานไม่ได้\n\n"
 ep2_wedding.3420.drink:0 "แขกหลายคนเริ่มงานเลี้ยงช่วงต่อไปแล้ว กระตุ้นนักดนตรีและเริ่มเต้นรำรอบต่อไป\n\n"
 ep2_wedding.3420.lech:0 "ด้วยการพูดคุยทั้งหมดเกี่ยวกับคำสาบานและพิธีส่งตัวเข้าหอ จิตใจของข้าก็ล่องลอยไปถึงการกระทำอันมิบังควรที่คู่รักที่มีความสุขต้องกำลังทำอยู่ตอนนี้\n\n"
 ep2_wedding.3420.steal:0 "ช่างเป็น [host.Custom('FortifiedBuilding')] ที่หรูหราที่เราใช้เวลาช่วงเย็นอยู่ และข้าอดคิดไม่ได้ว่าสิ่งของใดบ้างที่เจ้าของจะไม่สังเกตเห็นว่าหายไป\n\n"
 ep2_wedding.3420.flee:0 "ถูกกักตัวอยู่ทั้งวัน รายล้อมไปด้วยคนแปลกหน้าขณะที่พิธีและงานเลี้ยงดำเนินไปอย่างไม่รู้จบ ข้ารู้สึกโล่งใจที่ตอนนี้มีอิสระแล้ว\n\n"
 ep2_wedding.3420.charity:0 "ตลอดทั้งวันข้ารู้สึกผิดต่อความฟุ่มเฟือยของการเฉลิมฉลอง ในขณะที่สามัญชนและคนรับใช้ที่ยากจนนอกกำแพงกำลังดิ้นรน\n\n"
 ep2_wedding.3420.social:0 "แม้ว่าจะได้พบปะผู้คนหน้าใหม่มากมายในวันนี้ ข้าก็กระตือรือร้นที่จะพบปะแขกเหรื่อมากขึ้นก่อนที่โอกาสทางสังคมนี้จะสิ้นสุดลงอย่างหลีกเลี่ยงไม่ได้\n\n"
 ep2_wedding.3420.posture:0 "เมื่อมองไปที่แขกเหรื่อต่างๆ ในชุดหรูหราและความโอ่อ่า ข้าก็รู้สึกอยากจะเดินไปรอบๆ ทำให้ทุกคนรับรู้ถึงการมีอยู่ของข้า\n\n"
 ep2_wedding.3420.blab:0 "รายล้อมไปด้วยผู้คนมากมาย ข้าพยายามอย่างดีที่สุดที่จะแบกรับภาระความรู้เกี่ยวกับความผิดของ [blab_guest.GetTitledFirstNamePossessive] โดยไม่ปล่อยให้หลุดออกไป แต่ข้าไม่รู้ว่าจะทนได้นานแค่ไหน!\n\n"
 ep2_wedding.3420.blab_self:0 "รายล้อมไปด้วยผู้คนมากมาย ข้าพยายามอย่างดีที่สุดที่จะแบกรับภาระความลับของข้าโดยไม่ปล่อยให้หลุดออกไป แต่ข้าไม่รู้ว่าจะทนได้นานแค่ไหน!\n\n"
 ep2_wedding.3420.scheme:0 "ข้าจ้องมองแขกเหรื่อที่เดินขวักไขว่ มึนเมาและท้องอืดจากการสังสรรค์มาทั้งวัน และสงสัยว่าลิ้นที่บิดเบี้ยวของพวกเขาได้ปล่อยข่าวลืออะไรออกมาบ้างในวันนี้\n\n"
 ep2_wedding.3420.help:0 "เมื่อมองออกไปที่ฝูงชน ข้าอาบไล้ความอบอุ่นของโอกาสอันเป็นมงคล ดึงพลังจากใบหน้าที่ยิ้มแย้มและความปรองดอง — แต่ร่างที่งองุ้มนี้คือใครกัน?\n\n"
 ep2_wedding.3420.pray:0 "เมื่อพิธีเสร็จสิ้นและกล่าวคำสาบานแล้ว ข้าก็เต็มไปด้วยความกังวลและความหวังต่อคู่รักที่มีความสุข การทดลองทั้งหมดของการเป็นหุ้นส่วนและการเป็นพ่อแม่ที่กำลังจะมาถึง\n\n"
 ep2_wedding.3420.closing:0 "ช่วงเวลาที่เหลือของยามเย็นเป็นของข้าที่จะใช้ตามที่ข้าต้องการ..."
 ep2_wedding.3420.a:0 "หวังว่าจะมี [ROOT.Char.Custom('RegionalEdibleMeat')] เหลืออยู่บ้างนะ!"
 ep2_wedding.3420.b:0 "ในที่สุด ข้าก็สามารถปลดปล่อย #EMP อย่างแท้จริง#! ได้แล้ว!"
 ep2_wedding.3420.c:0 "เอาล่ะ แล้วคนรับใช้ที่คล่องแคล่วคนนั้นไปไหนแล้ว?"
 ep2_wedding.3420.d:0 "ไม่มีเวลาไหนเหมาะไปกว่านี้แล้วที่จะรื้อค้นห้องต่างๆ..."
 ep2_wedding.3420.e:0 "ในที่สุด ข้าก็สามารถออกจากสถานที่บ้าๆ นี้ได้เสียที!"
 ep2_wedding.3420.f:0 "คืนนี้ ข้าต้องดูแลคนยากจนใน [ROOT.Char.GetCurrentLocation.GetTitle.GetNameNoTierNoTooltip]"
 ep2_wedding.3420.g:0 "ข้าตั้งใจจะคุยกับ [social_guest.GetFirstNameNoTooltip] มาตลอด"
 ep2_wedding.3420.h:0 "การปรากฏตัวของข้าในวันนี้ต้องไม่ถูกบดบัง"
 ep2_wedding.3420.i:0 "ความลับนี้กำลังฆ่าข้า ใครสักคนต้องรู้!"
 ep2_wedding.3420.j:0 "มาดูกันว่าคืนนี้คนรับใช้ได้ยินอะไรมาบ้าง..."
 ep2_wedding.3420.j.tt:0 "ท่านจะได้เรียนรู้ [secret|E] ของใครบางคน"
 ep2_wedding.3420.k.drink:0 "ดูเหมือนว่า [help_guest.GetFirstNameNoTooltip] จะดื่มมากเกินไป..."
 ep2_wedding.3420.k.health:0 "ดูเหมือนว่า [help_guest.GetFirstNameNoTooltip] ที่น่าสงสารคงต้องการความช่วยเหลือ..."
