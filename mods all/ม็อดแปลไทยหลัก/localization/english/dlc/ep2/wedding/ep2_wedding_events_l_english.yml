 wedding_goblet_fool_log:0 "[CHARACTER.GetUIName|U] และ [TARGET_CHARACTER.GetUIName] ทำให้ตนเองกลายเป็นตัวตลก เนื่องจากเมาและก่อความวุ่นวาย"
 ep2_wedding.1111.desc:0 "แขก #EMP ส่วนใหญ่#! แต่ไม่ใช่ข้า!\n\n"เอาถ้วยมาอีก! และอีก!" ข้าตะโกนใส่คนรับใช้คนใดก็ตามที่ข้าเห็น"
 ep2_wedding.1111.desc_host:0 "อย่างไรเสีย ข้าก็จ่ายค่าทุกอย่างไปแล้ว ข้าไม่สมควรได้รับมันหรือ?"
 ep2_wedding.1111.desc_conclusion:0 "\n\nอย่างไรก็ตาม จากโต๊ะของ [1111_other.GetHerHis] ข้ารู้สึกได้ถึงสายตาตัดสินของ [1111_other.GetTitledFirstNamePossessive] ที่จับจ้องมาที่ข้า "วันนี้ท่านยังดื่มไม่พออีกหรือ?" [1111_other.GetSheHe|U] สอบถามอย่างเย็นชา"
 ep2_wedding.1111.a:0 "ขออภัย ข้าจะลดเสียงลง..."
