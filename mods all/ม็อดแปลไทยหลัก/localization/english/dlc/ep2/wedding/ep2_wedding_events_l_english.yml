 ep2_wedding.3500.t:0 "ข้อสงสัยเกี่ยวกับราชวงศ์"
 ep2_wedding.3500.intro:0 "เหน็ดเหนื่อยจากการรอคอยและเข้าสังคมมาทั้งวัน [ROOT.Char.Custom2('RelationToMeShort', my_family_relative_1)] ของข้า [ROOT.Char.Custom2('RelationToMeShort', my_family_relative_2)] และข้าจึงหาที่นั่งที่โต๊ะเพื่อครุ่นคิดเกี่ยวกับการรวมกันนี้"
 ep2_wedding.3500.intro_plural:0 "เหน็ดเหนื่อยจากการรอคอยและเข้าสังคมมาทั้งวัน [ROOT.Char.Custom2('GetFamilyRelationPlural', my_family_relative_1)] ของข้าและข้าจึงหาที่นั่งที่โต๊ะเพื่อครุ่นคิดเกี่ยวกับการรวมกันนี้"
 ep2_wedding.3500.intro_connector:0 "\n\n[my_family_relative_1.GetFirstName] พูดเบาๆ "ท่านรู้ไหม,"
 ep2_wedding.3500.relation_shared:0 "ข้าเป็นห่วง [my_family_relative_1.Custom2('RelationToMeShort', my_family_spouse)] ของเรา — จริงๆ นะ"
 ep2_wedding.3500.relation:0 "ข้าต้องบอกว่าข้ายังคงมีข้อกังขา ข้าเป็นห่วง [my_family_relative_2.Custom2('RelationToMeShort', my_family_spouse)] ของข้า"
 ep2_wedding.3500.young:0 "[other_family_spouse.GetFirstName] ยัง #EMP เด็กเกินไป#! สำหรับ [my_family_spouse.GetHerHim] มันจะจบลงด้วยน้ำตา""
 ep2_wedding.3500.old:0 "[other_family_spouse.GetFirstName] แก่เกินไป ไม่มีทางที่ [other_family_spouse.GetSheHe] จะ ทำให้ [my_family_spouse.GetHerHim] มีความสุขได้ นี่คือความจริง"
 ep2_wedding.3500.bold:0 "[other_family_spouse.GetFirstName] หัวแข็ง ในขณะที่ [my_family_spouse.GetSheHe] อ่อนน้อม [other_family_spouse.GetSheHe] จะควบคุม [my_family_spouse.GetHerHim] ไว้ใต้อำนาจของ [other_family_spouse.GetHerHis]""
 ep2_wedding.3500.shy:0 "[other_family_spouse.GetFirstName] อ่อนน้อมเหมือนลูกแกะ [other_family_spouse.GetWomanMan] เช่นนั้นจะเสนออะไรให้ [my_family_spouse.GetWomanMan] อย่าง [my_family_spouse.GetHerHim] ได้?""
 ep2_wedding.3500.dishonorable:0 "[other_family_spouse.GetWomanMan] ผู้นี้ไร้เกียรติ ข้าเฝ้าดู [other_family_spouse.GetHerHim] มาทั้งวัน [other_family_spouse.GetSheHe] จะนำมา ซึ่งความทุกข์ยากแก่ [my_family_spouse.GetFirstName] เท่านั้น""
 ep2_wedding.3500.dislike:0 "[other_family_spouse.GetWomanMan] [other_family_spouse.Custom2('InsultAdjective', SCOPE.sC('my_family_relative_1'))] ผู้นี้ บัดนี้กลายเป็นรอยด่างพร้อยต่อชื่อเสียงวงศ์ตระกูลเรา เจ้า [other_family_spouse.Custom2('InsultNoun', SCOPE.sC('my_family_relative_1'))] นั่นจะไม่สร้างคุณประโยชน์อันใดให้ [my_family_spouse.GetFirstName] เลย!""
 ep2_wedding.3500.health:0 "[other_family_spouse.GetSheHe|U] เป็นภาระที่ป่วยไข้ ไม่สามารถสนับสนุน [my_family_spouse.GetFirstName] ในการทดลองและความสนใจของ [my_family_spouse.GetHerHis] ได้ มันไม่รอบคอบ""
 ep2_wedding.3500.realms:0 "พันธะนี้เปิดประตูให้เล่ห์กลของ [other_family_spouse.GetHouse.GetHeadOfHouse.GetPrimaryTitle.GetAdjectiveNoTooltip] ทำลาย [my_family_spouse.GetHouse.GetHeadOfHouse.GetPrimaryTitle.GetNameNoTooltip] และตระกูล [other_family_spouse.GetHouse.GetBaseNameNoTooltip] จากภายใน""
 ep2_wedding.3500.lowborn:0 "[other_family_spouse.GetWomanMan] สามัญชน เช่น [other_family_spouse.GetHerHim] ต่ำต้อยเกินศักดิ์ศรีของตระกูลนี้ [other_family_spouse.GetSheHe] นำความเสื่อมเสียมาสู่ [my_family_spouse.GetFirstName]""
 ep2_wedding.3500.beauty:0 "ท่านเห็นรูปลักษณ์ของ [other_family_spouse.GetHerHim] หรือไม่? ข้าสั่นสะท้านเมื่อคิดว่า [my_family_spouse.GetFirstName] จะทำหน้าที่ของ [my_family_spouse.GetHerHis] ได้อย่างไร หรือโฉมหน้าของลูกหลานของพวกเขา...""
 ep2_wedding.3500.renown:0 "เจ้า [other_family_spouse.Custom2('InsultNoun', SCOPE.sC('my_family_relative_1'))] แห่งตระกูล [other_family_spouse.GetHouse.GetBaseNameNoTooltip] อันบ้านนอกนี่ มันต่ำต้อยเกินกว่าเกียรติยศของตระกูลอันยิ่งใหญ่ เช่น [my_family_spouse.GetHouse.GetBaseNameNoTooltip] [other_family_spouse.GetSheHe] ทำให้ [my_family_spouse.GetFirstName] มัวหมองเพียงแค่ไปข้องแวะด้วย...""
 ep2_wedding.3500.criminal:0 "[other_family_spouse.GetSheHe|U] คือปิศาจร้าย นั่นคือสิ่งที่ทุกคนพูดถึงตลอดทั้งเย็น! เราปล่อยให้ตนเองไปผูกพันกับเจ้า [other_family_spouse.Custom2('InsultNoun', SCOPE.sC('my_family_relative_1'))] นี่ได้อย่างไรกัน?! ข้าฯ หวังว่า [my_family_spouse.GetFirstName] ผู้น่าสงสารจะผ่านพ้นมันไปได้...""
 ep2_wedding.3500.fornicator:0 "[other_family_spouse.GetWomanMan] ผู้นี้เป็นที่รู้จักกันดีว่าเป็นคนเสเพล ถูก ทำให้มัวหมองโดยคนรักนับไม่ถ้วน เราจะยอมให้ความเสียหายนี้เกิดขึ้นกับชื่อเสียงของ [my_family_spouse.GetFirstNamePossessive] ได้อย่างไร?! คิดถึงการใส่ร้าย ข่าวลือ เรื่องตลกสิ!""
 ep2_wedding.3500.fallback:0 "มีบางอย่างเกี่ยวกับ [other_family_spouse.GetHerHim] [other_family_spouse.GetSheHe|U] มีสายตาที่ไม่น่าดู... ท่านต้องสังเกตเห็นมันแน่? ข้าหวังว่า [my_family_spouse.GetFirstName] จะสังเกตเห็น..."
 ep2_wedding.3500.faith:0 "จะเชื่อใจ [my_family_relative_1.Custom2('GetUnbelieverTerm', other_family_spouse)] อย่าง [other_family_spouse.GetHerHim] ได้อย่างไร [other_family_spouse.GetSheHe] จะบิดเบือน [my_family_spouse.GetFirstName] ให้ห่างจาก [my_family_relative_1.GetFaith.HighGodName]""
 ep2_wedding.3500.agree:0 "\n\n"ข้าคิดว่าท่านพูดถูก [my_family_relative_2.Custom2('RelationToMeShort', my_family_relative_1)]," [my_family_relative_2.GetFirstName] ถอนหายใจ "นี่ดูเหมือนจะเป็นการจับคู่ที่หายนะ""
 ep2_wedding.3500.alliance:0 "\n\n"แน่นอนท่านเห็นแล้ว [my_family_relative_2.Custom2('RelationToMeShort', my_family_relative_1)]," [my_family_relative_2.GetFirstName] ตำหนิ "พันธมิตรกับตระกูล [other_family_spouse.GetHouse.GetBaseNameNoTooltip] ต้องมาก่อนความสุขของ [my_family_spouse.GetHerHis]""
 ep2_wedding.3500.compromise:0 "\n\n"ระงับความสงสัยของท่านเสีย [my_family_relative_2.Custom2('RelationToMeShort', my_family_relative_1)]," [my_family_relative_2.GetFirstName] ปฏิเสธ "การประนีประนอมเป็นสิ่งจำเป็นในการเมือง""
 ep2_wedding.3500.time:0 "\n\n"มาเถอะ [my_family_relative_2.Custom2('RelationToMeShort', my_family_relative_1)]," [my_family_relative_2.GetFirstName] ถอนหายใจ "ให้เวลามันหน่อย! ให้เวลาพวกเขาสักเดือนก่อนที่ท่านจะตัดสิน เช่นนั้น""
 ep2_wedding.3500.a:0 "ข้าเกรงว่าท่านจะใกล้เคียงความจริง [ROOT.Char.Custom2('RelationToMeShort', my_family_relative_1)]..."
 ep2_wedding.3500.b:0 "เชื่อข้าเถอะ มันเป็นการจับคู่ที่ดี"
 ep2_wedding.3500.d:0 "แล้วจะเป็นไรไป? ปล่อยให้ความรักเป็นเรื่องของกวีเถอะ"
 ep2_wedding.3500.e:0 "บัดนี้มันอยู่ในพระหัตถ์ของ [ROOT.Char.GetFaith.HighGodNamePossessive] แล้ว"
 
 #Ceremony Events
 ep2_wedding.4000.t:0 "ใครคือรายต่อไป?"
 ep2_wedding.4000.desc.intro:0 "ขณะที่คู่บ่าวสาวกล่าวคำสาบาน ข้ามองไปที่ [matchmaked_scope.GetTitledFirstName] ซึ่งกำลังปรบมืออย่างร่าเริง ข้าพยายามหาคู่หมั้นให้ [matchmaked_scope.GetHerHim] มาตลอด และช่วงเวลานี้ดูเหมือนจะเป็นโอกาสอันดีที่จะเตือน [matchmaked_scope.GetHerHim] ถึงความสุขของการ แต่งงาน\n\n"พวกเขาน่ารักไหม?," ข้าถามอย่างใสซื่อ พลางมองหาผู้ที่เหมาะสมในฝูงชน"
 ep2_wedding.4000.desc.good_match:0 "ข้าเคยเห็น [matchmaked_scope.GetFirstNameNoTooltip] พูดคุยกับ [objective_scope.GetTitledFirstName] มาก่อน และพวกเขาดูเป็นคู่ที่น่ารัก..."
 ep2_wedding.4000.desc.no_match:0 "\n\nข้ารู้ว่า [matchmaked_scope.GetSheHe] เคยพูดคุยกับ [objective_scope.GetTitledFirstName] มาก่อน แม้ว่า [matchmaked_scope.GetSheHe] จะไม่ได้กระตือรือร้นกับเรื่องนั้นมากนักก็ตาม"
 ep2_wedding.4000.a:0 ""ทำไมเจ้าไม่ทำตามอย่างพวกเขาด้วย [objective_scope.GetShortUINameNoTooltip] ล่ะ?""
 ep2_wedding.4000.a.success:1 "[matchmaked_scope.GetFirstNameNoTooltip] ทำตามคำแนะนำของท่าน"
 ep2_wedding.4000.a.failure:1 "[matchmaked_scope.GetFirstNameNoTooltip] ปฏิเสธที่จะฟัง"
 ep2_wedding.4000.b:0 ""[objective_scope.GetShortUINameNoTooltip] ดูเหงามาก...""
 ep2_wedding.4000.b.success:1 "[matchmaked_scope.GetFirstNameNoTooltip] พูดคุยกับ [objective_scope.GetFirstNameNoTooltip]"
 ep2_wedding.4000.c:0 "ข้าไม่คิดว่าพวกเขาจะเข้ากันได้ดี"
 ep2_wedding_4000_log_success_title:0 "การจับคู่ที่ได้รับแรงบันดาลใจ"
 ep2_wedding_4000_log_success:1 "[CHARACTER.GetFirstNameNoTooltip] พบการจับคู่ที่เหมาะสมสำหรับ [TARGET_CHARACTER.GetFirstNameNoTooltip]"
 
 ep2_wedding.2010.t:0 "แขกในตำนาน"
 ep2_wedding.2010.desc.intro:0 "ขณะที่งานเลี้ยงดำเนินไป ข้าพบว่ามันค่อนข้าง... ไม่น่าประทับใจนัก ไม่มีผ้าไหมหรือพรมแขวนผนังที่น่าประทับใจ ทองคำที่ดีที่สุดไม่มีที่นี่ — อัญมณีที่ยิ่งใหญ่ที่สุดก็ เช่นกัน ขณะที่ข้ามองออกไปนอกหน้าต่าง ข้าพบว่าท้องฟ้ายามค่ำคืนนั้นช่างเป็นแรงบันดาลใจ\n\nข้างนอกนั่นมีสัตว์ป่าสีขาวอยู่ พวกมันท่องไปอย่างอิสระในป่าของเราและซ่อนตัวอยู่ท่ามกลางต้นไม้ การล่าพวกมัน — การกระทำในตำนาน\n\nบางทีข้าอาจจะ... แค่ทาสี [ROOT.Char.Custom('GetAnimalType')] ของเราตัวหนึ่งให้เป็นสีขาว?"
 ep2_wedding.2010.desc_spouse:0 "\n\nข้าจะให้เกียรติงานวิวาห์ของข้าเองได้อย่างไรอีก?"
 ep2_wedding.2010.a:0 "ข้าต้องรีบ บอกคนรับใช้ของข้าให้เริ่มทันที"
 ep2_wedding.2010.a.tt:0 "สิ่งนี้จะช่วยให้ท่าน #EMP ได้รับชื่อเสียง#! แต่แขกที่เฉียบแหลมอาจรู้สึกสงสัย..."
 ep2_wedding.2010.b:0 "ความเสี่ยงมันใหญ่เกินไป"
 ep2_wedding.2010.impressed_list:0 "แขกผู้เข้าร่วมทุกคนที่เป็นคนชอบเข้าสังคม, นักสังสรรค์, คนขี้เมา, ผู้กล้าหาญ, นักล่า หรือผู้กล้าหาญ"
 wbanquet_white_animal_opinion:0 "แขกในตำนาน"
 wbanquet_white_animal_opinion_desc:0 "ตัวละครนี้ประทับใจกับสัตว์สีขาวที่ปรากฏตัวในงานเลี้ยงฉลองวิวาห์"
 
 ep2_wedding.2011.t:0 "$ep2_wedding.2010.t$: สร้างความสงสัย"
 ep2_wedding.2011.desc:0 "ขณะที่ [ROOT.Char.Custom('GetAnimalType')] เข้ามาในห้องโถง ขนสีซีดของมันส่องประกายเจิดจ้าภายใต้แสงจันทร์ เป็นไข้เรืองแสงเกือบฟอสฟอรัส เป็นประกายที่ไม่เป็นธรรมชาติ การหลอกลวงนั้นเกือบจะสมบูรณ์แบบ - สิ่งมหัศจรรย์ แขกยืนตะลึงและเข้าใกล้สัตว์อย่างรวดเร็ว ไม่กล้าแตะต้องมัน เพราะธรรมชาติของมันศักดิ์สิทธิ์\n\nอย่างไรก็ตาม ข้าเห็น [doubting_guest.GetTitledFirstName] ท่ามกลางฝูงชน กลอกตาของ [doubting_guest.GetHerHis]: "ท่านบอกไม่ได้หรือว่ามันเป็นแค่สี? [ROOT.Char.GetTitledFirstNameNoTooltip] ต้องคิดว่าพวกเราทุกคนเป็นคนโง่แน่ๆ""
 ep2_wedding.2011.a:0 "อา ไม่มีประโยชน์ที่จะรักษาภาพลวงตาไว้อีกต่อไป"
 ep2_wedding.2011.b:0 ""ท่านกล้าสงสัยข้าในวันเลี้ยงฉลองของข้าได้อย่างไร?""
 ep2_wedding.2011.b.success:1 "[doubting_guest.GetFirstNameNoTooltip] เชื่อท่านอย่างไม่เต็มใจ"
 ep2_wedding.2011.b.failure:1 "[doubting_guest.GetFirstNameNoTooltip] ไม่เชื่อแม้ แต่คำเดียว"
 
 ep2_wedding.2020.t:0 "ไม่ค่อยดีนัก"
 ep2_wedding.2020.desc:0 "จานอาหารเลิศรสถูกเวียนไปรอบโต๊ะ พร้อมด้วย [host.Custom('GetExpensiveMeal')] และ [host.Custom('GetExpensiveDessert')] ที่เติมเต็มห้องด้วยกลิ่นหอมอร่อย\n\n[host.GetTitledFirstName] ทุ่มเทกับการเตรียมงานอย่างแท้จริง และบ่อน้ำในลานบ้านก็เอ่อล้นไปด้วย [host.Custom('GetExpensiveDrink')] แล้ว ซึ่งตักขึ้นมาด้วยถังเงินพร้อมโซ่เงิน\n\nขณะที่ข้าเข้าใกล้มันด้วยความสงสัย ข้าเห็น [drunk_guest.GetTitledFirstName] กำลังสะดุดล้มอย่างอันตรายใกล้กับบ่อน้ำ ถ้วยอยู่ในมือ"
 ep2_wedding.2020.a:0 ""ท่านจะเจ็บตัวนะ... มาทางนี้สิ สหาย""
 ep2_wedding.2020.a.success:1 "ท่านโน้มน้าวให้ [drunk_guest.GetFirstNameNoTooltip] เดินออกไปได้"
 ep2_wedding.2020.a.failure:1 "[drunk_guest.GetFirstNameNoTooltip] ตกลงไปในบ่อน้ำ"
 ep2_wedding.2020.b:0 "ข้าจะอยู่ที่นี่เงียบๆ และเฝ้าดู"
 ep2_wedding.2020.b.success:1 "[drunk_guest.GetFirstNameNoTooltip] ไม่ตกลงไป"
 ep2_wedding.2020.c:0 ""ไปเลย!""
 ep2_wedding.2020.c.success:1 "ท่านผลัก [drunk_guest.GetFirstNameNoTooltip] ลงบ่อน้ำได้สำเร็จ"
 ep2_wedding.2020.c.failure:1 "[drunk_guest.GetFirstNameNoTooltip] ต้านทานการผลักของท่าน"
 ep2_wedding.2020.c.death:1 "[drunk_guest.GetFirstNameNoTooltip] เสียชีวิตจากการตก"
 
 ep2_wedding.wedding_intent.success.tt:0 "เจตนา [THIS.Char.GetInvolvedActivityIntent.GetName] ของท่านสำเร็จผล"
 
 ep2_wedding.2000.t:0 "เพื่อนของเพื่อน"
 ep2_wedding.2000.desc.intro:1 "หลังจากสังเกตการณ์ [diplo_target.GetTitledFirstName] จากระยะไกล ข้าก็สรุปได้อย่างรวดเร็วว่าข้าไม่สามารถแค่เดินเข้าไปหา [diplo_target.GetHerHim] แล้วเริ่มพูดคุยเกี่ยวกับสภาพอากาศ หรือสนธิสัญญาทางการแพทย์ล่าสุด หรือสงคราม แล้วภาวนาให้สิ่งนั้นกลายเป็นพันธมิตรได้\n\nในไม่ช้าข้าก็เห็น [target_friend.Custom2('MyCharacterIntroduction', ROOT.Char)] ทั่วห้อง ซึ่งเป็นที่รู้จักกันว่าเป็น [SCOPE.sC('diplo_target').Custom2('RelationToMeShort', SCOPE.sC('target_friend'))] ของ [diplo_target.GetFirstNamePossessiveNoTooltip] กำลังดื่ม [ROOT.Char.Custom('RegionalAlcoholicDrink')] อย่างมีความสุข\n\n"บอกข้าที ความสนใจของ [diplo_target.GetFirstNamePossessiveNoTooltip] อยู่ที่ใด?" ข้าถามอย่างตั้งใจ\n\n"
 ep2_wedding.2000.desc.lustful:0 ""ฮ่า! ใต้เอวของใครบางคน ข้าบอกท่านได้เลย!""
 ep2_wedding.2000.desc.nerd:0 ""แค่... แค่พูดคุยเกี่ยวกับหนังสือและว่าท่านเกลียดการออกไปข้างนอกมากแค่ไหน""
 ep2_wedding.2000.desc.valiant:0 ""อา [diplo_target.GetWomenMen] ผู้กล้าหาญที่สุด เชี่ยวชาญในสงครามและศิลปะของมัน""
 ep2_wedding.2000.desc.social:0 ""ที่นี่ เห็นได้ชัด! ช่วงเวลาแห่งการเฉลิมฉลอง อาหารเลิศรส เครื่องดื่มชั้นดี และมิตรสหายที่ยอดเยี่ยมที่สุด""
 ep2_wedding.2000.desc.fishy:0 ""[diplo_target.GetSheHe|U] เติบโตในราชสำนัก! ด้วยความเอาใจใส่อย่างยิ่ง [diplo_target.GetSheHe] ได้ศึกษาศิลปะแห่งเงา""
 ep2_wedding.2000.a:0 "ยอดเยี่ยม! ใช้ข้อมูลเชิงลึกนี้ทันที!"
 ep2_wedding.2000.a.tt:1 "ท่านเข้าหา [diplo_target.GetFirstNameNoTooltip]"
 ep2_wedding.2000.b:0 "ข้าจะรู้ได้อย่างไรว่าข้าสามารถเชื่อใจ [target_friend.GetHerHim] ได้?"
 ep2_wedding.2000.b.success.tt:1 "สิ่งนี้จะให้โบนัสแก่ [schemes|E] [GetScheme('befriend').GetTypeName] ที่มุ่งเป้าไปที่ [diplo_target.GetFirstNameNoTooltip]"
 ep2_wedding.2000.b.success:1 "[target_friend.GetFirstNameNoTooltip] ดูเหมือนจะพูดความจริง"
 ep2_wedding.2000.b.failure:1 "[target_friend.GetFirstNameNoTooltip] รู้สึกขุ่นเคืองกับความไม่ไว้วางใจของท่าน"
 
 ep2_wedding.2001.t:0 "$ep2_wedding.2000.t$"
 ep2_wedding.2001.desc:0 "ด้วยความรู้ที่เพิ่งได้รับมา ข้าเข้าหา [diplo_target.GetTitledFirstName] อย่างมีศิลปะ ผู้ ซึ่งกำลังเพลิดเพลินกับงานเลี้ยงและมิตรสหายคนอื่นๆ ที่โต๊ะอื่น ซึ่งปูด้วยผ้าที่หรูหรา "ขอคุยด้วยสักครู่ได้ไหม [diplo_target.GetTitleAsNameNoTooltip]?" ข้าถาม "ข้าไม่อยากรบกวนการสนทนาของท่าน"\n\n[diplo_target.GetTitledFirstNameNoTooltip] เลิกคิ้วของ [diplo_target.GetHerHis] ขึ้น มีแววสงสัยในดวงตาของ [diplo_target.GetHerHis] "แน่นอน มีเรื่องอันใดนำท่านมาหาข้า ขุนนาง [ROOT.Char.GetFirstNameNoTooltip]?""
 ep2_wedding.2001.a:0 ""ท่านอยากแอบออกไปหา... แขกดีๆ สักคนไหม?""
 ep2_wedding.2001.b:0 ""Nihil est miserum nisi cum putes ดังที่นักปราชญ์กล่าวไว้""
 ep2_wedding.2001.b.flavor:0 "#EMP ไม่มีสิ่งใดน่าสังเวช เว้นแต่ท่านจะคิดว่ามันเป็นเช่นนั้น#!."
 ep2_wedding.2001.b.dull:0 ""เอ่อ... ท่านได้ยินเกี่ยวกับ... สนธิสัญญาบ้างไหม?""
 ep2_wedding.2001.c:1 ""ท่านได้ยินเกี่ยวกับแคมเปญของบารอนหรือไม่? ช่างเป็นการปิดล้อมที่ยอดเยี่ยมอะไร เช่นนั้น!""
 ep2_wedding.2001.d:0 ""ได้โปรด ดื่มและกินกับข้า และขอให้งานเลี้ยงนี้คงอยู่ไปหลายวัน!""
 ep2_wedding.2001.e:0 ""#EMP ชู่ว์#! ท่านได้ยินข่าวลือเกี่ยวกับแผนการในราชสำนักหรือไม่?""
 ep2_wedding.2000.after.alliance:0 "[diplo_target.GetShortUINameNoTooltip] ถือว่าท่านเป็นพันธมิตรที่ทรงพลัง"
 ep2_wedding.2000.after.alliance.tt:1 "ท่านเข้าสู่พันธมิตรกับ [diplo_target.GetFirstNameNoTooltip]"
 ep2_wedding.2000.after.subjugate:0 "[diplo_target.GetShortUINameNoTooltip] ต้องการให้ท่านเป็นเจ้าเหนือหัวของ [diplo_target.GgetHerHis]"
 ep2_wedding.2000.after.subjugate.tt:1 "[diplo_target.GetFirstNameNoTooltip] สาบานความภักดีต่อท่าน"
 ep2_wedding.2000.after.friends:0 "[diplo_target.GetShortUINameNoTooltip] ถือว่าท่านเป็นจิตวิญญาณที่ต้องกัน"
 ep2_wedding.2000.after.insult:0 "[diplo_target.GetShortUINameNoTooltip] รู้สึกขุ่นเคืองที่ท่านคิดว่า [diplo_target.GetSheHe] จะสนใจเรื่องนั้น"
 ep2_wedding.2000.after.insult.short:1 "[diplo_target.GetFirstNameNoTooltip] รู้สึกขุ่นเคือง"
 
 ep2_wedding.1330.t:0 "คนรักของข้า [spouse.GetWifeHusband] ของข้า"
 ep2_wedding.1330.desc:0 "แขกในงานวิวาห์กี่คนที่สงสัยว่า [spouse.GetTitledFirstName] เป็นคนรักของข้าอยู่แล้ว? หลังประตูที่ปิดสนิท ไม่จำเป็นที่เราจะต้องเสแสร้งอีกต่อไป สัมผัสที่คุ้นเคยของ [spouse.GetHerHis|U] ความรู้เกี่ยวกับร่างกายของ [spouse.GetHerHis]... บัดนี้สิ่งเหล่านี้เป็นของข้าที่จะเก็บรักษาไว้\n\nขณะที่ข้าจ้องมองคนรักและ [spouse.GetWifeHusband] ของข้า ความคิดหนึ่งผุดขึ้นในใจ..."
 ep2_wedding.1330.a:0 "ข้ารัก [spouse.GetWomanMan] ผู้นี้เกินกว่าคำพูดใดๆ"
 ep2_wedding.1330.b:0 "ข้าจะไม่ต้องการใครอื่นนอกจาก [spouse.GetHerHim]"
 ep2_wedding.1330.c:0 "ข้าจะปรับปรุงตัวและซื่อสัตย์!"
 ep2_wedding.1330.c.rakish.success:0 "ท่านพยายามอย่างแท้จริงที่จะเปลี่ยนแปลง"
 ep2_wedding.1330.c.rakish.failure:0 "คำพูดของท่านเป็นเพียงคำสัญญาที่ว่างเปล่า"
 ep2_wedding.1330.c.breakup:1 "[ROOT.Char.GetFirstNameNoTooltip] ทิ้งข้าไปเพื่อความรักที่มีต่อ [spouse.GetWifeHusband] ของ [ROOT.Char.GetHerHis]"
 ep2_wedding.1330.d:0 "ข้าสงสัยว่า [spouse.GetSheHe] จะชอบ... สิ่งนั้นหรือไม่?"
 ep2_wedding.1330.d.yuck:1 "[spouse.GetFirstNameNoTooltip|U] รู้สึกรังเกียจในความเสื่อมทรามของข้า"
 ep2_wedding.1330.d.yuck.tt:0 "$ep2_wedding.1330.d.yuck$"
 ep2_wedding.1330.d.yum:1 "[spouse.GetFirstNameNoTooltip|U] รู้สึกทึ่งในรสนิยมที่ชอบผจญภัยของข้า"
 ep2_wedding.1330.d.yum.tt:0 "$ep2_wedding.1330.d.yum$"
 ep2_wedding.1330.d.yeahmetoo:1 "[spouse.GetFirstNameNoTooltip|U] เผยรสนิยมที่ชอบผจญภัยของ [spouse.GetHerHis] เอง"
 ep2_wedding.1330.d.yeahmetoo.tt:0 "$ep2_wedding.1330.d.yeahmetoo$"
 ep2_wedding.1330.d.confession.tt:1 "[spouse.GetFirstNameNoTooltip|U] จะบอกท่านว่า [spouse.GetSheHe] มีรสนิยมเหมือนท่านหรือไม่"
 ep2_wedding.1330.e:1 "ข้าทำสิ่งนี้กับ [soulmate.GetFirstNameNoTooltip] ได้อย่างไร?"
 ep2_wedding.1330.f:0 "ข้าเป็นรักเดียวของ [spouse.GetHerHis] จริงๆ หรือ?"
 ep2_wedding.1330.f.mindatease:0 "คำพูดปลอบโยนของ [spouse.GetShortUINamePossessive|U] ทำให้ใจข้าสงบลง"
 ep2_wedding.1330.f.mindatease.tt:1 "[spouse.GetFirstNameNoTooltip|U] ทำให้ใจท่านสงบลง"
 ep2_wedding.1330.f.lingeringdoubts:1 "[spouse.GetFirstNameNoTooltip|U] อ้างว่ารักเพียงข้า แต่ความสงสัยยังคงรบกวนข้า"
 ep2_wedding.1330.f.lingeringdoubts.tt:0 "ความสงสัยยังคงรบกวนท่านต่อไป"
 ep2_wedding.1330.f.confession:1 "[spouse.GetFirstNameNoTooltip|U] สารภาพรักอื่นๆ ของ [spouse.GetHerHis]"
 ep2_wedding.1330.f.confession.desc:0 "ความจริงปรากฏ"
 ep2_wedding.1330.f.confession.tt:1 "[spouse.GetFirstNameNoTooltip|U] เผยว่า [spouse.GetSheHe] มีคนรักอื่นหรือไม่"
 ep2_wedding.1330.g:0 "ในที่สุด เราก็ไม่จำเป็นต้องซ่อนความรักของเราอีกต่อไป!"

 ep2_wedding.1340.t:0 "ขอแสดงความเสียใจกับการ แต่งงานของท่าน"
 ep2_wedding.1340.desc.intro:0 ""ข้าสงสารท่าน [cynic.Custom2('RelationToMe', SCOPE.sC('nervous_spouse'))|U]..." [cynic.GetTitledFirstName] บอกข้าว่าชีวิต แต่งงานเป็นอย่างไร: "
 ep2_wedding.1340.i_would_know:0 ""ข้าย่อมรู้ดี" [cynic.GetSheHe] บ่นพึมพำ"
 ep2_wedding.1340.like_me_and:0 ""เหมือนข้ากับ [disliked_spouse.GetFirstName]" [cynic.GetSheHe] บ่นพึมพำ"
 ep2_wedding.1340.cheating:0 "สามีทรยศภรรยา ภรรยาทรยศสามี ขบวนแห่ของคำโกหกและความอัปยศอดสู"
 ep2_wedding.1340.desc.dislikes_spouse:0 "เต็มไปด้วยการทะเลาะวิวาท ความไม่ไว้วางใจ และความขัดแย้ง จุดจบของความสงบสุขใดๆ $ep2_wedding.1340.like_me_and$"
 ep2_wedding.1340.desc.dislikes_spouse_lustful:0 "เตียงที่เย็นชาและ [intended.GetWifeHusband] ที่ไม่ไว้วางใจ โซ่ตรวนแห่งความสุขของท่าน $ep2_wedding.1340.like_me_and$"
 ep2_wedding.1340.desc.divorced:2 "การเดินขบวนที่เชื่องช้าและเจ็บปวดไปสู่ช่วงเวลาที่ท่านค้นพบว่าใครในพวกท่านจะทอดทิ้งอีกฝ่าย "เหมือนข้ากับ [divorced_spouse.GetFirstName]" [cynic.GetSheHe] บ่นพึมพำ"
 ep2_wedding.1340.desc.cheated_on:0 "$ep2_wedding.1340.cheating$ $ep2_wedding.1340.i_would_know$"
 ep2_wedding.1340.desc.cheated_on_alt:2 "$ep2_wedding.1340.cheating$ "เหมือนข้ากับ [adulterous_spouse.GetFirstName]" [cynic.GetSheHe] บ่นพึมพำ"
 ep2_wedding.1340.desc.outro:0 "\n\nนั่นคือสิ่งที่การ แต่งงานของข้ากับ [intended.GetTitledFirstName] จะเป็น เช่นนั้นหรือ?"
 ep2_wedding.1340.a:0 "[intended.GetFirstNameNoTooltip|U] เหมาะสมกับข้าอย่างสมบูรณ์แบบ"
 ep2_wedding.1340.a.tt:0 "เราเหมาะสมกันหรือไม่?"
 ep2_wedding.1340.a.success:0 "ท่านมั่นใจว่า [intended.GetFirstNameNoTooltip] จะเหมาะสมกับท่าน"
 ep2_wedding.1340.a.failure:0 "ท่านกลัวว่า [intended.GetFirstNameNoTooltip] จะไม่เหมาะสมกับท่าน"
 ep2_wedding.1340.b:0 "ไม่ต้องห่วงข้า ข้าจะมีงานอดิเรกของข้า!"
 ep2_wedding.1340.b.tt:0 "พวกเขาจะ ทำให้ข้ามีความสุขได้จริงหรือ?"
 ep2_wedding.1340.b.success:0 "ท่านมั่นใจว่าวิถีชีวิตของท่านจะยังคงเหมือนเดิม"
 ep2_wedding.1340.b.failure:0 "ท่านกลัวว่าการ แต่งงานจะเปลี่ยนวิถีชีวิตของท่าน"
 ep2_wedding.1340.c:0 "ไม่ต้องห่วงข้า ข้าจะมี... #EMP งานอดิเรก#! ของข้า"
 ep2_wedding.1340.c.tt:0 "ข้าจะสามารถเก็บความลับจาก [intended.GetHerHim] ได้หรือไม่?"
 ep2_wedding.1340.c.success:0 "ท่านมั่นใจว่าความลับของท่านปลอดภัย"
 ep2_wedding.1340.c.failure:0 "ท่านกลัวว่า [intended.GetFirstNameNoTooltip] จะล้วงความลับของท่าน"
 ep2_wedding.1340.d:0 "#EMP ได้โปรด#! ข้ารู้ทุกอย่างเกี่ยวกับการ แต่งงาน!"
 ep2_wedding.1340.d.tt.never:0 "อย่างไรเสีย ข้า... เอ่อ..."
 ep2_wedding.1340.d.tt.once:0 "อย่างไรเสีย ข้าเคย แต่งงานมาก่อน..."
 ep2_wedding.1340.d.tt.more:0 "อย่างไรเสีย ข้าเคย แต่งงานมา... กี่ครั้งแล้วนะ?"
 ep2_wedding.1340.d.success:0 "ท่านมั่นใจว่าการ แต่งงานครั้งนี้จะเป็นเรื่องที่คุ้นเคย"
 ep2_wedding.1340.d.failure:0 "ท่านกลัวว่าการ แต่งงานครั้งนี้จะนำมา ซึ่งความท้าทายที่ท่านไม่เคยคาดคิด"
 ep2_wedding.1340.e:0 "ไปให้พ้นหน้าข้า เจ้าคนขี้ขลาดตาขาว"
 ep2_wedding.1340.f:0 "...มันจะเลวร้ายขนาดนั้นจริงๆ หรือ?"
 ep2_wedding.1340.f.tt:0 "ความประหม่าในงาน แต่งงานจะคงอยู่จนถึงสิ้นสุดงาน แต่งงานเท่านั้น"
 ep2_wedding.1340.success_title:0 "[ROOT.Char.Custom('GetBrideGroom')|U] ที่มั่นใจ"
 ep2_wedding.1340.failure_title:0 "ความประหม่าในงาน แต่งงาน"

 ep2_wedding.1350.t:0 "หมดคำพูด"
 ep2_wedding.1350.desc.intro:0 "ศีรษะของข้าปวดตุบๆ ด้วยเสียงเฟอร์นิเจอร์กระทบกันและเสียงแขกคุยกันจอแจ ความเครียดคงแสดงออกมา เพราะ [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('caring_relative'))] ของข้า [caring_relative.GetTitledFirstName] จับแขนข้าและพาไปยังห้องถัดไป\n\nเสียงของการเตรียมงานเงียบหายไป เราพูดคุยเรื่องเล็กๆ น้อยๆ: เวลาที่ผ่านไป ผู้คนที่เรารู้จัก ไม่มีการเอ่ยถึงงาน แต่งงานแม้ แต่คำเดียว จากนั้นเราก็หมดคำพูด และตกอยู่ในความเงียบ"
 ep2_wedding.1350.a:0 "เพลิดเพลินกับช่วงเวลาที่เงียบสงบด้วยกัน"
 ep2_wedding.1350.b:1 "บอก [caring_relative.GetShortUINameNoTooltip] ว่าการมีพวกเขาอยู่ที่นี่มีความหมายเพียงใด"
 ep2_wedding.0153.desc:0 "A great gasp erupts from the crowd, for [spouse_1.GetFirstName] refuses to be wed! [spouse_2.GetFirstName] seems as shocked as the rest of us. A frenzy of gossiping rises up, and infighting breaks out as [spouse_1.GetFirstNameNoTooltip] hastens from this accursed place."
 ep2_wedding.0153.a:0 "What a mess..."
