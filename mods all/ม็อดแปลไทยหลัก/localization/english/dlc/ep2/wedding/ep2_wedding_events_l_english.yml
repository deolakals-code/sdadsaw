 ep2_wedding.3030.b.tt:0 "สิ่งนี้จะให้โบนัสแก่ [schemes|E] [GetScheme('seduce').GetTypeName] ต่อ [my_spouse.GetShortUIName]"
 ep2_wedding.3030.c:0 ""อันที่จริง... ข้าก็มีบางอย่างให้ท่าน เช่นกัน""
 ep2_wedding.3030.d:0 ""#EMP ฮ่า!#! ท่านไม่มีทางหลอกข้าด้วยกลอุบายแบบนั้นได้หรอก!""
 love_memento_desc:0 "[love_memento.GetDesc]\n\n[my_spouse.GetShortUIName|U] มอบสิ่งประดิษฐ์นี้ให้ [ROOT.Char.GetFirstName] ในคืนวันวิวาห์ของพวกเขาเพื่อเป็นเครื่องหมายแห่งความรัก"
 lock_of_hair:0 "ปอยผม"
 lock_of_hair.desc:0 "ปอยผมผูกด้วยริบบิ้นผ้าไหม สีเดียวกับ [my_spouse.GetShortUIName] ไม่ผิดเพี้ยน"
 house_ribbon:0 "ริบบิ้นปักลายตระกูล"
 house_ribbon.desc:0 "ริบบิ้นที่ปักอย่างประณีต แสดงคำขวัญประจำตระกูลของ [itsa_me_scope.GetTitledFirstNamePossessive]"
 initials_necklace:0 "สร้อยคออักษรย่อ"
 initials_necklace.desc:0 "ตัวอักษรทองสัมฤทธิ์ประดับด้วยคริสตัลแก้วสีดำในก้ามปูสีทอง แสดงอักษรย่อของ [itsa_me_scope.GetTitledFirstName]"
 marriage_prayer_brooch:0 "เข็มกลัดคำอธิษฐานสมรส"
 marriage_prayer_brooch.desc:1 "เข็มกลัดแบนรูปวงแหวน สลักคำอธิษฐานสมรส เคลือบลงยา"
 wooden_phallus:0 "องคชาตไม้"
