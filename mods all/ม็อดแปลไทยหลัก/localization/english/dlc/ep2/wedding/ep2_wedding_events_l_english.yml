 ep2_wedding.3030.artifact_tt:0 "ท่านจะกลายเป็นเจ้าของ [love_memento.GetName]"

 ep2_wedding.3040.t:0 "ค่ำคืนอันเร่าร้อน"
 ep2_wedding.3040.desc:0 "อา ผิวของ [my_spouse.GetTitledFirstName] ช่างนุ่มนวล กลิ่นผมของ [my_spouse.GetHerHis] ช่างหอมหวาน! แน่นอนว่า คืนวันวิวาห์ของข้าดำเนินไปตามที่ข้าคาดหวังไว้ทุกประการ และเราก็อุทิศตนให้กับบาปทางเนื้อหนังอย่างรวดเร็ว\n\nด้วยความเร่าร้อนของเรานั้น โดยไม่ทันระวังเทียนที่ส่องสว่างห้องอย่างริบหรี่ ข้าเผลอเตะเทียนเล่มหนึ่งล้มลงโดยไม่ได้ตั้งใจ: "อย่าหยุดนะ ที่รัก!"\n\nแต่ [ROOT.Char.GetFaith.HighGodName] มีแผนการอื่นสำหรับเรา และที่นอนฟางก็ลุกเป็นไฟอย่างรวดเร็ว"
 ep2_wedding.3040.a:0 "ข้าต้องช่วย [my_spouse.GetFirstNameNoTooltip]!"
 ep2_wedding.3040.a.success:1 "ท่านช่วย [my_spouse.GetFirstNameNoTooltip] จากเปลวเพลิงได้!"
 ep2_wedding.3040.a.failure:1 "ท่านได้รับบาดเจ็บขณะพยายามช่วย [my_spouse.GetFirstNameNoTooltip]"
 ep2_wedding.3040.b:0 "ข้าต้องช่วย #EMP ตัวเอง#!!"
 ep2_wedding.3040.b.success:1 "[my_spouse.GetFirstNameNoTooltip] ช่วย [my_spouse.GetHerselfHimself] จากเปลวเพลิงได้"
 ep2_wedding.3040.b.failure:1 "[my_spouse.GetFirstNameNoTooltip] ได้รับบาดเจ็บจากไฟ"
 ep2_wedding.3040.c:0 "นี่คือโอกาสของข้าที่จะได้เฉิดฉาย!"
 ep2_wedding.3040.c.success:1 "ท่านแสดงความแข็งแกร่งโดยการช่วย [my_spouse.GetFirstNameNoTooltip]"
 ep2_wedding.3040.d:0 "นี่คงเป็นโอกาสอันดีที่จะกำจัด [my_spouse.GetShortUINameNoTooltip]..."
 ep2_wedding.3040.d.flavor:0 "สู่กองไฟไปเสียเถิด ที่รัก #EMP [my_spouse.GetWifeHusband]#!!"
 ep2_wedding.3040.d.success:1 "[my_spouse.GetFirstNameNoTooltip] รอดชีวิตจากความพยายามฆาตกรรมของท่าน"
 ep2_wedding.3040.d.failure:1 "[my_spouse.GetFirstNameNoTooltip] เสียชีวิต"
 
 ep2_wedding.3050.t:0 "สิ่งที่แขวนอยู่เบื้องบน"
 ep2_wedding.3050.desc:0 "ยามเย็นผ่านพ้นไปนานแล้ว และแขกเหรื่อเริ่มทยอยกลับหลังจากคู่บ่าวสาวแยกย้ายไปทำเรื่อง... ส่วนตัวมากขึ้น ข้าสอดส่องหา [intent_victim.GetTitledFirstName] ทั่วห้อง และพยายามที่จะไม่ออกจากห้องจนกว่า #EMP [intent_victim.GetSheHe]#! จะออกไป\n\nอัศวินต่างแดนคนหนึ่งออกไปสวดมนต์ และเหลือเพียงเราสองคน\n\n"เอาล่ะ ถึงเวลาที่ข้าต้องไปแล้ว เช่นกัน" [intent_victim.GetFirstNameNoTooltip] กล่าวพลางลุกขึ้นจากเก้าอี้ของ [intent_victim.GetHerHis]\n\nโคมไฟสีเงินแขวนอยู่เหนือศีรษะของ [intent_victim.GetHerHis] ราวกับลิ้นแห่งไฟ"
 ep2_wedding.3050.a:0 "บัดนี้ ถึงเวลาแล้ว!"
 ep2_wedding.3050.a.success:1 "ท่านสังหาร [intent_victim.GetFirstNameNoTooltip]"
 ep2_wedding.3050.a.failure:1 "[intent_victim.GetFirstNameNoTooltip] รอดชีวิต"
 ep2_wedding.3050.b:0 "เชือกโคมไฟนั่นดูอ่อนแออย่างยิ่งในคืนนี้..."
 ep2_wedding.3050.b.success:1 "โคมไฟสังหาร [intent_victim.GetFirstNameNoTooltip]"
 ep2_wedding.3050.b.failure:1 "[intent_victim.GetFirstNameNoTooltip] สงสัยในเหตุการณ์ที่เกิดขึ้น"
 ep2_wedding.3050.c:0 "ถ้าข้าตาม [intent_victim.GetHerHim] ไป ข้าจะรู้ว่า [intent_victim.GetSheHe] นอนที่ไหน..."
 ep2_wedding.3050.c.tt:0 ""ท่านได้รับโบนัสอย่างมีนัยสำคัญต่อ [schemes|E] [GetScheme('murder').GetTypeName] ที่มุ่งเป้าไปที่ตัวละครนี้""

 ep2_wedding.3200.t:0 "พันธะตามพิธี"
 ep2_wedding.3200.both:0 "เมื่อถึงจุดสุดยอดของงานเลี้ยง [my_spouse.GetFirstName] และข้าสบตากันอย่างขวัญเสีย เผยความรู้สึกร่วมกันเกี่ยวกับพิธีส่งตัวเข้าหอที่ใกล้เข้ามา...\n\nขณะที่ขบวนแห่พาเราไปยังห้องหอ ข้าเสนออย่างมีความหวัง "[ROOT.Char.Custom('WifeHusband')|U] เราไม่ #EMP จำเป็น#! ต้องทำสิ่งนี้ก็ได้นะ?" เหนือเสียงโห่ร้องและเสียงกลอง"
 ep2_wedding.3200.self:0 "เมื่อถึงจุดสุดยอดของงานเลี้ยง ข้าก็ยิ่งวิตกกังวลมากขึ้นเรื่อยๆ ในการรอคอยพิธีส่งตัวเข้าหอ และเห็นได้ชัดว่า [my_spouse.GetFirstName] ไม่ได้มีความกังวล เช่นเดียวกับข้าเลย\n\n[my_spouse.GetSheHe|U] หันมาหาข้าขณะที่ขบวนแห่พาเราไปยังห้องหอ หัวเราะ "เจ้าดูเหมือนผีเลย [ROOT.Char.Custom('WifeHusband')]! ผ่อนคลายสิ!" เหนือเสียงโห่ร้องและเสียงกลอง"
 ep2_wedding.3200.other:0 "เมื่อถึงจุดสุดยอดของงานเลี้ยง ความวิตกกังวลที่เพิ่มขึ้นของ [shy_spouse.GetFirstNamePossessive] เกี่ยวกับพิธีส่งตัวเข้าหอที่ใกล้เข้ามานั้นชัดเจน\n\n[shy_spouse.Custom('WifeHusband')] คนใหม่ของข้าหันมาหาข้าขณะที่ขบวนแห่เคลื่อนไปยังห้องหอของเรา อ้อนวอน "ได้โปรด เราไม่ต้องทำสิ่งนี้ได้ไหม...?" เหนือเสียงโห่ร้องและเสียงกลอง"
 ep2_wedding.3200.closing:0 "\n\nประตูใกล้เข้ามาอย่างรวดเร็ว เสียงโห่ร้องของงานเลี้ยงดังถึงขีดสุด พิธีกำลังจะเริ่มขึ้น"
 ep2_wedding.3200.a:0 "ให้ห้องนี้เป็นของเราเถอะ!"
 ep2_wedding.3200.a.flavor:0 "เร็วเข้า ปิดประตู!"
 ep2_wedding.3200.b:0 "ข้าคิดว่ามันเป็นสิ่งที่คาดหวังจากข้า..."
 ep2_wedding.3200.c:0 "ได้โปรดเถิดที่รัก เราขังพวกเขาไว้ข้างนอกไม่ได้หรือ?"
