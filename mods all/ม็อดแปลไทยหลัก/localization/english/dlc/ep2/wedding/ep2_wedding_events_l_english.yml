 # BANQUET
 #A Kindred Spirit
 ep2_wedding.1040.t:0 "จิตวิญญาณต้องกัน"
 ep2_wedding.1040.desc:0 "ตลอดมื้ออาหาร ข้าพบว่าตนเองถูกดึงดูดเข้าสู่บทสนทนาของ [new_friend.GetTitledFirstNamePossessive] อย่างง่ายดาย\n\n[new_friend.GetSheHe|U] มีความคิดเห็นที่น่าสนใจยิ่งนัก กล่าวเรื่องตลกได้ยอดเยี่ยมที่สุด และดูเหมือนว่าเราจะมีอะไรหลายอย่างที่เหมือนกัน! ทุกครั้งที่ข้าเล่าเรื่องราวเกร็ดเล็กเกร็ดน้อย [new_friend.GetSheHe] ก็ตั้งใจฟัง และแสดงความคิดเห็นที่เหมาะสมในเวลาที่เหมาะสม\n\nใครเลยจะคิดว่าข้าจะได้พบมิตรสหายที่น่าพึงพอใจ เช่นนี้ในงานวิวาห์นี้?"
 ep2_wedding.1040.a:0 "ข้าเพลิดเพลินกับการคบหากับ [new_friend.GetFirstNamePossessiveNoTooltip] อย่างแท้จริง!"
 ep2_wedding.1040.b:0 "แต่ไม่จำเป็นต้องใกล้ชิดไปกว่านี้"
 wedding_kindred_log_title:0 "จิตวิญญาณต้องกัน"
 wedding_kindred_log:0 "[CHARACTER.GetUIName|U] และ [TARGET_CHARACTER.GetUIName] ได้กลายเป็นมิตรสหายกัน"
 #A Fiery Dance
 ep2_wedding.1050.t:0 "ระบำเพลิงอันเร่าร้อน"
 ep2_wedding.1050.desc:0 "ทุกคนต่างอยู่ในอารมณ์เบิกบาน ทางซ้ายมือของข้า กลุ่มเด็กๆ กำลังตกตะลึงกับการแสดงของนักปาหี่ ทางขวามือ เหล่ากวีกำลังขับขานบทประพันธ์ล่าสุดของตนต่อหน้าฝูงชนที่ชื่นชม\n\nอย่างไรก็ตาม งานเลี้ยงทั้งงานกลับเงียบสงัดลงเมื่อคณะนักเต้นถือคบเพลิงเดินเข้ามายังใจกลางสถานที่ พร้อมเชิญชวนแขกเหรื่อให้เข้าร่วมไปตลอดทาง ทิวทัศน์นั้นช่างน่าทึ่งในแสงสลัวยามพลบค่ำ คบเพลิงส่องสว่างใบหน้าที่ยิ้มแย้มของพวกเขาตัดกับท้องฟ้าที่มืดลง และทอดเงาที่สอดประสานกันเป็นลวดลาย\n\nทุกอย่างดูน่าตื่นตาตื่นใจ จนกระทั่ง [1050_victim.GetTitledFirstName] สะดุดล้ม ปัดคบเพลิงหลุดจากมือเพื่อนบ้าน และ ทำให้เสื้อผ้าของ [1050_victim.GetHerHis] ลุกเป็นไฟ..."
 ep2_wedding.1050.a:0 "ข้าต้องทำอะไรสักอย่าง!"
 ep2_wedding.1050.a.success:0 "ท่านช่วย [1050_victim.GetFirstNameNoTooltip] จากเปลวเพลิงได้"
 ep2_wedding.1050.a.success.tt:0 "ท่านช่วย [1050_victim.GetFirstNameNoTooltip] ไว้ได้!"
