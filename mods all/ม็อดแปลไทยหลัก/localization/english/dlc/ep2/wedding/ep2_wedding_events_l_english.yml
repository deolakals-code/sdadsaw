 #A Ritual Wash
 ep2_wedding.1100.t:0 "การชำระล้างตามพิธีกรรม"
 ep2_wedding.1100.desc_bride:0 "วันวิวาห์ของข้าใกล้เข้ามาแล้ว และญาติๆ ของข้าก็มารวมตัวกันที่สถานที่จัดงานเป็นเวลาหลายวันแล้ว ดังนั้นข้าจึงไม่แปลกใจเมื่อ [ROOT.Char.Custom2('RelationToMe', guest_1)] ของข้า [guest_1.GetTitledFirstName] และ [ROOT.Char.Custom2('RelationToMe', guest_2)] ของข้า [guest_2.GetTitledFirstName] พาข้าไปยังโรงอาบน้ำที่ห่างไกลไม่ไกลจาก [ROOT.Char.GetCurrentActivity.GetLocation.GetName]\n\n"ตามประเพณีโบราณของชนเรา" [guest_1.GetFirstNameNoTooltip] เริ่มต้น "เจ้าจะต้องวางเสื้อผ้าเก่าและ #EMP kransen#! — มงกุฎพรหมจรรย์" ลง\n\n"เราจะชำระล้างเจ้าให้สะอาดหมดจด และเจ้าจะเกิดใหม่ในฐานะเจ้าสาวที่งดงาม!" [guest_2.GetFirstNameNoTooltip] สรุปอย่างเคร่งขรึม"
 ep2_wedding.1100.desc_relative:0 "วันวิวาห์ของ [ROOT.Char.Custom2('RelationToMe', bride)] [bride.GetTitledFirstNamePossessive] ใกล้เข้ามาแล้ว และครอบครัวก็ได้อยู่ที่ [ROOT.Char.GetCurrentActivity.GetLocation.GetName] เป็นเวลาหลายวัน วันนี้ เรากำลังพาเจ้าสาวไปยังโรงอาบน้ำที่เงียบสงบเพื่อทำพิธีชำระล้างตามประเพณี\n\n"วันนี้" ข้าเริ่มต้น "เจ้าวางเสื้อผ้าเก่าและ #EMP kransen#! — มงกุฎพรหมจรรย์ ลง เมื่อชำระล้างและ ทำให้บริสุทธิ์แล้ว เจ้าจะลุกขึ้นมาในฐานะเจ้าสาวที่แท้จริง!"\n\nจากข้างกายข้า [ROOT.Char.Custom2('RelationToMe', guest_2)] ของข้า [guest_2.GetTitledFirstName] โห่ร้องเสียงดัง"
 ep2_wedding.1100.desc_extra_guest:0 "\n\n"เราจะ ทำให้เจ้า #EMP สวย#! มากๆ!!" [guest_3.GetTitledFirstName|U] พูดอย่างกระตือรือร้น"
