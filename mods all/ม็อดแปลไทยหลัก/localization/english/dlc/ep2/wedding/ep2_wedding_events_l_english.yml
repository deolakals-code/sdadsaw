 ep2_wedding.1200.e.success.tt:0 "ท่านมีความคืบหน้าในการจับคู่ [listener.GetFirstNameNoTooltip] กับ [intent_target.GetFirstNameNoTooltip]"
 wedding_gloating_log:0 "[CHARACTER.GetUIName|U] ทำให้ [TARGET_CHARACTER.GetUIName] ขุ่นเคืองโดยการโอ้อวดเกี่ยวกับงานวิวาห์ที่ประสบความสำเร็จ"
 wedding_gloating_log_title:0 "การโอ้อวด"
 wedding_alliance_log:0 "[CHARACTER.GetUIName|U] ได้รับพันธมิตรกับ [TARGET_CHARACTER.GetUIName] โดยการแสดงความสัมพันธ์ทางการ แต่งงานอันทรงพลังของพวกเขา"
 wedding_alliance_log_title:0 "พันธมิตรใหม่"
 # Political Talk
 ep2_wedding.1210.t:0 "การพูดคุยทางการเมือง"
 ep2_wedding.1210.desc:0 "ขณะที่พิธีดำเนินไป ในที่สุดข้าก็สามารถวางตัวอยู่ข้าง [talk_to.GetTitledFirstName] และชวน [talk_to.GetHerHim] พูดคุยเล็กน้อย ซึ่งเปลี่ยนไปสู่ประเด็นที่น่าสนใจยิ่งขึ้นอย่างรวดเร็ว: การเมือง\n\nเราแลกเปลี่ยนความคิดเห็นทั่วไป จนกระทั่งข้านำ [talk_to.GetHerHim] ไปยังจุดที่ข้าต้องการ [talk_to.GetHerHim] พอดี"
 ep2_wedding.1210.desc_gold:0 "\n\n"ข้าเจ็บปวดที่ต้องยอมรับ แต่คลังสมบัติของข้าว่างเปล่า!""
 ep2_wedding.1210.desc_fear:0 "\n\n"ข้าใช้ชีวิตอยู่ด้วยความหวาดกลัวอย่างต่อเนื่องต่อ [talk_to.GetPrimaryTitle.GetTierAsNameNoTooltip] ของข้า และตัวข้าเอง...""
 ep2_wedding.1210.desc_raids:0 "\n\n"ข้ากังวลอย่างยิ่งเกี่ยวกับการบุกปล้นล่าสุดในดินแดนของข้า...""
 ep2_wedding.1210.desc_rivals:0 "\n\n"ข้านอนไม่หลับตอนกลางคืน ข้าเห็นศัตรูของข้าในทุกเงา!""
 ep2_wedding.1210.desc_age:0 "\n\n"ข้าเจ็บปวดที่ต้องยอมรับ แต่ข้าไม่ได้หนุ่มสาวไปกว่านี้แล้ว!""
 ep2_wedding.1210.desc_bad_harvest:0 "\n\n"น่าเศร้าที่เรามีการเก็บเกี่ยวที่ไม่ดี ซึ่ง ทำให้การเติบโตของเราถดถอยลงเมื่อเร็วๆ นี้...""
 ep2_wedding.1210.desc_rain:0 "\n\n"ฝนที่ไม่คาดคิดได้สร้างความเดือดร้อนให้กับประชาชนของข้าและสร้างความเสียหายต่อการเก็บเกี่ยว...""
 ep2_wedding.1210.desc_enemies:0 "\n\n"ท่านไม่มีทางรู้สึกปลอดภัยเกินไป ศัตรูของท่านแข็งแกร่งขึ้นรอบตัวท่านเสมอ""
 ep2_wedding.1210.a:0 "น่าเสียดายถ้ามีใครใช้ประโยชน์จากสิ่งนั้น ใช่ไหม?"
 ep2_wedding.1210.a.success:0 "[talk_to.GetFirstNameNoTooltip] ถูกข่มขู่"
 ep2_wedding.1210.a.failure:0 "[talk_to.GetFirstNameNoTooltip] ไม่ถูกข่มขู่"
 ep2_wedding.1210.b:0 "เป็นการดีที่จะมีพันธมิตรที่แข็งแกร่งในยามต้องการ!"
 ep2_wedding.1210.b.success:0 "[talk_to.GetFirstNameNoTooltip] ประทับใจ"
 ep2_wedding.1210.b.failure:0 "[talk_to.GetFirstNameNoTooltip] ไม่ไว้วางใจท่าน"
 ep2_wedding.1210.c:0 "ท่านเคยพิจารณาหาผู้คุ้มครองหรือไม่?"
 ep2_wedding.1210.c.success:0 "[talk_to.GetFirstNameNoTooltip] ถูกโน้มน้าว"
 ep2_wedding.1210.c.failure:0 "[talk_to.GetFirstNameNoTooltip] สงสัย"
 wedding_intimidation_log:0 "[CHARACTER.GetUIName|U] ข่มขู่ [TARGET_CHARACTER.GetUIName] และได้รับข้อผูกมัด"
 wedding_intimidation_log_title:0 "ได้รับข้อผูกมัด"
 wedding_fealty_log:0 "[CHARACTER.GetUIName|U] ข่มขู่ [TARGET_CHARACTER.GetUIName] ให้สาบานความภักดีต่อ [CHARACTER.GetHerHim]"
 wedding_fealty_log_title:0 "ข้าในบังคับคนใหม่"
 # Poisonous Relations
 ep2_wedding.1220.t:0 "ความสัมพันธ์ที่เป็นพิษ"
 ep2_wedding.1220.desc:0 "การเตรียมการและพิธีกรรมของพิธีวิวาห์มีมากมาย ในช่วงพักระหว่างพิธี ข้าได้ยินเสียงหัวเราะคิกคักและเยาะเย้ยมาจากกลุ่มญาติของ [other_spouse.GetFirstNamePossessive]\n\nเมื่อพวกเขาเห็นว่าได้รับความสนใจจากข้าแล้ว [relative.GetTitledFirstName] ก็เริ่มพูดกับข้าโดยตรง:"
 ep2_wedding.1220.desc_marry_down:0 ""ข้าไม่อยากจะเชื่อเลยว่าครอบครัวของเราตกลงที่จะปล่อยให้ [other_spouse.GetFirstNameNoTooltip] ทำให้ [other_spouse.GetHerselfHimself] เสื่อมเสียโดยการ แต่งงานกับผู้ที่ด้อยกว่าทางสังคม เช่นนี้!""
 ep2_wedding.1220.desc_feud:0 ""ข้าไม่อยากจะเชื่อเลยว่าเราตกลงที่จะรวมเป็นหนึ่งกับตระกูล [ROOT.Char.GetHouse.GetName] ที่ #EMP น่ารังเกียจ#!""
 ep2_wedding.1220.desc_despicable:0 ""มัน #EMP น่าโมโห#! ที่เรากำลังปล่อยให้ [other_spouse.GetFirstNameNoTooltip] ที่น่าสงสาร แต่งงานกับตัวละครที่น่ารังเกียจ เช่น #EMP ท่าน#!!""
 ep2_wedding.1220.desc_miscreant:1 ""เราจะปล่อยให้ #EMP คนชั่วร้าย#! ที่เลวทรามนี้ ทำให้ [other_spouse.GetFirstNameNoTooltip] ที่น่าสงสารเสื่อมเสียได้อย่างไร?""
 ep2_wedding.1220.desc_fallback:0 ""เป็นเรื่องน่าละอายจริงๆ ที่เราไม่สามารถหาใครที่ #EMP ดีกว่า#! นี้ให้กับ [other_spouse.GetFirstNameNoTooltip] ที่น่าสงสารได้ แต่ชีวิตก็เป็น เช่นนี้...""
 ep2_wedding.1220.desc_target:0 "\n\nความโกลาหลยังดึงดูดความสนใจของ [diplo_intent.GetTitledFirstNamePossessive] ซึ่งตอนนี้กำลังเฝ้าดูข้าอย่างตั้งใจ"
 ep2_wedding.1220.a:0 "ใช่ ใช่ แน่นอน..."
 ep2_wedding.1220.b:1 "นั่นคือคำท้าทายหรือ?"
 ep2_wedding.1220.c:0 "ข้า #EMP จะ#! พิสูจน์ให้ท่านเห็นว่าคิดผิด"
 ep2_wedding.1220.c.tt:0 "การจัดการสถานการณ์ได้ดีจะสร้างความประทับใจที่ดีให้กับ [diplo_target.GetFirstNameNoTooltip] ด้วย"
 ep2_wedding.1220.c.success:0 "ท่านสร้างความประทับใจที่ดีให้กับ [relative.GetFirstNameNoTooltip]"
 ep2_wedding.1220.c.success.tt:0 "[relative.GetFirstNameNoTooltip] ชอบท่านมากขึ้น!"
 ep2_wedding.1220.c.failure:0 "ท่านไม่สามารถหักล้างอคติของ [relative.GetFirstNamePossessiveNoTooltip] ได้"
 ep2_wedding.1220.c.failure.tt:0 "[relative.GetFirstNameNoTooltip] ยังคงไม่ชอบท่าน!"
 ep2_wedding.1220.d:0 "โอ้ ข้าสามารถเป็นได้ #EMP แย่กว่า#! นี้มาก!!"
 wedding_proved_wrong_log:0 "[CHARACTER.GetUIName|U] โน้มน้าว [TARGET_CHARACTER.GetShortUIName] ถึงคุณสมบัติที่ดีของ [CHARACTER.GetHerHis] หักล้างอคติของ [TARGET_CHARACTER.GetShortUINamePossessive]"
