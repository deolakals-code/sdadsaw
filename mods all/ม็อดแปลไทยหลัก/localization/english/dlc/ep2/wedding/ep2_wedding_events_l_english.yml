 #Could it Be You?
 ep2_wedding.1020.t:0 "อาจเป็นท่าน?"
 ep2_wedding.1020.desc:0 ""งานวิวาห์เป็นเพียงเรื่องการเมือง" ข้าเตรียมใจขณะรอ [spouse_2.Custom('WifeHusband')] ในอนาคตของข้ามาสมทบ\n\n"แค่เรื่องการเมือง" ข้าพูดกับตัวเองซ้ำๆ "มันจะแย่สักแค่ไหนกันเชียว?"\n\nแต่ไม่มีสิ่งใดเตรียมข้าให้พร้อมสำหรับช่วงเวลาที่ข้าได้เห็น [spouse_2.GetFirstName] เป็นครั้งแรก ไม่มีภาพวาดหรือคำบรรยายใดจะสามารถเทียบเท่ากับแววตาอันอ่อนโยนบนใบหน้าของ [spouse_2.GetHerHis] ได้ ไม่มีกวีคนใดเคยขับขานความงาม เช่น [spouse_2.GetHersHis] เวลาหยุดนิ่งเมื่อสายตาของเราประสานกัน และคนอื่นๆ ดูเหมือนจะหายไป\n\nจากนั้น [spouse_2.GetSheHe] ก็ยิ้มให้ข้า และข้าก็รู้ ทุกอย่างจะเรียบร้อยดี"
 ep2_wedding.1020.a:0 "อาจเป็นท่านที่ข้ารอคอยอยู่?"
 wedding_first_sight_log_title:0 "ศรกามเทพ"
 wedding_first_sight_log:0 "[CHARACTER.GetUIName|U] และ [TARGET_CHARACTER.GetUIName] ตกหลุมรักกันตั้งแต่แรกเห็น"
 #A Good/Bad Omen
 ep2_wedding.1030.t:0 "ลาง [ROOT.Char.Custom('GoodBad')|U]"
 ep2_wedding.1030.desc:0 "แขกเหรื่อมารวมตัวกัน พิธีการกำลังจะเริ่มขึ้น และทุกอย่างดูเรียบร้อยดี เมื่อมีบางสิ่งที่ไม่ธรรมดาเกิดขึ้นต่อหน้าต่อตาข้า\n\n"
 ep2_wedding.1030.desc_good1:0 "เป็ดป่าที่ดูเหมือนหลงทางกำลังเดินฝ่าฝูงแขก มุ่งหน้าไปยัง [spouse_2.GetTitledFirstName] อย่างแน่วแน่ ซึ่งยังไม่ทันสังเกตเห็น เมื่อไปถึง [spouse_2.GetHerHim] นกก็ส่งเสียงร้อง #EMP ก๊าบ!!#! ดังสนั่น หันหลังกลับและจากไป ท่ามกลางความประหลาดใจของ [spouse_2.GetFirstNamePossessiveNoTooltip] และความขบขันของฝูงชน"
 ep2_wedding.1030.desc_good2:0 "[spouse_2.GetTitledFirstName|U] ระหว่างทางไปหา [ROOT.Char.GetWifeHusband] ในอนาคตของ [spouse_2.GetHerHis] สะดุดและเซไปมา เกือบจะล้มลง! เมื่อคนรับใช้ที่กังวลเข้ามาใกล้ [spouse_2.GetSheHe] ก็เพียงแค่ยิ้มและหยิบต้นเหตุขึ้นมา: เกือกม้า!"
 ep2_wedding.1030.desc_good3:0 "ฝูงนกทางซ้ายของเราบินขึ้นอย่างกะทันหันเมื่อ [spouse_2.GetTitledFirstName] ปรากฏตัว และบินตรงข้ามศีรษะของ [spouse_2.GetHerHis] ไปทางขวาของ [spouse_2.GetHerHis]!"
 ep2_wedding.1030.desc_bad1:0 "คนรับใช้คนหนึ่ง ขณะกำลังไปที่ห้องครัว สะดุดและทำเกลือทั้งกระปุกหกลงบนพื้น!"
 ep2_wedding.1030.desc_bad2:0 "เครื่องรางนำโชคที่ [spouse_2.GetTitledFirstName] สวมรอบคอของ [spouse_2.GetHerHis] หลุดออกและหล่นลงพื้น ถูกเหยียบย่ำอย่างไม่ไยดีโดยคนรับใช้ที่รีบร้อน!"
 ep2_wedding.1030.desc_bad3:0 "เมฆพายุรวมตัวกัน ดูเหมือนจะมาจากไหนก็ไม่รู้ และมารวมกันอยู่เหนือสถานที่จัดงาน ท้องฟ้าที่สดใสสวยงามเปลี่ยนเป็นมืดครึ้มและน่ากลัวอย่างรวดเร็ว ทอดเงาอันเป็นลางร้ายลงบนพิธีการที่กำลังจะเริ่มขึ้น"
 ep2_wedding.1030.desc_outro:0 "\n\n[1030_chatter.GetTitledFirstName] ผู้ ซึ่งเห็นเหตุการณ์ทั้งหมดเกิดขึ้น เช่นเดียวกับข้า สบตาข้าและแสดงความคิดเห็น:"
 ep2_wedding.1030.desc_good:0 ""นั่น... น่าประหลาดใจใช่ไหม?""
 ep2_wedding.1030.desc_bad:0 ""นั่น... แย่มากเลยใช่ไหม?""
 ep2_wedding.1030.a:0 "ช่างเป็นสัญญาณมงคล!"
