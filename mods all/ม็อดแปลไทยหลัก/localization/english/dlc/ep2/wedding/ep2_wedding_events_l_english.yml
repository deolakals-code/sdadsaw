 # A Bad Match
 ep2_wedding.1180.t:0 "คู่ที่ไม่เหมาะสม"
 ep2_wedding.1180.desc:0 "เมื่อเรายืนเผชิญหน้ากันในที่สุด ข้าเห็นได้จากการอยู่ไม่สุขอย่างประหม่าของ [other_spouse.GetTitledFirstNamePossessive] ว่า [other_spouse.GetSheHe] แทบจะไม่สบายใจเลย\n\nสายตาของ [other_spouse.GetHerHis|U] หลีกเลี่ยงข้า และสีหน้าบูดบึ้งที่ปรากฏบนปากของ [other_spouse.GetHerHis] บอกทุกสิ่งที่ข้าจำเป็นต้องรู้ [other_spouse.GetSheHe|U] ไม่ชอบข้า"
 ep2_wedding.1180.a:0 "ความเห็นของท่านไม่จำเป็น"
 ep2_wedding.1180.b:0 "ข้าจะ ทำให้ท่านชอบข้าให้ได้!"
 ep2_wedding.1180.c:0 "ข้าไม่สน! อาหารอยู่ไหน?"
 # Religious Complaints
 ep2_wedding.1190.t:0 "ข้อร้องเรียนทางศาสนา"
 ep2_wedding.1190.desc:1 "ทุกคนตื่นเต้นและประหลาดใจกับความงดงามของสถานที่จัดงานวิวาห์ ทุกคนยกเว้น [grumbler.GetTitledFirstName]\n\nนับตั้งแต่การมาถึงของ [grumbler.GetHerHis] [grumbler.GetFirstNameNoTooltip] ก็เดินด้อมๆ มองๆ ค้นหาข้ออ้างใดๆ ที่จะบ่น "ท่านกำลัง #EMP แต่งหน้า#! หรือ?!" "ผ้าคลุมหน้าสีสันสดใสเหล่านั้น #EMP เป็นบาป#!!" "การ #EMP สังสรรค์#! อย่างไม่บริสุทธิ์ทั้งหมดนี้คืออะไร?" "นี่เป็นการแสดงความหรูหราและความใคร่ทั้งหมดหรือ?""
 ep2_wedding.1190.a:0 "ข้าละอายใจในตัวเอง..."
 ep2_wedding.1190.b:0 "ทหาร พาคนขัดความสุขนี้ไปที่ประตู"
 ep2_wedding.1190.c:0 "ข้าจะแสร้งทำเป็นไม่ได้ยินอะไรเลย"
 ep2_wedding.1190.d:0 "ใช่ และข้าก็จะสนุกกับมันด้วย!"
 every_zealous_attending_character:0 "ตัวละครที่เข้าร่วมทุกคนที่เคร่งศาสนา"
 wedding_religious_complaints_log:0 "[CHARACTER.GetUIName|U] สร้างความวุ่นวายเกี่ยวกับความฟุ่มเฟือยของงานวิวาห์และการสังสรรค์ที่ไม่บริสุทธิ์ของผู้เข้าร่วม"
 wedding_religious_complaints_log_title:0 "$ep2_wedding.1190.t$"
 # A Parent's Heart
 ep2_wedding.1200.t:0 "หัวใจของ [ROOT.Char.GetMotherFather|U]"
 ep2_wedding.1200.desc:0 "ในที่สุดวันนั้นก็มาถึง และข้าไม่สามารถภาคภูมิใจในตัว [my_child.GetFirstName] ของข้า [my_child.Custom('GetBrideGroom')] ที่งดงามได้มากกว่านี้อีกแล้ว!\n\nดังที่บุคคลที่ยืนอยู่ข้างกายข้าได้ค้นพบโดยไม่ตั้งใจ: "ดู [my_child.GetHerHim] สิ! [my_child.GetSheHe] ไม่ #EMP เปล่งปลั่ง#! หรือ?" "และเป็นคู่ที่เหมาะสมมาก!" "ทุกอย่างสมบูรณ์แบบ!""
 ep2_wedding.1200.desc_interest:0 "\n\nเมื่อข้าหันกลับไปในที่สุด ข้าตระหนักว่าเพื่อนบ้านของข้าไม่ใช่ใครอื่นนอกจาก [listener.GetTitledFirstName]! ข้าอาจใช้ประโยชน์จากช่วงเวลาแห่งความผูกพันนี้..."
 ep2_wedding.1200.desc_generic:0 "\n\nข้างกายข้า [listener.GetTitledFirstName] เพียงแค่ยิ้มอย่างสุภาพ"
 ep2_wedding.1200.a:0 "ข้าแค่ภูมิใจมาก"
 ep2_wedding.1200.b:0 "ท่าน #EMP ไม่อิจฉา#! หรือ?"
 ep2_wedding.1200.c:0 "ความรักอยู่ในอากาศอย่างแท้จริง..."
 ep2_wedding.1200.d:0 "งานวิวาห์ที่สำคัญสร้างพันธมิตรที่สำคัญ!"
 ep2_wedding.1200.d.tt:0 "[listener.GetFirstNameNoTooltip|U] อาจเต็มใจที่จะพิจารณาเป็นพันธมิตรกับท่านด้วย"
 ep2_wedding.1200.e:0 "หากเพียง แต่ข้าจะได้เห็นสิ่งเดียวกันสำหรับ [intent_target.GetFirstNameNoTooltip]..."
 ep2_wedding.1200.success:0 "[listener.GetFirstNameNoTooltip|U] ประทับใจ"
 ep2_wedding.1200.success.tt:0 "ท่านสร้างความประทับใจให้ [listener.GetFirstNameNoTooltip]"
 ep2_wedding.1200.failure:0 "[listener.GetFirstNameNoTooltip|U] ไม่ประทับใจ"
