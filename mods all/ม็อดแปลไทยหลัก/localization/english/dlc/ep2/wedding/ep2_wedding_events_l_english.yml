 # The Parade
 ep2_wedding.1170.t:0 "ขบวนแห่"
 ep2_wedding.1170.desc:0 "การมาถึงของ [rich_spouse.Custom('GetBrideGroom')] [rich_spouse.GetTitledFirstName] มาพร้อมกับเสียงประโคมอันยิ่งใหญ่: ขบวนม้าที่ประดับประดาอย่างหรูหราทั้งขบวนทิ้งเกือกม้าเงินให้สามัญชนเก็บ กลอง ไลร์ ปี่สก็อต นักแสดงละครใบ้ และตัวตลก\n\nตอนนี้ ขบวนแห่ได้แยกย้ายกันไปแล้ว แต่ก็ยังคงดึงดูดฝูงชนจำนวนมาก ทำให้ไขว้เขวจากพิธีการที่กำลังดำเนินอยู่"
 ep2_wedding.1170.desc_relax:0 "\n\nข้าหวังว่าข้าจะสามารถเพลิดเพลินกับทุกสิ่งได้ในคราวเดียว! แต่กลับกัน ข้าวิ่งไปมาระหว่างการแสดงโยนของ การลูบคลำม้า และการแสดงกินไฟ"
 ep2_wedding.1170.desc_mischief:0 "\n\nความเป็นไปได้มากมาย! ข้าควรจะปล่อยม้าหรือไม่? หรือบางทีข้าอาจจะขโมยกลองและ ทำให้แขกคนอื่นๆ ตกใจ..."
 ep2_wedding.1170.desc_murder:0 "\n\nข้าเหลือบเห็น [murderee.GetTitledFirstName] กำลังหลงใหลในการแสดงดนตรี โดยไม่รู้ตัวถึงสภาพแวดล้อมรอบตัว [murderee.GetHerHis] เลย..."
 ep2_wedding.1170.a:0 "ข้าอยากเข้าร่วมด้วย!"
 ep2_wedding.1170.a.tt:0 "ท่านแอบหยิบเกือกม้าไปเมื่อไม่มีใครมอง"
 ep2_wedding.1170.b:0 "น่าเพลิดเพลิน แต่ก็เกินไปหน่อย"
 ep2_wedding.1170.b.tt:0 "ท่านกลับมาจดจ่อกับพิธีการ"
