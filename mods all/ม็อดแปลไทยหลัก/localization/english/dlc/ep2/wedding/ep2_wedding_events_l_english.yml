 #New Family
 ep2_wedding.1120.t:0 "ครอบครัวใหม่"
 ep2_wedding.1120.desc:0 "พิธีวิวาห์มักจะยาวนาน น่าเบื่อพอสมควร และส่วนใหญ่ไม่มีอะไรน่าตื่นเต้น ยกเว้นเมื่อเกิดความโกลาหลขึ้นที่ไหนสักแห่งข้างหลังข้า"
 ep2_wedding.1120.desc_child:0 "\n\nข้าจำเสียงบ่นอันคุ้นเคยของ [trouble_child.GetFirstNamePossessive] ได้ทันที ขณะที่ [trouble_child.GetSheHe] เดินฝ่าฝูงชนเข้ามา [trouble_child.GetHerHis] "[ROOT.Char.GetMotherFather|U] นี่ควรจะเป็น [other_parent.GetMotherFather] คนใหม่ของข้า แทนที่จะเป็น [other_parent.GetFirstName] หรือ?""
 ep2_wedding.1120.desc_adult:0 "\n\n"ข้ามีบางอย่างจะพูด!" เสียงอันคุ้นเคยของ [trouble_child.GetFirstNamePossessive] ดังขึ้นจากในฝูงชน "นี่ #EMP คือ#! สิ่งที่ดีที่สุดที่ท่านจะมาแทนที่ [other_parent.GetMotherFather] ของข้า [other_parent.GetTitledFirstName] ได้หรือ?!"
 ep2_wedding.1120.desc_parent:0 "\n\nจากหางตา ข้าเห็น [other_parent.GetFirstNameNoTooltip] แข็งทื่อด้วยความประหลาดใจ"
 ep2_wedding.1120.a:0 "หยุดเรื่องไร้สาระนี่ #EMP เดี๋ยวนี้.#!"
 ep2_wedding.1120.b:0 "ข้ารู้ ที่รัก มันยากสำหรับเราทุกคน..."
 ep2_wedding.1120.c:0 "#EMP [other_parent.GetMotherFather] ของเจ้าควรจะเป็นความลับ!#!"
 wedding_child_fuss_log:0 "บุตรของ [TARGET_CHARACTER.GetUINamePossessive|U] [CHARACTER.GetUIName|U] สร้างความวุ่นวายระหว่างพิธีวิวาห์"
 wedding_child_fuss_log_title:0 "$ep2_wedding.1120.t$"
 wedding_child_fuss_secret_log:0 "บุตรของ [TARGET_CHARACTER.GetUINamePossessive|U] [CHARACTER.GetUIName|U] สร้างความวุ่นวายระหว่างพิธีวิวาห์และเปิดเผยความลับเกี่ยวกับการเกิดของพวกเขา"
 wedding_child_fuss_secret_log_title:0 "ความลับถูกเปิดเผย"
 ep2_wedding.1121.desc_child:0 "\n\nณ ศูนย์กลางของความโกลาหลนั้น ยืนอยู่คือ [trouble_child.Custom('GetDaughterSon')] ของ [other_spouse.GetFirstNamePossessive] [trouble_child.GetTitledFirstName] กำลังสะอื้นและคร่ำครวญ "[other_spouse.GetMotherFather|U] ทำไมท่านถึงแทนที่ [other_parent.GetMotherFather] ของข้า [other_parent.GetFirstName]?""
 ep2_wedding.1121.desc_adult:0 "\n\n"ข้ามีบางอย่างจะพูด!" [trouble_child.GetTitledFirstName] [trouble_child.Custom('GetDaughterSon')] ของ [other_spouse.GetFirstNamePossessive] ดังขึ้นจากในฝูงชน "นี่ #EMP คือ#! สิ่งที่ดีที่สุดที่ท่านจะมาแทนที่ [other_parent.GetMotherFather] ของข้า [other_parent.GetTitledFirstName] ได้หรือ?!"
 ep2_wedding.1121.a:0 "หุบปาก #EMP เจ้าเด็กเหลือขอ#!."
 ep2_wedding.1121.b:0 "ข้าจะเป็นพ่อแม่ที่ดีกว่า!"
 ep2_wedding.1122.desc_repentant:0 "ข้ากำลังเพลิดเพลินกับ [ROOT.Char.Custom('GetExpensiveMeal')] ส่วนใหญ่ โดยไม่มีเรื่องกังวลใดๆ ในโลก เมื่อ [trouble_child.GetFirstName] ที่ดูสำนึกผิดเข้ามาหาข้า\n\n"[ROOT.Char.GetMotherFather|U] ข้าอยากจะขอโทษที่ก่อเรื่องในระหว่างพิธี มันไม่เหมาะสมกับการเลี้ยงดูและฐานะของข้า และข้าเสียใจอย่างสุดซึ้ง""
 ep2_wedding.1122.desc_unrepentant:0 "ข้าพยายามที่จะเพลิดเพลินกับ [ROOT.Char.Custom('GetExpensiveMeal')] ส่วนใหญ่ แต่คำพูดที่เสียดแทงและการเปิดเผยความลับของข้าอย่างไม่ใส่ใจของ [trouble_child.GetFirstNamePossessive] ยังคงวนเวียนอยู่ในใจข้า\n\nเมื่อข้าเข้าใกล้ [trouble_child.GetHerHim] ในที่สุด [trouble_child.GetFirstNameNoTooltip] ดูไม่สะทกสะท้านและไม่สำนึกผิดเลย "ข้ายืนยันในสิ่งที่ข้าพูด และไม่เสียใจ #EMP อะไร#! ทั้งสิ้น มันเป็นเพียงความจริง" [trouble_child.GetSheHe] ตอบพร้อมกับแสยะยิ้ม"
 1122_child_pacified_log:0 "[CHARACTER.GetUIName|U] และ [TARGET_CHARACTER.GetUIName|U] ได้พูดคุยเปิดอกกันอย่างกระจ่างแจ้ง"
 1122_child_pacified_log_title:0 "การกลับมาคืนดีของครอบครัว"
 1122_child_not_pacified_log:0 "[CHARACTER.GetUIName|U] และ [TARGET_CHARACTER.GetUIName|U] ไม่สามารถหาจุดร่วมใดๆ ได้"
 1122_child_not_pacified_log_title:0 "ความเข้าใจผิดในครอบครัว"
 ep2_wedding.1122.a:0 "ข้าให้อภัยเจ้า"
 ep2_wedding.1122.b:0 "มันไม่สมควรจริงๆ"
 ep2_wedding.1122.c:0 "ข้าต้องเคารพความผิดหวังของเจ้า"
 ep2_wedding.1122.d:0 "นี่มันน่าโมโห!"
 #Secret Whispers
 ep2_wedding.1130.t:0 "เสียงกระซิบแห่งความลับ"
 ep2_wedding.1130.desc:0 "พิธีการกำลังดำเนินไปอย่างเต็มที่ แต่ข้าไม่สามารถจดจ่อกับสิ่งที่เกิดขึ้น #EMP ข้างหน้า#! ข้าได้จริงๆ เมื่อข้าได้ยินเสียงหึ่งๆ ดังมาจาก #EMP ข้างหลัง#! ข้าตลอดเวลา หากข้าตั้งใจฟังมากพอ ข้าสามารถจับใจความบางส่วนของสิ่งที่ดูเหมือนจะเป็นวงซุบซิบนินทาขนาดใหญ่ที่เกี่ยวข้องกับทั้งแขกและคนรับใช้ #EMP"ท่านได้ยินไหม-" "มันจะเป็นจริงได้หรือ?" "แต่แล้วเรื่อง-" "-ไม่รู้??"#!\n\n"
 ep2_wedding.1130.desc_continue:0 "ขณะที่ข้าฯ หันกลับไปถามอย่างฉุนเฉียว ข้าฯ ก็สบตากับ [1130_knows.GetTitledFirstName] ที่กำลังยิ้มเยาะ ผู้ดูเหมือนจะเป็นศูนย์กลางของความโกลาหลทั้งหมด "ท่านไม่มีสิ่งใดจะกล่าวหรือ [ROOT.Char.Custom('FormOfAddressForLiege')]?""
 wedding_secret_revealed_log:0 "[CHARACTER.GetUIName|U] เปิดเผยความลับของ [TARGET_CHARACTER.GetUINamePossessive|U] ระหว่างพิธีการ ทำให้เกิดความวุ่นวาย"
 wedding_secret_revealed_log_title:0 "$wedding_child_fuss_secret_log_title$"
 wedding_secret_not_revealed_log:0 "[CHARACTER.GetUIName|U] พยายามเปิดเผยความลับของ [TARGET_CHARACTER.GetUINamePossessive|U] ระหว่างพิธีการ และถูกไล่ออกไป"
 wedding_secret_not_revealed_log_title:0 "ผู้ก่อกวนถูกขับไล่"
 ep2_wedding.1130.a:0 "ข้าจะไม่ปฏิเสธหลักฐาน"
 ep2_wedding.1130.b:0 "ทหาร เอา #EMP คนใส่ร้าย#! นี้ออกไปให้พ้นสายตาข้า"
 ep2_wedding.1131.desc:0 "ณ ศูนย์กลางของความโกลาหล ยืนอยู่คือ [1130_knows.GetTitledFirstName] ยิ้มอย่างพึงพอใจ "[other_spouse.GetFirstName] ไม่เคยบอกท่านหรือ? #EMP ทุกคน#! รู้!"
 ep2_wedding.1131.a:0 "ไม่มีความลับระหว่างเราอีกต่อไป [other_spouse.GetFirstNameNoTooltip]"
 ep2_wedding.1131.b:0 "นี่มัน #EMP น่าโมโห#!!"
 ep2_wedding.1132.desc:0 "พิธีการกำลังดำเนินไปอย่างเต็มที่ แต่ข้าไม่ได้ให้ความสนใจมากนัก เนื่องจากจิตใจของข้าถูกดึงกลับไปสู่ข้อมูลที่น่าหนักใจที่ข้ารู้เกี่ยวกับ [spouse_with_secret.GetTitledFirstName] อยู่ตลอดเวลา [other_spouse.GetTitledFirstName] รู้หรือไม่? [other_spouse.GetSheHe] ไม่ควรรู้หรือ?\n\nข้าแบ่งปันความกังวลบางส่วนของข้ากับเพื่อนบ้านที่นั่งข้างๆ อย่างไม่เป็นทางการ และก่อนที่ข้าจะรู้ตัว ฝูงชนทั้งหมดก็เต็มไปด้วยเสียงซุบซิบนินทา และทั้ง [spouse_with_secret.GetFirstNameNoTooltip] และ [other_spouse.GetFirstNameNoTooltip] ต่างก็จ้องมองมาที่ศูนย์กลางของความโกลาหลอย่างโกรธเคือง: ข้า"
 ep2_wedding.1132.a:0 "[other_spouse.GetFirstNameNoTooltip] สมควรได้รับสิ่งที่ดีกว่านี้!"
 ep2_wedding.1132.b:0 "มันเป็นแค่ข่าวลือ #EMP ไร้สาระ#! ใช่ไหม [spouse_with_secret.GetFirstNameNoTooltip]?"
 # A Misstep
 ep2_wedding.1140.t:0 "การก้าวพลาด"
 ep2_wedding.1140.desc:0 "ข้ากำลังเพลิดเพลินกับพิธีการ ภาคภูมิใจในสิ่งที่ข้าสามารถจัดขึ้นได้ ทุกอย่างดำเนินไปด้วยดีจนถึงตอนนี้ — และทันทีที่ข้าคิด เช่นนั้น ข้าก็รู้ว่าข้าได้พูดในสิ่งที่ไม่เป็นมงคลเสียแล้ว"
 ep2_wedding.1140.desc_1:0 "\n\n[fumbling_spouse.GetTitledFirstName] สะดุดและล้มหน้าคว่ำระหว่างทางไปหาคู่ครองของ [fumbling_spouse.GetHerHis]!"
 ep2_wedding.1140.desc_2:0 "\n\n[fumbling_spouse.GetTitledFirstName] เริ่มพูดติดอ่างระหว่างกล่าวคำสาบาน ออกเสียงชื่อคู่ครองของ [fumbling_spouse.GetHerHis] ผิดอย่างรุนแรง!"
 ep2_wedding.1140.desc_3:0 "\n\n[fumbling_spouse.GetTitledFirstName] หยุดนิ่งด้วยความสับสน เห็นได้ชัดว่าลืมไปแล้วว่าขั้นตอนต่อไปของพิธีคืออะไร!"
 ep2_wedding.1140.desc_target:0 "\n\nข้ารู้สึกได้ถึงสายตาของ [intent_target.GetTitledFirstNamePossessive] ที่จ้องมองมาที่ข้าจากฝูงชน กระตุ้นให้ข้าเข้าไปแทรกแซง"
 ep2_wedding.1140.desc_target_spouse:0 "\n\nข้าสบตากับสายตาตื่นตระหนกของ [intent_target.GetTitledFirstNamePossessive] จากอีกฟากของห้อง ซึ่งกำลังอ้อนวอนให้ข้าทำอะไรบางอย่าง"
 ep2_wedding.1140.a:0 "ข้ายังสามารถกอบกู้สถานการณ์ได้..."
 ep2_wedding.1140.a.success:0 "ท่านคลี่คลายสถานการณ์"
 ep2_wedding.1140.a.success.tt:0 "ท่านคลี่คลายสถานการณ์ได้สำเร็จ"
 ep2_wedding.1140.a.success.tt2:0 "[intent_target.GetFirstNameNoTooltip] ประทับใจกับการแก้ไขสถานการณ์อย่างราบรื่นของท่าน"
 ep2_wedding.1140.a.failure:0 "ท่านมี แต่จะ ทำให้ตัวเองอับอาย"
 ep2_wedding.1140.a.failure.tt:0 "ท่าน ทำให้ตัวเองอับอาย"
 ep2_wedding.1140.b:0 "ไปต่อกันเถอะ"
 ep2_wedding.1140.c:0 "มันเกิดขึ้นได้!"
