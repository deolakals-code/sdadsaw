 # Romantic Scouting
 ep2_wedding.1150.t:0 "การสอดแนมเชิงรักใคร่"
 ep2_wedding.1150.desc:0 "พิธีวิวาห์มักจะยาวนานและน่าเบื่อ และสายตาของข้าก็คอยสอดส่องฝูงแขกเพื่อหาเป้าหมายแห่งความปรารถนาของข้าอยู่ตลอดเวลา: [intent_target.GetTitledFirstName]"
 ep2_wedding.1150.desc_1:0 "\n\nเมื่อข้าพบ [intent_target.GetHerHim] ในที่สุด [intent_target.GetSheHe] อยู่ห่างจากฝูงชนเล็กน้อย กำลังดมดอกไม้จากการตก แต่งสถานที่ด้วยรอยยิ้มยินดีบนใบหน้าของ [intent_target.GetHerHis]"
 ep2_wedding.1150.desc_2:0 "\n\nเมื่อข้าพบ [intent_target.GetHerHim] ในที่สุด [intent_target.GetSheHe] กำลังมองดูคนรับใช้ที่รีบเร่งไปมาพร้อมจานเต็มและถัง [host.Custom('RegionalDrink')] ด้วยความสนใจอย่างยิ่ง"
 ep2_wedding.1150.desc_3:0 "\n\nเมื่อข้าพบ [intent_target.GetHerHim] ในที่สุด [intent_target.GetSheHe] กำลังซุบซิบกับแขกกลุ่มเล็กๆ เกี่ยวกับความไร้จุดหมายของงานวิวาห์"
 ep2_wedding.1150.desc_4:0 "\n\nเมื่อข้าพบ [intent_target.GetHerHim] ในที่สุด [intent_target.GetSheHe] กำลังเทศนาให้แขกคนอื่นๆ ฟังเกี่ยวกับความศักดิ์สิทธิ์ของการ แต่งงาน"
 ep2_wedding.1150.desc_fallback:0 "\n\nเมื่อข้าพบ [intent_target.GetHerHim] ในที่สุด [intent_target.GetSheHe] กำลังยุ่งอยู่กับการสังสรรค์กับแขกกลุ่มเล็กๆ"
 ep2_wedding.1150.desc_conclusion:0 "เป็นโอกาสอันดีที่จะเข้าใกล้ [intent_target.GetHerHim]"
 ep2_wedding.1150.a:0 "สถานการณ์ เช่นนี้เรียกร้อง #EMP บทกวี#! บ้าง!!"
 ep2_wedding.1150.b:0 "ท่านรู้ไหมว่างานวิวาห์ ทำให้ข้ามี #EMP อารมณ์#! อยากทำอะไร?"
 ep2_wedding.1150.c:0 "ท่านจะเล่าให้ข้าฟังเพิ่มเติมเกี่ยวกับเรื่องนี้ได้ไหม?"
