 ep2_wedding.1310.t:0 "ไม่อาจปลีกตัว"
 ep2_wedding.1310.desc_spouse:0 "ข้ารู้ว่าข้าควรใช้เวลากับ [other_spouse.GetWifeHusband] คนใหม่ของข้า [other_spouse.GetFirstName] และครอบครัวของ [other_spouse.GetHerHis] แต่ข้าก็ไม่อาจปลีกตัวออกจากมิตรสหายของข้า [friend.GetTitledFirstName] ได้เลย! ข้าเห็น [other_guest.GetTitledFirstName] เริ่มจ้องมองข้าอย่างไม่พอใจ $ep2_wedding.1310.howlingwithlaughter$"
 ep2_wedding.1310.desc_host:0 "ในฐานะเจ้าภาพงานวิวาห์ ข้ารู้ว่าข้าควรใช้เวลากับคู่บ่าวสาวและครอบครัวของพวกเขา แต่ข้าก็ไม่อาจปลีกตัวออกจากมิตรสหายของข้า [friend.GetTitledFirstName] ได้เลย! ข้าเห็น [other_guest.GetTitledFirstName] เริ่มจ้องมองข้าอย่างไม่พอใจ $ep2_wedding.1310.howlingwithlaughter$"
 ep2_wedding.1310.desc_guest:0 "ข้ารู้ว่าข้าควรจะไปพูดคุยกับแขกคนอื่นๆ แต่ข้าก็ไม่อาจปลีกตัวออกจากมิตรสหายของข้า [friend.GetTitledFirstName] ได้เลย! ข้าเห็น [other_guest.GetTitledFirstName] พยายามเรียกร้องความสนใจจากข้า $ep2_wedding.1310.howlingwithlaughter$"
 ep2_wedding.1310.howlingwithlaughter:0 "แต่ทุกครั้งที่ข้าพยายามจะขอตัว [friend.GetFirstNameNoTooltip] ก็ ทำให้ข้าหัวเราะเสียงดังลั่นอีกครั้ง"
 ep2_wedding.1310.a:1 "ช่างเป็นความสุขเหลือเกินที่มี [friend.GetFirstNameNoTooltip] อยู่ที่นี่กับข้า!"
