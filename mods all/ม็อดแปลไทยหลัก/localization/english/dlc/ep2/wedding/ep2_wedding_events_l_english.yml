 # WEDDING NIGHT
 #That Cursed Table
 ep2_wedding.1060.t:0 "โต๊ะต้องสาปนั่น"
 ep2_wedding.1060.desc:1 "ด้วยเสียงถอนหายใจอย่างหนัก ข้าทิ้งงานรื่นเริงทั้งหมดไว้เบื้องหลังและปิดประตูห้องหอของเรา มันเป็นวันที่ยาวนาน แต่งานวิวาห์จำเป็นต้อง #EMP เสร็จสมบูรณ์#! ใช่หรือไม่?\n\nข้าอดสังเกตไม่ได้ว่า [spouse_2.GetTitledFirstName] มีท่าทางกระสับกระส่ายมากขึ้นเรื่อยๆ ตลอดช่วงเย็น แต่ข้าก็ไม่ได้คิดอะไรมาก ใครบ้างจะไม่ประหม่าเล็กน้อยในงาน แต่งงานของตน? อย่างไรก็ตาม ขณะที่ข้าเอื้อมมือไปหาชุดชั้นในของเขา ข้าก็ประหลาดใจที่พบว่าเขา #EMP ตื่นเต้น#! น้อยกว่าที่ข้าคาดไว้มาก\n\nเขาแทบจะกระโดดออกจากตัวและอุทานว่า "เป็น เพราะห้องนี้! เตียง! หรือโต๊ะข้างเตียงนั่น! อาจจะเป็นพรมแขวนผนัง? ความเป็นชายของข้าถูกสาปแล้ว!!""
 ep2_wedding.1060.a:0 "#EMP ก็ได้#!."
 ep2_wedding.1060.a.tt:1 "ท่าน ทำให้แน่ใจว่า [spouse_2.GetFirstNameNoTooltip] ไม่มีข้อแก้ตัวอีกต่อไป"
 ep2_wedding.1060.b:0 "ข้าเข้าใจ ไม่ต้องกังวล"
 ep2_wedding.1061.desc:0 "คนรับใช้เข้าๆ ออกๆ จากห้องหอของข้ามาเป็นชั่วโมงแล้ว ขนย้ายเฟอร์นิเจอร์และของตก แต่งทั้งหมดออกไปอย่างเร่งรีบ ตอนนี้เหลือเพียงโต๊ะเปล่าตัวหนึ่งตั้งอยู่อย่างโดดเดี่ยวกลางห้อง\n\nขณะที่ข้านั่งอยู่บนโต๊ะนั้นเปลือยเปล่าพอๆ กับโต๊ะ รอคอยสามีที่เพิ่ง แต่งงานของข้า [spouse_2.GetTitledFirstName] ข้าอดคิดพร้อมรอยยิ้มเจ้าเล่ห์ไม่ได้ว่าตอนนี้เขาจะไม่มีข้อแก้ตัวอีกแล้ว"
 ep2_wedding.1061.desc_1:0 "\n\nขณะที่เขาก้าวเข้ามาในห้อง สีหน้าประหลาดใจบนใบหน้าของเขาก็ละลายกลายเป็นความเร่าร้อนอย่างรวดเร็ว"
 ep2_wedding.1061.desc_2:0 "\n\n[spouse_2.GetFirstNameNoTooltip] ก้าวเข้ามาในห้อง ช้ากว่าปกติ สายตาหลุบต่ำ และกระสับกระส่ายอยู่แล้ว จากท่าทางที่เขาจงใจหลบเลี่ยงสายตาที่อยากรู้อยากเห็นของข้า ข้าก็ได้คำตอบทั้งหมดที่ข้าต้องการ"
 ep2_wedding.1061.a:0 "ค่อยยังชั่วหน่อย!"
 ep2_wedding.1061.b:0 "#EMP ออกไป! เจ้าน่ารังเกียจยิ่งกว่าหนอนเสียอีก!#!"
 ep2_wedding.1061.c:0 "ช่างเถอะ ไม่ต้องรีบร้อน"
 THEY_ARE_ACCUSED_IMPOTENCY:0 "ท่านได้ประณาม [secondary_recipient.GetShortUIName] ว่าไร้สมรรถภาพทางเพศ"
 ep2_wedding.1065.desc:0 "ในที่สุดก็ได้ออกจากฝูงชนที่โห่ร้องด้านนอก [spouse_2.GetTitledFirstName] และข้าก็อยู่ตามลำพังในห้องหอของเราเสียที มันเป็นวันที่ยาวนาน แต่งานวิวาห์จำเป็นต้อง #EMP เสร็จสมบูรณ์#! ใช่หรือไม่?\n\nโชคไม่ดีที่ [spouse_2.GetFirstNameNoTooltip] ใช้เวลาไม่นานนักในการค้นพบว่า #EMP บางส่วน#! ของข้าไม่ได้กระตือรือร้นเท่าส่วนอื่นๆ และไม่ว่าการเกลี้ยกล่อม การติดสินบน หรือการข่มขู่ใดๆ ก็ดูเหมือนจะไม่ได้ผลมากนัก\n\n"ข้าพยายามอยู่นี่ไง!" ข้าอุทาน นี่มัน #EMP น่าอายเหลือเกิน#!!"
 ep2_wedding.1065.a:0 "#EMP ข้าต้องถูกสาปแน่ๆ!!#!"
 ep2_wedding.1065.a.tt:0 "ริมฝีปากของ [spouse_2.GetShortUINamePossessive] บิดเบี้ยวอย่างประชดประชัน แต่ [spouse_2.GetSheHe] ไม่พูดอะไรขณะที่ [spouse_2.GetSheHe] ออกจากห้องไป"
 ep2_wedding.1065.b:0 "ข้าแค่ประหม่า..."
 ep2_wedding.1065.b1:1 "[spouse_2.GetFirstNameNoTooltip] อดทนรอ"
 ep2_wedding.1065.b2:1 "[spouse_2.GetFirstNameNoTooltip] ประณามปัญหาของท่าน"
 ep2_wedding.1066.desc:0 "[spouse_2.GetTitledFirstName|U] กลับมาที่ห้องหอของเราในอีกไม่กี่นาทีต่อมา ตามด้วยคนรับใช้ที่สับสนหลายคนที่เริ่มขนย้ายเฟอร์นิเจอร์และของตก แต่งทั้งหมดออกจากห้องทันที ทุกคำถามของข้าถูกตอบด้วยความเงียบอย่างดื้อรั้น เมื่อพวกเขาจากไปในที่สุด เหลือเพียงโต๊ะเปล่าตัวหนึ่ง โต๊ะเปล่าที่มี [spouse_2.GetFirstNameNoTooltip] ที่ #EMP เปลือยเปล่าไม่แพ้กัน#! อยู่ด้านบน\n\n"ข้าไม่เห็นสิ่งของ #EMP ต้องสาป#! อีกแล้ว เจ้าว่าอย่างไร?" [spouse_2.GetSheHe|U] ยิ้มอย่างมีความหมาย"
 ep2_wedding.1066.desc_1:0 "\n\nความคิดทั้งหมดหายไปจากหัวของข้า"
 ep2_wedding.1066.desc_2:0 "\n\n"#EMP โอ้.#!" ข้าเริ่มพูดตะกุกตะกักและถ่วงเวลา "เจ้าเห็นไหม... มันไม่ใช่ว่า- สิ่งที่ข้าหมายถึงคือ-" แต่สีหน้าที่เย็นชาของ [spouse_2.GetHerHis] ทำให้ข้าหยุดชะงัก"
 ep2_wedding.1066.a:0 "จบลงด้วยดีก็ดีแล้ว!"
 ep2_wedding.1066.b:0 "ข้าไม่ได้ทำ #EMP โดยเจตนา#! ข้าสาบาน!"
 ep2_wedding.1066.b_1:0 "[spouse_2.GetFirstNameNoTooltip] รู้สึกขุ่นเคือง"
 ep2_wedding.1066.b_2:0 "[spouse_2.GetFirstNameNoTooltip] อดทนและยอมรับ"
 #One More Goblet
 ep2_wedding.1110.t:0 "อีกหนึ่งถ้วย"
 ep2_wedding.1110.desc_intro:0 "หลังจากคู่สมรสแยกย้ายไปยังห้องส่วนตัว การเฉลิมฉลองก็ดำเนินต่อไปตลอดทั้งคืน เพียง แต่ค่อยๆ ลดความเข้มข้นและความอึกทึกครึกโครมลง แขกส่วนใหญ่ทยอยกันกลับ หลับไป หรือปลีกตัวไปเพลิดเพลินกับความสุขยามค่ำคืนด้วยตนเอง"
 ep2_wedding.1110.desc:0 "\n\nแขก #EMP ส่วนใหญ่#! แต่ไม่ใช่ [1110_drunk.GetTitledFirstName] [1110_drunk.GetSheHe|U] ร้องเรียกหาถ้วยแล้วถ้วยเล่าเสียงดัง หัวเราะเสียงดังที่สุด และปฏิเสธอย่างแข็งขันทุกความพยายามของคนรับใช้ที่จะพา [1110_drunk.GetHerHim] ไปยังที่ที่เงียบกว่า"
 ep2_wedding.1110.desc_host:0 "\n\nข้าควรจะทำอะไรบางอย่างเกี่ยวกับ [1110_drunk.GetHerHim] จริงๆ..."
 ep2_wedding.1110.a:0 "บางคนช่างไร้ยางอายเสียจริง"
