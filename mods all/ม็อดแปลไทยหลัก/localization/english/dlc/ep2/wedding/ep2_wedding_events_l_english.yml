 ep2_wedding.3020.desc:0 "[my_spouse.GetTitledFirstName] ยิ้มแย้มตลอดทั้งวัน เฉลิมฉลองพิธีและแสดงให้เห็นว่า [my_spouse.GetSheHe] มีคุณธรรมเพียงใดในการสนทนาที่เป็นมิตร การพูดคุยดูเหมือนจะไม่มีวันสิ้นสุด และหลังจากที่เราใช้เวลาพอสมควรในห้องนอนที่ตอนนี้ใช้ร่วมกัน ข้าก็รู้สึกอยากจะโน้มตัวเข้าไปจูบ [my_spouse.GetHerHim]...\n\nแต่มันไม่เหมือนที่ข้าคาดไว้เลย ริมฝีปากของ [my_spouse.GetHerHis|U] แห้งผาก การเคลื่อนไหวของ [my_spouse.GetHerHis] ไม่กระตือรือร้น ข้าผละออกและมองเข้าไปในดวงตาของ [my_spouse.GetHerHis] อย่างสงสัย\n\n"ข้า...," [my_spouse.GetSheHe] กล่าวพลางสูดหายใจลึก "มีรสนิยม... ที่แตกต่างออกไป" "
