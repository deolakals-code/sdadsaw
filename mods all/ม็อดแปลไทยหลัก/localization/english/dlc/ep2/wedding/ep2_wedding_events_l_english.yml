 ep2_wedding.1170.d:1 "ถ้าข้า ทำให้ตัวตลกนั่นสะดุดล้มล่ะ?"
 ep2_wedding.1170.e:0 "[murderee.GetFirstNameNoTooltip] กำลังเสียสมาธิ..."
 ep2_wedding.1170.e.tt:0 "ท่านพยายามใช้ประโยชน์จากฝูงชนและความโกลาหลของขบวนแห่"
 ep2_wedding.1170.success:0 "ท่านแอบเข้าไปข้างหลัง [murderee.GetFirstNameNoTooltip] และ #EMP ลงมือ#! "
