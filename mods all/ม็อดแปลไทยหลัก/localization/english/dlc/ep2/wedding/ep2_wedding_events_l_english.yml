 #A Magnificent Welcome
 ep2_wedding.1010.t:0 "การต้อนรับอันงดงาม"
 ep2_wedding.1010.desc:0 "ข้าดีใจที่บอกคนรับใช้ล่วงหน้าให้คอยจับตาดูการมาถึงของ [1010_target.GetTitledFirstNamePossessive] เพราะท่ามกลางการเตรียมงาน แต่งงาน มิฉะนั้นข้าคงพลาดไปแล้ว\n\nแต่ข้ากลับยืนอย่างภาคภูมิใจอยู่กลางลาน สวมเสื้อผ้าที่หรูหราที่สุดและรายล้อมด้วยกองทหารเกียรติยศ เมื่อ [1010_target.GetFirstNameNoTooltip] ปรากฏตัว [1010_target.GetHerHis]"
 ep2_wedding.1010.diplo:0 "\n\n"ข้ายินดีอย่างยิ่งที่ได้ต้อนรับท่าน [1010_target.GetTitledFirstNameNoTooltip]! ข้ามั่นใจว่าท่านจะพบว่าการต้อนรับของข้าน่าพอใจอย่างยิ่ง และประทับใจกับสิ่งมหัศจรรย์ทั้งหมดที่อาณาจักรของข้ามีให้!""
 ep2_wedding.1010.seduce:0 "\n\n"[1010_target.GetTitledFirstNameNoTooltip] ที่รัก! ในที่สุดท่านก็มาถึง! ไม่มีการเฉลิมฉลองใดจะน่าพึงพอใจสำหรับข้าเท่ากับการได้อาบแสงอันเจิดจ้าของท่าน!""
 ep2_wedding.1010.match:0 "\n\n"[1010_target.GetTitledFirstNameNoTooltip] ยินดีต้อนรับ! [1010_match.GetFirstName] มาทักทายด้วยสิ! — #EMP เจ้าต้องสร้างความประทับใจที่ดีกับ [1010_target.GetHerHim] และครอบครัวของ [1010_target.GetHerHis] เข้าใจไหม?!" ข้าเสริมด้วยเสียงกระซิบอันเกรี้ยวกราด"
 ep2_wedding.1010.a:0 "ให้ข้าพาท่านชมสวน!"
