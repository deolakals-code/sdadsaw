 # Artistic Differences
 ep2_wedding.1000.t:0 "ความเห็นต่างทางศิลปะ"
 ep2_wedding.1000.desc:0 "ราวกับว่าการจัดงานวิวาห์ให้สมฐานะของตระกูลข้านั้นยังไม่เครียดพอ ข้ายังต้องรับมือกับญาติของ [spouse_2.GetFirstNamePossessive] อีก\n\n[spouse_2.GetHerHis|U] [spouse_2.Custom2('RelationToMe', SCOPE.sC('1000_relative'))], [1000_relative.GetTitledFirstName] มาถึง แต่เช้าตรู่และคอยตามข้าไปทุกหนทุกแห่งตั้งแต่นั้นมา บ่นเรื่องนั้นเรื่องนี้ไม่หยุดหย่อน ขณะที่ข้ารู้สึกปวดหัวจี๊ดขึ้นมา [1000_relative.GetSheHe] ก็ยังคงพูดพล่ามต่อไปอย่างไม่สะทกสะท้าน"
 ep2_wedding.1000.desc_servants:0 "\n\n"ท่าน #EMP แน่ใจ#! หรือว่ามีคนรับใช้เพียงพอสำหรับงานนี้? ท่านคงไม่คาดหวังให้ #EMP ข้า#! ยก [ROOT.Char.Custom('GetExpensiveMeal')] เข้ามาหรอกนะ?! ตำนานเล่าว่าในงานวิวาห์ของทวดข้า คนรับใช้มีมากมายเสียจนหมวกของพวกเขาบดบังแสงอาทิตย์ได้!""
 ep2_wedding.1000.desc_dec:0 "\n\n"ดอกไม้พวกนี้สีอะไรกัน?! มันจะขัดกับผิวของ [spouse_2.GetFirstNamePossessiveNoTooltip] #EMP อย่างร้ายกาจ#! แล้วทำไมท่านถึงเลือกการจัดโต๊ะที่ #EMP ไร้รสนิยม#! เช่นนี้! และอย่าให้ข้าต้องพูดถึงผ้า #EMP ฉูดฉาด#! พวกนี้เลย!""
 ep2_wedding.1000.desc_dec_low:0 "\n\n"ข้า #EMP รู้#! อยู่แล้วว่าท่านไม่คู่ควรกับ [spouse_2.GetFirstNameNoTooltip] ที่รักของข้า! ดูสถานที่นี่สิ ดอกไม้ที่น่าสงสาร โต๊ะที่ว่างเปล่า และไม่มีแม้ แต่เศษเสี้ยวทองคำให้เห็นเลย! หัวใจที่น่าสงสารของข้า #EMP หลั่งเลือด#! ให้กับชีวิตอันแร้นแค้นที่รอคอยเด็กที่น่าเวทนานั้นอยู่!""
 ep2_wedding.1000.desc_entertainment:0 "\n\n"นั่นนักแสดงละครใบ้หรือ? คนรับใช้พวกนั้นกำลังไปไหนกับไฟเบาๆ นั่น? แล้วทำไมลังไม้นั่นถึง #EMP คำราม#! ล่ะ?! นี่จะต้องเป็นหายนะแน่!""
 ep2_wedding.1000.desc_fallback:0 "\n\n"ดอกไม้พวกนี้จะ ทำให้ [spouse_2.GetFirstNameNoTooltip] จาม! แล้วขนแกะนี่ก็หยาบเกินไป! แล้วโทนสีล่ะ? ข้ารู้ว่า [spouse_2.GetFirstNameNoTooltip] จะไม่ชอบมัน!""
 ep2_wedding.1000.a:0 "ข้ามั่นใจว่าเราจะหาจุดร่วมกันได้..."
