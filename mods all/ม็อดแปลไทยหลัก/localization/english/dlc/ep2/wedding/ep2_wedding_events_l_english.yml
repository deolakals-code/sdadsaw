 # Gatecrashers
 ep2_wedding.1160.t:0 "ผู้บุกรุกงาน"
 ep2_wedding.1160.desc:0 "งานวิวาห์ของชนชั้นสูงมักเป็นการแสดงที่ยอดเยี่ยมสำหรับสามัญชน ผู้ ซึ่งมารวมตัวกันด้วยความหวังว่าจะได้เห็นผู้ปกครองของตนและลิ้มรสความร่ำรวยของพวกเขา\n\nโดยเฉพาะอย่างยิ่ง ข้าอดสังเกตไม่ได้ว่าการเตรียมงานเลี้ยงใหญ่ที่กำลังดำเนินอยู่นั้น กำลังถูกจับตามองด้วยความสนใจอย่างยิ่งจากกลุ่มชาวนาที่ดูซูบผอมอย่างยิ่ง..."
 ep2_wedding.1160.a:0 "ข้าอาจจะปล่อยให้พวกเขาเข้ามา!"
 ep2_wedding.1160.a.tt:0 "นี่จะ ทำให้เรื่องน่าตื่นเต้นขึ้น!"
 ep2_wedding.1160.b:0 "ข้าอาจจะลักลอบนำอาหารไปให้พวกเขา!"
 ep2_wedding.1160.b.tt:0 "[host.GetFirstNameNoTooltip] จะไม่มีทางสังเกตเห็น!"
 ep2_wedding.1160.c:0 "นี่ต่ำกว่าศักดิ์ศรีของข้า"
 ep2_wedding.1161.desc:0 "ข้าสังเกตเห็นฝูงชนสามัญชนที่เพิ่มมากขึ้นรอบๆ งานมาระยะหนึ่งแล้ว\n\nสิ่งที่ข้าไม่ได้คาดหวังคือการเห็นกองทหารเล็กๆ ของพวกเขาบุกโจมตีห้องครัวและพยายามดื่ม [ROOT.Char.Custom('RegionalDrink')] และกิน [ROOT.Char.Custom('GetExpensiveMeal')] ให้มากที่สุดเท่าที่จะทำได้!\n\n#EMP พวกเขาเข้ามาได้อย่างไร?!#!"
 ep2_wedding.1161.a:0 "ไล่พวกเขาออกไป!"
 ep2_wedding.1161.b:0 "ให้ทุกคนร่วมแบ่งปันความสุขของเรา!"
 ep2_wedding.1161.success:0 "ชาวนาถูกขับไล่ออกไป"
 ep2_wedding.1161.success.tt:0 "ท่านฟื้นฟูความสงบเรียบร้อย"
 ep2_wedding.1161.success.tt2:0 "[host.GetFirstName] ขับไล่ชาวนาออกไป"
 ep2_wedding.1161.failure:0 "ท่านล้มเหลวในการควบคุมฝูงชน"
 ep2_wedding.1161.failure.tt:0 "ผู้บุกรุกงานยังคงวิ่งวุ่นวาย"
 ep2_wedding.1161.failure.tt2:0 "[host.GetFirstName] ล้มเหลวในการจัดการกับผู้บุกรุกงาน"
 ep2_wedding.1161.b.tt:0 "[host.GetFirstName] ปล่อยให้ชาวนาอยู่ต่อ"
