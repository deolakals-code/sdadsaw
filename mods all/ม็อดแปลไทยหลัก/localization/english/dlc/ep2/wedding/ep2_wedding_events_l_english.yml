 ep2_wedding.3000.t:0 "การเริ่มต้นอันประหม่า"
 ep2_wedding.3000.desc:0 "#EMP ถอนหายใจ#! เอาล่ะ ไปกันเลย ข้าเดาว่า ข้าควรจะทำอะไรตอนนี้ล่ะ? [my_spouse.GetSheHe]ชอบ... การกอดรัดหรือเปล่า? บางทีอาจจะแค่จูบ ข้าหันหน้าหนีเมื่อ[my_spouse.GetSheHe]มองมาที่ข้าโดยตรง ข้าเห็นว่า[my_spouse.GetSheHe]ก็กำลังอยู่ไม่สุขกับมือของ[my_spouse.GetHerHis] เช่นกัน อย่างน้อยก็\n\n"เอ่อ...," ข้าพยายามพูด กระแอมในลำคอ ผ้าปูที่นอนยังไม่มีรอยยับแม้ แต่น้อย "คืนนี้เจ้าดูสวยงาม"\n\n"ข-ขอบคุณ... ข้าชอบ... ผมของท่านมาก เช่นกัน"\n\nให้ตายสิ นี่มันไม่ได้ผลอย่างชัดเจน"
