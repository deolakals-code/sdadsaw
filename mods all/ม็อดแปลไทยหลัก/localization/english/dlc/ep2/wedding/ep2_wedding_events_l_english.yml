 ep2_wedding.3030.t:0 "ค่ำคืนที่น่าจดจำ"
 ep2_wedding.3030.desc:0 "ไฟในเตาผิงเริ่มมอดลง และข้าจ้องมองเปลวไฟของมันอย่างเงียบงัน แสงสว่าง ความอบอุ่นของมัน [my_spouse.GetTitledFirstName] กำลังค้นหาบางอย่างในหีบไม้ของ [my_spouse.GetHerHis] และข้าละสายตาจากเปลวไฟเพื่อมองไปที่ [my_spouse.GetHerHim]\n\n"[ROOT.Char.GetFirstNameNoTooltip]," [my_spouse.GetSheHe] กล่าวพลางยื่นห่อเล็กๆ ห่อด้วยผ้าไหมให้ข้า "ข้าเก็บสิ่งนี้ไว้ตั้งแต่ได้ยินเรื่องการหมั้นหมายของเรา และตอนนี้ข้ามอบมันให้ท่านเป็นเครื่องหมายแห่งความรักของข้า""
