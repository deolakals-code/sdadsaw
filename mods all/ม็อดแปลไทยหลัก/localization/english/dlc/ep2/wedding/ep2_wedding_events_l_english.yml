 ep2_wedding.1320.desc_intro:0 "[rival.GetTitledFirstName] ที่น่ารังเกียจคนนั้นจ้องมองข้าข้ามโต๊ะจัดเลี้ยงมาตลอด สายตาของเราสบกัน และข้าก็เตรียมพร้อมสำหรับการโต้เถียงขณะที่ [rival.GetSheHe] เดินข้ามห้องมาหาข้า เดี๋ยวนะ... [rival.GetSheHe] กำลังร้องไห้หรือ?\n\n"
