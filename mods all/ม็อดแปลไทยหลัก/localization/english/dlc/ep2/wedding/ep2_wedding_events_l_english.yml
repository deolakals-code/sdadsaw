 #A Proper Match
 ep2_wedding.1080.t:0 "คู่ที่เหมาะสม"
 ep2_wedding.1080.desc:0 "การเตรียมงานวิวาห์ยังคงดำเนินไปอย่างเต็มที่ แต่สายตาของข้าจับจ้องไปที่เป้าหมายที่ไกลกว่านั้นแล้ว: การหาคู่ให้กับ [ROOT.Char.Custom2('RelationToMe', 1080_target)] ของข้า [1080_target.GetFirstName]!\n\nโชคดีที่ [1080_target.GetSheHe] อยู่ที่สถานที่จัดงานแล้ว ซึ่งเป็นการเริ่มต้นที่ดี และกำลังยืนอยู่รอบๆ อย่างเก้ๆ กังๆ ตอนนี้ ต้องหาใครสักคนที่เหมาะสม... ความสนใจของข้าถูกดึงดูดไปยังกลุ่มแขกที่กำลังสนทนากัน ซึ่งในหมู่พวกเขานั้น [matchmaking_1.GetTitledFirstName] โดดเด่นด้วยความงามและท่าทาง #EMP สมบูรณ์แบบ#! "
 ep2_wedding.1080.desc_2:0 "\n\nข้ากำลังจะส่ง [1080_target.GetFirstNameNoTooltip] ไป แต่ข้าก็สังเกตเห็น [matchmaking_2.GetTitledFirstName] ด้วย บางที [matchmaking_2.GetSheHe] อาจจะเป็นคู่ที่เหมาะสมยิ่งกว่า?"
 ep2_wedding.1080.a:0 "[1080_target.GetFirstNameNoTooltip] ไปคุยกับ [matchmaking_1.GetFirstNameNoTooltip] สิ!"
 ep2_wedding.1080.a.success:0 "[1080_target.GetFirstNameNoTooltip] สร้างความประทับใจให้ [matchmaking_1.GetFirstNameNoTooltip]"
