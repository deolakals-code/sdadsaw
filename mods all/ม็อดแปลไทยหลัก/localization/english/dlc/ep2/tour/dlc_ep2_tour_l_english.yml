 activity_tour_destination_selection:0 "ยิ่งจุดหมายปลายทางอยู่ห่างจาก [stop|E] ก่อนหน้ามากเท่าใด ท่านก็จะยิ่งใช้ [gold|E] มากขึ้นในการเสด็จประพาส วางแผนอย่างชาญฉลาดเพื่อลดค่าใช้จ่ายและเยี่ยมเยียน [vassals|E] ให้ได้มากที่สุด"

