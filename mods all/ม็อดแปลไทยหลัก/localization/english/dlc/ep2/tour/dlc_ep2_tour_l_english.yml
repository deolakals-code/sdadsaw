 tour_phase_dinner_cost_desc:0 "[hosted_dinner|E] ใน [province.GetBaronyNameExplicitly]"
 tour_phase_cultural_festival_cost_desc:0 "[cultural_festival|E] ใน [province.GetBaronyNameExplicitly]"

 ### OPTIONS
 tour_option_speed:0 "ม้า"
 tour_speed_bad:0 "ลา"
 tour_speed_normal:0 "ม้าเร็ว"
 tour_speed_good:0 "ม้าทรง" # Secretariat is a famous racehorse, using a term for royal horses fits the style.
 tour_type_majesty:1 "การเสด็จประพาสเพื่อบารมี"
 tour_type_majesty_desc:1 "$EFFECT_LIST_BULLET$ บางเหตุการณ์จะอนุญาตให้มีการกระทำที่แสดงถึงความยิ่งใหญ่เป็นพิเศษ\n$EFFECT_LIST_BULLET$ การกระทำเหล่านี้จะได้รับ [prestige|E] และ [opinion|E] ของ [vassal|E] ทั้งเมื่อออกจาก [stop|E] และเมื่อสิ้นสุด [GetActivityType('activity_tour').GetName] ของท่าน\n\n#weak การเสด็จประพาสครั้งนี้เป็นโอกาสที่จะแสดงให้เหล่าข้าแผ่นดินเห็นว่าข้าเป็นเจ้าเหนือหัวที่ยุติธรรม มีเมตตา และทรงบารมี#! "
 tour_type_intimidation:1 "การเสด็จประพาสเพื่อข่มขวัญ"
 tour_type_intimidation_desc:1 "$EFFECT_LIST_BULLET$ บางเหตุการณ์จะอนุญาตให้มีการกระทำที่น่าสะพรึงกลัวเป็นพิเศษ\n$EFFECT_LIST_BULLET$ การกระทำเหล่านี้จะได้รับ [dread|E]\n$EFFECT_LIST_BULLET$ เมื่อท่านออกจาก [stop|E] ท่านอาจพยายามบังคับให้ [vassals|E] ออกจาก [factions|E] ที่เป็นปฏิปักษ์\n\n#weak การเสด็จประพาสครั้งนี้เป็นโอกาสที่จะทำให้เหล่าข้าแผ่นดินรู้สำนึกและแสดงให้เห็นว่าข้าน่าสะพรึงกลัวเพียงใด#! "
 tour_type_taxation:1 "การเสด็จประพาสเพื่อเก็บภาษี"
 tour_type_taxation_desc:1 "$EFFECT_LIST_BULLET$ บางเหตุการณ์จะอนุญาตให้มีการกระทำที่แสดงความละโมบ\n$EFFECT_LIST_BULLET$ การกระทำเหล่านี้จะได้รับ [gold|E] ทั้งเมื่อออกจาก [stop|E] และเมื่อสิ้นสุด [GetActivityType('activity_tour').GetName] ของท่าน\n\n#weak การเสด็จประพาสครั้งนี้เป็นโอกาสที่จะเตือนข้าในบังคับว่าพวกเขามีหน้าที่ต้องจ่ายภาษีและข้อผูกพัน และเพื่อขุดรากถอนโคนการหลีกเลี่ยงภาษีทั้งหมดภายในอาณาจักรของข้า#! "
 tour_entourage:0 "ขบวนผู้ติดตาม"
 tour_entourage_small:0 "ขบวนผู้ติดตามขนาดเล็ก"
 tour_entourage_small_desc:1 "$EFFECT_LIST_BULLET$ [courtiers|E] ใกล้ชิดห้าคนจะติดตามท่านในการ [tour|E]\n\n#weak การเสด็จประพาสของข้าเป็นโอกาสที่จะหลีกหนีจากชีวิตในราชสำนักและพบปะข้าแผ่นดินที่อยู่ห่างไกล ข้าไม่ต้องการให้เสียงพูดพล่ามของราชสำนักตามติดข้าไปในการเดินทาง#! "
 tour_entourage_normal:0 "ขบวนผู้ติดตามพอประมาณ"
 tour_entourage_normal_desc:1 "$EFFECT_LIST_BULLET$ [courtiers|E] ใกล้ชิดสิบคนจะติดตามท่านในการ [tour|E]\n$EFFECT_LIST_BULLET$ $tour_increase_prestige$\n\n#weak การเสด็จประพาสของข้าไม่ใช่เพื่อข้าเพียงผู้เดียว แต่เพื่อราชสำนักของข้าด้วย ข้าต้องนำขบวนผู้ติดตามขนาดเล็กไปด้วยเพื่อให้ข้าในบังคับคุ้นเคยกับข้าราชสำนักของข้ามากขึ้น#! "
 tour_entourage_grand:0 "ขบวนผู้ติดตามขนาดใหญ่"
 tour_entourage_grand_desc:1 "$EFFECT_LIST_BULLET$ [courtier|E] ทุกคนที่ว่างจะติดตามท่านในการ [tour|E]\n$EFFECT_LIST_BULLET$ $tour_increase_prestige$\n\n#weak การเสด็จประพาสของข้าเป็นโอกาสที่จะแสดงให้เห็นว่าข้ายิ่งใหญ่และสง่างามเพียงใด และจะมีวิธีใดดีไปกว่าการแสดงให้เห็นสมาชิกทุกคนในราชสำนักอันน่าอิจฉาของข้า?#! "
 tour_luxuries:0 "ของฟุ่มเฟือย"
 tour_luxuries_bad:1 "ไม่มีของฟุ่มเฟือย"
 tour_luxuries_bad_desc:1 "$EFFECT_LIST_BULLET$ ไม่เพิ่มความสำเร็จของ [tour|E] ของท่าน\n\n#weak ท่านไม่ได้นำสิ่งของฟุ่มเฟือยใดๆ จากบ้านมาด้วย#! "
 tour_luxuries_normal:1 "ของฟุ่มเฟือยที่จำเป็น"
 tour_luxuries_normal_desc:1 "$EFFECT_LIST_BULLET$ $tour_increase_success$\n\n#weak ท่านนำมาเพียงอาหารและสิ่งอำนวยความสะดวกฟุ่มเฟือยที่จำเป็นเท่านั้น#! "
 tour_luxuries_good:1 "ของฟุ่มเฟือยหรูหรา"
 tour_luxuries_good_desc:1 "$EFFECT_LIST_BULLET$ $tour_increase_success$\n\n#weak ไม่มีค่าใช้จ่ายใดสูงเกินไปสำหรับการเสด็จประพาสของท่าน อาหารเลิศรสและสิ่งอำนวยความสะดวกทุกประเภทจะถูกนำติดตัวไปด้วยตลอดระยะเวลาการเสด็จประพาส#! "
 tour_furniture_normal:1 "เครื่องเรือนหรูหรา"
 tour_furniture_normal_desc:1 "$EFFECT_LIST_BULLET$ $tour_increase_success$\n$EFFECT_LIST_BULLET$ $tour_increase_prestige$\n\n#weak ตู้ เก้าอี้ และโต๊ะจะถูกนำติดตัวไปด้วยสำหรับการเสด็จประพาสของท่าน#! "
 tour_furniture_good:1 "เครื่องเรือนเกินจำเป็น"
 tour_furniture_good_desc:1 "$EFFECT_LIST_BULLET$ $tour_increase_success$\n$EFFECT_LIST_BULLET$ $tour_increase_prestige$\n\n#weak สิ่งประดิษฐ์และเฟอร์นิเจอร์เกือบทุกชิ้นที่ท่านเป็นเจ้าของจะถูกนำติดตัวไปในการเดินทางครั้งนี้เพื่อแสดงความมั่งคั่งอันมหาศาลของท่าน#! "
 tour_increase_success:1 "เพิ่มความสำเร็จเริ่มต้นของ [tour|E] ของท่าน"
 tour_increase_prestige:1 "ได้รับ [prestige|E]"

