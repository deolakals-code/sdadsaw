 ##### TOUR #####

 ### ACTIVITY
 activity_tour:0 "การเสด็จประพาส"
 activity_tour_desc:0 "จัด [tour|E] อันยิ่งใหญ่และเสด็จเยี่ยม [vassals|E] และดินแดนของพวกเขา แต่ละ [stop|E] จะมีระยะเวลา #bold 2 เดือน#!"
 activity_tour_selection_tooltip:1 "เดินทางข้ามอาณาจักรของท่านและเยี่ยมเยียนข้าในบังคับในการเสด็จประพาสอันยิ่งใหญ่\n\nรางวัลที่คาดว่าจะได้รับ:\n$BULLET_WITH_TAB$[control_i] [county_control|E]\n$BULLET_WITH_TAB$@domain_icon! [county_opinion|E]\n$BULLET_WITH_TAB$[legitimacy_i] ได้รับ [legitimacy|E]\n$BULLET_WITH_TAB$[stress_loss_i] ลด [stress|E]"
 activity_tour_host_desc:1 "$BULLET_WITH_TAB$@control_icon![county_control|E]\n$BULLET_WITH_TAB$@domain_icon![county_opinion|E]\n$BULLET_WITH_TAB$[legitimacy_i] ได้รับ [legitimacy|E]\n$BULLET_WITH_TAB$[stress_loss_i]ลด [stress|E]\n\nรางวัล [tour_success|E]:\n$BULLET_WITH_TAB$ระดับ #V 1#!: [prestige_i|E][prestige|E]\n$BULLET_WITH_TAB$ระดับ #V 2#!: [opinion|E] ของ [vassal|E] [GetVassalStance( 'parochial' ).GetTextIcon][GetVassalStance( 'parochial' ).GetName]\n$BULLET_WITH_TAB$ระดับ #V 3#!: [opinion|E] ของ [vassal|E] ที่ไปเยือน\n$BULLET_WITH_TAB$ระดับ #V 4#!: [GetModifier( 'itinerant_liege_modifier' ).GetNameWithTooltip|L] #weak ([character|E])#!\n$BULLET_WITH_TAB$ระดับ #V 5#!: [GetModifier( 'mega_itinerant_liege_modifier' ).GetNameWithTooltip|L] #weak ([character|E])#!"
 activity_tour_conclusion_characters_header:0 "ข้าในบังคับที่ไปเยือน"

 itinerant_liege_modifier:0 "เจ้าเหนือหัวผู้สัญจร"
 itinerant_liege_modifier_desc:0 "ตัวละครนี้จัด [tour|E] ที่ประสบความสำเร็จ"
 mega_itinerant_liege_modifier:0 "เจ้าเหนือหัวผู้ยิ่งใหญ่"
 mega_itinerant_liege_modifier_desc:0 "ตัวละครนี้จัด [tour|E] อันยิ่งใหญ่"
 activity_window_character_stop_host:1 "เจ้าภาพจุดแวะพัก\n[Character.GetShortUINameNoTooltip|U]"
 activity_tour_conclusion_desc:0 "[GetActivityType( 'activity_tour' ).GetName] ของท่านได้สิ้นสุดลงแล้ว"

 ### PHASES
 tour_phase_tour_grounds:2 "ตรวจตราพื้นที่"
 tour_phase_tour_grounds_desc:0 "[tour_the_grounds|E] ในที่ดินของ [vassal|E] ของท่าน เพิ่ม [control|E]"
 tour_phase_dinner:1 "งานเลี้ยงอาหารค่ำ"
 tour_phase_dinner_desc:0 "เพลิดเพลินกับ [hosted_dinner|E] ที่จัดโดยข้าในบังคับของท่าน เพิ่ม [opinion|E] กับ [vassal|E] ของท่าน"
 tour_phase_cultural_festival:1 "เทศกาลวัฒนธรรม"
 tour_phase_cultural_festival_desc:0 "เพลิดเพลินกับ [cultural_festival|E] ซึมซับวัฒนธรรมท้องถิ่น และเพิ่ม [county_opinion|E] และ [cultural_acceptance|E]"
 tour_phase_journey_home:0 "เดินทางกลับบ้าน"
 tour_phase_journey_home_desc:0 "เดินทางกลับสู่เมืองหลวงของท่าน เป็นการสิ้นสุดการเสด็จประพาส"
