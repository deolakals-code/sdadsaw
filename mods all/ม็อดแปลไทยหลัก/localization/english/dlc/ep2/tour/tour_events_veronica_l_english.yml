 cultural_festival.2090.t:0 "เข้าแถว!"
 cultural_festival.2090.desc:0 "ขณะที่ข้าดูการแสดงที่น่าเบื่อครั้งที่ห้าสิบที่ [ROOT.Char.GetCurrentLocation.GetNameNoTooltip] อันเน่าเหม็นนี้มีให้ ข้าพบว่าตัวเองปรารถนาให้นักเต้นทุกคนกระดูกหักทุกชิ้นที่เป็นไปได้และจากไปเสีย\n\nเดี๋ยวก่อน… #EMP ข้า#! สามารถส่งพวกเขาไปได้\n\nข้ากระแอมก่อนพูด: "เหล่าข้าแผ่นดินที่รักของข้า มีข้อมูลที่โชคร้ายที่สุดมาถึงหูข้าว่าพวกเจ้าได้กระทำการลักขโมยและทรยศทั่วดินแดนเหล่านี้""
 cultural_festival.2090.a:0 ""คงจะเป็นเรื่องน่าละอายหากมีใครลงโทษพวกเจ้าสำหรับอาชญากรรมเหล่านั้น...""
 cultural_festival.2090.b:0 ""นี่ไม่ใช่ชาวนาพวกเดียวกับที่ก่อกบฏต่อข้าหรือ? จับพวกมัน!""
 cultural_festival.2090.c:0 ""ปล่อยพวกเขาไป""
 festival_arrested_artists:0 "นักแสดงที่ถูกคุมขัง"
 festival_no_prisoners:0 "ไม่มีนักโทษ"
 festival_no_prisoners_desc:0 "ตัวละครนี้ไม่ได้คุมขังนักแสดงในเคาน์ตีระหว่างเทศกาลวัฒนธรรม"
 
 cultural_festival.2100.t:0 "การสนับสนุนจากสมาคมช่าง"
 cultural_festival.2100.desc:0 ""ดูนั่นสิ!" ข้าได้ยินขณะเดินไปตามถนนของ [ROOT.Char.GetCurrentLocation.GetNameNoTooltip] [inspired_courtier.GetFirstName] [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('inspired_courtier'))] ของข้ากำลังชี้ไปที่สิ่งที่ดูเหมือนจะเป็นที่รู้จักในนาม [guild_location.Custom('GetGuildType')] ของ [guild_location.GetCounty.GetFaith.WealthGodNamePossessive]; รอยยิ้มปรากฏขึ้นบนใบหน้าของ [inspired_courtier.GetHerHis] อย่างรวดเร็ว เปี่ยมสุข\n\nกลุ่มเด็กฝึกงานกำลังคุกเข่าอยู่หน้าโต๊ะทำงาน อาจารย์ใหญ่ดูแลงานฝีมือจากทับหลังประตู กอดอก เชิดคาง "เจ้าจะต้องใช้แรงอีกหน่อยนะ ลูกชาย"\n\n[inspired_courtier.GetFirstName] ก้าวไปในทิศทางของพวกเขา เคลิบเคลิ้มอย่างสมบูรณ์"
 cultural_festival.2100.a:1 "คนเหล่านี้ควรค่าแก่การช่วยเหลือ"
 cultural_festival.2100.b:1 "เราควรลงทุนในพ่อค้าที่บ้านเกิดด้วย..."
 cultural_festival.2100.c:0 ""ไปเถอะ [inspired_courtier.GetFirstNameNoTooltip] ไปเยี่ยมพวกเขา""
 cultural_festival.2100.c.success:0 "[inspired_courtier.GetShortUIName] พบอาชีพของ [inspired_courtier.GetHerHis]"
 cultural_festival.2100.c.failure:0 "[inspired_courtier.GetShortUIName] เกิดความสงสัย"
 discounted_guild_holding_build_cost_modifier:0 "การสร้างเมือง"
 
 cultural_festival.2110.t:0 "นักแสดงที่ไม่คาดคิด"
 cultural_festival.2110.desc.intro:0 "นักกายกรรมกระโดดในชุดหลากสีสัน หนึ่งในนั้นอ้าปากรับลูกบอลที่อีกคนโยนมาและสาธารณชนก็โห่ร้องด้วยความยินดี"
 cultural_festival.2110.desc.callous:0 "ช่างบันเทิงง่ายเสียนี่กระไร"
 cultural_festival.2110.desc.outro:0 "\n\nดนตรีตามมาในไม่ช้า ข้าเคยได้ยินเพลงนี้มาก่อน บางที เพลงส่วนใหญ่ฟังดูคล้ายกันเกินไป แม้จะอยู่บนเวที ข้าก็ได้ยินเสียงชาวบ้านร้องตามเสียงดัง\n\n“และเต้นรำในทุ่งนาแห่ง...” #EMP “โฮ่ง! โฮ่ง โฮ่ง!”#! ร่างหนึ่งตัดสินใจเข้าร่วม ขโมยลูกบอลโยนเล่นไป\n\n#EMP “จับหมาตัวนั้น!”#!"
 cultural_festival.2110.a:0 "ข้าอาจจะเอามันกลับไปด้วย..."
 cultural_festival.2110.b:0 "เพื่อนคู่ใจที่สมบูรณ์แบบสำหรับ [my_heir.GetFirstNameNoTooltip]!"
 cultural_festival.2110.c:0 "อ๊า... ข้าอดใจไม่ไหวที่จะลูบมัน!"
 cultural_festival.2110.d:0 "อ๊าก ช่างเป็นสัตว์ร้ายที่น่ารำคาญ"
 cultural_festival.2110.e:0 "ข้าต้องอยู่ในที่ของข้า"
 cultural_festival_2110_d_tt:0 "ท่านเตะสุนัข"
 cultural_festival_2110_d_opinion_tt:0 "ตัวละครที่เข้าร่วมทุกคนที่ไม่ใช่ใจดำหรือซาดิสม์"
 available_because_intent_tt: "#EMP #low ตัวเลือกนี้มีให้เนื่องจาก [intent|E] [THIS.Char.GetInvolvedActivityIntent.GetName|V] ของท่าน#!#!"
 
 #Tour Cultural Festival Events - Bilateral 
 cultural_festival.3000.t:0 "ละครอันยิ่งใหญ่"
 cultural_festival.3000.desc:0 "โอกาสอันยิ่งใหญ่ปรากฏขึ้นต่อหน้าข้าด้วยการมาเยือนของเจ้าเหนือหัวของข้า [visiting_liege.GetTitledFirstName] ข้าสามารถใช้การเผชิญหน้าอันเป็นโชคชะตานี้เพื่อเอาใจ [visiting_liege.GetHerHis] และอาจจะ ทำให้ได้สิ่งที่ข้าต้องการง่ายขึ้น...\n\nบางทีข้าอาจจะจัดละครที่แสดงถึงการกระทำอันยิ่งใหญ่ของ [visiting_liege.GetHerHis]? "
 cultural_festival.3000.a:0 "โอกาสอันสมบูรณ์แบบที่จะได้รับความโปรดปรานจากเจ้าเหนือหัวของข้า!"
 cultural_festival.3000.a.tt:0 "เจ้าเหนือหัวของท่านจะชื่นชมการแสดงที่ดี..."
 cultural_festival.3000.b:0 "ข้าจะไม่ใช้จ่ายทองกับเรื่องนี้"
 
 cultural_festival.3001.t:0 "ละครอันยิ่งใหญ่: คำชมเชย?"
 cultural_festival.3001.desc:0 "เวทีสำหรับการแสดงได้ถูกจัดเตรียมไว้แล้ว, ณ ใจกลางลานกว้าง พวงมาลาเฉลิมฉลองถูกแขวนไว้ตามเสา และเหล่านักแสดงกำลังเก็บรายละเอียดสุดท้ายของบท "แน่นอนอยู่แล้วว่า [visiting_liege.GetSheHe] ไม่มีวันชอบแอปเปิลหรอก, เจ้าโง่!" ข้าได้ยินนักประพันธ์บทละครบ่นกับนักแสดงนำ\n\nข้ารอ จนกระทั่งการซ้อมยุติลง และ [liege_actor.GetSheHe] ก็รีบเข้ามาหาข้าก่อนที่ข้าจะจากไป "[ROOT.Char.Custom('FormOfAddressForLiege')|U]!" [liege_actor.GetSheHe] ประสานมือ [liege_actor.GetHerHis] เข้าด้วยกัน, แทบจะอ้อนวอน, "ท่านพอจะมีข้อคิดเห็นใดๆ บ้างหรือไม่ว่าข้าควรสวมบทบาท [visiting_liege.GetTitledFirstNameNoTooltip] อย่างไรดี?""
 cultural_festival.3001.compassionate:0 ""หัวใจอันเมตตาของ [visiting_liege.GetShortUIName] ควรสะท้อนออกมาที่นี่""
 cultural_festival.3001.bold:0 ""[visiting_liege.GetShortUIName] กระทำการอย่างกล้าหาญเสมอ!""
 cultural_festival.3001.honorable:0 ""ไม่มีสิ่งใดสำคัญต่อ [visiting_liege.GetShortUIName] มากไปกว่าเกียรติยศ""
 cultural_festival.3001.greed:0 ""ความทะเยอทะยานของ [visiting_liege.GetShortUIName] ไม่มีที่สิ้นสุด!""
 cultural_festival.3001.rational:0 ""[visiting_liege.GetShortUIName] มีท่าทีสงบนิ่งอยู่เสมอ""
 cultural_festival.3001.zealous:0 ""สะท้อนให้เห็นว่า [visiting_liege.GetShortUIName] เป็น [visiting_liege.GetWomanMan] ที่เคร่งศาสนาเพียงใด!""
 cultural_festival.3001.energetic:0 ""จำไว้ว่า [visiting_liege.GetSheHe] พร้อมสำหรับการลงมือเสมอ!""
 cultural_festival.3001.forgiving:0 ""อย่าลืมแสดงความเมตตาอันยอดเยี่ยมของ [visiting_liege.GetHerHis]""
 cultural_festival.3001.beautiful:0 ""คนเราอาจเป็นลมได้เมื่อเห็นความงามของ [visiting_liege.GetHerHis]!""
 cultural_festival.3001.strong:0 ""ความแข็งแกร่งของร่างกาย [visiting_liege.GetHerHis] ไม่มีใครเทียบได้""
 cultural_festival.3001.extroverted:0 ""แสดงให้เห็นว่าทุกคนรักและชื่นชม [visiting_liege.GetHerHim] อย่างไร""
 cultural_festival.3001.dominant:0 ""สะท้อนรัศมีที่ครอบงำผู้คนของ [visiting_liege.GetSheHe]""
 cultural_festival.3001.negative:0 ""อันที่จริง — ชุดตัวตลกน่าจะเหมาะกับ [visiting_liege.GetHerHim] ดี...""
 cultural_festival.3001.tt:0 "#F การแสดงจะได้รับการตอบรับจาก [visiting_liege.GetTitledFirstName] ดีเพียงใดนั้นขึ้นอยู่กับว่ามันเหมาะสมกับ [visiting_liege.GetHerHim] เพียงใด#! "
 cultural_festival.3001.negative.flavor:0 "เจ้าเหนือหัวของข้าจะไม่ชอบ แต่ #EMP ข้า#! จะชอบ"
 dressed_liege_like_buffon_modifier:0 "ทั้งหมดเป็นเรื่องตลก"
 dressed_liege_like_buffon_modifier_desc:0 "ตัวละครนี้ตัดสินใจแสดงบทบาทเจ้าเหนือหัวของตนเป็นตัวตลกในละครเทศกาล"
 
 cultural_festival.3002.t:0 "ละครอันยิ่งใหญ่"
 cultural_festival.3002.desc.intro:0 "เวทีไม้ตั้งตระหง่านอยู่กลางจัตุรัส พวงมาลัยเทศกาลห้อยลงมาจากเสาและนักแสดงซ่อนตัวอยู่ด้านหนึ่ง หัวเราะคิกคัก พูดคุยกัน พวกเขาทั้งหมดเงียบลงทันทีที่ [stop_host_scope.GetTitledFirstName] เดินเข้ามา อกของ [stop_host_scope.GetHerHis] ผายขึ้น ภาคภูมิใจยิ่งนัก\n\n"ข้าขอประกาศว่าละครเพื่อเป็นเกียรติแก่แขกผู้มีเกียรติที่สุดของเรา [ROOT.Char.GetTitledFirstNameNoTooltip] กำลังจะเริ่มขึ้น โปรดเพลิดเพลิน!"\n\nเรื่องราวดำเนินต่อไปเรื่อยๆ พูดถึงถนนหนทางใน [ROOT.Char.GetCapitalLocation.GetTitle.GetNameNoTierNoTooltip] และการกระทำของข้า"
 cultural_festival.3002.desc.good:0 "ช่างเป็นการปลอบโยนที่ได้รับการยกย่อง เช่นนี้!"
 cultural_festival.3002.desc.neutral:0 "ไม่มีสิ่งใดน่าสนใจถูกบันทึกไว้"
 cultural_festival.3002.desc.bad:0 "ข้าไม่อยากจะเชื่อเลยว่านี่คือวิธีที่พวกเขาคิดว่าข้าจะทำ"
 cultural_festival.3002.desc.buffoon:0 "และนั่นคือข้า... แต่งตัวเหมือน #EMP ตัวตลก#!?"
 cultural_festival.3002.a:0 ""นี่คือคำชมเชยที่ดีที่สุดที่ข้าเคยได้รับ!""
 cultural_festival.3002.a.toast:0 "คำชมเชยที่ดีที่สุด"
 cultural_festival.3002.b:0 "อืม... ข้าเดาว่ามันอาจจะแย่กว่านี้ได้"
 cultural_festival.3002.b.toast:0 "ละครที่ให้ความบันเทิง"
 cultural_festival.3002.c:0 "พวกเขาเข้าใจข้า #EMP ผิด#! ไปได้อย่างไร!?"
 cultural_festival.3002.c.toast:0 "การแสดงที่ดูถูก"
 cultural_festival.3002.d.toast:0 "การแสดงที่แย่ที่สุด"
 cultural_festival.3002.d:0 "เจ้าคิดว่าเจ้ากำลังทำอะไรอยู่!?"
 cultural_festival.3002.e:0 "ข้าบอก [stop_host_scope.GetHerHim] ไม่ได้ว่าข้าคิดอย่างไรกับเรื่องนี้จริงๆ"
 cultural_festival.3002.e.toast:0 "[visiting_liege.GetTitledFirstName] ดูเหมือนจะเพลิดเพลินกับละคร"
 festival_good_play:0 "ละครดี"
 festival_neutral_play:0 "ละครปานกลาง"
 festival_bad_play:0 "ละครแย่"
 
 cultural_festival.3010.t:0 "น้ำพุอันน่าอัศจรรย์"
 cultural_festival.3010.desc:0 "ข้าเดินเล่นผ่านบริเวณปราสาทและหยุดที่น้ำพุ ใช้เวลาสักครู่สังเกตน้ำที่ไหลผ่านหินอ่อน แมวตัวหนึ่งเดินด้อมๆ มองๆ ในสวนที่ได้รับการดูแล ยืดหลังก่อนจากไป\n\nข้าสัมผัสลายนูนบนท่อเงิน — ตราประจำตระกูลของข้า ถ้าเพียง แต่... อา! ข้าสามารถสร้างความประทับใจให้ [visiting_liege.GetTitledFirstName] ได้หากข้า ทำให้มันไหลด้วยสารที่แตกต่างออกไป..."
 cultural_festival.3010.a:0 "[ROOT.Char.Custom('RegionalAlcoholicDrink')|U] แน่นอน!"
 cultural_festival.3010.b:0 "น้ำผลไม้อร่อยๆ น่าจะง่ายกว่า"
 cultural_festival.3010.c:0 "ไม่มีประโยชน์ที่จะเสียเวลากับเรื่องนี้"
 alcohol_fountain_modifier:0 "น้ำพุอันน่าอัศจรรย์"
 alcohol_fountain_modifier_desc:0 "ตัวละครนี้ตัดสินใจ ทำให้น้ำพุไหลด้วยแอลกอฮอล์แทนน้ำ"
 juice_fountain_modifier:0 "$alcohol_fountain_modifier$"
 juice_fountain_modifier_desc:0 "ตัวละครนี้ตัดสินใจ ทำให้น้ำพุไหลด้วยน้ำผลไม้แทนน้ำ"
 
 cultural_festival.3011.t:0 "น้ำพุอันน่าอัศจรรย์"
 cultural_festival.3011.desc.intro:0 "ข้าตาม [stop_host_scope.GetTitledFirstName] ไปขณะที่ [stop_host_scope.GetSheHe] นำทางข้าไปรอบๆ เทศกาล "และบัดนี้" [stop_host_scope.GetSheHe] ประกาศ ขณะที่เราเข้าสู่บริเวณปราสาท "สิ่งที่ข้าคาดว่าจะเป็นเรื่องน่าประหลาดใจที่น่ายินดี" ข้าเลิกคิ้วเมื่อเราพบน้ำพุอันน่าอัศจรรย์ ทั้งหมดเป็นหินสีขาว มีท่อเงินและไหลอย่างอุดมสมบูรณ์ด้วย..."
 cultural_festival.3011.desc.alcohol:0 "#EMP [stop_host_scope.Custom('RegionalAlcoholicDrink')]?!#!"
 cultural_festival.3011.desc.juice:0 "#EMP น้ำผลไม้?!#!"
 cultural_festival.3011.desc.outro:0 "\n\nผู้คนบางส่วนรวมตัวกันรอบๆ หัวเราะและโยนเหรียญลงไปในบ่อน้ำ"
 cultural_festival.3011.a:0 "มาดื่มด้วยกันเถอะ!"
 cultural_festival.3011.b:0 "คงจะเป็นการสิ้นเปลืองหากไม่อธิษฐาน!"
