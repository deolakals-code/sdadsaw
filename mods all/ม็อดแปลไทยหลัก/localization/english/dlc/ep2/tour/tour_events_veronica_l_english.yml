 cultural_festival.3040.t:0 "ดาบในศิลา"
 cultural_festival.3040.desc:0 "ข้าได้ยินเสียงที่คุ้นเคยขณะเดินเล่นไปตามถนนเทศกาลของ [ROOT.Char.GetCurrentLocation.GetNameNoTooltip]: "ข้าควรจะทำอย่างไรกับหินก้อนนี้ ห๊ะ? เจ้าต้องการให้ข้านั่งบนมันหรือ?"\n\n [marshal.Custom2('MyCharacterIntroduction', ROOT.Char)|U] กำลังชี้ไปที่ก้อนหินขนาดใหญ่ที่ช่างก่อสร้างทิ้งไว้หน้า [marshal.GetHerHim]\n\n"มันสำหรับการแข่งขันความแข็งแกร่ง" ช่างก่อสร้างอธิบาย พลางยักไหล่ "การแข่งขันความแข็งแกร่งอะไร? นี่มันยกไม่ได้!" [marshal.GetTitledFirstNameNoTooltip] โต้กลับ"
 cultural_festival.3040.a:0 ""เจ้าไม่ได้มีไว้ #EMP ยก#! มัน สหายข้า""
 cultural_festival.3040.flavor:0 "จะไม่มีใครสามารถดึงดาบออกจากศิลาได้!"
 cultural_festival.3040.a.tt:0 "@warning_icon! #X ท่านอาจสูญเสียสิ่งประดิษฐ์ล้ำค่านี้"
