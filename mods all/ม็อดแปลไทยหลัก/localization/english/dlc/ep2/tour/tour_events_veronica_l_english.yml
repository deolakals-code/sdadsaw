 cultural_festival.4301.desc:0 "ข้าถูกทักทายโดย [stop_host_scope.GetTitledFirstName] ที่ถือ "
 cultural_festival.4301.desc_artifact:0 "[gifted_artifact.GetName].$cultural_festival.4301.desc_inbetween$\n\nข้าซาบซึ้งที่ [stop_host_scope.GetSheHe] คิดถึงเรื่องนี้ $cultural_festival.4301.desc_end$"
 cultural_festival.4301.desc_gold:0 "ถุงเหรียญ.$cultural_festival.4301.desc_inbetween$\n\nข้ารับเหรียญอย่างยินดี แต่ดูเหมือนว่า [stop_host_scope.GetSheHe] ไม่รู้ว่าจะให้อะไรข้า? $cultural_festival.4301.desc_end$"
 cultural_festival.4301.desc_inbetween:0 "\n\n"เจ้าเหนือหัวของข้า ข้าได้รับเกียรติที่มีท่านอยู่ที่นี่ โปรดรับของขวัญนี้เพื่อเป็นการระลึกถึงเทศกาลวัฒนธรรมนี้ สิ่งที่จะเตือนให้เราระลึกถึงวันนี้ไปอีกหลายปี!""
 cultural_festival.4301.desc_end:0 "อย่างไรก็ตาม [stop_host_scope.GetSheHe] มองข้าด้วยความคาดหวัง ข้าเชื่อว่า [stop_host_scope.GetSheHe] คาดหวังให้ข้ามอบของขวัญตอบแทน?"
 cultural_festival.4301.a:0 "ของขวัญเลิศรส! ข้ารักมัน"
 cultural_festival.4301.a.tt:0 "ท่านสวมใส่ [gifted_artifact.GetName]"
 cultural_festival.4301.b:0 "ของไร้ประโยชน์ บางทีข้าอาจจะขายเป็นเศษเหล็กได้?"
 cultural_festival.4301.c:0 "ทองคำ? ช่างคิดเสียจริง"
 cultural_festival.4301.tt:0 "ท่านจะต้องเลือกของขวัญเพื่อแลกเปลี่ยน"
 cultural_festival.4302.t:1 "$cultural_festival.4300.t$"
 cultural_festival.4302.desc:0 "ข้าได้รับเกียรติจากของขวัญ อย่างไรก็ตาม เนื่องจากข้าต้องให้บางสิ่งตอบแทน ข้าควรคิดถึงสิ่งที่เหมาะสม เพื่อที่ข้าจะได้ไม่ดูเหมือนคนโง่! ข้าสามารถสั่งให้ใครสักคนไปเอา [newly_created_artifact.GetName] มาให้ข้า"
 cultural_festival.4302.desc_existing_artifact:0 "$cultural_festival.4300.desc_existing_artifact$"
 cultural_festival.4302.desc_gifted_gold:0 "บางที ข้าอาจจะเลือกทางที่ง่าย เหมือนกับ [stop_host_scope.GetTitledFirstNameNoTooltip] และให้ทองคำแก่ [stop_host_scope.GetHerHim]?"
 cultural_festival.4302.desc_gold:0 "ถึงกระนั้น ถุงเหรียญธรรมดาๆ เป็นของขวัญก็เป็นตัวเลือกที่ปลอดภัยเสมอ ใช่ไหม?"
