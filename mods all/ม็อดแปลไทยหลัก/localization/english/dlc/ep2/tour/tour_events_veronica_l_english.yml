 cultural_festival.3020.t:0 "เครื่องเตือนใจถึงความภักดี"
 cultural_festival.3020.desc:0 "ท้องฟ้าเหนือ [ROOT.Char.GetCurrentLocation.GetNameNoTooltip] มีเมฆมากและริ้วสีเทาของยามค่ำคืนเริ่มเคลื่อนตัวไปตามตรอกซอกซอยแคบๆ ป้อมปราการของ [stop_host_scope.GetTitledFirstNamePossessive] ตั้งตระหง่านอยู่บนยอดเขา เกือบจะท้าทาย [stop_host_scope.GetSheHe|U] ควรได้รับการเตือนใจว่า [stop_host_scope.GetSheHe] รับใช้ใคร\n\nข้าคือ [ROOT.Char.GetTitleAsNameNoTooltip] โดยสิทธิ์อันศักดิ์สิทธิ์ มงกุฎแขวนอยู่เหนือศีรษะข้าดุจดวงจันทร์เหนือดาวดวงอื่นทั้งหมด ไม่ว่าเจ้าจะส่องสว่างเพียงใด #EMP ข้า#! ก็ยังคงอยู่"
 cultural_festival.3020.a:0 "[stop_host_scope.GetFirstNameNoTooltip] จักต้องแสดงความสวามิภักดิ์ [stop_host_scope.GetHerHis] ต่อข้าอีกครั้ง"
 cultural_festival.3020.a.tt:0 "สิ่งนี้จะเป็นประโยชน์ต่อท่าน แต่ข้าในบังคับของท่านอาจไม่ชอบ..."
 cultural_festival.3020.b:0 "มาฉลองกันเถอะ!"
