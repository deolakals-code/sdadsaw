 cultural_festival.3041.c:0 "#EMP ใช่แล้ว!#! ออกมาซะ!"
 
 cultural_festival.3042.t:0 "$cultural_festival.3040.t$: การแสดงพลัง"
 cultural_festival.3042.desc.intro:0 "อา อยู่นี่แล้ว! ศิลาถูกวางไว้กลางเมือง ประดับด้วยตัวอักษรสีทองที่เขียนว่า "ผู้ใดดึงดาบเล่มนี้ออกจากศิลานี้ ผู้นั้นคือเจ้าของโดยชอบธรรม"\n\nข้าหันไปมอง [visiting_liege.GetTitledFirstName] ซึ่งแน่นอนว่าเป็นผู้ท้าชิงหลักสำหรับชัยชนะ อย่างไรก็ตาม... เมื่อ [visiting_liege.GetSheHe] พยายามดึงด้ามจับ อาวุธก็ไม่ขยับ"
 cultural_festival.3042.desc.failed:0 "\n\n"บัดซบ" ข้าได้ยิน [visiting_liege.GetSheHe] พึมพำ บางทีอาจถึงตาข้าที่จะลองท้าทายนี้?"
 cultural_festival.3042.desc.pretended:0 ""อา โชคไม่ดี" [visiting_liege.GetSheHe] กล่าว พยักหน้ามาทางข้า "ท่านอยากลองไหม สหายข้า?""
 cultural_festival.3042.a:0 "#EMP ข้า#! จะดึงมันออกจากศิลา!"
 cultural_festival.3042.b:0 "เหตุใดต้องเสี่ยงต่อความอับอายในที่สาธารณะ?"
 
 cultural_festival.3050.t:0 "การแสดงอันสงบเงียบ"
 cultural_festival.3050.desc:0 "กลุ่มชาวบ้านท้องถิ่นได้ขึ้นเวทีในสิ่งที่ดูเหมือนจะเป็นคำเทศนาที่ยาวนานและจืดชืดที่สุดที่ข้าเคยได้ยิน\n\nข้าพยายามลืมตา แต่ไม่นานกองหญ้าแห้งที่มุมถนนก็ดูสบายเกินไป เย้ายวนเกินไป..."
 cultural_festival.3050.a:0 "ข้า #EMP ต้อง#! ตื่นอยู่"
 cultural_festival.3050.b:0 "ข้าแค่พักสายตา..."
 cultural_festival.3050.b.tt:0 "มีโอกาสที่ [stop_host_scope.GetShortUIName] จะสังเกตเห็น..."
 festival_enjoyed_local_performance:0 "แสร้งสนใจเทศกาล"
 
 cultural_festival.3051.t:0 "เงียบเกินไป..."
 cultural_festival.3051.desc:0 "ขณะที่กลุ่มชาวบ้านท้องถิ่นขึ้นเวที ข้าฟังคำพูดของพวกเขาด้วยความยินดีและเกรงขาม ถ้าเพียง แต่ข้ารู้ว่าเรามีผู้มีความรู้ เช่นนี้ใน [ROOT.Char.GetCurrentLocation.GetNameNoTooltip]! ช่างเข้มแข็งอะไร เช่นนี้! ช่างน่าหลงใหล!\n\nขณะที่ข้าหันไปหา [visiting_liege.GetTitledFirstName] เพื่อแสดงความคิดเห็นเกี่ยวกับคำสอนของพวกเขา ข้าพบว่าดวงตาของ [visiting_liege.GetHerHis]... ปิดอยู่? นั่นเสียง #EMP กรน#! ที่ข้าได้ยินหรือ?"
 cultural_festival.3051.a:0 "[visiting_liege.GetSheHe] พบว่าสิ่งนี้น่าเบื่อได้อย่างไร!?"
 cultural_festival.3051.a.toast:0 "[stop_host_scope.GetShortUIName] เห็นท่านหลับ"
 cultural_festival.3051.b:0 "บางทีนี่อาจไม่ใช่สำหรับทุกคน..."
 
 cultural_festival.3060.t:0 "ขอข้า...?"
 cultural_festival.3060.desc.intro:0 "เสียงขลุ่ยและกลองตามมาอย่างรวดเร็วด้วยกลุ่มแขกที่เต้นรำ ทุกคนเคลื่อนไหวตามเสียงเพลงอย่างสนุกสนานและหัวเราะ คู่หนึ่งแอบเข้าไปในตรอก เด็กๆ กระโดดเป็นวงกลม ชายชราคนหนึ่งพยายามขยับสะโพกอย่างยากลำบาก\n\n"
 cultural_festival.3060.desc.spouse:0 "ข้าหันไปหาคู่ครองของข้า [my_spouse.GetTitledFirstName] และชื่นชมรอยยิ้มอันอ่อนโยนของ [my_spouse.GetHerHis] ปรบมือตามจังหวะดนตรี"
 cultural_festival.3060.desc.vassal:0 "ข้าเห็น [stop_host_scope.GetTitledFirstName] ท่ามกลางฝูงชน และข้างๆ เขา หนึ่งใน [vassal_spouse.GetWomenMen] ที่สวยที่สุดที่ข้าเคยเห็น..."
 cultural_festival.3060.a:1 ""ขอข้าได้ไหม [my_spouse.GetFirstNameNoTooltip] ที่รักของข้า?""
 cultural_festival.3060.b:2 "การเต้นรำกับคู่ครองของ [stop_host_scope.GetTitledFirstNameNoTooltip] จะ ทำให้เกิดความวุ่นวาย..."
 cultural_festival.3060.b.success:0 "การเต้นรำของท่านยั่วยวน [vassal_spouse.GetShortUIName]"
 cultural_festival.3060.b.failure:0 "[vassal_spouse.GetShortUIName] ไม่ประทับใจในการเต้นรำของท่าน"
 cultural_festival.3060.b.tt:0 "[stop_host_scope.GetShortUIName] อาจไม่ชอบสิ่งนี้..."
 cultural_festival.3060.c:0 "ข้าสามารถใช้โอกาสนี้เต้นรำกับชาวบ้านท้องถิ่นได้"
 cultural_festival.3060.d:0 "อึก #EMP การเต้นรำ#!."
 festival_danced_with_local_modifier:0 "เข้าร่วมการเต้นรำท้องถิ่น"
 
 cultural_festival.3061.t:0 "คู่เต้นรำ"
 cultural_festival.3061.desc:0 "ข้าปรบมือตามจังหวะเพลง แต่หยุดเมื่อเห็น [visiting_liege.GetTitledFirstName] เข้ามาหาเรา "ท่านคือ...?" ข้าเริ่ม แต่ไม่ใช่ข้าที่ [visiting_liege.GetSheHe] ดูเหมือนจะสนใจ เนื่องจาก [visiting_liege.GetSheHe] ส่งคำเชิญของ [visiting_liege.GetHerHis] ไปยังคู่ครองของข้า: "ท่านจะให้เกียรติข้าด้วยการเต้นรำได้หรือไม่?""
 cultural_festival.3061.a:0 "นี่เป็นการดูหมิ่นเกียรติของข้า!"
 cultural_festival.3061.a.toast:0 "เกียรติที่ถูกดูหมิ่น"
 cultural_festival.3061.b:0 "และใครเล่าจะไม่เลือก [vassal_spouse.GetHerHim]!"
 festival_flattered_spouse_modifier:0 "การยกยอในที่สาธารณะ"
 festival_flattered_spouse_modifier_desc:0 "ตัวละครนี้ชมเชยคู่ครองของตนในที่สาธารณะด้วยท่าทีที่น่าหลงใหล"
 
 cultural_festival.3070.t:0 "เทศกาลคนโง่"
 cultural_festival.3070.desc:0 "ความคิดหนึ่งเข้ามาในหัวข้าเหมือนกิ่งไม้หักหลังจากได้ยินเสียงระฆังดัง: เทศกาลคนโง่! โลกกลับหัวที่คนบาปเป็นนักบวชและเราทุกคนต่างสนุกสนานและเมามายเป็นเวลาหลายวัน!\n\nอา แต่จะให้ใครเป็น [ROOT.Char.GetFaith.BishopNeuter|U] แห่งคนโง่ของข้า...? [rival_jester.GetTitledFirstName]? ข้าไม่เคยชอบ [rival_jester.GetHerHim] เลยแม้ แต่น้อย หรือบางที [sinful_jester.GetTitledFirstName] วิถีทางอันบาปหนาของ [sinful_jester.GetHerHis] เป็นที่รู้จักกันดีโดยทุกคน"
 cultural_festival.3070.a:0 "[rival_jester.GetShortUINameNoTooltip] สมควรได้รับเกียรตินี้"
 cultural_festival.3070.b:0 "ใครจะดีไปกว่า [sinful_jester.GetShortUINameNoTooltip]?"
 cultural_festival.3070.c:0 "หรือบางที, แขกผู้มาเยือนของเรา [visiting_liege.GetTitledFirstNameNoTooltip]...?"
 cultural_festival.3070.d:0 "ศาสนจักรจะไม่มีวันรับรองสิ่ง เช่นนี้"
 festival_feast_of_fools_county_modifier:0 "เทศกาลคนโง่"
 festival_king_of_fools_modifier:0 "สังฆราชแห่งคนโง่"
 festival_feast_of_fools_county_modifier_desc:0 "เคาน์ตีนี้อนุญาตให้มีการเฉลิมฉลองเทศกาลคนโง่ ซึ่งมีการล้อเลียนพิธีกรรมทางศาสนา"
 
 cultural_festival.3071.t:0 "$cultural_festival.3070.t$"
 cultural_festival.3071.desc.intro:0 "ความสนุกสนาน! ความสุข! ขณะที่ข้าเข้าสู่จัตุรัสหลักของ [ROOT.Char.GetCurrentLocation.GetNameNoTooltip] ข้าเห็นกลุ่มร่างที่ แต่งกายเหมือนนักบวช กำลังร้องเพลงและเต้นรำ"
 cultural_festival.3071.desc_jester:0 "ตรงกลาง หุ่นจำลองถือชุดครึ่ง [ROOT.Char.GetFaith.BishopNeuter] ครึ่งตัวตลก พร้อมที่จะสวมใส่ [stop_host_scope.GetTitledFirstName|U] ปรบมือของ [stop_host_scope.GetHerHis] จากเวที หัวเราะอย่างชั่วร้าย: "และนี่คือ [ROOT.Char.GetTitledFirstName] — $nick_monarch_of_fools_masc$ ของเรา! ฟังเถิด สหายทั้งหลาย เพราะวิถีทางอันบาปหนาของ [ROOT.Char.GetHerHis] ไม่มีที่สิ้นสุด และบัดนี้อำนาจที่จะบังคับใช้มันเป็นของ [ROOT.Char.GetHersHis]!""
 cultural_festival.3071.desc_fallback:0 "ตรงกลาง — [final_jester.GetWomanMan] ครึ่ง [ROOT.Char.GetFaith.BishopNeuter] ครึ่งตัวตลก เป็นประธานเหนือฝูงชน\n\n[stop_host_scope.GetTitledFirstName] ปรากฏตัว ปรบมือของ [stop_host_scope.GetHerHis] ด้วยความยินดี: "บัดนี้ฟังเถิด สหายทั้งหลาย เนื่องจาก [final_jester.GetTitledFirstName] คือ $nick_monarch_of_fools_masc$ ของเรา และเจตจำนงของ [final_jester.GetHerHis] คือกฎหมาย และเสียงของ [final_jester.GetHerHis] คือเสียงของพระเจ้า เราคาดหวังความสุข #EMP อันบาปหนา#! แบบใดจาก [final_jester.GetHerHim] ได้บ้าง?""
 cultural_festival.3071.a:0 ""ข้าแทบรอไม่ไหวที่จะค้นพบ!""
 cultural_festival.3071.b:0 ""เทศกาลที่ดูหมิ่นศาสนา เช่นนี้ไม่มีที่อยู่ในอาณาจักรของข้า""
 cultural_festival.3071.c:0 ""ฮ่า! #EMP จ้างแล้ว#!""
 cultural_festival.3071.d:0 ""เจ้ากล้าพยายามแสดงบทบาทข้าเป็นคนโง่ได้อย่างไร!?""

 cultural_festival.4000.t:0 "สำเนียงแปลกๆ"
 cultural_festival.4000.desc:0 "ทันใดนั้น ข้าพบว่าตัวเองถูกแยกออกจากขบวนผู้ติดตามด้วยฝูงชนจำนวนมากที่เบียดเสียดเข้ามาเพื่อสังเกตการณ์เทศกาลที่กำลังดำเนินอยู่ และก่อนที่ข้าจะทันได้ตอบสนอง ข้าก็ติดอยู่ระหว่างคนสองคนที่กำลังสนทนากันอย่างเผ็ดร้อน\n\nอย่างไรก็ตาม ข้าไม่เข้าใจสิ่งที่พวกเขากำลังพูดเลย และ [local_character_scope.GetTitledFirstName] ก็เริ่มพูดกับข้าโดยตรง ข้าพยายามทำตัวกลมกลืน แต่ [local_translator_scope.GetTitledFirstName] กำลังเหลือบมองข้า\n\nข้าควรจะพูดอะไรตอบกลับไป ภาษาของพวกเขาน่าสนใจ บางทีข้าอาจจะเรียนรู้จากที่นี่ได้?"
 cultural_festival.4000.a:0 "ข้าไม่เข้าใจ แต่ข้าต้องการให้ [local_translator_scope.GetNameNoTooltip] สอนข้า!"
 cultural_festival.4000.b:0 "พยักหน้าและยิ้ม..."
 cultural_festival.4000.b.success:0 "ไม่มีใครสังเกตเห็นว่าข้าไม่เข้าใจอะไรเลย"
 cultural_festival.4000.b.failure:0 "[local_translator_scope.GetNameNoTooltip] จับได้ว่าข้าไม่เข้าใจ"
 cultural_festival.4000.c:0 "อันที่จริง มันสับสนเกินไปสำหรับข้า"
 cultural_festival.4100.t:0 "ท่าทางหยาบคาย"
 cultural_festival.4100.desc:0 "ข้าไม่อยากจะเชื่อสายตาตัวเองเมื่อ [inconsiderate_character_scope.GetTitledFirstName] เริ่มทำท่าทางใส่ [offended_character_scope.GetTitledFirstName] ซึ่งถือว่าเป็นการดูถูกอย่างสูงในวัฒนธรรม [offended_character_scope.GetCulture.GetName]!\n\n[offended_character_scope.GetNameNoTooltip] ตะโกนและเรียกชื่อ [inconsiderate_character_scope.GetTitledFirstName] อย่างหยาบคาย ขณะที่คนของ [offended_character_scope.GetHerHis] รั้ง [offended_character_scope.GetHerHim] ไว้ ดูเหมือนว่า [offended_character_scope.GetSheHe] จะไม่สงบลงด้วยตัวเอง ข้าต้องทำอะไรบางอย่างเพื่อคลายความตึงเครียด"
 cultural_festival.4100.a:0 "เดี๋ยวก่อน มันเป็นแค่ความเข้าใจผิด"
 cultural_festival.4100.a.success:0 "ท่านโน้มน้าว [offended_character_scope.GetNameNoTooltip] ได้สำเร็จ"
 cultural_festival.4100.a.failure:0 "[offended_character_scope.GetNameNoTooltip] ไม่ถูกโน้มน้าว"
 cultural_festival.4100.b:0 "ข้าควรตำหนิ [inconsiderate_character_scope.GetNameNoTooltip] ในที่สาธารณะ!"
 cultural_festival.4100.c:0 "บางทีข้าสามารถเสนอค่าชดเชยเป็นทองคำได้"
 cultural_festival.4200.t:1 "เตรียมขบวนแห่"
 cultural_festival.4200.desc:0 "ตั้งแต่แขกมาถึง [ROOT.Char.GetCurrentLocation.GetName] พวกเขามีกิจกรรมและสิ่งที่น่าสนใจมากมายให้ทำ อย่างไรก็ตาม ข้าไม่ควรพักผ่อนแม้ แต่วินาทีเดียวเพื่อสร้างความบันเทิงให้พวกเขา ดังนั้นข้าจึงคิดที่จะทำอะไรพิเศษสำหรับ [visiting_liege.GetTitledFirstName] และขบวนผู้ติดตามของ [visiting_liege.GetHerHis] ขบวนแห่ที่จะ ทำให้แน่ใจว่าพวกเขาได้รับการต้อนรับและแสดงอาณาจักรของเราในแง่มุมที่ดีที่สุดในเวลาเดียวกัน\n\nถึงกระนั้น ข้าไม่แน่ใจว่าขบวนแห่แบบไหนที่จะ ทำให้ [visiting_liege.GetNameNoTooltip] พอใจ?"
 cultural_festival.4200.a:0 "ข้าจะแสดงแสนยานุภาพทางทหารของเรา!"
 cultural_festival.4200.tt.liege_likes:0 "เจ้าเหนือหัวของท่านน่าจะ #P เพลิดเพลิน#! กับมัน"
 cultural_festival.4200.tt.liege_indifferent:0 "เจ้าเหนือหัวของท่านน่าจะโอเคกับมัน"
 cultural_festival.4200.tt.liege_dislikes:0 "เจ้าเหนือหัวของท่านน่าจะ #X เกลียด#! มัน"
 cultural_festival.4200.b:0 "มา ทำให้มันเกี่ยวกับผู้คนของเรากันเถอะ"
 cultural_festival.4200.c:0 "ข้าชอบประสบการณ์ทางจิตวิญญาณ"
 cultural_festival.4201.t:1 "[stop_host_scope.Custom('GetParadeType')|U]"
 cultural_festival.4201.desc:0 "การตัดสินใจของข้าที่จะทำ [stop_host_scope.Custom('GetParadeType')] ทำให้ต้อง แต่งตั้ง [coordinator_scope.GetTitledFirstName] เป็นผู้ประสานงานขบวนแห่และปรึกษา [coordinator_scope.GetHerHim] เกี่ยวกับวิธีการเตรียมงาน [coordinator_scope.GetSheHe|U] ครุ่นคิดอยู่ครู่หนึ่ง จากนั้นตอบกลับด้วยตัวเลือกสองสามอย่าง:\n\n"
 cultural_festival.4201.desc_military:0 "$cultural_festival.4201.desc$"เราสามารถเชิญอัศวินที่ดีที่สุดในอาณาจักรของเราและทำการรบเต็มรูปแบบ หรือบางที นำเสนอกองทหารและกองรักษาการณ์จาก [ROOT.Char.GetCurrentLocation.GetName] อย่างเต็มกำลัง ประลองกันที่จัตุรัสหลัก""
 cultural_festival.4201.desc_civil:0 "$cultural_festival.4201.desc$"เราสามารถเชิญชาวนาและช่างฝีมือที่ดีที่สุดในอาณาจักรของเราและแสดงผลงานฝีมือของพวกเขา หรือบางที รวบรวมชาวบ้านท้องถิ่นเพื่อนำเสนอแรงงานของพวกเขาและมุ่งเน้นไปที่ [ROOT.Char.GetCurrentLocation.GetName] อันเป็นที่รักของเรา""
 cultural_festival.4201.desc_religious:0 "$cultural_festival.4201.desc$"เราสามารถเชิญผู้ศรัทธาที่เคร่งครัดที่สุดของ [ROOT.Char.GetFaith.GetName] และ [stop_host_scope.GetFaith.PriestNeuterPlural] มาสวดมนต์ หรือบางที จัดการนมัสการ [ROOT.Char.GetFaith.HighGodName] อันเป็นที่รักของเรากับผู้คนจาก [ROOT.Char.GetCurrentLocation.GetName]""
 cultural_festival.4201.desc_end:0 "\n\nเหล่านั้นเป็นแนวคิดที่ดี อย่างไรก็ตาม ข้าเป็นผู้ตัดสินใจขั้นสุดท้าย"
 cultural_festival.4201.a.military:0 "นำอัศวินและยุทโธปกรณ์ที่ดีที่สุดในอาณาจักรของเรามา!"
 cultural_festival.4201.a.civil:0 "นำช่างฝีมือที่ดีที่สุดในอาณาจักรของเรามา!"
 cultural_festival.4201.a.religious:0 "นำผู้ศรัทธาและ [stop_host_scope.GetFaith.PriestNeuterPlural] ที่เคร่งครัดที่สุดในอาณาจักรของเรามา!"
 cultural_festival.4201.b:0 "ใช้สิ่งที่เรามีอยู่"
 cultural_festival.4201.c:0 "มาทำอะไรที่ง่ายกว่านี้กันเถอะ"
 cultural_festival.4202.t:0 "$cultural_festival.4201.t$"
 cultural_festival.4202.desc:0 "[coordinator_scope.GetTitledFirstName] เชิญข้าเข้าร่วม [stop_host_scope.Custom('GetParadeType')] [coordinator_scope.GetSheHe|U] รับรองกับข้าว่า [stop_host_scope.GetTitledFirstName] ดูแลการเตรียมการ เพื่อให้ข้าได้ขบวนแห่ที่ดีที่สุดที่ [cultural_festival_scope.GetName] สามารถนำเสนอได้ ขณะที่ [coordinator_scope.GetSheHe] พูด,"
 cultural_festival.4202.desc_military_best:0 "$cultural_festival.4202.desc$ อัศวินที่ดีที่สุดในอาณาจักรเริ่มต่อสู้ พวกเขาสลับเป้าหมายและเคลื่อนไหวอย่างคล่องแคล่วราวกับกำลังเต้นรำ และเสียงดาบกระทบเกราะของพวกเขารู้สึกเหมือนดนตรี\n\nช่างเป็นภาพที่น่าชม และข้าต้องยอมรับกับ [coordinator_scope.GetNameNoTooltip] ว่านี่เป็นขบวนแห่ที่ดีที่สุดที่ข้าเคยเห็น!"
 cultural_festival.4202.desc_military_good:0 "$cultural_festival.4202.desc$ กองทหารที่ติดอาวุธครบครันต่อสู้กันที่จัตุรัสหลักของ [cultural_festival_scope.GetNameNoTierNoTooltip]\n\nเป็นการแสดงทักษะการต่อสู้ที่น่าประทับใจอย่างแน่นอน"
 cultural_festival.4202.desc_military_worst:0 "$cultural_festival.4202.desc$ ทหารไม่กี่คนประลองกัน ดูเหมือนว่านี่คือทั้งหมดที่ข้าจะได้เห็นในวันนี้ ซึ่งน่าเสียดาย เพราะมัน ทำให้ข้าเบื่อแล้ว ข้าอยากจะดูม้ากินหญ้ามากกว่าใช้เวลาดูสิ่งนี้นานกว่านี้ ข้าไม่แน่ใจว่า [stop_host_scope.GetNameNoTooltip] คิดว่านั่นเป็นความคิดที่ดีได้อย่างไร?"
 cultural_festival.4202.desc_civil_best:0 "$cultural_festival.4202.desc$ ช่างฝีมือที่รวบรวมมาจากทั่วอาณาจักรแสดงผลงานฝีมือที่ดีที่สุดของพวกเขา\n\n ข้าไม่เคยเห็นผลิตภัณฑ์ที่มีคุณภาพ เช่นนี้มาก่อน ผู้คนจาก [visiting_liege.GetPrimaryTitle.GetNameNoTooltip] มีพรสวรรค์อย่างแท้จริง"
 cultural_festival.4202.desc_civil_good:0 "$cultural_festival.4202.desc$ ช่างฝีมือจาก [cultural_festival_scope.GetNameNoTierNoTooltip] แสดงผลงานฝีมือที่ดีที่สุดของพวกเขา\n\n ข้าไม่เคยเห็นผลิตภัณฑ์ที่มีคุณภาพ เช่นนี้มาก่อน ข้าประหลาดใจที่เรื่องนี้ไม่ได้รับความสนใจจากข้าเร็วกว่านี้ ผู้คนจาก [cultural_festival_scope.GetNameNoTierNoTooltip] มีพรสวรรค์อย่างแท้จริง"
 cultural_festival.4202.desc_civil_worst:0 "$cultural_festival.4202.desc$ ชาวบ้านท้องถิ่นสองสามคนแสดงผลงานฝีมือบางประเภท\n\nไม่มีอะไรที่ข้าไม่เคยเห็นมาก่อน ข้าค่อนข้างผิดหวังจริงๆ"
 cultural_festival.4202.desc_religious_best:0 "$cultural_festival.4202.desc$ กลุ่ม [stop_host_scope.GetFaith.PriestNeuterPlural] ที่รวมตัวกันในจัตุรัสหลักกำลังสวดมนต์ด้วยความเข้มข้นที่ไม่มีใครเทียบได้"
 cultural_festival.4202.desc_religious_good:0 "$cultural_festival.4202.desc$ [stop_host_scope.GetFaith.DevoteeNeuterPlural] ท้องถิ่นกำลังสวดมนต์ในจัตุรัสหลัก แสดงความเคารพต่อ [stop_host_scope.GetFaith.HighGodName]"
 cultural_festival.4202.desc_religious_worst:0 "$cultural_festival.4202.desc$ กลุ่มชาวบ้านท้องถิ่นสวดมนต์ถึง [stop_host_scope.GetFaith.HighGodName] ด้วยเสียงราบเรียบ\n\nเป็นประสบการณ์ที่น่าเบื่ออย่างแท้จริง"
 cultural_festival.4202.desc_religious_different_faith_good:0 "\n\nข้าไม่คุ้นเคยกับศาสนา [stop_host_scope.GetFaith.GetName] อย่างไรก็ตาม ความศรัทธาของพวกเขาน่าประทับใจ"
 cultural_festival.4202.desc_religious_same_faith_good:0 "\n\nเป็นเรื่องดีที่ได้เห็นว่าผู้คนจาก [cultural_festival_scope.GetNameNoTierNoTooltip] ศรัทธาในศาสนาของเรามาก"
 cultural_festival.4202.desc_religious_different_faith_bad:0 "\n\nข้าไม่คุ้นเคยกับศาสนา [stop_host_scope.GetFaith.GetName] อย่างไรก็ตาม ความศรัทธาของพวกเขาน่ากลัว"
 cultural_festival.4202.desc_religious_same_faith_bad:0 "\n\nน่าเสียดายที่ได้เห็นว่า [stop_host_scope.GetNameNoTooltip] ดูเหมือนจะไม่ศรัทธาในศาสนาของเราเท่าที่ข้าคิด"
 cultural_festival.4202.a.revelry:0 "นี่เป็นขบวนแห่ที่ดีที่สุดที่ข้าเคยเห็น!"
 cultural_festival.4202.a:0 "ข้าสามารถเรียนรู้บางสิ่งจาก [stop_host_scope.GetTitledFirstNameNoTooltip] ได้"
 cultural_festival.4202.b:0 "อันที่จริง ข้าอยากจะเห็น [stop_host_scope.Custom('GetLiegeParadeType')] มากกว่า"
 cultural_festival.4203.t:0 "$cultural_festival.4201.t$"
 cultural_festival.4203.desc:0 "หลังขบวนแห่ ข้าพบกับ [coordinator_scope.GetTitledFirstName] เพื่อสอบถามเกี่ยวกับปฏิกิริยาของ [visiting_liege.GetTitledFirstName]\n\n"เจ้าเหนือหัวของข้า"
 cultural_festival.4203.desc_success:0 "$cultural_festival.4203.desc$ ข้าตื่นเต้นที่จะแจ้งให้ท่านทราบว่า [visiting_liege.GetTitledFirstNameNoTooltip] พอใจกับขบวนแห่มาก [visiting_liege.GetSheHe|U] ถึงกับถามเกี่ยวกับการแบ่งปันขนบธรรมเนียมระหว่างอาณาจักรของเรา เพื่อที่ [visiting_liege.GetSheHe] จะสามารถนำพวกเขากลับไปยังเมืองหลวงใน [visiting_liege.GetCapitalLocation.GetTitle.GetNameNoTier] ได้"\n\nเป็นเรื่องดีที่ได้รับการชื่นชม"
 cultural_festival.4203.desc_failure:0 "$cultural_festival.4203.desc$ ข้าเกรงว่า [visiting_liege.GetTitledFirstNameNoTooltip] จะพบว่าขบวนแห่น่าเบื่อ [visiting_liege.GetSheHe|U] กล่าวว่า [visiting_liege.GetSheHe] อยากจะดูม้ากินหญ้าหรือดู [stop_host_scope.Custom('GetLiegeParadeType')] มากกว่า"\n\nช่างเป็นไอ้สารเลวที่ไม่รู้จักบุญคุณ!"
