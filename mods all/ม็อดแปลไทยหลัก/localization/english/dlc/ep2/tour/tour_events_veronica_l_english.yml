 cultural_festival.4312.desc:0 "[gift_receiver.GetTitledFirstName] ครุ่นคิดอยู่ครู่หนึ่งหลังจากถูกถามเกี่ยวกับของขวัญ\n\n"
 cultural_festival.4312.desc.decoy_gift:0 ""โอ้ ใช่ ข้าจำได้ราวกับว่ามันเกิดขึ้นเมื่อวาน! ท่านให้ [decoy_gift.GetName] แก่ข้า ข้ายังมีมันอยู่กับตัว ท่านต้องการจะถือมันไหม?"\n\n[gift_receiver.GetSheHe|U] ดูมั่นใจมาก ขณะที่ [gift_receiver.GetSheHe] สั่งให้คนของ [gift_receiver.GetHerHis] นำของขวัญมาอย่างรวดเร็ว"
 cultural_festival.4312.desc.decoy_gift_succeeded:0 "$cultural_festival.4312.desc.decoy_gift$ อย่างไรก็ตาม มีบางอย่างรู้สึกผิดปกติเกี่ยวกับมัน ข้ายังไม่แน่ใจว่าคืออะไร?"
 cultural_festival.4312.desc.decoy_gift_failed:0 "$cultural_festival.4312.desc.decoy_gift$ อย่างไรก็ตาม นั่นมันไร้สาระ! และเป็นการโกหกที่โจ่งแจ้ง ข้าจำของขวัญที่ข้าให้ได้อย่างแม่นยำ [gift_receiver.GetSheHe] จะหลอกข้าแบบนั้นไม่ได้"
 cultural_festival.4312.desc.no_gift:0 ""ข้าเกรงว่าข้าไม่รู้ว่าท่านกำลังพูดถึงอะไร [giving_gift_memory_owner.GetNameNoTooltip]? บางทีท่านอาจจะจำข้าผิดคน เพราะเราไม่เคยแลกเปลี่ยนของขวัญใดๆ กันเลย"\n\n"
 cultural_festival.4312.desc.no_gift_succeeded:0 "$cultural_festival.4312.desc.no_gift$ดูเหมือนว่าข้าไม่เคยให้ของขวัญใดๆ แก่ [gift_receiver.GetHerHim]? เมื่อครู่ที่แล้วข้าสาบานได้ว่าเราแลกเปลี่ยนของขวัญกันระหว่างเทศกาลก่อนหน้านี้ [gift_receiver.GetSheHe|U] ดูมั่นใจมากว่าไม่มีเรื่อง เช่นนั้นเกิดขึ้นที่นี่ บางที ข้าอาจจะผิด?"
 cultural_festival.4312.desc.no_gift_failed:0 "[gift_receiver.GetSheHe|U] อ้างว่าข้าไม่เคยให้อะไร [gift_receiver.GetHerHim] เลย นั่นมันไร้สาระ! และเป็นการโกหกที่โจ่งแจ้ง ข้าจำของขวัญที่ข้าให้ได้อย่างแม่นยำ [gift_receiver.GetSheHe] จะหลอกข้าแบบนั้นไม่ได้"
 cultural_festival.4312.desc.liege_lost_gift:0 ""ด้วยใจที่หนักอึ้ง ข้าต้องยอมรับกับท่านว่าข้าทำหายไปนานแล้ว โปรดยกโทษให้ข้าด้วย"\n\nดูเหมือนว่าข้า ทำให้ [gift_receiver.GetHerHim] ตกอยู่ในสถานการณ์ที่น่าอึดอัด มันเป็นเวลาหลายปีแล้วและข้าไม่โทษ [gift_receiver.GetHerHim] ที่ทำหาย ข้าไม่แน่ใจด้วยซ้ำว่าข้าคาดหวังอะไร?"
 cultural_festival.4312.desc.show_real_gift_flag:0 ""ใช่ ข้าจำได้ว่ามันคือ [old_gift.GetName]! ข้าเชื่อว่าข้าควรจะยังมีมันอยู่กับตัวถ้าท่านต้องการจะดู?"\n\n[gift_receiver.GetSheHe|U] นำเสนอ [old_gift.GetNameNoTooltip] อย่างภาคภูมิใจ ดูเหมือนว่า [gift_receiver.GetSheHe] ดูแลมันเป็นอย่างดี"
 cultural_festival.4312.a:0 "[gift_receiver.GetHerHim] ช่างใจดีเสียนี่กระไร ข้าซาบซึ้งจริงๆ"
 cultural_festival.4312.a.decoy_success:0 "โอ้ นี่ต้องเป็นของขวัญแน่ๆ ใช่ไหม?"
 cultural_festival.4312.b.decoy_success_holup:0 "เดี๋ยวก่อน นั่นไม่ใช่ของขวัญของข้า!"
 cultural_festival.4312.b.decoy_fail:0 "ช่างกล้า! นี่ไม่ใช่ของขวัญของข้า!"
 cultural_festival.4312.b.nogift_success_holup:0 "เป็นไปไม่ได้ ข้ามั่นใจว่าข้าให้ของขวัญแก่ [gift_receiver.GetHerHim]!"
 cultural_festival.4312.b.nogift_fail:0 "ช่างกล้า! ข้ารู้ว่าข้าให้ของขวัญแก่ [gift_receiver.GetHerHim]!"
 cultural_festival.4312.b.holup:0 "ข้อแก้ตัวที่แย่มาก [ROOT.Char.Custom2('RelationToMe', gift_receiver )] ที่รักของข้า"
 cultural_festival.4312.c:0 "บางทีข้าสามารถใช้มันต่อต้าน [gift_receiver.GetHerHim] ได้?"
 cultural_festival.4312.d:0 "ช่างโชคร้ายเสียนี่กระไร"
 cultural_festival.4312.d.nogift_success:0 "หืม ข้าเดาว่าข้ากำลังคิดถึงคนอื่นอยู่?"

