 cultural_festival.2020.t:0 "ถึงฤดูกาล"
 cultural_festival.2020.desc.intro:0 "ถนนประดับด้วยพรมผนัง! อา กลิ่นหอมของ [stop_host_scope.Custom('RegionalEdibleMeat')] ที่ปรุงสดใหม่! วิธีที่ [activity.GetCurrentPhase.GetLocation.GetNameNoTooltip] ส่องสว่างในช่วงเวลานี้ของปี!\n\n"
 cultural_festival.2020.desc.christmas:1 "ระฆังดังขึ้นและชาวบ้านเตรียมตัวสำหรับพิธีมิสซา พวกเขาพูดคุยกันอย่างมีชีวิตชีวาเกี่ยวกับการประสูติของพระคริสต์ "มีลาตัวหนึ่ง ข้าบอกเจ้าแล้ว!", "และมันเกิดขึ้นใกล้แม่น้ำ เหมือนที่นี่เลย", "เมื่อลูกข้าเกิด ข้าหวังว่าเจ้าจะให้ทองคำแก่เขามากเท่านี้!"\n\nละครสั้นตามมาทันที และพระเจ้าทรงประสูติ"
 cultural_festival.2020.desc.midsommar:2 "พวกเขาได้ตั้งเสาเมย์โพลไว้กลางหมู่บ้าน และชาวบ้านที่ แต่งกายด้วยชุดสีขาวเตรียมพร้อมที่จะเต้นรำรอบๆ ข้าเห็นมงกุฎ [stop_host_scope.GetCurrentLocation.Custom('get_region_flower_type_plural')] วางอยู่บนโต๊ะตัวหนึ่ง และเด็กสาวคนหนึ่งยิ้มให้ข้าก่อนที่จะเข้าร่วมวงกลม บนท้องฟ้า แสงที่สว่างที่สุดส่องสว่างตลอดทั้งคืน"
 cultural_festival.2020.desc.summer_solstice:1 "กองไฟถูกจุดขึ้นกลางเมืองเพื่อเฉลิมฉลองชัยชนะของดวงดาวที่สว่างที่สุด ลอยขึ้นสู่สวรรค์เบื้องบน ท่ามกลางความสนุกสนานและการดื่ม [stop_host_scope.Custom('RegionalDrink')] ชาวบ้านคนหนึ่งเริ่มร้องเพลงที่ทุกคนเข้าร่วม: "ฤดูร้อนมาถึงแล้ว ร้องเพลงเสียงดัง [ROOT.Char.Custom('GetRandomMigratoryBird')]! เมล็ดพันธุ์กำลังเติบโต และทุ่งหญ้ากำลังเบ่งบาน ร้องเพลง [ROOT.Char.Custom('GetRandomMigratoryBird')]!""
 cultural_festival.2020.desc.eid:0 "หลังจากการสวดมนต์ ชาวบ้านเยี่ยมเยียนกันและเฉลิมฉลองการสิ้นสุดการถือศีลอด จานที่เต็มไปด้วย [stop_host_scope.Custom('get_region_root_vegetable_plural')] และปลาถูกเสิร์ฟพร้อมกับ [stop_host_scope.Custom('RegionalDrink')] และการเฉลิมฉลองดำเนินต่อไป จนกระทั่งพระอาทิตย์ตกดิน"
 cultural_festival.2020.desc.harvest:1 "หลังจากตรากตรำมาหลายสัปดาห์, วันสุดท้ายแห่งการเก็บเกี่ยวก็มาถึงเสียที, และชาวบ้านก็รวมกลุ่มกันเพื่อพยายามเก็บเกี่ยวพืชผลในแปลงสุดท้าย "ดูนี่สิ!" หนึ่งในนั้นอวดอ้างขณะเหวี่ยงเคียวไปยังทุ่งนา, ทว่าก็ตัดได้ไม่มากไปกว่าผู้ใด\n\n"[ROOT.Char.Custom('FormOfAddressForLiege')|U], มาฉลองกับพวกเราเถิด!" [stop_host_scope.GetTitledFirstName] เอ่ยชวน, พลางส่งสัญญาณไปยังกลุ่มคนที่กำลังเต้นรำอย่างสนุกสนานข้างกองผลผลิต"
 cultural_festival.2020.desc.generic:1 "ช่างเป็นเสียงขับขาน, โห่ร้อง และความรื่นเริงอะไร เช่นนี้! [ROOT.Char.Custom('FormOfAddressForLiege')|U], มาฉลองกับพวกเราเถิด!" [stop_host_scope.GetTitledFirstName] กล่าว, พร้อมรอยยิ้มต้อนรับ ณ ลานกว้าง, เหล่าชาวบ้านได้มารวมตัวกัน: พวกเขาเต้นรำท่ามกลางกลิ่นหอมฉุนของ [stop_host_scope.Custom('RegionalDrink')] และ [stop_host_scope.Custom('GetLocalStreetFood')]."
 cultural_festival.2020.a:0 "ช่างเป็นการเฉลิมฉลองที่น่ารักเสียนี่กระไร!"
 cultural_festival.2020.b.drink:0 "#EMP มาดื่ม [stop_host_scope.Custom('RegionalAlcoholicDrink')] กันเถอะ#!."
 cultural_festival.2020.b.no_drink:0 "ได้เวลาดื่ม [stop_host_scope.Custom('RegionalDrink')] และกิน [stop_host_scope.Custom('RegionalEdibleMeat')] แล้ว!"
 cultural_acceptance_embraced_festival:0 "ยอมรับเทศกาลวัฒนธรรม"
 enjoyed_culture_modifier:0 "เฉลิมฉลองเทศกาลวัฒนธรรม"
 enjoyed_culture_modifier_desc:1 "ตัวละครนี้เข้าร่วมในการเฉลิมฉลองท้องถิ่น"
 festival_tis_the_season:0 "ดื่มและลืม!"
 festival_tis_the_season_desc:0 "ตัวละครนี้ใช้เวลาในการเฉลิมฉลองท้องถิ่นไปกับการดื่ม"
 
 cultural_festival.2030.t:0 "การเก็บภาษีทางวัฒนธรรม"
 cultural_festival.2030.desc:0 "ขณะที่ผู้คนใน [activity.GetCurrentPhase.GetLocation.GetNameNoTooltip] เริ่มรวมตัวกันรอบเวทีไม้ ความคิดหนึ่งก็ผุดขึ้นมา... ผู้คนกลุ่มใหญ่ เช่นนี้ ทุกคนต้องการเพลิดเพลินกับการแสดงที่ประณีตอย่างน่าทึ่ง... #EMP ฟรี#! ช่างเป็นการสิ้นเปลืองเสียนี่กระไร\n\nหากข้ายืนอยู่ตรงทางเข้า ข้ามั่นใจว่าข้าสามารถเรียกร้องค่าผ่านทางเล็กน้อยสำหรับสิ่งนี้ได้... ท้ายที่สุดแล้ว มันก็เพื่อเป็นเกียรติแก่ #EMP ข้า#! "
 cultural_festival.2030.a:0 "พวกเขาติดหนี้ข้าเรื่องนี้"
 cultural_festival.2030.b:0 "ข้าควรสร้างความประทับใจที่ดีและไม่ยุ่งกับเรื่องนี้"
 cultural_festival.2030.c:0 "ท่านเห็นไหม การเดินทางมาที่นี่มัน #EMP แพง#! อย่างยิ่ง..."
 no_taxation_modifier:0 "ไม่มีภาษีเทศกาล"
 festival_taxation_modifier:0 "ภาษีเทศกาล"
 
 cultural_festival.2040.t:0 "เทศกาลไร้วัฒนธรรม...?"
 cultural_festival.2040.desc:0 "ข้าไม่รู้ว่าข้าคาดหวังอะไรเมื่อข้าขอให้ [stop_host_scope.GetTitledFirstName] จัดเทศกาลวัฒนธรรมเพื่อแสดงขนบธรรมเนียมของผู้คนของ [stop_host_scope.GetHerHis] แต่... มันไม่ใช่ #EMP แบบนี้#!.\n\nข้าหันหน้าหนีจากการเต้นรำที่ไม่ประสานกันของนักแสดงที่ฝึกฝนมาไม่ดี และพยายามหาความสบายใจในอาหารที่เตรียมไว้ — #EMP แหวะ#! [stop_host_scope.Custom('RegionalEdibleMeat')] แทบจะไม่สุกและ [stop_host_scope.Custom('get_region_root_vegetable_plural')] ก็ไหม้เกรียมไปหมด นี่เป็นการแสดงออกที่ดีของวัฒนธรรม [cultural_festival_scope.GetAdjectiveNoTooltip] หรือ?"
 cultural_festival.2040.a:0 "นี่... นี่มัน #EMP แย่มาก#! รับความช่วยเหลือไปและ ทำให้ดีขึ้น"
 cultural_festival.2040.b:0 "มันก็ไม่ได้แย่ขนาดนั้นจริงๆ"
 cultural_festival.2040.c:0 "ฮ่า! ข้าจะแสดงให้พวกเขาเห็นว่าพวกเราชาว [ROOT.Char.GetCulture.GetCollectiveNoun] เต้นรำกันอย่างไร"
 cultural_festival.2040.c.success:0 "ทุกคนประทับใจในวัฒนธรรมของท่าน"
 cultural_festival.2040.c.failure:0 "ทุกคนคิดว่าท่านไม่ละเอียดอ่อน"
 no_culture_modifier:0 "ปฏิเสธวัฒนธรรมของพวกเขา"
 helped_culture_modifier:0 "ความช่วยเหลือด้านวัฒนธรรมที่ดีขึ้น"
 appreciated_culture_modifier:0 "ชื่นชมวัฒนธรรมของพวกเขา"
 cultural_acceptance_insulted_festival:0 "ปฏิเสธเทศกาลวัฒนธรรม"
 
 cultural_festival.2050.t:0 "การเคลื่อนไหวอันอื้อฉาว"
 cultural_festival.2050.desc_intro:0 ""และบัดนี้ เพื่อเป็นเกียรติแก่ [ROOT.Char.GetTitledFirstNameNoTooltip] พวกเราทุกคนจะได้เพลิดเพลินกับการเต้นรำท้องถิ่น!" [stop_host_scope.GetTitledFirstName] ประกาศ และข้าก็นั่งลงบนที่นั่งทางขวาของ [stop_host_scope.GetHerHis] อย่างตื่นเต้น พลางหยิบผลไม้สดและ [stop_host_scope.Custom('RegionalDrink')] มาทานเล่น\n\n"
 cultural_festival.2050.desc_lustful:0 "นักแสดงขึ้นไปบนเวทีหลังจากนั้นไม่นาน และสายตาของข้าก็จับจ้องไปที่ขาที่ทาน้ำมันของพวกเขา ซึ่งไม่ได้ปกปิด หน้าอกเปลือยเปล่าของพวกเขาส่องประกายเท่าเทียมกัน ไม่เหลือ #EMP อะไร#! ให้จินตนาการ ข้าขยับตัวบนที่นั่ง นี่คือการแสดงร่างกายที่สวยงามอะไรกัน?"
 cultural_festival.2050.desc_fallback:0 "นักแสดงขึ้นไปบนเวทีหลังจากนั้นไม่นาน ทุกคน แต่งกาย... อืม คงจะเกินไปถ้าจะบอกว่าพวกเขา #EMP แต่งกาย#! ผิวหนังเปลือยเปล่าของขาของพวกเขาถูกทาน้ำมันด้วยสาระสำคัญที่มีกลิ่นหอม และ... #EMP หน้าอก#! ของพวกเขาก็เปิดเผยเกินกว่าที่จะไม่มอง"
 cultural_festival.2050.desc_outro:0 "\n\n[stop_host_scope.GetTitledFirstNameNoTooltip] ชำเลืองมองข้า: "ท่านกำลังเพลิดเพลินอยู่หรือไม่ สหายข้า?""
 cultural_festival.2050.a:0 "นี่มัน #EMP ความวิปริต#! อะไรกัน?"
 cultural_festival.2050.b:0 "ข้า — อืม มันเป็นวัฒนธรรมของพวกเขา ใช่ไหม?"
 cultural_festival.2050.c:0 "สิ่งนี้หายไปไหนมาตลอดชีวิตข้า?"
 
 cultural_festival.2060.t:0 "สิ่งประดิษฐ์ล้ำค่าจากเมืองหลวง"
 cultural_festival.2060.desc:1 "แม้จะมีความพยายามอย่างเห็นได้ชัดในการจัดเทศกาล ข้าก็ยังสังเกตเห็นบ้านร้างและวัสดุที่ยากจนบางส่วนใน [activity.GetCurrentPhase.GetLocation.GetNameNoTooltip]\n\nเมื่อข้าเข้าใกล้จัตุรัสหลัก ข้าเห็นว่า [stop_host_scope.GetTitledFirstName] ถูกรายล้อมไปด้วยกลุ่มเด็กๆ ที่กระตือรือร้นถามเกี่ยวกับขบวนผู้ติดตามของเรา พวกเขาซ่อนตัวทันทีที่เห็นข้า "ข้านำสิ่งนี้มาจากเมืองหลวง หากใครสนใจจะดู..." ข้ากล่าว พลางแสดง [sophisticated_artifact.GetNameNoTooltip] ที่ข้านำติดตัวมาให้ [stop_host_scope.GetFirstNameNoTooltip] ดู\n\n"งดงาม!" [stop_host_scope.GetSheHe] กล่าว ขณะที่เด็กๆ กลับมาดู"
 cultural_festival.2060.a:0 ""อันที่จริง ท่านเก็บไว้ได้เลย""
 cultural_festival.2060.b:0 ""ระวังมือเหล่านั้นด้วย""
 cultural_festival.2060.c:0 ""ข้าจะจ่ายเงินให้ช่างฝีมือของท่านสร้างให้ท่านอันหนึ่ง!""
 
 cultural_festival.2070.t:0 "เกมแห่งโชคชะตา"
 cultural_festival.2070.desc:0 "กลิ่นรุนแรงน่าประทับใจปะทะเข้าจมูกข้าทันทีที่เปิดประตูโรงเตี๊ยม กลุ่ม [retired_mercenary.GetWomenMen] กำลังร้องเพลงอย่างครึกครื้นบนโต๊ะด้านหลัง "ฮ่า! ข้าบอกแล้วว่าข้าจะชนะ!" หนึ่งในนั้นตะโกน, พลางกลิ้งลูกเต๋าไปมาบนนิ้ว [retired_mercenary.GetHerHis], จากนั้น [retired_mercenary.GetSheHe] ก็เงยหน้าขึ้น, มองตรงมาที่ข้า "อยากลองเสี่ยงโชคดูบ้างไหมเล่า, [ROOT.Char.GetTitleAsNameNoTooltip]?"\n\n"ระวังตัวด้วย [ROOT.Char.Custom('FormOfAddressForLiege')]," [stop_host_scope.GetTitledFirstName] เตือนข้า, "คนเหล่านี้คือ [retired_mercenary.GetWomenMen] ทหารรับจ้างปลดระวางที่พึงพอใจในดินแดนของข้า""
 cultural_festival.2070.a:0 ""บางทีท่านอาจจะอยู่ที่นี่... และคอยจับตาดูผู้คน""
 cultural_festival.2070.b:0 ""มาเถอะ แค่ #EMP ครั้งเดียว#! สุดท้าย — ถ้าข้าชนะ""
 cultural_festival.2070.b.success:0 "ท่านชนะเกม"
 cultural_festival.2070.b.failure:0 "ท่านแพ้เกม"
 cultural_festival.2070.c:0 ""ข้านำลูกเต๋าของข้ามาเอง มา ทำให้มันน่าสนใจกันเถอะ!""
 cultural_festival.2070.c.failure:0 "พวกเขาพบว่าท่านโกง"
 cultural_festival.2070.d:0 ""อา มาดื่มเพื่อวันเก่าๆ ที่ดีกันเถอะ""
