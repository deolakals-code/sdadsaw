 cultural_festival.4302.d:0 "$cultural_festival.4300.d$"
 cultural_festival.4303.t:0 "$cultural_festival.4301.t$"
 cultural_festival.4303.desc:0 "ขณะที่ [visiting_liege.GetTitledFirstName] รับของขวัญของข้า [visiting_liege.GetSheHe] ก็เอื้อมมือไปที่หีบสมบัติของ [visiting_liege.GetHerHis]\n\n"ข้าต้องยอมรับว่าท่าน ทำให้ข้าประหลาดใจ ข้าได้รับเกียรติจากของขวัญของท่านและไม่มีอะไรมากนักที่จะแลกเปลี่ยน แต่โปรดรับของที่ระลึกเล็กน้อยนี้เพื่อแสดงความขอบคุณของข้าด้วย"\n\n[visiting_liege.GetSheHe|U] ยื่นให้ข้า "
 cultural_festival.4303.desc_artifact:0 "[gifted_artifact.GetName] ข้าซาบซึ้งที่ [visiting_liege.GetSheHe] ถูกกระตุ้นให้มอบบางสิ่งตอบแทน ข้าไม่ได้คาดหวังสิ่งนั้นเลย"
 cultural_festival.4303.desc_gold:0 "ถุงเหรียญ ข้าเดาว่า [visiting_liege.GetSheHe] ไม่รู้ว่าจะให้อะไรข้า? หรือถูกจับได้โดยไม่ทันตั้งตัวจากความคิดอันยอดเยี่ยมของข้า!"
 cultural_festival.4303.a:0 "$cultural_festival.4301.a$"
