l_english: 
#### Tour Travel Events
 tour_travel.3120.t:0 "การเยือนโรงเตี๊ยมแขนเคานต์"
 tour_travel.3120.desc.intro:0 "โรงเตี๊ยมทุกแห่งระหว่างทางล้วนราคาแพงเกินควร เป็นการยากที่จะไม่สังเกตเห็นขบวนผู้ติดตามของเรา และก็ไม่ใช่ว่าเราพยายามปกปิดอะไรมากมาย ทุกคนหยุดพูดทันทีที่เราเดินเข้าไป\n\nมีเพียง [vassal_inn.GetWomanMan] คนเดียวที่เข้ามาหาเรา กระตือรือร้นที่จะร่วมโต๊ะด้วย ในไม่ช้า [vassal_inn.GetSheHe] ก็เริ่มพูดจา [vassal_inn.Custom('quirk_pos_standalone')|l] และดูเหมือนว่า [vassal_inn.GetSheHe] จะไม่หยุดพูดในเร็วๆ นี้: "และตอนนั้นเองที่ [vassal_memory.GetDescription]..."\n\n"
 tour_travel.3120.desc.artifact:0 ""อ่า ดูนี่สิ!" [vassal_inn.GetSheHe] อุทาน พลางวาง [vassal_artifact.GetName] ลงบนโต๊ะ "ตอนนี้เป็นของท่านแล้ว!""
 tour_travel.3120.desc.fallback:0 "ดีกว่าความเงียบงัน"
 tour_travel.3120.a:0 ""ข้าชอบความเป็นเพื่อนของท่าน [vassal_inn.GetFirstNameNoTooltip] เหตุใดท่านไม่ร่วมเดินทางกับข้าเล่า?""
 tour_travel.3120.a.success:0 "ท่านโน้มน้าว [vassal_inn.GetShortUIName] ได้สำเร็จ"
 tour_travel.3120.a.failure:0 "[vassal_inn.GetShortUIName] รู้สึกเป็นเกียรติ แต่ไม่ถูกโน้มน้าว"
 tour_travel.3120.b:0 ""เล่าให้ข้าฟังอีกสิ!""
 tour_travel.3120.c:0 ""ช่างเป็นของขวัญที่น่ารักเสียนี่กระไร!""
 
 tour_travel.3130.t:0 "ผลกระทบที่ต่ำกว่า"
 tour_travel.3130.desc.intro:0 ""เจ้าน่ะ!" ข้าได้ยินเสียงตะโกนแว่วมา แต่ไกล และเมื่อหันไปก็พบกับชาวนาผู้ถึอคันไถ, [complaining_peasant.GetHerHis|U] ลมหายใจหอบถี่อย่างกระวนกระวายขณะที่ [complaining_peasant.GetSheHe] หยุดชั่วครู่\n\n"ขออภัยเถิด [ROOT.Char.Custom('FormOfAddressForLiege')], แต่หาได้ยากนักที่ข้าจะมีโอกาสได้สนทนากับท่าน ข้าเข้าใจว่าท่านจำต้องขยายดินแดน, แต่"
 tour_travel.3130.desc.no_farms:0 "อาคารหลวงที่ท่านสร้างขึ้นที่นี่ ทำให้พวกเราตกงาน""
 tour_travel.3130.desc.no_jobs:0 "โรงสีที่ท่านสร้างขึ้นที่นี่ได้ยึดครองที่ดินส่วนหนึ่งของเราไป""
 tour_travel.3130.desc.outro:0 "\n\n[complaining_peasant.GetSheHe|U] กำคันไถของ [complaining_peasant.GetHerHis] แน่น"
 tour_travel.3130.a:0 ""เรื่องนี้หนักใจข้ายิ่งนัก รับทองนี้ไปเถิด""
 tour_travel.3130.b:0 ""มาทำงานในที่ดินของข้าเถิด ข้าจะให้สิ่งที่ถูกพรากไปจากเจ้าคืน""
 tour_travel.3130.c:0 ""อาณาจักรต้องมาก่อนเสมอ""
 peasant_influx_modifier:0 "ชาวนาหลั่งไหลเข้ามา"
 peasant_influx_modifier_desc:0 "ที่ดินเหล่านี้ถูกเสนอให้กับกลุ่มชาวนาเพื่อเป็นการชดเชยความเสียหายที่เกิดจากอาคารใหม่"
 
 tour_travel.3140.t:0 "นอกกำแพง"
 tour_travel.3140.desc:1 "ข้าได้ยินเสียงอึกทึกครึกโครมก่อนที่จะเห็นอาคารเสียอีก เสียงดังออกมาจากภายในอาคารไม้ธรรมดา เสียงหัวเราะและดนตรี ขณะที่เราเข้าใกล้มัน [brothel_worker.GetWomanMan] คนหนึ่งโบกมือให้เรา พลางกัด [ROOT.GetCharacter.Custom('GetSmallFoodIndef')]\n\n"โอ้ ยินดีต้อนรับ" [brothel_worker.GetSheHe] กล่าวขณะที่ [brothel_worker.Custom('quirk_pos_standalone')|l] "ท่านต้องการพักค้างคืนหรือไม่? หรือเพียงสองสามชั่วโมง? สักครู่?"\n\nไม่ยากที่จะเข้าใจเจตนาของ [brothel_worker.GetHerHis]"
 tour_travel.3140.a:0 ""ข้า #EMP อยาก#! เช่นนั้น""
 tour_travel.3140.b:0 ""ข้าจะไม่ตกอยู่ในการล่อลวง""
 brothel_stop_modifier:0 "กำลังวังชาที่ได้รับการฟื้นฟู"
 brothel_stop_modifier_desc:0 "ตัวละครนี้ได้แวะพักที่ซ่องโสเภณีหลายแห่งระหว่างทาง"
 
#### Tour Cultural Festival Events
#Liege Events
 cultural_festival.2000.t:0 "เทศกาลวัฒนธรรมใน [activity.GetCurrentPhase.GetLocation.GetNameNoTooltip]"
 cultural_festival.2000.desc.intro:0 "ถนนหนทางใน [ROOT.Char.GetCurrentLocation.GetName] ได้รับการตกแต่งอย่างหรูหราเพื่อต้อนรับการมาถึงของข้า และข้าในบังคับของข้า [stop_host_scope.GetTitledFirstName] ก็รอคอยข้าอย่าง dutifully\n\n" # dutifully -> อย่างซื่อสัตย์ / อย่างจงรักภักดี / อย่างสมหน้าที่ -> ใช้ อย่างสมหน้าที่
 cultural_festival.2000.desc.first_time_lovers:0 "ข้าแทบรอไม่ไหวที่จะมาเยือนดินแดนเหล่านี้เป็นครั้งแรก ทิวทัศน์อันงดงามและท้องฟ้าอันน่าอัศจรรย์ที่ [stop_host_scope.GetFirstNameNoTooltip] ได้บรรยายให้ข้าฟังบนเตียงหลายครั้งหลายครา และเพื่อ"
 cultural_festival.2000.desc.first_time_rivals:0 "โอ้ กี่ครั้งกี่หนแล้วที่ข้าฝันถึงการทำลายล้างดินแดนอันเสื่อมโทรมของ [stop_host_scope.GetHerHis] การไปเยือนป้อมปราการที่ [stop_host_scope.GetSheHe] โอ้อวดนักหนาเพียงเพื่อพบว่ามันแย่กว่าของข้าเสียอีก\n\nข้าแทบรอไม่ไหวที่จะได้เห็น #EMP หลุมโสโครก#! นั่นจริงๆ โชคดีที่ข้ามาที่นี่เพื่อ"
 cultural_festival.2000.desc.first_time_neutral:0 "ข้าไม่อาจกล่าวได้ว่าข้าไม่รู้สึกทึ่งในขนบธรรมเนียมของดินแดนนี้และสิ่งที่ [stop_host_scope.GetFirstNameNoTooltip] จะมอบให้ข้า และเพื่อเป็นการแลกเปลี่ยน ข้าจะ"
 cultural_festival.2000.desc.first_time_good:0 "อา ข้าปรารถนาเพียงใดที่จะเพลิดเพลินกับกิจกรรมอันยิ่งใหญ่และความสุขสำราญที่ข้ามั่นใจว่า [stop_host_scope.GetFirstNameNoTooltip] ได้เตรียมไว้ — และเพื่อ"
 cultural_festival.2000.desc.first_time_bad:0 "แล้วเราก็มาถึงที่นี่ เพื่อเทศกาลที่น่าเบื่อ — อย่างดีก็แค่ปานกลาง — ที่เจ้าคนทึ่ม [stop_host_scope.GetFirstNameNoTooltip] มีหน้ามาเตรียมไว้ โชคดีที่ข้ามาที่นี่เพื่อ"
 cultural_festival.2000.desc.again_lovers:0 "ข้ารอไม่ไหวที่จะกลับมายังดินแดนเหล่านี้! ข้าจำได้ดีว่าข้าเพลิดเพลินกับขนบธรรมเนียมและประเพณีของพวกเขาเพียงใดในครั้งก่อน และข้าโหยหาที่จะได้พบ [stop_host_scope.GetFirstNameNoTooltip] ที่รักของข้าอีกครั้งเพียงใด\n\nและแน่นอน เพื่อ"
 cultural_festival.2000.desc.again_rivals:0 "อา การได้เหยียบย่าง #EMP อีกครั้ง#! ใน [ROOT.Char.GetCurrentLocation.GetNameNoTooltip] นั้นเทียบได้กับการไปเยือนขุมนรก [ROOT.Char.GetFaith.NegativeAfterLife] เท่านั้น โชคดีที่ข้ากลับมาเพื่อ"
 cultural_festival.2000.desc.again_good:0 "อา! ช่างน่ายินดีเพียงใดที่ได้เหยียบย่างมาที่นี่อีกครั้ง! ข้าแทบรอไม่ไหวที่จะได้เห็นการแสดงอันยอดเยี่ยมและอาหารเลิศรสที่ [stop_host_scope.GetSheHe] เตรียมไว้ให้ข้าในครั้งนี้ และเพื่อ"
 cultural_festival.2000.desc.again_neutral:0 "ครั้งที่แล้วมันก็ไม่ได้แย่ขนาดนั้น ดังนั้นข้าหวังเป็นอย่างยิ่งว่าครั้งนี้จะทนได้พอๆ กัน ข้าคงต้องการความบันเทิงบ้าง ห่างไกลจากอุบายในราชสำนัก และแน่นอน เพื่อ"
 cultural_festival.2000.desc.again_bad:0 "#EMP อ๊าก#! ที่ต้องมาอยู่ที่นี่ #EMP อีกครั้ง#! คือหนึ่งในการลงโทษที่ยิ่งใหญ่ที่สุดของโชคชะตา การต้องรับมือกับการปรากฏตัวที่น่าเบื่ออย่างน่าประทับใจของ [stop_host_scope.GetHerHis] อาจเป็นความท้าทายที่ยิ่งใหญ่ที่สุด โชคดีที่ข้ามาที่นี่เพื่อ"
 cultural_festival.2000.desc.majesty:0 "แสดงให้ผู้คนเหล่านี้เห็นถึงความยิ่งใหญ่ของข้า"
 cultural_festival.2000.desc.intimidation:0 "แสดงให้ [stop_host_scope.GetHerHim] เห็นว่า [ROOT.Char.GetTitleAsNameNoTooltip] ควรปกครองอย่างไร"
 cultural_festival.2000.desc.again_intimidation:0 "เตือนพวกเขาถึงการมาเยือนครั้งล่าสุดของข้า ข้ากำลังจะ ทำให้ครั้งนี้ #EMP น่าจดจำ#! ไม่แพ้กัน"
 cultural_festival.2000.desc.taxation:1 "ทำให้กระเป๋าของพวกเขาเบาลงจากน้ำหนักของทองคำ"
 cultural_festival.2000.a:1 ""เริ่มกันเลย!""
 cultural_festival_begins_tt:1 "เริ่มกิจกรรมเทศกาลวัฒนธรรม"
 
 cultural_festival.2001.t:0 "เริ่มต้นไม่สวย"
 cultural_festival.2001.desc.intro:0 "ดนตรีบนเวทีหลักตามมาด้วยนักเต้นในทันที ความงดงามของการเคลื่อนไหว ทำให้พวกเขาดูเหมือนเป็นส่วนหนึ่งของเวที พวกเขาเหวี่ยงแขนขึ้นไปในอากาศและรู้สึกเหมือนกำลังดูต้นไม้แตกกิ่งก้านใหม่\n\nเสียงสูดหายใจดังมาจากผู้ชมเมื่อนักเต้นคนหนึ่งเริ่มปีนกำแพงไม้ของเวที: "และบัดนี้" [injured_artist.GetSheHe] กล่าว "ข้าจะแก้แค้นจาก — #EMP อ๊าาาาาาาา#!".\n\n"
 cultural_festival.2001.desc.child:1 "ขณะที่ [injured_artist.GetSheHe] ตกลงสู่พื้น ผ้าคลุมศีรษะของ [injured_artist.GetHerHis] หลุดลง เผยให้เห็นใบหน้าของ [injured_artist.Custom('GetDaughterSon')] ของ [stop_host_scope.GetTitledFirstNamePossessive]: [injured_artist.GetName]"
 cultural_festival.2001.desc.normal:0 "ขณะที่นักแสดงตกลงสู่พื้น ความเงียบของฝูงชน ทำให้ทุกคนได้ยินเสียง #EMP แคร็ก#! อย่างชัดเจน"
 cultural_festival.2001.a:0 "อืม... นั่นเจ็บแน่ๆ"
 cultural_festival.2001.b:0 ""ตามหมอมาทันที!""
 cultural_festival.2001.c:0 ""ข้าจะให้โบยเจ้าฐานไร้ความสามารถ!""
 festival_helped_injured_artist_modifier:0 "ช่วยเหลือนักแสดงบาดเจ็บ"
 festival_whipped_injured_artist_modifier:0 "โบยนักแสดงบาดเจ็บ"
 
 cultural_festival.2002.t:0 "เริ่มต้นสวยงาม"
 cultural_festival.2002.desc.intro:0 "เหล่าชาวบ้านในพื้นที่ได้ตั้งแผงขายผักนานาชนิด และ—นานครั้ง นานที—[stop_host_scope.Custom('RegionalEdibleMeat')] ขณะที่ข้าเดินต่อไป พร้อมด้วยข้าราชสำนักจำนวนพอสมควร, ข้าก็เหลือบเห็นใบหน้าที่คุ้นเคยในหมู่พวกเขา, [injured_artist.GetHerHis] ดวงตาจับจ้องมาที่ข้า\n\n"[ROOT.Char.Custom('FormOfAddressForLiege')|U]," ในที่สุด [injured_artist.GetSheHe] ก็เข้ามาหาข้า, และด้วยการโบกมือ ทหารองครักษ์ของข้าจึงปล่อยให้ [injured_artist.GetHerHim] เข้ามา, "ท่านเคยช่วยข้าในยามขัดสน, เมื่อครั้งที่ข้าบาดเจ็บระหว่างการแสดง บัดนี้ถึงตาข้าที่จะตอบแทนท่านด้วยสิ่งที่ข้ามีบ้าง"
 cultural_festival.2002.desc.secret:0 "ข้ารู้ความลับของ [secret_target.GetTitledFirstNamePossessive]""
 cultural_festival.2002.desc.hunting:0 "ข้ารู้จักดินแดนเหล่านี้ดี""
 cultural_festival.2002.desc.savings:0 "และนี่คือทั้งหมด""
 cultural_festival.2002.a:0 ""เป็นการชำระที่ยุติธรรม""
 cultural_festival.2002.b:0 ""ข้าทำในสิ่งที่ข้าต้องทำ ไม่ต้องตอบแทน""
 terrain_knowledge_modifier:0 "ความรู้ภูมิประเทศ"
 
 cultural_festival.2010.t:0 "[ROOT.Char.Custom('GetMonarchofBeautyGoodBad')]"
 cultural_festival.2010.desc_bad:0 "ทุกคนใน [activity.GetCurrentPhase.GetLocation.GetNameNoTooltip] ดูเหมือนจะหมกมุ่นอยู่กับการสนทนาที่ตลกที่สุดเท่าที่เคยมีมา พวกเขาหัวเราะคิกคักและไอ และแม้กระทั่งกระทุ้งกันเมื่อคิดว่าอาจจะมากเกินไป จากที่นั่นที่นี่ข้าพอจะได้ยินคำว่า "น่ากลัว" (grimly)\n\nเมื่อข้าเข้าใกล้เวทีหลัก ข้าพบ [stop_host_scope.GetTitledFirstName] ถือมงกุฎดอกไม้อยู่ในมือของ [stop_host_scope.GetHerHis] พร้อมรอยยิ้มเจ้าเล่ห์: "นี่ไง [ROOT.Char.GetSheHe]!" [stop_host_scope.GetSheHe] ประกาศ พลางชี้มาที่ข้า " [ROOT.Char.Custom('GetMonarchofBeautyGoodBad')] ของเรา!""
 cultural_festival.2010.desc_good:1 "ถนนหนทางใน [activity.GetCurrentPhase.GetLocation.GetNameNoTooltip] ประดับประดาไปด้วย [stop_host_scope.GetCurrentLocation.Custom('get_region_flower_type_plural')] และธงทิว ทุกคนในหมู่บ้านเฉลิมฉลองการมาถึงของข้าอย่างร่าเริง — ข้าสาบานได้เลยว่าพวกเขาไม่ละสายตาไปจากข้า\n\nเมื่อข้าเข้าใกล้เวทีหลัก ข้าพบ [stop_host_scope.GetTitledFirstName] ถือมงกุฎดอกไม้อยู่ในมือของ [stop_host_scope.GetHerHis] ยิ้มให้ข้า: "นี่ไง [ROOT.Char.GetSheHe]!" [stop_host_scope.GetSheHe] ประกาศ "[ROOT.Char.Custom('GetMonarchofBeautyGoodBad')] ของเรา!""
 cultural_festival.2010.a:0 ""ช่างเป็นเรื่องน่าประหลาดใจที่น่ารักเสียนี่กระไร!""
 cultural_festival.2010.b:0 "ทางที่ดีอย่าสร้างเรื่อง ไปกันเถอะ"
 cultural_festival.2010.c:0 ""เจ้า #EMP กล้า#! อย่างไร""
 cultural_festival.2010.c.success:0 "ท่านชนะการต่อสู้"
 cultural_festival.2010.c.failure:0 "[stop_host_scope.GetShortUIName] ชนะการต่อสู้"
