 cultural_festival.3022.t:0 "เครื่องเตือนใจถึงความภักดี: การแสดงความจงรักภักดี"
 cultural_festival.3022.desc.intro:0 "เป็นค่ำคืนอันศักดิ์สิทธิ์เมื่อ [visiting_liege.GetTitledFirstName] เรียกข้าไปยังห้องบัลลังก์ของข้าเอง [visiting_liege.GetSheHe|U] ได้ส่งข่าวไปยังขบวนผู้ติดตามของข้าเกี่ยวกับ "พิธีแสดงความจงรักภักดีครั้งใหม่" ข้าสูดหายใจลึกๆ ก่อนเข้าห้อง — นั่นไง [visiting_liege.GetSheHe] นั่งอยู่บนเก้าอี้ #EMP ของข้า#! เจ้าเหนือหัวก็คือเจ้าเหนือหัว [visiting_liege.GetSheHe|U] จะ ทำให้ข้าไม่มีวันลืม\n\nข้าคุกเข่าลงต่อหน้า [visiting_liege.GetHerHim] และ [visiting_liege.GetSheHe] ก็จับมือข้าไว้ในมือของ [visiting_liege.GetHersHis] "สหายข้า" [visiting_liege.GetSheHe] กล่าว "เจ้ามอบมือของเจ้าไว้ในมือข้าแทนที่หัวใจของเรา ข้าให้ความสำคัญกับความซื่อสัตย์ของเจ้าอย่างสูง และด้วยเหตุนี้ข้าจึงเรียกร้อง"
