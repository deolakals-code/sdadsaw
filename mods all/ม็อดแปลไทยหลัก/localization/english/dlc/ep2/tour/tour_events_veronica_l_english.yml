 cultural_festival.3021.t:0 "เครื่องเตือนใจถึงความภักดี: การแสดงความจงรักภักดี"
 cultural_festival.3021.desc:0 "เทียนทุกเล่มในห้องลุกโชนอย่างรุนแรงเพื่อขับไล่ความมืดภายนอก ลมพัดผ่านรอยแตกของหินรอบหน้าต่าง [stop_host_scope.GetTitledFirstName] คุกเข่าอยู่หน้าข้าและข้ายื่นมือไปจับมือของ [stop_host_scope.GetHerHis] ไว้ในมือข้า\n\n"สหายข้า" ข้าเริ่ม และกระชับมือแน่นขึ้น "เจ้ามอบมือของเจ้าไว้ในมือข้าแทนที่หัวใจของเรา ข้าให้ความสำคัญกับความซื่อสัตย์ของเจ้าอย่างสูง และด้วยเหตุนี้ข้าจึงเรียกร้อง..."
