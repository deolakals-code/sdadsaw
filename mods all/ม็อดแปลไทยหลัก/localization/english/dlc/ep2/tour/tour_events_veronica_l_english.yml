 cultural_festival.3030.t:0 "แด่ผู้ที่สวยที่สุด!"
 cultural_festival.3030.desc:0 "ขณะที่ข้าเดินไปตามถนนของ [ROOT.Char.GetCurrentLocation.GetNameNoTooltip] พยายามคิดหาแนวคิดใหม่ๆ สำหรับเทศกาลวัฒนธรรม ชาวนาท้องถิ่นคนหนึ่งเข้ามาหาข้าอย่างเขินอาย [ROOT.Char.Custom('RegionalFarmAnimal')] ที่ [local_farmer.GetSheHe] นำมาด้วยหลังจาก [local_farmer.GetHerHim] หยุดเคี้ยวบางอย่างจากพื้น\n\n"เจ้าเหนือหัวของข้า" [local_farmer.GetSheHe] กล่าว ตื่นเต้นมากขึ้นเรื่อยๆ "ท่านจะกรุณาตัดสินการประกวดความงามของเราหรือไม่? เจ้าแข็งแกร่งน้อยของข้าจะต้องเป็นผู้ชนะอย่างแน่นอน"\n\nข้ามองดู [ROOT.Char.Custom('RegionalFarmAnimal')] ของ [local_farmer.GetHerHis] อย่างรวดเร็ว ตอนนี้กำลังยุ่งอยู่กับใบไม้บางส่วน จะเป็นอย่างไรถ้า... ข้าปล่อยให้ [visiting_liege.GetTitledFirstName] ตัดสินแทน?"
 cultural_festival.3030.a:0 ""เริ่มเตรียมการกันเถอะ!""
 cultural_festival.3030.b:0 "ไม่มีทางที่ [visiting_liege.GetFirstNameNoTooltip] จะสนุกกับสิ่งนี้"
 farm_contest_modifier:0 "จัดการประกวดสัตว์เลี้ยงในฟาร์ม"
 
 cultural_festival.3031.t:0 "แด่ผู้ที่สวยที่สุด...?"
 cultural_festival.3031.desc:0 "เวทีใน [ROOT.Char.GetCurrentLocation.GetNameNoTooltip] ถูกจัดเตรียมด้วยหญ้าแห้ง ดอกไม้ และ... แขกที่น่าสนใจ [stop_host_scope.Custom('RegionalFarmAnimalPlural')] สามตัวยืนอยู่ตรงกลาง พร้อมด้วยเจ้าของที่ภาคภูมิใจ [stop_host_scope.GetTitledFirstName] ส่งสัญญาณให้ข้าจากปลายอีกด้านของเวที: "อา นั่นคือผู้ตัดสินของเรา!"\n\nข้ามองไปรอบๆ พยายามดูว่า [stop_host_scope.GetSheHe] หมายถึงข้าหรือไม่ แต่ไม่มีข้อผิดพลาด ข้าเริ่มเดินไปหา [stop_host_scope.GetHerHim] ขณะที่ [stop_host_scope.GetSheHe] พูดต่อ: "ยินดีต้อนรับสู่งานแสดงสัตว์ประจำปีของเรา ที่ ซึ่ง [stop_host_scope.Custom('RegionalFarmAnimal')] ที่สวยที่สุดจะได้รับการสวมมงกุฎ!" เมื่อ [stop_host_scope.GetSheHe] พูด ข้าสังเกตเห็นว่า [stop_host_scope.GetSheHe] แอบชี้ไปที่ตัวทางซ้าย"
 cultural_festival.3031.a:0 ""ตัวทางซ้าย แน่นอน!""
 cultural_festival.3031.b:0 ""ตัวที่งามสง่ามีความงามที่คุ้นเคย...""
 cultural_festival.3031.c:0 ""[stop_host_scope.Custom('RegionalFarmAnimalPlural')] ของชาว [stop_host_scope.GetCulture.GetNameNoTooltip] งดงามที่สุดอย่างแท้จริง!""
 cultural_festival.3031.d:0 ""ข้าจะไม่ยุ่งกับเรื่องนี้ด้วยซ้ำ""
 cultural_festival.3031.e:0 "โอ้ ข้ารู้ว่าใครคือ [stop_host_scope.Custom('RegionalFarmAnimal')] ที่ดีที่สุด..."
