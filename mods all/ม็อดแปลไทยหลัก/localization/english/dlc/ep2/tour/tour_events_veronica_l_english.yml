 festival_luck_mercenaries:0 "สงครามครั้งสุดท้าย"
 festival_luck_mercenaries_desc:0 "ตัวละครนี้โน้มน้าวทหารรับจ้างที่เกษียณแล้วบางส่วนให้ช่วยพวกเขาในสงคราม"
 festival_drank_with_mercenaries:0 "ดื่มกับทหารรับจ้าง"
 
 cultural_festival.2080.t:0 "ข้อตกลงมหัศจรรย์"
 cultural_festival.2080.desc:0 "ขณะที่ข้าเดินชมไปรอบเทศกาล ข้าสังเกตเห็นร่างคลุมหน้าคลุมตา, กำลังขายขวดบรรจุของเหลวที่ไม่สามารถบอกได้ว่าคือสิ่งใด\n\n"มาซื้อยาของข้าเถิด, [ROOT.Char.Custom('FormOfAddressForLiege')], เพราะมันออกฤทธิ์ราวปาฏิหาริย์และปรับสมดุลธาตุในร่างกายของ [ROOT.Char.GetWomanMan] แม้จะอ่อนแอที่สุดก็ตาม"\n\nขณะที่ข้ามองดูขวดเหล่านั้น ข้าสังเกตเห็นว่าหนึ่งในนั้นส่องประกายสีแดงชาด, ราวกับทำมาจากแร่ซินนาบาร์ชั้นเลิศ ส่วนอีกขวดเป็นสีเขียวสว่าง, ราวกับมีคนแช่แผ่นทองแดงไว้ในไวน์สด"
 cultural_festival.2080.a:0 ""ข้าจะเอาขวดสีแดง!""
 cultural_festival.2080.b:0 ""อา ยาสีเขียวดูดีต่อสุขภาพที่สุด!""
 cultural_festival.2080.c:0 ""ข้าจะไม่เสี่ยงสุขภาพของข้ากับเรื่องนี้""
 cultural_festival.2080.tt:0 "สิ่งนี้อาจมีผลกระทบที่ไม่คาดฝัน"
