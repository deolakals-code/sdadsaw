 cultural_festival.3041.t:0 "$cultural_festival.3040.t$"
 cultural_festival.3041.desc:0 "ก้อนหินขนาดใหญ่ถูกวางไว้กลาง [ROOT.Char.GetCurrentLocation.GetNameNoTooltip] พร้อมกับการประดับประดาที่มากเกินกว่าจะคิดว่าเป็นเรื่องบังเอิญ ขณะที่ข้าเข้าใกล้ ข้าก็เข้าใจความสนใจรอบๆ มันอย่างรวดเร็ว เนื่องจากมีอาวุธฝังอยู่บนพื้นผิวของมัน ใบมีดที่ส่องประกายครึ่งหนึ่งเป็นเหล็กกล้า ครึ่งหนึ่งเป็นหิน"
 cultural_festival.3041.a:0 "ฮ่า! ข้าจะแสดงให้พวกเขาเห็นว่าข้าแข็งแกร่งเพียงใด!"
 cultural_festival.3041.a.success:0 "ท่านดึงอาวุธออกจากศิลา"
 cultural_festival.3041.a.success.vassal:0 "[visiting_liege.GetShortUIName] ดึงอาวุธออกจากศิลา"
