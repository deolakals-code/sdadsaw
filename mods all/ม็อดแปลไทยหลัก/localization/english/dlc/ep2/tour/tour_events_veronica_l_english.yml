 cultural_festival.4310.t:1 "ความทรงจำอันแสนหวาน"
 cultural_festival.4310.desc:0 "ข้าใช้เวลาอยู่กับ [gift_receiver.GetTitledFirstName] เป็นอย่างมาก ซึ่ง ทำให้ข้านึกถึงเทศกาลก่อนหน้านี้ที่เราเคยมีร่วมกันเมื่อนานมาแล้ว ข้าจำได้ลางๆ ว่า [giving_gift_memory.GetDescription] ตอนนี้ข้าสงสัยว่า [gift_receiver.GetSheHe] ยังมีมันอยู่หรือไม่ บางทีข้าควรจะลองถาม [gift_receiver.GetHerHim] เกี่ยวกับเรื่องนี้?"
 cultural_festival.4310.a:0 "ข้าจะถามอย่างสุภาพ"
 cultural_festival.4310.a.tt:0 "[gift_receiver.GetTitledFirstNameNoTooltip] จะตัดสินใจว่าจะเกิดอะไรขึ้นต่อไป"
 cultural_festival.4310.b:0 "ไม่ ข้าไม่ #EMP ใจแคบ#! ขนาดนั้น"
 cultural_festival.4311.t:0 "$cultural_festival.4310.t$"
 cultural_festival.4311.desc:0 "[giving_gift_memory_owner.GetTitledFirstName] ทักทายข้าด้วยอ้อมแขนที่เปิดกว้าง\n\n"ช่างเป็นเทศกาลที่ยอดเยี่ยม! มัน ทำให้ข้านึกถึงเทศกาลเก่าๆ ที่เราเคยทำร่วมกันเมื่อไม่กี่ปีก่อน ท่านจำได้ไหม? ข้าเชื่อว่าข้าได้ให้ของขวัญบางอย่างแก่ท่าน บางทีท่านอาจจะช่วยเตือนข้าได้ว่ามันคืออะไรอีกครั้ง?"\n\n"
 cultural_festival.4311.desc.old_gift:0 "อันที่จริง ข้ายังมีมันอยู่ มันคือ [old_gift.GetName] ข้าไม่แน่ใจว่าทำไม [giving_gift_memory_owner.GetTitledFirstNameNoTooltip] ถึงสอดรู้สอดเห็นเกี่ยวกับมัน แต่จากท่าทางแล้ว [giving_gift_memory_owner.GetSheHe] อาจจะต้องการมันคืน?"
 cultural_festival.4311.desc.decoy_gift:0 "เมื่อคิดดูอีกที ข้าก็มี [decoy_gift.GetName] ที่ข้าไม่ได้ใช้อีกต่อไป บางทีข้าอาจจะโน้มน้าว [giving_gift_memory_owner.GetHerHim] ให้เชื่อว่ามันเป็นของขวัญเก่าของ [giving_gift_memory_owner.GetHerHis]?"
 cultural_festival.4311.desc.lost_gift:0 "น่าเสียดาย ข้าเชื่อว่าข้าไม่มีมันอยู่กับตัวอีกต่อไป ไม่แน่ใจว่าข้าทำหายได้อย่างไร แต่ [giving_gift_memory_owner.GetTitledFirstNameNoTooltip] ก็ไม่จำเป็นต้องรู้ เช่นกัน"
 cultural_festival.4311.desc.no_gift:0 "บางที ข้าอาจจะหลอก [giving_gift_memory_owner.GetHerHim] แทนให้เชื่อว่า [giving_gift_memory_owner.GetSheHe] จำข้าผิดคน?"
