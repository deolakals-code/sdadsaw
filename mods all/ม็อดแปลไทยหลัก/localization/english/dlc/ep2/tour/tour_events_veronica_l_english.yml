 cultural_festival.4311.b:0 "ใช่ แน่นอนว่า [giving_gift_memory_owner.GetSheHe] ให้ [decoy_gift.GetNameNoTooltip] แก่ข้า!"
 cultural_festival.4311.c:0 "[giving_gift_memory_owner.GetSheHe|U] ไม่เคยให้อะไรข้าเลย"
 cultural_festival.4311.b.success:0 "ท่านโน้มน้าว [giving_gift_memory_owner.GetTitledFirstNameNoTooltip] ว่าเขาให้ [decoy_gift.GetNameNoTooltip] แก่ท่าน"
