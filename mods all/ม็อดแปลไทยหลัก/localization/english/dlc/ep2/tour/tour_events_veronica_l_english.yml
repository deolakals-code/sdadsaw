 cultural_festival.4203.a.failure:0 "อืม อย่างน้อยข้าแผ่นดินของข้าก็สนุก"
 cultural_festival.4300.t:0 "การแลกเปลี่ยนของขวัญ"
 cultural_festival.4300.desc:0 "ข้าได้รับเกียรติจากการมาเยือนของ [visiting_liege.GetTitledFirstName] เพื่อเป็นการตอบแทน ข้าคิดที่จะแลกเปลี่ยนของขวัญกับ [visiting_liege.GetHerHim] เพื่อสร้างความผูกพันที่แน่นแฟ้นระหว่างเรา ข้ากำลังพิจารณาทำบางอย่างสำหรับโอกาสนี้ ข้าสามารถสั่งทำ [newly_created_artifact.GetName] ได้ $cultural_festival.4302.desc_gold$"
 cultural_festival.4300.desc_existing_artifact:0 "\n\nข้ายังมี [existing_artifact.GetName] วางอยู่เฉยๆ มันจะเป็นของขวัญที่ยอดเยี่ยมและเป็นส่วนตัวมากขึ้น"
 cultural_festival.4300.tt:0 "[visiting_liege.GetShortUIName] จะต้องเลือกของขวัญเพื่อแลกเปลี่ยน"
 cultural_festival.4300.a:0 "ข้าจะให้ [existing_artifact.GetNameNoTooltip] ส่วนตัวของข้า"
 cultural_festival.4300.b:0 "ข้าจะสั่งทำ [newly_created_artifact.GetNameNoTooltip] เป็นของขวัญ"
