l_english: 

 #What You Don't See...
 tour_grounds_events.7000.t:0 "สิ่งที่ท่านมิได้เห็น..."
 tour_grounds_events.7000.desc:0 "[stop_host_scope.GetTitledFirstName|U] เป็นเจ้าบ้านผู้มีน้ำใจยิ่งนักจนบัดนี้ แสดงให้ข้าเห็นดินแดนและทรัพย์สินของ [stop_host_scope.GetHerHis] ด้วยความภาคภูมิใจ ดังนั้นข้าจึงประหลาดใจในทันทีเมื่อ [stop_host_scope.GetSheHe] เริ่มพูดตะกุกตะกักและพยายามเบี่ยงเบนความสนใจของข้าอย่างชัดเจนจากประตูที่ไม่น่าจะมีอะไรพิเศษบานหนึ่งที่เรากำลังเดินผ่าน\n\n"ท่านกำลัง #EMP ซ่อน#! บางอย่างจากข้าอยู่รึ [stop_host_scope.GetFirstNameNoTooltip]?"\n\nข้าฉวยโอกาสในชั่วขณะที่ [stop_host_scope.GetHerHis] ตกตะลึง — ละอายใจ? #EMP รู้สึกผิด#!? — เงียบงัน ผลักประตูเปิดออก และข้าก็ประหลาดใจกับสิ่งที่พบ:"
 tour_grounds_events.7000.desc_artifacts:0 "สมบัติ อัญมณี และแม้กระทั่ง [this_artifact.GetName] ของ [stop_host_scope.GetFirstNamePossessiveNoTooltip]!"
 tour_grounds_events.7000.desc_pantry:0 "ห้องเก็บเสบียงลับ ซ้อนกันสูงจรดเพดานด้วยเครื่องเทศต่างแดน เนื้อหมัก น้ำผึ้ง และถังเกลือ!"
 tour_grounds_events.7000.desc_cellar:0 "ห้องเก็บไวน์ทั้งห้อง ซ้อนกันสูงจรดเพดานด้วยไวน์และเหล้าราคาแพงจากแดนไกล!"
 tour_grounds_events.7000.desc_gold:0 "กองทองคำหลายกองและหีบที่เต็มไปด้วยเหรียญ!"
 tour_grounds_events.7000.desc_falcons:0 "โรงเลี้ยงนกที่เลี้ยงเหยี่ยวสง่างามจำนวนมากในกรงที่ดูแลอย่างดี!"
 tour_grounds_events.7000.desc_dogs:0 "ประตูนำไปสู่ลานที่เต็มไปด้วยสุนัขล่าเนื้อที่ดูแข็งแรงสมบูรณ์ที่สุดเท่าที่ข้าเคยเห็นมาพักหนึ่ง!"
 tour_grounds_events.7000.desc_horses:0 "ประตูนำไปสู่ลานที่เต็มไปด้วยม้าที่ดูแข็งแรงสมบูรณ์ที่สุดเท่าที่ข้าเคยเห็นมาพักหนึ่ง!"
 tour_grounds_events.7000.desc_fallback:0 "คลังเก็บอาหาร ทองคำ และสินค้าทั่วไป!"
 tour_grounds_events.7000.a:0 "เป็นการยุติธรรมที่จะแบ่งปันสิ่งนี้กับ [ROOT.Char.GetTitleAsNameNoTooltip] ของท่าน"
 tour_grounds_events.7000.a.tt:0 "คลังลับถูกเก็บภาษี"
 tour_grounds_events.7000.b:0 "ทหาร! ยึด #EMP ทุกอย่าง#!."
 tour_grounds_events.7000.b.tt:0 "คลังลับถูกยึด"
 tour_grounds_events.7000.b.tt.2:0 "เจ้าเหนือหัวของท่านยึดเอาสิ่งที่ดีที่สุดในคลังของท่านไป!"
 tour_grounds_events.7000.c:0 "ผู้รู้คุณค่า เช่นเดียวกัน!"
 tour_grounds_events.7000.c.tt:0 "คลังลับได้รับการชื่นชม"
 tour_grounds_events.7000.c.tt.2:0 "ท่านผูกสัมพันธ์กับเจ้าเหนือหัวโดยแบ่งปันความสนใจ!"
 tour_grounds_events.7000.d:0 "ข้าจะแสร้งทำเป็นว่ามิได้เห็นสิ่งนี้"
 tour_grounds_events.7000.d.tt:0 "คลังลับถูกเมินเฉย"
 tour_grounds_events.7001.desc:0 "ข้าเชื่อว่าข้าเป็นเจ้าบ้านที่มีน้ำใจอย่างยิ่งต่อเจ้าเหนือหัวผู้มาเยือน [visiting_liege.GetTitledFirstName] จนบัดนี้\n\nการเยี่ยมชม [ROOT.Char.Custom('ResidenceBuilding')] ของข้า โดยเฉพาะอย่างยิ่ง ดำเนินไปด้วยดี — จนกระทั่งข้าเลี้ยวผิดทางและนำ [visiting_liege.GetLadyLord] ผู้กระตือรือร้นของข้ามาอยู่หน้าประตูบานเดียวที่ข้าพยายามกัน [visiting_liege.GetHerHim] ให้ออกห่าง:"
 tour_grounds_events.7001.desc_artifacts:0 "ห้องลับที่ข้าเก็บสมบัติประจำตระกูล!"
 tour_grounds_events.7001.desc_pantry:0 "ห้องเก็บเสบียงลับที่ข้าซ่อนเครื่องเทศต่างแดน เนื้อหมัก น้ำผึ้ง และถังเกลือ!"
 tour_grounds_events.7001.desc_cellar:0 "ห้องเก็บไวน์ลับที่ข้าซ่อนไวน์และเหล้าราคาแพงจากแดนไกล!"
 tour_grounds_events.7001.desc_gold:0 "คลังสมบัติลับที่ข้าซ่อนกองทองคำและหีบที่เต็มไปด้วยเหรียญ!"
 tour_grounds_events.7001.desc_falcons:0 "โรงเลี้ยงนกลับที่ข้าเก็บเหยี่ยวที่รักที่สุด!"
 tour_grounds_events.7001.desc_dogs:0 "ลานลับที่ข้าเลี้ยงสุนัขล่าเนื้อที่รักที่สุด!"
 tour_grounds_events.7001.desc_horses:0 "ลานลับที่ข้าเลี้ยงม้าที่รักที่สุด!"
 tour_grounds_events.7001.desc_fallback:0 "คลังลับเก็บอาหาร ทองคำ และสินค้ามีค่าทั่วไปของข้า!"
 tour_grounds_events.7001.desc_conclusion:0 "\n\nขณะที่ข้าเริ่มพูดตะกุกตะกักอย่างประหม่า [visiting_liege.GetTitledFirstNameNoTooltip] ก็ยิ่งสงสัยมากขึ้น"
 tour_grounds_events.7001.a:0 "[visiting_liege.GetLadyLord] ของข้า! ไปทาง #EMP นี้#! เถิด!"
 tour_grounds_events.7001.a.success:0 "ท่านเบี่ยงเบนเจ้าเหนือหัวไปทางอื่นได้สำเร็จ"
 tour_grounds_events.7001.a.success.tt:0 "ทรัพย์สมบัติของท่านปลอดภัย"
 tour_grounds_events.7001.a.failure:0 "เจ้าเหนือหัวของท่านบุกเข้าไปในห้อง"
 tour_grounds_events.7001.a.failure.tt:0 "คลังลับของท่านถูกค้นพบ"
 tour_grounds_events.7001.b:0 "ข้ามั่นใจว่า [visiting_liege.GetSheHe] สามารถถูกโน้มน้าวให้มองไปทางอื่นได้?"
 tour_grounds_events.7001.b.success:0 "เจ้าเหนือหัวของท่านยอมรับสินบน"
 tour_grounds_events.7001.b.success.tt:0 "รับสินบนแล้ว"
 tour_grounds_events.7001.b.tt.2:0 "เจ้าบ้าน [ROOT.Char.GetTitledFirstNameNoTooltip] ได้จ่ายเงินให้ท่านเพื่อเบือนหน้าหนีจากห้องบางห้อง"
 tour_grounds_events.7001.b.tt:0 "ติดสินบนให้มองไปทางอื่น"
 tour_grounds_events.7001.c:0 "ข้ากำลังจะพาท่านไปที่นั่นพอดี!"
 tour_grounds_events.7001_followup:0 "เจ้าเหนือหัวของท่านจะตัดสินใจว่าจะทำอย่างไรกับทรัพย์สินที่ซ่อนไว้ของท่าน — ท่านอาจถูกเก็บภาษีเพิ่ม!"
