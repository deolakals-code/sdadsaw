l_english: 
 tournament_events.8000.t:0 "ไมตรีจิตอันดี"
 tournament_events.8000.desc.intro:0 "ขณะที่ข้ากำลังเตรียมตัวสำหรับการประลองที่กำลังจะมาถึง ข้าเห็น [favor_giver_1.GetName] กำลังเรียกข้าพลางโบก [favor_giver_1.Custom('GetRandomFavor')] ไปมา เสนอของกำนัลแทนใจจาก[favor_giver_1.GetHerHis]ให้แก่ข้า"
 tournament_events.8000.desc.mid.two:0 "\n\nก่อนที่ข้าจะได้ทันตอบ [favor_giver_2.GetName] ก็ปรากฏตัวขึ้น ถือ [favor_giver_2.Custom('GetRandomFavor')] ยื่นให้ข้าและยืนกรานให้ข้ารับของกำนัลแทนใจจาก[favor_giver_2.GetHerHis]ไปแทน!"
 tournament_events.8000.desc.mid:0 "ข้ารู้สึกโชคดีที่ได้รับการสนับสนุนและความเสน่หาจาก[favor_giver_1.GetHerHis] การรับของกำนัลนี้จะเป็นเครื่องหมายแสดงความสนใจของข้าที่มีต่อ [favor_giver_1.GetHerHim] ในเชิงเกี้ยวพาราสีและวิถีอัศวิน"
 tournament_events.8000.desc.outro.homo:0 "\n\n[favor_giver_1.GetSheHe]หารู้ไม่ว่า [favor_giver_1.GetWomenMen]หาได้ ทำให้ข้าสนใจไม่..."
 tournament_events.8000.desc.outro:0 "\n\nความสนใจที่[favor_giver_1.GetHerHis]มีต่อข้านั้นดูจริงใจ และไม่มีสิ่งใดจะองอาจเท่าการชนะการประลองเพื่อ[favor_giver_1.GetLadyLord]ผู้สูงศักดิ์อีกแล้ว"
 tournament_events.8000.a:0 "ข้าจะรับไว้ ท่าน[favor_giver_1.GetTitledFirstNameNoTooltip]"
 tournament_events.8000.b:0 "ท่าน[favor_giver_2.GetTitledFirstNameNoTooltip] ช่างมีน้ำใจยิ่งนัก!"
 tournament_events.8000.c:0 "ข้าต้องมุ่งมั่นกับการประลอง"
 handkerchief:0 "ผ้าเช็ดหน้า"
 flower:0 "ดอกไม้"
