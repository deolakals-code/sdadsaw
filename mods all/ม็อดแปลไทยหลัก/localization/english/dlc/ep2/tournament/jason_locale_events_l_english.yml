 jason_locale_events.200.c.slap.tt:0 "องครักษ์ของท่านเข้าแทรกแซง แต่ก็สายเกินไป!"

 jason_locale_events.200.c.won_brawl.tt:0 "สติที่แจ่มใสกว่าของท่านเป็นฝ่ายชนะ!"
 jason_locale_events.200.c.lost_brawl.tt:0 "ถูกคนเมาหยามเกียรติ"


 jason_locale_events.200.d:0 "ชู่ว์ รักษาเกียรติของเจ้าไว้ [drunk_knight.GetFirstNameNoTooltip]"
 jason_locale_events.200.d.tt:1 "ไม่ควรเลือกคำพูดโง่เขลาตอนเมามายเหนือคำสัตย์ปฏิญาณแห่งความภักดี"

