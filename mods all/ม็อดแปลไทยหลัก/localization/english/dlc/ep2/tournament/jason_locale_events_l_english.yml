 drunk_knight_marries_log:1 "[TARGET_CHARACTER.GetTitledFirstName] โผล่ออกมาจากการดื่มกินอย่างหนักพร้อมกับทั้งนายใหม่และการ แต่งงานเข้าสู่ครอบครัวของ[CHARACTER.GetTitledFirstNamePossessive]"
 drunk_knight_beats_log_title:0 "ความน่าสะพรึงกลัวแห่งโรงเตี๊ยม"
 drunk_knight_beats_log:1 "ขณะเมามาย [TARGET_CHARACTER.GetTitledFirstName] ได้ทุบตีนักรบผู้มีชื่อเสียงจำนวนหนึ่งอย่างรุนแรงเพื่อชิงตำแหน่งในหมู่$knight_culture_player_plural_no_tooltip_lowercase$ของ[CHARACTER.GetTitledFirstNamePossessive]"
