 poached_drunk_knight_log:1 "[CHARACTER.GetTitledFirstName] ฉวยโอกาสจากคำสาบานตอนเมาของ[TARGET_CHARACTER.GetTitledFirstNamePossessive]เพื่อแย่งชิงนักรบมาจากเจ้าเหนือหัวของ[TARGET_CHARACTER.GetHerHis]"
 drunk_knight_dies_log_title:0 "เหยื่อแห่งการเฉลิมฉลอง"
 drunk_knight_dies_log:1 "[TARGET_CHARACTER.GetTitledFirstName] ดื่มเหล้าจนตาย [TARGET_CHARACTER.GetHerselfHimself] ขณะกำลังเมาหัวราน้ำกับ [CHARACTER.GetTitledFirstName]"
