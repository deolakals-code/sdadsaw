#TAVERN
 jason_locale_events.200.t:0 "ความภักดี ที่เรอออกมา"
 jason_locale_events.200.desc:0 ""เกียรติยศทุกหยาดหยดของข้า" [drunk_knight.GetFullName]พูดเสียงอ้อแอ้ พลางทำหกใส่[drunk_knight.GetHerselfHimself] "เป็นของท่าน!"\n\nเหล่าคนรับใช้พยายามยับยั้ง[drunk_knight.GetHerHim] เพื่อนๆ ของ[drunk_knight.GetHerHis]ต่างแก้ตัวให้ $knight_culture_player_no_tooltip_lowercase$ขี้เมาผู้นั้นปัดพวกเขาออกไป\n\n"ปล่อยข้า! ไอ้พวกบัดซบ! ท่าน[ROOT.Char.GetTitleTierName] — ปลดปล่อยข้าจากนายผู้ซอมซ่อของข้า! คำสัตย์ของข้าเป็นของท่าน ท่านจะรับข้าหรือไม่?"\n\nเสียงหัวเราะติดอยู่ในลำคอของข้า เพราะ[drunk_knight.GetFirstNameNoTooltip]เป็น$knight_culture_player_no_tooltip_lowercase$ผู้มีชื่อเสียงอย่างแท้จริง ได้รับเกียรติยศสูงส่งจากเจ้าเหนือหัวของ[drunk_knight.GetHerHis] [drunk_knight_liege.GetTitledFirstName]"
 jason_locale_events.200.desc.caution:0 "ความโง่เขลาที่เกิดจากไวน์นี้... อาจ ทำให้ข้าได้ทั้งนักรบผู้ยิ่งใหญ่และศัตรูผู้เคียดแค้น"
 jason_locale_events.200.desc.party:0 "และแน่นอน การสูญเสีย[drunk_knight.GetHerHis]ไปจะ ทำให้[drunk_knight_liege.GetTitleTierName]ไม่พอใจ... แต่ข้าคิดว่าข้าสัมผัสได้ถึงการเฉลิมฉลองครั้ง#EMPประวัติศาสตร์#!ที่กำลังจะมาถึง..."

 jason_locale_events.200.a:0 "พิสูจน์ตัวเองสิ $knight_culture_player_no_tooltip_lowercase$! #EMPดื่ม!#!"
 jason_locale_events.200.a.tt:0 "[drunk_knight.GetFirstNameNoTooltip]ผู้เมามายไร้สติจะพยายามพิสูจน์คุณค่าของ[drunk_knight_liege.GetHerHis]... อย่างไรน่ะหรือ? มีเพียงสุราเท่านั้นที่รู้"
 jason_locale_events.200.a.tt.join:0 "[drunk_knight.GetFirstNameNoTooltip] กลายเป็น$knight_culture_player_no_tooltip_lowercase$ของท่าน กระตุ้นความโกรธาของ[drunk_knight_liege.GetShortUINamePossessive]"
 jason_locale_events.200.a.tt.recruit:0 ""ท่าน[ROOT.Char.GetTitleTierName]เรียกหา เหล่า$knight_culture_player_plural_no_tooltip_lowercase$! พวกเจ้าจะตอบรับหรือไม่?""
 jason_locale_events.200.a.tt.recruit_desc:0 "$knight_culture_player_plural_no_tooltip_lowercase$ขี้เมาเพิ่มเติมได้สาบานตนต่อท่าน"
 jason_locale_events.200.a.tt.join_three:0 "[drunk_knight.GetShortUIName] กลายเป็น$knight_culture_player_no_tooltip_lowercase$ของท่าน"
 jason_locale_events.200.a.tt.recruit_lieges:0 "เจ้าเหนือหัวของข้าราชบริพารใหม่ของท่านต่างโกรธแค้น โดยเฉพาะอย่างยิ่ง [drunk_knight_liege.GetShortUIName]"
 jason_locale_events.200.a.tt.recruit_specific:0 "[extra_knight.GetFirstNameNoTooltip] และ [extra_knight_2.GetFirstNameNoTooltip] ได้สาบานตนต่อท่าน"
 jason_locale_events.200.a.tt.song:0 ""รวมตัวกันทั้งหมด! ข้าจะขับขานเรื่องราวของ[ROOT.Char.GetTitledFirstNameNoTooltip]ผู้ยิ่งใหญ่!""
 jason_locale_events.200.a.tt.song_specific:0 "เสียงขับขานอันเร่าร้อนของ[drunk_knight.GetFirstNamePossessiveNoTooltip]ประกาศคำสัตย์ของ[drunk_knight.GetHerHis]ที่มีต่อท่าน"
 jason_locale_events.200.a.tt.beatings:0 ""อยากเห็นข้าสู้รึ?""
 jason_locale_events.200.a.tt.beatings_specific:0 "[drunk_knight.GetFirstNameNoTooltip] พิสูจน์[drunk_knight.GetHerselfHimself]ด้วยการทุบตีอย่างโหดเหี้ยม"
 jason_locale_events.200.a.tt.marry:0 ""มีเพียงการ แต่งงานเท่านั้นที่จะผนึกสายสัมพันธ์ของเรา!""
 jason_locale_events.200.a.tt.marry_desc:0 "สมาชิกคนหนึ่งใน[house|E]หรือ[close_family|E]ของท่านจะ แต่งงานกับ[drunk_knight.GetUIName]"
 jason_locale_events.200.a.tt.marry_specific:0 "[ROOT.Char.Custom2('RelationToMeShort', surprise_spouse)]ของท่าน [surprise_spouse.GetFirstNameNoTooltip] แต่งงานกับ [drunk_knight.GetFirstNameNoTooltip]"
 jason_locale_events.200.a.tt.death:0 ""ข้าจะดื่มสู้กับท่านแก้วต่อแก้ว ท่าน[ROOT.Char.GetTitleTierName]ของข้า!""
 jason_locale_events.200.a.tt.death_specific:0 "พรสวรรค์ในการดื่มของ[drunk_knight.GetFirstNamePossessiveNoTooltip]... ทำให้[drunk_knight.GetHerHim]ผิดหวัง"

 jason_locale_events.200.b:0 "ขอให้ความภักดีของเจ้าไม่สั่นคลอน... แม้ว่าเจ้าจะโซเซก็ตาม!"
 jason_locale_events.200.b.tt:0 "ประกอบพิธีสาบานตน ซึ่งไม่อาจเพิกถอนได้เมื่อถึงยามเช้า"

 jason_locale_events.200.c:1 "หลีกไป ไอ้โง่ เจ้าเหนือหัวของเจ้าจะได้ยินเรื่องนี้"
 jason_locale_events.200.c.tt:1 "ไอ้คนทรยศขี้เมานี่จะทำอะไรได้? อาเจียนใส่ข้างั้นรึ? [drunk_knight.GetSheHe|U]ไม่ได้อยู่ในสภาพพร้อมสู้สักเท่าไหร่"

 jason_locale_events.200.c.unchallenged:0 "$knight_culture_player_no_tooltip_lowercase$ผู้นั้นยอมถอย"

