# TOURNAMENT GROUNDS

 jason_locale_events.0220.t:0 "ที่ ซึ่งชัยชนะถูกฟูมฟัก"
 jason_locale_events.0220.desc:0 "$knight_culture_player_plural_no_tooltip_lowercase$ของข้ายืนรวมพลกันเพื่อการฝึกฝนประจำวัน ผู้ติดตามของพวกเขาแบกสัมภาระเต็มหลัง [senior_knight.GetTitledFirstName] และตัวข้ายืนอยู่เบื้องหน้าทุกคน\n\n"เหล่า$knight_culture_player_plural_no_tooltip$! สิ่งใดที่พวกเจ้าไม่รู้ จงถามอย่างนอบน้อมเพื่อเรียนรู้" [senior_knight.GetFirstNameNoTooltip]กระตุ้น "ร่วมกัน เราเป็นตัวแทนของ[ROOT.Char.GetTitleAsNameNoTooltip]! ให้เราร่วมกันเตรียมพร้อมสำหรับความรุ่งโรจน์ของเรา"\n\n[senior_knight.GetSheHe|U] หันมาหาข้า [senior_knight.Custom('EyeEyes')]เปล่งประกาย\n\n"โปรดบัญชาพวกเรา""

 jason_locale_events.0220.a:0 "จับตาดูคู่ต่อสู้ของเรา: เรียนรู้จุดอ่อนของพวกเขา"
 jason_locale_events.0220.a.tt:0 "เหล่า$knight_culture_player_plural_no_tooltip_lowercase$เหล่านี้อยู่ที่นี่เพื่อชนะการแข่งขัน ไม่มีสิ่งใดสำคัญไปกว่านี้"

 jason_locale_events.0220.b:0 "ทักษะรึ? ช่างมันเถอะ! เรามาที่นี่ เพื่อให้คนเห็น"


 jason_locale_events.0220.c:0 "ขึ้นอานม้า — ชักดาบออกมา!"
 jason_locale_events.0220.c.tt:0 "เราจะฝึกฝนพละกำลังและปฏิกิริยาตอบสนอง ทั้งบนหลังม้าและบนพื้นดิน"

 jason_locale_events.0220.d:0 "เหล่า$knight_culture_player_plural_no_tooltip$! พิสูจน์ความเฉียบแหลมของพวกเจ้า ทั้งสายตาและสติปัญญา"
 jason_locale_events.0220.d.tt:0 "การฝึกฝนความสามารถทางปัญญาก็มีค่าเท่ากับการเสียเหงื่อไปทั้งวัน"

 jason_locale_events.0220.e:0 "เอาชนะพวกเขาทั้งหมด [senior_knight.GetFirstNameNoTooltip] #EMPเดี๋ยวนี้!#!"
 jason_locale_events.0220.e.tt:0 "ทำให้ทุกคนต้องอ้าปากค้าง! #EMPป้องกันตัวเอง!#!"

