 activity_tournament_host_desc: "$BULLET_WITH_TAB$[prestige_i|E] [prestige|E]\n$BULLET_WITH_TAB$[legitimacy_i] [legitimacy|E]\n$BULLET_WITH_TAB$[stress_loss_i] [stress_loss|E]\n$BULLET_WITH_TAB$[GetTrait('tourney_participant').GetName( GetNullCharacter )] [trait_level_track_xp|E]\n$BULLET_WITH_TAB$[acclaimed_knights|E] ได้รับ [glory|E]"
 activity_tournament_selection_tooltip:1 "เชิญเหล่า $knight_culture_player_plural$ ของท่าน, ไพร่ฟ้าข้าแผ่นดิน, และเพื่อนบ้านเข้าร่วมมหกรรมอันยิ่งใหญ่แห่งการแข่งขัน\n\nรางวัลที่คาดว่าจะได้รับ:\n$BULLET_WITH_TAB$[prestige_i] [prestige|E]\n$BULLET_WITH_TAB$[legitimacy_i] ได้รับ [legitimacy|E]\n$BULLET_WITH_TAB$[stress_loss_i] ลด [stress|E]"
 tournament_contest:0 "การแข่งขัน"
 progress_to_victory:0 "$game_concept_progress_to_victory$"
 progress_to_victory_desc:0 "$game_concept_progress_to_victory_desc$"
 activity_tournament_destination_selection:0 ""
 activity_tournament_guest_help_text:1 "[guests|E] ทุกคนจะมีโอกาสพยายามผ่านเข้ารอบสำหรับ [contest|E] — หากพวกเขามีสิทธิ์ — และเข้าร่วมแข่งขันใน [GetActivityType('activity_tournament').GetName] ต่อไป\n\nแขกที่ไม่มีสิทธิ์อาจเดินเตร็ดเตร่ไปตาม [locales|E] เพื่อรับรางวัลพิเศษและชมการแข่งขันที่เกิดขึ้น"

