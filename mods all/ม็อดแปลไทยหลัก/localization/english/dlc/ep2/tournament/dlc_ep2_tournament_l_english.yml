 ep2_decision_events.0001.t:0 "การฝึกซ้อมประลอง"
 ep2_decision_events.0001.desc:0 ""แล้วท่านก็หันไปทางขวา!" [marshal.GetTitledFirstName] ตะโกน ขณะที่ฟาดดาบของข้าอย่างรุนแรงจนข้าต้องถอยไปสองสามก้าว "พวกเขาจะไม่ออมมือให้ท่านในการประลอง [ROOT.Char.Custom('FormOfAddressForLiege')]" [marshal.GetSheHe] กล่าว พลางเช็ดเหงื่อจากหน้าผากของ [marshal.GetHerHis]\n\n"หากท่านต้องการชนะ ท่านจะแพ้ไม่ได้ แม้ แต่กับข้า ก็ไม่ได้ แม้ แต่ครั้งเดียว""
 ep2_decision_events.0001.a:0 ""#EMP อ๊ากกกก!#!""
