 tournament_training_decision_modifier_desc:0 "ตัวละครนี้ได้ฝึกฝนเพื่อ [GetActivityType('activity_tournament').GetName] ที่กำลังจะมาถึง และจะเริ่มต้นด้วย [progress_to_victory|E] ที่สูงขึ้น"
