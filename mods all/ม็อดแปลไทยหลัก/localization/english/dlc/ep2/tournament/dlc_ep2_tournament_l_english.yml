 ### PHASES

 # TEAM
 tournament_phase_melee:0 "ประจัญบาน"
 tournament_phase_melee_desc:1 "การรบจำลอง ทั้งบนหลังม้าและเดินเท้า ระหว่างสองทีมที่แย่งชิงการควบคุมสนามรบและจับกุมนักรบฝ่ายตรงข้ามเพื่อเรียกค่าไถ่\n\n$tournament_contest_format_team$"
 # TURN
 tournament_phase_archery:0 "ยิงธนู"
 tournament_phase_archery_desc:1 "การแข่งขันยิงธนู ซึ่งผู้เข้าแข่งขัน แต่ละคนยิงธนูใส่เป้าตามจำนวนที่กำหนด โดยมีเป้าหมายเพื่อทำคะแนนให้ได้มากที่สุด\n\n$tournament_contest_formaty_turn$"

 tournament_phase_recital:0 "ขับลำนำ"

 tournament_phase_recital_desc:1 "การแข่งขันกวีนิพนธ์ ซึ่งผู้เข้าแข่งขัน แต่ละคนจะขับขานบทกวีที่ แต่งขึ้นสำหรับโอกาสนี้ต่อหน้าสาธารณชน และได้รับการตัดสินเทียบกับผู้เข้าแข่งขันคนอื่นๆ ทั้งหมด\n\n$tournament_contest_formaty_turn$"
 # VERSUS
 tournament_phase_joust:0 "ประลองทวน"
 tournament_phase_joust_desc:1 "การแข่งขันบนหลังม้า ซึ่งผู้เข้าแข่งขันใช้ทวนประลองกัน พยายาม ทำให้ตกม้าหรือทำคะแนนให้มากกว่าคู่ต่อสู้เพื่อเป็นผู้ยืนหยัดคนสุดท้าย\n\n$tournament_contest_format_versus$\nจำนวน [contest_rounds|e]: 3"
 tournament_phase_duel:0 "ดวลดาบ"
 tournament_phase_duel_desc:1 "ชุดการดวลด้วยอาวุธบนพื้นดิน ซึ่งผู้เข้าแข่งขันพยายามปลดอาวุธหรือทำคะแนนให้มากกว่าคู่ต่อสู้เพื่อเป็นผู้ยืนหยัดคนสุดท้าย\n\n$tournament_contest_format_versus$\nจำนวน [contest_rounds|e]: 3"
 
 tournament_phase_wrestling:0 "มวยปล้ำ"
 tournament_phase_wrestling_desc:2 "การแข่งขันพละกำลังและไหวพริบ ซึ่งผู้เข้าแข่งขันพยายามล้มหรือเหวี่ยงคู่ต่อสู้ออกจากเวทีเพื่อเป็นผู้ยืนหยัดคนสุดท้าย\n\n$tournament_contest_format_versus$\nจำนวน [contest_rounds|e]: 3"
 tournament_phase_board_game:0 "เกมกระดาน"
 tournament_phase_board_game_desc:1 "การแข่งขันประลองปัญญา ซึ่งผู้เข้าแข่งขันเล่นเกมกระดานหลายนัด โดยผู้ชนะสูงสุดคือผู้เล่นคนสุดท้ายที่เหลืออยู่\n\n$tournament_contest_format_versus$\nจำนวน [contest_rounds|e]: 3"
 # RACE
 tournament_phase_horse_race:0 "แข่งม้า"
 tournament_phase_horse_race_desc:1 "กีฬาสำหรับผู้ชม ซึ่งขุนนางและสุภาพสตรีส่งม้าเข้าแข่งขันกัน โดยผู้ชนะคือม้าตัวแรกที่เข้าเส้นชัย\n\n$tournament_contest_format_race$"

 # CEREMONY
 tournament_phase_ceremony:0 "พิธีการ"
 tournament_phase_ceremony_desc:0 "พิธีปิดและการเฉลิมฉลอง!"

 ### OPTIONS

 # ACCOMMODATIONS
 tournament_option_accommodations:0 "ที่พัก"
 tournament_accommodations_bad:0 "กระโจมซอมซ่อ"
 tournament_accommodations_bad_desc:0 "$EFFECT_LIST_BULLET$ เหตุการณ์เชิงลบบางอย่างมีแนวโน้มที่จะเกิดขึ้นมากขึ้น\n\n#weak อะไรสำคัญกว่ากัน ทักษะที่แสดงหรือสถานที่ที่แสดงทักษะนั้น?!#!"
 tournament_accommodations_normal:0 "พลับพลาเรียบง่าย"
 tournament_accommodations_normal_desc:0 "$EFFECT_LIST_BULLET$ น้ำหนักเหตุการณ์ไม่ได้รับผลกระทบ\n\n#weak กุญแจสำคัญของการประลองที่ดีคือการได้พักผ่อนอย่างเต็มที่ในคืนก่อนหน้า#!"
 tournament_accommodations_good:0 "ค่ายพักหรูหรา"
 tournament_accommodations_good_desc:0 "$EFFECT_LIST_BULLET$ เหตุการณ์เชิงลบบางอย่างมีแนวโน้มที่จะเกิดขึ้น #EMP น้อยลง#!\n\n#weak การประลองควรเป็นมากกว่าแค่การแข่งขันกีฬา มันควรเป็น #underline ประสบการณ์#! กีฬาทั้งหมด#!"
 # PRIZES
 tournament_option_prizes:0 "ของรางวัล"
 tournament_prizes_bad:1 "ของรางวัลธรรมดา"
 tournament_prizes_bad_desc:1 "$EFFECT_LIST_BULLET$ [artifacts|E] ที่เป็นรางวัลจะมี [rarity|E] ระดับสามัญ\n\n#weak เรามาที่นี่เพื่อความรักในกีฬา ของประดับเล็กน้อยที่เสนอเป็นเพียงข้ออ้าง#!"
 tournament_prizes_normal:2 "ของรางวัลพอใช้"
 tournament_prizes_normal_desc:1 "$EFFECT_LIST_BULLET$ [artifacts|E] ที่เป็นรางวัลจะมี [rarity|E] ระดับสามัญหรือยอดฝีมือ\n\n#weak แม้เราไม่ได้มาเพื่อของรางวัล แต่การมีทุนพอเดินทางกลับบ้านก็เป็นเป้าหมายที่ใช้ได้จริงมาก#!"
 tournament_prizes_good:2 "ของรางวัลชั้นดี"
 tournament_prizes_good_desc:1 "$EFFECT_LIST_BULLET$ [artifacts|E] ที่เป็นรางวัลจะมี [rarity|E] ระดับยอดฝีมือหรือเลื่องชื่อ\n\n#weak หากไม่มีเดิมพัน การแข่งขันจะมีประเด็นอะไร?#!"
 tournament_prizes_very_good:0 "ของรางวัลชั้นเลิศ"
 tournament_prizes_very_good_desc:0 "$EFFECT_LIST_BULLET$ [artifacts|E] ที่เป็นรางวัลจะมี [rarity|E] ระดับยอดฝีมือ, เลื่องชื่อ, หรือเกริกไกร\n\n#weak รางวัลไม่ใช่แค่ของประดับที่มอบให้ผู้ชนะ แต่เป็นสัญญาณดึงดูดผู้กล้าหาญและใจเด็ดให้เข้าร่วม#!"
 tournament_prizes_splendid:0 "ของรางวัลวิจิตรตระการตา"
 tournament_prizes_splendid_desc:0 "$EFFECT_LIST_BULLET$ [artifacts|E] ที่เป็นรางวัลจะมี [rarity|E] ระดับเลื่องชื่อหรือเกริกไกร\n\n#weak รางวัลที่ดีที่สุดคือรางวัลที่หรูหราจนบดบังรัศมีผู้ชนะ#!"

