 tournament_invite_flavor_contestant:0 "$invite_to_activity_flavor_tournament$ เราจะเริ่มต้นด้วยการประลอง [ROOT.Char.GetInvolvedActivity.GetCurrentPhase.GetPhase.GetName] โอกาสที่จะแสดงทักษะของท่านให้ทุกคนเห็น ข้ารับรอง\n"
 tournament_invite_flavor_standard:0 "$invite_to_activity_flavor_tournament$ เราจะเริ่มต้นด้วยการประลอง [ROOT.Char.GetInvolvedActivity.GetCurrentPhase.GetPhase.GetName] มันควรจะเป็นภาพที่น่าตื่นตาตื่นใจทีเดียว\n"
 
 tournament_invite_flavor_bad_prizes:0 "\nน่าเสียดายที่รางวัลจะเป็นเพียงของเล็กน้อย แต่โอกาสแห่งเกียรติยศนั้นยิ่งใหญ่!\n"
 tournament_invite_flavor_normal_prizes:0 "\nแม้จุดสนใจจะอยู่ที่การฝึกฝนทักษะของเรา แต่ก็จะมีรางวัลที่เหมาะสมสำหรับผู้ชนะ\n"
 tournament_invite_flavor_good_prizes:0 "\nรางวัลจะมีคุณภาพดี หากโอกาสแห่งเกียรติยศส่วนตัวยังไม่เพียงพอที่จะดึงดูดท่าน!\n"
 tournament_invite_flavor_very_good_prizes:0 "\nข้าได้จัดเตรียมรางวัลอันประณีตอย่างแท้จริง เพื่อให้ผู้ชนะได้รับไป!\n"
 tournament_invite_flavor_splendid_prizes:0 "\nจะมีเพียงรางวัลอันเลิศหรูที่สุดเท่านั้นที่จะมอบให้ เป็นผลงานศิลปะที่แท้จริงโดยช่างฝีมือที่ดีที่สุดในอาณาจักรของข้า!\n"

 wedding_invite_flavor_betrothed:0 "ในที่สุด เวลาแห่งการเฉลิมฉลองงานวิวาห์อันยิ่งใหญ่ของเราก็มาถึง ข้ารอคอยท่านอย่างอดทนใน [ROOT.Char.GetInvolvedActivity.GetCurrentPhase.GetLocation.GetName]\n"
 wedding_invite_flavor_host:0 "$invite_to_activity_flavor_wedding$ เฉลิมฉลองการสมรสของ [ROOT.Char.GetInvolvedActivity.GetSpecialGuest('spouse_2').GetCharacter.GetFullName] และข้าใน [ROOT.Char.GetInvolvedActivity.GetCurrentPhase.GetLocation.GetName]\n"
 wedding_invite_flavor_standard:0 "$invite_to_activity_flavor_wedding$ เฉลิมฉลองการสมรสของ [ROOT.Char.GetInvolvedActivity.GetSpecialGuest('spouse_1').GetCharacter.GetFullName] และ [ROOT.Char.GetInvolvedActivity.GetSpecialGuest('spouse_2').GetCharacter.GetFullName] ใน [ROOT.Char.GetInvolvedActivity.GetCurrentPhase.GetLocation.GetName]\n"

 feast_invite_flavor_honor:0 "$invite_to_activity_flavor_feast$ ข้าอยากให้ท่านเป็นแขกผู้มีเกียรติของข้า และนั่งในที่นั่งอันดับแรกที่โต๊ะ\n"
 feast_invite_flavor_standard:0 "$invite_to_activity_flavor_feast$ เราจะร่วมกันเพลิดเพลินกับผลผลิตแห่ง [ROOT.Char.GetPrimaryTitle.GetTierAsNameNoTooltip]\n"

 hunt_invite_flavor_standard:0 "$invite_to_activity_flavor_hunt$ เราจะร่วมกัน ทำให้มันเป็นการละเล่นอันยิ่งใหญ่!\n"
 hunt_invite_flavor_legendary:0 "$invite_to_activity_flavor_hunt$ เราจะร่วมกันต้อน [ROOT.Char.GetInvolvedActivity.GetCurrentPhase.GetLocation.GetTitle.GetDeJureLiege.Custom('GetAnimalType')] สี [ROOT.Char.GetInvolvedActivity.GetCurrentPhase.GetLocation.GetTitle.GetDeJureLiege.Custom('GetLegendaryColor')] ในตำนานให้จนมุม!\n"
 hunt_invite_flavor_dangerous:0 "$invite_to_activity_flavor_hunt$ เราจะร่วมกันล้มสัตว์ร้ายที่อันตราย!\n"
 hunt_invite_flavor_falconry:0 "$invite_to_activity_flavor_hunt$ เหยี่ยวของเราจะจัดการเหยื่อของพวกมันอย่างรวดเร็ว!\n"
 hunt_invite_flavor_nerge: "ข้าได้ส่งเหล่านายพรานที่เก่งที่สุดไปปฏิบัติภารกิจต้อนเหล่าอสูรร้ายที่แข็งแกร่งที่สุดในแผ่นดินเพื่องานเนิร์จของข้า มาร่วมการพิชิตนี้กับข้าสิ!"

