 invite_to_activity_flavor_imperial_debate: "ข้าขอเชิญท่านสู่การโต้วาทีระดับจักรวรรดิ ณ [ROOT.Char.GetInvolvedActivity.GetCurrentPhase.GetLocation.GetName] [ROOT.Char.Custom('GetMyMovement')] จะต้องชนะใจจักรวรรดิให้จงได้!"
 invite_to_activity_flavor_movement_debate_honorary_guest: "การปกครอง[ROOT.Char.Custom('GetMyMovement')]ของท่านได้สิ้นสุดลงแล้ว! จงโต้วาทีกับข้าและพิสูจน์ว่าท่านมีคุณสมบัติที่จะนำพาพวกเรา หรือมิ เช่นนั้นข้าก็ยินดีน้อมรับความรับผิดชอบนี้เอง"
 invite_to_activity_flavor_movement_debate: "ท่านได้รับเชิญให้เข้าร่วมการโต้วาที[ROOT.Char.Custom('GetMyMovementShort')] เพื่อตัดสินหาผู้นำ!"


