 invite_to_activity_flavor_tour:1 "ข้าขอเชิญท่านเข้าร่วมการเดินทางเยือน [ROOT.Char.GetPrimaryTitle.GetBaseNameNoTier] ของข้า โดยเริ่มต้นที่ [ROOT.Char.GetInvolvedActivity.GetCurrentPhase.GetLocation.GetName]"
 invite_to_activity_flavor_feast:1 "ข้าขอเชิญท่านมาร่วมงานเลี้ยงที่ [ROOT.Char.Custom('FortifiedBuilding')] ของข้าใน [ROOT.Char.GetInvolvedActivity.GetCurrentPhase.GetLocation.GetName]"
 invite_to_activity_flavor_hunt:1 "ท่านได้รับเชิญอย่างเป็นทางการให้เข้าร่วมการล่าของข้าใน [ROOT.Char.GetInvolvedActivity.GetCurrentPhase.GetLocation.Custom('GetTerrainLandPlural')] แห่ง [ROOT.Char.GetInvolvedActivity.GetCurrentPhase.GetLocation.GetName]"
 invite_to_activity_flavor_pilgrimage:1 "ข้าขอเชิญท่านเข้าร่วมการจาริกแสวงบุญของข้าไปยัง [ROOT.Char.GetInvolvedActivity.GetCurrentPhase.GetLocation.GetName]"
 invite_to_activity_flavor_playdate:1 "โปรดมายังการชุมนุมของข้า ณ [ROOT.Char.GetInvolvedActivity.GetCurrentPhase.GetLocation.GetName] มันจะเป็นความสำราญยิ่ง และเป็นโอกาสที่จะได้พบปะเด็กคนอื่นๆ!"
 invite_to_activity_flavor_witch_ritual:1 "ถึงเวลาที่เราจะแสดงความเคารพต่อ [ROOT.Char.GetFaith.WitchGodName] อีกครั้ง ท่านจะมายัง [ROOT.Char.GetInvolvedActivity.GetCurrentPhase.GetLocation.GetName] และร่วมในการเปิดเผยหรือไม่?"
 invite_to_activity_flavor_gruesome_festival:1 "ข้าขอเชิญท่านมายัง [ROOT.Char.GetInvolvedActivity.GetCurrentPhase.GetLocation.GetName] เพื่อร่วมพิธีสังเวยอันยิ่งใหญ่เพื่อเป็นเกียรติแด่ [ROOT.Char.GetFaith.PantheonTerm]"
 invite_to_activity_flavor_fallback:0 "ข้าขอเชิญท่านเข้าร่วมกิจกรรมของข้า"
 invite_to_activity_flavor_examination: "ข้าขอเชิญท่านเข้าร่วมการทดสอบของข้า"
 invite_to_activity_flavor_examination_family: "ท่านพึงนำสมาชิกครอบครัวของท่านมาเข้าร่วมในการทดสอบนี้ด้วย"
 invite_to_activity_flavor_festival: "ข้าจะเป็นเกียรติอย่างยิ่งหากท่านมาร่วมงานเฉลิมฉลองกับข้า"
