l_english: 

 holding_torch_modifier: "ยังคงมีใจ"
 holding_torch_modifier_desc: "ตัวละครนี้ยังคงมีใจให้กับผู้ที่ตนหลงรักข้างเดียว ทำให้พวกเขาอ่อนแอลงเล็กน้อย"

 reminiscing_modifier: "รำลึกความหลัง"
 reminiscing_modifier_desc: "ตัวละครนี้ใช้เวลาครุ่นคิดถึงวัยเยาว์ของตน"

 delayed_heartbreak_modifier: "อกหักล่าช้า"
 delayed_heartbreak_modifier_desc: "ตัวละครนี้พยายามจุดไฟรักเก่าให้คุขึ้นมาอีกครั้ง แต่ถูกปฏิเสธ"

 besotted_modifier: "ลุ่มหลง"
 besotted_modifier_desc: "เต็มไปด้วยไฟรักอันเร่าร้อนแห่งวัยเยาว์ ตัวละครนี้หลงใหลในตัวผู้อื่นอย่างแท้จริง"
 
