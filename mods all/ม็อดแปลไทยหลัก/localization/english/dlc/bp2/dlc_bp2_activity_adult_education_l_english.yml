 goliardic_shenanigans_effect_tt: "ท่านเข้าร่วมใน [goliardic_shenanigans|E]!"
 bp2_adult_education.0005.t: "กลายเป็นโมฆะ"
 bp2_adult_education.0005.desc: "ความหวังและความฝันในการเติบโตส่วนบุคคลของข้าถูกบดขยี้\n\nขณะที่ข้านั่งอยู่ในห้องขัง ข้าทำได้เพียงจินตนาการอย่างโหยหาถึงความรู้ทั้งหมดที่ข้าควรจะได้รับ มันคงต้องรอไปอีกครา"
 bp2_adult_education.0005.a: "ในไม่ช้า"
 bp2_adult_education.0009.t: "บทสรุป"
 bp2_adult_education.0009.desc: "นี่ช่างเป็นประสบการณ์อันน่าอัศจรรย์ยิ่งนัก!\n\nเมื่อข้าจากมา ข้ามิอาจจินตนาการได้เลยถึงจำนวนผู้ทรงปัญญาที่ศึกษา ณ [province.GetName] ความลุ่มลึกในความคิด และความกว้างขวางในการค้นคว้าของพวกเขา! เพียงแค่ได้เป็นส่วนหนึ่งในสภาพแวดล้อมเดียวกับพวกเขาก็ ทำให้ข้าเป็นคนที่ดีขึ้นมาก และด้วยความรู้ที่เพิ่งได้รับมาใหม่ ข้าสามารถเดินทางกลับบ้านได้อย่างพึงพอใจยิ่ง"
 bp2_adult_education.0009.desc_teacher_1: "\n\nอย่างไรก็ตาม ระหว่างที่ข้าพำนักอยู่ ข้าได้สนิทสนมกับอาจารย์ท่านหนึ่งของข้า [teacher_1.GetFirstName] และข้ารังเกียจที่จะต้องจากกันไปแล้ว"
 bp2_adult_education.0009.desc_teacher_2: "\n\nในทางกลับกัน อาจารย์ [teacher_2.GetFirstName] ของข้าได้สร้างความประทับใจอย่างยิ่งแก่ข้า และข้าปรารถนาที่จะใช้เวลาร่วมกันมากขึ้น"
 bp2_adult_education.0009.a: "ความรู้คืออำนาจ!"
 bp2_adult_education.0009.b: "[teacher_1.GetFirstNameNoTooltip] จักเป็นส่วนเสริมอันยอดเยี่ยมแก่ [ROOT.Char.Custom('GetCourt')] ของข้า"
 bp2_adult_education.0009.c: "[teacher_2.GetFirstNameNoTooltip], ข้าต้องการให้ท่านสอนข้าเพิ่มเติม!"
 bp2_adult_education.0009.d: "สถานที่ของอาจารย์คืออยู่กับศิษย์ของพวกเขา"
 bp2_adult_education.0009.e: "เราจักติดต่อกันต่อไป"
 imprisoned_adult_education: "[GetActivityType('activity_adult_education').GetName] ถูกขัดจังหวะโดยการคุมขัง"
 imprisoned_adult_education_desc: "[GetActivityType('activity_adult_education').GetName] ของข้าถูกขัดจังหวะเมื่อข้าถูกคุมขังโดย [jailor.GetTitledFirstName]"
 imprisoned_adult_education_desc_second_perspective: "[GetActivityType('activity_adult_education').GetName] ของท่านถูกขัดจังหวะเมื่อท่านถูกคุมขังโดย [jailor.GetTitledFirstName]"
 imprisoned_adult_education_desc_third_perspective: "[GetActivityType('activity_adult_education').GetName] ของ [owner.GetTitledFirstNamePossessive|U] ถูกขัดจังหวะเมื่อ [owner.GetSheHe] ถูกคุมขังโดย [jailor.GetTitledFirstName]"
 completed_adult_education: "สำเร็จ [GetActivityType('activity_adult_education').GetName]"
 completed_adult_education_desc: "ข้าสำเร็จ [GetActivityType('activity_adult_education').GetName] ของข้า ณ [ROOT.Var('education_destination').GetProvince.GetName]"
 completed_adult_education_desc_second_perspective: "ท่านสำเร็จ [GetActivityType('activity_adult_education').GetName] ของท่าน ณ [ROOT.Var('education_destination').GetProvince.GetName]"
 completed_adult_education_desc_third_perspective: "[owner.GetTitledFirstName|U] สำเร็จ [GetActivityType('activity_adult_education').GetName] ของ [owner.GetHerHis] ณ [ROOT.Var('education_destination').GetProvince.GetName]"
 bp2_adult_education.0010.t: "การมาถึง [location.GetBaronyNameExplicitlyNoTooltip]"
 bp2_adult_education.0010.desc_uni: "ในที่สุดข้าก็มาถึงประตูแห่ง [location.GetBaronyNameExplicitly] ที่ตั้งของมหาวิทยาลัยอันเลื่องชื่อ\n\nความรู้ทั้งมวลถูกรวบรวมไว้ภายในโถงอันศักดิ์สิทธิ์เหล่านี้ และปราชญ์ผู้มีชื่อเสียงจากทั่วทุกมุมโลกมาชุมนุมกันในห้องโถงเดียวกันนี้เพื่อรักษาและเพิ่มพูนขุมทรัพย์แห่งปัญญาอันแท้จริง และในไม่ช้าข้าก็จะเข้าร่วมกับพวกเขา!"
 bp2_adult_education.0010.desc_religious: "ในที่สุดข้าก็มาถึงที่นี่ เดินอยู่ในโถงอันศักดิ์สิทธิ์แห่ง [location.GetBaronyNameExplicitly] ศูนย์รวมความรู้อันเป็นที่เคารพนับถือแห่งโลก [location.GetCounty.GetFaith.GetAdjective|U]\n\nข้ามีสิ่งมากมายให้เรียนรู้จากนักบวชชายหญิงผู้ศักดิ์สิทธิ์ที่มาชุมนุมกันระหว่างกำแพงอันน่าเคารพเหล่านี้! แล้วม้วนคัมภีร์และตำราโบราณทั้งหมดเล่า?"
 bp2_adult_education.0010.desc_end: "\n\nแน่นอนว่า ศูนย์กลางวัฒนธรรมที่สำคัญยังเป็นตลาดที่คึกคักและนำเสนอ #EMP สิ่งเบี่ยงเบนความสนใจ#! ทั้งหมดที่นักศึกษาสักคนจะปรารถนาได้..."
 bp2_adult_education.0010.desc_very_very_far: "\n\nขณะที่ข้าพิจารณาความเป็นไปได้ทั้งหมดของข้า ชาวบ้านมองข้าด้วยความสงสัยใคร่รู้และความสับสนปะปนกัน เป็นที่ประจักษ์ว่าไม่ใช่ทุกวันที่พวกเขาจะได้เห็นพวกเราชาว [ROOT.Char.GetCulture.GetCollectiveNounNoTooltip]!"
 bp2_adult_education.0010.a: "ถึงเวลาเริ่มต้นแล้ว"
 # An Intellectual Debate
 bp2_adult_education.1000.t: "การโต้วาทีทางปัญญา"
 bp2_adult_education.1000.desc: "[location.GetBaronyNameExplicitly] มักเป็นเวทีของการโต้วาทีอันเผ็ดร้อนระหว่างอาจารย์และนักศึกษา หลังจากฟังการบรรยายอันกระจ่างแจ้งเป็นพิเศษจากอาจารย์ [teacher.GetTitledFirstName] ของเรา ข้าพบว่าตนเองถูกดึงเข้าไปในการโต้วาที เช่นนั้นกับนักศึกษาอีกคน [student.GetFirstName]\n\n"ไม่! ท่านพูดจาไร้เหตุผล! ท่านกำลังบิดเบือนประเด็นของนักปราชญ์อย่างสิ้นเชิง!" ข้าตะโกน\n\n"#EMP ท่าน#! ต่างหากที่เพ้อเจ้ออย่างสิ้นเชิง!" [student.GetSheHe|U] โต้กลับ\n\nหางตาของข้าเหลือบเห็น [teacher.GetFirstNameNoTooltip] จ้องมองพวกเราด้วยสีหน้าครุ่นคิดบนใบหน้าของ [teacher.GetHerHis]"
 bp2_adult_education.1000.a: "แต่ ดังที่ท่านอาจารย์กล่าวไว้..."
