 adult_education_books_normal_desc: "$EFFECT_LIST_BULLET$เพิ่มความคืบหน้าความสำเร็จของกิจกรรมเล็กน้อย\n$EFFECT_LIST_BULLET$แต้ม [skill|E] แบบสุ่ม\n\n#weak เครื่องมือตามที่กำหนดทั้งหมดเพื่อสำเร็จการศึกษาอย่างราบรื่น#!"
 adult_education_books_good: "หอสมุดแห่งความรู้"
 adult_education_books_good_desc: "$EFFECT_LIST_BULLET$เพิ่มความคืบหน้าความสำเร็จของกิจกรรม\n$EFFECT_LIST_BULLET$[artifact|E] ตำราอันเลื่องชื่อ\n$EFFECT_LIST_BULLET$แต้ม [skill|E] แบบสุ่ม\n\n#weak ศูนย์กลางการศึกษามีตลาดความรู้ที่คึกคัก ท่านไม่อาจพลาดโอกาสในการแลกเปลี่ยนตำราและซื้อเล่มใหม่ๆ มากมายได้!#!"
