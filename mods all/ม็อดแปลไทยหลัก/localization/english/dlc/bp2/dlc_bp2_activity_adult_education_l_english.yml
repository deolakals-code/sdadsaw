 activity_adult_education_selection_tooltip: "เข้าร่วม [GetActivityType('activity_adult_education').GetName] ช่วงเวลา ณ ศูนย์กลางการศึกษาอันมีชื่อเสียง\n\nรางวัลที่คาดว่าจะได้รับ:\n$BULLET_WITH_TAB$[education_trait|E]\n$BULLET_WITH_TAB$แต้ม [skill|E] [diplomacy_i][martial_i][stewardship_i][intrigue_i][learning_i]\n$BULLET_WITH_TAB$[lifestyle_experience|E] [diplomacy_i][martial_i][stewardship_i][intrigue_i][learning_i]"
