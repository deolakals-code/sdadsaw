 bp2_adult_education.1010.b.failure.tt: "ภาษาท้องถิ่นยังคงเป็นปริศนาสำหรับท่าน!"
 bp2_adult_education.1011.t: "ภาษาแห่งความรู้"
 bp2_adult_education.1011.desc: "ผู้คนจากทั่วโลกที่รู้จักมาชุมนุมกันในมหาวิทยาลัยและศูนย์กลางศาสนาเพื่อรับและแบ่งปันความรู้ แต่สิ่งนี้เป็นไปได้เพียง เพราะมีความรู้ร่วมกันในภาษาทั่วไป ซึ่งโดยปกติคือภาษาโบราณบางภาษาของพิธีกรรมที่เต็มไปด้วยอำนาจตามประเพณี\n\nน่าเสียดายที่ข้าไม่คุ้นเคยกับภาษาทางวัฒนธรรมที่พูดใน [location.GetBaronyNameExplicitly] มากนัก ซึ่ง ทำให้การศึกษาของข้ายากขึ้นกว่าที่ควรจะเป็น\n\nมันไม่ใช่ความพยายามที่ง่ายดาย แต่นี่ไม่ใช่สิ่งที่การศึกษาชั้นสูงเป็นเรื่องเกี่ยวกับหรือ?"
