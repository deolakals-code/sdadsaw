 # The Language of the People/of Knowledge/of the Master
 bp2_adult_education.1010.t: "ภาษาของปวงชน"
 bp2_adult_education.1010.desc: "การศึกษาของข้าใน [location.GetBaronyNameExplicitly] ดำเนินไปด้วยดี แต่ข้าอดรู้สึกโดดเดี่ยวเล็กน้อยจากชุมชนรอบข้างไม่ได้\n\nข้าเป็นคนแปลกหน้าในดินแดนที่ไม่คุ้นเคย และภาษาของดินแดนเหล่านี้ [location.GetCounty.GetCulture.GetLanguage.GetName] ที่ชาวบ้านพูดกันในโรงเตี๊ยมและตลาดของเมืองนั้น ช่างแปลกใหม่และลึกลับสำหรับข้า แม้ แต่ในหมู่เพื่อนนักศึกษาและอาจารย์ของข้า หลายคนก็เกิดและเติบโตที่นี่ การสามารถแบ่งปันความรู้กับพวกเขาได้โดยตรงมากขึ้นย่อมจะช่วยปรับปรุงคุณภาพการศึกษาของข้าได้อย่างแน่นอน"
 learned_language_of_uni_log: "[CHARACTER.GetTitledFirstName|U] เรียนรู้ภาษาที่พูดในมหาวิทยาลัย"
 learned_language_of_uni_log_title: "เรียนรู้ภาษามหาวิทยาลัย"
 bp2_adult_education.1010.a: "ข้าต้องศึกษาอย่างหนักเพื่อปรับตัว!"
 bp2_adult_education.1010.b: "บทกวีจักเป็นครูของข้า!"
 bp2_adult_education.1010.c: "ข้ามิอาจวอกแวกกับเรื่องนี้ได้"
 bp2_adult_education.1010.d: "จะมีครูใดดีไปกว่าปวงชนเองเล่า?"
 bp2_adult_education.1010.d.tt: "ท่านพยายามเรียนรู้ภาษาในซ่องโสเภณี โรงเตี๊ยม และตลาด"
 bp2_adult_education.1010.b.success: "ท่านเชี่ยวชาญภาษาท้องถิ่น"
