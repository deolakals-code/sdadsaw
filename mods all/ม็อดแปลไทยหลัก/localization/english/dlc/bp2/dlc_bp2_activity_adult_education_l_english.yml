 activity_adult_education_predicted_cost: "ค่าใช้จ่ายของ [GetActivityType( 'activity_adult_education' ).GetNameNoTooltip] ได้รับผลกระทบหลักจาก [activity_options|E] ที่ท่านเลือก"
 activity_adult_education_desc: "ใช้เวลาหนึ่งภาคการศึกษา ณ ศูนย์กลางการศึกษาอันมีชื่อเสียง เรียนรู้จากผู้ทรงปัญญาที่สุดแห่งแผ่นดิน\n\nนี่เป็นโอกาสในการเติมเต็มช่องว่างทางการศึกษาในวัยเยาว์ของท่าน แต่ยังเป็นการพัฒนาตนเองรอบด้าน พัฒนาทักษะ เรียนรู้ความสามารถใหม่ๆ และสร้างความสัมพันธ์ที่สำคัญอีกด้วย"
 activity_adult_education_host_desc: "$BULLET_WITH_TAB$อาจอัปเกรด [education_trait|E] ของท่าน\n$BULLET_WITH_TAB$อาจได้รับคะแนน [skill|E]\n$BULLET_WITH_TAB$อาจได้รับ [lifestyle_experience|E]\n$BULLET_WITH_TAB$อาจได้รับ [lifestyle_traits|E]\n$BULLET_WITH_TAB$อาจได้รับ [artifacts|E] ตำรา\n$BULLET_WITH_TAB$อาจจ้างวานตัวละครที่มีทักษะสูง\n$BULLET_WITH_TAB$[trait_level_track_xp|E] ของ [GetTrait('confucian_education').GetName( GetNullCharacter )] ที่มหาวิทยาลัย [GetReligionByKey('confucianism_religion').GetAdjective]"
