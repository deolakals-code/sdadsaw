 bp2_adult_education.1012.t: "ภาษาของอาจารย์"
 bp2_adult_education.1012.desc: "[teacher.GetFirstName|U] หนึ่งในอาจารย์ที่ได้รับความเคารพนับถือมากที่สุด ณ [location.GetBaronyNameExplicitly] เป็นชาวต่างชาติอย่างชัดเจน: สำเนียงและกิริยาท่าทางของ [teacher.GetHerHis] เผยให้เห็นว่า [teacher.GetHerHim] เป็นชาว [teacher.GetCulture.GetName]\n\nแม้จะไม่จำเป็นอย่างยิ่งต่อการศึกษาของข้า การเรียนรู้ภาษาแม่ของ [teacher.GetHerHis] จะช่วยส่งเสริมความสัมพันธ์อันเป็นพิเศษกับ [teacher.GetFirstNameNoTooltip] ซึ่งย่อมเป็นการลงทุนที่ดีสำหรับอนาคตอย่างแน่นอน"
