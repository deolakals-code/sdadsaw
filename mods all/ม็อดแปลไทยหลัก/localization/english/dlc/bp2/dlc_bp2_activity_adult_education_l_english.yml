 sic_et_non_log_title: "เขียนตำรา"
 bp2_adult_education.1060.a.crit_success: "การไตร่ตรองของท่านกระจ่างแจ้งมากจนสามารถช่วยเหลือนักวิชาการในอนาคตได้ เช่นกัน"
 bp2_adult_education.1060.a.crit_success.tt: "ทุกอย่างสมเหตุสมผลแล้วตอนนี้"
 bp2_adult_education.1060.a.success: "ท่านรู้สึกฉลาดขึ้นและเข้าใกล้ความจริงมากขึ้น"
 bp2_adult_education.1060.a.success.tt: "ท่านมีความคืบหน้า"
 bp2_adult_education.1060.a.failure: "ท่านเพียงแค่สับสนมากกว่าเดิม"
 bp2_adult_education.1060.a.failure.tt: "ท่านไม่สามารถเข้าใจมันได้"
 sic_et_non_book_name: "ใช่และไม่ใช่"
 sic_et_non_book_desc: "ตำราเล่มนี้เป็นผลมาจากการไตร่ตรองทางเทววิทยาและปรัชญาของ [book_creator.GetTitledFirstNamePossessive] ขณะศึกษา ณ [location.GetBaronyNameExplicitly]\n\nมันบรรจุการอภิปรายที่ลึกซึ้งและชัดเจนเกี่ยวกับความขัดแย้งของเทววิทยา [book_creator.GetFaith.GetAdjective] และวิธีที่ดีที่สุดในการประนีประนอมความขัดแย้งเหล่านั้น"
 bp2_adult_education.1060.b.tt: "คำถามคืออะไรอีกครั้งนะ?"
 # The Debate
 bp2_adult_education.1070.t: "การโต้วาที"
 bp2_adult_education.1070.desc: "การสอน ณ [location.GetBaronyNameExplicitly] ส่วนใหญ่เกิดขึ้นในรูปแบบการพูด และนักศึกษาได้รับการส่งเสริมให้ฝึกฝนความสามารถทางวาทศิลป์และแสดงความก้าวหน้าในการเรียนรู้ในการโต้วาทีต่อหน้าเพื่อนร่วมรุ่นและอาจารย์\n\nวันนี้ [teacher.GetFirstName] ได้ขอให้ข้าและ [student.GetFirstName] ยืนหยัดในฝ่ายตรงข้ามในหัวข้อ [teacher.Custom('EruditeTopic')] เพื่ออภิปรายกัน"
 bp2_adult_education.1070.a: "ให้ข้าเริ่มต้นจาก [ROOT.Char.GetFaith.ReligiousText|U] ดังที่ทุกคนทราบ..."
 bp2_adult_education.1070.b: "ข้ามิอาจกล่าวว่าท่านไม่ผิด แต่ข้าจะโกหกหรือไม่หากข้าทำ เช่นนั้น?"
 bp2_adult_education.1070.c: "ข้าคิดว่า [student_2.GetFirstNameNoTooltip] ต้องการลอง!"
 won_a_debate_log: "[CHARACTER.GetTitledFirstName|U] เอาชนะ [TARGET_CHARACTER.GetFirstName] ในการโต้วาทีทางวิชาการระหว่างชั้นเรียน"
 won_a_debate_log_title: "การโต้วาทีในชั้นเรียน"
 bp2_adult_education.1070.a.success: "จุดยืนของท่านแข็งแกร่งกว่า"
 bp2_adult_education.1070.a.success.tt: "ท่านชนะการโต้วาที!"
 bp2_adult_education.1070.a.failure: "ท่านสู้ไม่ได้"
 bp2_adult_education.1070.a.failure.tt: "ท่านแพ้การโต้วาที!"
 bp2_adult_education.1070.b.success: "ท่าน ทำให้สถานการณ์ยุ่งเหยิงอย่างมีวาทศิลป์เพียงพอให้คู่ต่อสู้ของท่านยอมจำนน"
 bp2_adult_education.1070.b.failure: "ท่านไม่สามารถ ทำให้ความคิดของ [student.GetFirstNamePossessiveNoTooltip] สับสนได้"
 # A Matter of Faith?
 bp2_adult_education.1080.t: "ปัญหาเรื่องศรัทธา?"
 bp2_adult_education.1080.desc: "[location.GetBaronyNameExplicitly] เป็นศูนย์กลางการศึกษาอันมีชื่อเสียงที่ต้อนรับทั้งอาจารย์และนักศึกษาจากแดนไกลและใกล้\n\nข้าแทบไม่ได้คิดถึงเรื่องนี้มากนัก จนกระทั่งวันนี้ เมื่อการอ้างอิงทางศาสนาจาก [teacher.GetFirstName] กระทบใจข้าอย่างแรงว่าเป็นการดูหมิ่นศาสนาและขัดต่อทุกสิ่งที่ข้าเคยได้รับการสอนมาในชีวิต มันเปิดเผยว่า [teacher.GetHerHim] เป็น [teacher.GetFaith.GetAdherentNameNoTooltip] เป็น [ROOT.Char.Custom2('GetUnbelieverTerm', teacher)] จริงๆ และข้าไม่รู้ว่าจะรู้สึกอย่างไรกับเรื่องนี้"
 bp2_adult_education.1080.a: "ข้าไม่ใส่ใจตราบใดที่ [teacher.GetSheHe] มีบางสิ่งที่จะสอน"
 bp2_adult_education.1080.b: "เป็นหน้าที่ [ROOT.Char.GetFaith.GetReligion.GetAdjectiveNoTooltip] ของข้าที่จะต้องแกล้ง [ROOT.Char.Custom2('GetUnbelieverTerm', teacher)]!"
 bp2_adult_education.1080.c: "[teacher.GetFaith.GetAdherentNameNoTooltip] จะสอนสิ่งใดที่มีค่าแก่ข้าได้อย่างไร?!"
 bp2_adult_education.1080.d: "บางที [teacher.GetSheHe] อาจมีคำตอบที่ข้าขาดหายไป..."
 bp2_adult_education.1080.e: "เช่นนั้น [teacher.GetFirstNameNoTooltip] ต้องมีอะไรอีกมากที่จะสอน!"
 bp2_adult_education.1080.b.tt: "การแกล้งมีผลลัพธ์ที่ไม่คาดคิด"
 # To Have a Gander
 bp2_adult_education.1090.t: "ลองพิจารณาดู"
 bp2_adult_education.1090.desc: ""วันนี้" อาจารย์ [teacher.GetFirstName] ของเราเริ่มต้น "เราจะตรวจสอบกายวิภาคของเหยี่ยว"\n\nเสียงพึมพำอย่างตื่นเต้นแพร่กระจายไปทั่วห้องบรรยาย ขณะที่เราทุกคนชื่นชมนกที่สวมหมวกคลุม ซึ่งยืนอย่างภาคภูมิใจบนแขนที่สวมถุงมือของอาจารย์\n\n"มีหลายสิ่งสามารถเรียนรู้ได้จากการศึกษาร่างกายของสัตว์ ดังที่คนโบราณสอนเราไว้ มีใครต้องการช่วยข้าสาธิตการชำแหละหรือไม่?""
 bp2_adult_education.1090.a: "ข้าอาสาช่วย!"
 bp2_adult_education.1090.a.tt: "การกระทำนี้ขัดแย้งกับความเชื่อของท่าน"
 bp2_adult_education.1090.b: "อาจารย์ ให้ข้าจัดการกับสัตว์ตัวนั้น..."
 bp2_adult_education.1090.b.tt: "ท่านถอดหน้ากากมันออกอย่างรวดเร็วและปล่อยมันเป็นอิสระในชั้นเรียนเพื่อศึกษาความโกลาหลที่ตามมา!"
 bp2_adult_education.1090.c: "น่าสนใจยิ่งนัก"

