 you_are_hampered: "การศึกษาของท่านถูกขัดขวาง"
 
 bp2_adult_education.9100.t: "งานเลี้ยงของชาวนา"
 bp2_adult_education.9100.desc: "ข้าถูกเบี่ยงเบนความสนใจจากการศึกษาตอนเที่ยงคืนอย่างกะทันหันด้วยเสียง #EMP *โครม*#! ดังลั่น เสียง #EMP *ปัง*#! ที่ดังจนหูแทบดับ และเสียง #EMP *แตก*#! ที่ฟังดูมีราคาแพง เกิดอะไรขึ้นกันแน่!?\n\nต้นตอของความวุ่นวายดูเหมือนจะเป็นชาวนาสองคน [ROOT.Char.GetFaith.HighGodName] ทรงทราบว่าพวกเขาเข้ามาที่นี่ได้อย่างไร กำลังซดถัง [ROOT.Char.Custom('GetExpensiveDrink_Singular')] ของมหาวิทยาลัยอย่างตะกละตะกลาม!\n\n"นี่จะเป็นการ #EMP *อึก*#! สั่งสอนพวกมัน!" คนหนึ่งตะโกน "ใช่ พวกมันคิดว่าตัวเองดีกว่าเราเพียง เพราะพวกมัน #EMP อ่านออก!#!" อีกคนตามมา"
 bp2_adult_education.9100.read: "วิญญาณผู้น่าสงสารและโชคร้าย... ข้าจะดูแลให้พวกเจ้าเรียนรู้วิธีอ่าน!"
 bp2_adult_education.9100.a: "ข้าอาจใช้คนรับใช้บางคนเพื่อแบกตำราทั้งหมดของข้า..."
 bp2_adult_education.9100.b: ""ชาวนา — เอาถ้วยมาเพิ่มให้เรา ข้ากำลังไปตามนักศึกษาคนอื่นๆ!""
 bp2_adult_education.9100.c: "ควรบอกอาจารย์ก่อนที่พวกเขาจะทำลายสถานที่..."
 changed_my_life_opinion: "เปลี่ยนชีวิตข้า"
 
 bp2_adult_education.9200.t: "พักการเรียนอันเร่าร้อน"
 bp2_adult_education.9200.desc: "ห้องสมุดว่างเปล่า ยกเว้นข้าและ [student_flirt.GetFirstName] ข้าอ่านหน้าเดิมใน [SCOPE.Custom('RandomInformativeTextName')] ซ้ำแล้วซ้ำเล่า แต่มันไร้ประโยชน์ — ข้าไม่มีสมาธิ\n\nไม่ใช่เมื่อ [student_flirt.GetSheHe] ยังคงกัดปลายปากกาขนนกของ [student_flirt.GetHerHis] เบาๆ ขณะที่ค่อยๆ ลูบนิ้วไปตาม [student_flirt.Custom('ObjectifiedFeature')] ของ [student_flirt.GetHerHis] — และ [student_flirt.GetSheHe] ยังคงมองข้า #EMP ตรงๆ ในดวงตา#! ขณะทำ เช่นนั้น!\n\n"ข้าคิดว่าเราสมควรได้... พักผ่อนนะ [ROOT.Char.Custom('RomanticComplimentNoun')] ของข้า?" [student_flirt.GetSheHe|U] ครางเบาๆ"
 bp2_adult_education.9200.a: "ต้อง. จดจ่อ. กับ. ตำรา."
 bp2_adult_education.9200.b: ""ต้องการทำมันบนหลังคามหาวิทยาลัยหรือไม่?""
 bp2_adult_education.9200.c: "ข้าเดาว่าถึงเวลาสำหรับการศึกษากายวิภาคเชิงปฏิบัติแล้ว!"
 bp2_adult_education.9200.d: "นี่มันไร้ประโยชน์... ข้าต้องการพักผ่อน..."
 blew_off_some_steam_opinion: "ได้ปลดปล่อยความเครียดร่วมกัน"
 
 bp2_adult_education.9300.t: "แนวคิดประหลาด"
 bp2_adult_education.9300.desc: ""ฟังข้า!" [eccentric_student.GetFirstName] ตะโกนอย่างบ้าคลั่ง "หากท่านอ่านระหว่างบรรทัดใน [SCOPE.Custom('RandomInformativeTextName')] มันชัดเจน ท่านเพียงแค่ต้องรวม [eccentric_student.Custom('ThrowableObjectArticle')], [eccentric_student.Custom('RandomWeirdObject')] และ [eccentric_student.Custom('GetObjectToBalanceOnNose')] — ทั้งหมดนี้ ในขณะที่ยึดมั่นในหลักการของ [eccentric_student.Custom('EruditeTopic')] — เชื่อข้าเถอะ #EMP มันจะได้ผล!#!"\n\nบางทีมันอาจไม่ใช่ความคิดที่ดีสำหรับ [eccentric_student.GetFirstNameNoTooltip] ที่จะศึกษาต่อเนื่องสามสิบหกชั่วโมง..."
 bp2_adult_education.9300.eccentric: "มันประจักษ์ชัดในตัวเอง!"
 bp2_adult_education.9300.a: "ข้าไม่มีเวลาสำหรับเรื่องไร้สาระของท่าน [eccentric_student.GetFirstNameNoTooltip]"
 bp2_adult_education.9300.b: "บอกข้าอีก! บอกข้า #EMP ทุกอย่าง!#!"
 bp2_adult_education.9300.c: "ข้า... แค่จะไป"
 
 bp2_adult_education.9400.t: "การมาเยือนจาก [local_ruler.GetTitleAsNameNoTooltip]"
 bp2_adult_education.9400.desc: ""นักศึกษาโปรดทราบ!" อาจารย์ [teacher.GetFirstName] ของข้าตะโกน โดยมี [local_ruler.GetTitledFirstName] ติดตามมา "ผู้อุปถัมภ์ของเรา [local_ruler.GetTitledFirstNameNoTooltip] ได้เสด็จมาเยือนเรา — [local_ruler.GetSheHe] คือผู้ปกครองดินแดนเหล่านี้ — จงประพฤติตนให้ดีที่สุด!"\n\n"อา ท่านกำลังโต้วาทีเรื่อง [local_ruler.Custom('education_conversation_subject')] รึ? ข้าค่อนข้างชอบหัวข้อนั้น เช่นกัน! ข้าหวังว่าการศึกษาของท่านจะดำเนินไปด้วยดี" [local_ruler.GetTitleAsNameNoTooltip] กล่าวขณะ [local_ruler.Custom('quirk_pos_pp')]\n\n[local_ruler.GetTitleAsNameNoTooltip] มีอำนาจในการมอบสิทธิพิเศษให้กับนักศึกษา เช่นข้า บางทีข้าควรใช้โอกาสนี้ในการพูด..."
 bp2_adult_education.9400.friend: ""เป็นความยินดียิ่งที่ได้พบท่านอีกครั้ง!""
 bp2_adult_education.9400.liege: ""อา ข้าในบังคับผู้ภักดีของข้า ท่านจะกรุณาเตือนทุกคนได้หรือไม่ว่าข้าคือใคร?""
 bp2_adult_education.9400.tier: ""ท่านควรได้รับเกียรติที่มี [root_scope.GetTitleAsNameNoTooltip] เข้าร่วม!""
 bp2_adult_education.9400.tier.toast: "[root_scope.GetTitleAsNameNoTooltip] เยือนมหาวิทยาลัยของท่าน"
 bp2_adult_education.9400.gold_lots: ""ข้าปรารถนาที่จะบริจาคอย่างใจกว้าง!""
 bp2_adult_education.9400.gold_lots.toast: "นักศึกษามหาวิทยาลัยบริจาคทองคำจำนวนมาก"
 bp2_adult_education.9400.drink: ""ช่างไม่น่าสนใจเสียจริง ข้าจะเข้าเมือง!""
 bp2_adult_education.9400.gold: ""โปรดรับของขวัญอันต่ำต้อยนี้ด้วย""
 bp2_adult_education.9400.gold.toast: "นักศึกษามหาวิทยาลัยบริจาคทองคำ"
 bp2_adult_education.9400.nothing: ""ท่านช่าง [local_ruler.Custom('ComplimentAdjective')] ยิ่งนัก""
