 bp2_adult_education.9000.t: "วิทยากรรับเชิญ"
 bp2_adult_education.9000.desc: ""นักศึกษาทั้งหลาย วันนี้เรามีวิทยากรผู้ทรงเกียรติมาร่วมกับเรา!" อาจารย์ [teacher.GetFirstName] ของข้าอุทาน "ขอต้อนรับ [guest_speaker.GetFullName] — ผู้มีอำนาจสูงสุดในหลักคำสอน [guest_speaker.GetFaith.GetAdjective] ใน [location.GetName]"\n\n"สวัสดี" [guest_speaker.GetFirstNameNoTooltip] เริ่มต้นอย่างเคร่งขรึม ขณะที่ [guest_speaker.Custom('quirk_pos_pp')] "วันนี้เราจะสำรวจ [guest_speaker.Custom('education_conversation_subject')] และความเชื่อมโยงกับธรรมชาติของ [guest_speaker.GetFaith.HighGodName]"\n\nนักศึกษาคนอื่นๆ ยืดหลังตรงและเตรียมปากกาขนนก นี่คงจะใช้เวลาสักพัก"
 bp2_adult_education.9000.a: "อะไรนะ!? นั่นมันความคิดนอกรีต!"
 bp2_adult_education.9000.a.success: "ท่านทำลาย [guest_speaker.GetFirstNameNoTooltip] ด้วย #EMP ข้อเท็จจริง#! และ #EMP ตรรกะ#!"
