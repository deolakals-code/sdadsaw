 adult_education_books_bad_desc: "$EFFECT_LIST_BULLET$ลดค่าใช้จ่าย [gold|E]\n\n#weak เดินทางตัวเปล่าและจดจำสิ่งที่เรียนรู้ไว้ในใจ ใครเล่าต้องการมากกว่านี้?#!"
