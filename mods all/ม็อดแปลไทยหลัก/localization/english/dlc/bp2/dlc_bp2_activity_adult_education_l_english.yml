 learned_language_of_teacher_log_title: "เรียนรู้ภาษาของอาจารย์"
 bp2_adult_education.1012.a: "สิ่งนี้จักนำพาข้าเข้าใกล้อาจารย์ผู้ทรงคุณวุฒิยิ่งขึ้น!"
