 # The Goliards
 bp2_adult_education.1020.t: "เหล่าโกเลียร์ด"
 bp2_adult_education.1020.desc: "ขณะที่ข้ากำลังออกจากชั้นเรียนหลังจากการเรียนอันลึกซึ้งและกระตุ้นความคิดโดย [teacher.GetFirstName] ความสนใจของข้าถูกดึงดูดโดยเสียงหัวเราะและกรีดร้องอันโกลาหลที่ดังมาจากข้างนอก"
 bp2_adult_education.1020.desc.lusty_poetry: "\n\nกลุ่มนักศึกษาอันอึกทึกครึกโครมนำโดย [student.GetFirstName] กำลังใกล้เข้ามา ทุกคนกำลังร้องเพลง #EMP ลามกอนาจาร#! เกี่ยวกับการผจญภัยทางเพศของพวกเขา — และค่อนข้างละเอียดทีเดียว หากข้าจะกล่าว เช่นนั้น"
 bp2_adult_education.1020.desc.drinking_poetry: "\n\n[student.GetFirstName] ซึ่งเห็นได้ชัดว่ามึนเมาและแทบจะยืนไม่อยู่บนเท้าของ [student.GetHerHis] กระนั้นก็ยังคงสร้างความพึงพอใจให้กับฝูงชนที่โห่ร้องด้วยบทกวีอันสละสลวยเกี่ยวกับความสุขของการดื่ม ซึ่งเป็นที่ทราบกันดีในหมู่นักบวชท้องถิ่น"
 bp2_adult_education.1020.desc.satyre_poetry: "\n\nสิ่งที่ข้าสามารถอธิบายได้ว่าเป็น #EMP ขบวนแห่#! ของนักศึกษากำลังใกล้เข้ามา โดยมี [student.GetFirstName] เป็นผู้นำ ขณะที่พยายามทำหน้าเฉย พวกเขาสลับกันอ้างคำพูดจาก [location.GetCounty.GetFaith.ReligiousText] และบทล้อเลียนพิธีกรรมอันเป็นการดูหมิ่นศาสนา"
 bp2_adult_education.1020.desc.carmina_burana: "\n\n"#EMP O Fortuna velut luna statu variabilis, semper crescis aut decrescis#!" [student.GetFirstName] ร้องเพลง ล้อมรอบด้วยฝูงชนที่โห่ร้อง"
 bp2_adult_education.1020.desc.dice: "\n\nกลุ่มนักศึกษาอันอึกทึกครึกโครมล้อมรอบ [student.GetFirstName] และบุคคลอื่นที่ข้าไม่รู้จัก ซึ่งกำลังเล่นลูกเต๋าอยู่บนบันไดไปยัง [location.Custom('GetLocationFaithTemple')]"
 bp2_adult_education.1020.desc.donkey: "\n\n[student.GetFirstName] กำลังจูง #EMP ลา#! ตัวหนึ่งไปพร้อมกับร้องเพลงสรรเสริญมัน ฝูงชนนักศึกษาตอบกลับว่า "ฮี่ฮ่อ ท่านลา ฮี่ฮ่อ!" หลังจบ แต่ละบรรทัด"
 bp2_adult_education.1020.desc.end: "เมื่อพวกเขาสังเกตเห็นข้า พวกเขาก็ร้องตะโกนใส่ข้าว่า: "ร่วมกับเรา! ร่วมกับเรา!"\n\nสีหน้าบึ้งตึงบนใบหน้าของ [teacher.GetFirstNamePossessiveNoTooltip] บ่งบอกความคิดของ [teacher.GetHerHis] เกี่ยวกับเรื่องทั้งหมดได้อย่างชัดเจน"
 participated_in_goliardy_log: "[CHARACTER.GetTitledFirstName|U] ติดตาม [TARGET_CHARACTER.GetFirstName] และเหล่าโกเลียร์ดคนอื่นๆ ในการเฉลิมฉลองของพวกเขา"
 participated_in_goliardy_log_title: "เข้าร่วมกับเหล่าโกเลียร์ด"
 bp2_adult_education.1020.a: "นี่มัน #EMP น่าขุ่นเคืองยิ่งนัก#!!"
 bp2_adult_education.1020.b: "เหตุใดจะไม่เล่า...?"
 bp2_adult_education.1020.c: "ท่านต้องถามด้วยรึ?"
 bp2_adult_education.1020.d: "บางทีคราวหน้า"
 goliard_shenanigans_get_lovers_pox.tt: "ท่านติด [GetTrait('lovers_pox').GetName( GetNullCharacter )]"
 bp2_adult_education.1020.c.tt: "ท่านเข้าไปพัวพันกับการเล่นตลกที่แท้จริง!"
 bp2_adult_education.1020.b.tt: "การได้ลิ้มรส "วิถีชีวิตแบบโกเลียร์ด" ทั้งหมดนี้คงไม่เลวร้ายนัก ใช่หรือไม่?"
 # One of the GirlsBoys
 bp2_adult_education.1030.t: "หนึ่งใน [ROOT.Char.Custom('GirlBoyPlural')|U]"
 bp2_adult_education.1030.desc: "มหาวิทยาลัยและศูนย์กลางการศึกษาชั้นสูงเป็นแหล่งรวมสังคมที่คึกคักอยู่เสมอ\n\nในโถงอันศักดิ์สิทธิ์เหล่านี้ นักศึกษาทุกคนล้วนเป็นเพื่อนร่วมรุ่น เป็นผู้ฝึกหัดบนเส้นทางสู่ความรู้ ซึ่งเป็นเหตุผลว่าเหตุใดการผูกมิตรและรู้สึกเป็นส่วนหนึ่งของชุมชนจึงเป็นประโยชน์"
 bp2_adult_education.1030.desc_alcohol: "\n\nอย่างน้อยนี่คือความคิดแรกของข้าเมื่อ [student.GetFirstName] เข้ามาหาข้า กลิ่น [student.Custom('RegionalAlcoholicDrink')] โชยมาจากลมหายใจของ [student.GetHerHis]\n\n"มาร่วมกับข้าและสหายของข้าเถิด [ROOT.Char.GetFirstNameNoTooltip]! พิสูจน์ให้เราเห็นถึงความแข็งแกร่งของ [ROOT.Char.GetTitleAsNameNoTooltip] ด้วยการดื่มให้มากกว่าผู้ใด แล้วเราจักถือว่าท่านเป็นพวกเดียวกับเรา!""
 bp2_adult_education.1030.desc_fallback: "\n\nอย่างน้อยนี่คือความคิดแรกของข้าเมื่อ [student.GetFirstName] เข้ามาหาข้า รอยยิ้มอันน่าสงสัยปรากฏบนใบหน้าของ [student.GetHerHis]\n\n"มาร่วมกับข้าและสหายของข้าเถิด [ROOT.Char.GetFirstNameNoTooltip]! พิสูจน์ให้เราเห็นถึงความทรหดอดทนของ [ROOT.Char.GetTitleAsNameNoTooltip] ด้วยการสังสรรค์ตลอดทั้งคืน! แล้วเราจักถือว่าท่านเป็นพวกเดียวกับเรา!""
 bp2_adult_education.1030.a: "...บางที?"
 bp2_adult_education.1030.b: "จัดมาเลย!"
 bp2_adult_education.1030.b.tt: "พวกเขาประทับใจในตัวท่าน!"
 bp2_adult_education.1030.a.success: "นักศึกษาคนอื่นๆ โห่ร้องเรียกชื่อท่าน"
 bp2_adult_education.1030.a.success.tt: "พวกเขาชอบท่าน"
 bp2_adult_education.1030.a.failure: "นักศึกษาคนอื่นๆ หัวเราะเยาะความพยายามอันน้อยนิดของท่าน"
 bp2_adult_education.1030.a.failure.tt: "ท่านมิได้สร้างความประทับใจให้พวกเขา"
 bp2_adult_education.1030.c: "ไม่ล่ะ ขอบใจ"
 one_of_the_boys_log: "[CHARACTER.GetTitledFirstName|U] สร้างความประทับใจให้เพื่อนนักศึกษา [TARGET_CHARACTER.GetFirstName] ของ [CHARACTER.GetHerHis] ด้วยการเฉลิมฉลองของ [CHARACTER.GetHerHis]"
 one_of_the_boys_log_title: "หนึ่งในพวกเรา"
 # Schools of Thought
 bp2_adult_education.1040.t: "สำนักคิด"
 bp2_adult_education.1040.desc: "ห้องโถงของมหาวิทยาลัย [location.GetBaronyNameExplicitly] มักดังก้องไปด้วยการโต้วาทีของนักศึกษาและอาจารย์ ซึ่งบางครั้งบานปลายกลายเป็นคู่แข่งอันฉาวโฉ่ เช่นระหว่าง [teacher_1.GetFirstName] และ [teacher_2.GetFirstName]\n\nเมื่อข้าพบพวกเขาวันนี้ พวกเขา — ตามปกติ — กำลังตะโกนใส่กัน พยายามพิสูจน์ว่าสาขาวิชาของใครมีความพร้อมมากกว่าในการอภิปรายเรื่อง [teacher_1.Custom('EruditeTopic')] อย่างไรก็ตาม สิ่งที่ไม่ปกติคือพวกเขาสังเกตเห็นข้ากำลังเดินเข้ามาและขอให้ #EMP ข้า#! แสดงจุดยืน"
 bp2_adult_education.1040.a: "[teacher_1.GetFirstNameNoTooltip] ถูกต้อง"
 bp2_adult_education.1040.b: "[teacher_2.GetFirstNameNoTooltip] แสวงหาความรู้อันทรงคุณค่าที่สุด"
 bp2_adult_education.1040.c: "มีคุณูปการอันยิ่งใหญ่ในทั้งสองสาขาวิชา"
 bp2_adult_education.1040.c.success: "พวกเขาเชื่อและพอใจกับวิทยานิพนธ์ของท่าน"
