 # Foreigners in This Land
 bp2_adult_education.1050.t: "ชาวต่างชาติในดินแดนนี้"
 bp2_adult_education.1050.desc: "[location.GetBaronyNameExplicitly] เป็นศูนย์กลางการศึกษาที่ดึงดูดนักศึกษาจากทั่วทุกมุมโลกอย่างแท้จริง!\n\nความตระหนักนี้เกิดขึ้นกับข้าขณะที่ข้าครุ่นคิดว่าตัวข้าเองและเพื่อนผู้แสวงหาความรู้อีกหลายคน รวมถึง [student_1.GetFirstName] และ [student_2.GetFirstName] ล้วนเป็นชาวต่างชาติใน [location.GetBaronyNameExplicitlyNoTooltip] ข้าสงสัยว่าจะมีทางใดที่ข้าจะใช้ประโยชน์จากสิ่งนี้ได้หรือไม่..."
 bp2_adult_education.1050.a: "เราทุกคนสามารถเรียนรู้จากกันและกันได้!"
 bp2_adult_education.1050.b: "ดื่มอวยพรให้กับความแตกต่างของเรา!"
 bp2_adult_education.1050.c: "ข้ามาที่นี่เพื่อศึกษาเท่านั้น"
 # Yes and No
 bp2_adult_education.1060.t: "ใช่และไม่ใช่"
 bp2_adult_education.1060.desc: "การศึกษาเชิงลึกของข้าในหลักคำสอน [ROOT.Char.GetFaith.GetAdjective] ณ [location.GetBaronyNameExplicitly] ทำให้ข้าเผชิญกับคำถามใหม่ๆ มากมาย ซึ่งไม่ใช่ทั้งหมดที่มีคำตอบชัดเจน บางคำถามดูเหมือนจะมีคำอธิบายที่ขัดแย้งกันด้วยซ้ำ!\n\nศรัทธาควรจะสมบูรณ์ด้วยเหตุผลหรือไม่?\nศรัทธาเกี่ยวข้องกับสิ่งที่มองไม่เห็นเท่านั้นหรือไม่?\nเราสามารถรู้สิ่งที่มองไม่เห็นได้หรือไม่?\n\n#EMP ใช่หรือไม่ใช่?!#!"
 bp2_adult_education.1060.a: "ต้องมีความหมายในความขัดแย้งเหล่านั้น..."
 bp2_adult_education.1060.b: "คำตอบต้องมาจากประสบการณ์เชิงประจักษ์!"
 bp2_adult_education.1060.c: "ข้าปวดศีรษะ"
 bp2_adult_education.1060.a.tt: "ท่านได้รับวัตถุโบราณประเภทตำรา"
