l_english: 
 
 # My Favorite Councilor

 bp2_yearly_extra.0001.t: "ที่ปรึกษาคนโปรดของข้า"
 bp2_yearly_extra.0001.desc: "น่าหลงใหลและน่าสนใจยิ่งนัก ข้าได้เฝ้าดูสภาทำงาน และที่ปรึกษาผู้หนึ่งโดยเฉพาะ [ROOT.Char.Custom2( 'RelationToMe', target_councilor )], [target_councilor.GetTitledFirstName], ได้ดึงดูดความสนใจของข้า\n\nเป็นที่ประจักษ์แก่ข้าว่าเรามีความปรารถนาในสิ่งเดียวกัน ข้าพบว่าตนเองใช้เวลาอยู่กับสภามากขึ้นเรื่อยๆ"
 bp2_yearly_extra.0001.a: "ข้าอยากจะช่วยงาน!"
 bp2_yearly_extra.0001.a.tt: "ช่วยงานหรือสร้างความวุ่นวาย? การลงมือทำด้วยตนเองจะ ทำให้ท่านได้เรียนรู้ "
 bp2_yearly_extra.0001.b: "ข้าเพียงชอบดูพวกเขาทำงาน"
 bp2_yearly_extra.0001.b.tt: "การยืนดูอยู่ห่างๆ และจดบันทึกไว้ย่อมปลอดภัยกว่าเสมอ"
