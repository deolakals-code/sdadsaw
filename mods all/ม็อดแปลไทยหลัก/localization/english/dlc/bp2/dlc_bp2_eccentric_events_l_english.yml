 close_tutelage: "การสอนอย่างใกล้ชิด"
 close_tutelage_desc: "ตัวละครนี้ได้รับความเอาใจใส่เป็นพิเศษจากครู ทำให้กระบวนการเรียนรู้ง่ายขึ้นมาก"
 close_tutelage_scheme: "การสอนอย่างใกล้ชิด"
 close_tutelage_tutor: "การสอนอย่างใกล้ชิด"
 close_tutelage_tutor_desc: "ตัวละครนี้กำลังให้คำแนะนำส่วนตัวอย่างใกล้ชิดแก่เด็ก ช่วยเหลือการศึกษาของพวกเขา แต่ต้องแลกมาด้วยความมั่นคงทางจิตใจของตนเอง"
 changing_habits: "การเปลี่ยนนิสัย"
 changing_habits_desc: "ตัวละครนี้กำลังพยายามปรับเปลี่ยนพฤติกรรมเพื่อเอาใจผู้อื่น"

