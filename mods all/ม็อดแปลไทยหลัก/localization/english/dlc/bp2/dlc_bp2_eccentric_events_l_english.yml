l_english: 
 child_personality.7300.t: "สหายแห่งสรรพสัตว์"
 child_personality.7300.desc: "ข้ารู้สึกสบายใจเมื่ออยู่ท่ามกลางเหล่าสัตว์ในโรงเลี้ยงและคอกม้ามากกว่าเมื่ออยู่กับเพื่อนฝูงและครูบาอาจารย์ในราชสำนัก ข้าพบว่าตนเองกลับมาอยู่ที่คอกม้าอีกครั้ง กำลังดูแลและขี่ม้าของข้า\n\nข้ารู้สึกถึงความผูกพันอันแน่นแฟ้น ดุจมิตรสหายที่ดี ข้าลงจากหลังม้า แปรงขนให้มันอย่างดี และข้าสงสัยว่าบางทีเราควรปฏิบัติต่อพาหนะของเราเยี่ยงสหายร่วมรบมากกว่านี้"
 child_personality.7300.a: "ข้า... ข้าคิดว่าข้าพูดภาษาม้าได้!"
 child_personality.7300.b: "พวกมันก็เหมือนกับเรา"
 child_personality.7300.c: "สัตว์เดรัจฉานเป็นเพียงเครื่องมือ ไม่มีอะไรมากไปกว่านั้น"
 child_personality.7301.t: "$child_personality.7300.t$"
 child_personality.7301.desc: "[child.GetFirstName] ใช้เวลาอยู่ที่คอกม้ามากกว่าปกติในช่วงหลังนี้ และได้เริ่มละเลยเพื่อนๆ ของ [child.GetHerHis] ในราชสำนัก เด็กดูเหมือนจะหมกมุ่นอยู่กับม้าตัวหนึ่งเป็นพิเศษ"
 child_personality.7301.eccentric.desc: "และถึงกับเริ่มอ้างว่า [child.GetSheHe] \"พูดภาษาม้า\" ได้\n\nจากนั้นเด็กก็ทำเสียงเป่าปากด้วยริมฝีปากของ [child.GetHerHis] และทำเสียงร้องเหมือนม้า หยุดเป็นครั้งคราวเพื่อบอกข้าว่า [child.GetSheHe] และม้ากำลังคุยอะไรกัน"
 child_personality.7301.eccentric.obligatory_glitterhoof_reference: "ดูเหมือนว่า สัตว์เดรัจฉานตัวนี้มีความทะเยอทะยานที่จะก้าวขึ้นสู่ตำแหน่ง [child.GetFaith.ReligiousHeadName]"
 child_personality.7301.eccentric.fallback: "ดูเหมือนว่า สัตว์เดรัจฉานตัวนี้ปรารถนาที่จะนั่งในสภา"
 child_personality.7301.compassionate.desc: "และอ้างว่าแม้ แต่สัตว์เดรัจฉานก็สมควรได้รับการดูแลและให้เกียรติ\n\nม้าตัวนั้นได้รับการดูแลขนอย่างดีเยี่ยมไร้ที่ติ ต่างจาก [child.GetFirstNameNoTooltip] ซึ่งเห็นได้ชัดว่ากำลังทำงานของคนเลี้ยงม้า"
 child_personality.7301.callous.desc: "แต่เมื่อถูกซักถาม [child.GetSheHe] ก็ยืนกรานว่าสัตว์เดรัจฉานเป็นเพียงเครื่องมือที่จะใช้แล้วทิ้งเมื่อหมดประโยชน์\n\n[child.GetFirstNameNoTooltip] ดูไม่กังวลเกี่ยวกับความปลอดภัยหรือความสะดวกสบายของสัตว์เดรัจฉานเลยเมื่อขี่มัน กลับหงุดหงิดอย่างเห็นได้ชัดเมื่อสัตว์แสดงความกังวลต่อความปลอดภัยของตนเอง"
 child_personality.7301.eccentric: "ช่างมีจินตนาการอันยอดเยี่ยม"
 child_personality.7301.compassionate: "จงปฏิบัติต่อผู้อื่น..."
 child_personality.7301.callous: ""ยอดเยี่ยม จงรักษาความรู้สึกนั้นไว้""
 child_personality.7301.change.eccentric: ""ไม่ พูดกับม้าสิ บอกข้าว่ามันพูดอะไร""
 child_personality.7301.change.compassionate: ""ม้าคือสหายที่ไม่เหมือนใคร, [child.GetFirstNameNoTooltip]""
 child_personality.7301.change.callous: ""เด็กโง่ ม้าเป็นเพียงเครื่องมือ""
 child_personality.7400.t: "จะเล่นเกมหรือจะขี่ม้า?"
 child_personality.7400.desc: "ข้าใช้เวลาอย่างมีความสุขกับ [other_child.GetFirstName] มาค่อนวันแล้ว และข้ารู้สึกราวกับว่าข้าสามารถเล่นกับ [other_child.GetHerHim] ได้จนกว่าร่างกายจะปวดเมื่อย\n\nแต่แล้วข้าก็เห็นใบหน้าของ [other_child.GetHerHis] เศร้าลงเมื่อข้าหยิบชุด [ROOT.Char.Custom('BG_GameType_Generic')] ของข้าออกมา\n\n"
 child_personality.7400.desc.outro.young: ""ข้าไม่อยากเล่นอะไรที่โง่และน่าเบื่อ เช่นนี้ ข้าอยากขี่ม้า!""
 child_personality.7400.desc.outro.older: ""โอ้ มาเถอะ, [ROOT.Char.GetFirstNameNoTooltip], เราอยู่ในร่มมาทั้งวันแล้ว บางทีเราควรออกไปขี่ม้ากัน!""
 child_personality.7400.a: ""ทำไมไม่ทั้งสองอย่างล่ะ?""
 child_personality.7400.b: ""ไม่ เราจะเล่นเกมของข้า ตามวิธีของข้า!""
 child_personality.7400.c: ""ก็ได้ การขี่ม้าก็ฟังดูดีเหมือนกัน...""
 child_personality.7401.t: "$child_personality.7400.t$"
 child_personality.7401.desc: "[child.GetFirstName] เงียบผิดปกติมาเกือบทั้งวัน ข้าจึงตัดสินใจว่าควรไปตรวจดู [child.GetHerHim] ข้าพบ [child.GetHerHim]"
 child_personality.7401.eccentric.desc: "อยู่ที่ลานขี่ม้ากับ [other_child.GetFirstName] ทั้งสองกำลังตะโกนเสียงดังจากหลังม้า ท่องสิ่งที่ฟังดูเหมือนการเดินหมากจาก [child.Custom('BG_GameType_Generic')] เสียอย่างนั้น เมื่อเข้าไปดูใกล้ๆ ทั้งสองกำลังเล่นเกมกระดานบนหลังม้า หรืออย่างน้อยก็พยายามทำ เช่นนั้น ลานขี่ม้าทั้งลานเกลื่อนไปด้วยตัวหมาก และทั้งสองก็ตกจากหลังม้ามาแล้วมากกว่าหนึ่งครั้ง"
 child_personality.7401.fickle.desc: "ออกไปที่ลานฝึกขี่ม้ากับ [other_child.GetFirstName] [child.GetFirstNameNoTooltip|U] ดูไม่ค่อยตื่นเต้นนักที่จะอยู่ที่นั่น ราวกับว่า [child.GetSheHe] ถูกเพื่อนเล่นของ [child.GetHerHis] บังคับให้อยู่ที่นั่น\n\n"ข้าอยากเล่นเกมกระดาน แต่ [other_child.GetFirstNameNoTooltip] บอกว่าเราควรขี่ม้า ซึ่งฟังดูดีเหมือนกัน!""
 child_personality.7401.stubborn.desc: "อยู่ในห้องของ [child.GetHerHis] กับ [other_child.GetFirstName] ซึ่งดูเหมือนกำลังเล่น [child.Custom('BG_GameType_Generic')] อย่างไม่เต็มใจนักกับ [child.GetFirstNameNoTooltip] ที่กระตือรือร้น\n\n"[other_child.GetFirstNameNoTooltip|U] อยากขี่ม้า แต่ข้าตัดสินใจว่าเราควรเล่นเกมกระดานแทน!""
 child_personality.7401.eccentric: ""ช่างเป็นการประนีประนอมที่ยอดเยี่ยม!""
 child_personality.7401.fickle: ""อารมณ์แปรปรวนบ่อยกว่าลมฟ้าอากาศ""
 child_personality.7401.stubborn: ""จงมั่นคงดุจศิลา""
 child_personality.7401.change.eccentric: ""ทำไมไม่เล่นทั้งสองอย่างพร้อมกันล่ะ?""
 child_personality.7401.change.fickle: ""อารมณ์ของคนเราต้องเปลี่ยนแปลงดุจสายน้ำไหล""
 child_personality.7401.change.stubborn: ""ไม่ จงฝังเท้าของเจ้าไว้เสมอและเรียกร้องให้ผู้อื่นเคลื่อนไหว""
 stress_threshold.2360.t: "สภาวะจิตแตกสลาย: ผู้มาเยือน"
 stress_threshold.2360.desc: "ในที่สุดข้าก็พบการพักผ่อนจากความเครียดของชีวิตใน [ROOT.Char.Custom('GetCourt')|l] ใน [ROOT.Char.Custom('GetChamber')|l] ส่วนตัวของข้า แต่ขณะที่ข้าเคลิ้มหลับ ใกล้จะหลับเต็มที ข้าได้ยินเสียงเคาะหนักๆ เป็นจังหวะ\n\nข้าเหวี่ยง [ROOT.Char.Custom('GetDoor')] ของข้าเปิดออกเพื่อดูว่าใครคือผู้มาเยือนยามวิกาลนี้ แต่กลับถูกนกสีดำตัวเล็กๆ โจมตีเข้าที่ใบหน้า\n\nโดยปกติแล้ว การมาเยือนของสิ่งมีชีวิตของ [ROOT.Char.GetFaith.CreatorNamePossessive] ถือเป็นของขวัญ แต่นกสีดำตัวน้อยน่ารำคาญนี้กลับบินกระพือปีกไปมาไม่หยุดใน [ROOT.Char.Custom('GetRoom')|l] ส่งเสียงร้องและกรีดร้องใส่ข้า ข้ารู้สึกว่ากำปั้นของข้าแน่นขึ้นและหัวใจเริ่มเต้นเร็วขึ้น"
 stress_threshold.2360.a.eccentric.gain: "ข้าคิดว่ามันกำลังพูดกับข้า"
 stress_threshold.2360.a.eccentric.effect: "อ้า ผู้มาเยือนในยามนี้! มาคุยกันหน่อย"
 stress_threshold.2360.b.irritable.gain: "ข้าทนไม่ไหวแล้ว!"
 stress_threshold.2360.b.irritable.effect: "ข้าจะฆ่านกบ้าตัวนั้น!"
 stress_threshold.2360.c: "ข้ามั่นใจว่าเดี๋ยวมันก็ไปเอง"
 bp2_yearly.8000.t: "ในภาพลักษณ์ของข้า"
 bp2_yearly.8000.desc.intro: "[hostage.Custom2('MyCharacterIntroduction', ROOT.Char)|U] เพิ่งจะพูดกับข้าด้วยภาษา [ROOT.Char.GetCourtLanguage.GetNameNoTooltip] เท่านั้น และ [hostage.GetSheHe] ก็ทำได้อย่างคล่องแคล่วอย่างน่าทึ่ง\n\n"
 bp2_yearly.8000.desc.tutor: "ไม่ต้องสงสัยเลยว่าเวลาทั้งหมดที่อยู่ภายใต้การดูแลของอาจารย์ในราชสำนักของข้า [tutor.GetFirstName] คือสิ่งที่ ทำให้เด็กคนนี้ฉลาดหลักแหลมในด้านภาษา และข้าตั้งตารอที่จะได้เห็นความเชี่ยวชาญในภาษาของราชสำนักของ [hostage.GetHerHis] ก้าวหน้ายิ่งขึ้นไปอีก"
 bp2_yearly.8000.desc.chaplain: "[hostage.GetFirstNameNoTooltip|U] บอกข้าว่าผู้ให้การศึกษาแก่ [hostage.GetHerHis] ในหมู่นักบวช เช่น [tutor.Custom2('MyCharacterIntroduction', ROOT.Char)] คือผู้ที่ควรได้รับคำขอบคุณสำหรับความเชี่ยวชาญในภาษาของราชสำนักของ [hostage.GetHerHis]"
 bp2_yearly.8000.desc.guardian: "เห็นได้ชัดว่า [hostage.GetFirstNameNoTooltip] และ [tutor.GetFirstName] กำลังพัฒนาความผูกพันที่ดี และข้าสามารถตั้งตารอความประหลาดใจที่น่ายินดีในการศึกษาของ [hostage.GetHerHis] ได้อีกมาก"
 bp2_yearly.8000.a: "ข้าจะสอน [hostage.GetHerHim] ด้วยตนเอง"
 bp2_yearly.8000.b: "ช่างเป็นความพยายามที่น่าสมเพชในการพูดภาษา [ROOT.Char.GetCourtLanguage.GetNameNoTooltip]"
 bp2_yearly.8000.c: "นั่นก็ดี"
 bp2_yearly.8000.b.tt: "[hostage.GetFirstNameNoTooltip|U] จะท้อถอยจากการเรียนรู้ [court_language|E] ของท่าน"
 tutor_child_in_language_tt: "[hostage.GetFirstNameNoTooltip|U] จะเริ่ม [scheme|E] เพื่อเรียนรู้ [court_language|E] ของท่านพร้อมโบนัสอันทรงพลัง"
 child_learning_language_tt: "[hostage.GetFirstNameNoTooltip|U] จะได้รับการสนับสนุนให้เริ่ม [scheme|E] เพื่อเรียนรู้ [court_language|E] ของท่าน"
 bp2_yearly.8010.t: "พูดจาตลก"
 bp2_yearly.8010.desc: "ข้ากำลังอยู่ระหว่างบทเรียนกับ [child.Custom2('MyCharacterIntroduction', ROOT.Char)] และรอยยิ้มที่กลั้นไว้ของ [child.GetHerHim] ทำให้ข้าสงสัยว่า [child.GetSheHe] ไม่ได้ตั้งใจฟังสิ่งที่ข้าพูดเลยแม้ แต่น้อย [child.GetSheHe] เอา แต่พูดทวนสิ่งที่ข้าพูดด้วยน้ำเสียงแปลกๆ เป็นระยะ\n\n"เจ้ากำลังทำอะไรน่ะ?"\n\n"เจ้ากำลังทำอะไรน่ะ?" เจ้า [child.Custom2('InsultNoun', ROOT.Char)] ปล่อยเสียงหัวเราะก๊ากออกมา "ขออภัย แต่สำเนียงของท่านมันช่างน่าขันสิ้นดี!""
 bp2_yearly.8010.a: "บางทีข้าควรสอนภาษา [ROOT.Char.GetCulture.GetLanguage.GetNameNoTooltip] ขั้นพื้นฐานให้ [child.GetHerHim]"
 bp2_yearly.8010.a.tt: "ท่านใช้เวลาสองสามบทเรียนถัดไปพูดภาษา [ROOT.Char.GetCulture.GetLanguage.GetNameNoTooltip] ขั้นพื้นฐาน"
 tutor_child_in_native_language_tt: "[child.GetFirstName|U] จะเริ่ม [scheme|E] เพื่อเรียนรู้ [language|E] ของท่านพร้อมโบนัสอันทรงพลัง"
 bp2_yearly.8010.a.success: "ท่านสอนภาษา [ROOT.Char.GetCulture.GetLanguage.GetNameNoTooltip] ได้สำเร็จ"
 bp2_yearly.8010.a.failure: "ท่านไม่สามารถสอนภาษา [ROOT.Char.GetCulture.GetLanguage.GetNameNoTooltip] ได้"
 bp2_yearly.8010.b: ""ไม่ #EMP เจ้า#! ต่างหากที่พูดตลก!""
 bp2_yearly.8010.b.success: "ท่านล้อเลียนเด็กได้สำเร็จ"
 bp2_yearly.8010.b.failure: "ท่านถูก ทำให้อับอายมากขึ้น"
 bp2_yearly.8010.c: "ก็ได้"
 bp2_yearly.8010.d: "โอเวย์ อาเวย์ อูเวย์?"
 bp2_yearly.8010.d.tt: "ท่านใช้เวลาในบทเรียนประดิษฐ์ภาษาลับด้วยกัน"
 bp2_yearly.8020.t: "เจ้าอยากทำอะไร?"
 bp2_yearly.8020.desc: "ข้าเล่นกับ [other_child.Custom2('MyCharacterIntroduction', ROOT.Char)] มาค่อนวันแล้ว และข้าสนุกมาก! เราเล่น [ROOT.Char.Custom('BG_GameType_Generic')] และเมื่อเกมของเราใกล้จะจบลง [other_child.GetSheHe] ก็เอาชนะข้าได้ และข้าก็ตกตะลึง\n\n"สนุกมาก! ตอนนี้เราจะทำอะไรกันดี?"\n\nนี่เป็นโอกาสของข้าที่จะเลือกบางสิ่งที่ข้าอาจจะยังชนะได้..."
 bp2_yearly.8020.a: "มาแข่งเดินบนไม้ต่อขากันเถอะ!"
 bp2_yearly.8020.b: "มาเล่นลูกข่างกันเถอะ!"
 bp2_yearly.8020.c: "ทุกคนชนะด้วยหุ่นเชิด"
 bp2_yearly.8021.t: "การละเล่น"
 bp2_yearly.8021.desc.intro: "เราวางกระดานเล่นลงและเตรียม"
 bp2_yearly.8021.desc.stilts: "ไม้ต่อขาของเรา ข้าถูกยกขึ้นสูงเกือบเท่าผู้ใหญ่ และขาเล็กๆ ของข้าก็พยายามอย่างหนักเพื่อทรงตัวบนความสูงอันน่าตกตะลึงนี้ เมื่อคู่ต่อสู้ของข้าลุกขึ้นยืนบนขาที่ไม่มั่นคงของ [other_child.GetHerHis] แล้ว เราก็เริ่ม!"
 bp2_yearly.8021.desc.teetotum: "ลูกข่าง มันหมุนไปรอบๆ แต่ละคนเดิมพันลูกแก้วของเรากับผลลัพธ์ของมัน แม้ว่าจะไม่มีอะไรมีค่าเป็นเดิมพัน แต่ข้ารู้สึกว่าหัวใจเต้นแรงเมื่อมันตกลงมาด้านข้าง\n\nเกมดำเนินไปมา ลูกแก้วเปลี่ยนมือ แต่ในไม่ช้าข้าก็พบว่า"
 bp2_yearly.8021.desc.stilts.outro: "\n\n[other_child.GetFirstNameNoTooltip|U] ไปได้เพียงไม่กี่หลาก็ล้มหน้า [other_child.GetHerHis] คว่ำลงกับพื้น ปล่อยให้ข้าเป็นผู้ชนะ ข้ายืนตระหง่านเหนือคู่ต่อสู้ด้วยไม้ต่อขาอันทรงพลังของข้า ข้ามีอิสระที่จะรับรางวัลของข้า"
 bp2_yearly.8021.desc.teetotum.outro: "ตัวเองมีลูกแก้วทั้งหมดในตอนท้าย [other_child.GetFirstNameNoTooltip|U] ถอนหายใจอย่างพ่ายแพ้ และข้าก็เป็นเจ้าของลูกแก้วทั้งหมดอย่างภาคภูมิใจ"
 bp2_yearly.8021.a: "ง่ายเกินไป! เจ้าคนขี้แพ้!"
 bp2_yearly.8021.b: "เป็นการละเล่นที่ดี"
 bp2_yearly.8021.c: "ข้าบอกแล้วว่าผู้ชนะจะได้รับความช่วยเหลือ..."
 bp2_yearly.8022.desc.stilts.outro: "\n\nข้าวิ่งเร็วที่สุดเท่าที่จะทำได้บนขาที่ไม่มั่นคงของข้า แต่หลังจากไปได้เพียงไม่กี่หลา ข้าก็ล้มหน้าคว่ำลง และ [other_child.GetFirstNameNoTooltip] ก็เป็นผู้ชนะ"
 bp2_yearly.8022.desc.teetotum.outro: "ข้าหมดลูกแก้วแล้ว ทำให้ [other_child.GetFirstNameNoTooltip] เป็นผู้ชนะ"
 bp2_yearly.8022.desc.rubbed_it_in: "\n\n[other_child.GetSheHe|U] ไม่มีความถ่อมตนในชัยชนะเลยแม้ แต่น้อย ล้อเลียนและดูถูกข้าที่แพ้"
 bp2_yearly.8022.desc.normal_child: "\n\n"สนุกมาก!""
 bp2_yearly.8022.a: "ช่างมันเถอะ"
 bp2_yearly.8022.a.mean: ""หุบปาก! ข้าเกลียดเจ้า!""
 bp2_yearly.8022.b: ""ทหาร!""
 bp2_yearly.8022.c: ""ใช่ เราควรเล่นกันอีก!""
 bp2_yearly.8030.t: "ตุ๊กตาผู้โดดเดี่ยว"
 bp2_yearly.8030.desc: "เปลวไฟและเสียงกรีดร้องรายล้อมข้าใน [ROOT.Char.GetCurrentLocation.GetName] ขณะที่กองทัพของข้าปล้นสะดมเพื่อหาสินค้ามีค่าและเชลย กลิ่นฉุนของเนื้อไหม้คละคลุ้งไปในอากาศ และข้ารู้สึกถึงส่วนผสมอันงดงามของเลือดและดินที่แห้งกรังบนใบหน้าของข้า\n\nแต่แล้วข้าก็เห็นท่ามกลางซากปรักหักพัง ตุ๊กตาตัวเล็กๆ ถูกทิ้งไว้ในดิน ข้ารู้สึกอยากมองมัน ดวงตาเม็ดกระดุมเล็กๆ และรอยยิ้มที่เย็บด้วยมือ ทำให้ข้านึกถึงความไร้เดียงสาที่รอข้าอยู่ที่บ้าน แม้จะเปรอะเปื้อนไปด้วยโคลน ผมนุ่มๆ ของมันก็ยังรู้สึกบอบบางในมือของข้า และข้าอดคิดไม่ได้ว่านี่จะเป็นของขวัญที่สมบูรณ์แบบสำหรับเด็กคนหนึ่งในราชสำนัก"
 bp2_yearly.8030.a: "[child_1.GetFirstNameNoTooltip] ต้องชอบสิ่งนี้แน่!"
 bp2_yearly.8030.b: "ตุ๊กตาตัวนี้ ทำให้ข้านึกถึง [child_2.GetFirstNameNoTooltip] มาก"
 bp2_yearly.8020.a.win: "ท่านชนะ!"
 bp2_yearly.8020.a.lose: "ท่านแพ้..."
 bp2_yearly.8040.t: "[crush.GetSheHe|U] เป็น [crush.GetWomanMan|U] แล้ว"
 bp2_yearly.8040.desc.intro: "เป็นเวลานานแล้วที่ข้าไม่ได้เห็น [crush.GetFirstName] คนรักในวัยเด็กของข้า"
 bp2_yearly.8040.desc.mid.same_location: "จากนั้น ข้าเห็น [crush.GetHerHim] เข้ามาใน [ROOT.Char.Custom('GetCourt')] ของข้า ดูสง่างาม เช่นเคย เป็นภาพของ [ROOT.Char.GetFaith.PositiveAfterLife] หากเคยมีมา ข้ารู้สึกว่าหัวใจเริ่มเต้นแรง และฝ่ามือชุ่มเหงื่อ เหมือนกับตอนที่ข้าเป็นเพียง [ROOT.Char.Custom('GirlBoy')]\n\nยากที่จะเชื่อว่า [crush.GetSheHe] คือ [crush.Custom('GirlBoy')] คนเดียวกับที่ข้าเคยหลงใหลในวัยเยาว์ และยากยิ่งกว่าที่จะเชื่อว่าความรู้สึกของข้ายังคงไม่เปลี่ยนแปลง"
 bp2_yearly.8040.desc.mid.different_location: "แม้เวลาจะผ่านไปนานหลายปี ความคิดถึง [crush.GetHerHim] ในฐานะเป้าหมายความหลงใหลในวัยเด็กของข้าก็ยังคงวนเวียนอยู่ในใจยามค่ำคืน\n\n[crush.GetSheHe|U] เป็น [crush.GetWomanMan] แล้ว และข้าอดไม่ได้ที่จะเอื้อมมือไปหยิบปากกาขนนกเมื่อนึกถึง [crush.GetHerHim]"
 bp2_yearly.8040.desc.outro: "บางทีข้าควรจะเปิดเผยความรู้สึกของข้าเสียที"
 bp2_yearly.8040.a: "ข้าจะสารภาพรัก!"
 bp2_yearly.8040.b: "ข้าต้องละทิ้งความคิดแบบเด็กๆ เหล่านี้"
 bp2_yearly.8040.c: "เราจะ แต่งงานกันในตอนเช้า!"
 bp2_yearly.8041.t: "ท่านเป็น [ROOT.Char.GetWomanMan|U] แล้ว"
 bp2_yearly.8041.desc.intro.same_location: "ข้าเข้าไปใน [ROOT.Char.Custom('ResidenceBuilding')] ของข้าและพบ [crushee.Custom2('MyCharacterIntroduction', ROOT.Char)] จ้องมองข้าราวกับ [crushee.GetWomanMan] ป่าผู้หิวโหยกำลังจ้องมองเหยื่อรายต่อไปของ [crushee.GetHerHis] [crushee.GetSheHe|U] ฝ่าฝูงชนเข้ามาและ"
 bp2_yearly.8041.desc.intro.different_location: "ข้าพบสิ่งผิดปกติอย่างยิ่งท่ามกลางจดหมายราชการตามปกติของข้า จดหมายที่ห่ออย่างประณีตด้วยริบบิ้นสีแดงเลือดนก มีตราประทับขี้ผึ้งรูปหัวใจประดับอยู่\n\nมันมาจาก [crushee.Custom2('MyCharacterIntroduction', ROOT.Char)] และบรรยายถึงความรู้สึกอันลึกซึ้งของ [crushee.GetHerHis] ที่มีต่อข้า"
 bp2_yearly.8041.desc.mid.same_location_marriage: "ลด [crushee.GetHerselfHimself] ลงที่เท้าของข้า\n\n\"โอ้ [ROOT.Char.Custom('LoverPetName')] ที่รักของข้า ข้าหมายปองท่านมาตั้งแต่เรายังเป็นเด็ก ความรักของข้าบริสุทธิ์ยิ่งกว่าความรักใดๆ ที่ท่านจะพบในโลกนี้ และข้าจะเป็น [crushee.Custom('WifeHusband')] ของท่านหากท่านยอมรับข้า!\""
 bp2_yearly.8041.desc.mid.different_location_marriage: "หลังจากพูดคุยถึงความหลงใหลในวัยเด็กของ [crushee.GetHerHis] ที่มีต่อข้าเป็นเวลานาน จดหมายก็เสนอต่อไปว่า [crushee.GetSheHe] จะมาเป็น [crushee.Custom('WifeHusband')] ของข้า!\n\n"เราจะ แต่งงานกันทันทีที่ท่านตอบกลับ ที่รักของข้า รับข้าไว้และข้าจะพยายาม ทำให้ความสุขของท่านเป็นเป้าหมายในชีวิตของข้า""
 bp2_yearly.8041.desc.mid.same_location_lovers: "ดึงข้าไปที่มุมเงียบๆ ของ [ROOT.Char.Custom('GetCourt')] และกระซิบเบาๆ ที่ข้างหูข้า\n\n"ข้ามีความรู้สึกรักอันลึกซึ้งต่อท่านมาตั้งแต่เรายังเป็นเด็ก ข้าขอเสนอความรักของข้า หากท่านจะรับมันไว้""
 bp2_yearly.8041.desc.mid.different_location_lovers: "\n\n"ที่รักของข้า ข้าหายใจเพื่อท่านเท่านั้น และข้าทนไม่ได้ที่จะต้องอยู่ห่างกันอีกต่อไป ข้ารักท่านมาตั้งแต่ข้ายังเป็นเพียง [crushee.Custom('GirlBoy')] ได้โปรด ตอบรับความรักของข้าและข้าสัญญาว่าข้าจะ ทำให้ท่านมีความสุขตลอดไป""
 bp2_yearly.8041.a: "ข้าตอบรับความรักของ [crushee.GetHerHis]!"
 bp2_yearly.8041.b: "ข้าไม่ได้รู้สึก เช่นเดียวกัน"
 bp2_yearly.8042.t: "ความรักที่ตอบสนอง"
 bp2_yearly.8042.desc.intro: "ข้าสารภาพรักกับ [crush.GetFirstName]"
 bp2_yearly.8042.desc.mid.same_location: "และ [crush.GetSheHe] ก็โน้มตัวเข้ามาใกล้หูข้าและกระซิบตอบความรักของ [crush.GetHerHis] กลับมาให้ข้า"
 bp2_yearly.8042.desc.mid.different_location: "ในจดหมาย และใช้เวลาเพียงไม่กี่วัน [crush.GetHerHim] ก็เขียนตอบกลับมาว่า [crush.GetSheHe] รู้สึก เช่นเดียวกัน!"
 bp2_yearly.8042.desc.outro: "\n\nข้าดีใจและประหลาดใจอย่างยิ่งที่ความรักของเราสามารถก้าวข้ามความเขลาในวัยเยาว์และเบ่งบานเป็นการเกี้ยวพาราสีที่เติบโตเต็มที่ได้"
 bp2_yearly.8042.a: "ช่างยอดเยี่ยม"
 bp2_yearly.8043.t: "ความรักที่ถูกเมิน"
 bp2_yearly.8043.desc: "ดูเหมือนว่าความรู้สึกของข้ายังคงเป็นฝ่ายเดียว [crush.GetFirstName|U] ดูไม่สนใจข้าในฐานะคนรักเลย และข้าก็อกหัก"
 bp2_yearly.8043.a: "บางที [crush.GetSheHe] อาจจะถูกโน้มน้าวได้"
 bp2_yearly.8043.b: "อนิจจา"
 bp2_yearly_8040_confess_crush: "ท่านและ [crush.GetFirstName] อาจกลายเป็นคู่รักกัน"
 bp2_yearly_8042_rejection: "[crushee.GetFirstName] จะได้รับแจ้งถึงการปฏิเสธของท่าน"

