 erratic_behaviour: "พฤติกรรมเอาแน่เอานอนไม่ได้"
 erratic_behaviour_desc: "ตัวละครนี้เพิ่งสร้างความรำคาญให้กับราชสำนักด้วยการประพฤติตนไร้เหตุผลและแปลกประหลาด"
 bird_cruelty: "ความโหดร้ายต่อนก"
 bird_cruelty_desc: "ตัวละครนี้เพิ่งมีปฏิกิริยาตอบสนองต่อนกมากเกินไป แม้ แต่เสียงร้องเจี๊ยบจ๊าบหรือเสียงการ้องเบาๆ ข้างนอกก็ดูเหมือนจะเพียงพอที่จะ ทำให้พวกเขาโกรธจัดได้"
