l_english: 
 
 influence_child_personality_interaction: "ชักจูงบุคลิกภาพของเด็กในปกครอง"
 influence_child_personality_interaction_desc: "ส่งต่อ [personality_trait|E] ให้แก่ [ward|E] ของท่าน"
 had_guardian_influence_interaction: "เพิ่งมีปฏิสัมพันธ์ไปเมื่อ [DATE.GetStringLong]"
 bp2_character_interaction.1001.t: "$influence_child_personality_interaction$: [target_trait.GetNameNoTooltip(GetPlayer)]"
 bp2_character_interaction.1001.desc_intro: "ข้าเข้าหา [ROOT.Char.Custom2('RelationToMeShort', recipient)] ของข้า [recipient.GetFirstName]"
 bp2_character_interaction.desc_lustful: "พร้อมคำถาม: "เจ้ารู้จักความรักหรือไม่?"\n\n"เจ้าค่ะ/ขอรับ," [recipient.GetSheHe] ตอบอย่างระมัดระวัง "ข้ารักญาติของข้า! และ... เอ่อ... มีบางคนที่ข้าหยุดคิดถึงไม่ได้..."\n\n"จงไล่ตามความรู้สึกนั้นเถิด, [recipient.Custom('GirlBoy')] ความรักใคร่และความพึงพอใจไม่ได้มาหาเจ้าเอง — ต้องไล่ตามมัน! จงโอบรับการไล่ตามนี้ เพราะความปรารถนาของเจ้าเป็นเพียงเรื่องของมนุษย์"\n\n"
 bp2_character_interaction.1001.desc_lustful: "$bp2_character_interaction.desc_lustful$"โอ้ ดีจัง," [recipient.GetSheHe] หัวเราะ "บางทีสักวันข้าอาจจะได้จุมพิตไปทั่วทั้ง [ROOT.Char.GetPrimaryTitle.GetTierAsNameNoTooltip|l]!""
 bp2_character_interaction.desc_chaste: "พร้อมคำถาม: "การมองผู้อื่นเคย ทำให้ใจเจ้าร้อนรุ่มหรือไม่?"\n\n"เจ้าค่ะ/ขอรับ..." [recipient.GetSheHe] ตอบอย่างลังเล "บางครั้ง"\n\n"เปลวไฟนี้ต้องถูกดับ ขณะที่ใจเจ้าลุกโชนด้วยไฟแห่ง [ROOT.Char.GetFaith.NegativeAfterLife] เจ้าคิดว่า [ROOT.Char.GetFaith.FertilityGodName] จะอวยพรเจ้าหรือ? ขณะที่เจ้าปล่อยตัวตามความปรารถนาอันชั่วร้าย? ไม่! จำไว้, [recipient.Custom('GirlBoy')]: ตัณหาคือหายนะ"\n\n"
 bp2_character_interaction.1001.desc_chaste: "$bp2_character_interaction.desc_chaste$"ข้าสาบาน," [recipient.GetFirstNameNoTooltip] พรั่งพรูออกมา, "ว่าจะเกลียดชังเนื้อหนัง!""
 bp2_character_interaction.desc_gluttonous_common: "และใบหน้าที่มันเยิ้มอย่างรู้สึกผิดของ [recipient.GetHerHis] พลางถาม [recipient.GetHerHim]: "เจ้ากินอะไรเข้าไป...?"\n\n"โอ้! [recipient.Custom('GetLocalStreetFood')] นี่มาอยู่ที่นี่ได้อย่างไร?"\n\n"
 bp2_character_interaction.desc_gluttonous: "$bp2_character_interaction.desc_gluttonous_common$"คนรับใช้เอามาให้เจ้าอีกหรือไม่?" ข้ายิ้มกว้าง "ข้า #EMP หิวโซ#! เลย!"\n\nขณะที่เราแบ่งปันอาหารกัน ข้าสนับสนุนให้ [recipient.Custom('GirlBoy')] กิน กินเข้าไป เพื่อที่ [recipient.GetSheHe] จะได้เติบโตแข็งแรง "อย่าละอายในความฝันและความปรารถนา! จงลิ้มรสความอุดมสมบูรณ์ทั้งหมดของราชสำนัก"\n\n"
 bp2_character_interaction.1001.desc_gluttonous: "$bp2_character_interaction.desc_gluttonous$"ด้วยความยินดี!" [recipient.GetSheHe] เรอ"
 bp2_character_interaction.desc_temperate: "$bp2_character_interaction.desc_gluttonous_common$ข้าฉวย [recipient.Custom('GetLocalStreetFood')] และขว้างมันให้พ้นสายตา "เจ้า #EMP ไม่มีความอดทนเลยหรือ?! ไม่มีการควบคุมตนเองเลยหรือ?#! จงสาบานว่าจะรู้จักประมาณตนในทุกสิ่ง, [recipient.Custom('GirlBoy')] จงสาบานความยับยั้งชั่งใจของเจ้าต่อ [ROOT.Char.GetFaith.HealthGodName]! โลกนี้ไม่ต้องการคนเสื่อมทรามเพิ่มอีกคน"\n\n"
 bp2_character_interaction.1001.desc_temperate: "$bp2_character_interaction.desc_temperate$"ข้าสาบาน, [recipient.GetSheHe] กล่าวเสียงเรียบ " [recipient.Custom2('RelationToMeShort', ROOT.Char)] ของข้า ข้ารู้สึกละอายใจเหลือเกิน...""
 bp2_character_interaction.desc_greedy_common: "ขณะที่ [recipient.GetSheHe] ชูคันธนู ตะโกนชื่อเด็กหนุ่มอีกคน\n\n"หนึ่งในเด็กรับใช้ของพวก [ROOT.Char.Custom('KnightCulturePluralNoTooltip')|l]!" [recipient.GetSheHe] ร้อง "ข้าจะแทงคอหอยมันที่มาอ้อนวอนขอสิ่งที่ข้าเป็นเจ้าของ!"\n\n"
 bp2_character_interaction.desc_greedy: "$bp2_character_interaction.desc_greedy_common$"ใจเย็นไว้ เพราะจิตใจที่คิดคำนวณย่อมได้กำไร ใช่ ทุกคนจะอ้อนวอน — แต่เมื่อพวกเขารู้ว่าเจ้าปกป้องสิ่งที่เป็นของเจ้า พวกเขาก็จะยอมแพ้ ไม่มีใครสามารถขอเลือดจากก้อนหินได้! อย่าให้ทั้งเลือดและทองคำ, [recipient.GetFirstNameNoTooltip]"\n\n"
 bp2_character_interaction.1001.desc_greedy: "$bp2_character_interaction.desc_greedy$"หรือ," [recipient.GetSheHe] ตอบ "บางทีการแลกเปลี่ยนอาจจะใช้ได้... การแลกเปลี่ยนที่ #EMP ได้เปรียบ#! อย่างยิ่ง...""
 bp2_character_interaction.desc_generous: "$bp2_character_interaction.desc_greedy_common$"มีเรื่องขูดรีดกันมากมายเพียงใดเกี่ยวกับเรื่องเล็กน้อย? วางคันธนูของเจ้าลง, [recipient.Custom('GirlBoy')] เจ้าจะไม่มีวันสูญเสียสิ่งใดที่รักยิ่งเท่าเกียรติยศ และหากเจ้าฉลาด สิ่งใดก็ตามที่มอบให้ไปจะยังคงรับใช้เจ้าอยู่"\n\n"
 bp2_character_interaction.1001.desc_generous: "$bp2_character_interaction.desc_generous$"ตราบเท่าที่ท่านมีชีวิตอยู่เพื่อข้า," [recipient.GetFirstNameNoTooltip] ถอนหายใจ, "ข้าสามารถพยายามมีชีวิตอยู่เพื่อผู้อื่นได้""
 bp2_character_interaction.desc_lazy_common: "และถามว่า: "เมื่อข้าเรียกเจ้ามารับใช้ เจ้าทำได้ดีหรือไม่?"\n\n"ข้า... ข้าพยายามอย่างดีที่สุด, [ROOT.Char.GetTitleAsNameNoTooltip]"\n\n"
 bp2_character_interaction.desc_lazy: "$bp2_character_interaction.desc_lazy_common$"ตามจริงแล้ว... การทำตามมาตรฐานโดยไม่ต้องพยายามก็ดีเท่ากับการทำเกินมาตรฐาน," ข้าพูดพลางขยี้ผมของ [recipient.GetHerHis] "เจ้าจะเป็นในสิ่งที่เจ้าจะเป็นอยู่ดี ไม่ว่า อย่างไรก็ตาม เลิกพิธีรีตองเรื่อง 'การรับใช้' ทั้งหมดไปเลย! งีบหลับบ่อยขึ้นสิ บางที"\n\n"
 bp2_character_interaction.1001.desc_lazy: "$bp2_character_interaction.desc_lazy$พร้อมกับหาวเล็กน้อย, [recipient.GetFirstNameNoTooltip] เห็นด้วย "โอ้ ใช่เลย!""
 bp2_character_interaction.desc_diligent: "$bp2_character_interaction.desc_lazy_common$"ดีที่สุดของเจ้า? ข้ายังไม่คาดหวังทักษะจากเจ้า, [recipient.Custom('GirlBoy')] ข้าคาดหวังความเพียรพยายาม เจ้าไม่รู้สึกถึงความสุขของการเล่นเมื่อเจ้าทำงานได้ดีหรือ? หยุดสงสัย หยุดคิด — ทำ! แค่ทำ!"\n\n"
 bp2_character_interaction.1001.desc_diligent: "$bp2_character_interaction.desc_diligent$[recipient.GetFirstNameNoTooltip] ผุดลุกขึ้นยืนบนเท้า [recipient.GetHerHis] "ข้าจะไม่ ทำให้ท่านผิดหวัง [recipient.Custom2('RelationToMeShort', ROOT.Char)]!""
 bp2_character_interaction.desc_wrathful_common: "พร้อมคำถาม: "อำนาจคืออะไร?"\n\n"
 bp2_character_interaction.desc_wrathful: "$bp2_character_interaction.desc_wrathful_common$เปลวไฟเล็กๆ วูบไหวในดวงตาของ [recipient.GetHerHis] ขณะที่ข้าตอบ "อำนาจคืออิสรภาพในความโกรธ อิสรภาพที่จะฟาดฟัน ทำให้อัปยศ แก่ผู้ที่ ทำให้เจ้าพิโรธ"\n\n"เหมือนตอนที่ไอ้โง่ [recipient.Custom('GirlBoy')] คนหนึ่งฉีกเสื้อคลุมของข้า! ข้าไม่เคยรู้สึกร้อนรุ่มเท่านี้มาก่อน," [recipient.GetSheHe] ต่อว่า ขณะที่ข้าโห่ร้องเห็นด้วย\n\n"
 bp2_character_interaction.1001.desc_wrathful: "$bp2_character_interaction.desc_wrathful$"คอยดูเถอะ," [recipient.GetSheHe] กรีดร้อง, "ไอ้พวกโง่จะได้เรียนรู้ว่า #EMP ข้าหายใจเป็นไฟ!#!""
 bp2_character_interaction.desc_calm: "$bp2_character_interaction.desc_wrathful_common$"การมี [ROOT.Char.Custom('KnightCulturePluralNoTooltip')|l] และขุนนางอยู่ใต้บังคับบัญชา? ข้าทำ [recipient.Custom('GetAccessory')] ชิ้นโปรดหายไปวันนี้ และดูเหมือนไม่มีใครสนใจเลย..."\n\n"อำนาจเริ่มต้นด้วยอำนาจเหนือตนเอง," ข้าอธิบาย "โดยการมองผู้อื่น โดยการอารมณ์เสียและเกรี้ยวกราด เจ้ากำลังผลักไสความรู้สึกหมดหนทางและโง่เขลาออกไป แทนที่จะทำ เช่นนั้น จงหายใจลึกๆ และค้นหาการตัดสินใจที่ชัดเจน"\n\n"
 bp2_character_interaction.1001.desc_calm: "$bp2_character_interaction.desc_calm$หลังจากหยุดครู่หนึ่ง, [recipient.GetFirstName] ถอนหายใจและพูดว่า: "ข้าจะพยายาม""
 bp2_character_interaction.desc_impatient_common: "และวางไข่ฟองหนึ่งในมือของ [recipient.GetHerHis] พลางพูดว่า: "ถือไว้นี่ ข้าจะกลับมา"\n\nข้าจากไป ทำกิจวัตรประจำวันของข้า หลังจากผ่านไปหลายชั่วโมง ข้ากลับมาพบ [recipient.Custom('GirlBoy')] นั่งหลังค่อมอยู่บนม้านั่งตัวเดิม ไข่ยังคงอยู่ในมือ\n\n"
 bp2_character_interaction.desc_impatient: "$bp2_character_interaction.desc_impatient_common$ข้าทุบฝ่ามือของ [recipient.GetHerHis] ทำให้ไข่แตก ของเหลวเหนียวเหนอะหนะท่วมมือของ [recipient.GetHerHis] — ความตกใจปรากฏบนใบหน้าของ [recipient.GetHerHis]!\n\n"เจ้าเสียเวลาไปทั้งวัน, [recipient.Custom('GirlBoy')]..." ข้าพูดขณะเดินจากไป\n\n"
 bp2_character_interaction.1001.desc_impatient: "$bp2_character_interaction.desc_impatient$"ข้าจะไม่รอท่านอีกแล้ว!" [recipient.GetFirstNameNoTooltip] โหยหวน "#EMP ข้าสาบาน!#!""
 bp2_character_interaction.desc_patient: "$bp2_character_interaction.desc_impatient_common$หยิบมันมาจาก [recipient.GetHerHim], ข้ากอด [recipient.Custom('GirlBoy')] "ข้าภูมิใจในตัวเจ้ามาก แม่ไก่เลี้ยงดูชีวิตอย่างไร? ไก่ตัวผู้ที่ระแวดระวังปกป้องคู่ของมันอย่างไร? ความอดทน"\n\n"
 bp2_character_interaction.1001.desc_patient: "$bp2_character_interaction.desc_patient$[recipient.GetFirstNameNoTooltip] ยิ้ม "เป็นการดีที่มีเวลาได้คิด""
 bp2_character_interaction.desc_arrogant_common: "และแสดงความยินดีกับ [recipient.GetHerHim] ที่เอาชนะอาจารย์คนหนึ่งของ [recipient.GetHerHis] ใน [SCOPE.Custom('BG_GameType_Generic')]\n\n"ไม่มีอะไร," [recipient.GetSheHe] ตอบ "จริงๆ แล้ว ข้าเอาชนะผู้ใหญ่ส่วนใหญ่ที่ข้าเคยเล่นด้วย!"\n\n"
 bp2_character_interaction.desc_arrogant: "$bp2_character_interaction.desc_arrogant_common$"ยอดเยี่ยม นั่น, [recipient.Custom('GirlBoy')], เป็น เพราะเจ้ามีชะตากรรมอันยิ่งใหญ่ อย่ากลัวความภาคภูมิใจของเจ้า: มีเพียงคนขี้ขลาดเท่านั้นที่ไม่แสดงความเชื่อมั่นในความสามารถของตน! ให้ทุกคนและทุกผู้เห็นว่าเจ้าเป็นใคร แล้วพวกเขาจะให้เกียรติเจ้า เช่นนั้น!"\n\n"
 bp2_character_interaction.1001.desc_arrogant: "$bp2_character_interaction.desc_arrogant$"ห๊ะ!" [recipient.GetFirstNameNoTooltip] เยาะเย้ย "ท่านอิจฉาเล็กน้อยหรือเปล่า?""
 bp2_character_interaction.desc_humble: "$bp2_character_interaction.desc_arrogant_common$"เจ้าอยากจะเผชิญหน้ากับ... ข้าหรือไม่? เราจะเชิญ [ROOT.Char.GetPrimaryTitle.GetTierAsName] ทั้งหมด," ข้าแสร้งทำ ขณะที่ [recipient.GetFirstNameNoTooltip] หดตัวและประท้วง\n\n"เราต้องระวัง," ข้าพูด, "การมัวเมาในคุณธรรมของเราจนเราแสดงความไม่เคารพ จนเราตัดสินตนเองผิดพลาด"\n\n"
 bp2_character_interaction.1001.desc_humble: "$bp2_character_interaction.desc_humble$"ได้โปรด!" [recipient.GetFirstNameNoTooltip] อ้อนวอน "อภัยให้ข้าด้วย!""
 bp2_character_interaction.desc_deceitful_common: "พร้อมคำถาม: "เจ้าโกหกข้าหรือไม่?"\n\n"ข้า... เอ่อ... ไม่เคย!"\n\n"
 bp2_character_interaction.desc_deceitful: "$bp2_character_interaction.desc_deceitful_common$"เจ้ากำลังโป้ปด" ข้าหัวเราะเบาๆ "ช่างไร้ชั้นเชิงนัก เมื่อใดเจ้าจะเรียนรู้ที่จะเก็บงำคำโกหกเล็กๆ น้อยๆ แต่สม่ำเสมอ ทั้งหมดเคลือบไว้ด้วยรสหวานแห่งความจริง? ปรารถนาจะเป็น [recipient.GetWomanMan] ผู้ยิ่งใหญ่รึ? โลกนี้คือหลุมอสรพิษ และมีเพียงผู้มีเล่ห์เหลี่ยมที่สุดเท่านั้นที่จะผงาด [recipient.GetHerselfHimself] อยู่เหนือยอดกองได้"\n\n"
 bp2_character_interaction.1001.desc_deceitful: "$bp2_character_interaction.desc_deceitful$"โอ้, [recipient.Custom2('RelationToMeShort', ROOT.Char)] ของข้า! ท่านคืองูที่ข้ารักที่สุด," [recipient.GetFirstNameNoTooltip] โกหก"
 bp2_character_interaction.desc_honest: "$bp2_character_interaction.desc_deceitful_common$"บางที นี่คือสิ่งที่ข้าไม่สามารถรู้ได้," ข้าอธิบาย "แต่เจ้าไม่สามารถ #EMP รู้สึก#! ถึงคำโกหกได้หรือ, [recipient.Custom('GirlBoy')]? ข้ารู้จักคนโกหก: [recipient.GetSheHe] เป็นคนที่ไม่มีเกียรติ ไม่คำนึงถึงสิ่งที่จะเกิดขึ้นจากความไม่จริง... นี่คือคนที่เจ้าอยากจะเป็นหรือ?"\n\n"
 bp2_character_interaction.1001.desc_honest: "$bp2_character_interaction.desc_honest$"เอ่อ... ข้าเคยโกหกมาก่อน," [recipient.GetFirstNameNoTooltip] ยอมรับ "แต่ข้าปรารถนาที่จะเป็นเหมือนท่าน, [recipient.Custom2('RelationToMeShort', ROOT.Char)] ดีและซื่อสัตย์!""
 bp2_character_interaction.desc_craven_common: "และคว้าคอเสื้อของ [recipient.GetHerHim] พลางถ่มน้ำลาย: #EMP "ตีข้าสิ!"#!\n\n[recipient.GetSheHe|U] ตัวสั่น ประท้วง: "แต่ท่านคือ [ROOT.Char.GetTitleAsNameNoTooltip]!"\n\n"
 bp2_character_interaction.desc_craven: "$bp2_character_interaction.desc_craven_common$"ใช่แล้ว ข้าคือ, [recipient.Custom('GirlBoy')] การลงมือกับข้ามีโทษทัณฑ์อันน่าสะพรึงกลัว เจ้าต้องจำไว้ว่า: ทั้งหน้าที่และความปรารถนาสามารถทำลายเจ้าได้ การรอดชีวิตดีกว่าตายเพื่อความโง่เขลา!"\n\n"
 bp2_character_interaction.1001.desc_craven: "$bp2_character_interaction.desc_craven$[recipient.GetFirstNameNoTooltip] หมอบคลาน "ได้โปรด อย่าทำร้ายข้าเลย!" [recipient.GetSheHe] อ้อนวอน"
 bp2_character_interaction.desc_brave: "$bp2_character_interaction.desc_craven_common$"ทำสิ!" ข้ายืนกราน จนกระทั่งถูกตีเข้าที่ใบหน้าที่ยิ้มกว้างของข้า\n\n"อย่ากลัวสิ่งใด, [recipient.Custom('GirlBoy')]! เพราะหากเจ้าสามารถตีข้าได้ อะไรเล่าที่เจ้า #EMP ทำไม่ได้#!? จงพยายาม มุ่งมั่น ล้มเหลว! แล้วเจ้าจะตายเพื่อเกียรติยศ ความรัก หน้าที่ — ทั้งหมดดีกว่าความตายอันไร้ความหมายบนเตียงนอน!"\n\n"
bp2_character_interaction.1001.desc_brave_self: "$bp2_character_interaction.desc_brave$"[recipient.GetFaith.HighGodName] และ [recipient.GetPrimaryTitle.GetNameNoTier]!" [recipient.GetFirstNameNoTooltip] ร้อง "ข้าจะไม่ล้มเหลว!""
 bp2_character_interaction.1001.desc_brave_liege: "$bp2_character_interaction.desc_brave$"[recipient.GetFaith.HighGodName] และ [recipient.GetLiege.GetPrimaryTitle.GetNameNoTier]!" [recipient.GetFirstNameNoTooltip] ร้อง "ข้าจะไม่ล้มเหลว!""
 bp2_character_interaction.1001.desc_brave_root: "$bp2_character_interaction.desc_brave$"[recipient.GetFaith.HighGodName] และ [ROOT.Char.GetPrimaryTitle.GetNameNoTier]!" [recipient.GetFirstNameNoTooltip] ร้อง "ข้าจะไม่ล้มเหลว!""
 bp2_character_interaction.desc_shy_common: "ขณะที่ [recipient.GetSheHe] เล่นอยู่คนเดียว ซึ่งเป็นสิ่งที่ [recipient.GetSheHe] ทำบ่อยครั้งในช่วงหลัง ข้าถามว่า: "ทำไม?"\n\n"มันมีประโยชน์อะไรหรือ, [recipient.Custom2('RelationToMeShort', ROOT.Char)] ของข้า? การหัวเราะคิกคัก การนินทา... มันก็แค่เสียเวลาเปล่า"\n\n"
 bp2_character_interaction.desc_shy: "$bp2_character_interaction.desc_shy_common$"นั่นไม่เคยเปลี่ยน ข้าเกรงว่า," ข้าถอนหายใจ "เจ้าจะต้องเผชิญกับการร้องขอให้ใช้เวลากับผู้อื่นเสมอ เพื่อเป็นเพียงหน้าตาต่อสาธารณะที่ไม่มีจิตวิญญาณส่วนตัว จงยืนหยัดมั่นคง มีความสง่างามในความสันโดษ"\n\n"
 bp2_character_interaction.1001.desc_shy: "$bp2_character_interaction.desc_shy$[recipient.GetFirstNameNoTooltip] พึมพำเห็นด้วย หลบสายตาข้า"
 bp2_character_interaction.desc_gregarious: "$bp2_character_interaction.desc_shy_common$"คิดดูสิ," ข้าตอบ "มีความทรงจำอันล้ำค่าของการอยู่คนเดียวหรือไม่? ความตื่นเต้น ความอบอุ่น และความรักอยู่ที่ไหน? หากเจ้าต้องการ ข้าสามารถสอนเจ้าให้เล่าเรื่อง เล่าเรื่องตลก: การหัวเราะคิกคักและการนินทาจะอยู่ภายใต้คำสั่งของเจ้า!"\n\n"
 bp2_character_interaction.1001.desc_gregarious: "$bp2_character_interaction.desc_gregarious$"ตกลง," [recipient.GetFirstNameNoTooltip] ยิ้ม "สอนข้าสิ""
 bp2_character_interaction.desc_ambitious_common: "พร้อมคำถาม: "เจ้าชอบเป็นเด็กหรือไม่?"\n\n"ไม่," [recipient.GetSheHe] ย่นจมูกของ [recipient.GetHerHis], "ผู้ใหญ่ปฏิบัติต่อข้าเหมือนสุนัข! พวกเขาบอกข้าเสมอว่าต้องทำอะไร!"\n\n"
 bp2_character_interaction.desc_ambitious: "$bp2_character_interaction.desc_ambitious_common$"จงพิสูจน์ความโง่เขลาของพวกเขาให้เห็น! แสดงความกระตือรือร้น; มุ่งมั่นที่จะเป็นมากกว่าที่เจ้าเป็น เว้น แต่... เจ้า #EMP ต้องการ#! ถูกดูหมิ่นเหมือนเด็ก... แม้ว่าร่างกายของเจ้าจะร่วงโรยไปตามวัย?"\n\n"
 bp2_character_interaction.1001.desc_ambitious: "$bp2_character_interaction.desc_ambitious$"ไม่! มีเรื่องต้องทำมากเกินไป," [recipient.GetFirstNameNoTooltip] ตอบ "คอยดูเถอะ! ทุกคนจะมองมาที่ความเป็นผู้นำของข้าในสักวันหนึ่ง""
 bp2_character_interaction.desc_content: "$bp2_character_interaction.desc_ambitious_common$"แต่," ข้าแย้ง, "เจ้าปรารถนาที่จะเข้าร่วมการโต้แย้งเรื่องทรัพย์สิน นับภาษี และรู้สึกว่าคนที่เจ้ารักพึ่งพาเจ้าอย่างสิ้นเชิงเสมอหรือ? ในไม่ช้า การเล่นจะไม่มีอีกต่อไปสำหรับเจ้า จงลิ้มรสสิ่งที่เจ้ามี, [recipient.Custom('GirlBoy')] จงลิ้มรสมันอย่างสุดซึ้ง"\n\n"
 bp2_character_interaction.1001.desc_content: "$bp2_character_interaction.desc_content$"ข้าขอบคุณ — ข้าขอบคุณ! ขอบคุณสำหรับเวลานี้กับท่าน, [recipient.Custom2('RelationToMeShort', ROOT.Char)]," [recipient.GetFirstNameNoTooltip] ยิ้มแย้ม"
 bp2_character_interaction.desc_arbitrary_common: "ถือ [recipient.Custom( 'child_favorite_toy' )] ชิ้นโปรดของเด็กอีกคน พลางพูดว่า: "เจ้าอาจจะมีสิ่งนี้"\n\n"ทำไม?" [recipient.GetSheHe] สงสัย "ข้าไม่ต้องการมันด้วยซ้ำ"\n\n"
 bp2_character_interaction.desc_arbitrary: "$bp2_character_interaction.desc_arbitrary_common$"งั้นก็โยนมันทิ้งไป! มันเป็นเพียงสัญลักษณ์, [recipient.Custom('GirlBoy')] จงกระทำจากความรู้สึกและการตัดสินใจของเจ้าเองเท่านั้น ไม่สนใจกฎเกณฑ์และกฎหมาย แล้วเจ้าจะเป็นอิสระที่จะทำตามที่เจ้าปรารถนา เจ้าอาจจะมีทุกสิ่งที่เจ้าต้องการ"\n\n"
 bp2_character_interaction.1001.desc_arbitrary: "$bp2_character_interaction.desc_arbitrary$"ใช่," [recipient.GetFirstNameNoTooltip] เห็นด้วย หยิบของเล่น, "ทำไมต้องพยายามยุติธรรมในโลกที่ไม่ยุติธรรม?""
 bp2_character_interaction.desc_just: "$bp2_character_interaction.desc_arbitrary_common$"ไม่? ทำไมล่ะ? เป็นเรื่องธรรมชาติที่จะโลภในสิ่งที่ไม่ใช่ของเจ้า ที่จะตื่นเต้นกับการเอาชนะผู้อื่น ทำไมไม่เอาสิ่งที่เจ้าทำได้ และอนุญาตให้ข้าใช้อำนาจของข้าตามที่ข้าปรารถนา?"\n\n"
 bp2_character_interaction.1001.desc_just: "$bp2_character_interaction.desc_just$"อย่าเป็นทรราช, [ROOT.Char.GetTitleAsNameNoTooltip]! มันไม่ถูกต้อง!"\n\n"ใช่แล้ว," ข้ายิ้ม "มันไม่ยุติธรรม""
 bp2_character_interaction.desc_cynical_common: "พร้อมคำถาม: "ทำไมข้าถึงปฏิบัติตาม [recipient.GetFaith.GetName]?"\n\n"เพราะ [ROOT.Char.GetFaith.HighGodName] ดีงาม," [recipient.GetSheHe] ท่องจำ\n\n"
 bp2_character_interaction.desc_cynical: "$bp2_character_interaction.desc_cynical_common$"ไม่เพียง แต่ดีงาม แต่ #EMP ทรงพลัง#! [ROOT.Char.GetFaith.HighGodName] รักษาความสงบเรียบร้อยในอาณาจักรของ [recipient.GetFaith.GetAdjectiveNoTooltip] และโดยการอ้างถึงสิ่งศักดิ์สิทธิ์ [ROOT.Char.GetFaith.AltPriestTermPlural] อาจเลียนแบบเจ้านาย และ [ROOT.Char.GetFaith.DevoteeNeuterPlural] อาจแสวงหาผลประโยชน์ทางโลก เจ้าเห็นพระหัตถ์ของ [ROOT.Char.GetFaith.HighGodName] ในสิ่งเหล่านี้หรือไม่? หรือเป็นอุบายของมนุษย์?"\n\n"
 bp2_character_interaction.1001.desc_cynical: "$bp2_character_interaction.desc_cynical$"ข้าเห็น..." [recipient.GetFirstNameNoTooltip] พยายามพูด, "โลกที่น่าเศร้า""
 bp2_character_interaction.desc_zealous: "$bp2_character_interaction.desc_cynical_common$"ใช่ ความดีงามของเจ้าคือของ [ROOT.Char.GetFaith.HighGodNamePossessive] ปัญญาของเจ้าคือของ [ROOT.Char.GetFaith.KnowledgeGodNamePossessive] ความกล้าหาญของเจ้าคือของ [ROOT.Char.GetFaith.WarGodNamePossessive] เจ้าปรารถนาที่จะอยู่คนเดียวในโลกนี้ ว่างเปล่า? หรือเจ้าจะเป็นกระบอกเสียงให้แก่สิ่งศักดิ์สิทธิ์? ข้าสามารถนำเจ้าไปสู่สิ่งนี้ได้"\n\n"
 bp2_character_interaction.1001.desc_zealous: "$bp2_character_interaction.desc_zealous$"ข้าขนลุก, [recipient.Custom2('RelationToMeShort', ROOT.Char)]!" [recipient.GetFirstNameNoTooltip] กรีดร้อง "ข้ารู้สึกถึงความโปรดปรานของ [recipient.GetFaith.HighGodName]!""
 bp2_character_interaction.desc_paranoid_common: "พร้อมคำถาม: "เจ้าไว้ใจใครมากที่สุด?"\n\n"แน่นอน — ท่าน," [recipient.GetSheHe] ตอบตามหน้าที่\n\n"
 bp2_character_interaction.desc_paranoid: "$bp2_character_interaction.desc_paranoid_common$"งั้นจงเชื่อข้าเมื่อข้าพูดว่า... ในราชสำนัก เราถูกจับตามองอยู่เสมอ จงฟังเสียงกระซิบข้างหลังเจ้า อย่าแม้ แต่... อย่าแม้ แต่ไว้ใจข้า..."\n\nใบหน้าหนึ่งมืดลงที่หน้าต่างใกล้ๆ "#EMP เร็วเข้า!#!" ข้ากระซิบ "มาอยู่ข้างหลังข้า, [recipient.Custom('GirlBoy')]!"\n\n"
 bp2_character_interaction.1001.desc_paranoid: "$bp2_character_interaction.desc_paranoid$[recipient.GetFirstNameNoTooltip] พุ่งไปหาที่กำบังของข้า เผยให้เห็นกริชที่ซ่อนไว้อย่างชาญฉลาด"
 bp2_character_interaction.desc_trusting: "$bp2_character_interaction.desc_paranoid_common$ข้าคุกเข่าลงต่อหน้า [recipient.GetHerHim] และจับมือของ [recipient.GetHerHis] ไว้ในมือของข้า\n\n"ข้าสาบานว่าจะไม่ ทำให้เจ้าผิดหวัง เด็กน้อย เจ้า #EMP ต้อง#! พึ่งพาผู้อื่นเพื่อความอยู่รอดในโลกมนุษย์นี้ และหัวหน้าของผู้ที่เจ้าอาจพึ่งพาได้... จะเป็นข้าเสมอ"\n\n"
 bp2_character_interaction.1001.desc_trusting: "$bp2_character_interaction.desc_trusting$น้ำตาคลอเบ้าในดวงตาของ [recipient.GetHerHis] [recipient.GetFirstNameNoTooltip] ตอบว่า: \"ข้าเชื่อใจท่าน\""
 bp2_character_interaction.desc_compassionate: "$bp2_character_interaction.desc_callous_common$"หัวใจของพวกเขาดีงาม," ข้าพึมพำ กอด [recipient.GetHerHim] "แต่อำนาจสามารถ ทำให้ตาบอดและความแข็งแกร่งสามารถ ทำให้หลงใหล อย่าให้ภาพอันชั่วร้ายบดบังหัวใจของเจ้า: แทนที่จะทำ เช่นนั้น จงเห็นความต้องการความเมตตาในสิ่งเหล่านั้น"\n\n"
 bp2_character_interaction.1001.desc_compassionate: "$bp2_character_interaction.desc_compassionate$"ข้าจะพยายามเป็นผู้สูงศักดิ์ตลอดชีวิตของข้า!" [recipient.GetFirstNameNoTooltip] ร้องไห้"
 bp2_character_interaction.desc_callous_common: "ด้วยความกังวล [recipient.GetSheHe|U] เพิ่งอยู่ในเหตุการณ์ขณะที่ [ROOT.Char.Custom('KnightCulturePluralNoTooltip')|l] คนหนึ่งของข้าทำร้ายคนรับใช้ที่ไม่เชื่อฟัง\n\nเด็กที่หวาดกลัวถามว่า: "ทำไมผู้คนถึงรุนแรง เช่นนี้?"\n\n"
 bp2_character_interaction.desc_callous: "$bp2_character_interaction.desc_callous_common$"คนรับใช้คนนั้น," ข้าตอบ, "จะทำงานของเขาเพียง เพราะกลัวการถูกทุบตี หากปราศจากความรุนแรง ปราศจากกำลัง สถานที่ของเราในโลกนี้ก็จะสูญหายไป นอกจากนี้... เจ้าปรารถนาที่จะเสียเวลาในชีวิตไปกับการร้องไห้เพื่อคนรับใช้หรือ?"\n\n"
 bp2_character_interaction.1001.desc_callous: "$bp2_character_interaction.desc_callous$"อี๋," [recipient.GetFirstNameNoTooltip] เยาะเย้ย, "ไม่""
 bp2_character_interaction.desc_sadistic: "$bp2_character_interaction.desc_callous_common$"โลกคือความรุนแรง," ข้าตอบ "ผู้คนอ่อนแอและเห็นแก่ตัว เด็กน้อย และพวกเขามีมากมาย การหลั่งเลือดของพวกเขาไม่มีความหมาย คิดถึงอำนาจที่ [ROOT.Char.Custom('KnightCultureNoTooltip')|l] ของข้ารู้สึกสิ เจ้าอยากได้อำนาจนั้นใช่ไหม...?"\n\n"
 bp2_character_interaction.1001.desc_sadistic: "$bp2_character_interaction.desc_sadistic$"ใช่," [recipient.GetFirstNameNoTooltip] กระซิบ, "ใช่ ข้าอยากได้...""
 bp2_character_interaction.desc_stubborn: "เต็มไปด้วยความเชื่อมั่น ถามว่า: "วันนี้มีความสุขอะไรบ้าง?"\n\n"โอ้... เพื่อนๆ ของข้าชวนข้าไปเก็บดอกไม้โง่ๆ อีกแล้ว..."\n\n"[recipient.GetFirstNameNoTooltip]!" ข้าร้อง "เจ้าจะเสียเวลาในชีวิตไปกับความต้องการชั่ววูบของผู้อื่นอีกเท่าไหร่? จงยึดมั่นในการตัดสินใจของเจ้า; จงยืนหยัดมั่นคงเหมือน [ROOT.Char.Custom('KnightCultureNoTooltip')|l]! เจ้าไม่คิดว่าทางเลือกของเจ้าจะสนุกที่สุดหรือ?"\n\n"
 bp2_character_interaction.1001.desc_stubborn: "$bp2_character_interaction.desc_stubborn$"ใช่," [recipient.GetSheHe] ครุ่นคิด, "ข้ารู้ว่าข้าต้องการอะไร! ทำไมข้าต้องให้ใครมาเปลี่ยนข้าด้วย?""
 bp2_character_interaction.desc_fickle: "ตามอำเภอใจ ถามว่า: "วันนี้มีความสุขอะไรบ้าง?"\n\nขณะที่ [recipient.GetSheHe] แจกแจงแผนการ ข้าก็หดตัว\n\n"ศัตรูสามารถติดตามการเคลื่อนไหวของเจ้าได้อย่างง่ายดายเพียงใด! คิดดูว่าความสุขแบบเดียวกันนี้จะจืดจางไปในไม่ช้าเพียงใด! คนเราสามารถวางแผนที่จะรู้สึกสุขได้หรือไม่? ที่จะรู้ถึงความเจ็บปวด? ไม่! จงปล่อยให้ตนเองมีอิสระที่จะทำอะไรก็ได้ตามใจชอบ"\n\n"
 bp2_character_interaction.1001.desc_fickle: "$bp2_character_interaction.desc_fickle$[recipient.GetSheHe|U] ยักไหล่และพูดว่า: "แน่นอน อย่างไรก็ตาม ข้าไม่สนใจเรื่องเหล่านั้นอีกต่อไปแล้ว""
 bp2_character_interaction.desc_eccentric: "และโยนหนูที่ดิ้นไปมาลงบนตักของ [recipient.GetHerHis] อย่างคล่องแคล่ว\n\nเมื่อ [recipient.GetSheHe] กระโดดโลดเต้นและร้องเสียงหลงด้วยความประหลาดใจเสร็จแล้ว [recipient.GetSheHe] ก็ถามว่า: "ทำไม? ทำไม?!"\n\n"คนเราไม่ควรมีชีวิตอยู่ในความอัปยศอดสู เพราะความแปลกประหลาดของตน ไม่ใช่ [ROOT.Char.GetTitleAsNameNoTooltip] โดยเฉพาะอย่างยิ่ง! จงดูหมิ่นความคาดหวัง จงเดินบนเส้นทางของตนเอง แล้วเจ้าจะกลายเป็น... บางสิ่ง บางสิ่งที่ยิ่งใหญ่"\n\n"
 bp2_character_interaction.1001.desc_eccentric: "$bp2_character_interaction.desc_eccentric$"หัวเราะคิกคัก, [ROOT.Char.Custom2('RelationToMeShort', recipient)] ของข้าแลบลิ้นของ [recipient.GetHerHis] เห็นด้วย"
 bp2_character_interaction.desc_vengeful: "ขณะที่ [recipient.GetSheHe] คร่ำครวญอย่างบึ้งตึงถึงเกม [ROOT.Char.Custom('BG_GameType_Generic')] ที่แพ้ไป\n\n"ไอ้คนพาลนั่นโกง!" [recipient.Custom('GirlBoy')] ยืนกราน "เพื่อนๆ ของข้าจะหยุดพยายามเอาเปรียบข้าเมื่อไหร่กัน?"\n\nข้าฉวยโอกาส พูดว่า: "พวกเขารู้ว่าพวกเขาสามารถล่วงเกินเจ้าได้ เด็กน้อย โดยไม่ต้องกลัว เอาหมากทิ่มตาคนโกงสิ! หักกระดานบนหลังคนโกงสิ! ให้ทุกคนรู้ว่าเจ้าไม่ให้อภัยความผิดใดๆ!"\n\n"
 bp2_character_interaction.1001.desc_vengeful: "$bp2_character_interaction.desc_vengeful$"การแก้แค้น," [recipient.GetFirstName] หัวเราะเบาๆ, "ข้ามีความคิดอยู่สองสามอย่าง...""
 bp2_character_interaction.desc_forgiving: "ขณะที่ [recipient.GetSheHe] คร่ำครวญอย่างบึ้งตึงถึงเกม [ROOT.Char.Custom('BG_GameType_Generic')] ที่แพ้ไป\n\n"นังแพศยานั่นโกง!" [recipient.Custom('GirlBoy')] ยืนกราน "นางสมควรโดนหมากทิ่มตา! แต่... นางไม่ต้องการเป็นเพื่อนอีกต่อไปแล้ว..."\n\nข้าฉวยโอกาส พูดว่า: "จงคิดถึงการให้อภัย ให้มันอยู่ในใจเจ้าเสมอ หากเจ้าแสดงความเมตตาต่อคนโกง ตอนนี้เจ้าจะไม่รวยเพื่อนขึ้นหนึ่งคนหรือ?"\n\n"
 bp2_character_interaction.1001.desc_forgiving: "$bp2_character_interaction.desc_forgiving$"ใช่," [recipient.GetSheHe] ถอนหายใจ "ข้าจะจำเรื่องนี้ไว้""
 bp2_character_interaction.1001.a: "นั่นแหละ [recipient.Custom('GirlBoy')] ของข้า!"
 bp2_character_interaction.1001.a.tt: "ส่งต่อลักษณะนิสัย [target_trait.GetNameNoTooltip(GetPlayer)|l]"
 bp2_character_interaction.1001.a.flavor: "ท่านเริ่มเข้าใจ ซึ่งกันและกัน และ [recipient.GetSheHe] เริ่มเติบโตคล้ายคลึงกับท่านมากขึ้น"
 bp2_character_interaction.1002.t: "$influence_child_personality_interaction$: [target_trait.GetNameNoTooltip(GetPlayer)] — ล้มเหลว"
 bp2_character_interaction.1002.desc_intro: "$bp2_character_interaction.1001.desc_intro$"
 bp2_character_interaction.1002.desc_lustful: "$bp2_character_interaction.desc_lustful$"โอ้..." [recipient.GetSheHe] บ่นพึมพำ "แต่มีเรื่อง #EMP ดีกว่า#! ตั้งเยอะแยะให้ทำ...""
 bp2_character_interaction.1002.desc_chaste: "$bp2_character_interaction.desc_chaste$"แต่..." [recipient.GetFirstNameNoTooltip] ครวญคราง, "หัวใจข้าจะไม่ทรยศข้า เช่นนั้น!"
 bp2_character_interaction.1002.desc_gluttonous: "$bp2_character_interaction.desc_gluttonous$"แต่... ข้าแค่อยากรู้สึก #EMP ควบคุม#! ได้..."
 bp2_character_interaction.1002.desc_temperate: "$bp2_character_interaction.desc_temperate$"แต่ — แค่ [recipient.Custom('GetLocalStreetFood')] นิดหน่อยเอง?" [recipient.GetSheHe] ประท้วง "และ [ROOT.Char.GetFaith.HealthGodName] ก็อนุญาตให้มีความสุข เช่นนี้จากมัน!"
 bp2_character_interaction.1002.desc_greedy: "$bp2_character_interaction.desc_greedy$"ก้อนหิน?" [recipient.GetSheHe] สงสัย "ใช่... ข้าเดาว่าไม่มีใครชอบคนใจแข็งเหมือนหิน..."
 bp2_character_interaction.1002.desc_generous: "$bp2_character_interaction.desc_generous$"ให้หมวกประดับทองคำใบใหม่แก่ข้า," [recipient.GetFirstNameNoTooltip] ออดอ้อน, "แล้วข้าจะ #EMP คิด#! ดู..."
 bp2_character_interaction.1002.desc_lazy: "$bp2_character_interaction.desc_lazy$"ไม่!" [recipient.GetFirstNameNoTooltip] ตอบ "ข้าล้มเหลวไม่ได้! ข้าจะพยายามให้หนักขึ้น""
 bp2_character_interaction.1002.desc_diligent: "$bp2_character_interaction.desc_diligent$"ข้าไม่รู้จะทำอย่างไร!" [recipient.GetFirstNameNoTooltip] ครวญคราง "ได้โปรดปล่อยข้าไว้ตามลำพัง..."
 bp2_character_interaction.1002.desc_wrathful: "$bp2_character_interaction.desc_wrathful$"แต่..." [recipient.GetSheHe] กลืนน้ำลาย, "ข้าไม่อยากรู้สึก เช่นนั้นอีกเลย..."
 bp2_character_interaction.1002.desc_calm: "$bp2_character_interaction.desc_calm$"การตัดสินใจของข้าชัดเจน!" [recipient.GetFirstNameNoTooltip] ตะคอก "ข้าตัดสินว่านี่มันโง่เง่า!"
 bp2_character_interaction.1002.desc_impatient: "$bp2_character_interaction.desc_impatient$"เอ๊ะ..." ข้าได้ยิน [recipient.GetFirstNameNoTooltip] พึมพำ, "การเล่นเป็นแม่ไก่ค่อนข้างผ่อนคลายทีเดียว""
 bp2_character_interaction.1002.desc_patient: "$bp2_character_interaction.desc_patient$"เอ่อ," [recipient.GetFirstNameNoTooltip] บ่น, "ข้าไม่อยากเป็นไก่""
 bp2_character_interaction.1002.desc_arrogant: "$bp2_character_interaction.desc_arrogant$"ข้าไม่รู้... บางทีข้าอาจจะชนะโดยบังเอิญ..."
 bp2_character_interaction.1002.desc_humble: "$bp2_character_interaction.desc_humble$"ในไม่ช้า..." [recipient.GetName] พึมพำ "ในไม่ช้า ข้าจะไม่มีใครเอาชนะได้.."
 bp2_character_interaction.1002.desc_deceitful: "$bp2_character_interaction.desc_deceitful$"มีหลุมอยู่ ใช่," [recipient.GetFirstNameNoTooltip] โต้กลับ, "แต่ข้าคิดว่ามีเพียงงูเท่านั้นที่ติดอยู่ในนั้น""
 bp2_character_interaction.1002.desc_honest: "$bp2_character_interaction.desc_honest$""ข้า? แน่นอนว่าไม่," [recipient.GetFirstNameNoTooltip] ยืนกรานอย่างกลวงๆ "อย่างที่ข้าพูด... ข้าซื่อสัตย์เสมอ""
 bp2_character_interaction.1002.desc_craven: "$bp2_character_interaction.desc_craven$"ปล่อยข้า!" [recipient.GetFirstNameNoTooltip] ตะโกน "เหมือน [recipient.Custom('KnightCultureNoTooltip')|l] ผู้สูงศักดิ์ ข้าไม่กลัวความตาย!""
 bp2_character_interaction.1002.desc_brave: "$bp2_character_interaction.desc_brave$"แต่... ข้า," [recipient.GetFirstNameNoTooltip] สะอื้น "ข้าไม่อยากตาย..."
 bp2_character_interaction.1002.desc_shy: "$bp2_character_interaction.desc_shy$"ถ้าท่านได้ยินสิ่งที่ผู้คนพูดตอนที่ท่านไม่อยู่, [recipient.Custom2('RelationToMeShort', ROOT.Char)]... ท่านจะไม่รู้สึกสง่างาม""
 bp2_character_interaction.1002.desc_gregarious: "$bp2_character_interaction.desc_gregarious$"ได้โปรด..." [recipient.Custom('GirlBoy')] หดตัว, "แค่ปล่อยข้าไว้ตามลำพัง""
 bp2_character_interaction.1002.desc_ambitious: "$bp2_character_interaction.desc_ambitious$"ข้า... ไม่สนใจ," [recipient.GetFirstNameNoTooltip] ถอนหายใจ "ข้าจะร่วงโรยไปอยู่ดี""
 bp2_character_interaction.1002.desc_content: "$bp2_character_interaction.desc_content$"แต่สักวันหนึ่ง," [recipient.GetFirstNameNoTooltip] พึมพำ, "สักวันหนึ่งข้าจะมีมากกว่านี้เยอะ..."
 bp2_character_interaction.1002.desc_arbitrary: "$bp2_character_interaction.desc_arbitrary$"บางทีนั่นอาจเป็นสิทธิ์ของท่านในฐานะ [ROOT.Char.GetTitleAsNameNoTooltip]," [recipient.GetFirstNameNoTooltip] ตอบ, "แต่ข้าไม่ #EMP ได้รับอนุญาต#! เหมือนกัน..."
 bp2_character_interaction.1002.desc_just: "$bp2_character_interaction.desc_just$"เอ่อ," [recipient.GetFirstName] พูด ยิ้มอย่างชั่วร้าย, "ถ้าท่านยืนกราน..."
 bp2_character_interaction.1002.desc_cynical: "$bp2_character_interaction.desc_cynical$"ข้าเห็นระเบียบที่ [recipient.GetFaith.HighGodNamePossessive] เลือกสรร!" [recipient.GetFirstNameNoTooltip] โต้กลับ "และ [recipient.GetFaith.HighGodName] ดีงาม!"
 bp2_character_interaction.1002.desc_zealous: "$bp2_character_interaction.desc_zealous$"ได้โปรด, [recipient.Custom2('RelationToMeShort', ROOT.Char)]," [recipient.GetFirstNameNoTooltip] บ่น, "ท่านเพิ่งถ่มน้ำลายใส่ข้าเต็มไปหมด""
 bp2_character_interaction.1002.desc_paranoid: "$bp2_character_interaction.desc_paranoid$[recipient.GetFirstNameNoTooltip] หัวเราะคิกคัก"
 bp2_character_interaction.1002.desc_trusting: "$bp2_character_interaction.desc_trusting$"อือฮึ," [recipient.GetFirstNameNoTooltip] พึมพำ "#EMP แน่นอน...""
 bp2_character_interaction.1002.desc_compassionate: "$bp2_character_interaction.desc_compassionate$"ความเมตตา? ข้าอาจจะเจ็บตัวต่อไป — แล้วความเมตตาจะปกป้องข้าได้อย่างไร?!"
 bp2_character_interaction.1002.desc_callous: "$bp2_character_interaction.desc_callous$"เอ่อ ต้องมีใครสักคนดูแลวิญญาณที่น่าสงสารเหล่านั้นสิ!"
 bp2_character_interaction.1002.desc_sadistic: "$bp2_character_interaction.desc_sadistic$"ไม่มีวัน!" [recipient.GetFirstNameNoTooltip] ถอยหนี "ข้าอยากเป็นคนดี!"
 bp2_character_interaction.1002.desc_stubborn: "$bp2_character_interaction.desc_stubborn$"บางที..." [recipient.GetSheHe] ถอนหายใจ "แต่มันก็ไม่เป็นไร..."
 bp2_character_interaction.1002.desc_fickle: "$bp2_character_interaction.desc_fickle$"แต่," [recipient.GetSheHe] ประท้วง, "ข้าให้คำมั่นกับเพื่อนๆ ของข้าแล้ว!"
 bp2_character_interaction.1002.desc_eccentric: "$bp2_character_interaction.desc_eccentric$"ข้าคิดว่า," [recipient.GetSheHe] หดตัว, "ข้าอยากจะเข้ากับคนอื่นได้มากกว่า..."
 bp2_character_interaction.1002.desc_vengeful: "$bp2_character_interaction.desc_vengeful$"แต่... งั้นเขาก็จะไม่เล่นกับข้าอีกเลย..."
 bp2_character_interaction.1002.desc_forgiving: "$bp2_character_interaction.desc_forgiving$"เพื่อน #EMP คนเดียว?!#!" [recipient.GetSheHe] โหยหวน "ไม่! ข้าก็จะยังคงถูกตามรังควานโดย #EMP คนโกง#!!""
 bp2_character_interaction.1002.a: "ข้าจะเข้าถึง [recipient.Custom('GetLassLad')] ผู้นี้ได้หรือไม่...?"
 bp2_character_interaction.1002.a.tt: "ล้มเหลวในการส่งต่อลักษณะนิสัย [target_trait.GetNameNoTooltip(GetPlayer)|l]"
 bp2_character_interaction.1002.a.flavor: "คำสอนของท่านตกไปถึงหูที่ไม่เต็มใจรับฟัง"
 selected_sinful_trait_tt: "ลักษณะนิสัย [trait|E] ที่เลือกเป็น [sinful|E] ใน [recipient.GetFaith.GetName]: $VALUE|+=0$"
 selected_virtuous_trait_tt: "ลักษณะนิสัย [trait|E] ที่เลือกเป็น [virtuous|E] ใน [recipient.GetFaith.GetName]: $VALUE|+=0$"
 has_three_traits_already: "[recipient.GetShortUIName] มี [personality_traits|E] #V 3#! ลักษณะแล้ว: $VALUE|+=0$"
 has_commander_traits_already: "[recipient.GetShortUIName] มี [commander_traits|E] อยู่แล้ว: $VALUE|+=0$"
 has_compatible_personality_tt: "[recipient.GetShortUIName] มี [childhood_trait|E] ที่เข้ากันได้: $VALUE|+=0$"
 has_incompatible_personality_tt: "[recipient.GetShortUIName] มี [childhood_trait|E] ที่เข้ากันไม่ได้: $VALUE|+=0$"
 guardian_influenced_personality: "ชักจูงบุคลิกภาพของเด็ก"
 guardian_influenced_personality_desc: "[actor.GetShortUINameNoTooltip] ได้มอบลักษณะนิสัย [target_trait.GetName(recipient)] ให้แก่บุตรของท่าน, [recipient.GetShortUINameNoTooltip]"
 guardian_influenced_personality_fail: "ล้มเหลวในการชักจูงบุคลิกภาพของเด็ก"
 guardian_influenced_personality_fail_desc: "[actor.GetShortUINameNoTooltip] พยายามมอบลักษณะนิสัย [target_trait.GetName(actor)] ให้แก่บุตรของท่าน, [recipient.GetShortUINameNoTooltip], แต่ล้มเหลว"
 influence_child_personality_interaction_trait_limit: "[CHARACTER.GetShortUINameNoTooltip] มี [personality_traits|E] #V 4#! ลักษณะแล้ว"
 influence_child_personality_interaction_all_same_traits: "[CHARACTER.GetShortUINameNoTooltip] มี [personality_traits|E] เดียวกันหรือลักษณะนิสัยตรงกันข้ามอยู่แล้ว"
 crusading_claim_cb_reason: "$crusading_claim_cb$: $VALUE|=+0$"
