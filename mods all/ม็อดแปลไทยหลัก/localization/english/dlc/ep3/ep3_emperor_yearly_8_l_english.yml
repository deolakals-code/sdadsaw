l_english: 
 ep3_emperor_yearly.8000.t: "แบ่งเบาภาระ"
 ep3_emperor_yearly.8000.intro_byz: "[ROOT.Char.GetCapitalLocation.GetBaronyNameExplicitlyNoTooltip] แสงสว่างอันมิรู้ดับแห่งจักรวรรดิ กำลังตึงเครียดในยามยากลำบากนี้"
 ep3_emperor_yearly.8000.intro: "[ROOT.Char.GetCapitalLocation.GetBaronyNameExplicitlyNoTooltip] นครหลวงอันยิ่งใหญ่ของเรา กำลังแบกรับภาระหนักอึ้งจากข้อเรียกร้องมากมายของ [ROOT.Char.GetPrimaryTitle.GetNameNoTierPossessiveNoTooltip] ที่มีต่อผู้คน"
 ep3_emperor_yearly.8000.desc: "\n\nความขัดแย้งครั้งล่าสุดได้ส่งผลกระทบ: ผู้เกณฑ์ทหารประสบปัญหาในการหาคนให้ครบตามจำนวนที่กำหนดมากขึ้นเรื่อยๆ และการขาดแคลนแรงงานทุกประเภทก็เกิดขึ้นทั่วทั้งเมือง\n\n[ROOT.Char.Custom2('RelationToMeShort', suggestor)] ของข้า [suggestor.GetTitledFirstName] ได้รวบรวมรายชื่อมณฑลที่มั่งคั่ง ซึ่งความมั่งมีของพวกเขาอาจช่วยบรรเทาทุกข์ในยามที่เมืองหลวงต้องการความช่วยเหลือได้"
 ep3_emperor_yearly.8000.a: "ใช่แล้ว นำคนมาจาก [county_1.GetCountyData.GetCapital.GetBaronyNameExplicitlyNoTooltip]"
 ep3_emperor_yearly.8000.b: "เมืองหลวงต้องมาก่อน [county_2.GetCountyData.GetCapital.GetBaronyNameExplicitlyNoTooltip]"
 ep3_emperor_yearly.8000.c: "[county_3.GetCountyData.GetCapital.GetBaronyNameExplicitlyNoTooltip] ต้องเสียสละ"
 ep3_emperor_yearly.8000.d: "มันเป็นเพียงช่วงเวลาฝืดเคืองเท่านั้น"

 ep3_emperor_yearly.8010.opening_byz: "ขอถวายบังคม [ROOT.Char.GetTitleAsNameNoTooltip]"
 ep3_emperor_yearly.8010.opening: "ขอคารวะ [ROOT.Char.GetTitledFirstNameNoTooltip],"
 ep3_emperor_yearly.8010.desc: "[liar.GetWomanMan] นามว่า [liar.GetFirstName] เข้ามาหาข้าเพื่อหางานทำ โดยอ้างว่าถือจดหมายแนะนำตัวจาก "[ROOT.Char.GetTitleAsNameNoTooltip] [ROOT.Char.GetHerselfHimself]"\n\nตราประทับถูกตัดสินว่าเป็นของปลอม และบัดนี้ข้าได้คุมขังผู้อวดอ้างอันโอหังผู้นี้ไว้ในคุกใต้ดินแล้ว"
 ep3_emperor_yearly.8010.a: "ความอุตสาหะของท่านจะได้รับรางวัล [governor.GetFirstNameNoTooltip]"
 ep3_emperor_yearly.8010.b: "นั่น #EMP มัน#! ตราของข้า! ปล่อย [liar.GetHerHim] เดี๋ยวนี้!"
 ep3_emperor_yearly.8010.c: "ดีมาก ส่งตัวคนสารเลวนั่นมาให้ข้า"
 ep3_emperor_yearly.8010.c.tt: "นักโทษถูกส่งตัวแล้ว"
 ep3_emperor_yearly.8010.d: "การปลอมแปลงตราหลวงต้องถูกลงโทษอย่างเด็ดขาด"

 ep3_emperor_yearly.8020.t: "การพระราชทานสิทธิ์สีม่วงพอร์ฟีรี"
 ep3_emperor_yearly.8020.intro.really_bankrupt: "ห้องพระคลังว่างเปล่าไร้ ซึ่งแม้ แต่เศษทองคำ และ [ROOT.Char.GetPrimaryTitle.GetDefinitiveName|l] กำลังประสบปัญหาอย่างหนักจากการขาดสภาพคล่อง เช่นนี้"
 ep3_emperor_yearly.8020.intro.bankrupt: "ท้องพระคลังว่างเปล่า และตั๋วสัญญาใช้เงินของพนักงานบัญชีคือสิ่งเดียวที่ค้ำจุนให้กองทัพและระบบราชการของ [ROOT.Char.GetPrimaryTitle.GetDefinitiveNamePossessive|l] ดำเนินต่อไปได้ใน แต่ละวัน"
 ep3_emperor_yearly.8020.intro: "เงินตราลดน้อยถอยลง และเป็นการยากขึ้นเรื่อยๆ ที่จะหาทุนทรัพย์ที่จำเป็นสำหรับแผนการของข้า นับประสาอะไรกับการดำเนินไปอย่างราบรื่นของ [ROOT.Char.GetPrimaryTitle.GetDefinitiveName|l]"
 ep3_emperor_yearly.8020.desc: "\n\nหลังจากบอกใบ้ถึงประโยชน์ของการอุปถัมภ์ที่ถูกที่ถูกทางและความจำเป็นอันน่าอึดอัดใจหลายครั้งหลายครา ในที่สุด [ROOT.Char.Custom2('RelationToMeShort', suggestor)] ของข้า [suggestor.GetTitledFirstName] ก็พูดอย่างตรงไปตรงมา\n\n"ข้า แต่ [ROOT.Char.GetTitleAsNameNoTooltip] ผู้ยิ่งใหญ่... แม้ว่าการสวมใส่ [Glossary( 'พอร์ฟูรา', 'PORPHURA_GLOSS' )] เป็นพระราชอำนาจ แต่ก็ใช่ว่าจะไม่เคยมีการอนุญาตให้ใช้สิทธิ์ดังกล่าวแก่... #EMP ไพร่ฟ้าข้าแผ่นดินผู้จงรักภักดี#!""
 ep3_emperor_yearly.8020.a.friend: "สหายข้า [purpler_1.GetFirstNameNoTooltip] เป็นข้อยกเว้น"
 ep3_emperor_yearly.8020.a.claimant: "สิทธิ์อ้างอย่างของ [purpler_1.GetFirstNamePossessiveNoTooltip] ควรได้รับการยอมรับ"
 ep3_emperor_yearly.8020.a.vassal: "ข้าคิดว่า [purpler_1.GetFirstNameNoTooltip] คงสวมใส่มันได้ดี"
 ep3_emperor_yearly.8020.b.friend: "[purpler_2.GetFirstNameNoTooltip] คือสหายผู้คู่ควรของข้า"
 ep3_emperor_yearly.8020.b.claimant: "[purpler_2.GetFirstNameNoTooltip] มีสิทธิ์อ้างอันคู่ควร"
 ep3_emperor_yearly.8020.b.vassal: "[purpler_2.GetFirstNameNoTooltip] ดูเหมือนจะคู่ควร"
 ep3_emperor_yearly.8020.c.friend: "มิตรภาพต้องมาก่อน: [purpler_3.GetFirstNameNoTooltip]"
 ep3_emperor_yearly.8020.c.claimant: "ผู้อ้างสิทธิ์มีสิทธิพิเศษ: [purpler_3.GetFirstNameNoTooltip]"
 ep3_emperor_yearly.8020.c.vassal: "อาจจะเป็น [purpler_3.GetFirstNameNoTooltip] ก็ได้..."
 ep3_emperor_yearly.8020.d: "สีม่วงหลวงมิอาจ #EMP ซื้อหา#! ได้!!"
 PORPHURA_GLOSS: "นับตั้งแต่สมัยจักรวรรดิโรมันตอนปลาย ห้ามมิให้ผู้ใดนอกจากจักรพรรดิสวมใส่เสื้อผ้าที่ย้อมด้วยสีม่วงไทระอันล้ำค่า ซึ่งทำจากสารคัดหลั่งของหอยทากทะเลมูเร็กซ์ในทะเลเมดิเตอร์เรเนียน"

 ep3_emperor_yearly.8030.t: "หายนะแห่งบอสพอรัส"
 ep3_emperor_yearly.8030.desc: "วาฬที่น่าสะพรึงกลัวตัวหนึ่งกำลังทำลายล้างการเดินเรือตลอดแนวช่องแคบ [ROOT.Char.Custom2('RelationToMeShort', complainer)] ของข้า [complainer.GetTitledFirstName] คร่ำครวญว่า: "ชาวประมง พ่อค้า — แม้ แต่กัปตันเรือรบ! ทุกคนต่างหวาดกลัวที่จะออกจากท่าเรือปลอดภัยของตน"\n\nบันทึกเก่าแก่เกี่ยวกับการต่อสู้ของ [justinian.GetFirstNamePossessiveRegnal] กับ 'พอร์ฟีริออส' ซึ่งเป็นหายนะมานานหลายทศวรรษก่อนจะเกยตื้นบนชายหาดและถูกสับเป็นชิ้นๆ ได้ถูกนำมากล่าวถึง — บางคนถึงกับเสนอว่าภัยคุกคามใหม่นี้อาจเป็นทายาทผู้มาล้างแค้น...\n\nมีการเสนอกลอุบายอันน่าสงสัยเพื่อจัดการกับภัยสยองแห่งห้วงลึกนี้ ในขณะที่เรื่องราวการออกอาละวาดของมันก็เพิ่มพูนขึ้นเรื่อยๆ"
 every_bosporos_sea_province_tt: "$sea_bosporus$, $sea_marmara$, และ $sea_dardanelles$"
 every_bosporos_coast_county_tt: "[THIS.Char.GetCapitalLocation.GetName] และ [counties|E] ชายฝั่งช่องแคบอื่นๆ"
 ep3_emperor_yearly.8030.a: "มันต้องถูกหยุดยั้ง ไม่ว่าจะด้วยวิธีใดก็ตาม!"
 ep3_emperor_yearly.8030.a.success: "อสูรร้ายถูกหยุดยั้งแล้ว"
 ep3_emperor_yearly.8030.a.failure: "อสูรร้ายนั้นมิอาจหยุดยั้งได้"
 ep3_emperor_yearly.8030.a.flavor: "เตรียมเรือแกลลีย์ให้พร้อม นำเนื้อของมันมาให้ข้า!"
 ep3_emperor_yearly.8030.c: "จงบังคับใช้อาวุธ จัดขบวนเรือ และกำหนดเส้นทางปลอดภัย"
 ep3_emperor_yearly.8030.d: "เหล่ากะลาสีต้องพึ่งพา [ROOT.Char.GetFaith.WaterGodName]"
 ep3_emperor_yearly.8030.d.flavor: "เราทำได้เพียงสวดภาวนาขอการปลดปล่อย..."

 ep3_emperor_yearly.8040.t: "พระพิโรธของ [ROOT.Char.GetFaith.HighGodNameAlternatePossessive]"
 ep3_emperor_yearly.8040.intro: "การปกครองของข้าประสบกับความพ่ายแพ้และความโชคร้าย"
 ep3_emperor_yearly.8040.truce_target: "— ที่น่าเจ็บใจที่สุดคือความพ่ายแพ้อันยิ่งใหญ่ของเราด้วยน้ำมือของ [truce_target.GetTitledFirstNamePossessive] —"
 ep3_emperor_yearly.8040.truce_holder: "— แม้ แต่ชัยชนะอันยิ่งใหญ่เหนือ [truce_holder.GetTitledFirstName] ก็มีราคาที่ต้องจ่าย —"
 ep3_emperor_yearly.8040.plague: "— [epidemic.GetName] ที่ต้องสาปกำลังทำลายล้างแม้กระทั่ง [constantinople.GetNameNoTooltip] จนโรงพยาบาลรับไม่ไหว —"
 ep3_emperor_yearly.8040.past_plague: "— โรคระบาดได้คุกคามจักรวรรดิ ไม่เว้นแม้ แต่ [constantinople.GetNameNoTooltip] ให้พ้นจากความทุกข์ทรมาน —"
 ep3_emperor_yearly.8040.debt: "— ท้องพระคลังว่างเปล่า กลไกแห่งรัฐต้องพึ่งพาสินเชื่อและความเชื่อถือเพียงอย่างเดียว —"
 ep3_emperor_yearly.8040.desc: "และผู้คนก็เริ่มกระสับกระส่าย...\n\nข้าอดสงสัยไม่ได้ว่า: พวกกลุ่มทำลายรูปเคารพพูดถูกหรือไม่? ปัญหาของจักรวรรดิเป็นเพียงการลงทัณฑ์ของ [ROOT.Char.GetFaith.HighGodNamePossessive] สำหรับการเพิกเฉยต่อพระบัญญัติของ [ROOT.Char.GetFaith.HighGodHerHis] หรือไม่?\n\n"
 ep3_emperor_yearly.8040.family: "[ROOT.Char.Custom2('RelationToMeShort', family)] ของข้าเอง [family.GetFirstName] ก็เชื่อมั่นในแนวคิด เช่นนั้น บางทีข้าอาจตาบอดมาตลอด..."
 ep3_emperor_yearly.8040.predecessor: "ข้ามองย้อนไปถึงการปกครองของ [predecessor.GetTitledFirstNameRegnal] และตั้งคำถามถึงรากฐานความเชื่อของตนเอง..."
 ep3_emperor_yearly.8040.leo: "หลักคำสอนของ [leo.GetTitledFirstNameRegnal] และราชวงศ์อิซอเรียนนำมา ซึ่งความขัดแย้งครั้งใหญ่สู่จักรวรรดิและคริสตจักร — แต่ก็เพียงชั่วระยะเวลาหนึ่ง..."
 ep3_emperor_yearly.8040.a: "ถึงเวลาแล้วที่จะต้องยุติการบูชารูปเคารพทั้งปวงอย่างแท้จริง!"
 ep3_emperor_yearly.8040.b: "ข้าจะไม่ยอมจำนนต่อพวกนอกรีต"

 ep3_emperor_yearly.8050.t: "แขกผู้มิได้รับเชิญ"
 ep3_emperor_yearly.8050.desc: "เรือจากทุกมุมโลกมาทอดสมอที่ท่าเรือของ [ROOT.Char.GetPrimaryTitle.GetDefinitiveNamePossessiveNoTooltip|l] และ [marshal.GetTitledFirstName] รายงานว่ากองเรือเล็กๆ ลำหนึ่งเพิ่งทอดสมอนอกชายฝั่ง [raid_target.GetProvince.GetBaronyNameExplicitlyNoTooltip]\n\nกับตันเรือของพวกเขา เป็นอนารยชนนามว่า [raider.GetFirstName] เรียกร้องค่าไถ่ ขู่ว่าจะกระทำการเยี่ยงโจรสลัดหากคำขอของ [raider.GetHerHis] ถูกเพิกเฉย\n\nเหล่าโจรปล้นทางทะเลจากแดนเหนืออันไกลโพ้นเป็นที่หวาดกลัวอย่างยิ่ง และดูเหมือนว่ากลุ่มนี้หวังจะใช้ประโยชน์จากชื่อเสียงนี้เพียงอย่างเดียว"
 ep3_emperor_yearly.8050.a: "จ่ายราคาอันน้อยนิดให้พวกมันไป"
 ep3_emperor_yearly.8050.b: "ข้าอาจใช้ประโยชน์จากคนนอกผู้โอหัง เช่นนี้ได้"
 ep3_emperor_yearly.8050.b.byz: "ข้าอาจใช้ประโยชน์จากชาววารังเจียนผู้โอหัง เช่นนี้ได้"
 ep3_emperor_yearly.8050.c: "ส่งเรือแกลลีย์ไปจัดการพวกสุนัขเลวเหล่านี้!"
 ep3_emperor_yearly.8050.c.success: "เรือยาวแตกพ่ายกระจัดกระจาย"
 ep3_emperor_yearly.8050.c.failure: "พวกโจรปล้นหลบหลีกเก่ง"

 ep3_emperor_yearly.8060.t: "แนวหน้าอันปั่นป่วน"
 ep3_emperor_yearly.8060.intro: "ข่าวร้ายมาถึงจาก [defector.GetPrimaryTitle.GetNameNoTier]: มีเสียงกระซิบว่า [ROOT.Char.Custom2('RelationToMeShort', defector)] ของข้า [defector.GetTitledFirstName] สมรู้ร่วมคิดกับ [sponsor.GetName] และอาจถึงขั้นวางแผนที่จะแปรพักตร์!\n\nไม่มีข้อแก้ตัวใดๆ หรือการปรานีใดๆ สำหรับการทรยศอันคดเคี้ยว เช่นนี้ต่อ [ROOT.Char.GetTitleAsNameNoTooltip] ของตน —"
 ep3_emperor_yearly.8060.spouse: "หน้าที่ต่อจักรวรรดิต้องมาก่อนความจงรักภักดีต่อ [defector.Custom2('RelationToMeShort', sponsor)] ของตน!"
 ep3_emperor_yearly.8060.family: "ความภักดีต่อจักรวรรดิต้องมาก่อนหน้าที่ต่อ [defector.Custom2('RelationToMeShort', sponsor)] ของตน!"
 ep3_emperor_yearly.8060.house: "ความเป็นญาติใน [defector.GetDynastyHouseName] ของพวกเขา"
 ep3_emperor_yearly.8060.dynasty: "สายสัมพันธ์ทางครอบครัวเก่าแก่ของ [defector.GetDynastyHouseName] และ [sponsor.GetDynastyHouseName] ช่างหัวมันปะไร"
 ep3_emperor_yearly.8060.faith_and_culture: "ไม่ว่าความแตกต่างทางประเพณีและการสักการะของเราจะเป็น เช่นไร!"
 ep3_emperor_yearly.8060.culture: "จักรวรรดิต้องมาก่อนประเพณีและภาษาท้องถิ่น!"
 ep3_emperor_yearly.8060.faith: "จักรวรรดิต้องมาก่อนศาสนา ไม่ว่าความเชื่อของใครจะหลงผิดเพียงใด!"
 ep3_emperor_yearly.8060.fallback: "จักรวรรดิต้องมาก่อนความสัมพันธ์ส่วนตัวอันหยุมหยิมใดๆ!"
 ep3_emperor_yearly.8060.a: ""จับกุมไอ้เดรัจฉานนั่น ข้าสั่ง!""
 ep3_emperor_yearly.8060.b: "เตือน [defector.GetFirstNameNoTooltip] ถึงคุณธรรมแห่งความภักดี"
 ep3_emperor_yearly.8060.c: "ปล่อยให้ไอ้สุนัขรับใช้นั่นทำตามที่ [defector.GetSheHe] ต้องการ"

 ep3_emperor_yearly.8060.every_title: "ท่านได้รับ [claims|E] เหนือ [titles|E] ทั้งหมดของ [defector.GetTitledFirstNamePossessive]"
 ep3_emperor_yearly.8060.defect: "[defector.GetTitledFirstName] แปรพักตร์"
 ep3_emperor_yearly.8060.no_defect: "[defector.GetTitledFirstName] ยังคงภักดี"
 ep3_emperor_yearly.8060.success: "ท่านลงมือก่อนที่ [defector.GetSheHe] จะทันตั้งตัว"
 ep3_emperor_yearly.8060.failure: "[defector.GetTitledFirstNameNoTooltip] หลบหนีไปได้"
