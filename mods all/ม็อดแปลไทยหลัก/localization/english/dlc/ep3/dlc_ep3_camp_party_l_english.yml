 #Start
 ep3_camp_party.0001.t: "พร้อมแล้ว"
 ep3_camp_party.0001.desc: "ในที่สุดพวกเราทุกคนก็มารวมตัวกัน เสบียงทั้งหมดเตรียมพร้อม กองไฟลุกโชนอย่างร่าเริงท่ามกลางพวกเรา\n\nชีวิตบนท้องถนนอาจเป็นเรื่องยากลำบาก งานเฉลิมฉลองจะเป็นโอกาสให้พวกเราทุกคนได้ผ่อนคลายและละทิ้งความคิดเรื่องการดิ้นรนเพื่อความอยู่รอดอันแสนเหน็ดเหนื่อย\n\nเริ่มงานรื่นเริงได้!"
 ep3_camp_party.0001.a: "ข้ารอไม่ไหวแล้ว!"
 #Conclusion
 ep3_camp_party.0009.t: "เวลาผ่านไปไวเหมือนโกหก"
 ep3_camp_party.0009.desc: "กองไฟเริ่มมอดลง ถ่านไฟคุแดงเพียงริบหรี่ในที่ที่เคยลุกโชน เหล่าผู้ร่วมงานรื่นเริงก็ เช่นกัน เริ่มแยกย้ายไปยังที่นอนของตน\n\nทุกคนต่างมีความสุข แต่ถึงเวลาแล้วที่จะต้องยุติความบันเทิงสำหรับตอนนี้"
 ep3_camp_party.0009.a: "ช่างเป็นงานรื่นเริงที่ยอดเยี่ยมเสียจริง"

 #Events
 ep3_camp_party.1000.t: "เรื่องเล่าขาน"
 ep3_camp_party.1000.desc: ""แล้วจากนั้น! แล้วจากนั้น!" [storyteller.GetFirstName] ออกท่าทางอย่างบ้าคลั่งขณะที่ [storyteller.GetSheHe] ถักทอเรื่องราวที่ดำเนินมานานพอสมควรแล้ว "เขาล้มลงเหมือนกระสอบอิฐ! โดนเข้าที่หัวเต็มๆ เลยทีเดียว"\n\n[storyteller.GetFirstNameNoTooltip] ดื่มด่ำกับเสียงชื่นชมจากผู้คนด้วยรอยยิ้มพึงพอใจ ช่างเป็นเรื่องราวแห่งความกล้าหาญอย่างแท้จริง\n\nผู้คนหลากหลายยังคงดูตื่นเต้น พยายามคะยั้นคะยอให้ [storyteller.GetFirstNamePossessiveNoTooltip] เล่าเรื่องอื่นอีก"
 ep3_camp_party.1000.a: "เจ้าใช้อะไรตีเขาอีกครั้งนะ?"
 ep3_camp_party.1000.a.tt: "บางทีเราอาจสร้างมันขึ้นมาใหม่ได้ ด้วยเศษไม้และโลหะที่เพียงพอ..."
 ep3_camp_party.1000.b: "ข้าก็มีเรื่องเล่าเหมือนกัน!"
 ep3_camp_party.1000.b.success: "เรื่องเล่าของท่านพิสูจน์ว่าดียิ่งกว่า"
 ep3_camp_party.1000.b.failure: "เรื่องเล่าของท่านไม่น่าดึงดูดใจนัก"
 ep3_camp_party.1000.b.tt: "[storyteller.GetFirstNameNoTooltip] ขุ่นเคืองกับการข่มของท่าน"
 ep3_camp_party.1000.c: "ใช่! อีกเรื่อง!"
 ep3_camp_party.1000.c.success: "เรื่องเล่าถัดไปดียิ่งกว่า"
 ep3_camp_party.1000.c.failure: "เรื่องเล่าถัดไปไม่น่าประทับใจเท่า"
 ep3_camp_party.1000.d: "เป็นเรื่องเล่าที่ดี"
 ep3_makeshift_mace: "คทาชั่วคราว"
 ep3_makeshift_mace_description: "คทาหนักที่ทำขึ้นชั่วคราวตามรายละเอียดในเรื่องเล่า ประสิทธิภาพของมันไม่อาจปฏิเสธได้ เช่นเดียวกับความหยาบของมัน และบทเรียนที่ได้จากการสร้างมันจะนำไปสู่การประหยัดที่มากขึ้นในอนาคตอย่างแน่นอน"

 ep3_camp_party.1005.t: "เตร็ดเตร่หายไป"
 ep3_camp_party.1005.desc: ""อา... [ROOT.Char.GetLadyLord]ของข้า?" [attendee.GetFirstName] เข้ามาใกล้ บิดมือของ[attendee.GetHerHis]ด้วยความกังวล "ข้าไม่ทราบว่า [wanderer.GetFirstName] อยู่ที่ใด เป็นเวลาเนิ่นนานพอควรแล้ว..."\n\nมัน #EMP ก็#! เป็นเวลาเนิ่นนานพอควรแล้วตั้งแต่ข้าเห็น [wanderer.GetFirstNameNoTooltip] ครั้งสุดท้าย ขณะเดียวกัน ท้องฟ้าก็มืดครึ้มลงอย่างเป็นลางเมื่อพลบค่ำใกล้เข้ามา\n\n[wanderer.GetSheHe] เถลไถลไปที่ใดกัน?"
 ep3_camp_party.1005.a: "ใส่ฟืนเพิ่มในกองไฟ เพื่อนำทาง [wanderer.GetHerHim] กลับบ้าน"
 ep3_camp_party.1005.a.tt.positive: "#weak เส้นทางควันดึงดูดความสนใจเพิ่มเติม นอกเหนือจาก [wanderer.GetFirstNameNoTooltip] ที่เตร็ดเตร่อยู่...#!"
 ep3_camp_party.1005.b: "คว้าคบเพลิงแล้วเริ่มตามหา อย่าไปไกลเกินไป"
 ep3_camp_party.1005.b.success: "ทักษะการติดตามของท่านพิสูจน์ว่าได้ผลทันที"
 ep3_camp_party.1005.b.neutral: "[wanderer.GetFirstNameNoTooltip] เดินกลับมาพร้อมกับผลเบอร์รี่บางส่วนที่ [wanderer.GetSheHe] พบ"
 ep3_camp_party.1005.b.failure: "ท่านเผชิญหน้ากับสัตว์ป่าขณะที่ท่านพบ [wanderer.GetFirstNameNoTooltip]"
 ep3_camp_party.1005.c: "เราจะนั่งรอ"
 ep3_camp_party.1005.c.success: "[wanderer.GetFirstNameNoTooltip] หาทาง [wanderer.GetHerHis] กลับมาเจอ"
 ep3_camp_party.1005.c.failure: "[wanderer.GetFirstNameNoTooltip] ปรากฏตัวอีกครั้งพร้อมบาดแผล"
 ep3_camp_party.1005.c.critfailure: "[wanderer.GetFirstNameNoTooltip] พิสูจน์ว่าหลงทางจริงๆ"

 ep3_camp_party.1006.t: "แขกที่ไม่คาดคิด"
 ep3_camp_party.1006.desc: "ทันทีที่เราให้ [wanderer.GetFirstName] นั่งลง เสียงกรอบแกรบในพุ่มไม้ก็เผยให้เห็นการปรากฏตัวของอีกคน ข้ากระโดดลุกขึ้นยืน แต่เมื่อแสงส่องชัดไปยังร่างที่มุ่งหน้ามาหาเรา ก็เห็นได้ชัดว่า [newcomer.GetSheHe] ไม่ได้มีเจตนาร้าย\n\n"โปรดเถิด" [newcomer.GetSheHe] เริ่มต้น "ข้าไม่ได้มาที่นี่เพื่อสร้างปัญหา ข้าเป็นเพียงหมอเดินทางที่หาเลี้ยงชีพด้วยการรักษา"\n\n"ข้าเห็นเส้นทางควัน ข้าจะเป็นหนี้บุญคุณหากข้าสามารถอยู่สักพักและเข้าร่วมงานรื่นเริงของท่านได้ นี่ อาหารบางส่วนสำหรับความไม่สะดวก""
 ep3_camp_party.1006.a: ""บางทีเจ้าอาจต้องการอยู่ #EMP ถาวร#!?""
 ep3_camp_party.1006.b: ""มา นั่งลง! สอนวิชาแพทย์ของเจ้าให้ข้า!""

 ep3_camp_party.1010.t: "ทดสอบปัญญาของท่าน"
 ep3_camp_party.1010.desc: "รอยยิ้มเจ้าเล่ห์ของ [riddler.GetFirstNamePossessive] เหนือขอบถ้วย [riddler.GetHerHis] เป็นลางไม่ดี ข้าสงสัย\n\n"มาเถิด [ROOT.Char.GetFirstNameNoTooltip] มาดูกันว่าสมองของท่านยังเฉียบคมอยู่หรือไม่หลังจากเดินทางมาหลายวัน!" [riddler.GetSheHe|U] ชูถ้วยขึ้นอย่างสง่างาม "ปริศนาสักหน่อยไหม?" โดยไม่รอให้ข้ายินยอม [riddler.GetSheHe] ก็เริ่ม"
 ep3_camp_party.1010.desc_riddle_01: "\n\n#EMP "ถูกฉีกจากครรภ์มารดา\nถูกทุบตีและเผาไหม้\nข้ากลายเป็นนักฆ่ากระหายเลือด"
 ep3_camp_party.1010.desc_riddle_02: "\n\n#EMP "บางครั้งข้าเป็นสีเหลือง บางครั้งข้าเป็นสีขาว\nครึ่งหนึ่งของข้ามืด อีกครึ่งหนึ่งสว่าง#!"
 ep3_camp_party.1010.desc_riddle_03: "\n\n#EMP "ข้ามีสี่ขา\nแต่ข้าเดินไม่ได้#!"
 ep3_camp_party.1010.desc_riddle_04: "\n\n#EMP "ข้ามีตาเดียว\nแต่ข้ามองไม่เห็น#!"
 ep3_camp_party.1010.desc_riddle_05: "\n\n#EMP "ข้าคือ 'ห้อง'\nแต่ข้าไม่มีประตูและหน้าต่าง#!"
 ep3_camp_party.1010.desc_riddle_06: "\n\n#EMP "ข้าสามารถถูกจับได้\nแต่ข้าไม่สามารถถูกโยนได้#!"
 ep3_camp_party.1010.desc_riddle_07: "\n\n#EMP "คนจนมีข้า\nคนรวยต้องการข้า\nหากเจ้ากินข้า เจ้าจะพินาศ#!"
 ep3_camp_party.1010.desc_riddle_08: "\n\n#EMP "ข้าเข้าไปง่าย\nแต่ออกมายาก#!"
 ep3_camp_party.1010.desc_outro: "\nข้าคืออะไร?"#!"
 ep3_camp_party.1010.a: ""ง่ายมาก คำตอบคือ '[ROOT.Char.Custom('GetCampPartyRiddleAnswer')]'""
 ep3_camp_party.1010.b: "บางทีคำตอบคือ..."
 ep3_camp_party.1010.b.success: "ท่านเดาถูก"
 ep3_camp_party.1010.b.success.title: "คำตอบที่ถูกต้องคือ '[ROOT.Char.Custom('GetCampPartyRiddleAnswer')]'"
 ep3_camp_party.1010.b.failure: "ท่านเดาผิด"
 ep3_camp_party.1010.c: ""โอ้ [riddler.GetFirstNameNoTooltip] ปริศนาของเจ้าช่างซับซ้อนเกินไปสำหรับข้า!""
 ep3_camp_party.1010.c.tt: "ไม่ว่าความจริงจะเป็น เช่นไร การแสร้งทำว่ามันยากคงจะดีที่สุดเพื่อความปรองดอง..."
 ep3_camp_party.1010.answer_riddle_01: "เหล็ก"
 ep3_camp_party.1010.answer_riddle_02: "ดวงจันทร์"
 ep3_camp_party.1010.answer_riddle_03: "โต๊ะ"
 ep3_camp_party.1010.answer_riddle_04: "เข็ม"
 ep3_camp_party.1010.answer_riddle_05: "เห็ด"
 ep3_camp_party.1010.answer_riddle_06: "โรคภัย"
 ep3_camp_party.1010.answer_riddle_07: "ความว่างเปล่า"
 ep3_camp_party.1010.answer_riddle_08: "ปัญหา"

 ep3_camp_party.1015.t: "เตรียมสายธนูของท่าน"
 ep3_camp_party.1015.desc: "ทันทีที่ข้าลุกขึ้นเพื่อไปหาเครื่องดื่มเพิ่ม [archer.GetFirstName] ก็ลุกขึ้นยืน เช่นกัน\n\n"ข้าคิดว่าพวกเราทุกคนน่าจะมีการแข่งขัน #EMP กระชับมิตร#! สักหน่อย!" [archer.GetSheHe|U] เริ่มต้น ธนูอยู่ในมือ "บางทีอาจเป็นการแข่งขันยิงธนูเล็กๆ? ข้ามีธนูให้ท่านตรงนี้ [ROOT.Char.GetFirstNameNoTooltip]..."\n\nเครื่องดื่มของข้าคงต้องรอไปก่อน"
 ep3_camp_party.1015.a: ""มา ทำให้มันน่าสนใจกันหน่อยไหม? ไปเอาแอปเปิ้ลมาสองผล""
 ep3_camp_party.1015.a.tt: "[apple_holder.GetFirstNameNoTooltip] เหมาะสมอย่างยิ่งที่จะเป็นที่วางให้พวกมัน"
 ep3_camp_party.1015.a.success: "ลูกธนูของท่านโดนแอปเปิ้ล"
 ep3_camp_party.1015.a.failure: "ลูกธนูของท่านพลาดเป้า และ [archer.GetFirstNamePossessiveNoTooltip] ยิงโดน"
 ep3_camp_party.1015.a.critfailure: "[archer.GetFirstNameNoTooltip] ยิงพลาด แต่การพลาดของท่านพิสูจน์ว่าเลวร้ายกว่ามาก..."
 ep3_camp_party.1015.b: ""ทำไมเราไม่ล่ามันล่ะ? ผู้ที่ฆ่าได้ก่อนเป็นผู้ชนะ""
 ep3_camp_party.1015.b.success: "ท่านเป็นผู้ฆ่าได้ก่อน"
 ep3_camp_party.1015.b.failure: "[archer.GetFirstNameNoTooltip] เป็นผู้ฆ่าได้ก่อน"
 ep3_camp_party.1015.b.critfailure: "[archer.GetFirstNameNoTooltip] ยิงพลาดมาโดนท่านด้วยลูกธนูของ[archer.GetHerHis]"
 ep3_camp_party.1015.c: ""มาเถิด เจ้าเลือกเป้าหมายเองเลย!""
 ep3_camp_party.1015.c.success: "ท่านชนะ"
 ep3_camp_party.1015.c.failure: "ท่านแพ้"
 ep3_camp_party.1015.d: ""ข้าไม่เคยคิดอาจหาญที่จะแข่งขันกับผู้มีฝีมือระดับท่าน!""

 ep3_camp_party.1020.t: "ใครน่ะ?"
 ep3_camp_party.1020.opening: "งานรื่นเริงของเราถูกขัดจังหวะอย่างกะทันหัน: ร่างหนึ่งกำลังเดินโซเซมาหาเราจากรอบนอกค่าย เห็นได้ชัดว่าหิวและเหนื่อย [local.GetSheHe] บอกเราว่าชื่อ [local.GetHerHis] คือ [local.GetFirstName]\n\n"
 ep3_camp_party.1020.witch: "[local.GetFirstNameNoTooltip] ตื่นกลัวและอ่อนแอ แต่ยังคงมีความชัดเจนอย่างแข็งกร้าวในดวงตา [local.GetHerHis] เสื้อผ้าเก่าๆ [local.GetHerHis|U] ประดับประดาไปด้วยเครื่องรางและสัญลักษณ์ที่ไม่คุ้นเคย\n\n"
 ep3_camp_party.1020.cannibal: "[local.GetSheHe|U] สวมสร้อยคอกระดูกแปลกๆ เห็นได้ชัดว่า [local.GetSheHe] หิว แต่ดวงตา [local.GetHerHis] เบิกกว้างด้วยความคาดหวังอย่างแท้จริงเมื่อถามถึง... #EMP เนื้อ#! ที่เรามี\n\n"
 ep3_camp_party.1020.mangled: "ดวงวิญญาณผู้น่าสงสารมีร่างกายที่ถูกทำลายจนแทบจำไม่ได้ ขาหายไปข้างหนึ่ง แขนหายไปข้างหนึ่ง และมีรอยแผลเป็นทั่วใบหน้าและร่างกายที่เหลืออยู่ [local.GetHerHis] ข้าเบ้หน้าเมื่อเห็นความเสียหายอันมหาศาล\n\n"
 ep3_camp_party.1020.mystic: "มีปัญญาอันลึกล้ำอยู่ในดวงตาของ [local.GetFirstNamePossessiveNoTooltip] แท่งเครื่องหอมเล็กๆ กระทบกันที่เข็มขัด [local.GetHerHis] ขณะที่ [local.GetSheHe] ประสานมือ [local.GetHerHis] เข้าด้วยกันเพื่อวิงวอน\n\n"
 ep3_camp_party.1020.siblings: "ทันทีที่ข้าอ้าปากตอบ ร่างที่สอง ซึ่งหลังค่อมและเจ็บปวดอย่างเห็นได้ชัดก็เข้ามาร่วมกับเรา [local.GetFirstNameNoTooltip] รีบไปอยู่ข้าง [local_sibling.GetHerHis] ทันทีและดึง [local_sibling.GetHerHim] เข้ามาใกล้อย่างอ่อนโยนและหวงแหน\n\nโปรดเถิด" [local.GetFirstNameNoTooltip] มองข้าอย่างวิงวอน "[local_sibling.GetFirstName|U] คือ [local_sibling.Custom('SisterBrother')] ของข้า [local_sibling.GetSheHe|U] ต้องการพักผ่อนและน้ำ"\n\nความผูกพันของพวกเขานั้นใกล้ชิดอย่างเห็นได้ชัด #EMP ใกล้ชิดมาก#! แต่คราบสีทับทิมเข้มบนเสื้อผ้าของพวกเขาคืออะไรกันแน่...?"
 ep3_camp_party.1020.ending: ""ข้าเพียงแค่ขอที่พักอันปลอดภัยสักคืนและอาหารบ้าง [ROOT.Char.Custom('FormOfAddressForLiege')]" [local.GetSheHe|U] กล่าว "และข้าจะเป็นหนี้บุญคุณท่านอย่างมากสำหรับสิ่งนี้""
 ep3_camp_party.1020.a: ""ทำไมไม่พักอยู่ที่นี่ล่ะ?""
 ep3_camp_party.1020.b: "เราพอจะแบ่งอาหารให้ได้เล็กน้อย"
 ep3_camp_party.1020.c: "เสบียงอันน้อยนิดที่เรามีต้องคงอยู่เป็นของเรา"

 ep3_camp_party.1021.t: "ถูกปฏิเสธ"
 ep3_camp_party.1021.witch: "ดวงตาที่ชัดเจนของ [local.GetFirstNamePossessiveNoTooltip] แข็งกร้าวอย่างโหดเหี้ยม ด้วยความโกรธและความอับอาย\n\n"เจ้าจะต้องเสียใจกับการกระทำนี้" [local.GetSheHe|U] มองไปรอบๆ พวกเราทุกคน ริมฝีปาก [local.GetHerHis] บิดเบี้ยวอย่างดูถูก "มีพวกเราคนหนึ่งอยู่ในหมู่พวกเจ้าแล้ว พวกเขาจะ ทำให้แน่ใจว่าเจ้าต้องทนทุกข์ทรมาน"\n\nด้วยคำพูดสุดท้ายเหล่านั้น [local.GetSheHe] ก็หายไป หายลับไปในความมืดที่คืบคลานเข้ามา"
 ep3_camp_party.1021.cannibal: "[local.GetFirstNameNoTooltip|U] เยาะเย้ยเล็กน้อยต่อคำตอบของข้า\n\n"แม้ แต่ [local.GetWomanMan] ที่ต้องการความช่วยเหลือก็ไม่ช่วย ใช่ไหม? คิดดูสิ มีคนอย่างข้าอยู่ในหมู่พวกเจ้าแล้ว ใช่ ข้ามองเห็น ข้ามองเห็นว่าเจ้ารู้ว่ากระดูกเหล่านี้หมายถึงอะไร"\n\nด้วยการส่ายหัวอย่างดูถูกเป็นครั้งสุดท้าย [local.GetSheHe] ก็เดินกะโผลกกะเผลกเข้าไปในความมืด โดยไม่เสนอคำอธิบายเพิ่มเติม"
 ep3_camp_party.1021.mangled: "[local.GetFirstNameNoTooltip] ดูไม่โกรธ แต่ดูเศร้าสร้อย\n\n"อีกหนึ่งรอยบากในบัญชีชีวิต ในการต่อสู้อันยาวนานกับการดำรงอยู่ของข้า" [local.GetSheHe|U] ยิ้มอย่างโหยหาและจากไปโดยไม่มีคำพูดใดๆ อีก\n\nข้ารู้สึกได้ถึงสายตาของสหายที่จ้องมองมาที่หลังศีรษะของข้าขณะที่ข้ามอง [local.GetHerHim] เดินกะเผลกจากไปอย่างช้าๆ นี่ไม่ใช่การตัดสินใจที่เป็นที่นิยม"
 ep3_camp_party.1021.mystic: "การแก้แค้นของ [local.GetFirstNamePossessiveNoTooltip] นั้นรวดเร็วและไม่มีสัญญาณเตือนล่วงหน้า ริมฝีปากบิดเบี้ยว คำสบประมาทที่พ่นออกมา แล้วทันใดนั้นการมองเห็นของข้าก็พร่ามัว [local.GetFirstName] ถอยกลับไปอย่างรวดเร็วขณะที่ [local.GetSheHe] โยนส่วนผสมหยาบๆ ใส่หน้าข้า หนีออกจากค่ายไปขณะที่ผู้ติดตามของข้ารีบเข้ามาหาข้า\n\nดูเหมือนจะไม่มีผลกระทบที่ไม่ดีในทันที แต่... ท้องของข้ารู้สึกปั่นป่วนเล็กน้อย..."
 ep3_camp_party.1021.siblings: "ใบหน้าของ [local.GetFirstNamePossessive] บิดเบี้ยว กลายเป็นหน้ากากแห่งความเกลียดชังที่สลักไว้อย่างกะทันหัน มันเป็นสิ่งสุดท้ายที่ข้าเห็นก่อนที่ก้อนหินที่ซ่อนอยู่ในมือ [local.GetHerHis] จะทุบเข้าที่เบ้าตาของข้า\n\nข้าทรุดลงกับพื้นกุมใบหน้า รับรู้อย่างเลือนรางถึงการหลบหนีอย่างเร่งรีบของพี่น้องทั้งสองขณะที่ผู้ติดตามของข้ารวมตัวกันเข้ามาช่วย"
 ep3_camp_party.1021.callous: "ขณะที่ข้าพูดจบ ใบหน้าของ [local.GetFirstNamePossessive] ก็มืดลง แต่ข้าหันหลังกลับไปแล้ว ในการทำ เช่นนั้น ข้าส่งสัญญาณให้คนอื่นๆ นำผู้บุกรุกออกจากค่าย\n\nขณะที่พวกเขาถูกลากออกไป อารมณ์ของข้าก็สดใสขึ้น"
 ep3_camp_party.1021.normal: "ความเศร้า ความโกรธ และความสิ้นหวังผสมปนเปกันปรากฏบนใบหน้าของ [local.GetFirstNamePossessive] [local.GetSheHe|U] ไม่แสดงความเป็นศัตรูขณะที่ [local.GetSheHe] จากไป\n\nข้ากดความรู้สึกผิดที่เพิ่มขึ้นขณะที่เรากลับไปสู่งานรื่นเริงของเรา"
 ep3_camp_party.1021.a.face: "#EMP อ๊ากกกก!#!"
 ep3_camp_party.1021.a.ill: "ข้ารู้สึก #DIE1 ไม่ค่อยดีเลยจริงๆ...#!"
 ep3_camp_party.1021.a.sad: "เอาเถอะ มันจำเป็นต้องทำ"
 ep3_camp_party.1021.b: "ยอดเยี่ยม กลับไปสนุกกันต่อ!"

 ep3_camp_party.1025.t: "แลกเปลี่ยนเรื่องราว"
 ep3_camp_party.1025.desc: "งานรื่นเริงดำเนินต่อไป แต่ [friend.GetFirstName] กำลังรู้สึกครุ่นคิดอยู่บ้างอย่างเห็นได้ชัด\n\n"สิ่งนี้ ทำให้ข้านึกถึงวัยเด็กของข้าจริงๆ" [friend.GetSheHe|U] มองไปรอบๆ อย่างโหยหา "ความซุกซนและงานรื่นเริงมากมาย ข้าระลึกถึงค่ำคืนแห่งความเกเร เช่นนั้นได้เป็นร้อยคืนในตอนนี้!" [friend.GetSheHe|U] มองมาที่ข้า\n\n"แล้วท่านล่ะ? ท่านมีเรื่องเล่าใดๆ ตอนที่ท่านยังเป็น [ROOT.Char.Custom('GetLassLad')] หนุ่มสาวหรือไม่?""
 ep3_camp_party.1025.a: "ข้าอยากฟังเรื่องของเจ้ามากกว่า!"
 ep3_camp_party.1025.b: "แน่นอน!"
 ep3_camp_party.1025.b.success: "เรื่องเล่าของท่านเป็นที่ชื่นชอบ"
 ep3_camp_party.1025.b.failure: "ท่านไม่สามารถเลือกเรื่องราวที่ดีได้"
 ep3_camp_party.1025.c: "โอ้ ใช่สิ ว่า แต่ เจ้าได้ยินเรื่องนั้นไหม..."
 ep3_camp_party.1025.c.tt: "บางทีถ้าข้าทำอย่างแนบเนียน [friend.GetSheHe] อาจไม่สังเกตเห็นการเปลี่ยนหัวข้อ..."

 ep3_camp_party.1030.t: "เปิดถังใหม่"
 ep3_camp_party.1030.desc: "เครื่องดื่มในถ้วยของข้าหยดลงจนหมด เหลือเพียงกากสุดท้าย ข้าหันไปมองหาอีก แต่พบเพียงกลุ่มคนเล็กๆ ที่อยู่ในสถานการณ์เดียวกับข้า\n\n"เราหมดแล้ว" [reveler.GetFirstName] ค้นหาในเสบียงต่างๆ ถือโคมไฟส่อง "เรา #EMP สามารถ#! เปิดถังอีกใบได้ แต่ถ้าเราดื่มไม่หมด มันอาจจะเสียรสชาติ...""
 ep3_camp_party.1030.a: "ใบเดียวรึ? เปิด #EMP สองใบเลย!#!"
 ep3_camp_party.1030.b: "มาสนุกกันหน่อยเถอะ ใช่ไหม?"
 ep3_camp_party.1030.b.success: "งานรื่นเริงของท่านเป็นที่ยอมรับ"
 ep3_camp_party.1030.c: "เราไม่สามารถสูญเสียการควบคุมเพียงเพื่อความสนุกสนานคืนเดียวได้"

 ep3_camp_party.1035.t: "ท่อนไม้ขาดแคลน"
 ep3_camp_party.1035.desc: "ข้ากำลังสนทนาอย่างลึกซึ้งจนแทบไม่สังเกตเห็นแสงที่น้อยลง ข้าเหลือบมองกองไฟก็ต่อเมื่อข้ามีปัญหาในการระบุผู้มาใหม่ในการสนทนา\n\nถ่านไฟคุแดงอย่างมัวๆ เกือบจะมอดแล้ว [treefeller.GetFirstName] ส่ายหน้า [treefeller.GetHerHis] เมื่อข้ากวาดตามองไปรอบๆ ค่ายอย่างรวดเร็ว\n\n"เราใช้ฟืนท่อนสุดท้ายไปแล้ว ต้องไปหามาเพิ่ม" [treefeller.GetSheHe|U] กระโดดลุกขึ้นยืน คว้าขวานจากบริเวณใกล้เคียงและเลิกคิ้วมองข้า"
 ep3_camp_party.1035.a: ""เดี๋ยวก่อน เรามีถังและลังเก่าๆ พวกนั้น...""
 ep3_camp_party.1035.a.success: "ความคิดของท่านพิสูจน์ว่าใช้ได้"
 ep3_camp_party.1035.b: ""เอาล่ะ ส่งมานี่""
 ep3_camp_party.1035.b.success: "การโค่นต้นไม้เป็นไปตามแผน"
 ep3_camp_party.1035.b.failure: "ท่านไม่สามารถหาต้นไม้ที่เหมาะสมที่จะโค่นได้"
 ep3_camp_party.1035.b.critfailure: "ต้นไม้ล้มลงในมุมที่น่าอึดอัด..."
 ep3_camp_party.1035.c: ""ไม่มีเวลาโค่นต้นไม้แล้ว ไปหากิ่งไม้จากพุ่มไม้พวกนั้นกันเถอะ""

 ep3_camp_party.1040.t: "พ่อค้าเร่"
 ep3_camp_party.1040.desc: "ความโกลาหล! หูข้าผึ่งขึ้น และข้าหันไปเห็นผู้ติดตามสองสามคนของข้ากำลังสนทนากับ [merchant.GetWomanMan] ที่ยืนอยู่ข้างเกวียนเทียมม้า\n\n"มี แต่สินค้าชั้นเลิศเท่านั้น!" [merchant.GetSheHe|U] กำลังประกาศด้วยรอยยิ้มเจ้าเล่ห์ "ข้าเห็นและได้ยินงานรื่นเริงของท่าน แต่ไกล และ #EMP แน่นอน#! ต้องแวะมาเพื่อเสนอโอกาสให้ท่านผู้ดีทั้งหลายได้จัดหามันไป!"\n\nข้าเข้าไปใกล้ขึ้น พยายามตั้งสติผ่านอาการมึนเมาเล็กน้อย พวกมันช่างแวววาวจริงๆ..."
 ep3_camp_party.1040.a: "ข้าต้องการชิ้นใหญ่!"
 ep3_camp_party.1040.b: "เครื่องประดับเล็กๆ น้อยๆ เหล่านั้นสักชิ้นก็คงจะดี"
 ep3_camp_party.1040.c: "ไปให้พ้น เจ้าคนฉวยโอกาส!"
 resplendent_armour_name: "เกราะอันงดงาม"
 resplendent_armour_desc: "ชุดเกราะอันน่าประทับใจนี้ส่องประกายเมื่อแสงตกกระทบ สะท้อนจากลวดลายฉลุอันละเอียดอ่อนที่ฝังอยู่ในลวดลายอันซับซ้อนทั่วทั้งชุด วัสดุที่แข็งแกร่งให้ความต้านทานที่ยอดเยี่ยมต่อผู้ที่อาจเข้ามาทำร้าย"

 ep3_camp_party.2000.t: "บทสนทนาในมือ..."
 ep3_camp_party.2000.desc: ""... และ #EMP นั่น#! คือเหตุผลว่าทำไม [ROOT.Char.Custom('GetFirstFollowerTraitMonologue')]" [ROOT.Char.Custom2('RelationToMe', first_follower )] ของข้า [first_follower.GetFirstName] กล่าวจบ ขณะที่ [first_follower.GetSheHe] จิบ [ROOT.Char.Custom('RegionalDrink')] จากแก้ว [first_follower.GetHerHis] อีกครั้ง\n\nข้า #EMP สนใจ#! ในหัวข้อของ [first_follower.GetFirstNamePossessiveNoTooltip] แต่ข้าลังเลเมื่อได้ยินบทพูดคนเดียวของ [second_follower.GetFirstNamePossessive] เกี่ยวกับ "... ว่า [ROOT.Char.Custom('GetSecondFollowerTraitMonologue')] อย่างไร"\n\nด้วยความเครียดเล็กน้อย ข้าพยายามตัดสินใจว่าจะเข้าร่วมบทสนทนาใด:"
 ep3_camp_party.2000.a: ""[first_follower.GetFirstNameNoTooltip] เจ้าคิดอย่างไรเกี่ยวกับ...""
 ep3_camp_party.2000.b: ""ช่างเป็นมุมมองที่น่าสนใจ [second_follower.GetFirstNameNoTooltip]!""
 ep3_camp_party.2000.c: ""ค่ำคืนยังอีกยาวไกล! เราจะถกเถียงกัน #EMP ทั้งสอง#! หัวข้อต่อไป!""
 ep3_camp_party.2000.d: ""มา! ให้เรามาทานอาหารร่วมกันแทนเถอะ!""
 ep3_camp_party.2000.d.tt: "[THIS.Char.GetDomicile.GetName] #bold ไม่มี#! อาคาร [GetDomicileBuilding('mess_tent_03').GetName] ระดับ #V 3#! หรือสูงกว่า"

 ep3_camp_party.2000.callous: "ผู้คนช่าง #EMP อ่อนไหว#! เสียจริงในทุกวันนี้"
 ep3_camp_party.2000.sadistic: "ความเจ็บปวดทางกาย #EMP สามารถ#! หล่อหลอมบุคคลให้มีประโยชน์มากขึ้นได้"
 ep3_camp_party.2000.zealous: "แผนการอันศักดิ์สิทธิ์ #EMP จะ#! นำทางเรา หากเราเพียงยอมจำนน"
 ep3_camp_party.2000.craven: "โลกนี้ช่าง #EMP อันตราย#! เหลือเกินในช่วงหลังมานี้"
 ep3_camp_party.2000.forgiving: "แนวคิดเรื่องการหันแก้มอีกข้างให้มีอยู่ในศาสนา #EMP มากกว่า#! หนึ่งศาสนา"
 ep3_camp_party.2000.compassionate: "การช่วยเหลือผู้ที่ต้องการความช่วยเหลือ #EMP คือ#! รางวัลในตัวของมันเอง"
 ep3_camp_party.2000.gregarious: "งานรื่นเริงช่าง #EMP ผ่อนคลาย#! เหลือเกิน และมัน #EMP เป็นประโยชน์#! ที่จะเพลิดเพลินไปกับการอยู่ร่วมกับผู้อื่น"
 ep3_camp_party.2000.paranoid: "มัน #EMP เชื่อมโยงกันหมด#! เหมือนภัยแล้งปีที่แล้วที่สัมพันธ์กับความที่ไก่แทบจะไม่ให้ไข่ทุกวันเลย!"
 ep3_camp_party.2000.eccentric: "ดวงจันทร์มีขี้มูกอยู่ในจมูก [dummy_gender.GetHerHis] เย็นนี้"
 ep3_camp_party.2000.brave: "การเอาชนะความกลัวคือสิ่งที่ #EMP สำคัญที่สุด#! ในชีวิต"
 ep3_camp_party.2000.just: "เรา #EMP จำเป็นต้อง#! ปฏิบัติตามกฎหมายและกฎเกณฑ์ท้องถิ่น ไม่เหมือน #EMP พวกป่าเถื่อน#!"
 ep3_camp_party.2000.lazy: "คนเราจะ #EMP เตรียมพร้อม#! สำหรับความยากลำบากได้ดีขึ้นมากหากได้พักผ่อนอย่างเต็มที่"
 ep3_camp_party.2000.arrogant: "ผู้คนช่าง #EMP ทื่อมะลื่อ#! เสียจริงในทุกวันนี้"
 ep3_camp_party.2000.fickle: "มันยากเหลือเกินที่จะ #EMP บางที อาจจะ เป็นไปได้#! ตัดสินใจ"
 ep3_camp_party.2000.diligent: "มัน #EMP น่าพอใจ#! ที่ได้ทำงานทั้งหมดเสร็จและส่งมอบ"
 ep3_camp_party.2000.lustful: "มันเป็นเรื่องดีต่อสุขภาพที่จะปล่อยตัวตาม #EMP สิ่งยั่วยวน#! เป็นครั้งคราว"
 ep3_camp_party.2000.chaste: "เรา #EMP ดีกว่า#! สัตว์เดรัจฉานสกปรก สามารถควบคุมความใคร่ของเราได้ตามต้องการ"
 ep3_camp_party.2000.greedy: "ราคาของ [ROOT.Char.Custom('RegionalRootVegetablePlural')] ช่าง #EMP แพง#! เหลือเกินเมื่อเร็วๆ นี้"
 ep3_camp_party.2000.generous: "มันรู้สึกดีที่ได้ #EMP แบ่งปัน#! ทรัพย์สินเล็กน้อยที่อาจมีกับผู้อื่น"
 ep3_camp_party.2000.humble: "คนเรา #EMP ไม่ควร#! ทำให้ตัวเองดูเป็นในสิ่งที่ตนไม่ได้เป็น"
 ep3_camp_party.2000.temperate: "มันเป็นผลดีที่จะ #EMP ไม่#! นอนหลับทั้งที่ท้องอิ่ม"
 ep3_camp_party.2000.gluttonous: "เราควร #EMP เพลิดเพลิน#! กับอาหารอร่อยๆ เมื่อใดก็ตามที่เรามีโอกาส"
 ep3_camp_party.2000.wrathful: "คนที่ #EMP ไม่ยอมรับฟังเหตุผล#! เป็นเพียง #EMP คนโง่#!"
 ep3_camp_party.2000.patient: "มันดีที่ได้ #EMP นั่ง#! สักครู่ ครุ่นคิดถึงสิ่งรอบตัว"
 ep3_camp_party.2000.impatient: "มัน #EMP ใช้เวลานานชิบหาย#! กว่าจะได้เครื่องดื่มแถวนี้"
 ep3_camp_party.2000.calm: "ปัญหา #EMP แก้ไขได้ง่ายกว่า#! ภายใต้ท่าทีที่เยือกเย็น"
 ep3_camp_party.2000.deceitful: "#EMP บาง#! คนคิดว่า [other_follower.GetFirstName] ค่อนข้าง [other_follower.Custom('quirk_neg_adjective')] แต่ #EMP ข้า#! คิดเสมอว่า [other_follower.GetHerHim] เป็นเพียง [other_follower.Custom('quirk_pos_adjective')]"
 ep3_camp_party.2000.honest: "ความ #EMP พยายาม#! ที่ใส่ลงไปในจานแรกนั้นน่าชื่นชม แต่มันก็ไม่ได้ #EMP ดีเป็นพิเศษ#! "
 ep3_camp_party.2000.shy: "ความขี้อายเป็นเพียงสัญญาณของ #EMP ความฉลาด#! #EMP ไม่ใช่#! ความด้อยกว่า"
 ep3_camp_party.2000.ambitious: "มีเพียงการทำงานหนักเท่านั้นที่จะพาเจ้าไป #EMP สู่ที่ใดก็ได้#! ในชีวิต"
 ep3_camp_party.2000.content: "งานรื่นเริงเป็นไปด้วยดี จนถึงตอนนี้ ไม่มีอะไรให้บ่นจริงๆ"
 ep3_camp_party.2000.arbitrary: "#EMP ความเป็นธรรมชาติและลางสังหรณ์#! คือเคล็ดลับสู่ชีวิตที่สงบสุข"
 ep3_camp_party.2000.trusting: "เราต้องมีความเชื่อมั่นในผู้อื่นที่จะ #EMP ดูแล#! เพื่อนมนุษย์ด้วยกัน"
 ep3_camp_party.2000.stubborn: "เจ้า #EMP จำเป็นต้อง#! ไล่ตามสิ่งที่ควรค่าแก่การมีอย่างดุเดือด"
 ep3_camp_party.2000.vengeful: "#EMP การแก้แค้น#! คืออาหารที่เสิร์ฟเย็นดีที่สุด"

