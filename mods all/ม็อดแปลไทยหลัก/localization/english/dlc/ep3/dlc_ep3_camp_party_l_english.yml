 activity_camp_party_special_type_bar_segment_tt_0: "#t มีชีวิตชีวา#!\n#ts คะแนน: [ActivityWindow.GetSpecialProgressValue|0V]/#V 25#!#!\n$EFFECT_LIST_BULLET$ผู้เข้าร่วมทั้งหมดลด [stress|E]\n$EFFECT_LIST_BULLET$ลดค่าใช้จ่าย [provisions|E] [provisions_i] จาก [GetDecisionWithKey('visit_local_settlement_decision').GetName] เป็นเวลา #value 1#! ปี"
 activity_camp_party_special_type_bar_segment_tt_1: "#t ร่าเริง#!\n#ts คะแนน: [ActivityWindow.GetSpecialProgressValue|0V]/#V 50#!#!\n$EFFECT_LIST_BULLET$ผู้เข้าร่วมทั้งหมดลด [stress|E]\n$EFFECT_LIST_BULLET$ท่านได้รับ [provisions|E] [provisions_i] จำนวน #positive_value เล็กน้อย#!\n$EFFECT_LIST_BULLET$ได้รับทหารเกณฑ์ที่ดีขึ้นจาก [GetDecisionWithKey('visit_local_settlement_decision').GetName] เป็นเวลา #value 1 #! ปี\n$EFFECT_LIST_BULLET$ท่านได้รับ [lifestyle_experience|E]"
 activity_camp_party_special_type_bar_segment_tt_2: "#t ปีติยินดี#!\n#ts คะแนน: [ActivityWindow.GetSpecialProgressValue|0V]/#V 75#!#!\n$EFFECT_LIST_BULLET$ผู้เข้าร่วมทั้งหมดลด [stress|E]\n$EFFECT_LIST_BULLET$ท่านได้รับ [provisions|E] [provisions_i] จำนวน #positive_value ปานกลาง#!\n$EFFECT_LIST_BULLET$ได้รับทหารเกณฑ์ที่ดีขึ้นจาก [GetDecisionWithKey('visit_local_settlement_decision').GetName] เป็นเวลา #value 1 #! ปี\n$EFFECT_LIST_BULLET$ท่านได้รับ [lifestyle_experience|E]\n$EFFECT_LIST_BULLET$ท่านได้รับ [task_contract|E] ใหม่"
 activity_camp_party_special_type_bar_segment_tt_3: "#t เบิกบานใจ#!\n#ts คะแนน: [ActivityWindow.GetSpecialProgressValue|0V]/#V 100#!#!\n$EFFECT_LIST_BULLET$ผู้เข้าร่วมทั้งหมดลด [stress|E]\n$EFFECT_LIST_BULLET$ท่านได้รับ [provisions|E] [provisions_i] จำนวน #positive_value มาก#!\n$EFFECT_LIST_BULLET$ได้รับทหารเกณฑ์ที่ดีขึ้นจาก [GetDecisionWithKey('visit_local_settlement_decision').GetName] เป็นเวลา #value 1 #! ปี\n$EFFECT_LIST_BULLET$ท่านได้รับ [lifestyle_experience|E]\n$EFFECT_LIST_BULLET$ท่านได้รับ [task_contracts|E] ใหม่จำนวน #value 2#! สัญญา\n$EFFECT_LIST_BULLET$$activity_camp_party_reward_upgrade_building$"
 activity_camp_party_reward_upgrade_building: "อาจอัปเกรด @landless_rulers_icon![camp|E] [building|E] แบบสุ่มได้ฟรี"

 camp_party_tt_positive_massive: "ระดับการสังสรรค์ [GetActivityType('activity_camp_party').GetName] ของท่าน #P เพิ่มขึ้นอย่างมหาศาล #!"
