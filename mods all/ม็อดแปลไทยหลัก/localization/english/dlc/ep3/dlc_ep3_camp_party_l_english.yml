 # Maintenance etc
 activity_camp_party: "งานรื่นเริงในค่าย"
 activity_camp_party_desc: "จัดงานเฉลิมฉลองเล็กๆ ที่ค่ายของท่าน โดยใช้ทุนจาก[gold_i][gold|E] แต่ปรับเปลี่ยนตามคลัง[provisions_i][provisions|E]ของท่าน ผู้ได้รับเชิญจะ รวมถึงทุกคนจากค่าย บวกกับผู้ปกครองท้องถิ่นที่เป็นทางเลือก\n\nงานเลี้ยงในค่ายเป็นโอกาสในการผูกมิตรกับผู้ติดตามของท่าน ได้รับ[task_contracts|E]พิเศษ และจัดการ[stress|E]"
 activity_camp_party_province_desc: "เลือกบารอนี"
