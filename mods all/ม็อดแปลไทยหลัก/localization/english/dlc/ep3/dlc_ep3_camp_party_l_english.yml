 ep3_fireside_chat_martial: "สนทนารอบกองไฟ: การทหาร"
 ep3_fireside_chat_martial_desc: "ตัวละครนี้ได้เรียนรู้มากมายเกี่ยวกับการบุกของทหารม้า กลยุทธ์การรบ และการส่งกำลังบำรุงในการทัพ จากการสนทนาอันเข้มข้นรอบกองไฟที่ลุกโชน"
 ep3_fireside_chat_diplomacy: "สนทนารอบกองไฟ: การทูต"
 ep3_fireside_chat_diplomacy_desc: "ตัวละครนี้ได้เรียนรู้วลีที่ไพเราะหลายอย่าง รวมถึงวิธีการหมอบกราบต่อหน้าเชื้อพระวงศ์ จากการสนทนาที่มีเสน่ห์รอบกองไฟที่ลุกโชน"
 ep3_fireside_chat_intrigue: "สนทนารอบกองไฟ: เล่ห์กล"
 ep3_fireside_chat_intrigue_desc: "ตัวละครนี้ได้เรียนรู้กลอุบายหลายอย่างเกี่ยวกับการพรากเหรียญและชีวิตของผู้อื่น จากการสาธิตอันน่าสยดสยอง แต่น่าหลงใหลรอบกองไฟที่ลุกโชน"
 ep3_fireside_chat_learning: "สนทนารอบกองไฟ: การเรียนรู้"
 ep3_fireside_chat_learning_desc: "ตัวละครนี้ได้เรียนรู้มากมายเกี่ยวกับความลึกลับของสวรรค์และโลก จากการสนทนาที่น่าสนใจรอบกองไฟที่ลุกโชน"
 ep3_camp_party_sad_lonesome: "งานรื่นเริงในค่ายอันเปล่าเปลี่ยว"
