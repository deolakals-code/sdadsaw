l_english: 
 governor_tax_scheme: "เก็บภาษี"
 governor_tax_scheme_desc_general: "ใน[scheme|E]เก็บภาษี ท่านพยายามรวบรวมข่าวกรองเกี่ยวกับภาษีที่ขาดหายไป และ ทำให้หมู่บ้านที่ต้องสงสัยจ่ายภาษี"
 governor_tax_scheme_desc: "ภาษีถูกจัดเก็บและบันทึกอย่างรอบคอบสำหรับทุกเขตและหมู่บ้าน ทำให้สามารถตรวจสอบได้ว่ามีการชำระภาษีตามกำหนดจริงหรือไม่ และที่สำคัญกว่านั้นคือเมื่อการชำระเงิน #EMP ขาดหายไป#!."
 governor_tax_scheme_action: "เก็บภาษีใน"
 governor_tax_scheme_invalidated_title: "แผนการ $governor_tax_scheme$ ถูกยกเลิก"
 msg_governance_contract_appear.t: "ประเด็นการปกครองใหม่"
 msg_governance_contract_appear.desc: "[governance_issue|E] ประเภท [new_governance_issue.GetType.GetName|V] ได้ปรากฏขึ้นใน [target_province.GetName] ภายใน [target_province.GetCounty.GetTitle.GetName]"
 task_contract_governance_desc_title: "จำเป็นต้องใช้วิจารณญาณของข้าในฐานะ[GetPlayer.Custom('GetGovernorConceptNoTooltip')]!"
 
 overdue_taxes_contract: "ภาษีค้างชำระ"
 overdue_taxes_desc: "ไม่ว่าจะด้วยการสมรู้ร่วมคิด การขัดสน หรือความประมาทเลินเล่ออย่างแท้จริง หมู่บ้านแห่งหนึ่งในภูมิภาคนี้ล้มเหลวในการส่งส่วนแบ่งผลผลิตที่ต้องชำระเป็นภาษี"
 overdue_taxes_desc_title: "$task_contract_governance_desc_title$"
 hoarding_mayor_contract: "นายกเทศมนตรีกักตุน"
 hoarding_mayor_desc: "นายกเทศมนตรีของบารอนีนี้กำลังรวบรวมและกักตุนทองคำมากกว่าที่คาดไว้มาก นายกเทศมนตรีอาจไม่ได้ส่งภาษีขึ้นไปเพียงพอ หรืออาจไม่ได้ลงทุนในเมืองมากพอ"
 hoarding_mayor_desc_title: "$task_contract_governance_desc_title$"
 bountiful_harvest_contract: "เก็บเกี่ยวอุดมสมบูรณ์"
 bountiful_harvest_desc: "รายงานความอุดมสมบูรณ์อันน่าอัศจรรย์ ของพืชผลสูงตระหง่านและทุ่งนาเขียวขจี มาจากทั่วทั้ง[GetPlayer.Custom('GetProvinceConceptNoTooltip')] พรที่สำคัญ เช่นนี้ควรนำไปใช้ให้เกิดประโยชน์ อย่าปล่อยให้พืชผลเน่าเสีย!"
 bountiful_harvest_desc_title: "$task_contract_governance_desc_title$"
 rampant_bandits_contract: "โจรชุกชุม"
 rampant_bandits_desc: "คนนอกกฎหมายและชนเผ่าเร่ร่อนเกเรคุกคามภูมิภาคนี้ของ[GetPlayer.Custom('GetProvinceConceptNoTooltip')]ของท่าน เพื่อให้คนท้องถิ่นปลอดภัย เพื่อให้พ่อค้าสัญจรได้อย่างอิสระ: จำเป็นต้องจัดการกับพวกเขา"
 rampant_bandits_desc_title: "$task_contract_governance_desc_title$"
 
 governor_contract_event.1000.t: "ภาษีค้างชำระ"
 governor_contract_event.1000.desc: "เสมียนของข้ายืนกรานว่าหมู่บ้านใน [tax_destination.GetName] ค้างชำระภาษีอย่างมาก\n\nคงเป็นการละเลยหน้าที่อย่างร้ายแรงหากข้าเพิกเฉยต่อเรื่องนี้ บัญชีแยกประเภทระบุชัดเจน: ภาษี #EMP ขาดหายไป#! ไม่มีการส่งสินค้า\n\nในขณะนี้ ยังไม่ทราบสาเหตุของการละเว้นเหล่านี้ เรื่องนี้อาจเป็นเรื่องของเจ้าหน้าที่... หรือเรื่องของทหาร"
 governor_contract_event.1000.a: "เริ่มการสืบสวนกันเถิด!"
 governor_contract_event.1001.desc: "ขบวนผู้ติดตามของข้าดั้นด้นไปตามเส้นทางชนบทที่ขาดการบำรุงรักษา ท่ามกลาง[ROOT.Char.GetCurrentLocation.Custom('get_region_flower_type_plural')]ที่กระจัดกระจายและ[ROOT.Char.Custom('RegionalFarmAnimal')]เป็นครั้งคราว... จุดหมายปลายทางของข้า หมู่บ้านที่ค้างภาษี ช่างดูเรียบง่ายและ #EMP ช่าง#! ไม่น่าจดจำเอาเสียเลย — ทั้งที่อยู่ห่างจากตัวเมือง [tax_destination.GetName] เพียงไม่ถึงวันเดินทาง\n\nชาวบ้านสองสามคน แต่งกายด้วยชุดพื้นเมืองอันเป็นเอกลักษณ์ มารวมตัวกันที่ใจกลางหมู่บ้าน ข้าได้รับการต้อนรับอย่างสันติ แม้จะไร้ ซึ่งความอบอุ่น\n\nข้าต้องพิจารณาว่าจะดำเนินการสืบสวนอย่างไร"
 governor_contract_event.1001.a: "วิธีการสอบถามจะดีที่สุดสำหรับข้า"
 governor_contract_event.1001.b: "ลองมองไปรอบๆ ดูว่ามีอะไรปรากฏขึ้นบ้าง"
 governor_contract_event.1001.a_tt: "เดินทางไปยัง [tax_destination.GetName] และสืบสวนประเด็นดังกล่าว"
 governor_contract_event.1001.success: "การสืบสวนของท่านสำเร็จ"
 governor_contract_event.1001.failure: "การสืบสวนของท่านล้มเหลว"
 governor_contract_event.1001.a.success: "ข้าโน้มน้าวให้ชาวบ้านพูด"
 governor_contract_event.1001.a.failure: "ข้าไม่สามารถเรียนรู้อะไรจากชาวบ้านได้"
 governor_contract_event.1001.b.success: "ข้าตรวจสอบหมู่บ้านและเรียนรู้สิ่งที่ข้าต้องการ"
 governor_contract_event.1001.b.failure: "ข้าไม่สามารถเรียนรู้สิ่งที่ข้าต้องการจากหมู่บ้านได้"
 governor_contract_event.1003.t: "ภาษีค้างชำระ: สำเร็จ"
 governor_contract_event.1003.desc_diplomacy: "การพูดคุยกับชาวบ้านได้ผลเกินคาด!\n\nหัวหน้าครอบครัวต่างกระตือรือร้นที่จะแจกแจงรายชื่อสมาชิกในครอบครัว และยินดีปรีดาพรรณนาถึงผลผลิตจากที่ดินของตน บางคนถึงกับ #EMP โอ้อวด#! ถึงปศุสัตว์ของตน! ชาวนาพาข้าเดินชมทุ่งนา อธิบายว่าพวกเขาคาดว่าจะได้ผลผลิตเท่าใดจากการเก็บเกี่ยว"
 governor_contract_event.1003.desc_stewardship: "การตรวจสอบอย่างละเอียดถี่ถ้วนของ[ROOT.Char.Custom('RegionalFarmAnimal')]ทุกตัว ต้นข้าวบาร์เลย์ทุกต้น ผ้าห่มทอมือทุกผืน และหม้อดินทุกใบ ทำให้ได้ประมาณการที่ดีเกี่ยวกับภาษีที่ทาสติดที่ดินเหล่านี้ #EMP ควร#! จ่าย"
 governor_contract_event.1003.desc_outro: "\n\nการมองข้ามบางอย่างที่ไม่สามารถอธิบายได้ ไม่ว่าจะโดยไม่ได้ตั้งใจหรือตั้งใจ ดูเหมือนจะเป็นสาเหตุของความล้มเหลวของหมู่บ้านนี้ในการชำระหนี้สิน แต่ยังมีภารกิจหนึ่งเหลืออยู่: การตัดสินใจว่าจะแก้ไขสถานการณ์อย่างไรให้ดีที่สุด..."
 governor_contract_event.1003.a: "รวบรวมผลผลิตเท่าที่ทำได้ และขายครึ่งหนึ่งเพื่อพัฒนาพื้นที่ให้ดีขึ้น"
 governor_contract_event.1003.b: "พวกเขาจะต้องจ่ายเต็มจำนวน และไม่ขาดแม้ แต่เมล็ด #EMP เดียว#!."
 governor_contract_event.1003.c: "คนดีเหล่านี้ต้องจ่ายเพียงบางส่วนเท่านั้น"
 governor_contract_event.1003.d: "การประจำการกองทหารรักษาการณ์ที่นี่จะส่งเสริมการชำระเงินที่เหมาะสม"
 governor_contract_event.1003.e: "มอบหมายให้ผู้ดูแลมาดูแลหมู่บ้านกันเถิด"
 governor_contract_event.1003.f: "การลดหย่อนภาษีอาจช่วยให้คนเหล่านี้เจริญรุ่งเรืองได้หรือไม่?"
 governor_contract_event.1004.t: "ภาษีค้างชำระ: ล้มเหลว"
 governor_contract_event.1004.desc: "แม้ข้าจะชะโงกมองเข้าไปในห้องใต้ดินและยุ้งฉาง แม้ข้าจะขี่ม้าไปรอบทุ่งนา เกลี้ยกล่อมผู้นำหมู่บ้าน... ก็ไม่มีสัญญาณของความมั่งคั่งที่ถูกกักเก็บไว้ที่ใดในหมู่บ้านเล็กๆ แห่งนี้เลย ชาวบ้าน ดูจากรูปลักษณ์ภายนอกแล้ว ยากจนข้นแค้นอย่างแท้จริง และไม่สามารถจัดหาสิ่งที่พวกเขาเป็นหนี้ได้\n\nหากไม่มีหลักฐานว่าข้าถูกหลอกลวง ก็แทบไม่มีอะไรเหลือให้ข้าทำที่นี่ บัญชีแยกประเภทของข้าต้องยอมรับความสูญเสียไป"
 governor_contract_event.1004.a: "#EMP ให้ตายสิ!#!"
 
 governor_contract_event.1010.t: "นายกเทศมนตรีกักตุน"
 governor_contract_event.1010.desc: "ข้าได้รับรายงานจำนวนหนึ่งว่า [hoarding_mayor.GetTitledFirstName] ผู้ดูแล [mayor_destination.GetName] กำลังเก็บภาษีส่วนใหญ่ของเมืองไว้เพื่อ[hoarding_mayor.GetHerselfHimself]\n\nแม้จะเป็นที่คาดหวังว่านายกเทศมนตรีอาจเก็บภาษีที่เหลือไว้ได้ แต่จำนวนเงินที่รายงานนั้น #EMP มากเกินไป#! มันเข้าข่ายทุจริตได้อย่างง่ายดาย และที่แย่ไปกว่านั้น: การกระทำของ[hoarding_mayor.GetHerHis] สะท้อนภาพลักษณ์ที่ไม่ดีนักต่อ #EMP ข้า#!!"
 governor_contract_event.1010.a: "ข้าจะต้องแก้ไขปัญหานี้ด้วยตนเอง"
 governor_contract_event.1010.a_tt: "เดินทางไปยัง [mayor_destination.GetName] และพูดคุยกับนายกเทศมนตรี"
 governor_contract_event.1012.a_tt: "ท่านเริ่มเดินทางอีกครั้ง"
 governor_contract_event.1011.desc_intro: "ข้าไม่เสียเวลาเมื่อมาถึง [mayor_destination.GetName] และรีบขี่ม้าไปยังที่พักของนายกเทศมนตรี ข้าบุกเข้าไปโดยไม่บอกกล่าว และทันใดนั้นข้าก็ได้รับผลตอบแทนจากการกระทำอันน่าตื่นตาของข้า\n\n"
 governor_contract_event.1011.desc_upset: "[hoarding_mayor.GetFirstName] จ้องมองข้า ตะลึงงันไปชั่วครู่ ก่อนจะตั้งสติได้ [hoarding_mayor.GetHerselfHimself] ขณะที่ [hoarding_mayor.GetSheHe] ฟังคำกล่าวหาของข้า ใบหน้าบูดบึ้งก็ปรากฏขึ้นบนใบหน้าของรัฐมนตรี\n\n"ช่างเป็นข้อกล่าวหาที่เลวทราม! ข้าอาจจะ..." [hoarding_mayor.GetFirstNameNoTooltip] หยุดและหายใจเข้าลึกๆ "ก็ได้ ท่านเสนอว่าเราควรดำเนินการอย่างไร?""
 governor_contract_event.1011.desc_fear: "ด้วยความตกใจ [hoarding_mayor.GetFirstName] ทำเครื่องดื่ม[hoarding_mayor.GetHerHis]หกใส่[hoarding_mayor.GetHerselfHimself] — เห็นได้ชัดว่าตกตะลึงกับการปรากฏตัวของข้า! ใบหน้า[hoarding_mayor.GetHerHis|U]ซีดลงเรื่อยๆ ขณะที่ข้าแจกแจงข้อกล่าวหา\n\n"เดี๋ยวก่อน! ได้โปรด! แน่นอนว่านี่เป็นเพียงความเข้าใจผิด เราสามารถแก้ไขให้ถูกต้องได้ ใช่หรือไม่?""
 governor_contract_event.1011.desc_worried: "[hoarding_mayor.GetFirstName] หันมาอ้าปากค้างมองข้า พูดไม่ออก [hoarding_mayor.GetSheHe|U]ทรงตัว[hoarding_mayor.GetHerselfHimself]ด้วยมือข้างหนึ่งบนโต๊ะขณะที่ข้าตำหนิ[hoarding_mayor.GetHerHim] โยนข้อกล่าวหาแล้วข้อกล่าวหาเล่า\n\n"ข้า... ข้าแน่ใจว่ามีความเข้าใจผิด แต่แน่นอน ข้าจะช่วยท่านแก้ไขสถานการณ์! ไม่ว่าท่านจะเห็นสมควร อย่างไรก็ตาม!""
 governor_contract_event.1011.a: "ลงทุนในเมือง ข้าจะดูแลเหรียญที่เหลือเอง"
 governor_contract_event.1011.b: "เจ้าจะต้องมอบเหรียญส่วนเกิน #EMP ทั้งหมด#! ให้แก่ข้า"
 governor_contract_event.1011.c: "ใช้มันให้ดี ลงทุนในโครงสร้างพื้นฐานท้องถิ่น"
 governor_contract_event.1011.d: "คืนให้ประชาชนโดยการจัดงานรื่นเริง"
 governor_contract_event.1011.e: "ข้าเกรงว่ามีเพียงการลงโทษที่รุนแรงเท่านั้นที่จะได้ผล"
 governor_contract_event.1011.f: "ข้าปล่อยเรื่องนี้ไปได้... แต่อย่าลืมมันเสียล่ะ"
 governor_contract_event.1012.t: "ประเด็นการปกครอง: ยกเลิกการเดินทาง"
 governor_contract_event.1012.desc: "ข้าจะไม่สามารถทำอะไรได้มากเกี่ยวกับประเด็นปัจจุบันหากไม่ได้เดินทางไปยังสถานที่นั้น ข้าถูกคาดหวังให้จัดการกับปัญหาประเภทนี้โดยตรง แต่บางทีข้าอาจต้องเมินเฉยและมุ่งความสนใจไปที่เรื่องเร่งด่วนกว่า..."
 governor_contract_event.1012.a: "คิดดูอีกที ไปกันเถอะ!"
 governor_contract_event.1012.b: "ข้ามีเรื่องสำคัญกว่าที่ต้องจัดการ"
 
 governor_contract_event.1020.t: "เก็บเกี่ยวอุดมสมบูรณ์"
 governor_contract_event.1020.desc: "[ROOT.Char.GetFaith.FertilityGodName] ทรงเมตตาต่อเรา! ในหมู่บ้านหลายแห่งของ[ROOT.Char.GetPrimaryTitle.GetNameNoTierPossessive] รวงข้าวที่ดูเหมือนไม่มีที่สิ้นสุดถูกเก็บเกี่ยวจากทุ่งนาที่ได้รับน้ำอย่างดีจากฝนที่ตกสม่ำเสมอ และ[ROOT.Char.Custom('RegionalRootVegetablePlural')] เช่นนี้! ผลผลิตที่มากกว่าการเก็บเกี่ยวครั้งล่าสุดอย่างมีนัยสำคัญเป็นที่คาดหวังอย่างยินดี\n\nแน่นอนว่านี่เป็นข่าวดีอย่างยิ่ง ข้าต้องจัดตั้งแรงงานพิเศษและดูแลด้านโลจิสติกส์โดยเร็วที่สุด\n\nทีนี้ เกวียนของข้าจะบรรทุกกองผลผลิต[ROOT.Char.Custom('GetSeason')]อันยิ่งใหญ่นี้ไปที่ใด...?"
 governor_contract_event.1020.a: "ให้แจกจ่ายอย่างเท่าเทียมกันทั่วทั้งจังหวัด"
 governor_contract_event.1020.b: "แจกจ่ายควบคู่ไปกับธัญพืชปกติ"
 governor_contract_event.1020.c: "เมืองหลวงของจังหวัดต้องได้รับประโยชน์"
 governor_contract_event.1020.d: "บริจาคเพื่อการกุศลและผู้ขัดสนกันเถิด"
 governor_contract_event.1020.e: "เติมยุ้งฉางให้เต็มและขายส่วนเกิน"
 governor_contract_event.1020.f: "ย้าย #EMP ทั้งหมด#! ไปยังที่ดินของข้า"
 harvest_claim_it_yourself_estate_tt: "จำนวนเพิ่มขึ้น #P +[EmptyScope.ScriptValue('estate_granary_gold_bonus_value')|+0%]#! เนื่องจาก [GetDomicileBuilding('storage_granary_03').GetName] ใน [estate|E] ของท่าน"
 
 governor_contract_event.1030.t: "โจรชุกชุม"
 governor_contract_event.1030.desc: "ข้าอ่านรายงานอีกครั้ง #EMP โจรป่า#! ซึ่งสำหรับผู้เสียภาษีที่ปฏิบัติตามกฎหมายของข้าแล้ว พวกมันก็เป็นเพียงแกะอ้วนพีรอการเชือด!\n\nและแท้จริงแล้ว พวกนอกกฎหมายอันธพาลได้สังหารผู้คนของข้า... หมู่บ้านถูกคุกคาม กองคาราวานสูญหาย\n\nกลุ่มโจรชั่วร้ายกลุ่มหนึ่งได้ตั้งหลักปักฐานอย่างมั่นคงใน [task_contract_location.GetProvince.GetTerrain.GetNameNoTooltip|l] ใกล้กับ [bandit_destination.GetName] จนกว่าพวกมันจะถูกขับไล่ออกไป ภูมิภาคนี้จะยังคงควบคุมไม่ได้"
 governor_contract_event.1030.a: "รวบรวมกองทหาร เราออกเดินทางทันที!"
 governor_contract_event.1030.b: "พวกเขาจะถูกจัดการในไม่ช้า..."
 governor_contract_event.1031.desc: "ชาวเมือง [bandit_destination.GetName] ยินดีนำทางเราไปยังปากถ้ำของ[ROOT.Char.Custom('RegionalFerociousAnimal')]... ค่ายของพวกนอกกฎหมายอยู่ถัดไป ถูกบดบังด้วยพุ่มไม้และภูมิประเทศที่ขรุขระ\n\nจากที่ข้าได้ยิน ข้าตัดสินว่าศัตรูเหล่านี้คือนักรบเร่ร่อน: ผู้คนที่แข็งแกร่งอาศัยอยู่บริเวณชายขอบของสังคมที่ตั้งรกราก มั่งคั่งด้วยทรัพย์สมบัติจากดินแดนของข้าจนพวกเขาเปลี่ยนการบุกปล้นเป็นการพักอาศัยระยะยาว\n\nศัตรูยังไม่รู้ตัวถึงการปรากฏตัวของกองกำลังของข้า เรามีโอกาสโจมตีตามที่ข้าเห็นสมควร"
 governor_contract_event.1031.a: "บุก! เราจะโจมตีพวกเขาโดยไม่ให้ตั้งตัว!"
 governor_contract_event.1031.b: "วางกลยุทธ์ก่อนโจมตีกันเถิด"
 governor_contract_event.1031.c: "การล่อพวกมันเข้ากับดักอาจช่วยลดปัญหาให้เราได้มาก"
 governor_contract_event.1031.success: "ท่านสำเร็จและเอาชนะโจรได้"
 governor_contract_event.1031.failure: "ท่านล้มเหลวและโจรหลบหนีไป"
 governor_contract_event.1031.b.success: "กลยุทธ์ของท่านคือชัยชนะ"
 governor_contract_event.1031.b.failure: "การเลือกกลยุทธ์ของท่านยังต้องปรับปรุงอีกมาก"
 governor_contract_event.1031.c.success: "กับดักของท่านไร้ที่ติ"
 governor_contract_event.1031.c.failure: "กับดักของท่านหลอกใครไม่ได้"
 governor_contract_event.1032.desc_tactical: "ศัตรูที่ไร้วินัยของข้าไม่อาจหวังที่จะยืนหยัดต่อหน้ากองทหารที่ได้รับการฝึกฝนมาอย่างดีได้! ลูกธนูของพวกมันพุ่งไปไม่โดนเนื้อหนังของชาวนาที่ไร้การป้องกันอีกต่อไป มันกระทบโล่ของแนวรบเราอย่างไม่เป็นอันตราย เหล่าอาชญากรแตกหนี แต่ทหารม้าที่ปีกของเราตัดเส้นทางหนีทั้งหมด\n\nข้ามองดูผู้ตาย ข้าพิจารณาผู้รอดชีวิตที่ถูกจับกุม"
 governor_contract_event.1032.desc_trap: "กับดักของข้านั้นแยบยลที่สุด\n\nทหารหนุ่มเปลือยครึ่งท่อน ถืออาหารเย็นที่ขโมยมา วิ่งกลับมาหาเรา พวกนอกกฎหมาย พวก #EMP โง่เง่า#! ไล่ตามมาทันที! เรากระโจนออกจากที่ซ่อน — ส่งเสียงโห่ร้อง ศัตรูที่หวาดกลัวตระหนักถึงความผิดพลาดของตน — และเราก็เข้าโจมตีพวกมัน! เพียงชั่วครู่ก่อนตาย พวกเร่ร่อนยอมจำนนต่อกองทหารของข้า\n\nอาชญากรกลุ่มนี้ถูก ทำให้หมดพิษสง ไร้ทางสู้"
 governor_contract_event.1032.desc_charge: "การบุกโจมตีดังสนั่นเป็นเรื่องน่าประหลาดใจที่ไม่พึงประสงค์สำหรับศัตรูใดๆ แต่เสียงกรีดร้องที่ไม่เป็นภาษาของศัตรูผู้กระทำผิดของข้าบ่งบอกว่าพวกเขา #EMP ไม่ได้เตรียมพร้อม#! อย่างแท้จริงเพียงใด\n\nการต่อสู้ประชิดตัวระหว่างกองทหารติดอาวุธหนักของข้ากับนักรบครึ่งเปลือยที่โซซัดโซเซไปยังม้าของพวกเขากินเวลาเพียงครู่เดียว จากนั้นพวกเร่ร่อนที่รอดชีวิตก็ถูกจัดแถวอย่างเรียบร้อยต่อหน้าข้า"
 governor_contract_event.1032.desc_outro: "\n\nพวกเขาอยู่ในความเมตตาของข้า"
 governor_contract_event.1032.a: "คืนของที่ถูกขโมยไป; นำอาชญากรไปทำงาน"
 governor_contract_event.1032.b: "อภัยโทษความผิดของพวกเขา"
 governor_contract_event.1032.c: "หาเงินสุจริตเลี้ยงชีพเป็นอย่างไร?"
 governor_contract_event.1032.d: "พวกเขาจะต้องจ่ายค่าปรับ"
 governor_contract_event.1032.e: "แขวนคอพวกเขา"
 governor_contract_event.1032.f: "ยึดทรัพย์สินมีค่าและจำคุกพวกเขา"
 governor_contract_event.1033.desc: "[ROOT.Char.Custom('CulturalCurse')|U]!\n\nการโจมตีของทหารข้าถูกเปิดเผยโดยนกที่ตื่นตกใจ เราเข้าโจมตีศัตรูเร็วที่สุดเท่าที่จะทำได้ แต่พวกเร่ร่อนเจ้าเล่ห์ขึ้นม้าและควบหนีอย่างหนักแทบทันที!\n\nโจรที่หลบหนีบางส่วนถูกจับและสังหาร... แต่มีจำนวนน้อยเกินไปที่จะยับยั้งส่วนที่เหลือจากการปล้นสะดมต่อไป\n\nด้วยความเหนื่อยล้า เราต้องกลับบ้าน"
 governor_contract_event.1033.a: "ลืมเหตุการณ์นี้ไปเสียเถิด"
 governor_contract_event.1038.desc: "โจรเหล่านี้ไม่น่าจะจากไปโดยสันติ ผู้คนใน [bandit_destination.GetName] อาจต้องทนทุกข์ทรมานจากการโจมตีของพวกเขาเป็นเวลานาน เว้น แต่ข้าจะเข้าไปแทรกแซง\n\nนอกจากนี้ ในฐานะเจ้าหน้าที่ที่ได้รับการ แต่งตั้ง ความปลอดภัยของพวกเขาคือความรับผิดชอบของข้า"
 governor_contract_event.1038.a: "ข้าต้องปกป้องคนเหล่านี้!"
 governor_contract_event.1038.b: "ประชาชนจะต้องดูแลตัวเอง"
 governor_contract_event.1038.a_tt: "เดินทางไปยัง [bandit_destination.GetName] และจัดการกับโจร"

 discontent_soldiers: "ทหารไม่พอใจ"
 discontent_soldiers_contract: "$discontent_soldiers$"
 discontent_soldiers_desc: "ความไม่พอใจแพร่กระจายไปทั่วกองทหารของท่าน ยามบ่นพึมพำที่ป้อมยาม นายทหารชั้นผู้น้อยไม่ใส่ใจเรื่องระเบียบวินัย"
 discontent_soldiers_desc_title: "$task_contract_governance_desc_title$"
 governor_contract_event.2000.t: "$discontent_soldiers$"
 governor_contract_event.2000.desc: "ข่าวคราวจากด่านหน้าของข้า จากกองทหารประจำจังหวัดภายใต้บังคับบัญชาของข้า ล้วนเห็นพ้องกัน: ความไม่พอใจเพิ่มขึ้นในหมู่ทหาร การประจำการของพวกเขานานเกินไป ค่าจ้างต่ำเกินไป โสเภณีท้องถิ่นน่าเกลียดเกินไป ค่ายพักแรมทุรกันดารเกินไป...\n\nสำหรับผู้ที่อาศัยอยู่ในค่ายทหาร สาเหตุของการบ่นมีมากมายเสมอ แต่แม้ด้วยการแทรกแซงเพียงเล็กน้อย ข้าก็หวังว่าจะสามารถปรับปรุงขวัญกำลังใจของพวกเขาได้... มันจะช่วยเพิ่มความนิยมของข้าและความมั่นคงในตำแหน่งของข้าได้อย่างแน่นอน"
 governor_contract_event.2000.a: "ข้าจะมอบที่ดินให้แก่นายทหารอาวุโสทุกคน"
 governor_contract_event.2000.b: "พวกเขายังไม่แย่เท่ากองทหารของ[other_gov.GetTitledFirstNamePossessiveNoTooltip]!"
 governor_contract_event.2000.c: "พวกเขาควรได้รับเวลาพักผ่อนบ้าง"
 governor_contract_event.2000.d: "พวกเขาจะถูกลงโทษฐานไม่เชื่อฟังคำสั่ง!"
 governor_contract_event.2000.e: "เงินที่มากขึ้นจะ ทำให้พวกเขามีความสุข"
 ep3_settled_troops_province_modifier: "ทหารตั้งรกราก"
 ep3_settled_troops_province_modifier_desc: "นายทหารของกองทหารที่ประจำการในจังหวัดนี้ได้รับที่ดินในท้องถิ่นเพื่อตั้งรกราก"
 ep3_longer_breaks_province_modifier: "ทหารพักผ่อน"
 ep3_longer_breaks_province_modifier_desc: "กองทหารที่ประจำการในจังหวัดนี้ได้รับอนุญาตให้พักผ่อนนานขึ้นเพื่อเพิ่มขวัญกำลังใจ"
 ep3_better_paid_soldiers_modifier: "ทหารได้รับแรงจูงใจ"
 ep3_better_paid_soldiers_modifier_desc: "ตัวละครนี้เป็นที่รู้จักในการจ่ายเงินให้กองทหารมากกว่าที่จำเป็น และกองทหารที่มีความสุขคือกองทหารที่มีประสิทธิภาพ"

 inept_mayor: "นายกเทศมนตรีไร้ความสามารถ"
 inept_mayor_contract: "$inept_mayor$"
 inept_mayor_desc: "เจ้าหน้าที่คนสำคัญผู้นี้ได้พิสูจน์แล้วว่าไร้ความสามารถเกือบทั้งหมด ขุนนางท้องถิ่น สามัญชน และแม้ แต่รัฐมนตรีของท่านเองก็เริ่มไม่พอใจมากขึ้นเรื่อยๆ"
 inept_mayor_desc_title: "$task_contract_governance_desc_title$"
 governor_contract_event.2010.t: "$inept_mayor$"
 governor_contract_event.2010.desc: "ข้าพินิจพิเคราะห์รายการคำร้องเรียนอันยาวเหยียดที่ส่งมาจาก [mayor_destination.GetName] สังเกตเห็นข้อกล่าวหาต่อ "ไอ้[inept_mayor.Custom2('InsultNoun', ROOT.Char)] [inept_mayor.GetFirstName] นั่น" ว่าด้วย "อาชญากรรมอัน[inept_mayor.Custom2('InsultAdjective', ROOT.Char)]" [inept_mayor.GetSheHe] ได้ถูกกล่าวหาว่าสูบเงินทุนไปจาก [inept_mayor.GetPrimaryTitle.GetTierAsNameNoTooltip|l]\n\nมันมีบางอย่างที่ #EMP ผิดปกติ#! อย่างยิ่งจริงๆ กับการบัญชีของเมือง: ความมั่งคั่งดูเหมือนจะหายไปจากบัญชีอย่างมิอาจอธิบายได้ จำนวนข้าราชการที่รัฐจ่ายเงินเดือนก็เปลี่ยนแปลงไปทุกวัน และเอกสารเกี่ยวกับกรรมสิทธิ์ที่ดินก็เต็มไปด้วยความไม่สอดคล้องกัน"
 governor_contract_event.2010.a: "ข้าควรไปเยี่ยม [mayor_destination.GetNameNoTooltip]"
 governor_contract_event.2011.desc_intro: "เมื่อข้าไปถึง [mayor_destination.GetName] ข้ารีบเข้าไปในสำนักงานของนายกเทศมนตรีท้องถิ่น [inept_mayor.GetFirstName] ดูเหมือนจะประหลาดใจ ข้าราชการผู้นั้นรีบไล่คนรับใช้[inept_mayor.GetHerHis]ออกไป บัญชีแยกประเภทถูกกอดไว้ในอ้อมแขนของพวกเขา\n\n"ข้ามาเพื่อตรวจสอบการบัญชีของฝ่ายบริหารของท่าน" ข้ากล่าว พลางขมวดคิ้วอย่างเคร่งขรึม"
 governor_contract_event.2011.desc_fear: "\n\n"เกี่ยวกับ เอ่อ การส่งมอบธัญพืชหรือ?" นายกเทศมนตรีพูดตะกุกตะกัก "การนำเข้าผ้าไหม? ใช่ ผู้ติดต่อของข้าอาจไม่ค่อยปกติ แต่พวกเขาได้รับการอภัยโทษแล้ว! เอ่อ... #EMP ส่วนใหญ่.#! ข้าจะยกเลิกคำสั่งเหล่านี้ [ROOT.Char.GetTitleAsName]ของข้า ทั้งหมดเลย ท่านไม่ต้องกังวล!""
 governor_contract_event.2011.desc_upset: "\n\n"[ROOT.Char.GetTitleAsName]ของข้า ท่านคงไม่สงสัยในความทุ่มเทอย่างเต็มที่ต่อตำแหน่งของข้าหรอกนะ? ความสามารถที่ผ่านการทดสอบมาอย่างดีของข้า?!" นายกเทศมนตรีพองตัว[inept_mayor.GetHerselfHimself] ประเมินข้าเพื่อเผชิญหน้า\n\nแต่ข้าคือผู้บังคับบัญชาของ[inept_mayor.GetHerHis]"
 governor_contract_event.2011.desc_worried: "\n\n"ข่าวร้ายหรือ [ROOT.Char.GetTitleAsName]ของข้า?" [inept_mayor.GetFirstNameNoTooltip] หัวเราะอย่างไม่น่าเชื่อถือ "พวกผู้ยิ่งใหญ่ในท้องถิ่นปากมากและมีจินตนาการบรรเจิด ทางที่ดีควรหลีกเลี่ยงพวกที่เสียงดังกว่า...""
 governor_contract_event.2011.a: "แสดงบัญชีแยกประเภทให้ข้าดู"
 governor_contract_event.2011.b: "เจ้าไม่คู่ควรกับตำแหน่งของเจ้า"
 governor_contract_event.2011.c: "ข้ากำลังเรียกผู้เชี่ยวชาญของข้าจากเมืองหลวง"
 governor_contract_event.2011.d: "เจ้าจะต้องชดใช้ค่าเสียหายทั้งหมดเป็นการส่วนตัว!"
 ep3_mismanaged_administration_modifier: "ความไร้ความสามารถในการบริหาร"
 ep3_mismanaged_administration_modifier_desc: "ศูนย์กลางหลักแห่งหนึ่งในเคาน์ตีนี้มีการจัดการที่ผิดพลาดอย่างรุนแรงจนทั้งพื้นที่ได้รับความเดือดร้อน"

 prov_investment: "การลงทุนระดับจังหวัด"
 prov_investment_contract: "$prov_investment$"
 prov_investment_desc: "มีโอกาสให้ท่านลงทุนในเมืองหลวงของเขตปกครองของท่าน"
 prov_investment_desc_title: "$task_contract_governance_desc_title$"
 governor_contract_event.2020.t: "$prov_investment$"
 governor_contract_event.2020.desc: "ช่างรู้สึกดีเสียนี่กระไรเมื่อการปกครองที่ขยันหมั่นเพียรนำมา ซึ่งผลลัพธ์อันดีงาม!\n\nคลังของ [ongoing_destination.GetName] เต็มเปี่ยม และข้าได้รับมอบหมายจากฝ่ายบริหารส่วนกลางให้นำส่วนเกินไปลงทุนใหม่ในท้องถิ่น"
 governor_contract_event.2020.a: "โครงสร้างพื้นฐานคือกุญแจสู่ความสำเร็จ"
 governor_contract_event.2020.b: "การทำงานของ[ROOT.Char.GetFaith.HighGodName]บนโลกถือเป็นสิทธิพิเศษ"
 governor_contract_event.2020.c: "สร้างรูปปั้นอันยิ่งใหญ่ในนามของ[emperor.GetTitledFirstNamePossessiveNoTooltip]กันเถิด!"
 governor_contract_event.2020.c_tt: "น่าเสียดาย นั่นหมายถึงการ #EMP จัดสรรใหม่#! วัสดุก่อสร้างจากทั่วทั้งพื้นที่..."
 governor_contract_event.2020.d: "พ่อค้าท้องถิ่นน่าจะได้รับประโยชน์จากความช่วยเหลือเพิ่มเติม"
 governor_contract_event.2020.e: "ทหารผู้กล้าหาญของเราสมควรได้รับสิ่งที่ดีกว่า!"
 governor_contract_event.2020.f: "อาหารสำหรับประชาชนคือทางออก!"
 governor_contract_event.2021.t: "$prov_investment$: สำเร็จ"
 governor_contract_event.2021.desc_infrastructure: "ถนนสายหลักที่พลุกพล่านที่สุดใน [task_contract_location.GetNameNoTier] ได้รับการปรับปรุงเป็นอันดับแรก คนงานที่ข้าจ้างทำงานหนัก และด้วยค่าจ้างที่เป็นแบบอย่าง ความคืบหน้าจึงรวดเร็ว"
 governor_contract_event.2021.desc_church: "แผนสำหรับ[ROOT.Char.GetFaith.HouseOfWorship]แห่งใหม่ของ[task_contract_location.GetNameNoTierPossessive]เป็นภาพลักษณ์อันบริสุทธิ์ของแรงบันดาลใจจากสวรรค์ แม้ว่า — เมื่อเทียบกับสถานที่ศักดิ์สิทธิ์อันยิ่งใหญ่ของโลก — ของเราเป็นเพียงสถานที่อันเรียบง่าย ขอให้ผู้ศรัทธารวมตัวกัน!"
 governor_contract_event.2021.desc_monument: "ใบหน้าของ[emperor.GetFaith.WealthGodName] หนึ่งในผู้อุปถัมภ์หลักของ[emperor.GetTitledFirstNamePossessive] ถูกสร้างขึ้นใหม่อย่างรักใคร่ — และค่อนข้างประจบสอพลอ — โดยช่างฝีมือของข้า พระนามขององค์อธิปัตย์ผู้ยิ่งใหญ่ถูกจารึกไว้ด้านล่าง... เช่นเดียวกับชื่อของข้า"
 governor_contract_event.2021.desc_traders: "สินค้าหลั่งไหลเข้ามา! การค้าเจริญรุ่งเรือง เพียงแค่ข้าประกาศลดภาษีศุลกากรที่สำคัญบางรายการ ตอนนี้ ต้องเคลียร์ปศุสัตว์เหม็นๆ ออกจากปลายสุดของจัตุรัสท้องถิ่นที่ไม่ได้ใช้งานนั้น..."
 governor_contract_event.2021.desc_military: "เสียงเฉลิมฉลองดังมาจากค่ายทหาร ด้วยความมั่งคั่งที่ข้ามอบให้ ความภักดีและความพร้อมรบของกองทหารของข้าจึงมั่นใจได้อย่างยิ่ง! เหล่านายกองของข้านำทหารที่เหลือเปล่งเสียงเรียกชื่อข้า"
 governor_contract_event.2021.desc_food: "แม้ แต่ขอทานที่ต่ำต้อยที่สุดใน [task_contract_location.GetNameNoTier] ก็นอนหลับท้องอิ่มในคืนนี้ การแจกจ่ายธัญพืชของข้า ทำให้ครอบครัวที่มีใบหน้าสดใสยกฟ่อนข้าวขึ้นไปบนขื่อ ทั่วทั้งภูมิภาคอบอวลไปด้วยกลิ่นขนมปังอบใหม่"
 governor_contract_event.2021.desc: "\n\nการเลือกการลงทุนนี้พิสูจน์แล้วว่าชาญฉลาด ด้วยผลลัพธ์เบื้องต้นที่ปรากฏ ข้าก็ได้รับการยกย่องและเฉลิมฉลองจากผู้คนภายใต้การดูแลของข้าแล้ว"
 governor_contract_event.2021.a: "งานสำเร็จลุล่วงด้วยดี"
 governor_contract_event.2022.t: "$prov_investment$: ล้มเหลว"
 governor_contract_event.2022.desc_monument: "ข้าได้แจ้งฝ่ายบริหารของเมืองหลวงเกี่ยวกับอนุสาวรีย์ใหม่ล่าสุดของข้า รูปปั้นประดับอัญมณีอันโอ่อ่า... และข้าไม่ได้รับการตอบกลับใดๆ [emperor.GetTitledFirstName] ไม่ทรงลดพระองค์ลงมาให้เกียรติข้าสำหรับการแสดงความจงรักภักดีของข้า หาก[emperor.GetSheHe]ทรงทราบเรื่องนี้เลย"
 governor_contract_event.2022.desc_traders: "ด้วยการปรับภาษีและภาษีศุลกากรของข้า พ่อค้าต่างโห่ร้องยินดีกับผลกำไรใหม่... แต่เราไม่เห็นรายได้เพิ่มขึ้น ยิ่งไปกว่านั้น ช่างฝีมือและคนงานในท้องถิ่นต่างบ่นเกี่ยวกับการบริหารของข้า: เมื่อเผชิญกับการนำเข้าราคาถูกลงใหม่ พวกเขาประสบปัญหาในการระบายสินค้าของตน"
 governor_contract_event.2022.desc_military: "กองทหารไม่ค่อย #EMP มีสติ#! เท่าใดนักเกี่ยวกับโบนัสเงินเดือนกะทันหัน... ด้วยความบ้าคลั่ง พวกเขาใช้จ่ายเงินเดือนไปกับการมั่วสุมที่ไม่น่าดู\n\nบัดนี้ เหล่านายกองอันเป็นที่รักต้องเผชิญข้อหาทางอาญา ทหารได้รับบาดเจ็บจากการทะเลาะวิวาทกับคนในท้องถิ่น และข้ากลับถูกตำหนิสำหรับทุกสิ่ง"
 governor_contract_event.2022.desc: "\n\nน่าเศร้าที่เรื่องนี้ไม่ได้เป็นไปตามที่ข้าคาดไว้ และส่วนเกินของจังหวัดข้าก็สูญหายไป"
 governor_contract_event.2022.a: "โชคร้าย"
 governor_contract_event.2020.success: "การลงทุนสำเร็จ"
 governor_contract_event.2020.failure: "การลงทุนล้มเหลว"
 ep3_contract_infrastructure_modifier: "กำลังพัฒนาโครงสร้างพื้นฐาน"
 ep3_contract_infrastructure_modifier_desc: "ถนน สถานีส่งสาร การจัดหาน้ำ และทุกสิ่งที่เคาน์ตีต้องการเพื่อการเติบโต"
 ep3_food_distribution_modifier: "การแจกจ่ายอาหาร"
 ep3_food_distribution_modifier_desc: "เงินส่วนเกินในรัฐบาลท้องถิ่นถูกนำไปใช้ในการนำเข้าอาหารราคาถูกสำหรับประชาชนทั่วไป"
 ep3_invested_military_modifier: "กองทัพที่ปรับปรุงแล้ว"
 ep3_invested_military_modifier_desc: "มีการลงทุนทองคำจำนวนมากในกองทหารที่ประจำการในเคาน์ตีนี้"

 raiding_peasants: "ชาวนาปล้นสะดม"
 raiding_peasants_contract: "$raiding_peasants$"
 raiding_peasants_desc: "กลุ่มชาวนาที่รวมตัวกันเองได้บุกปล้นดินแดนของเราจากฝั่งตรงข้ามพรมแดน"
 raiding_peasants_desc_title: "$task_contract_governance_desc_title$"
 governor_contract_event.2030.t: "$raiding_peasants$"
 governor_contract_event.2030.desc: "มีข่าวที่น่ากังวลมาจาก [ongoing_destination.GetName]\n\nปรากฏว่ากลุ่มชาวนาท้องถิ่นได้จับอาวุธและรวมตัวกันเป็นกลุ่มเกเร บุกข้ามพรมแดนของเราเข้าไปในดินแดนของ[neighbor.GetCulture.GetNameNoTooltip]\n\nการกระทำดังกล่าวไม่น่าจะก่อให้เกิดความกังวลทางการทูต แต่การปฏิบัติการทางทหาร — และการครอบครองอาวุธ — เป็นสิทธิพิเศษของกองทัพ ดังนั้น การละเมิดกฎหมายใดๆ จะต้องถูกสอบสวน"
 governor_contract_event.2030.a: "ข้าต้องไปดูด้วยตาตนเอง"
 governor_contract_event.2030.a.tt: "ท่านเดินทางไปยัง [ongoing_destination.GetNameNoTooltip]"
 governor_contract_event.2031.desc: "เมื่อข้าไปถึง [ongoing_destination.GetName] ข้อมูลของข้าพิสูจน์ว่าถูกต้อง ยามของข้าใช้เวลาไม่นานในการรวบรวมกลุ่มคนท้องถิ่นจำนวนมาก ซึ่งทั้งหมดครอบครองอาวุธที่ไม่ได้รับอนุญาต\n\n"เราต้องการมันเพื่อปกป้องตนเองและครอบครัว!" พวกเขาประท้วง "พวก[neighbor.GetCulture.GetNameNoTooltip]ชั่วร้ายเหล่านั้นไว้ใจไม่ได้! พวกเขาต้องเรียนรู้ที่จะอยู่ห่างจากเรา!""
 governor_contract_event.2031.a: "พวกเจ้าทั้งหมดจะต้องทำงานให้ข้า — อย่างถูกกฎหมาย"
 governor_contract_event.2031.b: "การปล้นสะดมมีโทษถึงตาย"
 governor_contract_event.2031.c: "พวกเจ้าต้องการความช่วยเหลือ #EMP อย่างไม่เป็นทางการ#! หรือไม่?"
 governor_contract_event.2031.d: "พวกเจ้าควรจะทำงานในทุ่งนาของตน"
 governor_contract_event.2031.e: "มอบทองคำทั้งหมดที่พวกเจ้าปล้นมาให้ข้า แล้วพวกเจ้าก็ไปได้!"
 ep3_peasant_border_raids_modifier: "การปล้นชายแดนของชาวนา"
 ep3_peasant_border_raids_modifier_desc: "ชาวนาท้องถิ่นได้ติดอาวุธและกำลังปกป้องพรมแดนของตนอย่างแข็งขัน"
 ep3_peasant_workers_modifier: "กลับสู่ทุ่งนา"
 ep3_peasant_workers_modifier_desc: "กองกำลังอาสาสมัครท้องถิ่นถูกยุบและชาวนาถูกส่งกลับไปทำนา"

 wild_predators: "สัตว์นักล่า"
 wild_predators_contract: "$wild_predators$"
 wild_predators_desc: "สัตว์ป่ากินสัตว์ในเขตอนุรักษ์พันธุ์สัตว์ป่าท้องถิ่นและคุกคามชาวบ้าน มีรายงานการพบเห็นบ่อยครั้งใกล้หมู่บ้านของพวกเขา เหตุการณ์นองเลือดในคอกสัตว์ของพวกเขา"
 wild_predators_desc_title: "$task_contract_governance_desc_title$"
 governor_contract_event.2040.t: "$wild_predators$"
 governor_contract_event.2040.desc: "ข่าวจาก [ongoing_destination.GetName] เลวร้ายและบอกเล่าด้วยความหวาดกลัว\n\nสัตว์ป่าในท้องถิ่นหายากขึ้นเรื่อยๆ จำนวนของพวกมันลดลง เนื่องจากการปรากฏตัวของ[ROOT.Char.Custom('GetAnimalType')]ที่เพิ่มขึ้น สัตว์ร้ายเหล่านี้ ซึ่งกล้าหาญขึ้นจากจำนวนที่เพิ่มขึ้น ไม่พอใจกับการลดจำนวนประชากรในถิ่นทุรกันดาร แต่ตอนนี้สามารถพบเห็นพวกมันซุ่มซ่อนอยู่รอบๆ ชุมชนของผู้คนของข้า\n\nปศุสัตว์และเด็กๆ ถูกจับตามองอย่างใกล้ชิด แต่ถึงกระนั้น... ชานเมือง [ongoing_destination.GetName] ก็ไม่ปลอดภัย"
 governor_contract_event.2040.a: "ข้าต้องทำอะไรสักอย่าง"
 governor_contract_event.2041.desc: "การมาถึงของข้าใน [ongoing_destination.GetName] อยู่ท่ามกลางโศกนาฏกรรมและความกังวล ชาวบ้านพึมพำว่า — ในความปลอดภัยของคอก — [ROOT.Char.Custom('RegionalFarmAnimal')]รางวัลตัวหนึ่งเพิ่งถูกฉีกเป็นชิ้นๆ โดย[ROOT.Char.Custom('GetAnimalType')]ขนาดมหึมา\n\nการขี่ม้าสำรวจรอบภูมิภาคอย่างรวดเร็วพิสูจน์ว่าข้อมูลนี้น่าเชื่อถือ สัตว์ป่าหายาก และสัญญาณการโจมตีของ[ROOT.Char.Custom('GetAnimalType')]มีอยู่ทุกหนทุกแห่ง\n\nพวกเขาบอกว่าทารกหายไป พวกเขาบอกว่าพบกระดูกเล็กๆ ที่แตกละเอียด"
 governor_contract_event.2041.a: "ข้ารู้จักมืออาชีพที่เหมาะสม"
 governor_contract_event.2041.a.tt: "ท่านส่งผู้เชี่ยวชาญด้านยาพิษเข้าไปเพื่อสังหารสัตว์นักล่าที่ควบคุมไม่ได้อย่างเลือกสรรด้วยเหยื่อล่อ"
 governor_contract_event.2041.b: "ข้าจะล่าสัตว์ร้ายด้วยตนเอง!"
 governor_contract_event.2041.c: "เราต้องการนักล่าเพิ่ม"
 governor_contract_event.2041.d: "ชาวนาท้องถิ่นจัดการได้"
 governor_contract_event.2041.e: "ข้าอยากได้สัตว์เลี้ยงแปลกๆ มาตลอด..."
 governor_contract_event.2041.e.tt: "ส่งยามของท่านไปจับสัตว์ให้ได้มากที่สุด"
 governor_contract_event.2041.f: "แค่นำเข้าและปล่อยเหยื่อเพิ่ม!"
 governor_contract_event.2041.b.success: "การล่าครั้งใหญ่ดำเนินไปด้วยดี"
 governor_contract_event.2041.b.fail: "กลุ่มล่าสัตว์ของท่านตกอยู่ในความโกลาหล"
 governor_contract_event.2041.c.success: "นักดักสัตว์จำนวนมากมาจับสัตว์ร้าย"
 governor_contract_event.2041.c.fail: "มีเพียงไม่กี่คนที่สนใจติดตาม[ROOT.Char.Custom('GetAnimalType')]"
 governor_contract_event.2041.d.success: "ทักษะการดำรงชีวิตในป่าท้องถิ่นมีชัย"
 governor_contract_event.2041.d.fail: "ชาวนาเป็นเพียงเหยื่อ"
 governor_contract_event.2041.e.success: "[ROOT.Char.Custom('GetAnimalType')]ทุกตัวถูกขังอยู่ในกรง"
 governor_contract_event.2041.e.fail: "คอกของท่านยังคงว่างเปล่า"

 governor_contract_event.2042.desc: "ชัยชนะ!\n\n[ongoing_destination.GetName] ปลอดจากความน่าสะพรึงกลัวของถิ่นทุรกันดาร ปราศจากปัญหา[ROOT.Char.Custom('GetAnimalType')] — การแทรกแซงอย่างเด็ดเดี่ยวของข้าได้ปลดปล่อยสามัญชนจากความกลัว!\n\nใน [ongoing_destination.GetTerrain.GetNameNoTooltip|l] ที่ข้ายืนอยู่ สัตว์กินพืชผู้บริสุทธิ์ของ[ROOT.Char.GetFaith.HighGodNamePossessive] สัตว์กินพืชขี้ตื่นของพระองค์ จะท่องไปอย่างอิสระอีกครั้งในไม่ช้า"
 governor_contract_event.2042.a: "ข้าขอรับเครดิตทั้งหมดสำหรับความสำเร็จนี้"
 governor_contract_event.2043.desc: "ฟันขบกัน กรงเล็บเหมือนหัวหอก ปากน้ำลายไหลขนาดใหญ่อยู่ด้านหลัง — ตาบอดด้วยความหวาดกลัว เราหนีออกจาก [ongoing_destination.GetTerrain.GetNameNoTooltip|l] ของ [ongoing_destination.GetName] แทบไม่รอดชีวิต!\n\nภัยคุกคามจาก[ROOT.Char.Custom('GetAnimalType')]ที่นี่ไม่อาจหยุดยั้งได้อย่างแท้จริง บางทีอาจเป็นบริวารป่าของ[ROOT.Char.GetFaith.DevilName]ที่สิงสู่หมู่บ้านเล็กๆ แห่งนี้?\n\n[ROOT.Char.Custom('CulturalCurse')|U]! ข้าทำได้เพียงจากไป ปล่อยให้ชาวบ้านถูกคุกคามโดยสัตว์ร้าย..."
 governor_contract_event.2043.a: "ข้าได้ แต่หวังว่าพวกมันจะเริ่มกิน #EMP กันเอง...#!."
 ep3_abundant_game_modifier: "สัตว์ป่าอุดมสมบูรณ์"
 ep3_abundant_game_modifier_desc: "สัตว์ป่าอุดมสมบูรณ์ในบริเวณนี้ ทำให้การล่าประสบความสำเร็จมากขึ้น"
 ep3_wild_predators_modifier: "$wild_predators$"
 ep3_wild_predators_modifier_desc: "สัตว์นักล่าป่าจำนวนมากเดินเพ่นพ่านในดินแดนเหล่านี้ สังหารทั้งชาวนาและสัตว์ป่า"
 ep3_ferocious_pets_modifier: "สัตว์เลี้ยงดุร้าย"
 ep3_ferocious_pets_modifier_desc: "ตัวละครนี้พัฒนารสนิยมราคาแพงสำหรับสัตว์เลี้ยงดุร้าย"

 evil_presence: "การปรากฏตัวของปีศาจ"
 evil_presence_contract: "$evil_presence$"
 evil_presence_desc: "สามัญชนที่หวาดกลัวอ้างว่าถูกข่มเหงโดยการปรากฏตัวของปีศาจ นักบวชท้องถิ่นไม่สามารถปลอบโยนฝูงชนที่ถูกรุมเร้านี้ได้ จึงขอให้ท่านเข้าแทรกแซง"
 evil_presence_desc_title: "$task_contract_governance_desc_title$"
 governor_contract_event.2050.t: "$evil_presence$"
 governor_contract_event.2050.desc: "[ongoing_destination.GetCounty.GetFaith.PriestNeuterPlural]ท้องถิ่นของ [ongoing_destination.GetName] เขียนถึงข้าด้วยความตื่นตระหนก ดึงดูดความสนใจของข้าด้วยคำเตือนอันน่าสะพรึงกลัวถึงความรุนแรงที่จะเกิดขึ้น\n\nประชากรในท้องถิ่นกำลังคลุ้มคลั่งกับเหตุการณ์น่าสงสัยหลายอย่าง: ลางร้าย เช่น"
 governor_contract_event.2051.desc_a: "ปลาเน่าเสีย,"
 governor_contract_event.2051.desc_b: "ไข้,"
 governor_contract_event.2051.desc_c: "คู่สมรสทะเลาะกัน,"
 governor_contract_event.2051.desc_d: "เด็กตื่นขึ้นมากรีดร้องตอนกลางคืน,"
 governor_contract_event.2051.desc_e: "ปวดหัวหมู่,"
 governor_contract_event.2051.desc_f: "การล่าล้มเหลว,"
 governor_contract_event.2051.desc_g: "วัวป่วย,"
 governor_contract_event.2051.desc_h: "การผลิตเสียหาย,"
 governor_contract_event.2051.desc_i: "ทุ่งนาเสียหาย,"
 governor_contract_event.2051.desc_l: "และการปรากฏตัวประหลาดของสุนัข"
 governor_contract_event.2051.desc_m: "และการปรากฏตัวประหลาดของม้า"
 governor_contract_event.2051.desc_n: "และการปรากฏตัวประหลาดของนกอินทรี"
 governor_contract_event.2051.desc_o: "และการปรากฏตัวประหลาดของแมว"
 governor_contract_event.2051.desc_p: "และการปรากฏตัวประหลาดของกบ"
 governor_contract_event.2051.desc_q: "และการปรากฏตัวประหลาดของงู"
 governor_contract_event.2051.desc_end: "\n\nผู้คนหวาดกลัวว่าปีศาจ — หรือสิ่งชั่วร้ายอื่นใดที่ไม่อาจเอ่ยชื่อได้ — ได้เข้ามาอาศัยอยู่ท่ามกลางพวกเขา"
 governor_contract_event.2050.a: "ข้าคิดว่าจำเป็นต้องมีการสืบสวน"
 governor_contract_event.2051.desc: "ผู้คนดีๆ ใน [ongoing_destination.GetName] เสียสติไปด้วยความหวาดกลัว\n\nความตื่นตระหนกและความหวาดระแวงพุ่งสูง ทั้งที่ตึกแถวซอมซ่อและ[ROOT.Char.Custom('ResidenceBuilding')]ของผู้พิพากษาท้องถิ่น ขบวนผู้ติดตามของข้าต้องเผชิญกับประตูที่ปิดตาย ข้อกล่าวหาต่อเพื่อนและญาติเกี่ยวกับการปฏิบัติที่น่าสยดสยองที่สุด และพลเมืองผู้ซื่อสัตย์ที่เห็นสัตว์ประหลาดในทุกเงา กิจกรรมที่มีประสิทธิผลแทบจะหยุดชะงัก\n\nไม่ทางใดก็ทางหนึ่ง สถานการณ์นี้ต้องยุติลง หากปราศจากศรัทธาในการคุ้มครองของ[ongoing_destination.GetCounty.GetFaith.HighGodNamePossessive]... สายใยของสังคมนี้แทบจะไม่สามารถเสื่อมสลายไปได้อีกแล้ว"
 governor_contract_event.2051.a: "ข้าจะขอหมอผีอย่างเป็นทางการจากเมืองหลวง"
 governor_contract_event.2051.b: "นำ[ROOT.Char.GetFaith.PriestNeuter]ผู้มีชื่อเสียงมาทำพิธีไล่ผี"
 governor_contract_event.2051.c: "ต้องมีพ่อมดชั่วร้ายแน่!"
 governor_contract_event.2051.d: "ผู้อาวุโสของท่านแนะนำว่าอย่างไร?"
 governor_contract_event.2051.e: "พวกเจ้าแค่ตาฝาด ไร้สาระ"
 ep3_church_investigation_modifier: "การสืบสวนของศาสนจักร"
 ep3_church_investigation_modifier_desc: "ศาสนจักรได้เข้ามาเกี่ยวข้องกับการสืบสวนผู้ที่อาจใช้เวทมนตร์ปีศาจ"
 ep3_rationalist_gov_modifier: "ผู้มีเหตุผล"
 ep3_rationalist_gov_modifier_desc: "ตัวละครนี้มีชื่อเสียงในการให้คุณค่าแก่เหตุผลมากกว่าศาสนา ซึ่งเป็นความคิดเห็นที่ไม่ค่อยเป็นที่นิยม"
 ep3_local_practices_modifier: "ยึดถือธรรมเนียมปฏิบัติท้องถิ่น"
 ep3_local_practices_modifier_desc: "ผู้ว่าการท้องถิ่นได้สนับสนุนธรรมเนียมปฏิบัติแบบดั้งเดิมอย่างเปิดเผย — บางคนเรียกว่าความเชื่องมงาย — เพื่อจัดการกับปีศาจ"

 miraculous_healing: "การรักษาอันน่าอัศจรรย์"
 miraculous_healing_contract: "$miraculous_healing$"
 miraculous_healing_desc: "ผู้ทุพพลภาพในท้องถิ่นได้รับบริจาควัตถุมงคลและของมีค่ามากมาย และทุกครั้งอ้างว่าได้รับการฟื้นฟูสุขภาพด้วยพระหรรษทาน ผู้ให้ทานเริ่มไม่พอใจมากขึ้นเรื่อยๆ"
 miraculous_healing_desc_title: "$task_contract_governance_desc_title$"
 governor_contract_event.2060.t: "$miraculous_healing$"
 governor_contract_event.2060.desc: "คดีที่น่าสนใจ และบุคคลที่ไม่ธรรมดาอย่างยิ่ง ถูกนำมาให้ข้าตัดสิน\n\n[scammer.GetWomanMan]ผู้นี้ [scammer.GetName] ถูกกล่าวหาว่าเป็นผู้ทุพพลภาพจอมปลอม: นักต้มตุ๋นที่หาเลี้ยงชีพด้วยการหลอกลวงผู้ศรัทธา [scammer.GetSheHe|U] [scammer.Custom('quirk_pos_present')] อย่างมีเสน่ห์ ขณะที่วัตถุมงคลที่ได้รับบริจาคถูกวางอยู่ตรงหน้าข้า\n\nพยานยืนยันว่าเห็นชาย "ตาบอด" ผู้นี้อยู่ข้างบันได[ROOT.Char.GetFaith.HouseOfWorshipPlural]ของพวกเขา วิงวอนขอความเมตตา [scammer.GetSheHe] ทำให้หัวใจของเหล่าศาสนิกชนอบอุ่นด้วยการได้รับการรักษาอย่างน่าอัศจรรย์ครั้งแล้วครั้งเล่า... แต่หลังจากได้รับเหรียญหรือสิ่งของศักดิ์สิทธิ์เท่านั้น"
 governor_contract_event.2060.a: "นักต้มตุ๋นผู้นี้จะถูกลงโทษอย่างเป็นเยี่ยงอย่าง"
 governor_contract_event.2060.b: "ข้าต้องการคนที่มี #EMP ความคิดสร้างสรรค์#! เช่นเจ้า"
 governor_contract_event.2060.c: "คืนวัตถุมงคลมา แล้วข้าจะลืมเรื่องนี้ไปเสีย"
 governor_contract_event.2060.d: "ค่าปรับที่เหมาะสมคือการลงโทษที่เพียงพอ"
 governor_contract_event.2060.e: "การลงโทษที่เป็นไปได้เพียงอย่างเดียวคือการจำคุก"
 governor_contract_event.2060.f: "[ROOT.Char.GetFaith.HighGodName]ทรงทำงานในรูปแบบที่ลึกลับ"

 buried_treasure: "สมบัติฝังดิน"
 buried_treasure_contract: "$buried_treasure$"
 buried_treasure_desc: "ชาวนาท้องถิ่นพบขุมทองคำฝังดิน และเกิดข้อพิพาทขึ้นว่าใครเป็นเจ้าของ"
 buried_treasure_desc_title: "$task_contract_governance_desc_title$"
 governor_contract_event.2070.t: "$buried_treasure$"
 governor_contract_event.2070.desc: "ผู้อาวุโสของชุมชนเล็กๆ ใกล้ [ongoing_destination.GetName] ได้ติดต่อข้าเพื่อตัดสินใจเกี่ยวกับเหตุการณ์ที่เกิดขึ้นได้ยาก\n\nครอบครัวชาวนาได้ขุดพบขุมเหรียญทองคำจำนวนมากขณะทำงานในทุ่งนา! เพื่อนบ้านของพวกเขาก็แตกแยกออกเป็นกลุ่มทันที: บางคนเชื่อว่าทองคำควรเป็นของผู้ค้นพบ ในขณะที่คนอื่นๆ โต้แย้งว่าโชคลาภควรแบ่งปันกันทั้งหมู่บ้าน\n\nคำพูดของผู้มีอำนาจสูงกว่าอาจดับความโลภของคนเรียบง่ายเหล่านี้ และช่วยให้พวกเขาไม่ต้องตกอยู่ในความรุนแรงเล็กๆ น้อยๆ"
 governor_contract_event.2070.a: "ช่างเป็นเหตุการณ์ที่น่าสงสัยอย่างแท้จริง!"
 governor_contract_event.2071.desc: "เมื่อไปถึง [ongoing_destination.GetName] ข้าได้รับการแนะนำให้รู้จักกับชาวนาผู้ค้นพบสมบัติหลัก — [peasant.GetWomanMan]ชื่อ [peasant.GetFirstName] — และตัวสมบัติเอง\n\n"
 governor_contract_event.2071.desc.byz: "มันคือหีบโบราณที่เต็มไปด้วย[Glossary( 'ออเรอี', 'AUREUS_GLOSS')]ทองคำ ซึ่งทั้งหมดถูกผลิตขึ้นในรัชสมัยของจักรพรรดิองค์เดียวกัน หากให้เดาอย่างมีหลักการ นี่อาจเป็นคลังสมบัติของกองทหารโบราณบางกอง บางทีอาจเป็นค่าจ้างทั้งปี"
 governor_contract_event.2071.desc.fallback: "มันคือหีบที่ดูเรียบง่าย ซึ่งเต็มไปด้วยเหรียญทองคำหลากหลายชนิดที่ผลิตขึ้นทั่วภูมิภาคในยุคต่างๆ ข้าเดาว่าชาวนาคงบังเอิญพบที่ซ่อนสมบัติที่ฝังไว้ของกลุ่มโจรที่ตายไปนานแล้ว"
 governor_contract_event.2071.desc.end: "\n\n[peasant.GetFirstNameNoTooltip] — และดูเหมือนทาสติดที่ดินทุกคนในชุมชนของ[peasant.GetHerHis] — เฝ้ามองอย่างคาดหวัง ลมหายใจติดขัด: "จะทำอย่างไรกับสมบัติ ท่าน[ROOT.Char.GetTitleAsName]ผู้ปรีชาญาณ?""
 governor_contract_event.2071.a: "นำทองคำไปลงทุนใหม่ในชุมชนของท่านเอง"
 governor_contract_event.2071.b: "กำไรพิเศษทั้งหมดต้องเสียภาษี #EMP อย่างหนัก.#!"
 governor_contract_event.2071.c: "สิ่งที่พบบนที่ดินสาธารณะเป็นของอาณาจักร"
 governor_contract_event.2071.d: "สมบัตินี้เป็นของท่านตามกฎหมายที่จะทำตามใจชอบ"
 governor_contract_event.2071.e: "สมบัตินี้เป็นของทั้งชุมชน"
 AUREUS_GLOSS: "ออเรียสเป็นเหรียญทองคำที่ออกเป็นประจำตั้งแต่สมัยสาธารณรัฐโรมันตอนปลายจนถึงต้นคริสต์ศตวรรษที่ 4 เมื่อถูกแทนที่ด้วยโซลิดัส เดิมที ออเรียสมีค่าเท่ากับ 25 เดนาริอุสเงิน แต่ เนื่องจากภาวะเงินเฟ้อที่รุนแรงของจักรวรรดิโรมันตอนปลาย โซลิดัสใหม่จึงมีค่าถึง 275,000 เดนาริอุส!"
 ep3_treasure_invest_modifier: "สมบัติที่ลงทุน"
 ep3_treasure_invest_modifier_desc: "ขุมทองคำได้ถูกเปลี่ยนเป็นการลงทุนในท้องถิ่น เพื่อประโยชน์ของทั้งเคาน์ตี"
 ep3_treasure_distributed_modifier: "สมบัติที่แจกจ่าย"
 ep3_treasure_distributed_modifier_desc: "ประชากรในท้องถิ่นได้รับความเจริญรุ่งเรืองจากการแจกจ่ายสมบัติที่ถูกค้นพบ"

 public_land: "ที่ดินสาธารณะ"
 public_land_contract: "$public_land$"
 public_land_desc: "ด้วยการเพิกเฉยต่อสิทธิตามประเพณีของสามัญชนอย่างโจ่งแจ้ง ผู้มีอิทธิพลในท้องถิ่นกำลังกักตุนที่ดินอย่างผิดกฎหมาย"
 public_land_desc_title: "$task_contract_governance_desc_title$"
 governor_contract_event.2080.t: "$public_land$"
 governor_contract_event.2080.desc: "ตามรายงานจาก [ongoing_destination.GetName] ผู้มีอิทธิพลในท้องถิ่น [magnate.GetTitledFirstName] ได้ใช้ทุกวิถีทางเพื่อขยายขอบเขตที่ดินที่[magnate.GetSheHe]เป็นเจ้าของโดยตรง\n\nเห็นได้ชัดว่าไม่ใช่ทุกวิธีดังกล่าวจะถูกกฎหมาย และบางวิธีก็ #EMP น่ารังเกียจ#! อย่างชัดเจน"
 governor_contract_event.2080.a: "ข้าควรเข้าแทรกแซง"
 governor_contract_event.2081.desc: "เมื่อข้ามาถึง [ongoing_destination.GetName] ข้าได้รับการต้อนรับทันทีโดย [magnate.GetTitledFirstName] ในคฤหาสน์[magnate.GetHerHis]\n\n"อย่าพูดเรื่องไร้สาระเลย" ข้าเปิดประเด็นอย่างเคร่งขรึม "ความผิดปกติและข้อตกลงที่ผิดกฎหมายจำนวนมากปรากฏขึ้นเมื่อพิจารณาการได้มา ซึ่งที่ดินล่าสุดของท่านอย่างใกล้ชิด"\n\n[magnate.GetFirstNameNoTooltip] ดูอาย แต่ไม่สำนึกผิด "#EMP สหายที่ดีของข้า#! ท่านก็รู้ว่าเรื่องเหล่านี้เป็นอย่างไร... มีระบบราชการมากมาย และชาวนาที่ไม่ได้รับการศึกษาก็ช่างไม่รู้เรื่องและเข้าใจกฎหมายช้าเหลือเกิน บางครั้งคนเราก็อยากจะเห็นธุรกิจของตนสำเร็จลุล่วงอย่างรวดเร็ว! ท่านจะตำหนิข้าในเรื่องนี้ได้หรือ?""
 governor_contract_event.2081.a: "ที่ดินจะถูกแบ่งให้แก่เจ้าของที่ดินรายย่อย"
 governor_contract_event.2081.b: "$ep3_land_confiscate_modifier_desc$"
 governor_contract_event.2081.c: "ข้าอาจลืมอุบัติเหตุนี้ได้หากมีการ #EMP บริจาค#! ที่เหมาะสม..."
 governor_contract_event.2081.d: "แสร้งทำเป็นว่าเรื่องนี้ไม่เคยเกิดขึ้น #EMP สหาย#!!"
 governor_contract_event.2081.e: "เก็บที่ดินไว้ แต่ให้คนท้องถิ่นเพาะปลูก"
 ep3_lands_reinstated_modifier: "เจ้าของที่ดินรายย่อย"
 ep3_lands_reinstated_modifier_desc: "การมีอยู่ของเจ้าของที่ดินรายย่อยได้รับการฟื้นฟูในพื้นที่"
 ep3_land_confiscate_modifier: "ที่ดินที่ถูกยึด"
 ep3_land_confiscate_modifier_desc: "นี่คือจุดที่สมบูรณ์แบบในการขยายที่ดินของข้า!"

 mad_prophet: "ศาสดาพยากรณ์วิปลาส"
 mad_prophet_contract: "$mad_prophet$"
 mad_prophet_desc: "ศาสดาพยากรณ์ที่ประกาศตนเองกำลังสร้างความหวาดกลัวไปทั่วทั้งเคาน์ตีด้วยคำทำนายวันสิ้นโลก"
 mad_prophet_desc_title: "$task_contract_governance_desc_title$"
 governor_contract_event.2090.t: "$mad_prophet$"
 governor_contract_event.2090.desc: "ข้าได้รับข่าวที่น่าหนักใจจาก [ongoing_destination.GetName]\n\nปรากฏว่า [ongoing_destination.GetTitle.GetTierAsNameNoTooltip|l] กำลังอยู่ในความโกลาหล เนื่องจากศาสดาพยากรณ์ที่ประกาศตนเองบางคนกำลังแพร่กระจายความตื่นตระหนกด้วยคำทำนายที่น่าตกใจเกี่ยวกับความใกล้เข้ามาของวันสิ้นโลก\n\nเป็นไปได้มากว่านี่เป็นเพียงคำพูดเพ้อเจ้อของคนบ้า แต่เมื่อคำพูดเพ้อเจ้อเหล่านี้เป็นอันตรายต่อความมั่นคงและความสงบเรียบร้อยของประชาชน ก็เป็นหน้าที่ของข้าที่จะต้องเข้าแทรกแซง"
 governor_contract_event.2090.a: "ข้าต้องสืบสวนสถานการณ์"
 governor_contract_event.2091.desc: ""#EMP จุดจบใกล้เข้ามาแล้ว! จงสำนึกผิด! สำนึกผิดเดี๋ยวนี้ มิฉะนั้นจะถูกลงทัณฑ์!#!"\n\nเมื่อข้ามาถึง [ongoing_destination.GetName] ข้าก็พบศาสดาพยากรณ์ได้อย่างง่ายดาย ข้าผลักฝูงทาสติดที่ดินที่ทั้งทึ่งและงุนงงออกไป ตามเสียงกรีดร้องไปยังต้นตอ\n\n[prophet.GetWomanMan]ในชุดผ้าขี้ริ้วตำหนิฝูงชนที่ไม่สบายใจและหวาดกลัวด้วยความโกรธเกรี้ยวที่ได้รับแรงบันดาลใจจากสวรรค์ คำพูดของ[prophet.GetNamePossessive] ทำให้ความสงสัยในสิ่งที่ไม่รู้จักของพวกเขากลายเป็นจริง [prophet.GetSheHe]พูดถึงความกลัวความโกลาหล ความหวาดกลัวต่อ[prophet.GetFaith.NegativeAfterLife] และความเชื่อร่วมกันของเราเกี่ยวกับจุดจบของทุกสิ่ง"
 governor_contract_event.2091.a: "ทุกอย่างอยู่ภายใต้การควบคุม!"
 governor_contract_event.2091.a.tt: "อำนาจ วาทศิลป์อันเชี่ยวชาญ และการปรากฏตัวที่สงบของท่านสามารถควบคุมฝูงชนได้"
 governor_contract_event.2091.b: "เราต้องปิดปาก[prophet.GetHerHim]"
 governor_contract_event.2091.c: "ทหาร จับกุมผู้ก่อปัญหา"
 governor_contract_event.2091.d: "เจ้าคิดผิด [prophet.GetFirstNameNoTooltip] และข้าจะพิสูจน์ให้เจ้าเห็น!"
 governor_contract_event.2091.e: "มีเพียงการสวดภาวนาเท่านั้นที่จะช่วยเราได้"
 governor_contract_event.2091.e.tt: "ท่านจัดขบวนแห่ทางศาสนาครั้งใหญ่"
 governor_contract_event.2091.f: "นักบวชท้องถิ่นจัดการเรื่องนี้ได้"
 governor_contract_event.2092.desc_persecute: "ข้ายินดีที่สังเกตเห็นว่าทหารของข้าประสบความสำเร็จในการสลายฝูงชนและยุติเรื่องไร้สาระทั้งหมดนี้\n\nพลเมืองของ [ongoing_destination.GetName] สามารถวางใจได้ว่าพวกเขาอาศัยอยู่ในจักรวรรดิที่เจริญแล้ว อุทิศตน และแข็งแกร่ง ปลอดจากความเชื่องมงายและปลอดภัยจากความไม่สงบ!"
 governor_contract_event.2092.desc_debate: ""... และนี่พิสูจน์ได้อย่างชัดเจนว่าจุดจบ #EMP ยังไม่#! ใกล้เข้ามาเลย และพระพิโรธของ[ROOT.Char.GetFaith.HighGodNamePossessive] #EMP ไม่ได้#! อยู่เหนือเรา"\n\nศาสดาพยากรณ์พูดไม่ออกเมื่อได้ฟังวาทกรรมอันทรงภูมิของข้า ฝูงชนปรบมือ ชื่นชมการโต้วาทีทางศาสนาที่ดี ก่อนจะกลับบ้าน"
 governor_contract_event.2092.a: "ข้าชอบงานที่ทำสำเร็จลุล่วง!"
 governor_contract_event.2093.desc_persecute: "น่าเสียดาย การส่งทหารเข้าไปไม่ใช่ทางเลือกที่ถูกต้อง\n\nประชากรที่หวาดกลัวรวมตัวกันรอบๆ ศาสดาพยากรณ์เพื่อปกป้อง[prophet.GetHerHim] และหลายคน — ทั้งทหารและพลเรือน — ได้รับบาดเจ็บจากการทะเลาะวิวาทที่ตามมา\n\nศาสดาพยากรณ์ผู้ก่อปัญหาหนีรอดจากความโกลาหลและหายตัวไปอย่างไร้ร่องรอย"
 governor_contract_event.2093.desc_debate: ""ดังนั้น โดยธรรมชาติของ[ROOT.Char.GetFaith.HighGodName]... ไม่ใช่สิ — คำนั้นคือ #EMP สาระสำคัญ#! ใช่ไหม? หรือว่าเป็นพลังงาน? อย่างไรก็ตาม สิ่งที่เป็นอยู่ย่อมไม่อาจไม่เป็นอยู่ได้ หรืออะไรทำนองนั้น..."\n\nข้าไม่จำเป็นต้องเห็นความสับสนบนใบหน้าของผู้คนตรงหน้าข้า หรือได้ยินเสียงหัวเราะคิกคักจากคู่ต่อสู้ของข้า ก็รู้ว่าข้าทำตัวเองให้เป็นตัวตลกเท่านั้น\n\nข้าแน่ใจว่าคนท้องถิ่นจะจัดการปัญหานี้ด้วยตนเอง ข้ากำลังจะไป"
 governor_contract_event.2093.a: "การแสดงที่น่าอับอาย"
 ep3_religiously_pacified_modifier: "สงบทางศาสนา"
 ep3_religiously_pacified_modifier_desc: "ศรัทธาและความไว้วางใจของประชากรในท้องถิ่นต่อสถาบันต่างๆ ได้รับการเสริมสร้างความเข้มแข็งจากการแทรกแซงที่มีประสิทธิภาพต่อต้านลัทธิวันสิ้นโลกที่กำลังก่อตัว"
 ep3_doom_repressed_modifier: "ลัทธิของศาสดาพยากรณ์ถูกกดขี่"
 ep3_doom_repressed_modifier_desc: "ลัทธิวันสิ้นโลกที่นำโดยศาสดาพยากรณ์วิปลาสถูกกำจัดโดยใช้กำลัง"
 ep3_religious_debate_modifier: "ชนะการโต้วาทีทางศาสนา"
 ep3_religious_debate_modifier_desc: "ตัวละครนี้โดดเด่นในการโต้วาทีทางศาสนากับศาสดาพยากรณ์วิปลาส แสดงให้ผู้คนเห็นถึงความผิดในแนวทางของพวกเขา"

 titles_sale: "ขายตำแหน่ง"
 titles_sale_contract: "$titles_sale$"
 titles_sale_desc: "มีรายงานว่านักบวชคนหนึ่งกำลังขายตำแหน่งและสำนักงานทางศาสนาให้กับผู้ที่เสนอราคาสูงสุด เป็นการกระทำที่ผิดกฎหมายอย่างยิ่ง"
 titles_sale_desc_title: "$task_contract_governance_desc_title$"
 governor_contract_event.2100.t: "$titles_sale$"
 governor_contract_event.2100.desc: "คดีที่ข้าถูกขอให้ตัดสินในวันนี้ค่อนข้างละเอียดอ่อน: [priest.GetFaith.PriestNeuter]ท้องถิ่นคนหนึ่งถูกจับได้ว่าเสนอตำแหน่งและสำนักงานทางศาสนาให้กับบุตรหลานที่ไม่มีคุณสมบัติของผู้มีชื่อเสียงในท้องถิ่น\n\n[priest.GetWomanMan]ผู้นี้ [priest.GetName] เติมกระเป๋า[priest.GetHerHis]ด้วยค่าใช้จ่ายของ[priest.GetFaith.HighGodNamePossessive]และผู้บังคับบัญชา[priest.GetHerHis]\n\nการปฏิบัตินี้ — เห็นได้ชัดว่า — ผิดกฎหมายอย่างยิ่ง เนื่องจากลักษณะทางศาสนาของอาชญากรรมและของฝ่ายที่เกี่ยวข้อง จึงค่อนข้างเป็นที่ถกเถียงกัน มีความเสี่ยงสูงที่การแทรกแซงที่จำเป็นของข้าในกิจการของพวกเขาจะ ทำให้นักบวชไม่พอใจ"
 governor_contract_event.2100.a: "ทองคำควรบริจาคให้กับสถาบันทางศาสนา"
 governor_contract_event.2100.b: "ทองคำที่ได้มาโดยผิดกฎหมายจะถูกยึด ณ บัดนี้"
 governor_contract_event.2100.c: "สำนึกผิด! และคืนเงินให้กับผู้ซื้อของเจ้า"
 governor_contract_event.2100.d: "ข้าต้องการความช่วยเหลือจากคน เช่นเจ้า..."
 ep3_repayed_church_titles_modifier: "ทองคำที่นำไปใช้ใหม่"
 ep3_repayed_church_titles_modifier_desc: "ทองคำที่สะสมจากการขายตำแหน่งทางศาสนาอย่างผิดกฎหมายได้ถูกนำไปใช้ประโยชน์โดยเจ้าของทางศาสนาที่ถูกต้องตามกฎหมาย"

 hungry_times: "ช่วงเวลาอดอยาก"
 hungry_times_contract: "$hungry_times$"
 hungry_times_desc: "โรคระบาดล่าสุด ทำให้เกิดความอดอยาก ซึ่งผลักดันให้คนท้องถิ่นบางส่วนใช้มาตรการ #EMP สิ้นหวัง#! เพื่อความอยู่รอด"
 hungry_times_desc_title: "$task_contract_governance_desc_title$"
 governor_contract_event.2110.t: "$hungry_times$"
 governor_contract_event.2110.desc: "ข่าวจาก [ongoing_destination.GetName] น่าหนักใจเป็นพิเศษ\n\nมาตรการของรัฐบาลในการช่วยเหลือพื้นที่หลังเกิดโรคระบาดล่าสุดดูเหมือนจะไม่เพียงพอ ความอดอยากได้เกิดขึ้นในชุมชนท้องถิ่น ชาวเมืองบางคนถูกผลักดันให้ปฏิบัติอย่างสิ้นหวังและน่ารังเกียจเพื่อความอยู่รอด"
 governor_contract_event.2110.desc_murder: "\n\nตามรายงานนี้ ชาวนาหลายคนถูกจับได้ว่าฆ่าและชำแหละเพื่อนมนุษย์เพื่อกินเนื้อของพวกเขา!"
 governor_contract_event.2110.desc_cannibal: "\n\nตามรายงานนี้ ชาวนาหลายคนถูกจับได้ว่ากินเนื้อของเพื่อนมนุษย์ที่เสียชีวิตจากความอดอยาก!"
 governor_contract_event.2110.desc_animal: "\n\nตามรายงานนี้ ชาวนาหลายคนถูกจับได้ว่าฆ่าและบริโภคสัตว์ที่ไม่สะอาดทางศาสนา ซึ่งดึงดูดความโกรธเคืองของนักบวชท้องถิ่น"
 governor_contract_event.2110.a: "ข้าต้องได้ยินเรื่องนี้เพิ่มเติม"
 governor_contract_event.2111.desc: "เมื่อข้าไปถึง [ongoing_destination.GetName] ผู้ถูกกล่าวหารออยู่ในโซ่ตรวน สายตาของพวกเขาก้มต่ำ เสื้อผ้าของพวกเขาฉีกขาดและเปื้อนเลือด\n\nจำเลย นำโดย [cannibal.GetFirstName] ถูกล่ามโซ่และตัวสั่น สายตาก้มต่ำ ถูกฝูงชนหน้าตาซูบผอมตะโกนใส่ กำปั้นผอมๆ ถูกชูขึ้น เสียงแหบแห้งตะโกนเรียกร้องการลงโทษที่เป็นเยี่ยงอย่าง\n\nข้าได้เห็นหลักฐาน... กระดูกโคนขาที่แตกและหัวที่เน่าเปื่อยและถูกตัดขาด มีบางสิ่งที่น่าสยดสยองเกิดขึ้นที่นี่ มันเป็นสิ่งที่น่ารังเกียจอย่างแท้จริงต่อหน้า[ROOT.Char.GetFaith.HighGodName]"
 governor_contract_event.2111.a: "ข้าไม่ควรทิ้งชุมชนนี้ไว้ตามลำพังเลย"
 governor_contract_event.2111.b: "อาชญากรรมที่สิ้นหวังที่สุดเรียกร้องการให้อภัยที่ยิ่งใหญ่ที่สุด"
 governor_contract_event.2111.c: "ผู้กระทำผิดจะต้องชดใช้ กฎหมายกล่าวไว้ เช่นนั้น"
 governor_contract_event.2111.d: "ทั้งชุมชนแปดเปื้อนไปด้วยความน่ารังเกียจนี้!"
 governor_contract_event.2111.e: "อาชญากรรมที่ชั่วร้าย เช่นนี้สมควรได้รับความสนใจอย่างเต็มที่จากข้า"
 ep3_rebuild_effort_modifier: "ความพยายามในการฟื้นฟูร่วมกัน"
 ep3_rebuild_effort_modifier_desc: "ผู้ว่าการท้องถิ่นกำลังมุ่งเน้นไปที่การฟื้นฟูพื้นที่นี้หลังจากได้รับผลกระทบอย่างหนักจากโรคระบาด"
 ep3_tight_control_modifier: "การควบคุมอย่างเข้มงวด"
 ep3_tight_control_modifier_desc: "เหตุการณ์ #EMP โชคร้าย#! บางอย่างในเคาน์ตีนี้บังคับให้ผู้ว่าการต้องนำทั้งหมดมาอยู่ภายใต้การสังเกตการณ์พิเศษ"

 wartime_measures: "มาตรการยามสงคราม"
 wartime_measures_contract: "$wartime_measures$"
 wartime_measures_desc: "เจ้าเหนือหัวของข้ากำลังทำสงคราม คำขออย่างเป็นทางการเพิ่งมาถึงข้าจากเมืองหลวง: ให้การสนับสนุนที่เป็นไปได้ทั้งหมดแก่กองทหารที่ผ่านไป"
 wartime_measures_desc_title: "$task_contract_governance_desc_title$"
 governor_contract_event.2120.t: "$wartime_measures$"
 governor_contract_event.2120.desc: "จดหมายที่ดูเป็นทางการ ประทับตราของ[ROOT.Char.GetLiege.GetTitleAsNameNoTooltip] [ROOT.Char.GetLiege.GetHerselfHimself] รออยู่ในสำนักงานของข้าวันนี้:\n\n"กองทัพอันไร้เทียมทานของ[ROOT.Char.GetLiege.GetPrimaryTitle.GetBaseNameNoTier]ของเรากำลังเคลื่อนทัพต่อต้านศัตรูที่น่ารังเกียจ และหากกองทหารฝ่ายเราข้ามเข้ามาในดินแดนที่มอบหมายให้ท่านปกครอง ท่านได้รับคำสั่งให้จัดหาความสะดวกสบายและการสนับสนุนที่เหมาะสมทั้งหมด\n\nในช่วงเวลาแห่งความยากลำบากนี้ [ROOT.Char.GetLiege.GetTitleAsNameNoTooltip]ทรงซาบซึ้งอย่างยิ่งต่อการเสียสละของอาสาสมัครชาว[ROOT.Char.GetLiege.GetCulture.GetName]ของ[ROOT.Char.GetLiege.GetHerHis]""
 governor_contract_event.2120.a: "โดยธรรมชาติแล้ว เราจะให้การสนับสนุนอย่างเต็มที่!"
 governor_contract_event.2120.b: "เสบียงของเราพร้อมให้บริการแก่[ROOT.Char.GetLiege.GetTitleAsNamePossessiveNoTooltip]"
 governor_contract_event.2120.c: "เราจะจัดหาที่พักให้กองทหาร"
 governor_contract_event.2120.d: "ข้าแน่ใจว่าทองคำบางส่วนจะช่วยได้"
 governor_contract_event.2120.e: "หน่วยสอดแนมของเราจะสนับสนุนความพยายามทางทหาร"
 governor_contract_event.2120.f: "การสนับสนุนประชาชนของเราในช่วงสงครามสำคัญกว่า"
 ep3_war_support_modifier: "การสนับสนุนสงคราม"
 ep3_war_support_modifier_desc: "ไม่มีความพยายามใดถูกละเลยในเคาน์ตีนี้เพื่อสนับสนุนสงครามของเจ้าเหนือหัว"
 ep3_war_supplies_modifier: "เสบียงสงคราม"
 ep3_war_supplies_modifier_desc: "เคาน์ตีนี้กำลังส่งทรัพยากรทั้งหมดเพื่อสนับสนุนกองทหารที่เดินทางผ่าน"
 ep3_war_lodgings_modifier: "ที่พักยามสงคราม"
 ep3_war_lodgings_modifier_desc: "เคาน์ตีนี้กำลังดูแลให้กองทหารพันธมิตรได้รับการดูแลอย่างดี"
 ep3_war_lookout_modifier: "หน่วยสอดแนมยามสงคราม"
 ep3_war_lookout_modifier_desc: "ระบบหน่วยสอดแนมที่เป็นระเบียบปกป้องเคาน์ตีนี้"
 ep3_war_compensations_modifier: "การชดเชยสงคราม"
 ep3_war_compensations_modifier_desc: "เคาน์ตีนี้ได้รับการสนับสนุนเฉพาะ เพื่อให้เจริญรุ่งเรืองต่อไปแม้จะมีสงครามใดๆ เกิดขึ้น"
 
