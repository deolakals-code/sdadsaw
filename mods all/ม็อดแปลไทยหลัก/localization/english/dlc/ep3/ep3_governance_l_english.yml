 ep3_governance_tax_relief: "การลดหย่อนภาษี"
 ep3_governance_tax_relief_desc: "เคาน์ตีนี้ได้รับการลดหย่อนภาษีจากผู้ว่าการภูมิภาค ซึ่งเป็นที่พอใจอย่างยิ่งของประชากรในท้องถิ่น"
 ep3_governance_stationed_troops: "กองทหารรักษาการณ์เสริมกำลัง"
 ep3_governance_stationed_troops_desc: "ตามคำสั่งของผู้ว่าการ ที่ดินผืนนี้มีกองทหารรักษาการณ์เสริมกำลังเพื่อสร้างสภาพแวดล้อมที่มีประสิทธิผล"
 ep3_governance_festivities: "งานรื่นเริงที่จัดขึ้น"
 ep3_governance_festivities_desc: "เจ้าหน้าที่ท้องถิ่นคนหนึ่งถูก #EMP โน้มน้าว#! ให้จัดงานออกร้านและเทศกาลต่างๆ"
 ep3_governance_infrastructure: "โครงสร้างพื้นฐานที่ปรับปรุงแล้ว"
 ep3_governance_infrastructure_desc: "เจ้าหน้าที่ท้องถิ่นได้ใช้เงินทุนจำนวนมากเพื่อปรับปรุงโครงสร้างพื้นฐานของพื้นที่"
 ep3_governance_harvest: "การแจกจ่ายธัญพืช"
 ep3_governance_harvest_desc: "เคาน์ตีนี้ได้รับประโยชน์จากการแจกจ่ายธัญพืชให้กับประชาชน ตามคำสั่งของผู้ว่าการท้องถิ่น"
 ep3_governance_great_harvest: "การแจกจ่ายธัญพืชครั้งใหญ่"
 ep3_governance_great_harvest_desc: "เคาน์ตีนี้ได้รับประโยชน์จากการแจกจ่ายธัญพืชจำนวนมาก ซึ่งจัดโดยผู้ว่าการท้องถิ่น"
 ep3_governance_mercenary_troops: "กองทหารรับจ้าง"
 ep3_governance_mercenary_troops_desc: "ตัวละครนี้ได้คัดเลือกอดีตโจรจำนวนหนึ่งมาเป็นทหารรับจ้าง แม้ว่าคนอื่นอาจจะคิด อย่างไรก็ตาม"
 ep3_governance_workforce: "แรงงานเกณฑ์"
 ep3_governance_workforce_desc: "เคาน์ตีนี้มีผู้คนจำนวนมากถูกเกณฑ์เข้าเป็นแรงงานรับใช้ชุมชน"
 ep3_governance_rampant_bandits: "โจรชุกชุม"
 ep3_governance_rampant_bandits_desc: "เคาน์ตีนี้ถูกรบกวนโดยโจร ผู้โจมตีที่รุนแรงต่อนักเดินทางและพ่อค้าเป็นเรื่องปกติ"
 
