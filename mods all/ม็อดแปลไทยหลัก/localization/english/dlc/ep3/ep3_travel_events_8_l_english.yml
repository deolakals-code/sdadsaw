l_english: 

 ep3_travel_events.8000.t: "การเป็นส่วนหนึ่งของที่ใดสักแห่ง"
 ep3_travel_events.8000.desc.intro: "นับตั้งแต่การพบกันโดยบังเอิญที่[location.GetName] [romantic_child.GetName] [ROOT.Char.Custom2('RelationToMeShort', romantic_child)]ที่รักของข้า และ[prospective_prince.GetName]ก็แทบไม่เคยแยกจากกันเลย [prospective_prince.Custom('GetDaughterSon')]ของ[prince_parent.GetTitleAsNamePossessiveNoTooltip|U]นั้นเมามัวไปด้วยความหลงใหล เป็นการเกี้ยวพาราสีที่น่าชมเชย แต่เราต้องเดินทางต่อไป และในไม่ช้าพวกเขาก็จะต้องแยกจากกัน\n\n"โอ้ [ROOT.Char.GetMotherFather]"
 ep3_travel_events.8000.desc.mid2.bold_child: "ข้าเหนื่อยหน่ายกับการเดินทางเหลือเกิน ข้าปรารถนาจะอยู่ที่นี่กับ[prospective_prince.GetNameNoTooltip]!""
 ep3_travel_events.8000.desc.mid2.timid_child: "ข้ารู้สึกว่าข้าอาจจะไม่ได้พบ[prospective_prince.GetWomanMan] เช่น[prospective_prince.GetHerHim]อีกแล้ว ท่านคิดว่าวันหนึ่งเราอาจจะตั้งรกรากและหยั่งรากของเราเองได้หรือไม่?""
 ep3_travel_events.8000.outro.dislikes_child: "\n\nนี่อาจเป็นโอกาสเดียวของข้าที่จะทิ้งปลิงตัวนี้ไปให้พ้นๆ เสียที"
 ep3_travel_events.8000.outro: "\n\nข้าเห็นความเจ็บปวดฉายชัดบนใบหน้าของ[romantic_child.GetHerHis]และอดสงสัยไม่ได้ว่าที่ของ[romantic_child.GetHerHis]ยังคงอยู่กับข้าอีกต่อไปจริงหรือ"
 ep3_travel_events.8000.a: ""ที่ของเจ้าคืออยู่กับ [prospective_prince.GetFirstNameNoTooltip] ไม่ใช่ [ROOT.Char.Custom2('InsultNoun', ROOT.Char)] แก่ ๆ ที่น่าขบขัน เช่นข้า""
 ep3_travel_events.8000.b: ""[prospective_prince.GetFirstNameNoTooltip|U]ก็แค่มากับเราสิ!""
 ep3_travel_events.8000.c: ""มาเถอะน่า [romantic_child.GetFirstNameNoTooltip]""
 ep3_travel_events.8001.t: "รากเหง้าของข้าเอง"
 ep3_travel_events.8001.desc: "[prospective_prince.Custom2('MyCharacterIntroduction', ROOT.Char )|U]กลับบ้านจากการเดินเล่นพร้อมกับ[romantic_child.GetWomanMan]สาว/หนุ่มแปลกหน้าที่ควงแขนอยู่กับ[prospective_prince.GetHerHis] สิ่งมีชีวิตนี้เห็นได้ชัดว่าไม่เรียบร้อยและอ่อนล้าจากการเดินทาง มีดินเปรอะเปื้อนเสื้อผ้าธรรมดาๆ ของ[romantic_child.GetHerHis]\n\n"[ROOT.Char.GetMotherFather|U]! นี่คือ[romantic_child.GetFirstName] [romantic_child.Custom('GetDaughterSon')]ของ[laamp.GetName] นักผจญภัยชื่อดัง [romantic_child.GetSheHe|U]ยังเป็น[romantic_child.GetWomanMan]ที่ข้าตกหลุมรักด้วย และหากท่านให้พร เราก็จะ แต่งงานกัน!""
 ep3_travel_events.8001.a: ""เจ้าได้รับพรจากข้า""
 ep3_travel_events.8001.b: ""ไม่ได้เด็ดขาด!""
 ep3_travel_events.8002.t: "ในอีกเวลาหนึ่ง"
 ep3_travel_events.8002.desc: "ทันทีที่เสบียงสุดท้ายของเราถูกเก็บและเราเตรียมพร้อมที่จะออกเดินทางบนถนนที่ไม่มีที่สิ้นสุดอีกครั้ง ข้าก็ถูกหยุดโดยเสียงร้องไห้อย่างสิ้นหวังของ[romantic_child.Custom('GetDaughterSon')]ของข้า เมื่อ[romantic_child.GetSheHe]มาถึงข้าในที่สุด ข้าก็ถูกกอดแน่น ดูเหมือนว่า[prince_parent.GetName]ไม่ได้ให้พรแก่การ แต่งงานครั้งนี้ และ[romantic_child.GetName]ก็กลับมาร่วมเดินทางกับข้า"
 ep3_travel_events.8002.a: ""โอ๋ๆ ไม่เป็นไรนะ""
 ep3_travel_events.8010.t: "คงไม่มีใครคิดถึง"
 ep3_travel_events.8010.desc: "ขณะที่เราเดินทางผ่าน[location.GetName] สายตาของข้าก็เหลือบไปเห็นสุสานที่ตก แต่งอย่างวิจิตรบรรจงท่ามกลางกลุ่มหลุมศพธรรมดา สุสานดูเหมือนจะแตกเปิดออก และภายในปากทางเข้า ข้าเห็นแสงแวววาวของสมบัติที่ไม่รู้จักบางอย่าง\n\nไม่มีใครอยู่รอบๆ นอกจากคณะเดินทางของข้า และแน่นอนว่าใครก็ตามที่เคยเป็นเจ้าของสิ่งของในสุสานนี้คงไม่ตัดสินข้าที่หยิบฉวยสิ่งที่ มิฉะนั้นก็จะถูกทิ้งไว้โดยเปล่าประโยชน์?"
 ep3_travel_events.8010.a: "ข้ามั่นใจว่าคงไม่มีใครสังเกตเห็น"
 ep3_travel_events.8010.a.win: "ท่านขโมยของในสุสานบางส่วนไปโดยไม่มีใครขัดขวาง"
 ep3_travel_events.8010.a.lose: "คณะเดินทางของท่านถูกจับได้"
 ep3_travel_events.8010.b: "ข้าจะไม่ลบหลู่ผู้ตาย!"
