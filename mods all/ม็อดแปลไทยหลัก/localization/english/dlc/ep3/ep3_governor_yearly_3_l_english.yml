ep3_governor_yearly.3080.t: "ถูกยึดครองโดย [root_capital.GetTerrain.GetNameNoTooltip]"
ep3_governor_yearly.3080.t_sea: "ถูกยึดครองโดยทะเล"
ep3_governor_yearly.3080.intro: "การเดินทางหลายวันแยก [root_capital.GetName] กองบัญชาการของข้า ออกจาก [liege.GetCapitalLocation.GetTitle.GetNameNoTier]"
 ep3_governor_yearly.3080.desc_faction: "อย่างไรก็ตาม รายงานของข้าเกี่ยวกับการรวมตัวของ [rebel_faction.GetName] ควรจะไปถึง [liege.GetTitledFirstName] นานแล้ว!\n\n"กองทัพทั้งหมดของเมืองหลวงและไม่มีทหารสำรองแม้ แต่คนเดียว..." [captain.GetName] นายทหารของข้า กังวล "ไม่มีทหารคนใดเล็ดลอดผ่านพวกกบฏไปได้ทั้งเป็น..."\n\nในตำแหน่งที่ห่างไกลของข้า ไฟแห่งความไม่สงบกำลังคุกรุ่น และหากไม่มีกองทหารใหม่ พวกมันก็มี แต่จะลุกโชนยิ่งขึ้น"
ep3_governor_yearly.3080.desc: "ข้ารอคอยการมาถึงของสินค้าฟุ่มเฟือย เงินเดือน ที่จำเป็นต่อการรักษาความภักดีของ [ROOT.Char.GetPrimaryTitle.GetAdjective] มานานแล้ว แต่ไม่มีอะไรมาจาก [liege.GetTitledFirstName]\n\n"หายไปไหนสักแห่ง" นายทหารของข้า [captain.GetName] คาดเดา "ถูกโจรปล้น? ติดอยู่ในที่ทุรกันดาร? หรือบางที สินค้าถูกขายให้ชาวบ้าน?"\n\nไม่ว่ากรณีใด... ข้าแทบจะไม่สามารถบัญชาการความยิ่งใหญ่ของ [liege.GetPrimaryTitle.GetAdjective] ได้ในฐานะคนนอกคอกที่ยากจนในดินแดนอันห่างไกล"
ep3_governor_yearly.3080.a: "เราต้องค่อย ๆ สร้างความพอเพียง"
ep3_governor_yearly.3080.b: "[ROOT.Char.GetFaith.HighGodName] โปรดช่วยข้าออกจากตำแหน่งที่ #EMP ต้องสาป#! นี้ด้วยเถิด!"
ep3_governor_yearly.3080.c: "มาเถิด [captain.GetFirstNameNoTooltip]: เราจะจัดการกับพวกเขาเอง"
ep3_governor_yearly.3080.c.success: "พวกกบฏถูกปราบปราม"
ep3_governor_yearly.3080.c.fail: "ความสัมพันธ์ยังคง... ตึงเครียด"
ep3_governor_yearly.3080.c.crit_fail: "กองกำลังของท่านถูกซุ่มโจมตีและถูกทำลายล้าง"
ep3_governor_yearly.3080.d: "มาเถิด [captain.GetFirstNameNoTooltip]: เราจะกู้คืนสิ่งที่สูญเสียไป"
ep3_governor_yearly.3080.d.success: "เสบียงถูกยึดคืนอย่างรวดเร็ว"
ep3_governor_yearly.3080.d.fail: "ไม่พบสิ่งใด"
ep3_governor_yearly.3080.d.crit_fail: "การประหัตประหาร ความล้มเหลว... และยังคงไม่มีอะไร"
ep3_governor_yearly.3080.e: "ข้ามั่นใจว่าทุกอย่างจะ #EMP เรียบร้อยดี.#!"
ep3_anxious_for_new_assignment_modifier: "กระวนกระวายใจกับตำแหน่งใหม่"
ep3_anxious_for_new_assignment_modifier_desc: "ความปรารถนาอันแรงกล้าในชื่อเสียง อิทธิพล — อะไรก็ได้ที่ไม่ใช่ความสกปรกของการปกครอง — คือสิ่งที่บ่งบอกถึงข้าราชการผู้นี้\n[governor_efficiency|E]: @governor_efficiency!#N -5%#!"
ep3_invested_in_power_center_modifier: "การลงทุนที่เจริญรุ่งเรือง"
