msg_governor_supports_rule.desc: "[root_scope.GetName] ปกป้องท่านต่อสาธารณะจากผู้ที่พูดถึงความไม่ชอบธรรมของท่าน"

ep3_governor_yearly.3050.t: "หนึ่งในปิศาจชั้นผู้น้อยของ [ROOT.Char.GetFaith.NegativeAfterLife|U]"
ep3_governor_yearly.3050.desc: "ข่าวลือประหลาดแพร่สะพัดเกี่ยวกับ [emperor.FullNameNoTooltip] องค์ [emperor.GetTitleAsNameNoTooltip] ของเรา ผู้ ซึ่งกำลังสั่นคลอนอยู่บนขอบบัลลังก์ของ [emperor.GetHerHis]"

ep3_governor_yearly.3050.mess: "\n\nผู้ขายยาคนหนึ่งมาพูดถึง... มรดกที่ไม่บริสุทธิ์ที่พระราชวังมอบให้เขา ตาล็อบสเตอร์ เล็บเด็ก ยาปรุงจากแมนเดรกและยางสน — ทั้งหมด เพื่อให้ [emperor.GetTitleAsNameNoTooltip] บังคับใส่ปากที่พูดพล่ามของเขา! สัตว์ร้ายเดินโซเซไปมาในพระราชวัง เปลือยกาย ทาด้วยยาประหลาดของ [emperor.GetHerHis] และสาปแช่งพระนามของ [emperor.GetFaith.HighGodName]!"
ep3_governor_yearly.3050.shiftless: "\n\nคนรับใช้เหล่านั้นที่หนีจากการจ้างงานของ [emperor.GetHerHis] บรรยายถึงความรกรุงรังแบบทาร์ทาเรียน กลิ่นฉุนด้วยน้ำหอมเก่า... [emperor.GetTitleAsNameNoTooltip] นอนเป็นเวลานานในความมืด หมอบกราบอยู่ใต้ #EMP สิ่งมีชีวิต#! ที่พึมพำและมีแขนขาเรียวยาว เมื่อเสนาบดีของ [emperor.GetHerHis] เรียก [emperor.GetFirstNameNoTooltip] แทบไม่กระดิกตัว... แต่เมื่อปีศาจขยับริมฝีปากหนาของมัน [emperor.GetTitleAsNameNoTooltip] ก็กรีดร้องขอการผ่อนผัน ขอไวน์และเค้ก"
ep3_governor_yearly.3050.coward: "\n\nญาติของ [emperor.GetHerHis|U] เองกระซิบเรื่องเล่าของครอบครัวนี้ ในบ้านเกิดของพวกเขา หญิงศักดิ์สิทธิ์คนหนึ่งถูกข่มขืน และเมื่อถึงเวลาคลอด สิ่งที่หลั่งไหลออกมาไม่ใช่เด็ก แต่... #EMP กองหนอน!#! หนอนเหม็นเหล่านี้ตัวหนึ่งถูกหนูกิน หนูถูกนกนางนวลกิน และนกนางนวลถูก [emperor.GetFirstNameNoTooltip] กินเอง ตอนนี้ [emperor.GetTitleAsNameNoTooltip] ตัวสั่นและร้องไห้ — แม้ แต่กับเสียงร้องของหนูหริ่ง!"
ep3_governor_yearly.3050.cruel: "\n\nสตรีในครัวเรือนของ [emperor.GetHerHis] สาบานว่าเคยเห็น [emperor.GetHerHim] ในสวนตอนกลางคืน... #EMP ดื่มเลือดแมวจรจัด!#! ใต้ขนที่ขาดรุ่งริ่ง ซึ่งประดับมงกุฎ ใบหน้าที่โหดร้ายของ [emperor.GetFirstNamePossessiveNoTooltip] แยกเขี้ยวและถ่มเลือด [emperor.GetSheHe|U] จากนั้นก็หลบหนีไป — ถูกแบกข้ามกำแพงสวนโดยภูตผีปีกค้างคาวสองตน!"
ep3_governor_yearly.3050.generic_bad: "\n\nคนเลี้ยงม้าและสาวใช้กระซิบกันว่า [emperor.GetFirstNameNoTooltip] นั้น แท้จริงแล้ว #EMP ถือกำเนิดจากทวารหนักของ [ROOT.Char.GetFaith.DevilName]#! [emperor.GetTitleAsNameNoTooltip] เป็นชาว [ROOT.Char.GetFaith.NegativeAfterLife]! เจ้าคนหลอกลวงเหม็นเน่า คลานขึ้นมาจากหลุมบ่อต้องสาป เข้าไปในห้องบรรทมในวัง และที่นั่นก็สวมรอยเป็น [emperor.GetTitleAsNamePossessiveNoTooltip] ที่ชอบธรรมของเรา!"

ep3_governor_yearly.3050.outro: "\n\nข่าวร้าย เช่นนี้ไหลรินออกมาจากราชสำนักของ [emperor.GetFirstNamePossessiveNoTooltip] เสมอ"
ep3_governor_yearly.3050.a: "#EMP ปีศาจ!#!"
ep3_governor_yearly.3050.b: "ทำไมต้องตอบไอ้คนน่าสมเพชนี่.. และไม่ใช่ข้า?"
ep3_governor_yearly.3050.c: "#EMP เงียบ!#! ห้ามผู้ใดใส่ร้าย [emperor.GetTitleAsNameNoTooltip] ของข้า!"
 ep3_governor_yearly.3050.c.flavor: "จงรู้ไว้: ข้าถือว่าผู้ที่แพร่กระจายคำโกหกที่แปลกประหลาดเหล่านี้เป็นที่น่ารังเกียจอย่างยิ่ง!"
ep3_governor_yearly.3050.d: "ภัยพิบัติของหน้าที่คือผลประโยชน์ของนักการเมือง"

ep3_governor_yearly.3060.t: "พิธีราชาภิเษกอันรุ่งโรจน์"
ep3_governor_yearly.3060.t_regent: "การรับรองอันรุ่งโรจน์"
ep3_governor_yearly.3060.intro_regent: "การเมืองในวังเคลื่อนไปอย่างเชื่องช้า — ส่วนใหญ่เป็น เช่นนั้น [previous_holder.GetTitledFirstNameRegnal] ไม่ได้เป็นผู้ดูแล [emperor.GetPrimaryTitle.GetTierAsNameNoTooltip|l] อีกต่อไปแล้ว"
ep3_governor_yearly.3060.intro_usurper: "มงกุฎถูกฉีกออกจากพระนลาฏขององค์อธิปัตย์ของเรา — [previous_holder.GetTitledFirstNameRegnal] ไม่ได้ปกครอง [emperor.GetPrimaryTitle.GetTierAsName] อีกต่อไป"
ep3_governor_yearly.3060.intro_deceased: "ผู้พิทักษ์ของ [emperor.GetPrimaryTitle.GetTierAsName] ผู้เลี้ยงแกะและองค์อธิปัตย์ของเรา ได้จากโลกมนุษย์นี้ไปแล้ว [previous_holder.GetTitledFirstNameRegnal] สิ้นพระชนม์แล้ว"
ep3_governor_yearly.3060.desc_regent: "\n\nลึกเข้าไปในห้องโถงของพระราชวังจักรพรรดิแห่ง [emperor.GetCapitalLocation.GetTitle.GetNameNoTier] อำนาจของ [emperor.GetTitleAsNamePossessiveNoTooltip] องค์ใหม่ได้รับการยืนยันต่อหน้าเหล่าขุนนางที่มาชุมนุมกัน"
ep3_governor_yearly.3060.desc_afield: "\n\nตั้งค่ายอยู่ใน [emp_location.GetName] ท่ามกลางธงมาตรฐานอันสดใส [emperor.GetTitleAsNameNoTooltip] องค์ใหม่ถูกยกขึ้นบนโล่ขัดเงาอันยิ่งใหญ่"
ep3_governor_yearly.3060.desc_temple: "\n\nใน [emperor.GetFaith.HouseOfWorship] สูงสุดของ [emperor.GetCapitalLocation.GetTitle.GetNameNoTierPossessive] ท่ามกลางบุคคลสำคัญและเหล่านักบวชอาวุโส [emperor.GetTitleAsNameNoTooltip] องค์ใหม่ก็ได้รับการเปล่งเสียงสดุดีเป็นครั้งแรก"
ep3_governor_yearly.3060.desc_byzantine: "\n\n#EMP "ทรงพระเจริญ [emperor.GetFirstNameRegnal]!"#! ผู้ชุมนุมโห่ร้อง #EMP "โดยพระคุณของพระคริสต์ [emperor.GetTitleAsNameNoTooltip] ผู้ซื่อสัตย์ และ #EMP [Glossary( 'ออโตครากตอร์', 'AUTOKRATOR_GLOSS')]#! แห่งชาวโรมัน; ตระกูล [emperor.GetHouse.GetName] [Glossary( 'ออกุสตอส', 'AUGOUSTOS_GLOSS')]#! ตลอดกาล!"#!"
ep3_governor_yearly.3060.desc_byzantine_femme: "\n\n#EMP "ทรงพระเจริญ [emperor.GetFirstNameRegnal]!"#! ผู้ชุมนุมโห่ร้อง #EMP "โดยพระคุณของพระคริสต์ [emperor.GetTitleAsNameNoTooltip] ผู้ซื่อสัตย์ และ #EMP [Glossary( 'ออโตครากตอร์', 'AUTOKRATOR_GLOSS')]#! แห่งชาวโรมัน; ตระกูล [emperor.GetHouse.GetName] [Glossary( 'ออกุสตา', 'AUGOUSTUS_GLOSS')]#! ตลอดกาล!"#!"
AUGOUSTOS_GLOSS: "คำยกย่องหมายถึง \"น่าเคารพ\" หรือ \"สง่างาม\" มอบให้กับผู้สืบทอดของจักรพรรดิองค์แรกของโรม ในศตวรรษที่ 7 ตำแหน่งภาษากรีก Basileus เข้ามาแทนที่ในความสำคัญของจักรวรรดิ"
AUTOKRATOR_GLOSS: "ตำแหน่งภาษากรีกคลาสสิกหมายถึงผู้ที่บัญชาการโดยไม่มีผู้บังคับบัญชา ถูกนำกลับมาใช้ใหม่ในสมัยไบแซนไทน์ตอนกลางสำหรับจักรพรรดิอาวุโส"
ep3_governor_yearly.3060.desc_regent_acclaim: "\n\nตราประทับสีสันสดใสและลายเซ็นอันพิถีพิถันประทับลงบนเอกสารทางการอย่างรวดเร็ว #EMP "ด้วยเจตจำนงแห่ง [emperor.GetFaith.HighGodName] แห่ง [ceremonial_liege.GetTitledFirstName] [emperor.GetMotherFather] ของ [emperor.GetPrimaryTitle.GetNameNoTierNoTooltip]; ตระกูล [ceremonial_liege.GetHouse.GetName] ผู้[ceremonial_liege.Custom('FormalComplimentAdjective')]ที่สุด!#!""
ep3_governor_yearly.3060.desc_generic: "\n\n#EMP "ทรงพระเจริญ [emperor.GetFirstName]!"#! ผู้ชุมนุมโห่ร้อง #EMP "โดยพระประสงค์ของ [emperor.GetFaith.HighGodName] [emperor.GetTitleAsNameNoTooltip] ผู้ยิ่งใหญ่ และ [emperor.GetMotherFather] แห่ง [emperor.GetPrimaryTitle.GetNameNoTierNoTooltip]; ตระกูล [emperor.GetHouse.GetName] ผู้ [emperor.Custom('FormalComplimentAdjective')] ที่สุด!#!""
ep3_governor_yearly.3060.desc_regent_legit: "\n\nเหล่าไพร่ฟ้าข้าแผ่นดินของ[ceremonial_liege.GetHerHis|U]สวดภาวนา: #EMP "ขอ [emperor.GetTitledFirstName] ทรงคุ้มครองการปกครองของท่าน พิทักษ์รัชสมัยของฝ่าบาทไว้เสมอ และสันติสุขและความสงบเรียบร้อยของ [emperor.GetPrimaryTitle.GetTierAsNameNoTooltip|l]!"#!"
ep3_governor_yearly.3060.desc_high_legit: "\n\nราษฎรของ [emperor.GetHerHis|U] อธิษฐาน: #EMP "[ROOT.Char.GetFaith.random_GoodGodNames] โปรดรักษาการครองราชย์ของฝ่าบาทเสมอไป บัดนี้และตลอดกาล! ตราบชั่วนิรันดร์!"#!"
ep3_governor_yearly.3060.desc_medium_legit: "\n\nเหรียญแวววาวปลิวว่อนเหนือขบวนแห่อันรุ่งโรจน์! ผู้พิพากษาก้มคำนับต่อหน้า [emperor.GetTitledFirstNameNoTooltip]... เกรงกลัว หากยังไม่ภักดี"
ep3_governor_yearly.3060.desc_low_legit: "\n\nขณะที่พิธีกรรมอันน่าประจบสอพลอกำลังดำเนินไป เสียงกระซิบก็แพร่สะพัดไปทั่วอาณาจักร... ด้วยสิทธิ์อันใดที่ [emperor.GetTitleAsNameNoTooltip] ผู้[emperor.Custom2('InsultAdjective', ROOT.Char)]นี้ถึงได้ปกครอง?"
ep3_governor_yearly.3060.a: "บัดนี้ [emperor.Custom2('RelationToMeShort', SCOPE.sC('root_scope'))] ของ [emperor.GetTitleAsNamePossessiveNoTooltip] จะได้รับรางวัล!"
ep3_governor_yearly.3060.b: "ข้าต้องประณามระบอบการปกครองนี้!"
ep3_governor_yearly.3060.b.flavor: "และเตรียมพร้อมที่จะทำมากกว่าแค่ประณาม... ในเงามืด"
ep3_governor_yearly.3060.c: "ต่อสาธารณะ ข้าสนับสนุน [emperor.GetTitleAsNameNoTooltip] องค์ใหม่"
ep3_governor_yearly.3060.c.flavor_high_legit: "ใครจะทำอย่างอื่นได้ นอกจากนี้?"
ep3_governor_yearly.3060.c.flavor_low_legit: "แม้ว่ามันจะ ทำให้ข้าถูกเยาะเย้ยเท่านั้น"
ep3_governor_yearly.3060.c.flavor_regent: "ข้าเป็นใครถึงจะไปตั้งคำถามกับเจตจำนงของ [ceremonial_liege.GetTitleAsNamePossessiveNoTooltip]?"
ep3_governor_yearly.3060.c.flavor_med_legit: "ความจงรักภักดี เช่นนี้เป็นที่คาดหวัง"
ep3_governor_yearly.3060.d: "ข้ามีความคิดเห็นเพียงเล็กน้อยเกี่ยวกับเจ้าเหนือหัวองค์ใหม่ของข้า"
ep3_governor_yearly.3060.d.regent: "ข้ามีความเห็นเพียงน้อยนิดเกี่ยวกับผู้สำเร็จราชการคนใหม่"
admin_coronation_still_req_tt: "[emperor.GetShortUIName] ได้รับ [emperor.GetPrimaryTitle.GetName] แล้ว แต่ยังคงไว้ ซึ่ง [law_i][law|E] [GetLaw('uncrowned').GetName] จนกว่า[emperor.GetSheHe]จะจัด [coronation|E]"

