custom.every_vassal_same_domicile_location: "ทุก [vassal|E] เพื่อนร่วมชาติที่ใช้ตำแหน่ง [domicile|E] เดียวกับท่าน"

ep3_governor_yearly.3090.t: "หัวใจแห่ง [liege.GetPrimaryTitle.GetNameNoTierNoTooltip]"
ep3_governor_yearly.3090.desc: "ข้าเคยเห็นทหารเดินขบวนไปยังชายแดนอย่างหดหู่ เคยได้ยินข้าราชการที่หวาดกลัวตำแหน่งที่ห่างไกล คร่ำครวญถึงเพลงต่างชาติที่หยาบคายและอาหารเย็นที่จืดชืด...\n\nใน [root_capital.GetName] ไม่มีสิ่งใดเป็นเรื่องที่ข้ากังวล กิจการของ [liege.GetPrimaryTitle.GetTierAsName] เองไหลผ่าน"
ep3_governor_yearly.3090.landed: "[ROOT.Char.GetPrimaryTitle.GetTierAsName] ของข้า — เราค้าขายสินค้าของกษัตริย์ รักษาการติดต่อในพระราชวังของ [liege.GetTitleAsNamePossessive] และมีบทบาทสำคัญในการเมืองของอาณาจักร\n\nช่างดีเหลือเกินที่ได้รับใช้ ณ ใจกลางของหน่วยงานที่ยิ่งใหญ่และเจริญรุ่งเรืองนั้น"
ep3_governor_yearly.3090.unlanded: "ประตูที่ดินของข้า — เข้ามา แน่นอน ด้วยความสุภาพอันประณีตเท่านั้น ดังนั้น ญาติของข้าจึงไม่เคยห่างไกลจากธุรกิจของอาณาจักร\n\nช่างดีเหลือเกินที่ได้อาศัยอยู่ ณ ใจกลางของหน่วยงานที่ยิ่งใหญ่และเจริญรุ่งเรืองนั้น"
ep3_governor_yearly.3090.a: "ข้าสามารถเป็นนายหน้าเข้าถึงโถงแห่งอำนาจได้..."
ep3_governor_yearly.3090.a.flavor: "... แต่ผู้ที่มีเส้นสายน้อยกว่าต้องจ่ายราคาแพงให้ข้า"
ep3_governor_yearly.3090.b: "เป็นการฉลาดที่จะขยายการลงทุนในท้องถิ่นของเรา"
ep3_governor_yearly.3090.c: "ข้าอยู่ในอารมณ์อยากจัดงานเลี้ยงอาหารค่ำ!"
ep3_governor_yearly.3090.c.flavor: "กับแขกท้องถิ่นที่มีความสำคัญทางการเมือง แน่นอน!"

ep3_ignoring_realm_decline_modifier: "เพิกเฉยต่อปัญหาของอาณาจักร"
