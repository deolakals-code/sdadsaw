ep3_governor_yearly_3050_factions_emp_tooltip: "[vassals|E] อื่น ๆ มีแนวโน้มที่จะเข้าร่วม [factions|E] ที่รวม [root_scope.GetShortUIName] มากขึ้น"
msg_governor_challenging_illegitimacy.t: "[root_scope.GetTitleAsNameNoTooltip] ผู้ไม่ภักดีรวบรวมการสนับสนุน"
msg_governor_challenging_illegitimacy.desc: "[root_scope.GetName] และผู้สนับสนุนของ [root_scope.GetHerHis] ประณาม [legitimacy|E] อันอ่อนแอของท่าน"
