ep3_cosmopolitan_domicile_modifier: "ที่ดินสากล"
ep3_cosmopolitan_domicile_modifier_desc: "ที่ดินของครอบครัวนี้เป็นศูนย์กลางของอิทธิพลทางการเมืองและการคลัง"
