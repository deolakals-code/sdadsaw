l_english: 

ep3_governor_yearly.3001.t: "ผู้สร้าง ผู้ซื้อ ผู้ถือครองที่ดิน"
ep3_governor_yearly.3001.desc_christian: "แก่ผู้ที่สมควรได้รับรางวัล พระเจ้าประทานความเจริญรุ่งเรือง ที่ดินของคนเกียจคร้านรกชัฏไปด้วยพงหญ้า แต่ที่ดินของข้าใน [root_domicile_province.GetTitle.GetNameNoTier] — ดินแดนแห่งอาหารที่นำมาสู่ยุ้งฉางของข้า แห่งค่าเช่าที่จ่ายในนามของข้า — บัดนี้ทอดยาวสุดขอบฟ้า"
ep3_governor_yearly.3001.desc_other: "ผืนดินช่างอุดมสมบูรณ์เสียนี่กระไร! ยุ้งฉางช่างอุดมสมบูรณ์เสียนี่กระไร! รอบ ๆ ที่ดินของข้าใน [root_domicile_province.GetTitle.GetNameNoTier] ข้าได้ลงทุนอย่างหนักในผลิตผลท้องถิ่น และบัดนี้ เป็นพระพรอย่างยิ่งที่ครอบครัวผู้ขยันขันแข็งจำนวนมากจ่ายค่าเช่าให้แก่ข้า"
ep3_governor_yearly.3001.desc_mid: "\n\nในขณะเดียวกัน [governor.GetTitleAsName] ประจำท้องถิ่นกลับปกครองเหนือพงหนามและความสับสนวุ่นวาย [target_theme.GetNameNoTierPossessive]"
ep3_governor_yearly.3001.desc_greek: "[Glossary( 'โคริไท', 'CHORITAI_GLOSS' )]"
ep3_governor_yearly.3001.desc_non_greek: "ผู้ถือครองที่ดินรายย่อย"
ep3_governor_yearly.3001.desc: "แทบไม่รู้เลยว่ากฎหมายของ [governor.GetHerHis] คุ้มครองพวกเขาจากการถูกกว้านซื้อหรือไม่! ผู้เสียภาษีของ [governor.GetTitledFirstNamePossessiveNoTooltip] สามารถกลายเป็นผู้เช่าของข้าได้ #EMP อย่างง่ายดาย#!...\n\n"
ep3_governor_yearly.3001.desc_garden: "สวนที่เพิ่งปิดล้อมใหม่ของข้า — เป็นเพียงจุดเริ่มต้นหรือไม่?"
ep3_governor_yearly.3001.desc_garden_leisure: "สวนที่เพิ่งขยายใหม่ของข้า อุดมไปด้วย [root_domicile_province.Custom('get_region_flower_type_plural')] อันน่ารัก — เป็นเพียงจุดเริ่มต้นหรือไม่?"
 ep3_governor_yearly.3001.desc_garden_fruit: "สวนที่เพิ่งขยายใหม่ของข้า หอมกรุ่นด้วยผลไม้สุกงอม — เป็นเพียงจุดเริ่มต้นหรือไม่?"
ep3_governor_yearly.3001.desc_grazing_land: "สิทธิ์ในทุ่งหญ้าเลี้ยงสัตว์ใหม่ที่ข้าเจรจามาอย่างชาญฉลาด — เป็นเพียงจุดเริ่มต้นหรือไม่?"
ep3_governor_yearly.3001.desc_horse_pasture: "สิทธิ์ในทุ่งหญ้าเลี้ยงม้าอันอุดมสมบูรณ์ที่เพิ่งลงนามใหม่ของข้า — เป็นเพียงจุดเริ่มต้นหรือไม่?"
 ep3_governor_yearly.3001.desc_camel_pasture: "ฝูงอูฐหลังนูนที่ส่งเสียงร้อง เหม็น และ #EMP ทำกำไร#! ของข้า — เป็นเพียงจุดเริ่มต้นหรือไม่?"
ep3_governor_yearly.3001.desc_grain_field: "ทุ่งนาที่เพิ่งไถใหม่ของข้า — เป็นเพียงจุดเริ่มต้นหรือไม่?"
ep3_governor_yearly.3001.desc_vineyard: "แถวเถาองุ่นในไร่องุ่นใหม่ของข้าที่ทอดยาวสุดลูกหูลูกตา — เป็นเพียงจุดเริ่มต้นหรือไม่?"
ep3_governor_yearly.3001.desc_olive: "สวนมะกอกที่เพิ่งซื้อใหม่ของข้า พร้อมด้วยต้นไม้อันล้ำค่าและเหี่ยวแห้ง — เป็นเพียงจุดเริ่มต้นหรือไม่?"
ep3_governor_yearly.3001.desc_silk: "สวนหม่อนผลิตไหมแห่งใหม่ของข้า — เป็นเพียงจุดเริ่มต้นหรือไม่?"
ep3_governor_yearly.3001.desc_tea: "แนวพุ่มชาเขียวขจีที่กำลังแตกหน่อของข้า — นี่เป็นเพียงจุดเริ่มต้นเท่านั้นหรือ?"

CHORITAI_GLOSS: "#bold Choritai#! เป็นศัพท์ภาษากรีกโบราณสำหรับผู้ที่อยู่ในชุมชนหมู่บ้าน หรือ #EMP chorion#!."

ep3_governor_yearly.3001.a_success: ""ข้าน่ะหรือ? เจ้าของที่ดินที่ทรงอิทธิพลที่สุดแถวนี้?""
ep3_governor_yearly.3001.a_failure: "ท่านพัวพันกับเรื่องอื้อฉาวอย่างรวดเร็ว"
ep3_governor_yearly.3001.a_govs_low: "ตัวเลือกนี้มีให้ เนื่องจาก [governor_efficiency|E] ที่ต่ำมากของ [governor.GetShortUINamePossessive]"
ep3_governor_yearly.3001.c_gov_gain: "[governor_efficiency|E] ของ [governor.GetShortUINamePossessive] เพิ่มขึ้น #P 5#!"

ep3_governor_yearly.3001.a: "ข้าคงรอดพ้นจากการกว้านซื้อที่ดินครึ่งหนึ่งของ [target_theme.GetTierAsNameNoTooltip] ไปได้!"
ep3_governor_yearly.3001.a.flavor: "ฝ่ายบริหารที่ไร้ประโยชน์นี้จะไม่สังเกตเห็นทรัพย์สินใหม่ของข้าจนกว่าจะถึงเวลาเก็บภาษี!"
ep3_governor_yearly.3001.b: "ให้ข้ารุ่งเรืองขึ้นเล็กน้อยยังดีกว่าให้ [governor.GetTitleAsNameNoTooltip] โง่เง่าบางคน"
ep3_governor_yearly.3001.b.flavor: "ข้ามีเหรียญให้ใช้ — ทำไมไม่รีบคว้าที่ดินที่ทำกำไรได้มากกว่านี้ล่ะ?"
ep3_governor_yearly.3001.b_gov_response: "@warning_icon! #X [governor.GetShortUIName] อาจลงโทษท่าน!#!"
ep3_governor_yearly.3001.c: "แทนที่จะ... ข้าอาจเสนอความช่วยเหลือแก่ [governor.GetTitleAsNameNoTooltip]"
ep3_governor_yearly.3001.c.flavor: "คำเตือนของข้าอาจช่วยขัดขวางเจ้าของที่ดินรายอื่น... และพิสูจน์คุณค่าของข้า"

ep3_governor_yearly.3001.c_gain_influence: "ท่านได้รับ #P 75#! #high Influence#!"
ep3_governor_yearly.3001.minor_influence_loss: "ท่านใช้ #N 75#! #high Influence#!"
ep3_governor_yearly.3001.b_miniscule_influence_loss: "ท่านใช้ #N 35#! #high Influence#!"

vast_tracts_of_land_modifier: "ที่ดินรายย่อยมากมาย"
vast_tracts_of_land_modifier_desc: "ตระกูลนี้เก็บค่าเช่าและดูแลกิจการของร้านค้าหัตถกรรมและที่ดินรายย่อยจำนวนมาก"
productive_lands_modifier: "ที่ดินรายย่อยจำนวนมาก"
productive_lands_modifier_desc: "ขอบเขตที่ดินของตระกูลนี้ขยายใหญ่ขึ้นจากการบีบบังคับและการซื้ออย่างชาญฉลาด"

ep3_governor_yearly.3002.t: "จากผู้เสียภาษีสู่ผู้เช่า"
ep3_governor_yearly.3002.desc: ""ดูสิ — ดูนั่น ในม้วนบันทึก!" [tax_farmer.GetName] ตวาด\n\n"ภาษีของอีกหมู่บ้านหนึ่งที่ข้าเก็บในนามของท่าน นับตั้งแต่ซื้อสัญญาของข้า! และตอนนี้ — พวกเขากลับส่งผู้เก็บภาษีไปยัง [landlord.GetName] เจ้าของที่ดินคนใหม่ของพวกเขา! และ [landlord.GetSheHe] ก็จ่ายเพียงเล็กน้อย"\n\n"ไอ้"
ep3_governor_yearly.3002_insult_greek: "[Glossary( 'เมโทรคอยเตส', 'METROKOITES_GLOSS' )]"
METROKOITES_GLOSS: "#bold Metrokoites#! เป็นคำสบประมาทภาษากรีกที่หมายถึง \"ผู้ที่หลับนอนกับมารดาของตน\""
ep3_governor_yearly.3002_insult_armenian: "[Glossary( 'เอชิ ดัซก์', 'ESHI_DZAG_GLOSS' )]"
ESHI_DZAG_GLOSS: "#bold Eshi dzag#! เป็นคำสบประมาทภาษาอาร์เมเนีย หมายถึง \"ลูกลา\""
ep3_governor_yearly.3002_insult_generic: "[landlord.Custom2('InsultNoun', SCOPE.sC('tax_farmer'))]"
ep3_governor_yearly.3002.desc_mid: "นั่นโกหกชาวบ้านเหล่านี้เกี่ยวกับการคุ้มครองของพวกเขา: [landlord.GetSheHe] กำลังกว้านซื้อ"
ep3_governor_yearly.3002_half_duchy: "มากมาย #EMP เหลือเกิน#!"
ep3_governor_yearly.3002_some_of_duchy: "มากมาย"
ep3_governor_yearly.3002.desc_outro: "ซึ่งทุ่งหญ้าเลี้ยงสัตว์ในท้องถิ่น โปรดคิดเถิด โอ้ [ROOT.Char.GetTitleAsNameNoTooltip]... ถึงภาษีที่สูญเสียไป กองทหารที่สูญเสียไป...""
ep3_governor_yearly.3002.a: "เจ้าของที่ดินตัวน้อยอยากจะเล่นกับ #EMP ข้า#! งั้นหรือ...?"
ep3_governor_yearly.3002.a.flavor: ""ที่ดิน #EMP ที่ถูกขโมย#! จากผู้บริสุทธิ์ #EMP ยากไร้#!? ความโหดร้าย การข่มขู่? ใช่ ข้าคิดว่านั่นคือสิ่งที่ข้าได้ยินพยานพูด..."
ep3_governor_yearly.3002.b: ""บังคับให้พวกเขาระดมพล! บังคับให้พวกเขาจ่าย!""
ep3_governor_yearly.3002.b.flavor: "พวกคนโง่เขลาทั่วไปจะรับใช้ภายใต้คมดาบ! ตอนนี้พวกเขาต้องจ่ายให้นายถึงสองเท่า"
ep3_governor_yearly.3002.c: "เป็นหน้าที่ของข้าที่จะต้องประณามเรื่องนี้!"
ep3_governor_yearly.3002.c.flavor: "การสร้างเรื่องอื้อฉาวเกี่ยวกับความโลภ เช่นนี้พิสูจน์ว่าข้าเป็นผู้ว่าการที่แข็งขันและมีความสามารถของ [target_theme.GetNameNoTierNoTooltip]! ทำนองนั้น..."
ep3_governor_yearly.3002.d: ""ส่งคำแสดงความยินดี... ของข้าไปให้ [landlord.GetDynastyHouseNameNoTooltip]""
ep3_governor_yearly.3002.d.flavor: "อย่างน้อยก็มีใครบางคนใน [target_theme.GetTierAsNameNoTooltip] นี้ที่จะมีความสุข..."

ep3_governor_yearly.3002.a_medium_influence_loss: "ท่านใช้ #N 150#! #high Influence#!"
ep3_governor_yearly.3002.b_miniscule_influence_gain: "ท่านได้รับ #P 35#! #high Influence#!"
ep3_governor_yearly.3002.b_minor_influence_loss_landlord: "[landlord.GetShortUIName] ใช้ #N 75#! #high Influence#!"

ep3_governor_yearly.3000_major_governance_loss: "[governor_efficiency|E] ของท่านลดลง #N 15#! เป็นเวลา #high 10 ปี#!"
ep3_governor_yearly.3000_governance_loss: "[governor_efficiency|E] ของท่านลดลง #N 10#! เป็นเวลา #high 10 ปี#!"
ep3_governor_yearly.3000_miniscule_governance_loss: "[governor_efficiency|E] ของท่านลดลง #N 5#! เป็นเวลา #high 10 ปี#!"

some_smallholds_modifier: "หย่อมที่ดินรายย่อย"
some_smallholds_modifier_desc: "แม้จะมีการแทรกแซงอย่างหนักหน่วง เจ้าของที่ดินเหล่านี้ยังคงเก็บค่าเช่าจากผู้เช่าที่ไม่ชอบด้วยกฎหมายบางราย"

taxed_and_pressganged_tenants_modifier: "ผู้เช่าที่ถูกเก็บภาษีและเกณฑ์ทหาร"
taxed_and_pressganged_tenants_modifier_desc: "ผู้ถือครองที่ดินรายย่อยในท้องถิ่นที่ขายที่ดินของตนถูกปล้นซ้ำซ้อน และถึงแม้จะผิดกฎหมาย ก็ยังถูกบังคับให้เข้ารับราชการทหาร"

ep3_governor_yearly.3003.t: "[landlord.GetNameNoTooltip],"
ep3_governor_yearly.3003.desc_accused_of_crime: "ข้าตกใจที่ได้ยินว่าท่านข่มขู่ผู้ถือครองที่ดินรายย่อยผู้บริสุทธิ์! พยาน #EMP จำนวนมาก#! ของข้ากล่าวว่าท่าน — ท่ามกลางความผิดอื่น ๆ — ส่งเด็กไปถ่มน้ำลายใส่หญิงม่าย? ขโมยสุนัข? เทน้ำลงปล่องไฟ? และเพียง เพื่อที่ท่านจะได้ซื้อทุ่งหญ้าเลี้ยงสัตว์ที่รกชัฏ!\n\nการละเมิดกฎหมายของท่าน น่าเศร้า ได้รับการบันทึกและเปิดเผยต่อสาธารณะแล้ว... ข้าเกรงว่าท่านอาจจะได้ยินเรื่องนี้อีก"
ep3_governor_yearly.3003.desc_force_used: "จงพูดคุยกับผู้เช่ารายใหม่ของท่าน บอกพวกเขาว่าภาษีที่ดินของพวกเขายังคงค้างชำระ การรับใช้ในสงครามของพวกเขายังคงถึงกำหนด เมื่อทหารของข้ามาถึง อย่าขวางทางพวกเขา\n\nกฎหมายระบุว่าตอนนี้ท่านเป็นเจ้าของที่ดิน แต่ประชาชนนั้น #EMP เป็นของข้า#!."
ep3_governor_yearly.3003.desc_scandal: "ท่านอาจคิดว่าข้าไร้ความสามารถ ว่าข้าแทบไม่มีความคิดคำนึงถึงความเป็นอยู่ที่ดีของ [target_theme.GetNameNoTier] แต่เป็น #EMP ท่าน#! ต่างหากที่เย้ยหยันประเพณี เพื่อที่จะเรียกมันส่วนใหญ่ว่าเป็นของท่านเอง — น่าละอาย!\n\nท่านจะพบว่าความโลภของท่านได้กลายเป็นหัวข้อสนทนาโปรดใน [governor.GetCapitalLocation.GetCounty.GetTitle.GetNameNoTier] น่าเศร้า นั่นสมควรได้รับอย่างยิ่ง"
ep3_governor_yearly.3003.desc_backs_down: "ข้าขอแสดงความยินดีกับการได้มา ซึ่งทรัพย์สินใหม่ของท่าน! หมู่บ้านที่สวยงามพร้อมผู้คนที่มีเหตุผล — เป็นชนบทที่ดีที่ท่านเป็นเจ้าของ!\n\nใช่ บางคนอาจคร่ำครวญเกี่ยวกับกฎหมายเก่าที่สร้างขึ้นเพื่อจำกัดท่าน: พวกเขาบิดมือคร่ำครวญเกี่ยวกับอนาคตของ [root_domicile_province.GetTitle.GetNameNoTier]... แต่ของท่าน มือที่ฉลาดและมั่นคง คือมือที่ดีที่สุดที่จะถือไม้เรียว!"

ep3_governor_yearly.3003.a_accused_of_crime: "ข้อกล่าวหาเท็จ! แต่กระนั้น — #EMP พวกเขามาเอาที่ดินของข้า?!?#!"
ep3_governor_yearly.3003.a_force_used: "นี่จะ ทำให้ผู้เช่าของข้าโกรธแค้น! มันจะ ทำให้พวกเขายากจน!"
ep3_governor_yearly.3003.a_scandal: "[governor.GetSheHe|U] สามารถทำลายชื่อเสียงของข้าได้... แต่ไม่ใช่ทรัพย์สินของข้า!"
ep3_governor_yearly.3003.a_backs_down: "[governor.GetTitleAsNameNoTooltip] ยอมถอย! ทุกอย่างเป็นของข้าอย่างปลอดภัย"

ep3_governor_yearly.3010.t: "ถึงกระนั้น [emperor.GetTitleAsNameNoTooltip] ก็ยังคงต่อสู้"
ep3_governor_yearly.3010.desc: "เป็นเวลาหลายปีแล้วที่กองกำลังของ [emperor.GetTitledFirstName] ได้"
ep3_governor_yearly.3010.desc_attacker: "ทำ [war.Custom('WarCasusBelliShort')] ต่อต้าน [foe.GetName]\n\nในต่างจังหวัด เราได้ยินเรื่องราวการปิดล้อมที่ตึงเครียด การสู้รบที่ไม่แน่นอน ซึ่งจบลงด้วยความสับสนและนองเลือด... เราถกเถียงถึงความฝันในการพิชิตต่างแดน ความฝันที่ [emperor.GetTitleAsNameNoTooltip] ของเราไล่ตาม"
ep3_governor_yearly.3010.desc_defender: "ป้องกันตนเองจาก [war.Custom('WarCasusBelliShort')] ของ [foe.GetNamePossessive]\n\nในต่างจังหวัด เราได้ยินเรื่องราวการปิดล้อมที่ตึงเครียด การสู้รบที่ไม่แน่นอน ซึ่งจบลงด้วยความสับสนและนองเลือด... เรากระซิบกระซาบถึงการโจมตีของศัตรู และกังวลถึงผู้ถูกกดขี่และผู้เสียชีวิต"
ep3_governor_yearly.3010.desc_mid: "ศรัทธาของผู้คนเริ่มสั่นคลอน"
ep3_governor_yearly.3010.desc_winning: "\n\nใช่ ตามรายงานทั้งหมด การต่อสู้ดำเนินไปด้วยดี... แต่โดย [ROOT.Char.GetFaith.HighGodName] ความคืบหน้าของ [emperor.GetTitleAsNamePossessiveNoTooltip] ช่างเชื่องช้าเสียนี่กระไร!"
ep3_governor_yearly.3010.desc_losing: "\n\n[ROOT.Char.GetFaith.HighGodName] ไม่ได้โปรดปราน [emperor.GetTitleAsNameNoTooltip] ตามรายงานทั้งหมด กองทัพของ [emperor.GetHerHis] กำลังเผชิญกับความพ่ายแพ้"
ep3_governor_yearly.3010.desc_middling: "\n\nความโปรดปรานของ [ROOT.Char.GetFaith.HighGodNamePossessive] ยังคงเข้าใจยาก: ดูเหมือนจะไม่มีจุดสิ้นสุดของการต่อสู้ในสายตา"
ep3_governor_yearly.3010.a: "ข้าจะเดินทัพไปแนวหน้า ในฐานะทหารผู้ภักดี!"
ep3_governor_yearly.3010.a.flavor: "และทหารผู้ภักดีและใจกว้างไม่ควรคาดหวังที่จะรู้สึกถึงความอบอุ่นจากความนับถือของผู้บัญชาการของ [ROOT.Char.GetHerHis] หรอกหรือ...?"
ep3_governor_yearly.3010.a.success: "[emperor.GetTitleAsNameNoTooltip] ยอมรับความช่วยเหลือของท่าน"
ep3_governor_yearly.3010.a.fail: "[emperor.GetTitleAsNameNoTooltip] ไม่สนใจ"
ep3_governor_yearly.3010.b: "ผู้ปกครองที่ #EMP แข็งแกร่ง#! น่าจะยุติเรื่องนี้ได้"
ep3_governor_yearly.3010.b.flavor: "อาณาจักรไม่ควรแสวงหานายที่ไม่ล้มเหลวและล้มเหลวหรือ?"
ep3_governor_yearly.3010.c: "ต่างจังหวัดอยู่ห่างไกลจากความคิดของ [emperor.GetTitleAsNamePossessiveNoTooltip] เหลือเกิน..."
ep3_governor_yearly.3010.c.flavor: "...และอ่อนไหวต่อกลอุบายของข้าเหลือเกิน"
ep3_governor_yearly.3010.d: "การบริจาคอันเคร่งศาสนา คำอธิษฐานในนามของ [emperor.GetHerHis]"
ep3_exploited_weak_master_modifier: "ฉวยประโยชน์จากเจ้าเหนือหัวที่กำลังรบ"
ep3_exploited_weak_master_modifier_desc: "ในขณะที่เจ้าเหนือหัวของพวกเขากำลังพัวพันอยู่ในสงคราม ผู้ว่าการคนนี้ได้ยักยอกเงินทุนและจัดระเบียบการปกครองท้องถิ่นใหม่เพื่อประโยชน์ส่วนตน"

msg_claimed_weak_emperors_title.t: "[ROOT.Char.GetTitleAsNameNoTooltip] ท้าทายการปกครอง"
msg_claimed_weak_emperors_title.flavor: "ประณามสงครามที่ยืดเยื้อของท่าน เหล่าไพร่ฟ้าต่างโห่ร้องสรรเสริญบุคคลที่เด็ดขาดกว่า"

msg_claimed_weak_emperors_title.t.2: "สมาชิกฝ่ายประณามสงคราม"
msg_claimed_weak_emperors_title.flavor.2: "สงครามที่ยืดเยื้อของท่านกับ [foe.GetName] เพิ่มความน่าเชื่อถือให้กับผู้ว่าร้ายท่าน"
decried_weakness_score_desc: "ประณามความอ่อนแอของจักรวรรดิ"
governor_challenges_weakness_candidate_score: "[candidate_score|E] ของ [ROOT.Char.GetShortUINamePossessive] สำหรับ [emperor.GetPrimaryTitle.GetName] เพิ่มขึ้น #P 20#!"

ep3_governor_yearly.3011.opening: "เจ้าเหนือหัวของข้า [emperor.GetTitleAsName] ผู้โดดเด่นที่สุด"
ep3_governor_yearly.3011.desc: "กองทัพของเราทำสงครามกับ [foe.GetName] มานานแล้ว แต่เรายังไม่มีชัยชนะใด ๆ ให้ประกาศ\n\nหากข้าจะให้ยืมกองทหารประจำตระกูล กองทุนส่วนตัวของข้า เพื่อสนับสนุนอุดมการณ์ของท่าน - การรับใช้อย่างภักดี เช่นนี้จะได้รับการชื่นชมอย่างถูกต้องหรือไม่?"
ep3_governor_yearly.3011.a: "ทำทุกอย่างเพื่อเห็นศัตรูของข้าพ่ายแพ้ในที่สุด!"
ep3_governor_yearly.3011.b: "[governor.GetTitledFirstNameNoTooltip] แทบจะไม่ใช่พันธมิตรที่ควรค่าแก่การมี..."

ep3_governor_yearly.3012.opening: "โอ้ เสนาบดีผู้กล้าหาญแห่ง [ROOT.Char.GetPrimaryTitle.GetNameNoTier]"
ep3_governor_yearly.3012.desc_fail: "นอกเหนือจากเงื่อนไขที่ไร้สาระในข้อเสนอของท่านแล้ว - กองกำลังของท่านก็ไม่ได้เป็นที่ต้องการอย่างยิ่งยวด\n\nท่านอาจยังคงฝันที่จะเข้าร่วมกับ [emperor.GetTitleAsName] ของท่านท่ามกลางความอึกทึกของสงคราม แต่หากความทะเยอทะยานเพียงอย่างเดียวชี้นำท่าน ก็ควรลิ้มรสความสุขสงบอันแสนหวานของท่านดีกว่า"
ep3_governor_yearly.3012.desc_success: "ข้ายอมรับข้อเสนอของท่าน เรารอคอยความแข็งแกร่งสดใหม่ของทหารของท่านในแนวรบที่เหนื่อยล้า\n\nสำหรับความกล้าหาญ ความเอื้อเฟื้อเผื่อแผ่ในจิตวิญญาณ ความมั่นคงของท่าน รางวัลทางโลกเพียงไม่กี่อย่างเท่านั้นที่เทียบเท่าได้"
ep3_governor_yearly.3012.kyrie_eleison: "[Glossary( 'Kýrie, eléison!', 'KYRIE_ELEISON_GLOSS' )]"
ep3_emperor_yearly.3011.a_to_war: "นายทหาร [emperor.GetPrimaryTitle.GetAdjectiveNoTooltip] ผู้เก่งกาจเข้าร่วมการต่อสู้!"
ep3_emperor_yearly.3011.a_no_war: "ข้าปรารถนา #EMP เพียง#! ที่จะรับใช้ [emperor.GetTitleAsNameNoTooltip] ของเรา..."

ep3_governor_yearly.3020.t: "[ROOT.Char.GetFaith.HighGodName] แต่งตั้ง... [emperor.GetHerHim|U]?"
ep3_governor_yearly.3020.desc: "[emperor.GetTitleAsName] ผู้ [target_trait.GetNameNoTooltip( GetNullCharacter )|l] ที่ปกครองเรามักเป็นหัวข้อสนทนาที่เงียบงัน"
ep3_governor_yearly.3020.desc_physical: "\n\nอาณาจักรของเราจะยังคงอยู่ได้หรือไม่ ในขณะที่รูปลักษณ์ทางกายภาพของมัน [emperor.GetHerselfHimself] ผิดรูป? รูปเหมือนที่เสียหายของ [emperor.GetTitledFirstNamePossessiveNoTooltip] จะถูกประทับลงบนเหรียญใหม่หรือไม่? และ — น่าหวาดหวั่นที่จะคิด — เจ้าเหนือหัวที่ [ROOT.Char.GetFaith.HighGodNameAlternatePossessive] เลือกสรรต่อจากนี้ไปจะเป็นคนพิการน่าสมเพชหรือไม่?\n\nไม่ [emperor.GetTitleAsName] ผู้ [target_trait.GetNameNoTooltip( GetNullCharacter )|l] นี้แทบไม่คู่ควรกับชุดสีม่วง..."
ep3_governor_yearly.3020.desc_crime: "\n\nเราเป็นอาณาจักรที่ได้รับพรมากที่สุดจริงหรือ ปกครองโดยอาชญากรชั่วร้าย - คนบาปที่ท้าทายคำสอนของ [ROOT.Char.GetFaith.HighGodNameAlternate]? กฎหมายของเราอีกกี่ฉบับที่จะถูกเขียนด้วยมือที่เปื้อนเลือด?\n\nนายผู้ [target_trait.GetNameNoTooltip( GetNullCharacter )|l] ของเรา นั่งอยู่บนบัลลังก์สูง — #EMP ความอัปยศอดสูอย่างที่สุด!#! [emperor.GetWomanMan] ที่ต่ำต้อยกว่านี้คงถูกประหารชีวิตไปนานแล้ว..."
ep3_governor_yearly.3020.a: "การท้าทายเติบโตได้ดีที่สุดในความมืด..."
ep3_governor_yearly.3020.a.flavor: "และเสียงกระซิบทั้งหมดเกี่ยวกับความไม่คู่ควรของจักรวรรดิควรนำกลับมาหาข้า"
ep3_governor_yearly.3020.a.success: "นักนินทาใส่ใจคำพูดที่รุนแรงของท่าน"
ep3_governor_yearly.3020.a.fail: "คำพูดเสียดสีของท่านไม่น่าสนใจใคร"
ep3_governor_yearly.3020.b: "ข้าต้องเขียนจดหมายประณาม!"
ep3_governor_yearly.3020.flavor: "เพราะเครื่องหมายแห่งความไม่พอใจของ [ROOT.Char.GetFaith.HighGodNameAlternatePossessive] นี้เป็นภัยพิบัติไม่เพียง แต่ต่อ [emperor.GetTitleAsNameNoTooltip] เท่านั้น แต่ยัง รวมถึงอาณาจักรด้วย!"
ep3_governor_yearly.3020.c: "การทำงานอย่างขยันขันแข็งจะ ทำให้เรื่องนี้หลุดไปจากใจข้า"

governor_insulted_imperial_trait_candidate_score: "[candidate_score|E] ของ [ROOT.Char.GetShortUINamePossessive] สำหรับ [emperor.GetPrimaryTitle.GetName] เพิ่มขึ้น [EmptyScope.ScriptValue('appointment_score_minor_value')|P0]"
insulted_trait_score_desc: "ประณาม [trait|E] ที่ไม่คู่ควรของ [liege|E]"

msg_unflattering_imperial_trait_gossip.t: "เรื่องซุบซิบนินทาอื้อฉาว"
msg_unflattering_imperial_trait_gossip.flavor: "ข่าวลืออันตรายแพร่สะพัด: เสนาบดีของท่านไม่พอใจ [emperor.GetTitleAsNameNoTooltip] ผู้ [target_trait.GetName( GetNullCharacter )] ของพวกเขา"

ep3_governor_yearly.3021.opening: "[emperor.GetTitleAsNameNoTooltip] ของข้า"
ep3_governor_yearly.3021.desc_physical: "ท่านทราบดีว่าพวกเราชาว [minister.GetCulture.GetCollectiveNoun] ตกตะลึงด้วยความหวาดกลัวเมื่อร่างที่พิการนั่งอยู่บนบัลลังก์ของเจ้าเหนือหัวผู้สมบูรณ์แบบของ [minister.GetFaith.HighGodNamePossessive]\n\nข้าต้องขอร้องท่าน [emperor.GetTitleAsNameNoTooltip] ผู้ [target_trait.GetNameNoTooltip( GetNullCharacter )|l] ของเรา ให้วิงวอนขอความคุ้มครองจาก [minister.GetFaith.HighGodNameAlternate]! ด้วยพระเมตตาของพระเจ้าเท่านั้น เราจึงจะผ่านพ้นช่วงเวลาที่ไม่เป็นธรรมชาตินี้ไปได้"
ep3_governor_yearly.3021.desc_crime: "ด้วยธรรมชาติอันบาปหนาของท่าน ข้าเกรงว่าอาณาจักรของท่านจะตกอยู่ในอันตราย [target_trait.GetNameNoTooltip( GetNullCharacter )] [emperor.GetTitleAsNameNoTooltip] — ข้าขอวิงวอนท่าน ต่อหน้าอาณาจักรทั้งปวง ให้แสวงหาการอภัยโทษจาก [minister.GetFaith.HighGodNameAlternate]\n\nจิตวิญญาณจะทนต่อความเน่าเฟะของบาปได้นานเพียงใด? และพวกเราผู้มีอำนาจจะทนต่อความเสื่อมทรามจากการกระทำผิดของท่านได้นานเพียงใด?"
ep3_governor_yearly.3021.a: "แม้ข้าจะไม่สมบูรณ์แบบ ข้าสาบานว่าจะพยายามเพื่อประชาชนของข้า"
ep3_governor_yearly.3021.b: "ความโอหัง!"
ep3_governor_yearly.3021.bad_trait: "@warning_icon! #X สิ่งนี้เกิดขึ้นเพราะ [trait|E] [target_trait.GetName( GetNullCharacter )] ของท่าน#!"
ep3_governor_yearly.3021.a.flavor: "อย่างน้อยชั่วขณะหนึ่ง ผู้เคร่งศาสนาอาจให้อภัยข้า และปล่อยให้เรื่องนี้หลุดลอยไปจากความคิดของพวกเขา..."
emperor_repented_for_flaws_modifier: "สำนึกผิดในข้อบกพร่องของจักรวรรดิ"
emperor_repented_for_flaws_modifier_desc: "แม้ว่าตัวละครนี้จะไม่คู่ควรกับตำแหน่งสูงส่งอย่างสมบูรณ์ แต่พวกเขาก็พยายามอย่างเปิดเผยเพื่อลบล้างตนเองจากสิ่งนี้"
ep3_governor_yearly.3021.blocker: "ท่านจะไม่ได้รับเหตุการณ์นี้เป็นเวลาอย่างน้อย #high 10 ปี#!"

ep3_governor_yearly.3030.t: "ช่วงเวลาอันเงียบสงบ"
ep3_governor_yearly.3030.desc_christian: ""ผู้สร้างสันติย่อมเป็นสุข!" นักบุญแมทธิวได้เขียนไว้ และในสิ่งนี้ ท่านได้ถ่ายทอดความจริงของพระผู้เป็นเจ้าอย่างแน่นอน\n\nเป็นเวลาหลายปีแล้วที่ [emperor.GetPrimaryTitle.GetDefinitiveName] และ [ROOT.Char.GetPrimaryTitle.GetNameNoTier] ของข้าได้ประจักษ์ถึงสันติสุขแห่งพระคริสต์"
ep3_governor_yearly.3030.desc_generic: "เป็นเวลาหลายปีแล้วที่ [emperor.GetPrimaryTitle.GetDefinitiveName] และ [ROOT.Char.GetPrimaryTitle.GetNameNoTier] ของข้าได้รู้จักกับความสงบสุข\n\n"
ep3_governor_yearly.3030.desc: "วัวควายอ้วนท้วนในทุ่งนา หนุ่มสาวที่ไม่ต้องกังวลกับหน้าที่ทางทหาร นอนอาบแดดอยู่บนพื้นหญ้า ในเมืองที่มีความสุขของเรา พ่อค้าทำการค้าอย่างอิสระ และเสนาบดีดูแลเรื่องการพัฒนาสาธารณะ\n\nการปกครองของข้าและของ [emperor.GetTitledFirstNamePossessive] จะไม่มีความสำเร็จอันยิ่งใหญ่และรุ่งโรจน์เลยหรือ? เพียงแค่... ความพึงพอใจนี้?"
ep3_governor_yearly.3030.a: "ความสุขสงบได้ ทำให้เรา #EMP อ่อนแอ!#!"
ep3_governor_yearly.3030.a.flavor: "การผจญภัยนอกพรมแดน พร้อมด้วยเหล็กกล้าในมือ — นั่นจะปลุกเร้ากองทหารของข้า!"
ep3_governor_yearly.3030.b: "ข้าไม่ได้วางแผนเพื่อสงคราม แต่เพื่อความเจริญรุ่งเรือง"
custom.every_sub_realm_county: "ทุก [county|E] ใน [realm|E] ของท่าน"
ep3_peaceful_administrator_modifier: "ผู้บริหารที่รักสงบ"
ep3_peaceful_administrator_modifier_desc: "ตัวละครนี้ออกกฎหมายครั้งแล้วครั้งเล่าเพื่อสนับสนุนความเจริญรุ่งเรืองอย่างสันติ"
