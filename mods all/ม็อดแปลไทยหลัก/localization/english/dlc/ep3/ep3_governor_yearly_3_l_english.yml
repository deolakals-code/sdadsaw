ep3_governor_yearly.3070.t: "ลิ้นที่เดินทางมาอย่างดี"
ep3_governor_yearly.3070.intro: "ข้าราชสำนักของ [liege.GetTitledFirstName] เจ้าเหนือหัวของข้า เป็นที่รู้จักในเรื่องการทดสอบถนนของ [liege.GetPrimaryTitle.GetTierAsNamePossessive] [root_capital.GetTerrain.GetNameNoTooltip|l] รอบ ๆ"
ep3_governor_yearly.3070.landed: "เมืองหลวงของข้าค่อนข้างห่างไกล... แต่ถึงกระนั้น [racer.GetName] ผู้บ้าบิ่นก็กำลัง"
ep3_governor_yearly.3070.unlanded: "ที่ดินของตระกูลข้าค่อนข้างห่างไกล... แต่ถึงกระนั้น [racer.GetName] ผู้บ้าบิ่นก็กำลัง"
ep3_governor_yearly.3070.chariot: "ขับรถม้าศึกอันโดดเด่นของ [racer.GetHerHis] ข้าม [root_capital.GetName]"
ep3_governor_yearly.3070.horse: "ควบม้าอย่างหนักข้าม [root_capital.GetName]"
ep3_governor_yearly.3070.desc: "\n\n"ท่านอาศัยอยู่ไกลถึง #EMP ที่นี่?!?#!" [racer.GetSheHe] เยาะเย้ย "ไม่น่าแปลกใจเลยที่ [liege.GetTitleAsNameNoTooltip] จำชื่อท่านไม่ได้... แต่กลับน่าแปลกใจที่คำพูดใด ๆ นักเดินทางคนใด จาก [liege.GetCapitalLocation.GetTitle.GetNameNoTier] รอดชีวิตจากการเดินทางมาได้!""
ep3_governor_yearly.3070.a: "โอกาสมีอยู่มากมายที่นี่! เราจะไม่ไปไหน"
ep3_governor_yearly.3070.b: "เก็บข้าวของ ญาติพี่น้อง: เรากำลังย้ายไปเมืองหลวง"
ep3_governor_yearly.3070.c: ""ท่านเห็นปัญหาของข้าแล้ว... ตอนนี้ช่วยข้าด้วย""
ep3_governor_yearly.3070.c.flavor: "สิ่งมีชีวิตแห่งพระราชวังนี้ต้องมีสายสัมพันธ์ที่มีอิทธิพล — สายสัมพันธ์ที่สามารถผูกมัดข้าไว้กับตำแหน่งที่ดีกว่าได้"
ep3_governor_yearly.3070.d: "การเดินทางลำบากหรือ? ข้าจะดูแลถนนเอง"
ep3_governor_yearly.3070.d.success: "การสร้างถนนส่งเสริมการเชื่อมต่อกับเมืองหลวง"
ep3_governor_yearly.3070.d.fail: "ผู้สร้างถนนพบกับปัญหาพันประการ"
ep3_governor_yearly.3070.e: "ข้าชื่นชอบดินแดนห่างไกลที่แปลกตานี้"
