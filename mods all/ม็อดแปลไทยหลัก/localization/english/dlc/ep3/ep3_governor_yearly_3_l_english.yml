ep3_governor_yearly.3100.t: "[liege.GetPrimaryTitle.GetTierAsNameNoTooltip] ของเรา ความโกลาหล"
ep3_governor_yearly.3100.intro_liege: ""[liege.GetSheHe|U] ประกาศิต #EMP อะไร#! ตอนนี้?" ข้าพูดตะกุกตะกัก #EMP "เจ้าเหนือหัวของเราสั่งอะไรข้า?!?"#!"
ep3_governor_yearly.3100.intro_governors: ""เสนาบดีไร้ประโยชน์เหล่านั้นปฏิเสธ #EMP อะไร?!#!" ข้าพูดตะกุกตะกัก #EMP "พวกเขาจะไม่ทำอะไรเพื่อเจ้าเหนือหัวของเรา?!?"#!"
ep3_governor_yearly.3100.desc: "\n\n[messenger.GetFirstName] ทูต พูดตะกุกตะกัก: "[liege.GetTitledFirstNameRegnal] ผู้ [liege.Custom('FormalComplimentAdjective')] และยั่งยืน โดยคำนึงถึงสุขภาพของ [liege.GetPrimaryTitle.GetTierAsName] ของ [liege.GetHerHis] กำหนดให้แรงงานทุกคน คนรับใช้ทุกคนต้องเสียภาษี-"\n\nข้าฟังต่อไปไม่ไหวแล้ว"
ep3_governor_yearly.3100.desc_liege_debt: "ไอ้[liege.Custom2('InsultNoun', ROOT.Char)]นั่นและเหล่าสหายคนสนิทที่ แต่งกายด้วยผ้าแคชเมียร์ประดับอัญมณีของ[liege.GetHerHis] ได้สูบความมั่งคั่งทั้งหมดไปจาก [liege.GetPrimaryTitle.GetNameNoTierNoTooltip] แล้ว! ด้วยแผนการใหม่ของพวกมัน พวกมันจะรัง แต่จะสร้างความอดอยากและล่มสลาย..."
ep3_governor_yearly.3100.desc_liege_skill: "[liege.Custom('quirk_neg_adverb')|U] ไอ้[liege.Custom2('InsultNoun', ROOT.Char)]นั่นก็หันมาหาพวกเราเหล่าเสนาบดี แสวงหาสิ่งที่[liege.GetSheHe]มิอาจหามาได้ด้วย[liege.GetHerselfHimself] — ผลกำไรจากการปกครองอันสมเหตุสมผล!\n\n[liege.GetPrimaryTitle.GetNameNoTierNoTooltip] ช่างสิ้นหวังเสียจริง..."
ep3_governor_yearly.3100.desc_governors: "ช่างเป็นมรดกที่ #EMP พื้นฐาน#! เสียจริง! [liege.GetTitleAsNameNoTooltip] จำเป็นต้องอ้อนวอนข้าราชการ [liege.GetHerHis] ให้ทำ #EMP อะไรสักอย่าง#! หรือ? อะไรก็ได้นอกจากการเหยียบย่ำผลผลิตของอาณาจักร?\n\n[liege.GetPrimaryTitle.GetNameNoTier] เต็มไปด้วยคนปัญญาทึบ..."
ep3_governor_yearly.3100.a: "ดูเหมือนข้าต้องสอนการปกครอง"
ep3_governor_yearly.3100.b: "เจ้าเหนือหัวของข้าต้องแก้ไขการจัดการที่ผิดพลาดนี้!"
ep3_governor_yearly.3100.b.success: "จดหมายของท่านแสดงความเชื่อมั่นที่น่าประทับใจ"
ep3_governor_yearly.3100.b.fail: "[liege.GetTitleAsNameNoTooltip] ขุ่นเคือง"
ep3_governor_yearly.3100.c: "จากความโกลาหลเกิดผลกำไร"
ep3_governor_yearly.3100.c.flavor: "ในยุคที่ทุจริต เช่นนี้ ใครจะสังเกตเห็นการทุจริตเพิ่มขึ้นอีกเล็กน้อย?"
ep3_governor_yearly.3100.d: "ข้าไม่สามารถแก้ไขสถานการณ์ที่น่าสังเวชนี้ได้..."
ep3_governor_yearly.3100.d.flavor: "ข้าแทบจะทนคิดถึงมันไม่ได้ด้วยซ้ำ..."

