ep3_governor_yearly.3040.t_greek: "[emperor.GetTitleAsNameNoTooltip] ออโตครากตอร์!"
ep3_governor_yearly.3040.t: "[emperor.GetTitleAsNameNoTooltip] ผู้สมบูรณ์แบบที่สุด"
ep3_governor_yearly.3040.desc: "ข้าเริ่มจำไม่ได้แล้ว — [emperor.GetPrimaryTitle.GetName] เป็นเพียงความมืดมิดและความโกลาหลโดยสิ้นเชิงจริงหรือ ก่อนที่ [emperor.GetTitledFirstName] ผู้สูงศักดิ์จะหยิบคทาของ [emperor.GetHerHis] ขึ้นมา?\n\nนักสังคมสงเคราะห์เคยฝันถึงสิ่งอื่นใดนอกจากการได้อยู่ร่วมกับตระกูล [emperor.GetHouse.GetName] หรือไม่? ทหารของเราเคยตะโกนชื่อคนแปลกหน้าที่น่าเกลียดและสับสนหรือไม่? ขุนนางของเรา — พวกเขาเคยยอมจูบเท้าที่ไม่ได้ทำจากเนื้อหนังอันสมบูรณ์แบบของ [emperor.GetTitleAsNameNoTooltip] ของ [ROOT.Char.GetFaith.HighGodNamePossessive] หรือไม่?\n\nข้าไม่จำเป็นต้องจำจริง ๆ การตั้งคำถามถึงความชอบธรรมอันไม่ผิดพลาดขององค์อธิปัตย์ของข้า เช่นนี้คงไร้ผล"
ep3_governor_yearly.3040.a: "ข้าต้องผสานครอบครัวของข้าเข้ากับญาติผู้สูงศักดิ์ของ [emperor.GetHerHis]!"
ep3_governor_yearly.3040.a.flavor: "ความกตัญญู เช่นนี้มี แต่จะเสริมสร้างความแข็งแกร่งให้เราทั้งคู่"
ep3_governor_yearly.3040.b: "[emperor.GetTitleAsNameNoTooltip] ผู้ยิ่งใหญ่อาจไม่ต้องการความช่วยเหลือจากข้า..."
ep3_governor_yearly.3040.b.flavor: "... แต่ผู้ใฝ่ฝันแห่งตระกูล [emperor.GetHouse.GetNameNoTooltip] นั้นค่อนข้างไม่แน่นอนกว่า"
ep3_governor_yearly.3040.c: "#EMP ข้า#! ต้องมั่นคงอย่างยิ่งยวด"
ep3_governor_yearly.3040.c.flavor: "อย่าพึ่งพาความแข็งแกร่งของเจ้าเหนือหัว แต่จงพึ่งพากองทหารที่แข็งแกร่งและความกระตือรือร้นในท้องถิ่น!"
ep3_governor_yearly.3040.d: "ทหารเกณฑ์ต่างโห่ร้องที่จะต่อสู้ในนามของ [emperor.GetHerHis]!"
ep3_governor_yearly.3040.d.flavor: "และข้าจะเกณฑ์พวกเขาอย่างมีความสุข"
