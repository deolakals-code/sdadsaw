 chariot_race.0120.t: "$chariot_race.0100.t$"
 chariot_race.0120.desc: ""ช่างเป็นโอกาสที่น่าสนใจยิ่งนัก..." [GetCourtPositionType('bookmaker_court_position').GetName()] พึมพำ "และท่านประสงค์จะวางเดิมพันประเภทใดกับ [ROOT.Var('wager_target').GetCharacter.GetFirstName] ผู้รวดเร็ว?""
 chariot_race.0120.desc.team: ""ฉลาดมาก ฉลาดมาก..." [GetCourtPositionType('bookmaker_court_position').GetName()] พึมพำ "และท่านประสงค์จะวางเดิมพันประเภทใดกับรถม้าที่สวมชุด [ROOT.Char.Custom('GetChariotTeamColor')|l]?""
 chariot_race.0120.a: "ข้าคาดหวังชัยชนะ แน่นอน!"
 chariot_race.0120.a.info: "#V [root_scope.MakeScope.Var('wager_target').Var('percent_chance_to_win').GetValue|1]%#! $chariot_chance_to_win$ #weak (อัตราต่อรอง [root_scope.MakeScope.Var('wager_target').Var('odds_win_a').GetValue]:[root_scope.MakeScope.Var('wager_target').Var('odds_win_b').GetValue])#!\n$chariot_win_desc$\n$chariot_payout$ #P [root_scope.MakeScope.Var('wager_target').Var('win_payout').GetValue|1]x#!"
 chariot_race.0120.b: "ที่หนึ่งหรือสอง: เข้าที่ก็เพียงพอแล้ว"
 chariot_race.0120.b.tt: "เป้าหมายการเดิมพันของท่านต้องเข้าเส้นชัยเป็นอันดับหนึ่งหรือสอง"
