l_english: 
 
 activity_chariot_race: "การแข่งรถม้า"
 activity_chariot_race_desc: "ในฐานะ [GetPlayer.GetTitleAsNameNoTooltip] ข้าเพียงผู้เดียวที่อาจจัดการแข่งรถม้าอันตระการตาเพื่อสร้างความตื่นเต้นให้แก่ [Glossary( 'ฮอย โพลลอย', 'HOI_POLLOI_GLOSS')] และดึงดูดบุคคลสำคัญของ [GetPlayer.GetPrimaryTitle.GetTierAsNameNoTooltip|l] มายังเมืองหลวง\n\nผ่านโอกาสสาธารณะเหล่านี้ ประชาชนจะรู้จักข้าในฐานะเจ้านายของพวกเขา ในเสียงโห่ร้องของฝูงชน ข้าอาจหวังว่าจะได้ยินเสียงแซ่ซ้องสรรเสริญ"
 activity_chariot_race_destination_selection: "ท่านสามารถจัดการแข่งรถม้าได้เฉพาะใน [capital|E] ของท่านเท่านั้น"
 activity_chariot_race_host_desc: "$BULLET_WITH_TAB$ อาจได้รับ @influence_icon![influence|E]\n$BULLET_WITH_TAB$ อาจได้รับ [GetLocalPlayerLegitimacyTextIcon][legitimacy|E]\n$BULLET_WITH_TAB$ อาจได้รับ @gold_icon![gold|E]\n$BULLET_WITH_TAB$ อาจได้รับ #N #EMP หรือเสีย#!#! [county_opinion|E]"
 activity_chariot_race_guest_desc: "\n#weak แม้จะเป็นที่คาดหวังของทุกคนในอาณาจักร การเข้าร่วมการแข่งรถม้าในฮิปโปโดรมมอบโอกาสในการคลุกคลีกับชนชั้นสูงของจักรวรรดิและเพิ่ม [influence|E] ของท่าน\n\nแขกทุกคนต้องชำระค่าธรรมเนียมเข้าชมเล็กน้อยจำนวน [gold_i][EmptyScope.ScriptValue('chariot_race_entrance_fee')|0]"
 activity_chariot_race_conclusion_desc: "[GetActivityType( 'activity_chariot_race' ).GetName] ได้สิ้นสุดลงแล้ว"
 activity_chariot_race_selection_tooltip: "จัดการแข่งรถม้าอันยิ่งใหญ่เพื่อเอาใจสาธารณชนและตอกย้ำตำแหน่งของท่านในฐานะ [GetPlayer.GetTitleAsNameNoTooltip]\n\nรางวัลที่คาดว่าจะได้รับ:\n$BULLET_WITH_TAB$@influence_icon![influence|E]\n$BULLET_WITH_TAB$@gold_icon![gold|E]"
 HOI_POLLOI_GLOSS: "มีความหมายตามตัวอักษรว่า "คนจำนวนมาก" คำภาษากรีกโบราณนี้หมายถึงชนชั้นล่างในสังคมไบแซนไทน์ (สามัญชน)" # Added Thai explanation

 chariot_race_honorary_guest: "แขกผู้มีเกียรติ"
 chariot_race_honorary_guest_traveling: "$chariot_race_honorary_guest$"
 activity_window_character_chariot_race_honorary_guest: "[honorary_guest|E]\n[Character.GetShortUINameNoTooltip|U]"
 activity_window_character_chariot_race_honorary_guest_traveling: "$activity_window_character_chariot_race_honorary_guest$"
 chariot_race_honorary_guest_concept: "[honorary_guest|E]"
 chariot_race_honorary_guest_for_host: "$chariot_race_honorary_guest$"
 chariot_race_honorary_guest_regular: "$honorary_guest$"
 chariot_race_honorary_guest_regular_for_host: "$honorary_guest$"
 chariot_race_honorary_guest_desc: "$chariot_race_honorary_guest_desc_for_host$"
 chariot_race_honorary_guest_desc_for_host: "เจ้าภาพอาจเชิญตัวละครเข้าร่วมใน [Glossary( 'คาทิสม่า', 'KATHISMA_GLOSS')] หากต้องการ สิ่งนี้มอบโอกาสมากมายในการปฏิสัมพันธ์กับตัวละครนี้ — ไม่ว่าจะดีขึ้นหรือแย่ลง"
 chariot_race_honorary_guest_regular_desc: "$honorary_guest_desc$"
 chariot_race_honorary_guest_regular_desc_for_host: "$honorary_guest_desc$"
 activity_invite_rule_charioteers: "นักแข่งรถม้า"
 activity_chariot_race_guest_help_text: "แม้จะเป็นที่คาดหวังของทุกคนในอาณาจักร การเข้าร่วมการแข่งรถม้าในฮิปโปโดรมมอบโอกาสในการคลุกคลีกับชนชั้นสูงของจักรวรรดิและเพิ่ม [influence|E] ของท่าน\n\nแขกทุกคนต้องชำระค่าธรรมเนียมเข้าชมเล็กน้อยจำนวน [gold_i][EmptyScope.ScriptValue('chariot_race_entrance_fee')|0]"
 activity_chariot_race_predicted_cost: "ค่าใช้จ่ายของ [GetActivityType( 'activity_chariot_race' ).GetNameNoTooltip] ได้รับผลกระทบหลักจาก [activity_options|E] ที่ท่านเลือก"
 chariot_race_base_cost_desc: "ค่าใช้จ่ายพื้นฐานของ [GetActivityType( 'activity_chariot_race' ).GetName]"


 chariot_race_gambling: "การวางเดิมพัน"
 chariot_race_gambling_desc: "ผู้เข้าร่วมยอมเสี่ยงทรัพย์สินของตน วางใจในความหวัง คำอธิษฐาน เพื่อทีมโปรดของพวกเขา"
 chariot_race_phase: "การแข่งขัน"
 chariot_race_phase_desc: "ทรายฟุ้งกระจาย แส้ฟาดดังเปรี้ยงปร้าง และฮิปโปโดรมคำรามกึกก้อง!"
 chariot_race_phase_ceremony: "พิธีการ"
 chariot_race_phase_ceremony_desc: "องค์อธิปัตย์ผู้รุ่งโรจน์ของเราประกาศเกียรติคุณผู้ชนะการแข่งขัน"

 chariot_option_entertainment: "มหรสพ"
 chariot_entertainment_bad: "ความบันเทิงเล็กน้อย"
 chariot_entertainment_bad_desc: "$EFFECT_LIST_BULLET$ ได้รับ [legitimacy|E] เล็กน้อย\n$EFFECT_LIST_BULLET$@alert_icon! #alert_trial ปรับตาม [county_opinion|E] ใน [capital|E]#!\n\n#weak เป็นเวลาหลายร้อยปีที่การแข่งขันได้ตอกย้ำความผูกพันระหว่างผู้ปกครองและประชาชน เป็นเครื่องพิสูจน์ถึงความยิ่งใหญ่และความเอื้อเฟื้อเผื่อแผ่ หากพิธีการดำเนินไปได้ด้วยดี ก็ไม่ควรต้องมีสิ่งอื่นใดอีก#!"
 chariot_entertainment_normal: "พิธีการตามประเพณี"
 chariot_entertainment_normal_desc: "$EFFECT_LIST_BULLET$ ได้รับ [legitimacy|E] และ [county_opinion|E] ปานกลาง\n$EFFECT_LIST_BULLET$@alert_icon! #alert_trial ปรับตาม [county_opinion|E] ใน [capital|E]#!\n\n#weak ระหว่างการแข่งขัน ประชาชนจะเพลิดเพลินกับการแสดงละครใบ้ กายกรรม และนักโทษในโซ่ตรวน บุคคลสำคัญที่มาเยือนจะได้รับการต้อนรับอย่างเป็นทางการจากจักรวรรดิ#!"

chariot_entertainment_good: "ความสุขสำราญสำหรับมวลชน"
 chariot_entertainment_good_desc: "$EFFECT_LIST_BULLET$ ได้รับ [legitimacy|E] และ [county_opinion|E] อย่างมาก\n$EFFECT_LIST_BULLET$@alert_icon! #alert_trial ปรับตาม [county_opinion|E] ใน [capital|E]#!\n\n#weak แขกผู้มีเกียรติสูงสุดของเราจะได้รับนกยูง หนังเซเบิล น้ำหอม: ของขวัญชั้นดีจากจักรวรรดิ! และนักแสดงทุกประเภทจะเนืองแน่นในฮิปโปโดรม พร้อมทั้งขนมปังและเหรียญที่จะถูกโยนขึ้นไปบนอัฒจันทร์#!"

 chariot_race_host_rewards_title: "รางวัลสำหรับเจ้าภาพ"
 chariot_race_reward_high_county_opinion_tt: "#weak รางวัลดีขึ้น เนื่องจาก [county_opinion|E] สูงใน [capital|E]"
 chariot_race_reward_low_county_opinion_tt: "#weak รางวัลแย่ลง เนื่องจาก [county_opinion|E] ต่ำใน [capital|E]"

 CHARIOTEER_APTITUDE_GUI_TOOLTIP: "[aptitude|E] ในการแข่งรถม้าของ [Character.GetFirstNamePossessiveNoTooltip] คือ [Character.GetCourtPositionAptitude( GetCourtPositionType( 'charioteer_court_position' ) )]"
 YOUR_CHARIOTEER_TOOLTIP: "ท่านจ้าง [Character.GetShortUIName] เป็น [GetCourtPositionType( 'charioteer_court_position' ).GetName] ของท่าน"
 YOUR_WAGER_TOOLTIP: "[GetPlayer.Custom('BuildChariotRaceWagerTooltip')]" # Requires custom function translation if needed

 every_losing_charioteer_xp_gain: "นักแข่งรถม้าคนอื่นๆ ทั้งหมดได้รับ #high 3#! [trait_level_track_xp|E]"

 ### INTENTS ###
 increase_influence_intent: "เพิ่มอิทธิพล"
 increase_influence_intent_desc: "เมื่อเหล่า [strategoi|E] และ [noble_families|E] ทั้งหมดรวมตัวกันในฮิปโปโดรม ท่านจะมุ่งเน้นไปที่การคลุกคลีตีโมงและเพิ่มพูน [influence|E]"
 sow_discord_intent: "หว่านความขัดแย้ง"
 sow_discord_intent_desc: "ไม่มีโอกาสใดดีไปกว่านี้ในการบ่อนทำลาย [county_control|E] และ [county_opinion|E] ของเมืองหลวง ทำให้การปกครองของ [GetPlayer.GetTopLiege.GetTitleAsNamePossessiveNoTooltip] เสื่อมเสียเพื่อประโยชน์ของผู้สืบทอดที่มุ่งหวังของ [GetPlayer.GetTopLiege.GetHerHis]... กลยุทธ์ที่มีประสิทธิภาพที่สุดในการต่อต้านองค์อธิปัตย์ที่ไม่เป็นที่นิยม"
 appease_populace_intent: "เอาใจประชาชน"
 appease_populace_intent_desc: "ท่านตั้งเป้าที่จะเพิ่ม [legitimacy|E] และ [county_opinion|E] ใน [realm_capital|E] ของท่าน [GetPlayer.GetCapitalLocation.GetNameNoTooltip] สิ่งนี้จะต่อต้านผู้เข้าร่วมที่ใช้ [intent|E] $sow_discord_intent$ ด้วยความเป็นปรปักษ์ต่อท่าน"

 ### INTRO ###
 chariot_race.0001.t: "นครที่รอคอย"
 chariot_race.0001.desc: "เบื้องล่าง [Glossary( 'คาทิสม่า', 'KATHISMA_GLOSS')] อันสูงส่งของข้า รูปปั้นอันยิ่งใหญ่ของฮิปโปโดรมถูกขัดเงา ผืนทรายถูกกวาดอย่างระมัดระวัง และที่นั่งสำหรับผู้ชมหลายพันคนถูก ทำให้สะอาด\n\nในขณะเดียวกัน ถนนของ [ROOT.Char.GetCapitalLocation.GetTitle.GetNameNoTier] ก็เต็มไปด้วยความคาดหวัง นักการเมืองทุกฝ่ายต่างส่งเสียงโหวกเหวกข้อความของตนขณะที่นักเดินทางเริ่มแย่งชิงที่พัก... และแม้ แต่ในวัง ทุกการสนทนาก็หันไปหาเรื่องปราซินอยและเวเนตอย"
 chariot_race.0001.desc_spectator: "[host.GetCapitalLocation.GetTitle.GetNameNoTier] เต็มไปด้วยเสียงอึกทึกและความคาดหวัง: การแข่งขันใกล้จะมาถึงแล้ว! จากโรงเตี๊ยมริมถนน การคาดเดาเกี่ยวกับการปรากฏตัวต่อสาธารณะของ [host.GetTitleAsNamePossessive] ก็แพร่สะพัดออกไป จะมีการเรียกร้องคำมั่นสัญญาหรือไม่? ความกังวลของ [Glossary( 'ฮอย โพลลอย', 'HOI_POLLOI_GLOSS')] จะได้รับการแก้ไขหรือไม่? และคำตอบใดจะถูกตะโกน ร้องเพลง?\n\nความรู้สึกของท้องถนนปั่นป่วนอยู่แล้วระหว่างผู้ที่ถูกปลุกปั่นโดยสายลับของจักรวรรดิ และผู้ที่ถูกปลุกปั่นด้วยความร้อนแรงอื่น ๆ แต่เหนือสิ่งอื่นใด มีข้อพิพาทอันร้อนแรงอยู่ประการหนึ่ง: นักแข่งคนใดจะคว้าชัยชนะในฮิปโปโดรม!"
 chariot_race.0001.a: "ให้เหล่าเดเมสถูกปลุกเร้า!"

 KATHISMA_GLOSS: "พลับพลาของจักรพรรดิในฮิปโปโดรม บันไดเวียนเชื่อมต่อพื้นที่ชมนี้กับพระราชวัง ทำให้บาซิลิอุสเข้าออกได้สะดวก... และเป็นทางออกที่ปลอดภัย"
 DEMES_GLOSS: "องค์กรการกีฬาและการเมืองที่เน้นการแข่งรถม้า ครั้งหนึ่ง #EMP เดเมส#! เคยมีบทบาทสำคัญในชีวิตพลเมือง แต่ได้เสื่อมถอยลงและอยู่ภายใต้การควบคุมของจักรวรรดิ"
 QUADRIGA_GLOSS: "รถม้าสี่ม้า รวดเร็ว อันตราย และมีราคาแพง #EMP เททริปปา#! หรือ #EMP ควอดริกา#! เป็นพาหนะที่โปรดปรานของกษัตริย์ จักรพรรดิ และเทพเจ้าตั้งแต่สมัยโบราณ"

 ### BETTING ###
 chariot_race.0100.t: "เปิดรับเดิมพัน"
 chariot_race.0100.desc: "#EMP กริ๊ง! กริ๊ง! กริ๊ง!#!\n\nระฆังของ [GetCourtPositionType('bookmaker_court_position').GetName()] ส่งสัญญาณว่าสามารถวางเดิมพันกับทีมที่แข่งขันกันมา แต่โบราณได้แล้ว\n\n"
 chariot_race.0100.desc.emperor: "ตามตำแหน่งอันสูงสุดของข้า [GetCourtPositionType('bookmaker_court_position').GetNameNoTooltip] ถูกนำเสนอต่อหน้าข้า และหมอบกราบ [bookmaker.GetHerselfHimself] ขณะที่ข้าพิจารณาการเดิมพันของข้า การตัดสินใจนี้ไม่ใช่เรื่องเล็กน้อย: ผลที่ตามมาของการสนับสนุนนักแข่งรถม้าหรือทีมของข้ามีทั้งด้านการเงินและการเมือง"
 chariot_race.0100.desc.others: "การเดิมพันของผู้ชมที่สูงศักดิ์กว่าจะถูกรับโดยเจ้าหน้าที่ที่วิ่งวุ่น อาจมีการได้หรือเสียเหรียญจำนวนมาก... และ รวมถึงสถานะด้วย ระหว่างแฟนๆ เพื่อนร่วมทีมและคู่แข่ง"
 chariot_race.0100.a: "ข้าหนุน #charioteer_blue ฝ่ายสีน้ำเงิน#!#!." # เวเนทอย
 chariot_race.0100.b: "ข้าหนุน #difficulty_easy ฝ่ายสีเขียว#!." # ปราซินอย
 chariot_race.0100.c: "ข้าหนุน #bold ฝ่ายสีขาว#!." # ลิวคอย
 chariot_race.0100.d: "ข้าหนุน #difficulty_hard ฝ่ายสีแดง#!." # รูซิออย
 chariot_race.0100.e: "ไม่วางเดิมพัน"
 
 chariot_race.0110.t: "วีรบุรุษแห่งสนามแข่ง"
 chariot_race.0110.desc: "[root_scope.Custom('GetChariotTeamColorPluralGlossed')] กำลังส่งกลุ่มนักขับฝีมือดีลงสนาม ซึ่งชื่อของพวกเขาเป็นที่สรรเสริญในตลาดอย่างแน่นอน เด็กๆ เอ่ยถึงด้วยความเคารพ แม้ แต่ราชสำนักก็ยังประจบประแจงและหลงใหลพวกเขา!\n\nข้า #EMP สามารถ#! วางเดิมพันกับนักแข่งคนดังเหล่านี้คนใดก็ได้ แต่บางทีอาจไม่มีคู่แข่งคนใดคนหนึ่งที่โดดเด่นกว่าใคร..."

 chariot_odds_to_win: "อัตราต่อรองที่จะ #HIGH ชนะ#!:"
 chariot_odds_to_place: "อัตราต่อรองที่จะ #HIGH เข้าที่#!:" # Place = เข้าที่ 1 หรือ 2
 chariot_odds_to_show: "อัตราต่อรองที่จะ #HIGH ติดอันดับ#!:" # Show = เข้าที่ 1, 2 หรือ 3
 chariot_chance_to_win: "โอกาสที่จะ #HIGH ชนะ#!"
 chariot_chance_to_place: "โอกาสที่จะ #HIGH เข้าที่#!"
 chariot_chance_to_show: "โอกาสที่จะ #HIGH ติดอันดับ#!"
 chariot_payout: "เงินรางวัล:"
 chariot_win_desc: "เป้าหมายการเดิมพันของท่านต้องเข้า #HIGH ที่หนึ่ง#!"
