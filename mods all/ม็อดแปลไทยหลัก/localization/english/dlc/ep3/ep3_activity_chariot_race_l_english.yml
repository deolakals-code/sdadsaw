 chariot_race_whites_statue_county_modifier: "นักแข่งรถม้าผู้ทรงเกียรติแห่งเลอคอย"
 chariot_race_whites_statue_county_modifier_desc: "หลังจากนักแข่งรถม้าแห่งเลอคอยประสบอุบัติเหตุอันน่าสลดใจในฮิปโปโดรม พลาดการเข้าเส้นชัยเป็นอันดับหนึ่งไปเพียงเล็กน้อย จักรพรรดิได้สร้างรูปปั้นเพื่อเป็นเกียรติแก่พวกเขา"
 chariot_race_reds_statue_county_modifier: "นักแข่งรถม้าผู้ทรงเกียรติแห่งรูซิออย"
