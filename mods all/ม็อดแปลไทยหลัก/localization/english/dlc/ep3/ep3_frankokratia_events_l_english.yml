 if_byz_dissolves_tt: "@warning_icon! #X หาก [GetTitleByKey('e_byzantium').GetName] สลายตัว:#!"
 become_daddys_vassal_tt: "ท่านจะกลายเป็น [vassal|E] ของ #high [daddy.GetNamePossessive]#! "
 become_daddy_2_vassal_tt: "ท่านจะกลายเป็น [vassal|E] ของ #high [daddy_2.GetNamePossessive]#! "
