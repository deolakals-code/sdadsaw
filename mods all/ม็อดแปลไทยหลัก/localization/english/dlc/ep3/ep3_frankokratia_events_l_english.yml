frankokratia_leaders_lose_excommunicated: "นักรบครูเสดที่เกี่ยวข้องทั้งหมดสูญเสีย [GetTrait('excommunicated').GetName( GetNullCharacter )]"
frankokratia_leaders_gain_identical_force: "นักรบครูเสดที่เกี่ยวข้องทั้งหมดได้รับ [army|E] ที่คล้ายกัน"
