 remain_daddy_2_vassal_tt: "ท่านจะยังคงเป็น [vassal|E] ของ [daddy_2.GetShortUINamePossessive]"
 greeks_more_likely_to_vassalize_tt: "ชาวกรีกและ [cultures|E] ที่สืบเชื้อสายมาจากพวกเขาจะมีแนวโน้มที่จะยอมรับ [vassalization|E] มากขึ้น"
 latin_emp_simp_modifier: "ผู้เลียนแบบชาวกรีก"
 latin_emp_simp_modifier_desc: "อัศวินละตินของประมุของค์นี้แสดงความดูถูก; ข้าในบังคับของพวกเขาเสียใจกับสิทธิและเสรีภาพที่สูญเสียไปให้กับการเลียนแบบการปกครองแบบรวมศูนย์ของกรีก"

 ep3_frankokratia_events.0120.t: "วิถีแห่งจักรพรรดิ"
 ep3_frankokratia_events.0120.hippodrome: "ข้าคือเจ้าแห่ง [ROOT.Char.GetCapitalLocation.GetTitle.GetNameNoTier] อันงดงามและถูกทิ้งร้าง [Glossary( 'พระราชวังบลาเคอร์แน', 'BLACHERNAE_PALACE_GLOSS')] ฮาเกียโซเฟีย ฮิปโปโดรมโบราณ..."
 ep3_frankokratia_events.0120.estate: "ข้าคือเจ้าแห่ง [ROOT.Char.GetCapitalLocation.GetTitle.GetNameNoTier] และมีสิทธิ์เลือกพระราชวังของมัน ห้องโถงหินอ่อน โมเสกทองคำ กำแพงที่ได้รับการคุ้มครองจากพระเจ้า..."
 ep3_frankokratia_events.0120.desc: "ขณะที่ข้าจ้องมองออกไป ข้าก็ได้รับความกระจ่างจากสิ่งมีชีวิตในระบบราชการกรีก แต่ [eunuch.GetTitledFirstName] ขันทีผู้ชาญฉลาดคนนี้ กลับกล้าหาญขึ้น\n\n"เป็นเวลาหลายศตวรรษที่บาซิลิอุสผู้รุ่งโรจน์ของเรากุมอำนาจ เช่นนี้! ท่านลองจินตนาการดูสิ [ROOT.Char.GetLadyLord] ว่าทั้งอาณาจักรรอคอยราชโองการของท่าน? แม้จะไม่มีสิทธิ์ทางสายเลือดหรือของที่ปล้นมาจากสงครามมาเสนอให้พวกเขาก็ตาม?"\n\nช่างเป็นอำนาจเสียนี่กระไร! ข้าในบังคับชาวละตินของข้า สุนัขล่าเนื้อที่ถูกปล่อยไปของข้า จะทนยุติการปล้นสะดมตำแหน่งข้าราชการกรีกได้หรือไม่? พวกเขาจะสวมปลอกคอกรีกที่คับแน่นหรือไม่...?"
 ep3_frankokratia_events.0120.a: "มีธรรมเนียมกรีก #EMP หนึ่ง#! หรือ #EMP สอง#! อย่างที่ข้าชื่นชม..."
 ep3_frankokratia_events.0120.a.flavor: "#EMP ...การลงโทษอันน่าสยดสยองของพวกเขา!#! ความกลัวในอำนาจของจักรวรรดิ! ให้เครื่องราชกกุธภัณฑ์ของชาวกรีกเติมเต็มคลังของข้า!"
 ep3_frankokratia_events.0120.b: "ข้าจะยอมไว้วางใจชาวกรีก และวิถีทางของพวกเขา..."
 ep3_frankokratia_events.0120.b.flavor: "ขอให้มันห่อหุ้มข้าไว้ในความรุ่งโรจน์โบราณ!"
 ep3_frankokratia_events.0120.c: "พวกเราชาวละตินมาถึงแล้ว ทุกสิ่งที่นี่ — เป็นของเรา!"
ep3_frankokratia_events.0120.c.flavor: "เราจะปกครอง สักการะ และปล้นสะดมตามใจชอบ!"
emulating_byz_punishment_tt: "จักรพรรดิ [GetTitleByKey('e_latin_empire').GetAdjective] และ [vassals|E] ของพวกเขาอาจตอนหรือ ทำให้ [prisoners|E] ตาบอดได้"
latin_emp_enables_byz_punishment_t: "[latin_emp.GetTitleAsNameNoTooltip] รับรองการทรมานแบบกรีก"
latin_emp_enables_byz_punishment_desc: "เพื่อที่จะควบคุมพวกกรีกที่ชอบแทงข้างหลัง เราต้องโหดเหี้ยมยิ่งกว่าพวกเขา"

ep3_frankokratia_events.0121.opening: "[ROOT.Char.GetTitledFirstNameRegnal] ข้าในบังคับคนใหม่ของข้า"
ep3_frankokratia_events.0121.intro: "พวกเรา ซึ่งครั้งหนึ่งเคยเป็นผู้แสวงบุญติดอาวุธ พบว่าตนเองในที่ดินศักดินาใหม่ของเรา มีจำนวนน้อยกว่ามาก\n\n"
ep3_frankokratia_events.0121.desc_torture: "แต่พวกกรีกที่ชอบแทงข้างหลังเหล่านี้มีความกล้าหาญเทียบเท่าเราหรือไม่? พวกเขามีความมุ่งมั่นเพียงพอที่จะป้องกันไม่ให้เราอ้างสิทธิ์ใน [latin_emp.GetPrimaryTitle.GetTierAsName] ทั้งหมดของเราหรือไม่?\n\nเราต้องทำลายพวกเขา เราต้องโหดเหี้ยมเหมือนพวกเขา"
ep3_frankokratia_events.0121.desc: "แต่ที่นี่ — ช่างมีความมั่งคั่งมากมายให้ยึดครอง! อย่าลดทอนหัวใจอันร้อนแรงของท่าน: จงทำทุกอย่างที่ต้องทำเพื่อความเจริญรุ่งเรืองในดินแดนนี้ อย่ายอมให้ข้าราชการกรีกที่ขี้ขลาด หรือพวกเศรษฐีรักร่วมเพศ มาขวางทางท่าน!"
ep3_frankokratia_events.0121.a: "ข้ามาเพื่อแสวงหารางวัล! ข้าจะไม่ยอมถูกเคลื่อนย้ายโดยง่าย!"
ep3_frankokratia_events.0121.a.flavor: "[ROOT.Char.GetLiege.Custom('KnightCulturePluralNoTooltip')|l] ของข้าจะเข้าโจมตี [ROOT.Char.GetPrimaryTitle.GetNameNoTierNoTooltip] ทั้งหมด!"
ep3_frankokratia_events.0130.t: "การฟื้นฟู [GetTitleByKey('e_byzantium').GetAdjectiveNoTooltip]"
ep3_frankokratia_events.0130.desc: "อาณาจักรอันทรงเกียรติ! ดาวเหนือที่นำทางดวงวิญญาณคริสเตียนทั้งปวง! กองทองคำที่ตั้งตระหง่านอยู่ ณ จุดศูนย์กลางของโลก บางครั้งเป็นอย่างหนึ่ง บางครั้งเป็นอย่างอื่น และบ่อยครั้งเป็นรังของอสรพิษร้าย: ไม่ว่ามันเคยเป็นอะไร และบัดนี้กลับมาเป็นอีกครั้ง — [GetTitleByKey('e_byzantium').GetName] ได้กลับมาแล้ว\n\nนี่เป็นยุคที่มืดมนและน่าอัปยศสำหรับประชากร [GetTitleByKey('e_byzantium').GetAdjectiveNoTooltip] ที่แตกสลาย แต่ ทว่า ขณะที่เถ้าถ่านแห่งการพิชิตของละตินเย็นลง บัดนี้แสงสว่างและความหวังก็บังเกิดขึ้น ในไม่ช้า บางที ทุกคนอาจรวมตัวกันภายใต้การปกครองของ [byz_emperor.GetTitledFirstNameRegnal]!\n\n"
ep3_frankokratia_events.0130.latin_emp: "แต่กระนั้น... ผู้อ้างสิทธิ์ [latin_emperor.GetTitleAsName] [latin_emperor.GetPrimaryTitle.GetAdjective] ยังคงต่อต้านอยู่ จาก [latin_emperor.GetCapitalLocation.GetName] ราชสำนักของ [latin_emperor.GetHerHis] ก็สาดคำสาปแช่งใส่พิธีราชาภิเษกครั้งประวัติศาสตร์นี้..."
ep3_frankokratia_events.0130.unopposed: "คู่แข่งชาวละตินและความทะเยอทะยานของพวกเขาถูกโยนทิ้งลงในกองขยะแห่งประวัติศาสตร์ ดังนั้นจึงเริ่มต้นยุค [GetTitleByKey('e_byzantium').GetAdjectiveNoTooltip] ใหม่"
ep3_frankokratia_events.0130.a: "อำลา #EMP แฟรงโกคราเทีย#!."

msg_greek_anarchy_cb_loss.t: "อนาธิปไตยกรีกสิ้นสุดลง"
msg_greek_anarchy_cb_loss.desc: "ความไม่แน่นอนอันรุนแรงที่เริ่มต้นด้วยการล่มสลายของ [GetTitleByKey('e_byzantium').GetName] ได้จางหายไปจากความเกี่ยวข้อง"
lose_greek_anarchy_cb_tt: "#high ยึดดัชชีแห่งจักรวรรดิ#! [casus_belli|E] ไม่มีให้ใช้อีกต่อไป"
