 ep3_frankokratia_events.0090.t: "จงระลึกไว้ ท่านคือ [GetTitleByKey('e_byzantium').GetAdjectiveNoTooltip]!"
 ep3_frankokratia_events.0090.desc: "มณฑล เช่น [kingdom_1.GetNameNoTier] ได้อดทนต่อยุคสมัยอันน่าสงสัย — และถูกปฏิเสธการปกครองอันอ่อนโยนของประมุข [GetTitleByKey('e_byzantium').GetAdjective] — มานานเกินไปแล้ว\n\nแต่บัดนี้ — ประชาชนชาว [kingdom_1.GetAdjectiveNoTooltip] อาจยินดีได้! พวกเขาไม่ต้องคุกเข่าให้พวกอันธพาลแฟรงก์! ทุ่งนา [kingdom_1.GetAdjectiveNoTooltip] ที่ได้รับการไถพรวนมานาน จะไม่เหี่ยวเฉาภายใต้กีบเท้าม้าศึก"
 ep3_frankokratia_events.0090_emp: "มาเถิด [Glossary('ฮอย โพลลอย', 'HOI_POLLOI_GLOSS' )]: จงประดับรูปเคารพของท่านให้สูงส่งด้วยความภาคภูมิใจ และเฉลิมฉลองการกลับมาของระเบียบอันศักดิ์สิทธิ์ของ [ROOT.Char.GetFaith.HighGodNamePossessive]!\n\nชนชาติเหล่านี้ได้รวมกันอีกครั้งภายใต้ [ROOT.Char.GetTitleAsName] ของพวกเขา; เมื่อความมั่งคั่งของแผ่นดินไหลเข้าสู่พระราชวัง พวกเขาก็จะได้รับเกียรติยศและความรุ่งโรจน์ทั้งหมดที่บรรพบุรุษของพวกเขาเคยรู้จัก"
ep3_frankokratia_events.0090_non_emp: "และคนธรรมดาสามัญ เช่นเดียวกับผู้คนใน [kingdom_1.GetTierAsNameNoTooltip] อาจฝันได้อย่างอิสระ... ถึงการกลับมาของเจ้าเหนือหัวที่แท้จริงของพวกเขา\n\nถึงเวลาแล้วที่การปกครองของชาวละตินจะต้องสิ้นสุดลง"
 ep3_frankokratia_events.0090.a: "ใน [kingdom_1.GetNameNoTierNoTooltip] ขอให้ช่วงเวลาอันมืดมนถูกลืมเลือน!"
 ep3_frankokratia_events.0090.b: "จงมองไปยัง #EMP ออโต้คราเตอร์#! [kingdom_2.GetNameNoTierNoTooltip]!"
 ep3_frankokratia_events.0090.c: "[kingdom_3.GetNameNoTierNoTooltip] รู้จักสีม่วงหลวง!"
 ep3_frankokratia_events.0090.d: "สู่คอกแห่งจักรวรรดิ: จงกลับมา [kingdom_4.GetNameNoTierNoTooltip]"
 ep3_frankokratia_events.0090.e: "[kingdom_5.GetNameNoTierNoTooltip] ของ [GetTitleByKey('e_byzantium').GetAdjectiveNoTooltip] อีกครั้ง!"

msg_latin_de_jure_gain.t: "ชาวละตินอ้างสิทธิ์โดยนิตินัย"
msg_latin_de_jure_gain.desc: "[title_gainer.GetName] ได้ฉีก [swapped_kingdom.GetName] ออกจาก [GetTitleByKey('e_byzantium').GetName] สถาปนาอำนาจอธิปไตย [de_jure|E] ของ [title_gainer.GetHerHis]"
msg_byz_de_jure_gain.t: "สิทธิ์ [GetTitleByKey('e_byzantium').GetAdjectiveNoTooltip] ได้รับคืน"
msg_byz_de_jure_gain.desc: "[title_gainer.GetName] ได้กู้คืน [swapped_kingdom.GetName] จากการครอบครอง [de_jure|E] ของ [GetTitleByKey('e_latin_empire').GetAdjective]"
swap_latin_for_byz_titles_tt: "[titles|E] [de_jure|E] ทั้งหมดของ [GetTitleByKey('e_latin_empire').GetAdjective] จะถูกส่งคืนให้กับ [GetTitleByKey('e_byzantium').GetName]"

 ep3_frankokratia_events.0100.t: "แฟรงโกคราเทีย แตกสลาย"
 ep3_frankokratia_events.0100.desc: "เพื่อทายาทแห่งนักบุญเปโตร เพื่อนักบุญมาระโก เพื่อเหรียญฟลอรินและเหรียญดูคัท — [GetTitleByKey('e_byzantium').GetName] จึงถูกทำลายล้าง\n\nตั้งแต่นั้นมา ครั้งแล้วครั้งเล่า ขุนนาง [GetTitleByKey('e_latin_empire').GetAdjective] ได้ขี่ม้าออกไปพร้อมกับอัศวินของพวกเขา ในตอนแรก ทุกคนสวมชุดเกราะทองคำและลุกโชนด้วยจุดมุ่งหมาย แต่เมื่อเร็วๆ นี้... ความหวังของประมุข [latin_emp.GetTitledFirstNamePossessiveRegnal] ของพวกเขาก็เบาบาง เป็นสิ่งเล็กน้อย [latin_emp.GetHerHis|U] ภารกิจรู้จักเพียงการยอมจำนนอย่างขมขื่น\n\n[GetTitleByKey('e_latin_empire').GetName] สิ่งน่ารังเกียจที่ถือกำเนิดขึ้นในคริสตจักร ไม่เคยถูกกำหนดให้เป็น เช่นนั้น"
 ep3_frankokratia_events.0100.byz_no_emp: "ด้วยการทำลายล้างของมัน — [Glossary( 'โรไมออส', 'ROMAIOS_GLOSS' )] ผู้ยิ่งใหญ่คนใดจะอยู่นิ่งเฉยได้อย่างไร? บาซิลิอุสผู้ทรงพลัง #EMP บาซิลิอุสของเรา#! จะต้องผ่าน [Glossary( 'ประตูทองคำ', 'GOLDEN_GATE_GLOSS' )] อย่างมีชัยในไม่ช้า\n\nเพราะอาณาจักร [GetTitleByKey('e_latin_empire').GetAdjective] ไม่มีอีกต่อไปแล้ว!"
 ep3_frankokratia_events.0100.cath: "นักรบครูเสดของเราถูกหลอกให้หลงไปในความโอหังอันทรยศหรือไม่? แสงแห่งความยิ่งใหญ่ของกรีก #EMP ทำให้เราตาบอดหรือไม่?#! แม้ แต่พระสันตะปาปาเองก็ยังยกย่องรัฐละตินของเราในหมู่ชาวกรีก..."
 ep3_frankokratia_events.0100.emp: "ทายาทที่แท้จริงของคอนสแตนติน คือ [byz_emp.GetTitledFirstNameRegnal]... [byz_emp.GetSheHe] ผู้ ซึ่งอาจจะซ่อมแซมยุคแห่งความเสียหายอันร้ายแรงนี้ และยกปราการอันยิ่งใหญ่แห่งบอสพอรัสขึ้นอีกครั้ง"
 ep3_frankokratia_events.0100.a_non_catholic: "มันมาจาก [ROOT.Char.GetFaith.NegativeAfterLife] สู่ [ROOT.Char.GetFaith.NegativeAfterLife] มันก็กลับไป"
 ep3_frankokratia_events.0100.a_catholic: "เราฝันอย่างไร้ค่าที่จะถวายพระเกียรติแด่ [ROOT.Char.GetFaith.HighGodName] บนโลก..."
 custom.greek_anarchy_rulers: "ทุก [ruler|E] ที่มีดินแดน [GetTitleByKey('e_latin_empire').GetAdjective] หรือ [GetTitleByKey('e_byzantium').GetAdjective]"
