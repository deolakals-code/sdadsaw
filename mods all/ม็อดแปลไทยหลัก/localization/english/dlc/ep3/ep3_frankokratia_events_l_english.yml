every_crusader_gets_paid_sacking: "นักรบครูเสดที่เกี่ยวข้องทุกคนได้รับ @gold_icon!#P [ep3_sacking_byz_capital_payoff_value|P0]#!"
sacked_imperial_capital_cultural_acceptance: "เมืองหลวงอันยิ่งใหญ่ถูกปล้นสะดมอย่างโหดเหี้ยม"
latin_empire_creation_tooltip: "#P #high [GetTitleByKey('e_latin_empire').GetName|U]#! จะมอบให้กับ [holder|E] ที่ท่านเลือก#!"
latin_empire_land_distribution_tooltip: "[counties|E] [claimant.GetPrimaryTitle.GetAdjective] ภายใน [latin_kingdom_1.GetName] จะถูกแจกจ่ายในหมู่นักรบครูเสดที่เกี่ยวข้อง"
latin_empire_claim_distribution_tooltip: "[claims|E] ต่อ [kingdoms|E] [claimant.GetPrimaryTitle.GetAdjective] จะถูกแจกจ่ายในหมู่ผู้รับตำแหน่ง"
imperial_capital_sacked_fervor_gain: "เมืองหลวงคริสเตียนอันยิ่งใหญ่ถูกปล้นสะดมอย่างโหดเหี้ยมโดยชาวคาทอลิก"

ep3_frankokratia_events.0060.t_latin_empire: "แฟรงโกคราเทีย"
ep3_frankokratia_events.0060.t: "อินทรียังคงโบยบิน"
ep3_frankokratia_events.0060.desc_latin_empire: "[GetTitleByKey('e_byzantium').GetName|U] ไม่มีอีกต่อไปแล้ว ประมุขผู้ทรงอำนาจ ผู้ ซึ่งครั้งหนึ่งเคยอ้างสิทธิ์ในมรดกแห่งโรม ได้ถูกปลดออกจากตำแหน่ง พระราชวังและมหาวิหารอันงดงามกำลังคุกรุ่น ศพเน่าเปื่อยเป็นกองมหึมา ความโกลาหลเข้าครอบงำอาณาจักรที่แตกสลาย\n\nท่ามกลางเถ้าถ่านเหล่านี้ [latin_emperor.GetPrimaryTitle.GetNameNoTier] ได้รับการประกาศ — ในนามของพระคริสต์และ [pope.GetTitledFirstName]\n\nยุคสมัยอันเต็มไปด้วยภยันตรายและความแตกแยกเริ่มต้นขึ้นในดินแดนของชาวกรีก"
ep3_frankokratia_events.0060.desc_paid: "ประมุของค์ใหม่นั่งอยู่ท่ามกลางความหรูหราที่หาใดเปรียบมิได้ของ [claimant.GetCapitalLocation.GetTitle.GetNameNoTier] ซึ่งได้รับการ แต่งตั้งโดยกองกำลังละตินและได้รับการเชื่อฟังอย่างไม่เต็มใจ — ในขณะนี้ — โดยไพร่ฟ้าข้าแผ่นดินของ [claimant.GetHerHis]: [claimant.GetName]\n\nด้วยความมั่งคั่งทั้งหมดที่ [claimant.GetTitleAsNameNoTooltip] องค์ใหม่นี้สามารถรวบรวมได้ และนำกองทหาร [claimant.GetPrimaryTitle.GetAdjective] ในที่สุดนักรบครูเสดก็หันเหความสนใจไปที่อื่น"
ep3_frankokratia_events.0060.desc_leave_unpaid: "ประมุของค์ใหม่นั่งอยู่ท่ามกลางความหรูหราที่หาใดเปรียบมิได้ของ [claimant.GetCapitalLocation.GetTitle.GetNameNoTier] ซึ่งได้รับการ แต่งตั้งโดยกองกำลังละตินและได้รับการเชื่อฟังอย่างไม่เต็มใจ — ในขณะนี้ — โดยไพร่ฟ้าข้าแผ่นดินของ [claimant.GetHerHis]: [claimant.GetName]\n\nด้วยความเชื่อมั่นอันคู่ควรแก่บรรพบุรุษของ [claimant.GetHerHis] [claimant.GetTitleAsNameNoTooltip] องค์ใหม่นี้ได้ #EMP ปฏิเสธ#! ข้อเรียกร้องของนักรบครูเสด สุนัขล่าเนื้อที่ต่อสู้และคำรามเพื่อ [claimant.GetHerHim] ถูกส่งกลับไปอย่างหิวโหย\n\nราชาองค์ใหม่ครองราชย์ ใช่... แต่ก็ยังต้องสงสัยว่าทำไมนักรบครูเสดผู้หลงผิดจึงเลือกเส้นทาง เช่นนั้น แสวงหาความรอด...?"
ep3_frankokratia_events.0060.desc_loss: "#EMP "สรรเสริญ [defender.GetTitledFirstName] ผู้นำชัยชนะ! [defender.GetTitleAsNameNoTooltip]! [defender.GetTitleAsNameNoTooltip]!"#!\n\nเสียงสะท้อนนี้ดังก้องไปทั่ว [defender.GetPrimaryTitle.GetNameNoTier] — ประมุขของพวกเขาได้ขับไล่นักรบครูเสดละตินกลับลงทะเลไปแล้ว สำหรับการอ้างสิทธิ์ของ [claimant.GetNamePossessive] ในไบแซนทิอุมอันยิ่งใหญ่ ดูเหมือนว่าความโปรดปรานของพระเจ้าจะมีจำกัด\n\nช่างเป็นความอับอายอย่างร้ายแรงสำหรับนักผจญภัยที่กล้าทึกทักเอาพระประสงค์ของพระผู้เป็นเจ้า..."
ep3_frankokratia_events.0060.a: "ช่างเป็นการรวมตัวของชาวคริสต์ตะวันออกและตะวันตกเสียจริง"
latin_emp_title_gain_tooltip: "[latin_emperor.GetShortUIName|U] สร้าง [latin_emperor.GetPrimaryTitle.GetName]"
