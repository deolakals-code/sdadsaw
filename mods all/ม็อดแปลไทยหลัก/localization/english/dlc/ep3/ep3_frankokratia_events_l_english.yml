frankokratia_byz_slaughter.t: "การสังหารหมู่ใน [latin_capital_barony.GetNameNoTierNoTooltip]"
frankokratia_byz_slaughter_tooltip: "ท่ามกลางการสังหารที่เกิดจากชาวละตินผู้บ้าคลั่ง ขุนนาง #N [slaughtered_byzantines]#! คนถูกสังหาร"
frankokratia_byz_slaughter_varangian_tooltip: "ท่ามกลางการสังหารที่เกิดจากชาวละตินผู้บ้าคลั่ง ขุนนาง #N [slaughtered_byzantines]#! คนถูกสังหาร\n\nชาววารังเจียนนำโดย [varangian_victim.GetShortUIName] ปกป้องราชวงศ์จนถึงวาระสุดท้าย"
frankokratia_byz_slaughter_house_head_tooltip: "ท่ามกลางการสังหารที่เกิดจากชาวละตินผู้บ้าคลั่ง ขุนนาง #N [slaughtered_byzantines]#! คนถูกสังหาร\n\n[house_head_victim.GetWomenMen] ผู้สูงศักดิ์ เช่น [house_head_victim.GetShortUIName] ผู้อาวุโสแห่งญาติวงศ์ของ [house_head_victim.GetHerHis] ถูกเผาทั้งเป็นในบ้านของตน"
frankokratia_byz_slaughter_child_tooltip: "ท่ามกลางการสังหารที่เกิดจากชาวละตินผู้บ้าคลั่ง ขุนนาง #N [slaughtered_byzantines]#! คนถูกสังหาร\n\nเด็กๆ เช่น [child_victim.GetShortUIName] ถูกทุบตีจนตาย"
frankokratia_byz_slaughter_emp_tooltip: "ท่ามกลางการสังหารที่เกิดจากชาวละตินผู้บ้าคลั่ง ขุนนาง #N [slaughtered_byzantines]#! คนถูกสังหาร\n\n[defender.GetName] ซึ่งครั้งหนึ่งเคยเป็นผู้ปกครอง [GetTitleByKey('e_byzantium').GetNameNoTier] ถูกพบในหมู่ผู้เสียชีวิต"
