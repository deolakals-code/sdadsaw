ep3_frankokratia_events.0070.t: "ดาบที่หุ้มด้วยทองคำ"
ep3_frankokratia_events.0070.intro: "[financier.GetName] ได้พำนักอยู่ใน [ROOT.Char.GetCapitalLocation.GetTitle.GetNameNoTier] เพื่อดูแลกิจการที่ฟื้นฟูขึ้นใหม่ของพ่อค้าชาว [financier.GetPrimaryTitle.GetAdjective] จำนวนมากในท้องถิ่น บัดนี้ เรือธงของ [financier.GetHerHis] บรรทุกของที่ปล้นมาเต็มลำ [financier.GetSheHe] กล่าวอำลา\n\n"
ep3_frankokratia_events.0070.rando_emp: ""ช่างเป็นการผจญภัยเสียนี่กระไร!" [financier.GetFirstNameNoTooltip] โห่ร้อง "ใครเล่าจะอ้างความกล้าหาญเทียบเท่าพวกเราผู้ยึดครองจักรวรรดิอันยิ่งใหญ่นี้ได้?""
ep3_frankokratia_events.0070.leader_emp: ""เรารวบรวมผู้คนมากมายภายใต้ไม้กางเขน" [financier.GetFirstNameNoTooltip] โห่ร้อง "และดูสิว่ามันให้อะไรแก่ท่าน! จักรวรรดิอันยิ่งใหญ่!""
ep3_frankokratia_events.0070.desc: "แต่... การ #EMP รักษา#! นางไว้ — พลังแขนดาบเพียงข้างเดียวจะเพียงพอหรือ? พวกเราชาวละติน ไม่ควรหรือ ที่จะผูกพันด้วยความกระตือรือร้นของเรา ผูกพันธมิตรกับอาณาจักรกรีกใหม่เหล่านี้ของเรา...?\n\n"ข้าเพียง แต่ขอว่า... พ่อค้าชาว [financier.GetPrimaryTitle.GetAdjectiveNoTooltip] ของข้า ซึ่งมีผลประโยชน์ในท้องถิ่นมากมาย #EMP และลึกซึ้ง#! จะต้องได้รับสิทธิพิเศษ...""
negotiate_financier_alliance_effect_tooltip: "#high ท่าน#! และ [financier.GetShortUIName] เข้าสู่ [alliance|E] ร่วมกัน"
custom.every_realm_county: "ทุก [county|E] ใน [realm|E] ของท่าน"
ep3_frankokratia_events.0070.a: "มีเพียงการร่วมมือกันเท่านั้นที่เราจะควบคุมพวกกรีกที่น่ารังเกียจเหล่านี้ได้"
ep3_frankokratia_events.0070.a.flavor: "ดาบที่จ่อคอชาวกรีกยังคงเป็นของข้า แม้ว่าเหรียญ [financier.GetPrimaryTitle.GetAdjectiveNoTooltip] จะเป็นสิ่งที่ปกครองตลาดของพวกเขาก็ตาม"
ep3_frankokratia_events.0070.b: "#EMP ไอ้สุนัขโลภ!#! พวกกรีกพูดถูกแล้วที่เกลียดชังเจ้า!"
ep3_frankokratia_events.0070.b.flavor: "[financier.GetTitleAsNameNoTooltip] สามารถถูกปฏิเสธได้ แต่ความกระหายในผลกำไรจากอาณาจักรใหม่ของข้าของ [financier.GetHerHis] แทบจะไม่ลดน้อยลงเลย..."
egregious_trading_rights_modifier: "สิทธิทางการค้าต่างประเทศที่ร้ายแรง"
egregious_trading_rights_modifier_desc: "เช่นเดียวกับปรสิตที่หิวโหย พ่อค้าที่ได้รับอำนาจจากสิทธิที่ขูดรีดได้บีบคอตลาดท้องถิ่นเพื่อผลประโยชน์ของตน"
greek_spoils_imports_modifier: "ของที่ปล้นมาจากกรีกที่นำเข้า"
greek_spoils_imports_modifier_desc: "ดินแดนนี้เต็มไปด้วยสมบัติจากต่างแดน การค้าขายไม่เคยเฟื่องฟูเท่านี้มาก่อน"
ep3_harassed_at_sea_modifier: "ถูกคุกคามในทะเล"
ep3_harassed_at_sea_modifier_desc: "กะลาสีเรือผู้ชำนาญจากอาณาจักรที่เป็นศัตรูปฏิเสธที่จะให้บริการแก่กองทัพของตัวละครนี้; ยิ่งไปกว่านั้น พวกเขายังก่อเรื่องทะเลาะวิวาทระหว่างกะลาสีเรือและ ทำให้เรือในท่าเรือเสียหาย"

custom.every_county_latin_kingdom: "ทุก [county|E] ของ [kingdom|E] นี้"
 ep3_frankokratia_events.0080.t: "อาณาจักรสำหรับชาวละติน"
 ep3_frankokratia_events.0080_non_greek: "ซีซาร์ คอนสแตนติน การสืบทอดตำแหน่งของชาวกรีกที่มีชื่อยืดยาวและน่าเบื่อ... และบัดนี้คือ [ROOT.Char.GetFirstName]"
ep3_frankokratia_events.0080_greek: "ดินแดนของชาวกรีก ซึ่งครั้งหนึ่งเคยอยู่ภายใต้การปกครองของ [GetTitleByKey('e_byzantium').GetName] ยังคงอยู่ในสภาวะเปลี่ยนแปลง ใครเล่า ในบรรดาผู้ปกครองทั้งหมดภายใต้ [ROOT.Char.GetFaith.PositiveAfterLife] ที่มีสิทธิ์ในดินแดนเหล่านั้น?"
 ep3_frankokratia_events.0080.desc: "\n\nอำนาจอธิปไตยของชาวโรมันเป็นเกียรติยศสูงสุดในบรรดาเกียรติยศทางโลก ด้วยอำนาจนี้ จึงได้รับความเคารพจากผู้คนมากมาย การอ้างสิทธิ์นี้อยู่เหนือความฝันของนักรบครูเสดละตินของเรา — เป็นเล่ห์เหลี่ยมของโชคชะตา ที่เกิดขึ้นจริงในกองเลือดอันน่าสยดสยอง — แต่บัดนี้ จักรวรรดิของข้าเป็นจริงแล้ว ภาพลักษณ์อันรุ่งโรจน์ของ [ROOT.Char.GetTitleAsNamePossessiveNoTooltip] เกือบจะไร้ที่ติ\n\nครั้งหนึ่ง เราเคยเป็นผู้บุกรุก ชาวบ้านร่ำไห้ หนีไปต่อหน้าเรา บัดนี้ ใน [kingdom_1.GetNameNoTier] พวกเขาโห่ร้องยินดีตามท้องถนน"
 ep3_frankokratia_events.0080.a: "ให้ชาว [kingdom_1.GetNameNoTierNoTooltip] ทุกคนรู้ถึงสิทธิ์ของข้า!"
 ep3_frankokratia_events.0080.b: "ให้ [kingdom_2.GetNameNoTierNoTooltip] ก้มหัว!"
 ep3_frankokratia_events.0080.c: "ให้ [kingdom_3.GetNameNoTierNoTooltip] เป็นของ [ROOT.Char.GetTitleAsNamePossessiveNoTooltip] ตลอดไป!"
 ep3_frankokratia_events.0080.d: "ให้ผู้คนใน [kingdom_4.GetNameNoTierNoTooltip] คุกเข่าลง"
 ep3_frankokratia_events.0080.e: "ให้ [kingdom_5.GetNameNoTierNoTooltip] เป็นของเรา"
