 latin_dominion_decision_warning_tt: "#weak อาจใช้เพื่อรวม [kingdoms|E] [de_jure|E] ของ [GetTitleByKey('e_byzantium').GetAdjective]#!"
 custom.post_byz_greeks: "ทุก [vassal|E] [GetTitleByKey('e_byzantium').GetAdjective] เดิม"
 restore_byz_empire_notification_tt: "อาจใช้ #high $recreate_byzantine_empire_decision$#! [decision|E] หากพวกเขาครอบครอง [GetTitleByKey('c_byzantion').GetName]"
 gain_expunge_latins_decision_tt: "ได้รับ #high $expunge_latin_dominion_decision$#! [decision|E]"
 expunge_latins_decision_warning_tt: "#weak อาจใช้เพื่อทวงคืน [kingdoms|E] [de_jure|E] ของ [GetTitleByKey('e_latin_empire').GetAdjective]#!"

 ep3_frankokratia_events.0110.t: "[GetTitleByKey('e_byzantium').GetNameNoTooltip] — ถูกยึดครอง!"
ep3_frankokratia_events.0110.desc: "สงครามต่อต้านชาวแฟรงก์พ่ายแพ้แล้ว\n\nจากเมืองหลวงมีข่าวคราวเกี่ยวกับการเจรจาสันติภาพ; การพูดคุยเกี่ยวกับ [emperor.GetTitledFirstNameRegnal] ที่เพิ่งได้รับการ แต่งตั้ง — ความบ้าคลั่งในชุดสีม่วงหลวง — ซึ่งถูกแห่แหนไปทั่วโดยกลุ่มชาวละตินในชุดเกราะโซ่ที่เหม็นอับ ข้ายังได้ยินเกี่ยวกับ [financier.GetTitleAsName] แห่ง [financier.GetPrimaryTitle.GetNameNoTier]: [Glossary( 'ออกุสตอส', 'AUGOUSTOS_GLOSS')] แห่งอสรพิษ ส่งเสียงขู่คำรามดูถูกเสนาบดีในราชสำนักของเรา สั่งการบรรณาการเพิ่มเติม\n\nกองทัพครูเสดยังคงอยู่นอกกำแพงเมืองหลวง จะมีสิ่งใด ทำให้พวกเขาจากไปได้หรือไม่? สิ่งใดที่นอกเหนือไปจากการทำลายล้างอย่างสิ้นเชิงของเรา...?"
 ep3_frankokratia_events.0110.a: "ข้าจะปกป้องวิถีแห่งจักรวรรดิของเรา ไม่ว่าจะเกิดอะไรขึ้นก็ตาม"
 ep3_frankokratia_events.0110.b: "ข้าควรแสวงหาการคุ้มครองจาก [daddy.GetTitledFirstNamePossessiveNoTooltip]"
 ep3_frankokratia_events.0110.c: "[daddy_2.GetTitledFirstNameNoTooltip] มีกำลังพอที่จะผ่านพ้นเรื่องนี้ไปได้..."
 ep3_frankokratia_events.0110.d: "ในไม่ช้า บางที... ข้าอาจจะยืนหยัดอยู่เพียงลำพัง ปราศจากพันธนาการ"

