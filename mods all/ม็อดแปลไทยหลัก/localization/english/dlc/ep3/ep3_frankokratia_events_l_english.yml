l_english: 

ep3_frankokratia_events.0001.t: "การขับไล่อันอยุติธรรม"

ep3_frankokratia_events.0001.crusader_intro: "เราเหล่าผู้แสวงบุญติดอาวุธสู่ดินแดนโพ้นทะเลได้ทำสัญญากับ [financier.GetPrimaryTitle.GetNameNoTier] ให้สร้างเรือให้เรา... เป็นภารกิจที่แพงยิ่งนัก และอุทิศให้กับกิจการที่ไม่แน่นอน"
ep3_frankokratia_events.0001.non_crusader_intro: "ข่าวคราวเกี่ยวกับสงครามครูเสดมาถึงแล้ว ผู้ที่ให้คำมั่นสัญญาได้ทำสัญญากับ [financier.GetPrimaryTitle.GetNameNoTier] ให้สร้างเรือให้พวกเขา... เป็นภารกิจที่แพงยิ่งนัก และอุทิศให้กับกิจการที่ไม่แน่นอน"
ep3_frankokratia_events.0001.desc: "\n\n"ช่างเป็นการสิ้นเปลืองอันน่าสะพรึงกลัว!" [byz_claimant.GetFirstName] [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('byz_claimant'))] ของข้าคร่ำครวญ "อัศวินละตินผู้กล้าหาญที่สุด ต้องยากจนข้นแค้น — ถูก ทำให้ทนทุกข์ทรมานต่อหน้าพวกนอกรีต! หาก [Glossary( 'โรไมออย', 'ROMAIOS_GLOSS' )] จะช่วยเหลือพวกเขาได้..."\n\nในฐานะผู้อ้างสิทธิ์ในตำแหน่ง [byz_emperor.GetPrimaryTitle.GetAdjective] [byz_claimant.GetFirstNameNoTooltip] กล่าวถึง #EMP ชาวโรมาอิ#! อย่างมีนัยสำคัญ บางที... หากนักรบครูเสดของเราเดินทัพในนามของ [byz_claimant.GetHerHis] ภารกิจของพวกเขาอาจได้รับการสนับสนุนจากทหารกรีกและของขวัญหลวงอันฟุ่มเฟือย? สงครามครูเสดนอกรีต เช่นนี้จะรับใช้ภารกิจของพระคริสต์... และเหล่านักรบชาวคริสต์ของพระองค์ได้ดีกว่าหรือไม่?"
ep3_frankokratia_events.0001.a: "ช่างเป็นกิจการที่ชาญฉลาด! พระสันตะปาปาจะต้องอวยพรอย่างแน่นอน"
ep3_frankokratia_events.0001.a.flavor: "เพื่อนชาวคริสต์เหล่านี้ท้าทายอำนาจของพระบิดาผู้ศักดิ์สิทธิ์! มันจะผิดนักหรือหากเราจะใช้ผู้แสวงบุญของเราต่อสู้กับพวกเขา...?"
ep3_frankokratia_events.0001.b: "ข้าจะให้นักรบครูเสดสาบานตนต่อภารกิจนี้เป็นการส่วนตัว"
ep3_frankokratia_events.0001.b.flavor: "ผู้นำกองทัพของพระเจ้าสามารถตัดสินใจได้ด้วยตนเอง เพราะพวกเขา ไม่ใช่พระสันตะปาปา ที่จะเป็นผู้ก้าวเท้าขึ้นฝั่งไบแซนทิอุมเป็นคนแรก"
ep3_frankokratia_events.0001.c: "เป็นความคิดที่โง่เขลาอย่างร้ายกาจ"
ep3_frankokratia_events.0001.c.flavor: "และการทรยศที่ไร้ศรัทธายิ่งกว่านี้ยากที่จะจินตนาการได้!"
abandon_crusade_tooltip: "@alert_icon! #alert_trial เมื่อ [great_holy_war|E] เริ่มต้น ท่านและผู้โจมตีที่เต็มใจคนอื่นๆ จะถูกถอดออกจากสงคราม#!"
byz_claimant_crusade_tooltip: "@warning_icon! #X ท่านจะนำ #high $CRUSADING_CLAIM_CB_NAME$#! ต่อต้าน [byz_emperor.GetShortUIName] ในนามของ [byz_claimant.GetShortUIName]#!"
may_form_latin_empire_tooltip: "ท่านอาจสามารถสร้าง #high [GetTitleByKey('e_latin_empire').GetName|U]#!"
crusaders_may_be_paid_tooltip: "ท่านอาจได้รับรางวัลเป็น @gold_icon![gold|E] @piety_icon![piety|E] และ [special_troops|E]"
more_crusaders_will_join_tooltip: "#P ผู้โจมตี [great_holy_war|E] เพิ่มเติมจะเข้าร่วม [war|E] ของท่านแทน#!"
fewer_crusaders_will_join_tooltip: "@warning_icon! #X ผู้โจมตี [great_holy_war|E] น้อยลงจะเข้าร่วม [war|E] ของท่านแทน#!"

ep3_frankokratia_events.0001.a.crit_success: "[ghw_sponsor.GetTitledFirstNameNoTooltip] อวยพรแผนการอันชาญฉลาดของท่าน"
ep3_frankokratia_events.0001.a.success: "[ghw_sponsor.GetTitledFirstNameNoTooltip] ยอมรับ เพื่อประสานรอยร้าวแห่งศาสนเภท"
ep3_frankokratia_events.0001.a.failure: "[ghw_sponsor.GetTitledFirstNameNoTooltip] ประณามแผนการอันตรายของท่าน"
set_byz_state_faith_to_catholic_tooltip: "[byz_claimant.GetShortUIName] จะเปลี่ยน [faith|E] ประจำรัฐ [byz_emperor.GetPrimaryTitle.GetAdjective] เป็น [byz_claimant_champion.GetFaith.GetName]"

 eager_for_empire_modifier: "กระหายในจักรวรรดิ"
 eager_for_empire_modifier_desc: "ผู้ทะเยอทะยานผู้นี้ได้รับแรงบันดาลใจจากความฝันถึงความยิ่งใหญ่ของจักรวรรดิไบแซนไทน์; แข็งแกร่งขึ้นด้วยความเชื่อมั่นอันแน่วแน่ และได้รับการคุ้มครองอย่างใกล้ชิดจากผู้อุปถัมภ์"

 prepared_for_daring_deeds_modifier: "เตรียมพร้อมสำหรับศึกห่างไกล"
 prepared_for_daring_deeds_modifier_desc: "ตัวละครนี้กำลังนำกิจการที่ยิ่งใหญ่และเสี่ยงภัย: กิจการที่สัญญาว่าจะให้รางวัลมากมาย แต่จะสำเร็จได้ด้วยการวางแผนอย่างรอบคอบเท่านั้น"

ep3_frankokratia_events.0002.opening: "ข้า แต่ [ROOT.Char.Custom('GetDaughterSon')] แห่งพระคริสต์ผู้กล้าหาญที่สุด"
ep3_frankokratia_events.0002.desc_condemns: "ท่านจะกล้า — จากการดูแลของทายาทแห่งนักบุญเปโตร — ฉกฉวยดาบของกาเบรียลจริงหรือ? ท่านจะปราศจากความรักฉันท์บุตรและความศรัทธาในศาสนาคริสต์ เสียบดาบอันศักดิ์สิทธิ์เล่มนั้นเข้าสู่ทรวงอกของพี่น้องชาวกรีกของท่านหรือ?\n\nนี่คือสิ่งที่น่ารังเกียจที่ท่านกำลังพิจารณา ไม่มีชาวคริสต์คนใดควรได้รับอันตรายจากน้ำมือของผู้แสวงบุญ"
ep3_frankokratia_events.0002.desc_endorses: "ด้วยความหยิ่งผยองอันเป็นบาป เหล่าพระราชาคณะแห่งชาวกรีกดูหมิ่นผู้แทนที่พระเจ้าทรงเลือกไว้บนโลก ดังนั้น ในพระนามอันศักดิ์สิทธิ์ของพระองค์ ข้าขอสั่งให้ท่านรวบรวมทหารของพระองค์ไว้เบื้องหลังท่าน เพื่อให้ได้ชัยชนะ และเพื่อ แต่งตั้งประมุของค์ใหม่ผู้ชอบธรรมในแดนตะวันออก\n\nหากพระเจ้าทรงประสงค์ ด้วยความพยายามของท่าน ผู้ศรัทธาอาจได้อ้างสิทธิ์ในดินแดนโพ้นทะเลทั้งหมดในสักวันหนึ่ง"
ep3_frankokratia_events.0002.desc_wasnt_asked: "พระเจ้าทรงลงโทษผู้ที่เฉก เช่นลูซิเฟอร์ ทะเยอทะยานในอาณาจักรและจักรวรรดิแห่งแสงสว่างของพระองค์ — แต่พระองค์ทรงให้รางวัลแก่ผู้ที่มั่นคง สิ่งที่ได้เริ่มต้นขึ้นในหมู่นักรบครูเสดของพระองค์ ข้าจะไม่ยกเลิก\n\nแต่ท่านจะต้องพึ่งพาการอภัยบาปอันศักดิ์สิทธิ์สำหรับการหลั่งเลือดชาวคริสต์ จงดำเนินการอย่างชาญฉลาดและมีเกียรติในการรับใช้พระคริสต์ และท่านอาจได้รับมัน; จงสวดภาวนาขณะที่ท่านยืนอยู่ต่อหน้าชาวกรีก"
ep3_frankokratia_events.0002.a: "เอาล่ะ... สู่ไบแซนทิอุม ข้าไป!"
ep3_frankokratia_events.0002.b: "ข้าสำนึกผิดแล้ว พระบิดาผู้ศักดิ์สิทธิ์! #EMP ข้าสำนึกในความเขลาของข้า!#!"
continue_frankokratia_crusade_tooltip: "ท่านยังคงเปลี่ยนเส้นทางนักรบครูเสดไปยัง [byz_emperor.GetPrimaryTitle.GetNameNoTier]"
end_frankokratia_crusade_war_tooltip: "@alert_icon! #alert_trial ท่านจะไม่โจมตี [byz_emperor.GetPrimaryTitle.GetNameNoTier] หรือเปลี่ยนเส้นทางนักรบครูเสดใดๆ#!"

ep3_frankokratia_events.0003.opening: "ศัตรูของ [byz_emperor.GetTitleAsNameNoTooltip]"
ep3_frankokratia_events.0003.desc: "ผู้ที่ถือไม้กางเขนมีเรือ [financier.GetPrimaryTitle.GetAdjective] ที่สร้างขึ้นใหม่จำนวนมากไว้ใช้งาน — แต่พวกเขาไม่สามารถแบกรับค่าใช้จ่ายได้อย่างเป็นธรรม ข้าได้ชักชวนสภาของเราให้หาทางชำระเงินด้วยวิธีอื่น\n\nจงให้คำมั่นสัญญาว่าจะชดเชยให้เราจากคลังหลวงหรือด้วยดินแดนของจักรวรรดิ หากท่านทำ เช่นนั้น เรือของเราจะบรรทุก $knight_culture_player_plural_no_tooltip_lowercase$ ของท่านข้ามทะเลไป นาวิกโยธินผู้กล้าหาญของเราจะปีนกำแพงศัตรูของท่าน ในไม่ช้าชาวกรีกจะต้องเสียใจที่ดูหมิ่นเรา!"
ep3_frankokratia_events.0003.a: "คำมั่นของเราแลกกับของท่าน ให้เป็น เช่นนั้นเถิด"
will_give_byz_lands_tooltip: "หาก [byz_emperor.GetShortUIName] มี @gold_icon![gold|E] ไม่เพียงพอ [financier.GetShortUIName] จะได้รับ [title|E] จาก [byz_emperor.GetPrimaryTitle.GetNameNoTier]"
financier_will_join_claim_war_tooltip: "[financier.GetShortUIName] จะเข้าร่วม #high $CRUSADING_CLAIM_CB_NAME$#! ของท่านต่อต้าน [byz_emperor.GetShortUIName]"
every_ally_will_gain_modifier_tooltip: "ท่านและผู้โจมตี [war|E] คนอื่นๆ จะได้รับ [GetModifier( 'grand_crusader_fleet_modifier' ).GetNameWithTooltip|L]"
grand_crusader_fleet_modifier: "กองเรือครูเสดอันยิ่งใหญ่"
grand_crusader_fleet_modifier_desc: "กองเรือขนส่งและเรือรบแกลลีย์ที่สร้างขึ้นใหม่จำนวนมหาศาลกำลังนำพากองทัพของตัวละครนี้ไปยังชายฝั่งอันห่างไกล"

ep3_frankokratia_events.0004.t: "ความโอหังในแดนตะวันตก"
ep3_frankokratia_events.0004.desc: "สายลับของเราในหมู่ชาวละตินนำข่าวประหลาดมา... หากข้าไม่เจนจัดในเรื่องความโลภทุกรูปแบบของชาว [financier.GetPrimaryTitle.GetAdjective] ข้าคงคิดว่าตนเองถูกหลอก!\n\nขณะที่ [byz_claimant_champion.GetFaith.GetAdherentNamePlural] โจมตีพวกนอกรีตอีกครั้ง ผู้แสวงบุญติดอาวุธจำนวนมากของพวกเขากลับให้คำมั่นว่าจะมา #EMP ที่นี่#! แทน นำโดย [byz_claimant_champion.GetName] และ [financier.GetTitledFirstName] พวกเขาประกาศว่า [byz_claimant.GetName] ขอทานผู้น่าสมเพชนั้น คือผู้ปกครองโดยชอบธรรมของ [Glossary( 'โรไมออย', 'ROMAIOS_GLOSS' )]!\n\nในไม่ช้า พวกคลั่งศาสนาเหล่านั้นจะต้องตายอยู่นอกกำแพงของข้าเพื่อภารกิจอันอ่อนแอของ [byz_claimant.GetHerHis]! พวกเขาคิดจะโจมตีเพื่อนชาวคริสต์ เช่นนี้ได้อย่างไร?"
ep3_frankokratia_events.0004.a: "ข้าคิดว่า... [byz_claimant.GetFirstNameNoTooltip] ต้องตาย"
ep3_frankokratia_events.0004.a.flavor: "บางทีการฆาตกรรมอย่างโหดเหี้ยมอาจ ทำให้พวกเขาตาสว่าง? แน่นอนว่ามันจะ ทำให้ชาวละตินไม่มีเหตุผลที่จะโจมตีเรา"
ep3_frankokratia_events.0004.b: "[ROOT.Char.GetFaith.HighGodName] ทรง แต่งตั้งข้า [ROOT.Char.GetFaith.HighGodName] จะปกป้องข้า"
ep3_frankokratia_events.0004.b.flavor: "ในขณะเดียวกัน บิชอปแห่งโรมก็ยิ่งมัวเมาในความเท็จของตนเองมากขึ้นเรื่อยๆ... ชักนำฝูงแกะอันป่าเถื่อนของพวกเขาไปในทางที่ผิดอย่างร้ายแรง"

abandon_crusade_emp_tooltip: "@alert_icon! #alert_trial เมื่อ [great_holy_war|E] ของ [GetFaithByKey('catholic').GetAdherentName|U] เริ่มต้น ผู้โจมตีที่เกี่ยวข้องจะถูกถอดออกจากสงคราม#!"
franko_emp_crusade_tooltip: "@warning_icon! #X [byz_claimant_champion.GetShortUIName] จะนำ #high $CRUSADING_CLAIM_CB_NAME$#! ต่อต้าน [byz_emperor.GetShortUIName] ในนามของ [byz_claimant.GetShortUIName]#!"
byz_empire__destroyed_tooltip: "@warning_icon! #X [GetTitleByKey('e_byzantium').GetName|U] อาจถูกทำลายได้!#!"

ep3_frankokratia_events.0005.opening: "ลูกข้าผู้ไม่เชื่อฟัง"
ep3_frankokratia_events.0005.desc: "ท่านไม่สามารถหวังที่จะสวมมงกุฎสีม่วงหลวงให้แก่ผู้อ้างสิทธิ์ [claimant.GetName] ได้อีกต่อไป\n\nอย่าฝันถึงความหรูหราของกรีกอีกเลย อย่าจมอยู่กับการท้าทายอีกต่อไป แต่จงแสวงหาการสำนึกผิด ภารกิจที่เคยผลักดันท่านให้ออกจากภารกิจศักดิ์สิทธิ์ของพระเจ้าได้พบกับจุดจบอันไร้พิธีรีตองอย่างสมควรแล้ว"
ep3_frankokratia_events.0005.a: "[ROOT.Char.GetFaith.HighGodName] คงจะรักทรราชแห่งชาวกรีก..."
frankokratia_story_ends_tooltip: "การโจมตี [GetTitleByKey('e_byzantium').GetName|U] ของนักรบครูเสด [GetFaithByKey('catholic').GetAdjective] ถูกยกเลิกแล้ว"

ep3_frankokratia_events.0020.t: "ต่อต้านผู้หลงผิด"
ep3_frankokratia_events.0020.desc: "ความขัดแย้งก่อตัวขึ้นในหมู่นักรบแห่งพระคริสต์... เพราะพวกนอกรีตนั้นแข็งแกร่ง การข้ามทะเลเมดิเตอร์เรเนียนจะ ทำให้เราเสียค่าใช้จ่ายอย่างหนัก และช่างต่อเรือ [financier.GetName] ก็เป็นเจ้าหนี้ที่โหดร้ายและเจ้าเล่ห์\n\n[redirecter.GetName] ให้รายละเอียดเกี่ยวกับกิจการที่แตกต่างออกไป: ด้วยความกระตือรือร้นที่รวมกันของเรา ทำไมเราไม่ควรติดตั้งผู้อ้างสิทธิ์ [byz_claimant.GetName] บนบัลลังก์ของ [byz_emperor.GetPrimaryTitle.GetName] แทน? รางวัลอันมั่งคั่งที่เราจะได้รับจะไม่ช่วยเสริมสร้างความแข็งแกร่งให้แก่ผู้ศรัทธาหรือ?"
ep3_frankokratia_events.0020.pope_condemns: "\n\n[pope.GetTitledFirstName] ไม่เห็นด้วย ห้ามกิจการนี้และขู่ว่าจะสาปแช่ง ผู้ที่เต็มใจยังคงไม่ย่อท้อ"
ep3_frankokratia_events.0020.pope_endorses: "\n\nและ แม้ว่า [pope.GetSheHe] จะยังคงพยายามนำสงครามครูเสด [pope.GetTitledFirstName] ได้ประทานพรแห่งนักบุญเปโตรแก่กิจการนี้แล้ว!"
ep3_frankokratia_events.0020.pope_resents: "\n\n[pope.GetTitledFirstName] ไม่ได้ประณามกิจการนี้อย่างเปิดเผย แต่พระราชาคณะของ [pope.GetHerHis] ไม่สนับสนุนการแตกแยกของสงครามครูเสด เช่นนี้..."

ep3_frankokratia_events.0020.a: "ข้าจะเข้าร่วมในฐานะ #EMP ผู้นำ#! ของความพยายามอันกล้าหาญนี้เท่านั้น"
ep3_frankokratia_events.0020.b: "นับข้ารวมอยู่ในหมู่ผู้เต็มใจด้วย!"
ep3_frankokratia_events.0020.c: "แผนนี้... ไม่สมเหตุสมผลเลย"
 ep3_frankokratia_events.0020.c.flavor: "มันเป็นการดูหมิ่นศาสนาอย่างที่สุด! #EMP และมันทำให้สงครามครูเสดอันศักดิ์สิทธิ์ของเราอ่อนแอลง!#!"
 join_byz_claimant_crusade_tooltip: "@warning_icon! #X ท่านจะเข้าร่วม #high $CRUSADING_CLAIM_CB_NAME$#! ต่อต้าน [byz_emperor.GetShortUIName] ในนามของ [byz_claimant.GetShortUIName]#!"
may_gain_land_latin_empire_tooltip: "[titles|E] ใน #high [GetTitleByKey('e_latin_empire').GetName|U]#! อาจถูกแจกจ่าย"

ep3_frankokratia_events.0030.t: "ทายาทแห่งคอนสแตนติน"
ep3_frankokratia_events.0030.desc: "[ghw_sponsor.GetTitledFirstName] เรียกหา แต่เราจะไม่ตอบรับ ยังไม่ใช่ตอนนี้ แต่ภายใต้การนำของ [byz_claimant_champion.GetTitledFirstNamePossessive] เราจะเดินทัพไปยัง [byz_emperor.GetPrimaryTitle.GetNameNoTier]\n\nณ ที่ ซึ่งผู้แสวงบุญของเราขึ้นเรือ [financier.GetPrimaryTitle.GetAdjective] โล่ประจำตระกูลนับไม่ถ้วนถูกแขวนไว้ที่หัวเรือและท้ายเรือ หุ้มด้วยหนังเพื่อทนทานต่อทะเล ม้าศึกอันทรงพลังถูกนำลงไปใต้ท้องเรือ ราวกับดอกไม้บาน ใบเรือขนาดใหญ่กางออกรับแสงอาทิตย์! ที่อื่น ขบวนนักรบครูเสดออกเดินเท้าตามหลังไม้กางเขน โดยมีถนนโบราณนำทางพวกเขาไปทางตะวันออก\n\nขอให้เราล้างแค้นให้ [Glossary( 'โทรจัน', 'TROJANS_FRANKOKRATIA_GLOSS')]! ขอให้ชาวกรีกตัวสั่นในพระราชวังของพวกเขา! ขอให้พวกเขาก้มหัวให้ [byz_claimant.GetFullName] เจ้าเหนือหัวโดยชอบธรรมของพวกเขา และพวกเรานักรบครูเสดในฐานะผู้ปลดปล่อยของพวกเขา!"
TROJANS_FRANKOKRATIA_GLOSS: "ผ่านตำนานการหลบหนีของอีเนียสจากทรอย ชาวละตินในยุคกลางสืบเชื้อสายของตนไปยังเมืองในตำนานแห่งนั้น การล้างแค้นให้บรรพบุรุษที่ถูกกล่าวอ้างเหล่านี้เป็นแรงจูงใจที่อ้างถึงสำหรับการโจมตีไบแซนทิอุมของกรีก"
ep3_frankokratia_events.0030.a: "#EMP ถวายพระเกียรติแด่พระเจ้าในที่สูงสุด!#!"
frankokratia_war_begins_tooltip: "[byz_claimant_champion.GetShortUIName|U] ประกาศ #high [frankokratia_war.GetName]#!"
frankokratia_war_join_tooltip: "ท่านได้เข้าร่วมในฐานะผู้โจมตี"

abandoned_crusade_general_tooltip: "@alert_icon! #alert_trial [byz_claimant_champion.GetShortUIName] และผู้โจมตีคนอื่นๆ ได้ออกจาก [great_holy_war|E] ของ [GetFaithByKey('catholic').GetAdjective]#!"

ep3_frankokratia_events.0031.t: "สงครามครูเสดที่แตกแยก"
ep3_frankokratia_events.0031.desc_byz: "ในการท้าทายความรักร่วมกันทั้งหมดที่มีต่อพระคริสต์ — และปฏิเสธภารกิจของ [pope.GetTitledFirstName] บิชอปแห่งโรมอันเป็นที่รักของพวกเขา — กลุ่มนักรบครูเสดละตินกลุ่มหนึ่งกำลังท้าทายจักรวรรดิของเรา!\n\nพวกเขา #EMP ไม่#! รู้หรือว่ากองทัพของจักรวรรดิเราทำหน้าที่เป็นปราการแห่งคริสตจักรมานานแสนนานเพียงใด? ขอให้ความแข็งแกร่งของ [Glossary( 'เฮราคลิออส', 'HERAKLEIOS_GLOSS')] ปกป้องเราในตอนนี้; ขอให้ศีรษะที่ถูกตัดของ [byz_claimant_champion.GetTitledFirstName], [financier.GetTitledFirstName] และผู้อ้างสิทธิ์ [byz_claimant.GetName] ได้พักผ่อนอยู่ข้าง [Glossary( 'บัลลังก์โซโลมอน', 'THRONE_OF_SOLOMON_GLOSS')] ในไม่ช้า!\n\n[ROOT.Char.GetFaith.WarGodName] โปรดคุ้มครองเราให้ดีจากความโลภของชาวละตินนี้... ความเขลาที่คุกคามการดำรงอยู่ของเรา"
HERAKLEIOS_GLOSS: "#bold จักรพรรดิเฮราไคลออส#! ในศตวรรษที่ 7 เผชิญกับวิกฤตการณ์ทางทหารเกือบตลอดรัชสมัยของพระองค์ ต่อสู้กับทั้งชาวเปอร์เซียซาซาเนียนและกาหลิบรอชิดูน พระองค์ทรงดำเนินการปฏิรูปที่สำคัญ ซึ่ง ทำให้จักรวรรดิไบแซนไทน์อยู่รอดได้"
THRONE_OF_SOLOMON_GLOSS: "บัลลังก์ที่กล่าวกันว่าเป็นของกษัตริย์โซโลมอน กษัตริย์ผู้ชาญฉลาดที่สุดแห่งอิสราเอลโบราณ เป็นหนึ่งในวัตถุแห่งโซโลมอนที่ราชสำนักไบแซนทิอุมเก็บรักษาไว้"
ep3_frankokratia_events.0031.desc_catholic: "#EMP สงครามครูเสดคาทอลิกถูกทรยศ!#!\n\nผู้แสวงบุญที่ไร้ศรัทธาและหลงผิดได้รวมตัวกันอยู่เบื้องหลังผู้อ้างสิทธิ์ [byz_claimant.GetName] และ เรื่องน่าเศร้าสลดที่สุด — วางแผนที่จะโจมตี [byz_emperor.GetPrimaryTitle.GetNameNoTier] อาณาจักรของชาวคริสต์! พวกเขาปฏิเสธการเดินทางไปยัง [target_kingdom.GetNameNoTier]!\n\nผู้แก้ต่างให้กับ [byz_claimant_champion.GetTitledFirstName] ผู้หยิ่งผยอง [financier.GetTitledFirstName] ผู้ละโมบ และคนอื่นๆ ทั้งหมดอ้างว่าพวกเขาจะรวมคริสตจักรเป็นหนึ่งเดียว โดยให้ความแข็งแกร่งของกรีกแก่ภารกิจ...\n\nแต่มีเพียงพระเจ้าเท่านั้นที่รู้ว่าจะเกิดอะไรขึ้นจากสิ่งนี้"
ep3_frankokratia_events.0031.desc_target: "ปราศจากแสงสว่างของ [ROOT.Char.GetFaith.HighGodName] ที่จะนำทางพวกเขา [pope.GetFaith.GetAdherentNamePlural] ก็ดิ้นรนอยู่ในความมืด!\n\nศัตรูผู้คลั่งไคล้ของเรากลุ่มใหญ่ แทนที่จะเดินทัพต่อต้าน [defender.GetName] กลับสาบานว่าจะยึดครอง [byz_emperor.GetPrimaryTitle.GetName]! ความขัดแย้งของพวกเขานับเป็นการผ่อนคลายที่น่าฉงนสำหรับผู้ที่ปกป้อง [target_kingdom.GetNameNoTier]\n\nจิตใจอันชั่วร้ายเล็กๆ ของพวกเขาดูเหมือนจะเชื่อว่าเราจะรับบัพติศมาด้วยดาบเมื่อ [byz_claimant.GetName] นั่งบัลลังก์จักรพรรดิ... แต่กองกำลังของ [pope.GetTitledFirstNamePossessive] จะต้องถูกขับไล่ออกไปอย่างแน่นอนในตอนนั้น"
ep3_frankokratia_events.0031.a: "นี่มัน... เกิดขึ้นจริงๆ หรือ?"

ep3_frankokratia_events.0041.t: "ความมั่งคั่งทั้งปวงแห่งจักรวรรดิ"
ep3_frankokratia_events.0041.intro_constantinople: "ท่ามกลางเสียงโห่ร้องยินดีอย่างกึกก้อง [claimant.GetFirstName] ผู้ที่เราดูแลอยู่ได้เข้าสู่ประตูอันยิ่งใหญ่ของ [claimant.GetCapitalLocation.GetTitle.GetNameNoTier] ใต้โดมขนาดใหญ่และ [Glossary( 'เซราฟิม', 'SERAPHIM_GLOSS')] แห่งสรวงสวรรค์ของฮาเกียโซเฟีย ในที่สุด [claimant.GetSheHe] ก็ได้รับการสถาปนาเป็น [claimant.GetTitleAsNameNoTooltip] ช่างเป็นความปิติยินดีของเรา ช่างเป็นความอัศจรรย์ใจอันสมบูรณ์ของเรา!\n\nขณะที่ข้าถูกนำตัวเข้าไปใน [Glossary( 'พระราชวังบลาเคอร์แน', 'BLACHERNAE_PALACE_GLOSS')] อย่างเย็นชา"
ep3_frankokratia_events.0041.intro_generic: "ท่ามกลางเสียงโห่ร้องยินดีอย่างกึกก้อง [claimant.GetFirstName] ผู้ที่เราดูแลอยู่ได้เข้าสู่ประตูอันยิ่งใหญ่ของ [claimant.GetCapitalLocation.GetTitle.GetNameNoTier] ใต้โดมขนาดใหญ่และ [Glossary( 'เซราฟิม', 'SERAPHIM_GLOSS')] แห่งสรวงสวรรค์ของโบสถ์หลวง ในที่สุด [claimant.GetSheHe] ก็ได้รับการสถาปนาเป็น [claimant.GetTitleAsNameNoTooltip] ช่างเป็นความปิติยินดีของเรา ช่างเป็นความอัศจรรย์ใจอันสมบูรณ์ของเรา!\n\nขณะที่ข้าถูกนำตัวเข้าไปในพระราชวังหลวงอย่างเย็นชา"
ep3_frankokratia_events.0041.desc: "และถูกบังคับให้ทนกับพิธีการที่ไม่รู้จบ ความรู้สึกที่แตกต่างออกไปก็เข้ามาครอบงำข้า...\n\n"บรรพบุรุษของข้า" [claimant.GetTitledFirstNameNoTooltip] อธิบาย "ได้นำทรัพย์สมบัติส่วนใหญ่ไปเมื่อ [defender.GetSheHe] หลบหนีไป ""
ep3_frankokratia_events.0041.trying_to_pay: "แม้เราจะพยายามอย่างเต็มที่ จักรวรรดิก็สามารถเสนอค่าตอบแทนให้พวกท่านนักรบครูเสดได้เพียง #EMP บางส่วน#! เท่านั้น""
ep3_frankokratia_events.0041.not_trying_to_pay: "พวกท่านนักรบครูเสดไม่สามารถได้รับค่าตอบแทนตามที่สัญญาไว้ แต่... เราสามารถจ่ายให้ #EMP ท่าน#! ได้น้อยกว่านั้น #EMP มาก#!""
SERAPHIM_GLOSS: "ลำดับชั้นของสิ่งมีชีวิตบนสวรรค์ที่มีอยู่ในศาสนาอับราฮัม; ในศาสนาคริสต์ #bold เซราฟิม#! มีหกปีกและอยู่ในลำดับสูงสุดของทูตสวรรค์"
BLACHERNAE_PALACE_GLOSS: "สร้างขึ้นใกล้กำแพงธีโอโดเซียนราวปี ค.ศ. 500 กลุ่มพระราชวังแบบขั้นบันไดนี้ถูกใช้เป็นที่ประทับหลักของจักรพรรดิมากขึ้นเรื่อยๆ ในช่วงยุคกลางตอนกลาง"
ep3_frankokratia_events.0041.a: "เช่นนั้นเราก็ต้อง #EMP ยึด#! สิ่งที่เราควรได้รับ"
ep3_frankokratia_events.0041.a.flavor: "การปล้นสะดมเมืองหลวง เช่นนี้... จะหาใดเปรียบมิได้"
ep3_frankokratia_events.0041.b: "การสลายกองอัศวินของเราโดยไม่จ่ายค่าจ้าง จะไม่ใช่เรื่องง่าย..."
ep3_frankokratia_events.0041.b.flavor: "... แต่ ด้วย #EMP แรงจูงใจ#! ที่เหมาะสม ข้าสามารถพยายามส่งคนอื่นๆ กลับไปโดยไม่เสียเลือดเนื้อได้"
ep3_frankokratia_events.0041.b_success: "ท่านโน้มน้าวให้ชาวละตินจากไปได้สำเร็จ"
ep3_frankokratia_events.0041.b_failure: "นักรบครูเสดเข้าปล้น [claimant.GetCapitalLocation.GetTitle.GetNameNoTierNoTooltip]"
ep3_frankokratia.0041_effects_from_a_tooltip: "@warning_icon! #X ผลกระทบของตัวเลือกแรกจะเกิดขึ้น"

ep3_frankokratia_events.0041.c: "เราคาดหวังมากกว่านี้ แต่เรายอมรับได้"
ep3_frankokratia_events.0041.c.flavor: "คริสตจักรยังคงแข็งแกร่งขึ้นจากกิจการนี้ ไม่มากก็น้อย"

byzantine_empire_destroyed_tooltip: "@warning_icon! #X [claimant.GetPrimaryTitle.GetNameNoTier] จะถูกทำลาย#!"
byz_capital_building_destroyed_tooltip: "@warning_icon! #X #high 2#! [buildings|E] จะถูกลดระดับหรือทำลาย#!"

frankokratia_leaders_gain_despoiler_trait: "นักรบครูเสดที่เกี่ยวข้องทั้งหมดและ [rulers|E] [GetTitleByKey('e_latin_empire').GetAdjective] จะได้รับ #high [GetTrait('despoiler_of_byzantium').GetName( GetNullCharacter )]#!"
bent_before_crusaders_modifier: "ยอมจำนนต่อนักรบครูเสด"
bent_before_crusaders_modifier_desc: "แทนที่จะผิดนัดชำระหนี้ตามสัญญาที่เป็นไปไม่ได้ ตัวละครนี้ได้ชำระหนี้โดยการปล้นสะดมอาณาจักรของตนเอง"
crippled_by_imperial_debt_modifier: "พิการจากมาตรการของจักรวรรดิ"
crippled_by_imperial_debt_modifier_desc: "กองทหารท้องถิ่นถูกส่งไป และหน่วยงานราชการพลเรือนว่างเปล่า ตลาดจัตุรัสเงียบสงัด"
greek_opinion: "[opinion|E] ของชาวกรีก"

ep3_frankokratia_events.0042.t: "บัพติศมาด้วยไฟ"
ep3_frankokratia_events.0042.desc: "เราโจมตี [claimant.GetCapitalLocation.GetTitle.GetNameNoTier]! นาวิกโยธิน [financier.GetPrimaryTitle.GetAdjective] เป็นกลุ่มแรกที่ชักธงนักบุญของตนขึ้นบนกำแพง ขณะที่ $knight_culture_player_plural_no_tooltip_lowercase$ ของเราโห่ร้องก้องผ่านประตูเมืองและสังหารผู้ป้องกันทุกคน ชาวกรีกจุดไฟเผาบ้านของตนเอง — แต่แม้กำแพงไฟอันยิ่งใหญ่นี้ก็ไม่อาจขัดขวางพระพิโรธของพระเจ้าได้!\n\nเป็นเวลาสามวัน เมืองถูกปล้นสะดมและพลเมืองถูกสังหาร"
ep3_frankokratia_events.0042.constantinople: "ผู้ศรัทธาในหมู่พวกเราเรียกร้องให้ยับยั้งชั่งใจ แต่กระนั้น โบสถ์อัครสาวกศักดิ์สิทธิ์ ฮาเกียโซเฟีย สถานศักดิ์สิทธิ์ แต่โบราณ... ก็ยังถูกทำลายและปล้นสะดม"
ep3_frankokratia_events.0042.desc_outro: "\n\nผู้นำของเราจะไม่ไว้วางใจชาวกรีกคนใดที่จะปกครองสถานที่แห่งนี้อย่างยุติธรรมและสนับสนุนภารกิจของพระคริสต์อีกต่อไป: เราต้อง แต่งตั้งจักรพรรดิของเราเอง การลงคะแนนเสียงของข้า การเลือกของข้า จะเปลี่ยนแปลงคริสตจักร"
ep3_frankokratia_events.0042.a: "ข้าจะปกครองทั้งชาวละตินและชาวกรีก!"
ep3_frankokratia_events.0042.b: "[player_1.GetTitledFirstNameNoTooltip] ได้รับความเคารพในหมู่นักรบครูเสด"
ep3_frankokratia_events.0042.c: "ให้ [player_2.GetTitledFirstNameNoTooltip] อ้างสิทธิ์ในเกียรติยศนี้"
ep3_frankokratia_events.0042.d: "ต่อ [financier.GetTitledFirstNameNoTooltip] เราเป็นหนี้บุญคุณมากมาย"
ep3_frankokratia_events.0042.e: "[ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('emp_beneficiary_3'))] ของข้า [emp_beneficiary_3.GetNameNoTooltip] มีความสง่างามของจักรพรรดิ!"
ep3_frankokratia_events.0042.f: "[emp_beneficiary_2.GetNameNoTooltip] จงครองราชย์อย่างชาญฉลาด [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('emp_beneficiary_2'))]"
ep3_frankokratia_events.0042.g: "[ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('emp_beneficiary'))] ของข้า [emp_beneficiary.GetNameNoTooltip] สมควรได้รับบัลลังก์"
old_titles_vassals_emp_beneficiary_tooltip: "@warning_icon! #X [emp_beneficiary.GetShortUIName] จะได้รับ [titles|E] และ [vassals|E] ทั้งหมดของท่านที่อยู่นอกอาณาจักร [GetTitleByKey('e_latin_empire').GetNamePossessive]#!"
old_titles_vassals_emp_beneficiary_2_kings_tooltip: "@warning_icon! #X [emp_beneficiary.GetShortUIName] จะได้รับ [titles|E] และ [vassals|E] ทั้งหมดของท่านที่อยู่นอก [latin_kingdom_1.GetNameNoTier] และ [latin_kingdom_2.GetNameNoTier]#!"
old_titles_vassals_emp_beneficiary_1_king_tooltip: "@warning_icon! #X [emp_beneficiary.GetShortUIName] จะได้รับ [titles|E] และ [vassals|E] ทั้งหมดของท่านที่อยู่นอก [latin_kingdom_1.GetNameNoTier]#!"
old_titles_vassals_emp_beneficiary_no_king_tooltip: "@warning_icon! #X [emp_beneficiary.GetShortUIName] จะได้รับ [titles|E] และ [vassals|E] ปัจจุบันทั้งหมดของท่าน#!"
old_titles_vassals_lord_beneficiary_tooltip: "@warning_icon! #X [beneficiary.GetShortUIName] จะได้รับ [titles|E] และ [vassals|E] ทั้งหมดของท่านที่อยู่นอก [realm|E] [de_jure|E] ของ [latin_emperor.GetShortUINamePossessive]#!"

ep3_frankokratia_events.0044.t: "สีม่วงหลวงเป็นของเรา"
ep3_frankokratia_events.0044.desc: "หลังจากการทำสงครามในนามของ [claimant.GetHerHis] [claimant.GetName] บัดนี้ปฏิเสธสิ่งที่เราควรได้รับ #EMP และสิ่งที่พระเจ้าควรได้รับ!#! พวกเรานักรบครูเสดไม่อาจทนได้!\n\nด้วยความโกรธแค้นอันชอบธรรม เราบุกโจมตี [latin_byz_capital_barony.GetNameNoTier] เรา ทำให้ถนนของนางนองไปด้วยเลือดกรีก ขณะที่โบสถ์และพระราชวังถูกปล้นสะดม เรามีทางเลือกอื่นใดนอกจากความพินาศนี้?\n\nชาวกรีกผู้หลอกลวงจะไม่ได้ปกครองที่นี่อีกต่อไป บางทีอาจจะไม่มีวันอีกแล้ว"
ep3_frankokratia_events.0044.desc_past_tense: "หลังจากการทำสงครามในนามของ [claimant.GetHerHis] พวกเรานักรบครูเสดโกรธแค้นเพียงใดเมื่อ [claimant.GetName] ปฏิเสธสิ่งที่เราควรได้รับ #EMP และสิ่งที่พระเจ้าควรได้รับ!#!\n\n[latin_byz_capital_barony.GetNameNoTier] จำเป็นต้องถูกบุกโจมตี เลือดกรีกจำเป็นต้องนองถนนของนาง; โบสถ์และพระราชวังของนางสมควรถูกปล้นสะดม เรามีทางเลือกอื่นใดนอกจากความพินาศนี้?\n\nชาวกรีกผู้หลอกลวงไม่ได้ปกครองที่นี่อีกต่อไป บางทีอาจจะไม่มีวันอีกแล้ว"
ep3_frankokratia_events.0044.outro_emperor: "ชาวละตินจะสวมมงกุฎศักดิ์สิทธิ์ และเกียรติยศในการ แต่งตั้งจักรพรรดิองค์นี้จะเป็นของข้า"
ep3_frankokratia_events.0044.outro_lord: "[latin_emperor.GetName] ได้รับการสวมมงกุฎเป็นนายเหนือชาวละตินและชาวกรีก และพวกเราผู้แสวงบุญคนอื่นๆ ต้องแบ่งปันดินแดนของ [latin_emperor.GetHerHis] ในหมู่พวกเราเอง"

ep3_frankokratia_events.0044.a: "ข้าจะอยู่ที่นี่ และลิ้มรสความสะดวกสบายแบบกรีก!"
ep3_frankokratia_events.0044.b: "[beneficiary_3.GetFirstNameNoTooltip] [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('beneficiary_3'))] ของข้า: จงปกป้องอาณาจักรนี้"
ep3_frankokratia_events.0044.c: "[ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('beneficiary_2'))] ของข้า [beneficiary_2.GetFirstNameNoTooltip] หลงใหลในดินแดนเหล่านี้"
ep3_frankokratia_events.0044.d: "[beneficiary.GetFirstNameNoTooltip] จงปกครองชาวต่างชาติเหล่านี้ให้ดี [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('beneficiary'))]"

ep3_frankokratia_events.0045.t: "ความรุ่งโรจน์ที่มองไม่เห็น"
ep3_frankokratia_events.0045.intro: "เมื่อได้รับชัยชนะและเจรจาเงื่อนไขการจากลาแล้ว พวกเรานักรบครูเสดจ้องมองอย่างเงียบๆ ไปยัง [claimant.GetCapitalLocation.GetTitle.GetNameNoTier]"
ep3_frankokratia_events.0045.intro_constantinople: "อัญมณีแห่งบอสพอรัส ใต้อนุสาวรีย์แห่งยุคอดีต ท่ามกลางวัตถุโบราณอันศักดิ์สิทธิ์ที่สุด มีถนนสกปรกและจัตุรัสที่เหม็นกลิ่นวัวควาย"
ep3_frankokratia_events.0045.intro_generic: "สิ่งทดแทนอันน่าสมเพชสำหรับราชินีแห่งนครต่างๆ เงาของเมืองหลวงเก่า [GetTitleByKey('b_constantinople').GetNameNoTier] พร้อมด้วยมหาวิหารอันศักดิ์สิทธิ์และพระราชวังอันหรูหรา"
ep3_frankokratia_events.0045.desc: "\n\nบางที ชาวโรมันในสมัยโบราณอาจมอบของขวัญให้เราอย่างมั่งคั่ง แน่นอนว่าพวกเขารู้จักความแข็งแกร่งที่จะสังหารพวกนอกรีต ชาวกรีกเหล่านี้ไม่น่าประทับใจเท่า [claimant.GetName] ส่งผู้ปลดปล่อยของ [claimant.GetHerHis] กลับไป"
ep3_frankokratia_events.0045.unpaid: "มือเปล่าและไร้ความช่วยเหลือ\n\nแม้ว่าเราจะบ่นพึมพำ แม้ว่าเราจะมองสมบัติและเครื่องประดับเล็กๆ น้อยๆ ด้วยความโลภ การแสวงบุญอันแปลกประหลาดของเราก็สิ้นสุดลงแล้ว"
ep3_frankokratia_events.0045.paid_off: "ได้รับค่าจ้างครึ่งหนึ่ง นำกองร้อยเล็กๆ ที่ถูกลากลงมาจากกำแพงของ [claimant.GetHerHis]\n\nดังนั้น การแสวงบุญอันแปลกประหลาดของเราจึงได้เห็นผู้ศรัทธาได้รับรางวัลบ้าง ไม่มากก็น้อย อย่างน้อยก็มากกว่าชาวกรีกที่สิ้นหวังและสับสนวุ่นวาย..."
ep3_frankokratia_events.0045.a: "ยังไม่สายเกินไปที่จะช่วยเหลือภารกิจครูเสด!"
ep3_frankokratia_events.0045.b: "สถานที่คุ้นเคยกำลังกวักมือเรียก"

ep3_frankokratia_crusader_joining: "นักรบครูเสดให้คำมั่นต่อผู้อ้างสิทธิ์"
frankokratia_crusader_joining_tooltip: "[joiner.GetName] จะเปลี่ยนเส้นทางผู้แสวงบุญติดอาวุธของ [joiner.GetHerHis] ไปยังไบแซนทิอุม เมื่อถึงเวลาที่เหมาะสม\n\n#high [num_frankokratia_leaders]#! [rulers|E] กำลังเข้าร่วมกิจการของท่าน"

