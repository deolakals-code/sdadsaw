l_english: 
 # Story Cycle
 admin_eunuch_header: "ขันทีผู้ทรงอิทธิพล:"
 admin_eunuch_upgrade_modifier_tt: "#weak [modifiers|E] ได้รับการยกระดับ#!"
 admin_eunuch_downgrade_modifier_tt: "#weak [modifiers|E] ถูกลดระดับ#!"
 admin_eunuch_flavor_tt: "#weak อิทธิพลของ [eunuch.GetFirstNamePossessiveNoTooltip] อาจมอบผลประโยชน์อันยิ่งใหญ่ แต่ต้องแลกมาด้วยสิ่งใด?#!"
 admin_eunuch_rivalry_tt: "[THIS.Char.GetShortUIName] ใกล้ชิดกับการสร้างความเป็นศัตรูกับ [eunuch.GetShortUIName] มากขึ้น"
 # Events
 ep3_story_cycle_admin_eunuch.1001.t: "$admin_eunuch_header$ [eunuch.GetFullNameNoTooltip]"
 ep3_story_cycle_admin_eunuch.1001.intro_byz: "เป็นเวลาหลายศตวรรษที่ [Glossary( 'ยูนุค', 'EUNOUKOS_GLOSS' )] ได้รับใช้ในระบบข้าราชการและพระราชวังของ [ROOT.Char.GetPrimaryTitle.GetAdjectiveNoTooltip] ในฐานะที่ปรึกษาและคนสนิท โดยมีบทบาทสำคัญในการชิงไหวชิงพริบทางการเมืองในยุคนั้น"
 ep3_story_cycle_admin_eunuch.1001.intro: "อาณาจักรต้องการผู้ดูแลระบบและข้ารับใช้ที่ไว้ใจได้เสมอ เพื่อให้การปกครองราบรื่นและความปลอดภัยของพระราชวัง และขันทีคือหนึ่งในผู้ที่ได้รับการประเมินค่าสูงสุดใน [ROOT.Char.GetPrimaryTitle.GetTierAsNameNoTooltip]"
 ep3_story_cycle_admin_eunuch.1001.desc: "\n\n[eunuch.GetFirstName] ได้ไต่เต้าขึ้นมาในลำดับชั้นอย่างรวดเร็ว และความสามารถ ความซื่อสัตย์สุจริต และความสุขุมรอบคอบในทุกสิ่งของ [eunuch.GetHerHis] ได้รับคำสรรเสริญอย่างหาได้ยากทั่วทั้งบรรดาข้าราชสำนัก"
 ep3_story_cycle_admin_eunuch.1001.arrivals: "\n\nมาจากตระกูล [origin.GetDeJureLiege.GetAdjective] ที่ต่ำต้อย เครือญาติของ [eunuch.GetHerHis] เพิ่งเข้าร่วมกับ [eunuch.GetHerHim] ใน [ROOT.Char.GetCapitalLocation.GetBaronyNameExplicitlyNoTooltip]..."
 ep3_story_cycle_admin_eunuch.1001.a: "ข้ามีงานที่เหมาะกับ [eunuch.GetHerHim] พอดี"
 ep3_story_cycle_admin_eunuch.1001.b: "เป็นคนที่ต้องจับตามอง..."
 EUNOUKOS_GLOSS: "ขันที ตามตัวอักษรคือ "ผู้เฝ้าห้องบรรทม" ตามบทบาททั่วไปในฐานะขุนนางในราชสำนัก เป็นข้ารับใช้ชายที่ถูกตอน มาจากชนชั้นทางสังคมที่หลากหลาย มักมีการศึกษาสูง และได้รับความไว้วางใจ เนื่องจากขาดสิ่งรบกวนทางกามารมณ์หรือผลประโยชน์ทางสายเลือด พวกเขาจึงกลายเป็นผู้มีบทบาทสำคัญในการเมืองไบแซนไทน์อย่างรวดเร็ว"

 ep3_story_cycle_admin_eunuch.2010.t: "$admin_eunuch_header$ มือที่ไว้ใจได้"
 ep3_story_cycle_admin_eunuch.2010.desc: "ขันทีของข้า [eunuch.GetTitledFirstName] เข้ามาหาข้าในท้องพระโรง พลางพูดด้วยเสียงกระซิบกระซาบขณะที่ดวงตาของ [eunuch.GetHerHis] กวาดมองไปทั่วห้อง\n\n"[ROOT.Char.Custom('FormOfAddressForLiege')|U]" [eunuch.GetSheHe] พล่าม "เป็นที่ประจักษ์แก่ข้าแล้วว่าการจัดการบริหารราชการแผ่นดินสามารถดำเนินไปได้อย่างราบรื่นกว่าที่... เป็นอยู่ในปัจจุบันมากนัก"\n\n"การ ทำให้แน่ใจว่ามีแผนงานที่ชัดเจนและเป็นระเบียบจะเป็นการแบ่งเบาภาระแก่อาณาจักรอย่างใหญ่หลวง — ปล่อยให้เป็นหน้าที่ของข้าเถิด""
 ep3_story_cycle_admin_eunuch.2010.a: "ใช่ เจ้าควรจัดการเรื่อง เช่นนั้น [eunuch.GetFirstNameNoTooltip]"
 ep3_story_cycle_admin_eunuch.2010.b: "การจัดการที่เป็นอยู่ก็เพียงพอแล้ว"

 ep3_story_cycle_admin_eunuch.2015.t: "$admin_eunuch_header$ แบ่งเบาภาระ"
 ep3_story_cycle_admin_eunuch.2015.desc: "ขันทีของข้า [eunuch.GetTitledFirstName] ได้ช่วยเหลืออย่างมากในช่วงหลัง แบ่งเบาภาระอันหนักอึ้งมากมายในอาณาจักรของข้า\n\nขณะที่เราทำงานหนักฝ่าฟันกองเอกสาร เผาผลาญครั่งในวังไปกับการประทับพระราชลัญจกรครั้งแล้วครั้งเล่า [eunuch.GetSheHe] ค่อยๆ เสนอว่า "ข้า แต่เจ้าเหนือหัว "
 ep3_story_cycle_admin_eunuch.2015.war: "เวลาและความใส่ใจของท่านถูกใช้ไปกับสงคราม,"
 ep3_story_cycle_admin_eunuch.2015.hunter: "ท่านไม่มีเวลาสำหรับการล่าสัตว์อันเป็นที่รักของท่าน,"
 ep3_story_cycle_admin_eunuch.2015.fallback: "ท่านเหน็ดเหนื่อยอย่างยิ่งจากภารกิจอันจำเจของรัฐ,"
 ep3_story_cycle_admin_eunuch.2015.outro: "และคงไม่เป็นการลำบากแก่ข้าที่จะแบ่งเบาความรับผิดชอบอันน่าเหน็ดเหนื่อยเหล่านี้ให้ท่าน...""
 ep3_story_cycle_admin_eunuch.2015.a: "เจ้าช่วยได้มาก [eunuch.GetFirstNameNoTooltip]"
 ep3_story_cycle_admin_eunuch.2015.b: "ข้าจัดการเรื่องต่างๆ ได้ดีอยู่แล้ว"

 ep3_story_cycle_admin_eunuch.2021.t: "$admin_eunuch_header$ ตำแหน่งสูง"
 ep3_story_cycle_admin_eunuch.2021.desc: "ขันทีของข้า [eunuch.GetTitledFirstName] ได้จัดการประชุมส่วนตัว และข้าประหลาดใจที่เห็น [eunuch.GetHerHim] มาพร้อมกับใครบางคน "อ่า [ROOT.Char.GetTitleAsNameNoTooltip]!" [eunuch.GetSheHe] ร้องเสียงแหลม "ท่านรู้จัก [governor.Custom('ComplimentAdjective')] [eunuch.Custom2('RelationToMeShort', SCOPE.sC('governor'))] ของข้า [governor.GetTitledFirstName] หรือไม่?"\n\nด้วยความแม่นยำที่ซักซ้อมมาอย่างดี [governor.GetWomanMan] ก็แสดงท่าทีโอ้อวด [governor.GetHerselfHimself] เพื่อประโยชน์ของข้า\n\n"ฝ่าบาท [governor.GetFirstNameNoTooltip] จะเป็นผู้สมัครที่ #EMP ยอดเยี่ยม#! สำหรับตำแหน่งผู้ว่าการ [title.GetAdjective] [title.GetTierAsNameNoTooltip] — ดีกว่าทางเลือกอื่นมาก อย่างน้อยก็..."
 ep3_story_cycle_admin_eunuch.2021.a.grant: "ตกลง [title.GetNameNoTierNoTooltip] เป็นของ [governor.GetFirstNamePossessiveNoTooltip]"
 ep3_story_cycle_admin_eunuch.2021.a: "ตกลง [governor.GetFirstNameNoTooltip] จะอยู่ในรายชื่อผู้ที่ได้รับการพิจารณา"
 ep3_story_cycle_admin_eunuch.2021.b: "[eunuch.Custom2('RelationToMeShort', SCOPE.sC('governor'))] ของเจ้าควรใช้ช่องทางที่เหมาะสม..."

 ep3_story_cycle_admin_eunuch.2023.desc: "เมื่อมองจากในวัง ข้าคร่ำครวญถึงการสูญเสียความสามารถของท่านไปโดยเปล่าประโยชน์ และการมีอำนาจเหนือกว่าของ [governor.GetWomenMen] ที่ด้อยกว่าในฐานะผู้ปกครองของ [emperor.GetPrimaryTitle.GetAdjectiveNoTooltip]\n\nเพื่อประโยชน์ของ [emperor.GetPrimaryTitle.GetTierAsNameNoTooltip] หากไม่ใช่เพื่อ [emperor.GetHerselfHimself] แล้ว [emperor.GetTitleAsNameNoTooltip] ต้องตระหนักถึงความสามารถของท่าน ด้วยเงินทุนบางส่วน ข้าสามารถ ทำให้แน่ใจได้ว่า [governor.GetSheHe] รู้เรื่องนั้น..."
 ep3_story_cycle_admin_eunuch.2023.a: "จัดการเลย ขันที!"
 ep3_story_cycle_admin_eunuch.2023.a.tt: "[eunuch.GetFirstName] จะพยายามโน้มน้าว [emperor.GetTitledFirstName] ให้พระราชทาน [governorship|E] แก่ท่าน"
 ep3_story_cycle_admin_eunuch.toast: "ขันทีผู้ทรงอิทธิพล"
 ep3_story_cycle_admin_eunuch.2023.b: "ข้าไม่มีเวลาสำหรับเรื่องนี้"
 ep3_story_cycle_admin_eunuch.2023.b.toast: "ข้อเสนอถูกปฏิเสธ"

 ep3_story_cycle_admin_eunuch.2024.t: "$admin_eunuch_header$ ตำแหน่งขุนนาง"
 ep3_story_cycle_admin_eunuch.2024.desc: "ขันทีของข้า [eunuch.GetTitledFirstName] เลื้อยเข้ามาในห้อง ค่อยๆ คดเคี้ยว [eunuch.GetHerHis] ไปยังที่นั่งของข้า\n\n"[ROOT.Char.GetTitleAsNameNoTooltip]!" [eunuch.GetSheHe] ร้องอย่างมีความสุข "ดีใจที่ได้พบท่าน! ข้ากำลังพิจารณาสถานการณ์ [title.GetBaseNameNoTier]: [title.GetTierAsNameNoTooltip] ต้องการผู้นำที่เข้มแข็งและน่าเชื่อถือจริงๆ"\n\n"บังเอิญ ข้าคิดว่าข้ารู้จัก [governor.GetWomanMan] ที่เหมาะสมกับงานนี้ ในความเห็นอันต่ำต้อยของข้า [governor.GetTitledFirstName] จะเป็นผู้ว่าการที่ #EMP น่าเกรงขาม#! — และภักดี ฝ่าบาท""

 ep3_story_cycle_admin_eunuch.2031.t: "$admin_eunuch_header$ [new_patriarch.GetMotherFather|U] ผู้ศักดิ์สิทธิ์"
 ep3_story_cycle_admin_eunuch.2031.intro: "ข้ารู้สึกสนใจเมื่อขันทีของข้า [eunuch.GetTitledFirstName] ขอพบที่"
 ep3_story_cycle_admin_eunuch.2031.intro_byz: "ฮาเกียโซเฟีย"
 ep3_story_cycle_admin_eunuch.2031.intro_fallback: "[ROOT.Char.GetFaith.HouseOfWorship]"
 ep3_story_cycle_admin_eunuch.2031.desc: "และยิ่งกว่านั้นเมื่อข้าพบ [eunuch.GetHerHim] อยู่กับ [eunuch.Custom2('RelationToMeShort', SCOPE.sC('new_patriarch'))] ของ [eunuch.GetHerHis] [new_patriarch.GetFirstName] ซึ่งดูเหมือนกำลังพยายามแสดงความเลื่อมใสศรัทธาแบบ [ROOT.Char.GetFaith.GetAdjectiveNoTooltip] อย่างประหลาด\n\n[eunuch.GetFirstNameNoTooltip] พูดได้ดี — ดีมากเสียจนข้าเกือบไม่ตระหนักถึงความสำคัญของข้อโต้แย้งอันน่าเชื่อถือของ [eunuch.GetHerHis]\n\n"ข้า แต่เจ้าเหนือหัว" [eunuch.GetSheHe] พูดเสียงสั่น มีสีหน้าแปลกประหลาดปรากฏบนใบหน้าของ [eunuch.GetHerHis] "ดังนั้นจึงต้องเป็นพระประสงค์ของ [ROOT.Char.GetFaith.HighGodNameAlternatePossessive] อย่างแน่นอนที่ [new_patriarch.GetFirstNameNoTooltip] จะกลายเป็น [old_patriarch.GetTitleAsName] องค์ใหม่ของ [ROOT.Char.GetFaith.GetAdherentNamePluralNoTooltip]!""
 ep3_story_cycle_admin_eunuch.2031.a: "[eunuch.Custom2('RelationToMeShort', SCOPE.sC('new_patriarch'))] ของเจ้า #EMP จะต้อง#! เป็น [old_patriarch.GetTitleAsNameNoTooltip]!"
 ep3_story_cycle_admin_eunuch.2031.b: "พอเถอะ นี่เป็นข้อเสนอที่ #EMP บ้าบิ่น#!..."

 ep3_story_cycle_admin_eunuch.2040.t: "$admin_eunuch_header$ ที่นั่งในสภา"
 ep3_story_cycle_admin_eunuch.2040.desc: "ขันทีของข้า [eunuch.GetTitledFirstName] ดักเจอข้าขณะที่ข้ากำลังพิจารณาสารต่างๆ "อา [ROOT.Char.GetTitleAsNameNoTooltip]!" [eunuch.GetSheHe] ร้องเสียงแหลม พลางปิดประตูเบาๆ "ขอเวลาสักครู่ได้หรือไม่?"\n\n"ข้ารู้สึกเจ็บปวดที่เห็นงานของสภาของท่านถูกขัดขวางโดย... ผู้รับผิดชอบของมัน" ข้าเลิกคิ้ว\n\n[eunuch.GetSheHe|U] กระแอมในลำคอของ[eunuch.GetHerHis] "ข้ายินดีเป็นอย่างยิ่งที่จะรับผิดชอบบางส่วนไปดูแล และดูแลผลประโยชน์ของท่าน รวมถึงผลประโยชน์ของ[ROOT.Char.GetPrimaryTitle.GetTierAsNameNoTooltip] อย่างใกล้ชิดยิ่งขึ้น""
 ep3_story_cycle_admin_eunuch.2040.a: "เป็นความคิดที่ยอดเยี่ยม [eunuch.GetFirstNameNoTooltip] เริ่มได้ทันที"
 ep3_story_cycle_admin_eunuch.2040.b: "ข้าไม่อยากให้เจ้าเสียสมาธิจากหน้าที่อื่น"
 ep3_story_cycle_admin_eunuch.2040.a.toast: "การ แต่งตั้งเข้าสภา"

 ep3_story_cycle_admin_eunuch.2041.t: "$admin_eunuch_header$ อีกเสียงหนึ่ง"
 ep3_story_cycle_admin_eunuch.2041.desc: "ขันทีของข้า [eunuch.GetTitledFirstName] โผล่ศีรษะของ [eunuch.GetHerHis] เข้ามาทางประตูห้องสภา ยิ้มกว้างเมื่อ [eunuch.GetSheHe] เห็นข้า และเดินเข้ามาพร้อมกับญาติคนหนึ่งของ [eunuch.GetHerHis]\n\n"ข้า แต่ [ROOT.Char.GetTitleAsNameNoTooltip] ของข้า!" [eunuch.GetSheHe] ตัวสั่น "เมื่อพิจารณาถึง... ความสามารถที่ค่อนข้างขาดพร่องของสมาชิกสภาของท่าน มันก็ผุดขึ้นมาในหัวข้าทันที! [eunuch.Custom2('RelationToMeShort', SCOPE.sC('councillor'))] ของข้า [councillor.GetFirstName] ผู้นี้ สามารถเป็นทรัพย์สินอันยิ่งใหญ่แก่ [ROOT.Char.GetLadyLord]ship ของท่านได้!""
 ep3_story_cycle_admin_eunuch.2041.a: "ตกลง ตามที่เจ้าว่า [eunuch.GetFirstNameNoTooltip]"
 ep3_story_cycle_admin_eunuch.2041.b: "ข้าจะลองคิดดู..."

 ep3_story_cycle_admin_eunuch.2043.desc: "ในฐานะขันทีในวัง ข้าเห็นการปกครองที่ย่ำแย่มากมาย และเป็นที่ประจักษ์แก่ข้าว่าท่านคือหนึ่งในข้าในบังคับที่มีค่าที่สุด และถูกมองข้ามที่สุดของ [emperor.GetTitleAsNamePossessive]\n\nด้วยการสนับสนุนของท่าน ข้าสามารถเปล่งเสียงถึงคุณงามความดีของคำปรึกษาของท่านได้ดังยิ่งขึ้น — เพื่อประโยชน์ของ [emperor.GetPrimaryTitle.GetTierAsNameNoTooltip]"
 ep3_story_cycle_admin_eunuch.2043.a: "แน่นอน [eunuch.GetFirstNameNoTooltip]!"
 ep3_story_cycle_admin_eunuch.2043.a.tt: "[eunuch.GetFirstName] จะพยายามโน้มน้าว [emperor.GetTitledFirstName] ให้ แต่งตั้งท่านเป็น [councillor|E]"
 ep3_story_cycle_admin_eunuch.2043.b: "ข้าไม่สนใจ"
 ep3_story_cycle_admin_eunuch.2043.b.toast: "ข้อเสนอถูกปฏิเสธ"

 ep3_story_cycle_admin_eunuch.2044.t: "$admin_eunuch_header$ ที่ปรึกษาผู้ทรงอำนาจ"
 ep3_story_cycle_admin_eunuch.2044.desc: "ขันทีของข้า [eunuch.GetTitledFirstName] กระแอมเสียงแหลมขณะที่เราเตรียมหารือเรื่องราชการบางอย่าง\n\n"[ROOT.Char.GetTitleAsNameNoTooltip]" [eunuch.GetSheHe] กระตุ้น พิจารณาคำพูดของ [eunuch.GetHerHis] "ในขณะที่การปกครองของท่าน — #EMP โดยธรรมชาติ#! — มีประสิทธิภาพ แต่ก็อดสงสัยไม่ได้ถึง... โอกาสบางอย่างที่พลาดไป"\n\n"มี [councillor.GetWomenMen] ที่ดี #EMP มีเหตุผล#! ซึ่งถูกมองข้ามสำหรับตำแหน่งสูงสุด [councillor.GetWomenMen|U] เช่น [councillor.GetTitledFirstName] เป็นต้น! [councillor.GetSheHe|U] จะเป็นทรัพย์สินอันยิ่งใหญ่แก่ [ROOT.Char.GetLadyLord]ship ของท่าน!""

 ep3_story_cycle_admin_eunuch.2050.t: "$admin_eunuch_header$ ความคิดริเริ่มอันล้นเหลือ"
 ep3_story_cycle_admin_eunuch.2050.desc: "ขันทีของข้า [eunuch.GetTitledFirstName] เข้ามาหาข้าพร้อมรอยยิ้มพึงพอใจบนริมฝีปาก [eunuch.GetHerHis] พลางส่งเสียงเล็กแหลมว่า "[ROOT.Char.Custom('FormOfAddressForLiege')|U] ข้ามีข้อเสนอที่น่าอภิรมย์ที่สุดมาให้ท่าน!"\n\n"
 ep3_story_cycle_admin_eunuch.2050.debase: ""[ROOT.Char.GetPrimaryTitle.GetTierAsNameNoTooltip] ต้องการเหรียญกษาปณ์เพิ่มเสมอ และข้าได้คำนวณตัวเลขแล้ว ด้วยการปรับเปลี่ยนเล็กน้อยในกลยุทธ์การผลิตเหรียญกษาปณ์ของเรา เราสามารถประหยัดเหรียญกษาปณ์ได้เป็นจำนวนมาก!""
 ep3_story_cycle_admin_eunuch.2050.raise_taxes: ""[ROOT.Char.GetPrimaryTitle.GetTierAsNameNoTooltip] ต้องการเงินทุนเพิ่มเสมอ และในทำนองนั้น ข้าได้เสนอข้อเสนอสำหรับการขึ้นภาษี #EMP เล็กน้อย#!""
 ep3_story_cycle_admin_eunuch.2050.candidacy: ""หลังจากได้ยินเสียงมากมายทั่วทั้ง [ROOT.Char.GetPrimaryTitle.GetTierAsNameNoTooltip] ข้าเห็นโอกาสอันยิ่งใหญ่ที่จะช่วยเหลือการสมัครรับเลือกตั้งของ [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('boon_target'))] ของท่าน [boon_target.GetFirstNamePossessive] สำหรับ [boon_title.GetTierAsNameNoTooltip] [boon_title.GetAdjective]!""
 ep3_story_cycle_admin_eunuch.2050.fabricate_hook: ""ข่าวสารเดินทางอย่างรวดเร็วใน [ROOT.Char.GetCapitalLocation.GetBaronyNameExplicitlyNoTooltip] และข่าวลือก็ เช่นกัน! ข้ามีอำนาจต่อรองที่ท่านต้องการพอดี เพื่อให้แน่ใจว่า [boon_victim.GetTitledFirstName] รู้จักที่ทางของ [boon_victim.GetHerHis]!""
 ep3_story_cycle_admin_eunuch.2050.imprison_rebel: ""เราทุกคนรู้ดีว่า [boon_victim.GetTitledFirstName] สร้างปัญหาให้ [boon_victim.GetHerselfHimself] มากเพียงใด ข้าบังเอิญมีทางออกที่เหมาะสมพอดี!""
 ep3_story_cycle_admin_eunuch.2050.influence: ""ข้ามีแหล่งข่าวมากมาย เช่นเดียวกับกระบอกเสียง พวกเขาเพียงต้องการการชี้นำเล็กน้อย ไม่มีใครมีผู้สนับสนุนมากเกินไป นั่นคือสิ่งที่ข้าพูดเสมอ""
 ep3_story_cycle_admin_eunuch.2050.outro: "\n\n"แล้ว ข้าจะออกคำสั่งหรือไม่ [ROOT.Char.GetTitleAsNameNoTooltip] ผู้รุ่งโรจน์?""
 ep3_story_cycle_admin_eunuch.2050.a: "ยอดเยี่ยม เป็นความคิดริเริ่มที่ยิ่งใหญ่!"
 ep3_story_cycle_admin_eunuch.2050.b: "ไม่จำเป็น [eunuch.GetFirstNameNoTooltip]"

 ep3_story_cycle_admin_eunuch.2051.t: "$admin_eunuch_header$ นกน้อย"
 ep3_story_cycle_admin_eunuch.2051.desc: "ขันทีของข้า [eunuch.GetTitledFirstName] ได้จัดการประชุมส่วนตัวระหว่างเรากับ [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('secret_owner'))] ของข้า [secret_owner.GetTitledFirstName] ผู้ ซึ่งดูจากสีหน้าของ [secret_owner.GetHerHis] แล้ว ก็ไม่แน่ใจว่าควรจะคิด เช่นไร\n\nขันทีที่หัวเราะเสียงแหลมกำลังข่มขู่ [secret_owner.GetWomanMan] ผู้น่าสงสารด้วยพระนาม [ROOT.Char.GetFaith.HighGodName] พลางพูดเป็นนัยชอนไชด้วยวิธีของ[eunuch.GetHerHis] ไปสู่ความลับดำมืดบางอย่างของ [ROOT.Char.Custom2('RelationToMePossessive', SCOPE.sC('secret_owner'))] ข้า ที่ [secret_owner.GetSheHe] ไปขุดคุ้ยมา\n\nในที่สุด [eunuch.Custom2('InsultNoun', ROOT.Char)] ผู้พึงพอใจในตนเองก็หันมาหาข้าพร้อมรอยยิ้มอันน่าสะอิดสะเอียน "เอาล่ะ [ROOT.Char.Custom('FormOfAddressForLiege')] ท่านอยากรู้หรือไม่ว่า #EMP ข้า#! รู้อะไรมา?""
 ep3_story_cycle_admin_eunuch.2051.a: "บอกข้ามาให้หมด [eunuch.GetFirstNameNoTooltip]!"
 ep3_story_cycle_admin_eunuch.2051.a.tt: "ท่านเรียนรู้หนึ่งใน [secrets|E] ของ [secret_owner.GetTitledFirstNamePossessive]"
 ep3_story_cycle_admin_eunuch.2051.b: "ข้าคิดว่าข้าไม่อยากรู้ดีกว่า..."

 ep3_story_cycle_admin_eunuch.2052.t: "$admin_eunuch_header$ มีบางอย่างไม่ชอบมาพากล"
 ep3_story_cycle_admin_eunuch.2052.desc: "ขันทีของข้า [eunuch.GetTitledFirstName] ได้จัดการประชุมส่วนตัวระหว่างเรากับ [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('scheme_owner'))] ของข้า [scheme_owner.GetFirstName] ผู้ ซึ่งดูจากสีหน้าของ [scheme_owner.GetHerHis] แล้ว ก็รู้สึกกังวลอย่างยิ่งกับคำพูดของ [eunuch.GetFirstNamePossessiveNoTooltip]\n\nขันทีที่หัวเราะเสียงแหลมกำลังข่มขู่ [scheme_owner.GetWomanMan] ผู้น่าสงสารด้วยพระนาม [ROOT.Char.GetFaith.HighGodName] พลางพูดเป็นนัย[eunuch.GetHerHis]ถึงแผนการอันดำมืดบางอย่างของ [ROOT.Char.Custom2('RelationToMePossessive', SCOPE.sC('scheme_owner'))] ข้า ที่ [eunuch.GetSheHe] อ้างว่าไปขุดคุ้ยมา\n\nในที่สุด [eunuch.Custom2('InsultNoun', ROOT.Char)] ผู้พึงพอใจในตนเองก็หันมาหาข้าพร้อมรอยยิ้ม "เอาล่ะ [ROOT.Char.Custom('FormOfAddressForLiege')] ท่านอยากรู้หรือไม่ว่า [ROOT.Char.Custom2('RelationToMePossessive', SCOPE.sC('scheme_owner'))] ของท่านกำลังทำอะไรอยู่?""
 ep3_story_cycle_admin_eunuch.2052.a: "บอกข้ามาให้หมด [eunuch.GetFirstNameNoTooltip]!"
 ep3_story_cycle_admin_eunuch.2052.a.tt: "ท่านเปิดโปงหนึ่งใน [hostile_schemes|E] ของ [scheme_owner.GetTitledFirstNamePossessive]"
 ep3_story_cycle_admin_eunuch.2052.b: "ข้าคิดว่าข้าไม่อยากรู้ดีกว่า..."

 ep3_story_cycle_admin_eunuch.2060.t: "$admin_eunuch_header$ ความรับผิดชอบเพิ่มเติม"
 ep3_story_cycle_admin_eunuch.2060.desc: "ขันทีของข้า [eunuch.GetTitledFirstName] เดินเข้ามาหาข้าพร้อมกับไอเล็กน้อยขณะที่ข้ารอการเข้าเฝ้า ก่อนจะเริ่มพูด "อา ข้า แต่ [eunuch.Custom2('RelationToMeShort', ROOT.Char)] ของข้า มีบางอย่างที่ข้าอยากจะถามท่าน"\n\n"ในขณะที่ข้าซาบซึ้งในตำแหน่งของข้าในราชสำนักของท่านเป็นอย่างยิ่ง ข้าคิดว่าข้าสามารถให้ความช่วยเหลือเพิ่มเติมได้ อันที่จริง ข้ามีบทบาทหนึ่งในใจ...""
 ep3_story_cycle_admin_eunuch.2060.a: "ใช่ ใช่ มันเป็นของเจ้า [eunuch.GetFirstNameNoTooltip]"
 ep3_story_cycle_admin_eunuch.2060.b: "ไม่ ข้ามีความคิดอื่น..."

 ep3_story_cycle_admin_eunuch.2061.t: "$admin_eunuch_header$ การเลื่อนตำแหน่งของครอบครัว"
 ep3_story_cycle_admin_eunuch.2061.desc: "ขันทีของข้า [eunuch.GetTitledFirstName] เข้ามาหาข้า โดยมี [positioner.GetWomanMan] หน้าตาธรรมดาๆ ตามมา "อยู่นี่เอง [ROOT.Char.GetTitleAsNameNoTooltip]!" [eunuch.GetSheHe] ยิ้มกว้าง "ข้าได้นำ [eunuch.Custom2('RelationToMeShort', SCOPE.sC('positioner'))] ผู้มีความสามารถของข้า [positioner.GetTitledFirstName] มาให้ท่าน!"\n\nด้วยความแม่นยำที่ซักซ้อมมาอย่างดี [positioner.GetWomanMan] ก็แสดงท่าทีโอ้อวด [positioner.GetHerselfHimself] เพื่อประโยชน์ของข้า\n\n"ฝ่าบาท [positioner.GetFirstNameNoTooltip] จะเป็นผู้สมัครที่ #EMP ยอดเยี่ยม#! สำหรับตำแหน่งในราชสำนักของท่าน — จริงๆ แล้ว [positioner.GetSheHe] เสียเปล่าหากอยู่ที่อื่น...""
 ep3_story_cycle_admin_eunuch.2061.a: "[positioner.GetFirstNameNoTooltip] เป็นข้อเสนอที่ดี!"
 ep3_story_cycle_admin_eunuch.2061.b: "ข้ายังไม่มั่นใจ..."

 ep3_story_cycle_admin_eunuch.2070.t: "$admin_eunuch_header$ การไต่เต้าทางสังคม"
 ep3_story_cycle_admin_eunuch.2070.desc: "ขันทีของข้า [eunuch.GetTitledFirstName] ปรากฏตัวต่อหน้าข้า โดยมีสมาชิกในครอบครัวของ [eunuch.GetHerHis] ตามมา "[ROOT.Char.GetTitleAsNameNoTooltip]!" [eunuch.GetSheHe] หัวเราะ "ข้ามีข้อเสนอที่น่ายินดีที่สุดสำหรับท่าน!\n\n"[eunuch.Custom2('RelationToMeShort', SCOPE.sC('eunuch_marry'))] ของข้า [eunuch_marry.GetTitledFirstName] ผู้นี้ จะเป็นคู่ครองที่ #EMP เหมาะสมที่สุด#! สำหรับ [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('emperor_marry'))] ของท่าน [emperor_marry.GetTitledFirstName] ข้ามั่นใจว่าท่านเห็นด้วย!"\n\nด้วยความแม่นยำที่เกือบจะซักซ้อมมาอย่างดี [eunuch_marry.GetWomanMan] ผู้นั้นนำเสนอ [eunuch_marry.GetHerselfHimself] อย่างภาคภูมิใจต่อหน้าข้า"
 ep3_story_cycle_admin_eunuch.2070.a: "[eunuch_marry.GetFirstNameNoTooltip] เป็นคู่ที่เหมาะสมสำหรับ [emperor_marry.GetFirstNameNoTooltip]!"
 ep3_story_cycle_admin_eunuch.2070.b: "ข้าไม่คิด เช่นนั้น..."

 ep3_story_cycle_admin_eunuch.3000.t: "$admin_eunuch_header$ เด็กในอุปถัมภ์"
 ep3_story_cycle_admin_eunuch.3000.desc: "มีการพูดคุยกันมากมายในช่วงหลังเกี่ยวกับความสนใจเป็นพิเศษที่ขันทีของข้า [eunuch.GetTitledFirstName] ดูเหมือนจะมอบให้กับ [eunuch.Custom2('RelationToMeShort', SCOPE.sC('protege'))] ของ [eunuch.GetHerHis] [protege.GetFirstName]\n\nขันทีผู้นั้นปฏิบัติต่อ [protege.GetHerHim] เกือบเหมือน [protege.Custom('GetDaughterSon')] ที่ [eunuch.GetSheHe] ไม่มีวันมีได้..."
 ep3_story_cycle_admin_eunuch.3000.a: "น่าสงสัย"

 ep3_story_cycle_admin_eunuch.3001.t: "$admin_eunuch_header$ ศิษย์"
 ep3_story_cycle_admin_eunuch.3001.desc: "ดูเหมือนว่าขันทีของข้า [eunuch.GetTitledFirstName] ได้รับขันทีอีกคนมาไว้ใต้ปีกของ [eunuch.GetHerHis] และสอน [student.GetHerHim] ถึงวิถีทางของการบริหารราชการ [ROOT.Char.GetPrimaryTitle.GetAdjectiveNoTooltip]\n\n[student.GetFirstName] มักถูกพบเห็นอยู่กับ [eunuch.GetHerHim] ทั้งคู่กำลังพินิจพิเคราะห์ตัวเลขและหารือเกี่ยวกับเศรษฐกิจของ [ROOT.Char.GetPrimaryTitle.GetTierAsNameNoTooltip] — เราทำได้เพียงสันนิษฐาน..."
 ep3_story_cycle_admin_eunuch.3001.a: "ขันทีที่มีประโยชน์อีกคน ข้าเดาว่า"

 ep3_story_cycle_admin_eunuch.3010.t: "$admin_eunuch_header$ คู่แข่ง"
 ep3_story_cycle_admin_eunuch.3010.desc: "วิถีทางของสำนักเลขาธิการขันทีเป็นเรื่องลึกลับสำหรับคนธรรมดา เช่นข้า แต่เป็นที่ชัดเจนว่าการไต่เต้าอย่างรวดเร็วและการเข้าถึงที่กว้างขวางของ [eunuch.GetFirstName] ได้สร้างศัตรูให้ [eunuch.GetHerHim] แม้ แต่ที่นั่น\n\n[rival.GetFirstName] ขันทีอีกคน ได้แสดงความเป็นศัตรูของ [rival.GetHerHis] อย่างชัดเจน และดูเหมือนว่าพวกเขากำลังพยายามอย่างเต็มที่ที่จะขัดขวาง ซึ่งกันและกัน"
 ep3_story_cycle_admin_eunuch.3010.a: "ข้ามั่นใจว่าพวกเขาจะยุติความขัดแย้งกันได้..."

 ep3_story_cycle_admin_eunuch.4000.t: "$admin_eunuch_header$ ข้อกล่าวหา"
 ep3_story_cycle_admin_eunuch.4000.desc: "ขณะที่ข้ากำลังเดินกลับไปที่เตียง ข้าเดินสวนทางกับ [eunuch.GetFirstName] ที่ดูตื่นตระหนก ผู้ ซึ่งสูดหายใจเฮือก "[ROOT.Char.Custom('FormOfAddressForLiege')|U] ข้าดีใจเหลือเกินที่พบท่าน! โอ มันเป็นข่าวที่น่าทุกข์ใจที่สุด!"\n\n[eunuch.GetSheHe|U] เข้ามาใกล้ กระซิบที่หูข้าว่า "เป็น [spouse.Custom('WifeHusband')] ของท่าน [eunuch.Custom2('RelationToMeShort', ROOT.Char)] ของข้า! ดูเหมือนว่า [spouse.GetSheHe] กำลัง...มีสัมพันธ์สวาท! นอกสมรส! เล่นบทอัศจรรย์! กับใครบางคนในราชสำนัก!"\n\nข้าจ้องมอง [eunuch.GetHerHim] พลางค้นหาคำพูด"
 ep3_story_cycle_admin_eunuch.4000.a: "อธิบายมาเดี๋ยวนี้!"
 ep3_story_cycle_admin_eunuch.4000.success: "ท่านพบความจริง"
 ep3_story_cycle_admin_eunuch.4000.success.tt: "[secret|E] หรือ [scheme|E] อาจถูกเปิดเผย"
 ep3_story_cycle_admin_eunuch.4000.failure: "ท่านพบเพียงความสงสัย"
 ep3_story_cycle_admin_eunuch.4010.failure.tt: "ท่านไม่พบสิ่งใด"
 ep3_story_cycle_admin_eunuch.4000.b: "โอ้ ใช่ ข้ารู้แล้ว"
 ep3_story_cycle_admin_eunuch.4000.b.reason: "ตัวเลือกนี้มีให้ เพราะท่านรู้ [secret|E] อยู่แล้ว"
 ep3_story_cycle_admin_eunuch.4000.c: "เจ้า [spouse.Custom2('InsultNounSexual', ROOT.Char)] ที่น่าสังเวชนั่น! จับ [spouse.GetHerHim] ไปขังเดี๋ยวนี้!"
 ep3_story_cycle_admin_eunuch.4000.innocent: "ไม่มีหลักฐานการมีชู้"

 ep3_story_cycle_admin_eunuch.4010.t: "$admin_eunuch_header$ การประพฤติตัวไม่เหมาะสม"
 ep3_story_cycle_admin_eunuch.4010.desc: "ข่าวลือแพร่สะพัดไปอย่างรวดเร็วในช่วงหลัง และยิ่งข้าครุ่นคิดถึงเนื้อหาของมันมากเท่าไหร่ ข้าก็ยิ่งเห็นเหตุผลในนั้นมากขึ้นเท่านั้น...\n\n[spouse.Custom('WifeHusband')] ของข้า และ [seducer.GetFirstName]! [spouse.GetTitledFirstName] ทำ เช่นนี้กับข้าได้อย่างไร...? ข้าได้ทบทวนข้อเท็จจริงในใจครั้งแล้วครั้งเล่า และยังไม่เข้าใกล้ความจริงเลย\n\nข้าสงสัยว่ามีมือของ [seducer.Custom2('RelationToMeShort', SCOPE.sC('eunuch'))] ของคนพาลนั่น [eunuch.GetFirstName] อยู่ในเรื่องนี้ แต่ข้าจะรู้ได้อย่างไร?"
 ep3_story_cycle_admin_eunuch.4010.a: "เราจะได้เห็นว่าแผนสมคบคิดนี้ลึกซึ้งเพียงใด..."
 ep3_story_cycle_admin_eunuch.4010.c: "จับทั้งสามคนขังทันที!"
 ep3_story_cycle_admin_eunuch.4010.d: "บางทีมันอาจจะไม่ #EMP แย่#! ขนาดนั้น?"

 ep3_story_cycle_admin_eunuch.5000.t: "$admin_eunuch_header$ การสร้างศัตรู"
 ep3_story_cycle_admin_eunuch.5000.desc: "[ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('whinger'))] ของข้า [whinger.GetTitledFirstName] เข้ามาในห้องทำงานของข้าเต็มไปด้วยความโกรธเกรี้ยว กวาดตามองไปทั่วห้อง ในที่สุด [whinger.GetSheHe] ก็เข้ามาใกล้ ถอนหายใจ "ดี สัตว์ร้าย #EMP น่ารังเกียจ#! นั่นไม่อยู่ที่นี่!"\n\nข้าครุ่นคิดอยู่ครู่หนึ่งว่า [whinger.GetSheHe] หมายถึงใคร แต่ก็ไม่จำเป็นต้องคิดนาน "[whinger.Custom2('RelationToMeShort', ROOT.Char)|U]! ท่าน #EMP ต้อง#! ทำอะไรบางอย่างเกี่ยวกับขันทีนั่น [eunuch.GetFirstName]! [eunuch.GetSheHe|U] เข้าไปยุ่งเกี่ยวทุกเรื่อง และมีหูตาอยู่ทุกที่ ข้าบอกท่านเลย [eunuch.GetSheHe] กำลังทำสิ่งไม่ดี!"
 ep3_story_cycle_admin_eunuch.5000.a: "โอ้ อย่าไร้สาระน่า! [eunuch.GetSheHe|U] เป็นข้ารับใช้ที่ภักดี"
 ep3_story_cycle_admin_eunuch.5000.b: "บางทีเจ้าอาจจะถูก..."

 ep3_story_cycle_admin_eunuch.5010.t: "$admin_eunuch_header$ การต่อต้าน"
 ep3_story_cycle_admin_eunuch.5010.desc: ""ท่านไม่เห็นหรือว่าแมงมุมตัวนี้กำลังชักใยของ[eunuch.GetHerHis]ต่อต้านท่าน [rival.Custom2('RelationToMeShort', ROOT.Char)]?" [rival.GetFirstName] พูดขัดจังหวะ [eunuch.GetFirstName] ที่ดูตกตะลึงอย่างเห็นได้ชัด ซึ่งหันมามองข้า\n\nความขัดแย้งระหว่าง [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('rival'))] ของข้า และ [eunuch.GetFirstNameNoTooltip] เลวร้ายลงในช่วงหลังนี้ และกำลังคุกคามจนกลายเป็นสิ่งรบกวนสำคัญในราชสำนัก\n\n[eunuch.GetFirstNameNoTooltip] ตั้งสติ [eunuch.GetHerselfHimself] ก่อนจะโต้กลับว่า "นั่นเป็นข้อกล่าวหาที่ร้ายแรงยิ่ง [ROOT.Char.Custom('FormOfAddressForLiege')]! ข้าห่วงใยเพียงผลประโยชน์สูงสุดของ [ROOT.Char.GetPrimaryTitle.GetTierAsNameNoTooltip] เท่านั้น!""
 ep3_story_cycle_admin_eunuch.5010.a: "[ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('rival'))|U] ข้าเชื่อใจ [eunuch.GetFirstNameNoTooltip] และเจ้าก็ต้องเชื่อใจด้วย"
 ep3_story_cycle_admin_eunuch.5010.b: "ใช่ ขันทีล้ำเส้น"

 ep3_story_cycle_admin_eunuch.5020.t: "$admin_eunuch_header$ การต่อต้านน้อยที่สุด"
 ep3_story_cycle_admin_eunuch.5020.desc: "มีคนบอกข้าว่า [puppet.GetTitledFirstName] [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('puppet'))] ของข้า ใช้เวลา [puppet.GetHerHis] มากขึ้นเรื่อยๆ อยู่กับขันที [eunuch.GetFirstName] และทั้งสองถูกพบเห็นอยู่ด้วยกันตลอดเวลา พูดคุยกันเป็นการส่วนตัวและอย่างตั้งใจ\n\nข้ายังได้ยินมาว่า [puppet.GetFirstNameNoTooltip] ได้รับการสั่งสอนบางอย่าง ราวกับว่า [eunuch.GetFirstNameNoTooltip] กำลังเตรียม [puppet.GetHerHim] ให้ดำรงตำแหน่งในสำนักเลขาธิการขันที!"
 ep3_story_cycle_admin_eunuch.5020.a: "คู่หูที่ไม่น่าเป็นไปได้"

 ep3_story_cycle_admin_eunuch.6000.t: "$admin_eunuch_header$ รัฐประหารแบบ [emperor.GetPrimaryTitle.GetAdjectiveNoTooltip] อย่างยิ่ง"
 ep3_story_cycle_admin_eunuch.6000.desc: "ขณะที่ข้าเดินไปมาในห้องบัลลังก์ ข้าเห็น [eunuch.GetFirstName] กำลังเข้ามาอย่างมีจุดหมาย โดยมีคณะขันทีตามหลังมา "[ROOT.Char.GetTitleAsNameNoTooltip]!" เขาร้อง "ข้าต้องคุยกับท่าน!""
 ep3_story_cycle_admin_eunuch.6000.body: "\n\nขันทีถอนหายใจอย่างหนัก "ข้าเสียใจที่ต้องมาถึงจุดนี้ ฝ่าบาท มัน #EMP โชคร้าย#! อย่างยิ่ง ข้าได้รับคำสั่งให้แจ้งท่านว่าการปกครองของท่านไม่สามารถดำรงอยู่ได้อีกต่อไป"\n\n"
 ep3_story_cycle_admin_eunuch.6000.family: ""ได้มีการตัดสินใจแล้ว: ท่านจะส่งมอบตำแหน่งให้แก่ [ROOT.Char.Custom2('RelationToMeShort', coupist)] ของท่าน [coupist.GetTitledFirstName] เพื่อประโยชน์ของจักรวรรดิ!""
 ep3_story_cycle_admin_eunuch.6000.co_caesar: ""ได้มีการตัดสินใจแล้ว: ท่านจะส่งมอบตำแหน่งให้แก่ [ROOT.Char.Custom2('RelationToMeShort', coupist)] ของท่าน [coupist.GetTitledFirstName] เพื่อประโยชน์ของจักรวรรดิ!""
 ep3_story_cycle_admin_eunuch.6000.eunuch_family: ""ได้มีการตัดสินใจแล้ว: ท่านจะส่งมอบตำแหน่งให้แก่ [eunuch.Custom2('RelationToMeShort', coupist)] ของข้า [coupist.GetTitledFirstName] เพื่อประโยชน์ของ [ROOT.Char.GetPrimaryTitle.GetBaseNameNoTierNoTooltip]!""
 ep3_story_cycle_admin_eunuch.6000.regent: ""ได้มีการตัดสินใจแล้ว: ท่านจะส่งมอบตำแหน่งให้แก่ผู้สำเร็จราชการของท่าน [coupist.GetTitledFirstName] เพื่อประโยชน์ของจักรวรรดิ!""
 ep3_story_cycle_admin_eunuch.6000.fallback: ""ได้มีการตัดสินใจแล้ว: ท่านจะส่งมอบตำแหน่งให้แก่ [coupist.GetTitledFirstName] เพื่อประโยชน์ของจักรวรรดิ!""
 ep3_story_cycle_admin_eunuch.6000.a: "นี่คือ #EMP การกบฏ#! ทหาร! จับพวกมัน!"
 ep3_story_cycle_admin_eunuch.6000.a.success: "รัฐประหารล้มเหลว"
 ep3_story_cycle_admin_eunuch.6000.a.failure: "รัฐประหารสำเร็จ"
 ep3_story_cycle_admin_eunuch.6000.c: "ไปเสียตอนนี้ แล้วข้าอาจจะไว้ชีวิตเจ้า"
 ep3_story_cycle_admin_eunuch.6000.d: "ตกลง... ข้าจะทำตามที่เจ้าร้องขอ"

 ep3_story_cycle_admin_eunuch.8000.t: "$admin_eunuch_header$ การยึดติดกับอำนาจ"
 ep3_story_cycle_admin_eunuch.8000.intro: "ขันที [eunuch.GetTitledFirstName] มีอิทธิพลอย่างมากใน"
 ep3_story_cycle_admin_eunuch.8000.intro_byz: "[Glossary( 'ยูนุค', 'EUNOUKOS_GLOSS' )] [eunuch.GetTitledFirstName] มีอิทธิพลอย่างมากใน"
 ep3_story_cycle_admin_eunuch.8000.intro_family: "[ROOT.Char.Custom2('RelationToMeShort', previous_story_owner)] ของข้า"
 ep3_story_cycle_admin_eunuch.8000.intro_enemy: "ศัตรูของข้า"
 ep3_story_cycle_admin_eunuch.8000.intro_fallback: "ผู้ดำรงตำแหน่งก่อนหน้าข้า"
 ep3_story_cycle_admin_eunuch.8000.desc: "การบริหารราชการของ [previous_story_owner.GetTitledFirstNamePossessive] — [eunuch.GetSheHe] ยังคงมีอิทธิพลบางส่วนในวัง...\n\n[eunuch.GetSheHe|U] ไม่เสียเวลาในการแสวงหาความโปรดปรานจากข้า แสดงความเคารพนบนอบอย่างประจบสอพลอไปทั่วราชสำนัก บางที [eunuch.GetSheHe] อาจพิสูจน์ได้ว่ามีประโยชน์"
 ep3_story_cycle_admin_eunuch.8000.a: "[eunuch.GetFirstNameNoTooltip] ต้องไป"
 ep3_story_cycle_admin_eunuch.8000.b: "ถึงเวลาที่ [student.GetFirstNameNoTooltip] จะเข้ารับตำแหน่งแทน"
 ep3_story_cycle_admin_eunuch.8000.c: "[rival.GetFirstNameNoTooltip] เป็นมือที่มั่นคงกว่า"
 ep3_story_cycle_admin_eunuch.8000.d: "ข้าจะไม่ ทำให้สมดุลอำนาจเสียไป"

 ep3_story_cycle_admin_eunuch.8010.t: "$admin_eunuch_header$ ชีวิตแห่งการรับใช้"
 ep3_story_cycle_admin_eunuch.8010.desc: "ข้ารับใช้ผู้มีค่าของ [admin_title.GetDefinitiveName] ได้เสียชีวิตลงอย่างน่าเศร้า [eunuch.GetFirstName] หนึ่งในขันทีผู้มีอิทธิพลที่สุดในยุคหลัง [eunuch.GetDeathReasonHideKiller]...\n\nขอ [ROOT.Char.GetFaith.HighGodName] อย่าได้รอช้าในการประทานข้ารับใช้ที่มีความสำคัญและทักษะเทียบเท่า [eunuch.GetHerHis] แก่ [ROOT.Char.GetPrimaryTitle.GetTierAsNameNoTooltip] อีก"
 ep3_story_cycle_admin_eunuch.8010.d: "สิ่งต่างๆ จะเปลี่ยนไปอย่างแน่นอน..."

 ep3_story_cycle_admin_eunuch.8020.t: "$admin_eunuch_header$ กุญแจและที่คุมขัง"
 ep3_story_cycle_admin_eunuch.8020.desc: "ครั้งหนึ่งเคยเป็นข้ารับใช้ผู้มีค่าของ [admin_title.GetDefinitiveName] ขันทีในราชสำนักผู้มีอิทธิพล [eunuch.GetFirstName] บัดนี้ขัดเคืองต่อโซ่ตรวน [background_dungeon_scope.GetPrimaryTitle.GetAdjectiveNoTooltip] ของ [eunuch.GetHerHis]\n\n[eunuch.GetSheHe|U] อาจจะถูกนำกลับมารับใช้ข้าได้ หากความพยายามดังกล่าวถือว่าคุ้มค่า..."
 ep3_story_cycle_admin_eunuch.8020.d: "ความสูญเสียสำหรับ [ROOT.Char.GetTopLiege.GetPrimaryTitle.GetDefinitiveNameNoTooltip]"
 ep3_story_cycle_admin_eunuch.8020.a: "[eunuch.GetFirstNameNoTooltip] มีประโยชน์เกินกว่าจะถูกขังไว้..."

 ep3_story_cycle_admin_eunuch.8030.t: "$admin_eunuch_header$ ไม่สามารถปฏิบัติหน้าที่ได้"
 ep3_story_cycle_admin_eunuch.8030.desc: "ครั้งหนึ่งเคยเป็นข้ารับใช้ผู้มีค่าของ [admin_title.GetDefinitiveName] ขันทีในราชสำนักผู้มีอิทธิพล [eunuch.GetFirstName] บัดนี้รับใช้ [eunuch.GetLiege.GetName]\n\n[eunuch.GetSheHe|U] อาจจะถูกชักจูงกลับมารับใช้ข้าได้ หากความพยายามดังกล่าวถือว่าคุ้มค่า..."
 ep3_story_cycle_admin_eunuch.8030.a: "ขันทีนั่น #EMP เป็นของข้า#!."
 ep3_story_cycle_admin_eunuch.8030.b: "[student.GetFirstNameNoTooltip] ได้รับการสอนจาก [eunuch.GetHerHim] และสามารถสานต่องานของ [eunuch.GetHerHis] ได้"
 ep3_story_cycle_admin_eunuch.8030.c: "คู่แข่งเก่าของ [eunuch.GetHerHis|U] [rival.GetFirstNameNoTooltip] สามารถเก็บกวาดสิ่งที่เหลืออยู่ได้"
 ep3_story_cycle_admin_eunuch.8030.d: "อนิจจา คนนี้หนีไปได้..."

 ep3_story_cycle_admin_eunuch.8040.t: "$admin_eunuch_header$ สิ่งที่ยิ่งใหญ่กว่า"
 ep3_story_cycle_admin_eunuch.8040.desc: "ครั้งหนึ่งเคยเป็นข้ารับใช้ผู้มีค่าของราชสำนัก [admin_title.GetAdjective] ขันทีผู้มีอิทธิพล [eunuch.GetFirstName] ได้ก้าวไปสู่สิ่งที่ยิ่งใหญ่กว่า\n\n"
 ep3_story_cycle_admin_eunuch.8040.ruler: "ดูเหมือนว่าความสูญเสียของข้าคือผลประโยชน์ของ [eunuch.GetPrimaryTitle.GetNamePossessive]..."
 ep3_story_cycle_admin_eunuch.8040.noble_family: "ดูเหมือนว่าความสูญเสียของข้าคือผลประโยชน์ของคฤหาสน์ตระกูล [eunuch.GetHouse.GetBaseName]..."
 ep3_story_cycle_admin_eunuch.8040.laamp: "ดูเหมือนว่า [eunuch.GetSheHe] กำลังมองหาชีวิตที่ผจญภัยมากขึ้น..."
 ep3_story_cycle_admin_eunuch.8040.d: "น่าเสียดาย"

 admin_eunuch_liege_1_modifier: "ขันทีผู้ถูกเมินเฉย #weak (III/III)#!"
 admin_eunuch_liege_1_modifier_desc: "ตัวละครนี้ได้เมินเฉยต่อขันทีในราชสำนักผู้มีอิทธิพล"
