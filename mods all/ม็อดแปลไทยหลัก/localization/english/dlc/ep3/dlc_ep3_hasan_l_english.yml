 hasan_stroy_cycle_ultimate_foe: "ต้องก้าวหน้าบนเส้นทางของเหล่านักฆ่าอย่างน้อย #V 15#! ครั้ง หรือ [caliph.GetName] สิ้นพระชนม์แล้ว และท่านได้เลือกศัตรูตัวฉกาจของ [hasan.GetFaith.GetName] #weak (ความคืบหน้าปัจจุบัน: [radical_points])#!"
