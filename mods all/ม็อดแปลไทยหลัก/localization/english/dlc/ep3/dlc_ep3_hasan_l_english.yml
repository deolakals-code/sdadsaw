l_english: 
 # Decisions
 hasan_evangelize_the_faith: "เผยแผ่ศรัทธา"
 hasan_evangelize_the_faith_desc: "ภาระอันศักดิ์สิทธิ์ของข้าคือการเผยแพร่พระวจนะของอัลลอฮ์ และศาสดาผู้ถูกเลือกของพระองค์"
 hasan_evangelize_the_faith_tooltip: "พยายามเผยแผ่ [faith|E] ของท่านในเคาน์ตีใกล้เคียง"
 hasan_evangelize_the_faith_confirm: "จัดเทศนา"
 hasan_agitate_the_populace: "ปลุกปั่นประชากรท้องถิ่น"
 hasan_agitate_the_populace_desc: "ไม่ใช่ทุกคนในอาณาจักรที่ตระหนักถึงความชั่วร้ายของผู้ปกครองของตน ถ้อยคำบางส่วนจากคัมภีร์ศักดิ์สิทธิ์ควรนำทางพวกเขาไปในทิศทางที่ถูกต้อง"
 hasan_agitate_the_populace_tooltip: "พยายามลด [county_opinion|E] ของเคาน์ตีใกล้เคียง"
 hasan_agitate_the_populace_confirm: "พวกเขาจักเห็นความจริง"
 hasan_ignite_the_flames: "เริ่มการปฏิวัติ"
 hasan_ignite_the_flames_desc: "เหล่าผู้ศรัทธารวมตัวกันแล้ว และถึงเวลาแล้วที่จะยุติความชั่วร้ายที่ปกครองดินแดนเหล่านี้"
 hasan_ignite_the_flames_tooltip: "ประกาศ [war|E] เพื่อล้มล้างจักรวรรดิ"
 hasan_ignite_the_flames_confirm: "เวลาของเรามาถึงแล้ว"
 hasan_found_the_assassins: "ก่อตั้งเหล่านักฆ่า"
 hasan_found_the_assassins_desc: "พวกดูหมิ่นศาสนาและพวกนอกรีตระบาดไปทั่วแผ่นดิน และเป็นที่ประจักษ์แล้วว่าเพียงคำพูดอย่างเดียวไม่อาจบรรเทาพวกเขาได้ ถึงเวลาแล้วที่จะยกระดับความขัดแย้งทางเทววิทยานี้ไปสู่ความขัดแย้งทางทหาร และศัตรูของผู้ศรัทธาจะต้องเผชิญหน้ากับคมดาบ"
 hasan_found_the_assassins_tooltip: "สถาปนา [holy_order|E] เพื่อปกป้อง [faith|E] ของท่าน"
 hasan_found_the_assassins_confirm: "บิสมิลลาฮ์!"
 hasan_expand_the_assassins: "ขยายเหล่านักฆ่า"
 hasan_expand_the_assassins_desc: "เราต้องการที่ดินเพิ่มเติมเพื่อขยายอิทธิพลของเหล่านักฆ่า จากที่นั่น เราอาจได้เห็นการล่มสลายของพวกดูหมิ่นศาสนา"
 hasan_expand_the_assassins_tooltip: "ขยาย [holy_order|E] ของท่าน"
 hasan_expand_the_assassins_confirm: "บ้านหลังใหม่"
 # Story Cycle
 ULTIMATE_FOE: "ศัตรูตัวฉกาจของท่าน"
 story_hasan: "ตำนานแห่งฮาซัน ซับบาห์"
 story_hasan_desc: "ยิ่งกว่ากองทัพ ความแข็งแกร่งแห่งศรัทธาสามารถโค่นล้มจักรวรรดิและถักทอประวัติศาสตร์หน้าใหม่! ท่านจะก่อตั้งกลุ่มมือสังหารและปลดเปลื้องประชากรของท่านจากแอกของพวกเซลจุกหรือไม่? ท่านจะผงาดขึ้นเป็นชายชราแห่งภูเขาได้หรือไม่?"
 PROGRESS_TOWARDS_ASSASSIN_PATH: "ความคืบหน้าสู่เส้นทางมือสังหาร"
 # Events
 hasan_sabbah.1000.t: "นักเทศน์ [GetFaithByKey('ismaili').GetAdjectiveNoTooltip|U]"
 hasan_sabbah.1000.desc: "[amira.GetName|U] ผู้ศรัทธาและผู้ติดตามเคาะลีฟะฮ์แห่งอียิปต์ ได้เทศนาแนวคิดอิสลามนอกรีตของ [amira.GetHerHis] ในใจกลาง [location.GetName] ข้ามิได้สงสัยในความจริงของอิสลามและ [ROOT.Char.GetFaith.HighGodName|U] เลย และไม่เคยสงสัยมาก่อนว่าความจริง เช่นนั้นจะพบได้ที่อื่นนอกเหนือจาก [ROOT.Char.GetFaith.GetName] แต่ถ้อยคำของ [amira.GetFirstNamePossessiveNoTooltip] กลับก้องกังวานในหูของข้าแตกต่างออกไป\n\nข้าใช้เวลาส่วนใหญ่ที่เหลือของวันสนทนาเรื่องคัมภีร์ศักดิ์สิทธิ์และหะดีษกับ [amira.GetFirstNameNoTooltip] และข้าได้ยินความจริงในปรัชญา [GetFaithByKey('ismaili').GetAdjective|U] เป็นครั้งแรก"
 hasan_sabbah.1000.a: "ท่านทำลายและทลายความเชื่อของข้าได้สำเร็จ"
 hasan_sabbah.1000.b: "ความจริงมิอาจแสวงหานอกขอบเขตของอิสลามได้"
 hasan_sabbah.1010.t: "การเผยแผ่ศาสนา [ROOT.Char.GetFaith.GetAdjectiveNoTooltip|U]"
 hasan_sabbah.1010.desc: "ผู้คนรวมตัวกันรอบตัวข้าในใจกลาง [location.GetNameNoTier] ดวงตาของพวกเขามืดมัว เพราะขาดแสงสว่างของ [ROOT.Char.GetFaith.HighGodNamePossessive|U]\n\nด้วยข้อความจาก [ROOT.Char.GetFaith.ReligiousText|U] ที่ท่องจำไว้ ข้าจึงเริ่มกล่าว..."
 hasan_sabbah.1010.a: "ในนามแห่ง [ROOT.Char.GetFaith.HighGodName|U] ผู้ทรงอภัยและเมตตาเสมอ..."
 hasan_sabbah.1010.a.win: "ฝูงชนยอมรับ"
 hasan_sabbah.1010.a.lose: "ฝูงชนไม่เชื่อ"
 hasan_sabbah.1020.t: "เสียงเรียกจากสวรรค์"
 hasan_sabbah.1020.desc: "ทูตจาก [ismaili_caliph.GetName] ทักทายข้าในวันนี้ด้วยการโค้งคำนับอย่างสุภาพและข้อความ\n\n"เคาะลีฟะฮ์ได้ยินถึงการทำงานอันยิ่งใหญ่ของท่านที่นี่ และประสงค์ให้ท่านศึกษาต่อในฐานะมิชชันนารี [ismaili_caliph.GetFaith.GetAdjective] ใน [cairo.GetNameNoTier]""
 hasan_sabbah.1020.a: "[ROOT.Char.GetFaith.HighGodName|U] มีแผนการสำหรับข้าที่นั่น"
 hasan_sabbah.1020.a.tt: "ท่านจะเดินทางไปยัง [cairo.GetProvince.GetBaronyNameExplicitly]"
 hasan_sabbah.1020.b: "ข้าเป็นที่ต้องการมากที่สุดในที่ที่ข้าอยู่"
 hasan_sabbah.1022.t: "รัฐเคาะลีฟะฮ์ [GetFaithByKey('ismaili').GetAdjectiveNoTooltip|U]"
 hasan_sabbah.1022.desc: "ข้ามาถึงแล้ว และสถานการณ์ในรัฐเคาะลีฟะฮ์ก็เลวร้ายอย่างแท้จริง [nizar.GetFirstName|U] ผู้สืบทอดที่ชอบธรรมและเป็นที่โปรดปรานของ [ismaili_caliph.GetNamePossessive] ถูกถอดออกจากลำดับการสืบทอด นี่ไม่ใช่สิ่งที่ศาสดาประสงค์สำหรับอนาคตของอิสลามอย่างชัดเจน\n\nแผนการและการโกหกของมนุษย์ได้ ทำให้แผนการของ [ROOT.Char.GetFaith.HighGodNamePossessive|U] เสื่อมทรามลง และต้องทำอะไรบางอย่าง!"
 hasan_sabbah.1022.a: "ข้ายืนหยัดเคียงข้าง [nizar.GetFirstNameNoTooltip|U]!"
 hasan_sabbah.1022.b: "ข้าต้องดำเนินตามแนวทางเดิม"
 hasan_sabbah.1030.t: "การสิ้นพระชนม์ของเคาะลีฟะฮ์"
 hasan_sabbah.1030.desc: "[ismaili_caliph.GetName|U] ได้กลับไปอยู่กับ [ROOT.Char.GetFaith.HighGodName|U] และสงบสุขในที่สุด แต่พวกเราที่เหลืออยู่ต้องเผชิญกับภาระจากการที่ [ismaili_caliph.GetHerHis] ไม่อยู่ ด้วยการชักใยทางการเมืองและพลังที่เกินความเข้าใจ "
 hasan_sabbah.1030.desc_caliph_heir: "$hasan_sabbah.1030.desc$ [new_ismaili_caliph.GetName] ได้สืบทอดตำแหน่งต่อจาก [ismaili_caliph.GetHerHim] $hasan_sabbah.1030.desc_outro$"
 hasan_sabbah.1030.desc_caliph_no_heir: "$hasan_sabbah.1030.desc$ รัฐเคาะลีฟะฮ์ไม่มีผู้สืบทอด $hasan_sabbah.1030.desc_outro$"
 hasan_sabbah.1030.desc_outro: ", และการอ้างสิทธิ์ของ [GetFaithByKey('nizari').GetAdjective] ถูกเพิกเฉย\n\nข้ารู้แน่ว่า [nizar.GetName] เป็นผู้ที่ถูกเลือก แต่หากข้าแสดงความภักดี ข้าจะต้องกลายเป็นศัตรูอย่างแน่นอน"
 hasan_sabbah.1030.a: "ข้าจะไม่พินาศไปในความไม่ศรัทธา!"
 hasan_sabbah.1030.b: "[new_ismaili_caliph.GetFirstNameNoTooltip|U] คือเคาะลีฟะฮ์ที่ชอบธรรม"
 hasan_sabbah.1030.c: "ข้าจะสนับสนุนผู้สมัคร [GetFaithByKey('ismaili').GetAdjective] คนใดก็ได้"
 hasan_sabbah.1031.t: "ศัตรูของ [ROOT.Char.GetFaith.GetNameNoTooltip|U]"
 hasan_sabbah.1031.desc: "ขณะที่ข้าเทศนาจบ ข้ามองออกไปเห็นใบหน้าที่รู้แจ้งของฝูงชนที่จ้องมองกลับมายังข้า จิตใจของข้าหันไปหาเจ้านายของพวกเขา [seljuk_equivalent.GetFirstName] ผู้ที่นำพวกเขาออกห่างจาก [ROOT.Char.GetFaith.HighGodName] ตั้งแต่แรก ในขณะที่ [seljuk_equivalent.GetSheHe] เพลิดเพลินกับชีวิตที่เสื่อมโทรม ไพร่พลของ [seljuk_equivalent.GetHerHis] กลับร้องคร่ำครวญอยู่ในกองฝุ่น ถูกบดบังจากความจริงของผู้ทรงอำนาจ\n\nข้ารู้สึกว่าข้าทนสิ่งนี้ต่อไปไม่ไหวแล้ว และข้าปรารถนาเพียงแค่เห็นประชาชนของ [seljuk_equivalent.GetHerHis] เป็นอิสระจาก [seljuk_equivalent.GetHerHim] รวมเป็นหนึ่งในปรัชญา [ROOT.Char.GetFaith.GetAdjective]!"
 hasan_sabbah.1031.a: "[seljuk_equivalent.GetSheHe|U] ต้องพินาศ!"
 hasan_sabbah.1031.b: "ข้าสัมผัสได้ว่าศัตรูที่แท้จริงอยู่ที่อื่น..."
 hasan_sabbah.1040.t: "การเทศนาที่ปลุกเร้า"
 hasan_sabbah.1040.desc: "ดวงตาที่เหม่อลอยไร้ความสนใจของฝูงชนจ้องมองมาทางข้าอย่างว่างเปล่า ขณะที่ข้าถือ [ROOT.Char.GetFaith.ReligiousText|U] และเตรียมที่จะกล่าว"
 hasan_sabbah.1040.a: "[ultimate_foe.GetFirstNameNoTooltip|U] คือ [ROOT.Char.GetFaith.DevilName|U] ที่จุติมา!"
 hasan_sabbah.1040.a.win: "$hasan_sabbah.1010.a.win$"
 hasan_sabbah.1040.a.lose: "$hasan_sabbah.1010.a.lose$"
 hasan_sabbah.1050.t: "ชายชราแห่งขุนเขา"
 hasan_sabbah.1050.desc: "ในที่สุด จักรวรรดิ [defender.Custom2('InsultAdjective', ROOT.Char)] ของ [defender.GetNamePossessive] ก็ถูกส่งกลับไปยัง [ROOT.Char.GetFaith.NegativeAfterLife] ที่ที่มันสมควรอยู่ ท่ามกลางซากปรักหักพังของจักรวรรดิ เหล่าผู้ติดตามของข้าต่างมองมาที่ข้าเพื่ออนาคตของเรา และอนาคตของ [ROOT.Char.GetFaith.GetName]\n\nในความโกลาหลจากการหายไปของ [defender.GetFirstNamePossessiveNoTooltip] [hasan_home.GetName] ก็สุกงอมพร้อมให้ยึดครอง และอาจทำหน้าที่เป็นศูนย์กลางสำหรับความพยายามใดๆ ในอนาคตที่เราอาจมีในภูมิภาคนี้"
 hasan_sabbah.1050.a: "ยุคสมัยแห่ง [hasan_home.GetNameNoTierNoTooltip|U] ได้เริ่มต้นขึ้นแล้ว"
 hasan_sabbah.1050.b: "เราดำเนินศึกนิรันดร์ของเราต่อไป"
 # Modifiers
 ep3_agitated_populace: "ประชากรถูกปลุกปั่น"
 ep3_agitated_populace_desc: "นักเทศน์ผู้มีบารมีเพิ่งจัดพิธีปลุกระดม ประณามความชั่วร้ายของชนชั้นปกครองในเคาน์ตีนี้"
 ep3_religious_doubts: "ความสงสัยทางศาสนา"
 ep3_religious_doubts_desc: "มิชชันนารีผู้มีบารมีเพิ่งเทศนาศาสนาต่างแดนของตนในมณฑลนี้ แม้ว่าพวกเขาจะไม่ประสบความสำเร็จในการเปลี่ยนศาสนาคนส่วนใหญ่ แต่ก็ได้ทำลายศรัทธาของสามัญชนในศาสนาดั้งเดิม"
 # Relationship reasons
 friend_supported_my_claim: "[CHARACTER.GetShortUIName|U] สนับสนุนการอ้างสิทธิ์ของ [TARGET_CHARACTER.GetShortUINamePossessive]"
 friend_supported_my_claim_corresponding: "[TARGET_CHARACTER.GetShortUIName|U] สนับสนุนการอ้างสิทธิ์ของ [CHARACTER.GetShortUINamePossessive]"
 nemesis_eternal_enemy: "[CHARACTER.GetShortUIName|U] ประกาศว่า [TARGET_CHARACTER.GetShortUIName] [CharAreIs(TARGET_CHARACTER)] ตัวแทนแห่งความชั่วร้ายสูงสุดบนโลก"
 nemesis_eternal_enemy_corresponding: "[TARGET_CHARACTER.GetShortUIName|U] ประกาศว่า [CHARACTER.GetShortUIName] [CharAreIs(CHARACTER)] ตัวแทนแห่งความชั่วร้ายสูงสุดบนโลก"
 # Custom tt
 begin_hasan_cycle_ismaili_tt: "ท่านเริ่มทำงานในฐานะมิชชันนารี [GetFaithByKey('ismaili').GetAdjective|U]"
