 ep3_interactions_events.0600.t: "ผู้สนับสนุนของข้ารออยู่"
 ep3_interactions_events.0600.desc: "ความพยายามของข้าในการได้มา ซึ่งอำนาจเหนือ [ROOT.Char.GetPrimaryTitle.GetNameNoTier] ได้ผลิดอกออกผลอันงดงาม บัดนี้ ในฐานะ [ROOT.Char.GetTitleAsName] ข้าถูกรายล้อมไปด้วยที่ปรึกษา รัฐมนตรี และผู้ดูแลคนใหม่... เหล่าผู้ที่กระตุ้นให้ข้าตอบแทนมิตรสหายและผู้อุปถัมภ์ของข้าเป็นอย่างดี\n\n[supporter.GetName] — แม้ว่าเขาจะไม่ใช่คนของตระกูล [ROOT.Char.GetHouse.GetName] — เป็นผู้สนับสนุนการเสนอชื่อของข้าอย่างแข็งขันและเป็นเจ้าหนี้ทางการเมืองรายใหญ่ที่สุดของข้า การเพิกเฉยต่อความเอื้อเฟื้อของ [supporter.GetHerHis] ก็เหมือนกับการดูถูก"
 ep3_interactions_events.0600.a: "เราต้องสนับสนุน ซึ่งกันและกันเสมอ"
 ep3_interactions_events.0600.a.success: "ความสัมพันธ์แห่งผลประโยชน์ร่วมกันได้ถูกสร้างขึ้น"
 ep3_interactions_events.0600.a.fail: "ท่านไม่ติดค้างบุญคุณใดๆ อีกแล้ว"
 ep3_interactions_events.0600.b: "ข้าไม่ติดค้างอะไร #EMP เจ้าหนี้หน้าเลือด#! นั่น นอกจากความดูถูก!"
 ep3_interactions_events.0600.b.flavor: "ข้าเป็น [ROOT.Char.GetWomanMan] ของตัวเอง #EMP อย่างแท้จริง#! — การตำหนิคนฉวยโอกาสผู้นี้จะพิสูจน์ให้ทุกคนเห็น!"
 ep3_interactions_events.0600.c: "ผู้สนับสนุนที่ยิ่งใหญ่ของข้าสมควรได้รับความภักดีไม่สิ้นสุด!"
 ep3_interactions_events.0600.c.flavor: "ข้ายินดีที่จะรับใช้ [supporter.GetHerHim] อย่างขยันขันแข็ง ไม่ว่าทางใดก็ตามที่ข้าสามารถทำได้"
 ep3_interactions_events.0600.d: "ของขวัญที่มีค่าเพิ่มขึ้นเรื่อยๆ: มิตรภาพของข้า"
 ep3_interactions_events.0600.e: "ส่งของล้ำค่าบางอย่างให้ [supporter.GetWomanMan]"
 ep3_interactions_events.0600.f: "ใคร?"

 ep3_interactions_events.0601.opening: "[new_landed_admin.Custom2('RelationToMeShort', SCOPE.sC('supporter'))] และผู้สนับสนุนของข้า,"
 ep3_interactions_events.0601.desc: "บางคนกล่าวว่า หากไม่ใช่ เพราะการสนับสนุนอย่างแรงกล้าของท่าน การปกครอง [new_landed_admin.GetPrimaryTitle.GetNameNoTier] คงไม่ตกเป็นของข้า\n\n"
 ep3_interactions_events.0601.desc_repay: "พวกเขาพูดถูก"
 ep3_interactions_events.0601.desc_scorn: "ข้าไม่แน่ใจ"
 ep3_interactions_events.0601.desc_ally: "ดังนั้น ให้การสนับสนุนของท่านเป็นการกระทำแรกของความร่วมมืออันยาวนานและเกิดผลของเรา! ท่านต้องการการสนับสนุน ซึ่งกันและกันใช่หรือไม่?"
 ep3_interactions_events.0601.desc_insult: "ข้าสงสัยนัก หรือบางทีการเลื่อนขั้นของข้ากลับถูกจัดแจงโดยคนป่าเถื่อนไร้การศึกษาหรือเด็กโง่เง่า? ข้าเชื่อว่าข้าได้ยินเสียงอัน [supporter.Custom2('InsultAdjective', ROOT.Char)] เหล่านั้นพร่ำเพ้อเรียกชื่อข้า"
 ep3_interactions_events.0601.desc_hook: "ข้าเป็นหนี้บุญคุณท่านอย่างใหญ่หลวง และด้วยเหตุนี้ ข้าจะรับใช้อย่างขยันขันแข็งในฐานะ [new_landed_admin.GetWomanMan] ที่สาบานตนของท่าน"
 ep3_interactions_events.0601.desc_friendship: "ในขณะที่ข้าตั้งหลักปักฐานใน [new_landed_admin.GetPrimaryTitle.GetTierAsNameNoTooltip] นี้ ข้าขอมอบของขวัญที่มีค่าเพิ่มพูนแก่ท่าน: มิตรภาพของข้า"
 ep3_interactions_events.0601.desc_gift: "ขอให้ของขวัญชิ้นนี้ ชดใช้หนี้ของข้าที่มีต่อท่านได้บ้าง และขอให้ [new_landed_admin.GetFaith.WealthGodName] คุ้มครองท่าน"
 ep3_interactions_events.0601.desc_ignore: "ข้าพยายาม #EMP อย่างหนัก#! เพื่อให้ได้ตำแหน่งของข้ามา ได้มาด้วยหยาดเหงื่อและความดีความชอบของข้า และข้า... ค่อนข้างขุ่นเคืองกับการกล่าวหาเป็นนัยในทางตรงกันข้าม"

 ep3_interactions_events.0601.a_repaid: "การ แต่งตั้งที่คู่ควรสำหรับ [new_landed_admin.GetWomanMan] ที่คู่ควรที่สุด!"
 ep3_interactions_events.0601.a_scorned: "เกมการเมืองไม่ได้เล่นกันแบบนี้ #EMP คนอกตัญญู!#!."
 ep3_interactions_events.0601.b: "ข้าคือผู้อุปถัมภ์! ผู้อุปถัมภ์! ไม่ใช่หุ้นส่วนที่เท่าเทียมกับ [new_landed_admin.GetHerHis]"

