 ep3_interactions_events.0620.opening: "[actor.GetFirstName] ผู้ศรัทธา,"
 ep3_interactions_events.0620.desc_byz: "ในโบสถ์ของพระองค์ พระเจ้าของเราทรง แต่งตั้งอัครสาวก ครู ผู้ทำปาฏิหาริย์ ผู้มีพรสวรรค์ในการปกครอง... และผู้มีความสามารถทางภาษาที่หลากหลาย\n\nเสียงอันศักดิ์สิทธิ์เหล่านี้ของเรา จะพูดสนับสนุนตระกูล [actor.GetHouse.GetName]"
 ep3_interactions_events.0620.desc: "มีหนทางที่จะเคลื่อนภูเขาได้นอกเหนือจากอำนาจทางโลก และหนทางสู่อำนาจนอกเหนือจากความหยาบคายทางโลก\n\nเพื่อความรอดนิรันดร์ จงมองไปที่ [recipient.GetFaith.HighGodName] เพื่อการปลดปล่อยของท่านบนโลก ครอบครัวของท่านอาจพึ่งพาการสนับสนุนจากนักบวช [recipient.GetFaith.GetAdjective] ของเรา"
 ep3_hof_ask_for_influence_interaction_desc: "ขอให้ [recipient.GetShortUIName] ให้ความช่วยเหลือทางการเมือง โดยใช้ [piety|E] เพื่อเพิ่ม [influence|E] ให้กับท่านและ [house|E] ของท่าน"

 ep3_interactions_events.0620.a: "ร่วมมือกัน เพื่ออุดมการณ์อันชอบธรรม!"
 ep3_interactions_events.0620.b: "#EMP [recipient.GetFaith.PriestNeuterPlural|U]!#! ไม่มีนักการเมืองที่ดีกว่านี้อีกแล้ว"
 ep3_interactions_events.0620.c: "ดูเหมือนว่าคำอธิษฐานของข้าจะได้รับคำตอบ"

 ep3_interactions_events.0621.opening: "โอ้ เด็กน้อยผู้ชั่วร้าย,"
 ep3_interactions_events.0621.desc: "เจ้าจะขอให้ผู้ที่ควรจะมุ่งเน้นไปที่ความรอด ผู้ ซึ่งมีหน้าที่ดูแลและสอนสั่ง ให้มายุ่งเกี่ยวกับเรื่องทางโลกเพื่อประโยชน์ของเจ้ารึ?\n\nช่างเป็นความอวดดีที่น่าละอาย!"
 ep3_interactions_events.0621.a: "บ๊ะ! ราวกับว่ามืออันบริสุทธิ์ของท่านสะอาดนัก!"

 depose_governor_lose_titles_tt: "@warning_icon! #X ท่านจะสูญเสีย [recipient.GetPrimaryTitle.GetName] และ[titles|E]ที่ดินอื่น ๆ ทั้งหมด#!."

 ep3_interactions_events.0630.opening: "[recipient.GetTitleAsName] แห่ง [recipient.GetPrimaryTitle.GetNameNoTier] ของข้า,"
 ep3_interactions_events.0630.desc_family: "ข้าได้สั่งปลดท่านออกจากตำแหน่งแล้ว สำหรับพวกเราเหล่าทายาทแห่งตระกูล [actor.GetHouse.GetName] การที่ท่านปกครอง [recipient.GetPrimaryTitle.GetNameNoTooltip] ไม่เป็นประโยชน์อีกต่อไป\n\nโปรดคำนึงถึงหน้าที่ของท่านที่มีต่อญาติพี่น้องและวางคทาแห่งตำแหน่งลงโดยไม่ขุ่นเคือง ครอบครัวของท่านรอท่านอยู่ที่ [actor.GetCapitalLocation.GetTitle.GetNameNoTier]"
 ep3_interactions_events.0630.desc_spite: "ตามกฎหมายของ [actor.GetPrimaryTitle.GetTierAsName] อันยิ่งใหญ่ของเรา การปกครองนั้นมอบให้ตามความประสงค์ของข้า แต่เพียงผู้เดียว และถูกริบตามความพอใจของข้า\n\nเจ้าจะต้อง — อย่างเร่งด่วน — ถอนตัวออกจากตำแหน่งใน [recipient.GetPrimaryTitle.GetNameNoTooltip] สละอำนาจทั้งหมด ลืมสิ่งที่เจ้าเคยเป็น\n\n[actor.GetTitleAsName] ผู้ชาญฉลาดและมีเมตตาของเจ้าบัญชา เช่นนั้น"
 ep3_interactions_events.0630.desc_guilt: "ด้วยความห่วงใยทั้งน้ำตา ข้าสั่งให้ท่านลาออกจากตำแหน่ง ท่านได้รับใช้ [actor.GetPrimaryTitle.GetTierAsName] เป็นอย่างดีและขยันขันแข็ง แต่การทำ เช่นนั้นจากสำนักงานใหญ่ของ [recipient.GetPrimaryTitle.GetTierAsNameNoTooltip] ของท่านจะไม่สามารถทำได้อีกต่อไป\n\nโปรดเชื่อว่านี่คือพระประสงค์ของ [recipient.GetFaith.HighGodName] เช่นเดียวกับที่เป็นคำสั่งของ [actor.GetTitleAsName] ของท่าน"
 ep3_interactions_events.0630.desc: "ด้วยความเห็นพ้องต้องกันของทั้งราชสำนัก ข้าขอสิ้นสุดวาระการดำรงตำแหน่ง [recipient.GetTitleAsNameNoTooltip] ของท่าน ณ บัดนี้ บรรดาศักดิ์ทั้งหมดที่ท่านถือครอง พร้อมด้วยรายได้และเกียรติยศของตำแหน่ง จะต้องถูกสละ\n\nสำหรับแรงงานทั้งหมดในการรับใช้ [recipient.GetPrimaryTitle.GetTierAsNameNoTooltip] และ [actor.GetPrimaryTitle.GetTierAsName] ประชาชนและองค์อธิปัตย์ของท่านต่างรู้สึกขอบคุณ"

 ep3_interactions_events.0630.a: "#EMP ข้าถูกปล้น! ข้าถูกหยาม!#!"
