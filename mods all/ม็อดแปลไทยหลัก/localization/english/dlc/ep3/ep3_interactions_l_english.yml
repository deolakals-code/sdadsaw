 ep3_interactions_events.0101.desc_knight_2_trait: ""เลือกข้าสิ แล้วข้าจะเป็น [cool_trait_2.GetName(knight_to_rent_2)] ที่ท่านเลือก!" [knight_to_rent_2.GetName] ร้องตะโกน\n\n"
 ep3_interactions_events.0101.desc_knight_2: ""ข้าจะเป็น [ROOT.Char.Custom('KnightCultureNoTooltip')|l] ที่ดีที่สุดของท่าน!" [knight_to_rent_2.GetName] อ้างอย่างกระตือรือร้น\n\n"
 ep3_interactions_events.0101.desc_knight_3_trait: ""ข้าเป็นที่รู้จักในฐานะ [cool_trait_3.GetName(knight_to_rent_3)] ที่ดี," [knight_to_rent_3.GetName] กล่าวอย่างมั่นใจ"
 ep3_interactions_events.0101.desc_knight_3: ""ข้าเป็นนักสู้ที่ยอดเยี่ยม" [knight_to_rent_3.GetName] โอ้อวดอย่างมั่นใจ"
