 ep3_laamps.0401.t: "$seize_realm$: [ROOT.Char.GetTitleAsNameNoTooltip] คนใหม่"
 ep3_laamps.0401.desc: "แผนการถูกตรวจสอบซ้ำแล้วซ้ำเล่า ทุกสถานการณ์ที่เป็นไปได้ถูกเตรียมพร้อม ผู้สมรู้ร่วมคิด แต่ละคนเตรียมพร้อม การบุกเข้าไปใน [target.Custom('ResidenceBuilding')|l] นั้นง่ายดายพอสมควรภายใต้ข้ออ้างของการจ้างงาน...\n\nความโกลาหลเกิดขึ้นเมื่อสัญญาณเตือนดังขึ้น แต่ท่ามกลางความสับสนอลหม่าน การฟันฝ่า ในที่สุดเราก็ออกมาได้ แม้จะเหนื่อยล้า แต่ก็ได้รับชัยชนะ!\n\n"
 ep3_laamps.0401.imprison: "ข้าได้ให้ลากตัวไอ้ [ROOT.Char.GetTitleAsNameNoTooltip] จอมปลอม [target.Custom2('InsultAdjective', ROOT.Char)] ผู้นั้น [target.GetFirstName] มาต่อหน้าข้า ในห้องบัลลังก์ของ [target.GetHerHis] เอง บัดนี้มันเป็นนักโทษของข้าที่ข้าจะทำสิ่งใดก็ได้!"
 ep3_laamps.0401.death: "ไอ้ [ROOT.Char.GetTitleAsNameNoTooltip] จอมปลอม [target.Custom2('InsultAdjective', ROOT.Char)] ผู้นั้น [target.GetFirstName] — ผู้อ่อนแอเกินไปสำหรับมงกุฎของ [target.GetHerHis] — ได้ตายไปแล้ว"
 ep3_laamps.0401.outro: "ไอ้ [ROOT.Char.GetTitleAsNameNoTooltip] จอมปลอม [target.Custom2('InsultAdjective', ROOT.Char)] [target.GetFirstName] ตัวแสบผู้นั้น กลับหนีรอดไปได้ — มันเป็นภัยต่อตำแหน่งของข้าตราบใดที่ [target.GetSheHe] ยังคงลอยนวล"
 ep3_laamps.0401.a: "[ROOT.Char.GetPrimaryTitle.GetNameNoTierNoTooltip] เป็น #EMP ของข้า#!!"
 
 ep3_laamps.0402.t: "$seize_realm$: ความหวังพังทลาย"
 ep3_laamps.0402.desc: "เกือบจะทันทีที่เริ่ม แผนการที่ข้าอุตส่าห์วางไว้อย่างดีกลับผิดพลาดอย่างน่าสะพรึงกลัว การชิงมงกุฎนั้นยากกว่าที่ข้าจินตนาการไว้นัก...\n\nพวกเราแทบจะยังไม่ได้เข้าไปใน [target.Custom('ResidenceBuilding')|l] ของ [target.GetTitledFirstNamePossessive] ก็ถูกทหารยามโผล่มาจากที่ใดไม่ทราบล้อมไว้ แผนการร้ายของพวกเราถูกเปิดโปงเสียแล้ว"
 ep3_laamps.0402.imprison: "พวกเราต่อสู้อย่างสุดกำลัง แต่ก็ถูกล้อมอย่างรวดเร็ว\n\nข้าถูกพันธนาการด้วยโซ่ตรวน ถูกลากไปต่อหน้า [target.GetTitleAsNameNoTooltip] ผู้แสดงความพิโรธของ [target.GetHerHis] ออกมาอย่างชัดแจ้ง..."
 ep3_laamps.0402.death: "เราต่อสู้อย่างหนัก แต่ก็ถูกล้อมอย่างรวดเร็ว\n\nขณะที่ข้าหันหลังวิ่ง ข้าเห็นว่าไม่มีทางหนี และทหารก็กรูกันเข้ามาหาข้า ชูดาบขึ้น!"
 ep3_laamps.0402.outro: "เราต่อสู้อย่างหนัก และโชคดีที่รอดชีวิตออกมาได้\n\n[target.GetFirstNameRegnal] ยังคงเป็น [target.GetTitleAsNameNoTooltip] แห่ง [target.GetPrimaryTitle.GetNameNoTier] อยู่ใน [target.Custom('ResidenceBuilding')|l] ของ [target.GetHerHis] อย่างปลอดภัย และไม่ต้องสงสัยเลยว่ากำลังตามล่าตัวข้าอย่างรวดเร็ว..."
 ep3_laamps.0402.a: "ให้ตายสิ ข้าเกือบจะ #EMP สำเร็จ#! อยู่แล้วเชียว!"
 ep3_laamps.0402.b: "โชคชะตาบัดซบ..."
 ep3_laamps.0402.c: "ให้ตายสิ!"

 ep3_laamps.0410.t: "$seize_realm$: มงกุฎที่ถูกขโมย"
 ep3_laamps.0410.desc: "สิ่งที่เริ่มต้นเหมือนวันปกติใน [target.GetCapitalLocation.GetBaronyNameExplicitly] กลับกลายเป็นเรื่องเลวร้ายอย่างกะทันหัน [target.Custom('ResidenceBuilding')|l] เต็มไปด้วยเสียงตะโกนของทหารยามและเสียงกรีดร้องของคนรับใช้ที่วิ่งพล่านไปตามโถงทางเดิน\n\nในที่สุด จ่าที่หอบหายใจก็อธิบายว่ากลุ่มอันธพาลกลุ่มหนึ่งเข้ามาข้างในโดยแสร้งทำเป็นอย่างอื่น และกำลังต่อสู้เพื่อไปยังห้องบัลลังก์!\n\n"
 ep3_laamps.0410.imprison: "ทันใดนั้นทหารก็พังประตูเข้ามา และในไม่ช้าข้าก็ถูกลากไปต่อหน้าผู้นำของพวกเขา [owner.GetFirstName] ผู้ ซึ่งยกมงกุฎของข้าขึ้นอย่างสะใจ"
 ep3_laamps.0410.death: "ขณะพยายามหลบหนี ข้าพบว่าตัวเองถูกกลืนเข้าไปในความโกลาหลของการต่อสู้ คมดาบกวาดเข้ามาหาข้า!"
 ep3_laamps.0410.outro: "ข้าลอบผ่านห้องพักคนรับใช้ ปลอมตัวเป็นสามัญชน และเข้าร่วมกับฝูงชนที่กำลังหลบหนีออกจาก [target.Custom('ResidenceBuilding')|l]..."
 ep3_laamps.0410.a: "ข้าจะกลับมา!"
 ep3_laamps.0410.b: "เจ้าคางคกโสโครก!"
 ep3_laamps.0410.c: "ให้ตายสิ!"

 ep3_laamps.0411.t: "$seize_realm$: มงกุฎอันเป็นที่โลภ"
 ep3_laamps.0411.desc: "สิ่งที่เริ่มต้นเหมือนวันปกติใน [target.GetCapitalLocation.GetBaronyNameExplicitly] กลับกลายเป็นเรื่องเลวร้ายอย่างกะทันหัน [target.Custom('ResidenceBuilding')|l] เต็มไปด้วยเสียงตะโกนของทหารยามและเสียงกรีดร้องของคนรับใช้ที่วิ่งพล่านไปตามโถงทางเดิน\n\nในที่สุด จ่าที่หอบหายใจก็อธิบายว่ากลุ่มอันธพาลกลุ่มหนึ่งเข้ามาข้างในโดยแสร้งทำเป็นอย่างอื่น และกำลังต่อสู้เพื่อไปยังห้องบัลลังก์!\n\nทหารของข้าควบคุมสถานการณ์ได้ในไม่ช้า และเสียงการต่อสู้ก็ค่อยๆ เงียบลง"
 ep3_laamps.0411.imprison: "[owner.GetFirstName] คนไร้ที่ดินไร้ค่า ถูกลากมาต่อหน้าข้า แผนการของ [owner.GetHerHis] ที่จะชิงมงกุฎของข้าด้วยกำลังถูกเปิดโปง"
 ep3_laamps.0411.death: "ศพของ [owner.GetFirstName] คนไร้ที่ดินไร้ค่า ถูกลากมาต่อหน้าข้า แผนการของ [owner.GetHerHis] ที่จะชิงมงกุฎของข้าด้วยกำลังล้มเหลวโดยสิ้นเชิง"
 ep3_laamps.0411.outro: "ข้าได้รับแจ้งว่า [owner.GetFirstName] คนไร้ที่ดินไร้ค่า เป็นผู้นำการโจมตี พยายามชิงมงกุฎของข้าด้วยกำลัง ไอ้ขี้ขลาดนั่นหนีไปนานแล้ว"
 ep3_laamps.0411.a: "เจ้าจะต้อง #EMP ชดใช้#! สำหรับเรื่องนี้"
 ep3_laamps.0411.b: "[owner.GetSheHe|U] ได้เรียนรู้แล้วว่าเกิดอะไรขึ้นกับผู้ชิงบัลลังก์!"
 ep3_laamps.0411.c: "ไอ้ [owner.Custom2('InsultNoun', ROOT.Char)] บัดซบ!"

