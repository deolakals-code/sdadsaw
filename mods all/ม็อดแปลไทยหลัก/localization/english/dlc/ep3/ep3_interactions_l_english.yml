 ep3_interactions_events.0101.desc: ""เมื่อพิจารณาว่าข้าพอจะแบ่งใครให้ได้บ้าง..." [recipient.GetName] กล่าว "ข้าได้คัดเลือก [recipient.Custom('KnightCulturePluralNoTooltip')|l] ที่อยู่ไม่สุขที่สุดของข้ามาสองสามคน แสดงตัวออกมา!"\n\n"
 ep3_interactions_events.0101.desc_knight_1_trait: ""ข้าคือ [cool_trait_1.GetName(knight_to_rent_1)] ผู้มีชื่อเสียง!" [knight_to_rent_1.GetName] โอ้อวด\n\n"
