 ep3_interactions_events.0031.t: "หนีก่อนคมมีด"
 ep3_interactions_events.0031.desc: "ในห้องของ [recipient.GetFirstNamePossessive] เสื้อผ้าและข้าวของกระจัดกระจายเกลื่อนพื้น และเด็กชายก็หายตัวไป ข้าราชการของข้าออกค้นหาตามท้องถนน แต่ก็ไม่พบ [actor.Custom2('RelationToMe', SCOPE.sC('recipient'))] ของข้าเลย!\n\nเด็กหนุ่มผู้โง่เขลา ปราศจากความเคารพต่ออำนาจของข้า ต่อ #EMP ประเพณี#! ของเรา หนีไปตั้งแต่ได้ยินเสียงกระซิบถึงความตั้งใจของข้า\n\n[recipient.GetFirstName] จะไปซ่อนตัวอยู่ที่ใดใน [ROOT.Char.GetCapitalLocation.GetTitle.GetNameNoTier] ทั้งหมดนี้? อาจจะในตรอกมืดสักแห่ง กอดกุมความเป็นชายอันล้ำค่าของเขาไว้แน่น... รางวัลที่ปกป้องไว้ ซึ่ง ทำให้เขาต้องถูกเนรเทศ"

 ep3_interactions_events.0031.a: "ข้าจะเอาไอ้หนูนั่นมาตอนให้ได้! #EMP หาตัวเขาให้พบ!#!"
