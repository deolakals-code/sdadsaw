 reinforce_soldiers_option_provisions: "[provisions_i]เกณฑ์ด้วยเสบียง"
 reinforce_soldiers_option_provisions_desc: "จัดหาเสื้อผ้า อาวุธ เกราะ เสบียง และเต็นท์ให้แก่คนนอกคอกและผู้แสวงหาชื่อเสียงที่เต็มใจ เพื่อแลกกับการรับใช้ในกองทัพของท่าน"
 refill_maa_provisions_tt: "กองทหาร [men_at_arms|E] [regiments|E] ได้รับ [soldiers|E] [THIS.Char.MakeScope.ScriptValue('replenishable_troops_max_provisions_tt_value')|0P] นาย\n#alert_trial $BULLET_WITH_TAB$เสบียงไม่เพียงพอ กองทหารจะได้รับการเสริมกำลังเพียงบางส่วน!#!"
