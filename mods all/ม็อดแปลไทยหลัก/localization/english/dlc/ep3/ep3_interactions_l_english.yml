 reinforce_soldiers_option_gold: "[gold_i]เกณฑ์ด้วยทองคำ"
 reinforce_soldiers_option_gold_desc: "ย่อมมีผู้สิ้นหวังที่พร้อมจะเริ่มต้นชีวิตแห่งการผจญภัยเสมอ — แน่นอนว่าต้องมีสิ่งจูงใจที่เหมาะสม"
 reinforce_soldiers_option_prestige: "แสวงหาอาสาสมัคร"
 reinforce_soldiers_option_prestige_desc: "นักรบชนเผ่าเป็นแหล่งนักสู้ที่มีประโยชน์ หากสามารถเอาชนะใจพวกเขาได้"
 reinforce_soldiers_option_piety: "เกณฑ์ผู้คลั่งศาสนา"
 reinforce_soldiers_option_piety_desc: "ชุมชนทางศาสนาเป็นที่พักพิงของจิตวิญญาณนักผจญภัยมากมาย ผู้กระตือรือร้นที่จะต่อสู้เพื่อศรัทธาของตน"
 reinforce_soldiers_option_skill: "สร้างแรงบันดาลใจให้ผู้ติดตาม"
 reinforce_soldiers_option_skill_desc: "เมื่อทุกอย่างล้มเหลว บารมีและทักษะส่วนตัวสามารถดึงดูดนักสู้ผู้ภักดีจำนวนมากได้"
 reinforce_soldiers_option_dread: "สร้างความประทับใจให้ทหารรับจ้าง"
 reinforce_soldiers_option_dread_desc: "นักรบมืออาชีพผู้ช่ำชองเป็นทหารเกณฑ์ที่ดีที่สุด แต่จะไม่รับใช้ผู้ที่ไม่เป็นที่รู้จัก"
