 scheme_critical_moments.1162.t: "$scheme_critical_moments.1132.t$"
 scheme_critical_moments.1162.desc: "จุดสูงสุดของแผนการอันพิถีพิถันนานหลายเดือนได้เปิดเผยออกมาในที่สุด เมื่อ [target.GetTitledFirstName] สละตำแหน่งผู้ว่าการแห่ง [highest_title.GetName] ของ [target.GetHerHis]\n\nข่าวลือที่แพร่กระจายอย่างชำนาญและหลักฐานที่ปลูกฝังไว้อย่างสะดวก ทำให้ชื่อเสียงของ [target.GetHerHis] เสื่อมเสียเกินกว่าจะแก้ไขได้ และ [target.GetSheHe] ไม่มีทางเลือกอื่นนอกจากต้องลงจากตำแหน่งโดยกะทันหัน"
 scheme_critical_moments.1162.desc_discovered: "\n\nเป็นที่ชัดเจนสำหรับทุกคนว่ามีเพียงข้าเท่านั้นที่มีอำนาจและอิทธิพลที่จะ ทำให้มันเกิดขึ้นได้ แต่ [target.GetSheHe] แทบจะไม่อยู่ในฐานะที่จะทำอะไรเกี่ยวกับความรู้นี้ได้"
 scheme_critical_moments.1162.desc_secret: "\n\nแน่นอนว่า การผลักดันอันทรงพลัง เช่นนี้ไม่สามารถมาจากใครอื่นนอกจากข้าได้ และถึงกระนั้น [target.GetTitledFirstNameNoTooltip] ก็ไม่มีอะไรจะพิสูจน์ความสงสัยของ [target.GetHerHis]"
 scheme_critical_moments.1162.a: "สำเร็จแล้ว"
 scheme_critical_moments.1162.tt: "[target.GetShortUIName] ลงจากตำแหน่งผู้ว่าการแห่ง [highest_title.GetName] และ หลีกทางให้ [new_governor.GetShortUIName]"
 scheme_critical_moments.1163.t: "$scheme_critical_moments.1133.t$"
 scheme_critical_moments.1163.desc: "แม้ว่าข้าจะพยายามหว่านความสงสัยผ่านข่าวลือที่วางไว้อย่างระมัดระวังและหลักฐานที่ประดิษฐ์ขึ้น แต่เสน่ห์และผู้สนับสนุนที่ภักดีของ [target.GetTitledFirstNamePossessive] ก็ปกป้อง [target.GetHerHim] จากพายุที่กำลังจะเกิดขึ้น"
 scheme_critical_moments.1163.desc_discovered: "\n\nนอกจากนี้ [target.GetSheHe] ยังได้รับทราบอย่างชัดเจนว่าแผนการทั้งหมดมาจากข้า"
 scheme_critical_moments.1163.desc_secret: "\n\n[target.GetSheHe|U] ยังคงยืนหยัดอยู่ได้ ชื่อเสียงของ [target.GetHerHis] ยังคงอยู่ ดูเหมือนจะไม่รู้ถึงแผนการที่พยายามบ่อนทำลาย [target.GetHerHim]"
 scheme_critical_moments.1163.tt: "[scheme.GetName] ถูกค้นพบ"
 scheme_critical_moments.1163.tt.desc: "[scheme.GetOwner.GetShortUIName] พยายามบังคับให้ท่านลงจากตำแหน่ง แต่ล้มเหลว!"
 scheme_critical_moments.1163.a: "ต้องมีวิธีอื่น"
 scheme_critical_moments.1164.t: "ถูกบังคับให้ลงจากตำแหน่ง"
 scheme_critical_moments.1164.desc: "เสียงกระซิบแห่งความสงสัย การกล่าวหาถึงการกระทำผิดทุกประเภท การทุจริต และแม้กระทั่งการทรยศในส่วนของข้า ได้คืบคลานไปทั่วราชสำนักเป็นเวลาหลายเดือน ทำให้ชื่อเสียงของข้าในฐานะผู้ว่าการมัวหมอง\n\nข้าเจ็บปวดที่ต้องยอมรับ แต่พวกเขาก็ทำสำเร็จ ในแง่ของหลักฐานที่บดขยี้และประนีประนอมที่ปรากฏขึ้นต่อต้านข้า — แม้ว่าจะมีการปกปิดความเท็จอย่างเห็นได้ชัด — ข้าพบว่าตัวเองถูกบังคับให้ลงจากบทบาทสาธารณะของข้า"
 scheme_critical_moments.1164.desc_discovered: "\n\nข้ารู้ว่าไม่มีใครอื่นนอกจาก [owner.GetTitledFirstName] ที่อยู่เบื้องหลังการล่มสลายของข้า อาจจะไม่ใช่วันนี้ แต่ข้าสาบานว่าวันหนึ่งข้าจะแก้แค้นให้ได้"
 scheme_critical_moments.1164.desc_secret: "\n\nมีไม่กี่คนที่จะสามารถใช้อิทธิพลเหนือความคิดเห็นของสาธารณชนได้มากขนาดนี้ ดังนั้นข้าจึงมีความสงสัยเกี่ยวกับผู้บงการเบื้องหลังการล่มสลายของข้า แต่ข้าไม่มีหลักฐานใดๆ มาสนับสนุนคำกล่าวอ้างของข้า"
 scheme_critical_moments.1164.a: "ข้าจะกลับมา"
 
