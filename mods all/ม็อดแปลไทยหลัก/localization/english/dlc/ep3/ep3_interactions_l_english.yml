 ep3_interactions_events.0030.desc.intro: "ขณะที่ข้ากอด [actor.Custom2('RelationToMe', SCOPE.sC('recipient'))] [recipient.GetFirstName] ไว้ใกล้ๆ เขาก็ตัวสั่น\n\n"จงคิดถึงอนาคตของเจ้า,""
 ep3_interactions_events.0030.desc.child_address: "ผู้สำเร็จราชการของข้ากล่าว"
 ep3_interactions_events.0030.desc.normal_address: "ข้ากระซิบ,"
 ep3_interactions_events.0030.desc.greek: ""ในฐานะ [Glossary( 'เวสเตส', 'VESTES_GLOSS')], [Glossary( 'พาทริคิออส', 'PATRIKIOS_GLOSS')] — หรืออาจกระทั่ง [Glossary( 'พาราคอยมอเมนอส', 'PARAKOIMOMENOS_GLOSS')] ของจักรวรรดิ! เมื่อเจ้าเป็นอิสระจากตัณหาและความทะเยอทะยานของบุรุษเพศ เจ้าจะเป็นที่ไว้วางใจเพียงใด! [recipient.GetFirstNameNoTooltip] เจ้าจะ ทำให้ตระกูลภาคภูมิใจยิ่งนัก"\n\n"
 ep3_interactions_events.0030.desc.non_greek: ""ในฐานะมหาดเล็ก, เสนาบดี — หรืออาจกระทั่งผู้สำเร็จราชการผู้ยิ่งใหญ่! เมื่อเจ้าเป็นอิสระจากตัณหาและความทะเยอทะยานของบุรุษเพศ เจ้าจะเป็นที่ไว้วางใจเพียงใด! [recipient.GetFirstNameNoTooltip] เจ้าจะ ทำให้ตระกูลภาคภูมิใจยิ่งนัก"\n\n"
 ep3_interactions_events.0030.desc.accepted_child: "เด็กน้อยมองเข้ามาในดวงตาของข้าอย่างอ่อนแรง ทั้งน้ำตา และด้วยความรัก\n\n"
 ep3_interactions_events.0030.desc.accepted_youth: "กัดฟันแน่น ขยี้ตาที่คลอด้วยน้ำตาให้ปิดลง เด็กหนุ่มพยักหน้าครั้งหนึ่ง\n\n"
 ep3_interactions_events.0030.desc.child_resents_castration: "คำพูดเหล่านี้หาได้ผลไม่ เด็กน้อยกรีดร้องด้วยความตื่นตระหนก พยายามตะเกียกตะกายหนีอย่างสิ้นหวัง\n\n"
 ep3_interactions_events.0030.desc.resents_castration: "คำพูดของข้าหาได้ผลไม่ เด็กน้อยกรีดร้องด้วยความตื่นตระหนก พยายามตะเกียกตะกายหนีอย่างสิ้นหวัง\n\n"
 ep3_interactions_events.0030.desc: "เบื้องหลังเรา หมอหลวงของข้ากำลังลับมีดโกน"

 VESTES_GLOSS: "ตำแหน่งราชสำนักไบแซนไทน์อันทรงเกียรติเกี่ยวกับฉลองพระองค์ของจักรพรรดิ มีให้ทั้งผู้ดำรงตำแหน่งที่มีเคราและขันที"
 PATRIKIOS_GLOSS: "ตำแหน่ง #bold พาทริคิออส#! — แพทริเซียน — ยังคงใช้ในสมัยไบแซนไทน์เพื่อมอบเกียรติแก่ผู้ถือครอง"
 PARAKOIMOMENOS_GLOSS: ""ผู้นอนข้างห้องบรรทมของจักรพรรดิ," #bold พาราคอยมอเมนอส#! คือเสนาบดีผู้ทรงอิทธิพลอย่างสูงของจักรวรรดิและเป็นขันทีเสมอ"

