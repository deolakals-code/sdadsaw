 ep3_interactions_events.0610.t: "บ้านสำหรับตระกูล [ROOT.Char.GetHouse.GetNameNoTooltip]"
 ep3_interactions_events.0610.desc: "[emperor.GetPrimaryTitle.GetName]. ที่ ซึ่งข้าราชการขีดเขียนกฎหมายอันน่าเบื่อหน่าย ที่ ซึ่งริมฝีปากทาสีกระซิบกระซาบท่ามกลางความมหัศจรรย์ของพระราชวัง... และที่ ซึ่งข้าได้ซื้อคฤหาสน์อันงดงามไว้\n\n"
 ep3_interactions_events.0610.desc_emperor: "ด้วยพระมหากรุณาธิคุณของ [emperor.GetTitledFirstNameRegnal] [emperor.GetHerselfHimself] ข้าจึงได้รับสถานที่ ณ ที่นี้ ตั้งอยู่ท่ามกลางความอึกทึกของ [emperor.GetCapitalLocation.GetTitle.GetNameNoTier] อันยิ่งใหญ่"
 ep3_interactions_events.0610.desc_governor: "การสนับสนุนของ [recipient.GetNamePossessive] ทำให้ข้าเข้าถึงโลกการเมืองของ [recipient.GetHerHis] ทำให้ข้าได้รับการต้อนรับใน [recipient.GetCapitalLocation.GetTitle.GetNameNoTier] ประจำจังหวัดของ [recipient.GetHerHis]"
 ep3_interactions_events.0610.desc_conversion: "และ ตามความพอใจของ [recipient.GetHerHis] ข้าคือ [ROOT.Char.GetFaith.GetAdherentName] ที่เพิ่งได้รับการ แต่งตั้งใหม่"
 ep3_interactions_events.0610.desc_emperor_outro: "\n\nองค์อธิปัตย์องค์ใหม่ของข้า ผู้ทรงอำนาจเหนือเกียรติยศทั้งปวง ตำแหน่งทั้งปวงใน [emperor.GetPrimaryTitle.GetTierAsNameNoTooltip] ของ [emperor.GetHerHis] ไม่น่าจะลืมว่าข้า — ผู้อยู่อาศัยคนใหม่ล่าสุดของเมืองหลวง — บัดนี้เป็นคนของ [emperor.GetHerHis]"
 ep3_interactions_events.0610.desc_non_governor_outro: "\n\nดังนั้น ข้าจึงเป็นหนี้บุญคุณ [recipient.GetTitledFirstNameNoTooltip] ใช่... แต่เป็นต่อ [emperor.GetFirstNameRegnal] ที่ข้าจะต้องกราบกราน เพราะการบริหารของ [emperor.GetTitleAsNamePossessiveNoTooltip] ปกครองทุกสิ่ง"

 ep3_interactions_events.0610.a: "ข้าไม่ใช่ [ROOT.Char.GetLadyLord] ผู้มีที่ดิน... แต่ข้ามีโอกาสใหม่ๆ"

 ep3_administrative_outsider_modifier: "คนนอกฝ่ายปกครอง"
 ep3_administrative_outsider_modifier_desc: "ตัวละครนี้ได้แทรกตัวเข้าไปในศูนย์กลางอำนาจฝ่ายปกครอง ที่ ซึ่งพวกเขาถูกปฏิบัติด้วยความเป็นปรปักษ์และความสงสัย"

 ep3_interactions_events.0611.opening: "นักพเนจรผู้สูงศักดิ์,"
