l_english: 

 grand_ambitions_header: "มักใหญ่ใฝ่สูง"

# Starting Event: Powerful Family Coup (grand_ambitions.0001)
 grand_ambitions.0001.t: "$grand_ambitions_header$"
 grand_ambitions.0001.desc: "ในฐานะประมุขของหนึ่งในตระกูลที่ทรงอำนาจที่สุดใน [ROOT.Char.GetLiege.GetPrimaryTitle.GetNameNoTier|l] อิทธิพลของข้าแผ่ขยายไปไกลและกว้าง คลังสมบัติของข้าลึกล้ำ และความทะเยอทะยานของข้า — ไร้ขอบเขต\n\n[target_char.GetTitledFirstName] ไม่คู่ควรกับบัลลังก์ เป็นเพียงเส้นด้ายเล็กๆ ในผืนพรมอันยิ่งใหญ่ของ [ROOT.Char.GetTopLiege.GetPrimaryTitle.GetTierAsNamePossessiveNoTooltip|l] ด้วยการสนับสนุนจากความยิ่งใหญ่ของตระกูล [ROOT.Char.GetHouse.GetName] ข้ามีความพร้อมอย่างยิ่งที่จะฟื้นฟูความรุ่งโรจน์ให้กับจักรวรรดิอันยิ่งใหญ่ของเรา\n\nการกระทำของข้าไม่เพียง แต่จะกำหนดอนาคตของตระกูลข้า แต่จะก้องกังวานไปในหน้าประวัติศาสตร์"
 grand_ambitions.0001.a: "ให้ชะตากรรมของ [target_char.GetCapitalLocation.GetTitle.GetNameNoTierNoTooltip] ถูกหล่อหลอมขึ้นใหม่ด้วยเหล็กกล้า!"
 grand_ambitions.0001.a.flavor: "ข้าจะรวบรวมทั้งจักรวรรดิมาสู่จุดประสงค์ของข้า เพราะ [target_char.GetCapitalLocation.GetTitle.GetNameNoTierNoTooltip] ต้องการผู้ปกครองที่มีคุณธรรมและความแข็งแกร่ง!"
 grand_ambitions.0001.b: "การบ่อนทำลายอย่างเงียบเชียบจะโค่นล้ม [target_char.GetTitleAsNameNoTooltip] ไม่ใช่สงคราม"
 grand_ambitions.0001.b.flavor: "[target_char.GetTitleAsNameNoTooltip] จะล่มสลายไม่ใช่ด้วยคมดาบ แต่ด้วยเสียงกระซิบแห่งการทรยศนับพัน"
 
 grand_ambitions.0001.b.toast: "เริ่มแผนการโค่นล้ม"
 grand_ambitions.0001.c: "เวลายังไม่เหมาะสม..."
 grand_ambitions_start_depose_scheme_tt: "เริ่ม [scheme|E] [GetScheme('depose').GetTypeName] ต่อต้าน [THIS.Char.GetTopLiege.GetShortUIName] ด้วย [GetModifier('scheme_grand_ambitions_modifier').GetNameWithTooltip]"

 grand_ambitions.0100.powerful_family_joins_faction: "[powerful_family_head.GetTitledFirstName] สาบานตนเข้าร่วม [claimant_faction|E] ของท่าน"

 grand_ambitions.0100.t: "$grand_ambitions_header$: ข้อเสนออันอาจหาญ"
 grand_ambitions.0100.intro: "ความเงียบในห้องทำงานของข้าถูกขัดจังหวะเมื่อ [ROOT.Char.Custom2( 'RelationToMe', interlocutor )] ของข้า [interlocutor.GetFirstName] ยื่นสาส์นฉบับล่าสุดให้ข้า "ข้อเสนอจากนอกพรมแดนของ [ROOT.Char.GetTopLiege.GetPrimaryTitle.GetTierAsNamePossessiveNoTooltip|l]" [interlocutor.GetSheHe] ประกาศ\n\n"
 grand_ambitions.0100.claim: "ตราประทับบนจดหมายมีเครื่องหมายของตระกูล [foreign_ruler.GetDynastyHouseName] ข้อความภายในเสนอข้อเสนออันอาจหาญ: พันธมิตรต่อต้าน [target_char.GetTitleAsName] โดยมีเงื่อนไขคือการยก [foreign_claim.GetName] ให้ ความอาจหาญของคำขอนั้นเทียบได้กับศักยภาพที่มันมีอยู่\n\n"
 grand_ambitions.0100.conclusion: "ข้อเสนอนี้เป็นดาบสองคม: คมหนึ่งเพื่อตัดเส้นทางสู่ชัยชนะของข้า อีกคมหนึ่งเพื่อทำร้าย [ROOT.Char.GetTopLiege.GetPrimaryTitle.GetTierAsNameNoTooltip|l] อย่างลึกซึ้งไม่แพ้กัน"
 grand_ambitions.0100.a: "[ROOT.Char.GetTopLiege.GetTitleAsNameNoTooltip|l] ต้องเสียสละ"
 grand_ambitions.0100.a.claim: "ท่านตกลงที่จะมอบ [foreign_claim.GetName] ให้แก่ [foreign_ruler.GetTitledFirstName] เมื่อท่านขึ้นครองบัลลังก์"
 grand_ambitions.0100.a.faction_tooltip: "ท่านจะสามารถเรียก [foreign_ruler.GetTitledFirstName] เป็นพันธมิตรใน [civil_war|E] ในอนาคตต่อต้าน [THIS.Char.GetTopLiege.GetTitledFirstName] ได้"
 grand_ambitions.0100.b: "ประนีประนอม บางที [compromise_county.GetNameNoTooltip] อาจน่าสนใจ?"
 grand_ambitions.0100.b.success: "[foreign_ruler.GetTitledFirstName] ตกลงตามข้อเสนอโต้กลับของท่าน"
 grand_ambitions.0100.b.success.tt: "ท่านสัญญาว่าจะมอบ [compromise_county.GetName] ให้แก่ [foreign_ruler.GetName] เมื่อท่านขึ้นครองบัลลังก์"
 grand_ambitions.0100.b.failure: "[foreign_ruler.GetTitledFirstName] ปฏิเสธข้อเสนอโต้กลับของท่าน"
 grand_ambitions.0100.c: "ข้าจะไม่ขายกระดูกสันหลังของ [ROOT.Char.GetTopLiege.GetPrimaryTitle.GetTierAsNameNoTooltip|l] ของข้า!"

 grand_ambitions.0110.t: "$grand_ambitions_header$: การเรียกระดมพล"
 grand_ambitions.0110.desc: "[ROOT.Char.Custom2( 'RelationToMe', interlocutor )] ของข้า [interlocutor.GetFirstName] รายงานว่า: "ผู้อุปถัมภ์ที่มั่งคั่งกำลังรวมตัวกันเพื่อสนับสนุนอุดมการณ์ของเรา และทหารที่เหนื่อยหน่ายกับการปกครองของ [target_char.GetTitleAsNamePossessiveNoTooltip] ก็พร้อมที่จะเข้าร่วมกับเรา"\n\nการสนับสนุนที่เพิ่มขึ้นนี้ ตั้งแต่คลังสมบัติของพันธมิตรไปจนถึงหัวใจของ [ROOT.Char.Custom('GetMartialMenWomen')] ที่กล้าหาญที่สุดของ [target_char.GetTitleAsNamePossessiveNoTooltip] ถือเป็นจุดเปลี่ยน กองทัพของเรากำลังจะเติบโตและทรัพยากรของเราจะขยายตัว ช่วงเวลานี้ไม่ใช่เพียงข้อพิสูจน์ถึงความชอบธรรมในอุดมการณ์ของข้า แต่ยังเป็นสัญญาณที่ชัดเจน: เวลาแห่งสงครามใกล้เข้ามาทุกที"
 grand_ambitions.0110.a: "ให้ทหารเหล่านั้นได้ทำงาน"
 grand_ambitions.0110.b: "ด้วยทองคำที่หลั่งไหลเข้ามานี้ เราสามารถอุดหนุนค่าใช้จ่ายในการเกณฑ์ทหารได้"
 grand_ambitions.0110.c: "ข้าจะไม่ยอมให้ใครก็ได้เข้าร่วมอุดมการณ์ของข้า!"

 grand_ambitions.0120.t: "$grand_ambitions_header$: รากฐานที่มั่นคง"
 grand_ambitions.0120.desc: "ขณะที่เสียงกระซิบของการกบฏดังก้องไปทั่วบริเวณคฤหาสน์ของข้า ความจริงอันโหดร้ายของการเผชิญหน้ากับจักรพรรดิที่ใกล้เข้ามาได้ทอดเงาลงบนการเตรียมการของเรา ความแข็งแกร่งที่จับต้องได้ของการป้องกันและทรัพยากรของ [estate.GetNamePossessive] เป็นสิ่งสำคัญยิ่ง\n\n[ROOT.Char.Custom2( 'RelationToMe', interlocutor )] ของข้า [interlocutor.GetFirstName] นำเสนอแผนการสำหรับหนทางสำคัญในการเสริมสร้างฐานอำนาจของข้า "บัดนี้คือเวลาที่จะเสริมความแข็งแกร่งให้กับคฤหาสน์" [interlocutor.GetSheHe] กระตุ้น ชี้ไปยังตำแหน่งที่เสนอสำหรับการก่อสร้าง"
 grand_ambitions.0120.a: "[maa_flavor.GetNameNoTooltip|l] ของข้าต้องการสถานที่ที่เหมาะสมในการรวมพล"
 grand_ambitions.0120.b: "ทุ่งหญ้าเลี้ยงสัตว์ให้ม้าที่อุดมสมบูรณ์สำหรับ [maa_flavor.GetNameNoTooltip|l]"
 grand_ambitions.0120.c: "หอสังเกตการณ์จะช่วยปรับปรุง [maa_flavor.GetNameNoTooltip|l] ของข้าได้อย่างแน่นอน"
 grand_ambitions.0120.d: "จ้างคนงานทั้งหมดที่เจ้าหาได้ — มีงานต้องทำอีกมาก!"

 grand_ambitions.0130.t: "$grand_ambitions_header$: เสียงกระซิบในสายลม"
 grand_ambitions.0130.desc.intro: "[ROOT.Char.Custom2( 'RelationToMe', interlocutor )] ของข้า [interlocutor.GetFirstName] เข้ามาพร้อมข้อเสนอเพื่อส่งเสริมแผนการของข้าต่อต้าน [target_char.GetTitledFirstName]\n\n"
 grand_ambitions.0130.desc.legitimacy.6: ""ผู้คนรัก [target_char.GetTitleAsNameNoTooltip] ของพวกเขา" [interlocutor.GetSheHe] เริ่มต้น "แต่ความรักเป็นสิ่งที่เปราะบาง หวาดระแวง ด้วยการทำงานที่เพียงพอ มันสามารถเปลี่ยนเป็นความกลัวการทรยศ และจากนั้น ไปสู่ความเกลียดชัง""
 grand_ambitions.0130.desc.legitimacy.5: ""ผู้คนโห่ร้องให้ [target_char.GetTitleAsNameNoTooltip] ของพวกเขา" [interlocutor.GetSheHe] เริ่มต้น "แต่จะมีสักกี่คนที่ยอมรับมีดแทน [target_char.GetHerHim]? คำพูดที่ถูกต้องในหูที่ถูกต้องและเงินเพิ่มอีกเล็กน้อยสำหรับราคาขนมปังมักจะขับไล่ฝูงชนไปสู่ความบ้าคลั่งเสมอ""
 grand_ambitions.0130.desc.legitimacy.4: ""ความศรัทธาของผู้คนใน [target_char.GetTitleAsNameNoTooltip] นั้นแน่วแน่" [interlocutor.GetSheHe] เริ่มต้น "หรืออย่างน้อยพวกเขาก็คิด เช่นนั้น — ฝูงชนเป็นสิ่งที่เปลี่ยนแปลงง่าย ด้วยความพยายามที่เพียงพอ ความภักดีของพวกเขาสามารถซื้อได้ แม้จะเป็นเพียงคืนเดียวก็ตาม""
 grand_ambitions.0130.desc.legitimacy.3: ""ความศรัทธาของผู้คนใน [target_char.GetTitleAsNameNoTooltip] ไม่ได้มั่นคงจนสั่นคลอนไม่ได้" [interlocutor.GetSheHe] เริ่มต้น "มันคงไม่ต้องใช้ความพยายาม #EMP มาก#! ขนาดนั้นในการบ่อนทำลาย [target_char.GetHerHim] เพื่อให้ฝูงชนดึง [target_char.GetWomanMan] ลงสู่ทะเลแห่งความเกลียดชัง""
 grand_ambitions.0130.desc.legitimacy.2: ""ความศรัทธาของผู้คนใน [target_char.GetTitleAsNameNoTooltip] ลดน้อยลง" [interlocutor.GetSheHe] เริ่มต้น "เพียงแค่ลมหายใจเดียว เราก็สามารถเป่าประกายไฟแห่งความไม่พอใจของพวกเขาให้กลายเป็นไฟที่โหมกระหน่ำได้""
 grand_ambitions.0130.desc.legitimacy.1: ""ผู้คนไม่มีแม้ แต่เศษเสี้ยวของความศรัทธาใน [target_char.GetTitleAsNameNoTooltip] จอมปลอม" [interlocutor.GetSheHe] เริ่มต้น "ความโกรธแค้นของพวกเขารุนแรง แต่ไร้ทิศทาง — เราเพียงแค่ต้องให้คำใบ้ที่น้อยที่สุดแก่พวกเขา""
 grand_ambitions.0130.desc.outro: "\n\n"ความคิดเห็นของ [target_char.GetCapitalLocation.GetTitle.GetNameNoTierNoTooltip] สามารถทำลาย [target_char.GetTitleAsNameNoTooltip] ได้ง่ายพอๆ กับที่สร้างขึ้นมา และมันเคยถูกชักจูงมาก่อน...""
 grand_ambitions.0130.a: "มาเรียกใช้บุญคุณกันเถอะ"
 grand_ambitions.0130.b: "ขอให้เสียงกระซิบของเรามีปีก!"
 grand_ambitions.0130.b.success: "เสียงกระซิบของท่านมีปีก"
 grand_ambitions.0130.b.failure: "เสียงกระซิบของท่านล้มเหลวในการ ทำให้ชื่อเสียงของ [target_char.GetTitleAsNamePossessive] เสื่อมเสีย"
 grand_ambitions.0130.b.crit_failure: "เสียงกระซิบของท่านทรยศต่อเจตนาของท่านต่อ [target_char.GetTitleAsName]"
 grand_ambitions.0130.c: "ทองคำมักจะคลายลิ้นของสามัญชน..."
 grand_ambitions.0130.d: "ข้าจะไม่พึ่งพา #EMP ข่าวลือ#! เราไม่ใช่เด็ก"

 grand_ambitions.0131.opening: "[interlocutor.Custom2( 'AppropriateGreeting', ROOT.Char )]"
 grand_ambitions.0131.desc: "ดูเหมือนว่าข่าวลืออื้อฉาวเกี่ยวกับท่านกำลังแพร่กระจายใน [target_char.GetCapitalLocation.GetTitle.GetNameNoTierNoTooltip]"
 grand_ambitions.0131.desc_secret: "\n\nเราได้ค้นพบว่าข่าวลือเหล่านี้ถูกเผยแพร่โดย [schemer.GetTitledFirstName] ผู้ ซึ่งต้องการบัลลังก์ของท่านเพื่อ [schemer.GetHerselfHimself]"
 grand_ambitions.0131.conclusion: "\n\nหากปล่อยไว้โดยไม่ตรวจสอบ อาจนำไปสู่หายนะได้..."
 grand_ambitions.0131.a: "ข้าก็มีเล่ห์เหลี่ยมของข้าเอง"
 grand_ambitions.0131.b: "พวกปล่อยข่าวลือไม่ได้อยู่ไกลเกินเอื้อมของข้า"
 grand_ambitions.0131.c: "ข้าจะไม่กังวลกับเรื่องเล็กน้อย เช่นนี้"
 grand_ambitions.0131.d: "สาปแช่งไอ้ [schemer.Custom2('InsultNoun', ROOT.Char)] [schemer.Custom2('InsultAdjective', ROOT.Char)] นั่น..."

 grand_ambitions.0140.t: "$grand_ambitions_header$: สหาย [target_gov.GetTitleAsNameNoTooltip]"
 grand_ambitions.0140.desc: ""ข้าบอกแล้วว่าอย่ารบกวน!" ข้าตะโกนเมื่อประตูห้องทำงานของข้าเปิดออก อย่างไรก็ตาม ใต้ขื่อประตูมีแขกที่ไม่คาดคิดยืนอยู่: [target_gov.GetFirstName] [target_gov.GetTitleAsNameNoTooltip] แห่ง [target_gov.GetPrimaryTitle.GetNameNoTier]\n\n"ขออภัยที่รบกวน [ROOT.Char.GetFirstNameNoTooltip] แต่ข้ามาเพื่อเสนอการสนับสนุนแก่ท่าน"
 grand_ambitions.0140.faction: "ข้าปรารถนาที่จะเข้าร่วมในความพยายามของท่านในการโค่นล้ม [target_char.GetTitleAsName]""
 grand_ambitions.0140.no_faction: "ข้ารู้ว่าท่านกำลังรวบรวมอำนาจให้ตนเองที่นี่ใน [ROOT.Char.GetPrimaryTitle.GetNameNoTierNoTooltip] เตรียมพร้อมที่จะโค่นล้ม [target_char.GetTitleAsName]""
 grand_ambitions.0140.a: "ยิ่งมากยิ่งดี"
 grand_ambitions.0140.b: "ข้าไม่ต้องการความช่วยเหลือจากเจ้า"

 grand_ambitions.0150.t: "$grand_ambitions_header$: ตัวแทนเพิ่มเติม"
 grand_ambitions.0150.desc: "[ROOT.Char.Custom2( 'RelationToMe', interlocutor )] ของข้า [interlocutor.GetFirstName] ก้าวไปข้างหน้า ความสำคัญของความพยายามของเราทอดเงาลงบนใบหน้าของ [interlocutor.GetHerHis] "แผนการของเราที่จะโค่นล้ม [target_char.GetTitledFirstName] ดำเนินต่อไปอย่างรวดเร็ว" [interlocutor.GetSheHe] กล่าวอย่างเคร่งขรึม แต่ละคำพูดของเขามีน้ำหนักของการสมคบคิดของเรา\n\n"กระนั้น แผนการของเราอาจล้มเหลวได้หากไม่มีพันธมิตรเพียงพอในตำแหน่งที่เหมาะสม ตัวแทนเพิ่มเติมจะช่วยให้มั่นใจในความสำเร็จของเรา""
 grand_ambitions.0150.a: "ผู้แทรกซึมที่มีทักษะจะช่วยเร่งแผนการของเราได้อย่างแน่นอน"
 grand_ambitions.0150.b: "ให้เราใช้ตัวล่อ เพื่อให้แน่ใจในความลับของเรา"
 grand_ambitions.0150.c: "ใครสักคนที่จะสรรเสริญคุณธรรมของข้าในราชสำนักคงจะเป็นการฉลาด"

 grand_ambitions.0151.t: "$grand_ambitions_header$: เจ้าแห่งเสียงกระซิบ"
 grand_ambitions.0151.desc: "ในแสงสลัวยามเย็น [ROOT.Char.Custom2( 'RelationToMe', interlocutor )] ของข้า [interlocutor.GetFirstName] เข้ามาพร้อมแววตาเจ้าเล่ห์ในดวงตาของ [interlocutor.GetHerHis]\n\n "โอกาสพิเศษปรากฏขึ้น" [interlocutor.GetSheHe] พึมพำ ทำให้แน่ใจว่าแม้ แต่กำแพงก็ไม่ได้ยิน " [GetCourtPositionType( 'chief_eunuch_court_position' ).GetNameNoTooltip] แห่งราชสำนักของ [target.GetTitleAsNamePossessiveNoTooltip] เงาที่เคลื่อนไหวอย่างเงียบเชียบผ่านทางเดินแห่งอำนาจ สามารถโน้มน้าวมาสู่ฝ่ายเราได้ อิทธิพลของ [eunuch.GetHerHis|U] นั้นไม่มีใครเทียบได้ ความลับของ [eunuch.GetHerHis] นั้นกว้างใหญ่ไพศาล"\n\n"[eunuch.GetSheHe|U] อาจเป็นแกนหลักในแผนการอันยิ่งใหญ่ของเราที่จะปรับเปลี่ยน [ROOT.Char.GetTopLiege.GetPrimaryTitle.GetTierAsNameNoTooltip|l]""
 grand_ambitions.0151.a: "ให้เสียงกระซิบของ [eunuch.GetHerHis] นำทางอุดมการณ์ของเรา"
 grand_ambitions.0151.b: "ความสามารถของ [eunuch.GetHerHis|U] มีค่าเกินกว่าจะยืมมาใช้เพียงอย่างเดียว"
 ga_0151_b_eunuch_aptitude: "[aptitude|E] ของ [eunuch.GetShortUINamePossessive] ในฐานะ [GetCourtPositionType( 'chief_eunuch_court_position' ).GetName] คือ [eunuch.GetCourtPositionAptitude( GetCourtPositionType( 'chief_eunuch_court_position' ) )]"
 grand_ambitions.0151.c: "มีวิธีอื่นในการสานแผนการของเรา"

 grand_ambitions.0155.t: "$grand_ambitions_header$: การเรียกใช้บุญคุณ"
 grand_ambitions.0155.desc: "[ROOT.Char.Custom2( 'RelationToMe', interlocutor )] ของข้า [interlocutor.GetFirstName] เข้ามา ใบหน้าของเขามืดลงด้วยความคิด\n\n"แผนการของเราที่จะโค่นล้ม [target_char.GetTitleAsNameNoTooltip] ต้องการคนวงในคนใหม่ คนที่จะเติมเต็มบทบาทของ [agent_slot.GetName] ข้าได้ระบุทรัพย์สินที่เป็นไปได้สามรายที่สามารถพลิกสถานการณ์ให้เป็นประโยชน์ต่อเราได้" เขากล่าว\n\nเขาก้าวถอยกลับเข้าไปในเงาของทางเดิน ทิ้งชื่อไว้เบื้องหน้าท่าน แต่ละชื่อเป็นคำสัญญาที่เงียบงันถึงอำนาจหรือภยันตราย"
 grand_ambitions.0155.a: "[agent_choice_1.GetFirstNameNoTooltip] จะช่วยความพยายามของเราได้อย่างแน่นอน"
 grand_ambitions.0155.b: "บางที [agent_choice_2.GetFirstNameNoTooltip] อาจจะดีที่สุด"
 grand_ambitions.0155.c: "[agent_choice_3.GetFirstNameNoTooltip] ในทางกลับกัน..."
 grand_ambitions.0155.d: "ไม่มีใครในกลุ่มนี้เหมาะสม"

 grand_ambitions.0160.t: "$grand_ambitions_header$: เส้นด้ายแห่งการบ่อนทำลาย"
 grand_ambitions.0160.desc: "[ROOT.Char.Custom2( 'RelationToMe', interlocutor )] ของข้า [interlocutor.GetFirstName] เข้ามาหาข้าพร้อมข่าวเกี่ยวกับแผนการของเราที่จะโค่นล้ม [target_char.GetTitledFirstName] "รากฐานสำหรับความทะเยอทะยานอันยิ่งใหญ่ของเราได้วางไว้แล้ว" เขาเริ่มต้น เสียงของเขามั่นคงและแน่วแน่\n\n"เรามีพันธมิตรในที่สูงและต่ำ แต่ละคนพร้อมที่จะเล่นบทบาทของตนในแผนการอันยิ่งใหญ่ของเรา เราจะวางใจในผู้ใด?"
 grand_ambitions.0160.a: "ข้าราชการในวังจะเป็นพันธมิตรคนสำคัญ"
 grand_ambitions.0160.b: "พ่อค้าจะนำพาคำพูดของเราไปอย่างรวดเร็วและปลอดภัย"
 grand_ambitions.0160.c: "อาลักษณ์หลวงจะ ทำให้แน่ใจว่าเราจะไม่ถูกเปิดโปง"

 grand_ambitions.0170.t: "$grand_ambitions_header$: พันธมิตรที่ทรงพลัง"
 grand_ambitions.0170.desc: "[ROOT.Char.Custom2( 'RelationToMe', interlocutor )] ของข้า [interlocutor.GetFirstName] เข้ามาหาข้าด้วยความเร่งรีบอย่างเงียบๆ\n\n"ข้อเสนอ" [interlocutor.GetSheHe] เริ่มต้น "จากประมุขของหนึ่งในตระกูลที่รุ่งโรจน์ที่สุดของ [ROOT.Char.GetTopLiege.GetPrimaryTitle.GetTierAsNamePossessiveNoTooltip|l] พวกเขารู้เรื่องความปรารถนาของเราและเห็นโอกาสในการได้ประโยชน์ร่วมกัน" เขาคลี่ม้วนกระดาษออก ตราประทับของตระกูล [powerful_house.GetName] ส่องแสงเป็นลางร้ายในแสงสลัว\n\n"การสนับสนุนของพวกเขาอาจพลิกสถานการณ์ให้เป็นประโยชน์ต่อเรา อย่างไรก็ตาม ความภักดี เช่นนั้นมาพร้อมกับราคาของมัน — ค่าตอบแทนที่พวกเขาเชื่อว่าเท่าเทียมกับความเสี่ยง""
 grand_ambitions.0170.a: "เราจะจ่ายตามราคาของพวกเขา — ไม่ว่าจะต้องแลกด้วยอะไรก็ตาม"
 grand_ambitions.0170.b: "พวกเขาจะผูกพันกับเราด้วยสัญญาว่าจะตอบแทนในอนาคต"
 grand_ambitions.0170.c: "ให้เรารวมตระกูลของเราเข้าด้วยกันในสหภาพอันศักดิ์สิทธิ์"
 grand_ambitions.0170.d: "ความทะเยอทะยานของข้าจะไม่ถูกผูกมัดด้วยหนี้สิน"

 grand_ambitions.0180.t: "$grand_ambitions_header$: พิธีราชาภิเษกที่เหมาะสม"
 grand_ambitions.0180.intro_hagia_sofia: "ที่นี่ภายใต้โดมสีทองอันกว้างใหญ่และน่าเกรงขามของฮาเกียโซเฟีย"
 grand_ambitions.0180.desc: "ข้ายืนอยู่ต่อหน้า [hof.GetTitleAsName] ผู้นำทางจิตวิญญาณของประชาชนของข้า อากาศอบอวลไปด้วยกลิ่นกำยานและน้ำหนักของศตวรรษ\n\nการได้รับความโปรดปรานจาก [hof.GetHerHis] ไม่เพียง แต่จะให้ความชอบธรรมแก่การอ้างสิทธิ์ของข้าใน [target_title.GetName] เท่านั้น แต่ยังสามารถโน้มน้าวใจของผู้ศรัทธาทั่วทั้งจักรวรรดิได้ [hof.GetSheHe|U] ต้องสวมมงกุฎให้ข้า\n\n[hof.GetTitleAsNameNoTooltip] ไม่ใช่เพียงบุคคลสำคัญทางจิตวิญญาณเท่านั้น [hof.GetSheHe] ตระหนักดีถึงกลอุบายทางโลกของ [ROOT.Char.GetTopLiege.GetPrimaryTitle.GetTierAsNamePossessiveNoTooltip|l]"
 grand_ambitions.0180.a: ""มันถูกกำหนดโดยสวรรค์""
 grand_ambitions.0180.a.flavor: "[ROOT.Char.GetFaith.HighGodName] ประสงค์ เช่นนั้น และมันจะเป็น เช่นนั้น"
 grand_ambitions.0180.b: ""ท่านผู้ศักดิ์สิทธิ์ โปรดให้ข้าเป็นผู้รับใช้ของ [ROOT.Char.GetFaith.HighGodName]""
 grand_ambitions.0180.d.flavor: "#EMP จงยอมจำนนต่อเจตจำนงของข้า [hof.GetFirstName]!#!"
 grand_ambitions.0180.b.success: "[hof.GetTitledFirstNameNoTooltip] ตกลงที่จะสวมมงกุฎให้ท่าน"
 grand_ambitions.0180.b.success.tt: "หากประสบความสำเร็จในความพยายามที่จะโค่นล้ม [target_char.GetTitledFirstName] ท่านจะได้รับ #P [EmptyScope.ScriptValue('major_legitimacy_gain')]#! [legitimacy|E]"
 grand_ambitions.0180.b.failure: "[hof.GetTitledFirstNameNoTooltip] ปฏิเสธที่จะสวมมงกุฎให้ท่าน"
 grand_ambitions.0180.c: "แม้ แต่ [hof.GetTitleAsNameNoTooltip] ก็อาจถูกโน้มน้าวด้วยวัตถุ..."
 grand_ambitions.0180.d: "แม้ แต่ [hof.GetPrimaryTitle.GetNameNoTierNoTooltip|l] ก็ไม่รอดพ้นจากอิทธิพลของข้า"
 grand_ambitions.0180.e: ""เจ้า #EMP จะต้อง#! สวมมงกุฎให้ข้าในฐานะ [target.GetTitleAsNameNoTooltip] [hof.GetFirstNameNoTooltip]!""
 grand_ambitions.0180.f: "บางทีข้าจะกลับมาใหม่ภายหลัง"

 grand_ambitions.0190.t: "จงอยู่ใกล้ชิดมิตรสหาย..."
 grand_ambitions.0190.desc: ""... แต่จงใกล้ชิดศัตรูยิ่งกว่า" [ROOT.Char.Custom2('RelationToMeShort', interlocutor)] ของข้าพูดจบ พรรณนาถึงแผนการที่เพิ่งถูกเปิดโปงของ [secret_owner.GetTitledFirstNamePossessive] ที่จะอ้างสิทธิ์ใน [ROOT.Char.GetPrimaryTitle.GetName|l] เพื่อ [secret_owner.GetHerselfHimself]\n\nความ #EMP อหังการ#! ของ [secret_owner.GetWomanMan] ผู้นี้! ข้าไม่อาจปล่อยให้เรื่องนี้ผ่านไปโดยไม่มีการตอบโต้!"
 grand_ambitions.0190.a: "บางที [secret_owner.GetSheHe] อาจพอใจกับตำแหน่งในสภา..."
 grand_ambitions.0190.a.tt: "ท่านเสนอตำแหน่ง [co_emperor|E] ให้แก่ [secret_owner.GetShortUIName]"
 co_emperor_accepts: "#HIGH [secret_owner.GetSheHe|U] ยอมรับ#!"
 co_emperor_rejects: "#HIGH [secret_owner.GetSheHe|U] ปฏิเสธ#!"
 grand_ambitions.0190.a.tt.1: "[emperor.GetShortUIName|U] เข้าสู่ [duumvirate|E] กับ [secret_owner.GetShortUIName] ในฐานะ [co_emperor|E] ของ [CharYourHerHis( emperor )]"
 grand_ambitions.0190.a.tt.2: "ยุติแผนการของ [secret_owner.GetHerHis]"
 grand_ambitions.0190.b: "ให้ [secret_owner.GetHerHim] เน่าเปื่อยในคุกใต้ดิน!"
 every_family_member_of_secret_owner: "สมาชิกทุกคนในครอบครัวของ [secret_owner.GetTitledFirstName]"
 grand_ambitions.0190.c: "ทุกสิ่งย่อมดำเนินไปตามเวลาของมัน"

 grand_ambitions.0191.t: "$grand_ambitions_header$: ข้อเสนอแห่งโชคชะตา"
 grand_ambitions.0191.desc: ""#EMP [ROOT.Char.GetTitleAsNameNoTooltip]!#!"\n\n[interlocutor.GetTitledFirstName] [ROOT.Char.Custom2( 'RelationToMeShort', interlocutor )] ของข้า พรวดพราดเข้ามาในห้องทำงานของข้าและหอบหายใจ "โอกาสแห่งโชคชะตาปรากฏขึ้นแล้ว!" [interlocutor.GetSheHe] หอบ "[emperor.GetTitledFirstNameRegnal] ได้ล่วงรู้ถึงแผนการของท่านที่จะยึดบัลลังก์เพื่อตนเอง!"\n\n"แต่ [emperor.GetSheHe] ส่งข้อเสนอมา: #EMP จักรพรรดิร่วม.!# [emperor.GetSheHe|U] ปรารถนาให้ท่านละทิ้งแผนการของท่านและเข้ารับตำแหน่งเคียงข้างพระองค์ในการปกครอง [emperor.GetPrimaryTitle.GetTierAsNameNoTooltip|l] อันยิ่งใหญ่ของเราจาก [emperor.GetCapitalLocation.GetBaronyNameExplicitly] อันรุ่งโรจน์""
 grand_ambitions.0191.a: "#EMP น่าดึงดูดใจ...!#!"
 grand_ambitions.0191.a.tt.1: "ท่านกลายเป็น [co_emperor|E] ของ [emperor.GetShortUINamePossessive]"
 grand_ambitions.0191.a.tt.2: "ท่านยุติแผนการของท่าน"
 grand_ambitions.0191.b: "ข้าจะไม่มีวันแบ่งปันอำนาจกับ [emperor.Custom( 'InsultNoun' )] นั่น!"

 grand_ambitions.0200.t: "$grand_ambitions_header$: คืนแห่งโชคชะตา"
 grand_ambitions.0200.opening: "วันนี้ รากฐานของ [target.GetCapitalLocation.GetTitle.GetNameNoTierNoTooltip] สั่นสะเทือนภายใต้น้ำหนักของตระกูล [ROOT.Char.GetHouse.GetName] การปฏิวัติเงียบได้โค่นล้ม [target.GetTitleAsNameNoTooltip] เป็นการเริ่มต้นยุคใหม่\n\n"
 grand_ambitions.0200.eunuch: "[GetAgentSlotType( 'agent_eunuch' ).GetName] เจ้าแห่งความลับของวัง เล่นบทบาทของเขาได้อย่างสมบูรณ์แบบ เสียงกระซิบของเขาหว่านเมล็ดพันธุ์แห่งความขัดแย้ง การพยักหน้าเงียบๆ ของเขาในทางเดินที่มืดมิดเป็นการปูทางสู่ชัยชนะของเรา\n\n"
 grand_ambitions.0200.powerful_family: "แน่นอน การขึ้นครองบัลลังก์ของข้าคงเป็นไปไม่ได้หากไม่ได้รับการสนับสนุนจากตระกูล [story.MakeScope.Var('powerful_family').House.GetName] "
 grand_ambitions.0200.powerful_family.currency: "ซึ่งเห็นได้ชัดว่าคุ้มค่ากับน้ำหนักทองคำของพวกเขา"
 grand_ambitions.0200.powerful_family.hook: "แม้ว่าข้าจะไม่อยากจดจำบุญคุณที่ข้าติดค้างพวกเขา"
 grand_ambitions.0200.powerful_family.marriage: "ซึ่งบัดนี้ข้าได้ผูกพันด้วยการสมรสแล้ว"
 grand_ambitions.0200.powerful_family.fallback: "แม้ว่าข้าจะไม่อยากยอมรับก็ตาม"
 grand_ambitions.0200.desc: "การกระทำเล็กๆ น้อยๆ ของการกบฏ — ประตูทุกบานที่แง้มไว้ ข้อความทุกฉบับที่ถูกนำไปผิดทาง — ถักทอผืนผ้าแห่งชัยชนะของเรา พิสูจน์ให้เห็นว่าอำนาจของจักรวรรดิสามารถถูกชักจูงได้ด้วยมือที่ต่ำต้อยที่สุด"
 grand_ambitions.0200.conclusion: "\n\nเรายืนอยู่บนปากเหวแห่งยุคใหม่ พรุ่งนี้จักรวรรดิจะตื่นขึ้นมาไม่ใช่เพื่อมรดกเก่าแก่ที่เหนื่อยล้า แต่เพื่อคำมั่นสัญญาแห่งการปกครองของข้า\n\n"เจ้า [target.GetFirstName] เป็นเพียงเสียงสะท้อนที่จางหายไปของจักรวรรดิ #EMP ของข้า#!""
 grand_ambitions.0200.a: "[target.GetPrimaryTitle.GetNameNoTooltip] จะทะยานขึ้นบนปีกของตระกูล [ROOT.Char.GetHouse.GetNameNoTooltip]!"

 grand_ambitions.0201.t: "$grand_ambitions_header$: เส้นทางสู่อำนาจ"
 grand_ambitions.0201.desc: ""พระประสงค์อันศักดิ์สิทธิ์ที่นำทางชะตากรรมของจักรวรรดิได้เลือกองค์อธิปัตย์องค์ใหม่แล้ว" เสียงของ [ROOT.Char.GetFaith.GetReligiousHead.GetTitledFirstNamePossessive] ดังก้องไปทั่วห้องบัลลังก์ เปี่ยมไปด้วยความขึงขังที่เหมาะสมกับโอกาส\n\nดวงตาของ [ROOT.Char.GetFaith.GetReligiousHead.GetHerHis|U] สบกับข้า เป็นการยอมรับอย่างเงียบๆ ถึงข้อตกลงที่นำเรามาสู่ช่วงเวลานี้ "ด้วยพระคุณของ [ROOT.Char.GetFaith.HighGodName] ข้าขอสวมมงกุฎให้แก่เจ้า [ROOT.Char.GetName]"\n\nขณะที่น้ำหนักของมงกุฎวางลงบนหน้าผากของข้า ข้ารู้สึกถึงภาระแห่งศตวรรษที่วางลงบนบ่าของข้า เส้นทางสู่อำนาจของข้าอาจไม่เป็นไปตามแบบแผน แต่มันได้นำข้ามาที่นี่ สู่ช่วงเวลาอันรุ่งโรจน์นี้\n\n"
 grand_ambitions.0201.conc_greek: ""[Glossary( 'Kýrie, eléison', 'KYRIE_ELEISON_GLOSS' )]!" ข้าตะโกนอย่างมั่นใจ"
 grand_ambitions.0201.a: "[ROOT.Char.GetCapitalLocation.GetBaronyNameExplicitly] รออยู่"

 grand_ambitions.0202.t: "$grand_ambitions_header$: ชะตากรรมของผู้ล่มสลาย"
 grand_ambitions.0202.desc: "เบื้องหน้าข้า [ROOT.Char.GetTitleAsNameNoTooltip] ที่ถูกโค่นล้มรอคอยชะตากรรมของ [old_emp.GetHerHis] ภายใต้เงาของหัวใจที่คุกรุ่นของ [ROOT.Char.GetTopLiege.GetPrimaryTitle.GetTierAsNamePossessiveNoTooltip|l]\n\nวิธีที่ข้าเลือกที่จะจัดการกับชายผู้อยู่เบื้องหน้าข้าไม่ใช่เพียงเรื่องของการแก้แค้นส่วนตัวหรือความเมตตากรุณาเท่านั้น มันคือศิลาแรกที่วางลงในรากฐานแห่งมรดกของข้า\n\nมันจะเป็นหนึ่งในการแก้แค้นและความขัดแย้งที่หมุนเวียน หรือความเมตตาและความหวัง? สายตาของราชสำนัก ของประชาชน และของประวัติศาสตร์เองจับจ้องมาที่ข้า"
 grand_ambitions.0202.a: "ไปโดยสันติเถิด [old_emp.GetFirstNameNoTooltip]"
 grand_ambitions.0202.a.flavor: "ให้ [old_emp.GetHerHim] หายไปในยามค่ำคืน ห่างไกลจากเถ้าถ่านแห่งการปกครองของ [old_emp.GetHerHis]"
 grand_ambitions.0202.b: "ให้ [old_emp.GetHerHim] แบกรับรอยแผลเป็นแห่งการล่มสลายของเขา"
 grand_ambitions.0202.b.flavor: "กระนั้น [old_emp.GetSheHe] จะมีชีวิตอยู่ ในสิ่งนี้ เราพบความสมดุลระหว่างความยุติธรรมและความเมตตา เป็นสัญญาณแก่ทุกคนถึงราคาอันร้ายแรงของความโอหัง"
 grand_ambitions.0202.c: "ตีตรา [old_emp.GetHerHim] และขับไล่ [old_emp.GetHerHim] ออกไปนอกกำแพง!"
 grand_ambitions.0202.c.flavor: "ขณะที่ [old_emp.GetHerHis] ร่อนเร่ไปในแผ่นดิน [ROOT.Char.GetCapitalLocation.GetBaronyNameExplicitly] ก็จะร่อนเร่ออกจากอดีต เช่นกัน แสวงหาเส้นทางใหม่ไปข้างหน้า"
 grand_ambitions.0202.d: "ข้ายังไม่เสร็จธุระกับเจ้า"
 grand_ambitions.0202.d.tt: "[old_emp.GetFirstName] ยังคง [imprisoned|E] อยู่ในคุกใต้ดินของท่าน"

 grand_ambitions.0250.t: "$grand_ambitions_header$: จุดสิ้นสุดของเส้นทาง"
 grand_ambitions.0250.desc: "ห่างไกลจากการต้อนรับที่เราคาดหวัง [ROOT.Char.Custom2( 'RelationToMe', interlocutor )] ของข้า [interlocutor.GetFirstName] เข้ามาหาข้านอกประตูเมือง\n\n"เราเดินอยู่บนคมมีดและดูเหมือนจะตกลงไปผิดด้าน" [interlocutor.GetSheHe] กล่าวอย่างเคร่งขรึม\n\nเมืองหลวง ด้วยอาคารสูงตระหง่านและเงาที่ลึกล้ำ ดูเหมือนจะไม่เปลี่ยนแปลงไปจากความพยายามของเรา [target.GetTitleAsNameNoTooltip] ยังคงอยู่บนบัลลังก์ของ [target.GetHerHis] บางทีอาจไม่รู้ว่าลมแห่งการเปลี่ยนแปลงใกล้จะพัดผ่าน [target.GetCapitalLocation.GetBaronyNameExplicitly] เพียงใด"
 grand_ambitions.0250.a: "เส้นทางสู่อำนาจมืดมนลง..."

 grand_ambitions.0300.t: "$grand_ambitions_header$: หว่านพืช เช่นไร ได้ผล เช่นนั้น"
 grand_ambitions.0300.desc: "[foreign_ruler.GetTitledFirstName|U] ยืนอยู่เบื้องหน้าข้า [ROOT.Char.GetTitleAsNameNoTooltip] ที่เพิ่งได้รับการ แต่งตั้งใหม่แห่ง [ROOT.Char.GetPrimaryTitle.GetNameNoTier] และส่วนหนึ่งเป็น เพราะการสนับสนุนของ [foreign_ruler.GetHerHis]...\n\nดังนั้น [foreign_ruler.GetSheHe] จึงมาเพื่อเรียกร้องสิ่งที่ได้สัญญาไว้: [demand.GetName]"
 grand_ambitions.0300.a: "ข้าเป็น [ROOT.Char.GetWomanMan] ที่รักษาคำพูด [demand.GetNameNoTierNoTooltip] เป็นของเจ้า"
 grand_ambitions.0300.b: "ข้ามีบางสิ่งที่ยิ่งใหญ่กว่ามากที่จะเสนอ..."
 grand_ambitions.0300.b.success: "[foreign_ruler.GetTitledFirstName|U] ถูกโน้มน้าว"
 grand_ambitions.0300.b.failure: "[foreign_ruler.GetTitledFirstName|U] ไม่ถูกโน้มน้าว"
 grand_ambitions.0300.c: "ความไร้เดียงสาของเจ้าน่าเอ็นดู"

 grand_ambitions_ally_joins_war: "พันธมิตรเข้าร่วมสงคราม: [joiner.GetTitledFirstName]"

 grand_ambitions.0500.opening: "[interlocutor.Custom2('AppropriateGreeting', ROOT.Char)]"
 grand_ambitions.0500.dead: "ข้ามีความยินดีที่จะแจ้งให้ท่านทราบว่า [story.MakeScope.Var('target_char').Char.GetTitledFirstName] เสียชีวิตแล้ว แผนการของเราควรดำเนินต่อไปเพื่อโค่นล้ม [ROOT.Char.GetTopLiege.GetTitledFirstName] หรือไม่?"
 grand_ambitions.0500.wrong_title: "ข้ามีความยินดีที่จะแจ้งให้ท่านทราบว่า [previous_story_target.GetTitledFirstName] ไม่ได้ดำรงตำแหน่ง [story.Var('target_title').GetName] อีกต่อไป แผนการของเราควรดำเนินต่อไปเพื่อโค่นล้ม [ROOT.Char.GetTopLiege.GetTitledFirstName] หรือไม่?"
 grand_ambitions.0500.a: "ข้าจะไม่หยุดพักจนกว่า #EMP ข้าจะเป็น [ROOT.Char.GetTopLiege.GetTitleAsNameNoTooltip]!#!"
 grand_ambitions.0500.b: "ยุติการเตรียมการของเจ้า ให้เราเฉลิมฉลอง!"
 grand_ambitions.0500.b.tt: "ท่านยุติความพยายามที่จะ [depose|E] [THIS.Char.GetTopLiege.GetTitleAsName]"

