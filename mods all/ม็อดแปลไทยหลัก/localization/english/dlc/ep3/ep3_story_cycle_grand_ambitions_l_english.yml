 ### SCHEME MODIFIERS
 scheme_grand_ambitions_modifier: "ความทะเยอทะยานอันน่าเกรงขาม"
 scheme_grand_ambitions_modifier_desc: "ตัวละครนี้จับตามองรางวัลที่ใหญ่มาก"
 scheme_grand_ambitions_bribed_functionaries_modifier: "ข้าราชการที่ถูกติดสินบน"
 scheme_grand_ambitions_bribed_functionaries_modifier_desc: "ข้าราชการภายในวังหลวง ผู้หมดศรัทธาในการปกครองปัจจุบัน สร้างพันธมิตรอย่างลับๆ วางรากฐานสำหรับการเปลี่ยนผ่านอำนาจอย่างราบรื่น"
 scheme_grand_ambitions_bribed_merchants_modifier: "พ่อค้าที่ถูกติดสินบน"
 scheme_grand_ambitions_bribed_merchants_modifier_desc: "พ่อค้าและกะลาสี ผู้ภักดีต่ออุดมการณ์ นำข่าวสารไปทั่วจักรวรรดิ ทำให้การสื่อสารรวดเร็วและปลอดภัย"
 scheme_grand_ambitions_bribed_scribes_modifier: "อาลักษณ์ที่ถูกติดสินบน"
 scheme_grand_ambitions_bribed_scribes_modifier_desc: "อาลักษณ์หลวง ผู้ได้รับความไว้วางใจในความลับของ [ROOT.Char.GetTopLiege.GetPrimaryTitle.GetTierAsNamePossessiveNoTooltip|l] เปลี่ยนแปลงการสื่อสารอย่างแนบเนียน ปกปิดความคืบหน้าของแผนการจากสายตาที่จับจ้อง"
 scheme_grand_ambitions_embezzling_modifier: "การยักยอกทรัพย์"
 scheme_grand_ambitions_powerful_family_modifier: "พันธมิตรตระกูลผู้ทรงอำนาจ"
 scheme_grand_ambitions_powerful_family_modifier_desc: "พันธมิตรกับตระกูลผู้ทรงอำนาจอีกตระกูลหนึ่งในอาณาจักรได้ผลักดันแผนการนี้ไปสู่ความสำเร็จอย่างรวดเร็ว"
