 ep3_decisions_event.4060.t: "$major_decisions.0001.t$"
 ep3_decisions_event.4060.desc: "การจัดระเบียบอาณาจักรขนาดเท่า [ROOT.Char.GetPrimaryTitle.GetDefinitiveNameNoTooltip|l] ไม่ใช่เรื่องเล็กน้อย สิ่งที่เคยเป็นเครือข่ายความภักดีส่วนบุคคล บัดนี้กลายเป็นรัฐที่มีผู้ว่าการและข้าราชการ\n\n"
 ep3_decisions_event.4060.resistance.desc: "บางส่วนของอาณาจักรยังคงไม่ได้รับผลกระทบจากการปฏิรูปนี้ [obstinate_vassal.GetName] ไม่ไว้วางใจทั้งข้าและการปฏิรูปของข้า เราไม่อาจทนต่อสิ่งนี้ได้นาน\n\n"
 ep3_decisions_event.4060.state_faith.desc: "บางส่วนของอาณาจักรยังคงไม่ได้รับผลกระทบจากการปฏิรูปนี้ [non_state_faith_vassal.GetName] ไม่ไว้วางใจแนวคิดเรื่องศาสนาประจำรัฐและปฏิเสธการปฏิรูปของข้า สิ่งนี้ไม่อาจทนได้นาน\n\n"
 ep3_decisions_event.4060.de_jure.desc: "บางส่วนของอาณาจักรยังคงไม่ได้รับผลกระทบจากการปฏิรูปนี้ [non_de_jure_vassal.GetPrimaryTitle.GetNameNoTooltip|U] อยู่นอกรัฐใหม่ที่เราสร้างขึ้น เราไม่อาจทนต่อสิ่งนี้ได้นาน\n\n"
 ep3_decisions_event.4060.outro.desc: "เมื่อหลักนิติธรรมแผ่ขยายไปทั่วอาณาจักร ไม่ต้องสงสัยเลยว่าแนวคิดเรื่องครอบครัวและความเป็นข้าในบังคับจะหลีกทางให้กับความภาคภูมิใจในความเป็นพลเมืองและการรวมศูนย์อำนาจ"
 ep3_decisions_event.4060.a: "บัดนี้ กฎหมายปกครองดินแดนเหล่านี้แล้ว!"

 ep3_decisions_event.4065.opening: "[actor.Custom2('AppropriateGreeting', ROOT.Char)]"
 ep3_decisions_event.4065.desc: "อาณาจักรกำลังถูกจัดระเบียบใหม่ โดยใช้คุณธรรมเป็นหลักการชี้นำ ไม่มีที่ว่างสำหรับผู้ถือครองที่ดินตามสายเลือดอีกต่อไป\nข้าคาดหวังให้ข้าในบังคับทุกคนปฏิบัติตามและเข้าร่วมในตำแหน่งผู้ว่าการของข้า"
