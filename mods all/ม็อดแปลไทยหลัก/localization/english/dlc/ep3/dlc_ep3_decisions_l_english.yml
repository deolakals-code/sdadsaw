 # Embrace Heresy
 embrace_heresy_decision: "ยอมรับลัทธินอกรีต"
 embrace_heresy_decision_desc: "แม้จะมีการดำรงอยู่ของศรัทธาอย่างเป็นทางการที่รับรองโดย [ROOT.Char.GetTopLiege.GetPrimaryTitle.GetNameNoTooltip] ความเชื่อนอกรีตก็แพร่หลายในดินแดนของเรา หากข้าจะยอมรับหนึ่งในนั้นอย่างเปิดเผยและวางตนเป็นผู้นำ ข้าจะสามารถใช้ศักยภาพดิบของศรัทธาที่ไม่ถูกควบคุมเพื่อเพิ่มอำนาจและดำเนินตามวาระทางการเมืองของข้าได้"
 embrace_heresy_decision_tooltip: "ยอมรับลัทธินอกรีตและกลายเป็นผู้นำ"
 heresy_in_empire_or_bordering_tt: "[faith|E] ที่มีผู้ติดตามอย่างน้อย 3 [counties|E] ซึ่งอยู่ใน [religion|E] เดียวกันกับ [state_faith|E] ของ [realm|E] [top_liege|E] ของท่าน แต่ถือว่าเป็น [faith_hostile|E] จะต้องมีอยู่ในอย่างน้อย 1 เคาน์ตีภายใน [realm|E] [top_liege|E] ของท่าน หรือในเคาน์ตีต่างชาติที่มีพรมแดนติดกัน"
 ep3_decisions_event.5020.t: "การยอมรับลัทธินอกรีต"
 ep3_decisions_event.5020.desc: "โอกาสนั้นชัดเจน และข้าเพียงแค่ต้องคว้ามันไว้\n\nศรัทธา [heresy_1.GetAdjective|U] กำลังเฟื่องฟูใน [ROOT.Char.GetTopLiege.GetPrimaryTitle.GetNameNoTooltip] และต้องการผู้นำที่เข้มแข็งและมีอิทธิพลเพื่อเป็นตัวแทนในเวทีการเมือง แน่นอนว่า การวางตนเองในฐานะที่ถูกมองว่าเป็นพวกนอกรีตนั้นมีความเสี่ยง แต่ศักยภาพที่ยังไม่ได้ใช้ประโยชน์จากการรวมตัวชนกลุ่มน้อยที่ถูกกดขี่ภายใต้ธงเดียวกันนั้นช่างน่าดึงดูดใจ"
 ep3_decisions_event.5020.desc_more: "\n\nฉากทางศาสนาของ [ROOT.Char.GetTopLiege.GetPrimaryTitle.GetTierAsNameNoTooltip] นั้นแตกแยกมากจนข้าไม่จำเป็นต้องยึดติดกับตัวเลือกแรกของข้า เช่นกัน"
