 zealous_missionary_prep_decision: "เส้นทาง [ROOT.Char.GetFaith.GetAdherentNameNoTooltip] — การขึ้นสู่สวรรค์"
 zealous_missionary_prep_decision_desc: "การดำรงอยู่ของพวกนอกรีตอันชั่วร้ายและพวกนอกศาสนาที่หลงผิดเป็นการดูหมิ่นต่อ [ROOT.Char.GetFaith.GetAdherentNameNoTooltip] ที่ดีทุกคน ต่อ [ROOT.Char.GetFaith.HighGodName] [ROOT.Char.GetFaith.HighGodHerselfHimself|U]!"
 zealous_missionary_prep_decision_tooltip: "ถึงเวลาของนักเทศน์แล้ว"
 zealous_missionary_prep_decision_holy_site: "[location|E] ปัจจุบันของท่านต้องเป็น [holy_site|E] [THIS.Char.GetFaith.GetAdjective] ตาม [THIS.Char.GetFaith.GetName] ปกครองโดย [top_liege|E] [THIS.Char.GetFaith.GetAdjective]"
 zealous_missionary_prep_decision_holy_sites_visited_req: "ท่านสำเร็จ [pilgrimages|E] ไปยัง [holy_sites|E] ที่ไม่ซ้ำกันอย่างน้อยสองแห่ง"
 zealous_missionary_prep_decision_reward_desc: "ในทศวรรษหน้า ท่านจะเดินบนเส้นทางของผู้เผยแผ่ศาสนา [THIS.Char.GetFaith.GetAdjectiveNoTooltip] ผู้เคร่งครัด:\n#weak ท่านจะสามารถเปลี่ยนเคาน์ตีที่ท่านเยี่ยมชมให้เป็น [THIS.Char.GetFaith.GetName] ได้ ไม่ว่าจะด้วยความจริงในคำพูดของท่านหรือด้วยอำนาจดาบของท่าน\n#bold อันตรายร้ายแรง#! รอคอยผู้ที่ล้มเหลวไปตามทาง เพราะมีเพียงผู้ที่คู่ควรเท่านั้นที่จะได้รับรางวัล [THIS.Char.GetFaith.HighGodHerHis|U] ใน [THIS.Char.GetFaith.PositiveAfterLife|U]\n\n$EFFECT_LIST_BULLET$ @alert_icon! $ep3_laamp_decision_event.1103.difficulty.desc$\n$EFFECT_LIST_BULLET$ [learning_i] $ep3_laamp_decision_event.1103.a.desc$\n$EFFECT_LIST_BULLET$ [martial_i] $ep3_laamp_decision_event.1103.b.desc$"
 zealous_missionary_prep_decision_confirm: "[ROOT.Char.GetFaith.HighGodName] ยิ่งใหญ่!"

 ep3_laamp_decision_event.1101.t: "$zealous_missionary_prep_decision$" #ตอนนี้ท่านสามารถเริ่มเผยแพร่พระวจนะได้แล้ว
 ep3_laamp_decision_event.1101.desc: "มีสถานที่ไม่กี่แห่งบนโลกนี้ที่สามารถเห็นพลังของ [ROOT.Char.GetFaith.HighGodName] ผู้ทรงฤทธานุภาพได้เหมือนใน [holy_site_location.GetNameNoTooltip] ผู้ศรัทธาที่เดินทางมาที่นี่เพื่อสัมผัสถึงพลัง [ROOT.Char.GetFaith.HighGodHerHis|U] นั้นเป็นสุข\n\nสำหรับคนส่วนใหญ่ พื้นที่ศักดิ์สิทธิ์แห่งนี้คือจุดสิ้นสุดของการเดินทาง จุดสูงสุดของชีวิต แต่สำหรับข้า นี่เป็นเพียงจุดเริ่มต้นของเส้นทางของข้า\n\nและสำหรับผู้ที่ข้ากำลังจะนำแสงสว่าง [ROOT.Char.GetFaith.HighGodHerHis|U] มาให้ โอกาสเดียวของพวกเขาในการรอดพ้น"
 ep3_laamp_decision_event.1101.a: "ข้าอาบแสงแห่งความรุ่งโรจน์ของ [ROOT.Char.GetFaith.HighGodName|U]!"
 ep3_laamp_decision_event.1101.a.desc: "$zealous_missionary_prep_decision_reward_desc$\nเพื่อดำเนินต่อไปบนเส้นทางอันเคร่งครัดของท่าน ท่านต้องย้ายไปยังดินแดนของพวกนอกศาสนา"

 zealous_missionary_start_decision: "เส้นทาง [ROOT.Char.GetFaith.GetAdherentNameNoTooltip] — บทนำ"
 zealous_missionary_start_decision_desc: "เราไม่อาจคาดหวังให้ [ROOT.Char.GetFaith.HighGodName|U] ทำงานทั้งหมดได้ [ROOT.Char.GetFaith.HighGodNameSheHe|U] ต้องการผู้ศรัทธาเพื่อนำทางผู้หลงทาง... ไม่ว่าพวกเขาจะต้องการหรือไม่ก็ตาม"
 zealous_missionary_start_decision_other_faith_location: "ตำแหน่งที่ตั้งของท่านต้องเป็น [faith|E] อื่น"
 zealous_missionary_start_decision_tooltip: "ข้าต้องเป็นหนึ่งใน [ROOT.Char.GetFaith.GetAdherentNamePluralNoTooltip] ที่ดี"
 zealous_missionary_start_decision_reward_desc: "$zealous_missionary_prep_decision_reward_desc$"
 zealous_missionary_start_decision_confirm: "จงรีบตอบสนองต่อเสียงเรียก [ROOT.Char.GetFaith.HighGodHerHis|U] เถิด จิตวิญญาณของข้า!"
 
 ep3_laamp_decision_event.1102.t: "$zealous_missionary_start_decision$" #ท่านได้เริ่มเผยแพร่พระวจนะแล้ว
 ep3_laamp_decision_event.1102.desc: "ดินแดนศักดิ์สิทธิ์ของ [ROOT.Var('holy_site_ascension').Province.GetName] อยู่ห่างไกล แต่ข้ายังคงรู้สึกถึงพลังของ [ROOT.Char.GetFaith.HighGodName] ภายในตัวข้า แข็งแกร่งกว่าที่เคย\n\nมันคือโชคชะตาของข้าเสมอมา ที่จะทำงาน [ROOT.Char.GetFaith.HighGodHerHis|U] เพื่อเติมเต็มดินแดนเหล่านี้และจิตวิญญาณที่อาศัยอยู่ที่นี่ด้วยแสงสว่าง [ROOT.Char.GetFaith.HighGodHerHis|U] ความรอดพ้นรอคอยพวกเขาอยู่ และข้าคือเครื่องมืออันต่ำต้อย [ROOT.Char.GetFaith.HighGodHerHis|U]"
 ep3_laamp_decision_event.1102.a: "และพวกเขาจะได้รู้จักพระนามของ [ROOT.Char.GetFaith.HighGodName]!"
 ep3_laamp_decision_event.1102.a.desc: "$zealous_missionary_prep_decision_reward_desc$\n#weak ท่านจะมีเวลา 10 ปีในการเผยแพร่ [faith|E] ของท่านขณะเดินทาง"
 ep3_laamp_decision_event.1102.b: "ข้ายังต้องการเวลาเตรียมตัว"
 ep3_laamp_decision_event.1102.b.desc: "ท่านเลื่อนการตัดสินใจออกไปก่อน"

 ep3_laamp_decision_event.1103.t: "เส้นทาง [ROOT.Char.GetFaith.GetAdherentNameNoTooltip] — การบรรลุผล" #เวลาเทศนา
 ep3_laamp_decision_event.1103.desc: "ช่วงเวลาที่สำคัญที่สุดสำหรับ [current_location.GetCounty.GetName] ได้มาถึงพร้อมกับการมาถึงของข้า เพราะวันนี้ข้านำแสงสว่างของ [ROOT.Char.GetFaith.HighGodName|U] มา และ [ROOT.Char.GetFaith.HighGodNameSheHe|U] จะเข้าสู่หัวใจของพวกเขา และจะคงอยู่ที่นั่นไปอีกหลายชั่วอายุคน\n\nชนชั้นสูงในท้องถิ่น [current_location.GetCounty.GetTitle.GetHolder.GetName] และพรรคพวกที่คดโกงของเขา ดื้อรั้นเกินไป เปื้อนเปรอะไปด้วยพิธีกรรมจอมปลอมของ [current_location.GetCounty.GetFaith.GetName] แต่จิตวิญญาณของ [current_location.GetCounty.GetCulture.GetCollectiveNoun] ที่ยากจนกำลังร่ำร้องหาข้า โหยหาพระคุณ [ROOT.Char.GetFaith.HighGodHerHis|U] และพวกเขาจะได้รับมัน!"
 ep3_laamp_decision_event.1103.desc.alternative: "เส้นทางของ [ROOT.Char.GetFaith.GetAdherentNameNoTooltip] ผู้เคร่งครัดนั้นไม่ใช่เรื่องง่าย ความยากลำบาก [ROOT.Char.GetHerHis] นั้นยาวนานและปราศจากรางวัลทางโลก มีเพียงความหวังเท่านั้นที่ค้ำจุนข้าไว้ [ROOT.Char.GetSheHe|U] ผู้เดินในศรัทธาอันบริสุทธิ์ยอมมอบตนเองไว้ในหัตถ์ของ [ROOT.Char.GetFaith.HighGodName|U] ดุจเด็กในอ้อมแขนของมารดา\n\nข้าเดินทางต่อไป เพราะงานและความรุ่งโรจน์ [ROOT.Char.GetFaith.HighGodHerHis|U] ยังคงไม่สมบูรณ์ เพราะหัวใจของ [current_location.GetCounty.GetFaith.GetAdherentNamePlural] ที่นี่ยังคงเต็มไปด้วยคำโกหกและความเชื่องมงายจอมปลอม\n\nแต่ไม่นานนัก วันนี้ การทดลองของข้าดำเนินต่อไป และการทดลองของพวกเขาเริ่มต้นขึ้น"
 ep3_laamp_decision_event.1103.difficulty.desc: "#weak เคาน์ตีที่มีการพัฒนาสูงกว่าจะเปลี่ยนศรัทธาได้ยากกว่า"
 ep3_laamp_decision_event.1103.a.desc: "#weak การพูดภาษาท้องถิ่นเพิ่มโอกาสสำเร็จ"
 ep3_laamp_decision_event.1103.a: "เจ้าจงฟังเสียงของ [ROOT.Char.GetFaith.HighGodName]!" #เทศนา
 ep3_laamp_decision_event.1103.a.alternative: "ขอให้เราอธิษฐานเพื่อความรอดพ้นของชาว [current_location.GetCounty.GetCulture.GetNameNoTooltip]"
 ep3_laamp_decision_event.1103.a.success: "การเปลี่ยนศรัทธาสำเร็จ"
 ep3_laamp_decision_event.1103.a.failure: "การเปลี่ยนศรัทธาล้มเหลว"
 ep3_laamp_decision_event.1103.b: "มีเพียงผู้ศรัทธาเท่านั้นที่จะคงอยู่!" #เปลี่ยนให้เป็นศพ
 ep3_laamp_decision_event.1103.b.alternative: "ไม่ว่า [ROOT.Char.GetFaith.HighGodNameSheHe|U] หรือดาบของข้าจะเข้าสู่หัวใจของเจ้า!"
 ep3_laamp_decision_event.1103.b.desc: "#weak การมีทหารและอัศวินมากกว่ากองทหารรักษาการณ์ในท้องถิ่นก็เพิ่มโอกาสสำเร็จ เช่นกัน"
 ep3_laamp_decision_event.1103.b.flavor: "การเปลี่ยนคนให้เป็นศพนั้นง่ายกว่าเปลี่ยนให้เป็น [ROOT.Char.GetFaith.GetAdherentNamePlural]"
 ep3_laamp_decision_event.1103.c: "ช่างเป็นสถานที่สกปรกเสียนี่กระไร" #คนพวกนี้ไม่คู่ควรกับความพยายามของข้า
 ep3_laamp_decision_event.1103.c.alternative: "อย่าเสียเวลากับ [current_location.GetCounty.GetName] เลย"
 ep3_laamp_decision_event.1103.c.desc: "ท่านจะไม่พยายามเปลี่ยนศรัทธาของประชากรในท้องถิ่น"
 ep3_laamp_decision_event.1103.c.flavor: "หาก [ROOT.Char.GetFaith.DevilName] สร้าง [current_location.GetCounty.GetTitle.GetHolder.GetTopLiege.GetPrimaryTitle.GetNameNoTierNoTooltip] อย่างที่บางคนว่าจริง นี่คือที่ที่เขาพักผ่อนในวันที่เจ็ด"

 ep3_laamp_decision_event.1104.t: "เส้นทาง [ROOT.Char.GetFaith.GetAdherentNameNoTooltip] — สิ้นสุด" #การเทศนาของท่านสิ้นสุดลงแล้ว
 ep3_laamp_decision_event.1104.desc: "ข้าได้รับพร! สิบปีก่อน ใน [ROOT.Var('holy_site_ascension').Province.GetName] [ROOT.Char.GetFaith.HighGodName] มาหาข้า เข้าสู่หัวใจของข้าและเติมเต็มด้วยความสุขและความงามอันเป็นนิรันดร์ และตั้งแต่นั้นมา ข้าได้เดินทางไปทั่วโลก [ROOT.Char.GetFaith.HighGodHerHis|U] เทศนาพระวจนะ [ROOT.Char.GetFaith.HighGodHerHis|U]\n\nทุกหนแห่งที่ข้าไป พลัง [ROOT.Char.GetFaith.HighGodHerHis|U] อยู่กับข้า แผ่ขยายไปทั่วดินแดนและหัวใจของผู้คน\n\nและวันนี้ เส้นทางของข้าในฐานะผู้เผยแผ่ศาสนาสิ้นสุดลง ในความรุ่งโรจน์ของ [ROOT.Char.GetFaith.HighGodName] ในการรู้ว่าข้าได้ทำหน้าที่ของข้าในแผนการอันยิ่งใหญ่ [ROOT.Char.GetFaith.HighGodHerHis|U] แล้ว"
 ep3_laamp_decision_event.1104.desc.failure: "ข้าเคยได้รับพร! สิบปีก่อน ใน [ROOT.Var('holy_site_ascension').Province.GetName] [ROOT.Char.GetFaith.HighGodName] มาหาข้า เข้าสู่หัวใจของข้าและเติมเต็มด้วยความสุขและความงามอันเป็นนิรันดร์ และสิ่งเดียวที่ [ROOT.Char.GetFaith.HighGodNameSheHe|U] ขอเป็นการตอบแทนคือการออกไปและแบ่งปันจนลมหายใจสุดท้ายของข้า\n\nแต่ข้า ดุจจิตวิญญาณอันชั่วร้ายที่ไม่ได้รับสัมผัส [ROOT.Char.GetFaith.HighGodHerHis|U] กลับเก็บมันไว้เพื่อตัวเอง ข้าพยายามแบ่งปันมันอย่างหนักพอหรือไม่? หรือเป็น [ROOT.Char.GetFaith.DevilName] ที่ชั่วร้ายที่นำข้าออกจากเส้นทาง? รอยด่างบนจิตวิญญาณของข้า รอยด่างแห่งความล้มเหลว แห่งความไม่ศรัทธา จะคงอยู่ที่นั่นชั่วนิรันดร์"
 ep3_laamp_decision_event.1104.a: "รางวัล [ROOT.Char.GetFaith.HighGodNamePossessive] รอข้าอยู่ใน [ROOT.Char.GetFaith.PositiveAfterLife|U]"
 ep3_laamp_decision_event.1104.b: "[ROOT.Char.GetFaith.HighGodName] โปรดอภัยให้ข้าด้วยเถิด เพราะข้าล้มเหลว"

 become_conqueror_decision: "กลายเป็นผู้พิชิตผู้ยิ่งใหญ่"
 become_conqueror_decision_desc: "นานเกินไปแล้วที่ดาบของข้านำความมั่งคั่งมาสู่ผู้อื่น บัดนี้โลกจะจมอยู่ใต้มหาสมุทรเลือดเพื่อความรุ่งโรจน์ #EMP ของข้า#! เวลาแห่งความทุกข์ยากอันยิ่งใหญ่จะเริ่มต้นขึ้น หาใดเปรียบมิได้นับตั้งแต่รุ่งอรุณแห่งกาลเวลา!"
 become_conqueror_decision_tooltip: "#WEAK ข้าขับขานถึงสงครามและบุรุษในสงคราม#!"
 become_conqueror_decision_confirm: "ข้าคือการลงทัณฑ์ของ [ROOT.Char.GetFaith.HighGodName]!"
 become_conqueror_decision_reward: "เมื่อได้ครอบครองที่ดิน ท่านจะได้รับ [trait|E] #V [GetTrait('conqueror').GetName( GetNullCharacter )]#! "
 become_conqueror_decision_troops: "ท่านจะได้รับกองทัพทหารผ่านศึกผู้ช่ำชอง ประกอบด้วย [GetMaA('accolade_maa_lancers').GetName] และ [GetMaA('accolade_maa_vanguards').GetName]"
 become_conqueror_decision_legend_seed: "ท่านจะได้รับ [legend_seed|E] #EMP $legend_chronicle_conqueror_chronicle$#!"
 become_conqueror_decision_war_participation: "ท่านได้เข้าร่วมสงครามอย่างน้อย 20 ครั้ง"
 become_conqueror_decision_war_participation_kingdom: "ท่านได้เข้าร่วมสงครามอย่างน้อย 5 ครั้งกับ [kings|E] หรือ [emperors|E]"
 become_conqueror_decision_two_commander_traits: "ท่านมี [commander_traits|E] อย่างน้อย 2 อย่าง"
 become_conqueror_decision_enough_troops: "ท่านมี [soldiers|E] อย่างน้อย 4000 นาย"
 become_conqueror_decision_enough_battle_kills: "ท่านได้สังหาร [characters|E] อย่างน้อย 12 คน"
 become_conqueror_decision_enough_war_contracts: "ท่านได้ทำสัญญา $laamp_raid_contract_contract$ หรือ $laamp_join_war_contract_contract$ [task_contracts|E] สำเร็จอย่างน้อย 20 ฉบับ"
 become_conqueror_decision_enough_high_level_knights: "ท่านมีอัศวินอย่างน้อย 6 คนที่มี [prowess|E] 18 หรือสูงกว่า"
 become_conqueror_decision_enough_mediocre_knights: "ท่านมีอัศวินอย่างน้อย 12 คนที่มี [prowess|E] 12 หรือสูงกว่า"
 become_conqueror_decision_war: "ท่านจะเริ่มสงครามกับ [conq_war_target.GetName]"

 ep3_laamp_decision_event.1110.t: "$become_conqueror_decision$"
 ep3_laamp_decision_event.1110.desc.has_kill: "ข้ายังคงจำความตาย [first_kill.GetTitledFirstNamePossessive] ได้ คนแรกที่ข้าจำได้ว่าตายตามความประสงค์ของข้า ข้ามีรสนิยม เช่นนั้นตั้งแต่ตอนนั้นหรือไม่? ความ... #EMP หิวโหย#! ภายในตัวข้านี้ ความต้องการมากขึ้นนี้ จุดประกายขึ้นในทันทีนั้น หรือเพียงแค่เผาไหม้สว่างพอที่จะมองเห็นได้ในที่สุด?\n\nอีกมากมายได้เข้าร่วมกับ [first_kill.GetHerHim] ตั้งแต่นั้นมา"
 ep3_laamp_decision_event.1110.desc.hasnt_kill: "มันเป็นความคิดที่แปลกจริง ๆ ข้าไม่มีความทรงจำที่ชัดเจนเกี่ยวกับคนแรกที่ถูกสังหารตามคำสั่งของข้า นับประสาอะไรกับด้วยมือของข้าเอง ท่านคงคิดว่ามันจะติดอยู่ในใจ [ROOT.Char.GetWomanMan] แต่ข้าไม่เคยสนใจใบหน้าหรือชื่อของคนตายมากนัก\n\nข้านับไม่ถ้วนว่าส่งไปสู่หลุมศพกี่คนแล้ว ไม่ต้องพูดถึงว่า #EMP ใคร#! กันแน่"
 ep3_laamp_decision_event.1110.desc.outro: "สำหรับคนส่วนใหญ่ การสังหาร เช่นนั้นก็เพียงพอแล้ว — แต่ไม่ใช่สำหรับข้า\n\nข้าอดไม่ได้ที่จะยิ้มเมื่อมองไปยังขอบฟ้า ไม่ใช่เพื่อผู้ที่ตายไป ข้ายิ้มเพื่อผู้ที่จะตาย"
 ep3_laamp_decision_event.1110.desc: "หลายปีก่อน ข้าสังหาร [first_kill.GetName] ในสนามรบ ความทรงจำนั้นติดอยู่กับข้าตั้งแต่นั้นมา หน้าอก [first_kill.GetHerHis|U] ฉีกขาดด้วยการโจมตีของข้า ดวงตา [first_kill.GetHerHis] เบิกกว้างด้วยความไม่เชื่อ เลือด [first_kill.GetHerHis] หยดลงสู่พื้น ทำให้ดินอุดมสมบูรณ์\n\nอีกมากมายได้เข้าร่วมกับ [first_kill.GetHerHim] ตั้งแต่นั้นมา สำหรับคนส่วนใหญ่ การสังหาร เช่นนั้นก็เพียงพอแล้ว แต่ไม่ใช่สำหรับข้า\n\nข้าอดไม่ได้ที่จะยิ้มเมื่อมองไปยังขอบฟ้า ไม่ใช่เพื่อผู้ที่ตายไป ข้ายิ้มเพื่อผู้ที่จะตาย"
 #ep3_laamp_decision_event.1110.desc: "Years ago, I slew [first_kill.GetName] in battle. The memory has stayed with me since. [first_kill.GetHerHis|U] chest ripped apart by my blow, [first_kill.GetHerHis] eyes wide open in disbelief, [first_kill.GetHerHis] blood dripping to the ground, making the soil fertile.\n\nMany more have joined [first_kill.GetHerHim] since. For most, such slaughter would be enough. But not for me.\n\nI cannot help but smile as I look to the horizon. Not for those who died. I smile for those that will."
 ep3_laamp_decision_event.1110.a: "การพิชิตโลกบนหลังม้านั้นง่าย..."
 ep3_laamp_decision_event.1110.a.flavor: "...การลงจากหลังม้าและปกครองต่างหากที่ยาก"
 ep3_laamp_decision_event.1110.a.desc: "$become_conqueror_decision_reward$"

 bandit_king_decision: "ระดมพลคนนอกคอก"
 bandit_king_decision_desc: "ข้าจะกลายเป็นนายเหนือหัวของบุตรธิดาแห่งสลัม กองทัพของเหล่าคนพาลที่ชั่วร้ายที่สุดผูกพันกับอุดมการณ์และความต้องการของข้า เพื่อสร้างความหายนะแก่ผู้อ่อนแอและผู้แข็งแกร่งเหมือนกัน"
 bandit_king_decision_reward: "#Bold ทุกครั้ง#! ที่ท่านทำ [criminal_task_contract|E] สำเร็จ ท่านจะได้รับ [men_at_arms|E] ที่ไม่เหมือนใคร\n#weak จำนวนขึ้นอยู่กับความก้าวหน้าของท่านใน [trait_level_track|E] [GetTrait('gallowsbait').GetName(GetNullCharacter)] ตั้งแต่ 100 ถึง 1000 คน"
 bandit_king_decision_tooltip: "นับคนขี้ขลาด นับคนทุจริต ผู้ที่ต่อสู้เพื่อเอาชีวิตรอด"
 bandit_king_decision_confirm: "รวมพลมาหาข้า เหล่าผู้ทุกข์ยากแห่งแผ่นดิน!"

 ep3_gallowsbait_army: "เดนคุก"
 ep3_bandits_army: "ผู้ทุกข์ยากและผู้หลงทาง"
 ep3_poachers_army: "คนเริงรมย์"
 maa_bandits: "โจร"
 maa_bandits_flavor: "#F เดนสังคม คนเหล่านี้ละทิ้งความชอบธรรมเพื่อชีวิตอาชญากรรม"
 maa_poachers: "พวกลักลอบล่าสัตว์"
 maa_poachers_flavor: "$maa_bandits_flavor$"
