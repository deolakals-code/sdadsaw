 ask_western_help_decision_effect_desc: "ท่านจะส่งคำร้องขอความช่วยเหลือทางทหารไปยังผู้นำคริสเตียนต่างศรัทธา พวกเขาอาจขอทองคำเป็นการตอบแทนสำหรับกองกำลัง หรือปฏิเสธ หาก [head_of_faith|E] เข้ามาเกี่ยวข้อง เรื่องอาจบานปลายกลายเป็นสงครามศักดิ์สิทธิ์ครั้งใหญ่!\n\nการตัดสินใจนี้มีระยะเวลาคูลดาวน์ 20 ปี"
 valid_realm_size_for_help: "[realm_size|E] ของท่านน้อยกว่า #N 84#! เคาน์ตี"
