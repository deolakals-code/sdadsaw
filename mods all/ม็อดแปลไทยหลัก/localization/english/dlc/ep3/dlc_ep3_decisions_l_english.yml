 # EP3 Split the Empire
 split_roman_empire_decision: "แบ่งแยกจักรวรรดิ"
 split_roman_empire_decision_desc: "มีเหตุผลหลายประการที่จักรวรรดิอันกว้างใหญ่ไพศาล เช่นนี้ถูกแบ่งแยกในยุคสมัยของบรรพบุรุษของเรา — และเหตุผลเหล่านั้นยังคงมีความสำคัญมาจนถึงทุกวันนี้ อำนาจจำต้องถูกแบ่งแยกอีกครั้ง"
 split_roman_empire_decision_selection_tooltip: "[GetPlayer.GetPrimaryTitle.GetName] จะถูกแบ่งออกเป็นสองส่วน ก่อตั้งเป็น [eastern_roman_empire|E]"
 split_roman_empire_decision_confirm: "จงเป็น เช่นนั้น"
 form_eastern_roman_empire_tt: "#HIGH [new_holder.GetName]#!:\n$EFFECT_LIST_BULLET$ได้รับ [eastern_roman_empire|E]\n$EFFECT_LIST_BULLET$[GetTitleByKey( 'c_byzantion' ).GetBaseNameNoTier] กลายเป็น [realm_capital|E] ใหม่ของพวกเขา"
 ending_of_restore_rome_trials_tt: "ผลกระทบจากการฟื้นฟูโรมในตอนแรกจะถูกยกเลิก:\n$EFFECT_LIST_BULLET$[peasant_factions|E] ทั้งหมดใน [realm|E] ของท่านจะไม่ตกเป็นเป้าหมายของท่านอีกต่อไป\n$EFFECT_LIST_BULLET$ลด [wars|E] จาก [titles|E] ระดับราชอาณาจักรอื่น ๆ\n$EFFECT_LIST_BULLET$ลดความถี่ของ [epidemic|E]\n$EFFECT_LIST_BULLET$เส้นเวลาการรุกรานของมองโกลจะกลับสู่ปกติ#!"

 seasoned_visitor_decision: "การเดินทางของ [ROOT.Char.GetFullNameNoTooltip]"
 seasoned_visitor_decision_desc: "ข้าได้เดินทางไปไกลและกว้างขวาง ไปยังสถานที่แปลกประหลาดและพิสดาร ปัญญาที่ข้าสั่งสมมานั้นหาที่เปรียบมิได้ เป็นสมบัติล้ำค่าสำหรับผู้ใฝ่รู้และเรียนรู้"
 seasoned_visitor_decision_tooltip: "มองย้อนกลับไปในการเดินทางของท่าน"
 seasoned_visitor_decision_reward_desc: "ท่านจะปลดล็อก [lifestyle|E] [perks|E] ใหม่ #EMP หรือ#! สร้างหนังสือ [artifact|E] ที่จะเพิ่มการได้รับ [lifestyle_experience|E] สำหรับผู้ถือครองในอนาคต\n#i ทุก ๆ #V 12#! $game_concept_points_of_interest$ ที่เยี่ยมชม สูงสุด #V 60#! จะเพิ่มรางวัล#!"
 seasoned_visitor_decision_confirm: "ข้าได้เห็นสิ่งมหัศจรรย์"
 seasoned_visitor_decision_not_enough_poi: "ท่านได้เยี่ยมชม #color_white 26#! [points_of_interest|E] #weak (ปัจจุบัน: [THIS.Var('poi_visited').GetValue|V0])#!"
 seasoned_visitor_decision_not_enough_poi_advanced: "ท่านได้เยี่ยมชม #color_white 42#! [points_of_interest|E] #weak (ปัจจุบัน: [THIS.Var('poi_visited').GetValue|V0])#!"
 NOT_ARTIFACT_CREATOR: "ไม่ใช่ผู้สร้างสิ่งประดิษฐ์นี้"

 ep3_laamp_decision_event.1100.t: "$seasoned_visitor_decision$"
 ep3_laamp_decision_event.1100.desc: "แสงอาทิตย์เจิดจ้าที่ขึ้นเหนือยอดเขาที่ปกคลุมด้วยหิมะ รางน้ำที่ฟู่ฟ่าของเมืองที่แผ่กว้าง วัดวาอารามที่เป็นที่พำนักของผู้ศรัทธาและผู้ทุกข์ยากที่สุด\n\nผลงานของผู้คนตลอดหลายศตวรรษ ความมหัศจรรย์ของธรรมชาติที่สร้างขึ้นโดยหัตถ์ของ [ROOT.Char.GetFaith.HighGodName] ผู้ทรงฤทธานุภาพ ข้าได้เห็นมาหมดแล้ว\n\nข้าได้พูดคุยกับทั้งชนชั้นสูงและชนชั้นล่าง ข้าได้เห็นผู้คนใช้ชีวิตในหลากหลายรูปแบบ ขุมทรัพย์แห่งการสังเกตอันเฉียบแหลม เช่นนี้ ของความทรงจำอันไร้ที่ติของข้า จะเป็นสิ่งมหัศจรรย์อันเป็นที่รักสำหรับทุกคนที่มีประกายแห่งความอยากรู้อยากเห็น... หากข้าตัดสินใจที่จะเขียนมันลงไป"
 ep3_laamp_decision_event.1100.a: "ความทรงจำของข้าเป็นของข้า แต่เพียงผู้เดียว"
 ep3_laamp_decision_event.1100.a.flavor: "ข้าอาจพูดแล้วพูดอีก แต่ผู้ฟังจดจำได้เพียงคำที่เขาคาดหวัง"
 ep3_laamp_decision_event.1100.a.desc: "เนื่องจากท่านได้เยี่ยมชม [THIS.Var('poi_visited').GetValue] $game_concept_points_of_interest$:"
 ep3_laamp_decision_event.1100.b: ""ข้ายังไม่ได้เล่าถึงครึ่งหนึ่งของสิ่งที่ข้าเห็น...""
 ep3_laamp_decision_event.1100.b.flavor: "... เพราะข้ารู้ว่าคงไม่มีใครเชื่อข้า"
 ep3_laamp_decision_event.1100.b.desc: "#weak สิ่งประดิษฐ์นี้จะมอบ [lifestyle_experience|E] ให้แก่ #color_yellow ผู้ถือครองในอนาคต#! คุณภาพของมันจะเพิ่มขึ้นตามทุก ๆ โหลของ $game_concept_points_of_interest$ ที่เยี่ยมชม#!"
 ep3_laamp_decision_event.1100.c: "ปากกาของข้าจะยังคงแห้งอยู่ในตอนนี้"
 ep3_laamp_decision_event.1100.c.desc: "ท่านเลื่อนการตัดสินใจที่จะเขียนเรื่องราวการเดินทางของท่านออกไป"
 ep3_laamp_decision_event.1100.c.flavor: "หากปราศจากก้อนหิน ก็ไม่มีซุ้มประตู"

