 ep3_courteous_knight_modifier_desc: "ตัวละครนี้เข้าใจว่าความรักคือความสุขที่ยิ่งใหญ่ที่สุดในชีวิต"
 ep3_valiant_knight_modifier: "อัศวินผู้กล้าหาญ"
 ep3_valiant_knight_modifier_desc: "ตัวละครนี้ได้ให้ความสำคัญสูงสุดกับการปกป้องผู้บริสุทธิ์"
 ep3_courteous_knight_var_tt: "[success_chance|E] ของท่านใน [schemes|E] ประเภท [GetScheme('courting').GetTypeName] จะเพิ่มขึ้นอย่างมาก"
