 change_election_candidacy_status_decision_desc.reject: "#EMP การเลือกตั้งเพื่อปกครอง?#! มันไม่ใช่การเลือกตั้ง มันคือการจับสลากเพื่อรับถ้วยยาพิษ ข้าชอบบ้านและครอบครัวของข้ามากกว่าเรื่องยุ่งเหยิงทั้งหมด"
 change_election_candidacy_status_decision_desc.embrace: "เมื่อพิจารณาแล้ว ข้าได้เห็นว่าข้าอาจจะ... #EMP เร็วเกินไป#! เล็กน้อยในการปฏิเสธโอกาสที่จะได้สวมมงกุฎที่ใหญ่กว่า หากเพื่อนร่วมงานของข้าต้องการสนับสนุนข้า แล้วข้าเป็นใครที่จะปฏิเสธพวกเขา?"
 change_election_candidacy_status_decision_tooltip: "เปลี่ยนจุดยืนของท่านเกี่ยวกับการได้รับเลือกให้ดำรงตำแหน่งที่สูงขึ้น"
