 butcher_animals_decision_desc: "เราหิวมากเหลือเกิน... แต่ก็มีเนื้อพร้อมกินตามเราไปรอบ ๆ กินเสบียงที่เหลืออยู่ของเรา เดินตามเราอย่างซื่อสัตย์ไปสู่ความพินาศ ในยามสิ้นหวัง เช่นนี้ เราต้องพิจารณาทางเลือก #EMP ทั้งหมด#!"
