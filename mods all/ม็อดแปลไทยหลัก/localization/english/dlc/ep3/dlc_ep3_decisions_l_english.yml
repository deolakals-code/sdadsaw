 artifact_knight_of_the_swan_name: "เสื้อคลุมทองคำแห่ง [ROOT.Char.CustomFixedRandom('GetKnightErrantAnimal')|U]"
 artifact_knight_of_the_swan: "เกราะที่ประดับด้วยลายดอกไม้ กล่าวกันว่าผู้สวมใส่ต้องไม่เปิดเผยชื่อของตน"
 swan_knight_title: "$knight_errant_decision$"
 swan_knight_desc: "แล้วพวกเขาก็เห็นสัตว์สีขาวราวหิมะลากเรือลำน้อยเปล่งประกายมุกลงมาตามกระแสน้ำ และ $knight_culture_player_no_tooltip_lowercase$ ผู้สง่างามนั่งอยู่ในนั้น และดูเหมือนจะนำทางมันไป"
 legend_chapter_opening_swan_knight: "[ROOT.Legend.GetProtagonist.GetNameNoTooltip] เดินทางไปทั่วดินแดนพร้อมกับผู้ติดตามที่ซื่อสัตย์ [ROOT.Legend.GetProtagonist.GetHerHis] ต่อสู้กับอันธพาลและช่วยเหลือผู้ที่ต้องการความช่วยเหลือ"
 legend_chapter_motivation_swan_knight: "เช้าวันหนึ่ง ขณะเข้าสู่ป่าหมอก [ROOT.Legend.GetProtagonist.GetSheHe] ได้ยินเสียงร้องขอความช่วยเหลือ เสียงเรียกที่ [ROOT.Legend.GetProtagonist.GetSheHe] ไม่อาจเพิกเฉยได้"
 legend_chapter_famous_deed_swan_knight: "หญิงสาวผู้งดงามถูกคุกคามโดยอัศวินชั่วร้าย แต่ [ROOT.Legend.GetProtagonist.GetFirstNameNoTooltip] เอาชนะเขาได้ในการต่อสู้ตัวต่อตัว [ROOT.Legend.GetProperty( 'friendly_animal' ).GetFlagName] สีขาวถือกำเนิดจากแอ่งเลือด"
 legend_chapter_conclusion_swan_knight: "[ROOT.Legend.GetProtagonist.GetSheHe|U] กล่าวกับนางว่า 'อย่าถามชื่อข้าเลย เพราะมันไม่ใช่ของข้าที่จะให้'"
 
 ep3_decisions_event.5002.t: "ความอัปยศต่อตระกูล"
 ep3_decisions_event.5002.desc: ""ข้าคงนึกไม่ถึงว่าท่านจะยอมทนต่อความอัปยศ เช่นนี้อย่างสงบเสงี่ยม" ม้าตัวหนึ่งหยุดอยู่ข้างค่ายพักของเรา ข้าจำผู้ขี่ของมันได้ว่าเป็น [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('my_rival'))] #EMP ที่รัก#! ของข้า [my_rival.GetTitledFirstName]\n\n"เกิดอะไรขึ้นกับท่าน? เล่นเป็น $knight_culture_player_plural_no_tooltip_lowercase$ แสร้งทำเป็นอยู่ในนิทานก่อนนอน," [my_rival.GetSheHe] ลงจากหลังม้า ถ่มน้ำลายลงบนพื้น\n\n"เมื่อไหร่ท่านจะกลับมามีสติ? หาที่ดินให้ตัวเองเสีย ก่อนที่ท่านจะสร้างความเสื่อมเสียให้กับชื่อเสียงอันดีงามของตระกูลเราต่อไป""
 ep3_decisions_event.5002.a: ""บางทีอาจถึงเวลาต้องตั้งรกราก...""
 ep3_decisions_event.5002.b: ""ข้าไม่มีเวลาให้กับ [my_rival.GetWomenMen] ที่ไร้เกียรติ""
