l_english: 
 # Estate Decisions
 estate_hire_agents_decisions: "จ้างวานสายลับ"
 estate_hire_agents_decisions_desc: "เมื่อสถานะทางการเมืองและอิทธิพลไม่เพียงพอที่จะ ทำให้ข้าได้สิ่งที่ต้องการ ข้าก็จำต้องแสวงหาทางเลือก #EMP อื่น#! อย่างไรก็ตาม ข้าต้องการสายลับเพื่อดำเนินการเรื่องนี้อย่างมีประสิทธิภาพยิ่งขึ้น"
 estate_hire_agents_decisions_confirm: "นำสายลับเหล่านี้มาให้ข้า!"
 estate_hire_agents_decisions_tooltip: "ค้นหาและสรรหาผู้ที่อาจเป็นสายลับเพื่อขับเคลื่อน [schemes|E] ของท่านให้ก้าวหน้ายิ่งขึ้น"
 estate_governor_patrols_decision: "ดำเนินการลาดตระเวนในเขตปกครองเจ้าเมือง"
 estate_governor_patrols_decision_desc: "เพื่อรักษาความสงบสุขและความปลอดภัยของราษฎรในเขตปกครองของข้า ข้าสามารถจัดให้มีการลาดตระเวนเป็นประจำเพื่อป้องกันโจรป่าที่อาจเกิดขึ้น การนี้อาจเป็นประโยชน์ในการรบด้วย เนื่องจากเราจะมีกองกำลังพร้อมรบอยู่เสมอ หากถึงคราวนั้น"
 estate_governor_patrols_decision_confirm: "เริ่มการลาดตระเวนทันที!"
 estate_governor_patrols_decision_tooltip: "จัดตั้งการลาดตระเวนใน [governorship|E] ของท่าน"
 estate_bolster_security_decision: "เสริมกำลังรักษาความปลอดภัยคฤหาสน์"
 estate_bolster_security_decision_desc: "ข้ากำลังหวาดระแวงเกินไปหรือไม่? รู้สึกราวกับว่าทุกคนจ้องจะเล่นงานข้า อาจจะแทงข้างหลังข้า หรือ ทำให้ชื่อเสียงข้าเสื่อมเสีย การเพิ่มกำลังรักษาความปลอดภัยส่วนตัวน่าจะ ทำให้ข้าสบายใจขึ้น #EMP ใช่หรือไม่?!#"
 estate_bolster_security_decision_confirm: "มา แต่งตั้งองครักษ์เพิ่มกันเถอะ"
 estate_bolster_security_decision_tooltip: "ปรับปรุงการรักษาความปลอดภัยส่วนบุคคลของท่านเพื่อป้องกัน [schemes|E]"
 estate_granary_decision: "ปั่นป่วนตลาดธัญพืช"
 estate_granary_decision_desc: "ยุ้งฉางส่วนตัวของข้าเก็บธัญพืชไว้จำนวนมาก ในยามจำเป็น ข้าอาจค่อยๆ ขายธัญพืชของข้าทีละกระสอบในราคาที่สูงขึ้นมาก ข้าจำเป็นต้องดึงเส้นสายบางอย่างเพื่อปั่นป่วนตลาดให้เป็นประโยชน์แก่ข้า แต่ข้าจะได้รับผลประโยชน์อย่างมหาศาล"
 estate_granary_decision_confirm: "เริ่มขายธัญพืช #EMP อย่างช้าๆ#!."
 estate_granary_decision_tooltip: "เพิ่ม [income|E] [gold|E] [gold_i|E] รายเดือนของท่านในอนาคตอันใกล้โดยการขายธัญพืชที่เก็บไว้ในยุ้งฉางของท่าน"
 estate_unlock_granary_decision_factors_tt: "\nปัจจัยสนับสนุนที่เพิ่มผลกระทบ:"
 estate_unlock_granary_decision_no_factors_tt: "#weak ไม่มีปัจจัยเพิ่มเติม#!"
 estate_unlock_granary_decision_grain_building_tt: "#weak [estate|E] ของท่านมี [domicile_building|E] [GetDomicileBuilding('grain_field_01').GetName] — เพิ่มขึ้นตามแต่ละระดับ#!"
 estate_unlock_granary_decision_rice_building_tt: "#weak [estate|E] ของท่านมี[domicile_building|E] [GetDomicileBuilding('east_asian_estate_rice_field_01').GetName] — เพิ่มขึ้นในแต่ละระดับ#!"
 estate_unlock_granary_decision_capital_tt: "#weak [estate|E] ของท่านตั้งอยู่ใน [capital|E]#!"
 estate_unlock_granary_decision_terrain_tt: "#weak [estate|E] ของท่านตั้งอยู่ใน [terrain|E] [domicile_owner.GetDomicile.GetLocation.GetTerrain.GetName]#!"
 estate_unlock_granary_decision_control_tt: "#weak [domicile_owner.GetDomicile.GetLocation.GetCounty.GetName] ได้รับผลกระทบจาก [county_control|E] ที่ลดลง#!"
 estate_unlock_granary_decision_development_1_tt: "#weak [domicile_owner.GetDomicile.GetLocation.GetCounty.GetName] มี [development|E] อย่างน้อย [EmptyScope.ScriptValue('estate_granary_development_bonus_1_value')|V0]#!"
 estate_unlock_granary_decision_development_2_tt: "#weak [domicile_owner.GetDomicile.GetLocation.GetCounty.GetName] มี [development|E] อย่างน้อย [EmptyScope.ScriptValue('estate_granary_development_bonus_2_value')|V0]#!"
 estate_unlock_granary_decision_epidemic_tt: "#weak มี [epidemic|E] ใน [domicile_owner.GetDomicile.GetLocation.GetName] ซึ่งทำให้พลเมืองท้องถิ่นยอมจ่ายค่าธัญพืชของท่านมากขึ้น#!"
 
 # Hold a Triumph Decision
 hold_triumph_decision: "จัดขบวนแห่ฉลองชัย"
 hold_triumph_decision_desc: "ขบวนแห่ฉลองชัยเป็นหนึ่งในประเพณีโรมันที่เก่าแก่และน่าเคารพที่สุด ในสมัยโบราณ แม่ทัพผู้มีชัยจะกลับสู่กรุงโรมท่ามกลางฝูงชนที่โห่ร้องและเกียรติยศอันยิ่งใหญ่ที่สุด — เป็นเวลาหนึ่งวัน เทียบเท่าเทพเจ้าในทุกสิ่งยกเว้นนาม วันนี้ ประชาชนจะเฉลิมฉลองความสำเร็จอันยิ่งใหญ่ที่สุดของข้าและความเจริญรุ่งเรืองที่ข้านำมาให้พวกเขา!$ep3_triumph_influence_cost_desc$"
 hold_triumph_decision_tooltip: "จัดขบวนพาเหรดอันยิ่งใหญ่เพื่อเฉลิมฉลองความสำเร็จของท่านและส่งเสริมภาพลักษณ์สาธารณะของท่าน"
 hold_triumph_decision_confirm: "เตรียมม้าให้ข้า!"
 ep3_triumph_influence_cost_desc: "\n\n@alert_icon! #alert_trial ค่าใช้จ่ายในการจัดขบวนแห่ฉลองชัยจะเพิ่มขึ้นหากท่านไม่ชนะ [war|E] ใดๆ ในรอบ 5 ปี!#!"
 hold_triumph_decision_effects: "ในระหว่างขบวนแห่ฉลองชัยของท่าน ท่านจะได้รับข้อเสนอทางเลือกหลายอย่างเพื่อสร้างความประทับใจที่ยั่งยืนต่ออาณัติของท่านและได้รับ [legitimacy|E], [influence|E], [prestige|E], [piety|E] และอื่นๆ"

 ep3_decisions_event_triumph: "ขบวนแห่ฉลองชัย:"
 ep3_decisions_event.0001.t: "$ep3_decisions_event_triumph$ ขบวนอันน่าประทับใจ"
 ep3_decisions_event.0001.intro: "ข้านั่งสง่าอยู่บนหลังม้า สวมอาภรณ์ที่สง่างามที่สุด นำขบวนอันยิ่งใหญ่ผ่านฝูงชนที่โห่ร้องเชียร์ทั้งสองข้างทาง"
 ep3_decisions_event.0001.desc_const: "\n\nดัง เช่นบรรพบุรุษผู้ทรงเกียรติของข้าเคยทำมาก่อน ข้าเข้าสู่นครศักดิ์สิทธิ์ [ROOT.Char.GetCurrentLocation.GetBaronyNameExplicitly] ผ่านทาง [Glossary( 'ประตูทองคำ', 'GOLDEN_GATE_GLOSS' )] เดินขบวนผ่านใจกลางเมืองท่ามกลางรูปปั้นและอนุสาวรีย์โบราณแห่งความรุ่งโรจน์ในอดีต และหยุดที่ [Glossary( 'มิเลียน', 'MILION_GLOSS' )] ซึ่งเป็นจุดเริ่มต้นของการวัดระยะทางทั้งหมดในจักรวรรดิ"
 GOLDEN_GATE_GLOSS: "#bold ประตูทองคำ#! เป็นส่วนหนึ่งของกำแพงธีโอโดเซียนที่ล้อมรอบกรุงคอนสแตนติโนเปิล และเป็นจุดเริ่มต้นของถนนสายหลักของเมืองหลวง คือ เมเซ"
 MILION_GLOSS: "#bold มิเลียน#! เป็นเครื่องหมายใจกลางของ [GetTitleByKey('e_byzantium').GetBaseName] และเป็นจุดกำเนิดที่ใช้วัดระยะทางไปยังเมืองต่างๆ ของจักรวรรดิ"
 ep3_decisions_event.0001.desc_other: "\n\nหลังจากเข้าสู่ [t_location.GetNameNoTier] ผ่านประตูหลัก เราเดินตามถนนสายหลักตรงไปยังใจกลางเมือง"
 ep3_decisions_event.0001.desc: "เหล่าทหารของข้าติดตามมาอย่างภาคภูมิใจ ร่วมแบ่งปันความรุ่งโรจน์แห่งชัยชนะเหนือ [triumph_enemy_defeated.GetTitledFirstName] ในขณะที่พลเมืองโห่ร้องเยาะเย้ยเชลยศึกและชื่นชมของริบจากสงคราม"
 ep3_decisions_event.0001.desc_no_war: "เหล่าทหาร คนรับใช้ที่แบกทรัพย์สมบัติ และข้าราชการระดับสูงในชุดทางการติดตามข้ามาอย่างภาคภูมิใจ เป็นประจักษ์พยานถึงอำนาจและความยิ่งใหญ่แห่งรัชสมัยของข้า"
 ep3_decisions_event.0001.desc_end: "\n\nแต่ขบวนแห่ฉลองชัยควรจะสิ้นสุดที่ใด?"
 ep3_decisions_event.0001.a: "ฮิปโปโดรมคือสถานที่ที่ดีที่สุด"
 ep3_decisions_event.0001.b: "ไปยัง [ROOT.Char.Custom('TriumphReligiousLocation')]!"
 ep3_decisions_event.0001.a.flavor: "ข้าต้องการสร้างความประทับใจอย่างแท้จริงต่ออาณัติของข้า!"
 ep3_decisions_event.0001.a.tt: "ขบวนแห่ฉลองชัยจะมุ่งหน้าไปยังฮิปโปโดรม"
 ep3_decisions_event.0001.b.flavor: "ศาสนาคือรากฐานแห่งอำนาจของข้า"
 ep3_decisions_event.0001.b.tt: "ขบวนแห่ฉลองชัยจะมุ่งหน้าไปยังฮาเกียโซเฟีย"
 ep3_decisions_event.0002.t: "$ep3_decisions_event_triumph$ ณ ฮิปโปโดรม"
 ep3_decisions_event.0002.desc_enemy: "ขณะที่ข้าเข้าสู่ฮิปโปโดรมอย่างผู้มีชัย สถานที่ตามธรรมชาติสำหรับอำนาจที่สถาปนาแล้วในการสื่อสารกับสามัญชน ข้าตั้งใจจะสื่อสารเพียงสิ่งเดียว: #EMP ชัยชนะ#!."
 ep3_decisions_event.0002.desc_no_war: "ฮิปโปโดรมเป็นเพียงสถานที่เดียวที่ประชาชนโดยทั่วไปได้รับอนุญาตให้เห็นข้า ดังนั้นจึงเป็นสิ่งสำคัญที่พวกเขาจะได้เห็นสิ่งที่ข้าต้องการให้เห็นอย่างแท้จริง: อำนาจ ความมั่งคั่ง และการควบคุม"
 ep3_decisions_event.0002.desc_prisoner: "\n\nขบวนเชลยศึกที่ไม่สิ้นสุด ถูกมัดและสวมเสื้อผ้าขาดรุ่งริ่งตามมา ส่วนใหญ่เป็นทหารธรรมดา แต่ที่หัวแถวคือ [valid_prisoner.GetTitledFirstName] ขี่ลาสร้างความขบขันให้ฝูงชน"
 ep3_decisions_event.0002.desc_no_prisoner: "\n\nอันที่จริง ทรัพย์สมบัติ สิ่งประดิษฐ์ ของริบจากสงคราม และสัญลักษณ์แห่งราชวงศ์ถูกแห่ตามมา — มากเกินพอที่จะเรียกเสียงเชียร์อันน่าประทับใจจากฝูงชน"
 ep3_decisions_event.0002.desc_artifact: "ท่ามกลางของริบจากสงคราม ชิ้นเอกคือ [sacked_artifact.GetName] ที่ปล้นมาได้ระหว่างการล้อมเมือง"
 ep3_decisions_event.0002.desc_hostage: "ในกล่องที่ประทับของจักรพรรดิ ข้าเหลือบเห็น [enemy_hostage.Custom2('MyCharacterIntroduction', ROOT.Char)] ทำหน้าบึ้งตึง"
 ep3_decisions_event.0002.desc_conclusion: "\n\nมวลชนกำลังรอคอยและบรรยากาศเต็มไปด้วยความตื่นเต้นและเสียงโห่ร้องอึกทึก ข้าจะให้สิ่งที่ประชาชนปรารถนา"
 ep3_decisions_event.0002.a: "การลงโทษเชลยศึกต่อหน้าสาธารณชน!"
 ep3_decisions_event.0002.a.tt: "ข้าจะแสดงให้เห็นว่าข้าจะจัดการกับพวกเขาอย่างไร!"
 ep3_decisions_event.0002.b: "การแจกจ่ายของริบจากสงครามให้แก่ประชาชน"
 ep3_decisions_event.0002.b.tt: "ทุกคนชอบที่จะรู้สึกเป็นส่วนหนึ่งของชัยชนะ!"
 ep3_decisions_event.0002.c: "อาหารและทองคำจะถูกแจกจ่ายให้แก่ฝูงชนที่ชื่นชม!"
 ep3_decisions_event.0002.c.tt: "ทุกคนชอบของฟรี ใช่ไหม?"
 ep3_decisions_event.0002.d: "แต่แน่นอน ต้องเป็นสุนทรพจน์ของข้า!"
 ep3_decisions_event.0002.d.tt: "ข้าต้องเลือกอย่างระมัดระวังว่าจะนำเสนอตัวเองต่ออาณัติของข้าอย่างไร"
 ep3_decisions_event.0002.d.custom_tooltip: "ท่านเลือกหัวข้อสำหรับสุนทรพจน์ของท่าน"
 ep3_decisions_event.0002.e: "เผา [sacked_artifact.GetNameNoTooltip] และแจกจ่ายของริบ"
 ep3_decisions_event.0002.e.tt: "ทุกคนควรได้รู้สึกเป็นส่วนหนึ่งของชัยชนะและความอัปยศอดสูอย่างที่สุดของศัตรู!"
 ep3_decisions_event.0003.t: "$ep3_decisions_event_triumph$ ณ [ROOT.Char.Custom('TriumphReligiousLocationCapitalized')]"
 ep3_decisions_event.0003.desc: ""มนุษย์เป็นสิ่งมีชีวิตที่เปราะบาง และแม้ แต่ชัยชนะที่ยิ่งใหญ่ที่สุดก็หายไปต่อหน้าความยิ่งใหญ่ของ [ROOT.Char.GetFaith.HighGodName]," ข้าคิดกับตัวเองอย่างเคร่งขรึมขณะก้าวผ่านประตู ข้าประทับใจในความสง่างามและความยิ่งใหญ่ของอาคารทันที\n\nประชาชนจะชื่นชมท่าทีที่อ่อนน้อมและอุทิศตนจากข้าอย่างแน่นอน เพื่อเป็นผลสืบ เนื่องจากชัยชนะอันรุ่งโรจน์ของข้าเหนือ [triumph_enemy_defeated.GetTitledFirstName]"
 ep3_decisions_event.0003.desc_no_war: "ความโอหังคือศัตรูที่เลวร้ายที่สุดของผู้มีอำนาจและยิ่งใหญ่\n\nแต่ที่เลวร้ายยิ่งกว่าคือการ #EMP สร้างความรู้สึกโอหัง#! ให้กับอาณัติของท่าน! ท้ายที่สุดแล้ว [ROOT.Char.GetTitleAsNameNoTooltip|U] เป็นเพียงตัวแทนของ [ROOT.Char.GetFaith.HighGodName] บนโลก อำนาจ ทรัพย์สมบัติ และความยิ่งใหญ่เป็นเพียงภาพสะท้อนแห่งความรุ่งโรจน์ของราชสำนักสวรรค์ ดังนั้นจึงเป็นสิ่งสำคัญที่จะแสดงความเคารพต่อลำดับชั้น"
 ep3_decisions_event.0003.desc_hostage: "นี่คือเหตุผลที่ข้าได้ขอให้ [enemy_hostage.Custom2('MyCharacterIntroduction', ROOT.Char)] มาร่วมกับข้าที่นี่อย่างสะดวก"
 ep3_decisions_event.0003.a: "ข้ายินดีรับพรจาก [ROOT.Char.GetFaith.HighGodNameAlternate]"
 ep3_decisions_event.0003.b: "ข้าจะถวายชัยชนะของข้าแด่ [ROOT.Char.GetFaith.HighGodName]"
 ep3_decisions_event.0003.c: "สันติสุขจงมีแด่ท่านและประชาชนของท่าน [enemy_hostage.GetFirstNameNoTooltip]"
 ep3_decisions_event.0003.d: "ข้าจะอุทิศของริบแด่ [ROOT.Char.GetFaith.HighGodNameAlternate]"
 ep3_decisions_event.0003.c.tt: "ท่าทีแห่งสันติภาพที่ได้รับการรับรองทางศาสนาจะช่วยผ่อนคลายความตึงเครียดกับประชาชนของ [triumph_enemy_defeated.GetTitledFirstNamePossessiveNoTooltip] อย่างแน่นอน"
 ep3_decisions_event.0003.d.tt_artifact: "ข้าจะบริจาค [sacked_artifact.GetName] บนแท่นบูชา"
 ep3_decisions_event.0004.t: "$ep3_decisions_event_triumph$ ขบวนแห่เชลยศึก"
 ep3_decisions_event.0004.desc: "เชลยศึกแถวแล้วแถวเล่าเข้าสู่ฮิปโปโดรม สกปรก ผอมโซ หัวโล้น เกือบจะน่าสงสาร หากพวกเขาไม่ใช่ศัตรูที่น่าชัง ซึ่งเราเพิ่ง ทำให้ขายหน้าในสนามรบ\n\n[valid_prisoner.GetTitledFirstName|U] นำพวกเขามาอย่างน่าอดสูในตอนนี้ดัง เช่นที่ [valid_prisoner.GetSheHe] เคยทำในสงคราม แต่การขี่ลาหันหน้าผิดทางขณะสวมเสื้อผ้าขาดรุ่งริ่ง ทำให้ [valid_prisoner.GetHerHim] ดูน่าเกรงขามน้อยลงมาก"
 ep3_decisions_event.0004.desc_hostage: "สีหน้าของ [enemy_hostage.Custom2('MyCharacterIntroduction', ROOT.Char)] มืดมนลงไปอีก"
 ep3_decisions_event.0004.a: "พวกเขาจะต้องถูก ทำให้ตาบอด"
 ep3_decisions_event.0004.b: "ประหารชีวิตพวกเขาต่อหน้าสาธารณชน"
 ep3_decisions_event.0004.c: "พระเมตตาของจักรพรรดิได้ประทานแก่พวกเขาแล้ว: ปล่อยให้พวกเขาเดินเป็นอิสระ"
 ep3_decisions_event.0005.t: "$ep3_decisions_event_triumph$ สุนทรพจน์ของจักรพรรดิ"
 ep3_decisions_event.0005.desc_victory: "ขณะที่ข้าก้าวขึ้นสู่กล่องที่ประทับของจักรพรรดิในฮิปโปโดรม ข้าใคร่ครวญถึงวิธีที่ดีที่สุดในการใช้ประโยชน์จากชัยชนะเหนือ [triumph_enemy_defeated.GetTitledFirstName]"
 ep3_decisions_event.0005.desc_no_war: "ฝูงชนนั้นเอาแน่เอานอนไม่ได้ และข้าก็ตระหนักดีว่าข้าไม่มีชัยชนะอันยิ่งใหญ่ใดๆ มาเป็นเหตุผลในการจัดขบวนแห่ฉลองชัย หรือเพื่อสร้างความน่าเชื่อถือใดๆ ที่ข้าจะใช้เป็นฐานในการกล่าวสุนทรพจน์ได้ แต่ถึงกระนั้น ข้าก็ต้องสร้างความประทับใจให้พวกเขาไม่ทางใดก็ทางหนึ่ง เพราะความมั่นคงในรัชสมัยของข้าส่วนใหญ่ขึ้นอยู่กับการสนับสนุนจากประชาชน"
 ep3_decisions_event.0005.desc_prisoner: "\n\nบางทีข้าควรชี้ให้เห็นถึงของริบจากสงครามอันมั่งคั่งที่ได้มาและความมั่นคงที่ชายแดนที่ได้รับการฟื้นฟู แม้ว่าเชลยศึกจำนวนมากที่จับได้ระหว่างสงคราม เช่น [valid_prisoner.GetTitledFirstName] ที่ถูกแห่ประจานต่อหน้าฝูงชนจะพูดแทนตัวเองได้อยู่แล้ว บางทีข้าควรจะมุ่งเน้นไปที่การเมืองภายในแทน?"
 ep3_decisions_event.0005.desc_politics: "\n\nสงครามนั้นถูกประเมินค่าสูงเกินไป บางทีข้าควรเบี่ยงเบนความสนใจของพวกเขาไปที่อื่น เช่น ความมั่นคงภายในหรือความเจริญรุ่งเรือง"
 ep3_decisions_event.0005.desc_hostage: "หางตาของข้าเหลือบเห็น [enemy_hostage.Custom2('MyCharacterIntroduction', ROOT.Char)] นั่งนิ่งไม่ไหวติงและหน้าตาเฉยเมย"
 ep3_decisions_event.0005.a: "ด้วยการนำทางของ [ROOT.Char.GetFaith.WarGodName] ชัยชนะมากมายจะตามมา!"
 ep3_decisions_event.0005.tt: "ประชาชนในเมืองหลวงของท่านจะจดจำสิ่งนี้ และจะตัดสินท่านตามนั้น!"
 ep3_decisions_event.0005.b: "ขอให้ [ROOT.Char.GetFaith.HealthGodName] นำพาจักรวรรดิไปสู่ความปลอดภัยเสมอ!"
 ep3_decisions_event.0005.c: "ภายใต้การคุ้มครองของ [ROOT.Char.GetFaith.HighGodName] จักรวรรดิจะเจริญรุ่งเรือง!"
 ep3_decisions_event.0005.a.success: "พวกเขาเชื่อในคำสัญญาของท่านและจะคาดหวังชัยชนะทางทหารจากท่าน"
 ep3_decisions_event.0005.a.failure: "พวกเขาไม่เชื่อในคำหวานของท่าน"
 ep3_decisions_event.0005.b.success: "พวกเขาเชื่อในคำสัญญาของท่านและจะคาดหวังสันติภาพภายใน"
 ep3_decisions_event.0005.c.success: "พวกเขาเชื่อในคำสัญญาของท่านและจะคาดหวังให้จักรวรรดิจริญรุ่งเรือง"
 ep3_decisions_event.a.tt: "ความไม่สงบจะก่อตัวขึ้นในเมืองหลวงของท่านหากไม่มีชัยชนะเกิดขึ้น"
 ep3_decisions_event.a.tt_no: "ท่านยังสามารถสร้างความประทับใจให้พวกเขาได้ด้วยการชนะสงคราม"
 ep3_decisions_event.b.tt: "ความไม่สงบจะก่อตัวขึ้นในเมืองหลวงของท่านหากเกิดการกบฏ"
 ep3_decisions_event.b.tt_no: "ท่านยังสามารถสร้างความประทับใจให้พวกเขาได้โดยไม่เผชิญกับการกบฏใดๆ"
 ep3_decisions_event.c.tt: "ความไม่สงบจะก่อตัวขึ้นในเมืองหลวงของท่านหากจักรวรรดิไม่เจริญก้าวหน้า"
 ep3_decisions_event.c.tt_no: "ท่านยังสามารถสร้างความประทับใจให้พวกเขาได้โดย ทำให้จักรวรรดิเจริญก้าวหน้า"
 ep3_decisions_event.success: "ฝูงชนเชื่อท่าน"
 ep3_decisions_event.failure: "ฝูงชนไม่เชื่อ"
 cultural_acceptance_triumph_offensive: "การแสดงขบวนแห่ฉลองชัยที่ก้าวร้าว"
 cultural_acceptance_triumph_peace: "กิ่งมะกอกที่สาบานไว้"
 fervor_gain_triumph_of_god: "ขบวนแห่ฉลองชัยทางศาสนา"
 ep3_decisions_event.0006.t: "$ep3_decisions_event_triumph$ การรักษาคำพูด"
 ep3_decisions_event.0006.desc: "ขบวนแห่ฉลองชัยครั้งล่าสุดของข้าเกิดขึ้นเมื่อหลายปีก่อน และคำสัญญาที่ข้าให้ไว้ในตอนนั้นแทบจะไม่ได้อยู่ในความคิดของข้าในปัจจุบัน อย่างไรก็ตาม พลเมืองของ [t_location.GetName] ยังไม่ลืม ดังที่ [talker.Custom2('MyCharacterIntroduction', ROOT.Char)] เตือนข้า\n\n"ประชาชนกำลังร่ำลือกันอยู่ ใต้ฝ่าละอองธุลีพระบาท [ROOT.Char.GetTitleAsNameNoTooltip|U]""
 ep3_decisions_event.0006.desc_victory: "ทรงจำได้หรือไม่ว่าพระองค์ทรงสัญญาว่าจะนำชัยชนะทางทหารอันยิ่งใหญ่มาให้พวกเขา?""
 ep3_decisions_event.0006.desc_stability: "ทรงจำได้หรือไม่ว่าพระองค์ทรงสัญญาว่าจะมอบความมั่นคงและอาณาจักรที่สงบสุขให้พวกเขา?""
 ep3_decisions_event.0006.desc_prosperity: "ทรงจำได้หรือไม่ว่าพระองค์ทรงสัญญาว่าจะมอบจักรวรรดิที่เจริญรุ่งเรืองและประสบความสำเร็จให้พวกเขา?""
 ep3_decisions_event.0006.desc_yes: "\n\nข้าจำได้ และข้าคิดว่ามันออกมาดีทีเดียว!"
 ep3_decisions_event.0006.desc_no: "\n\nข้าจำได้ และข้ารู้ว่าข้าล้มเหลว แต่ข้าแค่ต้องการเวลามากกว่านี้! ท้ายที่สุดแล้ว ข้ารักษาคำสัญญาเสมอ"
 ep3_decisions_event.0006.a: "ข้ารักษาคำสัญญาเสมอ"
 ep3_decisions_event.0006.b: "ยกเว้นตอนที่ข้าไม่ทำ"

 ep3_decisions_event.0007.t: "$ep3_decisions_event_triumph$ บทสรุป"
 ep3_decisions_event.0007.desc: "และด้วยเหตุนั้น [Glossary('สามัญชน', 'HOI_POLLOI_GLOSS' )] ก็ได้รับการปลอบประโลมอีกครั้ง อำนาจและความชอบธรรมแห่งอำนาจของข้าได้รับการยืนยันอีกครั้ง\n\n"
 ep3_decisions_event.0007.hippodrome: "ขณะที่ข้าเคลื่อนตัวออกจากฮิปโปโดรม เสียงเชียร์ของประชาชนดังก้องไปในอากาศ สะท้อนก้อนหินโบราณที่เคยเป็นพยานถึงความรุ่งโรจน์ของจักรพรรดิในอดีต ข้ารู้สึกถึงน้ำหนักของประวัติศาสตร์บนบ่า สายตาของชาวคอนสแตนติโนเปิลจับจ้องมาที่จักรพรรดิของพวกเขา\n\nวันนี้ ภายใต้แสงอาทิตย์อัสดง ชัยชนะของข้าไม่ใช่แค่การเฉลิมฉลอง แต่เป็นเครื่องพิสูจน์ถึงจิตวิญญาณและพลังอันยั่งยืนของจักรวรรดิ\n\n"[Glossary( 'ไอเอ็น อริสเตอูเอน (จงเป็นเลิศเสมอ)', 'TRIUMPH_HIPPODROME_CONC_GLOSS')]," ข้ากระซิบ"
 ep3_decisions_event.0007.hagia_sophia: "ภายในกำแพงอันศักดิ์สิทธิ์ของฮาเกียโซเฟีย ข้าถูกห้อมล้อมด้วยความสง่างามอันเคร่งขรึม เสียงสวดมนต์ของประชาชนประสานเสียงกัน ดังก้องไปทั่วพื้นที่ศักดิ์สิทธิ์อันกว้างใหญ่ ที่นี่ ในอ้อมกอดอันศักดิ์สิทธิ์ของสถาปัตยกรรมอันน่าอัศจรรย์นี้ ข้ารู้สึกเชื่อมโยงกับบางสิ่งที่ยิ่งใหญ่กว่าตัวเอง \n\nชัยชนะของข้าในสถานที่ศักดิ์สิทธิ์แห่งนี้อยู่เหนืออำนาจทางโลก — มันคือการรวมกันของศรัทธาและความเป็นผู้นำ สัญลักษณ์แห่งพรจากสวรรค์ต่อรัชสมัยของข้า\n\nขณะที่ข้ายืนอยู่ใต้โดมอันสง่างาม ข้าไม่ได้เป็นเพียงจักรพรรดิแห่งคอนสแตนติโนเปิล แต่เป็นผู้พิทักษ์หัวใจทางจิตวิญญาณของมัน\n\n"[Glossary( 'ไฮเปอร์ เทส บาซิลิอัส โซทีเรียส', 'TRIUMPH_HAGIA_SOPHIA_CONC_GLOSS')]," ข้ากระซิบ"
 TRIUMPH_HIPPODROME_CONC_GLOSS: ""#bold ไอเอ็น อริสเตอูเอน#! เป็นวลีกรีกโบราณจากมหากาพย์ #EMP อีเลียด#! ของโฮเมอร์ หมายถึง "เป็นเลิศเสมอ""
 TRIUMPH_HAGIA_SOPHIA_CONC_GLOSS: ""#bold ไฮเปอร์ เทส บาซิลิอัส โซทีเรียส#! เป็นสำนวนทั่วไปในภาษากรีกโบราณ หมายถึง "เพื่อความรอดของจักรวรรดิ""
 ep3_decisions_event.0007.a: "ความรุ่งโรจน์แห่ง [ROOT.Char.GetCurrentLocation.GetBaronyNameExplicitlyNoTooltip] จงเจริญ"
 ep3_decisions_event.0007.a.tt: "ขบวนแห่ฉลองชัยของท่านสิ้นสุดลง"

 # Find a Charioteer
 ep3_decisions_event.1000.t: "[GetCourtPositionType('charioteer_court_position').GetNameNoTooltip|U] ของข้า"
 ep3_decisions_event.1000.desc: "คนรับใช้ของข้าได้นำเสนอรายชื่อผู้สมัครเพื่อจ้างเป็นนักขับรถม้าของข้า — ผู้ที่จะเป็นตัวแทนอันรุ่งโรจน์ของข้าในฮิปโปโดรม\n\n[mediocre_charioteer.GetFirstName] ขาดประสบการณ์ แต่อาจพิสูจน์ได้ว่าเป็นตัวเลือกที่ดี ในทางกลับกัน [good_charioteer.GetFirstName] เป็นคู่แข่งที่ได้รับการพิสูจน์แล้ว"
 ep3_decisions_event.1000.desc.stolen_charioteer: "\n\nข้า #EMP อาจจะ#! ยื่นข้อเสนอที่น่าสนใจให้กับนักขับรถม้าของ [stolen_charioteer.GetEmployer.GetTitledFirstNamePossessive] คือ [stolen_charioteer.GetFirstName] บางที [stolen_charioteer.GetSheHe] อาจปรารถนานายจ้างที่ใจกว้างกว่า..."
 ep3_decisions_event.1000.a: "[mediocre_charioteer.GetFirstNameNoTooltip] สมควรได้รับความไว้วางใจ... และเหรียญของข้า"
 ep3_decisions_event.1000.a.aptitude: "[aptitude|E] ของ [mediocre_charioteer.GetUINamePossessive] คือ [mediocre_charioteer.GetCourtPositionAptitude( GetCourtPositionType( 'charioteer_court_position' ) )]"
 ep3_decisions_event.1000.b: "[good_charioteer.GetFirstNameNoTooltip] มีประสบการณ์ที่ข้ากำลังมองหา!"
 ep3_decisions_event.1000.b.aptitude: "[aptitude|E] ของ [good_charioteer.GetUINamePossessive] คือ [good_charioteer.GetCourtPositionAptitude( GetCourtPositionType( 'charioteer_court_position' ) )]"
 ep3_decisions_event.1000.c: "ข้าจับตาดู [stolen_charioteer.GetFirstNameNoTooltip] มาระยะหนึ่งแล้ว"
 ep3_decisions_event.1000.c.aptitude: "[aptitude|E] ของ [stolen_charioteer.GetUINamePossessive] คือ [stolen_charioteer.GetCourtPositionAptitude( GetCourtPositionType( 'charioteer_court_position' ) )]"
 ep3_decisions_event.1000.d: "คิดดูอีกที..."

