 change_election_candidacy_status_decision.tt.renounces_candidacy: "ท่านแจ้งให้ทราบว่าท่าน #BOL ไม่#! ต้องการได้รับเลือกให้ดำรง [title|E] ที่สูงขึ้น #WEAK (การเป็นเจ้าของอาณาจักรมากเกินไปอาจทำให้ท่านได้รับเลือกอยู่ดี)#!"

