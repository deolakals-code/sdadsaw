 #Recreate the ERE
 recreate_byzantine_empire_decision: "ฟื้นฟูจักรวรรดิไบแซนไทน์"
 recreate_byzantine_empire_decision_desc: "การแตกสลายของ [GetTitleByKey('e_byzantium').GetName] เป็นโศกนาฏกรรมที่ไม่เคยเกิดขึ้นมาก่อนสำหรับประชาชนของเรา แต่เราก็ดิ้นรนต่อไป ท้ายที่สุด ตราบใดที่ยังมี [Glossary( 'โรไมออส', 'ROMAIOS_GLOSS' )] เพียงคนเดียว โรมก็ยังคงอยู่\n\nวันหนึ่ง องค์อธิปัตย์ที่ชอบธรรมจะประทับบนบัลลังก์แห่งคอนสแตนติโนเปิลอีกครั้ง และจักรวรรดิจะฟื้นคืนชีพขึ้นมาใหม่"
 recreate_byzantine_empire_decision_tooltip: "สร้าง [GetTitleByKey('e_byzantium').GetName] และฟื้นฟูประเพณีโบราณ"
 recreate_byzantine_empire_decision_confirm: "โรมฟื้นคืนชีพ!"
 ep3_decisions_event.4030.t: "จักรวรรดิที่เกิดใหม่"
 ep3_decisions_event.4030.desc: "ด้วยการตายของผู้ศรัทธา ด้วยไฟแห่งวาทศิลป์ ด้วยพระประสงค์ของ [ROOT.Char.GetFaith.HighGodName] — #EMP [GetTitleByKey('e_byzantium').GetName|U] มีชีวิตอีกครั้ง!#!\n\nข้ามองดูราชินีแห่งนครต่างๆ สายลมอุ่นจากทะเลมาร์มาราพัดเล่นกับเสื้อคลุมประจำตำแหน่งของข้า เพลงไพเราะดังก้องออกมาจากมหาวิหารแห่งพระปัญญาศักดิ์สิทธิ์ พลเมืองเต้นรำตามท้องถนน เปล่งเสียงแสดงความขอบคุณและความสุข\n\nวันแห่งความอัปยศของเรา ที่ทั้งโลกดูถูก [Glossary( 'โรไมออย', 'ROMAIOS_GLOSS' )] ที่ล่มสลาย จะต้องสิ้นสุดลงอย่างแน่นอน [ROOT.Char.GetTitleAsNameNoTooltip] ที่ชอบธรรมประทับบนบัลลังก์ของ [GetScriptedCharacterByHistoryID( '70523' ).GetFirstName] อีกครั้ง\n\n#EMP ข้าเอง!#!"
 ep3_decisions_event.4030.a: "ความรุ่งโรจน์ของโรมจะเติบโตต่อไป!"
 ROMAIOS_GLOSS: "#bold โรไมออย#! (เอกพจน์ #bold โรไมออส#!) คือการทับศัพท์ภาษากรีกของชื่อภาษาละติน #bold โรมานี#! ซึ่งเป็นชื่อที่ชาวโรมันเรียกตนเอง ตลอดช่วงยุคกลาง ชาวไบแซนไทน์ระบุว่าตนเองเป็นชาวโรมัน และเรียกจักรวรรดิของตนว่า #EMP บาซิเลีย ตอน โรไมออน#! จักรวรรดิแห่งชาวโรมัน"
 #Varangian Guard
 found_varangian_guard_decision: "ก่อตั้งกองทหารวารันเจียน"
 found_varangian_guard_decision_desc: "เป็นเวลาหลายปีที่นักรบจากดินแดนที่ห่างไกลที่สุดในภาคเหนือได้รวมตัวกันในคอนสแตนติโนเปิล ดึงดูดโดยความร่ำรวยของเรา พวกเขาเสนอบริการเป็นทหารรับจ้าง ซึ่งเป็นศิลปะที่พวกเขาเชี่ยวชาญ และไม่มีความภักดีใดๆ นอกจากต่อเหรียญและความภาคภูมิใจของตนเอง หากเราสามารถจัดระเบียบการปรากฏตัวของพวกเขารอบๆ จักรพรรดิได้ เราจะได้กองกำลังทหารที่อยู่ยงคงกระพันมาเป็นบริการส่วนตัวของเรา!"
 found_varangian_guard_decision_tooltip: "$found_varangian_guard_decision$"
 found_varangian_guard_decision_confirm: "เริ่มรับสมัคร"
 unlocked_varangian_guard_desc: "ปลดล็อก [court_position|E] $akolouthos_court_position$ และ [men_at_arms|E] [GetMaA('varangian_guards').GetName] สำหรับ [GetTitleByKey('e_byzantium').GetName]"
 unlocked_varangian_guard_desc_tt: "ก่อตั้งกองทหารวารันเจียนแล้ว"
 #Grain Dole
 reinstitute_grain_dole_decision: "ฟื้นฟูการปันส่วนธัญพืช"
 reinstitute_grain_dole_decision_desc: "เป็นเวลาหลายศตวรรษที่พลเมืองของโรม และต่อมาคือคอนสแตนติโนเปิล ได้รับประโยชน์สูงสุดจากการอาศัยอยู่ในเมืองหลวงของโลก: การแจกจ่ายขนมปังฟรีหรือควบคุมราคาเป็นประจำ ประเพณีนี้สูญหายไปพร้อมกับยุ้งฉางแห่งโรม — อียิปต์ — แต่จักรพรรดิองค์ใดที่จะฟื้นฟูประเพณีนี้จะเพิ่มความนิยมในหมู่มวลชนทันที"
 reinstitute_grain_dole_decision_tooltip: "แนะนำการแจกจ่ายขนมปังให้กับประชาชนในเมืองหลวง"
