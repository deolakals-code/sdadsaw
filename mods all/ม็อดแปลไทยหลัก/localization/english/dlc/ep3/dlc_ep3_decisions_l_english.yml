 ep3_decisions_event.4040.desc: "ประชาชนมีเหตุผลทุกประการที่จะเฉลิมฉลองเมื่อประเพณีโบราณอันเป็นที่รักของการปันส่วนธัญพืชกลับมาสู่ [ROOT.Char.GetCapitalLocation.GetTitle.GetNameNoTierNoTooltip]!\n\nเป็นเมืองหลวงของโลกอีกครั้งด้วยความพยายาม #EMP ของข้า#! [ROOT.Char.GetCapitalLocation.GetTitle.GetNameNoTierNoTooltip] ได้รับธัญพืชราคาถูกจากอียิปต์อย่างต่อเนื่อง เช่นเดียวกับเมื่อหลายศตวรรษก่อน\n\nและดังที่กวีโบราณกล่าวไว้อย่างเหมาะสม สิ่งที่เราต้องการ เพื่อให้คนทั่วไปมีความสุขคือขนมปังและการละเล่น!"
