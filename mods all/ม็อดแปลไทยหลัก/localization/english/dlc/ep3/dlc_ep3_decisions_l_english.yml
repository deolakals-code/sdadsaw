 there_is_someone_to_ask_for_help: "ยังมีคนที่ท่านสามารถขอความช่วยเหลือได้"
 #Proselytize
 evangelize_the_slavs_decision: "เผยแผ่ศาสนาแก่พวกเพแกน"
 evangelize_the_slavs_decision_desc: "ในฐานะผู้เก็บรักษาศรัทธาที่แท้จริงหนึ่งเดียว เป็นหน้าที่ของ [GetTitleByKey('e_byzantium').GetNamePossessive] ที่จะเผยแผ่ศาสนาแก่พวกเพแกนและต้อนรับพวกเขาเข้าสู่คริสตจักรในฐานะพี่น้องที่อายุน้อยกว่าในพระคริสต์ สิ่งนี้มีความเกี่ยวข้องมากยิ่งขึ้น เนื่องจากพวกเขาอาศัยอยู่เลยพรมแดนของเราและคุกคามความสมบูรณ์และความมั่นคงของจักรวรรดิ"
 evangelize_the_slavs_decision_tooltip: "ส่งมิชชันนารีไปเปลี่ยนศาสนาเพื่อนบ้านเพแกนของท่าน"
 evangelize_the_slavs_decision_confirm: "ส่งมิชชันนารี"
 evangelize_the_slavs_decision_effect: "ท่านจะส่งมิชชันนารีไปพยายามเปลี่ยนศาสนาผู้ปกครองเพื่อนบ้านที่มีศรัทธาเพแกน\n$EFFECT_LIST_BULLET$หากมิชชันนารีสำเร็จ พวกเขาจะเปลี่ยนมานับถือ [faith|E] ของท่านและกลายเป็น [allies|E] ของท่าน ท่านจะได้รับ [legend_seed|E]\n$EFFECT_LIST_BULLET$การมีส่วนร่วมในความพยายามเผยแผ่ศาสนาถือเป็นความพยายามอันทรงเกียรติจนท่านจะได้รับ [influence|E] และ [prestige|E] แม้ว่ามิชชันนารีของท่านจะล้มเหลวก็ตาม"
 ep3_decisions_event.4020.t: "การเผยแผ่ศาสนาแก่ [pagan.GetCulture.GetCollectiveNounNoTooltip]"
 ep3_decisions_event.4020.desc: "อาณาจักรแห่งสวรรค์เป็นของผู้ศรัทธา แต่เพื่อนบ้านของเรา [pagan.GetTitledFirstName] ไม่ทราบเรื่องนี้อย่างมีความสุข และยังคงเชื่อในความเชื่องมงายและเทพเจ้าจอมปลอมของ [pagan.GetHerHis]\n\nการช่วยชีวิตวิญญาณของ [pagan.GetHerHis] และผู้คนของ [pagan.GetHerHis] เป็นความพยายามอันสูงส่งในตัวเอง แต่ก็มีข้อได้เปรียบ #EMP ทางโลก#! ในการเปลี่ยนศาสนาของพวกเขา — เริ่มต้นด้วยการลดความเป็นปรปักษ์ต่อเราและนำพวกเขาเข้ามาอยู่ในขอบเขตอิทธิพลของเราเอง\n\nมิชชันนารีที่ข้าเลือก [evangelizer.GetFirstName] พร้อมที่จะไปแล้ว"
 ep3_decisions_event.4020.a: "ขอ [ROOT.Char.GetFaith.HighGodName] นำทางท่าน!"
 ep3_decisions_event.4020.a.tt: "[evangelizer.GetFirstNameNoTooltip] ออกเดินทางไปยังเมืองหลวงของ [pagan.GetTitledFirstNamePossessiveNoTooltip]"
 ep3_decisions_event.4022.desc: "ทูตจากเพื่อนบ้านของเรามาและไปบ่อยครั้งจนพวกเขาทั้งหมดปะปนกันในความคิดของข้า อย่างไรก็ตาม ทูตวันนี้จาก [GetTitleByKey('e_byzantium').GetName] โดดเด่นกว่าใครๆ\n\n[evangelizer.GetSheHe|U] ดูเหมือนจะเป็น [evangelizer.GetWomanMan] ศักดิ์สิทธิ์บางประเภท และแทนที่จะเรียกร้องทางการเมือง [evangelizer.GetFirstName] ผู้นี้กลับเทศนาถึงพระเจ้าผู้ทรงฤทธานุภาพ ซึ่งได้รับการเคารพในวิหารทองคำและเงินที่มักมีกลิ่นเครื่องหอมอยู่เสมอ"
 ep3_decisions_event.4022.a: "โปรดบอกข้าเพิ่มเติม"
 ep3_decisions_event.4022.a.tt: "ท่านสร้าง [alliance|E] กับเจ้าเหนือหัวของ [evangelizer.GetTitledFirstNamePossessiveNoTooltip] คือ [sender.GetTitledFirstName]"
 ep3_decisions_event.4022.b: "เราไม่ต้องการเทพเจ้าใหม่"
 ep3_decisions_event.4022.c: "การดูหมิ่นศาสนาที่น่าหัวเราะ!"
 ep3_decisions_event.4022.c.tt: "นี่เป็นการส่งข้อความอย่างแน่นอน: นักเทศน์ของท่านไม่เป็นที่ต้อนรับที่นี่! แต่เราควรเตรียมพร้อมสำหรับการตอบโต้..."
 ep3_decisions_event.4025.desc_new: "บรรพบุรุษของข้า [sender.GetFirstName] ได้ลงทุนในการเผยแผ่ศาสนาแก่ [pagan.GetCulture.GetCollectiveNounNoTooltip] แต่โชคไม่ดีสำหรับ [sender.GetHerHim] ข้าคือผู้ที่จะเก็บเกี่ยวผลประโยชน์จากความพยายามของ [sender.GetHerHis] อันที่จริง มิชชันนารีของ [sender.GetHerHis] [evangelizer.GetFirstName] เพิ่งกลับมา"
 ep3_decisions_event.4025.desc_old: "หลายเดือนก่อน ข้าส่ง [evangelizer.GetFirstName] ที่ไว้ใจได้ของข้าไปนำความรู้เรื่องพระเจ้าไปยัง [pagan.GetCulture.GetCollectiveNounNoTooltip] ข้ายินดีอย่างยิ่งที่ได้ต้อนรับ [sender.GetHerHim] กลับมาในวันนี้ เพราะข้ารอคอยรายงานของ [evangelizer.GetHerHis] อย่างใจจดใจจ่อ"
 ep3_decisions_event.4025.desc_success: "\n\n"ข้านำข่าวดีมาแจ้ง ใต้ฝ่าละอองธุลีพระบาท! [pagan.GetTitledFirstName|U] กระตือรือร้นที่จะฟังข่าวประเสริฐ และเปลี่ยนมานับถือ [evangelizer.GetFaith.GetName] พร้อมกับผู้คนจำนวนมากของ [pagan.GetHerHis]""
 ep3_decisions_event.4025.desc_failure: "\n\n"ข้านำข่าวร้ายมาแจ้ง ใต้ฝ่าละอองธุลีพระบาท โชคไม่ดีที่ [pagan.GetTitledFirstName] ไม่ตอบสนองต่อพระวจนะของพระเจ้าเลย และส่งข้ากลับมามือเปล่า""
 ep3_decisions_event.4025.a: "ยอดเยี่ยม!"
 ep3_decisions_event.4025.b: "มันเป็นเพียงความพ่ายแพ้ชั่วคราวเท่านั้น"
 ep3_decisions_event.4026.desc: "ข่าวร้าย!\n\nข่าวมาจากดินแดนของ [pagan.GetCulture.GetCollectiveNounNoTooltip] และดูเหมือนว่ามิชชันนารีของข้า [evangelizer.GetFirstName] ถูกสังหารโดยคนเถื่อน [pagan.GetTitledFirstName] ผู้ ซึ่งไม่พอใจกับการปฏิเสธความพยายามในการเปลี่ยนศาสนาใดๆ แต่กลับไปไกลถึงขั้นกระทำการดูหมิ่นครั้งสุดท้ายและสังหาร [evangelizer.GetWomanMan] ของพระเจ้า!"
 ep3_decisions_event.4026.a: "ช่างน่าเดือดดาล!"
 valid_neighboring_and_across_water_top_liege: "เจ้าเหนือหัวสูงสุดที่เป็นเพื่อนบ้านใดๆ: $valid_for_conversion_tt$"
 valid_neighboring_and_across_water_realm_same_rank: "ผู้ปกครองเพื่อนบ้านใดๆ ที่มีตำแหน่งเท่ากับท่าน: $valid_for_conversion_tt$"
 valid_for_conversion_tt: "\n$EFFECT_LIST_BULLET$มี [faith|E] [GetReligionFamily('rf_pagan').GetName] [GetFaithDoctrine('unreformed_faith_doctrine').GetBaseName]\n$EFFECT_LIST_BULLET$ไม่ได้อยู่ใน [war|E]\n$EFFECT_LIST_BULLET$ไม่เคยปฏิเสธความพยายามในการเปลี่ยนศาสนาอย่างรุนแรงมาก่อน"
 negotiated_alliance_delay_tt: "พันธมิตรจะมีผลทันทีที่ [evangelizer.GetNameNoTooltip] กลับไปยังเจ้าเหนือหัวของ [evangelizer.GetHerHis]"
 ep3_decisions_event.4025.a.tt: "ท่านสร้าง [alliance|E] กับ [pagan.GetTitledFirstName] ที่เพิ่งเปลี่ยนศาสนา"
