 ep3_decisions_event.7000.desc: "เมื่อก้าวออกจากค่ายพัก ข้าสำรวจ [forage_province.Custom('TerrainTypeProvince')] โดยรอบ มองหาสัญญาณของสัตว์ป่าหรืออาหาร\n\n"
 ep3_decisions_event.7000.winter_forage: "[forage_province.GetName] อาจมีให้มากกว่านี้ในฤดูที่อากาศดี แต่ความหนาวเหน็บของฤดูหนาว ทำให้ [forage_province.Custom('GetProvinceGroundDesc')] แข็งตัว และปกคลุม [forage_province.Custom('GetTerrainTypePlural')] ด้วยน้ำค้างแข็ง เราคงหาอะไรที่นี่ได้ไม่มากนัก..."
 ep3_decisions_event.7000.difficult_forage: "การสำรวจ [forage_province.Custom('GetProvinceGroundDesc')] และ [forage_province.Custom('GetTerrainTypePlural')] ของ [forage_province.GetName] ให้ความหวังเพียงน้อยนิด สถานที่แห่งนี้ปราศจากสิ่งใดที่ควรค่าแก่กระเพาะของเรา ความหวังที่ดีที่สุดคือการล่าสัตว์"
 ep3_decisions_event.7000.difficult_hunt: "แม้จะมีเห็ด รากไม้ และผลเบอร์รี่มากมายให้พบได้รอบ [forage_province.GetName] แต่ที่นี่ไม่ใช่สวรรค์ของนักล่า แทบจะไม่มีกระต่ายป่าให้เห็นเลย"
 ep3_decisions_event.7000.good: "เราโชคดี: สภาพอากาศของ [forage_province.GetName] นั้นดีและอุดมสมบูรณ์ ทุกหนแห่งที่มองไป ของขวัญจากธรรมชาติหลั่งไหลไปทั่ว [forage_province.Custom('GetTerrainTypePlural')] เราจะทำได้ดีที่นี่"
 ep3_decisions_event.7000.fallback: "[forage_province.GetName] น่าจะดูแลเราได้ดี [forage_province.Custom('GetTerrainTypePlural')] เต็มไปด้วยชีวิตชีวา และเพียงแค่ใช้เวลาและความใส่ใจที่เหมาะสมก็จะหาอาหารได้ที่นี่"
 ep3_decisions_event.7000.a: "ข้าสามารถหาของกินให้พวกเราได้บ้าง"
 ep3_decisions_event.7000.a_foraging: "[SelectLocalization(ObjectsEqual(ROOT.Char.MakeScope.Var('has_golden_aplomb_perk').GetFlagName,'yes'),'ep3_decisions_event.7000.a_flavor_golden_aplomb','ep3_decisions_event.7000.a_flavor')]"
 ep3_decisions_event.7000.a_flavor: "#medium การหาอาหารได้รับผลกระทบจาก [terrain|E] และ [winter|E]\n#flavor มีประสิทธิภาพมากใน:#!\n   $EFFECT_LIST_BULLET$พื้นที่เกษตร, ป่าไม้, เนินเขา, ที่ราบ, โอเอซิส, ที่ราบน้ำท่วมถึง\n#flavor มีประสิทธิภาพปานกลางใน:#!\n   $EFFECT_LIST_BULLET$พื้นที่แห้งแล้ง, ภูเขา, ป่าดงดิบ, พื้นที่ชุ่มน้ำ, ทุ่งหญ้าสเตปป์\n#flavor ไม่มีประสิทธิภาพใน:#!\n   $EFFECT_LIST_BULLET$ทะเลทราย, ภูเขาทะเลทราย, ไทกา#!"
 ep3_decisions_event.7000.a_flavor_golden_aplomb: "#medium การหาอาหารได้รับผลกระทบจาก [terrain|E] และ [winter|E]\n#flavor มีประสิทธิภาพมากใน:#!\n   $EFFECT_LIST_BULLET$พื้นที่เกษตร, ป่าไม้, เนินเขา, ที่ราบ, โอเอซิส,\n   $EFFECT_LIST_BULLET$ที่ราบน้ำท่วมถึง, พื้นที่แห้งแล้ง, ภูเขา, ป่าดงดิบ, พื้นที่ชุ่มน้ำ, ทุ่งหญ้าสเตปป์ (ขอบคุณ [GetPerk('golden_aplomb_perk').GetName(GetPlayer)] [perk|e])\n#flavor ไม่มีประสิทธิภาพใน:#!\n   $EFFECT_LIST_BULLET$ทะเลทราย, ภูเขาทะเลทราย, ไทกา#!"
 ep3_decisions_event.7000.b_trapping: "[SelectLocalization(ObjectsEqual(ROOT.Char.MakeScope.Var('has_golden_aplomb_perk').GetFlagName,'yes'),'ep3_decisions_event.7000.a_flavor_golden_aplomb','ep3_decisions_event.7000.a_flavor')]"
 ep3_decisions_event.7000.b_flavor: "#medium การวางกับดักได้รับผลกระทบจาก [terrain|E]\n#flavor มีประสิทธิภาพมากใน:#!\n   $EFFECT_LIST_BULLET$ป่าดงดิบ, ป่าไม้, เนินเขา, ที่ราบ, โอเอซิส, พื้นที่แห้งแล้ง\n#flavor มีประสิทธิภาพปานกลางใน:#!\n   $EFFECT_LIST_BULLET$ทะเลทราย, ภูเขาทะเลทราย, ภูเขา, ไทกา, ทุ่งหญ้าสเตปป์\n#flavor ไม่มีประสิทธิภาพใน:#!\n   $EFFECT_LIST_BULLET$พื้นที่เกษตร, ที่ราบน้ำท่วมถึง, พื้นที่ชุ่มน้ำ#!"
 ep3_decisions_event.7000.b_flavor_golden_aplomb: "#medium การวางกับดักได้รับผลกระทบจาก [terrain|E]\n#flavor มีประสิทธิภาพมากใน:#!\n$EFFECT_LIST_BULLET$ป่าดงดิบ, ป่าไม้, เนินเขา, ที่ราบ, โอเอซิส, พื้นที่แห้งแล้ง, ทะเลทราย, ภูเขาทะเลทราย, ภูเขา, ไทกา, ทุ่งหญ้าสเตปป์ (ขอบคุณ [GetPerk('golden_aplomb_perk').GetName(GetPlayer)] [perk|e])\n#flavor ไม่มีประสิทธิภาพใน:#!\n   $EFFECT_LIST_BULLET$พื้นที่เกษตร, ที่ราบน้ำท่วมถึง, พื้นที่ชุ่มน้ำ#!"
