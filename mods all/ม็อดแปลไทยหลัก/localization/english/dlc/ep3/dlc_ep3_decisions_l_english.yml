 ep3_decisions_event.5001.t: "$knight_culture_player_no_tooltip$ แห่ง [ROOT.Char.CustomFixedRandom('GetKnightErrantAnimal')|U]"
 ep3_decisions_event.5001.desc.spouse: ""ผู้สูงศักดิ์ที่สุดในหมู่ [ROOT.Char.GetHerHis]," เสียงของ [adoring_fan.GetFirstNamePossessiveNoTooltip] ที่รักของข้าตามมาด้วยจุมพิตเบา ๆ บนไหล่ของข้า "ข้าตามหาท่านอยู่ทุกหนแห่ง"\n\n"พวกเขากำลังเล่าเรื่องไร้สาระเกี่ยวกับท่านในค่าย," [adoring_fan.GetSheHe] เอนตัวกระซิบ,"
 ep3_decisions_event.5001.desc.intro: ""ผู้สูงศักดิ์ที่สุดในหมู่ [ROOT.Char.GetHerHis]," เสียงของ [adoring_fan.GetFirstNamePossessiveNoTooltip] ทำให้ข้าตกใจ "ข้าตามหาท่านอยู่ทุกหนแห่ง"\n\n"พวกเขากำลังเล่าเรื่องไร้สาระเกี่ยวกับท่านในค่าย," [adoring_fan.GetSheHe] หัวเราะเบา ๆ,"
 ep3_decisions_event.5001.desc: ""พวกเขาบอกว่าท่านเคยข้ามสะพานที่ทำจากดาบ ว่าท่านเข้าไปในป่าต้องมนตร์ที่ ซึ่งท่านได้ช่วย [dummy_opposite_gender.GetWomanMan] ผู้งดงาม... ว่า [ROOT.Char.CustomFixedRandom('GetKnightErrantAnimal')] อันน่าอัศจรรย์ได้มอบเสื้อคลุมมหัศจรรย์ให้ท่าน"\n\n[adoring_fan.GetSheHe|U] ส่งสัญญาณให้คนรับใช้นำเกราะประดับมุกมา\n\n"ของขวัญ จากทุกคนที่ท่านได้ช่วยเหลือ""
 ep3_decisions_event.5001.a: ""และข้าก็ยังช่วยเหลือไม่เพียงพอ""
 ep3_decisions_event.5001.b: ""ข้าสามารถให้ความช่วยเหลือได้ #EMP หลากหลาย#! รูปแบบ""
