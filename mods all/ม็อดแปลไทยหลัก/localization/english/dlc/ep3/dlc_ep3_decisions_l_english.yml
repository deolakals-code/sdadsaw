 adopt_a_kennel_dog_tooltip: "รับเลี้ยงสุนัขเพื่อบรรเทา [stress|E]"
 adopt_a_kennel_dog_confirm: "ตกลง!"

 prepare_greek_fire_dromons_decision: "เตรียมโดรมอนไฟกรีก"
 prepare_greek_fire_dromons_decision_desc: "การจุดไฟเผาบอสพอรัสเคยช่วย [GetTitleByKey('b_constantinople').GetNameNoTier] ให้รอดพ้นจากความพินาศมาก่อน และอาจทำได้อีกครั้ง แหล่งน้ำที่กำบังเป็นหนึ่งในไม่กี่แห่งที่สามารถใช้ไฟเหลว ซึ่งเป็นสารลับของเรา ได้อย่างน่าเชื่อถือ\n\nจงสร้างเครื่องพ่นไฟขนาดใหญ่ และติดอาวุธให้กองเรือรักษาการณ์"
 prepare_greek_fire_dromons_decision_tooltip: "ทำให้ [GetTitleByKey('b_constantinople').GetNameNoTier] สามารถทำลายล้าง [armies|E] ที่ [embarked|E] อยู่ใกล้เคียงด้วยอาวุธที่คาดเดาไม่ได้และหวงแหนที่สุด"
 prepare_greek_fire_dromons_decision_confirm: "ลงมือได้ นักเล่นแร่แปรธาตุ — แต่จงระวัง!"

 prepare_greek_fire_dromons_constantinople_tt: "[capital|E] คือ [GetTitleByKey('c_byzantion').GetName]"
 prepare_greek_fire_dromons_capital_unoccupied_tt: "[capital|E] ไม่ได้ถูก [occupied|E]"
 prepare_greek_fire_dromons_no_modifier_tt: "[capital|E] ยังไม่มี [GetModifier('defensive_fire_dromons_modifier').GetNameWithTooltip]"
 defensive_fire_dromons_3_years_tooltip: "หากท่านทำ [scheme|E] [GetScheme('prepare_fire_dromons_scheme').GetTypeName] สำเร็จ [GetTitleByKey('c_byzantion').GetNameNoTier] จะได้รับ [GetModifier('defensive_fire_dromons_modifier').GetNameWithTooltip] เป็นเวลา #high 30 ปี#!"
 defensive_fire_dromons_success_tooltip: "เมื่อสำเร็จ [GetTitleByKey('c_byzantion').GetNameNoTier] จะได้รับ [GetModifier('defensive_fire_dromons_modifier').GetNameWithTooltip] เป็นเวลา #high 30 ปี#!"
 defensive_fire_dromons_custom_desc: "ตราบใดที่ [GetModifier('defensive_fire_dromons_modifier').GetNameWithTooltip] ยังคงอยู่ [armies|E] ของศัตรูที่ [embarked|E] อยู่ใกล้ [GetTitleByKey('c_byzantion').GetNameNoTier] อาจได้รับความเสียหาย"
 defensive_fire_dromons_buildings_desc: "#weak การสร้าง [building|E] [GetBuilding('common_tradeport_01').GetName] และ [GetBuilding('curtain_walls_01').GetName] ใน [GetTitleByKey('b_constantinople').GetNameNoTier] จะช่วยปรับปรุงผลกระทบนี้#!"

 defensive_fire_dromons_modifier: "โดรมอนไฟป้องกัน"
 defensive_fire_dromons_modifier_desc: "กองเรือที่ติดตั้งเครื่องพ่นไฟกรีกขนาดใหญ่ประจำการและบำรุงรักษาอยู่ในท่าเรือนี้"
 defensive_fire_dromons_modifier_custom_desc: "@alert_icon! #alert_trial [armies|E] ของศัตรูที่ [embarked|E] อยู่ใกล้ [GetTitleByKey('c_byzantion').GetNameNoTier] อาจได้รับความเสียหาย.#!"

 ep3_decisions_event.3100.t: "แนฟทา ปูนขาว... และความบ้าบิ่น"
 ep3_decisions_event.3100.desc: "ในฐานะ [ROOT.Char.GetTitleAsName] ข้าต้องเป็นเจ้าแห่งน่านน้ำบ้านเกิดอย่างไม่มีข้อโต้แย้ง นี่คือสิทธิ์ที่ได้รับจาก [ROOT.Char.GetFaith.HighGodName] และได้รับการปกป้องผ่านการล้อมและการโจมตีโดยการควบคุมเปลวไฟจาก [ROOT.Char.GetFaith.PositiveAfterLife] ของเรา ความเชี่ยวชาญในไฟเหลวของเรา\n\nหากคอนสแตนติโนเปิลจะได้รับการปกป้อง ท่าเรือของเราต้องมีมากกว่าเรือสินค้าที่ไร้ที่พึ่ง!\n\n[Glossary( 'โดรมอน', 'DROMONS_GLOSS' )] ที่รวดเร็วของข้าอยู่ที่ไหน? ช่างฝีมือที่ชาญฉลาด เช่น [Glossary( 'คัลลินิคอสแห่งเฮลิโอโปลิส', 'KALLINIKOS_GLOSS' )] อยู่ที่ไหน ผู้ที่จะหลอมเครื่องพ่นไฟอันยิ่งใหญ่เพื่อพ่นประกายไฟเหนือหัวเรือของข้า?"
 DROMONS_GLOSS: "เรือแกลลีย์ไบแซนไทน์ ขับเคลื่อนด้วยไม้พายและใบเรือ เหมาะอย่างยิ่งสำหรับการทำสงครามในทะเลเมดิเตอร์เรเนียน"
 KALLINIKOS_GLOSS: "สถาปนิกในศตวรรษที่ 7 #bold คัลลินิคอส#! ได้รับการยกย่องว่าเป็นผู้คิดค้นรูปแบบที่เหมาะสมของไฟกรีก"
 ep3_decisions_event.3100.a: "ข้าจะให้คอนสแตนติโนเปิลทำงาน"
 ep3_decisions_event.3100.b: "ชาวละตินยินดีสร้างเรือของเรา"
 ep3_decisions_event.3100.c: "สร้างกองเรือที่เสี่ยงจะเผาตัวเอง? ไม่"

 #Retake Eastern Provinces
 retake_eastern_provinces_decision: "สถาปนาพรมแดนธีโอโดเซียนขึ้นใหม่"
 retake_eastern_provinces_decision_desc: "เมื่อจักรพรรดิ [GetScriptedCharacterByHistoryID( '70534' ).GetFirstName] แบ่งจักรวรรดิโรมันออกเป็นสองส่วนการปกครอง ส่วนตะวันออกตกเป็นของพระโอรสองค์โต [GetScriptedCharacterByHistoryID( '70519' ).GetFirstName] เราคือผู้สืบทอดโดยตรงของพระองค์ อย่างไรก็ตาม พรมแดนของ [Glossary( 'พาร์ส', 'PARS_ORIENTIS_GLOSS' )] ของเราได้หดตัวลงอย่างมากตั้งแต่วันนั้น การที่บาซิลิอุสจะสถาปนาพรมแดนที่ [GetScriptedCharacterByHistoryID( '70534' ).GetFirstNameNoTooltip] ทิ้งไว้ให้เรา แต่เดิมขึ้นใหม่จะเป็นเหตุแห่งความรุ่งโรจน์อันยิ่งใหญ่"
 retake_eastern_provinces_decision_tooltip: "สถาปนาพรมแดนดั้งเดิมของโรมตะวันออกขึ้นใหม่"
 retake_eastern_provinces_decision_confirm: "ประกาศใช้พรมแดนใหม่อย่างเป็นทางการ"
 eastern_kingdoms_held_or_vassals_tt: "หากมีการสร้างตำแหน่ง [kingdom|E] ต่อไปนี้ ท่านต้องดำรงตำแหน่งนั้น หรือผู้ดำรงตำแหน่งต้องเป็น [vassals|E] ของท่าน: \n$EFFECT_LIST_BULLET$ [GetTitleByKey('k_bulgaria').GetName] \n$EFFECT_LIST_BULLET$ [GetTitleByKey('k_epirus').GetName] \n$EFFECT_LIST_BULLET$ [GetTitleByKey('k_hellas').GetName] \n$EFFECT_LIST_BULLET$ [GetTitleByKey('k_thessalonika').GetName] \n$EFFECT_LIST_BULLET$ [GetTitleByKey('k_krete').GetName] \n$EFFECT_LIST_BULLET$ [GetTitleByKey('k_cyprus').GetName] \n$EFFECT_LIST_BULLET$ [GetTitleByKey('k_nikaea').GetName] \n$EFFECT_LIST_BULLET$ [GetTitleByKey('k_anatolia').GetName] \n$EFFECT_LIST_BULLET$ [GetTitleByKey('k_pontus').GetName] \n$EFFECT_LIST_BULLET$ [GetTitleByKey('k_syria').GetName] \n$EFFECT_LIST_BULLET$ [GetTitleByKey('k_jerusalem').GetName] \n$EFFECT_LIST_BULLET$ [GetTitleByKey('k_egypt').GetName]"
 every_county_in_theodosian_region: "[GetTitleByKey('e_byzantium').GetName] กลายเป็นเจ้าเหนือหัว [de_jure|E] ของทุกตำแหน่ง [kingdom|E] ใน [GetGeographicalRegion('custom_theodosian_ere').GetName]"
 ep3_decisions_event.4000.t: "พรมแดนของธีโอโดซิอุส"
 ep3_decisions_event.4000.desc: "เป็นเวลาหลายศตวรรษที่โรมที่สอง — ไบแซนเทียมอันรุ่งโรจน์ของเรา — ได้ถอยร่น สูญเสียจังหวัดแล้วจังหวัดเล่า แต่ไม่ใช่อีกต่อไป!\n\nวันนี้เป็นวันเฉลิมฉลอง เพราะ [Glossary( 'พาร์ส โอเรียนติส', 'PARS_ORIENTIS_GLOSS' )] ได้กลับคืนสู่ความรุ่งโรจน์และขอบเขตเดิม เช่นเดียวกับเมื่อ [GetScriptedCharacterByHistoryID( '70534' ).GetFirstName] มหาราช มอบหมายให้แก่พระโอรสองค์แรก การปกครองของคอนสแตนติโนเปิลขยายจากโมเอเซียถึงอียิปต์ และจากไซเรไนกาถึงซีเรีย\n\nจักรวรรดิที่เป็นปึกแผ่นสำหรับ [ROOT.Char.GetTitleAsNameNoTooltip] ผู้มีชัย!"
 ep3_decisions_event.4000.a: "วันอันรุ่งโรจน์สำหรับชาวโรมันทุกหนแห่ง!"
 PARS_ORIENTIS_GLOSS: "#bold พาร์ส โอเรียนติส#! — "ส่วนตะวันออก" — เป็นชื่อภาษาละตินดั้งเดิมของจักรวรรดิโรมันตะวันออก ชื่อนี้หมายถึงเพียงการแบ่งเขตการปกครอง โดยไม่มีการแบ่งแยกทางการเมืองหรืออย่างเป็นทางการ"
 #Pandidakterion
 refound_pandidakterion_decision: "ก่อตั้งปันดิดักเทริออนขึ้นใหม่"
 refound_pandidakterion_decision_desc: "จักรพรรดิ [GetScriptedCharacterByHistoryID( '70533' ).GetFirstName] ก่อตั้ง [Glossary( 'ปันดิดักเทริออน', 'PANDIDAKTERION_GLOSS' )] ในปี ค.ศ. 425 ซึ่งเป็นหนึ่งในศูนย์การศึกษาที่ใหญ่ที่สุดในโลก หลายศตวรรษผ่านไปตั้งแต่นั้น และเวลาได้เปลี่ยนไป หากเราต้องการให้ปันดิดักเทริออนยังคงเป็นแนวหน้าของความรู้ของมนุษย์ สถาบันจำเป็นต้องได้รับการปรับปรุงและจัดระเบียบใหม่"
 refound_pandidakterion_decision_tooltip: "ขยายและจัดระเบียบมหาวิทยาลัยคอนสแตนติโนเปิลโบราณใหม่"
 refound_pandidakterion_decision_confirm: "เริ่มดำเนินการ"
 chancellor_domestic_affairs_opinion_pandidakterion_bonus_desc: "\n$TAB$$pandidakterion_university_modifier$: #P +[SCOPE.ScriptValue('chancellor_domestic_affairs_opinion_pandidakterion_bonus')|2]#!"
 task_organize_levies_pandidakterion_bonus_desc: "\n$TAB$$pandidakterion_university_modifier$: #P +[SCOPE.ScriptValue('marshal_organize_levies_pandidakterion_bonus')|1]%#!"
 task_organize_levies_maintenance_pandidakterion_bonus_desc: "\n$TAB$$pandidakterion_university_modifier$: #P -[SCOPE.ScriptValue('task_organize_levies_maintenance_pandidakterion_bonus')|1]%#!"
 PANDIDAKTERION_GLOSS: "#bold ปันดิดักเทริออน#! หมายถึง "สถานที่สำหรับการสอนทั้งหมด" ก่อตั้งขึ้นในปี ค.ศ. 425 โดยธีโอโดซิอุสที่ 2 และมี 31 ตำแหน่งศาสตราจารย์ ครึ่งหนึ่งสอนเป็นภาษาละตินและอีกครึ่งหนึ่งเป็นภาษากรีก ได้รับการก่อตั้งขึ้นใหม่โดยคอนสแตนตินุสที่ 9 ในปี ค.ศ. 1046 และดำรงอยู่ จนกระทั่งการพิชิตของออตโตมันในปี ค.ศ. 1453"
 pandidakterion_tt: "ท่านเป็นเจ้าของ [GetTitleByKey('c_byzantion').GetName]"
 #Crusades
 ask_western_help_decision: "ขอการสนับสนุน"
 ask_western_help_decision_desc: "ไบแซนเทียมเป็นปราการตะวันออกสุดของศาสนาคริสต์มาโดยตลอด แต่สงครามปัจจุบันกับศัตรูของศรัทธาที่แท้จริงกำลังบั่นทอนกำลังและทรัพยากรของเรา แม้ว่าความสัมพันธ์ของเรากับสาขาอื่น ๆ ของศาสนาคริสต์จะไม่ราบรื่นนัก แต่ก็อาจถึงเวลาที่จะกลืนความภาคภูมิใจและขอความช่วยเหลือจากพี่น้องในพระคริสต์ของเรา"
 ask_western_help_decision_tooltip: "ติดต่อพี่น้องคริสเตียนต่างศรัทธาของเราและขอการสนับสนุนจากพวกเขา"
 ask_western_help_decision_confirm: "ส่งจดหมาย"
 ep3_decisions_event.4010.t: "[caller.Custom2('AppropriateGreeting', called )]"
 ep3_decisions_event.4010.desc: "[called.Custom('SisterBrother')|U] ในพระคริสต์ ตำแหน่งของเราในฐานะปราการตะวันออกของศาสนาคริสต์กำลังตกอยู่ในอันตราย เนื่องจากสงครามปัจจุบันกับผู้ไม่ศรัทธาได้สร้างภาระให้กับทรัพยากรของเรา\n\nโปรดช่วยเราขับไล่ศัตรูร่วมกัน"
 ep3_decisions_event.4010.a: "เราจะช่วยท่าน — หากมีสิ่งจูงใจที่เหมาะสม!"
 ep3_decisions_event.4010.b: "เราต้องส่งเรื่องนี้ไปยังอำนาจของ [ROOT.Char.GetFaith.GetReligiousHeadTitle.GetNameNoTooltip]"
 ep3_decisions_event.4010.b.tt_2: "มีเพียง [ROOT.Char.GetFaith.GetReligiousHead.GetSheHe] เท่านั้นที่สามารถตัดสินใจได้ว่าศาสนาคริสต์จะให้ความช่วยเหลือประเภทใดแก่พี่น้องที่หลงผิดได้"
 ep3_decisions_event.4010.b.tt: "[ROOT.Char.GetTitledFirstNameNoTooltip] ทูลถามประมุขแห่งศรัทธาของ [ROOT.Char.GetHerHis]"
 ep3_decisions_event.4010.c: "ข้าขออภัย เราไม่สามารถช่วยท่านได้"
 ep3_decisions_event.4010.c.tt: "[called.GetTitledFirstNameNoTooltip|U] ปฏิเสธที่จะช่วย"
 ep3_decisions_event.4011.b: "หากท่านให้คำมั่นว่าจะสนับสนุนพวกเขา กองทัพแห่งพระคริสต์จะเดินทัพไปกับท่าน!"
 ep3_decisions_event.4011.c: "เราไม่สามารถช่วยผู้ศรัทธาที่หลงผิดได้"
 ep3_decisions_event.4012.t: "[sponsor.Custom2('AppropriateGreeting', called )]"
 ep3_decisions_event.4012.desc: "ข้าได้รับคำร้องขอความช่วยเหลือจาก [caller.GetTitledFirstName] แม้จะหลงผิดในความเชื่อของพวกเขา แต่ผู้คนของ [caller.GetHerHis] ยังคงเป็นพี่น้องในพระคริสต์ของเรา และได้ทำหน้าที่เป็นปราการตะวันออกของศาสนาคริสต์มานานแล้ว\n\nมีทางใดที่เราจะยื่นมือช่วยเหลือพวกเขาได้บ้าง?"
 ep3_decisions_event.4012.a: "เราจะช่วย แต่ไม่ใช่ฟรี"
 ep3_decisions_event.4012.a.tt: "[pope.GetTitledFirstNameNoTooltip] จะส่งความช่วยเหลือ"
 ep3_decisions_event.4012.b: "หากพวกเขาสัญญาว่าจะสนับสนุน กองทัพแห่งพระคริสต์จะเดินทัพไปกับพวกเขา!"
 ep3_decisions_event.4012.b.tt: "[pope.GetTitledFirstNameNoTooltip] อาจจะเรียกให้เกิด [pope.GetFaith.GHWName]!"
 ep3_decisions_event.4013.t: "[called.Custom2('AppropriateGreeting', caller )]"
 ep3_decisions_event.4013.desc: "เราได้ยินคำวิงวอนจากพี่น้องชายหญิงในพระคริสต์และปรารถนาที่จะช่วยเหลือ หากท่านให้คำมั่นในการสนับสนุน กองทัพของศาสนาคริสต์จะรวมเป็นหนึ่งเพื่อปกป้องท่านใน[pope.GetFaith.GHWName]อันศักดิ์สิทธิ์!"
 ep3_decisions_event.4013.a: "ข้ายอมรับข้อเสนอของท่าน"
 ep3_decisions_event.4013.a.tt: "ท่านให้คำมั่นว่าจะส่ง @gold_icon![caller.MakeScope.ScriptValue('massive_gold_value')|V0] เข้าคลังสงคราม [pope.GetFaith.GHWName]"
 ep3_decisions_event.4013.b: "นี่ไม่ใช่สิ่งที่ข้าขอ!"
