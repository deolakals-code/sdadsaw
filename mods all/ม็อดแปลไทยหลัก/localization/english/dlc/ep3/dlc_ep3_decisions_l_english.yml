 ep3_decisions_event.4050.desc.intro: "ความสงบของ [ROOT.Char.GetFaith.HouseOfWorship] ถูกรบกวนโดยฝูงชนข้าราชบริพาร เจ้าเมือง และชาวนา ทั้งหมดรวมตัวกันที่นี่เพื่อเฉลิมฉลอง... #EMP ข้า!#!\n\n"
