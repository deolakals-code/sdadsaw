 ep3_decisions_event.4070.t: "$major_decisions.0200.t$"
 ep3_decisions_event.4070.desc: "บางครั้ง การกลับไปสู่วิถีที่เคยทดลองและเป็นจริงแล้วก็ดีกว่า\n\nในขณะที่แนวทางการบริหารเพียงอย่างเดียวเป็นอุปสรรคต่อ [actor.GetPrimaryTitle.GetNameNoTierNoTooltip|l] วิถีชีวิตแบบเก่าก็มีประโยชน์ที่ปฏิเสธไม่ได้และโครงสร้างแบบดั้งเดิมที่จะช่วยให้เราก้าวไปสู่จุดสูงสุดใหม่ได้"
 ep3_decisions_event.4070.a: "เราต้องปรับตัวให้เข้ากับสถานการณ์ที่เปลี่ยนแปลงไป"

