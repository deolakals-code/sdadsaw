 ep3_decisions_event.4014.desc: "ด้วยใจที่สำนึกในบุญคุณ เรายอมรับข้อเสนอความช่วยเหลือของท่านและรอคอยการมาถึงของกองทัพสนับสนุน\n\nโปรดรีบหน่อย"
