 ep3_decisions_event.4050.desc.outro: "\n\n"วันนี้เราขอบคุณ [ROOT.Char.GetFaith.HighGodName] ที่มีผู้พิทักษ์ที่ใจดี เช่นนี้คอยดูแลเรา" [head_of_faith.GetSheHe] กล่าวต่อฝูงชน "ขอให้รัชสมัยของ [ROOT.Char.GetHerHis] ยืนยาวและเจริญรุ่งเรือง!""
