 # Establish Silk Production
 establish_silk_production_decision: "ก่อตั้งการผลิตผ้าไหม"
 establish_silk_production_decision_desc.boilerplate: "นับตั้งแต่คนโบราณลักลอบนำหนอนไหมตัวแรกจากดินแดนที่ห่างไกลที่สุดในตะวันออกไปยังคอนสแตนติโนเปิล การผลิตและการขายผ้าไหมเป็นเอกสิทธิ์ของจักรวรรดิเสมอมา"
 establish_silk_production_decision_desc: "$establish_silk_production_decision_desc.boilerplate$\n\nมันจะเป็นการลงทุนที่มีราคาแพง แต่เราสามารถซื้อใบอนุญาตจากจักรวรรดิเพื่อได้รับอนุญาตให้ก่อตั้งการผลิตผ้าไหมของเราเองในคฤหาสน์ของตระกูลเราได้"
 establish_silk_production_decision_desc.emperor: "$establish_silk_production_decision_desc.boilerplate$\n\nในฐานะประมุขของราชวงศ์ ข้าสามารถมอบสิทธิพิเศษในการผลิตให้กับตนเองและผู้สืบทอดของข้าได้เพียงแค่โบกมือ"
 establish_silk_production_decision_tooltip: "ซื้อใบอนุญาตจากจักรวรรดิเพื่อปลดล็อกอาคารผลิตผ้าไหมใน [estate|E] ของท่าน"
 establish_silk_production_decision_confirm: "ส่งการชำระเงิน"
