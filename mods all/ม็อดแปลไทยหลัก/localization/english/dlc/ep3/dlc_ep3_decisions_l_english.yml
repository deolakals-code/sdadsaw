 ep3_decisions_event.2001.a: "จัดพิธีทันที"
 ep3_decisions_event.2001.a.tt.court: "ท่านต้อนรับ [confirmation_vassal.GetTitledFirstName] ใน [royal_court|E] ของท่าน"
