 unlocked_estate_silk_buildings_t: "ปลดล็อก [GetDomicileBuilding('silk_01').GetName] แล้ว"
 has_unlocked_estate_silk: "ท่านจำเป็นต้องปลดล็อก [GetModifier('ep3_unlocked_silk').GetNameWithTooltip] ผ่าน [decision|E] [GetDecisionWithKey('establish_silk_production_decision').GetName] หรือ [culture|E] ของท่านต้องมี [innovation|E] #V $innovation_sericulture$#!"
 commission_silk_regalia_decision: "สั่งทำเครื่องยศผ้าไหม"
 commission_silk_regalia_decision_desc: "ตระกูลของเราเป็นหนึ่งในไม่กี่รายที่ได้รับอนุญาตจากจักรวรรดิให้ผลิตและจำหน่ายผ้าไหมไบแซนไทน์ที่ดีที่สุด กิจกรรมของเรานำมา ซึ่งทองคำและอิทธิพล — และข้อได้เปรียบ #EMP เพิ่มเติม#! อีกเล็กน้อย — แต่เราไม่ค่อยได้เพลิดเพลินกับผลประโยชน์โดยตรง ข้าคิดว่าข้าสมควรได้รับบางสิ่งที่ #EMP พิเศษสุด#! สำหรับตัวเองสักครั้ง!"
 commission_silk_regalia_decision_tooltip: "สั่งทำ [artifact|E] ที่ทำจากผ้าไหมสำหรับตัวท่านเอง"
 commission_silk_regalia_decision_confirm: "เรียกหาช่างฝีมือ"
 commission_silk_regalia_decision_effect: "ช่างฝีมือจากคฤหาสน์ของท่านจะผลิต [artifact|E] เครื่องยศผ้าไหมให้ท่าน"
 ep3_decisions_event.5030.t: "เครื่องยศผ้าไหมเสร็จสมบูรณ์"
 ep3_decisions_event.5030.desc: "[local_artisan.GetFirstName] สุดยอดช่างฝีมือประจำโรงเลี้ยงไหมของตระกูลข้า ได้นำเสนอชุดคลุมผ้าไหมคุณภาพดีที่สุดแก่ข้าด้วยท่วงท่าอันสง่างาม\n\n"ของที่ท่านสั่งทำเสร็จแล้ว [ROOT.Char.Custom('FormOfAddressForLiege')] ข้าหวังว่าท่านจะพอใจในมาตรฐานของมัน"\n\nผ้าไหมไหลลื่นดั่งสายน้ำผ่านระหว่างนิ้วมือข้า ในขณะที่ดวงตาของข้าพยายามจับจ้องทุกรายละเอียดเล็กน้อยของการตก แต่ง"
 ep3_decisions_event.5030.a: "งดงามเหลือเกิน!"
 silk_regalia_name: "เครื่องยศผ้าไหมชั้นดี"
 silk_regalia_description: "ชุดเสื้อคลุมผ้าไหมคู่ควรแก่จักรพรรดิ สร้างขึ้นโดยช่างฝีมือที่ดีที่สุดบางส่วนของสไตล์ไบแซนไทน์ในคฤหาสน์ของตระกูล [owner.GetHouse.GetName]\n\nสีสันสดใส และด้ายทองคำถูกทออย่างสง่างามตลอดทั้งผืนเพื่อ ทำให้ลวดลายอันซับซ้อนโดดเด่นขึ้น"

