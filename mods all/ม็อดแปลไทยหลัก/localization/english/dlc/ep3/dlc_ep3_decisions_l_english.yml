 ep3_laamp_decision_event.1201.t: "เสียงเห่าสุดท้ายของ [ROOT.Char.GetPrimaryTitle.GetDefinitiveNameNoTooltip|l]"
 ep3_laamp_decision_event.1201.desc.intro: "มันเป็นเรื่องน่าสยดสยอง ที่จะฆ่าสัตว์ที่ท่านไม่ได้เลี้ยงไว้เพื่อเป็นอาหาร โดยเฉพาะอย่างยิ่งสุนัขล่าเนื้อ สหายที่ซื่อสัตย์ที่สุดที่ [ROOT.Char.GetWomanMan] ใด ๆ น่าจะรู้จัก\n\n"
 ep3_laamp_decision_event.1201.desc.eaten.kennels.have_dog: "สุนัขเห่าหอนเหมือนปีศาจขณะถูกนำไปโรงฆ่า ได้กลิ่นเลือด ความตาย และร่างที่กองซ้อนกันของเพื่อนร่วมฝูง ข้าจะดูแล [ROOT.Char.Custom('DogStoryName')] ด้วยตัวเอง ข้าเป็นหนี้ [ROOT.Char.Custom('DogStoryHerHim')] มากขนาดนั้น"
 ep3_laamp_decision_event.1201.desc.eaten.kennels.no_dog: "สุนัขเห่าหอนเหมือนปีศาจขณะถูกนำไปโรงฆ่า ได้กลิ่นเลือด ความตาย และร่างที่กองซ้อนกันของเพื่อนร่วมฝูง ข้ารู้จักบางตัวด้วยชื่อ แม้ว่าอย่างน้อยข้าก็ไม่นับตัวเองเป็น [ROOT.Char.Custom('MistressMaster')] ของตัวใดเลย"
 ep3_laamp_decision_event.1201.desc.eaten.one.have_dog: "มีเพียง [ROOT.Char.Custom('DogStoryName')] ที่รักของข้าอยู่ในมือ มีเพียงคอเดียวให้เชือด ถึงกระนั้น [ROOT.Char.Custom('DogStorySheHe')] ดูเหมือนจะสัมผัสได้ถึงบางสิ่งที่ผิดปกติ บางสิ่งที่ #EMP ผิดแปลก#! เกี่ยวกับข้า"
 ep3_laamp_decision_event.1201.desc.eaten.one.no_dog: "มีสุนัขเพียงตัวเดียวในค่าย มันไม่ใช่การสังหารหมู่มากนัก แต่สัตว์ร้ายดูเหมือนจะเข้าใจว่าจุดจบของมันใกล้เข้ามาแล้ว"
 ep3_laamp_decision_event.1201.desc.eaten.some.have_dog: "มีสุนัขให้เราน้อยเหลือเกิน ไม่ต้องสงสัยเลยว่า [ROOT.Char.Custom('DogStoryName')] ของข้าเองต้องเข้าร่วมการสังหารด้วย ตัวแรกถูกเชือดอย่างหมดจด แต่ตัวที่เหลือในไม่ช้าก็ได้กลิ่นการฆ่าและเริ่มคร่ำครวญและร้องคราง"
 ep3_laamp_decision_event.1201.desc.eaten.some.no_dog: "มีสุนัขให้เราน้อยเหลือเกิน เราต้องสิ้นหวังกับอาหารมากแน่ ๆ ตัวแรกถูกเชือดอย่างหมดจด แต่ตัวที่เหลือในไม่ช้าก็ได้กลิ่นการฆ่าและเริ่มคร่ำครวญและร้องคราง"
 ep3_laamp_decision_event.1201.desc.eaten.many.have_dog: "เราโชคดีที่มีสุนัขมากมาย รวมถึง [ROOT.Char.Custom('DogStoryName')] ของข้าเอง แม้ว่าพวกมันจะดูตื่นตระหนก — ราวกับว่าพวกมันสงสัยว่าอะไรรออยู่ หลังจากตัวแรกถูกนำไปตาย พวกมันก็เริ่มคร่ำครวญ"
 ep3_laamp_decision_event.1201.desc.eaten.many.no_dog: "เราโชคดีที่มีสุนัขมากมาย อาหารที่มีศักยภาพมากมายที่จะหล่อเลี้ยงเรา แม้ว่าพวกมันจะดูตื่นตระหนก — ราวกับว่าพวกมันสงสัยว่าอะไรรออยู่ หลังจากตัวแรกถูกนำไปตาย พวกมันก็เริ่มคร่ำครวญ"
 ep3_laamp_decision_event.1201.desc.outro: "\n\nผู้ติดตามของข้าหลายคนมองข้าด้วยความรังเกียจ แต่คนอื่น ๆ ดูเหมือนจะเข้าใจว่านี่เป็นสิ่งจำเป็น\n\nอย่างน้อยมันก็จะเงียบในไม่ช้า"

 ep3_laamp_decision_event.1201.tt.dog_lost: "สุนัข [THIS.Char.GetTitledFirstNameNicknamedPossessive], [THIS.Char.Custom('DogStoryName')], ถูกเชือด"
 ep3_laamp_decision_event.1201.tt.your_dog_lost: "สุนัขของท่าน, [THIS.Char.Custom('DogStoryName')], ถูกเชือด"
 ep3_laamp_decision_event.1201.tt.followers_with_dogs: "ทุก [follower|E] ที่มีสุนัข"
 ep3_laamp_decision_event.1201.a.own_dog: "ลาก่อน เด็กดี"
 ep3_laamp_decision_event.1201.a: "เสียงเห่าหอน เสียงคร่ำครวญ #EMP อันโหยหวน#!..."
 ep3_laamp_decision_event.1201.b.own_dog: "เอ๊ะ ข้าหาตัวใหม่ได้"
 ep3_laamp_decision_event.1201.b: "เนื้อก็คือเนื้อ"

 ep3_laamp_decision_event.1202.t: "ค่ายที่ไม่มีแมว"
 ep3_laamp_decision_event.1202.desc.intro: "การฆ่าแมวไม่ใช่เรื่องยาก และก็ไม่ถือเป็นการกีฬา แต่อย่างใด\n\n"
 ep3_laamp_decision_event.1202.desc.eaten.one.have_cat: "ข้า... ไม่ได้อยากให้เรื่องกับ [ROOT.Char.Custom('CatStoryName')] จบลงแบบนี้จริง ๆ แต่เราต้องการอาหารทุกเศษเสี้ยวที่เราสามารถรวบรวมได้\n\nแม้ว่าจะเป็น [ROOT.Char.Custom('CatStoryGirlBoy')] ตัวน้อยที่ซื่อสัตย์และไว้วางใจของข้าก็ตาม"
 ep3_laamp_decision_event.1202.desc.eaten.one.no_cat: "โดยเฉพาะอย่างยิ่งเมื่อมีแมวเพียงตัวเดียวให้พบในค่ายทั้งหมด แต่เรา #EMP ต้องการ#! อาหาร #EMP อาหารใด ๆ ก็ตาม#!"
 ep3_laamp_decision_event.1202.desc.eaten.some.have_cat: "มีไม่มากนักที่เราจะจับได้ และเมื่อเรารวบรวมพวกมันได้แล้ว สิ่งมีชีวิตที่น่าสงสารเหล่านี้ส่วนใหญ่ก็ป้องกันตัวไม่ได้ ในที่กักขัง พวกมันทำได้เพียงขู่ฟ่อด้วยความรำคาญหรือส่งเสียงครางอย่างสับสน"
 ep3_laamp_decision_event.1202.desc.eaten.some.no_cat: "$ep3_laamp_decision_event.1202.desc.eaten.some.have_cat$\n\nแม้ แต่ [ROOT.Char.Custom('CatStoryName')]"
 ep3_laamp_decision_event.1202.desc.eaten.many.have_cat: "ท่านคงคิดว่าส่วนใหญ่จะหนีเราไปได้ แต่ไม่เลย เมื่อสัญชาตญาณอันตรายของพวกมันควรจะเหนือกว่า แมวส่วนใหญ่ [ROOT.Char.GetPrimaryTitle.GetDefinitiveNamePossessive] กลับไว้วางใจเจ้านายของมัน\n\nแม้ แต่ [ROOT.Char.Custom('CatStoryName')]"
 ep3_laamp_decision_event.1202.desc.eaten.many.no_cat: "ท่านคงคิดว่าส่วนใหญ่จะหนีเราไปได้ แต่ไม่เลย เมื่อสัญชาตญาณอันตรายของพวกมันควรจะเหนือกว่า แมวส่วนใหญ่ [ROOT.Char.GetPrimaryTitle.GetDefinitiveNamePossessive] กลับไว้วางใจเจ้านายของมัน\n\nความผิดพลาดอันโง่เขลา"
 ep3_laamp_decision_event.1202.desc.outro: "\n\nเมื่อถูกจับและขังกรงแล้ว พวกมันก็ถูกกำจัดได้ง่าย แม้ว่าผู้ติดตามของข้าจะไม่มีใครดูภูมิใจในตัวเองเป็นพิเศษ — หรือในตัวข้า — สำหรับการกระทำนั้นก็ตาม"
 ep3_laamp_decision_event.1202.tt.cat_lost: "แมว [THIS.Char.GetTitledFirstNameNicknamedPossessive], [THIS.Char.Custom('CatStoryName')], ถูกเชือด"
 ep3_laamp_decision_event.1202.tt.your_cat_lost: "แมวของท่าน, [THIS.Char.Custom('CatStoryName')], ถูกเชือด"
 ep3_laamp_decision_event.1201.tt.followers_with_cats: "ทุก [follower|E] ที่มีแมว"
 ep3_laamp_decision_event.1202.a.own_cat: "มิตรภาพอันสง่างามของเราสิ้นสุดลงแล้ว [ROOT.Char.Custom('CatStoryName')]"
 ep3_laamp_decision_event.1202.a: "เราไม่มีทางเลือกอื่น"
 ep3_laamp_decision_event.1202.b.own_cat: "เอ๊ะ มันก็แค่แมว"
 ep3_laamp_decision_event.1202.b: "ใช่ ใช่ สับ สับ เฮะ"

 ep3_laamp_decision_event.1203.t: "เนื้อม้าสำหรับผู้หิวโหย"
 ep3_laamp_decision_event.1203.desc.intro: "เนื้อม้ามีไขมันน้อยและมีปริมาณมาก ไม่ใช่เรื่องแปลกสำหรับอาหารหลายชนิด — #EMP หาก#! ท่านสามารถจ่ายค่าบริโภคได้\n\nเมื่อพิจารณาถึงสถานการณ์อันเลวร้ายที่เราเผชิญอยู่ [ROOT.Char.GetPrimaryTitle.GetDefinitiveName] แทบจะไม่สามารถหลีกเลี่ยงการคัดเลือกฝูงได้"
 ep3_laamp_decision_event.1203.desc.eaten.both: "เชือดไม่เพียง แต่ม้าสำรองของเราเท่านั้น แต่ยัง รวมถึง [ROOT.Char.Custom('WarhorseStoryName')] ของข้าเองด้วย"
 ep3_laamp_decision_event.1203.desc.eaten.own_horse: "แม้ว่าม้าตัวเดียวที่เราสามารถสำรองไว้ได้คือ [ROOT.Char.Custom('WarhorseStoryName')] ของข้าเอง"
 ep3_laamp_decision_event.1203.desc.eaten.reserve_steeds: "เชือดม้าสำรองของเราเป็นจำนวนมาก แม้ว่าพวกมันจะสับสนและตื่นตระหนกก็ตาม"
 ep3_laamp_decision_event.1203.desc.outro: "\n\nความอุดมสมบูรณ์นี้มาพร้อมกับต้นทุนความเร็วของเราบางส่วน แต่มันควรจะซื้อเวลาให้เราหาแหล่งยังชีพที่น่าเชื่อถือกว่านี้ได้\n\nอย่างน้อย ข้าก็หวัง เช่นนั้น"
 ep3_laamp_decision_event.1203.a.many_steeds: "แม้ในความตาย พวกมันก็ยังพาเราไปข้างหน้า"
 ep3_laamp_decision_event.1203.a.single_steed: "แม้ในความตาย [ROOT.Char.Custom('HorseStorySheHe')] ก็ยังพาข้าไปข้างหน้า"
 ep3_laamp_decision_event.1203.b: "จริง ๆ แล้ว เราควรกินพวกมัน #EMP มากกว่า#! นี้ มันอร่อยมาก"

 ep3_laamp_decision_event.1204.t: "สุสานช้าง"
 ep3_laamp_decision_event.1204.desc: "หลังจากสองสามตัวแรก ฝูงดูเหมือนจะรู้ว่ามีบางอย่างผิดปกติ\n\nต้องใช้ความพยายามอย่างมากในการควบคุมพวกมันและเริ่มคัดเลือกจริง ๆ — โดยธรรมชาติแล้วจะมุ่งเน้นไปที่ตัวแก่ ตัวป่วย ตัวอ่อนแอ และตัวเล็ก\n\nทีละตัว เรานำกองหนุนช้างของเราไปสู่ดาบก่อน จากนั้นจึงไปสู่มีดแล่เนื้อของคนขายเนื้อ\n\nงานที่น่าสยดสยองและนองเลือด ทำให้ยากขึ้นไปอีกด้วยเสียงกรีดร้องที่ตื่นตระหนก เสียงครางในลำคอ และเสียงแผดร้องด้วยความหวาดกลัว\n\nแต่มันคือพวกมันหรือเรา"
 ep3_laamp_decision_event.1204.a: "ความตายของพวกมันคือความรอดของเรา"
 ep3_laamp_decision_event.1204.b: "โดย [ROOT.Char.GetFaith.HealthGodName] ขนาดของ #EMP สเต็ก#! เหล่านั้น"

 ep3_laamp_decision_event.1205.t: "$ep3_laamp_decision_event.1204.t$: ผลกระทบ"
 ep3_laamp_decision_event.1205.desc: "เป็นเวลาหนึ่งปีแล้วนับตั้งแต่ความสิ้นหวังของการเดินทางของเรา #EMP บังคับ#! ให้เราใช้... มาตรการที่รุนแรง\n\nแม้ว่าพวกมันอาจเป็นสิ่งมีชีวิตที่ฉลาด แต่ช้างก็มีเนื้อมากมาย และเมื่อถึงคราวชีวิตของพวกมันเทียบกับของเรา การตัดสินใจก็พิสูจน์ได้ว่าง่ายพอ\n\nเราใช้มีดแล่เนื้อและขวานกับฝูงของเรา ผ่าฟันผ่านตัวแก่และตัวเล็กด้วยความมุ่งมั่นอันน่าสยดสยอง โดยรู้ว่าการเสียสละของพวกมันเป็นสิ่งจำเป็น\n\nแต่ดูเหมือนว่าช้างที่เหลืออยู่ของเรา — ที่นักรบของเราใช้งาน — #EMP จดจำ#! การสังหารหมู่ได้ สัตว์ร้ายเหล่านี้สร้างปัญหา ปฏิเสธคำสั่งของเราและไม่ยอมทำอะไรมากนักนอกจากการรักษาตัวรอดหรือการกินอาหาร\n\nพวกมันยัง #EMP น่าหงุดหงิด#! ที่เป็นศัตรูกับข้าเป็นการส่วนตัว ดูเหมือนจะถือว่าข้าต้องรับผิดชอบในฐานะผู้นำฝูงมนุษย์"
 ep3_laamp_decision_event.1205.a: "สาปแช่งสัตว์ร้ายที่ดื้อรั้นเหล่านี้!"
 ep3_laamp_decision_event.1205.a.tt: "ท่านจะไม่สามารถใช้กองทัพช้างได้อย่างมีประสิทธิภาพอีกต่อไป"
 ep3_laamp_decision_event_1205_modifier: "ช้างไม่เคยลืม"
 ep3_laamp_decision_event_1205_modifier_desc: "และพวกมันก็ไม่ให้อภัยด้วย"
 
