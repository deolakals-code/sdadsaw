humiliate_the_stooge_decision_tooltip: "แลกเปลี่ยน [prestige|E] บางส่วนเพื่อชีวิตที่ดี ปราศจาก [stress|E]"
humiliate_the_stooge_decision_rewards: "ท่านประจาน $stooge_camp_officer$ ของท่านในที่สาธารณะ:\n$EFFECT_LIST_BULLET$ท่านสูญเสีย [stress|E] [stress_i] บางส่วน\n$EFFECT_LIST_BULLET$ท่านได้รับ [dread|E] [dread_i] บางส่วน\n$EFFECT_LIST_BULLET$ท่านได้รับ [modifier|E] [GetModifier( 'stooge_humiliated_modifier' ).GetNameWithTooltip] เป็นเวลา #high 2#! ปี"
