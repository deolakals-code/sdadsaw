 ep3_decisions_event.9001.t: "ไปตกปลา"
 ep3_decisions_event.9001.desc: "ขณะที่ข้ากำลังเดินลงไปที่ริมฝั่งน้ำ กลิ่นเกลือและปลาโชยมาแตะจมูก คนสองสามคนกำลังเก็บของ ทำให้ชายฝั่งทั้งหมดเป็นของข้า วันแบบนี้ไม่ได้มีมาทุกวัน และข้าควรใช้ประโยชน์จากมันให้เต็มที่"
 ep3_decisions_event.9001.friend: "\n\n[ROOT.Char.Custom2('RelationToMeShort', potential_friend)] ของข้า [potential_friend.GetName] ตัดสินใจเข้าร่วมกับข้าในวันนี้ โอกาสในการเชื่อมสัมพันธ์ปรากฏขึ้น หรือข้าสามารถเลือกที่จะตกปลาคนเดียวได้"
 ep3_decisions_event.9001.fishing: "\n\nวันแห่งการพักผ่อนรออยู่!"
 ep3_decisions_event.9001.ice_fishing: "ผืนน้ำแข็งอันกว้างใหญ่รอเราอยู่ สิ่งที่ข้าต้องทำคือหาจุดที่ดีเพื่อเจาะรูเล็ก ๆ"
 ep3_decisions_event.9001.a: "ผืนน้ำเรียกหาข้าและข้าเพียงผู้เดียว"
 ep3_decisions_event.9001.a.tt: "#weak ข้าจะใช้เวลาอยู่คนเดียว ครุ่นคิด#!"
 ep3_decisions_event.9001.b: "โอกาสที่จะได้ใช้เวลากับ [potential_friend.GetNameNoTooltip]!"
 ep3_decisions_event.9001.b.tt: "#weak ช่วงเวลาตามลำพังกับ [potential_friend.GetNameNoTooltip] สามารถกระชับความสัมพันธ์ของเราให้แน่นแฟ้นยิ่งขึ้น#!"
 ep3_decisions_event.9001.c: "มีเรือให้เช่าแถวนี้บ้างไหม?"
 ep3_decisions_event.9001.c.tt: "#weak เรือบนผืนน้ำมีแนวโน้มที่จะจับปลาตัวใหญ่ได้ดีกว่าการตกปลาจากฝั่ง#!"

 ep3_decisions_event.9010.t: "ช่วงเวลาแห่งการครุ่นคิด"
 ep3_decisions_event.9010.desc: "ข้าสูดหายใจเข้าลึก ๆ และหายใจออกขณะเหวี่ยงเบ็ดลงไปในน้ำ ตะขอตกลงพร้อมเสียง 'จ๋อม' เบา ๆ และโลกก็เงียบสงัด\n\nสายตาของข้าทอดมองไปตามแนวชายฝั่ง มีเวลาอยู่คนเดียวเพื่อประมวลความคิด ชีวิตนักผจญภัยไม่ได้เลวร้ายนัก แต่ไม่มีชีวิตใดปราศจากความเครียด ข้าหลับตาลงครู่หนึ่งเพื่อพักผ่อน ทันใดนั้นก็ถูกกระตุกให้ตื่นโดยบางสิ่งที่ดึงคันเบ็ดออกจากมือข้า"
 ep3_decisions_event.9010.a: "จับให้มั่นแล้วดึง!"
 ep3_decisions_event.9010.b: "ปล่อยให้คันเบ็ดลื่นไถลผ่านนิ้วมือไป"
 ep3_decisions_event.9010.b.trait: "ความสงบเข้าครอบงำจิตใจท่าน"
 ep3_decisions_event.9010.b.nothing: "คันเบ็ดลอยห่างออกไปจากท่าน"
 
 ep3_decisions_event.9020.t: "สายสัมพันธ์จากปลา"
 ep3_decisions_event.9020.desc: "ข้ากับ [potential_friend.GetNameNoTooltip] ดูเหมือนจะเข้ากันได้ดีในช่วงนี้ เราหัวเราะกับเรื่องตลกเดียวกัน กังวลเกี่ยวกับปัญหาเดียวกัน และสายสัมพันธ์ระหว่างเราดูเหมือนจะยิ่งใหญ่กว่าแค่ [ROOT.Char.GetTitleAsNameNoTooltip|U] กับ [ROOT.Char.Custom2('RelationToMeShort', potential_friend)] ของพวกเขา\n\nเราต่างเหวี่ยงเบ็ดลงไปในน้ำและรอคอยอย่างอดทนให้ปลากินเบ็ด ตลอดเวลาพูดคุยและหัวเราะกัน\n\nการเดินทางครั้งนี้ได้พิสูจน์แล้วว่าเราทำงานร่วมกันได้ดี และข้าอยากจะใช้เวลากับพวกเขามากขึ้นในอนาคต"
 ep3_decisions_event.9020.a: "ท่านสนุกมากจนเกือบลืมไปว่ามาที่นี่เพื่ออะไร"
 ep3_decisions_event.9020.b: "ช่างมันเถอะ มีปลาติดเบ็ดแล้ว!"

 ep3_decisions_event.9030.t: "ไม่ใช่เรื่องง่าย"
 ep3_decisions_event.9030.desc: "หลังจากพายเรือไปสักพัก ชายฝั่งของ [ROOT.Char.GetCurrentLocation.GetBaronyNameExplicitly] ก็หายไปจากสายตา เพิ่งจะรู้ตัวว่าข้าเอาเหยื่อมาพอแค่สำหรับลองครั้งเดียว"
 ep3_decisions_event.9030.friend: "\n\nข้ามองไปที่ [potential_friend.GetNameNoTooltip] และสารภาพ แต่พวกเขาดูไม่เดือดร้อน\n\n"แล้วไงล่ะ!" พวกเขาอุทาน "เรามาที่นี่เพื่อพักผ่อน ไปเถอะ เหวี่ยงเบ็ดของท่านเลย มาดูกันว่ามีอะไรอยู่ข้างนอกนั่น!""
 ep3_decisions_event.9030.a: "มา ทำให้ครั้งนี้คุ้มค่ากันเถอะ!"
 ep3_decisions_event.9030.a.fish: "#weak ท่านจับ [ROOT.Char.Custom('GetRegionalFish')] ได้! #!"
 ep3_decisions_event.9030.a.fishfriend: "#weak [potential_friend.GetNameNoTooltip] จับ [ROOT.Char.Custom('GetRegionalFish')] ได้! #!"
 ep3_decisions_event.9030.a.nofish: "#weak ไม่มีอะไรกินเบ็ด... #!"
 ep3_decisions_event.9030.b: "ข้าอยากให้ท่านลอง [potential_friend.GetNameNoTooltip]"

