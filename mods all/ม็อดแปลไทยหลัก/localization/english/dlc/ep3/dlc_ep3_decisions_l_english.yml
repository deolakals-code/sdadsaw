 ep3_decisions_event.4014.a.tt: "[pope.GetTitledFirstNameNoTooltip] ได้เรียกร้องให้เกิด [pope.GetFaith.GHWName]!"
 ep3_decisions_event.4015.desc: "เราได้ยินคำร้องขอของพี่น้องในพระคริสต์ของเรา และหัวใจของเราหลั่งเลือดให้กับความทุกข์ทรมานของท่าน อย่างไรก็ตาม ความช่วยเหลือไม่ได้มาง่ายๆ\n\nหากท่านสามารถสนับสนุนความพยายามของเราด้วยค่าตอบแทนทางการเงิน เราจะให้คำมั่นว่าจะส่งกองกำลังไปช่วยเหลือท่าน"
