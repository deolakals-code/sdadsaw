 maa_thieves_flavor: "$maa_bandits_flavor$"
 maa_marauders: "พวกปล้นชิง"
 maa_marauders_flavor: "$maa_bandits_flavor$"
 bandit_king_maa_spawn_effect_desc: "ท่านจะได้รับกองทัพเล็ก ๆ ประกอบด้วย $maa_marauders$ และ $maa_poachers$ หรือ $maa_thieves$ และ $maa_bandits$"

 bandit_king_modifier: "ผู้อุปถัมภ์โจร"
 bandit_king_modifier_desc: "ตัวละครนี้กำลังเกณฑ์ผู้ติดตามจากชนชั้นล่างของสังคมในทุกโอกาส\n\n#Bold ทุกครั้ง#! #weak ที่ตัวละครนี้ทำ [task_contract|E] ประเภท [intrigue|E] สำเร็จ พวกเขาจะได้รับ [men_at_arms|E] ที่ไม่เหมือนใคร\nจำนวนขึ้นอยู่กับความก้าวหน้าใน [trait_level_track|E] [GetTrait('gallowsbait').GetName(GetNullCharacter)]#!"

 ep3_laamp_decision_event.1120.t: "$bandit_king_decision$"
 ep3_laamp_decision_event.1120.desc: "เมื่อหัวใจของท่านถูกแทงด้วยกริชขึ้นสนิม ท่านไม่สนใจชาติตระกูลของผู้ถือมัน อัศวินในชุดเกราะส่องประกาย พร้อมอาวุธอันล้ำค่าที่นำเข้าจากทั่วทุกสารทิศ? พวกเขาก็ตาย เช่นเดียวกับคนจนที่นุ่งห่มผ้าขี้ริ้ว ถือท่อนไม้แหลมที่หักมาจากต้นไม้ใกล้เคียง\n\nขุนนางและสุภาพสตรีพร้อมบรรดาศักดิ์อันหรูหราของพวกเขาสามารถเก็บทหารรับจ้างราคาแพงไว้ได้ — และหวาดกลัวการทรยศทุกครั้งที่มีคนกระเป๋าหนักกว่าเดินผ่านไป\n\nฟังข้าและรวมตัวกันเถิด เจ้าผู้ไม่ได้เลือกเส้นทางชีวิตของตนเอง เพราะความรุนแรงและเลือดได้ประทับตราเจ้าตั้งแต่เกิด!"
 ep3_laamp_decision_event.1120.a: "$bandit_king_decision_confirm$"
 ep3_laamp_decision_event.1120.a.flavor: "เราแค่ต้องการให้พวกเขาสวมเสื้อผ้าให้เหมาะสม เพื่อที่พวกเขาจะได้ไม่หนาวตายในคืนนี้ และบางทีอาจแลกเปลี่ยนไม้เท้าเป็นหอกยาวที่เหมาะสม"

 start_city_construction_decision: "ก่อตั้งที่ดินถือครอง"
 start_city_construction_decision_desc: "ระหว่างการเดินทาง ข้าได้สะสมความมั่งคั่งจำนวนมาก พื้นดินอันอุดมสมบูรณ์และบริสุทธิ์เหล่านี้ดูเหมือนเป็นสถานที่ที่ดีในการลงทุน และเก็บเกี่ยวผลประโยชน์ในปีต่อ ๆ ไป"
 start_city_construction_decision_tooltip: "จงลงหลักปักฐาน!"
 start_city_construction_decision_confirm: "จับพลั่ว!"
 start_city_construction_decision_empty_holding: "ท่านต้องอยู่ใน [barony|E] ที่ไม่มีที่ดินถือครอง"
 start_city_construction_decision_more_rewards: "การปฏิบัติตามข้อกำหนดทางเลือกเพิ่มเติมจะเสนอทางเลือกเพิ่มเติมระหว่างการก่อตั้งเมือง รวมถึงการสร้าง [buildings|E] ที่ไม่เหมือนใคร\n\n#weak ท่านจะสามารถสร้างเมืองเพิ่มเติมได้หลังจากนี้\nเมื่อก่อสร้างแล้ว ท่านจะมีโอกาสยึดเมืองมาเป็นของตนเองโดยใช้กำลัง\n\nมิฉะนั้น ในแต่ละปี เมืองจะจ่ายเงินปันผล จำนวนขึ้นอยู่กับจำนวนระดับ [building|E] รวมใน [barony|E] นี้และ [development|E] ของเคาน์ตี ตั้งแต่ [gold_i]25 ถึง [gold_i]200 จำนวนนี้จะค่อย ๆ ลดลงทุกปีหลังจากสร้างเสร็จ#!"

 ep3_laamp_decision_event.1130.t: "เมืองแห่ง [city_location.GetNameNoTooltip] — การเริ่มต้น"
 ep3_laamp_decision_event.1130.desc: "พื้นดินใต้เท้าข้ายังไม่ถูกแตะต้องโดยมือมนุษย์ แต่.\n\nแต่ข้าสามารถเห็นได้แล้วว่าศาลากลางจะตั้งอยู่ที่ใด ที่ ซึ่งพ่อค้าจะชั่งสินค้าและจ่ายภาษีภายใต้สายตาที่จับจ้องของยาม ข้าได้ยินเสียงระฆังดังในหอคอย\n\nเสบียงถูกรวบรวมแล้ว ผู้ติดตามของข้ากระสับกระส่าย สิ่งที่จำเป็นทั้งหมดคือคำพูดของข้า"
 ep3_laamp_decision_event.1130.a: "เริ่มกันเถอะ!"
 ep3_laamp_decision_event.1130.a.desc: "$start_city_construction_decision_more_rewards$"
 ep3_laamp_decision_event.1130.b: "ข้าเปลี่ยนใจแล้ว ขออภัย"
 ep3_laamp_decision_event.1130.b.desc: "ท่านละทิ้งการก่อสร้าง ส่วนหนึ่งของทองที่ใช้ไปจะได้รับคืน"

 ep3_laamp_decision_event.1131.t: "เมืองแห่ง [city_location.GetNameNoTooltip] — สิ้นสุด"
 ep3_laamp_decision_event.1131.desc: "หลายปีก่อน ข้ายืนอยู่ที่นี่ เมื่อมันเป็นเพียงจุดหนึ่งท่ามกลางป่ารกร้าง บัดนี้ มันคือเมืองที่น่าภาคภูมิใจ ช่างน่าอัศจรรย์! แต่ข้าสงสัยว่า [city_location.GetCounty.GetTitle.GetHolder.GetName] เป็นคนที่เหมาะสมที่จะรักษาอนาคตของการตั้งถิ่นฐานใหม่ของข้าหรือไม่\n\nอีกหลายทศวรรษนับจากนี้ เรื่องราวจะถูกเล่าขานว่าข้ามาถึง [city_location.GetNameNoTooltip] อย่างไร ข้านำศักยภาพของมันออกมา และ..."
 ep3_laamp_decision_event.1131.a: "...ข้าพิชิต!"
 ep3_laamp_decision_event.1131.b: "...ข้าจากไปเพื่อบรรลุผลสำเร็จมากขึ้นที่อื่น"
 ep3_laamp_decision_event.1131.b.desc: "ใน แต่ละปี เมืองจะจ่ายเงินปันผล จำนวนขึ้นอยู่กับจำนวนระดับ [building|E] รวมใน [city_location.GetName] และ [development|E] ของ [city_location.GetCounty.GetName]"

 ep3_laamp_decision_event.1133.t: "เมืองแห่ง [city_location.GetName] — พลังแห่งน้ำ"
 ep3_laamp_decision_event.1133.desc: "มีลำธารไหลเอื่อยอยู่ใกล้ ๆ ด้วยความเชี่ยวชาญที่เหมาะสม เช่นของข้า และด้วยการทำงานที่เหมาะสม เช่นของผู้ติดตามของข้า เราสามารถเปลี่ยนทิศทางให้ใกล้เมืองมากขึ้นได้\n\nหลังจากนั้น การสร้างกังหันน้ำด้านบนควรเป็นเรื่องเล็กน้อย อาจเป็นกังหันที่ใหญ่กว่านี้ก็ได้ หากมีทรัพยากรเหลือพอ"
 ep3_laamp_decision_event.1133.a: "ยอดเยี่ยม!"
 ep3_laamp_decision_event.1133.b: "ข้าจะลงทุนในเรื่องนี้"
 ep3_laamp_decision_event.1133.c: "ข้าไม่สามารถจ่ายได้"

 ep3_laamp_decision_event.1134.t: "เมืองแห่ง [city_location.GetNameNoTooltip] — ผู้ตั้งถิ่นฐาน"
 ep3_laamp_decision_event.1134.desc: "การก่อสร้างดำเนินไปได้ด้วยดี โครงร่างของเมืองมองเห็นได้แล้ว เรามีช่างก่อสร้างเพียงพอที่จะสร้างอาคารต่อไป แต่เราไม่มีคนเพียงพอที่จะเติมเต็มทุกอาคาร ทุกการค้าที่อาจจำเป็น\n\nโชคดีที่ข้าสามารถใช้อำนาจของข้าเพื่อดึงดูดผู้ตั้งถิ่นฐานมากขึ้น แน่นอนว่าต้องมีสิ่งจูงใจเป็นทองและเงินเล็กน้อย"
 ep3_laamp_decision_event.1134.a: "วิเศษ!"
 ep3_laamp_decision_event.1134.b: "ให้ข้าหยิบกระเป๋าเงินก่อน"
 ep3_laamp_decision_event.1134.c: "อาจจะไม่"

 ep3_laamp_decision_event.1135.t: "เมืองแห่ง [city_location.GetNameNoTooltip] — การตัดไม้ทำลายป่า"
 ep3_laamp_decision_event.1135.desc: "ผู้คนที่จะอาศัยอยู่ที่นี่ต้องการเสบียงอาหารที่เหมาะสม ที่ดินที่กำหนดไว้สำหรับการเพาะปลูกในตอนแรกน่าจะเพียงพอสำหรับการเริ่มต้น แต่พื้นที่เพาะปลูกที่มากขึ้นจะรับประกันความเจริญรุ่งเรืองไปอีกหลายทศวรรษ\n\nมีโอกาสอยู่ — ป่าไม้ของ [city_location.GetCounty.GetTitle.GetHolder.GetName] มีอาณาเขตติดกับทุ่งนาของข้า รอคอยที่จะถูกเปลี่ยนเป็นที่ดินทำกิน ข้ามองการณ์ไกลที่จะรักษาความสัมพันธ์ที่ดีกับ [city_location.GetCounty.GetTitle.GetHolder.GetHerHim] ดังนั้นการซื้อที่ดินสองสามแปลงจึงไม่น่าเป็นปัญหา หลังจากนั้น ต้นไม้ต้องถูกเผาและถอนรากถอนโคน และดินที่อุดมสมบูรณ์ก็จะปรากฏขึ้น"
 ep3_laamp_decision_event.1135.a: "เอาคบเพลิงมา!"
 ep3_laamp_decision_event.1135.b: "รวบรวมทุกคน ไม่ให้เหลือต้นไม้แม้ แต่ต้นเดียว!"
 ep3_laamp_decision_event.1135.c: "คิดดูอีกที ไม่ดีกว่า"

 ep3_laamp_decision_event.1136.t: "เมืองแห่ง [city_location.GetNameNoTooltip] — เส้นทางการค้า"
 ep3_laamp_decision_event.1136.desc: "การบริโภคสิ่งที่ชนบทมีให้ ลิ้มรสสิ่งที่ดีที่สุดจากดินแดนห่างไกล การผลิตสินค้าและบริการที่ไม่เหมือนใคร — วัฏจักรธรรมชาติของเมืองที่เจริญรุ่งเรืองใด ๆ\n\nเราสามารถรอและปล่อยให้เส้นทางการค้าพัฒนาไปตามธรรมชาติเมื่อเวลาผ่านไป — หรือเคลื่อนไหวก่อนกำหนด รับประกันว่าเกวียนการค้าคันแรกจะกลิ้งเข้าประตูเมืองเมื่ออิฐก้อนสุดท้ายถูกวางลงในกำแพง\n\nข้ารู้จักพ่อค้าสองสามคนที่สามารถ ทำให้มันเกิดขึ้นได้ พวกเขาขอทองจากข้าตอนนี้ — จำนวนเล็กน้อยเมื่อเทียบกับความมั่งคั่งที่จะไหลมาที่นี่ในไม่ช้า!"
 ep3_laamp_decision_event.1136.a: "น่าทึ่ง!"
 ep3_laamp_decision_event.1136.b: "เราตกลงกันได้"
 ep3_laamp_decision_event.1136.c: "ไม่แน่นอน"

 ep3_laamp_decision_event.1137.t: "เมืองแห่ง [city_location.GetName] — สายสัมพันธ์ทางศาสนา"
 ep3_laamp_decision_event.1137.desc: "เมืองที่อยู่รอดมานานหลายทศวรรษ หลายศตวรรษ ต้องการพลเมืองที่เข้มแข็ง ซึ่งมีความศรัทธาในเมืองและในตนเอง และผู้เลี้ยงแกะเพื่อนำทางพวกเขาในยามอ่อนแอ เมืองนี้ต้องการ [ROOT.Char.GetFaith.GetAdherentNamePlural] ที่เคร่งครัดมากขึ้น\n\nข้าถูกมองว่าเป็น [ROOT.Char.GetWomanMan] ผู้เคร่งครัดที่มีฐานะพอสมควร ด้วยทองคำในปริมาณที่เหมาะสมและคำอธิษฐานจากนักเทศน์ที่โน้มน้าวใจได้ ข้าจะมีฝูงแกะของข้าที่นี่ พร้อมด้วยกลไกทางศาสนาที่จะยึดมั่นไว้ในพระคุณอันดีงาม [ROOT.Char.GetFaith.HighGodNamePossessive]"
 ep3_laamp_decision_event.1137.a: "ขอ [ROOT.Char.GetFaith.HighGodName] ทรงพระเจริญ!"
 ep3_laamp_decision_event.1137.b: "ข้าจะบริจาคเพื่อการนี้"
 ep3_laamp_decision_event.1137.c: "อนิจจา ไม่"

 ep3_laamp_decision_event.1140.toast: "[city_location.GetName] จ่ายเงินปันผล"
 
 # Renounce Governorship
 renounce_governorship_decision: "สละตำแหน่งผู้ว่าการ"
 renounce_ministership_decision: "ถอนตัวจากตำแหน่งเสนาบดี"
 renounce_governorship_decision_desc: "กลับไปพักผ่อนที่ [estate|E] ของครอบครัวท่าน และรวบรวมความมั่งคั่งและอิทธิพลให้ห่างไกลจากหน้าที่ของ [governorship|E]\n\nซ่อนตัวอยู่ในเงามืด กลับมาดั่งนกฟีนิกซ์ที่ลุกโชน"
 renounce_governorship_decision_desc_japan: "ถอนตัวจากหน้าที่ [governorship|E] เพื่อเข้าร่วมราชสำนักในการแสวงหาโอกาสใหม่\n\nข้าจะปล่อยให้เหล่าศัตรูคู่แข่งคิดว่าข้ากำลังซุกซ่อนอยู่ในเงามืด แต่แท้จริงแล้ว ข้าจะกลับมาดั่งวิหคเพลิงที่ลุกโชนเพื่อเผาผลาญพวกมัน!"
 renounce_governorship_decision_desc_merit: "กลับไปพำนักยัง [estate|E] ของตระกูลเพื่อรวบรวมความรู้และทักษะในการสอบผ่าน [examinations|E] ในระดับต่อไป"
