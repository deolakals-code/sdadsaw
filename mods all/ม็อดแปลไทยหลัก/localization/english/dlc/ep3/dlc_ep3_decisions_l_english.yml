 # Liege Event
 ep3_decisions_event.2010.t: "$admin_confirmation_event_header$ ข้ารับใช้แห่งจักรวรรดิ"
 ep3_decisions_event.2010.desc: "ข้าราชบริพารในวังของข้าเบียดเสียดกันใน [ROOT.Char.Custom('GetThroneRoom')] ที่ ซึ่งผู้ได้รับการ แต่งตั้งจากจักรพรรดิเข้าแถวรออย่างไม่สิ้นสุด\n\nที่โดดเด่นที่สุดในบรรดาคนเหล่านี้คือ [confirmation_vassal.GetTitledFirstName] [confirmation_vassal.GetDynastyHouseName] ผู้เดินทางมาจาก [confirmation_vassal.GetCapitalLocation.GetNameNoTooltip] [ROOT.Char.Custom2('RelationToMeShort', confirmation_vassal)] ของข้าปกครอง [confirmation_vassal.GetPrimaryTitle.GetName]:"
 ep3_decisions_event.2010.desc_theme_civilian: "ศูนย์กลางการผลิตและการค้าที่คึกคัก,"
 ep3_decisions_event.2010.desc_theme_military: "ภูมิภาคที่เต็มไปด้วยค่ายทหารที่อึกทึกและกองทหารฝึกซ้อม,"
 ep3_decisions_event.2010.desc_theme_frontier: "ภูมิภาคชายแดนที่ทุรกันดารและเป็นหนึ่งในปราการสำคัญของอาณาจักร,"
 ep3_decisions_event.2010.desc_theme_imperial: "อัญมณีแห่งอาณาจักรที่ได้รับสิทธิพิเศษหายากมากมาย,"
 ep3_decisions_event.2010.desc_theme_naval: "ภูมิภาคชายฝั่งทะเลที่มีอู่ต่อเรือและท่าเรือ,"
 ep3_decisions_event.2010.desc_theme_small: "ดินแดนเล็กๆ ที่มีความสำคัญน้อย,"
 ep3_decisions_event.2010.desc_theme_big: "เขตอำนาจศาลที่กว้างขวางและมีความสำคัญอย่างยิ่ง,"
 ep3_decisions_event.2010.desc_theme_balanced: "ภูมิภาคขนาดพอเหมาะที่มีคุณค่าหลากหลายต่ออาณาจักร,"
 ep3_decisions_event.2010.desc_cool_foreigners: "บ้านของ [confirmation_vassal.GetCapitalLocation.GetCounty.GetCulture.GetCollectiveNoun] [confirmation_vassal.GetCapitalLocation.GetCounty.GetCulture.GetEthos.GetNameNoTooltip|l] ที่น่าไว้วางใจ"
 ep3_decisions_event.2010.desc_weird_foreigners: "บ้านของ [confirmation_vassal.GetCapitalLocation.GetCounty.GetCulture.GetCollectiveNoun] [confirmation_vassal.GetCapitalLocation.GetCounty.GetCulture.GetEthos.GetNameNoTooltip|l] ที่แปลกประหลาด"
 ep3_decisions_event.2010.desc_same_culture: "บ้านของ [ROOT.Char.GetCulture.GetCollectiveNoun] ประจำจังหวัด"
 ep3_decisions_event.2010.desc_state_faith: "และผู้นับถือ [confirmation_vassal.GetCapitalLocation.GetCounty.GetFaith.GetName] [ROOT.Char.GetPrimaryTitle.GetAdjective]"
 ep3_decisions_event.2010.desc_heretic_faith: "— พวกนอกรีต [confirmation_vassal.GetCapitalLocation.GetCounty.GetFaith.GetAdjective] ที่ชั่วร้าย!"
 ep3_decisions_event.2010.desc_accepted_faith: "— และ [ROOT.Char.GetFaith.HouseOfWorshipPlural] แห่งศรัทธา [confirmation_vassal.GetCapitalLocation.GetCounty.GetFaith.GetAdjective] ของพวกเขา"
 ep3_decisions_event.2010.desc_my_faith: "— และ [ROOT.Char.GetFaith.HouseOfWorshipPlural] อันดีงามบางแห่งของศรัทธา [ROOT.Char.GetFaith.GetAdjective] ที่แท้จริง"
 ep3_decisions_event.2010.desc_hate: "\n\nแม้เพียงมองลงไปที่ด้านหลังศีรษะของ [confirmation_vassal.GetTitledFirstNamePossessiveNoTooltip] ข้าก็สัมผัสได้ถึงความเกลียดชังอันแรงกล้าของเขา [confirmation_vassal.GetWomanMan] พึมพำคำสาบาน [second.Custom('quirk_neg_adverb')]... ขณะฝันถึงการทุบตีข้าจนตายด้วยคทาประจำตำแหน่งของ [confirmation_vassal.GetHerHis]"
 ep3_decisions_event.2010.desc_love: "\n\n[second.Custom('quirk_pos_adverb')|U], [confirmation_vassal.GetTitledFirstNameNoTooltip] เข้าร่วมพิธีกรรม หยิบคทาประจำตำแหน่งของ [confirmation_vassal.GetHerHis] ขึ้นมา และ [second.Custom('quirk_pos_pp')], [second.GetSheHe] สาบานว่าจะรับใช้อย่างภักดี"
 ep3_decisions_event.2010.desc_decrepit: "\n\n[confirmation_vassal.GetHerHis|U] ปีเดือนราวกับหินโม่บนหลังค่อมของ [confirmation_vassal.GetHerHis], [confirmation_vassal.GetTitledFirstNameNoTooltip] พยายามลุกขึ้นจากการคุกเข่า ผู้เฒ่าผู้ชรามีประสบการณ์มากมายให้พึ่งพา... และหวังว่าจะมีเวลาอีกหลายปีที่ดีในการทำ เช่นนั้น"
 ep3_decisions_event.2010.desc_young: "\n\nแทบจะเป็นเพียงเด็กหนุ่มหน้าใหม่ [confirmation_vassal.GetTitledFirstNameNoTooltip] ท่องบทสวดพร้อมกับคทาประจำตำแหน่งของ [confirmation_vassal.GetHerHis] ที่กำแน่นอยู่ในมืออันอ่อนนุ่ม กับคนผู้นี้ ยังมีอีกมากที่ต้องพิสูจน์..."
 ep3_decisions_event.2010.desc_skilled: "\n\n[confirmation_vassal.GetWomanMan] ที่คุกเข่าอยู่เบื้องหน้าข้าปกครองด้วยสัมผัสที่ [confirmation_vassal.Custom('ComplimentAdjective')] ไม่ว่า [confirmation_vassal.GetSheHe] จะสนับสนุนการเมืองแบบใด ไม่ว่าอะไรจะอยู่ในใจของ [confirmation_vassal.GetHerHis]: [confirmation_vassal.GetTitledFirstNameNoTooltip] คือเกียรติยศของ [ROOT.Char.GetPrimaryTitle.GetTierAsNameNoTooltip]"
 ep3_decisions_event.2010.desc_incompetent: "\n\nตามรายงานทั้งหมด ตอนนี้ข้ายืนยันการ แต่งตั้งผู้ที่บริหารงานได้ไม่ดี [second.Custom('quirk_neg_adverb')] แต่การปฏิเสธ [confirmation_vassal.GetTitledFirstNameNoTooltip] ขณะที่ [confirmation_vassal.GetSheHe] สาบานว่าจะให้บริการอย่างสมบูรณ์แบบ ซึ่ง [confirmation_vassal.GetSheHe] ไม่สามารถให้ได้นั้น จะมีประโยชน์เพียงเล็กน้อย..."
 ep3_decisions_event.2010.desc_generic_outro: "\n\n[confirmation_vassal.GetTitledFirstNameNoTooltip] โค้งคำนับอย่างลึกซึ้ง หยิบคทาสัญลักษณ์แห่งอำนาจของ [confirmation_vassal.GetHerHis] ขึ้นมา สาบานว่าจะรับใช้ [ROOT.Char.GetTitleAsNameNoTooltip] ของ [confirmation_vassal.GetHerHis] อย่างซื่อสัตย์"
 ep3_decisions_event.2010.a: ""จงปกครองให้ดี [confirmation_vassal.GetTitleAsNameNoTooltip]""

 # Vassal Event
 ep3_decisions_event.2011.desc: "ใน [confirmation_liege.Custom('GetThroneRoom')] ของพระราชวังหลักของ [confirmation_liege.GetCapitalLocation.GetTitle.GetNameNoTierPossessive] [confirmation_liege.GetTitledFirstNameRegnal] — ผู้สำเร็จราชการแทน [confirmation_liege.GetFaith.HighGodNamePossessive] บนโลก — ประทับอยู่อย่างสง่างาม\n\n"
 ep3_decisions_event.2011.desc_child: "การรอคอย ท่ามกลางเจ้าหน้าที่อาวุโสคนอื่นๆ ขณะที่เด็กหนุ่มหน้าสิวคร่ำครวญและอยู่ไม่สุขบนบัลลังก์ของ [confirmation_liege.GetHerHis] นั้น... ค่อนข้างแปลก"
 ep3_decisions_event.2011.desc_heretic: "พวกนอกรีตที่ปกครอง [confirmation_liege.GetPrimaryTitle.GetTierAsName] ของ [confirmation_liege.GetCapitalLocation.GetCounty.GetFaith.GetAdherentNamePlural] แม้ แต่ที่นี่ ท่ามกลาง [confirmation_liege.GetFaith.PriestNeuterPlural] และพระราชาคณะในราชสำนัก บรรยากาศก็ตึงเครียด"
 ep3_decisions_event.2011.desc_war: "ขณะที่พวกเราเจ้าหน้าที่คุกเข่าลงและพิธีของเราเริ่มต้นขึ้น เหล่านายทหารก็ถอนหายใจอย่างไม่อดทน ดูเหมือนว่าสงครามของพวกเขาจะไม่ค่อยคำนึงถึงเกียรติยศของเรานัก"
 ep3_decisions_event.2011.desc_poorly_run: "และในความโกลาหล เหล่าข้าราชบริพารในวังหัวเราะคิกคักขณะที่พวกเราเจ้าหน้าที่ถูกผลักดันเข้าที่ และมีการปฏิบัติตามพิธีกรรมเพียงเล็กน้อย"
 ep3_decisions_event.2011.desc_well_run: "เจ้าหน้าที่เข้าแถวรออย่างไม่สิ้นสุด ทุกคนอยู่ในความเกรงขาม ทุกคนกระตือรือร้นที่จะคุกเข่าต่อหน้าองค์อธิปัตย์ของเรา"
 ep3_decisions_event.2011.desc_gender: "[confirmation_liege.GetWomanMan] ประทับบนบัลลังก์ เป็นการดีที่เราเจ้าหน้าที่ผู้มาเยือนถูกห้ามไม่ให้มองดูองค์อธิปัตย์ของเรา!"
 ep3_decisions_event.2011.desc_typical_palace: "ข้าถูกนำทางให้เข้าร่วมแถวของเจ้าหน้าที่อาวุโส ด้วยเสียงโห่ร้องของทุกคน ของนักดนตรีและผู้ประกาศ พิธีอันยิ่งใหญ่ของเราก็เริ่มต้นขึ้น"

 ep3_decisions_event.2011.desc_hate: "[confirmation_liege.GetTitleAsNameNoTooltip] กล่าวกับข้า [second.Custom('quirk_neg_adverb')]; [confirmation_liege.GetSheHe] หยดหยาดความดูถูกลงบนศีรษะที่คุกเข่าของข้า ขณะที่เครื่องราชอิสริยาภรณ์ของข้าถูกห้อยอยู่เบื้องบน\n\n"
 ep3_decisions_event.2011.desc_love: "แต่สุรเสียงของ [confirmation_liege.GetTitleAsNamePossessiveNoTooltip] นั้นอบอุ่นและ [second.Custom('quirk_pos_adjective')] ขณะที่ [confirmation_liege.GetSheHe] กล่าวกับข้า และมอบเครื่องราชอิสริยาภรณ์ของข้า\n\n"
 ep3_decisions_event.2011.desc_meh: "[confirmation_liege.GetTitleAsNameNoTooltip] กล่าวกับผู้ได้รับการ แต่งตั้งแต่ละคนตามลำดับ มอบเครื่องราชอิสริยาภรณ์และรับคำสาบาน จนกระทั่ง [confirmation_liege.GetSheHe] มาถึงข้า\n\n"

 ep3_decisions_event.2011.desc_theme_civilian: ""สันติสุขแห่ง [confirmation_liege.GetFaith.PositiveAfterLife] อาจยังคงอยู่ใน [confirmation_vassal.GetPrimaryTitle.GetNameNoTier]," [confirmation_liege.GetSheHe] กล่าว, "มันคือสวน ที่ต้องได้รับการดูแลอย่างเมตตา""
 ep3_decisions_event.2011.desc_theme_military: ""เจ้าจะต้องลับดาบแห่ง [confirmation_vassal.GetPrimaryTitle.GetNameNoTier]," [confirmation_liege.GetSheHe] กล่าว, "และให้มันถูกใช้โดยผู้ชอบธรรมเท่านั้น""
 ep3_decisions_event.2011.desc_theme_frontier: ""จงนอนน้อย," [confirmation_liege.GetSheHe] บัญชา, "จงยืนหยัด [confirmation_vassal.GetPrimaryTitle.GetNameNoTier] คือที่ ซึ่งทุกสิ่งที่ [confirmation_liege.GetPrimaryTitle.GetAdjective] จะอยู่หรือตาย""
 ep3_decisions_event.2011.desc_theme_imperial: ""ใน [confirmation_vassal.GetPrimaryTitle.GetNameNoTier]," [confirmation_liege.GetSheHe] กล่าว," เจ้าจะต้องเป็นภาพลักษณ์ของ [confirmation_liege.GetPrimaryTitle.GetTierAsNameNoTooltip] เอง น้อยคนนัก เว้น แต่คนชั่ว ที่จะรู้จักเสรีภาพ เช่นนี้""
 ep3_decisions_event.2011.desc_theme_naval: ""ในเกลือแห่งชายฝั่งของ [confirmation_vassal.GetPrimaryTitle.GetNameNoTierPossessive]," [confirmation_liege.GetSheHe] กล่าว, "จงได้กลิ่นเลือดของ [confirmation_liege.GetPrimaryTitle.GetTierAsNameNoTooltip] นี้; จงเห็นน้ำตาของหญิงม่ายของนาง""
 ep3_decisions_event.2011.desc_theme_small: ""เขตอำนาจศาลที่พอประมาณ [confirmation_vassal.GetPrimaryTitle.GetNameNoTier]" [confirmation_liege.GetSheHe] กล่าว, "แต่เป็นเขตที่คู่ควร""
 ep3_decisions_event.2011.desc_theme_big: ""อาณาเขตอันกว้างใหญ่ เช่น [confirmation_vassal.GetPrimaryTitle.GetNameNoTier]," [confirmation_liege.GetSheHe] กล่าว, ระหว่างพิธีการ, "สัตว์ร้ายอันทรงพลัง ที่จะถูก ทำให้เชื่องได้โดยนายที่เหมาะสมเท่านั้น...""
 ep3_decisions_event.2011.desc_theme_balanced: ""ตำแหน่งของเจ้าได้รับมอบจาก [confirmation_liege.GetFaith.HighGodName] และ [confirmation_liege.GetTitleAsNameNoTooltip] ของเจ้า," [confirmation_liege.GetSheHe] กล่าว, "จงจำสิ่งนี้ไว้ และปกครอง [confirmation_vassal.GetPrimaryTitle.GetNameNoTier] ให้ดี""
 ep3_decisions_event.2011.desc_outro: "\n\nข้าเปล่งเสียงตอบรับที่เหมาะสมทั้งหมด และโค้งคำนับอย่างลึกซึ้งต่อหน้าเจ้าเหนือหัวของข้า ในที่สุดข้าก็หยิบคทาแห่งอำนาจประจำจังหวัดขึ้นมา"
 ep3_decisions_event.2011.a: "ขอถวายพระพร [confirmation_liege.GetTitleAsNameNoTooltip]"

 # Invalidated event
 ep3_decisions_event.2080.t: "$admin_confirmation_event_header$ เป็นโมฆะ"
