l_english: 
 ep3_laamp_flavor.0001.t1: "ผู้กินซาก"
 ep3_laamp_flavor.0001.t2: "กินซากอีกา"
 ep3_laamp_flavor.0001.desc1: "ฝูงแร้งบินวนอยู่เบื้องบนขณะที่แสงแดดอันแผดเผาอาบร่างกายและท้องอันว่างเปล่าของข้า ข้าค้นเสบียงที่เหลืออยู่ เราเหลือเพียงขนมปังแข็ง และแม้กระทั่งนั่นก็ใกล้จะหมดลงแล้ว เราจำเป็นต้องหาเสบียงเพิ่มในเร็ววัน มิฉะนั้นจะต้องอดตาย\n\nข้านำสถานการณ์อันเลวร้ายนี้ไปแจ้งแก่ผู้อื่น ไม่มีทางเลือกใดที่น่าพอใจเลยแม้ แต่น้อย [vulture_shooter.GetFirstName] อาสาที่จะยิงพวกกินซากบางตัวลงมาเพื่อเติมเสบียงอันน้อยนิดของเรา พลางงอแขนข้างที่ใช้ยิงธนูของ [vulture_shooter.GetHerHis]"
 ep3_laamp_flavor.0001.desc2: "ฝูงนกนางนวลบินวนอยู่เบื้องบนขณะที่การโคลงเคลงของเรือยิ่งขับเน้นความปวดร้าวในท้องอันว่างเปล่าของข้า ข้าค้นเสบียงที่เหลืออยู่ เราเหลือเพียงขนมปังแข็ง และแม้กระทั่งนั่นก็ใกล้จะหมดลงแล้ว เราจำเป็นต้องหาเสบียงเพิ่มในเร็ววัน มิฉะนั้นจะต้องอดตาย\n\nข้านำสถานการณ์อันเลวร้ายนี้ไปแจ้งแก่ผู้อื่น ไม่มีทางเลือกใดที่น่าพอใจเลยแม้ แต่น้อย [vulture_shooter.GetFirstName] อาสาที่จะยิงพวกกินซากบางตัวลงมาเพื่อเติมเสบียงอันน้อยนิดของเรา พลางงอแขนข้างที่ใช้ยิงธนูของ [vulture_shooter.GetHerHis]"
 ep3_laamp_flavor.0001.desc: "ฝูงกาบินวนอยู่เบื้องบนขณะที่ท้องของข้าร้องโหยหวนด้วยความหิว ข้าค้นเสบียงที่เหลืออยู่ เราเหลือเพียงขนมปังแข็ง และแม้กระทั่งนั่นก็ใกล้จะหมดลงแล้ว เราจำเป็นต้องหาเสบียงเพิ่มในเร็ววัน มิฉะนั้นจะต้องอดตาย\n\nข้านำสถานการณ์อันเลวร้ายนี้ไปแจ้งแก่ผู้อื่น ไม่มีทางเลือกใดที่น่าพอใจเลยแม้ แต่น้อย [vulture_shooter.GetFirstName] อาสาที่จะยิงพวกกินซากบางตัวลงมาเพื่อเติมเสบียงอันน้อยนิดของเรา พลางงอแขนข้างที่ใช้ยิงธนูของ [vulture_shooter.GetHerHis]"
 ep3_laamp_flavor.0001.a: "เป็นข้อเสนอที่ดีเยี่ยม"
 ep3_laamp_flavor.0001.a.cannibal: "ข้าเคยกินสิ่งที่แย่กว่านี้"
 ep3_laamp_flavor.0001.b: "รสชาติมันต้อง #EMP แย่สุดๆ#!!"
 ep3_laamp_flavor.0001.c: "รู้กันดีว่าการกินซากสัตว์ ทำให้ป่วยได้"
 ep3_laamp_flavor.0001.d: "ข้าพนันได้เลยว่าข้ายิงนกได้มากกว่า [vulture_shooter.GetFirstNameNoTooltip]"
 ep3_laamp_flavor.0001.a.sick: "กินซากสัตว์"
 ep3_laamp_flavor.0001.a.fine: "กินซากสัตว์"
 agreed_to_shoot_vultures: "[CHARACTER.GetShortUIName|U] และ [TARGET_CHARACTER.GetShortUIName] ผูกสัมพันธ์กันผ่านมื้ออาหารอันน่าสะอิดสะเอียน"
 agreed_to_shoot_vultures_corresponding: "[TARGET_CHARACTER.GetShortUIName] และ [CHARACTER.GetShortUIName|U] ผูกสัมพันธ์กันผ่านมื้ออาหารอันน่าสะอิดสะเอียน"
 no_vulture_eating: "[CHARACTER.GetShortUIName|U] และ [TARGET_CHARACTER.GetShortUIName] ผิดใจกันเรื่องการกินซากสัตว์"
 no_vulture_eating_corresponding: "[TARGET_CHARACTER.GetShortUIName] และ [CHARACTER.GetShortUIName|U] ผิดใจกันเรื่องการกินซากสัตว์"
 ep3_laamp_flavor.0001.sick: "เนื้อสัตว์กินซากไม่ถูกกับข้า"
 ep3_laamp_flavor.0001.notsick: "แทบกินไม่ได้ แต่ก็พอประทังชีวิต"
 
 ep3_laamp_flavor.0020.t: "หัวขโมย!"
 ep3_laamp_flavor.0020.intro: "ข้ารีบรุดไปยังจัตุรัสกลางเมืองทันทีที่ได้ยินข่าว [thieving_follower.GetFirstName] ถูกจับได้คาหนังคาเขาขณะขโมยของจากแผงลอยในตลาด ผู้ที่นั่งพิจารณาคดีอยู่เบื้องบนไม่ใช่ใครอื่นนอกจาก [town_leader.GetTitledFirstName] ซึ่งจ้องมองมาที่ข้าด้วยสายตาที่แทบจะฆ่ากันได้ ในทางตรงกันข้าม [thieving_follower.GetFirstNameNoTooltip] ดูเหมือนจะยินดีที่เห็นข้ามากกว่าจากสภาพการณ์อันย่ำแย่ของ [thieving_follower.GetHerHis] ในขื่อคา\n\n"โทษสำหรับการลักทรัพย์ใน [town_location.GetName] คือ" [town_leader.GetTitledFirstName] อธิบาย"
 ep3_laamp_flavor.0020.desc1: ""โดยปกติคือการเฆี่ยนอย่างรุนแรงหากไม่สามารถจ่ายค่าปรับตามธรรมเนียมได้ อย่างไรก็ตาม ในฐานะที่เป็นสมาชิกที่รู้จักกันดีของแก๊งอันธพาลจรจัด ข้าจึงไม่คิดที่จะเมตตา เช่นนั้น""
 ep3_laamp_flavor.0020.desc: ""โดยปกติคือการเฆี่ยนอย่างรุนแรง อย่างไรก็ตาม ข้ายินดีที่จะยกเว้นโทษนี้หากสามารถจ่ายค่าปรับที่เหมาะสมได้""
 ep3_laamp_flavor.0020.a: "ข้าจะจ่ายค่าปรับให้ [thieving_follower.GetFirstNameNoTooltip]"
 ep3_laamp_flavor.0020.b: "[thieving_follower.GetFirstNameNoTooltip] ต้องยอมรับโทษทัณฑ์"
 ep3_laamp_flavor.0020.c: "ได้โปรดเถิด ท่าน [town_leader.GetTitledFirstNameNoTooltip] ข้าขอร้อง ปล่อย [thieving_follower.GetFirstNameNoTooltip] ไปเถิด!"
 ep3_laamp_flavor.0020.d: "เราขอตัดสินด้วยการประลอง!"
 thievery_rivalry_opinion: "[CHARACTER.GetShortUIName|U] และ [TARGET_CHARACTER.GetShortUIName] เกิดความขุ่นเคืองต่อกันจากการลักเล็กขโมยน้อย"
 ep3_laamp_flavor.0020.d.tt.success: "เราชนะการประลอง และ [thieving_follower.GetFirstName] พ้นผิด"
 ep3_laamp_flavor.0020.d.tt.fail: "การต่อสู้พ่ายแพ้ และ [thieving_follower.GetFirstName] ต้องชดใช้"
 thievery_helper_opinion: "[CHARACTER.GetShortUIName|U] และ [TARGET_CHARACTER.GetShortUIName] ผูกสัมพันธ์กันเมื่อ [CHARACTER.GetShortUIName] ช่วยให้ [TARGET_CHARACTER.GetShortUIName] รอดพ้นจากผลการกระทำของ[TARGET_CHARACTER.GetHerHis]"
 thievery_helper_opinion_corresponding: "[TARGET_CHARACTER.GetShortUIName] และ [CHARACTER.GetShortUIName|U] ผูกสัมพันธ์กันเมื่อ [CHARACTER.GetShortUIName] ช่วยให้ [TARGET_CHARACTER.GetShortUIName] รอดพ้นจากผลการกระทำของ[TARGET_CHARACTER.GetHerHis]"

 ep3_laamp_flavor.0030.t: "ฝันหวาน"
 ep3_laamp_flavor.0030.desc: "โต๊ะจัดเลี้ยงทอดยาวสุดลูกหูลูกตา! บัลลังก์สูงของข้าเปล่งประกายด้วยทับทิมและไพลิน! แขกเหรื่อจากสี่มุมโลกเฉลิมฉลองการครองราชย์อันรุ่งเรืองครบยี่สิบปีของข้า\n\n“ขอถวายน้ำทิพย์หวานอีกถ้วยไหมพ่ะย่ะค่ะ จักรพรรดิผู้รุ่งโรจน์?” จางวางเอก [dream_friend.GetFirstName] ทูลถาม พลางถวายถ้วยอันงดงาม ข้ากระดกดื่มจากถ้วยนั้นอย่างกระหาย\n\n“จงเต้นรำให้ข้าดู เจ้าคนโง่!” ข้าตะคอกใส่ [dream_rival.GetFirstName] ผู้ตกอับและต่ำต้อย นี่คือชะตากรรมของผู้ที่ขวางทางข้า ข้าหลับตาลงเพียงครู่เดียว\n\nเมื่อลืมตาขึ้นอีกครั้ง ข้าพบว่าตนนอนอยู่บนเตียงฟางที่คุ้นเคยเป็นอย่างดี ข้าถอนหายใจ เป็นเพียงความฝัน"
 ep3_laamp_flavor.0030.a: "ข้าจะ ทำให้ฝันเป็นจริง"
 ep3_laamp_flavor.0030.b: "เป็นฝันที่ดีตราบเท่าที่มันยังอยู่"
 ep3_laamp_flavor.0030.c: "ข้ายินดีที่หลุดพ้นจากชีวิต เช่นนั้น"
 dream_ambitious: "ความทะเยอทะยานดุจราชัน"
 dream_envious: "ความริษยาในแผ่นดิน"
 dream_content: "อิสรภาพจากภาระหน้าที่"

 ep3_laamp_flavor.0040.t: "บุตรขุนนางหลงทาง"
 ep3_laamp_flavor.0040.desc: "ขณะลาดตระเวนใน [location_scope.GetTerrain.GetNameNoTooltip] ของ [ROOT.Char.GetCurrentLocation.GetName] ข้าเหลือบเห็นร่างหนึ่งกำลังให้น้ำม้าอยู่ริมทาง เมื่อเราเข้าใกล้ ข้าจำ [runaway_child.GetHerHim] ได้ว่าเป็น [runaway_child.GetFullName], [runaway_child.Custom('GetDaughterSon')] ของ [local_ruler.GetTitledFirstName] ดวงตาของ [runaway_child.GetHerHis|U] สะท้อนความกลัวและความสับสน และเสื้อผ้าเนื้อดีของ [runaway_child.GetHerHis] ก็ขาดรุ่งริ่งและสกปรก\n\nหลังจากการสนทนาสั้นๆ และตึงเครียด ข้าได้เรียนรู้ว่า [runaway_child.GetFirstNameNoTooltip] หนีออกจากบ้านหลังจากการทะเลาะวิวาทในครอบครัวบางอย่าง ซึ่งข้าพยายามทำความเข้าใจรายละเอียดได้ยาก ไม่นานนัก [runaway_child.GetSheHe] ก็หลงทางอย่างไร้ความหวังในถิ่นทุรกันดาร น้ำตาคลอเบ้า [runaway_child.GetFirstNameNoTooltip] ถามว่า [runaway_child.GetSheHe] สามารถเดินทางไปกับเราได้หรือไม่ หรืออย่างน้อยที่สุดก็ช่วยคุ้มกัน [runaway_child.GetHerHim] กลับไปหา [local_ruler.GetMotherFather] ของ [runaway_child.GetHerHis]"
 ep3_laamp_flavor.0040.a: "มากับเราเถิด เราจะพากลับบ้าน"
 ep3_laamp_flavor.0040.b: "ยินดีต้อนรับสู่คณะอันร่าเริงของเรา"
 ep3_laamp_flavor.0040.c: "ข้าตั้งตารอที่จะเขียนจดหมายเรียกค่าไถ่"
 stole_my_child_opinion: "ขโมยลูกข้าไป"
 returned_my_child_opinion: "ส่งคืนลูกข้าอย่างปลอดภัย"

 ep3_laamp_flavor.0050.t: "ผู้ใช้มนตร์ดำ"
 ep3_laamp_flavor.0050.desc: "ด้วยความที่นอนไม่หลับ การเดินเล่นยามค่ำคืนใน [location_scope.GetTerrain.GetNameNoTooltip|l] ทำให้จิตใจของข้าล่องลอยไปอย่างไร้จุดหมาย เมื่อข้าได้ยิน... #EMP เสียงสวดมนต์#!?\n\nเมื่อตามเสียงไปยังต้นตอ ข้าพบวงคบเพลิงส่องสว่างเผยให้เห็นภาพอันน่าพิศวงและน่าไม่สบายใจ\n\nชายในชุดคลุม ดวงตาจับจ้องอยู่ที่ตำราเวทมนตร์ของเขา กำลังเอ่ยชื่อปิศาจที่เขาพยายามจะผูกมัดไว้ใต้อาณัติ เบื้องหน้าเขาคือวงกลมพิธีกรรมที่วาดด้วยชอล์ก ซับซ้อน งดงาม และบ้าคลั่งอย่างที่สุด — ชายผู้นี้คือ [Glossary('เนโครแมนเซอร์', 'NECROMANCER_GLOSS' )] อย่างชัดเจน!\n\nด้วยความตกใจ ข้าสะดุดและล้มลง ส่งเสียงดังประกาศการมาถึงของข้า"
 ep3_laamp_flavor.0050.a: "เจ้าจงหยุดเวทมนตร์อันชั่วร้ายนี้เดี๋ยวนี้!"
 ep3_laamp_flavor.0050.b: "น่าสนใจ! ท่านสอนอะไรข้าเกี่ยวกับปิศาจวิทยาได้บ้าง?"
 ep3_laamp_flavor.0050.c: "ท่านช่วยสอนศาสตร์มืดให้แก่ [player_heir_scope.Custom('GetDaughterSon')] ของข้า, [player_heir_scope.GetFirstNameNoTooltip], ได้หรือไม่?"
 ep3_laamp_flavor.0050.d: "น่าสะพรึงกลัว! ข้าต้องหนี!"
 learned_in_demonology: "เรียนรู้ด้านปิศาจวิทยา"
 ep3_laamp_flavor.0050.d.tt.success: "ผู้ใช้มนตร์ดำอันชั่วร้ายถูกขับไล่ไป"
 ep3_laamp_flavor.0050.d.tt.fail: "ผู้ใช้มนตร์ดำมีพลังเหนือกว่า บีบให้ท่านต้องล่าถอย"
 NECROMANCER_GLOSS: "แม้จะมีชื่อ เช่นนั้น เวทมนตร์เรียกผีในประวัติศาสตร์ครอบคลุมศาสตร์ลี้ลับหลากหลายแขนงของศาสนาอับราฮัม โดยทั่วไปเกี่ยวข้องกับการวิงวอนต่อวิญญาณที่ศาสนจักรพิจารณาว่า #EMP ไม่สะอาด#! ไม่ว่าจะเป็นปิศาจ คนตาย หรือบุคคลในพระคัมภีร์ที่ไม่ชัดเจนนัก"

 ep3_laamp_flavor.0060.t: "ตัวถ่วง"
 ep3_laamp_flavor.0060.desc: "“พอได้แล้วกับเสียงคร่ำครวญไม่หยุดหย่อนของเจ้า! ข้าก็ไม่ได้กินอะไรมาหลายวันเหมือนกัน และข้าไม่มีสิทธิ์ที่จะถูกหามไปไหนมาไหนเหมือนเจ้าชาย!” [follower.GetFirstName] ทุบกำปั้น [follower.GetHerHis] ลงบนกรงเหล็กของกรงขังเทียมม้าของ [prisoner.GetFirstNamePossessive]\n\n“เรากำลังอดอยากและเจ้าหนูนั่นก็สิ้นเปลืองเสบียงของเราโดยเปล่าประโยชน์ เราควรแขวนคอ [prisoner.GetHerHim] เสียให้สิ้นเรื่อง” [follower.GetFirstNameNoTooltip] ชี้ไปยังต้นไม้ตายข้างหน้า"
 ep3_laamp_flavor.0060.a: "[prisoner.GetFirstNameNoTooltip] มีชีวิตอยู่นานพอแล้ว"
 ep3_laamp_flavor.0060.b: "ท่านไม่ต้องกลับบ้าน แต่ท่านอยู่ที่นี่ไม่ได้"
 ep3_laamp_flavor.0060.c: "นักโทษผู้นั้นมีค่าต่อข้า ปล่อย [prisoner.GetHerHim] ไว้"
 burdensome_prisoner_modifier: "ตัวถ่วง"
 
 ep3_camp_temperament.0001.t: "เพื่อเลี้ยงดูสหาย"
 ep3_camp_temperament.0001.desc: ""เราอาจจะหาเนื้อที่ดีที่สุดให้ท่านไม่ได้" เสียงของ [potential_friend.GetFirstNamePossessive] ทำให้ข้าสะดุ้ง พร้อมรอยยิ้มกว้างบนใบหน้าของ [potential_friend.GetHerHis] "แต่คนพเนจรย่อมเลือกไม่ได้"\n\n[potential_friend.GetSheHe|U] ยกถ้วยขึ้น และผายมือไปยังผู้ติดตามคนอื่นๆ ของข้า ซึ่งนั่งอยู่รอบกองไฟที่ส่องแสงริบหรี่ ถุงผลไม้สดเปิดอ้าอยู่ข้างๆ พวกเขา\n\n"อย่าคิดว่าเราไม่เห็นสิ่งที่ท่านทำเพื่อเรา" [potential_friend.GetSheHe] พูดต่อ เสียงเบาลง "เราทุกคนต้องทำหน้าที่ของตน""
 ep3_camp_temperament.0001.a: ""มากินด้วยกันเถิด!""
 ep3_camp_temperament.0001.b: ""เจ้าต้องวางยาพิษในนี้แน่!""
 ep3_camp_temperament.0001.c: "ข้าเอาไปขายเอาทองได้บ้าง..."
 ep3_camp_temperament.0001.d: ""สหายเอ๋ย #EMP เจ้า#! ช่างเป็นสมบัติล้ำค่าจริงๆ""
 ep3_camp_temperament.0001.e: ""ขอบใจในความพยายามของเจ้า""
 
 ep3_camp_temperament.0010.t: "ในทุกซอกมุม"
 ep3_camp_temperament.0010.desc.intro: "สายฝนบีบให้ผู้ติดตามส่วนใหญ่ของข้าไปหลบภัยใต้ [ROOT.Char.GetCurrentLocation.Custom('GetRandomAppropriateTree')] ต้นเดียวกัน [enemy.GetTitledFirstNamePossessiveNoTooltip] กำลังตะโกนโหวกเหวกอยู่กลางฝูงชน และข้าพยายามซ่อนตัว\n\n"ไอ้ [ROOT.Char.Custom2('InsultNoun', SCOPE.sC('enemy'))] นั่น ไอ้คนโง่เง่าไร้ประโยชน์สิ้นดี! ไม่เห็นหรือไรว่า [ROOT.Char.GetSheHe] ไม่มีความสามารถแม้ แต่จะปกครองค่ายของ [ROOT.Char.GetHerHis] เอง? แล้วเราจะหวังให้ [ROOT.Char.GetHerHim] ปกครองอะไรที่ใหญ่กว่าแอ่งน้ำได้อย่างไร?"\n\n"
 ep3_camp_temperament.0010.desc.spouse: "ข้าแทบไม่อยากเชื่อ คู่ครองของข้าเอง"
 ep3_camp_temperament.0010.desc.child: "ข้าแทบไม่อยากเชื่อ ลูกของข้าเอง"
 ep3_camp_temperament.0010.desc.friend: "ข้าแทบไม่อยากเชื่อ สหายรักของข้า"
 ep3_camp_temperament.0010.a: "ไม่... ไม่ใช่เจ้า"
 ep3_camp_temperament.0010.a.flavor: "#EMP แม้แต่เจ้าหรือ, [enemy.GetFirstNameNoTooltip]?#!"
 ep3_camp_temperament.0010.b: "ตอนนี้เจ้าทำงานให้ข้า"
 ep3_camp_temperament.0010.c: "เจ้าจะต้องชดใช้"
 ep3_camp_temperament.0010.d: "อาหารบางอย่างอาจโน้มน้าวพวกเขาได้"
 ep3_camp_temperament.0010.e: "พวกเขาไม่จำเป็นต้องชอบข้า"
 ep3_camp_temperament_0010_tt: "ท่านได้รับโบนัสระดับ #positive_value ปานกลาง#! ให้กับ [GetScheme('murder').GetTypeName] และ [GetScheme('sway').GetTypeName] [schemes|E] ที่เป้าหมายคือ [enemy.GetName]"
 ep3_heartbreak_modifier: "ศัตรูผู้คุ้นเคย"
 ep3_heartbreak_modifier_desc: "ตัวละครนี้ถูกคนใกล้ชิดในครอบครัวนินทาว่าร้ายให้คนในค่ายฟัง"
 SCHEME_ET_TU_BRUTE: "ท่านล่วงรู้แผนการของ [target.GetShortUINamePossessiveNoTooltip]: $VALUE|+0=$"
 bribed_opinion: "ถูกติดสินบน"
 ep3_determined_modifier: "ขับเคลื่อนด้วยความแค้น"
 ep3_determined_modifier_desc: "ตัวละครนี้มุ่งมั่นที่จะกอบกู้ชื่อเสียงของตน ไม่ว่าจะต้องแลกด้วยอะไรก็ตาม"
 
 ep3_camp_temperament.0020.t: "คำบอกเล่า"
 ep3_camp_temperament.0020.desc: "ประตูเต็นท์ของข้าเปิดออก และ [secret_giver.GetTitledFirstName] ก็ยืนอยู่ตรงหน้าข้า [secret_giver.GetSheHe] โค้งคำนับเล็กน้อย แล้วเริ่มพูด: "ข้าขออภัยที่รบกวน [ROOT.Char.Custom('FormOfAddressForLiege')] แต่ข้านำข่าวที่ท่านอาจสนใจมาแจ้ง"\n\n"ข้ากำลังพักผ่อนอยู่ที่ [ROOT.Char.Custom('GetPubName')] ดื่มเหล้ากับกลุ่มคนที่เปิดเผยว่าตนเป็นคนรับใช้ของ [secret_owner.GetTitledFirstName]"\n\n"พวกเขาพูดถึงนายของตนอย่างไม่ตะขิดตะขวงใจ 'แล้ว [secret_owner.GetHerHim] เป็นอย่างไร?' ข้าถาม และก็สืบรู้ความลับของ [secret_owner.GetHerHis] มาเพื่อประโยชน์ของท่าน""
 ep3_camp_temperament.0020.a: ""ความลับคงเอาไป แต่งเรื่องได้ดีเยี่ยม...""
 ep3_camp_temperament.0020.b: ""เจ้าทำได้ดีมาก""
 ep3_camp_temperament.0020.c: ""เจ้าไปทำอะไรในโรงเตี๊ยม...?""
 ep3_camp_temperament.0020.d: ""บอกข้ามาเดี๋ยวนี้!""
 ep3_camp_temperament.0020.e: "นั่นเป็นเรื่องระหว่าง [secret_owner.GetTitledFirstNameNoTooltip] กับ [ROOT.Char.GetFaith.HighGodName]"
 ep3_camp_temperament_0020_d_tt: "ท่านได้รู้ [secret|E] ของ [secret_owner.GetShortUINamePossessive]"
 ep3_inspired_by_life: "แรงบันดาลใจจากชีวิตจริง"
 ep3_inspired_by_life_desc: "ตัวละครนี้ใช้ความลับที่รู้มาเขียนเรื่องราวที่น่าสนใจ"
 
 ep3_camp_temperament.0030.t: "กบฏ!"
 ep3_camp_temperament.0030.desc.intro: ""อา ท่าน [ROOT.Char.GetTitledFirstName] ช่างเป็นเกียรติที่ได้อยู่ร่วมกับท่านในค่ำคืนนี้" [cocky_follower.GetTitledFirstName] ทักทายข้าขณะที่ข้าเข้าใกล้กองไฟ [cocky_follower.GetSheHe|U] เป็นคนเดียวที่ยังคงดื่มอยู่รอบกองไฟ "ข้าขอร้องท่าน" [cocky_follower.GetSheHe] ชี้ไปที่หีบใบหนึ่งตรงข้ามกับ [cocky_follower.GetHerHim] และรอ จนกระทั่งข้านั่งลงจึงพูดต่อ:\n\n"มันดูไม่ดีเลยใช่ไหม? ทั้งค่ายดูเหมือนจะโกรธท่าน... และบางทีอาจมีเหตุผลสำหรับเรื่องนั้น"
 ep3_camp_temperament.0030.desc.no_food: "เมื่ออาหารใกล้หมด... ก็ไม่แน่""
 ep3_camp_temperament.0030.desc.other: "ท่านไม่คิด เช่นนั้นหรือ?""
 ep3_camp_temperament.0030.desc.outro: "\n\n"คงน่าเสียดายหากมีใครบางคน... ฉวยโอกาสนี้""
 ep3_camp_temperament.0030.a: ""อันที่จริง... เอ่อ... มันเป็นความผิดของ [bus_follower.GetShortUINamePossessiveNoTooltip]!""
 ep3_camp_temperament.0030.b: ""ข้าจะแสดงให้เจ้าดู!""
 ep3_camp_temperament.0030.b.success: "ท่านชนะการต่อสู้"
 ep3_camp_temperament.0030.b.failure: "ท่านแพ้การต่อสู้"
 ep3_camp_temperament.0030.c: ""เจ้าพูดว่ากระไรนะ?""
 ep3_camp_temperament.0030.d: ""พวกเจ้าทุกคนมีอิสระที่จะไป""
 ep3_camp_temperament.0030.e: ""จงแจกจ่ายทองคำนี้ให้แก่คนของเจ้า""
 ep3_poopy_pants: "ก่อกบฏล้มเหลว"
 ep3_poopy_pants_desc: "ตัวละครนี้ถูก ทำให้อับอายต่อหน้าสาธารณชนเมื่อพยายามก่อกบฏต่อผู้นำของตน"
 benevolent_to_mutiniers_opinion: "เมตตาต่อผู้ก่อกบฏ"
 
 ep3_camp_temperament.0040.t: "ผู้ติดตามผู้ภักดี"
 ep3_camp_temperament.0040.desc: ""สักครู่ ท่าน [ROOT.Char.GetTitleAsNameNoTooltip] ของข้า" [follower.GetTitledFirstName] หยุดข้าขณะที่ข้าสำรวจค่ายพัก [follower.GetSheHe|U] ยังคงหอบหายใจเมื่อ [follower.GetSheHe] กล่าวกับข้า [follower.Custom('quirk_pos_pp')]:\n\n"อย่าคิดว่าความพยายามของท่านไม่มีใครเห็น เหล่า [dummy_gender.GetWomenMen] ชื่นชมท่าน เด็กๆ แสร้งทำเป็นเหมือนท่านเมื่อพวกเขาเล่น และทั้งค่ายดูเหมือนจะคิดว่าท่านคือ [ROOT.Char.GetWomanMan] ที่ยิ่งใหญ่ที่สุดที่ยังมีชีวิตอยู่!"\n\n"ข้าปรารถนาที่จะช่วยเหลือท่านในแบบเดียวกับที่ท่านช่วยเหลือพวกเรา ข้ารู้ถึง... ความพยายามในปัจจุบันของท่าน และข้าเชื่อว่าข้าจะเป็นส่วนเสริมที่คู่ควร""
 ep3_camp_temperament.0040.a: ""เจ้าพูดถูก! ข้ายอดเยี่ยม!""
 ep3_camp_temperament.0040.b: ""ข้าจะจัดการเรื่องนี้ให้เสร็จ #EMP ด้วยตัวเอง#!""
 ep3_camp_temperament.0040.c: ""ช่างเป็นการแสดงความภักดีที่ยอดเยี่ยม!""
 ep3_camp_temperament.0040.d: ""ข้ายินดี""
 ep3_camp_temperament.0040.d.tt: "[follower.GetShortUIName|U] เข้ามาเติมช่อง [agent|E] ใหม่ $game_concept_success_chance_max_i$ [GetAgentSlotType( 'agent_devotee' ).GetName] ใน [scheme|E] [my_scheme.GetName] ต่อต้าน [my_scheme.GetTargetCharacter.GetTitledFirstName]"
 ep3_camp_temperament.0040.e: ""จง ทำให้ #EMP ทุกคน#! รู้ว่าข้ายอดเยี่ยมเพียงใด""
 devotee_agent_desc: "[recipient.GetShortUIName] คือ $agent_devotee$ ของท่าน"
 ep3_arrogant_schemer_modifier: "นักวางแผนผู้มีชื่อเสียง"
 ep3_arrogant_schemer_modifier_desc: "ชื่อเสียงที่ดีของตัวละครนี้ช่วยสนับสนุนแผนการส่วนตัวของพวกเขา"
 ep3_self_employed_scheme_modifier: "ดำเนินการด้วยตนเอง"
