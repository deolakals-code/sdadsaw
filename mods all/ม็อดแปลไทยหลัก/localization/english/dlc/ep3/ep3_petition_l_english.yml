 petition_liege_house_governorship_rights_tt: "เป็นเวลา #V 100#! ปี, [THIS.Title.GetBaseName] [house|E] [petition_vassal.GetHouse.GetBaseName] คะแนน [GetLaw('appointment_succession_law').GetName]: #P +250#!"
