 petition_liege_gold_liege_tt: "#X [liege|E] ของท่านไม่มีกำลังทรัพย์พอที่จะมอบ [gold_i|E][gold|E] แก่ท่านได้#!"
 
 petition_liege.9001.admin_request_court_position: "แต่งตั้งสมาชิกตระกูลของข้าฯ ให้ดำรงตำแหน่งในราชสำนัก"
 petition_liege.9001.petition_liege_governorship: "มอบหมายตำแหน่งผู้ปกครองมณฑลให้แก่สมาชิกตระกูลของข้าฯ"
 petition_liege.9001.admin_request_council: "พระราชทานตำแหน่งใน [council|E] แก่สมาชิก [house|E]"
 petition_liege.0101.t.court_position: "$petition_liege_header$ ตำแหน่งในราชสำนัก"
 petition_liege.0101.t.governorship: "$petition_liege_header$ ตำแหน่งผู้ปกครองมณฑล"
 petition_liege.0101.t.house_governorship_rights: "$petition_liege_header$ สิทธิ์ของตระกูลในการปกครองมณฑล"
 petition_liege.0101.desc.council_seat_family: "ข้า แต่ [petition_liege.GetLadyLord] ของข้าฯ โปรดให้ [petition_char.Custom2('RelationToMeShort', petition_char)] ของข้าฯ ได้เข้าร่วมในสภาของท่านด้วยเถิด"\n\n"ความสามารถของ [petition_char.GetHerHis|U] ถูกมองข้ามไป ในขณะที่ [petition_char.GetWomenMen] ที่ด้อยกว่ากลับได้รับการรับฟังในระดับสูงสุด [petition_char.GetSheHe] ยินดีที่จะแบ่งเบาภาระแห่งอาณาจักรในฐานะ [petition_char.Custom('GetCouncilPositionRequest')] ของท่าน""
 petition_liege.0101.desc.court_position: "ข้า แต่ [petition_liege.GetLadyLord] ของข้าฯ โปรดรับข้าฯ เข้ารับใช้ในราชสำนักของท่านด้วยเถิด"\n\n"ความสามารถของข้าฯ กำลังสูญเปล่า แทนที่จะได้ใช้รับใช้ผลประโยชน์ของท่าน""
 petition_liege.0101.desc.court_position_family: "ข้า แต่ [petition_liege.GetLadyLord] ของข้าฯ โปรดรับ [petition_char.GetName] เข้าสู่ราชสำนักของท่านด้วยเถิด"\n\n"[petition_char.GetSheHe|U] เป็นผู้มีความสามารถยิ่ง แต่ [petition_char.GetSheHe] จะทำได้ดียิ่งกว่าหากได้รับใช้ท่าน แทนที่จะรับใช้ข้าฯ""
 petition_liege.0101.desc.governorship: "ข้า แต่ [petition_liege.GetLadyLord] ของข้าฯ ท่านจะกรุณาพระราชทานตำแหน่งผู้ปกครองมณฑลแก่ข้าฯ ได้หรือไม่?"\n\n"ข้าฯ กระตือรือร้นยิ่งนักที่จะรับใช้อาณาจักร และบอกตามตรงว่าความสามารถของข้าฯ กำลังสูญเปล่า หากมีมณฑลเป็นของตนเอง ข้าฯ จะสามารถรับใช้ผลประโยชน์ของท่านได้""
 petition_liege.0101.desc.governorship_family: "ข้า แต่ [petition_liege.GetLadyLord] ของข้าฯ ท่านจะกรุณาพระราชทานตำแหน่งผู้ปกครองมณฑลแก่ [petition_char.GetName] ได้หรือไม่?"\n\n"[petition_char.GetSheHe|U] กระตือรือร้นยิ่งนักที่จะรับใช้อาณาจักร และบอกตามตรงว่าเป็นการสูญเปล่าที่จะให้ [petition_char.GetHerHim] รอคอยอยู่กับข้าฯ [petition_char.GetSheHe|U] ควรมีมณฑลเป็นของ [petition_char.GetHerHis] เองเพื่อรับใช้ผลประโยชน์ของท่าน""
 petition_liege.0101.desc.house_governorship_rights: "ข้า แต่ [petition_liege.GetLadyLord] ของข้าฯ ท่านจะกรุณาพระราชทานสิทธิ์แก่ตระกูล [petition_vassal.GetHouse.GetBaseName] ในการปกครอง [petition_vassal.GetPrimaryTitle.GetTierAsNameNoTooltip] [petition_vassal.GetPrimaryTitle.GetAdjective] ต่อไปได้หรือไม่?"\n\n"ตระกูลของข้าฯ ได้บริหารจัดการพื้นที่นั้นเป็นอย่างดีในฐานะข้าในบังคับผู้ภักดีของท่าน และปรารถนาเพียงแค่จะดำเนินต่อไป""
 petition_liege.0101.accept.council_seat_family: "ตกลง [petition_char.GetFirstNameNoTooltip] จะได้รับตำแหน่งของเจ้า"
 petition_liege.0101.accept.council_seat_family_occupied: "[petition_char.GetFirstNameNoTooltip] จะมาแทนที่ [second_party.GetTitledFirstNameNoTooltip] ในฐานะ [second_party.GetCouncilTitle] ของข้า"
 petition_liege.0101.accept.court_position: "ตกลง เจ้าจงรับใช้ข้าเถิด"
 petition_liege.0101.accept.court_position_family: "ตกลง [petition_char.GetSheHe] จงรับใช้ข้าเถิด"
 petition_liege.0101.accept.governorship: "เจ้าจงปกครอง [duchy_governorship.GetNameNoTierNoTooltip]"
 petition_liege.0101.accept.governorship_family: "[petition_char.GetFirstNameNoTooltip|U] จงปกครอง [duchy_governorship.GetNameNoTierNoTooltip]"
 petition_liege.0101.accept.house_governorship_rights: "ตระกูล [petition_vassal.GetHouse.GetBaseNameNoTooltip] จะได้รับสิทธิ์ก่อน"
 petition_liege.0101.desc.admin_request_council: "$petition_liege.0101.desc.court_position$"
 petition_liege_house_province_rights_value_desc: "คำร้องขอสิทธิ์ของตระกูลในการปกครองมณฑล"
