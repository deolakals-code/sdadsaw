 petition_liege_council_seat_family_desc: "ร้องขอให้ [ROOT.Char.GetLiege.GetTitledFirstName] พระราชทานตำแหน่งใน [council|E] ของ [ROOT.Char.GetLiege.GetHerHis] แก่สมาชิก [house|E]"
