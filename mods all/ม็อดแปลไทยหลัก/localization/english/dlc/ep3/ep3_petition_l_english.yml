 council_appointment_toast_desc_liege_family: "บัดนี้ [petition_char.GetTitledFirstNameNoTooltip] คือ [petition_char.GetCouncilTitle] ของท่าน"
 council_appointment_toast_desc_vassal_family: "บัดนี้ [petition_char.GetTitledFirstNameNoTooltip] คือ [petition_char.GetCouncilTitle] ของ [petition_liege.GetTitledFirstNamePossessiveNoTooltip]"
 ### GOLD
 petition_liege_gold: "ทองคำ"
