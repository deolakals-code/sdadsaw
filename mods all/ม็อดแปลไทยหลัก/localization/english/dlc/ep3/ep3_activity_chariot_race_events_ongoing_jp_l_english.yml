l_english: 
 # Befriend
 chariot_race_ongoing_jp.0100.t: "ภาพที่ร่วมชม"
 chariot_race_ongoing_jp.0100.desc.intro: "ขณะที่ฝูงชนโห่ร้องอย่างกระวนกระวาย สายตาของข้าจับจ้องไปที่ [ROOT.Char.Custom2('RelationToMeShort', intent_target)] ของข้า, [intent_target.GetTitledFirstName],"
 chariot_race_ongoing_jp.0100.desc.courtier: "นั่งอยู่บนอัฒจันทร์อันซอมซ่อในส่วนของราชสำนัก"
 chariot_race_ongoing_jp.0100.desc.count: "นั่งอยู่บนอัฒจันทร์พอประมาณ รายล้อมด้วยข้ารับใช้ของ[intent_target.GetHerHis]"
 chariot_race_ongoing_jp.0100.desc.duke: "นั่งอยู่ท่ามกลางคณะของ[intent_target.GetHerHis] บนอัฒจันทร์ที่ดีกว่าแห่งหนึ่ง"
 chariot_race_ongoing_jp.0100.desc.king: "รายล้อมด้วยคณะของ[intent_target.GetHerHis] ซึ่งแผ่ขยายไปทั่วอัฒจันทร์ที่ดีที่สุดหลายแห่ง"
 chariot_race_ongoing_jp.0100.desc.important: "นั่งอย่างสบายๆ ในพลับพลาหลวงของ[ROOT.Char.GetTopLiege.GetTitleAsNamePossessive]"
 chariot_race_ongoing_jp.0100.desc.important_liege: "ผู้ ซึ่งนั่งอยู่ด้านหนึ่งในพลับพลาหลวงของข้า"
 chariot_race_ongoing_jp.0100.desc.liege: "ขนาบข้างด้วยคนสนิทในพลับพลาหลวงของ[intent_target.GetHerHis]"
 chariot_race_ongoing_jp.0100.desc.target_personality.fan: "[intent_target.GetWomanMan] นั่งอยู่บนขอบที่นั่งของ[intent_target.GetHerHis] รอคอยการแข่งขันด้วยความสนใจอย่างใจจดใจจ่อ"
 chariot_race_ongoing_jp.0100.desc.target_personality.wager: "ก่อนหน้านี้ ข้าได้ยินคนพูดว่า[intent_target.GetSheHe]ได้วางเดิมพันก้อนโตกับ [intent_target.MakeScope.Var('wager_target').Char.GetFirstName] แห่งทีม[intent_target.Custom('GetChariotTeamColorPlural')] ว่าจะ[intent_target.Custom('GetWinPlaceShow')]"
 chariot_race_ongoing_jp.0100.desc.target_personality.bored: "[intent_target.GetWomanMan] พัด[intent_target.GetHerselfHimself]อย่างเฉื่อยชา มองไปรอบๆ ฮิปโปโดรมโดยไม่ค่อยสนใจการแข่งขัน"
 chariot_race_ongoing_jp.0100.desc.target_personality.fallback: "[intent_target.GetWomanMan]ผู้นั้นกำลังสนทนากับผู้ชมใกล้เคียงขณะที่พวกเขากำลังหารือถึงโอกาสของนักแข่งของ[intent_target.GetHerHIs]"
 chariot_race_ongoing_jp.0100.desc: "\n\nขณะที่ขบวน [Glossary( 'เทธริปปา', 'QUADRIGA_GLOSS')] เคลื่อนผ่านอัฒจันทร์ของเรา ศีรษะของ[intent_target.GetHerHis]หันมาทางข้าเพื่อมองตามพวกเขาไป"
 chariot_race_ongoing_jp.0100.b.fan: ""ให้เกียรติผู้อุปถัมภ์ของเจ้าสิ! โบกมือ! #EMP เจ้า#! กำลังเล่นอะไรอยู่?!""
 chariot_race_ongoing_jp.0100.b.wager: ""สู้เข้า, #EMP [intent_target.MakeScope.Var('wager_target').Char.GetFirstNameNoTooltip]#!! ทีม[intent_target.Custom('GetChariotTeamColorPlural')]! ทีม[intent_target.Custom('GetChariotTeamColorPlural')]!""
 chariot_race_ongoing_jp.0100.b.bored: "หาวได้จังหวะพอดี พร้อมกลอกตา"
 chariot_race_ongoing_jp.0100.b: "ส่งบันทึกให้[intent_target.GetHerHim]"
 chariot_race_ongoing_jp.0100.b.tt.success: "[intent_target.GetFirstNameNoTooltip] ชอบท่าทีของท่าน"
 chariot_race_ongoing_jp.0100.b.tt.neutral: "[intent_target.GetFirstNameNoTooltip] ไม่สนใจท่าน"
 chariot_race_ongoing_jp.0100.b.tt.failure: "[intent_target.GetFirstNameNoTooltip] ไม่แยแสท่าน"
 chariot_race_ongoing_jp.0100.d.best.tt: "[intent_target.GetTitledFirstName] มีที่นั่งที่ดีที่สุดแห่งหนึ่งอยู่แล้ว"
 chariot_race_ongoing_jp.0100.d.better.tt: "[intent_target.GetTitledFirstName] มีที่นั่งที่ดีกว่าท่านอยู่แล้ว"
 chariot_race_ongoing_jp.0100.d: "ข้าจะกวักมือเรียก[intent_target.GetHerHim]มา ที่นั่งตรงนี้ดีกว่า!"
 chariot_race_ongoing_jp.0100.d.host_flavor: "ใครเล่าจะต้านทานที่นั่งในคาทิสมาได้?"
 chariot_race_ongoing_jp.0100.d.tt.success: "[intent_target.GetFirstNameNoTooltip] ปลื้มปีติอย่างยิ่ง"
 chariot_race_ongoing_jp.0100.d.tt.partial_success: "[intent_target.GetFirstNameNoTooltip] รู้สึกเป็นเกียรติ"
 chariot_race_ongoing_jp.0100.d.tt.failure: "[intent_target.GetFirstNameNoTooltip] เพียงรู้สึกขอบคุณ"
 chariot_race_ongoing_jp.0100.d.tt.critical_failure: "[intent_target.GetFirstNameNoTooltip] ไม่สนใจท่าน"
 chariot_race_ongoing_jp.0100.e: "การพยักหน้ารับรู้ก็น่าจะเพียงพอแล้ว"
 chariot_race_ongoing_jp.0100.e.host: "การพยักหน้ารับรู้สามารถไปได้ไกล"

 chariot_race_ongoing_jp.0200.t: "การผสมผสานของจักรวรรดิ"
 chariot_race_ongoing_jp.0200.desc.intro: "ท่ามกลางอัฒจันทร์คือเหล่าข้าในบังคับของจักรวรรดิ ขุนนาง และผู้ติดตามมากมาย ทุกคนมาที่นี่เพื่อชมการแข่งขันตามหน้าที่ แต่แท้จริงแล้ว ที่นี่เป็นหนึ่งในสถานที่ที่ดีที่สุดในจักรวรรดิเพื่อทำข้อตกลง ขยายอิทธิพล และอาจไต่เต้าขึ้นสู่ตำแหน่ง\n\n[ROOT.Char.Custom2('RelationToMeShort', other)] ของข้า, [other.GetFirstName],"
 chariot_race_ongoing_jp.0200.desc.same_rank_ruler: "[other.GetTitleAsName] เช่นเดียวกับข้าในราชการของ[other.GetTopLiege.GetTitleAsNamePossessiveNoTooltip], $chariot_race_ongoing_jp.0200.desc.party_intro$ เปิดโอกาสให้หารือ #EMP เรื่องเร่งด่วน#! ที่ [ROOT.Char.GetPrimaryTitle.GetNameNoTier] และ [other.GetPrimaryTitle.GetNameNoTier] กำลังเผชิญ"
 chariot_race_ongoing_jp.0200.desc.same_rank_courtier: "นักไต่เต้าทางสังคม เช่นเดียวกับข้าที่กำลังรอโอกาสของ[other.GetHerHis] นั่งอยู่ใกล้ๆ — บางทีเราอาจเป็นประโยชน์ต่อกันได้..."
 chariot_race_ongoing_jp.0200.desc.higher_rank: "$chariot_race_ongoing_jp.0200.desc.landed_intro$ $chariot_race_ongoing_jp.0200.desc.party_intro$ และ แม้ว่า[other.GetSheHe]จะไม่ใช่[other.GetWomanMan]ผู้ยิ่งใหญ่แห่งอาณาจักร แต่ [other.GetPrimaryTitle.GetNameNoTier] ก็อาจให้ #EMP บางสิ่ง#! ที่เป็นประโยชน์แก่ [ROOT.Char.GetPrimaryTitle.GetNameNoTier] ได้..."
 chariot_race_ongoing_jp.0200.desc.lower_rank: "$chariot_race_ongoing_jp.0200.desc.landed_intro$ $chariot_race_ongoing_jp.0200.desc.party_intro$ เปิดโอกาสอันหาได้ยากที่จะได้คลุกคลีกับผู้มีอำนาจ — [other.GetPrimaryTitle.GetNameNoTierPossessive] มีอิทธิพลในจักรวรรดิ #EMP มากกว่า#! [ROOT.Char.GetPrimaryTitle.GetNameNoTier] อย่างยิ่ง"
 chariot_race_ongoing_jp.0200.desc.lower_rank_courtier: "เป็นเพียงนักไต่เต้าทางสังคมที่กำลังรอโอกาสของ[other.GetHerHis] นั่งอยู่ใกล้ๆ — แม้ แต่สัตว์ที่ต่ำต้อยที่สุดก็ยังเป็นที่รู้กันว่ามีประโยชน์ของมัน..."
 chariot_race_ongoing_jp.0200.desc.landed_intro: "[other.GetTitleAsName]ในราชการของ[other.GetTopLiege.GetTitleAsNamePossessiveNoTooltip],"
 chariot_race_ongoing_jp.0200.desc.party_intro: "ได้จับจองอัฒจันทร์ใกล้เคียงสำหรับคณะของ[other.GetHerHis],"
 chariot_race_ongoing_jp.0200.a: "ข้ามั่นใจว่าเราสามารถเรียนรู้จากกันและกันได้มาก"
 chariot_race_ongoing_jp.0200.b: "ข้าคงหาเพื่อนบ้านที่ดีกว่านี้ไม่ได้อีกแล้ว!"
 chariot_race_ongoing_jp.0200.b.success: "[other.GetFirstNameNoTooltip] รู้สึกพึงพอใจ"
 chariot_race_ongoing_jp.0200.b.partial_success: "[other.GetFirstNameNoTooltip] รู้สึกยินดี"
 chariot_race_ongoing_jp.0200.b.failure: "[other.GetFirstNameNoTooltip] รู้สึกงุนงง"
 chariot_race_ongoing_jp.0200.c: "ข้าโชคดีนักที่มีเพื่อนบ้านงาม เช่นนี้"
 chariot_race_ongoing_jp.0200.c.success: "[other.GetFirstNameNoTooltip] รู้สึกพึงพอใจ"
 chariot_race_ongoing_jp.0200.c.partial_success: "[other.GetFirstNameNoTooltip] รู้สึกยินดี"
 chariot_race_ongoing_jp.0200.c.failure: "[other.GetFirstNameNoTooltip] รู้สึกงุนงง"
 chariot_race_ongoing_jp.0200.d: "วงเงินสินเชื่อมักเป็นที่ชื่นชมเสมอ"
 chariot_race_ongoing_jp.0200.d.tt: "[rank|E]ของท่านต้องแตกต่างจากของ[other.GetTitledFirstNamePossessive]"
 chariot_race_ongoing_jp.0200.e: "หนี้สินเปิดประตูได้หลายบาน หากจัดการอย่างเหมาะสม"
 chariot_race_ongoing_jp.0200.f: "เป็นสถานที่ที่ดีในการแลกเปลี่ยนความลับ"
 chariot_race_ongoing_jp.0200.f.available_tt: "ตัวเลือกนี้มีให้ เนื่องจากท่านรู้ความลับ[secret|E] [given_secret.GetName] ของ[given_secret.GetOwner.GetTitledFirstNamePossessive]"
 chariot_race_ongoing_jp.0200.f.tt: "[other.GetTitledFirstName] อาจเปิดเผย[secret|E]ให้ท่านเป็นการตอบแทน"
 chariot_race_ongoing_jp.0200.f.success: "[other.GetTitledFirstName] แลกเปลี่ยนความลับ"
 chariot_race_ongoing_jp.0200.f.failure: "[other.GetTitledFirstName] ไม่เปิดเผยสิ่งใด"
 chariot_race_ongoing_jp.0200.g: "การรับใช้ของข้าสามารถเปิดประตูให้[other.GetHerHim]ได้"
 chariot_race_ongoing_jp.0200.h: "ข้าอยากจะชมการแข่งขันมากกว่า"

 chariot_race_ongoing_jp.0201.t: "สังคมชั้นสูง"
 chariot_race_ongoing_jp.0201.desc.intro: "ขณะที่มวลชนเบียดเสียดกันบนอัฒจันทร์ และเหล่าขุนนางเคลื่อนตัวไปตามส่วนที่นั่งพิเศษของตน ที่นี่ใน [Glossary( 'คาทิสม่า', 'KATHISMA_GLOSS')] เราสามารถเพลิดเพลินกับความสงบได้อย่างเมตตา เหล่าข้ารับใช้ที่ถือเครื่องดื่มทุกชนิดรอคอยตามความต้องการของเรา ขณะที่นักแข่งรถม้าดำเนินกลอุบายอันตรายอยู่เบื้องล่าง\n\n"
 chariot_race_ongoing_jp.0201.desc.emperor: "ในบรรดาผู้ที่มาร่วมกับข้าในห้องส่วนตัววันนี้คือ[ROOT.Char.Custom2('RelationToMeShort', other)]ของข้า [other.GetTitledFirstName] เห็นได้ชัดว่ากำลังเพลิดเพลินกับการเข้าถึงข้าเป็นพิเศษของ[other.GetHerHis] และสิ่งที่สื่อถึง"
 chariot_race_ongoing_jp.0201.desc.other_emperor: "ข้าโชคดีที่มีที่นั่งของตัวเองในพลับพลาของ[ROOT.Char.GetTopLiege.GetTitleAsNamePossessiveNoTooltip] — โอกาสอันเป็นที่ปรารถนาที่จะประจบสอพลอ[ROOT.Char.Custom2('RelationToMeShort', other)]ของข้า"
 chariot_race_ongoing_jp.0201.desc.other: "ในบรรดาผู้ที่ได้รับสิทธิ์เข้าถึงคือ [ROOT.Char.Custom2('RelationToMeShort', other)] ของข้า, [other.GetTitledFirstName], ผู้นั่งอยู่ใกล้ๆ และเห็นได้ชัดว่ากำลังเพลิดเพลินกับความพิเศษนี้"
 chariot_race_ongoing_jp.0201.desc: "บางที[other.GetSheHe]อาจต้องการสนทนา..."
 chariot_race_ongoing_jp.0201.a: "คนเหล่านี้คือคนประเภทที่ดีที่สุด"
 chariot_race_ongoing_jp.0201.b: "มานี่สิ [other.GetFirstNameNoTooltip], มานั่งข้างข้า"
 chariot_race_ongoing_jp.0201.b.tt: "ตัวเลือกนี้มีให้ เพราะท่านคือ[THIS.Char.GetTitleAsNameNoTooltip|V]"
 chariot_race_ongoing_jp.0201.c: "เป็นสถานที่ที่ดีในการแลกเปลี่ยนความลับ"
 chariot_race_ongoing_jp.0201.d: "ข้าคิดว่าเราควรจะมีพลับพลาเป็นของเราเอง อันที่จริง"
 chariot_race_ongoing_jp.0201.e: "การสนทนาแทนที่จะเพลิดเพลินกับทิวทัศน์นี้จะเป็นเรื่องน่าเศร้า"
 chariot_race_ongoing_jp.0201.f: "นี่คือเพื่อนร่วมทางที่ดีที่สุด!"
 chariot_race_ongoing_jp.0201.h: "วันนี้ท่านช่างงามผุดผาด, [other.GetFirstNameNoTooltip]"

 chariot_race_ongoing_jp.0300.t: "การเข้าถึง"
 chariot_race_ongoing_jp.0300.desc.intro: "แม้ว่าพวกเราเหล่าขุนนางจะมีอัฒจันทร์ที่ดีที่สุดในฮิปโปโดรม แต่มันก็เทียบไม่ได้กับที่นั่งอันโอ่อ่าของ [Glossary( 'คาทิสม่า', 'KATHISMA_GLOSS')] และทุกสิ่งที่มันเป็นตัวแทน\n\nนอกเหนือจากครอบครัวใกล้ชิดของ[host.GetHerHis]แล้ว [host.GetTitleAsNameNoTooltip]ยังเป็นที่รู้กันว่าให้สิทธิ์เข้าถึงแก่ผู้ที่ได้รับความโปรดปรานจาก[host.GetHerHis] หรือผู้ที่สามารถบิดแขน[host.GetHerHis]ได้..."
 chariot_race_ongoing_jp.0300.a: "ข้าจะเพียงแค่ #EMP ขอ#!."
 chariot_race_ongoing_jp.0300.a.tt: "[THIS.Char.GetShortUIName|U] จะเข้าสู่คาทิสมา"
 chariot_race_ongoing_jp.0300.a.success: "[host.GetFirstNameNoTooltip] อนุญาตให้ท่านเข้าถึง"
 chariot_race_ongoing_jp.0300.a.failure: "[host.GetFirstNameNoTooltip] ปฏิเสธ"
 chariot_race_ongoing_jp.0300.b: "ของขวัญสามารถเปิดประตูได้หลายบาน"
 chariot_race_ongoing_jp.0300.b.success: "[host.GetTitledFirstName] ยอมรับ"
 chariot_race_ongoing_jp.0300.b.failure: "[host.GetTitledFirstName] ปฏิเสธ"
 chariot_race_ongoing_jp.0300.c: "โชคดีที่ [host.GetSheHe] #EMP เป็นหนี้#! ข้า"
 chariot_race_ongoing_jp.0300.d: "ชิ ข้าจะไม่ยอมประจบประแจง"

 chariot_race_ongoing_jp.0301.t: "การขอเข้าถึง"
 chariot_race_ongoing_jp.0301.desc.intro: "แม้ว่าเหล่าขุนนางจะมีอัฒจันทร์ที่ดีที่สุดในฮิปโปโดรม แต่มันก็เทียบไม่ได้กับที่นั่งอันโอ่อ่าของ [Glossary( 'คาทิสม่า', 'KATHISMA_GLOSS')] ของข้า และทุกสิ่งที่มันเป็นตัวแทน\n\nแต่ละคนต่างปรารถนาที่จะได้ที่นั่งบนนี้ และดูเหมือนจะไม่มีใครมากไปกว่า [weasel.GetName],"
 chariot_race_ongoing_jp.0301.desc.ask: "ผู้ ซึ่งได้ยื่นบันทึกวิงวอนใส่มือของทหารรักษาพระราชวัง..."
 chariot_race_ongoing_jp.0301.desc.gold: "\n\nแต่ ข้าได้ยินมาว่า[weasel.GetSheHe]เป็น[weasel.GetWomanMan]ที่ร่ำรวยทีเดียว"
 chariot_race_ongoing_jp.0301.desc.hook: "ผู้ ซึ่งกำลังใช้หนี้ที่ข้ามีต่อ[weasel.GetHerHim]ด้วยความหยาบคายตามแบบฉบับ..."
 chariot_race_ongoing_jp.0301.a: "ก็ได้ ให้[weasel.GetHerHim]เข้ามา"
 chariot_race_ongoing_jp.0301.b: "สิทธิพิเศษ เช่นนี้ย่อมมีต้นทุนบางอย่าง..."
 chariot_race_ongoing_jp.0301.b.success: "[weasel.GetTitledFirstName] ยอมจ่าย"
 chariot_race_ongoing_jp.0301.b.failure: "[weasel.GetTitledFirstName] ปฏิเสธ"
 chariot_race_ongoing_jp.0301.b.tt: "[weasel.GetTitledFirstName] ไม่สามารถจ่ายค่าของขวัญได้ #weak (@gold_icon![THIS.Char.MakeScope.ScriptValue('minor_gold_value')|0])#!"
 chariot_race_ongoing_jp.0301.c: "ข้าคิดว่าข้าคงไม่มีทางเลือกมากนัก..."
 chariot_race_ongoing_jp.0301.d: "ข้าไม่คิด เช่นนั้น"
 
 chariot_race_ongoing_jp.0400.t: "อีกรอบ"
 chariot_race_ongoing_jp.0400.intro: "พนักงานปล่อยเครื่องหมายโลมาสำหรับรอบที่ [ROOT.Char.Custom('GetChariotMiddlingLapCount')] ลง ขณะที่ [first_place_charioteer.GetFirstName] แห่งทีม[first_place_charioteer.Custom('GetChariotTeamColorPlural')]"
 chariot_race_ongoing_jp.0400.intro_flavor1: "พุ่งผ่านรูปปั้นนักแข่งรถม้าในอดีตที่ส่องประกายแวววาว ยกแขนที่ถือแส้ของ[first_place_charioteer.GetHerHis]ขึ้นชั่วครู่เพื่อประกาศชัยชนะก่อนเวลาอันควร"
 chariot_race_ongoing_jp.0400.intro_flavor2: "เลี้ยวโค้งเข้าสิ่งกีดขวางอย่างรวดเร็ว แทบจะไม่สามารถทรงตัวอยู่ได้ และ ทำให้เสียงโห่ร้องอันบ้าคลั่งของมวลชนดังกระหึ่มยิ่งขึ้น"
 chariot_race_ongoing_jp.0400.intro_flavor3: "ขับเคลื่อนทีมม้าที่กำลังแยกเขี้ยวของ[first_place_charioteer.GetHerHis]ไปข้างหน้าอย่างไม่หยุดยั้ง แส้ฟาดฟันราวกับเครื่องมือของ[ROOT.Char.GetFaith.HighGodName]"
 chariot_race_ongoing_jp.0400.intro_flavor4: "ควบผ่านพวกเขาไปอย่างรวดเร็ว เหลือบมองข้ามไหล่ของ[first_place_charioteer.GetHerHis] ซึ่งมีทั้งความเย้ยหยันและความกังวล"
 chariot_race_ongoing_jp.0400.intro_flavor5: "ไถลเข้าโค้ง ส่วนที่ไม่ไอค่อกแค่กภายใต้กลุ่มฝุ่นขนาดใหญ่ที่[first_place_charioteer.GetSheHe]เตะขึ้นมาก็ระเบิดเสียงเชียร์ด้วยความยินดี"
 chariot_race_ongoing_jp.0400.second1: "\n\n[second_place_charioteer.GetFirstName] ตามติดส้นเท้าของ[first_place_charioteer.GetHerHis]มา,"
 chariot_race_ongoing_jp.0400.second2: "\n\nเพียงไม่กี่หลาตามหลังคือม้าของ[second_place_charioteer.GetFirstNamePossessive] ย่ำทรายผืนเดียวกัน,"
 chariot_race_ongoing_jp.0400.second3: "\n\n[second_place_charioteer.GetFirstName] ตามหลังเพียงเล็กน้อยและอาจยังคงลดช่องว่างได้,"
 chariot_race_ongoing_jp.0400.second4: "\n\nเกือบจะอยู่ข้างหลัง[first_place_charioteer.GetHerHim]โดยตรง ม้าที่กำลังขบเคี้ยวของ[second_place_charioteer.GetFirstNamePossessive]ตามมา,"
 chariot_race_ongoing_jp.0400.second5: "\n\n[second_place_charioteer.GetFirstName] อยู่ข้างหลังพอสมควร แต่ก็ยังไม่ถึงกับตามไม่ทัน,"
 chariot_race_ongoing_jp.0400.third1: "[second_place_charioteer.GetHerselfHimself]ถูกไล่ตามอย่างใกล้ชิดโดย [third_place_charioteer.GetFirstName] ที่มุ่งมั่นอย่างยิ่ง"
 chariot_race_ongoing_jp.0400.third2: "ขณะที่ [third_place_charioteer.GetFirstName] ควบตามหลังอย่างรวดเร็ว คอยหาโอกาส"
 chariot_race_ongoing_jp.0400.third3: "ขณะที่ [third_place_charioteer.GetFirstName] อยู่ข้างหลังเพียงนิดเดียว ม้าดูเหมือนจะอยู่ในระยะกัดถึง"
 chariot_race_ongoing_jp.0400.third4: "ขณะที่ [third_place_charioteer.GetFirstName] ไล่ตามอย่างใจร้อน กดดันเพื่อหาโอกาสแซง"
 chariot_race_ongoing_jp.0400.third5: "ขณะที่ [third_place_charioteer.GetFirstName] กำลังค่อยๆ เคลื่อนเข้ามาเคียงข้างอย่างช้าๆ ต้องการแซงอย่างยิ่ง"
 chariot_race_ongoing_jp.0400.winning_place: "\n\nโอ้ [ROOT.Char.GetFaith.FateGodName]! หาก [wager_target.GetFirstNameNoTooltip] สามารถรักษาตำแหน่งของ[wager_target.GetHerHis]ไว้ได้!"
 chariot_race_ongoing_jp.0400.losing_place: "\n\nโอ้ [ROOT.Char.GetFaith.FateGodName]! เจ้ากำลังทำอะไรอยู่ในอันดับ #EMP [wager_target.Custom('GetChariotRacePlacement')]#! เล่า [wager_target.GetFirstNameNoTooltip]?!"
 chariot_race_ongoing_jp.0400.out: "\n\nข้าทำได้เพียงครุ่นคิดอย่างเศร้าสร้อยถึงการเดิมพันอันน่าเสียดายของข้ากับ [wager_target.GetFirstName]..."
 chariot_race_ongoing_jp.0400.a: "#EMP สู้เข้า [wager_target.GetFirstNameNoTooltip]#!!"
 chariot_race_ongoing_jp.0400.b: "ครั้งหน้าข้าจะเดิมพันให้ดีกว่านี้แน่นอน..."
 chariot_race_ongoing_jp.0400.c: "ช่างเป็นการแข่งขันที่ยอดเยี่ยม!"
 chariot_race_ongoing_jp.0400.d: "#EMP ไปเลย! ไปเลย [wager_target.GetWomanMan]!#!"

 chariot_race_ongoing_jp.0500.t: "การอวดดี"
 chariot_race_ongoing_jp.0500.intro: "ทุกสายตาจับจ้องไปที่รถม้าของ[first_place_charioteer.GetFirstNamePossessive] และการนำที่มั่นคงที่[first_place_charioteer.GetSheHe]สร้างขึ้น,"
 chariot_race_ongoing_jp.0500.first: "และ[evil_knievel.GetWomanMan]ผู้นั้นรู้ดีอย่างชัดเจน เพราะ[evil_knievel.GetSheHe]"
 chariot_race_ongoing_jp.0500.last: "เมื่อ [evil_knievel.GetFirstName], ซึ่งอยู่ข้างหลังไกลในอันดับสุดท้าย,"
 chariot_race_ongoing_jp.0500.high: "เมื่อ [evil_knievel.GetFirstName], ซึ่งอยู่ไม่ไกลนัก,"
 chariot_race_ongoing_jp.0500.middle: "เมื่อ [evil_knievel.GetFirstName], ซึ่งหายไปในกลุ่มกลาง,"
 chariot_race_ongoing_jp.0500.low: "เมื่อ [evil_knievel.GetFirstName], ซึ่งตามหลังอยู่กับพวกผู้แพ้,"
 chariot_race_ongoing_jp.0500.trick_flavor1: "ก็กระโดดขึ้นไปด้านหน้ารถม้าของ[evil_knievel.GetHerHis]ทันที ขับด้วยมือเดียวขณะที่[evil_knievel.GetSheHe]โบกมือให้อัฒจันทร์!"
 chariot_race_ongoing_jp.0500.trick_flavor2: "กระโดดไปมาในรถม้าของ[evil_knievel.GetHerHis] และหันหน้าไปข้างหลัง ขับต่อไปพร้อมกับส่งจูบให้อัฒจันทร์!"
 chariot_race_ongoing_jp.0500.trick_flavor3: "กระโดดออกจากรถม้าของ[evil_knievel.GetHerHis]ขึ้นไปบนหลังม้าตัวนำของ[evil_knievel.GetHerHis] ชูแขนขึ้นประกาศชัยชนะ!"
 chariot_race_ongoing_jp.0500.trick_flavor4: "กระโดดออกจากรถม้าของ[evil_knievel.GetHerHis]ขึ้นไปบนหลังม้าตัวนำของ[evil_knievel.GetHerHis] โบกมือให้อัฒจันทร์!"
 chariot_race_ongoing_jp.0500.filler: "\n\nมวลชนโห่ร้องด้วยความยินดี"
 chariot_race_ongoing_jp.0500.overtake: "แต่ [overtaking_charioteer.GetFirstName] ไม่ค่อยประทับใจนัก: เมื่อเห็นโอกาสของ[overtaking_charioteer.GetHerHis] [overtaking_charioteer.GetSheHe]ก็แซงขึ้นไปอยู่อันดับ [overtaking_charioteer.Custom('GetChariotRacePlacement')] อย่างรวดเร็ว"
 chariot_race_ongoing_jp.0500.maintained: "ขณะที่ [evil_knievel.GetFirstNameNoTooltip] ยังคงรักษาตำแหน่งของ[evil_knievel.GetHerHis]ไว้ได้อย่างน่าประหลาด ขัดขวางการแซง แม้จะเกิดเรื่องทั้งหมดขึ้น!"
 chariot_race_ongoing_jp.0500.maintained_last: "ดูเหมือนว่า[evil_knievel.GetSheHe]ต้องการเกียรติยศ #EMP บ้าง#! แม้ว่า[evil_knievel.GetSheHe]จะเข้าเส้นชัยเป็นคนสุดท้ายก็ตาม"
 chariot_race_ongoing_jp.0500.dead: "เสียงเชียร์ดังถึงขีดสุด เมื่อ [evil_knievel.GetFirstName] เสียหลัก [evil_knievel.GetHerHis] กะทันหัน! กองไม้ เนื้อหนังม้า และฝุ่นที่พันกันยุ่งเหยิงพร้อมเสียงร้องของม้ากลิ้งไปบนผืนทราย และชนเข้ากับเครื่องกีดขวาง..."
 chariot_race_ongoing_jp.0500.alive: "[evil_knievel.GetFirstName] กลับสู่ท่าปกติของนักแข่งรถม้าอย่างสง่างาม ยิ้มกว้างราวกับราชาขณะที่สนามฮิปโปโดรมเคลิบเคลิ้ม"
 chariot_race_ongoing_jp.0500.alive_overtaken: "[evil_knievel.GetFirstName] รีบกลับสู่ตำแหน่งที่เหมาะสมของ[evil_knievel.GetHerHis] เขย่ากำปั้นใส่ผู้ที่แซง[evil_knievel.GetHerHis]ไป"
 chariot_race_ongoing_jp.0500.loss_dead: "\n\nข้าซบหน้าลงกับฝ่ามือ... "เจ้าคนโง่, [evil_knievel.GetFirstNameNoTooltip]... !""
 chariot_race_ongoing_jp.0500.loss: "\n\nข้ามองอย่างไม่เชื่อสายตา "เจ้า #EMP คนโง่#!, [evil_knievel.GetFirstNameNoTooltip]!""
 chariot_race_ongoing_jp.0500.gain: "\n\nฮ่า! นั่นจะเป็นบทเรียนให้[evil_knievel.GetHerHim]ที่เล่นเป็นตัวตลก"
 chariot_race_ongoing_jp.0500.a: "ช่างกล้าหาญเสียจริง!"
 chariot_race_ongoing_jp.0500.b: "โอ้ #EMP [ROOT.Char.GetFaith.HighGodName]#!!"
 chariot_race_ongoing_jp.0500.c: "ฮ่า! จับตาดูเส้นชัยไว้ [overtaking_charioteer.GetFirstNameNoTooltip]!"
 chariot_race_ongoing_jp.0500.d: "เจ้าคน #EMP โง่#! บัดซบ, [evil_knievel.GetFirstNameNoTooltip]!"

 chariot_race_ongoing_jp.0600.t: "กระเป๋าว่างเปล่า"
 chariot_race_ongoing_jp.0600.intro: "ทันทีที่เจ้ามือรับแทง, [bookmaker.GetTitledFirstName], จากไปพร้อมกับถุงเงินที่เข็มขัดของ[bookmaker.GetHerHis]ส่งเสียงกรุ๊งกริ๊งอย่างมีความสุขด้วยเหรียญที่ข้าหามาอย่างยากลำบาก ข้าก็ได้ยินเสียง [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('castigator'))] ของข้า, [castigator.GetTitledFirstNamePossessive], กรีดร้องอย่างไม่เชื่อหู:\n\n"#EMP โอ้...!#! เห็นแก่ #EMP พระเจ้า#! เถอะ [castigator.Custom2('RelationToMeShort', ROOT.Char)]!""
 chariot_race_ongoing_jp.0600.kathisma: "ความเงียบเข้าปกคลุม [Glossary( 'คาทิสม่า', 'KATHISMA_GLOSS')] ขณะที่ถ้วยหล่นและศีรษะหันมามอง"
 chariot_race_ongoing_jp.0600.stands: "ความเงียบเข้าปกคลุมอัฒจันทร์โดยรอบขณะที่ทุกคนหันมามองการปะทุอารมณ์นี้อย่างตกตะลึง"
 chariot_race_ongoing_jp.0600.desc: "\n\n"อย่าบอกนะ! ท่านกำลังเล่นพนันจน #EMP หมดตัว#!?" [castigator.GetSheHe] พูดต่อ, [castigator.Custom('quirk_neg_adverb')] "ท่านจะไม่เหลืออะไรเลย! แล้ว #EMP เงินสำรองฉุกเฉิน#! ล่ะ?!" เจ้ามือรับแทงรีบหนีหายไปจากสายตา ถอยห่างจากสายตาอันแหลมคมของ[castigator.GetFirstNamePossessiveNoTooltip]"
 chariot_race_ongoing_jp.0600.a: "โอ้ ไปให้พ้นเถอะ [castigator.GetFirstNameNoTooltip]! ข้ากำลังพยายามดูการแข่งขัน!"
 chariot_race_ongoing_jp.0600.b: "ข้าคิดว่าข้าอาจจะลดเงินเดิมพันลง..."
 halve_wager_effect_tt: "เงินเดิมพันของท่าน #M ถูกหารครึ่ง#!"
 chariot_race_ongoing_jp.0600.c: "ท่านพูด #EMP ถูก!#! เร็วเข้า! ไปตาม [bookmaker.GetFirstNameNoTooltip] กลับมา!"
 cancel_wager_effect_tt: "เงินเดิมพันของท่าน #N ถูกยกเลิก#!"
