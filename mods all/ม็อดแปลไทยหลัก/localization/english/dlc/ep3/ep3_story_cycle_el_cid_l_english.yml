l_english: 
 cid_loyalty_counter_positive: "การกระทำนี้จะ#positive_value แสดง#! [cid_loyalty|E] ต่อ[liege.GetTitleAsNameNoTooltip]"
 cid_loyalty_counter_very_positive: "การกระทำนี้จะ#positive_value แสดงอย่างยิ่ง#! [cid_loyalty|E] ต่อ[liege.GetTitleAsNameNoTooltip]"
 cid_loyalty_counter_negative: "การกระทำนี้จะ#negative_value ตั้งคำถาม#! ต่อ[cid_loyalty|E] ที่มีต่อ[liege.GetTitleAsNameNoTooltip]"
 cid_loyalty_counter_very_negative: "การกระทำนี้จะ#negative_value ตั้งคำถามอย่างยิ่ง#! ต่อ[cid_loyalty|E] ที่มีต่อ[liege.GetTitleAsNameNoTooltip]"
 game_concept_cid_loyalty: "ความภักดีของโรดริโก"
 game_concept_cid_loyalty_desc: "ด้วยการคงความ#V ภักดี#! ต่อเจ้าเหนือหัวแม้ในยามเนรเทศ เอลซิดอาจได้รับความโปรดปรานกลับคืนมาและฟื้นฟูสถานะอันได้เปรียบของตน\n\nด้วยการกลายเป็นผู้#V ไม่ภักดี#! เอลซิดอาจได้รับทางเลือกพิเศษเพื่อยกตนขึ้นเป็นผู้ปกครองอิสระ"
 
 cid.0001.t: "ตามพระบัญชาของ[liege.GetTitleAsNameNoTooltip]"
 cid.0001.desc.intro: "ข้าเหยียบโกลน ตบหัวม้าเบาๆ และมองเป็นครั้งสุดท้ายยังสถานที่ ซึ่งข้าจะเรียกว่าบ้านเสมอไป\n\nเนรเทศ พระดำรัสของ[liege.GetTitledFirstNamePossessive]ชัดเจนมิอาจผิดพลาดได้\n\n"
 cid.0001.desc.alfonso: "ข้าเคยติดตามพระเชษฐาของพระองค์อย่างภักดี ข้าก็จะติดตามพระองค์ เช่นกัน"
 cid.0001.desc.garcia_ordonez: "ข้าเคยเอาชนะเขาในการรบครั้งหนึ่ง ซึ่งเขาไม่อาจลืมเลือนได้"
 cid.0001.desc.liege_hate: "ตกจากความโปรดปรานของ[liege.GetTitleAsNamePossessiveNoTooltip] ข้าในบังคับจะดีได้อย่างไร หากเจ้าเหนือหัวไม่รักใคร่?"
 cid.0001.desc.courtier: "เหล่าศัตรูในราชสำนักได้เป่าหู[liege.GetHerHis] ศัตรูผู้ ซึ่งมุ่งร้ายต่อข้าเสมอมา เพราะ[liege.GetTitleAsNameNoTooltip|l]รักข้ามากเกินไป"
 cid.0001.desc.outro: "\n\nอีกาตัวหนึ่งบินอยู่ทางขวาของเรา — ลางร้าย"
 cid.0001.a: "ข้าจะภักดีต่อท่านเสมอ [liege.GetTitleAsNameNoTooltip] ของข้า"
 cid.0001.a.flavor: "#EMP และแล้วยอดนักรบผู้ภักดีก็ถูกเนรเทศจากแผ่นดินไป#!"
 cid.0001.b: "เช่นนั้นก็จงเป็นไป ผู้ที่รักข้าจะติดตามข้ามา"
 cid.0001.b.flavor: "#EMP เมื่อนั้นซิดของข้าก็รู้ว่าหมดหวังในพระกรุณาของ[liege.GetTitleAsNameNoTooltip] [liege.GetFirstNameNoTooltip]แล้ว#!"
 story_el_cid_tt: "#EMP บทเพลงแห่งเอลซิด#! เริ่มต้นขึ้น"
 
 cid_exile_title: "เนรเทศ:"
 cid.1000.t: "$cid_exile_title$ ประตูที่ปิดตาย"
 cid.1000.desc: "ราตรีมืดมิดและเหน็บหนาว ข้าส่งคนของข้าไปเคาะประตูที่ใกล้ที่สุด เพื่อหาเจ้าบ้านผู้ใจดี\n\nคำตอบไม่มาในทันที ข้าได้ยินเสียงพึมพำและฝีเท้า จนกระทั่งร่างหนึ่งปรากฏขึ้นที่ทางเข้าในที่สุด\n\n"เป็นพระบัญชาของ[liege.GetTitleAsNameNoTooltip] เรามิกล้าต้อนรับท่าน โอ้ นายท่าน! จดหมายของ[liege.GetHerHis]ประทับตราหลวงมาถึงแล้ว ห้ามมิให้ชาว[ROOT.Char.GetCurrentLocation.GetNameNoTooltip]เปิดประตูหรือให้ที่พักพิงแก่ท่าน"\n\n[liege.GetTitledFirstName]ไม่รอช้าเลย"
 cid.1000.a: "เราจะไม่กดดันคนยากจนเหล่านี้"
 cid.1000.a.flavor: "#EMP สินค้าของเรา บ้านของเรา แม้กระทั่งดวงตาของเรา ทุกสิ่งตกอยู่ในความเสี่ยง#!"
 cid.1000.b: ""เปิดประตูหรือจะให้พังเข้าไป!""
 cid.1000.b.flavor: "#EMP และท่านจะได้ประโยชน์เพียงน้อยนิด แม้ว่าเราจะพังพินาศเพราะท่านก็ตาม#!"
 cid_opened_doors_modifier: "ประตูที่เปิดออก"
 cid_opened_doors_modifier_desc: "ตัวละครนี้บังคับเปิดประตูของชาวบ้านเพื่อหาที่พักพิงให้ผู้ติดตาม"
 
 cid.1010.t: "$cid_exile_title$ ไร้ทองหรือเงิน"
 cid.1010.desc: "ผู้ถูกเนรเทศยากที่จะเป็นนายที่พึ่งพาได้ ไม่มีการรับประกันว่าข้าจะสามารถจ่ายค่าจ้างให้ผู้ติดตาม หรือแม้กระทั่งหาอาหารให้พวกเขาได้ ใครเล่าจะเสี่ยงความปลอดภัยของครอบครัวเพื่อชายผู้เสียเกียรติ?\n\nการพูดคุยในค่ายเปิดเผยเท่าที่จะเป็นไปได้\n\nข้ามองขึ้นไปเห็น[friend.GetTitledFirstName]เดินมาหา พร้อมด้วยขนมปังและไวน์ของ[friend.GetHerHis]เอง:\n\n"กัมเปอาดอร์ ผู้เกิดมาในฤกษ์งามยามดี เราต้องไปต่อ เพราะข้าจะจ่ายค่าจ้างให้คนเหล่านี้ และยอมรับพระพิโรธของ[liege.GetTitledFirstName] เพราะข้าได้รับใช้ท่าน""
 cid.1010.a: ""[cook.GetFirstNameNoTooltip] พ่อครัว หา#EMP อะไรก็ได้#! ที่เจ้าหาเจอมาทำอาหาร""
 cid.1010.b: ""ขอบคุณ สหายรักยิ่งของข้า""
 cid.1010.b.flavor: "#EMP หากข้ามีชีวิตอยู่ ข้าจะตอบแทนท่านเป็นสองเท่า#!"
 cid.1010.c: ""ข้าไม่อาจเสี่ยงต่อพระพิโรธของ[liege.GetTitleAsNamePossessiveNoTooltip]ได้""
 cid_1010_no_invite_var_desc: "ท่านเนรเทศ[recipient.GetHerHim]: $VALUE|=+0$"
 
 cid.1020.t: "$cid_exile_title$ ลาก่อน ที่รักของข้า"
 cid.1020.desc.intro: "[spouse.GetFirstName] ทิ้งตัว [spouse.GetHerselfHimself] ลงบนขั้นบันไดหน้าแท่นบูชา สวดอ้อนวอนอย่างแรงกล้าต่อ [spouse.GetFaith.HighGodName] เพื่อปกป้องข้าจากความชั่วร้าย\n\nข้ากอด [spouse.GetHerHis] แนบอก และ [spouse.GetSheHe] ก็จุมพิตมือข้า ดุจดังผู้ที่โศกเศร้าเสียใจคือ [spouse.GetSheHe]\n\n"เพียง [ROOT.Char.GetFaith.HighGodName] เท่านั้นที่รู้ว่าเราจะได้พบกันอีกหรือไม่" ข้ากล่าว "ท่านจะปลอดภัยกว่าที่นี่ ข้าไม่อาจให้ท่านต้องเผชิญกับสิ่งที่จะเกิดขึ้นข้างหน้าได้""
 cid.0001.desc.children: "ข้าได้ ลูกๆ... จงเป็นเด็กดี""
 cid.0001.desc.no_children: "ข้าได้""
 cid.1020.a: ""[my_priest.GetFirstNameNoTooltip] บางทีท่านอาจช่วยทูลขอแทนเราได้?""
 cid.1020.b: ""ขอให้การรอคอยนั้นสั้น""
 cid.1020.b.flavor: "#EMP ดุจดังเมื่อเล็บถูกฉีกออกจากเนื้อหนัง#!"
 cid.1020.c: ""ข้าไม่อาจทิ้งท่านไปได้""
 cid.1020.c.flavor: ""
 cid_family_good_modifier: "ดุจเล็บและเนื้อ"
 cid_family_good_modifier_desc: "ตัวละครนี้ปฏิเสธที่จะทิ้งครอบครัวไว้เบื้องหลัง ขัดขืนคำสั่งของเจ้าเหนือหัว"
 
 cid.1030.t: "$cid_exile_title$ เพื่อความรักต่อ[liege.GetTitleAsNameNoTooltip]"
 cid.1030.desc: "ทองคำ เงิน เพชรพลอย ในที่สุดหีบสมบัติของข้าก็เริ่มเต็ม\n\nแหวนทองคำ สร้อยคอ และธงทิว [liege.GetTitledFirstName]คงไม่แปลกใจกับการแสดงออกนี้\n\nแต่นี่ไม่ใช่ของข้าทั้งหมด [liege.GetSheHe|U]ยังคงเป็นเจ้าเหนือหัวของข้า และ ดังนั้นส่วนหนึ่งของโชคลาภของข้าก็ควรเป็นของ[liege.GetHerHis]ด้วย"
 cid.1030.a: "[artifact.GetName]จะเป็นของขวัญชั้นเลิศ"
 cid.1030.b: "ทองคำไม่มีวันผิดพลาด"
 cid.1030.c: "ชิ! ข้า#EMP ชนะ#! สิ่งนี้มา!"
 
 cid.1040.t: "$cid_exile_title$ [ROOT.Char.GetFaith.HighGodName]โปรดเมตตา"
 cid.1040.desc: "บางหัวใจแข็งกระด้างและใช้เวลานานกว่าจะจดจำความรู้สึกอ่อนโยนได้\n\nไม่ว่าข้าจะทำสิ่งใด หัวใจของ[liege.GetTitledFirstNamePossessive]ก็อยู่ไกลเกินเอื้อม\n\n"[ROOT.Char.GetFaith.HighGodName]" ข้าเริ่มต้น คุกเข่าลงหน้าแท่นบูชา คนของข้าทั้งหมดรายล้อมด้วยความสงสัย "ขอความดีงามของพระองค์เปลี่ยนใจ[liege.GetTitledFirstNamePossessiveNoTooltip]และ ทำให้[liege.GetHerHim]ระลึกถึงความรักที่[liege.GetHerHis]มีต่อข้า""
 cid.1040.a: "ค่ายของเราจะเป็นแบบอย่างของความศรัทธา"
 cid.1040.b: "ได้โปรด [ROOT.Char.GetFaith.HighGodName] นำทาง[liege.GetHerHim]กลับสู่แสงสว่าง"
 cid.1040.c: "ส่ง[liege.GetHerHim]ไป[ROOT.Char.GetFaith.NegativeAfterLife]เสีย"
 cid_own_prayer: "เมตตาต่อข้า"
 cid_own_prayer_desc: "ตัวละครนี้ตัดสินใจมุ่งเน้นคำอธิษฐานไปที่ตนเอง"
 cid_1040_a_tt: "ทางเลือกนี้มีอยู่ เนื่องจาก $baggage_train_shrine_domicile_building$ ของท่าน"
 
 cid_restoration_title: "การฟื้นฟู:"
 cid.2000.t: "$cid_restoration_title$ จากข้อศอกลงมา"
 cid.2000.desc.intro: "การสู้รบดังกึกก้องรอบตัวข้า เงาของนกที่บินอยู่เหนือกองทัพหนาทึบขึ้นเรื่อยๆ\n\nไม่ยากที่จะมองเห็น"
 cid.2000.desc.loser: "[loser.GetTitledFirstName] สวมเกราะที่มีตราประจำตัวของ[loser.GetHerHis] "มานี่" ข้าแตะม้าศึกและเริ่มควบเข้าใส่[loser.GetHerHim] การดวลเพียงครั้งเดียวสามารถยุติทุกสิ่งได้\n\nลงไปถึงเข็มขัด ผ่านหมวกเกราะและเสื้อเกราะ ข้าฟันศัตรูขาดเป็นสองท่อน"
 cid.2000.desc.fallback: "ศัตรู สวมเกราะที่มีตราประจำตัวของเขา "มานี่" ข้าแตะม้าศึกและเริ่มควบเข้าใส่เขา การดวลเพียงครั้งเดียวสามารถยุติทุกสิ่งได้\n\nลงไปถึงเข็มขัด ผ่านหมวกเกราะและเสื้อเกราะ ข้าฟันศัตรูขาดเป็นสองท่อน"
 cid.2000.desc.outro: "จากข้อศอกลงมาอาบโชกไปด้วยเลือด"
 cid.2000.a: "ดาบเล่มนี้! ช่างงดงาม!"
 cid.2000.a.flavor: "#EMP นี่คือการรบ นี่คือวันที่เขาได้ดาบอันยิ่งใหญ่มา#!"
 cid.2000.b: "ส่งทูตไปยัง[liege.GetShortUIName] รางวัลนี้เป็นของ[liege.GetHerHis]"
 cid.2000.b.flavor: "#EMP ข้าปรารถนาจะส่งท่านไปยัง[liege.GetTitledFirstNameNoTooltip] เจ้าเหนือหัวโดยชอบธรรมของข้า พร้อมม้าร้อยตัวจากของที่ริบมาได้นี้ เพื่อให้ท่านจุมพิตพระหัตถ์[liege.GetHerHis]แทนข้า"
 cid_2000_liege_tt: "ได้รับ[newly_created_artifact.GetNameNoTooltip] [artifact|E]"
 
 cid.2001.t: "$cid_restoration_title$ จากนายผู้กล้าหาญ"
 cid.2001.desc.intro: "ดาบในมือ ทีละนิ้ว ย่างเท้าเข้าต่อสู้แย่งชิงพื้นดิน ฝนตกหนักขึ้น อากาศหนาวเย็นมาก\n\n"
 cid.2001.desc.loser: "[loser.GetTitledFirstName]เดินทัพมาหาข้า "[ROOT.Char.GetFirstNameNoTooltip]" [loser.GetSheHe]ทักทายข้าและข้าโค้งคำนับตอบ "ไม่มีเวลามากนักสำหรับคำทักทาย"\n\nดาบของเราปะทะกันกลางอากาศครั้งแล้วครั้งเล่า จนกระทั่งข้าฟันมือของ[loser.GetHerHis]ขาด"
 cid.2001.desc.fallback: "ศัตรูเดินทัพมาหาข้า "[ROOT.Char.GetFirstNameNoTooltip]" เขาทักทายข้าและข้าโค้งคำนับตอบ "ไม่มีเวลามากนักสำหรับคำทักทาย"\n\nดาบของเราปะทะกันกลางอากาศครั้งแล้วครั้งเล่า จนกระทั่งข้าฟันมือของเขาขาด"
 cid.2001.desc.outro: "เสียงกรีดร้องดังลั่น ดาบตกลงบนพื้น เต้นระยิบระยับในแสงซีดจาง"
 cid.2001.desc.outro.tizona: "\n\nสหายที่คู่ควรกับดาบทิโซนาของข้า"
 cid.2001.a: "ยังมีการรบอีกมากมายรออยู่ข้างหน้า!"
 cid.2001.a.tt: "ท่านกลายเป็นเจ้าของ[newly_created_artifact.GetName]"
 cid.2001.a.flavor: "#EMP ท่านรู้ดีว่าข้าได้มันมาอย่างสมเกียรติอัศวิน#!"
 cid.2001.b: "ของขวัญที่คู่ควรแก่[liege.GetTitleAsNameNoTooltip]"
 
 cid.2010.t: "$cid_restoration_title$ ข้อเสนออันน่าพอใจ"
 cid.2010.desc: "ผู้ส่งสารของ [liege.GetTitledFirstNamePossessive] เดินทาง [herald.GetHerHis] เข้ามาในกระโจมของข้าพร้อมกับแสงแรกของรุ่งอรุณ\n\n"ฟังเถิด ท่านทั้งหลายที่อยู่ในที่นี้ เคานต์และสุภาพบุรุษ!" [herald.GetSheHe] ประกาศ "[liege.GetLadyLord] [liege.GetTitledFirstNameNoTooltip] ของข้ามีคำขอต่อ [ROOT.Char.GetTitledFirstNameNoTooltip] ขอ [liege.GetFaith.HighGodName] ประทานพรให้เป็นประโยชน์แก่เขา [liege.GetSheHe] ขอ [child.Custom('GetDaughterSon')] [child.GetFirstNameNoTooltip] ของท่านเป็น [child.GetWifeHusband] ให้แก่ [proposed_spouse.GetTitledFirstName]"\n\nน้ำตาหยดหนึ่งไหลลงมาบนแก้มข้า นี่คือก้าวแรกสู่การปรองดองหรือไม่?"
 cid.2010.a: ""ด้วยความยินดียิ่ง ข้าขอรับเกียรตินี้!""
 cid.2010.a.flavor: "#EMP ในอ้อมแขนท่าน ข้าฝาก[child.Custom('GetDaughterSon')]ของข้า ผู้สดใสดุจดวงตะวัน#!"
 cid.2010.b: ""ข้าหาคู่ครองให้[child.GetHerHim]เองได้ ขอบคุณ""
 cid_refused_betrothal: "ปฏิเสธเจ้าเหนือหัว"
 cid_refused_betrothal_desc: "ตัวละครนี้ปฏิเสธข้อเสนอของเจ้าเหนือหัวในการหมั้นหมายบุตรของตนและตัดสินใจหาคู่ครองให้เอง"
 
 cid.2020.t: "$cid_restoration_title$ ชายผู้ทรงเกียรติ"
 cid.2020.desc: "ข้าประหลาดใจอย่างยิ่งที่ได้รับแขกใหม่ในกระโจมของข้า: [liege.GetTitledFirstName] ถูกรายล้อมไปด้วยทหารรักษาพระองค์ [liege.GetHerHis] รอยยิ้มปรากฏบนใบหน้า [liege.GetHerHis]\n\n"สหาย!" [liege.GetSheHe] ร้องออกมา "ท่านผู้ ซึ่งยังคงภักดีต่อข้าเสมอมา แม้ในยามที่ข้าผลักไสท่านไปอย่างน่าเสียใจยิ่ง ณ ที่นี้ ข้าขออภัยโทษให้ท่าน และมอบความรักของข้าให้ท่านตลอดทั่วทั้ง [liege.GetPrimaryTitle.GetTierAsNameNoTooltip|l] ของข้านับ แต่วันนี้เป็นต้นไป"\n\n"[liege.GetLadyLord] ของข้า! ข้าถูกเนรเทศและถูกริบเกียรติยศ และด้วยความยากลำบากอย่างยิ่ง ข้าจึงได้ครอบครองสิ่งที่ข้ามีอยู่ ขอบพระคุณ [ROOT.Char.GetFaith.HighGodName] สำหรับพระกรุณาของท่าน!""
 cid.2020.a: "ทั้งหมดนี้คุ้มค่าแล้ว"
 cid.2020.a.flavor: "#EMP และซิดของข้ากับคนของเขาก็เปรมปรีดิ์เมื่อธงของเขาปักอยู่บนยอดป้อมปราการ#!"
 cid.2020.b: "ข้าไม่อาจทิ้งค่ายของข้าไปได้"
 cid.2020.b.flavor: "#EMP เขาแห่งบิบาร์หันไปหาคนของเขาและสั่งให้รวบรวมของที่ริบมาได้#!"
 cid_2020_b_tt: "ท่านยังคงเป็น[adventurer|E]"
 cid.2020.c: "ถึงเวลาแยกทางแล้ว"
 
 cid_treason_title: "การทรยศ:"
 
 cid.4000.opening: "ถึง[ROOT.Char.GetFirstNameNoTooltip]ผู้โลเล,"
 cid.4000.desc: "ความไม่แน่วแน่ของท่าน ทำให้ข้าสับสน หากการคงความภักดีต่อข้าคือเจตนาของท่าน ท่านก็ล้มเหลว หากท่านตั้งใจจะแสดงความไม่พอใจ — ท่านก็ล้มเหลว เช่นกัน\n\nให้เราลืมเรื่องโชคร้ายเหล่านี้เสียเถิด"
 cid.4000.a: "ให้เป็น เช่นนั้นเถิด"
 
 cid.4010.t: "$cid_restoration_title$ มิโอ ซิด"
 cid.4010.desc: "เสียงเคาะประตูอย่างแรงบ่งบอกถึงการมาถึงของ[herald.GetTitledFirstName]\n\n"เห็นแก่[herald.GetFaith.HighGodNamePossessive]เถิด [ROOT.Char.GetFirstNameNoTooltip] ท่านจำเป็นต้อง ทำให้เรื่องทั้งหมดนี้ยุ่งยากถึงเพียงนี้เชียวหรือ?"\n\n"ข้าไม่ใช่คนเริ่ม" ข้าตอบ อย่างเคร่งขรึมที่สุดเท่าที่จะทำได้ "หาก[liege.GetTitleAsNameNoTooltip|l]ต้องการให้ข้ายังคงภักดี [liege.GetSheHe]ก็ไม่ควรเนรเทศข้า"\n\n"ข้าไม่เป็นหนี้บุญคุณความภักดีต่อ[liege.GetHerHim]อีกต่อไป เพราะ[liege.GetSheHe]ไม่ใช่เจ้าเหนือหัวโดยชอบธรรมของข้าอีกแล้ว ท่านบอก[liege.GetHerHim] เช่นนั้นได้""
 cid.4010.a: ""ข้าได้ดินแดนของตัวเองมาแล้ว""
 cid.4010.a.flavor: "#EMP เก้าเดือนเต็มที่เขานั่งล้อมหน้าเมือง และเมื่อเดือนที่สิบมาถึง พวกเขาก็ต้องยอมจำนน#!"
 cid.4010.b: ""หนทางเรียกหาข้า""
 cid.4010.b.flavor: "#EMP และนี่คือเรื่องราวของมิโอ ซิด กัมเปอาดอร์#!"
 cid.4010.c: ""ข้าจะยังคงเคารพการปกครองอันชอบธรรมของ[liege.GetHerHis]""
 cid.4010.c.flavor: "#EMP เพื่อความรักต่อ[liege.GetTitledFirstNameNoTooltip]ผู้ซึ่งเนรเทศข้า#!"
 
 cid.5000.opening: "[sender.Custom2('AppropriateGreeting', ROOT.Char)],"
 cid.5000.desc: "ข้ามีเรื่องต้องแจ้งแก่ท่าน [ROOT.Char.GetLadyLord] ของข้า ว่า [el_cid_story.MakeScope.Var('cid_liege').GetCharacter.GetTitledFirstName] ผู้เป็นนายเหนือหัวที่ชอบธรรมของท่าน ได้สวรรคตแล้ว\n\nเรื่องใดๆ ก็ตามที่ท่านเคยมีกับ[el_cid_story.MakeScope.Var('cid_liege').GetCharacter.GetHerHim]นั้น หาใช่เรื่องสลักสำคัญใดๆ ต่อข้าไม่"
 cid.5000.a: "ข้าว่าเรื่องคงจบลงแล้วกระมัง"
 
 story_el_cid: "[Concept( 'story_content_el_cid', 'บทเพลงแห่งเอลซิด' )|E]"
 story_el_cid_desc: "ถูกเนรเทศอย่างไม่เป็นธรรมโดยสหายและนายเหนือหัวของท่าน พระเจ้าซันโชที่ 2 แห่งกัสติยา ภายหลังสงครามกับพระเจ้าอัลฟอนโซที่ 6 บัดนี้ท่านได้ออกเดินทางเพื่อสร้างตำนานของตนเอง ท่านจะสร้างเส้นทางของตนเอง หรือจะยังคงภักดี?"
 CID_LIEGE: "นายเหนือหัวอย่างไม่เป็นทางการของท่าน"
 EL_CID_CUSTOM_STRING_KEY: "ตลอดการเดินทางของท่าน ท่านจะได้พิสูจน์ [Concept( 'cid_loyalty', 'ความจงรักภักดี' )|E] ของท่านต่อ [Story.MakeScope.Var('cid_liege').Char.GetShortUIName] ซึ่งในท้ายที่สุดอาจเสนอที่ดินให้ท่านในฐานะ [vassal|E]\n\nท่านยังสามารถสร้างเส้นทางของตนเองได้โดยการเข้าร่วม [wars|E] ใน [GetGeographicalRegion('world_europe_west_iberia').GetName] สิ่งนี้อาจตอบแทนท่านด้วยดาบในประวัติศาสตร์ของท่าน และอาจให้โอกาสทางเลือกอื่นในการได้มาซึ่งที่ดิน"
 EL_LOYALTY_COUNTER_TOOLTIP: "ค่า [Concept( 'cid_loyalty', 'ความจงรักภักดี' )|E] ปัจจุบัน: [Story.MakeScope.Var('cid_loyalty_counter').GetValue|V0]"
 cid_loyalty_counter_label: "[Concept( 'cid_loyalty', 'ความจงรักภักดี' )|E]"
