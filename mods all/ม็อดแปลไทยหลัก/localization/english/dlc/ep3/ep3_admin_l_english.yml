 ep3_admin_events.0001.t: "การเปลี่ยนแปลงทิศทาง"
 ep3_admin_events.0001.intro: "ข่าวสารจาก[liege.GetTitledFirstName]มาถึงโดยอาลักษณ์คนหนึ่งของ[liege.GetHerHis] — ถึงเวลาสำหรับการเปลี่ยนแปลงแล้ว\n\n[scribe.GetWomanMan]ผู้นั้น[scribe.Custom('quirk_pos_present')]ก่อนอ่านราชโองการ:\n\n"
 ep3_admin_events.0001.tribal: ""เราต้องยอมรับวิถีชนเผ่า เกียรติภูมิเป็นเครื่องมือที่สำคัญที่สุดที่ผู้ปกครองมี การปล้นสะดม การต่อสู้ การดวล [liege.GetTitleAsNameNoTooltip|U]ทรงกระตุ้นให้ราษฎรของ[liege.GetHerHis]ทุกคนมุ่งมั่นที่จะเป็นบุรุษและสตรีผู้มีเกียรติอันน่าชื่นชม""
 ep3_admin_events.0001.feudal: ""ความจงรักภักดีในหมู่บุรุษต่างหากที่ ทำให้อาณาจักรเข้มแข็ง ไม่ใช่เอกสารกระจัดกระจายบางอย่าง [liege.GetTitleAsNameNoTooltip|U]ทรงขอร้องมิตรภาพและความภักดีจากท่าน และเป็นการตอบแทน [liege.GetSheHe]จะดูแลความปลอดภัยของท่านในฐานะข้าในบังคับของ[liege.GetHerHis]""
 ep3_admin_events.0001.clan: ""อาณาจักรถูกปกครองโดยตระกูล เราจะแข็งแกร่งได้เท่ากับจุดอ่อนที่สุดของเรา แผ่นดินเป็นเพียงภาพสะท้อนของตระกูลของเรา: ตระกูลที่เป็นปึกแผ่นจะนำเราไปสู่ความรุ่งโรจน์""
 ep3_admin_events.0001.fallback: ""วิถีเก่าแห่งการปกครองของเราได้หมดสิ้นไปแล้ว""
 ep3_admin_events.0001.a: "สิ่งนี้ส่งผลกระทบต่อ #EMP ข้า#! อย่างไร?"
 ep3_admin_events.0001.b: "ข้าต้องเตรียมเอกสารมากมาย"
 ep3_admin_events.0001.c: "จะไม่มีอะไรเปลี่ยนแปลง"
 ep3_admin_change_love: "ยอมรับการเปลี่ยนแปลง"
 ep3_admin_change_love_desc: "ตัวละครนี้ไม่สนใจผลกระทบของการเปลี่ยนแปลงการปกครองเลยแม้ แต่น้อย"
 ep3_admin_change_hate: "ควบคุมการเปลี่ยนแปลง"
 ep3_admin_change_hate_desc: "ตัวละครนี้ใส่ใจอย่างลึกซึ้งต่อผลกระทบของการเปลี่ยนแปลงการปกครอง"

 ep3_admin_events.0002.t: "[ROOT.Char.GetTitleAsNameNoTooltip]แห่ง[governor_title.GetNameNoTierNoTooltip]"
 ep3_admin_events.0002.liege: "[ROOT.Char.GetLiege.GetTitleAsName], ด้วยพระปรีชาญาณอันไร้ขีดจำกัดของ[ROOT.Char.GetLiege.GetHerHis], ได้ตัดสินพระทัยว่าการปกครอง[governor_title.GetTierAsNameNoTooltip] [governor_title.GetAdjective] ควรตกเป็นของข้า"
 ep3_admin_events.0002.house_dead: "ด้วยการจากไปของ[ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('previous_governor'))]ของข้า, [previous_governor.GetTitledFirstName], ผู้ ซึ่ง[previous_governor.GetDeathReasonHideKiller], ได้มีการประกาศว่าการปกครอง[governor_title.GetTierAsNameNoTooltip] [governor_title.GetAdjective] บัดนี้ตกเป็นของข้า"
 ep3_admin_events.0002.house_alive: "ด้วยการมอบหมายใหม่ของ[ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('previous_governor'))]ของข้า, [previous_governor.GetTitledFirstName], ได้มีการประกาศว่าการปกครอง[governor_title.GetTierAsNameNoTooltip] [governor_title.GetAdjective] บัดนี้ตกเป็นของข้า"
 ep3_admin_events.0002.dead: "ด้วยการจากไปของ[previous_governor.GetTitledFirstName], ผู้ ซึ่ง[previous_governor.GetDeathReasonHideKiller], ได้มีการประกาศว่าการปกครอง[governor_title.GetTierAsNameNoTooltip] [governor_title.GetAdjective] บัดนี้ตกเป็นของข้า"
 ep3_admin_events.0002.alive: "ด้วยการมอบหมายใหม่ของ[previous_governor.GetTitledFirstName], ได้มีการประกาศว่าการปกครอง[governor_title.GetTierAsNameNoTooltip] [governor_title.GetAdjective] บัดนี้ตกเป็นของข้า"
 ep3_admin_events.0002.new: "[ROOT.Char.GetLiege.GetTitledFirstName]ประกาศว่า[ROOT.Char.GetLiege.GetSheHe]ได้มอบหมายการปกครอง[governor_title.GetTierAsNameNoTooltip] [governor_title.GetAdjective] ให้แก่ข้า"
 ep3_admin_events.0002.house: "บัดนี้เป็นหน้าที่ของข้าที่จะต้องรับประกันการปกครองอย่างต่อเนื่องของตระกูล[ROOT.Char.GetHouse.GetBaseName]ในมณฑลนี้"
 ep3_admin_events.0002.appointment_succession: "ค่ำคืนอันยาวนานของการวิ่งเต้นและการแสวงหาความโปรดปรานได้บังเกิดผลในที่สุด ข้าได้รับแจ้งว่าการเลือกข้าเป็น[ROOT.Char.GetTitleAsNameNoTooltip]คนใหม่นั้นแทบจะเป็นข้อสรุปที่แน่นอนอยู่แล้ว"
 ep3_admin_events.0002.appointment: "[ROOT.Char.GetLiege.GetTitledFirstNameNoTooltip]ทรงมีพระบัญชาส่วนพระองค์ให้ แต่งตั้งข้าทันทีโดยพระราชกฤษฎีกา ไม่มีผู้ใดสามารถท้าทายความชอบธรรมของสถานะใหม่ของข้าใน[ROOT.Char.GetTopLiege.GetPrimaryTitle.GetTierAsNameNoTooltip]ได้"
 ep3_admin_events.0002.conquest: "กองกำลังของ[previous_governor.GetTitledFirstNamePossessiveNoTooltip]ไม่สามารถเทียบเคียงกับอาวุธที่เหนือกว่าของข้าได้ พิสูจน์ให้เห็นถึงความชอบธรรมที่ยิ่งใหญ่กว่าของข้าในฐานะผู้พิทักษ์มณฑลในนามของ[ROOT.Char.GetTopLiege.GetPrimaryTitle.GetTierAsNameNoTooltip]"
 ep3_admin_events.0002.desc: "\n\nหลังจากได้รับเครื่องราชอิสริยาภรณ์และกล่าวคำสัตย์ปฏิญาณเข้ารับตำแหน่งแล้ว ในที่สุดข้าก็สามารถย้ายไปยังที่พำนักประจำมณฑลของข้าที่[ROOT.Char.GetCapitalLocation.GetBaronyNameExplicitly] และเริ่มต้นการดำรงตำแหน่งอย่างเหมาะสมได้"
 ep3_admin_events.0002.prosperity: "ข้าต้องพัฒนาดินแดนใหม่เหล่านี้"
 ep3_admin_events.0002.inspection: "ข้าจำเป็นต้องตรวจสอบดินแดนโดยทันที"
 ep3_admin_events.0002.a: "ไม่มีเวลาให้เสียเปล่า"
 ep3_admin_events.0002.tt: "บัดนี้ท่านคือ[governor|E]แห่ง[governor_title.GetName]"
