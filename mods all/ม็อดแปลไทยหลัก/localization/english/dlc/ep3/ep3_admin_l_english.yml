 ep3_admin_events.0004.t: "สิ้นสุดการปกครองแบบข้าราชการ"
 ep3_admin_events.0004.desc: "ในเหตุการณ์พลิกผันอันโหดร้าย ข้าพบว่าตนเองตกงานและไร้บ้าน #EMP ทุกสิ่ง#! ที่ข้าได้ทุ่มเทมาได้หายไปในพริบตา\n\nข้าคว้าสิ่งที่พอจะแบกได้ และมองดูสินทรัพย์ประจำตระกูลของข้าเป็นครั้งสุดท้าย"
 ep3_admin_events.0004.desc_spouse_upset: "\n\n[ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('reacting_spouse'))]ของข้า [reacting_spouse.GetFirstName] เหลือบมองมาทางข้าอย่างกังวล "ข้ามีของของข้าแล้ว คงไม่มีประโยชน์ที่จะยืดเยื้อเรื่องนี้กระมัง...""
 ep3_admin_events.0004.desc_spouse_very_upset: "\n\n"มัน... มันมาถึงจุดนี้ได้อย่างไร?!" [reacting_spouse.GetShortUIName] สะอื้นเสียงดังอยู่ข้างหลังข้า "เราสูญเสียทุกอย่าง... ข้าจะทำอย่างไรดี...""
 ep3_admin_events.0004.a: "มาเถิด, [reacting_spouse.GetFirstName] ไม่เป็นไรหรอก"
 ep3_admin_events.0004.b: "ใช่ ไปกันเถอะ"
 ep3_admin_events.0004.c: "ไม่มีประโยชน์ที่จะมองย้อนกลับไป..."
 
 ep3_admin_events.0005.t: "อาณาจักรของข้าเอง"
 ep3_admin_events.0005.intro: "[ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('messenger'))]ของข้า, [messenger.GetShortUIName], นำข่าวร้ายจากเมืองหลวงมา\n\n"
 ep3_admin_events.0005.desc_still_admin: "อาณาจักรอันยิ่งใหญ่ของเราครั้งหนึ่งไม่มีอีกต่อไปแล้ว เมื่อข้าพบว่าตนเองอยู่นอกเหนืออิทธิพลของ[gov_liege.GetFirstNamePossessive] ซึ่ง ทำให้ข้าต้องรับผิดชอบ[ROOT.Char.GetPrimaryTitle.GetNameNoTier] นอกจากความเป็นอิสระและอำนาจเต็มที่แล้ว มีเพียงไม่กี่สิ่งที่จะเปลี่ยนแปลง ระบบข้าราชการฝังรากลึกอยู่ในวิถีชีวิตของเราและจะยังคงเป็น เช่นนั้นต่อไป"
 ep3_admin_events.0005.desc_lost_admin: "ตามสถานการณ์ที่เกิดขึ้น อาณาจักรอันยิ่งใหญ่ของเราได้สูญสิ้นไปแล้ว และพร้อมกันนั้น ระบบข้าราชการที่ควบคุมวิถีชีวิตของเราก็มอดไหม้เป็นเถ้าถ่าน ข้ามีทางเลือกน้อยนิดนอกจากการปรับเปลี่ยนการปกครองของข้าให้เข้ากับความเป็นจริงใหม่นี้"
 ep3_admin_events.0005.a: "ทิ้งอดีตไว้เบื้องหลังและมองไปสู่อนาคต!"
 
 demand_admin_tribal: "[recipient.GetShortUIName|U] [CharAreIs(recipient)] [tribal|E] - เฉพาะ[governments|E]ที่ตั้งรกรากแล้วเท่านั้นที่สามารถเป็น[administrative|E]ได้"
