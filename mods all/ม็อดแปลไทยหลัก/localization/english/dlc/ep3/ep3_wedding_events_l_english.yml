l_english: 
 
ep3_wedding.0001.t: "มิใช่[other_family_spouse.Custom('GetBrideGroom')|U]เสียทีเดียว"
ep3_wedding.0001.desc: "การเริงระบำได้เริ่มขึ้นแล้ว! เสียงดนตรีหลั่งไหลดุจสายธารเชี่ยว ดั่งลมพัดที่ปลุกเร้าแม้กระทั่งหมู่ไม้ใหญ่ [flirting_in_law.GetName] ผู้เป็น[other_family_spouse.Custom2('RelationToMeShort', SCOPE.sC('flirting_in_law'))]ของ[other_family_spouse.Custom('GetBrideGroom')] เต้นรำอยู่ท่ามกลางผู้อื่น ร่าง[flirting_in_law.GetHerHis]พริ้วไหวดั่งใบไม้ต้องลม สายตา[flirting_in_law.GetHerHis|U]มิได้จับจ้องเหล่านักเต้นรำคนอื่นใด... ดวงตา[flirting_in_law.GetHerHis]จับจ้องมาที่ข้า #EMP อย่างเชื้อเชิญ.#!\n\nราตรีล่วงเลยไป สายตาอันเร่าร้อนของ[flirting_in_law.GetFirstNamePossessiveNoTooltip]ผสานกับการสัมผัสแผ่วเบาชั่วขณะ และสีข้าง[flirting_in_law.GetHerHis]ที่เคลื่อนไหวเริ่มปลุกปั่นบางสิ่งในตัวข้า"
ep3_wedding.0001.desc_own_wedding: "เมื่อ[ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('other_family_spouse'))] [other_family_spouse.GetFirstName]ของข้าหายไปไหนก็ไม่ปรากฏ หรือว่า #EMP นี่#! คือสิ่งที่ข้าต้องทำเพื่อลิ้มลองเสน่ห์ของวงศ์ตระกูล[other_family_spouse.GetHerHis]...?\n\nแต่ในงานวิวาห์ของข้าเอง? #EMP กับ[other_family_spouse.Custom2('RelationToMeShort', SCOPE.sC('flirting_in_law'))]ของ[other_family_spouse.Custom('WifeHusband')]ข้าเนี่ยนะ?!?"
ep3_wedding.0001.desc_guest: "และก็มิใช่ #EMP เรา#! ที่กำลังผนึกสัมพันธ์อันศักดิ์สิทธิ์ในวันนี้เสียหน่อย!\n\nอาจพอมีที่ว่างในมุมมืดสักแห่งสำหรับการสานสัมพันธ์อันลามกมักง่าย..."
ep3_wedding.0001.a_non_spouse: "วันนี้มีไว้เพื่อ[same_family_spouse.GetFirstNameNoTooltip] เพื่อ[same_family_spouse.GetHerHim] แต่เพียงผู้เดียว!"
ep3_wedding.0001.a_spouse: "วันนี้มีไว้เพื่อ[other_family_spouse.GetFirstNameNoTooltip] เพื่อ[other_family_spouse.GetHerHim] แต่เพียงผู้เดียว!"
ep3_wedding.0001.a.flavor_non_spouse: "ข้าไม่เคยคิดจะทรยศความไว้ใจของ[same_family_spouse.GetHerHis] แม้เพียงการนอกใจเล็กน้อยก็ตาม!"
ep3_wedding.0001.a.flavor_spouse: "ข้าไม่เคยคิดจะทรยศความไว้ใจของ[other_family_spouse.GetHerHis] แม้เพียงการนอกใจเล็กน้อยก็ตาม!"
ep3_wedding.0001.b: "มา #EMP ฉลอง#! กันเถอะ"
ep3_wedding.0001.b.flavor: "การเข้าหา[flirting_in_law.GetNameNoTooltip]อาจเป็นความผิดพลาด... แต่ก็น่าสนใจ"
ep3_wedding.0001.c: "แค่เต้นรำฉันมิตรเล็กน้อยคงไม่เสียหายกระไร"
ep3_wedding.0001.c.flavor: "อย่างไรเสีย บัดนี้เราก็เป็นครอบครัวเดียวกันแล้ว! การแบ่งปันความสุขเล็กๆ น้อยๆ กับครอบครัวมันแปลกหรือน่าสงสัยตรงไหนกัน...?"
ep3_wedding.001.b.got_caught: "@warning_icon!#X การสมสู่ของท่านถูกพบเห็น! ท่านอาจต้องเผชิญผลที่ตามมา#!"

ep3_wedding.0001.b.success.desc.tt: "ด้วยความเมามัวในกามารมณ์ ท่านทั้งสองจึงเร้นกายไปด้วยกัน"
ep3_wedding.0001.b.caught.desc.tt: "ท่านถูกจับได้ — ขณะกำลังเสพสม!"
ep3_wedding.0001.b.fail.desc.tt: "[flirting_in_law.GetSheHe|U]ผลักไสท่านด้วยความรังเกียจ"
own_wedding_difficulty_tooltip: "@warning_icon! #X โอกาสสำเร็จลดลง — เพราะ #EMP นี่คืองานวิวาห์ของท่านเอง!#!"

ep3_wedding.0002.t: "จังหวะแห่งรัตติกาล"
ep3_wedding.0002.intro: "[flirting_in_law.GetName] ผู้เป็น[other_family_spouse.Custom2('RelationToMeShort', SCOPE.sC('flirting_in_law'))]อันน่ามัวเมาของ[other_family_spouse.Custom('GetBrideGroom')] มิได้หยุดเริงระบำเลย ขณะที่อาภรณ์วิวาห์อันหรูหรา[flirting_in_law.GetHerHis]หลุดร่วงไปทีละชิ้นสู่ความมืดมิด ขณะที่[flirting_in_law.GetFirstNameNoTooltip]แนบเนื้ออุ่น[flirting_in_law.GetHerHis]เข้ากับกายข้า... การโยกย้าย[flirting_in_law.GetHerHis]ยิ่งทวีความรุนแรง เร่งเร้ามากขึ้น\n\nเมื่อกิจเสร็จสิ้นลง ข้าทรุดกายลงพร้อมหัวร่ออย่างคึกคะนอง;"
ep3_wedding.0002.own_wedding: "[other_family_spouse.Custom2('RelationToMeShort', SCOPE.sC('flirting_in_law'))]ของ[other_family_spouse.Custom('WifeHusband')]ข้าหมุนตัวเปลือยเปล่าให้ข้าชมเป็นครั้งสุดท้าย\n\n[other_family_spouse.Custom('WifeHusband')]คนใหม่ของข้ารออยู่ ใช่..."
ep3_wedding.0002.others_wedding: "คู่หูในการนอกใจของข้าหมุนตัวเปลือยเปล่าให้ข้าชมเป็นครั้งสุดท้าย\n\nงานเลี้ยงวิวาห์รอเราอยู่ ใช่..."
 ep3_wedding.0002.lowborn: "แต่ข้าก็เพลิดเพลินกับการหยอกเย้าในกิ่งก้านสาขาของตระกูล[other_family_spouse.GetHerHis]"
 ep3_wedding.0002.highborn: "แต่ข้าก็เพลิดเพลินกับการหยอกเย้าในกิ่งก้านสาขาของตระกูล[other_family_spouse.GetHouse.GetName]"

ep3_wedding.0002.a: ""ข้า... ข้าคิดว่าข้ารักเจ้า [flirting_in_law.GetFirstNameNoTooltip]""
ep3_wedding.0002.a.flavor: "ข้าได้ก่ออาชญากรรมร้ายแรงต่อ[other_family_spouse.Custom('WifeHusband')]คนใหม่ของข้า แต่เพื่อเหตุผลอันยิ่งใหญ่ที่สุด: หัวใจ!"
ep3_wedding.0002.a.flavor_non_spouse: "เรื่อง เช่นนี้ถูกลิขิตไว้แล้วอย่างแท้จริง ในช่วงเวลาแห่งรักอันศักดิ์สิทธิ์นี้!"
ep3_wedding.0002.a.success.desc.tt: "[flirting_in_law.GetSheHe|U]กำลังตกหลุมรักท่าน เช่นกัน"
ep3_wedding.0002.a.fail.desc.tt: "[flirting_in_law.GetSheHe|U]รู้สึกปลื้ม แต่ก็เท่านั้น"
ep3_wedding.0002.b: ""เจ้าจะเต้นรำให้ข้าอีก ใช่หรือไม่...?""
ep3_wedding.0002.c: ""กลับไปที่งานเลี้ยงกันเถอะ!""
lust_demon_success_chance: "#weak เพิ่ม [GetScheme('seduce').GetTypeName] [scheme|E] [success_chance|E] อย่างมากต่อตัวละครที่เคร่งศาสนา"
lust_demon_success_chance_tt: "ท่านได้รับ [GetScheme('seduce').GetTypeName] [scheme|E] [success_chance|E] เพิ่มขึ้นอย่างมีนัยสำคัญต่อตัวละคร [GetTrait('zealous').GetName( GetNullCharacter )] เป็นเวลา #high 10 ปี#!"
ep3_wedding.0003.t: "นั่นมัน[other_family_spouse.Custom2('RelationToMeShort', SCOPE.sC('flirting_in_law'))|U]ของข้า!"
 ep3_wedding.0003.desc_intro: "[flirting_in_law.GetTitledFirstName]กรีดร้อง — เรามาถึงช่วงสุดท้ายของการเสพสมอันสั่นสะท้าน-\n\n"
ep3_wedding.0003.desc_own_wedding: ""#EMP [other_family_spouse.GetFaith.DevilName] เอาตาข้าไปที!#!" เสียงอันคุ้นเคยของ[ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('other_family_spouse'))]คนใหม่ของข้าร้องขึ้น "#EMP ข้ามาเจอเรื่องโสโครกอะไรนี่?!?#!"\n\n[other_family_spouse.GetHerHis|U] [other_family_spouse.Custom2('RelationToMeShort', SCOPE.sC('flirting_in_law'))]ผละออกจากเนื้อหนังอันชุ่มโชกของข้า ยังคงหอบหายใจ... แต่[other_family_spouse.GetFirstName]ได้เห็นทั้งหมดแล้ว และรู้สึกคลื่นเหียนต่อการดูหมิ่นคำสาบานในชีวิตสมรสอันเลวร้ายที่สุดนี้"
ep3_wedding.0003.desc_guest: ""#EMP [other_family_spouse.GetFaith.DevilName] เอาตาข้าไปที!#!" เสียงอันคุ้นเคยของ[other_family_spouse.GetTitledFirstNamePossessive]ร้องขึ้น "#EMP ข้ามาเจออะไรเข้า?!?#!"\n\n[other_family_spouse.GetHerHis|U] [other_family_spouse.Custom2('RelationToMeShort', SCOPE.sC('flirting_in_law'))]ผละออกจากเนื้อหนังอันชุ่มโชกของข้า ยังคงหอบหายใจ... แต่[other_family_spouse.GetFirstName]ได้เห็นทั้งหมดแล้ว และดูเหมือนจะไม่พอใจนัก"

ep3_wedding.0003.a: "เจ้าดู #EMP งดงามมาก#! ยามโกรธ..."
ep3_wedding.0003.a.flavor: "เจ้าไม่รู้สึกอยากฉลองงานวิวาห์ของเจ้ารึ [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('other_family_spouse'))]... แค่เราสามคน?"
ep3_wedding.0003.b: "หากพูดเรื่องนี้ออกไป เจ้าตาย [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('other_family_spouse'))]"
ep3_wedding.0003.c: "ข้าถูกปีศาจแห่งตัณหา ทำให้ #EMP บ้าคลั่ง#! ไปแล้ว!"
ep3_wedding.0003.c.flavor: "ใช่ มีวิญญาณชั่วร้ายสิงสู่ข้าอยู่ — และหากมันไม่ได้รับการสนองด้วยเนื้อหนัง มันจะ... เอ่อ... #EMP ทำลายข้า!#! ข้าไม่มีทางเลือกอื่นจริงๆ!"
ep3_wedding.0003.c.success.desc: "[other_family_spouse.GetFirstNameNoTooltip]ร่ำไห้ให้กับความทุกข์ของท่าน"
ep3_wedding.0003.c.fail.desc: "[other_family_spouse.GetFirstNameNoTooltip]จับโป้ปดของท่านได้"
ep3_wedding.0003.d: "เจ้าคิดว่าข้า #EMP สน#! รึว่าเรื่องเล็กน้อยนี้มัน 'ผิด'...?"
ep3_wedding.0003.d.flavor: "ไปพล่ามเรื่องนี้ที่อื่นซะ เจ้าคนโง่ขี้แย"
ep3_wedding.0003.e: "ได้โปรด อย่าบอกใครเลย! ข้าเสียใจอย่างสุดซึ้ง"
ep3_wedding.0003.e.flavor: "เมื่อครั้งถูกเผาผลาญด้วยไฟต้องห้าม... บัดนี้หัวใจข้าแหลกสลายเป็นชิ้นๆ"
possessed_by_lust_demon_modifier: "อ้างว่าถูกปีศาจตัณหาสิงสู่"
possessed_by_lust_demon_modifier_desc: "ตัวละครนี้ยืนกรานว่าตนดำรงชีวิตอยู่ภายใต้ภัยคุกคามของปิศาจร้ายผู้หิวโหย ซึ่งจักนำมา ซึ่งความพินาศหากมิได้รับการสนองด้วยเนื้อหนังมังสา"
unflappable_boudoir_confidence_modifier: "ความมั่นใจในเชิงชู้สาวอันมิหวั่นไหว"
unflappable_boudoir_confidence_modifier_desc: "บุรุษนักรักผู้นี้ไร้ยางอายอย่างยิ่งในเรื่องความปรารถนาของตน... ในแบบที่ผู้คนจำนวนมากมองว่าเป็นเรื่องเสื่อมเสีย ขณะที่อีกหลายคนกลับพบว่ามีเสน่ห์น่าหลงใหล"
