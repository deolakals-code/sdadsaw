 teach_governor_desc_general: "$teach_governor$ เป็น [political_scheme|E] สำหรับการปรับปรุง [governor_efficiency|E] ของ [governor|E] อื่น มันขึ้นอยู่กับ [stewardship|E] และสามารถรับสมัคร [agents|E] ได้\n\n$teach_governor$ ที่ประสบความสำเร็จจะ ส่งผลให้ [scheme_target|E] ได้รับ [trait_level_track_xp|E] [GetTrait('governor').GetName( GetNullCharacter )] และ [opinion|E]"
