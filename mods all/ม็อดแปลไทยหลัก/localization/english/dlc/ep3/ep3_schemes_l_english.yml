 challenge_status_desc: "ข้าจะพยายามท้าทายสถานะและอิทธิพลในราชสำนักของ [SCHEME.GetTargetCharacter.GetShortUINamePossessive] โดยเปิดเผยข้อบกพร่องของ [SCHEME.GetTargetCharacter.GetHerHis] และแสดงคุณสมบัติที่ #EMP ดีกว่า#! ของข้า"
 challenge_status_desc_general: "ใน [scheme|E] การท้าทายสถานะ ท่านมุ่งหมายที่จะขโมย [influence|E] จากตัวละครโดยการประจานพวกเขาในที่สาธารณะและแสดงความเหนือกว่าของตนเอง พวกเขาจะสูญเสีย [powerful_family_rating|E] ด้วย"
