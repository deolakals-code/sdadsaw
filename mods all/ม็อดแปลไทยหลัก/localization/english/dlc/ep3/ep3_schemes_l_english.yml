 scheme_critical_moments.1182.desc: "สำเร็จ! ชื่อตระกูล [ROOT.Char.GetHouse.GetName] ตอนนี้มีน้ำหนักมากขึ้นใน [ROOT.Char.GetTopLiege.GetPrimaryTitle.GetBaseName] — อย่างน้อยก็สำหรับข้า\n\nสินบน การช่วยเหลือ การบริจาค การวางคนที่เหมาะสมในตำแหน่งที่เหมาะสม: ไม่มีเครื่องมือใดที่ไม่ได้ใช้ คลังอิทธิพลของข้าลึกซึ้งขึ้นพร้อมกับความสามารถทางการเมืองของข้า"
