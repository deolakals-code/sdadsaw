 # Ingratiate Family
 ingratiate_family: "ผูกมิตรกับตระกูล"
 ingratiate_family_action: "ผูกมิตร"
 ingratiate_family_desc: "แม้ แต่ตระกูลที่ทรงอำนาจที่สุดก็ไม่สามารถยืนหยัดอยู่เพียงลำพังได้ - ตระกูล [SCHEME.GetTargetTitle.GetHolder.GetHouse.GetBaseName] อาจเป็นพันธมิตรที่มีประโยชน์ หรือเป็นเบี้ย..."
 ingratiate_family_desc_general: "$ingratiate_family$ เป็น [personal_scheme|E] ที่มีเป้าหมายเพื่อเอาชนะใจ [house|E] มันขึ้นอยู่กับ [diplomacy|E] และสถานะของ [house|E]\n\n$ingratiate_family$ ที่ประสบความสำเร็จจะมอบ [opinion|E], [friendship|E] และ [influence|E]"
