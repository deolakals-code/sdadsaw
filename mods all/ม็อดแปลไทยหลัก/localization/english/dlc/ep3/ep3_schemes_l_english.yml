 #success event
 scheme_critical_moments.8061.t: "[scheme.GetNameNoTooltip]: สำเร็จ"
 scheme_critical_moments.8061.desc: "ลึกลงไปในห้องใต้ดินที่เต็มไปด้วยฝุ่น วิศวกรของข้าเก็บถังไฟเหลวถังสุดท้าย ในขณะเดียวกัน [Glossary( 'พระราชวังบูโคลีโอน', 'BOUKOLEON_PALACE_GLOSS')] ก็เป็นเจ้าภาพการฝึกซ้อมอันน่าสะพรึงกลัว: ใต้รูปปั้นขนาดมหึมาของสิงโตและวัวที่กำลังทำสงคราม เรือรบที่น่าภาคภูมิใจพ่นไฟเหลวออกมา\n\nและเปลวไฟสังหารนั้นเต้นรำนานเพียงใด! ศัตรูของข้าควรหลีกเลี่ยงน่านน้ำอันเงียบสงบระหว่างยุโรปและอนาโตเลีย..."
 scheme_critical_moments.8061.a: "มังกรพิทักษ์มาร์มารา"
 BOUKOLEON_PALACE_GLOSS: "บนชายฝั่ง #EMP โพรพอนทิส#! (ทะเลมาร์มารา) ที่พำนักในคอนสแตนติโนเปิลสมัยศตวรรษที่ 5 แห่งนี้โดดเด่นด้วยท่าเรือส่วนตัวและคุกใต้ดินอันน่าสะพรึงกลัว"
 #fail event
 scheme_critical_moments.8062.t: "[scheme.GetNameNoTooltip]: ล้มเหลว"
 scheme_critical_moments.8062.desc: "ไฟนรก! ไฟนรก!\n\nเพลิงไหม้ที่ควบคุมไม่ได้กลืนกินเรือที่ติดอาวุธเครื่องสูบฉีดอีกลำ ขณะที่ลูกเรือที่กรีดร้องของเธอถูกเผาทั้งเป็น ข้าถูกบังคับให้คิดถึงส่วนผสมที่วุ่นวายทั้งหมด เครื่องสูบฉีดที่รั่วไหล กะลาสีที่ตายไปที่เกี่ยวข้องกับการเสี่ยงภัยครั้งนี้...\n\nสารชั่วร้าย เช่นนี้ถูกควบคุม #EMP ได้อย่างไร#!? อย่างไร?!?!"
 scheme_critical_moments.8062.a: "ข้าคงจะไม่มีวันรู้..."
