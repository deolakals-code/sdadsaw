 raid_estate_action: "บุก"
 raid_estate_desc: "ตระกูล [SCHEME.GetTargetTitle.GetHolder.GetHouse.GetBaseName] กำลังมั่นใจในตนเองเกินไป — การบุกปล้นจะสั่งสอน [SCHEME.GetTargetTitle.GetHolder.GetTitledFirstName] ให้รู้สำนึก [SCHEME.GetTargetTitle.GetHolder.GetHerHis]"
 raid_estate_desc_general: "$raid_estate$ คือ [hostile_scheme|E] ที่มุ่งเป้าไปที่การปล้น [domicile|E] ของ [house|E] อื่น แผนการนี้อิงตาม [intrigue|E], [domicile|E] และสถานะของ [house|E] และสามารถรวบรวม [agents|E] ได้\n\n$raid_estate$ ที่ประสบความสำเร็จอาจ ส่งผลให้เกิดการโจรกรรม [gold|E] ของเป้าหมาย สร้างความเสียหายแก่ [domicile|E] ของพวกเขา และอาจถึงขั้นสังหารสมาชิก [house|E] ของพวกเขาก็เป็นได้"
