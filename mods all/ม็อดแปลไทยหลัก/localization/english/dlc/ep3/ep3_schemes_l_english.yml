 scheme_critical_moments.8052.t: "[scheme.GetNameNoTooltip]: สำเร็จ"
 scheme_critical_moments.8052.desc: "เป็นเวลาหลายสัปดาห์ที่ผู้ส่งสารของข้าได้โจมตีคฤหาสน์ตระกูล [target.GetHouse.GetBaseName] ถือสาส์นประจบประแจงที่ยกย่องคุณธรรมและเชื้อสายอันยิ่งใหญ่ของพวกเขา\n\nวันนี้ข้ากรีดเปิดจดหมายตอบกลับที่รอคอยมานาน การประจบประแจงและความเคารพที่ไหลเยิ้มยืนยันว่า [target.GetTitledFirstName] ได้เข้าใจในที่สุด\n\n#EMP "ข้าถือว่าตระกูล [owner.GetHouse.GetBaseName] เป็นหนึ่งในตระกูลที่ยิ่งใหญ่ที่สุดของ [owner.GetTopLiege.GetPrimaryTitle.GetTierAsNameNoTooltip] เสมอมา และภูมิใจที่ได้นับท่านเป็นมิตร"#!"
 scheme_critical_moments.8052.a: "ถูกต้องแล้ว"
 scheme_critical_moments.8053.t: "[scheme.GetNameNoTooltip]: ล้มเหลว"
 scheme_critical_moments.8053.desc: "ผู้ส่งสารของข้าได้ส่งมอบคำหวานของข้าไปยังคฤหาสน์ตระกูล [target.GetHouse.GetBaseName] อย่างถูกต้องเป็นเวลาหลายสัปดาห์แล้ว แต่การตอบกลับที่คาดหวังกลับไม่ปรากฏ\n\nในที่สุดสาส์นที่ประทับตราของ [target.GetTitledFirstNamePossessive] ก็ถูกวางไว้ตรงหน้าข้า แต่ไม่มีคำพูดที่เอาชนะใจที่ข้ารอคอย\n\n#EMP "ท่าน [owner.GetFirstNameNoTooltip] ที่ดี ไม่มีใครปฏิเสธอำนาจและเกียรติยศของตระกูล [owner.GetHouse.GetBaseName] แต่เราไม่ใช่สุนัขรับใช้ของท่าน"#!"
 scheme_critical_moments.8053.a: "การตอบกลับที่กล้าหาญ"
 scheme_critical_moments.8054.t: "ตระกูลได้รับการผูกมิตร"
 scheme_critical_moments.8054.desc: "เป็นเวลาหลายสัปดาห์ สาส์นจาก [owner.GetTitledFirstName] กองอยู่บนโต๊ะทำงานของข้า แต่ละฉบับประจบประแจงตระกูล [target.GetHouse.GetBaseName] และชักชวนมิตรภาพของเรากับตระกูลของ [owner.GetHerHis] อย่างแนบเนียน\n\n"
 scheme_critical_moments.8054.success: "เป็นที่ชัดเจนว่า [owner.GetSheHe] พยายามที่จะได้รับการสนับสนุนจากเรา และเป็นการยากที่จะปฏิเสธข้อดีของการเป็นพันธมิตรกับตระกูลที่ทรงอำนาจ เช่นตระกูล [owner.GetHouse.GetBaseName]"
 scheme_critical_moments.8054.failure: "จดหมายที่แปลกประหลาดและดูถูกเหล่านี้ ทำให้เราตั้งคำถามถึงแรงจูงใจของ [owner.GetHerHis] เท่านั้น และตอกย้ำความเป็นอิสระอันน่าภาคภูมิใจของตระกูลเรา"
 scheme_critical_moments.8054.a.success: "เราเปิดรับการสนทนา..."
 scheme_critical_moments.8054.a: "เราไม่ใช่สุนัขรับใช้ของตระกูล [owner.GetHouse.GetBaseNameNoTooltip]!"
