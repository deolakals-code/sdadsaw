 scheme_critical_moments.1172.t: "$scheme_critical_moments.1132.t$"
 scheme_critical_moments.1172.desc: "ในช่วงหลายเดือนที่ผ่านมา ข้าไม่เคยพลาดโอกาสที่จะ ทำให้ [target.GetTitledFirstName] ดูเหมือนคนโง่ในที่สาธารณะ ข้าหลอกล่อให้ [target.GetHerHim] ทำผิดพลาดในราชสำนัก ทำให้ [target.GetHerHim] ดูด้อยกว่าในความรู้เรื่องคลาสสิก และชักนำให้ [target.GetHerHim] สนับสนุนมาตรการทางการเงินที่ไม่สามารถป้องกันได้เพียงเพื่อเข้ามาแก้ไข [target.GetHerHim]\n\nหลังจากการโต้วาทีทางศาสนาที่ประสบความสำเร็จอย่างมาก ซึ่งข้าได้ ทำให้ดูเหมือนว่า [target.GetFirstNameNoTooltip] กำลังส่งเสริมความเชื่อนอกรีตอย่างชำนาญ ข้าถือว่าพอใจกับผลลัพธ์ที่ได้"
 scheme_critical_moments.1172.a: "[target.GetFirstNameNoTooltip] ได้เรียนรู้ที่ทางของ [target.GetHerHis] แล้ว"
 scheme_critical_moments.1173.t: "$scheme_critical_moments.1133.t$"
 scheme_critical_moments.1173.desc: "ล้มเหลว ไม่ว่าข้าจะพยายามกี่ครั้ง [target.GetTitledFirstName] ดูเหมือนจะก้าวนำหน้าข้าอยู่เสมอ\n\nความรู้ด้านวรรณกรรมของ [target.GetHerHis|U] นั้นยอดเยี่ยม ความเข้าใจในประเด็นทางการเมืองของ [target.GetHerHis] นั้นลึกซึ้ง ความเข้าใจในแง่มุมที่ซับซ้อนที่สุดของศรัทธาของเรานั้นไม่สั่นคลอน หรืออย่างน้อย พวกมันก็แข็งแกร่งกว่าของข้ามาก"
 scheme_critical_moments.1173.a: "[target.GetFirstNameNoTooltip] เป็นคนที่รับมือยาก"
 challenge_status_invalidated_title: "@scheme_icon! แผนการท้าทายสถานะสิ้นสุดลง"
 scheme_critical_moments.1174.t: "สถานะถูกท้าทาย"
 scheme_critical_moments.1174.desc: "ข้าละอายใจที่จะยอมรับว่าระหว่างการปรากฏตัวต่อสาธารณะครั้งล่าสุดของข้า ทุกการเผชิญหน้ากับ [owner.GetTitledFirstName] ทำให้ข้าถูกหลอกและถูก ทำให้อับอาย\n\nข้าไม่รู้ว่าสิ่งนี้เกิดขึ้นได้อย่างไร แต่ทุกครั้งที่ข้าถูกขังอยู่ในการโต้วาทีกับ [owner.GetHerHim] ข้าดูเหมือนจะลืมมารยาทในราชสำนักทั้งหมด การอ้างอิงของข้าสับสนไปหมด และ [owner.GetSheHe] ทำให้ข้าฟังดูเหมือนคนโง่ในกรณีที่ดีที่สุด และเป็นผู้เห็นอกเห็นใจพวกนอกรีตที่โง่เขลาในกรณีที่เลวร้ายที่สุด\n\nข้าต้องถอยกลับมาและประเมินทุกสิ่งที่ข้าพูดใหม่สักพัก"
 scheme_critical_moments.1174.a: "ข้าไม่อยากจะเชื่อเลย..."
