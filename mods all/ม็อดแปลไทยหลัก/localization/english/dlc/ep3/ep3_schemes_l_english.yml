 scheme_critical_moments.1132.t: "[scheme.GetNameNoTooltip]: สำเร็จ"
 scheme_critical_moments.1132.desc: "วาทกรรมสาธารณะเต็มไปด้วยผลลัพธ์จากแผนการอันแยบยลของข้า การปล่อยข่าวลืออื้อฉาว การกล่าวหาอย่างคลุมเครือ และการซุบซิบนินทาไร้สาระของข้าได้ก่อให้เกิดการเปลี่ยนแปลงความรู้สึกที่มีต่อ [target.GetTitledFirstName] อย่างลึกซึ้ง ชื่อเสียงของ [target.GetHerHis|U] ย่อยยับ!\n\nภาพลักษณ์อันดีงามนั้นช่างถูกลอกคราบทองออกได้ง่ายดาย ถูก ทำให้มัวหมองอย่างกระตือรือร้น ด้วยคำพูดและในความคิดของผู้อื่น..."
 scheme_critical_moments.1132.desc_discovered: "\n\n[target.GetFirstNameNoTooltip] รู้ว่าข้ามีส่วนเกี่ยวข้อง แต่มันไม่สำคัญแล้ว! มันสายเกินไปแล้ว: ความเสียหายต่อชื่อเสียงของ [target.GetHerHis] ได้เกิดขึ้นแล้ว!"
 scheme_critical_moments.1132.desc_secret: "\n\n[target.GetFirstNameNoTooltip] ยังคงงุนงงกับการเสื่อมเสียชื่อเสียงของ [target.GetHerHis] โดยไม่รู้เลยว่าข้ามีส่วนเกี่ยวข้อง!"
 scheme_critical_moments.1132.a: "ช่างเป็นความสกปรกอันน่าพึงพอใจที่ข้าได้สุมกองไว้สูง!"
 slander_nickname_given_tt: "ได้รับสมัญญานามใส่ร้าย"
 receive_slanderous_nickname_tt: "[nickname|e] ในทางลบสำหรับ [target.GetShortUINameNoTooltip] เกิดขึ้น"

 scheme_critical_moments.1133.t: "[scheme.GetNameNoTooltip]: ล้มเหลว"
 scheme_critical_moments.1133.desc: "ไม่มีอะไรเลย หลายเดือนของการวางแผนและการวางอุบาย การปล่อยข่าวลือและการติดสินบน แต่ชื่อเสียงของ [target.GetTitledFirstNamePossessive] ก็ยังคงแข็งแกร่งเหมือนเดิม!"
 scheme_critical_moments.1133.desc_discovered: "\n\nที่แย่ไปกว่านั้น ข้าไม่เพียง แต่เสียเวลาและทรัพยากรไปเปล่าๆ แต่ [target.GetFirstNameNoTooltip] ยังรับรู้ถึงเจตนาร้ายที่ดำเนินการได้ไม่ดีของข้าอีกด้วย!"
 scheme_critical_moments.1133.desc_secret: "\n\nอย่างน้อย [target.GetFirstNameNoTooltip] ก็ยังคงไม่รู้เรื่องรู้ราวใดๆ เลยว่ามีอะไรเกิดขึ้น..."
 scheme_critical_moments.1133.a: "เป็นเพียงความพ่ายแพ้เล็กน้อย..."
 scheme_critical_moments.1134.t: "ถูกใส่ร้าย"
 scheme_critical_moments.1134.desc: "เมื่อข้าพูดคุยกับผู้อื่น ข้าเห็นความสงสัย ความกังวล หรือแม้กระทั่งความขบขันในสายตาของพวกเขา เสียงหัวเราะคิกคักและเสียงกระซิบกระซาบตามข้าไปทุกที่ที่ข้าเดิน\n\nคำพูดของข้าไม่มีน้ำหนักเหมือนเคย และสถานะของข้าในหมู่คนระดับเดียวกันดูเปราะบางอย่างน่าสงสัย ข่าวลือที่บ้าคลั่งและประนีประนอมที่สุดแพร่สะพัดเกี่ยวกับ #EMP ข้า#!... และดูเหมือนว่าผู้คนจะเชื่อทั้งหมด"
 scheme_critical_moments.1134.desc_given_nickname: "\n\nยิ่งไปกว่านั้น ข้าได้ยินมาว่ามีเสียงที่ไม่หวังดีเรียกข้าด้วยชื่อใหม่ พวกเขากล้าเรียกข้าว่า [ROOT.Char.GetNickname]!"
 scheme_critical_moments.1134.desc_discovered: "\n\nสายลับของข้ามั่นใจ: เป็น [owner.GetTitledFirstName] ที่วางแผนการใส่ร้ายชื่อเสียงของข้าครั้งนี้..."
 scheme_critical_moments.1134.a: "ช่างฉลาดหลักแหลม..."
