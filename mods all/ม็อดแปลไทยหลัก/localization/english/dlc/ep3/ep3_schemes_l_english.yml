 scheme_critical_moments.8032.t: "[scheme.GetNameNoTooltip]: สำเร็จ"
 scheme_critical_moments.8032.desc: "ในที่สุดรุ่งสางก็นำข่าวจากคฤหาสน์ [target.GetHouse.GetBaseName] ใน [target_domicile.GetLocation.GetBaronyNameExplicitlyNoTooltip] มาให้ พร้อมกับการยืนยันความสำเร็จของเรา!\n\nพวก [target.Custom2('InsultNounPlural', ROOT.Char)] ถูกจู่โจมโดยไม่ทันตั้งตัว"
 scheme_critical_moments.8032.kill: "และ [flavor_victim.GetTitledFirstName] ผู้เป็น [target.Custom2('RelationToMeShort', flavor_victim)] ของ [target.GetFirstNamePossessiveNoTooltip] นอนตาย — ผู้รอดชีวิตต้องอยู่กับความล้มเหลวนี้..."
 scheme_critical_moments.8032.maim: "และ [flavor_victim.GetTitledFirstName] ผู้เป็น [target.Custom2('RelationToMeShort', flavor_victim)] ของ [target.GetFirstNamePossessiveNoTooltip] จะแบกรับรอยแผลเป็นจากความล้มเหลวนี้ไปตลอดชีวิตของ [flavor_victim.GetHerHis]..."
 scheme_critical_moments.8032.imprison: "และไม่ต้องสงสัยเลยว่ากำลังตามหา [flavor_victim.GetTitledFirstName] ผู้เป็น [target.Custom2('RelationToMeShort', flavor_victim)] ของ [target.GetFirstNamePossessiveNoTooltip] ซึ่งตอนนี้กำลังทุกข์ทรมานอยู่ในพันธนาการ!"
 scheme_critical_moments.8032.fallback: "และถูก ทำให้ตกต่ำ เพื่อให้ทุกคนใน [owner.GetTopLiege.GetPrimaryTitle.GetDefinitiveNameNoTooltip|l] ได้เห็น!"
 scheme_critical_moments.8032.permission: "\n\nเราได้รับการสนับสนุนจาก [owner.GetTopLiege.GetPrimaryTitle.GetTierAsNameNoTooltip] และคนโง่เหล่านั้นจะหาทางแก้แค้นไม่ได้..."
 scheme_critical_moments.8032.emperor: "\n\nข้าคือ [owner.GetTopLiege.GetPrimaryTitle.GetTierAsNameNoTooltip] และไม่มีอะไรที่พวกเขาสามารถทำเพื่อหยุดข้าได้..."
 scheme_critical_moments.8032.crime: "\n\nน่าเศร้า เป็นที่ชัดเจนว่าการมีส่วนร่วมของเราในเรื่องนี้ไม่ได้ถูกมองข้าม และ [target.GetTitledFirstName] จะ ทำให้แน่ใจว่าทุกคนใน [owner.GetTopLiege.GetPrimaryTitle.GetTierAsNameNoTooltip] ได้ยินเรื่อง "การทรยศของตระกูล [owner.GetHouse.GetBaseName]""
 scheme_critical_moments.8032.secret: "\n\nเป็นโบนัสเพิ่มเติม ดูเหมือนว่าพวกเขาจะไม่รู้ว่าเราอยู่เบื้องหลังการโจมตี และน่าเสียดายที่เราไม่สามารถเยาะเย้ยชัยชนะของตระกูล [owner.GetHouse.GetBaseName] ต่อหน้า [target.GetTitledFirstNamePossessive] ในที่สาธารณะได้ — ยัง"
 scheme_critical_moments.8032.a: "ชิ ให้ [target.GetHerHim] กรีดร้องไป"
 scheme_critical_moments.8032.a.secret: "ต้องมีการเฉลิมฉลอง!"
 scheme_critical_moments.8033.t: "[scheme.GetNameNoTooltip]: ล้มเหลว"
 scheme_critical_moments.8033.desc: "ในที่สุดรุ่งสางก็นำข่าวจากคฤหาสน์ [target.GetHouse.GetBaseName] ใน [target_domicile.GetLocation.GetBaronyNameExplicitlyNoTooltip] มาให้ แม้จะไม่ใช่ข่าวที่เราอยากได้ยินนัก...\n\nพวก [target.Custom2('InsultNounPlural', ROOT.Char)] กลับเตรียมพร้อมรับมือการโจมตีอย่างใดอย่างหนึ่ง และขัดขวางผู้แทรกซึมของเราก่อนที่พวกเขาจะมีโอกาสสร้างความเสียหายใด ๆ"
 scheme_critical_moments.8033.captured: "\n\nดูเหมือนว่า [captured.GetTitledFirstName] ผู้เป็น [owner.Custom2('RelationToMeShort', SCOPE.sC('captured'))] ของข้า ถูกจับได้ในการแตกพ่าย และความหวังใดๆ ที่จะซ่อนการมีส่วนร่วมของตระกูล [owner.GetHouse.GetBaseName] ก็พังทลายลง..."
 scheme_critical_moments.8033.discovered: "\n\nอย่างไรก็ตาม ดูเหมือนว่าพวกเขาจะรู้ได้อย่างไรว่าตระกูล [owner.GetHouse.GetBaseName] อยู่เบื้องหลังการโจมตี และจะร้องขอการชดใช้..."
 scheme_critical_moments.8033.fallback: "\n\nอย่างน้อยเราก็สบายใจได้ เพราะดูเหมือนว่าพวกเขาจะไม่รู้ถึงการมีส่วนร่วมของเราในอุบายนี้..."
 scheme_critical_moments.8033.secret: "\n\nแม้จะมีความพ่ายแพ้นี้ ดูเหมือนว่าเราจะสบายใจได้เมื่อรู้ว่าพวกเขายังไม่ได้สงสัยตระกูล [owner.GetHouse.GetBaseName]"
 scheme_critical_moments.8033.a: "การเตรียมการทั้งหมดนั้น... เพื่อ #EMP ไม่มีอะไร#!!"
 scheme_critical_moments.8034.t.known: "คฤหาสน์ถูกบุก: การโจมตีของตระกูล [owner.GetHouse.GetBaseNameNoTooltip]"
 scheme_critical_moments.8034.t: "คฤหาสน์ถูกบุก: ผู้โจมตีไม่ทราบชื่อ"
 scheme_critical_moments.8034.desc: "ในยามรุ่งอรุณ ข่าวลือที่ตื่นตระหนกเกี่ยวกับการบุกคฤหาสน์ของตระกูลใน [target_domicile.GetLocation.GetBaronyNameExplicitlyNoTooltip] มาถึงข้าอย่างรวดเร็ว"
 scheme_critical_moments.8034.success: "และหัวใจของข้าหยุดเต้นเมื่อเรื่องราวความพินาศและความโหดร้ายหลั่งไหลเข้ามา"
 scheme_critical_moments.8034.failure: "และข้าถอนหายใจด้วยความโล่งอกเมื่อได้รับการยืนยันว่าการโจมตีถูกขัดขวาง"
 scheme_critical_moments.8034.kill: "\n\nพวกเขาบอกข้าว่า [flavor_victim.GetTitledFirstName] ผู้เป็น [target.Custom2('RelationToMeShort', SCOPE.sC('flavor_victim'))] ของข้า นอนตาย ถูกสังหารเหมือนสัตว์โดยปีศาจบางตน..."
 scheme_critical_moments.8034.maim: "\n\nพวกเขาบอกข้าว่า [flavor_victim.GetTitledFirstName] ผู้เป็น [target.Custom2('RelationToMeShort', SCOPE.sC('flavor_victim'))] ของข้า ได้รับบาดเจ็บสาหัส และแทบไม่รอดชีวิตจากเหตุการณ์เลวร้าย..."
 scheme_critical_moments.8034.imprison: "พวกเขาบอกข้าว่า [flavor_victim.GetTitledFirstName] ผู้เป็น [target.Custom2('RelationToMeShort', SCOPE.sC('flavor_victim'))] ของข้า ถูกจำคุก ถูกล่ามโซ่เหมือนสุนัข..."
 scheme_critical_moments.8034.captured: "\n\nยามของเราสามารถจับผู้บุกรุกได้คนหนึ่ง และการปรากฏตัวของ [captured.GetTitledFirstName] ผู้เป็น [owner.Custom2('RelationToMeShort', captured)] ของ [owner.GetTitledFirstName] ยืนยันว่าตระกูล [owner.GetHouse.GetBaseName] อยู่เบื้องหลังเรื่องนี้"
 scheme_critical_moments.8034.discovered: "\n\nหลังจากเหตุการณ์ ทุกคนเห็นพ้องกันว่านี่เป็นฝีมือของตระกูล [owner.GetHouse.GetBaseName] อย่างชัดเจน..."
 scheme_critical_moments.8034.fallback: "\n\nเมื่อตรวจสอบที่เกิดเหตุ ยามไม่พบเบาะแสว่าใครอยู่เบื้องหลังเรื่องนี้..."
 scheme_critical_moments.8034.permission: "\n\nปฏิกิริยาของ [owner.GetTopLiege.GetTitleAsNamePossessiveNoTooltip] ทำให้ผิดหวังอย่างมาก — จะเป็นอย่างไรถ้า [owner.GetTopLiege.GetSheHe] มีส่วนเกี่ยวข้องในเรื่องนี้...?"
 scheme_critical_moments.8034.emperor: "\n\nความขุ่นเคืองนี้ และด้วยน้ำมือของ [owner.GetTopLiege.GetTitleAsNamePossessiveNoTooltip] เอง... เราจะทำอย่างไร?!"
 scheme_critical_moments.8034.crime: "\n\nความอุกอาจอย่างโจ่งแจ้งนี้ยิ่งตอกย้ำความเสื่อมทรามของตระกูลชั่วร้ายนั้น และความจำเป็นในการกำจัดพวกเขาออกจาก [owner.GetTopLiege.GetPrimaryTitle.GetTierAsNameNoTooltip]!"
 scheme_critical_moments.8034.a.discovered: "พวกสุนัขตระกูล [owner.GetHouse.GetBaseNameNoTooltip] จะต้องชดใช้!"
 scheme_critical_moments.8034.a: "เรื่องนี้เกิดขึ้นได้อย่างไร...?"
 scheme_critical_moments.8035.t: "[scheme.GetNameNoTooltip]: การเตรียมการขั้นสุดท้าย"
 scheme_critical_moments.8035.desc: "หลังจากการวางแผนอย่างพิถีพิถันเป็นเวลาหลายสัปดาห์ ตระกูล [owner.GetHouse.GetBaseName] ก็พร้อมที่จะเริ่มการโจมตีของเรา คนของเราอยู่ในตำแหน่งแล้ว คฤหาสน์ของ [target.GetTitledFirstNamePossessive] ใน [target_domicile.GetLocation.GetBaronyNameExplicitlyNoTooltip] ถูกสอดแนมแล้ว และรายละเอียดของการบุกก็ตกลงกันแล้ว\n\nเหลือคำถามเพียงข้อเดียว: จะจัดการกับตระกูล [target.GetHouse.GetBaseName] อย่างไรหลังจากชัยชนะอันหลีกเลี่ยงไม่ได้ของเรา?"
 scheme_critical_moments.8035.permission: "\n\nด้วยการสนับสนุนของ [owner.GetTopLiege.GetTitleAsNamePossessive] ไม่จำเป็นต้องมีความยับยั้งชั่งใจที่ไม่สมควร..."
 scheme_critical_moments.8035.crime: "\n\nหากการมีส่วนร่วมของข้าถูกค้นพบ [owner.GetTopLiege.GetTitleAsName] จะต้องได้ยินเรื่องนี้อย่างแน่นอน..."
 scheme_critical_moments.8035.emperor: "\n\nถึงเวลาแสดงให้ [owner.GetPrimaryTitle.GetTierAsNameNoTooltip] เห็นว่าจะเกิดอะไรขึ้นกับผู้ที่ขวางทางข้า..."
 scheme_critical_moments.8035.a: "ฆ่าสุนัขตระกูล [target.GetHouse.GetBaseNameNoTooltip] ที่เจ้าพบ"
 scheme_critical_moments.8035.a.tt: "หาก [scheme|E] สำเร็จ สมาชิกของตระกูล [target.GetHouse.GetBaseName] ที่พบจะถูกฆ่า"
 scheme_critical_moments.8035.tt: "[scheme|E] จะสิ้นสุดลง"
 scheme_critical_moments.8035.b: "ปล่อยให้พวกเขามีชีวิตอยู่ — พร้อมกับบางสิ่งที่จะ ทำให้พวกเขาระลึกถึงเรา"
 scheme_critical_moments.8035.b.tt: "หาก [scheme|E] สำเร็จ สมาชิกของตระกูล [target.GetHouse.GetBaseName] ที่พบจะได้รับ [trait|E] [GetTrait('blind').GetName( GetNullCharacter )], [GetTrait('disfigured').GetName( GetNullCharacter )] หรือ [GetTrait('eunuch_1').GetName( GetNullCharacter )]"
 scheme_critical_moments.8035.c: "นำเชลยกลับมาให้ข้า"
 scheme_critical_moments.8035.c.tt: "หาก [scheme|E] สำเร็จ สมาชิกของตระกูล [target.GetHouse.GetBaseName] ที่พบจะถูก [imprisoned|E] โดยท่าน"
 scheme_critical_moments.8035.c.warning: "@warning_icon! #X ไม่มีโอกาสที่การมีส่วนร่วมของท่านจะยังคงเป็น [secret|E]#!"
 scheme_critical_moments.8035.d: "ไว้ชีวิตพวกเขา เราไม่ต้องการเลือดของพวกเขา"
 raided_estate_crime: "บุกรุกคฤหาสน์ของข้า"
