 scheme_critical_moments.4011.desc: "ข้ามองดูจดหมายที่คนรับใช้คนหนึ่งเพิ่งวางลง กระดาษหนังนั้นหรูหรา แม้กระทั่งมีกลิ่นหอม จดหมายจากเมืองหลวง ไม่ต้องสงสัยเลย\n\n"[target.GetTitleAsNameNoTooltip] เจ้าเหนือหัวของ [ROOT.Char.GetHerHis] กำลังประสบกับสถานการณ์ที่ไม่พึงประสงค์อย่างยิ่ง..."\n\nรอยยิ้มปรากฏบนใบหน้าของข้า ข้าไม่จำเป็นต้องอ่านต่อ ความชอบธรรมของ [target.GetHerHis] ถูกทำลายแล้ว — โอกาสอันยอดเยี่ยมที่จะโจมตี"
 scheme_critical_moments.4011.a: "นำหมึกมาให้ข้า"
 scheme_critical_moments.4011.tt: "ความชอบธรรมถูกทำลาย!"
 damage_legitimacy_scheme_toast_desc: "[owner.GetShortUINameNoTooltip|U] ผู้เป็น [target.Custom2('RelationToMeShort', SCOPE.sC('owner'))] ของท่าน ได้ทำลาย [legitimacy|E] ของท่าน"
 
 scheme_critical_moments.4012.t: "$damage_legitimacy_scheme$: ล้มเหลว"
 scheme_critical_moments.4012.desc.intro: "มีบางครั้ง — ไม่มากนัก — ที่ข้ายินดีที่บางสิ่งผิดพลาดไป นี่ไม่ใช่หนึ่งในนั้น\n\n[target.GetTitledFirstName] อาจกำลังนั่งอย่างสง่างามบนบัลลังก์ของ [target.GetHerHis] ในขณะนี้ "
 scheme_critical_moments.4012.desc.byzantium: "อาจกำลังขอให้นางในราชสำนักบางคนให้ความบันเทิงแก่ [target.GetHerHim]"
 scheme_critical_moments.4012.desc.other: "นักแสดงปาหี่อาจกำลังกระโดดโลดเต้นไปมา บางทีอาจมีนักดนตรีต่างชาติที่ถูกนำมาเป็นพิเศษสำหรับโอกาสนี้"
 scheme_critical_moments.4012.desc.outro: ""ทรงพระเจริญ [target.GetTitleAsNameNoTooltip]!" สามารถได้ยินได้ตามท้องถนน\n\n"อดทนไว้ [ROOT.Char.GetTitleAsNameNoTooltip] อดทนไว้" ข้าบอกตัวเอง\n\nการล่าสัตว์นั้นเข้าข้างผู้ที่รอคอยได้"
 scheme_critical_moments.4012.a: "อดทน"
 
