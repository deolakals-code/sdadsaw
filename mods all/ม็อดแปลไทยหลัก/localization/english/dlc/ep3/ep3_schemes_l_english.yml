 scheme_critical_moments.8066.t: "[scheme.GetNameNoTooltip]: สำเร็จ"
 scheme_critical_moments.8066.desc: ""ข้าพอใจกับข้อมูลที่เจ้าได้มา เจ้าพบอะไรนะ? [secrets_found_value] รึ? ไม่เลวเลย..." [hegemon.GetName] โน้มตัวมาข้างหน้าบนบัลลังก์ของ [hegemon.GetHerHis]\n\n"ข้าคาดหวังไว้ไม่น้อยไปกว่านี้จาก [ROOT.Char.Custom('CouncilPosition')] ของข้า ข้าเชื่อว่าเจ้า #EMP จะ#! ทำผลงานได้ดีต่อไป!" [hegemon.GetSheHe|U] พยักหน้าให้คนรับใช้ ขณะที่พวกเขานำรางวัลก้อนโตออกมา"
 scheme_critical_moments.8066.a: ""ข้ามาที่นี่เพื่อรับใช้ [hegemon.GetTitleAsNameNoTooltip]""
 scheme_critical_moments.8066.b: ""ข้าจะส่งต่อความเมตตาของท่านไปยังลูกน้องของข้า""
 scheme_critical_moments.8067.t: "[scheme.GetNameNoTooltip]: ล้มเหลว"
 scheme_critical_moments.8067.desc: ""ข้ารอรายงานจากเจ้า แต่ก็ไม่มีอะไรมา ข้ากังวล... หรือว่าเจ้าลืมหน้าที่ของตนไปแล้ว?" [hegemon.GetName] กล่าวเย้ยหยันข้า\n\n"ข้าส่งคนของข้าไปทุกหัวมุมใน [target.GetCapitalLocation.GetName] แล้ว แต่ไร้ผล" ข้าอธิบาย "ไม่ข้าราชสำนักของ [target.GetTitledFirstNamePossessive] ภักดี ก็คงไม่มีอะไรที่ควรค่าแก่การลือกันเลย"\n\n"ข้ออ้างที่น่ารำคาญ... ข้านึกว่าเจ้าจะทำได้ดีกว่านี้ อย่างน้อยก็โกหกให้มันน่าฟังกว่านี้หน่อย เมื่อพิจารณาว่าตำแหน่งของเจ้ากำลังสั่นคลอน!" [hegemon.GetHerHis] ส่ายหน้า เป็นสัญญาณให้ข้าออกไป"
 scheme_critical_moments.8067.a: "คราวนี้ข้ารอดตัวไปได้อย่างง่ายดาย"
