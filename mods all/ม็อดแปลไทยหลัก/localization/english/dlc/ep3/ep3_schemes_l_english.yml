 scheme_critical_moments.1142.t: "$scheme_critical_moments.1132.t$"
 scheme_critical_moments.1142.desc_self: "ความพยายามทั้งหมดที่ทุ่มเทให้กับการรณรงค์ส่งเสริมตนเองของข้าได้ผลตอบแทนแล้ว\n\nสถานะของข้าในหมู่คนระดับเดียวกันดีขึ้น ผู้สนับสนุนใหม่ๆ กำลังหลั่งไหลเข้ามาสนับสนุนการสมัครของข้า และเป้าหมายของข้าก็ใกล้เข้ามามากกว่าที่เคย!"
 scheme_critical_moments.1142.desc_other: "เวลาและทรัพยากรมากมายที่ทุ่มเทให้กับการส่งเสริมการสมัครของ [target.GetTitledFirstNamePossessive] ได้บังเกิดผลแล้ว\n\nสถานะของ [target.GetHerHis|U] ในหมู่คนระดับเดียวกันดีขึ้น ผู้สนับสนุนใหม่ๆ เชื่อมั่นในคุณค่าของ [target.GetHerHis] แล้ว และการ แต่งตั้งของ [target.GetHerHis] ก็ใกล้เข้ามาอีกก้าวหนึ่งแล้ว!"
 scheme_critical_moments.1142.a: "ผลลัพธ์ยอดเยี่ยม"
 scheme_critical_moments.1142.tt: "การสมัครได้รับการส่งเสริม!"
 promote_toast_scheme_desc: "[owner.GetShortUINameNoTooltip|U] ผู้เป็น [target.Custom2('RelationToMeShort', SCOPE.sC('owner'))] ของท่าน ได้ส่งเสริมการสมัครของท่าน"
 scheme_critical_moments.1143.t: "$scheme_critical_moments.1133.t$"
 scheme_critical_moments.1143.desc_self: "พลังงานและทรัพยากรทั้งหมดที่ทุ่มเทให้กับการรณรงค์ส่งเสริมตนเองของข้านั้นไม่เพียงพอ ไม่มีใครเชื่อมั่นในคุณค่าของข้าหรือหวั่นไหวต่อคำสัญญา — และสินบน — ของข้า ดังนั้นสถานะของข้าจึงยังคงไม่เปลี่ยนแปลง\n\nข้าจะต้องคิดหาวิธีอื่นเพื่อส่งเสริมการสมัครของข้า"
 scheme_critical_moments.1143.desc_other: "แม้ว่าข้าจะพยายามอย่างเต็มที่แล้ว แต่ก็ไม่มีทางที่จะ ทำให้ [target.GetTitledFirstName] เป็นผู้สมัครที่น่าพอใจมากขึ้นได้...\n\nข้าคงจะต้องคิดหาวิธีอื่น เพื่อให้แน่ใจว่า [target.GetHerHim] จะได้ตำแหน่งที่ดี"
 scheme_critical_moments.1143.a: "โอกาสที่เสียไป"
