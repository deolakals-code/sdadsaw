 scheme_critical_moments.1152.t: "$scheme_critical_moments.1132.t$"
 scheme_critical_moments.1152.desc: "หลังจากคร่ำเคร่งกับตำราเก่าแก่จำนวนนับไม่ถ้วน ประจบประแจง ติดสินบน และโกหกข้าราชการนับไม่ถ้วน และปลอมแปลงเอกสาร ในที่สุดข้าก็สามารถนำเสนอสิทธิ์เรียกร้องที่น่าเชื่อถือต่อ [target.GetName] ได้"
 scheme_critical_moments.1152.desc_discovered: "\n\nน่าเสียดายที่ไม่สามารถเก็บ #EMP การมีส่วนร่วมของข้า#! เป็นความลับได้ แต่หลักฐาน — ไม่ว่าจะปลอมหรือไม่ — ตอนนี้มีมากเกินกว่าจะเพิกเฉยได้"
 scheme_critical_moments.1152.desc_secret: "\n\nดูเหมือนจะไม่มีใครพบว่าการปรากฏตัวอย่างกะทันหันของสิทธิ์เรียกร้อง #EMP ที่มีเอกสารครบถ้วนสมบูรณ์#! ของข้าน่าสงสัย"
 scheme_critical_moments.1152.a: "ยอดเยี่ยม"
 scheme_critical_moments.1153.t: "$scheme_critical_moments.1133.t$"
 scheme_critical_moments.1153.desc: "ไม่ว่าข้าจะติดสินบนคนกี่คนหรือปลอมแปลงเอกสารกี่ฉบับ ดูเหมือนว่าสิทธิ์เรียกร้องของข้าต่อ [target.GetName] ยังคงฟังดูไม่น่าเชื่อถือสำหรับคนส่วนใหญ่"
 scheme_critical_moments.1153.desc_discovered: "\n\nและยังเป็นที่รู้กันทั่วไปว่าข้าพยายามมากเกินไป"
 scheme_critical_moments.1153.desc_secret: "\n\nอย่างน้อยที่สุด ก็จะไม่มีใครรู้ถึงความล้มเหลวของข้า"
 scheme_critical_moments.1153.a: "น่าผิดหวัง"
