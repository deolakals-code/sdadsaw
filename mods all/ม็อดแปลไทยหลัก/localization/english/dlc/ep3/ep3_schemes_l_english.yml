 scheme_critical_moments.8002.t: "[scheme.GetNameNoTooltip]: สำเร็จ"
 scheme_critical_moments.8002.desc: "หลังจากการโต้เถียง การอภิปราย และการกดดันอย่างมาก เมล็ดพันธุ์ที่ข้าปลูกไว้อย่างระมัดระวังก็ได้ผลในที่สุด การเต้นรำอันเชื่องช้าระหว่างข้าราชการ [owner.GetTopLiege.GetPrimaryTitle.GetAdjectiveNoTooltip] [owner.GetTopLiege.GetTitleAsNameNoTooltip] ผู้เอาแน่เอานอนไม่ได้ และตัวแทนของ [target_title.GetNameNoTier] ในที่สุดก็ตัดสินให้ [target_title.GetTierAsNameNoTooltip] อยู่ภายใต้อำนาจ [ROOT.Char.GetPrimaryTitle.GetAdjective] นับจากนี้ไป\n\nความพยายามอันน่าสมเพชของ [target.GetTitledFirstNamePossessive] ที่จะยึดติดกับดินแดนของข้า และต่อต้านอิทธิพลอันกว้างขวางของข้าในราชสำนักนั้นไร้ผลโดยสิ้นเชิง"
 scheme_critical_moments.8002.a: "[target_title.GetNameNoTierNoTooltip] เป็น #EMP ของข้า#!."
 scheme_critical_moments.8003.t: "[scheme.GetNameNoTooltip]: ล้มเหลว"
 scheme_critical_moments.8003.desc: "แม้ว่าข้าจะวิงวอน ช่วยเหลือ และประจบประแจงอย่างระมัดระวัง แต่การประท้วงของข้าก็ไม่ได้รับการรับฟังในที่สุด...\n\nข้าราชการ [owner.GetTopLiege.GetPrimaryTitle.GetAdjectiveNoTooltip] และ [owner.GetTopLiege.GetTitleAsNameNoTooltip] ผู้เอาแน่เอานอนไม่ได้ ได้เพียงยืนยันเขตแดนปัจจุบันของ [target.GetPrimaryTitle.GetTierAsNameNoTooltip] [owner.GetPrimaryTitle.GetAdjective] และ [target.GetPrimaryTitle.GetAdjective]..."
