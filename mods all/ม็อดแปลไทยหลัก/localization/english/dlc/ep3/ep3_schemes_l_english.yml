 scheme_critical_moments.8012.t: "[scheme.GetNameNoTooltip]: สำเร็จ"
 scheme_critical_moments.8012.desc: "ต้องใช้ความพยายามบ้าง แต่การเข้าถึงราชสำนักของข้าก็เพียงพอสำหรับงานนี้\n\nข้อโต้แย้งของข้า และสินบนและการช่วยเหลือที่ไม่ได้กล่าวถึงนั้นมากเกินไปสำหรับข้าราชการและ [owner.GetTopLiege.GetTitleAsNameNoTooltip] [target.GetTitledFirstName] จะไม่พอใจ แต่ตอนนี้มันสำคัญอะไร?\n\nมันเสร็จสิ้นแล้ว ข้าจะได้ปกครอง [target_title.GetNameNoTier] ควบคู่ไปกับ [ROOT.Char.GetPrimaryTitle.GetTierAsNameNoTooltip] [ROOT.Char.GetPrimaryTitle.GetAdjective] และดินแดนของมันจะอยู่ภายใต้อำนาจของข้าทันที"
 scheme_critical_moments.8012.a: "[target_title.GetNameNoTierNoTooltip] เป็น #EMP ของข้า#!."
 scheme_critical_moments.8013.t: "[scheme.GetNameNoTooltip]: ล้มเหลว"
 scheme_critical_moments.8013.desc: "แม้ว่าข้าจะวิงวอน ช่วยเหลือ และประจบประแจงอย่างระมัดระวัง แต่การประท้วงของข้าก็ไม่ได้รับการรับฟังในที่สุด...\n\nข้าราชการ [owner.GetTopLiege.GetPrimaryTitle.GetAdjectiveNoTooltip] และ [owner.GetTopLiege.GetTitleAsNameNoTooltip] ผู้เอาแน่เอานอนไม่ได้ ได้เพียงยืนยันการแบ่งแยกดินแดน [owner.GetPrimaryTitle.GetAdjective] และ [target.GetPrimaryTitle.GetAdjective]..."
 scheme_critical_moments.8013.a: "พวกขันทีน่ารังเกียจ"
 scheme_critical_moments.8013.tt.failed: "[scheme.GetOwner.GetShortUIName] พยายามผนวกเขตปกครองเจ้าเมืองของท่าน แต่ล้มเหลว!"
 scheme_critical_moments.8014.t: "เขตปกครองเจ้าเมืองถูกผนวก: [target_title.GetNameNoTierNoTooltip]"
 scheme_critical_moments.8014.desc: "เบื้องหลังประตูอันสูงส่งของพระราชวังหลวง ใยแมงมุมของ [owner.GetTitledFirstName] ยังคงถักทอต่อไป วันนี้สาส์นสั้นๆ ที่ประทับตราสีแดงชาดของ [owner.GetTopLiege.GetTitleAsNamePossessive] ยืนยันสิ่งที่เลวร้ายที่สุด\n\nดินแดนของ [target_title.GetNameNoTier] จะอยู่ภายใต้การปกครองของ [owner.GetTitledFirstName] ทันที โดยพื้นฐานแล้วเป็นการขยาย [owner.GetPrimaryTitle.GetTierAsNameNoTooltip] [owner.GetPrimaryTitle.GetAdjective] — ..."
 scheme_critical_moments.8014.a: "บาดแผลนี้จะไม่มีวันลืมเลือนในเร็ววัน"
 scheme_critical_moments.8015.t: "เขตปกครองเจ้าเมืองถูกผนวก: [target_title.GetNameNoTierNoTooltip]"
 scheme_critical_moments.8015.desc: "หลังจากหลายสัปดาห์ของแรงกดดันทางการเมืองและการเคลื่อนไหวในราชสำนัก [owner.GetTitledFirstName] ประสบความสำเร็จในการได้รับความรับผิดชอบต่อดินแดนของ [target_title.GetNameNoTier] ซึ่งในทางปฏิบัติแล้วเป็นการขยาย [owner.GetPrimaryTitle.GetTierAsNameNoTooltip] [owner.GetPrimaryTitle.GetAdjective] ของ [owner.GetHerHis]"
 scheme_critical_moments.8015.liege: "\n\nวงล้อของระบบราชการ [owner.GetTopLiege.GetPrimaryTitle.GetAdjectiveNoTooltip] หมุนอยู่เสมอ และแรงผลักดันของมันก็แทบจะหยุดไม่ได้ — แม้ แต่สำหรับ [owner.GetTopLiege.GetTitleAsNameNoTooltip]\n\nข้าได้ แต่หวังว่า [owner.GetTitledFirstName] จะใช้พลังงานของ [owner.GetHerHis] ในการรับใช้ [ROOT.Char.GetPrimaryTitle.GetTierAsNameNoTooltip] ไม่ใช่ [owner.GetHerselfHimself]..."
 scheme_critical_moments.8015.vassal: "\n\nวงล้อของระบบราชการ [owner.GetTopLiege.GetPrimaryTitle.GetAdjectiveNoTooltip] หมุนอยู่เสมอ และแรงผลักดันของมันก็แทบจะหยุดไม่ได้ — แม้ แต่สำหรับ [owner.GetTopLiege.GetTitleAsNameNoTooltip]"
 scheme_critical_moments.8015.same_house: "\n\nเราได้ แต่หวังว่าการเคลื่อนไหวนี้จะเป็นประโยชน์ต่อตระกูล [ROOT.Char.GetHouse.GetName] ทั้งหมดในท้ายที่สุด..."
 scheme_critical_moments.8015.target_house: "\n\nความขุ่นเคืองนี้เป็นการทำลายสถานะของตระกูล [ROOT.Char.GetHouse.GetBaseName] อย่างร้ายแรง..."
 scheme_critical_moments.8015.fallback: "\n\n#EMP การรัฐประหาร#! นี้จะนำพาตระกูล [ROOT.Char.GetHouse.GetBaseName] ไปสู่จุดสูงสุดใหม่อย่างแน่นอน..."
 scheme_critical_moments.8015.a: "น่าสนใจ"
