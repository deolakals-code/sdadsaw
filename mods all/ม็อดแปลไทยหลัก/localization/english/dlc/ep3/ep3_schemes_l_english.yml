 scheme_critical_moments.8022.t: "[scheme.GetNameNoTooltip]: สำเร็จ"
 scheme_critical_moments.8022.desc: "การอภิปรายใน [owner.GetTopLiege.GetCapitalLocation.GetName] นั้นยาวนานและน่าเบื่อหน่าย แต่ข้าราชการก็ยอมจำนนต่อภูมิปัญญาในข้อเสนอของข้าในที่สุด [destroyed_title.GetNameNoTier] สิ้นสภาพแล้ว ดินแดนเก่าแก่ของมันเป็นเพียงส่วนหนึ่งของ [target_title.GetTierAsNameNoTooltip] ใหม่แห่ง [target_title.GetNameNoTier] และ #EMP ข้า#! คือ [owner.GetTitleAsNameNoTooltip] ของมัน\n\nการเปลี่ยนแปลงครั้งใหญ่กำลังจะเกิดขึ้น — ต่อการบริหารของข้า ต่อ [owner.GetTopLiege.GetPrimaryTitle.GetNameNoTooltip] ต่อสถานะของตระกูล [owner.GetHouse.GetBaseName]!"
 scheme_critical_moments.8022.a: "[owner.GetTitleAsNameNoTooltip]... ข้าชอบเสียงนี้"
 scheme_critical_moments.8023.t: "[scheme.GetNameNoTooltip]: ล้มเหลว"
 scheme_critical_moments.8023.desc: "การทาบทามที่ข้าจัดเตรียมไว้อย่างระมัดระวังใน [owner.GetTopLiege.GetCapitalLocation.GetNameNoTooltip] — หลายเดือนของการวางแผนอย่างพิถีพิถันและการทูตอย่างนุ่มนวล — นั้นไร้ผล\n\nข้าราชการปฏิเสธที่จะยอมรับภูมิปัญญาในข้อเสนอของข้า การ ทำให้การบริหารของภูมิภาคง่ายขึ้นภายใต้สำนักงาน [target_title.GetAdjective] ที่กว้างขวางถูกปัดตกไปว่า "ไม่จำเป็น" และ "ไม่สามารถปฏิบัติได้จริง"..."
 scheme_critical_moments.8023.a: "พวกเสมียนน่ารังเกียจ"
 scheme_critical_moments.8023.tt.failed: "[scheme.GetOwner.GetShortUIName] พยายามก่อตั้งเดสปอเตต แต่ล้มเหลว!"
 scheme_critical_moments.8024.t: "เดสปอเตตก่อตั้งแล้ว: [target_title.GetNameNoTierNoTooltip]"
 scheme_critical_moments.8024.desc: "เป็นเวลาหลายสัปดาห์ มีข่าวลือว่าการอภิปรายอย่างเผ็ดร้อนดังออกมาจากห้องลับของ [owner.GetTopLiege.GetCapitalLocation.GetBaronyNameExplicitlyNoTooltip] และในที่สุดก็มีการประกาศ: [owner.GetFirstName] จะได้รับการ แต่งตั้งเป็น [owner.GetTitleAsNameNoTooltip] ปกครองดินแดนอันกว้างใหญ่ของ [target_title.GetNameNoTier]"
 scheme_critical_moments.8024.liege: "\n\nไม่ว่าข้าราชการจะยินยอมด้วยเหตุผลทางการบริหารที่ชอบธรรม หรือเพียงแค่ยอมจำนนภายใต้แรงกดดัน ข้าจะไม่มีวันรู้ — มันอยู่นอกเหนือการควบคุมของข้า\n\nเราได้ แต่เชื่อว่าการเปลี่ยนแปลงนี้จะเป็นประโยชน์ต่อ [ROOT.Char.GetPrimaryTitle.GetNameNoTierPossessiveNoTooltip] ทั้งหมด และไม่ใช่เพียงแค่ [owner.GetTitledFirstNamePossessive]..."
 scheme_critical_moments.8024.vassalised: "\n\nไม่ว่าข้าราชการจะยินยอมด้วยเหตุผลทางการบริหารที่ชอบธรรม หรือเพียงแค่ยอมจำนนภายใต้แรงกดดัน ตอนนี้ข้าเป็นผู้ใต้บังคับบัญชาของ [owner.GetHerHis] แล้ว!"
 scheme_critical_moments.8024.other: "\n\nไม่ว่าข้าราชการจะยินยอมด้วยเหตุผลทางการบริหารที่ชอบธรรม หรือเพียงแค่ยอมจำนนภายใต้แรงกดดัน เราจะไม่มีวันรู้..."
 scheme_critical_moments.8024.fallback: "\n\nการเคลื่อนไหวนี้โดยตระกูล [ROOT.Char.GetHouse.GetBaseName] จะเปลี่ยนดุลอำนาจใน [owner.GetTopLiege.GetPrimaryTitle.GetTierAsNameNoTooltip] อย่างมาก..."
 scheme_critical_moments.8024.a: "น่าสนใจ..."
 found_despotate_vassalized_opinion: "ถูก ทำให้เป็นข้าในบังคับภายใต้เดสปอเตต"
