 scheme_critical_moments.8042.t: "[scheme.GetNameNoTooltip]: สำเร็จ"
 scheme_critical_moments.8042.desc: "[target.GetTitledFirstName] ผู้เป็น [owner.Custom2('RelationToMeShort', target)] ของข้า ดูเหมือนจะชื่นชมคำแนะนำของข้าเกี่ยวกับเรื่องการบริหารอย่างถี่ถ้วน\n\nแท้จริงแล้ว มันเกือบจะเป็นความสุขที่ได้ใช้เวลาหลายชั่วโมง พูดคุยเกี่ยวกับบัญชีแยกประเภทและรายละเอียดปลีกย่อยของระบบราชการ [target.GetPrimaryTitle.GetAdjective] กับ [target.GetHerHim]\n\nข้ากล้าพูดได้เลยว่าข้าได้เรียนรู้บางสิ่งบางอย่างด้วยตัวเองไปพร้อมกัน!"
 scheme_critical_moments.8042.a: "เรื่องนี้ลงเอยด้วยดี!"
 scheme_critical_moments.8043.t: "[scheme.GetNameNoTooltip]: ล้มเหลว"
 scheme_critical_moments.8043.desc: "แม้ว่า [target.GetTitledFirstName] ผู้เป็น [owner.Custom2('RelationToMeShort', target)] ของข้า จะเปิดรับข้อเสนอคำแนะนำของข้าในตอนแรก แต่ [target.GetSheHe] ก็ไม่ได้เข้าใจเลย\n\nหลายสัปดาห์ของการสนทนาอย่างใกล้ชิด การตรวจสอบบันทึกการบริหาร [target.GetPrimaryTitle.GetAdjective] และการให้คำแนะนำ แทบไม่ได้สร้างความประทับใจให้กับ [target.GetWomanMan] เลย\n\n[target.GetFirstNameNoTooltip] ไม่ว่าจะเพิกเฉย เข้าใจผิด หรือขัดแย้งกับภูมิปัญญาทุกส่วนที่มอบให้ [target.GetHerHim]..."
 scheme_critical_moments.8043.a: "เสียเวลาจริงๆ..."
 scheme_critical_moments.8043.tt.failed: "[scheme.GetOwner.GetShortUIName] พยายามโต้แย้งเขตแดนของท่าน แต่ล้มเหลว!"
 scheme_critical_moments.8044.t: "ได้รับการสอนการปกครอง"
 scheme_critical_moments.8044.desc: "เป็นเวลาหลายสัปดาห์ ข้าได้รับการมาเยือนที่ไม่คาดคิดและสาส์นอย่างต่อ เนื่องจาก [owner.GetTitledFirstName] ผู้เป็น [target.Custom2('RelationToMeShort', owner)] ของข้า [owner.GetSheHe|U] ได้ให้คำแนะนำที่ไม่พึงประสงค์อย่างต่อเนื่อง ทั้งหมดเกี่ยวกับการบริหารที่เหมาะสมของ [target.GetPrimaryTitle.GetTierAsNameNoTooltip]...\n\n"
 scheme_critical_moments.8044.success: "ความสงสัยในตอนแรกของข้าในไม่ช้าก็เปลี่ยนเป็นความประหลาดใจและความเคารพ คำพูดของ [owner.GetHerHis|U] เป็นบ่อเกิดแห่งปัญญาที่ข้าไม่เคยพิจารณามาก่อน ซึ่งส่วนใหญ่ได้รับการพิสูจน์แล้วในการบริหาร [target.GetPrimaryTitle.GetNameNoTier] ของข้า!"
 scheme_critical_moments.8044.failure: "ความสงสัยของข้าได้รับการพิสูจน์ในไม่ช้า เพราะน่าเสียดายที่มีปัญญาเพียงเล็กน้อยที่จะรวบรวมได้ท่ามกลางเกร็ดเล็กเกร็ดน้อยที่วกวนและมนต์คาถาที่สับสนของ [owner.GetHerHis] — แม้ว่าจะดูคมคายก็ตาม..."
 scheme_critical_moments.8044.a.success: "คำแนะนำที่ดีเป็นสิ่งที่หาได้ยากและน่ายินดี!"
 scheme_critical_moments.8044.a: "คำขอบคุณอย่างมีชั้นเชิงและเป็นครั้งสุดท้ายน่าจะ ทำให้ [owner.GetHerHim] เงียบลงได้"
 scheme_critical_moments.8045.opening: "[recipient.Custom2('AppropriateGreetingPositive', actor)]"
 scheme_critical_moments.8045.desc: "ข้าขอบคุณอย่างยิ่งสำหรับข้อเสนอของท่านที่จะให้คำแนะนำเกี่ยวกับการปกครอง [recipient.GetPrimaryTitle.GetNameNoTierPossessive]!"
 scheme_critical_moments.8045.fallback: "ข้าขอบคุณอย่างยิ่งสำหรับข้อเสนอของท่านที่จะให้คำแนะนำเกี่ยวกับความผันผวนของการปกครอง!"
 scheme_critical_moments.8045.rump: "\n\nข้าตั้งตารอที่จะได้ยินความคิดของท่านเป็นอย่างยิ่ง"
 scheme_critical_moments.8045.a: "ด้วยความยินดี"
 scheme_critical_moments.8046.opening: "[recipient.Custom2('AppropriateGreeting', actor)]"
 scheme_critical_moments.8046.desc: "ในขณะที่ข้ารู้สึกเป็นเกียรติกับข้อเสนอของท่านที่จะให้คำแนะนำเกี่ยวกับการปกครอง [recipient.GetPrimaryTitle.GetNameNoTierPossessive],"
 scheme_critical_moments.8046.fallback: "ในขณะที่ข้ารู้สึกเป็นเกียรติกับข้อเสนอของท่านที่จะให้คำแนะนำเกี่ยวกับความผันผวนของการปกครอง,"
 scheme_critical_moments.8046.rump: "ข้าคิดว่าข้ามีความเข้าใจในเรื่องนี้ดีพอแล้ว"
 scheme_critical_moments.8046.a: "หึ"
