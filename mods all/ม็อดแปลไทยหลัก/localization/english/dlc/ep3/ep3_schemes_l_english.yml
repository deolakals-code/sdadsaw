 #Found Despotate
 found_despotate: "ยกระดับเขตปกครองเจ้าเมือง"
 found_despotate_action: "ยกระดับเขตปกครองเจ้าเมืองเป็น"
 found_despotate_desc: "ทั้งหมดของ [SCHEME.GetTargetTitle.GetNamePossessive] ควรอยู่ภายใต้การบริหารเดียวกัน — การบริหาร #EMP ของข้า#!."
 found_despotate_desc_general: "$found_despotate$ เป็น [political_scheme|E] ที่มีเป้าหมายเพื่อสถาปนา [governorships|E] ระดับ [kingdom|E]-[rank|E] มันขึ้นอยู่กับ [diplomacy|E] และสถานะของ [house|E] และสามารถรับสมัคร [agents|E] ได้\n\n$found_despotate$ ที่ประสบความสำเร็จจะ ส่งผลให้เกิดการสร้าง [scheme_target|E] และการโอนย้าย [vassals|E] [de_jure|E] ของมัน"
 FOUND_DESPOTATE_SUCCESS_DESC: "[TARGET_TITLE.GetName] ถูกสร้างขึ้นและ [vassals|E] [de_jure|E] ของมันถูกโอนย้าย"
