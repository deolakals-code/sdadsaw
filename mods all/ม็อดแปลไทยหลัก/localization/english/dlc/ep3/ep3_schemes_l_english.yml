 prepare_fire_dromons_scheme: "เตรียมโดรมอนไฟกรีก"
 prepare_fire_dromons_scheme_desc: "ข้าพยายามที่จะติดอาวุธให้กับท่าเรือคอนสแตนติโนเปิลด้วยอาวุธลับสุดยอด: ไฟเหลว"
 prepare_fire_dromons_scheme_desc_general: "ต้องรวบรวมไฟเหลวจำนวนมาก กองเรือผู้พิทักษ์คอนสแตนติโนเปิลจำเป็นต้องติดอาวุธด้วยเครื่องสูบฉีด พร้อมด้วยวิศวกรผู้กล้าหาญ!"
 prepare_fire_dromons_scheme_SUCCESS_DESC: "ท่านจะใช้ [GetModifier('defensive_fire_dromons_modifier').GetNameWithTooltip] กับ [GetTitleByKey('c_byzantion').GetNameNoTier] เป็นเวลา #high 30 ปี#!."
