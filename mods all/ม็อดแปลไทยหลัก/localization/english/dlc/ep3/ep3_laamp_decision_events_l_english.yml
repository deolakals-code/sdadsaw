 #Actual sell screen
 ep3_laamp_decision_event.1021.t: "[visiting_location.GetBaronyNameExplicitlyNoTooltip]: เวลาจากลา"
 ep3_laamp_decision_event.1021.t_success: "[visiting_location.GetBaronyNameExplicitlyNoTooltip]: ของข้า!"
 ep3_laamp_decision_event.1021.t_failure: "[visiting_location.GetBaronyNameExplicitlyNoTooltip]: การตายของพ่อค้า/แม่ค้า [ROOT.Char.GetWomanMan]"
 ep3_laamp_decision_event.1021.desc_moment_of_purchase_01: "[laamp_artifact_peddler.GetFirstName] มองข้าพเจ้าอย่างคาดหวัง ดูเหมือนจะพอใจกับการตัดสินใจของข้าพเจ้า: "ท่านต้องการจะมอบสิ่งของชิ้นใด?""
 ep3_laamp_decision_event.1021.desc_moment_of_purchase_02: "[laamp_artifact_peddler.GetFirstName] พยักหน้าให้กำลังใจข้าพเจ้า: "ข้ามีเหรียญแล้ว ท่านจะขายสินค้าอะไร?""
 ep3_laamp_decision_event.1021.desc_success: "[laamp_artifact_peddler.GetFirstName] มองข้าพเจ้าด้วยสายตาครุ่นคิด: "...เป็น เช่นนั้นหรือ? ถ้าอย่างนั้น สำหรับสินค้าที่มีค่า เช่นนี้ บางทีข้าอาจจะหาเหรียญเพิ่มได้อีกสักเหรียญสองเหรียญ""
 ep3_laamp_decision_event.1021.desc_failure: "[laamp_artifact_peddler.GetFirstName] เยาะเย้ยและปากของ [laamp_artifact_peddler.GetHerHis] ก็บิดเบี้ยวเป็นรอยยิ้มดูถูก: "อย่าไร้สาระ ข้อเสนอของข้ายังคงเดิม""
 ep3_laamp_decision_event.1021.a: ""[1020_first_artifact_to_sell.GetNameNoTooltip] ไม่เคยทำประโยชน์อะไรให้ข้าเลย""
 ep3_laamp_decision_event.1021.b: ""ข้ามีประโยชน์กับทองคำมากกว่า เอา [1020_second_artifact_to_sell.GetNameNoTooltip] ไป""
 ep3_laamp_decision_event.1021.c: ""ท่านเอา [1020_third_artifact_to_sell.GetNameNoTooltip] ของข้าไปได้""
 ep3_laamp_decision_event.1021.d: "คิดดูอีกที..."
 ep3_laamp_decision_event.1021.eagle: "บางทีท่านอาจจะสนใจใน [ROOT.Char.Custom('EagleStoryName')] หรือไม่?"

#Town Crier
 ep3_laamp_decision_event.1025.t: "[visiting_location.GetBaronyNameExplicitlyNoTooltip]: [ROOT.Char.Custom('GetTowncrierElderCapitalized')|U]"
 ep3_laamp_decision_event.1025.desc_returned_01: "เมื่อเรากลับไปหาผู้ประกาศข่าวในเมือง แมว ซึ่งตอนนี้ขดตัวอยู่ กำลังหลับอยู่บนโต๊ะใกล้ๆ ไม่สนใจคำพูดพล่ามของผู้ประกาศข่าวเลย \n\n ข้าพเจ้าสังเกตเห็นหนวดของมันขยับเป็นบางครั้งขณะฝัน และข้าพเจ้าเดินเข้าไปใกล้เพื่อพิจารณารายการประกาศที่อ่านออกเสียง:"
 ep3_laamp_decision_event.1025.desc_returned_02: "ขณะที่ข้าพเจ้ากลับไปหาผู้ประกาศข่าวในเมือง แมวกำลังยืดตัวอยู่ใต้โต๊ะ เฝ้าดูข้าพเจ้าด้วยดวงตาสีฟ้าที่ปิดครึ่งหนึ่ง\n\nข้าพเจ้าตั้งใจฟังเสียงครางเบาๆ ของมัน แล้วก็เลิกสนใจทันทีเพื่อฟังรายการประกาศที่ผู้ประกาศข่าวประกาศ:"
 ep3_laamp_decision_event.1025.desc_reused_crier: "ผู้ประกาศข่าวในเมืองมองข้าพเจ้าอย่างจำได้และกระปรี้กระเปร่าขึ้นเมื่อข้าพเจ้าเข้าใกล้ พลางพูดไม่หยุดเกี่ยวกับสัญญาจ้างใกล้เคียงที่ขุนนางท้องถิ่นประกาศไว้\n\n[laamp_town_crier.GetSheHe|U] ยังคงอยู่กับแมวแก่สีขาวสลับน้ำตาลเทาที่เป็นมิตร ซึ่งมองข้าพเจ้าผ่านดวงตาสีฟ้าที่ปิดครึ่งหนึ่งขณะที่ข้าพเจ้าตั้งใจฟังรายการประกาศที่บรรยาย:"
 ep3_laamp_decision_event.1025.desc_tribal_returned_01: "เมื่อเรากลับไปหาผู้อาวุโส วัว ซึ่งเป็นสัตว์ที่สง่างาม กำลังเลียมือของ [laamp_town_crier.GetFirstNamePossessive] อย่างอ่อนโยนขณะที่ [laamp_town_crier.GetSheHe] ยังคงป้อนขนมให้มัน\n\nด้วยรอยยิ้มที่พอใจ [laamp_town_crier.GetSheHe] ยินดีที่จะย้ำถึงงานที่มีอยู่ ซึ่งจะช่วยประชากรท้องถิ่น:"
 ep3_laamp_decision_event.1025.desc_tribal_returned_02: "ขณะที่ข้าพเจ้ากลับไปหาผู้อาวุโส [ROOT.Char.GetWomanMan] ผู้ทรงภูมิที่ดูสำคัญคนหนึ่งเพิ่งออกจากสถานที่ไป\n\nข้าพเจ้าเหลือบมองพวกเขาอย่างสนใจ จากนั้นหันไปหาผู้อาวุโส [laamp_town_crier.GetFirstName] เพื่อเตือนตัวเองถึงงานที่มีอยู่ในปัจจุบัน:"
 ep3_laamp_decision_event.1025.desc_tribal_reused_crier: "ผู้อาวุโส ซึ่งข้าพเจ้าจำได้ว่าเป็น [laamp_town_crier.GetFirstName] ส่งยิ้มชื่นชมให้ข้าพเจ้าเมื่อข้าพเจ้ากลับไปยังที่ทำการของ [laamp_town_crier.GetHerHis]\n\nหลังจากพูดคุยเล็กน้อยอย่างเป็นมิตร [laamp_town_crier.GetSheHe] แจ้งให้ข้าพเจ้าทราบถึงเหตุการณ์ปัจจุบันและงานที่ต้องดูแล:"
 ep3_laamp_decision_event.1025.desc: "ผู้ประกาศข่าวในเมืองกระปรี้กระเปร่าขึ้นเมื่อข้าพเจ้าเข้าใกล้ พลางพูดไม่หยุดเกี่ยวกับสัญญาจ้างใกล้เคียงที่ขุนนางท้องถิ่นประกาศไว้\n\n[laamp_town_crier.GetSheHe|U] อยู่กับแมวแก่สีขาวสลับน้ำตาลเทาที่เป็นมิตร ซึ่งมองข้าพเจ้าด้วยดวงตาสีฟ้าที่ใสที่สุดขณะที่ข้าพเจ้าตั้งใจฟังรายการประกาศที่บรรยาย:"
 ep3_laamp_decision_event.1025.desc_tribal: "ผู้อาวุโส [laamp_town_crier.GetFirstName] มองข้าพเจ้าด้วยสายตาที่เป็นมิตรเมื่อข้าพเจ้าเข้าใกล้\n\nขณะดูแลเกวียนวัวอย่างรอบคอบ [laamp_town_crier.GetSheHe] แจ้งให้ข้าพเจ้าทราบถึงปัญหาท้องถิ่นและงานที่ต้องจัดการในบริเวณใกล้เคียง:"
 ep3_laamp_decision_event.1025.desc_legendary_returned_01: "กลับมาที่ผู้ประกาศข่าวในเมือง [laamp_town_crier.GetSheHe] ได้รวบรวมฝูงชนกลุ่มเล็กๆ ซึ่งส่งเสียงโอ้และอ้าอย่างเหมาะสมขณะที่ [laamp_town_crier.GetSheHe] เล่าถึงสถานการณ์อันน่าสะพรึงกลัวที่ขุนนางแดนไกลต้องการความช่วยเหลือในสถานการณ์ที่ยากลำบากของพวกเขา\n\nข้าพเจ้าเลิกคิ้วขณะนึกถึงสัญญาจ้างปกติที่กล่าวถึงก่อนหน้านี้:"
 ep3_laamp_decision_event.1025.desc_legendary_returned_02: "ขณะที่ข้าพเจ้ากลับไปหาผู้ประกาศข่าวในเมือง [laamp_town_crier.GetSheHe] กำลัง ทำให้ผู้คนที่เดินเตร่อยู่กลุ่มอื่นอิ่มเอมใจอีกครั้ง พ่นรายละเอียดที่เกินจริงมากขึ้นเรื่อยๆ เกี่ยวกับขุนนางแดนไกล\n\nข้าพเจ้าฮัมเพลงเงียบๆ ขณะครุ่นคิดถึงสัญญาจ้างที่กล่าวถึงก่อนหน้านี้:"
 ep3_laamp_decision_event.1025.desc_tribal_legendary_returned_01: "กลับมาที่ผู้อาวุโส ชนเผ่า [laamp_town_crier.GetWomanMan] จากก่อนหน้านี้กำลังซุบซิบเสียงดังกับชนเผ่าคนอื่นๆ เผยรายละเอียดที่ไม่น่าฟังทั้งหมดของขุนนางแดนไกลและสถานการณ์ที่ยากลำบากของพวกเขา\n\nผู้อาวุโส [laamp_town_crier.GetFirstName] มอง [laamp_town_crier.GetHerHim] อย่างไม่เห็นด้วยจากข้างสนาม ขณะที่ข้าพเจ้าเดินเข้าไปสอบถามผู้อาวุโสเกี่ยวกับงานท้องถิ่นที่ต้องดูแล:"
 ep3_laamp_decision_event.1025.desc_tribal_legendary_returned_02: "ขณะที่ข้าพเจ้ากลับไปหาผู้อาวุโส ดูเหมือน [laamp_town_crier.GetSheHe] ได้ตำหนิชนเผ่า [laamp_town_crier.GetWomanMan] คนอื่น ซึ่งตอนนี้กำลังหน้าบึ้ง นั่งอยู่บนเกวียนใกล้ๆ\n\nชนเผ่า [laamp_town_crier.GetWomanMan] กระปรี้กระเปร่าขึ้นขณะที่ [laamp_town_crier.GetSheHe] เริ่มสนทนากับ [laamp_town_crier.GetWomanMan] อีกคน ขณะที่ข้าพเจ้าเดินไปหาผู้อาวุโส [laamp_town_crier.GetFirstName] ซึ่งใจดีพอที่จะเตือนความจำข้าพเจ้าเกี่ยวกับงานที่มีอยู่ในปัจจุบัน:"
 ep3_laamp_decision_event.1025.desc_legendary_reused_crier: "ข้าพเจ้าจำผู้ประกาศข่าวในเมือง [laamp_town_crier.GetFirstName] ได้ ซึ่งกำลัง $ep3_laamp_decision_event.1025.desc_legendary_body$"
 ep3_laamp_decision_event.1025.desc_legendary: "ผู้ประกาศข่าวในเมือง [laamp_town_crier.GetFirstName] กำลัง $ep3_laamp_decision_event.1025.desc_legendary_body$"
 ep3_laamp_decision_event.1025.desc_legendary_body: "ซุบซิบกับชาว [visiting_location.GetCounty.GetCulture.GetNameNoTooltip] อีกคนขณะที่ข้าพเจ้าเดินไปยังที่ทำการของ [laamp_town_crier.GetHerHis] — พวกเขากระซิบกันว่าขุนนางแดนไกลบางคนมีสถานการณ์ที่ยากลำบากเป็นพิเศษและเสนอรางวัล #EMP อันงดงาม#! \n\nข้าพเจ้าครุ่นคิดเรื่องนี้ขณะที่ [laamp_town_crier.GetSheHe] นึกถึงหน้าที่ของ [laamp_town_crier.GetHerHis] ขึ้นมาทันใดและกระปรี้กระเปร่าขึ้น แจ้งให้คนรอบข้างทราบทันทีเกี่ยวกับสัญญาจ้างที่มีอยู่ในปัจจุบัน:"
 ep3_laamp_decision_event.1025.desc_tribal_legendary_reused_crier: "ขณะที่ข้าพเจ้าเข้าใกล้ ผู้อาวุโส [laamp_town_crier.GetFirstName] ซึ่งกำลังสนทนากับชนเผ่า [laamp_town_crier.GetWomanMan] อีกคน มองข้าพเจ้าอย่างจำได้ $ep3_laamp_decision_event.1025.desc_tribal_legendary_body$"
 ep3_laamp_decision_event.1025.desc_tribal_legendary: "ผู้อาวุโสของหมู่บ้านคนหนึ่ง [laamp_town_crier.GetFirstName] กำลังยุ่งอยู่กับการหารือเรื่องหนึ่งกับชนเผ่า [laamp_town_crier.GetWomanMan] อีกคนขณะที่ข้าพเจ้าเข้าใกล้ $ep3_laamp_decision_event.1025.desc_tribal_legendary_body$"
 ep3_laamp_decision_event.1025.desc_tribal_legendary_body: "\n\n[laamp_town_crier.GetWomanMan] อีกคนเริ่มแสดงท่าทางและข้าพเจ้าได้ยินบางอย่างเกี่ยวกับ #EMP ขุนนางแดนไกลต้องการความช่วยเหลืออย่างเร่งด่วนในเรื่องสำคัญ#! โดยสัญญาว่าจะให้ชื่อเสียงและทรัพย์สมบัติเป็นการตอบแทน\n\nพวกเขาสนทนากันเสร็จและข้าพเจ้าหันไปหา [laamp_town_crier.GetFirstNameNoTooltip] ซึ่งแจ้งให้ข้าพเจ้าทราบถึงงานท้องถิ่นที่ต้องดูแล:"
 ep3_laamp_decision_event.1025.desc_nothing: "[ROOT.Char.Custom('GetTowncrierElder')] นั่งฟุบอยู่บนเก้าอี้ของ [laamp_town_crier.GetHerHis] ครึ่งหลับครึ่งตื่น เห็นได้ชัดว่าไม่มีสัญญาจ้างว่างในพื้นที่ในขณะนี้"

 #The contract type bullets
 ep3_laamp_decision_event.1025.desc_treasure_map: "#EMP ต้องการนักผจญภัยเพื่อล่าสมบัติ!#!"
 ep3_laamp_decision_event.1025.desc_transport_contracts: "#EMP ต้องการนักเดินทางมืออาชีพสำหรับภารกิจคุ้มกัน!#!"
 ep3_laamp_decision_event.1025.desc_criminal_contracts: "#EMP ต้องการผู้เชี่ยวชาญที่สุขุมสำหรับโอกาสที่ร่ำรวย!#!"
 ep3_laamp_decision_event.1025.desc_justicar_contracts: "#EMP ต้องการผู้ส่งสารแห่งความชอบธรรมเพื่อช่วยรักษาความสงบเรียบร้อย!#!"
 ep3_laamp_decision_event.1025.desc_hireling_contracts: "#EMP ต้องการผู้มีกำลังสำหรับหน้าที่ทางทหาร!#!"
 ep3_laamp_decision_event.1025.desc_diplomacy_contracts: "#EMP ต้องการนักเจรจาที่มีวาทศิลป์สำหรับการติดต่อทางการทูต!#!"
 ep3_laamp_decision_event.1025.desc_hunting_contracts: "#EMP ต้องการนักล่าที่มีประสบการณ์สำหรับงานล่าสัตว์!#!"
 ep3_laamp_decision_event.1025.desc_stewardship_contracts: "#EMP ต้องการสจ๊วตที่ได้รับการยอมรับสำหรับงานด้านองค์กร!#!"
 ep3_laamp_decision_event.1025.desc_learning_contracts: "#EMP ต้องการผู้ดูแลที่มีความรู้สำหรับงานวิชาการ!#!"
 ep3_laamp_decision_event.1025.desc_intrigue_contracts: "#EMP ต้องการผู้ร่วมงานที่มีทักษะเพื่อจัดการเรื่องละเอียดอ่อน!#!"
