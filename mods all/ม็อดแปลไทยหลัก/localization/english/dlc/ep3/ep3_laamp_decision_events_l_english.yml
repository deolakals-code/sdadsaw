 ep3_laamp_decision_event.1010.a_intrigue.success: "ท่านขโมยเสบียงจำนวนหนึ่งได้สำเร็จ"
 ep3_laamp_decision_event.1010.a_intrigue.failure: "ท่านทำพลาดและ ทำให้ [laamp_supply_merchant.GetShortUINamePossessive] สงสัย"
