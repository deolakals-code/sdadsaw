 ep3_laamp_decision_event.1030.b: "ไปดูกันว่าใครพร้อมสำหรับการรับสมัครบ้าง"
 ep3_laamp_decision_event.1030.b_second: "บางทีเราควรจะรับสมัครใครสักคน หลังจากทั้งหมด"
 ep3_laamp_decision_event.1030.b.tt: "สอบถามกับ [THIS.Char.Custom('GetTaverngoersTribespeople')] ที่ว่างงาน"
 ep3_laamp_decision_event.1030.b.cooldown.tt: "ท่านรับสมัคร [follower|E] แล้วในการเยี่ยมชมครั้งนี้"

 ep3_laamp_decision_event.1030.c: "โอ้ พระเจ้า นั่น #EMP ใคร#!?"
 ep3_laamp_decision_event.1030.c_second: "ไปหา [laamp_spouse_material.GetFirstNameNoTooltip] #EMP เดี๋ยวนี้#!."
 ep3_laamp_decision_event.1030.c.tt: "เดินไปหา [laamp_spouse_material.Custom('RaunchyComplimentNoun')] ข้างเคาน์เตอร์"
 ep3_laamp_decision_event.1030.c.tt_second: "กลับไปสนทนากับ [laamp_spouse_material.GetShortUIName]"
 ep3_laamp_decision_event.1030.c.cooldown.tt: "ท่านเพิ่งรับสมัคร [spouse|E] ที่มีศักยภาพเป็น [follower|E] เมื่อเร็วๆ นี้ — กลับมาในวันที่ [GetCurrentDateWithDiff( GetVarTimeRemaining( THIS.Char.MakeScope, '1035_has_spoused_recently') )]"
