 #Page 2 (Second)
 ep3_laamp_decision_event.1001.desc_intro_return_finished: "ส่วนนี้ของ [ROOT.Char.Custom('GetMainsquareCommons')] กลับเย็นลงอย่างใดอย่างหนึ่ง และผู้คนได้กลับไปยังที่พักอาศัยของตนหรือย้ายไปยังสถานที่อื่นใน [ROOT.Char.Custom('SettlementCity')|l] แล้ว"
 ep3_laamp_decision_event.1001.desc_intro_returned_from_supplies: "ขณะที่เรากลับจากพ่อค้าเสบียง ลมยามบ่ายพัดผ่าน [ROOT.Char.Custom('GetMainsquareCommons')] ของ [visiting_location.GetTitle.GetNameNoTierPossessiveNoTooltip]"
 ep3_laamp_decision_event.1001.desc_intro_returned_from_assaulting_supplies: "ทหารยามจัดการข้าพเจ้าอย่าง [ROOT.Char.GetWomanMan] พอสมควร โชคดีที่ไม่ทำอะไรแตกหัก ขณะที่พวกเขาทิ้งข้าพเจ้ากลับไปที่ [ROOT.Char.Custom('GetMainsquareCommons')]"
 ep3_laamp_decision_event.1001.desc_intro_returned_from_artifacts: "ขณะที่เรากลับจากพ่อค้าเร่ขายวัตถุโบราณ ดูเหมือนคนอื่นๆ ก็กลับมาจากส่วนต่างๆ ของ [ROOT.Char.Custom('SettlementCity')|l] เช่นกัน และกระแสผู้มาเยือน [ROOT.Char.Custom('GetMainsquareCommons')] ก็สูงขึ้น"
 ep3_laamp_decision_event.1001.desc_intro_returned_from_contract: "เดินทอดน่องกลับจาก [ROOT.Char.Custom('GetTowncrierElder')] ข้าพเจ้าสังเกตท้องฟ้าเล็กน้อยก่อนจะพบว่าตัวเองกลับมาอยู่ที่ [ROOT.Char.Custom('GetMainsquareCommons')]"
 ep3_laamp_decision_event.1001.desc_intro_returned_generic_01: "กลับมาที่ส่วนนี้ของ [ROOT.Char.Custom('GetMainsquareCommons')] มีคนน้อยลงอย่างเห็นได้ชัด เด็กสองสามคนกำลังลูบลาตัวหนึ่ง ซึ่งกำลังเล็มหญ้าอย่างสงบครึ่งทางไปยังที่ทำการของ [ROOT.Char.Custom('GetTowncrierElder')]"
 ep3_laamp_decision_event.1001.desc_intro_returned_generic_02: "กลับมายังอีกครึ่งหนึ่งของ [ROOT.Char.Custom('GetMainsquareCommons')] สุนัขพันธุ์ผสมสองสามตัวกำลังวิ่งไปรอบๆ ต่อสู้กันเพื่อแย่งกระดูกสัตว์ชิ้นหนึ่ง — ซึ่งมีขนาดใหญ่พอสมควร"

 ep3_laamp_decision_event.1001.desc: "เคลื่อนตัวออกจากทางเข้า [ROOT.Char.Custom('SettlementCity')|l] ข้าพเจ้าเดินไปตามทางแคบๆ ผ่าน [ROOT.Char.Custom('GetCrookedhousesDelapidatedtents')] บางส่วนเข้าไปยังพื้นที่เปิดโล่งที่อยู่ติดกัน\n\nข้างหน้าข้าพเจ้าคือเส้นทางไปยังพ่อค้าเสบียงและพ่อค้าเร่ขายวัตถุโบราณ และไกลออกไปข้าพเจ้ายังเห็นสิ่งที่ดูเหมือน"
 ep3_laamp_decision_event.1001.desc_intro: "$ep3_laamp_decision_event.1001.desc$ ผู้ประกาศข่าวในเมืองอยู่ไกลๆ"
 ep3_laamp_decision_event.1001.desc_intro_nomads: "$ep3_laamp_decision_event.1001.desc$ ผู้อาวุโสของเผ่า กำลังเดินไปมาอยู่ไกลๆ"

