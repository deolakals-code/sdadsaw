l_english: 

 #Visit Local Settlement
 ep3_laamp_decision_event.return.tt: "ท่านกลับไปยัง [THIS.Char.Custom('GetMainsquareCommons')]"

 #Enter the Title of ProvinceName. What do you want to do?
 ep3_laamp_decision_event.1000.t: "[visiting_location.GetBaronyNameExplicitlyNoTooltip]: [ROOT.Char.Custom('GetMainsquareCommonsCapitalized')|U]"
 ep3_laamp_decision_event.1000.desc_intro_returned_home: "เมื่อยามเย็นใกล้เข้ามา ผู้อยู่อาศัยใน [visiting_location.GetBaronyNameExplicitlyNoTooltip] ได้ทยอยกลับเข้าบ้าน\n\nบรรดาเจ้าของร้านได้เก็บแผงลอยของตน และสถานที่น่าสนใจต่างๆ ได้ปิดประตูลงแล้ว"

 ep3_laamp_decision_event.1000.desc_intro_returned_from_second: "ข้าพเจ้ารีบเดินทางกลับจากอีกฟากหนึ่งของ [ROOT.Char.Custom('GetMainsquareCommons')] ผ่านพ่อค้าเร่คนหนึ่งพร้อมขวดแก้วเล็กๆ หลายสิบใบที่บรรจุของเหลวหลากสี"
 ep3_laamp_decision_event.1000.desc_intro_returned_from_tavern: "ข้าพเจ้าออกจาก [ROOT.Char.Custom('GetTavernDwelling')] และหรี่ตามองแสงสว่าง สูดอากาศบริสุทธิ์ภายนอก กลิ่นจากชาว [visiting_location.GetCounty.GetCulture.GetNameNoTooltip] ที่อยู่ใกล้เคียง ซึ่งกำลังขาย [visiting_location.GetTitle.GetHolder.Custom('GetLocalStreetFoodPlural')] ทำให้น้ำลายสอ"
 ep3_laamp_decision_event.1000.desc_intro_returned_from_church: "ระหว่างทางเดินกลับจากบริเวณ [visiting_location.GetCounty.GetFaith.HouseOfWorship] กลุ่ม [visiting_location.GetCounty.GetFaith.AltPriestTermPlural] เคลื่อนขบวนอย่างช้าๆ ไปตามจัตุรัส พลางฮัมเพลงอย่างสงบขณะเดินไป"
 ep3_laamp_decision_event.1000.desc_intro_returned_from_castle: "เมื่อกลับจากประตูค่าย ข้าพเจ้าสังเกตเห็นทหารชาว [visiting_location.GetCounty.GetCulture.GetCollectiveNounNoTooltip] ท่าทางซอมซ่อกลุ่มหนึ่งกำลังตรวจตราบริเวณโดยรอบ คอยจับตาดูผู้ที่ดูน่าสงสัยหรือแตกต่าง"
 ep3_laamp_decision_event.1000.desc_intro_returned_from_craftsmen: "หลังจากข้าพเจ้าไปเยี่ยมช่างฝีมือ คณะนักแสดงปาหี่กลุ่มเล็กๆ กำลังแสดงอยู่ที่จัตุรัสหลัก ดึงดูดผู้ชมได้พอสมควร"

 ep3_laamp_decision_event.1000.desc_intro_returned_generic_01: "ขบวนพ่อค้าต่างชาติที่ดูสนใจกำลังเดินผ่าน [ROOT.Char.Custom('GetMainsquareCommons')] ของ [visiting_location.GetTitle.GetNameNoTierNoTooltip] ระหว่างทางไปยัง [neighboring_county.GetTitle.GetNameNoTierNoTooltip]"
 ep3_laamp_decision_event.1000.desc_intro_returned_generic_02: "กลับมาที่ [ROOT.Char.Custom('GetMainsquareCommons')] [ROOT.Char.Custom('RegionalFerociousAnimal')] ที่ถูกเลี้ยงจนเชื่องตัวหนึ่งเดินโซเซเข้ามาทักทายผู้สัญจรไปมาอย่างกระตือรือร้น ก่อให้เกิดความโกลาหลเล็กน้อย"
 ep3_laamp_decision_event.1000.desc_intro_returned_generic_03: "เมื่อกลับมาถึง [ROOT.Char.Custom('GetMainsquareCommons')] เราได้รับการต้อนรับจากคนขายเนื้อท้องถิ่นที่กำลังเทของเสียของ [dummy_gender.GetHerHis] ออกไปด้านหลัง เพื่อเลี้ยงสุนัขเฝ้ายามของ [dummy_gender.GetHerHis]"
 ep3_laamp_decision_event.1000.desc_intro_returned_generic_04: "ระหว่างทางกลับไปยัง [ROOT.Char.Custom('GetMainsquareCommons')] ข้าพเจ้าหยุดชื่นชมผลงานของช่างทอพรมท้องถิ่น ซึ่งกำลังสร้างสรรค์งานศิลปะตามคำสั่งของ [visiting_location.GetCounty.GetTitle.GetHolder.GetTitledFirstNameNoTooltip]"

 ep3_laamp_decision_event.1000.desc_intro_returned_constantinople_01: "ณ จุดชมวิว ข้าพเจ้ามองออกไปทั่ว [visiting_location.GetTitle.GetNameNoTierNoTooltip] เพื่อพยายามทำความเข้าใจอัญมณีแห่ง [visiting_location.GetCounty.GetTitle.GetHolder.GetTopLiege.GetPrimaryTitle.GetNameNoTierNoTooltip] นี้\n\nวัฒนธรรมจากทั่วทุกสารทิศปรากฏอยู่ที่นี่ ท่ามกลางชาว [visiting_location.GetCulture.GetNameNoTooltip] นับเป็นแหล่งหลอมรวมประเพณีและขนบธรรมเนียมอย่างแท้จริง\n\nบริเวณฮิปโปโดรม ดูเหมือนการแข่งขันได้เริ่มขึ้นแล้ว ตัดสินจากเสียงโห่ร้องด้วยความยินดีและความตื่นเต้นที่แว่วมา แต่ไกล"

 ep3_laamp_decision_event.1000.desc_intro_constantinople: "ขณะที่เราเดินผ่านซุ้มประตูและแนวเสา เราเข้าสู่มหานคร [visiting_location.GetBaronyNameExplicitlyNoTooltip] ไม่น่าแปลกใจเลยว่าเหตุใดที่นี่จึงเป็นอัญมณีประดับมงกุฎของ [visiting_location.GetCounty.GetTitle.GetHolder.GetTopLiege.GetTitledFirstName] และข้าพเจ้ามองไปยังที่ไกลออกไป สู่ใจกลางเมือง"

 ep3_laamp_decision_event.1000.desc_intro_tribal_holding_01: "ชาว [visiting_location.GetCounty.GetCulture.GetNameNoTooltip|U] ท้องถิ่นมักรวมตัวกันใน [ROOT.Char.Custom('LocalHoldingType')|l] ของ [visiting_location.GetBaronyNameExplicitlyNoTooltip] เพื่อค้าขาย พูดคุยซุบซิบ และแบ่งปันเรื่องราว\n\nขณะที่ข้าพเจ้าเข้าสู่กลุ่ม [ROOT.Char.Custom('GetBuildingDwelling')] [ROOT.Char.Custom('RegionalFarmAnimal')] พลัดหลงตัวหนึ่งกำลังเคลื่อนตัวอย่างช้าๆ ข้ามเส้นทาง ณ ใจกลาง [ROOT.Char.Custom('SettlementCity')|l] และ [ROOT.Char.Custom('SmallAnimal')] ตัวเล็กๆ เคลื่อนตัวอย่างง่วงงุนผ่านพุ่มไม้ห่างไปทางขวาของข้าพเจ้าไม่กี่ก้าว"
 ep3_laamp_decision_event.1000.desc_intro_tribal_holding_02: "เราผ่านชนเผ่าหลายกลุ่มที่มีลักษณะท่าทางแข็งกร้าวกว่าระหว่างทางไปยังใจกลาง [visiting_location.GetTitle.GetNameNoTier]\n\nหอก กริช และธนู; แต่ก็มี [ROOT.Char.Custom('GetTribalTradegoods')] ความเชื่อพื้นเมือง — ทั้งหมดนี้ประกอบกันเป็น [visiting_location.GetHolding.GetType.GetName|l] ส่วนใหญ่ข้าพเจ้าได้รับการทักทายด้วยการพยักหน้าอย่างเป็นมิตร; และมีบ้างที่มองด้วยสายตาเคลือบแคลง"
 ep3_laamp_decision_event.1000.desc_intro_church_holding: "เมืองอันงดงาม เสียงสวดมนต์และบทเพลงสรรเสริญต่างๆ ปกคลุม [ROOT.Char.Custom('LocalHoldingType')|l] ของ [visiting_location.GetTitle.GetNameNoTier] ดุจผ้าห่มอันอบอุ่น และไม่ต้องสงสัยเลยถึงความเกี่ยวข้องทางศาสนาของมัน\n\nเมื่อผ่านประตูหลัก ข้าพเจ้าเห็นเครื่องประดับแบบ [visiting_location.GetCounty.GetFaith.GetAdjectiveNoTooltip] มากมาย ประดับอยู่ตามกำแพง เช่นเดียวกับบนเสาอิงและนั่งร้าน"
 ep3_laamp_decision_event.1000.desc_intro_castle_holding: "มีสถานที่ไม่กี่แห่งที่สง่างามเท่า [visiting_location.GetHolding.GetType.GetName|l] และ [visiting_location.GetTitle.GetNameNoTier] ก็ไม่ใช่ข้อยกเว้น ทหารและธงของชาว [visiting_location.GetCounty.GetCulture.GetCollectiveNounNoTooltip|U] ปรากฏให้เห็นอยู่ทุกหนแห่งในเมือง\n\nขณะที่เราผ่านประตูหลัก ข้าพเจ้าเห็นทหารยามสองสามคนแอบมองออกมาจากช่องเชิงเทินด้านบน"
 ep3_laamp_decision_event.1000.desc_intro_city_holding: "ชุมทางการค้าที่สำคัญของชาว [visiting_location.GetCounty.GetCulture.GetCollectiveNounNoTooltip] ความมั่งคั่งที่เกิดขึ้นในตลาดของ [visiting_location.GetTitle.GetNameNoTier] ซึมซาบไปทั่วทุกมุมเมือง\n\nขณะที่เราเข้าทางประตูเมือง เสียงตะโกนและภาพโฆษณาพ่อค้าท้องถิ่นมีอยู่ทุกหนแห่ง"

 #Northern Europe
 ep3_laamp_decision_event.1000.desc_outro_regional_scandinavia_summer_returned_01: "\n\nดวงอาทิตย์ ซึ่งแทบไม่เคยตกดินเลยในช่วงเวลานี้ของปี ยังคงส่องสว่างอยู่ และสิ่งเดียวที่แข่งขันกับความสว่างของมันได้คือความซีดขาวของผู้คนใน [ROOT.Char.Custom('SettlementCity')|l]"
 ep3_laamp_decision_event.1000.desc_outro_regional_scandinavia_summer_returned_02: "\n\nฝนตกปรอยๆ ที่ไม่คาดคิดและอบอุ่นได้พัดเข้ามาเหนือ [ROOT.Char.Custom('SettlementCity')|l] [ROOT.Char.Custom('GetSquareCommons')] และโปรยปรายลงมาใส่ทั้งผู้คนและปศุสัตว์"
 ep3_laamp_decision_event.1000.desc_outro_regional_scandinavia_winter_returned_01: "\n\nหิมะ สะท้อนแสงอาทิตย์ ปกคลุมหนาหนักบนหลังคาและ [ROOT.Char.Custom('GetTreesScaffolding')|l]; แสงจ้าที่ส่องประกายของมันแข่งขันได้เพียงกับความซีดขาวของผู้อยู่อาศัยแก้มแดงของ [visiting_location.GetTitle.GetNameNoTierPossessiveNoTooltip]"
 ep3_laamp_decision_event.1000.desc_outro_regional_scandinavia_winter_returned_02: "\n\nแม้จะมีอุณหภูมิเยือกแข็ง แต่ก็ไม่มีลม [ROOT.Char.Custom('SettlementCity')|l] มีความเย็นยะเยือกอย่างน่าประหลาด ขณะที่สิ่งมีชีวิตทั้งหมดใน [ROOT.Char.Custom('GetSquareCommons')] หายใจออกมาเป็นไอสีขาวควัน"
 ep3_laamp_decision_event.1000.desc_outro_regional_scandinavia_winter_returned_03: "\n\nอีกไม่นานก็จะมืดอีกครั้ง ชาว [visiting_location.GetCounty.GetCulture.GetCollectiveNounNoTooltip|U] รีบเร่งไปมาในแสงสลัวของกลางวัน พยายามทำงานทุกอย่างที่จะทำไม่ได้หลังพระอาทิตย์ตกดิน"
 #Britannia
 ep3_laamp_decision_event.1000.desc_outro_regional_britannia_returned_01: "\n\nเบื้องบน เมฆเปิดออกชั่วขณะ ปล่อยให้แสงแดดสาดส่องลงมาเต้นระบำบนหลังคาและผู้อยู่อาศัยใน [ROOT.Char.Custom('GetSquareCommons')]"
 ep3_laamp_decision_event.1000.desc_outro_regional_britannia_returned_02: "\n\nฝนที่น่าหดหู่ยังคงเทลงมาไม่หยุด ก่อตัวเป็นแอ่งน้ำอย่างช้าๆ บนพื้นดินที่ไม่เรียบ [ROOT.Char.Custom('RegionalFarmAnimal')] ที่อยู่นิ่งตัวหนึ่งคร่ำครวญอย่างน่าสังเวชที่ถูกทิ้งไว้กลางสายฝน"
 ep3_laamp_decision_event.1000.desc_outro_regional_britannia_returned_03: "\n\nหมอกชื้นปกคลุม [ROOT.Char.Custom('GetSquareCommons')] อย่างหนาแน่น และใครก็ตามที่ออกไปข้างนอกจะพบว่าเสื้อผ้าของตนเปียกชื้นทันทีในสายฝนที่ตกอยู่ตลอดเวลา"
 #Europe
 ep3_laamp_decision_event.1000.desc_outro_regional_europe_returned_01: "\n\nฝนตกปรอยๆ เริ่มโปรยปรายลงมา ช่วยเพิ่มความเขียวขจีและกระตุ้นกลิ่นดินอ่อนๆ ให้ความรู้สึกสงบก่อนพายุจะมาถึง"
 ep3_laamp_decision_event.1000.desc_outro_regional_europe_returned_02: "\n\nลมหนาวพัดมาจากทะเลสาบใกล้เคียง ทำให้ปศุสัตว์ส่งเสียงร้องด้วยความประหลาดใจ และเจ้าของร้านดึงเสื้อคลุมให้แน่นขึ้นรอบไหล่"
 ep3_laamp_decision_event.1000.desc_outro_regional_europe_returned_03: "\n\nทางซ้ายมือของข้าพเจ้า ชาวบ้านท้องถิ่นกำลังกลับมาจากการเข้าร่วมพิธีในโบสถ์หินใกล้เคียง นักบวชที่ยืนอยู่ตรงทางเข้าส่งยิ้มที่อ่านไม่ออกให้ข้าพเจ้าขณะเดินผ่านไป"
 #Iberia
 ep3_laamp_decision_event.1000.desc_outro_regional_iberia_returned_01: "\n\nณ ที่ไกลออกไป แสงจากน้ำพุประดับตก แต่งส่องสะท้อนเป็นเงาสวรรค์บนซุ้มประตูเกือกม้าใกล้เคียง"
 ep3_laamp_decision_event.1000.desc_outro_regional_iberia_returned_02: "\n\nทางซ้ายมือของข้าพเจ้า [dummy_gender.GetWomanMan] ชราคนหนึ่งกำลังค่อยๆ บูรณะภาพโมเสกท้องถิ่นด้วยชิ้นส่วนใหม่จำนวนหนึ่ง — ส่วนใหญ่ — เพื่อให้ได้ผลลัพธ์ที่เหนือกว่า"
 ep3_laamp_decision_event.1000.desc_outro_regional_iberia_returned_03: "\n\nเบื้องบน สัญลักษณ์ทางศาสนามองลงมายังความวุ่นวายของถนนที่พลุกพล่านด้วยสายตาครุ่นคิด"
 #Middle East
 ep3_laamp_decision_event.1000.desc_outro_regional_middle_east_returned_01: "\n\nยังคงร้อนอยู่ ผู้คนขยับตำแหน่งเล็กน้อยและย้ายเข้าไปในที่ร่มที่มีอยู่ นกแร้งที่ดูเป็นลางร้ายตัวหนึ่งกำลังบินวนอยู่ที่ขอบ [ROOT.Char.Custom('SettlementCity')|l]"
 ep3_laamp_decision_event.1000.desc_outro_regional_middle_east_returned_02: "\n\nขณะที่แมงป่องตัวหนึ่งวิ่งผ่านไป กระแสลมกำลังสร้างลมหมุนของทราย ซึ่งส่องแสงเรืองรองราวกับอยู่เหนือโลกในแสงแดดทะเลทราย"
 ep3_laamp_decision_event.1000.desc_outro_regional_middle_east_returned_03: "\n\nทางขวามือของข้าพเจ้าคือซากปรักหักพังของมัสยิดเก่า ซึ่งวัสดุต่างๆ กำลังถูกนำกลับมาใช้ใหม่โดยชาว [visiting_location.GetCounty.GetCulture.GetCollectiveNounNoTooltip|U] ท้องถิ่น"
 #India
 ep3_laamp_decision_event.1000.desc_outro_regional_india_returned_01: "\n\nเบื้องบน ฝูงลิงแสมกำลังอาละวาดอยู่บนต้นไม้ ดูเหมือนจะอารมณ์เสียเรื่องอะไรบางอย่าง"
 ep3_laamp_decision_event.1000.desc_outro_regional_india_returned_02: "\n\nเป็นที่ขบขันของสาธารณชน ฝูงนกแก้วสวยงามที่ส่งเสียงร้องไม่หยุดได้เข้ายึดหลังคาของอาคารใกล้เคียง เตือนให้เราระลึกว่าเราอยู่ใกล้ชิดธรรมชาติเพียงใด"
 ep3_laamp_decision_event.1000.desc_outro_regional_india_returned_03: "\n\nณ ที่ไกลออกไป สิ่งทอสีสันสดใสจำนวนมากที่ตากไว้ให้แห้ง เป็นฉากหลังที่สวยงามให้กับ [ROOT.Char.Custom('LocalHoldingType')|l]"
 ep3_laamp_decision_event.1000.desc_outro_regional_india_returned_04: "\n\nบนถนน เด็กๆ กำลังเล่นอยู่ในแอ่งน้ำที่หลงเหลือจากฝนตกหนักเมื่อเช้านี้"
 ep3_laamp_decision_event.1000.desc_outro_regional_india_returned_05: "\n\nทางซ้ายมือของข้าพเจ้า ควาญช้างคนหนึ่งกำลังฝึกช้างตัวใหม่ ดึงดูดฝูงชนกลุ่มเล็กๆ ให้มามุงดูการแสดง"
 #Steppe
 ep3_laamp_decision_event.1000.desc_outro_regional_steppe_returned_01: "\n\nณ ที่ไกลออกไป ฝูงวัวและม้าที่สงบสุขกำลังเดินเตร่อยู่ในทุ่งนา เพื่อสนองความหิวโหยในทันที"
 ep3_laamp_decision_event.1000.desc_outro_regional_steppe_returned_02: "\n\nไกลออกไปข้างหน้า ลูกม้าตัวหนึ่งถูกนำมาใกล้ๆ แม่ม้าที่อยู่นิ่ง ขณะที่ชนเผ่ากำลังเตรียมขั้นตอนการรีดนม"
 ep3_laamp_decision_event.1000.desc_outro_regional_steppe_returned_03: "\n\nทางซ้ายมือของข้าพเจ้า ชนเผ่าสองสามคนกำลังซ่อมแซมกระโจมที่เสียหาย โดยทาชอล์กบนผ้าใบใหม่อย่างพิถีพิถัน"
 #North Africa
 ep3_laamp_decision_event.1000.desc_outro_regional_north_africa_returned_01: "\n\nสายลมขี้เล่นพัดผ่านบ้านดินทรงกลมอย่างรวดเร็ว ช่วยบรรเทาความร้อนระอุ"
 ep3_laamp_decision_event.1000.desc_outro_regional_north_africa_returned_02: "\n\n[dummy_gender.GetWomenMen] สองสามคนที่สดชื่นขึ้นเดินออกจากโรงอาบน้ำแห่งหนึ่ง และข้าพเจ้าจ้องมองทางเข้าอย่างโหยหา ทันใดนั้นก็ปรารถนาที่จะอาบน้ำผ่อนคลาย"
 ep3_laamp_decision_event.1000.desc_outro_regional_north_africa_returned_03: "\n\nลาตัวหนึ่งร้องเสียงดังอย่างไม่มีความสุข ดูเหมือนจะติดอยู่ในถนนแคบๆ ที่ปูด้วยหินกรวด ซึ่งกั้นระหว่างบ้านแถว"
 #West Africa
 ep3_laamp_decision_event.1000.desc_outro_regional_west_africa_returned_01: "\n\nพ่อค้าสองสามคนเดินเตร่อยู่ทางตะวันออกของ [ROOT.Char.Custom('GetSquareCommons')] ซึ่งหนึ่งในนั้นโดดเด่นในฐานะผู้ที่ร่ำรวยที่สุด กำลังเพลิดเพลินกับเบี้ยหอย"
 ep3_laamp_decision_event.1000.desc_outro_regional_west_africa_returned_02: "\n\nสายตาของข้าพเจ้าจับจ้องไปที่สีสันสดใสของพืชผลท้องถิ่นที่นำเสนออยู่บนเสื่อหนา — แตงโม น้ำเต้า แตงกวา ส้ม เป็นภาพที่น่าชื่นชมยินดี"
 ep3_laamp_decision_event.1000.desc_outro_regional_west_africa_returned_03: "\n\nดวงอาทิตย์สะท้อนในตุ้มน้ำหนักทองเหลืองประดับที่ผู้ซื้อผู้พึงพอใจกำลังเก็บไป พลางจ่ายค่าตอบแทน [dummy_gender.GetHerHis] เป็นผงทองคำ"
 ep3_laamp_decision_event.1000.desc_outro_regional_west_africa_returned_04: "\n\nช่างก่อสร้างสองสามคนกำลังสร้างชั้นสองบนบ้านแถวที่หรูหราหลังหนึ่ง โดยทำงานอย่างไม่เร่งรีบท่ามกลางความร้อน"
 #East Africa
 ep3_laamp_decision_event.1000.desc_outro_regional_east_africa_returned_01: "\n\nจิ้งจกตัวเล็กๆ เลื้อยขึ้นไปบนก้อนปะการังของบ้านแคบๆ หลังหนึ่ง และหาทางขึ้นไปบนหลังคาเรียบ ที่ ซึ่งมันนอนอาบแดด"
 ep3_laamp_decision_event.1000.desc_outro_regional_east_africa_returned_02: "\n\nอิฐเผาของกำแพงสูงระดับเข่าอาบแดดร้อนระอุ แผ่ความร้อนไปยังสิ่งใดก็ตาม — หรือใครก็ตาม — ที่กล้าปีนขึ้นไปบนนั้น"
 ep3_laamp_decision_event.1000.desc_outro_regional_east_africa_returned_03: "\n\nข้าพเจ้าเห็นเปลือกหอยเล็กๆ ติดอยู่ตลอดกาลในกำแพงหินปูนของที่อยู่อาศัยใกล้เคียงหลังหนึ่ง"
 ep3_laamp_decision_event.1000.desc_outro_regional_east_africa_returned_04: "\n\nทางซ้ายมือของข้าพเจ้า พ่อค้าคนหนึ่งกำลังปรับหลังคาใบไม้ของแผงลอยตลาดของ [dummy_gender.GetHerHis] เพื่อให้ร่มเงาแก่ถั่วโคล่าของ [dummy_gender.GetHerHis]"
 #Generic
 ep3_laamp_decision_event.1000.desc_outro_returned_generic_01: "\n\nเสียงอึกทึกและการต่อรองราคาเสียงดังที่แผงขายเสบียงใกล้เคียงดังสะท้อนมาถึงที่นี่ ทำให้ [ROOT.Char.Custom('GetMainsquareCommons')] รู้สึกวุ่นวาย"
 ep3_laamp_decision_event.1000.desc_outro_returned_generic_02: "\n\nพ่อค้าทาสที่ดูน่ากลัวกำลังทำการค้าที่น่าสงสัยของ [dummy_gender.GetHerHis] อยู่ไกลออกไปเล็กน้อยตาม [ROOT.Char.Custom('GetSquareCommons')] สร้างความขุ่นเคืองให้กับผู้เห็นเหตุการณ์บางคน"
 ep3_laamp_decision_event.1000.desc_outro_returned_generic_03: "\n\nอากาศอบอุ่น แม้จะไม่ใช่ความร้อนสูงสุดตามปกติของภูมิภาคนี้ คนงานและขุนนางดำเนินชีวิตประจำวัน เพลิดเพลินกับอุณหภูมิที่ผ่อนคลาย"
 ep3_laamp_decision_event.1000.desc_outro_returned_generic_04: "\n\nฝูง [ROOT.Char.Custom('RegionalFarmAnimalPlural')] ขวางเส้นทางของพ่อค้าเร่อย่างมีประสิทธิภาพ ก่อให้เกิดความปวดร้าวและการตะโกนอย่างมาก"
 ep3_laamp_decision_event.1000.desc_outro_returned_generic_05: "\n\nทางซ้ายมือของข้าพเจ้า [ROOT.Char.Custom('SoundingRegionalFarmAnimal')] ตัวหนึ่งกำลังบ่นเกี่ยวกับการตรวจสอบอย่างละเอียดจากผู้ซื้อที่มีศักยภาพ พ่อค้า/แม่ค้า [dummy_gender.GetWomanMan] ลูบหัวมันเบาๆ อย่างปลอบโยน"
 ep3_laamp_decision_event.1000.desc_outro_returned_generic_06: "\n\nทางขวามือของข้าพเจ้า แปลงดอกไม้เล็กๆ ของ [ROOT.Char.Custom('get_region_flower_type_plural')] สีสันสดใสตั้งอยู่ มอบกลุ่มสีสันที่สวยงามให้กับ [ROOT.Char.Custom('GetSquareCommons')]"
 ep3_laamp_decision_event.1000.desc_outro_returned_generic_07: "\n\n[ROOT.Char.Custom('GetRandomRegionalBird')] ตัวหนึ่งเกาะอยู่บนยอดต้นไม้ [ROOT.Char.GetCurrentLocation.Custom('GetRandomAppropriateTree')] ใกล้เคียง; มองลงมายังชาว [visiting_location.GetCounty.GetCulture.GetCollectiveNounNoTooltip] ที่วิ่งวุ่นด้วยดวงตาที่ฉลาด"
 #Partner
 ep3_laamp_decision_event.1000.desc_outro_returned_partner_generic_01: "\n\n[visiting_partner.GetFirstName] สะกิดข้าพเจ้าเบาๆ และชี้ขึ้นไปที่ [visiting_location.Custom('GetRandomRegionalWood')] ใกล้เคียง — บนกิ่งที่สูงที่สุด [ROOT.Char.Custom('GetRandomRegionalBird')] ที่แข็งแรงตัวหนึ่งเกาะอยู่ กำลังอาบแดดยามบ่าย"
 ep3_laamp_decision_event.1000.desc_outro_returned_partner_generic_02: "\n\n[visiting_partner.GetFirstName] ส่งเสียงร้องอย่างชื่นชมและชี้ไปที่ [ROOT.Char.Custom('get_region_dog_type')] ที่ไม่ได้ผูกเชือก ซึ่งกำลังเต้นไปรอบๆ ในเกมคาบของกับเจ้านายของมัน"
 ep3_laamp_decision_event.1000.desc_outro_returned_partner_generic_03: "\n\n[visiting_partner.GetFirstName] ดิ้นอย่างซุกซนขณะที่ [visiting_partner.GetSheHe] โยนหนอนที่ขุดขึ้นมาใส่ข้าพเจ้า ข้าพเจ้าตกใจกับหนอนพอๆ กัน ก้าวถอยหลังและมอง [visiting_partner.GetHerHim] อย่างขี้เล่น แต่จริงจัง"
 ep3_laamp_decision_event.1000.desc_outro_returned_partner_generic_04: "\n\n[visiting_partner.GetFirstName] ฮัมเพลงอย่างชื่นชมขณะที่ [visiting_partner.GetSheHe] ตรวจสอบแผงลอยที่เต็มไปด้วยงานแกะสลัก [visiting_location.Custom('GetRandomRegionalWood')] ทางศาสนาอย่างพิถีพิถัน"
 ep3_laamp_decision_event.1000.desc_outro_returned_partner_generic_05: "\n\n[visiting_partner.GetFirstName] หายไปจากสายตา แต่ไม่นานก็กลับมา เสนอให้ข้าพเจ้าชิม [ROOT.Char.Custom('GetLocalStreetFood')] ที่ [visiting_partner.GetHerHis] เพิ่งซื้อมาสดๆ ร้อนๆ"
 #Unique Location
 ep3_laamp_decision_event.1000.desc_outro_revisit_constantinople: "\n\nเคยมาที่นี่แล้ว ข้าพเจ้ายังคงรู้สึกตัวเล็กนิดเดียวเมื่อสังเกตเห็นฮาเกียโซเฟียและฮิปโปโดรมอยู่ไกลลิบ"
 ep3_laamp_decision_event.1000.desc_outro_constantinople: "\n\nฮาเกียโซเฟียและฮิปโปโดรมปรากฏให้เห็นอยู่ไกลลิบ ข้าพเจ้าเริ่มรู้สึกตัวเล็กนิดเดียว ด้วยความยำเกรงต่ออนุสาวรีย์เหล่านี้"
 #Home
 ep3_laamp_decision_event.1000.desc_outro_home: "\n\nวันอันยาวนานของการทำธุระกำลังตามทันข้าพเจ้าในที่สุด และข้าพเจ้าพบว่าตนเองโหยหาเตียงนอน"
 ep3_laamp_decision_event.1000.desc_outro_partner_home: "\n\n[visiting_partner.GetFirstName] ยืดแขนขาของ [visiting_partner.GetHerHis] และถอนหายใจอย่างพอใจ: "ข้าไม่รังเกียจที่จะทานอาหารอุ่นๆ ที่ค่ายตอนนี้" [visiting_partner.GetSheHe] พูดอย่างโหยหา"
 #First time
 ep3_laamp_decision_event.1000.desc_outro_partner_01: "\n\n[visiting_partner.GetFirstName] [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('visiting_partner'))] ของข้าพเจ้า มองไปรอบๆ ด้วยใบหน้าที่พอใจ ดูเหมือนจะเพลิดเพลินกับการเปลี่ยนบรรยากาศ"
 ep3_laamp_decision_event.1000.desc_outro_revisit: "\n\nข้าพเจ้าชื่นชมความโล่งใจเล็กน้อยที่ไม่มีอะไรเปลี่ยนแปลงไปมากนักตั้งแต่ข้าพเจ้ามาเยือนสถานที่แห่งนี้ครั้งล่าสุด"
 ep3_laamp_decision_event.1000.desc_outro_new: "\n\nซึมซับภาพและกลิ่นของสถานที่แห่งนี้ ข้าพเจ้าหาทิศทางในสถานที่ใหม่นี้ได้อย่างรวดเร็ว"
 
