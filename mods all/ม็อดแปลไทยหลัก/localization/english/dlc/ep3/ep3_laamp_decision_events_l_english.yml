 #Training
 ep3_laamp_decision_event.1051.return.tt: "ท่านกลับไปยังบริเวณ[visiting_location.GetHolding.GetType.GetName|l]"
 ep3_laamp_decision_event.1051.t: "[visiting_location.GetBaronyNameExplicitlyNoTooltip]: ลานฝึก"
 ep3_laamp_decision_event.1051.desc_returned_01: "กลับมาที่ลานฝึก จอมทัพ [laamp_disgruntled_moa.GetFirstName] เดินไปมา จัดเรียงอุปกรณ์และพึมพำกับ [laamp_disgruntled_moa.GetHerselfHimself] เบาๆ เกี่ยวกับสภาพการณ์\n\nระวังไม่ให้ดู #EMP ไม่พอใจ#! มากเกินไป [laamp_disgruntled_moa.GetSheHe] เหลือบมองข้าอย่างไม่พอใจขณะที่ข้าเดินเข้าไปหา [laamp_disgruntled_moa.GetHerHim] อีกครั้ง"
 ep3_laamp_decision_event.1051.desc_returned_02: "ที่ลานฝึก จอมทัพ [laamp_disgruntled_moa.GetFirstName] ยืนตรงขณะที่อุปกรณ์ฝึกซ้อมกำลังถูกตรวจสอบโดยนายทหารระดับสูง \n\nเมื่อนายทหารระดับสูงจากไปที่[visiting_location.GetHolding.GetType.GetName|l] แล้ว [laamp_disgruntled_moa.GetFirstNameNoTooltip] ซึ่งตอนนี้ไม่ได้ยืนตรง ดูเหมือนจะหดตัวลงหลายนิ้วเมื่อกลับมาอยู่ในท่าทางหลังค่อม [laamp_disgruntled_moa.GetSheHe|U] เหลือบมองข้าอย่างเหี่ยวแห้ง"
 ep3_laamp_decision_event.1051.desc: ""...และข้าบอกเจ้าเลยว่า สิ่งต่างๆ แย่ลงแถวนี้มา #EMP นานแล้ว#!," จอมทัพท้องถิ่น [laamp_disgruntled_moa.GetFirstName] พ่นลมหายใจ แล้วพูดต่อ: "การถูกจับตามองอย่างไม่หยุดหย่อน การตั้งคำถามกับ..." [laamp_disgruntled_moa.GetSheHe] เงียบไปขณะที่ข้าเข้าใกล้สนามยิง\n\nข้าตรวจสอบอุปกรณ์และสิ่งกีดขวางการฝึกซ้อมมากมายโดยสัญชาตญาณ พยายามอย่างเต็มที่ที่จะไม่สนใจสายตาที่ท้าทายของ [laamp_disgruntled_moa.GetFirstNamePossessiveNoTooltip]"
 ep3_laamp_decision_event.1051.desc_outro_martial_partner: "\n\nทางขวาของข้า [visiting_partner.GetFirstName] หยิบดาบฝึกซ้อมเล่มหนึ่งขึ้นมาและเริ่มกวัดแกว่งด้วยมือที่ชำนาญ มองมาที่ข้าอย่างคาดหวัง"
 ep3_laamp_decision_event.1051.desc_outro_return_martial_partner: "\n\nและข้างชั้นวางดาบทื่อ [visiting_partner.GetFirstName] ยืนกอดอก [visiting_partner.GetSheHe|U] มองไปที่อาวุธ แล้วกลับมามองข้า และยิ้มอย่างมีเลศนัย"
 ep3_laamp_decision_event.1051.a: "มาฝึกซ้อมกันเถอะ!"
 ep3_laamp_decision_event.1051.a_athletic.desc: "การประลองของท่านมีประสิทธิภาพมาก"
 ep3_laamp_decision_event.1051.a.desc: "ท่านทำการประลอง"
 ep3_laamp_decision_event.1051.b: ""ท่านควรมาเข้าร่วมค่ายของเรา มีอิสระมากมาย""
 ep3_laamp_decision_event.1051.c: ""เข้ามาเลย [visiting_partner.GetFirstNameNoTooltip]!""
 ep3_laamp_decision_event.1051.c_joshing.t: "หยอกล้อเล่น"
 ep3_laamp_decision_event.1051.c_joshing.desc: "การประลองไม่มีประสิทธิภาพ"
 ep3_laamp_decision_event.1051.c_wounded.t: "$playdate_training_injury_log_title$"
 ep3_laamp_decision_event.1051.c_wounded.desc: "$martial_authority.8000_injury$"
 ep3_laamp_decision_event.1051.d: "$ep3_laamp_decision_event.1021.d$"

 #Garrison
 ep3_laamp_decision_event.1053.t: "[visiting_location.GetBaronyNameExplicitlyNoTooltip]: กองรักษาการณ์"
 ep3_laamp_decision_event.1053.desc_returned_01: "ขณะที่ข้ากลับไปที่กองรักษาการณ์ [laamp_plain_guard.GetFirstName] กำลังประคบริมฝีปากที่บวมของ [laamp_plain_guard.GetHerHis] อย่างอ่อนโยน\n\nข้างโต๊ะชั่วคราวที่ทำจากถัง เกมไพ่กำลังจะจบลงและ [laamp_talented_guard.GetFirstName] คำรามรับรู้ถึงรายได้ของ [laamp_talented_guard.GetHerHis]\n\nทั้งคู่ประเมินข้าขณะที่ข้าเข้าใกล้กลุ่มทหารยาม"
 ep3_laamp_decision_event.1053.desc_returned_02: "กลับมาที่กองทหารรักษาการณ์ในร่มเงา [laamp_plain_guard.GetFirstName] กำลังงีบหลับสั้นๆ ขณะที่ [laamp_talented_guard.GetFirstName] กำลังนับเหรียญ [laamp_talented_guard.GetHerHis] ของตน เมื่อทหารยามอาวุโสสังเกตเห็นข้า [laamp_talented_guard.GetSheHe] ก็สะกิด [laamp_plain_guard.GetFirstNameNoTooltip]\n\nทหารยามที่ประสบการณ์น้อยกว่าสะดุ้งตื่นและลุกขึ้นนั่ง พยายามขยี้ตา [laamp_plain_guard.GetHerHis] เพื่อไล่ความง่วง\n\nทั้งคู่มองมาที่ข้าอย่างสงสัย"
 ep3_laamp_decision_event.1053.desc: "ภายในกองรักษาการณ์ที่อับ ทหารยามได้จัดเวทีต่อสู้เพื่อฝึกฝนทักษะของพวกเขา สองคนกำลังใช้งานอยู่ แทงใส่กันขณะที่ผู้ดูสองสามคนส่งเสียงเชียร์\n\nข้าสังเกตการฝึกของพวกเขาสักพักและเห็นได้ชัดว่า [laamp_talented_guard.GetFirstName] ทหารยามคนแรก มีประสบการณ์มากกว่า [laamp_plain_guard.GetFirstName] ทหารยามคนที่สองอย่างมาก\n\nเมื่อพวกเขาเสร็จสิ้น ข้าเข้าใกล้เวทีอย่างระมัดระวัง และพวกเขาก็หันมาสนใจข้า:"
 ep3_laamp_decision_event.1053.a: ""[laamp_plain_guard.GetFirstNameNoTooltip] อยากมาทำงานให้ข้าไหม?""
 ep3_laamp_decision_event.1053.b: ""พวกเราต้องการคนที่มีทักษะอย่างท่าน [laamp_talented_guard.GetFirstNameNoTooltip]""
 ep3_laamp_decision_event.1053.c: ""มีใครอยากเล่นลูกเต๋าบ้างไหม?""
 ep3_laamp_decision_event.1053.c.plain_wins: "[laamp_plain_guard.GetShortUIName] ชนะรอบนี้"
 ep3_laamp_decision_event.1053.c.talented_wins: "[laamp_talented_guard.GetShortUIName] ชนะรอบนี้"
 ep3_laamp_decision_event.1053.c.you_win: "ท่านชนะรอบนี้"
 ep3_laamp_decision_event.1053.d: "$ep3_laamp_decision_event.1021.d$"

#Reinforcers
ep3_laamp_decision_event.1055.t: "[visiting_location.GetBaronyNameExplicitlyNoTooltip]: กองกำลังเสริม"
ep3_laamp_decision_event.1055.desc_maxed_out_returned: "เมื่อข้ากลับมาถึงค่ายพักแรม กลุ่มทหารยังคงจ้องมองข้าขณะที่พวกเขาแยกทางให้ข้าผ่านไป\n\nพวกเขาพึมพำว่าข้าเป็นส่วนหนึ่งในการโค่นล้ม [ROOT.Char.Custom('RegionalMythicalCreatureLower')] ในตำนาน ท่ามกลางเรื่องราวที่น่าอัศจรรย์ยิ่งกว่านั้น\n\nริมฝีปากของข้าเผยอยิ้มบางๆ ขณะที่ข้ากลับมาพบกับหัวหน้ากลุ่ม [laamp_maa_reinforcer.GetHerHis] ก้มศีรษะเล็กน้อยและหลีกเลี่ยงสายตาของข้าอย่างแข็งขันขณะที่ [laamp_maa_reinforcer.GetSheHe] รอให้ข้าพูด"
ep3_laamp_decision_event.1055.desc_returned_01: "กลับมาที่ค่ายพักแรม ข้าเห็นทหารสองสามคนกำลังให้น้ำม้าของพวกเขา เสื้อคลุมของพวกเขาแสดงสัญญาณว่าเป็นของกองพลทหารม้าที่เข้าใจยากกองหนึ่ง\n\nข้าเดินไปตามเส้นทางที่คดเคี้ยวผ่านกระโจมกลับไปยัง[laamp_maa_reinforcer.GetWomanMan]ที่น่าเกรงขามจากก่อนหน้านี้ ซึ่งไม่ได้พยายามปกปิดความไม่พอใจของ [laamp_maa_reinforcer.GetHerHis] เลยแม้ แต่น้อย\n\n[laamp_maa_reinforcer.GetSheHe|U] มองข้าด้วยดวงตาที่เหนื่อยล้า และรอให้ข้าพูด"
ep3_laamp_decision_event.1055.desc_returned_02: "กลับมาที่ค่ายพักแรม ทหารแทบไม่สนใจข้าเลยขณะที่ข้าเดินผ่านพวกเขาและลึกเข้าไปในค่าย\n\nในที่สุด ข้าก็พบ[laamp_maa_reinforcer.GetWomanMan]จากก่อนหน้านี้ และการกระตุกเล็กน้อยที่คิ้วของ [laamp_maa_reinforcer.GetHerHis] เป็นเพียงสิ่งเดียวที่แสดงความประหลาดใจใดๆ ที่ [laamp_maa_reinforcer.GetSheHe] อาจมีที่ได้เห็นข้าอีกครั้งเร็วขนาดนี้\n\nดวงตาของ [laamp_maa_reinforcer.GetHerHis|U] เหม่อมองไปไกล ขณะที่ [laamp_maa_reinforcer.GetSheHe] รอให้ข้าพูด"
ep3_laamp_decision_event.1055.desc_maxed_out: "ข้าเดินลงไปที่ค่ายพักแรมที่ขอบของ [visiting_location.GetBaronyNameExplicitlyNoTooltip] และข้ารู้สึกถึงสายตาของพวกเขาที่จับจ้องมาที่ข้า\n\nทหารที่พ่ายแพ้และตกต่ำกระซิบกระซาบอยู่ข้างหลังข้าขณะที่ข้าเดินลงไปยังหัวหน้ากลุ่มคนหนึ่ง\n\nดวงตาของ [laamp_maa_reinforcer.GetHerHis|U] เบิกกว้างเล็กน้อย ขณะที่ [laamp_maa_reinforcer.GetSheHe] รอให้ข้าพูด"
ep3_laamp_decision_event.1055.desc: "ค่ายพักแรมที่ขอบของ [visiting_location.GetBaronyNameExplicitlyNoTooltip] เต็มไปด้วยทหารและนักรบ ทั้งใหญ่และเล็ก จากหลากหลายวัฒนธรรม แต่ส่วนใหญ่เป็นชาว [visiting_location.GetCounty.GetCulture.GetCollectiveNounNoTooltip]\n\nพวกเขารวมตัวกันเป็นกลุ่ม ส่วนใหญ่ทำหน้าบึ้งและมองไปรอบๆ ราวกับกำลังมองหาทางออกจากความทุกข์ยากของตน\n\nข้าเดินต่อไป จนกระทั่งพบ[laamp_maa_reinforcer.GetWomanMan]ที่น่าเกรงขาม ซึ่งเพิ่งตะโกนใส่นักรบที่มีแผลเป็นสองสามคนเสร็จ และ [laamp_maa_reinforcer.GetSheHe] ก็มองข้าอย่างสงสัย"
ep3_laamp_decision_event.1055.a: ""ขี่ม้าไปกับข้า — [ROOT.Char.GetTitledFirstNameNoTooltip]ผู้โดดเด่น!""
ep3_laamp_decision_event.1055.a.flavor: "มีชื่อเสียง? ข้าเพียงทำในสิ่งที่ต้องทำ"
ep3_laamp_decision_event.1055.a.cooldown.tt: "ท่านได้ใช้ประโยชน์จาก [prestige_level|E] ของท่านเมื่อเร็วๆ นี้ — กองทหารที่กระหายเกียรติยศมากขึ้นได้รวมตัวกันในวันที่ [GetCurrentDateWithDiff( GetVarTimeRemaining( THIS.Char.MakeScope, '1055_reinforced_with_prestige_recently') )]"

