 #Bodyguard
 ep3_laamp_decision_event.1057.t: "[visiting_location.GetBaronyNameExplicitlyNoTooltip]: องครักษ์"
 ep3_laamp_decision_event.1057.desc_returned_01: "เมื่อข้ากลับไปที่ตรอกซอยที่ข้าทิ้งอดีตองครักษ์ [laamp_bodyguard_recruit.GetFirstName] ไว้ [laamp_bodyguard_recruit.GetSheHe] กำลังพูดคุยกับนายจ้างของ [laamp_bodyguard_recruit.GetHerHis] อย่างสบายๆ ซึ่งก็คือคนขายเนื้อท้องถิ่น\n\nเมื่อเดินเข้าไปใกล้ พวกเขาก็จบบทสนทนาที่เป็นกันเอง และคนขายเนื้อก็ตบ [laamp_bodyguard_recruit.GetFirstName] อย่างเป็นมิตรขณะที่ [laamp_bodyguard_recruit.GetSheHe] เดินกลับเข้าไปข้างใน\n\n[laamp_bodyguard_recruit.GetFirstNameNoTooltip] ซึ่งตอนนี้มีประกายความเป็นมิตรเล็กน้อยในดวงตาของ [laamp_bodyguard_recruit.GetHerHis] หันมาหาข้า: "โอ้ ท่านกลับมาแล้ว ท่านต้องการอะไรหรือ?""
 ep3_laamp_decision_event.1057.desc_returned_02: "อดีตองครักษ์ [laamp_bodyguard_recruit.GetFirstName] เงยหน้าขึ้นขณะที่ข้ากลับไปที่ตรอกที่ [laamp_bodyguard_recruit.GetSheHe] ประกอบอาชีพใหม่ของ [laamp_bodyguard_recruit.GetHerHis]\n\nมีดเต้นรำไปในอากาศขณะที่ [laamp_bodyguard_recruit.GetSheHe] แล่ซากสัตว์อีกซากเป็นชิ้นเนื้ออย่างเรียบร้อย และข้าก็ถอยหลังไปหนึ่งก้าวโดยไม่ได้ตั้งใจจากความรุนแรงนั้น\n\n[laamp_bodyguard_recruit.GetSheHe|U] จ้องมองข้าอย่างตายด้านและพูดด้วยน้ำเสียงไร้ความรู้สึก: "...ว่าไง?""
 ep3_laamp_decision_event.1057.desc_returned_03: "กลับมาที่ตรอกซอย [laamp_bodyguard_recruit.GetFirstName] นั่งอยู่บนเกวียนเปล่า ทำแผลที่ข้อนิ้วของ [laamp_bodyguard_recruit.GetHerHis] สันนิษฐานว่ามาจากการทะเลาะวิวาทกับคนอื่นๆ ที่ไม่พอใจชื่อเสียงของ [laamp_bodyguard_recruit.GetHerHis]\n\nทำหน้าเหยเก [laamp_bodyguard_recruit.GetSheHe] รับรู้ถึงการมีอยู่ของข้าและพูดว่า: "อ่า ท่านเห็นข้า แต่ในช่วงเวลาที่สดใสที่สุดสินะ" [laamp_bodyguard_recruit.GetSheHe|U] เอนหลังและถอนหายใจ "ลืมอะไรไปหรือ?""
 ep3_laamp_decision_event.1057.desc_reused_bodyguard: "ข้าจำ[laamp_bodyguard_recruit.GetWomanMan]ที่ตะโกนได้รางๆ และเมื่อ[laamp_bodyguard_recruit.GetWomenMen]ที่กล่าวหาจากไป ข้าก็ตาม [laamp_bodyguard_recruit.GetFirstName] ไปตามตรอกซอย$ep3_laamp_decision_event.1057.desc_mid$\n\nองครักษ์ผู้เสื่อมเสียหรี่ตาขณะที่ข้าเข้าใกล้: "เดี๋ยวนะ ข้าเคยเห็นท่านที่ไหนมาก่อนหรือเปล่า...?" [laamp_bodyguard_recruit.GetSheHe|U] ทำหน้าเหยเก "ช่างมันเถอะ ท่านต้องการอะไร?""
 ep3_laamp_decision_event.1057.desc: "จากเสียงตะโกน ข้าได้ยินชื่อ [laamp_bodyguard_recruit.GetFirstName] และเมื่อ[laamp_bodyguard_recruit.GetWomenMen]ที่กล่าวหาจากไป ข้าก็ตาม [laamp_bodyguard_recruit.GetFirstNameNoTooltip] ไปตามตรอกซอย$ep3_laamp_decision_event.1057.desc_mid$\n\nองครักษ์ผู้เสื่อมเสียมองข้าอย่างเหี่ยวแห้งขณะที่ข้าเข้าใกล้: "ท่านต้องการอะไร? ข้าดูแลแม้กระทั่ง #EMP ต้นไม้#! บ้าๆ ยังไม่ได้เลย...""
 ep3_laamp_decision_event.1057.desc_mid: "\n\n[laamp_bodyguard_recruit.GetSheHe|U] เริ่มขนซากสัตว์ลงจากเกวียนโทรมๆ ทันที พลางพึมพำกับ [laamp_bodyguard_recruit.GetHerselfHimself]: "...ขุนนาง #EMP คนหนึ่ง#! เสียชีวิต [laamp_bodyguard_recruit.GetHerHis] ในขณะที่เจ้าเฝ้ายามอยู่ และ... #EMP ข้า#! จะรู้ได้อย่างไรว่า [laamp_bodyguard_recruit.Custom('RegionalDrink')] มัน..." [laamp_bodyguard_recruit.GetSheHe|U] ทุบกำปั้น [laamp_bodyguard_recruit.GetHerHis] ลงบนเกวียนอย่างหงุดหงิด"
 ep3_laamp_decision_event.1057.a: "$ep3_laamp_decision_event.1047.a$"
 ep3_laamp_decision_event.1057.b: ""เห็นกล้ามเนื้อพวกนี้ไหม? #EMP ข้า#! แทบจะต้องปกป้อง #EMP เจ้า#! เลยนะ""
 ep3_laamp_decision_event.1057.c: ""เข้าร่วมกับข้า แล้วเราจะฟื้นฟูชื่อเสียงของท่าน!""
 ep3_laamp_decision_event.1057.c.success: "[laamp_bodyguard_recruit.GetShortUIName] ถูกโน้มน้าว"
 ep3_laamp_decision_event.1057.c.failure: "ท่านชักจูง [laamp_bodyguard_recruit.GetShortUIName] ไม่สำเร็จ"
 ep3_laamp_decision_event.1057.c.failure.tt: "[laamp_bodyguard_recruit.GetShortUIName] เริ่มเมินท่าน"
 ep3_laamp_decision_event.1057.d: ""นี่คือโอกาสของท่านในการ #EMP ไถ่บาป.#!""
 ep3_laamp_decision_event.1057.e: "$ep3_laamp_decision_event.1021.d$"

 #Option: Visit the local city craftsmen
 ep3_laamp_decision_event.1060.t: "[visiting_location.GetBaronyNameExplicitlyNoTooltip]: ย่านช่างฝีมือ"
 ep3_laamp_decision_event.1060.desc_returned_01: "ดวงอาทิตย์อยู่สูงเหนือย่านช่างฝีมือขณะที่ข้ากลับมาพบกับเสียง ภาพ และกลิ่นมากมาย"
 ep3_laamp_decision_event.1060.desc_returned_02: "เมฆก้อนหนึ่งกำลัง ทำให้แสงอ่อนลงทั่วย่านช่างฝีมือ และข้ากลับมาพร้อมกับกลิ่นที่รุนแรง ขณะที่ข้าตระหนักว่าข้าเดินเข้าไปใกล้โรงฟอกหนังมากเกินไประหว่างทางกลับ"
 ep3_laamp_decision_event.1060.desc_returned_from_weaponsmith: "กลับมาจากช่างทำอาวุธ ช่างฝีมือต่างๆ และลูกมือของพวกเขายังคงทำงานอย่างเต็มที่ ขนส่งสินค้าไปมา"
 ep3_laamp_decision_event.1060.desc_returned_from_armorer: "เหงื่อจากเตาหลอมค่อยๆ ไหลลงมาตามแผ่นหลังของข้า และข้าได้รับลมเย็นๆ ขณะกลับมาที่ย่านช่างฝีมือ"
 ep3_laamp_decision_event.1060.desc_returned_from_jeweler: "ข้าหรี่ตาเมื่อเจอแสงสว่างจ้าของลานกว้างขณะก้าวออกจากที่พักของช่างทำอัญมณีและเข้าสู่ลานของย่านช่างฝีมือ"
 ep3_laamp_decision_event.1060.desc_returned_from_quartermaster: "อากาศในย่านช่างฝีมือปลอดโปร่งขึ้นอย่างเห็นได้ชัด ขณะที่ข้าก้าวออกมาจากโรงเตี๊ยมมืดๆ ที่ [laamp_quartermaster_recruit.GetFirstName] กำลังจมอยู่กับความเศร้า [laamp_quartermaster_recruit.GetHerHis]"
 ep3_laamp_decision_event.1060.desc: "ในย่านช่างฝีมือของ [visiting_location.GetBaronyNameExplicitly] มีอาชีพที่เกี่ยวข้องทั้งหมดอยู่ — ช่างทำอาวุธ [laamp_weaponsmith_craftsman.GetFirstName] อยู่ข้างลานฝึก ช่างทำเกราะ [laamp_armorer_craftsman.GetFirstName] อยู่ในโรงตีเหล็กของ [laamp_armorer_craftsman.GetHerHis] และ [laamp_jeweler_craftsman.GetFirstName] ช่างทำอัญมณี อยู่ไกลออกไปข้างหน้า"
 ep3_laamp_decision_event.1060.desc_outro_quartermaster: "\n\nนอกจากนี้ยังมี[laamp_quartermaster_recruit.GetWomanMan]ที่โทรมและท้อแท้เดินไปมา [laamp_quartermaster_recruit.GetSheHe|U] มองมาที่ข้าและคำรามอย่างขุ่นเคือง: "ข้าเคยเป็น #EMP คนสำคัญ!#! ข้าคือ [laamp_quartermaster_recruit.GetFirstName] #EMP พลาธิการของ[visiting_location.GetTitle.GetHolder.GetTopLiege.GetTitleAsNameNoTooltip|l]!#!" ก่อนจะสงบลง ดูเหมือนจมอยู่ในความคิด"
 ep3_laamp_decision_event.1060.desc_outro_partner: "\n\n[visiting_partner.GetFirstName] ตามข้ามา เดินเล่นไปตามถนนอย่างสบายๆ และแสดงความคิดเห็นเกี่ยวกับสินค้าที่จัดแสดง [visiting_partner.GetSheHe|U] มองมาที่ข้าขณะที่ข้าหยุดชั่วคราว พยายามตัดสินใจว่าจะไปที่ไหนต่อ"
 ep3_laamp_decision_event.1060.desc_outro: "\n\nข้าหยุดครู่หนึ่ง มองดูเด็กๆ ที่เล่นอยู่ท่ามกลางวัตถุดิบ พ่อแม่ของพวกเขาค่อยๆ ไล่พวกเขาออกไปขณะที่ข้าตัดสินใจว่าจะไปที่ไหนต่อ"
 ep3_laamp_decision_event.1060.desc_outro_return_partner_finished: "$ep3_laamp_decision_event.1040.desc_outro_return_partner_finished$"
 ep3_laamp_decision_event.1060.desc_outro_return_finished: "\n\nเท้าของข้าเจ็บและท้องร้อง เป็นวันที่ได้ผลดีในย่านช่างฝีมือ ข้าพบว่าตัวเองกำลังมองหาทางที่เร็วที่สุดเพื่อกลับไปยังจัตุรัสหลัก"
 ep3_laamp_decision_event.1060.desc_outro_quartermaster_return: "\n\nขณะที่ข้าไตร่ตรองถึงจุดหมายต่อไป ข้ามองไปที่อดีตพลาธิการ [laamp_quartermaster_recruit.GetFirstName] ซึ่งยังคงเดินเตร่ไปมาอย่างไร้จุดหมายในลาน"
 ep3_laamp_decision_event.1060.desc_outro_return_partner_01: "\n\n[visiting_partner.GetFirstName] ดมกลิ่นในอากาศ เคลื่อนไหวอย่างรวดเร็วข้ามลานขณะหลบหลีกผู้คนที่ผ่านไปมาเพื่อพยายามรักษาระดับความเร็วให้เท่ากับข้า\n\n[visiting_partner.GetSheHe|U] ตามทันขณะที่ข้าหยุดชั่วครู่ พิจารณาว่าจะทำอะไรต่อไป"
 ep3_laamp_decision_event.1060.desc_outro_return_partner_02: "\n\nทางซ้ายของข้า [visiting_partner.GetFirstName] กำลังตรวจสอบแผงขายของในตลาดที่คลุมด้วยหนังสัตว์ [ROOT.Char.Custom('RegionalFerociousAnimal')] ทุกขนาด รูปร่าง และสีอย่างสงสัย\n\nหัวสัตว์ชนิดหนึ่งที่ติดผนังยิ้มให้ข้าขณะที่ข้ามองลงไปตามถนน พยายามตัดสินใจว่าจะไปที่ไหนต่อ"
 ep3_laamp_decision_event.1060.desc_outro_return_partner_03: "\n\n[visiting_partner.GetFirstName] เดินไปมาข้ามลานอย่างสบายๆ เลือกดูแผงลอย สังเกต [visiting_partner.GetHerHim] อย่างเหม่อลอย ข้าไตร่ตรองว่าจะทำอะไรต่อไป"
 ep3_laamp_decision_event.1060.desc_outro_return_01: "\n\nข้ามองขึ้นและลงลานอย่างเหม่อลอย แสดงสีหน้าว่างเปล่าขณะไตร่ตรองว่าจะไปที่ไหนต่อ"
 ep3_laamp_decision_event.1060.desc_outro_return_02: "\n\nเด็กบางคนกำลังเล่นกับ [ROOT.Char.Custom('get_region_dog_type')] ตัวใหญ่ ป้อนเศษอาหารให้มันขณะผลัดกันขี่หลังที่แข็งแรงของมัน\n\nข้าสังเกตเกมของพวกเขาอย่างไม่ใส่ใจขณะพิจารณาก้าวต่อไปของข้า"
 ep3_laamp_decision_event.1060.desc_outro_return_03: "\n\nเด็กกลุ่มหนึ่งเจอแร่ก้อนใหญ่และกำลังเตะมันขึ้นลงตามถนน ตามกฎเกณฑ์ที่คลุมเครือที่พวกเขาสร้างขึ้นเอง\n\nข้ามองพวกเขาด้วยความทึ่งขณะพิจารณาเรื่องธุรกิจลำดับต่อไปของข้าอย่างรอบคอบ"
 ep3_laamp_decision_event.1060.a: "อาวุธมีประโยชน์ที่สุดในตอนนี้"
 ep3_laamp_decision_event.1060.a_second: "อาวุธดูน่าสนใจ"
