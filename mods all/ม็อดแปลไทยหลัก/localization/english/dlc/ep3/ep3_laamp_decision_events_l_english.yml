 ep3_laamp_decision_event.1050.c: "บางทีทหารชาว [visiting_location.GetCounty.GetCulture.GetCollectiveNounNoTooltip] ที่มอซอเหล่านั้นอาจมีประโยชน์?"
 ep3_laamp_decision_event.1050.c_second: "[visiting_location.GetCounty.GetCulture.GetCollectiveNounNoTooltip]ที่ขวัญเสียยังคงมีประโยชน์"
 ep3_laamp_decision_event.1050.c.tt: "ไปหาทหารที่ขวัญเสีย"
