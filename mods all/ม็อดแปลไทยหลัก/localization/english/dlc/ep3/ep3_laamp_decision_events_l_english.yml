 #Option: Buy supplies
 ep3_laamp_decision_event.1010.t: "[visiting_location.GetBaronyNameExplicitlyNoTooltip]: เสบียง!"
 ep3_laamp_decision_event.1010.desc_posh_stalls: "แผงลอยในย่านอาหารของ [visiting_location.GetBaronyNameExplicitly] เต็มไปด้วยสินค้าอย่างแท้จริง ทำให้ราคาลดลง ข้าพเจ้าหาแผงลอยของพ่อค้าเสบียง [laamp_supply_merchant.GetFirstNamePossessive] พบ; เป็นความสมดุลที่ยอดเยี่ยมระหว่างคุณภาพดีและราคาที่เอื้อมถึง\n\nสังเกตเห็นความสนใจของข้าพเจ้า,"
 ep3_laamp_decision_event.1010.desc: "ตั้งแต่ [ROOT.Char.Custom('RegionalRootVegetablePlural')] ไปจนถึงผ้า; ฟืนไปจนถึงด้ายเย็บผ้า — พ่อค้าเสบียง [laamp_supply_merchant.GetFirstName] มีทุกอย่าง แผงลอยเต็มไปด้วยทุกสิ่งที่อาจต้องการสำหรับค่ำคืนในป่า\n\nข้าพเจ้าขยับเข้าไปใกล้เล็กน้อยเพื่อดึงดูดความสนใจของ [laamp_supply_merchant.GetHerHis] และ"
 ep3_laamp_decision_event.1010.desc_returned: "ขณะที่แผงลอยยังคงเต็มไปด้วยสินค้า พ่อค้าเสบียง [laamp_supply_merchant.GetFirstName] หยิบ [ROOT.Char.Custom('RegionalRootVegetable')] ที่หลงทาง ซึ่งหล่นลงมาจากขอบเคาน์เตอร์\n\nข้าพเจ้าเลิกคิ้วเล็กน้อยใส่ [laamp_supply_merchant.GetHerHim] เพื่อแสดงการกลับมาของข้าพเจ้า และ"
 ep3_laamp_decision_event.1010.desc_reused_merchant_reaction_01: "[laamp_supply_merchant.GetSheHe] มองข้าพเจ้าขึ้นลง ประหลาดใจอย่างน่ายินดี:"
 ep3_laamp_decision_event.1010.desc_reused_merchant_reaction_02: "[laamp_supply_merchant.GetSheHe] ดูประหลาดใจเล็กน้อยอย่างแท้จริงเมื่อเห็นข้าพเจ้า:"
 ep3_laamp_decision_event.1010.desc_reused_merchant_intro: ""ลูกค้ากลับมาแล้ว!"
 ep3_laamp_decision_event.1010.desc_reused_merchant_01: "ช่างเป็นภาพที่น่าชื่นใจเสียนี่กระไร!"
 ep3_laamp_decision_event.1010.desc_reused_merchant_02: "ยังไม่พอใช่ไหมล่ะ!"
 ep3_laamp_decision_event.1010.desc_reused_merchant_03: "ข้าไม่อยากจะเชื่อเลย!"
 ep3_laamp_decision_event.1010.desc_reused_merchant_outro_01: "ท่านจะรับอะไรดี?""
 ep3_laamp_decision_event.1010.desc_reused_merchant_outro_02: "จะรับอะไรดี?""
 ep3_laamp_decision_event.1010.desc_trait_gregarious_new: "[laamp_supply_merchant.GetSheHe] หน้าตาสดใสขึ้นขณะที่ [laamp_supply_merchant.GetSheHe] มองข้าพเจ้าด้วยรอยยิ้มที่เป็นมิตร: "
 ep3_laamp_decision_event.1010.desc_trait_gregarious_return: "[laamp_supply_merchant.GetSheHe] ส่งยิ้มที่เป็นมิตรให้ข้าพเจ้าอีกครั้ง: "
 ep3_laamp_decision_event.1010.desc_trait_callous_new: "[laamp_supply_merchant.GetSheHe] แทบไม่มองมาทางข้าพเจ้าขณะที่ [laamp_supply_merchant.GetSheHe] พูดกับข้าพเจ้า: "
 ep3_laamp_decision_event.1010.desc_trait_callous_return: "[laamp_supply_merchant.GetSheHe] ยังคงแทบไม่รับรู้ถึงการมีอยู่ของข้าพเจ้า: "
 ep3_laamp_decision_event.1010.desc_trait_greedy_new: "ใบหน้าของ [laamp_supply_merchant.GetHerHis] เปลี่ยนเป็นรอยยิ้มพอใจเมื่อเห็นข้าพเจ้า: "
 ep3_laamp_decision_event.1010.desc_trait_greedy_return: "มีประกายในดวงตาของ [laamp_supply_merchant.GetHerHis] ขณะที่ [laamp_supply_merchant.GetSheHe] มองข้าพเจ้าขึ้นลง: "
 ep3_laamp_decision_event.1010.desc_trait_shy_new: "[laamp_supply_merchant.GetSheHe] เริ่มมองข้าพเจ้าด้วยความเข้มข้นที่ไม่เข้ากับความอ่อนโยนของเสียง [laamp_supply_merchant.GetHerHis]: "
 ep3_laamp_decision_event.1010.desc_trait_shy_return: "[laamp_supply_merchant.GetSheHe] พิจารณาการกลับมาของข้าพเจ้าอย่างรอบคอบก่อนที่ [laamp_supply_merchant.GetSheHe] จะพูดเบาๆ ว่า: "
 ep3_laamp_decision_event.1010.desc_trait_eccentric_new: "[laamp_supply_merchant.GetSheHe] มองข้าพเจ้าอย่างเหม่อลอย เห็นได้ชัดว่ากำลังหมกมุ่นอยู่กับเรื่องอื่น: "
 ep3_laamp_decision_event.1010.desc_trait_eccentric_return: "[laamp_supply_merchant.GetSheHe] มองข้าพเจ้า ดูเหมือนจะไม่รู้ว่าเราเคยพบกันแล้วเมื่อครู่ที่ผ่านมา: "
 ep3_laamp_decision_event.1010.desc_generic_new_01: "[laamp_supply_merchant.GetSheHe] พยักหน้ามาทางข้าพเจ้า: "
 ep3_laamp_decision_event.1010.desc_generic_new_02: "[laamp_supply_merchant.GetSheHe] มองข้าพเจ้าอย่างรู้ทัน: "
 ep3_laamp_decision_event.1010.desc_generic_returned_01: "[laamp_supply_merchant.GetSheHe] เลิกคิ้วอย่างขบขัน: "
 ep3_laamp_decision_event.1010.desc_generic_returned_02: "[laamp_supply_merchant.GetSheHe] เงยหน้าขึ้นและพูดกับข้าพเจ้า: "
 ep3_laamp_decision_event.1010.desc_outro_new_01: ""มีอะไรน่าสนใจไหม?""
 ep3_laamp_decision_event.1010.desc_outro_new_02: ""เห็นอะไรที่ท่านชอบไหม?""
 ep3_laamp_decision_event.1010.desc_outro_new_03: ""ท่านต้องการอะไร?""
 ep3_laamp_decision_event.1010.desc_outro_special_new_04: ""โลกภายนอกมันโหดร้ายใช่ไหมล่ะ? ข้าจะเอาอะไรให้ท่านดี?""
 ep3_laamp_decision_event.1010.desc_outro_returned_01: ""เสบียงดูดีใช่ไหมล่ะ?""
 ep3_laamp_decision_event.1010.desc_outro_returned_02: ""ข้ารู้สึกว่าท่านจะกลับมา""
 ep3_laamp_decision_event.1010.desc_outro_returned_03: ""ดีที่สุดใน [visiting_location.GetTitle.GetHolder.GetLiege.GetPrimaryTitle.GetNameNoTierNoTooltip] ทั้งหมด""
 ep3_laamp_decision_event.1010.desc_outro_sneaky_partner: "\n\n[visiting_partner.GetFirstName] หักข้อนิ้วของ [visiting_partner.GetHerHis] และมองข้าพเจ้า พยักหน้าอย่างสุขุมไปทางเสบียง พึมพำว่า: "สนใจจะเบี่ยงเบนความสนใจหน่อยไหม...?""
 ep3_laamp_decision_event.1010.desc_outro_sneaky_partner_returned: "\n\n[visiting_partner.GetFirstName] ยังคงจับตามองสินค้าที่จัดแสดง มองข้าพเจ้าเพื่อรอสัญญาณใดๆ ที่อาจเกิดขึ้นเพื่อจัดหาเสบียงแบบ '#EMP ฟรี#!'"
 ep3_laamp_decision_event.1010.a_diplomacy: ""ท่านพอจะมีเสบียงเหลือให้บ้างไหม สหาย... ?""
 ep3_laamp_decision_event.1010.a_diplomacy.success: "ท่านหว่านล้อม [laamp_supply_merchant.GetShortUIName] ได้สำเร็จ"
 ep3_laamp_decision_event.1010.a_diplomacy.failure: "[laamp_supply_merchant.GetShortUIName] สัมผัสได้ถึงความสิ้นหวังของท่าน"
