 recruited_maa.tt: "[laamp_disgruntled_moa.GetShortUIName] กำลังยุ่งอยู่กับการย้ายเข้าค่ายของท่าน"

 ep3_laamp_decision_event.1050.b: "เราควรหาคนที่มีความสามารถที่กองรักษาการณ์"
 ep3_laamp_decision_event.1050.b_second: "กองรักษาการณ์ยังคงน่าสนใจ"
