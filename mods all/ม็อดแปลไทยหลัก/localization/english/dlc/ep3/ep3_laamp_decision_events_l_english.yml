 ep3_laamp_decision_event.1010.b: ""ข้าจะซื้อของพวกนี้และของพวกนั้น""
 ep3_laamp_decision_event.1010.c_callous: ""ข้าอาจจะแลกเปลี่ยนเด็กฝึกงานคนนี้กับเสบียงได้""
 ep3_laamp_decision_event.1010.c: ""...บางทีข้าอาจจะแลกเปลี่ยนเด็กฝึกงานได้?""
 ep3_laamp_decision_event.1010.c.flavor: "โปรดยกโทษให้ข้าด้วย..."
 ep3_laamp_decision_event.1010.c.flavor_callous: "อย่างน้อยก็ลดปากท้องไปหนึ่งปาก"
 ep3_laamp_decision_event.1010.d: ""โอ๊ะโอ! ข้าซุ่มซ่ามจัง!""
 ep3_laamp_decision_event.1010.d.flavor: "[visiting_partner.GetFirstNameNoTooltip], #EMP ไปเลย!#!"
 ep3_laamp_decision_event.1010.d.success: "[visiting_partner.GetShortUIName] ขโมยเสบียงจำนวนหนึ่งได้สำเร็จ"
