 #Healer
 ep3_laamp_decision_event.1041.return.tt: "ท่านกลับไปยังบริเวณ[visiting_location.GetCounty.GetFaith.HouseOfWorship]"
 ep3_laamp_decision_event.1041.t: "[visiting_location.GetBaronyNameExplicitlyNoTooltip]: หมอรักษา"
 ep3_laamp_decision_event.1041.desc_returned_sickly_minor: "[1040_sickly_minor.GetFirstName] กำลังพักผ่อนอยู่บนที่นอนนุ่มๆ ข้างเตาผิงมุมห้องในกระท่อมหมอรักษา รอคอยการกลับมาของข้า ข้าโน้มตัวเข้าไปตรวจลมหายใจของ [1040_sickly_minor.GetHerHis] โดยสัญชาตญาณ และลูบผมของ [1040_sickly_minor.GetHerHis]\n\n[laamp_healer_character.GetFirstName] วาง [ROOT.Char.Custom('WritingInstrument')] ของ [laamp_healer_character.GetHerHis] ลงและมองข้าด้วยสีหน้าเคร่งขรึม: "เราตกลงกันว่าอย่างไรนะ?""
 ep3_laamp_decision_event.1041.desc_returned_physician_partner: "ขณะที่เราเข้าไปในกระท่อมของหมอ [laamp_healer_character.GetFirstName] กำลังครุ่นคิดเกี่ยวกับสมุนไพรบางอย่าง แต่ [laamp_healer_character.GetSheHe] ก็เงยหน้าขึ้นมองเราขณะที่เราลงบันได: "อ้อ เปลี่ยนใจแล้วสินะ?"\n\nทางซ้ายของข้า [visiting_partner.GetFirstNameNoTooltip] กำลังเปลี่ยนน้ำหนักตัวจากเท้าหนึ่งไปอีกเท้าหนึ่ง ยังคงอยากลองฝีมือ [visiting_partner.GetHerHis] ในกระบวนการที่เราเห็น [laamp_healer_character.GetFirstNameNoTooltip] ทำก่อนหน้านี้"
 ep3_laamp_decision_event.1041.desc_returned_01: "[laamp_healer_character.GetFirstName] กำลังดูแลผู้ป่วยอีกคนขณะที่ข้าก้าวลงบันไดเข้าไปในกระท่อมหมอรักษา [laamp_healer_character.GetSheHe|U] เหลือบมองข้า แล้วชี้ให้ผู้ป่วยของ [laamp_healer_character.GetHerHis] นั่งลงบนที่นอนที่อยู่ลึกเข้าไปในห้อง\n\n[laamp_healer_character.GetSheHe|U] ดำเนินการปิดม่านชั่วคราวที่ทำจากผ้าปูที่นอนเก่าๆ เพื่อให้ความเป็นส่วนตัวแก่ทั้งผู้ป่วยและพวกเรา\n\n"ข้าเห็นว่าท่านกลับมาแล้ว" [laamp_healer_character.GetSheHe] กล่าวอย่างขยันขันแข็ง: "ท่านต้องการให้ข้าช่วยอะไรหรือไม่?""
 ep3_laamp_decision_event.1041.desc_returned_02: "ก้าวกลับลงไปในกระท่อมหมอรักษาที่สลัวๆ [laamp_healer_character.GetFirstName] นั่งอยู่ลึกเข้าไปอีกหน่อย พลิกหน้าสมุดบันทึกเก่าๆ เล่มหนึ่ง ยากที่จะแยกแยะจากระยะไกล ดูเหมือนจะมีภาพวาดของรูปร่างมนุษย์\n\n[laamp_healer_character.GetSheHe|U] ค่อยๆ ปิดสมุดบันทึก เก็บมันไป แล้วมองมาที่ข้าและเอ่ยด้วยน้ำเสียงสงบ: "อ้อ ท่านกลับมาแล้ว พบสิ่งใดที่ ทำให้ท่านเจ็บป่วยหรือ ในที่สุด?""
 ep3_laamp_decision_event.1041.desc_sickly_minor: "[ROOT.Char.Custom2('RelationToMe', SCOPE.sC('1040_sickly_minor'))] ของข้า [1040_sickly_minor.GetFirstName] ซึ่งป่วยอยู่ มาสมทบกับข้าที่กระท่อมหมอรักษา [1040_sickly_minor.GetSheHe|U] ไออย่างอ่อนแรงขณะที่ข้าอุ้ม [1040_sickly_minor.GetHerHim] ลงบันได\n\nหมอรักษา [laamp_healer_character.GetFirstName] ลุกขึ้นจากเก้าอี้ไม้ของ [laamp_healer_character.GetHerHis] และมองข้าด้วยสีหน้าเศร้าสร้อย: "ท่านต้องการใช้บริการของข้าหรือไม่?""
 ep3_laamp_decision_event.1041.desc_physician_partner: "ขณะที่เราเข้าไปในกระท่อมหมอรักษา [laamp_healer_character.GetFirstName] กำลังทำหัตถการชำระล้างให้กับ[ROOT.Char.GetWomanMan]สูงอายุ [visiting_partner.GetFirstName] สังเกต [laamp_healer_character.GetFirstNameNoTooltip] อย่างกระตือรือร้น แววตาตื่นเต้นในดวงตาของ [visiting_partner.GetHerHis]: "ข้าไม่รังเกียจที่จะลองทำ #EMP นั่น#! ดูบ้าง..."\n\n[laamp_healer_character.GetFirstNameNoTooltip] เงยหน้าขึ้นเมื่อ [laamp_healer_character.GetSheHe] ได้ยินเสียงของเรา: "ข้าไม่เห็นท่านเลย! มีอะไรเจ็บป่วยหรือ?""
 ep3_laamp_decision_event.1041_intro: "แสงสลัวลงและมี #EMP กลิ่น#! ที่ชัดเจนในกระท่อมหมอรักษา ไม่ใช่ #EMP ไม่น่าพอใจ#! แต่รุกล้ำ\n\n[laamp_healer_character.GetFirstName] ยืนอยู่ที่โต๊ะสูง กำลังง่วนอยู่กับการเตรียมยา"
 ep3_laamp_decision_event.1041.desc_reused_healer: "$ep3_laamp_decision_event.1041_intro$ [laamp_healer_character.GetSheHe|U] เงยหน้าขึ้น เลิกคิ้ว [laamp_healer_character.GetHerHis] เล็กน้อย: "ข้าเห็นว่าท่านกลับมาได้อย่างปลอดภัย! ครั้งนี้ข้าจะช่วยอะไรท่านได้บ้าง?""
 ep3_laamp_decision_event.1041.desc: "$ep3_laamp_decision_event.1041_intro$ [laamp_healer_character.GetSheHe|U] เงยหน้าขึ้นขณะที่ข้าเข้าใกล้: "สวัสดี ธาตุของท่านเป็นอย่างไรบ้าง? ต้องการการชำระล้างเล็กน้อยหรือไม่?""
 ep3_laamp_decision_event.1041.desc_outro_return_horn: "\n\nลึกเข้าไปในห้องอีกหน่อย [1041_health_artifact.GetName]อันงดงามยังคงวางอยู่พร้อมกับเครื่องประดับทางการแพทย์อื่นๆ"
 ep3_laamp_decision_event.1041.desc_outro_return_artifact: "\n\nลึกเข้าไปในห้องอีกหน่อย [1041_health_artifact.GetName]ยังคงเรียกร้องความสนใจจากข้า"
 ep3_laamp_decision_event.1041.desc_outro_horn: "\n\nที่หางตา ข้าเห็นเครื่องประดับทางการแพทย์บางอย่าง ซึ่งในจำนวนนั้นมีเขาสัตว์อันงดงามดึงดูดความสนใจของข้า"
 ep3_laamp_decision_event.1041.desc_outro_artifact: "\n\nลึกเข้าไปในห้องอีกหน่อย บนชั้นวางที่เต็มไปด้วยเครื่องประดับทางการแพทย์ ข้าเหลือบไปเห็น [1041_health_artifact.GetName] ที่น่าสงสัย เรียกร้องความสนใจจากข้า"
 ep3_laamp_decision_event.1041.a: "บางทีการปรับสมดุลธาตุอาจจะดีต่อข้า"
 ep3_laamp_decision_event.1041.a_ill: ""ข้า... ต้องการการรักษา ใช่""
 ep3_laamp_decision_event.1041.b: ""ข้าสนใจใน [1041_health_artifact.GetNameNoTooltip] นั้น""
 ep3_laamp_decision_event.1041.c: ""ท่าน #EMP จักเป็นผู้#! ดำเนินการหรือ [visiting_partner.GetFirstNameNoTooltip]?""
 ep3_laamp_decision_event.1041.c.flavor: "จะมีอะไรเลวร้ายที่สุดเกิดขึ้นได้!"
 ep3_laamp_decision_event.1041.d: ""[1040_sickly_minor.GetFirstNameNoTooltip] [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('1040_sickly_minor'))]ของข้า ต้องการการรักษา!""
 ep3_laamp_decision_event.1041.d.partner: ""[visiting_partner.GetFirstNameNoTooltip] [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('visiting_partner'))]ของข้า ต้องการการรักษา!""
 ep3_laamp_decision_event.1041.treatment_success.t: "สำเร็จ"
 ep3_laamp_decision_event.1041.treatment_failure.t: "ไม่สำเร็จ"
 ep3_laamp_decision_event.1041.treatment_failure.desc: "การรักษาไม่สำเร็จ"
 ep3_laamp_decision_event.1041.e: "$ep3_laamp_decision_event.1021.d$"

 aged_medicine_jar: "โถยาเก่าแก่"
 potent_medicine_jar: "โถยาฤทธิ์แรง"
 lapidary_tourmaline: "พลอยทัวร์มาลีนเจียระไน"
 lapidary_tourmaline.desc: "พลอยทัวร์มาลีนหลังเบี้ยขนาดพอเหมาะ กล่าวกันว่ามีคุณสมบัติกระตุ้นพลัง"
 lapidary_turquoise: "พลอยเทอร์ควอยซ์เจียระไน"
 lapidary_turquoise.desc: "พลอยเทอร์ควอยซ์หลังเบี้ยขนาดพอเหมาะ กล่าวกันว่ามีคุณสมบัติกระตุ้นพลัง"
 lapidary_tigerseye: "พลอยตาเสือเจียระไน"
 lapidary_tigerseye.desc: "พลอยตาเสือหลังเบี้ยขนาดพอเหมาะ กล่าวกันว่ามีคุณสมบัติกระตุ้นพลัง"
 lapidary_jasper: "พลอยแจสเปอร์เจียระไน"
 lapidary_jasper.desc: "พลอยแจสเปอร์หลังเบี้ยขนาดใหญ่ กล่าวกันว่ามีคุณสมบัติเป็นประโยชน์ต่อสุขภาพ"
 lapidary_garnet: "พลอยโกเมนเจียระไน"
 lapidary_garnet.desc: "พลอยโกเมนหลังเบี้ยขนาดใหญ่ กล่าวกันว่ามีคุณสมบัติเป็นประโยชน์ต่อสุขภาพ"
 lapidary_sapphire: "พลอยไพลินเจียระไน"
 lapidary_sapphire.desc: "พลอยไพลินเม็ดเดี่ยวอันงดงาม กล่าวกันว่าช่วยปกป้องผู้สวมใส่"
 lapidary_ruby: "พลอยทับทิมเจียระไน"
 lapidary_ruby.desc: "พลอยทับทิมเม็ดเดี่ยวอันงดงาม กล่าวกันว่าช่วยปกป้องผู้สวมใส่"
 scented_herb_pouch: "ถุงสมุนไพรหอม"
 scented_herb_pouch.desc: "ถุงสมุนไพรขนาดเล็กบรรจุสมุนไพรหอมผสม กล่าวกันว่าช่วยป้องกันการติดเชื้อ"
 pomander: "ลูกหอม"
 pomander.desc: "ลูกกลมเล็กๆ มีกลิ่นหอม พกพาในถุงประดับ กล่าวกันว่ากลิ่นหอมช่วยป้องกันการติดเชื้อ"

 #Church
 ep3_laamp_decision_event.1043.t: "[visiting_location.GetBaronyNameExplicitlyNoTooltip]: [visiting_location.GetCounty.GetFaith.HouseOfWorship|U]"
 ep3_laamp_decision_event.1043.desc_returned_01: "การเทศนาเพิ่งสิ้นสุดลงขณะที่เรากลับมายัง[visiting_location.GetCounty.GetFaith.HouseOfWorship] [laamp_clergy_character.Custom('SisterBrother')|U] [laamp_clergy_character.GetFirstName] กำลังเดินไปมาพร้อมไม้กวาด ค่อยๆ ทำความสะอาดและจัดระเบียบพื้นดินศักดิ์สิทธิ์ให้เรียบร้อยสำหรับผู้มาเยือนที่มาที่นี่เพื่อสวดมนต์และใคร่ครวญ\n\n[laamp_clergy_character.GetSheHe|U] เงยหน้าขึ้นขณะที่ข้าเข้าใกล้ รอยยิ้มอ่อนโยนปรากฏบนริมฝีปากของ [laamp_clergy_character.GetHerHis]: "ยินดีต้อนรับกลับสู่อ้อมกอดอันอบอุ่นของ[visiting_location.GetCounty.GetFaith.HighGodHerHis|U] ทำไมท่านไม่พักสักครู่และชมทิวทัศน์เล่า?""
 ep3_laamp_decision_event.1043.desc_returned_02: "[laamp_clergy_character.Custom('SisterBrother')|U] [laamp_clergy_character.GetFirstName] นั่งอยู่บนม้านั่งตัวหนึ่งหันหน้าไปทางแท่นเทศน์ ดูเหมือนกำลังจมอยู่กับการใคร่ครวญ เมื่อข้ากลับเข้าไปใน[visiting_location.GetCounty.GetFaith.HouseOfWorship]อีกครั้ง\n\n[laamp_clergy_character.GetSheHe|U] หันศีรษะมาทางข้า มองข้ามไหล่ของ [laamp_clergy_character.GetHerHis] ขณะที่ข้าเข้าใกล้: "ช่างยุ่งเสียจริง ให้เท้าที่เหนื่อยล้านั้นได้พักสักครู่เถิด ลูกข้า ข้าจะรับใช้ท่านได้อย่างไรบ้าง?""
 ep3_laamp_decision_event.1043.desc_reused_clergy: "ขณะที่ข้าเข้าสู่ประตูอันน่าทึ่งของ[visiting_location.GetCounty.GetFaith.HouseOfWorship] เหล่า[GetTrait('devoted').GetNameNoTooltip( laamp_clergy_character )|l]ที่ดูแลสถานที่แห่งนี้เพิ่งเสร็จสิ้นการกระจายงานประจำวัน\n\nข้ามองลงไปตามทางเดินหลักและจำ [laamp_clergy_character.Custom('SisterBrother')] [laamp_clergy_character.GetFirstName] ได้โดยไม่คาดคิด ซึ่งในทางกลับกันก็มองข้าด้วยสีหน้าที่อ่านไม่ออกและเดินเข้ามา: "ลูกผู้หลงผิดของข้า [visiting_location.GetCounty.GetFaith.HighGodName] ได้นำท่านกลับมาที่หน้าประตูของเราอย่างปลอดภัยแล้ว!""
 ep3_laamp_decision_event.1043.desc: "เมื่อผ่านประตูของ[visiting_location.GetCounty.GetFaith.HouseOfWorship] ข้าประทับใจในผลงานที่ต้องทุ่มเทลงไปในโครงสร้างอันวิจิตรและการตก แต่งอันศักดิ์สิทธิ์\n\nหนึ่งใน[GetTrait('devoted').GetNameNoTooltip( laamp_clergy_character )|l]ที่ดูแลสถานที่แห่งนี้สังเกตเห็นข้าและเดินเข้ามาอย่างสงบ: "สวัสดี ลูกข้า ข้าคือ [laamp_clergy_character.Custom('SisterBrother')] [laamp_clergy_character.GetFirstName] ข้าจะช่วยท่านได้อย่างไรบ้าง?""
 ep3_laamp_decision_event.1043.desc_outro: "\n\nสายตาของข้าเหลือบไปเห็นตะกร้าบริจาคเหรียญที่อยู่ลึกเข้าไปตามทางเดิน"
 ep3_laamp_decision_event.1043.desc_outro_thief: "\n\nข้างหลังข้า [visiting_partner.GetFirstName] กำลังมองตะกร้าที่เต็มไปด้วยเหรียญบริจาคที่อยู่ลึกเข้าไปตามทางเดินด้วยสายตาไม่น่าไว้วางใจ"
 ep3_laamp_decision_event.1043.desc_return_outro_thief: "\n\n[visiting_partner.GetFirstName] ยังคงมองข้ามม้านั่งไปยังตะกร้าบริจาคเหรียญอย่างโหยหา"
 ep3_laamp_decision_event.1043.desc_return_outro: "\n\nตะกร้าบริจาคเหรียญมีขนาดใหญ่ขึ้นเรื่อยๆ"
 ep3_laamp_decision_event.1043.a: ""ข้ามีเงินบริจาค!""
 ep3_laamp_decision_event.1043.a.flavor_unzealous: "ข้า #EMP คิดว่า#!..."
 ep3_laamp_decision_event.1043.b: ""บางที [visiting_location.GetCounty.GetFaith.HighGodName] อาจจะอวยพรภารกิจของเรา?""
 ep3_laamp_decision_event.1043.c: "เห็นได้ชัดว่า #EMP ข้า#! ต้องการเงินบริจาคเหล่านี้"
 ep3_laamp_decision_event.1043.c_guarded: "บริจาคอีกครั้ง เข้ากระเป๋า #EMP ข้า#!."
 ep3_laamp_decision_event.1043.c_master_thief: ""ชู่ว์ [visiting_partner.GetFirstNameNoTooltip] ดูต้นทางด้วย!""
 ep3_laamp_decision_event.1043.c.flavor: "สร้างความวุ่นวาย ขโมยเหรียญ ง่ายนิดเดียว"
 ep3_laamp_decision_event.1043.c.flavor_guarded: "หืม ทหารยามเดินตรวจตราแถวนี้บ่อยขึ้นนะ ด้วยเหตุผลบางอย่าง..."
 ep3_laamp_decision_event.1043.c.thievery_success.t: "การขโมยสำเร็จ"
 ep3_laamp_decision_event.1043.c.thievery_success.desc: "ท่านขโมยเงินบริจาคสำเร็จ"
 ep3_laamp_decision_event.1043.c.thievery_failure.t: "ถูกเนรเทศ!"
 ep3_laamp_decision_event.1043.c.thievery_failure.desc: "ท่านถูกเนรเทศออกจาก[visiting_location.GetCounty.GetFaith.HouseOfWorship]"
 ep3_laamp_decision_event.1043.c.thievery_critical_failure.t: "เรียกทหารยาม"
 ep3_laamp_decision_event.1043.c.thievery_critical_failure.desc: "$ep3_laamp_decision_event.1010.a_martial.critical_failure$"
 ep3_laamp_decision_event.1043.d: "$ep3_laamp_decision_event.1021.d$"
 #Post-Donation
 ep3_laamp_decision_event.1044.desc_epiphany: "ขณะที่ข้ามอบเงินบริจาค ดวงตาของ [laamp_clergy_character.GetFirstNamePossessive] เบิกกว้างด้วยความตกใจ: "ท่าน... ท่านดูเหมือน [visiting_location.GetCounty.GetFaith.HighGodHerHis|U]... [visiting_location.GetCounty.GetFaith.HighGodHerHis|U]... ข้าสาบาน..." [laamp_clergy_character.GetSheHe] จ้องมองข้าครู่หนึ่ง พะงาบปากเหมือนปลาขาดน้ำ\n\nจากนั้น เมื่อตระหนักว่า [laamp_clergy_character.GetSheHe] กำลังทำอะไร [laamp_clergy_character.GetFirstNameNoTooltip] ก็รวบรวมสติ [laamp_clergy_character.GetHerselfHimself] และกระแอมในลำคอ [laamp_clergy_character.GetHerHis]: "ข้าจักเป็นเกียรติอย่างยิ่งที่จะอุทิศชีวิต #EMP ของข้า#! เพื่ออุดมการณ์ของท่าน""
 ep3_laamp_decision_event.1044.desc: "รอยยิ้มของ [laamp_clergy_character.GetFirstNamePossessive] กว้างขึ้นขณะที่ [laamp_clergy_character.GetSheHe] โน้มตัวลง วางมือบนไหล่ของข้า: "ช่างมีเมตตาเหลือเกิน ลูกข้า ข้าเข้าใจว่าเหรียญไม่ใช่สิ่งที่หามาได้ง่ายเสมอไปสำหรับนักผจญภัย เช่นท่าน"\n\n[laamp_clergy_character.GetSheHe|U] พยักหน้าอย่างสั่งสอน มือของ [laamp_clergy_character.GetHerHis] กลับไปวางข้างลำตัวขณะที่ [laamp_clergy_character.GetSheHe] จับจ้องมาที่ข้า"
 ep3_laamp_decision_event.1044.a: ""บางที [visiting_location.GetCounty.GetFaith.HighGodName] อาจจะอวยพรการเดินทางของเรา?""
 ep3_laamp_decision_event.1044.a_epiphany: ""ข้าสนใจเพียงพระคุณของ[visiting_location.GetCounty.GetFaith.HighGodNamePossessive]เท่านั้น""
 ep3_laamp_decision_event.1044.b: ""พวกเรา #EMP น่าจะ#! ต้องการคนเพิ่มอีกคน""
 ep3_laamp_decision_event.1044.c: ""ข้าไม่สนใจสิ่งใดเลยหากไม่ใช่เพื่อนมนุษย์ด้วยกัน""
 ep3_laamp_decision_event.1044.c_epiphany: "...ตอนนี้เรายังไม่จ้างคน"
 
 #Garden
 ep3_laamp_decision_event.1045.t: "[visiting_location.GetBaronyNameExplicitlyNoTooltip]: สวน"
 ep3_laamp_decision_event.1045.desc_returned_01: "สวนยังคงเงียบสงบ และผู้มาเยือนบางคนกำลังสนทนากันเบาๆ ในบริเวณที่นั่ง ในขณะที่คนอื่นๆ กำลังจมอยู่กับการใคร่ครวญอย่างเงียบๆ เฝ้าดูธรรมชาติผ่านไป\n\nข้าฟังเสียงพึมพำและสายลม เสียงลมพัดในหมู่ไม้ รู้สึกสบายใจขึ้นทันที"
 ep3_laamp_decision_event.1045.desc_returned_02: "ครั้งนี้ ข้าเห็นนกตัวเล็กๆ ตัวหนึ่งในต้นไม้ [visiting_location.Custom('GetRandomRegionalWood')] ต้นหนึ่ง กำลังจะลองกางปีกเป็นครั้งแรก\n\nมันค่อยๆ ลื่นไถลออกจากขอบรัง แต่ปีกกลับพันกันอย่างใดอย่างหนึ่ง และชั่วครู่หนึ่งนกก็ร่วงหล่นลงมาในอากาศ จนกระทั่ง... ลมพัดพานกไปสู่ที่ปลอดภัยอย่างนุ่มนวล ความรู้สึกโล่งใจแผ่ซ่านไปทั่วอกของข้า"
 ep3_laamp_decision_event.1045.desc: "สวนล้อมรอบด้วยพุ่มไม้ และต้นไม้กระจายอยู่ตามเนินดินเตี้ยๆ ซึ่งสามารถสังเกตนกและกระรอกแปลกๆ ได้ผ่านใบไม้\n\nข้ารู้สึกถึงการประทับอยู่อย่างแรงกล้าที่นี่ ท่ามกลางความงามทั้งหมดนี้ จะเป็นไปได้หรือไม่ว่า ตลอดการทดลองและความยากลำบากของข้า [visiting_location.GetCounty.GetFaith.HighGodName] ได้อยู่กับข้ามาโดยตลอด... ?"
 ep3_laamp_decision_event.1045.desc_outro_return_partner: "\n\nไกลออกไปตามถนน [visiting_partner.GetFirstName] กำลังดูพืชที่กินได้ในบริเวณนั้นอีกครั้ง"
 ep3_laamp_decision_event.1045.desc_outro_return_gardener: "\n\nและไกลออกไปตามถนน ข้าเห็นอาหารป่าที่น่ากินมากยิ่งขึ้น ทอดตัวรับแสงแดดยามบ่าย"
 ep3_laamp_decision_event.1045.desc_outro_partner: "\n\nจากข้างหลังข้า ข้าได้ยิน [visiting_partner.GetFirstName] พึมพำทุกครั้งที่เราเจอพืชที่กินได้อย่างคลุมเครืออีกต้นระหว่างเดินเล่น"
 ep3_laamp_decision_event.1045.desc_outro_gardener: "\n\nที่หางตา ข้าสังเกตเห็นผลไม้ป่าและสมุนไพรที่ดูน่าอร่อย ซึ่งช่วยเพิ่มความเขียวชอุ่มให้กับสวน"
 ep3_laamp_decision_event.1045.a: "ข้ารู้สึกสงบใจ"
 ep3_laamp_decision_event.1045.a_convert: "บางที [visiting_location.GetCounty.GetFaith.GetNameNoTooltip] อาจไม่ใช่สิ่งเลวร้ายนักก็ได้"
 ep3_laamp_decision_event.1045.a.cooldown.tt: "ท่านได้ใคร่ครวญในสวนนี้เมื่อเร็วๆ นี้ — กลับมาในวันที่ [GetCurrentDateWithDiff( GetVarTimeRemaining( THIS.Char.MakeScope, '1045_contemplated_garden_recently') )]"

 ep3_laamp_decision_event.1045.b: "คงน่าเสียดายหากปล่อยให้อาหารเหล่านั้นเสียเปล่า"
 ep3_laamp_decision_event.1045.b_partner: ""[visiting_partner.GetFirstNameNoTooltip] เรามาหาของป่ากันหน่อยไหม?""
 ep3_laamp_decision_event.1045.b_flavor: "ถึงเวลาเก็บเกี่ยว!"
 ep3_laamp_decision_event.1045.b.cooldown.tt: "ท่านได้เก็บเกี่ยวในสวนนี้เมื่อเร็วๆ นี้ — กลับมาในวันที่ [GetCurrentDateWithDiff( GetVarTimeRemaining( THIS.Char.MakeScope, '1045_has_harvested_recently') )]"

 ep3_laamp_decision_event.1045.c: ""...ซอกหลืบที่ซ่อนอยู่มากมาย #EMP [visiting_partner.GetFirstNameNoTooltip]#!...""
 ep3_laamp_decision_event.1045.c.flavor: "ศักดิ์สิทธิ์อย่างแท้จริง"
 ep3_laamp_decision_event.1045.c.cooldown.tt: "ท่านได้ผ่อนคลายในสวนนี้เมื่อเร็วๆ นี้ — กลับมาในวันที่ [GetCurrentDateWithDiff( GetVarTimeRemaining( THIS.Char.MakeScope, '1045_garden_unwinded_recently') )]"

 ep3_laamp_decision_event.1045.d: "$ep3_laamp_decision_event.1021.d$"

 #Physician
 ep3_laamp_decision_event.1047.t: "[visiting_location.GetBaronyNameExplicitlyNoTooltip]: แพทย์"
 ep3_laamp_decision_event.1047.desc_returned_01: "ประตูห้องทำงานของ [laamp_physician_recruit.GetFirstNamePossessive] แง้มอยู่เล็กน้อย และผ่านรอยแยกนั้น ข้าสังเกตเห็น [laamp_physician_recruit.GetFirstNameNoTooltip] กำลังตัดผมให้ลูกค้าที่นั่งนิ่งมาก โดยใช้กรรไกรที่คมและเรียวบางอย่างน่าสะพรึงกลัว\n\nข้าเคาะประตูและเข้าไป ทำให้แพทย์หันมาสนใจข้า: "เจ้าเล่ห์มาก เจ้าต้องการอะไร?""
 ep3_laamp_decision_event.1047.desc_returned_02: "[laamp_physician_recruit.GetFirstName] ยืนอยู่นอกประตู [laamp_physician_recruit.GetHerHis] ตรวจดูไหล่ของ [ROOT.Char.GetWomanMan] คนหนึ่ง ซึ่งดูเหมือนจะเจ็บปวด\n\n[laamp_physician_recruit.GetSheHe|U] สรุปการตรวจ ให้คำแนะนำเกี่ยวกับวิธีรักษาข้อต่อที่ดีที่สุด แล้วหันมาหาข้า: "ท่านกลับมาแล้ว ครั้งนี้ท่านต้องการอะไรหรือ?""
 ep3_laamp_decision_event.1047.desc_returned_03: "ขณะที่ข้าค่อยๆ เดินขึ้นบันไดไปยังห้องทำงานของ [laamp_physician_recruit.GetFirstNamePossessive] ข้ามองผ่านประตูที่เปิดอยู่\n\n[laamp_physician_recruit.GetSheHe|U] ดูเหมือนกำลังง่วนอยู่กับการออกกำลังกายบางรูปแบบและเหงื่อออกมาก ย่อตัวซ้ำๆ ยืนขึ้น แล้วเริ่มใหม่\n\nหลังจากทำซ้ำจำนวนหนึ่ง [laamp_physician_recruit.GetSheHe] ก็หยุด เช็ดหน้าผากของ [laamp_physician_recruit.GetHerHis] และดื่มจากขวดที่อยู่ใกล้ๆ ดวงตาของ [laamp_physician_recruit.GetHerHis|U] ซึ่งตอนนี้คมกริบ จับจ้องมาที่ข้า: "ช่างตื๊อไม่เลิกเลยนะ เจ้า?""
 ep3_laamp_decision_event.1047_desc_intro: "ข้าตาม [laamp_physician_recruit.GetFirstName] ไปตามตรอกซอยที่ลดน้อยลง ขึ้นบันไดบางส่วนและเข้าไปในห้องทำงานของ [laamp_physician_recruit.GetHerHis] ห้องนั้นอัดแน่นตั้งแต่พื้นจรดเพดาน ด้วยชั้นวางที่บรรจุคัมภีร์และภาพพิมพ์ที่เกี่ยวข้องกับธาตุ สุขภาพ และจิตวิญญาณ\n\n[laamp_physician_recruit.GetSheHe|U] นั่งลงบนเก้าอี้ตัวเดียว หลังโต๊ะทำงาน ลูบเครื่องรางเล็กๆ อย่างเหม่อลอย แล้วในที่สุดก็สังเกตเห็นการมีอยู่ของข้า: "
 ep3_laamp_decision_event.1047.desc_reused_physician: "$ep3_laamp_decision_event.1047_desc_intro$"โอ้ ข้าเคยเห็นท่านที่ไหนมาก่อนหรือไม่? ท่านต้องการอะไร?"\n\nข้าชั่งน้ำหนักคำพูดอย่างระมัดระวัง ก่อนจะตอบโต้:"
 ep3_laamp_decision_event.1047.desc: "$ep3_laamp_decision_event.1047_desc_intro$"โอ้ ท่านเอง ท่านต้องการอะไรหรือ?"\n\n"ข้าเห็นการบรรยายของท่านแก่ผู้ด้อยโอกาสเหล่านั้น" ข้าตอบ และลังเลก่อนจะพูดต่อ:"
 ep3_laamp_decision_event.1047.a: ""อยากมาทำงานให้ข้าไหม?""
 ep3_laamp_decision_event.1047.b: ""ช่วยข้าเสริมสร้างจิตวิญญาณของผู้ติดตามของข้า!""
 ep3_laamp_decision_event.1047.c: ""ท่านต้อง #EMP ใช้#! ทักษะของท่าน เพื่อให้เฉียบคมอยู่เสมอ เข้าร่วมค่ายของข้า""
 ep3_laamp_decision_event.1047.c.success: "[laamp_physician_recruit.GetShortUIName] เห็นด้วยกับการประเมินของท่าน"
 ep3_laamp_decision_event.1047.c.failure: "ท่านชักจูง [laamp_physician_recruit.GetShortUIName] ไม่สำเร็จ"
 ep3_laamp_decision_event.1047.c.failure.tt: "[laamp_physician_recruit.GetShortUIName] เริ่มเมินท่าน"
 ep3_laamp_decision_event.1047.d: "$ep3_laamp_decision_event.1021.d$"

 #Option: Visit the local castle grounds
 ep3_laamp_decision_event.1050.t: "[visiting_location.GetBaronyNameExplicitlyNoTooltip]: ปราสาท"
 ep3_laamp_decision_event.1050.desc_returned_01: "ข้ากลับเข้าประตู[visiting_location.GetHolding.GetType.GetName|l]อีกครั้ง ศึกษาลวดลายและสีของธงที่แสดงตราประจำตระกูล [visiting_location.GetTitle.GetHolder.GetHouse.GetName] ขณะทำ เช่นนั้น"
 ep3_laamp_decision_event.1050.desc_returned_02: "ขณะที่เรากลับมาจากจัตุรัสหลักของ [visiting_location.GetTitle.GetNameNoTierPossessiveNoTooltip] สายลมพัด ทำให้ธง [visiting_location.GetTitle.GetHolder.GetHouse.GetNameNoTooltip] ที่สดใสโบกสะบัดเบาๆ บนเชิงเทิน"
 ep3_laamp_decision_event.1050.desc_returned_from_training: "เดินกลับผ่านประตู[visiting_location.GetHolding.GetType.GetName|l]จากลานฝึก ทหารยามที่ประจำการแทบจะไม่เหลือบมองข้าเป็นครั้งที่สองในครั้งนี้"
 ep3_laamp_decision_event.1050.desc_returned_from_garrison: "ออกจากกองรักษาการณ์ ข้าหรี่ตาเมื่อเจอแสงสว่างจ้าทันทีและสูดอากาศบริสุทธิ์เข้าลึกๆ"
 ep3_laamp_decision_event.1050.desc_returned_from_reinforcers: "ยังคงครุ่นคิดถึงทหารที่ขวัญเสีย ข้าเดินเล่นกลับขึ้นไปยังลาน[visiting_location.GetHolding.GetType.GetName|l]อย่างสบายๆ ซึ่งไม่มีอะไรเปลี่ยนแปลงมากนัก"
 ep3_laamp_decision_event.1050.desc_returned_from_bodyguard: "ข้าปล่อยให้ [laamp_bodyguard_recruit.GetFirstName] ระบายความคับข้องใจ [laamp_bodyguard_recruit.GetHerHis] ต่อไปกับซากสัตว์ ขณะที่ข้าเดินฝ่าตรอกซอกซอยที่ลดน้อยลงกลับไปยังบริเวณ [visiting_location.GetHolding.GetType.GetName|l] ได้สำเร็จ"
 ep3_laamp_decision_event.1050.desc: "บริเวณ[visiting_location.GetHolding.GetType.GetName|l]ของ [visiting_location.GetBaronyNameExplicitlyNoTooltip] นั้น ตามที่คาดไว้ ตก แต่งเพื่อวัตถุประสงค์ทางทหาร: ด้วยถังลูกธนู อาวุธด้ามยาวที่วางกระจัดกระจาย คอกม้าที่สวยงาม และอื่นๆ"
 ep3_laamp_decision_event.1050.mid_maa: "\n\nลานฝึกอยู่ด้านนอกประตู กองรักษาการณ์มีทหารยามสองสามคนเดินเตร่ไปมา และตามถนนข้าเห็นกลุ่มนักรบชาว [visiting_location.GetCounty.GetCulture.GetNameNoTooltip] ที่มอซอและขวัญเสียรวมตัวกันอยู่"
 ep3_laamp_decision_event.1050.mid_no_maa: "\n\nลานฝึกอยู่ด้านนอกประตูและทหารยามกองรักษาการณ์สองสามคนกำลังเดินเตร่ไปมาบริเวณทางเข้า บ้างก็หลับครึ่งตื่น บ้างก็ขัดอาวุธ"
 ep3_laamp_decision_event.1050.desc_outro_bodyguard: "\n\nอีกด้านหนึ่งของลาน [laamp_bodyguard_recruit.GetWomanMan] กำลังตะโกนใส่ [laamp_bodyguard_recruit.GetWomenMen] คนอื่นๆ: "...และมันไม่ใช่ความผิดของข้า!" การโต้เถียงรุนแรงขึ้นเรื่อยๆ และข้าจับตามองสถานการณ์อย่างระมัดระวัง"
 ep3_laamp_decision_event.1050.desc_outro_partner: "\n\n[visiting_partner.GetFirstName] มองไปรอบๆ อย่างครุ่นคิด จากนั้นพิจารณาธงที่แข็งแรง ซึ่งแสดงตราประจำตระกูล [visiting_location.GetTitle.GetHolder.GetHouse.GetName] โบกสะบัดเบาๆ ในสายลม"
 ep3_laamp_decision_event.1050.desc_outro: "\n\nข้าเม้มปากและมองไปรอบๆ อย่างครุ่นคิดที่ความโกลาหลที่เป็นระเบียบ ซึ่งประกอบด้วย [visiting_location.GetTitle.GetHolder.Custom('KnightCulturePluralNoTooltipLowercase')] ทหารยาม ทหารอาชีพ และทหาร"
 ep3_laamp_decision_event.1050.desc_outro_return_partner_finished: "$ep3_laamp_decision_event.1040.desc_outro_return_partner_finished$"
 ep3_laamp_decision_event.1050.desc_outro_return_finished: "\n\nหลังจากตรวจสอบรายละเอียดภายในและภายนอกของ[visiting_location.GetHolding.GetType.GetName|l]ของ [visiting_location.GetBaronyNameExplicitlyNoTooltip] อย่างละเอียดแล้ว ข้าก็เสร็จธุระที่นี่และพอใจกับสถานที่แห่งนี้แล้ว\n\nข้ามองหาเส้นทางที่เร็วที่สุดเพื่อกลับไปยังจัตุรัสหลักของ [visiting_location.GetTitle.GetNameNoTierPossessiveNoTooltip]"
 ep3_laamp_decision_event.1050.desc_outro_bodyguard_return: "\n\n[laamp_bodyguard_recruit.GetWomenMen]ที่โกรธแค้นยังคงอยู่ที่ขอบลาน สถานการณ์ตอนนี้ได้รับการดูแลอย่างระมัดระวังโดยทหารยามที่อยู่ใกล้เคียงเพื่อหลีกเลี่ยงการบานปลายที่นองเลือด"
 ep3_laamp_decision_event.1050.desc_outro_return_partner_01: "\n\nข้ารู้สึกถึงการสะกิดเบาๆ ขณะที่ [visiting_partner.GetFirstName] สะกิดข้า กระซิบเกี่ยวกับลักษณะคล้าย[visiting_partner.Custom('GetGenderAlliteratingAnimal')]ที่โชคร้ายของทหารยามคนหนึ่งที่ขอบลาน\n\nข้าขมวดคิ้วอย่างไม่เห็นด้วยกับ [visiting_partner.GetFirstNameNoTooltip] ขณะพิจารณาจุดหมายต่อไปของข้า"
 ep3_laamp_decision_event.1050.desc_outro_return_partner_02: "\n\n[visiting_partner.GetFirstName] สังเกตพ่อค้าเร่ที่กำลังโบกดาบโค้งในอากาศอย่างประณีตเพื่อแสดงให้เห็นถึงความเหนือกว่าของความโค้งอย่างสงสัย\n\nสายตาของข้าเหม่อมองไปตามลาน ครุ่นคิดว่าจะไปที่ไหนต่อ"
 ep3_laamp_decision_event.1050.desc_outro_return_partner_03: "\n\nข้ามองไปทางซ้ายขณะที่ [visiting_partner.GetFirstName] กลั้นหาว ข้าเลิกคิ้วขณะที่ [visiting_partner.GetSheHe] ทำหน้าขอโทษ และสายตาของข้ากลับไปที่ลาน ไตร่ตรองว่าจะทำอะไรต่อไป"
 ep3_laamp_decision_event.1050.desc_outro_return_01: "\n\nในมุมหนึ่งของลาน เด็กกลุ่มหนึ่งถือดาบไม้กำลังเลียนแบบสิ่งที่ดูเหมือนเป็นการฝึกซ้อมของ [visiting_location.GetTitle.GetHolder.Custom('KnightCulturePluralNoTooltipLowercase')] ด้วยความแม่นยำอย่างน่าขนลุก\n\nข้าจับตาดูพวกเขาอย่างระมัดระวังขณะพิจารณาจุดหมายต่อไปของข้า"
 ep3_laamp_decision_event.1050.desc_outro_return_02: "\n\nขบวนแห่ที่บรรทุกด้วยม้าเพิ่งออกจากประตู ดูเหมือนจะเป็นของขุนนางท้องถิ่น[ROOT.Char.GetWomanMan] และข้าพิจารณาภาพอันน่าตื่นตานี้ขณะครุ่นคิดว่าจะไปที่ไหนต่อ"
 ep3_laamp_decision_event.1050.desc_outro_return_03: "\n\nที่ทางเข้าลานและ[visiting_location.GetHolding.GetType.GetName|l] ทหารยามกำลังปรากฏตัวขึ้น แทนที่คนเก่าทันเวลาเปลี่ยนเวรยาม ข้าสังเกตการสับเปลี่ยนอย่างไม่ใส่ใจขณะไตร่ตรองว่าจะทำอะไรต่อไป"

