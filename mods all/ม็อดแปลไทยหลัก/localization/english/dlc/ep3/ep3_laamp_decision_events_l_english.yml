 ep3_laamp_decision_event.1050.c.cooldown_province.tt: "ท่านได้เสริมกำลัง [men_at_arms|E] ใน [visiting_location.GetBaronyNameExplicitly] ในช่วง 90 วันที่ผ่านมา"

 ep3_laamp_decision_event.1050.d: "ข้าสงสัยว่าพวกเขากำลังเถียงอะไรกัน?"
