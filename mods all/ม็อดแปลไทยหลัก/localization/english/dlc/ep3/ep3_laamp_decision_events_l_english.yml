 #Storyteller
 ep3_laamp_decision_event.1031.return.tt: "ท่านกลับไปยังทางเข้า [THIS.Char.Custom('GetTavernDwelling')]"
 ep3_laamp_decision_event.1031.t: "[visiting_location.GetBaronyNameExplicitlyNoTooltip]: นักเล่าเรื่อง"
 ep3_laamp_decision_event.1031.desc_01: "#EMP "...และด้วยความปรารถนาที่จะกำจัดการทุบตีที่ไม่หยุดหย่อน ศีรษะของซุสก็แตกออกเป็นสองส่วน และอธีนาก็ผุดออกมา เทพธิดาผู้ฉลาดที่สุด"#! "
 ep3_laamp_decision_event.1031.desc_02: "#EMP "...แล้วฮอรัสกับเซตก็กลายเป็นศัตรูคู่อาฆาต แย่งชิงบัลลังก์ที่ว่างเปล่า"#! "
 ep3_laamp_decision_event.1031.desc_03: "#EMP "...และตั้งแต่วันนั้น รูฮาก็ถูกเนรเทศออกจากโลกแห่งแสงสว่างและถูกเนรเทศไปยังโลกแห่งความมืด"#! "
 ep3_laamp_decision_event.1031.desc_04: "#EMP "...แล้วเลวีอาธานผู้ยิ่งใหญ่ก็ทำลายโลกเป็นครั้งที่ห้า ตายในกระบวนการนั้น แต่จากร่างของนางก็ผุดขึ้นมาเป็นแผ่นดิน พืช และสัตว์ใหม่"#! "
 ep3_laamp_decision_event.1031.desc_05: "#EMP "...แล้วเขาก็กลายเป็นอาตัวแห่งป่าไม้ ตังกาโรอาสืบทอดทะเล รูอาอูโมโกแผ่นดินที่สั่นสะเทือน และทาวีรีมาเตอาลมที่แปลกประหลาด"#! "
 ep3_laamp_decision_event.1031.desc_06: "#EMP "...แล้วไข่ก็ตกลงมา; ส่วนต่างๆ ของมันก่อตัวเป็นจักรวาล — ไข่แดงกลายเป็นดวงอาทิตย์ที่อบอุ่น และไข่ขาวกลายเป็นดวงจันทร์ที่สวยงาม"#! "
 ep3_laamp_decision_event.1031.desc_07: "#EMP "...แล้วคูตาร์ก็ปั่นด้ายสีทองเป็นเสื้อคลุมอันงดงาม; กว้างเท่าท้องฟ้ายามค่ำคืนและยาวนานชั่วนิรันดร์"#! "
 ep3_laamp_decision_event.1031.desc_08: "#EMP "...แล้ว เมื่อนางตระหนักว่าเป็นพี่ชายของนางเอง คุลเลอร์โว ผู้ซึ่งล่อลวงนาง นางก็ตกลงมาจากหน้าผาและเข้าสู่ชีวิตหลังความตาย"#! "
 ep3_laamp_decision_event.1031.desc_09: "#EMP "...แล้วฟินน์ ในความโกรธของเขา ก็กลายเป็นหิน ความฝันในการทำลายล้างของเขาไม่เคยเป็นจริง และดังนั้น มหาวิหารจึงยังคงตั้งอยู่จนถึงทุกวันนี้"#! "
 ep3_laamp_decision_event.1031.desc_10: "#EMP "...และแม้จะมีคำเตือนของคางส์ มนุษย์ก็ก่อไฟในความมืดที่เพิ่มขึ้น และสัตว์ต่างๆ ก็หนีไปยังเนินเขา"#! "
 ep3_laamp_decision_event.1031.desc_11: "#EMP "...แล้วดินเหนียวที่นวดแล้วก็ถูกคลุมด้วยผิวหนัง เติมเลือด และโทเรตั้งชื่อเขาว่าบาตซี"#! "
 ep3_laamp_decision_event.1031.desc_12: "#EMP "...แล้วค่ายที่เต็มไปด้วยผู้หญิงก็ได้รับชัยชนะเหนือค่ายที่เต็มไปด้วยผู้ชาย ทำให้พวกเขาสามารถ #EMP มีส่วนร่วม#! ซึ่งกันและกันได้อีกครั้ง"#! "
 ep3_laamp_decision_event.1031.desc_13: "#EMP "...และพวกเขาเรียกนางว่าเทอร์เยล สิงโตตัวแรก"#! "
 ep3_laamp_decision_event.1031.desc_14: "#EMP "...และโสมะก็ถูกมอบให้กับเทพเจ้า แต่สี่หยดก็หกลงบนโลก และจากหยดเหล่านี้ก็ผุดขึ้นมาเป็นเมืองศักดิ์สิทธิ์"#! "
 ep3_laamp_decision_event.1031.desc_15: "#EMP "...และด้วยการกลืนครั้งใหญ่ครั้งเดียว คูเลเบรก็กลืนวัวของเขาเข้าไปทั้งตัว ทั้งกีบและทั้งหมด"#! "
 ep3_laamp_decision_event.1031.desc_16: "#EMP "...แล้วโทราโนสก็ได้รับเครื่องสังเวย; เลือดไหลลงมาตามลำตัวของเขา ทำให้เขามีกำลังวังชา จึงสร้างฤดูใบไม้ผลิใหม่ขึ้นมา"#! "
 ep3_laamp_decision_event.1031.desc_17: "#EMP "...แล้วเจลวาร์ก็มาถึงเกาะ นำไฟมาด้วย ซึ่งทำให้เกาะหยุดจมลงในคลื่นทุกเย็น"#! "
 ep3_laamp_decision_event.1031.desc_18: "#EMP "...แล้วฝนก็ตกลงมาในแอฟริกา ท่ามกลางการร้องเพลง การเต้นรำ และความยินดีอย่างมาก"#! "
 ep3_laamp_decision_event.1031.desc_19: "#EMP "...และเมื่อพระองค์เสด็จกลับไปยังชายหาดในยามเช้า พระราชาก็ทรงพบว่าเหล่าอัญมณีล้ำค่าได้เคลื่อนตัวมาล้อมรอบมารดาแห่งขุมทรัพย์ด้วยตัวของมันเอง"#!"
 ep3_laamp_decision_event.1031.desc_outro: "\n\n"แต่เรื่องราวนั้นไว้เล่าคราวหน้า" นักเล่าเรื่องส่งยิ้มลึกลับให้ข้าพเจ้า เอนหลังพิงที่นั่งข้างเตาผิงของ [laamp_storyteller.GetHerHis] และจิบ [laamp_storyteller.Custom('RegionalDrink')] อีกครั้ง"
 ep3_laamp_decision_event.1031.a: "เรื่องราวนั้นมีประเด็นที่ดีอยู่บ้าง"
 ep3_laamp_decision_event.1031.a_zealous: "...ข้าเดาว่ามันมีประเด็นที่เกี่ยวข้องอยู่หนึ่งหรือสองประเด็น"
 ep3_laamp_decision_event.1031.a_eccentric: "เห็นไหม ตอนนี้มันสมเหตุสมผลอย่างสมบูรณ์แบบ!"
 ep3_laamp_decision_event.1031.a_success.t: "ทักษะผ่านศีลธรรม"
 ep3_laamp_decision_event.1031.a_success.desc: "ท่านเรียนรู้บางอย่างจากคติธรรมของเรื่องราว"
 ep3_laamp_decision_event.1031.a_semi_success.t: "โอกาสในการเติบโต"
 ep3_laamp_decision_event.1031.a_semi_success.desc: "บางส่วนของเรื่องราวสามารถนำไปใช้กับสถานการณ์ของท่านได้"
 ep3_laamp_decision_event.1031.a_failure.t: "เรื่องราวที่ดี"
 ep3_laamp_decision_event.1031.a_failure.desc: "อย่างน้อยมันก็เป็นเรื่องราวที่น่าตื่นเต้น"
 ep3_laamp_decision_event.1031.a.cooldown.tt: "ท่านครุ่นคิดถึงเรื่องราวเมื่อเร็วๆ นี้ — กลับมาในวันที่ [GetCurrentDateWithDiff( GetVarTimeRemaining( THIS.Char.MakeScope, '1031_has_storied_recently') )]"
 ep3_laamp_decision_event.1031.b: ""[laamp_storyteller.GetFirstNameNoTooltip] ท่านเล่าเรื่องได้ดีขนาดนี้ได้อย่างไร?""
 ep3_laamp_decision_event.1031.b_reveler: "ข้ารู้เรื่องนี้!"
 ep3_laamp_decision_event.1031.b.cooldown.tt: "ท่านเพลิดเพลินกับเรื่องราวเมื่อเร็วๆ นี้ — กลับมาในวันที่ [GetCurrentDateWithDiff( GetVarTimeRemaining( THIS.Char.MakeScope, '1031_has_reveled_recently') )]"
 ep3_laamp_decision_event.1031.c: ""นั่นเป็นเรื่องราวที่ยอดเยี่ยม สหาย!""
 ep3_laamp_decision_event.1031.c_zealous: "บาห์ เรื่องไร้สาระที่ดูหมิ่นศาสนา เช่นนี้"
 ep3_laamp_decision_event.1031.c.cooldown.tt: "ท่านเพลิดเพลินกับเรื่องราวเมื่อเร็วๆ นี้ — กลับมาในวันที่ [GetCurrentDateWithDiff( GetVarTimeRemaining( THIS.Char.MakeScope, '1031_has_relaxed_recently') )]"
 ep3_laamp_decision_event.1031.d: "$ep3_laamp_decision_event.1021.d$"

 #Recruitment
 ep3_laamp_decision_event.1033.t: "[visiting_location.GetBaronyNameExplicitlyNoTooltip]: ผู้สมัคร"
 ep3_laamp_decision_event.1033.desc_returned_01: "ขณะที่ข้าพเจ้ากลับไปหาผู้สมัครที่มีศักยภาพ [laamp_first_recruit.GetFirstName], [laamp_second_recruit.GetFirstName] และ [laamp_third_recruit.GetFirstName] มองหน้ากันอย่างสงสัย$ep3_laamp_decision_event.1033.desc_returned_outro_01$"
 ep3_laamp_decision_event.1033.desc_returned_jane_01: "ขณะที่ข้าพเจ้ากลับไปหาผู้สมัครที่มีศักยภาพ [laamp_first_recruit.GetFirstName] และ [laamp_second_recruit.GetFirstName] กำลังพูดคุยเล็กน้อยกันอย่างเงียบๆ"
 ep3_laamp_decision_event.1033.desc_returned_outro_01: "\n\nเมื่อพวกเขาสังเกตเห็นข้าพเจ้า พวกเขาก็กระปรี้กระเปร่าขึ้นพร้อมกันและจ้องมองข้าพเจ้าอย่างคาดหวัง"
 ep3_laamp_decision_event.1033.desc_returned_02: "กลับไปหาผู้สมัคร ทั้งสามคนประกอบด้วย [laamp_first_recruit.GetFirstName], [laamp_second_recruit.GetFirstName] และ [laamp_third_recruit.GetFirstName] ดูเหมือนเพิ่งจะยุติการทะเลาะวิวาท$ep3_laamp_decision_event.1033.desc_returned_outro_02$"
 ep3_laamp_decision_event.1033.desc_returned_jane_02: "กลับไปหาผู้สมัคร ทั้งสองคนคือ [laamp_first_recruit.GetFirstName] และ [laamp_second_recruit.GetFirstName] เพิ่งเล่นเกมลูกเต๋าเสร็จสิ้นด้วยผลลัพธ์ที่เป็นที่โต้แย้ง"
 ep3_laamp_decision_event.1033.desc_returned_outro_02: "\n\nความตึงเครียดในอากาศเปลี่ยนไปเล็กน้อยเมื่อข้าพเจ้าเข้าใกล้ กลายเป็นความคาดหวังอย่างระมัดระวัง"
 ep3_laamp_decision_event.1033.desc: "เข้าใกล้กลุ่มชาว [visiting_location.GetCounty.GetCulture.GetCollectiveNounNoTooltip] ที่ว่างงาน ข้าพเจ้าเปล่งเสียงและพูดกับพวกเขาโดยตรง: "ข้ากำลังมองหาคนที่มีทักษะและน่าเชื่อถือมาร่วมค่ายของข้า! ใครในหมู่พวกท่านพร้อมสำหรับงานนั้นบ้าง?""
 ep3_laamp_decision_event.1033.desc_mid_two: "\n\nผู้ที่สนใจแนะนำตัวเองว่า [laamp_first_recruit.GetFirstName] ผู้ [laamp_first_recruit.Custom('PersonalityGetNegativeTraitDesc')] และ [laamp_second_recruit.GetFirstName] ผู้ [laamp_second_recruit.Custom('PersonalityGetNegativeTraitDesc')]"
 ep3_laamp_decision_event.1033.desc_mid_three: "\n\nผู้ที่สนใจแนะนำตัวเองว่า [laamp_first_recruit.GetFirstName] ผู้ [laamp_first_recruit.Custom('PersonalityGetNegativeTraitDesc')|U], [laamp_second_recruit.GetFirstName] ผู้ [laamp_second_recruit.Custom('PersonalityGetNegativeTraitDesc')|U] และ [laamp_third_recruit.GetFirstName] ผู้ [laamp_third_recruit.Custom('PersonalityGetNegativeTraitDesc')|U]"
 ep3_laamp_decision_event.1033.desc_outro: "\n\nข้าพเจ้ามองผู้สมัครขึ้นลง พยายามตัดสินใจว่าจะรับสมัครใคร"
 ep3_laamp_decision_event.1033.desc_partner_outro: "\n\n[visiting_partner.GetFirstName] ฮัมเพลงและมองผู้ที่มีแนวโน้มขณะที่ข้าพเจ้าพิจารณาว่าจะรับสมัครผู้สมัครคนใด"
 ep3_laamp_decision_event.1033.desc_jane_outro: "\n\nขณะที่ข้าพเจ้าแนะนำตัวเสร็จ [laamp_generic_jane.GetWomanMan] ที่หยาบคายคนหนึ่งก็เดินเข้ามาหาข้าพเจ้าทันที: "ข้าชื่อ [laamp_generic_jane.GetFirstName] ด้วยเหตุผลส่วนตัว ข้าต้องการเข้าร่วมค่ายของท่าน""
 ep3_laamp_decision_event.1033.desc_returned_jane_outro: "\n\n[laamp_generic_jane.GetFirstNameNoTooltip] ยังคงยืนอยู่ที่มุมหนึ่ง สบตาข้าพเจ้าขณะที่ข้าพเจ้าประเมินผู้สมัคร"

 ep3_laamp_decision_event.1033.a: ""มาทำงานให้ข้าเป็นไง [laamp_first_recruit.GetFirstNameNoTooltip]?""
 ep3_laamp_decision_event.1033.b: "[laamp_second_recruit.GetFirstNameNoTooltip] ดูเป็นตัวอย่างที่ดี"
 ep3_laamp_decision_event.1033.c: "ข้าเห็นศักยภาพในตัว [laamp_third_recruit.GetFirstNameNoTooltip] เท่านั้น"

 ep3_laamp_decision_event.1033.d: ""...[laamp_generic_jane.GetFirstNameNoTooltip] ใช่ไหม? มาร่วมกับข้า""
 ep3_laamp_decision_event.1033.d.cooldown.tt: "ท่านรับสมัคร [follower|E] ฟรีเมื่อเร็วๆ นี้ - กลับมาในวันที่ [GetCurrentDateWithDiff( GetVarTimeRemaining( THIS.Char.MakeScope, '1033_generic_jane_cooldown') )]"

 ep3_laamp_decision_event.1033.e: "$ep3_laamp_decision_event.1021.d$"

 #Spouse Material
 ep3_laamp_decision_event.1035.t: "[visiting_location.GetBaronyNameExplicitlyNoTooltip]: คู่ครองที่มีศักยภาพ"
 ep3_laamp_decision_event.1035.desc_returned_01: "ข้าพเจ้ากลับไปที่โต๊ะของ [laamp_spouse_material.GetFirstNamePossessive] และเลือดก็เริ่มสูบฉีดในหูของข้าพเจ้าทันที\n\nใจเย็น. #EMP ชวนคุย.#!\n\n[laamp_spouse_material.GetFirstNameNoTooltip] กำลังยุ่งอยู่กับการสนทนากับ [laamp_spouse_material.Custom('WomanManOpposite')] ที่อยู่ใกล้เคียงขณะที่ข้าพเจ้าเข้าใกล้ [laamp_spouse_material.GetHerHim] และดวงตาของ [laamp_spouse_material.GetHerHis] ก็หรี่ลงด้วยความคาดหวัง:"
 ep3_laamp_decision_event.1035.desc_returned_02: "เมื่อข้าพเจ้าเดินทางกลับไปที่โต๊ะของ [laamp_spouse_material.GetHerHis] [laamp_spouse_material.GetFirstName] เพิ่งได้รับอาหารจานร้อนๆ ซึ่งกลิ่นของมัน ทำให้ท้องของข้าพเจ้าร้องครวญคราง\n\n[laamp_spouse_material.GetSheHe|U] จับจ้องสายตาไปที่ [visiting_location.GetCounty.GetTitle.GetHolder.Custom('GetLocalStreetFood')] ที่อยู่ตรงหน้า [laamp_spouse_material.GetHerHim] ขณะที่ [laamp_spouse_material.GetSheHe] พูดอย่างเย็นชาว่า: "ท่านต้องการ #EMP อะไร#! จริงๆ หรือเปล่าคราวนี้?"\n\nข้าพเจ้าลังเลกับคำทักทายที่เสียดสี และพิจารณาคำตอบของข้าพเจ้าอย่างรอบคอบ:"
 ep3_laamp_decision_event.1035.desc_reused_spouse: "ข้าพเจ้าเดินทอดน่องไปหา [laamp_spouse_material.GetFirstName] ซึ่งสดใส เช่นเคย เงยหน้าขึ้นเมื่อข้าพเจ้าเข้าใกล้\n\n[laamp_spouse_material.GetSheHe|U] ดูเหมือนจะพยายามนึกถึงข้าพเจ้าชั่วครู่ — จากนั้น ดวงตาของ [laamp_spouse_material.GetHerHis] ก็หรี่ลงด้วยความจำได้\n\n#EMP ไม่ใช่เรื่องส่วนตัว#! ข้าพเจ้าบอกตัวเอง และข้าพเจ้ายิ้มเล็กน้อยขณะเพิกเฉยต่อความรู้สึกไม่สบายใจในอก:"
 ep3_laamp_decision_event.1035.desc: "ข้าพเจ้ากำลังสังเกต [laamp_spouse_material.Custom('RaunchyComplimentNoun')] ที่นั่งลง [laamp_spouse_material.GetHerselfHimself] ที่โต๊ะใกล้ๆ อย่างตั้งใจ เจ้าของ [ROOT.Char.Custom('GetTavernDwelling')] เรียก [laamp_spouse_material.GetHerHim] ว่า [laamp_spouse_material.GetFirstName] ใช่ไหม [laamp_spouse_material.Custom('GetSheHeOpposite')]?\n\n[laamp_spouse_material.GetSheHe|U] ดูงุนงงเมื่อข้าพเจ้าเข้าใกล้ [laamp_spouse_material.GetHerHim] อาจเป็น เพราะความสับสนภายในของข้าพเจ้าปรากฏชัดเจนบนใบหน้าของข้าพเจ้า ทำไมเรื่องนี้ถึงรบกวนข้าพเจ้า? #EMP ข้าคือ [ROOT.Char.GetNameNoTooltip] บ้าเอ๊ย!#!\n\nข้าพเจ้าคอยเตือนตัวเองถึงความสำเร็จล่าสุดเพื่อรักษาความสงบ ข้าพเจ้าล้มเหลวเป็นส่วนใหญ่"
 ep3_laamp_decision_event.1035.a: ""ข้าเลี้ยง [laamp_spouse_material.Custom('RegionalDrink')] ให้ท่านอีกแก้วเป็นไง?"
 ep3_laamp_decision_event.1035.b_first: ""นอกจาก #EMP ขโมยหัวใจ#! แล้ว ท่านทำอะไรอีกบ้าง?""
 ep3_laamp_decision_event.1035.b_second: ""ท่านมีชื่อไหม? หรือข้าเรียกท่านว่า #EMP ของข้า#! ได้ไหม?""
 ep3_laamp_decision_event.1035.b_third: ""ท่านมีแผนที่ไหม? ข้าเพิ่ง #EMP หลงทาง#! ในดวงตาของท่าน""
 ep3_laamp_decision_event.1035.b_fourth: ""ท่านตกปลาไหม? เพราะท่าน ทำให้ #EMP ข้า#! ติดเบ็ด""
 ep3_laamp_decision_event.1035.b_fifth: ""ถ้าท่านให้ข้ายืมจูบ ข้า #EMP สัญญา#! ว่าจะคืนให้ทันที""
 ep3_laamp_decision_event.1035.b_fallback: ""[laamp_spouse_material.Custom('GirlBoy')] อย่างท่านมาทำอะไรในที่แบบนี้?"
 ep3_laamp_decision_event.1035.b.success: "[laamp_spouse_material.GetShortUIName] หลงเสน่ห์คำพูดของท่าน"
 ep3_laamp_decision_event.1035.b.failure: "ท่านล้มเหลวในการดึงดูด [laamp_spouse_material.GetShortUIName]"
 ep3_laamp_decision_event.1035.b.failure.tt: "[laamp_spouse_material.GetShortUIName] เริ่มเมินท่าน"
 ep3_laamp_decision_event.1035.b.cooldown.tt: "ท่านพยายามดึงดูด [spouse|E] ที่มีศักยภาพเมื่อเร็วๆ นี้ — ลองอีกครั้งในวันที่ [GetCurrentDateWithDiff( GetVarTimeRemaining( THIS.Char.MakeScope, '1035_spouse_duelled_recently') )]"
 ep3_laamp_decision_event.1035.c: ""...ทำไมเราไม่ไปที่ที่ #EMP สบายกว่านี้#!...""
 ep3_laamp_decision_event.1035.c.cooldown.tt: "ท่านผ่อนคลายที่ [ROOT.Char.Custom('GetTavernDwelling')] เมื่อเร็วๆ นี้ — กลับมาอีกครั้งในวันที่ [GetCurrentDateWithDiff( GetVarTimeRemaining( THIS.Char.MakeScope, '1035_spouse_unwinded_recently') )]"
 ep3_laamp_decision_event.1035.d: "$ep3_laamp_decision_event.1021.d$"

 #Hooded Figure
 ep3_laamp_decision_event.1037.t_noble: "[visiting_location.GetBaronyNameExplicitlyNoTooltip]: [laamp_hooded_figure.GetFirstNameNoTooltip] กำลังเดือดร้อน!"
 ep3_laamp_decision_event.1037.t: "[visiting_location.GetBaronyNameExplicitlyNoTooltip]: [laamp_hooded_figure.GetWomanMan|U] ที่เป็นที่ต้องการตัว"
 ep3_laamp_decision_event.1037.desc_noble_returned_01: "ข้ากลับไปหา [laamp_hooded_figure.GetFirstName] ซึ่งยังคงเผชิญหน้าอย่างดุเดือดกับอันธพาลท้องถิ่น\n\nสายตาของพวกเขาสบประสานกัน การคุมเชิงดำเนินไปอย่างสมบูรณ์ มีเพียงอันธพาลชาว [visiting_location.GetCounty.GetCulture.GetNameNoTooltip] ที่เหลือบมองประตูเป็นครั้งคราว ราวกับกำลังรออะไรบางอย่าง หรือ #EMP ใครบางคน#!.\n\nข้ารู้สึกได้ถึงเหงื่อที่ไหลซึมลงมาตามแผ่นหลัง"
 ep3_laamp_decision_event.1037.desc_noble_returned_02: "กลับมาที่โต๊ะของ [laamp_hooded_figure.GetFirstNamePossessive] ความตึงเครียดยังคงไม่เปลี่ยนแปลง และอันธพาลชาว [visiting_location.GetCounty.GetCulture.GetNameNoTooltip] ก็ยังคงรอการชำระเงินจาก [ROOT.Char.GetHerHis]\n\n[laamp_hooded_figure.GetTitleAsNameNoTooltip] #EMP ปฏิเสธ#! ที่จะจ่าย และผู้คนที่เดินผ่านไปมาเป็นครั้งคราวก็ชะลอฝีเท้าลง เพียงเพื่อจะเร่งฝีเท้าขึ้นเมื่อตระหนักว่ากำลังจะเกิดอะไรขึ้น\n\nสายตาของข้าสอดส่ายไปมาระหว่างคนทั้งสองอย่างกระสับกระส่าย"

 ep3_laamp_decision_event.1037.desc_returned_01_intro: "กลับมาที่ห้องใต้ดิน [laamp_hooded_figure.GetFirstName] กำลังง่วนอยู่กับการดูแผนที่ แผ่นกระดานพื้นส่งเสียงเอี๊ยดอ๊าด"
 ep3_laamp_decision_event.1037.desc_nomad_returned_01_intro: "ในกระโจมอีกหลัง [laamp_hooded_figure.GetFirstName] กำลังง่วนอยู่กับการดูแผนที่ ข้าเผลอไปชนเข้ากับ [laamp_hooded_figure.Custom('GetSmallHidingObject')]"
 ep3_laamp_decision_event.1037.desc_returned_01_outro: "และ [laamp_hooded_figure.GetSheHe] ก็หันศีรษะ [laamp_hooded_figure.GetHerHis] กลับมามองข้าแทน\n\n"ท่านกลับมาแล้ว" [laamp_hooded_figure.GetSheHe] เอ่ย ขณะที่ [laamp_hooded_figure.GetSheHe] ค่อยๆ ปิดแผนที่ที่แสดงภาพที่ดินใกล้เคียงของ [1037_neighboring_holding.GetBaronyNameExplicitly]: "ท่านต้องการอะไรหรือ?"\n\n[laamp_hooded_figure.GetSheHe|U] ยืนขึ้น กอดอก [laamp_hooded_figure.GetHerHis] และยืนพักขาข้างหนึ่งอย่างมีเลศนัย"
 ep3_laamp_decision_event.1037.desc_returned_01: "$ep3_laamp_decision_event.1037.desc_returned_01_intro$ $ep3_laamp_decision_event.1037.desc_returned_01_outro$"
 ep3_laamp_decision_event.1037.desc_nomad_returned_01: "$ep3_laamp_decision_event.1037.desc_nomad_returned_01_intro$ $ep3_laamp_decision_event.1037.desc_returned_01_outro$"

 ep3_laamp_decision_event.1037.desc_returned_02: "ข้ามองลงไปในห้องใต้ดินก่อนจะก้าวลงบันไดไปอีกครั้ง $ep3_laamp_decision_event.1037.desc_returned_02_outro$"
 ep3_laamp_decision_event.1037.desc_nomad_returned_02: "ข้าเปิดผ้าใบกระโจมและมองเข้าไปข้างในก่อนจะก้าวเข้าไป: $ep3_laamp_decision_event.1037.desc_returned_02_outro$"
 ep3_laamp_decision_event.1037.desc_returned_02_outro: "ข้ามองลงไปในห้องใต้ดินก่อนจะลงบันไดไปอีกครั้ง [laamp_hooded_figure.GetFirstName] เจ้าคนพาล นั่งเอนหลังอยู่บนเก้าอี้ [laamp_hooded_figure.GetHerHis] โดยสายตา [laamp_hooded_figure.GetHerHis] จับจ้องอยู่ที่ [ROOT.Char.Custom('GetCeilingCanopy')]\n\n[laamp_hooded_figure.GetSheHe|U] โยนเหรียญ [visiting_location.GetCounty.GetCulture.GetNameNoTooltip] ขึ้นไปในอากาศอย่างสบายๆ พลิกมัน แล้วจับไว้ด้วยมือที่มั่นคง\n\nข้ากระแอม และ [laamp_hooded_figure.GetFirstNameNoTooltip] ก็หลับตา [laamp_hooded_figure.GetHerHis] ลงขณะที่ [laamp_hooded_figure.GetSheHe] เก็บเหรียญไป พลางประสานมือ [laamp_hooded_figure.GetHerHis] ไว้หลังศีรษะ [laamp_hooded_figure.GetHerHis] ขณะที่ [laamp_hooded_figure.GetSheHe] คำราม: "ว่าไง?""

 ep3_laamp_decision_event.1037.desc_returned_03: "เมื่อกลับไปที่ห้องใต้ดิน ประตูก็ปิดอยู่ ข้าค่อยๆ เปิดมันออกและลงบันไดไป\n\nลึกเข้าไปอีกหน่อย [laamp_hooded_figure.GetFirstName] กำลังถูพื้นจากสิ่งที่ดูเหมือน... #EMP เลือด#!? แน่นอนว่าเป็นเลือด #EMP สัตว์#!...\n\n[laamp_hooded_figure.GetSheHe|U] หักข้อนิ้ว [laamp_hooded_figure.GetHerHis] ขณะที่ [laamp_hooded_figure.GetSheHe] เก็บถังไปและหันความสนใจ [laamp_hooded_figure.GetHerHis] มาทางข้า: "ตื๊อไม่เลิกเลยนะ?""
 ep3_laamp_decision_event.1037.desc_nomad_returned_03: "ขณะยืนอยู่หน้ากระโจมของไอ้คนพาล [laamp_hooded_figure.GetFirstNamePossessive] ข้าได้ยินเสียงเหมือนการดิ้นรนดังมาจากข้างใน แล้วมันก็เงียบไปทันที\n\nข้าค่อยๆ ชะโงกศีรษะเข้าไปในกระโจม และเห็น [laamp_hooded_figure.GetHerHim] ในความมืด กำลังเช็ดมีดที่เปื้อนสารสีคล้ำ เลือด... รึ?\n\n[laamp_hooded_figure.GetSheHe|U] หันมาทางข้าอย่างไม่แยแส: "แค่ #EMP หนู#! แต่ #EMP เจ้า#! นี่สิ เป็นคนตื๊อไม่เลิกเลยนะ?""

 ep3_laamp_decision_event.1037.desc_intro: "ร่างคลุมหน้าค่อยๆ แทรกตัวผ่านโรงเตี๊ยมและลงบันไดไปยังห้องใต้ดิน ข้ามองไปรอบๆ อย่างระมัดระวัง ขณะตาม [laamp_hooded_figure.GetHerHim] ลงไปชั้นล่าง\n\nที่ด้านล่าง [laamp_hooded_figure.GetSheHe] นั่งลงบนเก้าอี้หน้าโต๊ะทำงานและปล่อยผ้าคลุมหน้าลง"
 ep3_laamp_decision_event.1037.desc_nomad_intro: "ร่างคลุมหน้าค่อยๆ แทรกตัวผ่านที่พักและออกไปอีกทาง ข้ามองไปรอบๆ อย่างระมัดระวัง ขณะตาม [laamp_hooded_figure.GetHerHim] ออกไปข้างนอกและเข้าไปในกระโจมที่อยู่ติดกัน\n\nข้างใน [laamp_hooded_figure.GetSheHe] นั่งลงบนเก้าอี้หน้าโต๊ะทำงานและปล่อยผ้าคลุมหน้าลง"
 ep3_laamp_decision_event.1037.desc_reused_thief_outro: "\n\nข้าจำ [laamp_hooded_figure.GetFirstName] ได้ขณะที่ [laamp_hooded_figure.GetSheHe] ทุบกำปั้น [laamp_hooded_figure.GetHerHis] ลงบนโต๊ะอย่างตื่นเต้น: "ให้ตายสิ! ข้าไม่คิดว่าจะได้เจอ #EMP ท่าน#! อีก — อย่างน้อยก็ไม่ใช่ในชาตินี้ ข้าจะช่วยอะไรท่านได้บ้าง?""
 ep3_laamp_decision_event.1037.desc_reused_thief: "$ep3_laamp_decision_event.1037.desc_intro$.$ep3_laamp_decision_event.1037.desc_reused_thief_outro$"
 ep3_laamp_decision_event.1037.desc_nomad_reused_thief: "$ep3_laamp_decision_event.1037.desc_nomad_intro$.$ep3_laamp_decision_event.1037.desc_reused_thief_outro$"

 ep3_laamp_decision_event.1037.desc_noble: "...แล้วก็มีภาษี #EMP ที่นั่ง#! อีกนะ" อันธพาลชาว [visiting_location.GetCounty.GetCulture.GetNameNoTooltip] เอ่ยขึ้นพร้อมรอยยิ้มเย้ยหยัน ขณะที่ [ROOT.Char.GetSheHe] ชี้ไปที่เก้าอี้ของร่างคลุมหน้า "นั่นต้องจ่ายเพิ่มอีกหน่อยแน่ๆ"\n\n[laamp_hooded_figure.GetWomanMan] คลุมหน้าลุกขึ้นยืนทันที และเมื่อผ้าคลุมหน้าหลุดลง ข้าก็จำ [laamp_hooded_figure.GetHerHim] ได้ว่าเป็นใครอื่นไม่ได้นอกจาก [laamp_hooded_figure.GetName]: "นี่มันหยามกันชัดๆ!" [laamp_hooded_figure.GetTitleAsNameNoTooltip] อุทานออกมาอย่างหัวเสียเห็นได้ชัด\n\n"อย่าให้ข้าต้องไปสอบถามกับ #EMP หุ้นส่วนธุรกิจ#! ของข้านะ!" อันธพาลข่มขู่ และสถานการณ์ก็ตึงเครียดขึ้นเรื่อยๆ"
 ep3_laamp_decision_event.1037.desc: "$ep3_laamp_decision_event.1037.desc_intro$$ep3_laamp_decision_event.1037.desc_outro$"
 ep3_laamp_decision_event.1037.desc_nomad: "$ep3_laamp_decision_event.1037.desc_nomad_intro$$ep3_laamp_decision_event.1037.desc_outro$"
 ep3_laamp_decision_event.1037.desc_outro: ": “ข้าว่าท่านคงรู้จักข้าจากชื่อเสียงของข้าสินะ?” #EMP 'ไอ้อาชญากร [laamp_hooded_figure.Custom2('CriminalAdjective', ROOT.Char)] และ [laamp_hooded_figure.Custom2('CriminalCrierInsult', ROOT.Char)] [laamp_hooded_figure.GetFirstNameNoTooltip]!'#!”\n\n“...ข้าเคย #EMP สั่งสอน#! คนที่ดูหมิ่นข้าน้อยกว่านี้มานักต่อนักแล้ว ทีนี้ท่านต้องการอะไร?” สายตาของ [laamp_hooded_figure.GetFirstNamePossessive] จับจ้องมาที่ข้า ขณะที่ [laamp_hooded_figure.GetSheHe] เลิกคิ้วอย่างสงสัย"

 ep3_laamp_decision_event.1037.a: ""ข้าจะจ่ายค่าใช้จ่ายของ [laamp_hooded_figure.GetHerHis] เอง""
 ep3_laamp_decision_event.1037.a.flavor: "ข้ามั่นใจว่านี่จะเป็นประโยชน์"
 ep3_laamp_decision_event.1037.b_diplomacy: ""แน่นอนว่าเจ้าจะได้ทองมากขึ้นจากลูกค้าที่ #EMP กลับมาใช้บริการ#! ใช่หรือไม่?""
 ep3_laamp_decision_event.1037.b_stewardship: ""ข้าเกรงว่านั่นไม่ใช่ภาษีที่นั่ง #EMP ปัจจุบัน#!""
 ep3_laamp_decision_event.1037.b_intrigue: ""องครักษ์ของ [laamp_hooded_figure.GetHerHis|U] อยู่ #EMP ข้างนอก#! นี่เอง เจ้ารู้ไหม...""
 ep3_laamp_decision_event.1037.b_learning: ""พวกเราดีกว่านี้ได้แน่ ใช่หรือไม่?""
 ep3_laamp_decision_event.1037.b_martial: ""อยากจะมาเคลียร์กับ #EMP ข้า#! แทนไหม?""
 ep3_laamp_decision_event.1037.b.flavor: "จะมีอะไรเลวร้ายไปกว่านี้ได้อีก?"
 ep3_laamp_decision_event.1037.b.success: "ท่านโน้มน้าวอันธพาลให้ออกห่างจาก [laamp_hooded_figure.GetShortUIName] ได้สำเร็จ"
 ep3_laamp_decision_event.1037.b.success.t: "ช่วยขุนนาง[laamp_hooded_figure.GetWomanMan]ไว้ได้"
 ep3_laamp_decision_event.1037.b.failure: "ท่านโน้มน้าวอันธพาลไม่สำเร็จ"
 ep3_laamp_decision_event.1037.b.failure.t: "โน้มน้าวไม่สำเร็จ"
 ep3_laamp_decision_event.1037.c: ""ผู้นี้ #EMP [laamp_hooded_figure.GetTitleAsNameNoTooltip]#! มีเจ้าของแล้ว, เจ้า [ROOT.Char.Custom2('InsultNoun', ROOT.Char)]!""
 ep3_laamp_decision_event.1037.c.flavor: "ข้าเคยเจอเรื่องแย่กว่านี้"
 ep3_laamp_decision_event.1037.d: ""ข้าต้องการ[laamp_hooded_figure.GetWomanMan]ที่มีฝีมืออย่างเจ้า [laamp_hooded_figure.GetFirstNameNoTooltip]""
 ep3_laamp_decision_event.1037.d_thief_position: ""เจ้ารู้ไหม ข้ามีตำแหน่ง $master_thief_camp_officer$ ว่างอยู่สำหรับเจ้าพอดี""
 ep3_laamp_decision_event.1037.e: ""มืออาชีพระดับเจ้าจะ #EMP รุ่งเรือง#! ในค่ายของข้า""
 ep3_laamp_decision_event.1037.e.success: "[laamp_hooded_figure.GetShortUIName] สนใจในความคิดนี้"
 ep3_laamp_decision_event.1037.e.failure: "ท่านชักจูง [laamp_hooded_figure.GetShortUIName] ไม่สำเร็จ"
 ep3_laamp_decision_event.1037.e.failure.tt: "[laamp_hooded_figure.GetShortUIName] เริ่มเมินท่าน"
 ep3_laamp_decision_event.1037.f: ""ท่านช่วยสอน... วิชาให้ข้าได้หรือไม่?""
 ep3_laamp_decision_event.1037.g: ""เจ้ากับข้าร่วมมือกันจะ #EMP ครอบครอง#! ดินแดนนี้ได้ [laamp_hooded_figure.GetFirstNameNoTooltip]""
 ep3_laamp_decision_event.1037.h: "$ep3_laamp_decision_event.1021.d$"


 #Option: Visit the local church grounds
 ep3_laamp_decision_event.1040.t: "[visiting_location.GetBaronyNameExplicitlyNoTooltip]: บริเวณ[visiting_location.GetCounty.GetFaith.HouseOfWorship|U]"
 ep3_laamp_decision_event.1040.desc_returned_01: "กลับมาที่บริเวณ[visiting_location.GetCounty.GetFaith.HouseOfWorship] ทุกอย่างยังคงเหมือนเดิม ขณะที่ดวงอาทิตย์เคลื่อนคล้อยไปบนท้องฟ้า อาคารที่อยู่ติดกับจัตุรัสก็ผลัดกันให้ร่มเงาแก่ลานกว้าง"
 ep3_laamp_decision_event.1040.desc_returned_02: "กลิ่นธูปอันรุนแรงคืบคลานเข้ามาในรูจมูกของข้าอย่างไม่หยุดยั้ง ขณะที่ข้าเดินฝ่าแสงแดดอ่อนๆ กลับไปยังบริเวณ[visiting_location.GetCounty.GetFaith.HouseOfWorship]"
 ep3_laamp_decision_event.1040.desc_returned_from_healer: "ข้าหรี่ตาขณะปีนกลับขึ้นมาจากความมืดสลัวของกระท่อมหมอรักษา กลับมายังลาน[visiting_location.GetCounty.GetFaith.HouseOfWorship]"
 ep3_laamp_decision_event.1040.desc_returned_from_church: "เดินกลับผ่านประตูของ[visiting_location.GetCounty.GetFaith.HouseOfWorship] ความสงบแบบชนบทยังคงติดอยู่กับข้า ขณะที่ข้ากลับมาถึงจัตุรัส[visiting_location.GetCounty.GetFaith.HouseOfWorship]"
 ep3_laamp_decision_event.1040.desc_returned_from_garden: "ข้ากลับมาจากสวนอันเงียบสงบ รู้สึกเบาสบายขึ้น ขณะมองออกไปเห็นจัตุรัส[visiting_location.GetCounty.GetFaith.HouseOfWorship]อันพลุกพล่าน"
 ep3_laamp_decision_event.1040.desc_returned_from_physician: "ข้าเดินตามตรอกซอยที่ลดน้อยลงกลับมาจากห้องทำงานของ [laamp_physician_recruit.GetFirstNamePossessiveNoTooltip] และพบว่าตัวเองกลับมาอยู่ที่บริเวณ[visiting_location.GetCounty.GetFaith.HouseOfWorship]"
 ep3_laamp_decision_event.1040.desc: "มีความสงบอย่างหนึ่งที่จัตุรัส[visiting_location.GetCounty.GetFaith.HouseOfWorship] แม้ว่าจะมีการค้าขาย [visiting_location.GetCounty.GetFaith.PriestNeuterPlural] และผู้ช่วยอยู่มากมาย\n\n[visiting_location.GetCounty.GetFaith.HouseOfWorship]อันงดงามตั้งตระหง่านอยู่ตรงกลาง และที่ด้านข้างข้าเห็นป้ายอวดอ้างสรรพคุณการรักษาอย่างชัดเจน รวมถึงสวนส่วนขยายสำหรับครุ่นคิดถึง[visiting_location.GetCounty.GetFaith.HighGodName]อย่างเงียบสงบ"
 ep3_laamp_decision_event.1040.desc_outro_physician_sickly_minor: "\n\nที่ขอบจัตุรัส ผู้ศรัทธากำลังเทศนาเกี่ยวกับสุขภาพร่างกายที่ดีขึ้น และตามที่ตกลงกันไว้ล่วงหน้า [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('1040_sickly_minor'))] ที่ป่วยของข้า [1040_sickly_minor.GetFirstName] ได้รับการนำทางและกำลังรอข้าอยู่ที่กระท่อมหมอรักษา"
 ep3_laamp_decision_event.1040.desc_outro_physician: "\n\nที่ขอบจัตุรัส ผู้ศรัทธากำลังเทศนาว่าสุขภาพร่างกายที่ดีขึ้นจะช่วยเพิ่มสุขภาพทางจิตวิญญาณของเราได้อย่างไร [laamp_physician_recruit.GetSheHe|U] ยืนหยัดอย่างมั่นคงแม้จะมีเสียงโห่ร้องเป็นครั้งคราวจากฝูงชนชาวบ้าน"
 ep3_laamp_decision_event.1040.desc_outro_sickly_minor: "\n\nตามที่ตกลงกับผู้ดูแลคนหนึ่งที่ค่าย [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('1040_sickly_minor'))] ที่ป่วยของข้า [1040_sickly_minor.GetFirstName] ได้รับการนำทาง และกำลังรอข้าอยู่ที่กระท่อมหมอรักษา"
 ep3_laamp_decision_event.1040.desc_outro_partner: "\n\n[visiting_partner.GetFirstName] พยักหน้าอย่างชื่นชมและมองไปรอบๆ จัตุรัสที่พลุกพล่าน สายตาจับจ้องไปที่แผงลอยและจุดสนใจที่น่าสงสัยอยู่แล้ว"
 ep3_laamp_decision_event.1040.desc_outro: "\n\nข้าพบว่าตัวเองอยู่ในสภาวะที่พึงพอใจ มองออกไปทั่วลานกว้าง และข้าสูดหายใจลึกๆ สองสามครั้งขณะไตร่ตรองถึงจุดหมายต่อไปของข้า"
 ep3_laamp_decision_event.1040.desc_outro_return_partner_finished: "\n\n[visiting_partner.GetFirstName] ซึ่งเริ่มดูเหนื่อยล้าเล็กน้อย กล่าวว่า: "ข้าไม่ใช่คนขี้บ่น แต่... แน่นอนว่าพวกเราเสร็จธุระที่นี่แล้วใช่ไหม [visiting_partner.Custom2('RelationToMe', ROOT.Char)]?""
 ep3_laamp_decision_event.1040.desc_outro_return_finished: "\n\nหลังจากใช้เวลาพอสมควรที่จัตุรัส[visiting_location.GetCounty.GetFaith.HouseOfWorship] ข้าพอใจกับการติดต่อธุระในวันนี้ และข้ามองหาทางที่เร็วที่สุดเพื่อกลับไปยังจัตุรัสหลัก"
 ep3_laamp_decision_event.1040.desc_outro_physician_return: "\n\nนักเทศน์ผู้ศรัทธายังคงเทศนาคำสอนเกี่ยวกับสุขภาพของ [laamp_physician_recruit.GetHerHis] ต่อไป แต่ดูเหมือนใกล้จะจบการบรรยายแล้ว"
 ep3_laamp_decision_event.1040.desc_outro_sickly_minor_return: "\n\nด้วยเหตุผลบางอย่าง ตอนนี้ดูเหมือนจะมีเด็กๆ มากมายที่จัตุรัส พวกเขาอยู่ที่นี่มาตลอดหรือเปล่า? พวกเขาเล่นและต่อสู้กัน ค้นหาวิธีใหม่ๆ ในการทำสิ่งเก่าๆ อยู่เสมอ ไม่บ่อยนักที่จะ ทำให้ผู้ดูแลประหลาดใจและขุ่นเคือง\n\nจิตใจของข้ายังคงครุ่นคิดถึงสภาวะสุขภาพของ [1040_sickly_minor.GetFirstNamePossessive] ขณะที่ข้ามองไปรอบๆ จัตุรัสเพื่อหาจุดหมายต่อไป"
 ep3_laamp_decision_event.1040.desc_outro_return_partner_01: "\n\nทางซ้ายของข้า [visiting_partner.GetFirstName] กำลังตรวจสอบแผงลอยที่เต็มไปด้วยขวดเล็กจิ๋วอย่างสงสัย — กล่าวกันว่าบรรจุหยดพิษจาก [ROOT.Char.Custom('VenomousCreature')]\n\nแค่คิดก็ ทำให้ข้าขนลุก ขณะที่ข้าพยายามตัดสินใจว่าจะไปที่ไหนต่อ"
 ep3_laamp_decision_event.1040.desc_outro_return_partner_02: "\n\n[visiting_partner.GetFirstName] สะกิดไหล่ข้า ชี้ไปที่ทหารยามที่กำลังนำทาง[ROOT.Char.GetWomanMan]ที่มอซอออกจากบริเวณนั้น ตะโกนเกี่ยวกับวันสิ้นโลก\n\nข้าเลิกคิ้วโดยสัญชาตญาณ และสังเกตความโกลาหลขณะพิจารณาว่าจะทำอะไรต่อไป"
 ep3_laamp_decision_event.1040.desc_outro_return_partner_03: "\n\n[visiting_partner.GetFirstName] ยื่นอาหารคำเล็กๆ ให้ข้าระหว่างที่เราเดินข้ามจัตุรัส\n\nข้าเคี้ยวเสบียงแห้งอย่างครุ่นคิดขณะไตร่ตรองว่าก้าวต่อไปของข้าคืออะไร"
 ep3_laamp_decision_event.1040.desc_outro_return_01: "\n\nในมุมร่มรื่นของลานกว้าง พ่อค้าเร่กำลังพยายามโน้มน้าวขุนนาง[ROOT.Char.GetWomanMan]ถึงสรรพคุณการรักษาของทรายแดง\n\nข้าสังเกตการทะเลาะวิวาทของพวกเขาอย่างไม่ใส่ใจขณะไตร่ตรองว่าก้าวต่อไปของข้าคืออะไร"
 ep3_laamp_decision_event.1040.desc_outro_return_02: "\n\nที่แผงลอยใกล้ๆ ซึ่งขายกระจกออบซิเดียน [visiting_location.GetCounty.GetFaith.PriestNeuter] กำลังพยายามปกปิดความตื่นเต้นของ [ROOT.Char.GetHerHis] ขณะที่ [ROOT.Char.GetSheHe] ในที่สุดก็มีโอกาสได้สำรวจ [ROOT.Char.GetHerselfHimself]\n\nข้ารู้สึกขบขันเล็กน้อย พยายามตัดสินใจว่าจะไปที่ไหนต่อ"
 ep3_laamp_decision_event.1040.desc_outro_return_03: "\n\nข้างศาลาทรงกลมเล็กๆ พ่อค้าเร่ที่ถือสำเนาคัดลอกของ [ROOT.Char.Custom('RandomReligiousTextName')] กำลังอ่านออกเสียงจากข้อความให้ผู้ฟังที่ถ่อมตนฟัง\n\nข้าฟังอย่างเหม่อลอยขณะสังเกตลานกว้าง ไตร่ตรองว่าจะทำอะไรต่อไป"
