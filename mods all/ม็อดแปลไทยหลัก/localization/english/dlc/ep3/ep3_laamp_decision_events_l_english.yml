 overflowing_provisions_to_gold.tt: "#EMP เนื่องจากสิ่งนี้จะทำให้ท่านมี [provisions|E] เกินความจุ @provisions_icon![provisions_overflow_value|V0] เพิ่มเติมจะถูกขายในตลาดท้องถิ่นเป็น @gold_icon![provisions_transformed_to_gold_value|V0]#!"
