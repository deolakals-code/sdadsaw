ep3_laamp_decision_event.1055.b: ""เข้าร่วมกับข้า ในการรับใช้[ROOT.Char.GetFaith.GetNameNoTooltip]!""
ep3_laamp_decision_event.1055.b.flavor: "เพียง [ROOT.Char.GetFaith.HighGodName] เท่านั้นที่จะตัดสินความศรัทธาของข้า"
ep3_laamp_decision_event.1055.b.cooldown.tt: "ท่านได้ใช้ประโยชน์จาก [piety_level|E] ของท่านเมื่อเร็วๆ นี้ — กองทหารที่คลั่งศาสนามากขึ้นได้รวมตัวกันในวันที่ [GetCurrentDateWithDiff( GetVarTimeRemaining( THIS.Char.MakeScope, '1055_reinforced_with_piety_recently') )]"

ep3_laamp_decision_event.1055.piety_level: "เนื่องจาก [piety_level|E] ของท่าน:"
ep3_laamp_decision_event.1055.piety_full.tt: "$ep3_laamp_decision_event.1055.piety_level$$ep3_laamp_decision_event.1055.full.tt$"
ep3_laamp_decision_event.1055.piety_partial_80.tt: "$ep3_laamp_decision_event.1055.piety_level$$ep3_laamp_decision_event.1055.all_regiments$$ep3_laamp_decision_event.1055.positive_partial.tt$ (#V 80#!%)#!"
ep3_laamp_decision_event.1055.piety_partial_60.tt: "$ep3_laamp_decision_event.1055.piety_level$$ep3_laamp_decision_event.1055.all_regiments$$ep3_laamp_decision_event.1055.positive_partial.tt$ (#V 60#!%)#!"
