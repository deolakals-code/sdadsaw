 laamp_treasure_map_contract_desc: "นักล่าสมบัติที่เกษียณแล้ว [TaskContract.GetEmployer.GetName] ต้องการความช่วยเหลือในการค้นหาขุมทรัพย์สุดท้ายที่เข้าใจยาก สิ่งนี้จะยังคงใช้ได้ตราบเท่าที่ท่านมีแผนที่สมบัติอยู่ในครอบครอง"
