ep3_laamp_decision_event.1055.c: ""บางทีเราอาจจะแลกเปลี่ยนกันได้?""
ep3_laamp_decision_event.1055.c.tt: "[regiment|E] [men_at_arms|E] แบบสุ่ม: \n#P #EMP $BULLET_WITH_TAB$ได้รับการเสริมกำลังเต็มที่!#!#!"
ep3_laamp_decision_event.1055.d: ""นี่คือโอกาสของท่านที่จะต่อสู้เพื่อ #EMP ความชอบธรรม!#!""
ep3_laamp_decision_event.1055.d.flavor: "ร่วมกัน เพื่อโลกที่ดีกว่า"
ep3_laamp_decision_event.1055.d.tt: "เนื่องจาก [trait_level_track_xp|E] [GetTrait('knight_errant').GetName( GetNullCharacter )] ของท่าน:$refill_maa_regiments_fully_reinforced_tt$"
