 #Option: Visit the local tavern
 ep3_laamp_decision_event.1030.t: "[visiting_location.GetBaronyNameExplicitlyNoTooltip]: [ROOT.Char.Custom('GetTavernDwelling')|U]"
 ep3_laamp_decision_event.1030.desc_returned_01: "ข้าพเจ้ากลับเข้าไปในโรงเตี๊ยมอีกครั้ง ตระหนักว่าไม่มีอะไรเปลี่ยนแปลงไปมากนัก ระหว่างนักเดินทางและคนพเนจรที่กำลังพักผ่อนขณะที่ความต้องการของพวกเขาได้รับการตอบสนอง"
 ep3_laamp_decision_event.1030.desc_nomad_returned_01: "ข้าพเจ้ากลับเข้าไปในที่พักอาศัยอีกครั้ง ประทับใจในไมตรีจิตและบรรยากาศที่เป็นกันเองอีกครั้ง ขณะที่ข้าพเจ้าถอนหายใจอย่างผ่อนคลาย"
 ep3_laamp_decision_event.1030.desc_returned_02: "กลับมาที่ [ROOT.Char.Custom('GetTavernDwelling')] นักเลงชาว [visiting_location.GetCounty.GetCulture.GetNameNoTooltip] สองสามคนเพิ่งยุติการโต้เถียงที่กลายเป็นการชกต่อย"
 ep3_laamp_decision_event.1030.desc_returned_from_story: "รายละเอียดเรื่องราวของ [laamp_storyteller.GetFirstNamePossessive] ยังคงอยู่ในหัวของข้าพเจ้า ข้าพเจ้าเดินกลับไปยังห้องส่วนกลางที่เสียงดังกว่าอย่างเห็นได้ชัด"
 ep3_laamp_decision_event.1030.desc_nomad_returned_from_story: "รายละเอียดเรื่องราวของ [laamp_storyteller.GetFirstNamePossessive] ยังคงอยู่ในหัวของข้าพเจ้า ข้าพเจ้าเดินกลับเข้าไปในที่พักอาศัย"
 ep3_laamp_decision_event.1030.desc_returned_from_recruit: "ขณะที่ข้าพเจ้าเดินทางกลับจากกลุ่มผู้สมัคร ข้าพเจ้าได้กลิ่นหอมเย้ายวนจาก [visiting_location.GetCounty.GetTitle.GetHolder.Custom('GetLocalStreetFoodPlural')] ที่กำลังเตรียมอยู่ในครัว"
 ep3_laamp_decision_event.1030.desc_nomad_returned_from_recruit: "เดินทางกลับจากกลุ่มผู้สมัคร ข้าพเจ้าเกือบสะดุดกลุ่มนักดื่มสองคนที่กำลังยุ่งอยู่กับการหยอกล้อชายคนที่สามที่เก็บตัวกว่า สำหรับความคล้ายคลึงของเขากับ [ROOT.Char.Custom('RegionalMythicalCreatureLower')]"
 ep3_laamp_decision_event.1030.desc_returned_from_unwinding_spouse: "ข้าพเจ้าออกจากกลุ่มเพื่อนที่น่ารักของ [laamp_spouse_material.GetFirstNamePossessive] จัดเสื้อผ้าให้เข้าที่ และกลับมาจากห้องด้านหลังห้องหนึ่งด้วยความกระปรี้กระเปร่า"
 ep3_laamp_decision_event.1030.desc_nomad_returned_from_unwinding_spouse: "ข้าพเจ้าออกจากเต็นท์ที่น่ารักของ [laamp_spouse_material.GetFirstNamePossessive] จัดเสื้อผ้าให้เข้าที่ และแอบกลับเข้าไปในที่พักอาศัยด้วยความกระปรี้กระเปร่า"
 ep3_laamp_decision_event.1030.desc_returned_from_spouse: "เมื่อข้าพเจ้าออกจากกลุ่มเพื่อนของ [laamp_spouse_material.GetHerHis] [laamp_spouse_material.GetFirstName] ก็กลับไปสนทนากับ [ROOT.Char.Custom('GetTaverngoersTribespeople')] ที่เป็นมิตรสองสามคน ขณะที่ข้าพเจ้าเดินกลับไปยังกลาง [ROOT.Char.Custom('GetRoomTent')]"
 ep3_laamp_decision_event.1030.desc_returned_from_hood_noble_fail: "ขณะที่ข้าพเจ้าล้มเหลวในการคลี่คลายสถานการณ์ นักเลงท้องถิ่นก็โยน [laamp_hooded_figure.GetFirstName] และการทะเลาะวิวาทของ [laamp_hooded_figure.GetHerHis] ออกจาก [ROOT.Char.Custom('GetTavernDwelling')] ข้าพเจ้าค่อยๆ เดินกลับไปยังกลาง [ROOT.Char.Custom('GetRoomTent')]"
 ep3_laamp_decision_event.1030.desc_returned_from_hood_noble: "ความตึงเครียดยังคงสูงเมื่อข้าพเจ้าทิ้ง [laamp_hooded_figure.GetFirstName] ไว้ในสถานการณ์ที่ยากลำบากของ [laamp_hooded_figure.GetHerHis] และเดินกลับไปยังกลาง [ROOT.Char.Custom('GetRoomTent')]"
 ep3_laamp_decision_event.1030.desc_returned_from_hood: "ข้าพเจ้าหาทางกลับจากห้องใต้ดินขณะที่ดวงตาของข้าพเจ้าปรับตัวเข้ากับความสว่างที่เพิ่มขึ้นของห้องส่วนกลางอีกครั้ง"
 ep3_laamp_decision_event.1030.desc_nomad_returned_from_hood: "ข้าพเจ้าหาทางกลับจากเต็นท์อื่นขณะที่ดวงตาของข้าพเจ้าปรับตัวเข้ากับความมืดสลัวของที่พักอาศัยอีกครั้ง"

 ep3_laamp_decision_event.1030.desc: "โรงเตี๊ยม ซึ่งรวบรวมนักเดินทางและชาว [visiting_location.GetCounty.GetCulture.GetCollectiveNounNoTooltip] ท้องถิ่นไว้ด้วยกัน กำลังคึกคักไปด้วยกิจกรรม"
 ep3_laamp_decision_event.1030.desc_nomad: "ข้าพเจ้าได้รับเชิญเข้าไปในเต็นท์หลังหนึ่ง มีคนจำนวนมากอย่างน่าประหลาดใจอยู่ข้างใน — นักเดินทางและชาว [visiting_location.GetCounty.GetCulture.GetCollectiveNounNoTooltip] ทั้งหมดผสมผสานกันเป็นเสียง #EMP อึกทึก#! ของมนุษย์อย่างกลมกลืน"
 #Mid
 ep3_laamp_decision_event.1030.desc_mid_storyteller_intro: "\n\nนักเล่าเรื่องคนหนึ่งนั่งอยู่ข้างกองไฟลึกเข้าไปเล็กน้อย ด้านหน้า กลุ่มเพื่อนซอมซ่อกำลังรบเร้าบริกรขอ [visiting_location.GetCounty.GetTitle.GetHolder.Custom('RegionalDrink')] เพิ่ม และที่มุมเคาน์เตอร์"
 ep3_laamp_decision_event.1030.desc_nomad_mid_storyteller_intro: "\n\nข้างนอก นักเล่าเรื่องคนหนึ่งนั่งอยู่ข้างกองไฟ ด้านหน้า กลุ่มชนเผ่า [visiting_location.GetCounty.GetTitle.GetHolder.GetWomenMen] เสียงดังกำลังเล่าถึงการเดินทางครั้งล่าสุดของพวกเขา และที่มุมเคาน์เตอร์"

 ep3_laamp_decision_event.1030.desc_mid_reused_spouse: "$ep3_laamp_decision_event.1030.desc_mid_storyteller_intro$ ข้าพเจ้าเห็น [laamp_spouse_material.GetFirstName] ผู้ [laamp_spouse_material.Custom('RandomPositiveShallowAdjective')] นั่งอยู่ เห็นได้ชัดว่าเบื่อ"
 ep3_laamp_decision_event.1030.desc_mid_spouse: "$ep3_laamp_decision_event.1030.desc_mid_storyteller_intro$ [laamp_spouse_material.Custom('RaunchyComplimentNoun')] [laamp_spouse_material.Custom('RandomPositiveShallowAdjectiveWithArticle')] นั่งอยู่ ดูเหมือนจะเบื่อ"
 ep3_laamp_decision_event.1030.desc_nomad_mid_spouse: "$ep3_laamp_decision_event.1030.desc_nomad_mid_storyteller_intro$ [laamp_spouse_material.Custom('RaunchyComplimentNoun')] [laamp_spouse_material.Custom('RandomPositiveShallowAdjectiveWithArticle')] นั่งอยู่ ดูเหมือนจะเบื่อ"

 ep3_laamp_decision_event.1030.desc_mid_return_reused_spouse: "\n\nข้างเคาน์เตอร์ [laamp_spouse_material.GetFirstName] ยังคงนั่งอยู่ ลากนิ้วเรียวไปตามขอบถ้วยของ [laamp_spouse_material.GetHerHis]"
 ep3_laamp_decision_event.1030.desc_mid_return_spouse: "\n\nข้างเคาน์เตอร์ [laamp_spouse_material.Custom('RaunchyComplimentNoun')] ผู้ [laamp_spouse_material.Custom('RandomPositiveShallowAdjective')] จากก่อนหน้านี้ยังคงนั่งสงบนิ่ง จิบถ้วยของ [laamp_spouse_material.GetHerHis]"

 ep3_laamp_decision_event.1030.desc_mid: "\n\nนักเล่าเรื่องคนหนึ่งนั่งอยู่ข้างกองไฟลึกเข้าไปเล็กน้อย และด้านหน้า กลุ่มเพื่อนซอมซ่อกำลังรบเร้าบริกรขอ [visiting_location.GetCounty.GetTitle.GetHolder.Custom('RegionalDrink')] เพิ่ม"
 ep3_laamp_decision_event.1030.desc_nomad_mid: "\n\nข้างนอก นักเล่าเรื่องคนหนึ่งนั่งอยู่ข้างกองไฟ ด้านหน้า กลุ่มชนเผ่า [visiting_location.GetCounty.GetTitle.GetHolder.GetWomenMen] เสียงดังกำลังเล่าถึงการเดินทางครั้งล่าสุดของพวกเขา"
 #Outro
 ep3_laamp_decision_event.1030.desc_outro_hooded: "\n\nข้างทางเข้า ข้าพเจ้าเห็นร่างคลุมศีรษะที่ไม่สะดุดตา เห็นได้ชัดว่าเป็นคนที่ให้ความสำคัญกับความเป็นส่วนตัว"
 ep3_laamp_decision_event.1030.desc_outro_partner: "\n\n[visiting_partner.GetFirstName] มองไปรอบๆ กลุ่มคนที่สับสนอลหม่านด้วยแววตาที่สนใจใคร่รู้ [visiting_partner.GetHerHis]"
 ep3_laamp_decision_event.1030.desc_outro: "\n\nข้าพเจ้าก้าวเข้าไปใน [ROOT.Char.Custom('GetRoomTent')] ที่สว่างและอบอุ่นสองสามก้าว ครุ่นคิดว่าจะทำอะไรก่อน"
 ep3_laamp_decision_event.1030.desc_outro_return_partner_finished: "\n\n[visiting_partner.GetFirstName] ซึ่งเริ่มดูเหนื่อยล้าเล็กน้อย เหลือบมองโต๊ะใกล้ๆ: "ถ้าเราจะอยู่นานกว่านี้ อย่างน้อยเรากินอะไรกันหน่อยได้ไหม [visiting_partner.Custom2('RelationToMe', ROOT.Char)]?""
 ep3_laamp_decision_event.1030.desc_outro_return_finished: "\n\nมองไปรอบๆ [ROOT.Char.Custom('GetRoomTent')] ดูเหมือนจะว่างเปล่ามากขึ้นตอนนี้ ขณะที่ข้าพเจ้าตระหนักว่าไม่มีอะไรเหลือให้ทำแล้ว"
 ep3_laamp_decision_event.1030.desc_outro_hooded_return_intro: "\n\nถัดจากทางเข้า ร่างคลุมศีรษะที่ไม่สะดุดตายังคงนั่งอยู่"
 ep3_laamp_decision_event.1030.desc_outro_hooded_noble_return: "$ep3_laamp_decision_event.1030.desc_outro_hooded_return_intro$ ดื่มถ้วยอื่นลงไป"
 ep3_laamp_decision_event.1030.desc_outro_hooded_return: "$ep3_laamp_decision_event.1030.desc_outro_hooded_return_intro$ เล่นกริชเล็กๆ"
 ep3_laamp_decision_event.1030.desc_outro_return_partner_01: "\n\nที่มุมหนึ่งของ [ROOT.Char.Custom('GetTavernDwelling')] [visiting_partner.GetFirstName] สังเกตกลุ่มคนท้องถิ่นกำลังขว้างของมีคมใส่ถังที่แตกด้วยความสนใจอย่างน่าขนลุก\n\nข้าพเจ้าเหลือบมองเกมของพวกเขาขณะพิจารณาว่าจะทำอะไรต่อไป"
 ep3_laamp_decision_event.1030.desc_outro_return_partner_02: "\n\nทางขวามือของข้าพเจ้า [visiting_partner.GetFirstName] ยิ้มอย่างชื่นชมขณะที่ชาวนาคนหนึ่งเล่าเรื่องตลกหยาบคายเกี่ยวกับของเหลวในร่างกายหลายอย่างจบ ข้าพเจ้ามอง [visiting_partner.GetHerHim] อย่างประหลาดใจ ขณะชั่งใจว่าจะทำอะไรต่อไป"
 ep3_laamp_decision_event.1030.desc_outro_return_partner_03: "\n\nไกลออกไปข้างหน้า [visiting_partner.GetFirstName] เริ่มเต้นรำเล็กน้อยขณะที่นักดนตรีใน [ROOT.Char.Custom('GetTavernDwelling')] จบเพลงพื้นบ้านท้องถิ่น ข้าพเจ้าสังเกตการเต้นรำอย่างสบายๆ ขณะครุ่นคิดว่าอะไรคือสิ่งต่อไปในวาระของข้าพเจ้า"
 ep3_laamp_decision_event.1030.desc_outro_return_01: "\n\nอารมณ์กำลังคึกคักและผู้มา [ROOT.Char.Custom('GetTavernDwelling')] บางคนเริ่มร้องเพลงทำนอง [visiting_location.GetCounty.GetCulture.GetNameNoTooltip] ท่ามกลางเสียงอึกทึก ข้าพเจ้าพิจารณาการเคลื่อนไหวครั้งต่อไป"
 ep3_laamp_decision_event.1030.desc_outro_return_02: "\n\nที่ด้านหลังของ [ROOT.Char.Custom('GetRoomTent')] ขุนนาง [ROOT.Char.GetWomanMan] คนหนึ่งกำลังยุ่งอยู่กับการพูดคุยกับชาวนา [ROOT.Char.Custom('GetRandomWomanMan')] สายตาของข้าพเจ้าจับจ้องอยู่ที่ตราประจำตระกูลของขุนนาง [ROOT.Char.Custom('WomanManPossessive')] ขณะชั่งใจว่าจะทำอะไรต่อไป"
 ep3_laamp_decision_event.1030.desc_outro_return_03: "\n\nที่โต๊ะข้างทางเข้า คนท้องถิ่นสองสามคนกำลังเล่นเกมกระดานแปลกๆ โดยใช้หินสีดำและขาวหยาบๆ มองการเคลื่อนไหวของพวกเขาอย่างสบายๆ ข้าพเจ้าชั่งน้ำหนักตัวเลือกของข้าพเจ้าอย่างรอบคอบ"
 #Options
