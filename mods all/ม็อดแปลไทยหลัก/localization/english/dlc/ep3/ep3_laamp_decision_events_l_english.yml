 ep3_laamp_decision_event.1010.a_stewardship.success: "ท่านโน้มน้าว [laamp_supply_merchant.GetShortUIName] ได้สำเร็จ"
 ep3_laamp_decision_event.1010.a_stewardship.failure: "[laamp_supply_merchant.GetShortUIName] ไม่หลงกลตรรกะของท่าน"
