 ep3_laamp_decision_event.1010.e: "กลับกันเถอะ"

 #Option: Sell an artifact to local peddlers
 ep3_laamp_decision_event.1020.t: "[visiting_location.GetBaronyNameExplicitlyNoTooltip]: ไม่ถามคำถาม"
 ep3_laamp_decision_event.1020.desc_intro_reused_peddler: "เสียงหนึ่งดังแทรกความวุ่นวายของแผงขายวัตถุโบราณ: "ข้าชื่นชมลูกค้าที่กลับมาเสมอ!" [laamp_artifact_peddler.GetFirstName] อุทาน ขณะที่ [laamp_artifact_peddler.GetSheHe] ขยับเข้ามาใกล้เพื่อดูสินค้าคงคลังของข้าพเจ้า"
 ep3_laamp_decision_event.1020.desc_intro_posh_stalls: "ย่านการค้าของ [visiting_location.GetBaronyNameExplicitly] เต็มไปด้วยผู้ขายและผู้จัดหาวัตถุโบราณหายากและแปลกใหม่ และข้าพเจ้าไม่มีปัญหาในการหาพ่อค้าเร่ขายวัตถุโบราณชื่อดัง [laamp_artifact_peddler.GetFirstName]"
 ep3_laamp_decision_event.1020.desc_intro_new_01: "มองหาใครสักคนที่จะรับของบางอย่างไปจากมือข้าพเจ้า; พ่อค้าเร่ขายวัตถุโบราณ [laamp_artifact_peddler.GetFirstName] ปรากฏตัวขึ้นเพื่อดูสินค้าคงคลังของข้าพเจ้า"
 ep3_laamp_decision_event.1020.desc_intro_new_02: "ตรอกซอกซอยเต็มไปด้วยแผงลอย ไหล่ของข้าพเจ้าชนกับใครบางคนจากด้านหลังโดยไม่ได้ตั้งใจ ขณะที่พ่อค้าเร่ขายวัตถุโบราณ [laamp_artifact_peddler.GetFirstName] หันมาเผชิญหน้ากับข้าพเจ้า [laamp_artifact_peddler.GetSheHe] สังเกตเห็นสินค้าคงคลังของข้าพเจ้าและโน้มตัวเข้ามาเพื่อตรวจสอบอย่างใกล้ชิด"
 ep3_laamp_decision_event.1020.desc_intro_returned_01: "เดินกลับไปหาพ่อค้าเร่ขายวัตถุโบราณ [laamp_artifact_peddler.GetFirstName] มองข้าพเจ้าอย่างสงสัยเมื่อข้าพเจ้ากลับมาที่แผงขายวัตถุโบราณ: "ข้อเสนอของข้ายังคงอยู่"\n\nจากนั้น [laamp_artifact_peddler.GetSheHe] ก็หันไปที่แผงลอยของ [laamp_artifact_peddler.GetHerHis] และเริ่มจัดเรียงสินค้าใหม่"
 ep3_laamp_decision_event.1020.desc_intro_returned_02: "กลับมาหาพ่อค้าเร่ขายวัตถุโบราณ แผงลอยของ [laamp_artifact_peddler.GetFirstNamePossessive] ยังคงโดดเด่นจากฝูงชนด้วยความอุดมสมบูรณ์และสินค้าคุณภาพสูง\n\n[laamp_artifact_peddler.GetSheHe|U] สังเกตเห็นข้าพเจ้าและหยุดชั่วครู่ จากนั้นพูดว่า: "ตกลงตามนั้นไหม?""
 ep3_laamp_decision_event.1020.desc_intro_intermediate_returned_01: "ยังคงครุ่นคิดถึงตัวเลือกของข้าพเจ้า [laamp_artifact_peddler.GetFirstName] มองข้าพเจ้าอย่างไม่แยแสและพ่นคำว่า: "ข้อเสนอของข้ายังคงอยู่" ด้วยน้ำเสียงราบเรียบ\n\nจากนั้น [laamp_artifact_peddler.GetSheHe] ก็หันไปที่แผงลอยของ [laamp_artifact_peddler.GetHerHis] อย่างไม่ใส่ใจและเริ่มจัดเรียงสินค้าใหม่"
 ep3_laamp_decision_event.1020.desc_intro_intermediate_returned_02: "ขณะที่ข้าพเจ้าลังเลเล็กน้อย [laamp_artifact_peddler.GetFirstName] ดูเหมือนจะขุ่นเคืองเล็กน้อยกับความลังเลของข้าพเจ้า\n\n[laamp_artifact_peddler.GetSheHe|U] ยักไหล่ของ [laamp_artifact_peddler.GetHerHis] พร้อมกับพูดว่า "ใช้เวลาเท่าที่ท่านต้องการก็ได้ ข้าเดาว่า" และเดินไปช่วยลูกค้ารายอื่น"
 ep3_laamp_decision_event.1020.desc_one_artifact_new_01: "\n\nด้วยสัมผัสที่ช่ำชอง [laamp_artifact_peddler.GetSheHe] ตรวจสอบพื้นผิวของ [1020_first_artifact_to_sell.GetName] ของข้าพเจ้า จากนั้นพยักหน้าและพึมพำบางอย่างกับ [laamp_artifact_peddler.GetHerselfHimself]"
 ep3_laamp_decision_event.1020.desc_one_artifact_new_02: "\n\n[laamp_artifact_peddler.GetSheHe|U] เคาะเบาๆ ที่พื้นผิวของ [1020_first_artifact_to_sell.GetName] จากนั้นเอียงศีรษะของ [laamp_artifact_peddler.GetHerHis] ราวกับกำลังฟังอะไรบางอย่าง จากนั้น [laamp_artifact_peddler.GetSheHe] ก็พยักหน้า"
 ep3_laamp_decision_event.1020.desc_two_artifacts_new_01: "\n\n[laamp_artifact_peddler.GetSheHe|U] ลูบนิ้วของ [laamp_artifact_peddler.GetHerHis] ไปตาม [1020_first_artifact_to_sell.GetName] และดวงตาของ [laamp_artifact_peddler.GetHerHis] ก็ดูสนใจเมื่อสังเกตเห็น [1020_second_artifact_to_sell.GetName]"
 ep3_laamp_decision_event.1020.desc_two_artifacts_new_02: "\n\n[laamp_artifact_peddler.GetSheHe|U] เริ่มทำท่าหยิบจับที่ [1020_first_artifact_to_sell.GetName] พิจารณา [1020_first_artifact_to_sell.Custom('ArtifactType')] อย่างรอบคอบ จากนั้น [laamp_artifact_peddler.GetSheHe] ก็ตรวจสอบ [1020_second_artifact_to_sell.GetName] อย่างนุ่มนวล ดูเหมือนจะพอใจกับบางสิ่ง"
 ep3_laamp_decision_event.1020.desc_three_artifacts_new_01: "\n\nตรวจสอบ บิดและหมุน; [laamp_artifact_peddler.GetSheHe] ตรวจสอบทุกรายละเอียด — ไม่ว่าจะเป็นการตก แต่งของ [1020_first_artifact_to_sell.GetName] วัสดุของ [1020_second_artifact_to_sell.GetName] หรือการตก แต่งของ [1020_third_artifact_to_sell.GetName]"
 ep3_laamp_decision_event.1020.desc_three_artifacts_new_02: "\n\n[laamp_artifact_peddler.GetSheHe|U] ได้ตรวจสอบ [1020_first_artifact_to_sell.GetName] และ [1020_second_artifact_to_sell.GetName] อย่างละเอียดถี่ถ้วนก่อนที่ข้าพเจ้าจะรู้ตัว มือของ [laamp_artifact_peddler.GetHerHis|U] เคลื่อนไหวอย่างรวดเร็วไปทั่วพื้นผิวของ [1020_third_artifact_to_sell.GetName] เพื่อมองหาข้อบกพร่อง"
 ep3_laamp_decision_event.1020.desc_outraged_partner_new: "\n\nทันใดนั้น ข้าพเจ้าก็ได้ยินเสียง [visiting_partner.GetFirstNamePossessive] [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('visiting_partner'))] ของข้าพเจ้าดังขึ้นในหูอย่างโกรธเคือง: "ท่านกำลังถูกเอาเปรียบ! #EMP ข้า#! สามารถหาข้อเสนอที่ดีกว่าให้ท่านได้!""
 ep3_laamp_decision_event.1020.desc_outraged_partner_returned: "\n\nจากหางตา ข้าพเจ้าสังเกตเห็น [visiting_partner.GetFirstName] ยังคงเดือดดาลกับข้อเสนอราคาถูกของ [laamp_artifact_peddler.GetFirstNamePossessiveNoTooltip]"
