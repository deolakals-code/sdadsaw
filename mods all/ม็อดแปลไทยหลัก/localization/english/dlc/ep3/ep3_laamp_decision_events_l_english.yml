 #Weaponsmith
 ep3_laamp_decision_event.1061.return.tt: "ท่านกลับไปยังย่านช่างฝีมือ"
 ep3_laamp_decision_event.1061.t: "[visiting_location.GetBaronyNameExplicitlyNoTooltip]: ช่างทำอาวุธ"
 ep3_laamp_decision_event.1061.desc_returned_01: "กลับมาที่ลานฝึก ช่างทำอาวุธ [laamp_weaponsmith_craftsman.GetFirstName] ยังคงยืนอยู่รอบๆ แผงขายของ [laamp_weaponsmith_craftsman.GetHerHis] ตอนนี้กำลังขัดอาวุธชิ้นหนึ่งอย่างเบามือด้วยผ้าเนื้อนุ่ม\n\n[laamp_weaponsmith_craftsman.GetSheHe|U] ฮัมเพลงกับ [laamp_weaponsmith_craftsman.GetHerselfHimself] ขณะทำ เช่นนั้น แต่หยุดทันทีเมื่อข้ามาถึง "เจออะไรให้แทงแล้วสินะ ในที่สุด?" [laamp_weaponsmith_craftsman.GetSheHe] พูด โดยไม่มีร่องรอยความเป็นมิตร"
 ep3_laamp_decision_event.1061.desc_returned_02: "ขณะที่ข้ากลับไปหาช่างทำอาวุธ [laamp_weaponsmith_craftsman.GetFirstName] ได้นำอาหารคำเล็กๆ ออกมาจากกระเป๋าที่เข็มขัดของ [laamp_weaponsmith_craftsman.GetHerHis] และกำลังกินมันเป็นชิ้นเล็กๆ อย่างชื่นชม\n\nสังเกตเห็นข้า [laamp_weaponsmith_craftsman.GetSheHe] ค่อยๆ ปัดเศษขนมปังออกจากเสื้อคลุมของ [laamp_weaponsmith_craftsman.GetHerHis] ยืนขึ้นและมองข้าด้วยสีหน้าที่อ่านไม่ออก: "เปลี่ยนใจแล้วรึ?""
 ep3_laamp_decision_event.1061.desc_intro: "ช่างทำอาวุธ [laamp_weaponsmith_craftsman.GetFirstName] กำลังพูดคุยกับคนรับใช้ใกล้ๆ อย่างเกียจคร้าน ยืนอยู่ข้างแผงขายชั่วคราวข้างลานฝึก"
 ep3_laamp_decision_event.1061.desc_reused_weaponsmith: "$ep3_laamp_decision_event.1061.desc_intro$\n\n[laamp_weaponsmith_craftsman.GetSheHe|U] เหลือบมองข้าอย่างจำได้ เลิกคิ้วและก้าวเข้ามาหาข้าสองสามก้าว: "เอาล่ะ ไม่ใช่ทุกวันที่จะได้เห็นลูกค้ากลับมา!"\n\n"เชิญชมสินค้าของข้าได้เลย" [laamp_weaponsmith_craftsman.GetSheHe] พูด และพยายามยิ้ม"
 ep3_laamp_decision_event.1061.desc: "$ep3_laamp_decision_event.1061.desc_intro$\n\n[laamp_weaponsmith_craftsman.GetSheHe|U] เหลือบมองข้า จบบทสนทนาของ [laamp_weaponsmith_craftsman.GetHerHis] ทันที แล้วหันมาพูดกับข้าขณะที่ [laamp_weaponsmith_craftsman.GetSheHe] ชี้ไปที่อาวุธที่จัดแสดง: "นี่คือชิ้นส่วนที่ข้ามีขาย"\n\n"ชุบแข็งในเปลวไฟที่ร้อนแรงที่สุด" [laamp_weaponsmith_craftsman.GetSheHe] เสริม ด้วยน้ำเสียงภาคภูมิใจ"
 ep3_laamp_decision_event.1061.a: ""ข้าว่า [1061_first_weapon.GetNameNoTooltip] ดูเป็นตัวเลือกที่ดี""
 ep3_laamp_decision_event.1061.b: ""ข้าไม่รังเกียจ [1061_second_weapon.GetNameNoTooltip]""
 ep3_laamp_decision_event.1061.c: ""[1061_third_weapon.GetNameNoTooltip] คืออาวุธแบบ #EMP ข้า#!""
 ep3_laamp_decision_event.1061.d: "$ep3_laamp_decision_event.1021.d$"

 #Armorer
 ep3_laamp_decision_event.1063.t: "[visiting_location.GetBaronyNameExplicitlyNoTooltip]: ช่างทำเกราะ"
 ep3_laamp_decision_event.1063.desc_returned_01: "[laamp_armorer_craftsman.GetFirstName] กำลังพักจากการทุบตีที่น่าเบื่อ [laamp_armorer_craftsman.GetSheHe|U] เดินไปรอบๆ โรงตีเหล็ก ดูเหมือนกำลังมองหาอะไรบางอย่าง: "คีม" [laamp_armorer_craftsman.GetSheHe] คำราม "ไม่เคยอยู่ที่ที่เจ้าวางไว้เลย"\n\nจากนั้น [laamp_armorer_craftsman.GetFirstNameNoTooltip] ก็หันความสนใจ [laamp_armorer_craftsman.GetHerHis] มาที่ข้าและพยักหน้าไปทางชิ้นส่วนเกราะที่จัดแสดงอยู่: "ว่าไงล่ะ?""
 ep3_laamp_decision_event.1063.desc_returned_02: "เตาหลอมเย็นลงเล็กน้อยในครั้งนี้ เนื่องจาก [laamp_armorer_craftsman.GetFirstName] กำลังซ่อมแซมโลหะชิ้นอื่น ค่อยๆ นวดเหล็กกล้าให้อยู่ในโอวาทอย่างนุ่มนวล\n\nระวังไม่ให้รบกวนกระบวนการของ [laamp_armorer_craftsman.GetHerHis] ข้าเดินไปดูชิ้นส่วนเกราะที่นำเสนอบนโต๊ะทำงานต่อ\n\n"ต้องการการป้องกันสินะ ข้าเดา?" [laamp_armorer_craftsman.GetFirstNameNoTooltip] เอ่ยขึ้น ด้วยน้ำเสียงขบขัน"
 ep3_laamp_decision_event.1063.desc_reused_armorer: "โรงตีเหล็กของ [laamp_armorer_craftsman.GetFirstNamePossessive] ยังคงเหมือนเดิมที่ข้าจำได้ สายตาของข้าจับจ้องไปที่โต๊ะทำงานที่ปลายห้องทันที ที่ ซึ่ง [laamp_armorer_craftsman.GetSheHe] เก็บชิ้นส่วนเกราะสำหรับขายของ [laamp_armorer_craftsman.GetHerHis]\n\nดวงตาของ [laamp_armorer_craftsman.GetFirstNamePossessiveNoTooltip] กลายเป็นงุนงงขณะที่ [laamp_armorer_craftsman.GetSheHe] เงยหน้าขึ้นจากเกราะที่ [laamp_armorer_craftsman.GetSheHe] กำลังทำอยู่และจำข้าได้: "ลูกค้ากลับมา! เจอสิ่งที่ท่านชอบหรือยัง?""
 ep3_laamp_decision_event.1063.desc: "เตาหลอมร้อนแรงในโรงตีเหล็กของช่างทำเกราะ [laamp_armorer_craftsman.GetFirstNamePossessive] และอากาศก็หนาแน่นหายใจลำบาก\n\n[laamp_armorer_craftsman.GetSheHe|U] เหลือบมองข้าสั้นๆ ทุบค้อนครั้งสุดท้ายลงบนหมวกเกราะเอเวนเทลที่เรียบเนียนไร้ที่ติ แล้วเดินเข้ามาเช็ดมือของ [laamp_armorer_craftsman.GetHerHis]\n\n"ท่านสามารถดูสิ่งที่ข้ามีขายได้บนชั้นวางตรงนั้น" [laamp_armorer_craftsman.GetFirstNameNoTooltip] พูด พลางชี้ไปที่โต๊ะทำงานที่แข็งแรงที่ปลายห้อง"
 ep3_laamp_decision_event.1063.a: "[1063_first_armor.GetNameNoTooltip] มีความเงางามที่ดี"
 ep3_laamp_decision_event.1063.b: "ฝีมือการทำ [1063_second_armor.GetNameNoTooltip] นั้นประณีต"
 ep3_laamp_decision_event.1063.c: "มันสมเหตุสมผลที่จะได้ [1063_third_armor.GetNameNoTooltip]"
 ep3_laamp_decision_event.1063.d: ""ช่างมีพรสวรรค์! ท่านควรเข้าร่วมกับเรา""
 ep3_laamp_decision_event.1063.e: "$ep3_laamp_decision_event.1021.d$"
 #Jeweler
 ep3_laamp_decision_event.1065.t: "[visiting_location.GetBaronyNameExplicitlyNoTooltip]: ช่างทำอัญมณี"
 ep3_laamp_decision_event.1065.desc_returned_01: "ในที่พักของช่างทำอัญมณี [laamp_jeweler_craftsman.GetFirstName] กำลังโน้มตัวอยู่เหนือเข็มกลัดประดับอัญมณีรูปดอก [visiting_location.Custom('get_region_flower_type')] อันงดงาม เมื่อข้าเงี่ยหูฟัง ข้าได้ยินเสียงกระซิบอย่างหลงใหลของ [laamp_jeweler_craftsman.GetHerHis]: "ดอกไม้อันล้ำค่าของข้า แท้จริง..."\n\nข้ารีบก้าวไปข้างหน้า เพื่อให้แผ่นกระดานพื้นส่งเสียงเอี๊ยดอ๊าด และ [laamp_jeweler_craftsman.GetSheHe] ก็ตระหนักถึงการมีอยู่ของข้า\n\nตกใจ [laamp_jeweler_craftsman.GetFirstNameNoTooltip] รีบตั้งสติและประกาศ: "ท่านอีกแล้ว! พระเจ้า — ท่านเปลี่ยนใจแล้วหรือ?"
 ep3_laamp_decision_event.1065.desc_returned_02: "เมื่อข้ากลับมา [laamp_jeweler_craftsman.GetFirstName] ถือ [ROOT.Char.Custom('WritingInstrument')] กำลังตรวจสอบชั้นวางเครื่องประดับขณะจดบันทึกสินค้าคงคลังอย่างรวดเร็วในสมุดบันทึกที่ขาดรุ่งริ่ง\n\nเหลือบมองข้าสั้นๆ [laamp_jeweler_craftsman.GetSheHe] พูดว่า "กลับมาอีกแล้วสินะ? ท่านต้องการอันไหน?" แล้วเดินไปตรวจสอบชั้นวางที่เหลือ"
 ep3_laamp_decision_event.1065.desc_reused_jeweler: "ช่างทำอัญมณี [laamp_jeweler_craftsman.GetFirstName] กำลังอยู่ระหว่างการยึดเครื่องประดับ [visiting_location.Custom('GetRandomRegionalWood')] ของตุ๊กตาตัวเล็กๆ เมื่อข้าเข้าไปในที่พักที่มืดสลัว\n\n[laamp_jeweler_craftsman.GetSheHe|U] เงยหน้าขึ้น ตรวจสอบข้า แล้วฮัมเพลงอย่างชื่นชม: "ลูกค้ากลับมา ช่าง #EMP ล้ำค่า#! เสียจริง"\n\nยังคงถือตุ๊กตาตัวเล็กๆ อยู่ [laamp_jeweler_craftsman.GetFirstNameNoTooltip] ชี้ไปที่วัตถุที่จัดแสดง: "ครั้งนี้ท่านอาจสนใจอะไร?""
 ep3_laamp_decision_event.1065.desc: "ในแสงสลัวของที่พักของช่างทำอัญมณี [laamp_jeweler_craftsman.GetFirstName] ยืนอยู่เหนือเคาน์เตอร์สูง ขณะค่อยๆ วางของตก แต่งที่เล็กที่สุดลงบน [1065_first_accessory.GetName] อย่างนุ่มนวล\n\nข้าเฝ้าดูงานอันละเอียดอ่อนของ [laamp_jeweler_craftsman.GetHerHis] อย่างหลงใหลครู่หนึ่ง ก่อนจะกระแอม\n\n[laamp_jeweler_craftsman.GetSheHe|U] รับรู้ถึงการมีอยู่ของข้า ยืดตัวตรงและพูดอย่างครุ่นคิด: "กำลังมองหาเข็มกลัด? แหวน? หรือสร้อยคอ?" ขณะที่ [laamp_jeweler_craftsman.GetSheHe] ถือเครื่องประดับเล็กๆ ชิ้นหนึ่ง"
 ep3_laamp_decision_event.1065.a: ""ข้าไม่รังเกียจ [1065_first_accessory.GetNameNoTooltip] นั้น""
 ep3_laamp_decision_event.1065.b: ""[1065_second_accessory.GetNameNoTooltip] — ตอนนี้ #EMP นี่#! คือสิ่งที่เหมาะกับข้า""
 ep3_laamp_decision_event.1065.c: ""ข้าต้องการซื้อ [1065_third_accessory.GetNameNoTooltip]""
 ep3_laamp_decision_event.1065.d: "$ep3_laamp_decision_event.1021.d$"

 #Quartermaster
 ep3_laamp_decision_event.1067.t: "[visiting_location.GetBaronyNameExplicitlyNoTooltip]: พลาธิการ"
 ep3_laamp_decision_event.1067.desc_returned_01: "[laamp_quartermaster_recruit.GetFirstName] ยังคงนั่งอยู่ในมุมมืดของโรงเตี๊ยม จิบถ้วย [laamp_quartermaster_recruit.Custom('RegionalDrink')] ของ [laamp_quartermaster_recruit.GetHerHis] ราวกับว่ามันเป็นตั๋วสู่ความรอด\n\n[laamp_quartermaster_recruit.GetSheHe|U] แทบไม่เงยหน้าขึ้น ขณะที่ข้าค่อยๆ เดินฝ่าความมืดเข้าไปใกล้ [laamp_quartermaster_recruit.GetHerHim] "ท่านอีกแล้ว?" [laamp_quartermaster_recruit.GetSheHe] พึมพำ แล้วหันหน้าหนี"
 ep3_laamp_decision_event.1067.desc_returned_02: "[laamp_quartermaster_recruit.GetFirstName] กำลังโต้เถียงอย่างดุเดือดกับลูกค้ารายอื่นในโรงเตี๊ยม — [ROOT.Char.GetWomanMan] ร่างสูง ผิวคล้ำ ซึ่งดูเหมือนจะต้องการให้ [laamp_quartermaster_recruit.GetFirstNameNoTooltip] #EMP "เลิกคร่ำครวญ [laamp_quartermaster_recruit.GetHerHis] ได้แล้ว!"#!\n\nก่อนที่สถานการณ์จะตึงเครียดขึ้น [laamp_quartermaster_recruit.GetFirstNameNoTooltip] ก็สังเกตเห็นข้าและถอนตัวออกจากสถานการณ์ด้วยเสียงพ่นลมหายใจ\n\n"ท่านกลับมาแล้ว" [laamp_quartermaster_recruit.GetSheHe] ประกาศ พลางทำหน้าตาที่ดูมีสติอย่างน่าประหลาดใจ "ท่านต้องการอะไรอีกนะ?""
 ep3_laamp_decision_event.1067.desc_returned_03: "[laamp_quartermaster_recruit.GetFirstName] จ้องมองอย่างไร้จุดหมายขณะที่ข้ากลับไปที่โรงเตี๊ยม ใช้เวลาครู่หนึ่ง จากนั้น [laamp_quartermaster_recruit.GetSheHe] ก็กะพริบตา และค่อยๆ ส่ายศีรษะของ [laamp_quartermaster_recruit.GetHerHis]\n\nบริกรในโรงเตี๊ยมวางถ้วย [laamp_quartermaster_recruit.Custom('RegionalDrink')] อีกใบไว้หน้า [laamp_quartermaster_recruit.GetFirstNameNoTooltip] และ [laamp_quartermaster_recruit.GetSheHe] ก็เอนหลังพร้อมถอนหายใจอย่างหนัก ใช้ฝ่ามือของ [laamp_quartermaster_recruit.GetHerHis] ปิดตา\n\nข้าค่อยๆ เดินเข้าไปหาอดีตพลาธิการ กระแอมขณะทำ เช่นนั้น:"
 ep3_laamp_decision_event.1067.desc_reused_quartermaster: "ขณะที่ข้าพยายามนึกว่าเคยเห็น [laamp_quartermaster_recruit.GetFirstName] ที่ไหนมาก่อน ข้าก็ไม่มีปัญหาในการตาม [laamp_quartermaster_recruit.GetHerHim] เข้าไปในโรงเตี๊ยมมืดๆ ที่อยู่ใกล้เคียงแห่งหนึ่ง\n\nข้างใน [laamp_quartermaster_recruit.GetSheHe] เดินไปที่เคาน์เตอร์เพื่อหยิบเครื่องดื่ม แล้วหันกลับมามองข้าด้วยสายตาที่เฉียบคมอย่างน่าประหลาดใจ: "อย่าแสร้งทำเป็นว่าเราไม่เคยเจอกันมาก่อน"\n\nในคราวเดียว [laamp_quartermaster_recruit.GetSheHe] ก็ดื่มถ้วย [laamp_quartermaster_recruit.Custom('RegionalDrink')] จนหมดและเลิกคิ้วที่ชุ่มเหงื่อ: "ท่านต้องการอะไรหรือ?""
 ep3_laamp_decision_event.1067.desc: "ข้าตาม [laamp_quartermaster_recruit.GetFirstName] เข้าไปในโรงเตี๊ยมใกล้ๆ แสงสลัวลงและกลิ่นของเหลวเปรี้ยวๆ ก็ท่วมท้นประสาทสัมผัสของข้า\n\n[laamp_quartermaster_recruit.GetFirstNameNoTooltip] นั่งลงที่เคาน์เตอร์และโบกมือเรียกเครื่องดื่ม "ข้าเคยเป็นคนสำคัญ...," [laamp_quartermaster_recruit.GetSheHe] พูดซ้ำกับ [laamp_quartermaster_recruit.GetHerselfHimself] เหมือนบทสวดมนต์ ขณะใช้เล็บที่สึกกร่อนเคาะถ้วยของ [laamp_quartermaster_recruit.GetHerHis]\n\nข้าเดินเข้าไปหาพลาธิการผู้เสื่อมเสียและสูดหายใจลึกๆ ก่อนจะเริ่มพูดคุย:"
 ep3_laamp_decision_event.1067.a: "$ep3_laamp_decision_event.1047.a$"
 ep3_laamp_decision_event.1067.b: ""ข้ามีผู้ติดตามจำนวนมากให้ท่านจัดระเบียบ!""
 not_enough_followers.tt: "ท่านมี [followers|E] น้อยกว่า #V [EmptyScope.ScriptValue('many_followers_value')|0]#! คน"
 ep3_laamp_decision_event.1067.c: ""ข้าพนันได้เลยว่าท่านคงอยู่ไม่ถึง #EMP วัน#! ในค่ายของข้า""
 ep3_laamp_decision_event.1067.c.success: "[laamp_quartermaster_recruit.GetShortUIName] รับคำท้าของท่าน"
 ep3_laamp_decision_event.1067.c.failure: "ท่านชักจูง [laamp_quartermaster_recruit.GetShortUIName] ไม่สำเร็จ"
 ep3_laamp_decision_event.1067.c.failure.tt: "[laamp_quartermaster_recruit.GetShortUIName] เริ่มเมินท่าน"
 ep3_laamp_decision_event.1067.d: "$ep3_laamp_decision_event.1021.d$"

