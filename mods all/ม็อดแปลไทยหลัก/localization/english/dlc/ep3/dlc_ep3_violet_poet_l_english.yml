 ep3_story_cycle_violet_poet.0001.t: "เหมาะสำหรับตำแหน่งสูง"
 ep3_story_cycle_violet_poet.0001.desc: "เป็นเวลาหลายทศวรรษที่ข้าเดินตามรอยเท้าของเหล่าปัญญาชน และยืนหยัดต่อสู้กับความโกรธเกรี้ยวของบุรุษ บทกวีของข้ามีชื่อเสียงโด่งดังขึ้นอย่างไม่หยุดยั้ง ทว่า...\n\nมีบางอย่างขาดหายไป บัดนี้เมื่อวัยชรามาเยือนข้าแล้ว บางทีอาจถึงเวลาที่จะจาก [cordoba.GetName] และเปิดมุมมองให้กว้างขึ้นสู่โลกภายนอก?\n\nส่วนหนึ่งในตัวข้าที่แยกไม่ออกยังคงดึงรั้งหัวใจให้อยู่ต่อ ข้าได้สร้างชีวิตที่นี่ ไม่เพียง แต่เพื่อตนเอง แต่ยังเพื่อศิษย์มากมายที่ได้รับการฝึกฝนที่นี่ตลอดหลายปีที่ผ่านมา\n\nไม่ว่าจะเป็น เพราะเหล่านักปราชญ์ที่เดินขวักไขว่บนถนน หรือคราบความคุ้นเคยบนกำแพง #EMP บางสิ่ง#! ผูกมัดข้าไว้กับเมืองนี้ บ้านของข้า"
 ep3_story_cycle_violet_poet.0001.a: "ข้าจะอยู่ใน [cordoba.GetNameNoTooltip] ต่อไปก่อน"
 ep3_story_cycle_violet_poet.0001.a.tt: "นี่คือบ้านของข้า บางทีในชาติหน้าข้าอาจเดินไปอีกเส้นทางหนึ่ง"
 ep3_story_cycle_violet_poet.0001.b: "ถึงเวลาต้องจากไปแล้ว"
 ep3_story_cycle_violet_poet.0001.b.tt: "คิดถึงโอกาสทั้งหมดที่ยังรอผลิบานสิ!"
 ep3_story_cycle_violet_poet.0001.b.travel: "เริ่มการเดินทางของท่านไปยัง [toledo.GetName]"
 artifact_double_moon_book: "ตำราจันทร์คู่"
 artifact_double_moon_book_description: "ตำราหนาหนัก ประดับประดาอย่างหรูหรา เต็มไปด้วยบทกวี"
 artifact_double_moon_book_description_append: "$artifact_double_moon_book_description$ หน้ากระดาษบรรจุ:\n"

 ep3_story_cycle_violet_poet.0002.t: "สร้างมรดก"
 ep3_story_cycle_violet_poet.0002.desc: "มีสิ่งหนึ่งที่รบกวนจิตใจข้ามาหลายสัปดาห์แล้ว ใครกันที่จะสืบทอดมรดกของข้า? ใครจะยังคงเป็นผู้อุปถัมภ์ศิลปะ และฝึกฝนเยาวชนในแนวทางของพวกเขา?\n\nข้ามีสิ่งมากมายที่จะส่งต่อ: [double_moon_book.GetName] เป็นเรื่องง่ายแน่นอน แต่ก็มีอีกมากนอกเหนือจากนั้น มรดกสุดท้ายของตระกูล [ROOT.Char.GetHouse.GetName] เป็นข้อเสนอที่หนักหนายิ่งกว่าตำราเล่มหนานั้นเสียอีก\n\nแต่นั่นเป็นเพียงของที่ระลึกที่เลือนรางไปแล้ว สิ่งสำคัญที่สุดคือวิถีชีวิต พลังชีวิตของกวี เช่นข้า บทกวี ความรัก ความซาบซึ้งในโลกที่ [ROOT.Char.GetFaith.HighGodName] สร้างขึ้นรอบตัวเรา!\n\n#EMP นั่นแหละ#! คือสิ่งที่ข้าต้องค้นหา ใครบางคนที่เข้าใจกระแสที่จับต้องไม่ได้ของโลกใบนี้"
 ep3_story_cycle_violet_poet.0002.a: "น่าเสียดายที่บุคคล เช่นนั้นหาได้ยากยิ่ง"
 ep3_story_cycle_violet_poet.0002.a.tt: "ท่านครุ่นคิดถึงสถานการณ์..."
 ep3_story_cycle_violet_poet.0002.b: "ยังไม่จำเป็นต้องกังวลเรื่องนี้ในตอนนี้"
 ep3_story_cycle_violet_poet.0002.b.flavor: "... แม้ว่าข้าควรจะจัดการมัน #EMP ในไม่ช้า#!."
 ep3_story_cycle_violet_poet.0002.b.tt: "@alert_icon! #alert_trial หากท่านสิ้นชีพก่อนที่จะกำหนดทายาท ตระกูลของท่านอาจสิ้นสุดลง!#!"

 ep3_story_cycle_violet_poet.0003.t: "มีตัวเลือกมากมาย"
 ep3_story_cycle_violet_poet.0003.opening: "ข้าฟังด้วยหูข้างเดียวถึงการโต้เถียงทางกวีอย่างดุเดือดที่ลอยมาจากข้างนอก ข้าจะเลือกใครได้?\n\n"
 ep3_story_cycle_violet_poet.0003.poet: "[heir1.GetFirstName] เป็นต้น ความเข้าใจในฉันทลักษณ์ของ [heir1.GetHerHis|U] นั้นเป็นสัญชาตญาณและน่าประทับใจยิ่งนัก..."
 ep3_story_cycle_violet_poet.0003.diplomat: "[heir1.GetFirstName] เป็นต้น ความรักในบทกวีของ [heir1.GetHerHis|U] นั้นชัดเจนและเปี่ยมด้วยอารมณ์"
 ep3_story_cycle_violet_poet.0003.woman: "หรือบางทีอาจเป็น [heir2.GetFirstName]? ในฐานะ [heir2.GetWomanMan] อย่างน้อย [heir2.GetSheHe] ก็จะเข้าใจคำพูดของข้าอย่างลึกซึ้งเมื่อข้าจากไป"
 ep3_story_cycle_violet_poet.0003.young: "หรือบางทีอาจเป็น [heir2.GetFirstName]? จิตวิญญาณที่เยาว์วัยมีข้อดีหลายประการในด้านความอ่อนตัว"
 ep3_story_cycle_violet_poet.0003.heir3: "\n\nเสียงโต้คารมดังขึ้น คมคายและกระชับ ข้าสังเกตเห็น [heir3.GetFirstName] ผู้มาใหม่ในซาลอน กำลังจบบทกวีอันงดงาม [heir3.GetSheHe|U] ยังเยาว์วัย,"
 ep3_story_cycle_violet_poet.0003.intelligent: "เฉลียวฉลาดอย่างยิ่ง และ "
 ep3_story_cycle_violet_poet.0003.beautiful: "งดงามอย่างเห็นได้ชัด และ"
 ep3_story_cycle_violet_poet.0003.ending: "มีความสามารถด้านร้อยแก้วยิ่งนัก!\n\nตัดสินจากกลุ่มผู้ชื่นชมที่ [heir3.GetSheHe] รวบรวมไว้ได้ บางทีอาจเป็นบุคคลที่ค่อนข้าง #EMP มีรสนิยมทางเพศเดียวกัน#! [heir3.GetHerselfHimself] ด้วย..."
 ep3_story_cycle_violet_poet.0003.a: "[heir1.GetFirstNameNoTooltip] ต้องเป็นตัวเลือกของข้า"
 ep3_story_cycle_violet_poet.0003.b: "[heir2.GetFirstNameNoTooltip] จักเป็นทายาทของข้า"
 ep3_story_cycle_violet_poet.0003.c: "รู้อะไรไหม มีบางอย่างเกี่ยวกับ [heir3.GetFirstNameNoTooltip]..."

 ep3_story_cycle_violet_poet.0004.t: "ระลึกถึงด้วยความรัก"
 ep3_story_cycle_violet_poet.0004.desc: "โอ้ [wallada.GetFirstName]! อาจารย์ของข้า สหายของข้า แรงบันดาลใจของข้า ท่านใช้ชีวิตร้อยชาติในชั่วชีวิตเดียว แต่ก็ยังรู้สึกว่าไม่เพียงพอ\n\nข้าแกะห่อที่ [wallada.GetSheHe] ทิ้งไว้ให้ข้า ของขวัญชิ้นสุดท้ายของ [wallada.GetHerHis] ในบรรดาของขวัญมากมาย กระดาษห่อหลุดออกจาก [double_moon_book.GetName] ตำรากวีนิพนธ์ที่ [wallada.GetHerHis] ทะนุถนอมมานาน\n\n[wallada.GetFirstNameNoTooltip|U] พูดถึงการสืบทอดมรดกมานานแล้ว และบัดนี้ข้าเข้าใจแล้วว่ามรดกนั้นตกเป็นของข้าที่จะต้องสืบต่อไป ข้าต้องใช้ชีวิตให้เต็มที่ เหมือนที่ [wallada.GetSheHe] ทำ และรับเอาทุกความสุขที่มีให้ ข้าต้องบันทึกมันไว้ด้วย ในบทกวี ในหน้ากระดาษเหล่านี้"
 ep3_story_cycle_violet_poet.0004.a: "ข้าจะ ทำให้ดีที่สุด"

 ep3_story_cycle_violet_poet.0010.title: "ขายบทกวีมุวัชชะฮ์แล้ว"
 ep3_story_cycle_violet_poet.0011.title: "เก็บบทกวีมุวัชชะฮ์ไว้"
 ep3_story_cycle_violet_poet.0011.message: "[double_moon_book.GetName] ได้รับ Modifier แบบสุ่ม"
 ep3_story_cycle_violet_poet.0012.title: "แจกจ่ายบทกวีมุวัชชะฮ์แล้ว"

 #Story cycle events

 ep3_story_cycle_violet_poet.1000.t: "ความอุดมสมบูรณ์ของธรรมชาติ"
 ep3_story_cycle_violet_poet.1000.desc: "ดูเหมือนว่าการใช้เวลาอยู่ท่ามกลางธรรมชาติเป็นสิ่งที่ถูกต้อง ทิวทัศน์ เสียง และกลิ่นของอากาศบริสุทธิ์ล้วนส่งผลดีต่อความเป็นอยู่ของข้า\n\nระหว่างการเดินออกจากค่ายพักนี้เองที่ข้าบังเอิญพบบ่อน้ำพุที่สวยงามในป่า เสียงกระซิบอันเงียบสงบของลำธารที่ไหลรินและต้นไม้เขียวชอุ่มช่วยปลอบประโลมข้า จนกระทั่งข้ารู้ตัวว่าเวลาผ่านไปหลายชั่วโมงแล้ว\n\nข้ารู้สึกว่าท้องร้อง และความหิวก็เพิ่มมากขึ้น มีพืชกินได้บางชนิดที่ข้าเพิ่งเดินผ่านมาตามทาง แต่การอยู่คนเดียวและหิวโหยก็มีแง่มุมทางกวีบางอย่าง..."
 ep3_story_cycle_violet_poet.1000.a: "ความทุกข์ยากสร้างแรงบันดาลใจอันยิ่งใหญ่!"
 ep3_story_cycle_violet_poet.1000.a.book: "[double_moon_book.GetDesc]\n$EFFECT_LIST_BULLET$'เดินเล่นกลางหมู่ไม้'"
 ep3_story_cycle_violet_poet.1000.b: "ข้าควรหาเสบียง"

 ep3_story_cycle_violet_poet.1005.t: "ศิษย์เอก"
 ep3_story_cycle_violet_poet.1005.desc: "ขณะสำรวจถนนใน [location.GetName] ข้าพบว่าตัวเองหยุดอยู่ที่หน้าประตูสถานเลี้ยงเด็กกำพร้าแห่งหนึ่งในเมือง หูของข้าผึ่งด้วยความอยากรู้อยากเห็นกับเสียงท่องสัมผัสที่คุ้นเคย ลอยออกมาจากประตูที่เปิดอยู่\n\nข้าค่อยๆ เดินเข้าไปพิงกำแพง ฟังอย่างตั้งใจ เด็กกำพร้าคนหนึ่งกำลังต่อสู้ทางวาจากับอีกคนหนึ่ง ด้วยความทุ่มเทและทักษะอันน่าทึ่งอย่างแท้จริงสำหรับเด็กอายุเท่านี้\n\nเด็กคนนี้ใช้คำพูดราวกับดาบที่ลับคม ตัดผ่านคำพูดไร้สาระของคู่ต่อสู้\n\nไชโย ข้าขอกล่าว เยี่ยมยอดมาก!"
 ep3_story_cycle_violet_poet.1005.a: ""เจ้าหนู! เจ้าอยากได้ที่เรียนรู้หรือไม่?""
 ep3_story_cycle_violet_poet.1005.a.tt: "ข้า #EMP ต้อง#! รับพรสวรรค์ เช่นนี้ไว้ในอุปถัมภ์"
 ep3_story_cycle_violet_poet.1005.b: "ช่างเป็นเรื่องราวที่น่าสนใจ!"
 ep3_story_cycle_violet_poet.1005.b.book: "[double_moon_book.GetDesc]\n$EFFECT_LIST_BULLET$'กวีกำพร้า'"
 ep3_story_cycle_violet_poet.1005.c: "บางทีค่ายพักของข้าอาจไม่ใช่ที่สำหรับเด็ก"
 ep3_story_cycle_violet_poet.1005.c.tt: "แต่พรสวรรค์ของพวกเขานั้นแก่แดดเกินวัย ข้าต้องสนับสนุนมันเป็นอย่างน้อย!"

 ep3_story_cycle_violet_poet.1010.t: "ความโรแมนติกของบทกวี"
 ep3_story_cycle_violet_poet.1010.desc: "การได้รับเชิญเข้าสู่ราชสำนักของ [ruler.GetTitledFirstNamePossessiveRegnal] ถือเป็นเกียรติอย่างยิ่ง การได้แสดงบทกวีเก่าๆ ของข้าให้เขาฟัง ถือเป็นเกียรติที่ยิ่งใหญ่กว่านั้น\n\nอย่างไรก็ตาม เป็นการยากที่จะจดจ่อกับการกล่าวบทกวีของข้าเมื่อมีความงามอันเจิดจรัส เช่นนี้ยืนอยู่ตรงหน้าข้า [ruler_spouse.GetFirstName] [ruler_spouse.GetWifeHusband] ของ [ruler.GetFirstNamePossessiveNoTooltip] ดึงดูดสายตาข้า ช่างสง่างามโดดเด่น ช่างมีเสน่ห์น่าอัศจรรย์! ข้าพบว่าตัวเองหลงใหลใน [ruler_spouse.GetWomanMan] ผู้นี้\n\nความปรารถนาของข้าลึกซึ้ง ข้าต้องการรัก! ข้าต้องการเขียน!"
 ep3_story_cycle_violet_poet.1010.a: "บางทีข้าอาจเสนอ 'บทเรียนกวีส่วนตัว' ให้ [ruler_spouse.GetHerHim]..."
 ep3_story_cycle_violet_poet.1010.a.success: "[ruler_spouse.GetSheHe|U] ยินดีกับ 'วาทศิลป์เป็นจังหวะ' ของท่าน"
 ep3_story_cycle_violet_poet.1010.a.failure: "[ruler_spouse.GetSheHe|U] ปฏิเสธอย่างสุภาพ"
 ep3_story_cycle_violet_poet.1010.b: "เหตุใดโชคชะตาจึงต้องล่อลวงข้า เช่นนี้?"
 ep3_story_cycle_violet_poet.1010.b.book: "[double_moon_book.GetDesc]\n$EFFECT_LIST_BULLET$'ผลไม้ต้องห้าม'"
 ep3_story_cycle_violet_poet.1010.c: "ข้าต้องได้ [ruler_spouse.GetHerHim] มา!"
 ep3_story_cycle_violet_poet.1010.c.tt: "เพิ่ม [success_chance|E] ของ [scheme|E] [GetScheme('courting').GetTypeName] ของท่าน"

 ep3_story_cycle_violet_poet.1015.t: "ผู้ติดตามผู้หลงใหล"
 ep3_story_cycle_violet_poet.1015.desc: "เสียงเดินโซเซประกาศการมาถึงของคนแปลกหน้าท่ามกลางพวกเรา เหนื่อยล้าและอ่อนเพลีย ขณะที่ [stranger.GetSheHe] ใช้เวลาสักครู่จิบน้ำที่เรามอบให้และนั่งลงข้างกองไฟของเรา [stranger.GetSheHe] ก็เงยหน้ามองข้าด้วยรอยยิ้มอันเจิดจ้า\n\n "ท่านคือ [ROOT.Char.GetFirstNameNoTooltip] ใช่หรือไม่? ข้าตามหาท่านมาหลายวันแล้ว บทกวีของท่านเปลี่ยนชีวิตข้าในแบบที่ข้าไม่สามารถอธิบายเป็นคำพูดธรรมดาได้! คำพูดที่ข้าจินตนาการว่าท่านคง #EMP ไม่มี#! ปัญหาในการเรียบเรียง!"\n\nคิดไม่ถึงว่าคนผู้นี้ตามหาข้ามาหลายวัน เพียงเพื่อจะชมข้า? มีบางอย่างที่งดงามอย่างโรแมนติกเกี่ยวกับการอุทิศตนที่แสดงออกมานี้"
 ep3_story_cycle_violet_poet.1015.a: ""ข้าควรขอบคุณท่าน #EMP อย่างเหมาะสม#!""
 ep3_story_cycle_violet_poet.1015.a.success: "[stranger.GetSheHe|U] ตกลงอย่างกระตือรือร้น"
 ep3_story_cycle_violet_poet.1015.a.failure: "[stranger.GetSheHe|U] จากไปด้วยความรังเกียจ"
 ep3_story_cycle_violet_poet.1015.b: "เราน่าจะต้องการนักเดินทางรอบโลก เช่นนี้มาช่วยงาน"
 ep3_story_cycle_violet_poet.1015.c: "ช่างเป็นคำพูดที่ไพเราะ!"

 ep3_story_cycle_violet_poet.1020.t: "หมอกที่บดบังทุกสิ่ง"
 ep3_story_cycle_violet_poet.1020.desc: "ข้าถูกสาป! แม้จะพยายามอย่างเต็มที่แล้ว แต่หลายวันที่ผ่านมากลับเต็มไปด้วยหมอกที่ไม่สิ้นสุด ซึ่งบดบังความคิดของข้า\n\nไม่มีคำพูดใดหลั่งไหลลงบนหน้ากระดาษ ไม่มีความทุ่มเทโรแมนติก ไม่มีคำพูดบาดใจ ดูเหมือนว่าช่วงเวลาแห่งแรงบันดาลใจของข้าจะสิ้นสุดลงแล้วในที่สุด\n\nข้าควรทำอย่างไร? ข้าจะปลดปล่อยตัวเองจากการทรมานทางปัญญานี้ได้อย่างไร!"
 ep3_story_cycle_violet_poet.1020.a: "ข้าต้องการใครสักคนมาป้อนความคิดให้ข้า"
 ep3_story_cycle_violet_poet.1020.a.tt: "ท่านไม่มี [followers|E] ที่มี [diplomacy|E] เกิน #high 20#! "
 ep3_story_cycle_violet_poet.1020.a.book: "[double_moon_book.GetDesc]\n$EFFECT_LIST_BULLET$'มือที่ช่วยเหลือ'"
 ep3_story_cycle_violet_poet.1020.b: "ข้าสามารถผ่านมันไปได้!"
 ep3_story_cycle_violet_poet.1020.b.success: "มันได้ผล"
 ep3_story_cycle_violet_poet.1020.b.failure: "มันไม่ได้ผล"
 ep3_story_cycle_violet_poet.1020.c: "บางทีอาจถึงเวลาพักผ่อน?"
 ep3_story_cycle_violet_poet.1020.c.success: "ท่านพบสถานที่แห่งความสงบ"
 ep3_story_cycle_violet_poet.1020.c.failure: "จิตใจของท่านยังคงมัวหมอง"

 ep3_story_cycle_violet_poet.1025.t: "คนรุ่นต่อไป"
 ep3_story_cycle_violet_poet.1025.desc: "ข้าใช้เวลาส่วนใหญ่อยู่ที่ซาลอนของข้า แต่ส่วนที่เหลืออีกมากใช้ไปกับการเดินเตร่ไปตามถนนของ [location.GetName] อย่างหลีกเลี่ยงไม่ได้ สิ่งนี้มักนำข้าไปยังสถานเลี้ยงเด็กกำพร้า ที่ ซึ่งเด็กๆ ผู้โชคร้ายเหล่านั้นที่พลัดพรากจากบ้าน เนื่องจากสงคราม ความอดอยาก หรือแม้กระทั่งถูกทอดทิ้ง ได้รับการดูแล\n\nวันนี้ มีใบหน้าใหม่หลายคนปรากฏบนสนามเด็กเล่นของพวกเขา หัวใจของข้า อย่างเคย ร่ำไห้ให้กับดวงวิญญาณที่น่าสงสารเหล่านี้ พวกเขามากมายเหลือเกิน...\n\nเสียงเล็กๆ อู้อี้ทำลายความเงียบ เด็ก [orphan.Custom('GirlBoy')] ตัวเล็กๆ นั่งอยู่ตรงมุม ท่องบทกวีจากเศษกระดาษเก่าๆ ช่างเยาว์วัย และเห็นได้ชัดว่าไม่ได้รับการสอน แต่เด็กเหล่านี้อาจมีศักยภาพที่แท้จริง..."
 ep3_story_cycle_violet_poet.1025.a: "ข้าไม่อาจปล่อยให้ศักยภาพนั้นสูญเปล่าไปได้"
 ep3_story_cycle_violet_poet.1025.a.tt: "ข้าต้องรับเลี้ยงพวกเขาทั้งหมด!"
 1025_every_orphan: "เด็กกำพร้าทุกคน"
 ep3_story_cycle_violet_poet.1025.b: "ข้ารับเลี้ยงได้เพียงคนเดียว..."
 ep3_story_cycle_violet_poet.1025.b.tt: "ดังนั้นข้าต้อง ทำให้คนนี้ประสบความสำเร็จ"
 ep3_story_cycle_violet_poet.1025.b.success: "การเลี้ยงดูของท่านเกิดผล"
 ep3_story_cycle_violet_poet.1025.c: "ผู้ปกครองท้องถิ่นต้องดูแลพวกเขา"
 ep3_story_cycle_violet_poet.1025.c.tt: "บางทีการ ทำให้ [holder.GetHerHim] อับอายอาจได้ผล..."
 ep3_story_cycle_violet_poet.1025.c.success: "[holder.GetTitledFirstNameNoTooltip] ยอมรับภาระ"
 ep3_story_cycle_violet_poet.1025.c.failure: "[holder.GetTitledFirstNameNoTooltip] ปฏิเสธที่จะจ่าย"

 ep3_story_cycle_violet_poet.1030.t: "ผู้ยิ่งใหญ่และผู้ดี"
 ep3_story_cycle_violet_poet.1030.desc: "หมายเรียกจากราชสำนักขุนนางเป็นสิ่งที่ต้องปฏิบัติตาม ดังนั้นข้าจึงพบว่าตัวเองอยู่ในวังที่สวยงามแห่งหนึ่งของ [location.GetName] ผู้ที่ทักทายข้าคือ [noblewoman.GetFirstName] ซึ่งอยู่ในอาการตื่นเต้นอย่างมาก\n\n"เป็นเกียรติอย่างยิ่งที่ได้พบท่าน!" [noblewoman.GetSheHe|U] โพล่งออกมา "ข้าพบว่าตัวเองต้องการการสอนพิเศษ ท่านเห็นไหม..."\n\nปรากฏว่า [noblewoman.GetFirstNameNoTooltip] พยายามศึกษาบทกวี แต่ประสบความสำเร็จเพียงเล็กน้อย ความสำเร็จที่จำกัด เช่นนี้ อันที่จริง อาจ ทำให้ข้ามี #EMP ข้อได้เปรียบ#! บางอย่าง..."
 ep3_story_cycle_violet_poet.1030.a: "ข้าจะสอนท่านเอง"
 ep3_story_cycle_violet_poet.1030.b: "น่าเสียดาย ข้าไม่สามารถสละเวลาได้"
 ep3_story_cycle_violet_poet.1030.c: "บางทีข้าอาจเสนอครูสอนพิเศษคนอื่นได้?"
 ep3_story_cycle_violet_poet.1030.c.tt: "ให้ข้าเล็กน้อย ให้ [courtier_poet.GetFirstNameNoTooltip] เล็กน้อยสำหรับความลำบากของ [courtier_poet.GetHerHis]..."

 ep3_story_cycle_violet_poet.2000.t: "เมื่อใดก็ตามที่ความมืดมิดมาเยือน"
 ep3_story_cycle_violet_poet.2000.desc: "เมื่อวันเวลาผ่านไป ข้าพบว่าตัวเองกำลังหวนนึกถึงความสัมพันธ์ในวัยเยาว์ ชื่อหนึ่งผุดขึ้นมาในใจเป็นพิเศษ [zaydun.GetFirstName] อิบัน ซัยดูน พวกเขาเรียก [zaydun.GetHerHim] เช่นนั้น ด้วยปฏิภาณอันเฉียบแหลมและลิ้นเงินลิ้นทองของ [zaydun.GetHerHis]\n\nอา วันเวลาเหล่านั้นที่ใช้ส่งบทกวีไปมา เดินทางข้ามดินแดนเพียงเพื่อใช้เวลาค่ำคืนหนึ่งด้วยกัน มัน ทำให้ข้าคิดถึงอดีต ความสัมพันธ์ของเราอาจไม่สมบูรณ์แบบ แต่ความทรงจำเหล่านั้นยังคงอยู่ในใจข้าอย่างอบอุ่น\n\nข้าไม่ได้พบ [zaydun.GetHerHim] มานานหลายปีแล้ว ข้าช่างรุนแรงในการจากลาของเรา ช่างเสียดสี ความเสียใจนั้นหนักอึ้งอยู่ในใจข้า"
 ep3_story_cycle_violet_poet.2000.a: "บางทีข้าควรเขียนจดหมายถึง [zaydun.GetHerHim]..."
 ep3_story_cycle_violet_poet.2000.a.tt: "เขียนจดหมายถึงคนรักเก่าของท่าน"
 ep3_story_cycle_violet_poet.2000.a.book: "[double_moon_book.GetDesc]\n$EFFECT_LIST_BULLET$'โซ่ตรวนแห่งความโหยหา'"
 ep3_story_cycle_violet_poet.2000.b: "บทกวีเพื่อรำลึกถึงรักที่สูญเสียไป นั่นจะช่วยปลอบประโลมจิตวิญญาณของข้า"
 ep3_story_cycle_violet_poet.2000.c: "วันเวลาเหล่านั้นผ่านไปแล้ว ข้าควรจะก้าวต่อไป"

 ep3_story_cycle_violet_poet.2001.t: "ถึงดวงจันทร์ในท้องฟ้ายามค่ำคืนของข้า,"
 ep3_story_cycle_violet_poet.2001.desc: "ข้ารอคอยมานาน แม้เพียงการเอ่ยชื่อข้าเพียงแวบเดียวบนริมฝีปากของท่าน\n\nร่างกายของข้าแก่ชราลง แต่หัวใจของข้ายังคงนิ่งเฉยเหมือนในวินาทีที่ท่านจากไป แข็งทื่อ แตกสลาย มันรอคอยสัมผัสของท่านเพื่อเต้นอีกครั้ง"
 ep3_story_cycle_violet_poet.2001.a: "โอ้ [zaydun.GetFirstNameNoTooltip] ที่รักของข้า..."
 ep3_story_cycle_violet_poet.2001.a.flavor: "ข้าต้องพบ [zaydun.GetHerHim] อีกครั้ง"
 ep3_story_cycle_violet_poet.2001.a.tt: "เชิญ [zaydun.GetFirstNameNoTooltip] มาเยี่ยม"
 ep3_story_cycle_violet_poet.2001.b: "นั่น... มากไปหน่อย"

 ep3_story_cycle_violet_poet.2005.t: "กลับมาพบกันอีกครั้ง"
 ep3_story_cycle_violet_poet.2005.desc: "ทันใดนั้น [zaydun.GetSheHe] ก็ยืนอยู่ที่ประตู กาลเวลาเปลี่ยน [zaydun.GetHerHim] ไปมาก แต่ ทว่า... ไม่เลย มีริ้วรอยบนใบหน้าของ [zaydun.GetHerHis] มากขึ้น แต่มันก็ยังคงเป็นใบหน้าของ [zaydun.GetHerHis] ท่าทางของ [zaydun.GetHerHis|U] โค้งงอลงเล็กน้อย แต่มันก็ยังคงเป็นร่างที่กอดข้าไว้แน่นเมื่อนานมาแล้ว แม้กระทั่งท่าทางที่ [zaydun.GetSheHe] เคลื่อนไหว...\n\nและ [zaydun.GetSheHe] ก็เคลื่อนไหวจริงๆ ลดระยะห่างระหว่างเราในเวลาเพียงครู่เดียว แล้วข้าก็อยู่ในอ้อมแขนของ [zaydun.GetHerHis] อีกครั้ง ความรู้สึกที่ห่างไกลเหลือเกิน ชุ่มโชกไปด้วยฝุ่นผงแห่งกาลเวลาและเลือนรางไปตามแสงแห่งความทรงจำ แต่ ทว่าคุ้นเคยอย่างใกล้ชิด\n\nขณะที่เราผละออกจากกันอย่างไม่เต็มใจ ข้ารู้สึกเหมือนส่วนหนึ่งของข้าที่ข้าไม่รู้ด้วยซ้ำว่าหายไป ได้กลับคืนมาทันที บาดแผลเก่าถูกเย็บปิด"
 ep3_story_cycle_violet_poet.2005.a: ""ข้าไม่อยากจะเชื่อเลยว่าเป็นท่านจริงๆ""
 ep3_story_cycle_violet_poet.2005.a.tt: "ข้าต้องไม่ปล่อยให้ตัวเองตกหลุมรักอีกครั้ง..."
 ep3_story_cycle_violet_poet.2005.b: "เอาล่ะ การปรากฏตัวของเขาเพียงอย่างเดียวก็ช่วยยกระดับซาลอนของข้าได้..."

 ep3_story_cycle_violet_poet.2010.t: "งานประพันธ์ร่วม"
 ep3_story_cycle_violet_poet.2010.desc: "เรานั่งหัวเราะกัน เหมือนวันเก่าๆ ดื่มชาในร่มเงา ปฏิภาณและสติปัญญาของ [zaydun.GetFirstNamePossessive] ยังคงเฉียบคม และวัยชราก็ไม่ได้ลดทอนเสน่ห์ที่ [zaydun.GetSheHe] เคยใช้เกี้ยวข้าเลย\n\n"ท่านมีอะไรที่นี่?" [zaydun.GetSheHe|U] ถาม พลางชี้ไปที่ [double_moon_book.GetName] ที่วางอยู่บนโต๊ะข้างข้า ข้ายื่นมันให้\n\n"นี่เป็นงานที่สวยงาม งานของท่านยังคงงดงามเหมือนเคย" รอยยิ้มยินดีของ [zaydun.GetHerHis|U] ทำให้ข้าสั่นเล็กน้อย ยังคงเป็น เช่นนั้น "ข้าไม่คิดว่าท่านจะเต็มใจเขียนงานร่วมกันในอีกไม่กี่วันข้างหน้าใช่ไหม? สมมติว่า [zaydun.GetWomanMan] แก่ๆ คนนี้ยังตามท่านทันอยู่ แน่นอน""
 ep3_story_cycle_violet_poet.2010.a: ""เราทั้งคู่แก่แล้ว [zaydun.GetFirstNameNoTooltip] แต่ด้วยวัยที่มากขึ้นก็มาพร้อมกับปัญญา""
 ep3_story_cycle_violet_poet.2010.b: ""ข้าทำงานคนเดียว""

 ep3_story_cycle_violet_poet.2015.t: "อำลา อีกครั้ง"
 ep3_story_cycle_violet_poet.2015.desc: "หลายวันที่ผ่านมาเป็นช่วงเวลาที่มีความสุขที่สุดในชีวิตของข้า แต่ทุกสิ่งย่อมมีวันสิ้นสุด คนรับใช้ถือของใช้ของ [zaydun.GetFirstNamePossessive] ผ่านเราไปขณะที่เรากล่าวคำอำลา [zaydun.GetSheHe|U] กุมมือข้าไว้ในมือของ [zaydun.GetHerHis]\n\n"การได้พบท่านอีกครั้งนำแสงสว่างกลับมาสู่ชีวิตข้า" [zaydun.GetSheHe|U] พูดขาดช่วง นักประพันธ์คำที่โด่งดังที่สุดในไอบีเรียกลับพูดไม่ออกกะทันหัน แทนที่จะพูด [zaydun.GetSheHe] ล้วงเข้าไปในกระเป๋าของ [zaydun.GetHerHis] และยัดบางอย่างใส่มือข้า\n\n"โปรดรับสิ่งนี้ไป มันไม่มีค่าอะไร เป็นเพียงเครื่องประดับเล็กน้อย แต่... หากท่านสวมมันในบางโอกาส มันจะนำความสุขมาสู่หัวใจข้าอย่างยิ่ง การเติมเต็มมันด้วยนิ้วของท่าน ก็จะเติมเต็มช่องว่างในหัวใจข้าที่ความทรงจำของท่านอาศัยอยู่""
 ep3_story_cycle_violet_poet.2015.a: ""...อยู่กับข้า ที่นี่ ใน [ROOT.Char.GetCurrentLocation.GetNameNoTooltip] ท่าน #EMP ต้องอยู่#!""
 ep3_story_cycle_violet_poet.2015.artifact: "[newly_created_artifact.GetDesc]\n\nมันเป็นการออกแบบที่เรียบง่าย ยกเว้นรายละเอียดหนึ่ง: มีคำจารึกเล็กๆ ด้านในว่า "แด่ที่รักของข้า ความฝันสุดท้ายแห่งจิตวิญญาณข้า""
 ep3_story_cycle_violet_poet.2015.a.success: "[zaydun.GetSheHe|U] ตกลงที่จะอยู่ต่อ"
 ep3_story_cycle_violet_poet.2015.a.failure: "[zaydun.GetSheHe|U] ปฏิเสธ และจากไป"
 ep3_story_cycle_violet_poet.2015.b: "จนกว่าเราจะพบกันใหม่ รักที่สูญเสียไปของข้า"
 ep3_story_cycle_violet_poet.2015.b.tt: "...หากเราจะได้พบกันอีกครั้ง"
 ep3_story_cycle_violet_poet.2015.c: "ข้าไม่อาจให้อภัยความผิดพลาดในอดีตได้"
 ep3_story_cycle_violet_poet.2015.c.tt: "ความรู้สึกผิดกัดกินท่าน"

 story_cycle_violet_poet: "กวีสีม่วง"
 story_cycle_violet_poet_desc: "ท่านคือธิดาของเคาะลีฟะฮ์แห่งกอร์โดบา และเป็นหนึ่งในอุมัยยะฮ์คนสุดท้าย ท่านก้าวเดินอย่างเปิดเผยผ่านโลกที่เข้มงวด ช่วยลับคมสติปัญญาของสตรีจากทุกชนชั้น"
