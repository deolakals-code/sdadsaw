 game_concept_task_contracts_i: "@task_contract_icon!"
 game_concept_task_contract: "สัญญาจ้าง"
 game_concept_task_contracts: "สัญญาจ้าง"
 game_concept_task_contract_possessive: "ของสัญญาจ้าง"
 game_concept_task_contracts_possessive: "ของสัญญาจ้าง"
 game_concept_task_contract_desc: "$game_concept_task_contracts$ เป็นวิธีหลักที่ [adventurers|E] หา [gold|E] หรือ [prestige|E] พวกเขายังสามารถให้รางวัลเป็น [provisions|E], [piety|E] และแม้กระทั่ง [artifacts|E]\n\nแต่ละสัญญาเป็นงานที่ออกโดย [ruler|E] ในท้องถิ่น — โดยทั่วไปต้องการให้ $game_concept_adventurer$ ทำ [scheme|E], เสร็จสิ้น [travel|E] หรือช่วยพวกเขาใน [war|E] — และสามารถรับทำเพื่อรับรางวัลและเพิ่ม [contractor|E] ลงใน [contact_list|E]\n\n$game_concept_task_contracts$ เพิ่มเติมจะเกิดขึ้นจากการเดินทางระยะไกลหรือไปยัง [kingdoms|E] ใหม่\n\nยิ่ง [title_tier|E] หรือ $game_concept_ruler$ ที่เสนอ $game_concept_task_contract$ สูงเท่าใด [task_contract_tier_tier|E] ของ $game_concept_task_contract_possessive$ ก็จะยิ่งสูงขึ้นเท่านั้น ระดับที่สูงขึ้นจะจ่ายดีกว่า #EMP อย่างมาก#! \n\n#alert_trial ระวัง [criminal_task_contracts|E]: รางวัลของพวกเขามักจะยอดเยี่ยม แต่โลกมีความเข้าใจน้อยกว่ามากสำหรับอาชญากรรมเล็กน้อยของคนจรจัดไร้บ้านบางคน มากกว่า [liege|E] ที่มี [landed|E]#!"

 game_concept_task_contract_tier_i: "@task_contract_tier_icon!"
 game_concept_task_contract_tier: "ระดับ $TASK_CONTRACT_CONTRACT$"
 game_concept_task_contract_tier_tier: "ระดับ"
 game_concept_task_contract_tier_desc: "$game_concept_task_contract_tier$ สะท้อนถึง [title_tier|E] ของ [contractor|E]\n\n[barons|E] และ [counts|E] คือหนึ่งดาว, [dukes|E] คือสองดาว และ [kings|E] และ [emperors|E] คือสามดาว\n\n$game_concept_contractors$ จะไม่เสนองานให้กับ [adventurers|E] ที่มี [prestige_level|E] ไม่เพียงพอสำหรับ [rank|E] ของพวกเขา หากคุณเป็น #EMP เพียง#! [GetModifier( 'prestige_level_1' ).GetNameWithTooltip|L], [kings|E] และ [emperors|E] ก็จะไม่พิจารณาคุณเลย\n\nยิ่ง $game_concept_task_contract_tier$ สูงเท่าใด ค่าจ้างก็จะยิ่งสูงขึ้นเท่านั้น — แม้ว่าความยากของงานโดยทั่วไปก็จะสูงขึ้นด้วย\n\n#WEAK [personality|E] ยังส่งผลต่อค่าจ้างด้วย: [characters|E] ที่ [GetTrait('greedy').GetName( GetNullCharacter )] จะจ่ายต่ำกว่าอัตราปกติ, $game_concept_characters$ ที่ [GetTrait('generous').GetName( GetNullCharacter )] หรือ [GetTrait('profligate').GetName( GetNullCharacter )] จะจ่ายสูงกว่ามาก#! "

 game_concept_governance_issue_i: "@task_contract_icon!"
 game_concept_governance_issue: "$TASK_CONTRACT_ISSUE$" # ปัญหาการปกครอง
 game_concept_governance_issues: "$TASK_CONTRACT_ISSUE_PLURAL$" # ปัญหาการปกครอง
