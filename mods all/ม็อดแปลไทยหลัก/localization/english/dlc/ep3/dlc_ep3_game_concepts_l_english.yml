l_english: 
 game_concept_administrative_government: "ระบอบการปกครองแบบบริหาร"
 game_concept_administrative_governments: "ระบอบการปกครองแบบบริหาร"
 game_concept_administrative: "แบบบริหาร"
 game_concept_administrative_i: "@government_type_administrative!"
 game_concept_administrative_desc: "$game_concept_administrative$ คือ [government_form|E] แบบ [government_bureaucratic_type|E] ที่ แต่งตั้ง [characters|E] ให้เป็น [governors|E] เพื่อจัดการและดูแลดินแดนที่เรียกว่า [provinces|E] ในนามของ [liege|E] ของพวกเขา\n\nตัวละคร $game_concept_administrative$ สามารถเข้าถึง [influence|E] และบางคนก็มี [family_estate|E] ส่วนตัวด้วย\n\nมีเพียง [rulers|E] [independent|E] ของ [realm|E] $game_concept_administrative$ เท่านั้นที่มี [legitimacy|E] ในขณะที่ [vassals|E] ไม่มี\n\n$admin_cannot_declare_internal_wars$"
 game_concept_imperial_bureaucracy: "ระบบข้าราชการส่วนกลาง"
 game_concept_imperial_bureaucracy_desc: "$game_concept_imperial_bureaucracy$ แสดงถึงระดับการรวมศูนย์อำนาจของ [realms|E] แบบ [administrative|E] และอำนาจโดยรวมที่ [ruler|E] มีเหนือ [vassals|E] ของตน\n\nมีเพียง [top_liege|E] เท่านั้นที่สามารถเปลี่ยนแปลง $game_concept_imperial_bureaucracy$ ได้ $game_concept_vassals$ แบบบริหารจะใช้ระดับเดียวกับ $game_concept_liege$ ของตน\n\n$game_concept_imperial_bureaucracy$ มีสี่ระดับ:\n$EFFECT_LIST_BULLET$$imperial_bureaucracy_0$\n$EFFECT_LIST_BULLET$$imperial_bureaucracy_1$\n$EFFECT_LIST_BULLET$$imperial_bureaucracy_2$\n$EFFECT_LIST_BULLET$$imperial_bureaucracy_3$\n\nการเพิ่มระดับ $game_concept_imperial_bureaucracy$ ต้องใช้ [prestige|E] จำนวนหนึ่ง ซึ่งขึ้นอยู่กับ [realm_size|E] และ [learning_skill|E] ของผู้ปกครอง"
 game_concept_governor: "ข้าหลวง"
 game_concept_governor_possessive: "ของผู้ว่าการ"
 game_concept_governors: "ข้าหลวง"
 game_concept_governors_possessive: "ของเหล่าผู้ว่าการ"
 game_concept_governed: "ถูกปกครอง"
 game_concept_strategos: "สตราเตกอส"
 game_concept_strategos_possessive: "ของสตราเตกอส"
 game_concept_strategoi: "เหล่าสตราเตกอส"
 game_concept_strategoi_possessive: "ของเหล่าสตราเตกอย"
 game_concept_governorship: "ตำแหน่งข้าหลวง"
 game_concept_governorships: "ตำแหน่งข้าหลวง"
 game_concept_governor_desc: "$game_concept_governor$ คือข้าหลวงหลักของ [liege|E] ซึ่งมี [government_bureaucratic_gov|E] พวกเขาได้รับการ แต่งตั้งจากเจ้าเหนือหัวเพื่อปกครองดูแลดินแดนภายใน [realm|E] โดยใช้ [governor_efficiency|E] ของตน\n\n[title|E] ของ $game_concept_governor$ ตลอดจน [counties|E] ที่รวมอยู่ด้วยนั้น จะถูกเรียกว่า [province|E] [governance_issues|E] อาจปรากฏขึ้นภายในมณฑล ซึ่ง $game_concept_governor$ ต้องแก้ไข\n\n$game_concept_governors$ สามารถสะสม [influence|E] และแทรกแซง [succession|E] ของ $game_concept_governorships$ อื่นได้"
 game_concept_candidate_score: "คะแนนผู้ท้าชิง"
 game_concept_candidate_scores: "คะแนนผู้สมัคร"
 game_concept_candidate_score_desc: "[characters|E] ใน [line_of_succession|E] สำหรับ [title|E] ที่มี [administrative_government|E] จะมี $game_concept_candidate_score$\n\nคะแนนนี้กำหนดว่าใครจะได้รับตำแหน่งเมื่อเกิด [succession|E] และสามารถเปลี่ยนแปลงได้ด้วยวิธีการต่างๆ ตั้งแต่ [scheming|E] ไปจนถึงการใช้ [influence|E]"
 game_concept_influence: "อิทธิพล"
 game_concept_influence_desc: "$game_concept_influence$ แสดงถึงขอบเขตทางการเมืองและอำนาจของ [character_possessive|E] ใน [realm|E] ที่มี [administrative_government|E]\n\n$game_concept_influence$ เป็นเครื่องมือสำคัญและสามารถได้มาหลายวิธี เช่น การเป็น [governor|E] การอัปเกรด [estate|E] หรือการเป็นพันธมิตรกับ [house_head|E] ของ [noble_family|E]\n\nวิธีหลักในการใช้ $game_concept_influence$ คือการได้มา ซึ่ง [governorship|E] แต่ก็เป็นทรัพยากรที่มีค่าในการชักจูงตัวละครอื่นให้ทำตามความประสงค์ของคุณ\n\nทุกครั้งที่ตัวละครได้รับ $game_concept_influence$ พวกเขาก็จะมีความคืบหน้าไปสู่ [influence_level|E] ถัดไปด้วย"
 game_concept_influence_i: "@influence_icon!"
 game_concept_influential: "ผู้มีอิทธิพล"
 game_concept_influence_level: "ระดับอิทธิพล"
 game_concept_influence_level_desc: "ระดับอิทธิพลของ [character_possessive|E] วัดอำนาจทางการเมืองและขอบเขตอิทธิพลโดยรวม\n\nแต่ละครั้งที่ตัวละครได้รับ [influence|E] พวกเขาก็จะได้รับความคืบหน้าไปสู่ $game_concept_influence_level$ ถัดไป\n\nระดับต่างๆ คือ:\n$EFFECT_LIST_BULLET$[GetModifier( 'influence_level_0' ).GetNameWithTooltip|L]\n$EFFECT_LIST_BULLET$[GetModifier( 'influence_level_1' ).GetNameWithTooltip|L]\n$EFFECT_LIST_BULLET$[GetModifier( 'influence_level_2' ).GetNameWithTooltip|L]\n$EFFECT_LIST_BULLET$[GetModifier( 'influence_level_3' ).GetNameWithTooltip|L]\n$EFFECT_LIST_BULLET$[GetModifier( 'influence_level_4' ).GetNameWithTooltip|L]\n$EFFECT_LIST_BULLET$[GetModifier( 'influence_level_5' ).GetNameWithTooltip|L]"
 game_concept_influence_levels: "ระดับอิทธิพล"
 game_concept_influence_level_impact: "ผลกระทบระดับอิทธิพล"
 game_concept_influence_level_impact_desc: "ผลกระทบระดับอิทธิพล จะเพิ่มหรือลด [modifiers|E] ที่ได้รับจาก [influence_level|E] ปัจจุบันของท่าน"
 game_concept_title_men_at_arms: "ทหารประจำตำแหน่ง"
 game_concept_title_men_at_arms_desc: "$game_concept_title_men_at_arms$ คือ [men_at_arms|E] ที่มีอยู่สำหรับ [title|E] ที่กำหนด แทนที่จะเป็นของ [ruler|E] โดยส่วนตัว กองกำลังเหล่านี้จะติดตาม $game_concept_title$ ที่ตนสังกัดอยู่เสมอ หมายความว่าใครก็ตามที่เป็นเจ้าของ $game_concept_title$ ก็จะเป็นเจ้าของและควบคุมกองกำลังที่เกี่ยวข้องด้วย\n\n$game_concept_title_men_at_arms$ ถูกใช้โดย [government_forms|E] บางรูปแบบ เช่น [administrative|E]"
 game_concept_domicile: "ถิ่นพำนัก"
 game_concept_domiciles: "ถิ่นพำนัก"
 game_concept_domicile_desc: "$game_concept_domicile$ คือทรัพย์สินส่วนบุคคลของ [characters|E] บางรายที่มี [government_form|E] เฉพาะ เช่น [administrative|E] และ [adventurer|E]\n\n$game_concept_domicile$ ทำหน้าที่เป็นฐานอำนาจหลักของผู้เป็นเจ้าของแทน [holdings|E] และสามารถปรับปรุงได้ด้วย [domicile_buildings|E]\n\n$game_concept_domicile$ ทุกแห่งตั้งอยู่ภายใน [barony|E] ที่กำหนดไว้ และอาจย้ายไปยังที่ตั้งใหม่ได้ อาจมีข้อจำกัดบังคับใช้ขึ้นอยู่กับประเภทของ $game_concept_domicile$\n\n$game_concept_domicile$ แต่ละแห่งมี [title|E] พิเศษที่ไม่มีที่ดิน และปฏิบัติตาม [succession|E] ของตน"
 game_concept_domicile_building: "สิ่งปลูกสร้างในถิ่นพำนัก"
 game_concept_domicile_buildings: "สิ่งปลูกสร้างในถิ่นพำนัก"
 game_concept_domicile_building_desc: "[domiciles|E] ทั้งหมดสามารถอัปเกรดได้ด้วย $game_concept_domicile_buildings$ บางอย่าง ซึ่งให้รายได้ ทรัพยากร เช่น [prestige|E] และผลประโยชน์อื่นๆ อีกมากมายแก่เจ้าของ\n\nความพร้อมใช้งานของสิ่งปลูกสร้างขึ้นอยู่กับประเภทของ $game_concept_domicile$ เนื่องจาก แต่ละประเภทมีชุดสิ่งปลูกสร้างที่แตกต่างกันอย่างมาก\n\n$game_concept_domicile_buildings$ บางอย่างสามารถมี [internal_upgrades|E] ได้"
 game_concept_domicile_build_speed: "เวลาในการก่อสร้าง [domicile_building|E]"
 game_concept_domicile_travel_speed: "ความเร็วในการเดินทางย้าย [domicile|E]"
 game_concept_domicile_building_upgrade: "การอัปเกรดภายใน"
 game_concept_domicile_building_upgrade_desc: "$game_concept_domicile_buildings$ บางอย่างสามารถปรับปรุงได้ด้วย $game_concept_internal_upgrades$\n\nการอัปเกรด แม้จะคล้ายกับ $game_concept_domicile_buildings$ อื่นๆ แต่อาจสร้างได้เฉพาะภายในสิ่งปลูกสร้างที่ระบุเท่านั้น ทุกสิ่งปลูกสร้างที่เข้าถึงการอัปเกรดได้จะมีชุดการอัปเกรดเฉพาะของตนเอง"
 game_concept_domicile_building_slot: "ช่องสิ่งปลูกสร้าง $game_concept_domicile_building$"
 game_concept_domicile_building_slots: "ช่องสิ่งปลูกสร้าง $game_concept_domicile_building$"
 game_concept_domicile_building_slot_slot: "ช่อง"
 game_concept_domicile_building_slot_slots: "ช่อง"
 game_concept_domicile_building_slot_desc: "แต่ละ [domicile|E] มีจำนวน $game_concept_domicile_building_slot_slots$ ที่มีศักยภาพจำกัดสำหรับสิ่งปลูกสร้างใหม่\n\n$game_concept_domicile_building_slot_slots$ ใหม่สามารถปลดล็อกได้โดยการอัปเกรด $game_concept_domicile_building$ กลาง เช่น [GetDomicileBuilding('estate_main_01').GetName] ของ [estate|E] หรือ [GetDomicileBuilding('camp_main_01').GetName] ของ [camp|E]\n\n#WEAK $game_concept_domicile_building_slot_slots$ ที่ล็อกอยู่จะแสดงในมุมมอง $game_concept_domicile$ — ไม่มีทางที่จะได้รับ $game_concept_domicile_building_slot_slots$ เพิ่มเติมนอกเหนือจากนี้ได้#! "
 game_concept_internal_upgrades: "การอัปเกรดภายใน"
 game_concept_estate: "คฤหาสน์"
 game_concept_estates: "คฤหาสน์"
 game_concept_family_estate: "คฤหาสน์ประจำตระกูล"
 game_concept_family_estates: "คฤหาสน์ประจำตระกูล"
 game_concept_estate_desc: "$game_concept_estate$ คือประเภทของ [domicile|E] ที่ถือครองโดย [house_head|E] ของ [noble_families|E] ที่มีชื่อเสียงภายใน [realms|E] แบบ [administrative|E] สิ่งเหล่านี้แสดงถึงที่ดินส่วนตัวที่ไม่ผูกติดกับ [title|E] ที่มี [landed|E] ใดๆ\n\n[estate_buildings|E] อาจถูกสร้างขึ้นที่นี่เพื่อขยายความมั่งคั่งและ [influence|E] ของตระกูล และ $game_concept_estate$ จะถูกสืบทอดโดยคนรุ่นต่อไป"
 game_concept_estate_building: "สิ่งปลูกสร้างในคฤหาสน์"
 game_concept_estate_buildings: "สิ่งปลูกสร้างในคฤหาสน์"
 game_concept_estate_building_desc: "$game_concept_estate_buildings$ คือการปรับปรุงที่เป็นเอกลักษณ์และถาวรสำหรับ [estate|E] ของ [noble_family_possessive|E]\n\nมีโครงสร้างหลากหลายประเภทให้เลือกก่อสร้าง และเจ้าของคฤหาสน์สามารถสร้างขึ้นเพื่อสร้างรายได้ส่วนตัว ขยาย [influence|E] ของตระกูล และเข้าถึง [decisions|E], [interactions|E] และอื่นๆ อีกมากมาย"
 game_concept_camp: "ค่ายพัก"
 game_concept_camps: "ค่ายพัก"
 game_concept_adventurer_camp: "ค่ายพักนักผจญภัย"
 game_concept_adventurer_camps: "ค่ายพักนักผจญภัย"
 game_concept_camp_desc: "$game_concept_camps$ คือกลุ่มเต็นท์ สัตว์บรรทุก และผู้คนที่เคลื่อนย้ายได้ มีขนาดแตกต่างกันไปตั้งแต่กลุ่มเล็กๆ ไปจนถึงกองทัพเคลื่อนที่ขนาดใหญ่\n\nแต่ละ [GetGovernment( 'landless_adventurer_government' ).GetName] มี [domicile|E] แบบ $game_concept_camp$ ซึ่งเคลื่อนที่ไปตามแผนที่พร้อมกับพวกเขา\n\n[camp_buildings|E] อาจถูกสร้างขึ้นที่นี่ ซึ่งให้โบนัสอันทรงพลังแก่ $game_concept_adventurer$ แทน [counties|E] ของตนเอง [followers|E] เช่น [family|E] และ [knights|E] ของพวกเขา เดินทางไปพร้อมกับ $game_concept_camp$ และอาจได้รับการ แต่งตั้งเป็น [officers|E]\n\n#WEAK เช่นเดียวกับ [courts|E], $game_concept_camps$ รวมถึง [characters|E] ที่ไม่มีชื่อบางคนซึ่งไม่สำคัญพอที่จะแสดงภาพออกมา — แม้ว่าจะมีจำนวนน้อยกว่าก็ตาม\n\nแม้ว่าจะไม่ได้ [traveling|E] ระหว่าง $game_concept_counties$, $game_concept_camps$ โดยทั่วไปจะไม่คงที่ใน [location|E] ที่พวกเขาอยู่ และจะเคลื่อนย้ายไปรอบๆ ทุกสองสามคืน#! "
 game_concept_camp_building: "การอัปเกรดค่ายพัก"
 game_concept_camp_buildings: "การอัปเกรดค่ายพัก"
 game_concept_camp_building_desc: "$game_concept_camp_buildings$ คือการปรับปรุงที่เป็นเอกลักษณ์สำหรับ [camp|E]\n\nในทางกลไกแล้ว พวกมันคือ [domicile_buildings|E] — แม้ว่าหลายอย่างจะแสดงถึงประเพณีทางสังคมหรือเป็นเพียงจุดสนใจของ $game_concept_camp$ แทนที่จะเป็นโครงสร้างตามตัวอักษร\n\nโบนัสที่พวกเขาสามารถมอบให้ได้ รวมถึง:\n$EFFECT_LIST_BULLET$ การปลดล็อก [officers|E] ใหม่\n$EFFECT_LIST_BULLET$ การบัฟ [skill|E] อันทรงพลังสำหรับ [followers|E]\n$EFFECT_LIST_BULLET$ การเพิ่มความแข็งแกร่งของ [men_at_arms|E]\n$EFFECT_LIST_BULLET$ การปลดล็อกการกระทำที่ [rulers|E] ที่มี [landed|E] ถือเป็นเรื่องปกติ\n\n#WEAK เมื่อ [adventurer|E] กลายเป็นผู้มี [landed|E], $game_concept_camp_buildings$ ของพวกเขาจะถูกขายทอดตลาดและส่วนหนึ่งจะได้รับคืนเป็น [gold|E]#!"
 game_concept_follower: "ผู้ติดตาม"
 game_concept_followers: "ผู้ติดตาม"
 game_concept_following: "การติดตาม"
 game_concept_follower_desc: "$game_concept_follower$ คือตัวละครที่ [unlanded|E] ซึ่งติดตาม [adventurer|E]\n\nในทางกลไกแล้ว พวกเขาเทียบเท่ากับ [courtiers|E] แม้ว่าพวกเขาจะมีภาระผูกพันน้อยกว่าในการแสดงความเคารพหรืออยู่ต่อหากพวกเขาไม่ชอบผู้นำของตน\n\n[opinion|E] โดยรวมของ $game_concept_followers$ ของตัวละครเป็นตัวกำหนด [camp_temperament|E] ของพวกเขา\n\n$game_concept_followers$ สามารถ:\n$BULLET_WITH_TAB$รับใช้เป็น [officers|E]\n$BULLET_WITH_TAB$รับใช้ใน [armies|E] ในฐานะ [commanders|E] หรือ [knights|E]\n$BULLET_WITH_TAB$ให้ [adventurer|E] ของตนใช้ [claims|E] ของพวกเขาใน [war|E]"
 game_concept_camp_temperament: "บรรยากาศในค่ายพัก"
 game_concept_camp_temperament_desc: "ต่างจากลำดับชั้นอันเข้มงวดของ[court|E] $game_concept_camps$ ส่วนใหญ่เป็นสถานที่ที่ไม่เป็นทางการ ซึ่งการบ่นพึมพำจาก[characters|E]คนสำคัญ #EMP อื่นๆ#! นอกเหนือจาก[adventurer|E]ผู้นำอาจมีความสำคัญอย่างยิ่ง\n\n#P $DOMICILE_WINDOW_BOOKMARK_FOLLOWERS_TEMPERAMENT_POSITIVE$#! $game_concept_camps$ ที่ดีจะมอบ[character_modifiers|E]เชิงบวกให้กับ$game_concept_adventurer$ของพวกเขา ต้องการ[opinion|E]ส่วนใหญ่ของ[characters|E]ที่มีชื่อทั้งหมดอยู่ที่ [GetDefine('NDomicile', 'TEMPERAMENT_THRESHOLD_HIGH')|=P0] หรือมากกว่า\n\n#N $DOMICILE_WINDOW_BOOKMARK_FOLLOWERS_TEMPERAMENT_NEGATIVE$#! $game_concept_camps$ ที่ไม่ดีจะใช้$game_concept_character_modifiers$เชิงลบกับ$game_concept_adventurer$ของพวกเขา ต้องการ$game_concept_opinion$ส่วนใหญ่ของ$game_concept_characters$ที่มีชื่อทั้งหมดอยู่ที่ [GetDefine('NDomicile', 'TEMPERAMENT_THRESHOLD_LOW')|=N0] หรือน้อยกว่า\n\n#V $DOMICILE_WINDOW_BOOKMARK_FOLLOWERS_TEMPERAMENT_NEUTRAL$#! $game_concept_camps$ ใดๆ ที่ช่วงของ$game_concept_opinions$อยู่ระหว่างสองขั้วนี้ จะไม่ใช้$game_concept_modifiers$ใดๆ\n\n#WEAK ผลกระทบของ$game_concept_camp_temperament$จะปรับตาม[prestige_level|E]ของ$game_concept_adventurer_possessive$ ยิ่ง$game_concept_adventurer$มีชื่อเสียงมากเท่าใด ผลประโยชน์ที่เป็นไปได้ — และข้อเสีย — ของบรรยากาศใน$game_concept_camp$ของพวกเขาก็จะยิ่งมากขึ้นเท่านั้น#! "
 game_concept_adventurer: "นักผจญภัย"
 game_concept_adventurers: "นักผจญภัย"
 game_concept_adventurer_possessive: "ของนักผจญภัย"
 game_concept_adventurers_possessive: "ของเหล่านักผจญภัย"
 game_concept_adventurer_i: "@government_type_adventurer!"
 game_concept_adventurer_desc: "$game_concept_adventurer$ คือ [character|E] ที่ [unlanded|E] ซึ่งนำ [camp|E]\n\nพวกเขาไม่มี [vassals|E] และไม่ได้รับรายได้แบบพาสซีฟตามปกติ — แต่พวกเขาต้องรับ [task_contracts|E] เพื่อหารายได้ หรือขอความช่วยเหลือจาก [contact_list|E] ของพวกเขา\n\n$game_concept_adventurers$ สามารถเดินทางได้อย่างอิสระทั่วแผนที่ ข้อกังวลหลักของพวกเขาคือการ ทำให้แน่ใจว่ามี [provisions|E] เพียงพอที่จะอยู่รอดในการเดินทาง\n\nแทนที่จะเป็น [crown_authority|E], $game_concept_adventurers$ ส่วนใหญ่จะกำหนด [camp_purpose|E] สิ่งนี้บ่งชี้ว่าพวกเขามีกลุ่มประเภทใดและทำไมพวกเขาถึงอยู่ด้วยกัน\n\n#WEAK บุตรชายคนที่เจ็ดที่มุ่งมั่นไร้มรดก, ชนเผ่าเร่ร่อนผู้ทะเยอทะยาน, ผู้หลบหนีที่เอาแต่ใจ, นักวิชาการผู้ใฝ่รู้, ทหารรับจ้างผู้โหดเหี้ยม และขุนนางที่ถูกปลด ต่างก็เข้ามาเติมเต็มแถวของนักพเนจรที่ไม่รู้จักเหน็ดเหนื่อยเหล่านี้\n\nปัจจัยเดียวที่รวมพวกเขาไว้คือความกระหายในบางสิ่งที่มากกว่าชีวิตที่เงียบสงบไร้ชื่อเสียง และความตั้งใจที่จะทำอะไรบางอย่างเกี่ยวกับมัน#! "
 game_concept_officer: "เจ้าหน้าที่"
 game_concept_officers: "เจ้าหน้าที่"
 game_concept_officer_desc: "$game_concept_officers$ คือบทบาทเฉพาะทางที่ [followers|E] สามารถได้รับเพื่อช่วยเหลือ [camp|E] ของตน\n\nในทางกลไกแล้ว พวกเขาทำงานคล้ายกับ [court_positions|E] มาก เช่นเดียวกับตำแหน่งเหล่านั้น ผลประโยชน์ที่คุณได้รับจาก $game_concept_officers$ ถูกกำหนดโดย [aptitude|E] ของผู้ดำรงตำแหน่งสำหรับตำแหน่งนั้น\n\nแตกต่างจาก $game_concept_court_positions$, การ แต่งตั้ง $game_concept_officers$ นั้นฟรีและพวกเขาไม่ได้รับเงินเดือนรายเดือน แม้ว่าการถอดถอนพวกเขายังคงต้องใช้ [prestige|E]#!\n\n#WEAK $game_concept_officers$ ถูกปลดล็อกโดย [camp_buildings|E] ที่แตกต่างกันมากมาย#! "
 game_concept_imperial_family: "ราชตระกูล"
 game_concept_imperial_families: "ตระกูลจักรวรรดิ"
 game_concept_imperial: "แห่งจักรวรรดิ"
 game_concept_imperial_family_desc: "$game_concept_imperial_family$ คือ [house|E] สูงสุดใน [realm|E] แบบ [administrative|E]"
 game_concept_noble_family: "ตระกูลขุนนาง"
 game_concept_noble_families: "ตระกูลขุนนาง"
 game_concept_noble_family_possessive: "ของตระกูลขุนนาง"
 game_concept_noble_family_desc: "$game_concept_noble_families$ คือ [houses|E] ที่ทรงอำนาจใน [realm|E] แบบ [administrative|E] พวกเขาเป็นเจ้าของ [estate|E] ซึ่งควบคุมและจัดการโดย [house_head|E] และยังคงเป็นส่วนสำคัญของอาณาจักรตลอดเวลา เนื่องจากพวกเขาจะพยายามรวบรวม [influence|E] และรักษา [provinces|E] ไว้สำหรับตนเอง\n\n$game_concept_noble_family$ ที่มีอิทธิพลอาจกลายเป็น [powerful_family|E] หรือ [dominant_family|E]"
 game_concept_powerful_family: "ตระกูลทรงอำนาจ"
 game_concept_powerful_families: "ตระกูลทรงอำนาจ"
 game_concept_powerful: "ทรงอำนาจ"
 game_concept_powerful_family_desc: "$game_concept_powerful_family$ หมายถึงหนึ่งใน [houses|E] และ [noble_families|E] ที่ทรงอิทธิพลที่สุดใน [realm|E] แบบ [administrative|E]\n\nสมาชิกของ $game_concept_powerful_family$ จะเก่งกาจด้าน [political_schemes|E] มากขึ้น และมีแนวโน้มที่จะได้สิ่งที่ต้องการมากขึ้นเมื่อ [interacting|E] กับ [characters|E] อื่นๆ\n\nสามารถมี $game_concept_powerful_families$ ได้ในจำนวนจำกัดเท่านั้นในเวลาใดเวลาหนึ่ง และ $game_concept_noble_families$ ที่มีอันดับสูงสุดเท่านั้นที่จะถูกพิจารณาว่าทรงอิทธิพลโดยอิงจาก [powerful_family_rating_short|E] ของพวกเขา โดยมีข้อยกเว้นคือตระกูลของ [top_liege|E] ซึ่งจะถือว่าทรงอิทธิพลเสมอ\n\nตระกูลที่ควบคุมดินแดนส่วนสำคัญของอาณาจักรสามารถกลายเป็น [dominant_family|E] ได้"
 game_concept_dominant_family: "ตระกูลอิทธิพลนำ"
 game_concept_dominant_families: "ตระกูลอิทธิพลนำ"
 game_concept_dominant: "มีอิทธิพลนำ"
 game_concept_dominant_family_desc: "$game_concept_dominant_family$ คือ [powerful_family|E] ที่แผ่ขยายการควบคุมของตนไปไกลและกว้างขวาง พวกเขาถือเป็น [house|E] ที่ทรงอิทธิพลที่สุดภายใน [realm|E]\n\nสมาชิกของ $game_concept_dominant_family$ จะเก่งกาจด้าน [political_schemes|E] มากยิ่งขึ้น และมีแนวโน้มที่จะได้สิ่งที่ต้องการมากยิ่งขึ้นไปอีกเมื่อ [interacting|E] กับ [characters|E] อื่นๆ\n\n$game_concept_house$ ต้องควบคุมอย่างน้อย [EmptyScope.ScriptValue('dominant_family_threshold_value')|V0%] ของอาณาจักรจึงจะกลายเป็นตระกูลที่โดดเด่นได้"

 game_concept_house_attribute: "คุณลักษณะตระกูล"
 game_concept_house_attribute_desc: "ใน [governments|E] บางรูปแบบ [houses|E] สามารถมี $game_concept_house_attribute$ ซึ่งส่งผลต่อสมาชิกของตระกูลได้\n\nคุณลักษณะตระกูลแบบต่างๆ ได้แก่:\n$EFFECT_LIST_BULLET$[powerful_family_attribute|E]\n$EFFECT_LIST_BULLET$[house_aspiration|E]\n$EFFECT_LIST_BULLET$[mandala_aspect|E]"

 game_concept_powerful_family_attribute: "คุณลักษณะตระกูลทรงอิทธิพล"
 game_concept_family_attribute: "คุณลักษณะตระกูล"
 game_concept_powerful_family_attribute_desc: "$game_concept_powerful_family_attribute$ คือชุดโบนัสที่เกี่ยวข้องกับ [house|E] ภายใน [realm|E] แบบ [administrative|E] คุณลักษณะนี้จะเป็นประโยชน์ต่อสมาชิกของ $game_concept_house$ เช่นเดียวกับ [liege|E]\n\nคุณลักษณะจะทำงานตราบเท่าที่ $game_concept_house$ ยังคงถูกพิจารณาว่าเป็น [powerful_family|E] และ $game_concept_family_attribute$ ของ [dominant_family|E] จะไม่เป็นประโยชน์ต่อ [liege|E] ของพวกเขา\n\n[house_head|E] สามารถเปลี่ยนคุณลักษณะได้อย่างอิสระทุกเมื่อ"


 game_concept_powerful_family_rating: "ระดับตระกูลทรงอำนาจ"
 game_concept_powerful_family_rating_short: "ระดับ"
 game_concept_powerful_family_rating_mid: "ระดับตระกูล"
 game_concept_powerful_family_rating_desc: "$game_concept_powerful_family_rating$ คือการวัดว่า [powerful_family|E] มีอิทธิพลมากเพียงใด\n\nแม้ว่าจะมีหลายวิธีในการเพิ่ม $game_concept_powerful_family_rating_short$ ของตระกูล แต่ปัจจัยหลักคือจำนวน [governorships|E] ที่ถือครอง\n\n[house|E] ต้องมี $game_concept_powerful_family_rating_short$ อย่างน้อย [GetDefine('NHouse', 'POWERFUL_HOUSE_MINIMUM_POWER')|V0] จึงจะถือว่าทรงอำนาจ"

 game_concept_admin_confirmation: "$admin_confirmation_decision$"
 game_concept_admin_confirmation_desc: "[governors|E] สามารถให้ [liege|E] ของตนยืนยันการ แต่งตั้งอย่างเป็นทางการและเปิดเผยต่อสาธารณะได้"

 game_concept_ep3_become_landless_adventurer_decision: "การตัดสินใจ $become_landless_adventurer_decision$"
 game_concept_ep3_become_landless_adventurer_decision_desc: "[decision|E] ที่ปลดล็อกโดย [traditions|E] บางอย่าง ซึ่งอนุญาตให้ [ruler|E] ของ [realm|E] ขนาดเล็กสามารถสละตำแหน่งโดยสมัครใจและกลายเป็น [adventurer|E]"
 game_concept_ep3_purchase_land_interaction: "$purchase_land_interaction$"
 game_concept_ep3_purchase_land_interaction_desc: "[interaction|E] ซึ่งอนุญาตให้ [adventurer|E] ซื้อที่ดินจาก [ruler|E] และตั้งรกรากใน [realm|E] ของพวกเขา"
 game_concept_ep3_negotiate_settlement_interaction: "$negotiate_settlement_interaction$"
 game_concept_ep3_negotiate_settlement_interaction_desc: "[interaction|E] ซึ่งอนุญาตให้ [ruler|E] มอบที่ดินตั้งรกรากให้แก่ [adventurer|E] ที่เกเรใน [realm|E] ของตน"
 game_concept_ep3_laamp_adventurer_invasion_war: "$EP3_LAAMP_INVASION_CB_NAME$"
 game_concept_ep3_laamp_adventurer_invasion_war_desc: "[casus_belli|E] ซึ่งอนุญาตให้ [adventurer|E] ประกาศ [war|E] เพื่อพยายามสร้าง [realm|E] ใหม่"

 game_concept_contractor: "ผู้ว่าจ้าง"
 game_concept_contractors: "ผู้ว่าจ้าง"
 game_concept_contractor_possessive: "ของผู้ว่าจ้าง"
 game_concept_contractors_possessive: "ของผู้ว่าจ้าง"
 game_concept_contractor_desc: "$game_concept_contractor$ คือ [character|E] ที่ออก $game_concept_task_contract$\n\n$game_concept_task_contract$ โดยทั่วไปจะส่งผลกระทบต่อพวกเขาเป็นหลัก และพวกเขามักจะเป็นผู้จ่ายค่าจ้างให้ [adventurer_possessive|E]\n\n#N [criminal_task_contracts|E] โดยทั่วไป #BOL ไม่ได้#! ออกโดย $game_concept_contractor$ ของพวกเขา แต่จะมุ่งเน้นไปที่การแสวงหาผลประโยชน์จากพวกเขาแทน — ตัวอย่าง เช่น หลอกลวงใครบางคนให้มอบ [gold|E] ให้คุณ เพราะพวกเขาส่งสัญญาณถึงความเชื่อง่ายของตน#! "

 game_concept_contract_scheme: "แผนการตามสัญญาจ้าง"
 game_concept_contract_schemes: "แผนการตามสัญญาจ้าง"
 game_concept_contract_scheme_possessive: "ของแผนการตามสัญญาจ้าง"
 game_concept_contract_schemes_possessive: "ของแผนการตามสัญญาจ้าง"
 game_concept_contract_scheme_contract: "สัญญาจ้าง"
 game_concept_contract_scheme_desc: "$game_concept_task_contracts$ จำนวนมากต้องการให้ [adventurers|E] ทำ [scheme|E] ให้สำเร็จ\n\nสิ่งเหล่านี้อาจเป็นอันตราย ( เช่น การสังหาร [rival|E] ของ [contractor_possessive|E]), น่าพึงพอใจ ( เช่น เพียงแค่เล่าเรื่องเพื่อสร้างความบันเทิงให้ [court|E] ของพวกเขาเป็นเวลาสองสามเดือน) หรือไม่มีพิษภัย ( เช่น การคัดลอกตำราให้พวกเขา)\n\nหาก $game_concept_scheme$ ล้มเหลวหรือถูกละทิ้งไม่ว่าด้วยเหตุผลใดก็ตาม $game_concept_task_contract$ ก็จะล้มเหลวด้วย"

 game_concept_contact_list: "บัญชีรายชื่อผู้อุปถัมภ์"
 game_concept_contact_list_contacts: "ผู้อุปถัมภ์"
 game_concept_contact_list_contact: "ผู้อุปถัมภ์"
 game_concept_contact_list_desc: "[adventurers|E] ไม่มี [land|E] แต่ไม่ใช่ว่าจะไร้ #EMP เส้นสาย#! \n\n$game_concept_contact_list$ คือรายชื่อของ [character|E] ทุกคนที่พวกเขาทำ [task_contract|E] ให้สำเร็จ รวมถึงคนอื่นๆ ที่มีเหตุผลบางอย่างที่จะสนับสนุนพวกเขา — [family|E] ที่มี [opinion|E] สูงต่อพวกเขา, [friends|E], [lovers|E] และอื่นๆ\n\n$game_concept_contact_list_contacts$ สามารถถูกใช้เพื่อขอรับการสนับสนุนเพิ่มเติมผ่านทาง [character_interaction|E] $contact_list_request_interaction|V$"

 game_concept_camp_purpose: "จุดประสงค์ของค่ายพัก"
 game_concept_camp_purposes: "จุดประสงค์ของค่ายพัก"
 game_concept_camp_purpose_purpose: "จุดประสงค์"
 game_concept_camp_purpose_purposes: "จุดประสงค์"
 game_concept_camp_purpose_desc: "$game_concept_camp_purposes$ คือสิ่งที่ใช้แทนกฎหมายในอนาธิปไตยที่รักอิสระของ[camps|E]\n\nพวกมันเป็นตัวแทนของพลังผูกมัดที่กระตุ้นให้$game_concept_camp$อยู่ร่วมกัน ไม่ว่าจะเป็นความโน้มเอียงทางวิชาการ ทักษะการเป็นทหารรับจ้าง หรือความปรารถนาอันแรงกล้าที่จะนำผู้ปกครองที่ชอบธรรมกลับคืนสู่บัลลังก์ของพวกเขา\n\n$game_concept_camp_purpose_purposes$ที่แตกต่างกันจะปลดล็อก[camp_buildings|E]ที่แตกต่างกัน (และในทางกลับกันคือ[officers|E]ที่ไม่เหมือนใคร) นำไปสู่เหตุการณ์หรือตัวเลือกเหตุการณ์ที่แตกต่างกัน และส่งผลกระทบต่อ[task_contracts|E]ที่จะถูกสร้างขึ้น\n\n#WEAK $game_concept_camp_purpose$ ยังส่งผลกระทบต่อตำแหน่งของ$game_concept_adventurer_possessive$และเสื้อผ้าของ[followers|E]ของพวกเขา#! "

