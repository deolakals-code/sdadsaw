 game_concept_governance_issue_desc: "$game_concept_governance_issue$ คืองานที่ [governor|E] ต้องปฏิบัติ\n\nปัญหาจะปรากฏขึ้นภายใน [province|E] ทุกๆ สองสามปีหรือประมาณนั้น และมักจะเกี่ยวข้องกับปัญหาที่ $game_concept_governor$ ต้องแก้ไข อย่างไรก็ตาม ปัญหาก็สามารถนำเสนอโอกาสได้ เช่นกัน\n\nการแก้ไขปัญหาให้สำเร็จโดยทั่วไปจะให้รางวัลเป็น [gold|E], [influence|E] และประสบการณ์ใน [trait|E] [GetTrait('governor').GetName(GetNullCharacter)] ขึ้นอยู่กับปัญหาที่เป็นอยู่ อาจมีรางวัลอื่นๆ ให้ด้วย\n\nแต่ละ $game_concept_governance_issue$ มี [governance_issue_tier_tier|E] ซึ่งส่งผลต่อรางวัลที่มอบให้"

