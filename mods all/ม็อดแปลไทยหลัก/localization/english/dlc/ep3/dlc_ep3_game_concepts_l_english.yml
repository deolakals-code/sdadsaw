 game_concept_governance_issue_tier_tier: "ระดับ"
 game_concept_governance_issue_tier_desc: "ทุก [governance_issue|E] มี $game_concept_governance_issue_tier$ ซึ่งสะท้อนถึงรางวัลโดยรวมของปัญหาเมื่อแก้ไขสำเร็จ การแก้ไขปัญหาที่มีระดับสูงกว่าโดยทั่วไปจะ ส่งผลให้ได้รับ [gold|E] หรือ [influence|E] จำนวนมากขึ้น รวมถึงประสบการณ์ที่ได้รับใน [trait|E] [GetTrait('governor').GetName(GetNullCharacter)] มากขึ้นด้วย"

