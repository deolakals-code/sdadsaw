 game_concept_reinforce_soldiers: "เสริมกำลังพลด้วยตนเอง"
 game_concept_reinforcements: "กำลังเสริม"
 game_concept_reinforce_soldiers_desc: "[adventurers|E]และ[nomads|E]อาจเกณฑ์[men_at_arms|E] แต่พวกเขาจะไม่เสริมกำลังโดยอัตโนมัติเหมือนที่[rulerpossessive|E]ที่มี[landed|E]ทำ แทนที่จะเป็น เช่นนั้น ต้องชักชวนทหารเกณฑ์โดยใช้ปฏิสัมพันธ์"
 game_concept_adventurer_siege_replenishment: "การเติมกำลังพลจากการล้อม"
 game_concept_adventurer_siege_replenishment_desc: "เมื่อ [adventurer|E] [sieges|E] [holding|E] สำเร็จ ส่วนหนึ่งของ [men_at_arms|E] ของพวกเขาจะได้รับการเติมเต็ม\n\n[regiments|E] [men_at_arms] ทั้งหมดใน [army|E] จะได้รับการเติมเต็ม #V x2#! เท่าของมูลค่า [loot|E] ของที่ดินนั้น\n\n#weak การเพิ่มขึ้นนี้ประกอบด้วยทหารใหม่ การบังคับเกณฑ์คนในท้องถิ่น และเพียงแค่การจ่ายเงินให้กับผู้ที่ละทิ้งไประหว่างการล้อม#!"

 game_concept_investment_cap: "ขีดจำกัดการลงทุน"
 game_concept_investment_cap_desc: "นี่คือจำนวนสูงสุดที่ตัวละครอาจลงทุนใน [candidate_score|E] ของตนเองหรือของผู้อื่นสำหรับ [governorship|E]\n\nอายุ, [powerful_family_rating_mid|E], [influence_level|E] และ [estate_buildings|E] เป็นปัจจัยหลักที่กำหนดขีดจำกัดนี้ เด็กมีโทษปรับเล็กน้อยตามสัดส่วนต่อขีดจำกัดนี้ ในขณะที่ขีดจำกัดของผู้ใหญ่จะเพิ่มขึ้นตามอายุ"

 game_concept_appointment_succession_law: "กฎการสืบทอดโดยการ แต่งตั้ง"
 game_concept_appointment_succession_laws: "กฎการสืบทอดโดยการ แต่งตั้ง"
 game_concept_appointment: "การ แต่งตั้ง"
 game_concept_appointments: "การ แต่งตั้ง"
 game_concept_appointment_succession: "การสืบทอดโดยการ แต่งตั้ง"
 game_concept_appointment_succession_law_desc: "ภายใต้ $game_concept_appointment_succession_law$ [title|E] และ [holdings|E] ที่เกี่ยวข้อง จะถูกสืบทอดโดยผู้สมัครที่มี [candidate_score|E] สูงสุด\n\nประเภทต่างๆ ได้แก่:\n$EFFECT_LIST_BULLET$[GetLaw('appointment_succession_law').GetName]\n$EFFECT_LIST_BULLET$[GetLaw('acclamation_succession_law').GetName]\n$EFFECT_LIST_BULLET$[GetLaw('celestial_appointment_succession_law').GetName]\n$EFFECT_LIST_BULLET$[GetLaw('celestial_military_appointment_succession_law').GetName]\n$EFFECT_LIST_BULLET$[GetLaw('celestial_ministry_appointment_succession_law').GetName]\n$EFFECT_LIST_BULLET$[GetLaw('celestial_grand_marshal_appointment_succession_law').GetName]\n$EFFECT_LIST_BULLET$[GetLaw('meritocratic_appointment_succession_law').GetName]\n$EFFECT_LIST_BULLET$[GetLaw('meritocratic_military_appointment_succession_law').GetName]\n$EFFECT_LIST_BULLET$[GetLaw('japanese_appointment_succession_law').GetName]"
 
 game_concept_appointment_level: "ระดับการ แต่งตั้ง"
 game_concept_appointment_levels: "ระดับการ แต่งตั้ง"
 game_concept_appointment_level_desc: "$game_concept_appointment_level$ ถูกใช้โดย [appointment_succession_laws|E] บางกฎหมายเพื่อเป็นข้อกำหนดสำหรับ [characters|E] ในการเป็นผู้สมัครที่มีสิทธิ์\n\ระดับจะขึ้นอยู่กับระดับของสกุลเงินที่เฉพาะเจาะจง และ แต่ละกฎหมายสามารถใช้สกุลเงินที่แตกต่างกันเป็นข้อกำหนดได้ โดยทั่วไป [title|E] ระดับที่สูงกว่าจะต้องการระดับที่สูงกว่า\n\n#weak ตัวอย่างเช่น: [GetLaw('celestial_appointment_succession_law').GetName] ต้องการ [merit|E] - [duchy|E] ต้องการ [merit_level|E] [GetModifier( 'merit_level_3' ).GetNameWithTooltip|L] หรือสูงกว่า ในขณะที่ [kingdom|E] ต้องการ [GetModifier( 'merit_level_5' ).GetNameWithTooltip|L] หรือสูงกว่า#!"

 game_concept_seize_peripheral_duchy: "ยึดดัชชีรอบนอก"
 game_concept_seize_peripheral_duchy_desc: "[casus_belli|E] ที่มีให้สำหรับ [rulers|E] ที่มีเขตแดนติดกับ [realm|E] ซึ่งปกครองโดย [government_form|E] แบบ [government_bureaucratic_type|E]\n\nมันอนุญาตให้ผู้โจมตีเข้ายึด [duchy|E] ข้างเคียงที่อยู่นอกเหนือลำดับชั้นทาง [de_jure|E] ของเมืองหลวงของผู้ตั้งรับ"
