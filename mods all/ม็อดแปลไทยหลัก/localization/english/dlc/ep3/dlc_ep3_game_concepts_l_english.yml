 game_concept_provincial_army: "กองทัพมณฑล"
 game_concept_provincial_army_desc: "กองทัพมณฑล คือกองทัพที่เกณฑ์และดูแลโดย [governor|E] ใน [realm|E] ที่มี [government|E] แบบ [administrative|E]\n\nประกอบด้วย [title_men_at_arms|E] เท่านั้น ประสิทธิภาพของ [men_at_arms|E] ได้รับผลกระทบจาก [governor_efficiency|E] ของ [governor]\n\n[liege|E] สามารถใช้ [influence|E] เพื่อเข้าควบคุมกองทัพได้\n\n[governors] อาจยืมกองกำลังจากเพื่อนร่วมตำแหน่งได้ภายใต้สถานการณ์บางอย่าง เช่น การเป็น [allies|E] หรือการใช้ [hook|E]\n\nกองทัพที่ยืมมาจะถูกส่งคืนหาก [character] ที่ยืมไปเสียชีวิต หรือเมื่อพวกเขาเสร็จสิ้น [wars|E] ที่กำลังดำเนินอยู่ทั้งหมด นอกจากนี้ยังสามารถส่งคืนกองทัพด้วยตนเองได้"
