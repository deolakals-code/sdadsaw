 game_concept_criminal_task_contract_desc: "$game_concept_criminal_task_contract$ โดยทั่วไปเกี่ยวข้องกับสัญญาจ้างที่น่าสงสัย ซึ่งอาจให้ผลกำไร แต่จะให้รางวัลคุณเป็น @gallowsbait_icon![GetTrait('gallowsbait').GetName(GetNullCharacter)] [trait_level_track_xp|E]\n\nการเพิ่มระดับ [trait|E] $trait_gallowsbait$ จะ ทำให้คนส่วนใหญ่ในโลกเกลียดคุณมากขึ้นและเคารพคุณน้อยลง และในที่สุดจะ ทำให้ [followers|E] ของคุณที่ไม่เห็นด้วยกับการเป็นโจรของคุณออกจากงานของคุณไปอย่างมาก\n\n#WEAK $trait_gallowsbait$ เป็น $game_concept_trait$ เชิงลบอย่างมาก หมายความว่าตัวละครเป็นอาชญากรรายย่อยระดับต่ำสุด — อย่างน้อยการฆาตกรรมในราชสำนักก็ยังมี #EMP ชั้นเชิง#! อยู่บ้าง\n\nสามารถลบล้างได้ด้วย [decision|E] [GetDecisionWithKey('wipe_slate_decision').GetName]#!"

