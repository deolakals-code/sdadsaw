 ep3_laamps_provisions.1000.t: "ลดเสบียง"
 ep3_laamps_provisions.1000.desc: ""[concerned.Custom2('RelationToMeShort', ROOT.Char)|U]," [concerned.GetFirstName] เริ่มกล่าว "ข้าสังเกตเห็นว่าเสบียงของเราเหลืออยู่ราวครึ่งหนึ่งแล้ว..."\n\n"เราควรจะเริ่มลดปันส่วนเสบียง หรือจะให้ดียิ่งกว่านั้นคือวางแผนหยุดพักเพื่อตุนเสบียงเพิ่มหรือไม่? แม้ตอนนี้ยังไม่ถึงขั้นฉุกเฉิน แต่สถานการณ์ เช่นนี้อาจเลวร้ายลงได้ในเวลาไม่นาน เพียงแค่ล่าช้าไป เราอาจต้องจำใจกินพื้นรองเท้าบู๊ตของตัวเอง!"
 ep3_laamps_provisions.1000.a: "หยุดกังวลได้แล้ว ไม่เป็นไรหรอกน่า!"
 ep3_laamps_provisions.1000.b: "แค่ไปหาซื้ออะไรอร่อยๆ กินที่เมืองหน้าก็พอ!"
 ep3_laamps_provisions.1010.t: "ทหารหนีทัพ เพราะหิวโหย"
 ep3_laamps_provisions.1010.desc: "เช้านี้ มีทหารอีกกลุ่มหนึ่งหายตัวไป\n\nเหตุการณ์ เช่นนี้เกิดขึ้นต่อเนื่องมาหลายวันแล้ว และข้าคงต้องยอมรับว่าพวกเขาไม่ได้เพียงแค่หลงทางระหว่างลาดตระเวน หรือถูกสัตว์ป่าทำร้ายขณะยืนยาม พวกเขากำลังหนีทัพ\n\nข้ายอมรับว่าสถานการณ์ย่ำแย่: อาหารและน้ำกำลังร่อยหรอ และวันจ่ายค่าจ้างอาจมาถึงช้ากว่าที่คาดไว้มาก ถึงกระนั้น ข้าก็ไม่อาจยอมรับความขี้ขลาด เช่นนี้ได้!"
 ep3_laamps_provisions.1010.a: "พวกขี้ขลาด!"
 ep3_laamps_provisions.1020.t: "ผู้ยอมแพ้"
 ep3_laamps_provisions.1020.desc: ""#EMP ข้าทนต่อไปไม่ไหวแล้ว!#!"\n\nขณะที่ข้าเดินงัวเงียออกมาจากกระโจม ข้าเห็น [leaver.GetTitledFirstName] กำลังเกรี้ยวกราดและลากกระเป๋าที่มีข้าวของเพียงน้อยนิดของ [leaver.GetHerHis] ออกจากค่าย\n\n"ข้าไม่รู้สึกถึงเท้าตัวเองแล้ว หลังข้าก็ปวดตลอดเวลา และข้าจำไม่ได้แล้วว่าได้กินอาหารอุ่นๆ ครั้งสุดท้ายเมื่อไหร่! หรืออาหารที่ ทำให้อิ่มท้อง! หรือแม้ แต่อาหารจริงๆ สักมื้อ! #EMP ขอสาปแช่งเจ้า [ROOT.Char.GetFirstNameNoTooltip] ผู้ชั่วร้าย!#!""
 ep3_laamps_provisions.1020.a: "ไปซะสิ เจ้าคนขี้ขลาด!"
 ep3_laamps_provisions.1025.t: "ไม่คุ้มค่าเหนื่อย"
 ep3_laamps_provisions.1025.desc: ""ข้า #EMP พยายามอย่างยิ่ง#! ที่จะสนับสนุนท่าน [ROOT.Char.GetFirstNameNoTooltip] ข้าพยายามอย่างสุดความสามารถแล้ว แต่นี่มันเกินไปแล้ว!" [leaver.Custom2('MyCharacterIntroduction', ROOT.Char)] กล่าว น้ำตาแห่งความคับข้องใจคลออยู่ในดวงตา [leaver.GetHerHis] และสีหน้า [leaver.GetHerHis] เต็มไปด้วยความโกรธแค้น\n\n"ท่านกำลังจะนำพาพวกเราไปสู่ความตาย! ทั้งหมดก็เพื่อความทะเยอทะยานโง่ๆ และความตระหนี่น่าหัวเราะของท่าน! แต่ข้าจะไม่ตามท่านไปสู่หลุมศพก่อนวัยอันควร! ข้าจะไปแล้ว เดี๋ยวนี้!""
 ep3_laamps_provisions.1025.a: "ลาก่อน"
 ep3_laamps_provisions.1030.t: "ทหารอดอยาก"
 ep3_laamps_provisions.1030.desc: "ทหารของข้าบางส่วนยังคงหนีทัพ แต่ส่วนใหญ่กลับไม่มีแม้ แต่เรี่ยวแรงที่จะจากไป\n\nวันแล้ววันเล่า จำนวนผู้ติดตามของข้าลดน้อยลง เมื่อความหิวโหย ความกระหาย และสารพัดโรคภัยไข้เจ็บคร่าชีวิตพวกเขาไปทีละคน"
 ep3_laamps_provisions.1030.a: "ถึงกระนั้น เราก็ยังคงเดินหน้าต่อไป"
 ep3_laamps_provisions.1040.t: "ร่างกายอ่อนแอ"
 ep3_laamps_provisions.1040.desc: "อาการไอเรื้อรังเขย่าร่างของข้า น้ำสักหน่อยอาจช่วยได้ แต่มันหมดไปตั้งแต่เมื่อวาน มือของข้าสั่น และข้าคงกำลังเป็นไข้\n\nข้ารู้สึกอ่อนแอและป่วยไข้ – สภาพที่ดูเหมือนว่าผู้ติดตามของข้าหลายคนก็เป็น เช่นกัน\n\nเราจำเป็นต้องตุนเสบียง และต้องทำ #EMP เดี๋ยวนี้#! ก่อนที่ทุกอย่างจะสายเกินไป"
 ep3_laamps_provisions.1040.a: "ข้าแค่เหนื่อยล้า..."
 ep3_laamps_provisions.1050.t: "สัมผัสแห่งความตาย"
 ep3_laamps_provisions.1050.desc_pet_horse: "[ROOT.Char.Custom( 'WarhorseStoryName' )] ที่น่าสงสารของข้า!\n\nความยากลำบากของการเดินทางนี้มันหนักหนาเกินไป แม้กระทั่งสำหรับอาชาที่แข็งแกร่ง เช่นนี้..."
 ep3_laamps_provisions.1050.desc_pet_dog: "[ROOT.Char.Custom( 'DogStoryName' )] ที่น่าสงสารของข้า!\n\nความยากลำบากของการเดินทางนี้มันหนักหนาเกินไป แม้กระทั่งสำหรับสุนัขผู้กล้าหาญ เช่นนี้..."
 ep3_laamps_provisions.1050.desc_pet_cat: "[ROOT.Char.Custom( 'CatStoryName' )] ที่น่าสงสารของข้า!\n\nความยากลำบากของการเดินทางนี้มันหนักหนาเกินไปสำหรับลูกแมวตัวน้อย..."
 ep3_laamps_provisions.1050.desc_pet_no: "ช่างเป็นโศกนาฏกรรม!"
 ep3_laamps_provisions.1050.desc_pet: "ข้าจะจดจำแววตาอันชาญฉลาดของเจ้าที่เคยมองข้าด้วยรอยยิ้มในวันวาน แต่ประกายตาที่หายไป ความหมองเศร้าจากความเจ็บปวด ขณะที่เจ้าเงยหน้ามองข้าเป็นครั้งสุดท้าย คือทั้งหมดที่ข้าเห็น\n\nขอ [ROOT.Char.GetFaith.HighGodName] ทรงอภัยให้ข้าในความโง่เขลาที่นำพาเรามาถึงจุดนี้ ข้าไม่คิดว่าข้าจะให้อภัยตัวเองได้"
 ep3_laamps_provisions.1050.desc_follower: "\n\nสัตว์ของเราล้มตายราวใบไม้ร่วง ทหารล้มพับอยู่ข้างทาง และบัดนี้ [ROOT.Char.GetFaith.DeathDeityName] ได้มาเยือนค่ายของข้าและพราก [dead.Custom2('MyCharacterIntroduction', ROOT.Char)] ไป! ความทุกข์ทรมานจากการเดินทางที่ผิดพลาดครั้งนี้มันหนักหนาเกินไปสำหรับ [dead.GetHerHim]...\n\nความตายครั้งนี้ถ่วงหนักอยู่ในใจข้า"
 ep3_laamps_provisions.1050.a: "ลาก่อน สหาย"
 ep3_laamps_provisions.1050.a_tt: "สัตว์เลี้ยงของท่านตายแล้ว"
 ep3_laamps_provisions.1050.a_1: "[dead.GetSheHe|U] ไม่สมควรต้องเจอเรื่อง เช่นนี้"
 ep3_laamps_provisions.1050.b: "อย่างน้อยเราก็ได้เนื้อสดๆ มาบ้าง!"
 ep3_laamps_provisions.1050.c: "ท้ายที่สุดแล้ว... ทำไมจะไม่ได้ล่ะ...?"
 ep3_laamps_provisions.1050.d: "ข้าขอโทษ... ข้า #EMP ขอโทษ#! จริงๆ..."
 ep3_laamps_provisions.1050.d.tt: "ท่านกินซากสัตว์เลี้ยงที่น่าสงสารของท่าน"
 ep3_laamps_provisions.1060.t: "อากาศเป็นพิษ"
 ep3_laamps_provisions.1060.desc: "วันนี้ความเงียบปกคลุมค่ายของข้าอย่างหนักอึ้ง มีเพียงเสียงครวญครางแผ่วเบาของผู้ป่วยเท่านั้นที่ดังแทรกขึ้นมา\n\nระหว่างคืน ผู้ติดตามของข้าหลายคนเริ่มแสดงอาการป่วยบางอย่าง พอถึงรุ่งเช้า มันก็ดูเหมือนโรคระบาดเต็มรูปแบบ ผู้คนของข้า ซึ่งอ่อนแออยู่แล้วจากการเดินทางไกลและการขาดแคลนอาหารและน้ำ แทบจะรวบรวมเรี่ยวแรงยืนไม่ได้ นับประสาอะไรกับการเดิน\n\nหากข้าต้องการช่วยใครสักคน เราต้องหยุดพักเดี๋ยวนี้"
 ep3_laamps_provisions.1060.a: "ข้าควรทำอย่างไรดี?"
 ep3_laamps_provisions.1070.t: "ข้าเห็นแสงสว่างหรือไม่?"
 ep3_laamps_provisions.1070.desc: "ข้าจำไม่ได้ว่ากินอาหารครั้งสุดท้ายเมื่อไหร่\n\nคอของข้าแห้งผากราวกับแผ่นหนัง\n\nทุกอย่าง #EMP เจ็บปวด#! ไปหมด\n\nข้าจำไม่ได้ด้วยซ้ำว่ากำลังจะไปที่ไหน รู้เพียง แต่ว่าต้องไปต่อ\n\nข้าไม่อยากไปต่อ ข้าแค่อยากให้ทั้งหมดนี้ #EMP จบสิ้น#! เสียที..."
 ep3_laamps_provisions.1070.a: "ข้า... ไปต่อไม่ไหวแล้ว..."
 ep3_laamps_provisions.1070.a1: "ท่านอดตาย"
 ep3_laamps_provisions.1070.a2: "กระเพาะของท่านเสียหายตลอดไป"
 ep3_laamps_provisions.1070.a3: "พละกำลังของท่านหมดสิ้นไป"
 ep3_laamps_provisions.1070.a4: "ความสิ้นหวังผลักดันให้ท่านกินอาหารอันไม่บริสุทธิ์"
 ep3_laamps_provisions.1070.a5: "ท่านป่วย"
 ep3_laamps_provisions.1070.a6: "บางอย่างในจิตใจของท่านแตกสลาย"
 ep3_laamps_provisions.1070.a7: "แสงสว่างหายไปจากดวงตาของท่าน"
 ep3_laamps_provisions.1070.a8: "ร่างกายของท่านแคระแกร็นอย่างถาวร"
 ep3_laamps_provisions.1070.tt: "ความอดอยาก"
 weak_stomach_modifier: "กระเพาะอ่อนแอ"
 weak_stomach_modifier_desc: "หลังจากรอดชีวิตมาได้ด้วยอาหารเพียงน้อยนิดหรือไม่มีเลยมาระยะหนึ่ง กระเพาะของตัวละครนี้ไม่สามารถรับมือกับอาหารมื้อใหญ่หรือหรูหราได้อีกต่อไป ทำให้ป่วยได้ง่าย"
 hunger_sickness_modifier: "อาการป่วยจากความหิวโหย"
 hunger_sickness_modifier_desc: "นับตั้งแต่เกือบอดตาย ตัวละครนี้ก็ไม่เหมือนเดิมอีกต่อไป: ผิวหนังของพวกเขามีแผลพุพอง ร่างกายและจิตใจก็อ่อนแอลง"
 every_follower_custom: "[follower|E] ทุกคน"
 starving_opinion: "ปล่อยให้ข้าอดตาย"
 every_maa_regiment_custom: "กรมทหารอาชีพทุกกรม"
 ep3_laamps_provisions.1080.t: "ถุงว่างเปล่าและท้องว่างเปล่า"
 ep3_laamps_provisions.1080.desc_companion: ""ข้าเข้าใจความกระตือรือร้นของท่าน – เชื่อข้าเถอะ #EMP ข้าเข้าใจ!! แต่ข้าขอร้องให้ท่านทบทวนความเร่งรีบของท่านใหม่" ดวงตาของ [complainer.GetFirstNamePossessive] ดูเศร้าและลึกโหลขณะที่ [complainer.GetSheHe] จ้องมองมาที่ข้า\n\n"ได้โปรด อย่าดื้อรั้นนักเลย เราไม่มีอาหารและน้ำสะอาดเหลืออยู่เลย หากเราไม่หยุดพักทันทีเพื่อพักผ่อนและตุนเสบียง เราก็จะเดินตรงไปสู่ความตาย!""
 ep3_laamps_provisions.1080.desc_alone: "ข้าคิดจริงๆ ว่าข้าจะทำได้ มันอาจจะเกินกำลังไปบ้าง แต่ข้าไม่คาดคิดว่าสถานการณ์จะเลวร้ายลงอย่างรวดเร็ว เช่นนี้\n\nข้าพบว่าตัวเองติดอยู่กลางทาง ไม่มีเสบียงสนับสนุนการเดินทาง อดอยาก กระหายน้ำ และอ่อนแออย่างยิ่ง\n\nเป้าหมายใกล้เข้ามาทุกย่างก้าว แต่เป็นครั้งแรกที่ข้ารู้สึกถึงความสงสัยที่กัดกินใจว่าข้าอาจไปไม่ถึงที่นั่นทั้งที่ยังมีชีวิตอยู่"
 ep3_laamps_provisions.1080.a: "ถึงกระนั้น เราต้องเดินหน้าต่อไป"
 ep3_laamps_provisions.1080.b: "เราต้องพักผ่อนก่อนที่จะสายเกินไป"
 ep3_laamps_provisions.1080.sea: "ท่านอยู่ในทะเล ไม่มีที่ใดให้พักผ่อน นอกจากบนเรือของท่านเอง!"
 ep3_laamps_provisions.1080.c: "มุ่งหน้าสู่ฝั่ง #EMP เดี๋ยวนี้#!!"
 ep3_laamps_provisions.1080.c.tt: "[travel|E] ของท่านจะถูกยกเลิก และเปลี่ยนเส้นทางไปยัง [landfall.GetBaronyNameExplicitly] ([landfall.GetCounty.GetTitle.GetHolder.GetTopLiege.GetPrimaryTitle.GetName])"

 critically_low_provisions_alert: "เสบียงเหลือน้อยขั้นวิกฤต"
 critically_low_provisions_alert_desc: "[provisions|E] ของท่านกำลังจะหมด!"
