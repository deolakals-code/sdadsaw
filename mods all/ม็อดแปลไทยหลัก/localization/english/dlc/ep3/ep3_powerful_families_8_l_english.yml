l_english: 

 ep3_powerful_families.8000.t: "ในตำแหน่งสูงส่ง"
 ep3_powerful_families.8000.desc: "วันนี้ข้าเปิดผนึกจดหมายจาก [influential_family_member.Custom2('MyCharacterIntroduction', ROOT.Char)] ธาตุแท้อันต่ำทรามและนิสัยเจ้าเล่ห์เพทุบายของ[influential_family_member.GetHerHis|U]ปรากฏชัดแจ้งเมื่อ[influential_family_member.GetSheHe]เสนอให้เราฉวยโอกาสจากตำแหน่งของ[influential_family_member.GetHerHis]เพื่อเข้าถึงและแก้ไขเอกสารในครอบครองของ[liege.GetTitleAsNameNoTooltip]\n\nการ แต่งตั้งของ[influential_family_member.GetNamePossessiveNoTooltip|U]ในราชสำนักของ[liege.GetNamePossessive]เป็นสินทรัพย์สำคัญยิ่งในการส่งเสริมผลประโยชน์ของตระกูลมาจนบัดนี้ และ แม้ว่าข้อเสนอของ[influential_family_member.GetHerHis]จะมุ่งหวังให้เราก้าวหน้ายิ่งขึ้นไปอีก แต่มันก็อาจเป็นอันตรายต่อตำแหน่งของ[influential_family_member.GetHerHis]ไปตลอดกาล..."
 ep3_powerful_families.8000.a: "โอกาสอันน่าชื่นใจ!"
 ep3_powerful_families.8000.a.win: "[influential_family_member.GetFirstNameNoTooltip] ทำสำเร็จ"
 ep3_powerful_families.8000.a.lose: "[influential_family_member.GetFirstNameNoTooltip] ถูกจับได้"
 ep3_powerful_families.8000.b: "ค้นหาความลับในหอจดหมายเหตุ!"
 ep3_powerful_families.8000.b.tt: "[influential_family_member.GetFirstNameNoTooltip] อาจค้นพบความลับของ[liege.GetNamePossessiveNoTooltip]"
 ep3_powerful_families.8000.b.win.secret: "[influential_family_member.GetFirstNameNoTooltip] ค้นพบความลับ"
 ep3_powerful_families.8000.b.win.no_secret: "[influential_family_member.GetFirstNameNoTooltip] ไม่พบความลับใด"
 ep3_powerful_families.8000.c: "จงเป็นข้ารับใช้ผู้ภักดีเถิด"
 ep3_powerful_families.8010.t: "[liege.GetTitleAsNameNoTooltip|U]ตกทุกข์ได้ยาก"
 ep3_powerful_families.8010.desc: "[war.GetName|U]ยังคงดำเนินต่อไปอย่างดุเดือด และหลังจากพ่ายแพ้ในการรบและการล้อมติดต่อกันหลายครั้ง [liege.GetName]ก็ตกอยู่ในสถานการณ์เสียเปรียบอย่างยิ่ง ทั่วทั้ง[liege.GetPrimaryTitle.GetName] เหล่าตระกูลผู้ทรงอิทธิพลและข้าราชสำนักต่างพึมพำและวางแผนเพื่อส่งเสริมผลประโยชน์ของตนเองในช่วงเวลาที่[liege.GetTitleAsNameNoTooltip|U]อ่อนแอ และบางทีตอนนี้อาจถึงตาเราที่จะทำ เช่นเดียวกัน\n\nหากเราช่วยเหลือ[liege.GetTitleAsNameNoTooltip|U] เราอาจได้รับความโปรดปรานจาก[liege.GetHerHis]และพันผูกอิทธิพลของเราไว้รอบบัลลังก์ดุจเถาวัลย์อันแข็งแกร่ง..."
 ep3_powerful_families.8010.a: "ความช่วยเหลือทางการเงินบางส่วนจะ ทำให้ได้รับความไว้วางใจจาก[liege.GetHerHis]"
 ep3_powerful_families.8010.b: "เราควรส่งกองกำลังของเราเข้าร่วมสงครามโดยตรง!"
 ep3_powerful_families.8010.c: "เราต้องฉวยประโยชน์จากช่วงเวลาแห่งความอ่อนแอนี้"
 ep3_powerful_families.8010.a.win: "อิทธิพลของท่านเพิ่มพูนขึ้น"
 ep3_powerful_families.8010.a.lose: "[liege.GetTitleAsNameNoTooltip|U]เริ่มระแวง"
 ep3_powerful_families.8010.d: "ยังไม่ถึงเวลา"
 ep3_powerful_families.8011.t: "[generous_family.Custom2('AppropriateGreetingPositive', liege )]"
 ep3_powerful_families.8011.desc: "การต่อสู้อันกล้าหาญของท่านใน[war.GetName]มิได้รอดพ้นสายตาของตระกูลข้าไปได้ โปรดรับส่วนแบ่งจากทรัพย์สินของเราไป และขอให้มันช่วยนำชัยชนะมาสู่พวกเราทุกคน!"
 ep3_powerful_families.8011.a: "ช่างมีน้ำใจยิ่งนัก"
 ep3_powerful_families.8012.t: "ตระกูลที่ร่วมรบเคียงบ่าเคียงไหล่"
 ep3_powerful_families.8012.desc: "เป็นที่ทราบกันดีว่า[war.GetName]ไม่ได้ดำเนินไปได้ด้วยดีอย่างที่เราคาดหวังไว้ในตอนแรก และเหล่าตระกูลที่ขัดแย้งกันก็ได้เริ่มวางแผนหาทางที่จะเข้ามาเติมเต็มสุญญากาศทางอำนาจที่กำลังขยายตัวในอาณาจักรแล้ว อย่างไรก็ตาม [generous_family.GetName|U]กลับพยายามทำ เช่นนั้นในทางที่เป็นประโยชน์ต่อข้ามากที่สุด\n\nในจดหมายของ[generous_family.GetHerHis] [generous_family.GetSheHe]เสนอที่จะส่งกองทัพของ[generous_family.GetHerHis]เข้าร่วมสงคราม เพียงเพื่อแลกกับตำแหน่งกิตติมศักดิ์และอำนาจจำนวนมาก"
 ep3_powerful_families.8012.a: "ตกลง"
 ep3_powerful_families.8012.a.toast: "[liege.GetFirstName] ยอมรับข้อเสนอของท่าน"
 ep3_powerful_families.8012.b: "ข้าจะไม่ยอมถูกเอาเปรียบ!"
 ep3_powerful_families.8012.b.toast: "[liege.GetFirstName] ปฏิเสธข้อเสนอของท่าน"
 ep3_powerful_families.8020.t: "เริ่มผลิบาน"
 ep3_powerful_families.8020.desc: "ทั่วทั้งอาณาจักร อำนาจของตระกูลใหม่ดูเหมือนกำลังหยั่งราก พวกเขาได้แผ่อิทธิพลไปทั่วทุกมุมของสังคมราวกับวัชพืช และแทบไม่มีวันใดเลยที่จะหลีกเลี่ยงการได้ยินชื่อ "[new_family.GetHouse.GetBaseName]" ได้\n\nปฏิเสธไม่ได้ว่าตระกูลนี้ได้เติบโตขึ้นเป็นหนึ่งในตระกูลที่ยิ่งใหญ่ที่สุดในอาณาจักร และบัดนี้ตระกูลของข้าก็มองมาที่ข้าเพื่อขอคำชี้แนะว่าเราควรจะรับมือกับอำนาจใหม่นี้อย่างไร"
 ep3_powerful_families.8020.a: "เราต้องขัดขวางพวกมัน"
 ep3_powerful_families.8020.a.win: "ท่านระงับอิทธิพลของพวกเขาได้ในตอนนี้"
 ep3_powerful_families.8020.a.lose: "ความพยายามของท่านสูญเปล่า"
 ep3_powerful_families.8020.b: "เราต้อง ทำให้พวกเขารู้ว่าเราเป็นมิตร"
 ep3_powerful_families.8020.b.win: "[new_family.GetFirstName] รู้สึกประทับใจ"
 ep3_powerful_families.8020.b.lose: "[new_family.GetFirstName] ไม่รู้สึกประทับใจ"
 ep3_powerful_families.8020.c: "เพียงแค่หลีกเลี่ยงพวกเขา"
 ep3_powerful_families.8030.t: "ตระกูลที่ร่วมกันวางแผน..."
 ep3_powerful_families.8030.desc: "[faction.GetName|U]ยังคงเป็นขบวนการที่เพิ่งเริ่มต้น แต่แน่นอนว่าได้รับการสนับสนุนจากตระกูลอันยิ่งใหญ่ของข้า อย่างไรก็ตาม บางตระกูลดูเหมือนจะยังไม่เห็นความชอบธรรมของอุดมการณ์นี้ และจนถึงบัดนี้ก็ยังเมินเฉยต่อโอกาสที่จะเข้าร่วมกับเรา\n\nขณะที่ข้าร่างจดหมายประสานงานความเคลื่อนไหวต่อไปของฝ่าย ข้าอดสงสัยไม่ได้ว่าเหตุใด [friendly_family.Custom2('MyCharacterIntroduction', ROOT.Char)] จึงยังไม่ออกมาแสดงการสนับสนุนอุดมการณ์นี้"
 ep3_powerful_families.8030.a: "ข้าต้องติดต่อ[friendly_family.GetHerHim]ทันที!"
 ep3_powerful_families.8030.a.win: "ท่านโน้มน้าว[friendly_family.GetHerHim]ได้สำเร็จ"
 ep3_powerful_families.8030.a.lose: "ท่านไม่ได้รับการตอบกลับ"
 ep3_powerful_families.8030.b: "นี่ไม่ใช่สิ่งที่มิตรสหายพึงกระทำต่อกัน"
 ep3_powerful_families.8040.t: "อย่างเป็นกันเอง"
 ep3_powerful_families.8040.desc: "นับตั้งแต่[location.GetName]ตกอยู่ในการครอบครองของตระกูล [other_family.GetHouse.GetName] ข้าก็เริ่มรู้สึกเหมือนเป็นแขกในคฤหาสน์ของตัวเอง แน่นอนว่าที่ดินภายในบ้านเป็นของข้า แต่ทุกสิ่งนอกประตูรั้วเป็นของ[other_family.GetName]\n\nขณะที่ข้าเดินเล่นยามเช้าไปรอบๆ บริเวณ ข้าอดสงสัยไม่ได้ว่ามันจะเป็นประโยชน์ทางการเมืองหรือไม่หากมี[other_family.GetFirstNameNoTooltip]เดินอยู่เคียงข้างข้า..."
 ep3_powerful_families.8040.a: "เราต้องเชิญ[other_family.GetHerHim]มาทันที!"
 ep3_powerful_families.8040.a.win: "การเยี่ยมเยียนเป็นไปด้วยดี"
 ep3_powerful_families.8040.a.lose: "การเยี่ยมเยียนเป็นหายนะ"
 ep3_powerful_families.8040.b: "เราต้องพยายาม ทำให้ดินแดนเหล่านี้เป็นของเรา"
 ep3_powerful_families.8040.b.win: "อิทธิพลของท่านแผ่ขยาย"
 ep3_powerful_families.8040.b.lose: "แผนการของท่านถูกเปิดโปง"
 ep3_powerful_families.8040.c: "ข้าต้องก้มหน้าก้มตาต่อไป"
 ep3_powerful_families.8060.t: "คฤหาสน์อันชั่วร้าย"
 ep3_powerful_families.8060.desc: "ข้าเดินเล่นอย่างสบายอารมณ์ผ่าน[location.GetNameNoTier]พร้อมด้วยผู้ติดตามที่ไว้ใจและผู้คุ้มกันตามปกติ และชื่นชมอาคารอันงดงามที่นั่น ข้าดื่มด่ำกับความสุขในดินแดนที่ข้าปกครอง แต่แล้วอารมณ์ของข้าก็ขุ่นมัวเมื่อเห็นที่ดินอันน่าเกลียดน่าชังของตระกูล [other_family.GetHouse.GetName]\n\nทรัพย์สินของพวกเขาเปรียบเสมือนหูดที่กระจายอยู่ทั่วดินแดนอันสมบูรณ์แบบของข้า และข้ารู้สึกเลือดลมพลุ่งพล่านเมื่อคิดถึงการต้องทนอยู่ร่วมกับพวกเขาต่อไป"
 ep3_powerful_families.8060.a: "โจมตีการเงินของพวกเขา"
 ep3_powerful_families.8060.a.win: "ท่านรีดไถทรัพย์สินของพวกเขา"
 ep3_powerful_families.8060.a.lose: "ท่านถูกจับได้"
 ep3_powerful_families.8060.b: "ติดสินบนคนรับใช้ของพวกเขา"
 ep3_powerful_families.8060.c: "ข้าต้องทนกับการมีอยู่ของพวกเขาไปก่อน"
 ep3_powerful_families.8070.t: "ความเขลา"
 ep3_powerful_families.8070.desc: "ทหารยามของข้าโยน [child.GetName] ที่ตัวสั่นเทามาแทบเท้าข้า ใบหน้าของ [child.GetHerHis|U] ฉายชัดถึงความละอาย และข้าสุดจะคาดเดาได้ว่า [child.GetSheHe] ได้ทำสิ่งใดลงไป\n\n"พวกเราพบ [child.Custom2('InsultNoun', ROOT.Char)] ผู้นี้กำลังทำ[child.GetHerselfHimself]คุ้นเคยอยู่ที่คฤหาสน์ [other_family.GetHouse.GetName] ท่านมิต้องสงสัยเลยว่าความภักดีที่แท้จริงของ [child.GetHerHis] อยู่ที่ใด"\n\nความคิดที่ว่าญาติของข้าเองไปคบค้าสมาคมกับศัตรูนั้นช่างน่ารังเกียจ แต่บางทีความเชื่อมโยงของ [child.GetHerHis] อาจนำมาใช้ประโยชน์ได้"
 ep3_powerful_families.8070.a: ""จงไปที่นั่นต่อไป และบอกข้าทุกอย่าง""
 ep3_powerful_families.8070.a.win: "[child.GetFirstNameNoTooltip|U]กลายเป็นผู้ให้ข้อมูลแก่ท่าน"
 ep3_powerful_families.8070.a.lose: "[child.GetFirstNameNoTooltip|U]ถูกจับได้"
 ep3_powerful_families.8070.b: ""จงพยายามยุติความเป็นศัตรูอันโง่เขลานี้ของเราเสีย""
 ep3_powerful_families.8070.b.crit_win: "[child.GetFirstNameNoTooltip|U]ยุติความเป็นศัตรูได้"
 ep3_powerful_families.8070.b.win: "[child.GetFirstNameNoTooltip|U]มีความคืบหน้า"
 ep3_powerful_families.8070.b.lose: "[child.GetFirstNameNoTooltip|U]ล้มเหลว"
 ep3_powerful_families.8070.c: ""ไปให้พ้นสายตาข้า""
 ep3_powerful_families.8080.t: "ความเงียบงันอันตะกุกตะกัก"
 ep3_powerful_families.8080.desc: "เสียงแก้วกระทบกันดึงความสนใจทั้งหมดไปที่[other_family.GetName] ซึ่งยืนขึ้นเพื่อกล่าวสุนทรพจน์ [other_family.GetSheHe|U]เริ่มต้นได้ดี แต่การลังเลเล็กน้อยในไม่ช้าก็กลายเป็นความเงียบอันยาวนานและน่าอึดอัด\n\n[other_family.GetSheHe|U]มองมาที่ข้าด้วยสีหน้าหวาดกลัวและสิ้นหวังบนใบหน้าของ[other_family.GetHerHis] วิงวอนข้าอย่างเงียบๆ ให้เข้าไปช่วยเหลือ[other_family.GetHerHis]"
 ep3_powerful_families.8080.a: "โอกาสอันสมบูรณ์แบบที่จะ ทำให้ตระกูล [other_family.GetHouse.GetNameNoTooltip] อับอาย!"
 ep3_powerful_families.8080.b: "ข้าจะช่วย"
 ep3_powerful_families.8090.t: "ความป่าเถื่อนในหมู่ชนชั้นสูง"
 ep3_powerful_families.8090.desc: "ค่ำคืนนี้ ข้าถูกขนาบข้างระหว่าง [liege.GetName] และ [other_family.GetName] ผู้ [other_family.Custom2('InsultAdjective', ROOT.Char)] ข้าถูกบังคับให้ทนฟังเจ้าคนประจบสอพลอนั่นพล่ามไม่หยุดเกี่ยวกับความภักดีและความสามารถที่ป่าวประกาศของตระกูล [other_family.GetHouse.GetName]\n\nสิ่งที่น่าสะอิดสะเอียนยิ่งกว่าถ้อยคำที่พรั่งพรูจากปากของ [other_family.GetHerHis] ก็คือเศษอาหารที่กระเด็นออกมาพร้อมกัน ข้าต้องหาทาง ทำให้ [other_family.Custom2('InsultNoun', ROOT.Char)] ผู้นี้เงียบปากให้จงได้ อย่างน้อยก็เพื่อบรรเทาอาการปวดหัวของข้า"
 ep3_powerful_families.8090.a: ""แล้วตระกูล [ROOT.Char.GetHouse.GetNameNoTooltip] เล่าพ่ะย่ะค่ะ/เพคะ เจ้าเหนือหัว?""
 ep3_powerful_families.8090.a.win: "[liege.GetFirstNameNoTooltip|U]รู้สึกประทับใจ"
 ep3_powerful_families.8090.a.lose: "[liege.GetFirstNameNoTooltip|U]รู้สึกเบื่อหน่าย"
 ep3_powerful_families.8090.b: "เดี๋ยวค่ำคืนนี้ก็สิ้นสุดลง"
 ep3_powerful_families.8100.t: "การรับใช้บ้านเมือง"
 ep3_powerful_families.8100.desc: "เย็นนี้ข้าโชคดีพอที่จะได้สนทนากับ[liege.GetName] [liege.GetSheHe|U]คร่ำครวญถึงการใช้เวลาหลายค่ำคืนโดยไม่ได้ฟังบทกวีอันไพเราะ\n\nข้าระลึกได้ว่า[cp_fam.GetName|U]ได้อุทิศเวลาหลายวันเดินเล่นในสวนฝึกฝนความเชี่ยวชาญในภาษา[cp_fam.GetCulture.GetLanguage.GetNameNoTooltip]ของ[cp_fam.GetHerHis] งานอดิเรกนี้ของ[cp_fam.GetHerHis]อาจนำมาใช้ประโยชน์ในการแผ่อิทธิพลของเราในราชสำนัก[liege.GetPrimaryTitle.GetAdjective]ได้..."
 ep3_powerful_families.8100.a: ""[cp_fam.GetFirstNameNoTooltip|U]เป็นกวีที่ยอดเยี่ยมพ่ะย่ะค่ะ/เพคะ เจ้าเหนือหัว!""
