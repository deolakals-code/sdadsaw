l_english: 
 
 travel_events_bp3.1.t: "ฤดูกาลแห่งการเปลี่ยนแปลง"
 travel_events_bp3.1.desc: "ขณะที่เราเตรียมออกเดินทางในยามเช้า ข้าเห็น [ROOT.Char.Custom2('RelationToMeShort', friendly_character)] [friendly_character.GetFirstName] ยืนอยู่เพียงลำพังนอกค่ายพัก เมื่อข้าเดินเข้าไปพูดคุยกับ [friendly_character.GetHerHim] ข้าสังเกตเห็นสายลมที่เปลี่ยนทิศทาง\n\n"
 travel_events_bp3.1.desc.spring: "สายลมอุ่นอย่างน่าประหลาดใจพัดผ่านใบหน้าข้าชั่วครู่ เป็นการเปลี่ยนแปลงที่สังเกตได้จากอากาศหนาวเย็นที่เราเผชิญเมื่อเร็วๆ นี้ ในที่สุดก็ถึงฤดูใบไม้ผลิ"
 travel_events_bp3.1.desc.summer: "ลมร้อนพัดเสื้อผ้าข้าครู่หนึ่ง และข้าสังเกตเห็นแสงแดดอันน่ารื่นรมย์ส่องลงมาที่ค่าย สัญญาณของวันที่อากาศอบอุ่นกำลังจะมาถึง"
 travel_events_bp3.1.desc.autumn: "ลมฤดูใบไม้ร่วงอันสดชื่นพัดผ่านค่าย คว้าใบไม้และฝุ่นจากพื้นดิน ฤดูร้อนผ่านพ้นไปแล้ว ถึงเวลาเตรียมตัวสำหรับความหนาวเย็นของฤดูใบไม้ร่วงและฤดูหนาว"
 travel_events_bp3.1.desc.autumn_desert: "ลมฤดูใบไม้ร่วงอันสดชื่นพัดผ่านค่าย คว้าทรายและฝุ่นจากพื้นดิน ฤดูร้อนผ่านพ้นไปแล้ว ถึงเวลาเตรียมตัวสำหรับความหนาวเย็นของฤดูใบไม้ร่วงและฤดูหนาว"
 travel_events_bp3.1.desc.winter: "ข้ากระชับเสื้อผ้ารอบตัวขณะที่ลมหนาวพัดกระแทกหลัง ความหนาวเย็นกระซิบว่าถึงเวลาสำหรับฤดูหนาวอีกครั้ง"
 travel_events_bp3.1.desc.winter_snow: "ข้ากระชับเสื้อผ้ารอบตัวขณะที่ลมหนาวพัดกระแทกหลัง และข้าเห็นสัญญาณแรกของหิมะ ความหนาวเย็นกระซิบว่าถึงเวลาสำหรับฤดูหนาวอีกครั้ง"
 travel_events_bp3.1.desc.dry_season: "ลมแห้งพัดผ่านค่าย ทิ้งฝุ่นฟุ้งไว้เบื้องหลัง ฤดูแล้งมาถึงแล้ว หวังว่ามันจะไม่ส่งผลกระทบต่อการเดินทางของเรามากนัก"
 travel_events_bp3.1.desc.rainy_season: "ลมกระโชกแรงคว้าเสื้อผ้าข้าครู่หนึ่งและฝนก็เริ่มตกปรอยๆ แต่เมฆสีเทาเข้มเหนือศีรษะกรีดร้องว่าพายุกำลังก่อตัว"
 travel_events_bp3.1.a: ""ถึงเวลาสำหรับ [ROOT.Char.Custom('GetSeason')] อีกครั้งแล้วสินะ?""
 travel_events_bp3.1.b: ""กลับขึ้นม้าของเจ้าเสีย [friendly_character.GetFirstNameNoTooltip]""
 travel_events_bp3.1.b.flavor: ""เราจะมีเวลาเหลือเฟือที่จะชมทิวทัศน์ขณะเดินทางไปยัง [ROOT.Char.GetTravelPlan.GetData.GetNextDestination.GetProvince.GetName]""

 travel_events_bp3.5.t: "ติดอยู่ข้างนอก"
 travel_events_bp3.5.desc.snow: "ทันทีที่เรากำลังจะออกเดินทาง หิมะก็เริ่มตก ข้าอดไม่ได้ที่จะสาปแช่งโชคชะตาอันเลวร้ายของข้า แต่ข้าเห็นเมฆก่อตัวมาสักพักแล้ว และดูเหมือนว่าจะไม่หยุดตกในเร็วๆ นี้\n\nหากเราต้องการเดินทางให้ทันเวลา เราต้องออกเดินทาง แต่การขี่ม้าฝ่าพายุหิมะนั้นเสี่ยงอย่างยิ่ง"
 travel_events_bp3.5.desc.rain: "ทันทีที่เรากำลังจะออกเดินทาง ฝนก็เริ่มเทลงมา ฝนตกสุดลูกหูลูกตา ข้าอดไม่ได้ที่จะสาปแช่งโชคชะตาอันเลวร้ายของข้า แต่ข้าเห็นเมฆดำก่อตัวมาสักพักแล้ว\n\nหากเราต้องการเดินทางให้ทันเวลา เราต้องออกเดินทาง แต่มันเป็นการเดินทางที่เสี่ยงด้วยสภาพอากาศที่เป็นอยู่"
 travel_events_bp3.5.a: "ข้าว่านี่เป็นโอกาสที่จะได้พักผ่อน"
 travel_events_bp3.5.b.snow: "หิมะเล็กน้อยไม่ทำร้ายใครหรอก"
 travel_events_bp3.5.b.rain: "ฝนเล็กน้อยไม่ทำร้ายใครหรอก"
 travel_events_bp3.5.b.tt: "สมาชิก [entourage|E] อาจได้รับ [trait|E] #color_white [GetTrait('ill').GetName(GetNullCharacter)]#! "

 travel_events_bp3.10.t: "ผู้แสวงบุญสู่ [holy_location.GetNameNoTooltip]"
 travel_events_bp3.10.desc: "ขณะที่เรานั่งข้างกองไฟหลังจากวันอันยาวนาน กลุ่มนักเดินทางก็เข้ามาหาเราในความมืด "
 travel_events_bp3.10.desc.holy_order: "กองอัศวินกลุ่มหนึ่ง นำโดย [holy_order_character.GetWomanMan] ท่าทางองอาจ อัศวิน แต่ละคนล้วนดูมั่งคั่งยิ่งนัก\n\n"[ROOT.Char.Custom('FormOfAddressForLiege')|U] นับเป็นเกียรติอย่างยิ่งที่ได้พบท่าน ข้าคือ [holy_order_character.GetName] แห่ง [grandmaster.GetPrimaryTitle.GetName] พวกเราเดินทางมาไกลแสนไกลเพื่อไปยัง [holy_location.GetName] และพวกเราต้องการหยุดพักก่อนการเดินทางช่วงสุดท้าย พวกเราขอร่วมกองไฟของท่านได้หรือไม่?""
 travel_events_bp3.10.desc.pilgrims: "พวกเขาดูเหมือนกลุ่มผู้แสวงบุญที่หลงทาง นำโดย [pilgrim_character.GetWomanMan] ที่ดูอิดโรย แม้จะเห็น เช่นนั้นในคราแรก ข้ากลับสังเกตเห็นว่าพวกเขาทุกคนต่างก็มีของมีค่าติดตัว ไม่ประเภทใดก็ประเภทหนึ่ง\n\n"ได้โปรดเถิด [ROOT.Char.Custom('FormOfAddressForLiege')] โปรดอนุญาตให้พวกเราพักข้างกองไฟของท่านได้หรือไม่? พวกเราผ่านการเดินทางอันยาวนานมา...""
 travel_events_bp3.10.a: ""มาเถิด มาเถิด! เพลิดเพลินกับกองไฟของเรา และเล่าเรื่องการเดินทางของท่านให้เราฟัง!""
 travel_events_bp3.10.b: ""เราสามารถเดินทางไปยัง [holy_location.GetNameNoTooltip] ด้วยกันได้""
 travel_events_bp3.10.c.holy_order: ""#emp ซุ่มโจมตี! ป้องกันค่าย!#!""
 travel_events_bp3.10.c.pilgrims: ""โอ้ ข้าจะปลดเปลื้องความทุกข์ของท่านเอง...""
 travel_events_bp3.10.c.flavor: "คงไม่มีใครสังเกตเห็นหากผู้แสวงบุญสองสามคนหลงทางระหว่างการเดินทาง ใช่ไหม?"
 travel_events_bp3.10.d: ""ไม่ ที่นี่ไม่มีที่ว่างสำหรับพวกท่าน""

 holy_pilgrims_travel_modifier: "นำทางผู้แสวงบุญ"
 holy_pilgrims_travel_modifier_desc: "คณะเดินทางนี้กำลังคุ้มครองกลุ่มผู้แสวงบุญระหว่างทางไปยังสถานศักดิ์สิทธิ์"

 holy_knights_travel_modifier: "เดินทางกับอัศวิน"
 holy_knights_travel_modifier_desc: "คณะเดินทางนี้ได้รับการคุ้มครองโดยกลุ่มอัศวินผู้กล้าหาญ"

 travel_events_bp3.15.t: "บทเพลงของ [liege.GetTitledFirstNameNoTooltip]"
 travel_events_bp3.15.desc: "ขณะที่เราเดินทางผ่านชานเมือง [location.GetName] เราก็เห็น [bard_character.GetWomanMan] ผู้ร่าเริงอยู่ไกลๆ กระโดดโลดเต้น และร้องเพลงกับ [bard_character.GetHerselfHimself] [bard_character.GetSheHe] ดูเหมือนเป็นตัวละครที่น่าสนใจทีเดียว\n\n"ท่านอยากฟังเพลงของข้าเกี่ยวกับ "
 travel_events_bp3.15.desc.murderer: "#emp '[liege.GetFirstName] คางคก [liege.GetCulture.GetName] ทรราช'#!"
 travel_events_bp3.15.desc.lustful.man: "#emp '[liege.GetFirstName] นักเที่ยวซ่องแห่ง [liege.GetPrimaryTitle.GetName]#!'"
 travel_events_bp3.15.desc.lustful.woman: "#emp '[liege.GetFirstName] หญิงแพศยาแห่ง [liege.GetPrimaryTitle.GetName]#!'"
 travel_events_bp3.15.desc.gluttonous: "#emp '[liege.GetFirstName] สุกรแห่งราชสำนัก [liege.GetCulture.GetName]'#!"
 travel_events_bp3.15.desc.fool: "#emp '[liege.GetFirstName] คนโง่เง่า [liege.GetPrimaryTitle.GetAdjective]'#!" # fopdoodle หมายถึงคนโง่หรือคนสำรวย
 travel_events_bp3.15.desc.craven: "#emp '[liege.GetFirstName] [liege.GetTitleAsNameNoTooltip] ใจเสาะ'#!"
 travel_events_bp3.15.desc.outro: "?!" [bard_character.GetSheHe|U] ตะโกนใส่เราทันทีที่เราเข้าใกล้ระยะตะโกน ก่อนที่เราจะมีเวลาตอบ [bard_character.GetSheHe] ก็เริ่มร้องเพลงสนุกสนานเกี่ยวกับความเสื่อมทรามของ [liege.GetTitledFirstNameNoTooltip]"
 travel_events_bp3.15.a: ""เล่าเรื่อง [liege.GetTitleAsNameNoTooltip] ให้ข้าฟังอีก""
 travel_events_bp3.15.a.tt: "ท่านอาจได้เรียนรู้หนึ่งใน [secrets|E] ของ [liege.GetFirstNamePossessive]"
 travel_events_bp3.15.b: ""เจ้าดูเป็น [bard_character.GetWomanMan] ที่น่าสนใจ อยากจะร่วมเดินทางกับข้าไหม?""
 travel_events_bp3.15.c: ""หุบปากของเจ้าเสีย เจ้าชาวนาชั้นต่ำ!""

 travel_events_bp3.20.t: "[SCOPE.Custom('LocalGuildsLoc')]"
 travel_events_bp3.20.desc: "ขณะที่คณะเดินทางของข้ากำลังเดินทางผ่าน [ROOT.Char.GetCurrentLocation.GetName] เราได้สนทนากับตัวแทนของ [SCOPE.Custom('LocalGuildsLoc')] ท้องถิ่น ซึ่งเป็น [merchant_character.GetWomanMan] ผู้กระตือรือร้นและมีเสน่ห์ชื่อ [merchant_character.GetFirstName]\n\n"จาก [ROOT.Char.GetPrimaryTitle.GetNameNoTier] ท่านว่าอย่างนั้นรึ? อันที่จริงเราสนใจที่จะตั้งโรงงานใน [new_home_province.GetName] ท่านพอจะช่วยเราได้หรือไม่?" [merchant_character.GetSheHe|U] ขยิบตาให้ข้า และวางเหรียญลงบนโต๊ะ"
 travel_events_bp3.20.a: ""ใน [new_home_province.GetNameNoTooltip]? ได้สิ ทำไมจะไม่ได้!""
 travel_events_bp3.20.b: ""ส่งเงินมาให้ข้าโดยตรง แล้วข้าจะจัดการให้...""
 travel_events_bp3.20.b.tt: "คงไม่มีใครว่าอะไรหรอก หากเราจะเลี่ยงกฎหมายและข้อบังคับบางอย่าง เพื่อให้ข้อตกลงนี้สำเร็จ ข้ามั่นใจ"
 travel_events_bp3.20.c: ""บอกข้าเกี่ยวกับธุรกิจและเมืองที่งดงามของท่านดีกว่า""

 travel_events_bp3.25.t: "ความยากลำบากของสงคราม"
 travel_events_bp3.25.desc: "ขณะที่เราเดินผ่านถนนใน [ROOT.Char.GetCurrentLocation.GetName] ขบวนทหารก็โผล่ออกมาจากถนนด้านข้าง ส่วนใหญ่บาดเจ็บและได้รับการช่วยเหลือจากพลเรือนที่สิ้นหวัง\n\nผู้ประกาศยืนอย่างภาคภูมิใจหน้าฝูงชนที่รวมตัวกันรอบตลาด และประกาศด้วยเสียงดัง: "เราได้บดขยี้พวกสุนัข [opponent.GetPrimaryTitle.GetAdjective] อีกครั้ง! อีกไม่นานชัยชนะจะเป็นของเรา!"\n\n"
 travel_events_bp3.25.desc.outro: "ทว่าคำเฉลิมฉลองกลับซีดจางเมื่อข้ามองดูทหารที่บาดเจ็บ และญาติที่โศกเศร้าของพวกเขา"
 travel_events_bp3.25.desc.outro.sadistic: "ทว่าข้าอดไม่ได้ที่จะหัวเราะคิกคัก เมื่อข้ามองดูคนโง่เหล่านี้ที่ทำลายชีวิตของตนเอง"
 travel_events_bp3.25.a: "ข้าจะบริจาคเหรียญให้แก่ผู้น่าสงสารเหล่านี้"
 travel_events_bp3.25.b: "บางทีพวกเขาอาจมีปัญญาบางอย่างที่จะแบ่งปันจากการต่อสู้ของพวกเขา?"
 travel_events_bp3.25.b.insulted: "ท่านดูถูกผู้รอดชีวิต"
 travel_events_bp3.25.b.stories: "ท่านได้ยินเรื่องราวเกี่ยวกับการต่อสู้"
 travel_events_bp3.25.b.martial: "ท่านได้ยินเกี่ยวกับความผิดพลาดทางยุทธศาสตร์ของ [liege.GetPrimaryTitle.GetAdjectiveNoTooltip]"
 travel_events_bp3.25.b.prowess: "ท่านได้ยินว่า [liege.GetPrimaryTitle.GetAdjectiveNoTooltip] ต่อสู้อย่างไร"
 travel_events_bp3.25.c: "เอาล่ะ... พอแล้วกับความเศร้าโศกนี้ เรามีที่ที่ต้องไป"

 travel_events_bp3.30.t: "ทหารรับจ้างแห่ง [ROOT.Char.GetCurrentLocation.GetNameNoTooltip]"
 travel_events_bp3.30.desc: "เรานั่งอยู่ในโรงเตี๊ยมที่เงียบสงบใน [ROOT.Char.GetCurrentLocation.GetName] เมื่อกลุ่มทหารที่ดูโทรมส่งเสียงดังเข้ามาในห้องส่วนกลาง ผู้นำของพวกเขา ซึ่งเป็นคนป่าเถื่อนที่มั่นใจ ผลักทหารยามคนหนึ่งของข้าออกไปและกล้าที่จะนั่งลงที่โต๊ะของข้า\n\n"ชนชั้นสูง [ROOT.Char.GetWomanMan] สินะ ท่าน '[ROOT.Char.GetLadyLord]' ของข้า? สนใจบริการของกองทหารรับจ้างที่ดีที่สุดใน [ROOT.Char.GetCurrentLocation.GetNameNoTooltip] หรือไม่? ท่านจะหาคนที่ภักดีกว่านี้ไม่ได้อีกแล้ว! อย่างน้อยก็ถ้าท่านจ่ายเงินให้เราอย่างเหมาะสม..."
 travel_events_bp3.30.a: ""#emp ที่สุด#!? เจ้า ทำให้ข้าสนใจ..."
 travel_events_bp3.30.b: ""เจ้าสนใจที่จะเข้าร่วมกองทหารของข้าหรือไม่?""
 travel_events_bp3.30.c: ""ข้ามีงานที่ #emp เหมาะสมที่สุด#! สำหรับเจ้า""
 travel_events_bp3.30.d: ""ไม่ ข้าแค่มาที่นี่เพื่อพักผ่อนเล็กน้อย""
 travel_events_bp3.30.e: ""#bold #emp ขอประทานโทษ? #!#!""

 mercenary_army_default: "ทหารรับจ้าง"

 travel_events_bp3.35.t: "ครูสอนอัศวิน"
 travel_events_bp3.35.desc.traveling: "ขณะเดินผ่านถนนใน [ROOT.Char.GetCurrentLocation.GetName] [kid_character.GetFirstName] ก็วิ่งไปยังถนนด้านข้างทันที ทั้งคณะเดินทางต่างประหลาดใจ และเราทุกคนวิ่งตาม [kid_character.GetHerHim] ไป เพียงเพื่อพบ [kid_character.GetHerHim] กำลังโบกดาบไม้ที่บิดเบี้ยวใส่ [soldier_character.GetWomanMan] ชราผู้หนึ่ง\n\n"นั่นคือสิ่งที่ดีที่สุดที่เจ้าทำได้แล้วหรือ ท่าน [kid_character.Custom('GetPrincessPrince')] น้อย?" เขาหันมาหาเรา หลังจากหยอกล้อ [kid_character.GetFirstNameNoTooltip] ที่กำลังโกรธ,"
 travel_events_bp3.35.desc.home: "ขณะเดินผ่านถนนใน [ROOT.Char.GetCurrentLocation.GetName] เราเห็นฝูงเด็กชาวนาตัวน้อยรวมตัวกันรอบ [soldier_character.GetWomanMan] ชราผู้หนึ่งที่ถนนเล็กๆ ด้านข้าง หลายคนกำลังโบกดาบไม้เล็กๆ ที่บิดเบี้ยวไปมาและตะโกนอย่างตื่นเต้นขณะพยายามตี [soldier_character.GetHerHim]\n\n"ใครจะประทับใจฝีเท้าแบบนั้นกันหา?" [soldier_character.GetSheHe|U] หันมาหาเรา หลังจากหยอกล้อเด็กคนหนึ่ง,"
 travel_events_bp3.35.outro.non_martial_gender: "พลางก้มศีรษะของ [soldier_character.GetHerHis] ให้ข้าเล็กน้อย "มีสิ่งใดให้ข้ารับใช้หรือไม่ [ROOT.Char.Custom('FormOfAddressForLiege')]? ข้าหวังว่าคงมิได้ล่วงเกินท่าน ข้าเพียงแค่สอนเชิงดาบให้เด็กๆ แถวนี้เท่านั้น""
 travel_events_bp3.35.outro.martial_gender: "และเอ่ยขึ้นพร้อมรอยยิ้มมุมปาก: "ท่านอยากร่วมวงด้วยหรือ [ROOT.Char.Custom('FormOfAddressForLiege')]? ข้าคิดว่าท่านอาจจะอายุเกินกลุ่มปกติของข้าไปสักหน่อย""
 travel_events_bp3.35.a.travel: ""ข้าต้องการให้ท่านสอน [kid_character.GetFirstNameNoTooltip] ต่อไป""
 travel_events_bp3.35.a.home: ""ท่านยินดีที่จะมายัง [ROOT.Char.GetCapitalLocation.GetNameNoTooltip] เพื่อสอนหรือไม่?""
 travel_events_bp3.35.a.tt: "ปรับปรุงผลลัพธ์ [education|E] ของ [ward|E] สำหรับ [kid_character.GetFirstName]"
 travel_events_bp3.35.b.martial: ""แน่นอน ข้าลองดูได้""
 travel_events_bp3.35.b.non_martial: ""อันที่จริงข้าสนใจที่จะลองด้วยตัวเอง เช่นกัน...""
 travel_events_bp3.35.b.win: "ท่านชนะการประลอง"
 travel_events_bp3.35.b.lose: "ท่านแพ้การประลอง แต่ [soldier_character.GetSheHe] ช่วยฝึกฝนทักษะของท่าน"
 travel_events_bp3.35.c.travel: ""ขอบคุณที่พบ [kid_character.Custom('GetDaughterSon')] ของข้า""
 travel_events_bp3.35.c.home: ""ไม่ ข้าแค่ดูอยู่""

 knight_teacher_modifier: "ครูสอนอัศวิน"
 knight_teacher_modifier_desc: "อัศวินชราผู้ใช้ชีวิตทั้งชีวิตในการต่อสู้และสอนผู้อื่น\n\nปรับปรุง [education|E] ของ [ward|E]"

 travel_events_bp3.40.t: "การประลองยุทธ์"
 travel_events_bp3.40.desc: "ขณะที่เราผ่านตลาดใน [ROOT.Char.GetCurrentLocation.GetName] เราได้ยินเสียงตะโกนดังและบังเอิญพบกับการต่อสู้ที่กำลังดำเนินอยู่ระหว่าง [soldier_character.GetWomenMen] สองคน ซึ่งมีกลุ่มคนเฝ้าดูอย่างใกล้ชิด\n\nฝูงชนโห่ร้องอย่างกึกก้องเมื่อคนหนึ่งถูกกวาดเท้าล้มลง หน้าจมลงไปในดินอย่างสงบ เป็นอันสิ้นสุดการแข่งขัน\n\n"ใครคนต่อไป?!" [soldier_character.GetWomanMan] ตะโกนใส่ฝูงชน และสายตาของ [soldier_character.GetHerHis] ก็จับจ้องมาที่กลุ่มของเรา "
 travel_events_bp3.40.outro.challenger: "ข้างกายข้า [challenger_character.GetTitledFirstName] พ่นลมหายใจตอบสนองต่อคำท้าทาย"
 travel_events_bp3.40.fallback: "ใบหน้าของ [soldier_character.GetHerHis|U] แยกออกเป็นรอยยิ้มร้ายกาจ ขณะที่ [soldier_character.GetSheHe] มองมาที่เรา"
 travel_events_bp3.40.a: ""ข้าจะทำเอง""
 travel_events_bp3.40.b: ""สู้เข้า ท่านทำได้ [challenger_character.GetFirstNameNoTooltip]!""
 travel_events_bp3.40.c: "ดูเหมือนว่าถึงเวลาต้องไปแล้ว..."

 travel_events_bp3.40.win: "ชนะการประลอง"
 travel_events_bp3.40.lose: "แพ้การประลอง"

 travel_events_bp3.45.t: "อัศวินพเนจร"
 travel_events_bp3.45.desc: "ขณะที่เราเดินผ่านถนนใน [ROOT.Char.GetCurrentLocation.GetName] มีเสียงดังเอะอะที่แผงขายของแห่งหนึ่ง โดยมี [knight_character.GetWomenMen] สองคนตะโกนใส่กัน ก่อนที่เราจะไปถึงที่นั่น [knight_character.GetWomanMan] ผู้หนึ่งได้ก้าวเข้าไประหว่างกลางและพูดคุยให้พวกเขาสงบลงแล้ว\n\n"เห็นไหม มันจะเรียบร้อยดี?" [knight_character.GetSheHe|U] บอกกับ [knight_character.GetWomanMan] ที่แผงขายของด้วยรอยยิ้ม และยื่น [ROOT.Char.GetCurrentLocation.Custom('GetByzantineCoinWithGloss')] ให้ [knight_character.GetHerHim] และด้วยการกระทำที่ใจดีและมีเมตตาอย่างเรียบง่ายนั้น ทุกอย่างก็กลับสู่ภาวะปกติ\n\n[knight_character.GetSheHe|U] หันมาหาเราขณะที่เราเข้าใกล้ ไม่มีธงหรือเครื่องหมายใดบอกข้าถึงเจ้าเหนือหัว บางทีอาจเป็นอัศวินพเนจร?"
 travel_events_bp3.45.a: ""อัศวินผู้มีเกียรติ เช่นท่านควรรับใช้ [ROOT.Char.GetLadyLord] เช่นข้า""
 travel_events_bp3.45.b: ""ข้าขอเสนอเครื่องดื่มให้ท่านได้หรือไม่?""
 travel_events_bp3.45.diplomacy: "เรื่องราวความกล้าหาญ" # Gallantry เน้นความกล้าหาญแบบสุภาพบุรุษ
 travel_events_bp3.45.prowess: "เรื่องราวความเก่งกาจ" # Valor เน้นความกล้าหาญในสนามรบ
 travel_events_bp3.45.piety: "เรื่องราวความมีคุณธรรม" # Chivalry เน้นคุณธรรมแบบอัศวิน
 travel_events_bp3.45.prestige: "เรื่องราวความกล้าหาญ" # Bravery ความกล้าหาญทั่วไป
 travel_events_bp3.45.b.flavor: "บางที [knight_character.GetSheHe] อาจมีเรื่องราวที่จะเล่า?"
 travel_events_bp3.45.c: "ข้าไม่มีเวลาสำหรับคนจรจัดผู้นี้"

 travel_events_bp3.50.t: "คู่หูสองชีวิต"
 travel_events_bp3.50.desc: "ขณะเดินผ่านตรอกด้านหลังใน [ROOT.Char.GetCurrentLocation.GetName] ข้าเห็นเด็กโดดเดี่ยวคนหนึ่งและสุนัขของ [child_character.GetHerHis] นั่งอยู่ที่มุมหลังกำแพงเล็กๆ "เอ้านี่ วาลอร์" [child_character.GetSheHe|U] บอกมันขณะที่ [child_character.GetSheHe] ยื่นขนมปังชิ้นเล็กๆ ให้ โดยไม่เก็บไว้ให้ [child_character.GetHerselfHimself] เลย\n\nเมื่อมองดูทั้งสอง เห็นได้ชัดว่าสุนัขได้รับการดูแลดีกว่าเจ้าของมาก เด็กคนนั้นคงให้ทุกสิ่งที่ [child_character.GetSheHe] หามาได้แก่มัน"
 travel_events_bp3.50.a: ""นี่อาหารสำหรับเจ้า เด็กน้อย""
 travel_events_bp3.50.b: ""มาเถิด ข้าจะดูแลเจ้าเอง""
 travel_events_bp3.50.c: ""สุนัขของเจ้ารึ? #bold สุนัขของข้า#! ต่างหาก""
 travel_events_bp3.50.d: "ข้าไม่มีเวลาสำหรับเด็กกำพร้าสกปรก"

 heartless_modifier: "ไร้หัวใจ"
 heartless_modifier_desc: "ผู้ปกครองไร้หัวใจที่ขโมยของจากเด็กกำพร้า"

 kind_ruler_modifier: "ผู้ปกครองผู้เมตตา"
 kind_ruler_modifier_desc: "เป็นที่รู้จักในการปฏิบัติต่อแม้ แต่เด็กกำพร้าที่ต่ำต้อยที่สุดด้วยความเมตตา"

 travel_events_bp3.55.t: "พ่อค้าเร่"
 travel_events_bp3.55.desc: "ขณะเดินเล่นรอบตลาดของ [ROOT.Char.GetCurrentLocation.GetName] เสียงดังเอะอะก็ดังมาจากแผงขายของห่างจากข้าไปเพียงไม่กี่แผง มี [merchant_character.GetWomanMan] ผู้โกรธเกรี้ยว แสดงท่าทางและโบกมือของ [merchant_character.GetHerHis] "[republic_ruler.GetTitledFirstName] จะตัดหัวเจ้า เพราะเรื่องนี้!" [merchant_character.GetSheHe|U] ตะโกนใส่พ่อค้าอีกคน ซึ่งดูเหมือนจะโกรธยิ่งกว่าเดิมหากเป็นไปได้\n\n"ข้าอยากจะเห็น [republic_ruler.GetHerHim] ลองดู!" เจ้าของแผงไล่พ่อค้าไปด้วยการโบกมือ ไล่ [merchant_character.GetHerHis] อย่างโกรธเคือง พ่อค้าตั้งใจอย่างชัดเจนที่จะทำข้อตกลงให้ได้ไม่ทางใดก็ทางหนึ่ง"
 travel_events_bp3.55.a: "ไปช่วย [merchant_character.GetHerHim] กันเถอะ ก่อนที่เรื่องจะบานปลาย"
 travel_events_bp3.55.a.flavor: "โอกาสอันดีที่จะสร้างความสัมพันธ์กับ [republic_ruler.GetTitledFirstName] หากเราสามารถช่วยเหลือผู้ติดตามของ [republic_ruler.GetHerHis] ได้"
 travel_events_bp3.55.a.tt: "สร้าง [alliance|E] กับ [republic_ruler.GetName]"
 travel_events_bp3.55.b: "ดูเหมือนจะเป็นเวลาที่เหมาะสมที่จะทำเหรียญ..."
 travel_events_bp3.55.b.flavor: "มาดูกันว่าเราจะรีดไถสินค้าจาก [merchant_character.GetHerHim] ในราคาถูกได้หรือไม่"
 travel_events_bp3.55.b.win: "ฉวยโอกาสจากสถานการณ์"
 travel_events_bp3.55.b.lose: "ถูกฉวยโอกาส"
 travel_events_bp3.55.c: "ข้าจะดูละครฉากนี้"

 travel_events_bp3.60.t: "ข้อตกลงเล็กน้อย"
 travel_events_bp3.60.desc: "ขณะที่เราเดินผ่าน [ROOT.Char.GetCurrentLocation.GetName] เราติดอยู่ในฝูงชนที่รอรถเข็นขนาดใหญ่ที่เต็มไปด้วยวัสดุก่อสร้างเคลื่อนที่ออกไป\n\n"ข้าไม่ต้องการของของเจ้า ข้าได้มันถูกกว่าจากที่อื่นแล้ว!" [merchant_character.GetWomanMan] คนหนึ่งตะโกนใส่อีกคน อีกคนดูเศร้าหมองและสับสน\n\n"แต่-แต่... แล้วข้าควรจะทำอย่างไรกับสิ่งเหล่านี้?" [merchant_character.GetSheHe|U] ตอบอย่างอ่อนแรง พูดกับ [merchant_character.GetHerselfHimself] มากกว่าใครอื่น"
 travel_events_bp3.60.a: ""ข้าจะซื้อวัสดุทั้งหมดของท่าน""
 travel_events_bp3.60.b: ""นำสินค้าของท่านมาที่ [ROOT.Char.GetCapitalLocation.GetNameNoTooltip]!""
 travel_events_bp3.60.c: ""หลีกทางไปได้แล้ว!""

 travel_extra_building_resources_modifier: "วัสดุก่อสร้างส่วนเกิน"
 travel_extra_building_resources_modifier_desc: "จังหวัดนี้มีทรัพยากรเหลือใช้จำนวนมากพร้อมที่จะใช้สำหรับโครงการก่อสร้างใหม่\n\n"

 MODIFIER_DEFINITION_EXTRA_BUILDING_RESOURCES: "#emp ใช้เมื่อก่อสร้างอาคารใหม่#!\nทรัพยากร [building|E] ที่เหลืออยู่: #bold $MULTIPLIER|0$/3#!"
 modifier_extra_building_resources_desc: "\t#weak ลดลงสำหรับการใช้งานที่เหลืออยู่แต่ละครั้ง#!"

 travel_extra_building_resources_character_modifier: "การค้าทรัพยากร"
 travel_extra_building_resources_character_modifier_desc: "เส้นทางการค้าที่มีค่า ซึ่งช่วยให้เข้าถึงวัสดุก่อสร้างได้ง่าย"

 travel_events_bp3.65.t: "ไล่ตามกระเป๋าเงิน"
 travel_events_bp3.65.desc: "ขณะที่ข้ากำลังดูแผงขายของในตลาด [ROOT.Char.GetCurrentLocation.GetName] ข้ารู้สึกว่าสายกระเป๋าเงินของข้าถูกตัด แม้ว่าข้าจะตอบสนองทันที แต่หัวขโมยก็หายไปในฝูงชน\n\nเพียง เพราะความบังเอิญล้วนๆ ทหารยามคนหนึ่งของข้าเห็น [thief_character.GetWomanMan] ขณะที่ [thief_character.GetSheHe] มุ่งหน้าเข้าไปในตรอกด้านหลัง "หยุด ไม่งั้นข้าจะตัดหัวเจ้า!" ทหารยามคนหนึ่งของข้าตะโกนใส่ [thief_character.GetHerHim] และหัวขโมยก็หันกลับมา จ้องมองเราอย่างโกรธเคืองและหลบเลี่ยง"
 travel_events_bp3.65.a: ""ข้ามีข้อเสนองานให้เจ้า คิดเสียว่าเงินนั้นเป็นการจ่ายเงินครั้งแรกของเจ้า""
 travel_events_bp3.65.b: ""เจ้าหัวขโมยสกปรก เจ้าคิดว่าจะขโมยของจาก #bold #emp ข้า#!#! ได้รึ?""
 travel_events_bp3.65.c: ""คืนเงินมา แล้วเราจะปล่อยเรื่องนี้ไป""

 travel_events_bp3.70.t: "เทศกาล [ROOT.Char.GetCurrentLocation.GetCulture.GetNameNoTooltip]"
 travel_events_bp3.70.desc: "ขณะที่เราเข้าสู่ [ROOT.Char.GetCurrentLocation.GetName] ข้าสังเกตเห็นทัศนคติที่ร่าเริงและการตก แต่งที่ดูรื่นเริงรอบเมือง ไม่นานนัก คณะเดินทางทั้งหมดของข้าก็เข้าร่วมในงานเทศกาลด้วย\n\n"
 travel_events_bp3.70.desc.entourage: ""ที่นี่เป็นสถานที่ที่เป็นมิตรมาก ท่านไม่คิด เช่นนั้นหรือ?" [dancing_partner.GetFirstName] ถามข้า ขณะที่เราสองคนเต้นรำด้วยกันท่ามกลางฝูงชน"
 travel_events_bp3.70.desc.local: ""ยินดีต้อนรับสู่ [ROOT.Char.GetCurrentLocation.GetNameNoTooltip]!" [local_character.GetWomanMan] ที่ข้าลงเอยด้วยการเต้นรำด้วยบอกข้าอย่างกระตือรือร้น ขณะที่ [local_character.GetSheHe] วางมือของ [local_character.GetHerHis] ลงบนมือข้า"
 travel_events_bp3.70.desc.outro: "ข้าได้ยินเสียงเชียร์ดังจากทุกคนรอบตัวเราขณะที่นักดนตรีจบเพลงหนึ่ง และอีกเพลงก็เริ่มขึ้น"
 travel_events_bp3.70.a: "ข้าหวังว่า [ROOT.Char.GetCapitalLocation.GetNameNoTooltip] จะเป็นแบบนี้บ้าง..."
 travel_events_bp3.70.a.cultural_acceptance: "[cultural_acceptance|E] ที่จำเป็นในการ [hybridize|E] กับ [root_scope.MakeScope.Var('special_culture_tooltip').Culture.GetName] ลดลง #color_white 25%#!"
 travel_events_bp3.70.a.counties: "สามารถ [hybridize|E] กับ [root_scope.MakeScope.Var('special_culture_tooltip').Culture.GetName] ได้ แม้ว่าจะไม่มี [counties|E] ใน [realm|E] ของท่านที่มี [culture|E]"
 travel_events_bp3.70.b: "รู้สึกเหมือนอยู่บ้านเลย!"

 travel_events_bp3.75.t: "ความฝันที่กำลังก่อตัว"
 travel_events_bp3.75.desc: "ขณะที่ข้าเดินผ่านจัตุรัสตลาดเล็กๆ ใน [ROOT.Char.GetCurrentLocation.GetName] ข้าเห็น [brewmaster_character.GetWomanMan] ผู้หนึ่งกำลังแจกจ่ายเครื่องดื่มให้ทุกคนที่ผ่านไปมา "[ROOT.Char.Custom('FormOfAddressForLiege')|U]" [brewmaster_character.GetSheHe] เอ่ยขึ้นขณะยื่นถ้วยให้ข้า กลิ่นหอมของ [ROOT.Char.Custom('RegionalDrink')] แตะจมูกข้าทันที และข้าเห็นของเหลวในถ้วยหมุนวนเล็กน้อยขณะรับมา เช่นเดียวกับคนอื่นๆ ข้าดื่มรวดเดียวจนหมด และรสชาติของมันก็ #emp ยอดเยี่ยมอย่างน่าทึ่ง#!\n\n"รสชาติพอใช้ได้หรือไม่ [ROOT.Char.Custom('FormOfAddressForLiege')|U]?" [brewmaster_character.GetSheHe|U] ถามด้วยแววตาใคร่รู้ในดวงตาของ[brewmaster_character.GetHerHis] และจ้องมองข้าอย่างแน่วแน่ขณะพูดต่อ "หากเพียง แต่ข้ามีสถานที่สำหรับปรุงมันเพิ่มอีกสักหน่อย...""
 travel_events_bp3.75.a: ""[target_barony.GetNameNoTierNoTooltip] ต้องการคน เช่นท่าน""
 travel_events_bp3.75.b: ""ย้ายธุรกิจของท่านไปยังดินแดนของข้า และเข้าร่วมราชสำนักของข้า""
 travel_events_bp3.75.c: ""ขอบคุณ มันยอดเยี่ยมมาก!""

 travel_events_bp3.80.t: "ชีวิตแห่งการรับใช้"
 travel_events_bp3.80.desc.holy_order: "ขณะที่เรากำลังเยี่ยมชม [ROOT.Char.Custom('GetFaithTemple')] ใน [ROOT.Char.GetCurrentLocation] ข้าสังเกตเห็น [monk_character.GetFirstName] กำลังสนทนาอย่างลึกซึ้งกับ [ROOT.Char.Custom('KnightCultureNoTooltipLowercase')] พเนจร [monk_character.GetSheHe|U] ดูเหมือนจะตั้งใจฟังทุกคำพูด ดวงตาของ [monk_character.GetHerHis] เป็นประกายด้วยความสนใจ\n\n"[monk_character.Custom2('RelationToMeShort', ROOT.Char)|U] ข้าได้ตัดสินใจแล้วว่าข้าต้องการทำอะไรกับชีวิตของข้า" [monk_character.GetSheHe|U] บอกข้าอย่างเป็นพิธีการ ขณะที่ข้าเดินเข้าไปหาทั้งคู่ [ROOT.Char.Custom('KnightCultureNoTooltipLowercase')] พยักหน้าและตบหลัง [monk_character.GetHerHim] เบาๆ เห็นได้ชัดว่าพยายามสนับสนุน [ROOT.Char.Custom2('RelationToMeShort', monk_character)] ของข้าและการตัดสินใจของ [monk_character.GetHerHis] "ข้าต้องการใช้ชีวิตเพื่อรับใช้ [ROOT.Char.GetFaith.HighGodName] และ [grandmaster.GetPrimaryTitle.GetName]""
 travel_events_bp3.80.desc.monk: "ขณะที่เรากำลังเยี่ยมชม [ROOT.Char.Custom('GetFaithTemple')] ใน [ROOT.Char.GetCurrentLocation] ข้าสังเกตเห็น [monk_character.GetFirstName] กำลังสนทนาอย่างลึกซึ้งกับสมาชิกนักบวชท้องถิ่น [monk_character.GetSheHe|U] ดูเหมือนจะตั้งใจฟังทุกคำพูด ดวงตาของ [monk_character.GetHerHis] เป็นประกายด้วยความสนใจ\n\n"[monk_character.Custom2('RelationToMeShort', ROOT.Char)|U] ข้าได้ตัดสินใจแล้วว่าข้าต้องการทำอะไรกับชีวิตของข้า" [monk_character.GetSheHe|U] บอกข้าอย่างเป็นพิธีการ ขณะที่ข้าเดินเข้าไปหาทั้งคู่ สมาชิกนักบวชยิ้มให้ข้า เห็นได้ชัดว่าพยายามสนับสนุน [ROOT.Char.Custom2('RelationToMeShort', monk_character)] ของข้าและการตัดสินใจของ [monk_character.GetHerHis]"
 travel_events_bp3.80.desc.adult: "$travel_events_bp3.80.desc.monk$ "ข้าต้องการใช้ชีวิตเพื่อรับใช้ [ROOT.Char.GetFaith.HighGodName] ที่นี่ใน [ROOT.Char.GetCurrentLocation.GetName]""
 travel_events_bp3.80.desc.child: "$travel_events_bp3.80.desc.monk$ "ข้าต้องการใช้ชีวิตเพื่อรับใช้ [ROOT.Char.GetFaith.HighGodName]""
 travel_events_bp3.80.a: ""หากนั่นจะ ทำให้เจ้ามีความสุข...""
 travel_events_bp3.80.b: ""คิดถึงอนาคตของเจ้าสิ [monk_character.GetFirstNameNoTooltip]!""

 travel_events_bp3.85.t: "นักปรุงสุราผู้โด่งดัง"
 travel_events_bp3.85.desc.monk: "ขณะผ่าน [ROOT.Char.GetCurrentLocation.GetName] เรารู้ว่าเราต้องไปดูโรงเบียร์แอบบีย์อันโด่งดัง ทันทีที่เราเข้าไปในอาคาร เราเห็นกลุ่มคนกำลังรับบริการจากโต๊ะเล็กๆ ข้างประตู ขณะที่พระกำลังทำงานอยู่ด้านหลัง"
 travel_events_bp3.85.desc: "ขณะผ่าน [ROOT.Char.GetCurrentLocation.GetName] เรารู้ว่าเราต้องไปดูโรงเบียร์ท้องถิ่นอันโด่งดัง ทันทีที่เราเข้าไปในอาคาร เราเห็นกลุ่มคนกำลังรับบริการจากโต๊ะเล็กๆ ข้างประตู ขณะที่นักปรุงเบียร์กำลังทำงานอยู่ด้านหลัง"
 travel_events_bp3.85.desc.outro: "\n\nหลังจากรอให้กลุ่มก่อนหน้าออกไป ในที่สุดเราก็ได้รับเครื่องดื่ม ข้าหมุนมันเล็กน้อยในมือ และได้กลิ่นหอมอันเป็นเอกลักษณ์ของเอลลอยขึ้นมาจากถ้วย เมื่อเห็นคนอื่นๆ ลองดื่ม ข้าก็ลองด้วยตัวเองในที่สุด"
 travel_events_bp3.85.a: "มันเทียบไม่ได้กับเอล [brewery_county.GetAdjectiveNoTooltip] แบบดั้งเดิมเลย"
 travel_events_bp3.85.a.tt: "เนื่องจากประเพณีการผลิตเบียร์ใน [brewery_county.GetName] เก่าแก่กว่า #color_white [brewery_county.MakeScope.ScriptValue('brewery_counter_25')|0]#! ปี:"
 travel_events_bp3.85.b: "ข้าจะซื้อกลับบ้าน"
 travel_events_bp3.85.c: "ไม่น่าแปลกใจเลยว่าทำไมมันถึงโด่งดังนัก"

 popular_beer_character_modifier: "เอลยอดนิยม"
 popular_beer_character_modifier_desc: "เอลชื่อดังจากแดนไกล ซึ่งได้รับความนิยมอย่างไม่น่าเชื่อในราชสำนัก"

 travel_events_bp3.90.t: "ผู้อุปถัมภ์ [ROOT.Char.Custom('GetFaithTemple')|U]"
 travel_events_bp3.90.desc: "ณ ใจกลาง [ROOT.Char.GetCurrentLocation.GetName] มี [ROOT.Char.Custom('GetFaithTemple')] ขนาดใหญ่ตั้งตระหง่าน โดยมีสิ่งปลูกสร้างอื่นๆ ของเมืองตั้งอยู่รายล้อม ทันทีที่เราก้าวเข้าสู่ศาสนสถานอันศักดิ์สิทธิ์ [priest_character.GetWomanMan] ผู้หนึ่งก็รีบวิ่งเข้ามาหา\n\n"[ROOT.Char.Custom('FormOfAddressForLiege')|U] ท่านดูเป็น [ROOT.Char.GetWomanMan] ผู้มี อันจะกิน ท่านพอจะยินดีบริจาคให้แก่ [ROOT.Char.Custom('GetFaithTemple')] ของเราหรือไม่?" [priest_character.GetSheHe] ค้อมกายคำนับอย่างนอบน้อม พลางยื่นมือของ [priest_character.GetHerHis] ออกมาอย่างไม่กระดากอาย ข้าเห็นว่ามีการซ่อมแซมเล็กๆ น้อยๆ รอบอาคารอยู่บ้าง แต่ก็ยังไม่เพียงพอที่จะชดเชยข้อบกพร่องทั้งหมดของ [ROOT.Char.Custom('GetFaithTemple')] ได้เลย"
 travel_events_bp3.90.a: ""ถือว่าข้าเป็นผู้อุปถัมภ์ [ROOT.Char.GetCurrentLocation.GetNameNoTooltip]!""
 travel_events_bp3.90.a.flavor: "ด้วยการสนับสนุนของข้า ที่นี่จะกลายเป็นสถานที่สักการะที่เหมาะสมได้อีกครั้ง"
 travel_events_bp3.90.b: ""แน่นอน การบริจาคเล็กน้อยเป็นสิ่งที่สมควรทำ""
 travel_events_bp3.90.c: "ดูเหมือนว่าถึงเวลาต้องเดินทางต่อแล้ว..."

 church_investment_modifier: "ผู้อุปถัมภ์ผู้ศรัทธา"
 church_investment_modifier_desc: "ตัวละครนี้ได้จัดสรรทรัพย์สินส่วนตัวและวิธีการเพื่อสนับสนุนนักบวชท้องถิ่น\n\n"

 church_investment_cost_modifier: "การลงทุนอันศรัทธา"
 church_investment_cost_modifier_desc: "$church_investment_modifier_desc$#emp สามารถลบออกได้ด้วย [decision|E] #color_white ยุติการลงทุนอันศรัทธา#!#!"

 MODIFIER_DEFINITION_CHURCH_INVESTMENTS: "ตัวปรับ แต่งนี้จะเพิ่มขึ้นทุกๆ สองปี ปัจจุบันคูณด้วย #bold $MULTIPLIER|0$#!"
 modifier_church_investments_desc: "\t#weak เพิ่มขึ้นทุกๆ สองปีที่ผ่านไป#!"

 end_investments_minor_decision: "ยุติการลงทุนอันศรัทธา"
 end_investments_minor_decision_desc: "พวกปลิงเหล่านี้ยังได้ทรัพย์สินของข้าไม่พออีกหรือ? ข้ามีสิ่งอื่นที่ต้องใช้จ่าย!"
 end_investments_minor_decision_tooltip: "ยุติการลงทุนของท่านใน [ROOT.Char.Custom('GetFaithTemple')]"
 end_investments_minor_decision_confirm: "ยุติการลงทุน"

 travel_events_bp3.95.t: "เรื่องเล่าของผู้แสวงบุญ"
 travel_events_bp3.95.desc: "ขณะที่เราเดินผ่าน [ROOT.Char.Custom('GetFaithTemple')] ใน [ROOT.Char.GetCurrentLocation.GetName] ข้าได้ยินกลุ่มนักเดินทางคุยกันเงียบๆ หนึ่งในนั้น [pilgrim_character.GetWomanMan] ผู้หนึ่ง เริ่มบรรยายและเปรียบเทียบโบสถ์กับการเดินทางของ [pilgrim_character.GetHerHis] ไปยัง [unvisited_holy_site.GetNameNoTier]\n\nข้าอดไม่ได้ที่จะแอบฟังการสนทนาขณะที่ [pilgrim_character.GetSheHe] เล่ารายละเอียดเกี่ยวกับสิ่งที่น่าอัศจรรย์ที่เขาเห็นใน [unvisited_holy_site.GetProvince.GetCounty.GetName] เมื่อมองไปรอบๆ ข้าทำได้เพียงจินตนาการว่ามันต้องดีกว่าภาพอันบอบบางที่ข้าเห็นที่นี่มากเพียงใด..."
 travel_events_bp3.95.a: ""เล่าเรื่อง [unvisited_holy_site.GetNameNoTierNoTooltip] ให้ข้าฟังอีก!""
 travel_events_bp3.95.a.tt: "การเดินทางไปยัง [unvisited_holy_site.GetName] ใน [pilgrimage|E] จะให้ [piety|E] และ [stress_loss|E] แก่ท่าน"
 travel_events_bp3.95.a.tt.wanderer: "การเดินทางไปยัง [unvisited_holy_site.GetName] ใน [pilgrimage|E] จะให้ [piety|E], [stress_loss|E], และประสบการณ์ [wanderer_lifestyle|E] แก่ท่าน"
 travel_events_bp3.95.a.flavor: "บางทีข้าอาจโน้มน้าวให้ [pilgrim_character.GetHerHim] เล่าเรื่อง [unvisited_holy_site.GetProvince.GetCounty.GetName] ให้ข้าฟังเพิ่มเติมได้?"
 travel_events_bp3.95.b: "ช่างเป็นเรื่องเล่าที่น่าสนใจ"

 travel_events_bp3.100.t: "ดินแดนแห่งน้ำนมและ... ปลา?"
 travel_events_bp3.100.desc: "ขณะที่ข้าตื่นขึ้นในตอนเช้าตรู่ ข้าอดไม่ได้ที่จะหาวเสียงดัง ข้ายืดตัวและเดินออกจากเต็นท์เพื่อดูว่าผู้คนกำลังเคลื่อนไหวกันแล้ว\n\nข้าสังเกตเห็น [friend_character.GetFirstName] กำลังมุ่งหน้าไปพร้อมกับสิ่งที่ดูเหมือนคันเบ็ดชั่วคราวท่ามกลางเสียงและความวุ่นวายของค่าย "เจ้ากำลังจะไปไหน?" ข้าถาม [friend_character.GetHerHim]\n\n [friend_character.GetSheHe|U] ตอบด้วยการยักไหล่อย่างไม่ใส่ใจ "เป็นวันที่ดีสำหรับการตกปลา""
 travel_events_bp3.100.a: ""อันที่จริงนั่นฟังดูเป็นความคิดที่ดี""
 travel_events_bp3.100.a.flavor: "มัน #emp เป็น#! วันที่ดีสำหรับการตกปลา"
 travel_events_bp3.100.b: "ให้เราพักที่นี่สักสองสามวัน"
 travel_events_bp3.100.b.flavor: "ดูเหมือนจะเป็นสถานที่ที่ดีที่จะพักผ่อนก่อนการเดินทางช่วงต่อไปของเรา"
 travel_events_bp3.100.c: ""กลับขึ้นม้าของเจ้าเสีย [friend_character.GetFirstNameNoTooltip] เรามีที่ที่ต้องไป!""

 travel_events_bp3.105.t: "[lifestyle_character.GetWomanMan|U] ผู้มีทักษะไม่ธรรมดา"
 travel_events_bp3.105.desc: "หลังจากที่เราเดินทางด้วยกันมาสักพัก ข้าสังเกตเห็นว่ามีบางอย่างเกี่ยวกับ [lifestyle_character.GetFirstName]"
 travel_events_bp3.105.desc.reveler: "เมื่อใดก็ตามที่เราหยุดพัก [lifestyle_character.GetSheHe] มักจะเป็นคนแรกที่ไปสำรวจเมืองหรือหมู่บ้านใหม่\n\nแม้ แต่คืนนี้ [lifestyle_character.GetSheHe] ก็ยังคงพูดคุยเล็กน้อยและมีส่วนร่วมกับทุกคนอีกครั้ง อย่างใดอย่างหนึ่ง [lifestyle_character.GetSheHe] ทำให้ทุกคนรู้สึกเหมือนอยู่บ้าน แม้จะอยู่ที่นี่ บางทีอาจมีบางสิ่งที่ข้าสามารถเรียนรู้จาก [lifestyle_character.GetHerHim] ได้?"
 travel_events_bp3.105.desc.blademaster: "ทุกเช้า [lifestyle_character.GetSheHe] จะตื่นขึ้นมาฝึกฝน แกว่งดาบของ [lifestyle_character.GetHerHis] ไปมา\n\nแม้ แต่คืนนี้ ในขณะที่คนอื่นๆ กำลังยุ่งอยู่กับการเพลิดเพลินกับอาหาร [lifestyle_character.GetSheHe] ก็ออกไปฝึกฝนการออกกำลังกายอันน่าทึ่งของ [lifestyle_character.GetHerHis] ด้วยตัวเอง ข้าอดไม่ได้ที่จะต้องการเลียนแบบส่วนหนึ่งของวิถีชีวิตของ [lifestyle_character.GetHerHis]"
 travel_events_bp3.105.desc.hunter: "ครั้งหนึ่งข้าเคยเห็น [lifestyle_character.GetHerHim] ยิงนกตกจากท้องฟ้าขณะเดินทาง ราวกับว่าเป็นสิ่งที่ง่ายที่สุด\n\nวันนี้ [lifestyle_character.GetSheHe] และคนอื่นๆ อีกสองสามคนวิ่งออกไปล่าอาหารให้พวกเราที่เหลือ กลับมาพร้อมความสำเร็จ ความนิยม จำนวนผู้คนที่แห่แหนรอบตัว [lifestyle_character.GetHerHim]... ข้าอดไม่ได้ที่จะอยากลองด้วยตัวเอง"
 travel_events_bp3.105.desc.mystic: "[lifestyle_character.GetSheHe|U] ดูเหมือนจะรู้สิ่งที่แปลกประหลาดที่สุด มักจะลงเอยด้วยการสนทนาที่น่าสงสัยกับคนรอบข้าง [lifestyle_character.GetHerHim]\n\n[lifestyle_character.GetSheHe|U] เข้าใกล้การนอกรีตมากด้วยความคิดบางอย่างของ [lifestyle_character.GetHerHis] มักจะตั้งคำถามกับสิ่งที่พวกเราที่เหลือยอมรับโดยไม่สงสัย... ทว่าข้าอดไม่ได้ที่จะรู้สึกว่า [lifestyle_character.GetSheHe] ถูกต้องกับความคิดเห็นหลายอย่างของ [lifestyle_character.GetHerHis]"
 travel_events_bp3.105.desc.physician: "[lifestyle_character.GetSheHe|U] มักจะช่วยเหลือผู้อื่นที่มีบาดแผลและรอยขีดข่วนเล็กน้อย ทำยาพอกเล็กๆ ราวกับว่าไม่มีอะไร\n\nเมื่อเราผ่าน [ROOT.Char.GetCurrentLocation.GetName] ข้าเห็น [lifestyle_character.GetHerHim] วิ่งไปหาเด็กชาวนาตัวน้อยที่กำลังดิ้นรนหายใจและเปลี่ยนเป็นสีผิดธรรมชาติในตรอกด้านหลัง และก่อนที่คุณจะรู้ตัว ใบหน้าของเด็กก็กลับมาเป็นปกติ [lifestyle_character.GetSheHe] ทำได้อย่างไร?"
 travel_events_bp3.105.desc.herbalist: "มักจะเก็บสมุนไพรหรือดอกไม้เสมอขณะที่เราเดินทาง เก็บไว้อย่างระมัดระวังเพื่อใช้ในภายหลัง\n\nวันนี้ข้าได้ยิน [lifestyle_character.GetHerHim] พูดถึงคุณสมบัติของสมุนไพรบางชนิดที่ [lifestyle_character.GetSheHe] เก็บมาอย่างยืดยาว ว่ามันสามารถใช้ได้ทั้งดีและร้าย บางทีอาจมีบางอย่างเกี่ยวกับงานอดิเรกนี้ก็ได้?"
 travel_events_bp3.105.desc.gardener: "ข้าสังเกตเห็น [lifestyle_character.GetHerHim] มักจะเป็นคนแรกที่วิ่งออกไปเมื่อเรามาถึงหมู่บ้านหรือเมืองใหม่\n\nวันนี้ข้าพบเขาศึกษาเรื่องสวนเล็กๆ ขณะที่เราไปเยี่ยม [ROOT.Char.GetCurrentLocation.GetName] ต้องใช้ความพยายามหลายครั้งกว่า [lifestyle_character.GetSheHe] จะสังเกตเห็นว่าข้าอยู่ที่นั่น หรือพยายามคุยกับเขา"
 travel_events_bp3.105.a.reveler: ""ข้าจะเป็นคนเข้าสังคมมากขึ้นเหมือนท่านได้อย่างไร?""
 travel_events_bp3.105.a.blademaster: ""ท่านช่วยสอนข้าเกี่ยวกับดาบเพิ่มเติมได้หรือไม่?""
 travel_events_bp3.105.a.hunter: ""ท่านช่วยสอนข้าวิธีใช้ธนูได้หรือไม่?""
 travel_events_bp3.105.a.mystic: ""ข้าอยากได้ยินเพิ่มเติมเกี่ยวกับสิ่งที่ท่านรู้""
 travel_events_bp3.105.a.physician: ""ท่านรู้เรื่องความเจ็บป่วยและโรคภัยไข้เจ็บมากมายได้อย่างไร?""
 travel_events_bp3.105.a.herbalist: ""ท่านช่วยบอกข้าเพิ่มเติมเกี่ยวกับสมุนไพรที่ท่านพบได้หรือไม่?""
 travel_events_bp3.105.a.gardener: ""อะไรเกี่ยวกับพวกมันที่ท่านพบว่าน่าสนใจนัก?""
 travel_events_bp3.105.b: ""ท่านคือความภาคภูมิใจของคณะเดินทางนี้ [lifestyle_character.GetFirstNameNoTooltip]""

 bp3_skill_travel_skill_learn_win: "ปรับใช้วิถีของ [lifestyle_character.GetHerHis]"
 bp3_skill_travel_skill_learn_fail: "ข้าทำไม่ได้จริงๆ"

 travel_events_bp3.110.t: "เปิดอกคุยกัน"
 travel_events_bp3.110.desc.intro: "นานหลังจากที่คนส่วนใหญ่หลับไปแล้วในตอนกลางคืน ข้ายังคงนั่งอยู่ข้างกองไฟ \"มีอะไรผิดปกติหรือ?\" [friend_character.GetFirstName] ถามขณะที่ [friend_character.GetSheHe] นั่งลงข้างข้า ด้วยสีหน้ากังวลบนใบหน้าของ [friend_character.GetHerHis]\n\nตอนแรกข้าไม่รู้จะพูดอะไร แต่เมื่อข้าเริ่มพูด มันก็ออกมาอย่างเป็นธรรมชาติ ความเครียดทั้งหมดของข้า ความกังวลของข้า ปัญหาใน แต่ละวันของข้า \"ข้าเอา แต่คิดถึง \""
 travel_events_bp3.110.desc.negative_memory: "ตอนที่ [negative_memory.GetDescription] "
 travel_events_bp3.110.desc.fallback: "การตัดสินใจทั้งหมดของข้าเมื่อเร็วๆ นี้ "
 travel_events_bp3.110.desc.outro: "ข้าอดไม่ได้ที่จะสงสัยว่าข้าควรจะทำสิ่งต่างๆ แตกต่างออกไปหรือไม่""
 travel_events_bp3.110.a: ""แล้วท่านล่ะ?""
 travel_events_bp3.110.a.flavor: "บางทีการฟังปัญหาของ [friend_character.GetHerHis] อาจช่วยแบ่งเบาภาระของข้าได้?"
 travel_events_bp3.110.b: ""ท่านคงไม่เชื่อว่าข้าต้องผ่านอะไรมาบ้าง...""
 travel_events_bp3.110.b.flavor: "นี่เกี่ยวกับข้า และปัญหาของข้า ไม่ใช่เกี่ยวกับ [friend_character.GetFirstName]"

 travel_events_bp3.115.t: "ค่ำคืนข้างกองไฟ"
 travel_events_bp3.115.desc.intro: "หลังจากค่ำคืนผ่านไปนานแล้ว ข้าพบว่าตัวเองกำลังหัวเราะ เล่าเรื่อง และดื่มกับ "
 travel_events_bp3.115.desc.3_characters: "[ROOT.Char.Custom2('RelationToMeShort', character_number_1)] [character_number_1.GetFirstName], [ROOT.Char.Custom2('RelationToMeShort', character_number_2)] [character_number_2.GetFirstName] และ [ROOT.Char.Custom2('RelationToMeShort', character_number_3)] [character_number_3.GetFirstName]"
 travel_events_bp3.115.desc.2_characters: "[ROOT.Char.Custom2('RelationToMeShort', character_number_1)] [character_number_1.GetFirstName] และ [ROOT.Char.Custom2('RelationToMeShort', character_number_2)] [character_number_2.GetFirstName]"
 travel_events_bp3.115.desc.1_character: "[ROOT.Char.Custom2('RelationToMeShort', character_number_1)] [character_number_1.GetFirstName]"
 travel_events_bp3.115.desc.outro: "ข้าไม่รู้ว่า [character_number_1.GetSheHe] มีเรื่องแบบนี้อยู่ในตัว [character_number_1.GetHerHim] แต่ [character_number_1.GetFirstNameNoTooltip] ลงเอยด้วยการเล่าเรื่องตลกหยาบคายเกี่ยวกับชาวนาสี่คนที่ [character_number_1.GetSheHe] เคยเห็นใน [ROOT.Char.GetCapitalLocation.GetName]\n\nหลังจากเช็ดน้ำตาจากการหัวเราะ และดื่มเล็กน้อยเพื่อล้างคอ ข้าจะ..."
 travel_events_bp3.115.a: "เล่าเรื่องของข้าเอง..."
 travel_events_bp3.115.b: "... พร้อมเสริม แต่งเล็กน้อย!"
 travel_events_bp3.115.b.impressed: "ท่าน ทำให้พวกเขาประทับใจ"
 travel_events_bp3.115.b.unimpressed: "พวกเขาไม่ประทับใจ"
 travel_events_bp3.115.c: "ขอให้ [character_number_1.GetFirstNameNoTooltip] เล่าเรื่องอื่นให้ข้าฟัง!"

 travel_events_bp3.120.t: "เรืออับปาง"
 travel_events_bp3.120.desc.intro.coast: "ขณะที่เราเดินทางเลียบชายฝั่ง [ROOT.Char.GetCurrentLocation.GetName],"
 travel_events_bp3.120.desc.intro.river: "ขณะที่เราเดินทางข้าง [river_province.Custom('RiverNameLoc')],"
 travel_events_bp3.120.desc: "เราสังเกตเห็น [merchant_character.GetWomanMan] ผู้หนึ่งกำลังสบถสาปแช่งชีวิตของ [merchant_character.GetHerHis] เสียงดัง และบ่นว่าถึงลูกเรือผู้ทรยศของ [merchant_character.GetHerHis] เมื่อเราเข้าไปใกล้ เราก็เห็น [merchant_character.GetHerHim] ยืนอยู่ข้างซากเรือค้าขายลำเล็กที่อับปาง\n\n"[ROOT.Char.Custom('FormOfAddressForLiege')|U] ข้าขอเวลาท่านสักครู่ได้หรือไม่? ข้ายินดีจะจ่ายค่าอาหารและความช่วยเหลือในการซ่อมแซมเรือของข้า" [merchant_character.GetSheHe|U] เอ่ยถามด้วยรอยยิ้มเจื่อนๆ บนใบหน้าของ [merchant_character.GetHerHis] ข้าสังเกตเห็นว่าสินค้าส่วนใหญ่ของ [merchant_character.GetHerHis] ดูเหมือนจะยังอยู่ในสภาพดี แม้ว่า [merchant_character.GetHerHis] จะประสบโชคร้ายก็ตาม"
 travel_events_bp3.120.a: "แน่นอน เราช่วยได้"
 travel_events_bp3.120.b: "อาจจะต้องมีค่าตอบแทน..."
 travel_events_bp3.120.c: ""ท่านว่าท่านมีเท่าไหร่นะ?""
 travel_events_bp3.120.d: ""ขออภัย แต่เรากำลังรีบ""

 RiverNameTheNile: "[ROOT.Province.GetName]"
 RiverNameNotTheNile: "แม่น้ำ [ROOT.Province.GetName]"

