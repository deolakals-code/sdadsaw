l_english: 

 fp3_brutal_predations_county_modifier: "การปล้นสะดมอันโหดเหี้ยม"
 fp3_brutal_predations_county_modifier_desc: "ชาวบ้านในบริเวณนี้รู้สึกตกใจกับการกระทำอันรุนแรงหลายครั้งที่กระทำโดยทหารรับจ้างผู้กระหายเลือด ซึ่งยังคงลอยนวลอยู่"

 fp3_low_frontier_morale_county_modifier: "ขวัญกำลังใจชายแดนต่ำ"
 fp3_low_frontier_morale_county_modifier_desc: "ทหารที่ประจำการในป้อมปราการของภูมิภาคนี้รู้สึกว่าถูกผู้ปกครองของตนลืมเลือน"

 fp3_boosted_frontier_morale_county_modifier: "ขวัญกำลังใจชายแดนสูงขึ้น"
 fp3_boosted_frontier_morale_county_modifier_desc: "ทหารที่ประจำการในป้อมปราการของภูมิภาคนี้รู้สึกมีกำลังใจมากขึ้นนับตั้งแต่ผู้ปกครองของตนมาเยี่ยมเยียนด้วยตนเอง"

 fp3_visited_the_frontier_modifier: "เยี่ยมเยียนชายแดน"
 fp3_visited_the_frontier_modifier_desc: "ตัวละครนี้เพิ่งไปคลุกคลีกับทหารในป้อมปราการชายแดน ทำให้สัมผัสกับเชื้อโรคมากมายที่แพร่กระจายอยู่ในที่พักอันแออัดของพวกเขา"

 fp3_frontier_heresy_county_modifier: "ความเชื่อนอกรีตชายแดน"
 fp3_frontier_heresy_county_modifier_desc: "ความเชื่อที่รุนแรงได้หยั่งรากลึกในหมู่ทหารและผู้ตั้งถิ่นฐานในเคาน์ตี้นี้"

 fp3_garrison_decimated_county_modifier: "กองทหารรักษาการณ์ถูกสังหารหมู่"
 fp3_garrison_decimated_county_modifier_desc: "ทหารที่เคยรักษาการณ์ในจังหวัดนี้ถูกสังหารหมู่โดยผู้ปกครองของตน เนื่องจากปฏิบัติตามความเชื่อนอกรีต"

 fp3_jinx_modifier: "ต้องคำสาป"
 fp3_jinx_modifier_desc: "ตัวละครนี้เชื่อว่ามีใครบางคนที่มีเจตนาร้ายใช้ดวงตาปีศาจกับพวกเขา"

 fp3_call_of_the_wild_modifier: "ถูกดึงดูดสู่ชายแดน"
 fp3_call_of_the_wild_modifier_desc: "ตัวละครนี้รู้สึกถูกกระตุ้นให้ออกสำรวจทุ่งหญ้าสเตปป์อันห่างไกล ทะเลทรายอันน่าสะพรึงกลัว และภูเขาสูงตระหง่าน เพื่อดูว่ามีอะไรอยู่เบื้องหลัง"

 fp3_marriage_material_modifier: "คู่ควรแก่การ แต่งงาน"
 fp3_marriage_material_modifier_desc: "ตัวละครนี้ถูกโน้มน้าวว่าการเชื่อฟังพ่อแม่และ แต่งงานเป็นผลประโยชน์สูงสุดของตน - แต่มันเป็น เช่นนั้นจริงหรือ?"

 fp3_dutiful_scion_modifier: "ทายาทผู้ dutiful"
 fp3_dutiful_scion_modifier_desc: "ตัวละครนี้อุทิศชีวิตให้กับราชวงศ์ ไม่ใช่สิ่งรบกวนเล็กน้อย เช่นการผจญภัยหรือความสุขส่วนตัว"

 fp3_worried_sick_modifier: "กังวลจนป่วย"
 fp3_worried_sick_modifier_desc: "ตัวละครนี้กังวลจนป่วยเกี่ยวกับคนที่รัก ซึ่งจากไปเผชิญอันตรายในแดนไกล"

 fp3_gross_persecutions_county_modifier: "การกดขี่ข่มเหงอย่างรุนแรง"
 fp3_gross_persecutions_county_modifier_desc: "ผู้ศรัทธาจำนวนมากในจังหวัดนี้ต้องหลบซ่อนหรือหลบหนี หลังจากการกดขี่ข่มเหงทางศาสนาอย่างรุนแรงโดยเจ้าผู้ครองนครของตน"

 fp3_galvanized_heretics_county_modifier: "พวกนอกรีตที่ถูกกระตุ้น"
 fp3_galvanized_heretics_county_modifier_desc: "การกดขี่ได้เปลี่ยนประชากรของเคาน์ตี้นี้ให้กลายเป็นพวกหัวรุนแรงที่ขมขื่น หากพวกเขายังไม่ได้เป็น เช่นนั้นอยู่แล้ว พวกเขายืนหยัดที่จะปกป้องศรัทธาของตนไม่ว่าจะต้องแลกด้วยอะไรก็ตาม"

 fp3_promoting_arabic_modifier: "ส่งเสริมภาษาอาหรับ"
 fp3_promoting_arabic_modifier_desc: "ตัวละครนี้กำลังส่งเสริมภาษาอาหรับ"

 fp3_conversion_curious_county_modifier: "อยากรู้อยากเห็นเรื่องการเปลี่ยนศาสนา"
 fp3_conversion_curious_county_modifier_desc: "ในหมู่ประชากรของเคาน์ตี้นี้ มีความอยากรู้อยากเห็นเกี่ยวกับศรัทธาอื่นเพิ่มมากขึ้น"

 fp3_teapot_alcoholism_modifier: "นักดื่มชาตัวยง"
 fp3_teapot_alcoholism_modifier_desc: "ตัวละครนี้มักจะเก็บกาน้ำชาเล็กๆ น่ารักไว้ข้างกายเสมอ และเป็นที่รู้กันว่าบริโภคของเหลวปริศนาในนั้นเป็นจำนวนมาก"

 ulema_displeased_drinking: "เรื่องอื้อฉาวการดื่มในที่สาธารณะ"
 ulema_displeased_drinking_desc: "พฤติกรรมการดื่มที่เป็นที่รู้จักกันดีของตัวละครนี้ได้นำไปสู่เรื่องอื้อฉาวในที่สาธารณะ โดยนักบวชตั้งคำถามอย่างเปิดเผยถึงผลกระทบต่อความสามารถในการปกครองของพวกเขา"

 fp3_mountain_redoubt_modifier: "ป้อมปราการแห่งแบดด์"
 fp3_mountain_redoubt_modifier_desc: "ป้อมปราการแห่งนี้ตั้งอยู่บนยอดเขาสูงตระหง่าน แทบจะไม่มีใครสามารถบุกเข้าไปได้ เคยถูกยึดครองโดยผู้นำคูร์ราไมต์ จาวิดาน และบาบักเมื่อนานมาแล้ว บัดนี้ได้รับการสร้างขึ้นใหม่ และกลายเป็นฐานที่มั่นอันน่าเกรงขามสำหรับผู้อยู่อาศัยที่ชอบสงครามแห่งเทือกเขาสีดำ"

 fp3_royal_fire_modifier: "เพลิงราชวงศ์"
 fp3_royal_fire_modifier_desc: "ผู้ปกครองผู้นี้มีเพลิงนิรันดร์ลุกโชนในนามของตน เพื่ออวยพรให้รัชสมัยของตนสว่างไสวด้วยแสงแห่งเกียรติยศ"
 fp3_plundered_county_modifier: "ถูกรีดไถและปล้นสะดม"
 fp3_plundered_county_modifier_desc: "เคาน์ตี้นี้ถูกรีดเลือดรีดเนื้อจนแห้งเหือดโดยผู้ปกครองแห่งอาณาจักร เพื่อนำเงินไปใช้ในโครงการโอ้อวดที่อื่น"

 fp3_architectural_splendor_county_modifier: "ความงดงามทางสถาปัตยกรรม"
 fp3_architectural_splendor_county_modifier_desc: "เคาน์ตี้นี้มีการลงทุนจำนวนมากในสถาปัตยกรรมอนุสาวรีย์และงานสาธารณะขนาดใหญ่"

 fp3_efficient_splendor_county_modifier: "ผู้สร้างที่มีประสิทธิภาพ"
 fp3_efficient_splendor_county_modifier_desc: "เคาน์ตี้นี้มีการก่อสร้างอนุสาวรีย์และงานสาธารณะขนาดใหญ่อย่างคึกคัก"

 fp3_luxurious_bathhouse_modifier: "ฮัมมัมสวรรค์"
 fp3_luxurious_bathhouse_modifier_desc: "ตัวละครนี้ประดับเมืองหลวงของตนด้วยโรงอาบน้ำใหม่ที่หรูหราและมีคุณภาพเป็นพิเศษ"

 fp3_less_luxurious_bathhouse_modifier: "ฮัมมัมที่เสียหายจากความชื้น"
 fp3_less_luxurious_bathhouse_modifier_desc: "แม้ว่าตัวละครนี้จะมีโรงอาบน้ำที่หรูหรา แต่การก่อสร้างก็ยังขาดความสมบูรณ์อยู่บ้าง และเริ่มมีรอยร้าวปรากฏบนกระเบื้องและหิน"

 fp3_very_lofty_tower_modifier: "หอคอยสูงตระหง่าน"
 fp3_very_lofty_tower_modifier_desc: "ที่พำนักของตัวละครนี้มีหอคอยที่สูงมากและสวยงามอย่างยิ่ง ซึ่งพวกเขาสามารถปีนบันไดขึ้นไปเพื่อมองลงมายังโลกเบื้องล่าง - และหลีกหนีจากสายตาสอดรู้สอดเห็นทั้งปวง"

 fp3_less_lofty_tower_modifier: "หอคอยที่ไม่สูงนัก"
 fp3_less_lofty_tower_modifier_desc: "ที่พำนักของตัวละครนี้มีหอคอยสูงเพรียว แม้จะไม่สูงเท่าที่ตั้งใจไว้ แต่แรก แต่ทิวทัศน์จากยอดหอคอยก็ยังคงปลุกเร้าจิตวิญญาณ - และให้ความสันโดษหากจำเป็น"

 fp3_spiritual_splendor_county_modifier: "ความงดงามทางจิตวิญญาณ"
 fp3_spiritual_splendor_county_modifier_desc: "เคาน์ตี้นี้มีการก่อสร้างและบูรณะอนุสรณ์สถานทางศาสนาทุกประเภทอย่างยิ่งใหญ่"

 fp3_great_tower_of_silence_modifier: "หอคอยแห่งความเงียบอันยิ่งใหญ่"
 fp3_great_tower_of_silence_modifier_desc: "ตัวละครนี้ได้ดูแลการก่อสร้างดัคมา (หอคอยแห่งความเงียบ) ขนาดใหญ่เป็นประวัติการณ์ และมักจะมองดูสิ่งก่อสร้างอันน่าสยดสยองนี้ พลางครุ่นคิดถึงสิ่งที่อยู่เหนือโลกแห่งดินและเนื้อหนังนี้"

 fp3_less_great_tower_of_silence_modifier: "หอคอยแห่งความเงียบ"
 fp3_less_great_tower_of_silence_modifier_desc: "ตัวละครนี้ได้ดูแลการก่อสร้างดัคมาขนาดใหญ่ และเมื่อเห็นแร้งทุ่งหญ้าสเตปป์ร่อนลงมายังที่นั่น ก็มักจะครุ่นคิดถึงชีวิตและความตาย"

 police_chief_of_baghdad_modifier: "ผู้กองแห่งแบกแดด"
 police_chief_of_baghdad_modifier_desc: "ตัวละครนี้ดำรงตำแหน่งซาฮิบ อัล-ชูรตา ผู้กองแห่งกองกำลังรักษาการณ์แบกแดด แม้จะมีความวุ่นวายเมื่อเร็วๆ นี้ ตำแหน่งนี้ก็ยังคงมีโอกาสในการสร้างอำนาจต่อรองอยู่บ้าง"

 fp3_light_of_the_walayah_modifier: "แสงแห่งวาลายะฮ์"
 fp3_light_of_the_walayah_modifier_desc: "กล่าวกันว่าราชวงศ์นี้ครอบครอง #italic นูร#! แสงลึกลับแห่งการชี้นำของพระเจ้า"

 fp3_azariqa_ascendancy_modifier: "ความรุ่งเรืองของมูฮักกิมา"
 fp3_azariqa_ascendancy_modifier_desc: "ตัวละครนี้นำพามูฮักกิมาไปสู่ความยิ่งใหญ่ที่ไม่เคยมีมาก่อน"

 fp3_promoted_persian_scripture_modifier: "นักแปลผู้ยิ่งใหญ่"
 fp3_promoted_persian_scripture_modifier_desc: "ตัวละครนี้ได้ดูแลการแปลงานเขียนทางศาสนาภาษาอาหรับ ซึ่งเป็นสิ่งที่เคยถือว่าเป็นข้อห้ามมาก่อน"

 fp3_persian_resurgence_county_modifier: "การฟื้นฟูของเปอร์เซีย"
 fp3_persian_resurgence_county_modifier_desc: "เคาน์ตี้นี้กำลังลุกโชนไปด้วยความศรัทธาทางศาสนาผสมผสานกับความรักชาติท้องถิ่นที่ฟื้นคืนชีพ ซึ่งอาจนำไปสู่สิ่งที่ไม่คาดฝัน"

 fp3_forgotten_runestones_county_modifier: "ศิลาจารึกอักษรรูนที่ถูกลืม"
 fp3_forgotten_runestones_county_modifier_desc: "ในเคาน์ตี้นี้มีหินลึกลับสามก้อนตั้งอยู่ สลักด้วยอักษรรูนอันวิจิตรตามแบบของชาวรุส อย่างไรก็ตาม พวกมันค่อนข้างผุพัง และไม่มีใครสามารถถอดความหมายของมันได้ในตอนนี้"

 fp3_dismayed_daylamites_county_modifier: "ชาวป่าผู้ทุกข์ใจ"
 fp3_dismayed_daylamites_county_modifier_desc: "ประชากรท้องถิ่นได้พัฒนาความเชื่อโชคลางที่น่าสะพรึงกลัวเกี่ยวกับชุดศิลาจารึกอักษรรูนลึกลับที่อยู่ลึกเข้าไปในป่า บัดนี้เมื่อศิลาเหล่านั้นหายไป ผู้คนต่างหวาดกลัวการลงโทษจากผู้สร้าง ไม่ว่าพวกเขาจะเป็นใครก็ตาม"

 fp3_insulted_chinese_noble_modifier: "ถูกดูหมิ่นในจีน"
 fp3_insulted_chinese_noble_modifier_desc: "ตัวละครนี้ได้ดูหมิ่นขุนนางจีนคนสำคัญ ซึ่งขณะนี้กำลังแพร่กระจายข่าวลือที่มุ่งร้ายเกี่ยวกับพวกเขาในราชสำนักฉางอาน ไคเฟิง และลั่วหยาง"

 fp3_vengeful_nomads_county_modifier: "ชนเผ่าเร่ร่อนผู้เคียดแค้น"
 fp3_vengeful_nomads_county_modifier_desc: "เคาน์ตี้นี้กำลังประสบกับการโจมตีอย่างป่าเถื่อนจากชนเผ่าเร่ร่อนที่มุ่งหมายจะแก้แค้นผู้นำที่ถูกสังหารอย่างไม่ยุติธรรม"

 fp3_nomad_recruits_modifier: "ทหารเกณฑ์ชนเผ่าเร่ร่อน"
 fp3_nomad_recruits_modifier_desc: "ราชวงศ์นี้อนุญาตให้ชนเผ่าเร่ร่อนตั้งถิ่นฐานในดินแดนของตน ทำให้มีแหล่งเกณฑ์ทหารม้าที่มีความสามารถยอดเยี่ยม"

 fp3_nomad_friction_county_modifier: "การต่อสู้เพื่อทุ่งหญ้าเลี้ยงสัตว์"
 fp3_nomad_friction_county_modifier_desc: "เคาน์ตี้นี้ประสบปัญหาความขัดแย้งระหว่างชาวนาที่ตั้งถิ่นฐานและชนเผ่าเร่ร่อน"

 fp3_resentful_nomads_county_modifier: "ชนเผ่าเร่ร่อนที่ไม่พอใจ"
 fp3_resentful_nomads_county_modifier_desc: "เคาน์ตี้นี้กำลังประสบกับความขัดแย้ง เนื่องจากชนเผ่าเร่ร่อนที่ไม่พอใจและเกเร"

 fp3_banning_archery_modifier: "การห้ามยิงธนู"
 fp3_banning_archery_modifier_desc: "ตัวละครนี้ได้ห้ามการฝึกยิงธนูในบางส่วนของอาณาจักร ทำให้พลธนูของตนเสียเปรียบ แต่แน่นอนว่า ทำให้อุบัติเหตุเกิดขึ้นน้อยลง"

 fp3_crushed_by_failure_modifier: "ท้อแท้จากความล้มเหลว"
 fp3_crushed_by_failure_modifier_desc: "ไม่ว่ามันจะเป็นอะไรก็ตาม ตัวละครนี้ล้มเหลวอย่างน่าทึ่ง และตอนนี้ความสงสัยก็กัดกินจิตใจของพวกเขา"

 fp3_silk_road_secure_county_modifier: "เส้นทางสายไหมปลอดภัย"
 fp3_silk_road_secure_county_modifier_desc: "นักรบชนเผ่าเร่ร่อนในจังหวัดนี้สาบานตนว่าจะรักษาความปลอดภัยของเส้นทางคาราวาน"

 fp3_nomad_attacks_county_modifier: "โจรปล้นสะดมอาละวาด"
 fp3_nomad_attacks_county_modifier_desc: "เคาน์ตี้นี้กำลังประสบปัญหาจากการปล้นสะดมคาราวานที่ผ่านไปมา ทำให้การค้าหยุดชะงักอย่างมาก"

 fp3_gnostic_fervor_county_modifier: "ความศรัทธาแบบนอสติก"
 fp3_gnostic_fervor_county_modifier_desc: "เคาน์ตี้นี้เพิ่งกลายเป็นบ้านของกลุ่มผู้ลี้ภัยชาวมาณีกีที่ขยันขันแข็ง"

 fp3_lackluster_diet_modifier: "อาหารจืดชืด"
 fp3_lackluster_diet_modifier_desc: "ตัวละครนี้ถูกกำหนดให้อยู่ในอาหารที่ไม่น่าสนใจ ซึ่งประกอบด้วยปลาเค็มและก้านขึ้นฉ่ายดิบ โดยหวังว่ามันจะรักษาอาการเศร้าโศกของพวกเขาได้"

 fp3_herbal_remedies_modifier: "ยาสมุนไพร"
 fp3_herbal_remedies_modifier_desc: "ตัวละครนี้บริโภคส่วนผสมของเมล็ดเฟนเนล แตงกวา และสมุนไพรอื่นๆ เพื่อพยายามรักษาอาการเศร้าโศกของตน"

 fp3_worshipping_in_solitude_modifier: "นมัสการในความสันโดษ"
 fp3_worshipping_in_solitude_modifier_desc: "ตัวละครนี้เริ่มใช้เวลาหลายชั่วโมงในโบสถ์ส่วนตัว ห่างจากสายตาสอดรู้สอดเห็นทั้งปวง มีการคาดเดากันอย่างแพร่หลายเกี่ยวกับสิ่งที่เกิดขึ้นภายใน"

 fp3_rare_books_modifier: "หนังสือหายาก"
 fp3_rare_books_modifier_desc: "ตัวละครนี้ได้ครอบครองชุดหนังสือหายากจำนวนเล็กน้อย ซึ่งได้รับการช่วยเหลือมาจากห้องสมุดในตำนาน เช่น ห้องสมุดแห่งเตซิฟอน กุนเดชาปูร์ หรือแม้ แต่อเล็กซานเดรีย"

 fp3_oil_of_vitriol_modifier: "น้ำมันกรดกำมะถัน"
 fp3_oil_of_vitriol_modifier_desc: "ตัวละครนี้สามารถเข้าถึงสารกัดกร่อนอย่างรุนแรงในปริมาณที่เป็นอันตราย ซึ่งปรุงขึ้นโดยนักเล่นแร่แปรธาตุชาวเปอร์เซีย"

 fp3_dabbling_in_alchemy_modifier: "ลองเล่นแร่แปรธาตุ"
 fp3_dabbling_in_alchemy_modifier_desc: "ตัวละครนี้ได้ลองเล่นแร่แปรธาตุ และในการทำ เช่นนั้น ได้สัมผัสกับสารอันตรายทุกชนิด"

 fp3_alchemical_insights_modifier: "ความเข้าใจเชิงเล่นแร่แปรธาตุ"
 fp3_alchemical_insights_modifier_desc: "ร่วมกับนักเล่นแร่แปรธาตุชาวเปอร์เซีย ตัวละครนี้ได้ค้นพบสิ่งที่ยิ่งใหญ่ในการศึกษาของเหลวและสสาร และได้เรียนรู้มากมายเกี่ยวกับโครงสร้างของโลกนี้"

 fp3_reneged_on_promise_modifier: "ผิดสัญญา"
 fp3_reneged_on_promise_modifier_desc: "ตัวละครนี้ผิดคำมั่นสัญญาที่ให้ไว้ว่าจะจ่ายเงินสำหรับความพยายามทางวรรณกรรมของกวีชื่อดัง และตอนนี้ถือว่าค่อนข้างไม่น่าไว้วางใจ"

 fp3_broken_icehouses_county_modifier: "ยัคชาลที่พังทลาย"
 fp3_broken_icehouses_county_modifier_desc: "เคาน์ตี้นี้เคยมีชื่อเสียงในด้านการผลิตขนมหวานเย็น ก่อนที่โรงน้ำแข็งจะถล่มลงมาในเหตุการณ์แผ่นดินไหว"

 fp3_court_austerity_modifier: "ความเข้มงวดในราชสำนัก"
 fp3_court_austerity_modifier_desc: "ความเข้มงวดอย่างเคร่งครัดครอบงำราชสำนักของตัวละครนี้ - มีความฟุ่มเฟือยน้อยมาก เสียงหัวเราะน้อย และโดยเฉพาะอย่างยิ่ง - ไม่มีของหวาน"

 fp3_securing_sorbet_supply_modifier: "รักษาเสบียงฟาลูเดห์"
 fp3_securing_sorbet_supply_modifier_desc: "ตัวละครนี้ได้ยึดเสบียงขนมเย็นทั้งหมดของอาณาจักร - สร้างความยินดีให้กับข้าราชบริพาร แต่สร้างความโกรธเคืองให้กับข้าในบังคับ"

 fp3_thinking_about_the_afterlife_modifier: "ครุ่นคิดถึงความตาย"
 fp3_thinking_about_the_afterlife_modifier_desc: "ตัวละครนี้เพิ่งใช้เวลามากมายครุ่นคิดถึงสิ่งที่รอพวกเขาอยู่ในโลกหน้า"

 fp3_sufi_initiate_modifier: "ผู้ริเริ่มซูฟี"
 fp3_sufi_initiate_modifier_desc: "ตัวละครนี้ให้ความสนใจในลัทธิซูฟีลึกลับและการทำสมาธิแบบมูรากาบา โดยเจาะลึกถึงความสัมพันธ์ของหัวใจกับพระผู้สร้าง"

 fp3_avoiding_dark_places_modifier: "หลีกเลี่ยงสถานที่มืด"
 fp3_avoiding_dark_places_modifier_desc: "ตัวละครนี้มีประสบการณ์น่าขนลุกมากเกินไป และตอนนี้ค่อนข้างกระตือรือร้นที่จะหลีกเลี่ยงความมืด"

 fp3_looking_for_bodyguards_modifier: "มองหาองครักษ์"
 fp3_looking_for_bodyguards_modifier_desc: "ตัวละครนี้มีประสบการณ์น่าสะพรึงกลัวมากเกินไป และตอนนี้กำลังมองหาองครักษ์เพิ่มเติม"

 fp3_relentless_skeptic_modifier: "ผู้กังขาอย่างไม่ลดละ"
 fp3_relentless_skeptic_modifier_desc: "ตัวละครนี้เริ่มตั้งคำถามกับความเชื่อพื้นบ้านและข้อสันนิษฐานมากมายเกี่ยวกับโลกที่มองไม่เห็น ผู้อื่นอาจมองว่าพวกเขาเป็นคนมองโลกในแง่ร้าย ผู้คัดค้านที่หยาบคาย หรือแม้ แต่ผู้ละทิ้งศาสนา"

 fp3_womens_faith_galvanized_modifier: "ศรัทธาของสตรี"
 fp3_womens_faith_galvanized_modifier_desc: "ตัวละครนี้รู้สึกว่าถูกกดขี่ข่มเหง เนื่องจากการเคารพบูชานักบุญหญิง แต่นั่นกลับยิ่งเสริมสร้างความมุ่งมั่นของพวกเขา"

 fp3_promoted_persian_mathematics_modifier: "ส่งเสริมคณิตศาสตร์เปอร์เซีย"
 fp3_promoted_persian_mathematics_modifier_desc: "นักวิชาการของตัวละครนี้กำลังค้นพบนวัตกรรมทางคณิตศาสตร์ของตนเองเพื่อแข่งขันกับนวัตกรรมของ$indo_aryan_group_collective_noun$"

 fp3_denied_religious_protection_modifier: "ปฏิเสธการคุ้มครองทางศาสนา"
 fp3_denied_religious_protection_modifier_desc: "ผู้ปกครองผู้นี้ปฏิเสธเสรีภาพในการปฏิบัติตามศรัทธาของตนเองแก่พวกนอกรีต"

 patron_of_the_sciences: "แม้ว่าจะไม่มีการค้นพบที่สำคัญใดๆ เกิดขึ้น แต่โครงการนี้ ทำให้ท่านมีชื่อเสียงในฐานะผู้อุปถัมภ์วิทยาศาสตร์รายใหญ่"

 fp3_treatise_on_development_modifier: "ตำราว่าด้วยการบริหาร"
 fp3_treatise_on_development_modifier_desc: "เอกสารเกี่ยวกับคุณค่าของระบบราชการ พร้อมด้วยข้อชี้แนะหลายประการเกี่ยวกับวิธีที่สามารถรับประกันสายการสื่อสารที่เหมาะสมจากราชวงศ์ไปจนถึงระดับท้องถิ่น"

 fp3_treatise_on_building_modifier: "ตำราว่าด้วยการจัดการ"
 fp3_treatise_on_building_modifier_desc: "ตำราว่าด้วยวิธีที่ควรจัดการทรัพยากรเพื่อเพิ่มประสิทธิภาพสูงสุด"

 fp3_treatise_on_control_modifier: "ตำราว่าด้วยอำนาจ"
 fp3_treatise_on_control_modifier_desc: "เอกสารเกี่ยวกับวิธีที่ผู้นำควรเข้าถึงภารกิจการปกครองและการปราบปรามการกบฏ"

 fp3_treatise_on_mathematics_modifier: "เอกสารเฉพาะทางคณิตศาสตร์"
 fp3_treatise_on_mathematics_modifier_desc: "วิทยานิพนธ์เฉพาะทางคณิตศาสตร์ พร้อมด้วยหมายเหตุหลายประการเกี่ยวกับวิธีที่สามารถนำไปใช้ประโยชน์ในชีวิตประจำวันได้"

 fp3_treatise_on_taxation_modifier: "ตำราว่าด้วยการเก็บภาษี"
 fp3_treatise_on_taxation_modifier_desc: "ตำราที่ยาวและวกวนเกี่ยวกับการเก็บภาษีและขั้นตอนที่สามารถดำเนินการเพื่อเข้าถึงปัญหาการเก็บภาษีได้ดีที่สุด"

 fp3_treatise_on_light_warfare_modifier: "คู่มือการรบแบบประจัญบาน"
 fp3_treatise_on_light_warfare_modifier_desc: "วิทยานิพนธ์สั้นๆ เกี่ยวกับคุณค่าของทหารราบเบา และวิธีที่สามารถนำไปใช้ประโยชน์ได้ดีที่สุด"

 fp3_treatise_on_heavy_warfare_modifier: "คู่มือการรบป้องกัน"
 fp3_treatise_on_heavy_warfare_modifier_desc: "ตำราเกี่ยวกับรูปแบบที่เกี่ยวข้องสำหรับทหารราบหนัก พร้อมด้วยคู่มือสั้นๆ ในตอนท้ายเกี่ยวกับประเภทของการฝึกซ้อมที่สามารถทำได้ เพื่อให้เกิดความสามัคคีมากขึ้นในกองทัพ"

 fp3_treatise_on_cavalry_modifier: "ประวัติศาสตร์การรบด้วยทหารม้า"
 fp3_treatise_on_cavalry_modifier_desc: "เอกสารยาวเกี่ยวกับประวัติศาสตร์การบุกโจมตีด้วยทหารม้าที่เกิดขึ้นตลอดประวัติศาสตร์ โดยเน้นที่วิธีที่สามารถพลิกสถานการณ์การรบจากหลังม้าได้"

 fp3_treatise_on_siege_modifier: "คู่มือการรื้อถอน"
 fp3_treatise_on_siege_modifier_desc: "คู่มือสั้นๆ แต่กระชับเกี่ยวกับธรรมชาติของการล้อม และวิธีที่สามารถเข้าใกล้ศัตรูโดยมีหรือไม่มีอาวุธล้อม"

 fp3_treatise_on_strategy_modifier: "ประวัติศาสตร์ยุทธศาสตร์"
 fp3_treatise_on_strategy_modifier_desc: "ตำราที่ยาว แต่เข้าถึงง่ายเกี่ยวกับประวัติศาสตร์ยุทธศาสตร์และยุทธวิธี พร้อมตัวอย่างย้อนหลังไปหลายศตวรรษ"

 fp3_fearsome_example_modifier: "ตัวอย่างอันน่าสะพรึงกลัว"
 fp3_fearsome_example_modifier_desc: "ผู้ปกครองผู้นี้ทำลายชุมชนทางศาสนาในชายแดนอย่างโหดเหี้ยม แสดงให้เห็นถึงความเต็มใจที่จะปราบปรามความเชื่อนอกรีตใดๆ อย่างน่าเกรงขาม"

 fp3_refused_the_caliph_modifier: "ปฏิเสธคำเรียกร้องสงครามศักดิ์สิทธิ์"
 fp3_refused_the_caliph_modifier_desc: "ตัวละครนี้ปฏิเสธคำเรียกร้องจากประมุขแห่งศรัทธาให้โจมตีผู้ปกครองนอกรีตเพื่อนบ้าน"

 fp3_praying_too_much_modifier: "สวดมนต์มากเกินไป"
 fp3_praying_too_much_modifier_desc: "ตัวละครนี้เริ่มใช้เวลาจำนวนมากในวัด ละเลยภารกิจอื่นๆ"

 fp3_name_read_in_friday_prayer_modifier: "ชื่อถูกอ่านในละหมาดวันศุกร์"
 fp3_name_read_in_friday_prayer_modifier_desc: "ตัวละครนี้ได้ออกคำสั่งให้อ่านชื่อของตนแทนชื่อของเคาะลีฟะฮ์ในระหว่างการชุมนุมนมัสการที่สำคัญที่สุดของสัปดาห์ — เป็นการประกาศต่อสาธารณะซ้ำๆ ถึงความภักดีและความสำคัญของตน"

 fp3_displayed_pious_submission_to_caliph_modifier: "เน้นย้ำการยอมจำนนต่อเคาะลีฟะฮ์"
 fp3_displayed_pious_submission_to_caliph_modifier_desc: "ตัวละครนี้ได้ให้คำแนะนำอย่างเคร่งครัดว่าให้อ่านชื่อของเคาะลีฟะฮ์ก่อนในระหว่างการละหมาดวันศุกร์ ซึ่งเป็นการนมัสการที่สำคัญที่สุดของทุกมัสยิด — โลกรู้ว่าพวกเขาเชื่อฟังใคร"

 fp3_honored_by_the_faithful_modifier: "ได้รับเกียรติจากผู้ศรัทธา"
 fp3_honored_by_the_faithful_modifier_desc: "ชื่อของตัวละครนี้ถูกอ่านในระหว่างการละหมาดวันศุกร์ ณ ที่นั่งของผู้นำแห่งศรัทธาของตน ทำให้พวกเขาได้รับความชอบธรรมอย่างมากในฐานะผู้ปกครอง"

 fp3_rule_by_fear_modifier: "ปกครองด้วยความกลัว"
 fp3_rule_by_fear_modifier_desc: "ตัวละครนี้ได้แสดงให้เห็นว่าพวกเขาทั้งเต็มใจและสามารถที่จะสังหารผู้คนตามอำเภอใจ ยึดอาณาจักรไว้ด้วยกันด้วยความกลัว"

 fp3_minor_child_spy_network_modifier: "เครือข่ายสายลับเด็กเล็ก"
 fp3_minor_child_spy_network_modifier_desc: "ตัวละครนี้จ้างเครือข่ายเด็กเล็กเป็นสายลับเพื่อเปิดเผยความลับของตระกูล"

 fp3_better_company_modifier: "สหายที่ดีขึ้น"
 fp3_better_company_modifier_desc: "ตัวละครนี้ถูกผู้ใหญ่ตำหนิ และตอนนี้กำลังเรียนรู้ที่จะประพฤติตนในลักษณะที่เหมาะสมกับทายาทของตระกูลมากขึ้น"

 fp3_justification_for_taxation_modifier: "เหตุผลในการเก็บภาษี"
 fp3_justification_for_taxation_modifier_desc: "ผู้เก็บภาษีของตัวละครนี้ได้สร้างเหตุผลที่น่าสงสัย เพื่อให้ข้าในบังคับของตนจ่ายเงินสมทบมากกว่าที่คนส่วนใหญ่จะพิจารณาว่ายุติธรรม"

 fp3_excuses_for_extortion_modifier: "ข้ออ้างในการรีดไถ"
 fp3_excuses_for_extortion_modifier_desc: "$fp3_justification_for_taxation_modifier_desc$"

 fp3_locals_intimidated_county_modifier: "ชาวบ้านถูกข่มขู่"
 fp3_locals_intimidated_county_modifier_desc: "ชาวบ้านธรรมดาในเคาน์ตี้นี้ถูก ทำให้หวาดกลัวจนยอมจำนน"

 fp3_locals_infuriated_county_modifier: "ชาวบ้านโกรธแค้น"
 fp3_locals_infuriated_county_modifier_desc: "ชาวบ้านธรรมดาในเคาน์ตี้นี้โกรธแค้นต่อการปฏิบัติต่อผู้พิพากษาท้องถิ่นที่ได้รับความนิยมของผู้ปกครองของตน"

 fp3_looking_the_other_way_modifier: "มองไปทางอื่น"
 fp3_looking_the_other_way_modifier_desc: "ตัวละครนี้ได้ใช้นโยบายเพิกเฉยต่อการประพฤติมิชอบทางเศรษฐกิจบางอย่างโดยข้าในบังคับและข้าแผ่นดินของตน - เพื่อประโยชน์ของอาณาจักร หรือเพื่อความสบายใจของตนเอง"

 fp3_capable_magistrates_modifier: "ผู้พิพากษาที่มีความสามารถ"
 fp3_capable_magistrates_modifier_desc: "ตัวละครนี้ได้รับการสนับสนุนจากผู้พิพากษาที่มีความสามารถเป็นพิเศษ ซึ่งสามารถ ทำให้คำตัดสินเกือบทุกอย่างดูยุติธรรมได้"

 fp3_delegated_payments_modifier: "มอบหมายการชำระเงิน"
 fp3_delegated_payments_modifier_desc: "ตัวละครนี้ได้ให้ผู้เก็บภาษีของตนเป็นผู้จ่ายเงินให้กับกองทัพ ซึ่งเป็นมาตรการที่มีประสิทธิภาพ - จนถึงขณะนี้"

 fp3_army_influence_modifier: "อิทธิพลในกองทัพ"
 fp3_army_influence_modifier_desc: "ตัวละครนี้ได้รับอิทธิพลอย่างมากเหนือกองทัพโดยเจ้าเหนือหัวของตน"

 fp3_messy_payments_modifier: "การชำระเงินที่ไม่น่าเชื่อถือ"
 fp3_messy_payments_modifier_desc: "ความรับผิดชอบในการจ่ายเงินให้กับทหารของตัวละครนี้ถูกแบ่งออกไปในลักษณะที่น่าอึดอัด บางครั้ง ทำให้เกิดความล่าช้า ซึ่งส่งผลเสียต่อขวัญกำลังใจ"

 fp3_cutting_corners_modifier: "ตัดขั้นตอน"
 fp3_cutting_corners_modifier_desc: "ตัวละครนี้ทำงานหนักเกินไป และด้วยเหตุนี้จึงค่อนข้างสะเพร่า"

 fp3_promoting_zoroastrianism_modifier: "มิตรแห่งชาวโซโรอัสเตอร์"
 fp3_promoting_zoroastrianism_modifier_desc: "ตัวละครนี้เป็นที่รู้กันว่าพยายามช่วยเหลือชุมชนโซโรอัสเตอร์"

 fp3_blessed_by_fire_modifier: "ได้รับพรจากไฟ"
 fp3_blessed_by_fire_modifier_desc: "ตัวละครนี้มีประสบการณ์ลึกซึ้งในการเผชิญหน้ากับไฟที่เกิดจากฟ้าผ่า ซึ่งเป็นธาตุที่บริสุทธิ์ที่สุดในโลกนี้"

 fp3_bad_tower_of_silence_county_modifier: "หอคอยแห่งความโง่เขลา"
 fp3_bad_tower_of_silence_county_modifier_desc: "มีความพยายามที่จะสร้างดัคมาใหม่ที่ยิ่งใหญ่ในเคาน์ตี้นี้ แต่เกิดข้อผิดพลาดในการก่อสร้าง และซากศพที่เน่าเปื่อยกำลังปนเปื้อนน้ำบาดาลเบื้องล่าง"

 fp3_wary_of_sabotage_modifier: "ระวังการก่อวินาศกรรม"
 fp3_wary_of_sabotage_modifier_desc: "ตัวละครนี้จะไม่ยอมทนต่อการหลอกลวงใดๆ ภายในเคาน์ตีที่ได้รับมอบหมาย"

 fp3_antagonize_character_interaction_known_liar: "เป็นที่รู้กันว่าพูดเกินจริง"
 fp3_antagonize_character_interaction_known_liar_desc: "ผู้คนเริ่มเบื่อหน่ายกับความคิดเห็นของตัวละครนี้ เนื่องจากพวกเขามักจะพูดเกินจริง"

 fp3_not_puppeteering_kingmaker_modifier: "ผู้ชักใยที่ล้มเหลว"
 fp3_not_puppeteering_kingmaker_modifier_desc: "ตัวละครนี้ล้มเหลวในการขับไล่ผู้ปกครองที่ไม่เป็นมิตรด้วยผู้ที่เหมาะสมกับผลประโยชน์ของตนมากกว่า ตอนนี้ความชอบธรรมของพวกเขาเองก็เป็นที่น่าสงสัย"

 fp3_sickly_monkey_modifier: "ลิงป่วย"
 fp3_sickly_monkey_modifier_desc: "ตัวละครนี้กำลังพยายามพยาบาลลิงป่วยให้กลับมาแข็งแรง กรงเล็บของสัตว์ตัวนี้แหลมคมและฟันของมันก็ลับคม"

 fp3_chess_playing_monkey_modifier: "ลิงเล่นหมากรุก"
 fp3_chess_playing_monkey_modifier_desc: "ตัวละครนี้เป็นเจ้าของลิงที่ร่ำลือกันว่าได้รับการสอนศิลปะการเล่นหมากรุกโดยกษัตริย์นักปราชญ์ชาวตะวันออก"

 fp3_paper_surplus_modifier: "มีกระดาษเหลือเฟือ"
 fp3_paper_surplus_modifier_desc: "ตัวละครนี้สามารถเข้าถึงกระดาษได้อย่างสม่ำเสมอเพื่อบันทึกงานวิจัยของตน"

 fp3_paper_shortage_modifier: "ขาดแคลนกระดาษ"
 fp3_paper_shortage_modifier_desc: "ตัวละครนี้ไม่สามารถเข้าถึงกระดาษได้อย่างสม่ำเสมอ และต้องใช้แหล่งกระดาษหนังที่ไม่บ่อยนักแทน"

 fp3_liquid_wisdom_modifier: "ปัญญาเหลว"
 fp3_liquid_wisdom_modifier_desc: "ตัวละครนี้ได้พิสูจน์ตัวเองว่าเป็นเจ้าบ้านที่ดีต่อนักวิชาการที่มาเยือน ซึ่งได้รับประโยชน์อย่างไม่ต้องสงสัยจากการแลกเปลี่ยนความคิดเห็นที่เสรีมากขึ้น"

 fp3_morbid_insights_modifier: "ความเข้าใจอันน่าสยดสยอง"
 fp3_morbid_insights_modifier_desc: "ตัวละครนี้ได้เรียนรู้บทเรียนที่โชคร้ายบางอย่างเกี่ยวกับสภาพของมนุษย์"

 fp3_wheat_shortage_modifier: "ขาดแคลนข้าวสาลี"
 fp3_wheat_shortage_modifier_desc: "คนทำขนมปังหลวงในเคาน์ตี้นี้กำลังกักตุนข้าวสาลี ไม่เหลือแม้ แต่เมานด์เดียวให้ชาวนา"

 fp3_generous_bakers_modifier: "คนทำขนมปังใจกว้าง"
 fp3_generous_bakers_modifier_desc: "คนทำขนมปังในเคาน์ตี้นี้ใจกว้างกับขนมปังของตนหลังจากการประหารชีวิตคนทำขนมปังโลภ"

 fp3_impious_tax_collector_modifier: "ผู้เก็บภาษีที่ไม่ศรัทธา"
 fp3_impious_tax_collector_modifier_desc: "ตัวละครนี้ถูกเปิดโปงต่อสาธารณะว่าเป็นผู้เก็บภาษีที่ไม่ดี เนื่องจากความบาปของตน"

 fp3_incapable_tax_collector_modifier: "ผู้เก็บภาษีที่ไร้ความสามารถ"
 fp3_incapable_tax_collector_modifier_desc: "ตัวละครนี้ไม่สามารถเป็นผู้เก็บภาษีได้อีกต่อไป เนื่องจากความบาปของตนเอง"

 fp3_religious_desertion_modifier: "การละทิ้งหน้าที่ทางศาสนา"
 fp3_religious_desertion_modifier_desc: "ทหารของเคาน์ตี้นี้ได้วางอาวุธเพื่อหลีกเลี่ยงการต่อสู้กับประมุขแห่งศรัทธาของตน"

 fp3_struggle_supremacy_house_reward_modifier: "อำนาจสูงสุดของซุนนี"
 fp3_struggle_supremacy_house_reward_modifier_desc: "เคาะลีฟะฮ์ที่เป็นของตระกูลนี้อ้างอำนาจที่กว้างขวาง เนื่องจากการฟื้นฟูอำนาจเหนืออิหร่านได้สำเร็จ"

 fp3_struggle_caliph_super_suspicious_modifier: "ระแวงอย่างยิ่ง"
 fp3_struggle_caliph_super_suspicious_modifier_desc: "เนื่องจากความไม่สงบที่เพิ่มขึ้นในภูมิภาค ตัวละครนี้รู้สึกเหมือนตกอยู่ในอันตรายอย่างใหญ่หลวง"
 has_fp3_struggle_caliph_super_suspicious_modifier: "[target.GetShortUIName]คือ$fp3_struggle_caliph_super_suspicious_modifier$: $VALUE|+0=-+$"

 fp3_irrigation_insights_modifier: "ความเข้าใจด้านการชลประทาน"
 fp3_irrigation_insights_modifier_desc: "จากการศึกษาระบบกานัตโบราณ ตัวละครนี้ได้เรียนรู้เกี่ยวกับการชลประทาน"

 disturbed_sky_burial: "การฝังศพบนฟ้าที่ถูกรบกวน"
 disturbed_sky_burial_desc: "ผู้คลั่งศาสนาในอาณาจักรประทับใจกับการจัดการอย่างเด็ดขาดต่อการปฏิบัติของพวกนอกรีต เช่น การฝังศพบนฟ้า ของตัวละครนี้"
 disturbed_funerals: "ดูหมิ่นศรัทธา"

 fp3_untrained_falcon: "เหยี่ยวที่ไม่ได้รับการฝึกฝน"
 fp3_untrained_falcon_desc: "ตัวละครนี้พบนกในระหว่างการฝังศพบนฟ้า มันสร้าง แต่ความเศร้าโศกให้พวกเขาจนถึงตอนนี้ แต่พวกเขาหวังว่าจะสามารถปั้นมันให้เป็นนักล่าที่แท้จริงได้"

 fp3_aggressive_falcon: "เหยี่ยวดุร้าย"
 fp3_aggressive_falcon_desc: "ตัวละครนี้พบนกในระหว่างการฝังศพบนฟ้า ดูเหมือนว่ามันจะพัฒนาความชอบในเนื้อมนุษย์ ซึ่งพวกเขาเลือกที่จะบ่มเพาะต่อไป"

 fp3_had_delicious_kumis: "ได้ดื่มคูมิสแสนอร่อย"
 fp3_had_delicious_kumis_desc: "ตัวละครนี้ได้แบ่งปันเครื่องดื่มที่ทำจากนมม้าแสนอร่อยกับนักเดินทางชาวเติร์กที่พวกเขาพบเจอในการเดินทาง"

 turkic_war_band: "จ้างกองทหารเติร์ก"
 turkic_war_band_desc: "ตัวละครนี้ได้จ้างกองทหารชนเผ่าเร่ร่อนชาวเติร์กเพื่อช่วยฝึกฝนกองทหารของตน สร้างความหวาดกลัวให้กับข้าในบังคับบางส่วน"

 rebuffed_turkic_war_band: "ปฏิเสธนักรบเติร์ก"
 rebuffed_turkic_war_band_desc: "ในการแสดงความกล้าหาญอันน่าประทับใจ ตัวละครนี้ได้ดูหมิ่นกลุ่มนักรบชนเผ่าเร่ร่อนกลุ่มใหญ่อย่างอุกอาจขณะเดินทาง"

 ancient_persian_relics: "สมบัติโบราณ"
 ancient_persian_relics_desc: "โชคลาภที่ไม่คาดคิดหมายความว่าตัวละครนี้กลายเป็นที่รู้จักในด้านความมั่งคั่งและความเอื้อเฟื้อเผื่อแผ่"

 fp3_house_modifier_conceded_hegemony: "ยอมรับอำนาจนำ"
 fp3_house_modifier_conceded_hegemony_desc: "ตระกูลนี้ต้องยอมรับอำนาจนำของตนเพื่อเอาใจศัตรู"
 fp3_house_modifier_rebuilding_efforts: "ความพยายามในการฟื้นฟู"
 fp3_house_modifier_rebuilding_efforts_desc: "ตระกูลนี้กำลังฟื้นฟูอาณาจักรของตนหลังจากการต่อสู้อันนองเลือดกับศัตรูของรัฐเคาะลีฟะฮ์"
 fp3_house_modifier_frontier_ambitions: "ความทะเยอทะยานชายแดน"
 fp3_house_modifier_frontier_ambitions_desc: "ตระกูลนี้กำลังมองหาเส้นทางการขยายอำนาจใหม่หลังจากการต่อสู้ที่ไร้ผลกับรัฐเคาะลีฟะฮ์"

 fp3_house_modifier_destroyed_the_caliphate: "ทำลายรัฐเคาะลีฟะฮ์"

 fp3_established_futuwaa_lodges_modifier: "ก่อตั้งโรงฝึกฟูตูวา"
 fp3_established_futuwaa_lodges_modifier_desc: "ตัวละครนี้ได้ก่อตั้งชมรมการต่อสู้สำหรับเยาวชนที่เกียจคร้านในเมืองหลวงของตน"
 fp3_established_madrasas_modifier: "ก่อตั้งมาดราซา"
 fp3_established_madrasas_modifier_desc: "ตัวละครนี้ได้ก่อตั้งโรงเรียน เพื่อให้การศึกษาแก่เยาวชนที่เกียจคร้านในเมืองหลวงของตน"

 fp3_rekindler_of_iran_modifier: "เปลวไฟแห่งเปอร์เซีย"
 fp3_rekindler_of_iran_modifier_desc: "ราชวงศ์นี้แก้ไขยุคเปลี่ยนผ่านอิหร่านโดยการจุดเปลวไฟแห่งเปอร์เซียขึ้นใหม่"
 fp3_rekindler_of_iran_modifier_reason: "ท่านมี[modifier|E] [GetModifier('fp3_rekindler_of_iran_modifier').GetNameWithTooltip|L]: $VALUE|=+0$"

 dreaded_beauty: "ความงามอันน่าสะพรึงกลัว"
 dreaded_beauty_desc: "บางคนกล่าวว่าเป็น เพราะปฏิกิริยาของผู้คนต่อความผิดปกติทางร่างกายของพวกเขาที่ ทำให้ตัวละครนี้โหดร้าย"

 generous_beauty: "ความงามอันเอื้อเฟื้อ"
 generous_beauty_desc: "บางทีอาจเป็นการชดเชยสิ่งที่ผู้คนพูดเกี่ยวกับรูปลักษณ์ของพวกเขาที่ ทำให้ผู้ปกครองผู้นี้สร้างชื่อเสียงให้กับตนเองในฐานะผู้ที่ทั้งใจกว้างในทรัพย์สินและพร้อมที่จะลืมภาษีค้างชำระ"

 fp3_flame_of_iran_modifier: "จิตวิญญาณเปอร์เซียที่ฟื้นคืน"
 fp3_flame_of_iran_modifier_desc: "จิตใจของตัวละครนี้กำลังลุกโชนไปด้วยความรู้สึกถึงเอกราชอันดุเดือดและความเป็นชุมชน"

 unified_the_persian_region_house_modifier: "ตระกูลแห่งผู้ก่อตั้ง"
 unified_the_persian_region_house_modifier_desc: "ตระกูลนี้นำความมั่นคงมาสู่ภูมิภาคโดยการรวมเป็นหนึ่ง"

 fp3_resisted_the_struggle_modifier: "ต่อต้านรัฐเคาะลีฟะฮ์"
 fp3_resisted_the_struggle_modifier_desc: "ตัวละครนี้ต่อสู้กับรัฐเคาะลีฟะฮ์และบรรลุสถานะเดิม"

 scheme_helpful_sympathizer_modifier: "ผู้เห็นอกเห็นใจที่เป็นประโยชน์"
 scheme_helpful_sympathizer_modifier_desc: "ข้าราชบริพารของเป้าหมายกำลังแอบส่งข้อมูลให้กับนักฆ่า"

 scheme_untrustworthy_sympathizer_modifier: "ผู้เห็นอกเห็นใจที่ไม่น่าไว้วางใจ"

 scheme_assassin_recruits_modifier: "ทหารเกณฑ์นักฆ่า"
 scheme_assassin_recruits_modifier_desc: "ปรมาจารย์นักฆ่าได้รับความช่วยเหลือจากผู้คลั่งไคล้ที่เพิ่งเกณฑ์มาใหม่ ซึ่งอาจมีความกระตือรือร้นมากกว่าความสามารถ"

 scheme_assassin_closing_in_modifier: "นักฆ่ากำลังใกล้เข้ามา"

 scheme_strengthened_resolve_modifier: "ความมุ่งมั่นที่แข็งแกร่งขึ้น"

 scheme_weakened_resolve_modifier: "ความมุ่งมั่นที่อ่อนแอลง"

 scheme_poisoned_blade_modifier: "ใบมีดอาบยาพิษ"

