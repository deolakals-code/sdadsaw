l_english: 
 
 fp3_clan.1000.t: "สิ่งที่มีค่ายิ่งกว่าทองคำ?"
 fp3_clan.1000.desc: "นักเก็บภาษีของข้า [target_tax_collector.GetFirstName] ได้กลับมาจากการเดินทาง [target_tax_collector.GetHerHis] ครั้งล่าสุดทั่วอาณาจักร [target_tax_collector.GetSheHe|U] ได้ขอเข้าเฝ้า อ้างว่าได้นำบางสิ่งที่ #EMP มีค่ามากกว่า#! ทองคำกลับมาด้วย\n\n"เจ้าเหนือหัวของข้า ข้าเพิ่งเก็บภาษีของราชวงศ์ใน [secret_holder.GetCapitalLocation.GetName] ในระหว่างที่ข้าอยู่ที่นั่น ข้าได้ยินข่าวลือเงียบๆ ว่า [secret_holder.GetTitledFirstName] [target_secret.Custom('SecretDescriptionThirdPerson')]..."\n\n"...และจากการสืบสวนเพิ่มเติม ข่าวลือเหล่านี้ดูเหมือนจะเป็นความจริง""
 fp3_clan.1000.a: "รางวัลเล็กน้อยสำหรับความพยายามของเจ้า"
 fp3_clan.1000.b: "ผลงานอันยอดเยี่ยม เช่นนี้สมควรได้รับรางวัล!"
 fp3_clan.1000.c: "#EMP น่าพึงพอใจยิ่งนัก#!! ทำได้ดีมาก, [target_tax_collector.GetFirstNameNoTooltip]!"

 fp3_clan.1010.t: "[target_tax_collector.GetHerHis|U] ยักยอกทรัพย์"
 fp3_clan.1010.desc: "สมุหบัญชีของข้า, [steward.GetTitledFirstName], ได้ตรวจสอบบัญชีภาษีและพบความผิดปกติบางประการเกี่ยวกับบันทึกการจัดเก็บของ [target_tax_collector.GetFirstNamePossessive] — ความผิดปกติที่คิดเป็นมูลค่าเกือบ [ROOT.Var('embezzled_gold').GetValue] ทอง...\n\nเหตุผลเดียวที่เป็นไปได้สำหรับความคลาดเคลื่อนดังกล่าวคือ [target_tax_collector.GetFirstNameNoTooltip] ได้ยักยอกทรัพย์สินหลวง ข้าได้เรียก [target_tax_collector.GetHerHim] มาต่อหน้าข้าเพื่อตอบข้อกล่าวหาเหล่านี้\n\n"เป็นความจริงพ่ะย่ะค่ะ ข้า แต่ฝ่าบาท แม้ข้าจะรู้สึกละอายอยู่บ้าง แต่ข้าขอวิงวอนให้ทรงเห็นถึงความหลักแหลมในการกระทำของข้า — ทักษะที่ฝ่าบาทอาจทรงใช้ประโยชน์ได้ในภายภาคหน้า...""
 fp3_clan.1010.a: "เจ้าจงคืนสิ่งที่ติดค้าง #EMP ทันที!#!"
 fp3_clan.1010.a.success: "ท่านโน้มน้าวให้ [target_tax_collector.GetFirstNameNoTooltip] คืนเงินได้สำเร็จ"
 fp3_clan.1010.a.failure: "[target_tax_collector.GetFirstNameNoTooltip] ไม่คล้อยตาม"
 fp3_clan.1010.b: "โอกาสบวกกับสัญชาตญาณย่อมนำมา ซึ่งผลกำไร"
 fp3_clan.1010.b.flavor: "ท่านชื่นชม [target_tax_collector.GetFirstNameNoTooltip] ในความหลักแหลมของ [target_tax_collector.GetHerHis]"
 fp3_clan.1010.c: "การโบยสักยี่สิบทีคงจะช่วยเตือนความจำเจ้าได้ว่าทองคำที่เจ้าเก็บนั้นเป็นของผู้ใด"

 fp3_clan.1020.t: "การเรียนรู้เชิงปฏิบัติ"
 fp3_clan.1020.desc: "สมุหบัญชีของข้า, [steward.GetTitledFirstName], เข้ามาหาข้าพร้อมกับ [target_tax_collector.GetFirstName], ข้าหลวงเก็บภาษีของข้า, เดินตามมาติดๆ\n\n"[target_tax_collector.GetFirstNameNoTooltip] ปฏิบัติหน้าที่ได้ดีเป็นพิเศษในช่วงหลังนี้ "
 fp3_clan.1020.stewardship: "[target_tax_collector.GetSheHe|U] ได้แสดงให้เห็นถึงแววในด้านการจัดการและตัวเลข"\n\n"
 fp3_clan.1020.intrigue: "[target_tax_collector.GetSheHe|U] ได้แสดงให้เห็นถึงความถนัดในศิลปะอันแยบยลในงานฝีมือของ [target_tax_collector.GetHerHis]"\n\n"
 fp3_clan.1020.diplomacy: "[target_tax_collector.GetSheHe|U] ได้แสดงให้เห็นถึงทักษะอันลึกซึ้งในศิลปะแห่งการทูต"\n\n"
 fp3_clan.1020.outro: ""ข้าคิดว่า [target_tax_collector.GetSheHe] สมควรได้รับคำชมเชยบางรูปแบบพ่ะย่ะค่ะ ข้า แต่ฝ่าบาท ท้ายที่สุดแล้ว การฝึกฝนทักษะนี้อาจหมายถึงทองคำที่มากขึ้นในคลังหลวง""
 fp3_clan.1020.a: ""ทำได้ดีมาก, [target_tax_collector.GetFirstNameNoTooltip]! เจ้าควรภาคภูมิใจในฝีมือของตน""
 fp3_clan.1020.b: ""บางทีเจ้าอาจจะสอนเคล็ดวิชาสักอย่างสองอย่างแก่ข้าหลวงเก็บภาษีคนอื่นๆ ได้กระมัง?""
 fp3_clan.1020.every_tax_collector: "[tax_collector|E] ทุกคน"
 fp3_clan.1020.b.improved_tax_collectors: "ข้าหลวงเก็บภาษีได้รับการพัฒนา"
 fp3_clan.1020.b.improved_tax_collectors.desc: "[target_tax_collector.GetFirstNameNoTooltip] ได้แบ่งปันความรู้ของ [target_tax_collector.GetHerHis] ให้แก่ข้าหลวงเก็บภาษี [ROOT.Var('num_improved_tax_collectors').GetValue] คน"
 fp3_clan.1020.b.none_improved: "ไม่มีข้าหลวงเก็บภาษีคนใดได้รับการพัฒนา"
 fp3_clan.1020.b.none_improved.desc: "[target_tax_collector.GetFirstNameNoTooltip] ล้มเหลวในการถ่ายทอดคำสอนใดๆ ให้แก่เพื่อนข้าหลวงเก็บภาษีของ [target_tax_collector.GetHerHis]"
 fp3_clan.1020.c: ""ข้าไม่มีเวลามาส่งเสริมความทะนงตนของเจ้าหรอก!""

 fp3_clan.1030.t: "ข้อพิพาทเรื่องภาษี"
 fp3_clan.1030.desc: ""ข้าปฏิเสธที่จะจ่ายภาษีให้ [target_tax_collector.GetFaith.GetAdherentNameNoTooltip] [target_tax_collector.Custom2('InsultAdjective', SCOPE.sC('target_taxed_vassal'))]!" [target_taxed_vassal.GetTitledFirstName] ตะโกนใส่หน้า [target_tax_collector.GetFirstName]\n\n"มันเป็นหน้าที่ของข้าที่จะเก็บภาษีเพื่อราชสำนัก! การดูหมิ่นตัวข้าก็คือการดูหมิ่น [ROOT.Char.GetNameNoTooltip]!" [target_tax_collector.GetFirstNameNoTooltip] สวนกลับ "ฝ่าบาท โปรดแก้ไขข้อพิพาทนี้ เพื่อให้ข้าสามารถทำงานต่อไปได้"\n\n[target_taxed_vassal.GetTitledFirstNameNoTooltip] ยืนหัวฟัดหัวเหวี่ยงขณะที่ [target_tax_collector.GetFirstNameNoTooltip] กระทืบเท้าของ [target_tax_collector.GetHerHis] อย่างไม่อดทน เห็นได้ชัดว่าข้าต้องตัดสินใจว่าจะเอาใจข้าหลวงหรือสนับสนุนนักเก็บภาษีของข้า..."
 fp3_clan.1030.a: "เห็นได้ชัดว่า [target_tax_collector.GetFirstNameNoTooltip] ไม่เหมาะกับเขตภาษีนี้"
 tax_collector_fired_on_religious_grounds: "ข้าหลวงเก็บภาษีถูกไล่ออกด้วยเหตุผลทางศาสนา"
 fp3_clan.1030.b: "[target_taxed_vassal.GetFirstNameNoTooltip] จะต้องจ่ายภาษีที่ค้างชำระของ [target_taxed_vassal.GetHerHis]"
 fp3_clan.1030.c: "พวกเจ้าไปจัดการกันเองเถิด"

fp3_clan.1040.t: "ที่ดินที่ถูกจัดการอย่างไม่เหมาะสม"
fp3_clan.1040.desc: "นักเก็บภาษีของข้า [target_tax_collector.GetFirstName] รายงานผลการสำรวจ [target_tax_collector.GetHerHis] ครั้งล่าสุดของอาณาจักรและสรุปเรื่องที่น่ากังวลอย่างยิ่ง:\n\n"เจ้าเหนือหัวของข้า วิธีที่ [target_taxed_vassal.GetTitledFirstName] จัดการดินแดน [target_taxed_vassal.GetHerHis] นั้นรับไม่ได้โดยสิ้นเชิง! สามารถทำอะไรได้อีกมากกับดินแดนของ [target_taxed_vassal.GetPrimaryTitle.GetNameNoTier] หากพวกเขามีผู้ดูแลที่มีความสามารถ""
fp3_clan.1040.a: "เตือนข้าในบังคับทั้งหมดของข้าถึงหน้าที่ความรับผิดชอบของพวกเขา"
fp3_clan.1040.b: "ข้าจะสอน [target_taxed_vassal.GetHerHim] สักอย่างสองอย่างด้วยตนเอง!"
fp3_clan.1040.b.success: "ท่านสั่งสอน [target_taxed_vassal.GetTitledFirstNameNoTooltip] ได้สำเร็จ"
fp3_clan.1040.b.failure: "[target_taxed_vassal.GetTitledFirstNameNoTooltip] ไม่เข้าใจคำสอนของท่าน"
fp3_clan.1040.c: "บางทีการเตือนความจำถึงอำนาจของข้าด้วยวิธี #EMP ทางกายภาพ#! อาจจะเหมาะสมกว่า..."
