l_english: 
 clan_event.2000.t: "เรียนรู้งาน"
 clan_event.2000.desc: "ดูเหมือนว่า[improved_tax_collector.GetName] [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('improved_tax_collector'))]ของข้า จะปฏิบัติหน้าที่ได้ดีเป็นพิเศษในช่วงหลังนี้ และด้วยเหตุนี้ โอกาสจึงได้ปรากฏขึ้น เปิดช่องให้ข้าได้ชี้นำและส่งอิทธิพลต่องานของ[improved_tax_collector.GetHerHim]อย่างมากในอนาคตอันใกล้\n\nบางทีนี่อาจเป็นโอกาสให้[improved_tax_collector.GetHerHim]ได้พัฒนาทักษะของ[improved_tax_collector.GetHerHis]ให้ก้าวหน้ายิ่งขึ้น?"
 clan_event.2000.a: "จงใส่ใจต่อความต้องการของราษฎร"
 clan_event.2000.b: "จัดเวรยามตรวจตรา #EMP นั่น#! จะ ทำให้เหล่าข้าในบังคับอยู่ในระเบียบ"
 clan_event.2000.c: "จงทำบัญชี และจัดระเบียบงานของเจ้า"
 clan_event.2000.d: "สอดแนมเหล่าข้าแผ่นดินของข้า เจ้าจะได้เรียนรู้มากจากการจับตามอง"
 clan_event.2000.d.tt: "หากมีความลับที่ไม่เปิดเผยอยู่ จะได้เรียนรู้ความลับจากข้าในบังคับที่ถูกเก็บภาษีโดย[improved_tax_collector.GetName]"
 clan_event.2000.e1: "จงอุทิศเวลาให้กับการศึกษาเล่าเรียน"
 clan_event.2000.e2: "จงอุทิศเวลาให้กับเรื่องศรัทธา ไม่มีผู้ใดอยู่เหนือ[ROOT.Char.GetFaith.HighGodName]"
 clan_event.2000.option_f: "เจ้ามาที่นี่เพื่อเก็บภาษีมิใช่รึ? เช่นนั้นก็ #EMP ไป#! เก็บภาษีมาให้ข้า!"
 clan_event.2000.g: "จงกล่าวถึงข้าในทางที่ดีขณะเดินทาง"
 clan_event.2000.a.success: "[improved_tax_collector.GetNameNoTooltip] ทำให้เหล่าข้าในบังคับพอใจ"
 clan_event.2000.b.success: "[improved_tax_collector.GetNameNoTooltip] ทำให้เหล่าข้าในบังคับไม่สบายใจ"
 clan_event.2000.c.success: "[improved_tax_collector.GetNameNoTooltip]ปรับปรุงการจัดเก็บภาษี"
 clan_event.2000.d.success: "[improved_tax_collector.GetNameNoTooltip]ค้นพบความลับ"
 every_taxed_vassal_tt: "[taxpayer|E]ทุกคนที่ถูกมอบหมายให้[tax_collector_name.GetName]"
 
 clan_event.2001.t: "การเก็บภาษีเพื่อการศึกษา"
 clan_event.2001.opening_desc: "[educational_tax_collector.GetName]ดูเหมือนจะได้เรียนรู้มากมายจากหน้าที่ในฐานะผู้เก็บภาษี ซึ่งเห็นได้ชัดเจนเมื่อ[educational_tax_collector.GetSheHe]รายงานถึงความพยายามล่าสุดของ[educational_tax_collector.GetHerHis]\n\n"
 clan_event.2001.education_diplomacy: ""... และข้าจัดการแก้ไขสถานการณ์ทั้งหมดได้ด้วยเพียงคำพูด! ศิลปะอันยอดเยี่ยมแห่งการทูต""
 clan_event.2001.education_martial: ""... แต่ข้าใช้ประโยชน์จากทหารที่ติดตามไปด้วยเป็นอย่างดี พวกเขา ทำให้แน่ใจว่าเราได้ทุกเหรียญที่พวกนั้นติดค้างท่าน นาย[ROOT.Char.GetLadyLord]ของข้า!""
 clan_event.2001.education_stewardship: "... ปรากฏว่า ข้า#EMP รู้สึกขอบคุณอย่างยิ่ง#!ที่ข้าเก็บบันทึกอย่างละเอียด เช่นนี้ ข้าจะนำบัญชีติดตัวไปด้วยนับ แต่นี้ไป"
 clan_event.2001.education_intrigue: ""... หลังจากการข่มขู่แบบลับๆ ไม่กี่ครั้ง ในที่สุดพวกเขาก็ยอมจ่ายและข้าก็เดินทางต่อไปได้ ข้าสงสัยว่าข้าจะต้องระวังหลังหรือไม่เมื่อไปที่นั่นครั้งต่อไป...""
 clan_event.2001.education_learning: ""... และแล้วเราก็ลงเอยด้วยการโต้เถียงที่ค่อนข้างดุเดือด โดยธรรมชาติแล้ว ข้าใช้ตรรกะที่เหนือกว่าเพื่อเอาชนะการโต้แย้ง ในท้ายที่สุด พวกเขาก็#EMP ยินดี#!ที่จะจ่ายเหรียญสองสามเหรียญสุดท้ายนั้น!""
 clan_event.2001.a: "ภาษีเป็นประโยชน์ต่อเราทั้งสองฝ่าย!"
 clan_event.2001.b: "แน่นอนว่าเจ้าทำได้ดีกว่านี้?"
 clan_event.2001.success: "ทักษะของ[educational_tax_collector.GetNamePossessiveNoTooltip]เพิ่มขึ้น"
 
 clan_event.2002.t: "ผู้เก็บภาษีทำงานหนักเกินไป"
 clan_event.2002.desc: "เวลาดึกแล้ว แต่ข้ายังเห็นแสงไฟริบหรี่มาจากห้องถัดไป ที่ประตูแง้มอยู่ ข้าค่อยๆ ผลักประตูเปิดออกและพบ [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('troubled_tax_collector'))] [troubled_tax_collector.GetName] ของข้าด้วยดวงตาที่หนักอึ้ง ก้มหน้าอยู่เหนือสมุดบัญชีที่เปิดอยู่ กองสมุดบัญชีอีกกองตั้งอยู่ข้างๆ [troubled_tax_collector.GetHerHim]\n\n[troubled_tax_collector.GetSheHe|U] เงยหน้า [troubled_tax_collector.GetHerHis] ขึ้นและสังเกตเห็นการปรากฏตัวของข้า: "โอ้ ขออภัย [ROOT.Char.GetLadyLord] ของข้า แต่ข้ายังต้องจัดการกับบัญชีภาษีล่าสุดเหล่านี้...""
 clan_event.2002.a: "ให้ข้าช่วย!"
 clan_event.2002.b: "ทำไมเจ้าไม่พักผ่อนเสียหน่อยล่ะ?"
 clan_event.2002.c: "ดี ข้าในบังคับของข้า#EMP คาดหวัง#!ให้ภาษีของพวกเขาได้รับการจัดการอย่างมีประสิทธิภาพ..."
 
 clan_event.2005.t: "เสนอตัวแทน"
 clan_event.2005.desc: "[loyal_vassal.GetName] [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('loyal_vassal'))]ของข้า ปรากฏตัวในราชสำนักของข้าโดยไม่คาดคิด พร้อมกับ[tax_collector_replacement.GetWomanMan]ที่ถูกจูงตามมาติดๆ\n\n"ท่าน[ROOT.Char.GetTitleAsNameNoTooltip]ผู้ยิ่งใหญ่! ข้าสังเกตเห็นว่าผู้เก็บภาษีของท่าน [bad_tax_collector.GetName] นั้น เรียกได้ว่า #EMP ขาด#!ทักษะที่จำเป็นในการปฏิบัติหน้าที่ของ[bad_tax_collector.GetHerHis]อย่างเพียงพอ ข้าจึงนำของขวัญมาให้ท่าน"\n\n[loyal_vassal.GetFirstNameNoTooltip]ผายมือไปยังสหายของ[loyal_vassal.GetHerHis]; "[tax_collector_replacement.GetName]จะรับใช้ท่านอย่างน่าชื่นชม""
 clan_event.2005.a: "เป็นของขวัญที่น่าซาบซึ้งยิ่งนัก!"
 clan_event.2005.b: "เจ้าเก็บคนรับใช้ของเจ้าไว้เถิด ความภักดีของเจ้าก็เพียงพอแล้ว"
 clan_event.2005.c: "[bad_tax_collector.GetNameNoTooltip]คงต้องทำงานหนักขึ้น..."
 
 clan_event.2007.t: "บัญชีเจ้าปัญหา"
 clan_event.2007.desc: "ข้าจ้องบัญชีงี่เง่านี่มาหลายชั่วโมงแล้ว มัน #EMP เห็น ๆ#! ว่าไม่ลงตัว แต่ข้ากลับหาต้นตอของปัญหาไม่พบ...\n\nข้าพลันสังเกตเห็น [helping_tax_collector.GetName] [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('helping_tax_collector'))] ของข้า ชะโงกข้ามไหล่มาตรวจดูบัญชีตรงหน้าข้า [helping_tax_collector.GetSheHe|U] ใช้นิ้วของ [helping_tax_collector.GetHerHis] แตะที่ด้านบนของหน้ากระดาษ\n\n"ท่านอาจจะอยากเริ่มตรงนั้นนะ [ROOT.Char.Custom('FormOfAddressForLiege')]""
 clan_event.2007.a: "เอ่อ เจ้าช่วยข้าจัดการเรื่องนี้ได้หรือไม่?"
 clan_event.2007.b: "ข้าจัดการเองได้ ขอบคุณมาก"
 clan_event.2007.c: "เจ้าเพิ่งอาสาจัดการมันรึ? ขอบคุณ!"
 clan_event.2007.success_tt: "ท่านเอาชนะบัญชีและพบปัญหา"
 clan_event.2007.success: "ท่านจัดการบัญชีได้สำเร็จ"
 clan_event.2007.failure_tt: "ท่านไม่สามารถทำความเข้าใจมันได้"
 clan_event.2007.failure: "บัญชียังคงยุ่งเหยิงวุ่นวาย"
 clan_event.2007.tt: "#weak [helping_tax_collector.GetName]พบความผิดปกติเพิ่มเติมในบัญชี ซึ่งเจ้าของที่ดินรายย่อยสองสามรายติดค้างภาษีท่านอยู่#! "
 clan_event.2007.successful_tax_collector: "[helping_tax_collector.GetName]รวบรวมภาษีที่ขาดหายไป"
 
 fp3_efficient_tax_collector: "ผู้เก็บภาษีผู้มีทักษะ"
 fp3_efficient_tax_collector_desc: "ผู้เก็บภาษีในรัฐบาลของตัวละครนี้มีทักษะเป็นพิเศษ และไม่ละเว้นสิ่งใดในการค้นหาเหรียญ"
 
 fp3_outrageous_tax_collection_opinion: "โกรธแค้นเรื่องการเก็บภาษี"
 fp3_diplomatic_tax_collection_opinion: "พอใจกับ[tax_collector|E]"
 fp3_thankful_tax_collector_opinion: "รู้สึกขอบคุณ"
