 ##################################################

#Usury against Unity, by Ola Jentzsch 
 fp3_clan.8000.t: "การขูดรีดดอกเบี้ยต่อต้านความสามัคคี"
 fp3_clan.8000.desc: "[concerned_one.GetName] เข้ามาหาข้า ดูเหมือนจะกังวล "ข้าได้ยินมาว่า [usurer.GetTitledFirstName] ให้ข้าราชสำนักที่ประสบปัญหาทางการเงินยืมเงิน หาประโยชน์จากความโชคร้ายของพวกเขาด้วยอัตราดอกเบี้ย [usurer.GetHerHis] ที่สูงเกินไป ทุกคนกำลังพูดว่า [usurer.GetSheHe] เป็นคนปล่อยเงินกู้และต้องรับผิดชอบ"\n\nเมื่อข้าเผชิญหน้ากับ [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('usurer'))] ที่ถูกกล่าวหา [usurer.GetSheHe] คัดค้านอย่างรุนแรง "นี่เป็นข้อกล่าวหาที่ชั่วร้าย! เพื่อนบางคนขอความช่วยเหลือทางการเงิน นั่นเป็นความจริง แต่ข้าไม่มีเจตนาร้ายและไม่ได้เรียกร้องเกินกว่าที่ถูกต้อง\n\n[concerned_one.GetTitledFirstNameNoTooltip] จริงๆ แล้วเป็นหนี้ข้าอยู่ ดังนั้น [concerned_one.GetHerHis] จึงเข้ามายุ่งเกี่ยวกับเรื่องนี้""
 fp3_clan.8000.a: "เวลาในคุกใต้ดินจะเปลี่ยนนิสัยเจ้าเอง [usurer.GetFirstName]"
 fp3_clan.8000.b: "แบ่งปันทรัพย์สินที่ได้มาโดยมิชอบของเจ้า แล้วเราจะลืมเรื่องนี้ไปเสีย"
 fp3_clan.8000.c: "ฟังดูเหมือนเป็นเรื่องที่พวกเจ้าต้องไปตกลงกันเอง"
 fp3_relations_reaction_to_imprisonment.tt: "สมาชิกตระกูลและข้าในบังคับที่ชอบ [usurer.GetTitledFirstNameNoTooltip] จะมีปฏิกิริยาในทางลบต่อเรื่องนี้"

 #Clan Quarrel, by Ola Jentzsch 
 fp3_clan.8001.t: "ความขัดแย้งในตระกูล"
 fp3_clan.8001_beginning: "[bickerer_1.GetTitledFirstName] และ [bickerer_2.GetTitledFirstName] ลงเอยด้วยการทะเลาะวิวาทกันในงานเลี้ยงส่วนตัวเมื่อเร็วๆ นี้ และทั้งคู่ต่างยืนกรานที่จะดึงข้าเข้าไปอยู่ข้างตนในความขัดแย้งนี้"
 fp3_clan.8001_faith_schism: "ความไม่ลงรอยกันของพวกเขาดูเหมือนจะเกิดจากการถกเถียงอย่างเผ็ดร้อนเกี่ยวกับธรรมชาติของ [bickerer_1.GetFaith.PantheonTerm]\n\n"[bickerer_1.GetFirstNameNoTooltip] มีความคิดเห็นที่ #EMP น่ากังขา#! อย่างยิ่ง" [bickerer_2.GetFirstNameNoTooltip] อ้าง "หากข้าเป็นท่าน ข้าจะขับไล่ [bickerer_1.GetHerHim] ออกจากราชสำนัก!"\n\n"ข้าจะละเว้นรายละเอียดอันน่าสะพรึงกลัวของข้อโต้แย้งที่เรียกว่าของ [bickerer_2.GetFirstNamePossessiveNoTooltip]" [bickerer_1.GetFirstNameNoTooltip] คัดค้าน "แต่เชื่อข้าเถอะ #EMP ข้า#! ไม่ใช่ผู้ที่ลบหลู่สิ่งศักดิ์สิทธิ์ที่นี่..."
 fp3_clan.8001_generic_fallback: "แม้จะไม่ชัดเจนว่าเกิดสิ่งใดขึ้นกันแน่ แต่ทั้งคู่ต่างก็กระตือรือร้นที่จะบอกข้าอย่างละเอียดว่าพวกตนคิดอย่างไรกับอีกฝ่าย\n\n"[bickerer_2.GetFirstNameNoTooltip] มันก็แค่ [Select_CString(bickerer_2.IsFemale,'นังทึ่ม','ไอ้ไพร่')] ที่เกิดข้างพุ่มไม้ ไม่มีอะไรมากไปกว่านั้น" [bickerer_1.GetFirstNameNoTooltip] โต้แย้ง\n\n"หุบปากไปเลย [bickerer_1.Custom2('InsultNoun', SCOPE.sC('bickerer_2'))]" [bickerer_2.GetFirstNameNoTooltip] ตวาดกลับ\n\nการไกล่เกลี่ยระหว่างทั้งคู่ ณ จุดนี้ดูจะเป็นงานที่สูญเปล่า ทว่าข้าก็กังวลว่าหากปล่อยไว้เรื่องราวจะยิ่งเลวร้ายลง"
 fp3_clan.8001.a: "ถึงเวลาปล่อยวางเรื่องนี้ เพื่อประโยชน์ของทุกคน"
 fp3_clan.8001.b: "อันที่จริง [bickerer_1.GetFirstNameNoTooltip] ก็มีเหตุผลอยู่บ้าง..."
 fp3_clan.8001.c: "ข้ามีเรื่องสำคัญกว่าต้องทำ... ที่ไหนสักแห่ง"
 fp3_clan.8001.d: "อย่าดึงข้าเข้าไปเกี่ยวข้องกับเรื่องนี้"
 fp3_clan_making_conflict_worse_flavor: "ท่านพยายาม ทำให้รอยร้าวระหว่าง [bickerer_1.GetFirstNameNoTooltip] และ [bickerer_2.GetFirstNameNoTooltip] ลึกซึ้งยิ่งขึ้น"
 fp3_clan.8001.b.success: "พวกเขาตกหลุมพรางการชักใยของท่าน"
 fp3_clan.8001.b.failure: "พวกเขามองทะลุการหลอกลวงของท่าน"
 fp3_clan.8001.b.success.tt: "ท่านก่อให้เกิดรอยร้าวในตระกูล"
 fp3_clan.8001.b.failure.tt: "ท่านล้มเหลวในการหว่านความขัดแย้ง"
 fp3_clan.8001.a.success: "ท่านสมานรอยร้าวนี้ได้สำเร็จ"
 fp3_clan.8001.a.success.tt: "การไกล่เกลี่ยของท่านสำเร็จ"
 fp3_clan.8001.a.failure: "ท่านเพียง แต่ ทำให้เรื่องแย่ลง"
 fp3_clan.8001.a.failure.tt: "การไกล่เกลี่ยของท่านล้มเหลว"


 #Bonds of Faith, by Ola Jentzsch 
 fp3_clan.8002.t: "พันธะแห่งศรัทธา"
 fp3_clan.8002.desc: ""[ROOT.Char.Custom('FormOfAddressForLiege')|U]" [chaplain.GetFirstName] [chaplain.GetCouncilTitle] ของข้า กล่าวอย่างวิตก "เราต้องสนทนากันเรื่องจิตวิญญาณขอรับ" [chaplain.GetSheHe|U] หยุดชั่วครู่ เพื่อให้แน่ใจว่าเราอยู่กันตามลำพัง\n\n"ข้าได้ยิน [clan_member.GetName] นินทาว่าท่านไม่ค่อยไปเยือน [ROOT.Char.GetFaith.HouseOfWorship] เลย\n\nบัดนี้ ข้ามิบังอาจคาดเดาถึงความสัมพันธ์ส่วนตัวของท่านกับสิ่งศักดิ์สิทธิ์ดอกนะ [ROOT.Char.GetTitleTierName] ผู้สูงศักดิ์ แต่การที่ท่านถูก #EMP มอง#! ว่าเคร่งครัดในศรัทธาเพียงใดนั้น คือสิ่งสำคัญที่สุดต่อเหล่าผู้อยู่ใต้ปกครอง""
 fp3_clan.8002.a: "บางทีข้าอาจพลาดพลั้งไป และละเลยหน้าที่ของข้า..."
 fp3_clan.8002.b: "จะมีการบริจาคเงินให้แก่ [ROOT.Char.GetFaith.HouseOfWorship] ในท้องถิ่น"
 fp3_clan.8002.c: "ปล่อยให้คนโง่เขลาเบาปัญญาเหล่านั้น #EMP คิด#! ไปว่าข้าใส่ใจ..."
 fp3_clan.8002.d: "[clan_member.GetFirstNameNoTooltip] งั้นรึ? ข้าจะตัดลิ้น[clan_member.GetHerHis]เสีย เพราะเรื่องนี้..."
 fp3_clan.8002.e: "ข้าไม่จำเป็นต้องโกหกเกี่ยวกับความศรัทธาของข้า"
 fp3_pretending_to_be_pious_flavor: "ท่านใช้เวลามากขึ้นใน [ROOT.Char.GetFaith.HouseOfWorship] - หรือ ทำให้ผู้คนคิดว่าท่านทำ เช่นนั้น"
 fp3_clan.8002.b.success: "การหลอกลวงของท่านประสบความสำเร็จ"
 fp3_clan.8002.b.failure: "ท่านหลอกใครไม่ได้"
 fp3_clan.8002.b.success.tt: "ความศรัทธาของท่านอยู่เหนือข้อครหา"
 fp3_clan.8002.b.failure.tt: "ความเคร่งศาสนาจอมปลอมของท่านถูกเปิดเผย"

 #The Power of a Name, by Ola Jentzsch
 fp3_clan.8003.t: "พลังแห่งนาม"
 fp3_clan.8003_fear_opening: ""[ROOT.Char.GetName] ท่านได้กลายเป็นผู้ยิ่งใหญ่ในหมู่ [ROOT.Char.Custom('LevyMenWomen')] และการกระทำและนามของท่านเป็นที่เคารพ...และหวาดกลัว" ทูตของ [righteous_caliph.GetTitledFirstNamePossessive] [hof_emissary.GetFirstName] หยุดพูดด้วยความหวาดหวั่น\n\n"
 fp3_clan.8003_respect_opening: ""[ROOT.Char.GetName] ท่านได้กลายเป็นผู้ยิ่งใหญ่ในหมู่ [ROOT.Char.Custom('LevyMenWomen')] และการกระทำและตระกูลของท่านเป็นที่เคารพและได้รับเกียรติจากทุกคน" ทูตของ [righteous_caliph.GetTitledFirstNamePossessive] [hof_emissary.GetFirstName] หยุดพูดอย่างเคร่งขรึม\n\n"
fp3_clan.8003_ending: ""นี่คือพระดำรัสของ [righteous_caliph.GetTitleTierName]" [hof_emissary.GetSheHe] ประกาศ "และ [righteous_caliph.GetSheHe] ได้ตัดสินใจมอบเกียรติอันยิ่งใหญ่แก่ท่าน นามของท่านจะถูกอ่านในระหว่างการละหมาดวันศุกร์ ใน [caliphal_location.GetName] เอง สิ่งที่ [righteous_caliph.GetTitleTierName] ขอเป็นการตอบแทนคือขอให้ท่านอย่าลืมพระคุณของ [righteous_caliph.GetHerHis] ในการมอบของขวัญนี้แก่ท่าน..."\n\nเสียงของ [hof_emissary.GetHerHis|U] แผ่วลง ราวกับจะเน้นย้ำความหมายที่ซ่อนอยู่ในคำพูดเหล่านั้น"
 fp3_clan.8003.a: "นับเป็นเกียรติอย่างยิ่ง"
 fp3_clan.8003.b: "อ่านเพียงครั้งเดียวก็เพียงพอแล้ว"
 fp3_clan.8003.c: "ข้าไม่สมควรได้รับสิ่งนี้"

 #Bonds of Fear, by Ola Jentzsch
 fp3_clan.8004.t: "พันธะแห่งความกลัว"
 fp3_clan.8004.desc: "[murder_enthusiast.Custom('GetCouncilOrCourtPosition')] [murder_enthusiast.GetFirstName] ของข้าได้ขอสนทนาเป็นการส่วนตัว ด้วยสีหน้ากังวล [murder_enthusiast.GetHerHis]\n\n"ฟังนะ โอ้ [ROOT.Char.GetTitleTierName]" [murder_enthusiast.GetSheHe] กล่าว เกือบจะกระซิบ "[clan_member.GetName] กำลังทำอะไรบางอย่างอยู่ อาจจะสมคบคิดต่อต้านท่านอีกครั้ง บางทีถึงเวลาแล้วที่จะต้องดำเนินการกับใครบางคนที่ใกล้ชิดกับ [clan_member.GetHerHim] เพื่อส่งสาร? ข้าได้ยินมาว่า [clan_member.GetSheHe] มีคนรับใช้ที่ [clan_member.GetSheHe] โปรดปราน...""
 fp3_clan.8004.a: "จัดการเลย - แต่ทำอย่างลับๆ"
 fp3_clan.8004.b: "ไม่จำเป็นต้องลับๆ ล่อๆ - แค่ฆ่าพวกมันทิ้งซะ"
 fp3_clan.8004.c: "ไม่ และอย่าพูดเรื่องนี้อีกเป็นอันขาด"
 fp3_clan.8004.a.success: "ท่านข่มขู่ [clan_member.GetTitledFirstNameNoTooltip] ได้สำเร็จ"
 fp3_clan.8004.a.success.tt: "ท่านเป็นที่หวาดกลัวในตระกูล"
 fp3_clan.8004.a.failure: "แผนการของท่านย้อนกลับมาทำร้ายตัวเอง"
 fp3_clan.8004.a.failure.tt: "[clan_member.GetTitledFirstNameNoTooltip] ไม่สะทกสะท้าน"

 #A Proper Position, by Ola Jentzsch
 fp3_clan.8005.t: "ตำแหน่งอันเหมาะสม"
 fp3_clan.8005.desc: ""มันไม่ยุติธรรม" [ambitious_consort.GetTitledFirstName] บ่น ในที่สุดก็เปล่งเสียงความไม่พอใจที่ดูเหมือนจะอัดอั้นมานาน\n\n"[heir_child.GetFirstName] [heir_child.Custom('GetDaughterSon')] ที่ถูกตามใจของ [heir_parent.GetTitledFirstName] จะได้รับสืบทอด [ROOT.Char.GetPrimaryTitle.GetTierAsNameNoTooltip] ในขณะที่ [empowered_child.Custom('GirlBoy')] ที่ฉลาดของข้า [empowered_child.GetFirstName] จะแทบไม่ได้อะไรเลย\n\nข้าต้องการให้ท่านมอบ [title_to_grant.GetName] ให้แก่ [empowered_child.GetFirstNameNoTooltip] ทันที เพื่อให้ [empowered_child.GetSheHe] มีโอกาสพิสูจน์ [empowered_child.GetHerselfHimself] ว่ามีความสามารถเท่าเทียมกับคนอื่นๆ [empowered_child.GetHerHis]""
 fp3_clan.8005.a: "#EMP ไม่มีวัน#! ได้ยินไหม? และอย่ากล้าพูดเรื่องนี้อีก"
 fp3_clan.8005.b: "นี่มันไร้สาระ แต่ก็ได้..."
 fp3_clan.8005.d: "[empowered_child.GetSheHe|U] ยังเด็กเกินไปที่จะครองบรรดาศักดิ์!"
 fp3_clan.8005.e: "ข้าสัญญาว่า [empowered_child.GetSheHe] จะได้รับมรดกในเวลาอันควร"
 original_heir_upset_flavor: "ทายาทดั้งเดิมของบรรดาศักดิ์จะไม่พอใจหากท่านทำ เช่นนี้"
 fp3_clan.8005.e.success: "ท่าน ทำให้ [ambitious_consort.GetFirstNameNoTooltip] มั่นใจขึ้น"
 fp3_clan.8005.e.success.tt: "ท่าน ทำให้ [ambitious_consort.GetFirstNameNoTooltip] สงบลง"
 fp3_clan.8005.e.failure: "ท่านโน้มน้าว [ambitious_consort.GetHerHim] ไม่สำเร็จ"
 fp3_clan.8005.e.failure.tt: "[ambitious_consort.GetFirstNameNoTooltip] ไม่ไว้วางใจท่าน"
 fp3_empowered_child.tt: "ในอีกไม่กี่ปี หาก [empowered_child.GetFirstNameNoTooltip] ยังคงครองบรรดาศักดิ์นี้ [empowered_child.GetSheHe] จะได้รับการพัฒนา [skill|E] ขึ้นอยู่กับ [traits|E] ปัจจุบันของ [empowered_child.GetHerHis]"
 fp3_8007_studies_pay_off_toast: "[empowered_child.GetFirstName] แสดงให้เห็นแวว"

#Smaller Spies, by Ola Jentzsch
 fp3_clan.8006.t: "สายลับตัวน้อย"
 fp3_clan.8006.desc: "[paranoia_enthusiast.GetName] [paranoia_enthusiast.Custom('GetCouncilOrCourtPosition')] ของข้า ดูเหมือนจะให้ความสนใจเป็นพิเศษกับ [sneaky_child.GetFirstName] [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('sneaky_child'))] ของข้า ในช่วงหลังมานี้\n\n"[ROOT.Char.Custom('FormOfAddressForLiege')|U] สถานการณ์ในตระกูล [ROOT.Char.GetDynastyHouseNameNoTooltip] กำลังตึงเครียดขึ้นทุกวัน ญาติของท่านกำลังสมคบคิดต่อต้านท่านอยู่ตลอดเวลา" [paranoia_enthusiast.GetSheHe|U] กล่าว พลางสะกิดให้ [sneaky_child.GetFirstNameNoTooltip] ก้าวออกมา \n\n"แต่ข้าได้สร้างเครือข่ายผู้แจ้งข่าวรุ่นเยาว์ เพื่อช่วยให้ท่านได้เปรียบ เพราะสายลับตัวเล็ก ๆ ก็มีประโยชน์หลายอย่าง... แม้เด็กเหล่านั้นจะเป็นสามัญชน แต่ [sneaky_child.GetLadyLord] [sneaky_child.GetFirstNameNoTooltip] ผู้นี้ก็มีพรสวรรค์ที่น่าทึ่ง และสามารถเป็นประโยชน์ต่อท่านได้...""
 fp3_clan.8006.a: "[sneaky_child.Custom('GetDaughterSon')] ของข้าเป็นขุนนาง ไม่ใช่สายลับกระจอก!"
 fp3_clan.8006.b: "ไปเถิด เจ้าตัวน้อย คอยจับตาดูการทรยศในตระกูลของเรา..."
 fp3_clan.8006.c: "นี่ จ้างสายลับไป แต่อยู่ห่างจากครอบครัวข้า"

 #Bleeding Them Dry, by Ola Jentzsch
 fp3_clan.8008.t: "รีดเลือดจนแห้ง"
 fp3_clan.8008.desc: "ช่วงนี้ [ambitious_tax_collector.GetName] นักเก็บภาษีผู้ไร้ปรานีของข้า ใช้เวลาครุ่นคิดอย่างเงียบงัน แต่ดูเหมือนบางสิ่งจะบังเกิดผลในที่สุด เมื่อ [ambitious_tax_collector.GetSheHe] มาเข้าพบข้า\n\n"[ROOT.Char.Custom('FormOfAddressForLiege')|U] เหล่าข้าหลวงของท่านต่างยกเหตุผลสารพัด เพื่อที่จะไม่จ่ายภาษีมากเท่าที่ควร แต่ข้าเองก็สามารถสร้าง... #italic เหตุผล#!... ได้ เช่นกัน"\n\n[ambitious_tax_collector.GetSheHe|U] หยิบเอกสารเก่า ๆ ฉบับหนึ่งออกมา "โฉนดฉบับนี้แสดงให้เห็นว่า [beleaguered_clan_member.GetTitledFirstName] [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('beleaguered_clan_member'))] ของท่าน ติดค้างท่านมากกว่าที่คิดไว้ แต่ก่อน และข้าก็มีสำหรับขุนนางคนอื่น ๆ ของท่าน เช่นกัน...""
 fp3_clan.8008.a: "ยิ่งมากยิ่งดี!"
 fp3_clan.8008.b: "มุ่งเน้นไปที่ [beleaguered_clan_member.GetTitledFirstNameNoTooltip] ก่อน"
 fp3_clan.8008.c: "ข้าจะไม่ยอมให้ความโลภก่อให้เกิดความแตกแยกในตระกูลของข้า"
 unlock_extortion.tt: "ปลดล็อก [decision|E] [extort_subjects|E] เป็นเวลา 20 ปี"

 #Popular with the People, by Ola Jentzsch
 fp3_clan.8009.t: "เป็นที่นิยมในหมู่ประชาชน"
 fp3_clan.8009.desc: ""ยิ่งไปกว่านั้น [corrupt_mayor.GetName] เป็นผู้บริหารที่มีความสามารถทีเดียว และเป็นที่นิยมในหมู่ประชาชนทั้งในที่ดินของ[corrupt_mayor.GetHerHis]เองและทั่วทั้ง [fawazil_county.GetNameNoTier] อย่างไรก็ตาม [corrupt_mayor.GetSheHe] มีนิสัยชอบหักเงินจำนวนมากออกจากภาษีที่ [corrupt_mayor.GetSheHe] ส่งให้ท่านอย่างลับๆ ดังที่เราเห็นได้ชัดเจนในคอลัมน์บนซ้ายของรายได้ปีที่แล้ว"\n\nรายงานภาษีที่ครอบคลุมและละเอียดถี่ถ้วนของ [righteous_tax_collector.GetNamePossessive] จบลงด้วยการเปิดเผยความจริงที่น่าตกใจ"
 fp3_clan.8009.a: "ขโมยจากข้างั้นรึ? จับ [corrupt_mayor.GetHerHim] ตรึงกางเขนเสีย!"
 fp3_clan.8009.b: "กฎหมายอยู่ข้างเรา – ปลด [corrupt_mayor.GetHerHim] ออกซะ"
 fp3_clan.8009.c: "หึ [corrupt_mayor.GetTitleAsNameNoTooltip]? เรื่องเล็กน้อยเหมือน [ROOT.Char.Custom('GetRegionalFish')]"
 fp3_clan.8009.a.success: "ท่าน ทำให้ผู้ติดตามของ [corrupt_mayor.GetFirstNamePossessiveNoTooltip] หวาดกลัวจนยอมจำนน"
 fp3_clan.8009.a.failure: "ผู้คนโกรธแค้นมากกว่าหวาดกลัว"
 fp3_clan.8009.a.success.tt: "ความโหดร้ายของท่านได้รับรางวัลตอบแทน"
 fp3_clan.8009.a.failure.tt: "ความโหดร้ายของท่านเปล่าประโยชน์"
 fp3_clan.8009.a.eccentric: "กล้าดียังไง [corrupt_mayor.GetSheHe] มาข้ามหน้าข้า!"

 #More Magistrates, by Ola Jentzsch
 fp3_clan.8010.t: "เพิ่มผู้พิพากษา"
 fp3_clan.8010_muslim.t: "กอฎีผู้มีความสามารถ"
 fp3_clan.8010.desc_beginning: ""ข้าทำงานแบบนี้ไม่ได้" ผู้เก็บภาษีของข้า [competent_tax_collector.GetName] อุทานออกมาอย่างหงุดหงิดและท้อแท้\n\n"
 fp3_clan.8010_muslim_version: ""ศาล #italic ชะรีอะฮ์#! ทุกแห่งของ [ROOT.Char.GetPrimaryTitle.GetTierAsNameNoTooltip] เป็นรังแห่งความไร้ความสามารถอันน่าสังเวช ขัดขวางความพยายามทั้งหมดของข้า การประมูลภาษีที่ดีต้องการ #italic กอฎี#! ที่มีความสามารถ เพื่อควบคุมผู้มีอิทธิพลในท้องถิ่น เพื่อให้การปกครองของท่านยุติธรรมในสายพระเนตรของ [ROOT.Char.GetFaith.HighGodNameAlternate] และการอ้างสิทธิ์ในภาษีส่วนใหญ่ของท่านชอบธรรม\n\nท่านต้องให้ทุนแก่ข้าเพื่อจ้างคนเพิ่มและดีขึ้นสำหรับศาล และอำนาจในการไล่กอฎีเก่าที่ทุจริตออก""
 fp3_clan.8010_non_muslim_version: ""ศาลทุกแห่งของ [ROOT.Char.GetPrimaryTitle.GetTierAsNameNoTooltip] เป็นสถานที่อันน่าเศร้าที่ความโลภครอบงำประสิทธิภาพและความยุติธรรม ขัดขวางความพยายามทั้งหมดของข้า การประมูลภาษีที่ดีต้องการผู้พิพากษาที่มีความสามารถ เพื่อควบคุมผู้มีอิทธิพลในท้องถิ่น เพื่อ ทำให้การปกครองของท่านดูชอบธรรมและการอ้างสิทธิ์ในภาษีของท่านสมเหตุสมผล\n\nท่านต้องให้ทุนแก่ข้าเพื่อจ้างคนเพิ่มและดีขึ้นสำหรับศาล และอำนาจในการไล่คนโง่เง่าที่อยู่ในนั้นออกไป""
 fp3_clan.8010.a: "[ROOT.Char.Custom2('RelationToMe', SCOPE.sC('capable_magistrate_candidate'))] [capable_magistrate_candidate.GetFirstNameNoTooltip] ของข้ามีความสามารถ ท่านใช้ [capable_magistrate_candidate.GetHerHim] ไปก่อนได้"
 fp3_clan.8010.b: "แน่นอน ข้าจะจัดหาสิ่งที่ท่านต้องการให้"
 fp3_clan.8010.c: "ข้าดูเหมือนทำมาจากเงินรึ?"
 tax_farming_capable_courtier_flavor: "ท่านส่ง [capable_magistrate_candidate.GetFirstNameNoTooltip] ไปทำงานเป็นผู้พิพากษา"
 increase_aptitude.tt: "ตัวปรับ แต่งนี้อาจเพิ่ม [aptitude|E] ของ [competent_tax_collector.GetFirstNamePossessiveNoTooltip]"

 #A Proper Paymaster, by Ola Jentzsch
 fp3_clan.8011.t: "นายคลังที่เหมาะสม"
 fp3_clan.8011.desc: "ไม่เคยขาดความคิดเกี่ยวกับวิธีการปรับปรุงรายได้ของอาณาจักร [competent_tax_collector.GetName] เข้ามาหาข้าขณะที่ข้ากำลังตรวจแถวทหารตามปกติ\n\n"โอ้ [ROOT.Char.GetTitleTierName] ข้าสังเกตเห็นว่าในเขตปกครองส่วนตัวของท่าน ผู้มีอิทธิพลรายย่อยในท้องถิ่นพยายามหาผลประโยชน์ใส่ตัวอยู่เสมอโดยเบียดเบียนกองทหารของตน ข้าขอเสนอให้ท่านมอบอำนาจให้ข้าดูแลการจ่ายเงินเดือนทหาร แล้วข้าจะสามารถต่อสู้กับการทุจริต เพื่อให้แน่ใจว่ากองทัพของท่านได้รับทุนสนับสนุนอย่างมีประสิทธิภาพมากขึ้น"\n\n"อย่างไรก็ตาม ข้าคาดการณ์ว่า [concerned_marshal.GetTitledFirstName] จะไม่พอใจ เนื่องจากเรื่องทั้งหมดที่เกี่ยวกับทหารของท่านเคยเป็นขอบเขตอำนาจของ [concerned_marshal.GetHerHis] มาจนบัดนี้""
 fp3_clan.8011.a: "[concerned_marshal.GetSheHe|U] มีภาระ [concerned_marshal.GetHerHis] มากเกินไปอยู่แล้ว..."
 fp3_clan.8011.b: "พวกท่านสามารถแบ่งปันความรับผิดชอบนี้กันได้"
 fp3_clan.8011.c: "ไม่ ข้าจะคงทุกอย่างไว้ตามเดิม"
 fp3_clan.8011.b.success: "[competent_tax_collector.GetFirstNameNoTooltip] และ [concerned_marshal.GetFirstNameNoTooltip] ตกลงที่จะร่วมมือกันอย่างไม่เต็มใจ"
 fp3_clan.8011.b.failure: "พวกเขาทั้งคู่เกลียดชังการปฏิรูปนี้"
 fp3_clan.8011.b.success.tt: "ท่านเจรจาประนีประนอมได้สำเร็จ"
 fp3_clan.8011.b.failure.tt: "การประนีประนอมของท่านล้มเหลว"

 fp3_clan.8012.t: "ความโลภนำโชค"
 fp3_clan.8012.desc: ""บางครั้ง โชคลาภก็เกิดขึ้นได้ [ROOT.Char.Custom('FormOfAddressForLiege')]" [greedy_tax_collector.GetName] นักเก็บภาษีของข้า ถูมือของ [greedy_tax_collector.GetHerHis] ด้วยความพึงพอใจที่แทบเก็บไม่อยู่\n\n"ข้าบังเอิญพบพยานที่ยินดีให้การว่า [extorted_vassal.GetTitledFirstName] ติดค้างเงินท่านอยู่ก้อนโต จากภาษีที่ดินที่ถูก #italic หลงลืม#! ไปอย่างง่ายดาย ทั้งภาษีไม้ยืนต้นและกังหันน้ำ ข้าจึงถือวิสาสะเก็บมันมา\n\nทว่าผู้ติดตามของข้าคนหนึ่งประสบปัญหาในการคุ้มกันทองคำออกจาก [extorted_vassal.GetCapitalLocation.GetName] เนื่องจากถูกทหารยามท้องถิ่นก่อกวน ดังนั้นท่านอาจจะต้องจับตาดู [extorted_vassal.GetFirstNameNoTooltip] ไว้...""
 fp3_clan.8012.a: "ทำได้ดีมาก!"
 fp3_clan.8012.b: "มอบให้ [ROOT.Char.GetFaith.HouseOfWorship] เสีย แล้ว [extorted_vassal.GetSheHe] จะคัดค้านไม่ได้"
 fp3_clan.8012.c: "ข้าจะแสดงความใจกว้าง โดยมอบคืนให้ [extorted_vassal.GetHerHim] บางส่วนเป็นของขวัญ"

 fp3_clan.8013.t: "ภาระของการประมูลภาษี"
 fp3_clan.8013.desc: "ขณะที่ข้าเดินเล่นใน [ROOT.Char.Custom('ResidenceBuilding')] ข้าเดินผ่านห้องสมุด ที่ ซึ่งผู้เก็บภาษีของข้า [stressed_tax_collector.GetName] ดูเหมือนจะอยู่ในสภาพท้อแท้ใจอย่างยิ่ง\n\n"โอ้ [ROOT.Char.GetFaith.HighGodNameAlternate]" [stressed_tax_collector.GetSheHe] พึมพำกับ [stressed_tax_collector.GetHerselfHimself] "ข้าทำ เช่นนี้ไม่ได้ ตำรากฎหมายภาษีเหล่านี้เก่าเกินไป คลุมเครือเกินไป ไม่เป็นระเบียบเกินไป ข้าจะหาอะไรในนี้เจอได้อย่างไร?\n\nข้าเพียงต้องการตรวจสอบรายละเอียดเล็กน้อยก่อนจะมุ่งหน้าไปยังหัวเมืองอีกครั้ง..."
 fp3_clan.8013.a: "ใจเย็นๆ เรามาดูด้วยกันได้"
 fp3_clan.8013.b: "ทำงานของเจ้าซะ หรือข้าจะสั่งเฆี่ยนเจ้า!"
 fp3_clan.8013.c: "ข้าจะเดินต่อไป..."
 fp3_clan.8013.a.success: "ท่าน ทำให้ [stressed_tax_collector.GetFirstNameNoTooltip] มั่นใจขึ้น"
 fp3_clan.8013.a.failure: "[stressed_tax_collector.GetSheHe|U] ยังคงสิ้นหวังต่อไป"
 fp3_clan.8013.b.success: "ท่านขู่ให้ [stressed_tax_collector.GetFirstNameNoTooltip] ทำงานหนักขึ้นได้สำเร็จ"
 fp3_clan.8013.b.failure: "การข่มขู่ของท่านมีผลเพียงเล็กน้อย"
 fp3_clan.8013.a.success.tt: "[stressed_tax_collector.GetFirstNameNoTooltip] มีสมาธิใหม่"
 fp3_clan.8013.a.failure.tt: "[stressed_tax_collector.GetFirstNameNoTooltip] ประมาทเลินเล่อมากขึ้น"
 fp3_clan.8013.b.success.tt: "[stressed_tax_collector.GetFirstNameNoTooltip] กลัวท่าน"
 fp3_clan.8013.b.failure.tt: "[stressed_tax_collector.GetFirstNameNoTooltip] มองทะลุคำขู่ของท่าน"

 fp3_clan.8015.t: "ทายาทอื้อฉาว"
 fp3_clan.8015.desc: "[concerned_parent.GetName] เข้ามาในโถงของข้า ลาก [scandalous_scion.Custom('GetDaughterSon')] [scandalous_scion.GetFirstName] ของ [concerned_parent.GetHerHis] มาด้วย ซึ่งดูไม่ค่อยมีความสุขนัก\n\n"[ROOT.Char.GetTitleTierName] ของข้า" [concerned_parent.GetFirstNameNoTooltip] กล่าว "ท่านอาจเคยได้ยินว่า [scandalous_scion.Custom('GetDaughterSon')] ของข้าคนนี้ประพฤติตัวอย่างไร - คบค้าสมาคมในสโมสร #EMP ฟูตูวา#! กับนักรบพเนจรที่รวมตัวกันที่นั่น ดื่มเหล้ากับพวกเขาในโรงเตี๊ยมที่น่าสงสัย และเที่ยวเตร่ไปทั่วเมือง" [concerned_parent.GetSheHe|U] ถอนหายใจลึกๆ\n\n"เราต้องปกป้องชื่อเสียง [scandalous_scion.GetHerHis] เกรงว่าเรื่องนี้จะกลายเป็นเรื่องอื้อฉาวในที่สาธารณะ ข้ากำลังคิดว่า [scandalous_scion.GetSheHe] สามารถอยู่ที่นี่ เพื่อเรียนรู้มารยาทที่ราชสำนักของท่าน""
 fp3_clan.8015.a: "ก็ได้ [scandalous_scion.GetSheHe] สามารถเข้าร่วมราชสำนักของข้าได้"
 fp3_clan.8015.b: "[scandalous_scion.GetSheHe|U] เป็นผลผลิตจากเอวเจ้า ไม่ใช่ของข้า"

 fp3_clan.8016.t: "ความวุ่นวายในโรงอาบน้ำ"
 fp3_clan.8016.opening_desc: "ขณะที่ข้ากำลังอาบน้ำผ่อนคลายกับ [chaplain.GetFirstName] [chaplain.GetCouncilTitle] ของข้า [chaplain.GetSheHe] ก็พลันหยิบยกเรื่องที่จริงจังกว่าขึ้นมา\n\n"[ROOT.Char.Custom('FormOfAddressForLiege')|U]" [chaplain.GetSheHe] กระซิบ "เมื่อคืนนี้ [scandalous_clan_member.GetName] มาที่โรงอาบน้ำ พร้อมกับผู้ติดตามที่เป็นเหล่าอันธพาลไว้หนวดเครารุงรัง""
fp3_clan.8016.deviant_desc: "พวกนอกรีต และลาหนึ่งตัว"
fp3_clan.8016.drunkard_desc: "พวกขี้เมา และพวกเสเพล"
fp3_clan.8016.rakish_desc: "หญิงงามเมือง และคนเสื่อมทราม"
fp3_clan.8016.hashishiyah_desc: "และอันธพาลติดยา"
fp3_clan.8016.ending_desc: "จากนั้นพวกเขาก็กระทำการที่ข้าแทบไม่อาจบรรยายได้ และไม่ยอมถูกขับไล่ออกจากสถานที่ และนี่ห่างไกลจากความผิดครั้งแรกของ [scandalous_clan_member.GetFirstNamePossessiveNoTooltip] เสียด้วยซ้ำ" [chaplain.GetFirstNameNoTooltip] หยุดพูด ดูวิตกกังวล\n\n"ท่านควรประณาม [scandalous_clan_member.GetHerHim] ก่อนที่รสนิยมของ [scandalous_clan_member.GetHerHis] จะกลายเป็นรอยด่างพร้อยต่อทั้งตระกูล""
fp3_clan.8016.a: "ก็ได้ ข้าจะตำหนิเขา"
fp3_clan.8016.b: "ไม่ ข้ายืนหยัดเคียงข้างสมาชิกในครอบครัว ไม่ว่าพวกเขาจะทำกิจกรรมผ่อนคลายแบบใดก็ตาม"

fp3_clan.8017.t: "ตำแหน่งที่น่าสงสัย"
fp3_clan.8017.opening_desc: ""[tax_collector.GetName] รับตำแหน่งผู้เก็บภาษีของท่านในดินแดนของข้ามาสักพักแล้ว และทำงานได้ดีพอใช้ แต่ [tax_collector.GetSheHe] ก็เริ่มทำหน้าที่เป็นผู้ดูแลศีลธรรมสาธารณะด้วย"\n[unclan_taxpayer.GetTitledFirstName] ดูวิตกกังวล และอาจจะรู้สึกผิดเล็กน้อย\n\n"
fp3_clan.8017.overly_eager.desc: ""[tax_collector.GetSheHe|U] ขยันขันแข็งเกินไป เฆี่ยนตีไพร่ฟ้าสำหรับการละเมิดเพียงเล็กน้อย - ตั้งแต่การเมาอาละวาดที่ไม่เป็นอันตราย ไปจนถึงการเล่นดนตรีตามท้องถนน หรือการที่ชายหญิงปะปนกันชั่วครู่ในโรงอาบน้ำ...""
fp3_clan.8017.corrupt.desc: "อนิจจา ดูเหมือนว่า [tax_collector.GetSheHe] จะไม่เที่ยงธรรมและไม่ยุติธรรม โดยรับเงินสินบนเป็นการตอบแทนที่ทำเป็นมองไม่เห็น"
fp3_clan.8017.cruel.desc: "ข้าเกรงว่า [tax_collector.GetSheHe] จะโหดร้ายทารุณ กระตือรือร้นที่จะใช้การเฆี่ยนตี หรือแม้แต่การขว้างหินจนตายเป็นการลงโทษสำหรับอาชญากรรมเพียงเล็กน้อย"
fp3_clan.8017.generic.desc: "การกระตือรือร้น ไม่ใช่การทุจริต หรือความโหดร้าย ไม่ใช่ความชั่วร้าย แต่ชาวบ้านเกลียดชัง [tax_collector.GetHerHim]""
fp3_clan.8017.ending.desc: "\n\n"ได้โปรด ข้ารู้ว่า [tax_collector.GetSheHe] เป็น [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('tax_collector'))] ของท่าน แต่ท่านต้องบอกให้ [tax_collector.GetHerHim] หยุด""
fp3_clan.8017.a: "[tax_collector.GetSheHe|U] กำลังทำงานของ [ROOT.Char.GetFaith.HighGodNameAlternatePossessive]"
fp3_clan.8017.b: "ท่านกลัวว่า [tax_collector.GetNameNoTooltip] จะค้นพบอะไรกันแน่?"
fp3_clan.8017.c: "ก็ได้ แต่อย่าลืมบุญคุณครั้งนี้"
fp3_clan.8017.d: "พวกท่านต้องแก้ไขปัญหานี้กันเอง"
fp3_clan_protect_kinsman_flavor: "ท่านปกป้อง [tax_collector.GetNameNoTooltip] จากข้อกล่าวหาเหล่านี้"
fp3_clan_accuse_accuser_flavor: "การข่มขู่ [unclan_taxpayer.GetTitledFirstNameNoTooltip] จะ ทำให้ [unclan_taxpayer.GetHerHim] พิจารณาคำขอของ [unclan_taxpayer.GetHerHis] ใหม่"

 fp3_clan.3000.t: "ทิวลิปที่ถูกทำลาย"
 fp3_clan.3000.desc: "วันนี้ อากาศที่น่ารื่นรมย์ได้เชิญชวนข้าให้ออกมาในสวน\nดอกไม้ที่สวยงามที่สุดใน [fp3_clan_3000_loc_loc.GetNameNoTooltip] หลายแถวถูกปลูกไว้อย่างพิถีพิถันที่นี่เพื่อความเพลิดเพลินส่วนตัวของข้า\n\nอย่างไรก็ตาม ความเพลิดเพลินของข้าก็ถูกขัดจังหวะเมื่อข้ามาเยี่ยมชมดอกทิวลิปอันล้ำค่าของข้า [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('fp3_clan_3000_bad_child'))] [fp3_clan_3000_bad_child.GetFirstName] ของข้าได้เด็ดดอกทิวลิปที่สวยงามออกจากที่ของมันอย่างไร้ความปรานีเพื่อมอบให้กับ [SCOPE.sC('fp3_clan_3000_bad_child').Custom2('RelationToMeShort', SCOPE.sC('fp3_clan_3000_random_family_member'))] ของ [fp3_clan_3000_bad_child.GetHerHis] เป็นของขวัญ "ดูสิ ข้าเจอ ดอกไม้สวยๆ ข้าคิดว่า [fp3_clan_3000_random_family_member.GetFirstName] จะต้องชอบแน่ๆ!""
 fp3_clan.3000.a: "น่ารักน่าเอ็นดูจริงๆ [SCOPE.sC('fp3_clan_3000_bad_child').Custom2('RelationToMeShort', SCOPE.sC('fp3_clan_3000_random_family_member'))] ของเจ้าจะต้องชอบแน่!"
 fp3_clan.3000.b: "ออกไปจากสวนข้า! #italic เอาคืนมานะ!!#!"
 fp3_clan.3000.c: "แล้วถ้าเราปลูกชุดต่อไปด้วยกันล่ะ?"
 fp3_clan.3000.c.flavor: "ท่านใช้โอกาสนี้สอน [fp3_clan_3000_bad_child.GetFirstNameNoTooltip] ถึงความสุขของการทำสวน"
 fp3_clan.3000.d: "พอแล้ว. #italic ข้าจะจับเจ้าทำปุ๋ยซะเลย.#!"

