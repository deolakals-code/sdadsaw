l_english: 
 ###################################
 # Regiments
 ###################################
 asawira: "อัศวิรา"
 asawira_flavor: "#F กองทัพอัศวิราประกอบด้วยขุนนางอิหร่านผู้ชำนาญทั้งทวนและธนู บัดนี้ได้รับการฟื้นฟูเป็นกองกำลังทหาร พวกเขาพร้อมที่จะโจมตีศัตรูของเปอร์เซียแล้ว#! "

 tarkhan: "ทาร์ข่าน"
 tarkhan_flavor: "#F ทหารม้าชั้นยอดแห่งทุ่งหญ้าสเตปป์ การผสมผสานระหว่างทวน กระบอง และธนูของทาร์ข่านสามารถทำลายการป้องกันเกือบทุกชนิดได้#! "

 zupin_warrior: "พลหอกซูปิน"
 zupin_warrior_flavor: "#F นักรบเดย์ลาไมต์เหล่านี้เป็นกองกำลังที่มีความยืดหยุ่นสูง สามารถตั้งกำแพงโล่อันแข็งแกร่งและกระจายกำลังออกไปขว้างหอกสั้นใส่ศัตรูได้อย่างเท่าเทียมกัน#! "

 tawashi: "ทาวาชี"
 tawashi_flavor: "#F กองทหารม้าที่ยืดหยุ่นนี้ผสมผสานดาบ หอก และธนูเข้าด้วยกันเพื่อปกป้องบ้านเกิดบนภูเขาของตนจากผู้บุกรุก#! "

 ###################################
 # Court Positions
 ###################################
 master_assassin_court_position: "ปรมาจารย์นักฆ่า"
 master_assassin_court_position_desc: "ด้วยพันธะทางศรัทธาหรือความเชื่อ ปรมาจารย์นักฆ่าช่วยเหลือเจ้าเหนือหัวของตนด้วยวิธีการที่ไม่เป็นแบบแผนในการทำสงคราม การจารกรรม การสร้างความหวาดกลัว และการสังหาร"
 
 has_no_particular_noble_roots_trigger: "เป็น[lowborn|E]หรือมาจาก[dynasty|E]ที่ไม่สำคัญ"

 court_scholar_court_position: "บัณฑิตราชสำนัก"
 court_scholar_court_position_desc: "ในฐานะตัวแทนองค์ความรู้ทางปัญญาแห่งอาณาจักร บัณฑิตราชสำนักช่วยในการค้นพบ[innovations|E]ในอนาคต"

 ###################################
 # Buildings
 ###################################
 building_type_sar_i_sang_mines_01: "เหมืองซาร์-อิ-ซัง"
 building_type_sar_i_sang_mines_01_desc: "แหล่งแร่ลาพิสลาซูลีหลักของโลก เหมืองซาร์-อิ-ซังเปิดดำเนินการมาตั้งแต่สมัยก่อนประวัติศาสตร์ และหินสีน้ำเงินของพวกเขาสามารถพบเห็นได้ในราชสำนักทุกแห่งในสมัยโบราณ คนงานท้องถิ่นทำงานหนักที่นี่ทั้งกลางวันและกลางคืนเพื่อสกัดหินสีน้ำเงินอันล้ำค่า"
 building_sar_i_sang_mines_01: "เหมืองโบราณซาร์-อิ-ซัง"
 building_sar_i_sang_mines_01_desc: "$building_type_sar_i_sang_mines_01_desc$"
 building_sar_i_sang_mines_02: "เหมืองซาร์-อิ-ซังที่บูรณะแล้ว"
 building_sar_i_sang_mines_02_desc: "อุโมงค์โบราณได้รับการขยายและเสริมความมั่นคง และได้นำวิศวกรเข้ามาเปิดปล่องใหม่และสร้างความเป็นไปได้ใหม่ๆ"
 building_sar_i_sang_mines_03: "เหมืองซาร์-อิ-ซังที่ขยายแล้ว"
 building_sar_i_sang_mines_03_desc: "เมื่อการทำเหมืองเติบโตขึ้น ตัวเหมืองก็ เช่นกัน มีการสร้างทางเข้าเพิ่มขึ้น และปล่องโบราณก็ลึกลงไปเรื่อยๆ"
 building_sar_i_sang_mines_04: "ศูนย์เหมืองซาร์-อิ-ซัง"
 building_sar_i_sang_mines_04_desc: "การสกัดหินลาพิสลาซูลีได้มาถึงระดับใกล้เคียงอุตสาหกรรมแล้ว โดยมีจำนวนคนงานหลายพันคน ภูเขาโบราณที่เคยห่างไกลแห่งนี้ บัดนี้กลายเป็นศูนย์กลางของเศรษฐกิจที่คึกคัก"

