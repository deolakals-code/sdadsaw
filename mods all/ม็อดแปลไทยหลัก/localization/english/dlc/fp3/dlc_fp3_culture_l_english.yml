 # Turko-Iranian
 tradition_fp3_frontier_warriors_name: "นักรบชายแดน"
 tradition_fp3_frontier_warriors_desc: "วัฒนธรรมนี้อยู่ในการต่อสู้อย่างต่อเนื่องเพื่อควบคุมชายแดนอันป่าเถื่อน โดยใช้ส่วนผสมที่ผันผวนของทหารชั้นยอด ทหารรับจ้างชนเผ่า และอาสาสมัครผู้คลั่งไคล้"

 tradition_fp3_irrigation_experts_name: "ผู้เชี่ยวชาญการชลประทาน"
 tradition_fp3_irrigation_experts_desc: "วัฒนธรรมนี้เป็นผู้เชี่ยวชาญด้านเทคโนโลยีน้ำ และด้วยความเฉลียวฉลาดและความพยายามร่วมกัน พวกเขาสามารถ ทำให้แม้ แต่ทะเลทรายที่โหดร้ายที่สุดก็เบ่งบานได้"

 tradition_fp3_beacon_of_learning_name: "ประทีปแห่งการเรียนรู้"
 tradition_fp3_beacon_of_learning_desc: "ศูนย์รวมของความรู้กรีก อินเดีย และอาหรับ วัฒนธรรมนี้ภาคภูมิใจในความก้าวหน้าทางวิทยาศาสตร์"
 culture_parameter_can_appoint_court_scholar:0 "สามารถ แต่งตั้งตำแหน่ง[court_position|E] #high $court_scholar_court_position$#! ได้"
 culture_parameter_guardian_education_better_outcomes: "[guardians|E]ของวัฒนธรรมนี้มีแนวโน้มที่จะให้[education_traits|E]ที่ดีกว่าแก่[wards|E]ของตน"

 tradition_fp3_jirga_name: "จีร์กา"
 tradition_fp3_jirga_desc: "ผู้อาวุโสและผู้นำของวัฒนธรรมนี้สามารถจัดการประชุมเพื่อแก้ไขข้อพิพาทตามประมวลกฎหมายชนเผ่าโบราณของตน - และสถาปนากษัตริย์แห่งแผ่นดิน"

 tradition_fp3_pragmatic_creed_name: "หลักปฏิบัตินิยม"
 tradition_fp3_pragmatic_creed_desc: "นักรบของวัฒนธรรมนี้ไม่ยึดติดกับความโอ่อ่า และเน้นคุณค่าและความสามารถในการปรับตัวของทหารสามัญ โดยลดความสำคัญของทหารม้าชั้นสูงตามแบบแผน"

 tradition_fp3_fierce_independence_name: "เอกราชอันดุเดือด"
 tradition_fp3_fierce_independence_desc: "ตลอดหลายปีที่ผ่านมา ทรราชมากมายพยายามที่จะกำจัดวัฒนธรรมนี้ แต่ด้วยความทรหดและความสำเร็จทางทหาร มันจึงอยู่รอดมาได้"

 not_of_central_asian_heritage_desc: "[culture|E]ไม่ได้มี[heritage|E]เป็นอิหร่าน, โทคาเรียน, เติร์ก หรือมองโกล"
