 fp3_antagonize_character_interaction.success_notif.discovered:0 "[secondary_recipient.GetTitledFirstNameNoTooltip] รู้แล้ว!"
 fp3_antagonize_character_interaction.success_notif.discovered.tooltip:0 "[secondary_recipient.GetTitledFirstName] สืบสาวข่าวลือกลับมาถึงท่าน!"
 fp3_antagonize_character_interaction.success_notif.positive.desc:0 "ข่าวลืออันน่ายินดีเกี่ยวกับท่านได้แพร่สะพัดออกไป ทำให้ [secondary_recipient.Custom2('RelationToMe', SCOPE.sC('recipient'))] [recipient.GetTitledFirstName] ของท่านคิดดีกับท่านมากขึ้น\n"
 fp3_antagonize_character_interaction.success_notif.positive.desc.alt:0 "[actor.GetTitledFirstName] ได้ปล่อยข่าวลืออันน่ายินดีเกี่ยวกับท่าน ทำให้ [secondary_recipient.Custom2('RelationToMe', SCOPE.sC('recipient'))] [recipient.GetTitledFirstName] ของท่านคิดดีกับท่านมากขึ้น\n"
 fp3_antagonize_character_interaction.success_notif.negative.desc:0 "ข่าวลืออันไม่น่าพอใจและคำโกหกแพร่สะพัดไปทั่ว [secondary_recipient.Custom2('RelationToMe', SCOPE.sC('recipient'))] [recipient.GetTitledFirstName] ของท่านหลงเชื่อและเริ่มคิดไม่ดีกับท่าน!\n"
 fp3_antagonize_character_interaction.success_notif.negative.desc.alt:0 "[actor.GetTitledFirstName] ได้ปล่อยคำโกหกอันน่าตกตะลึงเกี่ยวกับท่าน ทำให้ [secondary_recipient.Custom2('RelationToMe', SCOPE.sC('recipient'))] [recipient.GetTitledFirstName] ของท่านคิดไม่ดีกับท่าน!\n"
 fp3_antagonize_character_interaction.success_notif.negative.desc.alt.alt:0 "ข่าวลือไม่ได้ถูกสืบสาวกลับมาถึงท่าน..."
 fp3_antagonize_character_interaction.success_tooltip.positive:0 "เชื่อท่านและ #P ได้รับ#! [opinion|E] ต่อ [secondary_recipient.GetTitledFirstName]"
 fp3_antagonize_character_interaction.success_tooltip.negative:0 "เชื่อท่านและ #N สูญเสีย#! [opinion|E] ต่อ [secondary_recipient.GetTitledFirstName]"
 fp3_antagonize_character_interaction.success_tooltip.positive.past:0 "[recipient.GetTitledFirstName] #P ได้รับ#! [opinion|E] ต่อท่าน"
 fp3_antagonize_character_interaction.success_tooltip.negative.past:0 "[recipient.GetTitledFirstName] #N สูญเสีย#! [opinion|E] ต่อท่าน"
 fp3_antagonize_character_interaction.recipient_message.fallback: "ท่านควรรู้ไว้นะว่า [secondary_recipient.GetTitledFirstName] คือ [secondary_recipient.Custom2('InsultNoun', SCOPE.sC('secondary_recipient'))] และควรได้รับการปฏิบัติ เช่นนั้น ท่านไม่เห็นด้วยหรือ?"
 fp3_antagonize_character_interaction.recipient_message.01:0 "ท่านควรรู้ไว้ว่าเจ้าเหนือหัวของท่านเอง [secondary_recipient.GetTitledFirstName] กำลังวางแผนต่อต้านท่านลับหลัง ท่านควรระวังความสัมพันธ์ของท่านกับเจ้าคนเจ้าเล่ห์นั่น!"
 fp3_antagonize_character_interaction.recipient_message.02:0 "ข้ามีเหตุผลให้เชื่อว่าเจ้าเหนือหัวของท่านเอง [secondary_recipient.GetTitledFirstName] กำลังวางแผนสังหารท่าน! จงระวัง [secondary_recipient.GetHerHim] ไว้ แม้ว่าพวกเขาจะดูเป็นมิตรเพียงใดก็ตาม!"
 fp3_antagonize_character_interaction.recipient_message.03:0 "ข่าวในหมู่ข้าราชสำนักของข้าคือเจ้าเหนือหัวของท่าน [secondary_recipient.GetTitledFirstName] กำลังจับตาดูท่านอย่าง #italic ใกล้ชิดมาก#! โดยที่ท่านไม่รู้ตัว ข้าไม่แน่ใจว่าเจตนาของ [secondary_recipient.GetHerHis] คืออะไร แต่ข้าจะระวังตัวเมื่ออยู่ใกล้ [secondary_recipient.GetHerHim]"
 fp3_antagonize_character_interaction.recipient_message.04:0 "[recipient.Custom2('RelationToMe', SCOPE.sC('secondary_recipient'))] ของท่าน [secondary_recipient.GetTitledFirstName] เพิ่งทำตัวขายหน้าและ ทำให้ชื่อเสียงอันดีงามของตระกูล [recipient.GetHouse.GetBaseNameNoTooltip] เสื่อมเสียในหมู่ราษฎร"
 fp3_antagonize_character_interaction.recipient_message.05:0 "ข้าคิดว่าจะแจ้งให้ท่านทราบว่าเจ้าเหนือหัวของท่าน [secondary_recipient.GetTitledFirstName] เป็นหุ่นเชิดของข้าราชสำนักของ [secondary_recipient.GetHerHis] เอง! ทุกครั้งที่ [secondary_recipient.GetSheHe] เพิกเฉยต่อคำแนะนำของท่าน นั่นเป็น เพราะคำสั่งของพวกไพร่ชั้นต่ำ!"
 fp3_antagonize_character_interaction.recipient_message.06:0 "ท่านควรรู้ไว้ว่า [recipient.Custom2('RelationToMe', SCOPE.sC('secondary_recipient'))] ของท่าน [secondary_recipient.GetTitledFirstName] ได้ถามคำถามที่ #italic อันตราย#! บางอย่างเกี่ยวกับตระกูล [recipient.GetHouse.GetBaseNameNoTooltip]... จงจำคำเตือนนี้ไว้ แต่อย่าบอกใครว่าข้าแจ้งเรื่องนี้ให้ท่านทราบ!"
 fp3_antagonize_character_interaction.recipient_message.07:0 "[recipient.Custom2('RelationToMe', SCOPE.sC('secondary_recipient'))] ของท่าน [secondary_recipient.GetTitledFirstName] กำลังพยายาม ทำให้ชื่อเสียงอันดีงามของตระกูล [recipient.GetHouse.GetBaseNameNoTooltip] เสื่อมเสียโดยอ้างลับหลังท่านว่าท่านขโมยวัวควาย!"
 fp3_antagonize_character_interaction.recipient_message.08:0 "[recipient.Custom2('RelationToMe', SCOPE.sC('secondary_recipient'))] ของท่าน [secondary_recipient.GetTitledFirstName] ไม่หยุดส่งจดหมายมายังราชสำนักของข้าเพื่อประกาศ "ความเหนือกว่า" ของตระกูล [recipient.GetHouse.GetBaseNameNoTooltip] ได้โปรดทำอะไรสักอย่างกับเรื่องนี้!"
 fp3_antagonize_character_interaction.recipient_message.09:0 "[secondary_recipient.GetTitledFirstName] ได้ปล่อยข่าวลือแย่ๆ เกี่ยวกับท่าน แล้วอ้างว่า "เป็นการล้อเล่น" เมื่อถูกจับได้! คนที่ปล่อยข่าวลือนั้นแย่มาก และพวกเขาก็ ทำให้ชื่อเสียงของท่านเสื่อมเสีย!"
 fp3_antagonize_character_interaction.recipient_message.10:0 "[recipient.Custom2('RelationToMe', SCOPE.sC('secondary_recipient'))] ของท่าน [secondary_recipient.GetTitledFirstName] ถูกจับได้ว่ากินอาหารจากพื้นราวกับเป็นสุนัข! ในความเห็นอันต่ำต้อยที่สุดของข้า ท่านควรปฏิบัติต่อพวกเขา เช่นนั้น!"
 fp3_antagonize_character_interaction.recipient_message.11:0 "ขอให้ทราบโดยทั่วกันว่า [recipient.Custom2('RelationToMe', SCOPE.sC('secondary_recipient'))] [secondary_recipient.GetTitledFirstName] เพิ่งเอาชนะนักฆ่าติดอาวุธสิบสองคนด้วยตัวคนเดียว [secondary_recipient.GetSheHe|U] ไม่ได้บอกใครเกี่ยวกับเรื่องนี้ —เพื่อไม่ให้ราชสำนักกังวล แต่ข้าคิดว่าจะแจ้งให้ท่านทราบถึงความสำเร็จอันยิ่งใหญ่นี้ เพื่อให้วีรกรรมของ [secondary_recipient.GetHerHis] ไม่ถูกมองข้าม!"
 fp3_antagonize_character_interaction.recipient_message.12:0 "ท่านโชคดีที่มี [recipient.Custom2('RelationToMe', SCOPE.sC('secondary_recipient'))] ที่ดี เช่น [secondary_recipient.GetTitledFirstName] ข้าได้ยินมาว่า [secondary_recipient.GetSheHe] เพิ่งคืนทองคำจำนวนมหาศาลให้กับข้าในบังคับคนหนึ่งของ [secondary_recipient.GetHerHis] เมื่อได้ยินว่าเสนาบดีคลังคำนวณผิดพลาดเกี่ยวกับสิ่งที่ต้องชำระ!"
 fp3_antagonize_character_interaction.recipient_message.13:0 "ท่านมี [recipient.Custom2('RelationToMe', SCOPE.sC('secondary_recipient'))] ที่ใจดีที่สุด [secondary_recipient.GetTitledFirstName] เพิ่งพบกับสมาชิกคนอื่นของ [house|E] [secondary_recipient.GetHouse.GetBaseName] และช่วยพวกเขาแก้ไขข้อพิพาทที่อาจทำลายชื่อเสียงของ [secondary_recipient.GetFirstName] หากทำผิดพลาด"
 fp3_antagonize_character_interaction.recipient_message.14:0 "[recipient.Custom2('RelationToMe', SCOPE.sC('secondary_recipient'))] ของท่าน [secondary_recipient.GetTitledFirstName] ช่างไม่เหมือนใครอย่างแท้จริง —ข้าไม่เคยเห็นใครเต็มใจปกป้อง [house|E] ของตนเท่า [secondary_recipient.GetHerHim] มาก่อน ท่านได้รับพรอย่างยิ่งที่มี [recipient.Custom2('RelationToMe', SCOPE.sC('secondary_recipient'))] ที่น่าเชื่อถือ"
 fp3_antagonize_character_interaction.recipient_message.15:0 "[secondary_recipient.GetTitledFirstName] เป็นบุคคลที่ยอดเยี่ยม ท่านเคยพิจารณาประเมินความคิดของท่านเกี่ยวกับ [secondary_recipient.GetHerHim] ใหม่หรือไม่?"

