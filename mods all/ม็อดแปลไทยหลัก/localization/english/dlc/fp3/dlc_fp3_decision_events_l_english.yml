l_english: 
 ##################################################
 # STRUGGLE EVENTS 
 ##################################################
 fp3_struggle.0051.t: "ช่วงว่างเว้นอิหร่าน"
 fp3_struggle.0051.desc: "ความขัดแย้งกลางเมืองอันนองเลือดเข้าพัวพัน [Mostaza.GetPrimaryTitle.GetBaseName] อันเคยไร้เทียมทาน: ตระกูลผู้ปกครองสังหารและทำสงครามกันเอง แข่งขันกันเพื่อชิงตำแหน่ง [GetFaithByKey('ashari').ReligiousHeadTitleName|U] อิรักระส่ำระสาย ขณะที่พ้นเทือกเขาทางตะวันออกไป เหล่าขุนนางชายแดนเปอร์เซียฉวยโอกาสจากสถานการณ์เพื่อยืนยันอิสรภาพของตน สร้างจักรวรรดิของตนเองขึ้นจากซากปรักหักพังของแบกแดด\n\n"
 fp3_struggle.0051.desc.caliph: "เบื้องหลังข้าคือเหล่าภูตผีซีดเซียวเรียงราย; เหล่า [Mostaza.GetTitleTierName] [Mutawakkil.GetFirstName], [Muntasir.GetFirstName], และ [Mustain.GetFirstName] — ล้วนเป็นเหยื่อของ [struggle|E] นี้ ชาวเปอร์เซียผู้ก่อกบฏและชาวเติร์กผู้ทรยศต่างกระหายที่จะเห็นข้าเข้าร่วมกับวิญญาณของบรรพบุรุษ แต่ข้ายังสามารถพลิกสถานการณ์ได้!"
 fp3_struggle.0051.desc.involved: "นี่คือเวลาที่ตระกูล [ROOT.Char.GetHouse.GetNameNoTooltip] จะต้องลงมือและผงาดขึ้นสู่ความรุ่งโรจน์ — เราจะเป็นผู้กอบกู้กาหลิบ หรือจะทำลายความฝันแห่งอุมมะฮ์ที่เป็นหนึ่งเดียวให้สิ้นซากไปตลอดกาล?"
 fp3_struggle.0051.desc.interloper: "เมื่อ [Mostaza.GetTitleAsNameNoTooltip] สามองค์สุดท้ายต้องพบจุดจบอย่างรวดเร็วและไม่คาดฝัน ทุกคนต่างคาดว่า [Mostaza.GetFirstName] จะตามไป ในความวุ่นวายและความไม่แน่นอนนี้ โอกาสมีอยู่มากมายสำหรับตระกูล [ROOT.Char.GetHouse.GetNameNoTooltip]..."
 fp3_struggle.0051.desc.supporter: "ไม่เคยมีความจำเป็น เช่นนี้มาก่อนสำหรับความภักดีและความขยันหมั่นเพียรเพื่อสร้างเสถียรภาพของตระกูล [ROOT.Char.GetHouse.GetNameNoTooltip] นี่คือเวลาของเราที่จะแสวงหาความรุ่งโรจน์ กอบกู้กาหลิบ และกลายเป็นผู้ชนะที่แท้จริงของอุดมการณ์ [ROOT.Char.GetFaith.GetAdjective]!"
 fp3_struggle.0051.desc.detractor: "เมื่อเหล่าผู้นำแห่งอิสลามติดอยู่ในวิกฤตการณ์ไม่สิ้นสุด นี่คือโอกาสที่ไม่เหมือนใครสำหรับตระกูล [ROOT.Char.GetHouse.GetNameNoTooltip] ที่จะกลายเป็นนายแห่งโชคชะตาของตนเอง และจารึกชื่อของเราไว้ในพงศาวดารแห่งประวัติศาสตร์"
 fp3_struggle.0051.desc.unrest: "$fp3_struggle.0051.desc$"
 fp3_struggle.0051.desc.stabilization: "หลังจากช่วงเวลาแห่งวิกฤต [Mostaza.GetPrimaryTitle.GetName] กำลังฟื้นตัว การต่อสู้อันนองเลือดค่อยๆ บรรเทาลงในเปอร์เซีย"
 fp3_struggle.0051.desc.stabilization_actor: "ตระกูล [ROOT.Char.GetHouse.GetNameNoTooltip] ต้องดำเนินไปอย่างระมัดระวัง ณ ที่นี้ เราสามารถใช้สถานการณ์นี้เพื่อวางรากฐานสำหรับอนาคตที่รุ่งเรือง — หรือหว่านความโกลาหลและความขัดแย้งใหม่ที่อาจ ทำให้เราไต่เต้าไปสู่จุดสูงสุดยิ่งกว่าเดิม..."
 fp3_struggle.0051.a:0 "ขอ [ROOT.Char.GetFaith.HighGodName] สถิตอยู่กับข้า!"
 fp3_struggle.0051.b:0 "ความทะเยอทะยานอันโง่เขลาเหล่านี้ต้องถูกกำราบ!"

 fp3_struggle.0071.t: "[struggle_liege.GetFirstNameNoTooltip|U] ยืนยันอำนาจอีกครั้ง"
 fp3_struggle.0071.desc.caliph: "การต่อสู้สิ้นสุดลงแล้ว! ไม่ว่าจะด้วยชัยชนะในสงคราม การทูตอันเชี่ยวชาญ หรืออำนาจอันมีมา แต่กำเนิดในตำแหน่งของข้า เหล่าคนทรยศและกบฏได้เปลี่ยนท่าทีแล้ว บัดนี้ พวกเขากำลังแย่งกันสาบานตนครั้งใหม่ต่อหน้าบัลลังก์ข้า เบียดเสียดกันเพื่อโค้งคำนับให้ลึกที่สุดและยืนยันศรัทธาของพวกเขาใน [ROOT.Char.GetTitleTierName] ผู้ชี้นำอย่างถูกต้องและชอบธรรม\n\nเหล่าขุนนางเปอร์เซียผู้ก่อกบฏได้ให้คำมั่นยอมจำนนและสำนึกผิดในความเขลาของตน หรือถูกแทนที่ด้วยข้าหลวงชาว [ROOT.Char.GetCulture.GetName] ผู้ภักดีและเคร่งศาสนา ข้าได้พิชิตเปอร์เซียสำเร็จตามที่กาหลิบรอชิดีนได้เริ่มไว้เมื่อสองศตวรรษก่อน เพื่อความรุ่งโรจน์อันเป็นนิรันดร์ของ [ROOT.Char.GetFaith.GetReligion.GetNameNoTooltip]"
 fp3_struggle.0071.desc.supporter: "ด้วยคำมั่นสัญญาและการข่มขู่ ด้วยเล่ห์เหลี่ยมและอำนาจ อำนาจของ [struggle_liege.GetTitledFirstName] ได้รับการยืนยันอีกครั้ง เหล่ากบฏในอดีตถูกปราบปราม และเหล่าขุนนางเปอร์เซียที่ไม่เชื่อฟังต่างแย่งกันหมอบกราบต่อหน้าบัลลังก์ของ [struggle_liege.GetTitleTierName]\n\nทว่าเบื้องหลังบัลลังก์นั้น #italic ข้า#! ยืนอยู่ ในช่วงเวลาแห่งความวุ่นวายนี้ ข้าได้ก้าวขึ้นมารับมือกับความท้าทาย พิสูจน์ตนเองว่าเป็นผู้สนับสนุนที่ยิ่งใหญ่ที่สุดของ [Mostaza.GetTitleTierName] และนำความสงบเรียบร้อยกลับคืนสู่โลก แน่นอนว่าทุกคนจะต้องยอมรับการมีส่วนร่วมของข้าในไม่ช้า พร้อมด้วยความรุ่งโรจน์อันเป็นนิรันดร์สำหรับตระกูล [ROOT.Char.GetHouse.GetNameNoTooltip]..."
 fp3_struggle.0071.a: "ข้ายืนหยัดอย่างผู้มีชัย!"
 fp3_struggle.0071.b: "ชัยชนะนั้นหอมหวาน แต่เราสามารถเป็นได้มากกว่านี้!"

 fp3_struggle.0072.t: "$fp3_struggle.0071.t$"
 fp3_struggle.0072.desc.caliph: "ด้วยคำมั่นสัญญาและการข่มขู่ ด้วยเล่ห์เหลี่ยมและอำนาจ อำนาจของข้าเหนือ #italic ดารุลอิสลาม#! ได้รับการยืนยันอีกครั้ง แม้หลายคนจะอ้างว่านี่เป็น เพราะพระคุณของ [ROOT.GetCharacter.GetFaith.HighGodNameAlternate] แต่ด้วยทักษะและความชาญฉลาดของข้าเองเท่านั้นที่ [struggle_liege.GetPrimaryTitle.GetNameNoTooltip] รอดพ้นจากสงครามกลางเมืองที่นองเลือดยิ่งกว่าเดิม\n\nนี่จะเป็นการประกาศถึงวันใหม่ที่ยิ่งใหญ่สำหรับเปอร์เซีย และสำหรับโลก! และสำหรับ #italic ข้า!#!"
 fp3_struggle.0072.desc.supporter: "ด้วยคำมั่นสัญญาและการข่มขู่ ด้วยเล่ห์เหลี่ยมและอำนาจ อำนาจของ [struggle_liege.GetTitledFirstName] ได้รับการยืนยันอีกครั้ง แม้หลายคนจะอ้างว่านี่เป็น เพราะพระคุณของ [ROOT.GetCharacter.GetFaith.HighGodNameAlternate] แต่ด้วยการสนับสนุนของพันธมิตร เช่นข้าเท่านั้นที่ [struggle_liege.GetPrimaryTitle.GetNameNoTooltip] รอดพ้นจากสงครามกลางเมืองที่นองเลือดยิ่งกว่าเดิม\n\nข้าไม่สงสัยเลยว่าจะได้รับรางวัลสำหรับความพยายามและความภักดีของข้า แม้ข้าจะอดสงสัยไม่ได้ว่าอาจมีอะไรให้ได้มากกว่านี้หากเลือกอีกฝ่าย..."
 fp3_struggle.0072.desc.detractor: "ด้วยคำสัญญาที่ว่างเปล่าและการข่มขู่ที่ชั่วร้าย [struggle_liege.GetTitleTierName] ได้ยืนยันอำนาจที่เรียกว่าของ [struggle_liege.GetHerHis] อีกครั้ง และได้ความภักดีกลับคืนมาจากคนโง่และคนประจบสอพลอที่เคยแห่แหนมายังราชสำนักของ [struggle_liege.GetHerHis]\n\nแม้ข้าจะพยายามอย่างสุดความสามารถ กาหลิบ [struggle_liege.GetPrimaryTitle.GetNameNoTierNoTooltip] ที่ฉ้อฉลก็ยังคงอยู่ นี่เป็นวันที่มืดมนสำหรับเปอร์เซีย แต่บางทีทุกอย่างอาจยังไม่สูญสิ้น วันใหม่จะมาถึง นำมา ซึ่งโอกาสใหม่ๆ..."
 fp3_struggle.0072.desc.uninvolved: "การต่อสู้เพื่อเปอร์เซียสงบลง บัดนี้ [struggle_liege.GetTitledFirstName] ไม่เพียง แต่ฟื้นฟูอำนาจและจักรวรรดิของ [struggle_liege.GetHerHis] เท่านั้น แต่ยังได้รับอำนาจมากกว่าที่เคยมีมา\n\nด้วยการ แต่งตั้งหุ่นเชิดชาว [struggle_liege.GetCulture.GetName] ให้ปกครองเปอร์เซียและปราบปรามทุกคนที่ท้าทาย [struggle_liege.GetHerHim] [struggle_liege.GetSheHe] ได้ยืนยันอำนาจสูงสุดของ [struggle_liege.GetFaith.GetAdjective] ใน [struggle_liege.GetPrimaryTitle.GetBaseNameNoTierNoTooltip]\n\nเป็นการยากที่จะเห็นว่าใครจะสามารถท้าทาย [struggle_liege.GetHerHim] ได้ในตอนนี้ แต่บางทีทุกอย่างอาจยังไม่สูญสิ้น..."
 fp3_struggle.0072.desc.involved: "ความวุ่นวายที่ปกคลุมเปอร์เซียลดน้อยลง บัดนี้ [struggle_liege.GetTitledFirstName] ไม่เพียง แต่ฟื้นฟูอำนาจและจักรวรรดิของ [struggle_liege.GetHerHis] เท่านั้น แต่ยังอ้างสิทธิ์ในเกียรติภูมิและอำนาจที่ยิ่งใหญ่กว่าที่ [struggle_liege.GetSheHe] เคยมีมาก่อน\n\nด้วยการ แต่งตั้งหุ่นเชิดชาว [struggle_liege.GetCulture.GetName] ให้ปกครองเปอร์เซียและปราบปรามทุกคนที่ท้าทาย [struggle_liege.GetHerHim] [struggle_liege.GetSheHe] ได้ยืนยันอำนาจสูงสุดของ [struggle_liege.GetFaith.GetAdjective] ใน [struggle_liege.GetPrimaryTitle.GetBaseNameNoTierNoTooltip]\n\nผู้คนต่างอ้างว่าอำนาจของ [struggle_liege.GetHerHis] จะไม่สามารถท้าทายได้ แต่บางทีข้าควรจะนำสิ่งนั้นมาทดสอบ..."
 fp3_struggle.0072.desc.interloper: "การต่อสู้เพื่อเปอร์เซียสงบลง บัดนี้ [struggle_liege.GetTitledFirstName] ไม่เพียง แต่ฟื้นฟูอำนาจและจักรวรรดิของ [struggle_liege.GetHerHis] เท่านั้น แต่ยังได้รับอำนาจมากกว่าที่เคยมีมา\n\nด้วยการ แต่งตั้งหุ่นเชิดชาว [struggle_liege.GetCulture.GetName] ให้ปกครองเปอร์เซียและปราบปรามทุกคนที่ท้าทาย [struggle_liege.GetHerHim] [struggle_liege.GetSheHe] ได้ยืนยันอำนาจสูงสุดของ [struggle_liege.GetFaith.GetAdjective] ใน [struggle_liege.GetPrimaryTitle.GetBaseNameNoTooltip]\n\nเนื่องจากอำนาจของ [struggle_liege.GetHerHis] จะท้าทายได้ยากในตอนนี้ บางทีข้าเองก็ควรจะประจบประแจง [struggle_liege.GetHerHim] เพื่อให้ได้ครอบครองดินแดนเปอร์เซียอย่างมั่นคงยิ่งขึ้น..."
 fp3_struggle.0072.a: "[ROOT.GetCharacter.GetFaith.HighGodNameAlternate] สถิตอยู่กับข้า!"
 fp3_struggle.0072.b: "วันใหม่จะมาถึง!"

 fp3_struggle.0082.t: "[GetTitleByKey('d_sunni').GetNameNoTooltip] ยอมจำนน"
 fp3_struggle.0082.desc.intro: "หลังจากต่อสู้อย่างเปล่าประโยชน์กับโอกาสที่สิ้นหวังมานานหลายปี [struggle_liege.GetTitledFirstName] ได้ยอมจำนนและละทิ้งความหวังใดๆ ในการรวมภูมิภาคอีกครั้ง พรมแดนตะวันออกบัดนี้เป็นของผู้ปกครองใหม่ ซึ่งจะยังคงต่อสู้กับชนเผ่าเร่ร่อนบนทุ่งหญ้าสเตปป์และต่อสู้กันเอง เหมือน เช่นที่เป็นมาเสมอ\n\n"
 fp3_struggle.0082.desc.supporter: "ถูกศัตรูรุมล้อมทุกด้าน การทรยศและโชคร้ายได้ ทำให้กาหลิบแห่งตระกูล [struggle_liege.GetHouse.GetNameNoTooltip] แตกแยก หากข้าสามารถพลิกสถานการณ์ได้ มีเพียง [ROOT.GetCharacter.GetFaith.HighGodName] เท่านั้นที่รู้ แต่ข้าได้รับไพ่ที่ไม่ดี และทำได้เพียงสงสัยว่าอะไรจะรออยู่ข้างหน้า แม้ว่านี่อาจเป็นการโจมตีที่เลวร้าย แต่มัน #italic ไม่ใช่#! จุดจบ!\n\nปล่อยให้คนโง่ที่เลือกท้าทายข้าได้พักผ่อนสักครู่ เพราะเมื่อพวกเขาคาดไม่ถึงที่สุด กองทัพของข้าจะเคลื่อนทัพอีกครั้ง และเหยียบย่ำธงของคนทรยศให้เป็นผุยผง"
 fp3_struggle.0082.desc.involved: "ไม่ว่านี่จะเป็นผลลัพธ์ที่ข้าอาจต้องการหรือไม่ก็ตาม มันอาจยังคงถูกใช้เพื่อประโยชน์ของข้า หากอาณาจักรของข้าสามารถผงาดขึ้นสู่ความรุ่งโรจน์ในความว่างเปล่าที่ตระกูล [struggle_liege.GetHouse.GetNameNoTooltip] ทิ้งไว้"
 fp3_struggle.0082.desc.interloper: "ในฐานะผู้บุกรุกเข้ามาในเวทีเปอร์เซีย บางทีนี่อาจเป็นโอกาสของข้าที่จะอ้างบทบาทที่ใหญ่ขึ้น และเติมเต็มความว่างเปล่าที่ตระกูล [struggle_liege.GetHouse.GetNameNoTooltip] ทิ้งไว้ หรือข้าอาจจะปล่อยความยุ่งเหยิงนี้ไว้ตามลำพัง และมองหาที่อื่นสำหรับบ้านในอนาคตของตระกูล [ROOT.Char.GetHouse.GetNameNoTooltip]..."
 fp3_struggle.0082.desc.detractor: "หลังจากหลายปีของการต่อสู้ที่ไร้ผลและความทุกข์ระทมอันขมขื่น ในที่สุด [struggle_liege.GetTitledFirstName] ก็ถูกบังคับให้ยอมจำนน อำนาจใดๆ ที่ตระกูล [struggle_liege.GetHouse.GetNameNoTooltip] เคยมีเหนือเปอร์เซียได้หมดสิ้นไปนานแล้ว ทำให้เหล่ากบฏและคู่แข่งทั้งหมดกล้าแกร่งขึ้น\n\nตระกูล [ROOT.Char.GetHouse.GetNameNoTooltip] อาจผงาดขึ้นจากความโกลาหลนี้ แข็งแกร่งกว่าที่เคย ภาคภูมิใจและ #italic เป็นอิสระ#!."
 fp3_struggle.0082.desc.uninvolved: "หลังจากหลายปีของการขัดสีและการปกครองแบบอนาธิปไตย [struggle_liege.GetTitledFirstName] ได้ยอมจำนนอย่างเงียบๆ และละทิ้งความหวังใดๆ ในการรวมอาระเบียและเปอร์เซียอีกครั้ง\n\nบัดนี้ตะวันออกเป็นของผู้ปกครองใหม่ ซึ่งจะยังคงต่อสู้กับชนเผ่าเร่ร่อนบนทุ่งหญ้าสเตปป์ และต่อสู้กันเอง ขณะที่กาหลิบเฝ้ามองอย่างหมดหนทางจากแดนไกล\n\nเป็นที่ชัดเจนว่าการล่มสลายของตระกูล [struggle_liege.GetHouse.GetNameNoTooltip] อาจมอบโอกาสมากมายให้กับตระกูลที่กล้าพอที่จะคว้ามันไว้..."
 fp3_struggle.0082.a: "พวกเขาจะต้องเสียใจในวันที่ทรยศเรา..."
 fp3_struggle.0082.b: "รุ่งอรุณจะมาถึงอีกครั้ง!"
 fp3_struggle.0082.c: "เพื่อความรุ่งโรจน์อันเป็นนิรันดร์ของเปอร์เซีย!"

 fp3_struggle.0091.t: "[struggle_ender.GetPrimaryTitle.GetNameNoTooltip|U] รากฐาน: เปอร์เซียใหม่"
 fp3_struggle.0091.desc.detractor: "ขณะที่ดวงอาทิตย์ขึ้นหลังภูเขาดามาวานด์ แสงอันอ่อนโยนของมันสาดส่องทุ่งนาซีดเซียว มงกุฎแห่ง [GetTitleByKey('e_persia').GetBaseName|U] จะไม่เป็นเพียงสายเลือดทางประวัติศาสตร์อีกต่อไป แต่เป็นสัญลักษณ์ของการต่อสู้อย่างกล้าหาญของเราต่อ [struggle_liege.GetTitledFirstName]\n\nจะไม่มีผู้รุกรานจากต่างแดนใดมาจำกัดเราได้อีก เราได้ทวงคืนอำนาจและความรุ่งโรจน์แห่งยุคโบราณ เมื่อโลกสั่นสะท้านต่อหน้ากษัตริย์เหนือกษัตริย์\n\nในไม่ช้า เปอร์เซียทั้งหมดจะโบกสะบัดธงแห่งจักรวรรดิใหม่ จักรวรรดิ #italic ของข้า#! "
 fp3_struggle.0091.desc.supporter: "แม้ว่าอุดมการณ์ของ [struggle_liege.GetName] จะชอบธรรม แต่มันอาจถึงวาระแล้ว ประชาชนชาวเปอร์เซียต้องการผู้นำคนใหม่ การจุดไฟโบราณและความรุ่งโรจน์ที่หายไปในสมัยโบราณขึ้นมาใหม่ และข้าได้ตอบรับเสียงเรียกร้องของพวกเขา จากรากฐานที่ข้าได้วางไว้ จักรวรรดิใหม่อาจผงาดขึ้น เป็นจักรวรรดิแรกในเปอร์เซีย นับตั้งแต่การล่มสลายของราชวงศ์ [sassanid_dynasty.GetName] หรือข้าอาจพอใจกับสิ่งที่ข้าได้บรรลุแล้ว เสริมสร้างแผ่นดินและจุดประกายไฟในหัวใจของชาวเปอร์เซียทุกคน..."
 fp3_struggle.0091.a: "สิ่งนี้ควรจะรับประกันมรดกของตระกูล [ROOT.Char.GetHouse.GetNameNoTooltip]"

 fp3_struggle.0092.t: "$fp3_struggle.0091.t$"
 fp3_struggle.0092.intro: "ขณะที่ดวงอาทิตย์ขึ้นหลังภูเขาดามาวานด์ แสงอันอ่อนโยนของมันสาดส่องทุ่งนาซีดเซียว [struggle_ender.GetName] ได้เติบโตขึ้นอย่างเพียงพอในด้านความแข็งแกร่งและความชอบธรรมที่จะประกาศการก่อตั้ง [persia_loc.GetName|U] ขึ้นใหม่ และบัดนี้มหาอำนาจใหม่ได้ปกครองดินแดนนี้ เป็นปราการป้องกันเหล่าขุนนางผู้พยาบาทในอาระเบียและชนเผ่าเร่ร่อนป่าเถื่อนแห่งทุ่งหญ้าสเตปป์ ทวงคืนความรุ่งโรจน์ของกษัตริย์โบราณ\n\n"
 fp3_struggle.0092.desc.iranian: "บทบาทของข้าเองในจักรวรรดิของ [struggle_ender.GetTitledFirstNamePossessivesNoTooltip] ยังคงต้องรอดูต่อไป — ด้วยความช่วยเหลือของข้า [struggle_ender.GetSheHe] สามารถสร้างมรดกที่ยั่งยืน หรือบางที [struggle_ender.GetSheHe] อาจเป็นเพียงผู้พิชิตอีกคนหนึ่งสำหรับพงศาวดาร ยิ่งใหญ่ แต่เพียงชั่วครู่"
 fp3_struggle.0092.desc.non-iranian: "สิ่งที่เคยเป็นเพียงชายแดนอีกแห่งหนึ่งของกาหลิบที่ใกล้ตาย บัดนี้กลายเป็นศูนย์กลางของจักรวรรดิที่กำลังรุ่งเรือง โลกเฝ้ามองด้วยความสนใจ สงสัยว่า [struggle_ender.GetTitledFirstNameNoTooltip] จะสามารถสร้างมรดกที่ยั่งยืนได้หรือไม่ หรือเป็นเพียงผู้พิชิตอีกคนหนึ่งสำหรับพงศาวดาร ยิ่งใหญ่ แต่เพียงชั่วครู่"
 fp3_struggle.0092.a: "มันเป็นสิ่งที่หลีกเลี่ยงไม่ได้"

 fp3_struggle.0095.t: "การขึ้นสู่อำนาจของ [struggle_ender.GetFaith.GetAdherentNameNoTooltip]"
 fp3_struggle.0095.desc.shia_and_zandaqa: "ชาวซุนนีที่หลงผิดคิดไปเองมานานเกินไปว่ากาหลิบที่ใกล้ตายของพวกเขาคืออำนาจสูงสุดของโลกนี้ รองจากพระเจ้าเท่านั้น พวกเขาผิดไปมากเพียงใด\n\nด้วยการล่มสลายของ [struggle_liege.GetTitledFirstName] ข้าได้แบกรับภาระในการนำ #EMP อุมมะฮ์#! ล้างแค้นให้กับยุทธการที่กัรบะลาอ์เพื่อผู้ติดตามของ [ali.GetFirstName] ข้าจะนำพาสู่ยุคใหม่แห่งการครอบงำของ [ROOT.Char.GetFaith.GetAdherentNameNoTooltip] และอ้างสิทธิ์ในบัลลังก์ที่ยิ่งใหญ่ที่สุดของโลกนี้\n\nชาวซุนนี ซึ่งก่อนหน้านี้มั่นใจในความเหนือกว่าอันน่าหมั่นไส้ของตน จะไม่มีทางเลือกอื่นนอกจากยอมจำนน"
 fp3_struggle.0095.desc.muhakkima: "ชาวซุนนีผู้โง่เขลาถือเอาเองมานานว่ากาหลิบที่ฉ้อฉลของพวกเขาต้องเป็นอำนาจสูงสุดของโลกนี้ แต่ในความเขลาของพวกเขา พวกเขาลืมไปว่าการตัดสินเป็นของพระเจ้าเท่านั้น! ข้าได้ทำในสิ่งที่ [ROOT.Char.GetFaith.GetAdherentNamePluralNoTooltip] จำนวนมากพยายามทำมาก่อนข้า และนำกาหลิบซุนนีมาสู่จุดจบ แม้จะห่างไกลจากการแก้แค้นที่เพียงพอสำหรับยุทธการที่นะห์เราะวานและความทุกข์ทรมานมานานหลายศตวรรษ นี่เป็นเพียงจุดเริ่มต้น ข้าได้กลายเป็นกาหลิบของ [ROOT.Char.GetFaith.GetAdherentNameNoTooltip] และจะนำพวกเขาไปสู่การเผชิญหน้าครั้งใหญ่กับชีอะฮ์ ซึ่งจะต้องมาถึงอย่างแน่นอนในลำดับต่อไป"
 fp3_struggle.0095.desc.fallback: "กาหลิบมีหน้าที่นำอุมมะฮ์บนโลกไปตามเส้นทางอันศักดิ์สิทธิ์ แต่ในความเขลาของเรา เราได้ปล่อยให้กาหลิบอ่อนแอและฉ้อฉล สิ่งนี้เปลี่ยนแปลงในวันนี้ ขณะที่ข้านำพาสู่ยุคใหม่สำหรับทั้งเปอร์เซียและอิสลามภายใต้การนำที่ชาญฉลาดและไม่ฉ้อฉลของข้า\n\nแม้จะยังมีงานอีกมากที่ต้องทำ แต่ปฏิเสธไม่ได้ว่าสิ่งที่ข้าได้ทำลงไปจะเปลี่ยนแปลงเส้นทางประวัติศาสตร์เปอร์เซียไปตลอดกาล บัดนี้เรามุ่งสู่อนาคต สู่วิถี [ROOT.Char.GetFaith.GetAdjective] และ [GetTitleByKey('e_persia').GetName]!"
 fp3_struggle.0095.a: "ขอ [ROOT.Char.GetFaith.HighGodNameAlternate] นำทางการปกครองของข้า!"

 fp3_struggle.0096.t: "$fp3_struggle.0095.t$"
 fp3_struggle.0096.desc.supporter: "อนิจจา อาณาจักรของ [struggle_liege.GetName] ได้ล่มสลายลง และจากเถ้าถ่านของมัน [struggle_ender.GetName] ได้ผงาดขึ้น อ้างสิทธิ์ในกาหลิบสำหรับ [struggle_ender.GetFaith.GetAdherentName] การสนับสนุน [struggle_liege.GetTitledFirstNameNoTooltip] ของข้าจึงไร้ผล และทองคำและความพยายามทั้งหมดก็สูญเปล่า ทว่า บางทีอาจยังไม่สายเกินไปที่จะกอบกู้อุดมการณ์ซุนนี — หรือเปลี่ยนข้าง และเข้าร่วมกับ [struggle_ender.GetFaith.GetAdherentNamePluralNoTooltip] อย่างเต็มตัว..."
 fp3_struggle.0096.desc.involved: "ความวุ่นวายและอนาธิปไตยดูเหมือนจะสิ้นสุดลง โดย [struggle_ender.GetName] เอาชนะผู้ท้าชิงทั้งหมดและอ้างสิทธิ์ในกาหลิบในนามของ [struggle_ender.Char.GetFaith] แน่นอนว่า [struggle_ender.GetSheHe] บัดนี้มีทั้งผู้สนับสนุนและผู้คัดค้าน โดยบางคนเรียกว่าเป็นจุดจบของ #italic อุมมะฮ์#! และคนอื่นๆ เฉลิมฉลองชัยชนะแห่งศรัทธาของพวกเขา ข้าต้องคิดอย่างรอบคอบว่าข้าจะเป็นคนใดในสองกลุ่มนี้ [struggle_ender.GetTitledFirstNameNoTooltip] พร้อมที่จะนำพาสู่ยุคใหม่สำหรับอิสลาม และนำสันติภาพมาสู่เมโสโปเตเมียและเปอร์เซีย — แต่อาจยืนหยัดหรือล่มสลายได้ด้วยการสนับสนุนของข้า..."
 fp3_struggle.0096.desc.interloper: "$fp3_struggle.0096.desc.involved$"
 fp3_struggle.0096.desc.detractor: "ในที่สุด อาณาจักรที่ฉ้อฉลของ [struggle_liege.GetTitledFirstName] ก็ล่มสลายลง จากเถ้าถ่านของมัน [struggle_ender.GetTitledFirstName] ได้ผงาดขึ้น ประกาศกาหลิบ [struggle_ender.GetFaith.GetAdherentName] และยุคใหม่\n\nการต่อสู้อันยาวนานของข้าต่อ [struggle_liege.GetTitledFirstNameNoTooltip] จึงบังเกิดผล แม้ว่าอาจไม่ใช่จุดจบที่ข้าต้องการ ทว่า ยังคงมีความหวังสำหรับอุดมการณ์ซุนนี และข้าอาจกลายเป็นประทีปของมัน หรือข้าอาจเข้าร่วมกับ [struggle_ender.GetFaith.GetAdherentNamePluralNoTooltip] อย่างเต็มตัว..."
 fp3_struggle.0096.desc.uninvolved: "การต่อสู้อันยาวนานในเปอร์เซียได้สิ้นสุดลง โดย [struggle_ender.GetName] เอาชนะผู้ท้าชิงทั้งหมดและอ้างสิทธิ์ในกาหลิบในนามของ [struggle_ender.Char.GetFaith] ไม่ว่า [struggle_ender.GetSheHe] จะทำ เช่นนั้นอย่างยุติธรรมหรือผิดพลาด ไม่มีใครสามารถกล่าวได้ แต่ดูเหมือนชัดเจนว่า [struggle_ender.GetSheHe] พร้อมที่จะนำพาสู่ยุคใหม่สำหรับอิสลาม และนำสันติภาพมาสู่เมโสโปเตเมียและเปอร์เซีย แม้ว่าไม่ใช่ทุกคนใน #italic อุมมะฮ์#! จะพอใจกับการพัฒนานี้ และขุนนางชายแดนอาจครุ่นคิดอยู่ในฐานที่มั่นอันห่างไกลของพวกเขา แต่สำหรับตอนนี้ พวกเขาจะต้องกัดฟัน"
 fp3_struggle.0096.a: "[ROOT.Char.GetFaith.HighGodNameAlternate] ผู้ยิ่งใหญ่และเมตตา!"
 fp3_struggle.0096.b: "นี่เป็นวันที่มืดมน..."

 fp3_struggle.0100.t: "รากฐาน: กาหลิบผู้ถูกกดขี่"
 fp3_struggle.0100.desc: "เป็นที่ยอมรับกันมานานในหมู่ชาวมุสลิมว่ากาหลิบคืออำนาจสูงสุดของโลกนี้ รองจากพระเจ้าเท่านั้น แต่เมื่ออาณาจักรตกอยู่ในความสิ้นหวังและความเสื่อมทราม จึงมีความจำเป็นต้องคิดทบทวนสถานการณ์นี้ใหม่\n\nบัดนี้ [ROOT.GetCharacter.GetPrimaryTitle.GetNameNoTooltip|U] ใหม่ได้ถือกำเนิดขึ้น โดยมีข้าเป็นผู้นำ เพื่อนำทางกาหลิบภายใต้การคุ้มครองและความระแวดระวังของข้า [struggle_liege.GetName] อาจเป็นผู้นำของผู้ศรัทธา แต่ #italic ข้า#! จะเป็นเจ้าเหนือหัวของ [struggle_liege.GetHerHis] นับจากนี้ไป เป็น [Select_CString( ROOT.Char.IsFemale, 'สตรีผู้ดูแล', 'ผู้ดูแล' )] คนใหม่แห่งอิสลาม และ [struggle_liege.GetSheHe] ควรจะจำไว้ #EMP ให้ดี#! "
 fp3_struggle.0100.desc.shia_and_zandaqa: "เป็นที่ยอมรับกันมานานในหมู่ชาวมุสลิมว่ากาหลิบคืออำนาจสูงสุดของโลกนี้ รองจากพระเจ้าเท่านั้น แต่เมื่ออาณาจักรตกอยู่ในความสิ้นหวังและความเสื่อมทราม ก็ปรากฏชัดว่าผู้ติดตามของอาลีมีสิทธิ์เหนือผู้ศรัทธามากกว่า\n\nข้าได้แบกรับภาระในการนำกาหลิบ [struggle_liege.GetPrimaryTitle.GetNameNoTierNoTooltip] มาอยู่ภายใต้การคุ้มครองและความระแวดระวังของข้า ข้าจะนำพาสู่ยุคใหม่แห่งการครอบงำของ [ROOT.Char.GetFaith.GetAdherentName] ใน #EMP อุมมะฮ์#! และผู้คัดค้านของเราควรจะยอมจำนน!"
 fp3_struggle.0100.desc.muhakkima: "เป็นที่ยอมรับกันมานานในหมู่ชาวซุนนีว่ากาหลิบคืออำนาจสูงสุดของโลกนี้ รองจากพระเจ้าเท่านั้น แต่เมื่ออาณาจักรสั่นสะท้านต่อหน้าอำนาจของมุฮักกิมะฮ์ พวกเขาก็เห็นความผิดพลาดของตน\n\nโดยมีข้าเป็นผู้นำ [ROOT.Char.GetFaith.GetAdherentNamePlural] ได้เข้าควบคุมกาหลิบ [struggle_liege.GetPrimaryTitle.GetNameNoTierNoTooltip] ที่น่าสังเวช และ #EMP อุมมะฮ์#! ทั้งหมดจะต้องยอมรับถ้อยคำอันศักดิ์สิทธิ์ของเราในไม่ช้า — การตัดสินเป็นของพระเจ้าเท่านั้น!"
 fp3_struggle.0100.a: "วันใหม่สำหรับอิสลาม!"

 fp3_struggle.0101.t: "$fp3_struggle.0100.t$"
 fp3_struggle.0101.desc.detractor: "การที่กาหลิบ [struggle_liege.GetPrimaryTitle.GetNameNoTierNoTooltip] เป็นเสือกระดาษนั้นไม่น่าแปลกใจสำหรับใคร และแท้จริงแล้ว กองทัพของมันได้กระจัดกระจาย ผู้ภักดีได้ละเมิดคำสาบานหรือซ่อนตัวอยู่ในดินแดนชายแดนที่ถูกลืม [struggle_ender.GetName] บัดนี้ได้อ้างสิทธิ์เป็น #italic ผู้พิทักษ์#! ของกาหลิบ แต่มีเพียงคนโง่เท่านั้นที่จะไม่ตระหนักว่ามันคืออะไร — กาหลิบซุนนีได้ถูกกดขี่และ ทำให้ต่ำต้อยลง โดยมี [struggle_ender.GetHerHim] เป็นนายใหม่\n\nในฐานะผู้ต่อต้าน [struggle_liege.GetTitledFirstNameNoTooltip] มายาวนาน ข้าต้องแน่ใจว่าจะอ้างตำแหน่งที่สำคัญในระเบียบใหม่นี้สำหรับข้าและตระกูล [ROOT.Char.GetHouse.GetNameNoTooltip]..."
 fp3_struggle.0101.desc.supporter: "แม้ข้าจะสนับสนุนอย่างแน่วแน่ กาหลิบ [struggle_liege.GetPrimaryTitle.GetNameNoTierNoTooltip] ก็พิสูจน์แล้วว่าแตกแยกเกินไป หรือศัตรูของมันมีมากเกินไปและเหนียวแน่นเกินไป [struggle_ender.GetName] บัดนี้ได้อ้างสิทธิ์เป็น #italic ผู้พิทักษ์#! ของกาหลิบ แต่ในทางปฏิบัติแล้ว แน่นอนว่าหมายความว่า [struggle_ender.GetSheHe] ได้กดขี่องค์อธิปัตย์ผู้ชอบธรรมแห่ง #italic ดารุลอิสลาม#! อย่างน่าอดสู\n\nข้าต้องดำเนินไปอย่างระมัดระวังในตอนนี้ เพื่อรักษาอนาคตของตระกูล [ROOT.Char.GetHouse.GetNameNoTooltip]..."
 fp3_struggle.0101.desc.interloper: "การกระทำอันเด็ดขาดของ [struggle_ender.GetName] ดูเหมือนจะนำมา ซึ่งจุดจบ แม้จะเปราะบาง ต่อความอนาธิปไตยและความวุ่นวายในเปอร์เซีย หลังจากกดขี่ [struggle_liege.GetTitledFirstName] แล้ว [struggle_ender.GetTitledFirstNameNoTooltip] บัดนี้อ้างสิทธิ์ในการพิทักษ์กาหลิบซุนนี และการยอมรับว่าเป็นผู้ปกครองที่ยิ่งใหญ่ที่สุดของแผ่นดิน\n\nคำถามตอนนี้คือ — ตระกูล [ROOT.Char.GetHouse.GetNameNoTooltip] ควรยอมรับสถานการณ์นี้ หรือโต้แย้ง?"
 fp3_struggle.0101.desc.involved: "$fp3_struggle.0101.desc.interloper$"
 fp3_struggle.0101.desc.uninvolved: "การต่อสู้ในเปอร์เซียและเมโสโปเตเมียได้สิ้นสุดลง โดย [struggle_ender.GetName] กดขี่ [struggle_liege.GetName] และยึดครองส่วนสำคัญของ #italic ดารุลอิสลาม#! อำนาจและความรุ่งโรจน์ของกาหลิบซุนนีได้ลดน้อยลงตลอดไป ขณะที่ [struggle_ender.GetPrimaryTitle.GetName] ได้กลายเป็นแสงสว่างที่รุ่งโรจน์ มีเพียงเวลาเท่านั้นที่จะบอกได้ว่ามันจะคงอยู่ หรือเป็นเพียงดาวตก..."
 fp3_struggle.0101.a: "ขอให้สิ่งนี้ประกาศถึงวันใหม่!"
 fp3_struggle.0101.b: "นี่เป็นวันที่มืดมนสำหรับอิสลาม"

 fp3_struggle.0191.t: "จุดจบของ [GetTitleByKey('d_sunni').GetName]"
 fp3_struggle.0191.desc: "ต่อสู้อย่างเปล่าประโยชน์กับเหล่านายพลผู้ทะเยอทะยาน ข้าราชบริพารที่ไม่พอใจ และอดีตทาสของตนเอง [GetTitleByKey('d_sunni').GetNameNoTooltip] ได้เก็บเกี่ยวสิ่งที่ตนหว่านไว้ ความเย่อหยิ่งและความทะนงตนได้เติบโตใหญ่เกินไป การใช้จ่ายสิ้นเปลืองและไม่แน่นอน ราชสำนักทรยศอย่างที่ไม่เคยมีมาก่อน\n\nจักรวรรดิล่มสลาย และ #italic ข้า#! คือสถาปนิกแห่งการล่มสลายนั้น ข้ายืนหยัดอย่างรุ่งโรจน์ ณ ที่นี้ ขณะที่รัชสมัยของ [struggle_liege.GetFirstNamePossessive] อย่างดีที่สุด จะกลายเป็นเรื่องเตือนใจในหนังสือประวัติศาสตร์ เป็นเพียงช่วงเวลาสั้นๆ ในพงศาวดารแห่งเปอร์เซีย"
 fp3_struggle.0191.a: "นี่คือช่วงเวลาที่ยิ่งใหญ่ที่สุดของข้า!"
 fp3_struggle.0191.b: "ข้าทำในสิ่งที่ต้องทำ"

 fp3_struggle.0192.t: "$fp3_struggle.0191.t$"
 fp3_struggle.0192.desc.caliph: "ทุกคนทรยศข้า ที่ปรึกษาของข้า ข้าราชบริพารของข้า สหายของข้า พยายามเท่าที่ข้าจะทำได้เพื่อกอบกู้อาณาจักรของตระกูล [ROOT.Char.GetHouse.GetNameNoTooltip] แต่มันไร้ ซึ่งความหวังสุดท้าย และ แม้ว่าข้าอาจสงสัยในตอนนี้ว่ามีสิ่งใดที่แตกต่างที่ข้าสามารถทำได้หรือไม่ มีเพียง [ROOT.GetCharacter.GetFaith.HighGodName] เท่านั้นที่รู้ความจริง อาณาจักรพังทลายและแตกสลาย ท่ามกลางหอคอยที่โค่นล้มและซากปรักหักพังแห่งความรุ่งโรจน์ในอดีต ข้าไม่มีทางเลือกอื่นนอกจากซ่อนตัวอยู่ใน [ROOT.Char.Custom('ResidenceBuilding')] ของข้า ขณะที่ทุกสิ่งพังทลายลงรอบตัว และพอใจที่อย่างน้อยข้าก็ยังมีชีวิตอยู่"
 fp3_struggle.0192.desc.supporter_or_vassal: "ติดอยู่ในการต่อสู้ที่สิ้นหวังกับเหล่านายพลผู้ทะเยอทะยาน ข้าราชบริพารที่ไม่พอใจ และอดีตทาสของตนเอง [struggle_liege.GetPrimaryTitle.GetNameNoTooltip] ไม่สามารถคงอยู่ได้ การใช้จ่ายทองคำ เลือด และแรงงานนั้นมหาศาล และ แม้ว่าโลกอาจไม่ยอมรับบทบาทที่ข้าเล่น การเสียสละที่ข้าทำ [ROOT.GetCharacter.GetFaith.HighGodName] จะรับรู้ แต่ไม่ว่าจะดีหรือร้าย บัดนี้เราเผชิญกับอาณาจักรที่แตกสลาย ถูกทิ้งให้เปิดรับผู้ที่จะโจมตีกษัตริย์แห่งโลกนี้ด้วยการโจมตีที่ร้ายแรง ทว่าชะตากรรมของตระกูล [struggle_liege.GetHouse.GetNameNoTooltip] อาจไม่ใช่ของข้า และจากเถ้าถ่านเหล่านี้ ดอกไม้ใหม่อาจเบ่งบาน"
 fp3_struggle.0192.desc.detractor: "ต่อสู้อย่างเปล่าประโยชน์กับเหล่านายพลผู้ทะเยอทะยาน ข้าราชบริพารที่ไม่พอใจ และอดีตทาสของตนเอง [struggle_liege.GetPrimaryTitle.GetNameNoTooltip] ได้เก็บเกี่ยวสิ่งที่ตนหว่านไว้ ความเย่อหยิ่งและความทะนงตนได้เติบโตใหญ่เกินไป การใช้จ่ายสิ้นเปลืองและไม่แน่นอน ราชสำนักทรยศอย่างที่ไม่เคยมีมาก่อน ตระกูล [struggle_liege.GetHouse.GetNameNoTooltip] ได้ล่มสลายลง และการล่มสลายของพวกเขานั้นยิ่งใหญ่จนไม่มีใครสามารถคาดการณ์ได้ว่าพวกเขาจะผงาดขึ้นมาอีกครั้ง ชื่อของพวกเขา อย่างดีที่สุด จะกลายเป็นเรื่องเตือนใจในหนังสือประวัติศาสตร์ เป็นเพียงช่วงเวลาสั้นๆ ในพงศาวดารแห่งเปอร์เซีย"
 fp3_struggle.0192.a: "ไม่ว่าจะต้องแลกด้วยอะไร ข้าต้องรักษาอนาคตของราชวงศ์"
 fp3_struggle.0192.b: "มันเป็นเพียงความพ่ายแพ้ชั่วคราว"
 fp3_struggle.0192.c: "สิ่งนี้ประกาศถึงโอกาสใหม่ๆ — สำหรับข้า"
 fp3_struggle.0123.d: "ช่างเป็นหายนะ..."


 sway_outcome.1004.t: "คำปฏิญาณแห่งความภักดี"
 sway_outcome_magnanimity.1004.desc: ""[ROOT.Char.GetTitleTierName] ของข้า" [target.GetName] กล่าว "บัดนี้ข้าเห็นแล้วว่าข้าผิดที่สงสัยในตัวท่าน ความมีน้ำใจของท่านน่ายกย่องในยามยากลำบาก เช่นนี้ เมื่อเราทุกคนควรร่วมมือกันเพื่อประโยชน์ของอาณาจักร" [target.GetSheHe|U] โค้งคำนับต่อหน้าข้า และดูจริงใจอย่างแท้จริง บางทีข้าอาจโน้มน้าว [target.GetHerHim] มาอยู่ข้างข้าได้จริงๆ"
 sway_outcome_blessed.1004.desc: "[ROOT.Char.Custom('FormOfAddressForLiege')|U]" [target.GetName] ประกาศ พลางโค้งคำนับอย่างลึกซึ้ง "อาจเป็นได้ว่าท่านได้รับพรจาก [ROOT.GetCharacter.GetFaith.HighGodName] จริงดังที่ใครเขาว่า หรืออาจเป็นเพียงวาจาของท่านที่บังเอิญโดนใจ แต่สิ่งที่สำคัญคือข้าซาบซึ้งใจกับการมีปฏิสัมพันธ์ของเราเมื่อเร็ว ๆ นี้ เราจำเป็นต้องประคับประคองอาณาจักรให้เป็นหนึ่งเดียวในช่วงเวลาอันสับสนวุ่นวายนี้ และข้าจะอยู่เคียงข้างท่าน""
 sway_outcome_grudgingly.1004.desc: ""[ROOT.Char.GetTitleTierName] ของข้า" [target.GetName] กล่าวอย่างไม่เต็มใจ "บัดนี้ดูเหมือนชัดเจนสำหรับข้าแล้ว ด้วยศัตรูร่วมกันอยู่รอบด้าน ว่าเราควรพยายามไว้วางใจ ซึ่งกันและกัน ดังนั้น ข้าจึงโค้งคำนับต่อหน้าท่าน และประกาศความภักดีของข้าอีกครั้ง""
 sway_outcome_flattery.1004.desc: ""โอ้ [ROOT.Char.GetTitleTierName] ผู้ยิ่งใหญ่" [target.GetName] กล่าว พลางโค้งคำนับ "ท่านผู้ ซึ่งข้าโชคดีที่ได้อยู่ใต้ร่มเงา เจ้าเหนือหัวผู้เมตตาและรุ่งโรจน์ของข้า ข้าเสียใจเพียงใดที่เคยสงสัยในตัวท่าน ข้าขอถอยห่างจากสิ่งที่ไม่พึงประสงค์ใดๆ ไม่ว่าจะจริงหรือจินตนาการ ที่ข้าเป็นที่รู้กันว่าได้กล่าวถึงท่าน""
 sway_outcome_dharmic.1004.desc: ""โอ้ [ROOT.Char.GetTitleTierName]" [target.GetName] ประกาศอย่างเคร่งขรึม "ทุกอาณาจักรต้องการผู้ปกครองที่อยู่เหนือผู้อื่น ผู้หมุนวงล้อ ผู้สามารถมองเห็นพ้นโลกแห่งเนื้อหนังและความเขลาอันไม่จีรังนี้ อาจเป็นไปได้ว่าท่านคือ [ROOT.Char.GetTitleTierName] ผู้นั้น และ ดังนั้น ข้าจะลืมความสงสัยและความทะนงตนของข้า และต่ออายุคำปฏิญาณของข้าต่อท่าน""
 sway_outcome_caliph.1004.desc: "[target.GetName] สบตาข้าเพียงครู่หนึ่ง ก่อนจะโค้งคำนับอย่างลึกซึ้ง "ท่านคือ [ROOT.Char.GetTitleTierName] เจ้าเหนือหัวของข้า และผู้นำโดยชอบธรรมแห่ง #italic อุมมะฮ์#! ข้าเคยมีความสงสัย ข้าจะไม่ปฏิเสธ แต่ข้าไม่สามารถปล่อยให้อุดมการณ์ของผู้ศรัทธาต้องตกอยู่ในอันตรายได้ ข้ายังไม่ลืมคำปฏิญาณที่ข้าให้ไว้กับท่าน และจะไม่ลังเลอีก""
 sway_outcome.1004.a: "ดีมาก... แต่ข้าจะจับตาดูเจ้าอยู่!"
 sway_outcome.1004.b: "ทุกอย่างได้รับการอภัยแล้ว"


