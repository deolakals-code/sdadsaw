 ##################################################
fp3_decision.0001.t: "จุดไฟหลวง"
fp3_decision.0001.desc_mazdakist: "แม้ว่ามาซดัก หากยังมีชีวิตอยู่ คงให้ข้าปิดเทวสถานไฟ เรียกขานมันว่าเป็นอนุสรณ์แห่งความทะนงตน แต่ข้าคือ [ROOT.Char.GetTitleTierName] และสามารถเลือกเส้นทางอื่นได้ หากข้าจะให้เกียรติแก่มรดกของเขา ข้าต้องประสาทพรแก่การปกครองของข้าด้วยไฟ ดุจเดียวกับมหาราชาในอดีต"
fp3_decision.0001.desc_khurramite: "บางทีอาจไม่มีใครควรเป็น [ROOT.Char.GetTitleTierName] ของโลกนี้ ทว่าประชาชนได้มอบตำแหน่งนี้แก่ข้า และพวกเขาสมควรได้รับการคุ้มครองจากอาตาร์ #italic ยาซาตา#! แห่งความร้อนและแสงสว่าง"
fp3_decision.0001.desc_general_zoroastrian: "บัดนี้ข้าคือ [ROOT.Char.GetTitleTierName] ข้าต้องปกครองโดยนำทางด้วยแสงแห่งความรุ่งโรจน์จากบรรพบุรุษของข้า และมุ่งมั่นที่จะได้รับความโปรดปรานจาก [ROOT.Char.GetFaith.HighGodNamePossessive]"
fp3_decision.0001_desc_ending: "ข้าจะจัดพิธีในราชสำนักเพื่อจุดไฟอันยิ่งใหญ่ใน [ROOT.Char.Custom('ResidenceBuilding')] แห่ง [ROOT.Char.GetCapitalLocation.GetTitle.GetNameNoTierNoTooltip] และขอให้มันเผาไหม้ตลอดรัชสมัยของข้า"
fp3_decision.0001_vassal_and_courtier_opinion_impressed: "ข้าราชบริพารและข้าในบังคับที่มีศรัทธาเป็นปฏิปักษ์อาจไม่ชอบสิ่งนี้ แต่คนอื่นๆ อาจจะ #italic ประทับใจอย่างยิ่ง#! "
fp3_decision.0001_vassal_and_courtier_opinion: "ข้าราชบริพารและข้าในบังคับที่มีศรัทธาเป็นปฏิปักษ์อาจไม่ชอบสิ่งนี้ แต่คนอื่นๆ จะประทับใจ"
fp3_decision.0001.a: "ข้ากำลังทำอะไรอยู่? เทวสถานควรถูกทำลาย"
fp3_decision.0001.b: "พิธีอันประณีต สมเกียรติแห่งกษัตริย์เปอร์เซีย!"
fp3_decision.0001.c: "พิธีที่เรียบง่ายก็เพียงพอแล้ว"
fp3_decision.0001.d: "เปลวไฟรอได้"
fp3_decision.0001_pledged_to_quench_fire: "การตัดสินใจนี้จะไม่สามารถใช้ได้เป็นเวลา 20 ปี"
fp3_decision.0001.a.tt: "ท่านให้คำสัตย์ปฏิญาณอันศักดิ์สิทธิ์ว่าจะดับไฟศักดิ์สิทธิ์"

fp3_decision.0002.t: "การดับไฟหลวง"
fp3_decision.0002.desc: "หายนะบังเกิด! ขณะที่กองทัพของ [occupant.GetName] เข้าปล้นสะดม [ROOT.Char.GetCapitalLocation.GetTitle.GetNameNoTierNoTooltip] และโจมตี [ROOT.Char.Custom('ResidenceBuilding')] ทหารบางส่วนของพวกเขาได้ไปถึงห้องที่เก็บไฟหลวงของข้า และดับมันอย่างชั่วร้าย สิ่งนี้อาจถูกมองว่าเป็นลางร้ายอย่างยิ่งสำหรับราชวงศ์ [ROOT.Char.GetDynastyNameNoTooltip]"
fp3_decision.0002_fire_destroyed_tt: "ข้าราชบริพารและข้าในบังคับที่เชื่อโชคลางหรือศรัทธาแรงกล้าเห็นว่านี่เป็นลางร้ายอย่างยิ่งสำหรับรัชสมัยของท่าน"
 fp3_decision.0002.a: "ไม่สำคัญหรอก มันเป็นเพียงสัญลักษณ์เท่านั้น"
 fp3_decision.0002.b: "ความโหดร้ายนี้จะต้องได้รับการล้างแค้น!"
 fp3_decision.0002.c: "ข้าควรทำอย่างไรดี?"
 
fp3_dynasty_decision.0003.t: "โครงการเปอร์เซีย"
fp3_dynasty_decision.0003.intro: "ถึงเวลาแล้วที่ประชาชนแห่ง [capital_county.GetName] จะได้ชื่นชมทัศนียภาพของโครงการก่อสร้างอาคารใหม่ที่ยิ่งใหญ่ "
fp3_dynasty_decision.0003.char: "ข้าไม่สามารถเลือกผู้รับผิดชอบที่ดีกว่านี้สำหรับภารกิจนี้ได้นอกจาก [chosen_architect.GetName] [chosen_architect.GetSheHe|U] ได้รับความไว้วางใจอย่างเต็มที่จากข้า"
fp3_dynasty_decision.0003.desc: "\n\nเราสามารถใช้ของที่ปล้นมาล่าสุดจาก [target_county.GetName] เพื่อให้แน่ใจว่าอาคารจะงดงามเพียงพอ แต่นั่นจะ ทำให้ประชาชนโกรธเคืองอย่างแน่นอน\n\nอีกทางหนึ่ง ข้าสามารถให้ทุนสนับสนุนภารกิจนี้อย่างเมตตาจากคลังสมบัติของข้าเอง..."
fp3_dynasty_decision.0003.a: "ให้ประชาชนแห่ง [target_county.GetNameNoTierNoTooltip] แสดงความภักดีของพวกเขา!"
fp3_dynasty_decision.0003.b: "ข้าจะให้ทุนสนับสนุนกิจการนี้ด้วยตนเอง"
fp3_dynasty_decision.0003.c: "คิดดูอีกที บางทีอาจเป็นวันอื่น"
cultural_acceptance_built_magnificent_capital: "โครงการก่อสร้างท้องถิ่นอันงดงาม"

splurge_above_expectations_toast: "โครงการเกินความคาดหมาย"
splurge_as_expected_toast: "โครงการเป็นไปตามแผน"

fp3_dynasty_decision.0004.t: "ความทะเยอทะยานทางสถาปัตยกรรม"
fp3_dynasty_decision.0004.intro: "[chosen_architect.GetFirstName] กำลังทำงานอย่างขยันขันแข็ง รวบรวมแรงงานสำหรับโครงการใหม่ของเรา"
fp3_dynasty_decision.0004.plunder.desc: "ทรัพยากรและคนงานกำลังถูกขนส่งมาจาก [target_county.GetNameNoTier] เป็นจำนวนมาก"
fp3_dynasty_decision.0004.desc: ""ทุกอย่างใกล้จะเข้าที่แล้ว [ROOT.Char.Custom('FormOfAddressForLiege')]" [chosen_architect.GetSheHe] ประกาศ "แต่จะสร้างสิ่งใดดีหรือ?"\n\n"ข้าคิดถึงสุสานหลวงอันยิ่งใหญ่ ที่หุ้มด้วยไพฑูรย์จากเหมืองซาร์-อิ ซาง หรืออาจจะปรับปรุง [ROOT.Char.Custom('ResidenceBuilding')] ของท่านในรูปแบบดั้งเดิม ซึ่งย่อมสร้างความประทับใจให้แก่ราษฎรของท่านใน [capital_province.GetNameNoTooltip] เป็นแน่ เรายังสามารถขยาย #italic คานัต#! น้ำพุ และโรงอาบน้ำของเรา และตก แต่งมันอย่างหรูหรา" \n\n"ท่านประสงค์สิ่งใดมากกว่าหรือ [ROOT.Char.GetTitleTierName]?""
fp3_dynasty_decision.0004.a: "สุสานหลวงสำหรับราชวงศ์ [ROOT.Char.GetDynastyNameNoTooltip]"
fp3_dynasty_decision.0004.b: "ปรับปรุง [ROOT.Char.Custom('ResidenceBuilding')] ของข้า"
fp3_dynasty_decision.0004.c: "โรงอาบน้ำและน้ำพุที่ตก แต่งอย่างสวยงาม"
every_house_member: "สมาชิกทุกคนของตระกูล [root_scope.MakeScope.Char.GetHouse.GetBaseNameNoTooltip] [house|E]"

fp3_dynasty_decision.0005.t: "วิสัยทัศน์แห่งความงดงาม"
fp3_dynasty_decision.0005.desc: "รอยคล้ำใต้ตาถ่วงใบหน้าที่ปกติสดใสของ [chosen_architect.GetName] [chosen_architect.GetSheHe|U] ทำงานหนักมาทั้งคืน เพื่อร่างแผนสำหรับเครื่องประดับตก แต่งแห่งอนาคตของ [capital_province.GetName]\n\n"ข้าจินตนาการถึง โรงอาบน้ำฮัมมัมที่สวยงาม [ROOT.Char.Custom('FormOfAddressForLiege')] หุ้มด้วยกระเบื้องเซรามิกหลากสีสัน ภายในมีพื้นโมเสก ห้องอบไอน้ำ สระน้ำเย็น และต้นไม้เขียวชอุ่มที่ปลูกในกระถางเครื่องเคลือบจีน..."\n\n"... แต่หากท่านประสงค์จะได้ [ROOT.Char.GetFaith.HouseOfWorship] หรือพระราชวังขนาดเล็ก ข้าก็จะร่างแผนใหม่ให้แน่นอน""
fp3_dynasty_decision.0005.a: "ฮัมมัมฟังดูน่ารักดี"
fp3_dynasty_decision.0005.b: "ข้าอยากได้ [ROOT.Char.GetFaith.HouseOfWorship] มากกว่า"
fp3_dynasty_decision.0005.c: "[ROOT.Char.GetWomanMan] จะมีพระราชวังมากเกินไปได้หรือ?"
fp3_decisons_closer_to_love.tt: "ท่านและ [chosen_architect.GetFirstNameNoTooltip] ใกล้ชิดกันมากขึ้น"

fp3_dynasty_decision.0007.t: "การก่อสร้างของนักบวช"
fp3_dynasty_decision.0007_desc_beginning: "[chosen_architect.GetTitledFirstName] ไม่เสียเวลาในการเริ่มร่างแผนสำหรับส่วนเพิ่มเติมใหม่ใน [capital_province.GetName]\n\n"เราสามารถสร้าง [ROOT.Char.GetFaith.HouseOfWorship] ใหม่ได้" [chosen_architect.GetSheHe] แนะนำ "พร้อมซุ้มประตูอันงดงามและส่วนหน้าอาคารหินอ่อนในสไตล์เปอร์เซียล่าสุด"\n\n"
fp3_dynasty_decision.0007_dakhma: ""หรือดัคมา หอคอยแห่งความเงียบ ที่ ซึ่งผู้ตายอาจพักผ่อนอย่างเงียบสงบจนกว่า [ROOT.Char.Custom('GetRegionalEagleType')] จะลงมาเพื่อกินเลี้ยง แต่เราจะสร้างมันให้ยิ่งใหญ่ และสวยงามในความสง่างามอันเคร่งขรึมของมัน จนแม้ แต่นกกินซากก็ยังต้องหยุดเพื่อชื่นชม"\n\n"
fp3_dynasty_decision.0007_madrasa: ""หรือมาดราซาขนาดใหญ่ พร้อมห้องอันเงียบสงบสำหรับการศึกษาและการใคร่ครวญ สถานที่รวมตัวของ [ROOT.Char.Custom('LevyMenWomen')] ผู้คงแก่เรียนจากทุกชนชาติในแผ่นดิน"\n\n"
fp3_dynasty_decision.0007_outro: ""อีกทางเลือกหนึ่ง ภาพปูนเปียกเล่าเรื่องอันยิ่งใหญ่ตามแนวกำแพงตะวันออก สอดแทรกเนื้อหาทางศาสนาเข้ากับประวัติศาสตร์ของตระกูล [ROOT.Char.GetDynastyNameNoTooltip] คงจะน่าทึ่งมาก!""
fp3_dynasty_decision.0007.a: "ข้าต้องการ [ROOT.Char.GetFaith.HouseOfWorship] หากท่านสามารถ ทำให้มันยิ่งใหญ่ได้อย่างแท้จริง"
fp3_dynasty_decision.0007.b: "สร้างดัคมา เพื่อให้เราสามารถให้เกียรติผู้ตายได้อย่างปลอดภัย"
fp3_dynasty_decision.0007.c: "มาดราซาใหม่จะช่วยปรับปรุงอาณาจักรได้อย่างแน่นอน"
fp3_dynasty_decision.0007.d: "ข้าอยากเห็นภาพปูนเปียกนั้น..."

fp3_dynasty_decision.0008.t: "อนุสาวรีย์แด่ตัวข้าเอง"
fp3_dynasty_decision.0008.desc: "ข้าใช้เวลาหลายชั่วโมงในความสันโดษ ร่างแบบสำหรับการปรับปรุง [capital_province.GetName]\n\nแน่นอนว่าโครงการนี้จะดีขึ้นเมื่อเป็นผลผลิตจากความคิดของข้าเพียงผู้เดียว แทนที่จะเป็นคนกลางที่เข้ามายุ่งและข้าราชบริพารที่ประจบสอพลอ แต่มันจะกลายเป็นอะไร?\n\nข้ามองลงไปที่บันทึกของข้า เห็นแบบที่มีแนวโน้มสามแบบ ข้าสามารถ..."
fp3_dynasty_decision.0008.a: "ตก แต่งและขยายตลาดสด"
fp3_dynasty_decision.0008.b: "สร้างจัตุรัสและบ่อน้ำอันยิ่งใหญ่"
fp3_dynasty_decision.0008.c: "สร้างสุสานหลวงขนาดใหญ่ สำหรับเมื่อถึงเวลาของข้า"
fp3_dynasty_decision.0008.d: "ออกแบบโรงอาบน้ำที่หรูหรา"
fp3_dynasty_decision.0008.e: "สร้างหอสังเกตการณ์สูงตระหง่านเป็นประกาย"
fp3_dynasty_decision.0008.f: "สร้างพระราชวังฤดูร้อนที่ผ่อนคลาย"
fp3_dynasty_decision.0008.g: "เปิด [ROOT.Char.GetFaith.HouseOfWorship] อันน่าอัศจรรย์"

 fp3_decision.0003.t: "ป้อมปราการแห่งบัดด์"
 fp3_decision.0003.desc_recently: "เพียงไม่กี่ทศวรรษที่ผ่านมา ในช่วงที่การกบฏของคุรรัมไมต์ต่อต้านอับบาซิดถึงขีดสุด บาบัก ผู้นำชาวนา ได้ตั้งมั่นตนเองและผู้ติดตามในป้อมปราการปาร์เธียนโบราณ นั่นกลายเป็นการยืนหยัดครั้งสุดท้ายของเขา แต่อับบาซิดต้องจ่ายราคาแพงสำหรับชัยชนะของพวกเขา"
 fp3_decision.0001.desc_less_recently: "ในยุคแรกของกาหลิบอับบาซิด กองทัพของพวกเขาไล่ตาม บาบัก ผู้นำคุรรัมไมต์ ไปยังป้อมปราการสูงบนภูเขาในป่าอารัสบารัน ที่ ซึ่งเขาทำการยืนหยัดครั้งสุดท้าย แม้ว่าซากปรักหักพังจะสึกกร่อนไปตามกาลเวลาในช่วงหลายปีที่ผ่านมา สถานที่แห่งนี้ยังคงน่าประทับใจ และจะกลายเป็นฐานที่มั่นอันยิ่งใหญ่"
 fp3_decision.0001.desc_long_ago: "สูงขึ้นไปในเทือกเขาสีดำแห่งป่าอารัสบารัน ซากป้อมปราการตั้งอยู่บนยอดเขาที่ปกคลุมด้วยหิมะ รังอินทรีแห่งนี้เคยเป็นที่ยืนหยัดครั้งสุดท้ายของ บาบัก วีรบุรุษคุรรัมไมต์ เมื่อนานมาแล้ว และข้าจะฟื้นฟูมันให้กลับมารุ่งโรจน์ดังที่อาจเคยเป็นในสมัยโบราณ"
 fp3_decision.0003.desc_khurramite: "[ROOT.Char.GetFaith.GetAdherentNamePluralNoTooltip] ในท้องถิ่นเห็นอกเห็นใจในความพยายามของข้าอย่างยิ่ง และได้ให้คำมั่นว่าจะช่วยข้าฟื้นฟูและรักษาความปลอดภัยของสถานที่แห่งนี้\n\n"
 fp3_decision.0003.desc_zandik: "ชาวนาและคนเลี้ยงสัตว์ในภูเขาที่ขรุขระเหล่านี้ขึ้นชื่อเรื่องความไม่เชื่อฟัง แต่พวกเขาเกลียดชังนักบวช [ROOT.Char.GetFaith.GetReligion.GetAdjectiveNoTooltip] เก่าแก่ และได้ให้สัญญากับข้าว่าจะสนับสนุน\n\n"
 fp3_decision.0003.desc_fallback: "ประชากรในท้องถิ่นชอบสงครามและมีแนวโน้มที่จะก่อกบฏ แต่พวกเขาชื่นชอบความทรงจำเกี่ยวกับบาบัก ซึ่งประดิษฐานอยู่ในตำนานและบทเพลง และจะช่วยข้าในการสร้างบ้านบนภูเขาเก่าของเขาขึ้นใหม่\n\n"
 fp3_decision.0003.desc_ending: "ถึงเวลาแล้วที่จะสถาปนาที่พำนักใหม่สำหรับตระกูล [ROOT.Char.GetDynastyHouseNameNoTooltip] และขอให้มันคงอยู่ยืนยาว!"
 fp3_decision.0003.a: "ข้าเห็นหนทางที่จะชดเชยค่าใช้จ่ายบางส่วน..."
 fp3_decision.0003.b: "มันจะเป็นป้อมปราการอันยิ่งใหญ่!"
 fp3_decision.0003.c: "ข้าไม่ต้องการความรุ่งโรจน์ เพียงแค่ป้อมปราการที่มั่นคง"

 fp3_decision.0004.t: "ศรัทธาเพื่อปวงชน"
 fp3_decision.0004_alternate.t: "ดับไฟนิรันดร์"
 fp3_decision.0004_desc: "เป็นเวลานานแล้วที่พวกเรา [ROOT.Char.GetFaith.GetAdherentNamePluralNoTooltip] เดินตามทางของเราเอง และบูชา [ROOT.Char.GetFaith.HighGodName] ในลักษณะที่เหมาะสมกับหัวใจของเราที่สุด แม้ แต่ในยุครุ่งเรืองในอดีต เราก็ไม่ต้องการ [ROOT.Char.GetFaith.random_AltPriestTermPlural] ชั้นสูงและพิธีกรรมอันซับซ้อนของพวกเขา และบัดนี้เราอยู่ในโลกที่แตกต่าง มีผู้ท้าทายมากมายต่อศรัทธาที่ถูกคุกคามของเรา และความจำเป็นในการปฏิรูปไม่เคยยิ่งใหญ่เท่านี้มาก่อน นับจากนี้ไป นักบวชจะใกล้ชิดกับประชาชนมากขึ้น เราจะสร้างอนาคตของเราเองด้วยตำแหน่ง [ROOT.Char.GetFaith.PriestNeuter] ที่เปิดให้ทุกคนที่ได้รับความไว้วางใจจากชุมชน"
 fp3_decision.0004_alternate_desc: "เป็นเวลานานแล้วที่ [ROOT.Char.GetFaith.random_AltPriestTermPlural] ข่มเหงพวกเรา [ROOT.Char.GetFaith.GetAdherentNamePluralNoTooltip] เป็นเวลานานแล้วที่พวกเขายึดติดกับไฟศักดิ์สิทธิ์ อำนาจและทรัพย์สมบัติที่สืบทอดมา จากภายนอกศรัทธาของเรา ผู้อื่นมองการปฏิบัติที่ล้าสมัยเหล่านี้ด้วยความดูถูกมานานแล้ว พอแล้ว! ภายใน [ROOT.Char.GetFaith.GetNameNoTooltip] [ROOT.Char.GetFaith.HouseOfWorshipPlural] จะถูกปิด และไฟนิรันดร์จะถูกดับตลอดไป สิ่งนี้จะทำลายอำนาจของ [ROOT.Char.GetFaith.random_AltPriestTermPlural] และประกาศการเริ่มต้นใหม่สำหรับ [ROOT.Char.GetFaith.GetReligion.GetNameNoTooltip] จากนี้ไป เราจะไม่ถูกนำโดย [ROOT.Char.Custom('DefaultPriestWomenMen')] ที่เป็นมนุษย์ — เพียง แต่โดย [ROOT.Char.GetFaith.HighGodName] เท่านั้น"
 fp3_decision.0004.a: "สิ่งนี้จะเปิดประตูมากมาย...สำหรับข้า!"


 fp3_decision.0004.b: "และขอให้เถ้าถ่านกลายเป็นเถ้าเย็น!"
 fp3_decision.0004.c: "แม้ แต่คนยากจนก็สามารถเป็นนักบวชได้แล้ว"
 fp3_decision.0004.d: "นี่เป็นเพื่อประโยชน์ของทุกคน"
 fervor_gain_magi_destroyed: "นักปราชญ์ได้รับการปฏิรูป"
 destroy_the_magi_opinion_tooltip: "ผู้ปกครอง [root_religion.GetAdjective] ที่มีความเชื่อที่ไม่สุดโต่งจะรู้สึกไม่พอใจอย่างยิ่งกับสิ่งนี้"
 replace_the_high_priest_effect_tooltip: "[head_of_faith|E] เปลี่ยนจาก [GetFaithDoctrine('doctrine_temporal_head').GetBaseName] เป็น [GetFaithDoctrine('doctrine_no_head').GetBaseName]"

 fp3_decision.0008.t: "อ้างสิทธิ์ในแสงสว่าง"
 fp3_decision.0008.desc: "[founder.GetFaith.GetAdherentNamePlural] ที่ถูกคุกคามได้ต่อสู้อย่างเปล่าประโยชน์มานาน ขาดการนำทางที่ถูกต้อง บัดนี้ความอัปยศของพวกเขาสิ้นสุดลงแล้ว เพราะข้าได้อ้างสิทธิ์ใน #italic วะลายะฮ์#! การพิทักษ์ผู้ศรัทธา และ #italic นูรุน อะลา นูร#! แห่ง [ROOT.Char.GetFaith.HighGodNameAlternate] ข้าจะนำพวกเขาด้วยทักษะและวิสัยทัศน์ทั้งหมดที่ [ROOT.Char.GetFaith.HighGodNameAlternate] ในพระปรีชาญาณของ [ROOT.Char.GetFaith.HighGodHerHis] เห็นสมควรที่จะมอบให้ข้า และลูกหลานของข้าจะทำ เช่นนั้นหลังจากข้า ขอให้สิ่งนี้ประกาศการเริ่มต้นใหม่สำหรับ [founder.GetFaith.GetAdherentNamePluralNoTooltip]!"
 fp3_decision.0008.a: "นี่จะเป็นหน้าที่และภาระของข้า"
 fp3_decision.0008.b: "ขอให้แสงสว่างอันไร้ความร้อนส่องสว่างแก่ตระกูลของข้า!"

 fp3_decision.0009.t: "[founder.GetFaith.ReligiousHeadName] คนใหม่"
 fp3_decision.0009.desc: "[founder.GetFirstName] ได้รับเอา [founder.GetHerselfHimself] หน้าที่ในการอ้างสิทธิ์ในตำแหน่ง [founder.GetFaith.ReligiousHeadName] สำหรับ [founder.GetFaith.GetAdherentNamePlural] และดูเหมือนว่าผู้ติดตาม [founder.GetHerHis] จำนวนมากกำลังสนับสนุนการเคลื่อนไหวที่กล้าหาญนี้ พวกเขากล่าวว่า [founder.GetSheHe] ครอบครอง #italic วาลายะฮ์#! ซึ่งเป็นการนำทางอันลึกลับของ [ROOT.Char.GetFaith.HighGodNameAlternate] ที่ช่วยให้ [founder.GetHerHim] สามารถนำทางผู้ศรัทธาได้ แม้ว่าปัจจุบันข้าอาจจะไม่อยู่ในฐานะที่จะท้าทายการอ้างสิทธิ์นี้โดยตรง ในฐานะหนึ่งในบุคคลสำคัญของ [founder.GetFaith.GetNameNoTooltip] ความคิดเห็นของข้าจะมีความสำคัญ ข้าควรยอมรับ [founder.GetFirstNameNoTooltip] เป็นผู้นำคนใหม่ของผู้ศรัทธา หรือคัดค้าน [founder.GetHerHim] อย่างสุขุม?"
 fp3_decision.0009.a: "[founder.GetTitledFirstNameNoTooltip] จะพิสูจน์ตนว่าคู่ควรอย่างแน่นอน"
 fp3_decision.0009.b: "นี่คือเรื่องน่าขัน"
 fp3_decision.0009.a.tt: "ท่านยอมรับ [founder.GetFaith.ReligiousHeadName] นี้อย่างสุดใจ"
 fp3_decision.0009.b.tt: "ท่านยอมจำนนอย่างเงียบๆ...สำหรับตอนนี้"
 fp3_decision.0009.c: "[founder.GetFaith.GetAdherentNamePluralNoTooltip] สมควรได้รับผู้นำที่แท้จริง..."

 fp3_decision.0010.t: "[founder.GetFaith.ReligiousHeadName] คนใหม่"
 fp3_decision.0010.desc: "[founder.GetFirstName] ได้รวบรวมการสนับสนุนและความศรัทธาที่รับรู้ได้เพียงพอที่จะ แต่งตั้ง [founder.GetHerselfHimself] เป็น [founder.GetFaith.ReligiousHeadName] ของ [founder.GetFaith.GetAdherentNamePlural] ในขณะที่ชาวชีอะฮ์บางคนเฉลิมฉลองสิ่งนี้ว่าเป็นชัยชนะเล็กๆ สำหรับความเชื่อของพวกเขาใน #italic อิสมะฮ์#! ความไม่เสื่อมทรามของ [founder.GetFaith.ReligiousHeadTitleName] $islam_religion_adherent_plural$ ที่มีใจรักชุมชนมากกว่ากลับคร่ำครวญถึงการปรากฏตัวของรอยร้าวอีกแห่งในอุมมะฮ์ ในขณะเดียวกัน [founder.GetFaith.GetAdherentNamePluralNoTooltip] ดูเหมือนจะสุดโต่งกว่าที่เคย"
 fp3_decision.0010.a: "ข้าต้องคิดเกี่ยวกับเรื่องนี้..."
 fp3_decision.0010.b: "ข้าควรระแวดระวัง..."


 fp3_decision.0011.t: "ล้างแค้นให้ผู้พลีชีพของเรา"
 fp3_decision.0011_opening.desc: "นานมาแล้ว การต่อต้านอย่างแข็งขันของมุฮักกิมะฮ์ต่อการประนีประนอมอันขี้ขลาดของ [ali.GetFirstNamePossessive] ผู้ยิ่งใหญ่ในอดีตกับ [muawiya.GetFirstName] ผู้ช่วงชิง ทำให้เราเป็นที่รังเกียจของทั้งซุนนีและชีอะฮ์ ตั้งแต่นั้นมา #italic ฟิดายีน#! ของเราได้สละชีวิตเพื่อสังหารคนทรยศและผู้ละทิ้งศาสนา และนำมุฮักกิมะฮ์กลับคืนสู่ความโดดเด่น\n\nบัดนี้ วันนั้นได้มาถึงแล้ว — กาหลิบผู้ทรยศได้ล่มสลายลง และโดยมีข้าเป็นผู้นำ [ROOT.Char.GetFaith.GetAdherentNamePlural] ได้ยึดคืนเมโสโปเตเมียและสถานศักดิ์สิทธิ์โบราณของเรา"
 fp3_decision.0011_fanatic_murderer.desc: "ในไม่ช้า ทั้งหมดของ [ROOT.Char.GetFaith.GetReligion.GetName] จะเพิกถอนความเชื่อที่ผิดๆ ของพวกเขา และเข้าร่วมอุดมการณ์อันชอบธรรมของเรา — หรือตาย!"
 fp3_decision.0011_unfanatic_unmurderer.desc: "ในไม่ช้า นักปราศรัยและกวีผู้ยิ่งใหญ่ของเราจะได้ยินไปทั่วทั้งอุมมะฮ์ และเปลี่ยนใจผู้คนนับไม่ถ้วนมาสู่อุดมการณ์อันชอบธรรมของเรา"
 fp3_decision.0011.a: "ลา ฮุกมะ อิลลา ลิลลาฮ์!"

 fp3_decision.0012.t: "การเรืองอำนาจของ [avenger.GetFaith.GetNameNoTooltip]"
 fp3_decision.0012.desc: "[avenger.GetName] ได้รวบรวมการสนับสนุนและความศรัทธาเพียงพอที่จะริเริ่มการสนับสนุน [avenger.GetFaith.GetAdherentName] อย่างท่วมท้นในพื้นที่ส่วนใหญ่ของโลกมุสลิม มีข่าวลือว่าผู้ปกครองและเมืองจำนวนมากได้เปลี่ยนมานับถือศรัทธาของ [avenger.GetHerHis] ไม่ว่าจะเต็มใจหรือไม่ก็ตาม และมีเพียง [ROOT.Char.GetFaith.HighGodName] เท่านั้นที่รู้ว่า [avenger.GetSheHe] วางแผนอะไรต่อไป"
 fp3_decision.0012.a: "นี่เป็นวันที่ยิ่งใหญ่สำหรับอิสลาม!"
 fp3_decision.0012.b: "นี่มันน่ากลัว..."

 fp3_decision.0013.t: "การคัดค้านของ [ROOT.Char.GetFaith.GetReligiousHeadTitle.GetAdjectiveNoTooltip]"
 fp3_decision.0013.desc: "ทูตของ [ROOT.Char.GetFaith.GetReligiousHeadTitle.GetNamePossessive] [hof_emissary.GetName] ดูไม่พอใจอย่างยิ่ง ซึ่งอาจบ่งบอกถึงความรู้สึกของ [righteous_caliph.GetTitledFirstNamePossessive] เองในเรื่องนี้\n\n"[righteous_caliph.GetFaith.ReligiousText] ถูกเปิดเผยต่อโลกเป็นภาษาอาหรับ และจะไม่มีการอ่านในภาษาอื่นใด" [hof_emissary.GetFirstNameNoTooltip] ประกาศ "และจะไม่มีหนังสือหรือม้วนกระดาษหรือแผ่นขี้ผึ้งอื่นใดในเรื่องของศรัทธา ตราบใดที่นายของข้า [righteous_caliph.GetTitleTierName] ผู้ยิ่งใหญ่ ยังคงหายใจอยู่ [righteous_caliph.GetSheHe|U] เรียกร้องให้ท่านยุติความพยายามในการแปลที่ผิดพลาดของท่านในทันที และตัดความสัมพันธ์ที่ท่านได้ทำไว้กับนักวิชาการที่ดูหมิ่นศาสนา" [hof_emissary.GetSheHe|U] หยุดชั่วคราว\n\n"แต่อย่าสิ้นหวัง [righteous_caliph.GetTitleTierName] ในความเมตตาของ [righteous_caliph.GetHerHis] จะจ่ายคืนทองคำส่วนใหญ่ที่ท่านได้ใช้ไปกับเรื่องน่าขันนี้ให้แก่ท่าน""
 fp3_decision.0013.a: "อนิจจา เส้นทางของข้าได้ถูกกำหนดแล้ว"
 fp3_decision.0013.b: "ดีมาก ข้าจะกลับนโยบาย"

 fp3_decision.0014.t: "ความภาคภูมิใจของเปอร์เซีย"
 fp3_decision.0014_opening.desc: "แม้ว่าการอุปถัมภ์ของข้าเพิ่งจะเริ่มต้น แต่ #italic อุลามะอ์#! บางคนใน [ROOT.Char.GetCapitalLocation.GetTitle.GetNameNoTierNoTooltip] ได้เริ่มผลิตผลงานในภาษาท้องถิ่นแล้ว และ [persian_genius_ulama.GetName] ดูเหมือนจะกระตือรือร้นเป็นพิเศษ\n\n"ข้าสนับสนุนเรื่องนี้มานานแล้ว" [persian_genius_ulama.GetSheHe] กล่าว "ความยิ่งใหญ่ของ [ROOT.Char.GetFaith.GetReligion.GetName] สร้างขึ้นจากการผสมผสานระหว่างความกล้าหาญของชาวอาหรับกับความประณีตและความรู้ของชาวเปอร์เซีย และถึงเวลาแล้วที่เปอร์เซียจะทวงคืนบทบาทของตนในฐานะประทีปแห่งการรู้แจ้งทางจิตวิญญาณ ข้าได้แปลและให้ความเห็นเกี่ยวกับหะดีษจำนวนมากแล้ว และยังได้ค้นพบผลงานที่สูญหายบางส่วนของฮะซัน อัลบัศรีเอง ซึ่งเก็บรักษาไว้ในห้องสมุดเก่าแก่แห่งกุนเดชาปูร์..."\n\n"
 fp3_decision.0014_there_is_caliph.desc: "ในขณะเดียวกัน [uncaring_caliph.GetTitledFirstName] ยังคงเงียบ เฝ้าดูการพัฒนาเหล่านี้ด้วยความหวาดหวั่น"
 fp3_decision.0014_no_caliph.desc: "ข้ามองไปที่ [persian_genius_ulama.GetWomanMan] ผู้ทะเยอทะยานคนนี้ บางทีข้าอาจใช้ประโยชน์จาก [persian_genius_ulama.GetHerHim] ได้ดีกว่านี้?"
 fp3_decision.0014.a: "นี่ฟังดูมีแนวโน้ม!"
 fp3_decision.0014.b: "เจ้าควรอยู่และทำงานให้ข้าโดยตรง"
 promote_persian_scripture_cannot_take_decision.tt: "ท่านจะไม่สามารถทำการตัดสินใจ [decision|E] นี้ได้อีกเป็นเวลา 30 ปี"
 pledged_to_not_promote_persian_desc: "ท่านได้ให้คำมั่นว่าจะไม่ส่งเสริมคัมภีร์เปอร์เซีย"

 fp3_decision.0015.t: "ประกาศ ณ การละหมาดวันศุกร์"
 fp3_decision.0015.desc.switch.supporter_becoming_detractor: "ข้าได้ประกาศว่านับจากนี้ไป ในดินแดนของข้า ชื่อของ [ROOT.Char.GetFaith.GetReligiousHead.GetTitledFirstNamePossessive] จะถูกอ่านเป็นลำดับสุดท้ายในระหว่างการละหมาดวันศุกร์ เมื่อ [ROOT.Char.Custom('LevyMenWomen')] ทั้งหมดของอาณาจักรมาชุมนุมกันใน [ROOT.Char.GetFaith.HouseOfWorshipPlural] ท้องถิ่นของพวกเขา\n\nสัญญาณที่ชัดเจนของการแบ่งแยกนี้จะ ทำให้เหล่าลูกสมุนที่ข้าทิ้งไว้เบื้องหลังโกรธเคืองอย่างแน่นอน แต่ใครเล่าจะสนใจความคิดเห็นของคนประจบสอพลอ?\n\n"
 fp3_decision.0015.desc.switch.detractor_becoming_supporter: "ข้าได้ประกาศว่านับจากนี้ไป ในดินแดนของข้า ชื่อของ [ROOT.Char.GetFaith.GetReligiousHead.GetTitledFirstNamePossessive] จะถูกอ่านเป็นอันดับแรกและสำคัญที่สุดในระหว่างการละหมาดวันศุกร์\n\nเนื่องจากนี่คือเวลาที่ [ROOT.Char.Custom('LevyMenWomen')] ของอาณาจักรมาชุมนุมกันใน [ROOT.Char.GetFaith.HouseOfWorshipPlural] ท้องถิ่นของพวกเขาเพื่อการสักการะ มันควรจะทำหน้าที่เป็นเครื่องหมายที่ชัดเจนของการยอมจำนนโดยสมัครใจและการสนับสนุนของข้าเพื่อความสามัคคีของกาหลิบ\n\n"
 fp3_decision.0015.desc.switch.presently_neutral: "ผู้ปกครองรอบตัวข้ากำลังเลือกข้าง ไม่ว่าจะสนับสนุนความสามัคคีของ [ROOT.Char.GetFaith.GetReligiousHeadTitle.GetName] หรือยืนยันความเป็นอิสระของตน\n\nแม้ว่าปัจจุบันข้าจะยังไม่ได้ประกาศจุดยืน การเปลี่ยนจุดยืนของข้าเป็นเรื่องง่าย ข้าเพียงแค่ต้องประกาศว่าชื่อของ [ROOT.Char.GetFaith.GetReligiousHead.GetTitledFirstNamePossessive] จะถูกอ่านเป็นอันดับแรกหรือสุดท้ายในระหว่างการละหมาดวันศุกร์ — ต่อหน้า [ROOT.Char.Custom('LevyMenWomen')] ที่มาชุมนุมกันของอาณาจักร ณ [ROOT.Char.GetFaith.HouseOfWorshipPlural] ท้องถิ่นของพวกเขา\n\n"
 fp3_decision.0015.desc.liege.presently_neutral: "ไม่ต้องสงสัยเลยว่า [ROOT.Char.GetLiege.GetTitledFirstName] เจ้าเหนือหัวของข้าหวังว่าข้าตั้งใจจะดำเนินรอยตาม [ROOT.Char.GetLiege.GetHerHis] ในประเด็นนี้"
 fp3_decision.0015.desc.liege.aligning: "โชคดีที่สิ่งนี้นำข้าไปสู่การสอดคล้องอย่างสมบูรณ์แบบกับ [ROOT.Char.GetLiege.GetTitledFirstName] เจ้าเหนือหัวของข้า ผู้ ซึ่งมีความเชื่อใหม่ เช่นเดียวกับข้า"
 fp3_decision.0015.desc.liege.contradicting: "ถึงกระนั้น ก็น่ากังวลว่า [ROOT.Char.GetLiege.GetTitledFirstName] เจ้าเหนือหัวของข้า ไม่ได้มีจุดยืน เช่นเดียวกับข้า และมีแนวโน้มที่จะคิดไม่ดีเกี่ยวกับจุดยืนใหม่ของข้า"
 fp3_decision.0015.desc.liege.fallback: "แม้จะมีความสำคัญอย่างยิ่งต่อตัวข้าเองและ [ROOT.Char.GetFaith.GetReligiousHead.GetTitledFirstNameNoTooltip] ข้าสงสัยว่า [ROOT.Char.GetLiege.GetTitledFirstName] เจ้าเหนือหัวของข้า จะสนใจการเมืองภายในของซุนนี เช่นนี้มากนัก"
 fp3_decision.0015.a: "ข้าสนับสนุน [ROOT.Char.GetFaith.GetReligiousHead.GetTitleAsNameNoTooltip] ของข้า แต่ไม่ใช่ [ROOT.Char.GetLiege.GetTitleAsNameNoTooltip] ของข้า"
 fp3_decision.0015.a.tt: "ชื่อของท่านถูกอ่านแทน [ROOT.Char.Custom2('YourCharacterIntroduction', ROOT.Char.GetLiege)]"
 fp3_decision.0015.b: "[ROOT.Char.GetFaith.GetReligiousHead.GetTitledFirstNameNoTooltip] ได้รับความภักดีจากข้า!"
 fp3_decision.0015.c: "ข้าสำคัญกว่าคนโง่ทั้งสองคนนี้"
 fp3_decision.0015.c.tt: "$fp3_decision.0015.a.tt$"
 fp3_decision.0015.d: "ตำแหน่งของ [ROOT.Char.GetFaith.GetReligiousHead.GetHerHis|U] อยู่ที่ [ROOT.Char.GetFaith.GetReligiousHead.GetCapitalLocation.GetTitle.GetNameNoTierNoTooltip] ไม่ใช่ [ROOT.Char.GetCapitalLocation.GetTitle.GetNameNoTierNoTooltip]"
 fp3_decision.0015.e: "บางทีชื่อของข้าควรจะแทนที่ชื่อเจ้าเหนือหัวของข้า..."
 fp3_decision.0015.e.tt: "$fp3_decision.0015.a.tt$"
 fp3_decision.0015.f: "ข้าได้ทำสิ่งที่กล้าหาญที่นี่"
 fp3_decision.0015.vassal_semi_rebel: "ข้าในบังคับดูหมิ่นอำนาจปกครองของท่าน"

 fp3_misc_decisions.0010.opening: "ถึงผู้บัญชาการของผู้ศรัทธา,"
 fp3_misc_decisions.0010.desc_intro: "ข้าจะรู้สึกเป็นเกียรติอย่างยิ่งที่ได้รับรองรัชสมัยอันประเสริฐและเปี่ยมคุณธรรมของท่านเหนือโลกนี้"
 fp3_misc_decisions.0010.desc_struggle: "ขอ [recipient.GetFaith.HighGodName] อวยพรความพยายามของท่านในการต่อสู้กับเหล่ากบฏชั่วร้ายที่คุกคามการปกครองของท่าน"
 fp3_misc_decisions.0010.a: "ยอดเยี่ยม"

 fp3_misc_decisions.0011.desc: "แม้ว่าข้าจะยอมรับท่านในฐานะ [recipient.GetFaith.ReligiousHeadName] โดยชอบธรรมของข้า แต่ข้าไม่สามารถปฏิบัติตามข้อเรียกร้องของท่านได้"
 fp3_misc_decisions.0011.a: "เจ้าคนนอกรีตชั่วร้าย!"

 fp3_misc_decisions.0015.t: "เข้ารีตโซโรอัสเตอร์"
 fp3_misc_decisions.0015.desc: "ไม่ว่าจะเกิดอะไรขึ้น ข้าจะปฏิบัติตามคำสอนของ $zoroastrianism_good_god_zoroaster$ และปกป้องจากการทำลายล้างของ $zoroastrianism_devil_name$ แต่ในยามที่ข้าต้องการความช่วยเหลือ ศรัทธาใดที่ข้าจะเรียกว่าเป็นของตนเอง?"
 fp3_misc_decisions.0015.a: "ข้าจะปฏิบัติ [zoroastrian_faith_1.GetName]"
 fp3_misc_decisions.0015.b: "[zoroastrian_faith_2.GetName|U] คือตัวเลือกที่ชัดเจน"
 fp3_misc_decisions.0015.c: "หัวใจของข้าอยู่กับ [zoroastrian_faith_3.GetName]"

 fp3_misc_decisions.0020.t: "เผชิญหน้าคำท้า: ตระกูล [ROOT.Char.GetHouse.GetBaseNameNoTooltip]"
 fp3_misc_decisions.0020.desc.a: "บอบช้ำและฟกช้ำ [recipient.GetFirstName] ได้เข้าใจแล้วว่า [recipient.GetSheHe] ต้องหลีกทางให้กับผู้ที่สามารถกุมอำนาจตระกูลของเราได้แข็งแกร่งกว่า\n\nความแข็งแกร่งเพียงอย่างเดียวไม่ได้ ทำให้ข้าคู่ควร ในท้ายที่สุด มันคือความมุ่งมั่นของข้าที่จะนำตระกูล [ROOT.Char.GetHouse.GetBaseName] ไปสู่ความยิ่งใหญ่ — อย่างที่ [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('recipient'))] ผู้ใจเสาะของข้าไม่เคยทำได้ — ที่นำมา ซึ่งชัยชนะในวันนี้"
 fp3_misc_decisions.0020.desc.a.lethal: "[recipient.GetFirstName] รอยด่างพร้อยบนชื่อเสียงของตระกูลเรา ตายแล้ว และการอ้างสิทธิ์ในความเป็นผู้นำตระกูลของข้าก็ไม่อาจปฏิเสธได้\n\nความแข็งแกร่งเพียงอย่างเดียวไม่ได้ ทำให้ข้าคู่ควร ในท้ายที่สุด มันคือความมุ่งมั่นของข้าที่จะนำตระกูล [ROOT.Char.GetHouse.GetBaseName] ไปสู่ความยิ่งใหญ่ — อย่างที่ [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('recipient'))] ผู้ใจเสาะของข้าไม่เคยทำได้ — ที่นำมา ซึ่งชัยชนะในวันนี้"
 fp3_misc_decisions.0020.desc.b: "เหนื่อยล้า ข้าเงยหน้ามองใบหน้าของ [recipient.GetFirstNamePossessive] สายตาแข็งกร้าวของ [ROOT.Char.Custom2('RelationToMePossessive', SCOPE.sC('recipient'))] ของข้ายืนยันสิ่งที่ข้ารู้อยู่แล้ว: ข้าล้มเหลว...\n\n"ต้องใช้ความกล้าหาญในการนำตระกูล" [recipient.GetSheHe] ถอนหายใจ "ข้าคือผู้ที่ต้องแบกรับภาระของตระกูล [ROOT.Char.GetHouse.GetBaseName]"\n\nไม่ต้องสงสัยเลย [recipient.GetFirstNameNoTooltip] ได้พิสูจน์ความอ่อนแอของข้าต่อหน้าราชสำนัก..."
 fp3_misc_decisions.0020.lose.a: "ข้าไม่แข็งแกร่งพอ"
 fp3_misc_decisions.0020.lose.b: "ตระกูล [ROOT.Char.GetHouse.GetBaseNameNoTooltip] เป็น #bold #EMP ของข้า!#!#!"
 fp3_misc_decisions.0020.win.a: "ตระกูล [ROOT.Char.GetHouse.GetBaseNameNoTooltip] ยอมสยบต่อข้า!"
 fp3_misc_decisions.0020.win.b: "ท่านต่อสู้อย่างกล้าหาญ ประมุขแห่งตระกูลของเรา!"

 fp3_misc_decisions.0022.t: "ยื่นคำท้า: ตระกูล [ROOT.Char.GetHouse.GetBaseNameNoTooltip]"
 fp3_misc_decisions.0022.desc.intro: "เมื่อข้ามาถึง [duel_location.GetBaseNameNoTierNoTooltip] [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('recipient'))] ของข้า [recipient.GetTitledFirstName] ก็พร้อมและรออยู่ [recipient.GetSheHe|U] ทักทายข้าในฐานะญาติ [ROOT.Char.GetWomanMan] ประเมินข้าขณะที่ราชสำนักรวมตัวกันเพื่อเป็นสักขีพยานในคำท้าของข้า"
 fp3_misc_decisions.0022.desc.body: "\n\n"มาเถิด" [recipient.GetSheHe] พูดอย่างห้าวๆ "ให้เราตัดสินชะตากรรมของตระกูล [ROOT.Char.GetHouse.GetBaseName]""
 fp3_misc_decisions.0022.trigger_failure.actor: "[trial_by_combat_trial|E] ของข้ากับ [recipient.GetFirstNameNoTooltip] ได้กลายเป็นโมฆะ"
 fp3_misc_decisions.0022.trigger_failure.recipient: "[trial_by_combat_trial|E] ของข้ากับ [actor.GetFirstNameNoTooltip] ได้กลายเป็นโมฆะ"
 fp3_misc_decisions.0022.a: "ขอให้ [actor.GetWomanMan] ที่ดีที่สุดชนะ"
 fp3_misc_decisions.0022.a.tt: "[single_combat_duel|E] เริ่มต้นขึ้น!"

 fp3_misc_decisions.0023.desc.a: "บอบช้ำและฟกช้ำ [actor.GetFirstName] ได้เข้าใจแล้วว่า [actor.GetSheHe] โง่เขลาที่ท้าทายข้าในฐานะผู้นำตระกูลของเรา\n\nคำท้าของ [ROOT.Char.Custom2('RelationToMePossessive', SCOPE.sC('actor'))] ผู้ใจเสาะของข้าได้พิสูจน์เพียงความคู่ควรของข้าเองในฐานะผู้นำต่อทั้งตระกูล [ROOT.Char.GetHouse.GetBaseName] และราษฎรของข้า"
 fp3_misc_decisions.0023.desc.a.lethal: "ในที่สุด [actor.GetFirstName] ก็ตายไปพร้อมกับความทะเยอทะยานอันทำลายล้างและชั่วร้ายทั้งหมดของ [actor.GetHerHis]\n\nคำท้าของ [ROOT.Char.Custom2('RelationToMePossessive', SCOPE.sC('actor'))] ผู้ใจเสาะของข้าได้พิสูจน์เพียงความคู่ควรของข้าเองในฐานะผู้นำต่อทั้งตระกูล [ROOT.Char.GetHouse.GetBaseName] และราษฎรของข้า"
 fp3_misc_decisions.0023.desc.b: "เหนื่อยล้า ข้าเงยหน้ามองใบหน้าของ [actor.GetFirstNamePossessive] แววตาแห่งชัยชนะของ [ROOT.Char.Custom2('RelationToMePossessive', SCOPE.sC('recipient'))] ของข้ายืนยันสิ่งที่ข้ารู้อยู่แล้ว: ข้าล้มเหลว...\n\n"ในที่สุด ตระกูลของเราก็จะมีผู้นำที่แข็งแกร่ง" [actor.GetSheHe] ถอนหายใจ "ข้าคือผู้ที่ต้องแบกรับภาระของตระกูล [ROOT.Char.GetHouse.GetBaseName]"\n\nไม่ต้องสงสัยเลย [actor.GetFirstNameNoTooltip] ได้พิสูจน์ความอ่อนแอของข้าต่อหน้าราชสำนัก..."
 fp3_misc_decisions.0023.lose.a: "ข้าไม่แข็งแกร่งพอ"
 fp3_misc_decisions.0023.win.a: "คนเลี้ยงแกะต้องควบคุมฝูงแกะของ [ROOT.Char.GetHerHis]"

 fp3_misc_decisions.0025.t: "[SCOPE.sC('recipient').Custom2('RelationToMeShort', SCOPE.sC('actor'))] [ROOT.Char.GetFirstNameNoTooltip] ของข้า,"
 fp3_misc_decisions.0025.desc: "เห็นได้ชัดว่าท่านยังไม่พร้อมที่จะแบกรับภาระในการนำตระกูล [ROOT.Char.GetHouse.GetBaseName]\n\nข้าต้องปฏิเสธคำท้าที่ผิดพลาดของท่าน เพื่อประโยชน์ของตระกูล"
 fp3_misc_decisions.0025.a: "ในที่สุด ท่านจะต้องยอมรับข้า!"
 fp3_misc_decisions.0025.b: "การปฏิเสธอันโง่เขลาของท่านจะไม่ถูกลืม"

 fp3_misc_decisions.0026.desc: "เมื่อข้ามาถึง [duel_location.GetBaseNameNoTierNoTooltip] [recipient.GetTitledFirstName] [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('recipient'))] ของข้า ก็กำลังรอข้าอย่างใจเย็น [recipient.GetSheHe|U] โอบกอดข้าต่อหน้าเหล่าข้าราชสำนัก ตระหนักถึงพิธีรีตองทั้งหมดของตระกูลเรา\n\n[recipient.GetSheHe|U] ยิ้มบาง ๆ "มาเถิด [recipient.Custom2('RelationToMeShort', SCOPE.sC('actor'))] ให้เราได้ฟังว่าเจ้ามีสิ่งใดจะกล่าว"\n\n[recipient.GetFirstNameNoTooltip] เรียกหาเครื่องดื่มขณะที่เรานั่งลง ก่อนจะหันมามองข้าอย่างคาดหวัง"
 fp3_misc_decisions.0026.desc.no_court: "เมื่อข้ามาถึง [duel_location.GetBaseNameNoTierNoTooltip] [recipient.GetTitledFirstName] [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('recipient'))] ของข้า ก็กำลังรอข้าอย่างใจเย็น เราโอบกอดกัน ตระหนักถึงพิธีรีตองทั้งหมดของตระกูลเรา\n\n[recipient.GetSheHe|U] ยิ้มบาง ๆ "มาเถิด [recipient.Custom2('RelationToMeShort', SCOPE.sC('actor'))] ให้เราได้ฟังว่าเจ้ามีสิ่งใดจะกล่าว"\n\n[recipient.GetFirstNameNoTooltip] เรียกหาเครื่องดื่มขณะที่เรานั่งลง ก่อนจะหันมามองข้าอย่างคาดหวัง"
 fp3_misc_decisions.0026.a: "จะเริ่มจากตรงไหนดี..."
 fp3_misc_decisions.0026.a.tt: "การเจรจาเริ่มต้นขึ้น!"

 fp3_misc_decisions.0027.desc: "ข้าเริ่มต้นด้วยประวัติศาสตร์ของตระกูล [actor.GetHouse.GetBaseName] และวีรกรรมของ [actor.GetHouse.GetFounder.GetTitledFirstName] ค่อยๆ เคลื่อนมาสู่ปัจจุบัน\n\n[recipient.GetFirstName] ฟังอย่างอดทน พยักหน้าเป็นครั้งคราวขณะที่ข้าสรุปภัยคุกคามที่ตระกูลของเราเผชิญและวิธีต่อสู้กับมัน\n\nเมื่อข้าพูดจบ [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('recipient'))] ของข้าพูดอย่างใจเย็น "ใช่ ใช่ ดีมาก แต่ทำไม #EMP ท่าน#! ควรนำตระกูลของเราแทนข้า?""
 fp3_misc_decisions.0027.desc.founder: "ข้าเริ่มต้นด้วยประวัติศาสตร์ของตระกูล [actor.GetHouse.GetBaseName] และวีรกรรมของบรรพบุรุษของเรา ค่อย ๆ เคลื่อนมาสู่ยุคปัจจุบัน\n\n[recipient.GetFirstName] รับฟังอย่างอดทน พยักหน้าเป็นครั้งคราวขณะที่ข้าสรุปภัยคุกคามที่ตระกูลของเรากำลังเผชิญและวิธีต่อกรกับมัน\n\nเมื่อข้าพูดจบ [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('recipient'))] ของข้า ก็กล่าวอย่างใจเย็น "อืม ๆ ดีมาก แต่เหตุใด #EMP เจ้า#! ถึงควรเป็นผู้นำตระกูลแทนที่จะเป็นข้า?""
 fp3_misc_decisions.0027.a.sick: "ดูสุขภาพของท่านสิ ข้าสามารถรับภาระของท่านได้"
 fp3_misc_decisions.0027.a.sick.tt: "ตัวเลือกนี้ใช้ได้ เพราะ [recipient.GetSheHe] มี [health|E] ที่ไม่ดี"
 fp3_misc_decisions.0027.a.old: "บัดนี้ถึงเวลาแล้วที่คนรุ่นต่อไปจะนำทางตระกูลของเรา"
 fp3_misc_decisions.0027.a.old.tt: "ตัวเลือกนี้ใช้ได้ เพราะ [recipient.GetSheHe] แก่กว่าท่านมาก"
 fp3_misc_decisions.0027.a.young: "ท่านยังเด็กและไร้ประสบการณ์ มีอะไรให้เรียนรู้อีกมาก"
 fp3_misc_decisions.0027.a.young.tt: "ตัวเลือกนี้ใช้ได้ เพราะ [recipient.GetSheHe] อายุน้อยกว่าท่าน"
 fp3_misc_decisions.0027.a.trigger: "[recipient.GetSheHe|U] ต้องมีสุขภาพไม่ดี หรือแก่กว่า หรืออายุน้อยกว่าท่าน"
 fp3_misc_decisions.0027.b.vassal: "ในฐานะราษฎรแห่ง [actor.GetPrimaryTitle.GetBaseNameNoTierNoTooltip] จงฟังข้า"
 fp3_misc_decisions.0027.b.vassal.tt: "ตัวเลือกนี้ใช้ได้ เพราะ [recipient.GetSheHe] เป็น [vassal|E] ของท่านหรือต่ำกว่า"
 fp3_misc_decisions.0027.b.tier: "ในฐานะ [recipient.GetTitleAsNameNoTooltip] จงฟังคำพูดของข้าในฐานะ [actor.GetTitleAsNameNoTooltip]"
 fp3_misc_decisions.0027.b.tier.tt: "ตัวเลือกนี้ใช้ได้ เพราะ [rank|E] ของ [recipient.GetHerHis] ต่ำกว่า"
 fp3_misc_decisions.0027.b.military: "มีเพียงข้าเท่านั้นที่มีอำนาจปกป้องตระกูลของเรา"
 fp3_misc_decisions.0027.b.military.tt: "ตัวเลือกนี้ใช้ได้ เพราะกองทัพของ [recipient.GetHerHis] เล็กกว่ามาก"
 fp3_misc_decisions.0027.b.dread: "ท่านอยากมีเรื่องกับข้าจริงๆ หรือ?"
 fp3_misc_decisions.0027.b.dread.tt: "ตัวเลือกนี้ใช้ได้ เพราะ [recipient.GetSheHe] เกรงกลัวท่าน"
 fp3_misc_decisions.0027.b.trigger: "ท่านต้องเป็น [liege|E] ของ [recipient.GetHerHis] มี [rank|E] สูงกว่า มีกองทัพใหญ่กว่ามาก หรือเป็น [dreadful|E]"
 fp3_misc_decisions.0027.accept: "[recipient.GetFirstNameNoTooltip] ยอมรับข้อโต้แย้งของท่าน"
 fp3_misc_decisions.0027.bargain: "[recipient.GetFirstNameNoTooltip] ต้องการบางสิ่งตอบแทน"
 fp3_misc_decisions.0027.bargain.tt: "[recipient.GetFirstName] จะเรียกร้อง"
 fp3_misc_decisions.0027.reject: "[recipient.GetFirstNameNoTooltip] ปฏิเสธข้อโต้แย้งของท่าน"
 fp3_misc_decisions.0027.c: "ขออภัย แต่ท่าน #EMP รู้#! ว่าข้ามีความสามารถมากกว่า"
 fp3_misc_decisions.0027.c.trigger: "[skills|E] รวมของท่านต้องสูงกว่าของ [recipient.GetHerHis]"
 fp3_misc_decisions.0027.c.tt: "ตัวเลือกนี้ใช้ได้ เพราะ [skills|E] รวมของท่านมากกว่าของ [recipient.GetFirstNamePossessiveNoTooltip]"
 fp3_misc_decisions.0027.d: "มาเถิด [recipient.GetFirstNameNoTooltip] หลีกทางไป"
 
 fp3_misc_decisions.0028.desc: "[actor.GetFirstName] ได้มาถึง [duel_location.GetBaseNameNoTierNoTooltip] เพื่อให้เหตุผลที่น่าสงสัยของ [actor.GetHerHis] ในการเข้ารับตำแหน่งผู้นำตระกูล [actor.GetHouse.GetBaseName] ข้าสุภาพพอ กอด [actor.GetHerHim] ก่อนการเจรจา\n\n[actor.GetSheHe|U] พูดถึงประวัติศาสตร์ของตระกูลเรา ตั้งแต่สมัยของ [actor.GetHouse.GetFounder.GetTitledFirstName] จนถึงปัจจุบัน และข้ารออย่างอดทนสำหรับประเด็นสำคัญของข้อโต้แย้งของ [actor.GetHerHis]\n\nในที่สุด มันก็มาถึง: "[actor.Custom2('RelationToMeShort', SCOPE.sC('recipient'))|U]..."
 fp3_misc_decisions.0028.desc.founder: "[actor.GetFirstName] มาถึง [duel_location.GetBaseNameNoTierNoTooltip] เพื่อเสนอเหตุผลจอมปลอมของ [actor.GetHerHis] ในการขึ้นเป็นผู้นำตระกูล [actor.GetHouse.GetBaseName] ข้าก็มีมารยาทพอที่จะโอบกอด [actor.GetHerHim] ก่อนการเจรจา\n\n[actor.GetSheHe|U] กล่าวถึงประวัติศาสตร์ของตระกูลเรา ตั้งแต่สมัยบรรพบุรุษอันไกลโพ้นจนถึงปัจจุบัน และข้ารอฟังใจความสำคัญของข้อโต้แย้งของ [actor.GetHerHis] อย่างอดทน\n\nในที่สุด มันก็มาถึง: "[actor.Custom2('RelationToMeShort', SCOPE.sC('recipient'))|U]...""
 fp3_misc_decisions.0028.sick: "$fp3_misc_decisions.0027.a.sick$" งั้นเป็นเรื่องสุขภาพของข้าสินะ...? $fp3_misc_decisions.0028.perhaps$"
 fp3_misc_decisions.0028.old: "$fp3_misc_decisions.0027.a.old$" งั้นเป็นเรื่องอายุของข้าสินะ...? $fp3_misc_decisions.0028.perhaps$"
 fp3_misc_decisions.0028.young: "$fp3_misc_decisions.0027.a.young$" งั้นเป็นเรื่องความเยาว์วัยของข้าสินะ...? $fp3_misc_decisions.0028.perhaps$"
 fp3_misc_decisions.0028.vassal: "$fp3_misc_decisions.0027.b.vassal$" ข้าปฏิเสธไม่ได้ $fp3_misc_decisions.0028.perhaps$"
 fp3_misc_decisions.0028.tier: "$fp3_misc_decisions.0027.b.tier$" ข้าปฏิเสธไม่ได้ $fp3_misc_decisions.0028.perhaps$"
 fp3_misc_decisions.0028.military: "$fp3_misc_decisions.0027.b.military$" ข้าปฏิเสธไม่ได้ $fp3_misc_decisions.0028.perhaps$"
 fp3_misc_decisions.0028.dread: "$fp3_misc_decisions.0027.b.dread$" ช่างกล้า! ถึง แม้ว่า... $fp3_misc_decisions.0028.perhaps$"
 fp3_misc_decisions.0028.skill: "$fp3_misc_decisions.0027.c$"\n\nข้าไม่ได้ไร้ความสามารถขนาดนั้น! หรือว่าข้าเป็น...?"
 fp3_misc_decisions.0028.fallback: "$fp3_misc_decisions.0027.a.sick$" นั่นคือทั้งหมดที่ [actor.GetSheHe] จะพูดจริงๆ หรือ?"
 fp3_misc_decisions.0028.perhaps: "บางที [actor.GetSheHe] อาจจะถูก"
 fp3_misc_decisions.0028.bargain.tt: "หาก [actor.GetShortUIName] ยอมรับ:"

 fp3_misc_decisions.0028.a: "ท่านพูดถูก #EMP ท่าน#! ควรนำตระกูลของเรา"
 fp3_misc_decisions.0028.b: "ดีมาก แต่ข้าอยากจะอยู่ในตำแหน่งที่ปรึกษา"
 fp3_misc_decisions.0028.c: "ผู้นำที่คู่ควรย่อมมีเหรียญทองสนับสนุนคำพูดของ [actor.GetHerHis] อย่างแน่นอน"
 fp3_misc_decisions.0028.d: "บางทีท่านอาจจะรับช่วงต่อได้ แต่ข้าต้องการการรับประกันจากท่าน"
 fp3_misc_decisions.0028.e: "ไม่ ข้าไม่คิด เช่นนั้น"

 fp3_misc_decisions.0029.desc: "[recipient.GetFirstName] ใคร่ครวญคำพูดของข้า จ้องมองใบหน้าของข้าอย่างตั้งใจขณะที่ราชสำนักพึมพำรอบตัวเรา หลังจากสิ่งที่ดูเหมือนนานแสนนาน [recipient.GetSheHe]"
 fp3_misc_decisions.0029.desc.no_court: "[recipient.GetFirstName] ครุ่นคิดถึงคำพูดของข้า พินิจมองใบหน้าของข้าอย่างตั้งใจขณะที่เสียงพึมพำดังขึ้นรอบตัวเรา หลังจากผ่านไปราวชั่วนิรันดร์ [recipient.GetSheHe]"
 fp3_misc_decisions.0029.accept: "พยักหน้า\n\n"ใช่ ท่านอาจจะถูก" [recipient.GetSheHe|U] พูดอย่างครุ่นคิด "นับจากวันนี้ไป ท่านจะเป็นประมุขแห่งตระกูล [actor.GetHouse.GetBaseName] ขอ [recipient.GetFaith.HighGodName] นำทางท่านและตระกูลของเรา""
 fp3_misc_decisions.0029.regent: "นั่งตัวตรง\n\n"ข้าอาจจะเต็มใจที่จะหลีกทาง" [recipient.GetSheHe|U] พูดอย่างระมัดระวัง "หากท่านให้ตำแหน่งแก่ข้าในรัฐบาลของ [actor.GetPrimaryTitle.GetBaseNameNoTooltip]...""
 fp3_misc_decisions.0029.gold: "เลิกคิ้ว\n\n"ข้าอาจจะเต็มใจที่จะหลีกทาง" [recipient.GetSheHe|U] พูดอย่างระมัดระวัง "หากท่านสามารถพิสูจน์ได้ก่อนว่าท่านมีความมั่งคั่งที่จะดูแลตระกูลของเรา...""
 fp3_misc_decisions.0029.hook: "ยิ้ม\n\n"ข้าอาจจะเต็มใจที่จะหลีกทาง" [recipient.GetSheHe|U] พูดอย่างระมัดระวัง "หากท่านสามารถรับประกันได้ว่าท่านจะเป็นมิตร...""
 fp3_misc_decisions.0029.fail: "ขมวดคิ้ว\n\n"ไม่ ข้อโต้แย้งของท่านอ่อนแอ" [recipient.GetSheHe|U] พูดอย่างดูถูก "ในฐานะประมุขโดยชอบธรรมแห่งตระกูล [actor.GetHouse.GetBaseName] ข้าขอสั่งให้ท่านลืมความคิดที่น่าหัวเราะนี้เสีย""
 fp3_misc_decisions.0029.a: "ข้าจะ ทำให้ดีที่สุด"
 fp3_misc_decisions.0029.b: "ดีมาก มันจะสำเร็จ"
 fp3_misc_decisions.0029.c: "ชะตากรรมของตระกูลเราไม่ใช่เรื่องที่จะต่อรองกันได้"
 fp3_misc_decisions.0029.d: "คนโง่ #EMP จะ#! เรียนรู้คุณค่าของข้า ไม่ทางใดก็ทางหนึ่ง"

 fp3_misc_decisions.0030.desc: "[recipient.GetFirstName] พิจารณาข้อเสนอของข้าอย่างครุ่นคิด จ้องมองข้าด้วยสายตาของ [recipient.GetHerHis]\n\n"
 fp3_misc_decisions.0030.accept: "ในที่สุด [recipient.GetSheHe] ก็ถอนหายใจ "ดีมาก [house_challenger.Custom2('RelationToMeShort', SCOPE.sC('house_head'))] ท่านจะได้สิ่งที่ท่านต้องการ""
 fp3_misc_decisions.0030.reject: "ในที่สุด [recipient.GetSheHe] ก็ส่ายศีรษะ [recipient.GetHerHis] และกล่าวด้วยความดูถูกเล็กน้อยว่า "ชะตากรรมของครอบครัวเราไม่ใช่เรื่องที่จะต่อรองได้!""
 fp3_misc_decisions.0030.a: "ดีมาก!"
 fp3_misc_decisions.0030.b: "ถ้า เช่นนั้นก็ไม่มีอะไรจะพูดคุยกันอีก..."

 fp3_misc_decisions.0041.intro: "ขณะที่ [house_head.GetFirstName] หันหลังกลับ ใบหน้าของ [house_head.GetHerHis] เต็มไปด้วยความดูถูกเหยียดหยาม ข้าฉวยโอกาส\n\n"
 fp3_misc_decisions.0041.desc.success: "คนโง่แทบไม่ทันสังเกตเห็นการเข้าใกล้ของข้าอย่างรวดเร็ว แทบไม่ทันตอบสนองขณะที่ข้าแทงกริชเข้าที่หน้าอกของ [house_head.GetHerHis]\n\nขณะที่ [house_head.GetSheHe] มองลงมาอย่างไม่เข้าใจ ข้าเข้าใกล้และกระซิบ: "ตระกูล [ROOT.Char.GetHouse.GetBaseNameNoTooltip] เป็น #bold #EMP ของข้า!#!#!" ก่อนที่จะกระชากดาบออกจากท้องของ [house_head.GetHerHis]"
 fp3_misc_decisions.0041.desc.failure: "เจ้าเล่ห์กระโดดหลบได้ทันเวลาพอดีเพื่อหลีกเลี่ยงกริชที่แกว่งไปมาของข้า ร้องเรียกทหารองครักษ์ของ [house_head.GetHerHis]! ข้าไม่สามารถต้อน [house_head.GetHerHim] จนมุมได้ก่อนที่พวกเขาจะมาถึง กดข้าลงกับพื้นอย่างแรง\n\n[house_challenger.Custom2('RelationToMeShort', SCOPE.sC('house_head'))] ของข้ายืนอยู่เหนือข้าและคำราม "โยนงูตัวนี้เข้าคุกใต้ดิน!""
 fp3_misc_decisions.0041.a: "ต้องใช้ความเจ้าเล่ห์ในการนำตระกูล [house_challenger.Custom2('RelationToMeShort', SCOPE.sC('house_head'))]!"
 fp3_misc_decisions.0041.b: "เจ้าจะต้องชดใช้!"

 fp3_misc_decisions.0042.intro: "ขณะที่ข้าหันหลังกลับจาก [house_challenger.GetFirstName] ผู้เสื่อมเสียเกียรติ ไปสู่ความคิดชั่วร้ายของ [house_challenger.GetHerHis] แสงแวววับก็สะดุดตาข้า"
 fp3_misc_decisions.0042.desc: "$fp3_misc_decisions.0042.intro$\n\nข้าพุ่งหลบได้ทันเวลาพอดีเพื่อหลบกริชที่ตวัดไปมาของ [house_challenger.GetHerHis] พลางร้องเรียกทหารยาม\n\n[house_challenger.GetSheHe|U] ถูกจับตรึงลงกับพื้นในไม่ช้า ดิ้นรนและกรีดร้อง: "ตระกูล [ROOT.Char.GetHouse.GetBaseNameNoTooltip] เป็น #bold #EMP ของข้า!#!#!""
 fp3_misc_decisions.0042.a: "โยนงูตัวนี้เข้าคุกใต้ดิน!"

 fp3_misc_decisions.0043.desc: "$fp3_misc_decisions.0042.intro$\n\nปีศาจร้ายยืนอยู่ตรงหน้าข้า ประกายตาชั่วร้ายในดวงตาของ [house_challenger.GetHerHis] แขนของ [house_challenger.GetHerHis] พุ่งออกมา กำปั้นของ [house_challenger.GetHerHis] กุมด้ามกริชไว้...\n\n[house_challenger.GetSheHe|U] เข้ามาใกล้และกระซิบ: "ตระกูล [ROOT.Char.GetHouse.GetBaseNameNoTooltip] เป็น #bold #EMP ของข้า!#!#!" ก่อนจะกระชากใบมีดออกจากท้องของข้า"
 fp3_misc_decisions.0043.a: "#DIE1 [house_head.Custom2('RelationToMeShort', SCOPE.sC('house_challenger'))]....#!"

 fp3_misc_decisions.0051.t: "ธรรมเนียมตระกูล"
 fp3_misc_decisions.0051.desc: "บัดนี้ข้าเห็นแล้วว่าสายสัมพันธ์ของครอบครัวคือกุญแจสำคัญที่สุดสู่การปกครองที่ชอบธรรมและมั่นคง\n\nโดยดำเนินตามแบบอย่างของ [ROOT.Char.GetHouse.GetHeadOfHouse.GetTitledFirstName] ข้าได้สั่งให้มีการจัดระเบียบรัฐบาลของ [ROOT.Char.GetPrimaryTitle.GetBaseNameNoTierNoTooltip] ใหม่ตามแนวทางของตระกูล [ROOT.Char.GetHouse.GetBaseName]"
 fp3_misc_decisions.0051.a: "ครอบครัวต้องมาก่อน!"
 
 fp3_struggle.8000.t: "[attacker.Custom2('AppropriateGreeting', ROOT.Char)]"
 fp3_struggle.8000.desc: "จุดจบของการทรยศของ [defender.GetTitledFirstNamePossessive] เจ้าเหนือหัวของท่าน ต่อกาหลิบโดยชอบธรรมของ [defender.GetHerHis] ใกล้เข้ามาแล้ว\n\nในฐานะผู้สนับสนุนที่ภักดี ข้าจะรับรองว่าท่านจะได้ครองบัลลังก์แห่ง [defender.GetPrimaryTitle.GetBaseNameNoTierNoTooltip] แทน [defender.GetHerHis]"
 fp3_struggle.8000.a: "จริงหรือ?"
 fp3_struggle.8001.desc: "จุดจบของการทรยศของท่านต่อกาหลิบโดยชอบธรรมของท่านใกล้เข้ามาแล้ว\n\nถึงเวลาแล้วที่ [loyalist_puppet.GetTitledFirstName] ผู้สนับสนุนที่ภักดี จะปกครอง [defender.GetPrimaryTitle.GetBaseNameNoTierNoTooltip] แทนท่าน"
 fp3_struggle.8001.a: "ข้ามศพข้าไปก่อน!"
 fp3_struggle.8002.desc: "ในที่สุด คนทรยศ [defender.GetTitledFirstName] ก็พ่ายแพ้ และ [defender.GetPrimaryTitle.GetBaseNameNoTierNoTooltip] ก็กลับมาอยู่ในมือของผู้สนับสนุนที่ภักดีของกาหลิบอีกครั้ง\n\nขอให้รัชสมัยของท่านยืนยาวและได้รับพร!"
 fp3_struggle.8002.a: "ไชโย!"
 fp3_struggle.8002.alliance_tt: "[attacker.GetTitledFirstName] บัดนี้เป็น [ally|E] ของท่าน"
 install_loyalist_puppet_declared_puppet: "สงครามเพื่อ แต่งตั้งผู้ภักดี"
 install_loyalist_puppet_declared_defender: "$install_loyalist_puppet_declared_puppet$"
 install_loyalist_puppet_won_puppet: "$install_loyalist_puppet_declared_puppet$"

 fp3_misc_decisions.0031.desc.intro: "อย่างที่ข้าคิดไว้ ไม่ว่าขุนนางบางคนในอาณาจักรจะรู้สึกอื้อฉาวกับแนวคิดนี้เพียงใด ก็ยังมีผู้มีความสามารถอยู่ในตำแหน่งเล็กๆ และกระทรวงรองๆ ของ [ROOT.Char.GetPrimaryTitle.GetDefinitiveName]\n\nผู้สมัครรับการเลื่อนตำแหน่งสามารถคัดเลือกเหลือเพียงสองกลุ่มได้อย่างง่ายดาย: กลุ่มแรกคือ [batch_a_char1.GetFirstName], [batch_a_char2.GetFirstName], และ [batch_a_char3.GetFirstName] และอีกกลุ่มคือ [batch_b_char1.GetFirstName] และ [batch_b_char2.GetFirstName]\n\n"
 # I don't know why it demands we scope out of the county then back into it — roll with it.
 fp3_misc_decisions.0031.desc.cultures.single: "พวกเขาทั้งหมดมาจากประชากร [batch_a_county.GetProvince.GetCounty.GetCulture.GetName] แห่ง [batch_a_county.GetBaseNameNoTier] โดยกลุ่มของ [batch_a_char1.GetFirstNamePossessiveNoTooltip] มีความสามารถ แต่อาจขาดการศึกษาที่ดีเล็กน้อย ในขณะที่ [batch_b_char1.GetFirstNameNoTooltip] และสหายของ [batch_b_char1.GetHerHis] มีความประณีตกว่าเล็กน้อย แต่มีเพียงสองคนเท่านั้น"
 fp3_misc_decisions.0031.desc.cultures.fallback: "กลุ่มของ [batch_a_char1.GetFirstNamePossessiveNoTooltip] มาจาก [batch_a_county.GetProvince.GetCounty.GetCulture.GetCollectiveNoun] แห่ง [batch_a_county.GetBaseNameNoTier] มีความสามารถแม้จะขาดการศึกษาเล็กน้อย ในขณะที่ [batch_b_char1.GetFirstNameNoTooltip] และสหายของ [batch_b_char1.GetHerHis] เป็น [batch_b_county.GetProvince.GetCounty.GetCulture.GetCollectiveNoun] จาก [batch_b_county.GetBaseNameNoTier] และมีความประณีตกว่า #EMP เล็กน้อย#!"
 fp3_misc_decisions.0031.tt.all_outsiders: "คนนอกทั้งหมดเข้าร่วมราชสำนักของท่าน"
 fp3_misc_decisions.0031.tt.all_outsiders.you_gain_hook: "ท่านได้รับ [strong_hook|E] #WEAK ($loyalty_hook$)#! เหนือพวกเขา"
 fp3_misc_decisions.0031.a: "[batch_a_char1.GetFirstNameNoTooltip] และสหายของ [batch_a_char1.GetHerHis] จะเป็นข้าราชบริพารที่ดี"
 fp3_misc_decisions.0031.b: "ข้าประทับใจ [batch_b_char1.GetFirstNameNoTooltip] มากกว่า..."
 fp3_misc_decisions.0031.c: "ไม่มีใครในพวกเจ้าใช้ได้ — กลับไปประจำตำแหน่ง!"
 fp3_misc_decisions.0031.c.tt: "คนนอกพลาดโอกาสที่จะมีความสำคัญ"
