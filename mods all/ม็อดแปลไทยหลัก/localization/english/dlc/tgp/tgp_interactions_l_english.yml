 tgp_interaction_event.0001.desc: "ข้าต้องขอบคุณท่านสำหรับความช่วยเหลือในการเติมคลังสมบัติเมื่อเร็วๆ นี้ แม้ท่านจะมิได้เรียกร้องสิ่งใดตอบแทน ข้ารู้สึกว่าต้องชดใช้หนี้สินนี้ มิฉะนั้นมันจะกัดกินมโนธรรมของข้า\n\nโปรดรับของกำนัลเล็กน้อยนี้แทนคำขอบคุณของข้าด้วย"
