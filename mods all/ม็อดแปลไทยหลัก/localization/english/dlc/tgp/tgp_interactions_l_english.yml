 celestial_give_treasury_interaction: "ส่งคลังสมบัติ"
 celestial_give_treasury_interaction_desc: "ช่วยเหลือ [recipient.GetShortUIName] และ [recipient.Custom('GetProvinceConcept')] ของ [recipient.GetHerHis] ด้วย [treasury|E] ที่จำเป็นอย่างยิ่ง"
