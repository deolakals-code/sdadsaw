l_english: 
 ### TENETS
 tenet_pure_land_name: "การเกิดใหม่โดยชอบธรรม"
 tenet_pure_land_desc: "ณ ที่นี้ใน #EMP paścima-kāla#! — ยุคเสื่อมแห่งธรรม — ความมั่งคั่ง, การศึกษา, หรือชาติกำเนิดสูงส่ง ล้วนมิอาจมอบการปลอบประโลมได้ เพียงผู้อุทิศตนอย่างแท้จริงต่อศีลของพระพุทธองค์เท่านั้นที่จะได้ไปเกิดใหม่ในดินแดนสุขาวดี"
 tenet_sohei_name: "พระนักรบ"
 tenet_no_mind_name: "จิตไร้จิต"
 tenet_no_mind_desc: "จิตที่ไร้จิตคือจิตที่บรรลุถึงสติอันแท้จริง สภาวะที่บ่มเพาะโดยศิลปิน, ช่างฝีมือ และนักศิลปะการต่อสู้, ที่ ซึ่งร่างกายตอบสนองต่อทุกความท้าทายโดยปราศจากความคิด"
 doctrine_parameter_better_artifacts: "[inspirations|E] ที่ได้รับการอุปถัมภ์จะผลิต [artifacts|E] ที่มีคุณภาพสูงขึ้น"
 doctrine_parameter_less_likely_to_become_infirm: "ตัวละครมีโอกาสน้อยลงที่จะได้รับ [trait|E] [GetTrait('infirm').GetName( GetNullCharacter )]"
 tenet_mountain_worship_name: "ภูเขาศักดิ์สิทธิ์"
 tenet_mountain_worship_desc: "สูงตระหง่านห่างไกลจากหมู่บ้านและไร่นา, ภูผาสัมผัสกับหมู่เมฆเบื้องบน ณ ที่แห่งนั้น, ท่ามกลางยอดเขาและชะง่อนผา, คือที่ ซึ่งความศักดิ์สิทธิ์ที่แท้จริงสถิตอยู่"
 doctrine_parameter_piety_from_hills_and_mountains_pilgrimages: "ตัวละครจะได้รับ [piety|E] เพิ่มเติมจาก [pilgrimages|E] ไปยัง [GetTerrain( 'hills' ).GetName], [GetTerrain( 'mountains' ).GetName] และ [GetTerrain( 'desert_mountains' ).GetName]"
 piety_from_hills_and_mountains_pilgrimages_tt: "จาก [core_tenet|E] [GetFaithDoctrine('tenet_mountain_worship').GetBaseName]: [piety_i]#P [THIS.ScriptValue('medium_piety_gain')]#!"
 ### DOCTRINE PARAMETERS
 doctrine_parameter_peasant_and_populist_factions_more_common: "[factions|E] ชาวนาและประชานิยมจะพบบ่อยขึ้นและทรงพลังมากขึ้น"
 doctrine_parameter_children_less_likely_to_be_burdened: "[children|E] มีโอกาสน้อยลงที่จะได้รับ [trait|E] [GetTrait('burdened').GetName( GetNullCharacter )]"
