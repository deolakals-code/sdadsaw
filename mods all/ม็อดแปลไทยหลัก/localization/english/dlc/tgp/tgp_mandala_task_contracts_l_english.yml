 mandala_realm_contract_0012_contract: "สัตย์สาบานเชือดสุกร"
 mandala_realm_contract_0012_desc: "ชาวบ้านแห่ง [TaskContract.GetLocation.GetNameNoTooltip] ขอให้ท่านผนึกพันธสัญญาแห่งการแก้แค้น ด้วยการเชือดสุกรดำ"
 mandala_realm_contract_0012_desc_title: "[TaskContract.MakeScope.Var('loc_compliment').GetFlagName|U] [GetPlayer.GetTitleAsNameNoTooltip],"
 mandala_realm_contract_0012_request: "จงไปปรากฏตัวที่ [TaskContract.GetLocation.GetName] และเลือกตัวเลือกตาม [mandala_aspect|E] ของท่าน"
 tgp_east_asia_mandala_task_contract_events.2100.t: "$mandala_ritual_prefix$ สัตย์สาบานเชือดสุกร"
 tgp_east_asia_mandala_task_contract_events.2100.desc: ""[ROOT.Char.GetTitleAsNameNoTooltip] ผู้ยิ่งใหญ่และทรงพลัง พวกเรามาขอพรจากท่าน" [local_character.GetWomanMan] พยักพเยิดไปยังคอกสัตว์ "พวกเราจะบุกโจมตีศัตรูของเราใน [vengeance_target.GetNameNoTier]— แต่ไม่ใช่ก่อนที่ท่านจะทำการบูชายัญ"\n\n"จงนำสุกรดำตัวนี้เข้าไปใน [ritual_location.Custom('TerrainTypeProvince')] และหลั่งเลือดของมันลงบนศิลาสาบาน เมื่อนั้น คำสัตย์แห่งการแก้แค้นของเราจึงจะถูกผนึก!""
 tgp_east_asia_mandala_task_contract_events.2100.a: "สุกรตัวเดียวรึ? ไม่ ข้าจะให้ห้าสิบตัว!"
 tgp_east_asia_mandala_task_contract_events.2100.b: "สุกรจะถูกบูชายัญ และสัตย์สาบานจะถูกผนึก"
 tgp_east_asia_mandala_task_contract_events.2100.c: "พวกเจ้าจงรับสัตย์สาบานแห่งความเมตตาไปแทน"
 
 mandala_realm_contract_0013_contract: "พิธีกรรมแห่งความพิโรธ"
 mandala_realm_contract_0013_desc: "หนึ่งปีแห่งความล้มเหลวในการเพาะปลูก ทำให้หมู่บ้านใน [TaskContract.GetLocation.GetNameNoTooltip] ร้องขอการลงโทษ—เหล่าอาสาสมัครร้องขอให้ถูกโบยตีเพื่อเอาใจเหล่าวิญญาณ"
 mandala_realm_contract_0013_desc_title: "[TaskContract.MakeScope.Var('loc_compliment').GetFlagName|U] [GetPlayer.GetTitleAsNameNoTooltip],"
 mandala_realm_contract_0013_request: "จงไปปรากฏตัวที่ [TaskContract.GetLocation.GetName] และเลือกตัวเลือกตาม [mandala_aspect|E] ของท่าน"
 tgp_east_asia_mandala_task_contract_events.2200.t: "$mandala_ritual_prefix$ พิธีกรรมแห่งความพิโรธ"
 tgp_east_asia_mandala_task_contract_events.2200.desc: "ขณะที่เราเข้าใกล้ [ritual_location.GetName] ชาวนากลุ่มหนึ่งราวสิบคนก็เข้ามาหา ""[ROOT.Char.GetTitleAsNameNoTooltip] ผู้ทรงพลัง"" ผู้นำของพวกเขากล่าว เสียงหนักแน่นด้วยความมุ่งมั่น ""ทุ่งนาของเราแห้งแล้ง—ถูกสาปโดยวิญญาณดินที่เรียกร้องการบูชายัญ""\n\n[local_character.GetSheHe|U] คุกเข่าลงบนพื้นดินและชี้มาที่ดาบของข้า ""ลงโทษพวกเราเถิด หลั่งเลือดของพวกเราลงบนพื้นดิน เหล่าวิญญาณจะอิ่มหนำ—และครอบครัวของพวกเราก็จะ เช่นกัน""
 tgp_east_asia_mandala_task_contract_events.2200.a: "เลือดของข้าเองจะ ทำให้เหล่าวิญญาณพึงพอใจ"
 tgp_east_asia_mandala_task_contract_events.2200.b: "การเสียสละของพวกเจ้าจะเยียวยาแผ่นดิน"
 tgp_east_asia_mandala_task_contract_events.2200.c: "ใช้สุกรสักตัวก็เพียงพอแล้ว"
 
 mandala_realm_contract_0014_contract: "การลงโทษร่วม"
 mandala_realm_contract_0014_desc: "หัวขโมยใน [TaskContract.GetLocation.GetNameNoTooltip] ได้ขโมยข้าวศักดิ์สิทธิ์และหลบหนีไป ชาวบ้านต้องการให้ครอบครัวของเขาถูกลงโทษแทน"
 mandala_realm_contract_0014_desc_title: "[TaskContract.MakeScope.Var('loc_compliment').GetFlagName|U] [GetPlayer.GetTitleAsNameNoTooltip],"
 mandala_realm_contract_0014_request: "จงไปปรากฏตัวที่ [TaskContract.GetLocation.GetName] และเลือกตัวเลือกตาม [mandala_aspect|E] ของท่าน"
 tgp_east_asia_mandala_task_contract_events.2300.t: "$mandala_ritual_prefix$ การลงโทษร่วม"
 tgp_east_asia_mandala_task_contract_events.2300.desc: "ฝูงชนชาวบ้านกำลังล้อมรอบ [local_character_2.GetWomanMan] และลูกของนาง ขณะที่เราเข้าใกล้ [ritual_location.GetName] ""[ROOT.Char.GetTitleAsNameNoTooltip] ผู้ยิ่งใหญ่"" หัวหน้า[local_character.GetWomanMan] ตะโกน ""[local_character_3.GetFirstName]—หัวขโมยจากหมู่บ้านนี้—ขโมยข้าวศักดิ์สิทธิ์ของเราและหนีเข้าไปใน [ritual_location.Custom('TerrainTypeProvince')]!""\n\n[local_character.GetSheHe|U] ชี้หน้าไปยัง [local_character_2.GetWomanMan] ""หาก [local_character_3.GetSheHe] ไม่มารับโทษ ครอบครัวของ [local_character_3.GetHerHis] ก็ต้องรับโทษแทน จงประหารพวกเขาด้วยความยุติธรรมอันศักดิ์สิทธิ์!""
 tgp_east_asia_mandala_task_contract_events.2300.a: "เราจะตามล่า [local_character_3.GetFirstNameNoTooltip] แทน"
 tgp_east_asia_mandala_task_contract_events.2300.b: "[local_character_3.GetHerHis|U] ก่ออาชญากรรม พวกเขารับโทษ ก็ให้มันเป็นไป"
 tgp_east_asia_mandala_task_contract_events.2300.c: "ให้ข้าอวยพรข้าวใหม่เถิด"
 tgp_east_asia_mandala_task_contract_events.2300.a.success: "[local_character_3.GetFirstName] ถูกจับและสังหาร"
 tgp_east_asia_mandala_task_contract_events.2300.a.failure: "[local_character_3.GetFirstName] หนีรอดจากท่านไปได้"
 collective_punishments_modifier: "การลงโทษร่วม"
 collective_punishments_modifier_desc: "ครอบครัวของหัวขโมยในเคาน์ตีนี้ถูกลงโทษสำหรับอาชญากรรมที่พวกเขาไม่ได้ก่อ"
 
 mandala_realm_contract_0015_contract: "วิญญาณแห่งโรค"
 mandala_realm_contract_0015_desc: "หมอผีใน [TaskContract.GetLocation.GetNameNoTooltip] ถูกกล่าวหาว่ากักเก็บวิญญาณที่นำโรคภัยมาให้ ชาวบ้านต้องการเผากระท่อมของพวกเขา—พร้อมกับตัวพวกเขาข้างในหากจำเป็น"
 mandala_realm_contract_0015_desc_title: "[TaskContract.MakeScope.Var('loc_compliment').GetFlagName|U] [GetPlayer.GetTitleAsNameNoTooltip],"
 mandala_realm_contract_0015_request: "จงไปปรากฏตัวที่ [TaskContract.GetLocation.GetName] และเลือกตัวเลือกตาม [mandala_aspect|E] ของท่าน"
 tgp_east_asia_mandala_task_contract_events.2400.t: "$mandala_ritual_prefix$ วิญญาณแห่งโรค"
 tgp_east_asia_mandala_task_contract_events.2400.desc: ""อภัยในสภาพของพวกเราด้วยเถิด [ROOT.Char.GetTitleAsNameNoTooltip] ผู้ทรงพลัง" [local_character.GetWomanMan] ท่าทางป่วยไข้กล่าว พลางไอใส่มือของ [local_character.GetHerHis] "พวกเราป่วยกันหมด—ยกเว้น [local_character_2.GetWomanMan] ที่ #EMP แสร้งทำ#! เป็นรักษาพวกเรา"\n\n"[local_character_2.GetSheHe|U] ต้องกักเก็บวิญญาณชั่วร้ายไว้แน่!" [local_character.GetSheHe] พูดอย่างเดือดดาล "เผากระท่อมของผู้กักเก็บวิญญาณนั่นซะ—นั่นจะขับไล่พวกมันออกไป!""
 tgp_east_asia_mandala_task_contract_events.2400.a: "เราจะตามล่าหมอเถื่อนให้ทั่วทั้ง [ritual_location.GetNameNoTooltip]"
 tgp_east_asia_mandala_task_contract_events.2400.b: "ข้าจะเผากระท่อม พร้อมกับผู้กักเก็บวิญญาณข้างใน"
 tgp_east_asia_mandala_task_contract_events.2400.c: "ผู้กักเก็บวิญญาณต้องไปกับข้า"
