 mandala_realm_contract_0023_contract: "ชำระล้างสมรภูมิ"
 mandala_realm_contract_0023_desc: "ทุ่งนาใน [TaskContract.GetLocation.GetNameNoTooltip] ซึ่งครั้งหนึ่งเคยเปื้อนเลือดจากสมรภูมิ ตอนนี้กำลังหลอกหลอนชาวบ้านด้วยฝันร้าย—พวกเขาขอให้ท่านชำระล้างมัน"
 mandala_realm_contract_0023_desc_title: "[TaskContract.MakeScope.Var('loc_compliment').GetFlagName|U] [GetPlayer.GetTitleAsNameNoTooltip],"
 mandala_realm_contract_0023_request: "จงไปปรากฏตัวที่ [TaskContract.GetLocation.GetName] และเลือกตัวเลือกตาม [mandala_aspect|E] ของท่าน"
 tgp_east_asia_mandala_task_contract_events.3200.t: "$mandala_ritual_prefix$ ชำระล้างสมรภูมิ"
 tgp_east_asia_mandala_task_contract_events.3200.desc: ""[ROOT.Char.GetTitleAsNameNoTooltip] ผู้เปี่ยมสันติ ทุ่งนาแห่งหนึ่งของเราเคยเป็นสมรภูมิ" ผู้อาวุโสกล่าว สีหน้าของ [local_character.GetHerHis] เต็มไปด้วยความกังวล "ดวงวิญญาณถูกรบกวนจากการนองเลือด—ตอนนี้พวกเขามาหลอกหลอนความฝันของเรา"\n\n"ท่านต้องชำระล้างทุ่งนาด้วยขบวนแห่เดินเท้าเปล่า—และวางอาวุธของท่านลง แม้เพียงชั่วคราว ให้แผ่นดินได้ลืมเลือนน้ำหนักของเหล็กกล้า แล้วเหล่าวิญญาณจะหลับใหลอีกครั้ง""
 tgp_east_asia_mandala_task_contract_events.3200.a: "ข้าสาบานว่าจะมีสันติภาพ"
 tgp_east_asia_mandala_task_contract_events.3200.b: "ขบวนแห่จะถูกนำ"
 tgp_east_asia_mandala_task_contract_events.3200.c: "การร้องเพลงให้เหล่าวิญญาณก็เพียงพอแล้ว"
 plagued_by_nightmares_modifier: "สมรภูมิที่ไม่ได้รับการชำระล้าง"
 plagued_by_nightmares_modifier_desc: "หลังจากที่เทวราชาเลือกที่จะไม่ชำระล้างสมรภูมิ เหล่าไพร่ก็ 'ถูกฝันร้ายรบกวน' ทำให้พวกเขาทำงานได้น้อยลง"
 
 mandala_realm_contract_0024_contract: "อวยพรช่างทอผ้า"
 mandala_realm_contract_0024_desc: "คนงานทอผ้าใน [TaskContract.GetLocation.GetNameNoTooltip] ขอให้ท่านอวยพรเครื่องทอของพวกเขาเพื่อความสำเร็จ"
 mandala_realm_contract_0024_desc_title: "[TaskContract.MakeScope.Var('loc_compliment').GetFlagName|U] [GetPlayer.GetTitleAsNameNoTooltip],"
 mandala_realm_contract_0024_request: "จงไปปรากฏตัวที่ [TaskContract.GetLocation.GetName] และเลือกตัวเลือกตาม [mandala_aspect|E] ของท่าน"
 tgp_east_asia_mandala_task_contract_events.3300.t: "$mandala_ritual_prefix$ อวยพรช่างทอผ้า"
 tgp_east_asia_mandala_task_contract_events.3300.desc: "เมื่อเรามาถึง [ritual_location.GetName] หนึ่งในช่างทอผ้าหลายคนโค้งคำนับต่อหน้าข้า "เครื่องทอของเราแสดงภาพเหล่าทวยเทพ—[ROOT.Char.GetFaith.WealthGodName] [ROOT.Char.GetFaith.HealthGodName] และบัดนี้คือท่าน [ROOT.Char.GetTitleAsNameNoTooltip]" [local_character.GetSheHe|U] กล่าว พลางคลี่พรมสีสดใสชุดหนึ่งออก\n\n"โปรดอวยพรการค้าของเราให้เจริญรุ่งเรือง และหมู่บ้านของเราให้สงบสุข โปรดทอบางสิ่งด้วยมือของท่านเอง—สัญลักษณ์ เพื่อให้พวกเราได้เคารพบูชา""
 tgp_east_asia_mandala_task_contract_events.3300.a: "ข้าจะทอภาพ [ROOT.Char.GetFaith.WealthGodName] ด้วยทองคำและผ้าไหม"
 tgp_east_asia_mandala_task_contract_events.3300.b: "ภาพ [ROOT.Char.GetFaith.HealthGodName] ที่บุด้วยเงินก็นับว่าเหมาะสม"
 tgp_east_asia_mandala_task_contract_events.3300.c: "ผ้าทอธรรมดาที่แสดงภาพ [ROOT.Char.GetFaith.DivineRealm] ก็เพียงพอแล้ว"
 healthgod_symbol_modifier: "สมาคมช่างทอผู้สงบ"
 healthgod_symbol_modifier_desc: "ช่างทอผ้าในมณฑลนี้สร้างสรรค์ภาพที่สวยงามของเทพเจ้าผู้เป็นตัวแทนของสุขภาพและอายุยืน"
 wealthgod_symbol_modifier: "สมาคมช่างทอผู้มั่งคั่ง"
 wealthgod_symbol_modifier_desc: "ช่างทอผ้าในมณฑลนี้สร้างสรรค์ภาพที่สวยงามของเทพเจ้าผู้เป็นตัวแทนของความมั่งคั่งและความร่ำรวย"
 
 mandala_realm_contract_0025_contract: "การหักหอก"
 mandala_realm_contract_0025_desc: "ผู้อาวุโสของ [TaskContract.GetLocation.GetNameNoTooltip] ขอให้ท่านหักหอกในพิธี เพื่อเป็นสัญลักษณ์ของการสิ้นสุดความบาดหมางในท้องถิ่น"
 mandala_realm_contract_0025_desc_title: "[TaskContract.MakeScope.Var('loc_compliment').GetFlagName|U] [GetPlayer.GetTitleAsNameNoTooltip],"
 mandala_realm_contract_0025_request: "จงไปปรากฏตัวที่ [TaskContract.GetLocation.GetName] และเลือกตัวเลือกตาม [mandala_aspect|E] ของท่าน"
 tgp_east_asia_mandala_task_contract_events.3400.t: "$mandala_ritual_prefix$ การหักหอก"
 tgp_east_asia_mandala_task_contract_events.3400.desc: ""[ROOT.Char.GetTitleAsNameNoTooltip] ผู้เมตตา วันนี้เป็นวันแห่งความปรีดายิ่ง!" หัวหน้า[local_character.GetWomanMan] กล่าวอย่างยิ้มแย้ม "ความบาดหมางที่ยาวนานได้สิ้นสุดลงแล้ว—ลูกชายของเราจะไม่ต้องตายอย่างไร้ค่าอีกต่อไป!"\n\n"ตอนนี้เราขอเพียงสันติภาพ โปรดรับหอกของเราไปและหักมันเหนือเปลวไฟ เพื่อให้เหล่าวิญญาณเชื่อมั่นในเจตนาของเรา""
 tgp_east_asia_mandala_task_contract_events.3400.a: "ข้าจะหักแม้กระทั่งหอกของข้าเอง—สันติภาพจะบังเกิด"
 tgp_east_asia_mandala_task_contract_events.3400.b: "หอกเหล่านั้นจะถูกหัก"
 tgp_east_asia_mandala_task_contract_events.3400.c: "หักหอกเพียงเล่มเดียวก็เพียงพอแล้ว"
