 mandala_realm_contract_0026_request: "จงไปปรากฏตัวที่ [TaskContract.GetLocation.GetName] และเลือกตัวเลือกตาม [mandala_aspect|E] ของท่าน"
 tgp_east_asia_mandala_task_contract_events.3500.t: "$mandala_ritual_prefix$ สันติภาพของกูรู"
 tgp_east_asia_mandala_task_contract_events.3500.desc: ""[ROOT.Char.GetTitleAsNameNoTooltip] ผู้สูงส่ง ข้าคือกูรู [local_character.GetFirstName]—ข้าชี้นำผู้คนแห่ง [ritual_location.GetName]" [GetTrait('devoted').GetName( local_character )|l] กล่าว น้ำเสียงของ [local_character.GetHerHis] มั่นคงด้วยความเชื่อมั่น "ข้าเรียกท่านมาที่นี่ เพราะดินแดนเหล่านี้ต้องการมือในการทำนา ไม่ใช่เพื่อถือหอก"\n\n"ขอให้บุตรของชาวนาได้ไถนาของบิดา—ขอให้คนรุ่นหนึ่งได้เติบโตขึ้นมารู้จักความสงบที่แท้จริง""
 tgp_east_asia_mandala_task_contract_events.3500.a: "พวกเขาจะได้รู้จักความสงบ—และเจ้าจะได้เดินเคียงข้างข้า"
 tgp_east_asia_mandala_task_contract_events.3500.b: "ข้ายังมีอีกมากที่ต้องเรียนรู้ ท่านจะเข้าร่วมกับข้าหรือไม่?"
 tgp_east_asia_mandala_task_contract_events.3500.c: "หอกของพวกเขารับใช้ความเป็นเทพของข้า"
 generation_of_peace_modifier: "ยุคสมัยแห่งสันติภาพ"
 generation_of_peace_modifier_desc: "คนรุ่นหนึ่งของไพร่ได้รับอนุญาตให้เติบโตอย่างสงบสุข โดยไม่มีการเกณฑ์ทหาร"
 
 mandala_realm_contract_0027_contract: "กฤษฎีกาปรองดอง"
 mandala_realm_contract_0027_desc: "ผู้อาวุโสแห่ง [TaskContract.GetLocation.GetNameNoTooltip] ขอให้ท่านสั่งห้ามการลาดตระเวนติดอาวุธ และจารึกกฤษฎีกาว่าข้อพิพาททั้งหมดต้องยุติด้วยการไกล่เกลี่ย"
 mandala_realm_contract_0027_desc_title: "[TaskContract.MakeScope.Var('loc_compliment').GetFlagName|U] [GetPlayer.GetTitleAsNameNoTooltip],"
 mandala_realm_contract_0027_request: "จงไปปรากฏตัวที่ [TaskContract.GetLocation.GetName] และเลือกตัวเลือกตาม [mandala_aspect|E] ของท่าน"
 tgp_east_asia_mandala_task_contract_events.3600.t: "$mandala_ritual_prefix$ กฤษฎีกาปรองดอง"
 tgp_east_asia_mandala_task_contract_events.3600.desc: ""[ROOT.Char.GetTitleAsNameNoTooltip] ผู้ยิ่งใหญ่ ใน [ritual_location.GetName] ข้อพิพาทตัดสินกันด้วยหอกและไฟ—ไม่ใช่คำพูด"" ผู้อาวุโสกล่าว พลางวางแผ่นศิลาขนาดใหญ่ลง พร้อมกับเครื่องมือสำหรับจารึก ""คำพูดของท่านคือกฎหมายศักดิ์สิทธิ์ จงสลักสันติภาพลงบนหิน และยุติความรุนแรง""\n\nข้าหยิบเครื่องมือ ข้าจะจารึกว่า...""
 tgp_east_asia_mandala_task_contract_events.3600.a: "...ว่าห้ามใช้อาวุธ"
 tgp_east_asia_mandala_task_contract_events.3600.b: "...ว่าข้อพิพาทต้องแก้ไขด้วยคำพูด"
 tgp_east_asia_mandala_task_contract_events.3600.c: "...ว่าข้าดีงามและยิ่งใหญ่"
 weapon_ban_modifier: "จารึกห้ามอาวุธ"
 weapon_ban_modifier_desc: "ห้ามพกพาอาวุธโดยกฤษฎีกาของเทวราชา"
 arbitration_edict_modifier: "จารึกการไกล่เกลี่ย"
 arbitration_edict_modifier_desc: "ข้อพิพาทต้องแก้ไขด้วยคำพูดเท่านั้น โดยกฤษฎีกาของเทวราชา"
 
 mandala_realm_contract_0028_contract: "มรรคแปด"
 mandala_realm_contract_0028_desc: "ผู้นำท้องถิ่นร้องขอให้ท่านเดินทางผ่านแปดหมู่บ้านอย่างเงียบๆ—หนึ่งแห่งสำหรับ แต่ละมุมของ [TaskContract.GetLocation.GetNameNoTooltip]"
 mandala_realm_contract_0028_desc_title: "[TaskContract.MakeScope.Var('loc_compliment').GetFlagName|U] [GetPlayer.GetTitleAsNameNoTooltip],"
 mandala_realm_contract_0028_request: "จงไปปรากฏตัวที่ [TaskContract.GetLocation.GetName] และเลือกตัวเลือกตาม [mandala_aspect|E] ของท่าน"
 tgp_east_asia_mandala_task_contract_events.3700.t: "$mandala_ritual_prefix$ มรรคแปด"
 tgp_east_asia_mandala_task_contract_events.3700.desc: ""[ritual_location.GetName] เต็มไปด้วยหมู่บ้าน—และเต็มไปด้วยความเหนื่อยล้า การแข่งขันชิงดี และความชั่วร้าย"" ผู้อาวุโสกล่าว พลางหันช้าๆ ขณะที่ [local_character.GetSheHe] กวาดมือเป็นวงกว้าง ""แปดแห่งในจำนวนนั้นอยู่ล้อมรอบ [ritual_location.Custom('GetRandomRegionalDangerSingular')] นี้ แต่ละแห่งอยู่ในทิศทางที่ต่างกัน""\n\n""เพื่อสอน [Glossary('มรรคมีองค์แปด', 'EIGHTFOLD_PATH_GLOSS')] แก่พวกเขา ท่านต้องเดินบนเส้นทางนั้นด้วยตนเอง—แปดหมู่บ้าน แปดภาระ—โดยปราศจากการพักผ่อนหรือความสะดวกสบาย เมื่อนั้นพวกเขาจึงจะเห็นว่าความพากเพียรโดยชอบนั้นหมายความว่าอย่างไรอย่างแท้จริง""
 tgp_east_asia_mandala_task_contract_events.3700.a: "ข้าจะอดทนต่อมันดั่งพระโพธิสัตว์"
 tgp_east_asia_mandala_task_contract_events.3700.b: "ข้าจะปฏิบัติตามเส้นทาง แม้ว่าข้าจะต้องพักผ่อนบ้าง"
 tgp_east_asia_mandala_task_contract_events.3700.c: "มันจะเร็วกว่าหากไปบนหลังม้า..."
 EIGHTFOLD_PATH_GLOSS: "หลักคำสอนสำคัญในพระพุทธศาสนา ที่สรุปหลักการแปดประการเพื่อการดำเนินชีวิตที่ถูกต้อง—สัมมาทิฐิ สัมมาสังกัปปะ สัมมาวาจา สัมมากัมมันตะ สัมมาอาชีวะ สัมมาวายามะ สัมมาสติ และสัมมาสมาธิ\n\nอุดมการณ์ที่คล้ายคลึงกันนี้ได้รับการเคารพในประเพณีฮินดู วิญญาณนิยม และศาสนาผสานในเอเชียใต้และเอเชียตะวันออกเฉียงใต้ เพื่อเป็นแนวทางสู่ความสามัคคีส่วนบุคคลและสังคม"
 eightfold_path_modifier: "มรรคแปด"
 eightfold_path_modifier_desc: "เทวราชาได้แสดงให้เห็นถึงคุณธรรมของ [Glossary('มรรคมีองค์แปด', 'EIGHTFOLD_PATH_GLOSS')] ที่นี่"
 walked_the_eightfold_path_modifier: "เดินบนมรรคแปด"
 walked_the_eightfold_path_modifier_desc: "เทวราชานี้ได้แสดงให้เห็นถึงคุณธรรมของ [Glossary('มรรคมีองค์แปด', 'EIGHTFOLD_PATH_GLOSS')] โดยการเดินผ่านแปดหมู่บ้านโดยไม่หยุดพัก"
 
 mandala_realm_contract_0029_contract: "ป่าศักดิ์สิทธิ์ที่ถูกคุกคาม"
 mandala_realm_contract_0029_desc: "ป่าศักดิ์สิทธิ์ใน [TaskContract.GetLocation.GetNameNoTooltip] กำลังถูกคุกคามจากพวกลักลอบล่าสัตว์และตัดไม้ ชาวบ้านขอร้องให้ท่านทิ้งนักรบไว้เฝ้า"
 mandala_realm_contract_0029_desc_title: "[TaskContract.MakeScope.Var('loc_compliment').GetFlagName|U] [GetPlayer.GetTitleAsNameNoTooltip],"
 mandala_realm_contract_0029_request: "จงไปปรากฏตัวที่ [TaskContract.GetLocation.GetName] และเลือกตัวเลือกตาม [mandala_aspect|E] ของท่าน"
 tgp_east_asia_mandala_task_contract_events.3800.t: "$mandala_ritual_prefix$ ป่าศักดิ์สิทธิ์ที่ถูกคุกคาม"
 tgp_east_asia_mandala_task_contract_events.3800.desc: ""ป่า [ritual_location.Custom('GetRandomRegionalWood')] ศักดิ์สิทธิ์ของเราถูก ทำให้มัวหมอง [ROOT.Char.GetTitleAsNameNoTooltip]"" ชาวป่า[local_character.GetWomenMen] ในท้องถิ่นกล่าว พลางชี้ไปทางที่โล่ง ""พวกมันกลายเป็นสวรรค์ของพวกลักลอบล่าสัตว์ หัวขโมย และคนตัดไม้ ได้โปรด—ส่งทหารของท่านมาแก้ไขความผิดนี้ และปล่อยให้แผ่นดินกลับมารุ่งเรืองอีกครั้ง""
 tgp_east_asia_mandala_task_contract_events.3800.a: "ทหารประจำการของข้าจะเฝ้าป่า"
 tgp_east_asia_mandala_task_contract_events.3800.b: "กองทหารรักษาการณ์แห่ง [county_scope.GetNameNoTooltip] จะปกป้องผืนดิน"
 tgp_east_asia_mandala_task_contract_events.3800.c: "พรจะชำระล้างมลทิน"
 well_protected_groves_modifier: "ป่าที่ได้รับการคุ้มครองอย่างดี"
 well_protected_groves_modifier_desc: "ป่าละเมาะในเคาน์ตีนี้ได้รับการคุ้มครองอย่างดี"
 garrisoned_groves_modifier: "ป่าที่มีกองทหารรักษาการณ์"
 garrisoned_groves_modifier_desc: "ป่าละเมาะในเคาน์ตีนี้ได้รับการคุ้มครองโดยกองทหารรักษาการณ์หลัก ทำให้กำลังพลต้องกระจายออกไป"
 
 mandala_realm_contract_0030_contract: "สัตย์ปฏิญาณแห่งความนิ่ง"
 mandala_realm_contract_0030_desc: "[TaskContract.GetLocation.GetNameNoTooltip] ขอให้ท่านปฏิญาณตนต่อสาธารณะว่าจะไม่ใช้ความรุนแรง—โดยการนั่งนิ่งเงียบเป็นเวลาหลายวัน เพื่อสอนพวกเขาถึงความสงบ"
 mandala_realm_contract_0030_desc_title: "[TaskContract.MakeScope.Var('loc_compliment').GetFlagName|U] [GetPlayer.GetTitleAsNameNoTooltip],"
 mandala_realm_contract_0030_request: "จงไปปรากฏตัวที่ [TaskContract.GetLocation.GetName] และเลือกตัวเลือกตาม [mandala_aspect|E] ของท่าน"
 tgp_east_asia_mandala_task_contract_events.3900.t: "$mandala_ritual_prefix$ สัตย์ปฏิญาณแห่งความนิ่ง"
 tgp_east_asia_mandala_task_contract_events.3900.desc: "ก่อนที่เราจะได้เห็น [ritual_location.GetName] เราก็ได้ยินเสียงมัน: การตะโกน การโต้เถียง เสียงดังตลอดเวลา ที่นี่ไม่ใช่สถานที่อันสงบ\n\n""[ROOT.Char.GetTitleAsNameNoTooltip] ผู้ยิ่งใหญ่ หากท่านเงียบ พวกเขาก็จะเงียบ เช่นกัน—หากท่านสงบ พวกเขาก็จะเป็น เช่นนั้น"" หัวหน้า[local_character.GetWomanMan] อ้อนวอน ""โปรดพิสูจน์ความเป็นเทพของท่าน และปลดปล่อยพวกเราจากความขัดแย้งนี้""
 tgp_east_asia_mandala_task_contract_events.3900.a: "ขอให้สามจันทราผ่านไปในความเงียบ และความสงบจะตามมา"
 tgp_east_asia_mandala_task_contract_events.3900.b: "หนึ่งสัปดาห์แห่งความเงียบจะ ทำให้ความไม่สงบสงบลง"
 tgp_east_asia_mandala_task_contract_events.3900.c: "การเดินผ่านเมืองน่าจะ ทำให้ทุกคนสงบลง"
 discordant_town_modifier: "เมืองแห่งความขัดแย้ง"
 discordant_town_modifier_desc: "มณฑลนี้เต็มไปด้วยความขัดแย้งและการทะเลาะวิวาท"
 
 mandala_realm_contract_0031_contract: "การวางศิลา"
 mandala_realm_contract_0031_desc: "ชาวบ้านแห่ง [TaskContract.GetLocation.GetNameNoTooltip] ปรารถนาที่จะสร้างอาคารเพื่อเป็นเกียรติแก่ท่าน พวกเขาต้องการพิธีวางอาวุธก่อนที่การก่อสร้างจะเริ่มขึ้น"
 mandala_realm_contract_0031_desc_title: "[TaskContract.MakeScope.Var('loc_compliment').GetFlagName|U] [GetPlayer.GetTitleAsNameNoTooltip],"
 mandala_realm_contract_0031_request: "จงไปปรากฏตัวที่ [TaskContract.GetLocation.GetName] และเลือกตัวเลือกตาม [mandala_aspect|E] ของท่าน"
 tgp_east_asia_mandala_task_contract_events.4000.t: "$mandala_ritual_prefix$ การวางศิลา"
 tgp_east_asia_mandala_task_contract_events.4000.desc: ""[ROOT.Char.GetTitleAsNameNoTooltip] ผู้สงบ พวกเราคือ [Glossary('ศิลปกะราส', 'SILPAKARAS_GLOSS')] แห่ง [ritual_location.GetName]"" [local_character.GetWomenMen] กล่าว พลางโค้งคำนับขณะที่พวกเขายกค้อนของช่างก่อสร้างขึ้น ""พวกเราปรารถนาที่จะสร้างโครงสร้างในจิตวิญญาณแห่งสันติภาพและความเจริญรุ่งเรือง""\n\n""แต่ก่อนที่เราจะเริ่มได้ เราขอให้ท่านฝัง [Glossary('ปิดัง', 'PEDANG_GLOSS')] ของท่านไว้ใต้ฐานราก—เพื่อขับไล่วิญญาณที่รุนแรงและชำระพื้นดินให้บริสุทธิ์""
 tgp_east_asia_mandala_task_contract_events.4000.a: "ข้าจะสั่งให้กองทัพของข้าวางอาวุธ"
 tgp_east_asia_mandala_task_contract_events.4000.b: "[sacrificial_regiment.GetNameNoTooltip] ของข้าจะยอมวางอาวุธ"
 tgp_east_asia_mandala_task_contract_events.4000.c: "ข้าจะฝังดาบเล่มหนึ่งของข้าไว้ใต้พื้นดิน"
 SILPAKARAS_GLOSS: "ในภาษาสันสกฤต ศิลปกร (Śilpakāra) หมายถึง ช่างฝีมือที่มีทักษะด้านสถาปัตยกรรมหรือประติมากรรม ในราชสำนักฮินดู-พุทธทั่วเอเชียใต้และเอเชียตะวันออกเฉียงใต้ พวกเขารวมตัวกันเป็นสมาคมช่างฝีมือ ในการเมืองแบบมณฑลของเขมร ชวา และอินเดีย เหล่าศิลปกรมักทำงานภายใต้การอุปถัมภ์ของเทพเจ้าหรือราชวงศ์"
 pious_silpakaras_modifier: "ศิลปกรผู้เปี่ยมศรัทธา"
 pious_silpakaras_modifier_desc: "กลุ่ม [Glossary('ศิลปกะราส', 'SILPAKARAS_GLOSS')] ผู้เปี่ยมศรัทธากำลังทำงานในมณฑลนี้"
 ritually_disarmed_modifier: "ปลดอาวุธตามพิธีกรรม"
 ritually_disarmed_modifier_desc: "ตัวละครนี้ได้ฝังอาวุธของตนเอง ซึ่งเป็นส่วนหนึ่งของพิธีกรรมมณฑล"
 
 mandala_realm_contract_0032_contract: "นักพรตหัวเราะ"
 mandala_realm_contract_0032_desc: "นักพรตจอมเล่นตลกกำลังสร้างความโกลาหลใน [TaskContract.GetLocation.GetNameNoTooltip] ชาวบ้านเรียกหาท่านเพื่อเอาชนะตัวแทนแห่งความวุ่นวายนี้"
 mandala_realm_contract_0032_desc_title: "[TaskContract.MakeScope.Var('loc_compliment').GetFlagName|U] [GetPlayer.GetTitleAsNameNoTooltip],"
 mandala_realm_contract_0032_request: "จงไปปรากฏตัวที่ [TaskContract.GetLocation.GetName] และเลือกตัวเลือกตาม [mandala_aspect|E] ของท่าน"
 tgp_east_asia_mandala_task_contract_events.4100.t: "$mandala_ritual_prefix$ นักพรตหัวเราะ"
 tgp_east_asia_mandala_task_contract_events.4100.desc: "เสียงหัวเราะดังต้อนรับเราเมื่อมาถึง [ritual_location.GetName] ฝูงชนมารวมตัวกันรอบ [GetTrait('devoted').GetName( local_character )|l] ร่างท้วม ใบหน้าของพวกเขาเต็มไปด้วยความคาดหวัง ""...และบัดนี้ จงดู [local_character_2.Custom('dummy_peasant_profession')] [GetTrait('arrogant').GetName( local_character_2 )|l] ออกจากบ้านของ [local_character_2.GetHerHis]"" นักพรตกล่าวด้วยน้ำเสียงต่ำและขี้เล่น\n\nในขณะนั้น ถังใบหนึ่งก็พลิกคว่ำลงมาจากประตู—สาดใส่ [local_character_2.GetWomanMan] จนเปียกโชก ""อัตตาของ [local_character_2.GetHerHis|U] ถูกชำระล้างอย่างหมดจดแล้ว!"" [GetTrait('devoted').GetName( local_character )|l] คำราม พลางกุมท้อง [local_character.GetHerHis] หัวเราะ ชาวบ้านต่างระเบิดเสียงหัวเราะ—แม้ แต่เหยื่อผู้เปียกโชกก็ยังหัวเราะตาม"
 tgp_east_asia_mandala_task_contract_events.4100.a: "เจ้าคิดจะชิงไหวชิงพริบกับ [ROOT.Char.GetTitleAsNameNoTooltip] รึ? ไม่มีวัน!"
 tgp_east_asia_mandala_task_contract_events.4100.b: "[local_character.GetSheHe|U] ต้องสอนข้า!"
 tgp_east_asia_mandala_task_contract_events.4100.c: "[local_character.GetSheHe|U] คือร่างอวตารแห่งเจตจำนงของข้า"
 
 mandala_realm_contract_0033_contract: "หุ่นล่อวิญญาณ"
 mandala_realm_contract_0033_desc: "ชาวบ้านใน [TaskContract.GetLocation.GetNameNoTooltip] ขอให้ท่านสร้างรูปเคารพลวง—เพื่อหลอกล่อวิญญาณร้ายที่สิงสู่อยู่ในดินแดนของพวกเขา"
 mandala_realm_contract_0033_desc_title: "[TaskContract.MakeScope.Var('loc_compliment').GetFlagName|U] [GetPlayer.GetTitleAsNameNoTooltip],"
 mandala_realm_contract_0033_request: "จงไปปรากฏตัวที่ [TaskContract.GetLocation.GetName] และเลือกตัวเลือกตาม [mandala_aspect|E] ของท่าน"
 tgp_east_asia_mandala_task_contract_events.4200.t: "$mandala_ritual_prefix$ หุ่นล่อวิญญาณ"
 tgp_east_asia_mandala_task_contract_events.4200.desc: ""[ROOT.Char.GetTitleAsNameNoTooltip] เหล่าวิญญาณกำลังสาปแช่ง [local_character.Custom('RegionalRootVegetablePlural')] ของเรา เหลือไว้เพียงความเน่าเปื่อย"" หัวหน้า[local_character.GetWomanMan] กล่าว พลางชี้ไปยังกองไม้และ [ritual_location.Custom('GetRandomImprovisedBridgeMaterial')] ""ท่านต้องสร้างรูปเคารพเพื่อหลอกลวงวิญญาณ—เพื่อ ทำให้พวกมันสงบลง หรือล่อพวกมันไปที่อื่น""
 tgp_east_asia_mandala_task_contract_events.4200.a: "ข้าจะสร้างรูปเคารพ [local_character.Custom('RegionalRootVegetable')] ขนาดใหญ่เพื่อข่มขวัญพวกมัน"
 tgp_east_asia_mandala_task_contract_events.4200.b: "รูปเคารพหลายหน้าของข้าจะขับไล่พวกมัน"
 tgp_east_asia_mandala_task_contract_events.4200.c: "รูปจำลองของ [ROOT.Char.GetFaith.HealthGodName] จะ ทำให้พวกมันสงบลง"
 mocked_idol_modifier: "รูปเคารพที่ถูกเยาะเย้ย"
 mocked_idol_modifier_desc: "รูปเคารพที่สร้างโดยเทวราชาถูกเยาะเย้ยอย่างกว้างขวางในเคาน์ตีนี้"
 vegetable_idol_modifier: "รูปเคารพวิญญาณผัก"
 vegetable_idol_modifier_desc: "รูปเคารพที่สร้างโดยเทวราชาเป็นที่เชื่อกันอย่างกว้างขวางว่าจะให้ผลผลิตที่อุดมสมบูรณ์"
 ruler_idol_modifier: "รูปเคารพวิญญาณเทวราชา"
 ruler_idol_modifier_desc: "รูปเคารพที่สร้างโดยเทวราชาเป็นที่เชื่อกันอย่างกว้างขวางว่าจะปัดเป่าวิญญาณชั่วร้าย"
 
 mandala_realm_contract_0034_contract: "เกมวัดปัญญา"
 mandala_realm_contract_0034_desc: "ขุนนางใน [TaskContract.GetLocation.GetNameNoTooltip] ได้ท้าทายท่านในเกมวัดปัญญา—เพื่อพิสูจน์ความเป็นเทพของท่านต่อหน้าข้าราชสำนัก"
 mandala_realm_contract_0034_desc_title: "[TaskContract.MakeScope.Var('loc_compliment').GetFlagName|U] [GetPlayer.GetTitleAsNameNoTooltip],"
 mandala_realm_contract_0034_request: "จงไปปรากฏตัวที่ [TaskContract.GetLocation.GetName] และเลือกตัวเลือกตาม [mandala_aspect|E] ของท่าน"
 tgp_east_asia_mandala_task_contract_events.4300.t: "$mandala_ritual_prefix$ เกมวัดปัญญา"
 tgp_east_asia_mandala_task_contract_events.4300.desc: "ขณะที่เราเข้าใกล้ [ritual_location.GetHolding.GetType.GetName] ใน [ritual_location.GetName] ข้าได้รับการต้อนรับเข้าไปข้างในโดย [local_character.GetTitledFirstNameNicknamed] ""[ROOT.Char.GetTitleAsNameNoTooltip] ผู้ยิ่งใหญ่และเจ้าเล่ห์ ข้าขอท้าท่านเล่น [local_character.Custom('BG_GameType_Generic')]"" [local_character.GetSheHe] กล่าว พลางยกหมากแกะสลักขึ้น ""ชนะ และท่านจะได้รับความเคารพจากข้า ชนะด้วย #EMP การหลอกลวง#!—และท่านจะได้รับความจงรักภักดีอย่างไม่มีวันตายจากข้า""\n\nคนรับใช้เข้ามาพร้อมกับ [local_character.Custom('GetExpensiveMeal')] และ [local_character.Custom('GetExpensiveDrink_Singular')] ""แต่ถ้าท่านแพ้... ก็ ค่อยว่ากัน""
 tgp_east_asia_mandala_task_contract_events.4300.a: "ข้าจะเดินหมากด้วยมือของ [ROOT.Char.GetFaith.TricksterGodNamePossessive]"
 tgp_east_asia_mandala_task_contract_events.4300.b: "ทักษะของข้าจะพาข้าผ่านพ้นไป"
 tgp_east_asia_mandala_task_contract_events.4300.c: "แค่เกมกระชับมิตร ไม่มีอะไรมาก"
 
 mandala_realm_contract_0035_contract: "หัวขโมยศักดิ์สิทธิ์"
 mandala_realm_contract_0035_desc: "อาชญากรใน [TaskContract.GetLocation.GetNameNoTooltip] มีหน้าตาคล้ายท่าน และได้ก่อเหตุโจรกรรมขณะอ้างตนว่าเป็นท่าน"
 mandala_realm_contract_0035_desc_title: "[TaskContract.MakeScope.Var('loc_compliment').GetFlagName|U] [GetPlayer.GetTitleAsNameNoTooltip],"
 mandala_realm_contract_0035_request: "จงไปปรากฏตัวที่ [TaskContract.GetLocation.GetName] และเลือกตัวเลือกตาม [mandala_aspect|E] ของท่าน"
 tgp_east_asia_mandala_task_contract_events.4400.t: "$mandala_ritual_prefix$ หัวขโมยศักดิ์สิทธิ์"
 tgp_east_asia_mandala_task_contract_events.4400.desc: ""ข้าต้องการสร้อยคอของเจ้า—มันจำเป็นสำหรับพิธีกรรมของข้า"" [local_character.GetWomanMan] ที่ดูคล้ายข้าอย่าง #EMP น่าขนลุก#! กล่าว ข่มขู่ชาวบ้านที่ตกตะลึง ""เร็วเข้า อย่าให้ [ROOT.Char.GetTitleAsNameNoTooltip] ของเจ้ารอนาน!""\n\n[local_character.GetSheHe|U] หันมา—และตัวแข็งทื่อเมื่อเห็นข้า ""โอ้ [ROOT.Char.GetTitleAsNameNoTooltip] ผู้น่านับถือที่สุด..! ข้าแค่... เก็บเครื่องบรรณาการในนามของท่าน!"" [local_character.GetSheHe] โพล่งออกมา"
 tgp_east_asia_mandala_task_contract_events.4400.a: "ห้ามขโมยอีกต่อไป—เจ้าจะเป็นกระบอกเสียงให้ข้าใน [ritual_location.GetNameNoTooltip]"
 tgp_east_asia_mandala_task_contract_events.4400.b: "เจ้ามีประโยชน์ เจ้าจะกลับไปกับข้า"
 tgp_east_asia_mandala_task_contract_events.4400.c: "จงคืนทุกสิ่งที่เจ้าขโมยไป"
 omnipresent_authority_modifier: "อำนาจที่ปรากฏอยู่ทุกหนแห่ง"
 omnipresent_authority_modifier_desc: "มันเกือบราวกับว่าเทวราชาอาศัยอยู่ในเคาน์ตีนี้ด้วยความถี่ที่ถูกพบเห็น... แต่พวกเขาไม่ได้อาศัยอยู่ในเมืองหลวงหรอกหรือ?"
 
 mandala_realm_contract_0036_contract: "การทดสอบวิญญาณ"
 mandala_realm_contract_0036_desc: "ผู้คนใน [TaskContract.GetLocation.GetNameNoTooltip] เชื่อว่าพวกเขากำลังถูกหลอกโดย [TaskContract.GetLocation.Custom('GetProvinceTricksterSpirit')]"
 mandala_realm_contract_0036_desc_title: "[TaskContract.MakeScope.Var('loc_compliment').GetFlagName|U] [GetPlayer.GetTitleAsNameNoTooltip],"
 mandala_realm_contract_0036_request: "จงไปปรากฏตัวที่ [TaskContract.GetLocation.GetName] และเลือกตัวเลือกตาม [mandala_aspect|E] ของท่าน"
 tgp_east_asia_mandala_task_contract_events.4500.t: "$mandala_ritual_prefix$ การทดสอบวิญญาณ"
 tgp_east_asia_mandala_task_contract_events.4500.desc: ""[ROOT.Char.GetTitleAsNameNoTooltip] ผู้ยิ่งใหญ่ พวกเรากำลังถูกหลอกโดย [ritual_location.Custom('GetProvinceTricksterSpirit')]"" ผู้อาวุโสครวญคราง พลางนวดหน้าผากของ [local_character.GetHerHis] ""บ่อน้ำเต็มไปด้วยกบ ขนมเค้กข้าวขมปี๋ในชั่วข้ามคืน ฝูง [ROOT.Char.Custom('GetRandomRegionalWildDaytimeBird')] ทำให้เด็กๆ หวาดกลัว—และข้าตื่นขึ้นมาพบกับ #EMP [local_character.Custom('RegionalPoxAnimal')]#! นอนอยู่ข้างๆ!""\n\n[local_character.GetSheHe|U] เอนตัวเข้ามา ดวงตากรอกไปมา ""ท่านต้องชิงไหวชิงพริบกับนักเล่นกล... ทำพิธีบูชายัญปลอมๆ เพื่อ ทำให้มันสับสน!""
 tgp_east_asia_mandala_task_contract_events.4500.a: "รวมตัวชาวบ้าน—ข้าจะ 'บูชายัญ' เด็ก!"
 tgp_east_asia_mandala_task_contract_events.4500.b: "ข้าจะใช้แพะที่ถูกฝึกให้แกล้งตาย"
 tgp_east_asia_mandala_task_contract_events.4500.c: "ข้าจะถวายผลไม้... แล้วกินเป็นอาหารเย็น"
 
 mandala_realm_contract_0037_contract: "เทศกาลกลับตาลปัตร"
 mandala_realm_contract_0037_desc: "หมู่บ้านใน [TaskContract.GetLocation.GetNameNoTooltip] กำลังจัดเทศกาลที่กฎเกณฑ์ทุกอย่างกลับตาลปัตร"
 mandala_realm_contract_0037_desc_title: "[TaskContract.MakeScope.Var('loc_compliment').GetFlagName|U] [GetPlayer.GetTitleAsNameNoTooltip],"
 mandala_realm_contract_0037_request: "จงไปปรากฏตัวที่ [TaskContract.GetLocation.GetName] และเลือกตัวเลือกตาม [mandala_aspect|E] ของท่าน"
 tgp_east_asia_mandala_task_contract_events.4600.t: "$mandala_ritual_prefix$ เทศกาลกลับตาลปัตร"
 tgp_east_asia_mandala_task_contract_events.4600.desc: "เมื่อเรามาถึง [ritual_location.GetName] เด็กคนหนึ่งสวมมงกุฎทำเองวิ่งผ่านข้าไป ""ข้าคือ [ROOT.Char.GetTitleAsNameNoTooltip]! จงดูความเป็นเทพของข้า!"" [local_character_2.GetSheHe] ตะโกน หมู่บ้านมีชีวิตชีวาด้วยเทศกาลที่บทบาทกลับตาลปัตร: คนจน แต่งตัวเป็นขุนนาง คนรับใช้ทำตัวเป็นเจ้านาย และเจ้านายถือถาด\n\nหากข้าจะเข้าร่วมกับพวกเขาโดยปลอมตัว ไม่เป็นที่สังเกต พวกเขาจะได้เห็นความเป็นเทพที่แท้จริง"
 tgp_east_asia_mandala_task_contract_events.4600.a: "ข้าจะไปในฐานะขอทาน"
 tgp_east_asia_mandala_task_contract_events.4600.b: "ข้าจะไปในฐานะทหาร"
 tgp_east_asia_mandala_task_contract_events.4600.c: "ข้าจะไปในฐานะ... ตัวข้าเอง"
 
 mandala_realm_contract_0038_contract: "แพะพยากรณ์"
 mandala_realm_contract_0038_desc: "แพะพูดได้ได้รับการยกย่องว่าเป็นผู้ส่งสารศักดิ์สิทธิ์ของท่านใน [TaskContract.GetLocation.GetNameNoTooltip]"
 mandala_realm_contract_0038_desc_title: "[TaskContract.MakeScope.Var('loc_compliment').GetFlagName|U] [GetPlayer.GetTitleAsNameNoTooltip],"
 mandala_realm_contract_0038_request: "จงไปปรากฏตัวที่ [TaskContract.GetLocation.GetName] และเลือกตัวเลือกตาม [mandala_aspect|E] ของท่าน"
 tgp_east_asia_mandala_task_contract_events.4700.t: "$mandala_ritual_prefix$ แพะพยากรณ์"
 tgp_east_asia_mandala_task_contract_events.4700.desc: ""มาเถิด มาชม—เป็นพยานแพะศักดิ์สิทธิ์ที่ [ROOT.Char.GetTitledFirstNameNoTooltip] พูดผ่าน!"" [local_character.GetWomanMan] โค้งคำนับอย่างโอเวอร์ และแพะก็ขูดดินด้วยกีบของมัน ""...หก เจ็ด แปด! แปดครั้ง! มันเป็นสัญญาณ—พวกเราทุกคนต้องซื้อ [local_character_2.Custom('GetExpensiveDrink_Singular')] ของ [local_character_2.GetFirstNamePossessive]!""\n\n[local_character.GetSheHe|U] เงยหน้าขึ้นและตัวแข็งทื่อ ""โอ้... [ROOT.Char.GetTitleAsNameNoTooltip] ผู้ศักดิ์สิทธิ์..! ข้า—ข้าไม่เห็นท่านที่นั่น...""\n\nนักต้มตุ๋นเจ้าความคิด พร้อมกับแพะที่ถูกฝึกมา มีประโยชน์"
 tgp_east_asia_mandala_task_contract_events.4700.a: "ตราบใดที่ 'ผู้ส่งสาร' ของข้าจ่ายสิบชักหนึ่ง..."
 tgp_east_asia_mandala_task_contract_events.4700.b: "เจ้าและแพะจะไปกับข้า"
 tgp_east_asia_mandala_task_contract_events.4700.c: "...สี่ ห้า! ห้าครั้ง—มันคือการสำนึกบาปต่อหน้าสาธารณชน!"
 punished_charlatan_modifier: "นักต้มตุ๋นที่ถูกลงโทษ"
 punished_charlatan_modifier_desc: "นักต้มตุ๋นเพิ่งถูกเปิดโปงและลงโทษที่นี่"
 goat_oracle_modifier: "แพะพยากรณ์"
 goat_oracle_modifier_desc: "แพะพยากรณ์กำลังถูกแห่ไปรอบๆ เคาน์ตีนี้ โดยสันนิษฐานว่าพูดแทนเทวราชา"
 
 
 mandala_realm_contract_0039_contract: "สัตว์ร้ายในความมืด"
 mandala_realm_contract_0039_desc: "ประชากรของ [TaskContract.GetLocation.GetNameNoTooltip] กำลังเดือดร้อนจากสัตว์ร้ายที่ย่องไปมาใน [TaskContract.GetLocation.Custom('TerrainTypeProvince')] พวกเขาขอให้ท่านวางกับดักพวกมัน—หรือชิงไหวชิงพริบกับพวกมัน"
 mandala_realm_contract_0039_desc_title: "[TaskContract.MakeScope.Var('loc_compliment').GetFlagName|U] [GetPlayer.GetTitleAsNameNoTooltip],"
 mandala_realm_contract_0039_request: "จงไปปรากฏตัวที่ [TaskContract.GetLocation.GetName] และเลือกตัวเลือกตาม [mandala_aspect|E] ของท่าน"
 tgp_east_asia_mandala_task_contract_events.4800.t: "$mandala_ritual_prefix$ สัตว์ร้ายใน [ritual_location.Custom('TerrainTypeProvince')|U]"
 tgp_east_asia_mandala_task_contract_events.4800.desc: "ขณะที่เราผ่าน [ritual_location.GetName] ข้ารู้สึกถึงสายตาที่มองไม่เห็นกำลังเฝ้าดูจาก [ritual_location.Custom('TerrainTypeProvince')] ""[ROOT.Char.GetTitleAsNameNoTooltip] ผู้เจ้าเล่ห์ อยู่นิ่งๆ"" ชาวบ้านกระซิบ ""[ROOT.Char.Custom('RegionalOnlyFerociousAnimalPlural')|U]—และสัตว์ร้ายอื่นๆ—พวกมันอยู่ทุกหนแห่ง ล่อพวกมันไปที่อื่น วางกับดักพวกมัน—เราขอร้องท่าน ทำอะไรสักอย่างเถิด""
 tgp_east_asia_mandala_task_contract_events.4800.a: "เราจะวางกับดักพวกมัน หนังสัตว์ของพวกมันจะประดับบัลลังก์ของข้า"
 tgp_east_asia_mandala_task_contract_events.4800.b: "ให้เราขับไล่พวกมันออกไป [ritual_location.Custom('TerrainTypeProvince')] จะเป็นโล่ของเรา"
 tgp_east_asia_mandala_task_contract_events.4800.c: "ไม่ พวกมันคือผู้ส่งสารของข้า"
 beast_free_modifier: "ปราศจากสัตว์ร้าย"
 beast_free_modifier_desc: "มณฑลนี้ได้รับการกวาดล้างสัตว์ร้ายอันตรายโดยเทวราชาผู้ทรงพลัง"
 brimming_with_beasts_modifier: "เต็มไปด้วยสัตว์ร้าย"
 brimming_with_beasts_modifier_desc: "มณฑลนี้เต็มไปด้วยสัตว์ร้ายที่ดุร้าย ซึ่งชอบกินนักเดินทาง"
 gain_hunt_artifact_tt: "ท่านได้รับ [artifact|E] ที่เกี่ยวข้องกับการล่าสัตว์"
 
 mandala_realm_contract_0040_contract: "นาคในแม่น้ำ"
 mandala_realm_contract_0040_desc: "เหล่าไพร่เชื่อมั่นว่ามี [Glossary('นาค', 'NAGA_GLOSS')] อาศัยอยู่ในแม่น้ำของ [TaskContract.GetLocation.GetNameNoTooltip] พวกเขาเรียกร้องให้ท่านล่อมันไปที่อื่น"
 mandala_realm_contract_0040_desc_title: "[TaskContract.MakeScope.Var('loc_compliment').GetFlagName|U] [GetPlayer.GetTitleAsNameNoTooltip],"
 mandala_realm_contract_0040_request: "จงไปปรากฏตัวที่ [TaskContract.GetLocation.GetName] และเลือกตัวเลือกตาม [mandala_aspect|E] ของท่าน"
 tgp_east_asia_mandala_task_contract_events.4900.t: "$mandala_ritual_prefix$ พญานาคแห่งแม่น้ำ"
 tgp_east_asia_mandala_task_contract_events.4900.desc: ""[ROOT.Char.GetTitleAsNameNoTooltip] ผู้ชาญฉลาด [Glossary('นาค', 'NAGA_GLOSS')] ผู้พยาบาทแฝงตัวอยู่ในแม่น้ำของ [ritual_location.GetName]"" [local_character.GetWomanMan] ผู้สั่นเทาอ้อนวอน ""ชาวบ้านสิบคนหายไป—ถูกลากลงไปใต้น้ำ ท่านต้องล่อมันไปที่อื่นก่อนที่มันจะเอาชีวิตไปมากกว่านี้!""\n\nเราขี่ม้าไปตามริมฝั่งแม่น้ำ อากาศเต็มไปด้วยหมอกและความกลัว ทันใดนั้น—การเคลื่อนไหวในกอหญ้า ไม่ใช่นาค แต่เป็นจระเข้ขนาดมหึมา กว้างใหญ่และโบราณ เทพเจ้าแห่งแม่น้ำในวิหารของมัน"
 tgp_east_asia_mandala_task_contract_events.4900.a: "[entourage_character.GetFirstNameNoTooltip] เอาเนื้อนี้ไป—เราต้องจับมัน!"
 tgp_east_asia_mandala_task_contract_events.4900.b: "ระดมยิงธนูใส่มัน เราจะปล่อยให้มันมีชีวิตอยู่ไม่ได้"
 tgp_east_asia_mandala_task_contract_events.4900.c: "มันรับใช้ข้า จงอยู่ให้ห่างจากแม่น้ำ"
 river_crocodile_god_modifier: "เทพจระเข้"
 river_crocodile_god_modifier_desc: "จระเข้ขนาดมหึมา มักถูกเข้าใจผิดว่าเป็น [Glossary('นาค', 'NAGA_GLOSS')] ซุ่มซ่อนอยู่ในน่านน้ำของมณฑลนี้—กินกองทัพที่ปิดล้อมและข่มขวัญเหล่าไพร่"
 
 mandala_realm_contract_0041_contract: "ดินแดนแห่งพันธสัญญา"
 mandala_realm_contract_0041_desc: "กลุ่มผู้แสวงบุญกลุ่มใหญ่กำลังค้นหา 'ดินแดนแห่งพันธสัญญา' ของพวกเขาที่ไหนสักแห่งใน [TaskContract.GetLocation.GetNameNoTooltip]"
 mandala_realm_contract_0041_desc_title: "[TaskContract.MakeScope.Var('loc_compliment').GetFlagName|U] [GetPlayer.GetTitleAsNameNoTooltip],"
 mandala_realm_contract_0041_request: "จงไปปรากฏตัวที่ [TaskContract.GetLocation.GetName] และเลือกตัวเลือกตาม [mandala_aspect|E] ของท่าน"
 tgp_east_asia_mandala_task_contract_events.5000.t: "$mandala_ritual_prefix$ ดินแดนแห่งพันธสัญญา"
 tgp_east_asia_mandala_task_contract_events.5000.desc: "หลังจากขี่ม้าผ่าน [ritual_location.Custom('TerrainTypeProvince')] ของ [ritual_location.GetName] ในที่สุดเราก็พบผู้แสวงบุญ—อ่อนแอ เหนื่อยล้า และมีจำนวนหลายร้อยคน\n\nผู้นำของพวกเขาลุกขึ้น เสียงสั่นเทาด้วยความเหนื่อยล้า: ""เราคือผู้แสวงบุญ [local_character.GetFaith.GetAdjective] กำลังค้นหาดินแดนแห่งพันธสัญญาของเรา ท่านมาเพื่อปลดปล่อยเราหรือ? ท่านคือ [ROOT.Char.GetTitleAsNameNoTooltip]—หรือบางทีอาจเป็นเทพเจ้า?"""
 tgp_east_asia_mandala_task_contract_events.5000.a: "ข้าคือ [local_character.GetFaith.TricksterGodName] บ้านของพวกเจ้าอยู่ใน [ruler_capital_county.GetNameNoTooltip]"
 tgp_east_asia_mandala_task_contract_events.5000.b: "ข้าคือเทวราชา และ [ritual_location.GetNameNoTooltip] คือดินแดนแห่งพันธสัญญาของพวกเจ้า"
 tgp_east_asia_mandala_task_contract_events.5000.c: "ข้าคือ [ROOT.Char.GetTitleAsNameNoTooltip] และข้าขอให้พวกเจ้าโชคดีในการค้นหา"
