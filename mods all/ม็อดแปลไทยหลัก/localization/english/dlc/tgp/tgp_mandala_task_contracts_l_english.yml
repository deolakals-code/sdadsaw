 mandala_realm_contract_0022_contract: "พระสงฆ์ทะเลาะกัน"
 mandala_realm_contract_0022_desc: "ข้อพิพาทเรื่องที่ดินได้ปะทุขึ้นใน [TaskContract.GetLocation.GetNameNoTooltip] ระหว่างวัดในท้องถิ่นสองแห่ง ท่านถูกเรียกตัวไปฟื้นฟูความสงบ"
