 tgp_east_asia_mandala_task_contract_events.0990.t: "$mandala_ritual_prefix$ คิดทบทวนใหม่"
 tgp_east_asia_mandala_task_contract_events.0990.desc: "ด้วยความลังเล ข้ากำลังทบทวนแผนการของข้าที่จะเดินทางไปยัง [ongoing_destination.GetTitle.GetName] เพื่อประกอบพิธีกรรม\n\nนี่ใช่เวลาที่ควรจะเดินทางจริงหรือ? เวลาของข้าควรใช้ไปกับที่อื่นจะดีกว่าหรือไม่? ช่างเป็นการตัดสินใจที่สำคัญสำหรับสัญลักษณ์ทางศาสนา"
 tgp_east_asia_mandala_task_contract_events.0990.a: "ผู้คนแห่ง [ongoing_destination.GetNameNoTooltip] กำลังรอคอยข้าอยู่!"
 tgp_east_asia_mandala_task_contract_events.0990.a_tt: "$governor_contract_event.1012.a_tt$"
 tgp_east_asia_mandala_task_contract_events.0990.b: "$governor_contract_event.1012.b$"
 tgp_east_asia_mandala_task_contract_events.0990.b_tt: "[ongoing_contract.GetType.GetName] ใน [ongoing_destination.GetName] ถูกละทิ้ง"

 tgp_east_asia_mandala_task_contract_events.1000.t.creation: "$mandala_ritual_prefix$ โอบรับการสร้างสรรค์"
 tgp_east_asia_mandala_task_contract_events.1000.t.serenity: "$mandala_ritual_prefix$ โอบรับความสงบ"
 tgp_east_asia_mandala_task_contract_events.1000.t.destruction: "$mandala_ritual_prefix$ โอบรับการทำลาย"
 tgp_east_asia_mandala_task_contract_events.1000.t.trickery: "$mandala_ritual_prefix$ โอบรับเล่ห์กล"
 tgp_east_asia_mandala_task_contract_events.1000.desc.creation: "#EMP การสร้างสรรค์#! ชีวิตช่างเปราะบาง และมันเป็นหน้าที่ของพวกเราที่จะดูแลมันให้ดีที่สุดเท่าที่จะทำได้ หากเราดูแลชีวิต สัตว์ ธรรมชาติ มันจะเสริมสร้างความแข็งแกร่งและมอบพลังให้เราเป็นสิบเท่า ข้ามองไปรอบๆ ขณะที่เรากำลังดูแลพืชพรรณท้องถิ่น\n\nเด็ก ผู้ใหญ่ ผู้เฒ่า — ทุกคนมารวมตัวกันเพื่อเฉลิมฉลองชีวิต เหล่าเด็กๆ ขุดดินอย่างร่าเริงด้วยเครื่องมือที่ทำขึ้นเอง เพื่อเพาะปลูกเมล็ดพันธุ์\n\nหนึ่งในผู้เข้าร่วมที่กระตือรือร้นที่สุด [local_character.GetTitledFirstName] เหงื่อไหลหยดลงบนคิ้วของ [local_character.GetHerHis] ยิ้มและมองมาที่ข้าด้วยความคาดหวัง ขณะที่ [local_character.GetSheHe] รอคำสั่งใหม่"
 tgp_east_asia_mandala_task_contract_events.1000.desc.serenity: "เสียงเสียดสีแผ่วเบาในหมู่แมกไม้ ข้าเหลียวมองข้ามไหล่ไปเห็นเหล่าสตรี บุรุษ ผู้อาวุโส เด็กเล็ก หรือแม้กระทั่งเด็กน้อยไม่กี่คนกำลังเข้าร่วมพิธี ทำตามท่าทางของข้าอย่างเงียบๆ\n\n#EMP โค้ง. ยืด. หายใจ. เหยียด. หายใจ.#!\n\nชาวบ้านผู้มีอัธยาศัยดีเป็นพิเศษ [local_character.GetTitledFirstName] รีบเข้ามาหาในภายหลัง พลางสอบถามว่าสิ่งต่อไปที่พวกเขาควรทำคืออะไร"
 tgp_east_asia_mandala_task_contract_events.1000.desc.destruction: "กองไฟกำลังลุกไหม้ การบูชายัญได้เสร็จสิ้นแล้ว ข้าทอดมองภาพนั้น การแสดงพลังอันยิ่งใหญ่ที่นำโดยผู้นำท้องถิ่น [local_character.GetTitledFirstName] และเหล่านักรบผู้แข็งแกร่งที่สุดของ [local_character.GetHerHis] ซึ่งข้าเป็นผู้ควบคุม\n\nพวกเขาทั้งหมด กระตือรือร้นที่จะรับใช้ กระตือรือร้นที่จะปัดเป่าความชั่วร้ายก่อนที่มันจะกลืนกินการสร้างสรรค์ การสร้างสรรค์ของพวกเรา\n\nพวกเขาทั้งหมดหันมาหาข้า พร้อมคำถามเดียวกันบนใบหน้า: ข้าต้องการให้พวกเขาทำสิ่งใดต่อไป?"
 tgp_east_asia_mandala_task_contract_events.1000.desc.trickery: "ภาพลวงตา การเล่นตลก และการเล่นเกมจิตวิทยากับผู้อื่น ทั้งหมดทำไปด้วยเจตนาดี ทั้งหมด #EMP ไม่เป็นพิษเป็นภัย#! จนกระทั่งมันไม่เป็น เช่นนั้น\n\nพลเมืองแห่ง [ritual_location.GetName] โดยไม่รู้ตัว ได้เปิดเผยความลับที่ลึกที่สุดของพวกเขาผ่านการเข้าร่วมพิธีกรรมของข้า และบรรดาผู้ที่ตระหนักถึงสิ่งนี้ คือผู้ที่ควรจะนำฝูงชนและรับใช้ในนามของข้า แต่เพียงผู้เดียว...\n\nหนึ่งในผู้ที่เฉลียวฉลาด [local_character.GetTitledFirstName] ส่งสายตาเปี่ยมเล่ห์เหลี่ยมมาให้ข้า รอคอยคำสั่งถัดไปของข้าสำหรับฝูงชน"
 tgp_east_asia_mandala_task_contract_events.1000.a: "พวกเขาควรจดจ่ออยู่กับการเคารพบูชาข้า"
 tgp_east_asia_mandala_task_contract_events.1000.b: "จงให้พวกเขาได้ชื่นชมในรัศมีภาพของข้า!"
 
 

