 tgp_east_asia_mandala_task_contract_events.3100.c: "พวกท่านจะต้องแบ่งปันที่ดิน"
 new_shrines_modifier: "ศาลเจ้าใหม่"
 new_shrines_modifier_desc: "เทวราชาได้สร้างศาลเจ้าใหม่เพื่อระงับการทะเลาะวิวาทของสงฆ์ในมณฑลนี้"
