 mandala_realm_contract_0022_request: "จงไปปรากฏตัวที่ [TaskContract.GetLocation.GetName] และเลือกตัวเลือกตาม [mandala_aspect|E] ของท่าน"
 tgp_east_asia_mandala_task_contract_events.3100.t: "$mandala_ritual_prefix$ พระสงฆ์ทะเลาะกัน"
 tgp_east_asia_mandala_task_contract_events.3100.desc: ""[ritual_location.GetName] เป็นของเราโดยชอบธรรม เจ้า [local_character_2.Custom2('InsultNoun', local_character)] ไร้ศรัทธา!" [GetTrait('devoted').GetName( local_character )|l] รูปหนึ่งตะโกน เสียงของ [local_character.GetHerHis] แหลมดั่งระฆัง "ขอให้ [local_character_2.GetFaith.WarGodName] สังหารเจ้าและวัดของเจ้าให้สิ้นไปจากแผ่นดิน!" อีกรูปโต้กลับอย่างไม่สะทกสะท้าน\n\nอากาศเต็มไปด้วยความโกรธเกรี้ยว— แต่การปรากฏตัวของข้า ทำให้มันสงบลง ตอนนี้ พวกเขารอคำตัดสินของข้า"
 tgp_east_asia_mandala_task_contract_events.3100.a: "บัดนี้ ข้าจะมอบคำตัดสินอันศักดิ์สิทธิ์ของข้า"
