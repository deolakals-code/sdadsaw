 mandala_realm_contract_0020_contract: "สังเวยถนน"
 mandala_realm_contract_0020_desc: "ถนนใน [TaskContract.GetLocation.GetNameNoTooltip] ถูกโจมตีโดยโจรซ้ำแล้วซ้ำเล่า ชาวบ้านเชื่อว่าต้อง #EMP "ป้อนอาหาร"#! ให้กับถนนเพื่อระงับความรุนแรง"
 mandala_realm_contract_0020_desc_title: "[TaskContract.MakeScope.Var('loc_compliment').GetFlagName|U] [GetPlayer.GetTitleAsNameNoTooltip],"
 mandala_realm_contract_0020_request: "จงไปปรากฏตัวที่ [TaskContract.GetLocation.GetName] และเลือกตัวเลือกตาม [mandala_aspect|E] ของท่าน"
 tgp_east_asia_mandala_task_contract_events.2900.t: "$mandala_ritual_prefix$ สังเวยถนน"
 tgp_east_asia_mandala_task_contract_events.2900.desc: ""[ROOT.Char.GetTitleAsNameNoTooltip] ผู้ยิ่งใหญ่ ถนนหนทางใน [ritual_location.GetName] ไม่ปลอดภัย" หัวหน้า[local_character.GetWomanMan] กล่าว "นักเดินทางถูกโจมตี กองคาราวานถูกยึด—มันไม่เคยจบสิ้น"\n\n"วิญญาณของถนนต้องกำลังโกรธ" [local_character.GetSheHe|U] ชูกริชขึ้น "พวกเขาต้องได้รับการป้อนอาหาร ด้วยโลหิต จนกว่าความรุนแรงจะหยุดลง""
 tgp_east_asia_mandala_task_contract_events.2900.a: "โลหิตศักดิ์สิทธิ์ของข้าจะ ทำให้มันอิ่มหนำ"
