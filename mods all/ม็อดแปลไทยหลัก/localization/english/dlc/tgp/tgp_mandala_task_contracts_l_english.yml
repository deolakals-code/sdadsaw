 mandala_realm_contract_0021_contract: "เทศกาลเทพสงคราม"
 mandala_realm_contract_0021_desc: "ศาลเจ้าใน [TaskContract.GetLocation.GetNameNoTooltip] กำลังเฉลิมฉลองเทพสงคราม [TaskContract.GetLocation.GetCounty.GetFaith.WarGodName]— แต่ปราศจากการบูชาท่าน ท่านถูกคาดหวังให้ขัดจังหวะพิธีและยืนยันความเป็นเทพของท่านอีกครั้ง"
 mandala_realm_contract_0021_desc_title: "[TaskContract.MakeScope.Var('loc_compliment').GetFlagName|U] [GetPlayer.GetTitleAsNameNoTooltip],"
 mandala_realm_contract_0021_request: "จงไปปรากฏตัวที่ [TaskContract.GetLocation.GetName] และเลือกตัวเลือกตาม [mandala_aspect|E] ของท่าน"
 tgp_east_asia_mandala_task_contract_events.3000.t: "$mandala_ritual_prefix$ เทศกาลเทพสงคราม"
 tgp_east_asia_mandala_task_contract_events.3000.desc: "ใน [ritual_location.GetName] ชาวบ้านกำลังเต้นรำรอบหุ่นจำลองขนาดใหญ่—ที่ไม่ใช่ของข้า #EMP "[ritual_location.GetCounty.GetFaith.WarGodName]! [ritual_location.GetCounty.GetFaith.WarGodName]! [ritual_location.GetCounty.GetFaith.WarGodName]!"#! พวกเขาร้องตะโกน ชื่อของข้าไม่เคยถูกเอ่ยถึง\n\nชาวบ้านคนหนึ่งก้าวออกมา ยิ้ม ""มาร่วมฉลอง [ritual_location.GetCounty.GetFaith.WarGodName]!"" [local_character.GetSheHe] กล่าว\n\n#bold แต่ข้าคือ [ritual_location.GetCounty.GetFaith.WarGodName]\nและข้าถูกคาดหวังให้ลงโทษพวกเขา.#! "
 tgp_east_asia_mandala_task_contract_events.3000.a: "ด้วยเลือดและไฟ พวกเขาจักต้องบูชา #EMP ข้า.#!"
 tgp_east_asia_mandala_task_contract_events.3000.b: "ชาวบ้านพวกนี้จะเป็นอุทาหรณ์ของข้า"
 tgp_east_asia_mandala_task_contract_events.3000.c: "ดีมาก ไปร่วมงานเฉลิมฉลองกันเถอะ"
