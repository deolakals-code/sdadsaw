 tgp_east_asia_mandala_task_contract_events.2800.t: "$mandala_ritual_prefix$ กบฏไม้ไผ่"
 tgp_east_asia_mandala_task_contract_events.2800.desc: "ขณะที่เราขี่ม้าเข้าไปใน [ritual_location.GetName] หอกไม้ไผ่ที่แหลมคมก็เรียงรายอยู่ตามหมู่บ้านเล็กๆ ราวกับคลังอาวุธเฉพาะกิจ "โอ้ [ROOT.Char.GetTitleAsNameNoTooltip] พวกเราแค่กำลังเหลาไม้เหล่านี้เพื่อป้องกันตัวจาก... [ROOT.Char.Custom('RegionalOnlyFerociousAnimalPlural')] ใช่แล้ว" หนึ่งใน[local_character.GetWomenMen] กล่าว น้ำเสียงของ [local_character.GetHerHis] ไม่น่าเชื่อถือ\n\n"พวกเราไม่เคยคิดจะใช้มันเพื่อสิ่งอื่นใด—ไม่—มันไม่เหมือนกับว่าพวกเราสงสัยใน #EMP ความเป็นเทพ#! ของท่านหรืออะไรทำนองนั้น...""
 tgp_east_asia_mandala_task_contract_events.2800.a: "ข้าจะ ทำให้หมู่บ้านของเจ้าเป็นตัวอย่างนองเลือด"
