 mandala_provincial_ritual_desc_01: "ศรัทธาของพวกเราอยู่ในหัตถ์ของ [GetPlayer.Custom('MistressMaster')|U]; พวกเราเฝ้ารอคอยการเสด็จฯ ของ [GetPlayer.GetHerHis|U] เพื่อรับพรจาก [GetPlayer.GetHerHis|U]"
 mandala_provincial_ritual_desc_02: "กลีบดอกไม้กำลังร่วงโรย และความสงบในใจของพวกเราก็ เช่นกัน; พวกเรากำลังรอคอยอย่างใจจดใจจ่อให้จิตวิญญาณและจิตใจของพวกเราได้รับการฟื้นฟูด้วยการปรากฏพระองค์ของ [GetPlayer.GetHerHis|U]"
 
