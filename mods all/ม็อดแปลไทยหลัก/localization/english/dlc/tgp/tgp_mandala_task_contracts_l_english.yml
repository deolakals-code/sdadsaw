 mandala_realm_contract_0002_contract: "ปศุสัตว์ที่เป็นหมัน"
 mandala_realm_contract_0002_desc: "ปศุสัตว์ของ [TaskContract.GetLocation.GetNameNoTooltip] กำลังเป็นหมัน มีลูกวัวเกิดน้อยมาก ชาวบ้านในท้องที่ร้องขอพิธีกรรมเพื่อความอุดมสมบูรณ์ มิฉะนั้นการทำมาหากินของพวกเขาจะสูญสิ้นไป"
 mandala_realm_contract_0002_desc_title: "[TaskContract.MakeScope.Var('loc_compliment').GetFlagName|U] [GetPlayer.GetTitleAsNameNoTooltip],"
 mandala_realm_contract_0002_request: "จงไปปรากฏตัวที่ [TaskContract.GetLocation.GetName] และเลือกตัวเลือกตาม [mandala_aspect|E] ของท่าน"
 tgp_east_asia_mandala_task_contract_events.1100.t: "$mandala_ritual_prefix$ ปศุสัตว์ที่เป็นหมัน"
 tgp_east_asia_mandala_task_contract_events.1100.desc: ""โอ้ [ROOT.Char.GetTitleAsNameNoTooltip] ผู้ยิ่งใหญ่และศักดิ์สิทธิ์ โปรดฟังคำวิงวอนของหมู่บ้านข้าด้วยเถิด" หัวหน้า[local_character.GetWomanMan] กล่าว พลางวางมือของ [local_character.GetHerHis] ลงบนวัวสาวผอมโซที่อยู่ข้าง [local_character.GetHerHim] "โปรด ทำให้วัวของเรากลับมาตกลูกอีกครั้ง!"\n\n [local_character.GetSheHe|U] พยักหน้าให้เหล่าชาวบ้าน ผู้ ซึ่งนำพวงมาลัยขนาดใหญ่ที่ทำจาก [ROOT.Char.GetCurrentLocation.Custom('get_region_flower_type_plural')] สีสันสดใสมาเพื่อประกอบพิธีกรรม"
 tgp_east_asia_mandala_task_contract_events.1100.a: "พิธีกรรมจะใช้เวลาหนึ่งเดือนเต็ม!"
 tgp_east_asia_mandala_task_contract_events.1100.b: "พิธีกรรมหนึ่งสัปดาห์ก็เพียงพอแล้ว"
 tgp_east_asia_mandala_task_contract_events.1100.c: "ข้าจะอยู่เพียงหนึ่งวัน"
 
 mandala_realm_contract_0003_contract: "เมล็ดพันธุ์แรก"
 mandala_realm_contract_0003_desc: "ผู้คนแห่ง [TaskContract.GetLocation.GetNameNoTooltip] วางแผนที่จะสร้าง [GetBuilding('temple_citadel_01').GetName] ในนามของท่าน พวกเขาปฏิเสธที่จะเริ่มต้นจนกว่าท่านจะ 'หว่านเมล็ดพันธุ์แรก' ณ สถานที่แห่งนั้น"
 mandala_realm_contract_0003_desc_title: "[TaskContract.MakeScope.Var('loc_compliment').GetFlagName|U] [GetPlayer.GetTitleAsNameNoTooltip],"
 mandala_realm_contract_0003_request: "จงไปปรากฏตัวที่ [TaskContract.GetLocation.GetName] และเลือกตัวเลือกตาม [mandala_aspect|E] ของท่าน"
 tgp_east_asia_mandala_task_contract_events.1200.t: "$mandala_ritual_prefix$ เมล็ดพันธุ์แรก"
 tgp_east_asia_mandala_task_contract_events.1200.desc: ""[ROOT.Char.GetTitleAsNameNoTooltip] ผู้ยิ่งใหญ่ พวกเรา—ผู้รับใช้ที่ต่ำต้อยของท่าน—ปรารถนาที่จะสร้าง [GetBuilding('temple_citadel_01').GetName] ในนามอันรุ่งโรจน์ของท่าน" หัวหน้า[local_character.GetWomanMan] กล่าว พลางจ้องมองไปยัง [ritual_location.Custom('TerrainTypeProvince')] เบื้องหน้าพวกเรา "แต่พื้นดินยังไม่ได้รับการชำระให้บริสุทธิ์ พวกเราต้องการให้ท่านหว่านเมล็ดพันธุ์แรก—เพื่อเติมเต็มผืนดินด้วยการสร้างสรรค์ของท่าน"\n\n[local_character_2.GetWomanMan] ก้าวออกมาข้างหน้า พลางพัดวีให้ [local_character_2.GetHerselfHimself] อย่างอิดออด "โอ้ องค์เทพ ข้าขอมอบกายถวายตัวเพื่อช่วยท่านทำพิธีกรรมให้สำเร็จ—ให้ชาว [ritual_location.GetName] ทั้งหมดได้ประจักษ์!""
 tgp_east_asia_mandala_task_contract_events.1200.a: "[ritual_location.Custom('TerrainTypeProvince')] จะได้เป็นพยานการร่วมกันของเราเป็นเวลาหนึ่งเดือน!"
 tgp_east_asia_mandala_task_contract_events.1200.b: "ให้เรานอนลง ณ ที่ที่จะวางศิลาแรก"
 tgp_east_asia_mandala_task_contract_events.1200.c: "ข้า... จัดการเองได้"
 
 mandala_realm_contract_0004_contract: "วัวสาวศักดิ์สิทธิ์"
 mandala_realm_contract_0004_desc: "วัวสาวศักดิ์สิทธิ์ไม่ยอมคุกเข่าใน [TaskContract.GetLocation.GetNameNoTooltip] ซึ่งเป็นลางร้ายแห่งความแห้งแล้ง พวกเขาเรียกหาท่านเพื่อฟื้นฟูสมดุล"
 mandala_realm_contract_0004_desc_title: "[TaskContract.MakeScope.Var('loc_compliment').GetFlagName|U] [GetPlayer.GetTitleAsNameNoTooltip],"
 mandala_realm_contract_0004_request: "จงไปปรากฏตัวที่ [TaskContract.GetLocation.GetName] และเลือกตัวเลือกตาม [mandala_aspect|E] ของท่าน"
 tgp_east_asia_mandala_task_contract_events.1300.t: "$mandala_ritual_prefix$ วัวสาวศักดิ์สิทธิ์"
 tgp_east_asia_mandala_task_contract_events.1300.desc: ""มันคือหายนะ" ผู้อาวุโสของหมู่บ้านคร่ำครวญ "วัวสาวศักดิ์สิทธิ์ของเราไม่ยอมหมอบลง—เป็นลางร้ายแห่งความแห้งแล้งและการเสื่อมโทรมอย่างแน่นอน!"\n\n"ได้โปรด พวกเราต้องการให้ #EMP ท่าน#! มาอวยพรพวกเราแทน จงขึ้นไปบนแท่นหินนี้และเผยรัศมีอันศักดิ์สิทธิ์ของท่านให้ทุกคนได้เห็น— เพื่อให้ทุ่งนาแห่ง [ritual_location.GetName] กลับมาอุดมสมบูรณ์!" ผู้อาวุโสจ้องมองมาที่ข้า\n\nข้าถูกคาดหวังให้ยืนเปลือยกายบนแท่นหินเป็นเวลาหนึ่งสัปดาห์ โดยไม่กินอะไรเลย..."
 tgp_east_asia_mandala_task_contract_events.1300.a: "ความเป็นทิพย์ของข้าไร้ขีดจำกัด—จงดูเรือนร่างของข้า!"
 tgp_east_asia_mandala_task_contract_events.1300.b: "อาหารและเครื่องนุ่งห่มเป็นส่วนหนึ่งของพิธีกรรม"
 tgp_east_asia_mandala_task_contract_events.1300.c: "ใช้รูปจำลองของข้าก็น่าจะพอ..."
 
 mandala_realm_contract_0005_contract: "พยานศักดิ์สิทธิ์"
 mandala_realm_contract_0005_desc: "คู่รักชนชั้นสูงใน [TaskContract.GetLocation.GetNameNoTooltip] ยังไม่มีบุตร พวกเขาต้องการให้ท่านมาอวยพรการครองคู่ของพวกเขา"
 mandala_realm_contract_0005_desc_title: "[TaskContract.MakeScope.Var('loc_compliment').GetFlagName|U] [GetPlayer.GetTitleAsNameNoTooltip],"
 mandala_realm_contract_0005_request: "จงไปปรากฏตัวที่ [TaskContract.GetLocation.GetName] และเลือกตัวเลือกตาม [mandala_aspect|E] ของท่าน"
 tgp_east_asia_mandala_task_contract_events.1400.t: "$mandala_ritual_prefix$ พยานศักดิ์สิทธิ์"
 tgp_east_asia_mandala_task_contract_events.1400.desc: ""[ROOT.Char.GetTitleAsNameNoTooltip] ผู้เจิดจรัสที่สุด [local_character_2.GetWifeHusband] ของข้าและตัวข้ายังไม่ได้รับพรให้มีบุตร" ขุนนาง [local_character.GetTitledFirstName] กล่าว เสียงของ [local_character.GetHerHis] เจือความเศร้า "ข้าได้สร้างศาลาใน [ritual_location.Custom('TerrainTypeProvince')] เพื่อประกอบพิธีกรรม"\n\n[local_character_2.GetWifeHusband] ของ [local_character.GetHerHis] กล่าวต่อ "พวกเราต้องการให้ท่านนอนระหว่างพวกเรา ในฐานะพยานศักดิ์สิทธิ์ เมื่อนั้นพวกเราจึงจะได้รับพรให้มีบุตร! แน่นอน... มันอาจจะต้องใช้เวลาสักสองสามคืน...""
 tgp_east_asia_mandala_task_contract_events.1400.a: "โอ้ ข้าจะทำมากกว่าแค่ 'เป็นพยาน'..."
 tgp_east_asia_mandala_task_contract_events.1400.b: "ข้าจะเฝ้าดูการร่วมกันของพวกท่าน"
 tgp_east_asia_mandala_task_contract_events.1400.c: "แค่มีเสื้อผ้าของข้าอยู่ระหว่างพวกท่านก็น่าจะพอ"
 
 mandala_realm_contract_0006_contract: "ความฝันของหมอตำแย"
 mandala_realm_contract_0006_desc: "นางผดุงครรภ์ใน [TaskContract.GetLocation.GetNameNoTooltip] ต่างฝันถึงสิ่งเดียวกัน — ความเป็นเทพของท่าน ที่ร่วมเป็นหนึ่งเดียวกับหญิงสาวที่มีเครื่องหมายแห่งลางบอกเหตุ"
 mandala_realm_contract_0006_desc_title: "[TaskContract.MakeScope.Var('loc_compliment').GetFlagName|U] [GetPlayer.GetTitleAsNameNoTooltip],"
 mandala_realm_contract_0006_request: "จงไปปรากฏตัวที่ [TaskContract.GetLocation.GetName] และเลือกตัวเลือกตาม [mandala_aspect|E] ของท่าน"
 tgp_east_asia_mandala_task_contract_events.1500.t: "$mandala_ritual_prefix$ ความฝันของหมอตำแย"
 tgp_east_asia_mandala_task_contract_events.1500.desc: "ขณะที่ข้าเข้าใกล้หมู่บ้านเล็กๆ นอก [ritual_location.GetName] กลุ่มหมอตำแยก็เข้ามาทักทายข้า "พวกเราทุกคนฝันเหมือนกัน [ROOT.Char.GetTitleAsNameNoTooltip] ผู้ยิ่งใหญ่" พวกเขากล่าวพร้อมกัน "นี่คือ [local_character_2.GetFirstName]—เกิดในคืนแห่งลางบอกเหตุ"\n\n"เด็กที่จะมาช่วย [ritual_location.GetName] จะถือกำเนิดหากท่านนอนกับ [local_character_2.GetHerHim]" เหล่าหมอตำแยเงียบลงขณะที่ [local_character_2.GetWomanMan] ผู้น่าประหลาดก้าวออกมาข้างหน้า ยิ้มให้ข้าอย่างอิดออด"
 tgp_east_asia_mandala_task_contract_events.1500.desc.stand_in: "\n\nข้ามองไปที่ [ROOT.Char.Custom2('RelationToMe', 1500_stand_in_character)] ของข้า [1500_stand_in_character.GetFirstName] ข้ามั่นใจว่า [1500_stand_in_character.GetSheHe] สามารถ #EMP รับมือ#! ภาระหน้าที่ได้..."
 tgp_east_asia_mandala_task_contract_events.1500.desc.stand_in.acolyte: "\n\nข้ามองไปที่ผู้ศรัทธคนหนึ่งของข้า [1500_stand_in_character.GetFirstName] ข้าตั้งใจจะลองอะไรใหม่ๆ อยู่พอดี..."
 tgp_east_asia_mandala_task_contract_events.1500.a: "จงมาที่ [ROOT.Char.GetCapitalLocation.GetTitle.GetNameNoTierNoTooltip] เถิด [local_character_2.GetFirstNameNoTooltip]"
 tgp_east_asia_mandala_task_contract_events.1500.a.stand_in: "[ROOT.Char.Custom2('RelationToMe', 1500_stand_in_character )] ของข้าจะดูแล [local_character_2.GetFirstNameNoTooltip] ที่ [ROOT.Char.GetCapitalLocation.GetNameNoTooltip]"
 tgp_east_asia_mandala_task_contract_events.1500.a.stand_in.no_relation: "[ROOT.Char.Custom2('RelationToMe', 1500_stand_in_character )] ของข้าและข้าจะดูแล [local_character_2.GetFirstNameNoTooltip]"
 tgp_east_asia_mandala_task_contract_events.1500.a.stand_in.acolyte: "ข้ารับใช้ของข้าและข้าจะดูแล [local_character_2.GetFirstNameNoTooltip]"
 tgp_east_asia_mandala_task_contract_events.1500.b: "เราจะนอนด้วยกันในคืนนี้"
 tgp_east_asia_mandala_task_contract_events.1500.b.stand_in: "[1500_stand_in_character.GetTitledFirstNameNoTooltip] จงกระจายเมล็ดพันธุ์แห่งรัชสมัยของข้า"
 tgp_east_asia_mandala_task_contract_events.1500.b.stand_in.acolyte: "สาวก [1500_stand_in_character.GetTitledFirstNameNoTooltip] จงกระจายเมล็ดพันธุ์แห่งรัชสมัยของข้า"
 tgp_east_asia_mandala_task_contract_events.1500.c: "คืนนี้ #EMP จิตวิญญาณ#! ของข้าจะอยู่กับเจ้า..."
 
 mandala_realm_contract_0007_contract: "รูปปั้นร่ำไห้"
 mandala_realm_contract_0007_desc: "รูปปั้นที่ถูกทอดทิ้งใน [TaskContract.GetLocation.GetNameNoTooltip] ว่ากันว่ามีน้ำนมไหลออกมา ชาวบ้านขอให้ท่านเจิมทารกแรกเกิดบนรูปปั้นนั้น"
 mandala_realm_contract_0007_desc_title: "[TaskContract.MakeScope.Var('loc_compliment').GetFlagName|U] [GetPlayer.GetTitleAsNameNoTooltip],"
 mandala_realm_contract_0007_request: "จงไปปรากฏตัวที่ [TaskContract.GetLocation.GetName] และเลือกตัวเลือกตาม [mandala_aspect|E] ของท่าน"
 tgp_east_asia_mandala_task_contract_events.1600.t: "$mandala_ritual_prefix$ รูปปั้นร่ำไห้"
 tgp_east_asia_mandala_task_contract_events.1600.desc: ""[ROOT.Char.GetTitleAsNameNoTooltip] โอ้ [ROOT.Char.GetTitleAsNameNoTooltip] ผู้ศักดิ์สิทธิ์" ชาวนาคร่ำครวญ หมอบกราบ [local_character.GetHerselfHimself] "รูปปั้นโบราณในทุ่งนาของข้าเริ่มมีน้ำนมไหล!" ข้าเหลือบมอง—หัวหินขนาดใหญ่คลุมด้วยผ้าและดอกไม้ ใบหน้ามีรอยสีขาวเป็นทาง\n\n"เหล่าดวงวิญญาณกำลังผ่านมันไป! ได้โปรด เจิมทารกแรกเกิดนี้บนนั้นเพื่อเอาใจพวกเขาด้วยเถิด!" [local_character.GetSheHe] อ้อนวอน"
 tgp_east_asia_mandala_task_contract_events.1600.a: "สถานที่นี้ไม่ใช่แค่ทุ่งนา— แต่เป็นศาลเจ้า!"
 tgp_east_asia_mandala_task_contract_events.1600.b: "ให้ข้าเพิ่มเครื่องเซ่นไหว้ให้เหล่าวิญญาณ"
 tgp_east_asia_mandala_task_contract_events.1600.c: "ข้าจะเจิมเด็กคนนี้ตามที่คาดหวัง"
 stone_head_shrine_modifier: "ศาลเจ้าหัวหินยักษ์"
 stone_head_shrine_modifier_desc: "รูปปั้นโบราณของกษัตริย์ที่ถูกลืมได้กลายเป็นศาลเจ้าของเทวราชาท้องถิ่นที่นี่"
 
 mandala_realm_contract_0008_contract: "ดอกไม้ที่ผลิบาน"
 mandala_realm_contract_0008_desc: "ดอกไม้ประหลาดได้ขึ้นบดบังต้นอ่อนใน [TaskContract.GetLocation.GetNameNoTooltip] จนหมด ชาวบ้านเชื่อว่าเป็นฝีมือของท่าน และเรียกร้องให้ท่านฟื้นฟูสมดุลที่ถูกต้อง"
 mandala_realm_contract_0008_desc_title: "[TaskContract.MakeScope.Var('loc_compliment').GetFlagName|U] [GetPlayer.GetTitleAsNameNoTooltip],"
 mandala_realm_contract_0008_request: "จงไปปรากฏตัวที่ [TaskContract.GetLocation.GetName] และเลือกตัวเลือกตาม [mandala_aspect|E] ของท่าน"
 tgp_east_asia_mandala_task_contract_events.1700.t: "$mandala_ritual_prefix$ ดอกไม้ที่ผลิบาน"
 tgp_east_asia_mandala_task_contract_events.1700.desc: ""โอ้ เหตุใดท่านจึงทอดทิ้งพวกเรา [ROOT.Char.GetTitleAsNameNoTooltip]?" หัวหน้า[local_character.GetWomanMan] กล่าว เสียงของ [local_character.GetHerHis] เต็มไปด้วยความสิ้นหวัง "ต้นอ่อนของเรากำลังถูก [ROOT.Char.GetCurrentLocation.Custom('get_region_flower_type_plural')] บดบัง—ไม่เหลือทุ่งนาแม้ แต่แห่งเดียว!"\n\n"หากไม่มีข้าว พวกเราจะอดตาย... ท่านต้องเดินเท้าเปล่าผ่านทุ่งนา เพื่อบอกผืนดินว่าสิ่งใดควรเติบโตในนั้น""
 tgp_east_asia_mandala_task_contract_events.1700.a: "พวกเจ้าต้องการมากกว่านั้น... ส่งข้าวจากเมืองหลวงมา"
 tgp_east_asia_mandala_task_contract_events.1700.b: "ข้าจะเดินเท้าเปล่าไปกับผืนดิน ไม่ว่าฝนจะตกหรือพายุจะเข้า"
 tgp_east_asia_mandala_task_contract_events.1700.c: "ข้าจะจุมพิตผืนดิน แต่ไม่มากไปกว่านั้น"
 fertile_ground_modifier: "ทุ่งนาที่อุดมสมบูรณ์"
 fertile_ground_modifier_desc: "การหลั่งไหลของเมล็ดพันธุ์และเครื่องมือจากเมืองหลวง ทำให้พื้นที่เหล่านี้สุกงอมสำหรับการพัฒนา"
 
 mandala_realm_contract_0009_contract: "พิธีกรรมแห่งสายน้ำ"
 mandala_realm_contract_0009_desc: "แม่น้ำใน [TaskContract.GetLocation.GetNameNoTooltip] เป็นดั่งสายเลือดของคนท้องถิ่น ชาวประมงขอให้ท่านทำพิธีกรรมเพื่อความอุดมสมบูรณ์ เพื่อให้แม่น้ำเต็มไปด้วยปลา"
 mandala_realm_contract_0009_desc_title: "[TaskContract.MakeScope.Var('loc_compliment').GetFlagName|U] [GetPlayer.GetTitleAsNameNoTooltip],"
 mandala_realm_contract_0009_request: "จงไปปรากฏตัวที่ [TaskContract.GetLocation.GetName] และเลือกตัวเลือกตาม [mandala_aspect|E] ของท่าน"
 tgp_east_asia_mandala_task_contract_events.1800.t: "$mandala_ritual_prefix$ พิธีกรรมแห่งสายน้ำ"
 tgp_east_asia_mandala_task_contract_events.1800.desc: "กลุ่มชาวประมง[local_character.GetWomenMen] ยืนอยู่ริมฝั่งแม่น้ำ ตะกร้าเต็มไปด้วยปลาที่จับได้ในวันนี้ "[ROOT.Char.GetTitleAsNameNoTooltip] ผู้ยิ่งใหญ่! แม่น้ำเต็มไปด้วย [ROOT.Char.Custom('GetRegionalFish')] แต่ผู้อาวุโสของเราบอกว่ามันจะแห้งเหือดภายในปีหน้า!" หนึ่งใน[local_character.GetWomenMen] กล่าว\n\n"คืนนี้นำมา ซึ่งจันทร์เต็มดวงที่หาได้ยาก พวกเราต้องการให้ท่านอวยพรสายน้ำด้วยความอุดมสมบูรณ์อันศักดิ์สิทธิ์—[local_character_2.GetFirstName] ได้เสนอตัว [local_character_2.GetHerselfHimself] เพื่อเข้าร่วมพิธีกรรมกับท่าน""
 tgp_east_asia_mandala_task_contract_events.1800.a: "มาร่วมกับข้าในแม่น้ำเถิด [local_character_2.GetFirstNameNoTooltip]"
 tgp_east_asia_mandala_task_contract_events.1800.b: "ข้าเพียงแค่ต้องโยนข้าวลงไปในน้ำ"
 tgp_east_asia_mandala_task_contract_events.1800.c: "ปลาทั้งหมดนี้... พวกเจ้าจ่ายบรรณาการไม่เพียงพอ"
 upset_peasants_modifier: "เหล่าไพร่ไม่พอใจ"
 upset_peasants_modifier_desc: "ไม่ว่าจะด้วยเหตุผลใดก็ตาม เหล่าไพร่ในเคาน์ตีนี้ต่างพากันกระด้างกระเดื่อง"
 
 mandala_realm_contract_0010_contract: "ทุ่งต้องสาป"
 mandala_realm_contract_0010_desc: "คันไถยังคงพังในทุ่งนาของ [TaskContract.GetLocation.GetNameNoTooltip] ชาวบ้านสงสัยว่าเป็นฝีมือของวิญญาณร้าย และร้องขอความช่วยเหลือจากท่านเพื่อถอนคำสาป"
 mandala_realm_contract_0010_desc_title: "[TaskContract.MakeScope.Var('loc_compliment').GetFlagName|U] [GetPlayer.GetTitleAsNameNoTooltip],"
 mandala_realm_contract_0010_request: "จงไปปรากฏตัวที่ [TaskContract.GetLocation.GetName] และเลือกตัวเลือกตาม [mandala_aspect|E] ของท่าน"
 tgp_east_asia_mandala_task_contract_events.1900.t: "$mandala_ritual_prefix$ ทุ่งต้องสาป"
 tgp_east_asia_mandala_task_contract_events.1900.desc: ""นี่เป็นคันไถอันที่เจ็ดที่พังในสัปดาห์นี้ [ROOT.Char.GetTitleAsNameNoTooltip]" หัวหน้า[local_character.GetWomanMan] กล่าว พลางชี้ไปยังทุ่งนาอย่างโกรธเคือง "วิญญาณดินผู้อิจฉาริษยากำลังทำลายพวกมัน ไม่ต้องสงสัยเลย!"\n\n"เพื่อถอนคำสาป ท่าน—ในฐานะเทพผู้เจิดจรัส—จักต้องลากคันไถไปทั่วทุกทุ่งนา และไถเปิดร่องแรก!""
 tgp_east_asia_mandala_task_contract_events.1900.a: "ข้าจะทำเอง—จงผูกมัดข้า!"
 tgp_east_asia_mandala_task_contract_events.1900.b: "ข้าหว่าน; [entourage_character.GetFirstNameNoTooltip] เป็นผู้ลากคันไถ..."
 tgp_east_asia_mandala_task_contract_events.1900.c: "ข้าจะหว่านเพียงเมล็ดพันธุ์เดียว"
 
 mandala_realm_contract_0011_contract: "ป่าเหี่ยวเฉา"
 mandala_realm_contract_0011_desc: "ฟ้าผ่าได้ผ่าลงต้นไม้ศักดิ์สิทธิ์ เผาป่าละเมาะโดยรอบใน [TaskContract.GetLocation.GetNameNoTooltip] ชาวบ้านกำลังหวาดกลัว และขอให้ท่านประกอบพิธีกรรมเพื่อความอุดมสมบูรณ์ใต้ต้นไม้นั้น"
 mandala_realm_contract_0011_desc_title: "[TaskContract.MakeScope.Var('loc_compliment').GetFlagName|U] [GetPlayer.GetTitleAsNameNoTooltip],"
 mandala_realm_contract_0011_request: "จงไปปรากฏตัวที่ [TaskContract.GetLocation.GetName] และเลือกตัวเลือกตาม [mandala_aspect|E] ของท่าน"
 tgp_east_asia_mandala_task_contract_events.2000.t: "$mandala_ritual_prefix$ ป่าเหี่ยวเฉา"
 tgp_east_asia_mandala_task_contract_events.2000.desc: ""ข้า แต่ [ROOT.Char.GetTitleAsNameNoTooltip] ผู้ศักดิ์สิทธิ์ ฟ้าผ่าต้นไม้ศักดิ์สิทธิ์ของเรา เผาป่าละเมาะจนมอดไหม้..." [local_character.GetWomanMan] กล่าว พลางชี้ไปยังซากที่ไหม้เกรียม "เราเกรงว่ามันจะไม่เติบโตขึ้นมาใหม่—เหล่า [ROOT.Char.Custom('GetRandomRegionalSmallGamePlural')] และ [ROOT.Char.Custom('GetRandomRegionalWildDaytimeBird')] ก็หายไปหมด"\n\n"ใต้ต้นไม้ที่ไหม้เกรียมคือที่ที่เราจักต้องนอน หากการร่วมกันของเราบังเกิดผล ป่าละเมาะก็จะ เช่นกัน ขอให้ถ่านเจิมพวกเรา จนกระทั่งเราไม่อาจแยกจากท้องฟ้ายามค่ำคืนได้!""
 tgp_east_asia_mandala_task_contract_events.2000.a: "เจ้าจะได้เมล็ดพันธุ์จากเมืองหลวง—และจากข้าด้วย!"
 tgp_east_asia_mandala_task_contract_events.2000.a.female: "ข้าจะช่วยท่านปลูกเมล็ดพันธุ์จากเมืองหลวง..."
 tgp_east_asia_mandala_task_contract_events.2000.b: "เช่นนั้น ให้เรานอนด้วยกัน"
 tgp_east_asia_mandala_task_contract_events.2000.c: "การเจิมเจ้าด้วยถ่านก็เพียงพอแล้ว"
