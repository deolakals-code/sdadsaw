 mandala_realm_contract_0026_desc: "กูรูในท้องถิ่นสนับสนุนสันติภาพ เพื่อให้เด็กๆ ของ [TaskContract.GetLocation.GetNameNoTooltip] เติบโตขึ้นมาไถนาแทนที่จะตายในความบาดหมาง"
