 no_healers_modifier_desc: "เทวราชาได้สังหารผู้รักษาและหมอผีในมณฑลนี้"
 
 mandala_realm_contract_0016_contract: "หอกทื่อ"
 mandala_realm_contract_0016_desc: "ทหารประจำการใน [TaskContract.GetLocation.GetNameNoTooltip] เกียจคร้านและขวัญเสีย ผู้อาวุโสของหมู่บ้านขอร้องให้ท่านลงวินัยพวกเขา"
 mandala_realm_contract_0016_desc_title: "[TaskContract.MakeScope.Var('loc_compliment').GetFlagName|U] [GetPlayer.GetTitleAsNameNoTooltip],"
 mandala_realm_contract_0016_request: "จงไปปรากฏตัวที่ [TaskContract.GetLocation.GetName] และเลือกตัวเลือกตาม [mandala_aspect|E] ของท่าน"
 tgp_east_asia_mandala_task_contract_events.2500.t: "$mandala_ritual_prefix$ หอกทื่อ"
 tgp_east_asia_mandala_task_contract_events.2500.desc: ""พวกเขาเคลือบแคลงในความเป็นเทพของท่าน [ROOT.Char.GetTitleAsNameNoTooltip]" ผู้อาวุโสกล่าวด้วยน้ำเสียงหนักอึ้ง "เหล่านักรบใช้เวลาทั้งวันไปกับการดื่มสุรา—ถนนหนทางไม่ปลอดภัยและโจรชุกชุม..." [local_character.GetSheHe|U] พยักพเยิดไปยังโรงเตี๊ยมที่อยู่ใกล้ๆ\n\n"ท่านต้องลงวินัยพวกเขา ใช้การปรากฏตัวดุจเทพของท่าน—และดาบดุจเทพของท่าน—เพื่อ ทำให้พวกเขายอมจำนน!""
 tgp_east_asia_mandala_task_contract_events.2500.a: "พวกเขาจะเรียนรู้ที่จะรับใช้—ผ่านโลหิต"
 tgp_east_asia_mandala_task_contract_events.2500.b: "แต่ละคนจะได้รับคำพูดของข้า—หรือแส้ของข้า"
 tgp_east_asia_mandala_task_contract_events.2500.c: "แค่เพียงคำพูดธรรมดาก็เพียงพอแล้ว"
 motivated_men_at_arms_modifier: "ทหารประจำการผู้มีแรงจูงใจ"
 motivated_men_at_arms_modifier_desc: "ทหารประจำการที่ปกป้องมณฑลนี้มีแรงจูงใจอย่างมากหลังจากการแสดงตนของเทวราชา หรือ สิ่งที่เหลืออยู่ของพวกเขา"
 safer_roads_modifier: "ถนนที่ปลอดภัยขึ้น"
 safer_roads_modifier_desc: "ถนนหนทางปลอดภัยขึ้นเล็กน้อยหลังจากการมาเยือนของเทวราชา"
 
 mandala_realm_contract_0017_contract: "หมู่บ้านท้าทาย"
 mandala_realm_contract_0017_desc: "หมู่บ้านใน [TaskContract.GetLocation.GetNameNoTooltip] ปฏิเสธที่จะจ่ายบรรณาการ โดยเยาะเย้ยความเป็นเทพของท่าน นักบวชท้องถิ่นขอร้องให้ท่านเสด็จไปที่นั่นด้วยตนเอง"
 mandala_realm_contract_0017_desc_title: "[TaskContract.MakeScope.Var('loc_compliment').GetFlagName|U] [GetPlayer.GetTitleAsNameNoTooltip],"
 mandala_realm_contract_0017_request: "จงไปปรากฏตัวที่ [TaskContract.GetLocation.GetName] และเลือกตัวเลือกตาม [mandala_aspect|E] ของท่าน"
 tgp_east_asia_mandala_task_contract_events.2600.t: "$mandala_ritual_prefix$ หมู่บ้านท้าทาย"
 tgp_east_asia_mandala_task_contract_events.2600.desc: "เมื่อเราเข้าใกล้ [ritual_location.GetName] การเยาะเย้ยก็ทักทายเรา: หุ่นจำลองของข้า ถูกแขวนหัวกลับ เปรอะเปื้อนไปด้วยขี้เถ้าและมูลสัตว์ ชาวบ้านเต้นรำไปรอบๆ ร้องเพลงเกี่ยวกับความอ่อนแอของข้า หอนราวกับสุนัขป่า\n\nพวกเขาไม่เกรงกลัวข้า\nพวกเขากำลังร้องขอความพิโรธ"
 tgp_east_asia_mandala_task_contract_events.2600.a: "ข้าจะไม่ไว้ชีวิตใคร โลหิตจะชโลมพื้นดิน"
 tgp_east_asia_mandala_task_contract_events.2600.b: "ข้าจะเผาฉางข้าวของพวกมัน"
 tgp_east_asia_mandala_task_contract_events.2600.c: "พวกเขาแค่ต้องการความมั่นใจ"
 slaughtered_village_modifier: "หมู่บ้านที่ถูกสังหารหมู่"
 slaughtered_village_modifier_desc: "เทวราชาได้สังหารหมู่ประชากรของหมู่บ้านที่ท้าทายภายในเคาน์ตีนี้"
 
 mandala_realm_contract_0018_contract: "ภาษีโลหิต"
 mandala_realm_contract_0018_desc: "การเกณฑ์ทหารใน [TaskContract.GetLocation.GetNameNoTooltip] ไม่ได้รับการตอบรับ เจ้าหน้าที่ท้องถิ่นขอให้ท่านเรียกร้อง #EMP เหรียญโลหิต#!—ผู้ที่ไม่สามารถรับใช้ได้ต้องเสนอสิ่งทดแทน"
 mandala_realm_contract_0018_desc_title: "[TaskContract.MakeScope.Var('loc_compliment').GetFlagName|U] [GetPlayer.GetTitleAsNameNoTooltip],"
 mandala_realm_contract_0018_request: "จงไปปรากฏตัวที่ [TaskContract.GetLocation.GetName] และเลือกตัวเลือกตาม [mandala_aspect|E] ของท่าน"
 tgp_east_asia_mandala_task_contract_events.2700.t: "$mandala_ritual_prefix$ ภาษีโลหิต"
 tgp_east_asia_mandala_task_contract_events.2700.desc: "ขณะที่เราเข้าใกล้ [ritual_location.GetName] เจ้าหน้าที่คนหนึ่งก็เข้ามาทักทาย ""[ROOT.Char.GetTitleAsNameNoTooltip] หมู่บ้านนี้ปฏิเสธที่จะตอบรับการเกณฑ์ทหาร"" [local_character.GetSheHe] กล่าว พลางเหลือบมองม้วนกระดาษ ""การลงโทษของพวกเขาคือการจ่ายเหรียญโลหิต—และท่านต้องเป็นผู้เรียกร้องมัน"\n\n"พวกเขาไม่ฟังข้า แต่พวกเขาจะเชื่อฟังคำศักดิ์สิทธิ์ของท่าน ทำให้พวกเขาจ่ายในสิ่งที่ค้างไว้" [local_character.GetSheHe|U] โค้งคำนับ"
 tgp_east_asia_mandala_task_contract_events.2700.a: "ข้าจะเก็บโลหิต ไม่ใช่เหรียญ การเกณฑ์ทหารจะต้องได้รับการปฏิบัติตาม"
 tgp_east_asia_mandala_task_contract_events.2700.b: "เหรียญโลหิตจะต้องถูกเก็บ"
 tgp_east_asia_mandala_task_contract_events.2700.c: "เพียงการปรากฏตัวของข้าก็เพียงพอแล้ว"
 enforced_levy_modifier: "การเกณฑ์ทหารที่ถูกบังคับ"
 enforced_levy_modifier_desc: "เทวราชาได้ ทำให้แน่ใจว่าเคาน์ตีนี้จะปฏิบัติตามการเกณฑ์ทหาร ผ่านการแสดงความรุนแรง"
 
 mandala_realm_contract_0019_contract: "กบฏไม้ไผ่"
 mandala_realm_contract_0019_desc: "ชาวนาใน [TaskContract.GetLocation.GetNameNoTooltip] กำลังเหลาไม้ไผ่ โดยอ้างว่าพวกเขาสามารถ #EMP "ปกป้องตัวเองได้แล้ว"#! มีการร้องขอให้ท่านไปปรากฏตัวในฐานะนักรบ—ก่อนที่การกบฏจะเริ่มขึ้น"
 mandala_realm_contract_0019_desc_title: "[TaskContract.MakeScope.Var('loc_compliment').GetFlagName|U] [GetPlayer.GetTitleAsNameNoTooltip],"
