 visit_silk_road_market_decision: "เยือนตลาดบนเส้นทางสายไหม"
 visit_silk_road_market_decision_desc: "ความมั่งคั่งของเส้นทางสายไหมไม่ได้ถูกเก็บไว้ในเหรียญกษาปณ์ทั้งหมด บางครั้งก็มี... #italic ความคิด#! ใหม่ ๆ ที่เดินทางบนหลังอูฐจากตลาดบาซาร์หนึ่งไปยังอีกแห่งหนึ่ง จงเยือนตลาดที่ถูกต้อง, พูดคุยกับคนที่ใช่, และเรียนรู้ความลับที่ไม่เป็นที่รู้จักของโลกภายนอก"
