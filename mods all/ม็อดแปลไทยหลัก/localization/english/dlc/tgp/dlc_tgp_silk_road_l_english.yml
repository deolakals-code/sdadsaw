l_english: 
 # the Silk Road
 silk_road_situation: "เส้นทางสายไหม"
 silk_road_situation_desc: "$game_concept_silk_road_situation_desc$"
 situation_silk_road_situation_desc: "$silk_road_situation_desc$"

 game_concept_silk_road_situation: "เส้นทางสายไหม"
 game_concept_silk_road: "$game_concept_silk_road_situation$"
 game_concept_silk_road_situation_desc: "$game_concept_silk_road_situation$ มิใช่ถนนเพียงสายเดียว แต่คือเครือข่ายเส้นทางทั้งมวลที่เชื่อมโยงมุมที่ไกลที่สุดของอารยธรรมเพื่อแลกเปลี่ยนทองคำ สินค้า และแนวคิด การที่สามารถเข้าถึงเส้นทางสายไหมได้ คือการเข้าถึงความมั่งคั่งทั้งปวงของโลก\n\nระดับการเข้าถึงเส้นทางสายไหมที่แตกต่างกันจะมอบโบนัสทองคำที่หลากหลาย และอาจมอบโอกาสพิเศษในการปลดล็อก [innovations|E] ที่แปลกใหม่ จำนวนทองคำและความรู้ที่เดินทางบนเส้นทางสายไหมจะเปลี่ยนแปลงไปขึ้นอยู่กับความเจริญรุ่งเรืองของมัน ซึ่งได้รับอิทธิพลจากหลายปัจจัย รวมถึงสงคราม เหตุการณ์ และ [dynastic_cycle|E] ของจีน"
 game_concept_situation_silk_road_phase_exceptional_bounty: "$situation_silk_road_phase_exceptional_bounty$"
 game_concept_situation_silk_road_phase_exceptional_bounty_desc: "$situation_silk_road_phase_exceptional_bounty_desc$"
 game_concept_situation_silk_road_phase_steady_trading: "$situation_silk_road_phase_steady_trading$"
 game_concept_situation_silk_road_phase_steady_trading_desc: "$situation_silk_road_phase_steady_trading_desc$"
 game_concept_situation_silk_road_phase_hardship: "$situation_silk_road_phase_hardship$"
 game_concept_situation_silk_road_phase_hardship_desc: "$situation_silk_road_phase_hardship_desc$"

 situation_silk_road_phase_exceptional_bounty: "ความมั่งคั่งอุดมสมบูรณ์"
 situation_silk_road_phase_exceptional_bounty_desc: "สามารถได้รับมหาสมบัติอันน่าทึ่ง, สร้างผลกำไรได้มหาศาล, อีกทั้งแนวคิดและนวัตกรรมยังแพร่กระจายไปได้กว้างไกลที่สุด เมื่อยามที่เส้นทางสายไหมอยู่ในช่วงเวลาที่ดี"
 situation_silk_road_phase_steady_trading: "การค้าที่มั่นคง"
 situation_silk_road_phase_steady_trading_desc: "มีการสร้างผลกำไร, มีการต่อรองข้อตกลง, และธุรกิจดำเนินต่อไปตามปกติ อาจมีตัวเลือกที่ทำกำไรได้มากกว่าที่อื่น แต่เส้นทางสายไหมนั้นน่าเชื่อถือกว่า"
 situation_silk_road_phase_hardship: "ความยากลำบาก"
 situation_silk_road_phase_hardship_desc: "จากสงคราม, ภัยพิบัติ, และชะตาที่พลิกผันอย่างไม่อาจคาดเดา, เส้นทางสายไหมได้หยุดชะงักอย่างสิ้นเชิง ทั้งเงินตราและแนวคิดต่างหยุดเคลื่อนไหว, และสิ่งเดียวที่ได้รับจากการใช้เส้นทางสายไหมคือความทุกข์ยากและความยากจน"
 phase_exceptional_bounty: "$situation_silk_road_phase_exceptional_bounty$"
 phase_exceptional_bounty_desc: "$situation_silk_road_phase_exceptional_bounty_desc$"
 phase_steady_trading: "$situation_silk_road_phase_steady_trading$"
