 silk_road_situation_sub_region_region_silk_road_proper_china: "จีน"
 silk_road_situation_sub_region_region_silk_road_proper_china_desc: "$SITUATION_SUB_REGION_TOOLTIP_DESC$\n\n#weak จากตะวันออก ผ้าไหมและใบชาถูกซื้อโดยเหล่าพ่อค้าและเริ่มต้นการเดินทางอันเชื่องช้าสู่ภายนอก นอกจากสินค้าเหล่านั้นแล้ว เหล่าพ่อค้ายังนำพาสิ่งหนึ่งมาด้วย: #italic แนวคิด#! ใหม่#!"
 silk_road_situation_sub_region_region_silk_road_proper_tibet: "ทิเบต"
 silk_road_situation_sub_region_region_silk_road_proper_tibet_desc: "$SITUATION_SUB_REGION_TOOLTIP_DESC$\n\n#weak ที่ราบสูงทิเบตคือภูมิทัศน์อันน่าเกรงขาม แต่เส้นทางการค้าก็สามารถค้นพบได้ท่ามกลางหุบเขาและช่องเขาที่กระจัดกระจายของภูมิภาค#!"
 silk_road_situation_sub_region_region_silk_road_proper_india: "อินเดีย"
 silk_road_situation_sub_region_region_silk_road_proper_india_desc: "$SITUATION_SUB_REGION_TOOLTIP_DESC$\n\n#weak การค้าไหลผ่านภูมิภาคนี้ดั่งสายน้ำแห่งคงคาและสินธุ ไหลขึ้นและลง แต่คงอยู่เสมอ#!"
 silk_road_situation_sub_region_region_silk_road_proper_central_asia: "เอเชียกลาง"
 silk_road_situation_sub_region_region_silk_road_proper_central_asia_desc: "$SITUATION_SUB_REGION_TOOLTIP_DESC$\n\n#weak สายตาที่หลักแหลมสามารถทอดมองออกไปทั่วทุ่งหญ้าสเตปป์และมองเห็นเส้นทางเปิดโล่งมากมายเบื้องหน้า โอกาสมีอยู่เสมอ ทั้งสำหรับพ่อค้าและผู้ปล้นสะดม#!"
 silk_road_situation_sub_region_region_silk_road_proper_transcaspia: "ทรานส์แคสเปีย"
 silk_road_situation_sub_region_region_silk_road_proper_transcaspia_desc: "$SITUATION_SUB_REGION_TOOLTIP_DESC$\n\n#weak ทะเลแคสเปียนและทะเลดำมอบโอกาสพิเศษสำหรับการค้าและการเดินทาง แม่น้ำเชื่อมผืนน้ำเหล่านี้ไปยังดินแดนทางเหนือ พร้อมด้วยเครือข่ายการค้าของตนเอง และโอกาสของตนเองสำหรับความมั่งคั่งและโชคลาภ#!"
 silk_road_situation_sub_region_region_silk_road_proper_occident: "ตะวันตก"
 silk_road_situation_sub_region_region_silk_road_proper_occident_desc: "$SITUATION_SUB_REGION_TOOLTIP_DESC$\n\n#weak ที่นี่คือที่ซึ่งกองคาราวานผู้ยิ่งใหญ่มาถึงจุดหมายปลายทาง และที่ซึ่งความมั่งคั่งถูกสร้างและสูญสลาย#!"

