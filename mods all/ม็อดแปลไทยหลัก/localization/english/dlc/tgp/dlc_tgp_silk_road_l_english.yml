 tgp_silk_road_events.0010.desc: "ขณะเดินท่ามกลางแผงลอยในตลาดอันพลุกพล่านของ [ROOT.Char.GetCurrentLocation.GetName] ผู้นำทางของข้าเอ่ยถึงการได้ยินเศษเสี้ยวของบทสนทนา, "[innovation_temp.GetName]" ถูกพูดซ้ำไปซ้ำมา ทั้งเมืองกล่าวขานถึงมัน แต่เสียงของพวกเขาก็เบาลงเมื่อเห็นคนแปลกหน้า เช่นข้าเดินผ่าน\n\nข้าสังเกตเห็นกลุ่มพ่อค้าจับกลุ่มกันอยู่ใต้แผงหนึ่ง ซึ่งดูระแวงน้อยกว่าคนอื่น ๆ ในแถบนี้ และยังคงพูดคุยกันแม้ ในขณะที่ผู้นำทางของข้าและข้าเข้าไปใกล้ นี่คือโอกาสของข้าที่จะได้เรียนรู้หรือไม่?"
