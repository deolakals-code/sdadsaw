 game_concept_silk_road_innovation_desc: "$game_concept_silk_road_innovations$ คือ [innovations|E] ที่แพร่กระจายไปทางตะวันตกตาม [silk_road_situation|E]\n\nทุก ๆ [GetDefine('NSilkRoad', 'INNOVATION_TRAVEL_DURATION')|0V] ปี $game_concept_silk_road_innovation$ ที่ถูกค้นพบโดย [culture|E] ฮั่น จะถูกสุ่มกำหนดให้กับ [situation_sub_region|E] จีน, โดย $game_concept_silk_road_innovations$ อื่น ๆ ทั้งหมดจะเคลื่อนไปทางตะวันตกตาม $game_concept_silk_road$\n\n$game_concept_cultures$ ที่มี [tradition|E] [GetCultureTradition('tradition_sinophilic').GetName] จะสามารถเข้าถึง $game_concept_silk_road_innovations$ ทั้งหมดที่ค้นพบโดย $game_concept_culture$ ฮั่น\n\n[rulers|E] ที่อยู่นอก $game_concept_silk_road$ สามารถพยายามนำความรู้กลับไปยัง [culture|E] ของตนผ่านทาง [decision|E] [GetDecisionWithKey('visit_silk_road_market_decision').GetName|V] หากสำเร็จ $game_concept_silk_road_innovation$ จะสามารถถูกค้นพบได้ เช่นเดียวกับ $game_concept_innovation$ อื่น ๆ เมื่อพวกเขากลับมา"
