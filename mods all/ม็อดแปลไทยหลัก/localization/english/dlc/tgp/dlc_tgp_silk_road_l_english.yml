 silk_road_situation_participant_group_silk_road_realm_desc: "ตัวละครนี้คือ [independent_ruler|E] ที่มิใช่ [nomadic|E] ภายนอก [GetSituation('silk_road_situation').GetSubRegionByKey('region_silk_road_proper_china').GetName] ผู้ ซึ่งมี [realm|E] ตั้งอยู่บน [GetGeographicalRegion('dlc_tgp_silk_road_route_region').GetName]"
 silk_road_situation_participant_group_silk_road_periphery: "อาณาจักรรอบนอก"
 silk_road_situation_participant_group_silk_road_periphery_desc: "ตัวละครนี้คือ [independent_ruler|E] ที่มิใช่ [nomadic|E] ภายนอก [GetSituation('silk_road_situation').GetSubRegionByKey('region_silk_road_proper_china').GetName] ผู้ ซึ่งมี [realm|E] อยู่ภายใน [GetGeographicalRegion('tgp_silk_road_region').GetName]"
 silk_road_situation_participant_group_silk_road_nomad: "ชนเผ่าเร่ร่อนแห่งทุ่งหญ้าสเตปป์"
 silk_road_situation_participant_group_silk_road_nomad_desc: "ตัวละครนี้คือ [independent_ruler|E] ผู้เป็น [nomadic|E] ที่ตั้งค่ายอยู่ภายใน [silk_road_situation|E]"
