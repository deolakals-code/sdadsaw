 silk_road_situation_participant_group_silk_road_domain: "เขตปกครองบนเส้นทางสายไหม"
 silk_road_situation_participant_group_silk_road_domain_desc: "ตัวละครนี้คือ [independent_ruler|E] ที่มิใช่ [nomadic|E] ภายนอก [GetSituation('silk_road_situation').GetSubRegionByKey('region_silk_road_proper_china').GetName] ผู้ ซึ่งมี [domain|E] ตั้งอยู่บน [GetGeographicalRegion('dlc_tgp_silk_road_route_region').GetName]"
