l_english: 
 devaraja.0001.title: "เมตตาทาน"
 devaraja.0001.desc: "[diseased_county_scope.GetName] กำลังร้องขอความช่วยเหลือจากโรคร้ายที่กำลังระบาดในหมู่ราษฎร หากมีสถานที่ใดในอาณาจักรที่ต้องการการกุศลในยามนี้ ก็คงเป็นที่นี่ แต่ขณะที่กำลังสำรวจพื้นที่เพื่อสร้างสถานพยาบาล ไพร่ผู้หนึ่งที่อยู่ในสภาพน่าสังเวชที่สุดก็คลานเข้ามาหาข้า ด้วยการละเมิดธรรมเนียมอย่างร้ายแรง [diseased_peasant.GetSheHe] ทรุดตัวลงหมอบ [diseased_peasant.GetHerHis] กับพื้น ก้มกราบอ้อนวอนขอความเมตตา\n\nในฐานะ #italic เทวราชา#! ข้าถูกคาดหวังให้ช่วยเหลือเกื้อกูลไพร่ฟ้าข้าแผ่นดินทั้งปวง แต่... #italic สิ่งนี้#! หรือ คือสิ่งที่ข้าต้องช่วยเหลืออย่างแท้จริง?"
 devaraja.0001.a: "ข้าจักต้องช่วยเหลือในยามยากลำบากนี้ มิว่่าผู้คนจะตกอยู่ในสภาพสกปรกโสโครกเพียงใดก็ตาม"
 devaraja.0001.b: "ข้าจะมอบหมายงานนี้ให้ [steward.GetCouncilTitle] [steward.GetFirstNameNoTooltip] ของข้า เป็นผู้ดูแลความพยายามนี้"
 devaraja.0001.c: "ชิ! สถานที่โสโครก เช่นนี้ไม่คู่ควรที่จะรับเมตตาทานอันศักดิ์สิทธิ์"
 healed_by_the_devaraja: "ได้รับการเยียวยาจากเทวราชา"

 devaraja.0002.title: "บทสวดถวายแด่เทวราชา"
 devaraja.0002.desc.brahmin: "ขณะที่ [brahmin_or_chaplain.GetName] ผู้เป็น [GetCourtPositionType('court_brahmin_court_position').GetName] ของข้า เสร็จสิ้นภารกิจราชการของวัน [brahmin_or_chaplain.GetSheHe] ก็เริ่มสวดประสาทพรแก่ราชสำนักด้วยบท #italic อนุโมทนา#! ซึ่งเป็นบทสวดมาตรฐานสำหรับปิดท้ายวัน\n\n#italic ห้วงน้ำที่เต็มย่อมยังสมุทรสาครให้บริบูรณ์ฉันใด,#!\n#italic ทานที่อุทิศให้แต่โลกนี้ ย่อมสำเร็จประโยชน์แก่ผู้ล่วงลับที่ละไปแล้ว...#!\n\nพลันบังเกิดคำถามขึ้นในใจข้า ข้าจะกล้าขัดจารีตประเพณีหรือไม่?"
 devaraja.0002.desc.chaplain: "ขณะที่ [brahmin_or_chaplain.GetName] ผู้เป็น [ROOT.Char.GetCouncillorPosition( 'councillor_court_chaplain' ).GetPositionName] ของข้า เสร็จสิ้นภารกิจราชการของวัน [brahmin_or_chaplain.GetSheHe] ก็เริ่มสวดประสาทพรแก่ราชสำนักด้วยบท #italic อนุโมทนา#! ซึ่งเป็นบทสวดมาตรฐานสำหรับปิดท้ายวัน\n\n#italic ห้วงน้ำที่เต็มย่อมยังสมุทรสาครให้บริบูรณ์ฉันใด,#!\n#italic ทานที่อุทิศให้แต่โลกนี้ ย่อมสำเร็จประโยชน์แก่ผู้ล่วงลับที่ละไปแล้ว...#!\n\nพลันบังเกิดคำถามขึ้นในใจข้า ข้าจะกล้าขัดจารีตประเพณีหรือไม่?"
 devaraja.0002.a: ""เหตุใดผู้ล่วงลับจึงควรได้รับบุญกุศล เช่นนี้?""
 devaraja.0002.a.tt.success: "บทสวดท่อนสุดท้ายถูกเปลี่ยนอย่างชาญฉลาดเป็นคำสรรเสริญท่านแทน"
 devaraja.0002.a.tt.failure: "การขัดจังหวะของท่าน ทำให้พิธีการทั้งหมดดูน่ากระอักกระอ่วน"
 devaraja.0002.b.tt: "[brahmin_or_chaplain.GetFirstNameNoTooltip] รู้สึกโล่งใจที่พิธีการดำเนินไปตามแผน"
 devaraja.0002.b: "อย่าให้ความคิดที่สอดแทรกเข้ามาเอาชนะได้!"
 devaraja.0002.c: "ขัดจังหวะด้วยบทสวดท่อนสุดท้ายที่ดีกว่า"
 devaraja.0002.c.tt.success: "ไหวพริบและความรู้ของท่าน ทำให้คิดบทสวดท่อนสุดท้ายที่ดีกว่าได้ในทันที"
 devaraja.0002.c.quote.success: ""ทานที่อุทิศให้แต่โลกนี้ ย่อมสำเร็จประโยชน์แด่ #italic องค์ราชา#!"" # ROOT could be something else, a duke or a queen, but 'king' still works as a generic stand-in for the ruler, and actually rhymes in Pali.
 devaraja.0002.b.tt.failure: "ท่านพูดตะกุกตะกักได้บทสวดที่ไม่เข้าท่า หลังจากขัดจังหวะ [brahmin_or_chaplain.GetFirstNameNoTooltip]"

 devaraja.0003.title: "การแสดงธรรมครั้งพิเศษ"
 devaraja.0003.desc.guru: "ในบางโอกาส [GetCourtPositionType('court_guru_court_position').GetName] ถูกคาดหวังให้แสดงธรรมเกี่ยวกับหลัก #italic ธรรมะ#! ในวัง โดยปกติแล้วจะเป็นงานที่ยาวนาน มีแบบแผน เต็มไปด้วยบทสวดและพิธีรีตอง พร้อมด้วยเครื่องบูชาอันล้ำค่าสำหรับผู้พูด เพื่อตอบแทนความวิริยะของ [guru_or_chaplain.GetHerHis] ทว่าวันนี้ [guru_or_chaplain.GetName] ดูจะเหนื่อยล้าอยู่บ้าง\n\nเมื่อยืนอยู่ต่อหน้าเหล่าข้าราชบริพาร [guru_or_chaplain.GetSheHe] เพียงแค่ประกาศว่า "[ROOT.Char.GetTitleTierName] ทรงทราบทุกสิ่งที่ควรรู้แจ้งอยู่แล้ว" กล่าวเพียงเท่านั้น [guru_or_chaplain.GetSheHe] ก็สวดบทสวดตามปกติเพื่อปิดการแสดงธรรมและกลับไปยังที่นั่งของ [guru_or_chaplain.GetHerHis]"
 devaraja.0003.desc.chaplain: "ในบางโอกาส [ROOT.Char.GetCouncillorPosition( 'councillor_court_chaplain' ).GetPositionName] ถูกคาดหวังให้แสดงธรรมเกี่ยวกับหลัก #italic ธรรมะ#! ในวัง โดยปกติแล้วจะเป็นงานที่ยาวนาน มีแบบแผน เต็มไปด้วยบทสวดและพิธีรีตอง พร้อมด้วยเครื่องบูชาอันล้ำค่าสำหรับผู้พูด เพื่อตอบแทนความวิริยะของ [guru_or_chaplain.GetHerHis] ทว่าวันนี้ [guru_or_chaplain.GetName] ดูจะเหนื่อยล้าอยู่บ้าง\n\nเมื่อยืนอยู่ต่อหน้าเหล่าข้าราชบริพาร [guru_or_chaplain.GetSheHe] เพียงแค่ประกาศว่า "[ROOT.Char.GetTitleTierName] ทรงทราบทุกสิ่งที่ควรรู้แจ้งอยู่แล้ว" กล่าวเพียงเท่านั้น [guru_or_chaplain.GetSheHe] ก็สวดบทสวดตามปกติเพื่อปิดการแสดงธรรมและกลับไปยังที่นั่งของ [guru_or_chaplain.GetHerHis]"
 devaraja.0003.a: "ฮ่า ทำได้ดีมาก! มอบเครื่องบูชาของ [guru_or_chaplain.GetHerHis] ให้ [guru_or_chaplain.GetHerHim] เสีย"
 devaraja.0003.b: "ชาญฉลาด! แต่ข้าให้รางวัลเฉพาะผู้ที่พยายามเท่านั้น"
 devaraja.0003.c: "ข้าไม่ให้รางวัลคนขี้เกียจ! ทหาร! จับกุม [guru_or_chaplain.GetHerHim]!"
 devaraja.0003.d: "เรียก [guru_or_chaplain.GetFirstNameNoTooltip] ออกมาอีกครั้ง ข้าจะถาม #italic [guru_or_chaplain.GetHerHim]#! เกี่ยวกับ #italic ธรรมะ#! เอง"
 devaraja.0003.d.tt.success: "ท่านสร้างความประทับใจให้ [guru_or_chaplain.GetFirstNameNoTooltip] และเหล่าข้าราชบริพารด้วยความรู้เรื่อง #italic ธรรมะ#! ของท่าน"
 devaraja.0003.d.tt.failure: "ท่านทำขายหน้าตนเองต่อหน้า [guru_or_chaplain.GetFirstNameNoTooltip] และเหล่าข้าราชบริพาร โดยไม่แสดงความเข้าใจใน #italic ธรรมะ#! เลย"

 devaraja.0004.title: "ข้ารักขบวนแห่"
 devaraja.0004.desc: "[capital_county.GetName] มีบาดแผลจากการต่อสู้ดิ้นรนในอดีต ถูกทำลายล้างทั้งจากคมดาบและพายุมาตลอดหลายปี นอกจากการปรับปรุงทางวัตถุแล้ว เป็นการสมควรที่เราจะทำบางสิ่งเพื่อยกระดับขวัญกำลังใจของราษฎร\n\nคงจะดีไม่น้อยหากเรามีขบวนแห่ทางเรือในเมืองหลวงเมื่อสิ้นสุดฤดูฝน? ให้มีนักเป่าปี่เจ็ดสิบหกคนแสดงบนเรือนำขบวน พร้อมด้วยมือกลองหนึ่งร้อยสิบคนอยู่ใกล้กัน และ เพื่อให้ขบวนแห่สมบูรณ์ เราสามารถขอให้ทุกอารามจ่ายเงินค่าตก แต่งเรือ!"
 devaraja.0004.a: "ราษฎรจะรู้สึกตื่นตาตื่นใจเมื่อขบวนเรือแล่นผ่าน!"
 devaraja.0004.b: "การร้องขอทองคำจากอารามต่างๆ ในยามนี้ไม่เป็นมงคล"
 devaraja.0004.b.tt: "การล้มเลิกความคิดในตอนนี้จะเป็นที่สังเกตเห็น"
 devaraja.0004.c: "ขบวนแห่จะดำเนินต่อไป โดยปราศจากการมีส่วนร่วมของอาราม"
 devaraja_hosts_parade: "ขบวนแห่อันยิ่งใหญ่ของเทวราชา"

 devaraja.0005.title: "ผนังสองนัย"
 devaraja.0005.desc: "อาคารวัดแห่งใหม่ต้องการเครื่องประดับตก แต่ง ศิลปะที่สะท้อนถึงความศักดิ์สิทธิ์และความยิ่งใหญ่ เพื่อสะท้อนแง่มุมอันศักดิ์สิทธิ์ [ROOT.Char.Custom('GetAspectNoun')|U] ของตระกูลอันเที่ยงธรรมของเรา เราสามารถ ทำให้แน่ใจได้ว่าภาพจิตรกรรมฝาผนังและประติมากรรมของสถานที่ใหม่นี้จะมีภาพของเหล่าเทพเจ้าแห่ง [ROOT.Char.Custom('GetAspectNoun')|U] — หรือภาพของตระกูล [ROOT.Char.GetHouse.GetName] และเพิ่มเกียรติภูมิของข้าต่อไป"
 devaraja.0005.a: "สถานที่แห่งนี้จักถูกอุทิศถวายแด่ทวยเทพ"
 devaraja.0005.b: "สถานที่แห่งนี้จักถูกสร้างขึ้นเพื่อความโอ่อ่าบารมีของข้า"

 devaraja.0006.title: "ปัญญาแห่งไม้พาย"
 devaraja.0006.desc.guru: "[guru_or_chaplain.GetName] ผู้เป็น [GetCourtPositionType('court_guru_court_position').GetName] ของข้า ถูกพบเห็นกำลังพายเรือลำเล็กในสระน้ำรอบวัง ขณะกำลังสังสรรค์อยู่กับเหล่าข้าราชบริพาร ข้าเรียกคุรุผู้พายเรือจากอีกฟากของผืนน้ำ "ท่านคือ [GetCourtPositionType('court_guru_court_position').GetNameNoTooltip] ของข้า! ท่านไม่เคารพตำแหน่งสูงศักดิ์ที่ท่านดำรงอยู่เลยหรือ? เหตุใดท่านจึงพายเรือด้วยตนเองเยี่ยงชาวประมงต่ำต้อย เช่นนั้น?"\n\nหลังจากหยุดชั่วครู่ [guru_or_chaplain.GetFirstNameNoTooltip] ตอบกลับว่า "เมื่อ [ROOT.Char.GetTitleTierName] ของแผ่นดินสังสรรค์เสเพลอย่างเปิดเผย เหล่า [GetCourtPositionType('court_guru_court_position').GetNameNoTooltip] ก็ย่อมพายเรือของตนเองได้""
 devaraja.0006.desc.chaplain: "[guru_or_chaplain.GetName] ผู้เป็น [ROOT.Char.GetCouncillorPosition( 'councillor_court_chaplain' ).GetPositionName] ของข้า ถูกพบเห็นกำลังพายเรือลำเล็กในสระน้ำรอบวัง ขณะกำลังสังสรรค์อยู่กับเหล่าข้าราชบริพาร ข้าเรียกคุรุผู้พายเรือจากอีกฟากของผืนน้ำ "ท่านคือ [ROOT.Char.GetCouncillorPosition( 'councillor_court_chaplain' ).GetPositionName] ของข้า! ท่านไม่เคารพตำแหน่งสูงศักดิ์ที่ท่านดำรงอยู่เลยหรือ? เหตุใดท่านจึงพายเรือด้วยตนเองเยี่ยงชาวประมงต่ำต้อย เช่นนั้น?"\n\nหลังจากหยุดชั่วครู่ [guru_or_chaplain.GetFirstNameNoTooltip] ตอบกลับว่า "เมื่อ [ROOT.Char.GetTitleTierName] ของแผ่นดินสังสรรค์เสเพลอย่างเปิดเผย เหล่า [ROOT.Char.GetCouncillorPosition( 'councillor_court_chaplain' ).GetPositionName] ก็ย่อมพายเรือของตนเองได้""
 devaraja.0006.a: "บางทีข้าควรจะสำรวมกิริยาในที่สาธารณะให้มากกว่านี้"
 devaraja.0006.b: "ไร้สาระ! งานสังสรรค์จะดำเนินต่อไปตราบเท่าที่ข้าพอใจ"
 devaraja.0006.c: "นี่คือการดูหมิ่น! ถอดถอน [guru_or_chaplain.GetFirstNameNoTooltip] ออกจากบรรดาศักดิ์ของ [guru_or_chaplain.GetHerHis] ซะ"
 devaraja.0006.d: "บางทีข้าควรจะเลิกดื่มโดยสิ้นเชิง"

 devaraja.0007.title: "ความคลุมเครือที่ชัดแจ้ง"
 devaraja.0007.desc: "#italic เทวราชา#! เป็นแนวคิดที่ละเอียดอ่อน แน่นอนว่าข้าคือ [ROOT.Char.GetTitleTierName] แต่ข้าก็ยังเชื่อมโยงกับความเป็นทิพย์ของ [ROOT.Char.Custom('GetAspectNoun')|U] ด้วย ข้าเป็นหนึ่งเดียวกับพระเจ้าหรือไม่? อ่า นั่นคือคำถามที่ละเอียดอ่อน ซึ่งต้องการความคลุมเครือ เพื่อให้ข้าสามารถเป็นเทพสำหรับบางคนและเป็นกษัตริย์สำหรับคนอื่น ๆ \n\nหรือมันก็คงจะเป็นคำถามที่ละเอียดอ่อนและคลุมเครือต่อไป หากไม่มีนักประพันธ์คำสรรเสริญเยินยอที่พูดจาเยิ่นเย้อบางคนเพิ่งเรียกข้าว่าเป็นเทพเจ้าแห่ง [ROOT.Char.Custom('GetAspectNoun')|U] เหล่าข้าราชบริพารกำลังถกเถียงกันอย่างเอาเป็นเอาตายว่าข้าเป็นอะไรกันแน่ ไม่มีทางเลือกอื่นนอกจากข้าต้องชี้ขาด"
 devaraja.0007.a: "ใช่ เหล่าข้ารับใช้ของข้า ข้าคือเจ้าแห่ง [ROOT.Char.Custom('GetAspectNoun')|U]"
 devaraja.0007.b: "ราษฎรของข้า! ข้าเป็นเพียงผู้รับใช้ [ROOT.Char.Custom('GetAspectNoun')|U] ข้ามิใช่เจ้าเหนือแห่งสิ่งนั้น"
 devaraja.0007.c: "ความเป็นมนุษย์และความเป็นเทพได้รวมกันอยู่ในตัวข้าในฐานะหนึ่งเดียวอันลี้ลับ" # DYOPHISITISM LET'S GOOO
 devaraja.0007.c.tt.success: "ท่านกำหนดแนวคิดประนีประนอมที่ถูกใจผู้คนมากพอ"
 devaraja.0007.c.tt.failure: "การที่ท่านเข้าไปยุ่งเกี่ยวกับเทววิทยาเพียง แต่ ทำให้เรื่องเลวร้ายลง"
 devaraja_as_god: "เทวราชาผู้เป็นเทพ"
 devaraja_as_king: "เทวราชาผู้เป็นกษัตริย์"
 devaraja_as_hypostatic_union: "เทวราชาสองธรรมชาติ"

 devaraja.0008.title: "ข่าวลือเรื่องการเปลี่ยนศาสนาก่อนสิ้นใจ"
 devaraja.0008.desc: "[suzerains_missionary.GetNameNoTooltip] ผู้เป็นมิชชันนารีของ [suzerain.GetTitleTierName] [suzerain.GetFirstNamePossessiveNoTooltip] เกือบจะสะดุดขา [suzerains_missionary.GetHerselfHimself] ขณะที่ [suzerains_missionary.GetSheHe] เข้ามาใกล้\n\n"ข้ามีข่าวดี!" [suzerains_missionary.GetSheHe] ร้องอุทาน "ข้าได้ค้นคว้าประวัติครอบครัวของท่านและซักถามข้ารับใช้ที่แก่ที่สุดเท่าที่พวกเขาจะจำความได้ และดูเหมือนว่า [deathbed_conversion_ancestor.GetName] บรรพบุรุษของท่าน ได้เปลี่ยนไปนับถือ [suzerain.GetFaith.GetName] ก่อนที่ [deathbed_conversion_ancestor.GetHerHis] จะสิ้นใจ!"\n\n[suzerains_missionary.GetName] มองข้าด้วยความตื่นเต้นที่แทบเก็บไว้ไม่อยู่ "ท่านอยู่ใกล้ชิด [suzerain.GetFaith.HighGodName] มากกว่าที่ท่านคิดเสียอีก!""
 devaraja.0008.a: "[deathbed_conversion_ancestor.GetName] เป็น [suzerain.GetFaith.GetAdjective] หรือ? ข้าเชื่อได้อยู่"
 devaraja.0008.a.tt.conversion: "[ROOT.Char.GetName] บัดนี้อ้างว่า [deathbed_conversion_ancestor.GetName] บรรพบุรุษของ [ROOT.Char.GetHerHis] ได้เปลี่ยนไปนับถือ [suzerain.GetFaith.GetName]"
 devaraja.0008.b: "[deathbed_conversion_ancestor.GetRelationToString( ROOT.Char )] สิ้นใจในฐานะ [deathbed_conversion_ancestor.GetFaith.GetAdherentName] และจะเป็นที่จดจำ เช่นนั้นตลอดไป!"

 devaraja.0009.title: "มิชชันนารีผู้ไร้ภารกิจ"
 devaraja.0009.desc: "การที่ข้ายึดมั่นใน [suzerain.GetFaith.GetName] ทำให้ [suzerains_missionary.GetName] ไม่มีราชสำนักที่จะเผยแผ่ศาสนา แม้ว่า [suzerains_missionary.GetSheHe] จะปิติยินดีอย่างยิ่งต่อการเปลี่ยนศาสนาของข้า [suzerains_missionary.GetSheHe] ก็กำลังเผชิญกับความไม่แน่นอนเกี่ยวกับอนาคตของ [suzerains_missionary.GetHerHis]"
 devaraja.0009.a: "[suzerains_missionary.GetName]! มาร่วมกับข้าในฐานะ [ROOT.Char.GetCouncillorPosition( 'councillor_court_chaplain' ).GetPositionName] คนใหม่ของข้า!"
 devaraja.0009.a.tt.missionary_now_chaplain: "[ROOT.Char.GetName] ได้ แต่งตั้ง [suzerains_missionary.GetName] มิชชันนารีของท่าน เป็น [ROOT.Char.GetCouncillorPosition( 'councillor_court_chaplain' ).GetPositionName] คนใหม่ของ [ROOT.Char.GetHerHis]"
 devaraja.0009.b: "[suzerains_missionary.GetName] ภารกิจของท่านที่นี่สิ้นสุดลงแล้ว — บัดนี้ #italic จงไปเสีย#!."

 devaraja.0010.title: "ศรัทธาอันโดดเดี่ยว"
 devaraja.0010.desc: "[suzerains_missionary.GetName] ผู้เป็น [suzerains_missionary.GetFaith.GetAdherentName] ที่ดี กลับรู้สึกสิ้นหวังต่อศรัทธา [suzerain.GetFaith.GetAdjective] ของเจ้านาย [suzerains_missionary.GetHerHis] [suzerains_missionary.GetSheHe|U] กำลังอยู่บนทางแยก ศรัทธาของ [suzerains_missionary.GetHerHis] สั่นคลอนขณะที่ [suzerains_missionary.GetSheHe] รอคอยสัญญาณ สัญญาณนั้นจะมาจากท่านหรือมาจาก [suzerains_missionary.GetFaith.DivineRealm] ก็สุดแล้ว แต่ท่านจะตัดสินใจ"
 devaraja.0010.a: "[suzerains_missionary.GetName] จะตัดสินใจด้วย [suzerains_missionary.GetHerHis] เอง เมื่อถึงเวลาอันควร"
 devaraja.0010.a.tt.unconverted: "[suzerains_missionary.GetName] ยังคงเป็น [suzerains_missionary.GetFaith.GetAdherentName] ที่เศร้าสร้อย"
 devaraja.0010.a.tt.converts: "[suzerains_missionary.GetName] ยอมรับศรัทธา [suzerain.GetFaith.GetAdjective] ของ [suzerain.GetNamePossessive]"
 devaraja.0010.b: "บางที [suzerains_missionary.GetName] อาจค้นพบจุดมุ่งหมายใหม่ใน [ROOT.Char.GetFaith.GetName]?"
 devaraja.0010.b.tt.success: "[suzerains_missionary.GetName] เปลี่ยนไปนับถือ [ROOT.Char.GetFaith.GetName]"
 devaraja.0010.b.tt.failure: "[suzerains_missionary.GetName] ยังคงเป็น [suzerains_missionary.GetFaith.GetAdherentName] ที่แน่วแน่"

