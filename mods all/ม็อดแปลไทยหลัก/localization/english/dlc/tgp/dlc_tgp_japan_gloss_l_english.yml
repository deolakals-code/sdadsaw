l_english: 
 FUJIWARA_GLOSS: "#bold $dynn_Fujiwara$#! คือ [Glossary( 'ฮงเซ', 'HONSEI_GLOSS' )] ที่จักรพรรดิ $Tenji$ ได้พระราชทานแก่ข้าราชสำนักผู้ทรงอิทธิพลของพระองค์ $dynn_Nakatomi$ $Kamatari$\n\nเหล่าทายาทในหลากหลายสายสกุลของเขาได้ครอบงำการเมืองญี่ปุ่นเป็นเวลาหลายศตวรรษ โดยดำรงตำแหน่งเป็น [Glossary( 'คัมปะคุ', 'KAMPAKU_GLOSS' )] แก่ราชวงศ์ [Glossary( 'ยามาโตะ', 'YAMATO_GLOSS' )] ไปพร้อมกัน\n\nเช่นเดียวกับ [Glossary( 'มินาโมโตะสายเซวะ', 'MINAMOTO_GLOSS' )] และ [Glossary( 'ไทระสายคันมุ', 'TAIRA_GLOSS' )] ตระกูล $dynn_Fujiwara$ ถือเป็นหนึ่งในตระกูลที่ทรงอำนาจที่สุดในยุคกลางตอนต้นของญี่ปุ่น\n\n[Glossary( 'มง', 'MON_GLOSS' )] ตามธรรมเนียมของพวกเขาคือ #EMP ซาการิฟูจิ#! — ดอกวิสทีเรียระย้า"
 MINAMOTO_GLOSS: "#bold $dynn_Minamoto$#! — หรือ #EMP เก็นจิ#! — คือ [Glossary( 'ฮงเซ', 'HONSEI_GLOSS' )] ที่พระราชทานแก่เหล่าทายาทผู้ถูกตัดสิทธิ์จากราชวงศ์ [Glossary( 'ยามาโตะ', 'YAMATO_GLOSS' )] ตระกูล $dynn_Minamoto$ ที่สำคัญที่สุดสืบเชื้อสายมาจากจักรพรรดิ $Seiwa$\n\nเช่นเดียวกับ [Glossary( 'ฟูจิวาระ', 'FUJIWARA_GLOSS' )] และ [Glossary( 'ไทระสายคันมุ', 'TAIRA_GLOSS' )] ตระกูล $Seiwa$ $dynn_Minamoto$ ถือเป็นหนึ่งในตระกูลที่ทรงอำนาจที่สุดในยุคกลางตอนต้นของญี่ปุ่น\n\n[Glossary( 'มง', 'MON_GLOSS' )] ตามธรรมเนียมของพวกเขาคือดอก #EMP รินโด#! — เจนเชียน — สามดอก ที่ผลิออกมาจากใบไผ่ห้าใบ"
 TAIRA_GLOSS: "#bold $Kanmu$#! — หรือ #EMP เฮเกะ#! — คือ [Glossary( 'ฮงเซ', 'HONSEI_GLOSS' )] ที่พระราชทานแก่ทายาทที่ถูกตัดสิทธิ์ของราชวงศ์ [Glossary( 'ยามาโตะ', 'YAMATO_GLOSS' )] ตระกูล $dynn_Taira$ ที่สำคัญที่สุดสืบเชื้อสายมาจากจักรพรรดิ $Kanmu$\n\nเช่นเดียวกับ #EMP [Glossary( 'ฟูจิวาระ', 'FUJIWARA_GLOSS' )]#! และ #EMP [Glossary( 'มินาโมโตะสายเซวะ', 'MINAMOTO_GLOSS' )]#! $dynn_Taira$ สาย $dynn_Taira$ เป็นหนึ่งในตระกูลที่ทรงอำนาจที่สุดในญี่ปุ่นยุคกลางตอนต้น\n\n[Glossary( 'มง', 'MON_GLOSS' )] ประจำตระกูลของพวกเขาคือ #EMP อาเกฮาโจ#! — ผีเสื้อหางแฉก"
 TACHIBANA_GLOSS: "#bold $dynn_Tachibana$#! คือ [Glossary( 'ฮงเซ', 'HONSEI_GLOSS' )] ที่พระราชทานแก่เหล่าทายาทผู้ถูกตัดสิทธิ์จากราชวงศ์ [Glossary( 'ยามาโตะ', 'YAMATO_GLOSS' )]\n\nตระกูล $dynn_Tachibana$ ที่สำคัญที่สุดสืบเชื้อสายมาจากจักรพรรดิ $Bidatsu$\n\n[Glossary( 'มง', 'MON_GLOSS' )] ตามธรรมเนียมของพวกเขาคือ #EMP ทาจิบานะ#! — ดอกส้ม"
 TAKASHINA_GLOSS: "#bold $dynn_Takashina$#! คือ [Glossary( 'ฮงเซ', 'HONSEI_GLOSS' )] ที่พระราชทานแก่เหล่าทายาทผู้ถูกตัดสิทธิ์จากราชวงศ์ [Glossary( 'ยามาโตะ', 'YAMATO_GLOSS' )]\n\nตระกูล $dynn_Takashina$ ที่สำคัญที่สุดสืบเชื้อสายมาจากจักรพรรดิ $Tenmu$"
 YAMATO_GLOSS: "#bold $dynn_Yamato$#! คือราชวงศ์แห่งญี่ปุ่น กล่าวกันว่าสืบเชื้อสายมาจากองค์สุริยเทพีอามาเตราสึโดยตรง แม้ว่าครั้งหนึ่งจะเคยเป็นจักรพรรดิผู้ทรงอำนาจ ตระกูล [Glossary( 'ฟูจิวาระ', 'FUJIWARA_GLOSS' )] ผู้ทรงอิทธิพลก็ได้เข้ายึดอำนาจควบคุมกลไกที่แท้จริงของรัฐ โดยปกครองในฐานะผู้สำเร็จราชการของราชวงศ์\n\nตระกูลที่ทรงอิทธิพลที่สุดหลายตระกูลในญี่ปุ่นสืบเชื้อสายโดยตรงจากจักรพรรดิยามาโตะ ซึ่ง รวมถึง [Glossary( 'มินาโมโตะ', 'MINAMOTO_GLOSS' )] และ [Glossary( 'ไทระ', 'TAIRA_GLOSS' )]\n\n[Glossary( 'มง', 'MON_GLOSS' )] ตามธรรมเนียมของพวกเขาคือ #EMP คิกกะ#! — ดอกเบญจมาศ"
 KAMPAKU_GLOSS: "#bold คัมปะคุ#! คือตำแหน่งที่มอบให้แก่ผู้สำเร็จราชการอย่างเป็นทางการของจักรพรรดิญี่ปุ่นที่บรรลุนิติภาวะแล้ว เริ่มแรกเป็นตำแหน่งอันทรงเกียรติที่ใกล้ชิดกับ [Glossary( 'จักรพรรดิ', 'TENNO_GLOSS' )] ตระกูลฟูจิวาระค่อยๆ เข้ายึดอำนาจควบคุม จนกระทั่งคัมปากุกลายเป็นผู้ปกครองโดยพฤตินัย และองค์จักรพรรดิเป็นเพียงหุ่นเชิดเท่านั้น"
 TENNO_GLOSS: "#bold เทนโน#! คือตำแหน่งที่มอบให้แก่จักรพรรดิแห่งญี่ปุ่น เมื่อเวลาผ่านไป เหล่าผู้สำเร็จราชการฟูจิวาระค่อยๆ เข้ายึดอำนาจควบคุมจากราชวงศ์ จนกระทั่ง [Glossary( 'คัมปะคุ', 'KAMPAKU_GLOSS' )] กลายเป็นผู้ปกครองโดยพฤตินัย และองค์จักรพรรดิเป็นเพียงหุ่นเชิดเท่านั้น"
 JOKO_GLOSS: "#bold โจโค#! คือคำเรียกโดยทั่วไปสำหรับอดีต [Glossary( 'จักรพรรดิ', 'TENNO_GLOSS' )] ผู้ ซึ่งสละราชบัลลังก์ดอกเบญจมาศ เมื่ออำนาจถูกยึดไปจากราชวงศ์ ก็กลายเป็นเรื่องปกติมากขึ้นที่จักรพรรดิจะเลือกสละราชสมบัติเมื่อการสืบทอดตำแหน่งมั่นคงด้วยทายาทที่แข็งแรง ซึ่ง ทำให้พระองค์สามารถมีส่วนร่วมทางการเมืองจากเบื้องหลังบัลลังก์ โดยปราศจากความรับผิดชอบทางพิธีการ"
 SHOEN_GLOSS: "#bold โชเอน#! คือคฤหาสน์ของตระกูลขุนนางญี่ปุ่น และที่ดินทำกินที่อยู่ติดกัน ซึ่งพวกเขาค่อยๆ ยึดจากการควบคุมส่วนกลางเมื่อระบบ [ritsuryo|E] แบบรวมศูนย์เสื่อมโทรมลง"
 HONSEI_GLOSS: "#bold ฮงเซ#! — #EMP แซ่ดั้งเดิม#! — อย่างเช่น #EMP [Glossary( 'ฟูจิวาระ', 'FUJIWARA_GLOSS' )]#!, #EMP [Glossary( 'มินาโมโตะ', 'MINAMOTO_GLOSS' )]#!, #EMP [Glossary( 'ไทระ', 'MINAMOTO_GLOSS' )]#!, #EMP [Glossary( 'ทาจิบานะ', 'TACHIBANA_GLOSS' )]#! และ #EMP [Glossary( 'ทาคาชินะ', 'TAKASHINA_GLOSS' )]#! ถือเป็นนามสกุลที่เก่าแก่และทรงเกียรติที่สุดในญี่ปุ่น ซึ่งราชวงศ์พระราชทานให้แก่เหล่าข้าราชสำนัก\n\nเมื่อยุคสมัยเปลี่ยนไป ความจำเป็นในการแยกแยะสายตระกูลต่างๆ เริ่มมีมากขึ้น ประกอบกับการเสื่อมอำนาจของราชสำนัก ทำให้นามสกุลเหล่านี้ถูกแยกย่อยออกเป็นสายย่อย หรือถูกแทนที่ด้วยชื่อแบบ #EMP คาเมอิ#! (ชื่อรอง) และ #EMP อุจิ#! (ชื่อตระกูล) ในที่สุด"
 HEIJI_REBELLION_GLOSS: "#bold กบฏเฮจิ#! คือความขัดแย้งระหว่างตระกูล [Glossary( 'มินาโมโตะสายคาวาจิ', 'MINAMOTO_GLOSS' )] และตระกูล [Glossary( 'ไทระสายคันมุ', 'TAIRA_GLOSS' )] โดยฝ่ายหลังได้รับการสนับสนุนจากตระกูลมินาโมโตะอื่น ๆ อีกหลายตระกูล เพื่อแย่งชิงการควบคุมจักรพรรดิญี่ปุ่น \n\nด้วยความคิดที่ว่าราชสำนักเข้าข้างคู่แข่งของตน ตระกูลมินาโมโตะจึงก่อกบฏเพื่อพยายามป้องกันสิ่งนั้น ท้ายที่สุด พวกเขาก็พ่ายแพ้ และสมาชิกหลายคนของตระกูลถูกเนรเทศหรือประหารชีวิต"
 RONIN_GLOSS: "#bold โรนิน#! — แท้จริงแล้วคือ #EMP คนคลื่น#! — มีที่มาเป็นคำในปลายยุคนารา หมายถึงทาสติดที่ดินที่หนีออกจากที่ดินของเจ้านาย ต่อมาได้หมายถึงซามูไรที่ไร้นาย ไม่ว่าจะเนื่องมาจากการเสียชีวิตของนาย หรือการสูญเสียความโปรดปรานหรือสถานะ ด้วยเหตุที่ว่างงาน และมีทักษะเพียงน้อยนิดนอกจากการต่อสู้ โรนินจำนวนมากจึงหันไปก่ออาชญากรรมเพื่อความอยู่รอด"
 MON_GLOSS: "#bold มง#! - #EMP ตรา#! - คือสัญลักษณ์ที่เกี่ยวข้องกับและใช้เพื่อระบุตระกูลขุนนางของญี่ปุ่นและสายตระกูลย่อย ๆ ของพวกเขา"
CHRYSANTHEMUM_THRONE_GLOSS: "#bold บัลลังก์ดอกเบญจมาศ#! หมายถึง ทาคามิคุระ หรือราชบัลลังก์แห่งญี่ปุ่น ทั้งในความหมายตามตัวอักษร และยังเป็นตัวแทนเชิงอุปมาของ [Glossary( 'จักรพรรดิ', 'TENNO_GLOSS' )] และอำนาจทางกฎหมายสำหรับการดำรงอยู่ของรัฐบาล ตราพระราชลัญจกร ซึ่งใช้ดอกเบญจมาศสิบหกกลีบถูกนำมาใช้ครั้งแรกโดยจักรพรรดิโกะ-โทบะ (1180-1239) เพื่อเป็นสัญลักษณ์ส่วนพระองค์ ต่อมาจึงถูกนำมาใช้โดย [Glossary( 'ราชวงศ์', 'YAMATO_GLOSS' )] ดอกเบญจมาศเป็นตัวแทนของอายุที่ยืนยาวและการเกิดใหม่ ซึ่งสอดคล้องกับสายราชวงศ์ญี่ปุ่นที่มิได้ขาดตอน"
 
