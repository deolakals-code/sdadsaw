 ### OPINIONS ###
 contributed_to_capital_opinion: "สนับสนุนเมืองหลวง"

 ### MODIFIERS ###
 mandala_strong_workers_modifier: "คนงานแข็งแกร่ง"
 mandala_strong_workers_modifier_desc: "ตัวละครนี้มีคนงานที่เพิ่งได้รับความแข็งแกร่งจากการทำงานใน $building_type_mandala_capital_01$"
 mandala_sanctified_domes_dynasty_modifier: "$great_project_type_mandala_capital_01_contribution_sanctified_domes$"
 mandala_sanctified_domes_dynasty_modifier_desc: "ราชวงศ์ที่มีทรัพยากรเพียงพอที่จะสนับสนุนโดมศักดิ์สิทธิ์อันสง่างามเหล่านี้จะได้รับพรและความทุ่มเทจากพวกเขาด้วย"
 mandala_ornate_reliefs_tax_province_modifier: "ภาพนูนต่ำอันวิจิตร"
 mandala_ornate_reliefs_tax_province_modifier_desc: "ภาพนูนต่ำเหล่านี้ ซึ่งแกะสลักอย่างบรรจงและบอกเล่าเรื่องราวของทวยเทพ ดึงดูดผู้มาเยือนจากแดนใกล้และไกล"
 mandala_ornate_reliefs_tax_modifier: "ภาษีนักท่องเที่ยว"
 mandala_ornate_reliefs_tax_modifier_desc: "ตัวละครนี้กำลังสูบผลประโยชน์จากภาพนูนต่ำอันวิจิตรที่เคยสนับสนุนให้กับ $building_mandala_capital_01$"

 mandala_decorated_domes_dynasty_modifier: "$great_project_type_mandala_capital_02_contribution_decorated_domes$"
 mandala_decorated_domes_dynasty_modifier_desc: "การผสมผสานอย่างงดงามของรูปทรงและลักษณะเด่น โดมที่ประดับประดานี้ของราชวงศ์สะท้อนกับผู้พบเห็นในระดับจิตวิญญาณ"
 mandala_shallow_pools_defense_modifier: "$great_project_type_mandala_capital_02_contribution_shallow_pools$"
 mandala_shallow_pools_defense_modifier_desc: "สระน้ำตื้นของ $building_type_mandala_capital_01$ ในท้องถิ่นจะเติมเต็มจิตวิญญาณของท่านรวมทั้งหยุดยั้งศัตรูของท่าน"

 mandala_divine_statues_province_modifier: "$great_project_type_mandala_capital_03_contribution_divine_statues$"
 mandala_divine_statues_province_modifier_desc: "รูปปั้นศักดิ์สิทธิ์ในบริเวณวัดท้องถิ่นดึงดูดผู้เคารพบูชาจำนวนมาก"
 mandala_creation_aspect_statues_modifier: "$great_project_type_mandala_capital_03_contribution_creation_aspect$"
 mandala_creation_aspect_statues_modifier_desc: "เศียรอันศักดิ์สิทธิ์แห่งแง่มุมของการสร้างสรรค์ สร้างแรงบันดาลใจให้ประชาชนทำงานหนักขึ้นและมีประสิทธิภาพมากขึ้น"
 mandala_serenity_aspect_statues_modifier: "$great_project_type_mandala_capital_03_contribution_serenity_aspect$"
 mandala_serenity_aspect_statues_modifier_desc: "เศียรอันเงียบสงบแห่งแง่มุมของความสงบ สร้างแรงบันดาลใจให้ประชาชนยอมรับและส่งเสริมแนวทางแก้ไขอย่างสันติ"
 mandala_destruction_aspect_statues_modifier: "$great_project_type_mandala_capital_03_contribution_destruction_aspect$"
 mandala_destruction_aspect_statues_modifier_desc: "เศียรอันดุร้ายแห่งแง่มุมของการทำลายล้าง สร้างความหวาดกลัวให้กับศัตรูและความมุ่งมั่นให้กับพันธมิตร"
 mandala_trickery_aspect_statues_modifier: "$great_project_type_mandala_capital_03_contribution_trickery_aspect$"
 mandala_trickery_aspect_statues_modifier_desc: "เศียรที่ยิ้มเยาะแห่งแง่มุมของกลอุบาย กระตุ้นความไม่แน่นอนและความอยากรู้อยากเห็นถึงธรรมชาติที่แท้จริงของมัน"
 mandala_gilded_domes_dynasty_modifier: "$great_project_type_mandala_capital_03_contribution_gilded_domes$"
 mandala_gilded_domes_dynasty_modifier_desc: "โดมปิดทองที่สนับสนุนให้กับ $building_type_mandala_capital_01$ เป็นหนึ่งในความสำเร็จสูงสุดของราชวงศ์นี้"
 
 mandala_gilded_shrines_province_modifier: "$great_project_type_mandala_capital_04_contribution_gilded_shrines$"
 mandala_gilded_shrines_province_modifier_desc: "ศาลเจ้าปิดทองในท้องถิ่นมอบความมั่งคั่งและการสะท้อนทางจิตวิญญาณในระดับที่เท่าเทียมกัน"
 mandala_contributor_gilded_shrines_reward_province_effect_tt: "การถือครองของ [province.GetName] ได้รับ [GetModifier('mandala_gilded_shrines_province_modifier').GetNameWithTooltip]"
 mandala_contributor_gilded_shrines_reward_effect_tt: "การถือครองของ [owner.GetCapitalLocation.GetName] ได้รับ [GetModifier('mandala_gilded_shrines_province_modifier').GetNameWithTooltip]"
 mandala_bell_stupas_modifier: "$great_project_type_mandala_capital_04_contribution_bell_stupas$"
 mandala_bell_stupas_modifier_desc: "สถูปรูประฆังของชาวพุทธเหล่านี้เป็นส่วนเสริมอันสูงส่งให้กับบริเวณวัดในท้องถิ่น"
 mandala_bejeweled_domes_dynasty_modifier: "$great_project_type_mandala_capital_04_contribution_bejeweled_domes$"
 mandala_bejeweled_domes_dynasty_modifier_desc: "อัญมณีที่ริบหรี่ภายใต้แสงจันทร์ส่องสว่างท้องฟ้าราวกับดวงดาว — อีกหนึ่งความสำเร็จสำหรับราชวงศ์นี้"

 mandala_divine_barays_defense_modifier: "$great_project_type_mandala_capital_05_contribution_divine_barays$"
 mandala_divine_barays_defense_modifier_desc: "บารายศักดิ์สิทธิ์เหล่านี้ นอกจากจะช่วยในด้านจิตวิญญาณแล้ว ยังช่วยป้องกันคนภายนอกและพวกพ้องของพวกเขาด้วย"
 mandala_forest_of_bunga_mas_modifier: "$great_project_type_mandala_capital_05_contribution_bunga_mas_forest$"
 mandala_forest_of_bunga_mas_modifier_desc: "ป่าทองคำที่น่าประทับใจแห่งนี้บอกเล่าเรื่องราวของราชวงศ์มณฑลอันมีชื่อเสียง"

 mandala_capital_05_unconfirmed_talisman: "เครื่องรางแห่ง [newly_created_talisman.MakeScope.Var('mandala_temple_location').GetProvince.GetBaronyNameExplicitlyNoTooltip]"
 mandala_capital_05_unconfirmed_talisman_desc: "ชิ้นส่วนจากฐานรากของ $building_mandala_capital_05$ ใน [newly_created_talisman.MakeScope.Var('mandala_temple_location').GetProvince.GetName]"
 mandala_capital_05_talisman_base: "ชิ้นส่วนที่หายไปจากภาพนูนต่ำประดับอัญมณีของ $building_mandala_capital_05$ แห่ง [target_talisman.MakeScope.Var('mandala_temple_location').GetProvince.GetName]"
 mandala_capital_05_creation_talisman_desc: "$mandala_capital_05_talisman_base$ อัญมณีที่สะดุดตาแสดงภาพทวยเทพพร้อมดอกไม้ที่เติบโตขึ้นเองที่เท้าของพวกเขา ขณะที่พวกเขาสร้างอาณาจักรและพลเมืองจากพื้นดิน"
 mandala_capital_05_serenity_talisman_desc: "$mandala_capital_05_talisman_base$ อัญมณีเย็นตาเปล่งประกายเงียบสงบ แสดงภาพเรื่องราวของความสงบ การยอมรับ และสันติภาพที่ยั่งยืน"
 mandala_capital_05_destruction_talisman_desc: "$mandala_capital_05_talisman_base$ ประกายสีแดงของอัญมณีกระตุ้นความรู้สึกหวาดกลัวและความเคารพ ขณะที่เฝ้าดูเทพแห่งการทำลายล้างปฏิบัติภารกิจที่น่าสะพรึงกลัว แต่จำเป็น"
 mandala_capital_05_trickery_talisman_desc: "$mandala_capital_05_talisman_base$ อัญมณีที่ละเอียดอ่อนอย่างหลอกลวงบอกเล่าเรื่องราวของนักต้มตุ๋น ที่เกี่ยวข้องกับการเล่นตลกมากมายเพื่อทดสอบมนุษย์"
 artifact_is_related_to_great_project_construction_tt: "[artifact|E] นี้เกี่ยวข้องกับ [great_project|E] ที่อยู่ระหว่างการก่อสร้างและไม่สามารถถูกทำลายได้"
