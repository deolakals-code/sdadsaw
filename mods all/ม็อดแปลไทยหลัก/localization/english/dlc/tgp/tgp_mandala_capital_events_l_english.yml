 tgp_east_asia_mandala_capital_events.1000.t.base: "เมืองหลวง"
 tgp_east_asia_mandala_capital_events.1000.t: "$tgp_east_asia_mandala_capital_events.1000.t.base$: $building_mandala_capital_01$"
 tgp_east_asia_mandala_capital_events.1000.t.second: "$tgp_east_asia_mandala_capital_events.1000.t.base$: $building_mandala_capital_02$"
 tgp_east_asia_mandala_capital_events.1000.t.third:  "$tgp_east_asia_mandala_capital_events.1000.t.base$: $building_mandala_capital_03$"
 tgp_east_asia_mandala_capital_events.1000.t.fourth: "$tgp_east_asia_mandala_capital_events.1000.t.base$: $building_mandala_capital_04$"
 tgp_east_asia_mandala_capital_events.1000.t.final:  "$tgp_east_asia_mandala_capital_events.1000.t.base$: $building_mandala_capital_05$"
 tgp_east_asia_mandala_capital_events.1000.desc: "ขณะที่ข้าทอดเนตรมองออกไปยังวิหาร เหล่าคนงาน บัดนี้เป็นอิสระจากภาระหน้าที่ ต่างก็แยกย้ายกันไป พวกเขาทิ้งไว้ ซึ่งโครงสร้างศิลาอันมั่นคง ที่ผุดขึ้นจากพื้นดิน — ประจักษ์พยานแห่งศรัทธาอันแรงกล้าของเรา \n\nข้าเงยศีรษะขึ้นเล็กน้อยเพื่อมองตามยอดแหลมที่ทอดยาวสู่ท้องฟ้า\n\nอืม ใช่ เช่นนี้ก็ใช้ได้ ข้าจักเป็นเทวราชาผู้รุ่งโรจน์ ปกครองเหนือวิหารแห่งนี้ และพิสูจน์คุณค่าของข้า"
 tgp_east_asia_mandala_capital_events.1000.desc.second: "วิหารได้ขยายออกไป บัดนี้ครอบคลุมศาลเจ้าและเครื่องประดับมากขึ้น — ทั้งหมดสร้างขึ้นอย่างประณีต ทั้งหมดสะท้อนถึงความเคารพยำเกรงต่อ #EMP ข้า#! \n\nเหล่าข้ารับใช้เคลื่อนไหวรอบกายข้าราวกับเงา ขณะที่ข้าเดินไปรอบวิหาร สำรวจทุกซอกทุกมุม พบปะเหล่าผู้ติดตามของข้าไปตลอดทาง ข้ารู้สึกถึงพลังของข้าที่เติบโตขึ้นในทุกศีรษะที่ก้มลงและทุกสายตาที่หลบมองอย่างเคารพ\n\nนี่คือเวลาของ #EMP ข้า#!"
 tgp_east_asia_mandala_capital_events.1000.desc.third: "วิหาร บัดนี้ขยายเป็นอาณาบริเวณที่ใหญ่ขึ้น คึกคักไปด้วยความเคลื่อนไหวทั่วไป บัดนี้มีพื้นที่สำหรับรองรับนักเดินทางไกลหลายสิบคน รวมถึงนักบวชในท้องถิ่น การสักการะรายวันไม่เคยหยุดนิ่ง\n\nเหล่านักเดินทาง — มาที่นี่เพื่อพบข้า เหล่านักบวช — มาที่นี่เพื่อบูชาข้า\n\nฝูงชนต่างขยันขันแข็งแหวกทางให้ข้าผ่าน และข้าหยุดชั่วครู่เพื่อสัมผัสศีรษะที่ก้มลงสองสามหัวตามทางของข้า ผู้คนของข้า ผู้ติดตามของข้า ความเป็นเทวะของข้า"
 tgp_east_asia_mandala_capital_events.1000.desc.fourth: "ขณะที่ดวงตะวันขึ้นเหนือหมู่พระวิหาร สระน้ำสะท้อนแสงสว่างไสวด้วยความงดงามอันศักดิ์สิทธิ์\n\nข้าทอดเนตรทัศนียภาพของวิหาร บัดนี้สมบูรณ์ด้วยแหล่งน้ำกว้างใหญ่และที่ประดิษฐานพระธาตุขนาดเล็ก รวบรวมวัตถุมงคลอันวิจิตรงดงามที่สุด\n\nช้าๆ ข้าพยักหน้า — ใช่ นี่คือที่ที่ข้าถูกกำหนดมาให้อยู่ นี่คือสิ่งที่ข้าถูกกำหนดมาให้ทำ ผู้ติดตามของข้าต้องการข้า ข้าอยู่ที่นี่เพื่อนำทางพวกเขา และเป็นการตอบแทน พวกเขาได้สร้างวิหารอันงดงามตระการตานี้ให้ข้า เราจะบรรลุสิ่งที่ยิ่งใหญ่, #EMP ด้วยกัน#!"
 tgp_east_asia_mandala_capital_events.1000.desc.final: "ในที่สุด ศิลาแผ่นสุดท้ายก็ถูกวางลงในหมู่สิ่งก่อสร้างของข้าใน [project_location.GetNameNoTooltip]\n\nปราสาทราชมณเฑียร รออยู่ ข้าปล่อยให้ตนเองมีช่วงเวลาแห่งความสุขเกษมและความยำเกรงอย่างแท้จริง ขณะที่ข้าทอดเนตรมองออกไปยังยอดแหลมสูงตระหง่าน, ซุ้มประตูโค้ง และ [Glossary( 'บาราย', 'BARAY_GLOSS' )] วิหารแห่งนี้เต็มไปด้วยความงดงามเหนือโลก\n\nรอบกายข้า ผู้คนกำลังโห่ร้องและเต้นรำ เฉลิมฉลองหนึ่งในความสำเร็จที่ยิ่งใหญ่ที่สุดของข้า — ความสำเร็จที่จะเป็นที่จดจำไปอีกนานเท่านาน"
 tgp_east_asia_mandala_capital_events.1000.a: "เทวะที่กำลังถือกำเนิด"
 tgp_east_asia_mandala_capital_events.1000.a.second: "การบรรลุธรรมรออยู่!"
 tgp_east_asia_mandala_capital_events.1000.a.third:  "บัดนี้เรากำลังไปได้สวย..."
 tgp_east_asia_mandala_capital_events.1000.a.fourth: "นี่คือจุดมุ่งหมาย #EMP ที่แท้จริง#! ของข้า"
 tgp_east_asia_mandala_capital_events.1000.a.final:  "ให้เราไปตรวจสอบเครื่องประกอบของ #EMP เทพเจ้า#!"

 tgp_east_asia_mandala_capital_events.1010.t: "รางวัลเมืองหลวง"
 tgp_east_asia_mandala_capital_events.1010.desc: "ทูตของ [ROOT.Char.Custom2('RelationToMe', overlord_scope)] ของข้า, [overlord_scope.GetTitledFirstName], มาหาข้าในยามเช้าตรู่: "[ROOT.Char.Custom('FormOfAddressForLiege')|U]! เมืองหลวงแห่งวิหารอันยิ่งใหญ่ใน [project_location.GetNameNoTooltip] ได้เสร็จสมบูรณ์ในที่สุด!"\n\n "[overlord_scope.GetTitleAsNameNoTooltip] ผู้มีเมตตาของเรา ได้ส่งข้ามาที่นี่เพื่อแสดงความชื่นชมของ [overlord_scope.GetHerHis] สำหรับการสนับสนุนอันมีน้ำใจของท่านต่อการนี้!" ดวงตาของ [envoy.GetWomanMan] เปล่งประกายด้วยศรัทธาอันแรงกล้า เมื่อ [envoy.GetSheHe] เล่าถึงภาพของยอดแหลมสูงตระหง่าน, ซุ้มประตูโค้ง และ [Glossary( 'บาราย', 'BARAY_GLOSS' )] ที่ประทานความงดงามเหนือโลกแก่วิหาร\n\nข้าฮัมและพยักหน้า, พอใจกับการสนับสนุนของข้าต่อภารกิจนี้..."
 tgp_east_asia_mandala_capital_events.1010.a: "ฝากความเคารพของข้าไปด้วย"

