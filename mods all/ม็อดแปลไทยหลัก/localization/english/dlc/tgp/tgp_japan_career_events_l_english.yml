l_english: 
 ##################################################
 # JAPAN CAREER EVENTS
 ##################################################
 tgp_japan_career.0001.t: "ตำนานแห่ง [new_ruler.GetDynastyNameNoTooltip]"
 tgp_japan_career.0001.desc: "[kampaku.GetPrimaryTitle.GetDefinitiveName|U] นั้นเต็มไปด้วย [blocs|E] ที่ต่างแย่งชิงการควบคุมและอำนาจ"
 tgp_japan_career.0001.soryo_desc: "ในฐานะผู้ปกครองแบบ [new_ruler.GetGovernment.GetName] ตระกูลของข้าได้ปราบปรามหัวเมืองและระงับเหตุจลาจล! พวกเราสมควรได้รับอิสระในการปกครองตนเองและอำนาจส่วนตัวในระดับหนึ่ง ซึ่งพวก [ritsuryo|E] อ่อนแอที่เอา แต่ทำงานเอกสารในเมืองหลวง [kampaku.GetCapitalLocation.GetTitle.GetNameNoTier|U] นั้นไม่ได้รับ\n\nข้าต้องขยายกองทัพ ป้องกันเล็นของข้า และแผ่ขยายอาณาเขตของเรา มันตกเป็นหน้าที่ของข้าที่จะฟื้นฟูระเบียบแก่ [kampaku.GetPrimaryTitle.GetNameNoTier] และนำเกียรติภูมิมาสู่ [house|E] ของข้า — [new_ruler.GetHouse.GetName]!"
 tgp_japan_career.0001.ritsuryo_desc: "ในฐานะผู้ปกครองแบบ [new_ruler.GetGovernment.GetName] หน้าที่ของข้าในฐานะขุนนางนั้นอยู่ในเมืองหลวง [kampaku.GetCapitalLocation.GetTitle.GetNameNoTier|U] ศูนย์กลางแห่งอำนาจและวัฒนธรรมนี้เป็นพื้นที่อันอุดมสมบูรณ์สำหรับการขยายอิทธิพลของตระกูลข้า ไม่ว่าจะเป็นผ่านการกระทำอันเป็นแบบอย่างหรือผ่านศิลปะการปกครองอันชาญฉลาด\n\nประเพณีอันสง่างามเหล่านี้กำลังถูกบ่อนทำลายโดยพวกนักรบ [soryo|E] จากหัวเมืองที่ตั้งตัวเป็นใหญ่ ผู้แสวงหาการรวบอำนาจและขยายเล็นส่วนตัวของพวกมัน"
 tgp_japan_career.0001.kampaku_desc: "ในฐานะ [new_ruler.GetTitleAsNameNoTooltip|U] ข้าแบกรับความรับผิดชอบสูงสุดต่อจักรวรรดิในบทบาท [ceremonial_regent|E] ของข้า จากเมืองหลวง [kampaku.GetCapitalLocation.GetTitle.GetNameNoTier|U] ข้าเป็นผู้นำเหล่าอาณาราษฎรของ [japanese_emperor_possessive|E] และพากเพียรที่จะรักษาสันติภาพอันเปราะบางไว้\n\nข้าต้องประคับประคองการเมืองเชิงอำนาจในราชสำนักอันร้อนระอุที่เต็มไปด้วยเหล่าขุนนาง [ritsuryo|E] เจ้าเล่ห์ รวมถึงความกังวลที่เพิ่มมากขึ้นเกี่ยวกับเหล่านักรบ [soryo|E] ที่กำลังตั้งเล็นส่วนตัวขึ้นในหัวเมือง"
 tgp_japan_career.0001.tenno_desc: "ในฐานะ [japanese_emperor|E] หน้าที่ของข้าเกี่ยวข้องกับเรื่องสวรรค์และพิธีการ [kampaku.GetTitleAsName|U] จัดการเรื่องทางโลกทั้งปวง แต่เขาควรทำ เช่นนั้นหรือ? มีความตึงเครียดในดินแดนขณะที่เหล่า [rulers|E] [soryo|E] กำลังตั้งเล็นส่วนตัวขึ้นในหัวเมือง ท้าทายเหล่าขุนนาง [ritsuryo|E] ดั้งเดิมในเมืองหลวงของข้า [kampaku.GetCapitalLocation.GetTitle.GetNameNoTier|U]\n\nเหล่าผู้ก่อการเปลี่ยนแปลงเหล่านี้จะช่วยให้เรากลับสู่ยุคแห่งการปกครองโดยจักรพรรดิอย่างแท้จริง โดยมี [new_ruler.GetTitleAsName|U] ดูแลทั้งเรื่องสวรรค์และทางโลกได้หรือไม่?"
 tgp_japan_career.0001.desc_2: "\n\nเราทุกคนต่างมีบทบาทที่ต้องแสดง และเราก็จะแสดงมัน!"
 tgp_japan_career.0001.a: "ไม่ว่าจะเกิดสิ่งใดขึ้น เราจะยืนหยัดอย่างมั่นคง"
 tgp_japan_career.0001.b: "สันติภาพนั้นไม่จีรัง เราต้องเตรียมพร้อม!"
 tgp_japan_peace_modifier: "มุ่งมั่นเพื่อความมั่นคง"
 tgp_japan_peace_modifier_desc: "ตัวละครนี้กำลังจดจ่อกับการเผชิญหน้าอุปสรรคใด ๆ ด้วยจิตใจที่แจ่มใสและสงบ"
 tgp_japan_war_modifier: "เตรียมพร้อมสำหรับความขัดแย้ง"
 tgp_japan_war_modifier_desc: "ตัวละครนี้เชื่อมั่นว่าสงครามกำลังจะมาถึง และพวกเขาจะเตรียมพร้อมสำหรับมัน"
 
