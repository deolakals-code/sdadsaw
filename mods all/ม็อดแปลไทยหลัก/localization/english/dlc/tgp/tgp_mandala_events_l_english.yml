 tgp_east_asia_mandala_events.9000.t: "การแทรกแซงจากสวรรค์"
 tgp_east_asia_mandala_events.9000.desc.lightning_strike: "#EMP เปรี้ยงงงง#! — แสงวาบของสายฟ้านั้นมาจากไหนไม่รู้ ข้ารู้สึกตัวอีกทีก็อยู่บนพื้น มึนงง แต่ส่วนใหญ่ไม่ได้รับบาดเจ็บ\n\nรอบตัวข้า ฝูงชนเริ่มรวมตัวกันเป็นครึ่งวงกลมเล็กๆ [ROOT.Char.GetWomanMan] ผู้หนึ่งประกาศว่าข้าได้รับการทดสอบจากสวรรค์ อีกคนหนึ่งยืนกรานว่าบัดนี้ข้า #EMP เปี่ยมล้น#! ไปด้วยแก่นแท้ของ [ROOT.Char.GetCurrentLocation.GetCounty.GetFaith.HighGodName]"
 tgp_east_asia_mandala_events.9000.outro.diff_faith.lightning_strike: "\n\n[bystander.GetWomanMan] ที่ยืนเงียบๆ อยู่ด้านข้างมองข้าอย่างสงบและเสนอว่า: \"เช่นนั้น [bystander.GetFaith.HighGodName] ก็ได้จุติลงมาในชั่วชีวิตของเราสินะ...\""
 tgp_east_asia_mandala_events.9000.outro.lightning_strike: "\n\n[bystander.GetWomanMan] ที่ยืนสงบอยู่ด้านข้างมองข้าอย่างสงบและเสนอว่า: \"เช่นนั้น [ROOT.Char.GetFaith.HighGodName] ก็ได้จุติลงมาในชั่วชีวิตของเราสินะ...\""
 tgp_east_asia_mandala_events.9000.desc.scar: "\"[ROOT.Char.GetFirstNameNoTooltip]!\", [ROOT.Char.Custom2('RelationToMe', bystander)] ของข้า [bystander.GetTitledFirstName] เอ่ยขึ้น, ใบหน้าแดงก่ำอย่างเห็นได้ชัด \"แผลเป็นนั่น! บนไหล่ของท่าน! มัน... มันเป็น เช่นนั้นมาตลอดหรือ...\" [bystander.GetSheHe] หยุดไปครู่หนึ่ง, งุนงงอย่างเห็นได้ชัด, \"มันดูเหมือนใบหน้าของ [bystander.GetFaith.HighGodName]!\"\n\nข้ากะพริบตาสองสามครั้งขณะที่ [bystander.GetSheHe] ครุ่นคิดถึงสถานการณ์ จากนั้น [bystander.GetSheHe] ก็อุทานออกมาด้วยน้ำเสียงหนักแน่นน่าประหลาดใจ: \"ชัดเจนว่าท่านได้รับพร, [bystander.Custom2('RelationToMe', ROOT.Char )] ของข้า! ท่านถูกหมายไว้ให้ข้ามพ้นโลกนี้!\"\n\nบัดนี้เหล่าคนรับใช้และสามัญชนในบริเวณใกล้เคียงต่างสังเกตเห็นความชุลมุน จ้องมองข้าขึ้นลงและพึมพำเห็นด้วย \"#EMP ดูนั่นสิ...#!\""
 tgp_east_asia_mandala_events.9000.a: ""ข้า #EMP รู้สึก#! มาตลอดว่าตนเองแตกต่างเล็กน้อย...""
 tgp_east_asia_mandala_events.9000.a.diff_faith: ""[bystander.GetFaith.HighGodName] งั้นหรือ? นี่หมายความว่ากระไร?""
