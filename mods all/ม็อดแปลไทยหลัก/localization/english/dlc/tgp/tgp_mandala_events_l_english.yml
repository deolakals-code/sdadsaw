 tgp_east_asia_mandala_events.8550.t: "$mandala_succession_header$ หนทางเบื้องหน้า"
 tgp_east_asia_mandala_events.8550.t.failed: "$mandala_succession_header$ ไร้หนทางเบื้องหน้า"
 tgp_east_asia_mandala_events.8550.desc.critical_success: "เสียงไชโยโห่ร้องดังไปทั่วทุกหนแห่ง ฝูงชนปลาบปลื้มยินดี และความโล่งใจที่เทพองค์ใหม่ของพวกเขาสมภาคภูมิกับความเป็นเทวะของ [deceased_mandala_ruler.GetFirstNamePossessive] บรรพชน [ROOT.Char.GetHerHis] นั้นชัดเจนยิ่งนัก\n\nดอกไม้ถูกโยนมาทางข้า ผู้คนร้องเพลง บ้างก็ปรบมือหรือกระทืบเท้าด้วยความลิงโลด งานเลี้ยงเล็กๆ ถูกจัดขึ้นอย่างกะทันหัน และเหล่าผู้ติดตามยังคงเปล่งชื่อข้าและดื่มอวยพรไปจนดึกดื่น\n\nข้าทำได้ดี และหนทางเบื้องหน้าก็สว่างสดใส ข้าอนุญาตให้ตนเองยิ้มอย่างเงียบๆ"
 tgp_east_asia_mandala_events.8550.desc.success: "เสียงกระซิบเงียบๆ ดังไปทั่วห้อง ก่อนจะกลายเป็นเสียงพึมพำ และตามด้วยเสียงโห่ร้องเป็นครั้งคราวที่เปลี่ยนเป็นเสียงเชียร์อย่างสุดหัวใจเมื่อข้าได้พิสูจน์ตนเองว่าเป็นเทพองค์ใหม่\n\nแม้ว่าข้าจะยังไม่สมบูรณ์พร้อมเท่าระดับความเป็นเทวะของ [deceased_mandala_ruler.GetFirstNamePossessive] [ROOT.Char.Custom2('RelationToMe', deceased_mandala_ruler )] ของข้า ข้าก็ได้แสดงให้ผู้ติดตามเห็นแล้วว่าข้ารู้วิธีที่จะช่วยเราให้พ้นจากสถานการณ์ลำบากที่อยู่นอกเหนือการควบคุมของข้าได้\n\nยังมีศักยภาพที่จะเติบโตได้อีกมาก และข้าก็ตั้งตารอที่จะพิสูจน์ตนเอง"
 tgp_east_asia_mandala_events.8550.desc: "ห้องโถงระเบิดไปด้วยเสียงซุบซิบในหมู่คนรับใช้ เหล่าข้าราชบริพารที่ข้าเคยคิดว่าเป็นสหายและข้าหลวงผู้ภักดี บัดนี้สายตาของพวกเขาจับจ้องมาที่ข้าอย่างเคลือบแคลงสงสัย เมื่อข้าถูกพิสูจน์แล้วว่า #EMP ไม่#! ได้เป็นดั่งเทพเทวา เช่น [ROOT.Char.Custom2('RelationToMe', deceased_mandala_ruler )] ของข้า [deceased_mandala_ruler.GetFirstName]\n\nข้าก้มหน้าลงเล็กน้อย วิตกกังวลชั่วขณะถึงสิ่งที่จะเกิดขึ้น จากนั้นข้าก็ตระหนักได้ว่าท่าทีนั้นอาจถูกมอง เช่นไร ข้าจึงยืดตัวตรง สบตาทุกกลุ่มที่กำลังซุบซิบในห้องอย่างท้าทาย\n\nยังมีศรัทธาอีกมากที่ต้องเรียกคืน และหนทางเบื้องหน้าคงจะ #EMP ขรุขระ#! ไม่น้อย"
 tgp_east_asia_mandala_events.8550.desc.failed: "เข่าของข้าสั่นเทาและศีรษะหมุนเล็กน้อยเมื่อข้าตระหนักถึงสิ่งที่กำลังจะเกิดขึ้น ข้า ทำให้ [deceased_mandala_ruler.GetFirstName] ผิดหวัง และข้าก็ ทำให้อาณาจักรผิดหวัง\n\nข้าไม่คู่ควรที่จะเป็นผู้สืบทอด [ROOT.Char.GetPrimaryTitle.GetName] ไม่มีสิ่งใดให้ต่อยอดอีกแล้ว\n\nในชั่วขณะที่ความคิดแจ่มชัด ข้ามองไปรอบๆ และสังเกตเห็นว่าทุกคนจากไปแล้ว หรือกำลังทยอยจากไป — พวกเขาหันหลังให้ มีเพียงเสียงพึมพำและเสียงครางอย่างผิดหวัง ข้าทรุดเข่าลง ปล่อยให้ภาระหนักอึ้งของโลกฉุดรั้งข้าลงชั่วขณะ"
 tgp_east_asia_mandala_events.8550.a: "ข้าพร้อมแล้ว"
 tgp_east_asia_mandala_events.8550.a.failed: "มันไม่ควรจะเป็น เช่นนี้!"
