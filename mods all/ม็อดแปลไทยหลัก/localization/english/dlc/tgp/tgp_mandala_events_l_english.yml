l_english: 
 aspect_upgrade_event_header: "แง่มุมแห่ง [ROOT.Char.Custom('GetAspectNoun')|U]:"
 tgp_east_asia_mandala_events.1000.t: "$aspect_upgrade_event_header$ การขึ้นสู่"
 tgp_east_asia_mandala_events.1000.t.final: "$aspect_upgrade_event_header$ การข้ามพ้น"
 tgp_east_asia_mandala_events.1000.desc.02: "ท่ามกลางความปิติยินดี การร่ายรำ และพิธีกรรมแห่ง [ROOT.Char.Custom('GetAspectNoun')] อย่างล้นหลาม ข้าได้นำความภาคภูมิใจมาสู่ตระกูล [ROOT.Char.GetHouse.GetBaseName] ด้วยการขึ้นสู่ขั้นถัดไปของแง่มุมแห่ง [ROOT.Char.Custom('GetAspectNoun')]\n\nเสียงกึกก้องของ #EMP พลัง#! ของเราและการกระทำดั่งเทพเจ้าดึงดูดผู้ติดตามมากขึ้นใน แต่ละวันที่ผ่านไป\n\nข้าปล่อยให้ตัวเองดื่มด่ำกับสิ่งนี้ชั่วครู่ เฝ้าดูภาพการเฉลิมฉลองของผู้คนตรงหน้าข้า"
 tgp_east_asia_mandala_events.1000.desc.03.outro: "ข้าเอนตัวไปข้างหลังและเฝ้าดูการบูชายัญอันเป็นสัญลักษณ์และนักเต้นรำร่ายรำเพื่อเป็นเกียรติแก่ข้า #EMP พลังของเราเติบโตขึ้น#!"
 tgp_east_asia_mandala_events.1000.desc.creation_03: "งานเลี้ยงเพื่อเป็นเกียรติแก่แง่มุมแห่งการสร้างสรรค์ — ภาพอันน่ารื่นรมย์ของสีสัน การเต้นรำ และดนตรี — ถูกจัดขึ้นเพื่อเฉลิมฉลองการขึ้นสู่ขั้นกลางของการสร้างสรรค์ของตระกูล [ROOT.Char.GetHouse.GetBaseName]\n\nพิสูจน์ความเป็นเทพของเรา การกระทำครั้งแล้วครั้งเล่า เรากำลังรวบรวมผู้ติดตามจำนวนมาก\n\nขอแก้ไข — #EMP ข้า#! ต่างหากที่กำลังรวบรวมผู้ติดตามจำนวนมาก และพวกเขาเชื่อในตัว #EMP ข้า#!"
 tgp_east_asia_mandala_events.1000.desc.creation_04: "งานเลี้ยงที่เอิกเกริก — จะมีวิธีอื่นใดอีกเล่าที่จะเฉลิมฉลองแง่มุมแห่งการสร้างสรรค์ที่เกือบจะไร้ที่ติ? นักเต้นรำ พิธีกรรม ภาพวับๆ แวมๆ เฉลิมฉลองการสร้างสรรค์และการขึ้นสู่เบื้องบนของตระกูล [ROOT.Char.GetHouse.GetBaseName]\n\nผู้ศรัทธาจำนวนมหาศาลของเราช่วยตอกย้ำให้เราเป็นกองกำลังที่ไม่มีใครหยุดยั้งได้ ประกาศศักดาในโลกหล้า\n\nข้าคว้า [ROOT.Char.Custom('GetAspectNoun')] รสเลิศจากโต๊ะใกล้ๆ และกัดกินอย่างเอร็ดอร่อยขณะเพลิดเพลินกับภาพตรงหน้า"
 tgp_east_asia_mandala_events.1000.desc.05.intro: "ในที่สุด การเดินทางของตระกูล [ROOT.Char.GetHouse.GetBaseName] และลูกหลานแห่งสวรรค์ก็เสร็จสมบูรณ์"
 tgp_east_asia_mandala_events.1000.desc.creation_05: "$tgp_east_asia_mandala_events.1000.desc.05.intro$\n\nบัดนี้ไม่มีข้อกังขาใดในใจใครอีกแล้วว่าพี่น้องแห่ง [ROOT.Char.GetHouse.GetBaseNameNoTooltip] มีร่องรอยและองค์ประกอบของแง่มุมแห่งการสร้างสรรค์ นำการกระทำของผู้สร้างมาสู่โลก\n\nโดยมี #EMP ข้า#! เป็นศูนย์รวมของ [ROOT.Char.GetHerHis|U] แน่นอน\n\nข้าดื่ม [ROOT.Char.Custom('RegionalDrink')] อีกจอก เป็นสัญญาณการเริ่มต้นของการเฉลิมฉลองนานหลายสัปดาห์"
 tgp_east_asia_mandala_events.1000.desc.serenity_03: "งานเฉลิมฉลองที่จัดขึ้นด้วยความใส่ใจสูงสุด ตระกูล [ROOT.Char.GetHouse.GetBaseName] ที่กำลังขึ้นสู่ขั้นกลางของแง่มุมแห่งความสงบนั้นไม่มีการประหยัดค่าใช้จ่ายใดๆ\n\nผู้ติดตามวิถีอันเงียบสงบของเราเติบโตขึ้นเรื่อยๆ เมื่อผู้คนเริ่มเห็นประโยชน์ของวิถีของเรา\n\nข้าชื่นชมโอกาสที่จะ ทำให้โลกนี้เป็นสถานที่ที่ดีกว่า สถานที่ที่เงียบสงบยิ่งขึ้น"
 tgp_east_asia_mandala_events.1000.desc.serenity_04: "งานเฉลิมฉลองอันงดงามเริ่มต้นด้วยการนั่งสมาธิร่วมกัน — ศีรษะมากมายที่ก้มลงอย่างสงบ ทำให้หัวใจของข้าพองโต ช่างเป็นวิธีที่ดีเลิศในการให้เกียรติตระกูล [ROOT.Char.GetHouse.GetBaseName] ที่กำลังอยู่บนขอบของแง่มุมแห่งความสงบที่ไร้ที่ติ\n\nผู้ศรัทธาจำนวนมหาศาลนี้บ่งบอกถึงที่ยืนของเราในโลกนี้ ความกระหายในความสงบและความเงียบ ในการยอมรับและความเห็นพ้อง\n\nข้าก้มหัวลงสวดมนต์เงียบๆ และทำสมาธิอีกครั้ง พิจารณาถึงสิ่งนี้"
 tgp_east_asia_mandala_events.1000.desc.serenity_05: "$tgp_east_asia_mandala_events.1000.desc.05.intro$\n\nศัตรูกลายเป็นมิตร ความสงบและความรุ่งเรืองแผ่ซ่านไปทั่วอาณาจักร ภูมิปัญญาและความเงียบสงบที่ปลูกฝังโดยพี่น้องแห่งตระกูล [ROOT.Char.GetHouse.GetBaseNameNoTooltip] ได้ทิ้งร่องรอยที่ยั่งยืนไว้ใน [ROOT.Char.GetPrimaryTitle.GetBaseName]\n\nการเฉลิมฉลองที่เงียบสงบอย่างแท้จริง สำหรับศูนย์รวมแห่งแง่มุมแห่งความสงบที่แท้จริง\n\nข้าก้มหัวลงอย่างเมตตาตอบรับคำสวดมนต์และคำอวยพรอันงดงามของพวกเขา"
 tgp_east_asia_mandala_events.1000.desc.destruction_03: "เสียงดังกึกก้องเมื่อทหารเคาะอาวุธกับโล่ เรียกร้องความสนใจต่อการขึ้นสู่ขั้นกลางของแง่มุมแห่งการทำลายล้างของตระกูล [ROOT.Char.GetHouse.GetBaseName]\n\nข่าวตำนานของเราแพร่สะพัดไปอย่างรวดเร็วและจำนวนผู้ติดตามของเราก็ยิ่งใหญ่กว่าที่เคย\n\n$tgp_east_asia_mandala_events.1000.desc.03.outro$"
 tgp_east_asia_mandala_events.1000.desc.destruction_04: "#EMP ตึง! ตึง!#! ไม่ได้ยินเสียงใดนอกจากเสียงย่ำเท้าอันกึกก้องของทหาร [ROOT.Char.GetPrimaryTitle.GetBaseName] ขณะที่พวกเขาประกอบพิธีกรรมเฉลิมฉลอง เลียนแบบการร่ายรำแห่งการทำลายล้าง บัดนี้ที่ตระกูล [ROOT.Char.GetHouse.GetBaseName] เข้าใกล้การข้ามพ้นที่สมบูรณ์แล้ว\n\nผู้ติดตามของเรากระตือรือล้นที่จะเข้าร่วมอุดมการณ์ของเราและรับใช้ภายใต้งแง่มุมแห่งการทำลายล้างที่แท้จริง\n\nข้ายิ้มเยาะและลูบคมดาบด้วยหินลับมีดอย่างระมัดระวังขณะเฝ้าดูพิธี\n\n#EMP ตึง! ตึง!#!"
 tgp_east_asia_mandala_events.1000.desc.destruction_05: "$tgp_east_asia_mandala_events.1000.desc.05.intro$\n\nแผ่นดินดูเหมือนจะสั่นสะเทือนขณะที่ทหารผู้สาบานตนของ [ROOT.Char.GetPrimaryTitle.GetBaseName] ย่ำเท้า สวดมนต์ และทำพิธีกรรมอันน่าเกรงขาม เพื่อรับใช้พี่น้องแห่ง [ROOT.Char.GetHouse.GetBaseNameNoTooltip]\n\nพวกเขาคุกเข่าต่อหน้าข้า พระเจ้าของพวกเขาชั่วครู่ ก่อนจะดำเนินพิธีต่อไป\n\nข้าลูบหัวกะโหลกที่ได้รับเป็นของขวัญในพิธีกรรมหนึ่งอย่างเหม่อลอย ขณะเอนหลังพิงบัลลังก์"
 tgp_east_asia_mandala_events.1000.desc.trickery_03: "ข้าได้สานต่อตำนานแห่งเทพเจ้าจอมเจ้าเล่ห์ของตระกูล [ROOT.Char.GetHouse.GetBaseName] ได้สำเร็จ และพิธีกรรมเฉลิมฉลองก็สนุกสนานสมกัน\n\nทีละคน ศัตรูของตระกูล [ROOT.Char.GetHouse.GetBaseNameNoTooltip] ล้มหายตายจากไปอย่างลึกลับหรือเข้าร่วมเป็นผู้ติดตามของเรา\n\n$tgp_east_asia_mandala_events.1000.desc.03.outro$"
 tgp_east_asia_mandala_events.1000.desc.trickery_04: "เครื่องเซ่นไหว้ มากมายเหลือเกินเพื่อเอาใจตระกูล [ROOT.Char.GetHouse.GetBaseName] ที่กำลังยืนอยู่บนปากเหวของการเป็นแง่มุมแห่งเล่ห์กลที่ไร้ที่ติ\n\nทองคำ ขนสัตว์ เครื่องเทศ เปลือกหอย สัตว์หายาก ผู้ติดตามของเรารู้วิธีเอาใจเรา หรือพวกเขารู้กันนะ?\n\nเรื่องนี้ขึ้นอยู่กับ #EMP ข้า#! ที่จะตัดสินใจ ทอดเงาแห่งความมืดมิดเหนือใครก็ตามที่ขัดขวางข้า\n\nข้าหัวเราะในลำคอเบาๆ"
 tgp_east_asia_mandala_events.1000.desc.trickery_05: "$tgp_east_asia_mandala_events.1000.desc.05.intro$\n\nทุกอย่างดูรื่นเริงและปกติดีบนพื้นผิว แต่พวกเขาทุกคนรู้ว่าการก้าวพลาดหรือความผิดพลาดทางศีลธรรมเพียงเล็กน้อยอาจ ส่งผลให้เทพเจ้าแห่ง [ROOT.Char.GetHouse.GetBaseNameNoTooltip] ผู้คาดเดาไม่ได้มาเยือน\n\nพวกเขาล้วนกระเสือกกระสนที่จะรักษาความโปรดปรานจากสวรรค์และอยู่ในร่องในรอย ร่องรอยของ #EMP ข้า#!\n\nข้ามองออกไปที่ฝูงชน ครุ่นคิดอย่างมีเลศนัยว่าใครรายต่อไปที่คู่ควรแก่ความสนใจของข้า"
 tgp_east_asia_mandala_events.1000.a: "ทุกอย่างเป็นไปตามที่ควรจะเป็น"

 mandala_descendant_from_aspect_of_creation.tt: "[children|E] ของท่านทุกคน"
 mandala_descendant_from_aspect_of_creation_modifier: "ลูกหลานแห่งการสร้างสรรค์"
 mandala_descendant_from_aspect_of_creation_modifier_desc: "ตัวละครนี้เป็นบุตรของแง่มุมแห่งการสร้างสรรค์ที่บรรลุผลแล้ว"

 mandala_aspect_of_serenity_devotion.tt: "ได้รับ [piety_experience|E] #P [EmptyScope.ScriptValue('num_years_of_peace_devotion')]#! ต่อปีที่ไม่มี [war|E] รุกราน #WEAK (ปัจจุบัน [piety_experience|E] #P [THIS.Char.MakeScope.ScriptValue('num_years_of_peace_devotion_payout')]#!)#!"

 mandala_forged_from_aspect_of_destruction.tt: "[THIS.Char.Custom('KnightCulturePlural')] ของท่านทุกคน"
 mandala_forged_from_aspect_of_destruction_modifier: "หล่อหลอมจากการทำลายล้าง"
 mandala_forged_from_aspect_of_destruction_modifier_desc: "ตัวละครนี้ได้รับใช้เป็นอัศวินภายใต้แง่มุมแห่งการทำลายล้างที่บรรลุผลแล้ว"

 mandala_aspect_of_trickery_devotion.tt: "ได้รับ [piety_experience|E] #P [EmptyScope.ScriptValue('num_years_of_peace_devotion')]#! ต่อ [scheme|E] ที่สำเร็จจนถึงจุดนี้ #WEAK (ปัจจุบัน [piety_experience|E] #P [THIS.Char.MakeScope.ScriptValue('num_successful_schemes_devotion_payout')]#!)#!"
 mandala_ascended_in_aspect_of_trickery_modifier: "จอมเจ้าเล่ห์ผู้บรรลุผล"
 mandala_ascended_in_aspect_of_trickery_modifier_desc: "ตัวละครนี้ได้ขึ้นสู่การเป็นแง่มุมแห่งเล่ห์กล"


 busy_in_mandala_succession: "ท่านกำลังยุ่งอยู่ในการสืบทอด [mandala|E]"
 mandala_succession_header: "การสืบทอดมณฑล:"

 tgp_east_asia_mandala_events.8497.t.lose_by_default: "บททดสอบการสืบทอดมณฑลมิอาจดำเนินการต่อได้"
 tgp_east_asia_mandala_events.8497.tt.lose_by_default: "$tgp_east_asia_mandala_events.8499.a.tt.imprisoned$"

 tgp_east_asia_mandala_events.8499.t: "$mandala_succession_header$ บททดสอบ"
 tgp_east_asia_mandala_events.8499.intro.imprisoned: "ข่าวมาถึงข้า ผู้อยู่ลึกในคุกใต้ดินของ [ROOT.Char.GetImprisonedBy.GetTitledFirstName] [ROOT.Char.Custom2('RelationToMe', deceased_mandala_ruler )] ของข้า [deceased_mandala_ruler.GetFirstName] ได้ละโลกนี้ไปแล้ว ทิ้งให้ข้าต้องเป็นผู้นำอาณาจักร"
 tgp_east_asia_mandala_events.8499.intro.recent_adult.imprisoned: "ในที่สุดข้าก็ย่างเข้าสู่วัยผู้ใหญ่ ถึงเวลาที่ข้าจะได้เข้าร่วมบททดสอบเสียที และแสดงให้อาณาจักรได้เห็นว่าข้าคู่ควรเพียงใดที่จะสืบทอดต่อจาก [ROOT.Char.Custom2('RelationToMe', deceased_mandala_ruler )] ของข้า [deceased_mandala_ruler.GetFirstName]"
 tgp_east_asia_mandala_events.8499.desc.imprisoned: "\n\nแต่ข้าจะทำ เช่นนั้นได้อย่างไรในเมื่อข้านั่งอยู่ที่นี่ ในคุกแห่งนี้ ผู้ ซึ่ง #EMP แทบจะเป็นดั่งเทพเทวา#!? เปรอะเปื้อนด้วยสิ่งปฏิกูล ถูกปฏิบัติราวกับสัตว์เดรัจฉาน\n\nข้าขอสาบานว่าข้าจะล้างแค้นเมื่อข้าออกไปจากที่นี่ได้ ข้าจะ #EMP ให้การแก้แค้นของข้าถาโถมใส่เหล่าศัตรู#!."
 tgp_east_asia_mandala_events.8499.desc.recent_adult: "ถึงเวลาแล้ว! ในที่สุดก็ถึงเวลาที่ข้าจะสืบทอดต่อจาก [ROOT.Char.Custom2('RelationToMe', deceased_mandala_ruler )] ของข้า [deceased_mandala_ruler.GetFirstName] โดยการเข้าร่วมบททดสอบ\n\nการแสดงความเป็นเลิศของข้าใน แต่ละด้าน ผลงานและการยอมรับที่ข้าได้รับ จะเป็นตัวกำหนดว่าเหล่าผู้ติดตามจะมีความศรัทธาในตัวข้ามากเพียงใดในฐานะตัวแทนแห่ง [ROOT.Char.Custom('GetAspectNoun')] ต่อไป\n\nข้า #EMP จะต้อง#! สืบทอดต่อจาก [ROOT.Char.Custom2('RelationToMe', deceased_mandala_ruler )] ของข้าให้ได้!"
 tgp_east_asia_mandala_events.8499.desc.was_traveling: "แทบจะทันทีที่ฝุ่นจางหาย ข้าก็ถูกนำตัวเข้าไปยังห้องโถง มีการเตรียมน้ำอาบ ฉลององค์ถูกเปลี่ยนเป็นชุดที่เหมาะสมกับ [ROOT.Char.GetTitleAsNameNoTooltip]\n\nข้ารู้สึกขนลุกจากทั้งการปฏิบัติที่กระทันหันและอากาศที่เย็นเยียบฉับพลัน ข้าเตรียมใจให้พร้อมสำหรับบททดสอบที่รออยู่\n\nโอกาสของข้าที่จะแสดงตนว่าเป็นผู้สืบทอดที่คู่ควรของ [ROOT.Char.Custom2('RelationToMe', deceased_mandala_ruler )] ของข้า และเป็นร่างประทับแห่ง [ROOT.Char.Custom('GetAspectNoun')] มันถึงเวลาแล้ว"
 tgp_east_asia_mandala_events.8499.desc: "[ROOT.Char.Custom2('RelationToMe', deceased_mandala_ruler )] ของข้า [deceased_mandala_ruler.GetFirstName] สิ้นแล้ว [deceased_mandala_ruler.GetSheHe|U] ได้เสด็จขึ้นสู่ภพภูมิที่สูงกว่า ทิ้งให้เป็นหน้าที่ของข้าที่จะก้าวขึ้นมา รับพลังแห่ง [ROOT.Char.Custom('GetAspectNoun')] และนำพาอาณาจักรของเราไปจารึกไว้ในหน้าประวัติศาสตร์\n\nข้าจะเข้ารับบททดสอบ แสดงให้เห็นว่าข้ามีความเป็นเทพเทวาและอยู่ทุกหนแห่งเพียงใดโดยการทำได้ยอดเยี่ยมในทุกๆ ด้าน\n\n... ความเย็นเยียบแล่นวาบไปทั่วสันหลัง เมื่อข้าครุ่นคิดถึงทางเลือกอื่นชั่วขณะ"
 tgp_east_asia_mandala_events.8499.a: "ข้าพร้อมที่สุดแล้ว"
 tgp_east_asia_mandala_events.8499.a.imprisoned: "ข้าขอสาบาน"
 tgp_east_asia_mandala_events.8499.a.flavor.imprisoned: "มันไม่ควรจะเป็น เช่นนี้..."
 tgp_east_asia_mandala_events.8499.a.tt.imprisoned: "ท่านล้มเหลวในบททดสอบ [mandala_succession_succession|E] เนื่องจากไม่ปรากฏตัว"
 tgp_east_asia_mandala_events.8499.a.tt.trials: "บททดสอบ [mandala_succession_succession|E] แรกได้เริ่มขึ้นแล้ว"

 mandala_divine_retribution_modifier: "ทัณฑ์สวรรค์"
 mandala_divine_retribution_modifier_desc: "ตัวละครนี้กำลังอุทิศชีวิตของตนเพื่อเอาชนะศัตรู"

 tgp_east_asia_mandala_events.8500.t: "$mandala_succession_header$ การเสียเศียร"
 tgp_east_asia_mandala_events.8500.desc: "เรากำลังอยู่ท่ามกลางพิธีกรรมแห่งการสร้างสรรค์ เพื่อเฉลิมฉลองการขึ้นครองบัลลังก์ของข้า ข้าปะปนอยู่กับฝูงชน ยิ้มอย่างเมตตาให้กับเหล่าผู้ติดตามขณะที่พวกเขาก้าวออกมาพร้อมเครื่องบรรณาการ\n\nเด็กน้อยคนหนึ่งโผล่ออกมาจากฝูงชน ใช้แขน [dummy_gender.GetHerHis] โอบรอบเอวข้าอย่างไม่ประสีประสา จากนั้น [dummy_gender.Custom('GirlBoy')] ก็เงยหน้ามองข้าและถามว่า: \"[ROOT.Char.GetTitleAsNameNoTooltip|U]... #EMP เกิดอะไรขึ้น#! กับเศียรที่ห้าของท่านหรือ?\"\n\nผู้ดูแล [dummy_gender.GetHerHis|U] ดูตกตะลึงกับความไร้มารยาทนั้น แต่ข้าสังเกตเห็นทุกคนในห้องโถงต่างหูผึ่ง รอคอยคำตอบจากข้าอย่างใจจดใจจ่อ"
 tgp_east_asia_mandala_events.8500.dynasty.override: ""ครูของเจ้าควรจะบอกเจ้าได้นะ""
 tgp_east_asia_mandala_events.8500.a: ""บาปของข้าและความริษยาของผู้อื่น... เด็กน้อย""
 tgp_east_asia_mandala_events.8500.a.final_aspect: "ท่านยังไม่บรรลุระดับสุดท้ายของ [aspect_of_creation|E]"
 tgp_east_asia_mandala_events.8500.success.tt: "ท่านผ่านบททดสอบ [mandala_succession_succession|E] ด้าน [stewardship|E]"
 tgp_east_asia_mandala_events.8500.b: ""อา... ให้ข้าเล่าให้ฟังเถิด...""
 tgp_east_asia_mandala_events.8500.b.flavor: "ข้า #EMP ค่อนข้าง#! มั่นใจนะว่าเรื่องมันเป็นแบบนี้?"
 tgp_east_asia_mandala_events.8500.b.t.success: "น่าเชื่อถืออย่างยิ่ง"
 tgp_east_asia_mandala_events.8500.b.tt.success: "ท่านสามารถโน้มน้าวพวกเขาได้"
 tgp_east_asia_mandala_events.8500.b.t.failure: "ไม่น่าประทับใจ"
 tgp_east_asia_mandala_events.8500.b.tt.failure: "เสียงพึมพำอย่างไม่เชื่อถือดังแว่วมาจากฝูงชน"

 tgp_east_asia_mandala_events.8510.t: "$mandala_succession_header$ สงบดั่งผืนน้ำ"
 tgp_east_asia_mandala_events.8510.desc: "เหล่าผู้เข้าร่วมพิธีคุกเข่าเรียงกันอย่างเป็นระเบียบ เสียงสวดมนต์แผ่วเบาดังไปทั่วห้องโถงระหว่างพิธีขึ้นครองราชย์ของข้า ข้าเดินไปรอบๆ อย่างนุ่มนวล แตะหน้าผากของผู้คนเล็กน้อย พยายามปลูกฝังความสงบและสันติ\n\nท่ามกลางการนี้ [dummy_gender.GetWomenMen] สองคนกำลังโต้เถียงกันเสียงดังอยู่ด้านนอกเรื่องที่ดินผืนหนึ่ง\n\nความโกลาหลของพวกเขา ทำให้คนในห้องเริ่มหันมาสนใจข้าทีละน้อย เฝ้าสังเกตอย่างใจจดใจจ่อว่าข้าจะจัดการกับการรบกวนความสงบนี้อย่างไร"
 tgp_east_asia_mandala_events.8510.dynasty.override: ""ที่นี่คือสถานที่ศักดิ์สิทธิ์ จงสงบสติอารมณ์เสีย""
 tgp_east_asia_mandala_events.8510.a: ""พวกเจ้าแบ่งปันที่ดิน #EMP และ#! แบ่งปันผลผลิต""
 tgp_east_asia_mandala_events.8510.a.final_aspect: "ท่านยังไม่บรรลุระดับสุดท้ายของ [aspect_of_serenity|E]"
 tgp_east_asia_mandala_events.8510.success.tt: "ท่านผ่านบททดสอบ [mandala_succession_succession|E] ด้าน [diplomacy|E]"
 tgp_east_asia_mandala_events.8510.b: ""เรามาแก้ปัญหากันด้วยวิธี #EMP นี้#! เป็นอย่างไร...""
 tgp_east_asia_mandala_events.8510.b.flavor: "เหตุใดผู้คนช่างจุกจิก เช่นนี้นะ..."
 tgp_east_asia_mandala_events.8510.b.t.success: "$tgp_east_asia_mandala_events.8500.b.t.success$"
 tgp_east_asia_mandala_events.8510.b.tt.success: "$tgp_east_asia_mandala_events.8500.b.tt.success$"
 tgp_east_asia_mandala_events.8510.b.t.failure: "$tgp_east_asia_mandala_events.8500.b.t.failure$"
 tgp_east_asia_mandala_events.8510.b.tt.failure: "$tgp_east_asia_mandala_events.8500.b.tt.failure$"

 tgp_east_asia_mandala_events.8520.t: "$mandala_succession_header$ ระบำแห่งการทำลายล้าง"
 tgp_east_asia_mandala_events.8520.desc: "หอกของข้าสะท้อนแสงริบหรี่ของคบเพลิง และฝูงชนที่เงียบงันต่างจ้องมองใบหน้าที่เปื้อนเถ้าถ่านของข้าอย่างใจจดใจจ่อ ทะเลดอกไม้ล้อมรอบตัวข้าขณะที่สังข์เป่าเสียงสั่นสะเทือนต่ำๆ\n\nข้าถูกคาดหวังให้ร่ายรำระบำแห่งจักรวาล ระบำแห่งการทำลายล้าง อันเป็นสัญลักษณ์ของความเป็นทวิภาวะแห่งเทพ การทำลายล้างของเก่า เพื่อสร้างพื้นที่ให้สิ่งใหม่ได้ผลิบานและเติบโต\n\nศิลาทรงกระบอก ณ ใจกลางลานโล่งแผ่ความเย็นเยียบสงบนิ่งออกมาขณะที่ข้าเข้าใกล้มัน"
 tgp_east_asia_mandala_events.8520.dynasty.override: ""ข้าเกิดมาเพื่อสิ่งนี้ มันคือสิทธิ์ของข้า""
 tgp_east_asia_mandala_events.8520.a: "ข้าทำสิ่งนี้ได้แม้ในยาม #EMP หลับใหล#!!"
 tgp_east_asia_mandala_events.8520.a.final_aspect: "ท่านยังไม่บรรลุระดับสุดท้ายของ [aspect_of_destruction|E]"
 tgp_east_asia_mandala_events.8520.success.tt: "ท่านผ่านบททดสอบ [mandala_succession_succession|E] ด้าน [martial|E]"
 tgp_east_asia_mandala_events.8520.b: "เอาล่ะ ลองดูสักตั้ง..."
 tgp_east_asia_mandala_events.8520.b.flavor: "หนึ่ง สอง เอ่อ... ไปด้านข้าง?"
 tgp_east_asia_mandala_events.8520.b.t.success: "$tgp_east_asia_mandala_events.8500.b.t.success$"
 tgp_east_asia_mandala_events.8520.b.tt.success: "$tgp_east_asia_mandala_events.8500.b.tt.success$"
 tgp_east_asia_mandala_events.8520.b.t.failure: "$tgp_east_asia_mandala_events.8500.b.t.failure$"
 tgp_east_asia_mandala_events.8520.b.tt.failure: "$tgp_east_asia_mandala_events.8500.b.tt.failure$"

 tgp_east_asia_mandala_events.8530.t: "$mandala_succession_header$ มายาที่แท้จริง"
 tgp_east_asia_mandala_events.8530.desc: "ฝูงชนทั้งหมดรวมตัวกันที่นี่เพื่อดูข้า เพื่อให้ต้องมนต์สะกดโดย #EMP ข้า#! ผู้คนจับกลุ่มพูดคุยกันเงียบๆ และเสียงระฆังก็ดังขึ้นจากที่ไหนสักแห่ง เป็นสัญญาณว่าถึงเวลาแล้ว\n\nข้าก้าวเข้าไปในวงกลม ข้างศิลาทรงกระบอกและวางฝ่ามือลงบนพื้นผิวเรียบเนียนและเย็นเยียบของมัน\n\nใบหน้ามากมาย ทั้งชราและอ่อนเยาว์ พลันเงียบเสียงและหันมามองข้าขณะที่ข้ากระแอมไอ เตรียมกล่าวสุนทรพจน์:"
 tgp_east_asia_mandala_events.8530.dynasty.override: ""ให้ข้าได้กล่าวถึงผู้ที่มาก่อนข้าเถิด""
 tgp_east_asia_mandala_events.8530.a.final_aspect: "ท่านยังไม่บรรลุระดับสุดท้ายของ [aspect_of_trickery|E]"
 tgp_east_asia_mandala_events.8530.success.tt: "ท่านผ่านบททดสอบ [mandala_succession_succession|E] ด้าน [intrigue|E]"
 tgp_east_asia_mandala_events.8530.a: ""ให้ข้าบอกพวกท่านเกี่ยวกับมายาแห่งทวิภาวะเถิด""
 tgp_east_asia_mandala_events.8530.b: ""... จะเป็น เช่นไรหากข้าบอกว่าการหลอกลวงนั้น #EMP ไม่มีอยู่จริง?#!""
 tgp_east_asia_mandala_events.8530.b.flavor: "อย่างน้อยนั่นคือสิ่งที่ข้า #EMP ต้องการ#! ให้พวกเขาคิด"
