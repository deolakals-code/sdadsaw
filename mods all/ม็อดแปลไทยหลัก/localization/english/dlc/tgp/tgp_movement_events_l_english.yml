 tgp_movement_events.0160.t: "มีดที่พักไว้"
 tgp_movement_events.0160.desc: "เปลวเทียนสั่นไหวขณะที่ข้าจ้องมอง [ROOT.Char.Custom('GetWritingMaterial')] ที่ว่างเปล่าตรงหน้า [rival.GetTitledFirstName] นำทาง [rival_movement.GetName] ด้วยมือที่มั่นคง และมันคงจะเป็นประโยชน์หากไม่ต้องขวางทางกับ [rival.GetHerHim]\n\nแต่จดหมาย เช่นนั้น... สัญญาว่าจะไม่ปองร้าย... มันอาจถูกมองว่าเป็นสัญญาณของความอ่อนแอหรือไม่?"
 tgp_movement_events.0160.a: "ถ้อยคำที่ซื่อสัตย์คงเพียงพอ"
 tgp_movement_events.0160.b: "ไม่มีอะไรที่ทองคำบางส่วนจะสื่อไม่ได้"
 tgp_movement_events.0160.c: "ข้าไม่ใช่คนที่จะเสียทางเลือกไป"
