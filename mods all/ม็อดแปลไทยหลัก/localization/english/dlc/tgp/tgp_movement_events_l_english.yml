 tgp_movement_events.0150.t: "[monk.GetFaith.DevoteeNeuter|U] [monk.GetFaith.GetNameNoTooltip]"
 tgp_movement_events.0150.desc.intro: "ในอาภรณ์สี [monk.Custom('GetComplexColor')] [monk.GetFaith.DevoteeNeuter] ผู้หนึ่งเดินเข้ามาในห้องโถงบัลลังก์ เครื่องรางไม้เล็ก ๆ ห้อยอยู่ที่เข็มขัดของ [monk.GetHerHis] และกลิ่นธูปจาง ๆ ตาม [monk.GetHerHis] มา\n\n"
 tgp_movement_events.0150.desc.other_ruler: ""ข้ามาพร้อมกับเจตจำนงของ [other_ruler.GetLadyLord] ของข้า [other_ruler.GetTitledFirstName]" [monk.GetSheHe] กล่าว [monk.Custom('quirk_pos_pp')] "มันเป็นหน้าที่ของข้าที่จะเผยแผ่คำสอนของ [monk.GetFaith.HighGodName]""
 tgp_movement_events.0150.desc.alone: ""ข้ามาพร้อมกับเจตจำนงของ [monk.GetFaith.HighGodName] เพราะข้าได้อุทิศชีวิตให้กับการศึกษาศรัทธา [monk.GetFaith.GetName]""
 tgp_movement_events.0150.desc.outro: "โปรดรับข้าเข้าสู่ราชสำนักของท่าน เพื่อที่เราจะได้เรียนรู้จากกันและกัน""
 tgp_movement_events.0150.aa: ""บอก [other_ruler.GetLadyLord] ของท่านว่า ข้าชื่นชมการทูตของ [other_ruler.GetHerHis]""
 tgp_movement_events.0150.aa.alliance: "ท่านเข้าสู่ [alliance|E] กับ [other_ruler.GetShortUIName]"
 tgp_movement_events.0150.a: ""บอกข้าเกี่ยวกับ [monk.GetFaith.GetAdherentNamePluralNoTooltip]""
