l_english: 
 tgp_movement_events.0001.t: "ลับคมดาบ"
 tgp_movement_events.0001.desc: ""[ROOT.Char.GetTitledFirstName]!" [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('marshal'))] ของข้า [marshal.GetName] ก้าวย่างมาหาข้า [marshal.Custom('quirk_pos_pp')]\n\n"เราจะนั่งรอเฉยดุจแกะที่พร้อมให้หมาป่ามาขย้ำมิได้ นี่อาจเป็นช่วงเวลาแห่ง [my_situation.GetTopCurrentPhase.GetName|l] แต่ในไม่ช้าเราต้องเดินทัพ สู่บูรพา สู่ประจิม สู่ทักษิณและอุดร ข้าขอวิงวอนให้ท่านเตรียมพร้อม [ROOT.Char.GetTitleAsNameNoTooltip|l] ของข้า""
 tgp_movement_events.0001.aa: ""ท่านพูดถูก สอนข้าที""
 tgp_movement_events.0001.a: "[my_movement.GetNameNoTooltip] จะรับฟัง"
 tgp_movement_events.0001.b: "ข้าต้องรวบรวมพันธมิตร"
 tgp_movement_events.0001.c: "ข้าจะเรียนรู้จากขุนพลยุคเก่า"
 tgp_movement_events.0001.c.tt: "ท่านได้รับ [commander_trait|E]"
 event_increase_movement_power_major_effect_tooltip: "เพิ่ม [movement_power_i][movement_power|E] ของ [GetPlayer.Custom('GetMyMovement')] ขึ้น [EmptyScope.ScriptValue('event_increase_movement_power_major_value')|+0]"
 event_increase_movement_power_medium_effect_tooltip: "เพิ่ม [movement_power_i][movement_power|E] ของ [GetPlayer.Custom('GetMyMovement')] ขึ้น [EmptyScope.ScriptValue('event_increase_movement_power_medium_value')|+0]"
 event_increase_movement_power_minor_effect_tooltip: "เพิ่ม [movement_power_i][movement_power|E] ของ [GetPlayer.Custom('GetMyMovement')] ขึ้น [EmptyScope.ScriptValue('event_increase_movement_power_minor_value')|+0]"
 
 tgp_movement_events.0010.t: "ผู้มาเยือนอันเป็นที่ต้อนรับ"
 tgp_movement_events.0010.desc: "ขณะที่ข้ากำลังเดินเล่นในลาน ปรากฏ [courtier.GetWomanMan] แต่งกายดีผู้หนึ่งทักทายข้าด้วยการโค้งคำนับอย่างสุภาพ\n\n"ข้าคือ [courtier.GetName] [other_ruler.Custom2('RelationToMe', SCOPE.sC('courtier'))] ของ [other_ruler.GetTitledFirstNamePossessive]" [courtier.GetSheHe|U] แนะนำตนเอง [courtier.GetHerselfHimself] อย่างสุภาพ "[other_ruler.GetTitledFirstNameNoTooltip] ส่งข้ามาเรียนรู้สติปัญญาจากท่าน [ROOT.Char.GetTitleAsNameNoTooltip|l] [other_ruler.GetSheHe|U] ประสงค์จะรับฟังคำปรึกษาอื่น ๆ ก่อนทำการตัดสินใจ [other_ruler.GetHerHis]""
 tgp_movement_events.0010.a: "[my_movement.GetNameNoTooltip] ต้องเป็นผู้นำทาง"
 tgp_movement_events.0010.a.success: "ท่านโน้มน้าว [other_ruler.GetShortUIName] สำเร็จ"
 tgp_movement_events.0010.a.failure: "[other_ruler.GetShortUIName] เพิกเฉยต่อคำแนะนำของท่าน"
 tgp_movement_events.0010.b: "ควรมีคนมาขอคำแนะนำจากข้าให้มากกว่านี้!"
 tgp_movement_events.0010.c: ""ข้าตัดสินใจแทน [other_ruler.GetHerHim] มิได้ แต่ข้าช่วย [other_ruler.GetHerHim] ได้""
 event_increased_personal_movement_power_tt: "ท่านเพิ่ม [movement_power_i][personal_movement_power|E] ของท่าน [EmptyScope.ScriptValue('event_increased_personal_movement_power_value')|+0] เป็นเวลา #V 15 ปี#!"
 tgp_movement_events_0010_add_to_movement_effect_tt: "[other_ruler.GetShortUIName|U] จะเข้าร่วม [GetPlayer.Custom('GetMyMovement')]"
 
 tgp_movement_events.0020.t: "มุ่งหน้าไป! มุ่งหน้าไป!"
 tgp_movement_events.0020.desc: ""ข้า แต่ [ROOT.Char.GetTitleAsNameNoTooltip|l] ผู้ [ROOT.Char.Custom('ComplimentAdjective')]," [courtier.GetWomanMan] ชาว [courtier.GetCulture.GetNameNoTooltip] ผู้หนึ่งโค้งคำนับอย่างลึกซึ้งขณะ [courtier.GetSheHe] ก้าวเข้ามาในห้องโถงบัลลังก์ "ข้ามาพร้อมกับตราประทับของ [other_ruler.GetTitledFirstName] ผู้ยิ่งใหญ่ [other_ruler.GetLadyLord] ของข้าบัญชาให้ข้ามาแสดงความเคารพต่อสมาชิกร่วม [my_movement.GetName] อันทรงเกียรติ"\n\n[courtier.GetSheHe|U] [courtier.Custom('quirk_pos_present')] ก่อนกล่าวต่อ: "[other_ruler.GetTitledFirstNameNoTooltip] ยึดมั่นว่าอาณาจักรต้องมุ่งเน้นไปที่นวัตกรรม การแสวงหาอำนาจส่วนตนนั้นเห็นแก่ตัวและไร้ประโยชน์ เราทุกคนต้อง #EMP ก้าวหน้า#!""
 tgp_movement_events.0020.aa: "มันเป็นหนทางเดียวที่จะก้าวต่อไป"
 tgp_movement_events.0020.a: "และเราจะก้าวหน้า"
 tgp_movement_events.0020.b: "ไม่ความก้าวหน้าใดหากปราศจาก [my_movement.GetNameNoTooltip]!"
 tgp_movement_events.0020.c: "ทิศทางต้องถูกกำหนดจากภายในเรือ"
 event_decrease_movement_power_medium_effect_tooltip: "ลด [movement_power_i][movement_power|E] ของ [GetPlayer.Custom('GetMyMovement')] ลง #N [EmptyScope.ScriptValue('event_decrease_movement_power_medium_value')|0]#!"
 event_decrease_movement_power_minor_effect_tooltip: "ลด [movement_power_i][movement_power|E] ของ [GetPlayer.Custom('GetMyMovement')] ลง #N [EmptyScope.ScriptValue('event_decrease_movement_power_minor_value')|0]#!"
 tgp_advancement_innovations_modifier: "ความก้าวหน้าอันยิ่งใหญ่"
 tgp_advancement_innovations_modifier_desc: "ตัวละครนี้ใช้ความรู้ด้านสถาปัตยกรรมเพื่อมุ่งเน้นไปที่นวัตกรรมและผลักดันอาณาจักรไปสู่อนาคตที่สดใสยิ่งขึ้น"
 
 tgp_movement_events.0030.opening: "[other_ruler.Custom2('AppropriateGreetingPositive', ROOT.Char)]"
 tgp_movement_events.0030.desc: "ในฐานะสมาชิกร่วม [my_movement.GetName] ข้าเขียนถึงท่านเพื่อขอให้เราทั้งสองดูแลผลประโยชน์ร่วมกันของเรา\n\nข้าจะกล่าวถึงท่านในทางที่ดี หากท่านสามารถทำ เช่นเดียวกันให้ข้าได้"
 tgp_movement_events.0030.a: "เราตกลงตามนั้นได้"
 tgp_movement_events.0030.b: "ขอบคุณ แต่ข้าไม่ต้องการความช่วยเหลือ"
 friend_same_movement_reason: "[CHARACTER.GetShortUIName|U] และ [TARGET_CHARACTER.GetShortUIName] ตกลงที่จะรักษาผลประโยชน์ของกันและกันในฐานะสมาชิกของขบวนการเดียวกัน"
 friend_same_movement_reason_corresponding: "$friend_same_movement_reason$"
 
 tgp_movement_events.0040.t: "ความเมตตาจากสวรรค์"
 tgp_movement_events.0040.desc: ""ความพยายามของท่านมิได้ถูกมองข้าม [ROOT.Char.GetTitledFirstNameNoTooltip]" เสียงอันมั่นคงเรียกชื่อข้า [courtier.GetWomanMan] ที่กำลังโค้งคำนับอยู่เบื้องหน้าข้าถือตราประทับของ [hegemon.GetTitledFirstNameNoTooltip]\n\n"[hegemon.GetTitledFirstName] ซาบซึ้งในการสนับสนุนของท่าน และประสงค์จะมอบรางวัลให้ [my_movement.GetName] จะได้รับการแซ่ซ้องในระเบียงวัง และนามของท่านจะเป็นที่จดจำ""
 tgp_movement_events.0040.a: ""ข้าก็ซาบซึ้ง เช่นกัน""
 tgp_movement_events.0040.b: ""ข้าจะภักดีต่อ [hegemon.GetTitleAsNameNoTooltip] ตลอดไป""
 tgp_movement_events.0040.c: ""ให้กำแพงเหล่านั้นเล่าขานไป!""
 tgp_loyal_subject_modifier: "ภักดีต่อสวรรค์"
 tgp_loyal_subject_modifier_desc: "ตัวละครนี้แสดงความภักดีต่อผู้ครองความเป็นใหญ่โดยเข้าร่วมขบวนการสนับสนุนผู้ครองความเป็นใหญ่"
 dynastic_cycle_cannot_leave_movement_tt: "@warning_icon! #X ท่านจะไม่สามารถออกจาก [my_movement.GetName] ได้เป็นเวลา #V 15 ปี#!#!"
 
 situation_dynastic_cycle_choose_movement_decision_cannot_leave_var: "ท่านสัญญากับ [GetTitleByKey('h_china').GetHolder.GetTitleAsName] ว่าท่านจะไม่ทอดทิ้ง [GetTitleByKey('h_china').GetHolder.GetHerHim]"
 
 tgp_movement_events.0050.t: "แนวทางใหม่"
 tgp_movement_events.0050.desc.intro: ""คารวะ, [ROOT.Char.GetTitledFirstNameNoTooltip]" [new_elder.GetWomanMan] ผู้สุขุมก้าวเข้ามาในห้องทำงานของข้าอย่างแผ่วเบา, ขนาบข้างด้วยขุนนางของข้าเองสองสามคน "ข้ามาเพื่อขอเข้าเฝ้าเป็นการส่วนตัว, หากท่านจะอนุญาต"\n\n"ในตัวท่าน, ข้ามองเห็นถึงคุณสมบัติของบัณฑิต, จิตใจที่..."
 tgp_movement_events.0050.desc.diplomacy: "การทูต"
 tgp_movement_events.0050.desc.stewardship: "การคลัง"
 tgp_movement_events.0050.desc.intrigue: "เล่ห์กล"
 tgp_movement_events.0050.desc.learning: "การเรียนรู้"
 tgp_movement_events.0050.desc.martial: "การทหาร"
 tgp_movement_events.0050.desc.outro: "มีวินัยสะท้อนถึงคุณธรรม ข้าปรารถนาที่จะมอบสติปัญญาอันน้อยนิดของข้า เพื่อที่การปกครองของท่านจะถูกขัดเกลา และคมดาบของท่านจะถูกลับให้คม""
 tgp_movement_events.0050.a: "[new_elder.GetTitledFirstNameNoTooltip] จะเป็นอาจารย์ที่ยอดเยี่ยม"
 tgp_movement_events.0050.b: "ข้าจะภักดีต่อ [old_elder.GetTitledFirstNameNoTooltip] ตลอดไป!"
 tgp_movement_events.0050.c: "การมุ่งเน้นศึกษาคือหนทางเดียว"
 
 tgp_movement_events.0060.t: "น้ำหมึกอันชั่วร้าย"
 tgp_movement_events.0060.desc: "[ROOT.Char.Custom('GetWritingMaterial')] วางนิ่งอยู่บนโต๊ะทำงานของข้า เพียงตวัดเดียวก็สามารถ ทำให้ [rival.GetTitledFirstName] และ [rival_movement.GetName] ของ [rival.GetHerHis] มัวหมองไปหลายชั่วอายุคน ถึงกระนั้นข้าก็ลังเล เดิน [ROOT.GetCharacter.Custom('quirk_pos_adverb')] ไปรอบห้องทำงาน\n\nความคิดนั้นยังคงค้างคาดั่งควันจากเปลวไฟที่ถูกทอดทิ้ง"
 tpg_movement_events.0060.aa: "ไม่มีถ้อยคำใดจะเฉียบคมไปกว่านี้อีกแล้ว"
 tgp_movement_events.0060.a: "[rival_movement.GetNameNoTooltip] จะต้องทนทุกข์"
 tgp_movement_events.0060.b: "ข้าควรมุ่งเน้นไปที่การเชิดชูคุณธรรมของ [my_movement.GetNameNoTooltip]"
 tgp_movement_events.0060.c: "[ROOT.Char.GetFaith.HighGodName] สอนให้เรามีความเมตตา"
 tgp_movement_events.0060.a.tt: "$prelude_events.0040.c.tt$"
 tgp_movement_events.0060.a.rival_tt: "ลด [movement_power_i][movement_power|E] ของ [rival_movement.GetName] ลง #N [EmptyScope.ScriptValue('event_decrease_movement_power_medium_value')|0]#!"
 
 tgp_movement_events.0070.t: "ม้วนคัมภีร์ที่แบ่งปัน"
 tgp_movement_events.0070.desc: ""[ROOT.Char.Custom('FormOfAddressForLiege')|U]," [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('councillor'))] ของข้า [councillor.GetTitledFirstName] เข้ามาในห้องทำงาน [councillor.Custom('quirk_pos_pp')] "ข้าได้ยินมาว่าท่านมีความสนใจร่วมกันในเรื่อง [councillor.Custom('MatchingConversationSubject_alone')]\n\n"ข้าขอเสนอให้เราศึกษาคัมภีร์คลาสสิกร่วมกันได้หรือไม่? ในการไตร่ตรองร่วมกัน แม้ แต่ผู้ปกครองและผู้รับใช้ก็อาจเพิ่มพูนปัญญาได้ ดั่งกระจกสองบานที่ถูกขัดเงาเคียงข้างกัน""
 tgp_movement_events.0070.a: ""ฮ่า! เราพูดคุยเรื่อง [councillor.Custom('MatchingConversationSubject_alone')] กันได้แน่นอน""
 tgp_movement_events.0070.b.councillor: ""ท่านควรมุ่งเน้นไปที่การเป็น [councillor.GetCouncilTitle]""
 tgp_movement_events.0070.b.spouse: ""ข้าห่วงใยการศึกษาของท่านมากกว่า""
 tgp_movement_events.0070.c: "ข้าต้องไม่หยุดเรียนรู้"
 friend_studied_together: "[CHARACTER.GetShortUIName|U] และ [TARGET_CHARACTER.GetShortUIName] ใช้เวลายามบ่ายศึกษาวิชาที่ตนโปรดปรานร่วมกัน"
 friend_studied_together_corresponding: "$friend_studied_together$"
 
 tgp_movement_events.0080.t: "เพื่อตระกูลของเรา"
 tgp_movement_events.0080.desc: "[ROOT.Char.Custom2('RelationToMe', SCOPE.sC('family_member'))] ของข้า [family_member.GetTitledFirstName] [family_member.Custom('quirk_pos_present')] ขณะที่เขาเข้ามาในห้อง "[family_member.Custom2('RelationToMe', SCOPE.sC('root_scope'))] ที่รัก," [family_member.GetSheHe] โค้งคำนับให้ข้าอย่างสุภาพ ในอาภรณ์ที่สะอาดสะอ้าน สายตาทอดต่ำด้วยความเคารพ\n\n"ข้าได้ไตร่ตรองถึงเกียรติยศของตระกูลเรามานาน นี่อาจจะไม่มากนัก แต่ข้าก็ยังอยากมอบมันให้ท่าน เพื่อที่ [ROOT.Char.GetDomicile.GetName] จะได้ส่องสว่างเจิดจ้า ให้ทุกคนได้เห็น""
 tgp_movement_events.0080.aa: ""ชื่อของ [ROOT.Char.GetHouse.GetNameNoTooltip] จะเป็นที่รู้จัก!""
 tgp_movement_events.0080.a: ""ข้าขอบคุณท่านสำหรับเงินสนับสนุนนี้""
 tpg_movement_events.0080.b: ""เราต้องใช้ทองคำนี้สนับสนุน [my_movement.GetNameNoTooltip]""
 tgp_movement_events.0080.c: ""อย่าเสียทองของท่านไปกับข้าเลย""
 tgp_subsidised_estate_buildings_modifier: "อสังหาริมทรัพย์ที่ได้รับเงินอุดหนุน"
 tgp_subsidised_estate_buildings_modifier_desc: "ครอบครัวของตัวละครนี้เสนอที่จะช่วยสร้างอสังหาริมทรัพย์ของพวกเขา\n\n"
 MODIFIER_DEFINITION_SUBSIDISED_ESTATE: "#emp ใช้เมื่อก่อสร้างอาคารที่พำนักใหม่#!\nทรัพยากร [domicile_building|E] ที่เหลืออยู่: #bold $MULTIPLIER|0$/3#!"
 friend_rejected_funds: "[CHARACTER.GetShortUIName|U] สนับสนุนให้ [TARGET_CHARACTER.GetShortUIName] ไม่ใช้ทองคำของ [TARGET_CHARACTER.GetHerHis] เพื่อ [CHARACTER.GetShortUINamePossessive]"
 friend_rejected_funds_corresponding: "[TARGET_CHARACTER.GetShortUIName|U] ได้รับการสนับสนุนจาก [CHARACTER.GetShortUIName] ให้ไม่ใช้ทองคำของ [CHARACTER.GetHerHis] เพื่อ [TARGET_CHARACTER.GetShortUINamePossessive]"
 
 tgp_movement_events.0090.t: "บาดแผลเก่า"
 tgp_movement_events.0090.desc: ""[ROOT.Char.GetTitledFirstNameNoTooltip]," [courtier.GetWomanMan] ผู้ถือตราประทับของตระกูล [other_ruler.GetHouse.GetName] โค้งคำนับอย่างลึกซึ้งเบื้องหน้าข้า "นาย [other_ruler.GetLadyLord] ของข้า [other_ruler.GetTitledFirstName] บัญชาให้ข้าอ่านสาส์นนี้"\n\n"แม้ว่าในอดีตเราจะเดินอยู่บนเส้นทางที่ขัดแย้งกัน แต่เส้นทางที่เรากำลังก้าวเดินในฐานะสมาชิกของ [my_movement.GetName] นั้นนำเราไปสู่เป้าหมายเดียวกัน เราต้องลืมบาดแผลในอดีต""
 tgp_movement_events.0090.aa: ""ปฏิเสธ""
 tgp_movement_events.0090.a: ""คำขอโทษที่ #EMP ทุกคน#! ต้องได้ยิน""
 tgp_movement_events.0090.b: "เพียงเพื่อประโยชน์ของ [my_movement.GetNameNoTooltip] เท่านั้น"
 tgp_movement_events.0090.c: ""ส่งความปรารถนาดีของข้าไปยัง [other_ruler.GetTitleAsNameNoTooltip]""
 
 tgp_movement_events.0100.t: "คำแนะนำ"
 tgp_movement_events.0100.desc: ""[ROOT.Char.GetTitleAsNameNoTooltip] ผู้สูงส่ง" [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('spymaster'))] ของข้า [spymaster.GetTitledFirstName] เรียกความสนใจจากข้าในความมืด เสียงไม้ลั่นเอี๊ยดอ๊าดภายใต้ฝีเท้าอันว่องไวของ [spymaster.GetHerHis]\n\n"เราได้ยินมาว่า [rival.GetTitledFirstName] ผู้นำของ [rival_movement.GetName] อาจจะอ่อนไหวต่อ... ข้อเสนอแนะ มากกว่าที่คาดไว้""
