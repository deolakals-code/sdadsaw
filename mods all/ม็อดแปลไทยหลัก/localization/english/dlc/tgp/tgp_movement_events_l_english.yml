 tgp_cultural_harmony_modifier_desc: "ตัวละครนี้ตัดสินใจที่จะมุ่งเน้นความพยายามในการอยู่ร่วมกับวัฒนธรรมของเมืองหลวงอย่างปรองดอง"
 
 tgp_movement_events.0140.t: "ของขวัญจากศิษย์"
 tgp_movement_events.0140.desc: ""ท่านอาจารย์!" ข้าได้ยินเสียง [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('disciple'))] ของข้า [disciple.GetTitledFirstNamePossessive] ก่อนที่จะทันเห็น [disciple.GetHerHim]\n\n"ท่านสอนข้าอย่างมากมายเกี่ยวกับบันทึก [ROOT.Char.Custom('GetRandomAnnalsPassage')] และ [ROOT.Char.Custom('GetRandomHistoryPassage')] และท่านได้บ่มเพาะสติปัญญาของข้าด้วยความเอาใจใส่เป็นอย่างดี เพื่อเป็นสัญลักษณ์แห่งความกตัญญู ข้าปรารถนาที่จะมอบของขวัญชิ้นนี้ให้ท่าน"\n\n[disciple.GetSheHe|U] [disciple.Custom('quirk_pos_present')] และยื่นห่อสี [ROOT.Char.Custom('GetSimpleColor')] ให้ข้า"
 tgp_movement_events.0140.a: ""และข้าจะรับมันไว้ด้วยความยินดี""
 tgp_movement_events.0140.b: ""จำไว้ว่าเราทำสิ่งนี้เพื่อ [my_movement.GetNameNoTooltip]""
 tgp_movement_events.0140.c: ""แล้ว [ROOT.Char.Custom('GetRandomPoetryPassage')] ล่ะ?""
