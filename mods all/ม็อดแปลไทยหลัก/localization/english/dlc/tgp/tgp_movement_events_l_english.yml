 tgp_movement_events.0120.t: "ดื่มอวยพรให้คุณธรรม"
 tgp_movement_events.0120.desc: "ขณะที่ถ้วยถูกเติมด้วย [host.Custom('GetExpensiveDrink')] และจาน [host.Custom('GetExpensiveMeal')] หายไป [other_ruler.GetTitledFirstName] ก็เอนตัวเข้ามาใกล้\n\n"เราไม่สามารถ ทำให้ [my_movement.GetName] ผิดหวังได้" [other_ruler.GetSheHe] กล่าว [other_ruler.Custom('quirk_pos_pp')] "ท่านได้ศึกษา [other_ruler.Custom('GetRandomHistoryPassage')] แล้วหรือยัง [ROOT.Char.GetTitledFirstNameNoTooltip]?""
 tgp_movement_events.0120.a: ""ได้โปรด สอนข้าที""
 tgp_movement_events.0120.b: "เราต้องพึ่งพาอำนาจเพียงอย่างเดียว"
 tgp_movement_events.0120.c: ""งานเลี้ยงไม่ใช่สถานที่สำหรับศึกษาเล่าเรียน!""
 
 tgp_movement_events.0130.t: "ภาษาของ [capital_culture.GetCollectiveNounNoTooltip]"
 tgp_movement_events.0130.desc: "[courtier.GetWomanMan] ผู้ แต่งกายด้วย [other_ruler.Custom('RegionalFabric')] งดงาม โค้งคำนับเบื้องหน้าข้า:\n\n"[other_ruler.GetLadyLord] ของข้า [other_ruler.GetTitledFirstName] บัญชาให้ข้าพูดแทน [other_ruler.GetHerHis] [ROOT.Char.Custom('FormOfAddressForLiege')|l] [other_ruler.GetSheHe|U] เกรงว่าเสียงของ [my_movement.GetName] อาจแผ่วเบาในเมืองหลวงหากไม่มีการพูดภาษาของพวกเขา"\n\n[courtier.GetSheHe|U] [courtier.Custom('quirk_pos_present')] และกล่าวต่อ: "ข้าจะรู้สึกเป็นเกียรติอย่างยิ่งหากได้นำทางท่านในการเดินทางครั้งนี้""
 tgp_movement_events.0130.a: "ข้าต้องเรียนรู้ภาษาของพวกเขา!"
 tgp_movement_events.0130.b: "ทำไมไม่แค่กลายเป็น [capital_culture.GetNameNoTooltip]?"
 tgp_movement_events.0130.c: "เราจะอยู่ร่วมกันอย่างปรองดอง"
