 tgp_movement_events.0110.opening: "[other_ruler.Custom2('AppropriateGreetingPositive', ROOT.Char)]"
 tgp_movement_events.0110.desc: "ในฐานะสมาชิกร่วม [my_movement.GetName] มันเป็นหน้าที่ของเราที่จะต้องรักษาไว้ ซึ่งความคมของดาบ ไม่เพียงเท่านั้น แต่ยัง รวมถึงจิตใจของเราด้วย\n\nโปรดรับหนังสือเล่มนี้ไป ศึกษาอย่างระมัดระวัง"
