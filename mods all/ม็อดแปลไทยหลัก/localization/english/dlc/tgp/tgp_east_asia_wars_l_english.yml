 mandala_plunder_cb_ended_invalid.desc: "[war.GetName] ได้สิ้นสุดลง: เนื่องจาก [attacker.GetShortUIName] [CharAreIs( attacker )] มิได้เป็น [ruler|E] [mandala|E] [aspect_of_destruction|E] ผู้ ซึ่งมี [great_project|E] ที่วางแผนไว้อีกต่อไป หรือ [defender.GetShortUIName] [CharAreIs( defender )] มิได้เป็นผู้ปกครองมณฑลอีกต่อไป"
 not_planning_mandala_capital_tt: "ท่านมิได้กำลังวางแผน [great_project|E] [GetBuilding('mandala_capital_01').GetTypeName]"
