 meritocratic_province_metropolitan_desc: "#low การบริหารฝ่ายพลเรือนอันทรงประสิทธิภาพที่ใช้กับพื้นที่เมืองขนาดใหญ่ โดยเน้นย้ำอย่างยิ่งในเรื่องการใช้ภาษีอย่างมีประสิทธิภาพและการสร้างความเจริญรุ่งเรืองแก่เมือง#!"
 meritocratic_province_metropolitan_amount_desc: "ถึงขีดจำกัด $meritocratic_province_metropolitan_short$"
 meritocratic_province_military: "@meritocratic_military_administration! การบริหารฝ่ายทหาร"
