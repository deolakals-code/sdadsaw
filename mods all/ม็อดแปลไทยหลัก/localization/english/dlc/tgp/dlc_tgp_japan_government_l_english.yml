 game_concept_house_bloc_desc: "$game_concept_house_bloc$ คือพันธมิตรป้องกันตัวของ [houses|E] ภายใน [realm|E] [member_house|E] ใดๆ ที่ถูกโจมตีจะได้รับการป้องกันจาก $game_concept_member_houses$ อื่นๆ ทั้งหมด\n\n[house_heads|E] ตัดสินใจว่าจะเข้าร่วมเป็น [bloc_member_houses|E] หรือไม่ โดยสมาชิกผู้ปกครองทั้งหมดของตระกูลของตนในอาณาจักรจะปฏิบัติตาม\n\nกลุ่มจะมี [leading_house|E] เสมอ ซึ่งอาจขับไล่สมาชิกคนอื่น เป็น [ceremonial_regent|E] ที่ได้รับการสนับสนุนจากสมาชิกทุกคน และ [house_aspiration|E] ของตระกูลจะเป็นตัวกำหนดโบนัสที่ได้รับจากระดับ [cohesion|E] ที่สูงขึ้น\n\nมีเพียง $game_concept_house_head$ ของ $game_concept_leading_house_possessive$ เท่านั้นที่สามารถสร้าง [factions|E] ต่อต้าน [top_liege|E] ได้ และสมาชิก $game_concept_bloc_member_houses$ ทุกคนจะเข้าร่วม [factions|E] ทั้งหมดที่พวกเขาสร้างขึ้น"

 game_concept_bloc_cohesion: "ความเชื่อมแน่นของกลุ่ม"
 game_concept_cohesion: "ความเชื่อมแน่น"
 game_concept_bloc_cohesion_desc: "$game_concept_cohesion$ วัดความเป็นหนึ่งเดียวของ [house_bloc|E] โดยระดับที่สูงขึ้นจะมอบผลประโยชน์ที่เพิ่มขึ้นแก่สมาชิกของ [bloc_member_houses|E] โดยขึ้นอยู่กับ [house_aspiration|E] ของ [leading_house_possessive|E]\n\nแหล่งที่มาหลักคือ [house_relations|E] ระหว่าง $game_concept_bloc_member_houses$ ซึ่งสามารถส่งผลต่อ $game_concept_cohesion$ ทั้งในเชิงบวกและเชิงลบ นอกจากนี้ ขนาดโดยรวมของกลุ่ม หรือ $game_concept_house_aspirations$ หรือ [government|E] ของสมาชิกที่ไม่ตรงกัน สามารถลด $game_concept_cohesion$ ได้\n\nการรักษาระดับ $game_concept_bloc_cohesion$ จะมอบโบนัสต่างๆ ให้กับ [member_houses|E] โดยขึ้นอยู่กับเป้าหมายของ $game_concept_leading_house$\n\nเมื่อ $game_concept_cohesion$ ถึง #V 0#! $game_concept_house_bloc$ จะสลายตัวโดยอัตโนมัติ"
 game_concept_bloc_cohesion_tt: "#T @bloc_cohesion! $game_concept_bloc_cohesion$#!\n\n$game_concept_bloc_cohesion_desc$"

