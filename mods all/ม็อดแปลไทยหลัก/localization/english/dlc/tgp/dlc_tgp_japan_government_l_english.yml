 japan_administrative_government: "ริตสึเรียว"
 japan_administrative_government_adjective: "$japan_administrative_government$"
 japan_administrative_government_with_icon: "@government_type_ritsuryo! $japan_administrative_government$"
 japan_administrative_government_vassals_label: "[obligations|E] ของ $japan_administrative_government$ ขึ้นอยู่กับ [GetPlayer.Custom('GetProvinceAdministrationConcept')]"
 japan_administrative_government_desc: "\n$japan_administrative_government$ คือ [government|E] รูปแบบ [administrative|E] ที่มีเอกลักษณ์เฉพาะในญี่ปุ่น\n\nนี่คือ [government_form|E] แบบ [government_bureaucratic_type|E] ที่รวมศูนย์อำนาจ โดย [characters|E] จะถูก แต่งตั้งเป็น [governors|E] ในนามของ [liege|E] ของตน สามารถเข้าถึง [influence|E] และ [house_head_heads|E] ของ [noble_family|E] จะมี [family_manor|E] และ [house_aspiration|E]\n\n[kampaku|E] จะปกครอง [realm|E] ในนามของ [japanese_emperor|E] และอาจถูกเลือกจากบรรดา [house_head_heads|E] ของ [noble_family|E] หรือถูกบังคับโดยข้อเรียกร้องของ [faction|E]\n\nโดยทั่วไป [vassals|E] $japan_administrative_government$ จะปกครองเพียง [county|E] เดียว แต่อาจปฏิเสธระบบรวมศูนย์และกลายเป็นเจ้าที่ดิน [soryo|E] ในท้องถิ่นเพื่อสร้างอำนาจของตนเอง แม้ว่าโดยทั่วไปจะถือเป็น [criminal|E]\n\n$game_concept_house_heads$ ของ $japan_administrative_government$ อาจสร้างและเข้าร่วม [house_blocs|E] ภายใน [realm|E] ซึ่งจะสนับสนุน [leading_house|E] ในการเป็น $game_concept_kampaku$\n\n$japan_government_domain_limit_help$\n\n#F ระบบ $japan_administrative_government$ หมายถึงรัฐบาลบริหารแบบรวมศูนย์ของญี่ปุ่น ซึ่งได้รับแรงบันดาลใจจากระบบราชการขงจื๊อของจีน#!"
 japan_feudal_government: "โซเรียว" # 惣領
 japan_feudal_government_adjective: "$japan_feudal_government$"
 japan_feudal_government_with_icon: "@government_type_soryo! $japan_feudal_government$"
 japan_feudal_government_vassals_label: "[obligations|E] ของ $japan_feudal_government$ ขึ้นอยู่กับ [vassal_contract|E] ของ [vassal|E] แต่ละคน"
 japan_feudal_government_desc: "\n$japan_feudal_government$ คือ [government|E] รูปแบบ [feudal|E] ที่มีเอกลักษณ์เฉพาะในญี่ปุ่น\n\n$japan_feudal_government$ หมายถึงเจ้าที่ดินท้องถิ่นที่ละทิ้งหรือเข้าแทนที่อำนาจของรัฐบาล [ritsuryo|E] ส่วนกลาง และปกครองแคว้นต่างๆ เป็นเขตศักดินาของตนเอง\n\nตัวละคร $japan_feudal_government$ ไม่ใช้ [influence|E] แต่ [house_head_heads|E] ของ [noble_family|E] ยังคงมี [family_manor|E] และ [house_aspiration|E] ของตน\n\nแม้ว่าจะไม่สามารถได้รับเลือกเป็น [ceremonial_regent|E] ได้ แต่ [rulers|E] $japan_feudal_government$ อาจยึดอำนาจผ่าน [faction|E] #V $replace_ceremonial_regent_faction_name$#! และใช้ [decision|E] #V สถาปนารัฐบาลโชกุน#! (Formalize Shōgunate)\n\n$game_concept_ceremonial_regents$ ของ $japan_feudal_government$ ปกครอง [realm|E] ในนามของ [japanese_emperor|E] สืบทอดตำแหน่งโดย [succession|E] แบบ $single_heir_succession_law$ และอาจถูกโค่นล้มโดยข้อเรียกร้องของ [faction|E]\n\n$game_concept_house_heads$ ของ $japan_feudal_government$ อาจสร้างและเข้าร่วม [house_blocs|E] ภายใน [realm|E]$japan_government_domain_limit_help$\n\n\n\n#F $japan_feudal_government$ หมายถึงช่วงแรกของการเปลี่ยนเป็นระบบศักดินาของญี่ปุ่นซึ่งเริ่มต้นในยุคเฮอัน และถูกกำหนดรูปแบบให้เป็นทางการมากขึ้นภายใต้รัฐบาลโชกุนแรกในยุคคามาคุระ#!"
 japan_government_domain_limit_help: "@alert_icon! #HELP $game_concept_governments$ ของญี่ปุ่นมี [domain_limit|E] ต่ำกว่าแบบอื่น ซึ่งอาจเพิ่มได้โดยการอัปเกรด $game_concept_family_manor$#!"
 tgp_is_japanese_governor_trigger: "ท่านคือ [governor|E] [GetGovernment('japan_administrative_government').GetName]"

 # Appointment Succession Law
 japanese_appointment_succession_law: "การสืบทอดตำแหน่งโดยการ แต่งตั้ง $japan_administrative_government$"
 japanese_appointment_succession_law_subname: "ผู้สมัครที่มีคะแนนสูงสุดจะได้สืบทอด"
 japanese_appointment_succession_law_effects: "\n[appointment_succession_law|E] ประเภทหนึ่ง ภายใต้ $japanese_appointment_succession_law$ [title|E] และ [holdings|E] ที่เกี่ยวข้องจะถูกสืบทอดโดยผู้สมัครที่มีคะแนนสูงสุด [adult|E] ใดๆ ใน [realm|E] อาจมุ่งมั่นที่จะบรรลุตำแหน่ง [governorship|E] ผ่านวิธีการต่างๆ ตั้งแต่ [scheming|E] ไปจนถึงการใช้ [influence|E]"
 japanese_military_appointment_succession_law: "การสืบทอดตำแหน่งทางการทหาร $japan_administrative_government$"
 japanese_military_appointment_succession_law_subname: "ผู้สมัครที่มีคะแนนสูงสุดจะได้สืบทอด"
 japanese_military_appointment_succession_law_effects: "\n[appointment_succession_law|E] ประเภทหนึ่ง ภายใต้ $japanese_military_appointment_succession_law$ [title|E] และ [holdings|E] ที่เกี่ยวข้องจะถูกสืบทอดโดยผู้สมัครที่มี [candidate_score|E] สูงสุด [adult|E] ใดๆ ใน [realm|E] อาจมุ่งมั่นที่จะบรรลุตำแหน่ง [governorship|E] ทางทหารได้โดยการมี [martial_skill|E] ที่ดี ได้รับ [commander_traits|E] หรือใช้ [influence|E]#!"
 # Kampaku Acclamation Succession Law (Japan, TGP)
 japanese_regency_succession_law: "การสืบทอดตำแหน่งผู้สำเร็จราชการญี่ปุ่น"
 japanese_regency_succession_law_subname: "$appointment_succession_law_subname$"
 japanese_regency_succession_law_effects: "ภายใต้ $japanese_regency_succession_law$ [title|E] และ [holdings|E] ที่เกี่ยวข้องจะถูกสืบทอดโดยผู้สมัครที่มีคะแนนสูงสุด กลุ่มผู้สมัครประกอบด้วย [noble_families|E] ของอาณาจักร [governors|E] และสมาชิกในครอบครัวของพวกเขา\n\nหาก [japanese_emperor|E] ถูกเลือกให้เป็น [ceremonial_regent|E] คนต่อไป พวกเขาจะได้รับทางเลือกว่าจะสละราชสมบัติในฐานะ [tenno|E] หรือพยายามสถาปนาการปกครองโดยตรงขึ้นใหม่!"

