l_english: 
 az_debate.0001.t: "ศิษย์ผู้ควรค่าแก่การเอาชนะ"
 az_debate.0001.desc: "ณ อีกฟากของห้องโถง [rival_elder.Custom2('MyCharacterIntroduction', ROOT.Char)] โน้มตัวเข้าหา [disciple_candidate.Custom2('MyCharacterIntroduction', ROOT.Char)] "ภายใต้การชี้แนะของข้า ระเบียบวินัยและความภักดีคือเสาหลักแห่งความเป็นจ้าวผู้เชี่ยวชาญอย่างแท้จริง" [rival_elder.GetTitledFirstNameNoTooltip] ประกาศกร้าว น้ำเสียงเปี่ยมด้วยความภาคภูมิ\n\n"แน่นอนขอรับ ท่านผู้อาวุโส" [disciple_candidate.GetTitledFirstNameNoTooltip] ตอบรับ แม้ว่าสายตาของ [disciple_candidate.GetHerHis] จะเหลือบมาทางข้า "ทว่า... แล้วแนวคิดใหม่เล่า ที่ผ่านการทดสอบในการแข่งขันอย่างเปิดเผย?" ข้าสังเกตเห็นรอยยิ้มจางๆ ที่มุมปากของ [disciple_candidate.GetHerHis] ความเฉียบแหลมในน้ำเสียงของ [disciple_candidate.GetHerHis] คือประกายแห่งความกระสับกระส่าย และบางที อาจเป็นช่องทาง"
 az_debate.0001.a: "ท้าทาย [rival_elder.GetHerHim] ต่อหน้าสาธารณะ"
 az_debate.0001.a.success: "ปัญญาเฉียบแหลมก้าวล้ำหน้า [rival_elder.GetFirstNamePossessiveNoTooltip]"
 az_debate.0001.a.failure: "ข้าโต้แย้งเกินขอบเขตไป"
 az_debate.0001.b: "เสนอการชี้แนะเป็นการส่วนตัว"
 az_debate.0001.b.success: "[disciple_candidate.GetFirstNameNoTooltip] ตอบรับคำเชิญของข้า"
 az_debate.0001.b.failure: "การทาบทามของข้าล้มเหลว"
 az_debate.0001.d: "ปล่อยครั้งนี้ให้ผ่านไปน่าจะดีกว่า"

 az_debate.0002.t: "ชั่วขณะหนึ่งกับท่านผู้อาวุโส"
 az_debate.0002.desc: "ข่าวแพร่สะพัดไปทั่วห้องโถงอย่างรวดเร็ว: [elder_candidate.Custom2('MyCharacterIntroduction', ROOT.Char)] ได้มาถึงแล้ว\n\n"ข้าจะไม่พำนักอยู่นาน" ท่านผู้อาวุโสกล่าว น้ำเสียงสงบ แต่น่าเกรงขาม\n\n[audience_rep.GetFirstNameNoTooltip] เอนตัวมาทางข้า กระซิบกระซาบอย่างเร่งด่วน "หากท่านมีสิ่งใดจะกล่าว จงกล่าวเสียบัดนี้ ก่อนที่ผู้อื่นจะรุมล้อม [elder_candidate.GetHerHim] จนสิ้นโอกาส""
 az_debate.0002.a: "สร้างความประทับใจด้วยข้อโต้แย้งอันสมบูรณ์แบบเพียงหนึ่งเดียว"
 az_debate.0002.a.success: "เหตุผลของข้าตรงประเด็น"
 az_debate.0002.a.failure: "ข้าพลาดท่า"
 az_debate.0002.c: "ควบคุมตัวพวกเขาก่อนที่ใครจะสังเกตเห็น"
 az_debate.0002.c.success: "ข้าเคลื่อนผ่านฝูงชนราวดั่งเงา"
 az_debate.0002.c.failure: "ข้าไปถึง [elder_candidate.GetHerHim] ช้าเกินไป"
 az_debate.0002.d: "ปล่อยให้ชั่วขณะนี้ผ่านไป"
 
 az_debate.0003.t: "ประเด็นที่ต้องขบคิด"
 az_debate.0003.desc: "[disciple_candidate.Custom2('MyCharacterIntroduction', ROOT.Char)|U] ก้าวไปข้างหน้า แววตาสดใสเปี่ยมด้วยความท้าทาย "หากผู้ปกครองต้องเลือกระหว่างการรักษาสัญญาที่จะสร้างความเสียหายแก่แว่นแคว้น หรือการผิดสัญญาเพื่อรักษาปวงชนของตน เส้นทางใดคือวิถีอันเที่ยงธรรม?"\n\nนี่มิใช่การครุ่นคิดเรื่อยเปื่อย แต่คือการทดสอบ เพื่อวัดคุณค่าในตัวข้า"
 az_debate.0003.a: ""จงตามข้ามา แล้วข้าจะแสดงให้เจ้าเห็น""
 az_debate.0003.b: ""จงฟังให้ดี: สัจธรรมนั้นอยู่ในอุปมาและสุภาษิต""
 az_debate.0003.b.success: "บทเรียนนั้นชัดแจ้ง"
 az_debate.0003.b.failure: "ความหมายนั้นหลุดลอยไป"
 az_debate.0003.c: ""ให้พลังแห่ง [my_movement.GetNameNoTooltip] แสดงคุณค่าของข้า""
 az_debate.0003.d: ""เราจะค้นพบคำตอบผ่าน [ROOT.Char.GetFaith.ReligiousText|U]""

 az_debate.0004.t: "เสียงประสานแห่งความกังขา"
 az_debate.0004.desc: "ข้าสังเกตเห็นกลุ่มคนกลุ่มเล็กจับกลุ่มกันเป็นวงแคบ เสียงหัวเราะของพวกเขาช่างเสียดแทงและเย้ยหยัน หนึ่งในนั้น [freethinker_friend.Custom2('MyCharacterIntroduction', ROOT.Char)] เอนตัวมาหาข้าพร้อมรอยยิ้มเจ้าเล่ห์\n\n"บอกเราสิ [ROOT.Char.GetFirstNameNoTooltip] เหตุใดพวกเราต้องยอมสยบต่อขบวนการของท่าน? เราไม่ชื่นชอบธงทิว และไม่อดทนต่อผู้เป็นนาย""
 az_debate.0004.a: ""เหตุผลในตัวมันเองจะพิสูจน์ความแข็งแกร่งในสิ่งที่ข้ายืนหยัด""
 az_debate.0004.b: ""ปัญญาของท่านสูญเปล่าเมื่ออยู่ภายนอก จงเดินไปกับข้าดีกว่า""
 az_debate.0004.c: ""เรามาถกเถียงเรื่องนี้ระหว่างดื่ม [ROOT.Char.Custom('GetExpensiveDrink')] กันเถิด""
 az_debate.0004.c.success: "[freethinker_friend.GetFirstNameNoTooltip] เริ่มรู้สึกอุ่นใจที่ได้อยู่กับท่าน"
 az_debate.0004.c.failure: "แนวทางอันแยบยลล้มเหลว"
 az_debate.0004.d: ""เช่นนั้นก็จงกล่าวอย่างอิสระ และเดินในเส้นทางของท่านเถิด""

 az_debate.0005.t: "ตัวเลือกสุดท้ายของผู้อาวุโส"
 az_debate.0005.desc: "[elder_candidate.Custom2('MyCharacterIntroduction', ROOT.Char)|U] ลูบคลำคางของ [elder_candidate.GetHerHis] อย่างครุ่นคิด สายตาสลับมองระหว่างข้าและ [rival_candidate.Custom2('MyCharacterIntroduction', ROOT.Char)]\n\n"นี่อาจเป็นศิษย์คนสุดท้ายที่ข้าจะรับ" [elder_candidate.GetSheHe] กล่าวอย่างเคร่งขรึม "พวกเจ้าคนใดคนหนึ่งสามารถโน้มน้าวข้าได้หรือไม่ว่าเจ้าคู่ควร?"\n\n[rival_candidate.GetFirstNameNoTooltip] กอดอก [rival_candidate.GetHerHis] ยิ้มเยาะ "ข้าจะไม่พลาดโอกาสนี้""
 az_debate.0005.a: ""ข้าพร้อมที่จะพิสูจน์ตนเอง""
 az_debate.0005.a.success: "ท่านสร้างความประทับใจให้ [elder_candidate.GetFirstNameNoTooltip]"
 az_debate.0005.a.failure: "ท่านไม่สามารถสร้างความประทับใจให้ [elder_candidate.GetFirstNameNoTooltip]"
 az_debate.0005.b: ""ให้ข้าได้ช่วยงานวิทยานิพนธ์ฉบับสุดท้ายของท่าน""
 az_debate.0005.b.tt: "ค่า [learning|E] ของท่านไม่สูงพอ และท่านไม่ใช่ [GetTrait('confucian_education').GetName(ROOT.Char)]"
 az_debate.0005.c: ""ข้าจะไม่ขวางทาง""

 az_debate.0006.t: "บทเรียนสุดท้าย"
 az_debate.0006.desc: "ด้วยสายตาที่พินิจพิเคราะห์ [current_elder.Custom2('MyCharacterIntroduction', ROOT.Char)] เอ่ยขึ้นเบาๆ:\n\n"เจ้าได้เรียนรู้ทุกสิ่งที่ข้าสามารถถ่ายทอดได้แล้ว [ROOT.Char.GetFirstNameNoTooltip] คำสอนของข้าสิ้นสุดแล้ว ตะเกียงแห่งปัญญาของข้าใกล้จะมอดดับ ทว่าอย่าได้คิดว่าตนถูกทอดทิ้ง ยังมีผู้หนึ่ง ซึ่งความหยั่งรู้ของเขาส่องสว่างยิ่งกว่า — [new_elder.Custom2('MyCharacterIntroduction', ROOT.Char)]"\n\nผู้อาวุโสผงกศีรษะ [current_elder.GetHerHis] ไปยังร่างอันน่าเคารพยำเกรง การปรากฏตัวของ [new_elder.GetHerHis] นั้นเคร่งขรึมและเปี่ยมความคาดหวัง "หากเจ้าปรารถนา ข้าจะฝากฝังเจ้าไว้ในการดูแลของ [new_elder.GetHerHis] หรือบางทีเส้นทางของเจ้าอาจมุ่งไปสู่วิถีอื่น?"\n\nว่ากันว่าการปฏิบัติตามสายการสืบทอดคือการให้เกียรติสิ่งที่คนโบราณเรียกว่า [Glossary( 'เต๋า', 'CONFUCIAN_DAO')]"
 az_debate.0006.a: ""ข้าจะยอมรับการชี้แนะของ [new_elder.GetFirstNamePossessiveNoTooltip]""
 az_debate.0006.b: ""คำสอนของท่านนั้นเพียงพอแล้ว""
 az_debate.0006.c: ""เหตุใดปัญญาจึงต้องถูกจำกัดไว้เพียงเสียงเดียว?""
 az_debate.0006.c.success: "ผู้อาวุโสทั้งสองพยักหน้าด้วยความประทับใจ"
 az_debate.0006.c.failure: "[new_elder.GetFirstNameNoTooltip] ตัวแข็งทื่อ รู้สึกถูกสบประมาท"
 CONFUCIAN_DAO: "หมายถึง 'มรรค' — ระเบียบแห่งศีลธรรมและวิถีแห่งจักรวาลที่นักปราชญ์สั่งสอน เป็นทั้งแนวทางในการปฏิบัติตนที่เหมาะสมและรากฐานของความกลมเกลียวระหว่างสวรรค์ โลก และมนุษยชาติ"

 az_debate.0007.t: "การตำหนิต่อหน้าธารกำนัล"
 az_debate.0007.desc: ""เจ้าฟังตัวเองอยู่หรือไม่?" [rival_elder.Custom2('MyCharacterIntroduction', ROOT.Char)] ตวาดลั่น เสียงตัดผ่านห้องโถง "เด็กยังสามารถท่องคัมภีร์คลาสสิกได้มีสติกว่านี้!"\n\nถ้อยคำนั้นประหนึ่งการทุบตี [disciple_candidate.Custom2('MyCharacterIntroduction', ROOT.Char)] ศิษย์ของ [rival_elder.GetHerHis] เหล่าอาลักษณ์ชะงักกลางคัน หมึกหยดลงบนพู่กัน [disciple_candidate.GetSheHe|U] ก้มหน้า [disciple_candidate.GetHerHis] ต่ำ แก้มแดงก่ำ ไหล่แข็งเกร็งราวกับกำลังต้านทานสายฝน"
 az_debate.0007.a: ""อย่าปล่อยให้อารมณ์ของผู้อื่นมาตัดสินตัวตนของเจ้า""
 az_debate.0007.b: ""บอกข้ามาว่า [rival_elder.GetSheHe] ทำสิ่งใด""
 az_debate.0007.b.success: "ศิษย์ผู้นั้นตอบรับอย่างกระตือรือร้น"
 az_debate.0007.b.failure: "คำพูดข้าติดขัด"
 az_debate.0007.c: ""ได้โปรด พวกเรามาพูดถึงความกลมเกลียวกันเถิด""

 az_debate.0008.t: "ทางแยกแห่งปราชญ์"
 az_debate.0008.desc: "ณ มุมที่ร่มรื่นของห้องโถง ข้าสังเกตเห็น [neutral_scholar.Custom2('MyCharacterIntroduction', ROOT.Char)] กำลังแลกเปลี่ยนถ้อยคำอย่างสุภาพกับ [rival_leader.Custom2('MyCharacterIntroduction', ROOT.Char)] สมาชิกของ [GetSituation('dynastic_cycle').GetTopParticipantGroupByKey( 'undecided_movement' ).GetName]\n\n"[rival_movement.GetName] บ่มเพาะคุณธรรมผ่านระเบียบวินัย" [rival_leader.GetTitledHouseNameOrFirstName] ยืนกราน แบมือออกเพื่อรับประกันความสงบ "ถึงกระนั้น" [neutral_scholar.GetTitledHouseNameOrFirstName] แทรกขึ้นอย่างนุ่มนวล "ระเบียบวินัยเพียงอย่างเดียวสามารถหล่อเลี้ยงความกลมเกลียวโดยปราศจากความเมตตาได้หรือ?" คิ้วของผู้สนับสนุน [rival_movement.GetNameNoTooltip] ขมวดมุ่น"
 az_debate.0008.a: ""จงพิจารณาความกลมเกลียวที่ [my_movement.GetNameNoTooltip] เสนอ""
 az_debate.0008.b: ""ให้เรามาถกกันด้วยตัวบทคัมภีร์คลาสสิกเถิด""
 az_debate.0008.b.success: "ข้า ทำให้พวกเขาถึงกับพูดไม่ออก"
 az_debate.0008.b.failure: "พวกเขาพยักหน้าอย่างไม่ประทับใจ"
 az_debate.0008.c: ""มาเถิด [neutral_scholar.GetTitledHouseNameOrFirstName] แล้วข้าจะแสดงให้ท่านเห็นคุณธรรมที่แท้จริง""
 az_debate.0008.d: ""ข้าไม่อยากยุ่งเกี่ยว...""
 az_debate.0008.d.flavor: "... และคลายร้อนใต้ร่มเงา"

 az_debate.0009.t: "การก้าวพลาดในห้องโถง"
 az_debate.0009.desc: "[errant_disciple.Custom2('MyCharacterIntroduction', ROOT.Char)] ลุกขึ้นอย่างมั่นใจ กระแอมในคอ [errant_disciple.GetHerHis] "[Glossary( 'ปรมาจารย์', 'CONFUCIUS_GLOSS' )] กล่าวไว้ว่า: 'หากผู้ปกครองปกครองโดย [Glossary('พิธีกรรม', 'CONFUCIAN_LI')] ก็เปรียบดังดาวเหนือ และดวงดาวทั้งปวงจะโคจรคำนับ!'"\n\nเสียงหัวเราะระลอกหนึ่งดังขึ้นในห้องโถง [stickler_scholar.Custom2('MyCharacterIntroduction', ROOT.Char)] เอียงคอ [stickler_scholar.GetHerHis] น้ำเสียงนุ่มนวลดุจแพรไหม: "น่าสนใจ... ทว่าในคัมภีร์หลุนอวี่มิได้กล่าวถึงพิธีกรรม แต่กล่าวถึง [Glossary( 'คุณธรรม', 'CONFUCIAN_DE')] ต่างหาก คุณธรรมต่างหากที่ยึดเหนี่ยวดวงดาวไว้ มิใช่พิธีรีตอง""
 CONFUCIAN_LI: "หมายถึง 'หลี่' หรือ 'พิธีกรรม' - ความเหมาะสมทางพิธีกรรมและการปฏิบัติตามแบบแผนที่ถูกต้อง ซึ่งรักษาความกลมเกลียวในสังคมและสะท้อนถึงคุณธรรมภายใน"
 az_debate.0009.a: ""มิใช่ถ้อยคำ แต่เป็นเจตนาต่างหากที่สำคัญ""
 az_debate.0009.b: "เบี่ยงเบนความสนใจในห้องโถงด้วยเกร็ดเล็กเกร็ดน้อยอันสุภาพ"
 az_debate.0009.d: ""มาเถิด [errant_disciple.GetFirstNameNoTooltip] พวกเราไปที่อื่นกัน""

 az_debate.0010.t: "บทกวีแฝงหนาม"
 az_debate.0010.desc: "ข้ามอง [poet.Custom2('MyCharacterIntroduction', ROOT.Char)] ขับขานบทสุดท้ายของบทกวี [poet.GetHerHis]: "ลำต้นคดเคี้ยวพุ่งสู่ฟากฟ้า รากหยั่งลึก กิ่งก้านหนักอึ้งด้วยเงาทมิฬ"\n\nเสียงพึมพำแสดงความชื่นชมดังมาจากฝูงชน\n\n[critic.Custom2('MyCharacterIntroduction', ROOT.Char)|U] เอนตัวเข้ามาใกล้ กระซิบที่หูข้า: "บทกวีของ [poet.GetFirstNamePossessiveNoTooltip] มิใช่เพียงภาพธรรมดา มันส่อเป็นนัยว่า [ROOT.Char.GetTopLiege.GetTitleAsName] กำลังเบี่ยงเบนไปจากอาณัติแห่งสวรรค์ ว่าความเสื่อมโทรมกำลังฟักตัวโดยไม่มีใครเห็น...""
 az_debate.0010.a: ""เป็นการเยาะเย้ย [ROOT.Char.GetLiege.GetTitleAsNameNoTooltip] ของเราอย่างชัดเจน!""
 az_debate.0010.b: "ข้าจะขอคำปรึกษาจาก [poet.GetHerHis] เป็นการส่วนตัว"
 az_debate.0010.c: ""ไม่เอาน่า — มันก็แค่ศิลปะ!""
 tgp_subtle_counsel_modifier: "คำปรึกษาอันแยบยล"
 tgp_subtle_counsel_modifier_desc: "ตัวละครนี้กำลังขอคำปรึกษาจากผู้เชี่ยวชาญด้านความแยบยล"

 az_debate.0011.t: "การสังเกตการณ์ผู้อาวุโส"
 az_debate.0011.desc: "การโต้แย้งดำเนินไปอย่างเชื่องช้าเป็นจังหวะ ทุกถ้อยคำของ [observed_elder.Custom2('MyCharacterIntroduction', ROOT.Char)] กังวานประดุจเสียงระฆังวัดที่ตีเป็นจังหวะ\n\n"พิธีกรรมคือโครงกระดูกของอาณาจักร; หากปราศจากมัน คุณธรรมย่อมพังทลาย การเพิกเฉยต่อคัมภีร์คลาสสิกคือการเชื้อเชิญความโกลาหล คือการปลูกวัชพืชในที่ที่ควรปลูกข้าว""
 az_debate.0011.a: "บางที [observed_elder.GetSheHe] อาจสอนข้าได้มากกว่านี้?"
 az_debate.0011.b: ""เป็นบทเรียนที่สำคัญ""
 az_debate.0011.c: ""เป็นการรับรอง [GetPlayer.Custom('GetMyMovementShort')] ที่ชัดเจน!""
