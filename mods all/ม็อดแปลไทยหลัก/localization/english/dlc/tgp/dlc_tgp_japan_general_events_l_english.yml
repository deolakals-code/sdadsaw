l_english: 
 tgp_japan_general.8800.t: "[ROOT.Char.GetConfederation.GetName] แผ่อำนาจ"
 tgp_japan_general.8800.desc: "กองกำลังของข้าจงภาคภูมิได้ ที่ได้รับใช้ข้าและ [attacker.GetConfederation.GetName] อย่างดีในการต่อกรกับ [war_loser.GetTitledFirstName] บัดนี้ [target_title.GetName] ได้ตกเป็นของข้า และข้าจะมอบมันแก่ผู้ใดก็ย่อมได้\n\nคงเป็นการสุขุมที่จะรับรองว่าดินแดนเหล่านี้จะตกอยู่กับผู้ติดตามที่ไว้ใจได้และภักดี ผู้ ซึ่งจะรับฟังคำของข้า และอาจถูกเรียกใช้ในภายภาคหน้า"
 tgp_japan_general.8800.a: "[ROOT.Char.Custom2('RelationToMe', SCOPE.sC('family_1') )]ของข้า [family_1.GetFirstNameNoTooltip] จะปกครองได้ดี"
 tgp_japan_general.8800.b: "จงเป็นของ [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('family_2') )]ของข้า [family_2.GetFirstNamePossessiveNoTooltip]"
 tgp_japan_general.8800.c: "จงตกเป็นของ [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('family_3') )]ของข้า [family_3.GetFirstNameNoTooltip]"
 tgp_japan_general.8800.e: "[ROOT.Char.Custom2('RelationToMe', SCOPE.sC('fallback_1') )]ของข้า [fallback_1.GetFirstNameNoTooltip] จะพิสูจน์[fallback_1.GetHerselfHimself]"
 tgp_japan_general.8800.f: "ข้าไว้ใจ [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('fallback_2') )]ของข้า [fallback_2.GetFirstNameNoTooltip]"
 tgp_japan_general.8800.g: "เป็น [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('fallback_3') )]ของข้า [fallback_3.GetFirstNameNoTooltip] ผู้สมควรได้รับมัน"
 tgp_japan_general.8800.h: "ข้ายังมิได้ตัดสินใจ..."
 tgp_japan_general_8800_custom: "ผู้รับอื่น ๆ ที่เป็นไปได้ทั้งหมด"
 tgp_japan_general.8800.cadet_tt: "จะก่อตั้ง [house|E] ใหม่"
 new_ceremonial_liege_message_title: "การสถาปนา [ceremonial_liege.GetTitleAsNameNoTooltip]"
 new_ceremonial_liege_message_effect: "[ceremonial_liege.GetTitledFirstName] ได้เสด็จขึ้นครอง [ceremonial_title.GetDefinitiveName|l]"
 tgp_japan_general.9100.t: "[ROOT.Char.GetTitleAsNameNoTooltip] องค์ใหม่"
 tgp_japan_general.9100.shoulders: "ภาระหน้าที่ในการนำพา [title.GetTierAsNameNoTooltip] จึงตกมาอยู่บนบ่าของข้า"
 tgp_japan_general.9100.desc_murdered:0 "สืบ เนื่องจากการสิ้นชีพอันน่าสลดและ #EMP โชคร้าย#! ของ [previous_holder.Custom2('MyCharacterIntroduction', ROOT.Char)] $tgp_japan_general.9100.shoulders$"
 tgp_japan_general.9100.desc_dead:0 "หลังจากการจากไปของ [previous_holder.Custom2('MyCharacterIntroduction', ROOT.Char)] $tgp_japan_general.9100.shoulders$"
 tgp_japan_general.9100.desc_joko: "หลังจากการสละราชย์ของ [previous_holder.Custom2('MyCharacterIntroduction', ROOT.Char)] $tgp_japan_general.9100.shoulders$"
 tgp_japan_general.9100.desc_alive:0 "บัดนี้จึงเป็นหน้าที่ของข้าที่จะนำพา [title.GetTierAsNameNoTooltip] อันกว้างใหญ่ไพศาลที่ [previous_holder.Custom2('MyCharacterIntroduction', ROOT.Char)] ได้ทิ้งไว้เบื้องหลัง"
 tgp_japan_general.9100.desc: "\n\nข้ายืนอยู่เบื้องหน้าเหล่าข้าหลวง ขยับมงกุฎใหม่ของข้า และ [ROOT.Char.Custom('quirk_pos_personal_present')] โอ้ สิ่งต่าง ๆ ที่ข้าจะ ทำให้สำเร็จ!"
 tgp_japan_general.9100.a: "[ROOT.Char.GetTitleAsNameNoTooltip] จงเจริญ!"
 tgp_japan_general.9120.t: "เบื้องหลังบัลลังก์"
 tgp_japan_general.9120.desc: "ด้วยการจากไปของ [previous_holder.GetTitledFirstNamePossessive] และอิทธิพลที่เพิ่มขึ้นของข้า ในที่สุดกิจการของรัฐก็กลับมาอยู่ภายใต้พระราชอำนาจของจักรวรรดิเกือบทั้งหมดอีกครั้ง\n\nตามธรรมเนียมแล้ว หลายคนคาดหวังให้ข้าปลงผมและสละราชบัลลังก์ให้แก่ทายาท [emperor_player_heir.GetFirstName] เมื่อสายเลือดมั่นคงแล้ว โดยละทิ้งหน้าที่เชิงพิธีการของ [ROOT.Char.GetTitleAsNameNoTooltip] เพื่อที่ข้าจะได้มุ่งเน้นไปที่การเมืองที่เร่งด่วนกว่าในปัจจุบัน"
 tgp_japan_general.9120.a: "ได้เวลาเข้าสู่การปกครองในอารามแล้ว..."
 tgp_japan_general.9120.b: "#EMP ข้า#! คือ [ROOT.Char.GetTitleAsNameNoTooltip] และ #EMP ข้า#! จะปกครอง!"
 tgp_japan_general.9300.t: "$game_concept_imperial_policy$:"
 tgp_japan_general.9300.t.defense_mobilization_law: "$tgp_japan_general.9300.t$ $defense_mobilization_law$"
 tgp_japan_general.9300.t.disarmament_law: "$tgp_japan_general.9300.t$ $disarmament_law$"
 tgp_japan_general.9300.t.isolation_law: "$tgp_japan_general.9300.t$ $isolation_law$"
 tgp_japan_general.9300.t.fortification_initative_law: "$tgp_japan_general.9300.t$ $fortification_initative_law$"
 tgp_japan_general.9300.t.imperial_expansion_law: "$tgp_japan_general.9300.t$ $imperial_expansion_law$"
 tgp_japan_general.9300.t.manor_reform_law: "$tgp_japan_general.9300.t$ $manor_reform_law$"
 tgp_japan_general.9300.t.bandit_crackdown_law: "$tgp_japan_general.9300.t$ $bandit_crackdown_law$"
 tgp_japan_general.9300.t.religious_reform_law: "$tgp_japan_general.9300.t$ $religious_reform_law$"
 tgp_japan_general.9300.restored_emperor: "ขนาบข้างด้วยเหล่าข้าราชบริพารและผู้ติดตาม ข้าเฝ้ามองอย่างสงบนิ่ง ในขณะที่เจ้าพนักงานจดบันทึกและประทับตรา เพื่อสรุปนโยบายใหม่ของข้าสำหรับ [liege.GetPrimaryTitle.GetTierAsNameNoTooltip] ทั้งปวง\n\n"
 tgp_japan_general.9300.liege: "ภายใต้สายพระเนตรอันเคร่งขรึมของ [ceremonial_liege.GetTitledFirstName] ข้าจดบันทึกและประทับตราในกฤษฎีกาเป็นครั้งสุดท้าย อันเป็นนโยบายใหม่สำหรับ [liege.GetPrimaryTitle.GetTierAsNameNoTooltip] ทั้งปวง\n\n"
 tgp_japan_general.9300.ceremonial_liege: "ขนาบข้างด้วยเหล่าข้าราชบริพารและผู้ติดตาม ข้าเฝ้ามอง [liege.GetTitledFirstName] อย่างสงบนิ่ง ขณะที่ [liege.GetSheHe] จดบันทึกและประทับตรา สรุปนโยบายใหม่สำหรับ [liege.GetPrimaryTitle.GetTierAsNameNoTooltip] ทั้งปวง\n\n"
 tgp_japan_general.9300.vassal_ceremonial: "ทุกคนต่างรอคอยข่าวสารจากพระราชวังหลวงใน [liege.GetCapitalLocation.GetBaronyNameExplicitlyNoTooltip] ที่ ซึ่งวันนี้ [liege.GetTitledFirstName] จะประกาศนโยบายใหม่ในนามของ [ceremonial_liege.GetTitledFirstName]\n\n"
 tgp_japan_general.9300.vassal: "ทุกคนต่างรอคอยข่าวสารจากพระราชวังหลวงใน [liege.GetCapitalLocation.GetBaronyNameExplicitlyNoTooltip] ที่ ซึ่งวันนี้ [liege.GetTitledFirstName] จะประกาศนโยบายใหม่สำหรับ [liege.GetPrimaryTitle.GetTierAsNameNoTooltip] ทั้งปวง\n\n"
 tgp_japan_general.9300.defense_mobilization_law: "#EMP "[liege.GetPrimaryTitle.GetNameNoTierNoTooltip] กำลังถูกคุกคามโดยภัยใหม่ หากประเทศจะยังคงเข้มแข็งและเป็นอิสระ ประชาชนต้องเตรียมพร้อมสำหรับสงคราม!"#!"
 tgp_japan_general.9300.disarmament_law: "#EMP "[liege.GetPrimaryTitle.GetNameNoTierNoTooltip] ถูกรุมเร้าด้วยความขัดแย้งและความอยุติธรรม ความรุนแรงต้องถูกจำกัด และอาวุธต้องถูกยึดจากผู้ที่ไม่มีเหตุอันควร!"#!"
 tgp_japan_general.9300.isolation_law: "#EMP "[liege.GetPrimaryTitle.GetNameNoTierNoTooltip] กำลังทนทุกข์ภายใต้อิทธิพลอันเสื่อมทรามของคนนอก ผู้ซึ่งความคิดและผลประโยชน์ของพวกเขากำลังหว่านเพาะความแตกแยก พวกเขาต้องถูกขับไล่ออกไป!"#!"
 tgp_japan_general.9300.fortification_initative_law: "#EMP "ภัยแห่งสงครามกำลังคืบคลานเหนือ [liege.GetPrimaryTitle.GetNameNoTierNoTooltip] เพื่อประโยชน์ของส่วนรวม พวกเราต้องสร้างการป้องกันที่แข็งแกร่งเพื่อให้แน่ใจว่าเราพร้อมสำหรับสิ่งที่เลวร้ายที่สุด"#!"
 tgp_japan_general.9300.imperial_expansion_law: "#EMP "ในยามจำเป็น [liege.GetPrimaryTitle.GetNameNoTierNoTooltip] ได้ปกป้องตนเองอย่างเที่ยงธรรมด้วยการขยายพรมแดนของประเทศ — อีกครั้งที่เราต้องรุกคืบไปข้างหน้า!"#!"
 tgp_japan_general.9300.manor_reform_law: "#EMP "ความเจริญรุ่งเรืองอันยิ่งใหญ่ของผู้ถือครองคฤหาสน์ต้องแลกมาด้วยต้นทุนของ [liege.GetPrimaryTitle.GetNameNoTierNoTooltip] และประชาชน ทรัพย์สินของพวกเขาต้องถูกจำกัด!"#!"
 tgp_japan_general.9300.bandit_crackdown_law: "#EMP "ความนิ่งนอนใจได้ก่อให้เกิดการปล้นสะดมและความเสื่อมทราม และประชาชนก็ทนทุกข์เพราะเหตุนั้น ความสงบเรียบร้อยต้องถูกฟื้นฟูเพื่อประโยชน์สุขของ [liege.GetPrimaryTitle.GetNameNoTierNoTooltip]!"#!"
 tgp_japan_general.9300.religious_reform_law: "#EMP "วิถีชีวิตของนักบวชและผู้คนกำลังขัดแย้งกัน หลักคำสอนเก่าต้องถูกตรวจสอบหากเราจะฟื้นฟูจิตวิญญาณของ [liege.GetPrimaryTitle.GetNameNoTierNoTooltip]!"#!"
 tgp_japan_general.9300.outro: "ผู้ส่งสารจะถูกส่งออกไปในไม่ช้ายังทุกหัวระแหงของ [ROOT.Char.GetTopLiege.GetPrimaryTitle.GetBaseNameNoTooltip] เพื่อป่าวประกาศกฤษฎีกาของ [ceremonial_liege.GetTitleAsNamePossessiveNoTooltip]:\n\n"
 tgp_japan_general.9300.a: "จงเป็น เช่นนั้น"
 tgp_japan_general.9300.a.disarmament_soryo: "$epidemic_events.1061.a$"

#Eradicate CB lose
tgp_japan_soryo_eradicate_cb_heir_move_manor_to_savior_tt: "[loser_heir.GetShortUIName] จะย้าย [manor|E] ของ [loser_heir.GetHouse.GetName] ไปยัง [savior.GetCapitalLocation.GetBaronyNameExplicitly]"
tgp_japan_soryo_eradicate_cb_heir_move_to_savior_tt: "ท่านจะย้าย [manor|E] ของ [loser.GetHouse.GetName] ไปยัง [savior.GetCapitalLocation.GetBaronyNameExplicitly]"
tgp_japan_soryo_eradicate_cb_heir_move_to_cap_tt: "ท่านจะย้าย [manor|E] ของ [loser.GetHouse.GetName] ไปยัง [loser_heir.GetTopLiege.GetCapitalLocation.GetBaronyNameExplicitly]"
 eradicated_my_house_opinion: "กวาดล้างตระกูลของข้า"
 every_house_member_mad: "สมาชิก [house|E] ทุกคนที่รอดชีวิต"
 tgp_japan_general.9550.t: "จนมุมเพื่อรอเชือด"
 tgp_japan_general.9550.desc.intro.a: "สงครามนี้ การยุยงของข้า ผลตอบแทน คือหายนะของตระกูลข้า"
 tgp_japan_general.9550.desc.intro.b: "ใครจะรู้ว่าความบาดหมางของเรากับ [winner.GetHouse.GetNameNoTooltip] จะนำไปสู่สิ่งนี้?"
 tgp_japan_general.9550.desc: "เสียงกรีดร้องของนักรบและผู้ติดตามของข้าดังใกล้เข้ามาทุกที เสียงร้องอันสิ้นหวังของพวกเขาคือคำสัญญาถึงชะตากรรมที่จะเกิดขึ้นกับ [ROOT.Char.GetHouse.GetName] ทั้งปวงในไม่ช้า"
 tgp_japan_general.9550.desc.alone: "\n\nข้าหมอบคลาน อย่างโดดเดี่ยว"
 tgp_japan_general.9550.desc.fam: "\n\nครอบครัวของข้าและข้ารวมกลุ่มกันอย่างหวาดกลัว"
 tgp_japan_general.9550.desc.end: "ทุกวินาทีที่ผ่านไป เหล่าสุนัขจิ้งจอกกำลังกระชั้นชิดเข้ามาหาไก่ในกรงที่เราได้กลายเป็น\n\nพวกเรา [ROOT.Char.GetHouse.GetNameNoTooltip] จะเผชิญหน้ากับวาระสุดท้ายของเราได้อย่างไร?"
 every_close_family_house_member_in_court: "ท่านและทุก [spouse|E] และสมาชิก [house|E] ที่เป็น [close_family|E] ใน [court|E] ของ [loser.GetShortUINamePossessive]"
 every_house_member_in_court: "[spouses|E] ของ [loser.GetShortUINamePossessive] และสมาชิก [house|E] ทุกคนใน [court|E] ของ [loser.GetHerHis]"
 is_killed_by_you_and_you_kill_self: "@death_icon! จะฆ่าตัวตายเพื่อหลีกเลี่ยงความอัปยศด้วยน้ำมือของ [winner.GetShortUIName]"
 tgp_japan_general.9550.a.alone: "ข้าจะไม่ตายอย่างน่าอดสู!"
 tgp_japan_general.9550.a.alone.flavor: "ข้าตายด้วยน้ำมือของข้า แต่เพียงผู้เดียว"
 tgp_japan_general.9550.a.fam: "พวกเราจะไม่ตายอย่างน่าอดสู!"
 tgp_japan_general.9550.a.fam.flavor: "พวกเราจะตายด้วยน้ำมือของข้า แต่เพียงผู้เดียว! ทายาทของข้า [loser_heir.GetShortUIName] จะหลบหนีไปยังดินแดนของ [savior.GetName] ผู้เห็นใจ"
 tgp_japan_general.9550.b: "จงใช้ปีกของเราบินหนีออกจากกรงนี้!"
 tgp_japan_general.9550.b.success: "ท่านสามารถหลบหนีการกำจัดล้างได้"
 tgp_japan_general.9550.b.failure: "ท่านหลบหนีการกำจัดล้างไม่สำเร็จ"
 tgp_japan_general.9550.b.flavor: "เราจะรวมกลุ่มกันใหม่และสักวันจะล้างแค้น [winner.GetHouse.GetNameNoTooltip]"
 tgp_japan_general.9550.c: "เราต้องเสี่ยงโชคกับความเมตตาของสุนัขจิ้งจอก"
 #Eradicate CB win
 tgp_japan_general.9551.t: "กำจัดล้าง [loser.GetHouse.GetNameNoTooltip]"
 tgp_japan_general.9551.desc.intro: ""แม้ว่ามันจะเป็นการลบหลู่ ข้าก็ปรารถนาที่จะกลับชาติมาเกิดเป็นตัวข้าเอง เพื่อที่ข้าจะได้สังหารเจ้าในชาติหน้า [winner.GetFirstNameNoTooltip]—"\n\n[loser.GetTitledFirstName] พ่นคำพูดออกมา ก่อนที่ศีรษะของ[loser.GetHerHis]จะกลิ้งลงสู่พื้นสนาม ปากของ[loser.GetHerHis]ยังคงสาปแช่งข้าอย่างไร้เสียง ช่างเป็นความตายที่เสื่อมทรามทางจิตวิญญาณพอๆ กับความอัปยศอดสู ศพไร้ศีรษะของ[loser.GetHerHis|U] นอนแน่นิ่งราวกับไก่ที่ถูกถอนขน ก้อนเนื้อที่แหลกเหลวนี้ ไม่เป็นภัยคุกคามอีกต่อไป และไม่ใช่ก้อนเนื้อของมนุษย์อีกต่อไป\n\n[loser_region.GetBaseNameNoTierNoTooltip] นั้นสะอาดสะอ้านขึ้นเมื่อปราศจาก [loser.GetHouse.GetName]..."
 tgp_japan_general.9551.desc.alt.intro: "โอ้ [loser.GetHouse.GetName] เจ้าเล่ห์! ก่อนที่เราจะจับกุม [loser.GetName] ได้ [loser.GetSheHe] "
 tgp_japan_general.9551.desc.alt.suicide: "ฆ่าตัวตายพร้อมกับคนใกล้ชิด"
 tgp_japan_general.9551.desc.alt.escape: "หลบหนีไปยังดินแดนของ [savior.GetName]"
 tgp_japan_general.9551.desc.alt.outro: "\n\nโชคยังดีที่ยังมี [loser.GetHouse.GetNameNoTooltip] คนอื่นให้ฆ่า"
 tgp_japan_general.9551.a: "ศีรษะของพวกมันจะป่าวประกาศถึงการกำจัดล้างของพวกมัน!"
 tgp_japan_general.9551.a.flavor: "ใบหน้าอันชั่วร้ายของพวกมันจะประดับอยู่บนยอดแหลมนอกคฤหาสน์เก่าของพวกมัน"
 rival_eradicated_modifier: "ตระกูลคู่แข่งถูกกวาดล้าง"
 rival_eradicated_modifier_desc: "[house|E] ของท่านเห็นสมควรที่จะทำสงครามและกำจัดล้างสายเลือดของ [house|E] [rival|E] ขณะที่ผู้อื่นตัดสิน ความกลัวก็ ทำให้พวกเขาเงียบงัน"
 house_eradicated_modifier: "ตระกูลถูกกำจัดล้าง"
 house_eradicated_modifier_desc: "[house|E] ของท่านถูกกำจัดล้างไปเกือบหมดโดย [house|E] [rival|E] ไม่มีผู้ใดเกรงกลัวท่าน ความอัปยศและความเกลียดชังนี้เป็นเชื้อเพลิงชั้นดีสำหรับการล้างแค้น"
 house_eradicated_suicide_modifier: "ตระกูลถูกกำจัดล้าง"
 house_eradicated_suicide_modifier_desc: "ก่อนที่ [house|E] ของท่านจะถูกกำจัดล้างไปเกือบหมดโดย [house|E] [rival|E] พวกเขาได้ฆ่าตัวตายเพื่อหลีกเลี่ยงความอัปยศ ความเกลียดชังที่ยังคงอยู่เป็นเชื้อเพลิงชั้นดีสำหรับการล้างแค้น"

 tgp_house_blocs.1001.t: "[bloc_leader.GetConfederation.GetName]: เรียกเข้าร่วมรบ"
 tgp_house_blocs.1001.desc: "ความเป็นผู้นำของตระกูล [bloc_leader.GetHouse.GetBaseName] ยังคงเด็ดเดี่ยวและกล้าหาญ เช่นเคย และบัดนี้ [bloc_leader.GetTitledFirstName] กำลังพยายามรวบรวมพันธมิตรของเราเพื่อต่อต้าน [defender.GetName]\n\nไม่ว่าผู้ใดยืนอยู่ข้างหลัง หรือต่อต้าน [bloc_leader.GetConfederation.GetName] ก็มิอาจเพิกเฉยต่อพลังของเราได้ และพลังนั้นมาจากความเป็นหนึ่งเดียวของเรา คงไม่น่าแปลกใจนักที่จะพบนักรบ [ROOT.Char.GetHouse.GetBaseNameNoTooltip] ที่ถูกนับรวมอยู่ในแถวของกองทัพ [bloc_leader.GetHouse.GetBaseNameNoTooltip]"
 tgp_house_blocs.1001.a: "เราจะยืนหยัดไปด้วยกัน!"
 tgp_house_blocs.1001.b: "นี่ไม่ใช่สงครามของข้า"
 
