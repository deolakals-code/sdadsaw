 assimilate_to_mandala_decision: "ผสมกลมกลืนสู่การปกครองแบบมณฑล"
 assimilate_to_mandala_decision_government_desc: "เทพผู้เดินดิน, การจัดระเบียบการปกครอง เช่นนี้ดูจะเป็นประโยชน์ต่อการดำรงอยู่ของเรา ลองดูเถิดว่าเราจะเรียนรู้อะไรได้บ้างขณะที่เราผสมกลมกลืนเข้ากับวิถีการปกครองนี้"
 assimilate_to_mandala_decision_faith_desc: "เราควรพิจารณาแบบอย่างนี้และผสมกลมกลืน ในฐานะผู้อุทิศตนอย่างแท้จริงต่อการดำรงอยู่ของเทวราชานี้, เราย่อมมีชีวิตที่สมบูรณ์ยิ่งขึ้น — และผู้ใดจะรู้; เราอาจมีโอกาสเข้าร่วมกับกลุ่มคนโปรดไม่กี่คนนั้น..."
 assimilate_to_mandala_decision_desc: "เราเป็นเพียงมนุษย์, ถูกนำโดยผู้ที่ยิ่งใหญ่กว่าตน เราควรปรับเปลี่ยนวิถีของเราและเปลี่ยนแปลงอย่างแท้จริงเพื่อเป็นผู้อุทิศตนต่อการดำรงอยู่ของเทวราชาอันศักดิ์สิทธิ์นี้ — เพื่อประโยชน์สุขของเหล่าประชาราษฎร์, แน่นอน"
 assimilate_to_mandala_decision_tooltip: "[AddLocalizationIf( And( Not( GetPlayer.GetGovernment.HasGovernmentFlag( 'government_is_mandala' ) ), Not( ObjectsEqual( GetPlayer.GetFaith, GetPlayer.GetOverlord.GetFaith ) ) ), 'assimilate_to_mandala_decision_tooltip_both' )][AddLocalizationIf( And( Not( GetPlayer.GetGovernment.HasGovernmentFlag( 'government_is_mandala' ) ), ObjectsEqual( GetPlayer.GetFaith, GetPlayer.GetOverlord.GetFaith ) ), 'assimilate_to_mandala_decision_tooltip_government' )][AddLocalizationIf( And(  GetPlayer.GetGovernment.HasGovernmentFlag( 'government_is_mandala' ), Not( ObjectsEqual( GetPlayer.GetFaith, GetPlayer.GetOverlord.GetFaith ) ) ), 'assimilate_to_mandala_decision_tooltip_faith' )]" #It is not cursed if it works :colbert:
 assimilate_to_mandala_decision_tooltip_both: "ละทิ้ง [government|E] ปัจจุบันของท่าน เช่นเดียวกับ [faith|E] เพื่อเปลี่ยนไปใช้การปกครองและศรัทธาของ [overlord|E] ของท่าน"
 assimilate_to_mandala_decision_tooltip_government: "ละทิ้ง [government|E] ปัจจุบันของท่าน เพื่อเปลี่ยนเป็น [mandala_government|E]"
 assimilate_to_mandala_decision_tooltip_faith: "ละทิ้ง [faith|E] ปัจจุบันของท่าน เพื่อเปลี่ยนไปนับถือ [GetPlayer.GetOverlord.GetFaith.GetTextIcon][GetPlayer.GetOverlord.GetFaith.GetName]"
