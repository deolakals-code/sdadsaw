l_english: 
 restore_mandala_capital_decision: "ฟื้นฟูเมืองหลวงมณฑล"
 restore_mandala_capital_decision_desc: "ซากปรักหักพัง, เศษหิน, สิ่งที่หลงเหลือ... เราจักฟื้นคืนจากเถ้าธุลีเพื่อบูรณะและฟื้นฟูสิ่งที่สูญสิ้น ความรุ่งโรจน์ของเราจักฉายฉานอีกครั้ง, ทอดเงาทับผู้ที่มุ่งหมายทำลายมัน"
 restore_mandala_capital_decision_tooltip: "ท่านจะฟื้นฟูเมืองหลวงของท่านสู่ความรุ่งโรจน์ดังเดิม"
 restore_mandala_capital_decision_confirm: "ฟื้นฟูเมืองหลวง"

 convert_to_mandala_government_decision: "ยอมรับการปกครองแบบมณฑล"
 convert_to_mandala_government_decision_desc: "มันถูกลิขิตไว้ในดวงดาว — สัญญาณแห่งความเป็นเทวะอันส่องสว่างและยั่วยวน เรามีเทวราชาผู้เริ่มเปล่งบารมีในหมู่เรา, ผู้ ซึ่งจะปกครองทั่วทุกภพภูมิ"
 convert_to_mandala_government_decision_tooltip: "ละทิ้ง [government|E] ปัจจุบันของท่าน และกลายเป็น [ruler|E] แบบ [mandala|E]"
 convert_to_mandala_government_decision_confirm: "ให้มณฑลได้ปกครอง"

