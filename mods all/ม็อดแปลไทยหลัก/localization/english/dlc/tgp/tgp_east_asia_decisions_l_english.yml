 visit_local_shrine_decision: "ประกอบพิธีบูชายัญ"
 visit_local_shrine_decision_desc: "เรามิจำเป็นต้องเดินทางไกลเพื่อแสดงความเลื่อมใสอย่างแท้จริง การเดินทางสั้นๆ ไปยังศาลเจ้าใกล้ๆ และถวายเครื่องบูชายัญ; เราสามารถรักษาความโปรดปรานจากสรวงสวรรค์ไว้ได้ในอนาคตอันใกล้"
 visit_local_shrine_decision_confirm: "เริ่มการเดินทางเถิด"
 sacrifice_to_heaven: "เดินทางจาริกแสวงบุญไปยังศาลเจ้าในภูมิภาคเพื่อถวาย [gold_i][gold|E] หรือ [prestige_i][prestige|E] เพื่อแลกกับ [piety|E]"

 local_rites.1.t: "การเดินทางอันศักดิ์สิทธิ์"
 local_rites.1.desc: "แม้ว่าการถวายเครื่องบูชาอันศักดิ์สิทธิ์จะสามารถทำได้ทุกวัด, แม้กระทั่งศาลเจ้าท้องถิ่นของข้าใน [capital_location.GetNameNoTooltip], แต่ก็ชัดเจนว่ามิใช่ทุกพื้นที่ศักดิ์สิทธิ์จะเท่าเทียมกัน\n\nการไปเยือนชุมชนวัดที่อุทิศตนโดยเฉพาะอาจใช้เวลาค่อนข้างมาก, แต่น่าจะสร้างความประทับใจได้มากกว่า"
 local_rites.1.home: "ศาลเจ้าของเราเองก็เพียงพอแล้ว"
 local_rites.1.home.tt: "การถวายเครื่องบูชาที่ศาลเจ้าท้องถิ่นใน [tooltip_loc.GetNameNoTooltip] จะช่วยประหยัดเวลาการเดินทางของเรา\nการถวายเครื่องบูชาที่นี่จะใช้ [gold_i][THIS.ScriptValue('miniscule_gold_value')|-0] เพื่อแลกกับ [piety_i][THIS.ScriptValue('minor_piety_gain')|+0]"
 local_rites.1.mount_tai: "ข้าต้องไปประกอบพิธีบูชายัญที่ภูเขาไท่ซาน"
 local_rites.1.fengshan.tt: "การถวายเครื่องบูชาหนึ่งครั้งต่อราชวงศ์ที่มีผลกระทบอย่างลึกซึ้ง\nการถวายนี้จะใช้ [treasury_i][THIS.ScriptValue('major_treasury_value')|-0] และ [prestige_i][THIS.ScriptValue('massive_prestige_value')|-0] เพื่อแลกกับ [piety_i][THIS.ScriptValue('major_piety_gain')|+0] และ [legitimacy_i][THIS.ScriptValue('massive_legitimacy_gain')|+0]"
 local_rites.1.major_shrine: "ศาลเจ้าที่ [point_of_interest_location.GetNameNoTooltip]"
 local_rites.1.major_shrine.tt: "การถวายเครื่องบูชาที่นี่จะใช้ [gold_i][THIS.ScriptValue('medium_gold_value')|-0] หรือ [prestige_i][THIS.ScriptValue('medium_prestige_value')|-0] เพื่อแลกกับ [piety_i][THIS.ScriptValue('major_piety_gain')|+0]"
 local_rites.1.normal.tt: "การถวายเครื่องบูชาที่นี่จะใช้ [gold_i][THIS.ScriptValue('minor_gold_value')|-0] หรือ [prestige_i][THIS.ScriptValue('minor_prestige_value')|-0] เพื่อแลกกับ [piety_i][THIS.ScriptValue('medium_piety_gain')|+0]"
 local_rites.1.hills: "สถานที่ศักดิ์สิทธิ์ในเนินเขาที่ทอดยาวของ [hills_location.GetNameNoTooltip]"
 local_rites.1.forest: "วัดป่าแห่ง [forest_location.GetNameNoTooltip]"
 local_rites.1.mountains: "ศาลเจ้าบนภูเขาใน [mountains_location.GetNameNoTooltip]"
 local_rites.1.temple_holding: "วัดแห่ง [temple_holding_location.GetNameNoTooltip]"
 local_rites.2.toast: "ท่านได้เดินทางมาถึงศาลเจ้าแล้ว"


 local_rites.3.t: "บูชาสวรรค์"
 local_rites.3.t.fengshan: "เฟิงและซาน"
 local_rites.3.fallback.t: "บูชาเหล่าทวยเทพ"
 local_rites.3.desc_mt_tai_huangdi: "มีคนเพียงไม่กี่คนที่ได้เห็นพิธีเฟิงซานที่ภูเขาไท่ซาน, แต่กระนั้นก็มีเพียงไม่กี่คนที่ไม่รู้ว่ามันหมายความว่าอะไร แท่นบูชาใหม่ถูกสร้างขึ้นจากดินบนยอดเขาไท่ซาน, และเบื้องล่างไกลออกไป พื้นที่ถูกถางเพื่อเป็นเกียรติแก่ปฐพี\n\nบรรพบุรุษของข้าส่วนใหญ่ไม่เคยพยายามที่จะสื่อกลางระหว่างสวรรค์และโลก, ช่างเป็นโอกาสที่หาได้ยากนักที่จะปกป้องอนาคตของราชวงศ์ [GetTitleByKey('h_china').GetBaseNameNoTierNoTooltip]"
 local_rites.3.desc_important_shrine: "ศาลเจ้าที่ [shrine_location.GetName] นั้นน่าประทับใจพอๆ กับความเก่าแก่, และผู้ดูแลก็ดูคุ้นเคยกับผู้มาเยือนคนสำคัญ เมื่อเฝ้ามองสถานที่ศักดิ์สิทธิ์อันเป็นที่ ซึ่งผู้อุทิศตนนับไม่ถ้วนได้แสดงความเคารพก่อนหน้าข้า ข้าก็เปี่ยมไปด้วยความเคารพยำเกรง\n\n"การอุปถัมภ์เป็นสิ่งสำคัญในการบำรุงรักษาสถานที่ศักดิ์สิทธิ์ เช่นนี้ ผู้มาเยือนมักจะบริจาคเพื่อสนับสนุนชุมชนสงฆ์" [companion.GetName] มองข้าอย่างสุภาพ, แต่ก็ค่อนข้างสงสัยใคร่รู้"
 local_rites.3.desc_at_home: "การถวายเครื่องบูชาในศาลเจ้าประจำตระกูลที่ [shrine_location.GetName] อาจไม่น่าประทับใจเท่าการถวายในวัดใหญ่, แต่อาจมีความสำคัญเท่าเทียมกันในฐานะการแสดงความเลื่อมใส\n\nขณะที่ข้าประกอบพิธีถวายเครื่องบูชา ข้าก็เปี่ยมไปด้วยความสงบภายในใจที่ข้าไม่ได้รู้สึกมานานแล้ว"
 local_rites.3.desc_mountain_shrine: "การเดินทางผ่านขั้นบันไดมากมายไปยังศาลเจ้าบนยอดเขาใน [shrine_location.GetName] นั้นเหน็ดเหนื่อย แต่ก็เอื้อต่อการไตร่ตรองเป็นอย่างดี การจาริกแสวงบุญครั้งนี้เป็นสิ่งที่ข้ามีแนวโน้มจะหวนนึกถึงไปอีกนานหลังจากพิธีถวายเครื่องบูชาของข้าเสร็จสิ้น\n\nเมื่อเราไปถึงยอดเขา, [companion.GetName] หันมาหาข้า "การรักษาสถานที่ เช่นนี้ให้คงอยู่เป็นสิ่งที่น่าชื่นชม บางทีอาจมีวิธีที่เราจะสนับสนุนพระที่นี่ได้? มันเป็นธรรมเนียมปฏิบัติ""
 local_rites.3.desc_hills_shrine: "ทิวทัศน์เนินเขาที่ทอดยาวของ [shrine_location.GetName] นั้นงดงาม และเมื่อเราไปถึงศาลเจ้าเพื่อถวายเครื่องบูชา ข้าก็เริ่มรู้สึกถึงความสงบภายในใจที่บางครั้งรู้สึกว่าอยู่ไกลเกินเอื้อม\n\nเมื่อถึงขั้นสุดท้ายของบันไดวัด [companion.GetNameNo] มองมาที่ข้า "มีชุมชนเล็กๆ ที่นี่ที่คอยสนับสนุนศาลเจ้านี้ บางทีเราอาจแสดงการสนับสนุนแก่พวกเขาได้?""
 local_rites.3.desc_forest_shrine: "การเดินทางมาถึงศาลเจ้าเล็กๆ ที่ [shrine_location.GetName] หมายถึงการเดินทางภายใต้ร่มไม้เป็นระยะทางพอสมควร เป็นการยากที่จะจินตนาการถึงสภาพแวดล้อมที่สงบและผ่อนคลายไปกว่านี้ และข้าพบว่าตนเองกำลังคิดว่าจะจดจำช่วงเวลานี้ไปอีกนานหลังจากการจาริกแสวงบุญของข้าสิ้นสุดลง\n\n"เราควรพิจารณาว่าควรช่วยชุมชนที่นี่หรือไม่, และสร้างความมั่นใจในความเจริญรุ่งเรืองของศาลเจ้านี้" ข้าหันไปพบ [companion.GetName] กำลังมองข้าด้วยสีหน้าสงสัยใคร่รู้"
 local_rites.3.desc_holding_shrine: "เมื่อมาถึงศาลเจ้าใน [shrine_location.GetName] ข้าพบว่าตนเองกำลังไตร่ตรองถึงบทบาทและความสำคัญของมัน ยังมีศาลเจ้าที่สำคัญกว่านี้อีกมาก แต่นั่นไม่ได้หมายความว่าที่นี่ไม่ใช่ชุมชนสงฆ์ที่เป็นแบบอย่าง การได้เห็นความเคารพศรัทธาของทุกคนที่อาศัยอยู่ที่นี่เป็นแรงบันดาลใจ\nขณะที่ข้ากำลังเตรียมตัวจากไป [companion.GetName] หันมาหาข้า "ที่นี่เป็นสถานที่ศักดิ์สิทธิ์, ดังนั้นความคิดของข้าต้องคำนึงถึงสิ่งศักดิ์สิทธิ์, แต่ผู้ที่อุทิศตนดูแลสถานที่นี้ก็ควรค่าแก่ความเคารพของเรา เช่นกัน""
 local_rites.3.desc_cynical: "\n\nข้าแทบจะเก็บงำความไม่พอใจไว้ไม่ไหว, แต่บางทีข้าคงต้องทำในสิ่งที่ถูกคาดหวังจากข้า"
 fengshan_option: "ตามบัญชาสวรรค์"
 local_rites.3.pay_gold: "เรามาบริจาคกันเถอะ"
 local_rites.3.pay_prestige: "ข้าไม่มีสิ่งใดจะมอบให้ นอกจากความเลื่อมใสของข้า"
 local_rites.3.pay_at_home: ""ให้เป็น เช่นนั้น""
 local_shrine.optout: "เรื่องทางโลกเรียกร้องความสนใจจากข้า"
 local_shrine.optout.flavor: "การไปเยือนศาลเจ้าสามารถจัดเตรียมในภายหลังได้"
 visit_local_shrine_modifier: "กำลังประกอบพิธีที่ศาลเจ้าท้องถิ่น"
 visit_local_shrine_modifier_desc: "ตัวละครนี้กำลังอุทิศตนเพื่อประกอบพิธีถวายเครื่องบูชาที่ศาลเจ้า"

 seize_mandala_capital_decision: "ยึดศูนย์กลางวัดมณฑล"
 seize_mandala_capital_decision_desc: "ศูนย์กลางวัดที่คู่ควรกับเทวราชาที่แท้จริงอยู่ใกล้แค่เอื้อม? เราควรย้ายที่ตั้ง, และขยายฐานอำนาจของเราจากที่นั่น มันควรจะเป็นประโยชน์สูงสุดแก่เหล่าข้ารับใช้ผู้ภักดีทั้งปวง"
