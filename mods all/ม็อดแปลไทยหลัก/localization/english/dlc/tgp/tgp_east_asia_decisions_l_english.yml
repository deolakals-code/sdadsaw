 create_bunga_mas_decision: "สร้างบุหงามัส"
 create_bunga_mas_decision_tooltip: "จ้างช่างฝีมือท้องถิ่นให้สร้าง [Glossary( 'บุงงามัส', 'BUNGA_MAS_GLOSS' )] [artifact|E] สำหรับท่าน"
 create_bunga_mas_decision_desc: "ต้นไม้ที่ทำจากเงินและทองคำที่ดีที่สุด—สมบัติล้ำค่าเพื่อมอบเป็นเครื่องบรรณาการ ข้าจะนำมันไปยังราชสำนักของเจ้าเหนือหัวและดื่มด่ำกับความรุ่งโรจน์ของมัน!"
 create_bunga_mas_decision_confirm: "ร้องขอบุหงามัส"
 create_bunga_mas_decision_effect: "สร้าง [Glossary( 'บุงงามัส', 'BUNGA_MAS_GLOSS' )] [artifact|E]\n$BULLET_WITH_TAB$เมื่อส่งมอบให้เจ้าเหนือหัว:\n$TAB$$BULLET_WITH_TAB$ได้รับกองของ [GetModifier('bunga_mas_tribute_modifier').GetNameWithTooltip] #WEAK (สูงสุด 3)#!"
