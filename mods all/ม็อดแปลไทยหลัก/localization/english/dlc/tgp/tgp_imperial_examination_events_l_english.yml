 #Caught cheating!
 imperial_examination.6000.t: "ถูกจับได้!"
 imperial_examination.6000.desc: "ข้าเหงื่อแตกพลั่กขณะที่กรรมการคุมสอบ [examiner.GetFirstName] จ้องมองข้าตั้งแต่หัวจรดเท้าอย่างเข้มงวด พลางไพล่ [examiner.GetHerHis] หลัง "ช่าง #EMP กล้า#! นัก, ไอ้เด็กอวดดี ข้าควรจะตรงไปหา [activity.GetHost.GetTitleAsNameNoTooltip|U] และทูลให้ใต้ฝ่าละอองธุลีพระบาท [activity.GetHost.GetHerHis] ทรงทราบถึง #EMP การกระทำอันชั่วร้าย#! ของเจ้า หากเจ้าโชคดี, เจ้าจะ #EMP เพียงแค่#! ถูกแล่หนังออกไปก่อนตาย"\n\nเหงื่อไหลอาบแผ่นหลัง ข้าพยายามประเมินสถานการณ์และกระแอมในลำคอที่แห้งผากของข้า:"
 imperial_examination.6000.a: ""ข้ากำลังถูกใส่ร้าย, ท่านไม่เห็นหรือ?!""
 imperial_examination.6000.b: ""แน่นอนว่าเราสามารถ ทำให้เรื่องนี้หายไปได้, ด้วยวิธีใดวิธีหนึ่ง!""
 imperial_examination.6000.c: ""ท่านรู้ไหม, [friend_to_sacrifice.GetTitledFirstNameNoTooltip] คือผู้ยุยง #EMP ตัวจริง#!... !""
 imperial_examination.6000.d: ""มันจะไม่เกิดขึ้น #EMP อีกเป็นอันขาด#!, ข้าสาบาน!""

