 imperial_examination.5500.t.success: "สำเร็จ!"
 imperial_examination.5500.t.great_success: "สำเร็จอย่างงดงาม!"
 imperial_examination.5500.t.critical_success: "สำเร็จอย่างยิ่งยวด!"
 imperial_examination.5500.t.failure: "ล้มเหลว!"
 imperial_examination.5500.desc.success_martial: "ด้วยเสียง —#EMP ปัก#!— ลูกธนูปักเข้าเป้าอย่างมั่นคง เสียงพึมพำชื่นชมดังมาจากผู้มุงดู เป็นที่ชัดเจนว่าข้าได้สร้างความประทับใจให้แก่ฝูงชน"
 imperial_examination.5500.desc.success_learning: "คำสอนจากอาจารย์ของข้าปรากฏขึ้นอย่างชัดเจนในใจ ขณะที่ข้อความจากตำราก็ถูกเรียกจากความทรงจำได้อย่างง่ายดาย"
 imperial_examination.5500.desc.safe_martial: "ลูกธนูตกลงที่ขอบเป้า การปักตื้น ๆ ทำให้หางลูกธนูห้อยลงเล็กน้อย"
 imperial_examination.5500.desc.safe_learning: "ข้าท่องคำกล่าวที่เป็นที่รู้จักกันดีที่ข้าจำได้จากการอ่าน แต่ไม่ได้ขยายความหรืออภิปรายเรื่องนั้นอย่างยืดยาว"
 imperial_examination.5500.desc.failed_martial: "ก่อนที่ขนนกของลูกธนูจะเฉี่ยวเกราะแขนของข้า ข้าก็รู้ว่ามันจะไม่เข้าเป้า และข้ามองดูมันเฉี่ยวที่มุมเป้าหมายก่อนจะหายไปด้านหลัง"
 imperial_examination.5500.desc.failed_classics: "ข้าพยายามอย่างหนักที่จะจดจำบทเรียนที่อาจารย์สอนข้า ข้อความจากตำราสำคัญดูเหมือนจะถูกลบไปจากความทรงจำ"
 imperial_examination.5500.desc.hegemon_positive: "\n\n[host.GetTitleAsNameNoTooltip] มองมาที่ข้า [host.Custom('quirk_pos_pp')] "ดีมาก""
 imperial_examination.5500.desc.hegemon_negative: "\n\n[host.GetTitleAsNameNoTooltip] มองมาที่ข้า [host.Custom('quirk_neg_pp')] "เจ้าไปได้""
 imperial_examination.5500.a: "ข้าจะจดจำช่วงเวลานี้ตลอดไป"

 #Conclusion event
 imperial_examination.7000.t: "การประกาศผล"
 imperial_examination.7000.desc.emperor: "เสียงกลองของสถาบันดังขึ้นอีกครั้งในการประกาศผล เหล่าผู้เข้าสอบรวมตัวกันหน้าผลลัพธ์ที่ประกาศไว้ เงียบงันด้วยความคาดหวังและความเคารพ หวังว่าจะได้ปีนบันไดสู่ตำแหน่งราชการระดับสูง\n\nผู้เข้าสอบหน้าพระที่นั่งถูกจัดให้อยู่เบื้องหน้าเพื่อนร่วมรุ่นทั้งหมดเพื่อเป็นตัวอย่างและรางวัล ในขณะที่นักเรียนระดับรองลงมาต่างก้มศีรษะให้"
 imperial_examination.7000.desc.cheater: "เสียงกลองของสถาบันดังก้องปลุกข้าจากการผ่อนปรนชั่วครู่ ณ ที่ที่ข้ายืนอยู่นอกขอบเขตบริเวณสอบ ข้ามองดูเพื่อน ๆ ของข้ารีบวิ่งไปดูการประกาศผล หวังผลการสอบของพวกเขา\n\nไกลออกไป ข้าเหลือบเห็นผู้เข้าสอบหน้าพระที่นั่ง ผู้ ซึ่งยืนวางท่าอยู่หน้าลานพระราชวัง ท้องฟ้าแจ่มใส และสวรรค์กำลังเฝ้ามอง"
 imperial_examination.7000.desc.entrant: "กลองของสถานศึกษาดังขึ้นเป็นสัญญาณสิ้นสุดการสอบ ข้ารีบไปดูการประกาศผลและพบว่าข้าได้รับคะแนน [ROOT.Char.Custom('PlayerGetExamScoreAdjective')] ที่ #V [ROOT.Char.MakeScope.Var('imperial_examination_score').GetValue|0]#! ทำให้ข้าอยู่ในอันดับที่ [ROOT.Char.MakeScope.Var('your_exam_position').GetValue|O] ของบัญชีรายชื่อ\n\nในขณะเดียวกัน ผู้เข้าสอบที่มีอันดับสูงสุดจากการสอบ Palace Examination ก็โพสท่าอยู่หน้าลานพระราชวัง ข้าเงยหน้ามอง [first_place_entrant.GetFirstName] ผู้ ซึ่งได้อันดับหนึ่งในหมู่พวกเขา กลายเป็นคนโปรดของ [host.GetTitleAsNamePossessiveNoTooltip]"
 imperial_examination.7000.desc.palace_entrant: "เสียงกลองของสถาบันส่งสัญญาณสิ้นสุดการสอบ ข้ายืนกับเพื่อน ๆ จากการสอบหน้าพระที่นั่ง วางท่าอยู่หน้าลานพระราชวัง มองลงไปยังผู้เข้าสอบระดับล่างที่รวมตัวกันหน้าการประกาศผลเบื้องล่างเรา\n\nเมื่อผู้เข้าสอบระดับมหานครสังเกตเห็นเรา พวกเขาก็ก้มหัวคำนับด้วยความเคารพ ข้ารู้สึกถึงความรุ่งโรจน์และอำนาจที่รอข้าอยู่"
 imperial_examination.7000.desc.fallback: "ด้วยพระเกียรติคุณของ [host.GetTitleAsNameNoTooltip] ผู้เปี่ยมเมตตา [GetActivityType('activity_imperial_examination').GetName] อีกครั้งหนึ่งได้เสร็จสิ้นลง พร้อมกันนี้ บัณฑิตจำนวนมากได้ปีนบันไดสู่ตำแหน่งราชการระดับสูงแล้ว"
 imperial_examination.7000.a: "ทุกสิ่งใต้หล้าล้วนเป็นปกติสุข"
 imperial_examination.7000.a.cheater: "เฝ้ามองทุกคน... ยกเว้นข้า"

 imperial_examination.7001.t: "$imperial_examination.7000.t$"
 imperial_examination.7001.desc: "เสียงระฆังดังขึ้น ส่งสัญญาณว่า [GetActivityType('activity_local_examination').GetName] ได้สิ้นสุดลงและผลลัพธ์ได้ถูกประกาศแล้ว"
 imperial_examination.7001.desc.host: "\n\nและด้วยเหตุนี้ บัณฑิตกลุ่มใหม่ก็ได้ก้าวแรกที่สำคัญที่สุดบนบันไดสู่ตำแหน่งราชการระดับสูง ข้าได้ปูทางสำหรับอาชีพของพวกเขาแล้ว แต่ที่เหลือก็ขึ้นอยู่กับพวกเขา"
 imperial_examination.7001.desc.cheater: "\n\nข้ามิได้เป็นหนึ่งในบัณฑิตในรายชื่อนั้น เนื่องจากกรรมการคุมสอบได้ลบชื่อข้าออกจากการแข่งขัน"
 imperial_examination.7001.desc.entrant.first: "\n\nชื่อของข้าอยู่บนสุดของรายชื่อ และเพื่อน ๆ ของข้าก็หันมามองข้าด้วยความอิจฉา มันถูกตัดสินแล้ว: ข้าคือบัณฑิตที่เก่งที่สุดของเขต และเส้นทางสู่ [GetActivityType('activity_imperial_examination').GetName] ก็เปิดกว้างสำหรับข้า"
 imperial_examination.7001.desc.entrant: "\n\nแม้ว่า [first_place_entrant.GetFirstName] จะคว้าตำแหน่งบนสุดของรายชื่อไป แต่ข้าก็ยังสอบผ่านการสอบระดับมณฑลด้วยคะแนน [ROOT.Char.Custom('PlayerGetExamScoreAdjective')] #V [ROOT.Char.MakeScope.Var('imperial_examination_score').GetValue|0]#!."
 imperial_examination.7001.desc.fallback: "\n\nและด้วยเหตุนี้ บัณฑิตกลุ่มใหม่ก็ได้ก้าวแรกที่สำคัญที่สุดบนบันไดสู่ตำแหน่งราชการระดับสูง"
 imperial_examination.7001.a: "นี่คือวันที่น่าจดจำ"

 imperial_examination.7003.desc: "ระฆังดังขึ้น เป็นสัญญาณว่า [GetActivityType('activity_imperial_examination').GetName] ได้สิ้นสุดลงและมีการประกาศผลแล้ว"

 # CLOSE FAMILY NOTIFICATION EVENTS

 # Intro event
 imperial_examination.7100.t: "ตัวแทนตระกูลในการสอบ"
 imperial_examination.7100.desc: "ด้วยพระเกียรติคุณของ [host.GetTitleAsNameNoTooltip] ผู้เปี่ยมเมตตา เรามีกลุ่มผู้ที่คาดว่าจะเป็นผู้ปกครองกลุ่มใหม่หลังจากการสอบส่วนกลางใน [location.GetName]"
 imperial_examination.7100.desc.intro_nr_of_relatives_singular: "มีเพียง [ROOT.Char.Custom2('RelationToMeShort', house_member)|U] [house_member.GetTitledFirstName] ของข้าเท่านั้นที่เข้าร่วมในฐานะผู้เข้าสอบ"
 imperial_examination.7100.desc.intro_nr_of_relatives: "\n\nสมาชิกตระกูล [ROOT.Char.GetHouse.GetNameNoTooltip] [ROOT.Char.MakeScope.Var('num_exam_family_entrants').GetValue] คน เข้ารับการสอบ"
 imperial_examination.7100.desc.all_failed: "[ROOT.Char.Custom('ActivityGetFaileesBothAll')] คนล้มเหลว"
 imperial_examination.7100.desc.all_passed_provincial: "[ROOT.Char.Custom('ActivityGetSuccessfulBothAll')] ของพวกเขาสร้างเกียรติให้แก่ชื่อเสียงอันดีงามของเราและผ่านการสอบ"
 imperial_examination.7100.desc.all_passed_metropolitan: "[ROOT.Char.Custom('ActivityGetSuccessfulBothAll')] ของพวกเขาสร้างเกียรติให้แก่ชื่อเสียงอันดีงามของเราและผ่านการสอบ Provincial Examination"
 imperial_examination.7100.desc.all_passed: "[ROOT.Char.Custom('ActivityGetSuccessfulBothAll')] คนสร้างเกียรติให้ชื่อเสียงอันดีงามของเรา"
 imperial_examination.7100.desc.one_passed: "มีเพียงคนเดียวที่สร้างเกียรติให้ชื่อเสียงอันดีงามของเรา"
 imperial_examination.7100.desc.win_lose_ratio: "[ROOT.Char.MakeScope.Var('num_exam_family_entrants_passed').GetValue] คนสอบผ่าน ในขณะที่ [ROOT.Char.MakeScope.Var('num_exam_family_entrants_failed').GetValue] คนสอบตก"
 imperial_examination.7100.desc.won_palace: "ในจำนวนนี้ [ROOT.Char.MakeScope.Var('num_exam_family_passed_palace').GetValue] คนสามารถไปถึงการสอบหน้าพระที่นั่งได้"
 imperial_examination.7100.desc.palace_entrant: "\n\n[house_member.GetTitledFirstName] สอบผ่านการสอบระดับมหานครด้วยคะแนน [activity.Custom('ActivityGetExamScoreAdjective')] ทำให้ [house_member.GetHerHim] ได้รับคำเชิญอันเป็นที่ปรารถนาให้เข้าร่วมการสอบหน้าพระที่นั่งต่อหน้า [host.GetTitleAsNameNoTooltip] [host.GetHerselfHimself]! ในการนี้ [house_member.GetSheHe] ก็ได้นำความภาคภูมิใจมาสู่ตระกูล [ROOT.Char.GetHouse.GetNameNoTooltip] เช่นกัน"
 imperial_examination.7100.desc.metropolitan_entrant: "\n\n[house_member.GetTitledFirstName] สอบผ่านการสอบระดับมหานครด้วยคะแนน [activity.Custom('ActivityGetExamScoreAdjective')] แต่ล้มเหลวในการคว้าตำแหน่งอันเป็นที่ปรารถนาในการสอบหน้าพระที่นั่ง"
 imperial_examination.7100.desc.failed_entrant: "\n\n[house_member.GetTitledFirstName] สอบตกการสอบระดับมหานคร"
 imperial_examination.7100.desc.cheater: "ไม่เพียงแค่นั้น แต่ [house_member.GetSheHe] ยังถูกจับได้ว่าพยายามโกงในงานนี้"
 imperial_examination.7100.desc.got_elder: "อย่างน้อย [house_member.GetSheHe] ก็สามารถสร้างความประทับใจให้ [elder.GetTitledFirstName] หนึ่งในกรรมการคุมสอบหลวง ผู้ ซึ่งรับ [house_member.GetHerHim] เป็น [disciple|E]"
 imperial_examination.7100.desc.failed_fallback: "ปีแล้วปีเล่าของการศึกษาอย่างกว้างขวางและ #EMP แพงแสนแพง#! ทั้งหมดถูกโยนทิ้งไปในพริบตา"
 imperial_examination.7100.a.singular: "ต้องแสดงความยินดี!"
 imperial_examination.7100.a.tt_first: "#weak ท่านกำลังกล่าวกับผู้เข้าสอบหน้าพระที่นั่งที่ประสบความสำเร็จ#!"
 imperial_examination.7100.a.plural: "ข้าต้องแสดงความยินดีกับผู้เข้าสอบหน้าพระที่นั่ง"
 imperial_examination.7100.b.singular: "ข้าปฏิเสธที่จะยอมรับความธรรมดา"
 imperial_examination.7100.b.tt_first: "#weak ท่านกำลังกล่าวกับผู้เข้าสอบระดับมหานครที่ประสบความสำเร็จ#!"
 imperial_examination.7100.b.plural: "ข้าต้องการกล่าวกับผู้เข้าสอบระดับล่าง"
 imperial_examination.7100.c: "ตระกูลนี้ไม่ทนต่อความล้มเหลว!"
 imperial_examination.7100.c.tt_first: "#weak ท่านกำลังกล่าวกับผู้เข้าสอบที่ล้มเหลว#!"
 imperial_examination.7100.d: "ข้าไม่มีเวลาสำหรับเรื่องนี้"
 influence_family_effect: "มีอิทธิพลต่อสมาชิกครอบครัวต่อไปนี้:"

 #Metropolitan event
 imperial_examination.7050.t: "ผู้เข้าสอบระดับมหานคร"
 imperial_examination.7050.desc: "เป็นเรื่องดีที่มีตระกูล [ROOT.Char.GetHouse.GetNameNoTooltip] เป็นตัวแทนในประเพณีอันงดงามและเป็นที่เคารพที่สุดของเรา แต่ก็น่าจะคาดหวัง... ความพยายามที่เข้มข้นกว่านี้\n\n"
 imperial_examination.7050.a.singular: "[house_member.GetSheHe|U] #EMP ต้อง#! ทำการสอบหน้าพระที่นั่ง!"
 imperial_examination.7050.a.plural: "ข้าคาดหวังให้ #EMP ทุกคน#! ทำการสอบหน้าพระที่นั่งให้สำเร็จ"
 imperial_examination.7050.a.tt_singular: "[house_member.GetShortUINameNoTooltip|U] จะพยายามเข้าร่วม [GetActivityType('activity_imperial_examination').GetNameNoTooltip] ครั้งต่อไป"
 demand_retake_exam_effect: "#weak ตัวละครเหล่านี้จะพยายามเข้าร่วม [GetActivityType('activity_imperial_examination').GetNameNoTooltip] ครั้งต่อไป#!"
 imperial_examination.7050.b: "แน่นอนว่า เครดิตเป็นของข้า"
 imperial_examination.7050.c.singular: "ข้ามั่นใจว่า [house_member.GetSheHe] พยายามอย่างเต็มที่ [house_member.GetHerHis] แล้ว"
 imperial_examination.7050.c.plural: "ข้ามั่นใจว่าพวกเขาพยายามอย่างเต็มที่แล้ว"
 
 #Palace event
 imperial_examination.7055.t: "ตระกูลได้รับเกียรติในการสอบหน้าพระที่นั่ง"
 imperial_examination.7055.desc: "นับเป็นพรอย่างแท้จริงที่มีตระกูล [ROOT.Char.GetHouse.GetNameNoTooltip] เป็นตัวแทนในการสอบ Palace Examination ญาติของข้าได้ยืนอยู่ต่อหน้า [host.Custom('GetDaughterSon')] แห่งสวรรค์ [host.GetHerselfHimself] และพิสูจน์แล้วว่าคู่ควรแก่คำชมเชยของ [host.GetHerHis]\n\nนี่คือสัญญาณแห่งความเจริญรุ่งเรืองที่จะมาถึงอย่างแน่นอน"
 imperial_examination.7055.b: "เป็นไปตามคาดจากสมาชิกตระกูล [ROOT.Char.GetHouse.GetNameNoTooltip]"

 #Failee event
 imperial_examination.7060.t: "ตระกูลเสื่อมเสียเกียรติในการสอบระดับมหานคร"
 imperial_examination.7060.desc: "ข้าจะแสดงหน้าต่อหน้าเพื่อนฝูงได้อย่างไร เมื่อญาติของข้าทำตัวน่าอับอายและล้มเหลวในการรักษาประเพณีอันเป็นที่เคารพที่สุดของเรา? อาจจะต้องมีการลงโทษทางวินัยอย่างเข้มงวด"
 imperial_examination.7060.c: "[house_member.GetSheHe|U] พยายามโกง เช่น #EMP นั้น#! หรือ?"
 imperial_examination.7060.b: "ผลลัพธ์สามารถสลับกันได้ตลอดเวลา..."
 imperial_examination.7060.b.tt_singular: "ผลลัพธ์ของ [failed_entrant.GetTitledFirstNamePossessive] จะถูกสลับกับผู้เข้าสอบที่ประสบความสำเร็จ"
 imperial_examination.7060.b.tt_plural: "คำตอบข้อสอบของผู้สมัครที่ประสบความสำเร็จจะถูกโอนไปให้ [close_family|E] และ [extended_family|E] ของท่าน"
 imperial_examination.7060.d: "นี่เป็นสิ่งที่ยอมรับไม่ได้!"

