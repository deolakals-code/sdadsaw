l_english: 

 ### ARRIVAL EVENTS ###
 #Entrant
 imperial_examination.1000.t: "เหล่าผู้เข้าสอบรวมตัว"
 imperial_examination.1000.desc: "ข้าเดินทางเข้าสู่เมือง [ROOT.Char.GetCurrentLocation.GetName] และพบว่าถนนหนทางถูกปัดกวาดและประดับประดาอย่างวิจิตรเพื่อต้อนรับการมาถึงของเรา ผู้คนก้มคำนับและเปล่งเสียงสวดอวยพรโชคลาภอย่างแผ่วเบาขณะที่เราเดินผ่าน ในขณะที่นักพนันวางเดิมพันกันตามมุมถนน\n\nทุกหนแห่งที่ข้าหันไป ข้าเห็นผู้เข้าสอบคนอื่น ๆ สวมอาภรณ์แพรพรรณชั้นเลิศ กำลังเดินทางพร้อมเหล่านางโลมไปยังโรงเตี๊ยมในท้องถิ่น วันนี้ ข้าจะได้รู้ว่าข้าเต็มใจที่จะไปไกลเพียงใด"
 imperial_examination.1000.a: "ข้าจะประสบความสำเร็จ ไม่ว่าจะด้วยวิธีใด!"
 imperial_examination.1000.a.tt: "ท่านจะได้รับโอกาสในการโกงมากขึ้น\n@alert_icon! #alert_trial ท่านอาจถูกจับได้!#! #weak (หากท่านไม่ถูกตรวจพบ ท่านจะได้รับ [secret|E] #V $secret_exam_cheater$#!)#!"
 imperial_examination.1000.b: "ข้าปรารถนาจะพิสูจน์ตนเองด้วยหนทางอันทรงเกียรติ"

 #Host
 imperial_examination.1001.t: "$imperial_examination.1000.t$"
 imperial_examination.1001.desc: "เหล่าผู้ที่คาดหวังจะเป็นข้าราชการเรียงรายอยู่ตามท้องถนนของ [ROOT.Char.GetCurrentLocation.GetName] นครกลับมีชีวิตชีวา สดใสขึ้นด้วยอาภรณ์แพรพรรณอันงดงามของผู้เข้าสอบและเหล่านางโลมเลอโฉมผู้ติดตาม \n\nการสอบผ่านการสอบคัดเลือกขุนนางหลวงคือการพิสูจน์ความเข้าใจอย่างถ่องแท้ในคุณธรรมห้าประการ อันเป็นยอดสุดแห่งการเรียนรู้ตามหลักขงจื๊อ \n\nนี่มิใช่เรื่องของการท่องจำ แต่เป็นการบ่มเพาะความเชื่ออันดีงามและการประพฤติปฏิบัติตนอย่างมีศีลธรรม"
 imperial_examination.1001.a: "การชุมนุมรออยู่"

 #Guest
 imperial_examination.1002.t: "$imperial_examination.1000.t$"
 imperial_examination.1002.desc: "ข้าเดินทางเข้าสู่เมือง [ROOT.Char.GetCurrentLocation.GetName] พร้อมกับ [ROOT.Char.Custom2('RelationToMe', candidate )] ของข้า [candidate.GetTitledFirstName] เคียงข้าง ถนนหนทางถูกปัดกวาดและประดับประดาอย่างวิจิตรเพื่อต้อนรับการมาถึงของเรา\n\nเมื่อ [candidate.GetSheHe] ถูกแยกตัวเข้าไปในที่พักผู้เข้าสอบแล้ว ความสามารถของข้าที่จะมีอิทธิพลต่อความก้าวหน้าของ [candidate.GetHerHis] ก็จะเหลือน้อยเต็มที บางทีข้าควรให้คำแนะนำสักเล็กน้อย"
 imperial_examination.1002.a: ""จงสำเร็จให้ได้ ไม่ว่าจะด้วยวิธีใด, [ROOT.Char.Custom2('RelationToMe', candidate )] ของข้า""
 imperial_examination.1002.a.tt: "[candidate.GetFirstNameNoTooltip] จะได้รับโอกาสในการโกงมากขึ้น\n@alert_icon! #alert_trial [candidate.GetSheHe|U] อาจถูกจับได้!#! #weak (หาก [candidate.GetSheHe] ไม่ถูกตรวจพบ [candidate.GetSheHe] จะได้รับ [secret|E] #V $secret_exam_cheater$#!)#!"
 imperial_examination.1002.b: ""อย่าสร้างความอับอายให้แก่ตระกูล [ROOT.Char.GetHouse.GetNameNoTooltip]""

 imperial_examination.1003.t: "$imperial_examination.1000.t$"
 imperial_examination.1003.desc: "ข้าเดินทางเข้าสู่เมือง [ROOT.Char.GetCurrentLocation.GetName] โดยมีม้วนคัมภีร์และตำราเรียนเต็มสองแขน\n\n"
 imperial_examination.1003.not_passed_exam: "ข้ายังไม่เคยเข้ารับการสอบด้วยตนเอง กระนั้น ยังมีหลายสิ่งที่ข้าสามารถช่วยเหลือกรรมการคุมสอบในงานนี้ได้ หากข้าปรารถนาจะเรียนรู้ไว้ก่อนที่จะหาญกล้าเข้าสอบในวันหนึ่งข้างหน้า"
 imperial_examination.1003.passed_provincial_exam: "วันนี้ ข้าจะได้ค้นพบสิ่งที่เกิดขึ้นภายในห้องทำงานของกรรมการคุมสอบ วิธีการผสมหมึก และการเตรียมแบบสอบถาม เมื่อสอบผ่านแล้ว บัดนี้ก็ถึงเวลาสร้าง [Glossary( 'กวานซี', 'GUANXI_GLOSS' )]"
 imperial_examination.1003.passed_metropolitan_not_palace: "ข้ายังจำการประกาศผลตอนที่ข้าสอบผ่านการสอบระดับมหานครได้ ความปลาบปลื้มที่ข้ารู้สึกนั้นกลับขมขื่นอย่างรวดเร็วเมื่อข้าไม่ติดหนึ่งในสิบ บางที หากข้าพยายามหนักพอ ข้าอาจไปถึงการสอบหน้าพระที่นั่งได้ในวันหนึ่ง"
 imperial_examination.1003.passed_all_exams: "ในฐานะผู้ที่สอบผ่านทุกระดับแล้ว บรรดากรรมการคุมสอบต่างทักทายข้าในฐานะพวกพ้องคนหนึ่งเมื่อข้าก้าวเข้าสู่ห้องศึกษาอันทรงเกียรติที่สุดของเมือง"
 imperial_examination.1003.a: "$imperial_examination.1001.a$"

 #Entrant: Meet a fellow entrant
 imperial_examination.1020.t: "ใบหน้าใหม่"
 imperial_examination.1020.desc: "ณ ที่พัก ข้าสังเกตเห็นผู้เข้าสอบอีกคนหนึ่งที่โต๊ะ กำลังนั่งหน้าเคร่งและกัดเล็บมือของ [new_entrant.GetHerHis] อย่างกระวนกระวาย\n\nเมื่อมองไป เราสบตากันชั่วครู่ ข้าจึงเริ่มบทสนทนา: "ทักทาย — ข้าคือ [ROOT.Char.GetTitledFirstNameNoTooltip] ท่านเป็นผู้ใดหรือ?"\n\nสายตาของ [new_entrant.GetHerHis|U] กวาดมองไปทั่วห้องอย่างไม่หยุดนิ่ง ขณะที่ [new_entrant.GetSheHe] ตอบว่า: "[new_entrant.GetTitledFirstName] แล้วมีกระไรหรือ?""
 imperial_examination.1020.a: ""ท่านก็ประหม่าหรือ?""
 imperial_examination.1020.a.success.tt: "ท่านผูกมิตรกับ [new_entrant.GetShortUIName]"
 imperial_examination.1020.a.failure.tt: "การพูดคุยเล็ก ๆ น้อย ๆ ของท่านล้มเหลว"
 imperial_examination.1020.b: ""ข้ามั่นใจว่าทุกอย่างจะเรียบร้อย!""

 #Taking in the Sights
 imperial_examination.1040.t: "ชมทิวทัศน์"
 imperial_examination.1040.desc.again: "อีกครั้งแล้วที่ข้าติดอยู่ระหว่างทางไปยังห้องสอบ เบียดเสียดอยู่หลังเหล่าผู้เข้าสอบตาโตที่พยายามหาทางไปตามถนนในเมือง"
 imperial_examination.1040.desc: "ถนนในเมืองคึกคักไปด้วยกิจกรรมเพื่อเตรียมการสอบที่กำลังจะมาถึง ความคาดหวังอบอวลอยู่ในอากาศ และข้าก็อดไม่ได้ที่จะตื่นเต้นไปด้วย"
 imperial_examination.1040.desc.outro: "\n\nเหล่าผู้ที่คาดหวังจะเป็นผู้ปกครองเข้าแถวไปยังโถงรับสมัครเพื่อประกาศการมาถึง ด้วยขนาดของแถว ดูเหมือนว่าข้าจะมีเวลาเดินเตร่ในเมืองก่อนที่การชุมนุมจะเริ่ม"
 imperial_examination.1040.a: "ข้าควรค้นหาม้วนคัมภีร์ในตลาด"
 imperial_examination.1040.a.tt: "ท่านได้เป็นเจ้าของม้วนคัมภีร์ [learning|E] [artifact|E]"
 imperial_examination.1040.a.tt_equipped: "ซื้อ [artifact_scroll.GetName]"

 imperial_examination.1040.b: "ข้าควรซื้อของขวัญให้เจ้าภาพ"
 imperial_examination.1040.c: "ข้าไม่มีเวลาวอกแวก"
 imperial_examination.1040.d: "ข้าควรดูว่าข้าเรียนรู้อะไรจากคนท้องถิ่นได้บ้าง"
 imperial_examination.1040.d.tt.success: "ท่านได้รับข้อมูลเชิงลึกอันมีค่า"
 imperial_examination.1040.d.tt.failure: "ท่านไม่เรียนรู้อะไรที่มีค่าเลย"
 imperial_examination.1040.e: "ข้าควรฝึกปรือทักษะที่ลานประลอง!"
 imperial_examination.1040.e.tt.success: "ท่านเอาชนะนักศิลปะการต่อสู้ท้องถิ่น"
 imperial_examination.1040.e.tt.failure: "ท่านถูกนักศิลปะการต่อสู้ท้องถิ่นเอาชนะ"
 artifact_scroll_name: "ต้นฉบับที่ใช้จนเก่า"
 artifact_scroll_desc: "ตำราการศึกษาที่มีร่องรอยการอ่านและคำอธิบายประกอบอย่างละเอียด ชื่อ "การตีความความเป็นมนุษย์" ซึ่งอภิปรายหนึ่งในห้าเสาหลักของแนวคิดขงจื๊อ"
 examination_gifted_host_title: "นำของขวัญมาให้เจ้าภาพ"
 examination_gifted_host: "[CHARACTER.GetTitledFirstName|U] มอบของขวัญ [ROOT.Char.Custom('GetExpensiveDessert')] ให้แก่ [TARGET_CHARACTER.GetTitledFirstName]"
 imperial_examination.1050.t: "ความประทับใจแรก"
 imperial_examination.1050.desc: "การค้นหาตัวกรรมการคุมสอบ [examiner.GetTitledFirstName] นั้นง่ายดาย ด้วยมีกลุ่มผู้เข้าสอบคนอื่น ๆ รายล้อม [examiner.GetHerHim] ราวกับนกยูง อวดม้วนอักษรวิจิตรและชักนำ [examiner.GetHerHim] เข้าสู่การโต้วาทีเชิงวิชาการ \n\nการที่จะโดดเด่นและสร้างความประทับใจแรกที่ยั่งยืนในฝูงชนนี้มิใช่เรื่องง่าย เมื่อต้องแข่งขันกับกลุ่มสังคมชั้นสูงที่ดุเดือดนี้"
 imperial_examination.1050.a: "สร้างความประทับใจด้วยการตีความคัมภีร์คลาสสิกอย่างเฉียบคม"
 imperial_examination.1050.a.success.tt: "[examiner.GetTitledFirstName] ประทับใจ"
 imperial_examination.1050.a.failure: "[examiner.GetTitledFirstName] ไม่ประทับใจ"
 imperial_examination.1050.a.failure.tt: "การตีความของท่านไม่ผิด แย่กว่านั้นคือ มันล้าสมัย"
 imperial_examination.1050.b: "อ้างผลงานของผู้เข้าสอบคนอื่นเป็นของตน"
 imperial_examination.1050.b.success.tt: "[examiner.GetTitledFirstName] ประทับใจ"
 imperial_examination.1050.b.failure.tt: "ท่านถูกจับได้ว่าลอกเลียนผลงาน"
 imperial_examination.1050.c: "ข้าจะพิสูจน์ตนเองในการสอบ"
 examination_impressed_examiner_title: "สร้างความประทับใจแรกได้อย่างยอดเยี่ยม"
 examination_impressed_examiner: "[CHARACTER.GetTitledFirstName|U] ได้เปรียบในการสอบ เนื่องจากได้รับความโปรดปรานจากกรรมการคุมสอบ [TARGET_CHARACTER.GetTitledFirstName]"

 imperial_examination.1060.t: "ของหวานเลิศรส"
 imperial_examination.1060.desc: "กลิ่นหอมของขนมเค้กอบใหม่ลอยตัดผ่านกลิ่นอันรุนแรงของเหงื่อผู้เข้าสอบและม้วนคัมภีร์ฝุ่นเขรอะที่อบอวลไปทั่วอาคารสอบ \n\n"ข้านำของขวัญอันต่ำต้อยนี้มาจากแคว้นบ้านเกิดของข้า [ROOT.Char.GetTitleAsNameNoTooltip]" [entrant_to_meet.GetTitledFirstName] ผู้เข้าสอบที่มีแววรุ่งในการสอบครั้งนี้กล่าว \n\n[entrant_to_meet.GetSheHe|U] ก้มคำนับและมอบกล่องไม้ประดับกระดูก: ต้นตอของกลิ่นหอมน่ารับประทาน และเป็นความพยายามอย่างชัดเจนที่จะเอาใจข้า"
 imperial_examination.1060.b: "โชคลาภอันยิ่งใหญ่จะบังเกิดแก่ผู้ที่แสดงความเอื้อเฟื้อ เช่นนี้"
 imperial_examination.1060.b.tt: "[entrant_to_meet.GetTitledFirstName] โอกาส #BOL สำเร็จ#! #BOL เพิ่มขึ้น#! เนื่องจาก [exam_advantage|E]"
 imperial_examination.1060.c: "มาเพลิดเพลินกับสิ่งนี้ด้วยกันเถิด!"
 imperial_examination.1060.d: "ข้าจะเพลิดเพลินกับสิ่งนี้!"

 imperial_examination.1070.t: "ผู้สมัครที่พึงประสงค์ที่สุด"
 imperial_examination.1070.desc: "ข้าอดสงสัยไม่ได้ว่าผู้สมัครประเภทใดบ้างที่จะมาลองดีในการสอบครั้งนี้ \n\n[Glossary( 'มรรคสี่', 'FOUR_WAYS_GLOSS' )] แห่งการคัดเลือกขุนนางจะกำหนดความพึงพอใจที่กรรมการคุมสอบมีต่อผู้สมัครอย่างไม่ต้องสงสัย ในฐานะ [ROOT.Char.GetTitleAsNameNoTooltip] ของพวกเขา ข้ามีอำนาจในการตัดสินว่าสิ่งใดมีคุณสมบัติเป็นค่านิยมที่ #EMP ดีงาม#!"
 imperial_examination.1070.a: "ผู้ที่มีความสนใจ เช่นเดียวกับข้าย่อมต้องมีแวว"
 every_shared_education_entrant.tt: "[entrant|E] ทุกคนที่มี [education|E] [THIS.Char.Custom('GetEducationTraitConcept')] จะได้รับโอกาส #BOL สำเร็จ#! #BOL เพิ่มขึ้น#!"
 imperial_examination.1070.b: "ทุกคนที่ปฏิบัติตามหลักขงจื๊อล้วนคู่ควร"
 imperial_examination.1070.b.tt: "[entrant|E] ทุกคนที่มีลักษณะนิสัย [GetTrait('compassionate').GetName(GetNullCharacter)], [GetTrait('just').GetName(GetNullCharacter)], [GetTrait('honest').GetName(GetNullCharacter)] หรือ [GetTrait('scholar').GetName(GetNullCharacter)] จะได้รับโอกาส #BOL สำเร็จ#! #BOL เพิ่มขึ้น#!"
 imperial_examination.1070.d: "แน่นอนว่าต้องเป็นผู้สืบเชื้อสายจากโอรสแห่งสวรรค์"
 imperial_examination.1070.d.tt: "[entrant|E] ทุกคนใน [dynasty|E] ของท่านจะได้รับโอกาส #BOL สำเร็จ#! #BOL เพิ่มขึ้น#!"
 imperial_examination.1070.c: "ข้าจะเคารพการตัดสินใจของกรรมการคุมสอบ"

 ### EMPEROR EVENTS ###

 #Emperor sneaks out to meet entrant
 imperial_examination.2000.t: "[ROOT.Char.GetTitleAsNameNoTooltip] หรือสามัญชน"
 imperial_examination.2000.desc: "มนุษย์ย่อมประพฤติตนดีที่สุดเมื่ออยู่ต่อหน้าผู้มีอำนาจ ดังนั้น ในฐานะ [ROOT.Char.GetTitleAsNameNoTooltip] ข้าต้องสังเกตไพร่ฟ้าในยามที่พวกเขาไม่รู้ตัว เพื่อค้นหาว่าผู้ใดดีจริง และผู้ใดเป็นเพียงนักโป้ปดที่เก่งกาจ \n\nข้าออกจากที่พักในอาภรณ์เรียบง่าย ปะปนไปในฝูงชนเพื่อประเมินผู้เข้าสอบอย่างแม่นยำยิ่งขึ้น \n\n[entrant_to_meet.GetTitledFirstName] โดดเด่นขึ้นมาในฐานะบุคคลที่มีแวว "
 imperial_examination.2000.desc.scoreboardee: "บัดนี้ [entrant_to_meet.GetSheHe] ท่องข้อความจากคัมภีร์คลาสสิกให้ผู้ชมที่กำลังเคลิบเคลิ้มฟังอย่างง่ายดาย แม้ แต่ข้าเองก็ยังพบว่าตนเองถูกดึงดูดด้วยคำถามอันน่าสนใจที่ [entrant_to_meet.GetSheHe] ตั้งขึ้นจากตำรา"
 imperial_examination.2000.desc.fallback: "[entrant_to_meet.GetSheHe|U] นั่งล้อมรอบด้วยผู้เข้าสอบกลุ่มเล็ก ๆ กำลังถกเถียงเรื่องคัมภีร์คลาสสิกด้วยมุมมองที่น่าสนใจ ทว่าค่อนข้างขาดแรงบันดาลใจ"
 imperial_examination.2000.a: "ข้าจะแจ้งชื่อของ [entrant_to_meet.GetHerHis] ให้กรรมการคุมสอบทราบ"
 imperial_examination.2000.a.tt: "[entrant_to_meet.GetTitledFirstName] โอกาส #BOL สำเร็จ#! #BOL เพิ่มขึ้น#! เนื่องจาก [exam_advantage|E]"
 imperial_examination.2000.b: "[entrant_to_meet.GetTitleByKey] อาจไปได้ไกล หากได้รับความช่วยเหลือบ้าง"
 imperial_examination.2000.c: "อนิจจา มาตรฐานของข้าสูงกว่านี้"
 
 imperial_examination.2010.t: "การปูทาง"
 imperial_examination.2010.desc.two: ""คงจะดีไม่น้อยที่มีสมาชิกราชวงศ์ของท่านมาเข้าสอบมากมาย เช่นนี้" กรรมการคุมสอบ [examiner.GetTitledFirstName] บอกข้า "แม้ว่าข้าจะไม่ได้คาดหวังกับ [entrant_to_meet_2.GetTitledFirstName] มากนักก็ตาม"\n\n"
 imperial_examination.2010.desc.one: ""ข้าเห็น [dynasty_member.GetTitledFirstName] มาสอบด้วย" กรรมการคุมสอบ [examiner.GetTitledFirstName] บอกข้า "ท่านคงจะยินดี"\n\n"
 imperial_examination.2010.desc.outro: "สายตาของ [examiner.GetFirstNamePossessiveNoTooltip] กวาดไปทั่วรายชื่อผู้เข้าสอบ และข้าเห็นถุงเงินของ [examiner.GetHerHis] ตุงขึ้นอย่างเห็นได้ชัด จากสินบนที่ได้รับมาจากบรรดาประมุขราชวงศ์ที่กังวลใจ \n\nไม่ต้องสงสัยเลยว่าข้าเองก็สามารถ 'สนับสนุน' เล็กน้อยได้ เช่นกัน เพื่อส่งเสริมสมาชิกในตระกูลของข้า"
 imperial_examination.2010.a: "[entrant_to_meet.GetShortUINameNoTooltip] สมควรได้รับการยอมรับบ้าง"
 imperial_examination.2010.a.tt: "[entrant_to_meet.GetTitledFirstName] โอกาส #BOL สำเร็จ#! #BOL เพิ่มขึ้น#! เนื่องจาก [exam_advantage|E]"
 imperial_examination.2010.b: "[ROOT.Char.Custom2('RelationToMe', entrant_to_meet_2 )] ที่น่าผิดหวังของข้า ต้องการความช่วยเหลือทุกอย่างที่ [entrant_to_meet_2.GetSheHe] จะหาได้"
 imperial_examination.2010.b.tt: "[entrant_to_meet_2.GetTitledFirstName] โอกาส #BOL สำเร็จ#! #BOL เพิ่มขึ้น#! เนื่องจาก [exam_advantage|E]"
 imperial_examination.2010.c: "ข้าไม่คิด เช่นนั้น"

 imperial_examination.2030.t: "หยกในตม"
 imperial_examination.2030.desc.open: ""เป็นไปตามคาดที่มีผู้เข้าสอบจำนวนมากในการสอบครั้งนี้ ชนชั้นต่ำจำนวนหนึ่งพยายามที่จะไขว่คว้าโอกาส,""
 imperial_examination.2030.desc.restricted: ""แม้จะจำกัดการรับสมัครจากสาธารณชนทั่วไป แต่ชนชั้นต่ำที่แปลกประหลาดบางคนก็มักจะแอบย่องเข้ามาในการสอบได้เสมอ""
 imperial_examination.2030.desc.exclusive: ""[ROOT.Char.GetTitleAsNameNoTooltip] ผู้ทรงพระกรุณาที่สุด ข้าละอายใจที่จะยอมรับว่าชนชั้นต่ำไร้ชื่อผู้หนึ่งสามารถเข้ามาในห้องสอบได้ หวังว่าจะพิสูจน์ [promising_lowborn.GetHerselfHimself]""
 imperial_examination.2030.desc.outro: "กรรมการคุมสอบ [examiner.GetTitledFirstName] แจ้งข้า พลางมองออกไปที่ลานกว้างผ่านหน้าต่าง \n\n[examiner.GetTitledFirstName] ชี้ไปที่ [promising_lowborn.GetWomanMan] หนุ่มสาวผู้หนึ่ง ซึ่งดูเหมือนกำลังโต้เถียงอย่างเผ็ดร้อนกับขุนนางสองคน \n\n"[promising_lowborn.GetTitledFirstName] คือชื่อของ [promising_lowborn.GetHerHis] แม้ว่า [promising_lowborn.GetHerHis] จะมีท่าทางหยาบกระด้าง ข้าต้องยอมรับว่า [promising_lowborn.GetSheHe] แสดงให้เห็นถึงแววที่ยอดเยี่ยมเป็นพิเศษ""
 imperial_examination.2030.a: "ไม่มีสามัญชนคนใดจะมาบดบังรัศมีญาติข้าได้!"
 imperial_examination.2030.a.tt: "[dynasty_member.GetTitledFirstName] โอกาส #BOL สำเร็จ#! #BOL เพิ่มขึ้น#! เนื่องจาก [exam_advantage|E]"
 imperial_examination.2030.b: "ข้าจะจับตาดูผู้นี้ไว้"
 imperial_examination.2030.c: "แท้จริงแล้ว ทุกคนล้วนเท่าเทียมกันภายใต้สวรรค์"

 #One of the examiners is taking bribes...?
 imperial_examination.2040.t: "สินบนในมือ"
 imperial_examination.2040.desc: "มีข่าวลือว่ากรรมการคุมสอบ [rumored_examiner.GetTitledFirstName] กำลัง #EMP รับผลประโยชน์#! เพื่อส่งเสริมผู้เข้าสอบบางคน \n\nอันที่จริง ถุงเงินของ [rumored_examiner.GetHerHis] ดูเหมือนจะอัดแน่นไปด้วยเหรียญ และ [rumored_examiner.GetSheHe] ก็คลุกคลีกับผู้เข้าสอบใกล้ชิดเกินกว่าสถานะของ [rumored_examiner.GetHerHis] \n\nไม่จำเป็นต้องมีการสืบสวน [rumored_examiner.GetWomanMan] ผู้นี้กำลัง ทำให้การสอบของข้าเสื่อมเสีย!"
 imperial_examination.2040.a: "[rumored_examiner.GetFirstNameNoTooltip] จะต้องชดใช้แก่อาณาจักร"
 imperial_examination.2040.b: "ข้ารู้จักคนที่ต้องการ #EMP ความช่วยเหลือ#! บ้าง"
 imperial_examination.2040.b.tt: "[dynasty_member.GetTitledFirstName] โอกาส #BOL สำเร็จ#! #BOL เพิ่มขึ้น#! เนื่องจาก [exam_advantage|E]"
 imperial_examination.2040.d: "จับ [rumored_examiner.GetWomanMan] ที่น่าอัปยศผู้นี้ไปล่ามโซ่!"
 imperial_examination.2040.c: "การสอบจะดำเนินต่อไปตามปกติ"

 ### METROPOLITAN EXAM EVENTS ###
 #Emperor exam event
 imperial_examination.3000.t: "เสียงระฆังดังขึ้น"
 imperial_examination.3000.desc: "หลังจากการตรวจสอบอย่างเข้มงวดเพื่อกำจัดการโกง ผู้เข้าสอบต่างเข้าแถวเพื่อทำการสอบ ข้ามองดูพวกเขาจากวังของข้า สังเกตใบหน้าที่เปี่ยมความคาดหวังและท่าทางที่เคร่งขรึม \n\nเสียงระฆังดังขึ้นจากหอคอยลานกว้าง ตามด้วยเสียงกลองหนักทุ้ม เสียงที่ดังก้องสะท้อนอยู่ใต้ฝ่าเท้าของข้าและเติมเต็มหัวใจของข้าด้วยความปิติยินดีอันชอบธรรม"
 imperial_examination.3000.a: "มันเริ่มขึ้นแล้ว"

 imperial_examination.3005.t: "$imperial_examination.3000.t$"
 imperial_examination.3005.desc: "ความเงียบเข้าปกคลุมโรงเตี๊ยมขณะที่เสียงระฆังดังก้องไปทั่ว [ROOT.Char.GetCurrentLocation.GetName] ประตูสู่ห้องสอบปิดลงแล้ว\n\nรอบตัวข้า ข้าเห็นเหล่าผู้ปกครองและผู้อาวุโสกำลังถกเถียงกันด้วยเสียงกระซิบกระซาบ พยายามคาดเดาผลการทดสอบที่กำลังจะเกิดขึ้น ช่างเป็นความพยายามที่ไร้ผล"
 imperial_examination.3005.desc.outro.impatient: "แม้ข้าจะไม่อยากยอมรับ แต่ทั้งหมดที่เราทำได้ตอนนี้คือรอ"
 imperial_examination.3005.desc.outro: "ทั้งหมดที่เราทำได้ตอนนี้คือรอ"
 imperial_examination.3005.a: "ที่นี่เป็นสถานที่ที่ดีที่จะให้คนอื่นเห็น"
 imperial_examination.3005.b: "ข้าควรไปคลุกคลี..."

 imperial_examination.3006.t: "$imperial_examination.3000.t$"
 imperial_examination.3006.desc: "ความคาดหวังอบอวลอยู่ในอากาศขณะที่เสียงระฆังดังก้องไปทั่ว [ROOT.Char.GetCurrentLocation.GetName] ประตูสู่ห้องสอบปิดลงแล้ว\n\nข้าเดินตามหลังกรรมการคุมสอบ [examiner.GetTitledFirstName]"
 imperial_examination.3005.desc.martial: "เหงื่อไหลอาบแผ่นหลังจากการขนลูกธนูไปเติมในแล่ง บาดแผลเล็ก ๆ เต็มมือข้าจากการลับคมดาบ"
 imperial_examination.3005.desc.scholar: "เหงื่อไหลอาบแผ่นหลังจากการขนม้วนคัมภีร์ไปมาระหว่างคูหาสอบ รอยหมึกเปื้อนปลายนิ้วข้าจนดำจากการเติมตลับหมึก"
 imperial_examination.3006.a: "บัดนี้ งานที่แท้จริงได้เริ่มขึ้นแล้ว"

 imperial_examination.3007.t: "$imperial_examination.3000.t$"
 imperial_examination.3007.desc: "ด้วยเสียงครืดคราดและเสียงกระแทกหนัก ๆ ประตูสู่เขตการสอบก็ปิดลง ระฆังในลานกว้างดังขึ้น เรียกให้เรารวมตัวกัน"
 imperial_examination.3007.a: "ถึงเวลาพิสูจน์คุณค่าของข้า"
 imperial_examination.3007.a.success_tooltip_first: "#weak หากต้องการผ่านการสอบ Metropolitan Examination ท่านต้องได้คะแนน #V 50#! หากต้องการเข้าสอบ Palace Exam ท่านต้องติดหนึ่งในสิบอันดับแรก#!"
 # Entrant caught cheating
 imperial_examination.3010.t: "วัชพืชท่ามกลางบุปผา"
 imperial_examination.3010.desc: "ข้าหยุดอยู่หน้าห้องทำงานของกรรมการคุมสอบ ชะงักกับบทสนทนาแผ่วเบาของพวกเขา "ข้าไม่เคยเห็นนักโกงที่ชาญฉลาด เช่นนี้มาก่อน" กรรมการคุมสอบ [examiner.GetTitledFirstName] กล่าว"
 imperial_examination.3010.scholarship: ""เหตุผลเดียวที่ข้าสังเกตเห็นว่าถุงเท้าของ [entrant.GetTitledFirstName] เต็มไปด้วยคำตอบข้อสอบ ก็ เพราะ [entrant.GetSheHe] เผลอทำน้ำกระเซ็นใส่!""
 imperial_examination.3010.martial: "[entrant.GetTitledFirstName] ก่อวินาศกรรมคันธนูของคู่แข่งโดยการสร้างรอยบากที่แทบมองไม่เห็นบนด้ามจับ เพื่อให้อาวุธหักเมื่อถูกง้างเท่านั้น"
 imperial_examination.3010.outro: "\n\nกรรมการคุมสอบ [examiner_2.GetTitledFirstName] ส่ายหน้า [examiner_2.GetHerHis] และพึมพำ "หากเพียง แต่ [entrant.GetSheHe] นำทักษะ เช่นนี้ไปใช้ในการสอบผ่านด้วยวิธีที่ซื่อสัตย์ [entrant.GetSheHe|U] คงจะเป็นข้าราชการที่น่าเกรงขาม""
 imperial_examination.3010.a: "นักโกงผู้นี้สามารถไถ่โทษ [entrant.GetHerselfHimself] ได้ในการรับใช้ข้า"
 imperial_examination.3010.b: "กรรมการคุมสอบต่างหากที่ต้องถูกลงโทษ!"
 imperial_examination.3010.c: "ข้าจะปล่อยให้กรรมการคุมสอบจัดการเรื่องนี้เอง"

 imperial_examination.3020.t: "มลทินต่อชื่อข้า"
 imperial_examination.3020.desc: "เสียงที่คุ้นเคยร้องตะโกนมาจากคูหาสอบ ดึงข้าออกจากที่พัก ข้าพบ [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('entrant'))] [entrant.GetTitledFirstName] ของข้ากำลังทึ้งผมของ [entrant.GetHerHis] และพึมพำอย่างสับสน\n\n"
 imperial_examination.3020.desc_martial: "[entrant.GetSheHe|U] ทิ้งทวนของ [entrant.GetHerHis] ไว้บนพื้นหญ้า ปล่อยให้คู่ซ้อมของ [entrant.GetHerHis] เกาหมวกเกราะของ [entrant.GetHerHis]"
 imperial_examination.3020.desc_scholarship: "[entrant.GetSheHe|U] ออกจากคูหาของ [entrant.GetHerHis] แต่ยังคงกำ [entrant.GetHerHis] ไว้แน่นด้วยสีหน้าซีดเผือดและตื่นตระหนก"
 imperial_examination.3020.desc.outro: "\n\nเหล่ากรรมการคุมสอบอ้าปากค้างกับการแสดงท่าทีอันน่าทึ่งก่อนที่จะเข้าแทรกแซงอย่างรวดเร็ว แต่ความเสียหายก็ได้เกิดขึ้นแล้ว ผู้เข้าสอบทุกคนได้เห็นสมาชิกราชวงศ์ของข้าเองสติแตกต่อหน้าพวกเขา"
 imperial_examination.3020.a: "[entrant.GetSheHe|U] จะต้องถูกตักเตือนอย่างหนัก"
 imperial_examination.3020.b: "ส่ง [entrant.GetHerHim] กลับบ้าน เดี๋ยวนี้!"
 imperial_examination.3020.c: "อ้อ นี่เป็นลมแดด ไม่มีอะไรมาก"

 imperial_examination.3030.t: "หลับยาม"
 imperial_examination.3030.desc: "มีข่าวมาถึงข้าว่ากรรมการคุมสอบ [examiner.GetFirstName] กำลังสัปหงกต่อหน้าผู้เข้าสอบ มันเริ่มจากข้อศอกไถลบนโต๊ะกรรมการคุมสอบ และไม่นาน [examiner.GetWomanMan] ผู้นั้นก็กรน! \n\nตอนนี้ [examiner.GetSheHe|U] ตื่นแล้ว แต่ใครจะรู้ว่าเหล่าผู้เข้าสอบทำอะไรกันบ้างขณะที่ [examiner.GetSheHe] กำลังงีบหลับ?"
 imperial_examination.3030.a: "นี่ ทำให้ผลลัพธ์ทั้งหมดเป็นที่น่าสงสัย!"
 imperial_examination.3030.a.flavor: "การลงโทษส่วนรวมไม่เคยพลาดเป้าหมาย"
 imperial_examination.3030.b: "ข้าจะจำเรื่องนี้ไว้"
 imperial_examination.3030.c: "ไม่มีใครสังเกตเห็นนอกจากเราแน่ ๆ"

 ### ENTRANT EVENTS ###
 #Hire a stand-in to take the exam for you
 imperial_examination.4000.t: "ด้วยความช่วยเหลือเล็กน้อย"
 imperial_examination.4000.desc: "ตัวอักษร, สัญลักษณ์... ยามข้าหลับตา ข้าเห็นเศษเสี้ยวของข้อความที่ข้าใช้เวลาทั้งวันศึกษา ทุกตวัดพู่กันดูเหมือนลอยอยู่ในความมืด ทว่าความหมายของมันยังคงยากจะเข้าใจ ข้าจะมีเวลาพอที่จะเชี่ยวชาญการตีความที่จำเป็นทั้งหมดหรือไม่?\n\nผู้เข้าสอบอีกคนเขยิบเข้ามาใกล้ข้า อาภรณ์ของ [exam_taker.GetHerHis] เสียดสีกับของข้า "การหักโหมโต้รุ่งเพียงเพื่อการสอบครั้งเดียวมิได้ช่วยบำรุงสติปัญญาเลย ท่านมีเวลาทั้งชีวิตเพื่อเรียนรู้ ให้ข้าเข้าสอบแทนท่านเถิด และพักผ่อนศีรษะที่เหนื่อยล้าของท่านเสีย""
 imperial_examination.4000.a: "ข้า #EMP ต้องการ#! ความช่วยเหลือทุกอย่างที่ข้าจะหาได้..."
 imperial_examination.4000.b: "ไม่ นี่มันผิด"
 imperial_examination.4000.b.cheater: "ก็มีเหตุผล..."
 #Bribe an examiner
 imperial_examination.4010.t: "ความได้เปรียบในที่ลับ"
 imperial_examination.4010.desc: "ทุกย่างก้าวที่กรรมการคุมสอบ [examiner_to_bribe.GetFirstName] เดิน เสียงเหรียญกระทบกันก็ดังตาม ถุงเงินของ [examiner_to_bribe.GetHerHis|U] ตุงจนแทบปริ หลายครั้ง ข้าเห็น [examiner_to_bribe.GetHerHim] กำลังสนทนาเสียงแผ่วเบากับผู้เข้าสอบ พยายามหลบเลี่ยงสายตาที่คอยจับจ้อง แต่ก็ไม่สำเร็จ\n\nชัดเจนว่า [examiner_to_bribe.GetWomanMan] ผู้นี้อยู่ในธุรกิจที่ทำข้อตกลงอัน #EMP ได้กำไร#!..."
 imperial_examination.4010.a: "ข้าควรไปแนะนำตัว"
 imperial_examination.4010.b: "มันไม่คุ้มที่จะเสี่ยง"
 #Stay up studying
 imperial_examination.4020.t: "ความทุกข์ยามค่ำคืน"
 imperial_examination.4020.desc: "ข้านั่งคร่ำเคร่งอยู่กับกองตำรา พลิกอ่านหน้าแล้วหน้าเล่าอย่างบ้าคลั่งในความพยายามที่จะจดจำตัวอักษรทั้งหมดเท่าที่จะทำได้สำหรับการสอบที่กำลังจะมาถึง\n\nอาการปวดตุบ ๆ ที่หน้าผาก ทำให้ข้ารู้ตัวว่าข้ากำลังหรี่ตามากเพียงใดในห้องที่มีแสงสลัว ข้าลุกขึ้นใช้น้ำประพรมที่คอเพื่อบรรเทาความเหนื่อยล้าทางจิตใจ"
 imperial_examination.4020.a: "อีกสักหน่อย..."
 imperial_examination.4020.b: "ข้าทำ เช่นนี้ต่อไปไม่ไหวแล้ว"
 #Study with a friend
 imperial_examination.4030.t: "...จากสหายของข้า"
 imperial_examination.4030.desc: ""[ROOT.Char.GetTitledFirstNameNoTooltip]! เป็นอย่างไรบ้าง? สนใจมาเตรียมตัวสอบเพิ่มกับข้าหรือไม่?" [ROOT.Char.Custom2('RelationToMe', friendly_entrant )] ของข้า, [friendly_entrant.GetTitledFirstName], โบกมือจากที่นั่งแสนสบายของ [friendly_entrant.GetHerHis] ซึ่งอยู่ลึกเข้าไปในโถง\n\nเบื้องหน้า [friendly_entrant.GetHerHim] มีโต๊ะที่เต็มไปด้วยพู่กันอักษรวิจิตรที่กำลังรอให้แห้งและตำรากวีนิพนธ์หนา ๆ หลายสิบเล่ม"
 imperial_examination.4030.outro: "\n\nข้าหยุดครู่หนึ่ง พิจารณาข้อเสนอ การติวด้วยกัน #EMP ก็#! มีข้อดีของมัน..."
 imperial_examination.4030.outro.lover: "\n\n[friendly_entrant.GetSheHe] ดู #EMP น่าดึงดูด#! เช่นนี้มาตลอดหรือเปล่า?"
 imperial_examination.4030.a: ""เราจะเริ่มตรงไหนดี?""
 imperial_examination.4030.b: ""เอ่อ ข้าไม่รังเกียจที่จะศึกษา #EMP ตัวท่าน#! หรอกนะ...""
 imperial_examination.4030.c: ""ข้ามีธุระต้องไป""

 imperial_examination.4050.t: "ไป๋จิ่วรอบดึก"
 imperial_examination.4050.desc: ""พวกเราสองสามคนกำลังวางแผนจะแบ่งปันไป๋จิ่วหนึ่งขวดด้วยกัน ท่านจะร่วมด้วยหรือไม่?" [ROOT.Char.Custom2('RelationToMe', friendly_entrant )] ของข้า, [friendly_entrant.GetTitledFirstName], เอ่ยถามขึ้น พลางตะโกนเรียกข้าที่กำลังยืนอยู่ริมสระน้ำในลานกว้าง ชื่นชมแสงตะวันที่จับเกล็ดปลา"
 imperial_examination.4050.a: "ข้ารู้จักเกมดื่มที่ยอดเยี่ยมที่สุด!"
 imperial_examination.4050.b: "ข้าอยากใช้เวลาตามลำพังกับท่านมากกว่า"
 imperial_examination.4050.c: "ข้ามีธุระต้องไปที่อื่น"

 imperial_examination.4060.t: "คู่แข่งที่อาจเกิดขึ้น"
 imperial_examination.4060.desc_learning: "ข้ากำลังโต้วาทีกับเพื่อน ๆ ที่บ้านพัก เมื่อเสียงแหลมขึ้นจมูกน่ารำคาญขัดจังหวะการโต้แย้งของข้า โดยกล่าวว่า "นั่นเป็นแนวคิดที่ต่ำตมและเป็นที่ถกเถียงอย่างมาก!"\n\nข้าหันไปมองผู้พูด คนหน้าใหม่ไร้ชื่อจาก [ROOT.Char.GetCurrentLocation.GetName] เป็นเวลากว่าหนึ่งชั่วโมงแล้วที่ [promising_lowborn.GetSheHe] เยาะเย้ยและกลอกตาของ[promising_lowborn.GetHerHis]ใส่ทุกคำพูดของข้า \n\nนักวิชาการคนอื่น ๆ หัวเราะคิกคักเยาะเย้ยข้า ยิ่งข้าไม่ทำอะไรกับการดูถูกเหล่านี้"
 imperial_examination.4060.desc_martial: "ข้ามองออกไปที่ลานกว้างนอกโถงที่พักและสังเกตเห็นเสาประตู [Glossary('ชู่จวี','CUJU_GLOSS')] กำลังถูกตั้งขึ้น และเสียงพึมพำแห่งความตื่นเต้นดังมาจากฝูงชนที่มาชุมนุม \n\nข้าชนกับผู้เข้าสอบอีกคนระหว่างทางไปที่เกม [promising_lowborn.GetWomanMan] ผู้นั้น [promising_lowborn.GetWomanMan] หน้าใหม่ไร้ชื่อจาก [ROOT.Char.GetCurrentLocation.GetName] เยาะเย้ยข้าและพูดว่า "แล้วท่านคิดว่าท่านกำลังจะไปไหน? คงไม่ใช่ไปเล่นเกมกระมัง ด้วยขาผอมบางของท่านน่ะ พวกมันจะต้องหักเหมือนกิ่งไม้แน่!" \n\nผู้คนรอบข้างเราหัวเราะคิกคักกับความอวดดีของ [promising_lowborn.GetHerHis] หากข้าไม่ทำอะไรเลย เสียงหัวเราะเยาะของฝูงชนจะต้องหันมาที่ข้าในไม่ช้า"
 imperial_examination.4060.a: "ข้าจะแสดงให้ [promising_lowborn.GetHerHim] ดู!"
 imperial_examination.4060.a.success: "ท่าน ทำให้คนหน้าใหม่กลายเป็นตัวตลก"
 imperial_examination.4060.a.failure: "ท่าน ทำให้ตัวเองกลายเป็นตัวตลก"
 imperial_examination.4060.b: "บางที [promising_lowborn.GetSheHe] อาจมีประเด็นที่ถูกต้องบ้าง?"
 imperial_examination.4060.c: "ปฏิเสธที่จะต่อกร"
 imperial_examination.4060.d: "เจ้า [promising_lowborn.Custom('GetDaughterSon')] ของไอ้แมงดา!"
 imperial_examination.4060.d.tt: "ท่าน ทำให้ [promising_lowborn.GetTitledFirstName] ถูกไล่ออกจากกการสอบในข้อหาที่ครอบครัวของ [promising_lowborn.GetHerHis] ถูกสงสัยว่าประกอบอาชีพอันต่ำต้อย"

 imperial_examination.4070.t: "การสนับสนุนจากครอบครัวที่ไม่ได้ร้องขอ"
 imperial_examination.4070.desc: "ข้าได้ยินเสียงคุ้นเคยนอกห้องสอบและผงะเมื่อเห็น [parent.GetMotherFather] ของข้ากำลังสนทนากับ [examiner.GetTitledFirstName] \n\nข้าดึง[parent.GetMotherFather]ของข้ามาข้าง ๆ และถามว่า[parent.GetMotherFather]มาทำอะไรที่นี่ ซึ่ง[parent.GetMotherFather]ตอบอย่างมีความสุขว่า "ข้าแค่ต้องการช่วยเจ้า ข้าก็มีเส้นสายเหมือนกัน เจ้ารู้ไหม! แค่ให้ข้าเสนอชื่อเจ้าและรับรองว่าเจ้าจะได้รับโอกาสที่จะสำเร็จ" \n\nข้าเหลือบมองไปรอบ ๆ เพื่อให้แน่ใจว่าไม่มีเพื่อนคนใดสังเกตเห็นเรา ตอนนี้ ข้ายังมีเวลาส่ง [parent.GetTitledFirstName] กลับบ้านโดยที่ชื่อเสียงของข้ายังไม่ย่อยยับ"
 imperial_examination.4070.a: "เว้นแต่ [parent.GetSheHe] จะทำอย่างแนบเนียนได้"
 imperial_examination.4070.a.success: "[parent.GetMotherFather] ของท่านซ่อนเร้นเจตนาของ [parent.GetHerHis] ได้สำเร็จ"
 imperial_examination.4070.a.failure: "แผนการของ [parent.GetMotherFatherPossessive] ของท่านถูกเปิดโปง"
 imperial_examination.4070.b: "ข้ายอมทนความอัปยศเพื่อความสำเร็จได้"
 imperial_examination.4070.c: "ท่าน [parent.GetMotherFather] ได้โปรด! #EMP ไปเสีย#!."

 imperial_examination.4080.t: "หนทางที่แตกต่าง"
 imperial_examination.4080.desc: "ทุกที่ที่ข้าไป เสียงพึมพำของการโต้วาทีเชิงวิชาการก็ตามมา \n\nเสียงที่ดุเดือดเป็นพิเศษสองเสียงดังขึ้นเหนือฝูงชน และข้าเลี้ยวหัวมุมไปพบ [examiner_1.GetTitledFirstName] และ [examiner_2.GetTitledFirstName] คู่แข่งทางวิชาการชื่อกระฉ่อนสองคน กำลังโต้เถียงกันอย่างเผ็ดร้อนอีกครั้ง กล่าวคือ ใครเป็นผู้เขียนงานศึกษาที่โดดเด่นที่สุดเกี่ยวกับ [examiner_1.Custom('EruditeTopic')] \n\n[examiner_1.GetTitledFirstName] สบตาข้าและถามว่า "แล้ว #EMP ท่าน#! ชอบตำราเล่มไหนมากกว่ากัน?""
 imperial_examination.4080.a: "ข้าชอบผลงานของ [examiner_1.GetTitledFirstNameNoTooltip] มากกว่า"
 imperial_examination.4080.b: "[examiner_2.GetTitledFirstNameNoTooltip] เป็นนักวิชาการที่มีคุณธรรมที่สุด"
 imperial_examination.4080.c: "ข้าชื่นชอบทั้งสองเท่า ๆ กัน"
 sided_with_examiner_log: "[CHARACTER.GetTitledFirstName|U] เข้าข้าง [TARGET_CHARACTER.GetFirstName] ในข้อพิพาททางวิชาการ"
 sided_with_examiner_log_title: "เข้าข้างกรรมการคุมสอบ"

 imperial_examination.cheat.tt: "ได้รับ [exam_cheat|E]"
 imperial_examination.advantage.tt: "ได้รับ [exam_advantage|E]"
 imperial_examination.has_advantage.tt: "โอกาส #BOL สำเร็จ#! #BOL เพิ่มขึ้น#! เนื่องจาก [exam_advantage|E]\n"
 imperial_examination.has_increased_advantage.tt: "โอกาส #BOL สำเร็จ#! #BOL เพิ่มขึ้นอย่างมาก#! เนื่องจาก [exam_advantage|E]\n"
 imperial_examination.caught_cheating.tt: "#warning ลด#! การได้รับค่าความดีความชอบของท่านเมื่อสิ้นสุดการสอบ"
 imperial_examination.cheat_spent.tt: "ท่าน #BOL ใช้#! [exam_cheat|E]\n"
 imperial_examination.cheat_wash.tt: "ความผิดพลาดของท่านถูกกลบเกลื่อนและการโกงก็ถูกลืมเลือน"

 imperial_examination.4090.t: "ผู้มีอุดมการณ์เดียวกัน"
 imperial_examination.4090.desc: "ความรู้สึกคาดหวังอย่างประหม่าอบอวลไปทั่วโถงที่พัก ถูกปัดเป่าไปเพียงด้วยใบหน้าที่น่าพึงพอใจของ [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('other_entrant'))] [other_entrant.GetTitledFirstName] ของข้า \n\nเมื่ออยู่กับ [other_entrant.GetHerHim] ข้าไม่จำเป็นต้องอธิบายตนเอง และทุกถ้อยคำของข้าก็ก้องกังวานอย่างลึกซึ้ง การสนทนาของเรามีชีวิตชีวาขึ้นมาเอง และ ทำให้เราทั้งคู่ประหลาดใจกับการพลิกผันของมัน! \n\nในที่สุด [other_entrant.GetSheHe] ก็โน้มตัวเข้ามาและพูดว่า "ข้ารู้จักคนที่มีความคิดคล้ายกันอีกหลายคนที่กระตือรือร้นอยากพบท่าน หากท่านต้องการให้ข้าแนะนำให้รู้จักสักรอบ?""
 imperial_examination.4090.a: "ข้ากระตือรือร้นที่จะพบพวกเขา!"
 imperial_examination.4090.b: "ข้ามีตำราสำคัญต้องอ่าน"
 imperial_examination.4090.b.tt: "ความขยันหมั่นเพียรของท่านก่อให้เกิด [merit_i][merit|E]"

 imperial_examination.4100.t: "กระดาษแผ่นหนึ่ง"
 imperial_examination.4100.desc: "ข้าเดินอย่างระมัดระวังท่ามกลางคูหาสอบ หวังว่าจะซ่อนกระดาษชิ้นเล็ก ๆ ที่เตรียมข้อมูล #EMP ที่เป็นประโยชน์#! ไว้ก่อนการทดสอบที่กำลังจะมาถึง \n\nทันทีที่ข้าพบแผ่นไม้ที่หลวม ๆ ในผนังคูหาแห่งหนึ่ง ข้าก็ได้ยินเสียงกระแอมอย่างจงใจจากด้านหลัง [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('other_entrant'))] [other_entrant.GetTitledFirstName] ของข้า เข้ามาใกล้ข้าโดยไม่ส่งเสียงได้อย่างไรไม่ทราบ \n\n[other_entrant.GetSheHe|U] ถามว่า "ท่านกำลังทำอะไรตรงนั้น?""
 imperial_examination.4100.a: "แบ่งปันคำตอบเพื่อปลอบโยน [other_entrant.GetTitledFirstNameNoTooltip]"
 imperial_examination.4100.a.success: "[other_entrant.GetTitledFirstNameNoTooltip] ถูกโน้มน้าวให้โกงกับท่าน"
 imperial_examination.4100.a.failure: "[other_entrant.GetTitledFirstNameNoTooltip] ไม่ถูกโน้มน้าว"
 imperial_examination.4100.b: ""ข้ามาที่นี่เพื่อเข้าสู่กรอบความคิดของนักเรียน""
 imperial_examination.4100.b.success: "[other_entrant.GetTitledFirstNameNoTooltip] เชื่อคำโกหกของท่าน"
 imperial_examination.4100.b.failure: "[other_entrant.GetTitledFirstNameNoTooltip] ไม่หลงกล"
 imperial_examination.4100.c: "โยนกระดาษลงในแอ่งน้ำใกล้ ๆ"

 imperial_examination.8000.t: "ณ พระราชวัง"
 imperial_examination.8000.desc: "ข้าพบว่าตนเองอยู่ท่ามกลางเหล่าบัณฑิตที่มีแววที่สุดของอาณาจักร ตลอดชีวิตของข้า ข้ารอคอยช่วงเวลานี้ ในไม่ช้า ข้าจะได้เดินในสวนของพระราชวัง ได้ลิ้มรสอาหารที่หรูหราที่สุดที่จักรวรรดิมีให้ และได้ยืนต่อหน้า [host.GetTitleAsNameNoTooltip] [host.GetHerselfHimself]"
 imperial_examination.8000.a: "ดวงตาแห่งสวรรค์กำลังจ้องมองข้า!"

 imperial_examination.8010.t: "ณ โรงเตี๊ยม"
 imperial_examination.8010.desc: "ข้าไม่ได้ถูกจำกัดอยู่ในบริเวณที่ทำการสอบอีกต่อไป แต่ข้าก็ยังใช้เวลาครู่หนึ่งก่อนที่จะไปพบหน้าสหายและครอบครัว"
 imperial_examination.8010.desc_worried: "ความจอแจของโรงเตี๊ยมไม่สามารถเข้าถึงข้าได้ ขณะที่ข้านั่งครุ่นคิดว่าข้าจะสามารถทำสิ่งใดที่แตกต่างออกไปได้บ้าง"
 imperial_examination.8010.desc_fallback: "ในที่สุดการสอบก็สิ้นสุดลง และข้าสามารถถอนหายใจอย่างโล่งอกได้"
 imperial_examination.8010.a: "ข้าควรจดจ่อกับการศึกษา"
 imperial_examination.8010.b: "ถึงกระนั้น ข้าก็พอใจกับผลลัพธ์ของข้า"

 imperial_examination.9000.t: "การรวมตัวที่ทรงเกียรติที่สุด"
 imperial_examination.9000.desc.intro: "เมื่อการสอบระดับมหานครสิ้นสุดลง ผู้คุมสอบ [examiner.GetFirstName] แนะนำให้ข้ารู้จักกับผู้เข้าสอบที่ได้คะแนนสูงสุด [first_char.GetTitledFirstName]\n\n"ความถนัดของ [first_char.GetWomanMan] ผู้นี้ในด้าน"
 imperial_examination.9000.desc.diplomacy: "การทูต"
 imperial_examination.9000.desc.martial: "การสงคราม"
 imperial_examination.9000.outro: "สร้างความประทับใจให้เราทุกคนในวันนี้" [examiner.GetFirstNameNoTooltip] กล่าว "ผู้เข้าสอบอันดับสูงคนอื่น ๆ กำลังถูกนำตัวไปยังพระราชวัง ในขณะที่เรากำลังพูดอยู่นี้"\n\n[first_char.GetFirstNameNoTooltip] โค้งคำนับอย่างสุดซึ้งและกล่าว เสียงของ [first_char.GetHerHis] แผ่วเบาด้วยความเคารพ "ข้ามีชีวิตอยู่เพื่อรับใช้ [ROOT.Char.GetTitleAsNameNoTooltip]""
 imperial_examination.9000.a: "ข้าคาดหวัง [ROOT.Char.GetInvolvedActivity.Custom('GetExamFocusSkill')]"
 imperial_examination.9000.a.tt_martial: "ท่านได้รับตัวเลือกนี้ เนื่องจาก [activity_option|E] $imperial_examination_focus_martial$ ของท่าน"
 imperial_examination.9000.a.tt_learning: "ท่านได้รับตัวเลือกนี้ เนื่องจาก [activity_option|E] $imperial_examination_focus_learning$ ของท่าน"
 imperial_examination.9000.a.tt_stewardship: "ท่านได้รับตัวเลือกนี้ เนื่องจาก [activity_option|E] $imperial_examination_focus_stewardship$ ของท่าน"
 imperial_examination.9000.b: "เจ้าได้ให้เกียรติจักรวรรดิเป็นอย่างดี"
 exam_focus_martial: "บัณฑิตสายการทหาร"
 exam_focus_learning: "บัณฑิตสายการเรียนรู้"
 exam_focus_stewardship: "บัณฑิตสายการดูแล"

 examination_first_place_entrant_noticed_title: "สวรรค์สังเกตเห็น"
 examination_first_place_entrant_noticed: "[host.GetTitleAsNameNoTooltip] แสดงความยินดีกับ [TARGET_CHARACTER.GetShortUIName] ในอันดับที่สูงของ [TARGET_CHARACTER.GetHerHis]"

 imperial_examination.9001.t: "ภายใต้สายตาของสวรรค์"
 imperial_examination.9001.desc: "แทบไม่ทันที่เหงื่อจะแห้ง ข้าก็ถูกนำตัวไปหา [host.GetTitleAsNameNoTooltip] มือของข้าปวดเมื่อยจากการจับ"
 imperial_examination.9001.desc_brush: "พู่กัน"
 imperial_examination.9001.desc_weapon: "อาวุธ"
 imperial_examination.9001.desc_bridge: "อย่างมั่นคงตลอดทั้งวัน ข้าได้รับแจ้งว่าข้าได้คะแนนสูงสุดในบรรดา [ROOT.Char.GetWomenMen] ที่ถูกเลือกทั้งหมดของอาณาจักร"
 imperial_examination.9001.desc_denied: "\n\nน่าประหลาดใจที่ [host.GetTitleAsNameNoTooltip] เพียงแค่เหลือบมองข้าขณะที่ข้าหมอบกราบต่อหน้า [host.GetHerHim] แล้วพูดว่า "ข้าคาดหวัง [ROOT.Char.GetInvolvedActivity.Custom('GetExamFocusSkill')]"\n\nใบหน้าของข้าร้อนผ่าวเมื่อผู้เข้าสอบคนอื่นถูกนำเข้ามาเพื่อรับการยกย่องแทนข้า [favored_entrant.Custom2('MyCharacterIntroduction', ROOT.Char)]"
 imperial_examination.9001.desc_merit: "\n\nข้าหมอบกราบต่อหน้า [host.Custom('GetDaughterSon')] แห่งสวรรค์ [host.GetHerselfHimself] โค้งคำนับให้ลึกที่สุดเท่าที่หลังข้าจะทำได้\n\n"ท่านได้ให้เกียรติอาณาจักรเป็นอย่างดี" [host.GetSheHe] กล่าว ข้าเห็นแววตาแห่งความภาคภูมิใจในดวงตาของ [host.GetHerHis] หรือไม่? แสงไฟในห้องพิจารณาคดีนี้คงกำลังเล่นตลกกับข้า"
 imperial_examination.9001.a: "ข้ามีชีวิตอยู่เพื่อรับใช้"
 imperial_examination.9001.b: "ข้าจะไม่มีวันลืมสิ่งนี้!"
 imperial_examination.9001.c: "ข้าจะ ทำให้ดีขึ้น ไม่ว่าจะต้องแลกด้วยอะไรก็ตาม"
 imperial_examination.9001.d: "สงบสติอารมณ์ไว้..."

 tgp_changed_ways_modifier: "เปลี่ยนวิถี"
 tgp_changed_ways_modifier_desc: "ตัวละครนี้ได้เริ่มต้นเส้นทางใหม่ เพื่อรับใช้ราชสำนักให้ดียิ่งขึ้น"

 ### EXAM EVENTS ###
 #The [Exam] Essay
 imperial_examination.5000.t: "คำถามทั่วไป"
 imperial_examination.5000.desc.cheater: "ข้ารู้สึกถึงสายตาของเพื่อน ๆ ที่กำลังจ้องมองแผ่นหลังข้าจนแทบทะลุ ขณะที่ข้าเข้าสู่ห้องสอบและพบคูหาของข้า จะมีกี่คนที่รู้เรื่องการล่วงละเมิดของข้า? ข้ากำลังจินตนาการไปเองหรือ? ข้าต้องปัดความคิดเหล่านี้ทิ้งไปและจดจ่อกับเรียงความที่กำลังจะมาถึง"
 imperial_examination.5000.desc: "กรรมการคุมสอบ [examiner.GetTitledFirstName] มองข้าอย่างน่าอับอายขณะที่ข้านั่งยอง ๆ ในที่นั่ง พยายามรวบรวมสติก่อนการเขียนเรียงความที่กำลังจะมาถึง"
 imperial_examination.5000.desc_bridge: "\n\nข้าถูกขอให้กล่าวถึงหัวข้อต่อไปนี้:"
 governance_weaponry: ""มีคนอ้างว่าตนมีเพียงหอก ทว่ากลับแอบครอบครองหน้าไม้เป็นการลับ บทลงโทษใดที่ควรบังคับใช้?""
 governance_reinstatement: ""ขุนนางผู้สมควรได้รับการคืนตำแหน่งกลับถูกปฏิเสธ ในขณะที่ขุนนางผู้ไม่สมควรกลับได้รับการคืนตำแหน่ง ควรตัดสินสถานการณ์นี้อย่างไร?""
 governance_documents: "หากเจ้าหน้าที่เปิดเอกสารที่ปิดผนึกไว้โดยไม่ได้รับอนุญาตอย่างถูกต้อง พวกเขาควรถูกลงโทษทางวินัยอย่างไร?"
 governance_filial: ""หากอาชญากรที่ไม่เป็นที่รู้จักญาติมิตร ซึ่งถูกตัดสินประหารชีวิต ได้รับการอภัยโทษหลังจากการประหารชีวิตแล้ว ควรมีการแก้ไขเอกสารที่เหมาะสมเพื่อฟื้นฟูชื่อเสียงของพวกเขาหรือไม่?""
 imperial_examination.5000.a: "พู่กันข้าอยู่ไหน!"
 imperial_examination.5000.a.cheater: "ข้าจะ ทำให้ดีที่สุด..."
 imperial_examination.5000.b: ""[ROOT.Char.MakeScope.Var('has_exam_taker').Char.GetFirstNameNoTooltip], ไป!""
 imperial_examination.5000.c: ""กรรมการคุมสอบ [ROOT.Char.MakeScope.Var('has_bribed_examiner').Char.GetFirstNameNoTooltip], ได้โปรดดูคำตอบ #EMP ของข้า#!...""
 imperial_examination.5000.d: ""ท่านผู้คุมสอบ [ROOT.Char.MakeScope.Var('has_blackmailed_examiner').Char.GetFirstNameNoTooltip], ท่านจำ #EMP ผู้ปกครอง#! ของข้าได้ใช่หรือไม่?""
 imperial_examination.5000.e: "#EMP เหลือบมองโพยคำตอบที่ซ่อนไว้#! "
 imperial_examination.5000.f: "$imperial_examination.5000.d$"

 imperial_examination.duel.essay.critical_success.tt: "ท่านเขียนเรียงความที่ได้รับการยกย่องอย่างสูง"
 imperial_examination.duel.essay.great_success.tt: "ท่านเขียนเรียงความได้ดี"
 imperial_examination.duel.essay.success.tt: "เรียงความของท่านใช้ได้"
 imperial_examination.duel.essay.failure.tt: "ท่านล้มเหลวในการเขียนเรียงความที่เหมาะสม"

 #A [Exam] Classic
 imperial_examination.5050.t: "เพื่อพูดในนามของปราชญ์"
 imperial_examination.5050.history: ""เพื่อยึดมั่นในบันทึกข้อบังคับ ตามที่กล่าวไว้ในคัมภีร์ประวัติศาสตร์ ผู้นั้นจำต้องรู้เรื่องราวของผู้ปกครองในอดีต"$imperial_examination.5050.desc$ ข้าถูกขอให้แสดงความรู้เกี่ยวกับสุนทรพจน์ [ROOT.Char.Custom('GetRandomHistoryPassage')]"
 imperial_examination.5050.changes: ""เพื่อเอาชนะความยากลำบากทางวัตถุ ตามที่กล่าวไว้ในคัมภีร์แห่งการเปลี่ยนแปลง ผู้นั้นต้องค้นพบว่าตนเป็นส่วนหนึ่งของจักรวาล"$imperial_examination.5050.desc$ ข้าถูกกระตุ้นให้บรรยายความเข้าใจของข้าเกี่ยวกับรูปแบบการทำนายในตำรา ตั้งแต่เส้นสายมากมายไปจนถึงสัตว์ทั้งหก"
 imperial_examination.5050.poetry: ""เพื่อสะท้อนพฤติกรรมของมนุษย์ ตามที่กล่าวไว้ในคัมภีร์บทกวี ผู้นั้นต้องตั้งกระจกแห่งการสำรวจตนเอง"$imperial_examination.5050.desc$ ข้าได้รับมอบหมายให้ตีความบทกวี [ROOT.Char.Custom('GetRandomPoetryPassage')]"
 imperial_examination.5050.annals: ""เพื่อวิเคราะห์ธรรมชาติของความจริงและความเท็จ ตามที่กล่าวไว้ในพงศาวดารชุนชิว ผู้นั้นต้องเรียนรู้จากความเขลาของราชวงศ์ในอดีต"$imperial_examination.5050.desc$ ข้าต้องขยายความเกี่ยวกับ [ROOT.Char.Custom('GetRandomAnnalsPassage')]"
 imperial_examination.5050.rites: ""เพื่อเข้าใจระเบียบของโลก ตามที่กล่าวไว้ในคัมภีร์พิธีกรรม ผู้นั้นต้องเคารพในพิธีการที่เหมาะสม"$imperial_examination.5050.desc$ ข้าต้องระบุข้อความสำคัญของ [ROOT.Char.Custom('GetRandomRitesPassage')]"
 imperial_examination.5050.desc: "\n\nนั่นคือข้อความเปิดบนแบบสอบถามตรงหน้าข้า พื้นที่ว่างตรงกลาง [ROOT.Char.Custom('GetWritingMaterial')] ดูใหญ่โตอย่างไม่อาจหยั่งถึง\n\nสำหรับการทดสอบนี้,"
 imperial_examination.5050.a: "ดังที่อาจารย์ขงกล่าวไว้..."
 imperial_examination.5050.b: ""[ROOT.Char.MakeScope.Var('has_exam_taker').Char.GetFirstNameNoTooltip], ไป!""
 imperial_examination.5050.c: ""กรรมการคุมสอบ [ROOT.Char.MakeScope.Var('has_bribed_examiner').Char.GetFirstNameNoTooltip], หากท่านเห็น #EMP ด้าน#! ของข้าในเรื่องนี้...""
 imperial_examination.5050.d: ""กรรมการคุมสอบ [ROOT.Char.MakeScope.Var('has_blackmailed_examiner').Char.GetFirstNameNoTooltip], #EMP ครอบครัว#! ของข้าชื่นชอบตำราเล่มนี้มาโดยตลอด""
 imperial_examination.5050.e: "$imperial_examination.5000.e$"
 imperial_examination.5050.f: "$imperial_examination.5050.d$"
 imperial_examination.duel.classics.critical_success.tt: "การตีความข้อความของท่านประสบความสำเร็จอย่างยิ่งยวด"
 imperial_examination.duel.classics.great_success.tt: "ท่านตั้งข้อสังเกตที่ดีมากเกี่ยวกับข้อความนี้"
 imperial_examination.duel.classics.success.tt: "ข้อความของท่านใช้ได้"
 imperial_examination.duel.classics.failure.tt: "ท่านทำข้อความนี้พังไม่เป็นท่า"

 #[Exam] Poetry
 imperial_examination.5100.t: "กวีนิพนธ์ [ROOT.Char.Custom('GetRegionalPoetryExam')]"
 imperial_examination.5100.desc: "ผู้เข้าสอบรวมตัวกันที่คูหาสอบ และข้าเข้าประจำที่ท่ามกลางพวกเขา แม้จะมีจำนวนมาก แต่ก็เงียบสงัด ยกเว้นเสียงใบไม้ไหวที่ถูกลมพัดเบา ๆ ธูปกำลังลุกไหม้ที่แท่นบูชาใกล้ ๆ ทำให้ข้าสงบใจได้เล็กน้อย\n\nเราจะต้อง แต่งบทกวีในองค์ประกอบสี่บรรทัด หากข้าจะประสบความสำเร็จ,"
 imperial_examination.5100.desc.river: "ข้าต้องปล่อยให้ความคิดของข้าไหลเชี่ยวชัดเจนดั่งแม่น้ำ"
 imperial_examination.5100.desc.straight: "ข้าต้องปล่อยให้ความคิดของข้าหยั่งรากลึกลงไปในปฐพี"
 imperial_examination.5100.desc.explosive: "ข้าต้องเขียนอย่างเร่าร้อน โดยไม่ยับยั้ง!"
 imperial_examination.5100.desc.lofty: "ข้าต้องปล่อยให้ความคิดของข้าท่องไปไกลถึงสุดขอบฟ้า"
 imperial_examination.5100.desc.fallback: "ข้าต้องดึงแรงบันดาลใจจากบทกวีทั้งหมดที่ข้าเคยอ่าน"
 imperial_examination.5100.a: "ข้าเอื้อมหยิบพู่กัน"
 imperial_examination.5100.b: ""[ROOT.Char.MakeScope.Var('has_exam_taker').Char.GetFirstNameNoTooltip], ไป!""
 imperial_examination.5100.c: ""กรรมการคุมสอบ [ROOT.Char.MakeScope.Var('has_bribed_examiner').Char.GetFirstNameNoTooltip], ข้าเชื่อว่าท่านทราบดีถึงความสามารถอันกว้างขวางของข้า""
 imperial_examination.5100.d: ""กรรมการคุมสอบ [ROOT.Char.MakeScope.Var('has_blackmailed_examiner').Char.GetFirstNameNoTooltip], #EMP ผู้ปกครอง#! ของข้าสอนทุกอย่างที่ข้ารู้เกี่ยวกับกวีนิพนธ์""
 imperial_examination.5100.e: "$imperial_examination.5000.e$"
 imperial_examination.5100.f: "ข้ารู้ว่าต้องเขียนอะไร..."
 imperial_examination.5100.g: "$imperial_examination.5000.e$"
 imperial_examination.duel.poetry.critical_success.tt: "เวลาดูเหมือนจะหยุดนิ่งเมื่อท่านอ่านบทกวีของท่าน"
 imperial_examination.duel.poetry.great_success.tt: "บทกวีของท่านยอดเยี่ยมมาก"
 imperial_examination.duel.poetry.success.tt: "บทกวีของท่านใช้ได้"
 imperial_examination.duel.poetry.failure.tt: "ท่านสะดุดและล้มเหลวในการเขียนบทกวีที่น่าดึงดูดใจ"

 imperial_examination.5150.t: "การแข่งขันยิงธนู"
 imperial_examination.5150.desc: "ผู้เข้าสอบรวมตัวกันที่สนามยิงธนู และข้าเข้าประจำที่ท่ามกลางพวกเขา \n\nแม้จะมีจำนวนมาก แต่ก็เงียบสงัด ยกเว้นเสียงกระทบกันเบา ๆ ของชุดเกราะขณะที่เราเคลื่อนไปยังตำแหน่งของเรา \n\nผู้เข้าสอบที่อยู่ข้างหน้าข้าในแถวกำลังเตรียมคันธนูของ [other_entrant.GetHerHis]"
 imperial_examination.5150.a: "ข้าจับคันธนูของข้าอย่างมั่นคง"
 imperial_examination.5150.b: ""[ROOT.Char.MakeScope.Var('has_exam_taker').Char.GetFirstNameNoTooltip], ท่านยิงเถิด""
 imperial_examination.5150.c: ""[ROOT.Char.MakeScope.Var('has_bribed_examiner').Char.GetFirstNameNoTooltip], ได้โปรดตรวจสอบเป้าหมาย #EMP ของข้า#!...""
