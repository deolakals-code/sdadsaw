 imperial_examination.5170.t: "การประเมินการยิงธนูบนหลังม้า"
 imperial_examination.5170.desc: "ตื่นก่อนไก่โห่ ผู้เข้าสอบคนอื่น ๆ และข้าถูกปลุกจากเตียงและพาไปยังสนามยิงธนูกลางแจ้ง\n\nฝูงม้าชั้นดีรอเราอยู่ที่นั่น บนยอดเขาที่สว่างไสว ผู้เข้าสอบที่อยู่ข้างหน้าข้าในแถวเตรียมม้าของ [other_entrant.GetHerHis] จากนั้นก็เริ่ม"
 imperial_examination.5170.a: "ข้าคว้าบังเหียน"
 imperial_examination.5170.b: ""[ROOT.Char.MakeScope.Var('has_exam_taker').Char.GetFirstNameNoTooltip], เข้าแทนที่ข้า""
 imperial_examination.5170.c: ""กรรมการคุมสอบ [ROOT.Char.MakeScope.Var('has_bribed_examiner').Char.GetFirstNameNoTooltip], ตั้งใจดู!""
 imperial_examination.5170.d: ""ผู้ปกครองของข้าเป็นนักขี่ม้ายิงธนูที่ยอดเยี่ยม ใช่หรือไม่ [ROOT.Char.MakeScope.Var('has_blackmailed_examiner').Char.GetFirstNameNoTooltip]?""
 imperial_examination.5170.e: "คันธนูกับข้าเป็นหนึ่งเดียวกัน ข้าล้มเหลวไม่ได้!"
