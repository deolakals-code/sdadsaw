 horse_exam_hunter_success_first: "ท่านได้รับตัวเลือกนี้ เนื่องจาก [trait|E] [GetTrait('lifestyle_hunter').GetName( GetNullCharacter )] ของท่าน"

 other_entrant_thundering_success: "ควบม้าเข้าสู่สนาม กีบม้าดังสนั่นไปทั่วทุ่งราบ แม้ว่าม้าจะเร็ว [other_entrant.GetSheHe] ก็นั่งนิ่งอย่างสมบูรณ์แบบบนหลังม้า มันเป็นภาพที่น่าประทับใจและค่อนข้างน่าเกรงขาม"
 other_entrant_practiced_ride: "ควบม้าอย่างคล่องแคล่วไปทั่วสนาม แต่ขาดความกล้าที่จะง้างคันธนูของ [other_entrant.GetHerHis] ทำให้เป็นภาพที่น่าสมเพช"
 other_entrant_spooked_horse: "ใช้เดือยกระตุ้นม้าผู้น่าสงสารให้ตกใจ ซึ่งมันก็สะบัดเขาตกลงมาได้สำเร็จ เป็นภาพที่น่าสมเพช แต่ก็ค่อนข้างน่าสบายใจ"
 other_entrant_swift_success: "ควบม้าอย่างรวดเร็วข้ามทุ่งราบ ส่งลูกธนูเป็นชุด ๆ ติดต่อกันอย่างรวดเร็ว การเคลื่อนไหวของ [other_entrant.GetHerHis] ไหลลื่นดั่งสายน้ำ"
 other_entrant_shortstop_fail: "ควบม้าข้ามสนาม โน้มตัวไปข้างหน้าบนอานม้าได้พอดี แต่ไม่มีลูกธนูของ [other_entrant.GetHerHis] ลูกใดยิงเข้าเป้าเลย"

