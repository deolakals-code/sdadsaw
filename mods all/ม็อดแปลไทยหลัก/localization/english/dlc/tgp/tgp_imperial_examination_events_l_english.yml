 imperial_examination.5200.t: "การสาธิตการยิงธนู"
 imperial_examination.5200.desc: "[host.GetTitleAsNameNoTooltip] จ้องมองข้าด้วยสายตาประเมิน ด้วยท่าทางกวาดมือไปยังเหล่าผู้เข้าสอบ [host.GetSheHe] ประกาศว่า "ท่าทางที่ไม่เหมาะสมทรยศต่อความซื่อสัตย์ เทคนิคที่ย่ำแย่เผยให้เห็นถึงเจตจำนงที่อาจถูกชักจูงได้"\n\n[host.GetSheHe|U] ประสานนิ้วมือ [host.GetHerHis] เข้าด้วยกันและทอดสายตาไปทั่วลานกว้าง "จากวิถีลูกธนูของเจ้า ข้าจะตัดสินความสามารถของเจ้าในการพิชิตเมือง ปกป้องพรมแดนของเรา นี่คือโอกาสสุดท้ายของเจ้าที่จะ ทำให้ข้าประทับใจ"\n\n[host.GetSheHe|U] หันมาและกวักมือเรียกข้าไปข้างหน้า"
 imperial_examination.5200.a: "ข้าจะทุ่มสุดตัว!"
 imperial_examination.5200.b: "ไม่เสี่ยงเลยจะดีกว่า"

 imperial_examination.5300.t: "เรียงความหลวง"
 imperial_examination.5300.desc: "[host.GetTitleAsNameNoTooltip] จ้องมองข้าด้วยสายตาประเมิน ด้วยท่าทางกวาดมือไปยังเหล่าผู้เข้าสอบ [host.GetSheHe] ประกาศว่า "การศึกษาคัมภีร์คลาสสิกที่ย่ำแย่ทรยศต่อคุณธรรม คำวิจารณ์ที่อ่อนแอเผยให้เห็นถึงปณิธานที่โอนอ่อน"\n\n[host.GetSheHe|U] ประสานนิ้วมือ [host.GetHerHis] เข้าด้วยกันและทอดสายตาไปทั่วลานกว้าง "จากตวัดพู่กันของเจ้า ข้าจะตัดสินความสามารถของเจ้าในการปกครองไพร่ฟ้า รักษาขนบธรรมเนียมของเรา นี่คือโอกาสสุดท้ายของเจ้าที่จะ ทำให้ข้าประทับใจ"\n\n[host.GetSheHe|U] หันมาและกวักมือเรียกข้าไปข้างหน้า"
 imperial_examination.5300.a: "ข้าจะนำเสนอข้อโต้แย้งอย่างละเอียด"
 imperial_examination.5300.b: "$imperial_examination.5200.b$"

