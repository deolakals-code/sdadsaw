 other_entrant_impressive_success: "เสียงพึมพำแสดงความชื่นชมดังมาจากฝูงชนที่มุงดูขณะที่ [other_entrant.GetSheHe] ยิงลูกธนูของ [other_entrant.GetHerHis] ปักลึกเข้าเป้าอย่างมั่นคง"
 other_entrant_spinning_safe: "ลูกธนูพุ่งเป็นวิถีโค้งต่ำ หมุนอย่างบ้าคลั่งในสายลม แต่ก็ยังคงโดนขอบล่างของเป้าหมาย"
 other_entrant_embarrased_cough: "ลูกธนูพุ่งออกไปไกลมากจนข้าไม่ได้ยินเสียงมันตกลงหลังเป้าหมาย ที่ไหนสักแห่ง มีคนกระแอม"
 other_entrant_piercing_success: "ลูกธนูปักลึกเข้าเป้าจนทะลุไปด้านหลัง"
 other_entrant_drooping_safe: "ลูกธนูตกลงที่ขอบเป้า การปักตื้น ๆ ทำให้หางลูกธนูห้อยลงอย่างน่าเศร้า"
 other_entrant_vanishing_arrow: "ลูกธนูเฉี่ยวที่มุมเป้าหมายก่อนจะหายไปด้านหลัง"

 imperial_examination.5160.t: "การสาธิตอาวุธด้ามยาว"
 imperial_examination.5160.desc: "น้ำหนักของเครื่องแบบเป็นความคุ้นเคยที่ปลอบโยนขณะที่ข้าเข้าแถวเคียงข้างผู้เข้าสอบคนอื่น ๆ เป้าหมายฟางถูกวางไว้ทั่วลานกว้างหน้าพระราชวัง [ROOT.Char.GetCurrentLocation.GetName]\n\nตาของข้ากำลังจะมาถึง ต่อจาก [other_entrant.GetTitledFirstName] ผู้ ซึ่ง"
 imperial_examination.5160.a: "ข้าเข้าประจำตำแหน่ง"
 imperial_examination.5160.b: ""[ROOT.Char.MakeScope.Var('has_exam_taker').Char.GetFirstNameNoTooltip], เข้าแทนที่ข้า""
 imperial_examination.5160.c: ""กรรมการคุมสอบ [ROOT.Char.MakeScope.Var('has_bribed_examiner').Char.GetFirstNameNoTooltip], ดูข้าสิ!""
 imperial_examination.5160.d: ""กรรมการคุมสอบ [ROOT.Char.MakeScope.Var('has_blackmailed_examiner').Char.GetFirstNameNoTooltip], ท่านย่อมรู้ถึงความกล้าหาญในการรบของผู้ปกครองข้า!""
 imperial_examination.5160.e: ""กรรมการคุมสอบ [ROOT.Char.MakeScope.Var('has_blackmailed_examiner').Char.GetFirstNameNoTooltip], นี่ ทำให้ท่านนึกถึง #EMP การเข้าถึงอันยาวไกล#! ของครอบครัวข้าหรือไม่?""

 other_entrant_cutting_success: "ตัดหัวเป้าหมายของ [other_entrant.GetHerHis] ด้วยท่าทางอันสง่างามที่นำรอยยิ้มมาสู่ใบหน้าของกรรมการคุมสอบ"
 other_entrant_practiced_safe: "หมุนตัว ปัดป้อง และโจมตีคู่ต่อสู้ฟางของ [other_entrant.GetHerHis] ไปรอบ ๆ ด้วยท่าทางที่ฝึกฝนมา แม้จะคาดเดาได้บ้าง"
 other_entrant_stuck_fail: "พุ่งเข้าใส่เป้าหมายของ [other_entrant.GetHerHis] อย่างกล้าหาญ แต่ไม่รู้ทำไมอาวุธของ[other_entrant.GetHerHis]ถึงติดอยู่ในร่างฟางเล็ก ๆ นั้น"
 other_entrant_practiced_success: "เคลื่อนไหวด้วยความชำนาญ คล่องแคล่วราวกับเป็นธรรมชาติ จนส่งเสียงพึมพำอิจฉาไปทั่วฝูงชน"
 other_entrant_stumbling_fail: "สะดุดและล้มลง อาวุธของ [other_entrant.GetHerHis] หล่นกระทบพื้นเสียงดัง ข้าถอนหายใจอย่างโล่งอก"

