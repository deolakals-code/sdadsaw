 natural_disaster_earthquake_warning_situation_phase: "แรงสั่นสะเทือนล่วงหน้า"
 natural_disaster_earthquake_warning_situation_phase_desc: "ใน [situation_phase|E] แรงสั่นสะเทือนล่วงหน้า จะรับรู้ได้ถึงแรงสั่นสะเทือนเล็กน้อยทั่วแผ่นดิน แม้จะรุนแรงเพียงเท่าฝูงม้าควบตะบึง แต่แรงสั่นไหวนี้อาจเป็นลางบอกเหตุถึงพลังทำลายล้างที่ใหญ่หลวงและรุนแรงกว่า ซึ่งเคลื่อนตัวอยู่ใต้พื้นพิภพ"
