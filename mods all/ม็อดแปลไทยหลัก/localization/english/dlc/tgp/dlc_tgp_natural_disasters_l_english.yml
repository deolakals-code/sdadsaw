 natural_disaster_earthquake_impact_situation_phase: "ผลกระทบ"
 natural_disaster_earthquake_impact_situation_phase_desc: "หลังแรงสั่นสะเทือนแผ่วเบา ผืนดินก็สั่นไหวอย่างรุนแรง อาคารอาจพังทลาย และผู้คนอาจบาดเจ็บหรือล้มตายจากเศษซากที่ร่วงหล่น รอยแยกอาจปรากฏขึ้น ณ จุดศูนย์กลางแผ่นดินไหว แยกแผ่นดินออกเป็นสองส่วน การเคลื่อนไหวอย่างฉับพลันอาจ ทำให้ฝุ่นผงและเศษซากฟุ้งกระจายในอากาศ เพิ่มอันตรายถึงชีวิตแก่ทุกคนที่อยู่ใกล้เคียง"
 situation_natural_disaster_phase_earthquake_impact_effects: "$situation_natural_disaster_earthquake_phase_impact$"

 natural_disaster_earthquake_recovery_situation_phase: "การฟื้นฟู"
 natural_disaster_earthquake_recovery_situation_phase_desc: "หลังผลกระทบหลักผ่านพ้น ผลกระทบทั้งหมดของภัยพิบัติก็ปรากฏชัดเจน ไพร่ฟ้าอาจเริ่มไม่พอใจ เนื่องจากทรัพย์สินและการทำมาหากินได้รับความเสียหายหรือถูกทำลาย เศษซากปรักหักพังขัดขวางความพยายามในการฟื้นฟู และการสูญเสียชีวิต ทำให้การฟื้นฟูช้าลงจากจำนวนประชากรและแรงงานที่ลดลง"
