 # Modifiers
 tgp_natural_disaster_earthquake_1_county_modifier: "แผ่นดินไหว"
 tgp_natural_disaster_earthquake_1_county_modifier_desc: "เคาน์ตีนี้กำลังประสบเหตุแผ่นดินไหวเล็กน้อย\n$tgp_natural_disaster_cleanup_tt$"
 tgp_natural_disaster_earthquake_2_county_modifier: "แผ่นดินไหวรุนแรง"
 tgp_natural_disaster_earthquake_2_county_modifier_desc: "เคาน์ตีนี้ได้รับผลกระทบจากแผ่นดินไหวรุนแรง โดยแผ่นดินไหวทรงพลังก่อให้เกิดความพินาศเป็นวงกว้าง\n$tgp_natural_disaster_cleanup_tt$"
 tgp_natural_disaster_earthquake_3_county_modifier: "แผ่นดินไหวเลวร้าย"
 tgp_natural_disaster_earthquake_3_county_modifier_desc: "เคาน์ตีนี้กำลังใกล้สู่ความพินาศย่อยยับ เนื่องจากการสั่นสะเทือนที่รุนแรงอย่างยิ่ง\n$tgp_natural_disaster_cleanup_tt$"
 tgp_natural_disaster_flood_1_county_modifier: "น้ำท่วม"
 tgp_natural_disaster_flood_1_county_modifier_desc: "เคาน์ตีนี้กำลังประสบภาวะน้ำท่วมเล็กน้อย$tgp_natural_disaster_cleanup_tt$"
 tgp_natural_disaster_flood_2_county_modifier: "น้ำท่วมรุนแรง"
 tgp_natural_disaster_flood_2_county_modifier_desc: "เคาน์ตีแห่งนี้ได้รับความทุกข์ทรมานจากอุทกภัยอันเลวร้าย ซึ่งได้ทิ้งร่องรอยแห่งความเสียหายไว้เบื้องหลัง\n$tgp_natural_disaster_cleanup_tt$"
 tgp_natural_disaster_flood_3_county_modifier: "น้ำท่วมเลวร้าย"
 tgp_natural_disaster_flood_3_county_modifier_desc: "น้ำท่วมกำลังคุกคามการอยู่รอดของเคาน์ตีนี้ โดยอาจทิ้งไว้เพียงความรกร้างและสิ้นไร้มูลค่า\n$tgp_natural_disaster_cleanup_tt$"

 tgp_natural_disaster_cleanup_tt: "#HELP [modifier|E] นี้สามารถถูกลบได้ผ่าน [great_project|E] การบรรเทาภัยพิบัติ#!\n\n"

 tgp_natural_disaster_fortification_county_modifier: "ป้อมปราการเสียหาย"
 tgp_natural_disaster_fortification_county_modifier_desc: "กำแพงในเคาน์ตีนี้เริ่มพังทลายและอ่อนแอลง เนื่องจาก [natural_disaster|E] ที่เกิดขึ้นล่าสุด\n$tgp_natural_disaster_cleanup_tt$"
 tgp_natural_disaster_exodus_1_county_modifier: "การอพยพจำกัด"
 tgp_natural_disaster_exodus_1_county_modifier_desc: "ผู้อยู่อาศัยจำนวนมากในเคาน์ตีนี้ได้หลบหนีไป เนื่องจาก [natural_disaster|E] ที่เกิดขึ้นล่าสุด\n$tgp_natural_disaster_cleanup_tt$"
 tgp_natural_disaster_exodus_2_county_modifier: "การอพยพ"
 tgp_natural_disaster_exodus_2_county_modifier_desc: "เนื่องจาก [natural_disaster|E] ประชากรส่วนใหญ่ของเคาน์ตีนี้ได้หลบหนีเพื่อแสวงหาความปลอดภัย\n$tgp_natural_disaster_cleanup_tt$"
 tgp_natural_disaster_exodus_3_county_modifier: "การอพยพขนานใหญ่"
 tgp_natural_disaster_exodus_3_county_modifier_desc: "[natural_disaster|E] ที่ร้ายแรงได้ทิ้งให้เคาน์ตีนี้เกือบจะไร้ผู้อยู่อาศัย\n$tgp_natural_disaster_cleanup_tt$"

 tgp_natural_disaster_fertility_1_county_modifier: "ทุ่งหญ้าชื้นแฉะ"
 tgp_natural_disaster_fertility_1_county_modifier_desc: "น้ำท่วมล่าสุด ทำให้ดินบางส่วนในเคาน์ตีนี้ไม่สามารถให้ผลผลิตได้\n$tgp_natural_disaster_cleanup_tt$"
 tgp_natural_disaster_fertility_2_county_modifier: "ทุ่งหญ้าชุ่มน้ำ"
 tgp_natural_disaster_fertility_2_county_modifier_desc: "น้ำท่วมครั้งหายนะได้ทำลายล้างทุ่งนาของเคาน์ตีนี้ ทำให้ไม่เหมาะแก่การเพาะปลูก\n$tgp_natural_disaster_cleanup_tt$"
 tgp_natural_disaster_fertility_3_county_modifier: "ทุ่งหญ้าจมโคลน"
 tgp_natural_disaster_fertility_3_county_modifier_desc: "น้ำท่วมได้ทิ้งให้ทุ่งหญ้าในเคาน์ตีนี้แห้งแล้งโดยสมบูรณ์ และไม่สามารถหล่อเลี้ยงชีวิตได้\n$tgp_natural_disaster_cleanup_tt$"

 tgp_natural_disaster_resettlement_county_modifier: "การตั้งถิ่นฐานผู้ลี้ภัยใหม่"
 tgp_natural_disaster_resettlement_county_modifier_desc: "พลเมืองกำลังเดินทางกลับสู่เคาน์ตีนี้ด้วยความหวังที่จะฟื้นฟูมันขึ้นมาใหม่หลัง [natural_disaster|E] ที่เกิดขึ้นล่าสุด"
 tgp_natural_disaster_aid_county_modifier: "แจกจ่ายความช่วยเหลือ"
 tgp_natural_disaster_aid_county_modifier_desc: "ความพยายามบรรเทาทุกข์กำลังถูกส่งมอบให้แก่ผู้รอดชีวิตจาก [natural_disaster|E] เพื่อช่วยฟื้นฟูเสถียรภาพและขวัญกำลังใจ"

 tgp_natural_disaster_flood_fertility_county_modifier: "ความอุดมสมบูรณ์จากน้ำท่วม"
 tgp_natural_disaster_flood_fertility_county_modifier_desc: "น้ำท่วมล่าสุดได้เพิ่มความอุดมสมบูรณ์ให้แก่ดินในเคาน์ตีนี้ ช่วยปรับปรุงความอุดมสมบูรณ์ของดิน"

 councillor_is_available_for_disaster_recovery: "[GetPlayer.Custom('GetCouncillorForDisasterRecovery')] ของท่านพร้อมที่จะจัดการความพยายามฟื้นฟู [natural_disaster|E]"
 councillor_assigned_to_manage_disaster: "[GetPlayer.Custom('GetCouncillorForDisasterRecovery')] ของท่านถูกมอบหมายให้จัดการความพยายามฟื้นฟู [natural_disaster|E] พวกเขาจะไม่สามารถรับงานอื่นได้จนกว่า [great_project|E] การบรรเทาภัยพิบัติ จะเสร็จสิ้น"
 councillor_busy_managing_disaster: "[GetPlayer.Custom('GetCouncillorForDisasterRecovery')] ของท่านกำลังยุ่งอยู่กับการจัดการความพยายามฟื้นฟู [natural_disaster|E] ทำ [great_project|E] การบรรเทาภัยพิบัติ ให้เสร็จสิ้น เพื่อให้พวกเขากลับมาว่างอีกครั้ง"

