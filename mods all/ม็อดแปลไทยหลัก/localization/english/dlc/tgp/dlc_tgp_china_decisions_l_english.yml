 tgp_refuse_appointments_decision: "ปฏิเสธการ แต่งตั้งเพิ่มเติม"
 tgp_refuse_appointments_decision_accept_t: "ยอมรับการ แต่งตั้ง"
 tgp_refuse_appointments_decision_desc: "การปกครองมิใช่ภาระอันเบาบาง ข้าเหมาะสมอย่างแท้จริงหรือที่จะปกครองดินแดนกว้างใหญ่ เช่นนี้ — เพื่อทำการตัดสินใจอันยากลำบาก ซึ่งรับใช้คุณประโยชน์ที่ยิ่งใหญ่กว่า? บางทีอาจถึงเวลาที่ข้าจะปฏิเสธการ แต่งตั้งเพิ่มเติม และพำนักอยู่ที่นี่อย่างสงบ"
 tgp_refuse_appointments_decision_tooltip: "จงแจ้งให้ทราบว่าท่านไม่ประสงค์จะได้รับการพิจารณาสำหรับคำร้องขอ [appointment|E] ใด ๆ ในอนาคต #EMP อีกต่อไป#! จนกว่าจะมีประกาศเพิ่มเติม"
 tgp_refuse_appointments_decision_confirm: "ปฏิเสธการ แต่งตั้งเพิ่มเติม"
 tgp_refuse_appointments_decision_confirm_accept: "ยอมรับการ แต่งตั้ง"
 tgp_refuse_appointments_decision_refuse_desc: "ปฏิเสธคำร้องขอ [appointment|E] ในอนาคต และถอนตัวท่านออกจาก [merit_pool|E] ของ [titles|E] ที่มีศักยภาพทั้งหมด"
 tgp_refuse_appointments_decision_accept_desc: "ยอมรับคำร้องขอ [appointment|E] ในอนาคต และเพิ่มตัวท่านเข้าไปใน [merit_pool|E] ของ [titles|E] ที่มีสิทธิ์"
 you_are_not_refusing_appointments_desc: "ท่าน #bold ไม่ได้#! ปฏิเสธคำร้องขอ [appointment|E] ในอนาคต"
 
 tgp_resume_appointments_decision: "กลับมารับการ แต่งตั้งใหม่"
 tgp_resume_appointments_decision_desc: "ในตอนนี้ ข้ามิได้โน้มเอียงที่จะยอมรับการ แต่งตั้งใหม่ใด ๆ ทว่า ข้าอาจส่งข่าวไปว่าข้าพร้อมที่จะกลับมาปฏิบัติหน้าที่ของข้าได้ทุกเมื่อ"
 tgp_resume_appointments_decision_tooltip: "ทำให้ตัวท่านพร้อมรับคำร้องขอ [appointment|E] ในอนาคตทั้งหมดทันที โดยการยกเลิกข้อจำกัดในปัจจุบัน"
 tgp_resume_appointments_decision_confirm: "กลับมารับการ แต่งตั้งใหม่"
 
 tgp_minister_request_bestowal_of_honors_decision: "ร้องขอการพระราชทานเกียรติยศ"
