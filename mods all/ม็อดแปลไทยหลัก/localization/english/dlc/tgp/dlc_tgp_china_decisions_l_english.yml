 tgp_e_minister_of_rites_modifier: "เสนาบดีกรมพิธีการกิตติมศักดิ์"
 tgp_e_minister_of_rites_modifier_desc: "สมาชิกที่มีชื่อเสียงของตระกูลนี้ได้สร้างชื่อจากการรับใช้ในฐานะเสนาบดีกรมพิธีการ"
