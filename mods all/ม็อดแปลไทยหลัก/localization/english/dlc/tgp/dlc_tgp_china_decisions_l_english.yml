 tgp_china_ministry.1000.t: "พระราชทานเกียรติยศ"
 tgp_china_ministry.1000.desc: ""เพื่อตอบแทนการรับใช้จักรวรรดิ [ROOT.Char.GetTopLiege.GetPrimaryTitle.GetNameNoTier] ของเจ้า ข้าขอมอบเกียรติยศเหล่านี้แก่เจ้า" [huangdi.GetTitledFirstName] ตรัส "ตราบนานเท่านานที่เจ้ามีชีวิตอยู่ เจ้าจะได้รับรายได้ภาษีจากสิบครัวเรือนเป็นการส่วนตัว และชื่อเสียงของ [ROOT.Char.GetHouse.GetName] จะเป็นที่ประจักษ์ไปทั่วแผ่นดินในฐานะตระกูลที่ภักดีอย่างไม่เสื่อมคลาย""
