 scheme_critical_moments.1232.t: "[scheme.GetNameNoTooltip]: สำเร็จ"
 scheme_critical_moments.1232.desc: "ความถนัดของ [target.GetName] เป็นที่รู้จักกันดีในหมู่ข้าราชสำนักแล้ว อาชีพการงานของ [target.GetHerHis|U] จะก้าวหน้าสู่จุดสูงสุดใหม่ ทั้งหมดนี้ต้องขอบคุณอิทธิพลของข้า"
 scheme_critical_moments.1232.desc.myself: "ความถนัดของข้าเป็นที่รู้จักกันดีในหมู่ข้าราชสำนักแล้ว ข้าใช้อิทธิพลของข้าได้เป็นอย่างดี และอาชีพการงานของข้าจะก้าวหน้าสู่จุดสูงสุดใหม่ในไม่ช้า"
 scheme_critical_moments.1232.a: "ความสำเร็จของคนหนึ่ง พูดแทนทั้งกลุ่ม!"
 scheme_critical_moments.1232.b: "บัดนี้ [target.GetFirstNameNoTooltip] จะได้รับความเคารพมากขึ้น"
 scheme_critical_moments.1232.b.myself: "บัดนี้ข้าจะได้รับความเคารพมากขึ้น"
 scheme_critical_moments.1233.t: "[scheme.GetNameNoTooltip]: ล้มเหลว"
 scheme_critical_moments.1233.desc: "เหล่าสายลับของข้าที่สรรเสริญการปกครองของ [target.GetName] ไม่ได้รับความสนใจจากราชสำนัก ไม่มีผู้ใดเต็มใจที่จะยอมรับความรู้ [target.Custom('education_focus')] ของ [target.GetHerHis]"
 scheme_critical_moments.1233.desc.myself: "เหล่าสายลับที่สรรเสริญการปกครองของข้าไม่ได้รับความสนใจจากราชสำนัก ไม่มีผู้ใดเต็มใจที่จะยอมรับความรู้ [target.Custom('education_focus')] ของข้า"
 scheme_critical_moments.1233.a: "อย่างน้อยข้าก็รู้คุณค่าของมัน!"
 scheme_critical_moments.1235.t: "[scheme.GetNameNoTooltip]: สำเร็จ"
 scheme_critical_moments.1235.desc: "สายลับของข้าทำสำเร็จ ทั้งราชสำนักกำลังพูดถึงความผิดพลาดและความไร้ความสามารถของ [target.GetName] อาชีพการงานของไอ้ [target.Custom2('InsultNoun', ROOT.Char)] นั่นกำลังจะตกต่ำ ทั้งหมดนี้ต้องขอบคุณกลอุบายของข้า!"
 scheme_critical_moments.1235.a: "ข้อบกพร่องของคนหนึ่ง พูดแทนทั้งกลุ่ม!"
 scheme_critical_moments.1235.b: "โฉมหน้าที่แท้จริงของ [target.GetFirstNameNoTooltip] เป็นที่ล่วงรู้แล้ว"
 scheme_critical_moments.1236.t: "[scheme.GetNameNoTooltip]: ล้มเหลว"
 scheme_critical_moments.1236.desc: "สายลับของข้าไม่รายงานสิ่งใด ราชสำนักไม่เต็มใจที่จะสนใจข่าวลือใด ๆ ที่เรากำลังปล่อย เห็นได้ชัดว่าชื่อเสียงของ [target.GetName] นั้นไร้ที่ติ และ [target.GetSheHe] ก็ตั้งหลักปักฐานในวงสังคมราชสำนักเป็นอย่างดี ไอ้ [target.Custom2('InsultAdjective', ROOT.Char)] นั่นนำหน้าข้าไปหนึ่งก้าว"
 scheme_critical_moments.1236.a: "คราวนี้ [target.GetFirstNameNoTooltip] หลุดรอดเงื้อมมือข้าไปได้"
