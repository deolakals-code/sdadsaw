 tgp_china_study_confucian_classics_decision_desc: "คัมภีร์หลุนอวี่ของท่านปรมาจารย์ขงจื๊อ งานเขียนอันลึกซึ้งของเมิ่งจื๊อ พิธีกรรมและประวัติศาสตร์อันยิ่งใหญ่... ด้วยการศึกษาและวินัย ข้าอาจได้เห็นระเบียบแห่งสวรรค์และปฐพี\n\n#weak การศึกษาคัมภีร์ขงจื๊อเป็นวิธีอันยอดเยี่ยมในการเตรียมตัวสำหรับ [examinations|E] หรือเพื่อเพิ่มโอกาสในการเป็น [governor|E]"
 tgp_china_study_confucian_classics_decision_tooltip: "เริ่ม [scheme|E] [GetScheme('study_confucian_classics').GetTypeName] ที่มีเป้าหมายที่ตัวเจ้าเอง"
