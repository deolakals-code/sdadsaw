 scheme_critical_moments.2922.t: "$coup_ceremonial_liege$: [ROOT.Char.GetTitleAsNameNoTooltip] องค์ใหม่"
 scheme_critical_moments.2922.desc: "แผนการถูกตรวจสอบซ้ำแล้วซ้ำเล่า เตรียมพร้อมสำหรับทุกความเป็นไปได้ ผู้สมรู้ร่วมคิด แต่ละคนก็พร้อมแล้ว การบุกเข้าไปใน [target.Custom('ResidenceBuilding')|l] นั้นง่ายดายพอสมควรภายใต้ข้ออ้างการจ้างงาน...\n\nความโกลาหลเกิดขึ้นเมื่อสัญญาณเตือนดังขึ้น แต่ท่ามกลางความสับสนอลหม่าน การต่อสู้ฟันฝ่า ในที่สุดเราก็โผล่ออกมา แม้จะอ่อนล้า แต่ก็ได้รับชัยชนะ!\n\nไอ้ [target.Custom2('InsultAdjective', ROOT.Char)] [ROOT.Char.GetTitleAsNameNoTooltip] ตัวปลอม [target.GetFirstName] นั่น กลับหนีรอดไปได้ — เป็นภัยคุกคามต่อตำแหน่งของข้าตราบใดที่ [target.GetSheHe] ยังลอยนวล"
 scheme_critical_moments.2922.a: "[ROOT.Char.GetPrimaryTitle.GetNameNoTierNoTooltip] เป็น #EMP ของข้า#!!"
 
 scheme_critical_moments.2923.t: "$coup_ceremonial_liege$: ความหวังพังทลาย"

 scheme_critical_moments.2924.t: "$coup_ceremonial_liege$: มงกุฎที่ถูกขโมย"
 scheme_critical_moments.2924.desc: "สิ่งที่เริ่มต้นเหมือนวันธรรมดาใน [target.GetCapitalLocation.GetBaronyNameExplicitly] กลับกลายเป็นเรื่องเลวร้ายในทันใด [target.Custom('ResidenceBuilding')|l] เต็มไปด้วยเสียงตะโกนของทหารยามและเสียงกรีดร้องของคนรับใช้ที่วิ่งไปตามโถงทางเดิน\n\nในที่สุดจ่านายหนึ่งก็อธิบายอย่างหอบเหนื่อยว่ากลุ่มอันธพาลเข้ามาข้างในภายใต้ข้ออ้างจอมปลอม และกำลังต่อสู้เพื่อไปยังห้องท้องพระโรง!\n\n"
 scheme_critical_moments.2924.imprison: "เหล่าทหารก็บุกทะลวงประตูเข้ามา และในไม่ช้าข้าก็ถูกลากไปต่อหน้าผู้นำของพวกมัน [owner.GetFirstName] ซึ่งชูมงกุฎของข้าขึ้นอย่างสะใจ"
 scheme_critical_moments.2924.death: "ขณะพยายามหลบหนี ข้าพบว่าตัวเองอยู่ท่ามกลางการต่อสู้ที่โกลาหล คมดาบตวัดมาที่ข้า!"
 scheme_critical_moments.2924.outro: "ข้าลอบผ่านย่านที่พักคนรับใช้ ปลอมตัวเป็นสามัญชน และเข้าร่วมกับฝูงชนที่กำลังหลบหนีออกจาก [target.Custom('ResidenceBuilding')|l]..."
 scheme_critical_moments.2924.a: "ข้าจะกลับมา!"
 scheme_critical_moments.2924.b: "เจ้าคางคกโสโครก!"
 scheme_critical_moments.2924.c: "บัดซบ!"

 scheme_critical_moments.2925.t: "$coup_ceremonial_liege$: มงกุฎที่โลภหมาย"
 scheme_critical_moments.2925.desc: "สิ่งที่เริ่มต้นเหมือนวันธรรมดาใน [target.GetCapitalLocation.GetBaronyNameExplicitly] กลับกลายเป็นเรื่องเลวร้ายในทันใด [target.Custom('ResidenceBuilding')|l] เต็มไปด้วยเสียงตะโกนของทหารยามและเสียงกรีดร้องของคนรับใช้ที่วิ่งไปตามโถงทางเดิน\n\nในที่สุดจ่านายหนึ่งก็อธิบายอย่างหอบเหนื่อยว่ากลุ่มอันธพาลเข้ามาข้างในภายใต้ข้ออ้างจอมปลอม และกำลังต่อสู้เพื่อไปยังห้องท้องพระโรง!\n\nทหารของข้าก็ควบคุมสถานการณ์ไว้ได้ในไม่ช้า และเสียงการต่อสู้ก็ค่อย ๆ ดับลง"
 scheme_critical_moments.2925.imprison: "[owner.GetFirstName] คนไร้ที่ดินไร้หัวนอนปลายเท้า ถูกลากมาต่อหน้าข้า แผนการของ [owner.GetHerHis] ที่จะชิงมงกุฎของข้าด้วยกำลังถูกเปิดโปง"
 scheme_critical_moments.2925.death: "ศพของ [owner.GetFirstName] คนไร้ที่ดินไร้หัวนอนปลายเท้า ถูกลากมาต่อหน้าข้า แผนการของ [owner.GetHerHis] ที่จะชิงมงกุฎของข้าด้วยกำลังล้มเหลวโดยสิ้นเชิง"
 scheme_critical_moments.2925.outro: "ข้าได้รับแจ้งว่า [owner.GetFirstName] คนไร้ที่ดินไร้หัวนอนปลายเท้า เป็นผู้นำการโจมตี โดยพยายามชิงมงกุฎของข้าด้วยกำลัง ไอ้ขี้ขลาดนั่นหนีไปนานแล้ว"
 scheme_critical_moments.2925.a: "เจ้าจะต้อง #EMP ชดใช้#! สำหรับเรื่องนี้"
 scheme_critical_moments.2925.b: "[owner.GetSheHe|U] ได้เรียนรู้แล้วว่าอะไรจะเกิดขึ้นกับพวกแย่งชิงบัลลังก์!"
 scheme_critical_moments.2925.c: "บัดซบเอ๊ย ไอ้ [owner.Custom2('InsultNoun', ROOT.Char)]!"
 
