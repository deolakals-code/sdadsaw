 coup_ceremonial_liege_warning: "@alert_icon! #M หากสำเร็จ [vassals|E] ของอาณาจักรอาจกลายเป็น [independent|E] โดยขึ้นอยู่กับความสัมพันธ์ของพวกเขากับ [ruler|E] คนเก่า ความแตกต่างใน [culture|E], [faith|E], และ [opinion|E] ที่มีต่อนักผจญภัย ขนาดของอาณาจักรย่อย ความแข็งแกร่งทางทหาร ระยะห่างจาก [capital|E] และปัจจัยอื่น ๆ#!"
