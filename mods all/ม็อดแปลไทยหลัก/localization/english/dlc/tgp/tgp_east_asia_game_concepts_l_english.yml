l_english: 
 #Mandala
 game_concept_mandala: "มณฑล"
 game_concept_mandala_desc: "ภายใต้ [government_form|E] แบบ $game_concept_mandala$ [domain_limit|E] และจำนวน [direct_vassals|E] จะถูกจำกัด ในทางกลับกัน [liege|E] และ [suzerain|E] ต้องพึ่งพา [tributaries|E] ในการขยายอาณาจักรของตน\n\n[ruler|E] แบบมณฑลสามารถปรารถนาที่จะถูกมองว่าเป็นราชาเทวะ หรือเทวราชา และอาศัย [mandala_radiance|E] เพื่อให้ได้มาและรักษา $game_concept_tributaries$ ไว้\n\n$game_concept_ruler$ ต้องรักษา [opinion|E] และพัฒนาความสัมพันธ์กับ $game_concept_tributaries$ ของตนเพื่อรักษาพวกเขาไว้ในระยะยาว เมื่อมีการสืบทอดอำนาจ $game_concept_tributaries$ อาจแตกฉานซ่านเซ็น เว้นแต่ $game_concept_ruler$ จะเป็น [mandala_succesor|E] ที่คู่ควร"
 game_concept_mandalas: "เหล่ามณฑล"
 game_concept_mandala_government: "การปกครองแบบมณฑล"
 game_concept_mandala_i: "@government_type_mandala!"
 game_concept_mandala_government_desc: "$game_concept_mandala_desc$"

 game_concept_mandala_succession: "การสืบทอดมณฑล"
 game_concept_mandala_succession_succession: "การสืบทอด"
 game_concept_mandala_trials: "บททดสอบมณฑล"
 game_concept_mandala_succesor: "ผู้สืบทอดเทวราชา"
 game_concept_mandala_succession_desc: "เมื่อ [ruler|E] แห่ง [mandala|E] สิ้นชีพลง และได้เลือก [mandala_aspect|E] เอาไว้แล้ว [heir|E] ของพวกเขาจะต้องเผชิญหน้ากับบททดสอบ $game_concept_mandala_succession$. ในบททดสอบเหล่านี้ ทายาทจะถูกท้าทายด้วย [skill|E] ซึ่งจะพิสูจน์ความสามารถในทักษะปางที่เกี่ยวข้อง แต่ รวมถึงทักษะปางอื่นอีกสองอย่างด้วย\n\nการผ่านบททดสอบเหล่านี้หมายความว่าทายาทสามารถโน้มน้าวเหล่าผู้ติดตามได้สำเร็จว่าตนคือผู้สืบทอดที่คู่ควร และ [realm|E] ยังคงมั่นคง\n\n#EMP แต่ทว่า การล้มเหลว#! จะก่อให้เกิดบทลงโทษที่หนักหน่วงขึ้นตามลำดับ:\n\n#indent_newline:6 $BULLET_WITH_TAB$#bold 1#! ความท้าทายล้มเหลว: สูญเสีย [piety_level|E] หนึ่งระดับ และ [tributaries|E] ส่วนน้อยจะแยกตัวเป็นอิสระ#!\n\n#indent_newline:6 $BULLET_WITH_TAB$#bold 2#! ความท้าทายล้มเหลว: สูญเสีย [piety_levels|E] สองระดับ และ [tributaries|E] ทั้งหมดจะแยกตัวเป็นอิสระ#!\n\n#indent_newline:6 #EMP Failing#!#bold ทั้งหมด#! ความท้าทายล้มเหลว: สูญเสีย [piety_levels|E] สามระดับ และการล่มสลายของ [realm|E].#!"

 game_concept_mandala_radiance: "รัศมีมณฑล"
 game_concept_radiance: "รัศมี"
 game_concept_radiant: "เจิดจรัส"
 game_concept_mandala_radiance_desc: "แรงดึงดูดในการดึงดูดและรักษา[subjects|E]ไว้สำหรับ[ruler|E]แห่ง[mandala|E] เรียกว่ารัศมีแห่งมณฑล (Mandala Radiance) เป็นการผสมผสานระหว่าง [piety_level|E] ระดับของ[great_building|E] #V [GetBuilding('mandala_capital_01').GetTypeName]#! และระดับของ [mandala_aspect|E]\n\nรางวัลที่สูงขึ้น ข้าแผ่นดินที่มากขึ้น และอำนาจที่มากขึ้น รอคอยผู้ที่สามารถผสมผสานทั้งสามสิ่งนี้เพื่อให้มีรัศมีที่เปล่งประกายยิ่งขึ้น"

 game_concept_mandala_decree: "กฤษฎีกามณฑล"
 game_concept_mandala_decrees: "เหล่ากฤษฎีกามณฑล"
 game_concept_mandala_decree_desc: "$game_concept_mandala_decrees$ คือกฤษฎีกาทั้งสามที่ออกคำสั่งโดย [ruler|E] แห่ง [mandala|E] — อันหมายถึง [prosperity_decree|E], [expansion_decree|E] และ [reverence_decree|E].\n\nโดยทั่วไปแล้ว อาณาจักรมณฑลจะมีอำนาจรวมศูนย์อย่างสูง โดยอำนาจเหนือ [subjects|E] และ [laws|E] จะอยู่กับผู้ปกครองที่เกี่ยวข้อง ผู้ ซึ่งสามารถเปลี่ยนแปลงสิ่งเหล่านั้นได้ตามต้องการ โดยปราศจากการคัดค้านใดๆ จากผู้อยู่อาศัย"
 game_concept_decree: "กฤษฎีกา"
 game_concept_decrees: "เหล่ากฤษฎีกา"
 game_concept_mandala_decree_prosperity: "กฤษฎีกาความรุ่งเรือง"
 game_concept_mandala_decree_prosperity_desc: "ด้วย [GetLaw('mandala_decree_prosperity').GetName] [ruler|E] แห่ง [mandala|E] จะมุ่งเน้นไปที่การกระตุ้นและสร้างแรงบันดาลใจให้ [subjects|E] ทั้งมวล บังเกิดการเปลี่ยนแปลงที่สร้างสรรค์\n\nความพยายามทั้งหลายจะถูกส่งไปสู่การพัฒนา [development|E], [buildings|E], การสั่งสมความมั่งคั่ง ตลอดจนการเสริมสร้างความแข็งแกร่งของชุมชนผ่านความสัมพันธ์ส่วนตัว"
 game_concept_prosperity_decree: "ความรุ่งเรือง"
 game_concept_mandala_decree_expansion: "กฤษฎีกาการขยายดินแดน"
 game_concept_mandala_decree_expansion_desc: "[GetLaw('mandala_decree_expansion').GetName] บัญชาให้ [subjects|E] ทั้งปวง มุ่งเน้นความพยายามไปที่การขยาย [realm|E].\n\nการเพิ่มจำนวนทหาร, การจัดเตรียมที่พักสำหรับกองทัพ และการสนับสนุน [wars|E] ใดๆ ก็ตามที่อาจเกิดขึ้น ภายใต้การนำของ [ruler|E] แห่ง [mandala|E] ถือเป็นเรื่องสำคัญยิ่งยวด"
 game_concept_expansion_decree: "การขยายดินแดน"
 game_concept_mandala_decree_reverence: "กฤษฎีกาการเทิดทูน"
 game_concept_mandala_decree_reverence_desc: "[GetLaw('mandala_decree_reverence').GetName] บังคับบัญชาให้ [subjects|E] แห่ง [mandala|E] มุ่งเน้นความพยายามไปที่การส่งเสริมจิตวิญญาณและการเคารพบูชา\n\n[pilgrimages|E], พิธีกรรม และ [piety|E] คือรากฐานที่สำคัญของกฤษฎีกามณฑลนี้"
 game_concept_reverence_decree: "การเทิดทูน"

 game_concept_mandala_aspect: "ปางมณฑล"
 game_concept_mandala_aspects: "เหล่าปางมณฑล"
 game_concept_aspect: "ปาง"
 game_concept_aspects: "เหล่าปาง"
 game_concept_mandala_aspect_desc: "เพื่อให้ [ruler|E] แห่ง [mandala|E] บรรลุถึงการเทิดทูนอันเป็นนิรันดร์และความเป็นเทพ พวกเขาจำเป็นต้องเลือกสอดคล้องกับหนึ่งในปางที่จะระบุตัวตนของพวกเขาในฐานะเทพเจ้า\n\nปางที่มีให้เลือก ได้แก่: \n$EFFECT_LIST_BULLET$[aspect_of_creation|E]\n$EFFECT_LIST_BULLET$[aspect_of_serenity|E]\n$EFFECT_LIST_BULLET$[aspect_of_destruction|E]\n$EFFECT_LIST_BULLET$[aspect_of_trickery|E]\n\nปางเหล่านี้จะส่งผลต่อความคาดหวังและการกระทำบางอย่างที่ดำเนินการโดยผู้ปกครอง"
 game_concept_aspect_of_creation: "ปางแห่งการสร้างสรรค์"
 game_concept_aspect_of_creation_desc: "ด้วยพันธสัญญาที่จะเพิ่มผลผลิตและก่อให้เกิดความอุดมสมบูรณ์แก่เหล่าผู้ติดตาม ปางแห่งการสร้างสรรค์จะมอบโบนัสให้กับการดำเนินการทางเศรษฐกิจและการจัดการ\n$EFFECT_LIST_BULLET$มุ่งเน้นที่ [stewardship|E]\n$EFFECT_LIST_BULLET$การก่อสร้างอย่างต่อเนื่องจะมอบสแต็ก [GetModifier( 'mandala_creator_modifier' ).GetNameWithTooltip|L]\n$EFFECT_LIST_BULLET$การก่อสร้างทั่วไปจะมอบ [piety|E]\n$EFFECT_LIST_BULLET$การเลี้ยงดู [children|E] ที่ [legitimate|E] จะมอบ [piety|E]\n$EFFECT_LIST_BULLET$สามารถเข้าถึง [scheme|E] #high [GetScheme('coerce_contribution').GetTypeName]#! ได้\n$EFFECT_LIST_BULLET$อาจตายได้จาก [death_natural_cause|E] หรือ [death_religious|E] [character_death_deaths|E] เท่านั้น"
 game_concept_aspect_of_serenity: "ปางแห่งความสงบ"
 game_concept_aspect_of_serenity_desc: "อาณาจักรที่สงบสุขคืออาณาจักรที่รุ่งเรือง — ปางแห่งความสงบจะชื่นชมความเงียบสงบและการเจรจาทางการทูต โดยจะมอบโบนัสแก่ผู้ที่สอดคล้องกับอุดมการณ์นี้\n$EFFECT_LIST_BULLET$มุ่งเน้นที่ [diplomacy|E]\n$EFFECT_LIST_BULLET$การหลีกเลี่ยง [wars|E] เชิงรุก จะได้รับรางวัลเป็นสแต็ก [GetModifier( 'mandala_increments_of_peace_modifier' ).GetNameWithTooltip|L]\n$EFFECT_LIST_BULLET$[schemes|E] [GetScheme('sway').GetTypeName] และ [GetScheme('befriend').GetTypeName] จะประสบความสำเร็จมากขึ้น\n$EFFECT_LIST_BULLET$อาจสามารถ #high $request_great_project_contribution_interaction$s#! จาก [allies|E] ได้ด้วย\n$EFFECT_LIST_BULLET$อาจตายได้จาก [death_natural_cause|E] หรือ [death_religious|E] [character_death_deaths|E] เท่านั้น"
 game_concept_aspect_of_destruction: "ปางแห่งการทำลายล้าง"
 game_concept_aspect_of_destruction_desc: "ความกลัวและความหวาดหวั่นคือหนทางสู่การปกครอง. อำนาจที่แท้จริงอยู่ที่ความสามารถในการดับชีวิต. ปางแห่งการทำลายล้างจะมอบโบนัสแก่ผู้ที่แบ่งแยกและพิชิต\n$EFFECT_LIST_BULLET$มุ่งเน้นที่ [martial|E]\n$EFFECT_LIST_BULLET$มีโบนัสต่อตัวปรับปรุงทางทหาร\n$EFFECT_LIST_BULLET$สามารถเข้าถึง [casus_belli|E] #high [GetCasusBelliType('mandala_plunder_cb').GetName]#! ได้\n$EFFECT_LIST_BULLET$อาจตายได้จาก [death_natural_cause|E], [death_religious|E] หรือ [death_combat|E] [character_death_deaths|E] เท่านั้น"
 game_concept_aspect_of_trickery: "ปางแห่งกลอุบาย"
 game_concept_aspect_of_trickery_desc: "เมตตาหรือเจ้าเล่ห์ แง่มุมแห่งผู้หลอกลวง (Trickster Aspect) ให้รางวัลแก่ผู้ที่สามารถควบคุมผู้อื่นโดยที่พวกเขาไม่รู้ตัว ความเป็นพระเจ้าจะมีไว้เพื่ออะไรหากไม่ใช่เพื่อหล่อหลอมโลกตามภาพลักษณ์ของท่าน?\n$EFFECT_LIST_BULLET$เน้นไปที่ [intrigue|E]\n$EFFECT_LIST_BULLET$อาจใช้ [piety|E] เพื่อติดสินบน [agents|E] ใน [schemes|E]\n$EFFECT_LIST_BULLET$สามารถเข้าถึง [scheme|E] #high [GetScheme('leverage_contribution').GetTypeName]#!\n$EFFECT_LIST_BULLET$อาจพบกับ[character_death_deaths|E]จาก [death_natural_cause|E], [death_religious|E] หรือ [death_murder|E] เท่านั้น"

 game_concept_mandala_ritual: "พิธีกรรมมณฑล"
 game_concept_mandala_rituals: "เหล่าพิธีกรรมมณฑล"
 game_concept_ritual: "พิธีกรรม"
 game_concept_rituals: "เหล่าพิธีกรรม"
 game_concept_mandala_ritual_desc: "พิธีกรรมมณฑล คืองานที่ปรากฏขึ้นเป็นครั้งคราวสำหรับ [rulers|E] แห่ง [mandala|E] — มันเป็นสัญญาณว่าส่วนใดส่วนหนึ่งของ [realm|E] ของท่าน กำลังต้องการการชี้แนะและการยกย่องอันศักดิ์สิทธิ์จากท่าน\n\nการมีทักษะใน [mandala_aspect|E] ของท่านมากขึ้น จะช่วยเพิ่มผลประโยชน์ใดๆ ที่ได้จากการปรากฏตัวต่อหน้า [subjects|E] ของท่าน"
 game_concept_mandala_ritual_tier: "ระดับขั้นพิธีกรรมมณฑล"
 game_concept_ritual_tier: "ระดับขั้นพิธีกรรม"
 game_concept_mandala_ritual_tier_desc: "[ritual_tier|E] ของ [mandala_ritual|E] บ่งชี้ว่าจุดหมายปลายทางนั้นจะได้รับประโยชน์จากคำชี้แนะของท่านมากเพียงใด ตลอดจนรางวัลสำหรับตัวท่านเป็นการส่วนตัว"

 #Tribute Mission
 game_concept_tribute_mission: "ภารกิจบรรณาการ"
 game_concept_tribute_missions: "เหล่าภารกิจบรรณาการ"
 game_concept_tribute_mission_desc: "ในฐานะ [tributary|E] การแสดงความเคารพ ตลอดจนบรรณาการ จะต้องถูกส่งมอบให้กับ [suzerain|E] เป็นประจำ\n\nการละเลยที่จะทำ เช่นนั้นอาจส่งผลกระทบตามมาหลายประการ ซึ่งผลกระทบที่เบาที่สุดคือการสูญเสีย [legitimacy|E]."
 game_concept_tribute: "บรรณาการ"
 game_concept_tributes: "เหล่าบรรณาการ"
