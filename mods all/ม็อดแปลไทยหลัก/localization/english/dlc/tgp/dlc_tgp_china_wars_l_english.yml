 ### Internal county conquest during corruption
 china_seize_county_cb: "$CHINA_SEIZE_COUNTY_CB_NAME$"
 CHINA_SEIZE_COUNTY_WAR_NAME: "[ConcatIfNeitherEmpty('$ORDER|q$', ' ')][ATTACKER.GetPrimaryTitle.GetAdjective] การเข้ายึด [TITLE.GetBaseName]"
 CHINA_SEIZE_COUNTY_WAR_NAME_BASE: "[ATTACKER.GetPrimaryTitle.GetAdjective][DEFENDER.GetPrimaryTitle.GetName]"
 CHINA_SEIZE_COUNTY_CB_NAME: "ยึดเคาน์ตีแห่งความเป็นเจ้า"
## duchy conquest variant
 china_seize_duchy_cb: "$CHINA_SEIZE_DUCHY_CB_NAME$"
 CHINA_SEIZE_DUCHY_WAR_NAME: "[ConcatIfNeitherEmpty('$ORDER|q$', ' ')][ATTACKER.GetPrimaryTitle.GetAdjective] การเข้ายึด [TITLE.GetBaseName]"
 CHINA_SEIZE_DUCHY_WAR_NAME_BASE: "[ATTACKER.GetPrimaryTitle.GetAdjective][DEFENDER.GetPrimaryTitle.GetName]"
 CHINA_SEIZE_DUCHY_CB_NAME: "ยึดดัชชีแห่งความเป็นเจ้า"
 ## Great Project Conquest
 grand_campaign_kingdom_invasion_cb: "[GetTitleByKey('h_china').Custom('OrdinalChineseConquest')] [GetTitleByKey('h_china').GetNameNoTierPossessiveNoTooltip] การทัพอันยิ่งใหญ่"
 GP_KINGDOM_INVASION_WAR_NAME: "$grand_campaign_kingdom_invasion_cb$"
 GP_KINGDOM_INVASION_WAR_NAME_BASE: "[ATTACKER.GetPrimaryTitle.GetAdjective][DEFENDER.GetPrimaryTitle.GetName]"
 GP_KINGDOM_INVASION_CB_NAME: "$grand_campaign_kingdom_invasion_cb$ ([great_project|E])"

 grand_campaign_kingdom_invasion_cb_victory_desc_attacker:2 "[attacker.GetTopLiege.GetShortUIName|U] ได้รับ [titles|E] ที่เป็นข้อพิพาท"
 grand_campaign_kingdom_invasion_cb_victory_desc:1 "[attacker.GetTopLiege.GetShortUIName|U] ได้รับ [title|E] ที่เป็นข้อพิพาท"
 
 ### CB for neighbors to attempt to seize the mandate of heaven and become hegemon of China
 claim_the_mandate_cb: "$CLAIM_THE_MANDATE_CB_NAME$"
 CLAIM_THE_MANDATE_NAME: "[ConcatIfNeitherEmpty('$ORDER|q$', ' ')][ATTACKER.GetPrimaryTitle.GetAdjective] การเข้ายึดอาณัติสวรรค์"
 CLAIM_THE_MANDATE_NAME_BASE: "[ATTACKER.GetPrimaryTitle.GetAdjective][DEFENDER.GetPrimaryTitle.GetName]"
 CLAIM_THE_MANDATE_CB_NAME: "เข้ายึดอาณัติสวรรค์"
 dynastic_cycle_hegemon_legitimacy_level_cost_desc: "[defender.GetShortUINamePossessive] [legitimacy_level|E]"

 # CONSOLIDATION WAR
 chinese_consolidation_cb: "$CHINESE_CONSOLIDATION_WAR_NAME$"
 CHINESE_CONSOLIDATION_WAR_NAME: "สงครามรวมชาติแผ่นดินจีน"
 CHINESE_CONSOLIDATION_WAR_NAME_BASE: "$CHINESE_CONSOLIDATION_WAR_NAME$"
 CHINESE_CONSOLIDATION_CB_NAME: "ผนวกรวมแผ่นดินใต้หล้า ([dynastic_cycle|E])"
 chinese_consolidation_cb_victory_desc_attacker: "เจ้าจะยึด [titles|E] ทั้งหมดของ [defender.GetShortUINamePossessive] ที่มี [title_tier|E] เดียวกันหรือสูงกว่า [primary_title|E] ของเจ้า และรับข้าหลวงทั้งหมดของ [defender.GetShortUINameNoTooltip] ที่เป็นส่วนหนึ่งของ [de_jure|E] [GetTitleByKey('h_china').GetDefinitiveName] มาเป็นข้าหลวง"
 chinese_consolidation_cb_victory_desc: "[attacker.GetShortUIName|U] รับ [defender.GetShortUIName|U] มาเป็นข้าหลวง หรือยึด [titles|E] ทั้งหมดของ [defender.GetHerHis] ที่เป็นส่วนหนึ่งของ [GetTitleByKey('h_china').GetDefinitiveName] ที่มี [title_tier|E] เดียวกันหรือสูงกว่า [primary_title|E] ของ [attacker.GetShortUINamePossessive|U]"

 silk_road_vassalization_cb: "$SILK_ROAD_VASSALIZATION_WAR_NAME$"
