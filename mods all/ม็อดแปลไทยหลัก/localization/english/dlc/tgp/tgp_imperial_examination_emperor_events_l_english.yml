l_english: 

 emperor_imperial_examination.100.t: "ด้วยความยำเกรง"
 emperor_imperial_examination.100.desc: ""ข้า แต่ [ROOT.Char.GetTitleAsNameNoTooltip] ผู้สูงส่งและปรีชายิ่ง นับเป็นเกียรติอย่างสูงสุดที่ได้มายืนอยู่เบื้องหน้าพระพักตร์ท่าน" [examination_character_2.GetTitledFirstName] ผู้เป็น [ROOT.Char.Custom2('RelationToMeShort', examination_character_2)] ของข้า กล่าวด้วยความยำเกรง "ขอให้การสอบคัดเลือกนี้พิสูจน์ว่าข้าคือข้ารับใช้ผู้ภักดีของท่าน"\n\n"ขอแสนยานุภาพและความรุ่งโรจน์แห่ง [ROOT.Char.GetPrimaryTitle.GetNameNoTier] และ [ROOT.Char.Custom('GetDaughterSon')|U] แห่งสวรรค์ จงเจริญหมื่นปี!""
 emperor_imperial_examination.100.a: "ความภักดี คือคุณธรรมเหนือสิ่งอื่นใด"
 emperor_imperial_examination.100.b: "คำสรรเสริญนั้นไม่จีรัง การกระทำต่างหากที่ต้องใช้ความพยายาม"
 imperial_examination.advantage.other.tt: "ได้รับ [exam_advantage|E]"
 imperial_examination.advantage.dynasty_legacy.tt: "เนื่องจากท่านได้ปลดล็อกมรดกราชวงศ์ [GetDynastyPerk( 'tgp_chinese_legacy_1' ).GetName] ท่านจะเริ่มกิจกรรมพร้อมกับ [exam_advantage|E]"

 emperor_imperial_examination.200.t: "โฉมงามผู้ถูกคัดเลือก"
 emperor_imperial_examination.200.desc: ""ข้า แต่ฝ่าบาทผู้สูงส่ง" [examination_character_2.GetTitledFirstName] ผู้เป็น [ROOT.Char.Custom2('RelationToMeShort', examination_character_2)] ของข้า กล่าวอย่างนอบน้อม "ระหว่างการเดินทางของข้าใน [concubine_origin.GetNameNoTier] ข้าได้พบกับตระกูลที่มีชื่อเสียง คือ [examination_character_1.GetHouse.GetName] และได้สนทนากับผู้อาวุโสชาว [examination_character_1.GetCulture.GetName]"\n\n"พวกเขาได้ร้องขอให้ข้าคัดเลือก [examination_character_1.GetLadyLord] เพื่อรับใช้ท่านในวังใน — ข้าจึงเลือก [examination_character_1.GetFirstName] [examination_character_1.GetWomanMan] ผู้มีกิริยางดงามหาได้ยาก พวกเราหวังว่า [examination_character_1.GetSheHe] จะเป็นที่พอพระทัยของท่าน โอ้ [ROOT.Char.Custom('GetDaughterSon')|U] แห่งสวรรค์""
 emperor_imperial_examination.200.a: "[examination_character_1.GetSheHe|U] สามารถเข้าร่วมฝ่ายในได้"
 emperor_imperial_examination.200.b: "เล่าเรื่องการเดินทางของเจ้ามาแทนดีกว่า"
 emperor_imperial_examination.200.c: "วังของข้าดูเหมือนโรงค้าประเวณีรึ?"

 emperor_imperial_examination.300.t: "ถวายของสืบทอดตระกูล"
 emperor_imperial_examination.300.desc: ""ข้า แต่ [ROOT.Char.GetTitleAsNameNoTooltip] ผู้ยิ่งใหญ่ พระเมตตาอันเปี่ยมปัญญาของท่านช่างไพศาลนัก" [examination_character_2.GetTitledFirstName] ผู้เป็น [ROOT.Char.Custom2('RelationToMeShort', examination_character_2)] ของข้า หมอบกราบ [examination_character_2.GetHerselfHimself] ลงเบื้องหน้าข้า "ข้านำของถวายอันต่ำต้อยมาด้วย เป็นสิ่งประดิษฐ์สำหรับจัดแสดงในวัง"\n\n"[newly_created_artifact.GetName] นี้ คือของสืบทอดตระกูล [examination_character_2.GetHouse.GetName] พวกเราไม่ขอสิ่งใดมากไปกว่าให้ฝ่าบาทผู้ทรงเป็นองค์อธิปัตย์ โปรดรับรู้ว่าพวกเราคือข้ารับใช้ผู้ภักดี""
 emperor_imperial_examination.300.a: "เป็นของถวายที่คู่ควร"
 emperor_imperial_examination.300.b: "ฝีมือหยาบยิ่งนัก เอาไปทิ้งเสีย"
 emperor_imperial_examination.300.c: "ตระกูล [examination_character_2.GetHouse.GetNameNoTooltip] ควรไปจดจ่อกับการสอบมากกว่า"

 emperor_imperial_examination.400.t: "การท่องบันทึกพงศาวดาร"
 emperor_imperial_examination.400.desc: "เหล่าผู้คุมสอบและผู้เข้าสอบในวังยืนรวมกลุ่มกัน อ่านหนังสืออย่างเคร่งเครียดและกระซิบกระซาบกันด้วยน้ำเสียงแผ่วเบาและประหม่า จึงเป็นเรื่องสมควรที่ข้า ผู้เป็น [ROOT.Char.Custom('GetDaughterSon')|U] แห่งสวรรค์ จะมอบปัญญาอันอมตะให้บ้าง เมื่อข้าให้สัญญาณ ห้องทั้งห้องก็เงียบกริบด้วยความยำเกรงและรอคอย\n\nข้าผายมือไปยังชั้นหนังสือ และเหล่าข้ารับใช้ก็นำ...ออกมา"
 emperor_imperial_examination.400.a: "...บันทึกพงศาวดาร [ROOT.Char.Custom('GetRandomAnnalsPassage')]"
 emperor_imperial_examination.400.b: "...[ROOT.Char.Custom('GetRandomPoetryPassage')]"
 emperor_imperial_examination.400.c: "...[ROOT.Char.Custom('GetRandomRitesPassage')]"
 every_palace_entrant: "ผู้เข้าสอบในวังทุกคน"
 custom_every_examiner: "ผู้คุมสอบทุกคน"

 emperor_imperial_examination.500.t: "บทกวีของ [examination_character_2.GetFirstNameNoTooltip]"
 emperor_imperial_examination.500.desc: ""ข้า แต่ฝ่าบาทผู้ประทับบนสวรรค์ ข้าได้ประพันธ์บทกวีเพื่อเป็นเกียรติแด่พระเมตตาอันไร้ที่สิ้นสุดของท่าน" [examination_character_2.GetTitledFirstName] ผู้เป็น [ROOT.Char.Custom2('RelationToMeShort', examination_character_2)] ของข้า เปิดหนังสือออก และเริ่มท่อง:\n\n#EMP "[examination_character_2.Custom('GetAdventureNameBand')|l] of [examination_character_2.Custom('GeneratePoem_Title_Fragment_Season')], the [examination_character_2.Custom('GetAdventureNameBand')|l] of [examination_character_2.Custom('GetAdventureNameSuffix')|l] and [examination_character_2.Custom('GetAdventureNameSuffix')|l] — [examination_character_2.Custom('GetAdventureNamePrefixes')|l] in the [poetry_province.Custom('GetTerrainTypePlural')], the [examination_character_2.Custom('GetRandomSmallPreciousItem')] in their hands. From [poetry_county.GetNameNoTier], in [poetry_province.Custom('ProvinceCompliment')] [examination_character_2.Custom('GeneratePoem_Title_Fragment_Noun')|l], within the [examination_character_2.Custom('FormalComplimentAdjective')|l] [ROOT.Char.GetPrimaryTitle.GetNameNoTier]."#!\n\n[examination_character_2.GetSheHe|U] รอคอยคำตัดสินของข้าอย่างกระตือรือร้น"
 emperor_imperial_examination.500.a: "ถ้อยคำของเจ้าแม้จะรวบรัด แต่ก็เปี่ยมไปด้วยความหมาย"
 emperor_imperial_examination.500.b: "ถ้อยคำช่างขาดตกบกพร่อง เฉก เช่นเดียวกับคุณความดีของเจ้า"

 emperor_imperial_examination.600.t: "ด้วยอารมณ์ขัน"
 emperor_imperial_examination.600.desc: "ขณะที่ข้ากำลังดูแลฝูงชน หนึ่งในผู้เข้าสอบ [examination_character_2.GetTitledFirstName] กำลังเพลิดเพลินกับการเล่าเรื่องตลกจน [examination_character_2.GetSheHe] แทบไม่สังเกตว่า [examination_character_2.GetSheHe] กำลังเดินไปทางไหน [examination_character_2.GetSheHe] เดินถอยหลังอย่างช้า ๆ เข้ามาหาข้าโดยไม่รู้ตัว พลางอุทานว่า: "...และนั่นคือวิธีที่ [examination_character_2.Custom('GetAdventureNameBand')|l] เสีย [examination_character_2.Custom('GetAdventureNameSuffix')|l] ไป!"\n\nข้ากระแอมเบา ๆ\n\nฝูงชนเบื้องหน้า [examination_character_2.GetHerHim] พลันเงียบกริบ [examination_character_2.GetFirstNameNoTooltip] แข็งทื่อด้วยความกลัว"
 emperor_imperial_examination.600.a: "น่าขันยิ่งนัก"
 emperor_imperial_examination.600.b: "พอได้แล้ว กลับไปจดจ่อกับการสอบ"
 emperor_imperial_examination.600.c: "ช่างเป็นการดูหมิ่นยิ่งนัก ออกไปเดี๋ยวนี้"

 emperor_imperial_examination.700.t: "ของขวัญเป็นเงิน"
 emperor_imperial_examination.700.desc: ""ข้า แต่ [ROOT.Char.GetTitleAsNameNoTooltip] ผู้ยิ่งใหญ่" [examination_character_2.GetTitledFirstName] ผู้เป็น [ROOT.Char.Custom2('RelationToMeShort', examination_character_2)] ของข้า โขกศีรษะคำนับอย่างลึกซึ้ง "ตระกูลของข้า [examination_character_2.GetHouse.GetName] มีสายสัมพันธ์กับพ่อค้าบน [GetSituationType('silk_road_situation').GetName|l] และ $sea_yellow_sea$ — สายสัมพันธ์ที่ข้าใช้ประโยชน์เพื่อนำของขวัญอันต่ำต้อยมาถวายท่าน"\n\n"นี่คือหีบเหรียญเงินจาก [silver_county.GetNameNoTier] ซึ่งมีตราประทับของ [silver_county_top_liege.GetTitleAsNameNoTooltip] แห่ง [silver_county_top_liege.GetPrimaryTitle.GetDefinitiveName|l]""
 emperor_imperial_examination.700.a: "ข้าขอรับไว้ด้วยใจกว้าง"
 emperor_imperial_examination.700.b: "เล่าเรื่อง [silver_county_top_liege.GetPrimaryTitle.GetDefinitiveNameNoTooltip|l] ให้ข้าฟังสิ"
 emperor_imperial_examination.700.c: "จงแบ่งกันซะ แล้วใช้มันเพื่อการศึกษาของพวกเจ้า"
 situation_type_silk_road_situation: "เส้นทางสายไหม"
 situation_type_silk_road_situation_desc: "$game_concept_silk_road_situation_desc$"

 emperor_imperial_examination.800.t: "ขันทีบรรณาการ"
 emperor_imperial_examination.800.desc: ""ข้า แต่ [ROOT.Char.GetTitleAsNameNoTooltip] ผู้ทรงเมตตา ข้ารับใช้ผู้ต่ำต้อยของท่านขอประทานอภัยที่ขัดจังหวะ" [examination_character_2.GetTitledFirstName] ผู้เป็น [ROOT.Char.Custom2('RelationToMeShort', examination_character_2)] ของข้า กล่าวพลางโค้งคำนับต่ำและประสานมือคารวะ "นี่คือ [examination_character_1.GetFirstName] — [GetTrait('eunuch_1').GetName( GetNullCharacter )] ผู้มีไหวพริบปฏิภาณยิ่ง ผู้ภักดีต่อตระกูล [examination_character_2.GetHouse.GetName] มาช้านาน"\n\n"พวกเราขอมอบการรับใช้ของเขาแก่ราชวัง เพื่อที่ [ROOT.Char.GetPrimaryTitle.GetNameNoTier] จะได้รุ่งเรืองภายใต้พระเมตตาของท่าน""
 emperor_imperial_examination.800.a: "พวกเราจะหาตำแหน่งให้เขา"
 emperor_imperial_examination.800.b: "เขาอาจเป็นผู้คุมสอบได้"
 emperor_imperial_examination.800.c: "เก็บข้ารับใช้ของเจ้าไว้เถอะ"
 becomes_imperial_examiner.tt: "กลายเป็นผู้คุมสอบ"

 emperor_imperial_examination.900.t: "ข้ารับใช้ผู้ [examination_character_2.Custom('ComplimentAdjective')|U]"
 emperor_imperial_examination.900.desc: ""ข้า แต่ [ROOT.Char.GetTitleAsNameNoTooltip] แห่งสวรรค์ พวกเราขอบพระทัยสำหรับงานเลี้ยงนี้" [examination_character_1.GetTitledFirstName] ผู้เป็น [ROOT.Char.Custom2('RelationToMeShort', examination_character_1)] ของข้า กล่าวพลางโค้งคำนับต่ำ โดยมีข้ารับใช้อยู่ข้าง [examination_character_1.GetHerHis] กาย "นี่คือ [examination_character_2.GetFirstName] [examination_character_1.Custom2('RelationToMeShort', examination_character_2)] ของข้า — ผู้นำของขวัญอันต่ำต้อยมา: [examination_character_1.Custom('GetExpensiveDrink')] จากบ้านของข้า [origin_county.GetNameNoTier]"\n\n"แต่ยิ่งกว่าเครื่องดื่ม ข้าขอมอบการรับใช้ของ [examination_character_2.GetHerHis] ความรู้ด้าน [examination_character_2.Custom('highest_skill_noun')] ของ [examination_character_2.GetHerHis|U] จะเป็นประโยชน์ต่อราชวัง""
 emperor_imperial_examination.900.a: "ทักษะของ [examination_character_2.GetHerHis|U] เป็นที่ต้อนรับ"
 emperor_imperial_examination.900.b: "[examination_character_2.GetSheHe|U] จะรับใช้เจ้าได้ดีกว่า"

 emperor_imperial_examination.1000.t: "ผู้มีความสามารถชาวต่างชาติ"
 emperor_imperial_examination.1000.desc: ""ข้า แต่ [ROOT.Char.GetTitleAsNameNoTooltip] ผู้ปรีชา ข้ามาอยู่เบื้องหน้าท่านด้วยความซาบซึ้งอันต่ำต้อย" ผู้เข้าสอบในวัง [examination_character_2.GetTitledFirstName] กล่าวเป็นภาษา [chinese.GetLanguage.GetName] อย่างคล่องแคล่ว "แม้ว่าข้าจะเป็นชาว [examination_character_2.GetCulture.GetName] โดยกำเนิดและภาษา แต่ข้ามาได้ไกลถึงเพียงนี้ด้วยพระเมตตาของท่าน — และข้าไม่ปรารถนาสิ่งใดมากไปกว่าการรับใช้ [ROOT.Char.GetPrimaryTitle.GetNameNoTier]"\n\n"ดังนั้นข้าจึงเรียนรู้ภาษาแห่งสวรรค์ — [chinese.GetLanguage.GetName] — เพื่อเป็นเครื่องหมายแห่งความถ่อมตนของชาว [examination_character_2.GetCulture.GetName]""
 emperor_imperial_examination.1000.a: "ความพยายามของเจ้าจะได้รับการยอมรับ"
 emperor_imperial_examination.1000.b: "การลอกเลียนแบบของชาว [examination_character_2.GetCulture.GetNameNoTooltip] ไม่มีที่ยืนในที่แห่งนี้"
