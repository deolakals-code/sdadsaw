l_english: 

 #Character/County Modifiers
 mandala_capital_sacked_modifier: "เมืองหลวงมณฑลถูกปล้นสะดม"
 mandala_capital_sacked_modifier_desc: "เมืองหลวง[mandala|E] แห่งนี้เพิ่งถูกทำลายโดยผู้ปกครองมณฑลอื่น"
 mandala_capital_restored_modifier: "เมืองหลวงมณฑลที่ได้รับการฟื้นฟู"
 mandala_capital_restored_modifier_desc: "เมืองหลวง[mandala|E] แห่งนี้เพิ่งได้รับการบูรณะสู่ความยิ่งใหญ่ดั้งเดิมอย่างน่าทึ่ง"

 budding_divinity_modifier: "เทวสภาพแรกเริ่ม"
 budding_divinity_modifier_desc: "ตัวละครนี้เป็นส่วนหนึ่งของ [house|E] ที่กำลังบ่มเพาะ [GetModifier( 'piety_level_6' ).GetNameWithTooltip|L]"
 budding_deity_modifier: "ผู้มุ่งหวังเป็นเทพ"
 budding_deity_modifier_desc: "ตัวละครนี้กำลังสั่งสมตำนานเล่าขานพอสมควรที่ยืนยันว่าพวกเขาเป็น [GetModifier( 'piety_level_7' ).GetNameWithTooltip|L]"
 budding_godhood_modifier: "การอุทิศตนอันสูงส่ง"
 budding_godhood_modifier_desc: "ตัวละครนี้มีข่าวลือว่าเป็น [GetModifier( 'piety_level_8' ).GetNameWithTooltip|L] อย่างแท้จริง"

 disbelieved_mandala_modifier: "มณฑลที่ไม่เป็นที่เชื่อถือ"
 disbelieved_mandala_modifier_desc: "ตัวละครนี้ตกเป็นที่คลางแคลงใจ ทำให้เหล่าข้าแผ่นดินและผู้ติดตามสงสัยในความเป็นเทพของพวกเขา"

 betrayed_tributary_modifier: "รัฐบรรณาการผู้ถูกทรยศ"
 betrayed_tributary_modifier_desc: "ตัวละครนี้เพิกเฉย ในขณะที่รัฐบรรณาการในอนาคตของตนถูกโจมตีโดยอดีตเจ้าผู้ครองนครของรัฐบรรณาการนั้น"

 recently_tarnished_mandala_modifier: "มณฑลที่มัวหมอง"
 recently_tarnished_mandala_modifier_desc: "ตัวละครนี้เพิ่งพ่ายแพ้ในสงครามทรราชย์ ทำให้รัศมีของพวกเขามัวหมอง"

 mandala_broke_truce_modifier: "มณฑลผู้ตลบตะแลง"
 mandala_broke_truce_modifier_desc: "ตัวละครนี้เพิ่งละเมิดสัญญาพักรบกับรัฐบรรณาการที่ถูกปล่อยเป็นอิสระ"

 tgp_sea_legacy_heir_modifier: "ทายาทผู้ได้รับพร"
 tgp_sea_legacy_heir_modifier_desc: "ตัวละครนี้สืบเชื้อสายมาจากสายเลือดอันยาวนานของผู้ปกครองที่เป็นเทพ และได้รับความเคารพยำเกรงมากกว่าผู้ปกครองทั่วไป"
 mandala_rise_from_the_ashes_modifier: "ฟื้นคืนจากเถ้าถ่าน"
 mandala_rise_from_the_ashes_modifier_desc: "ผู้ปกครองผู้นี้เพิ่งเพิ่มพูนรัศมีของตนโดยการบูรณะวิหารเมืองหลวงที่ถูกทำลายราบคาบ"

