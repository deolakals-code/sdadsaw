 game_concept_dynastic_cycle_era_type_desc: "มีประเภทยุคสามประเภทใน [dynastic_cycle|E] ซึ่งจัดหมวดหมู่ [situation_dynastic_cycle_phases|E] และจัด แต่ละยุคให้อยู่ในลักษณะวนซ้ำสามส่วนของวัฏจักรราชวงศ์\n\nประเภทยุค: [dynastic_cycle_era_type_stable|E], [dynastic_cycle_era_type_unstable|E], [dynastic_cycle_era_type_chaotic|E]"

