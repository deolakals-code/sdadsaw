 game_concept_movement: "ขบวนการ"
 game_concept_movements: "ขบวนการ"
 game_concept_movement_possessive: "ของขบวนการ"
 game_concept_movements_possessive: "ของขบวนการ"
 game_concept_movement_desc: "กลุ่มของ [characters|E] ที่มีความสนใจและวิสัยทัศน์ร่วมกันเกี่ยวกับ [dynastic_cycle|E]. สมาชิกขบวนการ แต่ละคนสามารถเข้าถึง [interactions|E] และ [decisions|E] ที่แตกต่างกันเพื่อผลักดันวัฏจักร. [movement_leader|E] คือโฆษกที่เป็นตัวแทนผลประโยชน์ของ [movement_possessive|E] กับ [son_of_heaven|E]"
 game_concept_movement_power: "พลังขบวนการ"
 game_concept_movement_power_i: "@movement_power_icon!"
 game_concept_movement_power_desc: "พลังขบวนการแสดงถึงอิทธิพลทางการเมืองของกลุ่มที่เกี่ยวข้องใน [dynastic_cycle|E]. มันคือผลรวมของ [personal_movement_power|E] ของตัวละครทั้งหมดในกลุ่ม\n\n#V [movement_power_i|E][EmptyScope.ScriptValue('extremely_high_movement_power_value')]#! ปลดล็อก [interaction|E] $dismiss_strong_hook_interaction$, [interaction|E] $request_raid_remit_interaction$ และ [scheme|E] [GetScheme('raid_estate').GetTypeName]\n\n#help พลังได้มาจาก:\n$BULLET_WITH_TAB$[merit_i][merit_level|E]\n$BULLET_WITH_TAB$[influence_i][influence_level|E]\n$BULLET_WITH_TAB$อายุ\n$BULLET_WITH_TAB$[movement_power|E] ของ [disciples|E]\n$BULLET_WITH_TAB$ความแข็งแกร่งทางการทหารในปัจจุบัน #weak (สำคัญน้อยกว่าใน [GetSituationType('dynastic_cycle').GetPhaseType('situation_dynastic_cycle_phase_stability_advancement').GetName])#!\n$BULLET_WITH_TAB$[trait_level_track_xp|E] [GetTrait('confucian_education').GetName( GetNullCharacter )] #weak (สำคัญน้อยกว่าใน [GetSituationType('dynastic_cycle').GetPhaseType('situation_dynastic_cycle_phase_stability_expansion').GetName])#!\n$BULLET_WITH_TAB$[trait_level_track_xp|E] [GetTrait('governor').GetName( GetNullCharacter )] #weak (สำคัญน้อยกว่าใน [GetSituationType('dynastic_cycle').GetPhaseType('situation_dynastic_cycle_phase_stability_expansion').GetName])#!#!"
 game_concept_movement_power_short: "พลัง"
 game_concept_personal_movement_power: "พลังขบวนการส่วนตัว"
 game_concept_personal_movement_power_desc: "$game_concept_personal_movement_power$ คือจำนวนที่สมาชิกเพิ่ม [movement_power_short|E] โดยรวมของ [movement|E] ของพวกเขา"
