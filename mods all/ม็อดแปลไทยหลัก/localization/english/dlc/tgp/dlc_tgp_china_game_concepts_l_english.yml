 game_concept_movement_leader: "ผู้นำขบวนการ"
 game_concept_movement_leader_possessive: "ของผู้นำขบวนการ"
 game_concept_movement_leaders: "ผู้นำขบวนการ"
 game_concept_movement_leaders_possessive: "ของผู้นำขบวนการ"
 game_concept_movement_leader_short: "ผู้นำ"
 game_concept_movement_leader_desc: "ตัวละครที่นำ [movement|E] ซึ่งได้รับมอบหมายให้เป็นสมาชิกเพียงคนเดียวที่ได้รับอนุญาตให้พูดคุยโดยตรงกับ [son_of_heaven|E] เพื่อส่งเสริมวาระของ [movements|E] โดยใช้ [decision|E] [GetDecision('movement_petition_decision').GetName]\n\n#help ในการเป็นผู้นำ ท่านต้องมี [movement_power_i][movement_power|E] สูงสุดเมื่อผู้นำคนก่อนเสียชีวิต หรือเอาชนะผู้นำคนปัจจุบันใน [activity|E] [GetActivityType('activity_debate').GetName]#!"
 game_concept_favored_era: "ยุคที่โปรดปราน"
 game_concept_favored_era_possessive: "ของยุคที่โปรดปราน"
 game_concept_favored_era_desc: "$game_concept_favored_era$ คือเจตจำนงแห่งสวรรค์ที่ [son_of_heaven|E] แสดงออกมาเกี่ยวกับทิศทางของ [dynastic_cycle|E]. มันกำหนดว่า [dynastic_cycle_era_type_stable|E] ใดจะถูกบังคับใช้หลังจาก [dynastic_cycle_era_type_unstable|E] สิ้นสุดลง"
 game_concept_favored_movement: "ขบวนการที่โปรดปราน"
 game_concept_favored_movement_desc: "$game_concept_favored_movement$ คือ [movement|E] ที่ได้รับการสนับสนุนจาก [son_of_heaven|E]\n$BULLET_WITH_TAB$ สมาชิกมี [candidate_scores|E] สูงกว่าสำหรับ [titles|E] ใดๆ ใน [SelectLocalization( GetPlayer.IsValid, 'game_concept_favored_movement_desc_ingame', 'h_china' )]\n$BULLET_WITH_TAB$คำร้องจาก [decision|E] [GetDecision('movement_petition_decision').GetName] มีแนวโน้มที่จะได้รับการยอมรับมากขึ้น\n$BULLET_WITH_TAB$[situation_catalyst_catalysts|E] ของ [dynastic_cycle_possessive|E] จะถูกกระตุ้นโดยขึ้นอยู่กับว่า [movement|E] ใดเป็นที่โปรดปราน\n$BULLET_WITH_TAB$ได้รับสิทธิ์เข้าถึง [decision|E] [GetDecision('favored_movement_consults_heaven_decision').GetName]\n\n#help ในการเป็นขบวนการที่โปรดปราน ท่านต้องเอาชนะผู้นำขบวนการที่โปรดปรานคนปัจจุบันใน [activity|E] [GetActivityType('activity_debate').GetName]#!"
 game_concept_favored_movement_desc_ingame: "[GetTitleByKey('h_china').GetDefinitiveName]"
 game_concept_favored_movement_possessive: "ของขบวนการที่โปรดปราน"
 game_concept_favored_movement_short: "โปรดปราน"
 game_concept_disciple: "ศิษย์"
 game_concept_disciples: "เหล่าศิษย์"
 game_concept_disciple_possessive: "ของศิษย์"
 game_concept_disciples_possessive: "ของเหล่าศิษย์"
 game_concept_disciple_desc: "$game_concept_disciples$ คือ [characters|E] ที่เคารพสถานะอันสูงส่งของ [elder|E] และปฏิบัติตามคำสอนของพวกเขา จนถึง [disciple_limit_short|E]\n\nพวกเขาสามารถเข้าถึง [character_interaction|E] #high $request_mentoring_interaction$#! #weak (แผนการ)#! เพื่อเพิ่ม [skills|E] ของตน และ [character_interaction|E] #high $celestial_request_elders_support_interaction$#! เพื่อรับ [gold|E], [courtiers|E] และอื่นๆ\n\n$disciple_elder_benefits_tt$"
 disciple_elder_benefits_tt: "$game_concept_disciple$ และ [elder|E]:\n$BULLET_WITH_TAB$ได้รับ [merit|E] มากขึ้น\n$BULLET_WITH_TAB$มีโอกาสน้อยที่จะใช้ [hostile_schemes|E] ต่อกัน\n$BULLET_WITH_TAB$มีแนวโน้มที่จะยอมรับ [interactions|E] ที่อีกฝ่ายส่งมามากขึ้น\n$BULLET_WITH_TAB$มีแนวโน้มที่จะใช้ [interactions|E] ที่เป็นมิตรต่ออีกฝ่ายมากขึ้น #weak (เช่น $gift_interaction$, $invite_to_council_position_interaction$, ฯลฯ)#!\n$BULLET_WITH_TAB$ทั้งคู่จะอยู่ใน [movement|E] ของ $game_concept_elder_possessive$"
 game_concept_disciple_limit: "ขีดจำกัดศิษย์"
 game_concept_disciple_limit_short: "ขีดจำกัด"
 game_concept_disciple_limit_desc: "$game_concept_disciple_limit$ คือความจุของจำนวน [disciples|E] ที่ [elder|E] สามารถมีได้ในเวลาใดเวลาหนึ่ง\n\nขีดจำกัดคือ [EmptyScope.ScriptValue('disciples_limit_base_value')|V0] โดยค่าเริ่มต้น. สามารถเพิ่มได้ เช่น โดยการปรับปรุง [domicile|E] ด้วย [domicile_buildings|E] บางอย่าง"
 game_concept_elder: "ผู้อาวุโส"
 game_concept_elders: "ผู้อาวุโส"
 game_concept_elder_possessive: "ของผู้อาวุโส"
 game_concept_elders_possessive: "ของผู้อาวุโส"
 game_concept_elder_desc: "$game_concept_elder$ คือ [character|E] ที่มี [disciples|E] หนึ่งคนหรือมากกว่า ซึ่งปฏิบัติตามคำสอนของ $game_concept_elders_possessive$ \n\n$disciple_elder_benefits_tt$"

 game_concept_disaster: "ภัยพิบัติ"
 game_concept_disasters: "ภัยพิบัติ"
 game_concept_natural_disaster: "ภัยพิบัติทางธรรมชาติ"
 game_concept_natural_disasters: "ภัยพิบัติทางธรรมชาติ"
 game_concept_disaster_desc: "$game_concept_natural_disasters$ ครอบคลุม [floods|E] และ [earthquakes|E]\n\n$game_concept_natural_disaster$ จะ ส่งผลให้เกิด [character_death_death|E] ของ [characters|e] จำนวนมากใน [counties|E] ที่ได้รับผลกระทบ และจะมีผลกระทบเชิงลบอย่างมีนัยสำคัญต่อ [development|E], [county_opinion|E] และ [control|E] ตามความรุนแรงของภัยพิบัติ\n\nความเสียหายที่เกิดจาก $game_concept_natural_disaster$ สามารถแก้ไขได้และที่ดินจะได้รับการฟื้นฟูเมื่อเสร็จสิ้น [great_project|E] บรรเทาทุกข์"

 game_concept_earthquake: "แผ่นดินไหว"
 game_concept_earthquakes: "แผ่นดินไหว"
 game_concept_earthquake_desc: "$game_concept_earthquake$ คือประเภทของ [natural_disaster|E] ซึ่งก่อให้เกิดการทำลายล้างอย่างรุนแรงและฉับพลันใน [counties|E] จำนวนเล็กน้อย\n$game_concept_earthquakes$ สามารถเกิดขึ้นได้เฉพาะในภูมิภาคที่มีแนวโน้มที่จะเกิดแผ่นดินไหวมากกว่า"

 game_concept_flood: "น้ำท่วม"
 game_concept_floods: "น้ำท่วม"
 game_concept_flooded: "ถูกน้ำท่วม"
 game_concept_flood_desc: "$game_concept_flood$ คือ [natural_disaster|E] ซึ่งก่อให้เกิดความเสียหายที่เพิ่มขึ้นใน [counties|E] จำนวนมาก\n$game_concept_floods$ สามารถเกิดขึ้นได้เฉพาะตามริมฝั่งแม่น้ำสายหลักเท่านั้น"
 
 game_concept_government_bureaucratic_type: "ระบบขุนนาง"
 game_concept_government_bureaucratic_type_desc: "[governments|E] บางแห่งเป็น $game_concept_government_bureaucratic_type$. ซึ่งเป็นการปกครองแบบรวมศูนย์อย่างสูงที่โดยทั่วไปอาศัย [governors|E], [appointment|E] และ [noble_families|E] ที่ไม่มีที่ดินในการจัดการ [provinces|E] ภายใน [realm|E]\n\nคุณสมบัติทั่วไปอื่นๆ ได้แก่ [domiciles|E], [influence|E] และ [title_men_at_arms|E]\n\nมีการปกครองแบบ $game_concept_government_bureaucratic_type$ หลายแบบ:\n$BULLET_WITH_TAB$[GetGovernment('administrative_government').GetNameWithIcon]\n$BULLET_WITH_TAB$[GetGovernment('celestial_government').GetNameWithIcon]\n$BULLET_WITH_TAB$[GetGovernment('meritocratic_government').GetNameWithIcon]\n$BULLET_WITH_TAB$[GetGovernment('japan_administrative_government').GetNameWithIcon]\n$BULLET_WITH_TAB$[GetGovernment('steppe_admin_government').GetNameWithIcon]"
 game_concept_government_bureaucratic_gov: "การปกครองแบบระบบขุนนาง"
