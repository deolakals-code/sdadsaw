 game_concept_minister_of_works: "$minister_works$"
 game_concept_minister_of_works_desc: "$game_concept_minister_of_works$ คือ [minister|E] ที่ดูแลการก่อสร้างและการพัฒนาทั่วทั้ง [realm|E] และอาจเริ่ม [great_projects|E] ได้\n\n$minister_of_works_action_breakdown$"
