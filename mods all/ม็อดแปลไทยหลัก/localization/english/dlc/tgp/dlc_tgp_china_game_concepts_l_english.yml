 game_concept_grand_secretariat_director: "ผู้อำนวยการสำนักเลขาธิการ"
 game_concept_grand_secretariat: "สำนักอัครเลขาธิการ"
 game_concept_grand_secretariat_possessive: "ของสำนักอัครเลขาธิการ"
 game_concept_grand_secretariat_director_desc: "ผู้อำนวยการสำนักเลขาธิการเป็น [diarch|E] ประเภทหนึ่งสำหรับ [son_of_heaven|E] ซึ่งช่วยเหลือผู้ปกครองอันศักดิ์สิทธิ์ในการจัดการ [realm|E]\n\nผู้อำนวยการจะเป็นใครนั้นขึ้นอยู่กับ [law|E] [GetLawGroup('grand_secretariat_laws').GetName|V] ที่บังคับใช้อยู่. ตำแหน่งนี้สามารถดำรงได้โดย [minister_grand_chancellor|E], [minister_grand_marshal|E] หรือ [minister_censor|E]\n\nผู้อำนวยการสามารถเริ่ม [great_projects|E] ส่วนใหญ่ที่มีให้สำหรับ [ministers|E] และโอรสสวรรค์บางคนได้"
 game_concept_ministry_obligation: "พันธะกระทรวง"
 game_concept_ministry_obligations: "พันธะกระทรวง"
 game_concept_ministry_obligations_desc: "$game_concept_ministry_obligations$ คือชุด [vassal_obligations|E] เฉพาะตัวที่มีให้สำหรับ [ministers|E] เท่านั้น\n\nเสนาบดีฝ่ายพลเรือนทุกคนมีตัวเลือกเฉพาะที่ตั้งเป็นค่าเริ่มต้น ในขณะที่ [minister_grand_marshal|E] มีตัวเลือกเฉพาะที่ให้ [title_men_at_arms|E] แก่จอมพล\n\nพันธะเหล่านี้ไม่สามารถเปลี่ยนแปลงได้"

 game_concept_civilian_career_path: "เส้นทางอาชีพฝ่ายพลเรือน"
 game_concept_civilian_career_path_i: "@celestial_standard_administration!"
 game_concept_civilian_career_path_desc: "[rulers|E] ที่ดำเนินตามเส้นทางอาชีพฝ่ายพลเรือนจะมุ่งเน้นไปที่ทักษะการบริหารมากกว่าเล่ห์เหลี่ยมทางการทหาร. พวกเขาจะได้รับการ แต่งตั้งไปยังเขตปกครองฝ่ายพลเรือน และ [merit|E] ของพวกเขาจะเติบโตตามความสำเร็จในการพัฒนาที่ดินด้วย [buildings|E] และการเพิ่ม [taxes|E] ที่จ่ายให้กับ [liege|E]"
 game_concept_civilian_career: "อาชีพฝ่ายพลเรือน"
 game_concept_civilian_career_short: "พลเรือน"
 game_concept_military_career_path: "เส้นทางอาชีพฝ่ายทหาร"
 game_concept_military_career_path_i: "@celestial_military_administration!"
 game_concept_military_career_path_desc: "[rulers|E] ที่ดำเนินตามเส้นทางอาชีพฝ่ายทหารจะมุ่งเน้นไปที่ทักษะการทหารมากกว่างานธุรการ. พวกเขาจะได้รับการ แต่งตั้งไปยังเขตปกครองฝ่ายทหาร และ [merit|E] ของพวกเขาจะเติบโตขึ้นอยู่กับความสามารถในการสรรหาและดูแล [title_men_at_arms|E]"
 game_concept_military_career: "อาชีพฝ่ายทหาร"
 game_concept_military_career_short: "ทหาร"
 
 game_concept_civilian_governor: "ผู้ว่าการฝ่ายพลเรือน"
 game_concept_civilian_governors: "ผู้ว่าการฝ่ายพลเรือน"
 game_concept_civilian_governor_short: "พลเรือน"
 game_concept_civilian_governor_desc: "ผู้ว่าการฝ่ายพลเรือนคือ [governor|E] ที่มี [vassal_obligations|E] ฝ่ายพลเรือน. ต่างจาก [military_governors|E] พวกเขาไม่สามารถจัดตั้ง [title_men_at_arms|E] ได้ และมุ่งเน้นไปที่งานธุรการและการพัฒนาที่ดินที่พวกเขาปกครองเท่านั้น\n\n[characters|E] ที่ดำเนินตาม [civilian_career_path|E] สามารถเป็นผู้ว่าการฝ่ายพลเรือนได้"
 game_concept_military_governor: "ผู้ว่าการฝ่ายทหาร"
 game_concept_military_governors: "ผู้ว่าการฝ่ายทหาร"
 game_concept_military_governor_short: "ทหาร"
 game_concept_military_governor_desc: "ผู้ว่าการฝ่ายทหารคือ [governor|E] ที่มี [vassal_obligations|E] ฝ่ายทหาร. พวกเขาสามารถจัดตั้ง [title_men_at_arms|E] ได้ ต่างจาก [civilian_governors|E] และจะใช้พวกเขาเพื่อปกป้อง [realm|E] จากการรุกรานจากต่างชาติและสนับสนุนผู้ว่าการคนอื่นๆ ที่ต้องการความช่วยเหลือทางทหาร\n\n[characters|E] ที่ดำเนินตาม [military_career_path|E] สามารถเป็นผู้ว่าการฝ่ายทหารได้"

 # Great Projects
 game_concept_great_project: "โครงการอันยิ่งใหญ่"
 game_concept_great_projects: "โครงการอันยิ่งใหญ่"
 game_concept_great_project_i: "@great_project_icon!"
 game_concept_great_project_possessive: "ของโครงการอันยิ่งใหญ่"
 game_concept_great_project_desc: "โครงการอันยิ่งใหญ่เป็นภารกิจขนาดมหึมาที่ต้องใช้ทรัพยากรทั้งหมดของ [realm|E]\n\nโครงการอันยิ่งใหญ่บางโครงการเกี่ยวข้องกับการสร้าง [great_building|E] ในขณะที่โครงการอื่นๆ เกี่ยวข้องกับการฟื้นตัวจาก [natural_disaster|E]\n\nในขณะที่ [ruler|E] ของอาณาจักรดูแลการพัฒนาโครงการอันยิ่งใหญ่ [subjects|E] สามารถเสนอ [great_project_contributions|E] เพื่อช่วยให้โครงการคืบหน้าได้"
 game_concept_great_project_contribution: "การสนับสนุน"
 game_concept_great_project_contributions: "การสนับสนุน"
 game_concept_great_project_contribute: "สนับสนุน"
 game_concept_great_project_contributed: "สนับสนุนแล้ว"
 game_concept_great_project_contribution_desc: "การสนับสนุนช่วยให้ [rulers|E] หลายคนสามารถช่วยในการพัฒนา [great_project|E] เพื่อรับผลประโยชน์ต่างๆ เป็นการตอบแทน\n\nการสนับสนุนบางอย่างจำเป็นสำหรับความคืบหน้าของโครงการอันยิ่งใหญ่ที่จะเริ่มต้น ในขณะที่บางอย่างเป็นทางเลือก. การสนับสนุนทางเลือกที่เหลือยังคงสามารถทำได้ ในขณะที่ความคืบหน้าได้เริ่มต้นขึ้นแล้ว จนถึงจุดหนึ่งของเวลา"
 game_concept_great_project_contributor: "ผู้สมทบทุน"
 game_concept_great_project_contributors: "ผู้สมทบทุน"
 game_concept_great_project_contributor_possessive: "ของผู้สมทบทุน"
 game_concept_great_project_contributors_possessive: "ของผู้สมทบทุน"
 game_concept_great_project_contributor_desc: "ผู้สมทบทุนคือ [rulers|E] ที่มุ่งมั่นที่จะรับผิดชอบอย่างน้อยหนึ่ง [great_project_contribution|E] ของ [great_project|E] โดยได้รับผลประโยชน์ตอบแทนต่างๆ\n\nสำหรับ [great_project_contributions|E] ส่วนใหญ่ [subject|E] ใดๆ ใน [realm|E] ก็สามารถเป็น [great_project_contributor|E] ได้"

 # Situation
 game_concept_dynastic_cycle: "วัฏจักรราชวงศ์"
 game_concept_dynastic_cycle_possessive: "ของวัฏจักรราชวงศ์"
 game_concept_dynastic_cycle_desc: "$game_concept_dynastic_cycle$ แสดงถึงสถานะทางสังคมและการเมืองของมหาจักรวรรดิจีน ซึ่งไหลผ่าน [situation_dynastic_cycle_phases|E] ของความมั่นคง, ความไม่มั่นคง และความโกลาหล\n\nหัวใจสำคัญของ $game_concept_dynastic_cycle$ คือ [mandate_of_heaven|E] ซึ่งเป็นรูปแบบหนึ่งของ [legitimacy|E] ที่จักรพรรดิทรงถือครอง. หากสูญเสียไป มหาจักรวรรดิจีนจะ #N แตกสลาย#! - จนกว่าจะรวมเป็นหนึ่งอีกครั้งโดยผู้ที่คู่ควรที่จะเป็นโอรสสวรรค์#!"

 game_concept_situation_dynastic_cycle_phase: "ยุควัฏจักรราชวงศ์"
 game_concept_situation_dynastic_cycle_phases: "ยุควัฏจักรราชวงศ์"
 game_concept_dynastic_cycle_era_short: "ยุค"
 game_concept_dynastic_cycle_eras_short: "ยุค"
 game_concept_situation_dynastic_cycle_phase_desc: "สถานะทางสังคมและการเมืองของ [dynastic_cycle|E]\n\nยุค:\n$BULLET$[dynastic_cycle_era_type_stable|E]: [GetSituationType('dynastic_cycle').GetPhaseType('situation_dynastic_cycle_phase_stability_advancement').GetName], [GetSituationType('dynastic_cycle').GetPhaseType('situation_dynastic_cycle_phase_stability_expansion').GetName]\n$BULLET$[dynastic_cycle_era_type_unstable|E]: [GetSituationType('dynastic_cycle').GetPhaseType('situation_dynastic_cycle_phase_instability').GetName]\n$BULLET$[dynastic_cycle_era_type_chaotic|E]: [GetSituationType('dynastic_cycle').GetPhaseType('situation_dynastic_cycle_phase_chaos').GetName]"
 game_concept_dynastic_cycle_era_type_stable: "ยุคที่มั่นคง"
 game_concept_dynastic_cycle_era_type_stable_desc: "[dynastic_cycle_era_types|E] ที่มั่นคง แสดงถึงช่วงเวลาที่จักรวรรดิมีความเจริญรุ่งเรืองและประสบความสำเร็จมากที่สุด และ [mandate_of_heaven|E] แข็งแกร่ง\n\nยุค: [GetSituationType('dynastic_cycle').GetPhaseType('situation_dynastic_cycle_phase_stability_expansion').GetName], [GetSituationType('dynastic_cycle').GetPhaseType('situation_dynastic_cycle_phase_stability_advancement').GetName]"
 game_concept_dynastic_cycle_era_type_unstable: "ยุคที่ไม่มั่นคง"
 game_concept_dynastic_cycle_era_type_unstable_desc: "[dynastic_cycle_era_types|E] ที่ไม่มั่นคง แสดงถึงช่วงเวลาที่จักรวรรดิอยู่ในความโกลาหล เนื่องจากกองกำลังภายในหรือภายนอก และ [mandate_of_heaven|E] กำลังสั่นคลอน\n\nยุค: [GetSituationType('dynastic_cycle').GetPhaseType('situation_dynastic_cycle_phase_instability').GetName], [GetSituationType('dynastic_cycle').GetPhaseType('situation_dynastic_cycle_phase_instability_conquest').GetName]"
 game_concept_dynastic_cycle_era_type_chaotic: "ยุคแห่งความโกลาหล"
 game_concept_dynastic_cycle_era_type_chaotic_desc: "[dynastic_cycle_era_types|E] แห่งความโกลาหล แสดงถึงช่วงเวลาที่จักรวรรดิแตกสลาย และ [mandate_of_heaven|E] ได้สูญสิ้นไป - ซึ่งอาจถูกกอบกู้โดยผู้ที่คู่ควร\n\nมียุคแห่งความโกลาหลเพียงยุคเดียว: [GetSituationType('dynastic_cycle').GetPhaseType('situation_dynastic_cycle_phase_chaos').GetName]"
