l_english: 


 # Celestial
 game_concept_celestial_government: "การปกครองแบบสวรรค์"
 game_concept_celestial: "สวรรค์"
 game_concept_celestials: "ชาวสวรรค์"
 game_concept_celestial_i: "@government_type_celestial!"
 game_concept_celestial_government_desc: "$game_concept_celestial$ คือ [government_bureaucratic_type|E] [government_form|E] ซึ่ง [liege|E] จะ แต่งตั้งตัวละครเป็น [governors|E] โดยมีอยู่สองประเภท ได้แก่ [civilian_governor_short|E] และ [military_governor_short|E].\n\nตัวละครสามารถเข้าถึง [influence|E], [noble_families|E], [family_estates|E] และ [treasury|E].\n\n[rulers|E] ที่เป็นอิสระจะมี [legitimacy|E] ในขณะที่ [vassals|E] มุ่งเน้นไปที่การได้รับ [merit|E]"


 # Merit
 game_concept_merit: "ความดีความชอบ"
 game_concept_meritorious: "ผู้มีความดีความชอบ"
 game_concept_merit_desc: "$game_concept_merit$ ของ [character_possessive|E] จะติดตามความก้าวหน้าไปยัง [merit_level|E] ถัดไป. ตัวละครทั้งหมดที่มี [elder|E] หรือ [disciples|E] จะสร้าง $game_concept_merit$ แบบพาสซีฟ\n\n[governors|E] สามารถเพิ่ม $game_concept_merit$ ของตนได้โดยการสร้าง [buildings|E] ใน [holdings|E] ที่ได้รับมอบหมาย, ออก [inspection|E] [activity|E], เข้าร่วมใน [GetActivityType('activity_debate').GetName] และเข้าร่วม [examinations|E].\n\nผู้ว่าการ [GetSubjectContractType( 'celestial_provinces' ).GetObligationNameShort( 'celestial_province_standard' )] จะเพิ่ม $game_concept_merit$ รายเดือนโดยการจ่าย [taxes|E] ให้ [liege|E] มากขึ้น, ในขณะที่ผู้ว่าการ [GetSubjectContractType( 'celestial_provinces' ).GetObligationNameShort( 'celestial_province_military' )] จะเพิ่มโดยการสร้าง [men_at_arms|E].\n\nผู้ที่มิใช่ $game_concept_governors$ สามารถพยายามเพิ่มได้โดยการเข้าร่วม [examinations|E]"
 game_concept_merit_i: "@merit_icon!"
 game_concept_merit_level: "ระดับความดีความชอบ"
 game_concept_merit_level_desc: "$game_concept_merit_level$ ของ [character_possessive|E] บ่งชี้ว่าพวกเขามีความเหมาะสมเพียงใดในฐานะ [governor|E] ใน [administrative_governments|E] ของเอเชียตะวันออก\n\nมันแสดงถึงความสำเร็จที่บันทึกไว้และการปฏิบัติตนตามหลักศีลธรรมตามอุดมคติของขงจื๊อผ่านจำนวน [merit|E] ที่พวกเขาได้รับ\n\nขุนนางที่มี $game_concept_merit_level$ สูง จะมี [candidate_score|E] และ [governor_salary|E] ที่สูงขึ้น\n\nระดับขั้นมีดังนี้:\n$EFFECT_LIST_BULLET$[GetModifier( 'merit_level_0' ).GetNameWithTooltip|L]\n$EFFECT_LIST_BULLET$[GetModifier( 'merit_level_1' ).GetNameWithTooltip|L]\n$EFFECT_LIST_BULLET$[GetModifier( 'merit_level_2' ).GetNameWithTooltip|L]\n$EFFECT_LIST_BULLET$[GetModifier( 'merit_level_3' ).GetNameWithTooltip|L]\n$EFFECT_LIST_BULLET$[GetModifier( 'merit_level_4' ).GetNameWithTooltip|L]\n$EFFECT_LIST_BULLET$[GetModifier( 'merit_level_5' ).GetNameWithTooltip|L]\n$EFFECT_LIST_BULLET$[GetModifier( 'merit_level_6' ).GetNameWithTooltip|L]\n$EFFECT_LIST_BULLET$[GetModifier( 'merit_level_7' ).GetNameWithTooltip|L]\n$EFFECT_LIST_BULLET$[GetModifier( 'merit_level_8' ).GetNameWithTooltip|L]\n$EFFECT_LIST_BULLET$[GetModifier( 'merit_level_9' ).GetNameWithTooltip|L]"
 game_concept_merit_levels: "ระดับขั้นความดีความชอบ"
 game_concept_merit_level_impact: "ผลกระทบระดับความดีความชอบ"
 game_concept_merit_level_impact_desc: "ผลกระทบระดับความดีความชอบ จะเพิ่มหรือลด [modifiers|E] ที่ได้รับจาก [merit_level|E] ปัจจุบันของคุณ"
 
 # Imperial Examinations
 game_concept_imperial_examination: "การสอบคัดเลือกขุนนาง"
 game_concept_imperial_examinations: "การสอบคัดเลือกขุนนาง"
 game_concept_examination: "การสอบ"
 game_concept_examinations: "การสอบ"
 game_concept_imperial_examination_desc: "$game_concept_imperial_examinations$ มีบทบาทสำคัญในหน้าที่ [administrative|E] ของ [governments|E] [GetGovernment('celestial_government').GetName|E] และ [GetGovernment('meritocratic_government').GetName|E] \n\nผ่านระบบการสอบ, ข้าราชการจะได้รับการ แต่งตั้งโดย [merit|E] มากกว่าสายเลือด, เพื่อให้แน่ใจว่านักปราชญ์ที่ฉลาดที่สุด, โดยไม่คำนึงถึงวงศ์ตระกูล, อาจได้รับการ แต่งตั้งเป็น [governorship|E] \n\nระดับการสอบมีดังนี้: \n#indent_newline:2 $EFFECT_LIST_BULLET$#bold การสอบเด็ก#!: ผู้ปกครองสามารถส่งบุตรหลานเข้าสอบได้ตั้งแต่อายุ [EmptyScope.ScriptValue('child_exam_min_age')] ผ่าน [interaction|E] $send_child_to_examination_interaction$#! \n#indent_newline:2 $EFFECT_LIST_BULLET$#bold ระดับมณฑล#!: ตัวละครที่ไม่ได้ [landed|E] อาจพยายามสอบระดับที่สองผ่าน [activity|E] [GetActivityType('activity_local_examination').GetName]#! \n#indent_newline:2 $EFFECT_LIST_BULLET$#bold ระดับมหานคร#!: จัดขึ้นโดย [government|E] [GetGovernment('celestial_government').GetName|E] ผ่านกิจกรรม [GetActivityType('activity_imperial_examination').GetName]#! \n#indent_newline:2 $EFFECT_LIST_BULLET$#bold ระดับพระราชวัง#!: ผู้เข้าสอบ [EmptyScope.ScriptValue('metropolitan_exam_final_entrants_loc')] คนสุดท้ายที่ $activity_imperial_examination$ จะได้รับเชิญไปงานเลี้ยงที่พระราชวัง, เพื่อเข้าเฝ้าและแสดงคุณค่าต่อ [son_of_heaven|E]#!"
 game_concept_exam_cheat: "การโกงข้อสอบ"
 game_concept_exam_cheat_desc: "$game_concept_exam_cheat$ จะปลดล็อกตัวเลือกที่อาจใช้เพื่อเลี่ยงผ่านการสอบที่กำลังจะมาถึง. แต่พึงระวัง, การถูกจับได้นั้นมีราคาสูง"

 game_concept_childrens_examination_i: "@child_exam_icon"
 game_concept_childrens_examination: "การสอบเด็ก"
 game_concept_childrens_examination_desc: "ระดับแรกของ [imperial_examinations|E], สอบได้ตั้งแต่อายุ [EmptyScope.ScriptValue('child_exam_min_age')]. ผู้ปกครองสามารถส่งบุตรหลานเข้าสอบผ่าน [interaction|E] $send_child_to_examination_interaction$"

 game_concept_provincial_examination_i: "@provincial_exam_icon"
 game_concept_provincial_examination: "การสอบระดับมณฑล"
 game_concept_provincial_examination_desc: "ระดับที่สองของ [imperial_examinations|E], สอบผ่าน [activity|E] [GetActivityType('activity_local_examination').GetName]\n\n#S เมื่อสอบผ่าน:#!\n[GetModifier( 'tgp_passed_provincial_exam_modifier' ).GetDescWithEffects]"

 game_concept_metropolitan_examination_i: "@metropolitan_exam_icon"
 game_concept_metropolitan_examination: "การสอบระดับมหานคร"
 game_concept_metropolitan_examination_desc: "ระดับที่สามของ [imperial_examinations|E]. จัดขึ้นโดย [government|E] [GetGovernment('celestial_government').GetName|E] ผ่าน [activity|E] [GetActivityType('activity_imperial_examination').GetName]\n\n#S เมื่อสอบผ่าน:#!\n[GetModifier( 'tgp_passed_metropolitan_exam_modifier' ).GetDescWithEffects]"

 game_concept_palace_examination_i: "@palace_exam_icon"
 game_concept_palace_examination: "การสอบระดับพระราชวัง"
 game_concept_palace_examination_desc: "ระดับที่สี่และระดับสุดท้ายของ [imperial_examinations|E]. ผู้เข้าสอบ [EmptyScope.ScriptValue('metropolitan_exam_final_entrants_loc')] คนสุดท้ายที่ [GetActivityType('activity_imperial_examination').GetName] จะได้รับเชิญไปงานเลี้ยงที่พระราชวัง, เพื่อถวายบังคมและแสดงคุณค่าต่อ [son_of_heaven|E]\n\n#S เมื่อสอบผ่าน:#!\n[GetModifier( 'tgp_passed_palace_exam_modifier' ).GetDescWithEffects]"

 game_concept_exam_advantage: "ความได้เปรียบในการสอบ"
 game_concept_exam_advantage_desc: "$game_concept_exam_advantage$ ช่วยเพิ่มโอกาสในการดำเนินการต่างๆ ระหว่าง [imperial_examination|E] เช่น เมื่อตอบคำถามและแสดงทักษะ"
 
 game_concept_exam_score: "คะแนนสอบ"
 game_concept_exam_score_desc: "$game_concept_exam_score$ จะกำหนดว่าผู้เข้าสอบมีแนวโน้มที่จะผ่าน [imperial_examination|E] มากน้อยเพียงใด\n\nคะแนนเริ่มต้นขึ้นอยู่กับ [trait|E] [GetTrait('confucian_education').GetName( GetNullCharacter )] ของผู้เข้าสอบ, รวมถึง [skills|E] [learning|E], [stewardship|E] และ [martial|E] ขึ้นอยู่กับจุดเน้นของ $game_concept_examination$\n\nเฉพาะผู้เข้าสอบสิบอันดับแรกใน [activity|E] [GetActivityType('activity_imperial_examination').GetName] เท่านั้นที่อาจพยายามสอบ @palace_exam_icon! #V การสอบระดับพระราชวัง#!."

 game_concept_merit_pool: "รายชื่อผู้สมัคร"
 game_concept_merit_pools: "รายชื่อผู้สมัคร"
 game_concept_merit_pool_possessive: "ของรายชื่อผู้สมัคร"
 game_concept_merit_pool_desc: "$game_concept_merit_pool$ ประกอบด้วย [characters|E] ที่มีศักยภาพทั้งหมดที่มีสิทธิ์ได้รับ [titles|E] พร้อม [appointment|E] บางประเภท\n\nผู้สมัครจะถูกจัดเรียงตาม [candidate_score|E] ของพวกเขา. [appointment_succession_laws|E] บางอย่างใช้ [merit|E] ซึ่งจะจัดเรียงผู้สมัครตาม [merit_level|E] ก่อน และ $game_concept_candidate_score$ เป็นอันดับสอง\n\nเมื่อ [holder|E] ของตำแหน่งที่มี $game_concept_appointment$ เสียชีวิต, ตำแหน่งจะตกทอดไปยังตัวละครที่มีอันดับสูงสุดในรายชื่อ. หากตัวละครนั้นครองตำแหน่งอยู่แล้ว, ตำแหน่งใหม่จะต้องมี [appointment_prominence|E] ที่สูงกว่า, มิฉะนั้นจะตกไปสู่ตัวละครถัดไป"

 game_concept_appointment_prominence: "ความโดดเด่น"
 game_concept_appointment_prominence_desc: "$game_concept_appointment_prominence$ สะท้อนให้เห็นว่า [title|E] นั้นเป็นที่ปรารถนาเพียงใดต่อผู้สมัครที่มีคุณสมบัติ\n\nผู้สมัครที่ถือครองบรรดาศักดิ์อยู่แล้วจะได้รับการ แต่งตั้งให้ดำรงตำแหน่งใหม่ใน [title_tier|E] เดียวกันก็ต่อเมื่อตำแหน่งนั้นมี $game_concept_appointment_prominence$ สูงกว่า\n\nโดยทั่วไป $game_concept_appointment_prominence$ จะขึ้นอยู่กับความมั่งคั่งในท้องถิ่นและความใกล้ชิดกับ [realm_capital|E] แต่ปัจจัยอื่นๆ อาจมีผลขึ้นอยู่กับสถานการณ์ เช่น ขนาดของ [title_men_at_arms|E] สำหรับ [military_governors|E]"

 game_concept_entrant: "ผู้เข้าสอบ"
 game_concept_entrants: "ผู้เข้าสอบ"
 game_concept_entrant_desc: "$game_concept_entrant$ คือตัวละครที่ทดสอบความสามารถของตนกับ [activity|E] [imperial_examination|E]"

 game_concept_subject_standing: "สถานะเมืองขึ้น"
 game_concept_subject_standing_desc: "$game_concept_subject_standing$ แสดงถึงสถานะที่ [suzerain|E] หรือ [liege|E] มอบให้แก่ [tributary|E] หรือ [vassal|E]"

 game_concept_imperial_grace: "พระคุณหลวง"
 game_concept_imperial_grace_desc: "$game_concept_imperial_grace$ หมายถึงสถานะที่ [son_of_heaven|E] มอบให้แก่ [tributary|E]\n\n$game_concept_imperial_grace$ ที่สูงอาจ ส่งผลให้ $game_concept_tributary$ ได้รับสิทธิพิเศษระหว่าง [tribute_missions|E] ที่ระดับ $game_concept_imperial_grace$ ต่ำ $game_concept_son_of_heaven$ อาจ #EMP เรียก#! บรรณาการจากท่าน และหากถึงศูนย์ ก็อาจหมายถึงการสิ้นสุดความสัมพันธ์"

 game_concept_seal_of_investiture: "ตรา แต่งตั้ง"
 game_concept_seal_of_investiture_desc: "$game_concept_seal_of_investiture$ เป็นทั้งเอกสารทางกฎหมายและสัญลักษณ์อันเป็นที่เคารพถึงพระคุณของโอรสสวรรค์, แสดงถึงสถานะพิเศษของผู้ถือในฐานะ [tributary|E] ที่ภักดีและเป็นที่โปรดปรานของ [SelectLocalization( GetPlayer.IsValid, 'game_concept_seal_of_investiture_desc_ingame', 'h_china' )]\n\n$game_concept_seal_of_investiture$ อาจได้รับพระราชทานแก่ $game_concept_tributaries$ ที่มี [imperial_grace|E] สูงในระหว่างพิธีปิดของ #bold ภารกิจถวายส่วย#! ที่ประสบความสำเร็จ"
 game_concept_seal_of_investiture_desc_ingame: "[GetTitleByKey('h_china').GetDefinitiveName]"
 HAS_SEAL_OF_INVESTITURE: "ท่านมี [seal_of_investiture|E]"
 NO_SEAL_OF_INVESTITURE: "ท่านไม่มี [seal_of_investiture|E]"

 SUBJECT_STANDING_CONCEPT: "[subject_standing|E]"
 SUBJECT_STANDING_IMPERIAL_GRACE_CONCEPT: "[imperial_grace|E]"
 IMPERIAL_GRACE_ICON: "@imperial_grace!"

 IMPERIAL_GRACE_LOSS_STABILITY: "เนื่องจาก [dynastic_cycle|E] กำลังอยู่ในช่วง $situation_dynastic_cycle_phase_stability$ #EMP $tributaries_celestial$#! ทั้งหมดสูญเสีย @imperial_grace! [EmptyScope.ScriptValue('imperial_grace_loss_situation_dynastic_cycle_phase_stability')|V1] [imperial_grace|E] ใน แต่ละปี"
 IMPERIAL_GRACE_LOSS_STABILITY_EXPANSION: "เนื่องจาก [dynastic_cycle|E] กำลังอยู่ในช่วง $situation_dynastic_cycle_phase_stability_expansion$ #EMP $tributaries_celestial$#! ทั้งหมดสูญเสีย @imperial_grace! [EmptyScope.ScriptValue('imperial_grace_loss_situation_dynastic_cycle_phase_stability_expansion')|V1] [imperial_grace|E] ใน แต่ละปี"
 IMPERIAL_GRACE_LOSS_STABILITY_ADVANCEMENT: "เนื่องจาก [dynastic_cycle|E] กำลังอยู่ในช่วง $situation_dynastic_cycle_phase_stability_advancement$ #EMP $tributaries_celestial$#! ทั้งหมดสูญเสีย @imperial_grace! [EmptyScope.ScriptValue('imperial_grace_loss_situation_dynastic_cycle_phase_stability_advancement')|V1] [imperial_grace|E] ใน แต่ละปี"
 IMPERIAL_GRACE_LOSS_INSTABILITY: "เนื่องจาก [dynastic_cycle|E] กำลังอยู่ในช่วง $situation_dynastic_cycle_phase_stability_advancement$ #EMP $tributaries_celestial$#! ทั้งหมดสูญเสีย @imperial_grace! [EmptyScope.ScriptValue('imperial_grace_loss_situation_dynastic_cycle_phase_instability')|V1] [imperial_grace|E] ใน แต่ละปี"
 IMPERIAL_GRACE_LOSS_INSTABILITY_CONQUEST: "เนื่องจาก [dynastic_cycle|E] กำลังอยู่ในช่วง $situation_dynastic_cycle_phase_instability_conquest$ #EMP $tributaries_celestial$#! ทั้งหมดสูญเสีย @imperial_grace! [EmptyScope.ScriptValue('imperial_grace_loss_situation_dynastic_cycle_phase_instability_conquest')|V1] [imperial_grace|E] ใน แต่ละปี"
 IMPERIAL_GRACE_LOSS_CHAOS: "เนื่องจาก [dynastic_cycle|E] กำลังอยู่ในช่วง $situation_dynastic_cycle_phase_chaos$ #EMP $tributaries_celestial$#! ทั้งหมดสูญเสีย @imperial_grace! [EmptyScope.ScriptValue('imperial_grace_loss_situation_dynastic_cycle_phase_chaos')|V1] [imperial_grace|E] ใน แต่ละปี"

 # Mandate
 game_concept_mandate_of_heaven: "อาณัติสวรรค์"
 game_concept_mandate_of_heaven_mandate: "อาณัติ"
 game_concept_mandate_of_heaven_desc: "$game_concept_mandate_of_heaven$ เป็น [legitimacy|E] ประเภทพิเศษที่มีให้สำหรับ [son_of_heaven|E] เท่านั้น. มันแสดงถึงสิทธิ์ในการปกครองของราชา และผู้ที่ถือเป็นผู้ปกครองสูงสุดภายใต้สวรรค์ทั้งมวล\n\nอาณัติมีความเชื่อมโยงอย่างใกล้ชิดกับ [dynastic_cycle|E]. วัฏจักรนี้ส่งผลต่อวิธีที่ราชาผู้ครองราชย์ได้รับความชอบธรรม และยังอาจเปลี่ยน [situation_dynastic_cycle_phase|E] ตามระดับอาณัติของราชาด้วย"

 game_concept_son_of_heaven: "โอรสสวรรค์"
 game_concept_son_of_heaven_possessive: "ของโอรสสวรรค์"
 game_concept_son_of_heaven_desc: "$game_concept_son_of_heaven$ คือ [hegemon|E] แห่งจีน และ [top_liege|E] ของ [celestial_government|E]\n\n$game_concept_son_of_heaven$ มีรูปแบบพิเศษของ [legitimacy|E] คือ [mandate_of_heaven|E] และ [situation_participant_group|E] เฉพาะตัวที่เรียกง่ายๆ ว่า $game_concept_son_of_heaven$"

 # Treasury
 game_concept_treasury_i: "@treasury_icon!"
 game_concept_treasury: "คลังหลวง"
 game_concept_treasury_desc: "ใน [administrative_governments|E] บางประเภท, คลังหลวง หมายถึงสินทรัพย์ที่อาจใช้เพื่อวัตถุประสงค์ของรัฐบาลเท่านั้น, ตรงกันข้ามกับ [gold|E] ส่วนตัวของคุณ\n\n$BULLET$#indent_newline:2 ในฐานะ [vassal|E], ท่านจะได้รับคลังหลวงจาก [liege|E] ของท่าน, ขึ้นอยู่กับการอุดหนุน [tax|E] และภาระผูกพันอื่นๆ#!\n$BULLET$#indent_newline:2 คลังหลวงถูกสร้างขึ้นโดย [top_liege|e] ซึ่งแปลงเปอร์เซ็นต์ของรายได้ [taxation|E] เป็นคลังหลวง#!\n$BULLET$#indent_newline:2 ท่านสามารถโอน [gold|E] ไปยังคลังหลวงได้ตามต้องการ#!\n$BULLET$#indent_newline:2 คลังหลวงจะยังคงอยู่กับ [title|E] หากมี [holder|E] ใหม่#!"
 game_concept_imperial_treasury_i: "$game_concept_treasury_i$"
 game_concept_imperial_treasury: "คลังหลวง"
 game_concept_imperial_treasury_desc: "$game_concept_treasury_desc$"

 game_concept_treasury_vassal_development: "การพัฒนาข้าหลวง"
 game_concept_treasury_vassal_development_desc: "คลังหลวงที่ส่งไปยัง [vassals|E] โดยตรงผ่าน [liege|E] ของพวกเขา, ขึ้นอยู่กับการอุดหนุนภาษีและ [obligations|E] อื่นๆ"
 game_concept_treasury_ministry_budget: "งบประมาณกระทรวง"
 game_concept_treasury_ministry_budget_short: "กระทรวง"
 game_concept_treasury_ministry_budget_desc: "คลังหลวงที่ส่งไปยัง [vassals|E] จากรัฐบาลกลาง, เพื่อวัตถุประสงค์ในการจัดหาทุนให้ [ministries|E]. ขึ้นอยู่กับการจัดสรรที่คำนวณเป็นระยะของรายได้ [treasury|E] ของ [top_liege|E]"
 game_concept_treasury_salary_budget: "งบประมาณเงินเดือน"
 game_concept_treasury_salary_budget_short: "เงินเดือน"
 game_concept_treasury_salary_budget_desc: "คลังหลวงที่ส่งไปยัง [vassals|E] จากรัฐบาลกลาง, ซึ่งพวกเขาได้รับเป็น [gold|E] เพื่อใช้เป็นเงินเดือนส่วนตัว. ขึ้นอยู่กับการจัดสรรที่คำนวณเป็นระยะของรายได้ [treasury|E] ของ [top_liege|E]"
 game_concept_treasury_military_budget: "งบประมาณการทหาร"
 game_concept_treasury_military_budget_short: "การทหาร"
 game_concept_treasury_military_budget_desc: "คลังหลวงที่ส่งไปยัง [vassals|E] [province|E] ฝ่ายทหารจากรัฐบาลกลาง, เพื่อวัตถุประสงค์ในการจัดหาทุนสำหรับกิจกรรมทางทหารเพิ่มเติม. ขึ้นอยู่กับการจัดสรรที่คำนวณเป็นระยะของรายได้ [treasury|E] ของ [top_liege|E]"

 game_concept_governor_salary: "เงินเดือนผู้ว่าการ"
 game_concept_governor_salary_desc: "ใน [administrative_governments|E] ที่แยกแยะระหว่าง [gold|E] และ [treasury|E], [governors|E] จะได้รับเงินเดือนเป็น $game_concept_gold$"

 game_concept_treasury_budgeting: "การจัดทำงบประมาณคลังหลวง"
 game_concept_treasury_budget: "งบประมาณคลังหลวง"
 game_concept_treasury_budgeting_desc: "ระบบที่รับผิดชอบในการแจกจ่ายเงินทุนส่วนกลางไปยัง [vassals|E] และข้าหลวงย่อยที่ระบุในอัตราการจัดสรรที่กำหนด\n\nเมื่องบประมาณถูกบังคับใช้, [treasury_budget_base_rate|E] ต่อข้าหลวงจะถูกคำนวณสำหรับ แต่ละ [treasury_budget_category|E] ตาม [treasury_budget_capacity|E] ที่มีอยู่\n\n@alert_icon! อัตราพื้นฐานที่คำนวณได้ #bold จะไม่เปลี่ยนแปลง#! จนกว่าจะมีการบังคับใช้งบประมาณใหม่ในอนาคต! ดังนั้นหากท่านมีผู้รับมากขึ้น, ต้นทุนงบประมาณของท่านก็จะสูงขึ้น"

 game_concept_treasury_budget_capacity: "ความจุของงบประมาณ"
 game_concept_treasury_budget_capacity_desc: "จำนวน [treasury|E] ต่อเดือนที่มีอยู่สำหรับ [treasury_budgeting|E]. ประกอบด้วยรายได้คลังหลวงหักค่าใช้จ่ายปกติที่ไม่ได้จัดการโดยการจัดทำงบประมาณ, เช่น [treasury_vassal_development|E] และ [court_amenities|E]"

 game_concept_treasury_budget_category: "หมวดหมู่งบประมาณ"
 game_concept_treasury_budget_category_desc: "ส่วนหนึ่งที่แตกต่างของ [treasury_budgeting|E] ที่สามารถรับการจัดสรรงบประมาณได้. แต่ละหมวดหมู่งบประมาณสามารถมีผู้รับที่แตกต่างกัน, และอาจจ่ายเป็น [gold|E] แทน [treasury|E]"

 game_concept_treasury_budget_base_rate: "อัตราพื้นฐานงบประมาณ"
 game_concept_treasury_budget_base_rate_short: "อัตราพื้นฐาน"
 game_concept_treasury_budget_base_rate_desc: "จำนวนเงินที่ผู้รับมาตรฐานของ [treasury_budget_category|E] ได้รับ. ผู้รับอาจได้รับมากหรือน้อยกว่าอัตราพื้นฐานขึ้นอยู่กับ [title_rank|E], [merit_level|E] หรือตัวปรับแก้อื่นๆ"

 game_concept_treasury_budget_category_trend: "แนวโน้มหมวดหมู่งบประมาณ"
 game_concept_treasury_budget_category_trend_short: "แนวโน้ม"
 game_concept_treasury_budget_category_trend_desc: "ส่วนต่างของ [treasury|E] ที่ [treasury_budget_category|E] จะได้รับเทียบกับการบังคับใช้งบประมาณครั้งก่อน"

 game_concept_treasury_budget_unallocated: "งบประมาณคลังหลวงที่ไม่ได้จัดสรร"
 game_concept_treasury_budget_unallocated_short: "ไม่ได้จัดสรร"
 game_concept_treasury_budget_unallocated_desc: "งบประมาณคลังหลวงใดๆ ที่ไม่ได้จัดสรรจะมีส่วนสนับสนุนรายได้ [treasury] ทั่วไป"

 game_concept_treasury_budget_deficit: "การขาดดุลงบประมาณคลังหลวง"
 game_concept_treasury_budget_deficit_short: "ขาดดุล"
 game_concept_treasury_budget_deficit_desc: "เมื่อใช้จ่ายเกิน [treasury_budget_capacity|E], จำนวนเงินจะถูกหักออกจากรายได้ [treasury|E] รายเดือน"

 # Celestial Bureaucracy
 game_concept_celestial_bureaucracy: "ระบบขุนนางสวรรค์"
 game_concept_celestial_bureaucracy_desc: "$game_concept_celestial_bureaucracy$ แสดงถึงระดับการรวมศูนย์อำนาจของ [realm_possessive|E] [celestial|E] และอำนาจโดยทั่วไปที่ [ruler|E] มีเหนือ [vassals|E] ของตน\n\nมีเพียง [top_liege|E] เท่านั้นที่สามารถเปลี่ยน $game_concept_celestial_bureaucracy$ ได้ $game_concept_vassals$ แห่งสวรรค์จะใช้ระดับเดียวกับ $game_concept_liege$ ของตน\n\n$game_concept_celestial_bureaucracy$ มีสี่ระดับ:\n$EFFECT_LIST_BULLET$$celestial_bureaucracy_0$\n$EFFECT_LIST_BULLET$$celestial_bureaucracy_1$\n$EFFECT_LIST_BULLET$$celestial_bureaucracy_2$\n$EFFECT_LIST_BULLET$$celestial_bureaucracy_3$\n\nการเพิ่ม $game_concept_celestial_bureaucracy$ ต้องใช้ [prestige|E] จำนวนหนึ่ง ขึ้นอยู่กับ [realm_size|E] และ [learning_skill|E] ของผู้ปกครอง"
 game_concept_minister: "เสนาบดี"
 game_concept_ministers: "เหล่าเสนาบดี"
 game_concept_minister_possessive: "ของเสนาบดี"
 game_concept_ministers_possessive: "ของเหล่าเสนาบดี"
 game_concept_minister_desc: "$game_concept_ministers$ คือ [councillors|E] ประเภทหนึ่งที่รับใช้ใน [council|E] หรือ [ministry|E] ของ [son_of_heaven|E]\n\nเสนาบดี แต่ละคนมีหน้าที่รับผิดชอบหลายประการ เช่น การให้ทุนสนับสนุน [great_projects|E] และช่วยเหลือ [governors|E] ในรูปแบบต่างๆ"
 game_concept_ministry: "กระทรวง"
 game_concept_ministries: "กระทรวง"
 game_concept_ministry_possessive: "ของกระทรวง"
 game_concept_ministries_possessive: "ของกระทรวง"
 game_concept_ministry_desc: "$game_concept_ministry$ คือรูปแบบหนึ่งของ [council|E] ที่มีเฉพาะสำหรับ [son_of_heaven|E] เท่านั้น\n\nมี [ministers|E] เก้าตำแหน่ง แต่ละตำแหน่งเป็นตัวแทนของระดับสูงสุดของรัฐบาลและเป็นหัวหน้าแผนกของตนเอง โดยจัดลำดับชั้น เพื่อให้เสนาบดีระดับต่ำกว่าสามารถเลื่อนตำแหน่งไปสู่ตำแหน่งที่สูงกว่าได้ ขึ้นอยู่กับ [appointment_prominence|E] ของ [title|E]\n\n$game_concept_ministers$ ได้แก่:\n$EFFECT_LIST_BULLET$[minister_grand_chancellor|E]\n$EFFECT_LIST_BULLET$[minister_censor|E]\n$EFFECT_LIST_BULLET$[minister_grand_marshal|E]\n$EFFECT_LIST_BULLET$[minister_of_personnel|E]\n$EFFECT_LIST_BULLET$[minister_of_war|E]\n$EFFECT_LIST_BULLET$[minister_of_revenue|E]\n$EFFECT_LIST_BULLET$[minister_of_justice|E]\n$EFFECT_LIST_BULLET$[minister_of_rites|E]\n$EFFECT_LIST_BULLET$[minister_of_works|E]"
 game_concept_minister_grand_chancellor: "$councillor_chancellor_celestial_government_imperial$"
 game_concept_minister_grand_chancellor_desc: "$game_concept_minister_grand_chancellor$ เป็น [minister|E] ระดับสูงสุดและดูแลกิจการทางการทูต โดยทั่วไปจะได้รับมอบหมายตำแหน่ง [grand_secretariat_director|E]\n\nอัครมหาเสนาบดีสามารถเป็น [grand_secretariat_director|E] ได้ ขึ้นอยู่กับ [law|E] #V [GetLawGroup('grand_secretariat_laws').GetName]#!\n\n$minister_grand_chancellor_action_breakdown$"
 game_concept_minister_grand_chancellor_possessive: "$councillor_chancellor_celestial_government_imperial_possessive$"
 minister_grand_chancellor_action_breakdown: "#indent_newline:4 #weak เสนาบดีสามารถทำสิ่งต่างๆ เช่น:\n$BULLET$ใช้ [decision|E] [GetDecision('favored_movement_consults_heaven_decision').GetName|V]\n$BULLET$เชิญ [courtier|E] ประเภทใดก็ได้ด้วย [decision|E] [GetDecision('tgp_minister_recruit_courtiers_decision').GetName|V]\n$BULLET$เข้าถึงตัวเลือก [interaction|E] #V $influence_meritorious_career_interaction$#! พิเศษ และในราคาที่ลดลง\n$BULLET$เริ่ม [great_project|E] [GetGreatProjectType('minister_compel_religious_uniformity').GetName|V]#!#!"
 game_concept_minister_censor: "$councillor_spymaster_celestial_government_imperial$"
 game_concept_minister_censor_desc: "$game_concept_minister_censor$ คือ [minister|E] ที่ดูแลเรื่องแผนการและข่าวกรอง\n\nจงระวังการมีผู้ตรวจการที่ไม่ภักดี เพราะพวกเขาสามารถปกปิดและเข้าร่วมใน [schemes|E] ต่อต้านท่านและ [close_family|E] ของท่านได้อย่างง่ายดาย!\n\nผู้ตรวจการสามารถเป็น [grand_secretariat_director|E] ได้ ขึ้นอยู่กับ [law|E] [GetLawGroup('grand_secretariat_laws').GetName|V]\n\n$minister_censor_action_breakdown$"
 game_concept_minister_censor_possessive: "$councillor_spymaster_celestial_government_imperial_possessive$"
 minister_censor_action_breakdown: "#indent_newline:4 #weak เสนาบดีสามารถทำได้เช่น:\n$BULLET$ใช้ [interaction|E] #V $censor_find_secrets_interaction$#! เพื่อค้นหา [secrets|E] ใน [courts|E] ของ [vassal|E] ซึ่งท่านสามารถใช้เพื่อรับรางวัลเป็น [gold|E] [gold_i] จาก [liege|E] ของท่าน หรือได้รับ [hooks|E]\n$BULLET$การทำ [blackmail|E] จะกระตุ้น [dynastic_cycle_catalyst|E] #V '$catalyst_minister_blackmailed$'#!\n$BULLET$เข้าถึงตัวเลือก [interaction|E] #V $influence_meritorious_career_interaction$#! พิเศษ#!#!"
 game_concept_minister_grand_marshal: "$minister_grand_marshal$"
 game_concept_minister_grand_marshal_desc: "$game_concept_minister_grand_marshal$ คือแม่ทัพระดับสูงสุดใน [realm|E] และบัญชาการ [army|E] ของ [title_men_at_arms|E]\n\nจอมพลสามารถเป็น [grand_secretariat_director|E] ได้ ขึ้นอยู่กับ [law|E] #V [GetLawGroup('grand_secretariat_laws').GetName]#!\n\n$minister_grand_marshal_action_breakdown$"
 game_concept_minister_grand_marshal_possessive: "$minister_grand_marshal_possessive$"
 minister_grand_marshal_action_breakdown: "#indent_newline:4 #weak เสนาบดีสามารถทำสิ่งต่างๆ เช่น:\n$BULLET$เริ่ม [great_project|E] #V การรณรงค์ครั้งใหญ่#!\n$BULLET$เริ่ม [great_project|E] [GetGreatProjectType('construct_great_barracks').GetName|V]\n$BULLET$ใช้ [casus_bellis|E] #V $CHINA_SEIZE_COUNTY_CB_NAME$#! และ #V $CHINA_SEIZE_DUCHY_CB_NAME$#! ใน [dynastic_cycle_eras_short|E] [GetSituationType('dynastic_cycle').GetPhaseType('situation_dynastic_cycle_phase_stability_expansion').GetName] และ [GetSituationType('dynastic_cycle').GetPhaseType('situation_dynastic_cycle_phase_instability_conquest').GetName]\n$BULLET$เข้าถึงตัวเลือก [interaction|E] #V $influence_meritorious_career_interaction$#! พิเศษ#!#!"
 game_concept_minister_of_personnel: "$minister_personnel$"
 game_concept_minister_of_personnel_desc: "$game_concept_minister_of_personnel$ คือ [minister|E] ที่ดูแลเรื่อง [appointments|E] ทั้งหมดและสามารถส่งผลกระทบอย่างมากต่อ [candidate_score|E] ของ [characters|E] อื่นๆ\n\n$minister_of_personnel_action_breakdown$"
 game_concept_minister_of_personnel_possessive: "$minister_personnel_possessive$"
 minister_of_personnel_action_breakdown: "#indent_newline:4 #weak เสนาบดีสามารถทำสิ่งต่างๆ เช่น:\n$BULLET$ใช้ [interaction|E] #V $force_governor_removal_interaction$#! เพื่อไล่ [governors|E] ออกโดยไม่คำนึงถึง [law|E] [GetLawGroup('celestial_retirement_law').GetName]\n$BULLET$เชิญ [courtier|E] ประเภทใดก็ได้ด้วย [decision|E] [GetDecision('tgp_minister_recruit_courtiers_decision').GetName|V]\n$BULLET$บังคับให้ยอมรับ [interactions|E] #V $offer_courtier_interaction$#! และ #V $demand_courtier_interaction$#!\n$BULLET$เข้าถึงตัวเลือก [interaction|E] #V $influence_meritorious_career_interaction$#! พิเศษ และในราคาที่ลดลง#!#!"
 game_concept_minister_of_revenue: "$councillor_steward_celestial_government_imperial$"
 game_concept_minister_of_revenue_desc: "$game_concept_minister_of_revenue$ คือ [minister|E] ที่ดูแล [taxation|E] และช่วย [son_of_heaven|E] ดูแล [treasury|E]\n\n$minister_of_revenue_action_breakdown$"
 game_concept_minister_of_revenue_possessive: "$councillor_steward_celestial_government_imperial_possessive$"
 minister_of_revenue_action_breakdown: "#indent_newline:4 #weak เสนาบดีสามารถทำสิ่งต่างๆ เช่น:\n$BULLET$ช่วยเหลือ [vassals|E] ที่สามารถ #V $celestial_request_treasury_interaction$#!\n$BULLET$ใช้ [decision|E] [GetDecision('tgp_suggest_budget_change_decision').GetName|V]\n$BULLET$เริ่ม [great_project|E] [GetGreatProjectType('minister_project_conduct_census').GetName|V]\n$BULLET$ใช้ [interaction|E] #V $pay_treasury_debt_interaction$#! เพื่อชำระ [treasury_debt|E] ของ [civilian_governors|E] ซึ่งจะกระตุ้น [dynastic_cycle_catalyst|E] #V '$catalyst_cleared_treasury_debt$'#!\n$BULLET$เข้าถึงตัวเลือก [interaction|E] #V $influence_meritorious_career_interaction$#! พิเศษ#!#!"
 game_concept_minister_of_rites: "$councillor_court_chaplain_celestial_government_imperial$"
