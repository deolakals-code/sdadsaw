 game_concept_minister_of_war: "$minister_war$"
 game_concept_minister_of_war_desc: "$game_concept_minister_of_war$ คือ [minister|E] ที่ดูแลการบริหารและจัดการกองทหาร เมื่อ [governors|E] ในปกครองต้องการความช่วยเหลือทางทหาร $game_concept_minister_of_war$ คือผู้ที่สามารถส่งข้าหลวงฝ่ายทหารไปช่วยได้\n\nเสนาบดีผู้นี้ไม่ใช่ [commander|E] ที่ออกปฏิบัติการและไม่ได้นำทัพ นั่นเป็นหน้าที่ของ [minister_grand_marshal|E]\n\n$minister_of_war_action_breakdown$"
