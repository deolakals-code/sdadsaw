 prelude_events.0170.t: "เสียงแห่ง [guest.GetFaith.GetNameNoTooltip]"
 prelude_events.0170.desc: "ขณะที่แสงของวันเริ่มจางหาย ข้าเห็น [guest.GetTitledFirstName] มองมาในทิศทางของข้า [guest.GetSheHe] พยักหน้าตอบรับ ยิ้ม และก้าวเข้ามาใกล้\n\n"เป็นวันที่ดีจริง, ท่านไม่คิด เช่นนั้นหรือ, [ROOT.Char.GetFirstNameNoTooltip]? เราต้องขอบคุณ [guest.GetFaith.HighGodName] สำหรับพรเหล่านี้อย่างแน่นอน พวกเรา, [guest.GetFaith.GetAdherentNamePluralNoTooltip], เคารพบูชาคำสอนของ [guest.GetFaith.HighGodHerHis]" [guest.GetSheHe|U] ประกาศด้วยความภาคภูมิใจ, สูดหายใจเข้าลึกๆ ก่อนที่จะกล่าวถึงวิทยานิพนธ์ทางเทววิทยาของ [guest.GetHerHis] ต่อ"
