 prelude_events.0160.t: "[ROOT.Char.GetDynasty.GetNameNoTooltip] ท่ามกลางฝูงชน"
 prelude_events.0160.desc: ""[guest.GetHouse.GetMotto]" เสียงที่คุ้นเคยเอ่ยขึ้น ข้าหันไปพบ [guest.GetTitledFirstName] [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('guest'))] ของข้ากำลังเรียกความสนใจจากข้า\n\n"[ROOT.Char.GetFirstNameNoTooltip]" [guest.GetSheHe] ทักทายข้า, [guest.Custom('quirk_pos_pp')] "นับเป็นความยินดีอย่างยิ่งที่ได้พบชาว [ROOT.Char.GetDynasty.GetName] อีกคนในโอกาส เช่นนี้ รู้สึกราวกับว่าชั่วชีวิตหนึ่งได้ผ่านไปแล้วนับตั้งแต่การพบกันครั้งล่าสุดของเรา""
