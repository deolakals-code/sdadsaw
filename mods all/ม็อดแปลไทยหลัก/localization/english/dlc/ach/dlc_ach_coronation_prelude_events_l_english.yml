l_english: 
 prelude_events.0001.t: "หัตถ์แห่งความช่วยเหลือ"
 prelude_events.0001.desc: ""[ROOT.Char.Custom('FormOfAddressForLiege')|U] [ROOT.Char.GetTitledFirstName], ข้าได้สดับฟังมาจาก [regent.GetTitledFirstName] ผู้สำเร็จราชการอันดีของท่าน ผู้เป็นที่นับหน้าถือตาว่า ท่านนั้นมีแววรุ่งโรจน์" [guest.GetShortUIName] เอ่ยขึ้น, [guest.Custom('quirk_pos_pp')] "[guest.Custom2('DescriptorPositive', ROOT.Char)|U] และ [guest.Custom2('DescriptorPositive', ROOT.Char)], ช่างเป็น [ROOT.Char.GetTitleAsNameNoTooltip] ที่ดีที่สุดเท่าที่เราจะเคยหวังได้พ่ะย่ะค่ะ!""
 prelude_events.0001.a: ""ช่างยอดเยี่ยม! [regent.GetSheHe|U] กำลังทำงานทั้งหมดให้ข้า!""
 prelude_events.0001.b: ""ข้ายินดีรับของขวัญของท่าน""
 prelude_events.0001.b.tt.supporter: "[guest.GetShortUIName] กลายเป็น #high ผู้สนับสนุน#! ของท่าน"
 prelude_events.0001.c.tt.every_supporter: "ท่านได้รับ [prestige_i]#P 20#! สำหรับ $every_supporter$"
 prelude_events.0001.c: ""จงป่าวประกาศออกไป!""
 prelude_events.0001.c.opinion: "$every_detractor$ ได้รับ #P 10#! [opinion|E] ต่อท่าน #weak (-1.20/ปี) (ความเคารพ)#!"
 every_supporter: "ต่อ [coronation_supporter|E] ทุกคน ([THIS.ScriptValue('number_of_supporters_activity')|V0])"
 every_supporter_activity: "ต่อ [coronation_supporter|E] ทุกคน ([THIS.ScriptValue('number_of_supporters_activity')|V0])"
 every_detractor: "ต่อ [coronation_detractor|E] ทุกคน ([THIS.ScriptValue('number_of_detractors_activity')|V0])"
 every_detractor_activity: "ต่อ [coronation_detractor|E] ทุกคน ([THIS.ScriptValue('number_of_detractors_activity')|V0])"
 silent_coronation_modifier: "พิธีราชาภิเษกอันเงียบงัน"
 silent_coronation_modifier_desc: "ตัวละครนี้ให้การกระทำเป็นเครื่องพิสูจน์ตนเอง"
 
 prelude_events.0010.t: "สารจากบ้านเกิด"
 prelude_events.0010.desc: ""ท่านได้ยินข่าวคราวเกี่ยวกับ [ROOT.Char.GetTitledFirstName] สุดที่รักของเราแล้วหรือยัง?" [guest.GetTitledFirstName] แทบจะเก็บงำความยินดีของ [guest.GetHerHis] ไว้ไม่อยู่ขณะสนทนากับ [guest_2.GetTitledFirstName]\n\n"มีผู้กล่าวโดย [regent.GetTitledFirstName] ผู้สำเร็จราชการของ [ROOT.Char.GetHerHis] เองว่า [ROOT.Char.GetSheHe] แทบจะลืมตาไม่ขึ้นระหว่างการประชุมสภา แล้ว [ROOT.Char.GetSheHe] จะปกครองดินแดนนี้ได้อย่างไร ในเมื่อ [ROOT.Char.GetSheHe] ยังปกครอง [ROOT.Char.GetHerselfHimself] ไม่ได้เลย?""
 prelude_events.0010.a: "ข้า #EMP รู้#! อยู่แล้วว่า [regent.GetTitledFirstNameNoTooltip] กำลังวางแผนต่อต้านข้า!"
 prelude_events.0010.b: "ข้าจะให้คนของข้าแทรกซึมเข้าไปในสำนักของ [guest.GetFirstNamePossessiveNoTooltip]"
 prelude_events.0010.c: "เราต้องเอาชนะ [guest.GetHerHim] จากภายใน"
 prelude_events.0010.c.tt.success: "คนของท่านแทรกซึมเข้าสำนักได้สำเร็จ"
 prelude_events.0010.c.tt.failure: "คนของท่านล้มเหลวในการแทรกซึม"
 prelude_events.0010.d: ""เราทั้งสองคงเห็นพ้องกันว่าท่านไม่ได้ยินสิ่งใด...""
 prelude_events.0010.d.supporter.tt: "[guest.GetShortUIName] หยุดการเป็น #high ผู้ต่อต้าน#! ของท่าน และกลายเป็น #high ผู้สนับสนุน#!""
 prelude_events.0010.e: "[regent.GetFirstNameNoTooltip] อยากจะพูดสิ่งใดก็ปล่อย [regent.GetSheHe] พูดไป"
 
 prelude_events.0020.t: "เหล่าผู้สมคบคิดในสำนัก"
 prelude_events.0020.desc.intro: ""...ตราบใดที่การปกครองของ [ROOT.Char.GetHerHis] อ่อนแอ ศีรษะที่ยังไม่ได้สวมมงกุฎของ [ROOT.Char.GetHerHis] ก็จะคงอยู่อย่างนั้น" [faction_member.GetTitledFirstName] เอนตัวเข้าไปใกล้ [faction_member_2.GetTitledFirstName] "พิธีราชาภิเษกนี้เป็นสถานที่อันเหมาะยิ่งที่จะเฟ้นหาขุนนางผู้ทรงเกียรติที่คิด เช่นเดียวกับเรา"\n\nแน่นอนว่าข้าระแคะระคายถึงเจตนาของ"
 prelude_events.0020.desc.faction_member: "[faction.GetName] ซึ่งนำโดย [faction_member.GetTitledFirstNameNoTooltip] [faction_member.GetHerselfHimself]"
 prelude_events.0020.desc.faction_member_2: "[faction.GetName] ซึ่งนำโดย [faction_member_2.GetTitledFirstNameNoTooltip] [faction_member_2.GetHerselfHimself]"
 prelude_events.0020.desc.no_leader: "[faction.GetName]"
 prelude_events.0020.desc.outro: "หากพวกมันอยากเห็นข้าไร้มงกุฎ พวกมันก็ต้อง #EMP ตัดหัว#! ข้าเสียก่อน"
 prelude_events.0020.a: ""ท่านกำลังกล่าวถึงการกบฏกระมัง?""
 prelude_events.0020.b: ""ข้ามีหูตาทุกหนแห่ง, [faction_member.GetTitledFirstNameNoTooltip]""
 prelude_events.0020.b.tt.success: "[faction_member.GetShortUIName] รู้สึกหวาดกลัว"
 prelude_events.0020.b.tt.failure: "[faction_member.GetShortUIName] ยังคงเฉยเมย"
 prelude_events.0020.c: ""ความภักดีของท่าน #EMP ประเมินค่ามิได้#! สำหรับข้า""
 prelude_events.0020.d: "ปล่อยให้พวกมันพูดไป"
 
 coronation_events.3001.opening: "ถึง [ROOT.Char.GetTitledFirstNameNoTooltip] ผู้หลงลืม,"
 coronation_events.3001.desc: "ข้าหลวงผู้ภักดีของท่านจำนวนหนึ่งได้สังเกตเห็นว่าผู้ส่งสารที่นำคำเชิญไปยังพิธีราชาภิเษกของท่านได้สูญหายไประหว่างทางมายังสำนักของพวกเรา\n\nพวกเรามิใคร่พลาดโอกาสในวาระนี้"
 coronation_events.3001.a: "ขอบคุณสำหรับคำเตือนความจำ"
 coronation_events.3001.b: "มิได้มีความผิดพลาดใด"
 not_invited_coronation_opinion: "ไม่ได้รับเชิญไปพิธีราชาภิเษก"
 
 prelude_events.0030.t: "ดีใจที่ได้พบท่าน"
 prelude_events.0030.desc.intro: "ลานของ [activity.GetCurrentPhase.GetLocation.GetName] ส่องประกายสีทองเรืองรอง สายลมโชยพัดใบไม้ไหวขณะที่แขกเหรื่อเดินอยู่เบื้องล่าง\n\n"[ROOT.Char.GetFirstNameNoTooltip]!" ข้าหันไปพบกับ [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('guest'))] ของข้า [guest.GetFirstName] กำลังเรียกนามของข้า"
 prelude_events.0030.desc.lover: "งดงาม เช่นเคย [guest.GetSheHe] เดินมาตามทางของ[guest.GetHerHis]สู่ข้า "ข้าหวังว่าท่านจะอยู่ที่นี่" [guest.GetSheHe] ยิ้มอย่างเชื้อเชิญ"
 prelude_events.0030.desc.friend: "ด้วยรอยยิ้มกว้าง [guest.GetSheHe] แทบจะวิ่งเหยาะๆ มาทางข้า "สหาย!" [guest.GetSheHe|U] ตะโกน "ดีใจเหลือเกินที่ได้พบท่าน!""
 prelude_events.0030.a: ""ข้าได้ยินมาว่าโรงม้านั้นน่าอภิรมย์เป็นพิเศษ""
 prelude_events.0030.b: ""[guest.GetFirstNameNoTooltip], หากข้าจะขอความช่วยเหลือจากท่านสักเรื่อง...""
 prelude_events.0030.c: "$prelude_events.0030.b$"
 prelude_events.0030.d: ""ข้าเห็นว่าพวกเขามี [ROOT.Char.Custom('GetExpensiveDrink_Singular')] ดีๆ วางอยู่ตรงนี้""
 prelude_events.0030.e: "ดีเสมอที่ได้เห็นใบหน้าที่คุ้นเคย"
 lover_coronation_prelude_sneak_out: "[CHARACTER.GetShortUIName|U] และ [TARGET_CHARACTER.GetShortUIName] ลอบออกไปยังโรงม้าก่อนพิธีราชาภิเษก"
 lover_coronation_prelude_sneak_out_corresponding: "[TARGET_CHARACTER.GetShortUIName|U] และ [CHARACTER.GetShortUIName] ลอบออกไปยังโรงม้าก่อนพิธีราชาภิเษก"
 every_party_character: "แขกทุกคนที่เป็น [GetTrait('lifestyle_reveler').GetName( GetNullCharacter )], [GetTrait('gregarious').GetName( GetNullCharacter )] หรือ [GetTrait('drunkard').GetName( GetNullCharacter )]"
 
 prelude_events.0040.t: "ต้องไม่ใช่ท่าน"
 prelude_events.0040.desc: "วันนี้ช่างเป็นวันที่ดีเกินไป แน่นอนว่ามันต้องถูกทำลายลงด้วยการปรากฏตัวของ [guest.GetTitledFirstName] [guest.Custom2('InsultAdjective', ROOT.Char)], ศัตรูคู่อาฆาตของข้า\n\n"โอ้ ท่าน [ROOT.Char.GetLadyLord] [ROOT.Char.GetFirstNameNoTooltip]," [guest.GetSheHe] แสร้งทำเป็นมองไม่เห็นข้า จนกระทั่งข้าเข้าใกล้ [guest.GetHerHim] เกินไป "ท่านจะมาให้ความบันเทิงแก่พวกเราระหว่างอาหารมื้อค่ำหรือ? หรือว่านั่นคืออาภรณ์ที่ [ROOT.Char.GetTitleAsNameNoTooltip] สวมใส่มาในพิธีราชาภิเษก?""
 prelude_events.0040.a: "[guest.GetSheHe|U] จะพูดไม่ได้มากนักเมื่อข้าจัดการเสร็จ"
 prelude_events.0040.b: ""ข้าได้แรงบันดาลใจมาจากมารดาของท่าน""
 prelude_events.0040.c: "ข้าจะฟังทุกถ้อยคำที่ [guest.GetFirstNameNoTooltip] พูดที่นี่"
 prelude_events.0040.c.tt: "[scheme|E] จะมี [success_chance|E] #P เพิ่มขึ้น#!"
 prelude_events.0040.d: ""ที่นี่ไม่ใช่สถานที่สำหรับโต้เถียง""
 every_callous_vengeful_wrathful_guest: "แขกทุกคนที่เป็น [GetTrait('callous').GetName( GetNullCharacter )], [GetTrait('vengeful').GetName( GetNullCharacter )] หรือ [GetTrait('wrathful').GetName( GetNullCharacter )]"
 
 prelude_events.0050.t: "ใบหน้าที่คุ้นเคย"
 prelude_events.0050.desc.intro: "ลานหน้าปราสาทอบอวลไปด้วยดอกไม้ แขกเหรื่อหัวเราะอย่างร่าเริง [ROOT.Char.Custom('GetIncidentalDetail')]\n\n"[guest.Custom2('RelationToMe', SCOPE.sC('root_scope'))|U]!" ของข้า"
 prelude_events.0050.desc.callous: "ที่น่ารำคาญ"
 prelude_events.0050.desc.normal: "ผู้เป็นที่รัก"
 prelude_events.0050.desc.outro: "[ROOT.Char.Custom2('RelationToMe', SCOPE.sC('guest'))] [guest.GetFirstName] เรียกข้า "ทุกคนที่นี่ไม่สมคบคิดก็เมามาย" [guest.GetSheHe] กระซิบ "ข้าคิดถึงท่าน""
 prelude_events.0050.a: ""ข้ามิอาจรู้สึก เช่นนั้นตอบ""
 prelude_events.0050.b: ""ให้พวกเราชาว [ROOT.Char.GetHouse.GetNameNoTooltip] อยู่ด้วยกันเถิด""
 prelude_events.0050.c: ""แล้วท่านคิดเห็นอย่างไรกับเจ้าภาพของเรา ท่าน [host.GetLadyLord] [host.GetFirstNameNoTooltip]?""
 prelude_events.0050.d: ""แต่ดูท่านสิ! ได้ แต่งงานกับ [host.GetHerselfHimself] ผู้สวมมงกุฎ!""
 
 prelude_events.0060.t: "[province.GetNameNoTooltip] อันงดงาม"
 prelude_events.0060.desc: ""ข้าต้องขอกล่าวว่ามันน่าประทับใจยิ่งนักกับสิ่งที่ท่านทำสำเร็จได้ด้วย [ROOT.Char.GetCapitalLocation.Custom('TerrainTypeProvince')] เพียงหยิบมือ, ท่าน [ROOT.Char.GetLadyLord] [ROOT.Char.GetFirstNameNoTooltip]" [host.GetTitledFirstName] [host.Custom('quirk_pos_present')]\n\n"ข้าได้ยินมาว่า [ROOT.Char.GetCapitalLocation.GetNameNoTooltip] นั้นรุ่งเรืองภายใต้การชี้นำของท่าน [ROOT.Char.GetCapitalLocation.GetHolding.GetType.GetName|l] ของมันก็ถูกดูแลอย่างดีและเป็นระเบียบ แต่ข้าเห็นเงาบนใบหน้าของท่าน, [ROOT.Char.GetTitleAsNameNoTooltip|l] เอ๋ย, สิ่งใด ทำให้ท่านกังวลหรือ?""
 prelude_events.0060.a: ""เป็นความปิติ! ทั้งหมดนี้ต้องขอบคุณความช่วยเหลืออันเปี่ยมเมตตาของท่าน""
 prelude_events.0060.b: ""หากท่านพอจะแบ่งปันช่างฝีมือจากเมืองหลวงของท่านได้บ้าง...""
 prelude_events.0060.c: ""เป็นทองคำที่หยุดยั้งการเติบโตของเรา""
 prelude_events.0060.c.tt.success: "[host.GetShortUIName] ยอมรับข้อเรียกร้อง"
 prelude_events.0060.c.tt.failure: "[host.GetShortUIName] พบว่าข้อเรียกร้องนั้นน่ารังเกียจ"
 prelude_events.0060.d: ""วันนี้ไม่ใช่วันของข้า, [host.GetTitleAsNameNoTooltip]""
 bp4_advocate_domain_construction_county_modifier: "ช่างก่อสร้างหลวง"
 friend_coronation_support: "[CHARACTER.GetShortUIName|U] เสนอการสนับสนุนของ [CHARACTER.GetHerHis] ให้แก่ [TARGET_CHARACTER.GetShortUIName] ระหว่างพิธีราชาภิเษกของ [TARGET_CHARACTER.GetHerHis] และมิได้ร้องขอสิ่งใดตอบแทน"
 friend_coronation_support_corresponding: "[TARGET_CHARACTER.GetShortUIName|U] เสนอการสนับสนุนของ [TARGET_CHARACTER.GetHerHis] ให้แก่ [CHARACTER.GetShortUIName] ระหว่างพิธีราชาภิเษกของ [CHARACTER.GetHerHis] และมิได้ร้องขอสิ่งใดตอบแทน"
 friend_coronation_ambitious: "[CHARACTER.GetShortUIName|U] กล่าวสรรเสริญ [TARGET_CHARACTER.GetShortUIName] อย่างมากมายระหว่างพิธีราชาภิเษกของ [TARGET_CHARACTER.GetHerHis]"
 friend_coronation_ambitious_corresponding: "[TARGET_CHARACTER.GetShortUIName|U] กล่าวสรรเสริญ [CHARACTER.GetShortUIName] อย่างมากมายระหว่างพิธีราชาภิเษกของ [CHARACTER.GetHerHis]"
 supporter_hook: "ผู้สนับสนุน"
 bp4_advocate_domain_construction_county_modifier_desc: "เจ้าของเคาน์ตีนี้ได้สละเกียรติยศบางส่วนเพื่อแลกกับความช่วยเหลือในการก่อสร้างจากราชาที่เพิ่งได้รับการสถาปนา"
 
 prelude_events.0070.t: "ข้อเสนอแห่งราชสำนัก"
 prelude_events.0070.desc.intro: "[ROOT.Char.Custom('GetRandomRegionalWildDaytimeBird')] ตัวเล็กๆ ซ่อนตัวอยู่ท่ามกลางเท้าของแขกเหรื่อและ ทำให้บางคนหัวเราะออกมา รวมถึงเจ้าเหนือหัวของข้าและเหตุผลที่เรารวมตัวกันที่นี่, [host.GetTitledFirstName]\n\n"ท่าน [ROOT.Char.GetLadyLord|U] [ROOT.Char.GetFirstNameNoTooltip]" [host.GetSheHe] เรียกนามของข้า, ยังคงยิ้มอยู่"
 prelude_events.0070.desc.friend: ""ท่านก็รู้ว่ามิตรภาพของเรานั้นมีค่าต่อข้า และข้าไม่ปรารถนาสิ่งใดมากไปกว่าการได้ยินคำแนะนำของท่าน ข้าขอร้องท่าน, โปรดนั่งลงข้างข้า""
 prelude_events.0070.desc.diplomacy: ""ข้าได้ยินมาว่าทักษะด้านการทูตของท่านนั้นหาผู้ใดเปรียบมิได้""
 prelude_events.0070.desc.stewardship: ""ข้าสังเกตเห็นว่าท่านปกครองดินแดนของท่านอย่างมีประสิทธิภาพยิ่งนัก เป็นฝีมือของขุนคลังอย่างไม่ต้องสงสัย""
 prelude_events.0070.desc.intrigue: ""มีผู้กล่าวว่าไม่มีชู้รักคนใดปลอดภัย, ไม่มีคนบาปคนใดเป็นอิสระ, ไม่มีความลับใดถูกปิดบังอย่างแท้จริง, ตราบใดที่ท่านยังอยู่""
 prelude_events.0070.desc.learning: ""ข้าราชสำนักของข้าบอกข้าว่าไม่มีตำราโบราณใดที่ท่านอ่านไม่ออก, ไม่มีนักประพันธ์ชื่อดังคนใดที่ท่านถอดรหัสไม่ได้""
 prelude_events.0070.desc.martial: ""มีผู้บอกข้าว่ากลยุทธ์อันยอดเยี่ยมของท่านนำมา ซึ่งชัยชนะแม้ในยามที่คับขันที่สุด""
 prelude_events.0070.desc.outro: "ไม่มีสิ่งใดที่ข้าต้องการมากไปกว่า [ROOT.Char.GetWomanMan] ผู้มีความสามารถในสภาของข้าอีกแล้ว""
 prelude_events.0070.a: ""ข้าต้องมุ่งเน้นไปที่... ดินแดนของข้า""
 prelude_events.0070.a.flavor: "หรือที่ตัวข้าเอง, มากกว่า"
 prelude_events.0070.b: ""นับเป็นเกียรติของข้าที่ได้ร่วมกับท่าน""
 prelude_events.0070.c: ""ข้าไม่มีเวลาสำหรับเรื่องนี้""
 bp4_lazy_realm_focus_modifier: "สุขสบายอยู่ที่บ้าน"
 bp4_lazy_realm_focus_modifier_desc: "ตัวละครนี้ปฏิเสธข้อเสนอให้เป็นที่ปรึกษาเพื่อมุ่งเน้นไปที่ดินแดนของตนเอง... หรืออย่างน้อยพวกเขาก็กล่าว เช่นนั้น"
 
 prelude_events.0080.t: "สิ่งที่ดีที่สุดของข้า"
 prelude_events.0080.desc.intro: ""[ROOT.Char.GetTitleAsNameNoTooltip] ผู้ประเสริฐ" ข้าหันไปพบ [guest.GetTitledFirstName] อยู่ถัดจาก [courtier.GetWomanMan] ที่มีท่าทีกระวนกระวาย "ท่านก็รู้ว่าข้าชื่นชมท่านและมันจะนำความยินดียิ่งมาสู่ข้าหากได้ช่วยเหลือท่าน"\n\n"ณ ที่นี้ ข้าขอมอบ [courtier.GetWomenMen] คนแรกและดีที่สุดของข้า, [courtier.GetFirstName], [guest.Custom2('RelationToMe', SCOPE.sC('courtier'))] ผู้ประสบความสำเร็จของข้า ขอให้สิ่งนี้เป็นดั่ง"
 prelude_events.0080.desc.same_house: "เครื่องหมายแห่งมิตรภาพในตระกูลของเรา""
 prelude_events.0080.desc.fallback: "การเริ่มต้นแห่งมิตรภาพระหว่างตระกูลของเรา""
 prelude_events.0080.desc.friend: "เครื่องหมายแห่งมิตรภาพของเรา""
 prelude_events.0080.aa: ""ท่านคิดว่าข้าดูไม่ออกหรือว่าเป็นสายลับ?""
 prelude_events.0080.a: ""ข้ารู้แน่ชัดว่า [courtier.GetSheHe] ควรทำสิ่งใด""
 prelude_events.0080.b: ""[courtier.GetFirstNameNoTooltip] ยินดีต้อนรับสู่สำนักของข้า""
 prelude_events.0080.c: ""มีเพียงไม่กี่คนที่ใจกว้าง เช่นท่าน, [guest.GetTitleAsNameNoTooltip]""
 friend_coronation_offered_courtier: "[TARGET_CHARACTER.GetShortUIName|U] ได้เสนอบริวารผู้มีทักษะให้แก่ [CHARACTER.GetShortUIName] อย่างไม่เห็นแก่ตัวระหว่างพิธีราชาภิเษก"
 friend_coronation_offered_courtier_corresponding: "[CHARACTER.GetShortUIName|U] ได้เสนอบริวารผู้มีทักษะให้แก่ [TARGET_CHARACTER.GetShortUIName] อย่างไม่เห็นแก่ตัวระหว่างพิธีราชาภิเษก"
 rival_rejected_courtier_paranoid: "[CHARACTER.GetShortUIName|U] ปฏิเสธบริวารของ [TARGET_CHARACTER.GetShortUINamePossessive] และกล่าวหาพวกเขาว่าเป็นสายลับ"
 rival_rejected_courtier_paranoid_corresponding: "[TARGET_CHARACTER.GetShortUIName|U] ปฏิเสธบริวารของ [CHARACTER.GetShortUINamePossessive] และกล่าวหาพวกเขาว่าเป็นสายลับ"
 bp4_paranoid_measures_modifier: "มาตรการหวาดระแวง"
 bp4_paranoid_measures_modifier_desc: "ตัวละครนี้ได้เพิ่มความระมัดระวังหลังจากได้รับข้อเสนอบริวารที่น่าสงสัย"
 
 prelude_events.0090.t: "คู่ควรสำหรับ [ROOT.Char.GetTitleAsNameNoTooltip]"
 prelude_events.0090.desc.intro: ""ใจเย็นๆ!" ข้าได้ยินเสียงของ [guest.GetWomanMan] และหันไปพบ [guest.GetTitledFirstName] กำลังตบเบาๆ ที่ข้างลำตัวม้าของ [guest.GetHerHis]\n\n"
 prelude_events.0090.desc.blood_brother: "สหายที่ข้าไม่เคยมี เช่นนี้มาก่อน ข้าแทบจะกลั้นยิ้มไว้ไม่อยู่เมื่อ [guest.GetSheHe] อ้าแขนของ [guest.GetHerHis]"
 prelude_events.0090.desc.bad_opinion: "[guest.Custom('InsultNoun')] [guest.Custom('InsultAdjective')] ผู้นี้หาทางของ[guest.GetHerHis]มายังพิธีราชาภิเษกของข้าจนได้ ข้าแทบจะกลั้นหน้าบึ้งไว้ไม่อยู่ขณะที่ [guest.GetSheHe] เข้ามาใกล้ข้า"
 prelude_events.0090.desc.fallback: "[guest.GetTitledFirstName] [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('guest'))] ของข้าเข้ามาใกล้ข้าด้วยรอยยิ้มกว้าง"
 prelude_events.0090.desc.outro: "\n\n"ท่านว่าอย่างไร?" [guest.GetSheHe] ชี้ไปทางฝูงแกะที่อยู่ด้านหลัง [guest.GetHerHim] "ของขวัญที่คู่ควรเพียงพอหรือไม่?""
 prelude_events.0090.aa: ""[guest.Custom('SisterBrother')] ของข้า! ให้เราเฉลิมฉลองด้วยกันเถิด!""
 prelude_events.0090.a: ""ท่านนำพวกมันกลับไปที่ [guest.GetCapitalLocation.GetNameNoTooltip] ได้เลย""
 prelude_events.0090.b: ""เป็นของขวัญที่ #EMP ยอดเยี่ยม#!""
 prelude_events.0090.c: ""ได้โปรด, เก็บพวกมันไว้เถิด! การมาของท่านก็เป็นของขวัญที่เพียงพอแล้ว""
 friend_nomadic_guest_coronation_herd: "[TARGET_CHARACTER.GetShortUIName|U] ได้เสนอปศุสัตว์บางส่วนให้แก่ [CHARACTER.GetShortUIName] ระหว่างพิธีราชาภิเษกของ [CHARACTER.GetHerHis]"
 friend_nomadic_guest_coronation_herd_corresponding: "[CHARACTER.GetShortUIName|U] ได้เสนอปศุสัตว์บางส่วนให้แก่ [TARGET_CHARACTER.GetShortUIName] ระหว่างพิธีราชาภิเษกของ [TARGET_CHARACTER.GetHerHis]"
 
 prelude_events.0100.t: "สิ่งปลูกสร้างอันมีความหวัง"
 prelude_events.0100.desc: ""[ROOT.Char.GetTitleAsNameNoTooltip] ประเภทใดกันที่จะปล่อยให้ดินแดนของข้าหลวงร่วงโรยและเน่าเปื่อย? ผู้คนต่างพูดกันนะพ่ะย่ะค่ะ ท่าน [ROOT.Char.GetLadyLord] ของข้า" [vassal.GetTitledFirstName] [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('vassal'))] ของข้าเตือนอย่างจริงจัง, [vassal.Custom('quirk_pos_pp')]\n\n"ข้าขอวิงวอนให้ท่านมองเข้ามาภายใน และจดจำไว้ว่าชื่อเสียงของอาณาจักรก็คือชื่อเสียงของแว่นแคว้น""
 prelude_events.0100.a: ""ข้าสัญญาว่าจะไม่ลืมเรื่องนี้""
 prelude_events.0100.b: ""จง ทำให้ดินแดนของท่านรุ่งเรืองเถิด, [vassal.GetTitledFirstNameNoTooltip]""
 prelude_events.0100.c: ""บางทีข้าควรจะมุ่งเน้นไปที่การศึกษาเทคนิค...""
 coronation_vassal_building_tt: "เนื่องจาก [GetModifier('coronation_vassal_building_modifier').GetName] ของท่าน"
 coronation_vassal_building_modifier: "คำมั่นสัญญาด้านการก่อสร้าง"
 coronation_vassal_building_modifier_desc: "ตัวละครนี้จะได้รับ [prestige_i][prestige|E] ทุกครั้งที่พวกเขาก่อสร้างสิ่งปลูกสร้างในดินแดนของข้าหลวงของพวกเขา"
 friend_coronation_paid_for_building: "[CHARACTER.GetShortUIName] ได้ช่วยเหลือความพยายามในการก่อสร้างของ [TARGET_CHARACTER.GetShortUINamePossessive] ด้วยทองคำบางส่วน"
 friend_coronation_paid_for_building_corresponding: "[TARGET_CHARACTER.GetShortUIName] ได้ช่วยเหลือความพยายามในการก่อสร้างของ [CHARACTER.GetShortUINamePossessive] ด้วยทองคำบางส่วน"
 
 prelude_events.0110.t: "ไม่เคยได้ยิน"
 prelude_events.0110.desc: "ข้าสังเกตเห็น [guest.GetTitledFirstName] ชำเลืองมองมาทางข้าเป็นระยะ [guest.GetSheHe|U] [guest.Custom('quirk_pos_present')] และในที่สุดก็เข้ามาใกล้ข้า [guest.GetSheHe] โค้งคำนับอย่างเคารพแล้วเริ่มว่า:\n\n"[ROOT.Char.GetTitleAsNameNoTooltip] ที่รัก, พวกเรา [guest_culture.GetCollectiveNounNoTooltip] ปรารถนาที่จะสนับสนุนท่านในบัดนี้และในวันข้างหน้า ในไม่ช้ามงกุฎจะอยู่บนศีรษะของท่าน แต่ขนบธรรมเนียมของพวกเราจะอยู่ในใจของท่านหรือไม่?""
 prelude_events.0110.a: ""ข้าจะพูดภาษาของหัวใจท่าน""
 prelude_events.0110.b: "ทุกคนต้องรู้ถึงความรักที่ข้ามีต่อชาว [guest_culture.GetCollectiveNounNoTooltip]"
 prelude_events.0110.c: "พิธีราชาภิเษกนี้เรียกร้องความสนใจในเรื่องอื่น"
 cultural_acceptance_gain_coronation_impress_attendees: "การกล่าวถ้อยคำบางอย่างในพิธีราชาภิเษกได้เปลี่ยนการยอมรับทางวัฒนธรรม"
 friend_coronation_learn_language: "[CHARACTER.GetShortUIName|U] แสดงความสนใจในการเรียนรู้ภาษาของ [TARGET_CHARACTER.GetShortUINamePossessive] ในพิธีราชาภิเษกของ [CHARACTER.GetHerHis]"
 friend_coronation_learn_language_corresponding: "[TARGET_CHARACTER.GetShortUIName|U] แสดงความสนใจในการเรียนรู้ภาษาของ [CHARACTER.GetShortUINamePossessive] ในพิธีราชาภิเษกของ [TARGET_CHARACTER.GetHerHis]"
 
 prelude_events.0120.t: "ระลึกถึงสหายของท่าน"
 prelude_events.0120.desc: ""มันคงไม่ง่ายนัก" [guest.GetTitledFirstName] เอ่ยขึ้น, [guest.Custom('quirk_pos_pp')] "ข้าได้ แต่จินตนาการถึงน้ำหนักของมงกุฎที่จะอยู่บนศีรษะของท่านในไม่ช้า"\n\n"แต่อย่ากังวลไปเลย เหล่าข้าหลวงผู้ภักดีของท่านจะยืนหยัดเคียงข้างท่าน, บัดนี้, และตลอดไป นี่, รับสิ่งนี้ไปสิ" [guest.GetSheHe|U] ชี้ไปที่คนรับใช้คนหนึ่งของ [guest.GetHerHis] ซึ่งโค้งคำนับเพื่อมอบของขวัญที่ห่อไว้อย่างดี "[guest_artifact.GetName]" [guest.GetFirstNameNoTooltip] อธิบาย "มันรับใช้ข้ามาอย่างดี""
 prelude_events.0120.aa: ""ข้าจะตอบแทนด้วยท่าทีเดียวกัน""
 prelude_events.0120.a: ""ความรักของข้ามีค่าเพียงเท่านั้นหรือ?""
 prelude_events.0120.b: ""ขอบคุณสำหรับความเมตตาของท่าน, [guest.GetTitleAsNameNoTooltip]""
 prelude_events.0120.c: "ให้ทุกคนได้เห็นความเจิดจรัสของมัน!"
 coronation_gift_artifact_desc: "[guest_artifact.GetDesc]\n\nของขวัญอันลึกซึ้งจาก [guest.GetShortUINamePossessive] สำหรับพิธีราชาภิเษก"
 coronation_gift_artifact_host_desc: "[my_artifact.GetDesc]\n\nมอบให้เป็นส่วนหนึ่งของการแลกเปลี่ยนของขวัญระหว่างพิธีราชาภิเษก"
 friend_coronation_gift_exchange: "[CHARACTER.GetShortUIName|U] และ [TARGET_CHARACTER.GetShortUIName] ได้มีส่วนร่วมในการแลกเปลี่ยนของขวัญในพิธีราชาภิเษกของ [CHARACTER.GetShortUINamePossessive]"
 friend_coronation_gift_exchange_corresponding: "[TARGET_CHARACTER.GetShortUIName|U] และ [CHARACTER.GetShortUIName] ได้มีส่วนร่วมในการแลกเปลี่ยนของขวัญในพิธีราชาภิเษกของ [TARGET_CHARACTER.GetShortUINamePossessive]"
 
 prelude_events.0130.t: "ความสง่างามแก่ทรัพย์สินของท่าน"
 prelude_events.0130.desc: ""ขอ [coronator.GetFaith.HighGodName] ประทานพรแก่ท่านในวันอันเป็นมงคลนี้, [ROOT.Char.GetTitledFirstNameNoTooltip]" [coronator.GetTitledFirstName] ก้มศีรษะของ [coronator.GetHerHis], [coronator.Custom('quirk_pos_pp')]\n\n"ข้าใคร่ขอระลึกถึงวาระนี้ด้วยการอวยพรแก่ [my_artifact.GetName] อันเป็นที่รักยิ่งของท่าน""
 prelude_events.0130.a: "ขอ [coronator.GetFaith.HighGodName] คุ้มครองมัน"
 prelude_events.0130.a.tt: "[my_artifact.GetName]:\n$BULLET_WITH_TAB$ได้รับ [piety_i|E]#positive_value +10%#! [piety|E] ต่อเดือน\n$BULLET_WITH_TAB$ได้รับ #positive_value +10#! [opinion|E] จาก [clergy|E]"
 prelude_events.0130.b: "ขอให้มันเป็นเครื่องเตือนใจถึงพิธีราชาภิเษก"
 prelude_events.0130.b.tt: "[my_artifact.GetName]:\n$BULLET_WITH_TAB$ได้รับ [prestige_i|E]#positive_value +8%#! [prestige|E] ต่อเดือน"
 prelude_events.0130.c: ""แขกของข้าคงอยากจะเห็นมัน""
 prelude_events_0130_cynical_tt: "เนื่องจาก[trait|E] [GetTrait('cynical').GetName( GetNullCharacter )] #high ของท่าน#! [coronation_magnificence|E] ของ [GetActivityType('activity_coronation').GetName] จึง #P เพิ่มขึ้นอย่างมาก #!"
 coronation_blessed_artifact_desc: "[my_artifact.GetDesc]\n\nมันดูเหมือนจะส่องแสงระยิบระยับ เป็นเครื่องเตือนใจถึงพรที่ได้รับระหว่างพิธีราชาภิเษกของ [artifact_owner.GetTitledFirstNamePossessive]"
 
 prelude_events.0140.t: "ในแสงสว่างอันรุ่งโรจน์ของท่าน"
 prelude_events.0140.desc: "[host.GetTitledFirstName] ใช้เวลาสักครู่เพื่อสังเกตฝูงชน, [host.Custom('quirk_pos_pp')] เสียงของเหล่าข้าราชสำนักกลายเป็นสิ่งที่ไม่ขาดสาย เช่นเดียวกับเสียงนกร้อง และข้าไม่สงสัยเลยว่า [guest.GetTitledFirstName] ตั้งใจที่จะเข้าร่วมกับพวกเขา\n\n"[ROOT.Char.GetTitleAsNameNoTooltip] ผู้ประเสริฐ!" [guest.GetSheHe|U] เอ่ยขึ้น พลางเลื่อนเข้ามาหาข้า "ข้าขออาจหาญถามความคิดเห็นของท่านเกี่ยวกับการเฉลิมฉลองนี้ได้หรือไม่? ข้าไม่สงสัยเลยว่าการปกครองของ [host.GetTitledFirstNamePossessiveNoTooltip] จะเป็นการปกครองที่เปี่ยมด้วยความรักและความยุติธรรม""
 prelude_events.0140.a: "#EMP มิต้องเอ่ยสิ่งใด#!"
 prelude_events.0140.b: ""พวกเขาจะเรียกเราว่าโชคดีที่ได้มาอยู่ที่นี่!""
 prelude_events.0140.b.offer_support_tt: "เนื่องจาก [intent|E] #high $coronation_offer_support$#! ของท่าน [coronation_magnificence|E] ของ [GetActivityType('activity_coronation').GetName] จึง #P เพิ่มขึ้นอย่างเห็นได้ชัด#!"
 prelude_events.0140.c: ""ขอให้ [host.GetSheHe] ทรงพระเจริญ!""
 
 prelude_events.0150.t: "ท่านรู้จัก [guest.GetHerHim|U] หรือไม่?"
 prelude_events.0150.desc: ""[ROOT.Char.GetTitledFirstNameNoTooltip]" [host.GetTitledFirstName] เรียกหาข้าด้วยรอยยิ้มกว้าง ถัดจาก [host.GetHerHim] มีแขกอีกคนยืนอยู่, [guest.GetTitleAsNameNoTooltip|l] ที่ข้าไม่คุ้นเคย\n\n"นี่คือ [guest.GetTitledFirstName]" [host.GetTitledFirstNameNoTooltip] แนะนำ [guest.GetHerHim] "ข้าเชื่อว่าท่านทั้งสองจะมีเรื่องที่สนใจร่วมกันมากมาย [guest.Custom('MatchingConversationSubject_alone')|U] ก็น่าจะดี""
 prelude_events.0150.aa: ""เป็นเกียรติของข้าที่จะได้พา [guest.GetHerHim] เดินชมบริเวณ""
