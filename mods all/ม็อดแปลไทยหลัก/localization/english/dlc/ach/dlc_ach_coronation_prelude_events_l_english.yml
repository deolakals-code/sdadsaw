 prelude_events.0180.t: "ช่วงเวลาอันเงียบสงบ"
 prelude_events.0180.desc.host: "ข้าละแขกเหรื่อไว้เบื้องหลังและเข้าสู่ [ROOT.Char.GetCurrentLocation.GetCounty.GetFaith.HouseOfWorship] เพื่อแสวงหาช่วงเวลาอันเงียบสงบก่อนที่น้ำหนักของมงกุฎจะมาถึงตัวข้า\n\n"
 prelude_events.0180.desc.outro: "แท่นบูชาแด่ [ROOT.Char.GetFaith.HighGodName] ส่องแสงริบหรี่ สว่างไสวด้วยแสงเทียนนับสิบเล่ม ความเงียบอันหอมกรุ่นอบอวลไปทั่วผนังอันเย็นเยียบ ทางขวาของข้า ภาพจิตรกรรมฝาผนังของ [ROOT.Char.GetFaith.WealthGodName] มอบสายตาอันเข้มงวดให้แก่ข้า ทางซ้าย สารสีที่เคยเป็น [ROOT.Char.GetFaith.HealthGodName] กำลังเลือนรางอย่างช้าๆ รอยยิ้มของ [ROOT.Char.GetFaith.HealthGodHerHis] แทบจะมองไม่เห็น"
 prelude_events.0180.desc.guest: "ในที่สุดข้าก็หลบจากแขกคนอื่นๆ และเข้าสู่ [ROOT.Province.GetCounty.GetFaith.HouseOfWorship] เพื่อแสวงหาช่วงเวลาอันเงียบสงบ\n\n"
