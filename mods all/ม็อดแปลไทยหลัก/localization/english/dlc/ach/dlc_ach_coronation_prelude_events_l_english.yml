 prelude_events.0190.desc.intro: "เปลวเพลิงในเตาผิงเริงระบำราวกับ [ROOT.Char.Custom('GetMedievalDance')] ประตูห้องของข้าเปิดผางออกและข้าได้ยินเสียงคุ้นเคยเรียกนามของข้า\n\n"
 prelude_events.0190.desc.spouse: ""[ROOT.Char.Custom('WifeHusband')] ที่รักของข้า" น้ำเสียงของ [councillor.GetFirstNamePossessive] อ่อนโยนและสงบ"
 prelude_events.0190.desc.other: ""[ROOT.Char.GetTitledFirstNameNoTooltip]" [councillor.GetFirstName] [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('councillor'))] ของข้าเอ่ยขึ้น"
 prelude_events.0190.desc.outro: ""ข้ารู้ว่าวันนั้นใกล้เข้ามาแล้ว วันที่ท่านจะมองภาพสะท้อนของตนบนโลหะอันเย็นเยียบและสงสัยว่าท่านกำลังทำในสิ่งที่ถูกต้องหรือไม่ ขอให้รับรู้ไว้ ขอให้เสียงโห่ร้องจากทุกมุมของป้อมปราการนี้รับรู้ไว้ ข้าจะยืนหยัดเคียงข้างท่าน"\n\n[councillor.GetSheHe|U] หยิบของขวัญชิ้นเล็กๆ ออกมาจากถุงของ [councillor.GetHerHis] "ข้าได้สั่งทำสิ่งนี้มาเพื่อท่าน""
 prelude_events.0190.a: ""นี่มันมากกว่าที่ข้าจะร้องขอได้""
