 coronation_faction_bolstered_modifier_desc: "หลังจากหว่านเมล็ดพันธุ์แห่งความแตกแยกในพิธีสวมมงกุฎของเจ้าเหนือหัว ตัวละครนี้ก็มีเหล่านักรบที่ไม่พอใจแห่มารวมตัวกันภายใต้ธงของตน"
