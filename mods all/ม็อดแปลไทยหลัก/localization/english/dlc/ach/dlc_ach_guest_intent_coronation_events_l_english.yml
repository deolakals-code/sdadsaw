l_english: 
 guest_intent_coronation_events.0001.t: "ในฐานะสักขีพยาน"
 guest_intent_coronation_events.0001.desc.collective: ""[host.GetSheHe] อยู่ั่นั่น" [guest.GetTitledFirstName] ชี้ไปยังเจ้าภาพของเรา [host.GetTitledFirstName] ผู้ยืนอยู่อย่างเดียวดาย ในที่สุด\n\n"นี่คือโอกาสของเรา" [guest.GetFirstNameNoTooltip] ยืนกราน "พวกเรามาที่นี่เพื่อเป็นสักขีพยานและสนับสนุนพิธีสวมมงกุฎของ [host.GetHerHis] มันก็ยุติธรรมดีแล้วที่เราควรจะได้รับสิ่งใดตอบแทนบ้าง""
 guest_intent_coronation_events.0001.desc.alone: "ข้าพบเจ้าภาพของเรา [host.GetTitledFirstName] ยืนอยู่เพียงลำพังที่ลานปราสาท ในที่สุด ข้าก็มีโอกาสที่จะแจ้งเจตจำนงของข้าให้ทราบ\n\nในฐานะสักขีพยานในพิธีสวมมงกุฎของ [host.GetHerHis] มันก็ยุติธรรมดีแล้วที่ข้าควรจะได้รับสิ่งใดตอบแทนบ้าง"
 guest_intent_coronation_events.0001.a: "ขอให้เราเป็นแบบอย่างแห่งสันติภาพแก่ปวงชนของเราเถิด"
 guest_intent_coronation_events.0001.b: "และเรากระทำการนี้ต่อหน้าองค์ [ROOT.Char.GetFaith.HighGodName]"
 guest_intent_coronation_events.0001.c: "ทุกคนจะได้เห็นว่าเรายืนหยัดเคียงข้าง [host.GetTitleAsNameNoTooltip]"
 cultural_acceptance_coronation_bear_witness: "การยอมรับทางวัฒนธรรมเพิ่มขึ้นจากการเป็นสักขีพยานในพิธีสวมมงกุฎและเสนอการสนับสนุน"
 
 guest_intent_coronation_events.0010.t: "การเสนอการสนับสนุน"
 guest_intent_coronation_events.0010.desc.collective: ""[host.GetTitledFirstName] ผู้ [host.Custom('ComplimentAdjective')] ของเรา ถูกปล่อยให้อยู่ตามลำพังในที่สุด" [guest.GetTitledFirstName] [ROOT.Char.Custom2('RelationToMeShort',SCOPE.sC('guest'))] ของข้า ตั้งข้อสังเกต [guest.Custom('quirk_pos_pp')] "นี่คือโอกาสที่เหล่าผู้สนับสนุน เช่นเราจะได้แสดงความภักดี"\n\n"ไปเถิด [ROOT.Char.GetFirstNameNoTooltip] เราจะเสียโอกาสนี้ไปมิได้""
 guest_intent_coronation_events.0010.desc.alone: "ท้ายที่สุด [host.GetTitledFirstName] ผู้[host.Custom('ComplimentAdjective')]ของเราก็ถูกปล่อยให้อยู่ตามลำพัง ข้าเริ่มก้าวเดินอย่างช้าๆ ไปหา[host.GetHerHim]พร้อมด้วยรอยยิ้มบนใบหน้า\n\nข้าจะปล่อยให้โอกาสในการแสดงความจงรักภักดีหลุดลอยไปมิได้เป็นอันขาด"
 guest_intent_coronation_events.0010.a: "[host.GetTitledFirstNameNoTooltip] จะไม่ลืมผู้สนับสนุนของ [host.GetHerHis]"
 guest_intent_coronation_events.0010.b: "หรือข้าควรจะกระชับสัมพันธ์กับ [host.GetTitleAsNameNoTooltip]..."
 guest_intent_coronation_events.0010.c: "การเป็นพันธมิตรน่าจะเป็นทางเลือกที่ได้เปรียบที่สุด"
 friend_coronation_offer_support: "[CHARACTER.GetShortUIName|U] ได้สนับสนุน [TARGET_CHARACTER.GetShortUIName] ระหว่างพิธีสวมมงกุฎของ [TARGET_CHARACTER.GetHerHis]"
 friend_coronation_offer_support_corresponding: "[TARGET_CHARACTER.GetShortUIName|U] ได้สนับสนุน [CHARACTER.GetShortUIName] ระหว่างพิธีสวมมงกุฎ"
 create_alliance_host_tt: "ท่านและ [petition_sender.GetShortUIName] ก่อตั้ง [alliance|E]"
 create_alliance_guest_tt: "ท่านและ [host.GetShortUIName] ก่อตั้ง [alliance|E]"
 
 guest_intent_coronation_events.0020.t: "การสนับสนุนดินแดน"
 guest_intent_coronation_events.0020.desc.collective: "ข้าพบว่าตนเองกำลังจมอยู่กับบทสนทนาเรื่อง [guest.Custom('MatchingConversationSubject_alone')] ซึ่ง [guest.GetTitledFirstName] ไม่ยอมให้จบลงง่าย ๆ\n\n"แต่เดี๋ยวก่อน!" [guest.GetSheHe] หยุดกะทันหัน "ดูเหมือนว่า [host.GetLadyLord] [host.GetTitleAsNameNoTooltip] ของเรา กำลังมุ่งหน้าไปยังห้องบรรทมของ [host.GetHerHis] ด้วย เช่นกัน นี่คือโอกาสของเรา [ROOT.Char.GetFirstName] ขอให้เรามา ทำให้ [ROOT.Char.GetPrimaryTitle.GetNameNoTierNoTooltip] และ [guest.GetPrimaryTitle.GetNameNoTier] รุ่งเรืองเถิด""
 guest_intent_coronation_events.0020.desc.alone: "ข้าพบว่าตนเองมิงอาจหยุดคิดเรื่อง [ROOT.Char.Custom('MatchingConversationSubject_alone')] ได้ ขณะที่ข้ากำลังเดินทางกลับไปยังห้องพักของข้า แต่ในไม่ช้า ข้าก็ตระหนักได้ว่าข้ามิได้อยู่ตามลำพังในโถงทางเดินเหล่านี้\n\n[host.GetTitledFirstName] ดูเหมือนจะมุ่งหน้าไปในทิศทางเดียวกัน นี่อาจเป็นโอกาสของข้าที่จะ ทำให้แน่ใจว่า [ROOT.Char.GetPrimaryTitle.GetNameNoTier] ได้รับความช่วยเหลือที่สมควรได้รับ"
 guest_intent_coronation_events.0020.a: "เราต้องทุ่มเทความพยายามในการพัฒนาเมืองของเรา"
 guest_intent_coronation_events.0020.b: "หากปราศจากการควบคุม ก็มิอาจมีการปกครอง"
 guest_intent_coronation_events.0020.c: "ความไว้วางใจของประชาชนคือสิ่งสำคัญที่สุด"
 guest_intent_coronation_events_advocate_domain_development_tt: "[character|E] ที่เข้าร่วมคนอื่น ๆ ทุกคนที่ม [intent|E] #high สนับสนุนดินแดน#! จะเพิ่ม [development_growth|E] ใน [counties|E] ที่ตนถือครอง #P [EmptyScope.ScriptValue('major_development_progress_gain')|0]#!"
 guest_intent_coronation_events_advocate_domain_control_tt: "[character|E] ที่เข้าร่วมคนอื่น ๆ ทุกคนที่ม [intent|E] #high สนับสนุนดินแดน#! จะเพิ่ม [control|E] ใน [counties|E] ที่ตนถือครอง #P +[EmptyScope.ScriptValue('major_county_control_gain')|0]#!"
 guest_intent_coronation_events_advocate_domain_county_opinion_tt: "[character|E] ที่เข้าร่วมคนอื่น ๆ ทุกคนที่ม [intent|E] #high สนับสนุนดินแดน#! จะได้รับ [GetModifier('coronation_advocate_domain_county_opinion_modifier').GetNameWithTooltip] ใน [counties|E] ที่ตนถือครอง เป็นเวลา #V 10#! ปี"
 coronation_advocate_domain_county_opinion_modifier: "ดินแดนที่ได้รับการสนับสนุน"
 coronation_advocate_domain_county_opinion_modifier_desc: "ตัวละครนี้ได้สนับสนุนดินแดนของตนและความเป็นอยู่ที่ดีของประชาชนในพิธีสวมมงกุฎ"
 
 guest_intent_coronation_events.0030.t: "นี่คือสิทธิ์ของข้า"
 guest_intent_coronation_events.0030.desc.collective: ""...มาดูกันว่าเจ้าจะออกจากสถานการณ์นี้ได้อย่างไร" [guest.GetTitledFirstName] ประกาศอย่างภาคภูมิใจ พลางเลื่อนตัวหมากของ [guest.GetHerHis] เข้าหาตัวหมากของข้า ข้าเตรียมคำตอบ แต่ประตูห้องกลับเปิดผางออกอย่างกะทันหัน\n\nที่ธรณีประตู [host.GetTitledFirstName] ดูประหลาดใจไม่แพ้พวกเรา พวกเรารีบลุกขึ้นทันที แต่ [host.GetSheHe] ก็ส่งสัญญาณให้เรานั่งลงอีกครั้ง "ขออภัย" [host.GetSheHe] พึมพำ "มีเรื่องให้ครุ่นคิดมากมาย"\n\n[guest.GetTitledFirstNameNoTooltip] เลิกคิ้ว นี่อาจเป็นโอกาสของเราที่จะได้ทูลเจ้าเหนือหัวของเรา"
 guest_intent_coronation_events.0030.desc.alone: "ข้ากำลังจมอยู่ในภวังค์ความคิด เมื่อประตูห้องเปิดผางออกอย่างกะทันหัน\n\nที่ธรณีประตู [host.GetTitledFirstName] ดูประหลาดใจไม่แพ้ข้า ข้ารีบลุกขึ้นทันที แต่ [host.GetSheHe] ก็ส่งสัญญาณให้ข้านั่งลงอีกครั้ง "ขออภัย" [host.GetSheHe] พึมพำ "มีเรื่องให้ครุ่นคิดมากมาย"\n\nนี่อาจเป็นโอกาสเดียวของข้าที่จะได้ทูลเจ้าเหนือหัวของข้าอย่างอิสระ"
 guest_intent_coronation_events.0030.a: "การถวายคำแนะนำที่ดีอาจ ทำให้เราได้รับความโปรดปราน"
 guest_intent_coronation_events.0030.b: "เราต้องโต้แย้งเพื่อขอลดการเกณฑ์ไพร่พลของเรา"
 guest_intent_coronation_events.0030.c: "ต้อง ทำให้ [host.GetSheHe|U] ตระหนักว่าภาษีที่เราจ่ายนั้นขูดรีดเพียงใด"
 
 guest_intent_coronation_events.0040.t: "ฉวยโอกาส"
 guest_intent_coronation_events.0040.desc.intro: "แขกเหรื่อทั้งหลายดูเหมือนจะสนใจอยู่กับการแสดงของนักแสดง juggling, อาหาร, เครื่องดื่ม และการปรากฏตัวของแขกคนอื่น ๆ ในที่สุด [host.GetTitledFirstName] ก็ดูเหมือนจะได้เพลิดเพลินกับช่วงเวลาตามลำพัง\n\n"
 guest_intent_coronation_events.0040.desc.collective: ""เราต้องคุยกับ [host.GetHerHim] เดี๋ยวนี้" [guest.GetTitledFirstName] พึมพำอยู่หลังถ้วยของ [guest.GetHerHis] "เรามาที่นี่เพื่อ [host.GetHerHim] มันก็ยุติธรรมดีแล้วที่เราควรจะได้อะไรจากมันบ้าง""
 guest_intent_coronation_events.0040.desc.alone: "ข้าต้องคุยกับ [host.GetHerHim] ทันที อย่างไรเสียข้าก็มาที่นี่เพื่อ [host.GetHerHim] มันก็ยุติธรรมดีแล้วที่ข้าควรจะได้อะไรจากมันบ้าง"
 guest_intent_coronation_events.0040.a: "ทองคำคือสกุลเงินเดียวที่มีค่า"
 guest_intent_coronation_events.0040.b: "เกียรติภูมิย่อมให้ผลตอบแทนเสมอ"
 guest_intent_coronation_events.0040.c: "เราต้องโน้มน้าวให้ [host.GetHerHim] ผ่อนคลายการควบคุมพรมแดน"
 guest_intent_coronation_events.0040.c.flavor: "พวกเขากล่าวว่า จงรักแผ่นดินของเพื่อนบ้านเจ้า..."
 
 guest_intent_coronation_events.0050.t: "การก่อกวน"
 guest_intent_coronation_events.0050.desc.collective: ""ความมืดมิดของค่ำคืนนี้สะท้อนความมืดมนในรัชสมัยของ [host.GetHerHis]" [guest.GetTitledFirstName] พึมพำ ขณะที่ [host.GetTitledFirstName] เดินผ่านพวกเราไป\n\n"บัดนี้ [ROOT.Char.GetFirstNameNoTooltip] ถึงเวลาที่เราจะสาดแสงสว่างไปทั่วอาณาจักรที่ชั่วร้ายนี้เสียที""
 guest_intent_coronation_events.0050.desc.alone: "ความมืดมิดของค่ำคืนนี้สะท้อนความมืดมนในรัชสมัยของ [host.GetTitledFirstNamePossessive] ข้ามองเห็น [host.GetHerHim] อยู่ไกล ๆ กำลังเดินทางบนเส้นทางของ[host.GetHerHis]กลับไปยังห้องบรรทม\n\nนี่คือโอกาสของข้า ในที่สุดข้าก็สามารถสาดแสงสว่างไปทั่วอาณาจักรที่ชั่วร้ายนี้ได้เสียที"
 guest_intent_coronation_events.0050.aa: "บัดนี้ นี่คือพิธีสวมมงกุฎของ [claimant_scope.GetTitledFirstNamePossessiveNoTooltip]"
 guest_intent_coronation_events.0050.a: "[host.GetSheHe|U] ต้องได้เห็นว่าเรามีความสามารถเพียงใด"
 guest_intent_coronation_events.0050.b: "ข้าควรเพ่งเล็งไปที่การชักจูงแขกคนอื่น ๆ"
 guest_intent_coronation_events.0050.c: "ถึงเวลาสร้างความอัปยศแก่เจ้าภาพของเราแล้ว"
 guest_intent_coronation_events.0050.d: "ข้าจะไม่ต่อต้าน [host.GetFirstNameNoTooltip] อย่างเปิดเผย"
 guest_intent_coronation_events.0050.d_tt: "[ruler|E] อีกคนที่มี [intent|E] [THIS.Char.GetInvolvedActivityIntent.GetName] จะคุกคาม [host.GetShortUIName] ด้วยการ #N ลด#! [coronation_magnificence|E]"
 guest_intent_coronation_events.0050.d_tt_acceptance: "#alert_trial @alert_icon! [host.GetShortUIName] มีแนวโน้มที่จะยอมอ่อนข้อน้อยลง#!"
 guest_intent_coronation_events.0050.e: "$guest_intent_coronation_events.0050.d$"
 guest_intent_coronation_events.0050.e_tt: "#alert_trial @alert_icon! ท่านจะไม่มีโอกาสก่อกวน [host.GetShortUIName] อีก#!"
 guest_intent_coronation_events.0100.t: "ผู้ยื่นคำร้อง"
 guest_intent_coronation_events.0100.desc.intro: ""ขอเวลาสักครู่, หากท่านจะกรุณา..." [petition_sender.GetTitledFirstName] ทักทายข้า, พร้อมโค้งคำนับอย่างนอบน้อม"
 guest_intent_coronation_events.0100.desc.intro_2: ""[ROOT.Char.GetTitledFirstNameNoTooltip]!" [petition_sender.GetTitledFirstName] เดินเข้ามาหาข้าพร้อมอ้าแขนต้อนรับ"
 guest_intent_coronation_events.0100.desc.intro_3: ""ในที่สุด [ROOT.Char.GetTitledFirstName]" [petition_sender.GetTitledFirstName] ก้มโค้งคำนับอย่างเกินจริง"
 guest_intent_coronation_events.0100.desc.intro_4: ""[ROOT.Char.GetTitleAsNameNoTooltip] ผู้เป็นที่รัก" [petition_sender.GetTitledFirstName] ทักทายข้าด้วยการโค้งคำนับอย่างประจบสอพลอและรอยยิ้มที่น่าฉงน"
 guest_intent_coronation_events.0100.desc.intro_5: ""ท่านอยู่นี่เอง [ROOT.Char.GetTitledFirstNameNoTooltip]!" [petition_sender.GetTitledFirstName] เดินมาหาข้าด้วยรอยยิ้มกว้างที่สุดก่อนจะโค้งคำนับอย่างที่ซักซ้อมมาไม่ดีนัก"
 guest_intent_coronation_events.0100.desc.intro_6: ""ขออภัยในความอาจหาญของข้า" [petition_sender.GetTitledFirstName] โค้งคำนับต่ำมากจนดูเหมือน [petition_sender.GetSheHe] กำลังจะหักเป็นสองท่อน"
 guest_intent_coronation_events.0100.desc.intro_7: ""โอ ท่าน [ROOT.Char.GetTitleAsNameNoTooltip] ผู้ประเสริฐ" [petition_sender.GetTitledFirstName] โค้งคำนับต่อหน้าข้า เสื้อผ้าของ [petition_sender.GetHerHis] จัดไว้อย่างเรียบร้อย"
 guest_intent_coronation_events.0100.desc.intro_8: "ท่าน [ROOT.Char.GetTitleAsNameNoTooltip] ผู้ประเสริฐ!" [petition_sender.GetTitledFirstName] แทบจะตะโกนยศของข้าขณะที่ [petition_sender.GetSheHe] โค้งคำนับต่อหน้าข้า"
 guest_intent_coronation_events.0100.desc.intro_9: ""ในที่สุด ข้าก็ได้พบท่านตามลำพัง [ROOT.Char.GetTitledFirstNameNoTooltip]" [petition_sender.GetTitledFirstName] ทักทายข้าด้วยการโค้งคำนับที่ซักซ้อมมาอย่างดี"
 guest_intent_coronation_events.0100.desc.disrupt_loyalists: "รอยยิ้มเยาะจาง ๆ บนใบหน้าของ [petition_sender.GetHerHis] ทำให้ข้าสงสัยในเจตนาอันซื่อสัตย์ของ [petition_sender.GetHerHis]"
 guest_intent_coronation_events.0100.desc.same_house: ""ข้าเปี่ยมล้นด้วยความยินดีที่ได้เห็นเกียรติยศอันยิ่งใหญ่ที่ท่านนำมาสู่ตระกูล [ROOT.Char.GetHouse.GetName]""
 guest_intent_coronation_events.0100.desc.friendship: ""มิใช่ทุกวันที่เราจะได้เห็นสหายรักได้รับการสวมมงกุฎ""
 guest_intent_coronation_events.0100.desc.winter: "ความหนาวเหน็บของวัน ทำให้ร่างกายของ [petition_sender.GetHerHis] สั่นสะท้าน"
 guest_intent_coronation_events.0100.desc.summer: "ความเจิดจ้าของวัน ทำให้หยาดเหงื่อไหลหยดลงบนหน้าผากของ [petition_sender.GetHerHis]"
 guest_intent_coronation_events.0100.desc.neutral_1: "[ROOT.Char.Custom('GetRandomExteriorDetail')]."
 guest_intent_coronation_events.0100.desc.neutral_2: "[petition_sender.Custom('quirk_pos_standalone')] และจิบ [ROOT.Char.Custom('RegionalDrink')] ก่อนจะกล่าวต่อไปว่า:"
 guest_intent_coronation_events.0100.desc.neutral_3: "[petition_sender.GetSheHe|U] [petition_sender.Custom('quirk_pos_present')] ขณะที่ [ROOT.Char.Custom('GetRandomRegionalWildDaytimeBird')] ขัดจังหวะ [petition_sender.GetHerHim] ด้วยการเต้นรำอยู่ระหว่างเท้าของ [petition_sender.GetHerHis]"
 guest_intent_coronation_events.0100.desc.cultural_acceptance: "\n\n"พวกเราขอความเข้าใจระหว่างชนชาติของเรา ขอให้การสนับสนุนที่พวกเรามีต่อท่าน ณ จุดเริ่มต้นแห่งรัชสมัยของท่าน จงเป็นที่จดจำ""
 guest_intent_coronation_events.0100.desc.piety: "\n\n"ได้โปรด อนุญาตให้พวกเราสวดภาวนาต่อ [petition_sender.GetFaith.HighGodName] เพื่ออำนวยพรแก่รัชสมัยของท่านให้ยืนยาวและรุ่งเรืองเถิด""
 guest_intent_coronation_events.0100.desc.legitimacy: "\n\n"พวกเรายืนอยู่ที่นี่ในวันนี้เพื่อเป็นพยานถึงความสง่างามของท่าน และจะเป็นเกียรติอย่างยิ่งหากท่านจะกล่าวถ้อยคำเล็กน้อยในนามของพวกเรา""
 guest_intent_coronation_events.0100.desc.opinion: "\n\n"เหล่าผู้สนับสนุนที่ภักดีที่สุดและเหล่าข้าหลวงที่ซื่อสัตย์ที่สุดของท่าน: พวกเรายืนอยู่ที่นี่เพื่อเป็นเกียรติแก่ท่าน และเพื่อหยิบยื่นความช่วยเหลือแก่ท่าน ไม่ว่าสิ่งใดจะเกิดขึ้นก็ตาม""
 guest_intent_coronation_events.0100.desc.friend: "\n\n"ข้ายืนอยู่ที่นี่เพื่อสนับสนุนท่าน [ROOT.Char.GetTitleAsNameNoTooltip] ผู้สูงส่งของข้า โปรดอนุญาตให้ข้าได้อยู่เคียงข้างท่าน ไม่ว่าจะเกิดอะไรขึ้นก็ตาม""
 guest_intent_coronation_events.0100.desc.alliance: "\n\n"ข้าขอมอบความภักดีและการสนับสนุนอันไม่สั่นคลอนแด่ท่าน พันธมิตรระหว่างเราถือเป็นเกียรติอันสูงสุด""
 guest_intent_coronation_events.0100.desc.development: "\n\n"ข้าขอร้องท่าน [ROOT.Char.GetLadyLord] ของข้า ได้โปรดให้ความใส่ใจต่อเมืองต่าง ๆ ของ [petition_sender.GetPrimaryTitle.GetNameNoTier] ในฐานะข้าหลวงผู้ภักดีที่สุดของท่าน มัน ทำให้ข้าเจ็บปวดใจที่เห็นดินแดนเหล่านั้นถูกทอดทิ้ง""
 guest_intent_coronation_events.0100.desc.control: "\n\n"ข้าใคร่ขอความช่วยเหลือจากท่านในการบังคับใช้กฎหมายในดินแดน [petition_sender.GetPrimaryTitle.GetNameNoTier]""
 guest_intent_coronation_events.0100.desc.popular_opinion: "\n\n"ข้าขอให้ท่านใส่ใจต่อผู้คนแห่ง [petition_sender.GetPrimaryTitle.GetNameNoTier] ด้วยเหตุว่าความเป็นอยู่ที่ดีของพวกเขาคือสิ่งสำคัญที่สุดสำหรับข้า""
 guest_intent_coronation_events.0100.desc.hook: "\n\n"ข้าจะสนับสนุนท่านในรัชสมัยของท่าน และเผยแพร่กิตติศัพท์อันดีงามของ [ROOT.Char.GetTitleAsNameNoTooltip] เพื่อเป็นการตอบแทน ข้าเพียงขอให้ท่านจดจำบุญคุณครั้งนี้ไว้""
 guest_intent_coronation_events.0100.desc.vassal_levies: "\n\n"ผู้คนของข้าล้มตายไม่หยุดหย่อน ท้องทุ่งถูกทิ้งร้าง บ้านเรือนถูกเผาทำลาย ได้โปรด อนุญาตให้เราลดจำนวนการเกณฑ์ไพร่พลด้วยเถิด""
 guest_intent_coronation_events.0100.desc.vassal_taxes: "\n\n"ภาษีนั้นกดขี่ข่มเหงยิ่งนัก [ROOT.Char.GetLadyLord] ของข้า แม้ แต่พ่อค้าที่ร่ำรวยที่สุดก็มิอาจหาเลี้ยงบุตรหลานของตนได้อีกต่อไป""
 guest_intent_coronation_events.0100.desc.gold: "\n\n"ราชบัลลังก์จะได้แสดงถึงความเมตตาอันยิ่งใหญ่อย่างแท้จริง หากเป็นที่ประจักษ์ว่าได้ปูนบำเหน็จแก่เหล่าข้าแผ่นดินสำหรับการสนับสนุนของพวกเขา""
 guest_intent_coronation_events.0100.desc.prestige: "\n\n"คงจะเป็นความยินดีอย่างยิ่งของพวกเราที่จะได้รับเกียรติภูมิอันเป็นผลมาจากการเป็นข้าหลวงของท่าน""
 guest_intent_coronation_events.0100.desc.claim: "\n\n"พรมแดนของอาณาจักรนั้นแข็งทื่อเกินไป ถึงขั้นหยุดนิ่ง มันจะเป็นการดีที่สุดสำหรับทุกคน หากปล่อยให้ผู้ที่มีมืออันเด็ดเดี่ยวที่สุดได้ปกครอง""
 guest_intent_coronation_events.0100.desc.faction_discontent: "\n\n"ท่านคุ้นเคยกับ [petition_sender_faction.GetName] ใช่หรือไม่? อุดมการณ์ของเรานั้นเที่ยงแท้! เรากำลังดำเนินการอยู่ในสถานที่แห่งนี้... กระซิบกระซาบในหมู่แขกของท่าน ปลุกปั่นศัตรูของท่าน! [ROOT.Char.GetTitleAsName|l] ผู้ยิ่งใหญ่ เช่นนี้ พิธีสวมมงกุฎอันวิจิตร เช่นนี้... ท่านคงไม่มีสิ่งใดต้องกลัวจากเราเป็นแน่...""
 guest_intent_coronation_events.0100.desc.faction_members: "\n\n"แขกของท่านกระตือรือร้นที่จะรับฟังเรื่องของ [petition_sender_faction.GetName]... แต่ก็หวั่นเกรงการล้างแค้นของท่าน โปรดมอบสิทธิ์อันพึงมีในฐานะข้าหลวงแก่เรา — ให้เราได้พูดถึงความคับข้องใจของเราอย่างอิสระ!""
 guest_intent_coronation_events.0100.desc.magnificence_loss: "\n\n"ช่างเป็นเรื่องตลกสิ้นดี!" [petition_sender.GetSheHe|U] เยาะเย้ยข้า, มั่นใจในพื้นที่อันเงียบสงัดนี้ "ทุกคนรู้ดี! [host.GetTitleAsNameNoTooltip|l] ที่ถูกศัตรูรายล้อมงั้นหรือ? [host.GetTitleAsNameNoTooltip|l] ที่ถูกแขกของ [host.GetHerHis] เหยียดหยาม? ข้าขากถุยใส่การปกครองของเจ้า, ข้าขากถุยใส่พวกที่ก้มหัว — ข้าขากถุยใส่พิธีราชาภิเษกนี้!""
 guest_intent_coronation_events.0100.desc.magnificence_loss_subtle: "\n\n"โดดเดี่ยว, อยู่เหนือสิ่งอื่นใด," [petition_sender.GetSheHe] พูดอย่างมืดมน, "[ROOT.Char.GetTitleAsName], ในความสันโดษอันสมบูรณ์แบบของ [petition_sender.GetHerHis], ย่อมรอดพ้นจากถ้อยคำโสโครกแห่งความแตกแยก แต่ข้ารู้สึกว่าข้าต้องรับรองต่อ [ROOT.Char.GetTitleAsNameNoTooltip] ผู้ยิ่งใหญ่..."\n\n"...ว่าการรวมตัวครั้งนี้ #EMP เต็มไปด้วย#! คำพูดที่ไม่ภักดี เช่นนั้น""
 guest_intent_coronation_events.0100.desc.critical_fail: "\n\n"มันจบแล้ว [host.GetTitledFirstNameNoTooltip] บัดนี้ นี่คือพิธีสวมมงกุฎของ [claimant_scope.GetTitledFirstNamePossessive]""
