 belligerent_desc: "[SelectLocalization(GetPlayer.GetGovernment.IsType('nomad_government'), 'belligerent_nomad_desc', 'belligerent_general_desc')]"
 belligerent_nomad_desc: "เหล่า [vassals|E] $belligerent$ แสวงหาแบบอย่างแห่งอำนาจจาก [liege|E] ของตน พวกเขามักเข้าร่วมการประลองเพื่อเป็นประจักษ์พยานถึงความเก่งกาจด้าน [prowess|E] ของนายเหนือหัวด้วยตนเอง เหล่า [nomads|E] มีโอกาสสูงกว่าที่จะรับเอา [vassal_stance|E] นี้\n\n#low เหล่าข้าหลวง $belligerent$ ชื่นชอบเมื่อนายเหนือหัวของตน:#!\n$EFFECT_LIST_BULLET$มี [nomadic_authority|E] ในระดับสูง\n$EFFECT_LIST_BULLET$จัด [GetActivityType( 'activity_tournament' ).GetName] และชนะ [contests|E]\n$EFFECT_LIST_BULLET$จัด [activities|E] ประเภท [GetActivityType( 'activity_hunt' ).GetName]\n$EFFECT_LIST_BULLET$ชนะ [single_combat_duel_plural|E]\n$EFFECT_LIST_BULLET$เรียกร้อง [obedience|E]\n\n#low เหล่าข้าหลวง $belligerent$ ไม่ชื่นชอบเมื่อนายเหนือหัวของตน:#!\n$EFFECT_LIST_BULLET$แพ้ [single_combat_duel_plural|E]\n$EFFECT_LIST_BULLET$มี [obedience|E] ในระดับต่ำ\n$EFFECT_LIST_BULLET$มี [succession_laws|E] แบบแบ่งส่วนใดๆ\n\nพวกเขาพึงใจใน [heirs|E] ผู้กล้าหาญและโกรธา ซึ่งมีทักษะ [prowess_i][prowess|E] สูง"
 belligerent_general_desc: "เหล่า [vassals|E] $belligerent$ แสวงหาแบบอย่างแห่งอำนาจจาก [liege|E] ของตน พวกเขามักเข้าร่วมการประลองเพื่อเป็นประจักษ์พยานถึงความเก่งกาจด้าน [prowess|E] ของนายเหนือหัวด้วยตนเอง เหล่า [nomads|E] มีโอกาสสูงกว่าที่จะรับเอา [vassal_stance|E] นี้\n\n#low เหล่าข้าหลวง $belligerent$ ชื่นชอบเมื่อนายเหนือหัวของตน:#!\n$EFFECT_LIST_BULLET$มี [crown_authority|E] ในระดับสูง\n$EFFECT_LIST_BULLET$จัด [GetActivityType( 'activity_tournament' ).GetName] และชนะ [contests|E]\n$EFFECT_LIST_BULLET$จัด [activities|E] ประเภท [GetActivityType( 'activity_hunt' ).GetName]\n$EFFECT_LIST_BULLET$ชนะ [single_combat_duel_plural|E]\n\n#low เหล่าข้าหลวง $belligerent$ ไม่ชื่นชอบเมื่อนายเหนือหัวของตน:#!\n$EFFECT_LIST_BULLET$แพ้ [single_combat_duel_plural|E]\n$EFFECT_LIST_BULLET$มี [crown_authority|E] ในระดับต่ำ\n$EFFECT_LIST_BULLET$มี [succession_laws|E] แบบแบ่งส่วนใดๆ\n\nพวกเขาพึงใจใน [heirs|E] ผู้กล้าหาญและโกรธา ซึ่งมีทักษะ [prowess_i][prowess|E] สูง"
