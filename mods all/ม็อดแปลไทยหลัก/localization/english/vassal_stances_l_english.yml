 glory_hound_desc:1 "$glory_hound$ [vassals|E] ให้ความสำคัญกับสถานะและเกียรติภูมิ และการแสดงความแข็งแกร่งของอาณาจักรที่ตนเป็นส่วนหนึ่งให้โลกเห็น ข้าในบังคับที่กล้าหาญหรือไร้ความเมตตามักจะใช้ [vassal_stance|E] นี้\n\n#low $glory_hound$ ข้าในบังคับชอบเมื่อเจ้าเหนือหัวของพวกเขา:#!\n$EFFECT_LIST_BULLET$มี [succession_law|E] แบบแบ่งส่วนใดๆ\n$EFFECT_LIST_BULLET$ได้รับ [victory|E] ใน [wars|E] เชิงรุก\n$EFFECT_LIST_BULLET$เชิญพวกเขาเข้าร่วม [activities|E] [GetActivityType('activity_hunt').GetName]\n\n#low $glory_hound$ ข้าในบังคับไม่ชอบเมื่อเจ้าเหนือหัวของพวกเขา:#!\n$EFFECT_LIST_BULLET$มี [crown_authority|E] สูง\n$EFFECT_LIST_BULLET$ยอม [defeat|E] หรือ [white_peace|E] ในสงคราม\n$EFFECT_LIST_BULLET$[marries|E] ตัวละคร [lowborn|E] เป็น [primary_spouse|E]\n\nพวกเขาชอบ [heirs|E] ที่อาจหาญและกล้าหาญ ซึ่งมีทักษะ [martial_i][martial|E] สูง"
