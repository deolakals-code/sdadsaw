 compassion_explanation:1 "ตัวละครนี้ #Bold ค่อนข้างเห็นอกเห็นใจ#! และมีแนวโน้มที่จะไม่ทำร้ายผู้อื่น ปล่อย [prisoners|E] (โดยเฉพาะเด็ก) ส่งเสริม [cultural_acceptance|E] ปล่อยให้ผู้คน [marry|E] ด้วยความรัก และผูก [friends|E] พวกเขามีแนวโน้มที่จะไม่ [GetScheme('murder').GetTypeName] [execute|E] หรือ [torture|E] ตัวละครอื่น และไม่เต็มใจที่จะใช้ [hostages|E] เป็นเบี้ย"
 compassion_neg_explanation:0 "ตัวละครนี้ #Bold ค่อนข้างโหดร้าย#! และมีแนวโน้มที่จะทำร้ายผู้อื่น ใช้ [hostile_schemes|E] เช่น [GetScheme('murder').GetTypeName] ลงโทษ [prisoners|E] ด้วยการ [execution|E] และ [torture|E] และเข้าร่วมเป็น [agents|E] พวกเขาไม่น่าจะสนใจความทุกข์ทรมานของผู้อื่น"
 compassion_strong_explanation:1 "ตัวละครนี้ #Bold เห็นอกเห็นใจอย่างยิ่ง#! และมีแนวโน้มสูงอย่างมากที่จะไม่ทำร้ายผู้อื่น ปล่อย [prisoners|E] (โดยเฉพาะเด็ก) ส่งเสริม [cultural_acceptance|E] ปล่อยให้ผู้คน [marry|E] ด้วยความรัก และผูก [friends|E] พวกเขาแทบจะไม่ [GetScheme('murder').GetTypeName] [execute|E] หรือ [torture|E] ตัวละครอื่นเลย และไม่เต็มใจอย่างยิ่งที่จะใช้ [hostages|E] เป็นเบี้ย"
