 vengefulness_neg_explanation:0 "ตัวละครนี้ #Bold ค่อนข้างช่างให้อภัย#! และมีแนวโน้มที่จะเพิกเฉยต่อการดูหมิ่นและการล่วงละเมิดที่กระทำต่อตน ไม่ลงโทษ [prisoners|E] และอภัยโทษ [criminals|E] พวกเขามีแนวโน้มที่จะไม่ริเริ่ม [hostile_schemes|E] ต่อต้าน [rivals|E]"
