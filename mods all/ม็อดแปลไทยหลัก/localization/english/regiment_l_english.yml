cataphract_archers_flavor: "#F ลูกธนูและคมดาบกระทบเกราะแผ่นซ้อนของเหล่านักรบอาชาและพาหนะของพวกมันแล้วกระเด็นออกไปโดยมิอาจทำอันตรายได้ ขณะเดียวกัน คันธนูของพวกมันกลับสังหารและมอบความทุกข์ทรมาน#!"

maturkan_warriors: "นักรบมาตูร์กัน"
