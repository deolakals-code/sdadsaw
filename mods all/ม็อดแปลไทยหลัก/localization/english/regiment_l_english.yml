 torch_bearers: "พลคบเพลิง"
 torch_bearers_flavor: "#F ณ ทุ่งหญ้าสเตปป์อันไร้พรมแดน มิต้องมีหอคอยล้อมเมืองหรือเครื่องดีดศิลา — เพียงคบเพลิงอันลุกโชนและอาชาอันปราดเปรียว ก็เพียงพอแล้วที่จะจุดไฟเผาผลาญทุกกระโจมให้วอดวาย#!"

heavy_horse_archers: "พลธนูม้าหนัก"
heavy_horse_archers_flavor: "#F พลขี่ม้าสวมเกราะผู้ถือคันธนูอันทรงอานุภาพ แต่ละนายจูงอาชาพันธุ์ดีหลายตัว เหล่าชนเผ่าเร่ร่อนเหล่านี้จึงสามารถต่อสู้ในสมรภูมิเปิดได้อย่างไม่รู้จักเหน็ดเหนื่อย#!"

