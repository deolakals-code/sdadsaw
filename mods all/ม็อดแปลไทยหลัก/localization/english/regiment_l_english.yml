mangudai: "มังกุได"
mangudai_flavor: "#F เหล่าพลม้าอาสาสมัครผู้กล้าแกร่ง — 'ผู้ที่ตายแล้ว' — คือหน่วยแรกสุดที่พุ่งเข้าปะทะศัตรู และด้วยการอุทิศชีวิตของตน ล่อลวงให้ข้าศึกเสียกระบวนรบด้วยความบุ่มบ่าม#!"

