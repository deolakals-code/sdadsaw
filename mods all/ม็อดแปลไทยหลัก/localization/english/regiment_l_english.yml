 akritai_flavor: "#F ทหารเกณฑ์ชนบทผู้ช่ำชอง ผู้พิทักษ์ช่องเขาหิน ซึ่งใช้จังหวะเวลาที่ระมัดระวังและความรู้ท้องถิ่นเพื่อก่อกวนแม้กระทั่งกองทัพที่ยิ่งใหญ่ที่สุด#!"
 ballistrai_flavor: "#F ลูกศรขนาดเท่าหอกพุ่งออกจากเครื่องจักรที่ใช้แรงบิดเหล่านี้เข้าสู่นิคมที่ถูกล้อมและรูปขบวนของศัตรู ก่อให้เกิดความกลัวและความโกลาหล#!"
 skoutatoi_flavor: "#F โล่ #EMP สคูทอน#! สูงตระหง่านที่ทหารราบเหล่านี้ตั้งเรียงรายต่อต้านศัตรูคือที่มาของชื่อพวกเขา ทว่าคุณธรรมหลักในการรบคือวินัย ซึ่ง ทำให้พวกเขามีระเบียบที่ดีทั้งในการบุกและการถอย#!"
 varangian_guards_flavor: "#F ทหารรับจ้างเจอร์แมนิกผู้ถือขวานอันเลื่องชื่อเหล่านี้ คือแกนกลางที่ไม่สั่นคลอนของกองทัพจักรวรรดิ\n\n@warning_icon! #X พวกเขาจะเรียกร้อง [gold|E] ส่วนหนึ่งหลังการสิ้นพระชนม์ของบาซิเลอุส#! "
 handpicked_faithful_flavor: "#F โดดเด่นเป็นเอกในด้านความกล้าหาญ ความภักดี และความสามารถ นักรบเหล่านี้พร้อมที่จะสละชีวิตเพื่อปกป้องผู้นำของตน#!"
 emishi_horse_archers_flavor: "#F ถูกบังคับให้ป้องกันตนเองจากภัยคุกคามที่แข็งแกร่งกว่า พลธนูขี่ม้าเอมิชิจึงเป็นปรมาจารย์ด้านกลยุทธ์ตีแล้วหนี การปล้นสะดม และการซุ่มโจมตี#!"
 japanese_horse_archers_flavor: "#F ด้วยการปรับใช้เทคนิคของชาวเอมิชิทางตอนเหนือ แต่ใช้เกราะที่หนักกว่า เหล่าซามูไรจึงขึ้นหลังม้า ถือยูมิ (ธนู) ไว้ในมือ และโจมตีศัตรูด้วยลูกธนู"
 warrior_monks_flavor: "#F เพื่อปกป้องผู้ศรัทธาและรับใช้อุปัฏฐาก ชีวิตที่อุทิศตนของพระเหล่านี้ทำให้มีเวลาเหลือเฟือสำหรับการฝึกฝนและความเชื่อมั่นอันแรงกล้า#!"
 pikemen_militia_flavor: "#F พร้อมที่จะต่อสู้เพื่อที่ดินและศักดิ์ศรีของตน เมื่อถูกผลักไสจนสิ้นหวัง พวกเขาจะมุ่งเป้าไปที่เจ้าของที่ดินผู้สูงศักดิ์เพื่อชิงสิ่งที่พึงได้กลับคืนมา#!"

