 #MaA Descriptions
 bowmen_flavor:1 "#F พลธนูมืออาชีพสาดลูกธนูขึ้นไปในอากาศ ทำลายล้างกองทหารแนวหน้าของศัตรูอย่างหนัก#!"
 light_footmen_flavor:1 "#F พลปะทะช่ำชองเป็นหน่วยก่อกวนอันประเมินค่ามิได้ คอยขัดขวางปีกของศัตรูและบั่นทอนขวัญกำลังใจ#!"
 light_horsemen_flavor:0 "#F เบาและว่องไว ทหารม้าเหล่านี้ยอดเยี่ยมในการตีโอบ และร้ายกาจเมื่อไล่ตามศัตรูที่แตกพ่าย#!"
 armored_footmen_flavor:1 "#F ติดอาวุธหนักและฝึกฝนมาอย่างดี กองทหารเหล่านี้เชี่ยวชาญในการบดขยี้ทหารราบที่รวมตัวกันหนาแน่น#!"
 pikemen_unit_flavor:0 "#F หอกยาวทำให้กรมทหารเหล่านี้สร้างกำแพงปลายแหลมที่สามารถหยุดการบุกของทหารม้าได้อย่างชะงัด#!"
 armored_horsemen_flavor:0 "#F ติดอาวุธหนักและเกราะหนา ทหารม้าเหล่านี้ครองความเป็นใหญ่ในการสงครามบนที่ราบเปิด#!"
 crossbowmen_flavor:0 "#F แม้จะบรรจุลูกช้า แต่หน้าไม้ก็ใช้งานง่ายและยิงลูกศรที่สามารถทะลุทะลวงเกราะส่วนใหญ่ได้ในระยะที่ดี#!"
 handgunners_flavor: "#F อาวุธปืนไฟหยาบ ๆ เหล่านี้มีราคาสูงและระเบิดได้ง่ายพอ ๆ กัน แต่ก็เป็นอาวุธที่มีประสิทธิภาพอย่างเหลือเชื่อ#!\n#help เปิดใช้งานโดย [GetBuilding('powder_magazine_01').GetName]#!"
 fire_lancers_flavor: "#F ด้วยการใช้สูตรทดลอง เหล่าชายฉกรรจ์ที่ถืออาวุธด้ามยาวแปลกประหลาดสามารถโปรยปรายไฟลงใส่ศัตรูที่หวาดผวาได้#!\n#help เปิดใช้งานโดย [GetBuilding('powder_magazine_01').GetName]#!"
 gakgung_archers_flavor: "#F พลธนูเหล่านี้ติดตั้งคันธนูแบบรีเฟล็กซ์อันทรงพลังและแหวนนิ้วหัวแม่มือเพื่อเสริมแรงดึง สามารถยิงธนูได้ไกลอย่างน่าทึ่ง"
 pesilat_warriors_flavor: "#F แม้ว่าบ่อยครั้งจะพกอาวุธ #italic กริช#! #italic โกล็อก#! หรืออาวุธระยะประชิดอื่น ๆ อีกมากมาย ผู้ฝึกซีลัตก็เชี่ยวชาญการต่อสู้ด้วยมือเปล่าไม่แพ้กัน#!"
