 accolade_maa_horse_archers:0 "ทหารม้าธนูส่วนตัว"
 accolade_maa_horse_archers_flavor:1 "[retinue_maa|E]\n#F พลขี่ม้าบนทุ่งหญ้าสเตปป์ทั่วไปมีทักษะมาตลอดชีวิต: ทหารม้าผู้ช่ำชองเหล่านี้ยิ่งมีมากกว่า การยืนหยัดต่อสู้กับพวกเขาคือความเจ็บปวด การไล่ตามพวกเขาคือความตาย#!"
 accolade_maa_handgunners: "พลปืนไฟราชองครักษ์"
 accolade_maa_handgunners_flavor: "[retinue_maa|E]\n#F พลปืนไฟที่ฝึกฝนมาอย่างดีเหล่านี้ รุกคืบอย่างมั่นคงผ่านควันดินปืน สามารถทำลายแถวศัตรูให้แตกพ่ายด้วยปืนที่สร้างขึ้นอย่างเชี่ยวชาญ#!"
 
 #MPO 
 nomadic_riders: "พลม้าทัพอนารยชน"
 nomadic_riders_flavor: "#F ถือกำเนิดบนหลังอาชา, เหล่า $nomadic_riders$ ได้รับการฝึกฝนมาแต่เยาว์วัยเพื่อทะยานเข้าสู่สมรภูมิรบ#!"
 kheshig: "เคชิก"
 kheshig_flavor: "#F องครักษ์ชั้นยอดของผู้ปกครองชนเผ่าเร่ร่อน, เหล่า $kheshig$ รับประกันความปลอดภัยของนายเหนือหัวทั้งกลางวันและกลางคืน #EMP โครชิน#! กองกำลังรบของพวกเขานั้น ขยายการอารักขานี้ไปถึงในสนามรบด้วย#!"
