 kurultai_task.1101.desc: "[county.GetDefinitiveName] กำลังเฟื่องฟูด้วยฝีมือของ [councillor.GetShortUIName]"

 kurultai_task.1106.notification: "การปกครองเป็นที่นิยม"
 kurultai_task.1106.desc: "งานของ [councillor.GetShortUINamePossessive] ใน [county.GetDefinitiveName] ได้นำมา ซึ่งผลประโยชน์ที่ไม่คาดคิด"

 kurultai_task.1151.notification: "ความอุดมสมบูรณ์ลดถอย"
 kurultai_task.1151.desc: "[councillor.GetShortUIName] จัดการฝูงสัตว์ของเราใน [county.GetDefinitiveName] ผิดพลาด ส่งผลให้ความอุดมสมบูรณ์ในพื้นที่ลดน้อยลง"

 kurultai_task.1156.notification: "การปกครองไม่เป็นที่นิยม"
 kurultai_task.1156.desc: "การจัดการ [county.GetNameNoTier] ของ [councillor.GetShortUINamePossessive] ได้รับการพิสูจน์แล้วว่าไม่เป็นที่นิยมอย่างยิ่ง และมันสะท้อนถึงการปกครองของข้าในฐานะ [ROOT.Char.GetTitleAsNameNoTooltip]"

 kurultai_task.1201.notification: "การปกครองอันเปี่ยมศรัทธา"
 kurultai_task.1201.desc: "ประชาชนของข้าประทับใจในการทำงานของ [astrologer.GetShortUIName] และ [councillor.GetShortUIName] ที่ทำในนามของข้า"

 kurultai_task.1206.notification: "$court_astrologer_court_position$ ผู้เป็นมิตร"
 kurultai_task.1206.desc: "สมาชิก [kurultai|E] ของข้า [councillor.GetShortUIName] ได้สร้างสายสัมพันธ์ที่ใกล้ชิดยิ่งขึ้นกับ [astrologer.GetShortUIName] ในนามของข้า"

 kurultai_task.1251.notification: "การปกครองอันน่าละอาย"
 kurultai_task.1251.desc: "ประชาชนของข้ากำลังประณาม [astrologer.GetShortUIName] และ [councillor.GetShortUIName] ที่ใช้อำนาจในตำแหน่งโดยมิชอบ"

