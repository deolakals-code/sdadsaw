 kurultai_task.1351.notification: "ดินแดนที่ถูกขูดรีด"
 kurultai_task.1351.desc: "ความพยายามของ [councillor.GetShortUINamePossessive] ในการใช้ประโยชน์สูงสุดจาก [county.GetNameNoTier] ได้ก่อให้เกิดผลข้างเคียงที่ไม่คาดคิด แต่ก็ไม่น่าประหลาดใจ"

 kurultai_task.1356.notification: "ประชาชนผู้ถูกขูดรีด"
 kurultai_task.1356.desc: "งานของ [councillor.GetShortUIName] ได้ส่งผลกระทบอย่างร้ายแรงต่อชนเผ่าท้องถิ่นที่อาศัยอยู่ใน [county.GetNameNoTier]"

 kurultai_task.1401.notification: "นักปล้นผู้น่าเกรงขาม"
 kurultai_task.1401.desc: "นักปล้นของเราเป็นที่หวาดหวั่นไปทั่วสารทิศ ด้วยฝีมือการฝึกฝนของ [councillor.GetShortUIName]"

 kurultai_task.1406.notification: "นักปล้นผู้น่าสะพรึงกลัว"
 kurultai_task.1406.desc: "นักปล้นของเราสร้างความหวาดกลัวในหัวใจของศัตรูทั้งใกล้และไกล ทั้งภายในและภายนอกพรมแดนของเรา"

 kurultai_task.1451.notification: "นักปล้นผู้ไม่เอาไหน"
 kurultai_task.1451.desc: "ด้วยเหตุผลบางประการ นักปล้นของข้าดูเหมือนจะไม่ได้เรื่องยิ่งกว่าเดิมเสียอีก นับตั้งแต่ [councillor.GetShortUIName] เริ่มทำงานกับพวกเขา"

 kurultai_task.1456.notification: "นักปล้นผู้น่าสมเพช"
 kurultai_task.1456.desc: "ขอทาน ขี้เมา และคนอ่อนแอ [councillor.GetShortUIName] เอานักปล้นของข้าคืนมา!"

 kurultai_task.1501.notification: "การสร้างความสัมพันธ์ทางวัฒนธรรม"
 kurultai_task.1501.desc: "$task_accept_culture_acceptance_gain$"

 kurultai_task.1506.notification: "สายสัมพันธ์ทางวัฒนธรรม"
 kurultai_task.1506.desc: "ด้วยความพยายามของ [councillor.GetShortUIName] ชาวต่างชาติจึงรู้สึกได้รับการต้อนรับในราชสำนัก"

 kurultai_task.1551.notification: "ความสัมพันธ์ทางวัฒนธรรมที่เสื่อมถอย"
 kurultai_task.1551.desc: "ความพยายามของ [councillor.GetShortUINamePossessive] มี แต่จะ ทำให้สายสัมพันธ์ทางวัฒนธรรมเลวร้ายลง"

 kurultai_task.1556.notification: "สายสัมพันธ์ที่แตกสลาย"
