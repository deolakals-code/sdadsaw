 # disease tracking
 test.4.title:0 "ข้อมูลโรค"
 test.4.desc:0 "จำนวนตัวละครทั้งหมด: [ROOT.Var('local_copy_disease_data_global_character_amount').GetValue]\nการเสียชีวิตจากโรคก่อนวัยอันควร (อายุ < 60): [ROOT.Var('local_copy_disease_data_global_premature_death_amount').GetValue]\nโอกาสเสียชีวิตจากโรคก่อนวัยอันควร: [ROOT.Var('disease_data_calc_premature_disease_death_percentage').GetValue]%\n\nโรคทั่วไป:\nโอกาสเป็นโรคทั่วไป: [ROOT.Var('disease_data_calc_common_disease_percentage').GetValue]%\nโอกาสติดเชื้อป่วย: [ROOT.Var('disease_data_calc_ill_percentage').GetValue]%\nโอกาสเสียชีวิตก่อนวัยอันควรจากการป่วย: [ROOT.Var('disease_data_calc_ill_premature_death_chance').GetValue]%\nโอกาสติดเชื้อปอดบวม: [ROOT.Var('disease_data_calc_pneumonic_percentage').GetValue]%\nโอกาสเสียชีวิตก่อนวัยอันควรจากปอดบวม: [ROOT.Var('disease_data_calc_pneumonic_premature_death_chance').GetValue]%\n\nโรคร้ายแรง:\nโอกาสเป็นโรคร้ายแรง: [ROOT.Var('disease_data_calc_serious_disease_percentage').GetValue]%\nโอกาสติดเชื้อโรคเกาต์รุนแรง: [ROOT.Var('disease_data_calc_gout_ridden_percentage').GetValue]%\nโอกาสเสียชีวิตก่อนวัยอันควรจากโรคเกาต์รุนแรง: [ROOT.Var('disease_data_calc_gout_ridden_premature_death_chance').GetValue]%\nโอกาสติดเชื้อโรคเรื้อน: [ROOT.Var('disease_data_calc_leper_percentage').GetValue]%\nโอกาสเสียชีวิตก่อนวัยอันควรจากโรคเรื้อน: [ROOT.Var('disease_data_calc_leper_premature_death_chance').GetValue]%\nโอกาสติดเชื้อไทฟัส: [ROOT.Var('disease_data_calc_typhus_percentage').GetValue]%\nโอกาสเสียชีวิตก่อนวัยอันควรจากไทฟัส: [ROOT.Var('disease_data_calc_typhus_premature_death_chance').GetValue]%\nโอกาสติดเชื้อวัณโรค: [ROOT.Var('disease_data_calc_consumption_percentage').GetValue]%\nโอกาสเสียชีวิตก่อนวัยอันควรจากวัณโรค: [ROOT.Var('disease_data_calc_consumption_premature_death_chance').GetValue]%\nโอกาสเป็นมะเร็ง: [ROOT.Var('disease_data_calc_cancer_percentage').GetValue]%\nโอกาสเสียชีวิตก่อนวัยอันควรจากมะเร็ง: [ROOT.Var('disease_data_calc_cancer_premature_death_chance').GetValue]%\nโอกาสติดเชื้อโรคคนรัก: [ROOT.Var('disease_data_calc_lovers_pox_percentage').GetValue]%\nโอกาสเสียชีวิตก่อนวัยอันควรจากโรคคนรัก: [ROOT.Var('disease_data_calc_lovers_pox_premature_death_chance').GetValue]%\nโอกาสติดเชื้อซิฟิลิส: [ROOT.Var('disease_data_calc_great_pox_percentage').GetValue]%\nโอกาสเสียชีวิตก่อนวัยอันควรจากซิฟิลิส: [ROOT.Var('disease_data_calc_great_pox_premature_death_chance').GetValue]%\nโอกาสติดเชื้อไข้ทรพิษ: [ROOT.Var('disease_data_calc_smallpox_percentage').GetValue]%\nโอกาสเสียชีวิตก่อนวัยอันควรจากไข้ทรพิษ: [ROOT.Var('disease_data_calc_smallpox_premature_death_chance').GetValue]%\nโอกาสติดเชื้อกาฬโรค: [ROOT.Var('disease_data_calc_bubonic_plague_percentage').GetValue]%\nโอกาสเสียชีวิตก่อนวัยอันควรจากกาฬโรค: [ROOT.Var('disease_data_calc_bubonic_plague_premature_death_chance').GetValue]%\n\nhej[a_value.GetName]hey"

