 LEGITIMACY_AVERAGE_EXPECTATIONS: "#S [expected_legitimacy|E] โดยเฉลี่ยของ [Character.GetShortUINamePossessive|U]:#!\n$BULLET$[powerful_vassals|E]: [LegitimacyType.GetFlavorName( Character.GetAveragePowerfulVassalLegitimacyExpectation )|V] #weak ([Character.GetAveragePowerfulVassalLegitimacyExpectation.GetIndex]/[Subtract_int32( GetDataModelSize( LegitimacyType.GetLevels ), '(int32)1' )])#!\n$BULLET$[vassals|E]: [LegitimacyType.GetFlavorName( Character.GetAverageVassalLegitimacyExpectation )|V] #weak ([Character.GetAverageVassalLegitimacyExpectation.GetIndex]/[Subtract_int32( GetDataModelSize( LegitimacyType.GetLevels ), '(int32)1' )])#!"
 LEGITIMACY_AVERAGE_EXPECTATIONS_NO_POWERFUL_VASSALS: "#S [expected_legitimacy|E] เฉลี่ยของ [Character.GetShortUINamePossessive|U]:#!\n$BULLET$[vassals|E]: [LegitimacyType.GetFlavorName( Character.GetAverageVassalLegitimacyExpectation )|V] #weak ([Character.GetAverageVassalLegitimacyExpectation.GetIndex]/[Subtract_int32( GetDataModelSize( LegitimacyType.GetLevels ), '(int32)1' )])#!"
 LEGITIMACY_BELOW_AVERAGE_EXPECTATIONS: "@warning_icon! #X ต่ำกว่าความชอบธรรมที่คาดหวังของข้าหลวงทั้งหมด#!"
 VASSAL_BELOW_EXPECTED_LEGITIMACY_TT: "\n@warning_icon! #X [legitimacy_levels|E] ต่ำกว่าความคาดหวังของ [Character.GetHerHis]: [Subtract_int32( Character.GetLegitimacyExpectationsOfLiege, GetPlayer.GetLegitimacyLevel.GetIndex )|V]#!"
 VASSAL_EXPECTED_LEGITIMACY_TT: "#T [expected_legitimacy|E]: [Character.GetLegitimacyExpectationsOfLiege]#![AddLocalizationIf( GreaterThan_int32( Character.GetLegitimacyExpectationsOfLiege, GetPlayer.GetLegitimacyLevel.GetIndex ), 'VASSAL_BELOW_EXPECTED_LEGITIMACY_TT' )]"
 legitimacy_swing_scales_cheaper_tt: "#weak ค่าใช้จ่ายลดลงเนื่องจาก [legitimacy|E] ต่ำของ [recipient.GetShortUINamePossessive] ([recipient.GetLegitimacyLevel.GetIndex|V])#!"
 legitimacy_swing_scales_dearer_tt: "#weak ค่าใช้จ่ายเพิ่มขึ้นเนื่องจาก [legitimacy|E] สูงของ [recipient.GetShortUINamePossessive] ([recipient.GetLegitimacyLevel.GetIndex|V])#!"
 legitimacy_hud_tt: "ผู้ปกครอง [LegitimacyType.GetFlavorName( LegitimacyLevel.Self )] [LegitimacyLevel.GetIndex|V]/[Subtract_int32( GetDataModelSize( LegitimacyType.GetLevels ), '(int32)1' )]"
