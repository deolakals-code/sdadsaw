 pardon_interaction_desc:1 "ท่านถือว่า [recipient.GetName] เป็น[criminal|E] ([recipient.GetImprisonmentReasons( actor.Self )]) ทำให้ท่านสามารถ[imprison|E]พวกเขาได้ตลอดเวลาโดยไม่ได้รับ[tyranny|E]\n\nหากท่านต้องการให้พวกเขายังคงเป็นอิสระ ท่านสามารถเลือกที่จะอภัยโทษให้พวกเขาได้ การกระทำนี้จะลบเหตุผลทั้งหมดที่ท่านมีในการ[imprison|E]พวกเขา และเพิ่ม[opinion|E]ของพวกเขาที่มีต่อท่าน"
