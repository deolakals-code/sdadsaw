 char_interaction.0250.desc:1 "[actor.Custom2('PositiveSupplimentaryGreeting', recipient)]\nข้าเสียใจที่ต้องแจ้งให้ท่านทราบว่าข้าได้ตัดสินใจเพิ่มภาระผูกพันตามสัญญาของท่าน\n\nแน่นอนว่าท่านคงเข้าใจสภาพการณ์ของข้า – [actor.GetPrimaryTitle.GetNameNoTierNoTooltip] ต้องการการปกป้องอย่างเร่งด่วน และการสนับสนุนของท่านก็มีส่วนสำคัญอย่างยิ่ง\n\nและยิ่งไปกว่านั้น ท่าน #emphasis เป็นหนี้บุญคุณข้าอยู่แล้ว!#!"
 char_interaction.0250.a:0 "ดูเหมือนข้ามีทางเลือกน้อยนัก..."
 char_interaction.0251.desc:1 "[actor.Custom2('PositiveSupplimentaryGreeting', recipient)]\nข้าเป็นข้าหลวงที่ดีต่อท่าน แต่แน่นอนว่าท่านคงเข้าใจว่าข้าก็มีข้ารับใช้ของข้าเอง เช่นกัน!\n\nสัญญาปัจจุบันของข้ามีข้อจำกัดมาก แน่นอนว่าท่านคงเห็นพ้องในปัญญาที่จะ ทำให้มันผ่อนปรนมากขึ้น?\n\nและยิ่งไปกว่านั้น ท่าน #emphasis เป็นหนี้บุญคุณข้าอยู่แล้ว!#!"

 char_interaction.0253.desc: "[actor.Custom2('PositiveSupplimentaryGreeting', recipient)]\nข้าได้ตัดสินใจแล้วว่าประเภทการบริหารของ [recipient.GetPrimaryTitle.GetNameNoTooltip] จะต้องถูกเปลี่ยนแปลง\n\nการตัดสินใจนี้กระทำไปเพื่อประโยชน์สุขส่วนรวมของ [actor.GetPrimaryTitle.GetNameNoTierNoTooltip]\n"
 char_interaction.0253.a: "ข้าจะรับผิดชอบหน้าที่ใหม่ของข้า"

 char_interaction.0252.desc: "[actor.Custom2('PositiveSupplimentaryGreeting', recipient)]\nเพื่อเป็นการระลึกถึงเครื่องบรรณาการและความเคารพที่เรามีต่อ [recipient.GetPrimaryTitle.GetNameNoTooltip] ข้าจึงขอให้ท่านโปรดให้เกียรติความภักดีนั้น ด้วยการมอบ [SCOPE.Custom('CelestialTributaryRequest')]\n\nขอให้ความโปรดปรานนี้ช่วยเสริมสร้างความกลมเกลียวระหว่างบัลลังก์ของท่านและอาณาจักรอันต่ำต้อยของเรา"
 char_interaction.0252.a: "ข้าจะอนุญาตให้ท่านเข้าถึงแผงค้าในตลาดของเรา"
 char_interaction.0252.b: "ได้, ราชวงศ์ของเจ้าได้พิสูจน์ตนแล้วว่าคู่ควรที่จะเข้าร่วมกับของข้า"
 char_interaction.0252.c: "ตราบใดที่เจ้ายังคงภักดีต่อ [recipient.GetTitleTierName] ของเจ้า!"
 char_interaction.0252.d: "ถือซะว่าภาระภาษีของเจ้าได้รับการลดหย่อน"
 char_interaction.0252.d.alt: "ข้าจะลดภาระภาษีของเจ้าให้แทนแล้วกัน"
 char_interaction.0252.e: "ข้าจะรับรองอธิปไตยของ [actor.GetPrimaryTitle.GetNamePossessiveNoTooltip]"
 char_interaction.0252.e.alt: "ให้ข้ารับรองอธิปไตยของ [actor.GetPrimaryTitle.GetNamePossessiveNoTooltip] แทนเถอะ"
