 court_amenities_interactions.0001.t:0 "ถูกกล่าวหาว่าละเมิดกฎหมายควบคุมความฟุ่มเฟือย!"
 court_amenities_interactions.0001.desc_intro:1 "ขณะที่ข้าเดินอยู่ในห้องโถงของ [debate_locale.GetNameNoTierNoTooltip] แต่งกายตามปกติ ทันใดนั้นข้าก็ถูกหยุดโดยไม่ใช่ใครอื่นนอกจาก [actor.GetTitledFirstName]!\n\n[actor.GetSheHe|U] กดนิ้วของ [actor.GetHerHis] ลงบนหน้าอกของข้าอย่างแรง"
 court_amenities_interactions.0001.desc_byzantine:0 "“เหตุใดเจ้าจึงถือวิสาสะสวมใส่สีม่วง? มีเพียงตระกูล #EMP ของข้า#! เท่านั้นที่มีเกียรตินั้น! ถอดมันออกเสียเดี๋ยวนี้!”"
 court_amenities_interactions.0001.desc_court_position:0 ""เจ้าเรียกอาภรณ์ #EMP นั่น#! ว่าเหมาะสมกับตำแหน่ง [recipient.GetTitleAsNameNoTooltip] รึ? ดูเหมือนตัวตลกสิ้นดี! เปลื้องผ้าออกเดี๋ยวนี้ มิฉะนั้นข้าจะเรียกทหารยาม!""
 court_amenities_interactions.0001.desc.nakey:0 ""แม้ร่างกายจะเป็นสิ่งที่ควรเฉลิมฉลองในทุกรูปแบบ แต่อย่างน้อยเจ้าก็ควรดูแลตนเองบ้าง! เจ้าไม่ได้อาบน้ำมานานเท่าใดแล้ว?""
 court_amenities_interactions.0001.desc:0 ""เจ้าคิดว่าตนเองเป็นใครกัน ถึงได้เดินกรีดกรายในชุดอันน่าหัวเราะเยาะนั่น? ที่นี่คือราชสำนัก ไม่ใช่ซ่องโสเภณี! ไปหาชุดที่ดูถ่อมตนกว่านี้มาใส่!""
 court_amenities_interactions.0001.desc_outro:0 "\n\n[actor.GetSheHe|U ] กล่าวหาว่าข้าละเมิดกฎหมายควบคุมความฟุ่มเฟือยของ [actor.GetPrimaryTitle.GetAdjective] ซึ่งเป็นมลทินทางสังคมที่ข้าคงยากจะลบล้างได้ — แม้ข้าอาจจะยังเอาชนะ [actor.GetTitledFirstNameNoTooltip] ได้ก็ตาม! บางทีอาจเรียกร้องค่าเสียหายได้ด้วยซ้ำ..."
 court_amenities_interactions.0001.a:0 ""แล้วท่านเล่าสวมใส่อะไรกันแน่?""
 court_amenities_interactions.0001.a.tt_success: "#positive_value ท่านปกป้องตัวเลือกเสื้อผ้าของท่านได้สำเร็จ#!"
 court_amenities_interactions.0001.a.tt_failure: "#negative_value ข้อโต้แย้งด้านการแต่งกายของท่านฟังไม่ขึ้น#!"
 court_amenities_interactions.0001.b:0 "ข้าจะยอมจ่ายด้วยศักดิ์ศรีของข้า..."
 court_amenities_interactions.0001.b.tt:0 "$religious_interaction.2400.b.tt$"
 court_amenities_interactions.0002.t:0 "การโต้วาทีด้านแฟชั่น"
 court_amenities_interactions.0002.desc_intro:0 "เราคงยืนโต้เถียงกันเรื่องกฎการ แต่งกายและการดูแลตนเองที่เหมาะสมนานหลายชั่วโมง ชี้ไม้ชี้มือใส่กันไปมาอย่างรุนแรง อ้างถึงกฎหมายโบราณที่น้อยคนในราชสำนักจะรู้ เมื่อควันแห่งการแสดงจางลง,"
 court_amenities_interactions.0002.desc_won.nakey:0 "ดูเหมือนว่าข้าจะเป็นฝ่ายชนะ!\n\n ด้วยเหตุนี้ [actor.GetName] จึงถูกบังคับให้สวมเสื้อผ้าของสามัญชนและซ่อนเร้นร่างกายที่ถูกละเลยอย่างน่าอับอายจากสายตาโลก"
 court_amenities_interactions.0002.desc_won:0 "ดูเหมือนว่าข้าจะเป็นฝ่ายชนะ!\n\n ด้วยเหตุนี้ [recipient.GetName] จึงถูกบังคับให้เปลื้องผ้าจนเหลือเพียงชุดชั้นใน [recipient.GetHerHis]! ทุกคนในราชสำนักได้เห็น [recipient.GetHerHim] ในสภาพที่ [ROOT.Char.GetFaith.CreatorName] สร้าง [recipient.GetHerHim] มา!"
 court_amenities_interactions.0002.desc_lost.nakey:0 "ข้าตกใจที่พบว่าแท้จริงแล้วข้าละเมิดกฎหมาย!\n\n เป็นครั้งแรกในชีวิตที่ข้ารู้สึกอับอายในร่างกายที่ [ROOT.Char.GetFaith.CreatorName] ประทานให้ และขณะที่ข้ารู้สึกว่าความเปลือยเปล่าของตนกลายเป็นเรื่องน่าอับอาย ทหารยามและสไตลิสต์ใกล้เคียงก็เข้ามาสวมใส่เสื้อผ้าสามัญชนสกปรกให้ข้า"
 court_amenities_interactions.0002.desc_lost:0 "ข้าตกใจที่พบว่าแท้จริงแล้วข้าละเมิดกฎหมาย!\n\n ข้ายืนอับอายขณะที่ทหารยามและสไตลิสต์แห่งปราสาท [debate_locale.GetNameNoTierNoTooltip] เปลื้องผ้าข้าจนเหลือ แต่ชุดชั้นในแล้วยังเปลื้องต่อไปอีก! เมื่อถูกเปิดเผยต่อราชสำนัก ข้าจึงหนีออกจากที่เกิดเหตุพร้อมกับความอัปยศอดสู"
 court_amenities_interactions.0002.a_won:0 "ฮ่า! ช่างน่าขันสิ้นดี!"
 court_amenities_interactions.0002.a_lost.humble:0 "ให้พวกเขาเห็นไป ข้าไม่มีความอาย"
 court_amenities_interactions.0002.a_lost.lustful:0 "ปกติข้าสงวนเกียรตินี้ไว้ให้ชู้รักของข้า"
 court_amenities_interactions.0002.a_lost:0 "ข้าคงมิอาจสู้หน้าใครได้อีก"
 court_amenities_interactions.0003.desc_won.nakey:0 "ดูเหมือนว่าข้าจะเป็นฝ่ายชนะ!\n\n ด้วยเหตุนี้ [actor.GetName] จึงถูกบังคับให้สวมเสื้อผ้าของสามัญชนและซ่อนเร้นร่างกายที่ถูกละเลยอย่างน่าอับอายจากสายตาโลก"
 court_amenities_interactions.0003.desc_won:0 "ดูเหมือนว่าข้าจะเป็นฝ่ายชนะ!\n\n ด้วยเหตุนี้ [actor.GetName] จึงถูกบังคับให้เปลื้องผ้าจนเหลือเพียงชุดชั้นใน [actor.GetHerHis]! ทุกคนในราชสำนักได้เห็น [actor.GetHerHim] ในสภาพที่ [ROOT.Char.GetFaith.CreatorName] สร้าง [actor.GetHerHim] มา!"
 court_amenities_interactions.0004.desc:0 "ดูเหมือนว่าการละเมิดกฎหมายของ [victim.GetNameNoTooltip] เป็นอาชญากรรมที่ต้องระวางโทษสูงสุดตามกฎหมายของ [debate_locale.GetNameNoTierNoTooltip]! นั่นหมายความว่าข้าสามารถคุมขัง [victim.GetNameNoTooltip] ได้! แม้จะไม่ใช่ผลลัพธ์ที่ข้าคาดหวัง แต่นี่ ทำให้ข้าอยู่ในตำแหน่งที่ทรงอำนาจอย่างแน่นอน!"
 court_amenities_interactions.0004.a:0 "บางทีข้าอาจจะมองข้ามการละเมิดนี้ไป เพื่อแลกกับบุญคุณ..."
 court_amenities_interactions.0004.b:0 "[victim.GetSheHe|U] คงดูดีกว่าในชุดนักโทษ!"

