 end_war_attacker_white_peace_interaction:0 "$end_war_attacker_victory_interaction$"
 end_war_attacker_defeat_interaction:0 "$end_war_attacker_victory_interaction$"
 end_war_attacker_victory_attacker_desc:0 "\nเป็นที่ประจักษ์แก่ทุกคนแล้วว่าข้าเหนือกว่าท่าน เหตุใดยังคงต่อต้าน? การเรียนรู้ที่จะยอมรับชะตากรรมของตนนั้นมีเกียรติอยู่บ้าง"
 end_war_attacker_victory_defender_desc:0 "\nท่านเอาชนะข้าได้แล้ว ข้ามิอาจต่อต้านได้อีกต่อไป — ข้าขอยอมจำนนต่อท่านและกองทัพของท่าน ณ บัดนี้ เพียงขอให้ข้ายังคงรักษาเกียรติไว้ได้"
 end_war_attacker_white_peace_attacker_desc:0 "\nบัดนี้เป็นที่ประจักษ์แก่ข้าแล้วว่าข้าทำผิดพลาดที่โจมตีท่าน เลือดได้หลั่งไหลในสงครามนี้มากพอแล้ว — ให้เรายุติการต่อสู้อันไร้จุดหมายนี้เถิด"
 end_war_attacker_white_peace_defender_desc:0 "\nเลือดได้หลั่งไหลในสงครามอันไร้จุดหมายของท่านนี้ยังไม่พออีกหรือ? เราทั้งสองมิได้ประโยชน์อันใดจากการสู้รบต่อไป ให้เราสร้างสันติภาพเถิด"
 end_war_attacker_defeat_attacker_desc:0 "\nข้าหวังว่าข้ารู้ว่าสิ่งใดดลใจให้ข้าคิดว่าข้าสามารถเอาชนะศัตรูที่น่าเกรงขาม เช่นท่านในการต่อสู้ได้ อนิจจา ข้ามิอาจเปลี่ยนแปลงอดีตได้ มีเพียงอนาคตเท่านั้น\n\nข้ายอมจำนนต่อท่าน — ให้เราก้าวผ่านความขัดแย้งนี้ไปเถิด"
 end_war_attacker_defeat_defender_desc:0 "\nท่านอาจคิดว่าท่านสามารถเอาชนะข้าได้ แต่ข้าได้พิสูจน์แล้วว่าท่านคิดผิด อย่า ทำให้เรื่องนี้ยุ่งเหยิงไปกว่าที่เป็นอยู่ — ยอมจำนนเสีย และให้เรายุติสงครามนี้"
