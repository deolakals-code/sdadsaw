 char_interaction.0261.desc:0 "ด้วยอำนาจที่ได้รับมอบหมายจาก [intermediary.GetTitledFirstName] ข้าขอเพิกถอนการปกครองที่ไม่ถูกต้องตามกฎหมายของท่านเหนือ [landed_title.GetName] ณ บัดนี้ ท่านจะต้องสละบรรดาศักดิ์ให้ข้าดูแลแทนราชบัลลังก์ โดยให้มีผลทันที"
 char_interaction.0261.a:0 "เป็นการใช้อำนาจในทางที่ผิดอย่างร้ายแรง!"

 char_interaction.0262.desc:0 "[intermediary.GetTitledFirstName] จะต้องได้รับทราบเรื่องนี้ แต่ $char_interaction.0199.desc$ "
 char_interaction.0262.a:0 "[intermediary.GetSheHe|U] ทราบเรื่องแล้ว"

 char_interaction.0263.desc:0 "ท่านไม่ใช่ [intermediary.GetTitleAsNameNoTooltip] และข้าไม่ยอมก้มหัวให้กับความต้องการอันหยุมหยิมของท่าน หากท่านต้องการ [landed_title.GetName] ท่านจะต้องใช้กำลังยึดเอาไป"
 char_interaction.0263.result.criminal:0 "หาก [actor.GetShortUINameNoTooltip] [Select_CString(actor.IsLocalPlayer, 'ยอมถอย', 'ยอมถอย' )]"
 char_interaction.0263.result.war:0 "หาก [actor.GetShortUINameNoTooltip] [Select_CString(actor.IsLocalPlayer, 'ยืนยัน', 'ยืนยัน' )] การอ้างสิทธิ์"
 char_interaction.0263.a:0 "เช่นนั้นก็ถือเป็นการกบฏ"
 char_interaction.0263.a.tt:0 "อาชญากรรมของท่านถูกรายงานไปยัง [intermediary.GetTitledFirstName]"
 char_interaction.0263.b:0 "เจ้าคิดว่าข้าแค่ขู่รึ? เช่นนั้นก็ทำสงครามกัน!"

 char_interaction.0271.desc:0 "ด้วยอำนาจแห่งตำแหน่งที่ได้รับมอบหมายจาก [intermediary.GetTitledFirstName] ข้ากำลังแก้ไขความไม่สอดคล้องเล็กน้อยในพรมแดนของอาณาจักร\n\nท่านได้รับคำสั่งให้ยอมมอบความเป็นข้าหลวงของ [intermediary.GetTitledFirstName] ให้แก่เจ้าเหนือหัวโดยชอบธรรมของ [intermediary.GetHerHis] ซึ่งก็คือข้า"
 char_interaction.0271.a:0 "ข้ามิอาจปฏิเสธได้ แต่หากข้า #EMP ทำได้#!..."

 char_interaction.0272.desc:0 "ท่านก้าวล่วงขอบเขตอำนาจของท่าน แต่ข้ามิอาจขัดขืนตำแหน่งของ [intermediary.GetTitleAsName] ของข้าได้ แม้จะเป็นเพียง #EMP ท่าน#! ที่ใช้อำนาจนั้นก็ตาม\n\nข้ายอมรับการเพิกถอนข้าหลวงของข้า"
 char_interaction.0272.a:0 "ท่านไม่เคยมีทางเลือกอยู่แล้ว [recipient.GetFirstNameNoTooltip]"

 char_interaction.0273.desc:0 "ข้าได้สาบานว่าจะปกป้องข้าหลวงของข้า และนั่น รวมถึงการปกป้องจากการปล้นสะดมของพวกอย่าง #EMP ท่าน#! ด้วย\n\nท่านสามารถแย่งชิง [intermediary.GetTitledFirstName] และดินแดนของ [intermediary.GetHerHis] ไปจากข้าด้วยการรบ หรือจะหนีกลับไปยังรูที่ถูก [recipient.GetFaith.random_GoodGodNames] ทอดทิ้งที่ท่านซ่อนตัวอยู่ก็ได้"
 char_interaction.0273.result.criminal:0 "$char_interaction.0263.result.criminal$"
 char_interaction.0273.result.war:0 "$char_interaction.0263.result.war$"
 char_interaction.0273.a:0 "เจ้าจะต้องเสียใจภายหลัง [recipient.GetFirstNameNoTooltip]"
 char_interaction.0273.a.tt:0 "$char_interaction.0263.a.tt$"
 char_interaction.0273.b:0 "ช่างเป็นคำเชิญที่ #EMP น่าพึงพอใจ#! เสียจริง!"


 char_interaction.0281.desc:0 "ด้วยอำนาจแห่งตำแหน่งที่ [intermediary.GetTitledFirstName] มอบให้ข้า ข้าขอจับกุมท่านในข้อสงสัยว่ามีกิจกรรมอันชั่วร้าย\n\nจงยอมจำนนต่อทหารของข้า หรือเผชิญกับการลงโทษ"
 char_interaction.0281.a:0 "ข้าไม่มีทางเลือก"

 char_interaction.0282.desc:0 "การกระทำของข้าต่างหากที่เป็นอาชญากรรม มิใช่ข้อเรียกร้องของท่าน\n\nเพื่อประโยชน์ของอาณาจักร ข้าจะปฏิบัติตาม แต่จงรู้ไว้ว่าข้าจะไม่ลืมการดูหมิ่นครั้งนี้"
 char_interaction.0282.a:0 "ข้าแสดงท่าทีตอนไหนว่าอยากให้ท่าน #EMP ลืม#!?"

 char_interaction.0283.desc:0 "มอบตัวให้ท่านเมตตา? ข้าไม่คิด เช่นนั้น หากท่านต้องการโยนข้าเข้าคุก ท่านก็มาจับข้าด้วยตนเองสิ\n\nแต่ถ้าท่านยืนกราน บางทีข้า #EMP อาจจะ#! ไปหาท่านก็ได้... หากท่านอนุญาตให้ข้าพา #EMP สหาย#! ไปด้วยสักสองสามคน"
 char_interaction.0283.a:0 "เจ้าจะต้องเสียใจในที่สุด"
 char_interaction.0283.a.tt:0 "$char_interaction.0263.a.tt$"
 char_interaction.0283.b:0 "ข้าไม่คิดว่าท่านเข้าใจ นี่ไม่ใช่คำร้องขอ"

 char_interaction.0291.desc.positive:0 "แม้ข้าจะเชื่อมั่นในตัวท่านว่าจะรักษาผลประโยชน์ของข้า แต่ท่านได้ทำผิดพลาดในครั้งนี้ [recipient.GetTitledFirstName] เป็นข้ารับใช้ที่ภักดีและมีค่า ท่านควรหันไปสนใจเรื่องอื่น"
 char_interaction.0291.desc.negative:0 "เจ้าทำอะไร #EMP ถูกต้อง#! บ้างไหม? คนโง่ที่เชื่องช้าที่สุดในแผ่นดินก็ยังมองเห็นว่า [recipient.GetTitledFirstName] ไม่ใช่สิ่งที่เจ้าควรให้ความสนใจ หยุดรังแกข้าหลวงที่ดีกว่า แล้วไปทำงานของเจ้าซะ"
 char_interaction.0291.desc.neutral:0 "ในขณะนี้ การอนุญาตให้กระทำการนี้ไม่เป็นประโยชน์ต่อข้า ข้าเชื่อว่าท่านเข้าใจและจะปกครองอย่างมีเกียรติต่อไปในนามของข้า"
 char_interaction.0291.a:0 "ข้ามั่นใจว่าเจ้าเหนือหัวของข้ารู้ดีที่สุด"
 char_interaction.0291.b:0 "เจ้าเด็กไร้มารยาท!"
 char_interaction.0291.c:0 "เจ้าคนโง่น้ำลายไหล!"
 char_interaction.0291.d:0 "เจ้าคนโง่เงอะงะ!"
 char_interaction.0291.e:0 "ข้า. เกลียด. #EMP [intermediary.GetWomanMan|U] ผู้นี้.!"
 char_interaction.0291.f:0 "เจ้า #EMP สารเลว#! นั่น"
 char_interaction.0291.g:0 "ข้าหวังว่าเจ้าจะเน่าเปื่อยในที่คุมขัง!"
 char_interaction.0291.h:0 "[intermediary.GetSheHe|U] คงไม่หยุดข้าในครั้งต่อไปแน่..."

