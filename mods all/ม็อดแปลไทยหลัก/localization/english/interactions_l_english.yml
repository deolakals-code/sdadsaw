 council_interaction.0011.desc:0 "ระยะหลังมานี้ สติปัญญาของข้าถูกดึงไปหลายทาง และข้าพยายามอย่างยิ่งที่จะดูแลรับผิดชอบทุกอย่าง\n\nจำต้องมีบางอย่างที่ต้องปล่อยวาง และข้าเชื่อว่าจะเป็นการดีที่สุดสำหรับเราทั้งสอง หากข้าจะลาออกจากตำแหน่ง [council_task.GetPositionName]"
 council_interaction.0011.a:0 "นี่เป็นเรื่องน่าเสียดาย"

