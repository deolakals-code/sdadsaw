 council_interaction.0001.desc:1 "ข้ารู้สึกเป็นเกียรติอย่างยิ่งต่อคำขอของท่านที่ให้ข้ารับใช้ในตำแหน่ง [sender.GetActiveCouncilTask.GetPositionName] ของท่าน"
 council_interaction.0001.desc.accept:0 "ข้าจะเริ่มปฏิบัติหน้าที่ตามความรับผิดชอบใหม่ทันที และจะเข้าเฝ้าท่านในการประชุมสภาครั้งถัดไป!"
 council_interaction.0002.desc.refuse:0 "น่าเสียดายที่ภาระหน้าที่ปัจจุบันของข้า ทำให้ข้าไม่มีเวลาพอที่จะรับงานเพิ่มเติม ดังนั้นข้าเสียใจที่ต้องปฏิเสธข้อเสนอของท่าน"
