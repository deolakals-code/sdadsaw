 invite_to_council_position_interaction:0 "คำเชิญเข้ารับตำแหน่งในสภา"
 liege_offer_council_position_exchange:1 "\nข้าได้พิจารณาแล้วเห็นว่าจำเป็นต้องจัดระเบียบสภาขุนนางของข้าใหม่ มีผลบังคับใช้ทันที ท่านจะเปลี่ยนไปรับใช้ข้าในตำแหน่ง [target.GetPositionName] แทน\n"
 liege_offer_council_position_liked:1 "\nท่านเป็นข้ารับใช้ผู้ภักดีและอุทิศตนเสมอมา และข้าปรารถนาจะตอบแทนความดีความชอบของท่าน\n\nเพื่อเป็นการระลึกถึงการนี้ ข้าขอมอบตำแหน่ง [target.GetPositionName] แห่ง [actor.GetPrimaryTitle.GetNameNoTierNoTooltip] ให้แก่ท่าน ณ บัดนี้\n"
 liege_offer_council_position_powerful:1 "\nในฐานะ [recipient.GetTitleAsNameNoTooltip] ผู้ทรงอิทธิพล เป็นธรรมแล้วที่ท่านควรมีสิทธิ์มีเสียงในสภาขุนนางของข้า\n\nเพื่อเป็นการยอมรับข้อเท็จจริงนี้ ข้าขอมอบตำแหน่ง [target.GetPositionName] แห่ง [actor.GetPrimaryTitle.GetNameNoTierNoTooltip] ให้แก่ท่าน ณ บัดนี้\n"
 liege_offer_council_position_disliked:1 "\nข้าได้ข้อสรุปอันมิอาจหลีกเลี่ยงได้ว่า ท่านคือผู้เหมาะสมที่สุดที่ข้ามีสำหรับตำแหน่งในสภาขุนนางที่ว่างลง\n\nแม้จะสร้างความเจ็บปวดใจให้ข้าที่ต้องกระทำ เช่นนี้ แต่น่าเสียดายที่ข้าจำต้องมอบตำแหน่ง [target.GetPositionName] แห่ง [actor.GetPrimaryTitle.GetNameNoTierNoTooltip] ให้แก่ท่าน\n"
 liege_offer_council_position_skilled:1 "\nความสามารถอันโดดเด่นของท่านมิได้ถูกมองข้ามไป [recipient.GetFirstNameNoTooltip]\n\nเพื่อเป็นการยอมรับในทักษะของท่าน ข้าใคร่ขอมอบตำแหน่ง [target.GetPositionName] แห่ง [actor.GetPrimaryTitle.GetNameNoTierNoTooltip] ให้แก่ท่าน\n"
 liege_offer_council_position_fallback:1 "\nโชคชะตายิ้มให้ท่านแล้ว [recipient.GetFirstNameNoTooltip] เพราะข้าพบว่าตนเองต้องการ [target.GetPositionName] คนใหม่ และท่านคือผู้เดียวที่ข้ามีอยู่\n\nข้าเชื่อว่าท่านจะรับตำแหน่งนี้?\n"
 auto_accept_interaction_ai:1 "เป็นประโยชน์สูงสุดของ [TARGET_CHARACTER.GetFirstNamePossessiveNoTooltip]"

