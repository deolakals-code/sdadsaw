 RELIGIOUS_HEAD_ASK_GOLD:1 "ในฐานะ [actor.GetFaith.GetAdherentName] ผู้ศรัทธา ข้าพบว่าตนเองถูกขัดขวางจากการทำความดี เนื่องจากขาดเงินทุน ท่านพอจะแบ่งปันให้ข้าบ้างได้หรือไม่ เพื่อที่ข้าจะได้ปฏิบัติตามพระประสงค์ของพระเจ้า?"
 RELIGIOUS_HEAD_ASK_CLAIM:1 "[secondary_recipient.GetShortUIName|U] ไม่ได้รักษาคุณค่าแห่งศรัทธาของเราไว้ และ [actor.GetFaith.GetAdherentNamePlural] ใน [target.GetNameNoTier] ก็ต้องทนทุกข์ เพราะเหตุนั้น ท่านจะให้พรแก่ข้าเพื่อปลดปล่อยดินแดนเหล่านั้นจากการปกครองที่ผิดพลาดของ [secondary_recipient.GetHerHis] หรือไม่?"
 RELIGIOUS_HEAD_ASK_HOLY_WAR_TARGET:0 "แม้ความกระตือรือร้นจะเป็นสิ่งที่น่าอิจฉา แต่เราก็ต้องปฏิบัติจริงหากต้องการให้ศรัทธาของเราได้รับชัยชนะ จะไม่ฉลาดกว่าหรือหากจะ ทำให้ [target.GetNameNoTier] เป็นเป้าหมายของสงครามศักดิ์สิทธิ์ของเรา?"
 ASK_TO_TAKE_VOWS:0 "ข้าเชื่อว่าเป็นการดีที่สุดสำหรับท่านที่จะเข้าสู่พันธสัญญาทางสงฆ์ แม้ข้าจะไม่สามารถบังคับท่านได้ แต่ท่านก็ควรพิจารณาเรื่องนี้อย่างจริงจัง..."
 SEND_GIFT_PROPOSAL:0 "โปรดรับของขวัญอันน้อยนิดนี้ แม้จะไม่มาก แต่ข้าหวังว่าจะเป็นประโยชน์ เพื่อมิตรภาพที่ยั่งยืนของเรา!"
 SEND_GIFT_ACCEPT:0 "ข้ายอมรับของขวัญของท่าน!"
 SEND_GIFT_REJECT:0 "ข้าปฏิเสธการกุศลของท่าน"

 call_ally.0001.opening:0 "[actor.Custom2('AppropriateGreeting', ROOT.Char)]"
 call_ally.0001.desc:0 "ข้าขอเรียกร้องให้ท่านให้เกียรติ [alliance|E] ของเราและเข้าร่วม [target.GetName]!"
 call_ally.0001.a:0 "สู่สงคราม!"

 call_ally.0100.opening:0 "[recipient.Custom2('AppropriateGreeting', ROOT.Char)]"
 call_ally.0100.desc:0 "แน่นอน ข้าจะเข้าร่วมสงครามกับท่าน! ศัตรูของเราจะได้เรียนรู้ที่จะหวาดกลัว [recipient.Custom('WomenMenPeople_GenderPreference')] แห่ง [recipient.GetPrimaryTitle.GetNameNoTierNoTooltip]!"

 call_ally.0101.desc:0 "น่าเสียดาย ข้าไม่อยู่ในฐานะที่จะเข้าไปพัวพันกับสงครามของท่านได้"
 call_ally.0101.a:0 "ช่างเป็น [recipient.Custom2('InsultNoun', ROOT.Char)] [recipient.Custom2('InsultAdjective', ROOT.Char)] เสียจริง!"

 char_interaction.0001.opening:1 "[recipient.Custom2('AppropriateGreeting', actor )]"
 char_interaction.0001.desc:0 "ข้ายอมรับข้อเสนอการเป็นข้าหลวงอันมีเกียรติของท่าน นายเหนือหัวของข้า!"

 char_interaction.0002.desc:0 "ข้าไม่ต้องการการคุ้มครองจากท่านและต้องการเก็บเกี่ยวผลประโยชน์จากอาณาจักรของข้าไว้เอง"
 char_interaction.0002.a:0 "ข้าคงต้องสำรวจทางเลือกอื่น..."

 char_interaction.0010.opening:0 "[recipient.Custom2('AppropriateGreetingPositive', actor )]"
 char_interaction.0010.desc:0 "[actor.GetFirstName] ข้าคิดว่านี่คือจุดเริ่มต้นของความสัมพันธ์ข้าหลวงที่งดงาม!"
 char_interaction.0010.a:0 "นายเหนือหัวของข้า!"
 
 char_interaction.0011.desc:0 "แม้ข้าจะซาบซึ้งในข้อเสนอความจงรักภักดีของท่าน แต่ข้าไม่สามารถยอมรับได้"
 char_interaction.0011.a:0 "น่าเสียดายนัก"

 char_interaction.0020.opening:2 "[actor.Custom2('AppropriateGreetingNegative', recipient)]"
 char_interaction.0020.desc:1 "ในฐานะประมุขราชวงศ์ ข้าขอประกาศตัดขาดและตัดสิทธิ์ท่านจากการสืบทอดมรดก! ท่านจะไม่ได้รับมรดกบรรดาศักดิ์ใดๆ จากสมาชิกคนใดในราชวงศ์ [actor.GetDynastyName]"
 char_interaction.0020.a:0 "อะไรนะ? ทำไม!?"

 char_interaction.0030.opening:0 "[actor.Custom2('AppropriateGreetingPositive', recipient)]"
 char_interaction.0030.desc:1 "ในฐานะประมุขราชวงศ์ ข้าขอคืนสิทธิ์ในการสืบทอดบรรดาศักดิ์จากสมาชิกในราชวงศ์ [actor.GetDynastyName] ให้แก่ท่าน!"
 char_interaction.0030.a:0 "ข้าซาบซึ้งยิ่งนัก!"

 char_interaction.0040.desc:1 "ในฐานะประมุขราชวงศ์ ข้าขอประณามท่านว่าเป็นคนเสเพลและเป็นความอัปยศต่อราชวงศ์ [actor.GetDynastyName] ทั้งหมด!"
 char_interaction.0040.a:0 "อะไรนะ? ทำไม!?"

 char_interaction.0041.desc: "พฤติกรรม [recipient.Custom2('InsultBehavior', SCOPE.sC('actor'))] และเสื่อมโทรมของเจ้า นำความอัปยศมาสู่ตระกูล [actor.GetHouse.GetBaseName] ทั้งหมด — และในฐานะประมุขแห่งตระกูล ข้าเห็นเป็นหน้าที่ที่จะต้องแจ้งให้สมาชิกตระกูลที่เหลือทราบถึงวิถีอัน [recipient.Custom2('InsultAdjective', SCOPE.sC('actor'))] ของเจ้า\n\nขอแสงสว่างแห่ง [actor.GetFaith.HighGodNamePossessive] นำทางเจ้ากลับสู่เส้นทางอันดีงาม... แม้ข้าจะสงสัยว่ามันจะเป็นไปได้ก็ตาม"
 char_interaction.0041.a: "การใส่ร้าย!"

 char_interaction.0042.desc: "ท่านทั้ง [recipient.Custom('FormalComplimentAdjective')] และ [recipient.Custom('ComplimentAdjective')] เป็นแรงบันดาลใจให้แก่ตระกูล [actor.GetHouse.GetBaseName] ทั้งหมด — และในฐานะประมุขตระกูล เป็นหน้าที่ของข้าที่จะยกย่องคุณธรรมของท่านให้แก่เครือญาติทั้งหมด!\n\nขอให้ท่านคงอยู่ในพระคุณของ [actor.GetFaith.HighGodNamePossessive]"
 char_interaction.0042.a: "น่ายินดียิ่ง!"

 char_interaction.0050.desc:1 "ในฐานะประมุขราชวงศ์ ข้าขออภัยโทษต่อการกระทำผิดในอดีตของท่านและถอนการประณามท่านในหมู่สมาชิกราชวงศ์ [actor.GetDynastyName]!"
 char_interaction.0050.a:0 "ความยุติธรรมได้รับการปฏิบัติแล้ว!"

 char_interaction.0060.desc:1 "ข้าค่อนข้างชอบ [target.GetName] ดังนั้น ในฐานะประมุขราชวงศ์ของท่าน ข้าตัดสินใจที่จะอ้างสิทธิ์เหนือมัน จงเข้าใจความหมายตามที่ท่านเห็นสมควร"
 char_interaction.0060.a:0 "นี่คงไม่ดีแน่"

 char_interaction.0070.opening:0 "[actor.Custom2('AppropriateGreeting', recipient )]"
 char_interaction.0070.desc:1 "การต่อสู้ภายในราชวงศ์ [actor.GetDynastyName] นี้ไม่เหมาะสมและต้องยุติลงทันที ในฐานะประมุขราชวงศ์ ข้าขอประกาศสันติภาพสีขาวระหว่างท่านและศัตรูของท่านในราชวงศ์!"
 char_interaction.0070.a:0 "ช่างเป็นผู้สอดรู้สอดเห็นที่ทนไม่ได้เสียจริง!"

 char_interaction.0071.desc:2 "การต่อสู้ภายในราชวงศ์ [actor.GetDynastyName] นี้ไม่เหมาะสมและต้องยุติลงทันที ในฐานะประมุขราชวงศ์ ข้าได้สั่งให้ [recipient.GetFullName] ยอมรับสันติภาพสีขาวกับท่าน"
 char_interaction.0071.a:0 "ข้าซาบซึ้งยิ่งนัก!"

 char_interaction.0078.desc_them:0 "ข้ารู้ว่าเราตกลงกันให้ [ward.GetTitledFirstName] ได้รับการศึกษาจากข้า แต่มีเรื่องอยู่ว่า... ข้ายุ่งอยู่กับผู้อยู่ในอุปถัมภ์คนอื่นๆ มากอยู่แล้ว ขออภัยด้วย"
 char_interaction.0078.desc:0 "ข้ารู้ว่าเราตกลงกันให้ [guardian.GetTitledFirstName] ให้การศึกษาแก่ [ward.GetTitledFirstName] แต่มีเรื่องอยู่ว่า... [guardian.GetSheHe|U] ยุ่งอยู่กับผู้อยู่ในอุปถัมภ์คนอื่นๆ มากอยู่แล้ว ขออภัยด้วย"
 char_interaction.0078.a:0 "ช่างเป็นการดูหมิ่นอะไร เช่นนี้...!"

 char_interaction.0079.desc_them:0 "ข้าคิดว่าเราตกลงกันให้ท่านให้การศึกษาแก่ [ward.GetTitledFirstName] แต่ตอนนี้ข้าได้ยินว่าท่านมีงานล้นมือกับผู้อยู่ในอุปถัมภ์คนอื่นๆ?! น่าละอายนัก"
 char_interaction.0079.desc: "ข้าคิดว่าเราตกลงกันแล้วให้ [guardian.GetTitledFirstName] อบรมสั่งสอน [ward.GetTitledFirstName] แต่บัดนี้ข้าได้ยินมาว่า [guardian.GetSheHe] มีมือของ[guardian.GetHerHis]เต็มไปด้วยภาระดูแลผู้อยู่ในอุปการะคนอื่น ๆ?! น่าละอายนัก"
 char_interaction.0079.a:0 "ข้าอาจทำผิดพลาดไป..."

 char_interaction.0080.desc:0 "ข้ายินดีให้ [guardian.GetShortUINameNoFormat] ให้การศึกษาแก่ [ward.GetShortUINameNoFormat] [ward_liege.Custom2('RelationToMeShort', SCOPE.sC('ward'))] ของข้า – การเลี้ยงดูอันสูงส่งสำหรับจิตวิญญาณอันสูงส่ง!"
 char_interaction.0080.desc_self:0 "ข้ายินดีให้ท่านให้การศึกษาแก่ [ward.GetShortUINameNoFormat] [ward_liege.Custom2('RelationToMeShort', SCOPE.sC('ward'))] ของข้า – การเลี้ยงดูอันสูงส่งสำหรับจิตวิญญาณอันสูงส่ง!"
 char_interaction.0080.desc_guardian_self_ward: "ข้ายินดีให้การศึกษาแก่ท่าน – การเลี้ยงดูอันสูงส่งสำหรับจิตวิญญาณอันสูงส่ง!"
 char_interaction.0080.desc_guardian_self: "ข้ายินดีให้การศึกษาแก่ [ward.GetShortUIName] [ward_liege.Custom2('RelationToMeShort', SCOPE.sC('ward'))] ของท่าน – การเลี้ยงดูอันสูงส่งสำหรับจิตวิญญาณอันสูงส่ง!"
 char_interaction.0080.desc_guardian: "ข้ายินดีให้ [guardian.GetShortUINameNoFormat] [guardian_liege.Custom2('RelationToMeShort', SCOPE.sC('guardian'))] ของข้า ให้การศึกษาแก่ [ward.GetShortUINameNoFormat] – การเลี้ยงดูอันสูงส่งสำหรับจิตวิญญาณอันสูงส่ง!"
 char_interaction.0080.desc_ward_selfaccept: "ข้าพเจ้ายินดียิ่งที่ท่านจะอบรมสั่งสอนข้าพเจ้า — การอบรมเลี้ยงดูอย่างสูงส่งเพื่อจิตวิญญาณอันสูงส่ง!"

 char_interaction.0081.desc:0 "น่าเสียดาย เราไม่ชอบการจัดการศึกษาที่ท่านเสนอ"
 char_interaction.0081.a:0 "น่าเสียดายจริงๆ"

 char_interaction.0082.t: "อาจารย์ของข้า"
 char_interaction.0082.intro: "[guardian.GetTitledFirstName] ได้เดินทางมาถึงจาก [guardian_liege.GetPrimaryTitle.GetNameNoTierNoTooltip] แล้ว พร้อมกับตำราและม้วนคัมภีร์มากมาย"
 char_interaction.0082.desc.liege: "\n\n[guardian.GetSheHe|U] บอกข้าว่าบทเรียนของ [ward.GetFirstNamePossessiveNoTooltip] จะเริ่มในไม่ช้า!"
 char_interaction.0082.desc: "\n\n[guardian.GetSheHe|U] บอกข้าว่าบทเรียนของข้าจะเริ่มในไม่ช้า!"
 char_interaction.0082.a: "ดีมาก"

 char_interaction.0083.t: "จิตใจที่รอการหล่อหลอม"
 char_interaction.0083.intro: "[ward.GetTitledFirstName] ผู้อ่อนเยาว์"
 char_interaction.0083.not_related: "[ward_liege.Custom2('RelationToMeShort', SCOPE.sC('ward'))] ของ [ward_liege.GetTitledFirstNamePossessive]"
 char_interaction.0083.related: "[ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('ward'))] ของข้า"
 char_interaction.0083.outro: "ได้เดินทางมาถึงจาก [ward_liege.GetPrimaryTitle.GetNameNoTierNoTooltip] เพื่อรับการศึกษาของ [ward.GetHerHis] ในที่สุด"
 char_interaction.0083.desc.host: "\n\n[guardian.GetTitledFirstName] จะเริ่มบทเรียนของ [guardian.GetHerHis] ในไม่ช้า"
 char_interaction.0083.desc: "\n\nเมื่อ [ward.GetSheHe] ปรับตัวได้แล้ว บทเรียนจะเริ่มขึ้น"
 char_interaction.0083.a: "ยอดเยี่ยม"

 char_interaction.0084.desc: "[ward.GetTitledFirstName] [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('ward'))] ของท่าน ได้เดินทางมาถึง [guardian_liege.GetPrimaryTitle.GetNameNoTierNoTooltip] อย่างปลอดภัยแล้ว และข้าจะเริ่มบทเรียนของ [ward.GetHerHis] โดยทันที"
 char_interaction.0084.a: "ดีมาก"

 char_interaction.0090.from_ward.desc:0 "ข้าเกรงว่าการศึกษาของข้าในราชสำนักของท่านไม่เหมาะกับความต้องการของข้าอีกต่อไป ข้าจะกลับไปยัง [capital.GetNameNoTierNoTooltip] ทันที"
 char_interaction.0090.two_wards.desc:0 "ข้าเกรงว่าการศึกษาของ [ward.GetTitledFirstName] และ [ward_2.GetTitledFirstName] ในราชสำนักของท่านไม่เหมาะกับความต้องการของเราอีกต่อไป พวกเขาจึงถูกเรียกกลับมาอยู่ในความดูแลของเรา ณ บัดนี้"
 char_interaction.0090.one_ward.desc:1 "ข้าเกรงว่าการศึกษาของ [ward.GetTitledFirstName] ในราชสำนักของท่านไม่เหมาะกับความต้องการของเราอีกต่อไป [ward.GetSheHe|U] จึงถูกเรียกกลับมาอยู่ในความดูแลของเรา ณ บัดนี้"
 char_interaction.0090.a:0 "ข้าควรจะรู้สึกถูกดูหมิ่นหรือไม่?"

 char_interaction.0100.desc:0 "สหายของข้า โปรดรับของขวัญอันน้อยนิดนี้เป็นเครื่องหมายแสดงความขอบคุณของข้า"
 char_interaction.0100.a:0 "ส่วนเสริมที่น่ายินดีแก่คลังสมบัติของข้า!"

 char_interaction.0110.desc:0 "ข้าขอมอบ [landed_title.GetName] ยศ ดินแดนอย่างเป็นทางการ และรายได้ที่เกี่ยวข้องให้แก่ท่าน ขอให้ท่านปกครองมันให้ดี!"
 char_interaction.0110.a:0 "อำนาจของข้าเพิ่มพูนขึ้น!"

 char_interaction.0111.desc: "ข้าขอ แต่งตั้งท่านให้ดำรงตำแหน่งผู้ว่าการ [landed_title.GetName] ขอให้ท่านพิสูจน์ตนเองว่าเป็นตัวแทนที่คู่ควรของ [actor.GetTitleAsNameNoTooltip] และบริหารจัดการให้ดี!"

 char_interaction.0120.desc:0 "หลังจากการพิจารณาอย่างถี่ถ้วน ข้าตัดสินใจที่จะ ทำให้ท่านเป็นทายาทตามกฎหมายของข้า อย่า ทำให้ข้าผิดหวัง เพราะยังไม่สายเกินไปที่ข้าจะเปลี่ยนใจ"
 char_interaction.0120.a:0 "นี่เป็นสิ่งที่ถูกต้องแล้ว!"

 char_interaction.0130.a:0 "ข้อตกลงที่ดี"

 char_interaction.0131.opening:0 "[recipient.Custom2('AppropriateGreetingNegative', actor )]"
 char_interaction.0131.desc:0 "ข้าเห็นว่าข้อเสนอของท่านไม่มีเหตุผลอย่างสิ้นเชิง จงทำสิ่งที่สมเกียรติและปล่อย [secondary_recipient.GetShortUIName] ไป"
 char_interaction.0131.desc_personal:0 "ข้ายอมเน่าตายในคุกใต้ดินของท่านดีกว่ายอมรับข้อเสนอค่าไถ่ที่ไม่สมเหตุสมผลของท่าน"
 char_interaction.0131.a:0 "ถึงเวลาลดปันส่วนอาหารของ [recipient.GetHerHis] แล้ว..."

 char_interaction.0140.desc:0 "ข้ายอมรับข้อเสนอค่าไถ่ของท่าน [secondary_recipient.GetShortUIName|U] จะถูกส่งคืนให้ท่านโดยทันที!"

 char_interaction.0141.desc:0 "ข้าเห็นว่าข้อเสนอค่าไถ่ของท่านค่อนข้างน่าผิดหวัง ข้าคิดว่าข้าจะเก็บ [secondary_recipient.GetShortUIName] ไว้ก่อนตอนนี้"
 char_interaction.0141.a:0 "สาปแช่ง [actor.Custom2('InsultNoun', ROOT.Char)] [actor.Custom2('InsultAdjective', ROOT.Char)] นั่น!"

 char_interaction.0150.desc:0 "ดีมาก ข้าจะปล่อยท่านไป แม้ข้าต้องยอมรับว่าข้าเริ่มชอบการอยู่ร่วมกับท่านแล้ว"

 char_interaction.0151.desc:0 "ข้าเกรงว่าข้าต้องปฏิเสธข้อเสนอค่าไถ่ของท่าน ท่านจะต้องทนการต้อนรับของข้าต่อไปอีกสักพัก"

 char_interaction.0160.desc:0 "ข้าไม่มีทางเลือกอื่นนอกจากยอมรับเงื่อนไขของท่านเพื่อการปล่อยตัวข้า"
 char_interaction.0160.desc_demand_conversion: "ข้าพเจ้าจะเปลี่ยนไปนับถือ [actor.GetFaith.GetName]"
 char_interaction.0160.desc_renounce_claims: "ข้าพเจ้าจะสละสิทธิ์ข้อเรียกร้องทั้งหมดที่มีต่อดินแดน [recipient.Custom2('InsultAdjective', actor)] ของท่าน"
 char_interaction.0160.desc_banish: "ข้าพเจ้าจะจากไปและไม่หวนกลับมาอีก"
 char_interaction.0160.desc_gain_hook: "ข้าพเจ้าจะเป็นหนี้บุญคุณท่าน"
 char_interaction.0160.desc_take_vows: "ข้าพเจ้าจะเข้าร่วมกับกลุ่ม [recipient.Custom('NunMonkPlural')]"
 char_interaction.0160.desc_become_executioner: "ข้าพเจ้าจะรับใช้ในฐานะเพชฌฆาตของท่าน"
 char_interaction.0160.desc_recruit: "ข้าพเจ้าจะเข้าร่วมราชสำนัก [recipient.Custom2('InsultAdjective', actor)] ของท่าน"
 char_interaction.0160.desc_demand_admin: "ข้าพเจ้าจะกลายเป็นส่วนหนึ่งในคณะบริหาร [recipient.Custom2('InsultAdjective', actor)] ของท่าน"
 char_interaction.0160.a:1 "ลาก่อน [recipient.GetFirstNameNoTooltip]..."
 char_interaction.0160.a.courtier:0 "ระวังตัวด้วยเล่า [recipient.GetFirstNameNoTooltip]..."

 char_interaction.0161.desc:0 "ข้ายอมเน่าตายในคุกใต้ดินของท่านดีกว่ายอมรับข้อเรียกร้องที่ไม่สมเหตุสมผลของท่าน"

 char_interaction.0170.t:0 "ช่วงเวลาที่ยากลำบาก"
 char_interaction.0170.desc:0 "ข้าถูกปลุก แต่เช้าตรู่โดยองครักษ์แปลกหน้าสองคน เมื่อถูกนำตัวออกไปข้างนอก ข้าไม่หลงคิดไปเองว่าอะไรจะเกิดขึ้น ขณะที่ข้าคุกเข่ารอเพชฌฆาตของ [actor.GetShortUINamePossessive] ข้าประสบกับช่วงเวลาแห่งความสงบและความกระจ่างแจ้งอันสมบูรณ์แบบ"
 char_interaction.0170.desc_burned:0 "ทันทีที่ข้ากินอาหารมื้อเล็กๆ เสร็จ ประตูก็กระแทกเปิดออก ข้าถูกจับและถูกกระทำอย่างหยาบคายออกไปข้างนอก มันจะไม่ใช่ความตายที่ง่ายดายสำหรับข้า – กองไฟถูกจุดขึ้นและข้าสัมผัสได้ถึงความร้อนที่ขาแล้ว ความเงียบสงัดเข้าปกคลุมฝูงชนขณะที่พวกเขามองดูช่วงเวลาสุดท้ายของข้าด้วยสีหน้าคลุ้มคลั่งบนใบหน้า"
 char_interaction.0170.desc_devoured:0 "ประตูกระแทกเปิดออก และองครักษ์ของ [actor.GetShortUINamePossessive] บังคับให้ข้าลงกับพื้นและกดข้าไว้ จากนั้น [actor.GetTitleAsNameNoTooltip] [actor.GetHerselfHimself] ก็เข้ามา พร้อมมีดในมือและรอยยิ้มกว้าง\n\nโดยไม่สนใจเสียงกรีดร้องของข้า [actor.GetSheHe] กรีดเนื้อข้าด้วยทั้งมีดและฟัน ผ่านม่านหมอก ข้าพบใบหน้าของ [actor.GetHerHis] เปื้อนเลือด – เปื้อนไปด้วยชิ้นส่วนของ #EMP ข้า#! – และอ้อนวอน แต่ขณะที่ [actor.GetSheHe] เคี้ยวและกลืนอย่างเอร็ดอร่อย ข้าก็ตระหนักว่านี่คือวิธีที่ข้าจะตาย"
 char_interaction.0170.desc_public:0 "เมื่อรุ่งสาง ข้าถูกปลุกอย่างหยาบคายโดยองครักษ์สองคนลากข้าออกไปข้างนอก\n\nขณะที่พวกเขานำข้าไปยังตะแลงแกงที่ยกสูงขึ้นกลางฝูงชนที่มาชุมนุมกัน หัวใจของข้าก็หล่นวูบ และขณะที่เพชฌฆาตของ [actor.GetShortUINamePossessive] ยิ้มให้ข้าและยกดาบหนักอึ้งของ [executioner.GetHerHis] ขึ้น ข้าก็สิ้นหวัง\n\nฝูงชนเงียบลงขณะที่เพชฌฆาตยืนค้ำข้าที่ถูกบังคับให้คุกเข่า และด้วยเสียงคำรามอย่างใช้แรงและเสียง #EMP ฟุ่บ#! ที่เกือบจะไร้เสียง ทุกอย่างก็มืดลง"
 char_interaction.0170.a:0 "สาปแช่งวิญญาณอันดำมืดของเจ้า [actor.GetFirstNameNoTooltip]!!!"
 char_interaction.0170.life_is_just_a_joke.a:0 "ชีวิต #EMP ก็#! แค่เรื่องตลกสินะ?"
 char_interaction.0180.desc:0 "ในฐานะประมุขตระกูลของท่าน ข้าตัดสินใจว่าท่านต้องเข้ารับ [actor.GetFaith.GetName] ซึ่งเป็นความเชื่อที่แท้จริงหนึ่งเดียว ข้าเกรงว่าท่านไม่มีทางเลือกในเรื่องนี้"
 char_interaction.0180.desc.liege:0 "ในฐานะนายเหนือหัวของท่าน ข้าเรียกร้องให้ท่านละทิ้งความเชื่อที่ผิดพลาดและเข้าร่วมกับข้าในฐานะ [actor.GetFaith.GetAdherentName] ร่วมกันทันที"
 char_interaction.0180.a:0 "ข้าคงต้องทำ เช่นนั้น"

 char_interaction.0181.desc:1 "ดีมาก ข้าจะเข้ารับความเชื่อ [actor.GetFaith.GetAdjective] แม้ว่าจะรู้สึกแปลกที่จะละทิ้งสิ่งที่คุ้นเคยมากมาย"

 char_interaction.0182.desc:0 "ข้าจะไม่มีวันละทิ้งศรัทธาของข้า และจะก่อตั้งตระกูลของข้าเองแทน!"
 char_interaction.0182.a:0 "น่าผิดหวังเสียจริง..."

 char_interaction.0190.desc:1 "ดีมาก ข้าจะเข้ารับความเชื่อ [actor.GetFaith.GetAdjective] แม้ว่าจะรู้สึกแปลกที่จะละทิ้งสิ่งที่คุ้นเคยมากมาย"
 char_interaction.0191.desc:0 "ศรัทธาของข้าคือแก่นแท้ของตัวตนข้า — ข้าจะไม่มีวันละทิ้งมัน"

 char_interaction.0200.desc:0 "ข้าได้ข้อสรุปว่าท่านไม่สามารถไว้วางใจในศักดิ์ศรีและความรับผิดชอบของ [landed_title.GetName] ได้ ดังนั้น ข้าจึงขอถอดถอนบรรดาศักดิ์นี้จากท่านเพื่อประโยชน์ส่วนรวมของอาณาจักร ณ บัดนี้"
 char_interaction.0200.a:0 "ข้าไม่อยากจะเชื่อเลย!"
 char_interaction.0201.desc:0 "[landed_title.GetName] เป็นของตระกูล [recipient.GetHouse.GetName] โดยชอบธรรม ข้าจะไม่สละมันไม่ว่าในกรณีใดๆ"
 char_interaction.0201.a:0 "[recipient.GetSheHe] กล้าดีอย่างไร!"
 char_interaction.0199.desc:0 "ข้าไม่เห็นทางเลือกอื่นนอกจากยอมรับการตัดสินใจของท่านที่จะถอดถอน [landed_title.GetName] จากข้า"
 char_interaction.0199.a:0 "ถูกต้องแล้ว"

 char_interaction.0211.desc:0 "ข้าซาบซึ้งอย่างแท้จริงในข้อเสนออันมีน้ำใจของท่านที่จะ ทำให้ [secondary_recipient.GetShortUIName] เป็นข้าหลวงของข้า แต่ข้าเกรงว่าข้าต้องปฏิเสธ"
 char_interaction.0211.a:0 "คนอกตัญญู!"

 char_interaction.0220.desc:0 "ข้ายอมรับการเรียกคืนข้าหลวงของข้า [secondary_recipient.GetShortUIName] แม้ข้าจะคิดว่าไม่ยุติธรรมก็ตาม"
 char_interaction.0220.a:0 "ดี"

 char_interaction.0221.desc:0 "ข้าไม่สามารถทรยศต่อคำสัตย์ปฏิญาณของ [secondary_recipient.GetShortUIName] ได้ ข้าจะปกป้องข้าหลวงของข้า แม้ว่าจะหมายถึงการละเมิดคำสัตย์ปฏิญาณที่ข้ามีต่อท่านก็ตาม"
 char_interaction.0221.a:0 "นี่คือการกบฏ!"

 char_interaction.0230.title:0 "คนทรยศ!"
 char_interaction.0230.desc.courtier:0 "[recipient.GetTitledFirstName] สามารถหลบหนีการจับกุมได้และได้หลบหนีไปยังชนบทแล้ว!"
 char_interaction.0230.desc.courtier_court_chaplain_stayed:0 "[recipient.GetTitledFirstName] สามารถหลบหนีการจับกุมได้ และการจะกล่าวว่า [recipient.GetSheHe] ไม่พอใจกับการกระทำของข้าก็คงจะเบาเกินไป"
 char_interaction.0230.a:0 "คนทรยศ!"
 char_interaction.0230.a_court_chaplain_stayed:0 "เอ่อ นี่มัน...น่าอึดอัดใจ"

 char_interaction.0231.title:0 "ความยุติธรรม"
 char_interaction.0231.desc_prison:0 "[recipient.GetTitledFirstName] ถูกจับกุมแล้วและรอคอยชะตากรรมของ [recipient.GetHerHis] อย่างปลอดภัยในคุกใต้ดินของข้า"
 char_interaction.0231.desc_house_arrest:0 "ตามคำสั่งของข้า [recipient.GetTitledFirstName] จะถูกกักบริเวณในบ้านของ [recipient.GetHerHis] ข้าได้ส่งองครักษ์บางส่วนไป เพื่อให้แน่ใจว่า [recipient.GetSheHe] ปฏิบัติตามการกักบริเวณในบ้าน"
 char_interaction.0231.desc_stockade:0 "ตามคำสั่งของข้า [recipient.GetTitledFirstName] จะถูกกักขังในคุกทหารของค่าย ที่ ซึ่ง [recipient.GetSheHe] กำลังรอคอยชะตากรรมของ [recipient.GetHerHis]"
 char_interaction.0231.a:0 "ดี"

 char_interaction.0232.desc:0 "ข้าทนทุกข์กับการถูกหยามเกียรติด้วยน้ำมือของ [actor.GetTitledFirstName] มานานเกินไปแล้ว\n\n"
 char_interaction.0232.liege: "ข้าจะไม่นิ่งดูดาย ในขณะที่เจ้านายของเราข่มเหงข้าหลวงผู้ภักดีของ [actor.GetHerHis] ข้าขอเร่งเร้าให้ท่านเข้าร่วมกับข้าในการต่อสู้เพื่อขับไล่ทรราชผู้นี้"
 char_interaction.0232.regent: "ข้าจะไม่นิ่งดูดาย ในขณะที่ [actor.GetSheHe] ข่มเหงข้าหลวงผู้ภักดีของ [ceremonial_liege.GetTitledFirstNamePossessive] ข้าขอเร่งเร้าให้ท่านเข้าร่วมกับข้าในการต่อสู้เพื่อขับไล่ทรราชผู้นี้"
 char_interaction.0232.a:0 "ท่านจะไม่ยืนหยัดเพียงลำพัง!"
 char_interaction.0232.b:0 "ท่านคือคนทรยศ!"

 char_interaction.0233.desc:0 "เนื่องจากอาชญากรรมต่อราชบัลลังก์ เจ้าจึงถูกจับกุม ณ บัดนี้"
 char_interaction.0233.a:0 "อะไรนะ!?! นี่มันอุกอาจ!"

 marriage_interaction.0010.desc:0 "ข้ายอมรับข้อเสนอสมรสของท่านด้วยความยินดี!"
 marriage_interaction.0010.b_desc:0 "ข้ายอมรับข้อเสนอหมั้นหมายของท่านด้วยความยินดี!"
 marriage_interaction.0010.c_desc:0 "ข้ายอมรับข้อเสนอสมรสของท่าน"
 marriage_interaction.0010.d_desc:0 "ข้ายอมรับข้อเสนอหมั้นหมายของท่าน"
 marriage_interaction.0010.e_desc:0 "ข้า [secondary_recipient.GetFirstName] ยอมรับการสมรสกับท่านด้วยความยินดี!"
 marriage_interaction.0010.mid.a_desc:0 "\n\n[actor.Custom2('RelationToMe', SCOPE.sC('secondary_actor'))] ของท่าน, [secondary_actor.GetFirstName], และ [recipient.Custom2('RelationToMe', SCOPE.sC('secondary_recipient'))] ของข้า, [secondary_recipient.GetFirstName], จะได้เข้าร่วม [secondary_actor.Custom('GetCulturallyAppropriateMarriageReference')]."
 marriage_interaction.0010.mid.a_no_acquaintance_desc:0 "\n\nคนในราชสำนักของท่าน, [secondary_actor.GetFirstName], และ [recipient.Custom2('RelationToMe', SCOPE.sC('secondary_recipient'))] ของข้า, [secondary_recipient.GetFirstName], จะได้เข้าร่วม [secondary_actor.Custom('GetCulturallyAppropriateMarriageReference')]."
 marriage_interaction.0010.mid.b_desc:0 "\n\nท่านจะได้เข้าร่วมกับ [recipient.Custom2('RelationToMe', SCOPE.sC('secondary_recipient'))] ของข้า, [secondary_recipient.GetFirstName], ใน [secondary_actor.Custom('GetCulturallyAppropriateMarriageReference')]."
 marriage_interaction.0010.mid.c_desc:0 "\n\nข้าจะรับมือ [actor.Custom2('RelationToMe', SCOPE.sC('secondary_actor'))] ของท่าน, [secondary_actor.GetFirstName], ใน [secondary_actor.Custom('GetCulturallyAppropriateMarriageReference')] อย่างเป็นเกียรติ"
 marriage_interaction.0010.mid.c_no_acquaintance_desc:0 "\n\nข้าจะรับมือคนในราชสำนักของท่าน, [secondary_actor.GetFirstName], ใน [secondary_actor.Custom('GetCulturallyAppropriateMarriageReference')] อย่างเป็นเกียรติ"
 marriage_interaction.0010.mid.d_desc:0 "\n\n[secondary_actor.GetFirstName] [actor.Custom2('RelationToMe', SCOPE.sC('secondary_actor'))] ของท่าน จะหมั้นหมายกับ [secondary_recipient.GetFirstName] [recipient.Custom2('RelationToMe', SCOPE.sC('secondary_recipient'))] ของข้า"
 marriage_interaction.0010.mid.e_desc:0 "\n\nท่านจะหมั้นหมายกับ [secondary_recipient.GetFirstName] [recipient.Custom2('RelationToMe', SCOPE.sC('secondary_recipient'))] ของข้า"
 marriage_interaction.0010.mid.f_desc:0 "\n\nข้าจะรับการสมรสกับ [secondary_actor.GetFirstName] [actor.Custom2('RelationToMe', SCOPE.sC('secondary_actor'))] ของท่านอย่างมีเกียรติเมื่อถึงเวลา"
 marriage_interaction.0010.mid.g_desc:0 "\n\n[secondary_actor.GetFirstName] [actor.Custom2('RelationToMe', SCOPE.sC('secondary_actor'))] ของท่าน และข้าจะเป็นคู่ที่ยอดเยี่ยมที่สุด #EMP ตลอดกาล#!!"
 marriage_interaction.0010.mid.h_desc:0 "\n\nท่านและข้าจะเป็นคู่ที่ยอดเยี่ยมที่สุด #EMP ตลอดกาล#!!"
 marriage_interaction.0010.gwedding.desc:0 "\n\nข้ายังตั้งตารอ [GetActivityType('activity_wedding').GetName] ที่สัญญาไว้ อย่า ทำให้ข้าผิดหวังล่ะ"

 holy_matrimony: "การสมรสอันศักดิ์สิทธิ์"
 blessed_union: "สหภาพอันเป็นมงคล"
 harmonious_union: "สหภาพอันกลมเกลียว"
 auspicious_wedlock: "การสมรสอันเป็นศิริมงคล"
 matrimony: "การสมรส"

# Long life and many children
 marriage_interaction.0010.ending.a_desc:0 "\n\nขอ [recipient.GetFaith.HighGodName] โปรดประทานให้ทั้งสองมีอายุยืนยาวและบุตรหลานมากมาย!"
 marriage_interaction.0010.ending.a_actor_desc:0 "\n\nขอ [recipient.GetFaith.HighGodName] โปรดประทานให้ท่านมีอายุยืนยาวและบุตรหลานมากมาย!"
 marriage_interaction.0010.ending.a_recipient_desc:0 "\n\nขอ [recipient.GetFaith.HighGodName] โปรดประทานให้เรามีอายุยืนยาวและบุตรหลานมากมาย!"
 marriage_interaction.0010.ending.a_both_desc:0 "\n\nขอ [recipient.GetFaith.HighGodName] โปรดประทานให้เรามีอายุยืนยาวและบุตรหลานมากมายเถิด [secondary_actor.Custom('WifeHusband')] ผู้งามสง่า [secondary_actor.Custom('ComplimentAdjective')] ของข้า!"
# May HighGod bless the union
 marriage_interaction.0010.ending.b_desc:0 "\n\nขอ [recipient.GetFaith.FertilityGodName] โปรดอำนวยพรแก่การครองคู่ของพวกเขา!"
 marriage_interaction.0010.ending.b_actor_desc:0 "\n\nขอ [recipient.GetFaith.FertilityGodName] โปรดอำนวยพรแก่การครองคู่ของท่าน!"
 marriage_interaction.0010.ending.b_recipient_desc:0 "\n\nขอ [recipient.GetFaith.FertilityGodName] โปรดอำนวยพรแก่การครองคู่ของเรา!"
 marriage_interaction.0010.ending.b_both_desc:0 "\n\nขอ [recipient.GetFaith.FertilityGodName] โปรดอำนวยพรแก่การครองคู่ของเราเถิด [secondary_actor.Custom('WifeHusband')] ผู้งามสง่า [secondary_actor.Custom('ComplimentAdjective')] ของข้า!"
# Happy and fulfilling marriage
 marriage_interaction.0010.ending.c_desc:0 "\n\nขอให้การครองคู่ของพวกเขานำมา ซึ่งความสุขและความสมหวัง!"
 marriage_interaction.0010.ending.c_actor_desc:0 "\n\nขอให้การครองคู่ของท่านนำมา ซึ่งความสุขและความสมหวัง!"
 marriage_interaction.0010.ending.c_recipient_desc:0 "\n\nขอให้การครองคู่ของเรานำมา ซึ่งความสุขและความสมหวัง!"
 marriage_interaction.0010.ending.c_both_desc:0 "\n\nขอให้การครองคู่ของเรานำมา ซึ่งความสุขและความสมหวังเถิด [secondary_actor.Custom('WifeHusband')] ผู้งามสง่า [secondary_actor.Custom('ComplimentAdjective')] ของข้า!"
# Strength and support
 marriage_interaction.0010.ending.h_desc:0 "\n\nขอให้พวกเขาพบพานกำลังใจและการค้ำจุนในการครองคู่!"
 marriage_interaction.0010.ending.h_actor_desc:0 "\n\nขอให้ท่านพบพานกำลังใจและการค้ำจุนในการครองคู่!"
 marriage_interaction.0010.ending.h_recipient_desc:0 "\n\nขอให้เราพบพานกำลังใจและการค้ำจุนในการครองคู่!"
 marriage_interaction.0010.ending.h_both_desc:0 "\n\nขอให้เราพบพานกำลังใจและการค้ำจุนในการครองคู่เถิด [secondary_actor.Custom('WifeHusband')] ผู้งามสง่า [secondary_actor.Custom('ComplimentAdjective')] ของข้า!"
# Fruitful in spite of hatred
 marriage_interaction.0010.ending.d_desc:0 "\n\nขอให้การสมรสของพวกเขาสมประสงค์แม้จะมีความบาดหมางระหว่างกัน"
 marriage_interaction.0010.ending.d_actor_desc:0 "\n\nขอให้การสมรสของท่านสมประสงค์แม้จะมีความบาดหมางระหว่างกัน"
 marriage_interaction.0010.ending.d_recipient_desc:0 "\n\nขอให้การสมรสของเราสมประสงค์แม้จะมีความบาดหมางระหว่างกัน"
 marriage_interaction.0010.ending.d_both_desc:0 "\n\nขอให้การ แต่งงานของเรามีผลดี แม้จะมีเรื่องบาดหมางระหว่างเราก็ตาม, [secondary_actor.Custom('WifeHusband')] [secondary_actor.Custom2('InsultAdjective', ROOT.Char)] ของข้า!"
# Perfect match
 marriage_interaction.0010.ending.e_desc:0 "\n\nข้ามิเคยพบเห็นคู่ใดเหมาะสมเพียงนี้ พวกเขาราวกับถูกสร้างมาเพื่อกันและกัน!"
 marriage_interaction.0010.ending.e_actor_desc:0 "\n\nข้ามิเคยพบเห็นคู่ใดเหมาะสมเพียงนี้ พวกท่านราวกับถูกสร้างมาเพื่อกันและกัน!"
 marriage_interaction.0010.ending.e_recipient_desc:0 "\n\nในที่สุดเราก็ได้เข้าร่วม [secondary_actor.Custom('GetCulturallyAppropriateMarriageReference')] ทั้งจิตวิญญาณและหัวใจ!"
 marriage_interaction.0010.ending.e_both_desc:0 "\n\nในที่สุดเราก็ได้เข้าพิธีสมรสอันศักดิ์สิทธิ์ผูกพันทั้งจิตวิญญาณและดวงใจเถิด [secondary_actor.Custom('WifeHusband')] ผู้งามสง่า [secondary_actor.Custom('ComplimentAdjective')] ของข้า!"
# Recipient hates secondary recipient
 marriage_interaction.0010.ending.f_desc:0 "\n\nเหตุใดจึงมีคนอยาก แต่งงานกับ [secondary_recipient.Custom2('InsultNoun', ROOT.Char)] [secondary_recipient.Custom2('InsultAdjective', ROOT.Char)] นั่น ข้ามิอาจเข้าใจได้, แต่ก็ขอให้พวกเขาโชคดี"
 marriage_interaction.0010.ending.f_actor_desc:0 "\n\nเหตุใดจึงมีคนอยาก แต่งงานกับ [secondary_recipient.Custom2('InsultNoun', ROOT.Char)] [secondary_recipient.Custom2('InsultAdjective', ROOT.Char)] นั่น ข้ามิอาจเข้าใจได้, ก็ขอให้โชคดีแล้วกัน"
# Sinner, or criminal
 marriage_interaction.0010.ending.g_desc:0 "\n\nข้าสวดภาวนาขอให้พวกเขาทั้งสองสามารถค้นพบการไถ่บาปและการชดเชยความผิด อีกทั้งความสุขได้"
 marriage_interaction.0010.ending.g_actor_desc:0 "\n\nข้าสวดภาวนาขอให้ท่านทั้งสองสามารถค้นพบการไถ่บาปและการชดเชยความผิด อีกทั้งความสุขได้"
 marriage_interaction.0010.ending.g_recipient_desc:0 "\n\nข้าสวดภาวนาขอให้เราทั้งสองสามารถค้นพบการไถ่บาปและการชดเชยความผิด อีกทั้งความสุขได้"
 marriage_interaction.0010.ending.g_both_desc:0 "\n\nข้าสวดภาวนาขอให้เราทั้งสองสามารถค้นพบการไถ่บาปและการชดเชยความผิด อีกทั้งความสุขด้วยกันเถิด [secondary_actor.Custom('WifeHusband')]"

 marriage_interaction.0011.desc:0 "หลังจากพิจารณาอย่างถี่ถ้วนแล้ว ข้าจำต้องปฏิเสธคำขอสมรสของท่าน\n\n[secondary_actor.GetFirstName] และ [secondary_recipient.GetFirstName] ไม่ได้ถูกลิขิตมาเพื่อกันและกัน"
 marriage_interaction.0011.b_desc:0 "หลังจากพิจารณาอย่างถี่ถ้วนแล้ว ข้าจำต้องปฏิเสธข้อเสนอการหมั้นหมายของท่าน\n\n[secondary_actor.GetFirstName] และ [secondary_recipient.GetFirstName] ไม่ได้ถูกลิขิตมาเพื่อกันและกัน"
 marriage_interaction.0011.a:0 "น่าเสียดาย..."

 marriage_interaction.0020.desc:0 "ข้าตัดสินใจแล้วว่าจะถอนหมั้นระหว่าง [rejecting_betrothed.GetShortUIName] และ [rejected_betrothed.GetShortUIName]"
 marriage_interaction.0020.actor_desc:0 "ข้าตัดสินใจแล้วว่าจะถอนหมั้นของข้ากับ [rejected_betrothed.GetShortUIName]"
 marriage_interaction.0020.recipient_desc:0 "ข้าตัดสินใจแล้วว่าจะถอนหมั้นของท่านกับ [rejecting_betrothed.GetShortUIName]"
 marriage_interaction.0020.both_desc:0 "ข้าตัดสินใจแล้วว่าจะถอนหมั้นของเรา การสมรสของเราจะมิเกิดขึ้น"
 marriage_interaction.0020.a:0 "ช่างไร้เกียรติยิ่งนัก!"

 marriage_interaction.0030.desc:0 "เห็นได้ชัดว่าการสมรสของเราไม่เป็นที่โปรดปรานของ [actor.GetFaith.HighGodName] มันจบสิ้นแล้ว"
 marriage_interaction.0030.a:0 "ในที่สุด, ข้าก็เป็นอิสระจาก [actor.Custom2('InsultNoun', ROOT.Char)] [actor.Custom2('InsultAdjective', ROOT.Char)] นั่นเสียที!"
 marriage_interaction.0030.a_love:0 "[actor.GetFirstName] ไม่นะ! ข้ารักท่าน!"

 marriage_interaction.0040.desc:1 "ข้าตัดสินใจรับเจ้ามาเป็นนางสนมของข้า"
 marriage_interaction.0040.a:0 "ขอให้เป็น เช่นนั้นเถิด"

 marriage_interaction.0041.desc:1 "ข้าได้ปลดปล่อย [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('recipient'))] ของท่านจากคุกของข้าเพื่อมารับใช้เป็นนางสนม"
 marriage_interaction.0041.a:0 "เจ้าปิศาจร้ายกาจ!"

 marriage_interaction.0042.desc:1 "ข้าตัดสินใจมอบเจ้าให้แก่ [recipient.GetTitledFirstName] เพื่อเป็นนางสนมของ [recipient.GetHerHis]"
 marriage_interaction.0043.desc_concubine:1 "ข้าได้ปลดปล่อยนางสนมของท่านจากคุกของข้าเพื่อไปรับใช้เป็นนางสนมของ [recipient.GetTitledFirstNamePossessive]"
 marriage_interaction.0043.desc_spouse: "ข้าได้ปล่อยตัว [secondary_recipient.Custom('WifeHusband')] ของท่านออกจากคุกของข้า เพื่อไปรับใช้เป็นนางห้ามของ [recipient.GetTitledFirstNamePossessive]"

 marriage_interaction.0050.desc:1 "หน้าที่นางสนมของข้าที่เจ้าปฏิบัติอยู่นั้น ไม่เป็นที่ต้องการอีกต่อไปแล้ว"
 marriage_interaction.0050.a:0 "ขอให้เป็น เช่นนั้นเถิด"

