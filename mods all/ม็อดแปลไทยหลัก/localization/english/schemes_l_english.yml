 scheme_apa_positive_0001_modifier: "$scheme_apa_positive.0001.t$"
 scheme_apa_positive_0001_modifier_desc: "ดาบ ขวาน หรือกริช — โลหะเล็กน้อยมีผลอย่างมากเมื่อใครบางคนคิดว่าตนปลอดภัย"
 scheme_apa_positive_0011_modifier: "$scheme_apa_positive.0011.t$"
 scheme_apa_positive_0011_modifier_desc: "ความเข้าใจอย่างถ่องแท้ว่าหมาก แต่ละตัวน่าจะอยู่ที่ใดในเวลาใดก็ตาม เป็นสิ่งสำคัญต่อความสำเร็จ"
 scheme_apa_positive_0021_modifier: "$scheme_apa_positive.0021.t$"
 scheme_apa_positive_0021_modifier_desc: "ช่างเป็นเรื่องเล็กน้อยเหลือเกิน การทิ้งสลักประตูไว้หลวมๆ ทว่า..."
 scheme_apa_positive_0031_modifier: "$scheme_apa_positive.0031.t$"
 scheme_apa_positive_0031_modifier_desc: "เงินเล็กน้อยนั้นซื้อได้หลายสิ่งเป็นเวลานาน"
 scheme_apa_positive_0041_modifier: "$scheme_apa_positive.0041.t$"
 scheme_apa_positive_0041_modifier_desc: "น่าประหลาดใจที่ต้องใช้คำพูดเพียงไม่กี่คำ ก่อนที่ใครบางคนจะยอมประนีประนอมศีลธรรมของตน"
 scheme_apa_positive_0051_modifier: "$scheme_apa_positive.0051.t$"
 scheme_apa_positive_0051_modifier_desc: "ต้องใช้ทักษะเล็กน้อย โชคช่วยบ้าง และสายตาที่เฉียบแหลม แต่โอกาสสามารถถูก #EMP สร้าง#! ให้เกิดขึ้นได้"
 scheme_apa_positive_0061_modifier: "$scheme_apa_positive.0061.t$"
 scheme_apa_positive_0061_modifier_desc: "หัวใจรู้ว่าต้องการอะไร โดยไม่คำนึงว่าสมองหรือสัญชาตญาณจะว่าอย่างไร"
 scheme_apa_positive_0071_modifier: "$scheme_apa_positive.0071.t$"
 scheme_apa_positive_0071_modifier_desc: "กับบางคน คำเยินยอจะพาคุณไปได้ทุกที่"
 scheme_apa_positive_0081_modifier: "$scheme_apa_positive.0081.t$"
 scheme_apa_positive_0081_modifier_desc: "การใช้เวลาแสดงให้เห็นว่าคุณซาบซึ้งในตัวใครบางคนมีค่ามากกว่าทองคำ โดยทั่วไปแล้ว"
 scheme_apa_positive_0091_modifier: "$scheme_apa_positive.0091.t$"
 scheme_apa_positive_0091_modifier_desc: "การโต้ตอบจดหมายอย่างต่อเนื่องเปิดโอกาสอันน่าตื่นเต้นสำหรับปฏิภาณและเสน่ห์"
 scheme_apa_positive_0111_modifier: "$scheme_apa_positive.0111.t$"
 scheme_apa_positive_0111_modifier_desc: "การเรียนรู้ที่จะเข้าใจใครบางคนอาจเป็นเรื่องยาก แต่การ #EMP แสดงออก#! ว่าคุณเข้าใจนั้นค่อนข้างง่าย"
 scheme_apa_positive_0121_modifier: "$scheme_apa_positive.0121.t$"
