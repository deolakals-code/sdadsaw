 scheme_apa_negative_7291_modifier_desc: "เอกสารบ้านั่นอยู่ที่ไหน? มันเพิ่งอยู่ที่นี่เอง ข้ามั่นใจ!"
 scheme_apa_negative_7301_modifier: "$scheme_apa_negative.7301.t$"
 scheme_apa_negative_7301_modifier_desc: "ประตูของหมู่บ้านเล็กๆ ที่ว่างเปล่าอย่างน่าขนลุกดูเหมือนจะปิดกระแทกทันทีที่เรามาถึง"
 scheme_apa_negative_7311_modifier: "$scheme_apa_negative.7311.t$"
 scheme_apa_negative_7311_modifier_desc: "ผู้คนแสดงออกอย่างชัดเจนว่าพวกเขาไม่มีความสนใจที่จะร่วมมือกับเรา"
 scheme_apa_negative_7321_modifier: "$scheme_apa_negative.7321.t$"
 scheme_apa_negative_7321_modifier_desc: "แทบไม่มีความหวังที่จะคลี่คลายปมยุ่งเหยิงแห่งการใส่ร้ายป้ายสีที่ไม่สิ้นสุด เช่นนี้ได้"
 scheme_apa_negative_7331_modifier: "$scheme_apa_negative.7331.t$"
 scheme_apa_negative_7331_modifier_desc: "ไม่ว่าจะตั้งคำถามอย่างไร คำตอบก็ไม่มีเลย"
 scheme_apa_negative_7341_modifier: "$scheme_apa_negative.7341.t$"
 scheme_apa_negative_7341_modifier_desc: "ชั่วโมงอันมีค่าผ่านไปอย่างรวดเร็วในการออกนอกเรื่องและการย้ำคิดย้ำทำที่ยืดยาด"
 scheme_apa_negative_7351_modifier: "$scheme_apa_negative.7351.t$"
 scheme_apa_negative_7351_modifier_desc: "เจ้าโง่ นั่นควรจะไปอยู่ตรงนั้น! ไม่สิ รอเดี๋ยว หันไปทาง #EMP นั้น#!?"
 scheme_apa_negative_7361_modifier: "$scheme_apa_negative.7361.t$"
 scheme_apa_negative_7361_modifier_desc: "เพราะขาดค้อน ตะปูจึงไร้ประโยชน์ ไม่ต้องพูดถึงส่วนที่เหลือ..."
 scheme_apa_negative_7371_modifier: "$scheme_apa_negative.7371.t$"
 scheme_apa_negative_7371_modifier_desc: "ทุกครั้งที่เราเริ่มทำงาน ฝนที่ตกกระหน่ำบ้านี่ก็เริ่มตกใหม่อีกครั้ง"
 scheme_apa_negative_7381_modifier: "$scheme_apa_negative.7381.t$"
 scheme_apa_negative_7381_modifier_desc: "แสงสว่างจะหมดไปเกือบหมดแล้วกว่าที่เราจะรวมพวกมันกลับมาได้..."
 scheme_apa_negative_7391_modifier: "$scheme_apa_negative.7391.t$"
 scheme_apa_negative_7391_modifier_desc: "โจรที่เจ้าเล่ห์และไร้ยางอายที่สุดก็จนปัญญาหากไม่มีเหยื่อ"
 scheme_apa_negative_7401_modifier: "$scheme_apa_negative.7401.t$"
 scheme_apa_negative_7401_modifier_desc: "ของกำนัลบนท้องถนนนั้นผันผวนเหมือนมหาสมุทร และหายากเหลือเกินในช่วงหลัง"
 scheme_apa_negative_7411_modifier: "$scheme_apa_negative.7411.t$"
 scheme_apa_negative_7411_modifier_desc: "การวางแผนและดำเนินการซุ่มโจมตีเป็นเรื่องยากในช่วงเวลาที่ดีที่สุด ยิ่งกว่านั้นเมื่อกำลังหลบหนี"
 scheme_apa_negative_7421_modifier: "$scheme_apa_negative.7421.t$"
 scheme_apa_negative_7421_modifier_desc: "ศัตรูตัวร้ายที่สุดของนักโต้วาทีมักจะเป็นการเลือกคำพูดที่ไม่ดีของลิ้นของพวกเขาเอง"
 scheme_apa_negative_7431_modifier: "$scheme_apa_negative.7431.t$"
 scheme_apa_negative_7431_modifier_desc: "อะไรนะ คุณไม่เข้าใจ? อีกแล้วเหรอ? ฟังนะ ตามฉันมาใกล้ๆ คราวนี้..."
 scheme_apa_negative_7441_modifier: "$scheme_apa_negative.7441.t$"
 scheme_apa_negative_7441_modifier_desc: "ความขัดแย้ง เมื่อถูกชี้ให้เห็นแล้ว จะหว่านเมล็ดพันธุ์แห่งความสงสัยต่อไป"
 scheme_apa_negative_7451_modifier: "$scheme_apa_negative.7451.t$"
 scheme_apa_negative_7451_modifier_desc: "เงินบริจาคอาจมาเร็ว แต่ไม่ได้มาหนาแน่น (ไม่ได้มาเยอะ)"
 scheme_apa_negative_7461_modifier: "$scheme_apa_negative.7461.t$"
 scheme_apa_negative_7461_modifier_desc: "ไม่ว่าเราจะพยายามแค่ไหน ก็มักจะมีข้อแก้ตัวบางอย่างที่จะไม่คลายเชือกกระเป๋าเงิน"
 scheme_apa_negative_7471_modifier: "$scheme_apa_negative.7471.t$"
 scheme_apa_negative_7471_modifier_desc: "ยากที่จะโน้มน้าวใครๆ ได้ ในขณะที่ต้องแข่งขันกับพวกก่อกวน"
 scheme_apa_negative_7481_modifier: "$scheme_apa_negative.7481.t$"
 scheme_apa_negative_7481_modifier_desc: "คำพึมพำที่แหลมคมของนักบวชสามารถสร้างความแตกต่างให้กับคนโง่ที่ไม่ประสีประสาเหล่านี้ได้ทั้งหมด"
 scheme_apa_negative_7491_modifier: "$scheme_apa_negative.7491.t$"
 scheme_apa_negative_7491_modifier_desc: "ใครคนหนึ่งอาจเป็นศัตรูตัวร้ายที่สุดของตนเองได้เมื่อพูดถึงชื่อเสียงด้านความน่าเชื่อถือของตน"
 scheme_apa_negative_7501_modifier: "$scheme_apa_negative.7501.t$"
 scheme_apa_negative_7501_modifier_desc: "ข้อมูลเล็กๆ น้อยๆ ที่ดูน่าสนใจอาจเปิดเผยตัวเองว่าเป็นเพียงเรื่องซุบซิบเมื่อตรวจสอบอย่างใกล้ชิด"
 scheme_apa_negative_7511_modifier: "$scheme_apa_negative.7511.t$"
 scheme_apa_negative_7511_modifier_desc: "ยามที่ระมัดระวังที่สุดในโลกสามารถครอบคลุมพื้นที่ได้เพียงเท่านั้น"
 scheme_apa_negative_7521_modifier: "$scheme_apa_negative.7521.t$"
 scheme_apa_negative_7521_modifier_desc: "ทฤษฎีสามารถพาคนไปได้ไกลเท่านั้น และการปฏิบัติที่หยาบๆ ก็ไม่ไกลไปกว่านั้นมากนัก"
 scheme_apa_negative_7531_modifier: "$scheme_apa_negative.7531.t$"
 scheme_apa_negative_7531_modifier_desc: "น้อยคนนักที่จะเกรงกลัวเราได้หลังจากการแสดงที่น่าสังเวช เช่นนั้น..."
 scheme_apa_negative_7541_modifier: "$scheme_apa_negative.7541.t$"
 scheme_apa_negative_7541_modifier_desc: "ดูนี่สิ เราสามารถประหยัดเวลาได้บ้างโดยตัดผ่านทางนี้ หรือไม่ข้าก็เป็นคนโง่"
 scheme_apa_negative_7551_modifier: "$scheme_apa_negative.7551.t$"
 scheme_apa_negative_7551_modifier_desc: "ไม่ว่าจะถูกสงสัยอย่างแท้จริงหรือถูกตั้งคำถามอย่างหลอกลวง คุณสมบัติก็ไร้ประโยชน์หากปราศจากความไว้วางใจ"
 # Progress (Repurposed)
 scheme_apa_negative_8001_modifier: "$scheme_apa_negative.8001.t$"
 scheme_apa_negative_8001_modifier_desc: "เพียงเสี้ยววินาทีก็แยกการรัฐประหารที่น่าตื่นเต้นออกจากการล่มสลายที่น่าอับอายได้"
 scheme_apa_negative_8011_modifier: "$scheme_apa_negative.8011.t$"
 scheme_apa_negative_8011_modifier_desc: "บางครั้งรู้สึกราวกับว่าจักรวาลทั้งมวลต้องร่วมมือกันต่อต้านเรา!"
 scheme_apa_negative_8021_modifier: "$scheme_apa_negative.8021.t$"
 scheme_apa_negative_8021_modifier_desc: "ไม่ว่าเราจะพยายามแค่ไหน เราก็ดูเหมือนจะไม่ไปถึงไหนเลย!"
 scheme_apa_negative_8031_modifier: "$scheme_apa_negative.8031.t$"
 scheme_apa_negative_8031_modifier_desc: "แม้ว่าพวกเขาจะพยายามซ่อนมัน แต่ดูเหมือนว่าเราได้สร้างความเสียหายไปบ้างแล้วจริงๆ"
 scheme_apa_negative_8041_modifier: "$scheme_apa_negative.8041.t$"
 scheme_apa_negative_8041_modifier_desc: "บางทีครั้งนั้นข้าอาจจะพูดจาเยิ่นเย้อไปหน่อย..."
 scheme_apa_negative_8051_modifier: "$scheme_apa_negative.8051.t$"
 scheme_apa_negative_8051_modifier_desc: "ความพากเพียรสามารถกลายเป็นความรำคาญได้อย่างรวดเร็ว และเรากำลังอยู่เกินเวลาต้อนรับอย่างรวดเร็ว"
 scheme_apa_negative_8061_modifier: "$scheme_apa_negative.8061.t$"
 scheme_apa_negative_8061_modifier_desc: "ใครคนหนึ่งอาจคิดว่าตนเข้าใจมันแล้ว แต่มันเป็นเพียงปลายไม้ที่ผิดด้าน (เข้าใจผิด)"
 scheme_apa_negative_8071_modifier: "$scheme_apa_negative.8071.t$"
 scheme_apa_negative_8071_modifier_desc: "เป็นการดีกว่าที่จะตระหนักถึงความผิดพลาดของตนก่อนที่มันจะนำไปสู่สิ่งที่เลวร้ายกว่า แต่นั่นไม่ใช่การปลอบใจ"
 scheme_apa_negative_8081_modifier: "$scheme_apa_negative.8081.t$"
 scheme_apa_negative_8081_modifier_desc: "กองกระดาษยังคงตั้งอยู่บนโต๊ะ และรุ่งอรุณก็ใกล้เข้ามาอย่างรวดเร็ว"
 scheme_apa_negative_8091_modifier: "$scheme_apa_negative.8091.t$"
 scheme_apa_negative_8091_modifier_desc: "ไอ้คนทรยศที่ไม่ภักดีพวกนี้! พวกมันควรจะทรยศพวกเขา ไม่ใช่เรา!"
 scheme_apa_negative_8101_modifier: "$scheme_apa_negative.8101.t$"
 scheme_apa_negative_8101_modifier_desc: "ตอนแรกมันชัดเจนมาก แต่สิ่งต่างๆ ดูเหมือนจะพังทลายลง..."
 scheme_apa_negative_8111_modifier: "$scheme_apa_negative.8111.t$"
 scheme_apa_negative_8111_modifier_desc: "คำพูดที่วางไว้อย่างดีถูกทำลายโดยการโต้กลับ เราจะต้องลองอีกครั้ง"
 scheme_apa_negative_8121_modifier: "$scheme_apa_negative.8121.t$"
 scheme_apa_negative_8121_modifier_desc: "เรื่องเล่าที่ยอดเยี่ยมต้องเต็มไปด้วยการยืดเยื้อที่ยิ่งใหญ่ แต่ก็ต้องสอดคล้องกันภายในด้วย"
 scheme_apa_negative_8131_modifier: "$scheme_apa_negative.8131.t$"
 scheme_apa_negative_8131_modifier_desc: "แม้จะหวังว่าเรื่องจะจบลงด้วยดีแล้ว แต่สิ่งต่างๆ ก็สามารถปะทุขึ้นได้อย่างไม่คาดฝัน"
