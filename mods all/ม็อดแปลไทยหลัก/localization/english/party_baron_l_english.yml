l_english: 
 # Misc
 party_baron_volunteer_levies:0 "อาสาสมัครของ [party_baron.GetFirstNamePossessiveNoTooltip]"
 # Modifiers
 party_baron_beloved_by_all_modifier:0 "เป็นที่รักของทุกคน"
 party_baron_making_efforts_modifier:0 "พยายามเข้าสังคม"
 party_baron_self_aggrandizing_modifier:0 "ยกตนข่มท่าน"
 party_baron_friendly_enough_modifier:0 "เป็นมิตรพอสมควร"
 party_baron_friendly_enough_modifier_desc:0 "การมี "เพื่อน" มากเกินไปก็เป็นไปได้โดยสิ้นเชิง"
 party_baron_if_you_cannot_be_loved_modifier:0 "หากท่านมิอาจเป็นที่รัก"
 party_baron_accommodating_modifier:0 "โอนอ่อนผ่อนตามผู้อื่น"
 party_baron_condemned_pb_modifier:0 "การประณามที่ไม่เป็นที่นิยม"
 party_baron_condemned_pb_modifier_desc:0 "ตัวละครนี้ได้กล่าวร้ายผู้ที่เป็นที่นิยมอย่างสูง"
 party_baron_praised_pb_modifier:0 "การยกย่องอย่างไม่เต็มใจ"
 party_baron_praised_pb_modifier_desc:0 "ตัวละครนี้ได้ยกย่องผู้ที่เป็นที่นิยมอย่างสูงอย่างไม่เต็มใจ"
 party_baron_murdered_the_joy_of_life_modifier:0 "สังหารความสุขแห่งชีวิต"
 party_baron_murdered_the_joy_of_life_modifier_desc:0 "เหตุใดจึงมีผู้กระทำการ เช่นนี้?"
 party_baron_great_mercenary_deal_modifier:0 "ข้อตกลงทหารรับจ้างอันยอดเยี่ยม"
 party_baron_ended_the_party_modifier:0 "ยุติงานเลี้ยง"
 party_baron_ended_the_party_modifier_desc:0 "ตัวละครนี้ได้พรากห้องโถงจัดเลี้ยงของงานเลี้ยงที่ยิ่งใหญ่ที่สุดที่เคยจัดไป"
 party_baron_subversive_tactics_modifier:0 "กลยุทธ์บ่อนทำลาย"
 party_baron_reflection_modifier:0 "การใคร่ครวญส่วนตน"
 party_baron_beloved_by_all_except_modifier:0 "เป็นที่รักของทุกคน ยกเว้น..."
 party_baron_endorsed_successor_modifier:0 "ผู้สืบทอดที่ได้รับการรับรอง"
 party_baron_endorsed_successor_modifier_desc:0 "บุคคลที่น่าคบหาที่สุดในโลกได้ให้การรับรองแก่ผู้ปกครองคนใหม่นี้แล้ว"

 # Events
 party_baron_header:0 "งานเลี้ยงที่ไม่สิ้นสุด"
 party_baron_negative_attitude_counter_stress_tt:0 "เนื่องจากทัศนคติ #V เชิงลบ#! ของท่านที่มีต่อ [TARGET_CHARACTER.GetShortUIName]:"
 party_baron_positive_attitude_counter_stress_tt:0 "เนื่องจากทัศนคติ #V เชิงบวก#! ของท่านที่มีต่อ [TARGET_CHARACTER.GetShortUIName]:"
 party_baron_move_towards_positive_tt:0 "เปลี่ยนไปสู่ทัศนคติ #V เชิงบวก#! ต่อ [party_baron.GetShortUIName]"
 party_baron_move_towards_negative_tt:0 "เปลี่ยนไปสู่ทัศนคติ #V เชิงลบ#! ต่อ [party_baron.GetShortUIName]"
 party_baron.1001.t:0 "$party_baron_header$"
 party_baron.1001.desc:0 "นามของขุนนางผู้น้อยผู้หนึ่งดูเหมือนจะติดปากทุกคน ข้าได้ยินอยู่เสมอว่า [party_baron.GetTitledFirstName] นั้นช่างน่าคบหาเพียงใด [party_baron.GetSheHe] ทำให้ทุกคนรู้สึกสบายใจ และ [party_baron.GetSheHe] จัดงานเลี้ยงที่ #EMP ยอดเยี่ยมที่สุด#! \n\nทุกคนรู้จัก [party_baron.GetHerHim] และสามารถรับรองความเป็นมิตรและความเอื้อเฟื้อของเขาได้ — อย่างน้อยนั่นคือสิ่งที่พวกเขาต่างกระตือรือร้นที่จะกล่าวอ้าง"
 party_baron.1001.a:0 "บางทีข้าอาจเรียนรู้สักอย่างหรือสองอย่างจากความนิยมของ [party_baron.GetHerHis]..."
 party_baron.1001.b:0 "แต่ #EMP ข้า#! ต่างหากคือผู้ที่ควรได้รับการยกย่องสรรเสริญ!"
 party_baron.1001.c:0 "ดูเหมือนว่าข้าควรจะทำความรู้จักกับ [party_baron.GetWomanMan] ผู้นี้!"
 party_baron.1001.c.tt:0 "เขียนจดหมายถึง [party_baron.GetTitleAsName]"

 party_baron.1002.opening:0 "[party_baron.Custom2('AppropriateGreetingPositive', ROOT.Char)]"
 party_baron.1002.desc:0 "ข้าขอขอบพระคุณสำหรับถ้อยคำทักทายอันกรุณาของท่าน! รู้สึกดีที่ได้ยินจากผู้ที่ชื่นชมอย่างแท้จริงว่าความสุขที่แท้จริงคือความสุขที่ท่านมอบให้แก่ผู้อื่น\n\nข้าหวังว่าสักวันหนึ่งจะได้ต้อนรับท่านในฐานะแขกผู้มีเกียรติของข้า และ แม้ว่าจะเป็นการอวดดีที่ข้าจะกล่าว เช่นนั้น ข้าหวังว่าท่านอาจจะพิจารณาข้าเป็นสหายในสักวันหนึ่ง"
 party_baron.1002.a:0 "[party_baron.GetSheHe|U] ดูน่าพอใจมาก แม้จะผ่านทางจดหมาย!"

 party_baron.1003.desc:0 "ราวกับว่าข้ากระพริบตาเพียงครู่เดียว และพลาดมันไปทั้งหมด แต่ [party_baron.GetFirstName] ได้ก้าวจากตำแหน่งบารอนอันต่ำต้อยของ [party_baron.GetHerHis] มาเป็น [party_baron_header.GetTitleAsName] ของข้า...\n\nโลกกลับตาลปัตรเร็วกว่าที่ข้าจะจินตนาการได้"
 party_baron.1003.a:0 "อย่างน้อยตอนนี้ข้าก็มี [party_baron.GetTitleAsName] ที่ใจกว้าง"
 party_baron.1003.b:0 "ขอให้เราลืมเรื่องทั้งหมดที่ข้าเคยพูดไปเสียเถิด..."

 party_baron.2001.t:0 "$party_baron_header$"
 party_baron.2001.negative:0 "โดยปราศจากการสนับสนุนหรือการอนุมัติใดๆ ดูเหมือนว่า [party_baron.GetTitledFirstName] ได้ริเริ่มพูดคุยกับ [vassal.Custom2('RelationToMe', ROOT.Char )] เกี่ยวกับข้า!\n\nเห็นได้ชัดว่า [party_baron.GetSheHe|U] ยกย่องข้าไม่หยุดหย่อน แต่นั่นกลับ ทำให้ข้า #EMP ยิ่ง#! สงสัยในแรงจูงใจของ [party_baron.GetHerHis] มากขึ้น!"
 party_baron.2001.positive:0 "ดูเหมือนว่า [party_baron.GetShortUIName] ได้พูดคุยกับ [vassal.Custom2('MyCharacterIntroduction', ROOT.Char )] เกี่ยวกับข้า โดยความคิดริเริ่มของ [party_baron.GetHerHis] เองทั้งหมด\n\nอาจเป็นเรื่องน่ากังวล หากไม่ใช่ เพราะความจริงที่ว่าตอนนี้ [vassal.GetFirstNameNoTooltip] ดูเป็นมิตรและให้การสนับสนุนมากขึ้น!"
 party_baron.2001.a_positive:0 "ความพยายามอันน่าประทับใจ!"
 party_baron.2001.a_negative:0 "ตราบใดที่ทุกอย่างยังอยู่ภายใต้การควบคุมสำหรับตอนนี้..."
 party_baron.2001.b_negative:0 "ข้าต่างหากคือผู้ที่ควรได้รับการชื่นชมและรับฟังตั้งแต่แรก!"
 party_baron.2001.b_positive:0 "เป็นสิ่งที่ถูกต้องแล้ว ข้าค่อนข้างยอดเยี่ยม"

 party_baron.2002.t:0 "$party_baron_header$"
 party_baron.2002.desc:0 "ในงานเลี้ยง สายตาของข้าประสานกับสายตาของ [party_baron.GetTitledFirstName] ขณะที่ [party_baron.GetSheHe] กำลังพูดคุยกับ [new_friend.Custom2('MyCharacterIntroduction', ROOT.Char )] แม้จะเป็นการละเมิดมารยาทอย่างชัดเจน [party_baron.GetSheHe] ก็กวักมือเรียกข้า\n\n"[ROOT.Char.GetFirstNameNoTooltip]! ท่านรู้จัก [new_friend.GetFirstNameNoTooltip] แน่นอน แต่ข้าคิดว่าท่านควรใช้เวลาร่วมกันมากขึ้น ท่านมีอะไรเหมือนกันมากมาย!""
 party_baron.2002.a:0 "ข้าคิดว่าข้ายังไม่รู้จัก [new_friend.GetTitledFirstNameNoTooltip] ดีเท่าที่ควร"
 party_baron.2002.b:0 "โอ้ ข้ามีคนรู้จักมากเกินพอแล้ว"

 party_baron.2003.desc:0 "ข้าทราบมาว่า [owner.Custom2('YourCharacterIntroduction', ROOT.Char)] กำลังวางแผนลอบสังหารท่าน!\n\nอย่างไรก็ตาม อย่ากังวลไปเลย เพราะข้าได้พูดคุยกับ [owner.GetHerHim] และ ทำให้ [owner.GetHerHim] เห็นความผิดพลาดในแนวทางของ [owner.GetHerHis] การฆาตกรรมเป็นสิ่งที่น่ารังเกียจอย่างแท้จริง ท่านไม่เห็นด้วยหรือ?"
 party_baron.2003.a:0 "ขอบคุณสำหรับ... การช่วยชีวิตข้า?"
 party_baron.2003.repentant_cannot_scheme:0 "ตราบใดที่ [owner.GetShortUIName] ยังสำนึกผิด [owner.GetSheHe] ไม่สามารถเริ่ม [hostile_schemes|E] ต่อต้านท่านได้"
 party_baron.2003.b:0 "[owner.GetSheHe|U] กำลังวางแผนที่จะทำ #EMP อะไรกัน?!#!"
 party_baron.2003.c:0 "แผนการนี้ "มาถึงความสนใจของ [party_baron.GetHerHis]" ได้อย่างไรกันแน่...?"

 party_baron.2004.t:0 "$party_baron_header$"
 party_baron.2004.desc:0 "เป็นไปไม่ได้ที่จะบอกว่า [party_baron.GetTitledFirstName] เมา หรือเพียงแค่เมามันไปกับจิตวิญญาณแห่งการเฉลิมฉลองที่เกิดขึ้นรอบตัว [party_baron.GetHerHim] ไม่ว่าจะเป็นอะไรก็ตาม ข้าก็รู้สึกได้ เช่นกันทันทีที่ [party_baron.GetSheHe] ดึงข้าเข้าไปกอด\n\n"ท่านรู้ไหม" [party_baron.GetSheHe] กล่าว "ข้าคิดจริงๆ ว่าท่านเป็นหนึ่งในเพื่อนที่ดีที่สุดที่ข้ามี"\n\nช่วงเวลาที่เหลือของค่ำคืน ข้าส่วนใหญ่เฝ้ามอง [party_baron.GetHerHim] ในความสนุกสนานของ [party_baron.GetHerHis] ข้าเริ่มเชื่อว่าข้าอาจจะเข้าใจ [party_baron.GetHerHim] ได้ดีกว่าใครๆ ที่กำลังดื่มอวยพรให้ [party_baron.GetHerHim]"
 party_baron.2004.a:0 "ท่านก็ เช่นกัน [party_baron.GetFirstNameNoTooltip]..."

 party_baron.2005.t:0 "$party_baron_header$"
 party_baron.2005.desc:0 "ข้าประหลาดใจ แต่ก็ยินดีเมื่อ [party_baron.GetTitledFirstName] ปรากฏตัวที่ราชสำนักของข้า ยิ่งไปกว่านั้นเมื่อ [party_baron.GetSheHe] ต้องการพูดคุย เพียงแค่เราสองคน\n\n"ข้าไม่ต้องการให้เรื่องนี้ถูกพูดในงานเลี้ยงหรืองานเฉลิมฉลอง" [party_baron.GetSheHe|U] ดูจริงจังผิดปกติ รอยยิ้มที่เบิกบานนั้นหายไปเป็นครั้งแรก "ข้าไม่สามารถบรรยายได้ว่าท่านมีความหมายต่อข้ามากเพียงใด ข้ามีเพื่อนมากมาย แต่ไม่มีใครเหมือนท่าน ข้าหวังว่าเราจะรักษามิตรภาพนั้นไว้จนถึงวันสุดท้ายของชีวิตเรา""
 party_baron.2005.a:0 ""ข้าก็ เช่นกัน [party_baron.GetFirstNameNoTooltip] ข้าก็ เช่นกัน"

 party_baron.2006.desc:0 "หลังจากได้รับเชิญไปงานเลี้ยงสำหรับ "โอกาสพิเศษอย่างยิ่ง" ข้าต้องไปดูงานเฉลิมฉลองของ [party_baron.GetTitledFirstNamePossessive] ด้วยตนเอง ช่างเป็นค่ำคืนที่วิเศษจริงๆ\n\nข้าแทบจำไม่ได้ว่าเคยมีความสุขมากเท่านี้มาก่อน และตอนนี้รู้สึกราวกับว่าข้าได้ความกระหายในชีวิตกลับคืนมา!"
 party_baron.2006.a:0 "ระวังตัวไว้เถิด โลกเอ๋ย!"
 party_baron.2006.b:0 "มันไม่มีอะไรพิเศษ"

 party_baron.2007.desc:0 "แม้จะอยู่ท่ามกลางสงคราม [party_baron.GetTitledFirstName] ก็ยังหาทางใช้เล่ห์เหลี่ยมตามปกติของ [party_baron.GetHerHis] ได้ ขณะที่ข้ากำลังสำรวจกองทัพของข้า [party_baron.GetSheHe] ก็ขี่ม้าเข้ามาหาข้า นำหน้ากองทัพเล็กๆ ของ [party_baron.GetHerHis] เอง!\n\n"ข้าคิดว่าเราน่าจะต้องการทุกมือที่เราหาได้ ดังนั้นข้าจึงไปคุยกับคนบางกลุ่ม และพวกเขาก็ปรากฏว่ากระตือรือร้นที่จะเข้าร่วมเป็นอาสาสมัคร!"\n\nอาสาสมัคร...? ข้าควรจะถามหรือไม่ว่าทหารเหล่านี้มาจากไหน?"
 party_baron.2007.a:0 "นี่คือสิ่งที่ข้าต้องการอย่างแท้จริง!"
 party_baron.2007.b:0 "เพื่อที่จะ #EMP ช่วย#! ท่านควรจะนำ #EMP ทหารอาชีพ#! มาให้ข้าสิ!"
 party_baron.2007.b_flavor:0 "โอ้ โอ้ ท่านจะ...?"

 party_baron.3001.t:0 "$party_baron_header$"
 party_baron.3001.desc:0 "ผู้คนหลงใหล [party_baron.GetTitledFirstName] อย่างหัวปักหัวปำ และข้าก็ไม่เข้าใจเลยว่าทำไม! [party_baron.GetSheHe|U] ไม่ได้ยอดเยี่ยมขนาดนั้น สิ่งที่ [party_baron.GetSheHe] ทำก็แค่ทำตัวเป็นมิตรและเฉลิมฉลองสิ่งดีๆ เกี่ยวกับคนที่ [party_baron.GetSheHe] พบเจอ! ใช่ แม้ แต่การมีความขัดแย้งกับ [party_baron.GetHerHim] ก็ยังน่าพอใจและเป็นมิตรได้ และ [party_baron.GetSheHe] ก็ยืนหยัดในความเชื่อมั่นของ [party_baron.GetHerHis] ขณะที่พยายามเข้าใจของท่าน แต่นั่นก็ยังไม่ใช่...\n\nประเด็นของข้าคือ ทำไมพวกเขาถึงรัก [party_baron.GetHerHim] มากขนาดนั้น?!"
 party_baron.3001.a:0 "ข้าจะแสดงให้พวกเขาเห็นว่าใครที่คู่ควรแก่ความยำเกรง!"
 party_baron.3001.b:0 "บางทีข้าอาจจะรุนแรงไปหน่อย..."

 party_baron.3002.t:0 "$party_baron_header$"
 party_baron.3002.desc:0 "ดังนั้นมันยังไม่พอที่ [party_baron.GetTitledFirstName] จะเป็นที่รักของทุกคน #EMP ข้า#! ต้องรัก [party_baron.GetHerHim] ด้วยหรือ?\n\nข้าหลวงหลายคนของข้าได้ลงนามในหมายศาลร้องขอให้ข้าหยุดพูดจาหยาบคายเกี่ยวกับ [party_baron.GetTitleAsName] ที่ไร้ประโยชน์นั่น!"
 party_baron.3002.a:0 "โอ้ ข้าจะแสดงให้พวกคนชั้นต่ำที่อวดดีเหล่านั้นเห็น "คำพูดหยาบคาย" บางอย่าง"
 party_baron.3002.b:0 "การอ่อนโยนลงเล็กน้อยก็ไม่เสียหาย ในที่สาธารณะ"

 party_baron.3003.desc:0 "แม้หลังจากทุกสิ่งที่ข้าได้พูดเกี่ยวกับ [party_baron.GetHerHim] [party_baron.GetTitledFirstName] ก็ยังคงไม่ย่อท้อ [party_baron.GetSheHe|U] กล้าเข้าหาข้าในงานเลี้ยงตามลำพัง\n\n"ข้ารู้สึกว่าท่านไม่ชอบข้ามากนัก" ข้าพ่นลมหายใจ [party_baron.GetSheHe|U] พูดอีกทีก็ได้ แต่แน่นอนว่าแทนที่จะเป็น เช่นนั้น [party_baron.GetSheHe] กลับพูดต่อโดยไม่สะทกสะท้าน "เราคุยกันสักครู่ได้ไหม?"\n\nทุกสิ่งที่เกิดขึ้นหลังจากนั้นเป็นภาพเบลอ แต่มันกลับกลายเป็นหนึ่งในงานเลี้ยงที่ดีที่สุดในชีวิตของข้า ข้าต้องยอมรับ บางทีข้าอาจจะคิดผิดเกี่ยวกับ [party_baron.GetTitleAsName] ไปจริงๆ..."
 party_baron.3003.a:0 "คิดไม่ถึงว่าท่านจะเอาชนะใจข้าได้ในที่สุด [party_baron.GetFirstNameNoTooltip]!"
 party_baron.3003.b:0 "ไม่! ไม่มีอะไรเปลี่ยนแปลง!"

 party_baron.3004.desc:0 "เรื่องนี้ดำเนินมานานพอแล้ว! ความจริงที่ว่า [party_baron.GetTitledFirstName] ยังคงถูกยกย่องให้เป็นดั่งประภาคารแห่งความดีงามทั้งปวงในมวลมนุษยชาติกำลัง ทำให้ข้าคลั่ง!\n\nไม่ว่ามนต์สะกดอันแยบยลใดที่ [party_baron.GetSheHe] ใช้ครอบงำอาณาจักรอยู่ จะต้องถูกทำลาย"
 party_baron.3004.a:0 "#EMP [party_baron.GetSheHe|U]#! ต้องถูกทำลาย!"
 party_baron.3004.b:0 "ข้า... กำลังทำเกินไปหรือเปล่า?"

 party_baron.4001.desc:1 "การสูญเสีย [previous_character.Custom2('YourCharacterIntroduction', ROOT.Char)] เป็นเรื่องที่ยอมรับได้ยาก [previous_character.GetSheHe|U] เป็นเพื่อนที่ดี และท่านควรภูมิใจใน [previous_character.GetWomanMan] ที่ [previous_character.GetSheHe] เป็น\n\nนี่คงเป็นช่วงเวลาที่ยากลำบากสำหรับท่าน แต่โปรดรู้ไว้ว่าท่านได้รับการสนับสนุนจากข้า!"
 party_baron.4001.a:0 "ขอบคุณสำหรับถ้อยคำอันกรุณาของท่าน"

 party_baron.4002.opening:0 "[party_baron.Custom2('AppropriateGreeting', ROOT.Char)]"
 party_baron.4002.desc:0 "ข้าเข้าใจว่าท่านไม่ชอบข้า นั่นเป็นสิทธิ์ของท่าน แต่ข้าไม่เห็นว่าทำไมท่านถึงยังคงชั่วร้ายและเป็นศัตรูต่อไป ในเมื่อข้าพยายามที่จะเป็นมิตรและสุภาพที่สุดเท่าที่จะทำได้\n\nเรามีโอกาสมากมายที่จะยุติเรื่องนี้ แต่ตอนนี้ข้ากำลังขอร้องท่านเป็นครั้งสุดท้าย ได้โปรด ให้เราเพียงแค่... เป็นเพื่อนกันเถิด"
 party_baron.4002.a:0 "[party_baron.GetSheHe] กล้าดียังไง? [party_baron.GetSheHe] กล้าดียังไง!"

 party_baron.9001.t:0 "อวสานแห่งงานเลี้ยง"
 party_baron.9001.desc:0 "[party_baron.GetTitledFirstName] เป็นเครื่องเตือนใจอันชัดเจนว่า ไม่ว่าเราจะเพลิดเพลินกับชีวิตมากเพียงใด และไม่ว่าเราจะนำความสุขมาสู่โลกนี้มากเพียงใด ทุกสิ่งย่อมมีวันสิ้นสุด"
 party_baron.9001.a:0 "โลกนี้จะขาดสีสันหากไม่มี [party_baron.GetHerHim]"
 party_baron.9001.a.tt:0 "[party_baron.GetShortUIName] กำลังเฉลิมฉลองอยู่ใน [party_baron.GetFaith.PositiveAfterLife]"
 party_baron.9001.b:0 "ดูเหมือนว่า [ROOT.Char.GetFaith.DeathDeityName] จะไม่หลงกลรอยยิ้มจอมปลอมของ [party_baron.GetHerHis]"
 party_baron.9001.b.tt:0 "ในที่สุด [party_baron.GetShortUIName] ก็จากไปตลอดกาล"

 party_baron.9003.t:0 "$party_baron_header$"
 party_baron.9003.desc_positive:0 "ข้าไม่อยากจะเชื่อเลยว่าข้าโชคดีเพียงใด ที่มี [party_baron.GetWomanMan] ผู้นี้อยู่เคียงข้าง ข้าไม่เคยคิดว่าจะรู้สึกมีความสุขเท่ากับในวัน แต่งงานของข้า ราวกับชาวนา [ROOT.Char.Custom('GirlBoy')] ที่ร่าเริง และ [party_baron.GetFirstName] ก็ดูเปล่งปลั่ง\n\nเมื่อ [party_baron.GetSheHe] มองเข้ามาในดวงตาของข้าและกล่าวว่า [party_baron.GetSheHe] ไม่สามารถนึกถึงความสุขใดที่ยิ่งใหญ่ไปกว่าการได้อยู่กับข้าตลอดไป ข้าเชื่อ [party_baron.GetHerHim]"
 party_baron.9003.desc_negative:0 "บางทีนี่อาจเป็นจุดจบที่ถูกกำหนดไว้แล้ว สำหรับความเกลียดชังและความอิจฉาทั้งหมดของข้า ข้าก็ยังไม่อาจต้านทานเสน่ห์ของ [party_baron.GetHerHis] ได้\n\n[party_baron.GetFirstName] ดูเหมือนจะมั่นใจว่าเรื่องนี้จะต้องเกิดขึ้นเสมอ และตอนนี้ที่เรา แต่งงานกันแล้ว [party_baron.GetSheHe] ก็ดูมีความสุขกว่าที่เคย"
 party_baron.9003.a_positive:0 "ข้าเป็นของท่าน ที่รัก!"
 party_baron.9003.a_negative:0 "ในที่สุดท่านก็ได้ข้าไป เจ้าคนเจ้าเสน่ห์!"
