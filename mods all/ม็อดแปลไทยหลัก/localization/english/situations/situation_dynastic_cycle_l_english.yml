 cycle_history_key_rise_of_the_qin: "ดินแดนของเจ็ดรัฐศึกในอดีตถูกรวบรวมเป็นหนึ่งโดยราชวงศ์ฉิน ราชวงศ์จักรวรรดิอย่างแท้จริงราชวงศ์แรก"
 cycle_history_key_collapse_of_the_qin: "ราชวงศ์ฉิน ซึ่งถูกรบกวนโดยกบฏภายใน ไม่ช้าก็ล่มสลายแตกออกเป็นสิบแปดอาณาจักรที่ขัดแย้งกัน"
 cycle_history_key_rise_of_the_han: "ความสงบเรียบร้อยกลับคืนสู่แผ่นดินด้วยชัยชนะของราชวงศ์ฮั่นเหนือคู่แข่งทั้งปวง"
 cycle_history_key_yellow_turban_rebellion: "มวลชนผู้ไม่พอใจ ซึ่งได้รับแรงบันดาลใจจากคำทำนายปฏิวัติ ลุกฮือขึ้นต่อต้านราชวงศ์ฮั่น นำไปสู่ความขัดแย้งภายในนานหลายทศวรรษ"
 cycle_history_key_three_kingdoms_period: "ด้วยการสละราชสมบัติโดยถูกบังคับของจักรพรรดิองค์สุดท้ายแห่งราชวงศ์ฮั่น ยุคแห่งการแบ่งแยกระหว่างสามก๊ก อันได้แก่ เว่ย สู่ และ อู๋ ก็ได้เริ่มต้นขึ้นอย่างเป็นทางการ"
 cycle_history_key_rise_of_the_jin: "ยุคสามก๊กสิ้นสุดลงโดยผู้สำเร็จราชการแห่งเว่ย ผู้ ซึ่งบังคับให้จักรพรรดิสละราชสมบัติและสถาปนาราชวงศ์จิ้นขึ้น"
 cycle_history_key_war_of_the_eight_princes: "รัชสมัยของจักรพรรดิฮุ่ยแห่งจิ้นเต็มไปด้วยความขัดแย้งบ่อยครั้ง เมื่อเหล่าเจ้าชายในราชวงศ์ทำสงครามกันเพื่อแย่งชิงการควบคุมองค์จักรพรรดิ"
 cycle_history_key_sixteen_kingdoms: "การก่อตั้งอาณาจักรแยกตัวในเสฉวนเป็นลางบอกเหตุถึงการแตกสลายของแดนเหนือออกเป็นรัฐคู่แข่งที่แตกแยกกัน"
 cycle_history_key_northern_southern_dynasties: "ความโกลาหลในยุคสิบหกอาณาจักรค่อยๆ เปิดทางให้กับราชวงศ์เหนือ-ใต้ที่มั่นคงยิ่งขึ้น แม้ว่าการรวมชาติอีกครั้งจะยังคงเป็นเพียงความฝัน"
 cycle_history_key_rise_of_the_sui: "ภายหลังการสิ้นพระชนม์ของจักรพรรดิซวนแห่งราชวงศ์โจวเหนือผู้ไม่มั่นคง พ่อตาของเขาก็ได้ยึดอำนาจและก่อตั้งราชวงศ์สุย"
 cycle_history_key_decline_of_the_sui: "โครงการโครงสร้างพื้นฐานที่สิ้นเปลืองและความล้มเหลวทางการทหาร ทำให้ราชวงศ์สุยต้องคุกเข่า จักรพรรดิถูกลอบปลงพระชนม์ และเด็กน้อยถูกยกขึ้นนั่งแทนที่"
 cycle_history_key_rise_of_the_tang: "ผู้สำเร็จราชการแผ่นดินบีบบังคับให้จักรพรรดิน้อยแห่งสุยสละราชสมบัติ และขึ้นครองราชย์เป็นจักรพรรดิองค์แรกแห่งราชวงศ์ถัง"
 cycle_history_key_an_lushan_rebellion: "แม่ทัพอันลู่ซานนำการกบฏที่ไม่ประสบผลสำเร็จต่อต้านราชวงศ์ถัง ซึ่งส่งผลหายนะร้ายแรงต่อผู้คนนับล้าน"
 cycle_history_key_collapse_of_the_tang: "การลอบปลงพระชนม์จักรพรรดิถังองค์สุดท้ายถือเป็นจุดสิ้นสุดของราชวงศ์ โดยมีขุนศึกกว่าสิบสองคนแข่งขันกันเพื่อการยอมรับในฐานะผู้สืบทอด"
 cycle_history_key_rise_of_the_song: "แม่ทัพผู้ปราดเปรื่องรวบรวมอาณาจักรที่ทำสงครามกันและนำเข้าสู่ยุคใหม่แห่งสันติภาพและความเจริญรุ่งเรืองในฐานะผู้ก่อตั้งราชวงศ์ซ่ง"
 cycle_history_key_sack_of_kaifeng_by_jin: "ราชวงศ์ซ่งประสบความพ่ายแพ้ครั้งใหญ่เมื่อเมืองหลวงของจักรวรรดิถูกบุกปล้นโดยราชวงศ์จินของชาวจูร์เชน องค์จักรพรรดิเองก็ถูกจับเป็นเชลย"

