 nick_the_devil:0 "ปิศาจ"
 nick_the_devil_desc:1 "เจตนาร้ายปกคลุมการกระทำของ[CharYourHerHis(CHARACTER)]ดุจเสื้อคลุม และทั่วทั้งแผ่นดินคิดถึงการกระทำของ[CharYourHerHis(CHARACTER)]ด้วยเจตนาที่เลวร้ายที่สุดเท่าที่จะเป็นไปได้"
 nick_the_drunkard:0 "ขี้เมา"
 nick_the_drunkard_desc:1 "[CHARACTER.GetShortUINameNoTooltipNoFormat|U] ใช้[_s(CHARACTER)] ชีวิตของ[CharYourHerHis(CHARACTER)]ค้นหาความกระจ่างแจ้งที่ก้นเหยือก ทุกคนรู้ว่า [CharYouSheHe(CHARACTER)] จะไม่มีวันพบมัน"
 nick_the_fair:0 "ผู้งดงาม"
