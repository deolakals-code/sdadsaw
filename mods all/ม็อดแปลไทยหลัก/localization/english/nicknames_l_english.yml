 nick_the_chaste:0 "ผู้บริสุทธิ์"
 nick_the_chaste_desc:1 "[CHARACTER.GetShortUINameNoTooltipNoFormat|U] [CharAreIs(CHARACTER)] มีชื่อเสียงในด้านความพึงพอใจในการนอนหลับฝันดีของ[CharYourHerHis(CHARACTER)]"
 nick_the_confessor:0 "ผู้สารภาพบาป"
 nick_the_confessor_desc:1 "[CHARACTER.GetShortUINameNoTooltipNoFormat|U] [CharAreIs(CHARACTER)] มีชื่อเสียงในด้านความสำนึกผิดต่อบาปแม้เพียงเล็กน้อยของ[CharYourHerHis(CHARACTER)]"
 nick_the_conqueror:0 "ผู้พิชิต"
 nick_the_conqueror_desc:1 "จะมีวีรกรรมใดยิ่งใหญ่กว่าการปราบปรามอาณาจักร#EMP ทั้งหมด#! ที่ถูกบันทึกไว้ในพงศาวดารได้อีกเล่า? [CharYouSheHe(CHARACTER)|U] จะไม่ยอมให้ผู้คนลืมความสำเร็จของ[CharYourHerHis(CHARACTER)]อย่างแน่นอน"
