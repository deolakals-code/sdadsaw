 nick_the_panther_head:0 "เศียรพยัคฆ์ดำ"
 nick_the_panther_head_desc:1 "ดวงตาอันดุร้ายและแหลมคม หนวดที่แข็งกระด้าง และเสียงคำรามดุจแมวป่าของ[CharYourHerHis(CHARACTER)|U] ทำให้ [CHARACTER.GetShortUINameNoTooltipNoFormat] ได้รับสมญานามของ[CharYourHerHis(CHARACTER)]อย่างสมควรยิ่ง"
 nick_the_thunderbolt:0 "อสนีบาต"
 nick_the_thunderbolt_desc:1 "คำพูดทั่วไปกล่าวว่าศัตรูของ[CharYourHerHis(CHARACTER)]จะได้ยิน [CHARACTER.GetShortUINameNoTooltipNoFormat] ก็ต่อเมื่อ [CharYouSheHe(CHARACTER)] [CharHaveHas(CHARACTER)] โจมตีไปแล้ว"
 nick_the_whirlwind:0 "ลมหมุน"
 nick_the_whirlwind_desc:1 "[CHARACTER.GetShortUINameNoTooltipNoFormat|U] โจมตีอย่างหนักหน่วง รวดเร็ว และเหนือสิ่งอื่นใด คาดเดาไม่ได้"
 nick_the_beautiful_beard:0 "เครางาม"
