 nick_the_dane:0 "ชาวเดน"
 nick_the_dane_desc:1 "โลกรับรู้ว่า [CharYouSheHe(CHARACTER)] เป็นชาวสแกนดิเนเวียผู้ฉาวโฉ่ โลกไม่สนใจเป็นพิเศษว่าเป็น #EMP ประเภท#! ใด"
 nick_pendragon:0 "เพนดรากอน"
 nick_pendragon_desc:1 "[CHARACTER.GetShortUINameNoTooltipNoFormat|U] พึ่งพา... ตำนาน #EMP เก่าแก่#! เพื่อช่วยในการอ้างสิทธิ์เหนือบริทานเนียของ[CharYourHerHis(CHARACTER)]"
 nick_the_tuatha_de_danann:0 "ทูอาธา เด ดานันน์"
