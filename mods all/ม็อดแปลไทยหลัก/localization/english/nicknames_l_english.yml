 nick_the_corrupt:0 "ผู้ทุจริต"
 nick_the_corrupt_desc: "[CHARACTER.GetShortUINameNoTooltipNoFormat|U] [CharAreIs(CHARACTER)] เป็นสิ่งมีชีวิตที่ฉลาด หมอบอยู่บนกองทองคำที่มีที่มาน่าสงสัย"
