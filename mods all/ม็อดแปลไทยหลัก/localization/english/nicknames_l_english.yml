 nick_hildetand:0 "เขี้ยวสงคราม"
 nick_hildetand_desc:1 "ตำนานเล่าขานถึง [CHARACTER.GetShortUINameNoTooltipNoFormat] ที่สูญเสียฟันอย่างน่าทึ่งในสนามรบ — เพียงเพื่อจะงอกฟันใหม่สองซี่ขึ้นมาอย่างน่าอัศจรรย์"
 nick_lodbrok:1 "โลธบร็อค"
 nick_lodbrok_desc:1 "มหาชนขี้ขลาดทั่วโลกเรียก[CharYouHerHim(CHARACTER)]ว่า "กางเกงขนดก" เพราะมีคำกล่าวว่า [CharYouSheHe(CHARACTER)] สวม[_s(CHARACTER)] กางเกงที่ทำจากหนัง ซึ่งฉีกมาจากซากของเวิร์มอันทรงพลัง แน่นอนว่าเป็นตัวที่ #EMP [CharYouSheHe(CHARACTER)]#! สังหารเอง"
 nick_ring:0 "แหวน"
