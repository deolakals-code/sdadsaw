 nick_the_defiant_desc:1 "ให้พวกเขามา ให้พวกเขาทั้งหมดมา! หนทางของ[CHARACTER.GetShortUINamePossessiveNoTooltipNoFormat|U] คือหนทางที่ถูกต้อง และ [CharYouSheHe(CHARACTER)] จะฆ่าคนให้มากที่สุดเท่าที่ [CharYouSheHe(CHARACTER)] [CharHaveHas(CHARACTER)] ต้องทำเพื่อพิสูจน์!"
