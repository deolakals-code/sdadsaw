 nick_the_bold:0 "ผู้กล้า"
 nick_the_bold_desc:1 "ท้าทาย ไม่ย่อท้อ กล้าหาญ องอาจ เยี่ยงวีรบุรุษ — นามของ[CharYourHerHis(CHARACTER)] มีความหมายเดียวกับการลงมือปฏิบัติอย่างรวดเร็ว แม้ แต่ศัตรูของ[CharYourHerHis(CHARACTER)] ก็ยังเรียก [CHARACTER.GetShortUINameNoTooltipNoFormat] ว่า "$nick_the_bold$" อย่างน้อยมันก็ช่วยหยุดคลื่นคำพ้องความหมายได้"
 nick_the_boneless:0 "ผู้ไร้กระดูก"
