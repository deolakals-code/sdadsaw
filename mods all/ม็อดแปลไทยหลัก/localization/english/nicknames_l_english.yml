 nick_the_wake_desc:1 "[CHARACTER.Custom('EyeEyes')|U] เฝ้าระวังความอยุติธรรมอยู่เสมอ ทั้งผู้พิชิตต่างชาติและผู้ทรยศในชาติ ต่างก็ตัวสั่นเมื่อเอ่ยถึงชื่อของ[CharYourHerHis(CHARACTER)]!"
 nick_the_bearded:0 "ผู้มีเครา"
 nick_the_bearded_desc:1 "เช่นเดียวกับผู้ชายหลายคน [CharYouSheHe(CHARACTER)] [CharHaveHas(CHARACTER)] เครา [CharYouSheHe(CHARACTER)|U] [CharAreIs(CHARACTER)] ไม่แน่ใจจริงๆ ว่าทำไมผู้คนถึงยืนกรานที่จะชี้ให้เห็น"
