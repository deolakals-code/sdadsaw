 nick_the_good:0 "ผู้ประเสริฐ"
 nick_the_good_desc:1 "อุปนิสัยอันชอบธรรมและความมุ่งมั่นต่อคุณค่าแห่งศรัทธาของ[CharYourHerHis(CHARACTER)|U] ทำให้ [CHARACTER.GetFaith.GetAdherentNamePluralNoTooltip] อื่นๆ มอง [CHARACTER.GetShortUINameNoTooltipNoFormat] ด้วยความยำเกรง"
 nick_the_gouty:0 "ผู้เป็นเกาต์"
