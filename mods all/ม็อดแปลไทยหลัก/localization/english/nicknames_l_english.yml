 nick_the_undefeated:0 "ผู้ไม่เคยแพ้"
 nick_the_undefeated_desc:1 "ไม่เคยพ่ายแพ้ในการรบเลยแม้ แต่น้อย [CharYouSheHe(CHARACTER)] [CharHaveHas(CHARACTER)] ไม่เคยลิ้มรสความเจ็บปวดของความพ่ายแพ้อันน่าอดสู"
 nick_the_triumphant:0 "ผู้มีชัยชนะ"
 nick_the_triumphant_desc:1 "เมื่อโลกส่งแชมป์เปี้ยนที่อ้างว่าไม่มีใครเอาชนะได้มา [CharYouSheHe(CHARACTER)] ก็โค่นล้มพวกเขาและทำลายตำนานของพวกเขา"
 nick_the_fury:0 "ผู้เกรี้ยวกราด"
 nick_the_fury_desc:1 "ความโกรธเกรี้ยวของ [CHARACTER.GetShortUINamePossessiveNoTooltipNoFormat|U] ความเคียดแค้นของ [CharYourHerHis(CHARACTER)] #EMP การแก้แค้น#! ของ [CharYourHerHis(CHARACTER)] ถือเป็นสิ่งที่หลีกเลี่ยงไม่ได้อันน่าสะพรึงกลัว และมัน #EMP ก็#! หลีกเลี่ยงไม่ได้จริงๆ"
 nick_feareater:0 "ผู้กลืนกินความกลัว"
 nick_feareater_desc:1 "ความกลัว ความเกลียดชัง #EMP ความหวาดหวั่น#! ของศัตรูเป็นแรงจูงใจให้ [CHARACTER.GetShortUINameNoTooltipNoFormat] กระตุ้น[CharYouHerHim(CHARACTER)]ให้กระทำการกระหายเลือดและโหดร้าย การกระทำที่มีประสิทธิภาพอย่างยิ่งยวด"
 nick_the_hawk:0 "เหยี่ยว"
 nick_the_hawk_desc:1 "น้อยสิ่งนักที่จะรอดพ้นสายตาอันแหลมคมของ[CharYourHerHis(CHARACTER)] — ไม่มีสิ่งใดรอดพ้นกรงเล็บอันแหลมคมของ[CharYourHerHis(CHARACTER)]"
 nick_the_trustworthy:0 "ผู้น่าเชื่อถือ"
