 nick_beth_nahrain: "องค์อธิปัตย์แห่งสองนครา"
 nick_beth_nahrain_desc: "การปรากฏตัวของบุคคลผู้นี้เพียงลำพังก็ส่งคลื่นยักษ์ถาโถมเข้าสู่มวลชน ทำให้พวกเขาถูกพัดพาไปด้วยความยำเกรงและความพิศวงในความสำเร็จแห่งการรวมเป็นหนึ่งของพวกเขา"
 nick_the_child_killer:0 "นักฆ่าเด็ก"
 nick_the_child_killer_desc:1 "นักวิชาการพระคัมภีร์โดยทั่วไปถือว่า [CharYouSheHe(CHARACTER)] พลาดประเด็นคำตัดสินของโซโลมอน"
 nick_the_anathema:0 "ผู้น่าชิงชัง"
 nick_the_anathema_desc:1 "ความโกลาหลของโลกมนุษย์ถอยห่างจาก [CHARACTER.GetShortUINameNoTooltipNoFormat]"
 nick_the_angel_of_death:1 "ทูตแห่ง[CHARACTER.GetFaith.DeathDeityName|U]"
 nick_the_angel_of_death_desc:1 "ในใจของ[CharYourHerHis(CHARACTER)] [CharYouSheHe(CHARACTER)] ได้ยุติความทุกข์ทรมานของพวกเขา นั่นไม่ใช่วิธีที่โลกส่วนที่เหลือมองเห็น"
 nick_monophthalmos:0 "โมโนฟทาลมอส"
 nick_monophthalmos_desc:1 "ดวงตาข้างที่เหลือของ[CHARACTER.GetShortUINamePossessiveNoTooltipNoFormat|U] ได้รับความสนใจมากกว่าดวงตาทั้งสองข้างที่เคยได้รับ"
 nick_health_god_mercy:0 "ความเมตตาของ[CHARACTER.GetFaith.HealthGodNamePossessive|U]"
 nick_health_god_mercy_desc:1 "แม้จะมีจุดเริ่มต้นอันต่ำต้อย [CharYouSheHe(CHARACTER)]ก็ได้ค้นพบเส้นทางของ[CharYourHerHis(CHARACTER)]สู่โลกแห่งการแพทย์ และสร้างชื่อเสียงให้[CharYourHerHimself(CHARACTER)]ด้วยการดูแลรักษาคนยากจน""
 nick_genghis_khan:0 "เจงกิส ข่าน"
 nick_genghis_khan_desc:1 "[CHARACTER.GetShortUINameNoTooltipNoFormat|U] [CharAreIs(CHARACTER)] คือการลงทัณฑ์ของ [CHARACTER.GetFaith.HighGodName] สำหรับบาปทั้งหมดของโลก — เพราะหากโลกไม่เต็มไปด้วยคนบาป [CHARACTER.GetFaith.HighGodName] จะส่งคน เช่น #EMP [CharYouHerHim(CHARACTER)]#! มาลงทัณฑ์หรือ?"
 nick_cengiz_khan: "เจงกิสข่าน"
 nick_cengiz_khan_desc: "$nick_genghis_khan_desc$"
 nick_yekhe_khagan: "เยเคคากาน"
 nick_yekhe_khagan_desc: "ผู้ยิ่งใหญ่, ผู้เกรียงไกร, ประมุขแห่งทะเลทุ่งหญ้าและดินแดนทั้งปวงที่ผู้คนตั้งรกราก! [CHARACTER.GetShortUINameNoTooltipNoFormat|U] [CharAreIs(CHARACTER)] อาชาผู้ผงาดครอบครองโลกหล้า"
 nick_dort_yonlug_khagan: "เดิร์ทยอนลุกคากาน"
 nick_dort_yonlug_khagan_desc: "ปฐพีแผ่ไพศาลออกไปทั้งสี่ทิศานุทิศอันกว้างใหญ่ และ — แม้กระทั่งจนสุดขอบเขต ณ ดินแดนปลายทางอันมืดมิดและลี้ลับ — ทุกสิ่งล้วนเป็นสิทธิ์อันชอบธรรมของ [CHARACTER.GetShortUINameNoTooltipNoFormat]! สรรพสิ่งในจักรวาลถูกจัดเรียงไว้เพื่ออำนวยแด่ [CharYourHerHis(CHARACTER)], ตามพระบัญชาของ [CharYourHerHis(CHARACTER)]"
 nick_tengri_khagan: "เตงกรีคากาน"
 nick_tengri_khagan_desc: "ในยุคโบราณสมัยเหล่าคากานแห่งเกอคเติร์กผู้ยิ่งใหญ่ ยศนี้ได้ถูกจารึกไว้ในศิลา! เตงกรีคากาน — ผู้ถือกำเนิดจากสรวงสวรรค์, ผู้ทรงปรีชา: [CHARACTER.GetShortUINameNoTooltipNoFormat] ถูกสร้างขึ้นโดยนภากาศสีครามอันยิ่งใหญ่เพื่อปกครองโลก"
 nick_xormuzta: "โซรมุซตา"
 nick_xormuzta_desc: "สมัญญานามโบราณ ซึ่งครั้งหนึ่งเคยเกี่ยวข้องกับ 'เทพเจ้าสวรรค์' ของอิหร่านยุคเก่า และบัดนี้ถูกใช้ในหมู่ชาวคริสเตียนตะวันออกและพวกพ้องเพื่อเคารพบูชาเหล่าผู้ก่อตั้งในตำนานดุจ เช่น [CHARACTER.GetShortUINameNoTooltipNoFormat]"
 nick_mar_sargis: "มาร์ ซาร์กิส"
 nick_mar_sargis_desc: "กล่าวกันว่าทรงได้รับการชี้นำสู่การปกครองอันเปี่ยมศรัทธาด้วยนิมิตศักดิ์สิทธิ์ โดยมีนักบุญซาร์กิสผู้พลีชีพเป็นองค์อุปถัมภ์ของ [CharYourHerHis(CHARACTER)]"
 nick_cihangir: "จีฮันกีร์"
 nick_cihangir_desc: "ด้วยพระประสงค์อันศักดิ์สิทธิ์แห่งอัลลอฮ์ [CHARACTER.GetShortUINameNoTooltipNoFormat] [CharAreIs(CHARACTER)] ผู้พิชิตทั่วทั้งโลกหล้า ไม่เคยปรากฏว่าดารุลอิสลามและดินแดนของเหล่าผู้ไร้ศรัทธาจักได้ยินเสียงกีบม้าดังกึกก้องถึงเพียงนี้มาก่อน!"
 nick_culture_khagan: "[CHARACTER.GetCulture.GetNameNoTooltip] คากาน"
 nick_culture_khagan_desc: "[CHARACTER.GetShortUINameNoTooltipNoFormat|U] [CharAreIs(CHARACTER)] ผู้ได้รับการเทิดทูนว่าเป็นผู้ยิ่งใหญ่ที่สุดในหมู่ [CHARACTER.GetCulture.GetCollectiveNounNoTooltip] ทั้งปวง, และเหล่า [CHARACTER.GetCulture.GetCollectiveNounNoTooltip] ของ [CharYourHerHis(CHARACTER)] — เหล่าบุตรแห่งชะตาลิขิต, เหล่าทหารม้าผู้เหยียบย่ำนคร, ผู้กวัดแกว่งดาบและแส้แห่งจักรวรรดิ!"
 nick_akhshunwar: "อัคชุนวาร์"
 nick_akhshunwar_desc: "เนิ่นนานมาแล้วที่เหล่านายเหนือแห่งเส้นทางสายไหมได้ดำรงยศสูงส่งดุจ #EMP อิخشิด#!, #EMP ชาห์ฮันชาห์#!, และ #EMP อัคชุนวาร์#!, แต่หามีผู้ใดเคยคู่ควรเท่า [CHARACTER.GetShortUINameNoTooltipNoFormat] ในการดำรงสมัญญานาม 'ผู้ทรงพลังอำนาจ' มาก่อนไม่!"

 nick_fabulous_she_he:0 "[CHARACTER.GetSheHe|U]ผู้งดงาม, [CHARACTER.GetFirstNameNoTooltip|U]"
