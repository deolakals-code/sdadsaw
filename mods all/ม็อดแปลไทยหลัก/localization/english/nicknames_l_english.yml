 nick_the_trustworthy_ironic:0 "$nick_the_trustworthy$"
 nick_the_trustworthy_ironic_desc:1 "[CHARACTER.GetShortUINameNoTooltipNoFormat|U] [CharHaveHas(CHARACTER)] ไม่เคยพูดโกหกเลยแม้ แต่ครั้งเดียวในชีวิตของ[CharYourHerHis(CHARACTER)]"
 nick_the_unrelenting:0 "ผู้ไม่ย่อท้อ"
 nick_the_unrelenting_desc:1 "เมื่อ[CharYouSheHe(CHARACTER)]ตั้งใจ[_s(CHARACTER)]จิตใจของ[CharYourHerHis(CHARACTER)]ทำสิ่งใดแล้ว [CharYouSheHe(CHARACTER)]ย่อม ทำให้สำเร็จ[_s(CHARACTER)] ไม่ว่าจะใช้เวลานานเพียงใดก็ตาม""
 nick_the_glorious:0 "ผู้รุ่งโรจน์"
 nick_the_glorious_desc:1 "[CHARACTER.GetShortUINameNoTooltipNoFormat|U] [CharAreIs(CHARACTER)] จะต้องถูกจารึกไว้ในประวัติศาสตร์อย่างแน่นอนว่าเป็นหนึ่งในบุคคลผู้ทรงสง่าราศีที่สุดเท่าที่เคยมีมาในโลก"
 nick_the_ecumenist:0 "นักเอกภาพคริสต์"
 nick_the_ecumenist_desc:1 "ความพยายามของ[CharYourHerHis(CHARACTER)|U]ในการรวมและประนีประนอมโลกคริสเตียน ทำให้ [CHARACTER.GetShortUINameNoTooltipNoFormat] เป็นวีรบุรุษของหลายๆ คน — หาก แต่ก็เป็นพวกนอกรีตสำหรับบางคน เช่นกัน"
 nick_the_unifier_of_africa:0 "ผู้รวมแอฟริกา"
 nick_the_unifier_of_africa_desc:1 "[CHARACTER.GetShortUINameNoTooltipNoFormat|U] [CharAreIs(CHARACTER)] มนุษย์คนแรกในประวัติศาสตร์ที่รวมแอฟริกาที่รู้จักกันภายใต้ธงของ[CharYourHerHis(CHARACTER)]"
