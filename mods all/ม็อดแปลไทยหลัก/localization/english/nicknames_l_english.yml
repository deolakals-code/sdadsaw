 nick_the_beautiful_beard_desc:1 "ความหนา ลอนผม กลิ่นหอมกรุ่นของมัน จะมีใครในโลกกล้าอ้างว่ามีเคราอันสง่างาม เช่น [CharYouSheHe(CHARACTER)] ได้อีกเล่า?"
 nick_the_tattooed_monk:0 "นักพรตสักลาย"
 nick_the_tattooed_monk_desc:1 "พละกำลังอันมหาศาลของ[CHARACTER.GetShortUINamePossessiveNoTooltipNoFormat|U]อาจเป็นตำนาน แต่ [CharYouSheHe(CHARACTER)] [CharAreIs(CHARACTER)] ยินดีที่ผู้คนนึกถึงรอยสักอันงดงามบนร่างกายของ[CharYourHerHis(CHARACTER)]ก่อน"
 nick_the_pilgrim:0 "นักแสวงบุญ"
 nick_the_pilgrim_desc:1 "มีเพียงไม่กี่คนที่เดินทางไกลและกว้างขวางเท่า [CHARACTER.GetShortUINameNoTooltipNoFormat] [CharDoDoes(CHARACTER)] แต่ [CharYouSheHe(CHARACTER)] รู้[_s(CHARACTER)] ว่าการที่จะเข้าใจศรัทธาของ[CharYourHerHis(CHARACTER)]อย่างแท้จริง [CharYouSheHe(CHARACTER)] ต้องประสบกับมัน สถานที่ศักดิ์สิทธิ์ที่สุดของมัน และการแสดงออกที่หลากหลายของมัน"
 nick_the_black_whirlwind:0 "ลมหมุนทมิฬ"
 nick_the_black_whirlwind_desc:1 "สายตาของ[CHARACTER.GetShortUINamePossessiveNoTooltipNoFormat|U] สร้างความหวาดกลัวในใจของผู้คน"
 nick_the_unrestrained:0 "ผู้ไร้พันธนาการ"
 nick_the_unrestrained_desc:1 "สมญานามของ[CHARACTER.GetShortUINamePossessiveNoTooltipNoFormat|U] เป็นทั้งความคิดเห็นเกี่ยวกับลิ้นที่พล่อยของ[CharYourHerHis(CHARACTER)] และความสามารถในการวิ่งหนีผู้คุมของ[CharYourHerHis(CHARACTER)]"
 nick_the_winged_tiger:0 "พยัคฆ์ติดปีก"
 nick_the_winged_tiger_desc:1 "สิ่งเดียวที่เทียบเท่ากับความดุร้ายของ[CharYourHerHis(CHARACTER)]คือการกระโดดในแนวดิ่งของ[CharYourHerHis(CHARACTER)]"
 nick_the_turbulent_river_dragon:0 "มังกรวารีเชี่ยว"
 nick_the_turbulent_river_dragon_desc:1 "[CHARACTER.GetShortUINameNoTooltipNoFormat|U] ลง[_s(CHARACTER)] ไปในน้ำและพื้นที่ชุ่มน้ำเหมือน... มังกร"
 nick_the_wild:0 "เถื่อน"
 nick_the_wild_desc:0 "ท่าทางคลุ้มคลั่ง การกระทำบ้าคลั่ง และบ้าคลั่งในสนามรบ"
 nick_the_ferocious_giant:0 "ยักษ์ดุร้าย"
