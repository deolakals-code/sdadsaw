 nick_barbarossa:0 "บาร์บารอสซา"
 nick_barbarossa_desc: "เพื่อเป็นเกียรติอย่างน่าสงสัยแก่เคราที่เคยเป็นสีแดงเข้มประดับคางของเขา [CHARACTER.GetShortUINameNoTooltipNoFormat] ได้รับการขนานนามว่า #italic บาร์บารอสซา#! - เคราแดง - โดยศัตรูชาวอิตาลีของเขา"

 nick_danishmend:0 "ดานิชเมนด์"
