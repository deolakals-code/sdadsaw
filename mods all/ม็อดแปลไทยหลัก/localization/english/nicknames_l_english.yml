 nick_the_prodigy:0 "อัจฉริยะ"
 nick_the_prodigy_desc:1 "ในฐานะผู้รู้รอบด้านอันเลื่องชื่อ [CharYouSheHe(CHARACTER)]แสดงให้เห็น[_s(CHARACTER)]ทักษะอันยอดเยี่ยมในแทบทุกสิ่งที่[CharYouSheHe(CHARACTER)]ตั้งใจ[_s(CHARACTER)]จิตใจของ[CharYourHerHis(CHARACTER)]จะทำ""
 nick_the_defender_of_highgod:0 "ผู้พิทักษ์แห่ง[CHARACTER.GetFaith.HighGodName]"
 nick_the_defender_of_highgod_desc:1 "[CHARACTER.GetFaith.GetName] มีผู้พิทักษ์ เช่น [CHARACTER.GetShortUINameNoTooltipNoFormat] เพียงไม่กี่คนในโลกมนุษย์"
 nick_the_blood_motherfather:0 "โลหิต-[CHARACTER.GetMotherFather|U]"
 nick_the_blood_motherfather_desc:1 "ผู้คนกระซิบสมญานามของ[CharYourHerHis(CHARACTER)]ด้วยความกลัวและความยำเกรง — ต้องเป็น [CHARACTER.Custom('MatriarchPatriarch')] ประเภทหนึ่งจึงจะปฏิบัติต่อครอบครัว [CHARACTER.GetHerHis] เหมือนที่ [CharYouSheHe(CHARACTER)] [CharDoDoes(CHARACTER)]"
 nick_the_divine:0 "เทวะ"
 nick_the_divine_desc:1 "มีเพียงไม่กี่คนที่ได้ยินเรื่องของ [CHARACTER.GetShortUINameNoTooltipNoFormat] แล้วจะคิดถึงสิ่งอื่นได้ — แน่นอนว่า [CharYouSheHe(CHARACTER)] [CharAreIs(CHARACTER)] อย่างน้อยก็ได้รับการสัมผัสจากสวรรค์?"
