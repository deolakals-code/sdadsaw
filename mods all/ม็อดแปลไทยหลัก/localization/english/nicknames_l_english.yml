 nick_the_motherfather_of_spain_desc:1 "[CHARACTER.GetShortUINameNoTooltipNoFormat|U] ได้อภิเษกสมรส/สมรสรวมอาณาจักรไอบีเรียที่แตกต่างกันหลายแห่งเข้าเป็นหนึ่งเดียว เป็นรากฐานที่มั่นคง — สเปน"
 nick_the_ladylord_of_the_ganges:0 "[CHARACTER.GetLadyLord|U]แห่งคงคา"
 nick_the_ladylord_of_the_ganges_desc:1 "[CHARACTER.GetShortUINameNoTooltipNoFormat|U] [CharAreIs(CHARACTER)] ผู้ดูแลอันศักดิ์สิทธิ์ของแม่น้ำที่ศักดิ์สิทธิ์ #EMP ที่สุด#! ของโลก"
 nick_the_wend:0 "ชาวเวนด์"
 nick_the_wend_desc:1 "หลังจากรวมอาณาจักรสลาฟตะวันตกที่แตกต่างกันเข้าเป็นหนึ่งเดียว [CharYouSheHe(CHARACTER)] [CharAreIs(CHARACTER)] ก็กลายเป็นตำนานในยุคสมัยของ[CharYourHerHis(CHARACTER)]เอง"
 nick_the_crowned:0 "ผู้สวมมงกุฎ"
