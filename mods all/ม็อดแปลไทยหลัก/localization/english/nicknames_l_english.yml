 nick_the_hammer:0 "ค้อนเหล็ก"
 nick_the_hammer_desc:1 "ผู้ใดที่อยากรู้ว่าเหตุใดพวกเขาจึงเรียก[CharYouHerHim(CHARACTER)]ว่า $nick_the_hammer$ เพียงแค่ถามศัตรูผู้โชคร้ายของ[CharYourHerHis(CHARACTER)]เท่านั้น"
 nick_the_handsome:0 "รูปงาม"
 nick_the_handsome_desc:1 "#EMP โอ้#! มีเพียงไม่กี่คนในโลกที่อวดอ้างกรามที่ได้รูป ไหล่ที่ตั้งตรง หรือ [CHARACTER.Custom('EyeEyes')] อันงดงาม[CHARACTER.Custom('Eye_ArticleBlank')] เช่นนั้น"
 nick_the_heathen:0 "คนนอกศาสนา"
 nick_the_heathen_desc:1 "ในการเปลี่ยนศาสนาอันเลวร้ายอย่างแท้จริง [CharYouSheHe(CHARACTER)] ไม่เพียง แต่ละทิ้งศรัทธาของ[CharYourHerHis(CHARACTER)] ไม่เพียง แต่ศาสนาของ[CharYourHerHis(CHARACTER)] แต่ยังละทิ้งประเพณีทางศาสนา #EMP ทั้งหมด#! ของ[CharYourHerHis(CHARACTER)] หันไปนับถือมุมมองต่อระเบียบแห่งสวรรค์ที่แตกต่างไปโดยสิ้นเชิง"
 nick_the_heathen_rebel:0 "$nick_the_heathen$"
 nick_the_heathen_rebel_desc:1 "[CHARACTER.GetShortUINameNoTooltipNoFormat|U] [CharAreIs(CHARACTER)] เป็นที่รู้จักจากการกบฏต่อสิ่งที่ [CharYouSheHe(CHARACTER)] เห็น[_s(CHARACTER)] ว่าเป็นวิถีการบูชารูปเคารพของเพื่อนร่วมชาติของ[CharYourHerHis(CHARACTER)] และเทววิทยาที่ผิดๆ ของพวกเขา"
 nick_the_holy:0 "ผู้ศักดิ์สิทธิ์"
 nick_the_holy_desc:1 "ไม่มีความชั่วร้าย บาป การลบหลู่ หรือความอธรรมใดๆ มา ทำให้ชีวิตที่สวรรค์กำหนดของ[CharYourHerHis(CHARACTER)]ต้องมัวหมอง"
 nick_the_hunchback:0 "ผู้งุ้ม"
 nick_the_hunchback_desc:1 "ไม่มีผู้ใดที่มอง [CHARACTER.GetShortUINameNoTooltipNoFormat] แล้วจะไม่สังเกตก้อนเนื้อที่เด่นชัดบนหลังของ[CharYourHerHis(CHARACTER)]และศีรษะที่ยื่นออกมาของ[CharYourHerHis(CHARACTER)] บางครั้งดูเหมือนว่านั่นคือทั้งหมดที่พวกเขามองเห็น"
 nick_the_hunter:0 "พราน"
 nick_the_hunter_desc:1 "การยิงอันรวดเร็วและสายตาอันว่องไวกว่าของ[CHARACTER.GetShortUINamePossessiveNoTooltipNoFormat|U] มีชื่อเสียงเลื่องลือไปไกลหลายโยชน์ในทุกทิศทาง บ้างก็ว่าคันธนูของ[CharYourHerHis(CHARACTER)]สามารถยิงไปได้ไกลเท่าที่ชื่อเสียงของ[CharYourHerHis(CHARACTER)]เดินทางไปถึง"
 nick_the_ironside:0 "สีข้างเหล็ก"
 nick_the_ironside_desc:1 "หอก ขวาน ดาบ ลูกธนู — [CharYouSheHe(CHARACTER)] [CharAreIs(CHARACTER)] มีชื่อเสียงว่าสามารถปัดป้องการโจมตีใดๆ ได้ ตั้งแต่การฟาดฟันอันสง่างามที่สุดไปจนถึงคมดาบของนักฆ่า"
 nick_the_just:0 "ผู้ยุติธรรม"
 nick_the_just_desc:0 "กฎหมายและความสงบเรียบร้อยคือรากฐานของทุกสิ่งที่ดีงามในชีวิต หากปราศจากกฎหมาย ความสงบเรียบร้อยก็คือการปกครองแบบเผด็จการ หากปราศจากความสงบเรียบร้อย กฎหมายก็ไร้อำนาจ"
 nick_the_kind:0 "ผู้ใจดี"
 nick_the_kind_desc:1 "คำพูดที่สงบ รอยยิ้มที่ปลอบโยน คำเชิญในวันที่หนาวเหน็บ — [CharYouSheHe(CHARACTER)] เชื่อ[_s(CHARACTER)] ว่าโลกสามารถขับเคลื่อนได้ด้วยความเมตตาเพียงเล็กน้อย"
 nick_the_lame:0 "ผู้พิการขา"
 nick_the_lame_desc:1 "ถูกรบกวนด้วยขาที่พิการ โลกไม่เพียง แต่ปฏิเสธที่จะอำนวยความสะดวก พวกเขายังไม่ยอมให้ [CHARACTER.GetShortUINameNoTooltipNoFormat] ลืมอีกด้วย"
 nick_the_lawgiver:0 "ผู้บัญญัติกฎหมาย"
 # em-dashes out in memory of Maxi.
 nick_the_lawgiver_desc:1 "กฎเกณฑ์ ระเบียบ กระบวนการอันควร — ของขวัญที่[CharYourHerHis(CHARACTER)]มอบให้แก่ประชาชนของ[CharYourHerHis(CHARACTER)]นั้นมีมากมาย"
 nick_the_liberator:0 "ผู้ปลดปล่อย"
 nick_the_liberator_desc:1 "ด้วยคมเหล็กกล้าหรือวาจาคมคาย [CharYouSheHe(CHARACTER)] [CharHaveHas(CHARACTER)] ได้มา ซึ่งอิสรภาพอันยิ่งใหญ่แก่ผู้ที่ตกเป็นทาส"
 nick_the_lion:0 "ราชสีห์"
 nick_the_lion_desc:1 "สูงศักดิ์ ดุร้าย สง่างาม: หากสิงโตคือเจ้าป่า ความคล้ายคลึงที่เห็นได้ชัดของ[CharYourHerHis(CHARACTER)]กับสัตว์ชนิดนี้ก็บ่งบอกถึงชะตากรรมอันสดใสของ [CHARACTER.GetShortUINameNoTooltipNoFormat]"
 nick_the_lionheart:0 "ใจสิงห์"
 # I wish to protest having to write nice things about Richard the Lionheart.
 ## Everyone knows Edward I is the superior English king, and that his great uncle sucks.
 nick_the_lionheart_desc:1 "กล้าหาญจนเกินพอดี ทำลายล้างในสนามรบ ร้ายกาจในการดวล ผู้ที่สงสัยว่า [CharYouSheHe(CHARACTER)] ได้รับนามนี้มาได้อย่างไร แสดงว่ายังไม่เคยพบ [CHARACTER.GetShortUINameNoTooltipNoFormat] อย่างแน่นอน"
 nick_the_lisp_and_lame:0 "ผู้ลิ้นคับและพิการขา"
 nick_the_lisp_and_lame_desc:1 "ไม่พอใจกับการเดินที่เชื่องช้าและงุ่มง่าม [CHARACTER.GetFaith.HealthGodName] ยังเห็นควรสาปแช่ง [CHARACTER.GetShortUINameNoTooltipNoFormat] ด้วยอาการลิ้นคับอันน่าสะพรึงกลัวอีกด้วย"
 nick_the_magnificent:0 "ผู้สง่างาม"
 nick_the_magnificent_desc:1 "เรื่องราววีรกรรมอันงดงามของ[CharYourHerHis(CHARACTER)]ถูกเล่าขานตั้งแต่ไอร์แลนด์ไปจนถึงคาเธ่ย์"
 nick_the_martyr:0 "มรณสักขี"
 nick_the_martyr_desc:1 "[CHARACTER.GetShortUINameNoTooltipNoFormat|U] สิ้นชีพเพื่อ [CHARACTER.GetFaith.HighGodName] และเหล่า [CHARACTER.GetFaith.GetAdherentNamePlural] ทั่วโลกระลึกถึงการเสียสละของ[CharYourHerHis(CHARACTER)]"
 nick_the_merry:0 "ผู้ร่าเริง"
 nick_the_merry_desc:1 "[CHARACTER.GetShortUINameNoTooltipNoFormat|U] [CharAreIs(CHARACTER)] เป็นที่รู้จักในด้านอารมณ์ขันที่ดี เรื่องตลกชั้นดี และงานเลี้ยงที่ยอดเยี่ยมของ[CharYourHerHis(CHARACTER)]"
 nick_the_honorable:0 "ผู้ทรงเกียรติ"
 nick_the_honorable_desc:1 "เมื่อมีการทำข้อตกลง เมื่อ[CharYourHerHis(CHARACTER)]ให้คำมั่นสัญญา [CharYouSheHe(CHARACTER)]ก็สามารถไว้วางใจได้ว่าจะยึดมั่นในคำพูดนั้นอย่างแข็งแกร่งดุจเหล็กกล้า"
 nick_the_greedy:0 "ผู้ละโมบ"
 nick_the_greedy_desc:0 "อะไรจะดีไปกว่าถุงเงินหนึ่งถุง? ก็ถุงเงินสองถุงไงล่ะ!"
 nick_the_monk:0 "นักพรต"
 nick_the_monk_desc:1 "ท่วงท่าทางศาสนาและวิถีชีวิตที่สำรวมของ[CharYourHerHis(CHARACTER)|U] ทำให้ [CHARACTER.GetShortUINameNoTooltipNoFormat] เป็นนักพรตในอุดมคติในความคิดของหลายๆ คน"
 nick_the_noble:0 "ผู้สูงศักดิ์"
 # Technically "HerHim" would be more correct here, be "SheHe" reads nicer IMHO.
 nick_the_noble_desc:1 "แม้ว่าจะมีขุนนางมากมายในโลกนี้ แต่มีเพียงไม่กี่คนที่ดำเนินชีวิตตามอุดมคติของคำนั้นได้มากเท่า [CharYouSheHe(CHARACTER)]"
 nick_the_old:0 "ผู้ชรา"
 nick_the_old_desc:1 "ไม่ใช่เรื่องแปลกที่ผู้คนจะทักทาย [CHARACTER.GetShortUINameNoTooltipNoFormat] ด้วยความประหลาดใจที่ [CharYouSheHe(CHARACTER)] [CharAreIs(CHARACTER)] ยังมีชีวิตอยู่"
 nick_the_pious:0 "ผู้ศรัทธา"
 nick_the_pious_desc:1 "ความกระตือรือร้นและการอุทิศตนต่อ [CHARACTER.GetFaith.GetName] ของ[CHARACTER.GetShortUINamePossessiveNoTooltipNoFormat|U] ถือเป็นเครื่องหมายของความทุ่มเทอันแรงกล้าและสร้างแรงบันดาลใจ"
 nick_the_proud:0 "ผู้หยิ่งทระนง"
 nick_the_proud_desc:1 "ขุนนางส่วนใหญ่เรียนรู้วิธีที่จะรักษาหลังให้ตรงตลอดเวลา แต่มีเพียงไม่กี่คนที่ถือเป็นความภาคภูมิใจ เช่น [CHARACTER.GetShortUINameNoTooltipNoFormat]"
 nick_the_quarreller:0 "นักวิวาท"
 nick_the_quarreller_desc:1 "ถือเป็นเรื่องฉลาดที่จะไม่เริ่มบทสนทนากับ [CHARACTER.GetShortUINameNoTooltipNoFormat] เว้น แต่คุณจะมีเวลาว่างสักสองสามชั่วโมง บางครั้งก็เป็นวัน"
 nick_the_restorer:0 "ผู้ฟื้นฟู"
 nick_the_restorer_desc:1 "เมื่ออาณาจักรดูเหมือนจะสูญหายไปในความมืดมิด #EMP [CharYouSheHe(CHARACTER)]#! ก็ปรากฏตัวขึ้นเพื่อนำมันกลับคืนสู่แสงสว่าง"
 nick_the_saint:0 "นักบุญ"
 nick_the_saint_desc:1 "[CHARACTER.GetShortUINameNoTooltipNoFormat|U] [CharHaveHas(CHARACTER)] ถูกบันทึกไว้ในประวัติศาสตร์ของ [CHARACTER.GetFaith.GetName] ว่าเป็นหนึ่งในผู้นับถือที่ได้รับพรมากที่สุดตลอดกาล"
 nick_the_scholar:0 "บัณฑิต"
 nick_the_scholar_desc:1 "ปัญญาและความรู้ของ[CHARACTER.GetShortUINamePossessiveNoTooltipNoFormat|U] เป็นส่วนหนึ่งขององค์ความรู้ของสถาบันการศึกษาหลายแห่ง"
 nick_the_silent:0 "ผู้นิ่งเงียบ"
 nick_the_silent_desc:1 "ความเงียบคือทองคำ และ [CharYouSheHe(CHARACTER)] [CharHaveHas(CHARACTER)] ความเงียบนั้นอย่างมั่งคั่ง"
 nick_the_stammerer:0 "ผู้ติดอ่าง"
 nick_the_stammerer_desc:1 "แม้ว่าการใช้ถ้อยคำของ[CharYourHerHis(CHARACTER)]จะสละสลวย แต่การพูดของ[CharYourHerHis(CHARACTER)]ยังคงเป็นที่ต้องการอีกมาก"
 nick_the_stranger:0 "คนต่างถิ่น"
 nick_the_stranger_desc:1 "[CHARACTER.GetShortUINameNoTooltipNoFormat|U] มายังอาณาจักรของ[CharYourHerHis(CHARACTER)]จากแดนไกล — แม้กระทั่งตอนนี้ กิริยาท่าทางหลายอย่างของ[CharYourHerHis(CHARACTER)]ก็ยังคงแปลกและแตกต่าง"
 nick_the_strong:0 "ผู้แข็งแกร่ง"
 nick_the_strong_desc:1 "โลกภายนอกถือว่า[CharYouHerHim(CHARACTER)]สามารถบดขยี้ก้อนหินได้ ด้วยฟันของ[CharYourHerHis(CHARACTER)]"
 nick_the_troubadour:0 "นักขับลำนำ"
 nick_the_troubadour_desc:1 "[CHARACTER.GetShortUINameNoTooltipNoFormat|U] [CharAreIs(CHARACTER)] เป็นที่รู้จักในด้านเสียงร้องอันไพเราะและความโน้มเอียงไปทางดนตรีของ[CharYourHerHis(CHARACTER)] อย่างน้อยก็โดยผู้ที่ชื่นชอบ[CharYouHerHim(CHARACTER)]"
 nick_the_unready:0 "ผู้ไม่พร้อม"
 nick_the_unready_desc:1 "เป็นความขัดแย้งหรือการสนทนาที่หาได้ยาก ซึ่งไม่สามารถครอบงำ [CHARACTER.GetShortUINameNoTooltipNoFormat] ได้อย่างสมบูรณ์"
 nick_the_unready_anglo_saxon:0 "$nick_the_unready$"
 nick_the_unready_anglo_saxon_desc:1 "ชื่อของ[CharYourHerHis(CHARACTER)|U] แปลตามตัวอักษรว่า 'ที่ปรึกษาผู้สูงศักดิ์' มัน ทำให้[CharYouHerHim(CHARACTER)]ระคายเคืองไม่น้อยที่ถูกขนานนามว่า $E_thelrE_d$-Unræd หรือ 'ที่ปรึกษาผู้สูงศักดิ์-ไร้ที่ปรึกษา' สันนิษฐานว่าเป็น เพราะมีคนคิดว่าการเล่นคำนั้นตลก"
 nick_the_usurper:0 "ผู้ชิงบัลลังก์"
 nick_the_usurper_desc:1 "[CHARACTER.GetShortUINameNoTooltipNoFormat|U] โค่นล้มเจ้าเหนือหัวโดยชอบธรรมของอาณาจักรของ[CharYourHerHis(CHARACTER)] แย่งชิงสิ่งที่ควรจะเป็นของพวกเขาด้วยคมดาบ"
 nick_the_victorious:0 "ผู้มีชัย"
 nick_the_victorious_desc:1 "ชัยชนะมาสู่ [CHARACTER.GetShortUINameNoTooltipNoFormat] อย่างเป็นธรรมชาติ และโลกก็เห็นด้วย"
 nick_the_viking:0 "ไวกิ้ง"
 nick_the_viking_desc:1 "[CHARACTER.GetShortUINameNoTooltipNoFormat|U] [CharHaveHas(CHARACTER)] เชื่อเสมอว่าทรัพย์สินเป็นแนวคิดที่ยืดหยุ่นได้มากกว่าคนส่วนใหญ่"
 nick_the_young:0 "ผู้อ่อนวัย"
 nick_the_young_desc:1 "ในฐานะ [CHARACTER.GetWomanMan] หนุ่มสาว [CharYouSheHe(CHARACTER)] พบความโดดเด่นและมีชื่อเสียง ไม่ว่าเวลาจะผ่านไปกี่ปี [CharYouSheHe(CHARACTER)] [CharAreIs(CHARACTER)] แน่ใจว่าสมญานามนี้จะยังคงอยู่"
 nick_the_younger:0 "ผู้น้อง"
 nick_the_younger_desc:2 "[CHARACTER.GetShortUINameNoTooltipNoFormat|U] [CharHaveHas(CHARACTER)] โชคร้ายที่ใช้ชื่อของ[CharYourHerHis(CHARACTER)]ร่วมกับบุคคลสำคัญอีกผู้หนึ่ง และด้วยเหตุนี้จึงถูกลดขั้นให้เป็น [CHARACTER.GetFirstName] #EMP $nick_the_younger$#! ตลอดไป""
 nick_whiteshirt:0 "เสื้อขาว"
 nick_whiteshirt_desc:1 "ผู้คนมักถาม [CHARACTER.GetShortUINameNoTooltipNoFormat] ว่าทำไมพวกเขาถึงเรียก[CharYouHerHim(CHARACTER)]ว่า $nick_whiteshirt$ [CharYouSheHe(CHARACTER)|U] เพียงแค่ยิ้ม[_s(CHARACTER)]"
 nick_the_cannibal:0 "มนุษย์กินคน"
 nick_the_cannibal_desc:1 "มีเพียงไม่กี่คนที่ทนรอยยิ้มแยกเขี้ยวของ[CharYourHerHis(CHARACTER)]ได้ โดยเฉพาะอย่างยิ่งเมื่อเลือดสดๆ ไหลอาบฟันที่ได้รับการดูแลอย่างดีของ[CharYourHerHis(CHARACTER)]"
 nick_the_dragon:0 "มังกร"
 nick_the_dragon_desc:0 "$nick_the_dragoness_desc$"
 nick_the_devourer:0 "ผู้กลืนกิน"
 nick_the_devourer_desc:1 "โลกสั่นสะท้านเมื่อพิจารณาว่ากี่ชีวิตแล้วที่ตกลงไปในปากอันไร้ก้นบึ้งของ[CharYourHerHis(CHARACTER)]..."
 nick_the_bewitched:0 "ผู้ต้องมนตร์"
 nick_the_bewitched_desc:1 "ถูกทอดทิ้งโดย [CHARACTER.GetFaith.HighGodName] ถูกสาปแช่งโดย [CHARACTER.GetFaith.WitchGodName] เมื่อผู้คนพูดถึง [CHARACTER.GetShortUINameNoTooltipNoFormat] มักจะพูดด้วยความสงสาร"
 nick_the_witch:0 "แม่มด"
 nick_the_witch_desc:1 "[CHARACTER.GetShortUINameNoTooltipNoFormat|U] [CharAreIs(CHARACTER)] ถูกมองว่าเป็นผู้ค้าขายสิ่งแปลกประหลาดที่อยู่เหนือม่านแห่งโลกิยะ"
 nick_the_unfaithful:0 "ผู้ไม่ซื่อสัตย์"
 nick_the_unfaithful_desc:1 "คำสาบานในงาน แต่งงานเป็นเหมือน... แนวทางปฏิบัติในงาน แต่งงานมากกว่า ในความเห็นของ[CharYourHerHis(CHARACTER)]"
