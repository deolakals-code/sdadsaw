 nick_the_apostle:0 "อัครสาวก"
 nick_the_apostle_desc:1 "[CHARACTER.GetShortUINameNoTooltipNoFormat|U] [CharWereWas(CHARACTER)] หนึ่งในสหายส่วนตัวของพระเยซูคริสต์ ติดตามพระองค์ตลอดพระชนม์ชีพและเทศนาสั่งสอนตามแนวทางของพระองค์หลังการพลีชีพ"
 nick_the_avenger:0 "ผู้ล้างแค้น"
