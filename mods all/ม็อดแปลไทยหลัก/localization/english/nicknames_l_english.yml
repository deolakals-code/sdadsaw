 nick_the_bald:0 "ผู้ศีรษะล้าน"
 nick_the_bald_desc:1 "[CHARACTER.GetShortUINameNoTooltipNoFormat|U] [CharHaveHas(CHARACTER)] ทนทุกข์จากการขาดเส้นผมอย่างรุนแรง และดูเหมือนไม่มีใครพอใจที่จะปล่อยให้[CharYouHerHim(CHARACTER)]ลืมมันได้"
 nick_the_bald_ironic:0 "$nick_the_bald$"
 nick_the_bald_ironic_desc:1 "[CHARACTER.GetShortUINameNoTooltipNoFormat|U] ใช้ชีวิตส่วนใหญ่โดยไม่มีมงกุฎที่เหมาะสมประดับศีรษะของ[CharYourHerHis(CHARACTER)] และราชสำนักก็ปฏิเสธที่จะปล่อยให้[CharYouHerHim(CHARACTER)]ลืมมัน"
 nick_the_bastard:0 "บุตรนอกสมรส"
