 nick_the_destroyer:0 "ผู้ทำลายล้าง"
 nick_the_destroyer_desc:1 "[CHARACTER.GetShortUINameNoTooltipNoFormat|U] [CharAreIs(CHARACTER)] เป็นที่รู้จักจากการเผาที่ดิน เผาอาคาร และทิ้งแผ่นดินให้เกลื่อนกลาดไปด้วยเกลือและกระดูกของผู้ตาย"
