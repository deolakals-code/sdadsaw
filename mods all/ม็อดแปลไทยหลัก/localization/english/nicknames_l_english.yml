 nick_the_insubordinate:0 "ผู้แข็งข้อ"
 nick_the_insubordinate_desc: "[CHARACTER.GetShortUINameNoTooltipNoFormat|U] [CharAreIs(CHARACTER)] พร้อมที่จะต่อต้านและตอบโต้เสมอ เป็นคนรับใช้ที่แย่และข้าหลวงที่ไม่ซื่อสัตย์"
 nick_the_backstabber:0 "ผู้แทงข้างหลัง"
