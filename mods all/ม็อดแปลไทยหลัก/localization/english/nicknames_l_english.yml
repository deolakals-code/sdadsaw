 nick_snake_in_the_eye:0 "อสรพิษในเนตร"
 nick_snake_in_the_eye_desc:1 "นักเดินทางกระซิบกันว่า [CharYouSheHe(CHARACTER)] มี[_s(CHARACTER)] สัญลักษณ์อูโรโบรอสเป็นตำหนิในดวงตาของ[CharYourHerHis(CHARACTER)] — สัญลักษณ์นิรันดร์ของงูที่กัดกินหางตัวเอง มีเพียงไม่กี่คนที่กล้าเข้าใกล้พอที่จะตรวจสอบความจริงของคำกล่าวอ้าง เช่นนั้น"
 nick_the_affable:0 "ผู้อ่อนโยน"
