 nick_the_incompetent_desc: "[CHARACTER.GetShortUINameNoTooltipNoFormat|U] [CharWereWas(CHARACTER)] ไม่เหมาะกับอำนาจและความรับผิดชอบที่มอบให้กับ [CharYourHerHis(CHARACTER)]"
 nick_the_gambler:0 "นักพนัน"
 nick_the_gambler_desc: "การเดิมพันของ [CHARACTER.GetShortUINamePossessiveNoTooltipNoFormat|U] นั้นยิ่งใหญ่ แม้ว่าโอกาสจะน้อยนิด... และ #EMP โดยเฉพาะอย่างยิ่ง#! เมื่อเดิมพันสูง"
 nick_the_obscene:0 "ผู้ลามก"
 nick_the_obscene_desc: "[CHARACTER.GetShortUINameNoTooltipNoFormat|U] [CharAreIs(CHARACTER)] มีชื่อเสียงในด้านความหยาบคายที่ตรงไปตรงมาและปากร้าย ความไร้เดียงสาอยู่รอดได้ไม่นานในระยะที่ได้ยิน"
 nick_the_miser:0 "ผู้ตระหนี่"
 nick_the_miser_desc: "[CHARACTER.GetShortUINameNoTooltipNoFormat|U] [CharAreIs(CHARACTER)] ตระหนี่ถี่เหนียวจนเกินพอดี สร้างความขุ่นเคืองให้กับคนรับใช้และญาติพี่น้องเป็นอย่างมาก"
 nick_the_unfortunate:0 "ผู้อับโชค"
 nick_the_unfortunate_desc: "มีบางอย่างเกี่ยวกับการดำรงอยู่ของ [CHARACTER.GetShortUINamePossessiveNoTooltipNoFormat]... ที่โชคร้าย การยืนอยู่ในร่มเงาธงของ [CharYourHerHis(CHARACTER)] คือการรู้จักความไม่สบายใจ"
 nick_brown_cheeks:0 "แก้มสีน้ำตาล"
 nick_brown_cheeks_desc: "[CHARACTER.GetShortUINameNoTooltipNoFormat] พยายามเริ่มการกบฏต่อผู้นำ [CharYourHerHis(CHARACTER)]... และกลัวมาก"
 nick_the_drunkard_michael_iii:0 "ขี้เมา"
 nick_the_drunkard_michael_iii_desc: "น่าสงสารไมเคิล จักรพรรดิหนุ่ม ผู้ตกต่ำจากการดื่มสุราเกินขนาด #EMP ที่ไม่เป็นคริสเตียน#! ของเขา บทเรียนสำหรับเราทุกคนว่าชาติกำเนิดอาจบ่งบอกถึงพรสวรรค์ แต่ก็ไม่ได้รับประกัน"
 nick_the_pious_michael_iii:0 "ผู้ศรัทธา"
 nick_the_pious_michael_iii_desc: "แม้ว่าอุบัติเหตุอันน่าเศร้าจะคร่าชีวิตเขาไปตั้งแต่อายุยังน้อย แต่ไมเคิลก็ย่อมอยู่ในความโปรดปรานของสวรรค์อย่างแน่นอนสำหรับบทบาท #EMP สำคัญ#! ของเขาในการยุติการทำลายรูปเคารพ"
 nick_the_young_michael_iii:0 "ผู้อ่อนวัย"
 nick_the_young_michael_iii_desc: "ปกครองตั้งแต่วัยทารก ดูเหมือนเป็นเรื่องตลกร้ายสำหรับไมเคิลที่ครองราชย์ยาวนาน แต่กลับสิ้นพระชนม์ตั้งแต่อายุยังน้อย โดยอุบัติเหตุ"
 nick_the_exile:0 "ผู้ลี้ภัย"
 nick_the_exile_desc: "[CHARACTER.GetShortUINameNoTooltipNoFormat|U] [CharWereWas(CHARACTER)] ถูกขับไล่ออกจากบ้านเกิด [CharYourHerHis(CHARACTER)] หรือจากไปเพื่อหลบหนีภาระที่คาดไม่ถึง แสวงหาที่ลี้ภัยในต่างแดน"
 nick_lackland_young:0 "ไร้ที่ดิน"
 nick_lackland_young_desc: "น่าสงสาร [CHARACTER.GetShortUINameNoTooltipNoFormat] เกิดมาเป็นบุตรชายคนเล็กท่ามกลางพี่ชายผู้มีชื่อเสียงหลายคน [CharYouSheHe(CHARACTER)] จะถูกคาดหวังให้ปกครองอะไรมากมายได้อย่างไร?"
 nick_lackland_ironic:0 "$nick_lackland_young$"
 nick_lackland_ironic_desc: "[CHARACTER.GetShortUINameNoTooltipNoFormat|U] อาจเคยเป็นบุตรชายที่ด้อยกว่าบิดาที่ยิ่งใหญ่กว่า แต่ [CharYouSheHe(CHARACTER)] [CharHaveHas(CHARACTER)] ก็สามารถสร้างอาณาเขตที่น่านับถือได้แม้จะมีอุปสรรค — และเสียงหัวเราะเยาะที่ไม่ค่อยแนบเนียนนัก"
 nick_lackland_old:0 "$nick_lackland_young$"
