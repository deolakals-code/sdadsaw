 nick_the_black:0 "ทมิฬ"
 nick_the_black_desc:1 "ทัศนคติอันโหดร้าย การติดต่ออันไม่เป็นธรรมอย่างฉาวโฉ่ และพฤติกรรมอันน่าสาปแช่งโดยรวมต่อเพื่อนมนุษย์ของ[CharYourHerHis(CHARACTER)] ทำให้ [CHARACTER.GetShortUINameNoTooltipNoFormat] มีชื่อเสียงที่ไม่ดีนัก"
 nick_the_blessed:0 "ผู้ได้รับพร"
 nick_the_blessed_desc:1 "อุปนิสัยอันชอบธรรมและสุรเสียง/น้ำเสียงอันมั่นคงในการปกป้องศรัทธาคือทั้งหมดที่ทุกคนกล่าวถึงเมื่อพูดถึง [CHARACTER.GetShortUINameNoTooltipNoFormat]"
 nick_the_blind:0 "ผู้บอด"
