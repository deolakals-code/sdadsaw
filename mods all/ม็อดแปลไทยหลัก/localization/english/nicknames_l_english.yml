 nick_the_bully:0 "นักเลงโต"
 nick_the_bully_desc:1 "[CHARACTER.GetShortUINameNoTooltipNoFormat|U] ชอบ[_s(CHARACTER)] รังแกผู้ที่ [CharYouSheHe(CHARACTER)] พิจารณา[_s(CHARACTER)] ว่าต่ำต้อยกว่า[CharYouHerHim(CHARACTER)]"
 nick_the_foolish:0 "ผู้โง่เขลา"
 nick_the_foolish_desc:1 "[CHARACTER.GetShortUINameNoTooltipNoFormat|U] [CharAreIs(CHARACTER)] เป็นที่รู้จักจาก... แนวทางการตัดสินใจอัน #EMP เป็นเอกลักษณ์#! ของ[CharYourHerHis(CHARACTER)]"
 nick_the_gullible: "ผู้ถูกหลอกง่าย"
