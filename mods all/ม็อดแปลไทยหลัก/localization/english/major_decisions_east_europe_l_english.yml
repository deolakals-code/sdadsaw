l_english: 
 
 east_europe.0001.t:1 "ชาวสลาฟตะวันตกรวมเป็นหนึ่ง"
 east_europe.0001.desc:0 "ชนเผ่าเก่าแก่รวมเป็นหนึ่งอีกครั้ง ข้าได้นำพวกเรารวมกัน ดุจดังที่ซาโมเคยทำเมื่อหลายศตวรรษก่อน จักรวรรดิของเขาสิ้นสุดลงพร้อมกับเขา แต่ข้ามั่นใจว่า [ROOT.Char.GetPrimaryTitle.GetNameNoTierNoTooltip] จะมีอนาคตอันรุ่งเรืองรออยู่ นี่เป็นเพียงจุดเริ่มต้น!"
 east_europe.0001.a:0 "เกียรติแด่ [ROOT.Char.GetPrimaryTitle.GetNameNoTierNoTooltip]!"

 east_europe.0002.desc:0 "ดุจดังที่ซาโมรวมชนเผ่าเวนด์เมื่อหลายศตวรรษก่อน [western_slav_uniter.Custom2('MyCharacterIntroduction', ROOT.Char)] ได้รวบรวมชาวสลาฟตะวันตกไว้ภายใต้ธงผืนเดียวกัน การรวมตัวครั้งนี้จะยืนหยัดผ่านกาลเวลา หรือจะพังทลายลงดุจจักรวรรดิของซาโม? มีเพียง [ROOT.Char.GetFaith.FateGodName] เท่านั้นที่รู้"

 east_europe.0005.t:0 "ชาวสลาฟใต้รวมเป็นหนึ่ง"
 east_europe.0005.desc:0 "ข้าได้รวมชนเผ่าเก่าแก่ไว้ภายใต้ธงผืนเดียวกัน เราร่วมกันแข็งแกร่งกว่าที่เคยเป็นมา เราจะไม่ถูกพิชิต! เราจะไม่ถูกลบเลือน!"

 east_europe.0006.desc:0 "[southern_slav_uniter.Custom2('MyCharacterIntroduction', ROOT.Char)|U] ได้รวบรวมชาวสลาฟใต้ไว้ภายใต้ธงผืนเดียวกัน การรวมตัวครั้งนี้จะยืนหยัดผ่านกาลเวลา หรือความบาดหมางและประเพณีเก่าแก่จะฉีกมันออกจากกัน? มีเพียง [ROOT.Char.GetFaith.FateGodName] เท่านั้นที่รู้"

 east_europe.0010.t:0 "กำเนิดสลาเวีย"
 east_europe.0010.desc:0 "ข้าได้ทำสิ่งที่เป็นไปไม่ได้ — ในวันนี้ ชาวสลาฟทั้งหมดยืนหยัดรวมกันภายใต้ธงผืนเดียว จักรวรรดิใหม่ของข้าแผ่ขยายจากใจกลางยุโรปทางตะวันตกสู่ทุ่งทุนดราน้ำแข็งทางตะวันออก!\n\nมีวีรบุรุษเพียงไม่กี่คนในประวัติศาสตร์ที่เคยทำสำเร็จ เช่นนี้! บัดนี้ข้าคือหนึ่งในนั้น และนามของข้าจะคงอยู่ตลอดไป"
 east_europe.0010.a:0 "เกียรติแด่สลาเวีย!"

 east_europe.0011.desc:0 "[slav_uniter.Custom2('MyCharacterIntroduction', ROOT.Char)|U] ได้ทำสิ่งที่เป็นไปไม่ได้สำเร็จ – [slav_uniter.GetSheHe] ได้รวมชาวสลาฟทั้งหมดไว้ภายใต้ธงผืนเดียวกัน จักรวรรดิอันกว้างใหญ่นี้จะรุ่งเรืองต่อไป หรือความบาดหมางและประเพณีเก่าแก่จะฉีกมันออกจากกัน? มีเพียง [ROOT.Char.GetFaith.FateGodName] เท่านั้นที่รู้"

 east_europe.0015.t:0 "ผู้พิทักษ์แห่ง [defender_of_highgod.GetFaith.HighGodName]"
 east_europe.0015.desc:0 "หอวีรชนได้ถูกสร้างขึ้นใน..."
 east_europe.0015.a:0 "... [target_list_member_a.GetNameNoTierNoTooltip]."
 east_europe.0015.b:0 "... [target_list_member_b.GetNameNoTierNoTooltip]."
 east_europe.0015.c:0 "... [target_list_member_c.GetNameNoTierNoTooltip]."
 east_europe.0015.d:0 "... [target_list_member_d.GetNameNoTierNoTooltip]."
 east_europe.0015.tooltip:0 "ที่ดินได้รับการ [special_building|E] [GetBuilding('hall_of_heroes_01').GetName]"

 east_europe.0016.desc:1 "ภายใต้การนำของข้า เหล่าเผ่าได้รวมตัวกันสร้างหอสงครามอันยิ่งใหญ่ใน [holy_site.GetNameNoTierNoTooltip] ภายในกำแพงหินหนา เราเตรียมพร้อมสำหรับสงคราม...\n\nเป็นเวลาหลายชั่วอายุคน เหล่าผู้รุกรานต่างชาติได้จับจ้องมายังดินแดนของเรา ให้พวกมันมา ข้าขอกล่าว! ให้พวกมันทดสอบกำลังกับเหล่า [defender_of_highgod.GetFaith.GetAdjectiveNoTooltip] วีรบุรุษผู้กล้าหาญของเรา! ให้เลือดของพวกมันชโลมผืนดินและย้อมแม่น้ำให้เป็นสีแดง!"
 east_europe.0016.a:1 "สรรเสริญ [defender_of_highgod.GetFaith.WarGodName]!"

 east_europe.0017.desc:1 "[defender_of_highgod.Custom2('MyCharacterIntroduction', ROOT.Char)|U] ได้รวมเหล่าเผ่าในอาณาจักรของ [defender_of_highgod.GetHerHis] เพื่อป้องกันผู้รุกรานต่างชาติ หอสงครามอันยิ่งใหญ่ได้ถูกสร้างขึ้นใน [holy_site.GetNameNoTierNoTooltip] ที่ ซึ่งเหล่า [defender_of_highgod.GetFaith.GetAdjectiveNoTooltip] วีรบุรุษผู้ภาคภูมิได้รวมตัวกันแล้ว"


#HUNGARIAN DECISIONS
 east_europe.0030.t:0 "การเริ่มต้นใหม่"
 east_europe.0030.desc:0 "ด้วยการอนุญาตให้พ่อค้า เกษตรกร และช่างฝีมือผู้มีประสบการณ์จากอาณาจักรทางตะวันตกและใต้เข้ามา [scoped_ruler.GetPrimaryTitle.GetNameNoTierNoTooltip] จะกลายเป็นศูนย์กลางการค้าที่เจริญรุ่งเรืองในไม่ช้า และสลัดรากเหง้าชนเผ่าออกไปในที่สุด\n\nหวังว่าผู้ตั้งถิ่นฐานชาวคริสต์ใหม่เหล่านี้จะช่วยปราบปรามพวกนอกรีตที่ไม่พอใจกลุ่มสุดท้ายท่ามกลางไพร่ฟ้าข้าแผ่นดินของข้า และ ทำให้ [scoped_ruler.GetPrimaryTitle.GetNameNoTierNoTooltip] เป็นอาณาจักร [scoped_ruler.GetFaith.GetAdjective] ที่แท้จริง"
 east_europe.0030.a:0 "พวกท่านทุกคนยินดีต้อนรับ!"
 east_europe.0031.t:0 "ผู้ตั้งถิ่นฐานใหม่"
 east_europe.0031.desc.vassals:0 "[scoped_ruler.GetTitledFirstName] ได้ตัดสินใจต้อนรับผู้ตั้งถิ่นฐานต่างชาติจากอาณาจักร [scoped_ruler.GetFaith.GetReligion.GetAdjectiveNoTooltip] ที่อยู่ใกล้เคียง\n\n[scoped_ruler.GetSheHe|U] หวังว่าผู้มาใหม่เหล่านี้จะช่วยให้ดินแดนของเรามีประชากรเพิ่มขึ้นเร็วขึ้นและเพิ่มการค้ากับพันธมิตรของเรา"
 east_europe.0031.desc.others:1 "[scoped_ruler.GetTitledFirstName] ได้ตัดสินใจต้อนรับผู้ตั้งถิ่นฐานต่างชาติจากอาณาจักร [scoped_ruler.GetFaith.GetReligion.GetAdjectiveNoTooltip] ที่อยู่ใกล้เคียง [scoped_ruler.GetPrimaryTitle.GetNameNoTierNoTooltip]\n\n[scoped_ruler.GetSheHe|U] หวังว่าผู้มาใหม่เหล่านี้จะช่วยให้ดินแดนของ [scoped_ruler.GetHerHis] มีประชากรเพิ่มขึ้นเร็วขึ้นและเพิ่มการค้ากับพันธมิตรของ [scoped_ruler.GetHerHis]"
 east_europe.0031.a:0 "อืม ข้าไม่ไว้ใจพวกเขา!"
 east_europe.0031.b:0 "ข้าเข้าใจ..."

 east_europe.0032.t:0 "พิธีกรรมเก่าแก่"
 east_europe.0032.desc:1 "บรรพบุรุษของข้ายอมรับ [old_faith.GetNameNoTooltip] ในความพยายามที่ผิดพลาดในการลาก [scoped_ruler.GetPrimaryTitle.GetNameNoTierNoTooltip] เข้าสู่ยุคสมัยใหม่ แต่มันนำมา ซึ่งการกบฏ ความยากจน และความขัดแย้งเท่านั้น\n\nด้วยอำนาจทางโลกและทางศาสนาอันมหาศาลที่ข้ามีเหนืออาณาจักร ข้าจะแก้ไขความผิดพลาดนี้และนำเรากลับสู่ศรัทธาที่แท้จริงของ $magyar_pagan$\n\nทว่า นี่คือช่วงเวลาสำคัญ และ แม้ว่าการกลับสู่วิถีเก่าแก่เป็นสิ่งจำเป็นอย่างยิ่ง บางทีการตีความที่แน่นอนอาจเปลี่ยนแปลงได้เล็กน้อย?"
 east_europe.0032.a:1 "เรากลับสู่วิถีเก่าแก่ อันบริสุทธิ์"
 east_europe.0032.b:0 "บางที- บางทีเราอาจเก็บคำสอนใหม่ๆ ไว้บ้าง..."
 east_europe.0032.c:0 "กะโหลกเพื่อ [ROOT.Char.GetFaith.WarGodName]!"
 east_europe.0032.d:0 "ศรัทธาอันดื้อรั้นต่อประเพณีเก่าแก่ ไม่ว่าชนิดใด คือจุดอ่อน"

 east_europe.0034.t:0 "การฟื้นฟู [scoped_ruler.GetFaith.GetAdherentNameNoTooltip]"
 east_europe.0034.desc.vassals:0 "หลังจากรวบรวมกำลังอันไร้ขีดจำกัดภายในอาณาจักร,"
 east_europe.0034.desc.outsiders:0 "หลังจากรวบรวมกำลังอันไร้ขีดจำกัดภายใน [scoped_ruler.GetPrimaryTitle.GetNameNoTierNoTooltip],"
 east_europe.0034.desc.intro:0 "[scoped_ruler.GetTitledFirstName] ได้แสดงตนว่าเป็นผู้ละทิ้งศาสนา!\n\nในการแสดงการต่อต้านอย่างเปิดเผย [scoped_ruler.GetSheHe] ได้ปฏิเสธ [old_faith.HighGodName] ขับไล่ [old_faith.PriestNeuterPlural] [old_faith.GetAdherentNameNoTooltip] ระดับสูง และถอดถอน [old_faith.GetNameNoTooltip] ออกจากตำแหน่งศาสนาประจำรัฐ แม้ แต่ตอนนี้ [scoped_ruler.GetCulture.GetCollectiveNounNoTooltip] ในชนบทจำนวนมากก็แห่เข้าร่วมกับ [scoped_ruler.GetHerHim]\n\n"
 east_europe.0034.desc.conversion_vanilla:0 "แม้ว่าจะสงบนิ่งทางการเมืองมาระยะหนึ่งแล้ว $magyar_pagan$ ยังคงมีผู้ติดตามจำนวนมากในชนบท และ [scoped_ruler.GetTitledFirstNameNoTooltip] ก็แทบไม่มีปัญหาในการสถาปนาวิถีเก่าแก่ขึ้นใหม่"
 east_europe.0034.desc.conversion_syncretic:0 "อย่างไรก็ตาม ศรัทธา [scoped_ruler.GetFaith.GetAdherentNameNoTooltip] ใหม่นี้ดูเหมือนจะยังคงรักษาลักษณะเด่นหลายประการของ [old_faith.GetNameNoTooltip] ไว้ ผสมผสานวิถีเก่าแก่กับวิถีใหม่อย่างเห็นได้ชัด"
 east_europe.0034.desc.conversion_bloodthirsty:0 "ที่เลวร้ายไปกว่านั้น [scoped_ruler.GetTitledFirstNameNoTooltip] อ้างว่าเทพเจ้าผู้พิโรธจะให้อภัยความอ่อนแอของชาว [scoped_ruler.GetCulture.GetNameNoTooltip] ในการเปลี่ยนศาสนาก็ต่อเมื่อมีการสังเวยมนุษย์บ่อยครั้ง!"
 east_europe.0034.desc_conversion_adaptive:0 "ด้วยการเปลี่ยนแปลงมากมายที่ชาว [scoped_ruler.GetCulture.GetNameNoTooltip] และศรัทธาของพวกเขาได้เผชิญในช่วงสองสามศตวรรษที่ผ่านมา การฟื้นคืนของวิถีเก่าแก่นี้ดูเปิดกว้างและเน้นปฏิบัติอย่างน่าทึ่ง"
 east_europe.0034.a:0 "ในที่สุด! เกียรติแด่ [ROOT.Char.GetFaith.HighGodName]!"
 east_europe.0034.b:0 "บางทีลมอาจพัดไปทาง [scoped_ruler.GetFaith.HighGodName]..."
 east_europe.0034.c:0 "นี่มันลัทธินอกรีตอันชั่วร้ายอะไรกัน!?"
 east_europe.0034.d:0 "ไม่ใช่ธุระกงการอะไรของข้าและไม่ใช่ปัญหาของข้า"

#BOSNIAN DECISIONS
 east_europe.0101.t:0 "[founder.GetTitleAsNameNoTooltip] องค์แรกแห่งปวงบอสเนีย"
 east_europe.0101.desc:0 "บอสเนียที่เต็มไปด้วยภูเขา ถูกโยนไปมาระหว่างมหาอำนาจที่ทำสงครามในคาบสมุทรบอลข่านมานานหลายศตวรรษ ชาวสลาฟเพื่อนร่วมชาติจากทางเหนือและใต้ ขุนศึกขี่ม้าแห่งคาร์เพเทียนในขณะนั้น จักรพรรดิจากบัลแกเรียหรือคอนสแตนติโนเปิล แม้กระทั่งเจ้าชายพ่อค้าแห่งเอเดรียติก\n\nนับจากวันนี้ไป ไม่มีอีกแล้ว\n\nด้วยพิธีราชาภิเษกของข้า บอสเนียคืออาณาจักรของตนเอง และความแข็งแกร่งและเกียรติยศรออยู่!"
 east_europe.0101.a:0 "มรดกของข้าจะถูกจดจำไปอีกหลายศตวรรษ!"
 east_europe.0101.b:0 "[founder.GetFaith.HighGodName] ประทานพรแก่เรา!"
 east_europe.0101.c:0 "ตามจริงแล้ว ตราบใดที่ข้าเป็น [founder.GetTitleAsNameNoTooltip] แห่ง #EMP ที่ใดสักแห่ง#!..."
 east_europe.0102.t:0 "$east_europe.0101.t$"
 east_europe.0102.desc:0 "ผู้ส่งสารของข้านำข่าวมาจากหุบเขาแห่งเทือกเขาดินาริกแอลป์: ดูเหมือนว่า [founder.GetShortUIName] ได้รับการประกาศให้เป็น [founder.GetTitleAsNameNoTooltip] แห่ง [founder.GetPrimaryTitle.GetNameNoTierNoTooltip]\n\nด้วยหุบเขาที่ป้องกันได้และป่าทึบแห่งที่ราบสูงบอสเนียภายใต้การควบคุมของ [founder.GetHerHis] และการสนับสนุนจากคนท้องถิ่น อาณาจักรของ [founder.GetTitledFirstNamePossessiveNoTooltip] ดูเหมือนจะปลอดภัยอย่างมั่นคง\n\nสำหรับตอนนี้"
 east_europe.0102.a:0 "อย่างดีก็แค่พวกหน้าใหม่น่าสมเพช"
 east_europe.0102.b:0 "สรรเสริญ [founder.GetShortUINameNoTooltip]!"
 east_europe.0102.c:0 "เราจะได้เห็นกันว่ามันจะอยู่ได้นานแค่ไหน..."

 east_europe.0111.t.setup:0 "พวกนอกรีตท่ามกลางพวกเรา"
 east_europe.0111.tt.announce_failure:0 "ความพยายามของท่านในการกล่าวหา $bosnian_church$ ว่าเป็นพวกนอกรีตล้มเหลว!"
 east_europe.0111.tt.cancellation_cooldown:0 "$bosnian_church$ ไม่สามารถถูกกล่าวหาว่าเป็นพวกนอกรีตได้อีกเป็นเวลา [EmptyScope.ScriptValue('accuse_the_krstjani_of_heresy_cancellation_cooldown_value')|0] ปี"
 east_europe.0111.tt.regular_cooldown:0 "$bosnian_church$ ไม่สามารถถูกกล่าวหาว่าเป็นพวกนอกรีตได้อีกเป็นเวลา [EmptyScope.ScriptValue('accuse_the_krstjani_of_heresy_failure_cooldown_value')|0] ปี"
 east_europe.0111.tt.critical_cooldown:0 "$bosnian_church$ ไม่สามารถถูกกล่าวหาว่าเป็นพวกนอกรีตได้อีกเป็นเวลา [EmptyScope.ScriptValue('accuse_the_krstjani_of_heresy_critical_failure_cooldown_value')|0] ปี"
 #[EmptyScope.ScriptValue('vengeful_scheme_success_chance_modifier')|0]
 east_europe.0111.t:0 "$east_europe.0111.t.setup$: เขียนถึง [hof.GetTitledFirstNameNoTooltip]"
 east_europe.0111.desc:0 "ผู้ใดจะกล่าวได้ว่าเหล่าผู้ที่ถูกเรียกว่า [heretic.GetFaith.GetAdherentNamePluralNoTooltip] เหล่านี้ไม่เป็นที่สังเกตมานานเพียงใด? หนึ่งทศวรรษ? หนึ่งศตวรรษ? ตั้งแต่การมาเยือนของนักบุญมาร์ตินผู้ได้รับพร?\n\nไม่ว่าพวกนอกรีตนี้จะถูกปล่อยให้แพร่เชื้อร้ายในดินแดนป่าเถื่อนแห่งบอสเนียมานานเพียงใด ความผ่อนปรนของบรรพบุรุษของเราได้ก่อเกิดผลอันเลวร้าย และข้ามิอาจทนได้! ที่ได้เห็น [heretic.Custom2('InsultNoun', ROOT.Char)] เช่น [heretic.GetTitledFirstName] โอ้อวด [accuser.GetFaith.HighGodName] อย่างเปิดเผย!\n\nโลกนี้ช่างโง่เขลาที่สรุปว่าพวกเขาโดยพื้นฐานแล้วเป็น [accuser.GetFaith.GetAdherentNamePluralNoTooltip] ที่ดี เพียง แต่อยู่ในชนบท บางที ด้วยถ้อยคำที่สร้างสรรค์เพียงเล็กน้อยถึง [hof.GetTitledFirstName] เรื่องนี้อาจไม่จำเป็นต้องเป็น เช่นนี้..."
 east_europe.0111.a:0 "นำ [ROOT.Char.Custom('GetWritingInstrument')] และ [ROOT.Char.Custom('GetWritingMaterial')] มาให้ข้า!"
 east_europe.0111.a.tt:0 "จดหมายถูกเขียนขึ้น"
 east_europe.0111.b:0 "ข้ามีเรื่องที่ดีกว่าต้องทำ..."
 east_europe.0112.t:0 "[hof.Custom2('AppropriateGreeting',accuser)]"
 east_europe.0112.desc.intro:0 "การยืนกรานของท่านว่า [heretic.GetFaith.GetAdherentNamePluralNoTooltip] เป็นพวกนอกรีตนั้นน่าหัวเราะ"
 east_europe.0112.desc.culture:0 "[accuser.GetTitledFirstName] เป็นเพื่อนร่วมชาติ[accuser.GetWomanMan]ของข้า และท่านนั้นเพียง แต่ไม่รู้ขนบธรรมเนียมของพวกเรา"
 east_europe.0112.desc.rival:0 "ตามจริงแล้ว หาก #EMP ผู้ใด#! มีแนวโน้มที่จะมีความผิดฐานนอกรีต ก็คือเจ้า เจ้า [accuser.Custom2('InsultNoun', SCOPE.sC('hof'))] [accuser.Custom2('InsultAdjective', SCOPE.sC('hof'))] [accuser.Custom2('InsultAdjective', SCOPE.sC('hof'))] [accuser.Custom2('InsultAdjective', SCOPE.sC('hof'))]!"
 east_europe.0112.desc.sinful:0 "บาปของท่านมีมากมายจนแทบนับไม่ถ้วน และท่านยังกล้าวิจารณ์ผู้อื่นอีกหรือ?"
 east_europe.0112.desc.negative_opinion:0 "บางทีหากข้าเคารพความคิดเห็นของท่านสักเล็กน้อย ข้าอาจจะเชื่อถือความคิดของท่าน แต่น่าเสียดาย ข้าไม่"
 east_europe.0112.desc.fallback:0 "การกล่าวอ้างที่เหลวไหล เช่นนี้ไม่เหมาะสมกับ [accuser.GetWomanMan] ในตำแหน่งของท่าน"
 east_europe.0112.desc.outro:0 "\n\nข้าหวังว่านี่จะเป็นจุดสิ้นสุดของเรื่องนี้ และครั้งต่อไป ท่านจะคิดก่อนเขียน"
 east_europe.0112.a:0 "ช่างเป็นคนโง่เขลาเบาปัญญาเสียนี่กระไร!"
 east_europe.0113.t:0 "[hof.Custom2('AppropriateGreeting',accuser)]"
 east_europe.0113.desc:0 "คำพูดของท่าน ทำให้ข้ากังวลใจอย่างยิ่ง คิดไม่ถึงว่าความเสื่อมทรามอันลึกซึ้ง เช่นนี้อาจซ่อนอยู่ใกล้ใจกลางคริสต์ศาสนจักร!\n\nข้าจะปรึกษากับ [heretic.GetTitledFirstNameNoTooltip] และตัดสินความจริงของเรื่องนี้"
 east_europe.0113.a:0 "กงล้อแห่งความยุติธรรมอันศักดิ์สิทธิ์หมุนแล้ว!"
 east_europe.0113.a.tt:0 "[hof.GetTitledFirstNameNoTooltip] เขียนถึง [heretic.GetTitledFirstNameNoTooltip]..."
 east_europe.0114.t:0 "$east_europe.0111.t.setup$: การไต่สวนของ [hof.GetFaith.GetAdjectiveNoTooltip]"
 east_europe.0114.desc:0 "จดหมายจาก [hof.GetTitledFirstName] อยู่ในมือที่สั่นเทาของท่าน แม้ว่าการสั่นนั้นจะมาจากความกลัวหรือความโกรธ ท่านก็บอกไม่ได้แน่ชัด: ผ่านกลอุบายของ [accuser.GetName] ผู้คดเคี้ยว [hof.GetTitledFirstNameNoTooltip] ขู่ว่าจะประกาศให้ [heretic.GetFaith.GetAdherentNamePluralNoTooltip] ทั้งหมดเป็นพวกนอกรีต!\n\nการกระทำอันน่าสะพรึงกลัวนี้จะนำเพื่อนชาวคริสต์ของท่านมาโจมตีท่านในสงครามศักดิ์สิทธิ์อย่างแน่นอน เว้น แต่ท่านจะสามารถโน้มน้าว [hof.GetTitledFirstNameNoTooltip] เป็นอย่างอื่นได้\n\nต้องร่างคำตอบ"
 east_europe.0114.a:0 "บางทีอาจเป็นบทความทางเทววิทยาที่ชาญฉลาด?"
 east_europe.0114.a.tt_success:0 "[hof.GetTitledFirstNameNoTooltip] เชื่อแล้ว"
 east_europe.0114.a.tt_success.tt:0 "ข้อกล่าวหาเรื่องนอกรีตถูกปัดเป่าไป!"
 east_europe.0114.a.tt_failure:0 "ข้อโต้แย้งของท่านไร้ผล"
 east_europe.0114.a.tt_failure.tt:0 "ข้อกล่าวหาเรื่องนอกรีตดูเหมือนจะเป็นจริง..."
 east_europe.0114.b:0 "ข้าคิดว่าบันทึกเตือนความจำเล็กๆ น้อยๆ ก็พอ..."
 east_europe.0114.b.tt:0 "[hof.GetTitledFirstName] จะถูกบังคับให้เข้าข้างท่าน!"
 east_europe.0114.c:0 "หาก [hof.GetSheHe] เพียง แต่ถูก ทำให้มองเรื่องนี้ในทางการเมือง..."
 east_europe.0114.c.tt_success:0 "เรื่องราวเปลี่ยนไปสู่การมองโลกในแง่ร้ายทางการเมือง"
 east_europe.0114.c.tt_failure:0 "ข้อโต้แย้งยังคงเป็นเรื่องทางเทววิทยา"
 east_europe.0114.d:0 "เราไม่สามารถต่อต้านศาสนจักรที่กว้างกว่าได้: ข้า #EMP ต้อง#! เปลี่ยนศาสนา"
 east_europe.0114.d.tt:0 "ท่านจะต้องตัดสินใจว่าจะเปลี่ยนศาสนาอย่างจริงใจ หรืออย่างเสแสร้ง"
 east_europe.0114.e:0 "ศรัทธาของเราถูกต้องเท่าเทียมกับของพวกเขา! จดหมายท้าทาย!"
 east_europe.0114.e.tt:0 "[hof.GetTitledFirstName] จะประกาศให้ $bosnian_church$ เป็นพวกนอกรีตอย่างแน่นอน!"
 east_europe.0115.t:0 "$east_europe.0116.t$"
 east_europe.0115.desc.intro:0 "ให้ตายสิ ให้ดวงตาเน่าๆ ของ [heretic.GetHerHis] พินาศไป [heretic.GetTitledFirstName] เปลี่ยนศาสนาแล้ว!\n\n"
 east_europe.0115.desc.political:0 "แม้ว่า [hof.GetTitledFirstName] ดูเหมือนจะเชื่อสนิทใจ แต่สำหรับข้าแล้วเห็นได้ชัดว่าการเคลื่อนไหวนี้เป็นท่าทีทางการเมืองครึ่งๆ กลางๆ: [heretic.GetFirstNameNoTooltip] #EMP เพียงผู้เดียว#! ยืนยันความภักดีของ [heretic.GetHerHis] ต่อ [hof.GetFaith.GetNameNoTooltip] ไม่มีข้าหลวงหรือสมาชิกครอบครัวคนใดอยู่เคียงข้าง [heretic.GetHerHim]"
 east_europe.0115.desc.wholehearted:0 "การกระทำนั้นดูเหมือนจะมาจากใจจริง และ [heretic.GetSheHe] ได้นำพาครอบครัวใกล้ชิดของ[heretic.GetHerHis]และขุนนางคนสำคัญหลายคนมาสู่หลักความเชื่อแบบ[hof.GetFaith.GetAdjective]พร้อมกับ[heretic.GetHerHim] มันเกือบจะ ทำให้เรื่องนี้น่าโมโหยิ่งขึ้นไปอีก"
 east_europe.0115.desc.outro:0 "\n\nสำหรับตอนนี้ ปัญหาได้คลี่คลายแล้ว ไม่ว่าจะเป็นพวกนอกรีตหรือไม่ [hof.GetTitledFirstNameNoTooltip] ก็เชื่อว่า $bosnian_church$ อยู่ภายใต้การควบคุมของ [hof.GetHerHis] อย่างเพียงพอ"
 east_europe.0115.a:0 "เฮ้อ ข้ายอมแพ้!"
 east_europe.0115.b:0 "เคยเป็นพวกนอกรีต #EMP ก็ยังคง#! เป็นพวกนอกรีต!"
 east_europe.0115.b.toast:0 "[accuser.GetShortUIName] โกรธเคืองกับการหลบเลี่ยงของท่าน"
 east_europe.0116.t:0 "$east_europe.0111.t.setup$: การเปลี่ยนใจ"
 east_europe.0116.desc:0 "[hof.GetTitledFirstName] ต้องการการสำนึกผิดอย่างเต็มที่: การเปลี่ยนศาสนา ยอมรับ [hof.GetFaith.GetNameNoTooltip] อย่างสมบูรณ์\n\nอย่างไรก็ตาม ข้ารู้ว่าเพื่อนร่วม [heretic.GetFaith.GetAdherentNamePluralNoTooltip] ของข้าแข็งแกร่ง บางที หากเพียง #EMP ข้า#! เปลี่ยนศาสนา นั่นก็อาจจะเพียงพอ\n\nในทางกลับกัน นั่นจะเป็นเพียงการประวิงเวลา บางทีอาจเป็นการดีที่สุดหากเรายอมรับการเปลี่ยนแปลงนี้ตอนนี้ ในขณะที่เราสามารถทำได้อย่างสันติ?"
 east_europe.0116.a:0 "ไม่ การเปลี่ยนศาสนาส่วนตัวก็เพียงพอแล้ว"
 east_europe.0116.b:0 "พอแล้ว เราทุกคนจะเป็น [hof.GetFaith.GetAdherentNamePluralNoTooltip] ผู้ศรัทธา!"
 east_europe.0117.t:0 "$east_europe.0111.t.setup$: การผ่อนผันชั่วคราว"
 east_europe.0117.desc.intro:0 "น่าเศร้าที่ [hof.GetTitledFirstName] ได้เลือกที่จะ #EMP ไม่#! ประณาม $bosnian_church$ ว่าเป็นพวกนอกรีต\n\n"
 east_europe.0117.desc.critical_success:0 "ที่เลวร้ายไปกว่านั้น ไม่ทางใดก็ทางหนึ่ง [heretic.GetTitledFirstName] ได้โน้มน้าวให้ [hof.GetFaith.ReligiousHeadName] ขับไล่ข้าออกจากศาสนา! เวทมนตร์ชั่วร้ายหรือความลับดำมืดใดที่นำไปสู่สิ่งนี้ ไม่มีใครรู้ได้นอกจาก [heretic.GetFirstNameNoTooltip] แต่ตอนนี้เจ้าครองนครชาวคริสต์ทุกคนมองข้าด้วยความรังเกียจที่มักสงวนไว้สำหรับพวกนอกศาสนาและพวกแตกแยก"
 east_europe.0117.desc.theological_debate:0 "การโต้วาทีทางวิชาการอย่างเข้มข้นหลายสัปดาห์ระหว่าง [hof.GetHerHim] และ [heretic.GetTitledFirstName] ได้เห็น [hof.GetFaith.ReligiousHeadName] ค่อยๆ คล้อยตามแนวคิดของ [heretic.GetFirstNamePossessiveNoTooltip] โดยยอมรับว่า [heretic.GetFaith.GetAdherentNamePluralNoTooltip] เป็นเพียง [hof.GetFaith.GetAdherentNamePluralNoTooltip] ที่ค่อนข้างล้าหลัง"
 east_europe.0117.desc.political_leverage:0 "สถานการณ์รอบๆ เรื่องนี้น่าสงสัยอย่างยิ่ง เนื่องจากผลการตรวจสอบของผู้ไต่สวนที่ส่งไปยัง [heretic.GetPrimaryTitle.GetNameNoTierNoTooltip] เป็นที่ทราบกันดีและน่าตำหนิอย่างยิ่ง ดูเหมือนว่าปัจจัย #EMP อื่น#! ได้โน้มน้าวจิตใจของ [hof.GetFaith.ReligiousHeadName]"
 east_europe.0117.desc.political_manoeuvrings:0 "การเขียนจดหมายอย่างเข้มข้นหลายสัปดาห์ การปลอมแปลงคำให้การ และการติดสินบนผู้ไต่สวนที่ส่งไปสอบสวน [heretic.GetPrimaryTitle.GetNameNoTierNoTooltip] ได้ ทำให้ [hof.GetFaith.ReligiousHeadName] เชื่อว่าข้อกล่าวหาของข้ามีแรงจูงใจจากผลประโยชน์ทางการเมืองเพียงอย่างเดียว และข้อกล่าวหาของข้าก็เหลวไหลอย่างสิ้นเชิง"
 east_europe.0117.desc.outro:0 "\n\nในขณะนี้ พวกนอกรีตได้ซื้อเวลาหายใจให้ตัวเอง [hof.GetFaith.ReligiousHeadName] ในอนาคตอาจไม่มองพวกเขาด้วยความเมตตา เช่นนี้..."
 east_europe.0117.a:0 "เฮ้อ เสียเวลาและแรงงานเปล่า"
 east_europe.0117.b:0 "นี่มันน่าเดือดดาลยิ่งนัก!"
 east_europe.0117.c:0 "[accuser.GetFaith.HighGodName] อาจให้อภัย แต่ข้าไม่!"
 east_europe.0117.c.toast:0 "$east_europe.0115.b.toast$"
 east_europe.0117.d:0 "ปฏิเสธศีลมหาสนิท #EMP แก่ข้า#! หรือ? งั้นข้าจะตั้งศาสนจักร #EMP บัดซบ#! ของข้าเอง!"
 east_europe.0118.t:0 "$east_europe.0111.t.setup$: มีเวลาหายใจ"
 east_europe.0118.desc.intro:0 "ใช้เวลาหลายสัปดาห์ในการเจรจาและจดหมายที่ร่างอย่างระมัดระวัง แต่ในที่สุด [hof.GetTitledFirstName] ก็คล้อยตามมุมมองของข้า\n\n"
 east_europe.0118.desc.critical_success:0 "อันที่จริง ด้วยการใช้อำนาจต่อรองที่ข้ามีมากเกินควรเหนือ [hof.GetFaith.ReligiousHeadTitleName] ข้ายังประสบความสำเร็จในการพลิกสถานการณ์เล่นงาน [accuser.GetTitledFirstName] ผู้ [accuser.Custom2('InsultAdjective', ROOT.Char)]\n\nสำหรับการกล่าวหาคริสเตียนผู้ศรัทธาอย่างจอมปลอมของ [accuser.GetHerHis] [hof.GetTitledFirstNameNoTooltip] ได้ตกลงที่จะขับไล่ [accuser.GetHerHim] ออกจากศาสนา!"
 east_europe.0118.desc.theological_debate:0 "แม้ว่า [hof.GetFaith.ReligiousHeadTitleName] ยังคงคิดว่าเราเป็นพวกป่าเถื่อนล้าหลัง พวกเขายอมรับว่า แม้จะเข้าใจผิด แต่เราก็ไม่ใช่พวกนอกรีต"
 east_europe.0118.desc.political_leverage:0 "ความยากลำบากทั้งหมด ทำให้ข้าสูญเสียอำนาจต่อรองที่มีเหนือ [hof.GetFaith.ReligiousHeadTitleName] ไป แต่ [hof.GetTitledFirstNameNoTooltip] ก็ยอมรับอย่างไม่เต็มใจว่าเราไม่ใช่พวกนอกรีต และเป็นเพียงผู้ไม่รู้หนังสือเท่านั้น"
 east_europe.0118.desc.political_manoeuvrings:0 "กระบวนการนี้ต้องใช้การกล่าวหาตอบโต้ไม่น้อย การปลอมแปลงจดหมายจาก [accuser.GetTitledFirstName] และการติดสินบนอย่างรอบคอบแก่ผู้ไต่สวนที่มาเยือน แต่ [hof.GetFaith.ReligiousHeadTitleName] ได้ประกาศอย่างเป็นทางการว่าเราบริสุทธิ์และเรื่องทั้งหมดเป็นเรื่องภายในท้องถิ่น"
 east_europe.0118.desc.outro:0 "\n\n[heretic.GetFaith.GetAdherentNamePluralNoTooltip] ผู้ศรัทธาทุกหนแห่งสามารถถอนหายใจอย่างโล่งอกได้"
 east_europe.0118.a:0 "[heretic.GetFaith.FateGodName] ยิ้มให้เรา!"
 east_europe.0118.b:0 "ข้าเพียงดีใจที่ปัญหานี้คลี่คลายลงอย่างแน่นอน"
 east_europe.0119.t:0 "$east_europe.0111.t.setup$: ความอดทนถูกถอดถอน"
 east_europe.0119.desc.intro:0 "ตามคาด ทันทีที่ [hof.GetSheHe] เริ่มตรวจสอบเรื่องนี้อย่างจริงจัง [hof.GetTitledFirstName] ก็ค้นพบหลักฐาน #EMP มากมาย#! เกี่ยวกับการนอกรีตในหมู่ [heretic.GetFaith.GetAdherentNamePluralNoTooltip]\n\n"
 east_europe.0119.desc.theological_debate:0 "[heretic.GetTitledFirstName] พยายามหาทางเอาตัวรอดอย่างเป็นธรรมชาติ แต่ [hof.GetFaith.ReligiousHeadName] ปัดเป่าข้อโต้แย้งทางเทววิทยาอันเล็กน้อยของ [heretic.GetHerHis] ด้วยความเย้ยหยัน"
 east_europe.0119.desc.political_manoeuvrings:0 "[heretic.GetTitledFirstName] พยายามป้ายสีจดหมายของข้าว่าเป็นเรื่องผลประโยชน์ส่วนตัว แต่ท่าทีทางการเมืองที่หยาบคายนี้ไม่ได้รับความเห็นใจจาก [hof.GetFaith.ReligiousHeadName] ผู้ ซึ่งประณามว่าเป็นการหลีกเลี่ยงประเด็น"
 east_europe.0119.desc.unrepentant_heretics:0 "เมื่อถูกเผชิญหน้า [heretic.GetTitledFirstName] ไม่พยายามซ่อนความเย้ยหยันต่อ [hof.GetFaith.ReligiousHeadTitleName] โดยเยาะเย้ย [hof.GetFaith.ReligiousHeadName] อย่างเปิดเผยพร้อมกับประท้วงความถูกต้องของศรัทธาอันเสื่อมทรามของ [heretic.GetHerHis]!"
 east_europe.0119.desc.outro:0 "\n\nจดหมายทางการได้ถูกส่งไปยังชาวคริสต์ผู้ชอบธรรมทุกคนในบริเวณใกล้เคียง ประณาม [heretic.GetFirstNameNoTooltip] และศรัทธาอันดูหมิ่นศาสนาของ [heretic.GetHerHis]"
 east_europe.0119.a:0 "การพิสูจน์ความถูกต้อง!"
 east_europe.0120.t:0 "[hof.Custom2('AppropriateGreeting',heretic)]"
 east_europe.0120.desc.intro:0 "ข้าเสียใจที่ต้องแจ้งให้ท่านทราบว่าข้าพบว่าศรัทธาของท่านเบี่ยงเบนอย่างสุดขั้ว และไม่ใช่เพียงแค่ล้าหลังและแก้ไขได้ดังที่ข้าหวังไว้\n\n"
 east_europe.0120.desc.theological_debate:0 "ข้อแก้ตัวที่ร่างอย่างไม่ดีของท่านไร้ความหมาย ข้อโต้แย้งทางเทววิทยาที่ไม่มีมูลเหล่านี้เพียง #EMP พิสูจน์#! ความผิดของท่าน และข้าไม่สามารถทนต่อความคิดนอกรีต เช่นนี้ได้"
 east_europe.0120.desc.political_manoeuvrings:0 "ความพยายามของท่านที่จะประณามสิ่งนี้ว่าเป็นเพียงการเคลื่อนไหวทางการเมืองที่เห็นแก่ตัวนั้นเห็นได้ชัดว่าเป็นคำโกหกที่สิ้นหวังของผู้นำลัทธินอกรีตที่เสื่อมทราม และข้าจะไม่ยอมทนต่อการตั้งคำถามถึงแรงจูงใจของ [hof.GetFaith.GetAdherentNamePluralNoTooltip] ที่ดี"
 east_europe.0120.desc.unrepentant_heretics:0 "การที่ท่านยอมรับความผิดอย่างเปิดเผย เช่นนี้ ทำให้ข้าสับสนและเสียใจ เพราะมันแสดงให้เห็นว่าไม่มีโอกาสไถ่บาปสำหรับท่าน ข้าสวดภาวนาเพื่อวิญญาณอันมืดมนของไพร่ฟ้าที่หลงผิดของท่าน แต่จำเป็นต้องทำ"
 east_europe.0120.desc.outro:0 "\n\nนับจากวันนี้เป็นต้นไป [heretic.GetFaith.GetAdherentNamePluralNoTooltip] จะถูกมองว่าเป็นพวกนอกรีตโดยชาวคริสต์ผู้ชอบธรรมทุกคน ขอให้ความโสโครกของท่านเน่าเปื่อยในนรก!"
 east_europe.0120.a:0 "นี่คือหายนะ!"
 east_europe.0120.a.tt:0 "[hof.GetFaith.GetAdherentNameNoTooltip] ผู้หิวโหยหันมายังดินแดนของท่าน..."
 east_europe.0121.t:0 "$east_europe.0119.t$"
 east_europe.0121.desc.intro:0 "สัปดาห์ที่ผ่านมาได้เห็นสงครามคำพูดสามทางอันดุเดือดระหว่าง [accuser.GetFullName], [heretic.GetFullName], และ [hof.GetTitledFirstName] เกี่ยวกับสถานะทางศาสนจักรของ $bosnian_church$\n\n"
 east_europe.0121.desc.theological_debate:0 "การสนทนาส่วนใหญ่เป็นเรื่องทางเทววิทยา โดย [heretic.GetFirstNameNoTooltip] พยายามสร้างความมั่นใจให้ [hof.GetTitledFirstNameNoTooltip] ว่า [heretic.GetFaith.GetAdherentNamePluralNoTooltip] เป็น [hof.GetFaith.GetAdherentNamePluralNoTooltip] ที่ดี เพียง แต่มีลักษณะท่าทางแบบชนบท\n\nน่าเสียดายสำหรับ [heretic.GetHerHim] สิ่งนี้ไม่ได้ผล"
 east_europe.0121.desc.political_manoeuvrings:0 "แม้ว่า [heretic.GetFirstNameNoTooltip] จะพยายามอย่างเต็มที่เพื่อป้ายสีข้อกล่าวหาของ [accuser.GetFirstNamePossessiveNoTooltip] ว่าเป็นกลอุบายทางการเมืองล้วนๆ [hof.GetFaith.ReligiousHeadName] ก็ได้เข้าข้างต่อต้าน [heretic.GetHerHim]\n\n"
 east_europe.0121.desc.unrepentant_heretics:0 "ท้ายที่สุด ดูเหมือนว่าจุดยืนของ [heretic.GetFirstNamePossessiveNoTooltip] จะถึงวาระตั้งแต่เริ่มต้น เนื่องจาก [heretic.GetSheHe] เลือกที่จะยอมรับข้อกล่าวหาเรื่องความเชื่อนอกรีต ในขณะที่พยายามวาดภาพศรัทธาของ [heretic.GetHerHis] ว่าถูกต้อง เช่นกัน\n\n"
 east_europe.0121.desc.outro:0 "ตามคำสั่งของ [hof.GetTitledFirstNameNoTooltip] [heretic.GetFaith.GetAdherentNamePluralNoTooltip] จะถูกพิจารณาว่าเป็นพวกนอกรีตต่อชาวคริสต์ในศาสนจักรทุกคนนับจากวันนี้เป็นต้นไป!"
 east_europe.0121.a:0 "พวกนอกรีต? ท่ามกลางพวกเรา?!"
 east_europe.0121.b:0 "ข้าไม่สนใจจริงๆ"
 east_europe.0121.c:0 "เราเพียงแค่อยากอยู่อย่างสงบ!"
 east_europe.0123.t:0 "$east_europe.0124.t$"
 east_europe.0123.desc.intro:0 "$east_europe.0124.desc.intro$"
 east_europe.0123.desc.hof_died:0 "ด้วยการตายของ [hof.GetTitledFirstName] แรงผลักดันทางศาสนจักรที่อยู่เบื้องหลังการไต่สวน [heretic.GetPrimaryTitle.GetNameNoTierNoTooltip] ได้หายไป"
 east_europe.0123.desc.heretic_died:0 "ด้วยการตายของ [heretic.GetTitledFirstName] [hof.GetTitledFirstName] ดูเหมือนจะพอใจที่คิดว่าการนอกรีตที่สำคัญใดๆ ก็ตายไปด้วย และการไต่สวน [heretic.GetPrimaryTitle.GetNameNoTierNoTooltip] ได้ถูกเรียกคืน"
 east_europe.0123.desc.hof_no_longer_hof:0 "$east_europe.0124.desc.hof_no_longer_hof$"
 east_europe.0123.desc.heretic_not_independent_ruler:0 "เนื่องจาก [heretic.GetTitledFirstName] ไม่ใช่มหาอำนาจคริสเตียนอิสระอีกต่อไป [hof.GetTitledFirstName] จึงไม่เห็นว่า [heretic.GetHerHim] ควรค่าแก่การสืบสวนในฐานะบ่อเกิดแห่งการนอกรีตอีกต่อไป"
 east_europe.0123.desc.heretic_now_ecumenical_christian:0 "ด้วยการเปลี่ยนศาสนาของ [heretic.GetTitledFirstNamePossessive] เป็น [heretic.GetFaith.GetName] [hof.GetTitledFirstName] ได้เชื่อมั่นในความศรัทธาอย่างจริงใจของ [heretic.GetHerHis] ต่อ [hof.GetFaith.HighGodName]"
 east_europe.0123.desc.heretic_now_different_heresy:0 "ด้วยการเปลี่ยนศาสนาของ [heretic.GetTitledFirstNamePossessive] เป็น [heretic.GetFaith.GetName] คำถามเรื่องการนอกรีตได้เปลี่ยนจาก "ถ้า" เป็น "อันไหน": ผู้ไต่สวนของ [hof.GetFaith.ReligiousHeadName] ไม่สามารถตรวจสอบความเชื่อนอกรีตในอาณาจักรที่ปกครองโดยพวกนอกรีตอย่างเปิดเผยได้"
 east_europe.0123.desc.heretic_now_infidel:0 "ด้วยการเปลี่ยนศาสนาของ [heretic.GetTitledFirstNamePossessive] เป็น [heretic.GetFaith.GetName] [heretic.GetSheHe] ได้เปลี่ยนจากผู้ที่อาจเป็นพวกนอกรีตไปเป็นผู้ที่ไม่เชื่อในศาสนาอย่างแน่นอน ไม่จำเป็นต้องกล่าวว่า ผู้ไต่สวนของ [hof.GetFaith.ReligiousHeadName] ได้ถูกโยนออกจาก [heretic.GetPrimaryTitle.GetNameNoTierNoTooltip] อย่างไม่สมเกียรติ"
 east_europe.0123.desc.heretic_now_heathen:0 "ด้วยการเปลี่ยนศาสนาของ [heretic.GetTitledFirstNamePossessive] เป็น [heretic.GetFaith.GetName] [heretic.GetSheHe] ได้เปลี่ยนจากผู้ที่อาจเป็นพวกนอกรีตไปเป็นพวกนอกศาสนาอย่างเปิดเผย ผลจากการตบหน้า [hof.GetFaith.HighGodNamePossessive] อย่างโจ่งแจ้งนี้ สถานะทางศาสนจักรของ $bosnian_church$ ดูเหมือนจะไม่สำคัญนัก"
 east_europe.0123.desc.fallback:0 "$east_europe.0124.desc.fallback$"
 east_europe.0123.desc.outro:0 "$east_europe.0124.desc.outro$"
 east_europe.0123.a:0 "มันไม่ควรจะจบลงแบบนี้!"
 east_europe.0124.t:0 "$east_europe.0111.t.setup$: คดีอ่อนลง"
 east_europe.0124.desc.intro:0 "ดูเหมือนว่าโชคจะเข้าข้าง $bosnian_church_adherent_plural$\n\n"
 east_europe.0124.desc.hof_died:0 "หลังจากการตายของ [hof.GetTitledFirstName] การไต่สวน [heretic.GetPrimaryTitle.GetNameNoTierNoTooltip] ได้ล่มสลายลง โดยมีบุคคลสำคัญทางศาสนจักรหลายคนถูกเรียกตัวกลับไปจัดการเรื่องการสืบทอดตำแหน่งทางศาสนจักร"
 east_europe.0124.desc.heretic_died:0 "หลังจากการตายของ [heretic.GetTitledFirstName] [hof.GetTitledFirstName] ดูเหมือนจะพอใจที่ความเบี่ยงเบนที่สำคัญใดๆ ในหมู่ $bosnian_church_adherent_plural$ จะจางหายไปในไม่ช้า เนื่องจากผู้ต้องสงสัยว่าเป็นผู้นำลัทธินอกรีตได้ไปสู่ [hof.GetFaith.NegativeAfterLife|U] อย่างแน่นอนแล้ว"
 east_europe.0124.desc.hof_no_longer_hof:0 "ด้วยการขับไล่ [absolute_faith.ReligiousHeadName] คนก่อน [hof.GetFirstName] ความโกลาหลได้ครอบคลุมการไต่สวน [heretic.GetPrimaryTitle.GetNameNoTierNoTooltip] และโอกาสที่จะได้คำตัดสินที่เป็นประโยชน์ใดๆ ก็หายไป"
 east_europe.0124.desc.heretic_not_independent_ruler:1 "บัดนี้เมื่อ [Select_CString(heretic.IsLocalPlayer,'ข้า',heretic.GetShortUIName)][Select_CString(heretic.IsLocalPlayer,'','')] มิได้เป็นผู้ปกครองคริสเตียนอิสระอีกต่อไป [hof.GetTitledFirstName] จึงไม่เห็นว่า [Select_CString(heretic.IsLocalPlayer,'ข้า','พวกเขา')] ควรค่าแก่การสืบสวนอีกต่อไป"
 east_europe.0124.desc.heretic_now_ecumenical_christian:0 "ด้วยการเปลี่ยนศาสนาล่าสุดของข้าเป็น [heretic.GetFaith.GetName] [hof.GetTitledFirstName] ไม่มีเหตุผลใดที่จะสงสัยในศรัทธาของข้าต่อ [hof.GetFaith.HighGodName] อีกต่อไป"
 east_europe.0124.desc.heretic_now_different_heresy:0 "ด้วยการเปลี่ยนศาสนาล่าสุดของข้าเป็น [heretic.GetFaith.GetName] [hof.GetTitledFirstName] #EMP ก็#! ถือว่าข้าเป็นพวกนอกรีตอยู่แล้ว และกำลังยุ่งอยู่กับการประณามความไร้ศรัทธาของข้าเกินกว่าจะสนับสนุนการไต่สวนของ [hof.GetHerHis] เองอย่างจริงจังเพื่อสืบสวนการนอกรีตที่อาจเกิดขึ้นในระดับที่น้อยกว่า"
 east_europe.0124.desc.heretic_now_infidel:0 "ด้วยการเปลี่ยนมานับถือ [heretic.GetFaith.GetName] ของข้าเมื่อเร็วๆ นี้ [hof.GetTitledFirstName] ได้ประกาศว่าข้าเป็น [hof.Custom('GetDerogatoryNonbeliever')] และผู้ทรยศต่อหน้า [hof.GetFaith.HighGodName] อาชญากรรมที่อาจเกิดขึ้นของ $bosnian_church_adherent_plural$ คงดูเล็กน้อยไปเลยเมื่อเทียบกัน"
 east_europe.0124.desc.heretic_now_heathen:0 "ด้วยการเปลี่ยนมานับถือ [heretic.GetFaith.GetName] ของข้าเมื่อเร็วๆ นี้ [hof.GetTitledFirstName] ได้ประกาศว่าข้าเป็น [hof.Custom('GetDerogatoryNonbeliever')] ไร้วิญญาณและผู้ละทิ้งศรัทธาที่เลวทรามที่สุด หากข้ายังใส่ใจเทพเจ้าที่ตายแล้วของ [hof.GetHerHis] แม้ แต่น้อย ข้าก็คงจะรู้สึกเจ็บปวดอยู่บ้าง"
 east_europe.0124.desc.fallback:0 "สถานการณ์ที่เปลี่ยนแปลงไปเกินกว่าการควบคุมของเราได้ขัดขวางโอกาสสำเร็จใดๆ สำหรับการไต่สวน [heretic.GetPrimaryTitle.GetNameNoTierNoTooltip]"
 east_europe.0124.desc.outro:0 "\n\nสำหรับตอนนี้ [absolute_faith.ReligiousHeadTitleName] ได้ยกเลิกคดี โดยยืนยันว่ามีเรื่องเร่งด่วนกว่าที่ต้องจัดการ"
 east_europe.0124.a:0 "อืม อย่างน้อยเรื่องก็จบลงแล้ว"

 east_europe.0141.t:0 "เฮือกสุดท้ายของการอพยพครั้งใหญ่"
 east_europe.0141.desc:0 "ชีวิตบนทุ่งหญ้าสเตปป์อาจโหดร้ายในยามที่ดีที่สุด แต่เมื่อเร็วๆ นี้ มันกลับโหดร้ายยิ่งกว่าเดิม โดยมีชนเผ่าเร่ร่อนที่อิจฉาอื่นๆ มากมายพยายามข่มเหงเรา เพราะความสำเร็จของเรา พวกเปเชเนก พวกคาซาร์ และอื่นๆ เดินทางมาจากแดนไกลเพื่อก่อกวนสมาพันธ์ของเรา\n\nในศตวรรษที่ผ่านมา ผู้คนทั้งหลายได้ละทิ้งชีวิตนี้เพื่อทุ่งนาที่อุดมสมบูรณ์และอาณาจักรที่อ่อนแอของยุโรป\n\nวันนี้ ข้าได้ตัดสินใจที่จะเลียนแบบความสำเร็จของชนเผ่าเร่ร่อนในอดีตเหล่านี้ และสร้างบ้านใหม่สำหรับ $mogyer_collective_noun$ ในแพนโนเนียอันห่างไกล โดยถอนรากถอนโคนอาณาจักรทั้งหมดของข้าในกระบวนการนี้\n\nในไม่ช้า เราจะข้ามเทือกเขาคาร์เพเทียนเป็นหนึ่งเดียว และเปิดบทใหม่สำหรับประชาชนของเรา"
 east_europe.0141.a:0 "สู่แพนโนเนีย!"
 east_europe.0141.a.tt:0 "ท่านอาจใช้ [hungarian_invasion_casus_belli|E] พิเศษแบบใช้ครั้งเดียวกับผู้ปกครองคนใดคนหนึ่งภายในแพนโนเนีย"
 east_europe.0142.t:0 "$east_europe.0141.t$"
 east_europe.0142.desc:0 "ในการเคลื่อนไหวที่ไม่คาดคิด ข้าหลวงของข้า [mogyer_invader.GetShortUIName] ได้ส่งทูตมาแจ้งให้ข้าทราบว่า [mogyer_invader.GetSheHe] ตั้งใจที่จะนำผู้คนของ [mogyer_invader.GetHerHis] ออกจากอาณาจักรปัจจุบันของ [mogyer_invader.GetHerHis] และย้ายไปยังแพนโนเนียทั้งหมด\n\nหากสำเร็จ การควบคุมของข้าในพื้นที่มีแนวโน้มที่จะสลายไป"
 east_europe.0142.a:0 "ภารกิจที่บ้าบิ่น!"
 east_europe.0142.a.tt:0 "$mogyer_collective_noun$ เริ่ม [hungarian_invasion|E]"
 east_europe.0143.t:0 "$east_europe.0141.t$"
 east_europe.0143.desc.pannonian_capital:0 "ข่าวร้ายจากทุ่งหญ้าสเตปป์! พ่อค้าและสายลับนำข่าวมาว่า"
 east_europe.0143.desc.pannonian_territory:0 "ข่าวที่น่ากังวลจากทุ่งหญ้าสเตปป์! เจ้าครองนครท้องถิ่นอ้างว่า"
 east_europe.0143.desc.fallback:0 "ข่าวร้ายจากทุ่งหญ้าสเตปป์! ข้าหลวงที่เดือดร้อนได้ส่งต่อรายงานว่า"
 east_europe.0143.desc.outro:0 "ว่า [mogyer_invader.GetShortUIName] ขุนศึก $mogyer$ กำลังรวบรวมกำลังทั้งหมดของอาณาจักร [mogyer_invader.GetHerHis] เพื่อเปิดการรุกรานแพนโนเนียอย่างเต็มรูปแบบ\n\nแม้ แต่ตอนนี้ ฝูงชน $mogyer$ กำลังรวมตัวกัน เตรียมพร้อมที่จะหลั่งไหลเข้าสู่ที่ราบด้วยม้าปีศาจของพวกเขาและพลิกคว่ำระเบียบท้องถิ่นทั้งหมด!"
 east_europe.0143.a:0 "แน่นอนว่าพวกเขาจะไม่มีวันข้ามเทือกเขาคาร์เพเทียนได้?"
 east_europe.0143.a.tt:0 "$east_europe.0142.a.tt$"

#LIVONIAN DECISIONS
 east_europe.0200.t:0 "[founder.GetTitleAsNameNoTooltip] แห่งลิโวเนีย"
 east_europe.0200.desc.christian:1 "ดินแดนแถบบอลติกเป็นดินแดนดั้งเดิมและป่าเถื่อนมานานหลายศตวรรษ เป็นเพียงที่อยู่ของลัทธินอกรีตต่างๆ และผู้นับถือปีศาจ ด้วยพิธีราชาภิเษกของ [founder.GetTitleAsNameNoTooltip] แห่งลิโวเนีย ผู้เป็น [ROOT.Char.GetFaith.GetReligion.GetNameNoTooltip] พลังอำนาจของ [founder.GetFaith.HighGodName] ได้ให้ความอบอุ่นแก่ดินแดนที่เปียกชื้นและหนาวเย็นนี้\n\nด้วยภารกิจของ [ROOT.Char.GetFaith.GetReligion.GetNameNoTooltip] ที่ประสบความสำเร็จในแถบบอลติก ข้าจึงมีอิสระที่จะประกาศลิโวเนีย; บรรดาศักดิ์ที่จะรวมทุกคนในแถบบอลติกไว้เบื้องหลังภารกิจร่วมกันของเราในการเผยแพร่พระวจนะของ [founder.GetFaith.random_GoodGodNames]"
 east_europe.0200.desc.nonchristian:1 "ชาวบอลติกขาดอาณาจักรสำหรับประชาชนของตนเองมานานหลายศตวรรษ ในขณะที่ไวกิงรุกรานหมู่บ้านชายฝั่งของเราและมิชชันนารีต่างชาติจากดินแดนห่างไกลเรียกเราว่าดั้งเดิมและป่าเถื่อน — แต่ไม่ใช่อีกต่อไป ชาวบอลติกที่กระจัดกระจายตอนนี้คุกเข่าลงพร้อมกันต่อหน้ามงกุฎแห่งลิโวเนีย\n\nด้วยพิธีราชาภิเษกของข้าในฐานะ [founder.GetTitleAsNameNoTooltip] ข้าจะนำพาสู่ยุคทอง ไม่เพียง แต่สำหรับชาว [founder.GetCulture.GetName] เท่านั้น แต่สำหรับชาวบอลติกทุกคนตามแนวชายฝั่ง"
 east_europe.0200.desc.outro:0 "\n\nข้ากุมชะตากรรมของชาวบอลติกไว้ในมือ และด้วยการก่อตั้งอาณาจักรนี้ ข้าจะนำพาสู่ยุคทองใหม่แห่งศรัทธาและเกียรติยศภายใต้ [founder.GetFaith.HighGodName]"
 east_europe.0200.a:0 "มรดกของข้าจะยืนยงกว่าชั่วชีวิตข้า!"
 east_europe.0200.b:0 "เพื่อ [founder.GetFaith.HighGodName] และเกียรติยศ!"
 
 east_europe.0201.t:0 "$east_europe.0101.t$"
 east_europe.0201.desc:0 "ผู้ส่งสารนำข่าวมาจากชายฝั่งอันหนาวเหน็บของลิโวเนีย: [founder.GetShortUIName] ได้รับการประกาศให้เป็น [founder.GetTitleAsNameNoTooltip] แห่ง [founder.GetPrimaryTitle.GetNameNoTier]\n\nด้วยชาวบอลติกทั้งหมดรวมกันอยู่ภายใต้ธงผืนเดียว ดูเหมือนว่าผู้คนแห่งลิโวเนียจะมีเอกลักษณ์ร่วมกันให้ยึดเหนี่ยวในที่สุด ไม่กระจัดกระจายและสับสนในการปกป้องบ้านเกิดเมืองนอนของตนอีกต่อไป\n\nด้วยการรวมเป็นหนึ่งครั้งนี้ ลิโวเนียดูเหมือนจะอยู่ในมือที่ปลอดภัย… สำหรับตอนนี้"
 east_europe.0201.a:0 "พวกเขายังคงเป็นคนเถื่อน"
 east_europe.0201.b:0 "สรรเสริญ [founder.GetShortUINameNoTooltip]!"
 east_europe.0201.c:0 "รวมกันหรือแตกแยก ชาวบอลติกก็อยู่ไม่ได้นาน"
