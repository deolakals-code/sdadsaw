 courtier_guest_management.0102.t:0 "โอกาสสุดท้ายของข้า"
 courtier_guest_management.0102.desc:0 "[courtier.GetTitledFirstName] ได้ตัดสินใจว่าเวลา [courtier.GetHerHis] ใน [capital.GetNameNoTierNoTooltip] ได้สิ้นสุดลงแล้ว เหล่าคนรับใช้ได้เก็บหีบ [courtier.GetHerHis] และ [courtier.GetSheHe] ได้กล่าวคำอำลา [courtier.GetHerHis] แล้ว\n\nพร้อมกับการจากไปของ [courtier.GetTitledFirstNameNoTooltip] คือสิทธิ์การอ้าง [courtier.GetHerHis] เหนือ [courtier_claim.GetName] หากข้าต้องการกดดันสิทธิ์นั้นและ ทำให้ [courtier.GetHerHim] เป็นเจ้าประเทศราชของข้า นี่คือโอกาสสุดท้ายของข้าที่จะ ทำให้ [courtier.GetHerHim] อยู่ต่อ"

