l_english: 
 almohad.1001.t:0 "การรุ่งเรืองของพวกอัลโมฮัด"
 almohad.1001.desc:0 "ดูเหมือนว่าความเชื่อชายขอบกำลังก่อตัวขึ้นใน [almohad_county.GetName] ขบวนการทางศาสนานี้เรียกตนเองว่าอัลโมฮัด และกล่าวถึงความจำเป็นในการกวาดล้างพวกนอกรีตและผู้หลงผิดออกจากมักเริบ\n\nขุนนางท้องถิ่นต่างกังวล แต่แน่นอนว่ากลุ่มศาสนาชายขอบที่นำโดยนักเทววิทยาผู้เสื่อมเสียคงไม่มีอะไรน่าเป็นห่วงกระมัง?"
 almohad.1001.a:0 "เหตุใดเรื่องนี้จึงควรเป็นที่กังวลของข้า?"
 almohad.1001.a.flavor:0 "เมื่อใดกันที่กลุ่มศาสนาชายขอบในหัวเมืองเคยก่อความวุ่นวายให้ผู้ใด?"
 almohad.1001.b:0 "จงขจัดสิ่งนี้ให้สิ้นซากก่อนที่มันจะหยั่งรากลึก..."
 almohad.1001.b.conversion_tt:0 "หากท่านกำลังดำเนินการเปลี่ยนศาสนาใน [almohad_county.GetName] อยู่แล้ว ความคืบหน้าอาจสูญหายหากท่านเลือกตัวเลือกนี้!"
 almohad.1001.player_warning:0 "@warning_icon! #X การล้มเหลวในการเปลี่ยนศาสนาของ [almohad_county.GetNameNoTier] ออกจาก [masmudi.GetName] ให้เร็วพอ จะนำไปสู่การรุ่งเรืองของพวกอัลโมฮัด จงเตรียมพร้อมไว้#!"

 almohad.1002.desc:0 "ขบวนการทางศาสนาที่เรียกว่าอัลโมฮัดได้เคลื่อนทัพออกจากฐานที่มั่น โดยมีเจตนาที่จะ "ทวงคืนมาเกร็บจากผู้ไม่เชื่อ" ด้วยกำลังหากจำเป็น!\n\nผู้นำของพวกเขา [ibn_tumart.GetTitledFirstName] เคยถูกปฏิเสธจากสถานศึกษาหลายแห่ง เนื่องจาก — พูดตามตรง — น่ารำคาญในการยืนกรานแนวปฏิบัติทางศาสนาของ [ibn_tumart.GetHerHis] อย่างไรก็ตาม ตอนนี้ [ibn_tumart.GetSheHe] ได้พบผู้ติดตามที่แข็งแกร่งและประกาศว่า [ibn_tumart.GetHerselfHimself] ไม่ใช่ใครอื่นนอกจากมะฮ์ดี!"
 almohad.1002.a:0 "ราวกับว่า [ibn_tumart.GetFaith.PriestNeuter] ต่ำต้อยผู้นี้จะเป็นภัยคุกคามใดๆ ได้!"
 almohad.1002.a.target.tt:0 "พวกอัลโมฮัดทำสงครามกับท่าน!"
 almohad.1002.a.not_target.tt:0 "พวกอัลโมฮัดทำสงครามกับเจ้าเหนือหัวของท่าน!"
 almohad.1002.b:0 "อันที่จริง [ibn_tumart.GetSheHe|U] ก็มีเหตุผลที่ดีมากอยู่หลายข้อ"
 almohad.1002.b.flavor:0 "ข้าแทบจะเรียกตนเองว่าเป็นผู้ศรัทธาที่คู่ควรไม่ได้เลย..."

 almohad.1003.desc:0 "ผู้ก่อตั้งพวกอัลโมฮัด [ibn_tumart.GetTitledFirstName] ได้ถึงแก่กรรมแล้ว และด้วยเหตุนั้น ผู้คนคงหวังว่าขบวนการของ [ibn_tumart.GetHerHis] จะดับสูญไปกับประวัติศาสตร์ หากเพียง แต่เราจะโชคดีถึงเพียงนั้น\n\nแต่กลับมีผู้นำคนใหม่ถือกำเนิดขึ้น! [al_mumin.GetTitledFirstName] ไม่เพียง แต่รวบรวมชนเผ่าต่างๆ ไว้ด้วยกัน [al_mumin.GetSheHe] ยังได้รวบรวมผู้คน #EMP เพิ่มเติม#! มาอยู่ใต้ร่มธงของ [al_mumin.GetHerHis] อีกด้วย!"
 almohad.1003.a:0 "เจ้าพวกคลั่งศาสนาเหล่านี้ยังคงปรากฏตัวไม่หยุดหย่อน!"
 almohad.1003.a.tt:0 "พวกอัลโมฮัดกลับมาอีกครั้ง แข็งแกร่งกว่าที่เคย"

 almohad.1004.t:0 "การควบคุมมาร์ราเกช"
 almohad.1004.desc:0 "ครั้งหนึ่งเคยถูกสถาปนาเป็นราชธานี บัดนี้ [marrakesh.GetTitle] อยู่ภายใต้การควบคุมของข้าแล้ว ซึ่งเป็นสิ่งที่ถูกต้อง อย่างไรก็ตาม มันยังคงมีอิทธิพลของ [old_faith.GetAdjective] หลงเหลืออยู่อย่างไม่สิ้นสุด และชาว [masmudi.GetName] ของข้าก็กระตือรือร้นที่จะเห็นมันถูกสร้างขึ้นใหม่ตามภาพลักษณ์ของข้า\n\nดูเหมือนน่าเสียดายที่จะต้องทำลายพระราชวังและเทวสถานที่ดีพร้อมจำนวนมาก เช่นนี้ แต่มันอาจจำเป็นเพื่อบรรลุความทะเยอทะยานของข้าในการนำแสงสว่างแห่งปัญญามาสู่มักเริบ"
 almohad.1004.a:0 "เราจะ ทำให้มันเป็นเมืองหลวงใหม่แบบ [masmudi.GetAdjective] ของเรา!"
 almohad.1004.b:0 "ให้เราสร้างนครใหม่ที่ยิ่งใหญ่กว่าเดิม!"
 almohad.1004.c:0 "บางทีนี่อาจไม่ใช่แนวทางที่ฉลาดที่สุด..."
