 marshal_task_levy_desertions_modifier:0 "การหนีทัพของไพร่พล"
 marshal_task_levy_desertions_modifier_desc:1 "ความต้องการสูงและการใช้มือหนัก ทำให้ไพร่พลจำนวนมากหนีทัพจากกองทัพของตัวละครนี้"

 marshal_task_unused_farmland_modifier:0 "พื้นที่เกษตรกรรมที่ไม่ได้ใช้ประโยชน์"
 marshal_task_unused_farmland_modifier_desc:0 "ชาวนาถูกเกณฑ์จากเคาน์ตีนี้อย่างไม่เลือกหน้า ส่งผลให้ขาดแคลนแรงงานสำหรับพื้นที่เกษตรกรรมขนาดใหญ่"

 marshal_task_organized_service_modifier:0 "การรับใช้ที่จัดระเบียบ"
 marshal_task_organized_service_modifier_desc:0 "ชาวนาในเคาน์ตีนี้ถูกจัดระเบียบโดยระบบเพื่อเพิ่มประสิทธิภาพสูงสุดในการรับใช้ทางทหารและการเกษตร"

 marshal_task_military_presence_modifier:0 "การปรากฏตัวของทหาร"
 marshal_task_military_presence_modifier_desc:0 "มอบภูมิคุ้มกันต่อ [county_corruption|E]\n\nเคาน์ตีนี้มีการปรากฏตัวของทหารที่จัดระเบียบอย่างดี คอยช่วยเหลือผู้ปกครองท้องถิ่นตามความจำเป็น"

 marshal_task_increase_control_decreased_opinion_modifier:0 "การควบคุมที่สร้างความไม่พอใจ"
 marshal_task_increase_control_decreased_opinion_modifier_desc:0 "เคาน์ตีนี้ได้รับความเดือดร้อนภายใต้การดูแลอย่างเข้มงวดของจอมพลแห่งอาณาจักร"

 marshal_task_increase_control_increased_opinion_modifier:0 "การชี้นำของจอมพล"
 marshal_task_increase_control_increased_opinion_modifier_desc:0 "เคาน์ตีนี้ได้รับประโยชน์อย่างมากจากการดูแลเอาใจใส่ของจอมพลแห่งอาณาจักร"

 task_manage_guards_disorganized_modifier_desc:0 "ความไร้ระเบียบในหมู่ทหารราชองครักษ์ ทำให้การจับกุมผู้สมคบคิดที่เป็นศัตรูได้ทันท่วงทียากขึ้น"

 tax_collector_free_rein_modifier: "อิสระเต็มที่"
 tax_collector_free_rein_modifier_desc: "ตัวละครนี้ให้อิสระแก่นักเก็บภาษีของตนอย่างเต็มที่ในการคำนวณรายได้ที่ต้องชำระ"
 tax_collector_fair_arbiter_modifier: "ผู้ตัดสินที่เป็นธรรม"
 tax_collector_fair_arbiter_modifier_desc: "ตัวละครนี้ได้ช่วยนักเก็บภาษีของตนรวบรวมเงินบริจาคอย่างยุติธรรมและมีประสิทธิภาพ"
 steward_construction_slowdown_modifier:0 "การก่อสร้างที่ชะลอตัว"
 steward_construction_slowdown_modifier_desc:0 "การจัดการทรัพยากรที่ไม่ดี ทำให้การก่อสร้างขนาดใหญ่เป็นไปได้ยาก"
 steward_task_efficient_taxation_modifier:0 "การเก็บภาษีที่มีประสิทธิภาพ"
 steward_task_efficient_taxation_modifier_desc:0 "การจัดระบบการเก็บภาษีได้ปรับปรุงประสิทธิภาพอย่างมาก"
 steward_settler_resistance_modifier:0 "การต่อต้านการปกครอง"
 steward_settler_resistance_modifier_desc:0 "เคาน์ตีนี้เชื่อว่าไม่ต้องการทั้งการสนับสนุนและหน้าที่เพิ่มเติมที่กำหนดโดยสมุหพระคลังแห่งอาณาจักร"
 steward_welcome_administration_modifier:0 "การปกครองที่ได้รับการต้อนรับ"
 steward_welcome_administration_modifier_desc:0 "เคาน์ตีนี้ได้รับความช่วยเหลือและการสนับสนุนที่เป็นประโยชน์จากสมุหพระคลังแห่งอาณาจักร"
 steward_realm_identity_modifier:0 "ไพร่พลที่เต็มใจ"
 steward_realm_identity_modifier_desc:0 "ชาวนาในเคาน์ตีนี้ถือว่าการรับใช้ในกองทัพไพร่พลเป็นส่วนสำคัญของหน้าที่"
 steward_population_mismanaged_modifier:0 "ประชากรที่ถูกจัดการอย่างผิดพลาด"
 steward_population_mismanaged_modifier_desc:0 "ผู้อยู่อาศัยในเคาน์ตีนี้ไม่พอใจอย่างยิ่งกับวิธีที่สมุหพระคลังแห่งอาณาจักรปฏิบัติต่อพวกเขา"
 steward_administration_embraced_modifier:0 "ยอมรับการปกครอง"
 steward_administration_embraced_modifier_desc:0 "ผู้อยู่อาศัยในเคาน์ตีนี้พอใจกับการดูแลเอาใจใส่เป็นพิเศษที่สมุหพระคลังแห่งอาณาจักรมอบให้"
 steward_redoubled_development_modifier: "การพัฒนาทวีคูณ"
 steward_redoubled_development_modifier_desc: "ผลกำไรทั้งหมดจากการพัฒนาเคาน์ตีนี้จะถูกนำกลับไปใช้เป็นทุนในการพัฒนาต่อไป"
 steward_redoubled_taxation_modifier: "การเก็บภาษีทวีคูณ"
 steward_redoubled_taxation_modifier_desc: "ผลกำไรทั้งหมดจากการพัฒนาเคาน์ตีนี้จะเข้ากระเป๋าของเจ้าเหนือหัวโดยตรง"
 steward_accept_culture_reduced_taxes_modifier:0 "การยกเว้นภาษีทางวัฒนธรรม"
 steward_accept_culture_reduced_development_spread_modifier:0 "ประเพณีโบราณ"
 steward_accept_culture_increased_opinion_modifier:0 "การทาบทามที่ได้รับการชื่นชม"
 steward_accept_culture_increased_development_spread_modifier:0 "ความอยากรู้อยากเห็นทางวัฒนธรรม"

 steward_de_jure_denied_modifier:0 "ปฏิเสธโดยนิตินัย"
 steward_de_jure_denied_modifier_desc:0 "ผู้อยู่อาศัยในเคาน์ตีนี้ไม่พอใจผู้ปกครองของตน ซึ่งปฏิเสธที่จะให้พวกเขาเข้าร่วมกับผู้ปกครองโดยนิตินัย"

 court_chaplain_resisted_conversion_modifier:0 "ต่อต้านการเปลี่ยนศาสนา"
 court_chaplain_resisted_conversion_modifier_desc:0 "ผู้คนในเคาน์ตีนี้กำลังต่อต้านความพยายามในการเปลี่ยนศาสนาอย่างแข็งขัน"
 court_chaplain_religious_construction_modifier:0 "การก่อสร้างทางศาสนา"
 court_chaplain_religious_construction_modifier_desc:0 "ผู้เปลี่ยนศาสนาใหม่สนับสนุนการก่อสร้างอาคารทางศาสนาใหม่อย่างกระตือรือร้น"
 court_chaplain_religious_fervor_modifier:0 "ความกระตือรือร้นในการเปลี่ยนศาสนา"
 court_chaplain_religious_fervor_modifier_desc:0 "ผู้เปลี่ยนศาสนาใหม่กระตือรือร้นที่จะรับใช้ศาสนาใหม่ของตนในทุกวิถีทาง"
 court_chaplain_vassal_claim_upset_modifier:0 "การสร้างสิทธิ์เรียกร้อง"
 court_chaplain_vassal_claim_upset_modifier_desc:0 "ตัวละครนี้ไม่ลังเลที่จะสร้างสิทธิ์เรียกร้องในดินแดนของผู้รับใช้ที่ภักดีของตน"
 court_chaplain_county_conversion_upset_modifier:0 "ไม่พอใจกับการเปลี่ยนศาสนา"
 court_chaplain_county_conversion_upset_modifier_desc:0 "ผู้คนในเคาน์ตีนี้ไม่พอใจกับความพยายามบังคับให้เปลี่ยนศาสนา"
 court_chaplain_county_conversion_support_modifier:0 "การสนับสนุนการเปลี่ยนศาสนา"
 court_chaplain_county_conversion_support_modifier_desc:0 "ผู้เปลี่ยนศาสนาใหม่ในเคาน์ตีนี้หลั่งไหลเข้ามาจำนวนมาก"

