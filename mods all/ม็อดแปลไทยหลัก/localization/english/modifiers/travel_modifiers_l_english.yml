 travel_brought_home_new_techniques:0 "เทคนิคใหม่"
 travel_brought_home_new_techniques_desc:0 "ตัวละครนี้นำเทคนิคการผลิตและแฟชั่นใหม่ๆ กลับบ้านจากการเดินทางในเมืองใหญ่ที่ห่างไกล สิ่งนี้ได้กระตุ้นการพัฒนาเศรษฐกิจของภูมิภาคบ้านเกิด"
 contemplated_life:0 "การใคร่ครวญ"
