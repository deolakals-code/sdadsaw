l_english: 

 ach_how_to_lose_a_war_listener_modifier: "เรื่องเล่าสงครามพ่าย: ผู้ฟัง"
 ach_how_to_lose_a_war_listener_modifier_desc: "ตัวละครนี้ได้รับฟังเรื่องราวอันขมขื่นเกี่ยวกับสงครามที่พ่ายแพ้ และได้เรียนรู้สิ่งที่ไม่พึงกระทำทั้งในชีวิตและในสงคราม"
 ach_how_to_lose_a_war_talker_modifier: "เรื่องเล่าสงครามพ่าย: ผู้เล่า"
 ach_how_to_lose_a_war_talker_modifier_desc: "ตัวละครนี้ได้พร่ำพูดถึงเรื่องราวอันขมขื่นของตน การแบ่งปันเรื่องราวมากเกินไปและพูดซ้ำไปซ้ำมานั้นก็ยังช่วยปลอบประโลมจิตใจได้บ้าง"
 ach_peace_broker_modifier: "ผู้สร้างสันติลิ้นทอง"
 ach_peace_broker_modifier_desc: "ในค่ำคืนก่อนพิธีราชาภิเษก ตัวละครนี้ได้ขัดขวางไม่ให้เกิดสงครามล้างแค้นซ้ำรอย อันเป็นความผิดพลาดอันนองเลือดซ้ำสอง"
 ach_neutered_revanchist_modifier: "ผู้มุ่งล้างแค้นอันอาฆาตที่ถูกถอดเขี้ยวเล็บ"
 ach_neutered_revanchist_modifier_desc: "ตัวละครนี้ได้มีการสนทนาที่เปลี่ยนแปลงชีวิตในระหว่างพิธีราชาภิเษก ซึ่ง ทำให้พวกเขาหวนคิดทบทวนแนวทางของตนที่มีต่อชีวิตและอดีต"
 ach_partners_in_revanchism_passive_modifier: "พันธมิตรแห่งการล้างแค้น: การเตรียมการ"
 ach_partners_in_revanchism_passive_modifier_desc: "ตัวละครนี้กำลังเตรียมการที่จะร่วมมืออย่างใกล้ชิดกับผู้ปกครองอีกคนเพื่อก่อสงครามล้างแค้น\n\n#weak This modifier will gain additional effects when war is declared on its intended target. The ruler sharing this modifier will be called to war and join, if possible. Your new war modifier will be active for one year#!"
 ach_partners_in_revanchism_active_modifier: "พันธมิตรแห่งการล้างแค้น: สงคราม"
 ach_partners_in_revanchism_active_modifier_desc: "ตัวละครนี้กำลังร่วมมืออย่างใกล้ชิดกับผู้ปกครองอีกคนในสงครามล้างแค้น"
 ach_hof_visit_modifier: "การมาเยือนจากผู้นำศรัทธา"
 ach_hof_visit_modifier_desc: "ดินแดนเหล่านี้กำลังอึกทึกครึกโครม เนื่องจากการมาเยือนของประมุขทางศาสนาและคณะผู้ติดตามขนาดมหึมา เหล่าผู้ศรัทธาต่างหลั่งไหลมายังจังหวัด และผู้คนในท้องถิ่นก็เปี่ยมล้นไปด้วยพรและทาน"

 ach_beat_peasants_modifier: "เฆี่ยนตีไพร่"
 ach_beat_peasants_modifier_desc: "ตัวละครนี้ได้รับชื่อเสียงในด้านการลงมือจัดการผู้น้อยของตนด้วยตนเองเมื่อพวกเขาทำตัวนอกลู่นอกทาง"

 ach_positive_rumors_modifier: "ข่าวลือในแง่ดี"
 ach_positive_rumors_modifier_desc: "เหล่าสามัญชนทั่วทั้งอาณาจักรดูเหมือนจะพูดกันเซ็งแซ่ถึงเรื่องเล่าที่ไม่มีมูลเกี่ยวกับความรุ่งโรจน์ของตัวละครนี้"

 ach_negative_rumors_modifier: "ข่าวลือในแง่ร้าย"
 ach_negative_rumors_modifier_desc: "กระแสข่าวลือในช่วงนี้ไม่ได้ส่งผลดีต่อตัวละครนี้เลย"

 ach_arrested_rumormongers_modifier: "เพิ่งจับกุมผู้แพร่ข่าวลือ"
 ach_arrested_rumormongers_modifier_desc: "เหล่าผู้แพร่ข่าวลือในท้องถิ่นเพิ่งเงียบเสียงลง เนื่องจากความกลัวต่อการกดขี่จากลอร์ดของตน"

 ach_arrested_rumormongers_character_modifier: "$ach_arrested_rumormongers_modifier$"
 ach_arrested_rumormongers_character_modifier_desc: "ตัวละครนี้ได้รับชื่อเสียงในด้านความเต็มใจที่จะจับกุมเหล่าไพร่ที่นินทา ซึ่งเป็นเครื่องหมายของความกลัวและความไม่มั่นคงในระดับหนึ่ง"

 ach_imperious_modifier: "หยิ่งผยอง"
 ach_imperious_modifier_desc: "ตัวละครนี้ได้รับชื่อเสียงในด้านการเป็นผู้อยู่เหนือความกังวลเล็กๆ น้อยๆ ทั้งปวง"

 ach_coronation_treated_wound_modifier: "บาดแผลที่ได้รับการดูแล"
 ach_coronation_treated_wound_modifier_desc: "บาดแผลของตัวละครนี้ได้รับการดูแลอย่างชำนาญ"

 ach_coronation_crackdown_modifier: "การปราบปรามในพิธีราชาภิเษก"
 ach_coronation_crackdown_modifier_desc: "เหล่าทหารยามได้บุกเข้าหาประชาชนในภูมิภาคนี้เพื่อฟื้นฟูความสงบเรียบร้อย แม้จะมีความเสียหายเกิดขึ้นมากมาย แต่ความสงบเรียบร้อยก็กลับคืนมา"

 ach_coronation_crackdown_character_modifier: "$ach_coronation_crackdown_modifier$"
 ach_coronation_crackdown_character_modifier_desc: "ตัวละครนี้ได้แสดงความเต็มใจที่จะปล่อยทหารของตนเข้าจัดการประชาชนเพื่อฟื้นฟูความสงบเรียบร้อย สร้างความเคารพยำเกรงจากหลายคน แต่ก็สร้างความขยะแขยงให้แก่บางคน"

 ach_awed_peasantry_modifier: "เหล่าไพร่ผู้ยำเกรง"
 ach_awed_peasantry_modifier_desc: "ตัวละครนี้ได้กล่าวสุนทรพจน์เพื่อปลอบโยนฝูงชนที่โกลาหล จน ทำให้คนนับร้อยหลั่งน้ำตาให้กับวาทศิลป์อันล้ำเลิศนั้น"

 ach_coronation_blissful_ignorance_modifier: "เมินเฉยอย่างสุขใจ"
 ach_coronation_blissful_ignorance_modifier_desc: "ตัวละครนี้รู้ดีว่าปัญหาที่อาจเกิดขึ้นบางอย่าง ทางที่ดีที่สุดคือการเมินเฉยต่อมันอย่างมีความสุข"

 ach_coronation_trusts_nobody_modifier: "ไม่ไว้วางใจผู้ใด"
 ach_coronation_trusts_nobody_modifier_desc: "ตัวละครนี้กำลังหวาดระแวงไปทั่ว และเชื่อมั่นมากขึ้นเรื่อยๆ ว่าเหล่าข้าหลวงของตนกำลังวางแผนเพื่อโค่นล้มตน"

 ach_coronation_stampede_modifier: "การเหยียบกันในพิธีราชาภิเษก"
 ach_coronation_stampede_modifier_desc: "เหตุการณ์อันโชคร้ายหลายอย่างได้นำไปสู่การเหยียบกันตายของคนหลายสิบคน ซึ่งส่วนใหญ่เป็นสามัญชน"

 ach_declarations_of_loyalty_modifier: "การประกาศความภักดี"
 ach_declarations_of_loyalty_modifier_desc: "ตัวละครนี้ดูเหมือนจะไม่มีอะไรจะพูดคุยกับเพื่อนข้าหลวงด้วยกัน นอกจากเรื่องความเที่ยงธรรมของนายเหนือหัวของตน"

 ach_coronation_theocratic_allies_modifier: "พันธมิตรฝ่ายศาสนจักร"
 ach_coronation_theocratic_allies_modifier_desc: "ตัวละครนี้ได้รับประโยชน์อย่างมากจากการร้องขอต่อเหล่านักบวชของข้าหลวงผู้หนึ่ง"

 ach_coronation_little_birds_modifier: "วิหคตัวน้อย"
 ach_coronation_little_birds_modifier_desc: "ตัวละครนี้ได้รับการสนับสนุนจากเครือข่ายสายลับของข้าหลวงผู้หนึ่ง - ช่างน่าโล่งใจยิ่งนัก!"

 ach_coronation_expended_resources_modifier: "ทรัพยากรที่ใช้ไป"
 ach_coronation_expended_resources_modifier_desc: "ตัวละครนี้เพิ่งใช้ทรัพยากรไปมากมายเพื่อสนับสนุนผู้ปกครองอีกคน"
 ach_coronation_expended_resources_martial_modifier: "$ach_coronation_expended_resources_modifier$"
 ach_coronation_expended_resources_martial_modifier_desc: "$ach_coronation_expended_resources_modifier_desc$ แม้ แต่กองทัพของตนก็ยังอ่อนล้า"
 ach_coronation_expended_resources_martial_nomad_modifier: "$ach_coronation_expended_resources_modifier$"
 ach_coronation_expended_resources_martial_nomad_modifier_desc: "$ach_coronation_expended_resources_modifier_desc$ แม้ แต่กองทัพของตนก็ยังอ่อนล้า"

 ach_coronation_expended_resources_intrigue_modifier: "$ach_coronation_expended_resources_modifier$"
 ach_coronation_expended_resources_intrigue_modifier_desc: "$ach_coronation_expended_resources_modifier_desc$ ผลก็คือ เครือข่ายสายลับของตนถูกใช้งานหนักเกินไป"

 ach_focusing_on_prayer_modifier: "มุ่งมั่นในการสวดภาวนา"
 ach_focusing_on_prayer_modifier_desc: "ตัวละครนี้กำลังเก็บงำความคับข้องใจไว้ไม่น้อยโดยการมุ่งเน้นไปที่เรื่องของศรัทธา"

 ach_familial_support_modifier: "การสนับสนุนจากวงศ์ตระกูล"
 ach_familial_support_modifier_desc: "ราชวงศ์นี้เป็นที่รู้จักในด้านการทำงานร่วมกันเป็นหนึ่งเดียว"

 ach_reign_of_terror_modifier: "รัชสมัยแห่งความหวาดกลัว"
 ach_reign_of_terror_modifier_desc: "จังหวัดนี้กำลังทนทุกข์จากการแก้แค้นอันโหดร้ายของนายผู้ถูกเหยียดหยาม"

 ach_reign_of_terror_character_modifier: "รัชสมัยแห่งความหวาดกลัว"
 ach_reign_of_terror_character_modifier_desc: "ตัวละครนี้ได้ตอบโต้ข่าวลือของเหล่าไพร่ด้วยการแก้แค้นอย่างป่าเถื่อนและโหดร้ายต่อเนื่องกัน"

 ach_useful_crowds_modifier: "ฝูงชนที่เป็นประโยชน์"
 ach_useful_crowds_modifier_desc: "เหล่าสายลับของตัวละครนี้เคลื่อนไหวผ่านฝูงชนในท้องถิ่นโดยไม่มีใครสังเกตเห็น"

 ach_coronation_good_listener_modifier: "ผู้ฟังที่ดี"
 ach_coronation_good_listener_modifier_desc: "ตัวละครนี้ได้เริ่มสังเกตผู้คน และกำลังเรียนรู้อะไรมากมายมหาศาลจากผลลัพธ์นั้น..."
 
 ach_coronation_studying_ceremony_modifier: "กำลังศึกษาพิธีราชาภิเษก"
 ach_coronation_studying_ceremony_modifier_desc: "ตัวละครนี้กำลังเรียนรู้มากมายจากการได้เห็นความยากลำบากในการจัดพิธีราชาภิเษก"
 
 ach_coronation_gossips_with_servants_modifier: "นินทากับเหล่าคนรับใช้"
 ach_coronation_gossips_with_servants_modifier_desc: "ตัวละครนี้ได้เริ่มแลกเปลี่ยนเรื่องซุบซิบกับเหล่าคนรับใช้"

 ach_social_distancing_modifier: "การเว้นระยะ"
 ach_social_distancing_modifier_desc: "ตัวละครนี้กำลังรักษาระยะห่างอย่างมากจากผู้อื่นทั้งหมด ซึ่งได้ผลดีอย่างน่าประหลาดใจในการรักษาสุขภาพให้แข็งแรง แต่กระนั้น การที่ต้องตะโกนข้ามห้อง เพื่อให้ได้ยินก็ไม่ใช่เรื่องที่ดีนัก"

 ach_favored_minority_modifier: "ชนกลุ่มน้อยที่ได้รับการอุปถัมภ์"
 ach_favored_minority_modifier_desc: "ผู้ปกครองของจังหวัดนี้ได้เลือกที่จะอุปถัมภ์ผู้คน แม้ว่าตนจะมาจากคนละวัฒนธรรมก็ตาม"
 
 ach_drunk_province_1_modifier: "ประชากรที่เมามาย"
 ach_drunk_province_1_modifier_desc: "คนในท้องถิ่นได้เพลิดเพลินกับการดื่มสุราอย่างเต็มที่สำหรับพิธีราชาภิเษกเมื่อเร็วๆ นี้"
 
 ach_drunk_province_2_modifier: "ประชากรที่มึนเมา"
 ach_drunk_province_2_modifier_desc: "การมีสุราอยู่อย่างมากมายเหลือเชื่อในระหว่างพิธีราชาภิเษกเมื่อเร็วๆ นี้ ได้นำไปสู่ระดับความมึนเมาในจังหวัดนี้อย่างที่ไม่เคยได้ยินมาก่อน"
 
 ach_generous_coronation_drinks_modifier: "เครื่องดื่มในพิธีราชาภิเษกอันอุดมสมบูรณ์"
 ach_generous_coronation_drinks_modifier_desc: "ตัวละครนี้ ทำให้มั่นใจว่าเหล่าสามัญชนได้เพลิดเพลินกับเครื่องดื่มอย่างเพียงพอในระหว่างพิธีราชาภิเษก และพวกเขาก็ยังคงส่งเสียงเชียร์อย่างอ้อแอ้ให้กับนามของเขาจนถึงทุกวันนี้"

 ach_secret_stash_modifier: "เสบียงลับ"
 ach_secret_stash_modifier_desc: "ตัวละครนี้ได้รับเสบียงฮาชิชที่แปลกใหม่มา\n\nให้สิทธิ์ใช้ [decision|E] [GetDecisionWithKey('stress_loss_hashishiyah_decision').GetName] หนึ่งครั้ง"

 ach_liege_subsidies_modifier: "เงินอุดหนุนของราชสำนัก"
 ach_liege_subsidies_modifier_desc: "ผู้ปกครองท้องถิ่นเป็นที่โปรดปรานของนายเหนือหัว และเขตถือครองของพวกเขาก็ เช่นกัน"
