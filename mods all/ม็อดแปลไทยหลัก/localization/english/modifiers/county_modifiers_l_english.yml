 optimized_weighting_failure:0 "แผนการชั่งน้ำหนักถูกเปิดโปง"
 optimized_weighting_failure_desc:0 "พ่อค้ามักหลีกเลี่ยงเคาน์ตีนี้ เนื่องจากระบบการชั่งน้ำหนักที่ไม่เป็นธรรม"
 new_weighting_system:0 "ระบบการชั่งน้ำหนักใหม่"
