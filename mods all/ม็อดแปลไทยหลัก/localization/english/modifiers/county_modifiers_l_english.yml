 super_sleuth_modifier:0 "ผู้ไม่เว้นแม้ก้อนหิน"
 super_sleuth_modifier_desc:0 "ตัวละครนี้จะไม่หยุดยั้งจนกว่าจะค้นพบความจริงและมอบความยุติธรรม"
