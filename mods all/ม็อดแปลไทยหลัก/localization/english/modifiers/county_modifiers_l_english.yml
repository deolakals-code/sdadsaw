 cared_for_war_widow:0 "ดูแลแม่ม่ายสงคราม"
 cared_for_war_widow_desc:0 "แม่ม่ายสงครามในเคาน์ตีนี้ได้รับการดูแลเป็นการส่วนตัวจากผู้มีอำนาจ"
 ignored_war_widow:0 "เพิกเฉยต่อแม่ม่ายสงคราม"
