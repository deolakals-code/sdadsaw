 divide_and_conquer_modifier_desc:0 "ชาวบ้านในเคาน์ตีนี้ตกอยู่ภายใต้โฆษณาชวนเชื่อทางศาสนา ชักจูงให้พวกเขารวมตัวกันภายใต้ธงของเจ้าเหนือหัว"

