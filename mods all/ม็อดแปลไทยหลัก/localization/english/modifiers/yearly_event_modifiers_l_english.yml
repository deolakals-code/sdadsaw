 useful_herbs:0 "เพาะปลูกสมุนไพรยา"
 useful_herbs_desc:0 "ตัวละครนี้กำลังเพาะปลูกสมุนไพรยาหลากหลายชนิด พวกมันจะต้องมีประโยชน์อย่างแน่นอน"

