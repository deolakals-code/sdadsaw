 poisonous_plants:0 "เพาะปลูกพืชพิษ"
 poisonous_plants_desc: "ตัวละครนี้กำลังเพาะปลูกพืชหลากหลายชนิด บางชนิดดูเหมือนจะเป็นพิษ..."
 impressive_flowers:0 "เพาะปลูกดอกไม้งดงาม"
