 yearly_0003_protected_by_liege:0 "ได้รับการคุ้มครองโดยเจ้าเหนือหัว"
 yearly_0003_protected_by_liege_desc:0 "เจ้าเหนือหัวของตัวละครนี้กำลังปกป้องพวกเขาอย่างแข็งขันจากสายลับและแผนการร้าย"
 vassal_distrust_modifier:0 "ข้าหลวงที่ไม่ไว้วางใจ"
 vassal_distrust_modifier_desc:1 "เจ้าเหนือหัวผู้นี้ได้แสดงให้เห็นว่าพวกเขาขาดความเชื่อมั่นอย่างสมบูรณ์ในการรับใช้ของข้าหลวง\n[laws|E]อาณาจักร: #N +10%#! แพงขึ้น"
 protected_vassals_honor_modifier:0 "เกียรติยศของข้าหลวงที่ได้รับการปกป้อง"
 protected_vassals_honor_modifier_desc:0 "ผู้ปกครองผู้นี้ได้ปกป้องเกียรติยศของข้าหลวงในยามขัดแย้ง"
 liege_looking_away_modifier:0 "เจ้าเหนือหัวเมินเฉย"
 liege_looking_away_modifier_desc:0 "เจ้าเหนือหัวของตัวละครนี้จงใจให้อภัยการล่วงละเมิดทั้งหมดยกเว้นที่ร้ายแรง"
 yearly_benevolent_forgiveness_modifier:0 "การกระทำอันเมตตา"
 yearly_benevolent_forgiveness_modifier_desc:1 "ตัวละครนี้ได้แสดงความเมตตาต่อข้าหลวง และต้องการให้ผู้อื่นจดจำ\n[laws|E]อาณาจักร: #P -10%#! ถูกลง"
 yearly_close_watch_modifier:0 "การจับตามองอย่างใกล้ชิด"
 yearly_close_watch_modifier_desc:1 "ตัวละครนี้กำลังถูกจับตามองอย่างใกล้ชิดโดยใครบางคน\nไม่สามารถเข้าร่วมหรือสร้าง[factions|E]ได้"
 yearly_improved_impressions_modifier:0 "ความประทับใจที่ดีขึ้น"
 yearly_improved_impressions_modifier_desc:0 "ตัวละครนี้กำลังพยายามเป็นพิเศษในการสร้างความประทับใจแรกพบ"
 yearly_pious_liege_modifier:0 "เจ้าเหนือหัวผู้ศรัทธา"
 yearly_pious_liege_modifier_desc:0 "ข้าหลวงทางศาสนาสามารถไว้วางใจได้ว่าเจ้าเหนือหัวผู้นี้จะปฏิบัติตามคำสอนทางศาสนาของพวกเขา"
 yearly_befriending_fellow_vassals_modifier:0 "ผูกมิตรกับข้าหลวงร่วม"
