l_english: 
 tgp_natural_disaster_recovery_tax_burden: "ภาระภาษีการฟื้นฟูผู้ประสบภัย"
 tgp_natural_disaster_recovery_tax_burden_desc: "เจ้าพนักงานเก็บภาษีของตัวละครนี้ได้รับคำสั่งให้นำภาษีไปใช้ในความพยายามฟื้นฟูจากภัยพิบัติ"
 tgp_natural_disaster_recovery_tax_burden_reduced: "$tgp_natural_disaster_recovery_tax_burden$"
 tgp_natural_disaster_recovery_tax_burden_reduced_desc: "$tgp_natural_disaster_recovery_tax_burden_desc$"
 tgp_natural_disaster_recovery_popular_hero: "วีรบุรุษผู้บรรเทาภัยพิบัติ"
 tgp_natural_disaster_recovery_popular_hero_desc: "ตัวละครนี้ได้รับการสรรเสริญอย่างกว้างขวางจากการสนับสนุนทุนแก่ความพยายามฟื้นฟูจากภัยพิบัติ ทำให้ได้รับความเคารพนับถือทั่วทั้งแผ่นดิน"
 tgp_natural_disaster_memorial_fortifications: "ป้อมปราการอนุสรณ์"
 tgp_natural_disaster_memorial_fortifications_desc: "ป้อมปราการในภูมิภาคนี้ไม่เพียง แต่ถูกสร้างขึ้นใหม่ แต่ยังได้รับการปรับปรุงให้ดียิ่งขึ้น เพื่อเป็นอนุสรณ์แด่ผู้ล่วงลับและเฉลิมฉลองต่อชัยชนะเหนือภัยพิบัติ"
 tgp_natural_disaster_built_memorial_fortifications: "ผู้สร้างอนุสรณ์"
 tgp_natural_disaster_built_memorial_fortifications_desc: "ตัวละครนี้ได้สนับสนุนทุนอย่างใจกว้างในการก่อสร้างป้อมปราการที่ได้รับการปรับปรุง ณ สถานที่เกิดภัยพิบัติ เพื่อสร้างบันทึกอันถาวรถึงความมุ่งมั่นของราชวงศ์ต่อความเป็นอยู่ที่ดีของภูมิภาค"
 tgp_natural_disaster_memorial_fortifications_wierdijks: "$tgp_natural_disaster_memorial_fortifications$"
 tgp_natural_disaster_memorial_fortifications_wierdijks_desc: "$tgp_natural_disaster_memorial_fortifications_desc$"
 tgp_natural_disaster_keeper_of_order: "ผู้รักษาความสงบเรียบร้อย"
 tgp_natural_disaster_keeper_of_order_desc: "การกำกับดูแลอย่างเด็ดขาดของตัวละครนี้ต่อความพยายามในการเก็บกวาด — การกำจัดเศษซากอย่างรวดเร็วและฟื้นฟูความสงบเรียบร้อย — ได้ ทำให้พวกเขาได้รับความเคารพจากเหล่าข้าหลวง"
 tgp_natural_disaster_cleanup_material_recovery: "การกู้คืนวัสดุจากภัยพิบัติ"
 tgp_natural_disaster_cleanup_material_recovery_desc: "วัสดุที่กู้คืนมาได้จากการจัดการเก็บกวาดภัยพิบัติได้ถูกนำกลับมาใช้ใหม่ ทำให้ต้นทุนการก่อสร้างลดลงอย่างมาก"
 tgp_natural_disaster_reconstruction_economic_activity: "เศรษฐกิจเฟื่องฟูจากการบูรณะ"
 tgp_natural_disaster_reconstruction_economic_activity_desc: "ความพยายามในการบูรณะได้กระตุ้นกิจกรรมทางเศรษฐกิจอย่างมีนัยสำคัญในเคาน์ตีนี้ ด้วยธุรกิจที่เพิ่มขึ้นอันเป็นผลมาจากการดำเนินการสร้างขึ้นใหม่"
 tgp_natural_disaster_reconstruction_development_growth: "การส่งเสริมการพัฒนาจากการบูรณะ"
 tgp_natural_disaster_reconstruction_development_growth_desc: "ความพยายามในการบูรณะอย่างกว้างขวางได้นำมา ซึ่งเทคนิค วัสดุ และโครงสร้างพื้นฐานใหม่ ที่ช่วยเร่งการเติบโตด้านการพัฒนาในเคาน์ตีนี้"
 tgp_natural_disaster_resettlement_domain_burden: "ภาระต่อดินแดนส่วนตัวจากการตั้งถิ่นฐานใหม่"
 tgp_natural_disaster_resettlement_domain_burden_desc: "การจัดการประชากรที่พลัดถิ่นจากพื้นที่ภัยพิบัติได้สร้างภาระต่อขีดความสามารถในการบริหาร ลดทอนประสิทธิภาพในการจัดการดินแดนส่วนตัว"
 tgp_natural_disaster_resettlement_taxation_loss: "การสูญเสียภาษีจากการตั้งถิ่นฐานใหม่"
 tgp_natural_disaster_resettlement_taxation_loss_desc: "การพลัดถิ่นอย่างอลหม่านของประชากรได้นำไปสู่การเก็บภาษีที่ลดลง"
 tgp_natural_disaster_resettlement_levy_growth: "ไพร่พลผู้อพยพ"
 tgp_natural_disaster_resettlement_levy_growth_desc: "ผู้รอดชีวิตจำนวนมากที่พลัดถิ่นจากภัยพิบัติครั้งล่าสุด ยินดีอาสารับราชการทหาร"
 tgp_natural_disaster_aid_monthly_expense: "รายจ่ายช่วยเหลือบรรเทาภัยพิบัติ"
 tgp_natural_disaster_aid_monthly_expense_desc: "ต้นทุนรายเดือนที่เกิดขึ้นต่อ เนื่องจากการให้ความช่วยเหลือด้านมนุษยธรรมแก่ผู้ประสบภัยพิบัติ รวมถึงอาหาร ที่พักพิง และเวชภัณฑ์"
 tgp_natural_disaster_relief_savior: "ผู้ช่วยให้รอดพ้นภัยพิบัติ"
 tgp_natural_disaster_relief_savior_desc: "ตัวละครนี้เป็นที่เคารพบูชาอย่างกว้างขวางสำหรับความช่วยเหลืออันเปี่ยมเมตตาต่อผู้ประสบภัยพิบัติ ทำให้พวกเขาได้รับความเคารพและการยอมรับทางจิตวิญญาณอย่างยั่งยืน"
 tgp_natural_disaster_aid_control_recovery: "การฟื้นฟูการควบคุมจากความช่วยเหลือภัยพิบัติ"
 tgp_natural_disaster_aid_control_recovery_desc: "ความพยายามช่วยเหลือด้านมนุษยธรรมได้ช่วยฟื้นฟูความสงบเรียบร้อยและเสถียรภาพแก่พื้นที่ที่ได้รับผลกระทบจากภัยพิบัติ เร่งการฟื้นตัวของการควบคุมการบริหารในท้องถิ่น"
 tgp_natural_disaster_drainage_reduce_levies: "ความพยายามในการระบายน้ำ: ไพร่พลลดลง"
 tgp_natural_disaster_drainage_reduce_levies_desc: "ไพร่พลในท้องถิ่นถูกเบนไปเพื่อช่วยเหลืองานระบายน้ำ ทำให้กำลังทหารที่มีอยู่ลดลงอย่างมากชั่วขณะหนึ่ง"
 tgp_natural_disaster_drainage_work_levy_shortage: "การขาดแคลนไพร่พลจากงานระบายน้ำ"
 tgp_natural_disaster_drainage_work_levy_shortage_desc: "ไพร่พลของเราจำนวนมากกำลังติดภารกิจงานระบายน้ำท่วม จำกัดความสามารถของเราอย่างรุนแรงในการเติมเต็มกำลังทหาร"
 tgp_natural_disaster_recovery_minister_chancellor: "มหาเสนาบดีช่วยฟื้นฟูภัยพิบัติ"
 tgp_natural_disaster_recovery_minister_chancellor_desc: "ความพยายามของตัวละครนี้ในการฟื้นฟูจากภัยพิบัติทางธรรมชาติได้รับการสนับสนุนจากมหาเสนาบดี"
 tgp_natural_disaster_recovery_minister_of_personnel: "เสนาบดีกรมมหาดไทยช่วยฟื้นฟูภัยพิบัติ"
 tgp_natural_disaster_recovery_minister_of_personnel_desc: "ความพยายามของตัวละครนี้ในการฟื้นฟูจากภัยพิบัติทางธรรมชาติได้รับการสนับสนุนจากเสนาบดีกรมมหาดไทย"
 tgp_natural_disaster_recovery_minister_of_rites: "เสนาบดีกรมพิธีการช่วยฟื้นฟูภัยพิบัติ"
 tgp_natural_disaster_recovery_minister_of_rites_desc: "ความพยายามของตัวละครนี้ในการฟื้นฟูจากภัยพิบัติทางธรรมชาติได้รับการสนับสนุนจากเสนาบดีกรมพิธีการ"
 tgp_natural_disaster_recovery_minister_of_war: "เสนาบดีกรมกลาโหมช่วยฟื้นฟูภัยพิบัติ"
 tgp_natural_disaster_recovery_minister_of_war_desc: "ความพยายามของตัวละครนี้ในการฟื้นฟูจากภัยพิบัติทางธรรมชาติได้รับการสนับสนุนจากเสนาบดีกรมกลาโหม"
