l_english: 
 friendship_metaphor_martial_1:0 "มิตรสหายเปรียบดั่งพี่น้องร่วมรบ"
 friendship_metaphor_intrigue_1:0 "มิตรภาพคือการแลกเปลี่ยนสาส์นลับ"
 friendship_metaphor_stewardship_1:0 "มิตรภาพคือสวนพฤกษา"
 friendship_metaphor_diplomacy_1:0 "มิตรภาพคือการเจรจาต่อรอง"
 friendship_metaphor_learning_1:0 "มิตรภาพคือการโต้แย้งระหว่างผู้เท่าเทียม"
 friendship_metaphor_with_tending_martial_1:0 "มิตรสหายเปรียบดั่งพี่น้องร่วมรบ; ต้องฝึกฝนเพื่อมิให้ก้าวพลาดจากแถว"
 friendship_metaphor_with_tending_intrigue_1:0 "มิตรภาพคือการแลกเปลี่ยนสาส์นลับ; รหัสที่ไม่เปลี่ยนแปลงตามกาลย่อมถูกถอดได้"
 friendship_metaphor_with_tending_stewardship_1:0 "มิตรภาพคือสวนพฤกษา; ต้องรดน้ำและดูแลเสมอ"
 friendship_metaphor_with_tending_diplomacy_1:0 "มิตรภาพคือการเจรจาต่อรอง; ทั้งสองฝ่ายต้องรู้สึกว่าได้รับสิ่งที่สมควรได้"
 friendship_metaphor_with_tending_learning_1:0 "มิตรภาพคือการโต้แย้งระหว่างผู้เท่าเทียม; หากมีเพียงฝ่ายเดียวที่เข้าร่วม ย่อมพังทลายลง"
