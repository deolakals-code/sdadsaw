 MEDLAR_GLOSS: "A small brown pome of the rose family, the #bold medlar#! is eaten only once bletted soft, a favored treat of the medieval fruit course."
 MULBERRY_GLOSS: "A soft, dark berry too delicate to travel far, so the sweetness of the #bold mulberry#! was a fleeting luxury eaten near the tree."
 JUJUBE_GLOSS: "The #bold jujube#!, or Chinese date, is a small reddish fruit, crisp and apple-like when fresh and wrinkled and datelike once dried."
 PERSIMMON_GLOSS: "A honey-sweet orange fruit of East Asia, the #bold persimmon#! is ripened until soft or dried into flat cakes."
 LOQUAT_GLOSS: "The #bold loquat#! is a small, tangy golden fruit of the East, prized as one of the first to ripen in spring."
 LYCHEE_GLOSS: "A fragrant fruit with a rough red rind and translucent flesh, the #bold lychee#! was so coveted that Tang emperors had it carried north by relay riders."
 LONGAN_GLOSS: "A small, sweet relative of the lychee, the #bold longan#! shows a dark seed through its pale flesh, earning the name 'dragon eye'."
 JACKFRUIT_GLOSS: "An enormous tropical fruit, the #bold jackfruit#! yields golden bulbs that are richly sweet and heavily perfumed when ripe."
 MANGOSTEEN_GLOSS: "The #bold mangosteen#! hides snow-white, sweet-tart segments within a thick purple rind, later celebrated as the queen of fruits."
 TAMARIND_GLOSS: "The #bold tamarind#! is a brown pod filled with sticky, sweet-sour pulp, enjoyed as a sweetmeat and valued as a cooling remedy."
