 KALLIKANTZAROS_GLOSS: "ก็อบลินมุ่งร้ายที่รู้จักกันว่าโผล่ออกมาในช่วงสิบสองวันแห่งคริสต์มาสเพื่อสร้างความเดือดร้อนและความโกลาหล"
 
 trickster_spirit_indochina: "[Glossary( 'เมรญ กงแวล', 'MRENH_KONGVEAL_GLOSS' )]"
 MRENH_KONGVEAL_GLOSS: "จิตวิญญาณตัวเล็กที่เข้าใจยากจากตำนานพื้นบ้านเขมร เป็นที่รู้จักจากการเล่นตลกซุกซนและบทบาทในการปกป้องสัตว์และนักเดินทาง"
 
