 trickster_spirit_britannia: "[Glossary( 'พิกซี่', 'PIXIE_GLOSS' )]"
 PIXIE_GLOSS: "จิตวิญญาณตัวจิ๋วมีปีกจากตำนานพื้นบ้านเซลติกและบริเตน ชื่นชอบการเล่นตลกซุกซนและชักนำนักเดินทางให้หลงทาง"
 
 trickster_spirit_germania: "[Glossary( 'โคโบลด์', 'KOBOLD_GLOSS' )]"
 KOBOLD_GLOSS: "จิตวิญญาณประจำบ้านในตำนานพื้นบ้านเยอรมัน ซึ่งจะสลับระหว่างการช่วยทำงานบ้านกับการเล่นตลกซุกซนเมื่อถูกลบหลู่"
 
 trickster_spirit_netherlands: "[Glossary( 'คาเบาเตอร์', 'KABOUTER_GLOSS' )]"
 KABOUTER_GLOSS: "สิ่งมีชีวิตคล้ายโนมจากตำนานดัตช์ มักช่วยทำงานหรือเล่นตลกเมื่อถูกดูหมิ่น"
 
 trickster_spirit_francia: "[Glossary( 'ลูแตง', 'LUTIN_GLOSS' )]"
 LUTIN_GLOSS: "จิตวิญญาณตัวเล็กประจำบ้านหรือป่าจากตำนานพื้นบ้านฝรั่งเศส เป็นที่รู้จักในเรื่องความซุกซน เช่น ทำให้ผมยุ่งเหยิงและซ่อนสิ่งของ"
 
 trickster_spirit_iberia: "[Glossary( 'ดูเอนเด', 'DUENDE_GLOSS' )]"
 DUENDE_GLOSS: "จิตวิญญาณนักเล่นกลตัวเล็กที่เข้าใจยากจากตำนานพื้นบ้านไอบีเรีย ผู้สร้างความโกลาหลเล็กน้อยในบ้าน"
 
 trickster_spirit_north: "[Glossary( 'ทอมเตอ', 'TOMTE_GLOSS' )]"
 TOMTE_GLOSS: "จิตวิญญาณสแกนดิเนเวียที่กล่าวกันว่าคอยปกป้องฟาร์มและสัตว์ แต่มีแนวโน้มที่จะซุกซนหากโกรธเคือง"
 
 trickster_spirit_east: "[Glossary( 'โดโมวอย', 'DOMOVOI_GLOSS' )]"
 DOMOVOI_GLOSS: "จิตวิญญาณประจำบ้านของชาวสลาฟผู้พิทักษ์บ้าน แต่จะเล่นตลกเมื่อถูกขุ่นเคืองใจหรือถูกละเลย"
 
 trickster_spirit_middle_east: "[Glossary( 'จินน์', 'DJINN_GLOSS' )]"
 DJINN_GLOSS: "จิตวิญญาณแห่งไฟไร้ควันจากตำนานพื้นบ้านตะวันออกกลาง มีความสามารถในการจำแลงกายและหลอกลวง"
 
 trickster_spirit_india: "[Glossary( 'รากษส', 'RAKSHASA_GLOSS' )]"
 RAKSHASA_GLOSS: "ผู้จำแลงกายอันมุ่งร้ายจากเทพนิยายอินเดีย มีทักษะในการสร้างภาพลวงตาและเล่ห์เหลี่ยม"
 
 trickster_spirit_africa_north: "[Glossary( 'อีฟริต', 'IFRIT_GLOSS' )]"
 IFRIT_GLOSS: "จิตวิญญาณที่ลุกเป็นไฟและดื้อรั้นจากตำนานพื้นบ้านแอฟริกาเหนือ เกี่ยวข้องกับการหลอกลวงและความแข็งแกร่ง"
 
 trickster_spirit_africa_west: "[Glossary( 'นินกิ นันคา', 'NINKI_NANKA_GLOSS' )]"
 NINKI_NANKA_GLOSS: "จิตวิญญาณคล้ายมังกรที่น่าสะพรึงกลัวจากหนองน้ำในแอฟริกาตะวันตก เชื่อกันว่าจะนำความตายมาสู่ผู้ที่พบเห็น"
 
 trickster_spirit_africa_east: "[Glossary( 'โปโป บาวา', 'POPOBAWA_GLOSS' )]"
 POPOBAWA_GLOSS: "จิตวิญญาณคล้ายค้างคาวจากตำนานพื้นบ้านสวาฮีลี เป็นที่รู้จักในการแพร่กระจายความกลัวในเวลากลางคืนผ่านการจำแลงกายและการทรมานทางจิตใจ"
 
 trickster_spirit_steppe: "[Glossary( 'กุลยาบานี', 'GULYABANI_GLOSS' )]"
 GULYABANI_GLOSS: "ผีกูลตัวสูงขนดกจากตำนานพื้นบ้านตุรกี เป็นที่รู้จักว่าสิงสู่อยู่ในสถานที่รกร้างและล่าเหยื่อนักเดินทางที่โดดเดี่ยวในยามค่ำคืน"
 
 trickster_spirit_siberia: "[Glossary( 'คุทฮ์', 'KUTKH_GLOSS' )]"
 KUTKH_GLOSS: "จิตวิญญาณอีกาที่พบในประเพณีไซบีเรีย เป็นทั้งผู้สร้างและนักเล่นกลเจ้าเล่ห์"
 
 trickster_spirit_tibet: "[Glossary( 'โร-ลังส์', 'ROLANGS_GLOSS' )]"
 ROLANGS_GLOSS: "ซากศพที่ถูกปลุกให้ฟื้นคืนชีพจากตำนานพื้นบ้านทิเบต เป็นที่รู้จักจากการเคลื่อนไหวที่แข็งทื่อและเจตนาร้าย"
 
 trickster_spirit_china: "[Glossary( 'หูหลี่จิง', 'HULIJING_GLOSS' )]"
 HULIJING_GLOSS: "จิตวิญญาณจิ้งจอกจากจีนที่มีพลังในการจำแลงกาย มีชื่อเสียงในด้านการหลอกลวงและเล่ห์เหลี่ยมยั่วยวน"
 
 trickster_spirit_korea: "[Glossary( 'คูมิโฮ', 'KUMIHO_GLOSS' )]"
 KUMIHO_GLOSS: "จิตวิญญาณจิ้งจอกเก้าหางจากเทพปกรณัมเกาหลี เป็นที่รู้จักในการหลอกลวงและล่าเหยื่อมนุษย์"
 
 trickster_spirit_japan: "[Glossary( 'ทานูกิ', 'TANUKI_GLOSS' )]"
 TANUKI_GLOSS: "จิตวิญญาณสุนัขแรคคูนจำแลงกายจากตำนานพื้นบ้านญี่ปุ่น เป็นที่รู้จักในเรื่องภาพลวงตาและความซุกซนขี้เล่น"
 
 trickster_spirit_sakhalin_hokkaido: "[Glossary( 'คาไมทาจิ', 'KAMAITACHI_GLOSS' )]"
 KAMAITACHI_GLOSS: "จิตวิญญาณเพียงพอนขี่ลมจากตำนานญี่ปุ่นตอนเหนือ เป็นที่รู้จักในการฟันเฉือนเนื้อหนังอย่างไม่เจ็บปวด"
 
 trickster_spirit_thailand: "[Glossary( 'ผีตายโหง', 'PHITAIHONG_GLOSS' )]"
 PHITAIHONG_GLOSS: "วิญญาณพยาบาทจากประเพณีไทย ก่อตัวขึ้นจากการตายอย่างกะทันหันหรือรุนแรง เป็นที่รู้จักว่าคอยหลอกหลอนและชักนำให้หลงผิด"
 
 trickster_spirit_malaysia: "[Glossary( 'พะนังงาลัน', 'PENANGGALAN_GLOSS' )]"
 PENANGGALAN_GLOSS: "จิตวิญญาณหัวลอยจากตำนานพื้นบ้านมาเลเซีย ปรากฏตัวเป็นมนุษย์ที่ดูเหมือนหลอกลวงในเวลากลางวันและน่าสะพรึงกลัวในเวลากลางคืน"
 
