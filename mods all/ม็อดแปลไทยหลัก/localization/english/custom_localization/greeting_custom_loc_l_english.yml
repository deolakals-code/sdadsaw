 greeting_supplimentary.negative.insult_christian.1: "May the saints forsake your cause."
 greeting_supplimentary.negative.insult_christian.2: "Your name shall be struck from every prayer."
 greeting_supplimentary.negative.insult_norse.1: "May your ancestors spit upon your shade."
 greeting_supplimentary.negative.insult_norse.2: "Your courage is thinner than winter ice."
 greeting_supplimentary.negative.insult_byzantine.1: "Even the rats of Constantinople flee your stench."
 greeting_supplimentary.negative.insult.4: "May your fields lie fallow and your wells run dry."
 greeting_supplimentary.negative.insult.unreliable_swine: "You unreliable swine."
 greeting_supplimentary.negative.insult.oathbreaker: "You are a liar and an oathbreaker."
 greeting_supplimentary.negative.insult_jewish.1: "May your name be blotted from the book of the living."
 greeting_supplimentary.negative.insult_zoroastrian.1: "May darkness choke the fire you claim to tend."
 greeting_supplimentary.negative.insult_hindu.1: "You walk far from the path of righteousness — and I shall drive you farther still."
 greeting_supplimentary.negative.insult_christian.3: "May hell open wide to receive you."
 greeting_supplimentary.negative.insult_norse.3: "Richly shall the ravens feast upon your dead."
 greeting_supplimentary.positive.flattery.7: "Your renown precedes you across every border."
 greeting_supplimentary.positive.flattery.8: "May your line endure a thousand years."
 greeting_supplimentary.positive.flattery.9: "God keep your sword arm strong."
 greeting_supplimentary.positive.flattery.10: "Peace and plenty upon your house."
 greeting_supplimentary.positive.flattery.11: "May fortune smile upon your banners."
 greeting_supplimentary.positive.flattery_chinese.1: "Heaven's blessings upon thee."
 greeting_supplimentary.positive.flattery_chinese.2: "May your lands always prosper."
 greeting_supplimentary.positive.flattery_chinese.3: "May strength and vigor bless your rule."
 greeting_supplimentary.positive.flattery_norse.1: "May the gods grant you fair winds and fat cattle."
 greeting_supplimentary.positive.flattery_byzantine.1: "May the City's glory shine upon your house."
 greeting_supplimentary.positive.flattery_jewish.1: "May the Holy One bless your house with peace."
 greeting_supplimentary.positive.flattery.12: "Your wisdom is a light to those who seek counsel."
 greeting_supplimentary.positive.flattery.13: "May Heaven keep you in its favor."
