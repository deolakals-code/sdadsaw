l_english: 
 martial_good_trait_match_good_outcome:0 "ในฐานะเด็กที่กระตือรือร้นและกระฉับกระเฉง จึงไม่น่าแปลกใจที่ [ROOT.Char.GetFirstName] ทำได้ดีในการศึกษาด้านสงครามและการต่อสู้ของ[ROOT.Char.GetHerHis]"
 martial_bad_trait_match_good_outcome:0 "การจะกล่าวว่า [ROOT.Char.GetFirstName] ผู้เกเรดูไม่เหมาะกับชีวิตสงครามนั้นถือเป็นการดูแคลนเกินไปนัก อย่างไรก็ตาม [ROOT.Char.GetSheHe] ได้ท้าทายความคาดหมายทั้งปวง"
 martial_neutral_trait_match_good_outcome:0 "ด้วยการสั่งสอนที่เพียงพอ แม้ แต่เด็กที่ไม่แสดงความโน้มเอียงตามธรรมชาติต่อการสงครามเลย เช่น [ROOT.Char.GetFirstName] ก็สามารถเข้าใจมันได้อย่างแท้จริง"
 education_martial_3_outcome_description:0 "[ROOT.Char.GetSheHe|U] ได้แสดงความถนัดอย่างยิ่งทั้งในด้านยุทธวิธีการรบและการจัดการกองทัพ ข้ามั่นใจว่า [ROOT.Char.GetSheHe|U] จะเป็นผู้บัญชาการที่ยอดเยี่ยมในวันหนึ่ง"
 education_martial_3_outcome_description_not_commander:0 "[ROOT.Char.GetSheHe|U] ได้แสดงความถนัดอย่างยิ่งทั้งในด้านยุทธวิธีการรบและการจัดการกองทัพ น่าเสียดายที่ [ROOT.Char.GetSheHe] จะไม่มีวันได้บัญชาการกองทัพ"
 education_martial_4_outcome_description:0 "น่าประทับใจที่ได้เห็นทักษะ เช่นนี้ในผู้ที่ยังเยาว์วัยนัก [ROOT.Char.GetSheHe|U] แสดงให้เห็นถึงระดับความเข้าใจเชิงลึกที่หาได้ยากแม้ในหมู่ผู้บัญชาการที่ช่ำชอง!"
 
 martial_good_trait_match_bad_outcome:0 "ธรรมชาติที่กระฉับกระเฉงของ [ROOT.Char.GetFirstNamePossessive] ถูกคิดว่าเป็นสัญญาณของความผูกพันกับสงครามและการต่อสู้ แต่บางทีมันอาจเป็นเพียงความเกเรเท่านั้น "
 martial_bad_trait_match_bad_outcome:1 "[ROOT.Char.GetFirstName] ไม่เคยแสดงความสนใจในเรื่องการสงครามมากนัก แต่ข้าหวังเสมอว่านั่นอาจเป็นเพียงช่วงเวลาหนึ่ง ข้าช่างไร้เดียงสาเสียจริง"
 martial_neutral_trait_match_bad_outcome:1 "เป็นเวลานาน ข้าหวังว่าการสั่งสอนที่ดีจะเพียงพอที่จะสอน [ROOT.Char.GetFirstName] ถึงความซับซ้อนของการสงคราม ข้าช่างไร้เดียงสาเสียจริง"
 education_martial_1_outcome_description:2 "[ROOT.Char.GetSheHe|U] แสดงความเข้าใจในวิชานี้น้อยมาก แต่อย่างน้อย [ROOT.Char.GetSheHe] ก็รู้ว่าควรจับดาบทางไหน และอาจจะสามารถแยกทหารราบออกจาก $knight_culture_player_no_tooltip_lowercase$ ได้"
 education_martial_2_outcome_description:1 "[ROOT.Char.GetSheHe|U] พัฒนาความเข้าใจพื้นฐานในวิชานี้เท่านั้น แต่อย่างน้อย [ROOT.Char.GetSheHe] ก็ได้เรียนรู้สิ่งจำเป็นในการจัดการกองทัพ ข้าได้ แต่หวังว่าส่วนที่เหลือจะมาพร้อมกับประสบการณ์"

 education_martial_prowess_1_outcome_description:1 "\n\nในระดับส่วนตัว [ROOT.Char.GetSheHe] ได้รับประโยชน์เพียงเล็กน้อยจากการศึกษาแบบ $knight_culture_player_adjective_no_tooltip_lowercase$ ของ[ROOT.Char.GetHerHis] และต่อสู้ตัวต่อตัวอย่างเงอะงะอย่างยิ่ง"
 education_martial_prowess_2_outcome_description:1 "\n\nในระดับส่วนตัว [ROOT.Char.GetSheHe] ยังได้ต่อสู้ปฏิบัติการที่ประสบความสำเร็จสองสามครั้งกับกลุ่มชาวนาที่ก่อกบฏกลุ่มเล็กๆ แสดงให้เห็นว่า [ROOT.Char.GetHerHim] เป็น $knight_culture_player_no_tooltip_lowercase$ ที่มีความสามารถ"
 education_martial_prowess_3_outcome_description:0 "\n\nในระดับส่วนตัว [ROOT.Char.GetSheHe] ได้พิสูจน์แล้วว่าเป็นนักสู้ระยะประชิดที่ประสบความสำเร็จ สามารถใช้ดาบของ[ROOT.Char.GetHerHis] และผู้ติดตามส่วนตัวเป็นหน่วยที่เหนียวแน่นได้"
 education_martial_prowess_4_outcome_description:0 "\n\nในระดับส่วนตัว [ROOT.Char.GetSheHe] ได้แสดงให้เห็นว่า [ROOT.Char.GetHerselfHimself] เป็นนักสู้เดี่ยวที่เก่งกาจอย่างเหลือเชื่อ เชี่ยวชาญแม้กระทั่งรูปแบบการต่อสู้ตามประเพณี [ROOT.Char.GetCulture.GetNameNoTooltip] ที่ยากที่สุด"

 diplomacy_good_trait_match_good_outcome:0 "แม้ แต่ตอนเป็นเด็ก [ROOT.Char.GetFirstName] ก็มีวาทศิลป์เสมอมา ดังนั้นจึงไม่น่าแปลกใจที่ [ROOT.Char.GetSheHe] จะรับการศึกษาด้านความสัมพันธ์ทางการทูตได้เป็นอย่างดี"
 diplomacy_good_trait_match_bad_outcome:0 "แม้จะเป็นเด็กช่างพูด แต่บางครั้ง [ROOT.Char.GetFirstName] ก็พบว่าเป็นการยากที่จะเข้ากับผู้คนได้"
 diplomacy_bad_trait_match_good_outcome:0 "แม้จะไม่ค่อยเข้ากับเด็กคนอื่น แต่ [ROOT.Char.GetFirstName] ก็แสดงความถนัดที่น่าประหลาดใจในการดำเนินกลยุทธ์ทางการทูต"
 diplomacy_bad_trait_match_bad_outcome:0 "[ROOT.Char.GetFirstName] มักจะมุ่งความสนใจไปที่สิ่งที่ #EMP [ROOT.Char.GetSheHe]#! ต้องการเสมอ ดังนั้นจึงอาจไม่น่าแปลกใจนักที่ [ROOT.Char.GetSheHe] ประสบความยากลำบากในการเรียนรู้วิธีโน้มน้าวผู้อื่น"
 diplomacy_neutral_trait_match_good_outcome:0 "ด้วยการสั่งสอนที่เพียงพอ แม้ แต่เด็กที่ไม่แสดงความโน้มเอียงตามธรรมชาติต่ออิทธิพลทางการทูตเลย เช่น [ROOT.Char.GetFirstName] ก็สามารถเข้าใจมันได้อย่างแท้จริง"
 diplomacy_neutral_trait_match_bad_outcome:0 "เป็นเวลานาน ข้าหวังว่าการสั่งสอนที่ดีจะเพียงพอที่จะสอน [ROOT.Char.GetFirstName] ถึงความซับซ้อนของการทูต อย่างไรก็ตาม ความพยายามทั้งหมดกลับไร้ผล"

 stewardship_good_trait_match_good_outcome:0 "เป็นนักปกครองโดยธรรมชาติมาตั้งแต่เกิด จึงไม่ควรมีใครแปลกใจที่ [ROOT.Char.GetFirstName] ก้าวหน้าไปมากในการศึกษาด้านการจัดการอาณาจักรของ[ROOT.Char.GetHerHis]"
 stewardship_good_trait_match_bad_outcome:0 "แม้จะดูเหมือนแสวงหาอำนาจและความเป็นระเบียบอยู่เสมอ แต่ [ROOT.Char.GetFirstName] ก็ไม่ได้เชี่ยวชาญในการบริหารจัดการดินแดนและผู้คนเท่าที่คาดหวังไว้"
 stewardship_bad_trait_match_good_outcome:0 "แม้จะสนใจข่าวลือเกี่ยวกับผู้คนในอาณาจักรมากกว่าภาษีและการสำรวจสำมะโนประชากร แต่ [ROOT.Char.GetFirstName] ก็ได้พัฒนาความถนัดด้านการบริหารจัดการ"
 stewardship_bad_trait_match_bad_outcome:0 "อาจไม่น่าแปลกใจนักที่ความหมกมุ่นของ [ROOT.Char.GetFirstNamePossessive] กับรายละเอียดเล็กๆ น้อยๆ ในชีวิตของผู้คนไม่ได้เป็นประโยชน์ต่อความเข้าใจของ[ROOT.Char.GetHerHis] ในการบริหารจัดการอาณาจักรทั้งมวล"
 stewardship_neutral_trait_match_good_outcome:0 "ด้วยการสั่งสอนที่เพียงพอ แม้ แต่เด็กที่ไม่แสดงความโน้มเอียงตามธรรมชาติต่อการบริหารจัดการเลย เช่น [ROOT.Char.GetFirstName] ก็สามารถเข้าใจมันได้อย่างแท้จริง"
 stewardship_neutral_trait_match_bad_outcome:0 "เป็นเวลานาน ข้าหวังว่าการสั่งสอนที่ดีจะเพียงพอที่จะสอน [ROOT.Char.GetFirstName] ถึงความซับซ้อนของการบริหารจัดการ อย่างไรก็ตาม ความพยายามทั้งหมดกลับไร้ผล"

 intrigue_good_trait_match_good_outcome:0 "เป็นเด็กฉลาดเสมอมา [ROOT.Char.GetFirstName] พิสูจน์ครั้งแล้วครั้งเล่าตลอดการศึกษาของ[ROOT.Char.GetHerHis] ว่า [ROOT.Char.GetSheHe] มีความผูกพันตามธรรมชาติต่อการวางแผนอย่างรอบคอบและการชักนำไปในทางที่ผิดอยู่ไม่น้อย"
 intrigue_good_trait_match_bad_outcome:0 "แม้จะมีประสบการณ์กับการโกหกมาพอสมควรในวัยเด็ก แต่ [ROOT.Char.GetFirstName] ก็พบว่าเป็นการยากเสมอที่จะนำความคิดสร้างสรรค์แบบนั้นมาใช้ในรูปแบบที่มีโครงสร้างใดๆ"
 intrigue_bad_trait_match_good_outcome:0 "แม้จะเป็นเด็กเก็บตัว มักจมอยู่ในความคิด แต่ [ROOT.Char.GetFirstName] ก็ได้พัฒนาความชอบในศิลปะแห่งการชักใย"
 intrigue_bad_trait_match_bad_outcome:0 "ในฐานะเด็กที่เงียบและสันโดษ [ROOT.Char.GetFirstName] ไม่เคยแสดงความสนใจมากนักในการ ทำให้ได้สิ่งที่ [ROOT.Char.GetHerHis] ต้องการ"
 intrigue_neutral_trait_match_good_outcome:0 "ด้วยการสั่งสอนที่เพียงพอ แม้ แต่เด็กที่ไม่แสดงความโน้มเอียงตามธรรมชาติต่อการวางแผนอย่างรอบคอบเลย เช่น [ROOT.Char.GetFirstName] ก็สามารถเข้าใจประโยชน์ของมันได้อย่างแท้จริง"
 intrigue_neutral_trait_match_bad_outcome:0 "เป็นเวลานาน ข้าหวังว่าการสั่งสอนที่ดีจะเพียงพอที่จะสอน [ROOT.Char.GetFirstName] ถึงความซับซ้อนของการวางแผนอย่างรอบคอบ อย่างไรก็ตาม ความพยายามทั้งหมดกลับไร้ผล"

 learning_good_trait_match_good_outcome:0 "เป็นเด็กที่อยากรู้อยากเห็นและกระหายความรู้อยู่เสมอ [ROOT.Char.GetFirstName] ได้แสดงความผูกพันกับความเป็นนักวิชาการตั้งแต่อายุยังน้อย"
 learning_good_trait_match_bad_outcome:0 "แม้จะเป็นเด็กที่อยากรู้อยากเห็น กระตือรือร้นที่จะเรียนรู้ แต่ความสนใจของ [ROOT.Char.GetFirstNamePossessive] ก็ล่องลอยไปที่อื่นเมื่อ [ROOT.Char.GetSheHe] โตขึ้น"
 learning_bad_trait_match_good_outcome:0 "แม้จะดูเหมือนเป็นเด็กที่ไม่ใส่ใจอยู่เสมอ แต่ [ROOT.Char.GetFirstName] ก็ได้พิสูจน์แล้วว่าความขยันหมั่นเพียรที่มุ่งมั่นไม่ใช่ทั้งหมดที่สร้างนักวิชาการ"
 learning_bad_trait_match_bad_outcome:0 "ด้วยความเป็นเด็กที่ไม่ใส่ใจ เช่นนี้ จึงไม่ยากที่จะเข้าใจว่าทำไม [ROOT.Char.GetFirstName] จึงประสบความยากลำบากในการทำความเข้าใจกับความเป็นนักวิชาการ"
 learning_neutral_trait_match_good_outcome:0 "ด้วยการสั่งสอนที่เพียงพอ แม้ แต่เด็กที่ไม่แสดงความโน้มเอียงตามธรรมชาติต่อความเป็นนักวิชาการเลย เช่น [ROOT.Char.GetFirstName] ก็สามารถเข้าใจวิชาใดๆ ได้อย่างแท้จริง"
 learning_neutral_trait_match_bad_outcome:0 "เป็นเวลานาน ข้าหวังว่าการสั่งสอนที่ดีจะเพียงพอที่จะสอน [ROOT.Char.GetFirstName] ถึงความซับซ้อนของความเป็นนักวิชาการทุกประเภท อย่างไรก็ตาม ความพยายามทั้งหมดกลับไร้ผล"



 education_diplomacy_1_outcome_description:1 "การปฏิบัติตามความสุภาพและเกียรติยศเป็นเรื่องท้าทายอย่างยิ่งสำหรับ [ROOT.Char.GetHerHim] แต่อย่างน้อย [ROOT.Char.GetSheHe] ก็รู้จักวิธีปฏิบัติตามมารยาทพื้นฐานของ[ROOT.Char.GetHerHis]"
 education_diplomacy_2_outcome_description:1 "น้อยคนนักในราชสำนักใดที่จะประทับใจกับการเข้าใจมารยาทของ[ROOT.Char.GetHerHis] มากนัก แต่อย่างน้อย [ROOT.Char.GetSheHe] ก็รู้วิธีวางตัวของ[ROOT.Char.GetHerHis] ในสังคมชั้นสูง"
 education_diplomacy_3_outcome_description:0 "ด้วยความเข้าใจอย่างถ่องแท้ในมารยาททุกรูปแบบ ความเข้าใจในความบันเทิงทุกประเภท และวาทศิลป์ที่มาพร้อมกัน [ROOT.Char.GetSheHe] จะมีปัญหาน้อยมากในการดำเนินชีวิตในราชสำนัก"
 education_diplomacy_4_outcome_description:0 "ลิ้นเงินอย่างแท้จริง [ROOT.Char.GetSheHe] สามารถโน้มน้าวความคิดเห็นของเคานต์และกษัตริย์ได้เหมือนกัน! เมื่อ [ROOT.Char.GetSheHe] พูด ราชสำนักก็รับฟังด้วยความเงียบงันอย่างหลงใหล"

 education_stewardship_1_outcome_description:0 "บางที [ROOT.Char.GetSheHe] อาจถือว่าโชคดีที่เชี่ยวชาญศิลปะการนับเหรียญ เพราะแง่มุมอื่นๆ ส่วนใหญ่ของงานสจ๊วตดูเหมือนจะหลุดรอดไปจาก [ROOT.Char.GetHerHim]"
 education_stewardship_2_outcome_description:1 "น้อยคนนักที่จะประทับใจในความเข้าใจของ[ROOT.Char.GetHerHis] ในวิชานี้ แต่ [ROOT.Char.GetSheHe] อย่างน้อยก็ได้พัฒนาความเข้าใจที่มั่นคงเกี่ยวกับพื้นฐานของการจัดการ และจุดเริ่มต้นของความประหยัดที่สมเหตุสมผล"
 education_stewardship_3_outcome_description:0 "แสดงความเข้าใจอย่างถ่องแท้เกี่ยวกับการไหลเวียนของทองคำและการเดินทางของผู้คน [ROOT.Char.GetSheHe] ยังแสดงความคิดสร้างสรรค์ที่น่าทึ่งในการจัดการกับเรื่องเหล่านี้"
 education_stewardship_4_outcome_description:0 "ไม่พอใจเพียงแค่เข้าใจการไหลเวียนของความมั่งคั่งและผู้คน [ROOT.Char.GetSheHe] ดูเหมือนจะสามารถคาดการณ์ได้ราวกับสัญชาตญาณ! [ROOT.Char.GetSheHe|U] ยังหาวิธีใหม่ๆ ในการทำกำไรจากมันได้เสมอ"

 education_intrigue_1_outcome_description:0 "ด้วยความขาดความแยบยลและความอดทน [ROOT.Char.GetSheHe] พบว่าเป็นการยากที่จะดำเนินการตามแผนระยะยาวของ[ROOT.Char.GetHerHis] อย่างน้อย [ROOT.Char.GetSheHe] ก็พยายามวางแผน"
 education_intrigue_2_outcome_description:1 "ในขณะที่ [ROOT.Char.GetSheHe] ได้แสดงให้เห็นว่า [ROOT.Char.GetHerselfHimself] มีความสามารถเต็มที่ในการวางแผนเล็กๆ น้อยๆ น้อยคนนักที่จะเรียกมันว่าประณีต แต่ความประณีตไม่ใช่สิ่งที่คุณต้องการเสมอไป"
 education_intrigue_3_outcome_description:0 "ตอนนี้ [ROOT.Char.GetSheHe|U] รู้วิธีมากมายที่จะได้สิ่งที่ [ROOT.Char.GetSheHe] ต้องการ ที่สำคัญที่สุด [ROOT.Char.GetSheHe] ตระหนักดีถึงผลกระทบทางการเมืองของความต้องการเหล่านั้น"
 education_intrigue_4_outcome_description:0 "อย่างไรก็ตาม ตอนนี้มันยากที่จะบอก ทุกสิ่งที่ได้รับมอบหมายให้ [ROOT.Char.GetHerHim] ทำนั้นถูกทำโดยผู้อื่นก่อนที่ [ROOT.Char.GetSheHe] จะไปถึง และ [ROOT.Char.GetSheHe] ไม่เคยโกหกเล็กๆ น้อยๆ อย่างที่ [ROOT.Char.GetSheHe] เคยทำ บางที [ROOT.Char.GetSheHe] อาจไม่ได้ฉลาดอย่างที่ [ROOT.Char.GetSheHe] ดูเหมือนจะเป็นก็ได้"

 education_learning_1_outcome_description:0 "การแสวงหาความรู้ดูเหมือนจะไม่เคยหยั่งรากในจิตใจของ[ROOT.Char.GetHerHis] อย่างเหมาะสม และตอนนี้เวลาที่ใช้ไปกับหนังสือและตำราดูเหมือนจะเป็นงานที่น่าเบื่อสำหรับ [ROOT.Char.GetHerHim] มากกว่าความสุข"
 education_learning_2_outcome_description:0 "แทบจะไม่ขยันเรียน [ROOT.Char.GetSheHe] อย่างน้อยก็สามารถจดจำคำพูดที่เลือกสรรจากวรรณกรรมคลาสสิกได้ [ROOT.Char.GetSheHe|U] อาจจะไม่มีวันเขียนทฤษฎีบทที่ยิ่งใหญ่ใดๆ แต่ [ROOT.Char.GetSheHe] อาจจะอ่านสักหนึ่งหรือสองบท"
 education_learning_3_outcome_description:0 "ในฐานะผู้เรียนที่กระตือรือร้น [ROOT.Char.GetSheHe] ได้กลายเป็นผู้เผยแพร่ความรู้ และได้พิสูจน์ว่า [ROOT.Char.GetHerselfHimself] มีความสามารถเต็มที่ในการสร้างข้อโต้แย้งทางทฤษฎีและเทววิทยาขั้นสูง"
 education_learning_4_outcome_description:0 "ความเข้าใจของ[ROOT.Char.GetHerHis|U] ในงานปรัชญาและทฤษฎีน่าประทับใจ และ [ROOT.Char.GetSheHe] มักจะมีส่วนร่วมในการโต้วาทีกับอดีตครูของ[ROOT.Char.GetHerHis] แม้จะอายุยังน้อย [ROOT.Char.GetSheHe] ก็สามารถได้ยินการอ้างอิงข้อความที่คลุมเครือเพื่อสนับสนุนแนวคิดและทฤษฎีใหม่ๆ"


