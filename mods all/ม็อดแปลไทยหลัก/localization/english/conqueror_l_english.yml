l_english: 
 conqueror.0001.t: "เพื่อครองพิภพ"
 conqueror.0001.desc: "นับวันยิ่งประจักษ์ชัด ตั้งแต่ไพร่ผู้ต่ำต้อยที่สุดไปจนถึงข้าหลวงผู้สูงศักดิ์ที่สุดของข้า — พวกเขาล้วนกระซิบกระซาบนามของข้า พร่ำเพ้อถึงอำนาจของข้า ร่ำร้องถึง #EMP สงคราม!#! มีผู้สนับสนุนอุดมการณ์ของข้า ด้วยประชาชนของข้ามองว่าข้าคือผู้ปกครองผู้คู่ควรแก่พิภพ\n\nพลังอำนาจแห่ง [ROOT.Char.GetPrimaryTitle.GetBaseName] อยู่ในมือข้าให้บัญชา — และข้าจะบัญชามัน การแผ่ขยายอำนาจคือสิ่งที่ถูกคาดหวังจากข้า การอ้างสิทธิ์ด้วยอำนาจในสิ่งที่ควรเป็นของข้า ข้าถูกลิขิตมาให้ปกครอง ให้ปราบปรามผู้คนรอบข้างและผนวกพวกเขาเข้าเป็นส่วนหนึ่งของ [ROOT.Char.GetPrimaryTitle.GetTierAsNameNoTooltip] ของข้า\n\nเมื่อมีประชาราษฎร์หนุนหลัง ข้าย่อมมิอาจล้มเหลว"
 conqueror.0001.desc.temujin: "\n\nผู้สืบสันดานจากสุนัขป่าสีครามและนางกวางงาม, ข้าจักมอบให้เพียงความวิบัติหรือความศิโรราบ"
 conqueror.0001.a: "จงเริ่มการพิชิต!"
 conqueror_flavor: "ท่านจะเริ่มได้รับการสนับสนุนจากข้าหลวงและประชาราษฎร์ของท่าน แต่พึงระวัง — ท่านจะเห็นการสนับสนุนลดน้อยลงหากท่านอยู่ในความสงบสุขนานเกินไป พ่ายแพ้สงครามมากเกินไป กลายเป็นข้าแผ่นดินของอาณาจักรอื่น หรือเสื่อมจากความโปรดปราน...\n\nหากท่านสิ้นชีพ บุตรหลานของท่านถูกคาดหวังให้สืบทอดภารกิจแห่งการพิชิต"
 conqueror.0001.b: "ข้าขออยู่ที่นี่และดอมดมกลิ่น [ROOT.Char.GetCapitalLocation.Custom('get_region_flower_type_plural')] ดีกว่า..."
 
 conqueror.0002.t: "ผู้พิชิตผู้ล้มเหลว"
 conqueror.0002.intro: "มันจบสิ้นแล้ว สหายเก่าหันหลังให้ ธารแห่งการสนับสนุนที่มั่นคงกำลังขาดสะบั้น และเหล่าทหารละทิ้งดาบของพวกเขาด้วยความผิดหวัง\n\n"
 conqueror.0002.peace: ""'ผู้พิชิต' ผู้ยิ่งใหญ่ที่ไม่พิชิต ช่างน่าขันเสียนี่กระไร!" เสียงของราษฎรของข้าดังก้องในโถง "เรามิได้ต้องการสันติภาพ เราต้องการ #EMP เกียรติยศ!#!""
 conqueror.0002.prestige: "\"ชื่อเสียงของ [root_scope.GetHerHis|U] ไร้ค่าเสียยิ่งกว่าดิน!\" ไพร่ฟ้าข้าแผ่นดินของข้ากล่าวเยาะเย้ย \"ใครเล่าจะติดตามผู้ที่เสื่อมเสียเกียรติ เช่นนั้น?\""
 conqueror.0002.debt_level: "\"[root_scope.GetSheHe|U] ทำลาย [ROOT.Char.GetPrimaryTitle.GetBaseNameNoTierNoTooltip]!\" ไพร่ฟ้าข้าแผ่นดินของข้าเยาะเย้ย \"คลังสมบัติว่างเปล่าโดยสิ้นเชิง [ROOT.Char.GetTitleAsNameNoTooltip] ปล่อยให้เรื่องนี้เกิดขึ้นได้อย่างไร!\""
 conqueror.0002.lost_wars: ""[ROOT.Char.GetTitleAsNameNoTooltip] อ่อนแอ" เสียงของราษฎรของข้าดังก้อง "[root_scope.GetSheHe|U] พ่ายแพ้สงครามครั้งแล้วครั้งเล่า ใครเล่าจะติดตามผู้บัญชาการที่ไร้ความสามารถ เช่นนั้น?""
 conqueror.0002.independence: ""ไม่มีผู้พิชิต #EMP ที่แท้จริง#! คนใดจะยอมก้มหัวให้ผู้อื่น" ราษฎรของข้าวิจารณ์กันด้วยเสียงแผ่วเบา "มันคือความอ่อนแอ ชัดเจนและแท้จริง ไม่มีอะไรอื่น ความอ่อนแอ""
 conqueror.0002.incapable: "\"สติปัญญาของ [root_scope.GetHerHis|U] เลอะเลือนไปแล้ว ไม่มีใครอยู่ในนั้นที่จะนำทางเราได้\" ไพร่ฟ้าข้าแผ่นดินของข้ากระซิบกระซาบ \"มันเคยดีอยู่พักหนึ่ง...\""
 conqueror.0002.count: ""[root_scope.GetFirstName] เป็นเพียง [ROOT.Char.GetTitleAsNameNoTooltip]... น่าสมเพช!" ราษฎรของข้ากระซิบ "ตำแหน่งนั้น #EMP ไร้ค่าสิ้นดี#! เราต้องการติดตามกษัตริย์ — ไม่ใช่ยาจก!""
 conqueror.0002.outro: "ถ้อยคำเหล่านั้นบาดหูข้า\n\nดูเหมือนว่าการพิชิตของข้าจะจบสิ้นลงแล้ว สำหรับตอนนี้"
 conqueror.0002.a: "มันดีเกินกว่าจะเป็นจริง..."
 conqueror_end_flavor: "ท่านจะไม่ได้รับการสนับสนุนจากข้าหลวงและประชาราษฎร์อีกต่อไป"
 
 conqueror_title: "ท่านจะไม่ได้รับการสนับสนุนจากข้าหลวงและประชาราษฎร์อีกต่อไป"
 conqueror_prefix: "ผู้พิชิต:"
 
 conqueror.1000.t: "$conqueror_prefix$ เพื่อท้องพระคลังสงคราม"
 conqueror.1000.desc: ""เพื่อท้องพระคลังสงคราม" สาส์นของ [generous_vassal.GetTitledFirstNamePossessive] กล่าวไว้ "จงใช้ทุนทรัพย์เหล่านี้อย่างชาญฉลาดเถิด โอ้ [ROOT.Char.GetTitleAsNameNoTooltip] — ใช้พวกมันเพื่อสะสมคลังสรรพาวุธ เลี้ยงดูทหาร หรือเสริมกำลังพลของท่านด้วยทหารรับจ้าง ข้าปรารถนาที่จะเห็นเกียรติยศที่ท่านจะนำมาสู่ [ROOT.Char.GetPrimaryTitle.GetBaseName]!"\n\nข้าสามารถใช้สิ่งนี้ให้เกิดประโยชน์ได้"
 conqueror.1000.a: "ทองคำนี้เป็นที่ต้อนรับอย่างยิ่ง"
 conqueror.1000.b: "ใช้ทองคำเพื่อดึงดูดทหารรับจ้าง!"
 conqueror.1000.c: "ขอบใจ [generous_vassal.GetHerHim] อย่างสูงยิ่ง แต่ข้าไม่ต้องการของกำนัล!"
 mercenary_bolstering: "กำลังพลเสริมด้วยทหารรับจ้าง"
 mercenary_bolstering_desc: "ตัวละครนี้ได้รับความสนใจจากทหารรับจ้างจำนวนมาก ผู้ ซึ่งแห่กันมาหาพวกเขาเพื่อเกียรติยศ"
 
 conqueror.1100.t: "$conqueror_prefix$ กำลังพลเสริม"
 conqueror.1100.desc: ""คารวะ ท่าน [ROOT.Char.GetTitleAsNameNoTooltip]" $knight_culture_player_no_tooltip$ กล่าว ประกาศการมาถึงของ [maa_leader.GetHerHis] "ข้าคือ [maa_leader.GetFirstName] ถูกส่งมาโดย [generous_vassal.GetTitledFirstName] เพื่อรับใช้ท่าน — ข้านำกองทหารที่ดีที่สุดที่ [generous_vassal.GetCapitalLocation.GetTitle.GetName] สามารถระดมพลได้มาด้วย!"\n\n"[generous_vassal.GetTitleAsNameNoTooltip] ของข้าเพียงขอให้ท่านใช้พวกเราให้เกิดประโยชน์ และนำพาเราไปสู่เกียรติยศ!" [maa_leader.GetSheHe|U] ยืนตรงแสดงความเคารพ"
 conqueror.1100.a: "ข้าจะจัดหาที่พักให้พวกเจ้า!"
 conqueror.1100.b: "แบ่งทหารไปยังกรมกองต่าง ๆ ของข้า"
 conqueror.1100.c: "[generous_vassal.GetFirstNameNoTooltip] ช่างใจกว้าง แต่ข้าไม่ต้องการพวกเจ้า"
 maa_recruitment_boon: "การเกณฑ์ทหารอาชีพที่มีประสิทธิภาพ"
 maa_recruitment_boon_desc: "ตัวละครนี้กำลังได้รับความช่วยเหลือจากข้าหลวงในการเกณฑ์ทหารอาชีพ"
 war_war_war_opinion: "สงคราม สงคราม สงคราม!"
 
 conqueror.1200.t: "$conqueror_prefix$ ปลดปล่อยสุนัขล่าเกียรติยศ"
 conqueror.1200.desc: "เสียงโห่ร้องดังก้องไปทั่วโถงของข้า เมืองหลวงของข้า ดินแดนของข้า — ทั่วทั้งอาณาจักรของข้า 'สงคราม! สงคราม! สงคราม!' พวกเขากล่าว\n\nข้าหลวงผู้กระหายเกียรติยศของข้าเรียกร้องให้เลือดศัตรูของเราหลั่งไหล เพื่อให้ข้านำชื่อเสียงอันเป็นชะตาของข้ามาสู่พวกเรา\n\nข้าได้รับการสนับสนุนอย่างไม่เปลี่ยนแปลงจากพวกเขา"
 conqueror.1200.a: "ข้าจะไม่ ทำให้พวกเขาผิดหวัง!"
 conqueror.1200.b: "หากพวกเขาต้องการสงคราม เช่นนั้นข้าก็ต้องการทหาร"
 glory_hound_contribution: "การสนับสนุนจากผู้กระหายเกียรติยศ"
 glory_hound_contribution_desc: "ตัวละครนี้กำลังได้รับการสนับสนุนอย่างไม่เปลี่ยนแปลงจากข้าหลวง [GetVassalStance( 'glory_hound' ).GetTextIcon][GetVassalStance( 'glory_hound' ).GetName] ของพวกเขา"
 
 conqueror.1300.t: "$conqueror_prefix$ การสนับสนุนจากประชาราษฎร์"
 conqueror.1300.desc: "\"ใต้ฝ่าละอองธุลีพระบาท [root_scope.GetLadyLord] ของข้าพเจ้า ใต้ฝ่าละอองธุลีพระบาท [ROOT.Char.GetTitleAsNameNoTooltip|l] ของข้าพเจ้า ใต้ฝ่าละอองธุลีพระบาทผู้ไม่มีผู้ใดโต้แย้งได้ — #EMP นายเหนือหัว#! ผู้ [root_scope.Custom('ComplimentAdjective')] ที่สุด!\" ชาวนาพูดตะกุกตะกัก หมอบกราบ [portrait_peasant.GetHerselfHimself] ลงเบื้องหน้าข้า\n\n\"พวกข้าพเจ้าจากหมู่บ้านเล็กๆ อันต่ำต้อยแห่ง [peasant_barony.GetBaseName] มาพร้อมของกำนัล — ธัญพืช สัตว์ป่า และทองคำ พวกข้าพเจ้าตรากตรำทำงานหนัก แต่พวกข้าพเจ้ารู้ว่าท่านจะนำความเจริญรุ่งเรืองมาให้!\" [portrait_peasant.GetSheHe|U] กล่าวต่อ\n\nพวกเขาอาจเป็นไพร่ฟ้าข้าแผ่นดินที่ต่ำต้อยที่สุดของข้า แต่พวกเขาก็ยอมทำทุกอย่างที่ข้าขอ"
 conqueror.1300.a: "ของกำนัลอันวิเศษ ข้าขอบใจพวกเจ้าทุกคน!"
 conqueror.1300.b: "เมื่อพวกเจ้าเห็นทหารของข้า — จงเลี้ยงดูพวกเขา"
 conqueror.1300.c: "ปล่อยให้ทุ่งนาของพวกเจ้าแห้งแล้งต่อไปอีกสักหน่อย ข้าต้องการพวกเจ้า"
 peasant_supplies: "การสนับสนุนอย่างกว้างขวางจากชาวนา"
 peasant_supplies_desc: "ตัวละครนี้เป็นที่นิยมอย่างกว้างขวางในหมู่ชาวนา ผู้ ซึ่งเต็มใจสละเสบียงมากกว่าปกติ"
 peasant_draft: "การเกณฑ์ชาวนา"
 peasant_draft_desc: "ชาวนาแห่กันมาสู่ธงของตัวละครนี้ เต็มใจที่จะจับอาวุธในกองเกณฑ์มากกว่าปกติ"
 
 conqueror_feed_county_gift: "[county_target.GetNameNoTooltip] ส่งทองคำ"
 conqueror_feed_county_gift_desc: "ชาวนาแห่ง [county_target.GetName] มีความกระตือรือร้นกับการพิชิตของท่านและส่งทองคำให้ท่าน"
 conqueror_feed_county_gift_herd: "[county_target.GetNameNoTooltip] ส่งมอบฝูงปศุสัตว์"
 conqueror_feed_county_gift_desc_herd: "เหล่าคนเลี้ยงสัตว์สามัญแห่ง [county_target.GetName] ต่างยำเกรงในความยิ่งใหญ่ของ [ROOT.Char.GetTitleAsName] และได้นำเหล่าสัตว์ชั้นดีมาถวายแด่ท่าน"
 conqueror_feed_knight_joins: "$knight_culture_player_no_tooltip$ เข้าร่วมอุดมการณ์ของท่าน"
 conqueror_feed_knight_joins_desc: "$knight_culture_player_no_tooltip$ [knight.GetFullName] ถวายความภักดี [knight.GetHerHis] แด่ท่าน! (@skill_prowess_icon![knight.GetProwess])"
 conqueror_feed_angry_vassal: "ข้าหลวงผู้โกรธเคืองประทับใจ"
 conqueror_feed_angry_vassal_desc: "[vassal|E] [angry_vassal.GetFullName] ของท่านประทับใจในการพิชิตของท่าน"
 conqueror_feed_generous_courtier: "[generous_courtier.GetFirstName] บริจาคทองคำ"
 conqueror_feed_generous_courtier_desc: "[ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('generous_courtier'))] [generous_courtier.GetFullName] ของท่านบริจาคทองคำเพื่ออุดมการณ์ของท่าน!"
 conqueror_feed_siege_engineer: "วิศวกรล้อมเมืองเข้าร่วม"
 conqueror_feed_siege_engineer_desc: "[GetTrait('military_engineer').GetName( GetNullCharacter )] [new_commander.GetFullName] เข้าร่วมกองทัพของท่าน!"
 
