 diarch.succession_offence.empty:0 ""
 diarch.succession_offence.succession_score:0 "\n\n@warning_icon! #WEAK $diarch.succession_offence.succession_score.guts$#!"
 diarch.succession_offence.succession_score.guts:0 "[character|E] ใดๆ ที่มีคะแนนการสืบทอดตำแหน่งสูงกว่า [ROOT.Char.GetShortUINameNoTooltip] จะสูญเสีย [opinion|E] ต่อ [Select_CString(ROOT.Char.GetLiege.IsLocalPlayer, 'ท่าน', ROOT.Char.GetLiege.GetHerHim )] ตามสัดส่วนของความแตกต่างของคะแนน"
 diarch.succession_offence.unrelated_lowborn:0 "\n\n@warning_icon! #WEAK $diarch.succession_offence.unrelated_lowborn.guts$#!"
 diarch.succession_offence.unrelated_lowborn.guts:0 "การ แต่งตั้ง [lowborn|E] ที่ไม่เกี่ยวข้องจะ ทำให้ [vassals|E] [GetVassalStance( 'courtly' ).GetTextIcon][GetVassalStance( 'courtly' ).GetName] จำนวน ([ROOT.Char.GetLiege.MakeScope.ScriptValue('number_of_courtly_vassals')|V0]) ของ [Select_CString(ROOT.Char.GetLiege.IsLocalPlayer, 'ท่าน', ROOT.Char.GetLiege.GetHerHis )] เสื่อมเสียชื่อเสียง ทำให้พวกเขาสูญเสีย [opinion|E] ต่อ [Select_CString(ROOT.Char.GetLiege.IsLocalPlayer, 'ท่าน', ROOT.Char.GetLiege.GetHerHim )] [EmptyScope.ScriptValue('courtly_offence_scandalise_value')|N0]"
 diarch.succession_offence.related_lowborn:0 "\n\n@warning_icon! #WEAK $diarch.succession_offence.related_lowborn.guts$#!"
 diarch.succession_offence.related_lowborn.guts:0 "การ แต่งตั้ง [family_member|E] ที่เป็น [lowborn|E] จะ ทำให้ [vassals|E] [GetVassalStance( 'courtly' ).GetTextIcon][GetVassalStance( 'courtly' ).GetName] จำนวน ([ROOT.Char.GetLiege.MakeScope.ScriptValue('number_of_courtly_vassals')|V0]) ของ [Select_CString(ROOT.Char.GetLiege.IsLocalPlayer, 'ท่าน', ROOT.Char.GetLiege.GetHerHis )] ขุ่นเคืองอย่างยิ่ง ทำให้พวกเขาสูญเสีย [opinion|E] ต่อ [Select_CString(ROOT.Char.GetLiege.IsLocalPlayer, 'ท่าน', ROOT.Char.GetLiege.GetHerHim )] [EmptyScope.ScriptValue('courtly_offence_greatly_offend_value')|N0]"
 diarch.succession_offence.low_succession:0 "\n\n@warning_icon! #WEAK $diarch.succession_offence.low_succession.guts$#!"
 diarch.succession_offence.low_succession.guts:0 "คะแนนการสืบทอดตำแหน่งที่น่าสมเพชของ [ROOT.Char.GetShortUINamePossessiveNoTooltip|U] จะ ทำให้ [vassals|E] [GetVassalStance( 'courtly' ).GetTextIcon][GetVassalStance( 'courtly' ).GetName] จำนวน ([ROOT.Char.GetLiege.MakeScope.ScriptValue('number_of_courtly_vassals')|V0]) ของ [Select_CString(ROOT.Char.GetLiege.IsLocalPlayer, 'ท่าน', ROOT.Char.GetLiege.GetHerHis )] ขุ่นเคือง ทำให้พวกเขาสูญเสีย [opinion|E] ต่อ [Select_CString(ROOT.Char.GetLiege.IsLocalPlayer, 'ท่าน', ROOT.Char.GetLiege.GetHerHim )] [EmptyScope.ScriptValue('courtly_offence_offend_value')|N0]"
 diarch.succession_offence.medium_succession:0 "\n\n@warning_icon! #WEAK $diarch.succession_offence.medium_succession.guts$#!"
 diarch.succession_offence.medium_succession.guts:0 "คะแนนการสืบทอดตำแหน่งปานกลางของ [ROOT.Char.GetShortUINamePossessiveNoTooltip|U] จะ ทำให้ [vassals|E] [GetVassalStance( 'courtly' ).GetTextIcon][GetVassalStance( 'courtly' ).GetName] จำนวน ([ROOT.Char.GetLiege.MakeScope.ScriptValue('number_of_courtly_vassals')|V0]) ของ [Select_CString(ROOT.Char.GetLiege.IsLocalPlayer, 'ท่าน', ROOT.Char.GetLiege.GetHerHis )] ขุ่นเคืองเล็กน้อย ทำให้พวกเขาสูญเสีย [opinion|E] ต่อ [Select_CString(ROOT.Char.GetLiege.IsLocalPlayer, 'ท่าน', ROOT.Char.GetLiege.GetHerHim )] [EmptyScope.ScriptValue('courtly_offence_somewhat_offend_value')|N0]"
 diarch.succession_offence.high_succession:0 "\n\n@warning_icon! #WEAK $diarch.succession_offence.high_succession.guts$#!"
 diarch.succession_offence.high_succession.guts:0 "คะแนนการสืบทอดตำแหน่งที่เพียงพอของ [ROOT.Char.GetShortUINamePossessiveNoTooltip|U] จะ ทำให้ [vassals|E] [GetVassalStance( 'courtly' ).GetTextIcon][GetVassalStance( 'courtly' ).GetName] จำนวน ([ROOT.Char.GetLiege.MakeScope.ScriptValue('number_of_courtly_vassals')|V0]) ของ [Select_CString(ROOT.Char.GetLiege.IsLocalPlayer, 'ท่าน', ROOT.Char.GetLiege.GetHerHis )] ขุ่นเคืองเล็กน้อย ทำให้พวกเขาสูญเสีย [opinion|E] ต่อ [Select_CString(ROOT.Char.GetLiege.IsLocalPlayer, 'ท่าน', ROOT.Char.GetLiege.GetHerHim )] [EmptyScope.ScriptValue('courtly_offence_lightly_offend_value')|N0]"
