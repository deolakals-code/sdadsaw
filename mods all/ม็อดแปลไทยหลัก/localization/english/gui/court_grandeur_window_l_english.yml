l_english: 
 COURT_GRANDEUR_LABEL:1 "[court_grandeur|E]:"
 COURT_AMENITIES_LABEL:0 "[court_amenities|E]"
 MODIFIER_PREVIOUS_LEVELS_APPLY:0 "#weak $EFFECT_LIST_BULLET$ระดับก่อนหน้าทั้งหมดมีผลบังคับใช้ด้วย#!"
 MODIFIER_PREVIOUS_LEVELS_APPLY_NEWLINE:0 "\n$MODIFIER_PREVIOUS_LEVELS_APPLY$"
 COURT_GRANDEUR_LEVEL_TOOLTIP:4 "#S ผลกระทบ#!\n[CourtGrandeurWindow.GetModifierDescForLevel(CourtGrandeurLevel.GetValue)]\n[AddLocalizationIf( GreaterThan_int32( CourtGrandeurLevel.GetValue, '(int32)1' ), 'MODIFIER_PREVIOUS_LEVELS_APPLY' )]"
 COURT_GRANDEUR_PROGRESS_TOOLTIP_HEADER:1 "#T [court_grandeur|E]: [CourtGrandeurData.GetCurrent|2]#!"
 COURT_GRANDEUR_PROGRESS_TOOLTIP_BASELINE:2 "#S ค่าพื้นฐาน:#! #underline [CourtGrandeurData.GetBase|V0]#!"
 COURT_GRANDEUR_PROGRESS_TOOLTIP_BASELINE_SIMPLE:0 "#weak (ค่าพื้นฐาน #underline [CourtGrandeurData.GetBase|0]#!)#!"
 COURT_GRANDEUR_PROGRESS_TOOLTIP_BASELINE_TIME:0 "#weak จะถึงค่าพื้นฐานใน [GetTimeDifferenceWithDays( CourtGrandeurData.GetDaysUntilAtBase )]#!"
 COURT_GRANDEUR_CHANGE_TOWARDS_BASE:1 "การเปลี่ยนแปลงสู่ค่าพื้นฐาน"
 COURT_GRANDEUR_PROGRESS_TOOLTIP_BASELINE_CHANGE:2 "#S $COURT_GRANDEUR_CHANGE_TOWARDS_BASE$:#! #underline [CourtGrandeurData.GetChangeTowardsBase|+=]#!/เดือน"
 EXPECTED_LEVEL_MARKER_DIFFERENCE:0 "[CourtGrandeurData.GetDifferenceFromExpectedLevel]"
 EXPECTED_LEVEL_MARKER_DIFFERENCE_ABS:0 "[Abs_int32( CourtGrandeurData.GetDifferenceFromExpectedLevel )]"
 EXPECTED_LEVEL_MARKER_EQUAL:0 "ตามความคาดหวัง"
 EXPECTED_LEVEL_MARKER_ABOVE:0 "$EXPECTED_LEVEL_MARKER_DIFFERENCE_ABS$ เหนือความคาดหวัง"
 EXPECTED_LEVEL_MARKER_BELOW:0 "$EXPECTED_LEVEL_MARKER_DIFFERENCE_ABS$ ต่ำกว่าความคาดหวัง"
 COURT_GRANDEUR_EXPECTATIONS_TOOLTIP:0 "[royal_court|E] ของท่านคือ #V $EXPECTED_LEVEL_MARKER_DIFFERENCE_ABS$#! [court_grandeur_level|E] [Select_CString( LessThan_int32( CourtGrandeurData.GetDifferenceFromExpectedLevel, '(int32)0' ), 'ต่ำกว่า', 'เหนือกว่า' )] สิ่งที่คาดหวังสำหรับ [realm_size|E] และ [rank|E] ของท่าน\n\n#S ผลกระทบ#!\n[Character.GetCourtGrandeurDiffFromExpectedLevelModifierCombinedDescription]"
 COURT_GRANDEUR_GRACE_PERIOD_LEVEL_EFFECT_TOOLTIP:0 "ผลกระทบของ [GetCourtGrandeurLevelModifier( CourtGrandeurData.GetCurrentLevelIgnoreGrace ).GetNameWithTooltip] จะถูกนำมาใช้"
 COURT_GRANDEUR_GRACE_PERIOD_NO_LEVEL_EFFECT_TOOLTIP:0 "สูญเสียผลกระทบทั้งหมด"
 COURT_GRANDEUR_GRACE_PERIOD_TOOLTIP:0 "เนื่องจากการสูญเสีย [court_grandeur_level|E] เมื่อเร็วๆ นี้ ท่านจะมีเวลา [CourtGrandeurData.GetGracePeriodEndDate.GetTimeToDate|V] เพื่อบรรลุ [GetCourtGrandeurLevelModifier( CourtGrandeurData.GetCurrentLevel ).GetNameWithTooltip] อีกครั้งก่อนที่ [SelectLocalization( EqualTo_int32( CourtGrandeurData.GetCurrentLevelIgnoreGrace, '(int32)0' ), 'COURT_GRANDEUR_GRACE_PERIOD_NO_LEVEL_EFFECT_TOOLTIP', 'COURT_GRANDEUR_GRACE_PERIOD_LEVEL_EFFECT_TOOLTIP' )]."
 TOP_ROYAL_COURTS_HEADER:0 "#T [royal_court|E] นี้อยู่ในอันดับที่ $RANK|O$ จาก $COURTS$ แห่งในโลก#!"
 TOP_ROYAL_COURT_ENTRY:0 "$POSITION$. [CHARACTER.GetUINameNotMe]"
 TOP_ROYAL_COURT_ENTRY_DISPLAYED_COURT:0 "#bold $POSITION$. [CHARACTER.GetUINameNotMe] #weak (ราชสำนักนี้)#!#!"
 ELLIPSIS:0 "..."
 
 COURT_GRANDEUR_TOAST_GRANDEUR_INCREASED_TITLE:0 "ความโอ่อ่าของราชสำนักเพิ่มขึ้น"
 COURT_GRANDEUR_TOAST_GRANDEUR_RANK_INCREASED_TITLE:0 "ความโอ่อ่าของราชสำนักเพิ่มขึ้น"
 COURT_GRANDEUR_TOAST_GRANDEUR_DECREASED_TITLE:0 "ความโอ่อ่าของราชสำนักลดลง"
 COURT_GRANDEUR_TOAST_GRANDEUR_INCREASED_DESCRIPTION:0 "[royal_court|E] ของท่านตอนนี้อยู่ที่ [court_grandeur_level|E] [court_character.GetCourtGrandeurData.GetCurrentLevel]"
 COURT_GRANDEUR_TOAST_GRANDEUR_DECREASED_DESCRIPTION:0 "[royal_court|E] ของท่านตอนนี้อยู่ที่ [court_grandeur_level|E] [court_character.GetCourtGrandeurData.GetCurrentLevel]"
 COURT_GRANDEUR_EXPECTATION_EFFECTS:0 "[Character.GetCourtGrandeurDiffFromExpectedLevelModifierCombinedDescription]"
 COURT_GRANDEUR_TOOLTIP_BELOW_EXPECTATION:1 "@warning_icon! #X ราชสำนักนี้อยู่ต่ำกว่า [court_grandeur_level|E] ที่คาดหวัง [Subtract_int32( CourtGrandeurData.GetMinimumExpectedLevel, CourtGrandeurData.GetCurrentLevel )] [Select_CString( EqualTo_int32( Subtract_int32( CourtGrandeurData.GetMinimumExpectedLevel, CourtGrandeurData.GetCurrentLevel ), '(int32)1' ), 'ระดับ', 'ระดับ' )] ทำให้เกิดผลกระทบดังต่อไปนี้:\n#!$COURT_GRANDEUR_EXPECTATION_EFFECTS$"
 COURT_GRANDEUR_TOOLTIP_AT_EXPECTATION:0 "ราชสำนักนี้อยู่ใน [court_grandeur_level|E] ที่คาดหวัง ไม่ก่อให้เกิดผลกระทบเชิงบวกหรือเชิงลบเพิ่มเติม"
 COURT_GRANDEUR_TOOLTIP_ABOVE_EXPECTATION:1 "ราชสำนักนี้อยู่เหนือ [court_grandeur_level|E] ที่คาดหวัง [Subtract_int32( CourtGrandeurData.GetCurrentLevel, CourtGrandeurData.GetMinimumExpectedLevel )] [Select_CString( EqualTo_int32( Subtract_int32( CourtGrandeurData.GetCurrentLevel, CourtGrandeurData.GetMinimumExpectedLevel ), '(int32)1' ), 'ระดับ', 'ระดับ' )] ทำให้เกิดผลกระทบดังต่อไปนี้:\n$COURT_GRANDEUR_EXPECTATION_EFFECTS$"
 COURT_GRANDEUR_EXPECTATION_EFFECTS_IGNORE_GRACE:0 "[Character.GetCourtGrandeurDiffFromExpectedLevelWithoutGraceModifierCombinedDescription]"
 COURT_GRANDEUR_TOOLTIP_BELOW_EXPECTATION_IGNORE_GRACE:1 "@warning_icon! #X ใน [CourtGrandeurData.GetGracePeriodEndDate.GetTimeDiffFromNow] ราชสำนักนี้จะลดลงไปอยู่ที่ [Subtract_int32( CourtGrandeurData.GetMinimumExpectedLevel, CourtGrandeurData.GetCurrentLevelIgnoreGrace )] [Select_CString( EqualTo_int32( Subtract_int32( CourtGrandeurData.GetMinimumExpectedLevel, CourtGrandeurData.GetCurrentLevelIgnoreGrace ), '(int32)1' ), 'ระดับ', 'ระดับ' )] ต่ำกว่า [court_grandeur_level|E] ที่คาดหวัง ทำให้เกิดผลกระทบดังต่อไปนี้แทน:\n#!$COURT_GRANDEUR_EXPECTATION_EFFECTS_IGNORE_GRACE$"
 COURT_GRANDEUR_TOOLTIP_AT_EXPECTATION_IGNORE_GRACE:1 "ใน [CourtGrandeurData.GetGracePeriodEndDate.GetTimeDiffFromNow] ราชสำนักนี้จะลดลงสู่ [court_grandeur_level|E] ที่คาดหวัง ทำให้ผลกระทบเชิงบวกจากการอยู่เหนือความคาดหวังหายไป"
 COURT_GRANDEUR_TOOLTIP_ABOVE_EXPECTATION_IGNORE_GRACE:1 "ใน [CourtGrandeurData.GetGracePeriodEndDate.GetTimeDiffFromNow] ราชสำนักนี้จะลดลงไปอยู่ที่ [Subtract_int32( CourtGrandeurData.GetCurrentLevelIgnoreGrace, CourtGrandeurData.GetMinimumExpectedLevel )] [Select_CString( EqualTo_int32( Subtract_int32( CourtGrandeurData.GetCurrentLevelIgnoreGrace, CourtGrandeurData.GetMinimumExpectedLevel ), '(int32)1' ), 'ระดับ', 'ระดับ' )] เหนือ [court_grandeur_level|E] ที่คาดหวัง ทำให้เกิดผลกระทบดังต่อไปนี้แทน:\n$COURT_GRANDEUR_EXPECTATION_EFFECTS_IGNORE_GRACE$"
 COURT_GRANDEUR_EXPECTED_LEVEL:1 "นี่คือ [court_grandeur_expectation|E] ปัจจุบันของท่าน"
 COURT_GRANDEUR_PENDING_LEVEL:1 "จะกลายเป็นระดับปัจจุบันใน [CourtGrandeurData.GetGracePeriodEndDate.GetTimeDiffFromNow]"
 COURT_GRANDEUR_LEVEL_REQUIREMENT:0 "#weak (ต้องการ [court_grandeur|E] [CourtGrandeurLevel.GetGrandeurForLevel|V0]+)#!"
 COURT_GRANDEUR_ACTIVE_LEVEL:0 "#bold ระดับที่ใช้งานอยู่#! $COURT_GRANDEUR_LEVEL_REQUIREMENT$"
 COURT_GRANDEUR_CURRENT_LEVEL:0 "#bold ระดับปัจจุบัน#! $COURT_GRANDEUR_LEVEL_REQUIREMENT$"
 COURT_GRANDEUR_INACTIVE_LEVEL:0 "#bold #X ระดับที่ไม่ได้ใช้งาน#!#! $COURT_GRANDEUR_LEVEL_REQUIREMENT$"
 COURT_GRANDEUR_CURRENT_LEVEL_GRACE_PERIOD:2 "@warning_icon! #X [grandeur|E] ไม่เพียงพอที่จะรักษาระดับนี้ไว้ จะกลายเป็นไม่ใช้งานใน [CourtGrandeurData.GetGracePeriodEndDate.GetTimeDiffFromNow] เว้นแต่ความโอ่อ่าของราชสำนักจะเพิ่มขึ้นเป็นอย่างน้อย [CourtGrandeurLevel.GetGrandeurForLevel|V0]#!"
