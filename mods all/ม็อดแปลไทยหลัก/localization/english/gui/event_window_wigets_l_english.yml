 event_window_widget_harrying_tooltip: "การขับเคี่ยวกันอย่างต่อเนื่องระหว่างผู้คนเก่าแก่และกลุ่มคนใหม่ นำไปสู่สงครามที่ไม่ได้ประกาศซึ่งปะทุขึ้นทั่วอังกฤษ โดยผู้ปกครองชาวนอร์มันกลุ่มใหม่ได้ตอบโต้ด้วยการแก้แค้นอย่างรุนแรงต่อการยั่วยุของเหล่าขุนนางแองโกล-แซกซอนที่ถูกปลดออกจากตำแหน่ง\n\nเมื่อสถานการณ์ดำเนินไป การกระทำของพวกเขาและตัวละครอื่นๆ จะเป็นตัวกำหนดระดับ [harrying_resistance|E] และ [harrying_pacification|E] ของภูมิภาคนี้\n\n#TS #EMP [harrying_resistance|E]#! ที่สูงขึ้น จะนำไปสู่:#!\n$EFFECT_LIST_BULLET$[cultural_acceptance|E] ที่ลดลง\n$EFFECT_LIST_BULLET$[county_control|E] ที่ลดลง\n$EFFECT_LIST_BULLET$โอกาสเกิด [claimant_factions|E] หรือแม้กระทั่ง [civil_war|E] ที่เพิ่มสูงขึ้น\n\n#TS #EMP [harrying_pacification|E]#! ที่สูงขึ้น จะนำไปสู่:#!\n$EFFECT_LIST_BULLET$[cultural_acceptance|E] ที่เพิ่มขึ้น\n$EFFECT_LIST_BULLET$[county_control|E] ที่เพิ่มขึ้น\n$EFFECT_LIST_BULLET$โอกาสเกิด [claimant_factions|E] ที่ลดลง"
 event_window_widget_harrying_tooltip_widget: "[harrying_widget_i]การกวาดล้างทางเหนือติดตามค่า [harrying_resistance|E] และ [harrying_pacification|E] สิ่งเหล่านี้มีผลกระทบต่อสองกลุ่มหลักที่เกี่ยวข้องในภูมิภาค: ผู้ปกครองชาวนอร์มันแห่งอังกฤษ และข้าหลวงแองโกล-แซกซอนระดับ [duke|E] ใดๆ ที่พวกเขาอาจมี\n\n[harrying_resistance|E] ที่สูงขึ้นแสดงถึงการต่อต้านของชาวแองโกล-แซกซอนต่อการยึดครองของชาวนอร์มัน และระดับที่สูงขึ้นสามารถนำไปสู่ [cultural_acceptance|E] ระหว่างแองโกล-แซกซอน/นอร์มันที่ต่ำลง, [county_control|E] ที่ต่ำลง, โอกาสที่สูงขึ้นของ [claimant_factions|E] หรือแม้กระทั่ง [civil_war|E]\n\n[harrying_pacification|E] ที่สูงขึ้นสามารถนำไปสู่ [cultural_acceptance|E] ระหว่างแองโกล-แซกซอน/นอร์มันที่สูงขึ้น, [county_control|E] ที่สูงขึ้น และโอกาสที่ต่ำลงของ [claimant_factions|E]"
