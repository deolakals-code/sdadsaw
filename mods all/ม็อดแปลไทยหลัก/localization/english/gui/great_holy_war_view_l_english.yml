 GHW_NOT_ATTACKER_PLEDGED:1 "#Weak หากท่านให้คำมั่นในฐานะผู้โจมตี:\n$EFFECT_LIST_BULLET$ท่านเลือก [beneficiary|E] ที่อาจได้รับบรรดาศักดิ์ในราชอาณาจักร\n$EFFECT_LIST_BULLET$ท่านอาจได้รับส่วนแบ่งจากคลังสงคราม\n$EFFECT_LIST_BULLET$ท่านได้รับทองบางส่วนจากคลังสงครามเมื่อมหาสงครามศักดิ์สิทธิ์เริ่มขึ้น\n$EFFECT_LIST_BULLET$สงครามกับผู้เข้าร่วมคนอื่นจะสิ้นสุดลงเมื่อมหาสงครามศักดิ์สิทธิ์เริ่มขึ้น#!"
 GHW_NOT_DEFENDER_PLEDGED:1 "#Weak หากท่านให้คำมั่นในฐานะผู้ป้องกัน:\n$EFFECT_LIST_BULLET$ท่านอาจได้รับส่วนแบ่งจาก [piety|E] และ [prestige|E] ของคลังสงคราม\n$EFFECT_LIST_BULLET$สงครามกับผู้เข้าร่วมคนอื่นจะสิ้นสุดลงเมื่อมหาสงครามศักดิ์สิทธิ์เริ่มขึ้น#!"
 GHW_PLEDGED:0 "ข้าพเจ้าให้คำมั่นในฐานะผู้ป้องกัน หากเราได้รับชัยชนะ ข้าพเจ้าอาจได้รับส่วนหนึ่งของคลังสงครามตามการมีส่วนร่วมในสงครามของข้าพเจ้า"
