l_english: 
 ATTRITION_ICON_TITLE:1 "#T กองทัพกำลังจะประสบ [attrition|E]#!"
 ARMY_EMBARKED_PENALTY:0 "[embarked|E]: @advantage_icon!$EFFECT|0+=$ ($DAYS_LEFT$ วัน)"
 ARMY_RECENTLY_DISEMBARKED_PENALTY:1 "[recently_disembarked|E]: @advantage_icon!$EFFECT|0+=$ ($DAYS_LEFT$ วัน)"
 MAP_ICON_RECENTLY_DISEMBARKED_TOOLTIP:0 "#T เพิ่งขึ้นฝั่ง#!\nจะถือว่า [recently_disembarked|E] อีก [UnitItem.GetArmy.GetDisembarkPenaltyDays] วัน"
 COMMANDER_IS_LEADER:0 "#underline #TOOLTIP:COMMANDER_IS_LEADER_TOOLTIP บัญชาการโดยผู้ปกครอง#!#!"
 COMMANDER_IS_LEADER_TOOLTIP:0 "#T บัญชาการโดยผู้ปกครอง#!\n[Character.GetName] บัญชาการกองทัพนี้ มอบโบนัสดังต่อไปนี้:\n[GetLeadingTroopsBonus]"
 POTENTIAL_COMMANDER_IS_LEADER_TOOLTIP:1 "#T ผู้ปกครอง#!\nการเป็น [commander|E] ของ [army|E] ของท่านเองจะมอบ:\n[GetLeadingTroopsBonus]"
 RP_TOOLTIP_CLICK:1 "#T [RallyPoint.GetName]#!\n$CLICK_TO_VIEW$"
 ARMY_TOOLTIP_IS_GATHERING:1 "กำลังรวบรวม ([Army.GetGatheringDaysLeft] วัน)"
 ARMY_TOOLTIP_IS_MOVEMENT_LOCKED:1 "[movement_locked|E]"
 UNIT_ITEMS:1 "([UnitMapIcon.GetShownCount])"
 RAID_ARMY_TOOLTIP: "#T ผู้ปล้นสะดม#!\nกองทัพนี้กำลัง [raid|E]\nกำลังบรรทุก [loot_i][Army.GetRaidLoot|V0]"
 ARMY_AT_LOOT_CAP:1 "ไม่สามารถบรรทุก [loot|E] ได้อีก"
 ARMY_AT_LOOT_CAP_TOOLTIP: "#T บรรทุกของปล้นเต็มพิกัด#!\nกองทัพนี้กำลังบรรทุก [loot_i][Army.GetRaidLoot|V0] และไม่สามารถ [raid|E] ได้อีกก่อนที่จะกลับบ้าน"
 ARMY_RETREATING: "กำลัง [retreat|E]"
 ARMY_IS_AUTOMATED: "กองทัพทำงานอัตโนมัติ"
 ARMY_IS_ALLY: "กองทัพพันธมิตร"
 MAP_RAID_TOOLTIP:0 "#T การปล้นที่กำลังดำเนินอยู่#!\nคาดว่าจะแล้วเสร็จ: [Raid.GetEta.GetString]\n[loot|E] ที่จะได้รับ: [loot_i][Raid.GetProvince.GetLoot|0V].\n\n#I คลิกเพื่อดูการปล้น#!"
 RECENTLY_RAIDED_TOOLTIP:0 "#T เพิ่งถูกปล้นสะดม#!\nที่ดินถือครองนี้เพิ่งถูกปล้นสะดมและไม่สามารถถูกปล้นได้อีกจนถึง [Province.GetEndOfRecentlyLooted.GetString]"
 MAP_PIN_BARTER_GOODS_NEEDED: "@barter_goods_icon! [DetailedBarterIcon.GetProvince.GetBarterGoodsNeeded|0V]"
 MAP_PIN_BARTER_LOOT_RECEIVED: "@loot_icon![DetailedBarterIcon.GetProvince.GetLoot|0V]"
 MAP_BARTER_TOOLTIP: "#T ภารกิจแลกเปลี่ยนที่กำลังดำเนินอยู่#!\nคาดว่าจะแล้วเสร็จ: [BarterMission.GetEta.GetString]\n[loot|E] ที่จะได้รับ: [loot_i][BarterMission.GetProvince.GetLoot|0V].\n\n#I คลิกเพื่อดูการแลกเปลี่ยน#!"
 BARTER_ARMY_TOOLTIP: "#T ผู้แลกเปลี่ยน#!\nกองทัพนี้กำลังปฏิบัติภารกิจ [barter|E]\nกำลังบรรทุก [loot|E] [loot_i][Army.GetBarterLoot|V0]"
 RECENTLY_BARTERED_TOOLTIP: "#T เพิ่งแลกเปลี่ยนไป#!\nที่ดินผืนนี้เพิ่งถูกแลกเปลี่ยนไป และไม่สามารถแลกเปลี่ยนได้อีกจนกว่าจะถึง [Province.GetEndOfRecentlyLooted.GetString]"
 ARMY_LOOT_INFO:0 "[loot|E]: [loot_i][Army.GetRaidLoot|V0]/[Army.GetLootCap|0]"
 MAP_ICON_EMBARK_COST:0 "[GetPlayer.GetTreasuryOrGoldPrefix][FleetPredictionMapIcon.GetEmbarkCost|V0][Select_CString(FleetPredictionMapIcon.IsCostOverOwned, '@warning_icon!', '')]"
 MAP_ICON_UNIQUE_BUILDING_CAN_BUILD:1 "#I ท่านสามารถสร้างสิ่งก่อสร้างนี้ได้#!\n\n"
 MAP_ICON_UNIQUE_BUILDING_CANT_BUILD:2 "#X @warning_icon! ท่านไม่สามารถสร้างสิ่งก่อสร้างนี้ได้#!\n\n"
 MAP_ICON_UNIQUE_BUILDING_CANT_USE:2 "#X @warning_icon! ท่านไม่สามารถใช้สิ่งก่อสร้างนี้ได้#!\n\n"
 MAP_ICON_UNIQUE_BUILDING: "#T [UniqueBuildingIcon.GetBuildingType.GetNameNoTooltip]#!\n[UniqueBuildingIcon.GetBuildingType.GetDescription]\n\n[SelectLocalization( And( Not( UniqueBuildingIcon.IsBuilt ), UniqueBuildingIcon.CanConstruct ), 'MAP_ICON_UNIQUE_BUILDING_CAN_BUILD', '' )][SelectLocalization( And( Not( UniqueBuildingIcon.IsBuilt), Not( UniqueBuildingIcon.CanConstruct ) ), 'MAP_ICON_UNIQUE_BUILDING_CANT_BUILD', '' )][SelectLocalization( And( UniqueBuildingIcon.IsBuilt, Not( UniqueBuildingIcon.IsEnabled ) ), 'MAP_ICON_UNIQUE_BUILDING_CANT_USE', '' )]#T ผลกระทบ:#!\n[UniqueBuildingIcon.GetEffect]"
 MAP_ICON_GREAT_BUILDING: "#T [Building.GetNameNoTooltip]#!\n[Building.GetDescription]\n\n[SelectLocalization( And( Not( GreatBuildingIcon.IsBuilt ), GreatBuildingIcon.CanConstruct ), 'MAP_ICON_UNIQUE_BUILDING_CAN_BUILD', '' )][SelectLocalization( And( Not( GreatBuildingIcon.IsBuilt), Not( GreatBuildingIcon.CanConstruct ) ), 'MAP_ICON_UNIQUE_BUILDING_CANT_BUILD', '' )][SelectLocalization( And( GreatBuildingIcon.IsBuilt, Not( GreatBuildingIcon.IsEnabled ) ), 'MAP_ICON_UNIQUE_BUILDING_CANT_USE', '' )]\n[GreatBuildingIcon.GetEffect]"
 MAP_ICON_PROVISIONS_LOW_TT: "#X [provisions|E] เหลือน้อยหลังจากจุดนี้ — เหตุการณ์ [privation|E] จะเกิดขึ้น!#!"
 MAP_ICON_PROVISIONS_CRITICAL_TT: "#XB [provisions|E] หมดหลังจากจุดนี้ — เหตุการณ์ [privation|E] ที่รุนแรงจะเกิดขึ้น!#!"
 MAP_ICON_LANDLESS_RULERS_COUNT: "+[Subtract_int32( LandlessRulersMapIcon.GetValidDomicilesCount, '(int32)1')]"
 MAP_ICON_GREAT_PROJECTS_COUNT: "+[Subtract_int32( GetDataModelSize( GreatProjectMapIcon.GetProjects ), '(int32)1')]"
 MAP_ICON_DETAILED_RAID_LOOT: "@loot_icon![DetailedRaidIcon.GetProvince.GetLoot|0V]"
 MAP_ICON_DETAILED_RAID_TT: "#T [DetailedRaidIcon.GetProvince.GetNameNoTooltip]#!\nของปล้น: [loot_i] [DetailedRaidIcon.GetLoot|0]"
 MAP_ICON_DETAILED_RAID_LOOT_POTENTIAL_TT: "#T การปล้นที่อาจเกิดขึ้น#!\n [loot|E] ที่จะได้รับ: [loot_i][DetailedRaidIcon.GetLoot|0]\n\n$MAP_ICON_DETAILED_RAID_LOOT_HOLD_ALT_TT$"
 MAP_ICON_DETAILED_RAID_LOOT_ONGOING_TT: "#T การปล้นที่กำลังดำเนินอยู่#!\nคาดว่าจะแล้วเสร็จ: [DetailedRaidIcon.GetRaid.GetEta.GetString].\n[loot|E] ที่จะได้รับ: [loot_i][DetailedRaidIcon.GetProvince.GetLoot|0V].\n\n#I คลิกเพื่อดู [raid|e].#!\n$MAP_ICON_DETAILED_RAID_LOOT_HOLD_ALT_TT$"
 MAP_ICON_DETAILED_RAID_LOOT_HOLD_ALT_TT: "#I กด Alt ค้างไว้เพื่อแสดงที่มั่นทั้งหมดที่มีของปล้นซึ่งท่านสามารถ[raid|e]ได้#!"

 MAP_ICON_DETAILED_BARTER_TT: "#T [DetailedBarterIcon.GetProvince.GetNameNoTooltip]#!\nของปล้น: [loot_i] [DetailedBarterIcon.GetLoot|0]"
 MAP_ICON_BARTER_WARNING: "[SelectLocalization( LessThan_CFixedPoint( GetPlayer.GetCurrency('barter_goods'), DetailedBarterIcon.GetProvince.GetBarterGoodsNeeded ), 'MAP_ICON_DETAILED_BARTER_INSUFFICIENT_GOODS', '')]"
 MAP_ICON_DETAILED_BARTER_INSUFFICIENT_GOODS: "@warning_icon! #X [barter_goods] ไม่เพียงพอที่จะ [barter] ที่นี่#!\n"
 MAP_ICON_DETAILED_BARTER_LOOT_POTENTIAL_TT: "#T ภารกิจแลกเปลี่ยนที่อาจเกิดขึ้น#!\n[loot|E] ที่จะได้รับ: [loot_i][DetailedBarterIcon.GetLoot|0V]\n[barter_goods|E] ที่ต้องการ: [barter_goods_i][DetailedBarterIcon.GetProvince.GetBarterGoodsNeeded|0V]\n$MAP_ICON_BARTER_WARNING$\n$MAP_ICON_DETAILED_BARTER_LOOT_HOLD_ALT_TT$"
 MAP_ICON_DETAILED_BARTER_LOOT_ONGOING_TT: "#T ภารกิจแลกเปลี่ยนที่กำลังดำเนินอยู่#!\nคาดว่าจะแล้วเสร็จ: [DetailedBarterIcon.GetBarter.GetEta.GetString]\n[loot|E] ที่จะได้รับ: [loot_i][DetailedBarterIcon.GetProvince.GetLoot|0V]\n[barter_goods|E] ที่ต้องการ: [barter_goods_i][DetailedBarterIcon.GetProvince.GetBarterGoodsNeeded|0V]\n$MAP_ICON_BARTER_WARNING$\n#I คลิกเพื่อดู [barter|E].#!\n$MAP_ICON_DETAILED_BARTER_LOOT_HOLD_ALT_TT$"
 MAP_ICON_DETAILED_BARTER_LOOT_HOLD_ALT_TT: "#I กด Alt ค้างไว้เพื่อแสดงที่ดินทั้งหมดที่มีของปล้นซึ่งท่านสามารถ [barter|E] ได้.#!"
 MAP_ICON_ACTIVITY_DISABLED: "[Activity.GetInvolvementText( Character.Self, 'hud' )]\n\n#X @warning_icon! กิจกรรมได้เริ่มขึ้นแล้ว ท่านไปไม่ทันเวลา หรือท่านไม่ได้รับเชิญ#!"
