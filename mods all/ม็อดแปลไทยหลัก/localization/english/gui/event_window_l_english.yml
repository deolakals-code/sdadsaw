 # tooltip with Shift shortcut
 EVENT_TOOLTIP_SHORTCUT: "[EventOption.GetTooltip]$EVENT_SHORTCUT$"
 EVENT_SHORTCUT: "#bold;low $select_event$#!"
 # low looks better in event options, normal brightness attracts too much attention
 
 # if the option is enabled and not dangerous and we haven't disabled shortcuts
 # add two linebreaks to separate it from the main tooltip + shift + index
 
 select_event: "[AddTextIf(And(And(EventOption.IsValid, Not(EventOption.HasFlag('dangerous'))), Not(IsGameSettingOptionSelected('show_event_shortcuts', 'nowhere'))), Concatenate('\n\n', Localize(Concatenate('event_option_', IntToString(Add_int32(PdxGuiWidget.GetIndexInDataModel, '(int32)1'))))))]"
  
 # EVENT_SHORTCUT_NO_BREAK: "#bold;low $select_event_no_break$#!"
 event_option_1: "$shift_key_plus$1"
 event_option_2: "$shift_key_plus$2"
 event_option_3: "$shift_key_plus$3"
 event_option_4: "$shift_key_plus$4"
 event_option_5: "$shift_key_plus$5"
 event_option_6: "$shift_key_plus$6"
 event_option_7: "$shift_key_plus$7"
 event_option_8: "$shift_key_plus$8"
 event_option_9: "$shift_key_plus$9"
 event_option_10: "$shift_key_plus$0"
 event_option_11: "$shift_key_plus$-"
 event_option_12: "$shift_key_plus$="
 event_option_13: "$shift_key_plus$BACKSPACE"
 event_option_14: ""
 
 
 # Alt+number to preview or select an option
 CONFIRM_EVENT_OPTION: "#bold;low $preview_event$#!"
