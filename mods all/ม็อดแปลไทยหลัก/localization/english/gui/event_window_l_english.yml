 # shift+ without two linebreaks in front
 select_event_no_break: "[AddTextIf(And(EventOption.IsValid, Not(EventOption.HasFlag('dangerous'))), Concatenate(Localize('shift_key_plus'), IntToString(Add_int32(PdxGuiWidget.GetIndexInDataModel, '(int32)1'))))]"
