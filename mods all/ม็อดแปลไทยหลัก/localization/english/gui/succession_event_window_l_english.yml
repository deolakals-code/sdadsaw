 #Death Intro messages:
 SUCCESSION_EVENT_WINDOW_DEAD_INTRO_DEFAULT_1:0 "[ROOT.Char.GetFullNameNoTooltip] ได้สิ้นลมหายใจเมื่ออายุได้ [ROOT.Char.GetAge] ปี"
 SUCCESSION_EVENT_WINDOW_DEAD_INTRO_DEFAULT_2:0 "[ROOT.Char.GetFullNameNoTooltip] ได้ละทิ้งสังขารของ [ROOT.Char.GetHerHis] ไปเมื่ออายุ [ROOT.Char.GetAge] ปี"
 SUCCESSION_EVENT_WINDOW_DEAD_INTRO_DEFAULT_3:0 "[ROOT.Char.GetFullNameNoTooltip] ได้ถึงแก่กรรมเมื่ออายุได้ [ROOT.Char.GetAge] ปี"
 SUCCESSION_EVENT_WINDOW_DEAD_INTRO_DEFAULT_4:0 "[ROOT.Char.GetFullNameNoTooltip] ได้จากโลกนี้ไปเมื่ออายุได้ [ROOT.Char.GetAge] ปี"
 SUCCESSION_EVENT_WINDOW_DEAD_INTRO_DEFAULT_5:0 "[ROOT.Char.GetFullNameNoTooltip] ได้ถึงแก่กรรมเมื่ออายุได้ [ROOT.Char.GetAge] ปี และ [ROOT.Char.Custom('GetAfterLifeDestination')]"
 SUCCESSION_EVENT_WINDOW_DEAD_INTRO_PIOUS:1 "ดวงวิญญาณของ [ROOT.Char.GetFullNamePossessiveNoTooltip] ได้โบยบินสู่ [ROOT.Char.GetFaith.PositiveAfterLife] เมื่ออายุได้ [ROOT.Char.GetAge] ปี"
 SUCCESSION_EVENT_WINDOW_DEAD_INTRO_WICKED:1 "ในที่สุด ดวงวิญญาณของ [ROOT.Char.GetFullNamePossessiveNoTooltip] ก็ถูกส่งไปยัง [ROOT.Char.GetFaith.NegativeAfterLife] เมื่ออายุได้ [ROOT.Char.GetAge] ปี"
 SUCCESSION_EVENT_WINDOW_DEAD_INTRO_WOUNDED:0 "[ROOT.Char.GetFullNameNoTooltip] ได้พบความสงบในที่สุดเมื่ออายุได้ [ROOT.Char.GetAge] ปี"
 SUCCESSION_EVENT_WINDOW_DEAD_INTRO_CHRISTIANITY_1:0 "[ROOT.Char.GetFullNameNoTooltip] ได้พบความสงบในอ้อมกอดของพระคริสต์เมื่ออายุได้ [ROOT.Char.GetAge] ปี"
 SUCCESSION_EVENT_WINDOW_DEAD_INTRO_CHRISTIANITY_2:0 "[ROOT.Char.GetFullNameNoTooltip] พักผ่อนในอ้อมแขนของพระเจ้าเมื่ออายุได้ [ROOT.Char.GetAge] ปี"
 SUCCESSION_EVENT_WINDOW_DEAD_INTRO_ISLAM_1:0 "[ROOT.Char.GetFullNameNoTooltip] ได้จากบ้านชั่วคราวไปตามเสียงเรียกของพระผู้เป็นเจ้าที่แท้จริงเมื่ออายุได้ [ROOT.Char.GetAge] ปี"
 SUCCESSION_EVENT_WINDOW_DEAD_INTRO_ISLAM_2:0 "[ROOT.Char.GetFullNameNoTooltip] ได้ละทิ้งโลกอันไม่จีรังนี้ และโบยบินสู่ [ROOT.Char.GetFaith.PositiveAfterLife] ในวัย [ROOT.Char.GetAge] ปี"
 SUCCESSION_EVENT_WINDOW_DEAD_INTRO_ISLAM_3:0 "[ROOT.Char.GetFullNameNoTooltip] ได้ล่วงลับสู่นิรันดรเมื่ออายุได้ [ROOT.Char.GetAge] ปี"
 SUCCESSION_EVENT_WINDOW_DEAD_INTRO_NORSE_1:0 "[ROOT.Char.GetFullNameNoTooltip] ได้เข้าร่วมงานเลี้ยงใน [ROOT.Char.GetFaith.PositiveAfterLife] เมื่ออายุได้ [ROOT.Char.GetAge] ปี"
 SUCCESSION_EVENT_WINDOW_DEAD_INTRO_HELLENIC_1:0 "[ROOT.Char.GetFullNameNoTooltip] ได้ข้ามแม่น้ำสติกซ์เมื่ออายุได้ [ROOT.Char.GetAge] ปี"
 SUCCESSION_EVENT_WINDOW_DEAD_INTRO_EASTERN_1:0 "[ROOT.Char.GetFullNameNoTooltip] ได้ก้าวข้ามรูปกายวัตถุของ[ROOT.Char.GetHerHis]ไปเมื่ออายุได้ [ROOT.Char.GetAge] ปี"
 SUCCESSION_EVENT_WINDOW_DEAD_INTRO_TRIBAL_1:0 "[ROOT.Char.GetFullNameNoTooltip] ได้ข้ามประตูสู่โลกแห่งวิญญาณเมื่ออายุได้ [ROOT.Char.GetAge] ปี"

#Death Reason message:
 SUCCESSION_EVENT_WINDOW_DEAD_REASON_1:0 "[ROOT.Char.GetSheHe|U] [ROOT.Char.GetDeathReason]"

#Death Outro messages:
 SUCCESSION_EVENT_WINDOW_DEAD_OUTRO_AGE_CHILD:0 "ด้วยชีวิตที่แสนสั้นของ[ROOT.Char.GetHerHis] จึงยากที่จะกล่าวได้ว่า [ROOT.Char.GetSheHe] จะเติบโตเป็นผู้ปกครองแบบใด"
 SUCCESSION_EVENT_WINDOW_DEAD_OUTRO_AGE_OLD:0 "[ROOT.Char.GetWomanMan]ชราผู้นี้ [ROOT.Char.GetSheHe] มีชีวิตที่ยืนยาวและสมบูรณ์"
 SUCCESSION_EVENT_WINDOW_DEAD_OUTRO_AGE_IMMORTAL:0 "แม้เคยถูกคิดว่าเป็นอมตะ [ROOT.Char.GetSheHe] ก็ ทำให้หลายคนประหลาดใจด้วยการจากไปอย่างไม่คาดฝันของ[ROOT.Char.GetHerHis]"
 SUCCESSION_EVENT_WINDOW_DEAD_OUTRO_AGE_PREGNANT:0 "สิ้นใจก่อนให้กำเนิดทารกของ[ROOT.Char.GetHerHis] [ROOT.Char.GetSheHe] จะไม่เดินเดียวดายในดินแดนหลังความตาย"
 SUCCESSION_EVENT_WINDOW_DEAD_OUTRO_BODY_LEPER:0 "ร่างกายที่เน่าเปื่อยของ[ROOT.Char.GetHerHis|U]ได้ยอมจำนนต่อโรคเรื้อนในที่สุด"
 SUCCESSION_EVENT_WINDOW_DEAD_OUTRO_BODY_DISFIGURED:0 "ด้วยใบหน้าที่เสียโฉมอย่างน่าสยดสยอง [ROOT.Char.GetSheHe] ใช้ชีวิตช่วงปีสุดท้ายโดยไม่สามารถแสดงใบหน้าของ[ROOT.Char.GetHerHis]ในที่สาธารณะได้"
 SUCCESSION_EVENT_WINDOW_DEAD_OUTRO_BODY_MANGLED: "ร่างกายแหลกเหลวในอุบัติเหตุอันน่าสยดสยอง [ROOT.Char.GetSheHe] ใช้ชีวิตช่วงปีสุดท้ายของ[ROOT.Char.GetHerHis]แทบเดินไม่ได้"
 SUCCESSION_EVENT_WINDOW_DEAD_OUTRO_BODY_HUNCHBACK:0 "เกิดมาภายใต้สถานการณ์อันโชคร้าย [ROOT.Char.GetSheHe] มักถูกเยาะเย้ย เพราะหลังค่อมของ[ROOT.Char.GetHerHis]"
 SUCCESSION_EVENT_WINDOW_DEAD_OUTRO_BODY_GIANT:0 "เกิดมาภายใต้สถานการณ์อันโชคร้าย [ROOT.Char.GetSheHe] มักถูกเยาะเย้ย เพราะสัดส่วนที่ใหญ่โตของ[ROOT.Char.GetHerHis]"
 SUCCESSION_EVENT_WINDOW_DEAD_OUTRO_BODY_DWARF:0 "เกิดมาภายใต้สถานการณ์อันโชคร้าย [ROOT.Char.GetSheHe] มักถูกเยาะเย้ย เพราะรูปร่างที่เล็กจ้อยของ[ROOT.Char.GetHerHis]"
 SUCCESSION_EVENT_WINDOW_DEAD_OUTRO_BODY_STRONG:0 "[ROOT.Char.GetWomanMan|U]ผู้มีพละกำลังหาที่เปรียบมิได้ ในที่สุด [ROOT.Char.GetSheHe] ก็ได้พบกับคู่ต่อสู้ที่[ROOT.Char.GetSheHe]ไม่สามารถเอาชนะได้"
 SUCCESSION_EVENT_WINDOW_DEAD_OUTRO_BODY_PRETTY_YOUNG:0 "สิ้นใจในวัยอันเปล่งปลั่ง [ROOT.Char.GetSheHe] จะเป็นที่จดจำตลอดไปในความงามอันน่าทึ่งของ[ROOT.Char.GetHerHis]"
 SUCCESSION_EVENT_WINDOW_DEAD_OUTRO_BODY_PRETTY_OLD:0 "ครั้งหนึ่งเคยโด่งดังในเรื่องรูปลักษณ์ของ[ROOT.Char.GetHerHis] โชคชะตากลับสาปแช่ง[ROOT.Char.GetHerHim]ด้วยชีวิตที่ยืนยาวพอที่จะได้เห็นความงามของ[ROOT.Char.GetHerHis]ค่อยๆ ร่วงโรยไป"
 SUCCESSION_EVENT_WINDOW_DEAD_OUTRO_BODY_WEAK: "เป็น [ROOT.Char.GetWomanMan] ที่มีร่างกายอ่อนแอ [ROOT.Char.GetSheHe] มักถูกเยาะเย้ยโดยคนรอบข้างของ[ROOT.Char.GetHerHis]"
 SUCCESSION_EVENT_WINDOW_DEAD_OUTRO_BODY_UGLY:1 "มีชื่อเสียงในด้านความอัปลักษณ์ของ[ROOT.Char.GetHerHis] มีข่าวลือว่าเพียงแค่เหลือบมอง[ROOT.Char.GetHerHim]ก็สามารถฝันร้ายไปหลายวัน"
 SUCCESSION_EVENT_WINDOW_DEAD_OUTRO_BODY_INCAPABLE:0 "เหลือเพียงเปลือกกลวงของตัวตนเดิม ไม่สามารถพูดหรือเคลื่อนไหวได้ ในที่สุด [ROOT.Char.GetSheHe] ก็ได้ละทิ้งซากร่างกายที่แตกสลายของ[ROOT.Char.GetHerHis]ไป"
 SUCCESSION_EVENT_WINDOW_DEAD_OUTRO_MIND_LUNATIC:0 "ถูกสาปด้วยจิตใจที่ไม่ปกติ [ROOT.Char.GetSheHe] เป็นที่รู้จักไปทั่วดินแดนของ[ROOT.Char.GetHerHis]ในฐานะคนบ้าคลั่ง"
 SUCCESSION_EVENT_WINDOW_DEAD_OUTRO_MIND_POSSESSED_POSITIVE:0 "หลังจากตรัสผ่าน[ROOT.Char.GetHerHim]มาหลายปี ในที่สุด [ROOT.Char.GetFaith.HighGodName] ก็ได้เรียก[ROOT.Char.GetHerHim]กลับบ้าน"
 SUCCESSION_EVENT_WINDOW_DEAD_OUTRO_MIND_POSSESSED_NEGATIVE:0 "ถูกปีศาจรบกวน [ROOT.Char.GetSheHe] มักเพ้อถึงหายนะที่ใกล้เข้ามาของ[ROOT.Char.GetHerHis]"
 SUCCESSION_EVENT_WINDOW_DEAD_OUTRO_MIND_DEPRESSED:1 "[ROOT.Char.GetWomanMan]ผู้ทุกข์ทรมาน [ROOT.Char.GetSheHe] ปรารถนาอ้อมกอดอันแสนหวานของความตายมานานแล้ว"
 SUCCESSION_EVENT_WINDOW_DEAD_OUTRO_MIND_GENIUS:0 "แม้จะมีชื่อเสียงในด้านสติปัญญาอันเฉียบแหลมของ[ROOT.Char.GetHerHis] [ROOT.Char.GetSheHe] ก็ยังไม่สามารถเอาชนะ [ROOT.Char.GetFaith.DeathDeityName] ได้"
 SUCCESSION_EVENT_WINDOW_DEAD_OUTRO_MIND_DUMB:0 "เป็นที่รู้กันว่ามีสติปัญญาอ่อนด้อย [ROOT.Char.GetSheHe] มักต้องพึ่งพาสภาของ[ROOT.Char.GetHerHis]ในการตัดสินใจเรื่องสำคัญ"
 SUCCESSION_EVENT_WINDOW_DEAD_OUTRO_MIND_INFIRM:0 "เหลือเพียงเปลือกกลวงของตัวตนเดิม [ROOT.Char.GetSheHe] ได้สูญเสียสติปัญญาไปนานแล้วก่อนการจากไปครั้งสุดท้ายของ[ROOT.Char.GetHerHis]"
 SUCCESSION_EVENT_WINDOW_DEAD_OUTRO_SCANDAL_EXCOMMUNICATED:0 "ถูกศาสนจักรตราหน้าว่าเป็นพวกนอกรีต [ROOT.Char.GetSheHe] จะต้องทนทุกข์ทรมานจากบาปของ[ROOT.Char.GetHerHis]อย่างแน่นอน"
 SUCCESSION_EVENT_WINDOW_DEAD_OUTRO_SCANDAL_KINSLAYER:0 "เป็นที่รู้กันว่ามือของ[ROOT.Char.GetHerHis]เปื้อนเลือดของญาติพี่น้องของ[ROOT.Char.GetHerHis]เอง [ROOT.Char.GetSheHe] กำลังชดใช้กรรมอันน่าสะพรึงกลัวของ[ROOT.Char.GetHerHis]ใน [ROOT.Char.GetFaith.NegativeAfterLife] อย่างแน่นอน"
 SUCCESSION_EVENT_WINDOW_DEAD_OUTRO_SCANDAL_DEVIANT:0 "[ROOT.Char.GetWomanMan]ผู้เสื่อมทราม มีรสนิยมอันน่ารังเกียจ [ROOT.Char.GetSheHe] จะไม่พบความปลอบโยนหรือความสนุกสนานในที่ที่[ROOT.Char.GetSheHe]กำลังไปอย่างแน่นอน"
 SUCCESSION_EVENT_WINDOW_DEAD_OUTRO_SCANDAL_CANNIBAL:0 "มีข่าวลือว่าบริโภคเนื้อมนุษย์เพื่อยังชีพ [ROOT.Char.GetSheHe] กำลังถูกลงโทษสำหรับความชั่วร้ายในชีวิตของ[ROOT.Char.GetHerHis]อย่างไม่ต้องสงสัย"
 SUCCESSION_EVENT_WINDOW_DEAD_OUTRO_SCANDAL_SODOMITE:1 "นักรักร่วมเพศผู้มีชื่อเสียง บัดนี้ [ROOT.Char.GetSheHe] อยู่ในความดูแลอันอ่อนโยนของ [ROOT.Char.GetFaith.DevilName] [ROOT.Char.GetFaith.DevilHerselfHimself]"
 SUCCESSION_EVENT_WINDOW_DEAD_OUTRO_SCANDAL_INCESTUOUS:0 "สำหรับการลิ้มรสผลไม้ต้องห้ามแห่งรักร่วมสายเลือด [ROOT.Char.GetSheHe] จะต้องทนทุกข์ทรมานในชีวิตหน้าอย่างแน่นอน"
 SUCCESSION_EVENT_WINDOW_DEAD_OUTRO_SCANDAL_ADULTERER:0 "ผู้คบชู้อย่างไร้ยางอาย [ROOT.Char.GetSheHe] จะเป็นที่จดจำในเรื่องการทรยศและนิสัยโลภมากของ[ROOT.Char.GetHerHis]"
 SUCCESSION_EVENT_WINDOW_DEAD_OUTRO_SCANDAL_FORNICATOR:0 "ผู้ผิดประเวณีอย่างหน้าไม่อาย [ROOT.Char.GetSheHe] จะเป็นที่จดจำในเรื่องตัณหาที่ควบคุมไม่ได้และร้ายกาจของ[ROOT.Char.GetHerHis]"
 SUCCESSION_EVENT_WINDOW_DEAD_OUTRO_SCANDAL_MURDERER:0 "ฆาตกรที่เป็นที่รู้จัก [ROOT.Char.GetSheHe] จะชดใช้อาชญากรรมอันเลวร้ายของ[ROOT.Char.GetHerHis]ในชีวิตหน้า"
 SUCCESSION_EVENT_WINDOW_DEAD_OUTRO_SCANDAL_WITCH:0 "เป็นที่รู้กันว่าผสมสมุนไพรวิเศษและคบค้ากับ [ROOT.Char.GetFaith.DevilName] [ROOT.Char.GetSheHe] จะต้องถูกเผาไหม้ในชีวิตหลังความตายสำหรับบาปของ[ROOT.Char.GetHerHis]อย่างแน่นอน"
 SUCCESSION_EVENT_WINDOW_DEAD_OUTRO_ACCOMPLISHMENT_SAOSHYANT:0 "ผู้ฟื้นฟูอันศักดิ์สิทธิ์แห่งจักรวรรดิเปอร์เซีย การขึ้นสู่ความรุ่งโรจน์ของ[ROOT.Char.GetHerHis]จะถูกจารึกไว้ในคำเทศนาของ [ROOT.Char.GetFaith.PriestMalePlural] ทั้งปวง แน่นอนว่า บัดนี้ [ROOT.Char.GetSheHe] นั่งอยู่เคียงข้าง [ROOT.Char.GetFaith.HighGodName]"
 SUCCESSION_EVENT_WINDOW_DEAD_OUTRO_ACCOMPLISHMENT_RESTORER_ROME:0 "ด้วยการฟื้นฟูอำนาจโบราณของจักรวรรดิ [ROOT.Char.GetSheHe] ได้ ทำให้แน่ใจว่าชื่อของ[ROOT.Char.GetHerHis]จะคงอยู่ด้วยความรุ่งโรจน์ไปจนสิ้นกาลเวลา"
 SUCCESSION_EVENT_WINDOW_DEAD_OUTRO_ACCOMPLISHMENT_CRUSADER:0 "[ROOT.Char.GetWomanMan] ผู้เคร่งศาสนา [ROOT.Char.GetSheHe] ได้ต่อสู้เพื่อเกียรติภูมิแห่ง [ROOT.Char.GetFaith.HighGodName] ต่อกรกับเหล่า [ROOT.Char.Custom('GetDerogatoryNonbelieverPlural')] ในหนึ่งในมหาสงครามศักดิ์สิทธิ์อันยิ่งใหญ่ที่สุดแห่งประวัติศาสตร์ยุคหลัง"
 SUCCESSION_EVENT_WINDOW_DEAD_OUTRO_LIFESTYLE_DIPLOMAT:0 "นักการทูตผู้ช่ำชอง ไม่มีข้อโต้แย้งใดที่[ROOT.Char.GetSheHe]ไม่สามารถแก้ไขได้อย่างสันติ"
 SUCCESSION_EVENT_WINDOW_DEAD_OUTRO_LIFESTYLE_REVELER:0 "[ROOT.Char.GetWomanMan]ผู้มีเสน่ห์ [ROOT.Char.GetSheHe] มีชื่อเสียงในด้านงานเลี้ยงที่ประณีตและงานเต้นรำที่ยิ่งใหญ่ของ[ROOT.Char.GetHerHis]"
 SUCCESSION_EVENT_WINDOW_DEAD_OUTRO_LIFESTYLE_BLADEMASTER:0 "หนึ่งในนักสู้ที่เก่งที่สุดในยุคของ[ROOT.Char.GetHerHis] [ROOT.Char.GetSheHe] ไม่มีใครเทียบได้ในการต่อสู้ประชิดตัว"
 SUCCESSION_EVENT_WINDOW_DEAD_OUTRO_LIFESTYLE_HUNTER:0 "นักล่าผู้กระตือรือร้นและทุ่มเท [ROOT.Char.GetSheHe] ชอบใช้เวลาทั้งสัปดาห์ในถิ่นทุรกันดาร เพื่อมองหาสัตว์ป่าที่หายากที่สุด"
 SUCCESSION_EVENT_WINDOW_DEAD_OUTRO_LIFESTYLE_GENERAL:0 "เป็นที่รู้จักในฐานะนักยุทธศาสตร์ที่ยอดเยี่ยม [ROOT.Char.GetSheHe] ใช้เวลาหลายวันในการตรวจสอบสนามรบและฝึกฝนกองทหารของ[ROOT.Char.GetHerHis]"
 SUCCESSION_EVENT_WINDOW_DEAD_OUTRO_LIFESTYLE_ADMINISTRATOR:1 "เป็น [ROOT.Char.GetWomanMan] ที่มีสติสัมปชัญญะ [ROOT.Char.GetSheHe] มีชื่อเสียงในด้านทักษะอันยอดเยี่ยมของ[ROOT.Char.GetHerHis]ในฐานะผู้ดูแลและผู้ปกครอง""
