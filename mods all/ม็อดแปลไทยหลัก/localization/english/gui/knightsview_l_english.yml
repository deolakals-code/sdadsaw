 # this is can_be_knight_trigger in 00_war_and_peace_triggers.txt
 KNIGHT_RESTRICTIONS_TT: "#T ข้อจำกัดของอัศวิน#!\nเฉพาะ [vassals|e], [courtiers|e] หรือ [followers|e] ทางตรงของท่านเท่านั้นที่สามารถรับใช้ในฐานะ [knights|e] ได้\n[culture|e] หรือ [faith|e] ของท่านจะเป็นตัวกำหนดเพศที่สามารถปฏิบัติหน้าที่เป็น [knights|e] ได้\n\nอัศวินไม่สามารถเป็น:\n - ผู้เล่น, [child|e], [prisoner|e] หรือ [GetTrait('incapable').GetName(GetPlayer.Self)]\n - สมาชิก [clergy|e] (เว้นแต่ [faith|e] หรือ [culture|e] จะอนุญาต)\n - [master_assassin|e] หรือ [GetTrait('blind').GetName(GetPlayer.Self)] (เว้นแต่ [culture|e] จะอนุญาต หรือพวกเขาเป็น [GetTrait('order_member').GetName(GetPlayer.Self)])\n - [diarch|e] หรือ [ceremonial_liege|e]\n - [governor|e] แห่ง [duchy|e] (หรือ [title|e] ที่สูงกว่า) หรือ [house_head|e] แห่ง [noble_family|e]\n\n[traditions|e] ทางวัฒนธรรมและเหตุการณ์บางอย่างอาจช่วยยกเลิกข้อจำกัดบางประการได้"
 
 KP_CULTURE_MINIMUM_PROWESS: "@alert_icon! [culture|e] ของท่านต้องการ [prowess|e] อย่างน้อย 12"
 KP_CULTURE_ADMIN_FAMILY_KNIGHTS: "@check_icon! [culture|e] ของท่านยกเลิกข้อจำกัดทางเพศบางประการสำหรับ [wars|e] เชิงรับ"
 KP_CULTURE_HIGH_PROWESS: "@check_icon! [culture|e] ของท่านยกเลิกข้อจำกัดส่วนใหญ่สำหรับ [knights|e] ที่มี [prowess|e] อย่างน้อย 10"
