 KNIGHTS_VIEW_TITLE_FORBID_TT:2 "#T ห้าม [Character.GetShortUIName] จากการเป็น $knight_culture_player$#!\n\n[Character.GetShortUIName] #emphasis ห้าม#! เข้าร่วม [armies|E] ของท่านในฐานะ $knight_culture_player_no_tooltip$ โดยเด็ดขาด สิ่งนี้ช่วยให้ [Character.GetHerHim] ปลอดภัยจากการเสียชีวิตใน [battle|E]"
 CREATE_ACCOLADE_FORBID_TT: "#T ห้ามมิให้ [CreateAccoladeView.GetSelectedKnight.GetShortUIName] เป็น $knight_culture_player$#!\n\n[CreateAccoladeView.GetSelectedKnight.GetShortUIName] จะไม่สามารถเข้าร่วม [armies|E] ของท่านในฐานะ $knight_culture_player_no_tooltip$ ได้ #emphasis เป็นอันขาด#! วิธีนี้จะช่วยปกป้อง[CreateAccoladeView.GetSelectedKnight.GetHerHim]ให้รอดพ้นจากความตายใน [battle|E]"
 KNIGHTS_VIEW_TITLE_BY_PROWESS_TT:2 "#T อนุญาตให้ [Character.GetShortUIName] เป็น $knight_culture_player$#!\n\n[Character.GetShortUIName] อาจเข้าร่วม [armies|E] ของท่านในฐานะ $knight_culture_player_no_tooltip$ หาก [prowess|E] ของ [Character.GetHerHis] เป็นหนึ่งในผู้ที่สูงที่สุดใน [realm|E]"
 CREATE_ACCOLADE_BY_PROWESS_TT:2 "#T อนุญาตให้ [CreateAccoladeView.GetSelectedKnight.GetShortUIName] เป็น $knight_culture_player$#!\n\n[CreateAccoladeView.GetSelectedKnight.GetShortUIName] อาจเข้าร่วม [armies|E] ของท่านในฐานะ $knight_culture_player_no_tooltip$ หาก [prowess|E] ของ[CreateAccoladeView.GetSelectedKnight.GetHerHis] เป็นหนึ่งในผู้ที่สูงที่สุดใน [realm|E]"
 KNIGHTS_VIEW_TITLE_FORCE_TT:2 "#T บังคับให้ [Character.GetShortUIName] เป็น $knight_culture_player$#!\n\n[Character.GetShortUIName] #emphasis ต้อง#! เข้าร่วม [armies|E] ของท่านในฐานะ $knight_culture_player_no_tooltip$ โดยไม่คำนึงถึง [prowess|E] ของ [Character.GetHerHis] [Character.GetSheHe|U] อาจเข้ามาแทนที่ $knight_culture_player_no_tooltip$ ที่มีความสามารถในการรบสูงกว่า"
 CREATE_ACCOLADE_FORCE_TT: "#T บังคับให้ [CreateAccoladeView.GetSelectedKnight.GetShortUIName] เป็น $knight_culture_player$#!\n\n[CreateAccoladeView.GetSelectedKnight.GetShortUIName] #emphasis จะต้อง#! เข้าร่วม [armies|E] ของท่านในฐานะ $knight_culture_player_no_tooltip$ ไม่ว่า[CreateAccoladeView.GetSelectedKnight.GetHerHis]จะมี [prowess|E] เท่าใดก็ตาม [CreateAccoladeView.GetSelectedKnight.GetSheHe|U] อาจเข้าแทนที่ตำแหน่งของ $knight_culture_player_no_tooltip$ ที่มีทักษะความสามารถในการต่อสู้สูงกว่า"
