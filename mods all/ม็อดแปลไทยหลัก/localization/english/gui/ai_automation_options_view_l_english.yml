l_english: 
 ARMY_AUTOMATION_FEATURE_NAME: "กองทัพอัตโนมัติ"
 AOV_HEADING: "การตั้งค่า $ARMY_AUTOMATION_FEATURE_NAME$"
 AOV_APPLY: "$BARBERSHOP_APPLY$"
 AOV_SET_TO_DEFAULT: "$CHARACTER_RESET_FILTERS$"
 AOV_SET_TO_DEFAULT_TT: "[AddLocalizationIf( ArmyAutomationOptionsView.AreDisplayedSettingsDefault, 'AOV_SET_TO_DEFAULT_TT_CONTENT' )]"
 AOV_SET_TO_DEFAULT_TT_CONTENT: "@warning_icon! #X การตั้งค่าเป็นค่าเริ่มต้นอยู่แล้ว#!"
 AOV_COMPANION_OFF_WARNING: "@alert_icon! การตั้งค่าเหล่านี้ไม่มีผลขณะที่ $ARMY_AUTOMATION_FEATURE_NAME$ ถูกปิดใช้งาน"
 AOV_AUTOMATED: "อัตโนมัติ"
 AOV_MANUAL: "ควบคุมด้วยตนเอง"
 AOV_OPT_COMMANDERS: "แต่งตั้งแม่ทัพ"
 AOV_OPT_COMMANDERS_NOT_PLAYERS: "จำกัด"
 AOV_OPT_COMMANDERS_NOT_PLAYERS_TT: "#T การแต่งตั้ง $game_concept_commander$ แบบจำกัด\n#![commanders|E] จะถูก แต่งตั้งให้กับ [armies|E] ของท่านโดยอัตโนมัติ แต่ท่านจะไม่ถูก แต่งตั้งเป็น $game_concept_commander$ เลย"
 AOV_OPT_COMMANDERS_AUTOMATED_TT: "#T การแต่งตั้ง $game_concept_commander$ อัตโนมัติ\n#![commanders|E] จะถูก แต่งตั้งให้กับ [armies|E] ของท่านโดยอัตโนมัติ"
 AOV_OPT_COMMANDERS_MANUAL_TT: "#T การแต่งตั้ง $game_concept_commander$ ด้วยตนเอง\n#!ท่านต้อง แต่งตั้ง [commanders|E] ให้กับ [armies|E] ของท่านด้วยตนเอง"
 AOV_OPT_WAR_STANCE: "ท่าทีสงคราม"
 AOV_OPT_WAR_STANCE_DEFAULT: "ปรับตามสถานการณ์"
 AOV_OPT_WAR_STANCE_DEFAULT_TT: "#T ท่าทีปรับตามสถานการณ์\n#![armies|E] ของท่านจะปฏิบัติการเชิงรุกหรือเชิงรับขึ้นอยู่กับสถานการณ์"
 AOV_OPT_WAR_STANCE_OFFENSIVE: "เชิงรุก"
 AOV_OPT_WAR_STANCE_OFFENSIVE_TT: "#T ท่าทีเชิงรุก\n#![armies|E] ของท่านจะปฏิบัติการเชิงรุกเสมอ"
 AOV_OPT_WAR_STANCE_DEFENSIVE: "เชิงรับ"
 AOV_OPT_WAR_STANCE_DEFENSIVE_TT: "#T ท่าทีเชิงรับ\n#![armies|E] ของท่านจะปฏิบัติการเชิงรับเสมอ"
 AOV_OPT_RAIDING: "การปล้นสะดม"
 AOV_OPT_RAIDING_AUTOMATED_TT: "#T การปล้นสะดมอัตโนมัติ\n#![armies|E] [raider|E] ของท่านจะระดมพลและออก $game_concept_raids$ ด้วยตนเอง"
 AOV_OPT_RAIDING_MANUAL_TT: "#T การต่อรองแลกเปลี่ยนด้วยตนเอง\n#!ท่านควบคุมและระดมพล [armies|E] [barterer|E] ของท่านเอง"
 AOV_OPT_BARTERING: "การต่อรองแลกเปลี่ยน"
 AOV_OPT_BARTERING_AUTOMATED_TT: "#T การต่อรองแลกเปลี่ยนอัตโนมัติ\n#! [armies|E] [barterer|E] ของท่านจะระดมพลและออกปฏิบัติภารกิจ $game_concept_barter$ ด้วยตนเอง"
 AOV_OPT_BARTERING_MANUAL_TT: "#T การต่อรองแลกเปลี่ยนด้วยตนเอง\n#!ท่านควบคุมและระดมพล [armies|E] [barterer|E] ของท่านเอง"
 AOV_OPT_HIRING: "การจ้างกองกำลัง"
 AOV_OPT_HIRING_FULL: "จ้างและขยายเวลา"
 AOV_OPT_HIRING_FULL_TT: "#T การจ้างอัตโนมัติ\n#!จะมีการจ่ายเงินสำหรับ [mercenaries|E], [holy_orders|E] และ [provincial_armies|E] โดยอัตโนมัติ และ [mercenary_contracts|E] จะถูกขยายเวลาหากจำเป็นสำหรับความพยายามในสงคราม"
 AOV_OPT_HIRING_EXTEND: "ขยายเวลาเท่านั้น"
 AOV_OPT_HIRING_EXTEND_TT: "#T การขยายเวลาสัญญาทหารรับจ้างอัตโนมัติ\n#![mercenary_contracts|E] จะถูกขยายเวลาหากจำเป็นสำหรับความพยายามในสงคราม"
 AOV_OPT_HIRING_MANUAL_TT: "#T การจ้างด้วยตนเอง\n#!ท่านต้องจ่ายเงินสำหรับ [mercenaries|E], [holy_orders|E] และ [provincial_armies|E] ด้วยตนเอง"

 MV_AUTOMATION_TOGGLE_TT: "[SelectLocalization( GetPlayer.HasCompanionAI, 'MV_AUTOMATION_TOGGLE_TT_ON', 'MV_AUTOMATION_TOGGLE_TT_OFF' )]"
 MV_AUTOMATION_TOGGLE_TT_ON: "#T $ARMY_AUTOMATION_FEATURE_NAME$: #V เปิดใช้งาน#!\n#!$MV_AUTOMATION_TOGGLE_TT_DESC$\n\n#I คลิกเพื่อปิดใช้งานระบบอัตโนมัติ#!"
 MV_AUTOMATION_TOGGLE_TT_OFF: "#T $ARMY_AUTOMATION_FEATURE_NAME$: #V ปิดใช้งาน#!\n#!$MV_AUTOMATION_TOGGLE_TT_DESC$\n\n#I คลิกเพื่อเปิดใช้งานระบบอัตโนมัติ#!"
 MV_AUTOMATION_TOGGLE_TT_DESC: "[SelectLocalization(GetPlayer.HasDefaultCompanionAISettings, 'MV_AUTOMATION_TOGGLE_TT_DEFAULT_DESC' , 'MV_AUTOMATION_TOGGLE_TT_CUSTOM_DESC')]"
 MV_AUTOMATION_TOGGLE_TT_DEFAULT_DESC: "หากเปิดใช้งาน [armies|E] ของท่านจะถูกระดมพลและต่อสู้กับศัตรูด้วยตนเอง และ แต่งตั้ง [commanders|E] ของตนเอง\n\nท่านยังคงรับผิดชอบในการซื้อ [men_at_arms|E] จ้าง [mercenaries|E] และออก [raids|E]\n\n#help หมายเหตุ: กองทัพอัตโนมัติมีไว้สำหรับผู้เล่นที่ไม่คุ้นเคยกับการทำสงคราม หรือต้องการมุ่งความสนใจไปที่อื่น หากท่านเป็นผู้เล่นที่มีประสบการณ์ เราขอแนะนำให้ท่านควบคุมกองทัพของท่านด้วยตนเอง#!"
 MV_AUTOMATION_TOGGLE_TT_CUSTOM_DESC: "หากเปิดใช้งาน [armies|E] ของท่านจะปฏิบัติการด้วยตนเอง แต่ถูกจำกัดโดยการตั้งค่าที่ท่านเลือกไว้"

 MV_AUTOMATION_SETTINGS_TT: "#T เปิด $AOV_HEADING$\n#!เปลี่ยนพฤติกรรมเริ่มต้นสำหรับ $ARMY_AUTOMATION_FEATURE_NAME$"
