 RP_MAA_ENTRY:0 "[men_at_arms|E]: [ArmyComposition.GetMaxNumberOfMAA|V]"
 RP_TIME_TO_RAISE:0 "เวลาในการระดมพล: $VALUE|V$"
 RP_TIME_TO_RAISE_DELAY:1 "เวลาในการระดมพล รวมถึงความล่าช้า $VALUE$ เนื่องจากการกลับบ้านของ [soldiers|E] จากการยุบกองทัพล่าสุด"
 RP_RAISE_TOOLTIP_HEADER: "#T $RP_RAISE$#!"
 RP_RAISE_TOOLTIP_DESC: "ระดมพล [armies|E] ทั้งหมดที่อยู่ใกล้ [rally_point|E] นี้มากที่สุด\n#weak หากท่านมีจุดรวมพลเพียงจุดเดียว กองทัพทั้งหมดจะถูกระดมพลที่นี่#!"
 RP_RAISE_MEN_AT_ARMS_TOOLTIP_HEADER: "#T $RP_RAISE$#!"
 RP_RAISE_MEN_AT_ARMS_TOOLTIP_DESC: "ระดมพล [men_at_arms|E] ทั้งหมดที่นี่"
 RP_RAISE_RAID_TOOLTIP_HEADER: "#T $RP_RAISE_RAID$#!"
 RP_RAISE_RAID_TOOLTIP_DESC: "ระดมพล [armies|E] ทั้งหมดที่อยู่ใกล้ [rally_point|E] นี้มากที่สุดในฐานะ [raiders|E]\n#weak หากท่านมีจุดรวมพลเพียงจุดเดียว กองทัพทั้งหมดจะถูกระดมพลที่นี่#!"
 RP_RAISE_ALL_TOOLTIP_HEADER: "#T $RP_RAISE_ALL$#!"
 RP_RAISE_ALL_TOOLTIP_DESC: "ระดมพล #emphasis ทั้งหมด#! [armies|E] ของท่านที่นี่ โดยไม่คำนึงว่า [rally_point|E] ใดอยู่ใกล้ที่สุด"
 RP_MOVE_RALLY_POINT:1 "#T ย้ายจุดรวมพล\n#! #I หรือคลิกขวาบนแผนที่โดยตรง#!"
 RP_CANNOT_MOVE_RALLY_POINT: "#X ตัวละครไร้ที่ดินไม่สามารถย้าย [rally_point|E] ของตนได้#!"
 RP_RAISE_BLOCK_AT_WAR:0 "@warning_icon! #X ท่านไม่สามารถระดมพล [raiders|E] ได้ในขณะที่อยู่ใน [war|E]#!"

 RP_RAISE_BARTER: "ระดม Barterers ท้องถิ่น"
 RP_RAISE_BARTER_TOOLTIP: "#T ระดมกองทัพ Barterer#!\n[GetPlayer.GetStartBarterBlockers]\nกองทัพ [barter|E] ใช้ค่าบำรุงรักษา [GetDefine('NArmy', 'BARTER_ARMY_COST_MULT')|%P0] ของค่าบำรุงรักษากองทัพปกติ\nกองทัพ [barter|E] ไม่สามารถเสริมกำลังได้"
 RP_RAISE_BARTER_TOOLTIP_HEADER: "#T $RP_RAISE_BARTER$#!"
 RP_RAISE_BARTER_TOOLTIP_DESC: "ระดม [armies|E] ทั้งหมดที่อยู่ใกล้ [rally_point|E] แห่งนี้ที่สุดเป็น [barterers|E]\n#weak หากท่านมีจุดระดมพลเพียงแห่งเดียว กองทัพทั้งหมดจะถูกระดมที่นี่#!"
