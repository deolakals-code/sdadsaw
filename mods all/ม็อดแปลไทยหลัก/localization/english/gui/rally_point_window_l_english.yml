 RP_TOOLTIP_HEADER:0 "#T $NAME$#!"
 RP_RAISE_RAID_TOOLTIP:0 "#T ระดมพลกองทัพกองโจร#!\n[GetPlayer.GetStartRaidBlockers]\nกองทัพ [raid|E] มีค่าบำรุงรักษา [GetDefine('NArmy', 'RAID_ARMY_COST_MULT')|%P0] ของค่าใช้จ่ายกองทัพปกติ\nกองทัพปล้นสะดมไม่สามารถเสริมกำลังได้"
 RP_NO_RAISABLE_TROOPS_ASSIGNED:0 "#X ไม่มีทหารที่ยังไม่ได้ระดมพลได้รับมอบหมายให้มายัง [rally_point|E] นี้#!"
 RP_NO_RAISABLE_TROOPS_ALL:0 "#X ไม่มีทหารที่ยังไม่ได้ระดมพลพร้อมใช้งาน#!"
 RP_NO_RAISABLE_TROOPS_MEN_AT_ARMS:0 "#X ไม่มีทหารอาชีพที่ยังไม่ได้ระดมพลพร้อมใช้งาน#!"
 RP_LOCAL_LEVIES_LABEL:0 "[levies|E] ท้องถิ่น"
 RP_LOCAL_LEVIES_TOOLTIP:0 "#T [levies|E] ท้องถิ่น#!\nยังไม่ได้ระดมพล: [RallyPointWindow.GetUnraisedLocalLevies|V]\nมีชีวิต: [RallyPointWindow.GetAliveLocalLevies|V]\nทั้งหมด: [RallyPointWindow.GetTotalLocalLevies|V]"
 RP_ALL_SOLDIERS_LABEL:0 "[soldiers|E] ทั้งหมด"
 RP_KNIGHTS_ENTRY:1 "[knight_i]$knight_culture_player_plural$: [GetPlayer.GetKnightCount|V]"
