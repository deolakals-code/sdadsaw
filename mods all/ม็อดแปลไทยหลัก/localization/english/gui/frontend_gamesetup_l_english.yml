 GAMESETUP_TUTORIAL_PROMPT_HEADER:1 "ยินดีต้อนรับสู่ Crusader Kings III"
 GAMESETUP_TUTORIAL_PROMPT_INTRO:0 "Crusader Kings III เป็นเกมกลยุทธ์เชิงลึกเกี่ยวกับราชวงศ์และการวางอุบาย!"
 GAMESETUP_TUTORIAL_PROMPT_RECOMMEND:0 "หากท่านเป็นผู้เล่นใหม่ในโลกของ Crusader Kings เราขอแนะนำอย่างยิ่งให้ท่านเล่นบทช่วยสอน"
 GAMESETUP_TUTORIAL_PROMPT_ABOUT_RULER: "$GAMESETUP_TUTORIAL_PROMPT_ABOUT_RULER_EXTRA$"
 GAMESETUP_TUTORIAL_PROMPT_ABOUT_IRISH_CHARACTER: "ไอร์แลนด์ถูกแบ่งแยกท่ามกลางเหล่ากษัตริย์ย่อยและเจ้าผู้ครองนครศักดินามากมาย\n\nในฐานะ [BookmarkCharacter.GetName|V] แห่ง [BookmarkCharacter.GetTitleName] จงนำพาราชวงศ์ของท่าน รวบรวมดินแดน และขึ้นเป็นพระราชาแห่งไอร์แลนด์!"
 GAMESETUP_TUTORIAL_PROMPT_ABOUT_CHINESE_RULER: "ในระบบราชการจักรวรรดิจีน มีเพียงผู้มีความดีความชอบสูงสุดเท่านั้นที่จะถูกเลือกเป็นเจ้าเมือง\n\n[BookmarkCharacter.GetName|V] มีศักยภาพที่จะเป็นทั้งกวีและขุนนางผู้ปราดเปรื่อง บางทีวันหนึ่งลูกหลานของเขาอาจได้ปกครองทั่วทั้งแผ่นดินจีน?"
