 agent_supplier_desc: "#WEAK การเชื่อมต่อ จังหวะเวลา และความฉลาดหลักแหลมเป็นสิ่งจำเป็นเพื่อให้เป็นเลิศในการค้า การขนส่งผสมผสานทั้งสามอย่างเข้าด้วยกัน.#!\n$EFFECT_LIST_BULLET$ ลด [scheme_speed|E] [scheme_speed_i]\n$EFFECT_LIST_BULLET$ ต้องการ [stewardship_i] [stewardship|E] & [diplomacy_i] [diplomacy|E]\n$EFFECT_LIST_BULLET$ #P ได้รับประโยชน์#! จาก [traits|E] เช่น [GetTrait('avaricious').GetName( GetNullCharacter )] และ [GetTrait('overseer').GetName( GetNullCharacter )]\n$EFFECT_LIST_BULLET$ #N ได้รับผลเสีย#! จาก [traits|E] เช่น [GetTrait('shy').GetName( GetNullCharacter )] และ [GetTrait('stubborn').GetName( GetNullCharacter )]"

