 agent_planner_i: "[scheme_speed_i]"
 agent_planner_desc: "#WEAK ความสามารถในการสร้างแผนอย่างรอบคอบเป็นสิ่งหนึ่ง แต่ความแตกต่างระหว่างนักวางแผนที่ดีและผู้เชี่ยวชาญนั้นง่ายมาก: เมื่อสิ่งต่างๆ ผิดพลาด ผู้เชี่ยวชาญสามารถด้นสดได้.#!\n$EFFECT_LIST_BULLET$ ให้ [scheme_speed|E] [scheme_speed_i]\n$EFFECT_LIST_BULLET$ ต้องการ [learning_i] [learning|E] & [stewardship_i] [stewardship|E]\n$EFFECT_LIST_BULLET$ #P ได้รับประโยชน์#! จาก [traits|E] เช่น [GetTrait('architect').GetName( GetNullCharacter )] และ [GetTrait('paranoid').GetName( GetNullCharacter )]\n$EFFECT_LIST_BULLET$ #N ได้รับผลเสีย#! จาก [traits|E] เช่น [GetTrait('lazy').GetName( GetNullCharacter )] และ [GetTrait('profligate').GetName( GetNullCharacter )]"

