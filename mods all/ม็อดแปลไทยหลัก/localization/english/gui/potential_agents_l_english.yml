 agent_tracker_i: "[scheme_speed_i]"
 agent_tracker_desc: "#WEAK โคลนยังชื้นอยู่ตรงที่คนโง่เหยียบมัน มาเถอะ เราตามหลังไม่เกินชั่วโมงหรอก!#!\n$EFFECT_LIST_BULLET$ ลด [scheme_speed|E] [scheme_speed_i]\n$EFFECT_LIST_BULLET$ ต้องการ [martial_i] [martial|E] & [intrigue_i] [intrigue|E]\n$EFFECT_LIST_BULLET$ #P ได้รับประโยชน์#! จาก [traits|E] เช่น [GetTrait('lifestyle_traveler').GetName( GetNullCharacter )] และ [GetTrait('lifestyle_hunter').GetName( GetNullCharacter )]\n$EFFECT_LIST_BULLET$ #N ได้รับผลเสีย#! จาก [traits|E] เช่น [GetTrait('impatient').GetName( GetNullCharacter )] และ [GetTrait('lazy').GetName( GetNullCharacter )]"

