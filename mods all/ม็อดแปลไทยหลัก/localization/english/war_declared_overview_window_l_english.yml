 WAR_DECLARED_OVERVIEW_FLAVOR:0 "[WAR.Custom('WarDeclaredOpening')][WAR.Custom('WarDeclaredFlavor')]"

 war_declared_opening.neutral:0 "[ROOT.War.GetActiveCB.GetAttacker.Custom2('AppropriateGreeting',ROOT.War.GetActiveCB.GetDefender)]\n\n"
 war_declared_opening.negative:0 "[ROOT.War.GetActiveCB.GetAttacker.Custom2('AppropriateGreetingNegative',ROOT.War.GetActiveCB.GetDefender)]\n\n"

 war_declared_flavor.zealous:0 "การกระทำอันชั่วร้ายของเจ้าไม่ได้รับการลงทัณฑ์มานานเกินไปแล้ว วันนี้สิ่งนั้นจะเปลี่ยนไป ด้วยข้ามาเพื่อมอบการลงทัณฑ์อันศักดิ์สิทธิ์แก่เจ้า! [ROOT.War.GetActiveCB.GetAttacker.Custom('ZealousDoW')]"
 war_declared_flavor.zealous.mercifulgod:2 "ขอ [ROOT.Char.GetFaith.HighGodName] ทรงเมตตาเจ้าเถิด เพราะข้าจะไม่ให้ความปรานีใดๆ แก่เจ้าเลย!"
 war_declared_flavor.zealous.reincarnation:0 "ขอให้ชีวิตหน้าของเจ้าทุกข์ทนน้อยกว่าชีวิตนี้เถิด"
 war_declared_flavor.zealous.fallback:2 "ข้าแพ้ไม่ได้ เพราะ [ROOT.Char.GetFaith.HighGodName] อยู่กับข้า!"
 war_declared_flavor.naughty:0 "เจ้า [ROOT.War.GetActiveCB.GetDefender.Custom('GirlBoy')] ประพฤติตัวไม่เหมาะสมอย่างยิ่ง พฤติกรรม เช่นนี้มิอาจมองข้ามได้! เตรียมตัวให้พร้อมเถิด เพราะในสนามรบ ข้าจะมอบการลงโทษที่เจ้าสมควรได้รับอย่างสาสม!"
 war_declared_flavor.holy_war:1 "ศาสนาจอมปลอมของเจ้ากักขังราษฎรของเจ้าไว้ในความมืดมนนานเกินไปแล้ว ในนามแห่ง [ROOT.War.GetActiveCB.GetAttacker.GetFaith.HighGodName] ข้าจะนำศรัทธาอันแท้จริงมาสู่พวกเขาและปลดปล่อยพวกเขาจากการดูหมิ่นศาสนาของเจ้า!"
 war_declared_flavor.greedy:0 "[ROOT.War.GetActiveCB.GetAttacker.Custom2('AppropriateSupplimentaryGreeting',ROOT.War.GetActiveCB.GetDefender)] ข้าหมายปองดินแดนของเจ้ามานาน เพียง แต่ถูกปฏิเสธการครอบครอง ไม่ต่อไปแล้ว! ถึงเวลาแล้วที่ข้าจะได้สิ่งที่ข้าสมควรได้รับเสียที!"
 war_declared_flavor.dejure:0 "[ROOT.War.GetActiveCB.GetAttacker.Custom2('AppropriateSupplimentaryGreeting',ROOT.War.GetActiveCB.GetDefender)] การยึดครองดินแดนอันเป็นสิทธิ์โดยชอบธรรมของข้าโดยเจ้านั้นมิอาจทนได้อีกต่อไป ถึงเวลาแล้วที่ข้าจะทวงคืนกลับมาสู่การครอบครองข้า!"
 war_declared_flavor.subjugation:0 "ข้าตัดสินใจแล้วที่จะผนวกดินแดนของเจ้าเข้ากับอาณาจักรข้า จงยอมจำนนเสีย แต่บัดนี้ แลข้าจะเมตตา... หากต่อต้าน ข้าจะบังคับให้เจ้าคุกเข่าและหมอบกราบต่อหน้าข้า!"
 war_declared_flavor.subjugation.tribal:0 "เจ้าอ่อนแอ และข้าแข็งแกร่ง ไม่จำเป็นต้องมีเหตุผลอื่นใดให้ข้ามาเอาสิ่งที่ข้าต้องการไปจากเจ้า!"
 war_declared_flavor.subjugation.arrogant:0 "ช่างโอหังนัก ที่เจ้าเสแสร้งเป็นประมุขผู้เท่าเทียมทั้งที่ข้าเหนือกว่าเจ้าอย่างเห็นได้ชัด! ข้าจะขยี้กองทัพอันน่าสมเพชของเจ้าในสนามรบและบังคับให้เจ้าคุกเข่าต่อหน้าข้า!"
 war_declared_flavor.conquest:0 "เจ้าเป็นผู้ปกครองที่อ่อนแอและไม่สมควรครอบครองดินแดนที่เจ้ามี ข้าจะแสดงให้เจ้าเห็นว่าประมุขที่แท้จริงเป็นอย่างไร — เมื่อข้ายึดดินแดนเหล่านั้นไปจากเจ้า!"
 war_declared_flavor.peasant:0 "ความเย่อหยิ่งของเจ้าไร้ขอบเขต อย่ากังวลไปเลย ในไม่ช้าเจ้าจะได้รับบทเรียนเรื่องความอ่อนน้อมถ่อมตน!"
 war_declared_flavor.populist:1 "[ROOT.War.GetActiveCB.GetAttacker.Custom2('NegativeSupplimentaryGreeting',ROOT.War.GetActiveCB.GetDefender)] หากเจ้าต้องการสงคราม เจ้าก็จะได้มัน! เราจะไม่ยอมให้ใครมาหยุดยั้งเราจากการสร้างอาณาจักรใหม่เพื่อพวกเราเอง!"
 war_declared_flavor.independence:0 "[ROOT.War.GetActiveCB.GetAttacker.Custom2('NegativeSupplimentaryGreeting',ROOT.War.GetActiveCB.GetDefender)] เราอยู่ภายใต้การปกครองของเจ้ามานานเกินไป เราทนต่อไปไม่ไหวแล้ว — ด้วยเลือดและเหล็กกล้า เราจะเป็นอิสระ!"
 war_declared_flavor.liberty:1 "[ROOT.War.GetActiveCB.GetAttacker.Custom2('NegativeSupplimentaryGreeting',ROOT.War.GetActiveCB.GetDefender)] เรามิอาจทนต่อกฎหมายอันโหดร้าย ซึ่งละเมิดสิทธิ์โบราณของเราได้อีกต่อไป ด้วยคมดาบ กฎหมายเหล่านี้จะถูกขจัดสิ้นไป!"
 war_declared_flavor.claimant:1 "[ROOT.War.GetActiveCB.GetAttacker.Custom2('NegativeSupplimentaryGreeting',ROOT.War.GetActiveCB.GetDefender)] เจ้าคือผู้อ้างสิทธิ์จอมปลอมและทรราชย์ ถึงเวลาแล้วที่จะฟื้นฟูราชันย์ผู้ชอบธรรมสู่บัลลังก์!"
 war_declared_flavor.retraction_refused:0 "$char_interaction.0221.desc$"
 war_declared_flavor.revocation_refused:0 "$char_interaction.0201.desc$"
 war_declared_flavor.imprisonment_refused:0 "ข้าขอประณามเจ้าว่าเป็นทรราชย์ และปฏิเสธที่จะยอมจำนนต่ออำนาจเจ้า! อาณาจักรจะลุกขึ้นต่อต้านการปกครองอันชั่วร้ายของเจ้า!"
 war_declared_flavor.fallback:0 "[ROOT.War.GetActiveCB.GetAttacker.Custom2('AppropriateSupplimentaryGreeting',ROOT.War.GetActiveCB.GetDefender)] ดูเหมือนว่าไม่มีหนทางอื่นใดสำหรับข้อพิพาทของเรานอกจากการตัดสินกันในสนามรบ"
 is_war_overview_tab_open_trigger:0 "เปิดแท็บภาพรวมสงครามอยู่"
