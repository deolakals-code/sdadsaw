 # #Attempt to Overthrow Liege
 diarch_attempt_to_overthrow_liege:0 "ความพยายามโค่นล้มเจ้าเหนือหัว"
 diarch_attempt_to_overthrow_liege_desc:0 "[ROOT.Char.GetLiege.GetTitleAsNameNoTooltip]"#! [ROOT.Char.GetLiege.GetFirstNameNoTooltip] ที่ถูกกล่าวอ้างของเรานั้น ไม่สามารถปกครองได้หากปราศจาก #EMP ข้า#! — แต่ข้าปกครองได้แน่นอนโดยปราศจาก #EMP [ROOT.Char.GetLiege.GetHerHim]#! สิ่งที่ข้าต้องการคือการสนับสนุนอย่างลับๆ จากเหล่าขุนนางใหญ่ในอาณาจักรที่เพียงพอ ทหารผู้ภักดีบางส่วน และโอกาส..."
 diarch_attempt_to_overthrow_liege_tooltip:0 "เริ่มการยึดอำนาจเพื่อชิง[titles|E]ของ[liege|E]ท่านโดยไม่ต้องทำ[war|E]"
 diarch_attempt_to_overthrow_liege.tt.majority_powerful_vassal_support:0 "ปัจจุบันท่านมีผู้สนับสนุนที่เป็น[powerful_vassal|E]ที่มีสิทธิ์ [SCOPE.ScriptValue('pv_overthrow_tally_display_value')|0] คน #weak (รวมทั้งตัวท่านเอง)#! ในการสมคบคิดของท่าน จากที่ต้องการ [SCOPE.ScriptValue('pv_overthrow_threshold_display_value')|0] คน"
 diarch_attempt_to_overthrow_liege_bypass: "ท่านได้วางรากฐานสำหรับความพยายาม เช่นนี้ไว้แล้ว"
 diarch_attempt_to_overthrow_liege.tt.liege_cant_hold_only_hof_highest_title:0 "[title|E]ระดับ[title_tier|E]สูงสุดเพียงหนึ่งเดียวของ[liege|E]ท่านคือ$game_concept_title$[head_of_faith|E]"
 diarch_attempt_to_overthrow_liege.second_step:0 "จัดการการสมคบคิดของท่าน"
