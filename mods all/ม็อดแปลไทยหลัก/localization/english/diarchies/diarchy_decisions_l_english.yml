 diarch_attempt_to_overthrow_liege.tt.liege_response.information_on_converting_councillors:0 "#WEAK [powerful_vassals|E]ที่สนับสนุนการยึดอำนาจของท่านจะปฏิเสธที่จะเป็นตัวแทนให้[liege|E]ของพวกเขา#!"
 diarch_attempt_to_overthrow_liege.tt.consequences:0 "#WEAK หากสำเร็จ [strife|E]ปัจจุบันบางส่วนของท่านจะถูกเปลี่ยนเป็น[tyranny|E]เริ่มต้น#!"
 diarch_coup_attempt_standard_suite_effect.tt.reduced_amount:0 "ปริมาณ[strife|E]ที่เปลี่ยนเป็น[tyranny|E]ลดลง เนื่องจากการยึดอำนาจด้วย[diplomacy|E]ของท่าน"

