 promote_merit_mandate_desc: "#BOL ผลลัพธ์ที่เป็นไปได้จาก[mandate|E]:#!\n$EFFECT_LIST_BULLET$ รางวัล[merit|E]สำหรับทุก[character|E]ที่เข้าร่วม [GetActivityType('activity_imperial_examination').GetName]: #P +10%#!\n$EFFECT_LIST_BULLET$ [success_chance|E] ของ [GetScheme('mentoring').GetTypeName]: @scheme_success_icon!#P +10#!\n$EFFECT_LIST_BULLET$ [characters|E] ที่ได้รับ [merit|E] หรือ [trait_level_track_xp|E] ของ [GetTrait('confucian_education').GetName( GetNullCharacter )]\n\n#WEAK [son_of_heaven|E] บัญชาให้[grand_secretariat_director|E]ของตน ช่วยบ่มเพาะ[merit|E]ขึ้นใน[realm|E]\n[SelectLocalization( ObjectsEqual( GetPlayer.GetTopLiege.GetDiarchy.GetDiarch, GetPlayer.GetTopLiege.GetCouncillorPosition('councillor_chancellor').GetCouncillor ), 'mandate_aptitude_bonus', 'mandate_aptitude_malus' ) ]#!"
 mandate_aptitude_malus: "[GetPlayer.GetTopLiege.GetDiarchy.GetDiarch.Custom('CouncilPosition')] มี [aptitude|E] #N -75%#! สำหรับ[mandate|E]นี้"
