 # #Mandates
 fill_coffers_mandate:0 "เติมคลังหลวง"
 fill_coffers_mandate_desc:1 "#BOL ผลกระทบที่เป็นไปได้ของ [mandate|E]:#!\n$EFFECT_LIST_BULLET$ [gold|E] เพิ่มเติม\n$EFFECT_LIST_BULLET$ [development|E] [domain|E] ฟรี\n$EFFECT_LIST_BULLET$ [vassal_contracts|E] ถูกปรับให้เป็นประโยชน์ต่อ [liege|E]\n\n#WEAK [regent|E] ได้รับคำสั่งให้เพิ่มรายได้ให้กับ $game_concept_liege$ ของตน ไม่ว่าจะด้วยวิธีใดก็ตาม#! "
 swell_armies_mandate:0 "เพิ่มกำลังกองทัพ"
 swell_armies_mandate_desc:1 "#BOL ผลกระทบที่เป็นไปได้ของ [mandate|E]:#!\n$EFFECT_LIST_BULLET$ [modifiers|E] ที่เป็นประโยชน์ต่อ [men_at_arms|E]\n$EFFECT_LIST_BULLET$ $game_concept_modifiers$ ที่เป็นประโยชน์ต่อ [levy|E]\n$EFFECT_LIST_BULLET$ [courtiers|E] ที่เป็น [knights|E] ผู้มีทักษะ\n\n#WEAK การทัพในปัจจุบันหรืออนาคตต้องการกำลังพลใหม่ และ [liege|E] ได้มีพระราชโองการให้ [regent|E] ของตนจัดหามา#! "
 promote_authority_mandate:0 "ส่งเสริมอำนาจ"
 promote_authority_mandate_desc:1 "#BOL ผลกระทบที่เป็นไปได้ของ [mandate|E]:#!\n$EFFECT_LIST_BULLET$ [characters|E] และ [counties|E] ออกจาก [factions|E]\n$EFFECT_LIST_BULLET$ เพิ่ม [crown_authority|E]\n$EFFECT_LIST_BULLET$ เพิ่ม [opinion|E] ของ [councillor|E]\n\n#WEAK [liege|E] เรียกร้องให้ [regent|E] ของตนช่วยสร้างและรวบรวมอำนาจแห่งบัลลังก์#! "

