 viz_extravagance.t1.treasure.hankerchiefs: "ตัวละครนี้ใช้ผ้าเช็ดหน้าลินินเนื้อดีจำนวนมากอย่างผิดปกติ — สิบผืนต่อวันในฤดูร้อน แต่ก็ยังคงทิ้งทุกผืนหลังการใช้งาน"
 viz_extravagance.t1.treasure.cosmetics: "ตัวละครนี้เข้าถึงคลังน้ำหอม ขี้ผึ้ง และเครื่องสำอางชั้นดีจำนวนมากผิดปกติสำหรับผู้มีสถานะ เช่นนี้อย่างแน่นอน"
 viz_extravagance.t1.treasure.jewellery: "ตัวละครนี้ดูเหมือนจะไม่เคยขาดเครื่องประดับใหม่ๆ มาประดับตนเอง ทองคำ เงิน และอัญมณีล้ำค่าส่องประกายบนใบหน้าและ [ROOT.Char.GetDiarchy.GetDiarch.Custom('HandHands')] ของพวกเขา"
 viz_extravagance.t1.treasure.furniture: "เครื่องเรือนของตัวละครนี้ทำจากไม้และแร่โลหะนำเข้าจากต่างแดนที่ดีที่สุดเสมอ — เปลี่ยนบ่อยเท่าที่แฟชั่นจะเอื้ออำนวย ตามที่รสนิยมอันดีงามกำหนด"
 viz_extravagance.t1.treasure.clothing: "ตัวละครนี้มีตู้เสื้อผ้าที่ดูเหมือนไม่มีที่สิ้นสุด เต็มไปด้วยเสื้อผ้าชั้นดีตามกระแสล่าสุด — รวมถึงเสื้อผ้าจำนวนมากที่พร้อมจะสร้างแฟชั่นของตนเอง"
 viz_extravagance.t1.treasure.hats: "ตัวละครนี้ไม่ค่อยใส่หมวกใบเดิมนานเกินหนึ่งหรือสองสัปดาห์ — เหตุใดต้องจำกัดตัวเองในเมื่อมีแบบใหม่ๆ ที่สูงกว่าเดิมทุกปี?"
 viz_extravagance.t1.treasure.relics: "ตัวละครนี้เป็นที่รู้กันว่าครอบครองของสะสมเล็กๆ แต่ประณีต ซึ่งเป็นวัตถุมงคลศักดิ์สิทธิ์"
 viz_extravagance.t1.treasure.drugs: "ตู้ของตัวละครนี้มีชื่อเสียงด้านการเก็บสะสมยา เครื่องดื่ม และยาดองแปลกใหม่ชั้นดี ซึ่งหลายชนิดเป็นสารที่หาได้ยากยิ่งใน [ROOT.Char.GetCapitalLocation.GetTitle.GetNameNoTierNoTooltip]"
 viz_extravagance.t1.treasure.game_pieces: "ตัวละครนี้มีสำเนาของเกมกระดานทุกเกมที่รู้จักในมุมนี้ของโลก พร้อมตัวหมากที่แกะสลักจากทุกสิ่งตั้งแต่หินมีค่าไปจนถึงกระดูกของสัตว์ในตำนาน"
 viz_extravagance.t1.treasure.hourglasses: "ตัวละครนี้ครอบครองนาฬิกาทรายที่แม่นยำที่สุดในโลก — สำหรับข้าราชการพลเรือนแล้ว มีเครื่องมือหรูหราน้อยชิ้นที่จะเทียบได้"

 viz_extravagance.t1.activities.parades: "ตัวละครนี้ชื่นชอบการจัดขบวนแห่ที่โปรยเหรียญและอาหารให้แก่ผู้ยากไร้ โดยออกค่าใช้จ่ายเองเสมอ — และในนามของตนเอง"
 viz_extravagance.t1.activities.festivals: "ตัวละครนี้เป็นที่รู้กันว่าเปิดสวนและโถงชั้นล่างของที่พักส่วนตัวเพื่อจัดเทศกาลเล็กๆ ให้สามัญชนได้เข้ามาสัมผัสความยิ่งใหญ่ของชนชั้นสูงชั่วครู่"
 viz_extravagance.t1.activities.auctions: "ตัวละครนี้จัดงานประมูลเพื่อการกุศลเป็นประจำ โดยขายสมบัติบางส่วนที่สะสมไว้เพื่อระดมเงินช่วยเหลือผู้ยากไร้ในอาณาจักร"
 viz_extravagance.t1.activities.feasts: "ตัวละครนี้ชอบจัดงานเลี้ยงส่วนตัวให้แก่ขุนนางท้องถิ่นเป็นประจำ บางคนกระซิบว่าต้องหลั่งเลือด เพื่อให้ได้บัตรเชิญ"
 viz_extravagance.t1.activities.board_game_tourneys: "ตัวละครนี้ชื่นชอบการจัดการแข่งขันเกมกระดานสำหรับชนชั้นสูง โดยผู้ยิ่งใหญ่และผู้ดีแห่ง [ROOT.Char.GetCapitalLocation.GetTitle.GetNameNoTierNoTooltip] ที่มารวมตัวกันจะเล่นเกมรูปแบบใหม่ล่าสุดทั้งหมด"
 viz_extravagance.t1.activities.pigeon_racing: "ตัวละครนี้มีความหลงใหลในการแข่งนกพิราบที่ค่อนข้างน่าอับอาย พวกเขาถึงกับเป็นเจ้าของโรงเลี้ยงนกพิราบขนาดใหญ่"
 viz_extravagance.t1.activities.orgies: "ตัวละครนี้เป็นที่รู้กันว่าจัดงานสังสรรค์ #EMP อย่างลับๆ #! สำหรับผู้อยู่อาศัยที่... ลามกอนาจารบางคนใน [ROOT.Char.GetCapitalLocation.GetTitle.GetNameNoTierNoTooltip]"
 viz_extravagance.t1.activities.feasts.weekly: "ตัวละครนี้ชื่นชอบการจัดงานเลี้ยงใหญ่โตทุกสัปดาห์ ไม่เคยขาด — ขุนนางชั้นผู้น้อยแห่ง [ROOT.Char.GetCapitalLocation.GetTitle.GetNameNoTierNoTooltip] แทบจะพึ่งพาพวกเขาเพียงเพื่อห้องครัวของตนเท่านั้น"
 viz_extravagance.t1.activities.exhibitions: "ตัวละครนี้มีรสนิยมทางศิลปะ และให้ความสำคัญกับการอุปถัมภ์ศิลปะและจัดแสดงผลงานจากความเมตตาของตน บางครั้งก็จัดแสดงให้แก่สมาชิกที่ต่ำต้อยที่สุดในสังคมด้วย"
 viz_extravagance.t1.activities.feasts.commoners: "ตัวละครนี้ชอบจัดงานเลี้ยงใหญ่โตเป็นประจำ แต่ให้ความสำคัญกับการเชิญพลเมืองที่โดดเด่นที่สุดของ [ROOT.Char.GetCapitalLocation.GetTitle.GetNameNoTierNoTooltip] แม้ว่าชนชั้นของพวกเขาอาจจะกีดกันก็ตาม"

 viz_extravagance.t1.property.townhouse: "ตัวละครนี้มีบ้านในเมืองที่ตก แต่งอย่างหรูหรา แต่ก็ดูถ่อมตนอย่างเหมาะสม ใน [ROOT.Char.GetCapitalLocation.GetTitle.GetNameNoTierNoTooltip]"
 viz_extravagance.t1.property.minor_businesses: "ผลประโยชน์ทางธุรกิจของตัวละครนี้มีมากมายและหลากหลาย รวมถึงโรงงานขนาดเล็ก สมาคมการค้าเล็กๆ และที่ดินอิสระเล็กๆ ทั่วเมืองหลวง"
 viz_extravagance.t1.property.small_arena: "ตัวละครนี้เป็นเจ้าของและดูแลสนามแข่งม้าส่วนตัวขนาดเล็ก การพนันที่เกิดขึ้นนั้น แน่นอนว่าเป็นผลประโยชน์ข้างเคียง"
 viz_extravagance.t1.property.manse: "ตัวละครนี้มีคฤหาสน์ส่วนตัวนอกเมือง [ROOT.Char.GetCapitalLocation.GetTitle.GetNameNoTierNoTooltip] — ใกล้พอที่จะสะดวก ไกลพอที่จะเป็นส่วนตัว"
 viz_extravagance.t1.property.toll_road: "ตัวละครนี้เป็นเจ้าของ แต่เพียงผู้เดียวของถนนเก็บค่าผ่านทางที่ทำกำไรได้เป็นพิเศษ ซึ่งนำไปสู่ [ROOT.Char.GetCapitalLocation.GetTitle.GetNameNoTierNoTooltip] พวกเขาได้ครอบครองมันมาได้อย่างไร และเมื่อใดที่เริ่มเก็บค่าผ่านทางนั้น เป็นเรื่องที่คาดเดากันไปต่างๆ นานา"
 viz_extravagance.t1.property.agent_network: "ตัวละครนี้ดูแลเครือข่ายสายลับทั่วทั้งอาณาจักร คอยติดตามและรักษาผลประโยชน์ทางธุรกิจของตนแม้ในด่านหน้าที่ห่างไกลที่สุด"
 viz_extravagance.t1.property.rooftop_garden: "ตัวละครนี้จ่ายเงินเพื่อดูแลสวนบนดาดฟ้าที่กว้างขวางใน [ROOT.Char.GetCapitalLocation.GetTitle.GetNameNoTierNoTooltip] สร้างความประหลาดใจให้กับพลเมืองเบื้องล่างเป็นอย่างมาก"
 viz_extravagance.t1.property.market_officials_on_payroll: "ตัวละครนี้เป็นที่รู้กันว่ามีผู้ตรวจการและเจ้าหน้าที่ศุลกากรทุกคนในตลาดสำคัญแห่งหนึ่งของเมืองหลวงอยู่ในบัญชีเงินเดือน ทั้งหมดนี้เพื่อรักษาความซื่อสัตย์ต่ออาณาจักร แน่นอน"
 viz_extravagance.t1.property.hostel: "ตัวละครนี้เป็นเจ้าของโรงแรมราคาถูกใน [ROOT.Char.GetCapitalLocation.GetTitle.GetNameNoTierNoTooltip] ซึ่งจงใจให้บริการแก่ผู้ที่ยากจนที่สุดและด้อยความสามารถที่สุดในสังคม"
 viz_extravagance.t1.property.gangers: "ตัวละครนี้ #EMP ถูกกล่าวหาว่า #! มีแก๊งอันธพาลใหญ่แก๊งหนึ่งใน [ROOT.Char.GetCapitalLocation.GetTitle.GetNameNoTierNoTooltip] อยู่ในบัญชีเงินเดือน สิ่งที่ข้าราชการพลเรือนผู้ทรงเกียรติจะทำกับกลุ่มอันธพาลที่โหดเหี้ยมนั้นเป็นเรื่องที่ใครๆ ก็เดาได้"

 viz_extravagance.t1.charity.orphans: "ตัวละครนี้จ่ายเงินสำหรับเบี้ยเลี้ยงสาธารณะเพื่อรับและให้การศึกษาแก่เด็กกำพร้าจำนวนหนึ่งทุกปี เยาวชนจะได้รับการศึกษา อาหาร ที่พัก และการอบรมจริยธรรมที่เหมาะสมจนกว่าจะบรรลุนิติภาวะ"
 viz_extravagance.t1.charity.building_repair: "ตัวละครนี้จ่ายเงินสำหรับกองทุนเล็กๆ ที่พลเมืองของเมืองหลวง ซึ่งอาคารได้รับความเสียหายสามารถเข้าถึงได้ — หากพวกเขาไม่สามารถจ่ายค่าซ่อมแซมได้ พวกเขาจะได้รับเงินช่วยเหลือ"
 viz_extravagance.t1.charity.feasts.religious: "ตัวละครนี้ให้เงินอุดหนุนงานเลี้ยงทางศาสนาประจำปีจำนวนหนึ่งสำหรับสามัญชนใน [ROOT.Char.GetCapitalLocation.GetTitle.GetNameNoTierNoTooltip]"
 viz_extravagance.t1.charity.widowers: "ตัวละครนี้จ่ายเงินค่าเลี้ยงชีพให้แก่พ่อม่ายที่ยากไร้บางคนในเมืองหลวง"
 viz_extravagance.t1.charity.widows: "ตัวละครนี้จ่ายเงินค่าเลี้ยงชีพให้แก่แม่ม่ายที่ยากไร้บางคนในเมืองหลวง"
 viz_extravagance.t1.charity.beggars: "ตัวละครนี้จ่ายเงินสำหรับกองทุนที่ให้อาหารและเสื้อผ้าแก่ขอทานและผู้ยากไร้ใน [ROOT.Char.GetCapitalLocation.GetTitle.GetNameNoTierNoTooltip] ซึ่งเป็นเส้นชีวิตที่สำคัญสำหรับกากเดนของอาณาจักร"
 viz_extravagance.t1.charity.awkward_children: "ตัวละครนี้จ่ายเงินสำหรับโครงการที่ซื้อเหยือกน้ำทดแทนให้แก่เด็กรับใช้ที่ทำเหยือกแตกขณะไปตักน้ำตอนเช้า — โดยไม่มีใครในครัวเรือนของเด็กรู้เรื่องอุบัติเหตุเล็กๆ น้อยๆ ของพวกเขาเลย"
 viz_extravagance.t1.charity.civil_service.guard: "ตัวละครนี้จ่ายเงินสำหรับป้อมยามขนาดเล็กและยามเฝ้าประจำการ เพื่อยืนเฝ้าหน้าอาคารบริหารที่สำคัญแห่งหนึ่งใน [ROOT.Char.GetCapitalLocation.GetTitle.GetNameNoTierNoTooltip]"
 viz_extravagance.t1.charity.birds: "ตัวละครนี้จ่ายเงินสำหรับเมล็ดพันธุ์ที่จะหว่านเป็นประจำในตรอกซอกซอยบางแห่งสำหรับนกในเมืองหลวง — มีเพียงคนป่าเถื่อนเท่านั้นที่จะปล่อยให้สัตว์ เช่นนี้ต้องทนทุกข์ทรมานและอดอยาก"
 viz_extravagance.t1.charity.monastery: "ตัวละครนี้ให้ทุนสนับสนุนการบำรุงรักษา (และจ่ายเงินสำหรับการก่อตั้ง) ชุมชนทางศาสนาที่ห่างไกล ซึ่งอยู่ห่างจากบาปของชีวิตปกติ"
 viz_extravagance.t1.charity.judges: "ตัวละครนี้จ่ายเงินให้ผู้พิพากษามืออาชีพบางคนของอาณาจักรเพื่อใช้เวลามากขึ้นในการพิจารณาคดีและเดินทางไปตามเขตอำนาจศาล"
 viz_extravagance.t1.charity.kitchens: "ตัวละครนี้จ่ายเงินสำหรับโรงครัวฟรีขนาดเล็กจำนวนหนึ่ง เพื่อเลี้ยงดูคนจนผู้สำนึกบุญคุณใน [ROOT.Char.GetCapitalLocation.GetTitle.GetNameNoTierNoTooltip]"

 viz_extravagance.t2.treasure.cabinet_of_curiosities: "ตัวละครนี้มีห้องที่อุทิศให้กับของแปลกและเครื่องใช้ประหลาดจากดินแดนห่างไกล แม้จะมีประโยชน์ใช้สอยเพียงเล็กน้อย แต่ #EMP ก็เป็น #! ที่รักของแขกเหรื่อ"
 viz_extravagance.t2.treasure.gems: "มีรายงานว่าตัวละครนี้เป็นเจ้าของอัญมณีล้ำค่าหลายกระสอบ ผู้ที่เคยเห็นของสะสมของพวกเขาน้อยคนอ้างว่า แต่ละถุงอุทิศให้กับตระกูลหินที่สวยงามอันเป็นเอกลักษณ์"
 viz_extravagance.t2.treasure.sculpture: "ตัวละครนี้เป็นผู้รักศิลปะอย่างยิ่ง และที่พักของพวกเขามักมีรูปปั้นที่หล่อด้วยโลหะมีค่าหรือแกะสลักจากหินราคาแพงที่มันวาวที่สุด"
 viz_extravagance.t2.treasure.decorative_martial_gear: "ตัวละครนี้ชอบอาวุธและชุดเกราะตก แต่ง — ที่พักของพวกเขาเต็มไปด้วยเครื่องยุทธภัณฑ์ที่หรูหราเกินจริง ตั้งแต่ดาบทองคำไปจนถึงโล่ประดับอัญมณี"
 viz_extravagance.t2.treasure.bezoar_cutlery: "ตัวละครนี้เป็นเจ้าของชุดเครื่องใช้บนโต๊ะอาหารที่ทำจากบีซัวร์ราคาแพงลิบลิ่ว: กล่าวกันว่าหินลึกลับเหล่านี้สามารถชะลอ ทำให้เป็นกลาง หรือแม้กระทั่งย้อนกลับผลกระทบของยาพิษที่ร้ายแรงที่สุด ทำให้เครื่องใช้เหล่านี้มีสไตล์อย่างยิ่ง #EMP และ #! ใช้งานได้จริง"
 # Narrator's note: bezoars do not, in fact, stop poison. Le big RIP.
 viz_extravagance.t2.treasure.fly_stones: "ตัวละครนี้มีของสะสมเล็กๆ เป็นหินไล่แมลงวัน: หินลึกลับชนิดหนึ่งที่กล่าวกันว่าสามารถขับไล่แมลงวัน ยุง และแมลงรบกวนอื่นๆ ในรัศมีเล็กๆ ซึ่ง ทำให้เป็นเครื่องประดับที่ล้ำค่ามากบนโต๊ะอาหาร"
 # Narrator's note: fly stones are sadly fictional.
 viz_extravagance.t2.treasure.indexed_bribes: "ตัวละครนี้เป็นที่รู้จักในเรื่องสินบนที่จัดระเบียบและแบ่งระดับอย่างพิถีพิถัน กล่าวกันว่าสม่ำเสมอและคาดเดาได้มากจนพวกเขาต้องมีถุง แต่ละขนาดเป็นร้อยใบพร้อมใช้งานตลอดเวลา — แต่ละใบมีจำนวนเหรียญที่แน่นอน"
 viz_extravagance.t2.treasure.map_of_world: "ตัวละครนี้เป็นเจ้าของแผนที่ของโลกทั้งใบที่รู้จักกัน มีรายงานว่าเป็นหนึ่งในแผนที่ที่แม่นยำที่สุดในอาณาจักร ครอบคลุมผนังทั้งด้าน — พวกเขามักจะถูกพบเห็นกำลังจ้องมองมัน จมอยู่ในความคิด"
 viz_extravagance.t2.treasure.horse_armour: "ม้าจำนวนมากของตัวละครนี้ไม่ค่อยปรากฏตัวโดยไม่มีเครื่องประดับอันล้ำค่าและการตก แต่งที่โอ้อวด เช่นเดียวกับที่พวกเขาใส่เอง — ตั้งแต่อานม้าประดับมุกไปจนถึงบังเหียนเงิน"
 viz_extravagance.t2.treasure.crockery: "ตัวละครนี้อวดอ้างเป็นประจำว่าห้องครัวของพวกเขามีหม้อและกระทะที่ใหญ่ที่สุดบางส่วน ซึ่งทำจากวัสดุที่หายากที่สุดที่หาได้ใน [ROOT.Char.GetCapitalLocation.GetTitle.GetNameNoTierNoTooltip]"

 viz_extravagance.t2.activities.feasts.pool: "ตัวละครนี้ชื่นชอบการจัดงานรื่นเริงรอบสระน้ำเทียมที่กว้างขวาง ซึ่งสร้างขึ้นด้วยค่าใช้จ่ายมหาศาล ณ ที่พักส่วนตัวแห่งหนึ่งของพวกเขา และล้อมรอบด้วยหมอนอิงหรูหรา โซฟา และเสียงเครื่องดื่มที่ริน"
 viz_extravagance.t2.activities.gambling.horse: "ความภาคภูมิใจและความสุขของตัวละครนี้คือคอกม้าแข่งทั้งหมด — เกือบทั้งหมดเป็นพันธุ์แท้จากต่างประเทศ"
 viz_extravagance.t2.activities.feasts.interactive: "งานเลี้ยงของตัวละครนี้เป็นที่รู้จักกันดีในเรื่ององค์ประกอบแบบโต้ตอบ: ถุงเหรียญที่ซ่อนอยู่ในอาหารของแขก โฉนดที่ดินที่ต้องการเพียงลายเซ็นที่ทิ้งไว้ในห้องส้วม รูปปั้นที่คลี่ออกเพื่อเผยอัญมณีล้ำค่าสำหรับคนแรกที่ไขความลับได้ และอื่นๆ อีกมากมาย"
 viz_extravagance.t2.activities.feasts.long: "ตัวละครนี้เชื่อมั่นว่างานเลี้ยงจะไม่จบจนกว่าห้องเก็บเสบียงของเจ้าภาพจะหมด — ด้วยเหตุนี้ งานเลี้ยงบางงานของพวกเขาจึงเป็นที่รู้กันว่าดำเนินไปเป็นสัปดาห์หรือมากกว่านั้น"
 viz_extravagance.t2.activities.concerts: "ตัวละครนี้ให้ความสำคัญกับดนตรีมากกว่าศิลปะแขนงอื่นๆ โดยถือว่าการไม่มีดนตรีเป็นโศกนาฏกรรมที่แท้จริง งานรื่นเริงหลายงานของพวกเขาโดยพื้นฐานแล้วคือคอนเสิร์ตขนาดใหญ่ — บางครั้งก็ใหญ่พอที่สามัญชนบางคนจะได้เข้าร่วม"
 viz_extravagance.t2.activities.theatre: "ตัวละครนี้รักการแสดงละคร การแสดง และการแสดงกายกรรมอย่างหาใครเปรียบมิได้ งานเลี้ยงของพวกเขามีนักแสดงเคลื่อนที่จำนวนมากอย่างไม่สมส่วน และการแสดงคลาสสิกเก่าๆ ที่มีนักแสดงหน้าใหม่เป็นฉากประจำในทุกงานเลี้ยง"
 viz_extravagance.t2.activities.poetry: "ตัวละครนี้ถือว่าตนเองเป็นกวีอยู่บ้าง — ไม่ว่าคนอื่นจะเห็นด้วยหรือไม่ก็ตาม บัตรเชิญเข้าร่วมงานเลี้ยงหรูหราที่พวกเขาอ่านบทกวีของตนเป็นที่ต้องการอย่างสูง"
 viz_extravagance.t2.activities.amnesties: "ตัวละครนี้เชื่อว่าทุกคนสามารถได้รับการอภัยโทษได้ หากพวกเขากลับใจและแก้ไข — พวกเขาใช้ตำแหน่งทางการบริหารเพื่อจัดการนิรโทษกรรมเป็นประจำสำหรับอาชญากรที่พิสูจน์ได้ว่าสำนึกผิดเพียงพอ"
 viz_extravagance.t2.activities.animal_baiting: "ตัวละครนี้ไม่มีอะไรจะรักมากไปกว่าเสียงคำราม เสียงขู่ และเสียงกรีดร้องของสัตว์ร้ายที่ต่อสู้เพื่อชีวิต ผู้ล่อสัตว์ สุนัข และสัตว์ดุร้ายทั้งที่แปลกใหม่และธรรมดาสามัญต่อสู้กันในหลุมในงานเลี้ยงส่วนใหญ่ของพวกเขา"
 viz_extravagance.t2.activities.sermons: "ตัวละครนี้มีความศรัทธาในศาสนาอย่างแรงกล้าเกินกว่าที่ความเหมาะสมเรียกร้อง และให้ความสำคัญกับการเติมเต็มงานรื่นเริงของตนด้วยบทเทศนาและ [ROOT.Char.GetDiarchy.GetDiarch.GetFaith.PriestNeuterPlural] ที่เดินไปมา"

 viz_extravagance.t2.property.monopoly: "ตัวละครนี้โชคดีพอที่จะมีเอกสิทธิ์ในการขายสินค้าหลักบางอย่างภายในกำแพงเมือง [ROOT.Char.GetCapitalLocation.GetTitle.GetNameNoTierNoTooltip] การที่พวกเขาควบคุมสำนักงานที่ให้เอกสิทธิ์ดังกล่าวนั้นไม่น่าจะเกี่ยวข้องกัน"
 viz_extravagance.t2.property.exotic_market: "ตัวละครนี้เป็นเจ้าของ และเก็บภาษีอย่างหนัก จากตลาดสินค้าแปลกใหม่ที่มีชื่อเสียงแห่งหนึ่งใน [ROOT.Char.GetCapitalLocation.GetTitle.GetNameNoTierNoTooltip]"
 viz_extravagance.t2.property.mine: "ตัวละครนี้ครอบครองเหมืองที่ทำกำไรได้ใกล้เมืองหลวง ซึ่งเป็นแหล่งโลหะทั่วไปที่สำคัญสำหรับใช้ในครัวเรือนและการค้า"
 viz_extravagance.t2.property.warehouses: "ตัวละครนี้เป็นเจ้าของคลังสินค้าที่กว้างขวางอย่างแท้จริง ซึ่งซ่อนตัวอยู่ใกล้ศูนย์กลางการค้าของเมืองหลวง คอมเพล็กซ์นี้เต็มไปด้วยสินค้าการค้าแปลกใหม่จนคนท้องถิ่นเรียกมันว่า 'ห้องนิรภัยของ [ROOT.Char.GetDiarchy.GetDiarch.GetFirstNameNoTooltip]'"
 viz_extravagance.t2.property.messenger_network: "ตัวละครนี้จ้างเครือข่ายผู้ส่งสารทั่วทั้งอาณาจักรที่สุขุมรอบคอบ (และที่สำคัญกว่าคือ #EMP ภักดี #!) ซึ่งสามารถถ่ายทอดเจตจำนงและคำสั่งของตนไปยังทุกด่านหน้าของแผ่นดิน"
 viz_extravagance.t2.property.workshops: "ตัวละครนี้เป็นเจ้าของโรงงานเกือบทุกแห่งในถนนสายอุตสาหกรรมแห่งหนึ่งของ [ROOT.Char.GetCapitalLocation.GetTitle.GetNameNoTierNoTooltip] ซึ่งเป็นตรอกที่มีชื่อเสียงด้านสินค้าที่หลากหลายและสวยงาม"
 viz_extravagance.t2.property.personal_temple: "ตัวละครนี้เป็นเจ้าของ [ROOT.Char.GetDiarchy.GetDiarch.GetFaith.HouseOfWorship] ส่วนตัวที่โอ้อวด ซึ่งใช้ได้เฉพาะพวกเขา ครอบครัว และพันธมิตรที่ใกล้ชิดที่สุดเท่านั้น"
 viz_extravagance.t2.property.fort: "ตัวละครนี้เป็นเจ้าของป้อมปราการขนาดเล็กในพื้นที่ทุรกันดารอันตราย ซึ่งตั้งอยู่ใกล้ [ROOT.Char.GetDiarchy.GetDiarch.GetFaith.PriestNeuterPlural] แม้จะมีค่าบำรุงรักษาสูง แต่ผลผลิตสัตว์ที่จับได้มากมายในภูมิภาคนี้ก็ทำกำไรได้ดี"
 viz_extravagance.t2.property.treasury: "คลังสมบัติของตัวละครนี้ใหญ่โตมากจนต้องมีอาคารเป็นของตัวเอง — เป็นคอมเพล็กซ์ที่มีป้อมปราการอยู่ในใจกลาง [ROOT.Char.GetCapitalLocation.GetTitle.GetNameNoTierNoTooltip] ซึ่งเหรียญของพวกเขาจะปลอดภัยอย่างแน่นอน"
 viz_extravagance.t2.property.defensible_palace: "ตัวละครนี้ดูแลรักษาพระราชวังขนาดเล็กที่มีป้อมปราการใน [ROOT.Char.GetCapitalLocation.GetTitle.GetNameNoTierNoTooltip] — มีรายงานว่าเต็มไปด้วยทางลับและเส้นทางหลบหนีที่ซ่อนอยู่"

 viz_extravagance.t2.charity.schools: "ตัวละครนี้ให้ทุนสนับสนุนโรงเรียนจำนวนหนึ่งเป็นการส่วนตัว ซึ่งอุทิศให้กับการสอนเด็กเล็กที่ มิฉะนั้นจะไม่มีความหวังในการศึกษาแม้ แต่น้อย"
 viz_extravagance.t2.charity.hospitals: "ตัวละครนี้ให้ทุนสนับสนุนโรงพยาบาลที่มีชื่อเสียงหลายแห่งเป็นการส่วนตัวใน [ROOT.Char.GetCapitalLocation.GetTitle.GetNameNoTierNoTooltip] ซึ่งเป็นสถาบันที่รักษาผู้ที่ยากจนที่สุดในสังคม แต่ต้องพึ่งพาความเอื้อเฟื้อเผื่อแผ่ของพวกเขาโดยสิ้นเชิง"
 viz_extravagance.t2.charity.poor_funerals: "ตัวละครนี้ให้ทุนสนับสนุนงานศพของผู้ที่เสียชีวิตใน [ROOT.Char.GetCapitalLocation.GetTitle.GetNameNoTierNoTooltip] เป็นการส่วนตัว โดยไม่มีเงินทุน ครอบครัว หรือเพื่อนฝูงที่จะตายอย่างมีศักดิ์ศรี"
 viz_extravagance.t2.charity.scholars.philosophical: "ตัวละครนี้ให้ทุนสนับสนุนนักปรัชญาและสถาบันสำคัญจำนวนหนึ่งเป็นการส่วนตัว ซึ่งมุ่งเน้นไปที่การสำรวจวิถีทางที่ลึกซึ้งยิ่งขึ้นของโลก"
 viz_extravagance.t2.charity.scholars.legal: "ตัวละครนี้ให้ทุนสนับสนุนทนายความ นักกฎหมาย และเสมียนกฎหมายชั้นนำของอาณาจักรเป็นการส่วนตัว ช่วยส่งเสริมการชี้แจงและการบังคับใช้สันติภาพที่ยุติธรรมสำหรับทุกคน"
 viz_extravagance.t2.charity.civil_service.extra_positions: "ตัวละครนี้ให้ทุนสนับสนุนการจัดหาบุคลากรสำหรับตำแหน่งสำคัญในราชการพลเรือนเป็นการส่วนตัว เพิ่มพูนอำนาจของระบบราชการหลายเท่าตัวโดยการให้ทุนในจุดที่สำคัญที่สุด"
 viz_extravagance.t2.charity.police: "ตัวละครนี้ให้ทุนสนับสนุนเจ้าหน้าที่ตำรวจและผู้บังคับใช้กฎหมายที่ภักดีเป็นการส่วนตัว เพื่อลาดตระเวนใน [ROOT.Char.GetCapitalLocation.GetTitle.GetNameNoTierNoTooltip] รับรองว่ากฎหมายจะได้รับการปฏิบัติตามอย่างเคร่งครัดเท่าที่วะซีร์ต้องการ"
 viz_extravagance.t2.charity.scholars.theological: "ตัวละครนี้ให้ทุนสนับสนุนนักวิชาการเทววิทยาที่มีชื่อเสียงที่สุดบางคนในอาณาจักรเป็นการส่วนตัว ลงทุนในการพัฒนาทฤษฎี [ROOT.Char.GetDiarchy.GetDiarch.GetFaith.GetAdjective] ที่ดีในนามของผู้ศรัทธาร่วมกัน"
 viz_extravagance.t2.charity.scholars.mystical: "ตัวละครนี้ให้ทุนสนับสนุนนักเวทย์มนตร์ ผู้ลึกลับ และผู้ทรงฌานที่มีชื่อเสียงจำนวนหนึ่งเป็นการส่วนตัว ซึ่งใช้ความรู้แปลกประหลาดของตนผ่านราชสำนักของ [ROOT.Char.GetCapitalLocation.GetTitle.GetNameNoTierNoTooltip]"
 viz_extravagance.t2.charity.circumcision: "ตัวละครนี้ให้ทุนสนับสนุนการขริบและการศึกษาทางศาสนาของเด็กกำพร้าชายจำนวนหนึ่งจากท้องถนนของ [ROOT.Char.GetCapitalLocation.GetTitle.GetNameNoTierNoTooltip] ใน แต่ละปีเป็นการส่วนตัว"
 viz_extravagance.t2.charity.preachers: "ตัวละครนี้ให้ทุนสนับสนุน [ROOT.Char.GetDiarchy.GetDiarch.GetFaith.PriestNeuterPlural] ขอทานเป็นการส่วนตัว เพื่อเดินทางไปทั่วแผ่นดิน ดูแลผู้ศรัทธาที่ขัดสน และให้คำปรึกษาทางจิตวิญญาณที่ดีแก่ผู้ที่มีศรัทธาน้อยกว่า"

 viz_extravagance.t3.treasure.mirrors: "ตัวละครนี้เป็นเจ้าของกระจกที่ใสที่สุดที่เงินสามารถซื้อได้หลายสิบอัน มอบความหรูหราที่หลงตัวเองในระดับที่แทบจะไม่เหมาะสม ซึ่งแม้ แต่ขุนนางเพียงไม่กี่คนก็ฝันถึงได้"
 viz_extravagance.t3.treasure.parasols: "ตัวละครนี้ดูเหมือนจะเป็นเจ้าของร่มกันแดดสำหรับทุกวันของปี: บางคันปักด้วยทองคำ บางคันด้วยเงิน บางคันทำจากผ้าไหม บางคันจากผ้าดามาสก์ บางคันประดับด้วยทับทิม บางคันด้วยมรกต และต่อไปเรื่อยๆ ไม่มีที่สิ้นสุด..."
 viz_extravagance.t3.treasure.silk_bigtop: "ตัวละครนี้เป็นเจ้าของเต็นท์เดินทางที่เหมาะสำหรับคณะเดินทางห้าสิบคนหรือมากกว่านั้น ทำจากผ้าไหมที่หรูหราที่สุด — ทุกแผงปักอย่างหรูหรา ทุกเสาเป็นโลหะมีค่าหรือเคลือบเงาราคาแพง"
 viz_extravagance.t3.treasure.fabrics: "ตัวละครนี้ภาคภูมิใจในการเป็นเจ้าของสิ่งทอที่หรูหราที่สุดในโลกที่รู้จักกันในปริมาณมาก: ผ้าไหม ผ้าดามาสก์ ผ้ากำมะหยี่ ผ้าโบรเคดชั้นดี ผ้านวมที่ประณีต และทะเลผ้าที่หลากหลายรูปแบบย่อยและเอกลักษณ์เฉพาะของภูมิภาคที่แทบจะไม่มีที่สิ้นสุด"
 viz_extravagance.t3.treasure.exotic_pets: "ตัวละครนี้ ทำให้แขกหลงใหลและหวาดกลัวด้วยคอลเลกชันสัตว์เลี้ยงแปลกใหม่ของพวกเขา: สิงโต เสือ กวางต่างประเทศที่แปลกประหลาด และสัตว์ประหลาดอื่นๆ อีกมากมายประดับสวนสัตว์ส่วนตัวของพวกเขา"
 viz_extravagance.t3.treasure.carpets: "ตัวละครนี้เป็นเจ้าของพรมที่มีชื่อเสียงเป็นพิเศษ: ยาวร้อยศอกและกว้างครึ่งหนึ่ง ทอจากไหมปั่นเย็บด้วยด้ายทองคำและประดับด้วยซับในผ้าซาตินสีเงิน ปักด้วยฉากทางศาสนาและประวัติศาสตร์ที่กล่าวกันว่าบอกเล่าประวัติศาสตร์ทั้งหมดของโลก"
 viz_extravagance.t3.treasure.gold_mattress: "ตัวละครนี้ครอบครองที่นอนที่ถูกกล่าวหาว่าปั่นด้วยด้ายทองคำเท่านั้น และเคยประดับด้วยบุคคลที่มีชื่อเสียงที่สุดบางคนในประวัติศาสตร์ล่าสุด"
 viz_extravagance.t3.treasure.birth_control: "ตัวละครนี้ครอบครองยาดอง ยาเม็ด และวิธีการที่แปลกใหม่กว่านั้นในการรับรองการมีเพศสัมพันธ์ที่ปลอดภัย มีความสุข และไม่มีผล"
 viz_extravagance.t3.treasure.sculpture.articulated: "ความภาคภูมิใจและความสุขของตัวละครนี้คือรูปปั้นข้อต่อหลายชิ้นของตนเอง ซึ่งท่าทางและเสื้อผ้าสามารถเปลี่ยนแปลงได้อย่างไม่มีที่สิ้นสุดตามความประสงค์ของวะซีร์"
 viz_extravagance.t3.treasure.plants: "ตัวละครนี้ครอบครองคอลเลกชันที่มีชื่อเสียงของพืช มอส และสมุนไพรหายาก — แต่ละชนิดเก็บไว้ในกระถางคริสตัลห้าร้อยใบ"

 viz_extravagance.t3.activities.feasts.surprise: "ตัวละครนี้เป็นที่รู้จักในการจัดงานเลี้ยงที่มีการบริจาคเซอร์ไพรส์ให้กับแขกที่มีเสน่ห์: เรื่องตลกที่เฉียบแหลมได้รับรางวัลเป็นปศุสัตว์หมื่นตัว ชุดที่สวยงามได้รับรางวัลเป็นพระราชวังรอบนอกและคนรับใช้ หรือการสนทนาที่น่าสนใจได้รับรางวัลเป็นเสื้อคลุมผ้าไหมย้อมสี"
 viz_extravagance.t3.activities.aid: "ตัวละครนี้ ทำให้ขุนนางที่อยู่ใกล้เคียงที่ดินของพวกเขาพอใจด้วยของขวัญเล็กๆ น้อยๆ ที่นี่และที่นั่น: พรมหรูหราร้อยผืน อานม้าชั้นดีสามพันอัน อำพันทะเลสิบสองหม้อ หอกดีหนึ่งหมื่นเล่ม อะไรทำนองนั้น"
 viz_extravagance.t3.activities.scholars.debates: "ตัวละครนี้เชิญนักวิชาการทุกแขนงจากทั่วโลกที่รู้จักกันมายังการรวมตัวของพวกเขา ชื่นชมยินดีในการสนทนาที่เกิดจากปัญญาชนที่ยิ่งใหญ่ที่สุดแห่งยุคนั่งอยู่ที่โต๊ะเดียวกัน"
 viz_extravagance.t3.activities.feasts.give_away: "ตัวละครนี้ชอบจัดงานเลี้ยงให้กับพันธมิตร ผู้ติดตาม และพรรคพวกที่ภักดี — โดยบังเอิญอย่างหมดจด พวกเขามักจะมอบทรัพย์สินมูลค่าค่าไถ่ของเจ้าชายในงานดังกล่าว แต่ดูเหมือนจะมีของขวัญราคาแพงเหลือเฟือที่จะมอบให้อีกเสมอ"
 viz_extravagance.t3.activities.land_and_livestock_grants: "ฝูงปศุสัตว์ที่มากมายของตัวละครนี้เป็นตำนานท้องถิ่น จำนวนสัตว์ที่พวกเขามอบให้เป็นรางวัลสำหรับการบริการที่ดีหรือการชดเชยเพื่อการกุศลมีจำนวนหลายหมื่นตัวทุกปี"
 viz_extravagance.t3.activities.feasts.spectacle: "งานเลี้ยงของตัวละครนี้เน้นไปที่ความตระการตา: หากพวกเขาไม่สามารถอวดอ้าง #EMP อย่างน้อย #! นักกายกรรมที่กำลังทรงตัวบนเสาที่มียอดเป็นเด็กที่กำลังเล่นกลถ่านร้อน แล้วจะมีประโยชน์อะไร?"
 viz_extravagance.t3.activities.feasts.coin_shower: "ตัวละครนี้ชอบแสดงความมั่งคั่งอย่างตรงไปตรงมาในงานเลี้ยงของพวกเขา: พวกเขามักจะโปรยเหรียญหลายร้อยหรือหลายพันเหรียญลงบนแขกคนโปรดของพวกเขาเป็นประจำ"
 viz_extravagance.t3.activities.gambling.palanquin: "ตัวละครนี้อ้างว่าได้คิดค้นและเชี่ยวชาญกีฬาที่แปลกประหลาด: การแข่งเสลี่ยง ซึ่งคนแบกเสลี่ยงของพวกเขาแข่งขันกับผู้ท้าชิงเพื่อแบกภาระของตนไปยังส่วนที่กำหนดของ [ROOT.Char.GetCapitalLocation.GetTitle.GetNameNoTierNoTooltip] ในเวลาที่ดีที่สุด"
 viz_extravagance.t3.activities.orgies: "ตัวละครนี้จัดงานเลี้ยงอย่างเปิดเผยโดยเน้นที่ความสุขทางกามารมณ์ ซึ่งแขกจะได้รับการปรนเปรอและบริการอย่างเต็มที่และมันเยิ้มที่สุด"
 viz_extravagance.t3.activities.parades: "ตัวละครนี้เชื่อว่าความมั่งคั่งจะไร้ประโยชน์หากถูกปกปิด: พวกเขามีความหลงใหลในการจัดขบวนแห่เพื่ออวดสัตว์เลี้ยงแปลกใหม่ ม้าชั้นดี คนรับใช้ที่ได้รับการดูแลอย่างดี และเครื่องใช้ราคาแพง ทั้งหมดนี้แห่ไปตามถนนของ [ROOT.Char.GetCapitalLocation.GetTitle.GetNameNoTierNoTooltip] เป็นประจำ"

 viz_extravagance.t3.property.pool.cushions: "ตัวละครนี้ดูแลสระน้ำขนาดใหญ่ที่บุด้วยเบาะรองนั่ง — การลงไปแช่น้ำ ไม่ควรเป็นเหตุผลที่จะขาดความหรูหรา"
 viz_extravagance.t3.property.businesses: "ผลประโยชน์ทางธุรกิจของตัวละครนี้เป็นความยุ่งเหยิงที่ซับซ้อนและวกวนของเส้นทางการค้าที่เชื่อมต่อกัน การผูกขาด การอุปถัมภ์ และที่ดิน"
 viz_extravagance.t3.property.palace.huge: "ตัวละครนี้ดูแลรักษาพระราชวัง ซึ่ง อย่างเป็นทางการ มีขนาดเล็กกว่า #EMP เล็กน้อย #! ของ [ROOT.Char.GetTitleAsNamePossessiveNoTooltip] ผู้ที่เคยเห็นด้วยตนเองโดยทั่วไปมักมีความสงสัย"
 viz_extravagance.t3.property.bathhouse: "ตัวละครนี้ดูแลโรงอาบน้ำส่วนตัวที่ประณีตสำหรับตนเองและพันธมิตรที่ใกล้ชิดที่สุด ซึ่งเป็นศูนย์กลางทางการเมืองสำหรับกลอุบายที่สกปรกที่สุด แต่สะอาดหมดจด ใน [ROOT.Char.GetCapitalLocation.GetTitle.GetNameNoTierNoTooltip]"
 viz_extravagance.t3.property.stables: "ตัวละครนี้มีคอกม้าขนาดมหึมา ซึ่งเป็นที่อยู่ของม้าที่ดีที่สุดในอาณาจักรหลายร้อยตัวหรือมากกว่านั้น"
 viz_extravagance.t3.property.pool.gold: "ตัวละครนี้เป็นเจ้าของสระน้ำที่พื้นปูด้วยเหรียญทองคำหนาเตอะ — ความมั่งคั่งจะมีประโยชน์อะไรหากคุณไม่สามารถลอยอยู่เหนือมันได้?"
 viz_extravagance.t3.property.fleet.commercial: "ตัวละครนี้เป็นเจ้าของเรือพาณิชย์ส่วนตัวหลายสิบลำ ซึ่งเป็นกองเรือที่แท้จริงของยานพาหนะที่กระจายไปทั่วโลก"
 viz_extravagance.t3.property.business.stolen: "ตัวละครนี้ดูเหมือนจะเข้าครอบครองธุรกิจขนาดเล็กที่ไม่สามารถชำระหนี้ได้อยู่เสมอ ไม่ว่าจะต่อผู้ให้กู้ต่างๆ หรือต่อรัฐเอง การรักษาตัวรอด ทำให้คนส่วนใหญ่ไม่แสดงความคิดเห็นเกี่ยวกับเรื่องนี้"
 viz_extravagance.t3.property.tycoon: "ตัวละครนี้เป็นเจ้าของเกือบหนึ่งในสี่ของ [ROOT.Char.GetCapitalLocation.GetTitle.GetNameNoTierNoTooltip] โดยทั้งเขตอยู่ภายในที่ดินส่วนตัวของพวกเขา"
 viz_extravagance.t3.property.den_of_vice: "มีข่าวลือว่าตัวละครนี้เป็นเจ้าของแหล่งมั่วสุมที่ฉาวโฉ่ที่สุดแห่งหนึ่งใน [ROOT.Char.GetCapitalLocation.GetTitle.GetNameNoTierNoTooltip] ซึ่งเป็นสถานประกอบการที่สามารถหาสารแปลกใหม่ชนิดใดก็ได้ แน่นอนว่าต้องมีเงินมากพอ"

 viz_extravagance.t3.charity.observatories: "ตัวละครนี้อุปถัมภ์หอดูดาวขนาดใหญ่ เฝ้าดูท้องฟ้าและบันทึกการเคลื่อนที่ของดวงดาว"
 viz_extravagance.t3.charity.universities: "ตัวละครนี้ให้ทุนสนับสนุนมหาวิทยาลัยท้องถิ่นขนาดเล็ก แต่มีชื่อเสียงหลายแห่ง ส่งเสริมทุนการศึกษาและวิชาการในนามของพวกเขา"
 viz_extravagance.t3.charity.libraries: "เหรียญของตัวละครนี้มักจะนำไปใช้ในการสร้าง ขยาย และอนุรักษ์ห้องสมุดที่คัดสรรจำนวนหนึ่ง คัดลอกผลงานที่ยิ่งใหญ่เพื่อเผยแพร่ความรู้ในหมู่ขุนนาง"
 viz_extravagance.t3.charity.bathhouses: "ตัวละครนี้ได้สร้างและยังคงให้เงินอุดหนุนโรงอาบน้ำสาธารณะขนาดใหญ่ใน [ROOT.Char.GetCapitalLocation.GetTitle.GetNameNoTierNoTooltip] ทำให้พวกเขาเป็นที่นิยมในหมู่สามัญชนที่ มิฉะนั้นอาจต้องดิ้นรนเพื่อจ่ายค่าความหรูหราที่กว้างขวาง เช่นนี้"
 viz_extravagance.t3.charity.hospitals.equipment: "ตัวละครนี้ไม่เพียง แต่ให้ทุนสนับสนุนโรงพยาบาลท้องถิ่นเท่านั้น แต่ยังใช้เวลา เพื่อให้แน่ใจว่าโรงพยาบาลเหล่านั้นมีขี้ผึ้งทางการแพทย์ เครื่องมือผ่าตัด และอุปกรณ์ทางการแพทย์ลึกลับต่างๆ ที่ทันสมัยที่สุด"
 viz_extravagance.t3.charity.civil_service.expansion: "ตัวละครนี้ให้เงินเดือนสำหรับตำแหน่งบริหารที่หลากหลาย กระจายภาระงานประจำวันให้เท่าเทียมกันมากขึ้นและลดแรงกดดันต่อรัฐ"
 viz_extravagance.t3.charity.watermills: "ตัวละครนี้ให้ทุนสนับสนุนการสร้างกังหันน้ำส่วนกลางในหมู่บ้านที่ยากจนและพื้นที่ชนบทอื่นๆ ซึ่งช่วยปรับปรุงคุณภาพชีวิตของพวกเขาได้อย่างมาก"
 viz_extravagance.t3.charity.beggar_spies: "ความหวาดระแวงในตำนานของตัวละครนี้ถูกกล่าวหาว่าขยายไปถึงการจ้างขอทานและคนจรจัดครึ่งหนึ่งของอาณาจักรไว้ในบัญชีเงินเดือน โดยให้พวกเขามีอาหารและที่พักเป็นครั้งคราวเพื่อแลกกับหูตาของพวกเขา"
 viz_extravagance.t3.charity.hajj_water_tanks: "ตัวละครนี้จ่ายเงินเป็นการส่วนตัวสำหรับการสร้างและเติมอ่างเก็บน้ำนอกนครเมกกะอันศักดิ์สิทธิ์ ซึ่งน้ำจะช่วยหล่อเลี้ยงผู้แสวงบุญที่กระหายน้ำ ซึ่งกำลังประกอบพิธีฮัจญ์อันชอบธรรม"
 viz_extravagance.t3.charity.holy_warrior_gear: "ตัวละครนี้บริจาคอาวุธและชุดเกราะเป็นประจำให้กับทหารที่รับใช้ศาสนกิจต่างๆ ไม่ว่าจะเป็นการบุกโจมตีศัตรูของศรัทธาหรือปกป้องผู้ที่นับถือศรัทธา"

 viz_extravagance.t4.treasure.cushions: "ตัวละครนี้เป็นเจ้าของเบาะรองนั่งหลายพันหลายหมื่นใบ เป็นกองผ้าแพรต่วนและผ้าไหมที่หลั่งไหลลงมาแทบไม่มีที่สิ้นสุด ซึ่ง ทำให้ทุกห้องในทุกที่พักของพวกเขาน่ารื่นรมย์ในการนั่ง (หรือแม้กระทั่งงีบหลับ)"
 viz_extravagance.t4.treasure.martial_gear: "ตัวละครนี้ชอบของเล่นเกี่ยวกับสงครามมากเกินไปเล็กน้อย มีรายงานว่าพวกเขามีอาวุธและชุดเกราะตก แต่งมากกว่าที่ [ROOT.Char.GetTitleAsNameNoTooltip] มี #EMP ของจริง #! เสียอีก"
 viz_extravagance.t4.treasure.cosmetics: "ตัวละครนี้ครอบครองน้ำหอมมูลค่าค่าไถ่ของจักรพรรดิ: อำพันทะเลล้ำค่าเป็นโถ น้ำกุหลาบหอม กลิ่นหอมของฆาลียะห์ ผงชะมดเชียง สารสกัดจากไม้กฤษณา และแน่นอน หญ้าฝรั่น ทั้งหมดนี้อยู่ในปริมาณและภาชนะที่สามารถจ่ายค่ากองทัพได้ทั้งกองทัพ"
 viz_extravagance.t4.treasure.office: "สำนักงานวะซีร์ของตัวละครนี้แกะสลักจาก และตก แต่งด้วย หินและกระจกฝังโลหะราคาแพง แผ่พลังอำนาจที่สงบและมั่นคง"
 viz_extravagance.t4.treasure.crockery.historic: "ตัวละครนี้ดูแลรักษาชุดเครื่องใช้บนโต๊ะอาหารและช้อนส้อมสำหรับงานเลี้ยงครบชุด ซึ่งมีรายงานว่า แต่ละชิ้นเคยเป็นของผู้ปกครองอาณาจักรต่างแดนที่แปลกใหม่หรือจักรวรรดิโบราณที่ล่มสลายไปแล้ว"
 viz_extravagance.t4.treasure.precious_orchard: "ตัวละครนี้มีชื่อเสียงในเรื่องสวนผลไม้อันล้ำค่าของพวกเขา: ลานที่เต็มไปด้วยต้นไม้เทียมที่หล่อจากทองคำและเงิน ซึ่งออกผลไม้หลากหลายชนิดที่แกะสลักจากอัญมณี"
 viz_extravagance.t4.treasure.fleet.personal: "ตัวละครนี้มีชื่อเสียงในเรื่องรูปลักษณ์ที่โดดเด่นของเรือสำราญส่วนตัวของพวกเขา รวมถึงเรือและยานพาหนะขนาดเล็กจำนวนมากที่แล่นไปตามทางน้ำของ [ROOT.Char.GetCapitalLocation.GetTitle.GetNameNoTierNoTooltip] ในนามของพวกเขา"
 viz_extravagance.t4.treasure.massive_sword: "ตัวละครนี้เป็นเจ้าของดาบตก แต่งที่ยาวเท่ากับทหารสามคนนอนต่อกัน ซึ่งวางอยู่ตามผนังกว้างด้านหนึ่งของโถงโปรดของพวกเขาอย่างฉาวโฉ่"
 viz_extravagance.t4.treasure.mystic_ingredients: "มีเสียงกระซิบเกี่ยวกับตัวละครนี้เกี่ยวกับคอลเลกชันส่วนผสมทางเล่นแร่แปรธาตุที่แปลกใหม่ของพวกเขา: พืชต่างประเทศที่แปลกประหลาด แร่ธาตุแปลกๆ จากใต้พื้นโลก และผงที่ได้จากเนื้อและกระดูกของสิ่งมีชีวิตในตำนาน"
 viz_extravagance.t4.treasure.sensible_investments_for_smart_adults: "ตัวละครนี้เป็นเจ้าของต้นฉบับที่ประดับประดาเพียงเล่มเดียว ซึ่งมีภาพลิงที่ไม่น่าดู — มีรายงานว่าผลงานชิ้นนี้มีราคาแพงอย่างไม่สมเหตุสมผล แต่ที่มาของมูลค่านี้ไม่ชัดเจน"

 viz_extravagance.t4.activities.feasts.pool.rose: "ตัวละครนี้เป็นที่รู้จักในการจัดงานเลี้ยงที่สระน้ำของพวกเขาเต็มไปด้วยดอกไม้มูลค่าหลายหมื่นเหรียญ ซึ่งเป็นภาพที่หอมหวนในระดับที่เกินกว่าที่แขกส่วนใหญ่จะได้เห็นในชีวิต"
 viz_extravagance.t4.activities.give_aways: "ตัวละครนี้มอบของขวัญตามอำเภอใจ ซึ่งมีมูลค่ามหาศาลกว่าโชคลาภที่แม้ แต่พ่อค้าที่โชคดีที่สุดก็หวังว่าจะทำได้ในชั่วชีวิต"
 viz_extravagance.t4.activities.feasts.big: "สิ่งที่ตัวละครนี้เรียกว่า 'งานเลี้ยงส่วนตัวในหมู่เพื่อนฝูง' คนส่วนใหญ่มักจะเรียกว่า 'เทศกาลที่ยิ่งใหญ่ที่จัดขึ้นทุกทศวรรษ'"
 viz_extravagance.t4.activities.menagerie: "สวนสัตว์ของตัวละครนี้มีสัตว์เลื้อยคลานส่งเสียงขู่ นกที่สดใส สัตว์เลี้ยงลูกด้วยนมขนาดใหญ่ และดูเหมือนจะมีบางอย่างจากสัตว์นานาชนิดที่โลกมีให้"
 viz_extravagance.t4.activities.aid: "ความเอื้อเฟื้อเผื่อแผ่ของตัวละครนี้จ่ายค่าแพ็คเกจความช่วยเหลือที่มากมายจน 'ขุนนาง' ที่ถูกกล่าวหาบางคนในบริเวณใกล้เคียงดูเหมือนจะพึ่งพาการแจกจ่ายของพวกเขาโดยสิ้นเชิงเพื่อรักษาหน้าตา"
 viz_extravagance.t4.activities.host: "ตัวละครนี้ถือว่าการต้อนรับนักการทูตต่างประเทศมีความสำคัญสูงสุด รองลงมาจากการใช้จ่ายเหรียญจำนวนมหาศาลเพื่อแสดงให้เห็นว่าอาณาจักรของแขกนั้นด้อยกว่าเพียงใดเมื่อเปรียบเทียบกัน"
 viz_extravagance.t4.activities.gambling.xtra_xtreme: "ตัวละครนี้พนันเหรียญ สัตว์ ที่ดิน ชีวิต และสิ่งอื่นใดที่พวกเขาพอใจ — ทั้งหมดนี้ในปริมาณมหาศาลจนบางคนสงสัยว่าความมั่งคั่งของพวกเขา #EMP ไม่มีที่สิ้นสุด #! จริงหรือไม่"
 viz_extravagance.t4.activities.masquerade: "ตัวละครนี้จัดงานเลี้ยงสวมหน้ากากเป็นประจำ โดยกำหนดธีมจากประวัติศาสตร์และตำนานให้แขกปฏิบัติตาม และคาดหวังให้ แต่ละคนใช้จ่ายรายได้หนึ่งเดือนหรือมากกว่านั้นสำหรับทุกชุด"
 viz_extravagance.t4.activities.plants.ever_changing: "ตัวละครนี้เชื่อว่าความหลากหลายของเครื่องเทศคือชีวิต และดูแลรักษาสวนที่มีพืช กลิ่นหอม และสมุนไพรแปลกใหม่ที่เปลี่ยนแปลงตลอดเวลา ทั้งหมดนี้เบ่งบานและออกผลในเวลาต่างๆ ของปีและภายใต้สภาวะที่แตกต่างกัน"
 viz_extravagance.t4.activities.feasts.cannibal: "ทุกคนเห็นพ้องกันว่าตัวละครนี้จัดงานเลี้ยงที่อร่อยที่สุดบางงานที่อาณาจักรเคยรู้จัก เต็มไปด้วยเนื้อชิ้นฉ่ำ — แม้ว่าจะมีเพียงไม่กี่คนที่เห็นพ้องกันว่าต้องเป็นเนื้อชนิดใด"

 viz_extravagance.t4.property.palace.pool: "ตัวละครนี้ดูแลรักษาพระราชวังแยกต่างหากเพื่อเป็นที่ตั้งของสระน้ำขนาดใหญ่ของพวกเขา พวกเขาอาศัยอยู่ที่อื่น และด้วยวิธีนี้จึงสามารถแยกห้องส่วนตัวและสำนักงานออกจากที่ที่พวกเขาให้ความบันเทิงแก่แขกได้อย่างสมบูรณ์"
 viz_extravagance.t4.property.palace.spa: "ตัวละครนี้เป็นเจ้าของสถานที่พักผ่อนในชนบทที่กว้างขวางนอก [ROOT.Char.GetCapitalLocation.GetTitle.GetNameNoTierNoTooltip] ซึ่งเป็นสถานที่เงียบสงบห่างจากความเร่งรีบและวุ่นวายของเมือง ซึ่งรักษาความเป็นส่วนตัวด้วยที่ดินโดยรอบหลายเอเคอร์"
 viz_extravagance.t4.property.army: "ตัวละครนี้ดูแลกองทัพส่วนตัวของอันธพาลและนักล้วงกระเป๋า พร้อมที่จะบังคับใช้เจตจำนงของตนได้ทุกที่ใน [ROOT.Char.GetCapitalLocation.GetTitle.GetNameNoTierNoTooltip]"
 viz_extravagance.t4.property.livestock: "ฝูงสัตว์ส่วนตัวขนาดใหญ่ของตัวละครนี้ ทั้งม้าและสัตว์ใช้งาน แผ่ขยายไปทั่วอาณาจักร"
 viz_extravagance.t4.property.palace.guest: "ตัวละครนี้เก็บพระราชวังส่วนตัวไว้สำหรับแขกที่มาเยี่ยมโดยเฉพาะ — เป็นการแสดงออกถึงความมั่งคั่งและอำนาจที่น้อยคนนักจะไม่สังเกตเห็น"
 viz_extravagance.t4.property.spire: "ตัวละครนี้ดำเนินธุรกิจวะซีร์ส่วนใหญ่จากหอคอยสูงตระหง่านที่ดูน่ากลัว ซึ่งสูงกว่าอาคารส่วนใหญ่ใน [ROOT.Char.GetCapitalLocation.GetTitle.GetNameNoTierNoTooltip] มีรายงานว่าสามารถมองเห็นทุกตรอกซอกซอยและมุมถนนจากหน้าต่างจำนวนมากได้"
 viz_extravagance.t4.property.palace.monthly: "ตัวละครนี้ดูแลรักษาพระราชวังหนึ่งโหลหรือมากกว่านั้นทั่ว [ROOT.Char.GetCapitalLocation.GetTitle.GetNameNoTierNoTooltip] โดยหมุนเวียนจากที่หนึ่งไปยังอีกที่หนึ่งทุกเดือน"
 viz_extravagance.t4.property.bordello: "ตัวละครนี้จัดหาพนักงานให้กับซ่องส่วนตัว ซึ่งศิลปินคนโปรดของพวกเขามาเยี่ยมเยียนเพื่อมอบความสุขที่ลามกที่สุดให้แก่พวกเขาเป็นประจำ"
 viz_extravagance.t4.property.gaol: "ตัวละครนี้เป็นเจ้าของคุกสำหรับลูกหนี้ส่วนตัว — เมื่อคนจนไม่สามารถชำระหนี้ให้กับวะซีร์ได้ การลงโทษก็รวดเร็วและชัดเจน จนกว่าครอบครัวของพวกเขาจะหาเงินมาได้ หวังว่าจะเป็น เช่นนั้น"
 viz_extravagance.t4.property.palace.torture: "'นรกของ [ROOT.Char.GetDiarchy.GetDiarch.GetFirstNameNoTooltip]' พวกเขาเรียกมันว่า — สวนแห่งความสุขแปลกประหลาดและเครื่องมืออันน่าสะพรึงกลัวที่ร่ำลือกันว่าตัวละครนี้ใช้ทรมานศัตรูและคู่แข่งของตน"

 viz_extravagance.t4.charity.waystations: "ตัวละครนี้จ่ายเงินสำหรับสถานีพักแรมและคาราวานเซรายทั่วทั้งอาณาจักร โดยเน้นการให้บริการแก่กลุ่มเล็กๆ และนักเดินทางที่โดดเดี่ยว"
 viz_extravagance.t4.charity.bridges: "ตัวละครนี้มีชื่อเสียงในด้านเงินที่พวกเขาใช้ในการสร้างและบำรุงรักษาสะพานใหม่ทั่วทั้งอาณาจักร ซึ่งเป็นเครื่องหมายแห่งเกียรติภูมิสูงสุดสำหรับข้าราชการพลเรือนทุกคน"
 viz_extravagance.t4.charity.dole: "ตัวละครนี้ให้เงินอุดหนุนการแจกจ่ายอาหารส่วนตัวแก่พลเมืองที่ขัดสนที่สุดของ [ROOT.Char.GetCapitalLocation.GetTitle.GetNameNoTierNoTooltip] เพื่อให้แน่ใจว่าไม่มีใครอดอยากโดยสิ้นเชิง ในขณะที่พวกเขามีเหรียญเหลือเฟือ"
 viz_extravagance.t4.charity.housing: "ตัวละครนี้ให้ทุนสนับสนุนการก่อสร้างอาคารห้องเช่าขนาดเล็กในส่วนที่ว่างของ [ROOT.Char.GetCapitalLocation.GetTitle.GetNameNoTierNoTooltip] หรือติดกับกำแพงเมือง สำหรับผู้ที่ต้องการที่พักพิงมากที่สุด"
 viz_extravagance.t4.charity.gardens: "ตัวละครนี้จ่ายเงินค่าบำรุงรักษาสวนสาธารณะขนาดใหญ่ — ป้อมปราการเล็กๆ แห่งความสงบสุขในโลกที่บางครั้งอาจดูโหดร้ายเกินไป"
 viz_extravagance.t4.charity.civil_service.fire: "ตัวละครนี้รับผิดชอบเป็นการส่วนตัวในการบำรุงรักษาหน่วยดับเพลิงสำหรับ [ROOT.Char.GetCapitalLocation.GetTitle.GetNameNoTierNoTooltip] — ซึ่งแทบไม่เคยได้ยินในส่วนอื่นๆ ของโลก"
 viz_extravagance.t4.charity.aqueducts: "ตัวละครนี้รับผิดชอบในการสร้างและบำรุงรักษาท่อส่งน้ำสั้นๆ หลายแห่งที่นำน้ำจืดเข้าสู่ [ROOT.Char.GetCapitalLocation.GetTitle.GetNameNoTierNoTooltip] ซึ่งเป็นสิ่งที่ ทำให้พวกเขาได้รับความกตัญญูจากคนยากจนที่สุดในสังคมจำนวนมาก"
 viz_extravagance.t4.charity.festivals: "ตัวละครนี้จ่ายเงินสำหรับเทศกาลใหญ่ประจำปีที่จะจัดขึ้นสำหรับผู้อยู่อาศัยทั้งหมดของ [ROOT.Char.GetCapitalLocation.GetTitle.GetNameNoTierNoTooltip] ซึ่งเป็นงานที่เมืองรอคอยตลอดทั้งปี"
 viz_extravagance.t4.charity.pilgrimage: "ตัวละครนี้ดำเนินกองทุนการกุศลที่ให้เบี้ยเลี้ยง อุปกรณ์ที่เหมาะสม และความรู้ด้านการเดินทางแก่ผู้คนเพื่อออกเดินทางแสวงบุญที่ประสบความสำเร็จ"
 viz_extravagance.t4.charity.loans: "ตัวละครนี้ดำเนินกองทุนการกุศลที่จัดการการชำระหนี้สินและหนี้สิน ไม่ว่าจะถูกกฎหมายหรือไม่ก็ตาม ที่ส่งผลกระทบต่อคนจนในอาณาจักร"

