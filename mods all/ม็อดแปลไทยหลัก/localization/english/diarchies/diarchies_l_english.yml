 unlock_adjust_imperial_bureaucracy_interaction: "[diarchs|E] สามารถร้องขอปรับ [imperial_bureaucracy|E] ของ [liege|E] ของตนได้ โดย:\n$SPACE4$$EFFECT_LIST_BULLET$รวมศูนย์อำนาจ โดยรับผิดชอบค่าใช้จ่ายและบทลงโทษทาง [opinion|E]\n$SPACE4$$EFFECT_LIST_BULLET$กระจายอำนาจ โดยลด [strife|E] ของตน"
 unlock_scapegoat_counterpart_interaction: "ทั้ง [diarch|E] และ [liege|E] อาจโจมตีคู่ของตนต่อสาธารณะ:\n$SPACE4$$EFFECT_LIST_BULLET$ได้รับ [influence|E]\n$SPACE4$$EFFECT_LIST_BULLET$ทำลาย [opinion|E] ของอีกฝ่ายที่มีต่อตน\n$SPACE4$$EFFECT_LIST_BULLET$ก่อปัญหาใน [realm|E]\n$SPACE4$$EFFECT_LIST_BULLET$ปรับตามความเก่งกาจด้าน [diplomacy|E] หรือ [intrigue|E] ที่เหนือกว่า"
 unlock_diarch_requests_military_expedition_interaction: "[diarch|E] สามารถร้องขอการเข้าถึง [casus_belli|E] [imperial_expedition_cb|E] จาก [liege|E] ของตน โดยได้รับดินแดนที่พวกเขาสามารถเก็บไว้หรือมอบให้เพื่อแลกกับ [influence|E] จำนวนมาก"
 unlock_diarch_demand_kingdom_interaction: "[diarchs|E] ระดับ [duchy|E]-[title_tier|E] สามารถเรียกร้อง [governorship|E] ระดับ [kingdom|E]-$game_concept_title_tier$ ของตนเองได้"

