 # GUESTS
 # PHASES
 hunt_phase:0 "ล่าสัตว์"
 hunt_type_standard:0 "ล่าสัตว์"
 hunt_type_standard_desc:1 "$EFFECT_LIST_BULLET$ เลือกเหยื่อจากสัตว์ท้องถิ่นหลากหลายชนิด\n$EFFECT_LIST_BULLET$ เพิ่ม [trait_level_track_xp|E] ของลักษณะนิสัย [GetTrait('lifestyle_hunter').GetName( GetNullCharacter )] $trait_track_hunter$\n$EFFECT_LIST_BULLET$ [hunt_danger_no_prefix|E] ที่สูงขึ้นจะให้ [prestige_i|E][prestige|E] มากขึ้น\n$EFFECT_LIST_BULLET$ เพศที่เน้นการต่อสู้อาจเข้าร่วมอย่างแข็งขัน\n$EFFECT_LIST_BULLET$ เพศที่ไม่เน้นการต่อสู้อาจเข้าชม\n#weak สัตว์ร้ายที่หยิ่งผยองและเจ้าเล่ห์ท่องไปในป่า การชิงไหวชิงพริบและเอาชนะพวกมันเป็นการทดสอบความกล้าหาญและฝึกฝนทักษะ#!"
 hunt_type_legendary:1 "ในตำนาน"
 hunt_type_legendary_desc:1 "$EFFECT_LIST_BULLET$ ค้นหาสัตว์ในตำนานที่พบเห็นในพื้นที่\n$EFFECT_LIST_BULLET$ เพิ่ม [trait_level_track_xp|E] ของลักษณะนิสัย [GetTrait('lifestyle_hunter').GetName( GetNullCharacter )] $trait_track_hunter$\n$EFFECT_LIST_BULLET$ [hunt_danger_no_prefix|E] ที่สูงขึ้นจะให้ [prestige_i|E][prestige|E] มากขึ้น\n$EFFECT_LIST_BULLET$ เพศที่เน้นการต่อสู้อาจเข้าร่วม\n$EFFECT_LIST_BULLET$ เพศที่ไม่เน้นการต่อสู้อาจเข้าชม\n#weak ผู้มีการศึกษามักมองว่าสัตว์ในตำนานเป็นเพียงเรื่องเล่า แต่ป่าไม้อาจยังคงมีความลึกลับซ่อนอยู่มากมาย#!"
 hunt_type_falconry:1 "การล่าด้วยเหยี่ยว"
 hunt_type_falconry_desc:1 "$EFFECT_LIST_BULLET$ เลือกเหยื่อจากนกที่เป็นเหยื่อล่าหลากหลายชนิด\n$EFFECT_LIST_BULLET$ เพิ่ม [trait_level_track_xp|E] ของลักษณะนิสัย [GetTrait('lifestyle_hunter').GetName( GetNullCharacter )] $trait_track_falconer$\n$EFFECT_LIST_BULLET$ ทั้งสองเพศอาจเข้าร่วม\n#weak แม้จะมีค่าใช้จ่ายสูง การล่าด้วยเหยี่ยวฮอว์กและฟอลคอนมอบความสุขในการควบคุมธรรมชาติที่หาใดเปรียบมิได้ในบรรดากิจกรรมของชนชั้นสูง#!"

 # OPTIONS
 hunt_option_attendants:0 "ผู้ติดตาม"
 hunt_attendants_few:0 "ผู้ดูแลสัตว์ป่าท้องถิ่น"
 hunt_attendants_few_desc:1 "#weak กลุ่มผู้ติดตามนักล่ากลุ่มเล็กๆ ได้รับความช่วยเหลือจากผู้ดูแลสัตว์ป่าท้องถิ่น#!"
 hunt_attendants_normal:0 "กลุ่มค้นหา"
 hunt_attendants_normal_desc:1 "$BULLET_WITH_TAB$เพิ่ม [hunt_success_chance_no_prefix|E] บ้าง$hunt_attendants_roco_tt$\n\n#weak กลุ่มคนรับใช้ช่วยในการค้นหาและต้อนเหยื่อ#!"
 hunt_attendants_many:0 "กลุ่มไล่ต้อน"
 hunt_attendants_many_desc:1 "$BULLET_WITH_TAB$เพิ่ม [hunt_success_chance_no_prefix|E] อย่างเห็นได้ชัด$hunt_attendants_roco_tt$\n\n#weak กลุ่มนักล่าที่ทุ่มเทพร้อมที่จะไล่ตามและนำทางเหยื่อ#!"
 hunt_option_party_size:0 "ขนาดกลุ่ม"
 hunt_party_size_few:0 "กลุ่มเล็กเป็นกันเอง"
 hunt_party_size_few_desc:0 "$BULLET_WITH_TAB$[GetPlayer.Custom('GetHuntMasterTooltipDesc')] ของท่าน, [GetCourtPositionType('bodyguard_court_position').GetName()], [GetCourtPositionType('court_physician_court_position').GetName()], [spouses|E], [friends|E], [lovers|E], และนักล่าเข้าร่วม\n\n#weak กลุ่มเล็กๆ ของคนสนิทและข้าราชสำนักที่ไว้ใจได้#!"
 hunt_party_size_normal:0 "กลุ่มขนาดพอเหมาะ"
 hunt_party_size_normal_desc:0 "$BULLET_WITH_TAB$ได้รับ [prestige_i|E][prestige|E] มากขึ้นเมื่อเสร็จสิ้น\n$BULLET_WITH_TAB$ $knight_culture_player_plural$ ที่ไม่มีที่ดิน และ [courtiers|E] และ [guests|E] ที่มีลักษณะนิสัย [GetTrait('lazy').GetName( GetNullCharacter )] หรือได้รับการศึกษาด้านการต่อสู้เข้าร่วม\n\n#weak กลุ่มบุคคลสำคัญและข้าราชสำนักในอาณาจักรจำนวนพอสมควร#!"
 hunt_party_size_many:0 "กลุ่มขนาดใหญ่"
 hunt_party_size_many_desc:0 "$BULLET_WITH_TAB$ได้รับ [prestige_i|E][prestige|E] มากขึ้นอย่างมากเมื่อเสร็จสิ้น\n$BULLET_WITH_TAB$[courtiers|E] และ [guests|E] ทั้งหมดเข้าร่วม\n\n#weak ส่วนสำคัญของราชสำนัก อาณาจักร และบริเวณโดยรอบ#!"
