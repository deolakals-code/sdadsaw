 # Conclusion Desc
 activity_hunt_conclusion_desc_legendary_success:0 "การล่า [activity.Custom('GetAnimalType')] [activity.Custom('GetLegendaryColor')] ในตำนานสิ้นสุดลงแล้ว! จะมีบทเพลงขับขานถึงวันนี้ และความสามารถที่จำเป็นในการโค่นล้มสัตว์ร้าย เช่นนี้!"
 activity_hunt_conclusion_desc_legendary:0 "การตามล่า [activity.Custom('GetLegendaryColor')] [activity.Custom('GetAnimalType')] ที่ยากจะจับตัวได้ยังคงดำเนินต่อไป โดยยังไม่เห็นจุดสิ้นสุด..."
