ach_intent_faction_joining_prevention_modifier_desc: "#weak ตัวละครนี้ไม่สามารถเริ่มหรือเข้าร่วมฝ่ายต่าง ๆ ได้#!\nผู้คัดค้านที่เสียงดังระหว่างพิธีบรมราชาภิเษกขององค์อธิปัตย์ผู้เพิ่งสวมมงกุฎ, ถูก ทำให้เงียบงันด้วยความโอ่อ่าของพิธีการ"
ach_intent_imprisonment_modifier: "ผู้คัดค้านที่หวาดกลัว: การคุมขัง"
ach_intent_imprisonment_modifier_desc: "#weak ตัวละครนี้ถูกคุมขังได้ง่ายขึ้น#!\nผู้คัดค้านที่เสียงดังต่อองค์อธิปัตย์ผู้เพิ่งสวมมงกุฎ, ความโอ่อ่าของพิธีบรมราชาภิเษกได้ข่มขู่พวกเขาให้ยอมจำนน"
ach_intent_better_councillors_modifier: "โอบรับผู้สนับสนุน: ที่ปรึกษา"
ach_intent_better_councillors_modifier_desc: "ตัวละครนี้เป็นผู้สนับสนุนอย่างแข็งขันขององค์อธิปัตย์ผู้เพิ่งสวมมงกุฎ และกระตือรือร้นเป็นพิเศษที่จะพิสูจน์ตนเองในฐานะที่ปรึกษา"
ach_intent_vassal_development_boost_modifier: "โอบรับผู้สนับสนุน: การพัฒนา"
ach_intent_vassal_development_boost_modifier_desc: "พืชผลที่งอกงาม, ไม้และหินที่เพิ่งตัดมาเพื่อการก่อสร้าง: ดินแดนของตัวละครนี้ได้รับความเจริญทางเศรษฐกิจ, ต้องขอบคุณองค์อธิปัตย์ผู้เพิ่งสวมมงกุฎ"
