  coronation_location_holy_site_host: "[THIS.Province.GetName] #bol ไม่#!ใช่ [holy_site|E] ใน [realm|E] ของท่าน ([head_of_faith|E] ของท่านไม่ได้ครอบครอง [holy_site|E] ใด ๆ)"
 coronation_location_neither_capital_nor_holy_site: "[THIS.Province.GetName] #bol ไม่#!ใช่ [county_capital|E] หรือ [holy_site|E]"

 # Phases
 coronation_phase_preparations: "โหมโรง"
 coronation_phase_preparations_desc: ""
 coronation_phase_coronation: "พิธีการ"
 coronation_phase_coronation_desc: ""
 coronation_phase_feast: "งานเลี้ยง"
 coronation_phase_feast_desc: ""

 # Types
 coronation_type_normal: "พิธีบรมราชาภิเษก"
 coronation_type_normal_desc: "$BULLET_WITH_TAB$พิสูจน์ [legitimacy_i][legitimacy|E] ของท่าน\n$BULLET_WITH_TAB$กล่าว [oath|E] และปฏิญาณตนถึงแนวทางการปกครองของท่าน\n$BULLET_WITH_TAB$อาจได้รับ [opinion_i][opinion|E] จาก [vassals|E] [AddLocalizationIf( GetPlayer.GetGovernment.HasGovernmentFlag( 'government_is_mandala' ), 'coronation_type_tributaries' )]\n$BULLET_WITH_TAB$[vassals|E] อาจละทิ้ง @faction_icon![factions|E]\n$BULLET_WITH_TAB$อาจสวมมงกุฎให้ตนเองเพื่อรับ [prestige_i][prestige|E] เพิ่มเติม\n\n#weak $coronation_type_normal_flavor$#!"
 coronation_type_normal_flavor: "พิธีอันสง่างามจักพิสูจน์ความชอบธรรมในการปกครองของท่าน และขอบขัณฑสีมาแห่งอาณาจักรจักเป็นดั่งอาภรณ์แห่งองค์อธิปัตย์"
 coronation_type_tributaries: "และ [tributaries|E]"
 coronation_type_anointment: "พิธีเจิม"
 coronation_type_anointment_desc: "$BULLET_WITH_TAB$พิสูจน์ [legitimacy_i][legitimacy|E] ของท่านให้ปราศจากข้อกังขา\n$BULLET_WITH_TAB$ได้รับ [piety_i][piety|E], @fervor_icon![fervor|E] และความโปรดปรานจาก [vassals|E] [GetVassalStance( 'zealot' ).GetTextIcon][GetVassalStance( 'zealot' ).GetName|U]\n$BULLET_WITH_TAB$กล่าว [oath|E] และปฏิญาณตนถึงแนวทางการปกครองของท่าน\n$BULLET_WITH_TAB$ได้รับ [opinion_i][opinion|E] จาก [vassals|E]\n$BULLET_WITH_TAB$ได้รับ [opinion_i][opinion|E] จาก [rulers|E] อื่น ๆ\n$BULLET_WITH_TAB$[vassals|E] อาจละทิ้ง @faction_icon![factions|E]\n$BULLET_WITH_TAB$@alert_icon! #alert_trial ต้องจัดใน [holy_site|E] ของ [faith|E] ของท่าน#!\n\n#weak $coronation_type_anointment_flavor$#!"
 coronation_type_anointment_flavor: "องค์อธิปัตย์ที่แท้จริงต้องอบอวลด้วยจุดประสงค์อันศักดิ์สิทธิ์ และได้รับการสถาปนาโดยความโปรดปรานแห่งทวยเทพ กำลังทางโลกมิอาจเทียบแทนได้"

 # Options
 anointment_minimum: "[activity_option|E] ไม่พร้อมใช้งานสำหรับ [anointment|E]"
 ceremony_size: "พิธีการ"
 coronation_small_ceremony: "พิธีการอย่างเรียบง่าย"
 coronation_small_ceremony_desc: "$EFFECT_LIST_BULLET$ลด [coronation_magnificence|E]\n$EFFECT_LIST_BULLET$[rulers|E] ต่างแดนจะไม่เข้าร่วม [activity|E]\n$EFFECT_LIST_BULLET$หาก [coronation_magnificence|E] ต่ำกว่า #high 50#! เมื่อสิ้นสุด ท่านจะได้รับ [GetModifier('ach_coronation_low_ceremony_modifier').GetNameWithTooltip] เป็นเวลา #high 10 ปี#!\n\n#weak ข้าเป็นองค์อธิปัตย์อยู่แล้วมิใช่หรือ? เหตุใดต้องเชิญผู้คนทั้งอาณาจักรมาในพิธีการที่เป็นเพียงพิธีรีตองนี้ด้วย...?#!"
 coronation_medium_ceremony: "ความวิจิตรตามแบบแผน"
 coronation_medium_ceremony_desc: "$EFFECT_LIST_BULLET$เพิ่ม [coronation_magnificence|E]\n$EFFECT_LIST_BULLET$[activity_guests|E] จะมีแนวโน้มเข้าร่วมมากขึ้นเล็กน้อย\n\n#weak คำสาบานอันศักดิ์สิทธิ์แห่งการปกครองจำต้องคู่ควรกับสภาพแวดล้อมอันสูงส่งและการชุมนุมอันยิ่งใหญ่ที่เปี่ยมด้วยความเคารพ#!"
 coronation_large_ceremony: "ความรุ่งโรจน์และสง่างาม"
 coronation_large_ceremony_desc: "$EFFECT_LIST_BULLET$เพิ่ม [coronation_magnificence|E] อย่างมาก\n$EFFECT_LIST_BULLET$[activity_guests|E] จะมีแนวโน้มเข้าร่วมมากขึ้นอย่างมาก\n\n#weak ท่ามกลางโบราณวัตถุศักดิ์สิทธิ์และอัญมณีอันเปล่งประกาย เปี่ยมด้วยดนตรีอันไพเราะ จะมีญาติพี่น้อง ข้าหลวง และแขกผู้ทรงเกียรติจากแดนไกล#!"
 ceremony_feast_type: "การเฉลิมฉลอง"
 ceremony_feast_type_austere: "การเฉลิมฉลองอย่างสมถะ"
 ceremony_feast_type_austere_desc: "$EFFECT_LIST_BULLET$ลด [coronation_magnificence|E]\n$EFFECT_LIST_BULLET$หาก [coronation_magnificence|E] ต่ำกว่า #high 50#! เมื่อสิ้นสุด ท่านจะได้รับ [SelectLocalization( GetPlayer.GetGovernment.HasGovernmentFlag( 'government_is_mandala' ), 'mandala_coronation_low_feast', 'generic_coronation_low_feast' )] เป็นเวลา #high 10 ปี#!\n\n#weak เพียงแค่ได้รับเชิญมาในโอกาสสำคัญทางประวัติศาสตร์นี้ยังไม่นับเป็นความยินดีเพียงพออีกหรือ...?#!"
 generic_coronation_low_feast: "[GetModifier('ach_coronation_low_feast_modifier').GetNameWithTooltip]"
 mandala_coronation_low_feast: "[GetModifier('mandala_coronation_low_feast_modifier').GetNameWithTooltip]"
 ceremony_feast_type_regular: "งานรื่นเริงที่เหมาะสม"
 ceremony_feast_type_regular_desc: "$EFFECT_LIST_BULLET$เพิ่ม [coronation_magnificence|E]\n\n#weak จะมีการประหยัดเล็กน้อยในการชุมนุมอันยิ่งใหญ่ของเหล่าขุนนาง และอาหารรสเลิศในงานเลี้ยงหลังพิธี#!"
 ceremony_feast_type_lavish: "งานเลี้ยงอันหรูหรา"
 ceremony_feast_type_lavish_desc: "$EFFECT_LIST_BULLET$เพิ่ม [coronation_magnificence|E] อย่างมาก\n$EFFECT_LIST_BULLET$ลดความเสี่ยงของเหตุการณ์เชิงลบ\n\n#weak อาหารเลิศรสที่ส่งกลิ่นหอมหวนนานาชนิดรอคอยอยู่; ความสุโขสโมสรที่งดงามเพื่อสนับสนุนโต๊ะเสวยอันสูงส่งของกษัตริย์#!"

ach_coronation_low_ceremony_modifier: "สวมมงกุฎในความมืดมน"
ach_coronation_low_ceremony_modifier_desc: "เหล่าสามัญชนแทบไม่รู้ด้วยซ้ำว่าผู้ปกครองนี้คือเจ้าเหนือหัวที่แท้จริงของพวกเขา และเหล่าขุนนางก็ยินดีที่จะลืมเลือนพิธีเข้ารับตำแหน่งอันแสนขัดสนของพวกเขา"
ach_coronation_low_feast_modifier: "ขุนนางผู้ถูกเมิน"
ach_coronation_low_feast_modifier_desc: "การเฉลิมฉลองอันน่าอดสูและแสนขัดสนรอบพิธีบรมราชาภิเษกของผู้ปกครองนี้ ทำให้ผู้เข้าร่วมเต็มไปด้วยความดูแคลน และท้องว่างเปล่าจากอาหารเลิศรส"
mandala_coronation_low_feast_modifier: "อาณาประชาราษฎร์ผู้ถูกเมิน"
mandala_coronation_low_feast_modifier_desc: "$ach_coronation_low_feast_modifier_desc$"

 # Special Guests
 coronation_hof_guest: "ประมุขแห่งศรัทธา"
 coronation_hof_guest_desc: "$coronation_hof_guest_desc_for_host$"
 coronation_hof_guest_for_host: "ประมุขแห่งศรัทธา"
 coronation_hof_guest_desc_for_host: "ใน [anointment|E] [head_of_faith|E] จะต้องเป็น [activity_guest|E] เพื่อให้ถือว่า [legitimate|E]\n\nได้รับการสนับสนุนจากประมุขแห่งศรัทธาด้วย [interaction|E] [anointment_request|E]"

 # Doctrines related to Coronations
 doctrine_coronation_name: "ธรรมเนียมพิธีบรมราชาภิเษก"
 doctrine_no_anointment_name: "ไม่มีพิธีเจิม"
 doctrine_no_anointment_desc: "ในศรัทธานี้ ไม่มีน้ำมันศักดิ์สิทธิ์ใดสัมผัสหน้าผากของผู้ปกครอง — เส้นทางสู่อำนาจของพวกเขาปราศจากพิธีเจิมหรือพิธีกรรมอันศักดิ์สิทธิ์"
 doctrine_anointment_permitted_name: "อนุญาตให้มีพิธีเจิม"
 doctrine_anointment_permitted_desc: "แม้ แต่จักรพรรดิก็ไม่ก้มหัวให้กับพิธีกรรมใดเพียงหนึ่งเดียว — แม้ว่าประมุขแห่งศรัทธาอาจเป็นประธานในพิธี แต่ทางเลือกในการสวมมงกุฎนั้นขึ้นอยู่กับบัลลังก์เอง"
 doctrine_imperial_anointment_name: "พิธีเจิมของจักรวรรดิ"
 doctrine_imperial_anointment_desc: "เพื่อปกครองในฐานะจักรพรรดิเหนือข้อสงสัยใด ๆ ผู้นั้นต้องคุกเข่า — เพราะมีเพียงประมุขแห่งศรัทธาเท่านั้นที่สามารถมอบอำนาจสิทธิ์ขาดสุดท้ายนั้นได้"
 doctrine_parameter_no_anointment: "[characters|E] ไม่สามารถเข้าถึง [activity_option|E] [coronation_anointment|E] ได้"
 doctrine_parameter_theocratic_coronation: "[characters|E] สามารถเข้าถึง [activity_option|E] [coronation_anointment|E] ได้"
 doctrine_parameter_imperial_anointment: "[characters|E] ที่มี [title_tier|E] [empire|E] หรือสูงกว่าต้องใช้ [activity_option|E] [coronation_anointment|E] เพื่อรับ [law|E] [GetLaw('crowned_emperor').GetName]"
 doctrine_parameter_coronation_artifact: "[characters|E] ของ [faith|E] นี้ต้องมี [artifact|E] ประเภท [FAITH.Custom('CoronationRequiresArtifact')] เพื่อเข้าถึง [activity_options|E] เพิ่มเติม"
