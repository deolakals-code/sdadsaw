 ### Events
 # Oaths
 coronation_events.0100.t: "คำสัตย์สาบานแห่งยุคสมัย"
 # Intro
 coronation_events.0100.desc.opening: "ที่ประชุมกำลังจับจ้องข้า บ้างก็ด้วยความหวัง บ้างก็ด้วยความกังขา ทั้งหมดรอคอยให้ข้ากล่าวถึงการปกครองของข้า และสาบานต่ออนาคต ข้าได้ยินคำถามที่พวกเขาไม่ได้เอ่ยออกมา ข้าจะเที่ยงธรรมหรือไม่? ข้าจะยุติธรรมหรือเปล่า?"
 # Mid section
 coronation_events.0100.desc.previous_ruler_close_family: "ข้าจะทำได้เทียบเท่า [ROOT.Char.Custom2( 'RelationToMeShort', previous_ruler )] ของข้าหรือไม่?"
 coronation_events.0100.desc.previous_ruler_not_family_no_house: "ข้าจะก้าวข้ามผู้ดำรงตำแหน่งก่อนหน้า, [previous_ruler.GetFirstNameNicknamed] ได้หรือไม่?"
 coronation_events.0100.desc.previous_ruler_not_family: "ข้าจะก้าวข้ามผู้ดำรงตำแหน่งก่อนหน้า, [previous_ruler.GetFullNameNoTooltip], ได้หรือไม่?"
 coronation_events.0100.desc.first_ruler: "ข้าจะปกครองในฐานะ [ROOT.Char.GetTitleAsNameNoTooltip|l] คนแรกของดินแดนนี้อย่างไร?"
 # Outro
 coronation_events.0100.desc.outro: "\n\nข้าไม่ได้ยืนอยู่ที่นี่, ในฐานะ [ROOT.Char.GetTitleAsNameNoTooltip|l], เพื่อตอบสนองความคาดหวังของพวกเขา ข้ามาเพื่อเลือกเส้นทางของข้าเอง และหนทางข้างหน้าสำหรับ [ROOT.Char.GetPrimaryTitle.GetTierAsNameNoTooltip|l]\n\nไม่ว่า [ROOT.Char.GetPrimaryTitle.GetNameNoTier] จะเป็น เช่นใด — ไม่ว่าข้าจะเป็น เช่นใด — ทุกสิ่งเริ่มต้น ณ ชั่วขณะนี้"
