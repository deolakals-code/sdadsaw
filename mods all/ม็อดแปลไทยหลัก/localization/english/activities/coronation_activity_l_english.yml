# Host activity rewards

coronation_events.0310.t: "เจตจำนงของ [ROOT.Char.GetTitleAsNamePossessiveNoTooltip]"
coronation_events.0310.desc.high_magnificence: "ข้าได้พากเพียรอย่างไม่เหน็ดเหนื่อยเพื่อส่งเสริมเกียรติยศ, เพื่อบ่มเพาะความยิ่งใหญ่แห่งพิธีบรมราชาภิเษกของข้า เหล่าแขกเหรื่อเปี่ยมล้นไปด้วยแรงบันดาลใจจากสิ่งที่พวกเขาได้ประจักษ์ ณ ที่นี้, แผ่ซ่านความชื่นชมยินดี มันเป็นการเริ่มต้นที่เหมาะสมสำหรับการครองราชย์ของข้าในฐานะ [ROOT.Char.GetTitleAsNameNoTooltip|l]\n\n"
coronation_events.0310.desc.mid_magnificence: "บัดนี้ข้าคือ [ROOT.Char.GetTitleAsNameNoTooltip|l] โดยสมบูรณ์ พิธีบรมราชาภิเษกของข้าได้พิสูจน์แล้วว่าคู่ควรแก่ยศฐาของข้า, เป็นภาพอันงดงามสำหรับเหล่าแขกเหรื่อ, ซึ่งหลายคนยังคงอ้อยอิ่งอยู่ด้วยความหวังว่าจะได้ฟังถ้อยคำ [ROOT.Char.Custom('GetTitleTierAdjective')] สุดท้ายอีกสักสองสามคำ\n\n"
coronation_events.0310.desc.low_magnificence: "การเฉลิมฉลองใกล้จะสิ้นสุดลงแล้ว มีเสียงกระซิบกระซาบมากมายเกี่ยวกับความโกลาหล, ความตึงเครียด, และสิ่งอำนวยความสะดวกอันลวก ๆ บัดนี้ข้าอาจยืนอยู่โดยมีคำครหานินทาดังอยู่ในหู และอาหารเก่าบูดเน่าอยู่ในท้อง... แต่สิ่งเดียวที่สำคัญคือในที่สุดข้าก็ได้เป็น [ROOT.Char.GetTitleAsNameNoTooltip|l] อย่างสมบูรณ์\n\n"
coronation_events.0310.desc.impress_attendees: "ตั้งแต่ต้นจนจบ, ข้าไม่ละเว้นความพยายามใด ๆ เพื่อสร้างความประทับใจให้แก่ผู้เข้าร่วมทุกคน — ทั้งมิตรและศัตรู! แต่การปรากฏตัวอย่างเป็นธรรมของข้า, การมุ่งเน้นอย่างเต็มที่ต่อความสำเร็จของการชุมนุมอันยิ่งใหญ่นี้...\n\nทั้งหมดนี้เพื่อสิ่งใดกัน?"
coronation_events.0310.desc.weaken_detractors: "เหล่าผู้คัดค้านที่อวดดีและ [first_char.Custom('InsultAdjective')], [first_char.GetName] และ [second_char.GetName] ก็อยู่ในหมู่พวกเขา, ช่างกล้าหาญนักที่มาร่วมพิธีบรมราชาภิเษกของข้า... และข้าก็ได้ตอบสนองพวกเขาด้วยความเกรี้ยวกราด [ROOT.Char.Custom('GetTitleTierAdjective')] ที่พวกเขาสมควรได้รับ! พวกเขามาเพื่อขุดคุ้ยจุดอ่อนของข้า, แต่กลับพบเพียงความดูแคลนอันเย็นชาและความมุ่งมั่นอันแข็งแกร่งดุจเหล็กกล้า\n\nบางที, ข้าควรจะมอบหมัดเด็ดสุดท้ายอันเจ็บแสบ..."
coronation_events.0310.desc.embrace_supporters: "ทุกโอกาสที่มี, ข้าให้ความสำคัญกับผู้ที่ภักดีต่อข้าและมงกุฎของข้ามากที่สุด เรา, ผู้สนับสนุนของข้าและตัวข้า, ได้ร่วมกันวางแผนและไตร่ตรอง, และต่างยกย่องคุณสมบัติของกันและกัน [first_char.GetName], [second_char.GetName], และคนอื่น ๆ ได้กลายเป็นวงในของข้า\n\nความไว้วางใจของพวกเขาอาจกลายเป็นสิ่งที่จับต้องได้มากกว่านี้"
coronation_events.0310.desc.exalt_crown: "ข้ายังคงยึดมั่นในความเชื่อที่ว่าเกียรติยศแห่งมงกุฎคือทุกสิ่ง การทดสอบที่ข้าเผชิญในสถานที่นี้, การต่อสู้เล็ก ๆ น้อย ๆ ภายใน — ล้วนเป็นปัญหาที่ผ่านพ้นไป, แต่ [ROOT.Char.GetPrimaryTitle.GetNameNoTier] จะยังคงอยู่! ข้าได้ถ่ายทอดความเชื่ออันยิ่งใหญ่นี้แก่แขกของข้า, และศรัทธาของพวกเขาต่ออาณาจักรก็เพิ่มพูนขึ้น\n\nแต่การเทิดทูนทั้งหมดนี้จะนำไปสู่จุดจบใด?"
