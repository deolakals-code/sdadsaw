 coronation_events.0110.t: "คำสัตย์สาบาน"
 coronation_events.0110.desc.intro: "[activity.GetHost.GetFirstName] ยืนอยู่เบื้องหน้าฝูงชนด้วย [activity.GetHost.GetHerselfHimself] ขณะที่ทุกคนรอคอยคำสัตย์สาบานของ [activity.GetHost.GetHerHis]\n\n"
 ## Diplomacy
 coronation_events.0110.desc.diplomacy_oath_1: "#emp \"ไม่มีอาณาจักรใดรุ่งเรืองได้โดยลำพัง อำนาจมิได้อยู่ที่กองทัพเท่านั้น แต่ยังอยู่ในสายสัมพันธ์แห่งความไว้เนื้อเชื่อใจ ในพันธสัญญาที่หล่อหลอมด้วยคำพูดและเจตจำนง\n\nจาก [activity.GetHost.GetCapitalLocation.GetName] ข้าจะยื่นมือแห่งมิตรภาพ ถักทอพันธมิตรที่จะปกป้อง [activity.GetHost.GetPrimaryTitle.GetNameNoTier] ไปอีกหลายชั่วอายุคน\"#!"
 coronation_events.0110.desc.diplomacy_oath_2: "#emp \"ความแข็งแกร่งของอาณาจักรมิได้อยู่ที่พันธมิตรที่ได้มาเท่านั้น แต่อยู่ในคำมั่นสัญญาอันเงียบงันแห่งความต่อเนื่อง โดยการทำให้แน่ใจว่า [activity.GetHost.GetHouse.GetName] จะยังคงอยู่ ข้าจะมอบรากฐานที่มั่นคงดั่งศิลาให้กับอาณาจักร\n\nผ่านทางลูกหลานของเรา สายเลือดของ [activity.GetHost.GetHouse.GetName] จะยังคงไม่ขาดสาย รักษาเสถียรภาพและนำทางอาณาจักรของเราผ่านพ้นทุกสิ่งที่อาจมาถึง\"#!"
 ## Martial
 coronation_events.0110.desc.martial_oath_1: "#emp \"ข้าลุกขึ้นในวันนี้ไม่เพียงเพื่อปกครอง แต่เพื่อสร้างสรรค์ ไม่เพียงเพื่อรักษาสิ่งที่เป็นอยู่ แต่เพื่อสร้างสิ่งที่อาจเป็นไปได้ [activity.GetHost.GetPrimaryTitle.GetNameNoTier] ไม่สามารถถูกจำกัดอยู่แค่ในความทรงจำหรือแผนที่ มันต้องเติบโต\n\nเพื่ออนาคตของเรา และอนาคตของปวงชนของเรา\"#!"
 coronation_events.0110.desc.martial_oath_2: "#emp \"เนิ่นนานเกินไปแล้ว ที่ดินแดนอันเป็นของ [activity.GetHost.GetPrimaryTitle.GetNameNoTier] ต้องทนทุกข์ภายใต้การปกครองของผู้อ่อนด้อยกว่า ของผู้ที่เข้าใจผิดว่าการครอบครองคือความชอบธรรม\n\nมันจะจบลงเดี๋ยวนี้ จาก [activity.GetHost.GetCapitalLocation.GetName] พวกเขาจะได้รู้จักการปกครองที่แท้จริง โดยข้า\"#!"
 ## Stewardship
 coronation_events.0110.desc.stewardship_oath_1: "#emp \"ผู้ปกครองต้องทำมากกว่าการปกป้องพรมแดน พวกเขาต้องทำให้ชีวิตภายในพรมแดนนั้นควรค่าแก่การมีอยู่ ข้าจะพิทักษ์สันติภาพ ดูแลอาณาจักร และวางแผนไม่ใช่เพื่อสงคราม แต่เพื่อการเติบโต\n\nจาก [activity.GetHost.GetCapitalLocation.GetName] ข้าจะนำพา [activity.GetHost.GetPrimaryTitle.GetNameNoTier] ผ่านยุคทองใหม่\"#!"
 coronation_events.0110.desc.stewardship_oath_2: "#emp "มรดกทั้งหมดไม่ได้เกิดจากสงคราม บางส่วนถูกสร้างขึ้นด้วยหิน ด้วยหยาดเหงื่อและจุดมุ่งหมาย ข้าจะปรับโฉม [activity.GetHost.GetPrimaryTitle.GetNameNoTier] ด้วยอนุสรณ์สถานที่คู่ควรกับอนาคต\n\nจาก [activity.GetHost.GetCapitalLocation.GetName] ข้าจะยกอาณาจักรไม่เพียงเพื่อให้อยู่รอด แต่เป็นอาณาจักรที่เข้าสู่ยุคทองที่หล่อหลอมด้วยความใส่ใจและวิสัยทัศน์"#! "
 ## Intrigue

 ## Learning
 coronation_events.0110.desc.learning_oath_1: "#emp "อย่าให้ผู้ปกครองใดเข้าใจผิดว่าความเขลาคือความแข็งแกร่ง อาณาจักรที่นำทางด้วยความรู้แจ้งย่อมอยู่รอดได้นานกว่าอาณาจักรใด ๆ ที่สร้างขึ้นจากความกลัวเพียงอย่างเดียว\n\nจาก [activity.GetHost.GetCapitalLocation.GetName] ข้าจะรวบรวมผู้มีปัญญาที่สุด และผ่านคำแนะนำของพวกเขา ข้าจะกำหนดอนาคตของ [activity.GetHost.GetPrimaryTitle.GetNameNoTier]\"#!"
 ## Purge Pretenders
 coronation_events.0110.desc.purge_pretenders_oath: "#emp \"ผู้อ้างสิทธิ์จอมปลอมต่อ [activity.GetHost.GetPrimaryTitle.GetName] ได้เพิ่มจำนวนขึ้นราวกับหนูในท่อระบายน้ำ และเช่นเดียวกับสัตว์รำคาญ พวกมันทั้งหมดต้องถูกกำจัด\"#!"
 ## End the Struggle
 coronation_events.0110.desc.end_the_struggle_oath: "#emp \"[activity.GetHost.MakeScope.Var('end_the_struggle_oath_type_var').Struggle.GetName] ได้สูบเลือดเนื้อชาว [activity.GetHost.GetCulture.GetCollectiveNoun] ผู้ดีงามมาหลายชั่วอายุคน พอ กัน ที ข้าจะยุติการสิ้นเปลืองทรัพยากรอันไร้ค่านี้ให้จงได้ และนำพายุคใหม่แห่งความรุ่งเรืองร่วมกันมาสู่ดินแดนนี้ ขอ [activity.GetHost.GetFaith.HighGodName] ทรงเป็นพยาน\"#!"
 ## Greatest Hunter
 coronation_events.0110.desc.greatest_hunter_oath: "#emp \"การล่ามิใช่เพียงการทดสอบทักษะ แต่เป็นการเฉลิมฉลองชีวิตและธรรมชาติ ข้าจะเป็นสุดยอดนักล่า ผู้เชี่ยวชาญแห่งพงไพร องค์อธิปัตย์ที่แท้จริงแห่งใจกลางดินแดนเถื่อนของ [activity.GetHost.GetPrimaryTitle.GetNameNoTier]\"#!"
 ## Heir Preparation
 coronation_events.0110.desc.heir_preparation_oath: "#emp \"หากปราศจากทายาทที่เหมาะสม [activity.GetHost.GetDynasty.GetName] ก็มีแต่จะถูกลืมเลือน ข้าจะนำทางการศึกษาของทายาทของข้า ปลูกฝังคุณค่าและปัญญาที่จำเป็นเพื่อยกระดับ [activity.GetHost.GetDynasty.GetName] สู่จุดสูงสุดใหม่\"#!"
 ## Install Claimants
 coronation_events.0110.desc.install_claimants_oath: "#emp \"การอ้างสิทธิ์ในบัลลังก์โดยชอบธรรมมิใช่เพียงเรื่องของสายเลือด แต่เป็นเรื่องของความยุติธรรม ข้าจะสนับสนุนผู้อ้างสิทธิ์โดยชอบธรรมสู่บัลลังก์ของพวกเขา ขับไล่ผู้แย่งชิงและฟื้นฟูระเบียบ\"#!"
 ## Mend the Fracture
 coronation_events.0110.desc.mend_the_fracture_oath: "#emp \"รอยร้าวทางวัฒนธรรมในอาณาจักรได้ก่อให้เกิดความขัดแย้งมานานเกินไปแล้ว ข้าจะรวมผู้คนเข้าด้วยกันภายใต้ธง [activity.GetHost.GetHouse.GetName] เดียวกัน ขณะที่ยังคงรักษาอัตลักษณ์ของพวกเขาไว้\"#!"
 ## Provide for the Warriors
 coronation_events.0110.desc.provide_for_the_warriors_oath: "#emp \"นักรบแห่ง [activity.GetHost.GetPrimaryTitle.GetNameNoTier] คือดาบและโล่ของข้า ข้าจะทำให้แน่ใจว่าพวกเขามีอาวุธยุทโธปกรณ์ครบครันและพร้อมที่จะปกป้องดินแดนของเรา\"#!"
 ## Provide for the Faithful
 coronation_events.0110.desc.provide_for_the_faithful_oath: "#emp \"ผู้ศรัทธาแห่ง [activity.GetHost.GetPrimaryTitle.GetNameNoTier] คือกระดูกสันหลังแห่งอาณาจักรของข้า ข้าจะทำให้แน่ใจว่าความต้องการทางโลกของพวกเขาได้รับการตอบสนอง และอนุญาตให้พวกเขามุ่งเน้นไปที่การเป็นผู้รับใช้ที่อุทิศตนของ [ROOT.Char.GetFaith.HighGodName] มุ่งเน้นไปที่ความรอดของ [activity.GetHost.GetPrimaryTitle.GetTierAsNamePossessive] ของข้า\"#!"
 ## Provide for the Poor
 coronation_events.0110.desc.provide_for_the_poor_oath: "#emp \"ผู้ยากไร้แห่ง [activity.GetHost.GetPrimaryTitle.GetNameNoTier] คือเกลือแห่งแผ่นดิน คือแสงสว่างของโลก พวกเขาตรากตรำทำงานอย่างเงียบ ๆ เพื่อประโยชน์ของทุกคน ข้าจะทำให้แน่ใจว่าแม้แต่ผู้ที่ยากจนที่สุดในอาณาจักรของข้าก็สามารถมีชีวิตอยู่ได้อย่างมีศักดิ์ศรีและความหวัง\"#!"
 ## Repent
 coronation_events.0110.desc.repent_oath: "#emp \"สิ่งใดเล่าจะเปลี่ยนวิถีแห่ง [activity.GetHost.GetWomanMan] ได้? เจตจำนงของข้าเพียงพอหรือเปล่า? ข้าจะโน้มน้าว [activity.GetHost.GetFaith.GetAdherentNamePlural] ผู้อื่นได้หรือไม่ ข้าจะทำให้ [activity.GetHost.GetFaith.HighGodName] ประจักษ์ได้หรือไม่ว่าข้าสำนึกในบาปของตนอย่างแท้จริง? อาจเป็นความโง่เขลาที่พยายาม ทว่าคงเป็นบาปมหันต์หากมิได้พยายามเลย\"#!"

 ## Other
 coronation_events.0110.desc.fallback_compassionate: "#emp \"ข้าขอปฏิญาณว่าจะธำรงไว้ซึ่งกฎหมายและธรรมเนียมอันเป็นธรรมทั้งปวงแห่งชนชาว [activity.GetHost.GetPrimaryTitle.GetAdjective] จะปกครองด้วยปัญญาอันอ่อนโยน และพิพากษาด้วยความเมตตาปรานี\"#!"
 coronation_events.0110.desc.fallback_honorable: "#emp \"ข้าขอปฏิญาณว่าจะรักษาความสงบเรียบร้อยและความปรองดองแห่ง [activity.GetHost.GetFaith.AltPriestTermPlural] ของ [activity.GetHost.GetFaith.HighGodNamePossessive] ใน [activity.GetHost.GetPrimaryTitle.GetNameNoTier] และจะธำรงไว้ด้วยเกียรติของข้าซึ่งเสรีภาพและสิทธิแห่งราษฎรของข้า\"#!"
 coronation_events.0110.desc.fallback_feckless: "#emp \"ข้า... เอ้อ... ขอปฏิญาณคำสัตย์อันสมควรแห่ง [activity.GetHost.GetTierAsName] ของ [activity.GetHost.GetPrimaryTitle.GetNameNoTierPossessive]... นับแต่นี้ไปจะกระทำตามที่ [activity.GetHost.GetFaith.AltPriestTermPlural] ประสงค์ และจะขานรับเมื่ออาณาจักรร้องเรียกหา [activity.GetHost.GetTierAsNameNoTooltip] ของมัน และอะไรต่อมิอะไร...\"#!"
 coronation_events.0110.desc.fallback: "#emp \"ข้าขอปฏิญาณ ด้วยการปกครองของข้า จะนำมาซึ่งความรุ่งโรจน์แก่ [activity.GetHost.GetPrimaryTitle.GetNameNoTier] ความเคารพต่อธรรมเนียมของปวงชน และเกียรติยศแห่ง [activity.GetHost.GetPrimaryTitle.GetTierAsNameNoTooltip]\"#!"
 coronation_events.0110.regular: "เราจะคอยดูว่า [activity.GetHost.GetSheHe] จะสามารถรักษาคำพูดเหล่านี้ได้หรือไม่..."
 coronation_events.0110.no_oath: "คำกล่าวแห่งพิธีการ มิใช่แห่งประวัติศาสตร์"
 coronation_events.0110.desc.outro: ""


 coronation_events.0150.t: "คำสัตย์สาบานที่ผิดสัญญา: [SCOPE.Custom('GetOathSpecific')|V]"
 coronation_events.0150.desc: "ข้าได้ยินเสียงกระซิบของพวกเขาหลังประตูที่ปิดอยู่ ข้าเห็นความผิดหวังตราตรึงในดวงตาของพวกเขา และข้ารู้สึกถึงน้ำหนักของความอัปยศที่กดทับข้าอยู่\n\nพวกเขาทุกคนรู้ - ข้าล้มเหลว ข้าผิดคำสัตย์สาบานที่ข้าลั่นวาจาไว้ว่าจะรักษา สัญญาที่ข้าให้ไว้กับอาณาประชาราษฎร์ทั้งมวล\n\nบัดนี้ข้าจะเผชิญหน้าพวกเขาได้อย่างไร? ข้าจะแบกรับความอัปยศนี้ได้อย่างไร?"
 coronation_events.0150.desc_honest: "อำนาจมาพร้อมกับพันธสัญญา ข้ายืนอยู่เบื้องหน้าอาณาจักรและสาบานคำสัตย์ที่พวกเขาเชื่อมั่น - คำสัตย์ที่ #emp ข้า#! เชื่อมั่น\n\nบัดนี้บัลลังก์ให้ความรู้สึกเหมือนสุสานมากกว่าที่นั่ง กรงทองอันหนาวเหน็บที่เยาะเย้ยข้าทุกครั้งที่หายใจ และส่วนที่เลวร้ายที่สุดคือการที่รู้ว่าทั้งหมดนี้เป็นความผิดของข้าเอง"
 coronation_events.0150.desc_deceitful: "ปล่อยให้พวกเขากระซิบไป ปล่อยให้พวกเขาจ้องมองด้วยความภาคภูมิใจที่บาดเจ็บและความผิดหวังอันกลวงเปล่า ข้าเห็นมัน ข้ารู้สึกถึงการตัดสินของพวกเขาราวกับคมดาบที่จ่อหลังข้า\n\nแต่ความอัปยศหรือ? ไม่ ความอัปยศมีไว้สำหรับผู้ที่ตั้งใจจะรักษาสัญญาตั้งแต่แรก\n\nคำสัตย์สาบานนั้นศักดิ์สิทธิ์สำหรับคนโง่เท่านั้น"
 coronation_events.0150.a: "ช่างน่าอับอาย..."
 coronation_events.0150.a_honest: "ข้าจะมีชีวิตอยู่กับความอัปยศนี้ได้อย่างไร?"
 coronation_events.0150.a_deceitful: "มันก็เป็น เช่นนี้แหละ"
 coronation_events.150.custom_list_tooltip: "[vassal|E], [courtier|E], หรือ [guest|E] ทุกคน"

 coronation_events.0175.t: "คำสัตย์สาบานที่ลุล่วง: [SCOPE.Custom('GetOathSpecific')|V]"
 coronation_events.0175.desc: "ภารกิจของข้าเสร็จสิ้นแล้ว ตรงตามที่ข้าได้ลั่นวาจาไว้ ข้าได้ยินเสียงเยาะหยันจากผู้คัดค้าน ความมั่นใจของพวกเขาว่าข้าจะล้มเหลวเมื่อข้ากล่าวคำสัตย์สาบาน\n\nแต่ข้าได้พิสูจน์แล้วว่าพวกเขาคิดผิด เสียงของผู้กังขาในตัวข้าได้เปลี่ยนไป และบัดนี้พวกเขามอบเกียรติยศที่พวกเขาเคยคิดว่าเกินเอื้อมแก่ข้า\n\nวันใหม่ได้มาถึงเราแล้ว..."
 coronation_events.0175.a: "และ [ROOT.Char.GetPrimaryTitle.GetNameNoTierNoTooltip] ที่แข็งแกร่งกว่าเดิมก็พร้อมที่จะเผชิญหน้ากับมัน!"

 ## Diplomacy
 diplomacy_oath_1_tooltip: "ข้าสาบาน [oath|E] ที่จะ #V สร้างพันธมิตรที่มั่นคง#!:\n\t$EFFECT_LIST_BULLET$ต้องมีอย่างน้อย #V 3#! [alliances|E] กับ [rulers|E] ซึ่ง:\n\t\t$EFFECT_LIST_BULLET$มี [opinion|E] ต่อ #V ท่าน#! อย่างน้อย #V 50#!\n\t\t$EFFECT_LIST_BULLET$หนึ่งในข้อดังต่อไปนี้:\n\t\t\t$EFFECT_LIST_BULLET$มี [title_tier|E] ต่ำกว่าหนึ่งขั้น\n\t\t\t$EFFECT_LIST_BULLET$มี [title_tier|E] เดียวกัน\n\t\t\t$EFFECT_LIST_BULLET$มี [title_tier|E] สูงกว่า\n\t$EFFECT_LIST_BULLET$ต้อง ทำให้สำเร็จภายใน #V 20 ปี#!\n\t$EFFECT_LIST_BULLET$รางวัล: [legitimacy_i][legitimacy|E], [prestige_i][prestige|E], [opinion_i][opinion|E], [cultural_acceptance_i][cultural_acceptance|E], และ [GetModifier('oath_of_alliances').GetNameWithTooltip]"
 diplomacy_oath_2_tooltip: "ข้าสาบาน [oath|E] ที่จะ #V เสริมสร้างตระกูล#!:\n\t$EFFECT_LIST_BULLET$ต้องมี [children|E] [legitimate|E] อย่างน้อย #V 7#! คน #weak (ปัจจุบัน [host.MakeScope.ScriptValue('children_oath_value')|V0]/#V 7#!)#!\n\t$EFFECT_LIST_BULLET$ต้อง ทำให้สำเร็จภายใน #V 30 ปี#!\n\t$EFFECT_LIST_BULLET$รางวัล: [legitimacy_i][legitimacy|E], [prestige_i][prestige|E], [dynasty_prestige_i][dynasty_prestige|E] และ [GetModifier('oath_of_children').GetNameWithTooltip]"
 ## Martial
 martial_oath_1_tooltip: "ข้าสาบาน [oath|E] ที่จะ #V รวบรวม [host.GetPrimaryTitle.GetNameNoTierNoTooltip] ให้เป็นปึกแผ่น#!:\n\t$EFFECT_LIST_BULLET$[host.GetPrimaryTitle.GetName] ต้อง [completely_control|E] พรมแดน [de_jure|E] ของตน #low (ปัจจุบัน [host.MakeScope.ScriptValue('oath_reconquest_value_1')|V0]/[host.MakeScope.ScriptValue('oath_reconquest_value_2')|V0])#!\n$EFFECT_LIST_BULLET$ต้อง ทำให้สำเร็จภายใน #V 20 ปี#!\n$EFFECT_LIST_BULLET$รางวัล: [legitimacy_i][legitimacy|E], [prestige_i][prestige|E], และ [GetModifier('oath_of_reconquest').GetNameWithTooltip]"
 oath_reconquest_tooltip: "[completely_control|E] [de_jure|E] [THIS.Var('oath_reconquest_title').Title.GetName] #low ([root_scope.MakeScope.ScriptValue('oath_reconquest_value_1')]/[root_scope.MakeScope.ScriptValue('oath_reconquest_value_2')])#!"
 martial_oath_2_tooltip: "ข้าขอสาบานด้วย [oath|E] เพื่อ #V ขยายอาณาจักร#!:\n\t$EFFECT_LIST_BULLET$[realm|E] จำต้องมีขนาดอย่างน้อย [host.MakeScope.ScriptValue('oath_conquest_value_1')|V0] #low (ปัจจุบัน [host.MakeScope.ScriptValue('oath_conquest_value_2')|V0])#!\n$EFFECT_LIST_BULLET$จำต้องสำเร็จภายใน #V 20 ปี#!\n$EFFECT_LIST_BULLET$เลือกระหว่างคุณประโยชน์แก่ [capital|E] และการเปลี่ยนแปลง [de_jure|E] ของ [titles|E]\n$EFFECT_LIST_BULLET$รางวัล: [legitimacy_i][legitimacy|E], [prestige_i][prestige|E], และ [GetModifier('oath_of_conquest').GetNameWithTooltip]"
 ## Stewardship
 stewardship_oath_1_tooltip: "ข้าสาบาน [oath|E] ที่จะ #V รับประกันสันติภาพ#!:\n\t$EFFECT_LIST_BULLET$ต้องมีสันติภาพต่อเนื่องอย่างน้อย #V 5 ปี#!\n\t$EFFECT_LIST_BULLET$ต้อง ทำให้สำเร็จภายใน #V 50 ปี#!\n\t$EFFECT_LIST_BULLET$รางวัล: [legitimacy_i][legitimacy|E], [prestige_i][prestige|E], [development_i][development|E], และ [GetModifier('oath_of_peace').GetNameWithTooltip]"
 stewardship_oath_2_tooltip: "ข้าสาบาน [oath|E] ที่จะ #V สรรค์สร้างอาณาจักร#!:\n\t$EFFECT_LIST_BULLET$ต้องสร้างหรืออัปเกรด [buildings|E] อย่างน้อย #V 8#! แห่ง\n\t$EFFECT_LIST_BULLET$ต้อง ทำให้สำเร็จภายใน #V 20 ปี#!\n\t$EFFECT_LIST_BULLET$รางวัล: [legitimacy_i][legitimacy|E], [prestige_i][prestige|E], [development_i][development|E], และ [GetModifier('oath_of_buildings').GetNameWithTooltip]"
 ## Intrigue

 ## Learning
 learning_oath_1_tooltip: "ข้าขอสาบาน [oath|E] เพื่อ #V บ่มเพาะปัญญา#!:[SelectLocalization( GreaterThan_CFixedPoint( GetPlayer.MakeScope.Var('learning_oath_1_university_exists').GetValue, '(CFixedPoint)0' ), 'learning_oath_1_tooltip_need_university', 'learning_oath_1_tooltip_need_development' )]\n\t$EFFECT_LIST_BULLET$จำเป็นต้องมี [gold_i][gold|E] อย่างน้อย #V [learning_oath_temp_cost]#! \n\t$EFFECT_LIST_BULLET$จำเป็นต้องผ่านเงื่อนไข #V 1#! ข้อต่อไปนี้:\n\t\t\t$EFFECT_LIST_BULLET$มี [education_trait|E] ระดับที่ห้า\n\t\t\t$EFFECT_LIST_BULLET$[councillor|E] แต่ละคนมีทักษะระดับ #V 20#! หรือสูงกว่าในบทบาทของตน\n\t$EFFECT_LIST_BULLET$ต้องทำให้สำเร็จภายใน #V 50 ปี#!\n\t$EFFECT_LIST_BULLET$รางวัล: [legitimacy_i][legitimacy|E], [prestige_i][prestige|E], และ [SelectLocalization( GreaterThan_CFixedPoint( GetPlayer.MakeScope.Var('learning_oath_1_university_exists').GetValue, '(CFixedPoint)0' ), 'learning_oath_1_tooltip_university', 'learning_oath_1_tooltip_no_university' )]"
 learning_oath_1_tooltip_university: "[GetModifier('oath_university_county').GetNameWithTooltip]"
 learning_oath_1_tooltip_no_university: "[GetBuilding('generic_university').GetName]"
 learning_oath_1_tooltip_need_university: "\n\t$EFFECT_LIST_BULLET$ต้องการ [county|E] ที่มี [GetBuilding('generic_university').GetName] และ [development_i][development|E] #V 30#! หรือสูงกว่า"
 learning_oath_1_tooltip_need_development: "\n\t$EFFECT_LIST_BULLET$ต้องการ [county|E] ที่มี [development_i][development|E] #V 30#! หรือสูงกว่า"

 #Purge Pretenders
 purge_pretenders_oath_tooltip: "ข้าสาบาน [oath|E] ที่จะ #V กวาดล้างผู้อ้างสิทธิ์จอมปลอม#!:\n\t$EFFECT_LIST_BULLET$ต้องไม่มี [claimant|E] ต่อ [primary_title|E] ของท่าน ยกเว้น [children|E] ของท่าน\n\t$EFFECT_LIST_BULLET$ต้อง ทำให้สำเร็จภายใน #V 50 ปี#!\n\t$EFFECT_LIST_BULLET$รางวัล: [legitimacy_i][legitimacy|E], [prestige_i][prestige|E], และ [GetModifier('oath_of_purge_pretenders').GetNameWithTooltip]\n\t$EFFECT_LIST_BULLET$[SelectLocalization(GetPlayer.GetGovernment.IsType('nomad_government'), 'purge_pretenders_oath_nomad', '')][SelectLocalization(GetPlayer.GetGovernment.IsType('administrative_government'), 'purge_pretenders_oath_admin', '')][SelectLocalization(Not(Or(GetPlayer.GetGovernment.IsType('nomad_government'), GetPlayer.GetGovernment.IsType('administrative_government'))), 'purge_pretenders_oath_default', '')]"
 purge_pretenders_oath_admin: "[house|E] ของท่านได้รับ [modifier|E] [GetModifier('oath_of_purge_pretenders_house').GetNameWithTooltip]"
 purge_pretenders_oath_nomad: "คะแนน [obedience|E] ของ [kurultai|E] และ [children|E] ของท่าน: #P +100#!"
 purge_pretenders_oath_default: "ท่านได้รับ [GetLaw('single_heir_succession_law').GetName] [law|E] นี้จะเปลี่ยนกลับเป็นกฎหมายเดิมของท่านเมื่อเสียชีวิต"

 # End the Struggle
 end_the_struggle_oath_tooltip: "ข้าขอสาบานด้วย [oath|E] เพื่อ #V ยุติการต่อสู้#!:\n\t$EFFECT_LIST_BULLET$ต้องใช้ [decisions|E] ใด ๆ เพื่อยุติ [struggle|E]\n\t$EFFECT_LIST_BULLET$จำต้องสำเร็จภายใน #V 20 ปี#!\n\t$EFFECT_LIST_BULLET$รางวัล: [legitimacy_i][legitimacy|E], [prestige_i][prestige|E], และ [GetModifier('oath_of_end_the_struggle').GetNameWithTooltip]."

 # Greatest Hunter
 greatest_hunter_oath_tooltip: "ข้าสาบาน [oath|E] ที่จะ #V เป็นสุดยอดนักล่า#!:\n\t$EFFECT_LIST_BULLET$ต้องเป็นเจ้าภาพและเสร็จสิ้น [Concept( 'activity', 'Hunt' )|E] #V ระดับตำนาน#! อย่างน้อย #V 1#! ครั้ง หรือ [Concept( 'activity', 'Hunts' )|E] ปกติ #V 10#! ครั้ง เพิ่มโอกาสของ #V การพบเห็นระดับตำนาน#! ขณะที่ [oath|E] นี้มีผล\n\t$EFFECT_LIST_BULLET$ต้อง ทำให้สำเร็จภายใน #V 40 ปี#!\n\t$EFFECT_LIST_BULLET$รางวัล: [legitimacy_i][legitimacy|E], [prestige_i][prestige|E], [modifiers|E] พิเศษสำหรับ [artifact|E] #V ธนู#! และ [GetModifier('oath_greatest_hunter').GetNameWithTooltip]"
 # Heir Preparation
 heir_preparation_oath_tooltip: "ข้าสาบาน [oath|E] ที่จะ #V เตรียมทายาท#!:\n\t$EFFECT_LIST_BULLET$ต้องมี [primary_heir|E] ที่มี [skills|E] ทั้งหมด #V 10+#! และอย่างน้อยสอง [skills|E] #V 14+#! \n\t$EFFECT_LIST_BULLET$ต้อง ทำให้สำเร็จภายใน #V 40 ปี#!\n\t$EFFECT_LIST_BULLET$รางวัล: [legitimacy_i][legitimacy|E], [prestige_i][prestige|E], และ [GetModifier('oath_heir_preparation').GetNameWithTooltip] [primary_heir|E] จะได้รับ [GetModifier('oath_heir_preparation_heir').GetNameWithTooltip]"

 # Install Claimants
 install_claimants_oath_tooltip: "ข้าสาบาน [oath|E] ที่จะ #V สนับสนุนผู้อ้างสิทธิ์#!:\n\t$EFFECT_LIST_BULLET$ต้องชนะ [wars|E] ของ [claimant|E] อย่างน้อย #V 3#! ครั้ง\n\t$EFFECT_LIST_BULLET$ต้อง ทำให้สำเร็จภายใน #V 20 ปี#!\n\t$EFFECT_LIST_BULLET$รางวัล: [legitimacy_i][legitimacy|E], [prestige_i][prestige|E], [GetModifier('oath_install_claimants').GetNameWithTooltip], และ [perpetual_hook|E] ต่อ [claimant|E] ทุกคนที่ได้รับการสนับสนุน และ [weak_hook|E] ต่อ [primary_heirs|E] ของพวกเขา"
 # Mend the Fracture
 mend_the_fracture_oath_tooltip: "ข้าสาบาน [oath|E] ที่จะ #V สมานรอยร้าว#!:\n\t$EFFECT_LIST_BULLET$ต้องมี [cultural_acceptance|E] อย่างน้อย #V 70#! กับ [culture|E] ที่มีสัดส่วนมากกว่า #V 40%#! ใน [realm|E] ของข้า\n\t$EFFECT_LIST_BULLET$ต้อง ทำให้สำเร็จภายใน #V 20 ปี#!\n\t$EFFECT_LIST_BULLET$รางวัล: [legitimacy_i][legitimacy|E], [prestige_i][prestige|E], [GetModifier('oath_mend_the_fracture').GetNameWithTooltip], และทั้งสองวัฒนธรรมจะได้รับ [culture_tradition|E] [GetCultureTradition('oath_mend_the_fracture_tradition').GetName]"
 # Provide for the Warriors
 provide_for_the_warriors_oath_tooltip: "ข้าสาบาน [oath|E] ที่จะ #V อุปถัมภ์นักรบ#!:\n\t$EFFECT_LIST_BULLET$ต้องสร้าง [GetBuilding('oath_warriors_building_02').GetName] อย่างน้อย #V 3#! แห่ง ปลดล็อกการเข้าถึงสาย [buildings|E] นี้ขณะที่ [oath|E] นี้มีผล\n\t$EFFECT_LIST_BULLET$ต้อง ทำให้สำเร็จภายใน #V 20 ปี#!\n\t$EFFECT_LIST_BULLET$รางวัล: [legitimacy_i][legitimacy|E], [prestige_i][prestige|E], [GetModifier('oath_provide_for_the_warriors').GetNameWithTooltip], และปลดล็อกการอัปเกรดขั้นสุดท้าย: [GetBuilding('oath_warriors_building_04').GetName]"
 # Provide for the Faithful
 provide_for_the_faithful_oath_tooltip: "ข้าสาบาน [oath|E] ที่จะ #V อุปถัมภ์ผู้ศรัทธา#!:\n\t$EFFECT_LIST_BULLET$ต้องสร้าง [GetBuilding('oath_faithful_building_02').GetName] อย่างน้อย #V 3#! แห่ง ปลดล็อกการเข้าถึงสาย [buildings|E] นี้ขณะที่ [oath|E] นี้มีผล\n\t$EFFECT_LIST_BULLET$ต้อง ทำให้สำเร็จภายใน #V 20 ปี#!\n\t$EFFECT_LIST_BULLET$รางวัล: [legitimacy_i][legitimacy|E], [prestige_i][prestige|E], [GetModifier('oath_provide_for_the_faithful').GetNameWithTooltip], และปลดล็อกการอัปเกรดขั้นสุดท้าย: [GetBuilding('oath_faithful_building_04').GetName]"
 # Provide for the Poor
 provide_for_the_poor_oath_tooltip: "ข้าสาบาน [oath|E] ที่จะ #V อุปถัมภ์ผู้ยากไร้#!:\n\t$EFFECT_LIST_BULLET$ต้องสร้าง [GetBuilding('oath_poor_building_02').GetName] อย่างน้อย #V 3#! แห่ง ปลดล็อกการเข้าถึงสาย [buildings|E] นี้ขณะที่ [oath|E] นี้มีผล\n\t$EFFECT_LIST_BULLET$ต้อง ทำให้สำเร็จภายใน #V 20 ปี#!\n\t$EFFECT_LIST_BULLET$รางวัล: [legitimacy_i][legitimacy|E], [prestige_i][prestige|E], [GetModifier('oath_provide_for_the_poor').GetNameWithTooltip], และปลดล็อกการอัปเกรดขั้นสุดท้าย: [GetBuilding('oath_poor_building_04').GetName]"
 # Repent
 repent_oath_tooltip: "ข้าสาบาน [oath|E] ที่จะ #V สำนึกบาป#!:\n\t$EFFECT_LIST_BULLET$ต้องทำ [pilgrimages|E] ให้สำเร็จอย่างน้อย #V 4#! ครั้ง และมี [GetModifier( 'piety_level_3' ).GetNameWithTooltip|L]\n\t$EFFECT_LIST_BULLET$ต้อง ทำให้สำเร็จภายใน #V 20 ปี#!\n\t$EFFECT_LIST_BULLET$รางวัล: [legitimacy_i][legitimacy|E], [prestige_i][prestige|E], [GetModifier('oath_of_repent').GetNameWithTooltip], และลบ [traits|E] ที่เป็น [sinful|E] ใด ๆ และแทนที่ด้วย [traits|E] ที่เป็น [virtuous|E]"

 coronation_events.0200.t: "โหมโรง"
 coronation_events.0200.desc.host: "เหล่าแขกเหรื่อได้มาเยือนแล้ว ทั้งจากแดนใกล้และแดนไกล บ้างก็ด้วยความภักดี บ้างก็ด้วยความใคร่รู้ ฝูงชนเนืองแน่นขึ้นด้วยใบหน้าที่เปี่ยมด้วยความคาดหวัง, การใคร่ครวญ, และในบางกรณี, ก็มีความอบอุ่นจาง ๆ\n\nข้าเปล่งเสียงเพียงพอให้ผู้เข้าร่วมสงบลง และต้อนรับพวกเขาเข้าสู่พิธีบรมราชาภิเษกของข้า"
 coronation_events.0200.desc.guest: "การชุมนุมนี้ช่างยิ่งใหญ่ดังคาด ใบหน้าที่คุ้นเคยและแปลกหน้าปะปนกัน และข้าได้ยินเสียงทักทายที่อบอุ่นเพียงพอแค่ให้เป็นมารยาท เมื่อเจ้าภาพเอ่ยวาจา, ทั้งห้องก็เงียบลงโดยสัญชาตญาณ\n\n\"สหายของข้า, ข้าหลวงของข้า, ญาติมิตรของข้า, การมาของพวกท่านนับเป็นเกียรติแก่ข้ายิ่งกว่ามงกุฎใด ๆ จนกว่าพิธีจะเริ่ม, จงกิน, ดื่ม, และสนทนาอย่างอิสระเถิด... และจงรู้ไว้ว่าข้าเห็นพวกท่านทุกคน, และจะไม่ลืมเลือนว่าผู้ใดที่ยืนหยัดเคียงข้างข้าในวันนี้\"\n\nคำมั่นสัญญาอันอ่อนโยน, หรือคำเตือนอันเงียบงัน, สุดแล้ว แต่ว่าผู้ใดจะเลือกได้ยิน เช่นไร"
 coronation_events.0200.a: "ยินดีต้อนรับ, ทุก ๆ ท่าน!"
 coronation_events.0200.b: "เอาล่ะ, มีใครอื่นอีกบ้างที่นี่?"

 coronation_events.0205.t: "พิธีการ"
 coronation_events.0205.meager: "การเตรียมการทั้งหมดเสร็จสิ้นแล้ว การชุมนุมในพิธีอันขัดสนกำลังรอคอยอยู่ที่"
 coronation_events.0205.great: "การเตรียมการทั้งหมดเสร็จสิ้นแล้ว การชุมนุมในพิธีอันยิ่งใหญ่บัดนี้กำลังรอคอยอยู่ที่"
 coronation_events.0205.hagia_sophia: "วิหารฮาเกียโซเฟีย, สถานแห่งพระปัญญาอันศักดิ์สิทธิ์ของพระเจ้า"
 coronation_events.0205.st_peters: "มหาวิหารนักบุญเปโตร, ที่พำนักแห่งตัวแทนองค์สำคัญของพระคริสต์"
 coronation_events.0205.saint_denis: "มหาวิหารแซ็ง-เดอนี, สุสานแห่งนักบุญองค์อุปถัมภ์ของชาวฝรั่งเศส"
 coronation_events.0205.westminster: "มหาวิหารเวสต์มินสเตอร์อันงามสง่า"
 coronation_events.0205.reims: "อาสนวิหารแม่พระแห่งแร็งส์, มหาวิหารแห่งเหล่ากษัตริย์"
 coronation_events.0205.aachen: "พระราชวังอาเคินอันเลื่องชื่อของชาร์เลอมาญ"
 coronation_events.0205.wawel: "อาสนวิหารวาเวล, งดงามและคงอยู่ชั่วนิรันดร์"
 coronation_events.0205.east_admin_location: "ความเงียบสงบอันสงัดของหมู่พระราชวัง [location.GetTitle.GetNameNoTierPossessive]"
 coronation_events.0205.temple: "[host.GetFaith.HouseOfWorship] อันสูงส่งแห่ง [location.GetTitle.GetNameNoTierPossessive]"
 coronation_events.0205.east_admin_description: "\n\nพร้อมด้วยเสียงกลองศึกอันกึกก้อง,"
 coronation_events.0205.silence: "\n\nท่ามกลางความเงียบงันอันเย็นชา,"
 coronation_events.0205.cheers: "\n\nท่ามกลางเสียงโห่ร้องและการสรรเสริญ,"
 coronation_events.0205.desc.host_east_asian: "ขบวน [ROOT.Char.Custom('GetTitleTierAdjective')] ของข้าเคลื่อนผ่านเหล่า [host.Custom('GetFighterTermPlural')] และขุนนางที่ยืนเรียงรายเป็นแถวแล้วแถวเล่า เบื้องหลัง พวกเราได้ทิ้งศาลบรรพชนของตระกูลไว้ ซึ่งเป็นสถานที่ประกอบปฐมพิธีแห่งวัน"
 coronation_events.0205.desc.guest_east_asian: "ขบวน [ROOT.Char.Custom('GetTitleTierAdjective')] ของ [host.GetTitledFirstNamePossessive] เคลื่อนผ่านเหล่า [host.Custom('GetFighterTermPlural')] และขุนนางของ [host.GetHerHis] ที่ยืนเรียงรายเป็นแถวแล้วแถวเล่า เบื้องหลัง พวกเราได้ทิ้งศาลบรรพชนของ [host.GetTitleAsNameNoTooltip] ไว้ ซึ่งเป็นสถานที่ประกอบปฐมพิธีแห่งวัน"
 coronation_events.0205.desc.host: "ขบวนแห่ของข้าแหวกฝูงชนที่เนืองแน่นของ [ROOT.Char.Custom('SettlementCity')|l]: [ROOT.Char.Custom('KnightCulturePluralNoTooltipLowercase')] ที่เก่งกาจที่สุดของข้าขี่ม้านำหน้า, โดยมีข้าราชบริพาร [ROOT.Char.Custom('GetTitleTierAdjective')] ของข้าตามหลัง"
 coronation_events.0205.desc.guest: "ขบวนแห่ของ [host.GetTitledFirstNamePossessive] แหวกฝูงชน, และผู้ติดตามของข้าก็ติดตามไปในตำแหน่งอันทรงเกียรติของเรา"
 coronation_events.0205.desc.low_magnificence_east_asian: "\n\nเงามืดเข้าครอบงำพิธีกรรม บรรพชนแห่ง [host.GetDynastyHouseName] จะไม่อับอายต่อการขึ้นครองบัลลังก์อันไม่แน่นอนนี้ได้อย่างไร...?"
 coronation_events.0205.desc.medium_magnificence_east_asian: "\n\nความรู้สึกเปี่ยมหวังอบอวลอยู่ในอากาศ พิธีเคารพบูชาอันยาวนานเมื่อช่วงเช้าได้ก่อเกิดมงคล และได้เชื่อมโยงพิธีนี้เข้ากับอดีตอันไกลโพ้น"
 coronation_events.0205.desc.high_magnificence_east_asian: "\n\nความเคารพยำเกรงอันน่าพิศวงได้ยกระดับพิธีกรรมยามเช้า ลอยอวลไปกับกำยานอันหอมกรุ่น และก่อเกิดจากความภาคภูมิใจอันมั่นแท้ของบรรพชนแห่ง [host.GetDynastyHouseName]"
 coronation_events.0205.desc.low_magnificence: "[host.Custom('GetLocalCommonerTermPlural')] บางคนจ้องมองเราอย่างว่างเปล่า; บ้างก็พึมพำเย้ยหยัน คนหนึ่งตะโกนก้อง #EMP "[host.GetTitleAsName] จอมปลอม!"#! และฝูงชนก็กรูกันเข้ามา, ถูกยั้งไว้แทบไม่อยู่โดย [host.Custom('GetFighterTermPlural')] เพียงไม่กี่คนที่ยืนเรียงรายตามทาง"
 coronation_events.0205.desc.medium_magnificence: "[host.Custom('GetLocalCommonerTermPlural')|U] หลั่งไหลออกมาเพื่อยลโฉมว่าที่ [host.GetTitleAsNameNoTooltip|l] บนบ่าของผู้ปกครอง, ท่ามกลางมหาชน, เด็ก ๆ ชาว [location.GetCulture.GetName] ยิ้มแย้ม"
 coronation_events.0205.desc.high_magnificence: "เสียงแตรดังก้อง! ธงทิวโบกสะบัด, ในสีสัน [host.GetPrimaryTitle.GetAdjective] อันเจิดจ้า! [host.Custom('GetLocalCommonerTermPlural')|U] สรรเสริญ [host.GetTitleAsNameNoTooltip|l], และเหล่าสตรีหลั่งน้ำตาด้วยความปลาบปลื้มในขบวนแห่อันรุ่งโรจน์นี้"

 coronation_events.0205.a_low_magnificence_east_admin: "ไม่เป็นที่โปรดปรานทั้งจากคนเป็น... หรือคนตาย..."
 coronation_events.0205.a_low_magnificence: "[ROOT.Char.GetFaith.HighGodName] โปรดนำทางข้าผ่านฝูงชนอันไร้ระเบียบนี้..."
 coronation_events.0205.a_high_magnificence: "และพิธีบรมราชาภิเษกของข้า #EMP เพิ่งจะเริ่มต้นเท่านั้น!#!"
 coronation_events.0205.a: "ช่วงเวลาอันยิ่งใหญ่ที่สุดใกล้เข้ามาแล้ว"
 coronation_events.0205.b: "[ROOT.Char.GetTitleAsNameNoTooltip|l] ผู้นี้คงดูน่าสะพรึงกลัวเป็นแน่..."
 coronation_events.0205.b_flavor_infirm: "...แทบไม่มีเรี่ยวแรงเหลือให้ [ROOT.Char.GetHerHim] ขี่ม้าไปยังพิธีบรมราชาภิเษกของ [ROOT.Char.GetHerHis] เลย"
 coronation_events.0205.b_improved: "แต่โชคดีที่, น้อยคนนักที่จะสังเกตเห็นท่ามกลางความโอ่อ่า เช่นนี้!"
 coronation_events.0205.c_low_magnificence_east_admin: "ผู้ที่ยังมีตาเนื้อย่อมรู้ดียิ่งกว่า!"
 coronation_events.0205.c_low_magnificence: "มองให้ใกล้กว่านี้, พวกไพร่! ข้าคือ [activity.GetHost.GetTitleAsNameNoTooltip|l] ทุกกระเบียดนิ้ว"
 coronation_events.0205.c: "ข้าคือภาพลักษณ์ของ [activity.GetHost.GetTitleAsNameNoTooltip|l] ผู้ยิ่งใหญ่โดยแท้!"
 coronation_events.0205.d: "บัดนี้, เราจะได้เห็นมาตรฐานของ [activity.GetHost.GetTitleAsNameNoTooltip] ผู้นี้"
 coronation_events.0205.e_east_admin: "ประกายแห่งเหรียญตราจะฟื้นฟูความเป็นมงคลของวันนี้!"
 coronation_events.0205.e: "ประกายเหรียญตราของข้าจะฟื้นฟูความโอ่อ่าในวันนี้"
 coronation_events.0205.e.tt: "[ROOT.Char.CustomFixedRandom('GetKnightErrantAnimal')] ถูกนำเข้ามา, แต่งกายด้วยผ้าทอง, [ROOT.Char.CustomFixedRandom('GetExpensiveDrink_Singular')] ถูก ทำให้ไหลรินจากน้ำพุทุกแห่ง; เหล่านักดนตรี, นั่งอยู่หน้าพลับพลา, ขับขานถึงเกียรติยศของท่าน"
 coronation_events.0205.e.toast: "[host.GetShortUIName] ไม่ได้ประหยัดค่าใช้จ่ายใด ๆ ในพิธีการ"
 coronation_events.0205.f_east_admin: "ข้า #EMP ต้อง#! กล่าวกับที่ประชุมนี้"
 coronation_events.0205.f: "ผู้คนรู้ว่าใครคือ [ROOT.Char.GetTitleAsNameNoTooltip] ของพวกเขา"
 coronation_events.0205.f.tt: "ท่านกล่าวสุนทรพจน์ที่ปลุกเร้าใจแก่ผู้คนอย่างแท้จริง"
