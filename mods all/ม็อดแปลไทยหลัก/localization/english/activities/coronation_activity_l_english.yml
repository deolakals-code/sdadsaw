l_english: 
 # Base details
 activity_coronation: "พิธีบรมราชาภิเษก"
 activity_coronation_host_desc: "$BULLET_WITH_TAB$@law_icon![GetLaw('crowned_king').GetName] หรือ [GetLaw('crowned_emperor').GetName] [law|E]\n$BULLET_WITH_TAB$ขณะที่พิธีบรมราชาภิเษกดำเนินอยู่ @faction_icon![factions|E] ไม่สามารถยื่นข้อเรียกร้องได้\n$BULLET_WITH_TAB$[opinion_i][opinion|E]\n$BULLET_WITH_TAB$[prestige_i][prestige|E]\n$BULLET_WITH_TAB$[legitimacy_i][legitimacy|E]\n$BULLET_WITH_TAB$การตัดสินใจ[decision|E] [oath|E] อันทรงพลัง\n\n@warning_icon! #X @faction_icon![factions|E] และศัตรูอื่น ๆ จะทำอันตรายต่อ [coronation_magnificence|E] ของพิธีบรมราชาภิเษก#!`"
 activity_coronation_guest_desc: "$BULLET_WITH_TAB$ ผู้เข้าร่วมอาจได้รับ [opinion_i][opinion|E] ต่อผู้เข้าร่วมคนอื่น ๆ\n$BULLET_WITH_TAB$ผู้เข้าร่วมอาจได้รับโอกาสพิเศษตาม [intent|E] ของตน"
 activity_coronation_desc: "เชิญผู้ยิ่งใหญ่และทรงอำนาจแห่งอาณาจักรเพื่อเป็นสักขีพยานในการขึ้นครองราชย์ของท่าน การนี้จะสถาปนารากฐานเพื่อการปกครองอันยืนยาวและสัมฤทธิผล"
 activity_coronation_conclusion_desc: "[GetActivityType( 'activity_coronation' ).GetName] ได้สิ้นสุดลงแล้ว"
 activity_coronation_selection_tooltip: "เชิญผู้ยิ่งใหญ่และทรงอำนาจแห่งอาณาจักรเพื่อเป็นสักขีพยานในการขึ้นครองราชย์ของท่าน การนี้จะสถาปนารากฐานเพื่อการปกครองอันยืนยาวและสัมฤทธิผล\n\nรางวัลที่คาดหมาย:\n$activity_coronation_host_desc$"
 activity_coronation_destination_selection: "\nโดยปกติ [coronation|E] จะต้องจัดขึ้นใน [realm|E] ของ [host|E], โดยมีข้อยกเว้นสำหรับ [anointments|E] ซึ่งอาจต้องจัดในดินแดนของ [head_of_faith|E] หากพวกเขาถือครอง [holy_sites|E] ที่เหมาะสม"
 activity_coronation_guest_help_text: "พิธีบรมราชาภิเษกเป็นโอกาสอันดีในการสร้างสายสัมพันธ์ และสร้างความประทับใจให้แก่เหล่า [vassals|E] และ [rulers|E] อื่น ๆ\n\nแขกใดก็ตามที่เข้าร่วมพิธีบรมราชาภิเษกจะมีโอกาสเพิ่มพูน [opinion|E] ต่อแขกท่านอื่น และอาจได้รับโอกาสพิเศษในการมีปฏิสัมพันธ์กับ [host|E] ของ [activity|E]"
 invite_to_activity_flavor_coronation: "ข้าขอเชิญท่านด้วยความยินดียิ่ง เพื่อเข้าร่วมกับข้าและส่วนอื่น ๆ ของอาณาจักร ณ [ROOT.Char.GetCurrentLocation.Custom('GetCoronationSitePrefix')][ROOT.Char.GetCurrentLocation.Custom('GetCoronationSite')] สำหรับพิธีบรมราชาภิเษกของข้าที่กำลังจะมาถึงนี้"
 activity_coronation_underage_tt: "ท่านมีอายุ #bold ไม่#! ถึง #V 12#! ปี\n#flavor มงกุฎลื่นหลุดจากศีรษะเล็ก ๆ ของท่าน#!"
 activity_coronation_not_approved_anointment: "[GetPlayer.GetFaith.GetReligiousHead.GetTitledFirstName] ยังมิได้อนุมัติ [anointment|E] นี้, จงขอการอนุมัติจาก [GetPlayer.GetFaith.GetReligiousHead.GetHerHis] ด้วย [interaction|E] [request_anointment|E]"

 # Province Desc
 activity_coronation_province_desc: "พิธีบรมราชาภิเษกจะจัดขึ้นใน [ROOT.Province.GetName]"
 activity_coronation_capital_province: "\n#p + เมืองหลวง#!"
 activity_coronation_holy_site_province: "\n#p + สถานที่ศักดิ์สิทธิ์#!"
 activity_coronation_tradition_province: "\n#p + สถานที่ประกอบพิธีบรมราชาภิเษกตามธรรมเนียม#!"
 activity_coronation_long_tradition_province: "\n#p ++ สถานที่ประกอบพิธีบรมราชาภิเษกตามธรรมเนียม#!"
 activity_coronation_ancient_tradition_province: "\n#p +++ สถานที่ประกอบพิธีบรมราชาภิเษกตามธรรมเนียม#!"

 # Location Triggers
 coronation_location_owned: "ไม่อยู่ใน [realm|E]"
