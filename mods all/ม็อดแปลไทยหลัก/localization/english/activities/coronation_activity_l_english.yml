 coronation_events.0210.t: "งานเลี้ยง"
 coronation_events.0210.desc.host: "พิธีการเสร็จสิ้นแล้ว: เกียรติยศ [ROOT.Char.Custom('GetTitleTierAdjective')] ทุกประการได้ถูกมอบแก่ข้าแล้ว ข้าลุกขึ้นอีกครั้ง มิใช่ เพื่อให้สัญญาหรือบัญชา แต่เพื่อมอบความสำราญอันฟุ่มเฟือย\n\n\"จงเติมเต็มโต๊ะเหล่านี้ จงยกถ้วมขึ้น และขอให้โถงนี้จดจำความสุขเกษม เช่นเดียวกับหน้าที่\"\n\nที่ประชุม ซึ่งหิวโหยจากการเฝ้ารอพิธีรีตองอันซับซ้อนมาอย่างยาวนาน ส่งเสียงฮือฮาด้วยความเห็นชอบ อย่างน้อยก็ในตอนนี้ ทุกคนมีบางสิ่งอยู่ตรงหน้า... นอกเหนือจากข้า"
 coronation_events.0210.desc.guest: "พิธีรีตองได้สิ้นสุดลง พร้อมกับความเงียบงันที่ปกคลุมที่ประชุม เสียงพึมพำเบา ๆ ดังขึ้นเมื่อเจ้าภาพลุกขึ้นอีกครั้ง คราวนี้เพื่อประกาศการสิ้นสุดพิธีการและเริ่มต้นช่วงเวลาที่ผ่อนคลายกว่า\n\n[host.GetTitleAsName] เปล่งเสียงของ[host.GetHerHis]ดังพอได้ยิน: \"สหายทั้งหลาย พิธีกรรมเสร็จสิ้นแล้ว จงเติมเต็มโต๊ะเหล่านี้ จงยกถ้วมขึ้น และขอให้โถงนี้จดจำความสุขเกษม เช่นเดียวกับหน้าที่\"\n\nถ้อยคำเหล่านั้นได้รับการตอบรับอย่างดี และใน แต่ละขณะที่ผ่านไป การชุมนุม [ROOT.Char.Custom('GetTitleTierAdjective')] ก็กลายเป็นการเฉลิมฉลองที่มีชีวิตชีวามากขึ้น"
 coronation_events.0210.a: "เมื่อเรื่องนั้นผ่านไป, ก็ถึงเวลาเฉลิมฉลอง!"
 coronation_events.0210.b: "ในที่สุด, พิธีการก็เสร็จสิ้นเสียที"

 coronation_events.0300.t: "ตำแหน่งอันทรงเกียรติ"
 coronation_events.0300.desc: "ก่อนที่พิธีบรมราชาภิเษกจะดำเนินต่อไปได้, ข้าต้องตัดสินใจว่าผู้ใดจะทำหน้าที่เป็นประธานในพิธีศักดิ์สิทธิ์ หากข้าจะได้รับการสนับสนุนจากเหล่า [ROOT.Char.GetFaith.AltPriestTermPlural|U], ก็เป็นการฉลาดที่จะให้คนของพวกเขาเองมาดูแลพิธีการ, มอบความศักดิ์สิทธิ์และพรที่พวกเขาเท่านั้นที่สามารถให้ได้\n\nถึงกระนั้น, ส่วนหนึ่งในใจข้าก็สงสัย: มันจะไม่เป็นเรื่องเล่าที่ยิ่งใหญ่กว่าหรือหากข้าจะหยิบมงกุฎขึ้นมาด้วยมือของข้าเอง, ประกาศสิทธิ์ในการปกครองของข้าต่อหน้าทุกคนโดยปราศจากการแทรกแซง?"
 coronation_events.0300.a: "[chaplain.GetFirstNameNoTooltip] เป็นผู้เดียวที่สามารถทำได้"
 coronation_events_0300_a_tooltip: "[chaplain.GetFirstName] จะเป็นผู้ประกอบพิธี"
 coronation_events.0300.b: "บางทีอาจเป็น [alternative_1.GetFirstNameNoTooltip]?"
 coronation_events_0300_b_tooltip: "[alternative_1.GetFirstName] จะเป็นผู้ประกอบพิธี"
 coronation_events.0300.c: "ข้าเชื่อมั่นใน [alternative_2.GetFirstNameNoTooltip]"
 coronation_events_0300_c_tooltip: "[alternative_2.GetFirstName] จะเป็นผู้ประกอบพิธี"
 coronation_events.0300.d: "มันเป็นเกียรติที่สามารถตกเป็นของข้าได้เท่านั้น"
 coronation_events_0300_d_tooltip: "#high ท่าน#! จะเป็นผู้ประกอบพิธี"
 coronation_events_0300_d_tooltip_effect: "#high ท่าน#! จะได้รับ @prestige_icon![prestige|E], แต่สูญเสีย @opinion_icon![opinion|E] กับ [court_chaplain|E] ของท่าน และ [vassals|E] [GetVassalStance( 'zealot' ).GetTextIcon][GetVassalStance( 'zealot' ).GetName|U] โดยขึ้นอยู่กับ [coronation_magnificence|E] ของ [coronation|E] ของท่าน"
 coronation_events_0300_d_tooltip_effect_hof: "#high ท่าน#! จะได้รับ @prestige_icon![prestige|E], แต่สูญเสีย @opinion_icon![opinion|E] กับ [head_of_faith|E] ของท่าน และ [vassals|E] [GetVassalStance( 'zealot' ).GetTextIcon][GetVassalStance( 'zealot' ).GetName|U] โดยขึ้นอยู่กับ [coronation_magnificence|E] ของ [coronation|E] ของท่าน"

 coronation_events.0301.t: "การตายของผู้ประกอบพิธี"
 coronation_events.0301.desc: "ผู้ประกอบพิธีบรมราชาภิเษกของข้า, [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('dead_officiator'))] [dead_officiator.GetFirstName] ของข้า, [dead_officiator.GetDeathReason] ที่นั่งของ [dead_officiator.GetHerHis|U] ว่างเปล่า, และพิธีกรรมอันศักดิ์สิทธิ์ก็ยังไม่ลุล่วง\n\n[first_candidate.GetFirstName], [first_candidate.GetFaith.PriestNeuter] [first_candidate.GetFaith.GetAdherentName] ผู้เป็นที่เคารพ, ก้าวออกมา "[first_candidate.GetFaith.HighGodName] ไม่หวั่นไหวกับการจากไปของวิญญาณดวงหนึ่ง," [first_candidate.GetSheHe] กล่าวอย่างเคร่งขรึม "หากท่านประสงค์, ข้าจะทำพิธีให้ลุล่วง""
 coronation_events.0301.a: "นักบุญ [ROOT.Char.Custom('GetCatholicSaint')], โปรดนำพาดวงวิญญาณของ [dead_officiator.GetHerHis] สู่ [ROOT.Char.GetFaith.PositiveAfterLife]"
