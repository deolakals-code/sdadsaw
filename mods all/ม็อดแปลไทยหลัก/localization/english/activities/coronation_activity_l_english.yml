 coronation_events.0301.b.tooltip: "[second_candidate.GetFirstNameNoTooltip] จะเป็นผู้ประกอบพิธีคนใหม่"
 coronation_events.0301.c: "[dead_officiator.GetSheHe|U] สมควรได้รับความเคารพอย่างสูงสุดจากข้า ยกเลิกพิธีการ"
