 coronation_events.0301.d: "ข้าจะไม่ยอมให้การตายเพียงครั้งเดียวมาหยุดยั้งพิธีบรมราชาภิเษก #EMP ของข้า#! "
 coronation_events.0301.d.tooltip: "[first_candidate.GetFirstNameNoTooltip] จะเป็นผู้ประกอบพิธีคนใหม่ การตายของ [dead_officiator.GetTitledFirstNamePossessive] ระหว่างพิธีบรมราชาภิเษกของท่านถูกมองอย่างกว้างขวางว่าเป็นลางร้ายอย่างยิ่งต่อการปกครองของท่าน"
 coronation_events.0301.e: "[first_candidate.GetFaith.HighGodName] เป็นผู้ประทาน และ [first_candidate.GetFaith.HighGodName] ก็เป็นผู้รับไป"
