l_english: 
 ### SETUP
 activity_local_examination: "การสอบคัดเลือกส่วนท้องถิ่น"
 activity_local_examination_plural: "การสอบคัดเลือกส่วนท้องถิ่น"
 activity_local_examination_destination_selection: "ท่านสามารถจัด $activity_local_examination$ ได้ใน [capital|E] ของท่านเท่านั้น"
 activity_local_examination_selection_tooltip: "จงจัด [GetActivityType('activity_local_examination').GetName] เพื่อประเมินทักษะและ [merit|E] ของเหล่าข้าแผ่นดิน $activity_local_examination_host_rewards$"
 activity_local_examination_desc: "นับเป็นเกียรติและหน้าที่ของเราในการธำรงไว้ ซึ่งโครงสร้างและจัดเตรียมการสอบคัดเลือกเหล่านี้ การสอบนี้จักช่วยให้เราสามารถประเมิน, ตัดสิน, และมอบ [merit|E] แก่บุคคลผู้เหมาะสมที่สุด — เพื่อสร้างหลักประกันถึงความรุ่งเรืองสืบไปของอาณาจักร"
 activity_local_examination_host_desc: "$activity_local_examination_host_rewards$$activity_local_examination_guest_rewards$"
 activity_local_examination_host_rewards: "\n$BULLET_WITH_TAB$[legitimacy_i] [legitimacy|E]\n$BULLET_WITH_TAB$[prestige_i|E] [prestige|E]"
 activity_local_examination_guest_desc: "\n$BULLET_WITH_TAB$โอกาสในการสำเร็จ @provincial_exam_icon! #V การสอบระดับภูมิภาค#!\n$BULLET_WITH_TAB$อาจเพิ่ม [trait_level_track_xp|E] ของ [GetTrait('confucian_education').GetName( GetNullCharacter )] ของท่าน\n$BULLET_WITH_TAB$อาจเพิ่ม [merit|E] ของท่าน\n$BULLET_WITH_TAB$ @alert_icon! #alert_trial หากท่านไม่รู้ [language|E] [host.GetCulture.GetLanguage.GetName] โอกาสสำเร็จของท่านจะลดลงอย่างมาก!"
 activity_local_examination_guest_rewards: "\n$BULLET_WITH_TAB$อาจได้ตัวละครผู้มีทักษะสูงมาร่วม\n$BULLET_WITH_TAB$ผู้เข้าร่วมอาจได้รับ [GetTrait('confucian_education').GetName( GetNullCharacter )] [trait_level_track_xp|E]\n$BULLET_WITH_TAB$ผู้เข้าร่วมอาจได้รับ [merit|E]"
 local_examination_base_cost: "ค่าใช้จ่ายพื้นฐาน"
 activity_local_examination_host_an_a: ""

 activity_local_examination_with_icon: "$activity_local_examination$ @provincial_exam_icon!"
 activity_local_examination_expected_frequency: "คาดว่าจะจัดขึ้นทุกปี"
 activity_local_examination_can_complete_tt: "$activity_local_examination_not_available_tt$"
 activity_local_examination_not_available_tt: "#T [GetActivityType( 'activity_local_examination' ).GetNameNoTooltip]#!\nณ [activity|E] นี้ ผู้เข้าสอบสามารถดำเนินการให้เสร็จสิ้น:\n@provincial_exam_icon! การสอบระดับมณฑล\n\n$activity_local_examination_expected_frequency$"

 activity_local_exam_not_passed_tt: "ท่านยังไม่ผ่านการสอบคัดเลือกส่วนท้องถิ่น"

 # Province Selection
 activity_local_examination_province_kaifeng_palace_desc: "#P ++ $building_type_kaifeng_palace_01$#!"
 activity_local_examination_province_examination_hall_desc: "#P ++ $building_type_examination_hall_01$#!"


 #Activity Window Characters
 activity_window_character_player_guest_traveling: "[guest|E]\n[Character.GetShortUINameNoTooltip|U]"
 activity_local_examination_guest_help_text: "[activity_guests|E] ที่ได้รับเชิญมา ล้วนต้องเข้ารับการทดสอบ; และการสอบผ่านหมายถึง [merit|E] ที่มากขึ้นแก่แขกผู้มาเยือน ตลอดจน [prestige|E] ที่เพิ่มขึ้นสำหรับ [activity_host|E]\n\nการสอบคัดเลือกยังเป็นโอกาสอันดียิ่งในการสร้างสายสัมพันธ์และพบปะเหล่าขุนนางคนสำคัญ"

 ### PHASES
 local_examination_phase_assembly: "การรวมตัว"
 local_examination_phase_assembly_desc: "ผู้มีสิทธิ์เข้าสอบทุกคนกำลังเดินทางไปยังสนามสอบ"
 local_examination_phase_preparation: "การเตรียมการ"
 local_examination_phase_preparation_desc: "เหล่าผู้เข้าสอบ ตลอดจนเจ้าภาพ, ต่างรอคอยเวลา, เร่งรีบจัดเตรียมการเท่าที่จะสามารถทำได้สำหรับการสอบ"
 local_examination_phase_examination: "การสอบระดับมณฑล"
 local_examination_phase_examination_desc: "การสอบได้เริ่มขึ้นแล้ว บัดนี้สุดแท้ แต่โชคชะตา"

