 coronation_events.1012.t: "การเสิร์ฟแบบดิบ ๆ"
 coronation_events.1012.guest.desc: "อาหารจานหลักมาถึง: จานเด็ดจานนี้จะเป็นที่จดจำของเหล่าผู้ยิ่งใหญ่และผู้ดีทั้งหลาย!\n\nขณะที่เจ้าภาพของเราหั่นเนื้อ ความหิวของข้าก็มลายสิ้น เนื้อย่างพ่นเลือดสาดกระจายไปทั่วโต๊ะ งานเลี้ยงกลายเป็นสนามรบ ข้าพยายามกลั้นอาการคลื่นไส้ขณะที่เสียงกระซิบแสดงความขยะแขยงดังขึ้นรอบตัว"
 coronation_events.1012.host.desc: "อาหารจานหลักมาถึง: จานเด็ดในงานเลี้ยงของข้าจะเป็นที่จดจำของเหล่าผู้ยิ่งใหญ่และผู้ดีทั้งหลาย!\n\nขณะที่ข้าหั่น [guest.Custom('GetExpensiveMeal')] ความหิวของข้าก็มลายสิ้น เนื้อย่างพ่นเลือดสาดกระจายไปทั่วโต๊ะ งานเลี้ยงกลายเป็นสนามรบ ข้าพยายามกลั้นอาการคลื่นไส้ขณะที่เสียงกระซิบแสดงความขยะแขยงดังขึ้นรอบตัวข้า\n\nขณะสงสัยว่าข้าควรจ่ายเงินเพิ่มสำหรับอาหารหรือไม่ ข้ามองดู [guest.GetName] ผลักจานของ[guest.GetHerHis]ออกไปด้วยความสยดสยอง — ต้องรีบดำเนินการโดยเร็ว!"
 coronation_events.1012.eat_it: "เจ้าต้องกินมัน และเจ้าต้องชอบมัน!"
 coronation_events.1012.back: "คนรับใช้! เอานี่กลับไปที่ครัว!"
 coronation_events.1012.trend: "ท่านหมายความว่าอย่างไร? นี่คือกระแสนิยมล่าสุด!"
 coronation_events.1012.complain: "[host.GetTitledFirstNameNoTooltip] นี่เรื่องตลกหรือ?"
 coronation_events.1012.munch: "ดูดีพอสำหรับข้าแล้ว!"

 coronation_events.1013.t: "ค่ำคืนอันลุกเป็นไฟ"
 coronation_events.1013.guest.desc: "ความครื้นเครงของแขกเหรื่อคนอื่น ๆ ทำให้ข้ายิ้มได้ ข้าหัวเราะหึ ๆ ขณะที่การสังสรรค์อันอึกทึกของพวกเขา ทำให้พวกเขาหกล้มทับกัน\n\n ท่าทางหยาบโลนกะทันหันปัดคบเพลิงหลุด และมันก็พุ่งเข้าไปในผ้าม่าน!\n\nเปลวไฟลามเลียไปตามกำแพงขณะที่แขกเหรื่อกรีดร้องและแตกตื่น ข้าพุ่งตัวหาที่กำบัง หัวใจเต้นระรัว ขณะที่ห้องโถงเต็มไปด้วยควันและความตื่นตระหนกในไม่ช้า"
 coronation_events.1013.host.desc: "ข้าหัวเราะหึ ๆ ขณะที่การสังสรรค์อันอึกทึกของแขก ทำให้พวกเขาหกล้มทับกัน\n\nท่าทางหยาบโลนกะทันหันปัดคบเพลิงหลุด และมันก็พุ่งเข้าไปในผ้าม่าน! เปลวไฟลามเลียไปตามกำแพงขณะที่แขกเหรื่อกรีดร้องและแตกตื่น\n\nเนื่องจากมัวสนใจ [guest.Custom('GetExpensiveDrink_Singular')] ของ[guest.GetHerHis] [guest.GetName] [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('guest'))] ของข้า จึงไม่ทันสังเกตเห็นไฟ ข้าต้องรีบจัดการ!"
 coronation_events.1013.burn: "ดี ปล่อยให้[guest.GetHerHim]ไหม้ไป"
 coronation_events.1013.run: "ข้าจะออกจากที่นี่ได้อย่างไร?!"
 coronation_events.1013.hero: "ข้าจะสกัดไฟไว้เอง! ทางนี้!"
 coronation_events.1013.snuff_out: "หากเราเพียงตัดอากาศ..."
 coronation_events.1013.douse: "ยกถัง [ROOT.Char.Custom('RegionalDrink')] มาดับไฟ!"

 coronation_events.1014.t: "ความตื่นตระหนกเรื่องอาหาร"
 coronation_events.1014.guest.desc: "ขณะกำลังลิ้มรส [guest.Custom('GetExpensiveMeal')] อันหรูหรา ข้าเงยหน้าขึ้นเมื่อได้ยินเสียงร้องแสดงความไม่พอใจ\n\nดูเหมือนว่าเจ้าภาพของเราละเลยที่จะเตรียมอาหารให้เพียงพอสำหรับแขกทุกคน เหล่าลอร์ดชูจานเปล่า ความหยิ่งทะนงที่ถูกทำร้ายก่อให้เกิดวาจาเชือดเฉือนและการใช้ศอกที่คมคายยิ่งกว่า ข้าหลบหลีกคำสบประมาทขณะที่เหล่าขุนนางผู้ขุ่นเคืองแย่งชิงเศษอาหาร\n\n[guest.GetName] ตกอยู่ท่ามกลางความโกลาหล"
 coronation_events.1014.host.desc: "ขณะกำลังลิ้มรส [guest.Custom('GetExpensiveMeal')] อันหรูหรา ข้าเงยหน้าขึ้นเมื่อได้ยินเสียงร้องแสดงความไม่พอใจ\n\nดูเหมือนว่าข้าละเลยที่จะเตรียมอาหารให้เพียงพอสำหรับแขกทุกคน เหล่าลอร์ดชูจานเปล่า ความหยิ่งทะนงที่ถูกทำร้ายก่อให้เกิดวาจาเชือดเฉือนและการใช้ศอกที่คมคายยิ่งกว่า ข้าหลบหลีกคำสบประมาทขณะที่เหล่าขุนนางผู้ขุ่นเคืองแย่งชิงเศษอาหาร\n\n[guest.GetName] ตกอยู่ท่ามกลางความโกลาหล"
 coronation_events.1014.join: "เอามือออกไป! ชิ้นสุดท้ายเป็นของข้า!"
 coronation_events.1014.calm: "ควบคุมเจ้าพวกโง่เขลาเหล่านี้!"
 coronation_events.1014.run: "ข้าพอกันทีกับเรื่องตลกนี่!"

 coronation_events.1015.t: "การดื่มอวยพรอันศักดิ์สิทธิ์"
 coronation_events.1015.desc: "ความเงียบงันอันเปี่ยมศรัทธาเข้าปกคลุมเมื่อบทเพลงสรรเสริญของคณะนักร้องประสานเสียงจบลง รัศมีแห่งความศักดิ์สิทธิ์แผ่ซ่านไปทั่วห้องโถง ชื่อเสียงด้าน[GetPietyLevelName(ROOT.Char.GetPietyLevel)|L]ของข้าดูเหมือนจะเรียกให้ [guest.GetName] [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('guest'))] ของข้า ลุกขึ้นและประกาศด้วยความกระตือรือร้นจากใจจริง:\n\n"ขอแสงสว่างแห่ง [ROOT.Char.GetFaith.DivineRealm|U] จงส่องนำรัชสมัยของท่าน และขอ [ROOT.Char.GetFaith.HighGodName] จงนำทางท่าน! ขอ [ROOT.Char.GetFaith.CreatorName] ประทานปัญญาแก่ท่าน และขอ [ROOT.Char.GetFaith.DevilName] อย่าได้ย่างกรายมาใกล้!""
 coronation_events.1015.divine: "สรรเสริญ [ROOT.Char.GetFaith.HighGodName]!"
 custom.every_zealous_attending_character: "ตัวละครที่มี [GetTrait('zealous').GetName( GetNullCharacter )] ทุกคนที่เข้าร่วม"
 coronation_events.1015.cherish: "ท่านช่างใจดีเหลือเกิน [guest.GetFirstNameNoTooltip]!"
 coronation_events.1015.hush: "เห็นด้วย ตอนนี้เงียบได้แล้ว"

 coronation_events.1016.t: "ชูถ้วย"
 coronation_events.1016.desc: "ห้องโถงเงียบสงัด แขกของข้ารอคอยอย่างใจจดใจจ่อให้ข้าพูด ข้าลดถ้วยดื่มลงและทอดสายตาไปยัง [guest.GetFirstName] [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('guest'))] ผู้[guest.Custom('InsultAdjective')]ของข้า และ [guest_2.GetFirstName] [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('guest_2'))] ผู้[guest_2.Custom('InsultAdjective')]ที่ระแวดระวังไม่แพ้กัน\n\nข้าควรจะยกย่องพวกเขาด้วยคำหวานที่เล่นกับความทะนงตน หรือจะเสนอการดื่มอวยพรที่เคลือบยาพิษเพื่อย้ำเตือนพวกเขาว่าผู้ใดกุมอำนาจที่นี่?"
 coronation_events.1016.great: ""จงฟังคำของข้า เพราะมันคือความจริง!""
 coronation_events.1016.great.tt.success: "ท่านเอาชนะใจพวกเขาได้"
 coronation_events.1016.great.tt.failure: "ท่านมิอาจโน้มน้าวพวกเขาได้"
 coronation_events.1016.embarrass: ""[guest.GetFirstNameNoTooltip] และ [guest_2.GetFirstNameNoTooltip] ข้าขอเตือนพวกท่านว่า...""
 coronation_events.1016.nah: "... หรือข้าควรจะดื่ม [guest.Custom('GetExpensiveDrink_Singular')] เพิ่มแทน"

 coronation_events.1017.t: "โอกาสในเครื่องดื่ม"
 coronation_events.1017.desc: "ทั่วทั้งห้องโถง เหล่าขุนนางเผยภาชนะบรรจุเครื่องดื่มชั้นเลิศแห่งอาณาจักรของตน [supporter.GetFirstName] [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('supporter'))] ผู้[supporter.Custom('ComplimentAdjective')]ของข้า เสนอให้ชิม [supporter.Custom('RegionalDrink')] ซึ่งมีกลิ่นหอมหวานดุจน้ำผึ้ง\n\nฝั่งตรงข้าม [detractor.GetFirstName] [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('detractor'))] ผู้[detractor.Custom('InsultAdjective')]ของข้า ยื่น [detractor.Custom('RegionalDrink')] ชั้นดีให้ กลิ่นที่รุนแรงของมันบ่งบอกถึงรสขมขื่นอย่างมิต้องสงสัย\n\nเพียงแค่กลิ่นก็กระตุ้นประสาทสัมผัสของข้าแล้ว ทุกคนต่างรอคอยการตัดสินใจของข้า"
 coronation_events.1017.diplo: "ขอให้รัชสมัยของข้าคู่ควรกับความอุดมสมบูรณ์และงานฝีมือ เช่นนี้!"
 coronation_events.1017.isolate: "ใช่ [detractor.GetFirstNameNoTooltip] เหล้าชั้นเลวที่เหมาะกับคนรับใช้ของข้า"
 coronation_events.1017.empower: "ได้โปรด ส่งมาให้ข้าอีก [supporter.GetFirstName]!"
 coronation_events.1017.nah: "ให้แขกของข้าดื่มก่อน แล้วข้าจะดื่มทีหลัง"
 bp4_coronation_good_harvest_modifier: "ความอุดมสมบูรณ์ของเครื่องดื่มต่างแดน"
 
 coronation_events.1018.t: "เกมเก้าอี้"
 coronation_events.1018.desc: "ขณะที่ข้ากวาดตามองงานเลี้ยง ข้าได้ยินเสียง [supporter.GetFirstName] [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('supporter'))] ผู้[supporter.Custom('ComplimentAdjective')]ของข้า ตะโกนข้ามโต๊ะมาว่า: "ฝ่าบาท [detractor.GetFirstName] ไม่ควรนั่งใกล้ถึงเพียงนี้!" ข้าเหลือบมอง [detractor.GetFirstName] [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('detractor'))] ผู้[detractor.Custom2('InsultAdjective', ROOT.Char)]ของข้า ซึ่งนั่งอยู่ทางซ้ายมือของข้า"
 coronation_events.1018.desc.wrathful: "\n\nมารยาทขัดขวางมือข้าไว้ แต่หนทางที่ดีที่สุดย่อมเป็นการโยน [detractor.GetFirstName] และเก้าอี้ของ[detractor.GetHerHis]ไปให้ไกลจากข้า"
 coronation_events.1018.desc.diplo: "\n\nธรรมเนียมปฏิบัติเรียกร้องให้ข้าเชิดหน้าไว้และยิ้ม"
 coronation_events.1018.deal: "จงเก็บสหายไว้ใกล้ตัว..."
 coronation_events.1018.switch: "เอาไอ้[detractor.Custom2('InsultNoun', ROOT.Char)]นั่นไปไว้ไกล ๆ ข้า"
 bp4_shielded_reign_modifier: "หลีกเลี่ยงผู้เห็นต่าง"

 coronation_events.1019.t: "สัญลักษณ์แห่งความภักดี"
 coronation_events.1019.desc: "ข้าเหลือบมองเหล่าพันธมิตรผู้แข็งแกร่งของข้า: [supporter.Custom('ComplimentAdjective')] [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('supporter'))] นามว่า [supporter.GetFirstName] ผู้ซึ่งความกล้าหาญเมื่อครั้งที่ [supporter_memory.GetThirdPerspectiveDescription] นั้นเป็นที่ประจักษ์ และ [supporter_2.Custom('ComplimentAdjective')] [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('supporter_2'))] นามว่า [supporter_2.GetFirstName] ผู้ยืนหยัดเคียงข้างข้าเมื่อครั้งที่ [supporter_2_memory.GetThirdPerspectiveDescription] ใบหน้าของพวกเขาเปล่งประกายด้วยความคาดหวัง เพราะพวกเขารู้ดีว่าความจงรักภักดีของพวกเขาได้นำพาข้ามาถึงจุดนี้\n\nข้าจะชื่นชมกับความซื่อสัตย์เช่นนี้ได้อย่างไร หากไม่ใช้ทุกโอกาสเพื่อตอบแทนมัน...?"
 coronation_events.1019.both: "ทั้งคู่สมควรได้รับเท่าเทียมกัน"
 coronation_events.1019.memory_reward.tt: "ผลของตัวเลือกนี้ขึ้นอยู่กับประเภทของความทรงจำ"
 coronation_events.1019.supporter: ""[supporter.GetFirstNameNoTooltip] ข้ามีบางอย่างให้ท่าน""
 coronation_events.1019.supporter_2: ""[supporter_2.GetFirstNameNoTooltip] โปรดรับสิ่งนี้ไว้""
 coronation_events.1019.nah: "คงต้องพอเพียงแค่คำพูด"

 coronation_events.1020.t: "ความกังวลในหมู่ตระกูล"
 coronation_events.1020.desc: "เมื่องานเลี้ยงราชาภิเษกใกล้เลิกรา เสียงที่ดังขึ้นก็ตัดผ่านห้องโถง "ตระกูล [ROOT.Char.GetDynastyName] คือความแข็งแกร่งของอาณาจักร" [dynasty_vassal.Custom2('MyCharacterIntroduction', ROOT.Char)|U] ยืนกราน "ญาติพี่น้องของเราควรเป็นผู้นำ ตามที่ธรรมเนียมปฏิบัติกำหนดไว้"\n\nฟากหนึ่งของโต๊ะ [not_dynasty_vassal.Custom2('MyCharacterIntroduction', ROOT.Char)] สวนกลับ "แล้วพวกเราที่เหลือเล่า? พวกเราต้องจ่ายส่วยให้ลูกพี่ลูกน้องของท่านและสงบปากสงบคำหรือ?""
 coronation_events.1020.embrace_supporters: "ข้าจะเข้าข้างผู้ภักดี"
 coronation_events.1020.embrace_supporters.tt: "#EMP #low [characters|E] ที่ได้รับผลกระทบคือ [coronation_supporters|E]#!#! "
 coronation_events.1020.weaken_detractors: "แล้วเหตุใดข้าจึงต้องฟังเจ้าด้วยเล่า?"
 coronation_events.1020.weaken_detractors.tt: "#weak #EMP [characters|E] ที่ได้รับ [stress|E] คือ [coronation_detractors|E]#!#! "
 coronation_events.1020.a: "รับฟังพวกเขา และหาจุดร่วม"
 coronation_events.1020.a.flavor: "ข้ารวบรวมข้าหลวงทั้งสองและรับฟังอย่างตั้งใจ พยายามระงับอารมณ์และยืนยันสายสัมพันธ์ที่ยึดเหนี่ยวตระกูลของเราไว้ด้วยกัน"
 coronation_events.1020.b: "เข้าข้างความกังวลของ [not_dynasty_vassal.GetFirstNamePossessiveNoTooltip]"
 coronation_events.1020.b.custom: "[vassal|E] ทุกคนใน [dynasty|E] เดียวกัน"
 coronation_events.1020.b.tt: "ญาติของท่านจะไม่พอใจที่ท่านเข้าข้างคนนอกผู้นี้เพื่อแลกกับความภักดีของ[not_dynasty_vassal.GetHerHis]"
 coronation_events.1020.c: "ความโอหัง เช่นนี้มิอาจทนได้"
 coronation_events.1020.d: "หน้าที่ของข้าคือญาติพี่น้องของข้ามาก่อน"
 clan_unity_coronation_increased: "เลือกที่จะเข้าข้าง [house|E] มากกว่าคนนอกขณะจัดพิธีราชาภิเษก"
 clan_unity_coronation_decreased: "เลือกที่จะเข้าข้างคนนอกมากกว่า [house|E] ขณะจัดพิธีราชาภิเษก"

 coronation_events.1021.t: "ทองคำมาก่อนมงกุฎ"
 coronation_events.1021.desc: "แม้กระทั่งก่อนที่มงกุฎจะประดับเหนือหน้าผากข้า ภาระแห่งอาณาจักรก็กดทับในใจข้าแล้ว [taxman.GetTitledFirstName] [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('taxman'))] ของข้า ก้าวเข้ามาและประกาศว่า "ฝ่าบาท ข้าต้องขออนุญาตเก็บสิบชักหนึ่งเต็มจำนวนตามสิทธิ์ โดยปราศจากการแทรกแซงจากตุลาการราชสำนักของท่าน มิ เช่นนั้น ภาระหน้าที่การคลังของข้าจะเป็นภาระอันไม่เป็นธรรมแก่ข้า"\n\nข้างกาย[taxman.GetHerHim] [supporter.GetName] [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('supporter'))] ของข้า จับตามองอย่างตั้งใจ สายตาของ[supporter.GetHerHis]ถามว่า: ข้าจะยอมจำนนต่อการแสดงความละโมบอันโจ่งแจ้งนี้หรือ? พวกหน้าเลือดอย่าง [taxman.GetFirstNameNoTooltip] จะมาเป็นผู้ตัดสินความยุติธรรมของข้ากระนั้นหรือ?"
 coronation_events.1021.embrace_supporters: ""[supporter.GetFirstNameNoTooltip] ช่วยจับตาดูปีศาจตนนี้ให้ดี""
 coronation_events.1021.embrace_supporters.flavor: "ผู้สนับสนุนที่แท้จริงของข้ายืนหยัดเคียงข้างข้า... ส่วนพวกที่เมามัวในความโลภยืนอยู่ข้างหลังข้า คอยล้วงกระเป๋าข้า!"
 coronation_tax_collectors_watched_modifier: "ผู้สนับสนุนตรวจสอบเหล่าขุนนาง"
 coronation_tax_collectors_watched_modifier_desc: "การบริหารงานของผู้ปกครองผู้นี้เต็มไปด้วยผู้ภักดีที่แน่วแน่ ผู้คอยสอดส่องการทุจริตและการทรยศอย่างใกล้ชิด"
 coronation_tax_collector_scrutiny_modifier: "ถูกจับตามองโดยสหายข้าหลวง"
 coronation_tax_collector_scrutiny_modifier_desc: "ตัวละครนี้เป็นที่รู้จักในฐานะตัวป่วน และอยู่ภายใต้การตรวจสอบอันน่ารำคาญของผู้สนับสนุนที่ภักดีของนายเหนือหัว"
 coronation_harsh_collector_modifier: "นักเก็บภาษีผู้เหี้ยมโหด"
 coronation_harsh_collector_modifier_desc: "ตัวละครนี้ไร้ความปรานีในการขูดรีดภาษีและเป็นที่หวาดกลัวของราษฎร"
 coronation_thriving_collector_modifier: "นักเก็บภาษีผู้มั่งคั่ง"
 coronation_thriving_collector_modifier_desc: "ตัวละครนี้มีประสิทธิภาพในการเก็บภาษี สร้างความไม่พอใจให้แก่คนรอบข้าง"
 coronation_events.1021.impress_attendees: ""จงให้เกียรติประชาชนของข้าด้วยความเป็นธรรมของท่าน""
 coronation_events.1021.impress_attendees.flavor: "ให้เกียรติประเพณีของตระกูลเรา ยอมรับแขกทุกคน และไม่ ทำให้ผู้ใดแน่ใจว่าจุดยืนที่แท้จริงของข้าคืออะไร"
 coronation_events.1021.a: "[taxman.GetTitledFirstNameNoTooltip] ล่วงเกินเกินไปแล้ว"
 coronation_events.1021.a.flavor: "ข้าจะไม่ก้มหัวให้เงินตราขณะที่มงกุฎยังมิได้สวม ให้ทุกคนเห็นว่าใครเป็นผู้บัญชาใคร"
 coronation_events.1021.b: "ข้าจะยอม — เพื่อความมั่นคง"
 coronation_events.1021.b.flavor: "ปล่อยให้[taxman.GetHerHim]เก็บสิ่งที่[taxman.GetSheHe]ต้องการ ตราบใดที่ข้ายังปกครอง"
 custom.every_tax_slot_vassal: "[vassal|E] ทุกคนใน [tax_jurisdiction|E] ของ [tax_collector.GetShortUINamePossessive]"
 coronation_events.1021.c: "คลังของข้ามาก่อน เติมให้เต็ม"
 coronation_events.1021.c.flavor: "หากทองคำปูทางไปสู่อำนาจ ก็จงกองมันให้สูงและลึก สั่งให้ [taxman.GetFirstNameNoTooltip] มีอิสระเต็มที่"
 clan_unity_coronation_nepotism.desc: "สนับสนุนระบบพรรคพวกโดยการเข้าข้าง [house|E] ของ [unity_character.GetHerHis] เองระหว่างพิธีราชาภิเษกของ [unity_character.GetHerHis]"
 bp4_empowered_tax_collectors_modifier: "นักเก็บภาษีผู้มีอำนาจเพิ่ม"

 coronation_events.1022.t: "ข้อเสนอแห่งแพรไหม"
 coronation_events.1022.desc: "[ROOT.Char.Custom2('RelationToMe', SCOPE.sC('supporter'))] ของข้า, [supporter.GetName], คุกเข่าลงเบื้องหน้าข้า ชูหีบอาภรณ์ปักดิ้นขึ้น พลางกล่าวว่า:\n\n\"ฝ่าบาท จิตใจของข้าเปรียบดั่งสวนที่ความทรงจำ ซึ่งเรามีร่วมกันได้เบ่งบาน เพื่อเป็นเครื่องพิสูจน์ถึงความงดงามแห่งอดีต ข้าขอมอบอาภรณ์แพรเหล่านี้ ซึ่งเพียงพอสำหรับทั้งราชสำนักของท่าน ข้าเพียงขอให้ท่าน แต่งกายเหล่า [ROOT.Char.Custom('KnightCulturePluralNoTooltip')] ผู้สูงศักดิ์ในขบวนของท่าน ด้วยเครื่อง แต่งกายอันวิจิตรหาที่เปรียบมิได้เสมอไป\""
 coronation_events.1022.a: "ของขวัญอันงดงาม และคำแนะนำที่ยอดเยี่ยม!"
 coronation_events.1022.b: ""เพิ่มข้อเสนอของท่านมา แล้วข้าจะเป็นหนี้บุญคุณท่าน!""
 coronation_events.1022.c: "เราควรทำกำไรจากสิ่งเหล่านี้!"
 
 coronation_events.1023.t: "ทรงพระเจริญ [ROOT.Char.GetTitleAsNameNoTooltip]"
 coronation_events.1023.desc: "[detractor.GetName] [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('detractor'))] ของข้า ลุกขึ้นพร้อมชูถ้วยดื่มสูง ด้วยน้ำเสียง[detractor.Custom('InsultAdjective')] [detractor.GetSheHe]ประกาศว่า:\n\n"ฝ่าบาท ภายใต้มงกุฎอันอร่ามตานั้น ข้าเห็น [ROOT.Char.GetTitleAsNameNoTooltip] ผู้ [ROOT.Char.Custom('ComplimentAdjective')] ยิ่งนัก — น้อยคนนักที่จะอ้างได้ว่ามีไพร่ฟ้าที่ #EMP รักใคร่#! มากเท่า แม้ว่าบางคนจะกล้าตั้งคำถามถึงปัญญาในการตัดสินใจของท่านก็ตาม ใช่แล้ว พวกเราจะเป็น เช่นไรหากปราศจาก [ROOT.Char.GetTitleAsNameNoTooltip] [ROOT.Char.Custom('ComplimentAdjectiveArticle')] เช่นนี้ให้ประจบสอพลอและเยินยอ?"\n\nถ้อยคำของ[detractor.GetHerHis|U] ซึ่งไร้ความเมตตา ส่งความเย็นเยียบไปทั่วห้องโถง"
 coronation_events.1023.supporter.desc: "ข้ารู้สึกถึงทุกสายตาที่จับจ้องมาที่ข้า — โดยเฉพาะอย่างยิ่ง [supporter.GetName] [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('supporter'))] ของข้า ผู้ตกตะลึง"
 coronation_events.1023.a: ""วางใจเถิด รัชสมัยของข้าจะ [ROOT.Char.Custom('ComplimentAdjective')] อย่างแท้จริง!""
 coronation_events.1023.b: ""และข้าเป็นหนี้บุญคุณการสนับสนุนของ [supporter.GetFirstNamePossessiveNoTooltip] ทั้งหมด!""
 coronation_events.1023.c: ""ทหาร — จับกุมไอ้[detractor.Custom('InsultNoun')][detractor.Custom('InsultAdjective')]นี่!""
 coronation_events.1023.d: ""[detractor.GetFirstNameNoTooltip] การต้อนรับเจ้าสิ้นสุดลงแล้ว!""
 coronation_events.1023.e: "ข้าตอบรับคำพูดของ[detractor.GetHerHis]ด้วยการโค้งคำนับอย่างสุภาพ — เท่านั้น"

 coronation_events.1024.t: "สหายทั่วทุกหนแห่ง"
 coronation_events.1024.intro_diff_faith: "ด้วยความเคารพอย่างสุภาพ [foreign.GetTitleAsNameNoTooltip] แห่ง [foreign.GetPrimaryTitle.GetNameNoTier] ผู้เป็น [foreign.GetFaith.GetAdherentName] เข้ามาต่อหน้าข้า"
 coronation_events.1024.intro_diff_culture: "ด้วยท่าทีพิธีรีตองอันแปลกตาเล็กน้อย [foreign.GetTitleAsNameNoTooltip] แห่ง [foreign.GetPrimaryTitle.GetNameNoTier] ชาว [foreign.GetCulture.GetName] ส่งสัญญาณขอเวลาข้าสักครู่"
 coronation_events.1024.intro_diff_neither: "ด้วยพิธีการที่ฝึกฝนมาอย่างดี [foreign.GetTitleAsName] ผู้[foreign.Custom('ComplimentAdjective')] แห่ง [foreign.GetPrimaryTitle.GetNameNoTier] แนะนำ[foreign.GetHerselfHimself]ต่อข้า"
 coronation_events.1024.desc: "ถือหีบประดับอัญมณีในมือ [foreign.GetFirstNameNicknamedNoTooltip] กล่าวต่อห้องโถง:\n\n"ฝ่าบาท โปรดรับสัญลักษณ์แห่งไมตรีจิตนี้จาก [foreign.GetPrimaryTitle.GetTierAsNameNoTooltip|l] ของข้า ขอให้มันเป็นสัญลักษณ์ของสายสัมพันธ์อันยั่งยืนระหว่างประชาชนของท่านและของข้า""
 coronation_events.1024.supporter.desc: "\n\n[guest.GetName] [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('guest'))] ของข้า ลุกขึ้นมายืนข้างข้าและกระซิบว่า: "ของขวัญนี้อาจกลายเป็นจุดเริ่มต้นของบางสิ่งที่ยั่งยืน [ROOT.Char.GetTitleAsName] ของข้า!""
 coronation_events.1024.detractor.desc: "\n\n[guest.GetName] [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('guest'))] ของข้า โน้มตัวเข้ามา กระซิบอย่างชั่วร้าย: "สัญลักษณ์ เช่นนี้มักปิดบังผลประโยชน์อันไม่น่าพิสมัย [ROOT.Char.GetTitleAsName] ของข้า...""
 coronation_events.1024.impress_attendees: ""ช่างเป็นช่วงเวลาอันรุ่งโรจน์สำหรับประชาชนของเราทั้งสอง!""
 coronation_events.1024.embrace_supporters: ""[foreign.GetFirstNameNoTooltip] ขอให้สายสัมพันธ์ของเราอย่าได้ขาดสะบั้น!""
 coronation_events.1024.weaken_detractors: ""[guest.GetFirstNameNoTooltip] ใส่ร้ายของขวัญของท่าน [foreign.GetFirstNameNoTooltip]!""
 coronation_events.1024.exalt_crown: ""และ ดังนั้น... ท่านจึงกลายเป็นรัฐบรรณาการของราชบัลลังก์ ใช่หรือไม่?""
 coronation_events.1024.a: ""#EMP หึ!#! ข้าไม่ต้องการของกระจุกกระจิก""
 coronation_events.1024.b: ""ข้ายอมรับด้วยความยินดี และสัญญาถึงไมตรีจิตของข้า""

 coronation_events.1025.t: "สายตาเย็นชา"
 coronation_events.1025.desc.intro: "ความตึงเครียดก่อตัวรอบ [supporter.GetName] และ [detractor.GetName] [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('detractor'))] ของข้า พวกเขานั่งแยกกัน จ้องเขม็งและแสดงท่าทีขมขื่นใส่กัน ข้าได้ยินเสียงสะท้อนของความขุ่นเคืองที่มีเพียงมงกุฎของข้าเท่านั้นที่จะสงบได้\n\n"
 coronation_events.1025.desc.supporter: "แม้ท่ามกลางการพูดจาว่าร้ายของ[supporter.GetHerHis] [supporter.GetTitledFirstNameNoTooltip] ก็ยังคงยิ้มอย่างภักดีเมื่อ[supporter.GetSheHe]สังเกตเห็นสายตาของข้าจับจ้องไปที่[supporter.GetHerHim]"
 coronation_events.1025.desc.detractor: "\n\nในทางกลับกัน [detractor.GetTitledFirstName] นั่งอยู่ #EMP บน#! โต๊ะของ[detractor.GetHerHis] ห่มคลุมด้วย [detractor.Custom('RegionalFabric')] และความท้าทายอย่างเต็มที่ [detractor.GetSheHe|U] นำกลุ่มผู้เห็นต่างที่มีความคิด เช่นเดียวกันเยาะเย้ย [supporter.GetFirstNameNoTooltip] ผู้ '[supporter.Custom('InsultAdjective')]'"
 coronation_events.1025.a: ""ข้าหนุนหลัง [supporter.GetFirstNameNoTooltip] อย่างเต็มที่และเสมอไป!""
 coronation_events.1025.b: ""มาเถิด! เราต้องเฉลิมฉลองเป็นหนึ่งเดียวกัน!""
 coronation_events.1025.c: "[supporter.GetFirstNameNoTooltip] ได้รับการสนับสนุนจากข้า"
 coronation_events.1025.d: "โยนความผิดทั้งหมดให้ [detractor.GetFirstNameNoTooltip]"
 coronation_events.1025.e: ""ได้โปรด คิดถึงอนาคตของเรา!""
 coronation_events.1025.f: "อันที่จริง [detractor.GetFirstNameNoTooltip] ก็พูดถูกในเรื่องนี้"

 coronation_events.1026.t: "เค้กอันเป็นที่จดจำ"
 coronation_events.1026.desc: "ในที่สุด เค้กก็มาถึง — สูงตระหง่าน รุ่งโรจน์ ดั่งอัญมณีประดับมงกุฎแห่งงานเลี้ยง เหล่าพ่อครัวที่เหนื่อยล้า แต่ภาคภูมิใจ ใช้เวลาทั้งคืนเรียงชั้น [ROOT.Char.Custom('FavoriteTreatDemand')] และ [ROOT.Char.Custom('GetFoodDetail')] แต่ละชั้นอบอวลไปด้วยกลิ่น [ROOT.Char.GetCurrentLocation.Custom('get_region_flower_type')] ที่ใดที่หนึ่งข้างในมีสัญลักษณ์เล็ก ๆ ซ่อนอยู่ ซึ่งข้าซ่อนไว้เอง!"
 coronation_events.1026.supporter_desc: "\n\n[token_finder.GetNameNoTooltip] ดึงสัญลักษณ์ออกมาจากชั้นเค้กอย่างผู้มีชัย ความยินดีของ[token_finder.GetHerHis]มีมากเสียจน[token_finder.GetSheHe]เกือบจะตบหลัง[ROOT.Char.Custom('GetTitleTierAdjective')]ของข้า ห้องโถงระเบิดเสียงปรบมือ — ผู้สนับสนุนผู้ภักดี ผู้ ซึ่งโชคลาภสัมผัส ก็เป็นที่โปรดปรานของราชบัลลังก์ เช่นกัน"
 coronation_events.1026.detractor_desc: "\n\n[token_finder.GetNameNoTooltip] หยิบสัญลักษณ์ออกจากเค้กด้วยรอยยิ้มเยาะ ชัยชนะของ[token_finder.GetHerHis]นั้นชัดเจน เสียงพึมพำดังระลอกคลื่นไปทั่วห้องโถง — ดูเหมือนโชคลาภจะเข้าข้างแม้กระทั่งนักวิจารณ์ของราชบัลลังก์ อย่างน้อยก็ในคืนนี้"
 coronation_events.1026.special_desc: "\n\nด้วยท่าทีสง่างาม ข้าจ้วงมีดลงไปและดึงสัญลักษณ์ออกมาด้วยตนเอง ความเงียบเข้าปกคลุมก่อนที่ห้องโถงจะดังกระหึ่มด้วยเสียงปรบมือ — เจ้าภาพได้รางวัลไปครอง!"
 coronation_events.1026.fallback_desc: "\n\n[token_finder.GetNameNoTooltip] ดึงสัญลักษณ์ออกมาอย่างผู้มีชัย ได้รับเสียงเชียร์และคำสัญญาแห่งโชคลาภที่จะมาถึง"
 coronation_events.1026.special: "ข้าเจอมัน! สรรเสริญข้า!"
 coronation_events.1026.a: "ตอนนี้ถึงเวลา ทำให้ทุกคนทึ่งด้วยสุนทรพจน์!"
 coronation_events.1026.b: "[token_finder.GetFirstName] มารับรางวัลของท่าน!"
 coronation_events.1026.c: "[token_finder.GetFirstName] เจ้าจะเป็นคนแรกที่คุกเข่า"
 coronation_events.1026.d: "ขอให้ช่วงเวลานี้อยู่ในนามของ [ROOT.Char.GetDynastyNameNoTooltip] ตลอดไป!"
 coronation_events.1026.e: "รอไม่ไหวแล้วที่จะได้กินเค้กนั่น!"
 coronation_events.1026.f: "ส่วนของข้า ขอมอบให้เหล่าไพร่!"

 coronation_events.1027.t: "ช่วงเวลาของ [highlighted_guest.GetTitledFirstNamePossessiveNoTooltip|U]"
 coronation_events.1027.desc: "เหล่าขุนนางเริ่มการ [ROOT.Char.Custom('GetMedievalDance')] ที่ออกแบบท่าทางมาอย่างดี พวกเขาถืออุปกรณ์เชิงสัญลักษณ์ แสดงฉากจากการผงาดขึ้น ชัยชนะ และความทะเยอทะยานของราชวงศ์ข้า ทุกสายตาจับจ้องไปที่บุคคลศูนย์กลางของปรากฏการณ์นี้..."
 coronation_events.1027.special_desc: "\n\nและข้าก็ตระหนักด้วยความประหลาดใจเล็กน้อยว่าเป็นข้าเองที่พวกเขากำลังสวมบทบาทเป็นวีรบุรุษแห่ง [ROOT.Char.GetPrimaryTitle.GetNameNoTierNoTooltip] — ช่างรุ่งโรจน์อย่างแท้จริง เป็นดั่งป้อมปราการแห่งนาม [ROOT.Char.GetDynastyName] พื้นที่ว่างเปิดออกกลางวงเต้นรำ พวกเขากำลังเรียกข้าให้เข้าร่วมการเต้นรำ แขกเหรื่อโห่ร้องด้วยความยินดี ความชื่นชมของพวกเขาน่ามัวเมาดุจไวน์"
 coronation_events.1027.supporter_desc: "\n\n[highlighted_guest.GetFirstName] [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('highlighted_guest'))] ของข้า รับบทเป็นบรรพบุรุษผู้ได้รับการยกย่อง เรียกเสียงปรบมือด้วยการขับขานถึงความยิ่งใหญ่ของเชื้อสายข้าอย่างกระตือรือร้น ข้อความนั้นชัดเจน: สิทธิ์ในการปกครองของข้าคือมรดกที่สืบทอดมาด้วยความภาคภูมิใจ"
 coronation_events.1027.detractor_desc: "\n\nเป็นที่น่าประหลาดใจของข้า [highlighted_guest.GetFirstNameNoTooltip] [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('highlighted_guest'))] ของข้า ก้าวออกมาเมื่อพิธีการเรียกร้องการแสดงความเคารพเชิงสัญลักษณ์ ผู้ชมที่มาชุมนุมต่างขยับตัว อยู่ระหว่างเสียงหัวเราะและเสียงปรบมืออย่างไม่สบายใจ ไม่แน่ใจว่าจะถือว่านี่เป็นการล้อเล่น การแสดง... หรือคำเตือน"
 coronation_events.1027.fallback_desc: "\n\n[highlighted_guest.GetFirstNameNoTooltip] [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('highlighted_guest'))] ของข้า สวมบทบาทเป็นตัวอาณาจักรเอง — ห่มคลุมด้วยสีประจำราชบัลลังก์ [ROOT.Char.GetPrimaryTitle.GetNamePossessiveNoTooltip] ผูกพันด้วยริบบิ้นสีทอง ประกาศความภักดีด้วยความสง่างามอันเคร่งขรึม แขกเหรื่อพยักหน้าเห็นด้วย ชื่นชมในความโอ่อ่า"
 coronation_events.1027.special: "ถึงเวลารับตำแหน่งเคียงข้างพวกเขาแล้ว"
 coronation_events.1027.a: "ข้าปรบมือให้กับการแสดงของพวกเขาด้วยความสง่างามแบบชาววัง"
 coronation_events.1027.b: "สรรเสริญ [highlighted_guest.GetFirstNameNoTooltip] อย่างเปิดเผย — ความภักดีสมควรได้รับรางวัล"
 coronation_events.1027.c: "บ่อนทำลายช่วงเวลาของ [highlighted_guest.GetFirstNamePossessiveNoTooltip]"
 coronation_events.1027.d: "กล่าวสุนทรพจน์เกี่ยวกับประเพณีและตระกูล [ROOT.Char.GetDynastyNameNoTooltip]"
 coronation_events.1027.e: "ยิ้มอย่างอบอุ่นและแบ่งปันความสุข"
 coronation_events.1027.f: "เลือนหายไปในเบื้องหลังและปล่อยให้ช่วงเวลานี้ผ่านไป"

 coronation_events.1028.t: "พรจาก [clergy_representative.GetFaith.HighGodName]"
 coronation_events.1028.supporter.desc: "[clergy_representative.GetFirstName] [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('clergy_representative'))] ของข้า [clergy_representative.GetFaith.GetAdjective] ผู้เคร่งศาสนา ก้าวออกมา ท่าทางของ[clergy_representative.GetHerHis]เคร่งขรึมและสงบนิ่ง\n\n"[clergy_representative.GetFaith.HouseholdGodName] ยินดีในความเป็นหนึ่งเดียวในหมู่ผู้ปกครอง" [clergy_representative.GetSheHe]ประกาศ "โปรดอนุญาตให้ข้ามอบพรแก่ท่านในนามของ [clergy_representative.GetFaith.CreatorName] เพื่อเป็นสัญลักษณ์แห่งความปรองดอง"\n\n[guest.GetFirstName] หนึ่งในผู้สนับสนุนผู้ภักดีของข้า เฝ้าดูอย่างใกล้ชิด ทึ่งในท่าทีนั้น"
 coronation_events.1028.detractor.desc: "[clergy_representative.GetFirstName] [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('clergy_representative'))] ของข้า [clergy_representative.GetFaith.GetAdjective] ผู้แรงกล้า เข้ามาใกล้ด้วยความเคารพอย่างเชื่องช้า\n\n"[clergy_representative.GetFaith.HouseholdGodName] เรียกหาความสงบสุขข้ามพรมแดนและความเชื่อ" [clergy_representative.GetSheHe]กล่าว "ข้าขอเสนอพรจาก [clergy_representative.GetFaith.CreatorName] แก่ท่านในระหว่างพิธีราชาภิเษกของท่านได้หรือไม่?"\n\nจากฝูงชน [guest.GetFirstName] ผู้เคลือบแคลงในการปกครองของข้าอย่างเปิดเผย หรี่ตาของ[guest.GetHerHis]ลงแสดงความไม่เห็นด้วยอย่างชัดเจน"
 coronation_events.1028.fallback.desc: "ขณะที่พิธีราชาภิเษกดำเนินไป [clergy_representative.GetFirstName] [clergy_representative.GetFaith.GetAdherentName] ผู้มาเยือน ก้าวออกมาพร้อมกับยกมือขึ้นด้วยความเคารพอันเคร่งขรึม\n\n"[clergy_representative.GetFaith.HouseholdGodName] สอนถึงสันติภาพและความเข้าใจในทุกความเชื่อ" [clergy_representative.GetSheHe]กล่าวอย่างอ่อนโยน "ท่านจะรับพรจาก [clergy_representative.GetFaith.CreatorName] เพื่อเป็นสิริมงคลแก่รัชสมัยของท่านหรือไม่?"\n\n[guest.GetFirstName] หนึ่งในขุนนางที่มาชุมนุม เอียงศีรษะของ[guest.GetHerHis] — อ่านไม่ออก เฝ้าสังเกต"
 coronation_events.1028.supporter: "ข้าเรียก [guest.GetFirstNameNoTooltip] มาข้างกายข้า"
 coronation_events.1028.detractor: "ป้ายสี [guest.GetFirstNameNoTooltip] ว่าเป็นผู้เห็นอกเห็นใจพวก [clergy_representative.GetFaith.GetAdjectiveNoTooltip]"
 coronation_events.1028.a: "ยอมรับพรในจิตวิญญาณแห่งความอดทนอดกลั้น"
 coronation_events.1028.b: "ปฏิเสธพรของพวกนอกรีตอย่างสุภาพ"
 coronation_events.1028.c: ""แต่นี่มันนอกรีตชัด ๆ!""
 coronation_events.1028.d: "หลีกเลี่ยงคำถามไปเลย"
 coronation_events.1028.detractor.tt: "ผู้เข้าร่วมทุกคนที่มี [faith|E] เดียวกัน ซึ่งไม่ [GetTrait('cynical').GetName( GetNullCharacter )]"
 coronation_events.1028.a.tt: "ผู้เข้าร่วมทุกคนที่มี [faith|E] เดียวกัน ซึ่ง [GetTrait('zealous').GetName( GetNullCharacter )]"
 coronation_events.1028.a.tt3: "ผู้เข้าร่วมทุกคนที่มี [faith|E] ของ [clergy_representative.GetShortUINamePossessive]"
 coronation_events.1028.b.tt: "ผู้เข้าร่วมทุกคนที่มี [faith|E] เดียวกัน ซึ่ง [GetTrait('zealous').GetName( GetNullCharacter )]"
 coronation_events.1028.c.tt: "ผู้เข้าร่วมทุกคนที่มี [faith|E] เดียวกัน ซึ่ง [GetTrait('zealous').GetName( GetNullCharacter )]"
 
 coronation_events.1029.t: "คำปฏิญาณที่ถูกลืม"
 coronation_events.1029.desc: "ข้าได้ยินเสียงคลี่ม้วนกระดาษยาวอย่างชัดเจน "นายเหนือหัวของข้า" [priest.GetFirstName] [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('priest'))] ของข้า กล่าว พลางโค้งคำนับเล็กน้อย "ข้าพบสิ่งนี้ในหมู่บันทึกที่เก่าแก่ที่สุดของ [primary_title.GetAdjective] มันกล่าวถึงคำปฏิญาณที่ [ROOT.GetCharacter.Custom('GetMythicalFounder')] ได้สาบานไว้ มอบสิทธิ์และอภิสิทธิ์แก่ผู้ปกครองในอนาคต ซึ่งกาลเวลาได้ลืมเลือนไป"\n\n[guest.GetFirstName] [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('guest'))] ของข้า โน้มตัวเข้ามาด้วยความอยากรู้อย่างเห็นได้ชัด "สสัญญาที่ถูกลืมหรือ? นี่อาจจะ... น่าสนใจ" [guest.GetSheHe]พึมพำ"
 coronation_events.1029.supporter.desc: "กลิ่นของม้วนกระดาษเก่าคร่ำคร่าแตะจมูกข้า "นายเหนือหัวของข้า" [priest.GetFirstName] [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('priest'))] ของข้า ประกาศ "นี่คือคำปฏิญาณที่ [ROOT.GetCharacter.Custom('GetMythicalFounder')] ได้สาบานไว้ ผูกมัดผู้ปกครองและไพร่ฟ้าผู้ภักดีเข้าด้วยกันในหน้าที่และรางวัล ซึ่งกันและกัน จากหอจดหมายเหตุที่เก่าแก่ที่สุดของเรา! และย่อมมีไว้สำหรับช่วงเวลา เช่นนี้อย่างแน่นอน"\n\n[guest.GetFirstName] [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('guest'))] ของข้า และผู้สนับสนุนผู้ภักดี ยิ้มกว้าง "ช่างเป็นช่วงเวลาที่เหมาะอย่างยิ่งที่จะรื้อฟื้นคำสสัญญาเก่า ๆ""
 coronation_events.1029.detractor.desc: "[priest.GetFirstName] [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('priest'))] ของข้า คลี่ม้วนกระดาษเก่าคร่ำคร่า "นายเหนือหัวของข้า" [priest.GetSheHe]ประกาศ "นี่คือคำปฏิญาณของ [ROOT.GetCharacter.Custom('GetMythicalFounder')] การประกาศอำนาจอธิปไตยเหนือดินแดนทั้งปวง! 'เพิ่งถูกค้นพบจากหอจดหมายเหตุของ [primary_title.GetNameNoTier] คำปฏิญาณนี้ยืนยันสิทธิ์ของท่านในการบัญชาความภักดี — และลงโทษการต่อต้าน"\n\n[guest.GetFirstName] [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('guest'))] ของข้า และผู้เห็นต่างที่พูดจาโผงผาง หัวเราะเยาะเสียงดัง "ถ้อยคำเก่า ๆ และตายไปแล้วทั้งนั้น!""
 coronation_events.1029.a: "แท้จริงแล้ว การปกครองของข้าถูกกำหนดโดย [ROOT.Char.GetFaith.HighGodName]!"
 coronation_events.1029.b: "[guest.GetFirstNameNoTooltip] ขอให้คำปฏิญาณของเราเทียบเท่ากับคำปฏิญาณในอดีต"
 coronation_events.1029.c: "ทำให้มันเกี่ยวกับความจงรักภักดีของ [guest.GetFirstNamePossessiveNoTooltip] ต่อข้า"
 coronation_events.1029.d: "ประกาศข้อความที่สาบสูญให้ทุกคนรู้!"
 coronation_events.1029.e: "ปล่อยให้อดีตถูกฝังกลบต่อไป"
 
 coronation_events.1030.t: "บันทึกไว้ให้คนรุ่นหลัง"
 coronation_events.1030.exalt.desc: "[scholar.GetTitledFirstName] [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('scholar'))] ของข้า เข้ามาใกล้พร้อมรอยยิ้มกระตือรือร้น\n\n"ฝ่าบาท" [scholar.GetSheHe]กล่าว "ความยิ่งใหญ่ของพิธีราชาภิเษกของท่านสมควรได้รับตำแหน่งในหน้าประวัติศาสตร์ ข้าขอให้อาลักษณ์คนหนึ่งของข้าบันทึกความงดงามของเครื่องราชกกุธภัณฑ์ของท่าน พลังอำนาจของ [ROOT.Char.GetPrimaryTitle.GetNameNoTier] และความน่าเกรงขามที่ท่านสร้างขึ้นที่นี่ได้หรือไม่?""
 coronation_events.1030.impress.desc: "[scholar.GetTitledFirstName] [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('scholar'))] ของข้า ชี้มาทางข้า\n\n"ช่างเป็นผู้ชมที่ทุ่มเทจริง ๆ!" [scholar.GetSheHe]อุทาน "หากท่านอนุญาต ข้าจะขอให้อาลักษณ์คนหนึ่งของข้าบันทึกปฏิกิริยาของแขกของท่าน — เสียงเชียร์ เสียงสูดปาก แม้กระทั่งน้ำตา อย่าให้ผู้ใดลืมว่าพิธีราชาภิเษกของท่าน ทำให้เราทุกคนซาบซึ้งเพียงใด""
 coronation_events.1030.supporters.desc: "[scholar.GetTitledFirstName] [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('scholar'))] ของข้า ทักทายข้าด้วยดวงตาที่สดใส\n\n"สิ่งที่ ทำให้ข้าประทับใจที่สุด" [scholar.GetSheHe]กล่าว "คือความภักดีของไพร่ฟ้าของท่าน หากท่านอนุมัติ ข้าจะขอให้อาลักษณ์ของข้าเขียน [scholar.Custom('GetChronicleSaga')] เกี่ยวกับเหตุการณ์นี้ และถ้อยคำของพวกเขาจะเป็นเพียงเพื่อผู้สนับสนุนของท่าน เพื่อความสัตย์ซื่อของพวกเขา และความแข็งแกร่งที่เป็นหนึ่งเดียวของพวกเขา""
 coronation_events.1030.detractors.desc: "[scholar.GetTitledFirstName] [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('scholar'))] ของข้า โน้มตัวเข้ามาใกล้ด้วยท่าทีสมรู้ร่วมคิด พูดด้วยน้ำเสียงแผ่วเบา\n\n"ผู้เห็นต่างของท่านเงียบกริบอย่างน่าอึดอัด... หรือไม่ก็ส่งเสียงดังอย่างขมขื่น อาลักษณ์ของข้าจะบันทึกการต่อต้านของพวกเขาไว้ และคนรุ่นหลังจะได้ตัดสินศัตรูของท่านอย่างเหมาะสม...""
 coronation_events.1030.a: ""ใช่ ใช่ ความงดงามอันยั่งยืน!""
 coronation_events.1030.b: ""ได้โปรด เน้นย้ำถึงความสุขของแขกของข้า""
 coronation_events.1030.c: ""ขอให้ถ้อยคำของท่านคู่ควรกับความภักดีของพวกเขา""
 coronation_events.1030.d: ""ขอให้ไอ้พวกเดนสังคมถูกประณามตลอดไป""
 coronation_events.1030.e: ""ไม่ ข้อความควรจะเคารพ [ROOT.Char.GetFaith.HighGodName]""
 coronation_events.1030.tt.success: "[scholar.Custom('GetChronicleSaga')] ได้รับการยกย่อง"
 coronation_events.1030.tt.failure: "[scholar.Custom('GetChronicleSaga')] ถูกเยาะเย้ย"
 bp4_chronicled_coronation_modifier: "พิธีราชาภิเษกที่ถูกบันทึกไว้"
 legend_chapter_great_coronation: "[ROOT.Legend.GetProtagonist.GetNamePossessiveNoTooltip] จัดพิธีราชาภิเษกที่ยิ่งใหญ่ที่สุดเท่าที่มนุษย์เคยรู้จัก โดยมี [ROOT.Legend.GetProtagonist.GetFaith.HighGodName] [ROOT.Legend.GetProtagonist.GetFaith.HighGodHighGodHerselfHimself] อวยพรทุกช่วงเวลาของพิธีอันรุ่งโรจน์ ทุกส่วนของโลกที่รู้จักต่างจ้องมอง [ROOT.Legend.GetProtagonist.GetTitleAsNameNoTooltip] ด้วยความยำเกรง"

 coronation_events.1031.t: "คณะนักร้องประสานเสียงขับขาน"
 coronation_events.1031.exalt.desc: "ขณะที่ห้องโถงใหญ่ดังก้องไปด้วยความเร่งรีบในการเตรียมงาน [priest.GetFirstName] [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('priest'))] ของข้า ก็เข้ามาหาข้าพร้อมกับหนังสือเพลงสวดที่เก่าแก่หนีบไว้ใต้แขนของ[priest.GetHerHis]\n\n"ฝ่าบาท" [priest.GetSheHe]กล่าวด้วยความภาคภูมิใจอย่างเงียบ ๆ "คณะนักร้องประสานเสียงรอคำแนะนำจากท่านอยู่ เสียงของพวกเขาจะดังขึ้นเพื่อประกาศสิทธิ์อันศักดิ์สิทธิ์ของท่านและความงดงามของ [ROOT.Char.GetPrimaryTitle.GetNameNoTooltip] หรือไม่?"\n\nข้านึกภาพพิธีที่จะมาถึง — ทุกโน้ตเพลงยกระดับอาณาจักรให้สูงขึ้นในสายตาของผู้ชม"
 coronation_events.1031.impress.desc: "ขณะที่คนรับใช้กำลังจัดของประดับและอัศวินฝึกหัดกำลังซ้อมคิว [priest.GetFirstName] [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('priest'))] ของข้า ก็มาพบข้าท่ามกลางการเตรียมงาน\n\n"อาณาจักรจะตั้งใจฟังอย่างใกล้ชิด" [priest.GetSheHe]กล่าวพร้อมรอยยิ้มที่รู้ทัน "ให้คณะนักร้องประสานเสียงร้องเพลงสวดที่สะเทือนใจ และเอาชนะใจผู้คัดค้านที่โง่เขลาของท่าน"\n\nมันเป็นความคิดที่น่าพอใจ: ห้องโถงที่เต็มไปด้วยเสียง และทุกเสียงเป็นส่วนหนึ่งของการแสดงของข้า"
 coronation_events.1031.supporters.desc: "ท่ามกลางเหล่าอาลักษณ์และพ่อครัวที่วิ่งวุ่นไปตามทางเดิน [priest.GetFirstName] [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('priest'))] ของข้า หยุดข้าด้วยท่าทีอ่อนโยน\n\n"ผู้สนับสนุนที่ภักดีของท่านจะเฝ้าดูอยู่" [priest.GetSheHe]กล่าว "ขอให้เพลงสวดย้ำเตือนพวกเขาว่าเหตุใดพวกเขาจึงติดตามท่าน: เพลงที่ผูกมัดหัวใจที่เต็มใจเข้าด้วยกัน และเพิ่มพูนศรัทธาในการปกครองของท่าน"\n\nคณะนักร้องประสานเสียงรอการตัดสินใจของข้า กระตือรือร้นที่จะเริ่มการฝึกซ้อม"
 coronation_events.1031.detractors.desc: "[priest.GetFirstName] [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('priest'))] ของข้า เข้ามาใกล้ด้วยเสียงที่แผ่วเบาและเหลือบมองไปรอบ ๆ อย่างระมัดระวัง\n\n"ไม่ใช่ทุกคนที่มาชุมนุมจะโห่ร้องพระนามของท่าน" [priest.GetSheHe]เตือน "เมื่อบทเพลงสวดดังขึ้น ขอให้มันมีน้ำหนัก — อำนาจที่ปีศาจ ซึ่งต่อต้านท่านมิอาจเพิกเฉยได้ เติมเต็มหูของสิ่งมีชีวิตเหล่านั้นด้วยพลังแห่งมงกุฎของท่าน!"\n\nหัวหน้าคณะนักร้องประสานเสียงยืนพร้อม รอคอยการเลือกน้ำเสียงและข้อความของข้า"
 coronation_events.1031.a: ""จงขับขานถึงความรุ่งโรจน์ของข้า!""
 coronation_events.1031.b: ""ขอให้บทเพลงสวดเรียกร้องสันติภาพและความสามัคคี""
 coronation_events.1031.c: ""ทำให้มันเป็นคำเตือนแก่ศัตรูแห่งตระกูล [ROOT.Char.GetDynastyNameNoTooltip]""
 coronation_events.1031.d: ""ไม่เอาเพลงสวด ให้ความเงียบพูดแทนในวันนี้""
 coronation_events.1031.e: ""ข้ามีบทประพันธ์ที่สมบูรณ์แบบสำหรับเรื่องนั้น!""
 every_attending_vassal: "ข้าหลวงทุกคนที่เข้าร่วม"
 every_attending_detractor_or_compassionate: "ผู้เห็นต่างและแขกผู้เมตตาทุกคนที่เข้าร่วม"
 every_attending_poet_scholar: "ตัวละคร [GetTrait('lifestyle_poet').GetName( GetNullCharacter )] และ [GetTrait('scholar').GetName( GetNullCharacter )] ทุกคนที่เข้าร่วม"
 every_poet_scholar: "ตัวละคร [GetTrait('lifestyle_poet').GetName( GetNullCharacter )] และ [GetTrait('scholar').GetName( GetNullCharacter )] ทุกคนที่เข้าร่วม"

 coronation_events.1032.t: "ท่าทีอันกล้าหาญ"
 coronation_events.1032.desc: "โอกาสนี้ แม้จะสง่างามและเหมาะสม แต่ก็ยังรู้สึก... ไม่สมบูรณ์ นี่เป็นเพียงการรวมตัวตามธรรมเนียม งานเลี้ยงทั่วไปงั้นหรือ? หรือนี่คือช่วงเวลาสำหรับการดำเนินการทางการเมืองที่ยิ่งใหญ่ เพื่อการเปลี่ยนแปลงครั้งประวัติศาสตร์? [supporter.GetTitledFirstName] [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('supporter'))] ของข้า กระซิบที่หูข้า\n\n"ผู้ปกครองมิได้ยิ่งใหญ่ด้วยคำพูด... แต่ด้วยการกระทำ" [supporter.GetSheHe]กระตุ้น "การกระทำ! การกระทำที่สั่นสะเทือน [ROOT.Char.GetPrimaryTitle.GetTierAsName] จนถึงรากฐาน!"\n\n[detractor.GetFirstName] [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('detractor'))] ของข้า ผู้ ซึ่งไม่คิดว่าโอกาสนี้มีความสำคัญใด ๆ เฝ้ามองด้วยความรังเกียจ"
 coronation_events.1032.b: ""[supporter.GetFirstNameNoTooltip]: ให้เราประกาศความสัตย์ซื่อชั่วนิรันดร์ของเรา""
 coronation_events.1032.c: "ด้วยนิกายใหม่ ข้ารวบรวมผู้ศรัทธา!"
 coronation_events.1032.c.flavor: "[supporter.GetFirstNameNoTooltip] จะเตรียมการประกาศนิกายศักดิ์สิทธิ์ใหม่"
  create_holy_order_decision_effect_message_coronation: "[holy_order|E] แห่ง [faith|E] ของท่านจะถูกก่อตั้ง\n$EFFECT_LIST_BULLET$ท่านจะกลายเป็น [holy_order_patron|E] ของนิกาย\n$EFFECT_LIST_BULLET$[barony.GetName] จะกลายเป็นกองบัญชาการของนิกาย"
 coronation_events.1032.d: ""ดวงตาที่สอดรู้สอดเห็นจะต้องถูก — #EMP ควักออก!#!""
 coronation_events.1032.d.flavor: "[detractor.GetFirstNameNoTooltip] จะถูกเลือกมาลงโทษในที่สาธารณะระหว่างพิธีการ จะไม่ทนต่อการขัดขืน"
 coronation_events.1032.a: "ขอให้ท้องฟ้าจงร่วมเฉลิมฉลอง!"
 coronation_events.1032.a.flavor: "ให้คนรับใช้ของท่านปล่อยฝูงนกที่จับไว้ในอากาศ ปล่อยให้กรงทั้งหมดว่างเปล่า!"
 every_compassionate_calm_supporter: "ผู้เข้าร่วมทุกคนที่เป็น [GetTrait('compassionate').GetName( GetNullCharacter )], [GetTrait('calm').GetName( GetNullCharacter )] หรือ [coronation_supporter|E]"
 every_ambitious_wrathful_vassal: "ผู้เข้าร่วมทุกคนที่เป็น [GetTrait('ambitious').GetName( GetNullCharacter )] หรือ [GetTrait('wrathful').GetName( GetNullCharacter )]"
 every_attending_sadistic_arbitrary: "ผู้เข้าร่วมทุกคนที่เป็น [GetTrait('sadistic').GetName( GetNullCharacter )] หรือ [GetTrait('arbitrary').GetName( GetNullCharacter )]"
 every_attending_compassionate_just: "ผู้เข้าร่วมทุกคนที่เป็น [GetTrait('compassionate').GetName( GetNullCharacter )] หรือ [GetTrait('just').GetName( GetNullCharacter )]"
 create_alliance_supporter_tt: "ท่านและ [supporter.GetShortUIName] ก่อตั้ง [alliance|E]"
 coronation_events.1032.e: "ข้าแค่อยากให้เรื่องนี้จบ ๆ ไปเสียที..."

 coronation_events.1033.t: "เสียงอันไม่ประสาน"
 coronation_events.1033.desc: ""เรื่อง #EMP ตลกสิ้นดี#! นี้เยาะเย้ย [ROOT.Char.GetPrimaryTitle.GetNameNoTier] ใส่ร้ายประชาชน และเหยียบย่ำหลุมศพของผู้ที่มาก่อนเรา!" [rival.GetFirstName] [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('rival'))] ของข้า ตะโกนลั่น\n\nกลิ่นฉุนของ [ROOT.Char.Custom('RegionalDrink')] ติดอยู่ที่ลมหายใจของ[rival.GetHerHis]: เจ้าขี้เมานั่นเมาแล้ว! สายตาของ[rival.GetHerHis|U]ส่ายไปมาทั่วเหล่าขุนนาง [ROOT.Char.GetFaith.PriestNeuterPlural] และทูตต่างแดน ท้าทายให้พวกเขาขัดขวางภาพอันน่ารังเกียจนี้ "ด้วยสิทธิ์อันใดที่ [ROOT.Char.GetFirstName] อ้างสิทธิ์ในมงกุฎนี้? #EMP หืม?#! สิทธิ์อันใด?!?"\n\nเสียงสูดลมหายใจดังระลอกไปทั่วที่ประชุม"
 coronation_events.1033.a: ""ด้วยสิทธิ์อันศักดิ์สิทธิ์""
 coronation_events.1033.b: "ฉวยโอกาสในการปรองดองในที่สาธารณะ"
 coronation_events.1033.c: "ลาก[rival.GetHerHim]ออกไปทั้งโซ่ตรวน!"
 coronation_events.1033.d: "ปล่อยให้เจ้าหนูนั่นระบายความโกรธของ[rival.GetHerHis]ไป..."
