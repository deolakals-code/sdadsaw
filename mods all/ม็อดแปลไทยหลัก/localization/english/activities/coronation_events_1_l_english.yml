 # Coronation host is ded, notify guests
 ach_maintenance_events.0100.t: "การเสียชีวิตของ [host.GetTitleAsNamePossessiveNoTooltip]"
 ach_maintenance_events.0100.desc: "[host.GetName] [host.GetDeathReason] ในคืนก่อนวันขึ้นครองบัลลังก์ของ[host.GetHerHis] ไม่มีสิ่งใดให้ข้าทำอีกแล้วนอกเสียจากรวบรวมคณะผู้ติดตามและจากไป"
 ach_maintenance_events.0100.a: "ขอ [ROOT.Char.GetFaith.HighGodName] ทรงเมตตาต่อ [host.GetPrimaryTitle.GetNameNoTooltip]"
 ach_maintenance_events.0101.t: "[host.GetTitleAsNameNoTooltip] กลายเป็นนักโทษ" #Coronation host has been imprisoned, notify guests
 ach_maintenance_events.0101.desc: "ในคืนก่อนวันขึ้นครองบัลลังก์ของ[host.GetHerHis] [host.GetName] ถูกจองจำโดย [gaoler.GetName] รายละเอียดของการกระทำอันอุกอาจนี้ยังไม่เป็นที่ทราบแน่ชัด เจตนาของ[gaoler.GetHerHis]ที่มีต่อนักโทษคนใหม่ของ[gaoler.GetHerHis]ก็ยังคงปกคลุมไปด้วยปริศนา เช่นกัน ไม่มีสิ่งใดให้ข้าทำอีกแล้วนอกเสียจากรวบรวมคณะผู้ติดตามและจากไป"
 ach_maintenance_events.0101.a: "$ach_maintenance_events.0100.a$"
 ach_maintenance_events.0102.t: "$ach_maintenance_events.0101.t$" #Coronation host has been imprisoned, notify host and cancellation
 ach_maintenance_events.0102.desc: "ไอ้[ROOT.Char.Custom('InsultNoun')][ROOT.Char.Custom('InsultAdjective')]นั่น [gaoler.Custom('GetDaughterSon')] ของพวก[ROOT.Char.Custom('InsultNounPlural')][ROOT.Char.Custom('InsultAdjective')] ได้จองจำข้าในระหว่าง #EMP พิธีราชาภิเษกของข้าเอง#! พิธีถูกยกเลิกและชะตากรรมของข้าก็ไม่แน่นอน"
 ach_maintenance_events.0102.a: "$ach_maintenance_events.0100.a$"
 ach_maintenance_events.0103.t: "ความโดดเดี่ยวของ [host.GetTitleAsNamePossessiveNoTooltip]" #No one shows up, notify host
 ach_maintenance_events.0103.desc: "ไม่มีผู้ใดมาถึงพิธีราชาภิเษกของข้าเลย! หากปราศจากไพร่ฟ้าข้าแผ่นดินเป็นสักขีพยานในการขึ้นครองบัลลังก์ ข้าก็เป็นเพียง [host.GetTitleAsNameNoTooltip] สำหรับตนเองและในความหลงผิดของข้า\n\nข้าต้องยกเลิกพิธีการ การดูหมิ่นครั้งนี้จะไม่มีวันลืมเลือน"
 ach_maintenance_events.0103.a: "$ach_maintenance_events.0100.a$"
 ach_maintenance_events.0104.t: "การเสียชีวิตของผู้ประกอบพิธี" #Officiator ded, host cancelled the coronation, notify guests
 ach_maintenance_events.0104.desc: "[officiator.GetName] ผู้ประกอบพิธีราชาภิเษก [officiator.GetDeathReason] ในคืนก่อนวันขึ้นครองบัลลังก์ของ [host.GetNamePossessive] ด้วยความโศกเศร้า [host.GetTitledFirstName] จึงได้ยกเลิกพิธีราชาภิเษก ไม่มีสิ่งใดให้ข้าทำอีกแล้วนอกเสียจากรวบรวมคณะผู้ติดตามและจากไป"
 ach_maintenance_events.0104.a: "$ach_maintenance_events.0100.a$"
 ach_maintenance_events.0105.t: "การปัพพาชนียกรรม [host.GetTitleAsNamePossessiveNoTooltip]" #Host excommunicated, notify guests
 ach_maintenance_events.0105.desc: "ด้วยปัญญาอันมิสิ้นสุดของ[hof.GetHerHis] ซึ่งนำทางโดยเจตจำนงอันศักดิ์สิทธิ์ของ [hof.GetFaith.HighGodNamePossessive] [hof.GetName] ได้ตัดสินใจปัพพาชนียกรรม [host.GetName] ในคืนก่อนวันขึ้นครองบัลลังก์ของ[host.GetHerHis] ไม่มีสิ่งใดให้ข้าทำอีกแล้วนอกเสียจากรวบรวมคณะผู้ติดตามและจากไป"
 ach_maintenance_events.0105.a: "$ach_maintenance_events.0100.a$"
 ach_maintenance_events.0106.t: "$ach_maintenance_events.0105.t$" #Host excommunicated, notify host
 ach_maintenance_events.0106.desc: "ไอ้[ROOT.Char.Custom('InsultNoun')][ROOT.Char.Custom('InsultAdjective')]นั่น [hof.Custom('GetDaughterSon')] ของพวก[ROOT.Char.Custom('InsultNounPlural')][ROOT.Char.Custom('InsultAdjective')] ได้ปัพพาชนียกรรม #EMP ข้า#! ในคืนก่อนการเจิมตั้ง! มันมิใช่เจตจำนงอันศักดิ์สิทธิ์ของ [hof.GetFaith.HighGodNamePossessive] แต่เป็นเสียงกระซิบของ [ROOT.Char.GetFaith.DevilName] ที่นำทาง[hof.GetHerHim]ในการกระทำอันเป็นการดูหมิ่นและลบหลู่นี้\n\nข้าต้องยกเลิกพิธีการ การดูหมิ่นครั้งนี้จะไม่มีวันลืมเลือน"
 ach_maintenance_events.0106.a: "$ach_maintenance_events.0100.a$"

 coronation_events.1034.t: "อาภรณ์พิธี"
 coronation_events.1034.desc: ""นี่ [host.GetTitleAsName] กล้าสวม [detractor.Custom('RegionalFabric')] สี[detractor.Custom('GetComplexColor')] หรือ?" [detractor.Custom2('MyCharacterIntroduction', ROOT.Char)] พึมพำ ดวงตาหรี่ลง "สีเหล่านั้นสงวนไว้สำหรับคุณธรรมและยศถาบรรดาศักดิ์ — มิใช่ความอวดดี หากข้าสวมสี เช่นนั้นโดยไม่ได้รับอนุญาต ข้าคงโดนตำหนิไปแล้ว"\n\n"ตำหนิหรือ?" [supporter.Custom2('MyCharacterIntroduction', ROOT.Char)] พูดแทรกขึ้นมา "เสื้อคลุมนั้นได้รับอนุญาตแล้ว มันเป็นเกียรติแก่งานพิธีที่เก่าแก่กว่าปู่ทวดของเรา ความปรองดอง ความสมดุล การปกครองโดยชอบธรรม — นี่มิใช่ความอวดดี แต่เป็นความชอบธรรม"\n\nถ้อยคำของพวกเขาเชือดเฉือนในอากาศ แผ่วเบา แต่ร้อนแรง ข้าเหลือบมองแขนเสื้อของตัวเอง ทางเลือกสุดท้ายยังคงเป็นของข้า... แต่ตอนนี้ข้าสงสัย: มันจะประกาศสิ่งใดเมื่อข้าก้าวเข้าไปในห้องโถง?"
 coronation_events.1034.a: "เสื้อคลุมของข้าจะโดดเด่นกว่า [host.GetTitledHouseNameOrFirstName]!"
 coronation_events.1034.a.tt: "ผลที่ตามมาของตัวเลือกนี้จะถูกตัดสินโดย [host.GetTitledHouseNameOrFirstName]"
 coronation_events.1034.b: "ข้าจะสวมสีเดียวกับ [host.GetTitledHouseNameOrFirstName] เพื่อแสดงความภักดีอย่างเงียบ ๆ"
 coronation_events.1034.c: "ข้าจะสวมสิ่งที่พิธีการกำหนด"
 coronation_events.1034.d: "ให้ข้าสะท้อนสีสันของเมืองหลวง"

 coronation_events.1035.t: "สีต้องห้าม"
 coronation_events.1035.desc: "ขณะที่ [offending_guest.Custom2('MyCharacterIntroduction', ROOT.Char)] ปรากฏตัว เสียงพึมพำก็ดังขึ้นทันที เสื้อคลุมของ[offending_guest.GetHerHis|U] — หรูหรา สดใส และสูงเกินสถานะของ[offending_guest.GetHerHis] — ทำลายมากกว่าธรรมเนียมปฏิบัติ มันบิดเบือนกฎหมาย\n\n[offending_guest.GetSheHe|U] เข้ามาหาข้าด้วยรอยยิ้มพึงพอใจ "ท่านคิดว่าอย่างไร [ROOT.Char.Custom('FormOfAddressForLiege')]?""
 coronation_events.1035.a: "ปล่อยให้[offending_guest.GetHerHim]ได้มีช่วงเวลาของ[offending_guest.GetHerHis]"
 coronation_events.1035.a.toast: "[host.GetTitledHouseNameOrFirstName] เพิกเฉยต่อการล่วงละเมิด"
 coronation_events.1035.b: "การละเมิดของ[offending_guest.GetHerHis|U]จะไม่ถูกปล่อยผ่าน"
 coronation_events.1035.b.toast: "[host.GetTitledHouseNameOrFirstName] รู้สึกขุ่นเคือง"
 coronation_events.1035.c: "ข้าจะพูดกับ[offending_guest.GetHerHim]เป็นการส่วนตัว คำเตือนอาจจะเพียงพอ"
 coronation_events.1035.c.toast: "[host.GetTitledHouseNameOrFirstName] ตักเตือนเป็นการส่วนตัว"

 coronation_events.1036.t: "บทกวีข้ามโต๊ะ"
 coronation_events.1036.china.desc: "[host.Custom('GetExpensiveDrink_Singular')|U] ไหลริน ถ้วยกระทบกัน และห้องโถงก็อบอวลไปด้วยเสียงหัวเราะ จนกระทั่งมีเสียงหนึ่งดังชัดเจนขึ้น\n\n"ขอให้เราเปลี่ยนงานเลี้ยงนี้เป็นการต่อกลอน" [verse_initiator.Custom2('MyCharacterIntroduction', ROOT.Char)] ประกาศ หลังจากเพิ่งจบบท [Glossary('ลวี่ซือ', 'GLOSS_LUSHI')] อันขัดเกลาที่สรรเสริญ [host.Custom2('MyCharacterIntroduction', ROOT.Char)] "การแข่งขัน เช่นนี้ทดสอบ [Glossary('เหวิน', 'CONFUCIAN_WEN')] ของคนเรา ดังที่ปราชญ์มักแสดงให้เห็น"\n\nผู้คนเริ่มขยับ — บ้างกระตือรือร้นที่จะแสดงความรู้ บ้างก็ระแวงหนามที่ซ่อนอยู่ในบทกวี"
 CONFUCIAN_WEN: "หมายถึงความประณีตทางวัฒนธรรม พลังการขัดเกลาของวรรณกรรม พิธีกรรม และวาทศิลป์ในความคิดของชาวจีน"
 GLOSS_LUSHI: "เป็นรูปแบบบทร้อยแก้วที่มีกฎเกณฑ์เคร่งครัด มีแบบแผนวรรณยุกต์และความขนานที่เข้มงวด ความเชี่ยวชาญใน 'ลวือชี' (ลวี่ซือ) เป็นสัญลักษณ์ของความรู้ทางวัฒนธรรม"
 coronation_events.1036.japan.desc: "กลิ่นหอมของ [host.Custom('GetExpensiveDrink_Singular')] และเสียงเสียดสีของ [host.Custom('RegionalFabric')] เติมเต็มห้องโถง เมื่อเสียงหนึ่งดังขึ้นอย่างสง่างาม\n\n"เรามา แต่งกลอนสำหรับงานชุมนุมนี้กันดีหรือไม่?" [verse_initiator.Custom2('MyCharacterIntroduction', ROOT.Char)] เสนอ พร้อมกับท่อง [Glossary('วากะ', 'GLOSS_waka')] เพื่อเป็นเกียรติแก่ [host.Custom2('MyCharacterIntroduction', ROOT.Char)] "บทกวี เช่นนี้เผยให้เห็น [Glossary('มิยาบิ', 'JAPANESE_MIYABI')] ของหัวใจ ดังที่ชาววังรู้ดี"\n\nรอยยิ้มปรากฏขึ้นในหมู่แขก — เพราะบทกวีอาจสรรเสริญ หรืออาจทิ่มแทงด้วยปฏิภาณอันแยบยล"
 JAPANESE_MIYABI: "หมายถึงความสง่างามและความประณีตแบบราชสำนัก อุดมคติแห่งความงามและความอ่อนไหวที่เป็นศูนย์กลางของวัฒนธรรมชนชั้นสูงของญี่ปุ่น"
 GLOSS_WAKA: "เป็นรูปแบบบทกวี 31 พยางค์ (5-7-5-7-7) ซึ่งเป็นที่นิยมในหมู่ขุนนางญี่ปุ่น"
 coronation_events.1036.korea.desc: "เมื่องานเลี้ยงดำเนินไป ถ้วย [host.Custom('GetExpensiveDrink_Singular')] ถูกยกขึ้นสูงและเสียงหัวเราะดังก้องห้องโถง พลันมีเสียงหนึ่งเรียกให้เงียบ\n\n"ขอให้เรามอบบทกวีเพื่อเป็นเกียรติแก่เจ้าภาพ" [verse_initiator.Custom2('MyCharacterIntroduction', ROOT.Char)] ประกาศ จบถ้อยคำคู่ที่สง่างามยกย่อง [host.Custom2('MyCharacterIntroduction', ROOT.Char)] "ในการนี้ เราแสดง [Glossary('มุน', 'KOREAN_MUN')] การเรียนรู้อันขัดเกลา ซึ่งเป็นที่หวงแหนมาตั้งแต่สมัยปราชญ์"\n\nบางคนพยักหน้าเห็นด้วย บางคนเตรียมใจ — เพราะไม่ใช่ทุกบทกวีที่เป็นเพียงคำสรรเสริญ"
 KOREAN_MUN: "หมายถึงความประณีตทางวรรณกรรมและการเรียนรู้ ซึ่งเป็นเครื่องหมายแห่งความเป็นนักปราชญ์ในหมู่ชนชั้นสูง"
 coronation_events.1036.desc: "เมื่องานเลี้ยงดำเนินไป เสียงหนึ่งดังขึ้นเหนือความอึกทึก — มั่นคงและสง่างาม\n\n"ขอให้เรา แต่ละคนแบ่งปันบทกวี" [verse_initiator.Custom2('MyCharacterIntroduction', ROOT.Char)] ประกาศหลังจากการขับขานอันขัดเกลาเพื่อเป็นเกียรติแก่ [host.Custom2('MyCharacterIntroduction', ROOT.Char)] "ในบทกวี เราเผยสิ่งที่เราให้คุณค่า — ไม่ว่าจะเป็นคุณธรรม ระเบียบ หรือความงดงาม"\n\nกระแสคลื่นแห่งความรู้สึกผ่านไปทั่วห้องโถง ไม่ใช่ทุกบทกวีที่เป็นการประจบสอพลอ ถ้อยคำบางคำมีคมที่แหลมกว่านั้น"
 coronation_events.1036.a: ""ข้าจะจับคู่น้ำเสียงและสรรเสริญ [host.GetPrimaryTitle.GetTierAsNameNoTooltip] ของ [host.GetTitledFirstNamePossessive]""
 coronation_events.1036.b: ""ข้ามีบทหนึ่งในใจ... เสียงสะท้อนอันแหลมคมจากบทคร่ำครวญของปรมาจารย์เก่า""
 coronation_events.1036.c: ""ขอให้ถ้อยคำของข้าสง่างามและเหมาะสม — บทกวีที่เป็นทางการ เพื่อความเป็นทางการ""
 coronation_events.1036.d: ""ผลงานของ [verse_initiator.GetFirstNamePossessiveNoTooltip] ไพเราะมาก ข้าจะบอกให้รู้""
 coronation_events.1036.e: ""มันมีข้อบกพร่อง ข้าจะเสนอคำแนะนำเล็กน้อย""

 coronation_events.1037.t: "[ROOT.Char.GetFaith.HighGodName|U] ตรัส"
 coronation_events.1037.desc: "เสียงพึมพำแผ่วเบาดังระลอกไปทั่วราชสำนัก [omen_happening.GetNameNoTooltip] เพิ่งถูกรายงาน ผู้คนต่างซุบซิบราวกับว่า [ROOT.Char.GetFaith.HighGodName] [ROOT.Char.GetFaith.HighGodHerselfHimself] ได้ตรัสเอง\n\nด้วยแววตาที่เป็นกังวล [skeptical_guest.Custom2('MyCharacterIntroduction', ROOT.Char)] โน้มตัวเข้ามาใกล้: "ข่าวแพร่ไปอย่างรวดเร็ว [ROOT.Char.Custom('FormOfAddressForLiege')] หลายคนที่นี่ไม่สบายใจ พวกเขาสงสัยว่า [ROOT.Char.GetFaith.HighGodName] กำลังส่งคำเตือน""
 coronation_events.1037.a: ""คนก่อนหน้าข้าทนสิ่งที่เลวร้ายกว่านี้มาแล้ว""
 coronation_events.1037.b: "\"ให้ [respected_elder.GetTitledFirstNameNoTooltip] พูด\""
 coronation_events.1037.c: ""ไล่คนขี้ขลาดนี่ออกไป!""
 coronation_events.1037.d: "[ROOT.Char.GetFaith.HighGodName|U] กำลังเคลื่อนไหว แต่เราจะดำเนินต่อไป""

 coronation_events.1038.t: "บวงสรวงสี่แท่นบูชา"
 coronation_events.1038.desc: "ตามธรรมเนียมปฏิบัติ โอรสสวรรค์จะต้องเป็นผู้ดูแลการประกอบพิธีบวงสรวงต่างๆ ดั่งที่หวงตี้องค์แรกได้กระทำก่อนจะเสด็จขึ้นสู่สวรรค์ในฐานะผู้เป็นอมตะ\n\nข้าระลึกถึงตำนานนี้ขณะที่เข้าไปประจำที่หน้าแท่นบูชาทั้งสี่แห่งสวรรค์ โลก บัลลังก์จักรพรรดิ และเทพเจ้าแห่งการเกษตร ขณะที่ [rite_official.Custom2('MyCharacterIntroduction', ROOT.Char)] ดำเนินงานยิบย่อยอื่นๆ กลิ่นธูปเผาไหม้เตะจมูกข้า และข้าสัมผัสได้ถึงปรากฏการณ์ศักดิ์สิทธิ์ที่สนับสนุนพิธีกรรมนี้"
 coronation_events.1038.a: "เยาะเย้ยความไม่เหมาะสมของ [rite_official.GetFirstNamePossessiveNoTooltip]"
 coronation_events.1038.b: ""[rite_official.GetFirstNameNoTooltip] โปรดมาร่วมกับข้าเถิด""
 coronation_events.1038.c: "ทำพิธีบวงสรวงอันยิ่งใหญ่ ให้เป็นที่จดจำ"
 coronation_events.1038.d: ""ขอให้การบวงสรวงนี้นำเกียรติยศมาสู่ตระกูล [ROOT.Char.GetDynastyNameNoTooltip]!""
 coronation_events.1038.e: ""ขอสวรรค์และโลกโปรดนำทางมือข้าสู่คุณธรรม...""
 coronation_events.1038.e.flavor: "และคุ้มครองดินแดนแห่งนี้ในยุคนี้และยุคต่อๆ ไป"

 coronation_events.1039.t: "คำวิงวอนต่อทวยเทพ"
 coronation_events.1039.desc: "ข้ารู้ดีว่าเพื่อให้การเถลิงถวัลยราชสมบัติของข้าสำเร็จบริบูรณ์ ข้าจะต้องร่วมเสวยพระกระยาหารและกล่าวถ้อยคำกับทวยเทพใน [Glossary('Daijō-sai', 'DAIJO_SAI')]\n\nด้วยมี [supporter.Custom2('MyCharacterIntroduction', ROOT.Char)] อยู่เคียงข้าง ข้าก้าวไปข้างหน้าสู่แท่นบูชา เตรียมพร้อมที่จะกล่าวคำวิงวอนต่อหน้าสาธารณชน "อย่าได้กังวลไปเลย [ROOT.Char.Custom('FormOfAddressForLiege')]" [supporter.GetSheHe] กล่าว "ข้าเชื่อมั่นว่าถ้อยคำของท่านจะสะท้อนถึงความต้องการของอาณาจักร""
 DAIJO_SAI: "พิธีกรรมที่เกิดขึ้นหลังจากการขึ้นครองราชย์ของจักรพรรดิแห่งญี่ปุ่นในพระราชวังที่สร้างขึ้นเพื่อจุดประสงค์นี้โดยเฉพาะ และจะถูกรื้อถอนทันทีที่พิธีเสร็จสิ้น หลังจากช่วงเวลาแห่งการชำระล้างตนเอง จักรพรรดิจะทำการถวายเครื่องสักการะแด่คามิและร่วมเสวยด้วยองค์เอง"
 coronation_events.1039.a: "ข้าขอวิงวอนเพื่อประโยชน์สุขของพสกนิกรผู้จงรักภักดีของข้า"
 coronation_events.1039.b: "คำวิงวอนของข้าคือการขอให้ [ROOT.Char.GetFaith.HighGodName|U] ทรงเป็นพยานในความรุ่งโรจน์ของข้า!"
 coronation_events.1039.c: "ข้าจะพูดให้คลุมเครือและมีเลศนัย"
 coronation_events.1039.d: "คลี่ม้วนกระดาษบทกวีอันเปี่ยมศรัทธา"
 coronation_events_1039_poem_name: "การมีส่วนร่วมอันศักดิ์สิทธิ์"
 coronation_events_1039_poem_desc: "บทกวีอันวิจิตรและเปี่ยมด้วยศรัทธาที่ประพันธ์โดย [owner.GetTitledHouseNameOrFirstName] เพื่อเป็นเกียรติแด่คามิในพิธีราชาภิเษกของ [owner.GetHerHis] เอง"
 coronation_events.1039.d.tt: "ท่านจะได้รับ [artifact|E] ประเภทบทกวี"
 coronation_events.1039.d.flavor: ""ใน [ROOT.Char.GetCurrentLocation.GetNameNoTooltip] ดอกไม้ดอกเดียวเบ่งบาน...""

 coronation_events.1040.t: "บทเรียนแห่งความไม่เที่ยง"
 coronation_events.1040.desc: ""การเตรียมงานสำหรับมันดาลาไปถึงไหนแล้ว [ROOT.Char.GetTitleAsNameNoTooltip] ของข้า?" [tributary_1.Custom2('MyCharacterIntroduction', ROOT.Char)] เอ่ยถามด้วยน้ำเสียงจริงจัง เป็นธรรมเนียมที่จะต้องจัดทำ [Glossary('sand mandala', 'GLOSS_MANDALA')] ขึ้นเพื่อเป็นเกียรติแก่ [ROOT.Char.GetTitleAsNameNoTooltip] องค์ใหม่ เพียงเพื่อจะถูกทำลายทิ้งทันทีหลังจากเสร็จสิ้นพิธีกรรมอันควร\n\nเรื่องนี้วนเวียนอยู่ในหัวของข้าไม่หยุดหย่อน เพราะพิธีกรรมนี้เป็นสัญลักษณ์อันลึกซึ้ง ทว่าการที่งานศิลปะเช่นนี้ต้องถูกทำลายทิ้งหลังเสร็จสิ้นนั้น ช่างดูเหมือน... เป็นการสูญเปล่า"
 GLOSS_MANDALA: "มันดาลารูปทรายถูกสร้างขึ้นอย่างพิถีพิถันโดยพระภิกษุผู้ผ่านการฝึกฝน และจะถูกทำลายทิ้งตามพิธีกรรมเพื่อสื่อถึงความไม่เที่ยง แต่ละภาพจะแสดงถึงเทพเจ้าหรือคุณสมบัติอันศักดิ์สิทธิ์เป็นแกนกลาง ล้อมรอบด้วยภาพที่กลมกลืนกัน สะท้อนถึงการจัดระเบียบของดินแดนมันดาลา"
 coronation_events.1040.special: ""สั่งให้นำมันดาลาแห่ง [ROOT.Char.GetFaith.HouseOfWorship] มาที่นี่""
 coronation_events.1040.a: ""จะไม่มีการตระหนี่ค่าใช้จ่ายใดๆ สำหรับสัญลักษณ์ศักดิ์สิทธิ์ของข้า!""
 coronation_events.1040.b: ""ทำให้มันมีความหมายแต่เรียบง่าย""
 coronation_events.1040.c: ""[ROOT.Char.GetFaith.HouseOfWorshipPlural] อาจยอมสละทรัพยากรได้ แต่ข้าไม่""
 every_attending_poet_erudite: "ตัวละครที่เข้าร่วมทุกคนที่มีลักษณะ [GetTrait('lifestyle_poet').GetName( GetNullCharacter )] และ [GetTrait('erudite').GetName( GetNullCharacter )]"
 every_poet_erudite: "ตัวละครที่เข้าร่วมทุกคนที่มีลักษณะ [GetTrait('lifestyle_poet').GetName( GetNullCharacter )] และ [GetTrait('erudite').GetName( GetNullCharacter )]"
