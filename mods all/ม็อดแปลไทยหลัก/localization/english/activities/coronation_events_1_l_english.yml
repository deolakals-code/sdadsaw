l_english: 
 ### Events
 # Flavor
 coronation_events.1000.t: "การเยาะเย้ยอันบาดลึก"
 coronation_events.1000.low_county_opinion.desc: "นักกวีผู้หนึ่งกวาดตามองผู้ที่มาชุมนุมด้วยรอยยิ้มเยือน\n\n"บทเพลงนี้ขอมอบแด่ [ROOT.Char.GetName] ในนามของประชาชนแห่ง [ROOT.Char.GetCurrentLocation.GetName] มีชื่อเพลงว่า 'โอ้ [ROOT.Char.GetTitledFirstNameNoTooltip] ผู้เป็นที่รักแห่งดวงใจของเรา!'\n\nท่วงทำนองนั้นมีชีวิตชีวา แต่เมื่อดำเนินไป ข้าก็สังเกตเห็นแววซุกซนในดวงตาของนักร้องและเสียงหัวเราะที่ถูกกลั้นไว้ของแขกหลายคน\n\nช่างเป็นที่รักเสียจริง..."
 coronation_events.1000.rival.desc: "ท่ามกลางความครื้นเครง ข้าเหลือบไปเห็น [rival.GetName] [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('rival'))] ของข้า กำลังลอบยื่นเหรียญให้นักกวี ชั่วครู่ต่อมา นักดนตรีผู้นั้นก็ประกาศขึ้น\n\n"บทประพันธ์นี้เป็นของขวัญจาก [rival.GetNameNoTooltip] ถึงสหายรักของ[rival.GetHerHis] [ROOT.Char.GetName]! มีชื่อว่า '[ROOT.Char.GetFirstNameNoTooltip] ไอ้[ROOT.Char.Custom('InsultNoun')|U]!'"\n\nข้ามองกวาดไปในฝูงชน และก็พบ [rival.GetFirstNameNoTooltip] ใบหน้าของ[rival.GetHerHis]อาบไปด้วยความยินดีอัน[rival.Custom('InsultAdjective')] น่าเสียดายที่บทเพลงนั้นกลับมีท่วงทำนองที่ปลุกเร้าใจพอควร"
 coronation_events.1000.tyrant.desc: "นักกวีผู้หนึ่ง ใบหน้าแดงก่ำด้วยความท้าทาย ก้าวออกมาและเริ่มขับขานบทลำนำ:\n\n"จงดูเถิด [ROOT.Char.GetName] กำปั้นเหล็ก!"\n\nแต่ละท่อนที่เสียดแทงเคลือบไว้ด้วยคำเยินยออันแหลมคมดังก้องไปทั่วห้องโถง ข้ากัดฟันกรอดขณะที่ท่วงทำนองเยาะเย้ยดังกระหึ่มขึ้น วาดภาพการปกครองของข้าว่าไม่ต่างอะไรกับการใช้อำนาจเผด็จการอันหยุมหยิม"
 coronation_events.1000.desc_fallback: "นักกวีจบบทเพลงอันเร้าใจลงอย่างสง่างาม แล้วจึงประกาศ:\n\n"บทเพลงนี้แด่ [ROOT.Char.GetName] มีชื่อว่า '[ROOT.Char.GetFirstNameNoTooltip] ไอ้[ROOT.Char.Custom('InsultNoun')|U]!'\n\nความเงียบงันปกคลุมทั่วห้องโถง ตามมาด้วยเสียงหัวเราะครืนดังระลอกคลื่นผ่านฝูงชน ท่วงทำนองนั้นช่างปลุกเร้าใจอย่างน่าประหลาด"

 coronation_events.1000.bribe: "จ่ายเงินให้ แต่งเพลงสรรเสริญข้าแทน"
 coronation_events.1000.epic_rap_battle: "ปัญญาข้าคืออาภรณ์!"
 coronation_events.1000.epic_rap_battle.tt.success: "ท่านเอาชนะใจฝูงชนได้"
 coronation_events.1000.epic_rap_battle.tt.failure: "ท่านทำตนเองขายหน้าในความพยายามที่จะเอาชนะฝูงชน"
 coronation_events.1000.guards: "ทหาร! จับกุมไอ้[bard.Custom('InsultNoun')]นี่!"

 coronation_events.1002.t: "มันอยู่ที่ใด?"
 coronation_events.1002.desc: "แม้ว่าครัวเรือนของข้าจะมีชื่อเสียงในหลายด้าน แต่ก็ไม่เป็นที่รู้จักในเรื่องความเป็นระเบียบ ห้องมุขเต็มไปด้วยเสียงกระซิบขออภัยขณะที่เหล่าคนรับใช้กำลังงุ่มง่ามกับเสื้อคลุมและการเตรียมการในนาทีสุดท้าย ช่างไร้สาระ ของล้ำค่าและสำคัญที่สุดย่อมต้องปลอดภัยอยู่แล้ว เช่นมงกุฎของข้า เดี๋ยวนะ\n\nมงกุฎของข้าอยู่ที่ใด?!"
 coronation_events.1002.rival.desc: "ชั่วครู่ก่อนพิธีราชาภิเษก ข้าเอื้อมมือไปหยิบมงกุฎ—และมันก็หายไป! ความตื่นตระหนกเข้าครอบงำขณะที่ข้าเหลือบไปเห็น [rival.GetName] [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('rival'))] ของข้า ยืนอยู่ที่มุมห้อง สายตาของ[rival.GetHerHis]จับจ้องไปที่แท่นวางอันว่างเปล่า รอยยิ้มเยาะ[rival.Custom('InsultAdjective')]นั่นท้าทายให้ข้ากล่าวหา[rival.GetHerHim]\n\nข้างกายข้า [helper.GetName] [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('helper'))] ของข้า ผุดลุกขึ้นเมื่อสังเกตเห็นสถานการณ์อันน่าตระหนก ไม่มีเวลาให้ลังเล — ข้าต้องลงมือ!"
 coronation_events.1002.find: "ถึงเวลาจัดการความวุ่นวายนี้แล้ว!"
 coronation_events.1002.counterfeit: "โชคยังดี นั่นเป็นเพียงของจำลอง"
 coronation_events.1002.hold: "พวกน่าสมเพช! ข้าจะสั่งเฆี่ยนพวกเจ้าสำหรับเรื่องนี้!"
 coronation_events.1002.accuse: "เจ้าก่อเรื่องจนได้นะ ไอ้[rival.Custom('InsultNoun')][rival.Custom('InsultAdjective')]!"
 coronation_events.1002.accuse.flavor: "รับไปซะ!"
 coronation_events.1002.friend: "โชคยังดี ข้ายังมี [helper.GetFirstNameNoTooltip] อยู่เคียงข้าง"

 coronation_events.1004.t: "เสียงกระซิบในงานเลี้ยง"
 coronation_events.1004.desc: "ด้วยน้ำเสียงแผ่วเบา ข้าและ [confidant.Custom2('MyCharacterIntroduction', ROOT.Char)] กำลังปรึกษาหารือเรื่องส่วนตัวกันห่างไกลจากฝูงชน เมื่อ [confidant.GetFirstNameNoTooltip] เอ่ยขึ้นมาตรงๆ ว่า [confidant.GetSheHe] [secret_to_reveal.Custom('SecretDescriptionThirdPerson')] ข้าเหลือบเห็น [spy.GetWomanMan] ท่าทางลึกลับคนหนึ่งเอนตัวมาทางเรา พยายามเงี่ยหูฟังทุกถ้อยคำ\n\nใครจะรู้ว่า [spy.GetSheHe] หวังจะทำความชั่วร้ายอันใด [spy.GetSheHe|U] ต้องไม่ได้ล่วงรู้เรื่องนี้ การละเมิดเช่นนี้จะยอมให้เกิดขึ้นไม่ได้"
 coronation_events.1004.bribe: ""เท่าไหร่สำหรับความเงียบของเจ้า?""
 coronation_events.1004.recruit: ""ข้าอาจใช้คนอย่างเจ้าได้...""
 coronation_events.1004.intimidation: "#EMP จ้องมอง [spy.GetHerHim] ด้วยเจตนาฆ่าฟัน#! "
 coronation_events.1004.intimidation.tt.success: "ท่าทีอันน่าสะพรึงของท่าน ทำให้ [spy.GetTitledFirstNameNoTooltip] หวาดกลัว"
 coronation_events.1004.intimidation.tt.failure: "คำขู่ของท่านมิอาจโน้มน้าว [spy.GetTitledFirstNameNoTooltip] ได้"
 coronation_events.1004.guards: "ลากไอ้[spy.Custom2('InsultNoun', ROOT.Char)]นี่ไปที่คุกใต้ดิน!"
 coronation_events.1004.opt-out: ""นั่นมิใช่ธุระของข้า""

 coronation_events.1007.t: "ปัญหาเรื่องลำดับก่อนหลัง"
 coronation_events.1007.desc: "ขณะที่ขบวนกำลังจะเริ่ม ข้าได้ยิน [first_guest.GetFirstName] [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('first_guest'))] ของข้า และ [second_guest.GetFirstName] [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('second_guest'))] ของข้า โต้เถียงกันว่าผู้ใดจะเป็นผู้นำเข้าสู่พิธี\n\nเสียงทะเลาะของพวกเขาดังก้องไปทั่วห้องมุข คนหนึ่งยืนกรานว่าเป็นผู้ที่[first_guest.Custom('ComplimentAdjective')]ที่สุด ดังนั้นจึงสมควรที่สุด ส่วนอีกคนอ้างว่าควรเป็นผู้ที่[second_guest.Custom('ComplimentAdjective')]ที่สุด\n\nข้ารู้สึกเป็นเกียรติอย่างยิ่ง"
 coronation_events.1007.guest.desc: "ข้ายืนอยู่ที่ธรณีประตู พร้อมที่จะนำขบวนราชาภิเษก เมื่อ [second_guest.GetFirstName] พรวดพราดเข้ามาและพูดอย่างเย้ยหยัน\n\n"การรับใช้ต่อราชบัลลังก์ของข้าเรียกร้องให้ข้าได้นำหน้า!"\n\nคำท้าทายอันหยาบคายของ[second_guest.GetHerHis|U]รบกวนความศักดิ์สิทธิ์ของการเตรียมการของเรา"
 coronation_events.1007.bigger: "เชิญเลย [second_guest.GetFirstNameNoTooltip] ตามสบาย"
 coronation_events.1007.demand: "มันเป็นสิทธิ์ของข้า เพราะข้าคือผู้ที่[first_guest.Custom('ComplimentAdjective')]ที่สุด!"
 coronation_events.1007.appease: "มาเถิด เรามาหารือทางแก้กัน..."
 coronation_events.1007.first_guest: "[ROOT.Char.Custom2('RelationToMe', SCOPE.sC('first_guest'))] ของข้าควรได้เป็นคนแรก!"
 coronation_events.1007.second_guest: "[second_guest.GetFirstNameNoTooltip] ท่านสมควรได้รับสิทธิ์นี้"
 coronation_events.1007.opt_out: "เหตุใดข้าต้องเข้าไปยุ่งด้วย?"

 coronation_events.1011.t: "มงกุฎนั้นหนักอึ้ง"
 coronation_events.1011.desc: "ในความเงียบสงัดก่อนพิธีราชาภิเษกของข้า เหล่าเจ้าหน้าที่ได้เผยโฉม [ancestor_artifact.GetName]! ความแวววาวของมันขับขานถึงชัยชนะของบรรพบุรุษของข้า\n\nข้าระลึกถึง [previous_holder.GetTitledFirstNameRegnal] [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('previous_holder'))] ของข้า ผู้ ซึ่งความเชี่ยวชาญใน [previous_holder.Custom('education_focus')] ได้หล่อหลอมรัชสมัยอันรุ่งเรืองของ[previous_holder.GetHerHis] รัชสมัยของข้าเองก็จะถูกจารึกไว้ด้วยความสามารถด้าน [ROOT.Char.Custom('education_focus')] เช่นกัน การกระทำของข้าจะสถิตอยู่ใน [ancestor_artifact.GetName] และมันจะขับขานบทเพลงใหม่ภายใต้ท่วงทำนองเดิมอันเป็นที่ประจักษ์"
 coronation_events.1011.refit: "ชื่อเสียงของข้า ข้าเป็นผู้สร้าง"
 coronation_events.1011.previous: "สิ่งประดิษฐ์นี้เชิดชูมรดกของ [previous_holder.GetFirstNamePossessiveNoTooltipRegnal]"
 coronation_events.1011.root_reward.tt: "#weak [modifier|E] [skill|E] ใหม่ของ [artifact|E] มาจากประเภท [education|E]#! "
 coronation_events.1011.previous_reward.tt: "การปล่อยให้มงกุฎคงจุดประสงค์เดิมไว้จะเป็นการเสริมสิ่งประดิษฐ์ด้วยตัวปรับ แต่งที่เชิดชูการศึกษาของผู้ครองบัลลังก์คนก่อน"
