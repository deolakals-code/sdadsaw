############## 
# OPTIONS
##############

 gruesome_festival_option_size:0 "ขนาดเทศกาล"
 gruesome_festival_size_small:0 "เทศกาลขนาดเล็ก"
 gruesome_festival_size_small_desc:1 "$EFFECT_LIST_BULLET$ การเปลี่ยนแปลง [opinion|E] จะเกิดน้อยลง\n\n#weak ผู้คนในเคาน์ตีนี้ยังคงศรัทธาดีพอที่จะเป็นเจ้าภาพให้เราได้#!"
 gruesome_festival_size_medium:0 "เทศกาลขนาดกลาง"
 gruesome_festival_size_medium_desc:1 "$EFFECT_LIST_BULLET$ การเปลี่ยนแปลง [opinion|E] จะเกิดบ่อยขึ้น\n\n#weak เสรีชน[GetPlayer.Custom('WomenMenPeople_GenderPreference')] ทั้งหมดในอาณาเขตของข้าจงมา!#!"
 gf_medium_option_valid:0 "ท่านไม่ได้ครอบครองบรรดาศักดิ์ระดับเคาน์ตี [rank|E] อย่างน้อย 2 ตำแหน่ง"
 gruesome_festival_size_large:0 "เทศกาลขนาดใหญ่"
 gruesome_festival_size_large_desc:1 "$EFFECT_LIST_BULLET$ การเปลี่ยนแปลง [opinion|E] เกิดขึ้นบ่อยครั้ง\n\n#weak เชิญ[GetPlayer.Custom('LadyLordNoble_GenderPreference')|U] และสามัญชนทุกคนใน [GetPlayer.GetPrimaryTitle.GetTierAsNameNoTooltip]!#!"
 activity_gruesome_festival_destination_selection:0 "ท่านสามารถจัด $activity_gruesome_festival$ ได้เฉพาะในจังหวัดที่มีหลักความเชื่อ [doctrine|E] $gruesome_festivals_active_name$ เท่านั้น"
 activity_gruesome_festival_conclusion_desc:1 "[GetActivityType( 'activity_gruesome_festival' ).GetName] ได้สิ้นสุดลงแล้ว"
 activity_gruesome_festival_guest_desc:1 "$BULLET_WITH_TAB$ ผู้เข้าร่วมอาจได้รับ [piety|E]\n$BULLET_WITH_TAB$ ผู้เข้าร่วมอาจได้รับ [opinion|E] จากผู้เข้าร่วมคนอื่น\n$BULLET_WITH_TAB$ ผู้เข้าร่วมอาจสูญเสีย [stress_loss_i][stress|E]"

 gruesome_festival_option_sacrifice:0 "เครื่องสังเวย"

 gf_suitable_rank_valid:0 "ท่านไม่ได้เป็นอิสระและไม่ใช่ข้าในบังคับระดับกษัตริย์ [rank|E]"
 gf_valid_county_faith:0 "ท่านไม่ได้ควบคุมเคาน์ตีใดๆ ที่มีศรัทธา ซึ่งอนุญาตให้จัด [GetActivityType( 'activity_gruesome_festival' ).GetName] ได้"

### ANIMALS

 # Option loc for animals if you have a faith allowing gruesome festivals
 gruesome_festival_sacrifice_animals_genuine:0 "สัตว์"
 gruesome_festival_sacrifice_animals_genuine_desc:1 "$gruesome_festival_sacrifice_animals_genuine_desc_help$\n\n#weak การสังเวยสัตว์จำนวนพอสมควรก็เพียงพอแล้ว#!"
 gruesome_festival_sacrifice_animals_genuine_desc_help:2 "$gruesome_festival_sacrifice_animals_only.regular.opinion$\n$gruesome_festival_sacrifice_animals_only.appeased_humsac_haters$\n$EFFECT_LIST_BULLET$ $gruesome_festival_sacrifice_animals_only.regular.piety$"

 # Option loc for animals if you only rule over a faith allowing gruesome festivals
 gruesome_festival_sacrifice_animals_poser:0 "สัตว์"
 gruesome_festival_sacrifice_animals_poser_desc:1 "$gruesome_festival_sacrifice_animals_poser_desc_help$\n\n#weak การสังเวยสัตว์จำนวนพอสมควรก็เพียงพอแล้ว#!"
 gruesome_festival_sacrifice_animals_poser_desc_help:2 "$gruesome_festival_sacrifice_animals_only.regular.opinion$\n$gruesome_festival_sacrifice_animals_only.appeased_humsac_haters$\n $EFFECT_LIST_BULLET$ $gruesome_festival_sacrifice_animals_only.regular.piety.loss$"

# Animals Help Text
 gruesome_festival_sacrifice_animals_only.regular.opinion:1 "$EFFECT_LIST_BULLET$ การได้รับ [opinion|E] และ [county_opinion|E] จาก [GetPlayer.GetFaith.GetAdherentNamePlural] จะน้อยกว่าการสังเวยมนุษย์"
 gruesome_festival_sacrifice_animals_only.appeased_humsac_haters:1 "$EFFECT_LIST_BULLET$ ผู้อยู่ใต้อาณัติที่ไม่สนับสนุนการสังเวยมนุษย์จะไม่สูญเสีย [opinion|E] หรือ [county_opinion|E]"
 #gruesome_festival_sacrifice_animals_only.regular.piety: "#positive_value [GetPlayer.MakeScope.ScriptValue('gruesome_festival_regular_animal_piety_value')|0]#! [piety_i] will be gained $gruesome_festival_activity.piety_gain.rump$"
 gruesome_festival_sacrifice_animals_only.regular.piety:1 "#positive_value เล็กน้อย#! ได้รับ [piety_i][piety|E]"
 #gruesome_festival_sacrifice_animals_only.regular.piety.loss: "#negative_value [GetPlayer.MakeScope.ScriptValue('gruesome_festival_regular_animal_piety_value')|0]#! [piety_i] will be lost $gruesome_festival_activity.piety_gain.rump$"
 gruesome_festival_sacrifice_animals_only.regular.piety.loss:1 "#negative_value เล็กน้อย#! สูญเสีย [piety_i][piety|E]"


