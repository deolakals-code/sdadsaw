 SurveyArrivalIntroDevelopmentLocBad: "\n$BULLET_WITH_TAB$ ปรับปรุง @development_icon![development|E] (#bold #n [ROOT.Char.MakeScope.ScriptValue('survey_province_development_info_value')|0]#!#!)"
