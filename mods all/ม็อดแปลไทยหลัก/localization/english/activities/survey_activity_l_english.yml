 inspection_proteted_poi_levy_modifier_desc: "ทหารรักษาการณ์ถูกเกณฑ์มาดูแลอนุสรณ์สถานท้องถิ่นและนักเดินทางจำนวนมาก\n\n$protected_poi_modifier_desc$"

 inspection_protected_holy_site_levy_modifier: "สถานที่ศักดิ์สิทธิ์ที่ได้รับการคุ้มครอง"
 inspection_protected_holy_site_levy_modifier_desc: "ทหารรักษาการณ์ถูกเกณฑ์มาดูแลสถานที่ศักดิ์สิทธิ์ในท้องถิ่นและผู้แสวงบุญจำนวนมาก\n$protected_holy_site_modifier_desc$"

 inspection_protected_holy_poi_levy_modifier: "$inspection_protected_holy_site_levy_modifier$"
 inspection_protected_holy_poi_levy_modifier_desc: "ทหารรักษาการณ์ถูกเกณฑ์มาดูแลสถานที่ศักดิ์สิทธิ์ในท้องถิ่นและผู้แสวงบุญจำนวนมาก\n$protected_poi_modifier_desc$ $protected_holy_site_modifier_desc$"

 inspection_protected_poi_gold_modifier: "อนุสรณ์สถานที่มีทหารรักษาการณ์"
 inspection_protected_poi_gold_modifier_desc: "อนุสรณ์สถานท้องถิ่นได้รับทหารรักษาการณ์เฉพาะเพื่อปกป้องมันและนักเดินทางจำนวนมาก\n$protected_poi_modifier_desc$"

 inspection_protected_holy_site_gold_modifier: "สถานที่ศักดิ์สิทธิ์ที่มีทหารรักษาการณ์"
 inspection_protected_holy_site_gold_modifier_desc: "สถานที่ศักดิ์สิทธิ์ในท้องถิ่นได้รับทหารรักษาการณ์เฉพาะเพื่อปกป้องมันและผู้แสวงบุญจำนวนมาก\n$protected_holy_site_modifier_desc$"

 inspection_protected_holy_poi_gold_modifier: "$inspection_protected_holy_site_gold_modifier$"
 inspection_protected_holy_poi_gold_modifier_desc: "สถานที่ศักดิ์สิทธิ์ในท้องถิ่นได้รับทหารรักษาการณ์เฉพาะเพื่อปกป้องมันและผู้แสวงบุญจำนวนมาก\n$protected_poi_modifier_desc$ $protected_holy_site_modifier_desc$"

 bp3_survey.1090.t: "พื้นที่ห่างไกลที่ซ่อนเร้น"
 bp3_survey.1090.desc: ""มาหาพวกลักลอบล่าสัตว์แถวนี้รึ?" นายพรานที่ดูโทรมตะโกนใส่เรา ขณะที่เราเข้าใกล้ค่ายเล็กๆ ของ [hunter_character.GetHerHis] ระหว่างการสำรวจพื้นที่ห่างไกลของ [province.GetName] "มีให้หาเยอะแยะ ถึงแม้จะไม่ใช่ที่ดินหลวงจริงๆ ที่นี่ใน [poaching_province.GetName] ทุก [hunter_character.GetWomanMan] ต้องดูแล [hunter_character.GetHerselfHimself]"\n\n"ถ้าท่านต้องการอ้างสิทธิ์ในดินแดนเหล่านี้ ท่านต้องการใครสักคนที่สามารถปรากฏตัวในนามของท่านเป็นประจำ หากท่านเข้าใจความหมายของข้า" [hunter_character.GetSheHe|U] พูดต่อพร้อมขยิบตา ก่อนที่ [hunter_character.GetSheHe] จะกัดเนื้อย่างชิ้นใหญ่ กลุ่มคนที่สามารถแสดงให้ทุกคนที่นี่เห็นว่าที่ดินเป็นของข้าจริงๆ? บางทีนั่นอาจไม่ใช่ความคิดที่แย่นัก..."
 bp3_survey.1090.a: "เราจะจ้างทหารยามบางส่วนที่สามารถลาดตระเวนในพื้นที่ห่างไกลได้"
 bp3_survey.1090.b: "เกณฑ์นายพรานท้องถิ่นที่รู้จักพื้นที่อยู่แล้ว"
 bp3_survey.1090.c: "ใครจะสนพวกลักลอบล่าสัตว์คนสองคน?"

 inspection_hidden_hinterlands_modifier: "โอกาสสำเร็จ [hunt_success_chance|E]: #p +10%#!\n[prestige_experience|E] จาก [hike|E]: #P +25%#!"

 inspection_hidden_hinterlands_recruit_modifier: "หน่วยลาดตระเวนป่า"
 inspection_hidden_hinterlands_recruit_modifier_desc: "กองทหารยามที่จัดตั้งขึ้น เพื่อให้แน่ใจว่ามีพวกลักลอบล่าสัตว์หรืออาชญากรในภูมิภาคน้อยที่สุดเท่าที่จะเป็นไปได้\n\n$inspection_hidden_hinterlands_modifier$"

 inspection_hidden_hinterlands_hunters_modifier: "นายพรานท้องถิ่น"
 inspection_hidden_hinterlands_hunters_modifier_desc: "กลุ่มนายพรานท้องถิ่นที่ได้รับการว่าจ้างจากเจ้าเหนือหัวเพื่อปกป้องบารอนีจากพวกลักลอบล่าสัตว์และอาชญากร\n\n$inspection_hidden_hinterlands_modifier$"

 ### Progression Events ###
 bp3_survey.1200.t: "ความคืบหน้า"
 bp3_survey.1200.desc: "แม้จะมีปัญหาและอุปสรรคมากมายที่ข้าเผชิญที่นี่ใน [province.GetName] ข้ารู้สึกว่าข้าเริ่มเข้าใจวิธีที่จะ ทำให้สิ่งต่างๆ เป็นไปตามที่ข้าต้องการแล้ว เจ้าของที่ดิน สมาคมท้องถิ่น พวกเขาทั้งหมดเริ่มยอมรับวิธีการของข้า\n\nตอนนี้ข้าเพียงแค่ต้องกำหนดเส้นทางสำหรับอนาคตของเคาน์ตีนี้ และหาคนที่เหมาะสมที่จะนำพามันไปสู่จุดนั้น"
 bp3_survey.1200.a: "หวังว่านี่จะเป็นความท้าทายสุดท้ายของข้าที่นี่"

 bp3_survey.1210.t: "ก้าวไปในทิศทางที่ถูกต้อง"
 bp3_survey.1210.desc: "หลังจากใช้เวลาช่วงเย็นในการหารือกับเจ้าของที่ดินท้องถิ่น ในที่สุดข้าก็สามารถทำข้อตกลงกับสมาคมพ่อค้าท้องถิ่นแห่งหนึ่งได้สำเร็จ\n\nหวังว่านี่จะเป็นเพียงจุดเริ่มต้นของการ ทำให้เคาน์ตีนี้กลับมาเป็นอย่างที่ข้าต้องการ หากเพียง แต่ข้าจะสามารถหาเสียงสนับสนุนที่เป็นมิตรมากขึ้นสำหรับความพยายามของข้าที่นี่"
 bp3_survey.1210.a: "ก้าวแรกของอีกหลายก้าว"

 bp3_survey.1220.t: "ก้าวที่ผิดพลาด"
 bp3_survey.1220.desc: "หลังจากใช้เวลาช่วงเย็นในการหารือกับเจ้าของที่ดินท้องถิ่น พวกเขายังไม่สามารถหาข้อประนีประนอมได้ แม้ว่าข้าจะพยายามอย่างเต็มที่แล้ว ข้ารู้สึกว่าแรงจูงใจของข้าในการพยายามรักษาทุกอย่างไว้ด้วยกันที่นี่ค่อยๆ จางหายไป\n\nทำไมพวกเขาถึงเข้ากันไม่ได้สักครั้ง?"
 bp3_survey.1220.a: "แค่ #bold พูดคุย#! กันสิ!"

 bp3_survey.1230.t: "ความผิดพลาดซ้ำแล้วซ้ำเล่า"
 bp3_survey.1230.desc: "หลังจากใช้เวลาทั้งวันพูดคุยกับเจ้าของที่ดินท้องถิ่น ข้าพบว่าตนเองมีปัญหากับข้อพิพาทเล็กน้อยระหว่างสมาคมพ่อค้า ตามมาด้วยการทะเลาะวิวาทของขุนนางอีก\n\nไม่ว่าข้าจะมองไปทางไหน ข้ารู้สึกเหมือนมีปัญหาอื่นรอให้ข้าสนใจอยู่เสมอ เกิดอะไรขึ้นกับผู้คนที่อาศัยอยู่ที่นี่ใน [province.GetName]?!"
 bp3_survey.1230.a: "พวกเขา #emp ต้องการ#! ให้สิ่งต่างๆ ดีขึ้นจริงๆ หรือ?!"

