 inspection_fighting_guilds_innkeepers_guild_modifier: "สมาคมเจ้าของโรงเตี๊ยม"
 inspection_fighting_guilds_innkeepers_guild_modifier_desc: "เมืองนี้ได้รับอิทธิพลอย่างหนักจาก $inspection_fighting_guilds_innkeepers_guild_modifier$ ที่ทรงอำนาจ"
 inspection_fighting_guilds_artists_guild_modifier: "สมาคมศิลปิน"
 inspection_fighting_guilds_artists_guild_modifier_desc: "ศิลปินจากแดนไกลเดินทางมาร่วมสร้างสรรค์ผลงาน ซึ่งมักพบเห็นได้ทั่วไปทุกมุมเมือง"
 inspection_learning_intent_local_guilds_modifier: "สมาคมท้องถิ่น"
 inspection_learning_intent_local_guilds_modifier_desc: "สมาคมใหม่บางแห่งได้ตั้งรกรากในบารอนีหลังจากมีปฏิสัมพันธ์กับเจ้าเหนือหัวในส่วนอื่นๆ ของอาณาจักร"

 bp3_survey.1040.t: "ไฟลุกลาม"
 bp3_survey.1040.desc: "ขณะเดินทางไปตามถนนของ [province.GetName] ขบวนของข้าและข้าก็เผชิญกับเหตุเพลิงไหม้ที่กำลังเผาผลาญย่านเก่าแก่แห่งหนึ่งของเมือง ผู้คนจำนวนมากยืนตะลึงด้วยความตกใจหรือร้องไห้เงียบๆ ข้างร่างผู้เสียชีวิตที่เกลื่อนกลาดอยู่บนทางเท้า\n\nทหารราวสิบกว่านายกำลังพยายามดับไฟอย่างสิ้นหวังก่อนที่มันจะลุกลามไปทั่วเมืองและเหลือทิ้งไว้เพียงเถ้าถ่าน"
 bp3_survey.1040.a: "ต้องช่วยชีวิตผู้คน!"
 bp3_survey.1040.a.win: "ท่านช่วยดับไฟ"
 bp3_survey.1040.a.loss: "ไฟลุกลามแม้ท่านจะตั้งใจดีที่สุด"
 bp3_survey.1040.a.death: "ติดอยู่ในกองเพลิง"
 bp3_survey.1040.b: "ข้าจะจัดสรรเงินทุนให้ภายหลัง ตอนนี้มุ่งเน้นไปที่การรักษาเท่าที่ทำได้"
 bp3_survey.1040.c: "ไฟที่ใหญ่กว่านี้จะ ทำให้ [county_owner.GetFirstNameNoTooltip] รู้สำนึกในตำแหน่งของ [county_owner.GetHerHis]"
 bp3_survey.1040.c.win: "ผู้คนเชื่อว่าท่านพยายามช่วยเหลือ"
 bp3_survey.1040.c.loss: "ผู้คนรู้ว่าท่านทำอะไรลงไปจริงๆ"
 bp3_survey.1040.d: "ไม่มีอะไรที่ข้าจะทำได้อีกแล้วที่นี่..."
 bp3_survey.1040.destroyed_building: "ไฟลุกลาม"

 inspection_fire_spreading_modifier: "ถนนที่ถูกเผาไหม้"
 inspection_fire_spreading_modifier_desc: "การเผาทำลายสิ่งผุพังเก่าๆ บางส่วนได้ก่อให้เกิดโอกาสใหม่ๆ"
 inspection_selfless_ruler_modifier: "ผู้ปกครองผู้เสียสละ"
 inspection_selfless_ruler_modifier_desc: "ตัวละครนี้ได้เสี่ยงสุขภาพของตนเองเพื่อช่วยเหลือประชาชน"

 bp3_survey.1050.t: "การขยายกำแพงเมือง"
 bp3_survey.1050.desc: "ข้าพบว่าตนเองกำลังสนทนากับชาวบ้านบางคนอีกครั้ง เกี่ยวกับวิธีที่ข้าควรจัดลำดับความสำคัญในการปรับโครงสร้างของ [province.GetName] "ย้ายและสร้างกำแพงเมืองเก่าใหม่เถิด ท่านเจ้าเหนือหัว" ร้อยเอก [soldier_character.GetNameNoTooltip] แห่งกองทหารรักษาการณ์ท้องถิ่นกล่าวพร้อมขยิบตา "ลองคิดดูสิว่าเราจะมีพื้นที่มากขึ้นสำหรับย่านที่อยู่อาศัยใหม่ขนาดไหน!"\n\n"ไม่ ไม่! ย่านการค้าเก่าต้องการการปรับปรุงอย่างเร่งด่วน" [merchant_character.GetNameNoTooltip] ตัวแทนของสมาคมท้องถิ่น แทรกเข้ามาในการสนทนาอย่างไม่ละอาย "ลองนึกภาพดูสิว่าเมืองจะมีชีวิตชีวามากขึ้นเพียงใดด้วยย่านการค้าที่คึกคัก!" "
 bp3_survey.1050.a: "ให้เรามุ่งเน้นไปที่กำแพงเก่าที่ผุพังของ [province.GetNameNoTooltip]"
 bp3_survey.1050.b: "พวกพ่อค้าพูดถูก"
 bp3_survey.1050.c: "เราไม่มีทองมากพอที่จะแจกจ่ายให้ใครก็ได้"

 inspection_expanding_walls_new_modifier: "พื้นที่สำหรับการขยาย"
 inspection_expanding_walls_new_modifier_desc: "เมืองนี้พบพื้นที่สำหรับการขยายตัว หลังจากย้ายส่วนหนึ่งของกำแพงออกไป"
 inspection_expanding_walls_old_modifier: "ลงทุนในสมาคม"
 inspection_expanding_walls_old_modifier_desc: "สมาคมท้องถิ่นได้รับผลประโยชน์เล็กน้อย หลังจากมีการจัดสรรทรัพย์สินจำนวนเล็กน้อยเพื่อบำรุงรักษาย่านการค้า"
 inspection_learning_intent_building_modifier: "แนวทางการก่อสร้าง"
 inspection_learning_intent_building_modifier_desc: "หลังจากนำแนวปฏิบัติบางอย่างจากส่วนอื่นๆ ของอาณาจักรมาใช้ เมืองหลวงก็เจริญรุ่งเรืองด้วยชีวิตชีวา"

 inspection_expanding_walls_new_desc: "\t#weak เพิ่มขึ้นสำหรับทุกช่อง [building|E] ที่ว่าง#!"
 MODIFIER_DEFINITION_EXPANDING_WALLS_NEW_DESC: "\nตัวปรับ แต่งนี้จะเพิ่มขึ้นตามจำนวนช่อง [building|E] ที่ว่างใน [barony|E]"

 inspection_expanding_walls_old_desc: "\t#weak เพิ่มขึ้นสำหรับทุก [building|E]#!"
 MODIFIER_DEFINITION_EXPANDING_WALLS_OLD_DESC: "\nตัวปรับ แต่งนี้จะเพิ่มขึ้นตามจำนวน [buildings|E] ใน [barony|E]"

 bp3_survey.1060.t: "ขุดเรื่องของตัวเอง"
 bp3_survey.1060.desc: "ขณะที่ข้าสำรวจพื้นที่ห่างไกลของ [province.GetName] ขบวนของข้าและข้าพบถนนสายเก่าที่ลับตา แม้จะซ่อนไว้อย่างดี แต่มันก็นำไปสู่เนินเขาเล็กๆ และโดยเฉพาะอย่างยิ่งถ้ำที่เราพบอุปกรณ์ทำเหมืองที่ถูกทิ้งร้างกระจัดกระจายอยู่บนพื้นถ้ำ\n\n"
 bp3_survey.1060.desc.copper: ""ท่านเจ้าเหนือหัว" ทหารคนหนึ่งของข้า [soldier_character.GetFirstNameNoTooltip] อุทานขึ้นทันที "นี่มันสายแร่ทองแดงไม่ใช่หรือ?""
 bp3_survey.1060.desc.silver: ""[ROOT.Char.Custom('FormOfAddressForLiege')|U]" ทหารของข้าคนหนึ่ง นามว่า [soldier_character.GetFirstNameNoTooltip] พลันอุทานขึ้นว่า "แสงระยิบระยับนี่ต้องเป็นแร่เงินแน่!""
 bp3_survey.1060.desc.gold: ""[ROOT.Char.Custom('FormOfAddressForLiege')|U]," หนึ่งในทหารของข้า, [soldier_character.GetFirstNameNoTooltip], พลันอุทานขึ้นมาด้วยตาที่เบิกกว้าง, "นี่มันก้อนทองคำใช่หรือไม่พ่ะย่ะค่ะ?""
 bp3_survey.1060.a: "เรารออะไรอยู่? ขุด! ขุดสิ!"

 inspection_learning_intent_flourishing_metal_trade_modifier: "ตลาดรุ่งเรือง"
 inspection_learning_intent_flourishing_metal_trade_modifier_desc: "บารอนีนี้มีตลาดที่รุ่งเรืองหลังจากมีการค้นพบเหมืองในที่อื่นของอาณาจักร"

 bp3_survey.1070.t: "ความผิดปกติที่เป็นปกติ"
 bp3_survey.1070.desc.intro.personal: "จากการตรวจสอบภาษีที่เก็บโดยผู้ดูแลและอุปราชท้องถิ่นของข้า ข้าสังเกตเห็นความคลาดเคลื่อนที่ชัดเจนระหว่างสิ่งที่บันทึกไว้ในบางพื้นที่กับสิ่งที่ข้าได้รับ\n\n"
 bp3_survey.1070.desc.intro.vassal: "จากการตรวจสอบภาษีที่ได้รับขณะที่ [province.GetName] อยู่ภายใต้การปกครองของ [county_owner.GetFirstNamePossessive] ข้าสังเกตเห็นความคลาดเคลื่อนที่ชัดเจนระหว่างสิ่งที่ข้าควรได้รับกับสิ่งที่ได้รับ แม้ว่า [county_owner.GetFirstNameNoTooltip] ควรจะสังเกตเห็น แต่ตัวเลขที่ผิดพลาดได้ถูกเพิ่มเข้าไปก่อนที่จะถึงโต๊ะทำงานของ [county_owner.GetHerHis] เสียอีก\n\n"
 bp3_survey.1070.desc: "ไม่ว่าใครจะเป็นผู้กระทำผิดอย่างแท้จริง เป็นที่ชัดเจนว่าต้องมีคนรับผิดชอบ ชาวบ้านได้จ่ายส่วนของตนไปแล้ว แต่การบีบคั้นพวกเขาง่ายกว่าผู้ที่รับผิดชอบต่อ 'ความผิดพลาด' เหล่านี้จริงๆ"
 bp3_survey.1070.a: "เหล่าขุนนาง #emp จะต้อง#! จ่ายส่วนของตน ไม่ทางใดก็ทางหนึ่ง"
 bp3_survey.1070.a.flavor: "ทำให้ผู้รับผิดชอบเป็นเยี่ยงอย่าง เพื่อให้ที่เหลือรู้ว่าอะไรเป็นเดิมพัน"
 bp3_survey.1070.b: "การเก็บภาษีครั้งเดียวจากชาวบ้านจะชดเชยความสูญเสียเหล่านี้"
 bp3_survey.1070.b.flavor: "ชาวบ้านจะไม่พอใจ แต่เงินเป็นสิ่งจำเป็น"
 bp3_survey.1070.c: "ข้าจะปล่อยผ่านไป ครั้งนี้..."
 bp3_survey.1070.c.flavor: "การแสดงความเมตตาจะเป็นที่ชื่นชม หวังว่านะ"

 inspection_regular_irregularities_local_modifier: "ภาษีครั้งเดียว"
 inspection_regular_irregularities_local_modifier_desc: "ตัวละครนี้บังคับใช้ภาษีครั้งเดียวที่ผิดปกติกับพลเมืองท้องถิ่น เพื่อชดเชยความบกพร่องของข้าในบังคับ"
 inspection_regular_irregularities_modifier: "การลงโทษที่บังคับใช้"
 inspection_regular_irregularities_modifier_desc: "ตัวละครนี้ได้ลงโทษอย่างรุนแรงต่อข้าในบังคับที่ขโมยเงินภาษีไปเป็นของตนเอง"

 bp3_survey.1080.t: "สถานที่ที่ควรค่าแก่การเยี่ยมชม"
 bp3_survey.1080.desc: ""มันไม่ปลอดภัยเลยสักนิด [ROOT.Char.Custom('FormOfAddressForLiege')]" นักเดินทางท่าทางอิดโรยผู้หนึ่งบอกข้า "ข้ารอดชีวิตมาได้หวุดหวิดทีเดียวล่ะขอรับ" จริงดังคำของ[traveler_character.GetHerHis] ดูเหมือนว่า [traveler_character.GetSheHe] ได้ผ่านประสบการณ์ที่หนักหนามาทีเดียว\n\n"
 bp3_survey.1080.desc.holy_poi: "ดูเหมือนว่า [ROOT.GetCharacter.GetFaith.GetReligion.GetAdherentNamePluralNoTooltip] จากทั่วทุกสารทิศได้เดินทางมาที่ [location_province.GetName] เพื่อชมสถานที่ศักดิ์สิทธิ์ที่สุด [location_province.Custom('GetSpecialBuildingPrefix')][location_province.GetHolding.GetSpecialBuildingType.GetName] แต่กลับถูกขัดขวางโดยอาชญากร"
 bp3_survey.1080.desc.poi: "ดูเหมือนว่าผู้คนจากทั่วทุกสารทิศได้เดินทางมาที่นี่เพื่อชม [location_province.Custom('GetSpecialBuildingPrefix')][location_province.GetHolding.GetSpecialBuildingType.GetName] แต่กลับถูกขัดขวางโดยอาชญากร"
 bp3_survey.1080.desc.holy_site: "ดูเหมือนว่า [ROOT.GetCharacter.GetFaith.GetReligion.GetAdherentNamePluralNoTooltip] จากทั่วทุกสารทิศได้มาที่ [location_province.GetName] เพื่อชมสถานที่ศักดิ์สิทธิ์ในท้องถิ่น แต่กลับถูกขัดขวางโดยอาชญากร"
 bp3_survey.1080.desc.outro: "หากเราปล่อยให้โจรและนักปล้นจี้คอยทำร้ายผู้มาเยือนต่อไป... อีกไม่นานพวกเขาก็จะเริ่มมองหาที่อื่น"
 bp3_survey.1080.a: "ข้าจะเกณฑ์ทหารลาดตระเวนเล็กๆ เพื่อปกป้องนักเดินทาง"
 bp3_survey.1080.b: "ให้พลเมืองดูแลผู้มาเยือนของพวกเขา"
 bp3_survey.1080.c: "พวกเขาป้องกันตัวเองได้"

