l_english: 
 ### Setup Work ###
 activity_survey: "การตรวจราชการ"
 activity_survey_desc: "ดำเนินการตรวจราชการทั่วแผ่นดินอย่างละเอียดถี่ถ้วน เพื่อให้แน่ใจว่าอาณาจักรของท่านดำเนินไปอย่างราบรื่น และเพื่อแสวงหาโอกาสในการปรับปรุงระบบข้าราชการและสถานการณ์ปัจจุบัน"
 activity_survey_tenet_bonus: "\n$BULLET_WITH_TAB$จะได้รับ [piety_experience|E] เมื่อเสร็จสิ้น"
 activity_survey_host_desc: "[AddLocalizationIf( GetPlayer.GetGovernment.HasRule( 'merit' ), 'activity_survey_gain_merit_desc' )]$BULLET_WITH_TAB$อาจได้รับ @pressed_claim![claims|E]\n$BULLET_WITH_TAB$อาจเพิ่มการยอมรับ @vassal_icon![offer_vassalization|E]\n$BULLET_WITH_TAB$อาจพัฒนา @gold_icon![taxes|E] ใน [county|E]\n$BULLET_WITH_TAB$อาจพัฒนา @development_icon![development|E] ใน [county|E]\n$BULLET_WITH_TAB$อาจพัฒนา @control_icon![control|E] ใน [county|E]\n$BULLET_WITH_TAB$อาจพัฒนา @stationed_regiment_icon![levies|E] ใน [county|E]\n$BULLET_WITH_TAB$อาจพัฒนา @opinion_icon![opinion|E]\n$BULLET_WITH_TAB$อาจพัฒนา @domain_icon![county_opinion|E][AddLocalizationIf( GetPlayer.GetFaith.HasParameterByKey('inspections_unlocked_and_costs_piety' ), 'activity_survey_tenet_bonus' )]"
 activity_survey_guest_desc: ""
 activity_survey_conclusion_desc: "การเดินทางครั้งนี้ ทำให้ข้าได้เห็นอาณาจักรของข้ามากขึ้น แต่ข้าอยู่ที่นี่ได้ไม่นานนัก ภารกิจของข้าที่นี่เสร็จสิ้นแล้ว ถึงเวลากลับบ้าน"
 activity_survey_selection_tooltip: "ตรวจสอบให้แน่ใจว่าอาณาจักรของท่านดำเนินไปด้วยข้าราชการผู้มีความสามารถและภักดี ผ่านการตรวจราชการอย่างละเอียด\n\nรางวัลที่คาดว่าจะได้รับ: $rewards_inspection_tt$"
 activity_survey_destination_selection: "\n[inspections|E] จะได้รับประโยชน์หากจัดขึ้นใน [counties|E] ที่มี [county_control|E] ต่ำ หรือตามแนวชายแดนติดกับ [realms|E] ต่างชาติ ซึ่งระบบข้าราชการท้องถิ่นยังขาดประสิทธิภาพ พื้นที่เหล่านี้อาจมอบโอกาสให้ท่านมากขึ้นและมี [inspection_success_chance_no_prefix|E] ที่สูงขึ้น"
 survey_activity_not_capital: "[inspections|E] ไม่สามารถจัดขึ้นใน [capital|E] ได้"
 survey_activity_on_cooldown: "[inspections|E] สามารถจัดขึ้นใน [county|E] ได้เพียงครั้งเดียวทุกๆ #bold 5#! ปี"
 rewards_inspection_tt: "\n$BULLET_WITH_TAB$@pressed_claim![claims|E] และการยอมรับ @vassal_icon![offer_vassalization|E]\n$BULLET_WITH_TAB$@gold_icon![taxes|E], @development_icon![development|E], และ @control_icon![control|E]\n$BULLET_WITH_TAB$@stationed_regiment_icon![levies|E], @opinion_icon![opinion|E], และ @domain_icon![county_opinion|E]"
 activity_survey_predicted_cost: "ค่าใช้จ่ายของ [inspection|E] ส่วนใหญ่ได้รับผลกระทบจากจำนวนเงินทุนที่จัดสรรให้กับ [activity|E] เงินทุนที่มากขึ้นจะช่วยให้บรรลุภารกิจได้ง่ายขึ้น แต่ก็จะแพงขึ้นด้วย"
 
 activity_survey_gain_merit_desc: "$BULLET_WITH_TAB$$may_gain_merit_desc$\n"
 
 phase_surveying: "การตรวจราชการแผ่นดิน"
 phase_surveying_desc: ""

 survey_overseer_intent: "เจตนาของผู้ตรวจการ"
 survey_overseer_intent_desc: "เหล่าขุนนางและผู้ดูแลท้องถิ่นขึ้นชื่อเรื่องการเก็บภาษีเกินพิกัดและมีทรัพย์สินมั่งคั่ง มายุติเรื่องนี้กันเถอะ\n\n#emp ปรับปรุง [inspection_success_chance_no_prefix|E]#!"

 survey_learning_intent: "$survey_learning_intent_guest$"
 survey_learning_intent_desc: "$survey_learning_intent_guest_desc$\n\n#emp โอกาสที่จะได้รับโบนัสเพิ่มเติมสำหรับ [capital|E]#!"

 survey_learning_intent_guest: "เจตนาการสำรวจ"
 survey_learning_intent_guest_desc: "ดูว่าเราสามารถนำบทเรียนใดจากระบบข้าราชการท้องถิ่นกลับไปใช้ในเมืองหลวงของเราได้บ้าง"

 activity_survey_province_desc: "ท่านเดินทางไปยัง [ROOT.Province.GetName]"

 survey_border_county: "\n#positive_value ++ เคาน์ตีชายแดน #!"
 survey_bordering_other_vassals_county: "\n#positive_value + เคาน์ตีติดชายแดนข้าในบังคับอื่น #!"
 survey_very_low_county_control: "\n#positive_value +++ การควบคุมเคาน์ตีต่ำมาก#!"
 survey_low_county_control: "\n#positive_value ++ การควบคุมเคาน์ตีต่ำ#!"
 survey_medium_county_control: "\n#positive_value + การควบคุมเคาน์ตีปานกลาง#!"

 county_control_modifier: "[county_control|E]"
 borderlands_modifier: "ดินแดนชายขอบ"
 inspection_success_chance.events: "เหตุการณ์"
 inspection_success_chance.second_try_modifier: "[GetModifier('inspection_second_try_modifier').GetName]"

 inspection_activity_success_increase_miniscule_tt: "[inspection_success_chance_no_prefix|E] #positive_value เพิ่มขึ้นเล็กน้อย#!"
 inspection_activity_success_increase_minor_tt:0 "[inspection_success_chance_no_prefix|E] #positive_value เพิ่มขึ้นเล็กน้อย#!"
 inspection_activity_success_increase_medium_tt:0 "[inspection_success_chance_no_prefix|E] #positive_value เพิ่มขึ้น#!"
 inspection_activity_success_decrease_miniscule_tt: "[inspection_success_chance_no_prefix|E] #negative_value ลดลงเล็กน้อย#!"
 inspection_activity_success_decrease_minor_tt:0 "[inspection_success_chance_no_prefix|E] #negative_value ลดลงเล็กน้อย#!"
 inspection_activity_success_decrease_medium_tt:0 "[inspection_success_chance_no_prefix|E] #negative_value ลดลง#!"

 inspection_success_chance: "[inspection_success_chance_no_prefix|E]"
 inspection_success_bar: "[inspection_success_chance_no_prefix|E]: [Activity.MakeScope.Var( 'inspection_success_chance' ).GetValue|V0]%"

 ### Activity Option ###
 inspection_option_allocated_funds: "การเงินสำหรับการตรวจราชการ"
 inspection_no_funding: "ไม่มีเงินทุน"
 inspection_no_funding_desc: "$EFFECT_LIST_BULLET$ [skill_challenges|E] จะสำเร็จได้ยากขึ้น\n$EFFECT_LIST_BULLET$ ค่าใช้จ่าย [gold_i] [gold|E] ในเหตุการณ์ต่างๆ ยังคงเท่าเดิม\n\n#weak ด้วยเงินทุนเพียงเล็กน้อยหรือไม่มีเลย อาจเป็นเรื่องยากที่จะหาเงินทุนที่จำเป็นเพื่อสนับสนุนเป้าหมายทั้งหมดของท่านในจังหวัด.#!"
 inspection_small_fund: "เงินทุนเพียงพอ"
 inspection_small_fund_desc: "$EFFECT_LIST_BULLET$ [skill_challenges|E] ใน [activity|E] มีโอกาสสำเร็จสูงขึ้น\n$EFFECT_LIST_BULLET$ ค่าใช้จ่าย [gold_i] [gold|E] ในเหตุการณ์ต่างๆ ลดลง #P 20%#!\n\n#weak ด้วยเงินจำนวนเล็กน้อย จะง่ายขึ้นในการจัดหาเงินทุนสำหรับการปรับโครงสร้างที่ท่านคาดว่าจะจำเป็นในจังหวัด.#!"
 inspection_large_fund: "เงินทุนจำนวนมาก"
 inspection_large_fund_desc: "$EFFECT_LIST_BULLET$ [skill_challenges|E] ใน [activity|E] มีโอกาสสำเร็จสูงขึ้นอย่างมีนัยสำคัญ\n$EFFECT_LIST_BULLET$ ค่าใช้จ่าย [gold_i] [gold|E] ในเหตุการณ์ต่างๆ ลดลง #p 40%#!\n\n#weak ด้วยเงินจำนวนมาก ท่านคงนึกไม่ออกว่าจะมีสิ่งใดที่ท่านจะต้องดิ้นรนหาเงินทุนในจังหวัด.#!"

 ### Intro Event ###
 bp3_survey.0005.t: "การมาถึง"
 bp3_survey.0005.desc.holder: "เมื่อข้ามาถึง [ROOT.Char.GetCurrentLocation.GetName] ข้าถูกนำตัวไปยังห้องหนังสือเล็กๆ ที่ ซึ่ง [county_holder.GetTitledFirstName] ต้อนรับข้า ข้าได้ส่งผู้ส่งสารมาก่อนแล้ว จึงไม่น่าแปลกใจที่ข้ามาที่นี่ แต่ [county_holder.GetSheHe] ก็ดูสงสัยอย่างชัดเจนถึงเหตุผล ความวุ่นวายทั้งหมดของ [county_holder.GetHerHis] เป็น เพราะรู้สึกผิด หรือเป็นเพียงคำยกยอปอปั้น?\n\nช่างเถอะ ข้าไม่ได้มาที่นี่เพื่อจัดการกับ [county_holder.GetHerHim] ในตอนนี้ ข้ามาที่นี่เพื่อ..."
 bp3_survey.0005.desc.no_holder: "เมื่อข้ามาถึง [ROOT.Char.GetCurrentLocation.GetName] ข้าถูกนำตัวไปยังห้องหนังสือ กลุ่มคนรับใช้คอยดูแลทุกความต้องการของข้าและวุ่นวายอยู่รอบตัวข้าสักพัก จนกระทั่งข้าขอให้พวกเขาออกไป ข้าจะมัวมีสมาธิกับภารกิจได้อย่างไร หากพวกเขายังคงวิ่งวุ่นอยู่ในห้อง?\n\nเมื่อพวกเขาออกไปแล้ว ในที่สุดข้าก็สามารถเริ่มทำงานตามแผนของข้าได้ ซึ่งก็คือ..."
 bp3_survey.0005.a: "ขยายพรมแดนของข้า"
 bp3_survey.0005.a.tt: "[inspection|E] จะพยายาม:$SurveyArrivalIntroClaims$ $SurveyARrivalIntroVassals$"
 bp3_survey.0005.b: "ปรับปรุงระบบข้าราชการที่นี่ใน [ROOT.Char.GetCurrentLocation.GetNameNoTooltip]"
 bp3_survey.0005.b.tt: "[inspection|E] จะพยายาม:$SurveyArrivalIntroTax$ $SurveyArrivalIntroDevelopment$ $SurveyArrivalIntroControl$"
 bp3_survey.0005.c: "ทำให้ผู้คนที่นี่จดจำว่าเหตุใดข้าจึงเป็นเจ้าเหนือหัวของพวกเขา"
 bp3_survey.0005.c.tt: "[inspection|E] จะพยายาม:$SurveyArrivalIntroLevy$ $SurveyArrivalIntroOpinion$ $SurveyArrivalIntroPopularOpinion$"

 SurveyArrivalIntroClaims: "\n$BULLET_WITH_TAB$ สร้าง @pressed_claim![claims|E]"
 SurveyARrivalIntroVassals: "\n$BULLET_WITH_TAB$ เพิ่มการยอมรับ @vassal_icon![offer_vassalization|E]"

