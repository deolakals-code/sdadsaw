 SurveyArrivalIntroPopularOpinionLocBad: "\n$BULLET_WITH_TAB$ ปรับปรุง @domain_icon![county_opinion|E] (#bold #n [ROOT.Char.MakeScope.ScriptValue('survey_province_popular_opinion_info_value')|0]#!#!)"
 SurveyArrivalIntroPopularOpinionLocNeutral: "\n$BULLET_WITH_TAB$ ปรับปรุง @domain_icon![county_opinion|E] (#bold #color_yellow [ROOT.Char.MakeScope.ScriptValue('survey_province_popular_opinion_info_value')|0]#!#!)"

 ### End Event ###
 bp3_survey.0010.t: "บทสรุป"
 bp3_survey.0010.desc.border.success: "ความพยายามของเราตามแนวชายแดนของ [province.GetName] ประสบความสำเร็จอย่างใหญ่หลวง เราได้กำหนดอย่างชัดเจนว่าเป็นพื้นที่ที่ควรอยู่ภายใต้การดูแลของ [ROOT.Char.GetPrimaryTitle.GetName] และสิ่งนี้สะท้อนให้เห็นในวิธีที่ผู้คนพูดถึงมัน\n\nว่ากันว่าชาวบ้านหลายคนพูดถึงข้าราวกับว่าข้าเป็นผู้ปกครองของพวกเขาแล้ว"
 bp3_survey.0010.desc.border.failure: "แม้ว่าเราจะพยายามอย่างเต็มที่ แต่ทุกความพยายามในการอ้างสิทธิ์ในดินแดนชายขอบของ [province.GetName] ก็ล้มเหลว หรืออาจถึงขั้นน่าอับอาย ชาวบ้านชายแดนบางคนเริ่มพูดว่า "สำเร็จเหมือน [ROOT.Char.GetTitledFirstName]" เป็นสำนวนสำหรับ [ROOT.Char.GetWomenMen] หนุ่มสาวที่ถูกปฏิเสธ\n\nข้าเริ่มเสียใจกับเรื่องทั้งหมดนี้แล้ว..."
 bp3_survey.0010.desc.bureaucracy.success: "ตอนแรกดูเหมือนเป็นไปไม่ได้ แต่ข้าก็หาทางเริ่มแก้ไขสิ่งต่างๆ ใน [province.GetName] ได้สำเร็จ โดยยุติการทุจริตและโจรผู้ร้ายในท้องถิ่นบางส่วน แม้จะเป็นเพียงก้าวแรกในทิศทางที่ถูกต้อง แต่ก็มีความสำคัญอย่างยิ่งต่ออนาคตของเคาน์ตี\n\nตอนนี้เราเพียงแค่ต้องแน่ใจว่าเรายังคงอยู่ในเส้นทางที่ถูกต้องในอนาคตอันใกล้นี้"
 bp3_survey.0010.desc.bureaucracy.failure: "บางครั้ง ดูเหมือนว่าการทุจริตที่คอยหลอกหลอน [province.GetName] อาจจะสิ้นสุดลง แต่ในทุกๆ ครั้ง ก็มีสิ่งใหม่ที่ต้องแก้ไขอยู่เสมอ มีกลุ่มโจรปล้นสะดมอยู่เสมอ มีขุนนางทุจริตซ่อนภาษีอยู่เสมอ หรือมีอาคารอื่นที่ต้องปรับปรุงอยู่เสมอ\n\nแม้ว่าจะเป็นความพยายามอย่างกล้าหาญในส่วนของข้า แต่ [ROOT.Char.GetWomanMan] คนเดียวก็ทำได้เพียงเท่านี้..."
 bp3_survey.0010.desc.people.success: "เราได้เห็นความนิยมที่เพิ่มขึ้นอย่างมีนัยสำคัญในหมู่ชาวบ้านใน [province.GetName] ถึงขนาดที่บางคนใช้สำนวน "เป็นเหมือน [ROOT.Char.GetFirstName]" เห็นได้ชัดว่าเป็นเพียงเรื่องของเวลาก่อนที่พวกเขาจะเรียนรู้ที่จะชื่นชมผู้ที่เหนือกว่า\n\nหวังว่าพวกเขาจะจำสิ่งนี้ได้ในครั้งต่อไปที่มีปัญหาเล็กๆ น้อยๆ ไร้สาระเกิดขึ้น"
 bp3_survey.0010.desc.people.failure: "ไม่ว่าข้าจะพูดคุยหรือมีส่วนร่วมกับชาวบ้านใน [province.GetName] มากเพียงใด เคาน์ตีก็ยังคงมีบรรยากาศของความไม่พอใจอยู่ตลอดเวลา แม้ว่าข้าจะพยายามอย่างเต็มที่แล้ว แต่ข้าก็ไม่รู้ว่าจะเข้าถึงหรือแก้ไขปัญหานี้ได้อย่างไร\n\nบางทีมันอาจจะไม่ได้ถูกกำหนดไว้ อย่างน้อยก็ไม่ใช่ในตอนนี้"
 bp3_survey.0010.a: "ตามแผน"
