 SurveyArrivalIntroControlLocNeutral: "\n$BULLET_WITH_TAB$ ปรับปรุง @control_icon![control|E] (#bold #color_yellow [ROOT.Char.MakeScope.ScriptValue('survey_province_control_info_value')|0]#!#!)"

