 bp3_survey.0050.t: "เจ้าเหนือหัว ณ ราชสำนัก"
 bp3_survey.0050.desc: "แม้ว่า [host.GetSheHe] จะส่งผู้ส่งสารมาก่อนล่วงหน้า แต่ก็ยังน่าประหลาดใจเล็กน้อยเมื่อข้าเห็นเจ้าเหนือหัวของข้า [host.GetFirstName] เสด็จมาถึงราชสำนักของข้าใน [province.GetName] ด้วยตนเอง [host.GetSheHe|U] ได้อธิบายว่า [host.GetSheHe] มาที่นี่เพื่อ "ตรวจการ" สิ่งต่างๆ ด้วย [host.GetHerselfHimself] โดยไม่ได้ลงรายละเอียด\n\nข้าพยายามอย่างยาวนานเพื่อดูว่ามีสิ่งใดเป็นพิเศษที่ [host.GetSheHe] ต้องการจากข้าหรือไม่ แต่ [host.GetSheHe] บอกว่า [host.GetSheHe] มีทุกสิ่งที่ [host.GetSheHe] ต้องการแล้ว หวังว่า [host.GetSheHe] จะไม่พบสิ่งใดที่ [host.GetSheHe] ไม่ควรพบ..."
