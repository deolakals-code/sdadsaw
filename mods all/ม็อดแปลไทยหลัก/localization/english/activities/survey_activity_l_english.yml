 inspection_old_roads_of_x_domain_modifier_desc: "ทหารรักษาการณ์ท้องถิ่นได้รับมอบหมายให้บำรุงรักษาถนนเก่าที่ทรุดโทรมของเคาน์ตี"
 inspection_old_roads_of_x_populace_modifier: "การบำรุงรักษาโดยพลเมือง"
 inspection_old_roads_of_x_populace_modifier_desc: "พลเมืองของเคาน์ตีถูกบังคับให้มีส่วนร่วมในงานบำรุงรักษาถนนของเคาน์ตี"
 inspection_old_roads_negative_modifier: "ถนนที่บำรุงรักษาไม่ดี"
 inspection_old_roads_negative_modifier_desc: "ถนนเก่าในเคาน์ตีทรุดโทรมมานานแล้ว และต้องการการบำรุงรักษาอย่างเร่งด่วน"

 bp3_survey.1030.t: "การต่อสู้ระหว่างสมาคม"
 bp3_survey.1030.desc: "ขณะที่ข้ากำลังสนทนากับข้าราชการคนหนึ่งของข้า ข้าก็ถูกขัดจังหวะโดยกลุ่มคนสองกลุ่มที่ตะโกนใส่กันอยู่ห่างออกไปเพียงไม่กี่ก้าว องครักษ์ของข้าสามารถแยกพวกเขาออกจากกันได้แทบจะไม่ทัน ขณะที่ตัวแทนของทั้งสองฝ่ายยังคงตะโกนใส่กัน\n\nหลังจากพยายามไกล่เกลี่ยพวกเขาซ้ำแล้วซ้ำเล่า ในที่สุดข้าก็เข้าใจว่านี่คือการเผชิญหน้าระหว่าง [city_province.Custom('InspectionFightingGuilds1Loc')] และ [city_province.Custom('InspectionFightingGuilds2Loc')] เกี่ยวกับสิทธิ์ในทรัพย์สินในส่วนที่สำคัญที่สุดของใจกลางเมือง"
 bp3_survey.1030.a: "มีที่ว่างสำหรับพวกเจ้าทั้งสอง!"
 bp3_survey.1030.a.win: "พวกเขาหาข้อประนีประนอมได้"
 bp3_survey.1030.a.loss: "มันกลายเป็นการต่อสู้แย่งชิงอำนาจที่ส่งผลกระทบต่อทั้งหมดของ [city_province.GetNameNoTooltip]"
 bp3_survey.1030.a.loss_short: "พวกเขาปฏิเสธที่จะประนีประนอม"
 bp3_survey.1030.b: "สนับสนุน [city_province.Custom('InspectionFightingGuilds1Loc')]"
 bp3_survey.1030.c: "ช่วยเหลือ [city_province.Custom('InspectionFightingGuilds2Loc')]"
 bp3_survey.1030.d: "[city_province.Custom('InspectionFightingGuilds1Loc')]? [city_province.Custom('InspectionFightingGuilds2Loc')]?! หึ นั่นมันทองของข้า!"

