 bp3_survey.1010.t: "เหล่าอันธพาลใน [province.GetNameNoTooltip]"
 bp3_survey.1010.desc: "ขณะที่ข้าเดินทางไปตามถนนของ [province.GetName] ข้าก็พบว่าตนเองกำลังเผชิญหน้ากับ [peasant_character.GetWomanMan] ที่ถูกอันธพาลบางคนคุกคามกลางวันแสกๆ [peasant_character.GetSheHe|U] กรีดร้องขอความช่วยเหลือ ขณะที่ [peasant_character.GetSheHe] มองมาที่ข้าและองครักษ์ของข้า\n\nทหารรับจ้างบางคนในเมืองหันไปเป็นโจรและก่ออาชญากรรมเพื่อเลี้ยงชีพเมื่อเร็วๆ นี้ แต่ข้าไม่รู้เลยว่ามันแย่ขนาดนี้ ข้าต้องการเข้าไปช่วยเหลือ [peasant_character.GetWomanMan] ที่น่าสงสารคนนี้หรือไม่?"
