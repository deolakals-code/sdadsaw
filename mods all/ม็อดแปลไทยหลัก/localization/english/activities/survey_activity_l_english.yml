 bp3_survey.1020.t: "ถนนสายเก่าของ [province.GetCounty.GetName]"
 bp3_survey.1020.desc: "ขณะที่ข้าเดินทางผ่าน [province.Custom('HoldingNoHoldingTerrainRoamingTooltip')] ข้าครุ่นคิดถึงปัญหาที่พบบ่อยเกินไป ทันทีที่เราออกจากเมือง เราก็พบว่าตัวเองติดอยู่ในคูโคลนและเดินตามเส้นทางที่ไม่ไปไหนเลย\n\nถนนเก่าเหล่านี้แทบไม่มีประโยชน์เลย หากจะมีประโยชน์บ้างก็ตาม เว้น แต่ข้าจะพิจารณาจัดหาคนมาเริ่มงานซ่อมแซม มันน่าจะเริ่มส่งผลกระทบต่อพลเมืองท้องถิ่นและพ่อค้าต่างชาติ หากยังไม่ส่งผลกระทบอยู่แล้ว"
