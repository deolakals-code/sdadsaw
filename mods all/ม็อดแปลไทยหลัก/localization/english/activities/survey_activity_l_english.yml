 bp3_survey.0040.desc: "ในฐานะส่วนหนึ่งของความพยายามในการปรับปรุงสถานะของเรากับผู้คนใน [province.GetName] ข้าได้จัดสรรเวลาในวันนี้เพื่อเดินทางไปทั่วเมืองและพบปะกับชาวบ้าน"
 bp3_survey.0040.mid: "แม้ว่า [county_holder.GetHerHis] จะคัดค้าน ข้าก็ได้พา [county_holder.GetFirstName] มาด้วย เพื่อให้ [county_holder.GetSheHe] ได้เห็นว่าควรทำอย่างไร"
