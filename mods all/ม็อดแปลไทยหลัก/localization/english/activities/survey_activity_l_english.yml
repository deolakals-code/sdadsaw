 bp3_survey.1000.t: "ดินแดนรกร้าง"
 bp3_survey.1000.desc: "ขณะที่เราสำรวจภูมิภาคที่ห่างไกลของ [province.GetName] [guest_1.GetFirstName] และข้าพบพื้นที่เล็กๆ ที่เรียกว่า [empty_province.Custom('HoldingNoHoldingTerrainRoamingTooltip')] "
 bp3_survey.1000.desc_lonely: "ขณะที่ข้าสำรวจภูมิภาคที่ห่างไกลของ [province.GetName] ข้าพบพื้นที่เล็กๆ ที่เรียกว่า [empty_province.Custom('HoldingNoHoldingTerrainRoamingTooltip')] "
 bp3_survey.1000.desc_continuation: "นอกจากคนเลี้ยงแพะไม่กี่คน ดูเหมือนจะไม่มีใครอาศัยอยู่แถวนี้เลย เมื่อใดก็ตามที่เราผ่านพวกเขา พวกเขามองเราด้วยสายตาเคลือบแคลง\n\n"
 bp3_survey.1000.desc_border: "หากข้าต้องการขยายอาณาเขตของข้า ข้าต้องแน่ใจว่าข้ามีข้าในบังคับที่สามารถสะท้อนอำนาจของข้าไปยังมุมต่างๆ ของอาณาจักรได้"
 bp3_survey.1000.desc_bureaucracy: "หากข้าต้องการให้แน่ใจว่าข้าควบคุม [province.GetNameNoTooltip] ได้ ข้าต้องเข้าใจประชากรให้ดีขึ้น แม้ในดินแดนห่างไกลเหล่านี้"
 bp3_survey.1000.desc_domain: "หากข้าต้องการสร้างแรงบันดาลใจให้ประชากรของข้า ข้าต้องแน่ใจว่าแม้ แต่ผู้คนที่อาศัยอยู่ในสถานที่ห่างไกลนี้ก็รู้จักใบหน้าและชื่อของข้า"
 bp3_survey.1000.a: "ส่งคนไปตั้งด่านหน้าเล็กๆ ในภูมิภาค"
 bp3_survey.1000.b: "ลงทุนสร้างถนนสำหรับพื้นที่นี้ เพื่อข้าจะได้ส่งคนออกไปที่นี่ได้"
 bp3_survey.1000.c: "ข้าต้องเข้าถึงชาวบ้าน"

