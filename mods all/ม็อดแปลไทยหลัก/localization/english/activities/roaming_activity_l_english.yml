 apa_roaming_feather_title: "[first.GetShortUIName|U] พบขนนกสีสดใส"
 apa_roaming_feather_key_title: "ขนนกสีสดใส"
 apa_roaming_feather_key: "ขณะที่ [first.GetSheHe] เดินทางผ่าน [activity.GetCurrentPhase.GetLocation.GetNameNoTooltip] [first.GetShortUIName] ได้พบขนนกสีสดใสงดงามอย่างน่าทึ่งโดยบังเอิญ"

 apa_roaming_ancient_runestone_title: "[first.GetShortUIName|U] พบศิลาจารึกอักษรรูนเก่าแก่"
 apa_roaming_ancient_runestone_key_title: "ศิลาจารึกอักษรรูนเก่าแก่"
