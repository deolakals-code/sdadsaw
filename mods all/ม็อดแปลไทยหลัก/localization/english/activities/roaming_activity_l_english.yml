 apa_roaming_ancient_megalith_title: "[first.GetShortUIName|U] พบแท่งหินใหญ่โบราณ"
 apa_roaming_ancient_megalith_key_title: "แท่งหินใหญ่โบราณ"
 apa_roaming_ancient_megalith_key: "ใน [activity.GetCurrentPhase.GetLocation.GetNameNoTooltip] [first.GetShortUIName] พบพยานเงียบแห่งยุคสมัยที่ล่วงเลย - อนุสาวรีย์แท่งหินใหญ่โบราณ"

 apa_roaming_natural_arch_title: "[first.GetShortUIName|U] พบซุ้มหินธรรมชาติในป่าดง"
