 roaming_night_mystic_key_title: "ท้องฟ้ายามค่ำคืน"
 roaming_night_mystic_key: "[host.GetShortUIName] ใช้เวลาทั้งคืนเฝ้ามองท้องฟ้ายามค่ำคืนและครุ่นคิดเกี่ยวกับชีวิต"

 bp3_roaming.0150.t: "สระน้ำอันเงียบสงบ"
 bp3_roaming.0150.desc: "หลังจากเดินมาทั้งวันผ่าน [activity.GetCurrentPhase.GetLocation.Custom('HoldingNoHoldingTerrainRoaming')] ทันใดนั้นข้าก็พบสระน้ำอันเงียบสงบกลางป่ารกชัฏ นอกจากนกบางตัวที่ดื่มน้ำอย่างเงียบ ๆ ริมสระแล้ว ก็ไม่เห็นมนุษย์หรือสัตว์อื่นใดเลย\n\n"
 bp3_roaming.0150.desc.no_companion: "ข้านั่งลงริมน้ำ พักเท้า และสูดหายใจลึก"
 bp3_roaming.0150.desc.companion: "เรานั่งลงริมน้ำ พักเท้า และข้าได้ยิน [special_guest.GetFirstName] ถอนหายใจหนัก ๆ"
 bp3_roaming.0150.a: "อา ได้พักผ่อนสักครู่"
 bp3_roaming.0150.b: ""ข้าจากไปเมื่อได้ยินเสียงเพลงอันไพเราะก้องกังวานข้ามผืนน้ำ...""

 roaming_quiet_pond_key_title: "สระน้ำอันเงียบสงบ"
 roaming_quiet_pond_key: "[host.GetShortUIName] พบสระน้ำอันเงียบสงบในป่ารกชัฏของ [activity.GetCurrentPhase.GetLocation.GetNameNoTooltip] ที่ ซึ่ง [host.GetSheHe] ได้พักผ่อน"

 roaming_quiet_pond_poet_key_title: "$roaming_quiet_pond_key_title$"
 roaming_quiet_pond_poet_key: "[host.GetShortUIName] พบสระน้ำอันเงียบสงบ แต่เล่ากันว่าหนีไปเมื่อเสียงเพลงอันไพเราะชักนำให้ [host.GetHerHim] ทำความคุ้นเคยกับความลึกของผืนน้ำอย่างใกล้ชิดยิ่งขึ้น..."

 bp3_roaming.0160.t: "ไร่นาที่ถูกเผา"
 bp3_roaming.0160.desc: "ก่อนที่จะเห็นด้วยตาตนเอง ข้าได้กลิ่นไม้และเนื้อไหม้มา แต่ไกล เมื่อเรามาถึง สิ่งที่ข้าเห็นคือซากที่ยังคุกรุ่นของสิ่งที่ครั้งหนึ่งต้องเคยเป็นไร่นาขนาดใหญ่\n\n"
 bp3_roaming.0160.desc.no_companion: "องครักษ์ของข้าใช้เวลาเพียงครู่เดียวชี้ให้เห็นว่าไม่มีใครหรือสิ่งใดเหลือให้ช่วยที่นี่แล้ว"
 bp3_roaming.0160.desc.companion: "ข้าได้ยิน [special_guest.GetFirstName] พูดคุยกับองครักษ์ของข้า ไม่มีใครหรือสิ่งใดเหลือให้ช่วยที่นี่แล้ว"
 bp3_roaming.0160.desc.outro: "สิ่งที่เหลืออยู่คือเถ้าถ่านของบ้านและผู้ที่เคยอาศัยอยู่ในนั้น"
 bp3_roaming.0160.a: "ค้นหาซากศพ และนำพวกเขาไปสู่การพักผ่อนอันควร"
 bp3_roaming.0160.b: "ทหาร เก็บกวาดที่นี่ให้สิ้นซาก"
 bp3_roaming.0160.c: ""เราพยายามบุกเข้าไปในอาคารที่กำลังลุกไหม้ซ้ำแล้วซ้ำเล่า แต่ก็ไร้ผล...""

 roaming_burning_farm_piety_key_title: "ไร่นาที่ถูกเผา"
 roaming_burning_farm_piety_key: "ในการเดินทางของ [host.GetHerHis] [host.GetShortUIName] พบไร่นาที่ถูกเผา [host.GetSheHe|U] และองครักษ์ของ [host.GetHerHis] ได้นำซากศพไปสู่การพักผ่อนอันควร ก่อนจะจากไป"

 roaming_burning_farm_greedy_key_title: "$roaming_burning_farm_piety_key_title$"
 roaming_burning_farm_greedy_key: "ในการเดินทางของ [host.GetHerHis] [host.GetShortUIName] พบไร่นาที่ถูกเผา [host.GetSheHe|U] และองครักษ์ของ [host.GetHerHis] ได้เก็บกวาดของมีค่าจนหมดสิ้น ก่อนจะจากไป"

 roaming_burning_farm_poet_key_title: "$roaming_burning_farm_piety_key_title$"
 roaming_burning_farm_poet_key: "ในการเดินทางของ [host.GetHerHis] [host.GetShortUIName] พบไร่นาที่ถูกเผา เล่ากันว่า [host.GetSheHe|U] พยายามอย่างสุดความสามารถที่จะช่วยเหลือผู้ที่อาศัยอยู่ที่นั่น แต่ก็ไร้ผล"

 bp3_roaming.0170.t: "วันอันเงียบสงบ"
 bp3_roaming.0170.desc: "แม้ข้าจะคาดหวังไว้มากมาย แต่วันนี้กลับดำเนินไปอย่างเรียบง่ายและเงียบสงบอย่างท่วมท้น ตอนแรก ข้าพบว่าตนเองตื่นตัวกับทุกภาพและเสียง อย่างไรก็ตาม เมื่อเวลาผ่านไป ไม่มีสิ่งใดโดดเด่นเป็นพิเศษ และความสนใจของข้าก็เริ่มลดลง\n\n"
 bp3_roaming.0170.desc.no_companion: "ทว่า ค่อย ๆ ข้าก็เริ่มเพลิดเพลินกับความเรียบง่ายของการเดินเอง มันกลายเป็นเวลาสำหรับข้าและความคิดของข้าเท่านั้น"
 bp3_roaming.0170.desc.companion: "ทว่า ค่อย ๆ ข้าก็พบว่าตนเองชื่นชมเวลาที่ใช้กับ [special_guest.GetFirstName] ไม่มีเรื่องสำคัญใด ๆ เกิดขึ้น แต่มันก็น่าเพลิดเพลิน"
 bp3_roaming.0170.a: "บางทีนี่อาจเป็นสิ่งที่ข้าต้องการ"

 roaming_quiet_day_key_title: "วันอันเงียบสงบ"
 roaming_quiet_day_key: "[host.GetShortUIName|U] มีวันที่เงียบสงบอย่างน่าประหลาดขณะที่ [host.GetSheHe] เดินทางผ่าน [activity.GetCurrentPhase.GetLocation.GetNameNoTooltip]"

 bp3_roaming.0180.t: "เสียงพึมพำอย่างเหนื่อยล้า"
 bp3_roaming.0180.desc: "ข้าพบว่าตนเองค่อนข้างเพลิดเพลินกับการเดินของเราใน [ROOT.Char.GetCurrentLocation.GetName] แต่ที่น่าผิดหวังคือสหายร่วมเดินทางของข้ากลับไม่เป็น เช่นนั้น [special_guest.GetFirstName] เริ่มเดินตามหลังอยู่บ่อยครั้ง และข้าได้ยินเสียงสบถเป็นครั้งคราวมาจาก [special_guest.GetHerHim] บางครั้งถึงกับมีชื่อข้าติดมาด้วย ด้วยน้ำเสียงหงุดหงิด ในที่สุด [special_guest.GetSheHe] ก็พูดขึ้นว่า "ถึงหรือยัง?"\n\nข้าค่อนข้างแน่ใจว่าเรายังอยู่ห่างไกลจากเป้าหมาย และยังคงต้องเดินทางอีกไกลพอสมควรจึงจะไปถึง [special_guest.GetSheHe|U] มองข้าอย่างคาดหวังคำตอบ"
 bp3_roaming.0180.a: "ไม่ต้องห่วง ก็แค่หัวมุมนี่เอง!"
 bp3_roaming.0180.a_short: "เจ้าเดินต่อไป!"
 bp3_roaming.0180.b: "บางทีอาจถึงเวลาพักแล้ว..."

 roaming_tired_mutterings_lies_key_title: "เสียงพึมพำอย่างเหนื่อยล้า"
 roaming_tired_mutterings_lies_key: "แม้จะมีเสียงบ่นอย่างเหนื่อยล้าของ [special_guest.GetShortUIName|U] แต่ [host.GetShortUIName|U] ก็ปฏิเสธที่จะรับฟัง"

 roaming_tired_mutterings_break_key_title: "เสียงพึมพำอย่างเหนื่อยล้า"
 roaming_tired_mutterings_break_key: "หลังจากเสียงพึมพำและบ่นอย่างเหนื่อยล้าจาก [special_guest.GetShortUIName|U] [host.GetShortUIName|U] ก็ตัดสินใจพักผ่อน"

 roaming_tired_mutterings_athletic_key_title: "การเดินอันยาวนาน"
 roaming_tired_mutterings_athletic_key: "[host.GetShortUIName|U] ใช้เวลาเดินทางผ่าน [activity.GetCurrentPhase.GetLocation.GetNameNoTooltip] เป็นเวลานานพอสมควร เป็นการสร้างความแข็งแกร่งและพบความเพลิดเพลินในกิจกรรม"

 bp3_roaming.0190.t: "โอกาสสนทนา"
 bp3_roaming.0190.desc: "ขณะที่เราเดินทางผ่านถิ่นทุรกันดารรอบ [ROOT.Char.GetCurrentLocation.GetName] [special_guest.GetFirstName] และข้ามีเวลาสนทนากันมากมาย ข้าเคยหวังว่าเราจะเพลิดเพลินกับเวลาด้วยกัน แต่ข้าก็ประหลาดใจอย่างน่ายินดีที่มันเป็นไปด้วยดีเพียงใด\n\n[special_guest.GetFirstNameNoTooltip] มีหัวข้อสนทนาที่น่าสนใจหลากหลายที่จะหยิบยกขึ้นมา ไม่ว่าจะเป็นเรื่องเกี่ยวกับผู้คนบางคนใน [ROOT.Char.GetCapitalLocation.GetName] เรื่องซุบซิบในท้องถิ่น หรือเรื่องเล่าที่น่าจดจำ หลายชั่วโมงผ่านไปก่อนที่ข้าจะรู้ตัว และรู้สึกเหมือนเพียงชั่วครู่เดียว"
 bp3_roaming.0190.a: "ข้าไม่อยากเชื่อเลยว่า [random_courtier.GetFirstNameNoTooltip] พูด เช่นนั้น! ช่างน่าขันสิ้นดี!"

 roaming_chance_to_talk_key_title: "โอกาสสนทนา"
 roaming_chance_to_talk_key: "[special_guest.GetShortUIName|U] และ [host.GetShortUIName|U] เพลิดเพลินกับเวลาสนทนากันขณะเดินทางใน [activity.GetCurrentPhase.GetLocation.GetName]"

 bp3_roaming.0200.t: "ผืนผ้าใบบนฟากฟ้า"
 bp3_roaming.0200.desc: "หลายชั่วโมงผ่านไปนับ แต่ตะวันตกดิน เมื่อท้องฟ้าพลันเปลี่ยนเป็นเฉดสีม่วง น้ำเงิน และส้มที่งดงามที่สุด ราวกับว่า [ROOT.Char.GetFaith.HighGodName] [ROOT.Char.GetFaith.HighGodHerselfHimself] กำลังใช้สรวงสวรรค์เป็นผืนผ้าใบ\n\nด้วยความยำเกรงและความหวาดกลัว พวกเราทุกคนเฝ้าดูปรากฏการณ์นั้นคลี่คลายในความเงียบ หลังจากสิ้นสุดลงแล้วเท่านั้นที่ทุกคนเริ่มพูดถึงภาพที่เห็น ทั้งด้วยความเคารพยำเกรงและความหวาดหวั่น"
 bp3_roaming.0200.a: "ช่างเป็นภาพที่น่าทึ่ง!"

 roaming_nightsky_canvas_key_title: "ผืนผ้าใบบนฟากฟ้า"
 roaming_nightsky_canvas_key: "[host.GetShortUIName|U] เฝ้าดูปรากฏการณ์ทางดาราศาสตร์อันน่าประทับใจคลี่คลายบนท้องฟ้าเหนือ [activity.GetCurrentPhase.GetLocation.GetName]"

 bp3_roaming.0210.t: "หมู่ปักษีเบื้องบน"
 bp3_roaming.0210.desc: "ขณะที่เราเดินทางผ่าน [province.GetName] มีนกสองตัวบินตามเรามาหลายชั่วโมง พวกมันเพียงบินวนรอบตัวเราอย่างช้า ๆ ลงจอดไกลเกินกว่าจะเป็นอันตราย และร้องส่งเสียงมา แต่ไกล เมื่อพวกมันเข้าใกล้ชั่วขณะ ข้าเห็นขนสีดำและขาวของมัน\n\nครู่หนึ่ง พวกมันบินวนหนึ่งรอบ แล้วก็บินจากไป แม้หลังจากพวกมันไปแล้ว เราก็ยังคงได้ยินเสียงร้องของมันอยู่ แต่ไกล"
 bp3_roaming.0210.a: "อืม หนึ่งคือโศก สองคือโชค"

 the_birds_overhead_key_title: "$bp3_roaming.0210.t$"
 the_birds_overhead_key: "[host.GetShortUIName] มีนกคู่หนึ่งบินตาม [host.GetHerHim] ผ่าน [province.GetName] ส่งเสียงร้องให้กลุ่มฟัง แต่ไกล"

 bp3_roaming.0220.t: "หมู่บ้านที่ถูกลืม"
 bp3_roaming.0220.desc: ""#emp มีหมู่บ้านที่นี่ด้วยรึ?!#!" ข้าพบว่าตนเองพูดออกมาด้วยความงุนงงอย่างยิ่ง\n\nมันไม่เคยปรากฏบนแผนที่ใด ๆ และไม่มีใครเคยเอ่ยถึงมันเลย แต่ถึงกระนั้น มันก็อยู่ที่นี่ เมื่อข้าถามไปรอบ ๆ ว่าหมู่บ้านนี้ชื่ออะไร ผู้คนก็เพียงตอบว่า: "หมู่บ้านรึ? ก็หมู่บ้านนี่แหละ" ด้วยสำเนียงเหน่อ ๆ ที่ข้าไม่เคยได้ยินมาก่อน\n\nคนพวกนี้เป็นใครกัน?! ทำไมข้าไม่เคยได้ยินเรื่องของพวกเขามาก่อนเลย?"
 bp3_roaming.0220.a: "เดี๋ยวนะ จริง ๆ แล้วพวกเขาติดค้างภาษีข้าอยู่มากมิใช่รึ?"
 bp3_roaming.0220.a.landless: "มาดูกันว่าพวกเขามีอะไรแถวนี้บ้าง..."
 bp3_roaming.0220.b: "ข้าต้องเรียนรู้ทุกอย่างเกี่ยวกับคนเหล่านี้!"
 bp3_roaming.0220.b.mystic: "เรียนรู้จากนักพรตประจำหมู่บ้าน"
 bp3_roaming.0220.c: "ช่างน่าสนใจเสียจริง! พวกเขาจะเป็นเรื่องเล่าที่ดีได้"

 roaming_forgotten_village_modifier: "$bp3_roaming.0220.t$"
 roaming_forgotten_village_modifier_desc: "หมู่บ้านที่ถูกลืมในพื้นที่เพิ่งกลับมาเชื่อมสัมพันธ์กับเพื่อนบ้านจำนวนมาก แบ่งปันความรู้และประเพณีของพวกเขา"

 the_forgotten_village_key_title: "$bp3_roaming.0220.t$"
 the_forgotten_village_key: "[host.GetShortUIName] พบหมู่บ้านเก่าแก่ที่ถูกลืมขณะเดินทางผ่านดินแดนห่างไกลของ [province.GetName]"

 the_forgotten_village_mystic_key_title: "นักพรตประจำหมู่บ้าน"
 the_forgotten_village_mystic_key: "[host.GetShortUIName] เรียนรู้ประเพณีของนักพรตประจำหมู่บ้านใน [province.GetName]"

 bp3_roaming.0230.t: "ฤๅษี"
 bp3_roaming.0230.desc: "ขณะที่เราเดินทางผ่านดินแดนห่างไกลของ [province.GetName] ทันใดนั้นองครักษ์ของข้าและข้าก็พบ [hermit_character.GetWomanMan] ผู้หนึ่ง นุ่งห่มอาภรณ์สกปรก นั่งอยู่ตามลำพัง [hermit_character.GetHerselfHimself] ทันทีที่ [hermit_character.GetSheHe] สังเกตเห็นเรา [hermit_character.GetSheHe] ก็อุทานเสียงดังว่า: "ท่านคือบททดสอบล่าสุดที่ [hermit_character.GetFaith.HighGodName] ส่งมาใช่หรือไม่?!"\n\n"ขออภัยนะ?" ข้าเอ่ยถามออกมาอย่างสับสน และรู้สึกขุ่นเคืองเล็กน้อย\n\n"มาเถิด ข้าจะเล่าให้ท่านฟังทั้งหมดเกี่ยวกับบททดสอบและความทุกข์โศกของ [hermit_character.GetName] ผู้ปรีชา...""
 bp3_roaming.0230.a: "ท่านมีความคิดที่น่าสนใจนะ [hermit_character.GetNameNoTooltip]"
 bp3_roaming.0230.a.hermit: "สนทนากับฤๅษี"
 bp3_roaming.0230.b: "#emp เล่าให้ข้าฟังอีก...#!"
 bp3_roaming.0230.b.tooltip: "ท่านแอบเปลี่ยนไปนับถือ [hermit_faith.GetName]"
 bp3_roaming.0230.c: "ท่านพูดอะไรเกี่ยวกับ [ROOT.Char.GetFaith.HighGodName] นะ? รับไม่ได้ เจ้าพวกนอกรีต!"

 the_hermit_key_title: "ฤๅษี"
 the_hermit_key: "[host.GetShortUIName] พบฤๅษีผู้แปลกประหลาดในถิ่นทุรกันดาร"

 the_hermit_learning_key_title: "คำสอนของฤๅษี"
 the_hermit_learning_key: "[host.GetShortUIName] สนทนาอย่างยาวนานกับฤๅษีในดินแดนห่างไกลของ [province.GetName]"

 roaming_the_hermit_modifier: "แนวคิดนอกกรอบ"
 roaming_the_hermit_modifier_desc: "ตัวละครนี้มักแบ่งปันแนวคิดและความคิดนอกกรอบเกี่ยวกับศาสนาอยู่เสมอ"

 bp3_roaming.0240.t: "ค่ำคืนที่น่าจดจำ"
 bp3_roaming.0240.desc: "ขณะที่เราตั้งค่ายพักแรม ท้องฟ้าทั้งผืนก็สว่างไสวไปด้วยดวงดาว เป็นค่ำคืนที่ฟ้าโปร่งที่สุดคืนหนึ่งที่เราเคยเห็นนับตั้งแต่จาก [ROOT.Char.GetCapitalLocation.GetTitle.GetNameNoTier] มา\n\nเงียบสงัด ไม่มีเสียงใดให้ได้ยิน ไม่ว่าจากผู้คนหรือสรรพสัตว์ ราวกับว่า [province.GetTerrain.GetNameNoTooltip|l] กำลังกลั้นหายใจ ขณะที่เราทุกคนกำลังดื่มด่ำกับท้องฟ้ายามค่ำคืน ข้าควรจะเข้านอนเพื่อพักผ่อนสำหรับยามเช้า แต่... บางทีข้าอาจจะอยู่ต่ออีกสักชั่วโมงสองชั่วโมง"
 bp3_roaming.0240.a: "ข้าจะจดจำสิ่งนี้ไปชั่วชีวิต"

 a_night_to_remember_key_title: "ค่ำคืนที่น่าจดจำ"
 a_night_to_remember_key: "[host.GetShortUIName] อยู่เกือบทั้งคืนเพื่อเฝ้ามองท้องฟ้ายามค่ำคืนอันเต็มไปด้วยดวงดาวที่แจ่มใส"

 bp3_roaming.0250.t: "หลุมศพเล็ก ๆ"
 bp3_roaming.0250.desc: "ขณะที่เราเดินทางผ่าน [province.Custom('HoldingNoHoldingTerrainRoaming')] เราพบสิ่งที่ดูเหมือนหลุมศพ มันมี [province.Custom('RoamingGraveVariants')] ไม่มีสิ่งใดบ่งชี้ว่าเหตุใดหลุมศพจึงมีอยู่ ณ ที่นี้ ห่างไกลจากอารยธรรมนัก\n\nแม้จะอยู่ในสถานที่ห่างไกล แต่ก็มีความพยายามอย่างมากในการ ทำให้บริเวณนั้นดูดี เมื่อพิจารณาจากสถานการณ์แล้ว ข้าควรจะ..."
 bp3_roaming.0250.a: "สวดภาวนาอุทิศส่วนกุศล"
 bp3_roaming.0250.b: "ขุดหาของมีค่าใด ๆ ที่พวกเขาซ่อนไว้ในหลุมศพ"

 roaming_grave_variant_cross: "ไม้กางเขนเล็ก ๆ แต่สวยงามปักอยู่บนพื้นดิน"
 roaming_grave_variant_burial_mound: "เนินฝังศพเล็ก ๆ ที่มีหินหลายก้อนวางไว้อย่างระมัดระวังด้านบน"
 roaming_grave_variant_stone: "หินก้อนเล็ก ๆ ที่มีชื่อสลักอยู่"

