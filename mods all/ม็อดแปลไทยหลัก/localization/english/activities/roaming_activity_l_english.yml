l_english: 
 activity_roaming: "การเดินทางไกล"
 activity_roaming_desc: "ออกเดินทางโดยลำพังไปยังมุมเร้นลับของอาณาจักร การผจญภัยนี้เป็นการพักผ่อนจากความกดดันของวิถีชีวิตในราชสำนัก เปิดโอกาสให้ท่านได้พักผ่อนท่ามกลางป่าเก่าแก่และทิวเขาเตี้ย ๆ"
 activity_roaming_host_desc: "$BULLET_WITH_TAB$[opinion_i|E][opinion|E]\n$BULLET_WITH_TAB$[stress_loss_i|E][stress_loss|E]\n$BULLET_WITH_TAB$[prestige_experience_i|E][prestige_experience|E]\n$BULLET_WITH_TAB$อาจได้รับ [trait|E] [GetTrait('lifestyle_mystic').GetName( GetNullCharacter )] หรือ [trait_level_track_xp|E]"
 activity_roaming_guest_desc: ""
 activity_roaming_conclusion_desc: "การเดินทางครั้งนี้มอบโอกาสอันยอดเยี่ยมในการละวางภาระการปกครองลงชั่วขณะ และโอบรับการพักผ่อนจากความกดดันที่เกี่ยวข้อง"
 activity_roaming_selection_tooltip: "ออกเดินทาง ละวางภาระการปกครองลงชั่วครู่\n\nผลตอบแทนที่คาดหวัง:\n$activity_roaming_host_desc$"
 activity_roaming_destination_selection: "[terrain|E] ที่ห่างไกลยิ่งขึ้น จะเพิ่ม [prestige_experience|E] และ [stress_loss|E] ที่ได้รับจาก [activity|E] นี้"
 honorary_guest_traveling_companion_for_host: "$honorary_guest_traveling_companion$"
 honorary_guest_traveling_companion_desc_for_host: ""
 honorary_guest_traveling_companion: "สหายร่วมเดินทาง"
 activity_roaming_guest_help_text: "[activity_guest|E] จะได้รับโอกาสลด [stress|E] และได้รับ [prestige_experience|E]"
 phase_roaming: "กำลังเดินทางไกล"
 phase_roaming_desc: ""
 activity_roaming_predicted_cost: "ค่าใช้จ่ายของ [hike|E] ได้รับผลกระทบหลักจากระยะเวลา การเดินทางไกลที่นานขึ้นจะมีโอกาสมากขึ้น แต่ก็จะเสียค่าใช้จ่ายมากขึ้น เช่นกัน"
 hike_province_requirement_landless: "[adventurers|E] และ [characters|E] ที่ไม่มี [domain|E] สามารถ [hike_i][hike|E] ได้เฉพาะใน [barony|E] ที่ตนอยู่หรือบารอนีข้างเคียงเท่านั้น"
 hike_province_requirement_landed: "ท่านสามารถ [hike_i][hike|E] ได้เฉพาะภายใน [realm|E] ของท่านเท่านั้น"

 roaming_option_travel_length: "ระยะเวลาเดินทาง"
 roaming_short_length: "การเดินทางไกลระยะสั้น"
 roaming_short_length_desc: "$EFFECT_LIST_BULLET$ [activity|E] จะสั้นลง และมีโอกาสน้อยลง\n\n#weak การเดินทางสั้น ๆ ออกห่างจากราชสำนักและเหล่าขุนนางจะช่วยขจัดความสงสัยทั้งหมดในใจข้าได้#!"
 roaming_long_length: "การเดินทางไกลระยะยาว"
 roaming_long_length_desc: "$EFFECT_LIST_BULLET$ [activity|E] จะยาวนานขึ้น และมอบโอกาสมากขึ้น\n\n#weak ข้าต้องการการเดินทางอันยาวนานเพื่อหลีกหนีจากทุกสิ่ง ช่วงเวลาที่จะได้อยู่กับตนเองอย่างแท้จริง#!"

 roaming_befriend_intent: "ผูกมิตร"
 roaming_befriend_intent_desc: "ท่านแสวงหาโอกาสที่จะได้รับ [opinion|E] จากสหายร่วมเดินทางของท่าน อย่าลืมพาใครสักคนไปด้วย!"

 roaming_mystic_intent: "นักพรต"
 roaming_mystic_intent_desc: "ท่านปรารถนาช่วงเวลาที่จะได้อยู่ตามลำพังกับความคิดของตนเอง มีโอกาสสูงขึ้นที่จะได้รับ [trait_level_track_xp|E]"

 roaming_storyteller_intent: "นักเล่าเรื่อง"
 roaming_storyteller_intent_desc: "ท่านมองหาช่วงเวลาที่จะกลายเป็นเรื่องเล่าที่ดีและน่าจดจำ! จะเพิ่ม [prestige_experience|E] ที่ได้รับจากกิจกรรม"

 activity_roaming_province_desc: "ท่านเดินทางไปยัง [ROOT.Province.GetName]"
 activity_roaming_astronomical_phenomenon: "\n#P ++ ปรากฏการณ์ทางดาราศาสตร์#!"
 activity_roaming_good_terrain: "\n#P ++ [ROOT.Province.GetTerrain.GetNameNoTooltip]#! ([terrain|E])"
 activity_roaming_ok_terrain: "\n#P + [ROOT.Province.GetTerrain.GetNameNoTooltip]#! ([terrain|E])"
 activity_roaming_empty_holding: "\n#P + ไม่มีสิ่งปลูกสร้าง#! "

 no_holding_roaming: "[ThisLocation.GetTerrain.GetNameNoTooltip] แห่ง [ThisLocation.GetNameNoTooltip]"
 no_holding_roaming_tooltip: "[ThisLocation.GetTerrain.GetNameNoTooltip] แห่ง [ThisLocation.GetName]"
 holding_roaming: "[ThisLocation.Custom('GetTerrainTypePlural')] รอบ [ThisLocation.GetNameNoTooltip]"
 holding_roaming_tooltip: "[ThisLocation.Custom('GetTerrainTypePlural')] รอบ [ThisLocation.GetName]"

 roaming_fame_reward_tt: "[GetPerk('roaming_perk').GetName( GetNullCharacter )] [perk|E]: ท่านได้รับ #P [fame_value|0]#! [prestige_experience|E]"

 ### Events
 # Arrival Event
 roaming_intro_terrain_snippet_forest: "หมู่ไม้สูงตระหง่าน แสงตะวันสาดส่องเล่นลายบนพื้นดินปกคลุมด้วยมอส กลิ่นหอมสดชื่นของธรรมชาติอบอวลอยู่ในอากาศ"
 roaming_intro_terrain_snippet_forest_2: "เสียงนกขับขานจากยอดไม้สูง และสรรพสัตว์เคลื่อนไหวผ่านพงหญ้าเบื้องล่าง"
 roaming_intro_terrain_snippet_forest_winter: "ภูมิประเทศอันสงบเงียบที่หมู่ไม้ยืนต้นดุจทหารยามผู้ทรหด มีเพียงเสียงย่ำหิมะอันแผ่วเบาที่ทำลายความเงียบเป็นครั้งคราว"
 roaming_intro_terrain_snippet_forest_winter_2: "ผืนป่าอันเงียบสงัดที่พื้นดินถูกปกคลุมอย่างนุ่มนวลด้วยหิมะแห่งเหมันต์ และหมู่ไม้ประดับประดาด้วยเกล็ดหิมะ"
 roaming_intro_terrain_snippet_forest_monsoon: "เสียงฝนตกกระทบใบไม้เป็นจังหวะดังอยู่รอบตัวเรา หยาดฝนหนักหน่วงร่วงหล่นจากยอดไม้"

 roaming_intro_terrain_snippet_mountain: "ข้าเงยหน้ามองภูเขาสูงตระหง่านรอบตัวเรา ยอดผาเสียดฟ้าดูราวกับจะเอื้อมแตะสรวงสวรรค์"
 roaming_intro_terrain_snippet_mountain_2: "ทิวทัศน์อันน่าทึ่งปรากฏอยู่เบื้องหน้า ทั้งสัตว์และผู้คนดูเล็กเกินกว่าจะมองเห็นได้ แต่ไกล"
 roaming_intro_terrain_snippet_mountain_winter: "ยอดเขาถูกปกคลุมด้วยผ้าห่มแห่งหิมะ บรรยากาศคมชัดและเหน็บหนาวด้วยเหมันต์"
 roaming_intro_terrain_snippet_mountain_monsoon: "แม่น้ำและน้ำตกน้อยใหญ่ไหลหลั่งลงตามไหล่เขา เปลี่ยนหุบเขาเบื้องล่างให้กลายเป็นสวรรค์อันเขียวชอุ่มแห่งชีวิต"

 roaming_intro_terrain_snippet_hills: "เนินเขาทอดยาวดุจทะเลสีเขียวและน้ำตาลเบื้องหน้าเรา"
 roaming_intro_terrain_snippet_hills_2: "ข้ามองเห็นยอดเนินน้อยใหญ่ลูกแล้วลูกเล่า แต่ละลูกเปรียบเสมือนเป้าหมายเล็ก ๆ ที่จะพิชิตในวันต่อไป"
 roaming_intro_terrain_snippet_hills_winter: "เนินเขาประดับด้วยน้ำค้างแข็งและหิมะอันละเอียดอ่อน ทอดยาวไปสุดสายตา"
 roaming_intro_terrain_snippet_hills_winter_2: "เนินเขาถูกปกคลุมด้วยสีขาวแห่งความหนาวเย็น ในหุบเขาเหล่านี้มีความเงียบสงัด มีเพียงเสียงย่ำหิมะอันแผ่วเบาใต้ฝ่าเท้าข้าเป็นครั้งคราว"
 roaming_intro_terrain_snippet_hills_monsoon: "สายฝนเซาะร่องธารน้ำเล็ก ๆ ลงตามไหล่เขา เป็นภาพที่คงอยู่ชั่วครู่ แต่ก็น่าชม"

 roaming_intro_terrain_snippet_plains: "ขอบฟ้าไร้เขตแดนใต้ผืนฟ้ากว้างใหญ่ หญ้าลู่ลมก่อเกิดเป็นทะเลสีเขียวอันนุ่มนวล"
 roaming_intro_terrain_snippet_plains_2: "ที่ราบอันไร้สิ้นสุด มีฝูงสัตว์เล็มหญ้าอย่างสงบเป็นครั้งคราว แต่ไกล"
 roaming_intro_terrain_snippet_plains_winter: "ลมหนาวพัดกรูเกรียวและหิมะปกคลุมแผ่นดิน สุดลูกหูลูกตา"
 roaming_intro_terrain_snippet_plains_winter_2: "ความนิ่งสงัดแห่งเหมันต์ได้ห่อหุ้มแผ่นดิน มีเพียงสัตว์พเนจรที่มองหาอาหารขัดจังหวะเป็นครั้งคราว"
 roaming_intro_terrain_snippet_plains_monsoon: "ที่ราบเต็มไปด้วยโคลนชุ่มฉ่ำด้วยสายฝนอันหนักหน่วงสุดลูกหูลูกตา"

 roaming_intro_terrain_snippet_farmlands: "แนวพืชผลทอดยาวสุดลูกหูลูกตา ชาวนาหรือทาสติดที่ดินกำลังทำงานกลางแดด"
 roaming_intro_terrain_snippet_farmlands_2: "ชาวนาดูแลผืนนาขณะที่ฝูงสัตว์เล็มหญ้าอย่างเงียบ ๆ ในทุ่งสีเขียว"
 roaming_intro_terrain_snippet_farmlands_winter: "ผืนนาว่างเปล่าถูกปกคลุมด้วยความหนาวเย็นและเหมันต์ ไม่เห็นชาวนาหรือสัตว์สักตัว"
 roaming_intro_terrain_snippet_farmlands_winter_2: "ทุ่งนาว่างเปล่าที่ปกคลุมด้วยน้ำค้างแข็งและความหนาวเย็นเป็นเครื่องเตือนใจถึงช่วงเวลาของปี"
 roaming_intro_terrain_snippet_farmlands_monsoon: "ทุ่งนาเต็มไปด้วยชีวิตชีวาในช่วงฝนตกหนัก ชาวนาท้องถิ่นใช้ประโยชน์สูงสุดจากสถานการณ์"

 roaming_intro_terrain_snippet_desert: "ผืนทรายสีทองกว้างใหญ่ทอดยาวสุดลูกหูลูกตาเบื้องหน้าข้า ดวงตะวันลอยต่ำอยู่บนท้องฟ้า"
 roaming_intro_terrain_snippet_desert_2: "ผืนทรายสีทองแผ่กว้างไปทุกทิศทางสุดลูกหูลูกตา เงียบสงัดและโหดร้าย"
 roaming_intro_terrain_snippet_desert_monsoon: "ผืนทรายยอมจำนนต่อสายฝนอันหนักหน่วงชั่วครู่ และชั่วขณะหนึ่งก็มีชีวิตชีวาให้เห็นในสภาพแวดล้อมที่ปกติแห้งแล้งนี้"

 roaming_intro_terrain_snippet_desert_mountains: "ยอดเขาขรุขระผงาดขึ้นสู่ท้องฟ้า ดุจทหารยามผู้เงียบงันแห่งดินแดนแห้งแล้งนี้"
 roaming_intro_terrain_snippet_desert_mountains_2: "หุบเขาซ่อนเร้นระหว่างภูเขาใหญ่ มีโอเอซิสเล็ก ๆ มอบการพักผ่อนชั่วขณะแก่นักเดินทางผู้เหนื่อยล้า"
 roaming_intro_terrain_snippet_desert_mountains_monsoon: "ลำธารน้ำเซาะเส้นทางใหม่ผ่านไหล่เขาระหว่างฝนตก ทำให้ภูมิทัศน์นุ่มนวลลงชั่วขณะ"

 roaming_intro_terrain_snippet_oasis: "ต้นปาล์มไหวเอนอย่างนุ่มนวลรอบโอเอซิสเล็ก ๆ มีฝูงสัตว์ดื่มน้ำอย่างเงียบ ๆ"
 roaming_intro_terrain_snippet_oasis_2: "พืชพรรณเขียวชอุ่มล้อมรอบน้ำใสของโอเอซิสเล็ก ๆ มอบการพักผ่อนแก่กลุ่มนักเดินทาง"
 roaming_intro_terrain_snippet_oasis_monsoon: "โอเอซิสและบริเวณโดยรอบกำลังเจริญงอกงามภายใต้สายฝนอันหนักหน่วง พืชพรรณเขียวชอุ่มแผ่ขยายไปไกลเกินขอบเขตปกติของโอเอซิส"

 roaming_intro_terrain_snippet_wetlands: "พื้นที่ชุ่มน้ำสุดลูกหูลูกตา มีกลุ่มคนกลุ่มเล็ก ๆ ใช้ทางน้ำเล็ก ๆ อย่างระมัดระวังขณะเคลื่อนที่ไป"
 roaming_intro_terrain_snippet_wetlands_2: "ผืนน้ำสะท้อนท้องฟ้า และกอหญ้าไหวเอนช้า ๆ ตามสายลม มีเสียงแมลงหึ่ง ๆ และเสียงร้องของสัตว์อยู่ตลอดเวลา"
 roaming_intro_terrain_snippet_wetlands_monsoon: "พื้นที่ชุ่มน้ำได้เปลี่ยนไป ด้วยระดับน้ำที่เพิ่มสูงขึ้น การเคลื่อนที่ผ่านบริเวณนี้แทบจะเป็นไปไม่ได้ ขณะที่ข้าครุ่นคิดว่าจะข้ามภูมิประเทศนี้อย่างไร ข้าก็เห็นชายคนหนึ่งค่อย ๆ ลุยน้ำ ระดับน้ำสูงถึงอก"

 roaming_intro_second_half_generic: "ในที่สุด ข้าก็สามารถทิ้งความยากลำบากที่ผ่านมาไว้เบื้องหลัง และเพียงมุ่งหาช่วงเวลาผ่อนคลาย—โอกาสที่จะวางทุกสิ่งลงและพักผ่อนอย่างแท้จริง"
 roaming_intro_second_half_winter: "ข้าหวังว่านี่จะเป็นช่วงเวลาผ่อนคลายจากความเครียดในราชสำนัก แต่... มันหนาวกว่าที่ข้าคิดไว้"
 roaming_intro_second_half_monsoon: "เมื่อมรสุมมาถึง บางทีนี่อาจเป็นเวลาที่ไม่เหมาะสมนักที่จะละทิ้งความยากลำบากของชนชั้นสูง ข้าออกจะคิดถึงการอยู่ในร่มอยู่บ้างในตอนนี้"

 bp3_roaming.0005.t: "การมาถึง"
 bp3_roaming.0005.desc: "ในที่สุดข้าพเจ้าและคณะผู้ติดตามก็มาถึง [province.GetName] และเพียงชั่วขณะ ข้าพเจ้าก็ตกอยู่ในภวังค์ด้วยทิวทัศน์เบื้องหน้า [province.Custom('RoamingIntroTerrainSnippet')]\n\n[province.Custom('RoamingIntroSecondHalf')]"
 bp3_roaming.0005.a: "อา ในที่สุด ก็สงบเสียที"
 bp3_roaming.0005.b: "ช่างเป็นทิวทัศน์ที่งดงาม!"
 bp3_roaming.0005.c: "หวังว่าข้าจะเตรียมเสื้อผ้ามาพอ..."
 bp3_roaming.0005.d: "ช่างเป็นเวลาที่..."

 roaming_start_of_the_journey_key_title: "จุดเริ่มต้นของการเดินทาง"
 roaming_start_of_the_journey_key: "[root_scope.GetShortUIName|U] เริ่มต้นการเดินทางของ [root_scope.GetHerHis] ผ่าน [activity.GetCurrentPhase.GetLocation.Custom('HoldingNoHoldingTerrainRoaming')]"

 # Outro Event
 roaming_outro_snippet_stress_loss_weak: "ดินแดนเหล่านี้ช่วยปลอบประโลมจิตใจที่เหนื่อยล้าของข้า แม้จะเพียงเล็กน้อย เป็นการพักผ่อนอันอ่อนโยนจากความวุ่นวายของชีวิต"
 roaming_outro_snippet_stress_loss_weak_2: "ในสวรรค์แห่งนี้ ข้าได้พบช่วงเวลาแห่งความสงบอยู่บ้าง ทำให้จิตใจข้าเบาลงเล็กน้อย"
 roaming_outro_snippet_stress_loss_weak_3: "สถานที่นี้มอบการหลีกหนีจากหน้าที่ของข้าชั่วครู่ เป็นความสบายพอประมาณ แต่ก็ยังเป็นความสบาย"

 roaming_outro_snippet_stress_loss_medium: "ข้ารู้สึกเหมือนภาระหนักอึ้งถูกยกออกจากบ่า"
 roaming_outro_snippet_stress_loss_medium_2: "ที่นี่ โอบล้อมด้วยธรรมชาติและห่างไกลจากผู้คน ปัญหาของข้าดูน่ากลัวน้อยลง"
 roaming_outro_snippet_stress_loss_medium_3: "รู้สึกเหมือนความสงบเข้ามาครอบงำข้า และปัญหาปกติของข้าก็ดูเหมือนเป็นเพียงเงาของสิ่งที่เคยเป็น อย่างน้อยก็ในตอนนี้"

 roaming_outro_snippet_stress_loss_strong: "ข้ารู้สึกกระปรี้กระเปร่า ราวกับได้สลัดเสื้อคลุมหนักอึ้งแห่งความกังวลและความห่วงใยทิ้งไป"
 roaming_outro_snippet_stress_loss_strong_2: "ข้าจากดินแดนเหล่านี้ไปด้วยความรู้สึกสดชื่นอย่างลึกซึ้ง จิตใจปลอดโปร่งและหัวใจเบาสบายขึ้น"
 roaming_outro_snippet_stress_loss_strong_3: "ความเครียดที่เคยรู้สึกท่วมท้น บัดนี้ดูห่างไกล ราวกับเมฆดำที่ถูกแสงตะวันแยกออก"

 roaming_outro_snippet_stress_loss_very_strong: "เมื่อถูกทิ้งให้อยู่ตามลำพังในถิ่นทุรกันดาร ข้าได้พบความกระจ่างและความเข้าใจที่ลึกซึ้งยิ่งขึ้นเกี่ยวกับเส้นทางของข้า"
 roaming_outro_snippet_stress_loss_very_strong_2: "ความเครียดมลายหายไป และข้ารู้สึกเหมือนได้พบความหมายใหม่ในชีวิต"
 roaming_outro_snippet_stress_loss_very_strong_3: "ในสถานที่อันเงียบสงบนี้ ข้าสามารถวางความกังวลทั้งหมดลงได้ และกลับไปเป็น [ROOT.Char.GetWomanMan] ที่กระปรี้กระเปร่าและเปลี่ยนไป"

 roaming_outro_snippet_returning_home: "ข้าหันหลังกลับ ถอนหายใจเบา ๆ กับตนเอง แล้วเริ่มเดินทางกลับ"
 roaming_outro_snippet_returning_home_2: "อย่างไม่เต็มใจ ข้าหันหลังกลับ วางความทรงจำลง และเริ่มมุ่งหน้ากลับบ้านสู่หน้าที่ที่รอคอยข้าอยู่แน่นอน"
 roaming_outro_snippet_returning_home_3: "ข้าสูดหายใจลึก ดื่มด่ำกับช่วงเวลาสุดท้ายในสวรรค์แห่งนี้ ก่อนออกเดินทางกลับบ้าน"
 roaming_outro_snippet_returning_home_4: "ด้วยหัวใจที่สงบกว่าที่เป็นมาพักหนึ่ง ในที่สุดข้าก็อำลาสถานที่แห่งนี้ ถึงเวลามุ่งหน้ากลับบ้านแล้ว"

 bp3_roaming.0010.t: "การเดินทางกลับบ้าน"
 bp3_roaming.0010.desc: "ด้วยก้าวสุดท้าย ในที่สุดข้าก็ออกจาก [province.Custom('HoldingNoHoldingTerrainRoaming')] ข้ามองย้อนกลับไปเป็นครั้งสุดท้าย รำลึกถึงการเดินทางของข้าผ่าน [province.GetTerrain.GetNameNoTooltip|l] [ROOT.Char.Custom('RoamingOutroStressLoss')]\n\n[ROOT.Char.Custom('RoamingOutroReturningHome')]"
 bp3_roaming.0010.a: "อนิจจา นี่คือวิถีแห่งชีวิต..."

 roaming_end_of_the_journey_key_title: "จุดสิ้นสุดของการเดินทาง"
 roaming_end_of_the_journey_key: "[host.GetShortUIName|U] สิ้นสุดการเดินทางของ [host.GetHerHis] ผ่าน [activity.GetCurrentPhase.GetLocation.Custom('HoldingNoHoldingTerrainRoaming')]"

 ### Mid-Activity Events
 bp3_roaming.0050.t: "ทิวทัศน์อันน่าทึ่ง"
 bp3_roaming.0050.desc: "พวกเราเดินขึ้นทางลาดชันต่อไปอย่างช้า ๆ ทีละก้าว เป็นวันที่ยาวนาน และข้ารู้สึกได้ถึงต้นขาที่ปวดแสบปวดร้อน ตอนนี้ข้าพยายามเพียงแค่จดจ่อกับการก้าวเท้าไปข้างหน้าเท่านั้น เมื่อทหารองครักษ์คนหนึ่งช่วยพยุงข้าในสองสามก้าวสุดท้าย\n\nทันใดนั้น พวกเราก็พบว่าตนเองอยู่บนชะง่อนผา และข้ามองเห็นหุบเขาที่ทอดยาวเบื้องล่าง เป็นดุจภาพปักอันงดงามสีเขียวและน้ำตาล ข้าไม่ทันสังเกตเลยว่าเราขึ้นมาสูงเพียงใด เนื่องจากความเหนื่อยล้าและความยากลำบากของการเดินทาง แต่ตอนนี้... ตอนนี้ทุกอย่างคุ้มค่าแล้ว"
 bp3_roaming.0050.a: "ช่างเป็นภาพที่งดงามสำหรับดวงตาและขาที่เมื่อยล้า"

 breathtaking_view_key_title: "$bp3_roaming.0050.t$"
 breathtaking_view_key: "[host.GetShortUIName] ขึ้นมาถึงจุดสูงสุดของ [province.GetName] ซึ่งเผยให้เห็นทิวทัศน์อันงดงาม และตัดสินใจว่าถึงเวลาเริ่มเดินทางกลับบ้านแล้ว"

 bp3_roaming.0060.t: "โอเอซิสเล็ก ๆ"
 bp3_roaming.0060.desc: "หลังจากเดินฝ่าดินแดนรกร้างสีทองมาหลายชั่วโมง พวกเราก็เริ่มเห็นสัญญาณของโอเอซิสอยู่ แต่ไกล ตอนแรกข้ากังวลว่าอาจเป็นภาพลวงตา แต่เมื่อเราเข้าใกล้ขึ้น เราก็เห็นสัตว์บางตัวกำลังเล็มหญ้าอยู่รอบ ๆ\n\nข้าหาที่เล็ก ๆ ในร่มเงา ที่ ซึ่งองครักษ์ของข้าและข้าจะได้พักเท้าเสียที เป็นที่พักผ่อน สำหรับตอนนี้ เป็นจุดพักที่สมบูรณ์แบบก่อนที่เราจะเริ่มหาทางกลับบ้าน"
 bp3_roaming.0060.a: "ช่างเป็นสถานที่เล็ก ๆ ที่สวยงามในถิ่นทุรกันดารนี้"

 the_oasis_key_title: "$bp3_roaming.0060.t$"
 the_oasis_key: "[host.GetShortUIName] พบโอเอซิสเล็ก ๆ อันเงียบสงบใน [province.GetName] ที่ ซึ่ง [host.GetSheHe] ได้พักผ่อนก่อนจะเริ่มหาทางกลับบ้าน"

 bp3_roaming.0070.t: "สุดเส้นทาง"
 bp3_roaming.0070.desc.intro: "พวกเราเดินตามเส้นทางเก่าแก่ผ่านป่ามาหลายชั่วโมง ก่อนที่มันจะค่อย ๆ จางลงและหายไปในที่สุด เมื่อมองไปรอบ ๆ ข้าพบว่าตนเองอยู่ในที่โล่งเล็ก ๆ และไม่มีอะไรที่นี่เลย มีเพียง... ความเงียบสงัดของถิ่นทุรกันดาร\n\n"
 bp3_roaming.0070.desc.landless: "ข้าคุ้นเคยกับชีวิตในป่าอยู่บ้าง แต่ตอนนี้กลับรู้สึกเหมือนว่าเราได้ข้ามพรมแดนระหว่างดินแดนมนุษย์และสิ่งที่ไม่รู้จัก ถึงเวลาทิ้งที่โล่งเล็ก ๆ นี้ไว้เบื้องหลัง และเดินทางกลับค่ายพัก ข้าสงสัยว่าจะได้เห็นมันอีกหรือไม่"
 bp3_roaming.0070.desc.landed: "การมาอยู่ที่นี่รู้สึกห่างไกลจากชีวิตของข้าใน [ROOT.Char.GetCapitalLocation.GetTitle.GetNameNoTier] อยู่แล้ว แต่ตอนนี้กลับรู้สึกเหมือนว่าเราได้ข้ามพรมแดนระหว่างดินแดนมนุษย์และสิ่งที่ไม่รู้จัก ถึงเวลาทิ้งที่โล่งเล็ก ๆ นี้ไว้เบื้องหลัง และเริ่มเดินกลับบ้าน ข้าสงสัยว่าจะได้เห็นมันอีกหรือไม่"
 bp3_roaming.0070.a: "ช่างเป็นสถานที่ที่น่าสงสัย"

 paths_end_key_title: "$bp3_roaming.0070.t$"
 paths_end_key: "[host.GetShortUIName] พบที่โล่งในป่าเล็ก ๆ อันน่าสงสัยในถิ่นทุรกันดารของ [province.GetName] ที่ ซึ่ง [host.GetSheHe] ใช้เวลาพักผ่อนครู่หนึ่งก่อนจะเริ่มเดินทางกลับบ้าน"

 bp3_roaming.0080.t: "กลิ่นอายทะเล"
 bp3_roaming.0080.desc: "ก่อนที่เราจะเห็นทะเลนานนัก เราได้ยินเสียงนกนางนวลร้องอยู่เหนือศีรษะและสังเกตเห็นกลิ่นเค็มอบอวลอยู่ในอากาศ แล้วมันก็เปิดออกเบื้องหน้าเรา ทะเลสีครามกว้างใหญ่ทอดยาวสุดลูกหูลูกตา เรานั่งลงริมน้ำ มองดูคลื่นซัดเข้าหาฝั่งอย่างนุ่มนวล\n\nชั่วขณะหนึ่ง รู้สึกเหมือนความกังวลทั้งหมดของข้าถูกปัดเป่าไป เป็นช่วงเวลาที่ข้าสามารถเพลิดเพลินกับประสบการณ์นี้ได้ ข้ารู้ว่าข้าจะต้องกลับบ้านในไม่ช้า แต่สำหรับตอนนี้ ข้าอยู่ที่นี่"
 bp3_roaming.0080.a: "ช่างเป็นชีวิตที่เงียบสงบ"

 ocean_scent_key_title: "$bp3_roaming.0080.t$"
 ocean_scent_key: "[host.GetShortUIName] นำกลุ่มของ [host.GetHerHis] ไปยังชายฝั่งใน [province.GetName] ที่ ซึ่งพวกเขาพักผ่อนก่อนเริ่มการเดินทางอันยาวไกลกลับบ้าน"

 bp3_roaming.0090.t: "แม่น้ำ ณ ปลายทาง"
 bp3_roaming.0090.desc: "ใกล้จะค่ำแล้ว เมื่อในที่สุดเราก็มาถึงแม่น้ำสายเล็ก ๆ ที่ไม่มีสะพานให้เห็น ข้ามองสุดสายตา แต่ไม่เห็นสิ่งใดอยู่อีกฝั่ง ในบางแง่มุม มันรู้สึกเหมือนเป็นพรมแดนระหว่างร่องรอยอารยธรรมสุดท้ายกับถิ่นทุรกันดารที่ไม่รู้จักอีกฝั่งหนึ่ง\n\nข้าใช้เวลาครู่หนึ่งนั่งลงพักเท้า บางครั้งข้ารู้สึกเหมือนเห็นบางสิ่งเคลื่อนไหวอยู่อีกฝั่งของแม่น้ำ หรือเหมือนมีใครบางคนกำลังเฝ้ามองข้า แต่ข้ามองไม่ออกว่าเป็นอะไร"
 bp3_roaming.0090.a: "ข้าว่านี่เป็นจุดพักที่ดี"

 river_journeys_end_key_title: "$bp3_roaming.0090.t$"
 river_journeys_end_key: "[host.GetShortUIName] พบแม่น้ำที่ข้ามไม่ได้ในดินแดนห่างไกลของ [province.GetName] ที่ ซึ่ง [host.GetSheHe] หยุดพักก่อนเริ่มเดินทางกลับบ้าน"

 ### Random Events
 bp3_roaming.0100.t: "การพบคนแปลกหน้า"
 bp3_roaming.0100.desc: "ขณะที่ข้าเดินท่องไปใน [activity.GetCurrentPhase.GetLocation.Custom('GetTerrainType')] ข้าก็พบ [ancient_traveler.GetWomanMan] สูงวัยผู้หนึ่งนั่งอยู่บนโขดหินผุกร่อนริมทาง เวลาผ่านไปในความเงียบขณะที่ [ancient_traveler.GetWomanMan] ดูเหมือนจมอยู่ในภวังค์ความคิด ก่อนที่ [ancient_traveler.GetSheHe] จะรับรู้ถึงการมีอยู่ของข้าในที่สุด\n\n[ancient_traveler.GetSheHe] พยักหน้าให้ข้าเล็กน้อย แล้วค่อย ๆ ลุกขึ้น ทุกการเคลื่อนไหวตามมาด้วยเสียงกระดูกลั่นกรอบแกรบ และมุ่งหน้าสู่ความเวิ้งว้างเบื้องหน้า"
 bp3_roaming.0100.desc.companion: "\n\n[special_guest.GetFirstName] นั่งลงบนโขดหินเก่าแก่ ถอนหายใจออกมาเบา ๆ ด้วยความโล่งอก สนใจที่จะพักผ่อนมากกว่าสนทนากับ [ancient_traveler.GetWomanMan]"
 bp3_roaming.0100.a: "ว่า แต่ [ancient_traveler.GetSheHe] กำลังคิดอะไรอยู่กลางป่าเขานี้กันนะ?"
 bp3_roaming.0100.a.flavor: "ดูเหมือนเป็นสถานที่ที่เหมาะแก่การครุ่นคิดเสียจริง"
 bp3_roaming.0100.b: "ในที่สุด ก็ได้โอกาสนั่งพักเสียที"
 bp3_roaming.0100.c: "เดี๋ยวก่อน ท่านผู้เฒ่า [ancient_traveler.GetWomanMan]!"
 bp3_roaming.0100.c.flavor: "บางที [ancient_traveler.GetSheHe] อาจมีปัญญาบางอย่างจะแบ่งปัน?"
 bp3_roaming.0100.c.win: "ข้าสนทนากับ [ancient_traveler.GetNameNoTooltip] อย่างเกิดผล"
 bp3_roaming.0100.c.neutral: "ข้าพูดคุยจน [ancient_traveler.GetNameNoTooltip] ยอมเข้าร่วมราชสำนักของข้า"
 bp3_roaming.0100.c.loss: "[ancient_traveler.GetNameNoTooltip] ไม่สนใจจะพูดคุย"
 bp3_roaming.0100.d: ""และเมื่อข้าละสายตาไปเพียงครู่เดียว [ancient_traveler.GetSheHe] ก็หายตัวไปอย่างไร้ร่องรอย...""

 roaming_pondering_stone_mystic_key_title: "การหยั่งรู้"
 roaming_pondering_stone_mystic_key: "[host.GetShortUIName] เกิดการหยั่งรู้หลายครั้งขณะที่ [host.GetSheHe] นั่งอยู่ใน [activity.GetCurrentPhase.GetLocation.Custom('HoldingNoHoldingTerrainRoaming')]"

 roaming_pondering_stone_key_title: "ศิลาครุ่นคิด"
 roaming_pondering_stone_key: "[host.GetShortUIName|U] พบโขดหินผุกร่อนอันเงียบสงบ ที่ ซึ่ง [host.GetSheHe] ได้นั่งครุ่นคิดเกี่ยวกับชีวิตของ [host.GetHerHis] ใน [activity.GetCurrentPhase.GetLocation.Custom('HoldingNoHoldingTerrainRoaming')]"

 roaming_resting_stone_key_title: "ศิลาพักผ่อน"
 roaming_resting_stone_key: "[host.GetShortUIName|U] พบโขดหินผุกร่อนอันเงียบสงบเพื่อพักผ่อนใน [activity.GetCurrentPhase.GetLocation.Custom('HoldingNoHoldingTerrainRoaming')]"

 roaming_old_man_key_title: "นักเดินทางโบราณ"
 roaming_old_man_key: "ใน [activity.GetCurrentPhase.GetLocation.Custom('HoldingNoHoldingTerrainRoaming')] [host.GetShortUIName|U] ได้พบนั[ancient_traveler.GetWomanMan] สูงวัยผู้ทรงภูมิ"

 roaming_ancient_traveler_poet_key_title: "นักเดินทางลึกลับ"
 roaming_ancient_traveler_poet_key: "ใน [activity.GetCurrentPhase.GetLocation.Custom('HoldingNoHoldingTerrainRoaming')] [host.GetShortUIName|U] ได้พบ [ancient_traveler.GetWomanMan] ลึกลับ"

 pondering_rulership_modifier: "ครุ่นคิดถึงการปกครอง"
 pondering_rulership_modifier_desc: "ตัวละครนี้ใช้เวลาครุ่นคิดอย่างมากเกี่ยวกับภาระของการปกครอง"
 pondering_religion_modifier: "ครุ่นคิดถึงศาสนา"
 pondering_religion_modifier_desc: "ตัวละครนี้ใช้เวลาครุ่นคิดอย่างมากเกี่ยวกับผลกระทบของศาสนาที่มีต่อชีวิตของตน"
 pondering_war_modifier: "ครุ่นคิดถึงสงคราม"
 pondering_war_modifier_desc: "ตัวละครนี้ใช้เวลาครุ่นคิดอย่างมากเกี่ยวกับสงครามและกลยุทธ์"
 pondering_schemes_modifier: "ครุ่นคิดถึงแผนการ"
 pondering_schemes_modifier_desc: "ตัวละครนี้ใช้เวลาครุ่นคิดอย่างมากเกี่ยวกับแผนการและผู้ที่อาจกำลังวางแผนวางกับดักตน"
 pondering_management_modifier: "ครุ่นคิดถึงการจัดการ"
 pondering_management_modifier_desc: "ตัวละครนี้ใช้เวลาครุ่นคิดอย่างมากเกี่ยวกับวิธีที่ตนจะสามารถปรับปรุงอาณาจักรของตนได้"
 pondering_travel_modifier: "ครุ่นคิดถึงการเดินทาง"
 pondering_travel_modifier_desc: "ตัวละครนี้ใช้เวลาครุ่นคิดอย่างมากเกี่ยวกับการเดินทางของตน"

 bp3_roaming.0110.t: "[sighting_province.GetTitle.GetDeJureLiege.Custom('GetAnimalType')|U] ใน [sighting_province.GetNameNoTooltip]"
 bp3_roaming.0110.desc: "ขณะที่อากาศค่อย ๆ แย่ลง ทันใดนั้นข้าก็เห็นบางสิ่งโผล่ออกมาจากพงหญ้าเบื้องหน้า [sighting_province.GetTitle.GetDeJureLiege.Custom('GetAnimalType')|U] ขนาดใหญ่ผิดคาดหยุดอยู่ห่างจากข้าเพียงไม่กี่ก้าว สายตาของมันจับจ้องมาที่ข้าเมื่อมันสังเกตเห็นการมีอยู่ของข้า\n\nเหตุการณ์นั้นเกิดขึ้นเพียงชั่วครู่ ก่อนที่สัตว์ตัวนั้นจะกระโจนกลับเข้าไปในป่ารกชัฏอย่างรวดเร็ว"
 bp3_roaming.0110.desc.companion: "ข้างกายข้า ข้าได้ยิน [special_guest.GetFirstName] ถอนหายใจอย่างโล่งอก"
 bp3_roaming.0110.a: "บางทีอาจถึงเวลาเตรียมกองกำลังล่าสัตว์แล้ว"
 bp3_roaming.0110.b.weakling: "ฟู่! ข้ากังวลอยู่ครู่หนึ่งเลยทีเดียว"
 bp3_roaming.0110.b.hunter: "ช่างเป็นสิ่งมีชีวิตเล็ก ๆ ที่น่าสนใจเสียจริง!"
 bp3_roaming.0110.c: ""หลังจากการต่อสู้อันดุเดือด สัตว์ร้ายมหึมาตัวนั้นก็หันหลังหนีไป...""

 roaming_animal_sighting_key_title: "การพบเห็นสัตว์"
 roaming_animal_sighting_key: "[host.GetShortUIName] พบสัตว์ป่าขณะเดินทางผ่าน [activity.GetCurrentPhase.GetLocation.Custom('HoldingNoHoldingTerrainRoaming')]"

 roaming_animal_sighting_poet_key_title: "$roaming_animal_sighting_key_title$"
 roaming_animal_sighting_poet_key: "[host.GetShortUIName] ต่อสู้กับสัตว์ป่าใน [activity.GetCurrentPhase.GetLocation.Custom('HoldingNoHoldingTerrainRoaming')]"

 bp3_roaming.0120.t: "[sighting_province.GetTitle.GetDeJureLiege.Custom('GetAnimalType')|U] ในตำนาน"
 bp3_roaming.0120.desc: "ขณะที่ข้าเดินทางฝ่าสภาพอากาศเลวร้าย ทันใดนั้นข้าก็เหลือบเห็นบางสิ่งเคลื่อนไหวอยู่ที่ขอบสายตา ชั่วขณะหนึ่ง อากาศก็ปลอดโปร่งขึ้น และข้าเห็น [sighting_province.GetTitle.GetDeJureLiege.Custom('GetAnimalType')|U] สี [sighting_province.GetTitle.GetDeJureLiege.Custom('GetLegendaryColor')] ทั้งตัว กำลังมองกลับมาที่ข้า\n\nความคิดของข้าพยายามรื้อฟื้นเรื่องเล่าเพียงไม่กี่เรื่องที่ข้าเคยได้ยินเกี่ยวกับสัตว์ในตำนานอันลึกลับ ขณะที่มันยืนอยู่ตรงหน้าข้า แต่เพียงชั่วครู่ที่มันปรากฏตัว มันก็หายวับกลับเข้าไปใน [activity.GetCurrentPhase.GetLocation.Custom('RoamingLegendaryBeastProvinceWeather')] อีกครั้ง"
 bp3_roaming.0120.desc.companion: "$bp3_roaming.0110.desc.companion$"
 bp3_roaming.0120.a: "มันต้องเป็นของข้า!"
 bp3_roaming.0120.b: "ช่างเป็นภาพที่น่าทึ่ง!"
 bp3_roaming.0120.c: ""แล้วสัตว์ร้ายมหึมาตัวนั้นก็พุ่งเข้าใส่ข้า...""

 roaming_legendary_sighting_key_title: "การพบเห็นสัตว์ในตำนาน"
 roaming_legendary_sighting_key: "[host.GetShortUIName] พบสัตว์ในตำนานขณะเดินทางผ่าน [activity.GetCurrentPhase.GetLocation.Custom('HoldingNoHoldingTerrainRoaming')]"

 roaming_legendary_sighting_poet_key_title: "$roaming_legendary_sighting_key_title$"
 roaming_legendary_sighting_poet_key: "[host.GetShortUIName] ถูกสัตว์ในตำนานโจมตีใน [activity.GetCurrentPhase.GetLocation.Custom('HoldingNoHoldingTerrainRoaming')]"

 LegendaryBeastProvinceWeatherSnow: "หิมะ"
 LegendaryBeastProvinceWeatherRain: "สายฝน"
 LegendaryBeastProvinceWeatherFog: "สายหมอก"

 bp3_roaming.0130.t: "สนามรบที่ถูกลืม"
 bp3_roaming.0130.desc: "ข้าได้ยินเสียงนกกินซาก แต่ไกล ก่อนที่จะเห็นด้วยตาตนเอง สนามรบเล็ก ๆ ที่เต็มไปด้วยศพ เห็นได้ชัดว่าถูกทิ้งให้เน่าเปื่อยมาพักหนึ่งแล้ว\n\nฝูงนก ซึ่งมีจะงอยปากเปื้อนเลือด เงยหน้าขึ้นจากอาหารเป็นครั้งคราวขณะที่ข้าเดินผ่านไป"
 bp3_roaming.0130.desc.companion: "[special_guest.GetFirstName] ถึงกับออกอาการคลื่นเหียนเมื่อได้เห็นภาพทั้งปวง และได้หาทาง [special_guest.GetHerHis] ออกจากบริเวณนั้นไป"
 bp3_roaming.0130.a: "ข้าควรสวดภาวนาเล็กน้อยให้แก่ผู้ตาย"
 bp3_roaming.0130.b: "ลองดูซิว่าข้าจะหาของมีค่าอะไรได้บ้าง"
 bp3_roaming.0130.c: ""แล้วข้าก็เห็นคนตายฟื้นคืนชีพขึ้นมาจากพื้นดิน...""

 roaming_battlefield_prayer_key_title: "สนามรบที่ถูกลืม"
 roaming_battlefield_prayer_key: "ใน [activity.GetCurrentPhase.GetLocation.GetNameNoTooltip] [host.GetShortUIName] พบสนามรบที่ถูกลืม ที่ ซึ่ง [host.GetSheHe] ได้สวดภาวนาเล็กน้อยให้แก่ผู้ตาย"

 roaming_battlefield_scavenging_key_title: "$roaming_battlefield_prayer_key_title$"
 roaming_battlefield_scavenging_key: "ใน [activity.GetCurrentPhase.GetLocation.GetNameNoTooltip] [host.GetShortUIName] พบสนามรบที่ถูกลืม ที่ ซึ่ง [host.GetSheHe] ใช้เวลาครู่หนึ่งค้นหาของมีค่า"

 roaming_battlefield_poet_key_title: "$roaming_battlefield_prayer_key_title$"
 roaming_battlefield_poet_key: "ใน [activity.GetCurrentPhase.GetLocation.GetNameNoTooltip] [host.GetShortUIName] พบสนามรบที่ถูกลืม ที่ ซึ่ง [host.GetSheHe] อ้างว่าเห็นคนตายฟื้นคืนชีพ"

 bp3_roaming.0140.t: "ค่ำคืนในป่าดง"
 bp3_roaming.0140.desc: "ความมืดอันเงียบสงัดห่มคลุมค่ายพักขณะที่เราเข้านอนในค่ำคืนนี้ ทหารยามคนหนึ่งยืนเฝ้า แต่ถึงกระนั้นก็หาความสงบไม่ได้ เสียงสัตว์ร้องจ๊อกแจ๊ก คลาน และเคลื่อนไหวในความมืดแทรกความเงียบเป็นระยะ\n\nเบื้องบน ท้องฟ้ายามค่ำคืนเป็นดุจผืนผ้าปักประดับด้วยแสงดาวนับไม่ถ้วน ชั่วขณะหนึ่ง ข้าพยายามเพ่งจิตให้เสียงรบกวนรอบข้างหายไป ขณะจดจ่ออยู่กับภาพนั้น"
 bp3_roaming.0140.desc.companion: "\n\nขณะที่ข้าทำ เช่นนั้น ข้าได้ยินเสียง [special_guest.GetFirstName] กรนเบา ๆ อยู่ใกล้ ๆ ดูเหมือนไม่มีใครคนอื่นกำลังพยายามข่มตาหลับเลย..."
 bp3_roaming.0140.a: "อย่าคิดถึงมันเลย หลับตาแล้วสวดภาวนาเถิด"
 bp3_roaming.0140.b: ""ทหาร! ค้นหาทั่วป่า หาสัตว์ร้ายใด ๆ ไม่ว่าจะเป็นในตำนานหรือธรรมดา!""
 bp3_roaming.0140.b.1: "ท่านใช้เวลาทั้งคืนค้นหาภัยคุกคาม"
 bp3_roaming.0140.b.2: "ท่านขับไล่สิ่งใดก็ตามที่อยู่ข้างนอกไปได้"
 bp3_roaming.0140.b.3: "ท่านเผลอหลับไปขณะรอทหารยามทำงาน"
 bp3_roaming.0140.c: ""ข้ามองเห็นสัตว์ประหลาดตัวเล็ก ๆ เต้นรำอยู่ที่ขอบแสงไฟ...""
 bp3_roaming.0140.d: "เป็นเวลาและสถานที่ที่เหมาะแก่การครุ่นคิดยิ่งนัก"

 roaming_night_scare_key_title: "ค่ำคืนในป่าดง"
