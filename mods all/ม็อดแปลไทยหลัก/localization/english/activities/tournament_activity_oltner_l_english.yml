l_english: 
 tournament_events.9000.t:0 "ทัศนียภาพแห่ง [tournament_province.GetNameNoTooltip]"
 tournament_events.9000.desc:0 "ขณะเดินเล่นบริเวณรอบนอกของการประลอง ข้าตื้นตันใจกับความงามอันบริสุทธิ์ที่รายล้อมข้า ณ ที่แห่งนี้ใน [tournament_province.GetName]\n\nข้าเดินย่ำไปตาม [tournament_province.Custom('TerrainTypeProvince')] ที่ประดับประดาไปด้วยหย่อม [tournament_province.Custom('get_region_flower_type_plural')] ตัดสินใจหยุดเพียงเพื่อสัมผัสเปลือกไม้ของต้น [tournament_province.Custom('GetRandomAppropriateTree')] อันบริสุทธิ์ ข้ามองขึ้นไปเห็นฝูง [ROOT.Char.Custom('GetRandomRegionalWildDaytimeBird')] บินอยู่เหนือข้า\n\n"
 tournament_events.9000.desc_home:0 "ข้าควรทำ เช่นนี้บ่อยขึ้น ที่นี่คือบ้านของข้า"
 tournament_events.9000.desc_not_home:0 "ข้าหวังว่าจะมีโอกาสกลับมาอีกในอนาคต"
 tournament_events.9000.a:0 "อา ช่างผ่อนคลายเสียนี่กระไร!"
 tournament_events.9000.b:0 "สถานที่อันเหมาะเจาะสำหรับการฝึกฝนอย่างสงบ"
 tournament_events.9000.impatient:0 "เรื่องไร้สาระทางอารมณ์! #EMP ข้าต้องฝึกซ้อม!#!"
 
 tournament_events.9001.t:0 "$knight_culture_player_no_tooltip$ ไร้สังกัด"
 tournament_events.9001.desc:0 "ขณะที่ข้ากำลังสำรวจบริเวณนั้น บุคคลในชุดเกราะอย่างดีก็เข้ามาหาข้า\n\n\"[ROOT.Char.GetTitledFirstName] ถือเป็นเกียรติอย่างยิ่ง\" [liegeless_knight.GetWomanMan] ผู้นั้นโค้งคำนับเล็กน้อยและ [liegeless_knight.Custom('quirk_pos_present')] \"ข้าคือ [liegeless_knight.GetFullName] เป็น $knight_culture_player_no_tooltip_lowercase$ ที่กำลังหางานทำ ข้าเป็นคน [liegeless_knight.Custom('FormalComplimentAdjective')], [liegeless_knight.Custom('ComplimentAdjective')], ภักดี และตระกูลของข้าก็แข็งแกร่ง — #EMP [liegeless_knight.GetHouse.GetMotto]!#!\" [liegeless_knight.GetSheHe] ตะโกน และยืนตรงแสดงความเคารพ\n\nเห็นได้ชัดว่าขุนนางผู้นี้กำลังกล่าวเกินจริงถึงคุณธรรมของ [liegeless_knight.GetHerHis] แต่ [liegeless_knight.GetSheHe] ดูมีความสามารถ และสิ้นหวัง"
 tournament_events.9001.a:0 "\"เจ้าอาจเข้าร่วมกอง $knight_culture_player_plural_no_tooltip_lowercase$ ของข้าได้\""
 tournament_events.9001.b:0 ""ข้าจะให้รางวัลเจ้าอย่างงามหากเจ้าสาบานความภักดีต่อข้า!""
 tournament_events.9001.c:0 ""ไปให้พ้น ข้าแทบไม่ไว้ใจเจ้า""
 tournament_events.9001.d:0 ""ข้ามีอะไรมากมายให้เรียนรู้จากเจ้า!""
 
 tournament_events.9002.t:0 "การแสดงของ[strongman_1.GetWomanMan] แข็งแกร่ง"
 tournament_events.9002.desc:0 "เสียงอึกทึกครึกโครม ทำให้ข้าค้นพบลานประลองชั่วคราวที่จัดขึ้นโดยเหล่าไพร่ในท้องถิ่น ซึ่งนักมวยปล้ำร่างกำยำสองคนกำลังแสดงอยู่ พวกเขาแลกหมัด หลบหลีก และวนเวียนเข้าหากัน — จนกระทั่งคนหนึ่งเคลื่อนไหวอย่างกล้าหาญ:\n\n"ข้าเรียกท่านี้ว่า #EMP [strongman_1.Custom('GetDescriptorManeuver')] [strongman_1.Custom('GetManeuver')]!#!" [strongman_1.GetSheHe] กรีดร้องก่อนที่จะยกคู่ต่อสู้ของ [strongman_1.GetHerHis] ขึ้นและทุ่ม [strongman_1.GetHerHim] ลงกับพื้น — ทำให้ [strongman_2.GetHerHim] ยอมแพ้ทันที "[strongman_1.GetFirstName] ผู้ [strongman_1.Custom('ComplimentAdjective')|U] และ [strongman_1.Custom('RandomPositiveLookAdjective')|U] ได้รับชัยชนะอีกครั้ง!" ผู้ชนะโอ้อวด"
 tournament_events.9002.whole_of_body:0 "ช่างผ่อนคลายเหลือเกินที่ได้ชมเทคนิคระดับมืออาชีพ!"
 tournament_events.9002.a:0 "วู้! ช่างน่าตื่นเต้นเสียนี่กระไร!"
 tournament_events.9002.b:0 "หืม ข้าควรศึกษาเทคนิคของพวกเขา..."
 tournament_events.9002.c:0 "เจ้า ผู้ชนะ — นี่เหรียญเล็กน้อย!"
 tournament_events.9002.b.success:0 "ท่านได้รับแรงบันดาลใจจากนักมวยปล้ำ"
 tournament_events.9002.b.failure:0 "ท่านล้มเหลวในการเรียนรู้สิ่งใด"
 
 tournament_events.9003.t:0 "การเดินเล่นอันเป็นมงคล"
 tournament_events.9003.desc:0 "เพื่อหลบหนีจากเสียงพูดคุยและเสียงดังของลานประลอง ข้าบังเอิญพบเส้นทางเล็กๆ ที่ซ่อนอยู่ระหว่างต้น [tournament_province.Custom('GetRandomRegionalWood')] บางต้น ขณะเดินไปตาม [tournament_province.Custom('GetProvinceFoliageDesc')] ข้าเห็นแปลง [tournament_province.Custom('get_region_flower_type_plural')] ที่สวยงามเรียงราย\n\n"
 tournament_events.9003.friend:0 "ทันใดนั้นข้าก็เห็น [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('intent_target_character'))] ของข้า [intent_target_character.GetFirstName] กำลังเดินเข้ามาจากอีกทาง โชคเข้าข้างข้าแล้ว! ข้าอยากพบกับ [intent_target_character.GetHerHim] ตามลำพังมาสักพักแล้ว บางทีข้าอาจจะชวนคุยได้?"
 tournament_events.9003.lover:0 "ขณะที่ข้ามองขึ้นมาจากความสันโดษ ข้าก็เห็นดอกไม้ที่สวยงามที่สุดในบรรดาดอกไม้ทั้งปวง [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('intent_target_character'))] ของข้า [intent_target_character.GetFirstName] ผู้เป็นเป้าหมายในฝันของข้า ได้พบเส้นทางเดียวกับข้า!"
 tournament_events.9003.a:0 "เราเดินผ่านกันไปในความเงียบ"
 tournament_events.9003.b:0 "สถานที่อันเหมาะเจาะสำหรับการฝึกฝนอย่างสงบ"
 tournament_events.9003.lover_attempt:0 ""เจ้างดงามยิ่งกว่าดอกไม้ใดๆ เหล่านี้""
 tournament_events.9003.lover_attempt.critical_success:0 "[intent_target_character.GetSheHe|U] ตกหลุมรักท่านอย่างหัวปักหัวปำ"
 tournament_events.9003.lover_attempt.success:0 "[intent_target_character.GetSheHe|U] พบว่าท่าทางนี้โรแมนติกมาก"
 tournament_events.9003.lover_attempt.minor_success:0 "[intent_target_character.GetSheHe|U] พบว่าท่าทางนี้น่ารัก"
 tournament_events.9003.lover_attempt.fail:0 "[intent_target_character.GetSheHe|U] สับสนอย่างสิ้นเชิง"
 tournament_events.9003.friend_attempt:0 ""การเดินคนเดียวน่าเบื่อ มาคุยเรื่อง [intent_target_character.Custom('MatchingConversationSubject')] กันเถอะ?""
 tournament_events.9003.friend_attempt.critical_success:0 "[intent_target_character.GetSheHe|U] เพลิดเพลินกับการอยู่กับท่านมาก"
 tournament_events.9003.friend_attempt.success:0 "[intent_target_character.GetSheHe|U] รู้สึกขบขันกับการสนทนา"
 tournament_events.9003.friend_attempt.failure:0 "[intent_target_character.GetSheHe|U] หลบหนีไปอย่างเงียบๆ..."
 
 tournament_events.9004.t:0 "ความบันเทิงขนนก"
 tournament_events.9004.desc:0 ""ไปเลย #EMP [falconer_1.Custom('GetBirdName')|U]#! ไปเร็วเข้า!" ข้าได้ยินเสียง [falconer_1.GetWomanMan] ก้องไปทั่วลาน ข้ามองขึ้นไปเห็นสิ่งเล็กๆ กำลังเคลื่อนที่ผ่านท้องฟ้าอย่างรวดเร็วราวกับสายฟ้าสีดำ ไม่นานมันก็โฉบลงมายังเส้นชัย\n\n"บ้าเอ๊ย เจ้าต้องโกงแน่! นกของเจ้าบินเร็วขนาดนั้นไม่ได้หรอก ดูนางสิ — นางมัน [falconer_1.Custom('GetBirdInsult')]!" ผู้แพ้ที่โกรธแค้นตะโกน ขณะที่ผู้ชนะมองอย่างพึงพอใจ"
 tournament_events.9004.hunter:0 "ข้าอาจเรียนรู้อะไรบางอย่างจากสิ่งนี้ได้..."
 tournament_events.9004.a:0 "นี่คือความบันเทิงชั้นยอด!"
 tournament_events.9004.b:0 "หืม การทำ เช่นนี้ต้องใช้การเตรียมตัวอย่างมาก"
 tournament_events.9004.c:0 "สองเท่าหรือไม่ได้อะไรเลย เอาอีกครั้ง!"
 tournament_events.9004.c.success:0 "ท่านชนะพนัน"
 tournament_events.9004.c.failure:0 "ท่านแพ้พนัน"
 tournament_events.9004.d:0 "ข้าไม่มีเวลาสำหรับเรื่องนี้"
 round_as_an_egg:0 "กลมเหมือนไข่"
 heavy_as_a_stone:0 "หนักเหมือนหิน"
 graceful_as_a_goose:0 "สง่างามเหมือนห่าน"
 shaped_like_a_brick:0 "รูปร่างเหมือนอิฐ"
 as_thick_as_you:0 "หนาเท่าเจ้า"
 barely_a_fledgeling:0 "แทบจะไม่ใช่ลูกนก"
 wobbly_like_a_duck:0 "โยกเยกเหมือนเป็ด"
 as_fast_as_a_mountain:0 "เร็วเท่าภูเขา"
 as_bright_as_a_rain_cloud:0 "สว่างเท่าเมฆฝน"
 an_empty_cup:0 "ถ้วยเปล่า"
 a_stick_simple:0 "กิ่งไม้"
 a_rock:0 "ก้อนหิน"
 available_because_of_intent:0 "ตัวเลือกนี้มีให้ เนื่องจาก [intent|E] ของท่าน"
 you_get_drunk:0 "ท่านเมา"
 they_share_some_tricks:0 "พวกเขาแบ่งปันเคล็ดลับบางอย่าง"
 you_have_a_good_time:0 "ท่านมีช่วงเวลาที่ดี แต่ไม่มีอะไรมากไปกว่านั้น"
 tournament_events.9005.t:0 "การเฉลิมฉลองอันอึกทึก"
 tournament_events.9005.desc:0 "อาหารและเครื่องดื่มมีอยู่อย่างอุดมสมบูรณ์ระหว่างการประลอง สร้างความยินดีแก่ผู้เข้าร่วมงาน โดยเฉพาะอย่างยิ่ง มีไพร่สามคนดูเหมือนกำลังแบ่งปันสิ่งที่คล้ายกับ #EMP ถังทั้งใบ#! ของ [tournament_host.Custom('RegionalDrink')] กันอยู่\n\n"ข.. ข้าจะอัดแกร... ให้เละเลย... ไอ้ [peasant_2.Custom2('InsultNoun', SCOPE.sC('peasant_1'))]!" คนหนึ่งพูดพึมพำอย่างเมามาย พลางขว้าง [peasant_1.Custom('ThrowableObjectArticle')] ใส่เพื่อนบ้านของ[peasant_1.GetHerHis] อย่างไร้เรี่ยวแรง\n\n"[peasant_1.GetFirstName] ข... ข้าขอโต้ด! [peasant_1.Custom('GetLaughType')]" ผู้เคราะห์ร้ายใช้มือป้องใบหน้าของ[peasant_1.GetHerHis] เพื่อปัดป้องการโจมตี "ช่วยข้าด้วย [peasant_3.GetFirstName]! #EMP *เอิ๊ก*#!"\n\n"แกรก็ดูแลตัวเองละกาน... [peasant_2.GetName]!" คนสุดท้ายอุทานขึ้น พลางกระดกเหยือกทั้งใบในอึกเดียว"
 tournament_events.9005.a:0 "พวกเขาช่างอึกทึก... แต่ข้า #EMP ต้องการ#! $knight_culture_player_plural_no_tooltip_lowercase$ จริงๆ..."
 tournament_events.9005.b:0 "จะว่าอะไรไหมถ้าข้าจะร่วมดื่ม [tournament_host.Custom('RegionalDrink')] สักถ้วยกับพวกเจ้า?"
 tournament_events.9005.c:0 "พวกเขาเมาหัวราน้ำ... การยั่วยุพวกเขาคงเป็นเรื่องง่าย!"
 tournament_events.9005.d:0 "น่ารังเกียจ"
 
 tournament_events.9006.t:0 "เรื่องเล่าการประลอง"
 tournament_events.9006.desc:0 "ฝูงชนกลุ่มเล็กๆ ได้รวมตัวกันรอบ [memory_holder.GetTitledFirstName] ผู้กำลังเล่าเรื่องอย่างกระตือรือร้น พวกเขาดูเหมือนกำลังตั้งใจฟัง\n\n"
 tournament_events.9006.family:0 ""เกียรติยศส่วนตัวเป็นเรื่องหนึ่ง แต่เกียรติยศที่แท้จริงอยู่ที่อื่น" [memory_holder.GetSheHe|U] [memory_holder.Custom('quirk_pos_present')] "ครอบครัวคือความแข็งแกร่งของเจ้า — หากไม่มีพวกเขา เจ้าก็ไม่มีอะไรเลย! สิ่งนี้ ทำให้ข้านึกถึงตอนที่ [story_memory.GetDescription]...""
 tournament_events.9006.martial:0 ""ความแข็งแกร่งของแขนเป็นสิ่งสำคัญ แต่ที่สำคัญยิ่งกว่าคือความแข็งแกร่งของ #EMP จิตใจ#! " [memory_holder.GetSheHe|U] [memory_holder.Custom('quirk_pos_present')] "การเป็นนักวางกลยุทธ์ที่เชี่ยวชาญเกี่ยวข้องกับการรับฟังความล้มเหลวและความสำเร็จของผู้อื่น ซึ่งนำข้าไปสู่ช่วงเวลาที่ [story_memory.GetDescription]...""
 tournament_events.9006.death:0 ""ความสำเร็จที่แท้จริงเกิดจากจิตใจที่ไม่วอกแวก" [memory_holder.GetSheHe|U] [memory_holder.Custom('quirk_pos_present')] "จงระงับความทรงจำที่ ทำให้ไขว้เขว และใช้จุดอ่อนของคู่ต่อสู้ให้เป็นประโยชน์ ให้ข้าเล่าเรื่องตอนที่ [story_memory.GetDescription]...""
 tournament_events.9006.war:0 ""เจ้าถามว่าข้าทำได้อย่างไรถึงน่าประทับใจ เช่นนี้?" [memory_holder.GetSheHe|U] [memory_holder.Custom('quirk_pos_present')] "ข้าเคยต่อสู้ในสงคราม และนำกองทัพต่อสู้กับศัตรูที่ยิ่งใหญ่ — ให้ข้าเล่าให้เจ้าฟังถึงตอนที่ [story_memory.GetDescription]...""
 tournament_events.9006.relationships:0 ""ทักษะของเจ้าเพียงอย่างเดียวจะพาเจ้าไปได้ไม่ไกลนักในการประลอง" [memory_holder.GetSheHe|U] [memory_holder.Custom('quirk_pos_present')] "ผู้ที่สนับสนุน หรือไม่สนับสนุนเจ้าต่างหาก คือผู้กำหนดชะตากรรมของเจ้า — ให้ข้าเล่าให้เจ้าฟังถึงตอนที่ [story_memory.GetDescription]...""
 tournament_events.9006.travel:0 ""การเดินทางมีความสำคัญพอๆ กับจุดหมายปลายทาง จงคว้าโอกาสเสมอ!" [memory_holder.GetSheHe|U] [memory_holder.Custom('quirk_pos_present')] "ข้าคงไม่มีทางมาได้ไกลขนาดนี้หากไม่มองหาทุกโอกาสบนเส้นทาง — ตัวอย่าง เช่นตอนที่ [story_memory.GetDescription]...""
 tournament_events.9006.desc_end:0 "\n\nเวลาผ่านไปเกือบครึ่งชั่วโมง แต่รู้สึกเหมือนเพียงไม่กี่วินาที — [memory_holder.GetSheHe] รู้วิธีเล่าเรื่องได้เก่งจริงๆ!"
 tournament_events.9006.a:0 "สิ่งนี้จะช่วยข้าในการแข่งขันที่กำลังจะมาถึง!"
 tournament_events.9006.b:0 "ข้าคิดว่าข้าได้เรียนรู้อะไรบางอย่างจากสิ่งนี้"
 lifestyle_experience_increased:0 "ประสบการณ์วิถีชีวิตเพิ่มขึ้น"
 you_learn_a_little:0 "ท่านเรียนรู้เล็กน้อย"
 you_learn_a_lot:0 "ท่านเรียนรู้มาก"
 tournament_events.9006.shy:0 "ข้าหวังว่าข้าจะสามารถพูดในที่สาธารณะ เช่นนั้นได้..."
 tournament_events.9006.impatient:0 "เสียเวลาจริงๆ!"
 
 tournament_events.9007.t:0 "เสียงประโคมชัยของอัศวิน"
 tournament_events.9007.desc:0 "\"ท่านจะต้องชนะแน่!\" [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('hype_knight'))] ของข้า [hype_knight.GetFirstName] อุทาน \"มันง่ายดาย เหมือนตอนที่ [hype_memory.GetSecondPerspectiveDescription] — ท่านช่าง [ROOT.Char.Custom('FormalComplimentAdjective')] และ [ROOT.Char.Custom('ComplimentAdjective')] เกินกว่าจะล้มเหลว!\"\n\nรู้สึกดีที่รู้ว่าเหล่า $knight_culture_player_plural_no_tooltip_lowercase$ ของข้าสนับสนุนข้า!"
 tournament_events.9007.ambitious:0 "เงียบไป [hype_knight.Custom('RaunchyComplimentNoun')] — ข้ารู้อยู่แล้ว!"
 tournament_events.9007.a:0 "ข้ารู้สึกว่าไม่มีใครหยุดข้าได้!"
 tournament_events.9007.b:0 "ข้าคงไม่มีอะไรเลยหากไม่มีผู้สนับสนุนอันรุ่งโรจน์ของข้า!"
 tournament_events.9007.c:0 "ข้าขอบคุณ [ROOT.Char.GetFaith.HighGodName] สำหรับชัยชนะที่กำลังจะมาถึงของข้า"
 
 tournament_events.9008.t:0 "การแสดงของจำอวด"
 tournament_events.9008.desc:0 ""มาเถิด มาชม [tournament_fool.Custom2('DescriptorPositive', SCOPE.sC('tournament_fool') )|U] [tournament_fool.GetFirstName]!" [tournament_fool.GetWomanMan] ในชุดสีสันสดใสตระโกน พลางทรงตัว [tournament_fool.Custom('GetObjectToBalanceOnNose')] บนจมูกของ [tournament_fool.GetHerHis] อย่างหมิ่นเหม่\n\n"ข้าก็รู้เรื่องเล่าเหมือนกัน! บางทีท่านอาจอยากฟังเรื่องสนุกๆ อย่างเรื่องตอนที่ [memory_story.GetThirdPerspectiveDescription]?" [tournament_fool.GetSheHe|U] พูดขณะทำท่าหกสูง\n\n"หรือบางทีท่าน [ROOT.Char.GetLadyLord] ของข้าอาจอยากฟังเรื่อง #EMP น่าสะพรึงกลัว#! อย่างเรื่องตอนที่ [memory_story_negative.GetThirdPerspectiveDescription]?""
 tournament_events.9008.schemer:0 "ข้า #EMP รู้#! ว่าเจ้าเคยได้ยินเรื่องที่น่าสนใจกว่านี้..."
 tournament_events.9008.a:0 "ไม่เอาเรื่องน่าเบื่อ — ข้าอยากเห็นเจ้าโยนของ!"
 tournament_events.9008.b:0 "เล่าเรื่องสนุกๆ ให้ข้าฟัง!"
 tournament_events.9008.c:0 "เรื่องน่าสะพรึงกลัวจะสร้างบรรยากาศที่เหมาะสม"
 cheery_disposition_modifier:0 "อารมณ์ร่าเริง"
 cheery_disposition_modifier_desc:0 "ตัวละครนี้ร่าเริงและเป็นมิตร"
 grim_disposition_modifier:0 "อารมณ์เคร่งขรึม"
 grim_disposition_modifier_desc:0 "ตัวละครนี้ดูเคร่งขรึมและมุ่งมั่น"
