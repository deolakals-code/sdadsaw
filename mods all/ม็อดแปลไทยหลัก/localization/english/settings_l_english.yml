 SETTING_ROYAL_COURT_ANIMATE_CAMERA_TRANSITION_TOOLTIP:0 "#T $SETTING_ROYAL_COURT_ANIMATE_CAMERA_TRANSITION$#!\nกำหนดว่ากล้องในราชสำนักควรเคลื่อนที่ไปยังตำแหน่งใหม่อย่างราบรื่นหรือไม่\n\nหากปิดใช้งานตัวละครเคลื่อนไหว การตั้งค่านี้จะไม่มีผล"
