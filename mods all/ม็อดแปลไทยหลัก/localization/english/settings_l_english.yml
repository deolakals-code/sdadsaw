 SETTING_ADVANCED_SHADERS:0 "เอฟเฟกต์เชดเดอร์ขั้นสูง"
 SETTING_ADVANCED_SHADERS_TOOLTIP:0 "#T เอฟเฟกต์เชดเดอร์ขั้นสูง\n#!ตัวเลือกนี้จะเปิดใช้งานเอฟเฟกต์เชดเดอร์ขั้นสูง\n\nการปิดใช้งานอาจเพิ่มประสิทธิภาพ แต่แลกมาด้วยการ ทำให้เอฟเฟกต์บางอย่าง ( เช่น ภูมิประเทศและน้ำ) ดูแย่ลง"
