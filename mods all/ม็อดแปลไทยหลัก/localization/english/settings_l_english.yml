 SETTING_ROYAL_COURT_ANIMATE_CAMERA_IDLE_TOOLTIP:0 "#T $SETTING_ROYAL_COURT_ANIMATE_CAMERA_IDLE$#!\nกำหนดว่ากล้องในราชสำนักควรแพนเบาๆ ไปทั่วราชสำนักของท่านเมื่อไม่ใช้งานหรือไม่\n\nหากปิดใช้งานตัวละครเคลื่อนไหว การตั้งค่านี้จะไม่มีผล"
