 SETTING_HIDE_COAST_BORDER_ON_ZOOM_TOOLTIP:0 "#T $SETTING_HIDE_COAST_BORDER_ON_ZOOM$#!\nตัวเลือกนี้จะควบคุมว่าจะแสดงเส้นขอบอาณาจักรบริเวณชายฝั่งเมื่อใด\nหากตั้งค่าเป็น $BASED_ON_ZOOM_LEVEL$ เส้นขอบจะถูกซ่อนในระดับการซูมละเอียด\n\nการเลือก $ALWAYS_SHOW$ หรือ $ALWAYS_HIDE$ อาจช่วยเพิ่มประสิทธิภาพของเกม แต่ต้องแลกมากับการที่เส้นขอบอาณาจักรชายฝั่งจะไม่ซ่อนแบบไดนามิก"
