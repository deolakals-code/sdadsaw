 SETTING_WINTER_PARTICLE_EFFECTS_TOOLTIP:0 "#T $SETTING_WINTER_PARTICLE_EFFECTS$#!\nกำหนดว่าจะแสดงเอฟเฟกต์อนุภาคหรือไม่เมื่อฤดูหนาวมีผลในบางพื้นที่ของแผนที่\n\nการปิดใช้งานอาจเพิ่มประสิทธิภาพ"
 SETTING_RESET_CAMERA_ROTATION:0 "รีเซ็ตการหมุนกล้อง"
