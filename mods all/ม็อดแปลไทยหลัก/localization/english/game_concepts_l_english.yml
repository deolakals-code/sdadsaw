 game_concept_board_game_type_desc_guts:0 "เมื่อเล่น $game_concept_board_game$ รูปแบบการเล่นที่แตกต่างกันจะ $game_concept_board_game_type_counter$ คู่ต่อสู้ของท่าน การแก้ทางการเคลื่อนไหวของพวกเขาจะลดคะแนนที่พวกเขาได้รับลงอย่างมาก แม้ว่าจะสำเร็จก็ตาม คู่ต่อสู้ที่มีทักษะอาจสังเกตเห็นทักษะของท่านและพยายาม $game_concept_board_game_type_counter$ #EMP ท่าน#! โดยเจตนา"
