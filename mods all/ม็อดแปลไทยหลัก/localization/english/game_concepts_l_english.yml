 game_concept_diarch_possessive:0 "ของผู้ร่วมปกครอง"
 game_concept_diarchs_possessive:0 "ของผู้ร่วมปกครอง"
 game_concept_diarch_desc:3 "หุ้นส่วนรองในช่วง [diarchy|E] $game_concept_diarch$ ช่วย [liege|E] ของตนบริหาร [realm|E]\n\n$game_concept_diarch$ สามารถเข้าถึง [diarch_powers|E] และได้รับอำนาจเหล่านี้มากขึ้นเมื่อ [scales_of_power|E] เอนเอียงไปทางพวกเขา"

 game_concept_regent:0 "ผู้สำเร็จราชการ"
 game_concept_regents:0 "ผู้สำเร็จราชการ"
 game_concept_regent_possessive:0 "ของผู้สำเร็จราชการ"
 game_concept_regents_possessive:0 "ของผู้สำเร็จราชการ"
 game_concept_regent_desc:0 "ผู้สำเร็จราชการคือชื่อเรียก [diarch|E] ในช่วง [regency|E]\n\n[ruler|E] สามารถ แต่งตั้งผู้สำเร็จราชการก่อนที่จะเกิดการสำเร็จราชการขึ้น มิฉะนั้น ผู้ที่มี [regent_succession_score|E] สูงสุดจะถูกเลือกโดยอัตโนมัติ"

