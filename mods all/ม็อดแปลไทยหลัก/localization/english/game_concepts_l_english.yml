 game_concept_tour:0 "การเดินทางเยือน"
 game_concept_tour_desc:0 "[grand_activity|E] ซึ่ง [liege|E] เสด็จเยือนกลุ่ม [vassals|E] ของตนเพื่อเก็บเกี่ยวรางวัล เช่น [gold|E], [dread|E], [opinion|E], [control|E], และ [cultural_acceptance|E]"
