 game_concept_incest:0 "การสมสู่ร่วมสายโลหิต"
 game_concept_incestuous:0 "ร่วมสายโลหิต"
 game_concept_incest_desc:0 "การสมสู่ร่วมสายโลหิตหมายถึงกิจกรรมทางเพศระหว่างญาติสนิท\nความสัมพันธ์ใดถือเป็นการสมสู่ร่วมสายโลหิตนั้นกำหนดโดย [doctrine|E] $doctrine_consanguinity_name$ ของ [faith|E] ของตัวละคร"

