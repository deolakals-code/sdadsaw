 game_concept_share_power: "แบ่งปันอำนาจ"
 game_concept_sharing_power:0 "กำลังแบ่งปันอำนาจ"
 game_concept_power_sharing:0 "การแบ่งปันอำนาจ"
 game_concept_diarchy_desc:2 "การแบ่งปันอำนาจเกิดขึ้นเมื่อ [ruler|E] แบ่งปันอำนาจบางส่วนกับ [vassals|E] หรือ [courtiers|E] คนใดคนหนึ่ง ซึ่งจะกลายเป็น [diarch|E] ของพวกเขา\n\nผู้ปกครองที่แบ่งปันอำนาจอาจกำหนด [mandates|E] ให้กับ $game_concept_diarch$ ของตน ในขณะที่ $game_concept_diarch$ อาจใช้ [diarch_powers|E] พิเศษ\n\n[scales_of_power|E] จะวัดว่าผู้ปกครองหรือ $game_concept_diarch$ มีอำนาจมากกว่ากัน"

 game_concept_diarch:0 "ผู้ร่วมปกครอง"
