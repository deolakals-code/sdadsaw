 game_concept_relations:0 "ความสัมพันธ์พิเศษ"
 game_concept_relationship:0 "ความสัมพันธ์พิเศษ"
 game_concept_relation_desc:3 "$game_concept_relations$ คือความสัมพันธ์ที่ตัวละครมี ซึ่งไม่ผูกพันทางครอบครัวหรือ [vassalage|E] $game_concept_relations$ เหล่านี้แบ่งออกเป็นหลายประเภท อาจส่งผล [character_modifiers|E] สำหรับตัวละครที่เกี่ยวข้อง และกำหนดว่าสิ่งใดสามารถเกิดขึ้นระหว่างพวกเขาได้\n\nความสัมพันธ์มาตรฐาน:\n$EFFECT_LIST_BULLET$ [friend|E]\n$EFFECT_LIST_BULLET$ [lover|E]\n$EFFECT_LIST_BULLET$ [rival|E]\n$EFFECT_LIST_BULLET$ [guardian|E]\n$EFFECT_LIST_BULLET$ [ward|E]\n$EFFECT_LIST_BULLET$ [mentor|E]\n$EFFECT_LIST_BULLET$ [student|E]\n$EFFECT_LIST_BULLET$ [elder|E]\n$EFFECT_LIST_BULLET$ [disciple|E]\n\nความสัมพันธ์ที่อัปเกรดแล้ว:\n$EFFECT_LIST_BULLET$ [best_friend|E]\n$EFFECT_LIST_BULLET$ [soulmate|E]\n$EFFECT_LIST_BULLET$ [nemesis|E]\n\nความสัมพันธ์ในวัยเด็ก:\n$EFFECT_LIST_BULLET$ [bully|E]\n$EFFECT_LIST_BULLET$ [victim|E]\n$EFFECT_LIST_BULLET$ [crush|E]"
 
 game_concept_lover:0 "ชู้รัก"
 game_concept_lovers:0 "ชู้รัก"
 game_concept_lover_possessive:0 "ของชู้รัก"
 game_concept_lovers_possessive:0 "ของเหล่าชู้รัก"
 game_concept_lover_desc:3 "$game_concept_lover$ คือ $game_concept_relation$ ที่บ่งบอกถึงความสัมพันธ์เชิงชู้สาวและทางเพศอย่างต่อเนื่องระหว่าง [characters|E] สองคน\n\nเนื่องจากมักเกิดขึ้นนอกพันธะของ [marriage|E] หรือ [concubinage|E] $game_concept_relations$ แบบ $game_concept_lover$ ส่วนใหญ่จึงเริ่มต้นเป็น [secrets|E]\n\nหากชายและหญิงเป็น $game_concept_lovers$ ฝ่ายหญิงอาจตั้งครรภ์กับลูกของฝ่ายชาย หากพวกเขาไม่ได้ $game_concept_married$ (และฝ่ายหนึ่งไม่ใช่ $game_concept_concubine$ ของอีกฝ่าย) เด็กจะเป็น [bastard|E] ไม่ว่าจะลับหรือไม่ก็ตาม\n\n$game_concept_lovers$ ที่ภักดีและรักใคร่กันอย่างลึกซึ้งอาจกลายเป็น [soulmates|E]"
 game_concept_soulmate:0 "เนื้อคู่"
 game_concept_soulmates:0 "เนื้อคู่"
 game_concept_soulmate_possessive:0 "ของเนื้อคู่"
 game_concept_soulmates_possessive:0 "ของเหล่าเนื้อคู่"
 game_concept_soulmate_desc:0 "$game_concept_soulmate$ คือ $game_concept_relation$ ที่บ่งบอกถึงความรักที่ลึกซึ้ง โรแมนติก เป็น $game_concept_relation$ ที่แข็งแกร่งกว่า [lover|E] $game_concept_character$ สามารถมี $game_concept_soulmate$ ได้เพียงคนเดียว"

 game_concept_friend:0 "สหาย"
 game_concept_friends:0 "สหาย"
 game_concept_friendships: "มิตรภาพ"
 game_concept_friend_possessive:0 "ของสหาย"
 game_concept_friends_possessive:0 "ของเหล่าสหาย"
 game_concept_friendship:0 "มิตรภาพ"
 game_concept_friend_desc:2 "$game_concept_friend$ คือ $game_concept_relation$ ที่บ่งบอกถึงมิตรภาพและการสนับสนุนที่ใกล้ชิด และสามารถมีได้ทั้งใน [children|E] และ [adults|E]\n\n$game_concept_friends$ ที่มีความผูกพันลึกซึ้งอาจกลายเป็น [best_friends|E]"

 game_concept_best_friend:0 "สหายสนิท"
 game_concept_best_friends:0 "สหายสนิท"
 game_concept_best_friend_possessive:0 "ของสหายสนิท"
 game_concept_best_friends_possessive:0 "ของเหล่าสหายสนิท"
 game_concept_best_friend_desc:2 "$game_concept_best_friend$ คือ $game_concept_relation$ ที่บ่งบอกถึงความทุ่มเทและการสนับสนุนตลอดชีวิต เป็น $game_concept_relation$ ที่แข็งแกร่งกว่า [friend|E] [character|E] สามารถมี $game_concept_best_friend$ ได้เพียงคนเดียว"

 game_concept_rival:0 "คู่ปรับ"
 game_concept_rivals:0 "คู่ปรับ"
 game_concept_rivalries:0 "ความเป็นคู่ปรับ"
 game_concept_rivalry:0 "ความเป็นคู่ปรับ"
 game_concept_rival_possessive:0 "ของคู่ปรับ"
 game_concept_rivals_possessive:0 "ของเหล่าคู่ปรับ"
 game_concept_rival_desc:2 "$game_concept_rival$ คือ $game_concept_relation$ ที่บ่งบอกถึงความขุ่นเคืองตลอดชีวิต หากไม่ใช่ความเกลียดชัง\n\n$game_concept_rivals$ ที่ดูถูกเหยียดหยาม ซึ่งกันและกันอย่างแท้จริงอาจกลายเป็น [nemeses|E]"

 game_concept_nemesis:0 "คู่แค้น"
 game_concept_nemeses:0 "คู่แค้น"
 game_concept_nemesis_possessive:0 "ของคู่แค้น"
 game_concept_nemeses_possessive:0 "ของเหล่าคู่แค้น"
 game_concept_nemesis_desc:1 "$game_concept_nemesis$ คือ $game_concept_relation$ ที่บ่งบอกถึงการดูถูกและความเกลียดชังอย่างที่สุด (และร่วมกัน) เป็น $game_concept_relation$ ที่แข็งแกร่งกว่า [rival|E] ตัวละครสามารถมี $game_concept_nemesis$ ได้เพียงคนเดียว"

 game_concept_grudge: "ความแค้น"
 game_concept_grudges: "ความแค้น"
 game_concept_grudge_possessive: "แห่งความแค้น"
 game_concept_grudges_possessive: "แห่งความแค้น"
 game_concept_grudge_desc: "$game_concept_grudge$ คือ $game_concept_relation$ ที่บ่งบอกถึงความเกลียดชังและความขุ่นเคืองฝ่ายเดียว เป้าหมายของความแค้นไม่ตอบสนองความรู้สึกและอาจไม่รู้ตัวด้วยซ้ำ\n\n#WEAK $game_concept_grudges$ มักเกิดขึ้นบ่อยที่สุดเมื่อ [character|E] คนหนึ่งทำสิ่งที่น่ากลัวต่ออีกคนหนึ่งโดยไม่รู้ตัวว่ามีอยู่จริง — ตัวอย่างเช่น กษัตริย์ทิ้งชาวนาไว้ใน [dungeon|E] เป็นเวลาสี่สิบปี#!"

 game_concept_guardian:0 "ผู้พิทักษ์"
 game_concept_guardians:0 "ผู้พิทักษ์"
 game_concept_guardian_possessive:0 "ของผู้พิทักษ์"
 game_concept_guardians_possessive:0 "ของเหล่าผู้พิทักษ์"
 game_concept_guardianship:1 "การพิทักษ์"
 game_concept_guardian_desc:2 "$game_concept_guardian$ คือ [character|E] ที่ได้รับมอบหมายให้ [educate|E] [child|E] (เรียกว่า [ward|E] ของพวกเขา)\n\n$game_concept_guardians$ มีแนวโน้มที่จะถ่ายทอด [personality_traits|E] ของตนไปยัง $game_concept_wards$ รวมถึง [culture|E] และ/หรือ [faith|E] หากระบุไว้ใน $game_concept_education_focus$\n\n$game_concept_guardian$ สามารถอาศัยอยู่ใน [court|E] อื่นได้ การมอบ [close_family_member|E] ให้อยู่ในความเมตตาของ [ruler|E] อื่นด้วยวิธีนี้จะเพิ่ม [opinion|E] ที่พวกเขามีต่อท่าน"

 game_concept_ward:0 "ผู้อยู่ในอุปถัมภ์"
 game_concept_wards:0 "ผู้อยู่ในอุปถัมภ์"
 game_concept_ward_possessive:0 "ของผู้อยู่ในอุปถัมภ์"
 game_concept_wards_possessive:0 "ของเหล่าผู้อยู่ในอุปถัมภ์"
 game_concept_ward_desc:0 "$game_concept_ward$ คือ [child|E] ที่กำลัง [educated|E] โดย [guardian|E] $game_concept_guardian$ แต่ละคนสามารถดูแล $game_concept_wards$ ได้สูงสุดสองคน"

 game_concept_mentor:0 "พี่เลี้ยง"
 game_concept_mentors:0 "พี่เลี้ยง"
 game_concept_mentor_possessive:0 "ของพี่เลี้ยง"
 game_concept_mentors_possessive:0 "ของเหล่าพี่เลี้ยง"
 game_concept_mentor_desc:0 "$game_concept_mentors$ คือ [characters|E] ที่ช่วยพัฒนา [skills|E] ของ [student|E] ของพวกเขา สามารถได้รับผ่านเหตุการณ์เมื่อ [lifestyle|E] [focus|E] ของท่านถูกตั้งค่าเป็น $game_concept_skill$ เฉพาะ"

 game_concept_student:0 "ศิษย์"
 game_concept_students:0 "ศิษย์"
 game_concept_student_possessive:0 "ของศิษย์"
 game_concept_students_possessive:0 "ของเหล่าศิษย์"
 game_concept_student_desc:0 "$game_concept_students$ คือ [characters|E] ที่ได้รับประโยชน์จากคำแนะนำของ [mentor|E] ซึ่งกำลังช่วยให้พวกเขาพัฒนา [skills|E] อย่างหนึ่งของตน $game_concept_mentors$ ได้รับผ่านเหตุการณ์เมื่อ [lifestyle|E] [focus|E] ของท่านถูกตั้งค่าเป็น $game_concept_skill$ ที่พวกเขาเชี่ยวชาญ"

 game_concept_bully:0 "นักเลงโต"
 game_concept_bullies:0 "นักเลงโต"
 game_concept_bully_possessive:0 "ของนักเลงโต"
 game_concept_bullies_possessive:0 "ของเหล่านักเลงโต"
 game_concept_bully_desc:0 "$game_concept_bully$ คือ [child|E] ที่โหดร้าย ซึ่งรังแก $game_concept_child$ อื่น ( [victim|E] ของพวกเขา) เพื่อความสนุกสนาน ผลประโยชน์ หรือเพียงแค่ความเบื่อหน่าย เมื่อถึง [adulthood|E] $game_concept_bully$ อาจกลายเป็น [rival|E] หรือพวกเขาอาจเติบโตพ้นจากความเกลียดชังในวัยเด็ก"

 game_concept_victim:0 "เหยื่อ"
 game_concept_victims:0 "เหยื่อ"
 game_concept_victim_possessive:0 "ของเหยื่อ"
 game_concept_victims_possessive:0 "ของเหล่าเหยื่อ"
 game_concept_victim_desc:0 "$game_concept_victim$ คือ [child|E] ที่กำลังถูกรังแกโดย $game_concept_child$ อื่น บ่อยครั้งด้วยเหตุผลที่ไม่ชัดเจนสำหรับใครนอกจาก [bully|E] ของพวกเขา เมื่อถึง [adulthood|E] พวกเขาอาจกลายเป็น [rivals|E] กับ $game_concept_bully$ ของตน หรือเรียนรู้ที่จะทิ้งความขัดแย้งในวัยเยาว์ไว้เบื้องหลัง"

 game_concept_crush:0 "คนที่แอบชอบ"
 game_concept_crushes:0 "คนที่แอบชอบ"
 game_concept_crush_possessive:0 "ของคนที่แอบชอบ"
 game_concept_crushes_possessive:0 "ของเหล่าคนที่แอบชอบ"
 game_concept_crush_desc:0 "$game_concept_crush$ คือ [child|E] อีกคนหนึ่งที่ $game_concept_child$ คนนี้กำลังพัฒนาความรู้สึกแรก (ที่ค่อนข้างน่าอึดอัดใจ) ให้ เมื่อถึง [adulthood|E] หาก $game_concept_crush$ เป็นความรู้สึกร่วมกัน อาจผลิบานกลายเป็น [lovers|E] หรือ [character|E] อาจดำเนินชีวิตต่อไป"

 game_concept_blood_brother: "พี่น้องร่วมสาบาน"
 game_concept_blood_brothers: "เหล่าพี่น้องร่วมสาบาน"
 game_concept_blood_brother_possessive: "ของพี่น้องร่วมสาบาน"
 game_concept_blood_brothers_possessive: "ของเหล่าพี่น้องร่วมสาบาน"
 game_concept_blood_brother_desc: "$game_concept_blood_brother$ คือรูปแบบพิเศษของ [friend|E] และ [ally|E] [characters|E] สามารถมี $game_concept_blood_brother$ ได้เพียงคนเดียว: $game_concept_blood_brother$ ผู้นี้จะกลายเป็นสมาชิกเชิงสัญลักษณ์ของครอบครัว ( ดังนั้น จึงต้องไม่เป็น [family|E] อยู่แล้ว) หากปฏิเสธการเรียกเข้าร่วม [war|E] ของ $game_concept_blood_brother$ ความ [relation|E] จะแตกหักและทั้งสองจะกลายเป็น [rivals|E]\n\nเหล่าพี่น้องร่วมสาบาน, [children|E] ของพวกเขา, และคู่ครองหลักของพวกเขาจะมีความ [opinion|E] ต่อกันเพิ่มขึ้น และอาจเจรจา [alliances|E] ระหว่างกันได้\n\nการเป็นพี่น้องร่วมสาบานสามารถทำได้ผ่านทาง [nomadic_government|E], [trait|E] [GetTrait('nomadic_philosophy').GetName( GetNullCharacter )], หรือผ่านทาง [tradition|E]"

 game_concept_modifier:0 "ตัวปรับ แต่ง"
 game_concept_modifiers:0 "ตัวปรับ แต่ง"
 game_concept_modifier_desc:0 "$game_concept_modifier$ คือผลกระทบที่เปลี่ยนแปลงค่าในช่วงเวลาที่ยาวนานขึ้น ตัวอย่าง เช่น อาจเปลี่ยนค่า [skills|E] ของตัวละคร หรือ [success_chance|E] ของ [scheme|E]\n\nตัวปรับ แต่งมักปรากฏสำหรับตัวละคร แผนการ หรือ [counties|E]"

 game_concept_character_modifier:0 "ตัวปรับ แต่งตัวละคร"
 game_concept_character_modifiers:0 "ตัวปรับ แต่งตัวละคร"
 game_concept_character_modifier_desc:2 "[modifiers|E] ที่ตัวละครถือครอง ส่งผลต่อบุคลิกภาพ [skills|E] และแม้กระทั่ง [income|E] ของพวกเขา แตกต่างจาก [traits|E] $game_concept_character_modifiers$ มักแสดงถึงผลกระทบชั่วคราว"

 game_concept_critical_failure:0 "ความล้มเหลวร้ายแรง"
 game_concept_critically_fail:0 "ล้มเหลวร้ายแรง"
 game_concept_critical_failure_desc:0 "[schemes|E] บางอย่างมีความเป็นไปได้ที่จะเกิด $game_concept_critical_failure$ ในระหว่างการดำเนินการ\n\nผลลัพธ์ที่แน่นอนแตกต่างกันไป แต่ รวมถึง $game_concept_scheme$ ที่ส่งผลย้อนกลับต่อ [scheme_owner_owner|E] หรือป้องกันไม่ให้พวกเขาพยายามใช้ $game_concept_scheme$ เดียวกันกับ [scheme_target_target|E] คนเดิมเป็นระยะเวลาหนึ่ง"

 game_concept_espionage:1 "$task_find_secrets$"
 game_concept_espionage_desc:1 "$game_concept_espionage$ คือ [councillor_task|E] ที่ดำเนินการโดย [spymaster|E]\n\nมันกำหนดเป้าหมายไปที่ [court|E] ของ [ruler|E] และพยายามเปิดเผย [secrets|E] เกี่ยวกับตัวละครที่นั่น"

 game_concept_disrupt_schemes:0 "$task_disrupt_schemes$"
 game_concept_disrupt_schemes_desc:1 "$game_concept_disrupt_schemes$ คือ [councillor_task|E] ที่ดำเนินการโดย [spymaster|E]\n\nมันเพิ่ม [scheme_discovery_chance|E] ของ [ruler|E] และชะลอการกระทำ $game_concept_spymaster$ ที่เป็นศัตรูของ $game_concept_ruler$ อื่นๆ เช่น [espionage|E]"

 game_concept_increase_control:0 "$task_increase_control$"
 game_concept_increase_control_desc:0 "$game_concept_increase_control$ คือ [councillor_task|E] ที่ดำเนินการโดย [marshal|E]\n\nมันกำหนดเป้าหมายไปที่ [county|E] ซึ่งจะเพิ่ม [control|E] และขจัด [county_corruption|E] เมื่อเวลาผ่านไป"

 game_concept_manage_guards:0 "$task_manage_guards$"
 game_concept_manage_guards_desc:0 "$game_concept_increase_control$ คือ [councillor_task|E] ที่ดำเนินการโดย [marshal|E]\n\nมันเพิ่ม [knight_effectiveness|E] และลด [success_chance|E] ของ [hostile_scheme|E] ต่อ [liege|E] ของที่ปรึกษา"

 game_concept_collect_taxes:0 "$task_collect_taxes$"
 game_concept_collect_taxes_desc:0 "$game_concept_collect_taxes$ คือ [councillor_task|E] ที่ดำเนินการโดย [steward|E]\n\nมันเพิ่มภาษีทั้งหมดใน [domain|E] ส่วนตัวของตัวละคร"

 game_concept_promote_culture:0 "$task_promote_culture$"
 game_concept_promote_culture_desc:1 "$game_concept_promote_culture$ คือ [councillor_task|E] ที่ดำเนินการโดย [steward|E]\n\nมันเปลี่ยน [culture|E] ของ [county|E] ให้ตรงกับ $game_concept_culture$ ของผู้ปกครอง"
 
 game_concept_accept_culture:0 "$task_accept_culture$"
 game_concept_promoting_cultural_acceptance:0 "การส่งเสริมการยอมรับ"
 game_concept_accept_culture_desc:0 "$game_concept_accept_culture$ เป็น [councillor_task|E] ที่ดำเนินการโดย [steward|E]\n\nมันเพิ่ม [cultural_acceptance|E] ระหว่าง [culture|E] เป้าหมายและ $game_concept_culture$ ของ [rulerpossessive|E]"

