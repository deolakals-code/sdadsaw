 game_concept_fabricate_claim:0 "$task_fabricate_claim$"
 game_concept_fabricate_claim_short:0 "สร้างสิทธิ์เรียกร้อง"
 game_concept_fabricated_claims_short:0 "สิทธิ์เรียกร้องที่สร้างขึ้น"
 game_concept_fabricating_claims:0 "การสร้างสิทธิ์เรียกร้อง"
 game_concept_fabricate_claim_desc:0 "[councillor_task|E] ที่ดำเนินการโดย [court_chaplain|E]\nกำหนดเป้าหมายไปที่ [county|E] และสร้างความคืบหน้าเมื่อเวลาผ่านไป ที่ความคืบหน้า 100% สามารถสร้าง [claim|E] ได้โดยมีค่าใช้จ่ายเป็น [gold|E]"

 game_concept_religious_relations:0 "$task_religious_relations$"
 game_concept_religious_relations_desc:0 "[councillor_task|E] ที่ดำเนินการโดย [court_chaplain|E]\nเพิ่มความคิดเห็นของผู้ปกครอง [theocratic|E] ที่นับถือ [faith|E] เดียวกันที่มีต่อตัวละคร และเพิ่มการได้รับค่า [piety|E] รายเดือน"

 game_concept_interaction:0 "ปฏิสัมพันธ์"
 game_concept_interactions:0 "ปฏิสัมพันธ์"
 game_concept_interacting: "กำลังมีปฏิสัมพันธ์"
 game_concept_character_interaction:0 "ปฏิสัมพันธ์ของตัวละคร"
 game_concept_interaction_desc:0 "การกระทำที่ตัวละครหนึ่งกระทำต่ออีกตัวละครหนึ่ง สามารถมีวัตถุประสงค์และผลกระทบที่หลากหลาย\n\nปฏิสัมพันธ์บางอย่างต้องได้รับการอนุมัติจากตัวละครเป้าหมาย ในขณะที่บางอย่างสามารถทำได้โดยไม่ต้องมีการอนุมัติ\n\nโดยปกติแล้วจะเข้าถึงได้โดยการคลิกขวาที่ตัวละครเพื่อเข้าถึงเมนูปฏิสัมพันธ์สำหรับตัวละครเป้าหมาย แต่บางครั้งก็มีให้ใช้งานผ่านอินเทอร์เฟซพิเศษ"

 game_concept_offer_vassalization:0 "เสนอการเป็นข้าหลวง"
