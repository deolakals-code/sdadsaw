 game_concept_strife:0 "ความขัดแย้ง"
 game_concept_strife_opinion:0 "ความเห็นต่อความขัดแย้ง"
 game_concept_strife_desc:2 "$game_concept_strife$ คือโทษ [opinion|E] สำหรับเพื่อน [vassals|E]\n\nความขัดแย้งเกิดขึ้นเมื่อข้าราชบริพารของ [liege|E] ดำเนินการต่อต้าน [vassal|E] อื่น ตัวอย่าง เช่น $game_concept_diarch$ ใช้อำนาจ [diarch_powers|E] ของตน หรือในเหตุการณ์ [mandate|E] เนื่องจาก $game_concept_diarch$ ไม่มีอำนาจ เช่นเดียวกับ [liege|E] ของตน"

