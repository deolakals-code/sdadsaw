 game_concept_skill_challenges_desc: "ความท้าทายด้านทักษะคือช่วงเวลาที่ตัวละครมีโอกาสใช้ [skills|E] หนึ่งของตนเพื่อส่งผลต่อผลลัพธ์ของเหตุการณ์ ยิ่งทักษะสูงเท่าไร ตัวละครก็ยิ่งมีแนวโน้มที่จะได้ตามความประสงค์หรือผลลัพธ์ที่เป็นประโยชน์จะเกิดขึ้นมากขึ้นเท่านั้น"

