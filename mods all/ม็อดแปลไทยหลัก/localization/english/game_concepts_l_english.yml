l_english: 
 test_text_to_use_explanation:0 "คำว่า [primary_title|E] เป็นแนวคิดในเกม"
 game_concept_vassal:0 "ข้าหลวง"
 game_concept_vassals:0 "เหล่าข้าหลวง"
 game_concept_vassalage:0 "ระบบข้าหลวง"
 game_concept_vassal_possessive:0 "ของข้าหลวง"
 game_concept_vassals_possessive:0 "ของเหล่าข้าหลวง"
 game_concept_direct_vassal:0 "ข้าหลวงโดยตรง"
 game_concept_direct_vassals:0 "เหล่าข้าหลวงโดยตรง"
 game_concept_direct_vassal_desc:0 "$game_concept_direct_vassals$ ของท่านคือ [vassals|E] ที่รับใช้ภายใต้ท่านเป็นการส่วนตัว ข้าหลวงของข้าหลวง #emphasis ไม่#! ถูกรวมอยู่ด้วย"
 game_concept_vassalize:0 "ทำให้เป็นข้าหลวง"
 game_concept_vassalization:0 "การ ทำให้เป็นข้าหลวง"
 game_concept_vassal_desc:1 "$game_concept_vassal$ คือ [ruler|E] ผู้สาบานความภักดีต่อผู้ปกครองอื่น — [liege|E] ของตน\n\n$game_concept_vassal$ จัดหา [levies|E] และ [taxes|E] ให้แก่เจ้าเหนือหัว — [obligations|E] ของตน — เพื่อแลกกับการคุ้มครอง\n\nหาก [opinion|E] ของ $game_concept_vassal$ ที่มีต่อเจ้าเหนือหัวอยู่ในระดับต่ำ พวกเขาอาจเข้าร่วม [factions|E] หรือ [scheme|E] เพื่อแทนที่เจ้าเหนือหัวด้วยผู้อื่น"
 game_concept_ruler:0 "ผู้ปกครอง"
 game_concept_rulers:0 "เหล่าผู้ปกครอง"
 game_concept_rulerpossessive:0 "ของผู้ปกครอง"
 game_concept_ruler_desc:1 "$game_concept_ruler$ คือ [character|E] ผู้ถือครอง [title|E] อย่างน้อยหนึ่งตำแหน่ง"
 game_concept_title:0 "บรรดาศักดิ์"
 game_concept_title_i: "@titles_icon!"
 game_concept_titles:0 "บรรดาศักดิ์"
 game_concept_titlepossessive:0 "ของบรรดาศักดิ์"
 game_concept_title_desc:1 "$game_concept_title$ โดยพื้นฐานคือเอกสารสิทธิ์ในการครอบครองที่ดิน\n\nหน่วยที่ดินที่เล็กที่สุดบนแผนที่คือ [barony|E] บารอนีถูกจัดรวมเป็นพื้นที่ขนาดใหญ่ขึ้นเรียกว่า [counties|E] เคาน์ตีสังกัด [duchy|E] [de_jure|E] ดัชชีสังกัด [kingdom|E] และราชอาณาจักรสังกัด [empire|E]\n\nดัชชี ราชอาณาจักร และจักรวรรดิไม่จำเป็นต้องมี [holder|E] เสมอไป แต่เป็นบรรดาศักดิ์ที่สามารถ [created|E] ได้โดยผู้ปกครองที่ควบคุมดินแดนที่เกี่ยวข้องได้มากพอ"
 game_concept_holder:0 "ผู้ถือครอง"
 game_concept_holders:0 "เหล่าผู้ถือครอง"
 game_concept_holder_possessive:0 "ของผู้ถือครอง"
 game_concept_holders_possessive:0 "ของเหล่าผู้ถือครอง"
 game_concept_hold:0 "ถือครอง"
 game_concept_holder_desc:1 "$game_concept_holder$ ของ [title|E] คือตัวละครที่เป็นเจ้าของบรรดาศักดิ์นั้น บรรดาศักดิ์ [barony|E] และ [county|E] จะมี $game_concept_holders$ เสมอเมื่อมีการตั้งถิ่นฐานแล้ว ในขณะที่บรรดาศักดิ์ [duchy|E], [kingdom|E] และ [empire|E] อาจยังไม่ถูกสร้างขึ้น ข้อควรระวังเพิ่มเติมคือ $game_concept_holder$ ของบรรดาศักดิ์ระดับสูงอาจไม่ได้ควบคุมดินแดนใด ๆ ภายในพื้นที่ [de_jure|E] ของบรรดาศักดิ์นั้นจริง ๆ\n\nการถือครองบรรดาศักดิ์ระดับสูงกว่า ทำให้ท่านสามารถมี [vassals|E] ระดับสูงกว่าได้ ตัวอย่าง เช่น ดยุกสามารถมีเคานต์เป็นข้าหลวง และพระราชาสามารถมีดยุกเป็นข้าหลวง"
 game_concept_de_jure:0 "โดยนิตินัย"
 game_concept_de_jure_desc:1 "[titles|E] ส่วนใหญ่ถือเป็นส่วนหนึ่งของบรรดาศักดิ์ระดับสูงกว่า $game_concept_de_jure$ ('ตามกฎหมาย')\n\nตัวอย่าง เช่น [ruler|E] อาจเป็น [king|E] แห่งอังกฤษ แต่ [realm|E] ของพวกเขายังไม่ได้ครอบคลุมดินแดนทั้งหมดที่ถือว่าเป็นส่วนหนึ่งของอังกฤษตามกฎหมาย\n\n[holder|E] ของ [duchy|E], [kingdom|E], หรือ [empire|E] จะมี [casus_belli|E] เพื่อยึดครองบรรดาศักดิ์ที่เป็นส่วนประกอบ $game_concept_de_jure$ ของตนเสมอ\n\n[vassals|E] จะตัดสินใจด้วยว่าใครคือ [rightful_liege|E] ของตน โดยพิจารณาจากบรรดาศักดิ์ใดที่ [primary_title|E] ของตนเป็นส่วนหนึ่งโดยนิตินัย"
 game_concept_de_jure_drift:0 "การผนวกดินแดนโดยนิตินัย"
 game_concept_de_jure_drift_drifted:0 "ถูกผนวกแล้ว"
 game_concept_de_jure_drift_drift:0 "ผนวก"
 game_concept_de_jure_drifting: "กำลังผนวกโดยนิตินัย"
 game_concept_de_jure_drift_desc:1 "$game_concept_de_jure_drift_desc_part_1$\n\n$game_concept_de_jure_drift_desc_part_2$"
 game_concept_de_jure_drift_desc_part_1:0 "กระบวนการที่ช้า ซึ่ง [liege|E] [de_jure|E] ของ [title|E] สามารถเปลี่ยนแปลงได้ เกิดขึ้นตามธรรมชาติเมื่อ [duchy|E] หรือ [kingdom|E] ถูกควบคุมโดยสมบูรณ์โดย [ruler|E] ที่ไม่ได้ถือครองบรรดาศักดิ์เจ้าเหนือหัวโดยนิตินัยของดินแดนนั้น\n\nกระบวนการนี้สามารถเร่งได้โดยการมอบหมายให้ [chancellor|E] ของท่านทำ [councillor_task|E] ที่เหมาะสม #weak ($task_integrate_title$)#! ดัชชีสามารถ $game_concept_de_jure_drift$ เข้าไปในราชอาณาจักรเท่านั้น และราชอาณาจักรสามารถผนวกเข้าสู่ [empires|E] เท่านั้น\n\nการปล่อยให้บรรดาศักดิ์ผนวกโดยนิตินัยเข้าสู่ [primary_title|E] ของท่านเป็นวิธีที่ดีในการกำจัดบทลงโทษ [rightful_liege|E]"
 game_concept_de_jure_drift_desc_part_2:0 "#weak ตัวอย่าง: ดัชชีแห่ง $d_northumberland$ เป็นส่วนหนึ่งโดยนิตินัยของ $k_england$ แต่ดินแดนของดัชชีอยู่ภายใน $k_scotland$ ทั้งหมด เนื่องจากพระราชาแห่ง $k_scotland$ ไม่ได้ถือครอง $k_england$ ด้วย ดัชชีจะเริ่ม $game_concept_de_jure_drift$ เพื่อกลายเป็นส่วนหนึ่งของ $k_scotland$#!`"
 game_concept_primary_title:0 "บรรดาศักดิ์หลัก"
 game_concept_primary_titles:0 "บรรดาศักดิ์หลัก"
 game_concept_primary_title_desc:0 "$game_concept_primary_title$ ของ [rulerpossessive|E] คือ [title|E] ระดับสูงสุดที่พวกเขายึดถือเป็นหลัก ซึ่งกำหนดตราอาร์มและชื่อ [realm|E] ของตน\n\nหากท่านควบคุมบรรดาศักดิ์หลายตำแหน่งในระดับเดียวกัน ท่านสามารถเลือกได้ว่าตำแหน่งใดควรเป็น $game_concept_primary_title$ ของท่าน"
 game_concept_recently_acquired_holding:0 "ที่ดินถือครองที่ได้มาล่าสุด"
 game_concept_recently_acquired_holdings:0 "ที่ดินถือครองที่ได้มาล่าสุด"
 game_concept_recently_acquired_holding_desc:0 "[holdings|E] ที่ได้มาในปีที่แล้ว ซึ่ง ทำให้ผู้ปกครองมีเกิน [domain_limit|E] จะไม่ก่อให้เกิดบทลงโทษต่อที่ดินถือครองอื่น ๆ ของพวกเขา แต่ก็ไม่ให้ [taxes|E] หรือ [levies|E] เช่นกัน"
 game_concept_domain_size:0 "ขนาดเขตปกครองส่วนตัว"
 game_concept_domain_size_desc:0 "$game_concept_domain_size$ ของตัวละครสะท้อนถึงจำนวน [barony|E] และ [county|E] [titles|E] ที่พวกเขาถือครองเป็นการส่วนตัว"
 game_concept_levies:0 "ไพร่พล"
 game_concept_levy:0 "ไพร่พล"
 game_concept_levies_desc:2 "ส่วนใหญ่ของ [armies|E] ส่วนมากประกอบด้วย $game_concept_levies$\n\nแต่ละ [holding|E] จะให้ $game_concept_levies$ จำนวนหนึ่งแก่ [holder|E] ของตน ในทางกลับกัน [vassals|E] จะมอบส่วนหนึ่งของ $game_concept_levies$ ให้แก่ [liege|E] ของตน\n\n$game_concept_levies$ ส่วนใหญ่ประกอบด้วยนักสู้ที่ติดอาวุธไม่ดี #weak (กองกำลังชาวนา, อันธพาล, ทหารรับจ้างท้องถิ่น, ขุนนางตกยาก, เจ้าของที่ดินรายย่อย ฯลฯ)#! และถือเป็นหน่วยประเภทของตนเอง\n\n$game_concept_levy$ มี [damage|E] [GetDefine('NCombat', 'LEVY_ATTACK')|0] และ [toughness|E] [GetDefine('NCombat', 'LEVY_TOUGHNESS')|0] ประเภทอื่นของ [soldiers|E] ในเกมคือ [men_at_arms|E] — ทหารอาชีพที่ผ่านการฝึกฝนและมีค่าใช้จ่ายสูง"
 game_concept_vassal_obligations:0 "ภาระหน้าที่ข้าหลวง"
 game_concept_obligations:1 "ภาระหน้าที่"
 game_concept_obligation:0 "ภาระหน้าที่"
 game_concept_vassal_obligations_desc:4 "$game_concept_vassal_obligations$ กำหนดจำนวน [tax|E] และ [levies|E] ที่ [vassal|E] มอบให้แก่ [liege|E] ของตน [government_form|E] ของข้าหลวงจะเป็นตัวกำหนดว่า $game_concept_obligations$ ของพวกเขาจะถูกปรับเปลี่ยนอย่างไร\n\n#weak ตัวอย่าง เช่น ภาระหน้าที่ของ [vassals|E] แบบ [GetGovernment('feudal_government').GetName] และ [GetGovernment('clan_government').GetName] ขึ้นอยู่กับ [vassal_contract|E] ของพวกเขา ในขณะที่ข้าหลวงแบบ [GetGovernment('administrative_government').GetName] ขึ้นอยู่กับ [province_administration|E] ของพวกเขา"
 game_concept_contract:0 "สัญญา"
 game_concept_crown_authority:0 "พระราชอำนาจ"
 game_concept_crown_authority_desc:1 "$game_concept_crown_authority$ แสดงถึงอำนาจทั่วไปที่ [ruler|E] มีเหนือ [vassals|E] ของตน\n\nมี $game_concept_crown_authority$ สี่ระดับ; [autonomous_vassals|E], [limited|E], [high|E], และ [absolute|E] การเพิ่ม $game_concept_crown_authority$ ต้องใช้ [prestige|E] จำนวนหนึ่งขึ้นอยู่กับระดับและ [learning_skill|E] ของผู้ปกครอง\n\n#weak เหล่าข้าหลวงไม่ชอบระดับ $game_concept_crown_authority$ ที่สูงขึ้น และการลดระดับเป็นเป้าหมายหลักของ [Concept( 'liberty_faction', 'กลุ่มอิทธิพลเรียกร้องเสรีภาพ' )|E]#!"
 game_concept_autonomous_vassals:0 "ข้าหลวงปกครองตนเอง"
 game_concept_autonomous_vassals_crown_authority:0 "พระราชอำนาจแบบข้าหลวงปกครองตนเอง"
 game_concept_autonomous_vassals_crown_authority_desc:0 "'$game_concept_autonomous_vassals$' คือระดับต่ำสุดของ [crown_authority|E] ในระดับนี้ [vassals|E] ไม่มีบทลงโทษ [opinion|E] ต่อ [liege|E] ของตน และเจ้าเหนือหัวมีเพียงอำนาจพื้นฐานเหนือพวกเขา"
 game_concept_limited:0 "จำกัด"
 game_concept_limited_crown_authority:0 "พระราชอำนาจจำกัด"
 game_concept_limited_crown_authority_desc:1 "'$game_concept_limited_crown_authority$' คือระดับที่สองรองจากต่ำสุดของ [crown_authority|E] [vassals|E] มีบทลงโทษ [opinion|E] #N -10#! ต่อ [liege|E] ของตน และเจ้าเหนือหัวอาจ [revoke|E] [titles|E] และ [retract|E] ข้าหลวงของข้าหลวงได้ [ruler|E] สามารถเปลี่ยนระหว่าง [succession_laws|E] แบบแบ่งสรรปันส่วน (Partition) ที่มีอยู่ได้"
 game_concept_high:0 "สูง"
 game_concept_high_crown_authority:0 "พระราชอำนาจสูง"
 game_concept_high_crown_authority_desc:2 "$game_concept_high_crown_authority$ คือระดับที่สองรองจากสูงสุด [vassals|E] มีบทลงโทษ [opinion|E] #N -20#! ต่อ [liege|E] ของตน\n\nในระดับนี้ — นอกเหนือจากอำนาจที่เจ้าเหนือหัวได้รับที่ [limited_crown_authority|E] — ข้าหลวงภายใต้เจ้าเหนือหัวคนเดียวกันไม่สามารถทำสงครามต่อกันได้อีกต่อไป ผู้ปกครองสามารถเปลี่ยนระหว่าง [succession_laws|E] ที่มีอยู่ทั้งหมดได้ และ [titles|E] ของข้าหลวงไม่สามารถสืบทอดโดยผู้ปกครองนอก [realm|E] ของเจ้าเหนือหัวได้\n\nสุดท้าย การปฏิเสธการ [revocation|E] บรรดาศักดิ์ หรือการ [retraction|E] ข้าหลวง ถือเป็น [crime|E] แม้ว่าเจ้าเหนือหัวจะไม่มีเหตุผลเพียงพอก็ตาม"
 game_concept_absolute:0 "เด็ดขาด"
 game_concept_absolute_crown_authority:0 "พระราชอำนาจเด็ดขาด"
 game_concept_absolute_crown_authority_desc:2 "$game_concept_absolute_crown_authority$ คือระดับสูงสุดของ [crown_authority|E] [vassals|E] มีบทลงโทษ [opinion|E] #N -30#! ต่อ [liege|E] ของตน\n\nในระดับนี้ — นอกเหนือจากผลกระทบของ [high|E] และ [limited|E] [crown_authority|E] — ผู้ปกครองสามารถเลือก [designated_heir|E] ได้โดยเสียค่า [prestige|E]\n\nนอกจากนี้ ข้าหลวงไม่สามารถประกาศสงครามได้แม้ แต่กับผู้ปกครองต่างชาติ"
 game_concept_tribal_authority:0 "อำนาจชนเผ่า"
 game_concept_tribal_authority_desc:2 "$game_concept_tribal_authority$ แสดงถึงอิทธิพลทั่วไปที่ [ruler|E] [tribal|E] มีเหนือ [vassals|E] ของตน เมื่อเทียบกับ [crown_authority|E] จะให้อำนาจน้อยกว่าและในระดับที่สูงกว่า\n\nมี $game_concept_tribal_authority$ สี่ระดับ: [disparate_tribes|E], [limited_tribal|E], [high_tribal|E], และ [absolute_tribal|E] การเพิ่ม $game_concept_tribal_authority$ ต้องใช้ [prestige|E] จำนวนหนึ่งขึ้นอยู่กับระดับและ [learning_skill|E] ของผู้ปกครอง แต่โดยทั่วไปมีค่าใช้จ่ายสูงกว่าการเพิ่มพระราชอำนาจ\n\n#weak เหล่าข้าหลวงไม่ชอบระดับ $game_concept_tribal_authority$ ที่สูงขึ้น และการลดระดับเป็นเป้าหมายหลักของ [liberty_faction|E] ใด ๆ#!"
 game_concept_disparate_tribes:0 "ชนเผ่ากระจัดกระจาย"
 game_concept_disparate_tribes_tribal_authority:0 "อำนาจชนเผ่าแบบชนเผ่ากระจัดกระจาย"
 game_concept_disparate_tribes_tribal_authority_desc:0 "$game_concept_disparate_tribes$ คือระดับต่ำสุดของ [tribal_authority|E] ในระดับนี้ [vassals|E] ไม่มีบทลงโทษ [opinion|E] ต่อ [liege|E] ของตน และเจ้าเหนือหัวไม่มีอำนาจใด ๆ เหนือพวกเขานอกเหนือจากความสามารถในการเรียกร้อง [levies|E] และ [taxes|E]"
 game_concept_limited_tribal:0 "จำกัด"
 game_concept_limited_tribal_authority:0 "อำนาจชนเผ่าจำกัด"
 game_concept_limited_tribal_authority_desc:0 "$game_concept_limited_tribal_authority$ คือระดับที่สองรองจากต่ำสุดของ [tribal_authority|E] [vassals|E] มีบทลงโทษ [opinion|E] #N -10#! ต่อ [liege|E] ของตน และตอนนี้เจ้าเหนือหัวอาจ [imprison|E] [characters|E] ใน [realm|E] ของตนได้"
 game_concept_high_tribal:0 "สูง"
 game_concept_high_tribal_authority:0 "อำนาจชนเผ่าสูง"
 game_concept_high_tribal_authority_desc:0 "$game_concept_high_tribal_authority$ คือระดับที่สองรองจากสูงสุดของ [tribal_authority|E] [vassals|E] มีบทลงโทษ [opinion|E] #N -20#! ต่อ [liege|E] ของตน\n\nในระดับนี้ เช่นเดียวกับความสามารถในการ [imprison|E] [characters|E] เจ้าเหนือหัวอาจ [revoke|E] [titles|E] และ [retract|E] ข้าหลวงของข้าหลวงได้"
 game_concept_absolute_tribal:0 "เด็ดขาด"
 game_concept_absolute_tribal_authority:0 "อำนาจชนเผ่าเด็ดขาด"
 game_concept_absolute_tribal_authority_desc:0 "$game_concept_absolute_tribal_authority$ คือระดับสูงสุดของ [tribal_authority|E]. [vassals|E] มีค่า [opinion|E] ติดลบ #N -30#! ต่อ [liege|E] ของตน.\n\nณ ระดับนี้ นอกเหนือจากผลของ [limited_tribal|E] และ [high_tribal_authority|E] แล้ว ผู้ปกครองสามารถตั้งถิ่นฐานและกลายเป็น [feudal|E] ได้.\n\nผู้ปกครอง [tribal|E] [GetReligionFamily('rf_pagan').GetName] ที่ยังไม่ปฏิรูป จำเป็นต้องมีกฎหมายนี้เพื่อปฏิรูป [faith|E] ของตน."
 game_concept_powerful_vassal:0 "ข้าหลวงผู้ทรงอำนาจ"
 game_concept_powerful_vassal_powerful:0 "ทรงอำนาจ"
 game_concept_powerful_vassals:0 "เหล่าข้าหลวงผู้ทรงอำนาจ"
 game_concept_powerful_vassal_possessive:0 "ของข้าหลวงผู้ทรงอำนาจ"
 game_concept_powerful_vassal_desc:1 "'$game_concept_powerful_vassals$' คือ [vassals|E] จำนวนหยิบมือที่มี [soldiers|E] มากที่สุดและ [income|E] สูงสุด ท่านต้องให้ความสนใจอย่างใกล้ชิดกับข้าหลวงเหล่านี้ เพราะพวกเขาคาดหวังที่จะได้ตำแหน่งใน [council|E] ของท่าน และจะมี [opinion|E] ต่อท่านต่ำลงอย่างมากหากไม่ได้รับตำแหน่ง\n\nการเปลี่ยน [succession_law|E] ต้องการให้ $game_concept_powerful_vassals$ ทั้งหมดมี [opinion|E] เป็นบวกต่อท่าน [cowed|E] โดยท่าน หรือถูก [imprisoned|E]"
 game_concept_realm_law:0 "กฎหมายอาณาจักร"
 game_concept_realm_law_desc:0 "กฎหมายที่ใช้กับอาณาจักรของตัวละครนี้ เช่น ระดับของ [crown_authority|E] หรือ [tribal_authority|E]"
 game_concept_title_law:0 "กฎหมายบรรดาศักดิ์"
 game_concept_title_laws:0 "กฎหมายบรรดาศักดิ์"
 game_concept_title_law_desc:1 "[titles|E] สามารถได้รับกฎหมาย [title_specific_succession|E] ที่เฉพาะเจาะจงสำหรับบรรดาศักดิ์นั้น กฎหมายนี้จะกำหนดกฎเกณฑ์การสืบทอดที่แตกต่างจากบรรดาศักดิ์อื่น ๆ ที่ตัวละครเดียวกันถือครอง"
 game_concept_strong_vassal:0 "ข้าหลวงผู้แข็งแกร่ง"
 game_concept_strong_vassals:0 "เหล่าข้าหลวงผู้แข็งแกร่ง"
 game_concept_strong_vassal_desc:0 "$game_concept_strong_vassal$ คือ [vassal|E] ที่มีอำนาจใกล้เคียงหรือเหนือกว่า [liege|E] ของตน ทำให้เกิดบทลงโทษ [opinion|E] #weak พวกเขามองว่าเจ้าเหนือหัวของตนอ่อนแอและไม่เหมาะสมที่จะปกครองอาณาจักร#!"
 game_concept_domain_limit:0 "ขีดจำกัดเขตปกครองส่วนตัว"
 game_concept_domain_limit_desc:0 "$game_concept_domain_limit$ เป็นตัวกำหนดจำนวน [holdings|E] ที่ท่านสามารถครอบครองได้อย่างถูกต้องตามกฎหมายใน [domain|E] ของท่าน $game_concept_domain_limit$ จะได้รับผลกระทบจากหลายปัจจัย เช่น [succession_law|E] ของท่าน และระดับของ [primary_title|E] ของท่าน\n\nแม้ท่านจะสามารถครอบครองเกิน $game_concept_domain_limit$ ของตนเองได้ แต่การทำเช่นนั้นจะลด [income|E] และ [opinions|E] ของ [vassal|E] ลง"
 game_concept_vassal_limit:0 "ขีดจำกัดข้าหลวง"
 game_concept_vassal_limit_desc:2 "$game_concept_vassal_limit$ กำหนดจำนวน [direct_vassals|E] ที่ท่านสามารถมีได้อย่างถูกกฎหมาย (ไม่รวมข้าหลวงระดับ [barony|E])\n\nแม้ว่าท่านจะสามารถมีเกิน $game_concept_vassal_limit$ ได้ การทำ เช่นนั้นจะลด [taxes|E] และ [levies|E] ที่ข้าหลวงของท่านมอบให้ และท่านอาจจะดีกว่าหาก [transferring|E] ข้าหลวงบางส่วน เพื่อให้ต่ำกว่าขีดจำกัด"
 game_concept_leasing:0 "การให้เช่าที่ดิน"
 game_concept_lease:0 "สัญญาเช่า"
 game_concept_leases:0 "สัญญาเช่า"
 game_concept_leased:0 "ถูกให้เช่า"
 game_concept_lessee:0 "ผู้เช่า"
 game_concept_leasing_desc:1 "[baronies|E] รองสามารถ $game_concept_leased$ ให้กับ [holy_orders|E] หรือ [clergy|E] ได้ บารอนีที่ให้เช่าจะให้ [taxes|E] และ [levies|E] แก่ [lessee|E] แทนที่จะเป็น [holder|E]\n\nคณะนักรบศักดิ์สิทธิ์สามารถเช่า [castle_holdings|E] ในขณะที่นักบวชสามารถเช่า [temple_holdings|E] ได้\n\n[holdings|E] ที่ให้เช่ายังคงถือเป็นส่วนหนึ่งของ [realm|E] ของผู้ถือครอง [county_capitals|E] ไม่สามารถให้เช่าได้"
 game_concept_succession:0 "การสืบทอด"
 game_concept_succession_desc:1 "$game_concept_succession$ เกิดขึ้นเมื่อ [ruler|E] เสียชีวิต โดยแบ่ง [gold|E] และ [titles|E] ของตนให้กับ [heirs|E] ตาม [succession_laws|E]\n\nผู้เล่นจะเล่นต่อไปในฐานะ [player_heir|E] ของตน แม้ว่าจะสูญเสียบรรดาศักดิ์บางส่วนให้กับตัวละครอื่น\n\nหากไม่มีทายาทของผู้เล่น เกมจะจบลง\n\n#weak สถานการณ์ที่หายากบางอย่างสามารถบังคับให้เกิดการสืบทอดได้แม้กระทั่งก่อนที่ผู้ปกครองจะเสียชีวิต เช่น การแพ้ [excommunication_war|E] อย่างไรก็ตาม ตามกฎหมายแล้ว ผู้ปกครองไม่สามารถเลือกที่จะสละตำแหน่งได้ด้วยตนเอง#!"
 game_concept_heir:0 "ทายาท"
 game_concept_heirs:0 "เหล่าทายาท"
 game_concept_heir_possessive: "ของทายาท"
 game_concept_heir_desc:3 "ทายาทคือตัวละครที่มีสิทธิ์สืบทอด [titles|E] อย่างน้อยหนึ่งตำแหน่ง\n\nทุก [title|E] ที่ถือครองจะมี $game_concept_heir$ ซึ่งกำหนดโดย [succession_laws|E] ของ [holder|E] ปัจจุบัน เมื่อผู้ถือครองบรรดาศักดิ์ปัจจุบันเสียชีวิต หรือเกิด [succession|E] ด้วยเหตุอื่น $game_concept_heir$ ปัจจุบันของบรรดาศักดิ์นั้นจะสืบทอดตำแหน่ง\n\nโปรดทราบว่าบรรดาศักดิ์ที่ [ruler|E] คนเดียวกันถือครองอาจมี $game_concept_heirs$ ที่แตกต่างกัน ที่สำคัญที่สุดคือ [primary_title|E] จะถูกสืบทอดโดย [primary_heir|E] และผู้เล่นจะเล่นต่อไปในฐานะ [player_heir|E] ของตน"
 game_concept_primary_heir:0 "ทายาทหลัก"
 game_concept_primary_heirs:0 "เหล่าทายาทหลัก"
 game_concept_primary_heir_possessive: "ของทายาทหลัก"
 game_concept_primary_heir_desc:0 "$game_concept_primary_heir$ คือตัวละครที่จะสืบทอด [primary_title|E] ของ [ruler|E] เมื่อเกิด [succession|E] โดยปกติแล้ว — แต่ไม่เสมอไป — จะเป็นตัวละครเดียวกับ [player_heir|E]"
 game_concept_player_heir:0 "ทายาทของผู้เล่น"
 game_concept_player_heir_desc: "$game_concept_player_heir$ คือ [heir|E] ที่ผู้เล่นจะเล่นต่อไปเมื่อเกิด [succession|E]\n\nโดยปกติแล้ว $game_concept_player_heir$ จะเป็นบุคคลเดียวกับ [primary_heir|E] ทว่าหาก [succession_law|E] ใน [primary_title|E] ของท่านกำหนดให้ตำแหน่งนั้นตกเป็นของตัวละครภายนอก [dynasty|E] ของท่าน ท่านก็จะเปลี่ยนไปเล่นเป็นผู้สืบทอดทางราชวงศ์ของตำแหน่งที่สูงเป็นอันดับสอง (หรืออันดับสาม อันดับสี่ ฯลฯ) แทน\n\nสถานการณ์นี้มักเกิดขึ้นเมื่อ $game_concept_player_heir$ ของท่านถูกโหวตออกภายใต้กฎการสืบสันตติวงศ์แบบเลือกตั้ง หากท่านเป็น [house_head|E] ของ [noble_family|E] ใน [realm|E] แบบ [administrative|E] ท่านอาจสูญเสียอาณาจักรให้แก่ทายาทหลักที่อยู่นอกเหนือ [house|E] ของท่าน แต่ยังคงรักษาบรรดาศักดิ์ของตระกูลขุนนางไว้ได้"
 game_concept_title_heir:0 "ทายาทบรรดาศักดิ์"
 game_concept_title_heirs:0 "เหล่าทายาทบรรดาศักดิ์"
 game_concept_title_heir_desc:0 "ทายาทบรรดาศักดิ์คือ [heir|E] ของ [title|E] ที่เฉพาะเจาะจง ซึ่งมี [title_succession|E] ของตนเอง พวกเขาจะได้รับบรรดาศักดิ์นั้นเมื่อ [holder|E] ปัจจุบันเสียชีวิต"
 game_concept_realm_heir:0 "ทายาทอาณาจักร"
 game_concept_realm_heirs:0 "เหล่าทายาทอาณาจักร"
 game_concept_realm_heir_desc:0 "ทายาทอาณาจักรคือหนึ่งใน [heirs|E] ของ [realm|E] และจะได้รับ [titles|E] ทั้งหมดหรือบางส่วนที่ [ruler|E] ของอาณาจักรนั้นถือครองเมื่อผู้ปกครองนั้นเสียชีวิต\n\nอาณาจักรอาจมีทายาทอาณาจักรหนึ่งคนหรือมากกว่านั้นขึ้นอยู่กับ [succession_law|E] ของตน"
 game_concept_disinherit:0 "ตัดออกจากกองมรดก"
 game_concept_disinherited:0 "ถูกตัดออกจากกองมรดก"
 game_concept_disinheriting:0 "การตัดออกจากกองมรดก"
 game_concept_disinherits:0 "ตัดออกจากกองมรดก"
 game_concept_disinherit_desc:1 "[dynast|E] อาจตัดสมาชิกใน [dynasty|E] ของตนออกจากกองมรดกโดยเสียค่า [dynasty_prestige|E]\n\nการกระทำนี้จะลบสมาชิกตระกูลออกจาก [line_of_succession|E] ปกติของบรรดาศักดิ์ใด ๆ ที่สมาชิกตระกูลคนอื่นถือครองอยู่ในปัจจุบัน"
 game_concept_council:0 "สภาที่ปรึกษา"
 game_concept_council_i: "@council_icon!"
 game_concept_council_desc:0 "$game_concept_council$ ประกอบด้วย [councillors|E] หกคน ซึ่งช่วยเหลือ [ruler|E] ของตนในการบริหาร [realm|E] ในฐานะหัวหน้าหน่วยงานที่เกี่ยวข้อง พวกเขาสามารถได้รับมอบหมาย [councillor_tasks|E] ที่สำคัญต่าง ๆ"
 game_concept_councillor:0 "ที่ปรึกษา"
 game_concept_councillors:0 "เหล่าที่ปรึกษา"
 game_concept_councillor_desc: "สมาชิกสภาคือผู้ช่วยหลักของ [ruler|E] ทุกคน และเป็นผู้ประกอบกันเป็น [council|E] โดยมีตำแหน่งในสภาอยู่ 6 ตำแหน่ง ได้แก่: [chancellor|E], [marshal|E], [steward|E], [spymaster|E], [court_chaplain|E] (หรือ [realm_priest|E]) และสุดท้ายคือ [spouse|E] ของท่าน\n\nแต่ละคนจะมีหน้าที่รับผิดชอบในหน่วยงานที่สามารถมอบหมาย [councillor_tasks|E] ต่างๆ ให้ปฏิบัติได้\n\n[powerful_vassals|E] จะไม่พอใจหากไม่ได้รับการแต่งตั้งให้อยู่ในตำแหน่งใดตำแหน่งหนึ่งเหล่านี้ ซึ่งหมายความว่าท่านมักจะต้องเลือกระหว่างการเอาใจข้าหลวงผู้ทรงอำนาจ หรือการแต่งตั้งผู้ที่มีความสามารถอย่างแท้จริง\n\nการทำหน้าที่เป็นสมาชิกสภาให้แก่ [liege|E] ของท่านจะมอบโบนัสให้ ซึ่งจะเพิ่มขึ้นตาม [rank|E] ของผู้นำ"
 game_concept_councillor_task:0 "ภารกิจที่ปรึกษา"
 game_concept_councillor_tasks:0 "ภารกิจที่ปรึกษา"
 game_concept_councillor_task_desc:1 "$game_concept_councillor_tasks$ คืองานสำคัญที่สามารถมอบหมายให้ [councillors|E] ของท่านได้ งานเหล่านี้อาจเป็นงานทั่วไปหรือกำหนดเป้าหมายเฉพาะเจาะจงไปยัง [county|E] หรือ [court|E]\n\nหากท่านมีความสัมพันธ์ [relation|E] กับที่ปรึกษา งานที่ต้องใช้เวลาอาจใช้เวลามากขึ้นหรือน้อยลง\n\n#weak โปรดทราบว่าที่ปรึกษาไม่ได้ปรากฏตัวทางกายภาพเพื่อปฏิบัติงานเหล่านี้ แต่เป็นเพียงผู้นำความพยายามเท่านั้น#!"
 game_concept_councillor_task_possible_side_effects:0 "ผลข้างเคียงที่เป็นไปได้"
 game_concept_councillor_task_possible_side_effects_desc:2 "[councillor_task|E] อาจมีผลกระทบที่ไม่คาดคิดเมื่อเวลาผ่านไป สิ่งเหล่านี้อาจดีหรือไม่ดี โดยผลกระทบเชิงบวกมีแนวโน้มมากขึ้นเมื่อ [skill|E] ที่เกี่ยวข้องของที่ปรึกษาสูงขึ้น และผลกระทบเชิงลบมีแนวโน้มมากขึ้นเมื่อทักษะที่เกี่ยวข้องต่ำลง"
 game_concept_chancellor:0 "อัครเสนาบดี"
 game_concept_chancellors:0 "เหล่าอัครเสนาบดี"
 game_concept_chancellor_desc:0 "$game_concept_chancellor$ คือ [councillor|E] ที่รับผิดชอบความพยายามทางการทูต ทั้งภายในและภายนอก [realm|E]"
 game_concept_steward:0 "สมุหพระคลัง"
 game_concept_stewards:0 "เหล่าสมุหพระคลัง"
 game_concept_steward_desc:0 "$game_concept_steward$ คือ [councillor|E] ที่รับผิดชอบการบริหาร [domain|E] ตัวอย่าง เช่น เรื่องของ [taxation|E], [culture|E] และ [development|E]"
 game_concept_marshal:0 "สมุหกลาโหม"
 game_concept_marshals:0 "เหล่าสมุหกลาโหม"
 game_concept_marshal_desc:0 "$game_concept_marshal$ คือ [commander|E] หลักของท่านและ [councillor|E] ที่รับผิดชอบเรื่องการทหารโดยทั่วไป"
 game_concept_spymaster:0 "จารชนเอก"
 game_concept_spymaster_desc:1 "$game_concept_spymaster$ คือ [councillor|E] ของท่านที่รับผิดชอบเรื่องอุบายและข่าวกรอง ระวังการมีจารชนเอกที่ไม่ภักดี เพราะพวกเขาสามารถปกปิดและเข้าร่วมใน [GetScheme('murder').GetTypeName] ต่อต้านท่านและครอบครัวใกล้ชิดของท่านได้อย่างง่ายดาย!"
 game_concept_court_chaplain:0 "อนุศาสนาจารย์ประจำราชสำนัก"
 game_concept_court_chaplains:0 "เหล่าอนุศาสนาจารย์ประจำราชสำนัก"
 game_concept_court_chaplain_desc:0 "$game_concept_court_chaplain$ คือ [councillor|E] ที่รับผิดชอบกิจการทางศาสนาและจิตวิญญาณใน [faiths|E] ที่มี [doctrine|E] [GetFaithDoctrine('doctrine_theocracy_lay_clergy').GetBaseName]\n\nนิกายที่มีหลักคำสอน [GetFaithDoctrine('doctrine_theocracy_temporal').GetBaseName] จะมี [realm_priest|E] ที่ทรงอำนาจกว่า (และสร้างปัญหามากกว่า) แทน $game_concept_court_chaplain$"
 game_concept_realm_priest:0 "สมณะแห่งอาณาจักร"
 game_concept_realm_priests:0 "เหล่าสมณะแห่งอาณาจักร"
 game_concept_realm_priest_possessive:0 "ของสมณะแห่งอาณาจักร"
 game_concept_realm_priest_desc:0 "$game_concept_realm_priest$ คือ [councillor|E] ที่รับผิดชอบกิจการทางศาสนาและจิตวิญญาณใน [faiths|E] ที่มี [doctrine|E] [GetFaithDoctrine('doctrine_theocracy_temporal').GetBaseName]\n\nแตกต่างจากตำแหน่งเทียบเท่าใน [GetFaithDoctrine('doctrine_theocracy_lay_clergy').GetBaseName] ([court_chaplains|E]) $game_concept_realm_priests$ จะ [lease|E] [temple_holdings|E] ทั้งหมดใน [domain|E] ของ [ruler|E] โดยอัตโนมัติ และยังได้รับส่วนหนึ่งของ [taxes|E] และ [levies|E] จาก $game_concept_realm_priests$ ที่เป็น [vassal|E]\n\n$game_concept_realm_priests$ จะมอบไพร่พลและภาษีให้แก่ [liege|E] ของตนหากพวกเขามีทัศนคติเชิงบวกต่อเจ้าเหนือหัว ยิ่ง [opinion|E] ที่มีต่อ [liege|E] สูงเท่าไร พวกเขาก็จะยิ่งมอบให้มากขึ้นเท่านั้น\n\n$game_concept_realm_priests$ ที่มีทัศนคติต่ำต่อเจ้าเหนือหัวของตนจะไม่มอบภาษีหรือไพร่พลใด ๆ ให้ และอาจก่อปัญหาได้"
 game_concept_law:0 "กฎหมาย"
 game_concept_laws:0 "กฎหมาย"
 game_concept_law_i: "@law_icon!"
 game_concept_law_desc: "กฎหมาย [realm_possessive|E] เป็นตัวกำหนดโครงสร้างของอาณาจักรนั้น\n\nสิ่งที่เป็นรากฐานที่สุดคือ [crown_authority|E] ของอาณาจักร (หรือ [tribal_authority|E] สำหรับ [tribes|E], [imperial_bureaucracy|E] สำหรับ [administrative|E] และ [nomadic_authority|E] สำหรับ [nomads|E]) เนื่องจากกฎหมายเหล่านั้นกำหนดว่า [lieges|E] และ [vassals|E] มีปฏิสัมพันธ์ต่อกันอย่างไรเป็นนิจ\n\nแม้ว่าจะมีผลกระทบต่อชีวิตประจำวันของ [rulers|E] ในอาณาจักรน้อยกว่า แต่ [succession_laws|E] และ [title_laws|E] ก็ยังคงมีความสำคัญอย่างยิ่งที่ต้องพิจารณาเพื่อ [succession|E]"
 game_concept_succession_law:0 "กฎหมายการสืบทอด"
 game_concept_succession_laws:0 "กฎหมายการสืบทอด"
 game_concept_succession_law_desc:2 "[ruler|E] ทุกคนมีกฎการสืบตำแหน่งหลัก ซึ่งกำหนดสิ่งที่จะเกิดขึ้นกับ [titles|E] ของพวกเขาเมื่อมีการ [succession|E]\n\nนอกจากนี้ ตำแหน่งยศ แต่ละตำแหน่งอาจมีกฎ [title_succession|E] เป็นของตนเอง ซึ่งมีความสำคัญเหนือกว่ากฎพื้นฐาน ตัวอย่าง เช่น จักรวรรดิโรมันอันศักดิ์สิทธิ์อาจใช้ระบบการเลือกตั้ง แม้ว่าจักรพรรดิจะใช้กฎการแบ่งส่วนเป็นกฎการสืบตำแหน่งหลักก็ตาม\n\nท่านสามารถเปลี่ยนกฎการสืบตำแหน่งได้ก็ต่อเมื่อมีระดับ [crown_authority|E] ที่เหมาะสมเท่านั้น"
 game_concept_religious_head_succession_law:0 "กฎหมายการสืบทอดประมุขนิกาย"
 game_concept_religious_head_succession_law_short:0 "กฎหมายประมุขนิกาย"
 game_concept_religious_head_succession_laws:0 "กฎหมายการสืบทอดประมุขนิกาย"
 game_concept_religious_head_succession_laws_short:0 "กฎหมายประมุขนิกาย"
 game_concept_religious_head_succession_law_desc:0 "[rulers|E] ที่เป็น [heads_of_faith|E] ด้วยจะมีกฎหมาย [succession|E] ของอาณาจักรเพิ่มเติม โดยกำหนดให้ [heir|E] ของตนต้องมี [faith|E] เดียวกันกับตน สิ่งนี้ไม่สามารถเปลี่ยนแปลงได้ และ [titles|E] ของ $game_concept_head_of_faith$ ไม่สามารถมี [title_succession|E] แยกต่างหากได้ วิธีเดียวที่จะลบกฎหมายอาณาจักรประเภทนี้คือให้กองกำลังภายนอกทำลาย $game_concept_title$ ของ [head_of_faith|E]"
 game_concept_opinion:0 "ทัศนคติ"
 game_concept_opinions:0 "ทัศนคติ"
 game_concept_opinion_i:0 "@opinion_icon!"
 game_concept_opinion_desc:1 "ตัวละครทุกตัวมี $game_concept_opinion$ ทางเดียวต่อตัวละครอื่นทุกตัว แสดงด้วยค่าตั้งแต่ #N -100#! ถึง #P +100#!.\n\nทัศนคติที่ตัวละครอื่นมีต่อท่านมีความสำคัญอย่างยิ่ง เพราะมันจะขับเคลื่อนพฤติกรรมของพวกเขา!\n\nท่านควรระวังทัศนคติของ [powerful_vassals|E], [spymaster|E] และ [spouse|E] ของท่านเป็นพิเศษ"
 game_concept_faction:0 "กลุ่มอิทธิพล"
 game_concept_factions:0 "กลุ่มอิทธิพล"
 game_concept_faction_desc: "$game_concept_faction$ คือกลุ่มของ [vassals|E] ที่มีผลประโยชน์ทางการเมืองร่วมกัน ประชากรท้องถิ่นใน [counties|E] ยังสามารถเข้าร่วมกลุ่มแยกบางประเภทได้ด้วย เช่น กลุ่มแยกชาวนา\n\nกลุ่มแยกจะกลายเป็นอันตรายเมื่อ [faction_discontent|E] ของพวกเขาถึงจุดที่กำหนด ซึ่งในเวลานั้นพวกเขาจะยื่นคำขาด\n\nหาก [liege|E] ไม่ยอมปฏิบัติตาม กลุ่มแยกจะลุกฮือขึ้นก่อกบฏ ทำให้เกิด [civil_war|E] หากกลุ่มแยกสลายตัว ผู้นำต้องมี [war_score|E] อย่างน้อย [GetDefine( 'NFaction', 'MIN_WARSCORE_FOR_VICTORY_ON_FACTION_INVALIDATION' )|V0] จึงจะชนะสงครามได้"
 game_concept_faction_discontent:0 "ความไม่พอใจ"
 game_concept_discontent:0 "ความไม่พอใจ"
 game_concept_faction_discontent_desc: "$game_concept_faction_discontent$ เป็นเครื่องวัดว่า [faction|E] เข้าใกล้การยื่นคำขาดมากเพียงใด\n\nหาก [military_power|E] ของกลุ่มแยกถึงเกณฑ์ที่กำหนด ความไม่พอใจจะเพิ่มขึ้นทุกเดือน หากพลังทหารต่ำกว่าเกณฑ์ ความไม่พอใจจะลดลง กลุ่มแยกที่มีอำนาจมากจะมีความไม่พอใจเพิ่มขึ้นอย่างรวดเร็ว"
 game_concept_military_power:0 "กำลังทหาร"
 game_concept_faction_military_power:0 "กำลังทหารของกลุ่มอิทธิพล"
 game_concept_faction_military_power_desc:0 "$game_concept_faction_military_power$ เป็นตัวชี้วัดความแข็งแกร่งทางทหารทั้งหมดของ [faction|E] เทียบกับเป้าหมายของพวกเขา\n\nสมาชิกกลุ่มอิทธิพล แต่ละคนจะเพิ่มความแข็งแกร่งเต็มที่ให้กับกลุ่มตราบเท่าที่พวกเขายังคงอยู่ในกลุ่ม หากเป้าหมายของกลุ่มคือ [liege|E] ของสมาชิก ความแข็งแกร่งของสมาชิกจะถูกหักออกจากอำนาจสัมพัทธ์ของเจ้าเหนือหัวด้วย"
 game_concept_scheme:0 "อุบาย"
 game_concept_scheming:0 "การวางอุบาย"
 game_concept_schemes:0 "อุบาย"
 game_concept_scheme_desc:3 "$game_concept_scheme$ คือความพยายามระยะยาวที่จะส่งผลกระทบต่อโลกรอบตัวท่าน $game_concept_schemes$ สามารถกำหนดเป้าหมายไปที่ [characters|e], [titles|e], [cultures|e] และ [faiths|e] และมีสี่ประเภท: [personal|e], [scheme_hostile|e], [political|e], และ [contract_schemes|e]\n\n[success_chance|e] ของ $game_concept_scheme$ ของท่านจะเพิ่มขึ้นเมื่อเวลาผ่านไป ขึ้นอยู่กับว่าท่านมีความเชี่ยวชาญใน [skill|e] ที่เกี่ยวข้องมากน้อยเพียงใด และยังสามารถได้รับผลกระทบจาก [agents|e] ที่ท่านวางแผน $game_concept_scheme$ ด้วย\n\n#WEAK [secret_schemes|e] จะถูกซ่อนจากเป้าหมาย แต่สามารถถูกค้นพบได้หาก [secrecy|e] ต่ำ #!"
 game_concept_scheme_countermeasure: "จุดเน้นมาตรการตอบโต้"
 game_concept_scheme_countermeasures: "จุดเน้นมาตรการตอบโต้"
 game_concept_scheme_countermeasure_countermeasure: "มาตรการตอบโต้"
 game_concept_scheme_countermeasure_countermeasures: "มาตรการตอบโต้"
 game_concept_scheme_countermeasure_desc: "เมื่อท่านสงสัยว่ามี [scheme|e] กำลังมุ่งเป้ามาที่ท่าน ท่านสามารถทำอะไรบางอย่างเกี่ยวกับเรื่องนี้ได้โดยการมุ่งเน้นการป้องกันทั้งหมดของท่านไปที่ $game_concept_scheme$ ประเภทหนึ่งโดยแลกกับการป้องกันประเภทอื่น ๆ\n\nด้วยเหตุนี้ จึงสามารถใช้งานได้เพียงอย่างเดียวใน แต่ละครั้ง การเสริมสร้างการป้องกันในพื้นที่หนึ่งเกี่ยวข้องกับการเบี่ยงเบนความสนใจจากพื้นที่อื่น\n\nสามารถใช้เพื่อลด [secrecy|E] หรือปรับ [success_chance|E] ของกลุ่ม $game_concept_schemes$ ต่าง ๆ ได้ อาจช่วยซื้อเวลาหรือเสริมการป้องกันของท่าน แต่ก็มีข้อเสีย ซึ่งหมายความว่าท่านไม่ต้องการใช้งานตลอดเวลา"
 game_concept_scheme_precaution: "มาตรการเสริม"
 game_concept_scheme_precautions: "มาตรการเสริม"
 game_concept_scheme_precaution_precaution: "มาตรการ"
 game_concept_scheme_precaution_precautions: "มาตรการ"
 game_concept_scheme_precaution_desc: "ไม่ใช่ทุก [character|E] ที่สามารถดำเนิน $game_concept_scheme$ ให้สำเร็จได้ด้วย [skill|E] เพียงอย่างเดียว — เมื่อ [scheme_target_target|E] แข็งแกร่งเกินไป การจ่ายเงินสำหรับ $game_concept_scheme_precautions$ สามารถช่วยชดเชยจุดอ่อนหนึ่งอย่างโดยแลกกับอีกอย่างหนึ่งได้\n\n#WEAK $game_concept_scheme_precaution_precautions$ เป็นทางเลือก: ใช้ตามยุทธวิธี#!"
 game_concept_personal_scheme:0 "อุบายส่วนตัว"
 game_concept_personal_schemes:0 "อุบายส่วนตัว"
 game_concept_personal:0 "ส่วนตัว"
 game_concept_personal_scheme_desc:0 "$game_concept_personal_schemes$ คือ [schemes|E] ที่มีเป้าหมายเพื่อสร้างสถานะระหว่าง [scheme_owner|E] และ [scheme_target|E]\n\nตัวอย่างของ $game_concept_personal_schemes$ คือ:\n$BULLET_WITH_TAB$[GetScheme('sway').GetTypeName]\n$BULLET_WITH_TAB$[GetScheme('befriend').GetTypeName]\n$BULLET_WITH_TAB$[GetScheme('seduce').GetTypeName]\n$BULLET_WITH_TAB$[GetScheme('elope').GetTypeName]"
 game_concept_scheme_owner:0 "เจ้าของอุบาย"
 game_concept_schemer:0 "ผู้วางอุบาย"
 game_concept_scheme_owners:0 "เจ้าของอุบาย"
 game_concept_scheme_owner_owner: "เจ้าของ"
 game_concept_scheme_owner_desc:0 "$game_concept_scheme_owner_owner$ ของ $game_concept_scheme$ คือ [character|E] ที่วางอุบายต่อต้าน [scheme_target|E]\n\n#WEAK ตัวอย่างเช่น ผู้ที่อาจเป็นฆาตกรใน $game_concept_scheme$ [GetScheme('murder').GetTypeName]#!"
 game_concept_scheme_target:0 "เป้าหมายอุบาย"
 game_concept_scheme_targets:0 "ของเป้าหมายอุบาย"
 game_concept_scheme_target_target:0 "เป้าหมาย"
 game_concept_scheme_target_desc:0 "$game_concept_scheme_target_target$ ของ $game_concept_scheme$ คือ [character|E] ที่ถูกวางอุบายต่อต้านโดย [scheme_owner|E]\n\n#WEAK ตัวอย่างเช่น ผู้ที่อาจเป็นเหยื่อใน $game_concept_scheme$ [GetScheme('murder').GetTypeName]#!"
 game_concept_secret_scheme:0 "อุบายลับ"
 game_concept_secret_scheme_single:0 "ลับ"
 game_concept_secret_schemes:0 "อุบายลับ"
 game_concept_secret_scheme_desc:0 "$game_concept_secret_scheme$ คือ [scheme|E] ที่ดำเนินไปโดยที่ [scheme_target|E] ไม่ทราบ\n\nอย่างไรก็ตาม มันสามารถถูกค้นพบได้ ซึ่ง ทำให้ [success_chance|E] ลดลง และเพิ่มโอกาสที่ [scheme_owner|E] จะถูกเปิดโปงเมื่ออุบายดำเนินการ\n\n[agents|E] ที่ถูกชักชวนเข้าร่วม $game_concept_secret_scheme$ มีโอกาสที่จะ [agent_discovery_discovered|E]"
 game_concept_agent:0 "ผู้สมรู้ร่วมคิด"
 game_concept_agents:0 "ผู้สมรู้ร่วมคิด"
 game_concept_agent_i:0 "@scheme_agent_icon!"
 game_concept_agents_desc:3 "$game_concept_agent$ คือผู้เข้าร่วมใน [scheme|E] ซึ่งสามารถให้ประโยชน์ได้สามประการ พวกเขาสามารถเพิ่ม [success_chance|e] ลด [scheme_speed_single|e] หรือปรับปรุง [secrecy|e] เฉพาะ [courtiers|E], [guests|E], และ [direct_vassals|E] ของเป้าหมายเท่านั้นที่สามารถชักชวนเป็นผู้สมรู้ร่วมคิดได้\n\nสำหรับอุบาย [scheme_hostile|E] การมีผู้สมรู้ร่วมคิดที่ใกล้ชิดกับเป้าหมายเป็นสิ่งสำคัญมาก ตัวอย่าง เช่น [councillors|E] หรือ [close_family|E] ของเป้าหมายอุบายมีส่วนช่วยใน $game_concept_scheme_speed_single$ และ $game_concept_success_chance$ มากกว่า\n\nการเป็น $game_concept_agent$ ใน [hostile_scheme|e] ถือเป็น [crime|E] และ $game_concept_agent$ เสี่ยงต่อการ [agent_discovery_discovered|E]"
 game_concept_agent_discovery:0 "การค้นพบผู้สมรู้ร่วมคิด"
 game_concept_agent_discovery_discovered:0 "ถูกค้นพบ"
 game_concept_agent_discovery_desc:1 "[agents|E] ของ [secret_scheme|E] ที่ถูกค้นพบอาจถูกมองว่าเป็น [criminals|E] โดย [liege|E] ของตน และมีแนวโน้มที่จะถูก [imprisoned|E] หากเป็น เช่นนั้น"
 game_concept_scheme_discovery_chance:0 "โอกาสการค้นพบอุบาย"
 game_concept_scheme_discovery_chance_desc:0 "ตัวเลขนี้จะถูกหักโดยตรงจากคะแนน [secrecy|E] ของ [secret_scheme|E] ใด ๆ ที่ต่อต้านท่านหรือ [courtiers|E] ของท่าน\n\n#WEAK $game_concept_secrecy$ จะถูกตรวจสอบเมื่อ $game_concept_scheme$ ดำเนินการ และในอัตราที่ลดลงเดือนละครั้ง#!"
 game_concept_predicted_scheme_difficulty: "ความยากของอุบายที่คาดการณ์"
 game_concept_predicted_difficulty: "ความยากที่คาดการณ์"
 game_concept_predicted_scheme_difficulty_desc: "มีปัจจัยหลายอย่างที่ส่งผลต่อความสำเร็จของ [scheme|E] ซึ่งบางอย่างไม่สามารถทราบได้จนกว่าจะเริ่มและมีการชักชวน [agents|E]\n\nแม้ว่า $game_concept_scheme$ ใด ๆ ก็เป็นไปได้ แต่หลายอย่างอาจมีค่าใช้จ่ายสูง\n\nระดับความยากห้าระดับคือ:\n$EFFECT_LIST_BULLET$$scheme_odds_prediction_level_excellent$ #WEAK — มีแนวโน้มที่จะง่าย รวดเร็ว และเงียบ#!\n$EFFECT_LIST_BULLET$$scheme_odds_prediction_level_high$ #WEAK — ต้องใช้ความพยายามน้อยที่สุด#!\n$EFFECT_LIST_BULLET$$scheme_odds_prediction_level_medium$ #WEAK — อาจต้องมีการติดสินบนเล็กน้อย#!\n$EFFECT_LIST_BULLET$$scheme_odds_prediction_level_low$ #WEAK — ความสำเร็จจะมีค่าใช้จ่ายสูง#!\n$EFFECT_LIST_BULLET$$scheme_odds_prediction_level_abysmal$ #WEAK — ความสำเร็จไม่น่าเป็นไปได้และมีค่าใช้จ่ายสูง#!"
 game_concept_prevented_murder:0 "การฆาตกรรมที่ถูกขัดขวาง"
 game_concept_prevented_murder_prevent:0 "ขัดขวาง"
 game_concept_prevented_murder_desc:2 "ในบางครั้ง สถานการณ์บางอย่างในชีวิตของ [scheme_target_target|E] ของ [GetScheme('murder').GetTypeName] อาจ ทำให้ [scheme|E] ล้มเหลวในขั้นตอนสุดท้ายของการดำเนินการ\n\nสิ่งนี้จะแทนที่ [success_chance|E]\n\n#WEAK ตัวอย่างรวมถึงการแทรกแซงโดยองครักษ์ ผู้ชิมอาหาร โล่กำบังหญิง หรือสัตว์เลี้ยงที่ภักดี#!"
 game_concept_political_scheme: "อุบายทางการเมือง"
 game_concept_political_schemes: "อุบายทางการเมือง"
 game_concept_political: "ทางการเมือง"
 game_concept_political_scheme_desc: "[SelectLocalization( HasDlcFeature( 'all_under_heaven' ), 'game_concept_political_scheme_desc_tgp', 'game_concept_political_scheme_desc_default' )]"
 game_concept_political_scheme_desc_default: "$game_concept_political_schemes$ รวมถึง [schemes|E] ทั้งหมดที่ใช้โดย [administrative_governments|E] แต่เพียงผู้เดียว ประกอบด้วย:\n$BULLET_WITH_TAB$[GetScheme('challenge_status').GetTypeName]\n$BULLET_WITH_TAB$[GetScheme('depose').GetTypeName]\n$BULLET_WITH_TAB$[GetScheme('expand_power_base').GetTypeName]\n$BULLET_WITH_TAB$[GetScheme('generate_claim').GetTypeName]\n$BULLET_WITH_TAB$[GetScheme('promote').GetTypeName]\n$BULLET_WITH_TAB$[GetScheme('slander').GetTypeName]\n"
 game_concept_political_scheme_desc_tgp: "$game_concept_political_schemes$ รวมถึง [schemes|E] อันมีลักษณะทางการเมืองและระบบข้าราชการเป็นสำคัญ ซึ่งมักใช้โดยประเภท [administrative|E] และ [mandala_government|E]\n\nแผนการทางการเมืองฝ่ายปกครอง:\n$BULLET_WITH_TAB$[GetScheme('challenge_status').GetTypeName]\n$BULLET_WITH_TAB$[GetScheme('depose').GetTypeName]\n$BULLET_WITH_TAB$[GetScheme('expand_power_base').GetTypeName]\n$BULLET_WITH_TAB$[GetScheme('generate_claim').GetTypeName]\n$BULLET_WITH_TAB$[GetScheme('promote').GetTypeName]\n$BULLET_WITH_TAB$[GetScheme('slander').GetTypeName]\n\nแผนการทางการเมืองมณฑล:\n$BULLET_WITH_TAB$[GetScheme('coerce_tributary').GetTypeName]\n"
 game_concept_hostile_scheme:0 "อุบายมุ่งร้าย"
 game_concept_scheme_hostile:0 "มุ่งร้าย"
 game_concept_hostile_schemes:0 "อุบายมุ่งร้าย"
 game_concept_hostile_scheme_desc:5 "$game_concept_hostile_schemes$ คือ [schemes|E] ที่มีเป้าหมายเพื่อก่อให้เกิดอันตรายต่อ [character|E] $game_concept_hostile_schemes$ ส่วนใหญ่ใช้ [secrecy|E]\n\nตัวอย่างของ $game_concept_hostile_schemes$ คือ:\n$BULLET_WITH_TAB$[GetScheme('murder').GetTypeName]\n$BULLET_WITH_TAB$[GetScheme('abduct').GetTypeName]\n$BULLET_WITH_TAB$[GetScheme('claim_throne').GetTypeName]\n$BULLET_WITH_TAB$[GetScheme('fabricate_hook').GetTypeName]"
 game_concept_scheme_phase: "ช่วงอุบาย"
 game_concept_scheme_phases: "ช่วงอุบาย"
 game_concept_scheme_phase_phase: "ช่วง"
 game_concept_scheme_phase_phases: "ช่วง"
 game_concept_scheme_phase_desc: "$game_concept_scheme_phase_phase$ คือระยะเวลาที่ใช้ในการเพิ่ม [scheme_success_chance|E] #EMP หนึ่งครั้ง#!.\n\nใน แต่ละ $game_concept_scheme_phase_phase$ $game_concept_scheme$ จะได้รับ [scheme_opportunity_opportunity|e] [scheme_speed_single|e] สามารถ ทำให้สั้นลงได้โดยการ แต่งตั้ง [agents|e] และจะเพิ่มขึ้นตาม [scheme_resistance|e] ของเป้าหมาย"
 game_concept_secret:0 "ความลับ"
 game_concept_secrets:0 "ความลับ"
 game_concept_secret_desc:0 "$game_concept_secrets$ คือสิ่งที่ตัวละครไม่ต้องการให้ผู้อื่นรู้ เพราะเป็นเรื่องน่าอับอาย ผิดศีลธรรม หรือเป็น [criminal|E] อย่างชัดเจน\n\nความลับสามารถถูกค้นพบได้ผ่าน [councillor_task|E] '$task_find_secrets$' สำหรับ [spymaster|E] เมื่อท่านรู้ $game_concept_secret$ ของใครบางคน ท่านสามารถ [blackmail|E] ตัวละครนั้นเพื่อรับ [hook|E]"


#RANKS/TIERS
 game_concept_barony:0 "บารอนี"
 game_concept_baronies:0 "บารอนี"
 game_concept_barons:0 "บารอน"
 game_concept_baron:0 "บารอน"
 game_concept_barony_desc: "$game_concept_barony$ คือ [title|E] ของ [title_tier|E] ต่ำสุด\n\n$game_concept_baronies$ มีพื้นที่เล็กที่สุดในแผนที่ จัดรวมกันเป็น [counties|E] ที่ใหญ่ขึ้น\n\n$game_concept_titles$ $game_concept_barony$ ต้องมี [holder|E] เสมอหากมี [holding|E] อยู่ภายใน"
 game_concept_baron_desc: "$game_concept_baron$ คือ [ruler|E] ที่มี [primary_title|E] เป็น [barony|E]\n\n[rank|E] ของพวกเขาต่ำที่สุด เป็นรองเพียง [counts|E] ดังนั้นพวกเขาจึงไม่สามารถมี [vassals|E] ได้ และใครก็ตามที่ไม่ใช่ $game_concept_baron$ สามารถเป็น [liege|E] ของพวกเขาได้"

 game_concept_county:0 "เคาน์ตี"
 game_concept_counties:0 "เคาน์ตี"
 game_concept_count:0 "เคานต์"
 game_concept_counts:0 "เคานต์"
 game_concept_county_desc: "$game_concept_county$ คือ [title|E] ที่มี [title_tier|E] ต่ำกว่า [duchy|E] หนึ่งขั้นและสูงกว่า [barony|E] หนึ่งขั้น\n\n$game_concept_title$ รวมไปถึง [county_capital|E] ใน $game_concept_county$ นั้นๆ เช่นเดียวกับสิทธิ์ตาม [de_jure|E] เหนือ [baronies|E] ทั้งหมดใน $game_concept_county$\n\n$game_concept_counties$ มี [holders|E] เสมอ เพราะ $game_concept_county_capitals$ ไม่สามารถทำลายได้"
 game_concept_count_desc: "$game_concept_count$ คือ [ruler|E] ที่มี [primary_title|E] เป็น [county|E]\n\n[rank|E] ของพวกเขาอยู่เหนือ [barons|E] และอยู่ใต้ [dukes|E] เท่านั้น ดังนั้นพวกเขาจึงสามารถมี $game_concept_barons$ เป็น [vassals|E] ได้ และมี $game_concept_duke$ หรือสูงกว่าเป็น [liege|E] ได้"

 game_concept_duchy:0 "ดัชชี"
 game_concept_duchies:0 "ดัชชี"
 game_concept_duke:0 "ดยุก"
 game_concept_dukes: "ดยุก"
 game_concept_duchy_desc: "$game_concept_duchy$ คือ [title|E] ที่มี [title_tier|E] ต่ำกว่า [kingdom|E] หนึ่งขั้นและสูงกว่า [county|E] หนึ่งขั้น\n\n[holder|E] ของ $game_concept_duchy$ มีสิทธิ์ตาม [de_jure|E] เหนือ $game_concept_counties$ ที่เป็นองค์ประกอบและสามารถมี [counts|E] เป็น [vassals|E] ได้\n\nดัชชีอาจว่างเว้นและไม่มีผู้ถือครองในปัจจุบัน $game_concept_title_succession$ ดังกล่าวสามารถสร้างขึ้นโดย [ruler|E] ที่ควบคุม $game_concept_counties$ อย่างน้อยครึ่งหนึ่งของดัชชีนั้น"
 game_concept_duke_desc: "$game_concept_duke$ คือ [ruler|E] ที่มี [primary_title|E] เป็น [duchy|E]\n\n[rank|E] ของพวกเขาอยู่เหนือ [counts|E] และอยู่ใต้ [kings|E] โดยตรง ดังนั้นพวกเขาจึงสามารถมี $game_concept_counts$ เป็น [vassals|E] ได้ และมี $game_concept_king$ หรือสูงกว่าเป็น [liege|E] ได้"

 game_concept_kingdom:0 "ราชอาณาจักร"
 game_concept_kingdoms:0 "ราชอาณาจักร"
 game_concept_king:0 "พระราชา"
 game_concept_kings:0 "พระราชา"
 game_concept_kingdom_desc: "$game_concept_kingdom$ คือ [title|E] ที่มี [title_tier|E] ต่ำกว่า [empire|E] หนึ่งขั้นและสูงกว่า [duchy|E] หนึ่งขั้น\n\n[holder|E] ของ $game_concept_kingdom$ มีสิทธิ์ตาม [de_jure|E] เหนือดินแดนที่เป็นองค์ประกอบ\n\n$game_concept_kingdoms$ อาจว่างเว้นและไม่มี $game_concept_holder$ ในปัจจุบัน $game_concept_titles$ ดังกล่าวสามารถสร้างขึ้นโดย [ruler|E] ที่ควบคุม [counties|E] ภายในอย่างน้อยครึ่งหนึ่ง"
 game_concept_king_desc: "$game_concept_king$ คือ [ruler|E] ที่มี [primary_title|E] เป็น [kingdom|E]\n\n[rank|E] ของพวกเขาอยู่เหนือ [dukes|E] และอยู่ใต้ [emperors|E] โดยตรง ดังนั้นพวกเขาจึงสามารถมี $game_concept_dukes$ และต่ำกว่าเป็น [vassals|E] ได้ และมี $game_concept_emperor$ หรือสูงกว่าเป็น [liege|E] ได้"

 game_concept_empire:0 "จักรวรรดิ"
 game_concept_empires:0 "จักรวรรดิ"
 game_concept_emperor:0 "จักรพรรดิ"
 game_concept_emperors:0 "จักรพรรดิ"
 game_concept_empire_desc: "$game_concept_empire$ คือ [title|E] ที่มี [title_tier|E] ต่ำกว่า [hegemony|E] หนึ่งขั้นและสูงกว่า [kingdom|E] หนึ่งขั้น\n\n[holder|E] ของจักรวรรดิมีสิทธิ์ตาม [de_jure|E] เหนือดินแดนที่เป็นองค์ประกอบและสามารถมี [kings|E] เป็น [vassals|E] ได้\n\n$game_concept_empires$ อาจว่างเว้นและไม่มี $game_concept_holder$ ในปัจจุบัน $game_concept_titles$ ดังกล่าวสามารถสร้างขึ้นโดย [ruler|E] ที่ควบคุม [counties|E] ภายในมากกว่า 80%"
 game_concept_emperor_desc: "$game_concept_emperor$ คือ [ruler|E] ที่มี [primary_title|E] เป็น [empire|E]\n\n[rank|E] ของพวกเขาอยู่เหนือ [kings|E] และอยู่ใต้ [hegemons|E] โดยตรง ดังนั้นพวกเขาจึงสามารถมี $game_concept_kings$ และต่ำกว่าเป็น [vassals|E] ได้ และมีเพียง $game_concept_hegemon$ เป็น [liege|E] ได้เท่านั้น"

 game_concept_hegemony: "อธิราชย์"
 game_concept_hegemonies: "เหล่าอธิราชย์"
 game_concept_hegemon: "อธิราช"
 game_concept_hegemons: "เหล่าอธิราช"
 game_concept_hegemony_desc: "$game_concept_hegemony$ คือ [title|E] ของ [title_tier|E] สูงสุด\n\n[holder|E] ของ $game_concept_hegemony$ มีสิทธิ์ตาม [de_jure|E] เหนือดินแดนที่เป็นองค์ประกอบและสามารถมี [emperors|E] เป็น [vassals|E] ได้"
 game_concept_hegemon_desc: "$game_concept_hegemon$ คือ [ruler|E] ที่มี [primary_title|E] เป็น [hegemony|E]\n\n[rank|E] ของพวกเขาสูงที่สุด อยู่เหนือ [emperors|E] โดยตรง ดังนั้นพวกเขาจึงสามารถมีใครก็ตามที่ไม่ใช่ $game_concept_hegemons$ เป็น [vassals|E] ได้ และพวกเขาไม่มีวันมี [liege|E] ได้เลย"


 game_concept_culture:0 "วัฒนธรรม"
 game_concept_cultures:0 "วัฒนธรรม"
 game_concept_culture_possessive: "ของวัฒนธรรม"
 game_concept_cultural:0 "ทางวัฒนธรรม"
 game_concept_culture_desc:1 "$game_concept_culture$ แสดงถึงภาษาและขนบธรรมเนียมของตัวละครหรือ [county|E]\n\nตัวละครที่มีวัฒนธรรมต่างกันจะมี [opinions|E] ต่อกันต่ำกว่า บทลงโทษนี้สามารถลดลงได้โดยการเพิ่ม [cultural_acceptance|E]"
 game_concept_culture_i: "@culture_icon!"
 game_concept_religion:0 "ศาสนา"
 game_concept_religions:0 "ศาสนา"
 game_concept_religion_desc:0 "$game_concept_religion$ สามารถประกอบด้วยนิกายต่าง ๆ มากมาย เรียกว่า [faiths|E] ศาสนาในทางกลับกันเป็นส่วนหนึ่งของ [religious_families|E] ที่ใหญ่กว่าสามกลุ่ม; [GetReligionFamily('rf_abrahamic').GetName], [GetReligionFamily('rf_eastern').GetName] หรือ [GetReligionFamily('rf_pagan').GetName]"
 game_concept_heresy:0 "ลัทธินอกรีต"
 game_concept_heresies:0 "ลัทธินอกรีต"
 game_concept_heresy_desc:0 "เมื่อ [fervor|E] ของ [faith|E] ต่ำ การแพร่ระบาดของลัทธินอกรีตอาจเกิดขึ้น เมื่อเกิดเหตุการณ์นั้น [ruler|E] ของนิกายที่มีศรัทธาแรงกล้าต่ำจะเปลี่ยนไปนับถือนิกายอื่น กลายเป็น [GetTrait('heresiarch').GetName( GetNullCharacter )] จากนั้นพวกเขาจะเผยแพร่นิกายใหม่ไปยัง [counties|E] และ [vassals|E] ของตน\n\nหากการแพร่ระบาดเล็กน้อย มันจะหยุดอยู่แค่นั้น หากเป็นการแพร่ระบาดครั้งใหญ่ ผู้ปกครองในพื้นที่เดียวกันจะเปลี่ยนศาสนามากขึ้น หากท่านอยู่ในพื้นที่นั้น ท่านก็มีทางเลือกที่จะเปลี่ยนศาสนา เช่นกัน หากท่านต้องการ"
 game_concept_faith:0 "นิกาย"
 game_concept_faiths:0 "นิกาย"
 game_concept_faithpossessive:0 "ของนิกาย"
 game_concept_faith_desc:0 "นิกายคือสาขาเฉพาะของ [religion|E] ที่ใหญ่กว่า ตัวละครและ [counties|E] ทั้งหมดมีนิกาย เช่นเดียวกับที่มี [culture|E]\n\nแต่ละนิกายถูกกำหนดโดยชุดของ [doctrines|E] ที่มีผลกระทบอย่างกว้างขวางต่อผู้นับถือ\n\nแต่ละนิกายยังมีค่า [fervor|E] ซึ่งควบคุมความเปราะบางต่อ [heresy|E] ([rulers|E] และเคาน์ตีที่เปลี่ยนไปนับถือนิกายอื่นภายในศาสนาเดียวกัน)"
 game_concept_tolerance:0 "ความอดทนอดกลั้น"
 game_concept_tolerate:0 "อดทนอดกลั้น"
 game_concept_tolerates:0 "อดทนอดกลั้น"
 game_concept_fervor:0 "ศรัทธาแรงกล้า"
 game_concept_fervor_desc:2 "$game_concept_fervor$ ของ [faith|E] อยู่ในช่วงตั้งแต่ #V 0#! ถึง #V 100%#! $game_concept_fervor$ ต่ำ ทำให้ [rulers|E] สร้างนิกายใหม่ของตนเองได้ง่ายขึ้น และเพิ่มโอกาสที่ [counties|E] และตัวละครจะเปลี่ยนไปนับถือนิกายอื่น รวมถึง [heresies|E] $game_concept_fervor$ สูงจะเพิ่มความเร็วในการเปลี่ยนนิกายของเคาน์ตี\n\n$game_concept_fervor$ เปลี่ยนแปลงตามธรรมชาติเมื่อเวลาผ่านไป นิกายขนาดเล็กมักจะมีศรัทธาแรงกล้าสูงกว่า นิกายขนาดใหญ่มักจะมี $game_concept_fervor$ ต่ำ\n\nการทำมหาสงครามศักดิ์สิทธิ์และสงครามศักดิ์สิทธิ์ที่ประสบความสำเร็จจะลด $game_concept_fervor$ การตกเป็นเป้าหมายจะเพิ่ม $game_concept_fervor$ การแพร่ระบาดของ [heresy|E] จะเพิ่ม $game_concept_fervor$ อย่างมีนัยสำคัญ"
 game_concept_doctrine:0 "หลักคำสอน"
 game_concept_doctrines:0 "หลักคำสอน"
 game_concept_doctrines_desc:1 "หลักคำสอนอาจถือได้ว่าเป็นกฎทางศาสนาที่กำหนดว่าพฤติกรรมใดเป็นที่ยอมรับภายใน [faith|E]"
 game_concept_gender_doctrines:0 "หลักคำสอนเรื่องเพศ"
 game_concept_gender_doctrines_desc:0 "[doctrines|E] เหล่านี้กำหนดว่า [gender_laws|E] ใดบ้างที่ตัวละครใน [faith|E] สามารถใช้ได้\n\nนอกจากนี้ยังกำหนดกฎเกณฑ์เพิ่มเติมบางอย่าง เช่น [claims|E] ใดที่สามารถสืบทอดได้ ใครสามารถเป็น [commanders|E] และ [knights|E] ได้ และ [bastard|E] จะสังกัด [house|E] ของบิดาหรือมารดาคนใด\n\nหลักคำสอนเรื่องเพศคือ:\n$BULLET_WITH_TAB$ชายเป็นใหญ่\n$BULLET_WITH_TAB$เท่าเทียม\n$BULLET_WITH_TAB$หญิงเป็นใหญ่"
 game_concept_realm_capital:0 "เมืองหลวงอาณาจักร"
 game_concept_realm_capitals:0 "เมืองหลวงอาณาจักร"
 game_concept_realm_capital_possessive: "ของเมืองหลวงอาณาจักร"
 game_concept_capital:0 "เมืองหลวง"
 game_concept_capitals: "เมืองหลวง"
 game_concept_capital_possessive: "ของเมืองหลวง"
 game_concept_realm_capital_desc:0 "$game_concept_realm_capital$ คือ [holding|E] ที่ [ruler|E] และ [court|E] ของตนอาศัยอยู่ ที่ดินถือครองนี้มีโบนัส [tax|E] และจะถูกสืบทอดโดย [primary_heir|E] เสมอ\n\nการ [occupying|E] เมืองหลวงอาณาจักรของศัตรูในสงครามจะให้ [war_score|E] จำนวนมาก และบางครั้งช่วยให้ท่าน [imprison|E] สมาชิกในครอบครัวของศัตรูได้"
 game_concept_county_capital:0 "เมืองหลวงเคาน์ตี"
 game_concept_county_capitals:0 "เมืองหลวงเคาน์ตี"
 game_concept_county_capital_desc:0 "$game_concept_county_capital$ คือ [holding|E] หลักของ [county|E] ที่ดินถือครองนี้ไม่สามารถถูกทำลายหรือ [leased|E] ได้ และเป็นของ [ruler|E] ที่ถือครอง [title|E] เคาน์ตีเสมอ\n\nเมืองหลวงเคาน์ตีอนุญาตให้สร้าง [building|E] เพิ่มเติมได้เมื่อเทียบกับที่ดินถือครองรอง"
 game_concept_de_jure_capital:0 "เมืองหลวงโดยนิตินัย"
 game_concept_de_jure_capital_desc:1 "$game_concept_de_jure_capital$ ของ [title|E] คือ [county|E] ที่เป็นเมืองหลวงทางประวัติศาสตร์ ท่านสามารถเลือกย้าย [realm_capital|E] ของท่านไปยัง $game_concept_de_jure_capital$ ของ [primary_title|E] ได้เสมอ แม้ว่าจะเคยย้ายไปแล้วก็ตาม"
 game_concept_capital_duchy:0 "ดัชชีเมืองหลวง"
 game_concept_capital_duchy_desc:1 "ตัวปรับ แต่ง $game_concept_capital_duchy$ จะเพิ่มจำนวน [levies|E] ที่ท่านได้รับจาก [holdings|E] ทั้งหมดที่ท่านถือครองภายใน [duchy|E] [de_jure|E] เดียวกันกับ [capital|E] ของท่าน นอกจากนี้ยังให้โบนัสแก่ [men_at_arms|E] ที่ [stationed|E] ทั้งหมดด้วย เพื่อให้ตัวปรับ แต่งนี้ทำงาน ท่านต้องถือครองดัชชีที่เกี่ยวข้องเป็นการส่วนตัว\n\nตัวปรับ แต่งนี้ไม่ทับซ้อนกับโบนัสเมืองหลวงอาณาจักร"
 game_concept_liege:0 "เจ้าเหนือหัว"
 game_concept_lieges:1 "เจ้าเหนือหัว"
 game_concept_liege_possessive:0 "ของเจ้าเหนือหัว"
 game_concept_liege_desc:0 "$game_concept_liege$ คือ [ruler|E] ที่มี [vassal|E] อย่างน้อยหนึ่งคน เจ้าเหนือหัวอาจเป็นข้าหลวงของผู้ปกครองระดับสูงกว่าได้ และเป็น เช่นนี้ต่อไปเรื่อย ๆ"
 game_concept_rightful_liege:0 "เจ้าเหนือหัวโดยชอบธรรม"
 game_concept_rightful_liege_desc:1 "$game_concept_rightful_liege_desc_part1$\n\n$game_concept_rightful_liege_desc_part2$"
 game_concept_rightful_liege_desc_part1:1 "$game_concept_rightful_liege$ ของ [vassal|E] คือ [ruler|E] ผู้ถือครอง [title|E] อันเป็น [liege|E] โดยตรงตาม [de_jure|E] ของ [primary_title|E] ของ $game_concept_vassal$ หาก $game_concept_vassal$ มิได้อยู่ภายใต้ $game_concept_rightful_liege$ ของตน พวกเขาจะส่งมอบ [taxes|E] และ [levies|E] น้อยลง ตลอดจนได้รับโทษ [opinion|E] ต่อ $game_concept_liege$ ของตน การถือครอง $game_concept_title$ ที่มี [title_tier|E] สูงกว่าใน $game_concept_de_jure$ เดียวกันจะ ส่งผลให้บทลงโทษเบาบางลง\n\nข้อยกเว้นสำหรับกรณีนี้คือ [dukes|E] ผู้เป็นส่วนหนึ่งของลำดับชั้น $game_concept_de_jure$ แห่ง [empire|E] และเป็นข้าหลวงโดยตรงต่อ $game_concept_emperor$ ของตน ซึ่งยังคงส่งผลประโยชน์เต็มอัตรา เสมือนว่า $game_concept_emperor$ ถือครอง $game_concept_title$ [kingdom|E] $game_concept_de_jure$ ของพวกเขา"
 game_concept_rightful_liege_desc_part2:0 "#weak ตัวอย่าง: เคานต์แห่ง $c_dunbar$ เป็นข้าหลวงโดยตรงของพระราชาแห่ง $k_england$ เนื่องจากพระราชาไม่ใช่ทั้งดยุกแห่ง $d_lothian$, พระราชาแห่ง $k_scotland$, หรือจักรพรรดิแห่ง $e_britannia$, เคานต์แห่ง $c_dunbar$ จึงส่งภาษีและไพร่พลเพียงเล็กน้อยเท่านั้น\n\nเคานต์แห่ง $c_norfolk$ ก็เป็นข้าหลวงโดยตรงของพระราชาแห่ง $k_england$ เช่นกัน พระราชาไม่ได้ถือครองดัชชีแห่ง $d_norfolk$ ดังนั้นเคานต์จึงส่งภาษีและไพร่พลลดลงด้วย อย่างไรก็ตาม เนื่องจาก $k_england$ เป็นราชอาณาจักรโดยนิตินัยของ $c_norfolk$, เคานต์แห่ง $c_norfolk$ ยังคงส่งภาษีและไพร่พลให้พระราชามากกว่าเคานต์แห่ง $c_dunbar$ อย่างมีนัยสำคัญ#!"
 game_concept_megaduke_penalty:0 "การขยายอาณาเขตเกินควร"
 game_concept_megaduke_penalty_desc:1 "เมื่อท่านมี [counties|E] มากกว่า [GetDefine('NCharacter', 'MAX_COUNTIES_IN_REALM_AS_DUKE')] ใน [realm|E] ของท่านในฐานะ [duke|E] ท่านจะได้รับบทลงโทษ $game_concept_megaduke_penalty$ ซึ่งลดรายได้ [tax|E] ของท่าน\n\nการเป็น [king|E] หรือ [emperor|E] [rank|E] จะลบบทลงโทษนี้"
 game_concept_top_liege:0 "เจ้าเหนือหัวสูงสุด"
 game_concept_top_lieges: "เจ้าเหนือหัวสูงสุด"
 game_concept_top_liege_possessive: "ของเจ้าเหนือหัวสูงสุด"
 game_concept_top_liege_desc:0 "'$game_concept_top_liege$' คือ [liege|E] ที่อยู่บนสุดของลำดับชั้น [vassal|E]\n\nพวกเขาเป็น [rulers|E] [independent|E] อย่างสมบูรณ์และไม่ต้องตอบคำถามต่อมนุษย์คนใด"
 game_concept_top_realm:0 "อาณาจักรสูงสุด"
 game_concept_top_realm_desc:0 "'$game_concept_top_realm$' คือ [realm|E] ของ [top_liege|E]"
 game_concept_domain:0 "เขตปกครองส่วนตัว"
 game_concept_domains:0 "เขตปกครองส่วนตัว"
 game_concept_domain_i: "@domain_icon!"
 game_concept_domain_desc:0 "$game_concept_domain$ ของ [ruler|E] คือการรวบรวม [holdings|E] ทั้งหมดที่พวกเขาเป็นเจ้าของเป็นการส่วนตัว\n\n[domain_limit|E] ที่ค่อนข้างคงที่หมายความว่าผู้ปกครองต้องพึ่งพา [vassals|E] เพื่อเพิ่มขนาด [realm|E] ของตนเกินกว่าจุดหนึ่ง"
 game_concept_regiment:0 "กองทหาร"
 game_concept_regiments:0 "กองทหาร"
 game_concept_regiment_desc:1 "$game_concept_regiment$ คือกลุ่มของ [soldiers|E] ประเภทเดียว ( เช่น พลธนู พลเดินเท้า หรือ [levies|E]) แม้ว่า $game_concept_levies$ จะถูกจัดเป็น $game_concept_regiments$ แต่สิ่งที่น่าสนใจจริง ๆ คือ [men_at_arms|E]"
 game_concept_realm:0 "อาณาจักร"
 game_concept_realms:0 "อาณาจักร"
 game_concept_realm_possessive: "ของอาณาจักร"
 game_concept_realm_desc:0 "$game_concept_realm$ คือดินแดนทั้งหมดที่ [ruler|E] ควบคุมไม่ว่าจะโดยตรงหรือผ่าน [vassals|E] (ตรงข้ามกับ [domain|E] ซึ่งเป็นเพียง [holdings|E] ที่ผู้ปกครองเป็นเจ้าของเป็นการส่วนตัว)"
 game_concept_gold:0 "ทองคำ"
 game_concept_gold_desc:0 "'ทองคำ' แท้จริงแล้วหมายถึงสินทรัพย์สภาพคล่องทั้งหมดของตัวละคร; ความมั่งคั่งของพวกเขา สามารถใช้จ่ายได้หลายอย่าง ที่เด่นที่สุดคือการสร้าง [buildings|E] การจ่ายเงินสำหรับ [regiments|E] และการสร้าง [titles|E]"
 game_concept_gold_i:0 "@gold_icon!"
 game_concept_income:0 "รายได้"
 game_concept_income_desc:0 "มีแหล่งที่มาของ [gold|E] มากมาย แต่สองแหล่งที่สำคัญที่สุดคือ [taxation|E] จาก [holdings|E] ของท่านเองและจาก [vassals|E] ของท่าน"
 game_concept_trait:0 "ลักษณะนิสัย"
 game_concept_traits:0 "ลักษณะนิสัย"
 game_concept_trait_desc:0 "$game_concept_traits$ ของตัวละครอธิบายถึงบุคลิก ลักษณะเฉพาะ การกระทำ และสถานะของพวกเขา\n\nลักษณะนิสัยสามารถมีผลกระทบหลายอย่าง แต่ส่วนใหญ่ส่งผลต่อ [skills|E] ของตัวละคร\n\nลักษณะบุคลิกภาพยังมีผลอย่างมากต่อพฤติกรรมที่คาดหวังของตัวละคร การกระทำที่ขัดต่อบุคลิกภาพของตนเอง ทำให้เกิด [stress|E]\n\nลักษณะนิสัยบางอย่างเป็น [congenital|E] และสามารถถ่ายทอดสู่ลูกหลานได้"
 game_concept_spouse:0 "คู่สมรส"
 game_concept_spouses:0 "คู่สมรส"
 game_concept_spouse_possessive: "ของคู่สมรส"
 game_concept_spouse_desc:1 "$game_concept_spouse$ คือสามีหรือภรรยาของตัวละคร; ผลลัพธ์ของ [marriage|E]\n\nเพื่อให้มีบุตรโดยชอบธรรมและผลิต [heirs|E] ท่านควรมีคู่สมรสหรือ [concubine|E] ( แม้ว่า [bastards|E] จะสามารถ ทำให้ถูกกฎหมายได้)\n\nวิธีเดียวในการสร้าง [alliance|E] คือผ่านการสมรสหรือ [betrothal|E]; ของท่านเองหรือของญาติสนิท\n\nคู่สมรส (หลัก) ของท่านยังเป็นสมาชิกของ [council|E] ของท่านและสามารถปฏิบัติ [councillor_tasks|E] ที่มีประโยชน์มากมายได้\n\n[doctrines|E] ของ [faith|E] กำหนดจำนวน $game_concept_spouses$ ที่ท่านสามารถมีได้และวิธีที่พวกเขาสามารถ [divorced|E]"
 game_concept_primary_spouse:0 "คู่สมรสหลัก"
 game_concept_primary_spouse_desc:0 "ใน [faiths|E] แบบ [GetFaithDoctrine('doctrine_polygamy').GetBaseName] [rulers|E] ต้องเลือกหนึ่งใน [spouses|E] ของตนให้เป็น $game_concept_primary_spouse$ $game_concept_primary_spouse$ ของผู้ปกครองจะได้รับ [fertility|E] เพิ่มขึ้นกับพวกเขา [opinion|E] ที่เพิ่มขึ้นต่อพวกเขา และอาจทำหน้าที่ใน [council|E] ของพวกเขา"
 game_concept_available_spouse:0 "คู่สมรสที่พร้อมปฏิบัติหน้าที่"
 game_concept_available_spouse_desc:1 "เพื่อให้สามารถทำหน้าที่ใน [council|E] ของผู้ปกครองได้ [spouse|E] จะต้องพร้อมที่จะปฏิบัติหน้าที่รับผิดชอบในบทบาทนั้น\n\nสถานการณ์ต่าง ๆ สามารถขัดขวาง $game_concept_spouse$ จากการปฏิบัติหน้าที่รับผิดชอบเหล่านี้ได้ แต่สถานการณ์ที่พบบ่อยที่สุดหลายประการ ได้แก่:\n$BULLET_WITH_TAB$การเป็น [ruler|E] ของ [realm|E] ของตนเอง\n$BULLET_WITH_TAB$การพำนักอยู่ใน [court|E] ของผู้ปกครองคนอื่น\n$BULLET_WITH_TAB$การถูก [imprisoned|E] ไม่ว่าจะที่บ้านหรือต่างแดน\n$BULLET_WITH_TAB$การมี [trait|E] [GetTrait('incapable').GetName( GetNullCharacter )]\n\nหากคู่สมรสที่ไม่พร้อมปฏิบัติหน้าที่กลับมาพร้อมอีกครั้ง พวกเขาจะกลับมาปฏิบัติหน้าที่ในสภาโดยอัตโนมัติ\n\nคู่สมรสที่เป็นผู้ปกครองในสิทธิของตนเองยังคงสามารถทำหน้าที่ในสภาได้หากพวกเขาเป็น [direct_vassals|E] ของท่าน แต่โดยปกติแล้วจะไม่ถือว่าพร้อมปฏิบัติหน้าที่"
 game_concept_holding:0 "ที่ดินถือครอง"
 game_concept_holdings:0 "ที่ดินถือครอง"
 game_concept_holding_desc:0 "$game_concept_holding$ คือการตั้งถิ่นฐานส่วนกลางของ [barony|E] หรือ [county_capital|E]\n\nมันให้ [taxes|E] และ [levies|E] แก่ [holder|E] ของตน ขึ้นอยู่กับ [holding_type|E] การรวบรวมที่ดินถือครองที่ [ruler|E] เป็นเจ้าของเป็นการส่วนตัวเรียกว่า [domain|E]"
 game_concept_holding_type:0 "ประเภทที่ดินถือครอง"
 game_concept_holding_types:0 "ประเภทที่ดินถือครอง"
 game_concept_holding_type_desc:2 "มี [holdings|E] สี่ประเภท: [castles|E], [cities|E], [tribes|E], และ [temples|E] แต่ละประเภทอนุญาตให้มี [buildings|E] ประเภทต่าง ๆ [government_form|E] ของ [ruler|E] กำหนดว่าผู้ปกครองสามารถเป็นเจ้าของที่ดินถือครองประเภทใดได้เป็นการส่วนตัวโดยไม่มีบทลงโทษ ในกรณีของวิหาร [doctrines|E] ของ [faith|E] ของพวกเขาอาจมีบทบาทด้วย"
 game_concept_castle_holding:0 "ที่ดินถือครองประเภทปราสาท"
 game_concept_castle:0 "ปราสาท"
 game_concept_castles:0 "ปราสาท"
 game_concept_castle_holdings:0 "ที่ดินถือครองประเภทปราสาท"
 game_concept_castle_holding_desc:0 "ปราสาทเป็น [holding_type|E] ที่มีการป้องกันแน่นหนาที่สุดและเป็นประเภทมาตรฐานสำหรับ [rulers|E] แบบ [feudal|E], [clan|E] และ [tribal|E] รวมถึง [holy_orders|E] พวกเขามักจะให้ [levies|E] มากกว่า [taxes|E]"
 game_concept_temple_holding:0 "ที่ดินถือครองประเภทวิหาร"
 game_concept_temple:0 "วิหาร"
 game_concept_temples:0 "วิหาร"
 game_concept_temple_holdings:0 "ที่ดินถือครองประเภทวิหาร"
 game_concept_temple_holding_desc:0 "วิหารเป็น [holding_type|E] ที่สมาชิกของ [clergy|E] สามารถถือครองเป็น [church_property|E] ([government_form|E] แบบ [theocratic|E]) ได้ อย่างไรก็ตาม ใน [faiths|E] ที่มี [doctrine|E] [GetFaithDoctrine('doctrine_theocracy_lay_clergy').GetBaseName] ทุกคนสามารถถือครองวิหารได้โดยไม่มีบทลงโทษ\n\nวิหารให้ส่วนผสมที่ค่อนข้างสมดุลของ [levies|E] และ [taxes|E]"
 game_concept_city_holding:0 "ที่ดินถือครองประเภทนคร"
 game_concept_city:0 "นคร"
 game_concept_cities:0 "นคร"
 game_concept_city_holdings:0 "ที่ดินถือครองประเภทนคร"
 game_concept_tribal_holding:0 "ที่ดินถือครองประเภทชนเผ่า"
 game_concept_tribal_holdings:0 "ที่ดินถือครองประเภทชนเผ่า"
 game_concept_tribal_holding_desc:0 "ชนเผ่ามี [taxes|E] น้อย แต่มี [levies|E], [prestige|E], และการอัปเกรด [men_at_arms|E] มากมาย พวกเขามีศักยภาพในการอัปเกรดจำกัด และ ในขณะที่แข็งแกร่งในช่วงแรก อำนาจจะลดลงอย่างรวดเร็วเมื่อเวลาผ่านไป เฉพาะตัวละคร [tribal|E] เท่านั้นที่สามารถถือครองได้โดยไม่มีบทลงโทษ\n\nหากมีชนเผ่าอยู่ใน [county|E] จะไม่สามารถสร้าง [holdings|E] อื่น ๆ ได้ ผู้ปกครอง [feudal|E] จะต้องใช้ [gold|E] เพื่อเปลี่ยนชนเผ่าเป็น [castles|E]"
 game_concept_tribe:0 "ชนเผ่า"
 game_concept_tribes:0 "ชนเผ่า"
 game_concept_city_holding_desc:1 "นครเป็น [holding_type|E] ที่ร่ำรวยที่สุด โดยเน้น [taxes|E] มากกว่า [levies|E] พวกเขาเกี่ยวข้องกับ [republics|E] และการถือครองในฐานะ [government_forms|E] ที่เล่นได้ใด ๆ จะมีบทลงโทษเสมอ"
 game_concept_rally_point:0 "จุดระดมพล"
 game_concept_rally_points:0 "จุดระดมพล"
 game_concept_rally_point_desc:0 "$game_concept_rally_point$ เป็นพื้นที่ชุมนุมสำหรับ [levies|E] และ [men_at_arms|E] ภายใต้คำสั่งของท่าน\n\nในยาม [war|E] ท่านสามารถเรียก [soldiers|E] ของท่านที่จุดระดมพลเพื่อรวบรวม [army|E]\n\nไพร่พลที่ได้รับมอบหมายไปยังจุดระดมพลต้องมาจาก [domain|E] ของท่านเองหรือจาก [vassals|E] ของท่าน จุดระดมพลสามารถจัดระเบียบใหม่ แบ่งแยก และรวมเข้าด้วยกันได้ตามที่ท่านเห็นสมควร"
 game_concept_piety:0 "ความศรัทธา"
 game_concept_pious:0 "ผู้มีศรัทธา"
 game_concept_piety_i:1 "[GetLocalPlayerPietyTextIcon]"
 game_concept_piety_desc:1 "$game_concept_piety$ แสดงถึงคุณธรรมของตัวละคร\n\nการกระทำอย่างมีศรัทธา (ตาม [doctrines|E] ของ [faith|E] ของตน) จะเพิ่มความศรัทธาของตัวละคร เช่น การไป [GetActivityType('activity_pilgrimage').GetName]\n\nความศรัทธาสามารถใช้จ่ายในเรื่องทางศาสนาต่าง ๆ ได้ขึ้นอยู่กับ [government_form|E], หลักคำสอน ฯลฯ\n\nทุกครั้งที่ตัวละครได้รับ $game_concept_piety$ พวกเขาก็จะก้าวหน้าไปสู่ [piety_level|E] ถัดไปด้วย"
 game_concept_piety_experience:0 "ความเลื่อมใส"
 game_concept_piety_experience_desc:0 "ทุกแต้มความเลื่อมใสที่ตัวละครได้รับจะเพิ่มความก้าวหน้าไปสู่ [piety_level|E] ถัดไป เมื่อตัวละครได้รับ [piety|E] พวกเขาก็จะได้รับความเลื่อมใสในจำนวนเท่ากันด้วย"
 game_concept_maximum_piety_level: "ระดับการอุทิศตนสูงสุด"
 game_concept_maximum_piety_level_desc: "$game_concept_maximum_piety_level$ แสดงถึง [piety_level|E] สูงสุดที่ [ruler|E] อาจบรรลุได้ในช่วงชีวิตของตน โดยปกติ ระดับนี้คือ [GetModifier( 'piety_level_5' ).GetNameWithTooltip|L][AddLocalizationIf( GetPlayer.GetGovernment.HasGovernmentFlag( 'government_is_mandala' ), 'maximum_piety_level_mandala')]"
 maximum_piety_level_mandala: "\n\nอย่างไรก็ตาม เมื่อ [ruler|E] [mandala|E] สิ้นชีพในลักษณะที่เป็นที่ยอมรับต่อ [aspect|E] ของตน หลังจากบรรลุ [GetModifier( 'piety_level_5' ).GetNameWithTooltip|L] แล้ว [heir|E] ของผู้ปกครองนั้นจะพัฒนาความสามารถในการก้าวไปสู่ระดับการอุทิศตนถัดไป จนกระทั่งบรรลุ [GetModifier( 'piety_level_8' ).GetNameWithTooltip|L]"
 game_concept_piety_level:0 "ระดับความเลื่อมใส"
 game_concept_piety_levels: "ระดับการอุทิศตน"
 additional_mandala_government_piety_levels: "[government|E] [mandala|E] สามารถปลดล็อกระดับการอุทิศตนเพิ่มเติมได้หลังจาก [GetModifier( 'piety_level_5' ).GetNameWithTooltip|L] จนถึงและ รวมถึง [GetModifier( 'piety_level_8' ).GetNameWithTooltip|L] การจะบรรลุถึงระดับความเป็นเทพนั้น การอุทิศตนของพวกเขาจำเป็นต้องได้รับการพิสูจน์ผ่านหลายชั่วอายุคน"
 game_concept_piety_level_desc: "$game_concept_piety_level$ ของตัวละครคือเครื่องวัดว่าพวกเขามีคุณธรรมและศรัทธาเพียงใด ตลอดจนสถานะของพวกเขาต่อสมาชิกคนอื่น ๆ ใน [faith|E] ของตน\n\nทุกครั้งที่ตัวละครได้รับ [piety|E] พวกเขาจะก้าวหน้าไปสู่ระดับการอุทิศตนถัดไป\n\n[AddLocalizationIf( HasDlcFeature( 'all_under_heaven' ), 'additional_mandala_government_piety_levels' )]\n\nระดับต่าง ๆ คือ:\n$EFFECT_LIST_BULLET$[GetModifier( 'piety_level_0' ).GetNameWithTooltip|L]\n$EFFECT_LIST_BULLET$[GetModifier( 'piety_level_1' ).GetNameWithTooltip|L]\n$EFFECT_LIST_BULLET$[GetModifier( 'piety_level_2' ).GetNameWithTooltip|L]\n$EFFECT_LIST_BULLET$[GetModifier( 'piety_level_3' ).GetNameWithTooltip|L]\n$EFFECT_LIST_BULLET$[GetModifier( 'piety_level_4' ).GetNameWithTooltip|L]\n$EFFECT_LIST_BULLET$[GetModifier( 'piety_level_5' ).GetNameWithTooltip|L][AddLocalizationIf( HasDlcFeature( 'all_under_heaven' ), 'game_concept_additional_piety_level_desc' )]"
 game_concept_additional_piety_level_desc: "\n$EFFECT_LIST_BULLET$[GetModifier( 'piety_level_6' ).GetNameWithTooltip|L]\n$EFFECT_LIST_BULLET$[GetModifier( 'piety_level_7' ).GetNameWithTooltip|L]\n$EFFECT_LIST_BULLET$[GetModifier( 'piety_level_8' ).GetNameWithTooltip|L]"
 game_concept_prestige:0 "เกียรติภูมิ"
 game_concept_prestigious:0 "ผู้มีเกียรติภูมิ"
 game_concept_prestige_i:0 "@prestige_icon!"
 game_concept_prestige_desc:0 "$game_concept_prestige$ แสดงถึงชื่อเสียงและสถานะทางสังคมของตัวละคร\n\nเกียรติภูมิสามารถใช้จ่ายในเรื่องทางโลกต่าง ๆ ได้ขึ้นอยู่กับ [government_form|E], [doctrines|E] ฯลฯ\n\nทุกครั้งที่ตัวละครได้รับเกียรติภูมิ พวกเขาก็จะก้าวหน้าไปสู่ [prestige_level|E] ถัดไปด้วย"
 game_concept_prestige_experience_i: "$game_concept_prestige_i$"
 game_concept_prestige_experience:0 "ชื่อเสียง"
 game_concept_prestige_experience_desc:0 "ทุกแต้มชื่อเสียงที่ตัวละครได้รับจะเพิ่มความก้าวหน้าไปสู่ [prestige_level|E] ถัดไป เมื่อตัวละครได้รับ [prestige|E] พวกเขาก็จะได้รับชื่อเสียงในจำนวนเท่ากันด้วย"
 game_concept_prestige_level:0 "ระดับชื่อเสียง"
 game_concept_prestige_levels:0 "ระดับชื่อเสียง"
 game_concept_prestige_level_desc:2 "$game_concept_prestige_level$ ของตัวละครวัดชื่อเสียงโดยทั่วไปของพวกเขา และการรับรู้ที่ดีที่พวกเขามีต่อทุกคน\n\nทุกครั้งที่ตัวละครได้รับ [prestige|E] พวกเขาก็จะก้าวหน้าไปสู่ $game_concept_prestige_level$ ถัดไปด้วย\n\nระดับต่าง ๆ คือ:\n$EFFECT_LIST_BULLET$[GetModifier( 'prestige_level_0' ).GetNameWithTooltip|L]\n$EFFECT_LIST_BULLET$[GetModifier( 'prestige_level_1' ).GetNameWithTooltip|L]\n$EFFECT_LIST_BULLET$[GetModifier( 'prestige_level_2' ).GetNameWithTooltip|L]\n$EFFECT_LIST_BULLET$[GetModifier( 'prestige_level_3' ).GetNameWithTooltip|L]\n$EFFECT_LIST_BULLET$[GetModifier( 'prestige_level_4' ).GetNameWithTooltip|L]\n$EFFECT_LIST_BULLET$[GetModifier( 'prestige_level_5' ).GetNameWithTooltip|L]"
 game_concept_dynast:1 "ประมุขตระกูล"
 game_concept_dynast_desc: "ผู้นำราชวงศ์ ($game_concept_dynast$) คือ [house_head|E] ที่เป็นผู้นำของ [dynasty|E] ทั้งหมดและ [houses|E] ทุกสายในราชวงศ์\n\nผู้นำราชวงศ์มีอำนาจพิเศษบางประการเหนือสมาชิกของราชวงศ์ ซึ่งรู้จักกันในชื่อ [dynast_interactions|E] ผู้นำราชวงศ์ ($game_concept_dynast$) ยังเป็นผู้เลือก [dynasty_perks|E] สำหรับราชวงศ์ ($game_concept_dynasty$) ด้วย\n\nโดยปกติแล้ว $game_concept_dynast$ จะเป็น $game_concept_house_head$ ที่สามารถจัดหา [soldiers|E] ได้มากที่สุด หาก $game_concept_house_heads$ ทั้งหมดมี [government|E] แบบ [administrative|E] แล้ว $game_concept_dynast$ จะตกเป็นของผู้ที่มีค่า [powerful_family_rating|E] สูงสุดแทน"
 game_concept_dynasty:0 "ตระกูล"
 game_concept_dynasties:0 "ตระกูล"
 game_concept_dynastic:0 "เกี่ยวกับตระกูล"
 game_concept_dynasty_members:0 "สมาชิกตระกูล"
 game_concept_dynasty_desc:1 "$game_concept_dynasty$ คือกลุ่มของทายาท [noble|E] ของบรรพบุรุษ [landed|E]; ผู้ก่อตั้งตระกูล [house|E] ดั้งเดิมสามารถแตกออกเป็นสกุลใหม่ ([cadet_branches|E]) ซึ่งทั้งหมดยังคงเป็นสมาชิกของตระกูลที่กว้างขึ้น\n\nเมื่อตัวละครของท่านเสียชีวิต ท่านต้องมี [player_heir|E] มิฉะนั้นเกมจะจบลง ( แม้ว่าท่านจะสามารถเลือกผู้ปกครองคนอื่นและเล่นต่อไปในโลกเดียวกันได้)\n\nเช่นเดียวกับ [prestige|E] สำหรับตัวละคร ตระกูลก็มี [dynasty_prestige|E]"
 game_concept_dynast_interaction:0 "ปฏิสัมพันธ์ของประมุขตระกูล"
 game_concept_dynast_interactions:0 "ปฏิสัมพันธ์ของประมุขตระกูล"
 game_concept_dynast_interaction_desc:0 "ปฏิสัมพันธ์ที่มีเฉพาะสำหรับ [dynast|E] ของ [dynasty|E] ต่อสมาชิกคนอื่น ๆ ของตระกูลนั้น\n\nต้องใช้ [dynasty_prestige|E] ในการใช้งาน"
 game_concept_dynasty_prestige:0 "ศักดิ์ศรีตระกูล"
 game_concept_dynasty_prestige_i:0 "@dynasty_prestige_icon!"
 game_concept_renown: "$game_concept_dynasty_prestige$"
 game_concept_dynasty_prestige_desc:0 "$game_concept_dynasty_prestige$ คล้ายกับ [prestige|E] มาก แต่ใช้ร่วมกันทั้ง [dynasty|E]\n\nตระกูลได้รับ $game_concept_dynasty_prestige$ จากสิ่งต่อไปนี้:\n$BULLET_WITH_TAB$ จำนวนสมาชิกที่ยังมีชีวิตอยู่\n$BULLET_WITH_TAB$ จำนวน [rulers|E]\n$BULLET_WITH_TAB$ จำนวน [spouses|E] ของผู้ปกครองคนอื่น\nโปรดทราบว่าผู้ปกครองจะไม่สร้าง $game_concept_dynasty_prestige$ หากพวกเขามี [liege|E] ใด ๆ ในตระกูลเดียวกัน\n\nเช่นเดียวกับเกียรติภูมิ $game_concept_dynasty_prestige$ ยังนับรวมในการเพิ่ม [dynasty_prestige_level|E] ของท่านด้วย\n\n$game_concept_dynasty_prestige$ สามารถใช้โดย [dynast|E] เพื่อปลดล็อก [dynasty_perks|E] และมีอิทธิพลต่อสมาชิกของตระกูลในรูปแบบต่าง ๆ\n\n#weak ตระกูลที่กระจายอยู่ไกลและกว้างขวางระหว่าง [realms|E] ที่แตกต่างกันหลายแห่งจะสร้าง $game_concept_dynasty_prestige$ ได้มากกว่าตระกูลที่รวมศูนย์อยู่ภายในอาณาจักรเดียว#!"
 game_concept_dynasty_prestige_level:0 "ระดับความรุ่งโรจน์"
 game_concept_dynasty_prestige_level_desc:1 "$game_concept_dynasty_prestige_level$ เป็นตัวชี้วัดว่า [dynasty|E] มีชื่อเสียงเพียงใด ความคืบหน้าของระดับจะเกิดขึ้นเมื่อใดก็ตามที่ตระกูลของท่านได้รับ [dynasty_prestige|E] ตัวละครจะได้รับ [prestige|E] เริ่มต้นจำนวนหนึ่งเมื่อเกิด ขึ้นอยู่กับ $game_concept_dynasty_prestige_level$ ของพวกเขา ในทำนองเดียวกัน [spouses|E] จะได้รับเกียรติภูมิบางส่วนจากตระกูลของกันและกันเมื่อพวกเขา [marry|E]\n\nระดับต่าง ๆ คือ:\n$EFFECT_LIST_BULLET$[dynasty_prestige_level_0|E]\n$EFFECT_LIST_BULLET$[dynasty_prestige_level_1|E]\n$EFFECT_LIST_BULLET$[dynasty_prestige_level_2|E]\n$EFFECT_LIST_BULLET$[dynasty_prestige_level_3|E]\n$EFFECT_LIST_BULLET$[dynasty_prestige_level_4|E]\n$EFFECT_LIST_BULLET$[dynasty_prestige_level_5|E]\n$EFFECT_LIST_BULLET$[dynasty_prestige_level_6|E]\n$EFFECT_LIST_BULLET$[dynasty_prestige_level_7|E]\n$EFFECT_LIST_BULLET$[dynasty_prestige_level_8|E]\n$EFFECT_LIST_BULLET$[dynasty_prestige_level_9|E]\n$EFFECT_LIST_BULLET$[dynasty_prestige_level_10|E]"
 game_concept_house:0 "สกุล"
 game_concept_houses:0 "สกุล"
 game_concept_house_possessive: "ของสกุล"
 game_concept_house_desc:1 "$game_concept_house$ คือสาขาของสมาชิกบนต้นไม้ที่ใหญ่กว่าของ [dynasty|E] สกุลถูกสร้างขึ้นโดย [rulers|E] ที่ไม่ต้องการตอบสนองต่อ [house_head|E] ปัจจุบันของตนอีกต่อไป และต้องการเป็นประมุขของสกุลใหม่แทน\n\nแม้ว่าสกุลจะมีชื่อและตราอาร์มของตนเอง แต่พวกเขายังคงแบ่งปัน [dynasty_prestige|E] และสมาชิกคนอื่น ๆ ของตระกูลยังคงสามารถเป็น [player_heir|E] ของท่านได้"
 game_concept_house_head:0 "ประมุขสกุล"
 game_concept_house_heads:0 "ประมุขสกุล"
 game_concept_house_heads_possessive: "ของประมุขสกุล"
 game_concept_house_head_head:0 "ประมุข"
 game_concept_house_head_heads: "ประมุข"
 game_concept_house_head_desc: "ทุก [house|E] ภายใน [dynasty|E] จะมี $game_concept_house_head$ ผู้ ซึ่งใช้อำนาจเฉพาะตัวบางประการเหนือสมาชิกของตระกูล\n\nที่น่าสังเกตคือ $game_concept_house_head$ สามารถรับรอง [bastards|E] เรียกสมาชิกของตระกูลเข้าร่วม [war|E] และเรียกร้องให้สมาชิกที่มี [landed|E] เปลี่ยนศาสนาได้ $game_concept_house_head$ ยังได้รับ [weak_hook|E] ต่อสมาชิกทุกคนในตระกูลที่เกิด ในขณะที่ตนอยู่ในอำนาจ\n\nเมื่อพวกเขาถึงแก่กรรม [primary_heir|E] ของพวกเขาจะกลายเป็น $game_concept_house_head$ คนใหม่\n\n[clan_house_heads|E] มีกฎและสิทธิพิเศษ"
 game_concept_clan_house_head: "ประมุขสกุลแบบแคลน"
 game_concept_clan_house_heads: "ประมุขสกุลแบบแคลน"
 game_concept_clan_house_head_head: "$game_concept_house_head_head$"
 game_concept_clan_house_head_desc: "$game_concept_clan_house_head$ ในหลาย ๆ ด้านเหมือนกับ [house_head|E] ปกติ แต่แตกต่างกันในบางประการที่น่าสังเกต\n\n$game_concept_clan_house_heads$ ไม่ได้รับ [weak_hook|E] ต่อสมาชิกทุกคนใน [house|E] ของตน พวกเขามีอิทธิพลต่อ [house_unity|E] มากกว่าสมาชิกสกุลคนอื่น ๆ นอกจากนี้ สมาชิกสกุลคนใดก็ได้อาจท้าทาย $game_concept_clan_house_head$ เพื่อชิงความเป็นใหญ่เพื่อเป็น $game_concept_house_head$ เอง"
 game_concept_denounce:0 "ประณาม"
 game_concept_denouncement:0 "การประณาม"
 game_concept_denounce_desc:1 "[dynast|E] อาจประณามสมาชิกใน [dynasty|E] ของตนโดยเสียค่า [dynasty_prestige|E]\n\nสมาชิกคนใดก็ตามในตระกูลเดียวกัน ( รวมถึงประมุขตระกูลเอง) จะได้รับ [imprisonment_reason|E] ต่อสมาชิกที่ถูกประณาม"
 game_concept_hook:0 "ข้อผูกมัด"
 game_concept_hooks:0 "ข้อผูกมัด"
 game_concept_hooked:0 "มีข้อผูกมัด"
 game_concept_hook_i:0 "@cs_weak_hook_icon!"
 game_concept_hook_desc:1 "$game_concept_hook$ เป็นคำทั่วไปสำหรับความสัมพันธ์ระหว่างตัวละครที่ฝ่ายหนึ่งสามารถ ทำให้อีกฝ่ายทำตามความประสงค์ของตนได้\n\nมีสองประเภทคือ [weak_hooks|E] และ [strong_hooks|E] ซึ่งได้มาในรูปแบบที่แตกต่างกัน\n\n$game_concept_hooks$ สามารถใช้เพื่อบังคับให้เกิดปฏิสัมพันธ์หลายอย่าง เช่น ข้อเสนอ [marriage|E] และการเปลี่ยนแปลง [vassal_contract|E]"
 game_concept_weak_hook:0 "ข้อผูกมัดอย่างอ่อน"
 game_concept_weak_hooks:0 "ข้อผูกมัดอย่างอ่อน"
 game_concept_weak_hook_desc:1 "$game_concept_weak_hook$ เป็น [hook|E] ที่ค่อนข้างธรรมดาที่ท่านอาจมีต่อตัวละครที่เป็นหนี้บุญคุณท่าน หรือที่ท่านได้ชักจูงให้ทำตามความประสงค์ของท่าน\n\nในขณะที่มีปฏิสัมพันธ์หลายอย่างที่สามารถใช้ $game_concept_weak_hook$ ได้ เช่น ในข้อเสนอ [marriage|E] แต่ไม่สามารถใช้เพื่อบังคับให้ใครบางคนกลายเป็น [agent|E] ของท่านใน [GetScheme('murder').GetTypeName] และไม่ให้ประโยชน์แฝง #weak (สำหรับสิ่งนั้น จำเป็นต้องมี [strong_hook|E])#!\n\nเด็กทุกคนที่เกิดใน [house|E] [noble|E] ยังเป็นหนี้บุญคุณ [house_head|E] ด้วย $game_concept_weak_hook$ เริ่มต้น\n\nเมื่อใช้ $game_concept_weak_hook$ แล้ว มันจะ #emphasis ถูกใช้ไป.#!"
 game_concept_perpetual_hook: "ข้อผูกมัดถาวร"
 game_concept_perpetual_hooks: "ข้อผูกมัดถาวร"
 game_concept_perpetual_hook_desc: "$game_concept_perpetual_hook$ เป็น [hook|E] ที่ท่านอาจมีต่อตัวละครที่เป็นหนี้บุญคุณท่าน หรือที่ท่านได้ชักจูงให้ทำตามความประสงค์ของท่าน\n\nไม่สามารถใช้เพื่อบังคับให้ใครบางคนกลายเป็น [agent|E] ของท่านใน [GetScheme('murder').GetTypeName] และไม่ให้ประโยชน์แฝง #weak (สำหรับสิ่งนั้น จำเป็นต้องมี [strong_hook|E])#!\n\n$game_concept_perpetual_hooks$ จะไม่ถูกใช้ไปเมื่อใช้งาน แต่จะเข้าสู่ช่วงคูลดาวน์ก่อนที่จะสามารถใช้งานได้อีกครั้ง#!"

 game_concept_strong_hook:0 "ข้อผูกมัดรุนแรง"
 game_concept_strong_hooks:0 "ข้อผูกมัดรุนแรง"
 game_concept_strong_hook_i: "@unspent_strong_hook_icon!"
 game_concept_strong_hook_desc:2 "$game_concept_strong_hook$ คือ [hook|E] ที่ทรงพลังอย่างยิ่งที่คุณอาจมีเหนือตัวละครที่คุณได้ [blackmailed|E]\n\n$game_concept_strong_hooks$ นั้นทรงพลังกว่า [weak_hooks|E] อย่างมาก และสามารถบังคับให้ผู้ใดกระทำการอันเลวร้ายเพื่อท่านได้ — เช่น การมาเป็น [agent|E] ของท่านใน [GetScheme('murder').GetTypeName] #weak (นอกเหนือจากทุกสิ่งที่ $game_concept_weak_hook$ สามารถทำได้!)#!\n\n$game_concept_strong_hook$ ยังป้องกันไม่ให้เป้าหมายกระทำการใดๆ ที่เป็นปฏิปักษ์ต่อผู้ถือครอง\n\n$game_concept_strong_hooks$ จะไม่ถูกใช้หมดไปเมื่อใช้งาน แต่จะเข้าสู่ช่วงคูลดาวน์ก่อนที่จะสามารถใช้ได้อีกครั้ง ผลแบบติดตัวจะไม่หายไปเมื่อ [hook|E] ถูกใช้งาน"
 game_concept_favor:0 "บุญคุณ"
 game_concept_favors:0 "บุญคุณ"
 game_concept_favor_desc:0 "ตัวละครสามารถติดค้าง $game_concept_favors$ ซึ่งกันและกันได้ ซึ่งถือเป็น [hook|E] ประเภทหนึ่ง\n\nบุญคุณสามารถได้รับจากหลายวิธี แต่มักจะผ่านเหตุการณ์ที่กำหนดไว้ต่างๆ เด็กทุกคนที่เกิดใน [house|E] ของ [noble|E] จะติดค้างบุญคุณเริ่มต้นแก่ [house_head|E] ด้วย"
 game_concept_blackmail:0 "แบล็กเมล์"
 game_concept_blackmailed:0 "ถูกแบล็กเมล์"
 game_concept_blackmailing:0 "กำลังแบล็กเมล์"
 game_concept_blackmail_desc:1 "หากท่านทราบ [secret|E] ที่เป็น [criminal|E] ของตัวละครอื่น ท่านอาจใช้ [character_interaction|E] แบบ $game_concept_blackmail$ เพื่ออาจได้รับ [hook|E] เหนือพวกเขา\n\nความรุนแรงของ [hook|E] นี้จะแตกต่างกันไปตามความร้ายแรงของ [secret|E] ซึ่งมักจะถูกกำหนดโดย [doctrines|E]"
 game_concept_manipulation:0 "การชักจูง"
 game_concept_manipulation_desc:0 "$game_concept_manipulation$ เป็นรูปแบบหนึ่งของ [hook|E] ที่ท่านสามารถชักจูงจิตใจของตัวละครอื่นได้ด้วยวิธีใดวิธีหนึ่ง เพื่อให้พวกเขาทำตามความประสงค์ของท่าน"
 game_concept_soldier:0 "ทหาร"
 game_concept_soldiers:0 "ทหาร"
 game_concept_soldier_i:0 "@soldier_icon!"
 game_concept_soldiers_desc:0 "$game_concept_soldiers$ เป็นคำเรียกรวมสำหรับกองกำลังใน [regiment|E] หรือ [army|E] ไม่ว่าจะเป็น [levies|E], [men_at_arms|E], หรือ [knights|E]\n\nการมี $game_concept_soldiers$ มากที่สุดจะช่วยให้ชนะ [battles|E] และ [sieges|E]"
 game_concept_health:0 "สุขภาพ"
 game_concept_healthy: "สุขภาพดี"
 game_concept_health_desc:1 "$game_concept_health$ วัดว่าตัวละครมีแนวโน้มที่จะเสียชีวิตจาก [illnesses|E] และความชรามากน้อยเพียงใด\n\nตัวละครสูงอายุมีโอกาสสูญเสียสุขภาพทุกปี โดยจะเพิ่มขึ้นตามอายุที่มากขึ้น"
 game_concept_child_health: "สุขภาพเด็ก"
 game_concept_child_health_desc: "[traits|E] บางอย่าง เช่น [GetTrait('measles').GetName( GetNullCharacter )] เป็นอันตรายอย่างยิ่งต่อ [children|E]\n\nบทลงโทษใดๆ ต่อ $game_concept_child_health$ จะทับซ้อนกับบทลงโทษปกติของ [health|E] แม้จะมาจาก [traits|E] เดียวกันก็ตาม"
 game_concept_adult_health: "สุขภาพผู้ใหญ่"
 game_concept_adult_health_desc: "[traits|E] บางอย่าง เช่น [GetTrait('ill').GetName( GetNullCharacter )] เป็นอันตรายมากกว่าสำหรับ [adults|E]\n\nบทลงโทษใดๆ ต่อ $game_concept_adult_health$ จะทับซ้อนกับบทลงโทษปกติของ [health|E] แม้จะมาจาก [traits|E] เดียวกันก็ตาม"
 game_concept_elderly_health: "สุขภาพผู้สูงอายุ"
 game_concept_elderly_health_desc: "[traits|E] บางอย่าง เช่น [GetTrait('pneumonic').GetName( GetNullCharacter )] เป็นอันตรายมากกว่าสำหรับผู้ที่มีอายุอย่างน้อย [GetDefine( 'NCharacter', 'FEMALE_ELDERLY_AGE' )|V] ปี\n\nบทลงโทษใดๆ ต่อ $game_concept_elderly_health$ จะทับซ้อนกับบทลงโทษปกติของ [health|E] แม้จะมาจาก [traits|E] เดียวกันก็ตาม"
 game_concept_character_death:0 "การตายของตัวละคร"
 game_concept_character_death_death:0 "ความตาย"
 game_concept_character_death_deaths: "การตาย"
 game_concept_character_death_dying:0 "กำลังจะตาย"
 game_concept_character_death_die:0 "ตาย"
 game_concept_character_death_dies:0 "ตาย"
 game_concept_character_death_desc:1 "ความตายกระตุ้นให้เกิด [succession|E] ซึ่งมีความสำคัญสำหรับ [rulers|E]\n\nหากตัวละครผู้เล่นเสียชีวิต ผู้เล่นจะเล่นต่อในฐานะ [player_heir|E] ของพวกเขา — หรือเผชิญกับการสิ้นสุดเกม (Game Over) หากพวกเขาไม่มีทายาทที่ถูกต้อง"
 game_concept_death_natural_causes: "สาเหตุตามธรรมชาติ"
 game_concept_death_natural_cause: "สาเหตุตามธรรมชาติ"
 game_concept_death_natural_causes_desc: "การจากไปอย่างสงบคือหัวใจสำคัญของการตายด้วย $game_concept_death_natural_causes$ ด้วยเหตุนี้ ความชราและโรคเรื้อรังจึงเป็นหนทางหลักในการละจากโลกนี้ไป"
 game_concept_death_religion: "ศาสนา"
 game_concept_death_religious: "ทางศาสนา"
 game_concept_death_religion_desc: "การถูกส่งไปยังโลกหน้าโดยพวกนอกรีตและการละสังขารอันเป็นการดูหมิ่นศาสนา — การพลีชีพเพื่อศาสนา, การตรึงกางเขน — โดยยังคงซื่อสัตย์ต่อศรัทธาของท่านจนถึงที่สุด จะมีหนทางใดในการจากไปอันแท้จริงยิ่งกว่านี้อีกเล่า"
 game_concept_death_combat: "การต่อสู้"
 game_concept_death_combat_desc: "การได้รับบาดเจ็บถึงแก่ชีวิตขณะเข้าร่วมการรบ การดวล หรือการประลองอื่น ๆ ที่เกี่ยวข้องกับการทหาร เช่น การประลองทวน เป็นหนทางหลักในการจากไปในลักษณะ $game_concept_death_combat$"
 game_concept_death_murder: "การฆาตกรรม"
 game_concept_death_murder_desc: "ในที่สุดความตายก็ไล่ตามท่านทันด้วยการถูกฆาตกรรม — ความตายอันหลอกลวง วิถีที่ท่านเคยอยู่ วิถีที่ท่านตาย"
 game_concept_fertility:0 "ภาวะเจริญพันธุ์"
 game_concept_fertility_desc:0 "$game_concept_fertility$ วัดความสามารถของตัวละครในการมีบุตร"
 game_concept_life_expectancy:0 "อายุขัยคาดการณ์"
 game_concept_life_expectancy_desc:0 "$game_concept_life_expectancy$ คือจำนวนปีที่คาดว่าตัวละครจะมีชีวิตอยู่ก่อนที่จะเสียชีวิตด้วยสาเหตุตามธรรมชาติ\n\n$game_concept_life_expectancy$ ที่สูงจะ ทำให้ตัวละครดูแก่ช้าลงและสามารถมี [children|E] ได้นานขึ้น"
 game_concept_betrothal:0 "การหมั้นหมาย"
 game_concept_betrothals:0 "การหมั้นหมาย"
 game_concept_betrothed:0 "หมั้นหมายแล้ว"
 game_concept_betrothal_desc:1 "[SelectLocalization( HasDlcFeature( 'tours_and_tournaments' ), 'game_concept_betrothal_desc_TOTO_DLC', 'game_concept_betrothal_desc_NO_TOTO_DLC' )]"
 game_concept_betrothal_desc_NO_TOTO_DLC:0 "$game_concept_betrothal$ คือคำสัญญาของการ [marriage|E] ในอนาคตที่สามารถทำได้เมื่อฝ่ายใดฝ่ายหนึ่งยังไม่เป็น [adult|E]\n\nการหมั้นหมายสามารถให้ [alliances|E] ได้ เช่นเดียวกับการสมรส แต่สามารถยกเลิกได้ง่าย เมื่อถึงวัยผู้ใหญ่ การหมั้นหมายสามารถเปลี่ยนเป็นการสมรสที่ถูกต้องได้"
 game_concept_betrothal_desc_TOTO_DLC:0 "$game_concept_betrothal$ คือคำสัญญาของการ [marriage|E] ในอนาคต สามารถทำได้เมื่อฝ่ายใดฝ่ายหนึ่งยังไม่เป็น [adult|E] หรือเมื่อ [GetActivityType( 'activity_wedding' ).GetName] เป็น [grand_wedding_promised|E]\n\nการหมั้นหมายสามารถให้ [alliances|E] ได้ เช่นเดียวกับการสมรส การหมั้นหมายปกติสามารถคงอยู่ได้นานเท่าที่จำเป็นและยกเลิกได้ง่าย สามารถเปลี่ยนเป็นการสมรสที่ถูกต้องได้เมื่อถึงวัยผู้ใหญ่ ในขณะที่การหมั้นหมายสำหรับงาน แต่งงานใหญ่จะเปลี่ยนเป็นการสมรสโดยการทำ [GetActivityType( 'activity_wedding' ).GetName] ให้เสร็จสิ้น"
 game_concept_marriage:0 "การสมรส"
 game_concept_marriages:0 "การสมรส"
 game_concept_marry:0 "สมรส"
 game_concept_marries:0 "สมรส"
 game_concept_married:0 "สมรสแล้ว"
 game_concept_marrying:0 "กำลังสมรส"
 game_concept_marriage_desc:3 "$game_concept_marriages$ คือการรวมกันระหว่าง [spouses|E] สองคน และเป็น (ควบคู่ไปกับ [betrothals|E]) วิธีหลักในการสร้าง [alliance|E] กับ [ruler|E] อื่น\n\n$game_concept_spouses$ อาจให้กำเนิดบุตรที่ [legitimate|E] ซึ่งสามารถ [bred|E] และเลี้ยงดูให้เป็น [heirs|E] ที่เหมาะสมได้\n\n$game_concept_marriages$ จะสิ้นสุดลงก็ต่อเมื่อ $game_concept_spouse$ คนใดคนหนึ่งเสียชีวิตหรือ [divorces|E] อีกฝ่ายหนึ่ง[SelectLocalization( HasDlcFeature( 'tours_and_tournaments' ), 'game_concept_marriage_desc_TOTO_DLC', '' )]"
 game_concept_marriage_desc_TOTO_DLC:0 "\n\nการจัด [GetActivityType( 'activity_wedding' ).GetName] จะเพิ่มการยอมรับข้อเสนอการสมรสอย่างมาก"
 game_concept_concubinage:0 "การมีอนุภรรยา"
 game_concept_concubine:0 "อนุภรรยา"
 game_concept_concubines:0 "อนุภรรยา"
 game_concept_concubine_male:0 "ชาย"
 game_concept_concubine_female:0 "หญิง"
 game_concept_concubinage_desc:1 "อนุภรรยามีสถานะต่ำกว่า [spouse|E] ซึ่งได้รับอนุญาตใน [faiths|E] ที่มี [doctrine|E] [GetFaithDoctrine('doctrine_concubines').GetBaseName]\n\nต่างจาก [marriage|E] การมีอนุภรรยาไม่ก่อให้เกิด [alliances|E] อนุภรรยาสามารถถูกปลดได้ตามต้องการ โดยไม่มีความซับซ้อนของการ [divorce|E] บุตรของอนุภรรยาถือว่าเป็น [legitimate|E]\n\nการมีอนุภรรยาไม่สามารถใช้ร่วมกับ [GetFaithDoctrine('doctrine_polygamy').GetBaseName] ได้"
 game_concept_bastard:0 "ลูกนอกสมรส"
 game_concept_bastards:0 "ลูกนอกสมรส"
 game_concept_bastard_desc:1 "$game_concept_bastards$ คือบุตรนอกกฎหมายที่เกิดนอกสมรส ด้วยเหตุนี้ พวกเขาจึงถูกห้ามไม่ให้สืบทอด [titles|E] อย่างไรก็ตาม พ่อแม่ของพวกเขาสามารถ [Concept( 'legitimized', 'รับรองบุตร' )|E] บุตรของตนได้โดยได้รับความเห็นชอบจาก [house_head|E] ของพวกเขา\n\n[house|E] ใดที่ลูกนอกสมรสสังกัดอยู่นั้นถูกกำหนดโดย [doctrines|E] ของ [faiths|E] ของพ่อแม่เมื่อพวกเขาเกิด\n\nหากลูกนอกสมรสได้รับบรรดาศักดิ์หรือมีบุตรเป็นของตนเอง พวกเขาจะก่อตั้ง [dynasty|E] ใหม่"
 game_concept_legitimized_bastard:0 "ลูกนอกสมรสที่ได้รับการรับรอง"
 game_concept_legitimized:0 "ได้รับการรับรอง"
 game_concept_legitimized_bastard_desc:0 "[bastard|E] อาจได้รับการรับรอง ไม่ว่าจะตั้งแต่แรกเกิด หรือเป็น [character_interaction|E] ในภายหลัง ขึ้นอยู่กับการอนุมัติจาก [house_head|E] ของพวกเขา\n\nลูกนอกสมรสที่ได้รับการรับรองมีสิทธิ์ในการสืบทอด เช่นเดียวกับบุตรที่ [legitimate|E] แต่ตราบาปของการเป็นลูกนอกสมรสจะติดตามพวกเขาไปตลอดชีวิต"
 game_concept_bastardy: "การเป็นลูกนอกสมรส"
 game_concept_bastardy_desc: "$game_concept_bastard_desc$"
 game_concept_real_father:0 "บิดาที่แท้จริง"
 game_concept_real_father_desc:0 "บิดาที่แท้จริงของตัวละคร สำหรับตัวละครส่วนใหญ่ นี่คือตัวละครที่ได้รับการยอมรับอย่างกว้างขวางว่าเป็นบิดาของพวกเขา แต่สำหรับลูกนอกสมรสที่เป็นความลับ มันคือคนอื่น"
 game_concept_legitimate:0 "ถูกกฎหมาย"
 game_concept_legitimate_desc:0 "บุตรที่เกิดจากพ่อแม่ที่ [married|E] ถือว่าเป็น $game_concept_legitimate$ ตรงข้ามกับ [bastards|E] ที่อาจไม่สามารถสืบทอด [titles|E] ใดๆ ได้ บุตรของ [concubines|E] ก็ถือว่าเป็น [legitimate|E] เช่นกัน แม้จะมีสถานะต่ำกว่าเล็กน้อย"
 game_concept_matrilineal:0 "สืบสายทางมารดา"
 game_concept_matrilineally:0 "แบบสืบสายทางมารดา"
 game_concept_matrilineal_desc:0 "ใน [marriage|E] แบบ $game_concept_matrilineal$ บุตรจะเกิดใน [house|E] ของมารดาแทนที่จะเป็นของบิดา"
 game_concept_patrilineal:0 "สืบสายทางบิดา"
 game_concept_patrilineal_desc:0 "ใน [marriage|E] แบบ $game_concept_patrilineal$ บุตรจะเกิดใน [house|E] ของบิดา"
 game_concept_divorce:0 "การหย่าร้าง"
 game_concept_divorced:0 "หย่าร้างแล้ว"
 game_concept_divorcing:0 "กำลังหย่าร้าง"
 game_concept_divorces:0 "การหย่าร้าง"
 game_concept_divorce_desc:0 "[spouses|E] ที่ [married|E] สามารถจัดการ $game_concept_divorce$ ได้ แม้ว่ากฎ ข้อกำหนด และผลที่ตามมาจะขึ้นอยู่กับ [doctrines|E] ของ [faiths|E] ของพวกเขา\n\n[concubines|E] สามารถถูกปลดได้ตามต้องการ"
 game_concept_stress:0 "ความเครียด"
 game_concept_stress_i:0 "@stress_icon!"
 game_concept_stress_gain_i:0 "@stress_gain_icon!"
 game_concept_stress_loss_i:0 "@stress_loss_icon!"
 game_concept_stress_loss: "การลดความเครียด"
 game_concept_stress_critical_i:0 "@stress_critical_icon!"
 game_concept_stress_desc:2 "ตัวละครจะได้รับความเครียดเมื่อกระทำการที่ขัดแย้งกับ [personality_traits|E] ของตน\n\nตัวละครที่ได้รับความเครียดมากพอจะได้รับ [stress_level|E] ด้วย ซึ่งก่อให้เกิดผลเสียต่างๆ ต่อสุขภาพจิตของพวกเขา ซึ่งจะคงอยู่จนกว่าพวกเขาจะสามารถลดความเครียดลงได้\n\nวิธีที่ตรงไปตรงมาในการบรรเทาความเครียดคือการเข้าร่วม [activities|E] เช่น [GetActivityType( 'activity_hunt' ).GetName]"
 game_concept_adult:0 "ผู้ใหญ่"
 game_concept_adults:0 "ผู้ใหญ่"
 game_concept_adulthood:0 "วัยผู้ใหญ่"
 game_concept_adult_desc:0 "$game_concept_adult$ คือตัวละครที่มีอายุอย่างน้อย #V 16#! ปี"
 game_concept_child:0 "เด็ก"
 game_concept_children:0 "เด็ก"
 game_concept_child_possessive: "ของเด็ก"
 game_concept_child_desc:1 "$game_concept_child$ คือตัวละครที่อายุน้อยกว่า #V 16#! ปี"
 game_concept_eligible_child:0 "บุตรผู้มีสิทธิ์"
 game_concept_eligible_children:0 "บุตรผู้มีสิทธิ์"
 game_concept_eligible_child_desc:0 "$game_concept_eligible_children$ คือผู้ที่ได้รับอนุญาตตามกฎหมายให้สืบทอด [titles|E] ของบิดามารดา\n\n[bastards|E] ไม่ถือว่ามีสิทธิ์ เช่นเดียวกับบุตรบางเพศภายใต้ [gender_laws|E] ที่เฉพาะเจาะจง"
 game_concept_alliance:0 "พันธมิตร"
 game_concept_alliances:0 "พันธมิตร"
 game_concept_allies:0 "พันธมิตร"
 game_concept_allied:0 "เป็นพันธมิตร"
 game_concept_ally:0 "พันธมิตร"
 game_concept_ally_i:0 "@alliance_icon!"
 game_concept_alliance_desc:2 "$game_concept_alliance$ คือความสัมพันธ์ทางการทูตระหว่าง [rulers|E] สองคน ผู้ปกครองที่ [independent|E] สามารถเรียก $game_concept_allies$ ให้เข้าร่วม [wars|E] ของกันและกันได้\n\nพันธมิตรถูกสร้างและรักษาไว้ผ่าน [marriage|E] หรือ [betrothal|E] ตราบใดที่ตัวละครทั้งสองที่ แต่งงานกันมีความสัมพันธ์ใกล้ชิดเพียงพอกับผู้ปกครองทั้งสอง ตัวอย่าง เช่น หาก [king|E] แต่งงานธิดาของตนกับโอรสของกษัตริย์อีกองค์ กษัตริย์ทั้งสองจะกลายเป็น $game_concept_allies$\n\n[lieges|E] ยังสามารถสร้าง $game_concept_alliances$ กับ [vassals|E] ของตนได้ เจ้าเหนือหัวไม่สามารถเรียกข้าหลวงเข้าร่วมสงครามได้ แต่มันป้องกันไม่ให้พวกเขาเข้าร่วม [factions|E]"
 game_concept_war:0 "สงคราม"
 game_concept_wars:0 "สงคราม"
 game_concept_war_desc:0 "ความขัดแย้งด้วยอาวุธเป็นวิธีที่ตรงไปตรงมาที่สุดในการขยาย [realm|E] ของท่าน อย่างไรก็ตาม การประกาศ $game_concept_war$ จำเป็นต้องมีเหตุผลอันสมควรในการกระทำ เช่นนั้น เรียกว่า [casus_belli|E] ท่านไม่สามารถบรรลุผลสำเร็จใน $game_concept_war$ ได้มากกว่าที่เหตุแห่งสงครามที่เลือกไว้อนุญาต\n\nสงครามจะชนะได้โดยการเอาชนะ [armies|E] ของศัตรูใน [battle|E] และ [occupying|E] [holdings|E] ของศัตรู การทำ เช่นนั้นจะสะสม [war_score|E] ซึ่งในที่สุดจะบังคับให้ศัตรูยอมรับ [defeat|E] ใน [peace_offer|E]\n\nไม่ว่าผลของ $game_concept_war$ จะเป็นอย่างไร ผู้โจมตีจะได้รับ [truce|E] ต่อผู้ป้องกันเป็นเวลาหนึ่ง แต่ผู้ป้องกันมีอิสระที่จะประกาศสงครามใหม่ได้ทันที"
 game_concept_civil_war:0 "สงครามกลางเมือง"
 game_concept_civil_wars:0 "สงครามกลางเมือง"
 game_concept_raid:0 "การปล้นสะดม"
 game_concept_raids:0 "การปล้นสะดม"
 game_concept_raiding:0 "กำลังปล้นสะดม"
 game_concept_raider:0 "ผู้ปล้นสะดม"
 game_concept_raiders:0 "ผู้ปล้นสะดม"
 game_concept_raided:0 "ถูกปล้นสะดม"
 game_concept_raid_desc:0 "[armies|E] สามารถระดมพลเป็น $game_concept_raiders$ จาก [rally_points|E] ได้ $game_concept_raiders$ สามารถเคลื่อนทัพเข้าไปในดินแดนเพื่อนบ้านและปล้นสะดมเพื่อเอา [gold|E]\n\nในการ $game_concept_raid$ กองทัพปล้นสะดมจะต้องหยุดใน [holding|E] ที่เป็นของ [ruler|E] ต่างชาติและเลือกที่จะเริ่มการปล้นสะดม — เมื่อทำ เช่นนั้น พวกเขาจะติดอยู่กับการปล้นสะดมเป็นเวลาหนึ่ง หลังจากนั้นพวกเขาจะได้รับทองคำและปล้นสะดมที่ดินถือครองนั้น\n\nทองคำจะถูกเก็บไว้กับกองทัพ และจะถูกเพิ่มเข้าคลังเมื่อพวกเขากลับถึงบ้านเท่านั้น หากท่านเอาชนะกองทัพปล้นสะดมที่บรรทุกทองคำ ท่านจะยึดมันมา และพวกเขาจะไม่สามารถปล้นสะดมท่านได้เป็นเวลาหนึ่ง\n\nมีเพียงผู้ปกครองบางคนเท่านั้นที่ได้รับอนุญาตให้ $game_concept_raid$ โดยเฉพาะอย่างยิ่งผู้ปกครอง [tribal|E] และ [GetGovernment( 'nomad_government' ).GetName]\n\nสามารถตั้งค่า [raid_intents|E] เฉพาะเพื่อรับรางวัลที่แตกต่างกันได้"
 game_concept_raid_i: "@raid_icon!"
 game_concept_loot: "ของริบ"
 game_concept_loot_desc: "หาก [holding|E] ถูก [Concept( 'raid', 'Raided' )|E] [occupied|E] ใน [siege|E] หรือมีส่วนร่วมใน [bartering|E] ผู้โจมตีหรือ [barterer|E] จะได้รับ [gold|E] จำนวนหนึ่งเท่ากับ $game_concept_loot$ ยิ่ง [holding|E] มั่งคั่งเพียงใด ก็จะยิ่งมี $game_concept_loot$ มากขึ้นเท่านั้น\n\nที่ดินถือครอง ซึ่งถูกปล้น ยึดครอง หรือแลกเปลี่ยนด้วยเมื่อเร็ว ๆ นี้ จะไม่มีของริบใด ๆ"
 game_concept_loot_i: "@loot_icon!"

 game_concept_barter: "การแลกเปลี่ยน"
 game_concept_barter_i: "@barter_icon!"
 game_concept_barter_desc: "[rulers|E] [GetGovernment( 'wanua_government' ).GetName] สามารถระดม [barterers|E] เพื่อรับ [gold|E] ด้วยสันติวิธี การแลกเปลี่ยนทำงานคล้ายกับ [raiding|E] โดยมีข้อแตกต่างที่สำคัญบางประการ — มันไม่ใช่การกระทำของ [hostile_army|E] และท่านต้องมี [barter_goods|E]\n\nท่านต้องการ #V 2#! สินค้าแลกเปลี่ยน เพื่อรับ #V 1#! [loot|E] จาก [holding|E] หากท่านมีน้อยเกินไป จะไม่มีสิ่งใดเกิดขึ้น\n\nการแลกเปลี่ยนเป็นการกระทำที่เป็นมิตร และที่ดินถือครองเป้าหมายจะได้รับ [GetModifier('recently_bartered_modifier').GetNameWithTooltip] เมื่อเสร็จสิ้น ไม่เหมือนกับการปล้นสะดม ท่านสามารถแลกเปลี่ยนได้อย่างอิสระในดินแดนของ [tributaries|E] และ [suzerain|E] ของท่าน"
 game_concept_bartering: "การแลกเปลี่ยน"
 game_concept_bartered: "ถูกแลกเปลี่ยน"
 game_concept_barterer: "ผู้แลกเปลี่ยน"
 game_concept_barterers: "ผู้แลกเปลี่ยน"
 game_concept_barters: "การแลกเปลี่ยน"
 game_concept_barterer_desc: "[rulers|E] [GetGovernment( 'wanua_government' ).GetName] สามารถ [barter|E] โดยการระดม [armies|E] ของตนเป็น $game_concept_barterers$ พวกเขาทำงานคล้ายกับ [raiders|E] ยกเว้นว่าพวกเขาจะไม่เป็น [hostile_army|E] ต่อ [holder|E] ของ [holding|E] เป้าหมาย\n\nเหล่ากองทัพปล้นสะดมของผู้ปกครองอื่นสามารถต่อสู้กับผู้แลกเปลี่ยนและขโมย [loot|E] ของพวกเขาได้"
 game_concept_barter_goods: "สินค้าแลกเปลี่ยน"
 game_concept_barter_goods_desc: "สินค้าแลกเปลี่ยน — ซึ่งหมายถึงเครื่องอุปโภคบริโภคบนเกาะประเภทต่าง ๆ เช่น ปลาแห้ง หรืองานฝีมือ [Glossary('หวาย', 'RATTAN_GLOSS')] — ถูกใช้เพื่อ [barter|E] และบำรุงรักษา [armies|E] โดย [rulers|E] [GetGovernment( 'wanua_government' ).GetName]\n\n$game_concept_barter_goods$ ถูกผลิตโดย [GetBuilding('tribe_01').GetName] และ [buildings|E] อื่น ๆ"
 game_concept_barter_goods_i: "@barter_goods_icon!"

 game_concept_revolt:0 "การกบฏ"
 game_concept_revolts:0 "การกบฏ"
 game_concept_revolting:0 "กำลังก่อกบฏ"
 game_concept_civil_war_desc:0 "[war|E] ที่ [vassals|E] หนึ่งคนหรือมากกว่า และ/หรือ [counties|E] ลุกขึ้นก่อกบฏต่อ [liege|E] ของตน โดยทั่วไปมักเป็นผลมาจาก [faction|E] ที่ข้อเรียกร้องไม่ได้รับการตอบสนอง\n\nการพ่ายแพ้ใน $game_concept_civil_war$ มักมีผลที่ตามมารุนแรงกว่าข้อเรียกร้องเดิมของฝ่ายกบฏ"
 game_concept_casus_belli:0 "เหตุแห่งสงคราม"
 game_concept_casus_bellis:0 "เหตุแห่งสงคราม"
 game_concept_casus_belli_desc:1 "$game_concept_casus_belli$ ('เหตุผลสำหรับสงคราม') จำเป็นต้องใช้เพื่อประกาศ [war|E] ต่อ [ruler|E] อื่น\n\n$game_concept_casus_belli$ ระบุว่าสงครามเกี่ยวกับอะไร โดยปกติจะเป็นดินแดนเฉพาะ — [war_target|E] เป็นไปไม่ได้ที่จะได้รับสิ่งใดมากไปกว่าที่ $game_concept_casus_belli$ อนุญาต ไม่ว่าศัตรูจะพ่ายแพ้อย่างราบคาบเพียงใด\n\nหนึ่งในเหตุแห่งสงครามที่สำคัญที่สุดคือ [claims|E] ไม่ว่าจะมาจากการ [succession|E] หรือภารกิจ [fabricate_claim|E]"
 game_concept_war_score:0 "คะแนนสงคราม"
 game_concept_war_score_desc:1 "ตัวชี้วัดว่าฝ่ายใดกำลังชนะใน [war|E] มีค่าตั้งแต่ #N -100#! ถึง #P 100#! โดย เช่น #N -25#! สำหรับฝ่ายหนึ่งคือ #P 25#! สำหรับอีกฝ่ายหนึ่ง ที่ #P 100#! คะแนนสงคราม ท่านสามารถบังคับให้อีกฝ่ายยอมรับ [peace_offer|E] ของท่านได้\n\nคะแนนสงครามสามารถได้รับโดย:\n$EFFECT_LIST_BULLET$ การเอาชนะ [armies|E] ใน [battle|E]\n$EFFECT_LIST_BULLET$ การ [imprisoning|E] [ruler|E] ของศัตรูหรือ [heirs|E] ของพวกเขา (ไม่รวม [allies|E] ของพวกเขา)\n$EFFECT_LIST_BULLET$ การ [occupying|E] [holdings|E] ของศัตรู (โดยเฉพาะภายใน [war_target|E])\n$EFFECT_LIST_BULLET$ การยึดครอง [realm_capital|E] ของศัตรู\n$EFFECT_LIST_BULLET$ การควบคุม [objectives|E] ทั้งหมดเป็นระยะเวลานาน"
 game_concept_war_target:0 "เป้าหมายสงคราม"
 game_concept_war_targets:0 "เป้าหมายสงคราม"
 game_concept_war_target_desc:0 "ภูมิภาคบนแผนที่ที่เป็นเป้าหมายโดย [casus_belli|E] ใน [war|E] หากเหตุแห่งสงครามไม่ได้กำหนดเป้าหมายภูมิภาคเฉพาะ [realm_capital|E] ของผู้ป้องกันคือ $game_concept_war_target$\n\nฝ่ายโจมตีจะได้รับ [war_score|E] มากขึ้นโดยการ [occupying|E] [holdings|E] ภายใน $game_concept_war_target$ ในทางกลับกัน ผู้ป้องกันจะ — หลังจากช่วงผ่อนผันเริ่มต้น — เริ่มสะสมคะแนนสงครามจากการยึดครอง [counties|E] ทั้งหมดในภูมิภาค $game_concept_war_target$"
 game_concept_occupation:0 "การยึดครอง"
 game_concept_occupations:0 "การยึดครอง"
 game_concept_occupy:0 "ยึดครอง"
 game_concept_occupies: "ยึดครอง"
 game_concept_occupying:0 "กำลังยึดครอง"
 game_concept_occupied:0 "ถูกยึดครอง"
 game_concept_occupation_desc:0 "[holdings|E] ที่ถูกยึดครองจะอยู่ภายใต้การควบคุมชั่วคราวของ [ruler|E] ที่เป็นศัตรูในระหว่าง [war|E] [army|E] ที่ยืนอยู่ใน [barony|E] ซึ่งมี [fortified_holding|E] ที่เป็นศัตรู จะเริ่ม [besiege|E] มัน หากจำนวน [soldiers|E] ในกองทัพมีมากกว่า [garrison|E]\n\nหากการล้อมประสบความสำเร็จ ปราการนั้นจะถูกยึดครอง ซึ่งจะมอบ [war_score|E] แก่ฝ่ายที่ยึดครองใน [war|E]\n\nการยึดครองปราการไม่ได้หมายความว่ามันเป็นของท่านแล้ว! เฉพาะดินแดนที่ระบุโดย [war_target|E] เท่านั้นที่จะสามารถเปลี่ยนมือได้ และจะเกิดขึ้นก็ต่อเมื่อฝ่ายโจมตี [wins|E]"
 game_concept_peace:0 "สันติภาพ"
 game_concept_peace_offer:0 "ข้อเสนอสันติภาพ"
 game_concept_peace_offers:0 "ข้อเสนอสันติภาพ"
 game_concept_peace_desc:1 "[wars|E] สามารถจบลงด้วย $game_concept_peace$ สามประเภท: [victory|E], [defeat|E], หรือ [white_peace|E]\n\nที่ #V 100%#! [war_score|E] อีกฝ่ายไม่สามารถปฏิเสธข้อเสนอสันติภาพและต้องยอมรับ [defeat|E]\n\nผลของ $game_concept_victory$ หรือ $game_concept_defeat$ ขึ้นอยู่กับประเภทของ [casus_belli|E] ที่ใช้ในการประกาศสงครามและ [war_target|E] ที่เกี่ยวข้องทั้งหมด"
 game_concept_victory:0 "ชัยชนะ"
 game_concept_win:0 "ชนะ"
 game_concept_wins:0 "ชนะ"
 game_concept_winning:0 "กำลังชนะ"
 game_concept_victory_desc:0 "$game_concept_victory$ เป็นหนึ่งในสาม [peace_offers|E] ที่เป็นไปได้ ผลลัพธ์ที่แน่นอนของชัยชนะใน [war|E] ขึ้นอยู่กับ [casus_belli|E]\n\nสำหรับผู้โจมตี โดยทั่วไปจะเกี่ยวข้องกับการยึด [titles|E] ภายในภูมิภาค [war_target|E]\n\nสำหรับผู้ป้องกัน ชัยชนะมักหมายความว่าผู้โจมตีต้องจ่ายทองคำจำนวนมากเป็นค่าปฏิกรรมสงคราม"
 game_concept_defeat:0 "ความพ่ายแพ้"
 game_concept_defeat_desc:0 "$game_concept_defeat$ เป็นหนึ่งในสาม [peace_offers|E] ที่เป็นไปได้ ผลลัพธ์ที่แน่นอนของความพ่ายแพ้ใน [war|E] ขึ้นอยู่กับ [casus_belli|E] แต่ผู้ป้องกันที่พ่ายแพ้มักจะสูญเสีย [titles|E] ภายในภูมิภาค [war_target|E] ในขณะที่ผู้โจมตีที่พ่ายแพ้จะสูญเสียสิ่งต่างๆ เช่น [gold|E], [prestige|E] และ [piety|E] แทน"
 game_concept_white_peace:0 "สันติภาพสีขาว"
 game_concept_white_peace_desc:0 "$game_concept_white_peace$ เป็นหนึ่งในสาม [peace_offers|E] ที่เป็นไปได้ บางครั้ง ทั้งสองฝ่ายจะตกลงกันว่า [war|E] ไม่คุ้มค่าที่จะดำเนินต่อไปอีกแล้ว\n\nด้วยสันติภาพสีขาว ผู้โจมตีมักจะยังคงสูญเสีย [piety|E] หรือ [prestige|E] บางส่วน แต่จะน้อยกว่าการ [defeat|E] ที่น่าอัปยศอดสูมาก"
 game_concept_siege:0 "การล้อม"
 game_concept_sieges:0 "การล้อม"
 game_concept_besiege:0 "ล้อม"
 game_concept_besieging:0 "กำลังล้อม"
 game_concept_besieged:0 "ถูกล้อม"
 game_concept_siege_desc:0 "การล้อม คือการที่ [army|E] ปิดล้อม [fortified_holding|E] เพื่อให้พลเมืองอดอยากจนยอมจำนน เพื่อที่มันจะได้ถูก [occupied|E] การล้อมจะเริ่มต้นขึ้นโดยอัตโนมัติเมื่อกองทัพเข้าสู่พื้นที่ของปราการที่เป็นศัตรูและยืนนิ่งอยู่กับที่ — หากกองทัพมีจำนวนมากกว่า [garrison|E]\n\nกองทัพที่กำลังปิดล้อมสามารถ [assault|E] ปราการได้ หากกำแพงของมันถูกพังทลายลง"
 game_concept_assault:0 "การจู่โจม"
 game_concept_assaults:0 "การจู่โจม"
 game_concept_assaulting:0 "กำลังจู่โจม"
 game_concept_assaulted:0 "ถูกจู่โจม"
 game_concept_assault_desc:0 "การโจมตี คือการที่ [army|E] ซึ่งกำลัง [besieging|E] พยายามบุกเข้ายึด [fortified_holding|E] โดยเสี่ยงต่อการสูญเสีย [soldiers|E] จำนวนมาก การโจมตีจะสามารถกระทำได้ก็ต่อเมื่อกำแพงของปราการถูกพังทลายลง ซึ่งจำเป็นต้องให้กองทัพนั้นมี [siege_weapons|E]"
 game_concept_fort_level:0 "ระดับป้อมปราการ"
 game_concept_fort_level_i:0 "@fort_icon!"
 game_concept_fort_level_desc: "[holdings|E] บางแห่งมีการเสริมกำลังป้องกันและจำเป็นต้องถูก [besieged|E] และ [occupied|E] เพื่อให้สามารถเข้าควบคุม [county|E] ได้\n\n$game_concept_fort_level$ ของ [fortified_holdings|E] ดังกล่าว จะเป็นตัวกำหนดว่าการล้อมจะกินเวลายาวนานเพียงใด\n\n$game_concept_fort_level$ ที่สูงจะต้องใช้ [siege_weapons|E] เพื่อให้การ $game_concept_besieged$ มีประสิทธิภาพ แม้ว่าอาวุธปิดล้อมแต่ละชนิดจะมีประสิทธิภาพถึงเพียงระดับป้อมปราการที่กำหนดไว้เท่านั้น\n\nการเพิ่มระดับป้อมปราการของปราการที่ไม่ได้มีการเสริมกำลังป้องกันจะไม่มีผลใดๆ"
 game_concept_garrison:0 "กองทหารรักษาการณ์"
 game_concept_garrison_desc:2 "$game_concept_garrison$ ของ [fortified_holding|E] ป้องกันไม่ให้ถูก [besieged|E] โดย [armies|E] ที่เล็กกว่า\n\n กองทัพที่กำลังล้อมต้องมี [soldiers|E] มากกว่ากองทหารรักษาการณ์ เพื่อให้การล้อมดำเนินต่อไปได้\n\nเมื่อ [siege|E] พ่ายแพ้ $game_concept_garrison$ จะถูกตั้งค่าเป็น [GetDefine('NDomain', 'HOLDING_MIN_GARRISON_COUNT')|0] จากนั้น $game_concept_garrison$ จะเติมเต็มทุกเดือนขึ้นอยู่กับ [garrison_reinforcement|E] จนกว่าจะถึงความจุสูงสุด\n\nเมื่อ [siege|E] เริ่มต้น การประจำการของ $game_concept_garrison$ จะส่งผลต่อจำนวน [siege_progress|E] ที่ต้องการ"
 game_concept_garrison_reinforcement:0 "อัตราการเสริมกำลังกองทหารรักษาการณ์"
 game_concept_garrison_reinforcement_desc:0 "$game_concept_garrison_reinforcement$ ของ [fortified_holding|E] กำหนดว่า [garrison|E] ฟื้นตัวเร็วเพียงใดหลังจากแพ้ [siege|E]\n\nทุกเดือน [garrison|E] จะฟื้นคืนเปอร์เซ็นต์ของความจุสูงสุดเท่ากับอัตราปัจจุบัน สามารถเพิ่มได้โดยการอัปเกรด [holding|E]\n\nอย่างไรก็ตาม ในระหว่าง [siege|E] การเสริมกำลังจะถูกระงับและอัตราจะถูกตั้งค่าเป็น 0"
 game_concept_fortified_holding:0 "ปราการที่มีการเสริมกำลัง"
 game_concept_fortified_holdings:0 "ปราการที่มีการเสริมกำลัง"
 game_concept_fortified_holding_desc:0 "$game_concept_fortified_holding$ คือ [holding|E] ที่มี [buildings|E] ซึ่งเพิ่ม [fort_level|E] ของมัน โดยปกติแล้ว [county_capitals|E] จะได้รับการเสริมกำลังเสมอ\n\nเพื่อที่จะ [occupy|E] [county|E] ใดๆ ให้ได้อย่างสมบูรณ์ จะต้องยึดครองปราการที่มีการเสริมกำลังทั้งหมดเสียก่อน"
 game_concept_army:0 "กองทัพ"
 game_concept_armies:0 "กองทัพ"
 game_concept_army_desc:1 "กองทัพใช้เพื่อชนะ [wars|E] โดยการเข้าร่วม [battle|E] กับกองทัพอื่น และเพื่อ [besiege|E] และ [occupy|E] [fortified_holdings|E] ของศัตรู กองทัพถูกระดมพลที่ [rally_points|E] และส่วนใหญ่ประกอบด้วย [levies|E] และ [men_at_arms|E] แต่ยังสามารถเสริมกำลังด้วย [mercenaries|E] และ [holy_orders|E]\n\n กองทัพสามารถเคลื่อนที่ข้ามน้ำได้โดยใช้ [gold|E] จำนวนหนึ่งเพื่อจัดหาการขนส่ง พวกเขาสามารถประสบความสูญเสียจาก [attrition|E] หาก [barony|E] ในท้องที่ไม่สามารถ [supply|E] พวกเขาได้อย่างเพียงพอ"
 game_concept_holy_order:0 "คณะนักรบศักดิ์สิทธิ์"
 game_concept_holy_orders:0 "คณะนักรบศักดิ์สิทธิ์"
 game_concept_holy_order_i: "@government_type_holy_order!"
 game_concept_holy_order_desc:1 "$game_concept_holy_orders$ เป็นองค์กรทางทหารอิสระที่ทำงานเพื่อปกป้องและขยายอิทธิพลของ [faith|E] ของตน\n\nผู้ปกครองในศรัทธาของพวกเขาอาจจ้างพวกเขาหากพวกเขากำลังทำ [war|E] กับ [faith|E] ที่ [faith_hostile|L] หรือ [faith_evil|L] โดยเสียค่า [piety|E] เมื่อสงครามนี้สิ้นสุดลง พวกเขาจะไม่ต่อสู้เพื่อผู้ปกครองนั้นอีกต่อไป\n\n$game_concept_holy_order$ อาจมี [holy_order_patron|E] ซึ่งไม่จำเป็นต้องจ่ายเงินเพื่อใช้บริการของพวกเขา"
 game_concept_holy_order_patron:0 "ผู้อุปถัมภ์คณะนักรบศักดิ์สิทธิ์"
 game_concept_holy_order_patron_desc:0 "$game_concept_holy_order_patron$ ของ [holy_order|E] คือกษัตริย์หรือจักรพรรดิที่นับถือ [faith|E] เดียวกันและมีเมืองหลวงของพวกเขาอยู่ใน [realm|E]\n\n$game_concept_holy_order_patron$ อาจขอรับการสนับสนุนจาก $game_concept_holy_order$ เพื่อต่อสู้กับศัตรูทางศาสนาได้ฟรี แทนที่จะจ่าย [piety|E]\n\nไม่ใช่ $game_concept_holy_orders$ ทั้งหมดจะมี $game_concept_holy_order_patron$"
 game_concept_mercenary_company:0 "กองร้อยทหารรับจ้าง"
 game_concept_mercenaries:0 "ทหารรับจ้าง"
 game_concept_mercenary:0 "ทหารรับจ้าง"
 game_concept_mercenary_i: "@government_type_mercenary!"
 game_concept_mercenary_company_desc:0 "[mercenaries|E] คือ [soldiers|E] รับจ้างที่ต่อสู้เพื่อแลกกับ [gold|E] กองทัพ [armies|E] ทหารรับจ้างมีขนาดต่างๆ กัน โดยมี [men_at_arms|E] ประเภทต่างๆ และ [knights|E] จำนวนหนึ่ง\n\nทหารรับจ้างลงนามในสัญญา #V [GetDefine('NMercenary', 'BASE_HIRE_MONTHS')] เดือน#! ที่สามารถขยายเวลาได้อีก #V [GetDefine('NMercenary', 'BASE_HIRE_MONTHS')] เดือน#! หากท่านยังอยู่ใน [war|E] สัญญาทหารรับจ้างยังคงมีผล แม้ว่ากองร้อยของพวกเขาจะถูกปลดประจำการ — พวกเขาสามารถถูกระดมพลอีกครั้งโดยไม่มีค่าใช้จ่ายเพิ่มเติม\n\nท่านได้รับอนุญาตให้เป็น [debt|E] เพื่อจ้างทหารรับจ้าง #weak (สูงสุด [GetDefine('NMercenary', 'ALLOWED_DEBT_MONTHS')] เดือน)#!."
 game_concept_mercenary_contract:0 "สัญญาทหารรับจ้าง"
 game_concept_mercenary_contracts: "สัญญาทหารรับจ้าง"
 game_concept_mercenary_contract_desc:0 "การทำสัญญา [mercenary|E] มีค่าใช้จ่ายครั้งเดียว ซึ่งอนุญาตให้ใช้กองกำลังของพวกเขาเป็นเวลา #V [GetDefine('NMercenary', 'BASE_HIRE_MONTHS')] เดือน#!."
 game_concept_hired_troops:0 "ทหารที่จ้างมา"
 game_concept_hired_troops_desc:0 "ทหารที่จ้างมาคือ [mercenaries|E] หรือ [holy_orders|E]"
 game_concept_commander:0 "ผู้บัญชาการ"
 game_concept_commanders:0 "ผู้บัญชาการ"
 game_concept_army_commanders:0 "ผู้บัญชาการกองทัพ"
 game_concept_commanding:0 "กำลังบัญชาการ"
 game_concept_army_commander:0 "ผู้บัญชาการกองทัพ"
 game_concept_army_commander_desc:0 "$game_concept_army_commander$ คือตัวละครที่บัญชาการ [army|E] [courtiers|E] หรือ [vassals|E] โดยตรงของท่านสามารถได้รับมอบหมายให้เป็นผู้บัญชาการได้ (ขึ้นอยู่กับอายุ [health|E] และ [doctrines|E])\n\nใน [battle|E] [martial_skill|E] ของผู้บัญชาการมีอิทธิพลอย่างมากต่อ [advantage|E] ตราบใดที่มีผู้บัญชาการอยู่ จะมีการ [rolls|E] เพิ่มเติมเพื่อพยายามเพิ่ม $game_concept_advantage$\n\nนอกจากนี้ [commander_traits|E] สามารถให้สิทธิประโยชน์ต่างๆ แก่กองทัพได้ ทั้งในและนอกการรบ"
 game_concept_commander_trait:0 "ลักษณะนิสัยผู้บัญชาการ"
 game_concept_commander_traits:0 "ลักษณะนิสัยผู้บัญชาการ"
 game_concept_commander_trait_desc:1 "$game_concept_commander_traits$ เป็น [traits|E] พิเศษที่มอบสิทธิประโยชน์ที่เป็นประโยชน์แก่ตัวละครเมื่อทำหน้าที่เป็น [commanders|E] ของ [army|E]\n\nลักษณะนิสัยผู้บัญชาการมักได้รับจากเด็กที่ได้รับการเลี้ยงดูโดยเน้น [education_focus|E] ด้านการทหาร แต่ยังสามารถได้รับผ่าน [martial_lifestyle|E] และวิธีการอื่นๆ"
 game_concept_battle_advantage:0 "ความได้เปรียบในการรบ"
 game_concept_advantage:0 "ความได้เปรียบ"
 game_concept_battle_advantage_desc:0 "$game_concept_battle_advantage$ ทำให้ฝ่ายหนึ่งใน [battle|E] สร้างความเสียหายได้มากขึ้น ยิ่ง $game_concept_advantage$ สูงเท่าใด [soldiers|E] ก็จะสร้างความเสียหายได้มากขึ้นเท่านั้น\n\nการรบมักเริ่มต้นโดยฝ่ายหนึ่งมีความได้เปรียบสูงกว่าโดยพิจารณาจาก [terrain|E] และ [martial_skill|E] และ [commander_traits|E] ของ [commander|E] ฝ่ายใดฝ่ายหนึ่งอาจได้รับ $game_concept_advantage$ เพิ่มเติมจาก [rolls|E] ของ $game_concept_commander$"
 game_concept_education_trait:0 "ลักษณะนิสัยทางการศึกษา"
 game_concept_education_traits:0 "ลักษณะนิสัยทางการศึกษา"
 game_concept_education_trait_desc:2 "เมื่อถึง [adulthood|E] ตัวละครทุกคนจะได้รับ $game_concept_education_trait$\n\nลักษณะนิสัยทางการศึกษามีห้าประเภท ซึ่ง แต่ละประเภทสอดคล้องโดยตรงกับ [skill|E] เฉพาะ\n\nคุณภาพของ [trait|E] ที่ตัวละครได้รับจะขึ้นอยู่กับว่า [childhood_trait|E] ของพวกเขาตรงกับ [education_focus|E] ได้ดีเพียงใด รวมถึงทักษะที่เกี่ยวข้องของ [guardian|E] ของพวกเขา\n\n$game_concept_education_trait$ ของตัวละครจะช่วยปรับปรุงความเร็วในการก้าวหน้าใน [lifestyle|E] ที่สอดคล้องกัน"
 game_concept_education_focus:0 "จุดเน้นการศึกษา"
 game_concept_education:0 "การศึกษา"
 game_concept_educations:0 "การศึกษา"
 game_concept_educate:0 "ให้การศึกษา"
 game_concept_educated:0 "ได้รับการศึกษา"
 game_concept_education_focus_short:0 "จุดเน้น"
 game_concept_education_focus_desc:1 "[children|E] ทุกคนที่มีอายุระหว่าง #V 6#! ถึง #V 9#! ปี สามารถได้รับ $game_concept_education_focus$ ที่มุ่งเน้นไปที่หนึ่งในห้า [skills|E]\n\nการศึกษาจะสิ้นสุดลงด้วย [education_trait|E] เมื่อถึง [adulthood|E]\n\nคุณภาพของ $game_concept_education_trait$ ที่พวกเขาได้รับจะขึ้นอยู่กับว่า [childhood_trait|E] ของพวกเขาตรงกับจุดเน้นการศึกษาของพวกเขาได้ดีเพียงใด รวมถึงทักษะที่เกี่ยวข้องของ [guardian|E] ของพวกเขา\n\nเมื่อตั้งค่าจุดเน้นการศึกษา ท่านยังสามารถระบุได้ว่าเด็กควรได้รับการเลี้ยงดูใน [faith|E] และ/หรือ [culture|E] ของ [guardian|E] หรือไม่"
 game_concept_childhood_trait:0 "ลักษณะนิสัยวัยเด็ก"
 game_concept_childhood_trait_desc:0 "เด็กทุกคนจะได้รับลักษณะวัยเด็กเมื่อเติบโตขึ้น เช่น [GetTrait('rowdy').GetName( GetNullCharacter )] หรือ [GetTrait('charming').GetName( GetNullCharacter )]\n\nลักษณะนิสัยที่ได้รับบ่งชี้ว่า [education_focus|E] ใดจะเหมาะสมกับพวกเขามากที่สุด"
 game_concept_diplomacy:0 "การทูต"
 game_concept_diplomacy_i:0 "@skill_diplomacy_icon!"
 game_concept_diplomacy_skill:0 "ทักษะการทูต"
 game_concept_diplomacy_skill_desc:1 "$game_concept_diplomacy$ เป็น [skill|E] ที่แสดงถึงความสามารถของตัวละครในการสร้างเสน่ห์ เจรจาต่อรอง และโน้มน้าวใจ\n\nการทูตส่งผลโดยตรงต่อ [opinions|E] ที่ตัวละครอื่นมีต่อท่าน นอกจากนี้ยังใช้เพื่อส่งเสริม [schemes|E] ทางการทูต\n\n[lifestyle|E] ที่สอดคล้องกันคือ [diplomacy_lifestyle|E]"
 game_concept_martial:0 "การทหาร"
 game_concept_martial_i:0 "@skill_martial_icon!"
 game_concept_martial_skill:0 "ทักษะการทหาร"
 game_concept_martial_skill_desc:2 "[skill|E] $game_concept_martial$ บ่งชี้ว่าตัวละครเก่งกาจเพียงใดในการทำ [war|E] และนำ [armies|E] ใน [battle|E]\n\nทักษะการทหารที่สูงมีความสำคัญสำหรับ [army_commanders|E] เนื่องจากช่วยปรับปรุง [advantage|E] ของพวกเขาใน [battle|E]\n\n[lifestyle|E] ที่สอดคล้องกันคือ [martial_lifestyle|E]"
 game_concept_stewardship:0 "การคลัง"
 game_concept_stewardship_i:0 "@skill_stewardship_icon!"
 game_concept_stewardship_skill:0 "ทักษะการคลัง"
 game_concept_stewardship_skill_desc:1 "$game_concept_stewardship$ เป็น [skill|E] ที่ช่วยให้ [rulers|E] บริหารจัดการ [domains|E] ของตนได้ ทักษะนี้จะช่วยเพิ่ม [taxation|E] โดยตรง ทำให้เป็นทักษะที่มีประโยชน์อย่างยิ่งสำหรับผู้ปกครองทุกคน\n\n[lifestyle|E] ที่สอดคล้องกันคือ [stewardship_lifestyle|E]"
 game_concept_intrigue:0 "การเล่ห์กล"
 game_concept_intrigue_i:0 "@skill_intrigue_icon!"
 game_concept_intrigue_skill:0 "ทักษะการเล่ห์กล"
 game_concept_intrigue_skill_desc:1 "$game_concept_intrigue$ เป็น [skill|E] ที่แสดงถึงความสามารถของตัวละครในการทำความเข้าใจและชักจูงตัวละครอื่น และในการวางแผนการที่ซับซ้อน\n\nส่วนใหญ่ใช้เพื่อส่งเสริม — และป้องกัน — [schemes|E] การเล่ห์กล\n\n[lifestyle|E] ที่สอดคล้องกันคือ [intrigue_lifestyle|E]"
 game_concept_learning:0 "การเรียนรู้"
 game_concept_learning_i:0 "@skill_learning_icon!"
 game_concept_learning_skill:0 "ทักษะการเรียนรู้"
 game_concept_learning_skill_desc:1 "$game_concept_learning$ เป็น [skill|E] ที่วัดความรู้หนังสือและสติปัญญาของตัวละคร ทักษะการเรียนรู้ของ [ruler|E] ส่งผลต่อค่าใช้จ่ายในการเพิ่ม [crown_authority|E] และยังให้ [piety|E] รายเดือนจำนวนหนึ่ง\n\nตัวละครที่มีการเรียนรู้สูงคาดว่าจะมีความรู้อย่างกว้างขวางในทุกด้านวิชาการทั่วไป รวมถึงเทววิทยา ปรัชญา ภาษา และคณิตศาสตร์\n\n[lifestyle|E] ที่สอดคล้องกันคือ [learning_lifestyle|E]"
 PROWESS_MUSCLE_INFO:1 "การเพิ่มความเก่งกาจผ่านแหล่งธรรมชาติ #weak (ไม่ใช่ผ่าน [artifacts|E])#! จะเพิ่มมวลกล้ามเนื้อของตัวละคร"
 PROWESS_MUSCLE_INFO_PERSONAL:0 "การเพิ่ม [prowess|E] จะเพิ่มมวลกล้ามเนื้อของท่าน"
 game_concept_prowess:0 "ความเก่งกาจ"
 game_concept_prowess_i:0 "@skill_prowess_icon!"
 game_concept_prowess_skill:0 "ทักษะความเก่งกาจ"
 game_concept_prowess_skill_desc:3 "$game_concept_prowess$ เป็น [skill|E] ที่สะท้อนถึงความถนัดของตัวละครในการต่อสู้แบบตัวต่อตัว\n\nทักษะความสามารถในการต่อสู้ที่สูง หมายความว่าพวกเขามีโอกาสรอดชีวิตและทำผลงานได้ดีมากขึ้น ทั้งในฐานะ [knights|E] ใน [battles|E] และใน [single_combat_duel_plural|E]\n\nทักษะความสามารถในการต่อสู้แต่ละแต้มจะมอบให้แก่อัศวินดังนี้:\n$BULLET_WITH_TAB$[damage|E]: #V [GetDefine('NCombat', 'KNIGHT_DAMAGE_PER_PROWESS')]#!\n$BULLET_WITH_TAB$[toughness|E]: #V [GetDefine('NCombat', 'KNIGHT_TOUGHNESS_PER_PROWESS')]#!\n\n$PROWESS_MUSCLE_INFO$"
 game_concept_natural_prowess:0 "ความเก่งกาจโดยธรรมชาติ"
 game_concept_lifestyle:0 "วิถีชีวิต"
 game_concept_lifestyles:0 "วิถีชีวิต"
 game_concept_lifestyle_desc:2 "[rulers|E] ที่เป็น [adult|E] อาจเลือก $game_concept_lifestyle$ ซึ่งจะ ทำให้พวกเขาสามารถเลือก [focus|E] และเริ่มได้รับ [perks|E]\n\nแต่ละ $game_concept_lifestyle$ มีประเภทของ [experience|E] ของตัวเอง ซึ่งใช้ในการซื้อ $game_concept_perks$ ตัวอย่าง เช่น ประสบการณ์ใน [intrigue_lifestyle|E] จำเป็นต้องใช้เพื่อรับ $game_concept_perks$ เช่น [GetPerk( 'dreadful_perk' ).GetName( GetNullCharacter )] หรือ [GetPerk( 'like_weed_in_a_garden_perk' ).GetName( GetNullCharacter )]\n\n$game_concept_lifestyles$ คือ:\n$BULLET_WITH_TAB$ [diplomacy_lifestyle|E]\n$BULLET_WITH_TAB$ [stewardship_lifestyle|E]\n$BULLET_WITH_TAB$ [martial_lifestyle|E]\n$BULLET_WITH_TAB$ [intrigue_lifestyle|E]\n$BULLET_WITH_TAB$ [learning_lifestyle|E]\n$BULLET_WITH_TAB$ [wanderer_lifestyle|E]"
 game_concept_lifestyle_experience:0 "ประสบการณ์วิถีชีวิต"
 game_concept_experience:0 "ประสบการณ์"
 game_concept_lifestyle_experience_desc:0 "$game_concept_lifestyle_experience$ จะสะสมแบบติดตัวโดยการเลือก [focus|E] หรือได้รับจากเหตุการณ์ มี $game_concept_lifestyle_experience$ ประเภทต่างๆ หนึ่งประเภทต่อหมวดหมู่ [lifestyle|E]\n\nการได้รับ $game_concept_lifestyle_experience$ เพียงพอภายในหมวดหมู่จะได้รับ [perk|E]"
 game_concept_focus:0 "จุดเน้น"
 game_concept_focuses:0 "จุดเน้น"
 game_concept_focus_desc:0 "แต่ละ [lifestyle|E] ประกอบด้วย $game_concept_focuses$ จำนวนหนึ่ง ซึ่งต้องเลือกหนึ่งอย่างเมื่อเลือก $game_concept_lifestyle$\n\n$game_concept_focuses$ ให้โบนัสแบบติดตัวและมีอิทธิพลต่อประเภทของเหตุการณ์ที่ปรากฏ #weak (เช่น การมี $intrigue_temptation_focus$ จะเพิ่ม [fertility|E] และเพิ่มโอกาสที่เหตุการณ์เกี่ยวกับ Seduction จะปรากฏขึ้น)#!\n\nตัวละครสามารถสลับระหว่าง $game_concept_focuses$ ภายใน $game_concept_lifestyle$ เดียวกันได้โดยไม่สูญเสียความสามารถในการได้รับประสบการณ์ใน $game_concept_lifestyle$ นั้น"
 game_concept_dynasty_perk:0 "มรดกราชวงศ์"
 game_concept_dynasty_perks:0 "มรดกราชวงศ์"
 game_concept_dynasty_perk_desc:0 "$game_concept_dynasty_perks$ เป็นคุณสมบัติที่ปลดล็อกได้ ซึ่งให้ผลกระทบอันทรงพลังแก่สมาชิกทุกคนใน [dynasty|E]\n\n[dynast|E] ปลดล็อก $game_concept_dynasty_perks$ โดยใช้ [dynasty_prestige|E] โดย แต่ละมรดกในสายเดียวกันจะมีราคาแพงขึ้นและทรงพลังมากขึ้นเรื่อยๆ\n\n$game_concept_dynasty_perks$ นั้นได้มาอย่างช้าๆ แต่จะอยู่กับราชวงศ์ตลอดไป"
 game_concept_perk:0 "ความสามารถ"
 game_concept_perks:0 "ความสามารถ"
 game_concept_perk_desc:1 "คุณสมบัติพิเศษคือพรที่ปลดล็อกได้ ซึ่งให้ผลกระทบที่เป็นประโยชน์และน่าสนใจมากมาย พวกมันถูกปลดล็อกโดยการเลือก [focus|E] ภายใน [lifestyle|E] และใช้ [experience|E] รูปแบบที่เกี่ยวข้อง #weak (เช่น $game_concept_experience$ $game_concept_intrigue_lifestyle$ หากท่านต้องการปลดล็อก $game_concept_perk$ #weak (e.g. Intrigue __TOKEN_3__ if you wish to unlock an __TOKEN_4__ __TOKEN_5__.)#!)#!"
 game_concept_decision:0 "การตัดสินใจ"
 game_concept_decisions:0 "การตัดสินใจ"
 game_concept_decide:0 "ตัดสินใจ"
 game_concept_decision_desc:1 "$game_concept_decision$ เป็นการกระทำพิเศษที่ [character|E] สามารถทำได้ตามอัธยาศัย\n\nการตัดสินใจ แต่ละครั้งมีผลกระทบของตัวเอง ซึ่งอาจมีตั้งแต่การเปลี่ยนแปลงเล็กน้อยของตัวละครไปจนถึงผลกระทบที่สั่นสะเทือน [empire|e]\n\nการตัดสินใจที่ย้ายตัวละครไปยังสถานที่เฉพาะเป็นระยะเวลาหนึ่งเรียกว่า [activities|E]"
 
 game_concept_activity:0 "กิจกรรม"
 game_concept_activities:0 "กิจกรรม"
 game_concept_activity_desc:3 "$game_concept_activity$ เป็นโอกาสพิเศษที่จัดขึ้นเพื่อวัตถุประสงค์เฉพาะ เช่น การไป [GetActivityType( 'activity_hunt' ).GetName] เพื่อบรรเทา [stress|E]\n\n[activity_host_short|E] จัดกิจกรรมใน [location|E] เฉพาะ ซึ่งส่งผลกระทบต่อกิจกรรมในรูปแบบต่างๆ และทุกคนที่เข้าร่วมจะต้อง [travel|E] ไปที่นั่น\n\nตัวละครที่เข้าร่วมทุกคนโต้ตอบกันโดยการตั้งค่า [intent|E] ซึ่งพวกเขาพยายามดำเนินการในระหว่างกิจกรรม[SelectLocalization( HasDlcFeature( 'advanced_activities' ), 'game_concept_activity_desc_GRAND_ACTIVITY_DLC', '' )]"
 game_concept_activity_desc_GRAND_ACTIVITY_DLC:0 "\n\n$game_concept_activity$ ปกติ เช่น [GetActivityType( 'activity_feast' ).GetName] หรือ [GetActivityType( 'activity_hunt' ).GetName] มีขนาดเล็กกว่าและน่าประทับใจน้อยกว่า [grand_activities|E]"
 game_concept_activity_option:0 "ตัวเลือกกิจกรรม"
 game_concept_activity_options:0 "ตัวเลือกกิจกรรม"
 game_concept_activity_option_desc:0 "[activities|E] ทั้งหมดมีตัวเลือกที่ช่วยให้ท่านปรับ แต่งการวางแผนกิจกรรมของท่านได้ ตัวเลือกมีค่าใช้จ่ายและข้อกำหนดต่างๆ"
 game_concept_activity_type:0 "ประเภทกิจกรรม"
 game_concept_activity_types:0 "ประเภทกิจกรรม"
 game_concept_activity_type_desc:0 "[activities|E] และ [grand_activities|E] บางอย่างมีประเภทที่แตกต่างกัน ซึ่งสอดคล้องกับรูปแบบพิเศษของกิจกรรม\n\nตัวอย่าง เช่น เมื่อวางแผนการล่า ท่านอาจเลือกระหว่าง มาตรฐาน, การล่าด้วยเหยี่ยว และตำนาน หากท่านมีคุณสมบัติตรงตามข้อกำหนดสำหรับประเภทนั้น"
 game_concept_activity_phase:1 "ช่วงกิจกรรม"
 game_concept_activity_phases:1 "ช่วงกิจกรรม"
 game_concept_activity_phase_desc:2 "ช่วงการดำเนินการของกิจกรรม เช่น [contest|E] ใน [GetActivityType( 'activity_tournament' ).GetName], [stop|E] ใน [tour|E], หรือจุดหมายปลายทางของ [pilgrimage|E] ซึ่งในระหว่างนั้นเหตุการณ์จะเกิดขึ้น"
 game_concept_activity_phase_action:0 "การดำเนินการช่วงกิจกรรม"
 game_concept_activity_phase_action_desc:0 "ทุกๆ #V 7#! วันขณะอยู่ใน [activity|E] มีโอกาสที่ #EMP บางอย่าง#! จะเกิดขึ้นนอกเหนือจากเหตุการณ์ปกติ สิ่งที่เกิดขึ้นเหล่านี้จะแสดงที่มุมบนขวาของหน้าต่างกิจกรรม\n\nสิ่งที่สามารถเกิดขึ้นได้ขึ้นอยู่กับ [activity_type|E] ตัวอย่าง เช่น: [activity_host|E] สามารถได้รับ [prestige|E] หรือ [opinion|E] ของ [activity_guest|E] ใน [GetActivityType('activity_feast').GetName]\n\nมีโอกาสเสมอที่จะไม่มีอะไรเกิดขึ้น โดยเฉพาะอย่างยิ่งก่อนที่ [activity_phase|E] ปัจจุบันจะเป็น [activity_state_active|E]"
 game_concept_activity_state_passive:0 "อยู่เฉย"
 game_concept_activity_state_passive_desc:1 "[activity|E] อยู่ในช่วงอยู่เฉยเมื่อเจ้าภาพหรือแขกยังมาไม่ถึงทั้งหมด หรือเมื่อพวกเขาอยู่ระหว่าง [stop|E] หนึ่งกับอีกแห่งใน [tour|E]"
 game_concept_activity_state_active:0 "ดำเนินอยู่"
 game_concept_activity_state_active_desc:1 "เมื่อเจ้าภาพและแขกมาถึงและเข้าร่วมใน [activity|E] จะถือว่ากิจกรรมนั้นดำเนินอยู่"
 game_concept_activity_host:0 "เจ้าภาพกิจกรรม"
 game_concept_activity_host_possessive: "ของเจ้าภาพกิจกรรม"
 game_concept_activity_host_short:0 "เจ้าภาพ"
 game_concept_activity_host_desc:0 "เจ้าภาพของ [activity|E] คือ [ruler|E] ที่เริ่มต้นกิจกรรม\n\nพวกเขาเลือก [activity_type|E], [location|E], [activity_options|E] และ [activity_guests_short|E] ที่จะเชิญ"
 game_concept_activity_guest:0 "แขกกิจกรรม"
 game_concept_activity_guest_short:0 "แขก"
 game_concept_activity_guests:0 "แขกกิจกรรม"
 game_concept_activity_guests_short:0 "แขก"
 game_concept_activity_attending:0 "เข้าร่วม"
 game_concept_activity_guest_desc:0 "แขกใน [activity|E] คือ [character|E] ใดๆ ที่ได้รับเชิญจาก [activity_host|E]\n\nแม้ว่าโดยปกติแล้วพวกเขาจะไม่สามารถส่งผลกระทบต่อกิจกรรมได้มากเท่ากับเจ้าภาพ แต่พวกเขายังคงสามารถดำเนินการตาม [intent|E] ของตนได้"
 game_concept_intent:1 "เจตนา"
 game_concept_intents:0 "เจตนา"
 game_concept_intent_desc:0 "$game_concept_intent$ แสดงถึงสิ่งที่ตัวละครต้องการบรรลุเป็นการส่วนตัวใน [activity|E]; เจ้าภาพและแขก แต่ละคนมีแรงจูงใจและเป้าหมายของตนเอง"

 game_concept_location:0 "ตำแหน่งที่ตั้ง"
 game_concept_locations:0 "ตำแหน่งที่ตั้ง"
 game_concept_location_desc:0 "[character|E] ทุกคนมีตำแหน่งที่ตั้งที่บ่งบอกว่าพวกเขาอยู่ที่ไหนในโลกในปัจจุบัน ในการเดินทางจากตำแหน่งหนึ่งไปยังอีกตำแหน่งหนึ่ง ท่านต้อง [travel|E]"

 game_concept_feast:0 "$activity_feast$"
 game_concept_feast_desc:2 "[activity|E] ที่ผู้ปกครองและข้าราชสำนักในอาณาจักรมารวมตัวกันเพื่อเฉลิมฉลอง... สิ่งใดสิ่งหนึ่ง\n\nผู้เข้าร่วมจะลด [stress|E] และเพิ่ม [opinion|E] ที่มีต่อเจ้าภาพ นอกจากนี้ยังอาจมีผลที่ตามมาอื่นๆ อีกมากมายจากการนำผู้คนจำนวนมากมารวมกัน\n\n[ruler|E] จะเชิญ [liege|E] และ [vassals|E] ของตน (พร้อมกับ [courtiers|E] ต่างๆ) ไปยัง $activity_feast$"
 game_concept_hunt_success_chance:0 "โอกาสสำเร็จในการล่า"
 game_concept_hunt_success_chance_no_prefix:0 "โอกาสสำเร็จ"
 game_concept_hunt_success_chance_desc:1 "เมื่อออกเดินทางไป [GetActivityType('activity_hunt').GetName] ไม่มีการรับประกันว่าท่านจะล่าเหยื่อได้สำเร็จ ปัจจัยหลักคือ:\n$BULLET_WITH_TAB$[GetTrait('lifestyle_hunter').GetName( GetNullCharacter )] [trait_level_track_xp|E]\n$BULLET_WITH_TAB$[GetCourtPositionType('master_of_hunt_court_position').GetName()] [aptitude|E]\n$BULLET_WITH_TAB$[buildings|E], [terrain|E], และ [development|E]\n$BULLET_WITH_TAB$การพบเห็นสัตว์ [hunt_sightings_no_prefix|E]\n\n$game_concept_hunt_success_chance$ ไม่สามารถสูงกว่า #V 80#! ได้\n\n#weak การล่าที่ประสบความสำเร็จจะจบลงด้วยการสังหารเหยื่อ ซึ่งอาจได้รับ [artifacts|E] ถ้วยรางวัล และ [prestige_i|E][prestige|E] อันยิ่งใหญ่จะมอบให้กับนักล่า#! "
 game_concept_hunt_danger:0 "ภยันตรายในการล่า"
 game_concept_hunt_danger_no_prefix:0 "ภยันตราย"
 game_concept_hunt_dangerous:0 "อันตราย"
 game_concept_hunt_danger_desc:1 "ความคาดเดาไม่ได้ของแม้ แต่สัตว์ป่าที่อ่อนโยน ควบคู่ไปกับความบ้าคลั่งของการไล่ล่า ได้คร่าชีวิตนักรบผู้ยิ่งใหญ่มามากมาย\n\nสัตว์ที่ $game_concept_hunt_dangerous$ มากขึ้นจะมอบ [prestige_i|E][prestige|E] ที่ยิ่งใหญ่กว่าให้กับนักล่า\n\nความห่างไกลของถิ่นทุรกันดารและความอุดมสมบูรณ์ของโอกาสก็ไม่ควรมองข้ามเมื่อเลือกแขก..."
 game_concept_playdate:0 "$activity_playdate$"
 game_concept_playdate_desc:0 "[activity|E] ที่ผู้ปกครองและข้าราชสำนักที่มีอายุต่ำกว่า [EmptyScope.ScriptValue('less_than_two_years_to_adulthood_value')|0V] ปี มารวมตัวกันเพื่อเล่นและลืมความน่าเบื่อของวัน\n\nผู้เข้าร่วมจะลด [stress|E] และเพิ่ม [opinion|E] ที่มีต่อเจ้าภาพ นอกจากนี้ยังอาจมีผลที่ตามมาอื่นๆ อีกมากมายจากการนำเด็กจำนวนมากมารวมกัน\n\n[ruler|E] จะเชิญ [liege|E] และ [vassals|E] ของตน (พร้อมกับ [courtiers|E] ต่างๆ) ไปยัง $activity_playdate$"
 game_concept_wedding_ceremony:0 "พิธี"
 game_concept_wedding_ceremony_desc:0 "[activity_phase|E] ใน [GetActivityType('activity_wedding').GetName] ซึ่ง [spouses|E] แลกเปลี่ยนคำสาบานและ [married|E]"
 game_concept_wedding_banquet:0 "งานเลี้ยง"
 game_concept_wedding_banquet_desc:0 "[activity_phase|E] ใน [GetActivityType('activity_wedding').GetName] ซึ่งมีการเสิร์ฟอาหารและเครื่องดื่ม และแขกเพลิดเพลินกับความบันเทิงและสังสรรค์"
 game_concept_wedding_night:0 "คืนวัน แต่งงาน"
 game_concept_wedding_night_desc:0 "[activity_phase|E] ใน [GetActivityType('activity_wedding').GetName] ซึ่ง [spouses|E] ทำให้การ แต่งงานสมบูรณ์ และแขกยังคงเฉลิมฉลองต่อไป"
 game_concept_grand_wedding_promise:0 "คำสัญญางาน แต่งงานใหญ่"
 game_concept_grand_wedding_promises:0 "คำสัญญางาน แต่งงานใหญ่"
 game_concept_grand_wedding_promised:0 "สัญญาไว้"
 game_concept_grand_wedding_promise_desc:0 "[betrothal|E] ที่มีคำสัญญาแนบมาว่าจะมีการเฉลิมฉลอง [GetActivityType('activity_wedding').GetName] สำหรับการรวมกันของตัวละครทั้งสองที่เกี่ยวข้อง\n\nคำสัญญางาน แต่งงานใหญ่จะหมดอายุหลังจาก 3 ปี การไม่จัด [GetActivityType('activity_wedding').GetName] ให้ทันเวลาหรือการยกเลิกการหมั้นหมายจะ ส่งผลให้เกิดผลกระทบที่รุนแรง"
 game_concept_taxes:0 "ภาษี"
 game_concept_tax:0 "ภาษี"
 game_concept_taxation:0 "การเก็บภาษี"
 game_concept_taxes_desc:1 "$game_concept_taxes$ เป็นแหล่ง [income|E] [gold|E] รายเดือนที่สำคัญที่สุดสำหรับ [rulers|E]\n\n[holding|E] ทุกแห่งที่ผู้ปกครองมีจะให้ [domain_taxes|E] แก่พวกเขาทุกเดือน นอกจากนี้ [vassals|E] ส่วนใหญ่มี [obligation|E] ที่จะต้องจ่ายส่วนหนึ่งของภาษีที่เก็บได้ของตนเองให้กับ [liege|E] ในรูปแบบของ [liege_taxes|E]"
 game_concept_dread:0 "ความน่าสะพรึงกลัว"
 game_concept_dreadful:0 "น่าสะพรึงกลัว"
 game_concept_dreaded:0 "เป็นที่น่าสะพรึงกลัว"
 game_concept_dread_i: "@dread_icon!"
 game_concept_dread_desc:4 "$game_concept_dread$ คือมาตรวัดความน่าเกรงขามของ [ruler|E]\n\nผู้ปกครองเพิ่ม $game_concept_dread$ โดยการกระทำการที่โหดร้ายและชั่วช้า เช่น การทรมานและการประหาร [prisoners|E]\n\nความน่าเกรงขาม ทำให้สามารถเล่นเป็น [tyrant|E] ได้ เนื่องจาก [vassals|E] ที่ไม่เชื่อฟังอาจกลายเป็น [intimidated|E] หรือ [cowed|E] ทำให้พวกเขากลัวเกินกว่าจะต่อต้านท่าน\n\nความน่าเกรงขามของตัวละครสามารถมีค่าตั้งแต่ 0 ถึง 100 ยกเว้น [nomads|E] ซึ่งสามารถบรรลุได้ถึง 150 เมื่อเวลาผ่านไป ความน่าเกรงขามของพวกเขาจะโน้มเอียงไปสู่ความน่าเกรงขามตามธรรมชาติ ซึ่งกำหนดโดย [personality_traits|E] ของพวกเขา\n\n#high [ruler] ที่น่าเกรงขามจะได้รับประโยชน์ดังต่อไปนี้:#!\n$BULLET_WITH_TAB$[vassals] ถูกกีดกันไม่ให้เข้าร่วม [factions|E]\n$BULLET_WITH_TAB$[vassals] ถูกกีดกันไม่ให้ [scheming|E]\n$BULLET_WITH_TAB$เพิ่มการยอมรับของ [vassal] #weak (เช่น การเพิกถอนบรรดาศักดิ์)#!\n$BULLET_WITH_TAB$เพิ่มการยอมรับ [offer_vassalization|E]\n$BULLET_WITH_TAB$ ทำให้ [electors|E] มีแนวโน้มที่จะลงคะแนนเสียงตามที่ท่านต้องการมากขึ้น\n$BULLET_WITH_TAB$ ทำให้ข้าหลวงไม่น่าจะคัดค้านการเปลี่ยนแปลง [law|E]\n\n#weak โปรดทราบว่าข้าหลวงที่กล้าหาญและใจกล้าได้รับผลกระทบจากความน่าเกรงขามน้อยกว่า!#!"
 game_concept_truce:0 "การสงบศึกชั่วคราว"
 game_concept_truces:0 "การสงบศึกชั่วคราว"
 game_concept_truce_desc:0 "[war|E] ทุกครั้งจะจบลงด้วย $game_concept_truce$; ช่วงเวลาที่ผู้โจมตีไม่สามารถประกาศสงครามกับ [ruler|E] คนเดิมได้อีก (ผู้ป้องกันไม่ผูกพันกับการสงบศึกชั่วคราว)\n\nการสงบศึกชั่วคราวสามารถถูกละเมิดได้ แต่มีบทลงโทษที่รุนแรง"
 game_concept_government:0 "การปกครอง"
 game_concept_governments:0 "การปกครอง"
 game_concept_government_form:0 "รูปแบบการปกครอง"
 game_concept_government_forms:0 "รูปแบบการปกครอง"
 game_concept_government_desc:3 "$game_concept_government_form$ ของ [ruler|E] กำหนดประเภทของ [laws|E] ที่พวกเขาสามารถเข้าถึงได้ เช่นเดียวกับ [obligations|E] ที่พวกเขามีต่อ [liege|E] หากพวกเขาไม่ได้ [independent|E]\n\nรูปแบบการปกครองคือ: [feudal|E], [tribal|E], [clan|E], [theocracy|E], [republic|E], [administrative|E], [GetGovernment( 'nomad_government' ).GetName] และ [herder|E]"
 game_concept_feudal:0 "ศักดินา"
 game_concept_feudal_government:0 "การปกครองแบบศักดินา"
 game_concept_feudalism:0 "ระบบศักดินา"
 game_concept_feudal_i: "@government_type_feudal!"
 game_concept_feudal_desc:0 "ภายใต้ [government_form|E] แบบศักดินา [liege|E] จะมอบ [land|E] ให้แก่ [vassals|E] ของตนเพื่อปกครอง แลกเปลี่ยนกับ [levies|E] และ [taxes|E] ซึ่งถูกควบคุมโดย [vassal_contract|E] ระหว่างข้าหลวงและผู้นำ"
 game_concept_tribal:0 "ชนเผ่า"
 game_concept_tribal_government:0 "การปกครองแบบชนเผ่า"
 game_concept_tribal_i: "@government_type_tribal!"
 game_concept_tribal_desc:0 "อาณาจักรชนเผ่ามีการ [development|E] ของเคาน์ตีที่แคระแกร็น ไม่สามารถก้าวหน้าเกิน [innovations|E] ยุคชนเผ่า ไม่สามารถสร้าง [holdings|E] ใหม่ได้ และโดยปกติไม่สามารถเปลี่ยนแปลง [succession_law|E] ของตนได้\n\nอย่างไรก็ตาม พวกเขาสามารถใช้ [prestige|E] แทน [gold|E] เพื่อสร้างอาณาจักรและจ้าง [men_at_arms|E] และสามารถเข้าถึง [casus_belli|E] ได้มากกว่าเมื่อเทียบกับอาณาจักร [feudal|E] กองทัพที่ไม่ใช่ชนเผ่าจะได้รับโทษ [supply_limit|E] ในดินแดนชนเผ่าที่เป็นศัตรู"

 game_concept_clan:0 "แคลน"
 game_concept_clans: "แคลน"
 game_concept_clan_government:0 "การปกครองแบบแคลน"
 game_concept_clan_i: "@government_type_clan!"
 game_concept_clan_desc:1 "แคลนเป็น [government_form|E] ซึ่งจำนวน [levies|E] และ [taxes|E] ที่ [vassals|E] มอบให้กับ [liege|E] ของตนนั้นถูกกำหนดโดย [aptitude|E] ของ [tax_collector|E] ของ [liege|E] ดังกล่าว แคลนยังใช้ [house_unity|E] ด้วย"
 game_concept_theocracy:0 "เทวาธิปไตย"
 game_concept_theocracies:0 "เทวาธิปไตย"
 game_concept_theocratic:0 "แบบเทวาธิปไตย"
 game_concept_theocratic_government:0 "การปกครองแบบเทวาธิปไตย"
 game_concept_theocracy_government:0 "การปกครองแบบเทวาธิปไตย"
 game_concept_theocracy_i: "@government_type_theocracy!"
 game_concept_theocracy_desc:0 "$game_concept_theocracy$ เป็น [government_form|E] ที่ไม่สามารถเล่นได้ ซึ่งมีให้สำหรับ [faiths|E] บางศาสนาขึ้นอยู่กับ [doctrines|E] โดยปกติจะนำโดย [head_of_faith|E] หรือ [realm_priest|E] ที่ [landed|E] บิชอปอาจกลายเป็นผู้ปกครองแบบเทวาธิปไตยที่ [independent|E] ได้ด้วยตนเอง"
 
 game_concept_republic:0 "สาธารณรัฐ"
 game_concept_republics:0 "สาธารณรัฐ"
 game_concept_republican:0 "แบบสาธารณรัฐ"
 game_concept_republic_government:0 "การปกครองแบบสาธารณรัฐ"
 game_concept_republic_i: "@government_type_republic!"
 game_concept_republic_desc:1 "$game_concept_republic_government$ เป็น [government_form|E] ที่ไม่สามารถเล่นได้ ซึ่งพลเมืองที่ได้รับเลือกจะปกครองตลอดชีวิต — $game_concept_government_form$ ของชาวเมืองและพ่อค้า\n\n[vassals|E] แบบ $game_concept_republican$ มี [obligations|E] คงที่ที่ไม่สามารถเปลี่ยนแปลงได้ ดังนั้นจึงให้จำนวน [levies|E] และ [taxes|E] ที่เชื่อถือได้และคาดการณ์ได้เสมอ"
 game_concept_skill:0 "ทักษะ"
 game_concept_skills:0 "ทักษะ"
 game_concept_skills_desc:0 "ทักษะของตัวละครวัดว่าพวกเขาเก่งในด้านต่างๆ เพียงใด\n\nทักษะหลักห้าประการคือ: [diplomacy|E], [martial|E], [stewardship|E], [intrigue|E], [learning|E]"
 game_concept_building:0 "สิ่งก่อสร้าง"
 game_concept_buildings:0 "สิ่งก่อสร้าง"
 game_concept_building_desc: "$game_concept_buildings$ คือการปรับปรุงที่สามารถก่อสร้างใน [holdings|E] ได้\n\nสิ่งปลูกสร้างหลายประเภทสามารถสร้างได้เฉพาะใน [baronies|E] ที่เฉพาะเจาะจง หรือใน [terrain|E] บางประเภทเท่านั้น\n\nปราการแต่ละแห่งมีช่องสำหรับสิ่งปลูกสร้างจำกัด ดังนั้นปราการแห่งหนึ่งจึงไม่อาจมีสิ่งปลูกสร้างได้ครบทุกประเภท [county_capitals|E] จะสามารถเข้าถึงช่องสิ่งปลูกสร้างเพิ่มเติมได้\n\n[duchy_buildings|E] และ [special_buildings|E] จะใช้ช่องของตนเอง"
 game_concept_duchy_building:0 "สิ่งก่อสร้างดัชชี"
 game_concept_duchy_buildings:0 "สิ่งก่อสร้างดัชชี"
 game_concept_duchy_building_desc:0 "$game_concept_duchy_buildings$ เป็น [buildings|E] ที่ทรงพลัง ซึ่งสามารถสร้างได้เฉพาะใน [de_jure_capital|E] ของ [duchy|E] เท่านั้น สามารถสร้างได้เพียงประเภทเดียวใน แต่ละดัชชี\n\n$game_concept_duchy_buildings$ จะทำงานก็ต่อเมื่อเจ้าของถือ [title|E] ดัชชีที่เกี่ยวข้องด้วย\n\n$game_concept_duchy_buildings$ จำนวนมากมีตัวปรับ แต่งที่ส่งผลต่อ [holdings|E] ทั้งหมดในดัชชี ทำให้เป็นเครื่องมือที่ทรงพลังสำหรับการปรับ แต่ง [domain|E] ของท่าน"
 game_concept_special_building:0 "สิ่งก่อสร้างพิเศษ"
 game_concept_special_buildings:0 "สิ่งก่อสร้างพิเศษ"
 game_concept_special_building_desc: "$game_concept_special_buildings$ คือ [buildings|E] เฉพาะตัวที่ปรากฏอยู่ในสถานที่ที่กำหนดไว้ล่วงหน้าไม่กี่แห่งทั่วโลก\n\nตัวอย่าง ได้แก่ สิ่งมหัศจรรย์โบราณ อาสนวิหารอันยิ่งใหญ่ และเหมืองที่โดดเด่น บางส่วนถูกสร้างขึ้นแล้วเมื่อเริ่มเกม ในขณะที่ส่วนอื่น ๆ จะต้องถูกสร้างขึ้น\n\nโดยปกติ $game_concept_special_buildings$ จะทรงพลังอย่างมาก และคุ้มค่าที่จะต่อสู้ เพื่อให้ได้มา"
 game_concept_great_building: "สิ่งก่อสร้างยิ่งใหญ่"
 game_concept_great_buildings: "สิ่งก่อสร้างยิ่งใหญ่"
 game_concept_great_building_desc: "$game_concept_great_buildings$ คือ [buildings|E] เฉพาะตัว และถูกสร้างขึ้นจากผลของ [great_projects|E] ตัวอย่างที่มีชื่อเสียงหนึ่งคือกำแพงเมืองจีน\n\nโดยปกติ $game_concept_great_buildings$ จะทรงพลังอย่างมาก แต่อรรถประโยชน์ของพวกมันผูกพันกับเงื่อนไขเฉพาะ"

 game_concept_ruined_building: "สิ่งก่อสร้างปรักหักพัง"
 game_concept_ruined: "ปรักหักพัง"
 game_concept_ruined_building_desc: "สิ่งก่อสร้างที่ $game_concept_ruined$ คือถูกทุบทำลาย ทำให้เสื่อมเสีย หรือปล้นชิ้นส่วนโดยกองกำลังภายนอก\n\nกองกำลังภายนอกเหล่านี้อาจเป็น เช่น:\n$BULLET_WITH_TAB$[natural_disasters|E][AddLocalizationIf( HasDlcFeature( 'all_under_heaven' ), 'game_concept_ruined_buildings_tgp' )]"
 game_concept_ruined_buildings_tgp: "\n$BULLET_WITH_TAB$เหล่าผู้ปกครอง [mandala|E] ผู้เคียดแค้น"

 game_concept_rebuilt_building: "สิ่งก่อสร้างที่สร้างใหม่"
 game_concept_rebuilt: "สร้างใหม่"
 game_concept_rebuilding: "กำลังสร้างใหม่"
 game_concept_rebuilt_building_desc: "การกระทำของการสร้างสิ่งก่อสร้างที่ [ruined|E] ขึ้นใหม่ เพื่อฟื้นฟูความรุ่งโรจน์ในอดีตกลับคืนมา"

 game_concept_economic_building:0 "สิ่งก่อสร้างทางเศรษฐกิจ"
 game_concept_economic_buildings:0 "สิ่งก่อสร้างทางเศรษฐกิจ"
 game_concept_economic_building_desc: "$game_concept_economic_buildings$ คือ [buildings|E] ที่มีหน้าที่หลักในการเพิ่ม [domain_income|E] ของปราการนั้นๆ"
 game_concept_military_building:0 "สิ่งก่อสร้างทางทหาร"
 game_concept_military_buildings:0 "สิ่งก่อสร้างทางทหาร"
 game_concept_military_building_desc:0 "$game_concept_military_buildings$ เป็น [buildings|E] ที่มีหน้าที่หลักในการเพิ่มจำนวน [levies|E] ที่พวกเขามอบให้กับ [holder|E]"
 game_concept_fortification_building:0 "สิ่งก่อสร้างป้อมปราการ"
 game_concept_fortification_buildings:0 "สิ่งก่อสร้างป้อมปราการ"
 game_concept_fortification_building_desc: "$game_concept_fortification_buildings$ คือ [buildings|E] ที่มีหน้าที่หลักในการเพิ่ม [fort_level|E] ของปราการนั้นๆ หรือมอบโบนัส [advantage|E] แก่ฝ่ายป้องกัน"
 game_concept_pious_building: "สิ่งก่อสร้างศรัทธา"
 game_concept_pious_buildings: "สิ่งก่อสร้างศรัทธา"
 game_concept_pious_building_desc: "$game_concept_pious_buildings$ คือ [buildings|E] ซึ่งหน้าที่หลักคือการเพิ่ม [piety|E] ของที่ดินถือครอง"

 game_concept_battle:0 "การรบ"
 game_concept_battles:0 "การรบ"
 game_concept_battle_desc:1 "$game_concept_battles$ เริ่มต้นเมื่อ [armies|E] ของฝ่ายตรงข้ามสองฝ่ายเข้าสู่ [barony|E] เดียวกัน\n\nเมื่อเริ่ม $game_concept_battle$ ฝ่ายหนึ่งมักจะเริ่มต้นด้วย [advantage|E] ขึ้นอยู่กับปัจจัยต่างๆ เช่น [terrain|E], [commander|E] และ [commander_traits|E]\n\n กองทัพได้รับ [casualties|E] ตามจำนวน [damage|E] ที่ได้รับ $game_concept_battle$ จะเข้าสู่ [aftermath|E] เมื่อไม่มี [soldiers|E] เหลืออยู่สำหรับฝ่ายใดฝ่ายหนึ่ง\n\nผู้ชนะ $game_concept_battle$ จะได้รับ [war_score|E] ขึ้นอยู่กับขนาดของชัยชนะ"
 game_concept_aftermath:0 "ผลหลังการรบ"
 game_concept_aftermath_desc:1 "ช่วง $game_concept_aftermath$ ของ [battle|E] เกิดขึ้นเมื่อฝ่ายใดฝ่ายหนึ่งชนะ ผู้ชนะจะพยายามไล่ล่า [soldiers|E] ที่ [Concept( 'retreat', 'กำลังล่าถอย' )|E] ให้ได้มากที่สุด\n\n[men_at_arms|E] ที่มี [pursuit|E] สูงสามารถสังหาร $game_concept_soldiers$ ได้มากขึ้นในระหว่าง $game_concept_aftermath$ ในขณะที่ $game_concept_men_at_arms$ ที่มี [screen|E] สูงจะปกป้อง [soldiers|E] ฝ่ายเดียวกัน"
 game_concept_casualty:0 "การบาดเจ็บล้มตาย"
 game_concept_casualties:0 "การบาดเจ็บล้มตาย"
 game_concept_casualty_desc:0 "[armies|E] จะได้รับ $game_concept_casualties$ จำนวนหนึ่งในระหว่าง [battle|E] ขึ้นอยู่กับจำนวน [damage|E] ที่ได้รับ\n\nเมื่อ [soldiers|E] ถูกนำออกจาก $game_concept_battle$ พวกเขาจะถูกพิจารณาว่าเป็น [routed_soldiers|E] หรือ [dead_soldiers|E]"
 game_concept_retreat:0 "การล่าถอย"
 game_concept_retreats:0 "การล่าถอย"
 game_concept_retreat_desc:0 "[army|E] จะ $game_concept_retreat$ หากแพ้ [battle|E] กองทัพยังสามารถได้รับคำสั่งให้ $game_concept_retreat$ ในระหว่าง $game_concept_battles$ ได้ ขณะล่าถอย $game_concept_army$ ไม่สามารถยุบหรือได้รับคำสั่งเคลื่อนที่ใหม่ได้"
 game_concept_illness:0 "ความเจ็บป่วย"
 game_concept_ill:0 "ป่วย"
 game_concept_sick:0 "ป่วย"
 game_concept_sickness:0 "ความเจ็บป่วย"
 game_concept_illnesses:0 "ความเจ็บป่วย"
 game_concept_diseases:0 "โรคภัยไข้เจ็บ"
 game_concept_illness_desc:0 "ความเจ็บป่วยเป็น [traits|E] เชิงลบชนิดหนึ่งที่ลด [health|E] ของตัวละคร ลักษณะนิสัยความเจ็บป่วยสามารถคงอยู่ได้ในระยะเวลาที่แตกต่างกันและมีความร้ายแรงแตกต่างกันอย่างมาก"
 game_concept_medical_treatments:0 "การรักษาทางการแพทย์"
 game_concept_medical_treatments_desc:1 "เมื่อตัวละคร [ill|E] หรือ [GetTrait('wounded_1').GetName( GetNullCharacter )] การรักษาทางการแพทย์สามารถช่วยให้พวกเขาฟื้นตัวเร็วขึ้น\n\nผู้ที่รับผิดชอบในการรักษาท่านและ [courtiers|E] ของท่านคือ [GetCourtPositionType('court_physician_court_position').GetName()] พยายามจ้างไว้เสมอหากท่านสามารถจ่ายเงินเดือนได้\n\nยิ่ง $court_physician_court_position$ ทำการรักษามากเท่าใด ทักษะของพวกเขาก็จะยิ่งเติบโตมากขึ้น ทำให้พวกเขาได้รับ [traits|E] [GetTrait('lifestyle_physician').GetName( GetNullCharacter )]"
 game_concept_combat_width:0 "ความกว้างแนวรบ"
 game_concept_combat_width_desc:1 "$game_concept_combat_width$ บ่งชี้ว่า [soldiers|E] จาก แต่ละฝ่ายสามารถต่อสู้กันได้พร้อมกันกี่คนใน [battle|E] และอาจได้รับผลกระทบจากปัจจัยต่างๆ เช่น [terrain|E]\n\nสิ่งนี้ป้องกันไม่ให้ฝ่ายหนึ่งครอบงำอีกฝ่ายหนึ่งโดยสิ้นเชิงและถูกกำหนดเมื่อเริ่มการรบ"
 game_concept_roll:0 "การทอยเต๋า"
 game_concept_rolls:0 "การทอยเต๋า"
 game_concept_combat_roll:0 "การทอยเต๋าในการรบ"
 game_concept_advantage_roll:0 "การทอยเต๋าความได้เปรียบ"
 game_concept_advantage_rolls:0 "การทอยเต๋าความได้เปรียบ"
 game_concept_combat_roll_desc:0 "การทอยเต๋า [advantage|E] จะทำโดย [commander|E] แต่ละคนในระหว่าง [battle|E] ทำในระดับ 0-10 และเป็นการสุ่มโดยสมบูรณ์ แต่สามารถมีผลชี้ขาดต่อผลลัพธ์ของ $game_concept_battle$ ได้"
 game_concept_terrain:0 "ภูมิประเทศ"
 game_concept_terrains: "ภูมิประเทศ"
 game_concept_terrain_desc:1 "[barony|E] แต่ละแห่งมีภูมิประเทศที่โดดเด่นเฉพาะ ซึ่งสามารถส่งผลกระทบต่อสิ่งต่างๆ เช่น [supply|E], ความเร็วในการเคลื่อนที่ของ [armies|E], ประสิทธิภาพของ [men_at_arms|E] [regiments|E] ประเภทต่างๆ ใน [battle|E] และ [buildings|E] ที่สามารถสร้างได้ที่นั่น\n\n[commander_traits|E] จำนวนมากยังเกี่ยวข้องกับภูมิประเทศด้วย"
 game_concept_independent_ruler:0 "ผู้ปกครองอิสระ"
 game_concept_independent_rulers: "ผู้ปกครองอิสระ"
 game_concept_independent_ruler_desc:0 "[rulers|E] ที่ $game_concept_independent$ ไม่มี [liege|E] และ ดังนั้นจึงมีอิสระในการดำเนินการมากขึ้น ( เช่น ในการประกาศ [wars|E])\n\nอย่างไรก็ตาม ต่างจาก [vassals|E] พวกเขายังสามารถถูกโจมตีโดยตรงจาก [rulers|E] ต่างชาติได้"
 game_concept_independent:0 "อิสระ"
 game_concept_unlanded:0 "ไร้ที่ดิน"
 game_concept_unlanded_desc:0 "ตัวละครที่ $game_concept_unlanded$ ไม่มี [holdings|E] ใน [domain|E] ของตน แต่ในทางทฤษฎีแล้วยังคงสามารถเป็น [rulers|E] ประเภทหนึ่งได้ ตัวอย่าง เช่น นี่อาจเป็นกรณีของ [heads_of_faith|E] และปรมาจารย์ของ [holy_orders|E]"
 game_concept_landed:0 "มีที่ดิน"
 game_concept_land:0 "ที่ดิน"
 game_concept_landed_desc:0 "ตัวละครที่ $game_concept_landed$ คือ [ruler|E] ที่เป็นเจ้าของ [holdings|E] ยกเว้นใน [theocracies|E] และ [republics|E] [commoners|E] จะกลายเป็น [nobles|E] โดยอัตโนมัติเมื่อพวกเขาได้รับที่ดิน ก่อตั้ง [dynasty|E] ใหม่"
 game_concept_head_of_faith:0 "ประมุขแห่งศรัทธา"
 game_concept_heads_of_faith:0 "ประมุขแห่งศรัทธา"
 game_concept_head_of_faith_desc:0 "$game_concept_head_of_faith$ คือผู้นำอย่างเป็นทางการของ [faith|E] อำนาจและลักษณะของ $game_concept_head_of_faith$ ขึ้นอยู่กับ [doctrines|E] ของศรัทธา\n\nบางศรัทธามี [spiritual_head_of_faith|E] #weak (เช่น พระสันตะปาปา)#! บางศรัทธามี [temporal_head_of_faith|E] #weak (เช่น กาหลิบ)#! และบางศรัทธาไม่มี $game_concept_head_of_faith$ เลย"
 game_concept_spiritual_head_of_faith:0 "ประมุขแห่งศรัทธาทางจิตวิญญาณ"
 game_concept_head_of_faith_spiritual:0 "ทางจิตวิญญาณ"
 game_concept_spiritual_head_of_faith_desc:0 "[head_of_faith|E] แบบ [GetFaithDoctrine('doctrine_spiritual_head').GetBaseName] เป็น [theocratic|E] และไม่จำเป็นต้อง [landed|E] #weak (แม้ว่าพวกเขาจะเป็นได้)#!.\n\n$game_concept_head_of_faith_spiritual$ $game_concept_heads_of_faith$ มักจะสามารถเข้าถึงปฏิสัมพันธ์ต่างๆ เช่น การให้ [claims|E] หรือ [gold|E]\n\nหาก [doctrines|E] ของ [faith|E] อนุญาตให้มี [great_holy_wars|E] พวกเขาจะเป็น [great_holy_war_undirected|E] #weak (เช่น สงครามครูเสด)#!."
 game_concept_temporal_head_of_faith:0 "ประมุขแห่งศรัทธาทางโลก"
 game_concept_head_of_faith_temporal:0 "ทางโลก"
 game_concept_temporal_head_of_faith_desc:0 "[head_of_faith|E] แบบ [GetFaithDoctrine('doctrine_temporal_head').GetBaseName] ทำหน้าที่เหมือน [ruler|E] ปกติ โดย [title|E] $game_concept_head_of_faith$ จะถูกทำลายหากพวกเขาสูญเสียดินแดนทั้งหมด\n\nหาก [doctrines|E] ของ [faith|E] อนุญาตให้มี [great_holy_wars|E] พวกเขาจะเป็น [great_holy_war_directed|E] #weak (เช่น ญิฮาด)#!."
 game_concept_routed_soldiers:0 "ผู้บาดเจ็บที่แตกพ่าย"
 game_concept_routed_soldiers_desc:1 "ใน [battle|E] [casualties|E] ส่วนใหญ่จริงๆ แล้วคือ $game_concept_routed_soldiers$ และไม่ใช่ผู้เสียชีวิตหรือบาดเจ็บสาหัส ต่างจาก [dead_soldiers|E] [soldiers|E] เหล่านี้จะมีชีวิตอยู่เพื่อต่อสู้ในวันอื่นและกลับสู่ [army|E] หลังจาก $game_concept_battle$ สิ้นสุดลง พวกเขายังคงสามารถถูกไล่ล่าโดยฝ่ายที่ชนะในระหว่าง [aftermath|E] ของ $game_concept_battle$ รวมถึงหาก $game_concept_army$ [retreats|E] โดยสมัครใจ"
 game_concept_dead_soldiers:1 "ผู้เสียชีวิต"
 game_concept_dead_soldiers_desc:0 "ในระหว่าง [battle|E] [soldiers|E] จำนวนมาก ( แต่โดยปกติไม่ใช่ส่วนใหญ่) ถูกสังหารหรือบาดเจ็บสาหัสเกินกว่าจะต่อสู้ได้อีก เหล่านี้คือ [casualties|E] ถาวร ตรงข้ามกับเพียงแค่ [routed_soldiers|E]"
 game_concept_title_claim:0 "สิทธิ์เรียกร้องบรรดาศักดิ์"
 game_concept_title_claims:0 "สิทธิ์เรียกร้องบรรดาศักดิ์"
 game_concept_claims:0 "สิทธิ์เรียกร้อง"
 game_concept_claim:0 "สิทธิ์เรียกร้อง"
 game_concept_claimed:0 "อ้างสิทธิ์แล้ว"
 game_concept_claim_i:1 "@pressed_claim!"
 game_concept_title_claim_desc:0 "$game_concept_claim$ ใน [title|E] แสดงถึงสิทธิ์ตามกฎหมายในการเป็นเจ้าของและให้ [casus_belli|E] เพื่อพิชิตผ่าน [war|E] สิทธิ์เรียกร้องยังให้เหตุผลที่ถูกต้องในการ [revoke|E] [titles|E] จาก [holders|E] ที่เป็น [vassal|E]\n\nสิทธิ์เรียกร้องมักจะมอบให้กับ [rulers|E] เมื่อใดก็ตามที่พวกเขาสูญเสียการควบคุมบรรดาศักดิ์ให้กับผู้อื่น แต่ยังสามารถสร้างขึ้นได้ผ่านภารกิจ [fabricate_claim_short|E]\n\nนอกจากนี้ บุตร แต่ละคน (แม้ แต่ [bastards|E]) ของผู้ปกครองมี [implicit_claim|E] ใน [titles|E] ทั้งหมดของผู้ปกครองนั้น หากพวกเขาไม่ได้รับสืบทอดบรรดาศักดิ์นั้นจาก [ruler] เมื่อพวกเขาเสียชีวิต [implicit_claims] เหล่านั้นจะเปลี่ยนเป็น [pressed_claims|E] ซึ่งจากนั้นสามารถสืบทอดโดยบุตรของพวกเขาเองเป็น [unpressed_claims|E]"
 game_concept_pressed_claim:0 "สิทธิ์เรียกร้องที่กดดัน"
 game_concept_pressed_claims:0 "สิทธิ์เรียกร้องที่กดดัน"
 game_concept_pressed_claim_i:1 "@pressed_claim!"
 game_concept_pressed:0 "กดดัน"
 game_concept_pressed_claim_desc:0 "[claims|E] ที่ $game_concept_pressed$ ถือว่าแข็งแกร่งตามกฎหมาย และสืบทอดเป็น [unpressed_claims|E] โดยบุตรของ [claimant|E]"
 game_concept_unpressed_claim:0 "สิทธิ์เรียกร้องที่ไม่กดดัน"
 game_concept_unpressed_claims:0 "สิทธิ์เรียกร้องที่ไม่กดดัน"
 game_concept_unpressed_claim_i:1 "@unpressed_claim!"
 game_concept_unpressed:0 "ไม่กดดัน"
 game_concept_unpressed_claim_desc:0 "[claims|E] ที่ $game_concept_unpressed$ นั้นอ่อนแอตามกฎหมาย และไม่สืบทอดโดยบุตรของ [claimant|E]\n\nอย่างไรก็ตาม สิทธิ์เรียกร้องที่ไม่กดดันจะกลายเป็น [pressed|E] หากใช้ใน [casus_belli|E] เพื่อประกาศ [war|E] — แม้ว่าสงครามจะจบลงด้วย [white_peace|E]"
 game_concept_implicit_claim:0 "สิทธิ์เรียกร้องโดยนัย"
 game_concept_implicit_claims:0 "สิทธิ์เรียกร้องโดยนัย"
 game_concept_implicit_claim_i:1 "@implicit_claim!"
 game_concept_implicit_claim_desc:2 "$game_concept_implicit_claims$ คือ [claims|E] ที่มอบให้กับ [eligible_children|E] ใน [titles|E] ทั้งหมดที่พ่อแม่ของพวกเขาถือครอง หากพ่อแม่สูญเสีย [title|E] $game_concept_implicit_claim$ ของบุตรก็จะถูกลบออกไปด้วย"
 game_concept_claimant:0 "ผู้เรียกร้องสิทธิ์"
 game_concept_claimants:0 "ผู้เรียกร้องสิทธิ์"
 game_concept_claimant_possessive: "ของผู้เรียกร้องสิทธิ์"
 game_concept_claimant_desc:0 "$game_concept_claimant$ คือบุคคลที่มี [claims|E] หนึ่งรายการหรือมากกว่าต่อ [titles|E] ผู้เรียกร้องสิทธิ์ที่เป็น [ruler|E] สามารถกดดันสิ่งเหล่านี้ได้โดยใช้ [casus_belli|E] การเรียกร้องสิทธิ์เพื่อประกาศ [wars|E]\n\nเหตุแห่งสงครามนี้ยังสามารถใช้เพื่อกดดันสิทธิ์เรียกร้องของ [vassals|E] และแม้ แต่ตัวละครที่ [unlanded|E] ใน [realm|E] ของท่าน\n\nผู้เรียกร้องสิทธิ์ยังสามารถนำ [factions|E] ได้ — แม้ว่าพวกเขาจะไม่ได้อาศัยอยู่ในอาณาจักรของท่านก็ตาม"
 game_concept_renounce:0 "สละสิทธิ์"
 game_concept_renounced:0 "สละสิทธิ์แล้ว"
 game_concept_renounce_desc:0 "[prisoners|E] สามารถถูกปล่อยตัวเพื่อแลกกับการสละ [claims|E] ทั้งหมดใน [titles|E] ภายใน [realm|E] ของท่าน\n\nอย่างไรก็ตาม บุตรของ [holder|E] ปัจจุบันไม่สามารถสูญเสียสิทธิ์เรียกร้องของตนได้ตราบใดที่ [holder|E] ยังมีชีวิตอยู่"
 game_concept_court:0 "ราชสำนัก"
 game_concept_courts:0 "ราชสำนัก"
 game_concept_court_desc:0 "[ruler|E] ทุกคนมี $game_concept_court$ ซึ่งประกอบด้วยตัวละคร [unlanded|E] ต่างๆ ที่รับใช้ [liege|E] ของตน\n\nโดยปกติแล้ว [courtiers|E] เหล่านี้ประกอบด้วยครอบครัวของผู้ปกครองและส่วนผสมของ [nobles|E] และสามัญชนที่ไม่เกี่ยวข้อง แต่มีประโยชน์"
 game_concept_courtier:0 "ข้าราชสำนัก"
 game_concept_courtiers:0 "ข้าราชสำนัก"
 game_concept_courtier_desc:2 "$game_concept_courtier$ คือตัวละคร [unlanded|E] ที่รับใช้ [ruler|E] ใน [court|E] ของพวกเขา\n\nข้าราชสำนักสามารถ:\n$BULLET_WITH_TAB$รับตำแหน่ง [councillors|E]\n$BULLET_WITH_TAB$รับตำแหน่ง [court_positions|E]\n$BULLET_WITH_TAB$รับใช้ใน [armies|E] ในฐานะ [commanders|E] หรือ [knights|E]\n$BULLET_WITH_TAB$กลายเป็น [vassal|E] ของผู้ปกครองหากได้รับ [title|E]\n$BULLET_WITH_TAB$ให้ผู้ปกครองกดดัน [claims|E] ของตนใน [war|E]\n\n#WEAK [adventurers|E] มี [followers|E] แทน $game_concept_courtiers$ — พวกเขามีบทบาทเดียวกัน แม้ว่าโดยทั่วไปจะเหม็นกว่าและมีโคลนมากกว่าก็ตาม#! "
 game_concept_court_guest:0 "แขกราชสำนัก"
 game_concept_guest:0 "แขก"
 game_concept_guests:0 "แขก"
 game_concept_court_guest_desc:0 "[wanderers|E] บางครั้งปรากฏตัวใน [court|E] ในฐานะแขก พวกเขาจะอยู่เพียงช่วงเวลาจำกัด แต่สามารถรับสมัครเป็น [courtiers|E] ถาวรได้โดย [ruler|E]"
 game_concept_wanderer:0 "ผู้พเนจร"
 game_concept_wanderers:0 "ผู้พเนจร"
 game_concept_wanderer_desc:0 "ตัวละครที่ไม่ได้สังกัด [court|E] หรือถือ [titles|e] ใดๆ เรียกว่าผู้พเนจร พวกเขาเดินทางไปทั่วโลก เยี่ยมชมราชสำนักในฐานะ [guests|E] ตลอดทาง ผู้พเนจรอาจกลายเป็นกัปตัน [mercenary|E], ผู้นำของ [holy_orders|E], สมาชิก [clergy|E], หรือผู้ถือครอง [city|E]"

 game_concept_court_host:0 "เจ้าบ้านราชสำนัก"
 game_concept_court_host_desc:2 "$game_concept_court_host$ คือ [ruler|E] ที่ไม่ใช่เจ้าเหนือหัวของตัวละคร แต่ยังมีพวกเขาอยู่ใน [court] ของตน\n\nมีสาเหตุหลายประการที่อาจเกิดขึ้นได้ เช่น [wanderers|E] เยี่ยมเยียนผู้ปกครอง หรือ [wards|E] พักอยู่ในราชสำนักเดียวกับ [guardian|E] ของตน"
 game_concept_host:0 "เจ้าบ้าน"
 game_concept_hosting: "เป็นเจ้าภาพ"
 game_concept_noble:0 "ขุนนาง"
 game_concept_nobles:0 "ขุนนาง"
 game_concept_nobleman:0 "ขุนนางชาย"
 game_concept_noblemen:0 "ขุนนางชาย"
 game_concept_noblewoman:0 "ขุนนางหญิง"
 game_concept_noblewomen:0 "ขุนนางหญิง"
 game_concept_nobility:0 "ชนชั้นขุนนาง"
 game_concept_noble_desc:0 "$game_concept_nobles$ คือตัวละครที่เป็นสมาชิกของ [dynasty|E] ตัวละครที่ไม่มีราชวงศ์ถือว่าเป็น [commoners|E] ที่มีชาติกำเนิดต่ำ"
 game_concept_commoner:0 "สามัญชน"
 game_concept_lowborn:0 "ผู้มีชาติกำเนิดต่ำ"
 game_concept_commoners:0 "สามัญชน"
 game_concept_commoner_desc:0 "ตัวละคร $game_concept_commoner$ หรือ $game_concept_lowborn$ ไม่ใช่สมาชิกของ [dynasty|E] [noble|E] อย่างไรก็ตาม พวกเขายังคงสามารถเป็น [rulers|E] ที่ทรงพลังของ [theocracies|E] และ [republics|E] ได้\n\nหากสามัญชนกลายเป็น [landed|E] พวกเขาจะกลายเป็นขุนนางทันทีและก่อตั้ง [dynasties|E] ของตนเอง (ยกเว้นใน [republics|E] และ [theocracies|E] ซึ่งส่วนใหญ่ดำเนินการโดยสามัญชน)"
 game_concept_martial_lifestyle:0 "วิถีชีวิตการทหาร"
 game_concept_martial_lifestyle_i: "@martial_lifestyle_icon!"
 game_concept_martial_lifestyle_desc:0 "$game_concept_martial_lifestyle$ เหมาะสำหรับตัวละครที่ต้องการปรับปรุง [men_at_arms|E] และ [knights|E] ของตน เพิ่ม [control|E] ใน [domain|E] ของตน หรือเพิ่มโอกาสในการชนะ [wars|E]"
 game_concept_intrigue_lifestyle:0 "วิถีชีวิตการเล่ห์กล"
 game_concept_intrigue_lifestyle_i: "@intrigue_lifestyle_icon!"
 game_concept_intrigue_lifestyle_desc:0 "$game_concept_intrigue_lifestyle$ เหมาะสำหรับตัวละครที่ต้องการประสบความสำเร็จใน [schemes|E], ได้รับ [dread|E], หรือยั่วยวนผู้อื่นได้อย่างง่ายดาย"
 game_concept_intrigue_lqwuljxh:0 "Lqwuljxh"
 game_concept_intrigue_9_14_20_18_9_7_21_5:0 "9 14 20 18 9 7 21 5"
 game_concept_intrigue_rigueint:0 "Rigueint"
 game_concept_diplomacy_lifestyle:0 "วิถีชีวิตการทูต"
 game_concept_diplomacy_lifestyle_i: "@diplomacy_lifestyle_icon!"
 game_concept_diplomacy_lifestyle_desc:0 "$game_concept_diplomacy_lifestyle$ เหมาะสำหรับตัวละครที่ต้องการได้รับ [claims|E] และ [casus_bellis|E], เพิ่ม [prestige|E] ของตน, หรือได้รับผลประโยชน์จากครอบครัวและเพื่อน"
 game_concept_stewardship_lifestyle:0 "วิถีชีวิตการคลัง"
 game_concept_stewardship_lifestyle_i: "@stewardship_lifestyle_icon!"
 game_concept_stewardship_lifestyle_desc:0 "$game_concept_stewardship_lifestyle$ เหมาะสำหรับตัวละครที่ต้องการปรับปรุง [domain|E] ของตน, เอาใจ [liege|E] และ [vassals|E] ของตน, หรือได้รับ [gold|E] จำนวนมาก"
 game_concept_learning_lifestyle:0 "วิถีชีวิตการเรียนรู้"
 game_concept_learning_lifestyle_i: "@learning_lifestyle_icon!"
 game_concept_learning_lifestyle_desc:0 "$game_concept_learning_lifestyle$ เหมาะสำหรับตัวละครที่ต้องการมีชีวิตที่ยืนยาวและมีสุขภาพดี, ได้รับ [piety|E], หรือได้รับโบนัสเพิ่มเติมจาก [faith|E] ของตน"
 game_concept_wanderer_lifestyle: "วิถีชีวิตพเนจร"
 game_concept_wanderer_lifestyle_desc: "$game_concept_wanderer_lifestyle$ เหมาะสำหรับตัวละครที่ต้องการเห็น [points_of_interest|E], หรือได้รับโบนัสเพิ่มเติมจากการ [traveling|E]"
 game_concept_crime:0 "อาชญากรรม"
 game_concept_crimes:0 "อาชญากรรม"
 game_concept_criminal:0 "อาชญากร"
 game_concept_criminals:0 "อาชญากร"
 game_concept_crime_i:0 "@crime_icon!"
 game_concept_crime_desc:2 "$game_concept_crimes$ คือการกระทำที่สังคมมองว่าน่ารังเกียจเพียงพอที่จะสมควรได้รับการลงโทษ\n\nอาชญากรรมอาจเป็นทางโลก ( เช่น [vassal|E] [revolting|E] ต่อ [liege|E] ของตน) หรือทางศาสนา (พฤติกรรม [shunned|E] ใดๆ ที่ผิดกฎหมายตาม [doctrine|E]) อาชญากรรมทางโลกสามารถลงโทษได้โดยตัวละครที่ได้รับความเสียหายจากการกระทำผิดเท่านั้น แต่ [ruler|E] ใดๆ ก็สามารถลงโทษอาสาสมัครของตนสำหรับอาชญากรรมทางศาสนาได้\n\nอาชญากรรมทั้งหมดให้เหตุผลที่ถูกต้องแก่ผู้ปกครองในการ [imprison|E] $game_concept_criminals$ และขึ้นอยู่กับความรุนแรงของอาชญากรรม ในการ [revoke|E] [titles|E] ของพวกเขา, [banish|E], [torture|E], หรือ [execute|E] พวกเขา อาชญากรรม แต่ละครั้งสามารถลงโทษโดยผู้ปกครองได้เพียงครั้งเดียว แม้ว่าอาชญากรรมบางอย่างจะให้ [fame_trait|E] เชิงลบแก่อาชญากร ซึ่งพวกเขาจะแบกรับไปจนตาย\n\nบางครั้งตัวละครก็รอดพ้นจากอาชญากรรม ซึ่งกลายเป็น [secrets|E] ที่ตัวละครอื่นสามารถเปิดเผยและใช้สำหรับ [blackmail|E]"

 game_concept_shunned:0 "เป็นที่รังเกียจ"
 game_concept_shunned_desc:1 "หลาย [faiths|E] มี [doctrines|E] ซึ่งกำหนดพฤติกรรมบางอย่างว่าเป็นที่รังเกียจ พฤติกรรมเหล่านี้อาจถือเป็น [criminal|E] ด้วย ขึ้นอยู่กับหลักคำสอนเฉพาะ\n\nตัวละครที่ถูกจับได้ว่าปฏิบัติพฤติกรรมที่เป็นที่รังเกียจโดยศรัทธาของตน จะสูญเสีย [piety_level|E] หนึ่งระดับและได้รับ [fame_trait|E] ที่สอดคล้องกัน; ลักษณะนิสัยนี้จะไม่เป็นที่ชอบของทุกคนที่ศรัทธาของพวกเขาถือว่าพฤติกรรมนั้นเป็นที่รังเกียจหรือเป็นอาชญากรรม\n\nตัวอย่างพฤติกรรมที่เป็นที่รังเกียจ ได้แก่:\n$EFFECT_LIST_BULLET$[GetTrait('fornicator').GetName( GetNullCharacter )]\n$EFFECT_LIST_BULLET$[GetTrait('adulterer').GetName( GetNullCharacter )]\n$EFFECT_LIST_BULLET$[GetTrait('deviant').GetName( GetNullCharacter )]\n$EFFECT_LIST_BULLET$[GetTrait('sodomite').GetName( GetNullCharacter )]\n$EFFECT_LIST_BULLET$[GetTrait('kinslayer_3').GetName( GetNullCharacter )]\n$EFFECT_LIST_BULLET$[GetTrait('witch').GetName( GetNullCharacter )]"
 game_concept_refuse_conversion_crime:0 "ปฏิเสธการเปลี่ยนศาสนา"
 game_concept_refusing_conversion_crime:0 "การปฏิเสธการเปลี่ยนศาสนา"
 game_concept_refused_conversion_crime:0 "ได้ปฏิเสธการเปลี่ยนศาสนา"
 game_concept_refuse_conversion_crime_desc:2 "การปฏิเสธที่จะเปลี่ยนศาสนาจะถือเป็น [crime|E] หาก:\n$EFFECT_LIST_BULLET$[character|E] ผู้ปฏิเสธนับถือ [religion|E] เดียวกันกับ $game_concept_character$ ที่เรียกร้อง\n$EFFECT_LIST_BULLET$$game_concept_religion$ นั้นมี [heresies|E]\n$EFFECT_LIST_BULLET$[faith|E] ของ $game_concept_character$ ที่เรียกร้องนั้นเป็น [faith_hostile|E] หรือมากกว่าต่อ $game_concept_faith$ ของ $game_concept_character$ ผู้ปฏิเสธ"
 game_concept_prison:0 "คุก"
 game_concept_imprisons:0 "จองจำ"
 game_concept_imprison:0 "จองจำ"
 game_concept_imprisoning:0 "การจองจำ"
 game_concept_imprisoned:0 "ถูกจองจำ"
 game_concept_imprisonment:0 "การจองจำ"
 game_concept_prisons:0 "คุก"
 game_concept_prisoner:0 "นักโทษ"
 game_concept_prisoners:0 "นักโทษ"
 game_concept_jailor:0 "ผู้คุม"
 game_concept_prison_desc: "[rulers|E] ที่มี [landed|E] สามารถกักขังตัวละครอื่น ๆ เป็นนักโทษได้ ไม่ว่าจะใน [dungeon|E] ของตน หรือเพียงแค่ [house_arrest|E] ใน [camp|E] นักโทษทั้งหมดจะถูกคุมขังใน [stockade|E] ตัวละครเสี่ยงต่อการถูกจองจำใน [battle|E] หรือเมื่อสิ้นสุด [siege|E]\n\nตัวละครยังสามารถจับกุมใครก็ตามที่อยู่ใน [realm|E] หรือ [camp|E] ของตนเองได้ อย่างไรก็ตาม การกระทำนี้ถูกมองว่าเป็น [tyrannical|E] เว้น แต่ตัวละครนั้นมีความผิดฐาน [crime|E]\n\nนักโทษอยู่ในความเมตตาของคุณและสามารถถูก [executed|E], [tortured|E], เรียกค่าไถ่ หรือเพียงแค่ปล่อยตัวไป"
 game_concept_dungeon: "คุกใต้ดิน"
 game_concept_stockade: "คอกคุมขัง"
 game_concept_dungeons: "คุกใต้ดิน"
 game_concept_stockades: "คอกคุมขัง"
 game_concept_dungeon_desc: "ตัวละครที่ [imprisoned|E] และถูกคุมขังใน $game_concept_dungeon$ หรือ $game_concept_stockade$ จะประสบกับ [stress|E] ที่เพิ่มขึ้น รวมถึงค่า [health|E] ที่ลดลง เมื่อเวลาผ่านไป พวกเขามีแนวโน้มที่จะเสียชีวิตจาก [illness|E] หรือประสบกับสภาวะจิตใจแตกสลาย\n\nสำหรับ [rulers|E] ที่มี [landed|E] นั้น [commoners|E] จะถูกจองจำในคุกใต้ดินโดยอัตโนมัติ แต่สามารถย้ายไป [house_arrest|E] ได้"
 game_concept_stockade_desc: "$game_concept_dungeon_desc$"
 game_concept_house_arrest:0 "การกักบริเวณ"
 game_concept_house_arrest_desc:0 "$game_concept_house_arrest$ เป็นรูปแบบการ [prison|E] ที่ผ่อนปรน ซึ่งตัวละครไม่ได้รับผลกระทบใด ๆ นอกจากความเบื่อหน่าย อย่างไรก็ตาม [rulers|E] อาจโยนพวกเขาเข้า [dungeon|E] ได้ แม้ว่าจะลด [opinions|E] ของ [close_family|E] ของนักโทษก็ตาม\n\n[nobles|E] ที่ถูกจับได้จะถูกนำไป [house_arrest|E] โดยอัตโนมัติ"
 game_concept_tyranny:0 "ทรราชย์"
 game_concept_tyrant:0 "ทรราช"
 game_concept_tyrannical:0 "อย่างทรราชย์"
 game_concept_tyranny_desc:0 "การกระทำหลายอย่างของ [ruler|E] ถือเป็น $game_concept_tyrannical$ — ขัดต่อกฎหมายหรือ [doctrine|E] ทางศาสนา ตัวอย่าง เช่น การ [imprisoning|E] หรือ [revoking|E] [titles|E] จากผู้ที่ไม่ได้กระทำ [crime|E] ใด ๆ ถือเป็นการกระทำอย่างทรราชย์\n\nทรราชย์ทำหน้าที่เป็นตัวปรับ แต่ง [opinion|E] โดยรวมสำหรับตัวละครทั้งหมดใน [realm|E]"
 game_concept_execute:0 "ประหารชีวิต"
 game_concept_executed:0 "ถูกประหารชีวิต"
 game_concept_executing:0 "การประหารชีวิต"
 game_concept_execution:0 "การประหารชีวิต"
 game_concept_executions:0 "การประหารชีวิต"
 game_concept_execute_desc:1 "ตัวละครที่ [imprisoned|E] สามารถถูก $game_concept_executed$ ได้ การกระทำนี้ถือเป็น [tyrannical|E] เว้น แต่ผู้จองจำมี [execute_reason|E]\n\nการประหารชีวิตจะเพิ่ม [dread|E] ของคุณและไม่เคยเป็นที่ยอมรับจาก [close_family|E] ของเป้าหมายผู้โชคร้าย"
 game_concept_torture:0 "ทรมาน"
 game_concept_tortured:0 "ถูกทรมาน"
 game_concept_torturing:0 "การทรมาน"
 game_concept_torture_desc:0 "ตัวละครที่ [imprisoned|E] สามารถถูก $game_concept_tortured$ ซึ่งสร้างความเสียหายต่อ [health|E] หรือแม้กระทั่ง ทำให้พิการในรูปแบบต่าง ๆ\n\nการทรมานสามารถบรรเทา [stress|E] สำหรับตัวละครที่มีลักษณะนิสัย [GetTrait('callous').GetName( GetNullCharacter )] และ [GetTrait('sadistic').GetName( GetNullCharacter )] แต่ ทำให้เกิดความเครียดสำหรับผู้ที่มีจิตใจเมตตา\n\nการทรมาน [rulers|E] ยังสามารถเพิ่ม [dread|E] ของคุณได้อีกด้วย"
 game_concept_banish:0 "เนรเทศ"
 game_concept_banished:0 "ถูกเนรเทศ"
 game_concept_banishment:0 "การเนรเทศ"
 game_concept_banishment_desc:1 "ตัวละครที่ [imprisoned|E] สามารถถูก $game_concept_banished$ ออกจาก [realm|E] ซึ่งถือเป็นการลงโทษที่รุนแรงที่สุด ผู้ปกครองที่มี [landed|E] ที่ถูก $game_concept_banished$ จะถูกถอดถอน ในขณะที่ [courtiers|E] ที่ถูก $game_concept_banished$ จะถูกยึดทรัพย์สิน\n\nการเนรเทศโดยไม่มีเหตุผล ( เช่น [crime|E] ร้ายแรงบางอย่าง) ถือเป็นการกระทำที่ [tyrannical|E] อย่างยิ่ง"
 game_concept_revoke:0 "เพิกถอน"
 game_concept_revoked:0 "ถูกเพิกถอน"
 game_concept_revoking:0 "การเพิกถอน"
 game_concept_revocation:0 "การเพิกถอน"
 game_concept_revocations:0 "การเพิกถอน"
 game_concept_revoke_desc:0 "ที่ระดับ [limited_crown_authority|E] หรือสูงกว่า [rulers|E] สามารถ $game_concept_revoke$ [titles|E] ของ [vassals|E] ของตนได้ แต่ เว้นแต่ข้าหลวงจะถูก [imprisoned|E] นี่เป็นข้อเสนอที่เสี่ยง เพราะข้าหลวงอาจปฏิเสธและลุกขึ้นก่อกบฏ\n\nการเพิกถอนตำแหน่งถือเป็น [tyrannical|E] เว้น แต่ข้าหลวงจะมีความผิดฐาน [crime|E] ที่ค่อนข้างรุนแรง"
 game_concept_retract:0 "เรียกคืน"
 game_concept_retracted:0 "ถูกเรียกคืน"
 game_concept_retracting:0 "การเรียกคืน"
 game_concept_retraction:0 "การเรียกคืน"
 game_concept_retractions:0 "การเรียกคืน"
 game_concept_retract_desc:0 "ที่ระดับ [limited_crown_authority|E] หรือสูงกว่า [rulers|E] สามารถ $game_concept_retract$ [vassal|E] ของข้าหลวงคนหนึ่งได้ แต่ เว้นแต่คนหลังจะถูก [imprisoned|E] นี่เป็นความเสี่ยง เพราะข้าหลวงอาจปฏิเสธและลุกขึ้นก่อกบฏ\n\nการเรียกคืนข้าหลวงถือเป็น [tyrannical|E] เว้น แต่เป้าหมายจะมีความผิดฐาน [crime|E] ที่ค่อนข้างรุนแรง"
 game_concept_transfer:0 "โอนย้าย"
 game_concept_transferred:0 "ถูกโอนย้าย"
 game_concept_transferring:0 "การโอนย้าย"
 game_concept_transfer_desc:0 "[rulers|E] สามารถ $game_concept_transfer$ หนึ่งใน [vassals|E] ของตนไปยังข้าหลวงอีกคนได้ ตราบใดที่คนแรกมีตำแหน่งต่ำกว่าคนหลัง นี่เป็นวิธีที่ดีในการเพิ่ม [opinion|E] ของข้าหลวง โดยเฉพาะอย่างยิ่งหากข้าหลวงที่ถูกโอนย้ายเป็นส่วนหนึ่งของ [realm|E] ของพวกเขาตาม [de_jure|E]"
 game_concept_men_at_arms:0 "ทหารอาชีพ"
 game_concept_men_at_arms_desc:1 "$game_concept_men_at_arms$ คือ [soldiers|E] มืออาชีพที่เหนือกว่า [levies|E]\n\nผู้เล่นสามารถควบคุมองค์ประกอบและขนาดของ [regiments|E] ทหารอาชีพของตนได้โดยตรง\n\nทหารอาชีพประเภทต่าง ๆ มีความสามารถดีหรือด้อยใน [terrain|E] ประเภทต่าง ๆ แต่ละประเภทยัง [counters|E] อีกประเภทหนึ่งด้วย\n\nทหารอาชีพสามารถ [stationed|E] ใน [holdings|E] เพื่อเพิ่มประสิทธิภาพได้"
 game_concept_skirmishers:0 "พลปะทะ"
 game_concept_skirmisher:0 "พลปะทะ"
 game_concept_skirmishers_desc:0 "พลปะทะคือ [men_at_arms|E] ที่ติดอาวุธเบาและมีทักษะในการก่อกวนศัตรู\n\nแม้ว่าพลปะทะ แต่ละประเภทจะมีเอกลักษณ์เฉพาะตัว แต่โดยทั่วไปแล้วพวกเขา [counter|E] [heavy_infantry|E] และในทางกลับกันจะถูกแก้ทางโดย [archers|E]"
 game_concept_archers:0 "พลธนู"
 game_concept_archer:1 "พลธนู"
 game_concept_archers_desc:0 "พลธนูคือ [men_at_arms|E] ที่ต่อสู้ด้วยเท้าพร้อมอาวุธระยะไกล\n\nแม้ว่าพลธนู แต่ละประเภทจะมีเอกลักษณ์เฉพาะตัว แต่โดยทั่วไปแล้วพวกเขา [counter|E] [skirmishers|E] และในทางกลับกันจะถูกแก้ทางโดย [heavy_cavalry|E] และ [light_cavalry|E]"
 game_concept_light_cavalry:0 "ทหารม้าเบา"
 game_concept_light_cavalry_desc:0 "ทหารม้าเบาคือ [men_at_arms|E] ที่ขี่ม้า ซึ่งเก่งกาจในการสอดแนมและไล่ตามศัตรู\n\nแม้ว่าทหารม้าเบา แต่ละประเภทจะมีเอกลักษณ์เฉพาะตัว แต่โดยทั่วไปแล้วพวกเขา [counter|E] [archers|E] และในทางกลับกันจะถูกแก้ทางโดย [spearmen|E]\n\nทหารม้าเบามักจะแข็งแกร่งใน [terrain|E] ที่ราบเรียบด้วย\n\nเมื่อเปรียบเทียบกับ [heavy_cavalry|E] พวกเขามักจะดีกว่าในด้าน [pursuit|E] และ [screen|E]"
 game_concept_heavy_cavalry:0 "ทหารม้าหนัก"
 game_concept_heavy_cavalry_desc:0 "ทหารม้าหนักคือ [men_at_arms|E] ที่ขี่ม้าและสวมเกราะหนัก\n\nแม้ว่าทหารม้าหนัก แต่ละประเภทจะมีเอกลักษณ์เฉพาะตัว แต่โดยทั่วไปแล้วพวกเขา [counter|E] [archers|E] และในทางกลับกันจะถูกแก้ทางโดย [spearmen|E]\n\nทหารม้าหนักมักจะแข็งแกร่งใน [terrain|E] ที่ราบเรียบด้วย\n\nเมื่อเปรียบเทียบกับ [light_cavalry|E] พวกเขามักจะแข็งแกร่งกว่าในด้าน [damage|E] และ [toughness|E] ดิบ"
 game_concept_spearmen:0 "พลหอก"
 game_concept_spearmen_desc:0 "พลหอกคือ [men_at_arms|E] ที่ต่อสู้ด้วยเท้าพร้อมอาวุธด้ามยาวต่าง ๆ\n\nแม้ว่าพลหอก แต่ละประเภทจะมีเอกลักษณ์เฉพาะตัว แต่โดยทั่วไปแล้วพวกเขา [counter|E] [heavy_cavalry|E] และ [light_cavalry|E] และในทางกลับกันจะถูกแก้ทางโดย [heavy_infantry|E]\n\nพลหอกมักจะแข็งแกร่งใน [terrain|E] ที่เป็นเนินเขาและภูเขาด้วย"
 game_concept_heavy_infantry:0 "ทหารราบหนัก"
 game_concept_heavy_infantry_desc:0 "ทหารราบหนักคือ [men_at_arms|E] ที่ต่อสู้ด้วยเท้า พร้อมเกราะและอาวุธที่หนักกว่า\n\nแม้ว่าทหารราบหนัก แต่ละประเภทจะมีเอกลักษณ์เฉพาะตัว แต่โดยทั่วไปแล้วพวกเขา [counter|E] [spearmen|E] และในทางกลับกันจะถูกแก้ทางโดย [skirmishers|E]"
 game_concept_archer_cavalry:0 "ทหารม้าธนู"
 game_concept_archer_cavalry_desc:0 "$game_concept_archer_cavalry$ คือ [men_at_arms|E] ที่ขี่ม้าพร้อมอาวุธระยะไกล\n\nแม้ว่า $game_concept_archer_cavalry$ แต่ละประเภทจะมีเอกลักษณ์เฉพาะตัว แต่โดยทั่วไปแล้วพวกเขา [counter|E] [heavy_infantry|E] และในทางกลับกันจะถูกแก้ทางโดย [archers|E] ที่ใช้หน้าไม้\n\n$game_concept_archer_cavalry$ มักจะแข็งแกร่งใน [terrain|E] ที่ราบเรียบ โดยเฉพาะทุ่งหญ้าสเตปป์"
 game_concept_camel_cavalry:0 "ทหารอูฐ"
 game_concept_camel_cavalry_desc:0 "$game_concept_camel_cavalry$ คือ [men_at_arms|E] ที่ขี่อูฐ ซึ่งคล้ายกับ [light_cavalry|E] เก่งกาจในการสอดแนมและไล่ตามศัตรู\n\nโดยทั่วไปแล้วพวกเขา [counter|E] $game_concept_light_cavalry$ และในทางกลับกันจะถูกแก้ทางโดย [spearmen|E]\n\n$game_concept_camel_cavalry$ มักจะแข็งแกร่งใน [terrain|E] ทะเลทรายและพื้นที่แห้งแล้ง"
 game_concept_elephant_cavalry:0 "ทหารช้าง"
 game_concept_elephant_cavalry_desc:0 "$game_concept_elephant_cavalry$ คือ [men_at_arms|E] ที่ขี่ช้าง มักสวมเกราะ\n\nแม้ว่า $game_concept_elephant_cavalry$ แต่ละประเภทจะมีเอกลักษณ์เฉพาะตัว แต่โดยทั่วไปแล้วพวกเขาเป็นหน่วย [counter|E] ที่แข็งแกร่งต่อหน่วยทหารราบ และในทางกลับกันจะถูกแก้ทางโดย [spearmen|E]\n\n$game_concept_elephant_cavalry$ มักจะแข็งแกร่งใน [terrain|E] ป่าดิบชื้นด้วย"
 game_concept_gunpowders: "พลปืน"
 game_concept_gunpowder: "พลปืน"
 game_concept_gunpowder_desc: "พลปืน คือ [men_at_arms|E] ผู้ติดอาวุธดินปืนอันทรงอานุภาพ\n\nในขณะที่พลปืน แต่ละชนิดมีเอกลักษณ์เฉพาะตัว โดยทั่วไปพวกเขา [counter|E] [heavy_infantry|E] และในทางกลับกันก็ถูกแก้ทางโดย [heavy_cavalry|E] และ [light_cavalry|E]"
 game_concept_peasant_militia: "กองกำลังชาวนา"
 game_concept_peasant_militias: "กองกำลังชาวนา"
 game_concept_peasant_militia_desc: "กองกำลังชาวนา คือ [men_at_arms|E] ผู้ติดอาวุธคราดและหอก\n\nในขณะที่กองกำลัง แต่ละชนิดมีเอกลักษณ์เฉพาะตัว โดยทั่วไปพวกเขา [counter|E] [heavy_cavalry|E] และ [light_cavalry|E] และในทางกลับกันก็ถูกแก้ทางโดย [heavy_infantry|E]\n\nเหล่ากองกำลังชาวนาแข็งแกร่งใน [terrain|E] ที่เป็นภูเขาและอุดมสมบูรณ์"
 game_concept_special_troops:0 "กองกำลังพิเศษ"
 game_concept_special_troops_desc:0 "$game_concept_special_troops$ ไม่เหมือนกับ [armies|E] ทั่วไป เนื่องจากไม่ได้ระดมพลจาก [holding|E] $game_concept_special_troops$ สามารถได้รับผ่านเหตุการณ์ และเป็นตัวแทนของสิ่งต่าง ๆ เช่น กองทหารรักษาการณ์ ฝูงชนที่หิวโหย และชาวนาผู้ทะเยอทะยาน\n\nโดยปกติแล้วพวกเขาไม่มีค่าบำรุงรักษา และไม่เสริมกำลัง ใช้พวกเขาอย่างชาญฉลาดหากคุณมี\n\n[rulers|E] ในประวัติศาสตร์หลายคนเริ่มต้นด้วย $game_concept_special_troops$"
 game_concept_line:0 "สาย"
 game_concept_line_of_succession:0 "ลำดับการสืบทอด"
 game_concept_line_of_succession_desc:0 "ลำดับการสืบทอดคือลำดับที่ตัวละครบางตัวจะได้รับสืบทอด [titles|E] บางอย่าง ซึ่งกำหนดโดย [succession_law|E]"
 game_concept_counter:0 "หน่วยแก้ทาง"
 game_concept_counters:0 "หน่วยแก้ทาง"
 game_concept_men_at_arms_counter:0 "หน่วยแก้ทางทหารอาชีพ"
 game_concept_men_at_arms_counter_desc:0 "[men_at_arms|E] ส่วนใหญ่สามารถ $game_concept_counter$ $game_concept_men_at_arms$ ประเภทอื่นได้\n\nเมื่อ [regiment|E] ถูกแก้ทาง ประสิทธิภาพระหว่าง [battle|E] จะลดลง ยิ่ง $game_concept_regiment$ มีจำนวนน้อยกว่า $game_concept_counter$ มากเท่าใด ค่าปรับโทษก็จะยิ่งสูงขึ้นเท่านั้น"
 game_concept_intimidated:0 "หวาดหวั่น"
 game_concept_intimidated_i:0 "@intimidated_icon!"
 game_concept_intimidated_desc:1 "ตัวละครที่กลัวตัวละครอื่นอย่างมากจะรู้สึกหวาดหวั่นต่อพวกเขา ซึ่งมักเกิดจาก [dread|E] และ/หรือบุคลิกขี้ขลาด\n\nตัวละครที่หวาดหวั่นมีแนวโน้มที่จะริเริ่มการกระทำที่เป็นปฏิปักษ์ต่อตัวละครที่พวกเขากลัวน้อยลง รวมถึงการเข้าร่วมหรือก่อตั้ง [factions|E]\n\nตัวละครที่หวาดกลัวยิ่งกว่าจะถูกทำเครื่องหมายว่าเป็น [cowed|E]"
 game_concept_cowed:1 "หวาดกลัว"
 game_concept_terrified_i:0 "@terrified_icon!"
 game_concept_cowed_desc:2 "ตัวละครที่หวาดกลัวจะตัวแข็งทื่อด้วยความกลัวต่อตัวละครอื่น และแทบจะไม่ดำเนินการใด ๆ ที่เป็นปฏิปักษ์ต่อตัวละครนั้น รวมถึงการก่อตั้ง [factions|E]\n\nตัวละครจะหวาดกลัวหรือ [intimidated|E] จาก [dread|E] และ/หรือบุคลิกขี้ขลาด"
 game_concept_provisions: "เสบียง"
 game_concept_provision: "เสบียง"
 game_concept_provisions_i: "@provisions_icon!"
 game_concept_provisions_desc: "$game_concept_provisions$ แสดงถึงปริมาณอาหาร น้ำ และที่พักพิงทั้งหมดที่ [camp|E] สามารถจัดหาได้\n\n$game_concept_camps$ จะสูญเสีย $game_concept_provisions$ ขณะเคลื่อนย้าย [location|E] ปริมาณที่แน่นอนได้รับผลกระทบจากขนาดของ [men_at_arms|E] ของพวกเขา [terrain|E] ที่เคลื่อนผ่าน และ [officers|E] ใดที่ได้รับการว่าจ้างในปัจจุบัน\n\nผู้ติดตาม $game_concept_camp$ ที่มี $game_concept_provisions$ เหลือน้อยจะเริ่มประสบกับเหตุการณ์ [privation|E]: เริ่มต้นด้วย [characters|E] ที่สูญเสีย [opinion|E] ต่อผู้นำอย่างรวดเร็ว ลุกลามอย่างรวดเร็วจนถึงความอดอยากและความตาย\n\n#WEAK $game_concept_provisions$ สามารถเติมได้เมื่ออยู่กับที่โดยการร้องขอจาก [contact_list_contacts|E] การตัดสินใจ [decision|E] หรือเป็นรางวัล [task_contract|E]#!"
 game_concept_privation: "ความแร้นแค้น"
 game_concept_privation_desc: "เมื่อ [camp|E] อยู่กับที่ พวกเขาสามารถดำรงชีพได้ด้วยการแลกเปลี่ยนอาหารกับงานเล็ก ๆ น้อย ๆ การล่าสัตว์ การหาของป่า หรือการตกปลาในที่ที่ได้รับอนุญาตและเป็นไปได้ และโดยทั่วไป #EMP แค่#! พอประทังสถานการณ์เสบียงของตนไปได้\n\nทันทีที่พวกเขาต้องเริ่ม [traveling|E] พวกเขาต้องพึ่งพา $game_concept_provisions$ ของตนเพื่อความอยู่รอดโดยสิ้นเชิง เนื่องจากไม่สามารถทั้งเคลื่อนที่และหาอาหารได้เพียงพอ เมื่อ $game_concept_provisions$ เหลือน้อย (แล้ว #EMP หมดไป#!) อารมณ์จะเดือดพล่านและ [followers|E] จะอดอยาก\n\nเมื่อสิ่งนี้เกิดขึ้น [characters|E] จะเริ่มออกจาก $game_concept_camp$ จะมีการใช้ [modifiers|E] เชิงลบเพิ่มมากขึ้น และผู้ที่ยังคงอยู่จะก่อกบฏหรือเสียชีวิตในที่สุด"
 game_concept_supply:0 "เสบียง"
 game_concept_supply_state:0 "สถานะเสบียง"
 game_concept_supply_desc:1 "$game_concept_supply$ คือปริมาณอาหารและยุทโธปกรณ์ที่ [army|E] บรรทุก กองทัพจะเริ่มสูญเสีย $game_concept_supply$ เมื่อขนาดของกองทัพเกิน [supply_limit|E] ของตำแหน่งปัจจุบัน\n\nกองทัพที่กำลังขาดแคลน $game_concept_supplies$ จะได้รับโทษ [advantage|E] ใน [battle|E] และเมื่อหมดลงโดยสิ้นเชิง พวกเขาจะเริ่มประสบกับ [attrition|E]\n\nเสบียงจะเพิ่มขึ้นเมื่อเวลาผ่านไปตราบใดที่กองทัพยังคงอยู่ต่ำกว่า $game_concept_supply_limit$ ในดินแดนที่เป็นมิตร"
 game_concept_supplied:0 "มีเสบียง"
 game_concept_supplies:0 "เสบียง"
 game_concept_supply_limit_mult:0 "ตัวคูณขีดจำกัดเสบียง"
 game_concept_supply_limit:0 "ขีดจำกัดเสบียง"
 game_concept_supply_limit_desc:0 "$game_concept_supply_limit$ กำหนดจำนวน [soldiers|E] ที่คุณอาจมีใน [barony|E] ซึ่งกำหนดโดย [terrain|E] และ [development|E] ของบารอนี\n\nหากขนาด [army|E] ทั้งหมดของคุณเกิน $game_concept_supply_limit$ $game_concept_armies$ ของคุณจะสูญเสีย [supply|E] และประสบกับ [attrition|E] ในที่สุด"
 game_concept_attrition:0 "การสูญเสียกำลังพล"
 game_concept_attrition_desc:1 "[armies|E] สามารถประสบกับ $game_concept_attrition$ ซึ่งคือเมื่อ [soldiers|E] สูญหายไป เนื่องจากการหนีทัพ โรคภัย หรือความอดอยาก\n\n$game_concept_attrition$ เกิดขึ้นเมื่อกองทัพหมด [supplies|E] กำลังล้อม [fortified_holding|E] หรือเคลื่อนที่จาก [county|E] ที่เป็นศัตรูหนึ่งไปยังอีกแห่งหนึ่ง หากตำแหน่งเป้าหมายไม่ได้มีพรมแดนติดกับ $game_concept_county$ ที่อยู่ภายใต้การควบคุมอยู่แล้ว"
 game_concept_attrition_i: "@attrition_icon!"
 game_concept_objectives:0 "เป้าหมาย"
 game_concept_objectives_desc:1 "บางส่วนของ [realm|E] ของศัตรู (โดยปกติคือ [realm_capital|E] และ [holdings|E] ในภูมิภาค [war_target|E] ของ [war|E]) ถือเป็น $game_concept_objectives$ โดยการ [occupying|E] $game_concept_objectives$ คุณจะเริ่มได้รับ [war_score|E] ที่เพิ่มขึ้นเรื่อย ๆ\n\nสำหรับฝ่ายป้องกัน [war_score|E] จะเริ่มเพิ่มขึ้น (หลังจากช่วงเวลาเริ่มต้น) หากฝ่ายโจมตีถูกขัดขวางไม่ให้ยึดครอง $game_concept_objectives$ ใด ๆ ได้"
 game_concept_war_contribution:0 "การมีส่วนร่วมในสงคราม"
 game_concept_contribution:0 "การมีส่วนร่วม"
 game_concept_contribute:0 "มีส่วนร่วม"
 game_concept_war_contribution_desc:1 "[rulers|E] ที่กำลังช่วยเหลือ [allies|E] ของตนใน [war|E] จะได้รับ $game_concept_war_contribution$ ขึ้นอยู่กับจำนวนและขนาดของ [battles|E] ที่พวกเขาเข้าร่วม รวมถึงจำนวน [holdings|E] ที่พวกเขาสามารถ [occupy|E] ได้\n\nหลังจากสงครามสิ้นสุดลง ผู้มีส่วนร่วม แต่ละคนจะได้รับรางวัลตามสัดส่วนการมีส่วนร่วมของตน ของรางวัลที่แน่นอนขึ้นอยู่กับ [casus_belli|E] ของสงคราม แต่โดยทั่วไปคือ [gold|E], [prestige|E] หรือ [piety|E]\n\nโปรดทราบว่าการมีส่วนร่วมจะเพิ่มขึ้นแม้จากการแพ้การรบ"
 game_concept_scheme_speed: "ระยะเวลาช่วงแผนการ"
 game_concept_scheme_speed_single: "ระยะเวลาช่วง"
 game_concept_scheme_speed_i: "@scheme_phase_duration_icon!"
 game_concept_scheme_speed_desc: "$game_concept_scheme_speed_single$ หมายถึงจำนวนวันที่ใช้ในการดำเนินการ [scheme_phase|e] หนึ่งช่วงให้เสร็จสมบูรณ์ ความเร็วได้รับผลกระทบจาก [skill|E] ของคุณ [agents|E] และ [spymaster|E] ของคุณ รวมถึง [councillor_task|E] '$task_support_schemes$' หากแผนการเป็น [scheme_hostile|E]\n\n#WEAK $game_concept_scheme_speed_single$ ที่ต่ำกว่าจะเป็นประโยชน์ เพราะจะ ทำให้ [scheme|e] ดำเนินการได้เร็วขึ้น"
 game_concept_scheme_resistance:0 "การต้านทานแผนการ"
 game_concept_scheme_resistance_single:0 "การต้านทาน"
 game_concept_hostile_scheme_resistance:0 "การต้านทานแผนการร้าย"
 game_concept_scheme_resistance_desc:1 "$game_concept_scheme_resistance$ ของ [character|E] จะชะลอ $game_concept_schemes$ ที่ต่อต้านพวกเขา\n\n[scheme_speed|E] ของ [scheme_owner|E] จะลดลงตามค่านี้ ซึ่งจะเพิ่มเวลาที่ $game_concept_scheme$ ใช้ในการได้รับ [scheme_opportunity_opportunities|E]\n\n#WEAK $game_concept_scheme_resistance$ เพิ่มขึ้นตาม [skill|E] ที่เกี่ยวข้องของ [scheme_target|E] และ [spymaster|E] ของพวกเขา รวมถึง [councillor_task|E] '$task_disrupt_schemes$' (หากแผนการเป็น [scheme_hostile|E])#!"
 game_concept_scheme_success_chance:0 "โอกาสสำเร็จของแผนการ"
 game_concept_success_chance:0 "โอกาสสำเร็จ"
 game_concept_success_chance_i: "@scheme_success_icon!"
 game_concept_scheme_success_chance_desc:0 "$game_concept_success_chance$ ของ [scheme|e] กำหนดความน่าจะเป็นที่จะสำเร็จเมื่อดำเนินการ\n\n$game_concept_success_chance$ ของ $game_concept_scheme$ จะ [scheme_growth_grow|E] เมื่อเวลาผ่านไป และขึ้นอยู่กับ [agents|e] ที่ได้รับมอบหมาย รวมถึง [skill|e] ที่เกี่ยวข้อง $game_concept_success_chance$ ถูกจำกัดโดย [scheme_potential|e] ไม่มี $game_concept_scheme$ ใดที่สามารถเกิน 95% $game_concept_success_chance$ ได้ ยกเว้น [contract_schemes|e]\n\n#WEAK [secret_schemes|e] มีความเสี่ยงที่จะถูกเป้าหมายค้นพบ หากเกิดเหตุการณ์นั้น $game_concept_success_chance$ ของคุณจะลดลงอย่างมาก #!"
 game_concept_scheme_growth: "การเติบโตของแผนการ"
 game_concept_success_chance_growth_i: "@scheme_success_growth_icon!"
 game_concept_scheme_growth_growth: "การเติบโต"
 game_concept_scheme_growth_desc: "ทุก ๆ [scheme_phase_phase|E] [success_chance|E] ของ $game_concept_scheme$ จะเพิ่มขึ้นตามค่านี้ จนกว่าจะถึง [scheme_potential_potential|E] สูงสุดในปัจจุบัน\n\n#WEAK ตัวอย่างเช่น หาก $game_concept_scheme$ ปัจจุบันมี 50% $game_concept_success_chance$ มี $game_concept_scheme_potential_potential$ 54% และ $game_concept_scheme_growth_growth$ 3% หลังจากผ่านไปหนึ่ง $game_concept_scheme_phase_phase$ จะมี 53% $game_concept_success_chance$\n\nเนื่องจาก $game_concept_scheme_growth_growth$ ยังคงถูกจำกัดโดย $game_concept_scheme_potential_potential$ หลังจากช่วงถัดไป $game_concept_scheme$ จะมีเพียง 54% $game_concept_success_chance$ เท่านั้น#!"
 game_concept_scheme_growth_grow: "เติบโต"
 game_concept_scheme_growth_grow_desc: "$game_concept_scheme_growth_desc$"
 game_concept_scheme_potential: "ศักยภาพแผนการ"
 game_concept_scheme_potential_potential: "ศักยภาพ"
 game_concept_success_chance_max_i: "@scheme_success_max_icon!"
 game_concept_scheme_potential_desc: "[scheme|e] มี [success_chance|e] ซึ่งเป็นค่าเปอร์เซ็นต์ที่กำหนดผลลัพธ์ ซึ่งไปถึงได้ผ่าน [scheme_growth|E] สิ่งนี้ถูกจำกัดโดย $game_concept_scheme_potential$ ซึ่งทำหน้าที่เป็นขีดจำกัดบนของ $game_concept_scheme$\n\n$game_concept_scheme_potential$ สามารถเพิ่มขึ้นได้โดยการจ้าง [agents|e] ที่เหมาะสม แต่ไม่สามารถเกิน 95% ได้ ยกเว้น [contract_schemes|e]\n\n#WEAK $game_concept_agents$ ที่เข้ากันได้อาจให้ [modifiers|E] โบนัสเพิ่มเติมผ่านเหตุการณ์\n\n$game_concept_success_chance$ ส่วนเกินที่อยู่เหนือ $game_concept_scheme_potential_potential$ ของ $game_concept_scheme$ จะหายไป#!"
 game_concept_secrecy:0 "การรักษาความลับ"
 game_concept_secrecy_i: "@scheme_secrecy_icon!"
 game_concept_secrecy_desc:1 "$game_concept_secrecy$ ของ [hostile_scheme|e] กำหนดความน่าจะเป็นที่จะยังคงไม่ถูกตรวจพบจากเป้าหมาย [scheme|e]\n\n$game_concept_secrecy$ ของ $game_concept_scheme$ จะมีระยะเวลาคุ้มกันเริ่มต้น ซึ่งไม่สามารถถูกค้นพบได้ หลังจากช่วงเวลานี้ $game_concept_scheme$ จะมีความเสี่ยงที่จะถูกค้นพบทุกเดือนผ่าน [scheme_breach_short|e] [agents|e] ของคุณสามารถส่งผลกระทบอย่างมากต่อความสามารถในการรักษาความลับของ $game_concept_scheme$ ของคุณได้ดีเพียงใด\n\n#WEAK $game_concept_scheme$ ที่มี $game_concept_secrecy$ 80% มีโอกาส 20% ที่จะถูกค้นพบเมื่อดำเนินการ และมีโอกาส 2% ที่จะถูกค้นพบในแต่ละเดือนที่ดำเนินการต่อไป#!"
 game_concept_secrecy_grace: "ระยะผ่อนผัน"
 game_concept_secrecy_grace_desc.boilerplate: "$game_concept_schemes$ ส่วนใหญ่มีระยะเวลาผ่อนผันประมาณ ~[EmptyScope.ScriptValue('secrecy_grace_period_value')] เดือน ก่อนที่จะสามารถถูกค้นพบรายเดือนได้"
 game_concept_secrecy_grace_desc: "$game_concept_secrecy_grace_desc.boilerplate$\n\nหลังจากระยะเวลาผ่อนผันสิ้นสุดลง $game_concept_schemes$ อาจถูกค้นพบรายเดือน ทำให้เกิด [scheme_breach_short|E] ซึ่งมีอัตราที่ลดลงอย่างมากเมื่อเทียบกับการค้นพบเมื่อแผนการถูกดำเนินการ แต่จะถูกตรวจสอบบ่อยครั้งกว่าอย่างมีนัยสำคัญ"
 game_concept_county_development:0 "การพัฒนาเคาน์ตี"
 game_concept_development_i:0 "@development_icon!"
 game_concept_development:0 "การพัฒนา"
 game_concept_county_development_desc:0 "$game_concept_county_development$ เป็นตัวชี้วัดโครงสร้างพื้นฐานและความก้าวหน้าทางเทคโนโลยีในท้องถิ่นของ [county|E]\n\n$game_concept_county_development$ ที่สูงขึ้นจะเพิ่ม [levies|E], [taxes|E], และ [supply_limit|E] ที่ได้รับจาก $game_concept_county$"
 game_concept_county_development_growth:0 "การเติบโตของการพัฒนาเคาน์ตี"
 game_concept_development_growth:0 "การเติบโตของการพัฒนา"
 game_concept_county_development_growth_desc:0 "$game_concept_county_development_growth$ วัดว่า [county|E] มีความคืบหน้าไปมากเพียงใดในการเพิ่ม [development|E]\n\nที่ 100 $game_concept_county_development_growth$ $game_concept_county_development$ จะเพิ่มขึ้น 1"
 game_concept_existing_development:0 "ระดับการพัฒนาที่มีอยู่"
 game_concept_existing_development_desc:1 "ภารกิจสจ๊วต [develop_county|E] ประสบกับผลตอบแทนที่ลดลง ยิ่ง [county] มี [development|E] อยู่แล้วมากเท่าใด [development_growth|E] ก็จะถูกลงโทษมากขึ้นเท่านั้น\n\nโดยค่าเริ่มต้น [counties] จะถึงค่าปรับโทษ [existing_development] สูงสุดที่ 10 [development|E] แต่ละ [era|E] มี [innovation|E] ซึ่งเพิ่มขีดจำกัดนี้อย่างมีนัยสำคัญ สูงสุดถึง 90 [development|E] ใน [era] $culture_era_late_medieval$\n\nนวัตกรรมที่ส่งผลต่อตัวปรับ แต่ง $game_concept_existing_development$:\n$EFFECT_LIST_BULLET$ $innovation_development_01$\n$EFFECT_LIST_BULLET$ $innovation_development_02$\n$EFFECT_LIST_BULLET$ $innovation_development_03$\n$EFFECT_LIST_BULLET$ $innovation_development_04$"
 game_concept_county_control:0 "การควบคุมเคาน์ตี"
 game_concept_control:0 "การควบคุม"
 game_concept_control_i:0 "@control_icon!"
 game_concept_county_control_desc:0 "$game_concept_county_control$ วัดระดับการควบคุมที่รัฐบาลมีต่อประชากรของ [county|E] มีความสำคัญอย่างยิ่งโดยเฉพาะอย่างยิ่งสำหรับการเก็บ [taxes|E] จาก [holdings|E]\n\nเมื่อเคาน์ตีเปลี่ยนมือผ่าน [war|E] การควบคุมจะลดลงอย่างมาก ซึ่งเป็นเหตุผลที่ดีในการ ทำให้ [holder|E] ปัจจุบันเป็นข้าหลวงแทน (หาก [casus_belli|E] อนุญาต) การควบคุมเคาน์ตียังสามารถได้รับความเสียหายจาก [sieges|E] และ [Concept( 'peasant_faction', 'การลุกฮือของชาวนา' )|E]\n\nการควบคุมต่ำอาจนำไปสู่ [county_corruption|E] และวิธีหลักในการเพิ่มการควบคุมคือ [councillor_task|E] ที่มีให้สำหรับ [marshal|E] ของคุณ"
 game_concept_absolute_control:0 "การควบคุมเบ็ดเสร็จ"
 game_concept_absolute_control_short: "เบ็ดเสร็จ"
 game_concept_absolute_control_desc:1 "$game_concept_absolute_control$ เป็นสถานะพิเศษของ [control|E] ที่เปิดใช้งานโดย [perk|E] $absolute_control_perk_name$ ซึ่งแสดงว่าผู้ปกครองมีการควบคุมประชากรอย่างเข้มงวด\n\nเมื่อใดก็ตามที่ $game_concept_control$ อยู่ที่ #V 100#! จะแสดงเป็น '$ABSOLUTE_COUNTY_CONTROL$' แทนและให้โบนัสเพิ่มเติมแก่ [taxes|E] และ [levies|E]"
 game_concept_county_corruption:0 "การทุจริตในเคาน์ตี"
 game_concept_county_corruption_desc:0 "ในขณะที่ [county|E] มี [control|E] ต่ำหรือ [holder|E] อยู่ใน [debt|E] เคาน์ตีอาจได้รับ $game_concept_county_corruption$ เหล่านี้คือ [county_modifiers|E] เชิงลบประเภทต่าง ๆ\n\n$game_concept_county_corruption$ จะจางหายไปตามกาลเวลา แต่หากสาเหตุหลักยังคงอยู่ ([debt|E] หรือ [control|E] ต่ำ) ก็อาจปรากฏขึ้นอีกครั้ง\n\n$game_concept_councillor_task$ $task_increase_control$ ของ $councillor_marshal$ สามารถขจัด $game_concept_county_corruption$ ได้เร็วขึ้น"
 game_concept_county_modifier:0 "ตัวปรับ แต่งเคาน์ตี"
 game_concept_county_modifiers:0 "ตัวปรับ แต่งเคาน์ตี"
 game_concept_county_modifier_desc:1 "$game_concept_county_modifiers$ คือตัวปรับ แต่งที่ส่งผลต่อค่าต่าง ๆ ของ [county|E]\n\n[baronies|E] สามารถมีตัวปรับ แต่งของตนเองได้ และสามารถดูได้ใน [holdings|E] ของ $game_concept_county$"
 game_concept_fleet:0 "กองเรือ"
 game_concept_fleets:0 "กองเรือ"
 game_concept_fleet_desc:1 "[armies|E] ที่เคลื่อนเข้าสู่เขตทะเลจะ [embark|E] ลงบน $game_concept_fleet$ โดยอัตโนมัติ การ [embarking] มีค่าใช้จ่ายเป็น [gold|E] จำนวนหนึ่ง ซึ่งเป็นสัญลักษณ์ของการจัดหาและสร้างเรือ\n\nขณะอยู่บน $game_concept_fleet$ [armies] จะสามารถเดินทางข้ามน้ำได้อย่างรวดเร็ว แม้ว่าจะมีค่าบำรุงรักษาเพิ่มขึ้น #V 25%#! และจะเริ่มสูญเสีย [supplies|E] หลังจาก #V [GetDefine('NFleet', 'ATTRITION_AFTER_DAYS')|0]#! วันในทะเล\n\n$game_concept_fleets$ ไม่ปะทะกันใน [battles|E]\n\nเมื่อ $game_concept_army$ ขึ้นฝั่ง $game_concept_fleet$ จะหายไปและ $game_concept_army$ จะกลายเป็น [recently_disembarked|E]"
 game_concept_domain_income:0 "รายได้จากดินแดนส่วนตัว"
 game_concept_domain_taxes:0 "ภาษีจากดินแดนส่วนตัว"
 game_concept_domain_income_desc:1 "$game_concept_domain_income$ ของคุณประกอบด้วย [taxes|E] ที่คุณเก็บจาก [domain|E] ของคุณเอง จำนวนที่เก็บได้ขึ้นอยู่กับระดับ [control|E] และ [development|E] ในท้องถิ่น"
 game_concept_vassal_taxes:0 "ภาษีจากข้าหลวง"
 game_concept_vassal_taxes_desc:1 "$game_concept_vassal_taxes$ ของคุณประกอบด้วย [taxes|E] ที่คุณได้รับจาก [vassals|E] ของคุณ จำนวนขึ้นอยู่กับ [obligations|E] ของข้าหลวง แต่ละคน\n\nจากมุมมองของข้าหลวงของคุณ ภาษีเดียวกันนี้เรียกว่า [liege_taxes|E] เพื่อแยกความแตกต่างจาก $game_concept_vassal_taxes$ ใด ๆ ที่พวกเขาเก็บจาก $game_concept_vassals$ ของตนเอง"
 game_concept_tributary_taxes: "ภาษีจากผู้ส่งบรรณาการ"
 game_concept_tributary_taxes_desc: "$game_concept_tributary_taxes$ ของท่านประกอบด้วย [taxes|E] ที่ท่านได้รับจาก [tributaries|E] ของท่าน จำนวนขึ้นอยู่กับ [obligations|E] ของ แต่ละผู้ส่งบรรณาการ\n\nในมุมมองของ [tributaries|E] ของท่าน ภาษีเดียวกันนี้จะถูกเรียกว่า [suzerain_taxes|E] เพื่อแยกความแตกต่างจาก $game_concept_tributary_taxes$ ใดๆ ที่พวกเขาเก็บจาก $game_concept_tributaries$ ของตนเอง"
 game_concept_liege_taxes:0 "ภาษีส่งนายเหนือ"
 game_concept_liege_taxes_desc:1 "$game_concept_liege_taxes$ ของคุณคือ [taxes|E] ที่คุณต้องจ่ายให้กับ [liege|E] ของคุณ ซึ่งเป็นส่วนหนึ่งของ [obligations|E] ของคุณ คุณไม่ต้องจ่าย $game_concept_liege_taxes$ ใด ๆ หากคุณเป็น [independent|E]\n\nจากมุมมองของนายเหนือของคุณ ภาษีเดียวกันนี้เรียกว่า [vassal_taxes|E] แทน เพื่อแยกความแตกต่างจากภาษีใด ๆ ที่พวกเขาอาจต้องจ่ายให้กับ $game_concept_liege$ ของตนเอง"
 game_concept_suzerain_taxes: "ภาษีแก่เจ้าผู้ปกครอง"
 game_concept_suzerain_taxes_desc: "$game_concept_suzerain_taxes$ ของท่านคือ [taxes|E] ที่ท่านต้องจ่ายให้แก่ [suzerain|E] ของท่าน ซึ่งเป็นส่วนหนึ่งของ [obligations|E] ของท่าน\n\nในมุมมองของ [suzerain|E] ของท่าน ภาษีเดียวกันนี้จะถูกเรียกว่า [tributary_taxes|E] แทน เพื่อแยกความแตกต่างจากภาษีใดๆ ที่พวกเขาอาจติดค้างต่อ $game_concept_suzerain$ ของตนเอง"
 game_concept_usurp_title:0 "ชิงตำแหน่ง"
 game_concept_usurp:0 "ชิง"
 game_concept_usurped:0 "ถูกชิง"
 game_concept_usurpation:0 "การชิงตำแหน่ง"
 game_concept_usurp_title_desc:1 "[title|E] ที่ถือครองโดย [ruler|E] ต่างชาติมักจะสามารถถูกชิงได้หากมากกว่า #V 50%#! ของ [counties|E] ตาม [de_jure|E] อยู่ภายใน [realm|E] ของคุณ กระบวนการนี้จะมอบ [title|E] ให้กับคุณ ซึ่งมีความสำคัญอย่างยิ่งในการรับรองว่าคุณคือ [rightful_liege|E] ของ [vassals|E] ของคุณ\n\nการชิงตำแหน่งจะยากขึ้นหาก [faith|E] ของผู้ถือครองปัจจุบันเป็นปฏิปักษ์ต่อคุณ ในกรณีนี้ การชิงตำแหน่งจะทำได้ก็ต่อเมื่อผู้ถือครองไม่ได้ครอบครอง [counties|E] ตาม [de_jure|E] ใด ๆ ภายในอาณาจักรของเขาอีกต่อไป"
 game_concept_close_family:0 "ครอบครัวใกล้ชิด"
 game_concept_close_family_members:0 "สมาชิกครอบครัวใกล้ชิด"
 game_concept_close_family_member:0 "สมาชิกครอบครัวใกล้ชิด"
 game_concept_close_family_desc:0 "ครอบครัวใกล้ชิดของตัวละครประกอบด้วย:\n$BULLET_WITH_TAB$บิดามารดา\n$BULLET_WITH_TAB$ปู่ย่าตายาย\n$BULLET_WITH_TAB$บุตรธิดา\n$BULLET_WITH_TAB$หลาน\n$BULLET_WITH_TAB$พี่น้อง"
 game_concept_extended_family:0 "ครอบครัวขยาย"
 game_concept_extended_family_members:0 "สมาชิกครอบครัวขยาย"
 game_concept_extended_family_desc:0 "ครอบครัวขยายของตัวละครประกอบด้วย:\n$BULLET_WITH_TAB$ลูกพี่ลูกน้อง\n$BULLET_WITH_TAB$ลุง\n$BULLET_WITH_TAB$ป้า\n$BULLET_WITH_TAB$หลานชาย\n$BULLET_WITH_TAB$หลานสาว"
 game_concept_family:0 "ครอบครัว"
 game_concept_family_members:0 "สมาชิกครอบครัว"
 game_concept_family_member:0 "สมาชิกครอบครัว"
 game_concept_family_desc:0 "ครอบครัวของตัวละครประกอบด้วย [close_family_members|E] และ [extended_family_members|E] ของพวกเขา"
 game_concept_kinslayer:0 "ผู้สังหารญาติ"
 game_concept_kinslayers:0 "ผู้สังหารญาติ"
 game_concept_kinslaying:0 "การสังหารญาติ"
 game_concept_kinslaying_desc:0 "ผู้สังหารญาติคือตัวละครที่เป็นที่รู้กันว่าได้สังหาร [family_member|E] บาง [faiths|E] มองว่าการสังหารญาติเป็น [criminal|E]\n\nลักษณะนิสัยการสังหารญาติสามประการคือ:\n$BULLET_WITH_TAB$[GetTrait('kinslayer_3').GetName( GetNullCharacter )] — มอบให้กับผู้ที่สังหาร [close_family|E]\n$BULLET_WITH_TAB$[GetTrait('kinslayer_2').GetName( GetNullCharacter )] — มอบให้กับผู้ที่สังหาร [extended_family|E]\n$BULLET_WITH_TAB$[GetTrait('kinslayer_1').GetName( GetNullCharacter )] — มอบให้กับผู้ที่สังหารสมาชิกของ [dynasty|E] ของตน"
 game_concept_gender_law:0 "กฎหมายเพศสภาพ"
 game_concept_gender_laws:0 "กฎหมายเพศสภาพ"
 game_concept_gender_law_desc:0 "[ruler|E] ทุกคนมีกฎหมายเพศสภาพหลักที่กำหนดว่าใครสามารถสืบทอด [titles|E] ของตนได้เมื่อมีการ [succession|E] กฎหมายเพศสภาพยังส่งผลต่อผู้ที่สามารถบัญชาการ [armies|E] และคุณสมบัติในการมี [spouses|E] หรือ [concubines|E] หลายคน\n\nกฎหมายเพศสภาพที่มีอยู่ขึ้นอยู่กับ [doctrine|E] 'มุมมองต่อเพศสภาพ' ของ [faith|E]"
 game_concept_depose:0 "ถอดถอน"
 game_concept_deposed:0 "ถูกถอดถอน"
 game_concept_depose_desc:0 "[rulers|E] สามารถถูกถอดถอนได้อันเป็นผลมาจากข้อเรียกร้องของ [faction|E] หรือเหตุการณ์พิเศษ [heirs|E] ของพวกเขาจะสืบทอด [titles|E] ของตน แม้ว่าผู้ปกครองคนเก่าจะยังมีชีวิตอยู่"
 game_concept_virtue:0 "คุณธรรม"
 game_concept_virtues:0 "คุณธรรม"
 game_concept_virtuous:0 "ผู้มีคุณธรรม"
 game_concept_virtue_desc:1 "[faith|E] ทุกศรัทธาถือว่า [traits|E] บางอย่างเป็นคุณธรรม ตัวละครที่มีลักษณะนิสัยเหล่านี้จะได้รับโบนัส [opinion|E] จากตัวละครทั้งหมดที่ถือว่าลักษณะนิสัยเหล่านั้นเป็นคุณธรรม แม้ว่าพวกเขาจะไม่ได้นับถือศรัทธาเดียวกันก็ตาม นอกจากนี้ ตัวละครที่มีลักษณะนิสัยที่ศรัทธาของตนเองถือว่าเป็นคุณธรรมจะได้รับโบนัส [piety|E] ทุกเดือน\n\nลักษณะนิสัยใดที่ถือว่าเป็นคุณธรรมนั้นแตกต่างกันไปใน แต่ละศรัทธา แต่โดยทั่วไปจะพิจารณาจากส่วนผสมของ [core_tenets|E] ของศรัทธานั้นและ [religion|E] ที่ศรัทธานั้นสังกัดอยู่"
 game_concept_sin:0 "บาป"
 game_concept_sins:0 "บาป"
 game_concept_sinful:0 "ผู้มีบาป"
 game_concept_sin_desc:1 "[faith|E] ทุกศรัทธาถือว่า [traits|E] บางอย่างเป็นบาป ตัวละครที่มีลักษณะนิสัยเหล่านี้จะได้รับโทษ [opinion|E] จากตัวละครทั้งหมดที่ถือว่าลักษณะนิสัยเหล่านั้นเป็นบาป แม้ว่าพวกเขาจะไม่ได้นับถือศรัทธาเดียวกันก็ตาม นอกจากนี้ ตัวละครที่มีลักษณะนิสัยที่ศรัทธาของตนเองถือว่าเป็นบาปจะสูญเสีย [piety|E] ทุกเดือน\n\nลักษณะนิสัยใดที่ถือว่าเป็นบาปนั้นแตกต่างกันไปใน แต่ละศรัทธา แต่โดยทั่วไปจะพิจารณาจากส่วนผสมของ [core_tenets|E] ของศรัทธานั้นและ [religion|E] ที่ศรัทธานั้นสังกัดอยู่"
 game_concept_excommunicate:0 "ขับออกจากศาสนา"
 game_concept_excommunicated:0 "ถูกขับออกจากศาสนา"
 game_concept_excommunication:0 "การขับออกจากศาสนา"
 game_concept_excommunication_desc:0 "ตัวละครที่ [GetTrait('excommunicated').GetName( GetNullCharacter )] โดย [head_of_faith|E] ของตนจะถูกมองว่าเป็น [criminals|E] โดยตัวละครอื่น ๆ ใน [faith|E] เดียวกัน\n\n[rulers|E] ที่เป็น [independent|E] ซึ่งถูก [GetTrait('excommunicated').GetName( GetNullCharacter )] อาจถูกประกาศ [excommunication_war|E] ต่อต้าน\n\nการขับออกจากศาสนาสามารถยกเลิกได้โดยการขออภัยโทษจาก [head_of_faith|E] หรือโดยการเปลี่ยนไปนับถือ [faith|E] อื่น"
 game_concept_legalism:0 "นิตินิยม"
 game_concept_legalistic:0 "แบบนิตินิยม"
 game_concept_legalism_desc:1 "[core_tenet|E] ที่เน้นการปฏิบัติตามกฎหมายและประเพณีในเทววิทยาและความเลื่อมใส ส่งผลต่อค่าใช้จ่ายด้านกฎหมายและการเป็นสมาชิก [faction|E] ของ [vassal|E] โดยพิจารณาจากจำนวน [sins|E] หรือ [virtues|E] ที่ [ruler|E] มี"
