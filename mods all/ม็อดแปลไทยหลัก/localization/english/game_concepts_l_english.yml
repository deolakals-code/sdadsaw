 game_concept_monument_expedition: "การสำรวจอนุสาวรีย์"
 game_concept_monument_expedition_i: "@activity_monument_expedition!"
 game_concept_monument_expedition_desc: "กิจกรรมที่ตัวละครเลือกเดินทางไปยังอนุสาวรีย์หรือสถานที่สำคัญที่มีชื่อเสียงเพื่อพัฒนาตนเอง โดยการเจาะลึกประวัติศาสตร์ ความรู้ และความลึกลับของมัน\n\nรางวัลที่คาดว่าจะได้รับ:\n\t$BULLET_WITH_TAB$[intrigue_i|E][diplomacy_i|E][martial_i|E][learning_i|E][stewardship_i|E] คะแนน [skill|E]\n$BULLET_WITH_TAB$[court_position_i][court_positions|E] ที่มี [aptitude|E] ยอดเยี่ยม\n$BULLET_WITH_TAB$[prestige_i|E][prestige|E]"

 game_concept_designated_terrain: "ภูมิประเทศที่กำหนด"
 game_concept_designated_terrain_desc: "[decision|E] ที่ปลดล็อกได้จากสาย [wanderer_lifestyle|E] ซึ่งคุณสามารถเลือกกลุ่ม [terrain|E] เพื่อเชี่ยวชาญได้ [perks|E] บางอย่างจะให้ผลประโยชน์ที่แตกต่างกันแก่กลุ่มภูมิประเทศที่เลือก\n\nกลุ่มภูมิประเทศที่สามารถเลือกได้:\n$BULLET_WITH_TAB$@forest! ป่า / @jungle! ป่าดิบชื้น / @taiga! ไทกา / @wetlands! พื้นที่ชุ่มน้ำ\n$BULLET_WITH_TAB$@mountains! ภูเขา / @hills! เนินเขา / @desert_mountains! ภูเขาทะเลทราย\n$BULLET_WITH_TAB$@plains! ที่ราบ / @steppe! ทุ่งหญ้าสเตปป์ / @farmlands! พื้นที่เกษตรกรรม / @floodplains! ที่ราบน้ำท่วมถึง\n$BULLET_WITH_TAB$@desert! ทะเลทราย / @drylands! พื้นที่แห้งแล้ง / @oasis! โอเอซิส"

 game_concept_master_terrain: "เชี่ยวชาญภูมิประเทศ"
 game_concept_master_terrain_desc: "[decision|E] ที่ปลดล็อกได้จากสาย [wanderer_lifestyle|E] ซึ่งคุณสามารถเลือก [terrain|E] เพื่อเชี่ยวชาญได้ โดยพิจารณาจากกลุ่มที่คุณเลือกใน [designated_terrain|E]\n\nการตัดสินใจนี้จะให้ผลประโยชน์อย่างมีนัยสำคัญสำหรับภูมิประเทศที่เลือก ให้โบนัส เช่น [advantage|E] ที่เพิ่มขึ้น, [combat_roll|E] ที่ดีขึ้น, ลด [attrition|E], และ [prestige|E] และ [prestige_experience|E] ที่เพิ่มขึ้นจาก [battle|E]"

 game_concept_story_content_temujin: "$game_concept_story_generic_prefix$ $bookmark_nomads_temujin$"
 game_concept_story_content_temujin_desc: "#tooltip_heading รูปแบบเรื่องราว: เบา#!\n\nในฐานะเตมูจิน ท่านจักแสวงหาการล้างแค้นต่อชนเผ่าคู่แข่งที่ได้จองจำคู่ครองของท่าน, และทดสอบความภักดีของข้าหลวงและสหายสนิทที่สุดของท่าน — จามูคา\n\n$game_concept_story_generic_desc_boilerplate$"
 game_concept_story_content_jamukha: "$game_concept_story_generic_prefix$ $bookmark_nomads_temujin$"
 game_concept_story_content_jamukha_desc: "#tooltip_heading รูปแบบเรื่องราว: เบา#!\n\nในฐานะจามูคา ท่านมีชีวิตอยู่ภายใต้เงาอันยาวนานของเตมูจินมาโดยตลอด, แต่ถึงเวลาแล้วที่จะพิสูจน์ความเก่งกาจของท่านเอง ท่านจะยังคงภักดีต่อเขา หรือจะเชือดคอเขาในความมืด?\n\n$game_concept_story_generic_desc_boilerplate$"

