 game_concept_vizier: "วิเซียร์"
 game_concept_viziers: "วิเซียร์"
 game_concept_vizierate: "ตำแหน่งวิเซียร์"
 game_concept_vizier_desc: "$game_concept_vizier$ เป็นประเภทหนึ่งของ [diarch|E] ที่ [rulers|E] แบบ [clan|E] อาจ แต่งตั้งโดยสมัครใจเพื่อช่วยเพิ่ม [income|E] ของตน พวกเขามี [diarch_powers|E] น้อยกว่า แต่ยากที่จะถูกถอดถอนอย่างมาก\n\n$game_concept_viziers$ มอบ [tax_jurisdictions|E] โบนัสแก่ [liege|E] ของตน โดยปรับตาม [stewardship|E] ของพวกเขา และเพิ่ม [aptitude|E] ของ [tax_collectors|E] ตามระดับที่ [scales_of_power|E] เอนเอียงไปทางพวกเขา\n\nที่สำคัญ $game_concept_lieges$ สามารถรีดไถ [gold_i][gold|E] จาก $game_concept_viziers$ ผ่าน [interaction|E] $mulct_vizier_interaction$\n\n#WEAK ในฐานะข้าราชการพลเรือนผู้มีอำนาจ $game_concept_viziers$ ไม่ถือเป็นตำแหน่งอันทรงเกียรติสำหรับ [nobles|E] แม้จะมีอิทธิพลก็ตาม ผู้สืบทอดตำแหน่งจะถูกเลือกตาม [vizier_succession_score|E]#!\n\n$variant_diarchs_replace_regents_boilerplate$"
