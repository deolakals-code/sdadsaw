 game_concept_inspection_success_chance_desc: "ความสำเร็จไม่ใช่สิ่งที่แน่นอนเมื่อดำเนินการ [inspection|E] ปัจจัยหลักที่ส่งผลต่อโอกาสเหล่านี้คือ:\n$BULLET_WITH_TAB$@skill_learning_icon![skills|E]\n$BULLET_WITH_TAB$@control_icon![county_control|E]\n$BULLET_WITH_TAB$@county_icon!พรมแดนติดกับ [realm|E] ต่างชาติ\n\nโอกาสความสำเร็จในการตรวจสอบไม่สามารถสูงกว่า #bold 95#! ได้"

