 game_concept_wanua_desc: "[government|E] $wanua_government_adjective$ มีจุดอ่อนร่วมกับ [government|E] [GetGovernment('tribal_government').GetNameWithIcon] แต่ก็มี [domain_limit|E] และ [vassal_limit|E] ที่ลดลงด้วย แม้ว่าพวกเขาจะใช้ [gold|E] ในการสร้าง [buildings|E] และรับสมัคร [men_at_arms|E] แต่พวกเขาได้รับทองน้อยมากจากสิ่งก่อสร้าง\n\nอย่างไรก็ตาม พวกเขาสามารถ [barter_goods_i][barter|E] [raid|E] และมีการเสริมฤทธิ์กับการปกครอง [GetGovernment('mandala_government').GetName] เนื่องจากพวกเขาได้รับ [legitimacy|E] จากการเป็น [tributary|E]"

 game_concept_bloc_supremacy_war: "สงครามชิงอำนาจสูงสุดกลุ่ม"
 game_concept_bloc_supremacy: "อำนาจสูงสุดกลุ่ม"
 game_concept_supremacy: "อำนาจสูงสุด"
 game_concept_bloc_supremacy_war_desc: "$game_concept_bloc_supremacy_war$ คือ [war|E] ประเภทพิเศษที่สู้รบกันระหว่าง [leading_houses|E] ของสอง [house_blocs|E] [soryo|E]\n\n#high ไม่เหมือนกับ $game_concept_wars$ อื่น ๆ สมาชิกทั้งหมดของทั้งสอง $game_concept_blocs$ จะเข้าร่วม#!\n\n$game_concept_bloc$ ผู้ชนะจะได้รับ [cohesion|E] ในขณะที่ $game_concept_bloc$ ผู้แพ้จะสูญเสียหนึ่งในสามของ $game_concept_cohesion$ ของตน\n\nนอกจากนี้ [member_houses|E] [soryo|E] ใด ๆ ของ $game_concept_bloc$ ผู้แพ้ ซึ่ง [house_head|E] ไม่ได้ [GetTrait('loyal').GetName( GetNullCharacter )] ถูก [hooked|E] โดย เป็น [vassal|E] ย่อยของ เป็น [ally|E] ของ เป็น [friends|E] กับ หรือ [cowed|E] ต่อ $game_concept_house_head$ $game_concept_leading_house_possessive$ ผู้แพ้ จะเข้าร่วมกับ $game_concept_bloc$ ผู้ชนะ"

 game_concept_bloc_expansion_war: "สงครามขยายกลุ่ม"
 game_concept_bloc_expansion: "การขยายกลุ่ม"
 game_concept_bloc_expansion_war_desc: "$game_concept_bloc_expansion_war$ คือ [war|E] ประเภทพิเศษที่สู้รบโดยสมาชิก [bloc|E]\n\nหากได้รับชัยชนะ ผู้ชนะอาจ แต่งตั้ง [ruler|E] ให้กับ [titles|E] ที่เป็นข้อพิพาท หรือเก็บไว้เองก็ได้\n\nการ แต่งตั้ง $game_concept_ruler$ ด้วยวิธีนี้จะเพิ่ม [hook|E] ต่อผู้รับ เพิ่มพวกเขาเข้าไปใน $game_concept_bloc$ ของผู้ชนะ และก่อตั้ง [house|E] ใหม่หากผู้รับไม่ใช่ [house_head|E]"

 game_concept_retirement_age: "$celestial_retirement_law$"
 game_concept_retirement_age_desc: "$celestial_retirement_law$ [law|E] คืออายุ ซึ่งกำหนดโดย [top_liege|E] ของ [realm|E] ที่เกินกว่านั้น [governors|E] และ [ministers|E] อาจเลือกที่จะเกษียณผ่าน [decision|E] หรือถูกบังคับให้เกษียณด้วย [character_interaction|E] โดยอ้างเหตุผลเรื่องความชราภาพและความสามารถในการทำงานที่ลดลง"
