 game_concept_convert_county:0 "$task_conversion$"
 game_concept_convert_county_desc:0 "[councillor_task|E] ที่ดำเนินการโดย [court_chaplain|E] ซึ่งกำหนดเป้าหมายไปที่ [county|E] ที่มีศรัทธาแตกต่างจาก [liege|E]\nความคืบหน้าเพิ่มขึ้นทุกเดือน และที่ 100% ประชากรส่วนใหญ่ของเคาน์ตีเป้าหมายได้เปลี่ยนจากศรัทธาเดิมเป็นศรัทธาของเจ้าเหนือหัว\n\nความเร็วในการเปลี่ยนศาสนาได้รับผลกระทบจากหลายปัจจัย รวมถึง [learning_skill|E] ของ [councillor|E] และ [fervor|E] ของทั้งสองศรัทธา"
 game_concept_convert: "เปลี่ยนศาสนา"
