 game_concept_confidant_desc: "$councillor_vizier_desc$"

 game_concept_vizier_succession_score: "คะแนนการสืบทอดตำแหน่งวิเซียร์"
 game_concept_vizier_succession_score_desc: "ใน [vizierate|E] $game_concept_vizier$ คนต่อไปจะถูกเลือกโดยพิจารณาจากผู้ที่มี $game_concept_vizier_succession_score$ สูงสุด\n\nผู้ที่มีโอกาสได้รับตำแหน่งอาจพยายามโน้มน้าว [ruler|E] เป็นครั้งคราว เพื่อให้ตนได้แทนที่ผู้ดำรงตำแหน่งปัจจุบัน แลกกับ [gold|E]\n\n#WEAK สิ่งนี้อนุญาตเฉพาะ [baron|E] ที่ไม่มีที่ดินและระดับ [title_tier|E] [characters|E] โดยให้ความสำคัญกับผู้ที่มี [diplomacy|E], [stewardship|E], และ [intrigue|E] ที่แข็งแกร่ง รวมถึง [traits|E] ที่ทำให้เป็นข้าราชการพลเรือนที่ดี\n\n[relations|E] กับ $game_concept_vizier$ คนปัจจุบัน หรือ [liege|E], [spouses|E], และ [concubines|E] ที่ [adult|E] และไม่มีที่ดินของ [children|E] สามารถส่งผลกระทบต่อคะแนนได้อย่างมาก#!"

 game_concept_vizier_extravagance: "ความฟุ่มเฟือยของวิเซียร์"
 game_concept_vizier_extravagances: "ความฟุ่มเฟือยของวิเซียร์"
 game_concept_vizier_extravagance_extravagance: "ความฟุ่มเฟือย"
 game_concept_vizier_extravagance_extravagances: "ความฟุ่มเฟือย"
 game_concept_vizier_extravagance_desc: "ขณะดำรงตำแหน่ง [viziers|E] จะใช้ [gold|E] ของตนไปกับ [modifiers|E] $game_concept_vizier_extravagance_extravagance$ ที่หรูหรามากขึ้นเรื่อยๆ ปรนเปรอตนเองและชนชั้นสูงอื่นๆ ใน [capital|E] ของ [liege|E] ของตน\n\n$game_concept_liege$ อาจปล้น $game_concept_modifiers$ เหล่านี้โดยใช้ [interaction|E] $mulct_vizier_interaction$ เปลี่ยนให้เป็น $game_concept_gold$ ที่ $game_concept_vizier$ ถูกบังคับให้โอน\n\n#WEAK เมื่อ $game_concept_vizier$ หยุด [sharing_power|E] พวกเขาจะสูญเสียความสามารถในการรักษาชีวิตที่ฟุ่มเฟือย และ $game_concept_modifiers$ ที่เหลืออยู่จะหายไป\n\nการปล้นในระดับที่สูงขึ้นและในภายหลังจะให้ $game_concept_gold$ มากขึ้น — สี่ระดับของ $game_concept_vizier_extravagance_extravagance$ คือ:\n$EFFECT_LIST_BULLET$ $vizier_extravagance_t1_title$\n$EFFECT_LIST_BULLET$ $vizier_extravagance_t2_title$\n$EFFECT_LIST_BULLET$ $vizier_extravagance_t3_title$\n$EFFECT_LIST_BULLET$ $vizier_extravagance_t4_title$#!"

 game_concept_co_rulership: "การร่วมปกครอง"
 game_concept_co_rulerships: "การร่วมปกครอง"
 game_concept_co_ruler: "ผู้ร่วมปกครอง"
 game_concept_co_rulers: "ผู้ร่วมปกครอง"
 game_concept_co_rulership_desc: "$game_concept_co_rulers$ เป็นรูปแบบหนึ่งของ [diarchies|E] ที่ [diarch|E] ถือว่าแบ่งปันการปกครอง [realm|E] อย่างเป็นทางการและถาวร\n\nพวกเขาเป็น [designated_heir|E] เสมอ ( แม้ว่าอาจยังแพ้การเลือกตั้งได้) และสามารถถูกถอดถอนจากตำแหน่งได้โดย [execution|E] เท่านั้น — เว้น แต่ [liege|E] ของพวกเขามี [culture_tradition|E] ที่เหมาะสม ซึ่งในกรณีนี้พวกเขาสามารถถูก ทำให้พิการแทนได้\n\nโดยเฉพาะอย่างยิ่ง เมื่อ $game_concept_co_ruler$ ประหารชีวิต $game_concept_liege$ ของตน หรือเอาชนะพวกเขาในสงคราม พวกเขาจะ [usurp|E] [titles|E] ของพวกเขา ใน [cultures|E] ที่การ ทำให้พิการเป็นวิธีที่ยอมรับได้ในการถอดถอน $game_concept_co_ruler$ $game_concept_co_ruler$ อาจ ทำให้ $game_concept_liege$ ของตนพิการเพื่อ $game_concept_usurp$ พวกเขาได้ เช่นกัน\n\n#WEAK ตัวอย่างของ $game_concept_co_rulerships$ ได้แก่:\n$EFFECT_LIST_BULLET$[duumvirates|E]\n$EFFECT_LIST_BULLET$[nominal_duumvirates|E]\n$EFFECT_LIST_BULLET$[co_monarchies|E]#!"

 game_concept_duumvirate: "การปกครองคู่"
 game_concept_duumvirates: "การปกครองคู่"
 game_concept_co_emperor: "จักรพรรดิร่วม"
 game_concept_co_emperors: "จักรพรรดิร่วม"
 game_concept_duumvirate_desc: "$game_concept_duumvirate$ คือการปกครอง [empire|E] หนึ่งแห่งโดย [characters|E] สองคน จักรพรรดิอาวุโส ( [liege|E] ) และจักรพรรดิรอง ( $game_concept_co_emperor$ )\n\nพวกเขาสร้าง [influence|E] แบบพาสซีฟทั้งสำหรับตนเองและจักรพรรดิอาวุโสของตน จำนวนที่แน่นอนจะเพิ่มขึ้นทุกๆ [EmptyScope.ScriptValue('co_emperor_scale_years_in_job_value')|0] ปีในตำแหน่ง รวมถึงเวลาใดๆ ที่พวกเขาใช้ในฐานะ [junior_emperor|E]\n\nในทางปฏิบัติ อำนาจส่วนใหญ่ยังคงอยู่ในมือของ $game_concept_liege$ ผู้ ซึ่งถือครองบรรดาศักดิ์จักรพรรดิจริงๆ มากกว่า [diarch|E] ของตน แต่ $game_concept_co_emperor$ สามารถเข้าถึงวิธีการที่มีประสิทธิภาพหลายอย่างในการส่งผลกระทบต่อ [realm|E] และเป็นผู้สมัครที่ถูกกว่าในการส่งเสริมสำหรับตำแหน่ง [administrative|E]\n\nที่น่าสังเกต $game_concept_co_emperors$ สามารถใช้ [casus_belli|E] [imperial_expedition_cb|E] ได้ในระดับที่สูงขึ้นของการแกว่งของ [scales_of_power|E]\n\n#WEAK $game_concept_co_emperors$ สามารถ [usurp|E] จักรพรรดิอาวุโสของตนได้โดยการทำให้พิการตามพิธีกรรม#!"
 
 game_concept_nominal_duumvirate: "การปกครองคู่ แต่ในนาม"
 game_concept_nominal_duumvirates: "การปกครองคู่ แต่ในนาม"
 game_concept_junior_emperor: "จักรพรรดิร่วม แต่ในนาม"
 game_concept_junior_emperors: "จักรพรรดิร่วม แต่ในนาม"
 game_concept_nominal_duumvirate_desc: "$game_concept_duumvirate$ คือการปกครอง [empire|E] หนึ่งแห่งโดย [characters|E] สองคน จักรพรรดิอาวุโส ( [liege|E] ) และจักรพรรดิรอง ( $game_concept_junior_emperor$ )\n\nพวกเขาถือว่าเป็น $game_concept_nominal_duumvirates$ เมื่อจักรพรรดิรองเป็น [child|E] ที่ไม่สามารถปกครองได้อย่างมีประสิทธิภาพ แต่จะเปลี่ยนไปเป็น [duumvirates|E] เต็มรูปแบบเมื่อพวกเขาถึงวัยผู้ใหญ่\n\n$game_concept_junior_emperors$ สร้าง [influence|E] แบบพาสซีฟทั้งสำหรับตนเองและจักรพรรดิอาวุโสของตน จำนวนที่แน่นอนจะเพิ่มขึ้นทุกๆ [EmptyScope.ScriptValue('co_emperor_scale_years_in_job_value')|0] ปีในตำแหน่ง โดยจะยกยอดไปเมื่อพวกเขากลายเป็น $game_concept_co_emperor$ เต็มรูปแบบ\n\n#WEAK การแต่งตั้ง $game_concept_child$ $game_concept_junior_emperor$ เป็นการบ่งชี้ว่าพวกเขากำลังได้รับการฝึกฝนเพื่อวันหนึ่งอาจจะได้เป็นจักรพรรดิอาวุโส ยิ่งพวกเขาได้ฝึกฝนมากเท่าไร พวกเขาก็จะได้รับการฝึกฝนมากขึ้นเท่านั้น\n\nสิ่งนี้แสดงออกมาเป็น [skill|E] เพิ่มเติมที่มอบให้กับพวกเขาเมื่อพวกเขากลายเป็น [adult|E] ขึ้นอยู่กับการแกว่งของ [scales_of_power|E] ของพวกเขา\n\nเด็กจะไม่ได้รับเหตุการณ์ [mandate|E]#!"
 
 game_concept_co_monarchy: "การร่วมราชาธิปไตย"
 game_concept_co_monarchies: "การร่วมราชาธิปไตย"
 game_concept_co_monarch: "กษัตริย์ร่วม"
 game_concept_co_monarchs: "กษัตริย์ร่วม"
 game_concept_co_monarchy_desc: "$game_concept_co_monarchies$ เป็นประเภทหนึ่งของ [diarchy|E] ที่ให้ผู้ปกครองแบบ [feudal|E] มีวิธีเลือก [designated_heir|E] แม้ใน [eras|E] ก่อนหน้า\n\nค่าใช้จ่ายสำหรับสิ่งนี้คือการเข้าสู่ข้อตกลง $game_concept_diarchy$ ถาวรกับพวกเขา ซึ่งพวกเขาจะสามารถเข้าถึงอำนาจหลายอย่าง เช่นเดียวกับ [entrenched_regent|E] ได้ง่ายขึ้น\n\n#WEAK $game_concept_co_monarchs$ มีให้เฉพาะ [kings|E] และ [emperors|E] เท่านั้น#!"

 game_concept_regency:0 "การสำเร็จราชการ"
 game_concept_regencies:0 "การสำเร็จราชการ"
 game_concept_regency_possessive:0 "ของการสำเร็จราชการ"
 game_concept_regencies_possessive:0 "ของการสำเร็จราชการ"
 game_concept_regency_desc:2 "การสำเร็จราชการเป็นรูปแบบพิเศษของ [diarchy|E] สำหรับเมื่อ [ruler|E] ไม่สามารถปกครอง [realm|E] ของตนได้ด้วยตนเอง\n\nโดยทั่วไปจะเกิดขึ้นหากผู้ปกครองเป็น [child|E], [imprisoned|E], [GetTrait('incapable').GetName( GetNullCharacter )], หรือเข้าร่วม [activity|E] นอกอาณาจักรของตน\n\n$game_concept_regency$ ที่คงอยู่นานเกินไปอาจกลายเป็น [entrenched_regency|E]"

 game_concept_regency_veto:0 "การยับยั้งของผู้ร่วมปกครอง"
 game_concept_veto:0 "ยับยั้ง"
 game_concept_regency_veto_desc:0 "เมื่อ [diarch|E] ใช้ [diarch_powers|E] ของตน [liege|E] ของพวกเขาอาจใช้การยับยั้งของผู้ร่วมปกครองเพื่อหยุดยั้งพวกเขา โดยต้องเสีย [prestige|E]"

 game_concept_regent_succession_score:0 "คะแนนการสืบทอดตำแหน่งผู้สำเร็จราชการ"
 game_concept_regent_succession_score_desc:1 "ใน [regency|E] [regent|E] คนต่อไปจะถูกเลือกโดยพิจารณาจากผู้ที่มี $game_concept_regent_succession_score$ สูงสุด\n\nหาก [ruler|E] ของ [realm|E] แต่งตั้งผู้สำเร็จราชการ พวกเขาจะแทนที่ลำดับการสืบทอดและถูกเลือกแทน\n\n#WEAK สิ่งนี้ให้ความสำคัญกับ [characters|E] ที่เกี่ยวข้องกับ $game_concept_ruler$ โดยเฉพาะ [family|E] ที่ไม่มีที่ดินใน [court|E] ของตนและผู้ที่มีความเชี่ยวชาญทางการเมือง#!"

 game_concept_diarch_power:0 "อำนาจที่ยืมมา"
 game_concept_diarch_powers:0 "อำนาจที่ยืมมา"
 game_concept_diarch_power_power:0 "อำนาจ"
 game_concept_diarch_power_powers:0 "อำนาจ"
 game_concept_diarch_power_possessive:0 "ของอำนาจที่ยืมมา"
 game_concept_diarch_powers_possessive:0 "ของอำนาจที่ยืมมา"
 game_concept_diarch_power_power_possessive:0 "ของอำนาจ"
 game_concept_diarch_power_powers_possessive:0 "ของอำนาจ"
 game_concept_diarch_power_desc:2 "[diarch|E] ใน [power_sharing|E] ที่ดำเนินอยู่จะสามารถเข้าถึง $game_concept_diarch_powers$ พิเศษได้\n\nสิ่งเหล่านี้คือ [character_interaction|E] พิเศษที่เลียนแบบสิ่งที่ [liege|E] ของพวกเขามี หรือเป็นการใช้อำนาจในทางที่ผิดอื่นๆ ตัวอย่าง เช่น การ [revoking|E] [titles|E] จาก [vassals|E] คนอื่นๆ หรือการดูด [gold|E] จากเจ้าเหนือหัวของพวกเขา\n\n$game_concept_diarch_powers$ หลายอย่างเปิดโอกาสให้เจ้าเหนือหัวสามารถ [veto|E] ได้"
 game_concept_trilateral_interaction: "ปฏิสัมพันธ์ไตรภาคี"
 game_concept_trilateral_interactions: "ปฏิสัมพันธ์ไตรภาคี"
 game_concept_trilateral_interaction_desc: "$game_concept_trilateral_interactions$ ไม่เพียง แต่ต้องการการอนุมัติจากผู้รับเท่านั้น แต่ยังต้องการการอนุมัติจากบุคคลที่สามด้วย\n\nตัวอย่างคือ [diarch_powers|E] ซึ่ง [liege|E] อาจใช้ [regency_veto|E] ของตน"

 game_concept_mandate:0 "อาณัติ"
 game_concept_mandates:0 "อาณัติ"
 game_concept_mandate_possessive:0 "ของอาณัติ"
 game_concept_mandates_possessive:0 "ของอาณัติ"
 game_concept_mandate_desc:2 "$game_concept_mandates$ เป็นภารกิจที่มีประโยชน์ ซึ่ง [liege|E] สามารถมอบหมายให้ [diarch|E] ของตนได้เมื่อ [sharing_power|E]\n\nเช่นเดียวกับ [councillor_tasks|E] $game_concept_liege$ จะเลือก $game_concept_mandate$ แล้วค่อยๆ ได้รับผลประโยชน์จากมัน\n\nเมื่อ $game_concept_diarch$ ทำหน้าที่ได้ดี พวกเขาทั้งคู่จะแกว่ง [scales_of_power|E] มาทางตนเอง #EMP และ#! สร้าง [strife|E] กับ [vassals|E] คนอื่นๆ\n\nผลประโยชน์ที่ $game_concept_liege$ ได้รับนั้นขึ้นอยู่กับ [diarch_aptitude|E] และ [diarch_loyalty|E] ของ $game_concept_diarch_possessive$"

 game_concept_diarch_aptitude:2 "ความถนัดของผู้ปกครองร่วม"
 game_concept_diarch_aptitude_desc:2 "$game_concept_diarch_aptitude$ ควบคุมว่า [diarch|E] บรรลุ แต่ละ [mandate|E] ที่ [liege|E] มอบหมายได้ดีเพียงใด\n\nทั้ง [skills|E] และ [personality_traits|E] มีบทบาท ตัวอย่าง เช่น $game_concept_diarch$ ที่ [GetTrait('greedy').GetName(GetNullCharacter)] ซึ่งได้รับมอบหมายอาณัติ '$fill_coffers_mandate$' อาจไม่ส่ง [gold|E] ให้เจ้าเหนือหัวมากเท่าที่ควร\n\n#WEAK [diarchs|E] เหมาะสมกับ $game_concept_mandate$ เมื่อพวกเขามี $game_concept_aptitude$ ประมาณ 40+ สำหรับมัน#!"

 game_concept_diarch_loyalty:0 "ความภักดี"
 game_concept_diarch_loyalty_explicit:0 "ความภักดีของผู้ปกครองร่วม"
 game_concept_diarch_loyal:0 "ภักดี"
 game_concept_diarch_loyalty_desc:2 "$game_concept_diarch_loyalty$ ของ [diarch|E] เป็นตัวตัดสินว่าพวกเขามีแนวโน้มที่จะใช้อำนาจในทางที่ผิดมากน้อยเพียงใด โดยเป็นผลเสียต่อ [liege|E] หรือ [realm|E] ของพวกเขา\n\n$DIARCHY_WINDOW_VISIBLY_LOYAL$ $game_concept_diarchs$ จะละเว้นจากการใช้ [diarch_powers|E] พยายามปฏิบัติตาม [mandate|E] ที่มอบหมายให้อย่างเคร่งครัด และยอมสละอำนาจโดยสมัครใจเมื่อถูกร้องขอ\n\n$DIARCHY_WINDOW_VISIBLY_DISLOYAL$ $game_concept_diarchs$ ใช้ $game_concept_diarch_powers$ อย่างเสรี พยายามบรรลุ $game_concept_mandate$ ของตนเพื่อแกว่ง [scales_of_power|E] มาทางตนเอง และอาจปฏิเสธที่จะสละอำนาจหาก $game_concept_scales_of_power_scales$ เอนเอียงมาทางพวกเขามากพอ\n\n$DIARCHY_WINDOW_UNKNOWN_LOYALTY$ $game_concept_diarchs$ อาจใช้ $game_concept_diarch_powers$ โดยทั่วไปจะแบ่งผลประโยชน์จาก $game_concept_mandate$ กับ $game_concept_liege$ หรือเพิกเฉยต่อ $game_concept_mandate$ ทั้งหมด และอาจต้องติดสินบน เพื่อให้สละตำแหน่งหาก $game_concept_scales_of_power$ เหมาะสมกับพวกเขา"

 game_concept_diarch_succession:0 "การสืบทอดตำแหน่ง"
 game_concept_diarch_succession_explicit:0 "การสืบทอดตำแหน่งผู้ปกครองร่วม"
 game_concept_diarch_succession_desc:0 "$game_concept_diarch_succession_explicit$ ควบคุมว่า [vassals|E] หรือ [courtiers|E] โดยตรงคนใดของ [liege|E] จะได้รับการ แต่งตั้งเป็น [diarch|E] โดยอัตโนมัติเมื่อมีความจำเป็น\n\nสิ่งนี้เกิดขึ้น เนื่องจาก $game_concept_liege$ เริ่ม [diarchy|E] หรือ เนื่องจาก $game_concept_diarch$ คนปัจจุบันเสียชีวิตหรือถูกถอดออกจากตำแหน่ง\n\n#weak ประเภทต่างๆ ของ $game_concept_power_sharing$ อาจคำนวณลำดับการสืบทอดตำแหน่งแตกต่างกัน — ใน [regency|E] [characters|E] ที่ไม่มีที่ดินซึ่งมีความสัมพันธ์ส่วนตัวที่แน่นแฟ้นกับ $game_concept_liege$ ของพวกเขามักจะมีอำนาจเหนือกว่า\n\nการพูด [language|E] (และ [court_language|E] หากมี) ของ $game_concept_liege$ เกือบจะมีความสำคัญเสมอ#! "

 game_concept_scales_of_power:0 "ตราชูแห่งอำนาจ"
 game_concept_scales_of_power_scales:0 "ตราชู"
 game_concept_scales_of_power_desc:2 "ในระหว่าง [power_sharing|E] ดุลอำนาจระหว่าง [liege|E] และ [diarch|E] ของพวกเขาจะถูกวัดบน $game_concept_scales_of_power$\n\nเมื่อ $game_concept_scales_of_power_scales$ เอนเอียงไปทาง $game_concept_diarch$ พวกเขาจะปลดล็อก [diarch_powers|E] และอาจเพิ่มค่าใช้จ่ายให้กับ [diarch_affected_actions|E] ของเจ้าเหนือหัว\n\nเมื่อเอนเอียงไปทาง $game_concept_liege$ กลับ ทำให้เจ้าเหนือหัวสามารถยุติ [diarchy|E] ได้ง่ายขึ้น\n\n$game_concept_scales_of_power_scales$ สามารถแกว่งได้โดย:\n$EFFECT_LIST_BULLET$การใช้ [character_interaction|E] $swing_scales_currency_interaction$ ต่อต้านฝ่ายตรงข้าม\n$EFFECT_LIST_BULLET$ในฐานะ $game_concept_diarch$ การรับใช้ $game_concept_liege$ ของคุณอย่างดี (แม้จะด้วยความเห็นแก่ตัว) ในเหตุการณ์ [mandate|E]"


 game_concept_entrenched_regency:0 "การสำเร็จราชการแทนที่หยั่งรากลึก"
 game_concept_entrenched_regency_entrenched:0 "หยั่งรากลึก"
 game_concept_entrenched_regency_regency:0 "การสำเร็จราชการแทน"
 game_concept_entrenched_regent:0 "ผู้สำเร็จราชการแทนที่หยั่งรากลึก"
 game_concept_entrenched_regents:0 "ผู้สำเร็จราชการแทนที่หยั่งรากลึก"
 game_concept_entrenched_regency_entrench:0 "หยั่งราก"
 game_concept_entrenched_regencies:0 "การสำเร็จราชการแทนที่หยั่งรากลึก"
 game_concept_entrenched_regency_desc:3 "หาก [regency|E] ดำเนินไปนานเกินไป อาจกลายเป็นหยั่งรากลึก และ [regent|E] จะมีอำนาจมากยิ่งขึ้นเมื่อเทียบกับ [liege|E] ของพวกเขา\n\nผลประโยชน์ที่ [regent|E] ได้รับจาก [scales_of_power|E] จะมีพลังมากขึ้นอย่างมาก\n\nในการยุติ $game_concept_entrenched_regency$ ผู้สำเร็จราชการแทนต้องยอมรับของขวัญจากเจ้าเหนือหัว หรือเจ้าเหนือหัวต้อง ทำให้ตราชูเอนเอียงมาทางตนเอง"

 game_concept_diarch_affected_actions:0 "การกระทำทั่วไป"
 game_concept_diarch_affected_actions_desc:3 "เมื่อ [scales_of_power|E] เอนเอียงไปทาง [diarch|E] ในระหว่าง [power_sharing|E] [interactions|E] บางอย่างที่ [liege|E] กระทำอาจเริ่มมีค่าใช้จ่ายเป็น [prestige|E]\n\nการกระทำที่ได้รับผลกระทบคือ:\n$EFFECT_LIST_BULLET$การ [revoking|E] [title|E]\n$EFFECT_LIST_BULLET$การ [retracting|E] [vassal|E]\n$EFFECT_LIST_BULLET$การ [imprisoning|E] [characters|E]\n$EFFECT_LIST_BULLET$การ [executing|E] $game_concept_characters$ #weak (เว้นแต่ [faith|E] ของ $game_concept_liege$ จะมีการบูชายัญมนุษย์ในรูปแบบใดรูปแบบหนึ่ง)#!"


 ######## GRAND ACTIVITIES ETC

 game_concept_grand_activity:0 "มหากิจกรรม"
 game_concept_grand_activities:0 "มหากิจกรรม"
 game_concept_grand_activity_desc:0 "การแสดงความมั่งคั่งและความยิ่งใหญ่อันงดงาม $game_concept_grand_activities$ โดยธรรมชาติแล้วจะใหญ่กว่าและ #EMP ยิ่งใหญ่กว่า#! [activities|E] ทั่วไป อาจมีหลาย [activity_phases|E] และเสนอโอกาสในการปรับ แต่งในการวางแผนมากขึ้น\n\nการเดินทางเยือนเปิดโอกาสให้เยี่ยมเยียน [vassals|E] หลายคนใน [realm|E] ของคุณ ในขณะที่การประลองเสนอ [contests|E] ที่หลากหลายให้เป็นเจ้าภาพ"

 game_concept_special_guest:0 "แขกพิเศษ"
 game_concept_special_guests:0 "แขกพิเศษ"
 game_concept_honorary_guest:0 "แขกผู้มีเกียรติ"
 game_concept_honorary_guest_desc:0 "$honorary_guest_desc$"
 game_concept_special_guest_desc:0 "แขกพิเศษจะได้รับเกียรติเป็นพิเศษใน [grand_activities|E] ให้เกียรติใครบางคนที่ [GetActivityType( 'activity_feast' ).GetName] ของคุณ หรือเลือก $special_guest_champion$ เพื่อเป็นตัวแทนของคุณใน [GetActivityType( 'activity_tournament' ).GetName] ของคุณ!\n\nพวกเขามีแนวโน้มที่จะตอบรับคำเชิญของคุณมากขึ้น และกิจกรรมใดๆ ที่พวกเขาได้รับเชิญจะไม่เริ่มจนกว่าพวกเขาจะมาถึง"

 game_concept_contest:0 "การประลอง"
 game_concept_contests:0 "การประลอง"
 game_concept_contest_desc:3 "[GetActivityType( 'activity_tournament' ).GetName] ประกอบด้วยชุดของ $game_concept_contests$ ซึ่งเลือกโดย [activity_host|E] ซึ่ง [contest_qualifying|E] [contestants|E] สามารถแข่งขันเพื่อชิง [prizes|E] และรางวัลอื่นๆ\n\nแต่ละ $game_concept_contest$ ใช้วิธีการที่แตกต่างกันสี่วิธีในการตัดสินผู้ชนะ: [contest_category_versus|E], [contest_category_turn|E], [contest_category_team|E], และ [contest_category_race|E]\n\nโอกาสในการชนะ $game_concept_contest$ ของคุณถูกกำหนดโดย [skills|E], [traits|E], การเตรียมตัว และปัจจัยอื่นๆ สิทธิ์ในการเข้าร่วม $game_concept_contests$ ทางกายภาพถูกกำหนดโดยสุขภาพและเพศ โดยพิจารณาจาก [culture|E] และ [faith|E] ของ [activity_host|E]"
 game_concept_prize:0 "รางวัล"
 game_concept_prizes:0 "รางวัล"
 game_concept_prize_desc:4 "$game_concept_prizes$ คือ [artifacts|E] ที่มอบให้กับผู้ชนะของ [contests|E] ใน [GetActivityType( 'activity_tournament' ).GetName] ที่มีผู้ชนะเพียงคนเดียว\n\nคุณภาพของ $game_concept_prize$ ขึ้นอยู่กับตัวเลือกที่เลือกโดย [activity_host|E] และ [era|E]"
 game_concept_contest_category_team:1 "ทีม"
 game_concept_contest_category_team_desc:1 "ใน [contests|E] แบบ $game_concept_contest_category_team$ [contestants|E] ที่ [contest_qualifying|E] ทั้งหมดในทีมที่มีคะแนนรวมสูงสุดเมื่อสิ้นสุดการประลองจะได้รับรางวัล\n\nการประลองแบบ $game_concept_contest_category_team$:\n$EFFECT_LIST_BULLET$การต่อสู้ระยะประชิด"
 game_concept_contest_category_versus:1 "แพ้คัดออก"
 game_concept_contest_category_versus_desc:1 "ผู้ชนะของ [contest|E] แบบ $game_concept_contest_category_versus$ คือคนสุดท้ายที่เหลืออยู่หลังจากสาม [contest_rounds|E] ระหว่าง [contestants|E] ที่ [contest_qualifying|E]\n\nการประลองแบบ $game_concept_contest_category_versus$:\n$EFFECT_LIST_BULLET$มวยปล้ำ\n$EFFECT_LIST_BULLET$การดวล\n$EFFECT_LIST_BULLET$การประลองทวนบนหลังม้า\n$EFFECT_LIST_BULLET$เกมกระดาน"
 game_concept_contest_category_turn:1 "รอบ"
 game_concept_contest_category_turn_desc:1 "ผู้ชนะของ [contests|E] แบบ $game_concept_contest_category_turn$ คือ [contestant|E] ที่ [contest_qualifying|E] ซึ่งมีคะแนนสูงสุดเมื่อสิ้นสุดการแข่งขัน\n\nการประลองแบบ $game_concept_contest_category_turn$:\n$EFFECT_LIST_BULLET$ยิงธนู\n$EFFECT_LIST_BULLET$การขับขาน"
 game_concept_contest_category_race:0 "การแข่งขัน"
 game_concept_contest_category_race_desc:1 "ผู้ชนะของ [contests|E] แบบ $game_concept_contest_category_race$ คือ [contestant|E] ที่ [contest_qualifying|E] ซึ่งม้าที่ส่งเข้าแข่งขันได้อันดับหนึ่งเมื่อสิ้นสุดการแข่งขัน\n\nการประลองแบบ $game_concept_contest_category_race$:\n$EFFECT_LIST_BULLET$การแข่งม้า"
 game_concept_contest_round:0 "รอบการประลอง"
 game_concept_contest_rounds:0 "รอบการประลอง"
 game_concept_contest_round_desc:0 "[contests|E] แบบ [contest_category_versus|E] ตัดสินผู้ชนะโดยจับคู่ [contestants|E] ที่ [contest_qualifying|E] ทั้งหมดเข้าแข่งขันกันในรูปแบบแพ้คัดออกจนกว่าจะเหลือเพียงคนเดียว\n\nมีสามรอบ: รอบก่อนรองชนะเลิศ, รอบรองชนะเลิศ และรอบชิงชนะเลิศ"
 game_concept_contest_qualification:0 "การผ่านเข้ารอบ"
 game_concept_contest_qualify:0 "ผ่านเข้ารอบ"
 game_concept_contest_qualifier:0 "ผู้ผ่านเข้ารอบ"
 game_concept_contest_qualifiers:0 "ผู้ผ่านเข้ารอบ"
 game_concept_contest_qualifying:0 "การผ่านเข้ารอบ"
 game_concept_contest_qualifies:0 "ผ่านเข้ารอบ"
 game_concept_contest_qualification_desc:0 "แม้ว่า [GetActivityType( 'activity_tournament' ).GetName] จะดึงดูด [contestants|E] ที่มีสิทธิ์จำนวนมาก แต่มีเพียงจำนวนน้อยเท่านั้นที่จะผ่านเข้ารอบสำหรับ แต่ละ [contest|E] พร้อมโอกาสที่จะได้รับเกียรติยศและ [prize|E] ของมัน\n\nเพื่อรับประกันการผ่านเข้ารอบ [progress_to_victory|E] ของคุณต้องสูงกว่าเกณฑ์เมื่อการประลองเริ่มขึ้น"
 game_concept_contestant:0 "ผู้เข้าแข่งขัน"
 game_concept_contestants:0 "ผู้เข้าแข่งขัน"
 game_concept_contestant_desc:0 "เพื่อที่จะแข่งขันใน [contests|E] ของ [GetActivityType( 'activity_tournament' ).GetName] คุณต้องปฏิบัติตามข้อกำหนดของมัน เกมกระดานอนุญาตให้ตัวละครทั้งหมดแข่งขันได้ ในขณะที่อื่นๆ เช่น มวยปล้ำ ขึ้นอยู่กับกฎการต่อสู้\n\nตัวละครที่ไม่แข่งขันจะเป็น [spectators|E] และ [contestants|E] ที่มีศักยภาพอาจเลือกที่จะไม่เข้าร่วมหากพวกเขาต้องการชม\n\nสิทธิ์ในการเข้าร่วมการประลองถูกกำหนดโดยเพศและสุขภาพ โดยพิจารณาจาก [culture|E] และ [religion|E] ของเจ้าภาพ"
 game_concept_spectator:0 "ผู้ชม"
 game_concept_spectators:0 "ผู้ชม"
 game_concept_spectating:0 "การชม"
 game_concept_spectate:0 "ชม"
 game_concept_spectator_desc:0 "ตัวละครใดๆ ที่ไม่ได้รับอนุญาตให้แข่งขันใน [contest|E] จะ [spectate|E] แทน\n\nนอกจากนี้ยังเป็นไปได้ที่ [contestants|E] ที่มีศักยภาพจะเลือกไม่เข้าร่วมแทนที่จะแข่งขัน"

 game_concept_progress_to_victory:0 "ความคืบหน้าสู่ชัยชนะ"
 game_concept_progress_to_victory_desc:1 "ภาพรวมของความเป็นไปได้ที่คุณจะชนะ [contest|E] ที่กำหนดเมื่อเทียบกับผู้เข้าแข่งขันคนอื่นๆ โดยพิจารณาจาก [skills|E], [health|E], และ [traits|E] ของคุณ ตัวอย่าง เช่น [GetTrait('giant').GetName( GetNullCharacter )] ที่มี [prowess|E] สูงมีความได้เปรียบในการประลองทางกายภาพที่ต่อสู้บนพื้น เช่น มวยปล้ำ\n\nต้องมี $game_concept_progress_to_victory$ ขั้นต่ำเพื่อรับประกัน [contest_qualification|E] สำหรับ [contest|E] เยี่ยมชม [locales|E] เพื่อโอกาสในการปรับปรุงโอกาสของคุณและก่อวินาศกรรมคู่ต่อสู้ของคุณ\n\n#V กระดานผู้นำ#! การประลองแสดง $game_concept_progress_to_victory$ ปัจจุบันของผู้เข้าแข่งขันทั้งหมด"
 game_concept_progress_to_victory_locale_tt:0 "เยี่ยมชม [locales|E] เพื่อโอกาสในการปรับปรุงโอกาสของคุณหรือก่อวินาศกรรมคู่ต่อสู้ของคุณ"
 
 game_concept_contest_aptitude:0 "ความถนัดในการประลอง"
 game_concept_contest_aptitude_desc:0 "[contests|E] ที่แตกต่างกันต้องการความสามารถที่แตกต่างกัน: การต่อสู้บนพื้น, บนหลังม้า, ธนู, ปัญญา หรือการผสมผสาน\n\nความถนัดของคุณได้มาจาก [skills|E], [health|E], [traits|E], และ [trait_level_track_xp|E] ของ [GetTrait('tourney_participant').GetName( GetNullCharacter )]\n\nตัวอย่าง เช่น [GetTrait('giant').GetName( GetNullCharacter )] ที่มี [prowess|E] สูงมีความได้เปรียบโดยธรรมชาติในการประลองมวยปล้ำ"

 game_concept_locale:0 "สถานที่"
 game_concept_locales:0 "สถานที่"
 game_concept_locale_desc:3 "คุณอาจเลือกวิธีสำรวจ [GetActivityType( 'activity_tournament').GetName] ในขณะที่ [contests|E] กำลังเตรียมการ\n\nแต่ละสถานที่มีโอกาสในการเข้าสังคมกับแขก ปรับปรุง [progress_to_victory|E] หรือก่อวินาศกรรม [contestants|E]\n\nหากไม่ได้เลือกสถานที่ คุณจะเยี่ยมชมสถานที่หนึ่งแบบสุ่มหลังจากช่วงเวลาสั้นๆ"

 game_concept_travel:0 "การเดินทาง"
 game_concept_travels:0 "การเดินทาง"
 game_concept_traveling:0 "กำลังเดินทาง"
 game_concept_traveled: "เดินทางแล้ว"
 game_concept_travel_desc:0 "$game_concept_travel$ เป็นวิธีการที่ [character|E] เดินทางจาก [location|E] หนึ่งไปยังอีกที่หนึ่ง โดยหลักแล้วเพื่อเข้าร่วม [activities|E]\n\nมีหลายวิธีในการวางแผนการเดินทางของคุณ เช่น การเลือก [GetCourtPositionType('travel_leader_court_position').GetName()] เพื่อจ้าง การเลือก [travel_options|E] และการปรับ แต่งเส้นทางของคุณ คุณจะได้พบกับตัวละครที่น่าสนใจมากมายตามเส้นทางของคุณ แต่ระวัง [travel_danger|E] ที่อาจรออยู่"
 game_concept_travel_option:0 "ตัวเลือกการเดินทาง"
 game_concept_travel_options:0 "ตัวเลือกการเดินทาง"
 game_concept_travel_option_desc:0 "ตัวเลือกที่คุณเลือกเมื่อวางแผน [travel|E] ของคุณเพื่อปรับปรุงหรือแก้ไขการเดินทางที่คุณกำลังจะออกเดินทาง"
 game_concept_travel_danger:0 "อันตราย"
 game_concept_travel_danger_i: "@travel_danger_icon!"
 game_concept_travel_danger_desc:0 "ในการ [travels|E] ของคุณ คุณอาจผ่านดินแดนอันตราย เช่น ทะเลทรายหรือหนองน้ำ ที่อาจขัดขวางการเดินทางของคุณ\n\nคุณสามารถลดความเสี่ยงของอันตรายได้โดยการปรับปรุง [travel_safety|E] ของคุณ คุณทำสิ่งนี้โดยการลงทุนใน [travel_options|E] หรือโดยการจ้าง [GetCourtPositionType('travel_leader_court_position').GetName()]\n\n[culture_traditions|E] หลายอย่างลดหรือขจัดความเสี่ยงของอันตรายบางประเภท"
 game_concept_travel_safety:0 "ความปลอดภัย"
 game_concept_travel_safety_desc:0 "การมีค่าความปลอดภัยสูงจะช่วยให้คุณหลีกเลี่ยง [travel_danger|E] ในระหว่างการ [travels|E] ของคุณ ความปลอดภัยของคุณได้รับผลกระทบจาก [skills|E] ของคุณ เช่นเดียวกับของ [GetCourtPositionType('travel_leader_court_position').GetName()] ของคุณ\n\n$min_travel_contribution$"
 game_concept_travel_speed:0 "ความเร็ว"
 game_concept_travel_speed_desc:0 "การมีความเร็วสูงขณะ [traveling|E] จะช่วยให้คุณไปถึงจุดหมายได้เร็วขึ้น ความเร็วของคุณได้รับผลกระทบจาก [skills|E] ของคุณ เช่นเดียวกับของ [GetCourtPositionType('travel_leader_court_position').GetName()] ของคุณ\n\n$min_travel_contribution$"
 game_concept_entourage:0 "คณะผู้ติดตาม"
 game_concept_entourage_desc:0 "การเดินทางคนเดียวเป็นอันตราย ดังนั้นคุณควรนำสหายบางคนมาในคณะผู้ติดตามของคุณ ทุกคนที่ [travels|E] กับคุณเป็นส่วนหนึ่งของคณะผู้ติดตามของคุณและร่วมเผชิญกับความท้าทายที่คุณอาจเผชิญในการเดินทางของคุณ\n\n[GetCourtPositionType('travel_leader_court_position').GetName()] ของคุณคือผู้นำของคณะผู้ติดตามและจัดการแผนการเดินทางของคุณ\n\n[characters|E] บางคนจะถูกเพิ่มเข้าไปในคณะผู้ติดตามของคุณโดยค่าเริ่มต้นเมื่อวางแผนการเดินทาง [travel_options|E] และ [activity_options|E] เสนอวิธีเพิ่มเติมในการเพิ่มตัวละคร"
 min_travel_contribution: "การมีส่วนร่วมของ [character_possessive|lE] ไม่สามารถต่ำกว่า #HIGH 0#! ได้"

 game_concept_point_of_interest:0 "จุดน่าสนใจ"
 game_concept_points_of_interest: "จุดน่าสนใจ"
 game_concept_point_of_interest_desc:0 "$game_concept_point_of_interest$ คือสถานที่ในโลกที่ควรค่าแก่การเยี่ยมชม เมื่อคุณเยี่ยมชมสถานที่นั้นเป็นครั้งแรก คุณจะได้รับผลประโยชน์ที่เกี่ยวข้องกับมัน"

 game_concept_vassal_stance:0 "ท่าทีของข้าหลวง"
 game_concept_vassal_stances:0 "ท่าทีของข้าหลวง"
 game_concept_preferred_heir:0 "ทายาทที่พึงประสงค์"
 game_concept_unpreferred_heir:0 "ทายาทที่ไม่พึงประสงค์"
 game_concept_preferred_heirs:0 "ทายาทที่พึงประสงค์"
 game_concept_unpreferred_heirs:0 "ทายาทที่ไม่พึงประสงค์"
 game_concept_vassal_stance_desc:1 "[vassal|E] ทุกคนมีท่าทีของข้าหลวง ซึ่งส่งผลต่อ [opinion|E] ที่พวกเขามีต่อคุณในฐานะ [liege|E] ของพวกเขา และ [heir|E] คนใดที่พวกเขาต้องการให้เป็นผู้สืบทอด [realm|E]\n\nข้าหลวงที่มีท่าทีเดียวกันจะชอบและไม่ชอบสิ่งเดียวกัน ตัวอย่าง เช่น; ข้าหลวง [GetVassalStance( 'glory_hound' ).GetTextIcon][GetVassalStance( 'glory_hound' ).GetName] ทั้งหมดไม่ชอบเมื่อคุณแพ้ [wars|E]\n\nทุกท่าทีของข้าหลวงจะชอบทายาทที่เฉพาะเจาะจงคนหนึ่ง เมื่อมีการสืบทอดตำแหน่ง ทายาทที่พึงประสงค์ แต่ละคนจะมีความคาดหวัง [legitimacy_expectations|E] ที่ต่ำกว่ากับข้าหลวงที่มีท่าทีนั้น\n\n#low ท่าทีของข้าหลวงคือ:#!\n$EFFECT_LIST_BULLET$[GetVassalStance( 'courtly' ).GetTextIcon][GetVassalStance( 'courtly' ).GetName]\n$EFFECT_LIST_BULLET$[GetVassalStance( 'parochial' ).GetTextIcon][GetVassalStance( 'parochial' ).GetName]\n$EFFECT_LIST_BULLET$[GetVassalStance( 'glory_hound' ).GetTextIcon][GetVassalStance( 'glory_hound' ).GetName]\n$EFFECT_LIST_BULLET$[GetVassalStance( 'zealot' ).GetTextIcon][GetVassalStance( 'zealot' ).GetName]\n$EFFECT_LIST_BULLET$[GetVassalStance( 'minority' ).GetTextIcon][GetVassalStance( 'minority' ).GetName]\n$EFFECT_LIST_BULLET$[GetVassalStance( 'barons_and_minor_landholders' ).GetTextIcon][GetVassalStance( 'barons_and_minor_landholders' ).GetName]"
 
 game_concept_personality_i:0 "@personality_icon!"
 game_concept_warlike_i:0 "@warlike_icon!"
 game_concept_unpredictable_i:0 "@unpredictable_icon!"
 game_concept_cautious_i:0 "@cautious_icon!"
 game_concept_builder_i:0 "@builder_icon!"
 game_concept_conqueror_i: "@conqueror_icon!"
 game_concept_pious_builder_i: "@pious_builder_icon!"
 game_concept_ai_pious_builder_personality: "นักสร้างผู้ศรัทธา"
 game_concept_ai_pious_builder_personality_desc: "$game_concept_ai_pious_builder_personality$ ต้องการลงทุน [gold|E] ทั้งหมดของตนเพื่อเพิ่ม [piety|E]\n\nพวกเขาจะใช้จ่ายคลังของตนเพื่อสนับสนุน [buildings|E] ทางศาสนาและพิธีกรรม [great_projects|E] [activities|E] และ [decisions|E] และมักจะสร้าง [pious_buildings|E] และ [holdings|E] [temple|E] หรือ [temple_citadel|E] มากขึ้น พวกเขาจะเก็บทองไว้ก็ต่อเมื่อถูกคุกคามโดยตรง เช่น จาก [faction|E] ที่แข็งแกร่ง\n\nเหล่า $game_concept_ai_pious_builder_personality$ มีแนวโน้มที่จะสร้างและส่งเสริม [legends|E] อันศักดิ์สิทธิ์\n\n[rulers|E] [AddLocalizationIf( HasDlcFeature( 'all_under_heaven' ), 'game_concept_ai_pious_builder_personality_desc_or_mandala' )] ผู้กระตือรือร้นที่มีใจรักใน [virtue|E] และไม่มีแนวโน้มเฉพาะสำหรับ [war|E] มักจะเป็น $game_concept_ai_pious_builder_personality$s\nลักษณะนิสัยทั่วไป ได้แก่ [GetTrait('zealous').GetName( GetNullCharacter )], [GetTrait('forgiving').GetName( GetNullCharacter )], [GetTrait('improvident').GetName( GetNullCharacter )], [GetTrait('humble').GetName( GetNullCharacter )], [GetTrait('patient').GetName( GetNullCharacter )], [GetTrait('diligent').GetName( GetNullCharacter )] และ [GetTrait('generous').GetName( GetNullCharacter )] ผู้ปกครองที่มี [GetFocus('learning_theology_focus').GetName] ก็มักจะเป็น $game_concept_ai_pious_builder_personality$s เช่นกัน"
 game_concept_ai_pious_builder_personality_desc_or_mandala: "หรือ [mandala|E] "
 game_concept_ai_warlike_personality:0 "ชอบสงคราม"
 game_concept_ai_warlike_personality_desc: "[ruler|E] $game_concept_ai_warlike_personality$ ต้องการเตรียมพร้อมที่จะประกาศ [war|E] เสมอ พวกเขาจะเก็บ [gold|E] ไว้สำหรับ [war|E] ก่อนที่จะลงทุนในการพัฒนา [realm|E] ของตน หากผู้ปกครอง $game_concept_ai_warlike_personality$ อยู่ในความสงบเป็นระยะเวลานาน พวกเขาจะใช้ทองในหีบสงครามเพื่อสร้าง [buildings|E]\n\nเหล่าผู้ปกครอง $game_concept_ai_warlike_personality$ มีแนวโน้มที่จะสร้างและส่งเสริม [legends|E] แห่งวีรบุรุษ\n\nผู้ปกครองที่กล้าหาญและโลภมักจะเป็นนักรบ\nลักษณะนิสัยทั่วไป ได้แก่ [GetTrait('wrathful').GetName( GetNullCharacter )], [GetTrait('impatient').GetName( GetNullCharacter )], [GetTrait('sadistic').GetName( GetNullCharacter )], [GetTrait('ambitious').GetName( GetNullCharacter )], [GetTrait('vengeful').GetName( GetNullCharacter )], [GetTrait('irritable').GetName( GetNullCharacter )] และ [GetTrait('zealous').GetName( GetNullCharacter )]"
 game_concept_ai_cautious_personality:0 "ระมัดระวัง"
 game_concept_ai_cautious_personality_desc: "[ruler|E] $game_concept_ai_cautious_personality$ ต้องการเตรียมพร้อมสำหรับ [war|E] ที่จะประกาศต่อตน พวกเขาค่อนข้างไม่ชอบการประกาศ [war|E] เชิงรุก แต่นิยมการสั่งสมกำลังอย่างช้า ๆ พวกเขาเก็บ [gold|E] สำรองไว้เพื่อช่วยป้องกันตนเอง และลงทุนใน [buildings|E] และ [men_at_arms|E] เพื่อช่วยให้พวกเขารู้สึกปลอดภัย\n\nเหล่าผู้ปกครอง $game_concept_ai_cautious_personality$ มีแนวโน้มที่จะสร้างและส่งเสริม [legends|E] น้อยกว่า\n\nผู้ปกครองที่สงวนท่าทีและระมัดระวังมักจะเป็น $game_concept_ai_cautious_personality$\nลักษณะนิสัยทั่วไป ได้แก่ [GetTrait('patient').GetName( GetNullCharacter )], [GetTrait('calm').GetName( GetNullCharacter )], [GetTrait('craven').GetName( GetNullCharacter )], [GetTrait('paranoid').GetName( GetNullCharacter )] และ [GetTrait('content').GetName( GetNullCharacter )] พวกเขาจะไม่มีวันเป็น [GetTrait('fickle').GetName( GetNullCharacter )]"
 game_concept_ai_conqueror_personality: "ผู้พิชิต"
 game_concept_ai_conquerors_personality: "ผู้พิชิต"
 game_concept_ai_conqueror_personality_desc: "$game_concept_ai_conqueror_personality$ ต้องการขยาย [realm|E] ของตนผ่าน [war|E] ไม่ว่าจะต้องแลกด้วยอะไรก็ตาม พวกเขาจะลงทุน [gold|E] ทั้งหมดใน [war_chest|E] หรือเพื่อซื้อ [men_at_arms|E]\n\nพวกเขามีแนวโน้มที่จะประกาศ [wars|E] มากกว่าปกติ และเป็น [allies|E] ที่ค่อนข้างไม่น่าไว้วางใจ พวกเขาสละความสุขเล็กๆ น้อยๆ ส่วนใหญ่ในชีวิต เช่น การเป็นเจ้าภาพหรือไป [activities|E] และการสนับสนุน [inspirations|E] — เพื่อเก็บ [gold|E] ไว้บดขยี้ศัตรู พวกเขาจะใช้กิจกรรมเพียงเพื่อได้รับ [prestige|E] และ [piety|E] เพียงพอที่จะทำสงคราม\n\n[ruler|E] ใดๆ ที่ไม่ใช่ [ai_cautious_personality|E] มีศักยภาพที่จะกลายเป็น $game_concept_ai_conqueror_personality$ แต่โดยปกติแล้วจะมีผู้ปกครองไม่เกินหยิบมือทั่วโลกที่มีลักษณะนี้"
 game_concept_ai_economical_boom_personality:0 "นักสร้าง"
 game_concept_ai_economical_boom_personality_desc: "$game_concept_ai_economical_boom_personality$ ต้องการลงทุน [gold|E] ทั้งหมดของตนใน [realm|E] พวกเขาจะใช้คลังจนหมดเพื่อสนับสนุน [buildings|E] และ [men_at_arms|E] และมักจะสร้าง [economic_buildings|E] และ [holdings|E] มากขึ้น พวกเขาจะเก็บทองไว้ก็ต่อเมื่อถูกคุกคามโดยตรง เช่น จาก [faction|E] ที่แข็งแกร่ง\n\nเหล่าผู้ปกครอง $game_concept_ai_economical_boom_personality$ มีแนวโน้มที่จะสร้างและส่งเสริม [legends|E] น้อยกว่าเล็กน้อย\n\nผู้ปกครองที่กล้าหาญ ซึ่งมีแนวโน้มในการก่อสร้างและไม่มีแนวโน้มเฉพาะสำหรับ [war|E] มักจะเป็น $game_concept_ai_economical_boom_personality$s\nลักษณะนิสัยทั่วไป ได้แก่ [GetTrait('calm').GetName( GetNullCharacter )], [GetTrait('patient').GetName( GetNullCharacter )], [GetTrait('diligent').GetName( GetNullCharacter )], [GetTrait('generous').GetName( GetNullCharacter )], [GetTrait('stubborn').GetName( GetNullCharacter )] และ [GetTrait('profligate').GetName( GetNullCharacter )] ผู้ปกครองที่มี [GetFocus('stewardship_domain_focus').GetName] ก็มักจะเป็น $game_concept_ai_economical_boom_personality$s เช่นกัน"
 game_concept_ai_economical_unpredictable_personality:0 "คาดเดาไม่ได้"
 game_concept_ai_economical_unpredictable_personality_desc: "[ruler|E] ที่มี $game_concept_ai_economical_unpredictable_personality$ จะไม่มี [traits|E] ที่ผลักดันพวกเขาไปยังรูปแบบเศรษฐกิจเบื้องต้นที่เฉพาะเจาะจงใดๆ และอาจตัดสินใจใช้กลยุทธ์ใดก็ได้\n\nพวกเขาอาจเลือกลงทุนชั่วคราวอย่างหนักหน่วงใน [buildings|E] ราวกับ [ai_economical_boom_personality|E] หรือสร้าง [realm|E] ของพวกเขาอย่างช้าๆ โดยอาศัย [gold|E] สำรอง พวกเขาจะเข้าสู่ [war|E] ด้วยความถี่ในระดับปกติ"

 game_concept_trait_level_track:1 "เส้นทางลักษณะนิสัย"
 game_concept_trait_level_track_desc:1 "[traits|E] บางประเภทมีทางเลือกหลายเส้นทาง ซึ่งแต่ละเส้นทางจะเปลี่ยนแปลงลักษณะนิสัยไปในทางที่ต่างกัน\n\nจำเป็นต้องได้รับ [trait_level_track_xp|E] เพื่อก้าวลึกลงไปในเส้นทางนั้นๆ"
 game_concept_trait_level_track_xp:1 "ประสบการณ์ลักษณะนิสัย"
 game_concept_trait_level_track_xp_desc:1 "จำเป็นต้องมีประสบการณ์เพื่อก้าวลึกลงไปใน [trait_level_track|E] และเปลี่ยนแปลงโบนัสที่ [trait|E] นั้นมอบให้"
 
 game_concept_hunt_sighting:0 "การพบเห็นในการล่าสัตว์"
 game_concept_hunt_sightings:0 "การพบเห็นในการล่าสัตว์"
 game_concept_hunt_sighting_no_prefix:0 "การพบเห็น"
 game_concept_hunt_sightings_no_prefix:0 "การพบเห็น"
 game_concept_hunt_sighting_desc:0 "$game_concept_hunt_sighting$ คือรายงานการพบเห็นสัตว์ที่มีชื่อเสียงเฉพาะใน [county|E] ซึ่งอาจถูกไล่ล่าใน [GetActivityType('activity_hunt').GetName] ที่จัดขึ้นที่นั่น\n\n[court_position|E] [GetCourtPositionType('master_of_hunt_court_position').GetName()] จะค้นหา $game_concept_hunt_sightings_no_prefix$"

 
 game_concept_stationed_regiment:0 "กองทหารประจำการ"
 game_concept_stationed_regiment_desc:0 "[regiment|E] [men_at_arms|E] ได้รับโบนัสประสิทธิภาพโดยการประจำการใน [holding|E]\n\n[buildings|E] สามารถเพิ่มโบนัสเหล่านี้ได้อีก — บางครั้งสำหรับทหารอาชีพประเภทใดก็ได้ แต่ส่วนใหญ่มักจะเป็นสำหรับหนึ่งหรือสองประเภท ตัวอย่าง เช่น [GetBuilding('stables_01').GetName] ให้โบนัสแก่ [light_cavalry|E] และ [heavy_cavalry|E] ที่ประจำการ\n\nคุณสามารถประจำการได้ตลอดเวลายกเว้นในช่วง [war|E] หรือหากที่ดินถือครองถูก [occupied|E] หากที่ดินถือครองสูญหาย ทหารอาชีพที่ประจำการอยู่จะถูกยกเลิกการประจำการ"
