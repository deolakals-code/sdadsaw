 game_concept_exceptional_epic:0 "มหากาพย์ยอดเยี่ยม"
 game_concept_exceptional_epic_desc:0 "มหากาพย์ตระกูลที่เขียนขึ้นผ่านการตัดสินใจ $commission_epic_decision$ มีโอกาสที่จะเป็นมหากาพย์ยอดเยี่ยม ซึ่งมอบโบนัสที่มากกว่ามหากาพย์ปกติ\n\nโอกาสที่มหากาพย์จะเป็นมหากาพย์ยอดเยี่ยมอาจได้รับผลกระทบจากตัวเลือกในเหตุการณ์"

 game_concept_demand_payment:0 "เรียกร้องการชำระเงิน"
 game_concept_demand_payment_decision:0 "ปฏิสัมพันธ์เรียกร้องการชำระเงิน"
 game_concept_demand_payment_desc:0 "ปฏิสัมพันธ์ทางการทูตที่อนุญาตให้ตัวละครเรียกร้องการชำระเงินเป็น [gold|E] เพื่อแลกกับ [hooks|E] ใด ๆ ที่พวกเขามี"

 game_concept_independence_faction:0 "กลุ่มเรียกร้องเอกราช"
 game_concept_independence_factions:0 "กลุ่มเรียกร้องเอกราช"
 game_concept_faction_independence:0 "เอกราช"
 game_concept_independence_faction_desc:1 "$game_concept_independence_faction$ แสวงหาเอกราชสำหรับสมาชิกทั้งหมด หากสำเร็จ พวกเขาจะกลายเป็น [independent|E] จาก [liege|E] ของพวกเขา"

 game_concept_liberty_faction:0 "$liberty_faction$"
 game_concept_faction_liberty:0 "เสรีภาพ"
 game_concept_liberty_factions:0 "กลุ่มเรียกร้องเสรีภาพ"
 game_concept_liberty_faction_desc:1 "$game_concept_liberty_faction$ พยายามลด [crown_authority|E] และหากมีผลบังคับใช้ [vassal_contracts|E] ของตนเอง หากประสบความสำเร็จ [liege|E] ของพวกเขาจะไม่สามารถเปลี่ยนแปลงอำนาจกษัตริย์ของ [realm|E] ได้เป็นเวลาหนึ่ง"

 game_concept_claimant_faction:0 "$claimant_faction$"
 game_concept_claimant_factions:0 "กลุ่มผู้เรียกร้องสิทธิ์"
 game_concept_claimant_faction_desc:1 "$game_concept_claimant_faction$ พยายามที่จะ แต่งตั้ง [claimant|E] คนใดคนหนึ่งขึ้นครองบัลลังก์ของ [title|E] ที่ [liege|E] ของพวกเขาถือครองอยู่ หากประสบความสำเร็จ เจ้าเหนือหัวจะต้องสละบรรดาศักดิ์ให้แก่ผู้เรียกร้องสิทธิ์ และโครงสร้าง [vassal|E] จะได้รับการปรับปรุงตามนั้น สมาชิก [faction|E] ทุกคนจะได้รับ [hook|E] ต่อผู้เรียกร้องสิทธิ์"

 game_concept_peasant_faction:0 "$peasant_faction$"
 game_concept_peasant_factions:0 "กลุ่มชาวนา"
 game_concept_peasant_faction_desc:2 "$game_concept_peasant_faction$ ประกอบด้วย [counties|E] ที่มี [county_opinion|E] ต่ำ ซึ่งแตกต่างจาก [factions|E] อื่นๆ ฝ่ายนี้จะก่อกบฏเสมอ แม้ว่า [faction_military_power|E] จะต่ำ เนื่องจากชาวนาโดยทั่วไปมองโลกในแง่ดีและไม่รู้หนังสือ... การปฏิวัติของชาวนาที่ประสบความสำเร็จจะลดการควบคุมใน [realm|E] ของท่านลงอย่างมาก"

 game_concept_escalated_peasant_faction: "ขยาย $peasant_faction$"
 game_concept_escalated_peasant_factions: "ฝ่ายชาวนาที่ขยายตัว"
 game_concept_escalated_peasant_faction_desc: "$game_concept_escalated_peasant_faction$ ประกอบด้วย [counties|E] ที่มี [county_opinion|E] ต่ำ ซึ่งได้บังคับใช้ข้อเรียกร้องของ [peasant_faction|E] ต่อ [vassals|E] ของท่านไปแล้ว ฝ่ายนี้นำโดยผู้นำที่น่าอับอาย เป็นอันตรายและสามารถแยกตัวออกจาก [realm|E] ของท่านได้"

 game_concept_popular_faction:0 "$populist_faction$"
 game_concept_popular_factions:0 "กลุ่มประชานิยม"
 game_concept_popular_faction_desc:0 "$game_concept_popular_faction$ ประกอบด้วย [counties|E] ที่มี [county_opinion|E] ต่ำ ซึ่งมีองค์ประกอบร่วมกัน เช่น [culture|E] หรือ [faith|E] พวกเขาพยายามที่จะแยกตัวออกเป็นอิสระ และเลือก [ruler|E] ใหม่ตามวัฒนธรรมหรือศรัทธาของพวกเขา การลุกฮือประเภทนี้โดยทั่วไปแล้วอันตรายมาก"

 game_concept_buy_claim:0 "$buy_claim_interaction$"
 game_concept_buy_claim_interaction:0 "ปฏิสัมพันธ์ $buy_claim_interaction$"
 game_concept_buy_claim_desc:2 "ปฏิสัมพันธ์ที่อนุญาตให้ตัวละครซื้อ [unpressed_claims|E] เพื่อแลกกับค่า [piety|E]\n\n$EFFECT_LIST_BULLET$[vassal|E] ไม่สามารถซื้อสิทธิ์เรียกร้องใน [title|E] ใด ๆ ของ [liege|E] ได้ และเจ้าเหนือหัวไม่สามารถซื้อสิทธิ์เรียกร้องในตำแหน่งใด ๆ ของข้าหลวงได้\n$EFFECT_LIST_BULLET$[king|E] หรือ [emperor|E] ไม่สามารถซื้อสิทธิ์เรียกร้องในตำแหน่งราชอาณาจักรได้ และจักรพรรดิไม่สามารถซื้อสิทธิ์เรียกร้องในจักรวรรดิอื่นได้\n$EFFECT_LIST_BULLET$ไม่มีใครสามารถซื้อสิทธิ์เรียกร้องต่อ [head_of_faith|E] ของตนได้"

 game_concept_develop_county:0 "$task_develop_county$"
 game_concept_develop_county_desc:0 "[councillor_task|E] ที่ดำเนินการโดย [steward|E] กำหนดเป้าหมายไปที่ [county|E] ซึ่งจะเร่ง [development_growth|E] และลดเวลาในการก่อสร้าง [buildings|E]"
 
 game_concept_convince_dejure:0 "$task_convince_dejure$"
 game_concept_convince_dejure_desc:0 "[councillor_task|E] ที่ดำเนินการโดย [steward|E] กำหนดเป้าหมายไปที่ [county|E] [de_jure|E] ของ [liege|E] ของที่ปรึกษา ซึ่งเป็นเจ้าของโดย [ruler|E] [independent|E] เมื่อเคาน์ตีถูกโน้มน้าว พวกเขาจะขอให้ [ruler|E] ของตนปล่อยพวกเขาไปยัง [liege|E] [de_jure|E] ของพวกเขา"

 game_concept_organize_levies: "$task_organize_levies$"
 game_concept_organize_levies_desc: "[councillor_task|E] ที่ดำเนินการโดย [marshal|E] เพิ่มขนาด [garrison|E] และอัตราการเสริมกำลัง [levy|E] ใน [realm|E] ของ [liege|E] ของที่ปรึกษา"

 game_concept_hostile_army:0 "เป็นปฏิปักษ์"
 game_concept_hostile_army_desc:0 "[army|E] $game_concept_hostile_army$ สามารถเข้าปะทะได้เสมือนว่าท่านกำลังทำ [war|E] กับเจ้าของ แม้ว่าจะไม่มีการให้ [war_score|E] ก็ตาม\n\nความเป็นปฏิปักษ์เกิดจากการที่ท่านมีผลประโยชน์ขัดแย้งกัน รวมถึง:\n$BULLET_WITH_TAB$ศัตรูของ [liege|E] ของท่าน\n$BULLET_WITH_TAB$[vassals|E] ของศัตรูของท่าน\n$BULLET_WITH_TAB$ผู้ปกครองที่ #emphasis โจมตี#! ศัตรูคนเดียวกัน"

 game_concept_war_leaders:0 "ผู้นำสงคราม"
 game_concept_war_leader:0 "ผู้นำสงคราม"
 game_concept_war_leaders_desc:0 "ผู้โจมตีหลักและผู้ป้องกันหลักของ [war|E] โดยปกติแล้วคือตัวละครที่ริเริ่มสงคราม และ [top_liege|E] ของตัวละครที่เป็นเจ้าของ [war_target|E]\n\nมี [casus_belli|E] ที่หลากหลายสำหรับสงครามประเภทต่างๆ มากมาย บางประเภทมีตัวละครที่แตกต่างกันเป็น $game_concept_war_leaders$"

 game_concept_offensive_war_opinion:0 "ความเห็นต่อสงครามรุกราน"
 game_concept_offensive_war_opinion_short:0 "สงครามรุกราน"
 game_concept_offensive_war_opinion_desc:0 "การเป็นผู้โจมตีหลักในสงครามจะค่อยๆ ทำให้ [vassals|E] ของท่านไม่พอใจหลังจากผ่านไป [GetDefine('NCharacterOpinion', 'OFFENSIVE_WAR_PENALTY_GRACE_PERIOD')] เดือน [civil_wars|E] และ [great_holy_wars|E] จะไม่ถูกนับรวมในกรณีนี้ เมื่อไม่ได้อยู่ในสงครามดังกล่าวอีกต่อไป บทลงโทษจะค่อยๆ ลดลง"
 
 game_concept_at_peace_opinion:0 "ความเห็นต่อภาวะสันติ"
 game_concept_at_peace_opinion_short:0 "อยู่ในภาวะสันติ"
 game_concept_at_peace_opinion_desc:1 "ตัวละครที่มี [core_tenet|E] [GetFaithDoctrine('tenet_warmonger').GetBaseName] เป็นส่วนหนึ่งของ [faith|E] ของพวกเขา จะมี '$game_concept_at_peace_opinion$' แทนที่จะเป็นบทลงโทษ [offensive_war_opinion|E]\n\nหากท่านอยู่ในภาวะสันตินานเกินไป [vassals|E] ของท่านจะคิดว่าท่าน #weak (หากพวกเขานับถือศรัทธาเดียวกับท่าน)#!"

 game_concept_character:0 "ตัวละคร"
 game_concept_characters:0 "ตัวละคร"
 game_concept_character_possessive:0 "ของตัวละคร"
 game_concept_characters_possessive:0 "ของตัวละคร"
 game_concept_character_desc:0 "ตัวละครอาจเป็น [noble|E] หรือ [lowborn|E], [landed|E] หรือ [unlanded|E] แต่ละคนมีชุด [skills|E] และ [traits|E] เป้าหมาย และความทะเยอทะยานของตนเอง พวกเขามาในรูปแบบของ [rulers|E], [courtiers|E] และ [guests|E] ตราบใดที่พวกเขาอยู่ใน [diplomatic_range|E] ก็สามารถมีปฏิสัมพันธ์ด้วยได้"

 game_concept_highlighted_text:0 "ข้อความเน้น"
 game_concept_highlighted_text_desc:0 "ข้อมูลนี้มีไว้สำหรับท่าน เมื่อใดก็ตามที่ท่านไม่แน่ใจเกี่ยวกับแนวคิดของเกม\n\n#TUT ท่านยังสามารถเลื่อนเคอร์เซอร์เข้าไปใน #EMP คำแนะนำเครื่องมือ#! นี้เพื่อดูข้อมูลเพิ่มเติมได้อีกด้วย! [highlighted_text_example|E]#!"
 game_concept_highlighted_text_example:0 "ยอดเยี่ยม!"
 game_concept_highlighted_text_example_desc:0 "ทำได้ดีมาก!"
 
 game_concept_detail_zoom:1 "$ZOOM_LEVEL_DETAILS$"
 game_concept_detail_zoom_desc:1 "$ZOOM_LEVEL_DETAILS_TOOLTIP$"
 game_concept_political_zoom:0 "$ZOOM_LEVEL_POLITICAL$"
 game_concept_political_zoom_desc:0 "$ZOOM_LEVEL_POLITICAL_TOOLTIP$"
 game_concept_paper_zoom:0 "$ZOOM_LEVEL_PAPER_MAP$"
 game_concept_paper_zoom_desc:0 "$ZOOM_LEVEL_PAPER_MAP_TOOLTIP$"

 game_concept_tutorial_education_trait:0 "ลักษณะนิสัยทางการศึกษา"
 game_concept_tutorial_education_trait_i:0 "@tutorial_education_trait_icon!"
 game_concept_tutorial_education_trait_desc:0 "เจ้าผู้ครองแคว้นเมอร์ชาด ( [character|E] ของท่าน) ได้รับ [education|E] ด้าน [martial|E] เมื่อถึงวัยผู้ใหญ่ เขาได้รับลักษณะ นักวางยุทธวิธีผู้ชำนาญ"

 game_concept_organized:0 "เป็นระบบ"
 game_concept_organized_desc:0 "[faith|E] ที่เป็นระบบจะมีลำดับชั้นทางศาสนา การบูชาและการปฏิบัติจะมีการจัดระเบียบมากขึ้น และคัมภีร์ต่างๆ จะถูกกำหนดเป็นแบบแผน\n\nศรัทธา [GetReligionFamily('rf_pagan').GetName] ที่ [GetFaithDoctrine('unreformed_faith_doctrine').GetBaseName] สามารถกลายเป็นศรัทธาที่เป็นระบบได้โดยการปฏิรูป ในขณะที่ศรัทธาอื่นๆ จะถือว่าเป็นระบบอยู่เสมอ"

 game_concept_flowery_war:0 "การปล้นเพื่อจับเชลย"
 game_concept_flowery_wars:0 "การปล้นเพื่อจับเชลย"
 game_concept_flowery_warring:0 "การปล้นเพื่อจับเชลย"
 game_concept_flowery_war_desc:1 "นี่คือประเภทพิเศษของ [war|E] ซึ่งริเริ่มโดย [ruler|E] ที่ [faith|E] ของตนมีการบูชายัญมนุษย์ เป้าหมายหลักของ $game_concept_flowery_warring$ คือการทำศึกและจับ [prisoners|E] เพื่อนำไปบูชายัญ โดยฝ่ายใดฝ่ายหนึ่งสามารถได้รับ [war_score|E] เพียงพอจากการรบเพื่อชนะโดยไม่จำเป็นต้อง [siege|E] เลย\n\nเมื่อสิ้นสุด $game_concept_war$ หากผู้ชนะ ( รวมถึงผู้ป้องกัน) นับถือ $game_concept_faith$ ที่มีการบูชายัญมนุษย์ พวกเขาจะจับ $game_concept_prisoners$ หลายคนจาก [court|E] ของผู้แพ้ หากคู่สงครามหลักทั้งสองใน $game_concept_flowery_war$ นับถือศรัทธาเดียวกัน สงครามนั้นจะถือว่าเป็นสงครามศักดิ์สิทธิ์ ซึ่งหมายความว่าผู้แพ้ยังคงได้รับ [piety|E] (ที่ลดลง) แม้จะพ่ายแพ้ก็ตาม\n\nท่านไม่สามารถดำเนินการหรือดำเนิน $game_concept_flowery_war$ ต่อไปได้ หากท่านมี $game_concept_prisoners$ ที่ได้มาจากการชนะ $game_concept_flowery_war$ อยู่ใน [dungeon|E] ของท่าน"

 game_concept_partition_share:0 "ส่วนแบ่งการสืบทอด"
 game_concept_partition_share_desc:1 "ภายใต้ [succession_law|E] ใดๆ ที่มี [realm_heirs|E] หลายคน $game_concept_partition_share$ ของ [character_possessive|E] คือ [titles|E] ที่ $game_concept_heir$ คนนั้นจะได้รับสืบทอดเมื่อเกิด [succession|E] โดยปกติแล้ว หมายถึงการแบ่งระหว่างบุตรของ [ruler|E] หรือในบางกรณีที่พบได้น้อย คือพี่น้องของพวกเขา\n\nโดยทั่วไป ขึ้นอยู่กับประเภทของ $game_concept_succession$ ที่มีอยู่ $game_concept_titles$ อาจถูกแบ่งเท่าๆ กันระหว่าง [realms|E] ที่แยกจากกัน แบ่งเท่าๆ กันภายใน $game_concept_realm$ เดียวกัน หรือมอบให้แก่ $game_concept_heir$ หลักเป็นส่วนใหญ่ ในขณะที่แบ่งส่วนที่เหลือเท่าๆ กันระหว่าง $game_concept_heirs$ คนอื่นๆ"

 game_concept_banish_reason:0 "เหตุผลในการเนรเทศ"
 game_concept_banish_reasons:0 "เหตุผลในการเนรเทศ"
 game_concept_banish_reason_desc:0 "$game_concept_banish_reason$ เปิดโอกาสให้ [liege|E] สามารถ [banish|E] ข้าราชบริพารคนใดก็ได้ที่อยู่ใน [dungeon|E] ของตนได้อย่างอิสระ เหตุผลเหล่านี้มักได้มาจากการที่ข้าราชบริพารเป็น [criminal|E]"

 game_concept_imprisonment_reason:0 "เหตุผลในการจองจำ"
 game_concept_imprisonment_reasons:0 "เหตุผลในการจองจำ"
 game_concept_imprisonment_reason_desc:0 "$game_concept_imprisonment_reason$ เปิดโอกาสให้ [liege|E] สามารถ [imprison|E] ข้าราชบริพารได้อย่างอิสระ เหตุผลเหล่านี้มักได้มาจากการที่ข้าราชบริพารเป็น [criminal|E]"

 game_concept_revoke_title_reason:0 "เหตุผลในการเพิกถอนบรรดาศักดิ์"
 game_concept_revoke_title_reasons:0 "เหตุผลในการเพิกถอนบรรดาศักดิ์"
 game_concept_revoke_title_reason_desc:0 "$game_concept_revoke_title_reason$ เปิดโอกาสให้ [liege|E] สามารถ [revoke|E] [title|E] จากข้าราชบริพารได้อย่างอิสระ เหตุผลเหล่านี้มักได้มาจากการที่ข้าราชบริพารเป็น [criminal|E]"

 game_concept_execute_reason:0 "เหตุผลในการประหารชีวิต"
 game_concept_execute_reasons:0 "เหตุผลในการประหารชีวิต"
 game_concept_execute_reason_desc:1 "$game_concept_execute_reason$ เปิดโอกาสให้ [liege|E] สามารถ [execute|E] ข้าราชบริพารที่อยู่ใน [dungeon|E] ของตนได้อย่างอิสระ เหตุผลเหล่านี้มักได้มาจากการที่ข้าราชบริพารเป็น [criminal|E]"

 game_concept_movement_lock:0 "การล็อกการเคลื่อนที่"
 game_concept_movement_locked:0 "ถูกล็อกการเคลื่อนที่"
 game_concept_movement_locked_desc:0 "หลังจากที่ [army|E] เคลื่อนที่ตามคำสั่งไปแล้วเกินกว่าครึ่งทาง จะไม่สามารถเปลี่ยนแปลงคำสั่งได้จนกว่าจะถึงจุดหมายปลายทาง"
 
 game_concept_extramarital_sex:0 "การมีเพศสัมพันธ์นอกสมรส"
 game_concept_extramarital_sex_sleeping_with:0 "หลับนอนกับ"
 game_concept_extramarital_sex_desc:1 "หากถูกค้นพบ ตัวละครสองคนที่เกี่ยวข้องกับการมีเพศสัมพันธ์นอกสมรสจะต้องเผชิญกับผลที่ตามมา ขึ้นอยู่กับ [doctrines|E] ของ [faithpossessive|E] ของพวกเขา\n\n$EFFECT_LIST_BULLET$ตัวละคร แต่ละคนจะกลายเป็นที่รู้จักในฐานะ [GetTrait('fornicator').GetName( GetNullCharacter )] หรือ [GetTrait('adulterer').GetName( GetNullCharacter )] ขึ้นอยู่กับสถานะการสมรสของตนเอง\n$EFFECT_LIST_BULLET$หากชายและหญิงหลับนอนด้วยกัน อาจ ส่งผลให้เกิดการตั้งครรภ์ [bastard|E]\n$EFFECT_LIST_BULLET$หากตัวละครเป็นเพศเดียวกัน ผลที่ตามมาจะถูกกำหนดโดย [doctrine|E] $doctrine_homosexuality_name$ ของ [faithpossessive|E] ของพวกเขา\n$EFFECT_LIST_BULLET$[diseases|E] ที่ติดต่อทางเพศสัมพันธ์ใดๆ ที่ตัวละครคนหนึ่งมี อาจแพร่เชื้อไปยังอีกคนหนึ่งได้"

 game_concept_titular_title:0 "บรรดาศักดิ์ แต่ในนาม"
 game_concept_titular_title_desc:0 "$game_concept_titular_title$ คือ [title|E] ที่ไม่มีดินแดน [de_jure|E] บนแผนที่ บรรดาศักดิ์ที่ไม่ใช่บรรดาศักดิ์ แต่ในนามสามารถกลายเป็นบรรดาศักดิ์ แต่ในนามได้ผ่าน [de_jure_drift|E]\n\nบรรดาศักดิ์ของ [mercenary|E], [head_of_faith|E] และ [holy_order|E] มักเป็นบรรดาศักดิ์ แต่ในนาม"

 game_concept_pilgrimage:0 "การจาริกแสวงบุญ"
 game_concept_pilgrimages:0 "การจาริกแสวงบุญ"
 game_concept_pilgrimage_desc:2 "ตัวละครใน [faiths|E] ส่วนใหญ่สามารถเลือกที่จะดำเนิน [activity|E] เพื่อไป $game_concept_pilgrimage$ ยัง [holy_site|E] ได้ แต่ละ [holy_site|E] มีระยะเวลาผ่อนผันก่อนที่ท่านจะสามารถกลับไปเยือนได้อีกครั้ง\n\nการเดินทางดังกล่าวอาจเต็มไปด้วยโอกาสและภยันตราย แต่เมื่อไปถึงจุดหมายปลายทาง ตัวละครจะได้รับ [piety|E] และอาจได้รับรางวัลอื่นๆ"

 game_concept_hajj:0 "ฮัจญ์"
 game_concept_hajjes:0 "ฮัจญ์"
 game_concept_hajj_desc:1 "ตัวละครใน [faiths|E] อิสลามส่วนใหญ่สามารถเลือกที่จะดำเนิน [activity|E] เพื่อไป $game_concept_hajj$ ที่เมกกะ ซึ่งเป็นส่วนหนึ่งของ [doctrine|E] $game_concept_pilgrimage$ ของพวกเขาได้ปีละครั้ง\n\nการเดินทางดังกล่าวอาจเต็มไปด้วยโอกาสและภยันตราย แต่เมื่อไปถึงนครศักดิ์สิทธิ์ ตัวละครจะได้รับ [piety|E] และอาจได้รับรางวัลอื่นๆ"

 game_concept_faith_righteous:0 "ชอบธรรม"
 game_concept_faith_righteous_desc:0 "[faith|E] นี้ถือว่าถูกต้องตามกฎหมาย\nการ แต่งงานข้ามศรัทธาเป็นเรื่องปกติ\n\n#S ผลกระทบ:\n#![GetHostilityDescription( '(int32)0' )]"

 game_concept_faith_astray:0 "หลงผิด"
 game_concept_faith_astray_desc:0 "[faith|E] นี้แตกต่างในลักษณะที่ไม่สำคัญนัก\nการ แต่งงานข้ามศรัทธายังคงเกิดขึ้นได้\n\n#S ผลกระทบ:\n#![GetHostilityDescription( '(int32)1' )]"

 game_concept_faith_hostile:0 "เป็นปฏิปักษ์"
 game_concept_faith_hostile_desc:0 "[faith|E] นี้เบี่ยงเบนไปอย่างมีนัยสำคัญ\nการ แต่งงานข้ามศรัทธายังคงเกิดขึ้นได้ สามารถทำ [holy_wars|E] ได้\n\n#S ผลกระทบ:\n#![GetHostilityDescription( '(int32)2' )]"

 game_concept_faith_evil:0 "ชั่วร้าย"
 game_concept_faith_evil_desc:0 "[faith|E] นี้ถือเป็นสิ่งต้องห้าม\nการ แต่งงานข้ามศรัทธาแทบไม่เกิดขึ้น สามารถทำ [holy_wars|E] ได้\n\n#S ผลกระทบ:\n#![GetHostilityDescription( '(int32)3' )]"

 game_concept_faith_hostility:0 "ความเป็นปฏิปักษ์ทางศรัทธา"
 game_concept_faith_hostility_desc:1 "[faiths|E] ทั้งหมดมีความสัมพันธ์ต่อ $game_concept_faith$ อื่นๆ ซึ่งกำหนดโดยความสัมพันธ์ที่ใกล้ชิดกัน\n\nความใกล้ชิดตัดสินจากปัจจัยหลายประการ เช่น การนับถือ [religion|E], [religious_family|E] เดียวกัน หรือหากศรัทธานั้นมี [doctrines|E] พิเศษ\n\nหากสองศรัทธาอยู่ห่างกันมาก มักจะสามารถทำ [holy_war|E] ต่อกันได้\n\nความสัมพันธ์ที่มีอยู่คือ: [faith_righteous|L], [faith_astray|L], [faith_hostile|L], และ [faith_evil|L]"
 
 game_concept_command_modifier:0 "ตัวปรับ แต่งการบัญชาการ"
 game_concept_command_modifier_desc:0 "[modifier|E] นี้จะทำงานเฉพาะสำหรับ [commanders|E] เท่านั้น\n\nหากตัวละครที่มีตัวปรับ แต่งการบัญชาการบัญชาการ [army|E] กองทัพนั้นจะได้รับผลกระทบนี้"
 game_concept_command_modifier_i:0 "@command_modifier_icon!"
 game_concept_command_modifiers: "ตัวปรับ แต่งการบัญชาการ"

 #game_concept_pic: "@test_flower!"

 game_concept_nickname:0 "ฉายานาม"
 game_concept_epithet:0 "สมัญญานาม"
 game_concept_cognomen:0 "นามสกุลรอง"
 game_concept_nicknames:0 "ฉายานาม"
 game_concept_epithets:0 "สมัญญานาม"
 game_concept_cognomens:0 "นามสกุลรอง"
 game_concept_nickname_desc:1 "$game_concept_nicknames$, $game_concept_epithets$, และ $game_concept_cognomens$ ล้วนเป็นชื่อรองที่ [characters|E] ได้รับมาหรือถูกตั้งให้ ( เช่น ชาร์ลส์ 'ผู้ศีรษะล้าน') $game_concept_nicknames$ เป็นเพียงลักษณะภายนอกเท่านั้น แม้ว่าสถานการณ์ที่เกี่ยวข้องกับการได้มา ซึ่งฉายานามมักจะเป็นเรื่องน่าทึ่งหรือน่าจดจำก็ตาม\n\n$game_concept_nicknames$ ที่ไม่ดีบางครั้งจะถูกแทนที่ด้วยฉายานามที่ดี ( เช่น วิลเลียม 'ไอ้ลูกนอกคอก' กลายเป็น วิลเลียม 'ผู้พิชิต')"

 game_concept_main_phase:0 "ช่วงหลัก"
 game_concept_main_phase_desc:0 "ในช่วงหลักของ [battle|E] [soldiers|E] และ [knights|E] จากทั้งสองฝ่ายจะต่อสู้กัน\n\nช่วงหลักจะสิ้นสุดลงเมื่อกองกำลังทั้งหมดของฝ่ายหนึ่งกลายเป็น [casualties|E] หรือฝ่ายหนึ่งตัดสินใจ [retreat|E]\n\nหลังจากช่วงหลัก การรบจะเข้าสู่ [aftermath|E]"

 game_concept_personality_trait:0 "ลักษณะนิสัยบุคลิกภาพ"
 game_concept_personality_traits:0 "ลักษณะนิสัยบุคลิกภาพ"
 game_concept_personality_trait_desc:1 "$game_concept_personality_trait$ คือ [trait|E] ที่กำหนดมุมมองต่อโลกของบุคคลและสิ่งที่พวกเขามีแนวโน้มที่จะทำมากที่สุด นอกจากนี้ยังมีผลต่อ [opinion|E] ของผู้อื่นด้วย บุคคลอาจสูญเสียและได้รับลักษณะใหม่ๆ ในช่วงชีวิต การกระทำที่ขัดต่อบุคลิกภาพของตนเองจะ ทำให้เกิด [stress|E]"

 game_concept_lifestyle_trait:0 "ลักษณะนิสัยวิถีชีวิต"
 game_concept_lifestyle_traits:0 "ลักษณะนิสัยวิถีชีวิต"
 game_concept_lifestyle_trait_desc:1 "$game_concept_lifestyle_trait$ เป็นผลลัพธ์มาจากการเลือกความสามารถของ [lifestyle|E], [decisions|E], หรือ [interactions|E] บางอย่าง\n\nลักษณะนิสัยจากวิถีชีวิตบางอย่างสามารถอัปเกรดได้เมื่อตัวละครพัฒนาความเชี่ยวชาญในทักษะนั้นๆ ระดับจะอยู่ในช่วง 1-3 และดาวบนไอคอนลักษณะนิสัยจะบ่งบอกถึงระดับในปัจจุบัน"

 game_concept_physical_trait:0 "ลักษณะนิสัยทางกายภาพ"
 game_concept_physical_traits:0 "ลักษณะนิสัยทางกายภาพ"
 game_concept_physical_trait_desc:1 "$game_concept_physical_trait$ คือคำอธิบาย [trait|E] ทางกายภาพที่เชื่อมโยงกับรูปลักษณ์หรือพฤติกรรม และระดับสติปัญญาของตัวละคร ลักษณะทางกายภาพหลายอย่างส่งผลต่อการที่ผู้อื่น [attracted|E] ต่อพวกเขา\n\nลักษณะเหล่านี้มักเป็น [congenital|E] จึงได้รับมาตั้งแต่เกิดและคงอยู่ถาวร"

 game_concept_fame_trait:0 "ลักษณะนิสัยชื่อเสียง"
 game_concept_fame_traits:0 "ลักษณะนิสัยด้านชื่อเสียง"
 game_concept_fame_trait_desc:1 "$game_concept_fame_trait$ คือ [trait|E] พิเศษที่ได้รับจากสถานการณ์เฉพาะและส่งผลต่อ [opinion|E] ของผู้อื่นที่มีต่อพวกเขา บุคคลอาจได้รับลักษณะเหล่านี้จากการทำความดี หรือเมื่อ [secrets|E] อันมืดมนของตนถูกเปิดเผย ลักษณะนิสัยอื่นๆ เป็นผลมาจากสถานการณ์เมื่อแรกเกิด"

 game_concept_health_trait:0 "ลักษณะนิสัยสุขภาพ"
 game_concept_health_trait_desc:1 "$game_concept_health_trait$ เป็น [trait|E] ที่ส่งผลโดยตรงต่อ [health|E] ทางร่างกายและจิตใจของบุคคลนั้นๆ เช่น [diseases|E] ลักษณะนิสัยชั่วคราวที่ส่งผลต่อความสามารถทางร่างกาย เช่น การตั้งครรภ์และบาดแผล ก็จัดอยู่ในหมวดหมู่นี้เช่นกัน\n\n[characters|E] ที่ชราภาพอาจได้รับ [Concept( 'elder_traits', 'ลักษณะนิสัยคนชรา' )|E]"

 game_concept_modifier_contribution:0 "การสนับสนุนจากตัวปรับ แต่ง"
 game_concept_modifier_contributions:0 "การสนับสนุนจากตัวปรับ แต่ง"
 game_concept_modifier_contributes:0 "สนับสนุน"
 game_concept_modifier_contribution_desc: "[modifier|E] อาจเปลี่ยนแปลง $game_concept_modifier_contribution$ ของ [obligations|E] ของ [vassals|E] ของท่าน นี่ไม่เหมือนกับ [modifier_base_contribution|E]\n\nหากท่านมี [vassal] ที่จ่าย [gold|E] ให้ท่าน #V 1#! ต่อเดือน และท่านได้รับ [modifier] ที่เพิ่ม $game_concept_modifier_contribution$ ขึ้น #V 10%#! ดังนั้น [vassal] จะจ่าย [gold] ให้ท่าน #V 1.1#! แทน"
 
 game_concept_modifier_base_contribution:0 "การสนับสนุนพื้นฐาน"
 game_concept_modifier_base_contributions:0 "การสนับสนุนพื้นฐาน"
 game_concept_modifier_base_contributes:0 "สนับสนุนพื้นฐาน"
 game_concept_modifier_base_contribution_desc: "[modifier|E] อาจเปลี่ยนแปลง $game_concept_modifier_base_contribution$ ของ [obligations|E] ของ [vassals|E] ของท่าน นี่ไม่เหมือนกับ [modifier_contribution|E]\n\nหากท่านมี [vassal] ที่มี [income|E] ทั้งหมด #V 10#! [gold|E] และจ่าย [gold] ให้ท่าน #V 1#! ต่อเดือน และท่านได้รับ [modifier] ที่เพิ่ม $game_concept_modifier_base_contribution$ ขึ้น #V 10%#! ดังนั้น [vassal] จะจ่าย [gold] ให้ท่าน #V 2#! แทน"
 
 game_concept_maneuver:0 "การดำเนินกลยุทธ์"
 game_concept_maneuver_desc:0 "ช่วง $game_concept_maneuver$ เกิดขึ้นเมื่อเริ่มต้น [battle|E] และบ่งบอกถึงเวลาที่ใช้ก่อนที่ [main_phase|E] จะเริ่มขึ้น และ [armies|E] จะเข้าปะทะกันในการรบ"
 
 game_concept_combat_phase:0 "ช่วงการรบ"
 game_concept_combat_phase_desc:0 "$game_concept_combat_phase$ เป็นส่วนหนึ่งของ [battle|E] การรบมีสามช่วงที่แตกต่างกันคือ [maneuver|E], [main_phase|E], และ [aftermath|E]"

 game_concept_unreformed_pagan_combat_bonus:1 "ความได้เปรียบในการรบของเพแกนที่ยังไม่ปฏิรูป"
 game_concept_unreformed_pagan_combat_bonus_desc:1 "[faiths|E] [GetReligionFamily('rf_pagan').GetName] ที่ [GetFaithDoctrine('unreformed_faith_doctrine').GetBaseName] จะได้รับ [advantage|E] ใน [battle|E] ใน [counties|E] ที่นับถือศรัทธาของตน"
 
 game_concept_personality:0 "บุคลิกภาพ"
 game_concept_character_personality:0 "บุคลิกภาพตัวละคร"
 game_concept_personalities:0 "บุคลิกภาพ"
 game_concept_personality_desc:1 "ตัวละครจะปฏิบัติต่อท่านและผู้อื่นตามบุคลิกภาพของพวกเขา ซึ่งส่วนใหญ่กำหนดโดย [personality_traits|E] ของพวกเขา"
 
 game_concept_economical_archetype:0 "รูปแบบเศรษฐกิจเบื้องต้น"
 game_concept_economical_archetype_desc:0 "รูปแบบเศรษฐกิจเบื้องต้นของ[rulerpossessive|E] จะส่งผลต่อวิธีการที่พวกเขาตัดสินใจใช้จ่าย [gold_i][gold|E] ซึ่งส่วนใหญ่จะอิงตาม [traits|E] ของพวกเขา\n\n#low รูปแบบเศรษฐกิจเบื้องต้นมีดังนี้:#!\n$EFFECT_LIST_BULLET$[ai_warlike_personality|E]\n$EFFECT_LIST_BULLET$[ai_cautious_personality|E]\n$EFFECT_LIST_BULLET$[ai_economical_boom_personality|E]\n$EFFECT_LIST_BULLET$[ai_economical_unpredictable_personality|E]\n$EFFECT_LIST_BULLET$[ai_conqueror_personality|E]"
 
 game_concept_gift:0 "ของขวัญ"
 game_concept_gifts:0 "ของขวัญ"
 game_concept_send_gift:0 "ส่งของขวัญ"
 game_concept_gift_desc:0 "การส่งของขวัญให้ตัวละครอื่นจะเพิ่ม [opinion|E] ของพวกเขาที่มีต่อท่าน แลกกับ [gold|E][gold_i]\n\nยิ่งผู้รับโลภมากเท่าไร ท่านก็ยิ่งต้องส่งทองคำมากขึ้นเท่านั้น และท่านก็จะได้รับความเห็นมากขึ้นเท่านั้น\n\nยิ่ง [diplomacy|E] ของท่านสูงเท่าไร ท่านก็จะได้รับความเห็นมากขึ้นเท่านั้น"

 game_concept_vote_strength:0 "พลังเสียงโหวต"

 game_concept_valuable_prisoner: "เชลยทรงคุณค่า"
 game_concept_valuable_prisoners: "เชลยทรงคุณค่า"
 game_concept_valuable_prisoner_desc:0 "$game_concept_valuable_prisoner$ คือ [prisoner|E] ที่ให้ [war_score|E] เมื่อถูกจับระหว่าง [war|E]\n\nเพื่อให้บุคคลถูกพิจารณาว่าเป็น $game_concept_valuable_prisoner$ พวกเขาจะต้องอยู่ในลำดับที่สามหรือสูงกว่าในการสืบทอดบรรดาศักดิ์หลักของผู้นำสงครามของพวกเขา\n\n$game_concept_valuable_prisoners$ จะถูกปล่อยตัวเมื่อสงครามสิ้นสุดลง ซึ่งแตกต่างจาก [prisoners_of_war|E]"
 game_concept_prisoner_of_war:0 "เชลยศึก"
 game_concept_prisoners_of_war:0 "เชลยศึก"
 game_concept_prisoner_of_war_desc:1 "$game_concept_prisoner_of_war$ คือ [prisoner|E] ที่ถูกจับระหว่าง [war|E] แต่ไม่มีความสำคัญพอที่จะให้ [war_score|E] แก่ผู้จับ\n\n[valuable_prisoners|E] จะถูกปล่อยตัวเมื่อสงครามสิ้นสุดลง ซึ่งแตกต่างจากเชลยศึก แต่ยังคงสามารถเรียกค่าไถ่เพื่อปล่อยตัวได้"

 game_concept_single_combat_fight:0 "การประลองตัวต่อตัว"
 game_concept_single_combat_duel:0 "การดวล"
 game_concept_single_combat_fight_plural:0 "การประลองตัวต่อตัว"
 game_concept_single_combat_duel_plural:0 "การดวล"
 game_concept_single_combat_fight_sudden_death:0 "การตัดสินฉับพลัน"
 game_concept_single_combat_fight_desc:0 "ใน $game_concept_single_combat_fight$ [characters|E] สองคนจะต่อสู้กัน อาจถึง [character_death_death|E] หรือจนกว่าจะมีเลือดออกครั้งแรก ใน แต่ละรอบ $game_concept_characters$ ทั้งสองจะเลือกตัวเลือกที่สุ่มได้จากรายการ แลกเปลี่ยนการโจมตีกันจนกว่า $game_concept_character$ คนหนึ่งจะโจมตีเข้าเป้าอย่างจัง โดยตัวเลือกที่มีจะขึ้นอยู่กับ [prowess|E] และ [traits|E] ของท่าน\n\nตัวเลือกบางอย่างอาจให้ผลพิเศษ และส่วนใหญ่จะเพิ่ม [single_combat_success_chance|E] และ [single_combat_injury_chance|E] ของท่าน เมื่อ $game_concept_single_combat_duel_plural$ ดำเนินต่อไป การดวลจะอันตรายและไม่แน่นอนมากขึ้น และจะง่ายขึ้นที่จะชนะหรือทำร้ายตัวเอง หลังจากผ่านไปหลายรอบ $game_concept_single_combat_duel_plural$ จะเข้าสู่การตัดสินฉับพลัน ซึ่งจะสิ้นสุดลงทันทีโดยผู้ประลองที่มี $game_concept_prowess$ สูงกว่าเป็นผู้ชนะ\n\nเมื่อต่อสู้ใน $game_concept_single_combat_duel_plural$ ท่านอาจได้รับ [character_modifiers|E] [single_combat_prowess_bonus|E] หรือ [single_combat_prowess_malus|E] ชั่วคราว ซึ่งจะเพิ่มหรือลด $game_concept_prowess$ ของท่านจนกว่า $game_concept_single_combat_duel$ จะสิ้นสุดลง"
 game_concept_single_combat_success_chance:0 "โอกาสสำเร็จ"
 game_concept_single_combat_success_chance_skill:0 "ความสำเร็จในการดวล"
 game_concept_single_combat_success_chance_desc:0 "เมื่อต่อสู้ใน $game_concept_single_combat_fight$ $game_concept_single_combat_success_chance$ ของท่านคือระดับความสามารถของท่านใน $game_concept_single_combat_duel$ หากต้องการชนะ ท่านต้อง ทำให้ $game_concept_single_combat_success_chance$ ของท่านสูงกว่าคู่ต่อสู้มาก\n\nเมื่อรอบดำเนินต่อไป การชนะจะง่ายขึ้น หมายความว่าท่านต้องการความได้เปรียบเหนือคู่ต่อสู้น้อยลง\n\nสิ่งที่ตรงกันข้ามกับ $game_concept_single_combat_success_chance$ คือ [single_combat_injury_chance|E]"
 game_concept_single_combat_injury_chance:0 "ความเสี่ยงบาดเจ็บ"
 game_concept_single_combat_injury_chance_injure:0 "ทำให้บาดเจ็บ"
 game_concept_single_combat_injury_chance_injury_risk:0 "ความเสี่ยงบาดเจ็บ"
 game_concept_single_combat_injury_chance_desc:0 "[characters|E] ใน $game_concept_single_combat_fight_plural$ มีความเสี่ยงที่จะทำร้ายตัวเอง ไม่ว่าจะโดยการเปิดช่องว่างให้คู่ต่อสู้โดยไม่ได้ตั้งใจ หรือเพียงแค่ทำร้ายตัวเองด้วยอาวุธของตนเอง ขณะที่พวกเขาต่อสู้ พวกเขาก็สะสม $game_concept_single_combat_injury_chance$ ด้วย\n\n$game_concept_single_combat_duel_plural$ ที่ดำเนินไปนานขึ้นจะ ทำให้ง่ายต่อการทำร้ายตัวเอง\n\nสิ่งที่ตรงกันข้ามกับ $game_concept_single_combat_injury_chance$ คือ [single_combat_success_chance|E]"
 game_concept_single_combat_prowess_bonus:0 "โบนัสความได้เปรียบในการดวล"
 game_concept_single_combat_prowess_bonus_desc:0 "ขณะที่ [characters|E] $game_concept_single_combat_duel$ พวกเขาอาจได้รับความได้เปรียบชั่วคราว เช่น โดยการใช้ประโยชน์จาก [terrain|E] หรือ [traits|E] พิเศษ สิ่งนี้จะเพิ่ม [prowess|E] ของพวกเขาตลอดระยะเวลาการประลองปัจจุบัน และจะหายไปทันทีหลังจากนั้น\n\nสิ่งที่ตรงกันข้ามกับ $game_concept_single_combat_prowess_bonus$ คือ [single_combat_prowess_malus|E]"
 game_concept_single_combat_prowess_malus:1 "บทลงโทษความเสียเปรียบในการดวล"
 game_concept_single_combat_prowess_malus_desc:1 "ขณะที่ [characters|E] $game_concept_single_combat_duel$ พวกเขาอาจได้รับผลกระทบจากความเสียเปรียบชั่วคราว ซึ่งมักเกิดจากการที่คู่ต่อสู้ทำร้ายหรือข่มขู่พวกเขาอย่างรุนแรง สิ่งนี้จะลด [prowess|E] ของพวกเขาตลอดระยะเวลาการประลองปัจจุบัน แต่จะกลับคืนมาทันทีหลังจากนั้น\n\nสิ่งที่ตรงกันข้ามกับ $game_concept_single_combat_prowess_malus$ คือ [single_combat_prowess_bonus|E]"

 game_concept_game_over:0 "เกมจบ"
 game_concept_game_over_desc:0 "เกมจะจบลงเมื่อสายเลือดปัจจุบันของท่านสิ้นสุดลง\n\nอย่างไรก็ตาม แม้ว่าเกมจะจบลงสำหรับสายเลือดของท่านแล้ว ท่านยังคงสามารถเลือกเล่นเป็น [ruler|E] คนอื่นที่ใดก็ได้ในโลก\n\nเกมสามารถจบลงได้สองวิธี:\n$BULLET_WITH_TAB$ท่านเสียชีวิตโดยไม่มี [player_heir|E]\n$BULLET_WITH_TAB$ท่านไปถึงปี 1453"

 game_concept_de_jure_partition:0 "การแบ่งแยกโดยนิตินัย"
 game_concept_de_jure_partitioned:0 "ถูกแบ่งแยกโดยนิตินัย"
 game_concept_de_jure_partition_desc:0 "[realms|E] ที่ถูก $game_concept_de_jure_partitioned$ ได้ถูกแบ่งออกเป็นสอง [titles|E] ที่มี [title_tier|E] เดียวกัน แต่ยังคงสามารถรวมกันใหม่ได้อย่างง่ายดาย\n\n$game_concept_title$ ใดก็ตามสามารถ [de_jure_drift_drift|E] [duchies|E] ที่ [completely_controlled|E] จาก $game_concept_title$ อื่นเข้ามาใน [de_jure|E] ของตนได้ทันทีผ่าน [decision|E]\n\nหาก $game_concept_title$ ใดก็ตามถูกทำลายหรือสูญเสีย [counties|E] $game_concept_de_jure$ สุดท้ายไป $game_concept_title$ ที่เหลืออยู่จะดูดซับ $game_concept_de_jure$ ทั้งหมดของมัน"

 game_concept_hybrid_culture:0 "วัฒนธรรมผสม"
 game_concept_hybrid_cultures:0 "วัฒนธรรมผสม"
 game_concept_hybridize:0 "ผสมผสาน"
 game_concept_hybridized:0 "ถูกผสมผสาน"
 game_concept_hybridizing:0 "กำลังผสมผสาน"
 game_concept_hybridizes:0 "ผสมผสาน"
 game_concept_hybrid_culture_desc:0 "[SelectLocalization( HasDlcFeature( 'hybridize_culture' ), 'game_concept_hybrid_culture_desc_DLC', 'game_concept_hybrid_culture_desc_NO_DLC' )]"
 game_concept_hybrid_culture_desc_DLC:1 "$game_concept_hybrid_culture$ คือ [culture|E] ที่ถูกสร้างขึ้นโดย [ruler|E] จากการรวมกันของสองวัฒนธรรมที่มีอยู่\n\n$game_concept_hybrid_culture$ เป็นส่วนผสมของ [traditions|E], [culture_pillars|E], และสุนทรียศาสตร์ของสองวัฒนธรรมดั้งเดิม\n\nเฉพาะวัฒนธรรมที่มี [heritage|E] แตกต่างกันเท่านั้นที่สามารถสร้างวัฒนธรรมผสมได้ และค่าใช้จ่าย [prestige|E] ในการทำ เช่นนั้นขึ้นอยู่กับ [cultural_acceptance|E] ที่มีต่อกัน\n\nยิ่งการยอมรับทางวัฒนธรรมสูงเท่าไร [counties|E] ก็จะเปลี่ยนไปมากขึ้นเท่านั้นเมื่อเกิดวัฒนธรรมผสม ผู้ปกครองของวัฒนธรรมผสมจะ [promote_culture|E] ได้เร็วกว่ามากในเคาน์ตีของวัฒนธรรมแม่เป็นเวลา #V [EmptyScope.ScriptValue('culture_hybrid_cooldown')|0]#! ปีหลังจากที่ก่อตั้งขึ้น\n\nวัฒนธรรมใหม่ยังสามารถปรากฏเป็น [divergent_culture|E] ได้อีกด้วย"
 game_concept_hybrid_culture_desc_NO_DLC:0 "$game_concept_hybrid_culture$ คือ [culture|E] ที่ก่อตัวขึ้นจากการรวมกันของสองวัฒนธรรมอื่น\n\nวัฒนธรรมใหม่ยังสามารถปรากฏเป็น [divergent_culture|E] ได้อีกด้วย"
 game_concept_divergent_culture:0 "วัฒนธรรมแตกแขนง"
 game_concept_divergent_cultures:0 "วัฒนธรรมแตกแขนง"
 game_concept_diverge:0 "แตกแขนง"
 game_concept_diverges:0 "แตกแขนง"
 game_concept_divergent_culture_desc:0 "[SelectLocalization( HasDlcFeature( 'diverge_culture' ), 'game_concept_divergent_culture_desc_DLC', 'game_concept_divergent_culture_desc_NO_DLC' )]"
 game_concept_divergent_culture_desc_DLC:1 "$game_concept_divergent_culture$ เป็นสาขาแยกของ [culture|E] ที่มีอยู่ ซึ่งสร้างขึ้นโดย [ruler|E]\n\n$game_concept_divergent_culture$ จะรักษา [heritage|E] ของตนไว้ แต่แง่มุมอื่นๆ ของวัฒนธรรมดั้งเดิมสามารถเปลี่ยนแปลงได้\n\nวัฒนธรรมที่แตกแขนงออกมาจะต้องมีอายุอย่างน้อย [EmptyScope.ScriptValue('culture_divergence_cooldown')|0] ปี และค่าใช้จ่าย [prestige|E] ในการแตกแขนงจะขึ้นอยู่กับ [realm_size|E] ของผู้ปกครองที่สร้าง\n\nวัฒนธรรมใหม่ยังสามารถปรากฏเป็น [hybrid_culture|E] ได้อีกด้วย"
 game_concept_divergent_culture_desc_NO_DLC:0 "$game_concept_divergent_culture$ เป็นสาขาแยกของ [culture|E] ที่มีอยู่\n\nวัฒนธรรมใหม่ยังสามารถปรากฏเป็น [hybrid_culture|E] ได้อีกด้วย"

 game_concept_winter:0 "ความรุนแรงของฤดูหนาว"
 game_concept_winter_desc:0 "ฤดูหนาวจะค่อยๆ ลด [supply|E] ลงเมื่อเวลาผ่านไป ทำให้กองทัพสูญเสียเสบียงขณะประจำการอยู่ในบารอนีที่ได้รับผลกระทบจากฤดูหนาว บทลงโทษด้านเสบียงจะเพิ่มขึ้นตามความรุนแรง แต่ละระดับ ฤดูหนาวมีความรุนแรงสามระดับคือ [Concept( 'winter_severity_mild', 'ไม่รุนแรง' )|E], [Concept( 'winter_severity_normal', 'ปกติ' )|E], และ [Concept( 'winter_severity_harsh', 'รุนแรง' )|E]"
 game_concept_winter_severity_mild:0 "ฤดูหนาวไม่รุนแรง"
 game_concept_winter_severity_mild_desc:1 "[GetModifier( 'winter_mild_modifier' ).GetDescWithEffects]"
 game_concept_winter_severity_normal:0 "ฤดูหนาวปกติ"
 game_concept_winter_severity_normal_desc:1 "[GetModifier( 'winter_normal_modifier' ).GetDescWithEffects]"
 game_concept_winter_severity_harsh:0 "ฤดูหนาวรุนแรง"
 game_concept_winter_severity_harsh_desc:1 "[GetModifier( 'winter_harsh_modifier' ).GetDescWithEffects]"

 game_concept_deceitful_progress_hostile_schemes_decision:0 "การตัดสินใจ $deceitful_progress_hostile_schemes_decision$"
 game_concept_deceitful_progress_hostile_schemes_decision_desc:1 "[decision|E] ที่ช่วยให้ท่านปรับปรุง [hostile_schemes|E] ของท่านได้ ให้ [success_chance|E] และ [scheme_speed|E] แลกกับ [stress|E]"

 game_concept_diligent_development_focus_decision:0 "การตัดสินใจ $diligent_development_focus_decision$"
 game_concept_diligent_development_focus_decision_desc:0 "[decision|E] ที่ช่วยให้ท่านปรับปรุง [capital|E] ของท่านได้ ให้ [development|E] แลกกับ [stress|E]"

 game_concept_impatient_rushing_all_schemes_decision:0 "การตัดสินใจ $impatient_rushing_all_schemes_decision$"
 game_concept_impatient_rushing_all_schemes_decision_desc:0 "[decision|E] ที่ช่วยให้ท่านเร่ง [scheme|E] ของท่านได้ ให้ [scheme_opportunity_opportunities|E] แลกกับ [stress|E]"

 game_concept_dismiss_strong_hook_interaction:0 "ปฏิสัมพันธ์ $dismiss_strong_hook_interaction$"
 game_concept_dismiss_strong_hook_interaction_desc:0 "[interaction|E] ที่ช่วยให้ท่านยกเลิก [hook|E] ที่มุ่งเป้ามาที่ท่าน แลกกับ [prestige|E]"

 game_concept_abandon_hook_interaction:0 "ปฏิสัมพันธ์ $abandon_hook_interaction$"
 game_concept_abandon_hook_interaction_desc:0 "[interaction|E] ที่ช่วยให้ท่านละทิ้ง [hook|E] ที่ท่านมี แลกกับการสูญเสีย [stress_loss_i][stress|E]"

 game_concept_force_duel_criminals_interaction:0 "ปฏิสัมพันธ์ $force_duel_criminals_interaction$"
 game_concept_force_duel_criminals_interaction_desc:0 "[interaction|E] ที่ช่วยให้ท่าน [single_combat_duel|E] กับอาชญากรเมื่อท่าน [stressed|E]"

 game_concept_force_duel_anyone_interaction:0 "ปฏิสัมพันธ์ $force_duel_anyone_interaction$"
 game_concept_force_duel_anyone_interaction_desc:0 "[interaction|E] ที่ช่วยให้ท่าน [single_combat_duel|E] กับใครก็ได้เมื่อท่าน [stressed|E]"

 game_concept_artifact_rarity:0 "ความหายากของโบราณวัตถุ"
 game_concept_rarity:0 "ความหายาก"
 game_concept_artifact_rarity_desc:0 "[artifacts|E] บางชิ้นหายากกว่าชิ้นอื่นๆ ซึ่งสะท้อนให้เห็นในระดับความหายากของมัน\n\nระดับต่างๆ เรียงจากต่ำสุดไปสูงสุดคือ:\n$BULLET_WITH_TAB$ทั่วไป (ไม่เคยแสดง เนื่องจากเป็นค่าเริ่มต้น)\n$BULLET_WITH_TAB$$masterwork$\n$BULLET_WITH_TAB$$famed$\n$BULLET_WITH_TAB$$illustrious$"

 game_concept_promote_other_culture_development_decision:0 "การตัดสินใจ $promote_other_culture_development_decision_name$"
 game_concept_promote_other_culture_development_decision_desc:0 "[decision|E] ที่ช่วยให้ท่านปรับปรุง [development|E], [control|E], ค่าใช้จ่าย [building|E], และ [advantage|E] ในการป้องกันใน [counties|E] จาก [cultures|E] ที่แตกต่างกัน ซึ่งมี [cultural_acceptance|E] #V 75%#! หรือมากกว่า\n\nการตัดสินใจนี้จะเพิ่ม [prestige|E] [prestige_i] และ [levies|E] ของท่านด้วย\n\nเคาน์ตีทั้งหมดใน [realm|E] จะได้รับผลกระทบ ค่าใช้จ่าย [gold|E] จะแปรผันตามจำนวนเคาน์ตีที่ได้รับผลกระทบ"

 game_concept_reform:0 "ปฏิรูป"
 game_concept_reformation:0 "การปฏิรูป"
 game_concept_reformation_desc:0 "[culture_head|E] สามารถเปลี่ยนแปลงบางส่วนของ [culture|E] ของตนได้ผ่าน $game_concept_reformation$ นี่เป็นกระบวนการที่ใช้เวลานานและไม่สามารถหยุดได้เมื่อเริ่มต้นแล้ว\n\nส่วนที่สามารถปฏิรูปได้คือ:\n$BULLET_WITH_TAB$[traditions|E]\n$BULLET_WITH_TAB$[ethos|E]\n$BULLET_WITH_TAB$[martial_custom|E]"

 game_concept_buy_artifact_claim:0 "$buy_artifact_claim_interaction$"
 game_concept_buy_artifact_claim_interaction:0 "ปฏิสัมพันธ์ $buy_artifact_claim_interaction$"
 game_concept_buy_artifact_claim_desc:0 "ปฏิสัมพันธ์ที่ช่วยให้ตัวละครสามารถซื้อ [personal_artifact_claims|E] แลกกับ [piety|E] หรือ [prestige|E]"

 game_concept_vassal_contract:0 "สัญญาข้าหลวง"
 game_concept_vassal_contracts:0 "สัญญาข้าหลวง"
 game_concept_vassal_contract_desc:0 "$game_concept_vassal_contracts$ กำหนด [obligations|E] ระหว่าง [vassal|E] และ [liege|E] ของพวกเขา\n\nเหล่าข้าหลวงของ $game_concept_government_forms$ [feudal|E] [clan|E] [administrative|E] และ [nomadic|E] สามารถเข้าถึง [obligations|E] ที่แตกต่างกัน ซึ่งเจรจาเป็นรายบุคคลสำหรับข้าหลวง แต่ละคน\n\nข้าหลวงทุกคนจ่ายเปอร์เซ็นต์ของ [taxes|E] และ [levies|E] ทั้งหมดให้กับเจ้าเหนือหัวของตน โดยขึ้นอยู่กับ [obligations|E] ของพวกเขา #EMP [modifier_contributions|E] เหล่านี้สามารถถูกปรับเปลี่ยนได้โดยตัวเลือก 'ข้อปลีกย่อย' เช่น [GetSubjectContractType( 'fortification_rights' ).GetObligationName( 'fortification_rights_granted' )]#!\n\nสัญญาพิเศษบางฉบับจำกัดเฉพาะบางตำแหน่ง:\n$EFFECT_LIST_BULLET$[GetSubjectContractType( 'special_contract' ).GetObligationName( 'special_contract_march' )|V] และ [GetSubjectContractType( 'special_contract' ).GetObligationName( 'special_contract_scutage' )|V]: [duke|E] และสูงกว่า\n$EFFECT_LIST_BULLET$[GetSubjectContractType( 'special_contract' ).GetObligationName( 'special_contract_palatinate' )|V]: [count|E] และสูงกว่า\n$EFFECT_LIST_BULLET$[GetSubjectContractType( 'special_contract' ).GetObligationName( 'special_contract_castellan' )|V]: [count|E] เท่านั้น\n\n#weak หมายเหตุ, [governor|E] ของ [obligations|E] ยังเป็นที่รู้จักในนาม [province_administrations|E]#!"

 game_concept_vassal_directive: "คำสั่งข้าหลวง"
 game_concept_vassal_directives: "คำสั่งข้าหลวง"
 game_concept_directive: "คำสั่ง"
 game_concept_directives: "คำสั่ง"
 game_concept_vassal_directive_desc: "ในฐานะ [liege|E] ท่านสามารถออกคำสั่งให้กับ [vassals|E] ของท่าน เพื่อมีอิทธิพลต่อ [councillor_tasks|E] และ [buildings|E] ที่พวกเขาสร้าง\n\nในการออกคำสั่ง ท่านต้องเปิดใช้งานมัน เช่น โดยการมี [opinion|E] #P 50#! หรือมากกว่ากับข้าหลวง [government_forms|E] ขั้นสูงไม่จำเป็นต้องมีเงื่อนไขนี้"

 game_concept_tributary_contract: "สัญญาการส่งบรรณาการ"
 game_concept_tributary_contracts: "เหล่าสัญญาการส่งบรรณาการ"
 game_concept_tributary_contract_desc: "$game_concept_tributary_contract$ กำหนด [obligations|E] ระหว่าง [tributary|E] และ [suzerain|E] ของพวกเขา\n\nเหล่ารัฐบรรณาการทั้งหมดสามารถเข้าถึง [obligations|E] ที่แตกต่างกัน ซึ่งเจรจาเป็นรายบุคคลสำหรับรัฐบรรณาการ แต่ละแห่ง\n\nเหล่ารัฐบรรณาการจ่ายเปอร์เซ็นต์ของ [taxes|E] [levies|E] [herd|E] [prestige|E] หรือแม้ แต่ [piety|E] ทั้งหมดให้กับเจ้าผู้ครองนครของตน โดยขึ้นอยู่กับ [obligations|E] ของพวกเขา"

