 game_concept_uncreated_title:0 "ตำแหน่งที่ยังไม่ได้สร้าง"
 game_concept_title_creation_desc:2 "[ruler|E] ที่ควบคุมดินแดน [de_jure|E] ส่วนใหญ่ของ [titlepossessive|E] ที่ยังไม่ได้สร้าง จะสามารถสร้างตำแหน่งที่เกี่ยวข้องได้ การสร้างตำแหน่งมีค่าใช้จ่ายเป็น [gold|E] แต่ให้ [prestige|E]\n\nสามารถสร้างได้เฉพาะตำแหน่งระดับ [duchy|E], [kingdom|E] หรือ [empire|E] เท่านั้น\n\nวิดเจ็ตปัญหาจะแสดงรายการตำแหน่งทั้งหมดที่ท่านสามารถสร้างได้ในปัจจุบัน"

 game_concept_foreign_affairs:0 "$task_foreign_affairs$"
 game_concept_foreign_affairs_desc:0 "[councillor_task|E] ที่ดำเนินการโดย [chancellor|E]\nสำหรับ [ruler|E] [independent|E] จะเพิ่มความคิดเห็นที่ผู้ปกครองอิสระอื่น ๆ มีต่อพวกเขา สำหรับข้าหลวง จะเพิ่มความคิดเห็นที่ข้าหลวงอื่น ๆ ของ [liege|E] เดียวกันมีต่อพวกเขา"

 game_concept_domestic_affairs:0 "$task_domestic_affairs$"
 game_concept_domestic_affairs_desc:0 "[councillor_task|E] ที่ดำเนินการโดย [chancellor|E] ซึ่งเพิ่มความคิดเห็นที่ [vassals|E] ใน [realm|E] มีต่อ [liege|E]"

 game_concept_bestow_royal_favor:0 "$task_bestow_royal_favor$"
 game_concept_bestow_royal_favor_desc:0 "[councillor_task|E] ที่ดำเนินการโดย [chancellor|E] ซึ่งเพิ่มความคิดเห็นที่ [vassals|E] ที่เลือกใน [realm|E] มีต่อ [liege|E] ของพวกเขา"

