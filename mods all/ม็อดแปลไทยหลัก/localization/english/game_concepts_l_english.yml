 game_concept_offer_vassalization_desc:0 "ปฏิสัมพันธ์ที่เสนอ [vassalage|E] ให้กับ [ruler|E] [independent|E] ที่มี [title_rank|E] ต่ำกว่า โดยเพิ่มพวกเขาเข้ามาในอาณาจักรอย่างสันติ"

 game_concept_extort_subjects_decision:0 "การตัดสินใจขูดรีดข้าราชบริพาร"
 game_concept_extort_subjects:0 "ขูดรีดข้าราชบริพาร"
 game_concept_extort_subjects_decision_desc:0 "[decision|E] ที่เสนอโอกาสต่าง ๆ ในการเรียกร้อง [gold|E] เพิ่มเติมจากข้าราชบริพาร โดยมีค่าใช้จ่ายที่แตกต่างกัน..."

 game_concept_sell_titles_decision:0 "การตัดสินใจขายตำแหน่ง"
 game_concept_sell_titles:0 "ขายตำแหน่ง"
 game_concept_sell_titles_decision_desc:1 "[decision|E] ที่อนุญาตให้ขายตำแหน่งเล็กน้อย — ตำแหน่งที่มีความสำคัญเชิงสัญลักษณ์ล้วน ๆ ให้ [gold|E] แลกกับ [prestige|E]"

 game_concept_embrace_celibacy:0 "ถือพรหมจรรย์"
