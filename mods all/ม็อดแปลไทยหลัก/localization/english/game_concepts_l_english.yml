 game_concept_board_game_match_desc:0 "เกมกระดานประกอบด้วยผู้เล่นสองคนที่พยายามทดสอบโชคและทักษะของตนในการแข่งขันที่ใช้ไหวพริบและโอกาส อาจเล่นเป็นการแข่งขันกระชับมิตร หรือมีการเดิมพันบางอย่าง\n\n#weak มี [board_game_types|E] ที่แตกต่างกันมากมาย แม้ว่าวิธีการ [board_game_win|E] และการเล่นแต่ละเกมจะยังคงเหมือนเดิม มีเพียงทักษะที่ใช้เท่านั้นที่แตกต่างกัน#!"

