 game_concept_embrace_celibacy_desc:0 "[decision|E] ที่อนุญาตให้ตัวละครได้รับ [trait|E] [GetTrait('celibate').GetName( GetNullCharacter )] ตามต้องการ"

 game_concept_abandon_celibacy:0 "ละทิ้งพรหมจรรย์"
 game_concept_abandon_celibacy_decision:0 "การตัดสินใจละทิ้งพรหมจรรย์"
