 game_concept_culture_festival:0 "เทศกาลวัฒนธรรม"
 game_concept_cultural_festival_desc:0 "[activity_phase|E] ในระหว่าง [royal_tour|E] ซึ่ง [vassal|E] คาดว่าจะให้ความบันเทิงแก่ [liege|E] ของตน ซึ่งมัก ส่งผลให้ [county_opinion|E] และ [cultural_acceptance|E] เพิ่มขึ้น"
 game_concept_cultural_festival:0 "เทศกาลวัฒนธรรม"
 game_concept_cultural_festivals:0 "เทศกาลวัฒนธรรม"
 game_concept_culture_festivals:0 "เทศกาลวัฒนธรรม"
 game_concept_hosted_dinner:0 "งานเลี้ยงอาหารค่ำ"
 game_concept_hosted_dinner_desc:0 "[activity_phase|E] ในระหว่าง [royal_tour|E] ซึ่ง [vassal|E] คาดว่าจะให้ความบันเทิงแก่ [liege|E] ของตน ซึ่งมัก ส่งผลให้เกิดการสร้าง [hooks|E] และ [relations|E] ร่วมกันเพิ่มขึ้น"
 game_concept_hosted_dinners:0 "งานเลี้ยงอาหารค่ำ"
 game_concept_host_a_dinner:0 "จัดงานเลี้ยงอาหารค่ำ"
 game_concept_tour_the_grounds:0 "เยี่ยมชมพื้นที่"
 game_concept_tour_the_grounds_desc:0 "[activity_phase|E] ในระหว่าง [royal_tour|E] ซึ่ง [vassal|E] ได้รับการเยี่ยมเยียนจาก [liege|E] ของตน ซึ่งมัก ส่งผลให้ [control|E] ใน [counties|E] ของพวกเขาเพิ่มขึ้น"
 game_concept_touring_the_grounds:0 "การเยี่ยมชมพื้นที่"
 game_concept_tour_of_the_grounds:0 "การเยี่ยมชมพื้นที่"
 game_concept_tour_grounds:0 "เยี่ยมชมพื้นที่"
 game_concept_tour_stop:0 "จุดแวะพักในการเดินทางเยือน"
 game_concept_tour_stop_desc:0 "[activity_phase|E] ในระหว่าง [royal_tour|E] ซึ่งเจ้าเหนือหัวสามารถ: เข้าร่วม [hosted_dinner|E], [tour_the_grounds|E] ของ [vassal|E] ของตน หรือเพลิดเพลินกับ [cultural_festival|E]"
 game_concept_stop:0 "จุดแวะพัก"
 game_concept_stops:0 "จุดแวะพัก"
 game_concept_tour_stops:0 "จุดแวะพักในการเดินทางเยือน"
 game_concept_tour_success:0 "ความสำเร็จของการเดินทางเยือน"
 game_concept_tour_success_desc:0 "ค่าที่กำหนดว่าคุณจะได้รับรางวัลใดเมื่อสิ้นสุด [grand_tour|E] ของคุณ คุณสามารถได้รับและเสียคะแนนโดยการเลือกตัวเลือกบางอย่างเมื่อเริ่มต้นการเดินทางเยือนของคุณและตัดสินใจที่สอดคล้องกับ [tour_type|E] ของคุณ"
 game_concept_tour_success_points:0 "คะแนนความสำเร็จของการเดินทางเยือน"
 game_concept_tour_success_point:0 "คะแนนความสำเร็จของการเดินทางเยือน"
 game_concept_tour_type:0 "ประเภทการเดินทางเยือน"
 game_concept_tour_type_desc:0 "ตัวเลือกที่กำหนดประเภทของ [tour|E] ที่คุณกำลังมีและรางวัลที่คุณได้รับ ประเภทการเดินทางเยือน ได้แก่ [majesty_tour|E], [intimidation_tour|E], และ [taxation_tour|E]"
 game_concept_majesty_tour:0 "การเดินทางเยือนเพื่อบารมี"
 game_concept_majesty_tour_desc:0 "[tour_type|E] ซึ่งคุณพยายามโน้มน้าว [vassals|E] ของคุณโดยการเพิ่ม [opinion|E] ของพวกเขา"
 game_concept_intimidation_tour:0 "การเดินทางเยือนเพื่อข่มขู่"
 game_concept_intimidation_tour_desc:0 "[tour_type|E] ซึ่งคุณพยายามข่มขู่ [vassals|E] ของคุณ ได้รับ [dread|E] และบังคับให้พวกเขาออกจาก [factions|E]"
 game_concept_taxation_tour:0 "การเดินทางเยือนเพื่อเก็บภาษี"
 game_concept_taxation_tour_desc:0 "[tour_type|E] ซึ่งคุณพยายามดึงความมั่งคั่งจาก [vassals|E] ของคุณ ได้รับ [gold|E]"

 game_concept_accolade:0 "เครื่องยศ"
 game_concept_accolade_possessive: "ของเครื่องราชอิสริยาภรณ์"
 game_concept_accolades:0 "เครื่องยศ"
 game_concept_acclaimed: "ได้รับการยกย่อง"
 game_concept_accolade_desc:5 "เครื่องราชอิสริยาภรณ์คือเกียรติยศที่มอบให้แก่ [knights|E] โดย [liege|E] ของตน\n\nอัศวินผู้ครอบครองเครื่องราชอิสริยาภรณ์จะกลายเป็น [acclaimed_knight|E]\n\nเมื่ออัศวินผู้ได้รับการยกย่องได้รับ [glory|E] ทักษะ (Aptitude) ของ [accolade_squires|E] ก็จะเพิ่มขึ้น (ช่วยพัฒนา [accolade_succession|E]) และอาจได้รับ [accolade_ranks|E] ซึ่งจะช่วยปลดล็อก [accolade_types|E] เพิ่มเติมและมอบโบนัสที่แข็งแกร่งยิ่งขึ้น\n\nเมื่ออัศวินผู้ได้รับการยกย่องสิ้นชีพ [accolade_succession|E] ก็จะบังเกิดขึ้น และอัศวินผู้นั้นจะถูกแทนที่ด้วยผู้สืบทอดโดยทันที ซึ่งทักษะของพวกเขาจะถูกปรับปรุงโดย ทักษะ ของ [accolade_squires|E]\n\n[innovations|e] และ [title_tiers|e] ที่สูงกว่า จะเปิดโอกาสให้ [rulers|E] สามารถมีเครื่องราชอิสริยาภรณ์ในครอบครองได้มากขึ้นในคราวเดียวกัน"

 game_concept_acclaimed_knight:0 "อัศวินผู้ได้รับเครื่องยศ"
 game_concept_acclaimed_knights:0 "อัศวินผู้ได้รับเครื่องยศ"
 game_concept_acclaimed_knight_possessive: "ของอัศวินผู้ได้รับการยกย่อง"
 game_concept_acclaimed_knight_desc:1 "[knight|E] ผู้ครอบครอง [accolade|E]\n\nเพื่อให้เป็นอัศวินผู้ได้รับการยกย่อง อัศวินจะต้องเป็น [unlanded|E] หรือ [baron|E] โดยมี [prowess|E] อย่างน้อย [EmptyScope.ScriptValue('accolade_prowess_requirement_value')|0V] อัศวินผู้ได้รับการยกย่องจะต้องมีคุณสมบัติเหมาะสมสำหรับ [accolade_type|E] อย่างน้อยหนึ่งประเภทที่อัศวินผู้ได้รับการยกย่องคนอื่นของ [liege|e] ไม่ได้ครอบครองอยู่\n\nอัศวินผู้ได้รับการยกย่องมีโอกาสถูกสังหารหรือถูกจับเป็นเชลยในการรบน้อยกว่า พวกเขาอาจเพิ่ม [glory|E] ของตนได้เป็นหลักด้วยการต่อสู้ใน [wars|E] และเข้าร่วม [activities|E] เช่น [GetActivityType( 'activity_tournament' ).GetName]\n\nอัศวินผู้ได้รับการยกย่องอาจได้รับ [skills|E] และ [traits|E] ที่เกี่ยวข้องกับคุณลักษณะแห่งเครื่องราชอิสริยาภรณ์ของตนเป็นครั้งคราว"

 game_concept_accolade_type:0 "คุณลักษณะเครื่องยศ"
 game_concept_accolade_types:0 "คุณลักษณะเครื่องยศ"
 game_concept_accolade_type_desc:1 "[accolade|E] มีคุณลักษณะได้สูงสุด #value 3#! ประการ ซึ่งจะมอบโบนัสที่ปรับขนาดขึ้นเมื่อปลดล็อกระดับที่สูงขึ้น คุณลักษณะแต่ละประการมี #value 3#! ระดับ เมื่อเครื่องราชอิสริยาภรณ์เพิ่ม [accolade_rank|E] เจ้าของอาจเลือกเพิ่มระดับของคุณลักษณะที่มีอยู่ หรือเพิ่มคุณลักษณะใหม่ให้กับเครื่องราชอิสริยาภรณ์ อย่างไรก็ตาม [acclaimed_knight|E] จะต้องมีคุณสมบัติครบถ้วนตามข้อกำหนดของคุณลักษณะใหม่นั้น\n\n[knight|E] แต่ละคนมีคุณสมบัติเหมาะสมสำหรับคุณลักษณะบางประการเท่านั้น ซึ่งอาจอิงตาม [traits|E], [skills|E] หรือประสบการณ์ที่ปลดล็อกได้ขณะรับใช้ในฐานะอัศวิน\n\nเครื่องราชอิสริยาภรณ์ทุกชิ้นจะต้องมีคุณลักษณะเฉพาะตัว: ผู้นำ #high ไม่สามารถ#! สร้างคุณลักษณะที่ซ้ำกันระหว่างเครื่องราชอิสริยาภรณ์แต่ละชิ้นได้ และเครื่องราชอิสริยาภรณ์แต่ละชิ้นสามารถเชี่ยวชาญในคุณลักษณะประเภท [men_at_arms|E] ได้เพียง #value 1#! ประการเท่านั้น"

 game_concept_accolade_succession:0 "การสืบทอดเครื่องยศ"
 game_concept_accolade_succession_desc:1 "การสืบทอดเครื่องราชอิสริยาภรณ์จะเกิดขึ้นเมื่อ [acclaimed_knight|e] ผู้ครอบครอง [accolade_possessive|E] สิ้นชีพหรือกลายเป็นผู้ทุพพลภาพ\n\nอัศวินผู้ได้รับการยกย่องคนเดิมจะถูกแทนที่ทันที [courtiers|E] อายุเยาว์และ [knights|E] ที่ได้รับการฝึกฝนอันเนื่องมาจากทักษะของ [accolade_squires|E] แห่งเครื่องราชอิสริยาภรณ์ จะได้รับการพิจารณาให้เป็นผู้สืบทอดก่อนเป็นอันดับแรก จากนั้นจึงเป็นอัศวินคนอื่นๆ, ข้าราชสำนักคนอื่นๆ, ผู้พเนจร และสุดท้ายคือ [characters|E] ที่สร้างขึ้นใหม่ โดยอิงตามทักษะของ [accolade_squires|E] ของเครื่องราชอิสริยาภรณ์ อัศวินคนใหม่จะได้รับ [prowess_skill|E], [martial_skill|E] เพิ่มขึ้น, ได้รับ [trait_level_track_xp|E] ในสาย [GetTrait('tourney_participant').GetName( GetNullCharacter )] และอาจได้รับ [skills|E] อื่นๆ\n\nหลังจากการสืบทอดเครื่องราชอิสริยาภรณ์ [glory|E] อาจสูญเสียไปเล็กน้อย และทักษะของ [accolade_squires|E] จะถูกรีเซ็ตเพื่อให้สะท้อนถึงทักษะและประสบการณ์ของอัศวินผู้ได้รับการยกย่องคนใหม่\n\nหากอัศวินผู้ได้รับการยกย่องตายในสมรภูมิ, การดวล หรือด้วยวิธีที่มีเกียรติอื่นๆ จะไม่ทำให้สูญเสียเกียรติยศ และจะช่วยพัฒนาทักษะของผู้ติดตามเครื่องราชอิสริยาภรณ์นั้นด้วย"

 game_concept_accolade_rank:0 "ระดับเครื่องยศ"
 game_concept_accolade_ranks:0 "ระดับเครื่องยศ"
 game_concept_accolade_rank_short:0 "ระดับ"
 game_concept_accolade_rank_desc:1 "[accolade|e] มี #value 6#! ระดับขั้น ซึ่งเปิดโอกาสให้เจ้าของสามารถปลดล็อกและพัฒนาโบนัสของ [accolade_type|e] ได้ เช่น [knight_army_modifiers|e]\n\nการได้รับ [glory|E] จะปลดลอกแต่ละระดับขั้น ในขณะที่การสูญเสียเกียรติยศอาจทำให้สูญเสียระดับขั้นเหล่านั้นไป เมื่อเครื่องราชอิสริยาภรณ์สูญเสียระดับขั้นไป ระดับหนึ่งของ [accolade_type|E] หนึ่งระดับจะถูกปิดใช้งาน การได้รับระดับขั้นคืนมาจะทำให้คุณลักษณะและโบนัสของมันกลับมาใช้งานได้อีกครั้ง"

 game_concept_glory:0 "เกียรติภูมิ"
 game_concept_glory_desc:1 "เกียรติยศของ [accolade_possessive|E] จะเพิ่ม [accolade_rank|E] ของมัน\n\nเกียรติยศจะได้รับเมื่อ [acclaimed_knight|E] ชนะใน [battles|E], เอาชนะนักรบ, แข่งขันใน [contests|E] ของ [GetActivityType( 'activity_tournament' ).GetName], และเข้าร่วม [activities|E]\n\nอย่างไรก็ตาม เกียรติยศของเครื่องราชอิสริยาภรณ์จะลดลงเมื่ออัศวินผู้ได้รับการยกย่องเข้าไปพัวพันกับสมรภูมิที่พ่ายแพ้ และอาจลดลงได้เช่นกันในการ [accolade_succession|E] หากอัศวินผู้ได้รับการยกย่องไม่ได้ตายในสมรภูมิ, การดวล, หรือในรูปแบบที่มีเกียรติอื่นๆ"

 game_concept_accolade_squires: "ผู้ติดตามอัศวิน"
 game_concept_accolade_squire: "ผู้ติดตามอัศวิน"
 game_concept_accolade_squires_desc: "[accolade|E] แต่ละชิ้นมีมาตรวัดทักษะ (Aptitude) ของผู้ติดตาม ซึ่งจะปรับปรุง [traits|E] และ [skills|E] (โดยเฉพาะอย่างยิ่ง [prowess_skill|E], [martial_skill|E] และ [trait_level_track_xp|E] ในสาย [GetTrait('tourney_participant').GetName( GetNullCharacter )]) ของ [acclaimed_knight|E] คนถัดไป\n\nทักษะของผู้ติดตามมี 5 ระดับ:\n$EFFECT_LIST_BULLET$ชำนาญการ (Accomplished)\n$EFFECT_LIST_BULLET$มีความสามารถ (Capable)\n$EFFECT_LIST_BULLET$ขาดประสบการณ์ (Inexperienced)\n$EFFECT_LIST_BULLET$ไร้ความรับผิดชอบ (Feckless)\n$EFFECT_LIST_BULLET$น่าสมเพช (Pathetic)\n\nการมีทักษะระดับขาดประสบการณ์ขึ้นไป จะทำให้อัศวินผู้ได้รับการยกย่องส่งอิทธิพลต่อ [traits|E] และ [skills|E] ของ [courtiers|E] อายุเยาว์ที่เป็นเพศที่สามารถร่วมรบได้เป็นครั้งคราว ซึ่งจะให้ความสำคัญแก่พวกเขาในการเข้ารับเครื่องราชอิสริยาภรณ์เมื่อมีการ [accolade_succession|E]\n\nผู้ติดตามจะได้รับการพัฒนาเป็นหลักจากการได้รับ [glory|E] แต่ก็ได้รับจาก:\n$EFFECT_LIST_BULLET$[prowess_skill|E] ของอัศวินผู้ได้รับการยกย่อง\n$EFFECT_LIST_BULLET$[martial_skill|E] ของอัศวินผู้ได้รับการยกย่อง\n$EFFECT_LIST_BULLET$อัศวินผู้ได้รับการยกย่องได้รับ [trait_level_track_xp|E] สาย [GetTrait('tourney_participant').GetName( GetNullCharacter )]\n$EFFECT_LIST_BULLET$อัศวินผู้ได้รับการยกย่องได้รับ [trait_level_track_xp|E] สาย [GetTrait('lifestyle_blademaster').GetName( GetNullCharacter )]\n$EFFECT_LIST_BULLET$[martial_skill|E] ของ [liege|E] แห่งเครื่องราชอิสริยาภรณ์\n$EFFECT_LIST_BULLET$[prowess_skill|E] ของ [liege|E] แห่งเครื่องราชอิสริยาภรณ์\n\nทุกครั้งที่มีการ [accolade_succession|E] จะเป็นการรีเซ็ตผู้ติดตามของเครื่องราชอิสริยาภรณ์นั้น"

 game_concept_tax_collector: "เจ้าพนักงานเก็บภาษี"
 game_concept_tax_collector_desc: "$game_concept_tax_collector$ ช่วยให้ [tax_jurisdictions|E] ทำงานได้\n\n[aptitude|E] ของพวกเขากำหนดจำนวน [taxes|E] และ [levies|E] ที่พวกเขารวบรวมให้กับ [liege|E] ของตน"
 game_concept_tax_collectors: "เจ้าพนักงานเก็บภาษี"

 game_concept_tax_decree: "กฤษฎีกาภาษี"
 game_concept_tax_decree_desc: "แต่ละ [tax_jurisdiction|E] สามารถมี $game_concept_tax_decree$ ที่แตกต่างกัน ซึ่งแก้ไข [taxes|E] และ [levies|E] ที่ [taxpayers|E] ของตนส่งมอบ\n\n$game_concept_tax_decrees$ มักจะเปลี่ยนแปลง [obligations|E] เพื่อแลกกับบทลงโทษหรือผลประโยชน์อื่น"
 game_concept_tax_decrees: "กฤษฎีกาภาษี"

 game_concept_tax_jurisdiction: "เขตอำนาจการเก็บภาษี"
 game_concept_tax_jurisdictions: "เขตอำนาจการเก็บภาษี"
 game_concept_tax_jurisdiction_desc: "$game_concept_tax_jurisdiction$ คือกลุ่มของ [taxpayers|E] ที่ประกอบด้วย [vassals|E] ของ [clan|E] แต่ละ $game_concept_tax_jurisdiction$ รองรับ $game_concept_taxpayers$ ได้สูงสุด #V 12#! คน\n\nแต่ละ $game_concept_tax_jurisdiction$ สามารถมี [tax_decree|E] ได้\n\nจำนวน $game_concept_tax_jurisdictions$ ที่มีอยู่ถูกกำหนดโดย [rank|E], [traditions|E], และ [innovations|E]\n\n$game_concept_tax_jurisdiction$ ต้องการให้มีการ แต่งตั้ง [tax_collector|E]"
 
 game_concept_untaxed_jurisdiction: "เขตอำนาจที่ไม่ได้เก็บภาษี"
 game_concept_untaxed_jurisdictions: "เขตอำนาจที่ไม่ได้เก็บภาษี"
 game_concept_untaxed_jurisdiction_short: "ไม่ได้เก็บภาษี"
 game_concept_untaxed_jurisdiction_desc: "$game_concept_untaxed_jurisdiction$ คือ [tax_jurisdiction|E] ที่มี [taxpayers|E] แต่ไม่มี [tax_collector|E] ซึ่งหมายความว่า $game_concept_taxpayers$ ที่ได้รับมอบหมายจะไม่ให้ [taxes|E] หรือ [levies|E] ใดๆ แก่ [liege|E] ของตน"
 
 game_concept_taxpayer: "ผู้เสียภาษี"
 game_concept_taxpayers: "ผู้เสียภาษี"
 game_concept_taxpayer_desc: "$game_concept_taxpayers$ คือ [vassals|E] ของ [clan|E] ที่ได้รับมอบหมายให้ [tax_jurisdiction|E] และจะส่งมอบรายได้ [tax|E] และ [levies|E] รายเดือนตราบเท่าที่มีการ แต่งตั้ง [tax_collector|E]"
 game_concept_taxpayer_i: "@tax_collector_icon!"
 
 game_concept_unassigned_vassal: "ข้าหลวงที่ไม่ได้เก็บภาษี"
 game_concept_unassigned_vassals: "ข้าหลวงที่ไม่ได้เก็บภาษี"
 game_concept_unassigned_vassal_short: "ไม่ได้เก็บภาษี"
 game_concept_unassigned_vassal_desc: "$game_concept_unassigned_vassals$ คือ [vassals|E] ของ [clan|E] ที่ไม่ได้รับมอบหมายให้ [tax_jurisdiction|E] ในฐานะ [taxpayers|E] และ ดังนั้นจึงไม่ส่งมอบ [taxes|E] หรือ [levies|E]\n\nเมื่อได้รับมอบหมายให้ $game_concept_tax_jurisdiction$ ที่มี [tax_collector|E] พวกเขาจะเริ่มจ่ายรายเดือน"

 game_concept_retinue_maa:0 "ทหารอาชีพองครักษ์"
 game_concept_retinue_maa_desc:0 "[accolade_types|E] บางประเภทมอบสิทธิ์ในการเข้าถึง [men_at_arms|E] พิเศษ พวกมันจะถูกปลดลอกโดยการมี [acclaimed_knight|E] ที่มีความคืบหน้าใน [trait_level_track|E] ของ [GetTrait('tourney_participant').GetName( GetNullCharacter )] ที่เกี่ยวข้อง หรือมี [commander_trait|E] ที่เกี่ยวข้อง\n\n$game_concept_men_at_arms$ แบบผู้ติดตาม จะถูกจำกัดไว้ที่ [regiment|E] เดียว พวกเขามีประสิทธิภาพมากกว่าในการต่อต้าน $game_concept_men_at_arms$ อื่นๆ ถึงสองเท่า"

 game_concept_knight_army_modifier:0 "ตัวปรับ แต่งกองทัพอัศวิน"
 game_concept_knight_army_modifiers:0 "ตัวปรับ แต่งกองทัพอัศวิน"
 game_concept_knight_army_modifier_desc:0 "ผลกระทบที่ใช้กับ [army|e] ใดๆ ที่ #high มี#! [acclaimed_knight|e] ที่เกี่ยวข้องอยู่\n\n[knight|e] #high ไม่จำเป็นต้อง#! เป็น [commander|e] ของกองทัพ เพื่อให้ตัวปรับ แต่งกองทัพอัศวินของพวกเขามีผล"

 game_concept_piety_level_impact:0 "ผลกระทบระดับความศรัทธา"
 game_concept_piety_level_impact_desc:0 "ผลกระทบระดับความศรัทธาจะเพิ่มหรือลด [modifiers|E] ที่ได้รับจาก [piety_level|E] ปัจจุบันของคุณ"

 game_concept_prestige_level_impact:0 "ผลกระทบระดับชื่อเสียง"
 game_concept_prestige_level_impact_desc:0 "ผลกระทบระดับชื่อเสียงจะเพิ่มหรือลด [modifiers|E] ที่ได้รับจาก [prestige_level|E] ปัจจุบันของคุณ"

 game_concept_hostage: "ตัวประกัน"
 game_concept_hostages: "ตัวประกัน"
 game_concept_hostages_possessive: "ของตัวประกัน"
 game_concept_hostage_desc: "[close_family_member|E] ของ [ruler|E] ที่ถูกส่งไปจาก [home_court|E] ของตนเพื่อเป็นหลักประกันสันติภาพหรือการยอมจำนน\n\nชื่อเสียงของ $game_concept_rulers$ ที่ประกาศ [war|E] แม้จะส่งหรือรับ $game_concept_hostage$ จะเสียหายอย่างมาก และ $game_concept_wardens$ อาจประหาร $game_concept_hostages$ ของศัตรูได้อย่างอิสระ\n\n$game_concept_hostages$ ที่ได้รับการปฏิบัติอย่างดีมีแนวโน้มที่จะภักดีต่อ $game_concept_warden$ ของตน ซึ่งอาจได้รับ [hook|E] หรือแม้กระทั่งกลายเป็น [friends|E] กับพวกเขา\n\n$game_concept_hostages$ ต้องเป็นเด็กที่ไม่มีที่ดิน พี่น้อง หลานชาย หลานสาว หรือหลานปู่หลานย่าของ $game_concept_ruler$ ของ $game_concept_home_courts_possessive$\n\n$game_concept_wardens$ มีโอกาสที่จะได้รับ [perpetual_hook|E] ต่อ $game_concept_hostage$ ที่เป็นเด็กเมื่อพวกเขาบรรลุนิติภาวะ โดยพิจารณาจากบุคลิกภาพ ความเห็น และจำนวนปีที่ใช้ในราชสำนักของ $game_concept_wardens$"

 game_concept_home_court: "ราชสำนักเดิม"
 game_concept_home_courts: "ราชสำนักเดิม"
 game_concept_home_courts_possessive: "ของราชสำนักเดิม"
 game_concept_home_court_desc: "[ruler|E] ที่เป็น [close_family_member|E] ของ [hostage|E] และได้ส่งพวกเขาไปยัง [warden|E] เพื่อเป็นหลักประกันสันติภาพหรือการยอมจำนน"

 game_concept_warden: "ผู้ดูแลตัวประกัน"
 game_concept_wardens: "ผู้ดูแลตัวประกัน"
 game_concept_wardens_possessive: "ของผู้ดูแลตัวประกัน"
 game_concept_warden_desc: "[ruler|E] ที่ได้รับ [hostage|E] จาก [home_court|E] ต่างแดนเพื่อเป็นหลักประกันสันติภาพหรือการยอมจำนน\n\n[warden|E] จะสะสม [prestige_i|E][prestige|E] เมื่อเวลาผ่านไปสำหรับ [hostage|E] แต่ละคนที่อยู่ใน [court|E] ของตน"
 
 game_concept_goliardic_shenanigans: "การเล่นตลกแบบโกเลียร์ด"
 game_concept_goliardic_shenanigans_desc: "ตัวละครใน [GetActivityType('activity_adult_education').GetName] สามารถก่อเรื่องยุ่งเหยิงได้ทุกประเภทเมื่อยอมรับชีวิตนักศึกษา ผลที่ตามมาของการผจญภัยของพวกเขานั้นคาดเดาไม่ได้ และ รวมถึงคะแนน [skill|E], [traits|E] ด้านวิถีชีวิตและความเครียด, ประสบการณ์วิถีชีวิต, โรคภัยไข้เจ็บ และบาดแผล"

 game_concept_adoption: "การรับเลี้ยงบุตรบุญธรรม"
 game_concept_adopt: "รับเลี้ยง"
 game_concept_adopts: "รับเลี้ยง"
 game_concept_adopting: "กำลังรับเลี้ยง"
 game_concept_adopted: "รับเลี้ยงแล้ว"
 game_concept_adoption_desc: "การรับเลี้ยงบุตรบุญธรรมคือการนำ [character|E] อื่นเข้ามาใน [house|E] และ [dynasty|E] ของคุณ"

 
 game_concept_legitimacy: "ความชอบธรรม"
 game_concept_legitimacy_desc: "$game_concept_legitimacy$ คือการแสดงออกถึงสิทธิ์ในการปกครองของ [ruler|E] [vassals|E] ยังสร้าง [legitimacy_expectations|E] ที่ [liege|E] ควรจะตอบสนอง\n\nเฉพาะ [rulers|E] เท่านั้นที่มี $game_concept_legitimacy$ ซึ่งคำนวณ ในขณะที่พวกเขากลายเป็นผู้ปกครองและ ส่งผลให้เกิด [initial_legitimacy|E] ของพวกเขา ส่วนหนึ่งของ $game_concept_legitimacy$ ของผู้ปกครองคนก่อนหน้าจะถูกสืบทอดโดย [heir|E] ของพวกเขาด้วย\n\n$game_concept_legitimacy$ ส่งผลกระทบต่อระบบเกมหลายอย่าง ทำให้ข้อเสนอ [marriage|E], [vassalization|E] และ [alliances|E] มีแนวโน้มที่จะได้รับการยอมรับมากขึ้น และ [claims|E] ถูกลง เช่นเดียวกับการแกว่ง [scales_of_power|E] ใน [regency|E]\n\n$game_concept_legitimacy$ มี 5 [legitimacy_levels|E] และระดับล่างสุด #weak ไม่ชอบธรรม#! หนึ่งระดับ[AddLocalizationIf( GetPlayer.GetGovernment.HasGovernmentFlag( 'government_is_nomadic' ), 'game_concept_legitimacy_desc_nomadic' )]"
 game_concept_legitimacy_i: "[GetLocalPlayerLegitimacyTextIcon]"
 game_concept_legitimacy_desc_nomadic: "\n\n[rulers|E] แบบ [GetGovernment( 'nomad_government' ).GetName] มีประเภท $game_concept_legitimacy$ พิเศษ ซึ่งเป็นอิสระจาก [rank|E] ของพวกเขา"
 game_concept_legitimacy_desc_mandala: "\n\n[rulers|E] [GetGovernment( 'mandala_government' ).GetName] มี $game_concept_legitimacy$ ประเภทพิเศษ ซึ่งไม่ขึ้นอยู่กับ [rank|E] ของตนและมีระดับเพิ่มเติม"
 
 game_concept_legitimacy_level: "ระดับความชอบธรรม"
 game_concept_legitimacy_level_desc: "$game_concept_legitimacy_levels$ สามารถได้รับผ่านวิธีการต่างๆ: การชนะ [wars|E], การปล่อย [valuable_prisoners|E], การสร้าง [legends|E], การจัด [court|E], หรือการเข้าร่วม [activities|E]\n\nอย่างไรก็ตาม พวกมันก็สามารถสูญเสียได้ เช่นกัน: [epidemics|E] ที่ทำลายล้าง [capital|E], การแพ้สงคราม (โดยเฉพาะสงคราม [faction|E]), การสูญเสีย [titles|E], หรือ [hostile_scheme|E] ที่ถูกเปิดเผย เป็นวิธีหลักบางประการที่ ทำให้ $game_concept_legitimacy$ ลดลง[AddLocalizationIf( GetPlayer.GetGovernment.HasGovernmentFlag( 'government_is_nomadic' ), 'game_concept_legitimacy_level_desc_nomadic' )]"
 game_concept_legitimacy_levels: "ระดับความชอบธรรม"
 game_concept_legitimacy_gain: "การได้รับความชอบธรรม"
 game_concept_legitimacy_level_desc_nomadic: "\n\nผู้ปกครองแบบ [GetGovernment( 'nomad_government' ).GetName] ได้รับความชอบธรรมเพิ่มขึ้น #V 50%#! จากการชนะสงคราม แต่พวกเขาก็สูญเสียเป็นสองเท่าเมื่อพ่ายแพ้ พวกเขายังจะได้รับความชอบธรรมจาก [single_combat_duel_plural|E] และการ แต่งงานกับ [courtiers|E] ผู้เกิดในตระกูลสูงศักดิ์ของผู้ที่มี [dominance|E] เท่ากันหรือสูงกว่า"
 
 game_concept_expected_legitimacy: "ความชอบธรรมที่คาดหวัง"
 game_concept_expected_legitimacy_desc: "[legitimacy_level|E] ที่ [vassals|E] คาดหวังจาก [ruler|E] ของตน โดยพิจารณาจากความสัมพันธ์ทางประวัติศาสตร์ของพวกเขา ปัจจัยบางอย่างที่ลดความคาดหวังคือ:\n$BULLET_WITH_TAB$การเป็น [liege|E] โดย [de_jure|E] ของข้าหลวง\n$BULLET_WITH_TAB$การเป็นส่วนหนึ่งของ [close_family|E] ของข้าหลวง\n$BULLET_WITH_TAB$การเป็น [preferred_heir|E] ของข้าหลวง\n$BULLET_WITH_TAB$การเป็น [dynasty|E] เดียวกันที่ข้าหลวงได้รับใช้มานานกว่า #color_white 50#! ปี\n$BULLET_WITH_TAB$ข้าหลวงไม่ใช่ [powerful_vassal|E]\n\nหากระดับจริงต่ำกว่าความคาดหวังของพวกเขา พวกเขาอาจกลายเป็นคนหัวแข็ง: [opinion|E] ของพวกเขาจะต่ำลงและพวกเขาอาจเข้าร่วม [factions|E] ต่อต้าน [liege|E] ของตน\n\nความคาดหวังจะเพิ่มขึ้นตามระดับของ [primary_title|E] ของพวกเขา เช่นเดียวกับ [era|E]"
 game_concept_legitimacy_expectations: "ความคาดหวังความชอบธรรม"
 game_concept_legitimacy_expectations_desc: "$game_concept_expected_legitimacy_desc$"
 
 game_concept_initial_legitimacy: "ความชอบธรรมเริ่มต้น"
 game_concept_initial_legitimacy_desc: "$game_concept_legitimacy$ ที่ [character|E] มีเมื่อพวกเขาได้ครองที่ดิน\n\nมันคำนวณจาก [dynasty_prestige_level|E], ความสัมพันธ์กับผู้ปกครองคนก่อนหน้า, [court_grandeur|E], เพศ, [bastardy|E], จำนวนปีที่เป็น [ruler|E], [legitimacy|E] [dynasty_perk|E], [diplomacy|E], [virtues|E], [sins|E] และ [traits|E] พิเศษอื่นๆ เช่น [GetTrait('sayyid').GetName( GetNullCharacter )], [GetTrait('diplomat').GetName( GetNullCharacter )] และ [GetTrait('just').GetName( GetNullCharacter )]\n\n[heirs|E] จะสืบทอด [GetDefine( 'NCharacter', 'LEGITIMACY_INHERITED' )|V%^] ของ $game_concept_legitimacy$ ของผู้ปกครองคนก่อนหน้าหากสืบทอด [title|E] ที่มี [title_tier|E] สูงกว่า"
 
 game_concept_court_position_task_short: "ภารกิจ"
 game_concept_court_position_task_short_desc: "$game_concept_court_position_task_desc$"
 game_concept_court_position_tasks_short: "ภารกิจ"
 game_concept_court_position_tasks_short_desc: "$game_concept_court_position_task_desc$"
 game_concept_court_position_task: "ภารกิจตำแหน่งในราชสำนัก"
 game_concept_court_position_tasks: "ภารกิจตำแหน่งในราชสำนัก"
 game_concept_court_position_tasks_desc: "$game_concept_court_position_task_desc$"
 game_concept_court_position_task_desc: "[court_positions|E] บางตำแหน่งสามารถปฏิบัติภารกิจเพิ่มเติมได้ ซึ่งมักจะให้ผลประโยชน์มากขึ้นโดยมีค่าใช้จ่ายเพิ่มเติม\n\nสามารถมีภารกิจที่ใช้งานได้เพียงภารกิจเดียวต่อ [court_position|E] ใน แต่ละครั้ง"

 game_concept_fatalities: "ผู้เสียชีวิต"
 game_concept_fatalities_desc: "[characters|E] ที่เสียชีวิตอันเป็นผลโดยตรงจาก [epidemic|E] หรือ [natural_disaster|E]"
 game_concept_funeral: "งานศพ"
 game_concept_funeral_desc: "[activity|E] ซึ่ง [host|E] เชิญ [characters|E] ต่างๆ มาแสดงความเคารพหลังจากการ [character_death|E] ล่าสุด งานศพมัก ส่งผลให้ [legitimacy|E] เพิ่มขึ้น [stress|E] ลดลง และโอกาสในการแสดง [piety|E]"
 game_concept_funerals: "งานศพ"

 game_concept_scheme_group_calculating: "การคำนวณ"
 game_concept_calculating_schemes: "แผนการคำนวณ"
 game_concept_scheme_group_calculating_desc: "$game_concept_calculating_schemes$ เกี่ยวข้องกับการกระทำที่ไตร่ตรองไว้ล่วงหน้า โดยทั่วไปจะมีเหตุการณ์สุดท้ายหนึ่งครั้งที่ผู้สมรู้ร่วมคิดลงมือ\n\nสามารถขัดขวางได้ดีที่สุดโดย $game_concept_scheme_countermeasure_countermeasures$ ที่ติดอาวุธ เช่น #V $scheme_countermeasure_type_redouble_guards$#!.\n\nตัวอย่าง ได้แก่:\n$EFFECT_LIST_BULLET$[GetScheme('abduct').GetTypeName]\n$EFFECT_LIST_BULLET$[GetScheme('murder').GetTypeName]\n$EFFECT_LIST_BULLET$[GetScheme('overthrow_regent').GetTypeName]\n$EFFECT_LIST_BULLET$[GetScheme('steal_back_artifact').GetTypeName]"

 game_concept_scheme_group_opportunistic: "ฉวยโอกาส"
 game_concept_opportunistic_schemes: "แผนการฉวยโอกาส"
 game_concept_scheme_group_opportunistic_desc: "$game_concept_opportunistic_schemes$ เกี่ยวข้องกับการกระทำที่เกิดขึ้นเองซ้ำๆ ระหว่าง [characters|E] ที่พบปะกันอย่างไม่เป็นทางการ\n\nสามารถขัดขวางได้ดีที่สุดโดย $game_concept_scheme_countermeasure_countermeasures$ ที่ระแวดระวัง เช่น #V $scheme_countermeasure_type_strengthen_sentries$#!.\n\nตัวอย่าง ได้แก่:\n$EFFECT_LIST_BULLET$[GetScheme('seduce').GetTypeName]\n$EFFECT_LIST_BULLET$[GetScheme('befriend').GetTypeName]\n$EFFECT_LIST_BULLET$[GetScheme('convert_to_witchcraft').GetTypeName]\n$EFFECT_LIST_BULLET$[GetScheme('courting').GetTypeName]\n$EFFECT_LIST_BULLET$[GetScheme('elope').GetTypeName]"

 game_concept_scheme_group_indirect: "ทางอ้อม"
 game_concept_indirect_schemes: "แผนการทางอ้อม"
 game_concept_scheme_group_indirect_desc: "$game_concept_indirect_schemes$ โดยทั่วไปไม่จำเป็นต้องมีปฏิสัมพันธ์กับ [scheme_target|E] ของตนเป็นการส่วนตัวเลย\n\nด้วยเหตุนี้ จึงไม่สามารถตอบโต้ได้อย่างมีประสิทธิภาพ แต่ $game_concept_scheme_countermeasure_countermeasures$ บางอย่างอาจ ทำให้แย่ลงได้\n\nตัวอย่าง ได้แก่:\n$EFFECT_LIST_BULLET$[GetScheme('claim_throne').GetTypeName]\n$EFFECT_LIST_BULLET$[GetScheme('fabricate_hook').GetTypeName]"

 game_concept_scheme_opportunity: "ความได้เปรียบของแผนการ"
 game_concept_scheme_opportunities: "ความได้เปรียบของแผนการ"
 game_concept_scheme_opportunity_opportunity: "ความได้เปรียบ"
 game_concept_scheme_opportunity_opportunities: "ความได้เปรียบ"
 game_concept_scheme_opportunity_i: "@scheme_opportunity_icon!"
 game_concept_scheme_opportunity_desc: "$game_concept_scheme_opportunity_opportunities$ แสดงถึงความคืบหน้าที่เกิดขึ้นเพื่อเป้าหมายของ [scheme|e] สามารถใช้เพื่อโน้มน้าว [agents|e] ให้เข้าร่วม $game_concept_scheme$ หรือเพื่อดำเนินการด้วย [success_chance|e] ที่เพิ่มขึ้น"

 game_concept_favorite_child: "ลูกคนโปรด"
 game_concept_favorite_child_desc: "$game_concept_favorite_child$ คือผู้สืบเชื้อสายโดยตรงของ [dynasty|E] เดียวกันที่ผู้ปกครองที่เป็นผู้เล่นสามารถเลือกที่จะโปรดปรานได้ พวกเขาจะมี [opinion|E] ต่อคุณสูงขึ้น และเมื่อคุณเสียชีวิต คุณสามารถเลือกที่จะสืบทอดมรดกของคุณในฐานะพวกเขา แทนที่จะเป็นทายาทของคุณ\n\nลูกคนโปรดของคุณสามารถเป็นลูก หลาน หรือเหลนคนใดก็ได้ ตราบใดที่พวกเขาอยู่ในราชวงศ์ของคุณ"

 game_concept_scheme_breach_short: "การรั่วไหล"
 game_concept_scheme_breaches_short: "การรั่วไหล"
 game_concept_scheme_breach: "การรั่วไหลของแผนการ"
 game_concept_scheme_breaches: "การรั่วไหลของแผนการ"
 game_concept_scheme_breach_desc: "$game_concept_scheme_breach_short$ เป็นตัวแทนของความยุ่งยากใน [secret_scheme|e] เมื่อ [scheme|e] ถูกละเมิด [success_chance|e] ของมันจะลดลง บทลงโทษของ $game_concept_success_chance$ จะเพิ่มขึ้นตามจำนวน $game_concept_scheme_breach_short$ สะสม เมื่อ $game_concept_scheme$ ใดๆ มี $game_concept_scheme_breaches_short$ ถึง #V 5#! ครั้ง มันจะล้มเหลวโดยอัตโนมัติ\n\n#WEAK นอกจากนี้ $game_concept_schemes$ จะตรวจสอบ $game_concept_secrecy$ ของตนเองด้วยเมื่อในที่สุดมันถูกลงมือปฏิบัติ — การละเมิดจะไม่มีผลใดๆ ต่อการตรวจสอบนี้ไม่ว่าในทางใดก็ทางหนึ่ง#!"

 game_concept_influence_ward_personality: "มีอิทธิพลต่อบุคลิกภาพของผู้อยู่ในอุปถัมภ์"
 game_concept_influence_ward_personality_desc: "[interaction|E] ที่ ซึ่งบุคคลหนึ่งสามารถพยายามมีอิทธิพลต่อ [ward|E] เพื่อให้รับ [personality_trait|E] ที่คล้ายคลึงกับของตนเอง"

 game_concept_faction_commitment: "ความมุ่งมั่นต่อฝ่าย"
 game_concept_faction_commitment_desc: "ความเป็นไปได้ที่ [character|E] จะสนับสนุน [faction|E] ต่อต้าน [liege|E] ของตน\n\nอาจได้รับผลกระทบจากเหตุผลหลายประการ ที่พบบ่อยที่สุดคือ [personality|E], [opinion|E], และ [culture|E]"

 game_concept_state_faith: "ความเชื่อประจำรัฐ"
 game_concept_state_faith_desc: "$game_concept_state_faith$ คือ [faith|E] ที่ได้รับการสนับสนุนและยอมรับโดย [administrative_government|E] ความเชื่อนี้ผูกติดอยู่กับ [title|E] และไม่ใช่กับ [character|E] คนใดคนหนึ่งโดยเฉพาะ การเปลี่ยนศาสนาตัวละครใน [realm|E] ให้เป็นความเชื่อประจำรัฐนั้นง่ายกว่า และยากมากที่จะเปลี่ยนพวกเขาออกจากความเชื่อนั้น\n\nเฉพาะ [ruler|E] ของอาณาจักรแบบบริหารเท่านั้นที่อาจเปลี่ยนความเชื่อประจำรัฐได้ แต่ [governors|E] อาจเปลี่ยนมานับถือได้อย่างอิสระ"

 game_concept_story_cycle: "เรื่องราว"
 game_concept_story_cycles: "เรื่องราว"
 game_concept_story_cycle_desc: "เรื่องราวคือสถานการณ์ส่วนตัวที่ผูกติดอยู่กับ [ruler|E]\n\nมีเรื่องราวหลากหลายรูปแบบ — ตั้งแต่การครอบครอง [GetModifier('dog_story_modifier').GetNameWithTooltip] ไปจนถึงการกลายเป็น #V [GetTrait('conqueror').GetName( GetNullCharacter )]#! เรื่องราวแต่ละเรื่องถูกสร้างขึ้นจากองค์ประกอบที่แตกต่างกัน ซึ่งมักเกี่ยวข้องกับ [characters|E] ที่สำคัญ, [titles|E] หรือ [decisions|E]"

 game_concept_story_generic_prefix: "เรื่องราวของ"
 game_concept_story_generic_desc_boilerplate: "#WEAK เนื้อเรื่องเป็นทางเลือก คุณสามารถเลือกที่จะไม่เล่นได้เสมอเมื่อคุณเริ่มเล่น"
 game_concept_story_content_hereward: "$game_concept_story_generic_prefix$ $bookmark_laamps_hereweard_the_wake$"
 game_concept_story_content_hereward_desc: "#tooltip_heading รูปแบบเรื่องราว: กว้างขวาง#!\n\nในฐานะเฮียร์เวิร์ด การเนรเทศในต่างแดนของคุณจะพิสูจน์ได้ว่าสั้นนัก ด้วยอังกฤษภายใต้แอกของต่างชาติ คุณจะกลับบ้านเพื่อต่อสู้เพื่ออิสรภาพ ล้างชื่อของคุณ และสังหารชาวนอร์มัน\n\nกลไกพิเศษจะทำงานตลอดระยะเวลา โดยบันทึกการต่อต้านของอังกฤษต่อการปกครองของนอร์มัน และเหตุการณ์เรื่องราวตามบทจะเล่นในช่วงเวลานี้ เรื่องราวของคุณจะถึงจุดสูงสุดด้วยความตาย: ของคุณ หรือของศัตรูของคุณ\n\n$game_concept_story_generic_desc_boilerplate$"
 game_concept_story_content_el_cid: "$game_concept_story_generic_prefix$ $bookmark_laamps_el_cid$"
 game_concept_story_content_el_cid_desc: "#tooltip_heading รูปแบบเรื่องราว: เบา#!\n\nในฐานะเอลซิด คุณจะถูกเจ้าเหนือหัวของคุณทอดทิ้งอย่างไม่เป็นธรรม ในการเนรเทศ คุณอาจเลือกที่จะภักดีหรือหาเส้นทางของคุณเอง ในที่สุดจะถึงจุดสูงสุดด้วยการกลับสู่ราชสำนัก #EMP หรือ#! รางวัลสูงสุด — บาเลนเซีย\n\n$game_concept_story_generic_desc_boilerplate$"
 game_concept_story_content_wallada: "$game_concept_story_generic_prefix$ $bookmark_laamps_wallada_bint_al_mustakfi$"
 game_concept_story_content_wallada_desc: "#tooltip_heading รูปแบบเรื่องราว: ปานกลาง#!\n\nในฐานะวัลลาดา คุณจะเพิ่มระดับ [GetTrait('violet_poet').GetName( GetNullCharacter )] ที่สร้างขึ้นเฉพาะโดยการเขียนบทกวีและก่อตั้งสมาคมวรรณกรรมทั่วโลก ปรับปรุงตำราเฉพาะตัวเมื่อคุณก้าวหน้า\n\nบทสรุปของเรื่องราวของคุณนั้นน่าทึ่งเท่าที่คุณเลือกที่จะ ทำให้เป็น แต่ถึงแม้จะไม่มีบุตร คุณจะได้รับวิธีที่จะเล่นต่อไป\n\n$game_concept_story_generic_desc_boilerplate$"
 game_concept_story_content_hasan: "$game_concept_story_generic_prefix$ $bookmark_laamps_hassan_sabbah$"
 game_concept_story_content_hasan_desc: "#tooltip_heading รูปแบบเรื่องราว: ปานกลาง#!\n\nในฐานะฮะซัน คุณจะถูกนำทางไปตามเส้นทางของความคลั่งไคล้ศาสนา เลือกสถานที่ที่จะนำแสงสว่างแห่งศรัทธาที่แท้จริงไปสู่และเปลี่ยนศาสนา [counties|E] ออกจากใต้การปกครองของ [rulers|E] ของพวกเขา\n\nในที่สุด เรื่องราวของคุณจะถึงจุดสูงสุดด้วยการลุกฮือทางศาสนาครั้งใหญ่ต่อต้านศัตรูที่คุณเลือก\n\n$game_concept_story_generic_desc_boilerplate$"
 
 game_concept_harrying_widget_i: "@harrying_widget!"
 game_concept_harrying_widget: "@harrying_widget! การกวาดล้างภาคเหนือ"
 game_concept_harrying_widget_desc: "ผู้ปกครองชาวนอร์มันและขุนนางแองโกล-แซกซอนที่เพิ่งถูกปลดอำนาจกำลังต่อสู้อย่างดุเดือดเพื่อควบคุมอังกฤษ การแข่งขัน เช่นนี้จะไม่สิ้นสุดจนกว่ากลุ่มใดกลุ่มหนึ่งหรือทั้งสองกลุ่มจะถูกกำจัดออกจากอำนาจโดยสิ้นเชิง\n\nเมื่อสถานการณ์ดำเนินไป การกระทำที่พวกเขาและตัวละครอื่นๆ กระทำจะควบคุมระดับ [harrying_resistance|E] และ [harrying_pacification|E] ของภูมิภาค\n\n#TS #EMP การต่อต้าน#! ที่สูงขึ้นจะนำไปสู่:#!\n$EFFECT_LIST_BULLET$ [cultural_acceptance|E] ที่ต่ำลง\n$EFFECT_LIST_BULLET$ [county_control|E] ที่ต่ำลง\n$EFFECT_LIST_BULLET$โอกาสที่สูงขึ้นของ [claimant_factions|E] หรือแม้กระทั่ง [civil_war|E]\n\n#TS #EMP การปราบปราม#! ที่สูงขึ้นจะนำไปสู่:#!\n$EFFECT_LIST_BULLET$ [cultural_acceptance|E] ที่สูงขึ้น\n$EFFECT_LIST_BULLET$ [dread|E] ที่เพิ่มขึ้นสำหรับผู้ปกครองอังกฤษ\n$EFFECT_LIST_BULLET$การเข้าถึง [decision|E] $embrace_english_culture_decision$"

 game_concept_harrying_resistance: "การต่อต้าน"
 game_concept_harrying_resistance_desc: "การต่อต้านวัดระดับการต่อต้านการปกครองของนอร์มันในอังกฤษอย่างต่อ เนื่องจากประชากรแองโกล-แซกซอนที่มีอยู่เดิม สมมติว่าการต่อต้าน #BOL สูงกว่า#! [harrying_pacification|E] มันจะมอบผลกระทบในระดับต่อไปนี้:\n\n#S การต่อต้านสูงกว่า #V 7#!#!\n$EFFECT_LIST_BULLET$การยอมรับทางวัฒนธรรม [cultural_acceptance|E] แองโกล-แซกซอน/นอร์มัน: [EmptyScope.ScriptValue('miniscule_cultural_acceptance_loss')|0V] ต่อเดือน\n\n#S การต่อต้านสูงกว่า #V 10#!#!\n$EFFECT_LIST_BULLET$การยอมรับทางวัฒนธรรม [cultural_acceptance|E] แองโกล-แซกซอน/นอร์มัน: [EmptyScope.ScriptValue('minor_cultural_acceptance_loss')|0V] ต่อเดือน\n$EFFECT_LIST_BULLET$เพิ่มโอกาสเล็กน้อยของ [claimant_factions|E] ต่อต้านผู้ปกครองอังกฤษ\n\n#S การต่อต้านสูงกว่า #V 13#!#!\n$EFFECT_LIST_BULLET$การยอมรับทางวัฒนธรรม [cultural_acceptance|E] แองโกล-แซกซอน/นอร์มัน: [EmptyScope.ScriptValue('medium_cultural_acceptance_loss')|0V] ต่อเดือน\n$EFFECT_LIST_BULLET$เพิ่มโอกาสค่อนข้างมากของ [claimant_factions|E] ต่อต้านผู้ปกครองอังกฤษ\n$EFFECT_LIST_BULLET$[county_control|E] ในทุก [counties|E] ลดลง [EmptyScope.ScriptValue('minor_discontent_loss')|0V] ทุก #V 3#! เดือนสำหรับทุก [vassal|E] ของอังกฤษ\n\n#S การต่อต้านสูงกว่า #V 16#!#!\n$EFFECT_LIST_BULLET$การยอมรับทางวัฒนธรรม [cultural_acceptance|E] แองโกล-แซกซอน/นอร์มัน: [EmptyScope.ScriptValue('major_cultural_acceptance_loss')|0V] ต่อเดือน\n$EFFECT_LIST_BULLET$เพิ่มโอกาสอย่างมากของ [claimant_factions|E] ต่อต้านผู้ปกครองอังกฤษ\n$EFFECT_LIST_BULLET$[county_control|E] ในทุก [counties|E] ลดลง [EmptyScope.ScriptValue('medium_discontent_loss')|0V] ทุก #V 3#! เดือนสำหรับทุก [vassal|E] ของอังกฤษ"
 game_concept_harrying_pacification: "การปราบปราม"
 game_concept_harrying_pacification_desc: "การปราบปรามติดตามว่าผู้ปกครองนอร์มันใหม่ของอังกฤษมีประสิทธิภาพเพียงใดในการปราบปรามประชากรแองโกล-แซกซอนที่ไม่พอใจ สมมติว่าการปราบปราม #BOL สูงกว่า#! [harrying_resistance|E] มันจะมอบผลกระทบในระดับต่อไปนี้:\n\n#S การปราบปรามสูงกว่า #V 5#!#!\n$EFFECT_LIST_BULLET$การยอมรับทางวัฒนธรรม [cultural_acceptance|E] แองโกล-แซกซอน/นอร์มัน: +[EmptyScope.ScriptValue('miniscule_cultural_acceptance_gain')|0V] ต่อเดือน\n\n#S การปราบปรามสูงกว่า #V 8#!#!\n$EFFECT_LIST_BULLET$การยอมรับทางวัฒนธรรม [cultural_acceptance|E] แองโกล-แซกซอน/นอร์มัน: +[EmptyScope.ScriptValue('minor_cultural_acceptance_gain')|0V] ต่อเดือน\n$EFFECT_LIST_BULLET$เพิ่ม [dread_i]#V 1#! [dread|E] ให้กับผู้ปกครองอังกฤษต่อเดือน\n\n#S การปราบปรามสูงกว่า #V 11#!#!\n$EFFECT_LIST_BULLET$การยอมรับทางวัฒนธรรม [cultural_acceptance|E] แองโกล-แซกซอน/นอร์มัน: +[EmptyScope.ScriptValue('medium_cultural_acceptance_gain')|0V] ต่อเดือน\n$EFFECT_LIST_BULLET$เพิ่ม [dread_i]#V 2#! [dread|E] ให้กับผู้ปกครองอังกฤษต่อเดือน\n\n#S การปราบปรามสูงกว่า #V 14#!#!\n$EFFECT_LIST_BULLET$การยอมรับทางวัฒนธรรม [cultural_acceptance|E] แองโกล-แซกซอน/นอร์มัน: +[EmptyScope.ScriptValue('major_cultural_acceptance_gain')|0V] ต่อเดือน\n$EFFECT_LIST_BULLET$เพิ่ม [dread_i]#V 3#! [dread|E] ให้กับผู้ปกครองอังกฤษต่อเดือน\n$EFFECT_LIST_BULLET$เปิดใช้งาน [decision|E] #V $embrace_english_culture_decision$#! "
 
