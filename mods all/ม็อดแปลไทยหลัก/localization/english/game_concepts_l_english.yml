 game_concept_house_unity: "ความสามัคคีของตระกูล"
 game_concept_unity: "ความสามัคคี"
 game_concept_house_unity_i: "@dynasty_house_unity!"
 game_concept_house_unity_desc: "$game_concept_house_unity$ แสดงถึงสถานะความสัมพันธ์ภายใน [house|E] ของ [clan|E] และทัศนคติที่สมาชิกมีต่อกัน\n\nมี [house_unity_levels|E] หลายระดับ ซึ่งให้ประโยชน์และบทลงโทษต่างๆ แก่สมาชิกของตระกูล\n\n$game_concept_house_unity$ เปลี่ยนแปลงไปขึ้นอยู่กับการกระทำที่สมาชิกในตระกูลกระทำต่อกัน [house_unity_unifying_actions|E] โดยทั่วไปจะเพิ่ม $game_concept_house_unity$ ในขณะที่ [house_unity_devisive_actions|E] จะลดลง [house_head|E] โดยทั่วไปจะมีอิทธิพลต่อ $game_concept_unity$ ของตระกูลมากกว่า"
 game_concept_house_unity_level: "ระดับความสามัคคีของตระกูล"
 game_concept_house_unity_levels: "ระดับความสามัคคีของตระกูล"
 game_concept_house_unity_level_desc: "$game_concept_house_unity_level$ คือสถานะปัจจุบันของ [house_unity|E] ระดับที่ใช้งานอยู่จะเปลี่ยนแปลงเมื่อความสามัคคีเพิ่มขึ้นผ่าน [house_unity_unifying_actions|E] หรือลดลงผ่าน [house_unity_devisive_actions|E] และ แต่ละระดับจะให้ประโยชน์และบทลงโทษต่างๆ แก่สมาชิกของ [house|E]\n\nมีห้าระดับที่แตกต่างกัน:\n[GetCurrentHouseUnityStagesDescForLocalPlayer]\n\nแต่ละระดับมี [succession_law|E] ของ [house|E] เป็นของตัวเอง"
 
 game_concept_house_unity_unifying_actions: "การกระทำที่สร้างความสามัคคี"
 game_concept_house_unity_unifying_actions_desc: "การกระทำที่สร้างความสามัคคีต่อสมาชิก [house|E] ของท่านจะเพิ่ม [house_unity|E] ของท่าน\n\n[house_heads|E] สามารถใช้ [decision|E] #V $unity_steer_house_direction_decision$#! และ [interaction|E] #V $extoll_virtuousness_interaction$#! เพื่อเพิ่มความสามัคคีได้อย่างมาก\n\n#weak ตัวอย่างบางส่วนของการกระทำที่สร้างความสามัคคีคือ:$house_unity_increase_examples$#!"

 game_concept_house_unity_devisive_actions: "การกระทำที่สร้างความแตกแยก"
 game_concept_house_unity_devisive_actions_desc: "การกระทำที่สร้างความแตกแยกต่อสมาชิก [house|E] ของท่านจะลด [house_unity|E] ของท่าน\n\n[house_heads|E] สามารถใช้ [decision|E] #V $unity_steer_house_direction_decision$#! และ [interaction|E] #V $accuse_of_decandence_interaction$#! เพื่อลดความสามัคคีได้อย่างมาก\n\n#weak ตัวอย่างบางส่วนของการกระทำที่สร้างความแตกแยกคือ:$house_unity_decrease_examples$#!"

 game_concept_house_succession_law: "กฎหมายการสืบทอดของตระกูล"
 game_concept_house_succession_law_desc: "ใน [realms|E] แบบ [GetGovernment('clan_government').GetName] [house_unity_level|E] ปัจจุบันจะเป็นตัวกำหนดว่าใช้ [succession_law|E] ใด\n\nแคลนสามารถเปลี่ยนไปใช้กฎหมายการสืบทอดแบบ $SUCCESSION_LAW_CHANGE_WINDOW_SINGLE_HEIR_LAWS$ ซึ่งจะป้องกันไม่ให้ [house_unity|E] เปลี่ยนแปลงกฎหมายนั้น แต่การทำ เช่นนั้นยากกว่าปกติมาก"

 house_unity_increase_examples: "\n$EFFECT_LIST_BULLET$ $negotiate_alliance_interaction$\n$EFFECT_LIST_BULLET$ $join_war_interaction$\n$EFFECT_LIST_BULLET$ $gift_artifact_interaction$\n$EFFECT_LIST_BULLET$ $pay_ransom_interaction$\n$EFFECT_LIST_BULLET$ $offer_guardianship_interaction$\n$EFFECT_LIST_BULLET$ $send_to_holy_order_interaction$\n$EFFECT_LIST_BULLET$ $restore_inheritance_interaction$\n$EFFECT_LIST_BULLET$ $abandon_hook_interaction$\n$EFFECT_LIST_BULLET$ $stop_attacker_vassal_war_interaction$\n$EFFECT_LIST_BULLET$ $fund_inspiration_interaction$\n$EFFECT_LIST_BULLET$ $propose_best_friendship_interaction$"
 house_unity_decrease_examples: "\n$EFFECT_LIST_BULLET$ $revoke_title_interaction$\n$EFFECT_LIST_BULLET$ $declare_war_interaction$\n$EFFECT_LIST_BULLET$ $imprison_interaction$\n$EFFECT_LIST_BULLET$ $move_to_dungeon_interaction$\n$EFFECT_LIST_BULLET$ $force_join_faction_interaction$\n$EFFECT_LIST_BULLET$ $disinherit_interaction$\n$EFFECT_LIST_BULLET$ $denounce_interaction$\n$EFFECT_LIST_BULLET$ $expose_secret_interaction$\n$EFFECT_LIST_BULLET$ $blackmail_interaction$\n$EFFECT_LIST_BULLET$ $break_betrothal_interaction$\n$EFFECT_LIST_BULLET$ $join_independence_faction_interaction$\n$EFFECT_LIST_BULLET$ $sumptuary_law_debate_interaction$\n$EFFECT_LIST_BULLET$ $vassal_claim_liege_title_interaction$"

 game_concept_dreams: "ความฝัน"
 game_concept_dreams_desc: "ตัวละครที่ปฏิบัติตามศรัทธาที่มีหลักการทำนายอาจประสบกับความฝันเป็นครั้งคราว ความฝันเหล่านี้สามารถทำนายได้โดยผู้หยั่งรู้ ซึ่งอาจมีผลลัพธ์ที่หลากหลาย ทั้งดีและร้าย"

