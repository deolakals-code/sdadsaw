 game_concept_commission_epic_desc:0 "[decision|E] ที่ให้ตัวละครแลกเปลี่ยน [gold|E] เป็น [artifact|E] โดยการมอบหมายให้สร้างมหากาพย์ตระกูล\nมหากาพย์จะให้ [dynasty_prestige|E] และยังสามารถให้โบนัสอื่น ๆ ได้ขึ้นอยู่กับตัวเลือกของท่าน"

 game_concept_draw_up_new_charts:0 "$draw_up_new_charts_decision$"
 game_concept_draw_up_new_charts_decision:0 "การตัดสินใจ $draw_up_new_charts_decision$"
 game_concept_draw_up_new_charts_desc:0 "[decision|E] ที่ให้ตัวละครแลกเปลี่ยน [gold|E] เป็น [artifact|E] โดยการมอบหมายให้สร้างแผนการเดินทางที่อธิบายสถานที่ที่พวกเขาเคยไปเยือน\n[artifact|E] แผนการเดินทางจะให้ผลกระทบที่แตกต่างกันขึ้นอยู่กับว่าท่านเคยไปที่ไหนและท่านเลือกอะไร"

 game_concept_local_arbitration:0 "$local_arbitration_decision$"
