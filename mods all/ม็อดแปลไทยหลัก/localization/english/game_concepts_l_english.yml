 game_concept_vassalize_casus_belli:0 "เหตุแห่งสงครามการบังคับให้เป็นข้าหลวง"
 game_concept_vassalization_casus_belli:0 "การบังคับให้เป็นข้าหลวง"
 game_concept_vassalized_casus_belli:0 "ถูกบังคับให้เป็นข้าหลวง"
 game_concept_vassalize_casus_belli_desc:3 "[casus_belli|E] ที่อนุญาตให้ทำการ [vassalization|E] โดยบังคับต่อ [ruler|E] อิสระที่อยู่ใกล้เคียง ซึ่งมียศต่ำกว่า ปลดล็อกโดย [perk|E] [GetPerk( 'forced_vassalage_perk' ).GetName( GetNullCharacter )]\n\nท่านสามารถบังคับให้ผู้ปกครองใด ๆ เป็นข้าหลวงได้ หากพวกเขามี [counties|E] ใน [realm|E] ไม่เกิน #V [realm|E]#! แห่ง\n\nขีดจำกัดนี้เพิ่มขึ้น #P +[EmptyScope.ScriptValue('vassalize_growth_per_innovation')|0]#! สำหรับนวัตกรรม แต่ละอย่างต่อไปนี้:\n$EFFECT_LIST_BULLET$#V $innovation_casus_belli$#!\n$EFFECT_LIST_BULLET$#V $innovation_chronicle_writing$#!\n$EFFECT_LIST_BULLET$#V $innovation_divine_right$#!\n$EFFECT_LIST_BULLET$#V $innovation_rightful_ownership$#!"

 game_concept_title_creation:0 "การสร้างตำแหน่ง"
 game_concept_create:0 "สร้าง"
 game_concept_created:0 "สร้างแล้ว"
