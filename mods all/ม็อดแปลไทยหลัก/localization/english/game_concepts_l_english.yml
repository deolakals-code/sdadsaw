 game_concept_bisexual_desc:2 "ใน #EMP Crusader Kings III#! ตัวละครนี้ถูกดึงดูดโดยตัวละครทั้งเพศเดียวกันและเพศตรงข้าม"
 sexuality_as:0 "[asexual|E]"
 game_concept_asexual:0 "ไม่ฝักใฝ่ทางเพศ"
 game_concept_asexual_desc:2 "ใน #EMP Crusader Kings III#! ตัวละครนี้ประสบกับแรงดึงดูดต่อตัวละครอื่นน้อยมากหรือไม่เลย โดยไม่คำนึงถึงเพศ"
 sexuality_none:0 "#V ไม่มี#!"
 game_concept_title_succession:0 "การสืบทอดตำแหน่ง"
 game_concept_title_specific_succession:0 "เฉพาะตำแหน่ง"
 game_concept_title_succession_desc: "[title|E] สามารถมี [succession_law|E] เป็นของตนเอง ซึ่งแตกต่างจาก [realm|E] ของ [holder|E]\n\n[kingdoms|E] และ [empires|E] มักจะมี $game_concept_title_succession$ ตามธรรมเนียม\n\n$game_concept_holder$ ของ $game_concept_title$ สามารถเพิ่มหรือลบกฎการสืบตำแหน่งยศเฉพาะทางได้ โดยมักจะต้องแลกกับ [prestige|E]\n\n[domiciles|E] ก็มี $game_concept_title_succession$ เป็นของตนเอง เช่นกัน ซึ่งไม่สามารถลบออกได้"

