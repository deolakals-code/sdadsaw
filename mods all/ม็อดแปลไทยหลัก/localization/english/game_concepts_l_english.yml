 game_concept_excommunication_war:0 "สงครามขับไล่ผู้ถูกขับออกจากศาสนา"
 game_concept_excommunicated_ruler:0 "ผู้ปกครองที่ถูกขับออกจากศาสนา"
 game_concept_excommunicated_ruler_desc:1 "ในสงครามขับไล่ผู้ถูกขับออกจากศาสนา ฝ่ายโจมตีกำลังต่อสู้เพื่อถอดถอนผู้ปกครองที่ [excommunicated|E] ออกจากอำนาจ\n\nหากได้รับชัยชนะ ฝ่ายโจมตีจะได้รับ [piety|E] จำนวนมากและการอนุมัติจาก [head_of_faith|E] ของตน ในขณะที่ผู้ปกครองที่ถูกขับออกจากศาสนาจะถูกบังคับให้สละราชสมบัติให้กับ [heir|E] ของตน\n\nอย่างไรก็ตาม หากผู้ปกครองที่ถูกขับออกจากศาสนาชนะ [head_of_faith|E] ของตนจะถูกบังคับให้เพิกถอนการขับออกจากศาสนา เนื่องจากพวกเขาได้พิสูจน์ความชอบธรรมในสนามรบแล้ว"
 game_concept_holy_site:0 "สถานศักดิ์สิทธิ์"
 game_concept_holy_sites:0 "สถานศักดิ์สิทธิ์"
 game_concept_holy_site_desc:1 "$game_concept_holy_site$ คือ [county|E] ที่มีสถานที่สำคัญทางศาสนาต่อ [faith|E] $game_concept_holy_sites$ ที่ถือครองโดยตัวละครที่มีศรัทธาที่ถูกต้องจะให้ผลกระทบแก่ทุกคนในศรัทธานั้น และยังสามารถอนุญาตให้สร้าง [special_buildings|E] หรือ [holy_orders|E] ได้อีกด้วย แต่ละศรัทธามีชุด $game_concept_holy_sites$ ที่แตกต่างกัน"
 game_concept_cultural_acceptance_i:0 "@cultural_acceptance_icon!"
 game_concept_cultural_acceptance:0 "การยอมรับทางวัฒนธรรม"
 game_concept_cultural_acceptance_desc:2 "การยอมรับทางวัฒนธรรมวัดว่า [cultures|E] สองวัฒนธรรมยอมรับ ซึ่งกันและกันมากน้อยเพียงใด\n\nโดยหลักแล้ว จะส่งผลต่อ [opinion|E] ที่ลดลงระหว่างตัวละครต่างวัฒนธรรมมากน้อยเพียงใด นอกจากนี้ยังส่งผลต่อ [county_opinion|E] และค่าใช้จ่ายในการสร้าง [hybrid_culture|E]\n\nการยอมรับทางวัฒนธรรมสามารถเปลี่ยนแปลงได้จากการกระทำหลายอย่าง ที่เด่นชัดที่สุดคือ [wars|E] การมอบและเพิกถอน [titles|E] และ [councillor_task|E] [accept_culture|E]\n\nเมื่อเวลาผ่านไป การยอมรับจะกลับสู่ [cultural_acceptance_baseline|E] หากเกินค่า"
 game_concept_cultural_acceptance_baseline:0 "ระดับพื้นฐานการยอมรับทางวัฒนธรรม"
 game_concept_cultural_acceptance_baseline_desc:1 "[cultural_acceptance|E] มีระดับพื้นฐาน ซึ่งจะลดลงไปหาหากเกินค่า ระดับพื้นฐานขึ้นอยู่กับ:\n$EFFECT_LIST_BULLET$การมี [heritage|E] ร่วมกัน\n$EFFECT_LIST_BULLET$การมี [language|E] ร่วมกัน\n$EFFECT_LIST_BULLET$การมี [faith|E] และ [religion|E] ร่วมกัน โดยเฉพาะอย่างยิ่งหากเป็น [GetFaithDoctrine('doctrine_pluralism_pluralistic').GetBaseName] หรือ [GetReligionFamily('rf_eastern').GetName]\n$EFFECT_LIST_BULLET$การมี [ethos|E] ร่วมกันภายใน [region|E] เดียวกัน"
 game_concept_culture_pillar:0 "เสาหลักทางวัฒนธรรม"
 game_concept_culture_pillars:0 "เสาหลักทางวัฒนธรรม"
 game_concept_culture_pillar_desc:1 "[SelectLocalization( HasDlcFeature( 'reform_culture' ), 'game_concept_culture_pillar_desc_REFORM_DLC', 'game_concept_culture_pillar_desc_NO_REFORM_DLC' )]"
 game_concept_culture_pillar_desc_REFORM_DLC:0 "เสาหลักคือคุณสมบัติที่สะท้อนถึงต้นกำเนิดของ [culture|E]\n\nมีเสาหลักทางวัฒนธรรมที่แตกต่างกัน 5 ประการ:\n$EFFECT_LIST_BULLET$[ethos|E]\n$EFFECT_LIST_BULLET$[heritage|E]\n$EFFECT_LIST_BULLET$[language|E]\n$EFFECT_LIST_BULLET$[martial_custom|E]\n$EFFECT_LIST_BULLET$สุนทรียศาสตร์\n\nในจำนวนนี้ จริยธรรม ภาษา และธรรมเนียมการทหารสามารถเปลี่ยนแปลงได้โดย [culture_head|E] ผ่าน [reformation|E]"
 game_concept_culture_pillar_desc_NO_REFORM_DLC:0 "เสาหลักคือคุณสมบัติที่ไม่สามารถเปลี่ยนแปลงได้ ซึ่งสะท้อนถึงต้นกำเนิดของ [culture|E]\n\nมีเสาหลักทางวัฒนธรรมที่แตกต่างกัน 5 ประการ:\n$EFFECT_LIST_BULLET$[ethos|E]\n$EFFECT_LIST_BULLET$[heritage|E]\n$EFFECT_LIST_BULLET$[language|E]\n$EFFECT_LIST_BULLET$[martial_custom|E]\n$EFFECT_LIST_BULLET$สุนทรียศาสตร์"
 game_concept_culture_tradition:0 "ธรรมเนียมวัฒนธรรม"
 game_concept_culture_traditions:0 "ธรรมเนียมวัฒนธรรม"
 game_concept_tradition:0 "ธรรมเนียม"
 game_concept_traditions:0 "ธรรมเนียม"
 game_concept_culture_tradition_desc:2 "ธรรมเนียมเป็นตัวแทนของการปฏิบัติ นิสัย ค่านิยม และจริยธรรมของ แต่ละ [cultures|E]\n\nแต่ละธรรมเนียมจะให้โบนัสหรือความสามารถพิเศษบางประเภทแก่ [characters|E] หรือ [counties|E] ของวัฒนธรรมนั้น\n\n[SelectLocalization( HasDlcFeature( 'reform_culture' ), 'game_concept_culture_tradition_desc_REFORM_DLC', 'game_concept_culture_tradition_desc_NO_REFORM_DLC' )]\n\n$game_concept_cultures$ สามารถมีธรรมเนียมได้สูงสุด 6 อย่าง แต่ส่วนใหญ่มีน้อยกว่านั้น"
 game_concept_culture_tradition_desc_REFORM_DLC:0 "[culture_head|E] สามารถสร้างธรรมเนียมใหม่หรือแทนที่ธรรมเนียมที่มีอยู่สำหรับวัฒนธรรมผ่าน [reformation|E]"
 game_concept_culture_tradition_desc_NO_REFORM_DLC:0 "[culture_head|E] สามารถสร้างธรรมเนียมใหม่สำหรับวัฒนธรรมได้ โดยต้องเสีย [prestige|E]"

 game_concept_ethos:0 "จริยธรรม"
 game_concept_ethos_desc:2 "จริยธรรมของ [culture|E] กำหนดค่านิยมหลัก หลักการชี้นำ และทัศนคติทั่วไปของสมาชิกต่อชีวิตโดยทั่วไป\n\nนอกจากนี้ จริยธรรมยังส่งผลอย่างมากต่อค่าใช้จ่ายสำหรับ [culture_head|E] ในการสร้าง [traditions|E] ใหม่[SelectLocalization( HasDlcFeature( 'reform_culture' ), 'game_concept_ethos_desc_REFORM_DLC', '' )]"
 game_concept_ethos_desc_REFORM_DLC:0 "\n\n[culture_head|E] สามารถแทนที่ $game_concept_ethos$ ปัจจุบันของตนผ่าน [reformation|E]"
 game_concept_language:0 "ภาษา"
 game_concept_languages:0 "ภาษา"
 game_concept_language_desc:3 "ภาษาคือ [culture_pillar|E] ที่กำหนดว่าประชากรทั่วไปของ [culture|E] พูดภาษาอะไร $game_concept_cultures$ ที่พูดภาษาเดียวกันจะได้รับโบนัสถาวรต่อ [cultural_acceptance_baseline|E] ของตน\n\n[character|E] สามารถรู้ภาษาได้หนึ่งภาษาหรือมากกว่านั้น การรู้ภาษาจะลดโทษ [opinion|E] จาก [cultural_acceptance|E] ลงครึ่งหนึ่งต่อตัวละครและ [counties|E] ที่พูดภาษานั้น นอกจากนี้ยังขัดขวาง [faction_independence|E] และ [claimant_factions|E]\n\nตัวละครสามารถเรียนรู้ภาษาเพิ่มเติมได้โดยใช้ [scheme|E] [GetScheme('learn_language').GetTypeName] ตัวละครสามารถเรียนรู้ภาษาได้อย่างสบาย ๆ จนถึง [language_limit|E] ของตน"
 game_concept_language_limit:1 "ขีดจำกัดภาษาต่างประเทศ"
 game_concept_language_limit_desc:1 "คุณสามารถจดจำ [languages|E] จำนวนหนึ่งได้อย่างสบาย ๆ เท่านั้น หากคุณเกินขีดจำกัดนี้ คุณจะต้องลืมภาษาใดภาษาหนึ่งหรือประสบกับ [stress|E]\n\nภาษาที่ [culture|E] ของคุณพูดไม่นับรวมในขีดจำกัดนี้\n\nขีดจำกัดกำหนดโดย:\n$EFFECT_LIST_BULLET$ทุกคนมีค่าพื้นฐาน #V 1#!\n$EFFECT_LIST_BULLET$ทุก ๆ [EmptyScope.ScriptValue('language_learning_divide_value')|V0] คะแนนของ [learning_i][learning|E] จะเพิ่มขึ้น #V 1#!\n$EFFECT_LIST_BULLET$[perk|E] [GetPerk('open_minded_perk').GetName(GetNullCharacter)] จะเพิ่มขึ้น #V 2#!\n$EFFECT_LIST_BULLET$[perk|E] [GetPerk('smooth_operator_perk').GetName(GetNullCharacter)] จะเพิ่มขึ้น #V 1#!\n$EFFECT_LIST_BULLET$[dynasty_perk|E] [GetDynastyPerk('ep1_culture_legacy_1').GetName] จะเพิ่มขึ้น #V 1#!"
 game_concept_heritage:0 "มรดกทางวัฒนธรรม"
 game_concept_heritage_desc:0 "มรดกทางวัฒนธรรมคือ [culture_pillar|E] ที่แสดงถึงบรรพบุรุษร่วมกันของหลาย [cultures|E]\n\nวัฒนธรรมที่มีมรดกทางวัฒนธรรมเดียวกันโดยทั่วไปจะมีการ [Concept( 'cultural_acceptance', 'ยอมรับ' )|E] ซึ่งกันและกันในระดับสูง"
 game_concept_martial_custom:0 "ธรรมเนียมการทหาร"
 game_concept_martial_custom_desc:1 "ธรรมเนียมการทหารคือ [culture_pillar|E] ที่กำหนดว่าเพศใดสามารถทำหน้าที่เป็น [commanders|E] หรือ [knights|E] ได้\n\n[traditions|E] และ [doctrines|E] บางอย่างสามารถแก้ไขกฎเหล่านี้สำหรับ [characters|E] บางคนได้"
 game_concept_culture_intermingling:0 "การผสมผสานทางวัฒนธรรม"
 game_concept_culture_intermingling_desc:1 "ยิ่ง [cultures|E] สองวัฒนธรรมอยู่ร่วมกันใน [realm|E] เดียวกันมากเท่าใด การผสมผสานก็จะยิ่งเกิดขึ้นมากขึ้น และวัฒนธรรมเหล่านั้นก็จะเพิ่ม [cultural_acceptance|E] ของตน"
 game_concept_cultural_head:0 "ประมุขวัฒนธรรม"
 game_concept_culture_head:1 "ประมุขวัฒนธรรม"
 game_concept_culture_head_desc:3 "'$game_concept_culture_head$' คือ [ruler|E] ผู้มีอิทธิพลมากที่สุดเหนือ [culture|E] ของตนเอง\n\nโดยเฉพาะอย่างยิ่ง ผู้ปกครองที่มีจำนวน [counties|E] ซึ่งมีวัฒนธรรมเดียวกันภายใน [realm|E] ของตนมากที่สุด จะได้เป็น $game_concept_cultural_head$, โดยไม่คำนึงว่า [domain|E] ของพวกเขาอยู่ที่ใด หรือพวกเขาอาจครอบครองเคาน์ตีที่มีวัฒนธรรมอื่นใดบ้าง[AddLocalizationIf( HasDlcFeature( 'khans_of_the_steppe' ), 'game_concept_culture_head_desc_NOMAD_DLC', )]\n\n$game_concept_cultural_head$ สามารถมีอิทธิพลต่อ [innovation|E] ที่ควรได้รับการจัดลำดับความสำคัญในการค้นพบ โดยการตั้งค่า [cultural_fascination|E]\n\n[SelectLocalization( HasDlcFeature( 'reform_culture' ), 'game_concept_culture_head_desc_REFORM_DLC', 'game_concept_culture_head_desc_NO_REFORM_DLC' )]"
 game_concept_culture_head_desc_NOMAD_DLC: "\n\nอย่างไรก็ตาม [rulers|E] ที่เป็น [nomadic|E] จะเลือก $game_concept_cultural_head$ โดยพิจารณาจากผู้ที่มี [herd|E] ใหญ่ที่สุด โดยไม่คำนึงถึงยศศักดิ์ ในกรณีที่ผู้ปกครองที่ตั้งถิ่นฐานแล้วเป็นส่วนหนึ่งของ [culture|E] เดียวกันกับชาวอนาจร [military_power|E] จะเป็นปัจจัยตัดสินแทน"
 game_concept_culture_head_desc_REFORM_DLC:0 "$game_concept_culture_head$ ยังสามารถ [reform|E] ส่วนต่าง ๆ ของวัฒนธรรมของตนได้"
 game_concept_culture_head_desc_NO_REFORM_DLC:0 "$game_concept_culture_head$ ยังสามารถสร้าง [traditions|E] ใหม่สำหรับวัฒนธรรมของตนได้"
 game_concept_county_opinion:0 "ความเห็นประชาชน"
 game_concept_county_opinion_desc:3 "ประชากรทั่วไปของ แต่ละ [county|E] มี [opinion|E] ต่อ [character|E] ที่ถือครอง $game_concept_county$ ของตน หากประชากรไม่พอใจ พวกเขาอาจเริ่มหรือเข้าร่วม [peasant_faction|E] หรือ [popular_faction|E] ซึ่งทั้งสองอย่างสามารถแพร่กระจายไปทั่วทั้ง [realm|E] ได้ในไม่ช้า\n\nวิธีที่ง่ายที่สุดในการควบคุม $game_concept_county_opinion$ คือการ ทำให้แน่ใจว่า [holder|E] ของ $game_concept_county$ มี [culture|E] และ [faith|E] เดียวกันกับประชากร\n\n$game_concept_county_opinion$ จากการมี [faith|E] ที่แตกต่างกันจะถูกปรับเปลี่ยนโดยทั้ง [faith_hostility|E] ของเคาน์ตีและ [fervor|E] ของมัน โดยปรับขนาดเชิงเส้นระหว่าง 0 ถึง 100 $game_concept_fervor$"
 game_concept_core_tenet:1 "หลักความเชื่อ"
 game_concept_core_tenet_desc:1 "ในขณะที่ [doctrines|E] แสดงถึงประเด็นที่ [faith|E] ต้องมีจุดยืน $game_concept_core_tenets$ แสดงถึงลักษณะเฉพาะและพิธีกรรมที่เป็นเอกลักษณ์ของศรัทธานั้น"
 game_concept_core_tenets:1 "หลักความเชื่อ"
 game_concept_holy_war:0 "สงครามศักดิ์สิทธิ์"
 game_concept_holy_wars:0 "สงครามศักดิ์สิทธิ์"
 game_concept_holy_war_holy:0 "ศักดิ์สิทธิ์"
 game_concept_holy_war_desc:4 "$game_concept_holy_war$ เป็นประเภทพิเศษของ [war|E] ที่ [ruler|E] ของ [faith|E] หนึ่งทำสงครามกับผู้ปกครองของศรัทธาอื่น\n\n$game_concept_holy_war$ มักจะค่อนข้างทำลายล้าง โดยผู้ชนะสงครามศักดิ์สิทธิ์มักจะยึด [counties|E] ทั้งหมดในพื้นที่เป้าหมายมาเป็นของตนเอง อย่างไรก็ตาม หากศรัทธาของผู้โจมตีคือ [GetFaithDoctrine('doctrine_pluralism_pluralistic').GetBaseName] หรือผู้ป้องกันมี [vassals|E] ที่นับถือศรัทธาเดียวกับผู้โจมตีในพื้นที่เป้าหมาย ผู้ปกครองข้าหลวงบางส่วนหรือทั้งหมดในพื้นที่เป้าหมายอาจถูกโอนไปยังผู้โจมตีแทน\n\nแตกต่างจากสงครามอื่น ๆ ผู้ปกครองที่นับถือศรัทธาเดียวกับเป้าหมายอาจเลือกที่จะเข้าร่วมป้องกันโดยไม่จำเป็นต้องมี [alliance|E]\n\nสงครามศักดิ์สิทธิ์อาจได้รับอนุญาตหรือถูกจำกัดขึ้นอยู่กับ [religious_families|E] ที่แตกต่างกัน"
 game_concept_great_holy_war:0 "มหาสงครามศักดิ์สิทธิ์"
 game_concept_great_holy_wars:0 "มหาสงครามศักดิ์สิทธิ์"
 game_concept_great_holy_war_desc:3 "$game_concept_great_holy_war$ เป็นประเภทพิเศษของ [war|E] ที่มีเพียง [head_of_faith|E] ของ [faiths|E] บางศรัทธาเท่านั้นที่สามารถประกาศได้ โดยมีเป้าหมายเพื่อนำ [kingdom|E] ทั้งหมดมาอยู่ภายใต้การปกครองของศรัทธาของตน\n\n$game_concept_great_holy_wars$ กำหนดเป้าหมายไปที่ [rulers|E] ทั้งหมดของ [religion|E] อื่นภายใน [kingdom|E] ที่เลือก บังคับให้พวกเขาป้องกันร่วมกัน หากได้รับชัยชนะ [titles|E] ทั้งหมดภายในราชอาณาจักรเป้าหมายจะถูกยึดและแบ่งปันระหว่างผู้โจมตี\n\nขึ้นอยู่กับ [doctrines|E] ของมัน ศรัทธาอาจเข้าถึง [directed_great_holy_wars|E], [undirected_great_holy_wars|E] หรือไม่มี $game_concept_great_holy_wars$ เลย:\n$EFFECT_LIST_BULLET$[core_tenets|E] [GetFaithDoctrine('tenet_armed_pilgrimages').GetBaseName], [GetFaithDoctrine('tenet_struggle_submission').GetBaseName], หรือ [GetFaithDoctrine('tenet_warmonger').GetBaseName] จำเป็นต้องมีเพื่อเข้าถึงมหาสงครามศักดิ์สิทธิ์โดยทั่วไป\n$EFFECT_LIST_BULLET$ศรัทธาที่มีประมุข [GetFaithDoctrine('doctrine_temporal_head').GetBaseName] สามารถเข้าถึงได้เฉพาะมหาสงครามศักดิ์สิทธิ์แบบชี้นำเท่านั้น\n$EFFECT_LIST_BULLET$ศรัทธาที่มีประมุข [GetFaithDoctrine('doctrine_spiritual_head').GetBaseName] สามารถเข้าถึงได้เฉพาะมหาสงครามศักดิ์สิทธิ์แบบไม่ชี้นำเท่านั้น\n$EFFECT_LIST_BULLET$ศรัทธาที่ไม่มีประมุขแห่งศรัทธาไม่สามารถประกาศมหาสงครามศักดิ์สิทธิ์ใด ๆ ได้ แม้ว่าโดยปกติจะมีสิทธิ์ก็ตาม\n\nบางศรัทธามีชื่อพิเศษสำหรับมหาสงครามศักดิ์สิทธิ์ของตน เช่น 'สงครามครูเสด' หรือ 'ญิฮาด' มหาสงครามศักดิ์สิทธิ์เหล่านี้แตกต่างกันเพียงชื่อเท่านั้น และทำงานเหมือนกับมหาสงครามศักดิ์สิทธิ์อื่น ๆ"
 game_concept_directed_great_holy_war:0 "มหาสงครามศักดิ์สิทธิ์แบบชี้นำ"
 game_concept_directed_great_holy_wars:0 "มหาสงครามศักดิ์สิทธิ์แบบชี้นำ"
 game_concept_directed_great_holy_war_desc:0 "$game_concept_directed_great_holy_war$ ถูกประกาศโดย [head_of_faith|E] $doctrine_temporal_head_name$ โดยมีเจตนาที่จะนำ [kingdom|E] มาอยู่ภายใต้การปกครองของตนเอง\n\n[rulers|E] ที่นับถือ [faith|E] เดียวกันอาจเลือกที่จะช่วยเหลือประมุขแห่งศรัทธา และอาจได้รับรางวัลจากการทำ เช่นนั้น รางวัล รวมถึง [piety|E] และอาจ ทำให้ [dynasty|E] ของตนกลายเป็น [landed|E] ภายในราชอาณาจักรที่พิชิตได้\n\nผู้ปกครองของ [religion|E] เป้าหมายอาจเลือกที่จะป้องกันสงครามนี้โดยไม่จำเป็นต้องมี [alliance|E]"
 game_concept_undirected_great_holy_war:0 "มหาสงครามศักดิ์สิทธิ์แบบไม่ชี้นำ"
 game_concept_undirected_great_holy_wars:0 "มหาสงครามศักดิ์สิทธิ์แบบไม่ชี้นำ"
 game_concept_undirected_great_holy_war_desc:0 "$game_concept_undirected_great_holy_war$ ถูกประกาศโดย [head_of_faith|E] $doctrine_spiritual_head_name$ โดยมีเจตนาที่จะนำ [kingdom|E] มาอยู่ภายใต้การปกครองของ [faith|E] ของตน\n\n$game_concept_undirected_great_holy_wars$ ไม่ได้เริ่มต้นทันที แต่จะเข้าสู่ [preparation_phase|E]\n\nก่อนและระหว่างสงคราม ผู้ปกครองของศรัทธาที่โจมตีสามารถเลือกที่จะบริจาค [gold|E] ให้กับ [war_chest|E]\n\nหากได้รับชัยชนะ ราชอาณาจักรเป้าหมายจะถูกยึดและมอบให้กับตัวละครของศรัทธาที่โจมตี รางวัลสำหรับผู้โจมตี รวมถึง [piety|E] และอาจ ทำให้ [dynasty|E] ของตนกลายเป็น [landed|E] ภายในราชอาณาจักรที่พิชิตได้"
 game_concept_preparation_phase:0 "ช่วงเตรียมการ"
 game_concept_preparation_phase_desc:1 "$game_concept_preparation_phase$ คือช่วงเวลาก่อนที่ [undirected_great_holy_war|E] จะถูกประกาศ\n\nในช่วงเวลานี้ [rulers|E] ของ [faith|E] ที่โจมตีสามารถเลือกที่จะให้คำมั่นสัญญาว่าจะสนับสนุนทางทหารในสงครามและ/หรือบริจาคให้กับ [war_chest|E]\n\nตัวจับเวลาจะนับถอยหลังจนกว่า $game_concept_preparation_phase$ จะสิ้นสุดลง จากนั้นสงครามจะถูกประกาศ\n\nผู้ปกครองของ [religions|E] ที่ป้องกันสามารถเลือกที่จะให้คำมั่นสัญญาว่าจะสนับสนุนทางทหารตอบโต้ในช่วงเวลานี้ ซึ่งจะให้ภาพรวมของความแข็งแกร่งของทั้งสองฝ่าย"
 game_concept_war_chest:0 "คลังสงคราม"
 game_concept_war_chest_desc:1 "$game_concept_war_chest$ คือแหล่งรวบรวม [gold|E], [piety|E] และ [prestige|E] เนื้อหาส่วนใหญ่ใช้เป็นรางวัลสำหรับการชนะ [undirected_great_holy_wars|E] ที่ประสบความสำเร็จ โดยจะแบ่งปันระหว่างผู้โจมตีตามการมีส่วนร่วมใน [war|E]\n\nส่วนหนึ่งของสิ่งที่อยู่ใน $game_concept_war_chest$ จะถูกแบ่งปันระหว่างผู้โจมตีเมื่อสงครามถูกประกาศ\n\nหาก [undirected_great_holy_war|E] พ่ายแพ้ ฝ่ายป้องกันจะแบ่งปันส่วน [piety|E] และ [prestige|E] ของ $game_concept_war_chest$ ระหว่างกัน #weak ([gold|E] จะหายไป)#!"
 game_concept_crusade:0 "สงครามครูเสด"
 game_concept_great_holy_war_undirected:0 "ไร้ทิศทาง"
 game_concept_crusades:0 "สงครามครูเสด"
 game_concept_jihad:0 "ญิฮาด"
 game_concept_great_holy_war_directed:0 "มีทิศทาง"
 game_concept_jihads:0 "ญิฮาด"
 game_concept_title_tier:0 "ระดับชั้น"
 game_concept_title_tiers:0 "ระดับชั้น"
 game_concept_rank:0 "ยศ"
 game_concept_title_rank:1 "ยศ"
 game_concept_title_ranks:0 "ยศ"
 game_concept_ranks:0 "ยศ"
 game_concept_title_tier_desc: "เทียบเท่ากับ [rank|E] ของที่ดิน $game_concept_title_tier$ กำหนดตำแหน่งของ [title|E] ภายในลำดับชั้นของเกม\n\nบรรดาศักดิ์ทั้งหมดมีระดับชั้น ซึ่งกำหนดระดับสูงสุดของ [vassals|E] ที่ [holder|E] สามารถมีได้\n\n[hegemony|E] > [empire|E] > [kingdom|E] > [duchy|E] > [county|E] > [barony|E]"
 game_concept_title_rank_desc:0 "สิ่งที่เทียบเท่ากับ [title_tier|E] ของบรรดาศักดิ์ในแง่ของบุคคล $game_concept_title_rank$ จะกำหนดตำแหน่งของ [ruler|E] ภายในลำดับชั้นของเกม\n\nระดับบรรดาศักดิ์ทั้งหมดมีตำแหน่งที่เกี่ยวข้อง ซึ่งจะกำหนดตำแหน่งสูงสุดที่เป็นไปได้ของ [vassals|E] ที่ [holder|E] สามารถมีได้\n\n[hegemon|E] > [emperor|E] > [king|E] > [duke|E] > [count|E] > [baron|E]"
 game_concept_clergy:0 "นักบวช"
 game_concept_clergy_desc:1 "[court_chaplains|E], [realm_priests|E], ผู้ปกครองแบบ [theocratic|E] และผู้ใดก็ตามที่มีลักษณะนิสัย [GetTrait('devoted').GetName( GetNullCharacter )] ถือเป็นสมาชิกของคณะนักบวช\n\n[doctrines|E] ของ [faith|E] จะกำหนดว่าใครสามารถเป็นสมาชิกของคณะนักบวชได้ และสมาชิกของคณะนักบวชสามารถ แต่งงาน รับมรดกที่ดิน ฯลฯ ได้หรือไม่"
 game_concept_church_property:0 "ที่ดินถือครองของคริสตจักร"
 game_concept_church_holdings:0 "ที่ดินถือครองของคริสตจักร"
 game_concept_church_holding:0 "ที่ดินถือครองของคริสตจักร"
 game_concept_church: "คริสตจักร"
 game_concept_church_property_desc:0 "ที่ดินถือครองของคริสตจักรคือ [temples|E] ที่อยู่ภายใต้การควบคุมของ [realm_priest|E]\n\nใน [faiths|E] ที่มีหลักคำสอน [GetFaithDoctrine('doctrine_theocracy_lay_clergy').GetBaseName] [doctrine|E] จะไม่มีที่ดินถือครองของคริสตจักร และศาสนสถาน [temples|E] สามารถถูกถือครองโดยตรงโดยผู้ปกครอง [rulers|E] ทางโลกได้โดยไม่มีบทลงโทษ"

 game_concept_temple_citadel: "ป้อมปราการวิหาร"
 game_concept_temple_citadels: "ป้อมปราการวิหาร"
 game_concept_temple_citadel_holding: "ที่ดินถือครองป้อมปราการวิหาร"
 game_concept_temple_citadel_holdings: "ที่ดินถือครองป้อมปราการวิหาร"
 game_concept_temple_citadel_holding_desc: "ป้อมปราการวิหาร คือการผสมผสานเชิงปฏิบัติของป้อมปราการ [castle|E] และการบูชาใน [temple|E] — มันคือ [holding_type|E] มาตรฐานสำหรับ [rulers|E] [mandala|E] พวกมันให้ [levies|E] [piety|E] และ [taxes|E] ในปริมาณที่เท่ากัน"

 game_concept_embarking:0 "การลงเรือ"
 game_concept_embarked:0 "ลงเรือแล้ว"
 game_concept_embarked_i:0 "@embarked_icon!"
 game_concept_embark:0 "ลงเรือ"
 game_concept_embarkation:0 "การลงเรือ"
 game_concept_embarking_desc:1 "[army|E] จะ $game_concept_embark$ ลงสู่ [fleet|E] โดยอัตโนมัติเมื่อได้รับคำสั่งเคลื่อนพลเข้าสู่เขตทะเล หรือเมื่อไม่มีเส้นทางทางบกไปยัง [barony|E] เป้าหมาย\n\n$game_concept_embarking$ มีค่าใช้จ่ายเป็น [gold|E] จำนวนหนึ่ง ซึ่งเป็นสัญลักษณ์ของการจัดหาและสร้างเรือ สำหรับทหารทุก #V 100#! นายที่ลงเรือ จะต้องจ่ายค่าใช้จ่าย #V [GetDefine('NFleet', 'EMBARK_GOLD_COST_PER_HUNDRED')|0]#! [gold_i]"
 game_concept_era:0 "ยุคสมัย"
 game_concept_eras:0 "ยุคสมัย"
 game_concept_era_desc:1 "[innovations|E] จะสามารถค้นพบได้ก็ต่อเมื่อ [culture|E] ได้บรรลุถึงยุคสมัยที่กำหนด ยุคสมัยถัดไปจะเริ่มต้นได้ก็ต่อเมื่อผ่านพ้นปีที่กำหนด และมีการค้นพบอย่างน้อย #V 50%#! ของนวัตกรรมในยุคสมัยก่อนหน้า\n\nผู้ปกครองที่มี [tribal_government|E] และ [nomadic_government|E] สามารถใช้นวัตกรรมได้เฉพาะในยุคชนเผ่าเท่านั้น"
 game_concept_innovation:0 "นวัตกรรม"
 game_concept_innovations:0 "นวัตกรรม"
 game_concept_innovation_desc:0 "นวัตกรรมคือเทคโนโลยีและความก้าวหน้าอื่น ๆ ที่เป็นประโยชน์ต่อตัวละครทั้งหมดใน [culture|E] หนึ่ง ๆ นวัตกรรมจะถูกจัดกลุ่มตาม [eras|E] ที่สามารถค้นพบได้\n\nผ่านการติดต่อกับวัฒนธรรมเพื่อนบ้าน แต่ละวัฒนธรรมจะได้รับ [spread|E] นวัตกรรมเฉพาะหนึ่งอย่างเสมอ ซึ่งจะถูกค้นพบได้เร็วกว่ามาก\n\nนอกจากนี้ [culture_head|E] สามารถกำหนดนวัตกรรมอื่น (หรือนวัตกรรมเดิม) เป็น [cultural_fascination|E] เพื่อการส่งเสริมเพิ่มเติมได้"
 game_concept_cultural_fascination:0 "ความหลงใหลทางวัฒนธรรม"
 game_concept_fascination:0 "ความหลงใหล"
 game_concept_cultural_fascination_desc:0 "แต่ละวัฒนธรรมจะหลงใหลใน [innovation|E] เฉพาะอย่างใดอย่างหนึ่งเสมอ ซึ่งจะเพิ่มความเร็วในการค้นพบอย่างมากในอัตราที่ขึ้นอยู่กับ [skills|E] ของ [culture_head|E] คนปัจจุบัน นวัตกรรม แต่ละอย่างได้รับประโยชน์จากทักษะเฉพาะ\n\nผู้นำทางวัฒนธรรมสามารถเปลี่ยนความหลงใหลทางวัฒนธรรมได้อย่างอิสระ"
 game_concept_cultural_spread: "การแพร่กระจายทางวัฒนธรรม"
 game_concept_spread: "แพร่กระจาย"
 game_concept_cultural_spread_desc: "การติดต่อกับ [cultures|E] อื่น ๆ ที่มี [innovations|E] ที่ยังไม่ถูกค้นพบ จะ ทำให้นวัตกรรม $game_concept_innovations$ หนึ่งในนั้นถูกค้นพบได้รวดเร็วยิ่งขึ้น ในบรรดา [cultures|E] ที่มีสิทธิ์ วัฒนธรรมที่มี [cultural_acceptance|E] สูงสุดจะถูกเลือกให้แพร่กระจายความก้าวหน้าของ [innovation|E]"
 game_concept_congenital:0 "แต่กำเนิด"
 game_concept_congenital_trait:0 "ลักษณะนิสัย แต่กำเนิด"
 game_concept_congenital_traits:0 "ลักษณะนิสัย แต่กำเนิด"
 game_concept_congenital_desc:0 "[traits|E] บางอย่างเป็นลักษณะ แต่กำเนิดและสามารถถ่ายทอดทางพันธุกรรมไปยังลูกหลานได้ ผ่านการ [breeding|E] ที่เหมาะสม ยังเป็นไปได้ที่จะเสริมสร้างลักษณะนิสัยดังกล่าวบางอย่างให้แข็งแกร่งขึ้น\n\nตัวอย่าง เช่น หากพ่อแม่ทั้งคู่เป็น [GetTrait('intellect_good_1').GetName( GetNullCharacter )] มีโอกาสที่ลูก ๆ ของพวกเขาจะได้รับลักษณะ [GetTrait('intellect_good_2').GetName( GetNullCharacter )] ที่ดียิ่งขึ้นไปอีก\n\n[skills|E] พื้นฐานไม่ใช่ลักษณะ แต่กำเนิด"
 game_concept_breeding:0 "การผสมพันธุ์"
 game_concept_bred:0 "ผสมพันธุ์"
 game_concept_breed:0 "ผสมพันธุ์"
 game_concept_breeding_desc:2 "โดยการจัดการ [marriages|E] ระหว่างตัวละครที่มี [traits|E] [congenital|E] ที่ดี เป็นไปได้ที่จะผสมพันธุ์ให้ได้ลูกที่มีลักษณะนิสัยเดียวกัน ลูกหลานที่โชคดีอาจได้รับลักษณะเหล่านั้นในเวอร์ชันที่แข็งแกร่งขึ้น\n\nอย่างไรก็ตาม เช่นเดียวกันกับลักษณะนิสัย แต่กำเนิดที่ไม่ดี เช่น [GetTrait('beauty_bad_2').GetName( GetNullCharacter )]\n\nอาจเป็นเรื่องน่าดึงดูดใจที่จะจัดการ แต่งงานระหว่างตัวละครที่มีความสัมพันธ์ใกล้ชิดกันเพื่อสร้างลักษณะนิสัยที่ดีขึ้นในลูก ๆ ของท่าน แต่นี่ก็มีความเสี่ยงที่จะเกิดข้อบกพร่องจาก [inbreeding|E] ด้วย"
 game_concept_inbreeding:0 "การสมสู่ในสายเลือด"
 game_concept_inbred:0 "เกิดจากการสมสู่ในสายเลือด"
 game_concept_inbreeding_desc:1 "[children|E] ของ [characters|E] สองคนที่เกี่ยวข้องกันอย่างใกล้ชิดมีความเสี่ยงที่จะเกิดมาพร้อมกับข้อบกพร่อง [congenital|E] ซึ่งร้ายแรงที่สุดคือ [trait|E] [GetTrait('inbred').GetName( GetNullCharacter )]\n\nสิ่งนี้เกิดขึ้นได้ยากในรุ่นแรก แต่ $game_concept_inbreeding$ ที่ต่อเนื่องกันจะเพิ่มความเสี่ยง\n\nอย่างไรก็ตาม $game_concept_inbreeding$ หลายชั่วอายุคนก็สามารถ ส่งผลให้เกิด $game_concept_trait$ ที่เป็นประโยชน์ [GetTrait('pure_blooded').GetName( GetNullCharacter )] ซึ่ง (หากพ่อแม่ทั้งคู่มี) จะ ทำให้ลูกหลานมีภูมิคุ้มกันต่อข้อบกพร่อง แต่กำเนิด เนื่องจากข้อบกพร่องทั้งหมดได้ถูก [bred|E] ออกไปจากสายเลือดแล้ว"
 game_concept_cadet_branching:0 "การแตกสาขาตระกูลย่อย"
 game_concept_cadet_branch:0 "สาขาตระกูลย่อย"
 game_concept_cadet_branches:0 "สาขาตระกูลย่อย"
 game_concept_cadet_branching_desc:0 "[dynasties|E] มักจะมี [house|E] ผู้ก่อตั้งเสมอ แต่ เพื่อให้ได้เป็น [house_heads|E] ด้วยตนเอง สมาชิก [house|E] สามารถเลือกที่จะสร้างตระกูลใหม่ของตนเองได้ — ซึ่งก็คือสาขาตระกูลย่อย\n\nสมาชิกของตระกูลสาขาเหล่านี้มีอิสระที่จะทำ เช่นเดียวกัน ซึ่งในที่สุดจะนำไปสู่โครงสร้างตระกูลย่อย ๆ ภายในราชวงศ์ที่ใหญ่กว่า"
 game_concept_house_head_interaction:0 "ปฏิสัมพันธ์ของประมุขตระกูล"
 game_concept_house_head_interaction_desc:0 "[interactions|E] พิเศษที่ [house_head|E] สามารถกระทำต่อสมาชิกใน [house|E] ของตนได้"
 game_concept_demand_conversion:0 "เรียกร้องให้เปลี่ยนศาสนา"
 game_concept_demanding_conversion:0 "การเรียกร้องให้เปลี่ยนศาสนา"
 game_concept_demand_conversion_desc:1 "[rulers|E] ที่มีข้าราชบริพารที่นับถือ [faith|E] อื่น อาจเรียกร้องให้เปลี่ยนศาสนาเพื่อเปลี่ยนศรัทธาของข้าราชบริพารให้เป็นของตนเอง ทักษะ [learning|E] ของผู้ปกครองและ [opinion|E] ของข้าราชบริพารที่มีต่อเจ้าเหนือหัวเป็นปัจจัยสำคัญในการตัดสินว่าข้าราชบริพารจะยอมรับข้อเรียกร้อง หรือ [Concept('refuse_conversion_crime','refuses')|E] หรือไม่"
 game_concept_damage:0 "ความเสียหาย"
 game_concept_damage_desc:1 "ความเสียหายของ [soldier|E] กำหนดจำนวน [casualties|E] ที่พวกเขาสามารถสร้างให้กับศัตรูได้ในระหว่าง [battle|E]\n\nทหาร [levy|E] สร้างความเสียหาย [GetDefine('NCombat', 'LEVY_ATTACK')|0] หน่วย"
 game_concept_toughness:0 "ความทนทาน"
 game_concept_toughness_desc:1 "ความทนทานของ [soldier|E] กำหนดปริมาณ [damage|E] ที่พวกเขาสามารถรับได้ใน [battle|E] ก่อนที่จะกลายเป็น [casualty|E]\n\nทหาร [levy|E] มีความทนทาน [GetDefine('NCombat', 'LEVY_TOUGHNESS')|0] หน่วย"
 game_concept_pursuit:0 "การไล่ตาม"
 game_concept_pursuit_desc:1 "[army|E] ที่ได้รับชัยชนะจะเพิ่มจำนวน [casualties|E] ที่พวกเขาสร้างขึ้นใน [aftermath|E] ของ [battle|E] ด้วยค่า $game_concept_pursuit$ รวมของ $game_concept_army$ โดยเปลี่ยน [routed_soldiers|E] ให้เป็น [dead_soldiers|E]"
 game_concept_screen:0 "การป้องกัน"
 game_concept_screen_desc:0 "[army|E] ที่พ่ายแพ้จะลดจำนวน [casualties|E] ที่พวกเขาได้รับใน [aftermath|E] ของ [battle|E] ด้วยค่าการป้องกันรวมของกองทัพ"
 game_concept_siege_progress:0 "ความคืบหน้าการล้อม"
 game_concept_siege_progress_desc:1 "$game_concept_siege_progress$ บ่งชี้ว่า [siege|E] ใกล้จะเสร็จสมบูรณ์เพียงใด และคาดว่า $game_concept_siege$ จะใช้เวลานานเท่าใด เมื่อความคืบหน้าเต็ม [holding|E] จะกลายเป็น [occupied|E]\n\nจำนวน $game_concept_siege_progress$ ที่ต้องการได้รับผลกระทบจาก [fort_level|E] และการประจำการของ [garrison|E]\n\nความคืบหน้าจะเพิ่มขึ้นทุกวันและได้รับผลกระทบจากเหตุการณ์การล้อม นอกจากนี้ยังสามารถเพิ่มได้โดยการมี [siege_weapons|E] หรือ [army|E] ที่มีจำนวนมากกว่า [garrison|E] อย่างมาก"
 game_concept_siege_weapon:0 "อาวุธล้อมเมือง"
 game_concept_siege_weapons:0 "อาวุธล้อมเมือง"
 game_concept_siege_weapon_desc:0 "$game_concept_siege_weapons$ คือ [men_at_arms|E] ที่มุ่งเน้นไปที่ [sieges|E] โดยเฉพาะ\n\nไม่มีผลกระทบต่อ [battles|E] แต่จะ ทำให้ $game_concept_siege$ เสร็จสมบูรณ์เร็วขึ้นมากโดยการเพิ่ม [siege_progress|E]\n\nอย่างไรก็ตาม $game_concept_siege_weapons$ มีประสิทธิภาพในการล้อม [holdings|E] ได้ถึง [fort_level|E] ที่กำหนดเท่านั้น"
 game_concept_completely_controls:0 "ควบคุมโดยสมบูรณ์"
 game_concept_completely_control:0 "ควบคุมโดยสมบูรณ์"
 game_concept_completely_controlled:0 "ถูกควบคุมโดยสมบูรณ์"

 game_concept_complete_control:0 "การควบคุมโดยสมบูรณ์"
 game_concept_complete_control_desc:2 "เงื่อนไขนี้จะสมบูรณ์เมื่อ [titles|E] ข้าหลวง [de_jure|E] ทั้งหมดของตำแหน่งเป้าหมายถูกถือครองโดย [ruler|E] หรือโดย [vassals|E] ของพวกเขา และไม่มีเคาน์ตีใด ๆ ของมันถูก [occupied|E] โดย [armies|E] ศัตรู"
 game_concept_complete_control_region:0 "การควบคุมโดยสมบูรณ์"
 game_concept_completely_controls_region:0 "ควบคุมโดยสมบูรณ์"
 game_concept_completely_control_region:0 "ควบคุมโดยสมบูรณ์"
 game_concept_complete_control_region_desc:0 "เงื่อนไขนี้จะสมบูรณ์เมื่อ [counties|E] ทั้งหมดใน [region|E] เป้าหมายถูกถือครองโดยผู้ปกครองหรือโดย [vassals|E] ของพวกเขา และไม่มีเคาน์ตีใด ๆ ของมันถูกยึดครองโดยกองทัพศัตรู"
 game_concept_region:0 "ภูมิภาค"
 game_concept_regions:0 "ภูมิภาค"
 game_concept_region_desc:0 "ภูมิภาคประกอบด้วยพื้นที่ทางภูมิศาสตร์ที่เฉพาะเจาะจงบนแผนที่ แตกต่างจาก [de_jure|E] ภูมิภาคจะไม่เปลี่ยนแปลง"
 game_concept_recently_disembarked:0 "เพิ่งขึ้นฝั่ง"
 game_concept_recently_disembarked_desc:0 "[army|E] จะกลายเป็น '$game_concept_recently_disembarked$' เมื่อใดก็ตามที่ขึ้นฝั่งหลังจากอยู่ในทะเล ซึ่งจะ ทำให้ $game_concept_army$ ได้รับโทษ [advantage|E] ใน [battles|E] เป็นระยะเวลาหนึ่ง"
 game_concept_diplomatic_range:0 "ระยะทางการทูต"
 game_concept_range:0 "ระยะทาง"
 game_concept_diplomatic_range_desc:0 "ท่านสามารถโต้ตอบกับตัวละครที่อยู่ในระยะทางการทูตเท่านั้น อย่างไรก็ตาม [realms|E] ที่อยู่ใกล้เคียงจะอยู่ในระยะเสมอ"
 game_concept_mongol_empire:0 "จักรวรรดิมองโกล"
 game_concept_mongol_empire_desc:0 "[title|E] ระดับ [empire|E] ที่สามารถสร้างขึ้นโดยผู้ปกครองชนเผ่าที่ทรงอำนาจบนทุ่งหญ้าสเตปป์ ซึ่งจะเปิดใช้งาน [mongol_invasion_casus_belli|E]\n\nตำแหน่งนี้สร้างขึ้นโดยการใช้ [decision|E] #EMP $become_greatest_of_khans_decision$#! "
 game_concept_mongol_invasion_casus_belli:0 "เหตุแห่งสงครามการรุกรานของมองโกล"
 game_concept_mongol_invasion_casus_belli_desc:0 "[casus_belli|E] อันทรงพลังที่มีให้เฉพาะ [ruler|E] ของ [mongol_empire|E] เท่านั้น\n\nสามารถกำหนดเป้าหมายไปยัง [title|E] ระดับ [kingdom|E] ทั้งหมดได้ในคราวเดียว และช่วยให้ขยายอาณาเขตได้อย่างรวดเร็วครอบคลุมพื้นที่ขนาดใหญ่"
 game_concept_hungarian_invasion_casus_belli:0 "เหตุแห่งสงคราม $HUNGARIAN_INVASION_CB_NAME$"
 game_concept_hungarian_invasion:0 "$HUNGARIAN_INVASION_CB_NAME$"
 game_concept_hungarian_invasion_casus_belli_desc:0 "[casus_belli|E] อันทรงพลังที่อาจใช้ได้เพียงครั้งเดียวต่อแคมเปญทั้งหมด เพื่อพิชิตดินแดนทั้งหมดที่เป้าหมายถือครองภายในพันโนเนีย\n\nเมื่อได้รับชัยชนะ $mogyer_collective_noun$ ทั้งหมดใน [realm|E] ของผู้โจมตีจะย้ายไปพร้อมกับพวกเขาไปยังพันโนเนีย ทั้ง [counties|E] #EMP และ#! [vassals|E] แทนที่ $avar$ $game_concept_counties$ ข้าหลวงอื่น ๆ นอกพันโนเนียจะถูกทอดทิ้ง ในขณะที่ $game_concept_counties$ ที่เคยถูกยึดครองหรือถือครองโดย $mogyer_collective_noun$ จะถูกทิ้งไว้ให้กับขุนศึกท้องถิ่นรายย่อยและชนเผ่าสเตปป์คู่แข่ง"
 game_concept_pax_romana_invasion_casus_belli: "เหตุแห่งสงครามพักซ์โรมานา"
 game_concept_pax_romana_invasion_casus_belli_desc: "[casus_belli|E] อันทรงพลังที่มีให้เฉพาะ [ruler|E] ของจักรวรรดิโรมันเพื่อวัตถุประสงค์ในการเปิดศักราชใหม่ของ [Glossary( 'สันติภาพโรมัน', 'PAX_ROMANA_GLOSS' )]\n\nสามารถกำหนดเป้าหมายไปยัง [title|E] ระดับ [empire|E] ทั้งหมดได้ในคราวเดียว และช่วยให้ขยายอาณาเขตได้อย่างรวดเร็วครอบคลุมพื้นที่ขนาดใหญ่"
 game_concept_eastern_roman_empire: "จักรวรรดิโรมันตะวันออก"
 game_concept_eastern_roman_empire_desc: "[title|E] ระดับ [empire|E] ที่สามารถสร้างขึ้นโดยผู้ถือครองจักรวรรดิโรมัน\n\nตำแหน่งนี้สร้างขึ้นโดยการใช้ [decision|E] #EMP $split_roman_empire_decision$#! "
 game_concept_imperial_expedition_cb: "การกรีธาทัพของจักรวรรดิ"
 game_concept_imperial_expedition_cb_expedition: "การกรีธาทัพ"
 game_concept_imperial_expedition_cb_desc: "[casus_belli|E] ที่ทรงพลังอย่างยิ่ง ซึ่งใช้ได้โดย [co_emperors|E] ใน $game_concept_duumvirates$\n\n$game_concept_imperial_expedition_cb$ อาจเปิดฉากต่อ [realm|E] ใด ๆ ที่มีพรมแดนติดกับ [empire|E] หรือถือครองดินแดนที่ [de_jure|E] เป็นของจักรพรรดิอาวุโส\n\nสามารถ (และโดยทั่วไปจะ) กำหนดเป้าหมาย #BER ทั้งหมด#! [duchies|E] ที่มีพรมแดนติดกับ $game_concept_empire$ โดยพฤตินัย หรือ $game_concept_de_jure$ เป็นของจักรวรรดิ\n\nนอกจากนี้ [governor|E] ทุกคนที่อยู่ติดกับผู้ป้องกันจะถูกเรียกเข้าสู่ [war|E] ในฐานะ [ally|E] โดยบังคับ $game_concept_governors$ ที่อยู่ห่างไกล ซึ่งมี [province_administrations|E] ทางทหารอาจเลือกเข้าร่วมความขัดแย้งได้\n\nหากชนะ $game_concept_war$ $game_concept_co_emperor$ จะต้องตัดสินใจระหว่าง:\n$EFFECT_LIST_BULLET$มอบดินแดนที่พิชิตได้ให้กับจักรพรรดิอาวุโสเพื่อแลกกับ [influence|E] และ [opinion|E]\n$EFFECT_LIST_BULLET$เก็บดินแดนไว้สำหรับตนเอง (เสีย $game_concept_opinion$)\n$EFFECT_LIST_BULLET$มอบดินแดนส่วนใหญ่ให้ ในขณะที่เก็บ [duchy|E] ที่ดีที่สุดไว้ (ลด [influence|E] และ [opinion|E] เล็กน้อย)\n$EFFECT_LIST_BULLET$ แต่งตั้ง $game_concept_governors$ ชั่วคราวในท้องถิ่น ซึ่งจะเป็นหนี้บุญคุณพวกเขา\n\n#WEAK รางวัลทั้งหมดปรับตามขนาดดินแดนที่ยึดได้: การพิชิตครั้งใหญ่จะได้รับ $game_concept_influence$ #EMP มากกว่าอย่างมีนัยสำคัญ#! เมื่อเทียบกับสงครามชายแดนเล็ก ๆ#!"
 game_concept_knight:0 "อัศวิน"
 game_concept_knights:0 "อัศวิน"
 game_concept_knight_i:0 "@knight_icon!"
 game_concept_knights_possessive: "ของอัศวิน"
 game_concept_knight_desc:4 "$game_concept_knight$ คือ [vassal|E], [courtier|E], หรือ [follower|E] ที่ต่อสู้โดยตรงใน [army|E] ของท่าน\n\nในระหว่าง [battles|E] $game_concept_knights$ จะใช้ [prowess_skill|E] ของตนเพื่อต่อสู้อย่างมีประสิทธิภาพมากขึ้น $game_concept_prowess$ ที่สูงหมายความว่าพวกเขาจะสามารถสร้างความเสียหายแก่ศัตรูได้มากขึ้น และมีแนวโน้มที่จะรอดชีวิตหรือแม้กระทั่งออกมาจาก $game_concept_battle$ โดยไม่ได้รับบาดเจ็บ\n\n[SelectLocalization( HasDlcFeature( 'tours_and_tournaments' ), 'game_concept_knight_desc_TOTO_DLC', 'game_concept_knight_desc_NO_TOTO_DLC' )][SelectLocalization( HasDlcFeature( 'accolades' ), 'game_concept_knight_desc_ACCOLADE_DLC', '' )]#weak อัศวินอาจเป็นที่รู้จักในชื่อต่าง ๆ ขึ้นอยู่กับ [culture] หรือ [faith] ตัวอย่างเช่น $knight_champion_no_tooltip_plural$, $knight_faris_no_tooltip_plural$ หรือ $knight_baghatur_no_tooltip_plural$\n\nอัศวินเป็นตัวแทนของทั้งตัวละครและกองทหารผู้ติดตามของพวกเขา#!"
 game_concept_knight_desc_TOTO_DLC:0 "ท่านจะได้รับ [prestige|E] ทุกครั้งที่ $game_concept_knights$ ของท่าน [contest_qualifies|E] สำเร็จ หรือชนะการ [contest|E] [GetActivityType( 'activity_tournament' ).GetName]\n\n"
 game_concept_knight_desc_NO_TOTO_DLC:0 ""
 game_concept_knight_desc_ACCOLADE_DLC:0 "อัศวินที่ได้รับ [accolade|E] จะกลายเป็น [acclaimed_knights|E]\n\n"


 game_concept_knight_effectiveness:0 "ประสิทธิภาพของอัศวิน"
 game_concept_knight_effectiveness_desc:0 "ประสิทธิภาพของอัศวินของ [ruler|E] กำหนดว่า [knights|E] ของพวกเขาต่อสู้ได้ดีเพียงใดใน [battle|E]\n\nที่ 100% อัศวินจะต่อสู้ตามปกติ แต่ที่ 200% พวกเขาจะต่อสู้ราวกับว่า [prowess|E] ของพวกเขาเพิ่มขึ้นเป็นสองเท่า"
 game_concept_short_reign:0 "การครองราชย์สั้น"
 game_concept_short_reign_desc:0 "'การครองราชย์สั้น' คือโทษ [opinion|E] ที่ลดลงเรื่อย ๆ ซึ่งตัวละครทั้งหมดใน [realm|E] มีต่อ [liege|E] คนใหม่\n\nในทำนองเดียวกัน ข้าราชบริพารจะได้รับโบนัสความคิดเห็น [long_reign|E] ที่เพิ่มขึ้นกับเจ้าเหนือหัวที่ปกครองพวกเขามาเป็นเวลานาน"
 game_concept_long_reign:0 "การครองราชย์ยาวนาน"
 game_concept_long_reign_desc:0 "'การครองราชย์ยาวนาน' คือโบนัส [opinion|E] ที่เพิ่มขึ้น ซึ่งตัวละครทั้งหมดใน [realm|E] มีต่อ [liege|E] ที่ปกครองพวกเขามาเป็นเวลานาน\n\nในทำนองเดียวกัน ข้าราชบริพารมีโทษความคิดเห็น [short_reign|E] ที่ลดลงเรื่อย ๆ กับเจ้าเหนือหัวคนใหม่"
 game_concept_troop_quality:0 "คุณภาพ"
 game_concept_troop_quality_desc:0 "$game_concept_troop_quality$ วัดพลังของ [army|E] เทียบกับจำนวน [soldiers|E]\n\n$game_concept_army$ ที่มีเพียง [knights|E] และ [men_at_arms|E] จะมี $game_concept_troop_quality$ สูง ในขณะที่ $game_concept_army$ ที่มี [levies|E] จำนวนมากจะมี $game_concept_troop_quality$ ต่ำกว่า\n\nซึ่งหมายความว่า $game_concept_army$ ที่เล็กกว่า แต่มี $game_concept_troop_quality$ สูงจะต่อสู้ได้ดีเกินคาด — โปรดพิจารณาทั้งจำนวนทหาร #Emphasis และ#! $game_concept_troop_quality$ อย่างรอบคอบก่อนเข้าปะทะกับศัตรู!"
 game_concept_religious_family:0 "กลุ่มศาสนา"
 game_concept_religious_families:0 "กลุ่มศาสนา"
 game_concept_religious_family_desc:0 "$game_concept_religious_family$ คือกลุ่มของ [religions|E] $game_concept_religious_family$ ส่งผลต่อวิธีที่ศาสนาต่าง ๆ และ [faiths|E] ในนั้นมอง ซึ่งกันและกัน\n\nกลุ่ม [GetReligionFamily('rf_abrahamic').GetName] ยอมให้มี [holy_wars|E] ต่อทุกคน #weak (รวมถึงผู้นับถือศาสนาอับราฮัมอื่น ๆ)#! ศาสนาต่าง ๆ มีแนวโน้มที่จะเกิด [heresy|E]\n\nกลุ่ม [GetReligionFamily('rf_eastern').GetName] ยอมให้มีสงครามศักดิ์สิทธิ์ต่อกลุ่มศาสนาอื่นเท่านั้น\n\nกลุ่ม [GetReligionFamily('rf_pagan').GetName] ยอมให้มีสงครามศักดิ์สิทธิ์ต่อทุกคน แต่ศรัทธาภายในศาสนาจะต้องได้รับการปฏิรูปเพื่อเข้าถึงได้"
 game_concept_debt:0 "หนี้สิน"
 game_concept_debt_desc: "หนี้คือสภาวะที่มี [gold_i][gold|E] ติดลบ โดยทั่วไปจะเกิดขึ้นเมื่อ [ruler|E] ที่อยู่ในภาวะสงครามจ้าง [mercenaries|E] โดยไม่มีทองเพียงพอที่จะครอบคลุมค่าใช้จ่ายทั้งหมด หรือเมื่อพวกเขาอยู่ในภาวะสงครามนานเกินไป\n\n ขณะอยู่ในภาวะหนี้สิน ท่านจะไม่สามารถประกาศ [wars|E] ใหม่ได้ [men_at_arms|E] ของท่านจะไม่เสริมกำลัง และศัตรูของท่านจะมี [advantage|E] เหนือท่านในการรบ ยิ่งท่านจมดิ่งสู่หนี้สินมากเท่าไหร่ ท่านก็จะยิ่งได้รับบทลงโทษมากขึ้นเท่านั้น — [levies|E] น้อยลง [county_opinion|E] ลดลง และ [vassals|E] ของท่านจะชอบท่านน้อยลง\n\nนอกเหนือจากนี้ เหตุการณ์สั่นคลอนเล็กน้อยอื่น ๆ อาจเกิดขึ้นได้ เช่น การได้รับ [county_corruption|E] ใน [counties|E] [domain|E] ของท่าน \n\n#help โดยทั่วไปเป็นความคิดที่ดีที่จะโจมตีศัตรูของท่านในขณะที่พวกเขาอยู่ในภาวะหนี้สิน เนื่องจากพวกเขาจะต่อสู้ด้วย [advantage|E] ที่ลดลง!#!"
 game_concept_treasury_debt: "หนี้คลัง"
 game_concept_treasury_debt_desc: "หนี้คลังคือสภาวะที่มี [treasury_i][treasury|E] ติดลบ โดยทั่วไปจะเกิดขึ้นเมื่อ [governor|E] ที่อยู่ในภาวะสงครามจ้าง [mercenaries|E] โดยไม่มีคลังเพียงพอที่จะครอบคลุมค่าใช้จ่ายทั้งหมด เมื่อพวกเขาอยู่ในภาวะสงครามนานเกินไป หรือหากพวกเขาจ่าย [Concept( 'treasury_budgeting', 'Salaries' )|E] มากเกินไปสำหรับสิ่งที่พวกเขารวบรวมจาก [vassals|E]\n\n ขณะอยู่ในภาวะหนี้สิน ท่านจะไม่สามารถประกาศ [wars|E] ใหม่ได้ [men_at_arms|E] ของท่านที่พึ่งพาคลังจะไม่เสริมกำลัง และศัตรูของท่านจะมี [advantage|E] เหนือท่านในการรบ ยิ่งท่านจมดิ่งสู่หนี้สินมากเท่าไหร่ ท่านก็จะยิ่งได้รับบทลงโทษมากขึ้นเท่านั้น — [levies|E] น้อยลง [county_opinion|E] ลดลง และ [vassals|E] ของท่านจะชอบท่านน้อยลง\n\nนอกเหนือจากนี้ เหตุการณ์สั่นคลอนเล็กน้อยอื่น ๆ อาจเกิดขึ้นได้ เช่น การได้รับ [county_corruption|E] ใน [counties|E] [domain|E] ของท่าน \n\n#help โดยทั่วไปเป็นความคิดที่ดีที่จะโจมตีศัตรูของท่านในขณะที่พวกเขาอยู่ในภาวะหนี้สิน เนื่องจากพวกเขาจะต่อสู้ด้วย [advantage|E] ที่ลดลง!#!"
 game_concept_beneficiary:0 "ผู้รับผลประโยชน์"
 game_concept_beneficiaries:0 "ผู้รับผลประโยชน์"
 game_concept_beneficiary_desc:1 "ผู้เข้าร่วมทุกคนใน [great_holy_war|E] สามารถเลือก $game_concept_beneficiary$ จาก [dynasty|E] ของตนได้ เมื่อได้รับชัยชนะ $game_concept_beneficiary$ จะได้รับดินแดนในอาณาจักรเป้าหมายตามสัดส่วนของ [war_contribution|E] ของผู้ปกครองที่เป็นผู้อุปถัมภ์\n\nผู้มีส่วนร่วมรายใหญ่ที่สุดสามารถบังคับให้ผู้รับผลประโยชน์ของตนได้รับตำแหน่งหลักที่ต่อสู้กันอยู่"
 game_concept_papal_recipient:0 "ผู้สมัครที่ได้รับการสนับสนุน"
 game_concept_papal_recipient_desc:1 "หากเป้าหมายหลักของ [great_holy_war|E] ถูกถือครองหรืออ้างสิทธิ์โดยสมาชิกของศรัทธาผู้รุกรานอยู่แล้ว พวกเขาจะถือเป็นผู้รับตำแหน่งที่ต่อสู้กันอย่างชอบธรรม เว้น แต่ [Concept( 'war_contribution', 'Contributor' )|E] หลักจะตัดสินใจให้ความสำคัญกับ [beneficiary|E] ของตนก่อน"
 game_concept_end_date:0 "วันที่สิ้นสุด"
 game_concept_end_date_desc:0 "ปี ค.ศ. 1453 คือวันที่สิ้นสุด และเมื่อถึงวันดังกล่าว เกมจะจบลง"
 
 game_concept_realm_size:0 "ขนาดอาณาจักร"
 game_concept_realm_size_desc:1 "$game_concept_realm_size$ ของตัวละครคือจำนวน [counties|E] ที่พวกเขาและ [vassals|E] ของพวกเขาเป็นเจ้าของ"
 game_concept_voter_strength:0 "อำนาจการลงคะแนนเสียง"
 game_concept_voting_strength:0 "อำนาจการลงคะแนนเสียง"
 game_concept_voting_power:0 "อำนาจการลงคะแนนเสียง"
 game_concept_voter_strength_desc:0 "อำนาจการลงคะแนนเสียงแสดงถึงอิทธิพลที่ผู้มีสิทธิ์เลือกตั้งมีเมื่อลงคะแนนใน [succession_law|E] แบบเลือกตั้ง ค่านี้มักจะเพิ่มขึ้นขึ้นอยู่กับ [rank|E] ของผู้ปกครอง แต่ปัจจัยอื่น ๆ อาจเข้ามามีบทบาทขึ้นอยู่กับกฎหมาย [titlepossessive|E]"
 game_concept_stress_level:0 "ระดับความเครียด"
 game_concept_stress_levels:0 "ระดับความเครียด"
 game_concept_stressed:0 "เครียด"
 game_concept_stress_level_desc:1 "ทุก ๆ 100 [stress|E] ที่ตัวละครสะสมจะ ทำให้พวกเขาได้รับระดับความเครียดด้วย ระดับความเครียดมีตั้งแต่ 0 ถึง 3 โดย แต่ละระดับจะกำหนดบทลงโทษที่เพิ่มขึ้นต่อ [fertility|E] และ [health|E] ของตัวละคร\n\nนอกจากนี้ ตราบใดที่ตัวละครมีระดับความเครียดอย่างน้อย 1 พวกเขาจะเสี่ยงต่อ [mental_breaks|E]"
 game_concept_mental_break:0 "สภาวะจิตใจแตกสลาย"
 game_concept_mental_breaks:0 "สภาวะจิตใจแตกสลาย"
 game_concept_mental_break_desc:0 "เมื่อ [stress|e] ท่วมท้นตัวละคร พวกเขาจะประสบกับสภาวะจิตใจแตกสลาย — วิกฤตส่วนตัวที่พวกเขารู้สึกว่าต้องทำอะไรบางอย่างเพื่อลดความเครียด ไม่ว่าจะต้องแลกด้วยอะไรก็ตาม\n\nตัวละครที่ทุกข์ทรมานจากสภาวะจิตใจแตกสลายจะมีหลายวิธีในการรับมือกับสถานการณ์ แม้ว่าหลายวิธีจะมีผลเสียตามมา\n\nที่ [stress_levels|E] ต่ำ ผลกระทบเหล่านี้จะเล็กน้อยและจัดการได้ง่าย อย่างไรก็ตาม เมื่อระดับความเครียดเพิ่มขึ้น ผลกระทบเหล่านี้ก็จะเพิ่มขึ้นด้วย ซึ่งในที่สุดจะนำไปสู่ความวิกลจริตและแม้กระทั่งความตาย"
 stress_icon_tooltip:0 "$game_concept_mental_break_desc$"
 
 game_concept_clergy_opinion:0 "ความคิดเห็นของนักบวช"
 game_concept_clergy_opinion_desc:0 "[opinion|E] ประเภทนี้มีผลต่อ [clergy|E] ใน [faith|E] ของท่านเท่านั้น"
 
 game_concept_secular_opinion:0 "ความคิดเห็นทางโลก"
 game_concept_secular_opinion_desc:0 "[opinion|E] ประเภทนี้มีผลต่อตัวละครทั้งหมดที่ #emphasis ไม่ใช่#! [clergy|E]"

 game_concept_title_allegiance:0 "ความจงรักภักดีต่อตำแหน่ง"
 game_concept_title_allegiance_desc:0 "[vassals|E] สามารถแสดงความจงรักภักดีต่อ [title|E] ที่เฉพาะเจาะจง แทนที่จะเป็นตัวบุคคลของ [liege|E] ของพวกเขา สิ่งนี้จะเกิดขึ้นได้ก็ต่อเมื่อตำแหน่งนั้นมี [succession_law|E] ของตัวเอง เมื่อมีการ [succession|E] ข้าหลวงดังกล่าวจะกลายเป็นข้าหลวงของผู้ถือ [holder|E] ตำแหน่งคนใหม่"
 game_concept_nominate:0 "เสนอชื่อ"
 game_concept_nominate_heir:0 "เสนอชื่อทายาท"
 game_concept_nomination:0 "การเสนอชื่อ"
 game_concept_nominations:0 "การเสนอชื่อ"
 game_concept_nominate_desc:1 "ภายใต้ [succession_laws|E] แบบเลือกตั้ง [elector|E] แต่ละคนสามารถเสนอชื่อ [title_heir|E] ที่ต้องการได้ ผู้สมัครที่ถูกต้องและความชอบในการลงคะแนนของผู้มีสิทธิ์เลือกตั้งจะแตกต่างกันไปขึ้นอยู่กับกฎหมายเฉพาะ"
 game_concept_elector:0 "ผู้มีสิทธิ์เลือกตั้ง"
 game_concept_electors:0 "ผู้มีสิทธิ์เลือกตั้ง"
 game_concept_elector_desc:1 "ผู้มีสิทธิ์เลือกตั้งคือตัวละครที่ได้ลงคะแนนเสียงเลือก [title_heir|E] ที่ต้องการภายใต้ [succession_laws|E] แบบเลือกตั้ง กฎหมายเฉพาะจะกำหนดว่าใครถือเป็นผู้มีสิทธิ์เลือกตั้ง"
 game_concept_attraction:0 "แรงดึงดูด"
 game_concept_attracted:0 "ถูกดึงดูด"
 game_concept_attraction_desc:0 "แรงดึงดูดเป็นประเภทของ [opinion|E] ที่มีผลต่อตัวละครที่มี [sexuality|E] ตรงกับเพศของท่านเท่านั้น\n\nตัวอย่าง เช่น ชาย [homosexual|E] จะมีความคิดเห็นนี้ต่อชายอื่น ตัวละคร [asexual|E] จะไม่มีความคิดเห็นนี้ต่อใครเลย และหญิง [heterosexual|E] จะมีความคิดเห็นนี้ต่อชาย\n\nความคิดเห็นประเภทนี้จะหยุดส่งผลต่อผู้หญิงที่มีอายุเกิน [GetDefine('NCharacter', 'FEMALE_ATTRACTION_CUTOFF_AGE')] ปี และสำหรับผู้ชายที่มีอายุเกิน [GetDefine('NCharacter', 'MALE_ATTRACTION_CUTOFF_AGE')] ปี"
 game_concept_sexuality:1 "รสนิยมทางเพศ"
 game_concept_sexuality_desc:1 "รสนิยมทางเพศของตัวละครกำหนดว่าพวกเขาอาจ [attracted|E] ต่อตัวละครอื่นใด\n\nรสนิยมทางเพศไม่มีผลต่อว่าพวกเขาจะ [marry|E] ใครได้ แต่ อาจลด [fertility|E] ของคู่สมรสหากคู่สมรสฝ่ายใดฝ่ายหนึ่งไม่ตรงกับความชอบของอีกฝ่าย\n\nรสนิยมทางเพศที่จำลองใน #EMP Crusader Kings III#! ได้แก่:\n$EFFECT_LIST_BULLET$[heterosexual|E]\n$EFFECT_LIST_BULLET$[homosexual|E]\n$EFFECT_LIST_BULLET$[bisexual|E]\n$EFFECT_LIST_BULLET$[asexual|E]"
