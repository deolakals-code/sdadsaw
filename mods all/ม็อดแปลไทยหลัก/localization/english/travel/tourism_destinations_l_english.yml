l_english: 
 building_holy_site_mahabodhi_temple_destination_desc: "ขณะเดินท่องไปในบริเวณอันศักดิ์สิทธิ์ของ [GetBuilding('holy_site_mahabodhi_temple_01').GetName] ข้าพเจ้ารู้สึกถึงความสงบ สถานที่ ซึ่งพระพุทธเจ้าทรงตรัสรู้ใต้ต้นพระศรีมหาโพธิ์แห่งนี้เป็นสถานที่แห่งความสงบอย่างแท้จริง ภาพแกะสลักอันวิจิตรบรรจงที่พรรณนาถึงการเดินทางสู่การตรัสรู้ของพระองค์เตือนข้าพเจ้าถึงเส้นทางแห่งจิตวิญญาณที่เราทุกคนต้องดำเนินตาม"
 building_goguryeo_tomb_destination_desc: "พีระมิดมหึมาตั้งตระหง่านเหนือภูมิทัศน์จนเห็นได้แต่ไกล แม้จะถูกเรียกว่า [GetBuilding('goguryeo_tomb_01').GetName] แต่ดูเหมือนจะไม่มีใครบอกได้อย่างแน่ชัดว่ากษัตริย์องค์ใดถูกฝังไว้ที่นี่ กระนั้น ขนาดอันใหญ่โตและสถาปัตยกรรมที่เป็นเอกลักษณ์ของสุสาน ร่วมกับภาพจิตรกรรมฝาผนังของทหารม้าอันน่าประทับใจภายใน กลับบอกเล่าเรื่องราวอดีตอันรุ่งโรจน์ในภูมิภาคแห่งนี้ได้อย่างดี"
 building_buddha_kamakura_destination_desc: "เมื่อข้าก้าวเข้าไปในโถงใหญ่ที่เป็นที่ประดิษฐาน [GetBuilding('buddha_kamakura_01').GetName] ข้าก็ต้องประหลาดใจกับขนาดอันมหึมาของมันในทันที แม้พระพุทธรูปจะประทับอยู่ในปางสมาธิ แต่ก็ยังสูงกว่าคนหลายคนรวมกันเสียอีก รูปหล่อสัมฤทธิ์อันใหญ่โตนี้เป็นแรงบันดาลใจให้เกิดความเลื่อมใสศรัทธาทางจิตวิญญาณ ตลอดจนความชื่นชมในฝีมือช่างชั้นยอดที่จำเป็นต่อการรังสรรค์รูปสลักสัมฤทธิ์ขนาดยักษ์เยี่ยงนี้"
 building_pyramid_lingapura_destination_desc: "[GetBuilding('pyramid_lingapura_01').GetName] เป็นจุดเด่นหลักของเมืองนี้ และเมื่อข้าก้าวเข้าสู่บริเวณล้อมรอบ ข้าก็อดไม่ได้ที่จะตื่นตาตื่นใจกับพีระมิดขนาดยักษ์ที่ตั้งตระหง่านอยู่เหนือตัวข้า หอสวดมนต์และศาลเจ้าขนาดเล็กหลายแห่งปกคลุมบางส่วนของบันไดที่นำไปสู่ยอด ซึ่งมีวิหารขนาดใหญ่ประดิษฐานศิวลึงค์ทองคำอยู่บนยอดฐานขนาดใหญ่"
 building_maijishan_grottoes_destination_desc: "ภูเขาไม่จีซานตระหง่านโดดเด่นเหนือภูมิทัศน์มาแต่ไกล แต่เมื่อข้าเข้าใกล้มากขึ้น ข้าก็เริ่มมองเห็น [GetBuilding('maijishan_grottoes_01').GetName] ที่สลักเข้าไปในด้านข้างของภูเขาสีแดงแห่งนี้มากยิ่งขึ้น มีถ้ำจำนวนมากเกินกว่าที่ข้าจะนับไหว โดยมีรูปปั้นดินเหนียวจำนวนมากประดับประดารอบทุกช่องทางเข้า"
 building_three_pagodas_dali_destination_desc: "สูงตระหง่านอยู่เบื้องหน้าหมู่เจดีย์ฉงเซิง [GetBuilding('three_pagodas_dali_01').GetName] คือจุดเด่นที่เป็นเอกลักษณ์ของเมืองต้าหลี่ อีกทั้งยังเป็นอนุสาวรีย์ที่ยิ่งใหญ่ที่สุดของอาณาจักร เจดีย์องค์ประธานที่มีความสูง 16 ชั้น เป็นเครื่องเตือนใจว่ามนุษย์ตัวเล็กจ้อยเพียงใดเมื่อเทียบกับสิ่งรอบตัว บริเวณโดยรอบเต็มไปด้วยผู้แสวงบุญและพระภิกษุ บ้างก็ไม่ได้สนใจสิ่งก่อสร้างอันยิ่งใหญ่ แต่บ้างก็เห็นได้ชัดว่ากำลังตื่นตาตื่นใจกับมันเป็นครั้งแรก"
 building_iron_lion_cangzhou_destination_desc: "[GetBuilding('iron_lion_cangzhou_01').GetName] ขนาดมหึมาที่หล่อจากเหล็กนี้ รอดพ้นจากทั้งแผ่นดินไหวและน้ำท่วมมาได้ ขณะที่ข้าสนทนากับพ่อค้าในท้องถิ่น พวกเขาเล่าให้ข้าฟังว่า แมวขนาดยักษ์ตัวนี้ยังถูกเชื่อว่าเป็นผู้พิทักษ์ต่อต้านระดับน้ำทะเลที่สูงขึ้นอีกด้วย"
 building_dengfeng_observatory_destination_desc: "เมื่อเข้าสู่เมือง [GetBuilding('dengfeng_observatory_01').GetName] อันยิ่งใหญ่จะสามารถมองเห็นได้แต่ไกล สถานที่แห่งนี้เชื่อกันว่าเป็นแกนกลางของโลก และนักดาราศาสตร์ชาวจีนได้เฝ้าสังเกตท้องฟ้ามาเป็นเวลาหลายศตวรรษ อาคารนี้ทำหน้าที่เป็นนาฬิกาแดดขนาดยักษ์ในช่วงเวลากลางวัน และเป็นหอดูดาวเพื่อทำแผนที่ดวงดาวในยามค่ำคืน"
 building_muara_takus_destination_desc: "[GetBuilding('muara_takus_01').GetName] เป็นเครื่องเตือนใจถึงแสนยานุภาพของจักรวรรดิศรีวิชัย รวมถึงเป็นศูนย์กลางการสักการะอันยิ่งใหญ่ เมื่อข้าเข้าใกล้ ข้าก็ถูกรายล้อมไปด้วยผู้แสวงบุญจากเกาะแก่งต่างๆ โดยรอบ เป็นเวลาหลายศตวรรษที่หมู่ปรางค์ที่นี่ได้เป็นศูนย์กลางแห่งอำนาจทางศาสนาและทางโลก"
 building_stone_pagoda_destination_desc: "ว่ากันว่า [GetBuilding('stone_pagoda_01').GetName] เป็นเจดีย์ที่เก่าแก่ที่สุดในภูมิภาคนี้ ด้วยงานก่ออิฐสีขาวบริสุทธิ์ที่สะท้อนแสงแดดเจิดจ้า มันจึงเป็นเรื่องยากที่จะจินตนาการถึงความเก่าแก่นั้น ข้าได้รับฟังมาว่ามันถูกสร้างขึ้นในสระน้ำที่ถูกสูบน้ำออกตามรับสั่งของกษัตริย์ในยุคโบราณ และช่างฝีมือจากทุกอาณาจักรในเกาหลีล้วนมีส่วนร่วมในการรังสรรค์มันขึ้นมา"
 building_thuriang_kilns_destination_desc: "ข้าอดไม่ได้ที่จะชื่นชมความงามของวัดวาอารามและคูน้ำที่เต็มไปด้วยน้ำในสุโขทัย เห็นได้ชัดว่าเมืองนี้ไม่ได้เป็นเพียงศูนย์กลางแห่งศรัทธาเท่านั้น เมื่อเดินผ่านบริเวณที่มีกิจกรรมพลุกพล่าน ข้าก็ได้สังเกตเห็น [GetBuilding('thuriang_kilns_01').GetName] อันเลื่องชื่อ ที่นี่ ปรมาจารย์ในงานฝีมือของตนได้ผลิตเครื่องปั้นดินเผาศิลาดลชิ้นเอกเพื่อส่งออกไปยังภูมิภาคในวงกว้าง"
 building_yuelu_academy_destination_desc: "เมื่อเดินผ่านลานกว้างด้านหน้าของ [GetBuilding('yuelu_academy_01').GetName] ข้าก็เต็มไปด้วยความเลื่อมใสต่อบรรดาบัณฑิตและลูกศิษย์ของขงจื๊อที่เดินทางมาที่นี่เพื่อสอนและสนทนาธรรม เป็นเรื่องง่ายที่จะเห็นว่าขุนนางปัญญาชนนับไม่ถ้วนได้ประโยชน์อันใดบ้างจากสิ่งที่เกิดขึ้นในลานกว้างเหล่านี้"
 building_chocolate_hills_destination_desc: "[GetBuilding('chocolate_hills_01').GetName] เป็นภาพที่แปลกตา ในช่วงเวลาส่วนใหญ่ของปี พวกมันจะอุดมสมบูรณ์ไปด้วยพืชพรรณสีเขียวขจี เพื่อที่จะเปลี่ยนเป็นสีน้ำตาลสดใส หรือเกือบจะเป็นสีส้ม ในช่วงฤดูแล้ง ข้าไม่เคยเห็นสิ่งใดเยี่ยงนี้มาก่อน และข้าก็หลงใหลในภูมิทัศน์อันน่าพิศวงนี้"
 building_fanfang_guangzhou_destination_desc: "หออะซานไม่ใช่ภาพที่จะพบเห็นได้ทุกวันในส่วนนี้ของโลก ทว่าใน [GetBuilding('fanfang_guangzhou_01').GetName] หออะซานของมัสยิดท้องถิ่นกลับปรากฏให้เห็นได้ในทันทีจากท้องถนน เมื่อเดินผ่านเขตนี้ ข้าก็ได้ยินภาษาจากทั่วทั้งเอเชีย และจากโลกอิสลาม ที่นี่ ชาวต่างชาติทุกรูปแบบล้วนอาศัยและทำงานอยู่ภายในจักรวรรดิ"
 building_wilwatikta_palace_destination_desc: "เขตเมืองของนครศักดิ์สิทธิ์นี้น่าประทับใจพอๆ กับความกว้างใหญ่ไพศาล เมื่อเดินผ่านย่านที่พักอาศัยและเข้าใกล้ [GetBuilding('wilwatikta_palace_01').GetName] ข้าก็อดไม่ได้ที่จะไตร่ตรองถึงความมั่งคั่งอันยิ่งใหญ่และอำนาจทางการเมืองของเกาะชวาและผู้คนบนเกาะแห่งนี้"
 building_ha_long_bay_destination_desc: "วิธีที่ดีที่สุดในการชม [GetBuilding('ha_long_bay_01').GetName] คือการมองจากท้องทะเล และนั่นทำให้ข้ามาอยู่บนเรือลำเล็กในอ่าวตังเกี๋ย เมื่อเราเข้าใกล้อ่าว บทสนทนาทั้งหมดก็เงียบหายไป ท่ามกลางความเงียบสงัด เราล่องเรือผ่านภูมิทัศน์ภูเขาหินปูน ภูเขาสูงใหญ่ที่รายล้อมเราอยู่ทุกด้านนั้นอาจเป็นสิ่งที่งดงามที่สุดเท่าที่ข้าเคยเห็นมา"
 building_my_son_sanctuary_destination_desc: "[GetBuilding('my_son_sanctuary_01').GetName] เป็นศูนย์กลางอารยธรรมจามมาหลายศตวรรษ โดยกษัตริย์ในยุคต่อมาได้ทรงเพิ่มศาสนสถานและอนุสรณ์สถานแห่งใหม่เข้าไปในพื้นที่ซึ่งบัดนี้มีความสงบร่มรื่นอย่างยิ่ง ข้าเต็มเปี่ยมไปด้วยความเลื่อมใสขณะที่เฝ้ามองเหล่านักบวชจาม ผู้แสวงบุญ และขุนนาง ปฏิบัติกิจของตนอยู่รอบตัวข้า"
 building_gunung_api_destination_desc: "ว่ากันว่า [GetBuilding('gunung_api_01').GetName] เป็นภูเขาศักดิ์สิทธิ์ และรูปลักษณ์ของมันก็ไม่เหมือนภูเขาอื่นใดที่ข้าเคยพบเจอในการเดินทางของข้า หินแหลมคมบางๆ ชูชันสูงขึ้นไปในอากาศในทันที ทำให้ต้นไม้รอบข้างดูเล็กจ้อยไปถนัดตา"
 building_suwalesi_megaliths_destination_desc: "หินใหญ่โบราณประเภทที่เป็นเอกลักษณ์สามารถพบเห็นได้ทั่วไปในหุบเขานี้ หินสลักรูปคนขนาดใหญ่ที่มีใบหน้าเรียบง่ายและถูกจัดวางอย่างมีรูปแบบ ล้อมรอบตัวเรา ชาวบ้านระหว่างทางมาที่นี่เล่าว่าพวกเขามีการบวงสรวงบางเสาหิน ขณะที่จุดประสงค์ของเสาหินบางต้นนั้นไม่มีใครล่วงรู้ แม้แต่ผู้คนที่อาศัยอยู่ที่นี่ก็ตาม"
 building_izumo_taisha_destination_desc: "ข้ามาถึงพื้นที่นี้ทันเวลาสำหรับงานเทศกาล ทุกหนทุกแห่งข้าเห็นผู้คนเฉลิมฉลองแด่เทพเจ้าแห่งการแต่งงาน โคโตอามัตสึคามิ เมื่อข้าเดินฝ่าฝูงชน ข้าก็มาถึง [GetBuilding('izumo_taisha_01').GetName] ในที่สุด ศาลเจ้าโบราณที่ข้าได้รับฟังมาว่าเก่าแก่กว่าศาลเจ้าอื่นใดบนเกาะเหล่านี้"
 building_confucius_temple_destination_desc: "เป็นเรื่องยากที่จะไม่รู้สึกเลื่อมใสศรัทธาอย่างยิ่ง ณ [GetBuilding('confucius_temple_01').GetName] สถานที่แห่งนี้คือวิหารศักดิ์สิทธิ์ที่เก่าแก่ที่สุดของบรมครูและแบบอย่างผู้ยิ่งใหญ่ที่ได้หล่อหลอมโลกใบนี้ ในไม่ช้า ข้าก็พบว่าตนเองได้เข้าไปต่อคิวอย่างเงียบๆ ร่วมกับผู้แสวงบุญคนอื่นๆ เพื่อเยี่ยมชมสุสานของท่านและเหล่าศิษยานุศิษย์ของท่าน"
 building_citadel_linan_destination_desc: "บนเนินเขาฟีนิกซ์ [GetBuilding('citadel_linan_01').GetName] เป็นศูนย์กลางอำนาจการบริหารที่ไม่เพียงแต่สำหรับเมืองนี้เท่านั้น แต่ยังรวมถึงภูมิภาคโดยรอบด้วย เมื่อเดินผ่านประตูเมืองเข้าไป ข้าก็ถูกรายล้อมไปด้วยบุคคลสำคัญและขุนนางปัญญาชน ทุกคนล้วนกำลังปฏิบัติหน้าที่ตามระเบียบแบบแผนที่ตำแหน่งของพวกเขากำหนดไว้"
 building_sanchi_stupa_destination_desc: "โดมของ [GetBuilding('sanchi_stupa_01').GetName] เป็นจุดโฟกัสหลักบนเนินเขานอกเมืองซานชี ท่ามกลางผู้แสวงบุญและพระสงฆ์มากมายที่ข้าพบเจอในสถานที่แห่งนี้ หลายคนอ้างว่ากลุ่มวัดนี้มีการใช้งานมานานนับพันปีแล้ว"
 building_boudhanath_destination_desc: "โดมขนาดมหึมาของ [GetBuilding('boudhanath_01').GetName] บรรจุอัฐิและพระบรมสารีริกธาตุที่เกี่ยวข้องกับพระพุทธเจ้าในอดีตหลายพระองค์ อีกทั้งยังเป็นอาคารที่สูงที่สุดในกาฐมาณฑุอย่างไม่ต้องสงสัย ตั้งตระหง่านเหนือส่วนอื่นของเมือง เป็นเครื่องบ่งชี้ที่ชัดเจนถึงความสำคัญของพุทธศาสนาต่อประวัติศาสตร์ของเมืองนี้ ขณะที่ข้าเข้าไปใกล้ ข้าพบว่าตัวเองรายล้อมไปด้วยนักเดินทาง ผู้แสวงบุญ และพ่อค้า ซึ่งล้วนหยุดพักและสวดมนต์"
 building_mont_st_michel_destination_desc: "เมื่อเข้าใกล้เกาะน้ำขึ้นน้ำลงแห่ง [GetBuilding('mont_st_michel_01').GetName] ในช่วงน้ำลง จะเห็นโบสถ์และกำแพงอันงดงามตั้งตระหง่านอยู่ที่ขอบฟ้า เป็นเครื่องเตือนใจถึงอำนาจของพระเจ้าเหนือสวรรค์และโลก สถานที่แห่งนี้เป็นทั้งศูนย์กลางทางศาสนาที่สำคัญและป้อมปราการที่แข็งแกร่งสำหรับพระสงฆ์และชาวประมงในท้องถิ่น"
 building_holy_site_st_peters_basilica_destination_desc: "ตั้งตระหง่านอยู่เหนือเนินเขาวาติกัน บนสถานที่ฝังศพของนักบุญเปโตร [GetBuilding('holy_site_st_peters_basilica_01').GetName] เป็นเครื่องเตือนใจถึงอำนาจของศาสนจักรตะวันตกและพระสันตปาปา สามารถเห็นบาทหลวงและแม่ชีได้ทั่วไปในส่วนนี้ของนครนิรันดร์ พร้อมกับขอทานที่หวังเงินบริจาคจากผู้แสวงบุญจำนวนมาก"
 building_holy_site_imam_ali_mosque_destination_desc: "เมื่อเข้าสู่เมือง โดมสีทองของ [GetBuilding('holy_site_imam_ali_mosque_01').GetName] ส่องประกายดุจสัญญาณไฟ สถานที่ศักดิ์สิทธิ์แห่งนี้ ซึ่งเป็นที่ฝังร่างของอิหม่าม [ali.GetFirstName] เต็มไปด้วยผู้แสวงบุญที่มาแสดงความเคารพ บรรยากาศอบอวลไปด้วยความศรัทธา และอักษรวิจิตรบนผนังบ่งบอกถึงความเคารพอย่างลึกซึ้งต่อพระผู้เป็นเจ้า"
 building_yazd_mosque_destination_desc: "เมื่อมองดูหออะซานเหนือประตูใหญ่ของ [GetBuilding('yazd_mosque_01').GetName] ข้าก็ท่วมท้นไปด้วยความศรัทธา ระหว่างทางมาที่นี่ ชาวบ้านคนหนึ่งเตือนข้าว่าเมืองนี้เป็นศูนย์กลางทางศาสนามานานกว่าที่ใครจะจำได้ วันนี้ถนนหนทางยังคงเต็มไปด้วยผู้แสวงบุญและนักบวช ผู้ศรัทธาที่เดินทางไกลมาเยี่ยมชมสถานที่อันวิจิตรบรรจงแห่งนี้"
 building_holy_site_great_mosque_of_mecca_destination_desc: "ขณะที่ข้าพเจ้ามองดู [GetBuilding('holy_site_great_mosque_of_mecca_01').GetName] หัวใจของข้าพเจ้าก็เปี่ยมไปด้วยความยำเกรง ภาพของกะอ์บะฮ์ สถานที่ศักดิ์สิทธิ์นับ แต่โบราณกาล เป็นเครื่องพิสูจน์ถึงความยั่งยืนของ [GetReligionByKey('islam_religion').GetName] ฝูงชนผู้แสวงบุญ ซึ่ง แต่ละคนต่างแสวงหาความใกล้ชิดกับพระผู้เป็นเจ้า เคลื่อนไหวเป็นหนึ่งเดียวกันด้วยความศรัทธา"
 building_holy_site_great_mosque_of_cordoba_destination_desc: "ขณะที่ข้าพเจ้าเดินผ่านห้องโถงอันกว้างขวางของ [GetBuilding('holy_site_great_mosque_of_cordoba_01').GetName] ป่าเสาและซุ้มโค้งสีแดงสลับขาวเป็นสิ่งมหัศจรรย์แห่งความเฉลียวฉลาดทางสถาปัตยกรรม การผสมผสานระหว่างการออกแบบของ [GetReligionByKey('islam_religion').GetName] และ [visigothic_culture.GetName] บ่งบอกถึงดินแดนที่อุดมไปด้วยประวัติศาสตร์และวัฒนธรรม"
 building_holy_site_great_mosque_of_djenne_destination_desc: "ภาพของ [GetBuilding('holy_site_great_mosque_of_djenne_01').GetName] ที่ตั้งตระหง่านใจกลางเมือง เป็นภาพที่น่าชม สถาปัตยกรรมอิฐดินเหนียวอันเป็นเอกลักษณ์ ซึ่งสะท้อนภูมิทัศน์แบบซาเฮล ยืนหยัดเป็นสัญลักษณ์อันภาคภูมิใจของศรัทธาและทักษะของผู้สร้าง"
 building_holy_site_great_mosque_of_samarra_destination_desc: "ขณะที่ข้าพเจ้ายืนอยู่หน้า [GetBuilding('holy_site_great_mosque_of_samarra_01').GetName] หออะซานรูปเกลียวอันเป็นเอกลักษณ์ของมันตั้งตระหง่านเหนือภูมิทัศน์ รูปแบบสถาปัตยกรรมที่โดดเด่น ทำให้มันแตกต่างในฐานะอัญมณีแห่งโลก [GetReligionByKey('islam_religion').GetName]"
 building_holy_site_cologne_cathedral_destination_desc: "ขณะที่ข้าพเจ้าเข้าใกล้ [GetBuilding('holy_site_cologne_cathedral_01').GetName] หอคอยที่ยังสร้างไม่เสร็จและการก่อสร้างที่ดำเนินอยู่เป็นเครื่องพิสูจน์ถึงความทะเยอทะยานของยุคสมัย ท่ามกลางนั่งร้านและก้อนหิน ข้าพเจ้าเห็นภาพนิมิตแห่งความยิ่งใหญ่กำลังก่อตัวขึ้น สัญลักษณ์แห่งศรัทธาที่จะยืนหยัดไปอีกหลายศตวรรษ"
 building_holy_site_canterbury_cathedral_destination_desc: "ขณะเดินผ่านห้องโถงอันศักดิ์สิทธิ์ของ [GetBuilding('holy_site_canterbury_cathedral_01').GetName] ข้าพเจ้ารู้สึกถึงน้ำหนักของประวัติศาสตร์รอบตัว ศิลาฤกษ์แห่งศรัทธาคริสเตียนนี้อบอวลไปด้วยเรื่องราวของมรณสักขีและนักบุญ ภาพแกะสลักอันวิจิตรบรรจงและบรรยากาศอันเคร่งขรึมสะท้อนคำอธิษฐานของผู้แสวงบุญนับไม่ถ้วน"
 building_holy_site_prophetic_mosque_destination_desc: "[GetBuilding('holy_site_prophetic_mosque_01').GetName] พร้อมด้วยลานอันเงียบสงบและซุ้มโค้งอันสง่างาม เป็นสถานที่ที่มีความสำคัญทางจิตวิญญาณอย่างลึกซึ้ง ที่นี่ ซึ่งศาสดามูฮัมหมัดเคยเดินและเทศนา บรรยากาศดูเหมือนจะเต็มไปด้วยความสงบ ผู้ศรัทธารวมตัวกันด้วยความเคารพ คำอธิษฐานของพวกเขาเป็นเสียงพึมพำเบา ๆ ใต้ท้องฟ้าอันกว้างใหญ่"
 building_doges_palace_destination_desc: "ความยิ่งใหญ่ของ [GetBuilding('doges_palace_01').GetName] ทำให้ข้าพเจ้าพูดไม่ออก ส่วนหน้าอาคารที่หรูหราและห้องต่างๆ ที่โอ่อ่าเป็นสัญลักษณ์ของอำนาจและความเจริญรุ่งเรืองของเวนิส งานศิลปะอันวิจิตรบรรจงและการตก แต่งที่หรูหราบ่งบอกถึงอำนาจและความมั่งคั่งของผู้นำ"
 building_walls_of_genoa_destination_desc: "[GetBuilding('walls_of_genoa_01').GetName] อันยิ่งใหญ่ ซึ่งตั้งตระหง่านเป็นปราการอันน่าเกรงขามปกป้องเมือง แสดงให้เห็นถึงความกล้าหาญทางทหารและความเฉียบแหลมทางยุทธศาสตร์ของผู้นำ"
 building_visby_ringmur_destination_desc: "[GetBuilding('visby_ringmur_01').GetName] ล้อมรอบเมือง เป็นเครื่องพิสูจน์ด้วยหินถึงความสำคัญในการค้าและการป้องกัน ขณะเดินไปตามกำแพงเหล่านี้ ข้าพเจ้าทึ่งในทักษะของผู้สร้างและวิสัยทัศน์ของผู้นำ ที่รับประกันความปลอดภัยและความเจริญรุ่งเรืองของประชาชน"
 building_walls_of_benin_destination_desc: "[GetBuilding('walls_of_benin_01').GetName] อันยิ่งใหญ่ทอดยาวสุดลูกหูลูกตา เป็นความพยายามอันยิ่งใหญ่ของคนในท้องถิ่น งานดินขนาดมหึมานี้ ซึ่งใหญ่กว่าที่ข้าพเจ้าเคยเห็นมาหลายแห่ง ยืนหยัดเป็นสัญลักษณ์อันภาคภูมิใจของความแข็งแกร่งและความเฉลียวฉลาดของดินแดนนี้"
 building_theodosian_walls_destination_desc: "[GetBuilding('theodosian_walls_01').GetName] อันโอ่อ่า ซึ่งปกป้องคอนสแตนติโนเปิล เป็นสิ่งมหัศจรรย์ทางวิศวกรรม การปรากฏตัวที่สูงตระหง่านและหลายชั้นบ่งบอกถึงเมืองที่เตรียมพร้อมสำหรับการปิดล้อมใดๆ วิสัยทัศน์ในการสร้างการป้องกันดังกล่าวเห็นได้ชัดเจน"
 building_aurelian_walls_destination_desc: "ล้อมรอบนครนิรันดร์ [GetBuilding('aurelian_walls_01').GetName] ยืนหยัดมั่นคงต่อกาลเวลาและความวุ่นวาย การป้องกันโบราณเหล่านี้ ซึ่งขยายและเสริมความแข็งแกร่งตลอดหลายปีที่ผ่านมา ห่อหุ้มประวัติศาสตร์อันยาวนานและซับซ้อน ป้อมปราการแห่งมรดกอันยั่งยืนของโรม"
 building_the_colosseum_destination_desc: "เบื้องหน้าข้าพเจ้าคือ [GetBuilding('the_colosseum_01').GetName] ซากปรักหักพังขนาดมหึมาจากยุคอดีต ครั้งหนึ่งเคยเป็นสถานที่แห่งการแสดงและความรุ่งโรจน์ บัดนี้ยืนหยัดอยู่เพียงบางส่วน เป็นเครื่องเตือนใจถึงอำนาจและการเข้าถึงของ [GetTitleByKey('e_roman_empire').GetNameNoTier] สะท้อนเรื่องราวของอดีตที่เต็มไปด้วยทั้งความยิ่งใหญ่และความขัดแย้ง"
 building_iron_pillar_of_delhi_destination_desc: "[GetBuilding('iron_pillar_of_delhi_01').GetName] ยืนหยัดท้าทายความเสียหายของกาลเวลา ส่วนประกอบที่ทนทานต่อสนิมเป็นสิ่งมหัศจรรย์ทางโลหะวิทยา สร้างขึ้นเพื่อเป็นเกียรติแก่พระเจ้าจันทรคุปต์ที่ 2 เป็นเครื่องพิสูจน์ถึงความรู้และทักษะขั้นสูงของช่างฝีมือในยุคของพระองค์"
 building_iron_pillar_of_dhar_destination_desc: "[GetBuilding('iron_pillar_of_dhar_01').GetName] ตั้งตระหง่านเป็นพี่น้องที่รู้จักกันน้อยกว่า แต่ก็น่าทึ่งไม่แพ้กันกับเสาที่เดลี เครื่องพิสูจน์ถึงความเฉลียวฉลาดของช่างฝีมือโบราณนี้ยังคงเป็นหัวข้อที่น่าสงสัยสำหรับนักเดินทางและนักวิชาการจำนวนมาก"
 building_the_pyramids_destination_desc: "[GetBuilding('the_pyramids_01').GetName] โบราณและสง่างาม ผุดขึ้นจากผืนทรายเหมือน เช่นที่เป็นมานับพันปี สุสานของฟาโรห์เหล่านี้ ซึ่งปัจจุบันถูกลอกหินปูนขัดเงาออกไปแล้ว ยังคงได้รับความยำเกรงและความเคารพ เป็นความทรงจำที่ยังคงอยู่ของอารยธรรมที่ยิ่งใหญ่ครั้งหนึ่ง"
 building_stonehenge_destination_desc: "[GetBuilding('stonehenge_01').GetName] อันลึกลับตั้งอยู่บนที่ราบซอลส์บรี จุดประสงค์ของมันสูญหายไปตามกาลเวลา หินขนาดใหญ่เหล่านี้ ซึ่งจัดเรียงในรูปแบบที่ซับซ้อน บ่งบอกถึงความรู้โบราณและการเชื่อมต่อกับท้องฟ้า นานก่อนยุคของเรา"
 building_offas_dyke_destination_desc: "ขณะเดินทางข้ามภูมิประเทศ [GetBuilding('offas_dyke_01').GetName] ตั้งตระหง่านเป็นงานดินที่น่าทึ่ง เขตแดนที่สร้างขึ้นในสมัยพระเจ้า [offa.GetFirstName] การแบ่งแยกอันยิ่งใหญ่นี้ ซึ่งปัจจุบันสึกกร่อนไปบางส่วน แต่ยังคงมองเห็นได้ เป็นเครื่องหมายของแนวป้องกันและการแบ่งเขตแดนโบราณ บ่งบอกถึงการต่อสู้แย่งชิงอำนาจในยุคนั้น"
 building_hadrians_wall_destination_desc: "ขณะที่ข้าพเจ้าเดินไปตามซากของ [GetBuilding('hadrians_wall_01').GetName] ข้าพเจ้าครุ่นคิดถึงอำนาจของบรรพบุรุษ [roman_culture.GetName] ปราการที่เคยน่าเกรงขามนี้ ซึ่งปัจจุบันเป็นเพียงซากปรักหักพัง ทำหน้าที่เป็นพรมแดนทางเหนือ เป็นเครื่องพิสูจน์ถึงขอบเขตและข้อจำกัดของจักรวรรดิ"
 building_petra_destination_desc: "นครโบราณ [GetBuilding('petra_01').GetName] ซึ่งแกะสลักเข้าไปในหน้าผาสีกุหลาบ เป็นภาพที่น่าชม อัล-คัซเนห์อันโด่งดัง แม้จะจางหายไปจากความรุ่งโรจน์ในอดีต แต่ก็ยังคงสะท้อนความเจริญรุ่งเรืองของยุคอดีต สิ่งมหัศจรรย์ทางวิศวกรรมและศิลปะ"
 building_buddhas_of_bamian_destination_desc: "[GetBuilding('buddhas_of_bamian_01').GetName] ขนาดมหึมา ซึ่งแกะสลักเข้าไปในหน้าผา ตั้งตระหง่านเป็นเครื่องพิสูจน์อันเงียบงันถึงประวัติศาสตร์ทางศาสนาและวัฒนธรรมของดินแดนนี้ แม้จะผ่านกาลเวลามานาน ศิลปะและความศรัทธาของช่างฝีมือโบราณก็ยังคงปรากฏชัดในประติมากรรมอันงดงามเหล่านี้"
 building_alhambra_destination_desc: "[GetBuilding('alhambra_01').GetName] พร้อมด้วยสถาปัตยกรรมมัวร์อันวิจิตรบรรจงและสวนอันเขียวชอุ่ม เป็นอัญมณีแห่งกรานาดา พระราชวังอันซับซ้อน ซึ่งเป็นการผสมผสานระหว่างรูปแบบและการใช้งาน สะท้อนถึงรสนิยมอันซับซ้อนและอำนาจของผู้ปกครอง"
 building_citadel_of_aleppo_destination_desc: "[GetBuilding('citadel_of_aleppo_01').GetName] อันโอ่อ่า ป้อมปราการบนยอดเขา โดดเด่นเหนือทิวทัศน์ของเมือง กำแพงขนาดใหญ่และโครงสร้างที่แข็งแรง ซึ่งพัฒนาไปตามยุคสมัย เป็นพยานถึงการปิดล้อมนับไม่ถ้วนและความยืดหยุ่นของเมืองโบราณแห่งนี้"
 building_house_of_wisdom_destination_desc: "[GetBuilding('house_of_wisdom_01').GetName] ในแบกแดดตั้งตระหง่านเป็นสัญญาณแห่งความรู้และการเรียนรู้ หอสมุดและศูนย์กลางการศึกษาอันยิ่งใหญ่นี้ ซึ่งก่อตั้งโดยคอลีฟะฮ์อับบาซียะฮ์ ดึงดูดนักวิชาการจากทุกดินแดน กระตือรือร้นที่จะเจาะลึกเข้าไปในคอลเลกชันตำราและการสนทนาอันกว้างใหญ่"
 building_the_tower_of_london_destination_desc: "[GetBuilding('the_tower_of_london_01').GetName] พร้อมด้วยโครงสร้างอันน่าเกรงขาม ทำหน้าที่เป็นทั้งพระราชวังและเรือนจำ บรรยากาศภายในกำแพงเหล่านี้อบอวลไปด้วยประวัติศาสตร์ เรื่องราวของกษัตริย์ ราชินี และเชลยศึกสลักอยู่ในก้อนหิน"
 building_london_bridge_destination_desc: "[GetBuilding('london_bridge_01').GetName] พร้อมด้วยซุ้มโค้งที่แข็งแรงและร้านค้าที่พลุกพล่าน ทอดข้ามแม่น้ำเทมส์อันยิ่งใหญ่ดุจเส้นชีวิตผ่านใจกลางลอนดอน ไม่เพียง แต่ทำหน้าที่เป็นทางข้ามเท่านั้น แต่ยังเป็นศูนย์กลางการค้าและกิจกรรมที่คึกคัก ที่ ซึ่งพ่อค้า นักเดินทาง และชาวเมืองมาบรรจบกัน"
 building_notre_dame_destination_desc: "[GetBuilding('notre_dame_01').GetName] อันสง่างาม พร้อมด้วยยอดแหลมที่สูงตระหง่านและส่วนหน้าอาคารที่ยิ่งใหญ่ เป็นผลงานชิ้นเอกของสถาปัตยกรรมกอทิก ภายใน บรรยากาศสะท้อนเสียงแห่งความศรัทธา หน้าต่างกระจกสีและประติมากรรม แต่ละชิ้นบอกเล่าเรื่องราวอันศักดิ์สิทธิ์"
 building_brihadeeswarar_temple_destination_desc: "[GetBuilding('brihadeeswarar_temple_01').GetName] อาคารหินแกรนิตขนาดใหญ่ ตั้งตระหง่านเหนือเมืองตัญชาวูร์ วิมานที่สูงตระหง่านและภาพนูนต่ำอันวิจิตรบรรจงบ่งบอกถึงความยิ่งใหญ่ของราชวงศ์ [chola_dynasty.GetName] ยุคที่ศิลปะและความศรัทธาพบการแสดงออกอันสูงส่ง"
 building_shwedagon_pagoda_destination_desc: "[GetBuilding('shwedagon_pagoda_01').GetName] พร้อมด้วยยอดเจดีย์สีทองที่เอื้อมแตะสวรรค์ เป็นสิ่งมหัศจรรย์ที่น่าชม สถานที่ศักดิ์สิทธิ์แห่งนี้ ซึ่งเชื่อกันว่าบรรจุพระบรมสารีริกธาตุของพระพุทธเจ้า เป็นสถานที่แสวงบุญและความศรัทธา สะท้อนถึงหัวใจทางจิตวิญญาณของพม่า"
 building_ananda_temple_destination_desc: "[GetBuilding('ananda_temple_01').GetName] พร้อมด้วยสิขรที่ส่องประกายและระเบียงอันงดงาม ตั้งตระหง่านเป็นเครื่องพิสูจน์ถึงความกล้าหาญทางสถาปัตยกรรมของราชวงศ์ [pagan_dynasty.GetName] วัดอันวิจิตรงดงามนี้ ประดับประดาด้วยงานแกะสลักและภาพจิตรกรรมฝาผนังอันวิจิตรบรรจง เป็นสัญญาณแห่งพุทธศาสนานิกายเถรวาท"
 building_the_friday_mosque_destination_desc: "[GetBuilding('the_friday_mosque_01').GetName] พร้อมด้วยโครงสร้างอันโอ่อ่าและหออะซานอันสง่างาม เป็นศูนย์กลางการสักการะ ทุกสัปดาห์ มันจะกลายเป็นศูนย์กลางของกิจกรรมและการละหมาด ที่ ซึ่งผู้ศรัทธารวมตัวกันเป็นจำนวนมาก ยืนยันถึงความแข็งแกร่งและความสามัคคีของชุมชน [GetReligionByKey('islam_religion').GetName]"
 building_khajuraho_destination_desc: "[GetBuilding('khajuraho_01').GetName] พร้อมด้วยประติมากรรมอันวิจิตรงดงามและกล้าหาญ เป็นการเฉลิมฉลองชีวิต ความรัก และการสักการะ สิ่งมหัศจรรย์ทางสถาปัตยกรรมเหล่านี้ ซึ่งสร้างโดยผู้ปกครองจันเดลา ตั้งตระหง่านเป็นเครื่องพิสูจน์ถึงวิสัยทัศน์ทางศิลปะและจิตวิญญาณของยุคสมัย"
 building_palace_of_aachen_destination_desc: "[GetBuilding('palace_of_aachen_01').GetName] ตั้งตระหง่านเป็นมรดกของ [charlemagne.GetFirstNameNicknamed] โบสถ์น้อยอันยิ่งใหญ่ พร้อมด้วยการออกแบบแปดเหลี่ยมและหลังคาโดม สะท้อนถึงความทะเยอทะยานของจักรพรรดิที่จะฟื้นฟูความรุ่งโรจน์ของ [GetTitleByKey('e_roman_empire').GetNameNoTier]"
 building_hagia_sophia_christian_destination_desc: "ขณะที่ข้าพเจ้าเดินผ่าน [GetBuilding('hagia_sophia_01').GetName] อันงดงาม ความยิ่งใหญ่ของมัน ทำให้ข้าพเจ้าตกตะลึง โดมขนาดใหญ่ดูเหมือนจะสัมผัสสวรรค์ และโมเสกอันวิจิตรบรรจงส่องประกายในแสง ข้าพเจ้ารู้สึกได้ถึงความลึกซึ้งทางจิตวิญญาณของสถานที่แห่งนี้ ซึ่งสะท้อนถึงการสักการะของชาวคริสต์และความยิ่งใหญ่ของไบแซนไทน์มานานหลายศตวรรษ"
 building_hagia_sophia_islamic_destination_desc: "เมื่อเข้าสู่ [GetBuilding('hagia_sophia_02').GetName] ซึ่งปัจจุบันเป็นมัสยิดอันยิ่งใหญ่ ข้าพเจ้าหลงใหลในการเปลี่ยนแปลงของมัน หออะซานที่สูงตระหง่านเอื้อมแตะท้องฟ้า เสริมโดมอันสง่างาม ภายใน อักษรวิจิตรและการประดับประดาแบบอิสลามผสมผสานอย่างกลมกลืนกับสถาปัตยกรรมไบแซนไทน์ สร้างบรรยากาศแห่งความเคารพอย่างลึกซึ้งและการผสมผสานทางวัฒนธรรม"
 building_dome_of_the_rock_destination_desc: "[GetBuilding('dome_of_the_rock_01').GetName] พร้อมด้วยโดมสีทองที่ส่องประกายใต้แสงอาทิตย์ เป็นสถานที่สำคัญที่เคารพนับถือในเยรูซาเล็ม ศาลเจ้าแห่งนี้ ซึ่งเป็นที่ประดิษฐานหินศักดิ์สิทธิ์ เป็นสถานที่ที่มีความสำคัญทางจิตวิญญาณอย่างลึกซึ้ง ซึ่งเคารพนับถือทั้งชาวมุสลิมและชาวยิว"
 building_temple_in_jerusalem_destination_desc: "ซากของ [GetBuilding('temple_in_jerusalem_01').GetName] ซึ่งศักดิ์สิทธิ์ทั้งต่อชาวยิวและชาวคริสต์ กระตุ้นความรู้สึกอันลึกซึ้งถึงประวัติศาสตร์และจิตวิญญาณ กำแพงตะวันตก ซึ่งเป็นสิ่งที่เหลืออยู่ทั้งหมดของวิหารอันงดงามครั้งหนึ่ง เป็นเครื่องเตือนใจอันน่าสะเทือนใจถึงอดีตอันวุ่นวายของเมือง"
 building_rammelsberg_mines_destination_desc: "[GetBuilding('rammelsberg_mines_01').GetName] เป็นศูนย์รวมของกิจกรรม ขุดลึกลงไปในดินเพื่อหาแร่มีค่า ความเฉลียวฉลาดและความเพียรพยายามของคนงานเหมืองที่นี่มีความสำคัญต่อความเจริญรุ่งเรืองและงานฝีมือของภูมิภาค"
 building_guiyang_mines_destination_desc: "[GetBuilding('guiyang_mines_01').GetName] ได้ทิ้งร่องรอยไว้ชัดเจนบนชุมชนที่นี่ตลอดหลายศตวรรษ เหรียญที่ผลิตที่นี่ได้หมุนเวียนไปทั่วประเทศจีนตั้งแต่สมัยราชวงศ์ฮั่นตะวันตก"
 building_kaibao_mines_destination_desc: "[GetBuilding('kaibao_mines_01').GetName] เป็นแหล่งผลิตแร่เงินสำหรับท้องพระคลังหลวงมาเป็นเวลากว่าพันปี และมันก็เป็นที่ประจักษ์ชัดเมื่อข้าเดินทางผ่านภูมิภาคแห่งนี้ แร่เงินและเหรียญตราดึงดูดความมั่งคั่ง ที่นี่ พ่อค้าและช่างฝีมือต่างเจริญรุ่งเรืองจากสิ่งที่คนงานเหมืองนำมามอบให้แก่โรงหลอม"
 building_zijinshan_mines_destination_desc: "หากไม่ใช่ เพราะ [GetBuilding('zijinshan_mines_01').GetName] และทองคำของพวกเขา พื้นที่นี้คงไม่ได้รับการพัฒนาเท่าที่เป็นอยู่นี้ ชุมชนแห่งนี้ถูกกำหนดรูปแบบโดยธุรกิจเหมืองแร่และวิศวกรและช่างฝีมือจำนวนมากที่มันดึงดูดมาจากภูมิภาคโดยรอบ"
 building_liangzhe_mines_destination_desc: "[GetBuilding('liangzhe_mines_01').GetName] และธุรกิจแร่เงินคือสิ่งที่ ทำให้พื้นที่นี้เจริญรุ่งเรือง เงินคือสิ่งที่ดึงดูดช่างฝีมือและคนงานเหมืองมาที่นี่ และเหรียญกษาปณ์คือสิ่งที่ดึงดูดพ่อค้าทุกคน"
 building_hanxing_mines_destination_desc: "แหล่ง [GetBuilding('hanxing_mines_01').GetName]"
 building_kutna_hora_mines_destination_desc: "[GetBuilding('kutna_hora_mines_01').GetName] เป็นแหล่งแร่เงินที่สำคัญ ซึ่งขับเคลื่อนทั้งการค้าและสกุลเงิน เครือข่ายอุโมงค์และปล่อง ซึ่งขุดโดยคนงานเหมืองที่มุ่งมั่น เป็นตัวอย่างของความมีไหวพริบและแรงงานที่ขับเคลื่อนเศรษฐกิจของภูมิภาค"
 building_kremnica_mines_destination_desc: "[GetBuilding('kremnica_mines_01').GetName] มีชื่อเสียงในด้านแหล่งแร่ทองคำ การสกัดโลหะมีค่านี้ ซึ่งเป็นสัญลักษณ์ของความมั่งคั่งและอำนาจ สนับสนุนการผลิตเหรียญและความงดงามของราชสำนัก"
 building_baofeng_mines_destination_desc: "การทำเหมืองเป็นแหล่งจ้างงานหลักในพื้นที่นี้ และอาคารที่พักอาศัยส่วนใหญ่กระจุกตัวอยู่ใกล้กับ [GetBuilding('baofeng_mines_01').GetName] โรงงานเครื่องเงินที่ขับเคลื่อนด้วยพลังน้ำเรียงรายอยู่ตามถนนริมแม่น้ำ"
 building_jiaodong_mines_destination_desc: "มักถูกเรียกว่าเมืองทองคำแห่งสวรรค์ [GetBuilding('jiaodong_mines_01').GetName] เป็นที่รู้จักอย่างกว้างขวางจากปริมาณทองคำมหาศาลที่ผลิตได้ เมืองนี้เติบโตขึ้นเป็นศูนย์กลางการค้าที่สำคัญ โดยมีศูนย์กลางอยู่ที่การแปรรูปและขายต่อโลหะมีค่า"
 building_chihu_mines_destination_desc: "ว่ากันว่า [GetBuilding('chihu_mines_01').GetName] มีการใช้งานมาตั้งแต่ยุคสามก๊ก และเป็นเวลากว่าพันปีที่เหมืองเหล่านี้ได้จัดหาเหล็กและอาวุธให้แก่ราชวงศ์ต่างๆ ของจีน ในตัวเมืองเอง สิ่งนี้ปรากฏชัดเจนไม่ว่าข้าจะมองไปทางใด โรงกษาปณ์และโรงตีเหล็กเรียงรายอยู่ตามท้องถนน และข้าก็พบเห็นเกวียนบรรทุกแร่เหล็กนานก่อนที่จะได้เห็นตัวชุมชนที่แท้จริงเสียอีก"
 building_zigong_mines_destination_desc: "[GetBuilding('zigong_mines_01').GetName] ได้จัดหาเกลือให้กับชาวจีนมานับพันปี ทิวทัศน์ของเมืองถูกครอบงำด้วยลักษณะเฉพาะของหลุมเจาะ พื้นที่ระเหย และโครงสร้างพื้นฐานอื่น ๆ ที่เชี่ยวชาญสำหรับการสกัดเกลือ"
 building_falun_mines_destination_desc: "[GetBuilding('falun_mines_01').GetName] เป็นเขาวงกตของอุโมงค์ในการแสวงหาทองแดง เม็ดสีแดงสดใส ฟาลูเรด ซึ่งได้จากเหมือง ประดับประดาอาคารหลายแห่งที่นี่ เป็นเครื่องเตือนใจที่ชัดเจนถึงความสำคัญของเหมืองต่อชุมชนท้องถิ่น"
 building_konasamudram_mines_destination_desc: "[GetBuilding('konasamudram_mines_01').GetName] เป็นที่รู้จักจากดินที่อุดมไปด้วยเพชร ประกายของอัญมณีล้ำค่าเหล่านี้ไม่เพียงสะท้อนถึงความมั่งคั่งที่พวกเขานำมาเท่านั้น แต่ยัง รวมถึงทักษะและความเหนื่อยยากของผู้ที่ขุดค้นพบมันด้วย"
 building_dean_mines_destination_desc: "[GetBuilding('dean_mines_01').GetName] เป็นแหล่งเหล็กที่สำคัญ เสียงค้อนทุบและแสงจากเตาหลอมดังอยู่ตลอดเวลาที่นี่ ขณะที่คนงานเหมืองและช่างตีเหล็กทำงานอย่างไม่รู้จักเหน็ดเหนื่อย หลอมวัสดุสำหรับกิจการทางทหารและการก่อสร้าง"
 building_phnom_dek_mines_destination_desc: "[GetBuilding('phnom_dek_mines_01').GetName] หรือ 'ภูเขาเหล็ก' เป็นแหล่งเหล็กที่สำคัญในภูมิภาคนี้ เมื่อเข้าใกล้เมือง ไม่มีทางใดที่จะหลีกเลี่ยงเกวียนบรรทุกหนักจำนวนมากที่มุ่งหน้าไปยังที่ลุ่มรอบอังกอร์ได้"
 building_schwaz_mines_destination_desc: "[GetBuilding('schwaz_mines_01').GetName] เป็นศูนย์กลางการผลิตเงิน ความมั่งคั่งที่สกัดจากความลึกเหล่านี้ได้เปลี่ยนเมืองให้กลายเป็นศูนย์กลางการค้าที่เจริญรุ่งเรือง ดึงดูดพ่อค้าและช่างฝีมือจากแดนไกล"
 building_argentiera_mines_destination_desc: "[GetBuilding('argentiera_mines_01').GetName] มีชื่อเสียงในด้านสายแร่ตะกั่วและเงินที่อุดมสมบูรณ์ สภาพที่เลวร้ายที่คนงานเหมืองเผชิญที่นี่เน้นย้ำถึงการแสวงหาทรัพยากรอันมีค่าเหล่านี้อย่างไม่หยุดยั้ง"
 building_srebrenica_mines_destination_desc: "[GetBuilding('srebrenica_mines_01').GetName] เป็นแหล่งแร่เงินที่สำคัญ ความเหนื่อยยากอย่างต่อเนื่องของคนงานเหมือง ซึ่งขุดลึกลงไปในดิน ขับเคลื่อนความเจริญรุ่งเรืองของภูมิภาค ทำให้เป็นศูนย์กลางที่สำคัญสำหรับการค้าและการพาณิชย์"
 building_kollur_mines_destination_desc: "[GetBuilding('kollur_mines_01').GetName] ซึ่งตั้งอยู่ในป่าทึบของ กอลลูรี มีชื่อเสียงในด้านเพชรอันงดงาม อัญมณีจากเหมืองเหล่านี้ไม่เพียง แต่ประดับมงกุฎของกษัตริย์เท่านั้น แต่ยังเป็นสัญลักษณ์ของความอุดมสมบูรณ์ของดินแดนและทักษะของผู้ที่สกัดมันออกมา"
 building_siderokausia_mines_destination_desc: "[GetBuilding('siderokausia_mines_01').GetName] คึกคักไปด้วยกิจกรรม สกัดเหล็กที่สำคัญต่อความต้องการของภูมิภาค ความพยายามอย่างไม่หยุดยั้งของคนงานเหมืองที่นี่มุ่งมั่นที่จะควบคุมทรัพยากรของโลก"
 building_zawar_mines_destination_desc: "[GetBuilding('zawar_mines_01').GetName] เป็นแหล่งสังกะสีและตะกั่วโบราณ ความเฉลียวฉลาดของคนงานเหมือง ซึ่งขุดลึกลงไปเพื่อสกัดโลหะเหล่านี้ มีความสำคัญอย่างยิ่งในการสนับสนุนการเติบโตและการพัฒนาของภูมิภาค"
 building_pansjhir_mines_destination_desc: "[GetBuilding('pansjhir_mines_01').GetName] เป็นที่รู้จักจากแร่แลพิสลาซูลีอันมีค่า หินสีน้ำเงินสดใสนี้ ซึ่งเป็นที่ต้องการ เนื่องจากความงามและความหายาก เป็นสมบัติของดินแดนเหล่านี้ เป็นที่ปรารถนาของช่างฝีมือและพ่อค้า"
 building_nishapur_mines_destination_desc: "[GetBuilding('nishapur_mines_01').GetName] มีชื่อเสียงในด้านเทอร์ควอยซ์อันงดงาม อัญมณีสีสันสดใสนี้ ซึ่งมีค่าในเครื่องประดับและการตก แต่ง สะท้อนถึงความร่ำรวยของวัฒนธรรมและงานฝีมือ [persian_culture.GetName]"
 building_ratnapura_mines_destination_desc: "[GetBuilding('ratnapura_mines_01').GetName] ส่องประกายด้วยคำมั่นสัญญาของไพลินและทับทิม อัญมณีเหล่านี้ ซึ่งฝังลึกอยู่ในดิน เป็นที่ต้องการทั่วโลก เป็นเครื่องพิสูจน์ถึงความมั่งคั่งของดินแดนเหล่านี้"
  building_mogok_mines_destination_desc: "[GetBuilding('mogok_mines_01').GetName] ส่องประกายแวววาวด้วยคำมั่นสัญญาถึงทับทิมและไพลิน อัญมณีเหล่านี้ ซึ่งฝังลึกอยู่ในผืนดิน เป็นที่ต้องการทั่วโลก ประกายของพวกมันกล่าวกันว่าไม่มีสิ่งใดเทียบได้"
 building_allaq_mines_destination_desc: "[GetBuilding('allaq_mines_01').GetName] ซึ่งตั้งอยู่ในเทือกเขา Allaq เป็นแหล่งทองแดงที่สำคัญ เสียงจอบกระทบหินดังก้องไปในอากาศ ขณะที่คนงานเหมืองทำงานอย่างไม่รู้จักเหน็ดเหนื่อยเพื่อจัดหาโลหะที่จำเป็นนี้"
 building_takkeda_mines_destination_desc: "[GetBuilding('takkeda_mines_01').GetName] ที่คึกคักมีชื่อเสียงในด้านสายแร่เงินที่อุดมสมบูรณ์ โลหะที่สกัดได้ที่นี่ไม่เพียง แต่ขับเคลื่อนงานฝีมือในท้องถิ่นเท่านั้น แต่ยังมีส่วนสำคัญต่อคลังของภูมิภาคอีกด้วย"
 building_turda_mines_destination_desc: "[GetBuilding('turda_mines_01').GetName] เป็นแหล่งเกลือที่สำคัญ 'ทองคำขาว' นี้ ซึ่งจำเป็นทั้งสำหรับการถนอมอาหารและการค้า ได้ ทำให้เหมืองกลายเป็นศูนย์กลางทางเศรษฐกิจที่สำคัญ"
 building_taghaza_mines_destination_desc: "ในใจกลางทะเลทรายซาฮารา [GetBuilding('taghaza_mines_01').GetName] เป็นแหล่งเกลือที่โหดร้าย แต่สำคัญยิ่ง คาราวานเดินทางไกลมายังสถานที่รกร้างแห่งนี้ แสวงหาเกลือที่มีค่ามากกว่าทองคำในดินแดนเหล่านี้"
 building_phocaea_mines_destination_desc: "[GetBuilding('phocaea_mines_01').GetName] เป็นที่รู้จักจากสารส้ม กระบวนการสกัดแร่ธาตุที่สำคัญนี้ ซึ่งใช้ในการย้อมสีและการฟอกหนัง เกี่ยวข้องกับทักษะและความรู้ที่สืบทอดกันมารุ่นสู่รุ่น"
 building_verespatak_mines_destination_desc: "[GetBuilding('verespatak_mines_01').GetName] เป็นแหล่งทองคำที่อุดมสมบูรณ์ ความอุดมสมบูรณ์นี้ได้เปลี่ยนพื้นที่ให้กลายเป็นศูนย์กลางกิจกรรมการทำเหมืองที่คึกคัก ดึงดูดนักผจญภัยและพ่อค้าที่ถูกดึงดูดด้วยเสน่ห์แห่งความมั่งคั่ง"
 building_suvarnadvipa_mines_destination_desc: "ตลอดแนวเชิงเขาของเทือกเขาบาริซาน [GetBuilding('suvarnadvipa_mines_01').GetName] มอบงานที่หนักหน่วง แต่ก็คุ้มค่าแก่เหล่ากรรมกร ขณะเดียวกันก็เพิ่มพูนความมั่งคั่งให้แก่ช่างฝีมือและพ่อค้าในท้องถิ่น"
 building_khetri_mines_destination_desc: "[GetBuilding('khetri_mines_01').GetName] เป็นที่รู้จักจากแหล่งแร่ทองแดงจำนวนมาก ความพยายามอย่างขยันขันแข็งของคนงานเหมืองและช่างตีเหล็กในท้องถิ่น ซึ่งสกัดและกลั่นโลหะที่จำเป็นนี้ ค้ำจุนการดำรงชีวิตของภูมิภาค"
 building_trepca_mines_destination_desc: "[GetBuilding('trepca_mines_01').GetName] เป็นแหล่งตะกั่วและเงินที่สำคัญ ชุมชนเหมืองแร่ในท้องถิ่น ซึ่งเชี่ยวชาญในการนำทางภูมิประเทศที่ท้าทาย มีบทบาทสำคัญในความเจริญรุ่งเรืองของพื้นที่"
 building_rudnik_mines_destination_desc: "[GetBuilding('rudnik_mines_01').GetName] คึกคักไปด้วยกิจกรรม สกัดแร่เงินมีค่า คนงานเหมืองในท้องถิ่นที่ทำงานหนักและความมั่งคั่งที่พวกเขานำมาได้ ทำให้ภูมิภาคนี้เป็นศูนย์กลางของกิจกรรมทางเศรษฐกิจและการเติบโต"
 building_ijil_mines_destination_desc: "[GetBuilding('ijil_mines_01').GetName] อันกว้างใหญ่เป็นที่ตั้งของแหล่งเกลือที่อุดมสมบูรณ์ คนงานเหมืองที่มีทักษะได้ ทำให้พื้นที่นี้เป็นผู้มีส่วนสำคัญต่อการค้าและการพัฒนาของภูมิภาค"
 building_cevennes_mines_destination_desc: "เหมืองในท้องถิ่นใน [GetBuilding('cevennes_mines_01').GetName] เป็นแหล่งแร่เงินที่จำเป็น งานที่ไม่รู้จักเหน็ดเหนื่อยของคนงานเหมืองและความอุดมสมบูรณ์ที่เกิดขึ้นมีบทบาทสำคัญในการค้ำจุนการดำรงชีวิตของภูมิภาค"
 building_hetian_mines_destination_desc: "เหมืองใน [GetBuilding('hetian_mines_01').GetName] เป็นแหล่งกำเนิดของหยกอันล้ำค่าที่สุดเท่าที่มีมา เศรษฐกิจท้องถิ่นต้องพึ่งพาการค้านี้เป็นอย่างมาก และสามารถพบเห็นคนงานเหมืองและช่างฝีมือหยกได้ทั่วทั้งเมือง"
 building_xiuyan_mines_destination_desc: "หยกประเภทที่ขุดได้จาก [GetBuilding('xiuyan_mines_01').GetName] ได้ประดับประดาหัตถกรรมธรรมดาด้วยสีเขียวอันเป็นเอกลักษณ์มานานหลายศตวรรษ"
 building_itoigawa_mines_destination_desc: "หยกที่สกัดจาก [GetBuilding('itoigawa_mines_01').GetName] ซึ่งประดับโดยพระและนักบวชลึกลับในภูมิภาค มีประวัติศาสตร์อันยาวนานถึงรัศมีแห่งความโดดเด่น ความงามของมันดึงดูดกองคาราวานจากทั่วเกาะมาโดยตลอดเพื่อส่งมอบให้แก่ช่างฝีมือของพวกเขา"
 building_lantian_mines_destination_desc: "[GetBuilding('lantian_mines_01').GetName] เป็นแหล่งหยกที่โดดเด่น ทำให้เนินเขาโดยรอบเป็นภาพที่น่าจับตามองด้วยเหมืองหินที่แกะสลักและหินสีเขียวระยิบระยับในระยะไกล"
 building_fengtian_mines_destination_desc: "ตั้งแต่สมัยโบราณ คนงานเหมืองของ [GetBuilding('fengtian_mines_01').GetName] ได้เหวี่ยงพลั่วเพื่อขยายหลุมและรวบรวมหยกเพื่อตรวจสอบ ในขณะเดียวกัน พ่อค้าของเกาะก็เติมเต็มหีบสมบัติของตน"
 building_hpakant_mines_destination_desc: "[GetBuilding('hpakant_mines_01').GetName] ซึ่งซ่อนอยู่ภายในป่าและแม่น้ำกว้างใหญ่ เป็นแหล่งหยกที่เฟื่องฟูในหมู่ช่างฝีมือท้องถิ่น การสกัดหยกช่วยให้พวกเขาสามารถแสดงออกถึงวัฒนธรรมของตนได้ดียิ่งขึ้น"
 building_dushan_mines_destination_desc: "[GetBuilding('dushan_mines_01').GetName] มีอิทธิพลต่อเศรษฐกิจท้องถิ่นที่นี่ หยกท้องถิ่นเป็นหนึ่งในหยกที่ล้ำค่าที่สุด และกล่าวกันว่ามีสีที่เข้มข้นกว่าหยกอื่นใด"
 building_mali_mines_destination_desc: "ในพื้นที่อันกว้างใหญ่ของมาลี [GetBuilding('mali_mines_01').GetName] อุดมไปด้วยแร่มีค่า เป็นแหล่งความมั่งคั่งและความภาคภูมิใจอันยิ่งใหญ่ คนงานเหมืองและช่างฝีมือที่มีทักษะของภูมิภาคนี้ได้ใช้ประโยชน์จากแหล่งสำรองเหล่านี้มานานแล้ว เสริมสร้างเศรษฐกิจและการค้าในท้องถิ่น"
 building_al_azhar_university_destination_desc: "[GetBuilding('al_azhar_university').GetName] ในกรุงไคโรตั้งตระหง่านเป็นสัญญาณแห่งการเรียนรู้และทุนการศึกษาในโลก [GetReligionByKey('islam_religion').GetName] ห้องโถงอันศักดิ์สิทธิ์ของสถาบันแห่งนี้ได้หล่อเลี้ยงนักวิชาการรุ่นต่อรุ่น มีส่วนอย่างมากต่อความมั่งคั่งทางปัญญาและวัฒนธรรมของภูมิภาค"
 building_sankore_university_destination_desc: "ในเมืองทิมบุกตูในตำนาน [GetBuilding('sankore_university').GetName] เป็นศูนย์กลางแห่งการเรียนรู้และความรู้แจ้ง นักวิชาการและนักศึกษารวมตัวกันที่นี่ เจาะลึกการศึกษาหลากหลายแขนง ตั้งแต่เทววิทยาไปจนถึงดาราศาสตร์"
 building_siena_university_destination_desc: "มหาวิทยาลัยซีเอนา ซึ่งตั้งอยู่ในใจกลางทัสคานีและเป็นตัวแทนของ [GetBuilding('siena_university').GetName] เป็นศูนย์กลางการศึกษาและความคิด คณาจารย์ที่มีชื่อเสียงและนักศึกษาที่กระตือรือร้นมีส่วนช่วยในชุมชนวิชาการที่มีชีวิตชีวา มีบทบาทสำคัญในชีวิตทางปัญญาของประชากรในท้องถิ่น"
 building_nalanda_university_destination_desc: "[GetBuilding('nalanda_university').GetName] เป็นศูนย์กลางการศึกษาพระเวทที่ยิ่งใหญ่ สถาบันโบราณแห่งนี้ดึงดูดนักวิชาการจากทั่วเอเชีย มรดกของมันเป็นที่รักของคนในท้องถิ่น ผู้ ซึ่งเคารพนับถือมันในฐานะสัญลักษณ์ของมรดกทางประวัติศาสตร์และวัฒนธรรมของพวกเขา"
 building_hotin_fort_destination_desc: "[GetBuilding('hotin_fort_01').GetName] อันน่าเกรงขามมองเห็นแม่น้ำดนีสเตอร์ กำแพงหนาและตำแหน่งทางยุทธศาสตร์ของป้อมปราการเป็นเครื่องพิสูจน์ถึงความมุ่งมั่นของคนในท้องถิ่นที่จะปกป้องดินแดนของตนจากผู้รุกราน"
 building_heddal_stave_church_destination_desc: "ในภูมิทัศน์นอร์เวย์อันเงียบสงบ [GetBuilding('heddal_stave_church_01').GetName] ตั้งตระหง่านเป็นตัวอย่างอันงดงามของงานฝีมือยุคกลาง งานแกะสลักไม้ที่วิจิตรบรรจงและโครงสร้างที่สูงตระหง่านสะท้อนถึงความศรัทธาและทักษะของช่างฝีมือในท้องถิ่น"
 building_temple_of_uppsala_destination_desc: "[GetBuilding('temple_of_uppsala_01').GetName] ซึ่งปกคลุมไปด้วยกลิ่นอายของความศักดิ์สิทธิ์ ตั้งตระหง่านเป็นสถานที่เคารพนับถือ ซึ่งประเพณีนอร์สโบราณผสานเข้ากับปัจจุบัน ห้องโถงที่เคารพนับถือนี้เป็นศูนย์กลางของการชุมนุมมานานแล้ว ต้นกำเนิดของมันสะท้อนเสียงอันหลากหลายของผู้แสวงบุญ"
 building_lund_cathedral_destination_desc: "[GetBuilding('lund_cathedral_01').GetName] พร้อมด้วยสถาปัตยกรรมโรมาเนสก์อันน่าประทับใจ โดดเด่นเหนือเส้นขอบฟ้า ศูนย์กลางทางจิตวิญญาณแห่งนี้ ซึ่งมีชื่อเสียงในด้านห้องใต้ดินและนาฬิกาดาราศาสตร์ เป็นจุดศูนย์กลางของชีวิตทางศาสนาสำหรับชุมชนคริสเตียนในท้องถิ่น"
 building_danevirke_destination_desc: "[GetBuilding('danevirke_01').GetName] ป้อมปราการงานดินขนาดใหญ่ ทอดยาวข้ามคาบสมุทรจัตแลนด์ การป้องกันโบราณนี้ ซึ่งสร้างและขยายโดยคนในท้องถิ่น เป็นสัญลักษณ์ของความมุ่งมั่นที่จะปกป้องดินแดนและรักษาเอกราชของตน"
 building_roman_wall_of_lugo_destination_desc: "[GetBuilding('roman_wall_of_lugo_01').GetName] ซึ่งล้อมรอบเมืองเก่า เป็นเครื่องพิสูจน์อันน่าทึ่งถึงวิศวกรรม [roman_culture.GetName] ประชากรในท้องถิ่นภาคภูมิใจในอนุสาวรีย์ทางประวัติศาสตร์นี้ ซึ่งยังคงตั้งตระหง่านเป็นสัญลักษณ์ที่แข็งแกร่งของอดีตอันเก่าแก่ของเมือง"
 building_rock_of_gibraltar_destination_desc: "[GetBuilding('rock_of_gibraltar_01').GetName] ซึ่งตั้งตระหง่านเหนือทะเล เป็นสถานที่สำคัญทางยุทธศาสตร์และสัญลักษณ์ คนในท้องถิ่น ซึ่งตระหนักถึงความสำคัญทางทหาร ได้เสริมความแข็งแกร่งตลอดหลายศตวรรษ ทำให้เป็นป้อมปราการที่ประตูสู่ระหว่างสองโลก"
 building_aljaferia_palace_destination_desc: "[GetBuilding('aljaferia_palace_01').GetName] ในซาราโกซาเป็นอัญมณีแห่งสถาปัตยกรรม [GetReligionByKey('islam_religion').GetName] ในใจกลางอารากอน ซุ้มโค้งที่หรูหราและลานอันเงียบสงบสะท้อนถึงการผสมผสานทางวัฒนธรรมอันรุ่มรวยของชาวมัวร์และชาวคริสต์ มรดกที่คนในท้องถิ่นหวงแหน"
 building_tower_of_hercules_destination_desc: "ตั้งตระหง่านใกล้ชายฝั่งคือ [GetBuilding('tower_of_hercules_01').GetName] ประภาคารโบราณ ซึ่งนำทางกะลาสีมานานหลายศตวรรษ โครงสร้าง [roman_culture.GetName] นี้ ซึ่งเต็มไปด้วยตำนานและประวัติศาสตร์ เป็นสัญลักษณ์ของความอดทนและการนำทางสำหรับชุมชนชาวทะเลในท้องถิ่น"
 building_city_wall_of_toledo_destination_desc: "ล้อมรอบเมืองประวัติศาสตร์ [GetBuilding('city_wall_of_toledo_01').GetName] อันน่าเกรงขามตั้งตระหง่านเป็นเครื่องพิสูจน์ถึงอดีตอันยาวนาน เชิงเทินเหล่านี้ ซึ่งเป็นการผสมผสานระหว่างการออกแบบ [roman_culture.GetName], [visigothic_culture.GetName] และมัวร์ เป็นแหล่งความภาคภูมิใจและความปลอดภัยสำหรับผู้อยู่อาศัยภายใน"
 building_alcazar_of_segovia_destination_desc: "[GetBuilding('alcazar_of_segovia_01').GetName] ซึ่งตั้งอยู่บนยอดเขาหินเหนือเมือง เป็นปราสาทในเทพนิยายที่มีชีวิต ป้อมปราการนี้ พร้อมด้วยรูปทรงที่โดดเด่นและประวัติศาสตร์อันยาวนาน จับจินตนาการของคนในท้องถิ่นและผู้มาเยือน"
 building_holy_site_basilica_santiago_destination_desc: "[GetBuilding('holy_site_basilica_santiago_01').GetName] เป็นสัญญาณสำหรับผู้แสวงบุญทั่วคริสต์ศาสนจักร มหาวิหารอันงดงามนี้ ซึ่งเป็นจุดสิ้นสุดของกามิโนเดซานเตียโก ได้รับการเคารพนับถือจากวัตถุมงคลและสถาปัตยกรรมโรมาเนสก์อันน่าทึ่ง ซึ่งเป็นที่เคารพนับถืออย่างลึกซึ้งของผู้ศรัทธา"
 building_cilician_gates_destination_desc: "[GetBuilding('cilician_gates').GetName] เป็นทางแยกทางยุทธศาสตร์มานานหลายศตวรรษ ทางเดินธรรมชาติแห่งนี้ ซึ่งใช้โดยพ่อค้าและกองทัพ มีความสำคัญอย่างยิ่งต่อชุมชนท้องถิ่นที่เดินทางผ่านเส้นทางเหล่านี้มานาน"
 building_fairy_chimneys_destination_desc: "[GetBuilding('fairy_chimneys').GetName] ในคัปปาโดเกียถูกแกะสลักโดยลมและน้ำ การก่อตัวของหินที่โดดเด่นเหล่านี้ พร้อมด้วยรูปทรงที่เป็นเอกลักษณ์ ไม่เพียง แต่ดึงดูดนักเดินทางที่อยากรู้อยากเห็นเท่านั้น แต่ยังทำหน้าที่เป็นบ้านและสถานที่สักการะสำหรับคนในท้องถิ่นอีกด้วย"
 building_sofia_ohrid_destination_desc: "เมื่อ [GetBuilding('sofia_ohrid').GetName] ปรากฏแก่สายตา ข้าพเจ้าหลงใหลในความงามอันเงียบสงบของมัน ภาพเฟรสโกและโมเสก แต่ละภาพบอกเล่าเรื่องราวของศรัทธาและศิลปะ มรดกที่ยืนหยัดผ่านการทดสอบของกาลเวลาและยังคงสร้างแรงบันดาลใจให้กับทั้งผู้ศรัทธาและผู้มาเยือน"
 building_hosios_loukas_destination_desc: "[GetBuilding('hosios_loukas').GetName] ซึ่งตั้งอยู่ในเทือกเขาของกรีซตอนกลาง เป็นอัญมณีแห่งศิลปะไบแซนไทน์ สถาปัตยกรรมอันน่าทึ่งและภาพเฟรสโกที่สวยงามของอารามเป็นที่เคารพนับถือของผู้ศรัทธาในท้องถิ่น ทำหน้าที่เป็นสัญญาณแห่งศาสนาคริสต์นิกายออร์โธดอกซ์"
 building_cattolica_stilo_destination_desc: "[GetBuilding('cattolica_stilo').GetName] เป็นตัวอย่างที่น่าทึ่งของสถาปัตยกรรมไบแซนไทน์ในอิตาลี โบสถ์เล็กๆ แต่น่าทึ่งแห่งนี้ พร้อมด้วยแผนผังรูปกากบาทอันเป็นเอกลักษณ์ มีสถานที่พิเศษในใจของชุมชนท้องถิ่น"
 building_etchmiadzin_cathedral_destination_desc: "[GetBuilding('etchmiadzin_cathedral').GetName] สถานที่ศักดิ์สิทธิ์ในวากฮาร์ชาปัต ถือเป็นศูนย์กลางทางจิตวิญญาณของชาวอาร์เมเนียทั่วโลก มหาวิหารโบราณแห่งนี้ พร้อมด้วยประวัติศาสตร์อันยาวนานและความสำคัญทางศาสนา เป็นแหล่งความภาคภูมิใจและการปลอบประโลมทางจิตวิญญาณสำหรับชุมชนอาร์เมเนียในท้องถิ่น"
 building_jvari_monastery_destination_desc: "ตั้งอยู่บนยอดเขา [GetBuilding('jvari_monastery').GetName] มองเห็นจุดบรรจบของแม่น้ำเบื้องล่าง อารามออร์โธดอกซ์จอร์เจียแห่งนี้ พร้อมด้วยสถาปัตยกรรมที่กลมกลืนกัน เป็นสถานที่พักผ่อนอันเงียบสงบและเป็นสัญลักษณ์ของศรัทธาคริสเตียนที่ยั่งยืนในภูมิภาค"
 building_saint_catherine_destination_desc: "ตั้งอยู่ที่เชิงเขาซีนาย [GetBuilding('saint_catherine').GetName] ตั้งตระหง่านเป็นป้อมปราการแห่งศรัทธา อารามโบราณแห่งนี้ พร้อมด้วยต้นฉบับอันล้ำค่าและวัตถุมงคล เป็นสถานที่สำหรับการไตร่ตรองสำหรับชุมชนออร์โธดอกซ์ในท้องถิ่นและผู้มาเยือน"
 building_apollinare_nuovo_destination_desc: "ในเมืองประวัติศาสตร์ราเวนนา [GetBuilding('apollinare_nuovo').GetName] ตั้งตระหง่านเป็นเครื่องพิสูจน์ถึงศิลปะและสถาปัตยกรรมคริสเตียนยุคแรก โมเสกอันงดงามของโบสถ์ ซึ่งพรรณนาถึงฉากในพระคัมภีร์ เป็นแหล่งความยำเกรงและแรงบันดาลใจสำหรับทั้งผู้ศรัทธาในท้องถิ่นและผู้ชื่นชมประวัติศาสตร์"
 building_mount_athos_destination_desc: "[GetBuilding('mount_athos_01').GetName] คาบสมุทรในกรีซตอนเหนือ เป็นชุมชนสงฆ์ที่มีเอกลักษณ์ ภูเขาศักดิ์สิทธิ์แห่งนี้ ซึ่งเป็นที่ตั้งของอารามหลายแห่ง เป็นสวรรค์ทางจิตวิญญาณที่เต็มไปด้วยประเพณีคริสเตียนออร์โธดอกซ์ ซึ่งเป็นที่เคารพนับถือของพระสงฆ์และผู้แสวงบุญ"
 building_meteora_destination_desc: "ในเทสซาลี อาราม [GetBuilding('meteora_01').GetName] เป็นภาพที่น่าเกรงขาม ตั้งอยู่บนยอดเสาหินสูงตระหง่าน สถานที่ศักดิ์สิทธิ์เหล่านี้ ซึ่งดูเหมือนจะแขวนอยู่ระหว่างโลกและท้องฟ้า เป็นสัญลักษณ์ของการแสวงหาความสูงส่งทางจิตวิญญาณของพระสงฆ์ในท้องถิ่น"
 building_despot_palace_destination_desc: "ความงดงามของ [GetBuilding('despot_palace').GetName] เป็นภาพที่น่าชม ห้องโถงอันยิ่งใหญ่และลานอันวิจิตรบรรจงมีชีวิตชีวาด้วยความพลุกพล่านของข้าราชบริพารและท่วงทำนองของนักดนตรี พระราชวัง ซึ่งเป็นศูนย์กลางของกิจกรรมทางการเมืองและศิลปะ ตั้งตระหง่านเป็นสัญลักษณ์อันภาคภูมิใจของอำนาจและความซับซ้อน"
 building_maiden_tower_destination_desc: "[GetBuilding('maiden_tower').GetName] ตั้งตระหง่านเฝ้าปากช่องแคบบอสพอรัส กำแพงของมัน ซึ่งเต็มไปด้วยตำนาน ได้เห็นความรุ่งเรืองและความเสื่อมของจักรวรรดิ บัดนี้ มันเฝ้ามองอย่างขยันขันแข็ง จุดยุทธศาสตร์ที่ควบคุมการเดินเรือผ่านน่านน้ำอันเก่าแก่เหล่านี้"
 building_patras_castle_destination_desc: "[GetBuilding('patras_castle').GetName] ตั้งตระหง่านเป็นยามเฝ้าระวังมานานหลายศตวรรษ กำแพงและหอคอยที่แข็งแรง ซึ่งมีร่องรอยของยุคต่างๆ เป็นเครื่องพิสูจน์ถึงความสำคัญทางประวัติศาสตร์และคุณค่าทางยุทธศาสตร์ของเมือง"
 building_sumela_monastery_destination_desc: "แกะสลักเข้าไปในหน้าผาของทรับซอน [GetBuilding('sumela_monastery_01').GetName] เป็นสิ่งมหัศจรรย์ของสถาปัตยกรรมสงฆ์ สถานที่พักผ่อนอันห่างไกลแห่งนี้ ซึ่งเกาะติดกับไหล่เขา มอบทิวทัศน์อันน่าทึ่งและความรู้สึกสงบอย่างลึกซึ้งแก่ผู้มาเยือน"
 building_saint_lazarus_destination_desc: "ในใจกลางลาร์นากา [GetBuilding('saint_lazarus').GetName] ตั้งตระหง่านเป็นสถานที่สักการะอันเก่าแก่ โครงสร้างที่สวยงามนี้ พร้อมด้วยรูปเคารพอันวิจิตรบรรจงและวัตถุมงคล มีสถานที่พิเศษในชีวิตทางจิตวิญญาณของชุมชนออร์โธดอกซ์ในท้องถิ่น"
 building_kassiopi_castle_destination_desc: "[GetBuilding('kassiopi_castle').GetName] ซึ่งตั้งตระหง่านเหนือทะเลไอโอเนียน ตั้งตระหง่านเป็นสัญญาณแห่งความระแวดระวัง ปราสาท ซึ่งเป็นศูนย์กลางของกิจกรรมทางเรือและการทหาร มีบทบาทสำคัญในความมั่นคงและความเจริญรุ่งเรืองของดินแดนโดยรอบ ประวัติศาสตร์ของมันเกี่ยวพันกับการขึ้นลงของโรมตะวันออก"
 building_hagios_demetrios_destination_desc: "โบสถ์ [GetBuilding('hagios_demetrios').GetName] ในเทสซาโลนิกิเป็นสถานที่ศักดิ์สิทธิ์ทางจิตวิญญาณ อุทิศให้กับนักบุญองค์อุปถัมภ์ของเมือง ห้องโถงอันศักดิ์สิทธิ์ ประดับประดาด้วยโมเสกอันงดงาม สะท้อนเสียงคำอธิษฐานและบทเพลงของชุมชนท้องถิ่นที่ศรัทธา"
 building_church_of_the_theotokos_destination_desc: "ในเงาของกำแพงคอนสแตนติโนเปิล [GetBuilding('church_of_the_theotokos').GetName] เป็นสัญญาณแห่งศรัทธา โบสถ์โบราณแห่งนี้ พร้อมด้วยบรรยากาศอันเงียบสงบและรูปเคารพศักดิ์สิทธิ์ เป็นรากฐานสำคัญของชีวิตทางศาสนาและวัฒนธรรมของชุมชนท้องถิ่น"
 building_parthenon_destination_desc: "[GetBuilding('parthenon').GetName] บนอะโครโพลิสในเอเธนส์ตั้งตระหง่านเป็นสัญลักษณ์ที่ยั่งยืนของอารยธรรมกรีกโบราณ วิหารอันสง่างามนี้ แม้จะอยู่ในสภาพปรักหักพังบางส่วน ยังคง ทำให้ผู้มาเยือนตกตะลึงด้วยความยอดเยี่ยมทางสถาปัตยกรรมและความสำคัญทางประวัติศาสตร์"
 building_imam_reza_shrine_destination_desc: "[GetBuilding('imam_reza_shrine_01').GetName] เป็นสถานที่ที่มีความสำคัญทางจิตวิญญาณอย่างยิ่ง อาคารอันงดงาม พร้อมด้วยโดมสีทองและหออะซาน ดึงดูดผู้แสวงบุญนับไม่ถ้วนที่แสวงหาการปลอบประโลมและการฟื้นฟูทางจิตวิญญาณในพื้นที่ศักดิ์สิทธิ์แห่งนี้"
 building_soltaniyeh_destination_desc: "[GetBuilding('soltaniyeh_01').GetName] เป็นผลงานชิ้นเอกทางสถาปัตยกรรมในยุคอิลข่าน การออกแบบที่สร้างสรรค์และกระเบื้องสีน้ำเงินอันน่าทึ่ง ทำให้เป็นสถานที่สำคัญที่โดดเด่นอย่างแท้จริง"
 building_palace_of_ctesiphon_destination_desc: "[GetBuilding('palace_of_ctesiphon_01').GetName] กระตุ้นความยิ่งใหญ่ของจักรวรรดิซาเซเนียน ซุ้มประตู ทาค คัสรา ซึ่งยังคงตั้งตระหง่านแม้จะผ่านความเสียหายของกาลเวลา เป็นเครื่องเตือนใจอันน่าสะเทือนใจถึงความกล้าหาญทางสถาปัตยกรรมของอารยธรรมโบราณนี้"
 building_falak_ol_aflak_citadel_destination_desc: "มองเห็นเมือง Khorramabad [GetBuilding('falak_ol_aflak_citadel_01').GetName] เป็นป้อมปราการที่มีความแข็งแกร่งและความงามอย่างน่าทึ่ง ป้อมปราการประวัติศาสตร์แห่งนี้ พร้อมด้วยเชิงเทินที่สูงตระหง่านและตำแหน่งทางยุทธศาสตร์ เป็นสัญลักษณ์ของมรดกอันรุ่มรวยและจิตวิญญาณที่ยั่งยืนของภูมิภาค"
 building_minarets_and_remains_of_jam_destination_desc: "ขณะที่ข้าพเจ้าเข้าใกล้ [GetBuilding('minarets_and_remains_of_jam_01').GetName] ความรู้สึกยำเกรงก็ท่วมท้นข้าพเจ้า โครงสร้างสูงตระหง่านเหล่านี้ ซึ่งเป็นซากของราชวงศ์ กูร์id ตั้งตระหง่านเป็นยามเฝ้าระวังที่โดดเดี่ยวในภูมิประเทศที่ขรุขระ งานอิฐอันวิจิตรบรรจงเป็นเครื่องพิสูจน์ถึงยุคที่ถูกลืม"
 building_great_wall_of_gorgan_destination_desc: "ขณะเดินทางข้ามภูมิประเทศ ข้าพเจ้าถ่อมตนด้วยความยิ่งใหญ่ของ [GetBuilding('great_wall_of_gorgan_01').GetName] ป้อมปราการขนาดมหึมานี้ ซึ่งทอดยาวไกลสุดลูกหูลูกตา เป็นเครื่องเตือนใจอันทรงพลังถึงความจำเป็นของอาณาจักรโบราณในการปกป้องพรมแดนจากผู้รุกราน"
 building_maharloo_lake_destination_desc: "ภาพของ [GetBuilding('maharloo_lake_01').GetName] ใกล้เมืองชีราซนั้นน่าหลงใหล น้ำสีชมพูสร้างภูมิทัศน์ที่เกือบจะเหนือจริง ทะเลสาบ ซึ่งเป็นปรากฏการณ์ทางธรรมชาติที่มีเอกลักษณ์ ดึงดูดใจข้าพเจ้าด้วยความงามและความสงบที่ไม่ธรรมดา"
 building_rainbow_mountains_destination_desc: "เมื่อมองดู [GetBuilding('rainbow_mountains_01').GetName] ข้าพเจ้าตกตะลึงกับชั้นหลากสีสันสดใส การก่อตัวทางธรรมชาติอันน่าทึ่งเหล่านี้ ซึ่งเป็นสิ่งมหัศจรรย์ทางธรณีวิทยา ทำให้ข้าพเจ้าประหลาดใจในศิลปะตามธรรมชาติของโลก"
 building_mount_damavand_destination_desc: "[GetBuilding('mount_damavand_01').GetName] อันสง่างาม ซึ่งตั้งตระหง่านเหนือภูมิประเทศโดยรอบ สร้างแรงบันดาลใจทั้งความยำเกรงและความเคารพ ในฐานะยอดเขาที่สูงที่สุดใน [GetGeographicalRegion('world_persian_empire').GetName] ยอดเขาที่ปกคลุมด้วยหิมะและความเชื่อมโยงในตำนานดึงดูดจินตนาการของข้าพเจ้า"
 building_tomb_of_cyrus_destination_desc: "เมื่อยืนอยู่หน้า [GetBuilding('tomb_of_cyrus_01').GetName] ใน พะซาร์กาดัย ข้าพเจ้าเต็มไปด้วยความรู้สึกอันลึกซึ้งถึงประวัติศาสตร์ อนุสาวรีย์ที่เรียบง่าย แต่สง่างามนี้ ซึ่งอุทิศให้กับพระมารดาของกษัตริย์โซโลมอน สะท้อนถึงมรดกอันลึกซึ้ง"
 building_ark_of_bukhara_destination_desc: "ขณะที่ข้าพเจ้าเดินผ่านประตูอันโอ่อ่าของ [GetBuilding('ark_of_bukhara_01').GetName] ข้าพเจ้าอดไม่ได้ที่จะรู้สึกถึงน้ำหนักของศตวรรษ ป้อมปราการโบราณแห่งนี้เป็นศูนย์กลางอำนาจของเอมีร์ท้องถิ่นนับตั้งแต่ก่อตั้งเมื่อหลายศตวรรษก่อน และกำแพงหนาของมันได้ต้อนรับคาราวานนับไม่ถ้วนตามเส้นทางสายไหม"
 building_shah_i_zinda_destination_desc: "การสำรวจสุสาน [GetBuilding('shah_i_zinda_01').GetName] ในซามาร์กันต์เป็นการเดินทางผ่านกาลเวลาและศิลปะ สุสาน แต่ละแห่ง พร้อมด้วยงานกระเบื้องอันวิจิตรบรรจง บอกเล่าเรื่องราว กระตุ้นความรู้สึกเคารพอย่างลึกซึ้งต่อมรดกทางวัฒนธรรมและจิตวิญญาณอันรุ่มรวยของภูมิภาค"
 building_alamut_castle_destination_desc: "[GetBuilding('alamut_castle_01').GetName] ซึ่งตั้งอยู่บนยอดเขาในหุบเขา อาลามุต กระตุ้นความรู้สึกถึงความลึกลับและความน่าสนใจ ครั้งหนึ่งเคยเป็นฐานที่มั่นของพวกมือสังหาร ตำแหน่งทางยุทธศาสตร์และอดีตอันยาวนานยังคง ทำให้ข้าพเจ้าและผู้มาเยือนในท้องถิ่นหลงใหล"
 building_golden_gate_of_kiev_destination_desc: "เมื่อเข้าใกล้ [GetBuilding('golden_gate_of_kiev_01').GetName] ข้าพเจ้าตกตะลึงในความยิ่งใหญ่สดใสของมัน ประตู ซึ่งทำหน้าที่เป็นทางเข้าเมือง สะท้อนเสียงของการค้า สถาปัตยกรรมที่แข็งแรง ซึ่งตั้งตระหง่านเป็นเครื่องพิสูจน์ถึงอำนาจของเมือง ยังคงสร้างแรงบันดาลใจให้เกิดความเคารพและความรู้สึกเชื่อมโยงกับอดีตอันรุ่งโรจน์ของเคียฟ"
 building_sar_i_sang_mines_01_destination_desc: "ที่ [GetBuilding('sar_i_sang_mines_01').GetName] อากาศอบอวลไปด้วยฝุ่นของแร่แลพิสลาซูลี หินสีน้ำเงินเข้ม ซึ่งมีค่าจากสีที่เข้มข้น กำลังถูกสกัดอย่างพิถีพิถันโดยคนงานเหมืองที่มีทักษะ เหมืองสะท้อนประวัติศาสตร์การค้าและความหรูหรา แร่แลพิสได้ประดับประดาสมบัติล้ำค่าที่สุดของจักรวรรดิ"
 
 building_drassanes_01_destination_desc: "คลังแสงอันยิ่งใหญ่ของ [GetBuilding('drassanes_01').GetName] เตรียมกองเรือรบแกลลีย์ ทำให้เจ้าของสามารถแสดงเจตจำนงในทะเลเมดิเตอร์เรเนียนได้ ภายใต้ห้องใต้ดินหินแหลม คนงานทำงานอย่างไม่รู้จักเหน็ดเหนื่อย"
 building_kyz_kala_01_destination_desc: "[GetBuilding('kyz_kala_01').GetName] ตั้งตระหง่านเหนือโอเอซิสอันเขียวชอุ่มของ เมิร์ฟ ทอดเงายาวเหนือดินแดนแห้งแล้ง ฐานรากของมันอยู่เหนือแท่นที่แข็งแรง และกำแพงร่องล้อมรอบโรงงาน คลังอาวุธ และห้องโถงถ้ำที่ทูตและข้าราชการเดินขวักไขว่อย่างวุ่นวาย"
 building_cluny_abbey_01_destination_desc: "ของขวัญแห่งที่ดินและสิทธิ์ แลกกับความรอดนิรันดร์ นั่นคือพันธสัญญาที่ก่อตัวขึ้นระหว่างชุมชนสงฆ์ของ [GetBuilding('cluny_abbey_01').GetName] และขุนนางท้องถิ่น"
 building_cluny_abbey_02_destination_desc: "[GetBuilding('cluny_abbey_02').GetName] โบสถ์ที่ใหญ่ที่สุดเท่าที่เคยฝันถึง ทางเดินกลางห้าทางยาวกว่าของวาติกัน ห้องใต้ดินหินขนาดใหญ่เป็นความสำเร็จทางสถาปัตยกรรมที่เต็มไปด้วยหอคอยและหลังคา นี่คือโรมใหม่อย่างแท้จริง"
 building_york_walls_01_destination_desc: "ทอดยาวหลายไมล์ [GetBuilding('york_walls_01').GetName] อันกว้างใหญ่นี้ได้ปกป้องเมืองมาตั้งแต่สมัยซีซาร์ สถานที่ตั้งไม่ได้ถูกเลือกเพื่อยึดครองพื้นที่สูง แต่เพื่อใช้ประโยชน์จากแม่น้ำสองสายที่คดเคี้ยวผ่านทุ่งหญ้าโดยรอบ"
 building_damascus_mosque_01_destination_desc: "[GetBuilding('damascus_mosque_01').GetName] เป็นหนึ่งในสถานที่ศักดิ์สิทธิ์ที่สุดในศาสนาอิสลามพร้อมเรื่องราวอันเก่าแก่ที่จะบอกเล่า วางรากฐานเหนือวิหารโรมันโบราณและมหาวิหารคริสเตียนยุคแรก จิตวิญญาณหลายศตวรรษและความเฉลียวฉลาดอันน่าอัศจรรย์ซ้อนทับกัน"
 building_jokhang_01_destination_desc: "[GetBuilding('jokhang_01').GetName] เป็นอาคารที่ซับซ้อนเหมือนเขาวงกตของลานและที่พักสงฆ์ที่ทอดผ่านทางเดินและห้องโถงถ้ำที่ปกคลุมด้วยเนยจามรี หืม เนยจามรี บางทีข้าควรลองชิมดูบ้าง..."
 building_wartburg_01_destination_desc: "ซ่อนตัวอยู่ในป่าทูรินเจียและตั้งอยู่บนยอดผาหินใหญ่ ป้อมปราการอันยิ่งใหญ่ของ [GetBuilding('wartburg_01').GetName] ควบคุมการเคลื่อนย้ายสินค้าและผู้คนทั้งหมดผ่านภูมิภาค ห้องโถงขนาดใหญ่ที่ทำจากหินเย็น ซึ่งได้รับความอบอุ่นจากเตาผิงจำนวนมากภายใน"
 building_beta_giyorgis_01_destination_desc: "[GetBuilding('beta_giyorgis_01').GetName] ถูกแกะสลักทั้งหมดจากหินภูเขาไฟสีแดงอบอุ่น ขุดลึกลงไปในหิน ห้องโถงหลักของโบสถ์ถูกทาสีอย่างหรูหราด้วยภาพเฟรสโกที่สวยงาม ในขณะที่รูปเคารพศักดิ์สิทธิ์ประดับผนัง"
 building_holy_wisdom_01_destination_desc: "[GetBuilding('holy_wisdom_01').GetName] อันงดงามถูกจำลองตามแบบฮาเกียโซเฟีย เพื่อแสดงถึงแสงสว่าง ความมั่งคั่ง และอำนาจเดียวกันในดินแดนทางเหนืออันหนาวเหน็บ ลักษณะหินปูนสีขาวที่เคร่งขรึมของมันบดบังสีสันอันท่วมท้นของภาพเฟรสโกภายใน"
 building_kano_walls_01_destination_desc: "[GetBuilding('kano_walls_01').GetName] สูงหลายฟุต ล้อมรอบเมืองโบราณคาโน กำหนดเส้นทางการค้าที่สำคัญของภูมิภาคผ่านประตูใหญ่"
 building_somapura_university_01_destination_desc: "[GetBuilding('somapura_university_01').GetName] เป็นศูนย์กลางการเรียนรู้ที่สำคัญที่สุดแห่งหนึ่งของอินเดียมานานหลายศตวรรษ ดึงดูดนักวิชาการจากภูมิภาคห่างไกลด้วยการเชื่อมต่อมากมายกับอารามพุทธ เชน และฮินดู"
 building_duomo_florence_01_destination_desc: "ตามแนวกำแพงโรมันโบราณใกล้ประตูทางเหนือ [GetBuilding('duomo_florence_01').GetName] เป็นที่พำนักของชาวคริสต์มาตั้งแต่ก่อนสมัยคอนสแตนติน ตลอดเวลาที่ผ่านมา มันได้รับความเสียหายจากการลอบวางเพลิงและการปล้นสะดม การบูรณะและการอวยพร"
 building_duomo_florence_02_destination_desc: "[GetBuilding('duomo_florence_02').GetName] เป็นหอศีลจุ่มแปดเหลี่ยมขนาดมหึมาใจกลางเมือง อุทิศให้กับนักบุญยอห์นองค์อุปถัมภ์\nมันถูกปกคลุมด้วยหินอ่อนราคาแพงและตก แต่งด้วยประติมากรรมชั้นครูและโมเสกสีทอง เป็นเครื่องพิสูจน์ถึงความมั่งคั่งของเมืองอย่างแท้จริง"
 building_duomo_florence_03_destination_desc: "[GetBuilding('duomo_florence_03').GetName] เป็นมหาวิหารที่คู่ควรกับฟลอเรนซ์ที่มั่งคั่ง ส่วนหน้าอาคารเต็มไปด้วยรูปปั้นเหมือนมนุษย์ของศาสดาพยากรณ์ เทพเจ้า และผู้อุปถัมภ์ และเงายาวทอดจากหอระฆังสูงของมัน บอกเวลาทำงานและสวดมนต์สำหรับชาวเมืองและผู้มาเยือน"
 building_duomo_florence_04_destination_desc: "[GetBuilding('duomo_florence_04').GetName] เป็นความสำเร็จที่ยิ่งใหญ่ที่สุดของผู้สร้างชาวฟลอเรนซ์ ตั้งตระหง่านเพรียวบางและโปร่งสบายตัดกับท้องฟ้าสีคราม มันสูงและกว้างกว่าที่เคยคิดไว้ โดยไม่มีระบบรองรับใดๆ ที่จะป้องกันไม่ให้มันพังทลายลงมา แต่มีการใช้อิฐและปูนก่อสองชั้นอย่างชาญฉลาด"
 building_konark_temple_01_destination_desc: "สร้างโดยช่างฝีมือหลายพันคน [GetBuilding('konark_temple_01').GetName] ขนาดมหึมาอุทิศให้กับเทพเจ้าแห่งดวงอาทิตย์ สุริยะ อาคารทั้งหลังถูกสร้างขึ้นเพื่อจำลองราชรถอันยิ่งใหญ่ของเทพเจ้า นำแสงสว่างจากทะเลไปทางทิศตะวันออก"
 building_al_qarawiyyin_university_01_destination_desc: "ก่อตั้งโดยพ่อค้าและผู้อพยพจากเมือง ไคโรวัน ในแอฟริกา [GetBuilding('al_qarawiyyin_university_01').GetName] เป็นหนึ่งในศูนย์กลางการศึกษาระดับสูงที่มีชื่อเสียงที่สุดในโลกอิสลามตะวันตกทั้งหมด ดึงดูดนักวิชาการจากภูมิภาคห่างไกล"
 building_kairouan_basins_01_destination_desc: "[GetBuilding('kairouan_basins_01').GetName] ถูกสร้างขึ้นเพื่อจัดหาน้ำจืดให้กับเมืองในยามจำเป็น อ่างเก็บน้ำขนาดใหญ่เหล่านี้ ทำให้น้ำฝนบริสุทธิ์โดยทำหน้าที่เป็นถังตกตะกอนและกรองตะกอนลง"
 building_ghana_palace_01_destination_desc: "ล้อมรอบด้วยป่าศักดิ์สิทธิ์คือ [GetBuilding('ghana_palace_01').GetName] - ที่พำนักของหัวหน้าเผ่าของเมือง\nอาคารประกอบด้วยอาคารหินทรายและอิฐดินเหนียวและได้รับการคุ้มครองโดยรั้วรอบขอบชิด โครงสร้างขนาดใหญ่ พระราชวังแห่งนี้โดดเด่นเหนือเมืองโดยรอบ"
 building_visegrad_castle_01_destination_desc: "[GetBuilding('visegrad_castle_01').GetName] เป็นระบบกำแพงและหอคอยที่ยิ่งใหญ่และไม่สามารถเข้าถึงได้ ปกป้องโค้งแม่น้ำดานูบและควบคุมการค้าที่ร่ำรวย"
 building_wawel_cathedral_01_destination_desc: "สร้างขึ้นด้วยความช่วยเหลือของช่างฝีมือจากทั่วคริสต์ศาสนจักร มหาวิหารหินอันยิ่งใหญ่นี้เป็นแห่งแรกในดินแดนโปแลนด์ จากยอดเนินเขา [GetBuilding('wawel_cathedral_01').GetName] ระฆังจากหอคอยทั้งสองเรียกชาวเมืองมาทำพิธีมิสซาในทางเดินกลางยาวที่จุดเทียนสว่างไสว"
 building_vatapi_caves_01_destination_desc: "สร้างขึ้นโดยราชวงศ์จาลุกยะยุคแรก [GetBuilding('building_vatapi_caves_01').GetName] ถูกตัดลึกเข้าไปในการก่อตัวของหินทรายอันโอ่อ่า ภายในเป็นโลกภายในที่ศักดิ์สิทธิ์และเงียบสงบที่สุด ประตูชัยนำผู้แสวงบุญเข้าสู่ใบหน้าหินใหญ่ของภูเขา"
 building_jaisalmer_fort_01_destination_desc: "เมื่อดวงอาทิตย์เริ่มลับขอบฟ้า กำแพงอันยิ่งใหญ่ของ [GetBuilding('jaisalmer_fort_01').GetName] เปลี่ยนเป็นสีน้ำผึ้งหวานอบอุ่น ส่องแสงเจิดจ้ากลางทะเลทราย ป้อมปราการถูกสร้างขึ้นเพื่อปกป้องเมืองภายในจากภัยคุกคามใดๆ"
 building_pleasure_dome_01_destination_desc: "[GetBuilding('pleasure_dome').GetName]ผุดขึ้นจากผืนดินดุจความฝันอันเป็นจริง ล้อมรอบด้วยอุทยานและสายธารา, โถงหินอ่อนและศาลาเปิดโล่งเชื้อเชิญให้พักผ่อนหย่อนใจและใคร่ครวญไตร่ตรอง, ล่องลอยอยู่ในบรรยากาศอันอบอวลด้วยเสียงดนตรีและไอหอม"
 building_burkhan_khaldun_01_destination_desc: "ถูกปกคลุมด้วยม่านหมอกและความเคารพยำเกรง, [GetBuilding('burkhan_khaldun_01').GetName]ตั้งตระหง่านอย่างศักดิ์สิทธิ์ท่ามกลางยอดเขาเคนตี เป็นสถานที่แห่งการสวดภาวนาและการจาริกแสวงบุญ, เชื่อกันว่าไหล่เขาอันสงบเงียบของมันช่วยปกป้องคุ้มครองดวงวิญญาณแห่งผืนดินและผู้คน"

 building_nanhua_temple_01_destination_desc: "[GetBuilding('nanhua_temple_01').GetName] ตั้งอยู่ท่ามกลางเนินเขาอันเขียวชอุ่มและแม่น้ำที่เงียบสงบ หลังคากระเบื้องสะท้อนแสงผ่านหมอกยามเช้า ต้นไซปรัสโบราณเรียงรายตามเส้นทาง และผู้แสวงบุญก้มกราบหน้าห้องโถงที่สะท้อนถึงศตวรรษแห่งความศรัทธาและการศึกษาอันเงียบสงบ"
 building_jizu_shan_temples_01_destination_desc: "เรียงรายอยู่บนลาดเขา [GetBuilding('jizu_shan_temples_01').GetName] มองออกไปเห็นเมฆที่ลอยล่องราวกับกระแสน้ำ กงล้อมนตราทองสัมฤทธิ์หมุนในสายลมขณะที่พระสงฆ์จุดธูปท่ามกลางต้นไม้โบราณ ผู้แสวงบุญเดินขึ้นบันไดหินอย่างอดทน แสวงหาเสียงสะท้อนของการตรัสรู้ในสมัยโบราณ"
 building_tiantai_monasteries_01_destination_desc: "[GetBuilding('tiantai_monasteries_01').GetName] เกาะติดอยู่กับหน้าผาที่มีหมอกปกคลุมเหนือหุบเขาลึก สายน้ำพึมพำผ่านโขดหินที่ปกคลุมด้วยมอส และพระสงฆ์ที่ถือม้วนคัมภีร์โต้เถียงพระธรรมในที่ ซึ่งอาจารย์ของพวกเขาเคยสอนการทำสมาธิ หลักคำสอน และโลกใบนี้"
 building_maoshan_academy_01_destination_desc: "[GetBuilding('maoshan_academy_01').GetName] ตั้งตระหง่านอยู่ท่ามกลางยอดเขามรกตที่ปกคลุมไปด้วยหมอกที่ลอยล่อง ลานภายในอบอวลไปด้วยกลิ่นสนและหมึก บัณฑิตคัดลอกตำราด้วยแสงตะเกียง ผสมผสานการแพทย์และเวทมนตร์คาถา ในขณะที่นกกระเรียนบินวนรอบสันเขาที่มียอดเป็นศาลเจ้าเบื้องหลัง"
 building_lize_academy_01_destination_desc: "เมื่อข้าสิ้นสุดการเดินทาง [GetBuilding('maoshan_academy_01').GetName] ก็ยืนตระหง่านอยู่ตรงหน้าข้า ข้างทะเลสาบอันเงียบสงบที่สะท้อนภาพต้นวิลโลว์และหลังคากระเบื้อง ขณะที่ข้าเข้าไปใกล้ ข้าได้ยินเสียงบัณฑิตในระยะไกล สวมชุดคลุมเรียบง่ายและท่องคัมภีร์ขงจื๊อ"
 building_culai_academy_01_destination_desc: "เมื่อ [GetBuilding('culai_academy_01').GetName] ปรากฏขึ้นในสายตา ข้าก็หลงใหลในความงามที่ชำระล้างจิตวิญญาณของมันมากขึ้นเรื่อย ๆ หมอกที่ลงมาจากยอดเขาชูไหลลอยผ่านลานภายใน ที่ ซึ่งผู้แสวงหาความรู้ไล่ตามความทะเยอทะยานทางวิชาการของพวกเขา"
 building_shigu_academy_01_destination_desc: "การเดินทางของข้านำพาข้ามาถึง [GetBuilding('shigu_academy_01').GetName] ในที่สุด ซ่อนตัวอยู่บนยอดเขาที่ปกคลุมด้วยหมอกและรายล้อมไปด้วยป่าเขียวชอุ่ม เมื่อเดินขึ้นบันได ประตูที่มีชื่อเสียงของมันเป็นภาพที่ต้อนรับด้วยงานเขียนที่ซับซ้อน ภายใต้เงาของหลังคาที่ได้รับการบูรณะใหม่"
 building_white_deer_grotto_academy_01_destination_desc: "ขณะที่ข้าเข้าใกล้ [GetBuilding('white_deer_grotto_academy_01').GetName] ข้าประทับใจที่มันกลมกลืนกับเนินเขาโดยรอบได้อย่างแนบเนียน อาคารหินตั้งอยู่ท่ามกลางป่าไผ่ ชวนให้รำลึกถึงสถานที่ที่บัณฑิตเคยแสวงหาความจริงและความสามัคคี"
 building_gongsanseong_fortress_01_destination_desc: "เมื่อ [GetBuilding('gongsanseong_fortress_01').GetName] ปรากฏต่อหน้าข้า ข้าประทับใจกับท่าทีที่น่าเกรงขามของมันเหนือหุบเขาแม่น้ำ กำแพงโบราณสะท้อนเรื่องราวของการรบที่ถูกลืมเลือนไปนาน กษัตริย์ผู้ภักดี และจิตวิญญาณที่ยืดหยุ่นของอาณาจักรที่น่าภาคภูมิใจ"
 building_besakih_temple_01_destination_desc: "ต่างจากชื่อที่ถ่อมตัวของ [GetBuilding('besakih_temple_01').GetName] ข้าพบว่าไม่ใช่แค่วัดเดียว แต่เป็นกลุ่มอาคารสาธารณะและศาลเจ้าส่วนตัวที่สลับซับซ้อน ซึ่งใช้สำหรับการสวดมนต์และพิธีกรรมภายในกำแพง จนได้รับฉายาว่า \"วัดแม่\""
 building_mount_apo_01_destination_desc: "เมื่อ [GetBuilding('mount_apo_01').GetName] ปรากฏขึ้นที่ขอบฟ้า ข้ารู้สึกต่ำต้อยด้วยความยิ่งใหญ่ที่เงียบสงบของมัน เมฆโอบล้อมลาดเขาที่ขรุขระ และกลิ่นฝนและเถ้าถ่านอ้อยอิ่งอย่างสง่างาม ยอดเขาอันเป็นที่เคารพปกป้องจิตวิญญาณของโลกและไฟ"
 building_dieng_plateau_01_destination_desc: "ความเงียบสงบราวกับโลกอื่นของ [GetBuilding('dieng_plateau_01').GetName] นั้นน่าทึ่งสำหรับสายตามนุษย์ ไอน้ำลอยขึ้นจากปากปล่องภูเขาไฟสีมรกต และศาลเจ้าหินโบราณโผล่ขึ้นมาจากหมอก มันเป็นอาณาจักรที่น่าทึ่งที่ธรรมชาติและศรัทธาดูเหมือนจะใช้ลมหายใจเดียวกัน"
 building_plain_of_jars_01_destination_desc: "[GetBuilding('plain_of_jars_01').GetName] ทอดยาวต่อหน้าข้า กว้างใหญ่และเงียบงันภายใต้ท้องฟ้าสีซีด กระจัดกระจายไปทั่วเนินเขา ภาชนะลึกลับขนาดมหึมาตั้งอยู่ครึ่งหนึ่งฝังอยู่ในหญ้าและเงา วัตถุประสงค์ที่ถูกลืมของพวกมันกระซิบถึงอารยธรรมที่สาบสูญไปนาน แต่ไม่เคยจางหายไปโดยสิ้นเชิง"
 building_pagoda_of_fogong_temple_01_destination_desc: "[GetBuilding('pagoda_of_fogong_temple_01').GetName] ตั้งตระหง่านอยู่ตรงหน้าข้า ชั้นไม้ของมันเอื้อมขึ้นไปราวกับคำอธิษฐานที่สลักไว้บนท้องฟ้า แต่ละชั้นอบอวลไปด้วยกลิ่นธูปโบราณ เป็นเครื่องพิสูจน์ถึงความศรัทธาและงานฝีมือที่ยั่งยืนมาเกือบพันปี"
 building_hanging_temple_01_destination_desc: "[GetBuilding('hanging_temple_01').GetName] แขวนอยู่บนหน้าผาราวกับภาพนิมิตชั่วขณะระหว่างโลกและท้องฟ้า ห้องโถงไม้ยื่นออกมาจากหน้าผา คานดูเหมือนจะท้าทายแรงโน้มถ่วง ที่ ซึ่งพระสงฆ์สวดมนต์ท่ามกลางสายลม ความเงียบ และความศรัทธาที่มั่นคง"
 building_muaro_jambi_01_destination_desc: "[GetBuilding('muaro_jambi_01').GetName] แผ่ขยายไปตามริมฝั่งแม่น้ำ เขาวงกตของเขตรักษาพันธุ์สัตว์ป่าอิฐที่ห่อหุ้มด้วยป่า เถาวัลย์ขดรอบสถูปที่สร้างขึ้นอย่างหรูหรา และอากาศครวญครางด้วยความชรา เสียงสะท้อนของบัณฑิต ผู้แสวงบุญอ้อยอิ่งเพื่อการค้าและศรัทธา"
 building_liuhe_pagoda_01_destination_desc: "บนเส้นทางข้างแม่น้ำ [GetBuilding('liuhe_pagoda_01').GetName] ทักทายข้าด้วยความสง่างามเป็นชั้น ๆ ที่ยิ่งใหญ่ สว่างไสวเบื้องบนและมืดมนเบื้องล่าง ภายในที่ขึ้นไป แต่ละขั้นมีผนังภายนอก ทางเดินซิกแซก ผนังภายใน และห้องเล็ก ๆ ที่เต็มไปด้วยบัณฑิตที่อุทิศตน"
 building_dau_temple_01_destination_desc: "[GetBuilding('dau_temple_01').GetName] ตั้งอยู่ตรงที่ราบลุ่มแม่น้ำแดงบรรจบกับท้องฟ้า ลานภายในมีชีวิตชีวาด้วยควันธูปและการสวดมนต์ ศาลเจ้าโบราณเปล่งประกายในแสงแดด เป็นจุดกำเนิดของพุทธศาสนาในภูมิภาคและศตวรรษแห่งความศรัทธาทางจิตวิญญาณที่ยั่งยืน"
 building_mount_baekdu_01_destination_desc: "เมื่อ [GetBuilding('mount_baekdu_01').GetName] ปรากฏในสายตา ยอดเขาที่ปกคลุมด้วยหิมะจะเรืองแสงตัดกับขอบฟ้า ว่ากันว่ามีทะเลสาบปากปล่องภูเขาไฟขนาดใหญ่อยู่บนยอดเขา วางตัวเหมือนกระจกส่องสวรรค์ สะท้อนความสุขแห่งสวรรค์"
 building_byeokran_port_01_destination_desc: "จากหน้าผาเบื้องบน [GetBuilding('byeokran_port_01').GetName] ทอดยาวไปตามอ่าวที่ระยิบระยับ โกดังตั้งอยู่ตามแนวชายฝั่งข้างเสากระโดงไม้ ขณะที่เสียงร้องของนกนางนวลผสมผสานกับเสียงสมอเรือกระทบกัน"
 building_hwangnyongsa_01_destination_desc: "ข้ายืนอยู่หน้า [GetBuilding('hwangnyongsa_01').GetName] ที่ ซึ่งเจดีย์เก้าชั้นเปล่งประกายในแสงแดด พระสงฆ์สวดมนต์ในลานกว้าง และข้าสัมผัสได้ถึงความศรัทธาและความยืดหยุ่นที่สะท้อนอยู่ในศิลาและคานทองคำทุกก้อน"
 building_hakata_port_01_destination_desc: "[GetBuilding('hakata_port_01').GetName] คึกคักไปด้วยพ่อค้าและกะลาสีจากดินแดนห่างไกล ท่าเรือเต็มไปด้วยผ้าไหม เครื่องปั้นดินเผา และเครื่องเทศ ท่าเรือแออัดไปด้วยเรือไม้ที่ส่งเสียงดังเอี๊ยดอ๊าด ใบเรือรับลมทะเล ทำหน้าที่เป็นศูนย์กลางการค้า วัฒนธรรม และอิทธิพลของจักรวรรดิที่คึกคัก"
 building_chinjufu_01_destination_desc: "[GetBuilding('chinjufu_01').GetName] มีชีวิตชีวาด้วยระเบียบวินัย ค่ายทหารและอู่ต่อเรือก้องกังวานด้วยเสียงกระทบกันของชุดเกราะและเสียงตะโกนของกะลาสี หอสังเกตการณ์เรียงรายตามอ่าว เฝ้าระวังทะเลทางเหนือของอาณาจักรที่ ซึ่งทุกจังหวะหัวใจขับเคลื่อนด้วยการป้องกันและหน้าที่"
 building_dazaifu_01_destination_desc: "[GetBuilding('dazaifu_01').GetName] ตั้งอยู่ท่ามกลางเนินเขาและสวนบ๊วย คึกคักไปด้วยอาลักษณ์ ทูต และเจ้าหน้าที่ เป็นศูนย์กลางที่คำสั่งบริหารจะถูกส่งไปยังจังหวัดที่ห่างไกล ด้วยพระราชกฤษฎีกาที่ประทับตราผ่านหมึก ธูป และอำนาจที่แนบเนียน"
 building_enryaku_ji_01_destination_desc: "[GetBuilding('enryaku_ji_01').GetName] สวมมงกุฎภูเขาฮิเออิ ห้องโถงถูกปกคลุมด้วยหมอก ผู้แสวงบุญปีนขึ้นไปตามเส้นทางที่คดเคี้ยวผ่านพระสงฆ์ที่สวดมนต์และเสียงระฆัง ที่ ซึ่งคำสอนของ $SaichO_$ ยังคงหล่อหลอมความศรัทธาและวินัยของชาติ"
 building_kofuku_ji_01_destination_desc: "[GetBuilding('kofuku_ji_01').GetName] ตั้งตระหง่านข้างน้ำในสระน้ำที่ขุ่นมัว เจดีย์ห้าชั้นทอดเงายาวเหนือถนนโบราณ ขุนนางและพระสงฆ์เดินผ่านใต้ประตูที่แข็งแรง ที่ ซึ่งบัณฑิตนั่งสมาธิด้วยความศรัทธาในพุทธศาสนาอันเงียบสงบ"
 building_ise_jingu_01_destination_desc: "[GetBuilding('ise_jingu_01').GetName] ตั้งตระหง่านข้างน้ำในสระน้ำที่ขุ่นมัว เจดีย์ห้าชั้นทอดเงายาวเหนือถนนโบราณ ขุนนางและพระสงฆ์เดินผ่านใต้ประตูที่แข็งแรง ที่ ซึ่งบัณฑิตนั่งสมาธิด้วยความศรัทธาในพุทธศาสนาอันเงียบสงบ"
 building_heian_palace_01_destination_desc: "[GetBuilding('heian_palace_01').GetName] ตั้งตระหง่านไปตามถนน ประตูสีแดงชาดเปิดออกสู่ลานกว้างที่ปูด้วยกรวดสีขาว ขุนนางที่พรมน้ำหอมเดินผ่านห้องโถงเคลือบเงา ที่ ซึ่งฉากกั้นทองคำและเสียงพิณในระยะไกลสะท้อนถึงความสง่างามของชีวิตในราชสำนัก"
 building_itsukushima_jinja_01_destination_desc: "[GetBuilding('itsukushima_jinja_01').GetName] ตั้งอยู่เหนือน้ำขึ้นน้ำลง เสาโทริอิสีแดงชาดดูเหมือนจะลอยอยู่ระหว่างทะเลและท้องฟ้า โคมไฟแกว่งไกวใต้ชายคาไม้ขณะที่พระสงฆ์ดูแลพิธีกรรมศักดิ์สิทธิ์ เสียงสวดมนต์ผสมผสานกับจังหวะของคลื่น"
 building_mount_fuji_01_destination_desc: "[GetBuilding('mount_fuji_01').GetName] ตั้งตระหง่านอย่างสง่างามเหนือที่ราบ ยอดเขาที่ปกคลุมด้วยหิมะเปล่งประกายตัดกับท้องฟ้าที่สดใส ชาวบ้านและผู้แสวงบุญต่างมองขึ้นไปด้านบนด้วยความเคารพ เพราะมันเกี่ยวข้องกับเทพธิดาของมันและทำหน้าที่เป็นกระจกสะท้อนความงามชั่วนิรันดร์"

 building_sunday_bazaar_01_destination_desc: "[GetBuilding('sunday_bazaar_01').GetName] มีชีวิตชีวา ถนนที่มีแสงแดดส่องถึงเต็มไปด้วยผ้าไหม เครื่องเทศ และปศุสัตว์ พ่อค้าจากดินแดนห่างไกลเจรจาต่อรองกันในหลายภาษา สร้างเสียงและสินค้าที่ผสมผสานกันอย่างมีชีวิตชีวา ซึ่งสะท้อนถึงจิตวิญญาณแห่งเส้นทางสายไหม"
 building_dunhuang_market_01_destination_desc: "[GetBuilding('dunhuang_market_01').GetName] ฮัมเพลงภายใต้แสงอาทิตย์ทะเลทราย พ่อค้าจากทุกภูมิภาคค้าขายสินค้าแปลกใหม่และจำเป็น อูฐพักอยู่ที่ประตูขณะที่ผู้แสวงบุญและชาวบ้านแลกเปลี่ยนม้วนคัมภีร์และเรื่องราวที่มุ่งหน้าไปยังโอเอซิสที่ห่างไกลเบื้องหน้า"
 building_hamadan_bazaar_01_destination_desc: "[GetBuilding('hamadan_bazaar_01').GetName] คดเคี้ยวไปตามตรอกซอกซอยที่โค้งมน ซึ่งเต็มไปด้วยกลิ่นหญ้าฝรั่นและเครื่องหนัง พ่อค้าตะโกนเรียกจากแผงขายของในร่มเงา สินค้าของพวกเขาพร้อมสำหรับเจ้าของใหม่ ในขณะที่นักเดินทางและชาวเมืองเคลื่อนผ่านศูนย์กลางการค้าที่มีคุณค่าทางประวัติศาสตร์แห่งนี้"
 building_lahur_bazaar_01_destination_desc: "[GetBuilding('lahur_bazaar_01').GetName] ฮัมเพลงด้วยเสียงและสีสันที่สดใส ขณะที่ตรอกซอกซอยแคบ ๆ คึกคักไปด้วยพ่อค้าเครื่องเทศ ช่างย้อมผ้า และช่างอัญมณี ควันหอมลอยขึ้นจากแผงขายอาหาร และ แต่ละมุมก็สั่นสะเทือนด้วยพลังแห่งความยิ่งใหญ่และการค้าที่คึกคัก"
 building_changan_market_01_destination_desc: "[GetBuilding('changan_market_01').GetName] คึกคักไปด้วยพ่อค้าจากทั่วโลกภายใต้ธงทิวที่สดใส สินค้าต่างประเทศช่วยเพิ่มสีสัน และนักแสดงข้างถนนและบัณฑิตก็ปะปนกันอยู่ท่ามกลางศูนย์กลางการค้าที่คึกคัก"
 building_khiva_bazaar_01_destination_desc: "[GetBuilding('khiva_bazaar_01').GetName] คดเคี้ยวผ่านตรอกซอกซอยที่มีแดดส่องถึงใต้หอคอยสีฟ้าคราม เต็มไปด้วยกลิ่นยี่หร่าและขนสัตว์ พ่อค้าต่อรองราคาพรมและงาช้าง เสียงของพวกเขาก้องกังวานภายใต้โดมที่สะท้อนถึงการค้าและอาณาจักรที่มีคุณค่าทางประวัติศาสตร์ของทะเลทราย"
 building_lhasa_market_01_destination_desc: "[GetBuilding('lhasa_market_01').GetName] แผ่ขยายออกไปภายใต้ธงมนต์ที่ปลิวไสว นำเสนอแผงขายของที่ล้นไปด้วยตะเกียงเนย ลูกปัดสี และขนจามรี พระสงฆ์ คนเร่ร่อน และพ่อค้าปฏิสัมพันธ์กันในอากาศบนภูเขาสูง การต่อรองราคาของพวกเขาแผ่วเบาลงด้วยเสียงระฆังวัดที่ดังกังวานในระยะไกล"
 building_dvin_shuka_01_destination_desc: "ขณะที่ข้าเดินผ่าน [GetBuilding('dvin_shuka_01').GetName] อากาศก็ก้องกังวานด้วยเสียงจากดินแดนห่างไกล ทองสัมฤทธิ์เปล่งประกายภายใต้หลังคาผ้าทอขณะที่พ่อค้าเร่งเร้าให้ข้าลองชิมขนมหวานและชมผ้าไหมสีสันสดใสของพวกเขา ทุกการแลกเปลี่ยนเผยให้เห็นพลังอันมีชีวิตชีวาของเมือง"
 building_herat_bazaar_01_destination_desc: "ข้าเดินเตร็ดเตร่ผ่านโถงโค้งของ [GetBuilding('herat_bazaar_01').GetName] ที่ ซึ่งกระเบื้องระยิบระยับเหนือแผงขายของในร่มเงา น้ำไหลรินผ่านร่องหิน และกลิ่นสีย้อมและฝุ่นยังคงอ้อยอิ่งอยู่ภายใต้เสียงฮัมของการค้าที่มั่นคง"
 building_hoshi_ryokan_01_destination_desc: "ข้ามาถึง [GetBuilding('hoshi_ryokan_01').GetName] คานไม้ขัดเงาด้วยการต้อนรับอันเงียบสงบมานานหลายศตวรรษ โคมไฟเรืองแสงตามระเบียงเสื่อทาทามิ และกลิ่นซีดาร์และน้ำในฤดูใบไม้ผลิลอยมาจากห้องอาบน้ำ ที่ ซึ่งเวลาดูเหมือนจะเคลื่อนไปอย่างนุ่มนวลกว่า"
 building_borobudur_01_destination_desc: "ในยามรุ่งสาง ข้ายืนอยู่หน้า [GetBuilding('borobudur_01').GetName] ระเบียงของมันตั้งตระหง่านราวกับมันดาล่าหินจากหมอก พระพุทธรูปแกะสลักเฝ้าดูขณะที่แสงแดดสัมผัสสถูป เป็นตัวแทนของเส้นทางจากโลกสู่การตรัสรู้ที่สลักไว้ในหินภูเขาไฟ"
 building_krakatoa_01_destination_desc: "จากเรือของข้าในช่องแคบ ข้าสังเกตเห็น [GetBuilding('krakatoa_01').GetName] ปรากฏขึ้นที่ขอบฟ้า ลาดเขาถูกปกคลุมด้วยควันที่ลอยฟุ้ง ทะเลกระซิบด้วยความไม่สบายใจ และอากาศมีกลิ่นเถ้าถ่านฉุน เป็นเครื่องเตือนใจถึงแกนกลางที่กระสับกระส่ายของภูเขาใต้คลื่น"
 building_po_klong_garai_01_destination_desc: "ข้ามาถึง [GetBuilding('po_klong_garai_01').GetName] ภายใต้แสงแดดที่แผดเผา หอคอยอิฐสีแดงตั้งตระหง่านจากเนินเขาแห้งแล้งราวกับถ่านแห่งความศรัทธา ภาพแกะสลักที่ผุกร่อนของเทพเจ้าและพญานาคปกป้องสถานที่ศักดิ์สิทธิ์ ที่ ซึ่งธูปและความเงียบสงบยกย่องกษัตริย์ผู้กลายเป็นตำนาน"
 building_citadel_thang_long_01_destination_desc: "ข้าเดินไปตามกำแพงดินของ [GetBuilding('citadel_thang_long_01').GetName] ที่ทอดยาวไปถึงแม่น้ำ หอสังเกตการณ์มองเห็นสระบัวและหลังคากระเบื้อง มีทหารและข้าราชสำนักเคลื่อนผ่านหมอกควันธูปและหมอกยามเช้า ปกป้องเมืองหลวงที่กำลังเติบโต"
 building_citadel_thang_long_02_destination_desc: "ข้าเดินผ่านประตูของ [GetBuilding('citadel_thang_long_02').GetName] ที่ ซึ่งลวดลายมังกรขดตัวอยู่บนกำแพงหินโบราณ ลานภายในก้องกังวานด้วยเสียงฝีเท้าของทหารยาม ขณะที่กลิ่นฝนบนก้อนอิฐผสมผสานกับน้ำหนักของอำนาจที่มีมาอย่างยาวนาน"
 building_angkor_wat_01_destination_desc: "ข้าข้ามทางเดินหินทรายไปยัง [GetBuilding('angkor_wat_01').GetName] ที่ ซึ่งหอคอยของมันดูเหมือนดอกบัวเหนือคูน้ำที่เหมือนกระจก เสาแกะสลักและระเบียงถูกจัดวางอย่างสมมาตร โดยหิน แต่ละก้อนมีภาพเทพเจ้า นางรำ และจังหวะที่ไร้กาลเวลา"
 building_quanzhou_seaport_01_destination_desc: "[GetBuilding('quanzhou_seaport_01').GetName] คึกคักไปด้วยเรือที่ขนถ่ายสินค้าทางการค้าที่ท่าเรือที่วุ่นวาย ขณะที่กะลาสีตะโกนแข่งกับเสียงเชือกและรถเข็น ในขณะที่เจ้าหน้าที่บันทึกสินค้า แต่ละอย่างอย่างพิถีพิถัน จังหวะการค้าที่มั่นคงกำหนดศูนย์กลางชายฝั่งที่พลุกพล่านแห่งนี้"
 building_qianling_mausoleum_01_destination_desc: "ข้ามาถึง [GetBuilding('qianling_mausoleum_01').GetName] ที่ ซึ่งถนนหินทอดขึ้นสู่เนินเขาแห่งสุสานหลวง รูปปั้นม้าและทูตยืนเรียงรายอย่างเงียบสงบ ปกป้องจักรพรรดิถังเกาจงและจักรพรรดินีบูเช็กเทียนภายใต้การโอบกอดอันเคร่งขรึมของโลก"
 building_forbidden_city_01_destination_desc: "ข้าเข้าสู่ [GetBuilding('forbidden_city_01').GetName] ผ่านประตูสีแดงชาดสูงตระหง่าน ที่ ซึ่งหลังคาเคลือบเงาเป็นประกายราวกับแสงแดดบนผิวน้ำ ลานภายใน ล้อมรอบด้วยมังกรแกะสลัก ถูกจัดวางอย่างสมมาตรโดยมีโถงที่เรียงแนวตรงกับบัลลังก์ของจักรพรรดิ"
 building_kaifeng_palace_01_destination_desc: "หมอกยามเช้าของ [GetBuilding('kaifeng_palace_01').GetName] เผยให้เห็นพระราชวังหลวงที่มีคานทาสีอย่างงดงาม กระถางทองสัมฤทธิ์มีไอลอยขึ้นข้างลานกระเบื้อง ขณะที่นักประดิษฐ์ตัวอักษรและเจ้าหนาที่เดินผ่านใต้ระแนงไม้แกะสลัก สะท้อนอำนาจของราชวงศ์ซ่ง"
 building_giant_wild_goose_pagoda_01_destination_desc: "ข้ายืนอยู่หน้า [GetBuilding('giant_wild_goose_pagoda_01').GetName] ซึ่งเป็นศูนย์กลางความรู้เจ็ดชั้นที่สร้างจากอิฐสีเหลืองและมียอดทองสัมฤทธิ์ ซึ่งปกป้องพระไตรปิฎก เป็นสัญลักษณ์ของความศรัทธา การศึกษา และการแลกเปลี่ยนทางวัฒนธรรม"
 building_lingyin_temple_01_destination_desc: "ขณะที่ข้าเข้าใกล้ [GetBuilding('lingyin_temple_01').GetName] ผ่านหุบเขาที่มีหมอกปกคลุมของหางโจว พระพุทธรูปหินมองลงมาจากยอดเขาเฟยไหล ภายในโถงหลัก พระศากยมุนีปิดทององค์ใหญ่เปล่งประกายท่ามกลางธูปและการสวดมนต์"
 building_shaolin_monastery_01_destination_desc: "ข้ามาถึง [GetBuilding('shaolin_monastery_01').GetName] ใกล้ภูเขาซง ที่ ซึ่งพระสงฆ์ฝึกฝนท่ามกลางกลิ่นสนและธูป ผสมผสานการทำสมาธิและศิลปะการต่อสู้เข้าเป็นวินัยที่เป็นจังหวะ"
 building_wudang_mountain_temples_01_destination_desc: "ข้าขึ้นไปตามเส้นทางที่คดเคี้ยวของ [GetBuilding('wudang_mountain_temples_01').GetName] ที่ ซึ่งวัดเกาะติดอยู่กับหน้าผาที่มีหมอกปกคลุม หลังคาทองสัมฤทธิ์และส่องแสงผ่านเมฆขณะที่พระสงฆ์เคลื่อนไหวอย่างเงียบ ๆ ท่ามกลางศาลเจ้าและต้นสน เป็นสถานที่ศักดิ์สิทธิ์ที่สถาปัตยกรรมและธรรมชาติหลอมรวมกัน"
 building_yungang_grottoes_01_destination_desc: "[GetBuilding('yungang_grottoes_01').GetName] เป็นกลุ่มถ้ำที่หน้าผาสีน้ำผึ้งถูกแกะสลักเป็นเขตรักษาพันธุ์สัตว์ป่าหินขนาดใหญ่ ภายในเงาเย็น พระพุทธรูปขนาดมหึมาเรียงรายหันหน้าออก รอยยิ้มอันเงียบสงบของพวกเขามีร่องรอยของสีเก่าจาง ๆ"
 building_leshan_giant_buddha_01_destination_desc: "ข้ายืนอยู่หน้า [GetBuilding('leshan_giant_buddha_01').GetName] ซึ่งแกะสลักลงไปในหน้าผาสีแดงเหนือแม่น้ำที่บรรจบกัน หมอกรวมตัวกันรอบเข่าขนาดมหึมาของพระองค์ และพระสงฆ์ในบริเวณนั้นสวดมนต์เบา ๆ คำอธิษฐานของพวกเขาถูกพัดพาไปโดยสายลมเดียวกับที่ก่อรูปภูเขาศักดิ์สิทธิ์แห่งนี้"
 building_wulingyuan_01_destination_desc: "การเดินทางของข้านำพาข้าผ่านหุบเขาที่ปกคลุมด้วยหมอกของ [GetBuilding('wulingyuan_01').GetName] ที่ ซึ่งเสาหินทรายสูงตระหง่านราวกับทหารยามโบราณเหนือป่าเขียวชอุ่ม น้ำตกที่เหนือจริงไหลลงมาตามหน้าผา และวัดที่ซ่อนอยู่เกาะติดอยู่กับหิ้งหิน"
 building_swahili_port_lamu_destination_desc: "ข้ามาถึง [GetBuilding('swahili_port_lamu').GetName] ที่ ซึ่งบ้านหินปะการังหันหน้าเข้าหาทะเลและเรือลอยไปตามกระแสน้ำ อากาศอบอวลไปด้วยภาษาท้องถิ่น และกลิ่นกานพลูและเกลืออบอวลไปทั่วตรอกซอกซอยแคบ ๆ ที่มีแสงแดดส่องถึง"
 building_swahili_port_pate_destination_desc: "แนวชายฝั่งของ [GetBuilding('swahili_port_pate').GetName] ส่องสว่างจ้าภายใต้แสงแดดตอนเที่ยง ด้วยท่าเรือหินที่วุ่นวายเต็มไปด้วยพ่อค้าตะโกนเรียกลังงาช้างและธัญพืช ต้นอินทผลัมแกว่งไกวอยู่หลังกำแพงท่าเรือ ขณะที่ทั้งเกาะสั่นสะเทือนด้วยเสียงของทะเลอันไกลโพ้น"
 building_swahili_port_mombasa_destination_desc: "[GetBuilding('swahili_port_mombasa').GetName] แผ่ขยายไปตามอ่าวรูปจันทร์เสี้ยว น่านน้ำมีชีวิตชีวาด้วยใบเรือและเสียงตะโกน ป้อมปราการหินเฝ้าดูท่าเรือ ขณะที่ตลาดล้นทะลักไปทางชายฝั่ง หนาแน่นไปด้วยกลิ่นน้ำมันปาล์ม ทองแดง และสัญญาอันไม่หยุดนิ่งของทะเลอันกว้างใหญ่"
 building_swahili_port_zanzibar_destination_desc: "[GetBuilding('swahili_port_zanzibar').GetName] คึกคักไปด้วยกิจกรรมภายใต้เมฆลายขณะที่ข้ามาถึง ด้วยประตูไม้แกะสลักที่นำไปสู่ตรอกซอกซอยที่เต็มไปด้วยแผงขายเครื่องเทศ และเรือต่างประเทศที่จอดเทียบท่าที่ท่าเรือ"
 building_swahili_port_pemba_destination_desc: "[GetBuilding('swahili_port_pemba').GetName] ฮัมเพลงด้วยจุดประสงค์อันเงียบสงบ และกลิ่นกานพลูหนักอึ้งในอากาศ พ่อค้าที่ไม่คุ้นเคยจากชายฝั่งทางเหนือแลกเปลี่ยนเหรียญเงิน ขณะที่เรือเล็กขนถ่ายกระสอบเครื่องเทศที่มุ่งหน้าไปยังตลาดที่ห่างไกล"


 building_koganeyama_mines_destination_desc: "เกาะคินกะเต็มไปด้วยนักขุดผู้ขยันขันแข็งของ [GetBuilding('koganeyama_mines_01').GetName] เพื่อค้นหาผงทองคำอันเลื่องชื่อที่คานายามะ เทพเจ้าแห่งการทำเหมือง ได้ซ่อนไว้ที่นั่น"
 building_tsushima_mines_destination_desc: "ชื่อเสียงของ [GetBuilding('tsushima_mines_01').GetName] หล่อเลี้ยงคนงานเหมืองที่หลั่งไหลเข้ามาอย่างต่อเนื่องทั่วเกาะ เพื่อแปรรูปแร่สีดำและค้นหาสายแร่ใหม่"
 building_sado_mines_destination_desc: "สถานที่อันโดดเดี่ยว อ้างว้าง และสันโดษ แต่ใต้พื้นดิน คนงานเหมืองของ [GetBuilding('sado_mines_01').GetName] กำลังขุดค้นหาขุมทรัพย์ที่ซ่อนอยู่ของเกาะอย่างขะมักเขม้น"
 building_tada_mines_destination_desc: "ท่ามกลางภูเขาที่เต็มไปด้วยป่าไม้ของเซ็ตสึ [GetBuilding('tada_mines_01').GetName] ก้องไปด้วยอุตสาหกรรมอันขวักไขว่ของนักขุดทองแดง ซึ่งกำลังดึงเอาความมั่งคั่งที่ซ่อนอยู่ของผืนดินออกมา"
 building_mozu_tombs_destination_desc: "[GetBuilding('mozu_tombs').GetName] เป็นสิ่งมหัศจรรย์ที่น่าสงสัย ว่ากันว่าเป็นที่ประทับของจักรพรรดิแห่งยุคเก่า สุสานเนินดินที่น่าประทับใจ พร้อมคูน้ำรูปรูปรูกุญแจ กำหนดรูปแบบภูมิทัศน์ทางกายภาพพอ ๆ กับภูมิทัศน์ทางวิญญาณ"
 building_trosky_castle_01_destination_desc: "[GetBuilding('trosky_castle_01').GetName] อันยิ่งใหญ่ถูกสร้างขึ้นระหว่างแนวหินบะซอลต์ขนาดยักษ์สองแห่ง ซึ่งผู้อาวุโสเล่าขานกันว่าเป็นภูเขาไฟที่หลับใหล แม้ชื่อของมันจะแปลว่า 'ซากปรักหักพัง' อย่างประชดประชันเนื่องจากรูปลักษณ์ของหิน แต่มันก็หาได้เป็นเช่นนั้นไม่"
 
 legendary_watchtower_destination_desc: "[GetBuilding('legendary_watchtower').GetName] ตั้งตระหง่านสูง สำรวจดินแดนด้วยสายตาที่ไม่สั่นคลอน โครงสร้างอันน่าเกรงขาม สัญญาณที่มองเห็นได้ไกลหลายไมล์ ตั้งตระหง่านเป็นเครื่องพิสูจน์ถึงความระแวดระวังของผู้สร้าง ไม่เพียง แต่ทำหน้าที่เป็นจุดชมวิวเท่านั้น แต่ยังเป็นสัญลักษณ์ของการป้องกันผู้ใดก็ตามที่กล้าคุกคามความสงบสุขของอาณาจักร"
 legendary_hunting_ground_destination_desc: "[GetBuilding('legendary_hunting_lodge').GetName] เป็นอาณาจักรที่ความป่าเถื่อนครอบครองสูงสุด พื้นที่อันกว้างใหญ่ เต็มไปด้วยพืชและสัตว์หลากหลายชนิด เป็นสถานที่ศักดิ์สิทธิ์อันบริสุทธิ์สำหรับศิลปะอันสูงส่งของการล่าสัตว์ ที่นี่ ประเพณีและธรรมชาติผสมผสานกัน มอบประสบการณ์ที่ท้าทาย แต่คุ้มค่าสำหรับผู้ที่ต้องการทดสอบทักษะของตนกับถิ่นทุรกันดาร"
 legendary_palace_destination_desc: "ห่อหุ้มด้วยความยิ่งใหญ่ [GetBuilding('legendary_palace').GetName] เป็นผลงานชิ้นเอกทางสถาปัตยกรรมที่ดึงดูดทุกคนที่เข้ามาในอาณาเขต ห้องโถงและสวนอันหรูหราเป็นเครื่องพิสูจน์ถึงจุดสูงสุดของความสำเร็จทางศิลปะ พระราชวังแห่งนี้ ศูนย์กลางแห่งอำนาจและความงาม สร้างแรงบันดาลใจให้เกิดความยำเกรงและความพิศวงในใจของผู้มาเยือน"
 legendary_statue_destination_desc: "[GetBuilding('legendary_statue').GetName] ตั้งตระหง่านเป็นเครื่องบรรณาการอันเป็นอมตะต่อความกล้าหาญและคุณธรรมที่มันเป็นตัวแทน แกะสลักจากหิน แต่เปี่ยมไปด้วยจิตวิญญาณแห่งตำนาน ดึงดูดสายตาของทุกคนที่ผ่านไปมา เป็นจุดศูนย์กลางของความภาคภูมิใจและแรงบันดาลใจ รวบรวมความทรงจำและความปรารถนาร่วมกันของผู้คน"
 legendary_shrine_destination_desc: "ตั้งอยู่ในความเงียบสงบ [GetBuilding('legendary_shrine').GetName] เป็นโอเอซิสศักดิ์สิทธิ์ที่ดึงดูดทั้งผู้ศรัทธาและผู้ที่อยากรู้อยากเห็น เป็นสถานที่แห่งการไตร่ตรองและความศรัทธา ที่ ซึ่งพิธีกรรมและคำอธิษฐานสะท้อนกับฉากหลังของกาลเวลา ศาลเจ้าแห่งนี้มอบการปลอบประโลมและการเชื่อมต่อกับสิ่งศักดิ์สิทธิ์ ทำหน้าที่เป็นสะพานเชื่อมระหว่างโลกและสวรรค์"
 building_generic_destination_desc: "เมื่อข้าพเจ้ามาถึงสถานที่แห่งนี้ ลักษณะเฉพาะตัวและความรู้สึกถึงประวัติศาสตร์ที่อบอวลอยู่ก็ปรากฏชัดในทันที มันตั้งตระหง่านเป็นเครื่องพิสูจน์ถึงมรดกอันยั่งยืนของดินแดนนี้ และทุกแง่มุมของสถานที่แห่งนี้บอกเล่าเรื่องราวที่รอการค้นพบ"

 
 building_castle_arrival_01_desc: "ความตื่นเต้นของข้าพเจ้าเพิ่มขึ้นเมื่อเข้าใกล้ [location.GetTitle.GetName] โอกาสที่จะได้เห็นความงดงามของมัน ทำให้ข้าพเจ้าเต็มไปด้วยความคาดหวัง"
 building_castle_arrival_02_desc: "เมื่อเข้าใกล้ [location.GetTitle.GetName] หัวใจของข้าพเจ้าเต้นแรงด้วยความตื่นเต้นที่จะได้สำรวจตำนานที่ประดิษฐานอยู่ภายในกำแพง"
 building_castle_arrival_03_desc: "เมื่อ [location.GetTitle.GetName] ปรากฏแก่สายตา ความรู้สึกของการผจญภัยก็ก่อตัวขึ้นในตัวข้าพเจ้า"
 building_castle_arrival_04_desc: "ภาพของ [location.GetTitle.GetName] ทำให้ข้าพเจ้าเต็มไปด้วยความยำเกรงและความอยากรู้อยากเห็นอย่างยิ่งเกี่ยวกับเรื่องราวที่มันเก็บงำไว้"
 building_castle_arrival_05_desc: "เมื่อเข้าใกล้ [location.GetTitle.GetName] ข้าพเจ้ากระตือรือร้นที่จะค้นพบเรื่องราวที่มันได้เห็นมาตลอดหลายยุคหลายสมัย"
 building_city_arrival_01_desc: "เมื่อมาถึง [location.GetTitle.GetName] ข้าพเจ้าตื่นเต้นกับความคิดที่จะได้ค้นพบอัญมณีที่ซ่อนอยู่และวัฒนธรรมที่มีชีวิตชีวา"
 building_city_arrival_02_desc: "ความเร่งรีบและวุ่นวายของ [location.GetTitle.GetName] ทำให้ข้าพเจ้ามีชีวิตชีวา ขณะที่ข้าพเจ้ารอคอยที่จะดื่มด่ำกับถนนที่มีชีวิตชีวา"
 building_city_arrival_03_desc: "เมื่อข้าพเจ้าเข้าสู่ [location.GetTitle.GetName] ความรู้สึกพิศวงก็เข้าครอบงำข้าพเจ้า ตื่นเต้นที่จะได้สำรวจสมบัติทางวัฒนธรรมและตรอกซอกซอยอันเก่าแก่"
 building_city_arrival_04_desc: "เมื่อก้าวเข้าสู่ [location.GetTitle.GetName] ข้าพเจ้ากระตือรือร้นที่จะได้สัมผัสกับตลาดที่คึกคักและสถานที่สำคัญทางประวัติศาสตร์"
 building_city_arrival_05_desc: "พลังงานของ [location.GetTitle.GetName] ห่อหุ้มข้าพเจ้า จุดประกายความอยากรู้อยากเห็นของข้าพเจ้าที่จะเจาะลึกเข้าไปในชีวิตที่มีชีวิตชีวาและอดีตอันยาวนาน"
 building_temple_arrival_01_desc: "เมื่อก้าวเข้าสู่ [location.GetTitle.GetName] ข้าพเจ้าคาดหวังอย่างกระตือรือร้นถึงสิ่งมหัศจรรย์ทางจิตวิญญาณที่อยู่ภายใน"
 building_temple_arrival_02_desc: "รัศมีอันเงียบสงบของ [location.GetTitle.GetName] ดึงดูดข้าพเจ้า สัญญาถึงการเดินทางสู่ดินแดนแห่งความสงบและภูมิปัญญาโบราณ"
 building_temple_arrival_03_desc: "ขณะที่ข้าพเจ้าเข้าใกล้ [location.GetTitle.GetName] ความรู้สึกเคารพอย่างลึกซึ้งก็เข้าครอบงำ คาดหวังถึงข้อมูลเชิงลึกอันศักดิ์สิทธิ์ที่มันมอบให้"
 building_temple_arrival_04_desc: "เมื่อเข้าสู่ [location.GetTitle.GetName] ข้าพเจ้ารู้สึกพร้อมที่จะสัมผัสกับความลึกซึ้งทางจิตวิญญาณและความงามที่มันเก็บงำไว้"
 building_temple_arrival_05_desc: "[location.GetTitle.GetName] ตั้งตระหง่านอยู่เบื้องหน้าข้าพเจ้า สถานที่ศักดิ์สิทธิ์แห่งศรัทธา และข้าพเจ้ากระตือรือร้นที่จะดื่มด่ำกับบรรยากาศอันศักดิ์สิทธิ์"
 building_tribal_holding_arrival_01_desc: "ขณะที่ข้าพเจ้าเข้าใกล้ [location.GetTitle.GetName] ความรู้สึกและจิตวิญญาณของชุมชนที่ใกล้ชิดก็ต้อนรับข้าพเจ้า"
 building_tribal_holding_arrival_02_desc: "บรรยากาศที่มีชีวิตชีวาของ [location.GetTitle.GetName] ต้อนรับข้าพเจ้าด้วยสีสันสดใสและการแสดงออกทางวัฒนธรรมอันรุ่มรวย"
 building_tribal_holding_arrival_03_desc: "เมื่อเข้าใกล้ [location.GetTitle.GetName] การผสมผสานที่กลมกลืนกันของธรรมชาติและประเพณีก็ปรากฏชัดในทันที"
 building_tribal_holding_arrival_04_desc: "เสน่ห์แบบชนบทของ [location.GetTitle.GetName] ทำให้ข้าพเจ้าเต็มไปด้วยความคาดหวังและความกระตือรือร้นที่จะเรียนรู้"
 building_tribal_holding_arrival_05_desc: "เมื่อเข้าสู่ [location.GetTitle.GetName] ข้าพเจ้าตกตะลึงกับความเรียบง่ายและความอบอุ่นของชุมชนท้องถิ่น"

 
 building_religious_learning_outro_01_desc: "การเยือนครั้งนี้ได้เพิ่มพูนความเข้าใจของข้าพเจ้าเกี่ยวกับความเชื่อและการปฏิบัติทางจิตวิญญาณที่หล่อหลอมอารยธรรม"
 building_religious_learning_outro_02_desc: "การสำรวจสถานที่ศักดิ์สิทธิ์แห่งนี้ได้เพิ่มพูนความเข้าใจของข้าพเจ้าเกี่ยวกับผลกระทบอันลึกซึ้งของศรัทธาต่อประวัติศาสตร์และวัฒนธรรมของมนุษย์"
 building_religious_learning_outro_03_desc: "การเดินทางของข้าพเจ้าที่นี่ได้ให้ความกระจ่างเกี่ยวกับวิธีการที่หลากหลาย ซึ่งความศรัทธาทางศาสนาได้รับการแสดงออกและเคารพนับถือตลอดเวลา"
 building_diplomatic_learning_outro_01_desc: "ประสบการณ์นี้ได้ขยายมุมมองของข้าพเจ้าเกี่ยวกับความซับซ้อนและความแตกต่างของความสัมพันธ์ทางการทูตและศิลปะการปกครอง"
 building_diplomatic_learning_outro_02_desc: "ข้าพเจ้าจากไปด้วยความซาบซึ้งมากขึ้นในศิลปะอันซับซ้อนของการทูตและความละเอียดอ่อนของพันธมิตรทางการเมือง"
 building_diplomatic_learning_outro_03_desc: "เวลาของข้าพเจ้าที่นี่ได้เพิ่มพูนความเข้าใจของข้าพเจ้าเกี่ยวกับความสมดุลอันละเอียดอ่อนของอำนาจและบทบาทสำคัญของการทูตในการกำหนดประวัติศาสตร์"
 building_martial_learning_outro_01_desc: "ความกล้าหาญทางทหารและข้อมูลเชิงลึกทางยุทธศาสตร์ที่ได้รับจากการเยือนครั้งนี้ได้ขยายความเข้าใจของข้าพเจ้าเกี่ยวกับการสงครามอย่างลึกซึ้ง"
 building_martial_learning_outro_02_desc: "การสำรวจครั้งนี้ได้ให้บทเรียนอันมีค่าเกี่ยวกับยุทธวิธีทางทหารและศิลปะแห่งสงคราม ซึ่งสำคัญสำหรับผู้นำทุกคน"
 building_martial_learning_outro_03_desc: "ข้าพเจ้าได้รับความรู้อย่างมากเกี่ยวกับกลยุทธ์การรบและความสำคัญของทักษะทางทหารในการกำหนดเส้นทางประวัติศาสตร์"
 building_economic_learning_outro_01_desc: "การเยือนของข้าพเจ้าได้เพิ่มพูนความเข้าใจของข้าพเจ้าเกี่ยวกับหลักการทางเศรษฐกิจและบทบาทสำคัญที่การค้ามีต่อความเจริญรุ่งเรืองของชาติ"
 building_economic_learning_outro_02_desc: "การสำรวจสถานที่แห่งนี้ได้เพิ่มพูนความเข้าใจของข้าพเจ้าเกี่ยวกับความซับซ้อนของการพัฒนาเศรษฐกิจ"
 building_economic_learning_outro_03_desc: "ข้าพเจ้าจากไปด้วยมุมมองที่สมบูรณ์ยิ่งขึ้นเกี่ยวกับความสำคัญอย่างยิ่งของความเข้าใจทางเศรษฐกิจในการค้ำจุนอาณาจักรที่ทรงพลัง"
 building_man_made_wonder_learning_outro_01_desc: "ความเฉลียวฉลาดและงานฝีมือที่ได้เห็นที่นี่ได้ทิ้งความประทับใจไม่รู้ลืมเกี่ยวกับความคิดสร้างสรรค์และความทะเยอทะยานของมนุษย์ไว้กับข้าพเจ้า"
 building_man_made_wonder_learning_outro_02_desc: "สิ่งมหัศจรรย์แห่งการก่อสร้างนี้ได้ขยายความซาบซึ้งของข้าพเจ้าต่อความสูงส่งของความสำเร็จที่สามารถบรรลุได้ผ่านความพยายามของมนุษย์"
 building_man_made_wonder_learning_outro_03_desc: "ข้าพเจ้ากำลังจากไปด้วยแรงบันดาลใจจากมรดกอันน่าทึ่งของความเชี่ยวชาญทางสถาปัตยกรรม ซึ่งตั้งตระหง่านเป็นเครื่องพิสูจน์ถึงศักยภาพของเรา"
 building_natural_wonder_learning_outro_01_desc: "ความงามและความยิ่งใหญ่อันน่าทึ่งของสิ่งมหัศจรรย์ทางธรรมชาตินี้ได้เพิ่มพูนความซาบซึ้งของข้าพเจ้าต่อความงดงามของโลกอย่างลึกซึ้ง"
 building_natural_wonder_learning_outro_02_desc: "การเยือนครั้งนี้ได้ปลูกฝังความรู้สึกยำเกรงอย่างลึกซึ้งต่อโลกธรรมชาติและสิ่งมหัศจรรย์มากมายนับไม่ถ้วนไว้ในตัวข้าพเจ้า"
 building_natural_wonder_learning_outro_03_desc: "ข้าพเจ้ากำลังจากไปด้วยความเคารพที่ได้รับการฟื้นฟูต่อพลังและความงามอันน่าเกรงขามของธรรมชาติ และความสามารถในการกำหนดโลกและมุมมองของเรา"

 building_exploration_01_desc: "ด้วยความคาดหวังอย่างกระตือรือร้น ข้าพเจ้าเริ่มการสำรวจ!"
 building_exploration_02_desc: "ด้วยดวงตาที่เบิกกว้างด้วยความอยากรู้อยากเห็น ข้าพเจ้าออกเดินทางอย่างกระตือรือร้น!"
 building_exploration_03_desc: "เต็มไปด้วยความตื่นเต้น ข้าพเจ้าออกเดินทางเพื่อเจาะลึกเข้าไปในสิ่งมหัศจรรย์ของสถานที่แห่งนี้!"
 building_exploration_04_desc: "ด้วยความรู้สึกพิศวง ข้าพเจ้าเคลื่อนที่เพื่อสำรวจทุกซอกทุกมุม!"
 building_exploration_05_desc: "ข้าพเจ้าก้าวไปข้างหน้าด้วยความตื่นเต้นของการค้นพบ กระตือรือร้นที่จะซึมซับความรู้ที่สถานที่แห่งนี้สัญญาไว้!"
 building_exploration_06_desc: "ด้วยความกระตือรือร้น ข้าพเจ้าเริ่มการสำรวจ!"
 building_exploration_07_desc: "ด้วยหัวใจที่เปี่ยมสุข ข้าพเจ้าเริ่มการเดินทางผ่านสถานที่แห่งนี้!"
 building_exploration_08_desc: "เต็มไปด้วยความรู้สึกของการผจญภัย ข้าพเจ้าออกเดินทางเพื่อสำรวจสถานที่แห่งนี้!"
 building_exploration_09_desc: "ข้าพเจ้าเริ่มการสำรวจอย่างกระตือรือร้น ทุกย่างก้าวเต็มไปด้วยความคาดหวัง!"
 building_exploration_10_desc: "ด้วยจิตวิญญาณแห่งความกระตือรือร้น ข้าพเจ้าเดินท่องไปในสถานที่แห่งนี้!"
 building_exploration_11_desc: "ข้าพเจ้าก้าวไปข้างหน้าด้วยจิตวิญญาณแห่งการผจญภัย กระตือรือร้นที่จะสำรวจประวัติศาสตร์อันรุ่มรวยของสถานที่แห่งนี้!"
 building_exploration_12_desc: "ด้วยย่างก้าวที่เปี่ยมสุข ข้าพเจ้าเริ่มสำรวจ!"
 building_exploration_13_desc: "ข้าพเจ้าออกเดินทางรอบสถานที่แห่งนี้อย่างกระตือรือร้น คาดหวังถึงการค้นพบที่รออยู่ข้างหน้า!"
 building_exploration_14_desc: "เต็มไปด้วยความตื่นเต้น ข้าพเจ้าผจญภัยเข้าไปในสถานที่แห่งนี้ รอคอยภาพที่มันสัญญาไว้!"
 building_exploration_15_desc: "ข้าพเจ้าเริ่มการสำรวจด้วยความรู้สึกยำเกรง กระตือรือร้นที่จะเรียนรู้จากมรดกของสถานที่แห่งนี้!"
 building_exploration_16_desc: "ด้วยความรู้สึกคาดหวังอย่างกระตือรือร้น ข้าพเจ้าเดินท่องไป พร้อมที่จะหลงใหลในความงามของสถานที่แห่งนี้!"
 building_exploration_17_desc: "ข้าพเจ้าเริ่มการสำรวจด้วยความรู้สึกตื่นเต้น!"
 building_exploration_18_desc: "ข้าพเจ้าเริ่มการเดินทางผ่านสถานที่แห่งนี้ด้วยความรู้สึกอยากรู้อยากเห็นอย่างกระตือรือร้น!"
 building_exploration_19_desc: "ด้วยหัวใจที่กระตือรือร้น ข้าพเจ้าออกเดินทางเพื่อสำรวจ!"
 building_exploration_20_desc: "ข้าพเจ้าเริ่มการสำรวจด้วยความกระตือรือร้นที่จะได้สัมผัสกับความงดงามที่สถานที่แห่งนี้รวบรวมไว้!"

 travel_destinations.1000.t: "ทิวทัศน์แห่ง [location.GetNameNoTooltip]"
 travel_destinations.1000.desc: "[location.Custom('GetTouristHoldingIntro')]\n\n[location.Custom('GetSpecialBuildingTouristDescriptor')]\n\n[location.Custom('GetTouristStartEventOutro')]"
 
 the_with_space: ""
 travel_start_event.1090.t_activity_roaming: "$activity_roaming$: บนเส้นทางอีกครั้ง"
 travel_start_event.1090.t_activity_journey: "การเดินทาง: สู่ [location.Custom('GetSpecialBuildingPrefix')][location.GetHolding.GetSpecialBuildingType.GetNameNoTooltip]!"
 travel_start_event.1090.t_activity_survey: "$activity_survey$: ตรวจตราดินแดน"
 travel_start_event.1000.norwegian: "Ut på tur, aldri sur!"
 travel_start_event.1090.desc_activity_roaming: "ในที่สุดเส้นทางเปิดก็อยู่เบื้องหน้าข้าพเจ้า! ในไม่ช้าข้าพเจ้าจะได้เหยียบย่างใน [location.Custom('TerrainTypeProvincePrefix')] [location.Custom('TerrainTypeProvince')] แห่ง [location.GetName] อันงดงาม\n\nโอ้ ข้าพเจ้าปรารถนา [location.Custom('GetProvinceFoliageDesc')] และ [location.Custom('get_region_flower_type_plural')] ที่หอมหวานของมันเพียงใด! ที่จะได้เห็น [location.Custom('GetRandomRegionalWildDaytimeBirdProvince')] บินผ่านท้องฟ้าเปิดเหนือข้าพเจ้า!\n\nข้าพเจ้าต้องออกเดินทางแล้ว!"
 travel_start_event.1090.desc_activity_journey: "เส้นทางสู่ [location.GetName] นั้นยาวไกล แต่ข้าพเจ้ารอไม่ไหวที่จะค้นพบความลับของ [location.Custom('GetSpecialBuildingPrefix')][location.GetHolding.GetSpecialBuildingType.GetName] และชาว [location.GetCulture.GetCollectiveNoun] [location.GetCounty.GetTitle.GetAdjective] ผู้ [location.GetTitle.GetHolder.Custom('ComplimentAdjective')] ที่อาศัยอยู่ที่นั่น! [ROOT.Char.Custom('IntentInitialEventDesc')]\n\nข้าพเจ้าหวังว่าข้าพเจ้าจะอยู่ที่นั่นแล้ว เราต้องรีบเร่ง!"
 knowledge_hoarding_1: "ข้าพเจ้าจะจดบันทึกอย่างไม่สิ้นสุดและซึมซับความรู้ทุกส่วนที่ข้าพเจ้าหาได้"
 knowledge_hoarding_2: "ข้าพเจ้าจะรวบรวมบันทึกอย่างละเอียดและซึมซับทุกเศษเสี้ยวของปัญญาที่มีอยู่"
 knowledge_hoarding_3: "ข้าพเจ้าตั้งใจที่จะรวบรวมบันทึกที่ครอบคลุมและบริโภคทุกส่วนของข้อมูลเชิงลึกที่หาได้"
 curiosity_1: "ข้าพเจ้าคาดหวังอย่างกระตือรือร้นถึงการเผชิญหน้ากับคนท้องถิ่น หวังว่าจะได้ดื่มด่ำกับเรื่องราวและประเพณีของพวกเขา"
 curiosity_2: "โอกาสที่จะได้เชื่อมต่อกับชุมชนท้องถิ่น เรียนรู้จากประสบการณ์ของพวกเขา ทำให้ข้าพเจ้าเต็มไปด้วยความสุข"
 curiosity_3: "ความตื่นเต้นของข้าพเจ้าเพิ่มขึ้นเมื่อคิดถึงการได้พบปะผู้ที่เรียกสถานที่แห่งนี้ว่าบ้าน แบ่งปันเรื่องราวและปัญญา"
 spread_legend_1: "ข้าพเจ้าจะถักทอเรื่องราวของ [ROOT.Char.GetPromotedLegend.GetName] เข้ากับโครงสร้างของสถานที่แห่งนี้ ทิ้งร่องรอยไว้ในประวัติศาสตร์"
 spread_legend_2: "การเดินทางของข้าพเจ้ายังเป็นภารกิจ: เพื่อเผยแพร่ชื่อเสียงของ [ROOT.Char.GetPromotedLegend.GetName] ทำให้เป็นส่วนหนึ่งของตำนานท้องถิ่น"
 spread_legend_3: "เป้าหมายของข้าพเจ้าคือการได้เห็น [ROOT.Char.GetPromotedLegend.GetName] ได้รับการเฉลิมฉลองโดยผู้ที่ข้าพเจ้าพบเจอ ตำนานของมันเติบโตขึ้นทุกครั้งที่เล่าขาน"
 
 travel_start_event.1090.desc_activity_survey: "ถึงเวลาที่ข้าพเจ้าจะจัดการเรื่องต่างๆ ด้วยตนเอง ข้าพเจ้าจะดูแลการทำงานของ [location.GetName] เป็นการส่วนตัว ข้าพเจ้าจะนับ [root_scope.Custom('RegionalFarmAnimal')] ทุกตัว ทุกป้อมปราการ ทุกดาบ และทุกกระสอบธัญพืช!\n\nอาณาจักรของข้าพเจ้าจะเป็นอาณาจักรที่มีการจัดการดีที่สุด – ไปกันเถอะ!"
