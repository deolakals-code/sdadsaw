 travel_events_oltner_2.1170.t: "เส้นทางแห่งความเป็นอริ"
 travel_events_oltner_2.1170.desc: "ขณะเดินทางผ่านภูมิประเทศขรุขระของ [location.GetName] ความท้าทายก็เกิดขึ้นเมื่อ [location.Custom('GetPrecariousTerrainFeature')]\n\n[ROOT.Char.Custom2('RelationToMeShort', entourage_member_1 )]ของข้า [entourage_member_1.GetFirstName] และ [ROOT.Char.Custom2('RelationToMeShort', entourage_member_2 )]ของข้า [entourage_member_2.GetFirstName] เริ่มโต้เถียงกันเกี่ยวกับวิธีที่ดีที่สุดในการข้ามเส้นทางอันตราย "[entourage_member_1.GetFirstNameNoTooltip] ข้อเสนอของท่านมันบ้าบิ่น!" [entourage_member_2.GetFirstNameNoTooltip] อุทาน แสดงความหงุดหงิดอย่างเห็นได้ชัด [entourage_member_1.GetFirstNameNoTooltip] โต้กลับ "และของท่านก็ขี้ขลาด!"\n\nดูเหมือนว่าคณะผู้ติดตามของข้ากำลังถึงทางตัน..."
 travel_events_oltner_2.1170.a: ""ฟังข้า พวกท่านต้อง #EMP ทำงานร่วมกัน#!""
 travel_events_oltner_2.1170.b: ""[entourage_member_1.GetFirstNameNoTooltip] พูดถูก เราจะโอ้เอ้ไม่ได้""
 travel_events_oltner_2.1170.c: ""ให้เราทำตามความระมัดระวังตามที่ [entourage_member_2.GetFirstNameNoTooltip] แนะนำ""
 travel_events_oltner_2.1170.d: ""โอ้ [ROOT.Char.GetFaith.HighGodName] ที่รัก ช่างเป็นเด็กๆ เสียจริง...""
