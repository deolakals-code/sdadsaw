 travel_events_oltner_2.1200.t: "เทวดาผู้พิทักษ์"
 travel_events_oltner_2.1200.desc: "ขณะเดินทางผ่าน [location.Custom('TerrainTypeProvince')] ของ [location.GetName] [ROOT.Char.Custom2('RelationToMeShort', entourage_member_2 )]ของข้า [entourage_member_2.GetFirstName] [location.Custom('GetRandomHazardAndRescue')] [ROOT.Char.Custom2('RelationToMeShort', entourage_member_1 )]ของข้า [entourage_member_1.GetFirstName]\n\n"[entourage_member_2.GetFirstNameNoTooltip] ท่านต้องระวังตัวให้มากกว่านี้" [entourage_member_1.GetFirstNameNoTooltip] ตักเตือน ความกังวลปรากฏชัดในน้ำเสียงของ[entourage_member_1.GetHerHis] [entourage_member_2.GetFirstNameNoTooltip] ยิ้มอย่างเขินอายและขอบคุณเป็นการตอบแทน "ขอบคุณ ข้าติดหนี้บุญคุณท่าน!""
 travel_events_oltner_2.1200.a: "ช่างคิดเร็วเสียจริง [entourage_member_1.GetFirstNameNoTooltip]!"
 travel_events_oltner_2.1200.b: "[entourage_member_2.GetFirstNameNoTooltip] ท่านไม่ได้ติดหนี้บุญคุณ[entourage_member_1.GetHerHim]เลย"
 travel_events_oltner_2.1200.c: "ให้เราเคลื่อนที่ด้วยความระมัดระวังสูงสุดสักพัก"
 travel_events_oltner_2.1200.d: "อั่ก เราต้องรีบไป!"
 trap_scenario_falling_net: "เกือบเดินเข้าไปในกับดักตาข่ายที่ซ่อนอยู่ด้านบน แต่ถูกดึงออกไปอย่างรวดเร็วโดย"
 trap_scenario_pit_trap: "ก้าวเข้าไปใกล้อย่างอันตรายกับหลุมพรางที่ซ่อนอยู่ แต่ถูกคว้าตัวไว้ทันเวลาโดย"
 trap_scenario_snare_trap: "เกือบจะเหยียบกับดักบ่วง แต่ได้รับการเตือนทันท่วงทีโดย"
 trap_scenario_river_current: "เกือบถูกกระแสน้ำใต้น้ำที่ซ่อนอยู่พัดพาไป แต่ได้รับการช่วยเหลืออย่างรวดเร็วโดย"
 trap_scenario_thin_ice: "กำลังจะก้าวลงบนแผ่นน้ำแข็งบางๆ เหนือบ่อน้ำแข็ง แต่ได้รับการเตือนและรั้งตัวไว้อย่างเร่งด่วนโดย"
 trap_scenario_rockslide: "เกือบติดอยู่ในหินถล่ม แต่ถูกลากไปยังที่ปลอดภัยโดย"
 trap_scenario_snake_nest: "หลบรังงูที่ซ่อนอยู่ได้อย่างหวุดหวิด ด้วยสายตาอันเฉียบคมของ"
 trap_scenario_irrigation_ditch: "หลีกเลี่ยงการตกลงไปในคูชลประทานที่พรางตัวอยู่ได้ ด้วยคำเตือนอันรวดเร็วจาก"
 trap_scenario_quicksand: "เกือบจมลงในทรายดูด แต่ถูกดึงขึ้นมาอย่างรวดเร็วโดย"
 trap_scenario_hunters_snare: "เกือบเดินเข้าไปในบ่วงของนายพราน แต่ถูกหยุดไว้ทันเวลาโดย"
 trap_scenario_wire_trap: "กำลังจะสะดุดกับดักลวดที่ซ่อนอยู่ แต่ได้รับการเตือนอย่างรวดเร็วโดย"
 trap_scenario_pit_of_spikes: "หลบหลุมหนามที่ซ่อนอยู่ได้อย่างหวุดหวิด ด้วยเสียงตะโกนทันเวลาจาก"
 trap_scenario_cliff_edge: "เกือบจะก้าวตกขอบหน้าผาที่ซ่อนอยู่ แต่ถูกคว้าตัวไว้ในวินาทีสุดท้ายโดย"
 trap_scenario_water_hole: "เกือบตกลงไปในหลุมน้ำที่ปกคลุมด้วยต้นกก แต่ได้รับการประคองอย่างรวดเร็วโดย"
 trap_scenario_burrow_of_vipers: "เกือบจะรบกวนโพรงอสรพิษที่ซ่อนอยู่ แต่ได้รับการเตือนทันเวลาโดย"
 trap_scenario_thorny_brush: "เกือบพันตัวเข้ากับพุ่มไม้หนามที่พรางตัวอยู่ในหญ้า แต่รอดมาได้ด้วยความตื่นตัวของ"
 trap_scenario_snow_laden_branch: "กำลังจะเดินใต้กิ่งไม้ที่อ่อนแอและเต็มไปด้วยหิมะ แต่ถูกดึงกลับอย่างเร่งรีบโดย"
 trap_scenario_water_covered_ditch: "เกือบสะดุดลงไปในคูลึกที่ปกคลุมด้วยน้ำ แต่ถูกกระชากกลับโดย"
 friend_praised: "[CHARACTER.GetShortUIName|U] ชื่นชมความคิดอันรวดเร็วของ [TARGET_CHARACTER.GetShortUINamePossessive] ต่อหน้าสาธารณชน"
 friend_praised_corresponding: "[TARGET_CHARACTER.GetShortUIName|U] ชื่นชมความคิดอันรวดเร็วของ [CHARACTER.GetShortUINamePossessive] ต่อหน้าสาธารณชน"
 avoiding_traps_modifier: "หลีกเลี่ยงกับดัก"
 avoiding_traps_modifier_desc: "คณะผู้ติดตามนี้กำลังหลีกเลี่ยงกับดักทุกวิถีทาง"

 travel_events_oltner_2.1210.t: "เพลงขับกล่อมยามค่ำคืน"
 travel_events_oltner_2.1210.desc: "ใต้ท้องฟ้าที่เต็มไปด้วยดาวของ [location.GetName] ค่ายพักได้รับการแสดงที่ไม่คาดคิด [ROOT.Char.Custom2('RelationToMeShort', entourage_member_2 )]ของข้า [entourage_member_2.GetFirstName] ทำให้ทุกคนประหลาดใจด้วยบทเพลงอันซาบซึ้ง น้ำเสียงของ[entourage_member_2.GetHerHis]สะท้อนคำชื่นชมต่อ [ROOT.Char.Custom2('RelationToMeShort', entourage_member_1 )]ของข้า [entourage_member_1.GetFirstName]\n\n[entourage_member_1.GetFirstName] ตั้งใจฟัง แสดงอาการประหม่าอย่างเห็นได้ชัด เมื่อเพลงจบลง การยอมรับอย่างเงียบๆ ก็ส่งผ่านระหว่างพวกเขาทั้งสอง"
 travel_events_oltner_2.1210.a: "หากมีอะไรเกิดขึ้นระหว่างสองคนนั้น ข้าจะหาคำตอบให้ได้..."
 travel_events_oltner_2.1210.b: ""[entourage_member_2.GetFirstNameNoTooltip] โลกควรได้ยินท่านเล่นดนตรีและขับร้อง!""
 travel_events_oltner_2.1210.c: ""ท่าน... ท่านช่วยสอนข้าเล่นแบบนั้นได้หรือไม่?""
 travel_events_oltner_2.1210.d: ""อา ช่างเป็นบทเพลงที่ไพเราะเสียนี่กระไร""
 travel_events_oltner_2.1210.a.success: "ท่านพบบางอย่าง"
 travel_events_oltner_2.1210.a.failure: "ไม่มีอะไรให้ค้นพบ"
 something_happens: "มีบางอย่างเกิดขึ้น"
 travel_events_oltner_2.1210.c.success: "ท่านเรียนรู้วิธีเล่น อย่างน้อยก็เล็กน้อย"
 travel_events_oltner_2.1210.c.failure: "ท่านไม่สามารถเรียนรู้ได้มากนัก"
 lover_serenaded_on_the_road: "[CHARACTER.GetShortUIName|U] ขับกล่อม [TARGET_CHARACTER.GetShortUIName] อย่างโรแมนติกใน [PROVINCE.GetName] ในฐานะส่วนหนึ่งของคณะผู้ติดตามของ [TARGET_CHARACTER_2.GetFirstNamePossessive]"
 lover_serenaded_on_the_road_corresponding: "[TARGET_CHARACTER.GetShortUIName|U] ขับกล่อม [CHARACTER.GetShortUIName] อย่างโรแมนติกใน [PROVINCE.GetName] ในฐานะส่วนหนึ่งของคณะผู้ติดตามของ [TARGET_CHARACTER_2.GetFirstNamePossessive]"

 travel_events_oltner_2.1220.t: "จุดจบของคู่แข่ง"
 travel_events_oltner_2.1220.desc: "ในยามวิกาล ณ ค่ายพักของเราใกล้ [location.GetName] ข้าก้าวออกมาอย่างเงียบๆ เสียงอะไรนั่น?\n\nตอนนั้นเองที่ข้าเห็น: [location.Custom('GetTerrainMurderMethod')|U]\n\n[entourage_member_1.GetFirstNameNoTooltip] กวาดตามองไปรอบๆ อย่างรวดเร็ว โดยไม่รู้ว่าข้าเห็นทุกอย่างแล้ว"
 travel_events_oltner_2.1220.a: "หืม เทคนิคน่าสนใจ"
 travel_events_oltner_2.1220.b: ""#EMP ทหารยาม!#!""
 travel_events_oltner_2.1220.c: "ข้าเห็น... ไม่มีอะไร..."
 assassination_scenario_desert: "[player_scope.Custom2('RelationToMeShort', entourage_member_1 )]ของข้า [entourage_member_1.GetFirstName] เข้าใกล้ [player_scope.Custom2('RelationToMeShort', entourage_member_2 )]ของข้า [entourage_member_2.GetFirstName] อย่างเงียบๆ ซึ่งกำลังหลับอยู่ใต้ต้นปาล์ม ทันใดนั้น [entourage_member_1.GetFirstNameNoTooltip] ก็ฝังมือของ[entourage_member_1.GetHerHis]ลงในทรายรอบคอของ [entourage_member_2.GetFirstNamePossessiveNoTooltip] ทำให้[entourage_member_2.GetHerHim]ขาดอากาศหายใจในความเงียบ"
 assassination_scenario_desert_mountains: "[player_scope.Custom2('RelationToMeShort', entourage_member_1 )]ของข้า [entourage_member_1.GetFirstName] เคลื่อนตัวอย่างลับๆ ไปทาง [player_scope.Custom2('RelationToMeShort', entourage_member_2 )]ของข้า [entourage_member_2.GetFirstName] ซึ่งหลับอยู่ใกล้ขอบหน้าผา ด้วยการผลักอย่างรวดเร็ว [entourage_member_1.GetFirstName] ส่ง [entourage_member_2.GetFirstNameNoTooltip] ร่วงลงไปตามไหล่เขาที่สูงชัน"
 assassination_scenario_drylands: "[player_scope.Custom2('RelationToMeShort', entourage_member_1 )]ของข้า [entourage_member_1.GetFirstName] ย่องเข้าไปหา [player_scope.Custom2('RelationToMeShort', entourage_member_2 )]ของข้า [entourage_member_2.GetFirstName] ซึ่งกำลังพักผ่อนอยู่ข้างพุ่มไม้แห้ง คว้าก้อนหิน [entourage_member_1.GetFirstNameNoTooltip] ทุบศีรษะของ [entourage_member_2.GetFirstNamePossessiveNoTooltip] ด้วยแรงถึงตาย ไม่ทิ้งร่องรอยใดๆ นอกจากคราบสีคล้ำบนพื้นดิน"
 assassination_scenario_farmlands: "[player_scope.Custom2('RelationToMeShort', entourage_member_1 )]ของข้า [entourage_member_1.GetFirstName] เข้าใกล้ [player_scope.Custom2('RelationToMeShort', entourage_member_2 )]ของข้า [entourage_member_2.GetFirstName] ซึ่งหลับอยู่ใกล้คันไถ ในการกระทำที่รุนแรงและฉับพลัน [entourage_member_1.GetFirstNameNoTooltip] เสียบ [entourage_member_2.GetFirstNameNoTooltip] เข้ากับซี่แหลมของคันไถ ทำให้จบชีวิตอย่างรวดเร็ว"
 assassination_scenario_floodplains: "[player_scope.Custom2('RelationToMeShort', entourage_member_1 )]ของข้า [entourage_member_1.GetFirstName] ย่องเข้าไปหา [player_scope.Custom2('RelationToMeShort', entourage_member_2 )]ของข้า [entourage_member_2.GetFirstName] ริมฝั่งแม่น้ำ ด้วยการผลักอย่างกะทันหัน [entourage_member_1.GetFirstNameNoTooltip] กด [entourage_member_2.GetFirstNameNoTooltip] จมน้ำในสายน้ำขุ่นที่ไหลเชี่ยว"
 assassination_scenario_forest: "[player_scope.Custom2('RelationToMeShort', entourage_member_1 )]ของข้า [entourage_member_1.GetFirstName] เข้าใกล้อย่างเงียบๆ [player_scope.Custom2('RelationToMeShort', entourage_member_2 )]ของข้า [entourage_member_2.GetFirstName] ซึ่งกำลังหลับอยู่ใต้ต้นไม้ ใช้เชือก [entourage_member_1.GetFirstNameNoTooltip] รัดคอ [entourage_member_2.GetFirstNameNoTooltip] อย่างรวดเร็ว ทิ้งให้[entourage_member_2.GetHerHim]แขวนอยู่บนกิ่งไม้"
 assassination_scenario_hills: "[player_scope.Custom2('RelationToMeShort', entourage_member_1 )]ของข้า [entourage_member_1.GetFirstName] ย่องไปหา [player_scope.Custom2('RelationToMeShort', entourage_member_2 )]ของข้า [entourage_member_2.GetFirstName] ซึ่งกำลังงีบหลับอยู่บนทางลาด [entourage_member_1.GetFirstNameNoTooltip] กลิ้ง [entourage_member_2.GetFirstNameNoTooltip] ลงไปตามไหล่เขา ที่ ซึ่งหินแหลมคม ทำให้เสียชีวิตอย่างรวดเร็วและเจ็บปวด"
 assassination_scenario_jungle: "[player_scope.Custom2('RelationToMeShort', entourage_member_1 )]ของข้า [entourage_member_1.GetFirstName] เคลื่อนตัวเข้าหา [player_scope.Custom2('RelationToMeShort', entourage_member_2 )]ของข้า [entourage_member_2.GetFirstName] อย่างเงียบๆ ซึ่งหลับอยู่ใต้ใบไม้หนาทึบ [entourage_member_1.GetFirstNameNoTooltip] ใช้เถาวัลย์รัดคอ [entourage_member_2.GetFirstNameNoTooltip] ทิ้งให้[entourage_member_2.GetHerHim]พันกันยุ่งเหยิงและไร้ชีวิต"
 assassination_scenario_mountains: "[player_scope.Custom2('RelationToMeShort', entourage_member_1 )]ของข้า [entourage_member_1.GetFirstName] ย่องเข้าไปหา [player_scope.Custom2('RelationToMeShort', entourage_member_2 )]ของข้า [entourage_member_2.GetFirstName] ซึ่งกำลังพักผ่อนอยู่ข้างหน้าผาชัน การผลักอย่างแรงและกะทันหันส่ง [entourage_member_2.GetFirstNameNoTooltip] พุ่งลงไปในหุบเหวลึก"
 assassination_scenario_oasis: "[player_scope.Custom2('RelationToMeShort', entourage_member_1 )]ของข้า [entourage_member_1.GetFirstName] เคลื่อนตัวอย่างเงียบๆ ไปทาง [player_scope.Custom2('RelationToMeShort', entourage_member_2 )]ของข้า [entourage_member_2.GetFirstName] ซึ่งกำลังหลับอยู่ริมน้ำ [entourage_member_1.GetFirstNameNoTooltip] กดศีรษะของ [entourage_member_2.GetFirstNamePossessiveNoTooltip] ลงใต้น้ำอย่างรวดเร็ว ทำให้[entourage_member_2.GetHerHim]จมน้ำอย่างเงียบๆ"
 assassination_scenario_plains: "[player_scope.Custom2('RelationToMeShort', entourage_member_1 )]ของข้า [entourage_member_1.GetFirstName] เข้าใกล้อย่างเงียบๆ [player_scope.Custom2('RelationToMeShort', entourage_member_2 )]ของข้า [entourage_member_2.GetFirstName] ซึ่งกำลังหลับอยู่ในทุ่งโล่ง ด้วยหินหนัก [entourage_member_1.GetFirstNameNoTooltip] ทุบกะโหลกศีรษะของ [entourage_member_2.GetFirstNamePossessiveNoTooltip] จนแตก ทิ้งให้หญ้าเปื้อนเลือด"
 assassination_scenario_steppe: "[player_scope.Custom2('RelationToMeShort', entourage_member_1 )]ของข้า [entourage_member_1.GetFirstName] ย่องตาม [player_scope.Custom2('RelationToMeShort', entourage_member_2 )]ของข้า [entourage_member_2.GetFirstName] ซึ่งหลับอยู่ใต้ท้องฟ้ากว้างใหญ่ [entourage_member_1.GetFirstNameNoTooltip] หักคอของ [entourage_member_2.GetFirstNamePossessiveNoTooltip] อย่างรวดเร็ว ทิ้งให้[entourage_member_2.GetHerHim]นอนแน่นิ่งบนทุ่งหญ้าสเตปป์อันกว้างใหญ่"
 assassination_scenario_taiga: "[player_scope.Custom2('RelationToMeShort', entourage_member_1 )]ของข้า [entourage_member_1.GetFirstName] เข้าใกล้ [player_scope.Custom2('RelationToMeShort', entourage_member_2 )]ของข้า [entourage_member_2.GetFirstName] ซึ่งหลับอยู่ท่ามกลางต้นสน ใช้แท่งน้ำแข็ง [entourage_member_1.GetFirstNameNoTooltip] แทง [entourage_member_2.GetFirstNameNoTooltip] เลือดละลายน้ำแข็งลงสู่พื้นดินที่ปกคลุมด้วยหิมะ"
 assassination_scenario_wetlands: "[player_scope.Custom2('RelationToMeShort', entourage_member_1 )]ของข้า [entourage_member_1.GetFirstName] ลุยน้ำอย่างเงียบๆ ไปทาง [player_scope.Custom2('RelationToMeShort', entourage_member_2 )]ของข้า [entourage_member_2.GetFirstName] ซึ่งหลับอยู่บนพื้นดินที่เป็นหนองบึง [entourage_member_1.GetFirstNameNoTooltip] ทำให้ [entourage_member_2.GetFirstNameNoTooltip] ขาดอากาศหายใจด้วยโคลน ทิ้งให้[entourage_member_2.GetHerHim]นอนแน่นิ่งในภูมิประเทศที่เป็นหนองบึง"
 
 travel_events_oltner_2.1230.t: "เช้าอันน่าสยดสยอง"
 travel_events_oltner_2.1230.desc: ""ขอสาบานต่อ [ROOT.Char.GetFaith.HighGodName] เกิดเหตุ #EMP ฆาตกรรม!#!"\n\n"ใครกันที่ปรารถนาความตายให้แก่ [entourage_member_2.GetFirstName] ผู้ [entourage_member_2.Custom('ComplimentAdjective')] ของเรา? และเหตุใดพวกเขาถึงได้ #EMP โหดเหี้ยม?!#!" [player_scope.Custom2('RelationToMeShort', corpse_finder )]ของข้า [corpse_finder.GetFirstName] กล่าวต่อ\n\n"ใช่แล้ว... ใครกันจะ #EMP กล้าคิด#! ทำเรื่อง เช่นนี้กับ [entourage_member_2.GetFirstNameNoTooltip] ผู้น่าสงสารและไร้เดียงสา" [entourage_member_1.GetFirstName] กล่าว ที่หางตา ข้าเห็น [entourage_member_1.GetHerHim] กลั้นหัวเราะ"
 travel_events_oltner_2.1230.a: ""เป็นฝีมือของ [corpse_finder.GetFirstNameNoTooltip] [entourage_member_1.GetFirstNameNoTooltip] #EMP ฆ่า [corpse_finder.GetHerHim] เสีย#!""
 travel_events_oltner_2.1230.b: ""ข้าเห็น [corpse_finder.GetFirstNameNoTooltip] หลบซ่อนในยามค่ำคืน จับตัว [corpse_finder.GetHerHim]!""
 travel_events_oltner_2.1230.c: ""นี่เป็นฝีมืออันเป็นเอกลักษณ์ของ [ROOT.Char.Custom('RegionalFerociousAnimal')] ไม่ต้องสงสัยเลย""
 travel_events_oltner_2.1230.d: ""เรา... เราควรเดินทางต่อ...""
 might_strike_again: "[entourage_member_1.GetFirstName] อาจลงมืออีกครั้ง... แต่ข้ารู้ [secret|E] ของ[entourage_member_1.GetHerHis] และสามารถเปิดโปงได้ทุกเมื่อที่ข้าต้องการ"
 
 travel_events_oltner_2.1240.t: "คณะนักแสดงสัญจร"
 travel_events_oltner_2.1240.desc: "เมื่อเข้าสู่ [location.GetTitle.GetName] เราได้รับการต้อนรับจากคณะนักแสดง มีการแสดงหุ่นกระบอก การเต้นรำ และการขับร้อง!\n\n[ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('entourage_member_1'))]ของข้า [entourage_member_1.GetFirstName] ดูเหมือนจะเพลิดเพลินกับดนตรี และหลงใหลในตัวตลกคนหนึ่งเป็นพิเศษ! [local_character.GetWomanMan] ผู้นี้เป็นนักแสดงที่ไม่ธรรมดา – โยนเครื่องดนตรีหลายชิ้นสลับกับการเล่น!"
 travel_events_oltner_2.1240.a: "บางทีข้าควรใช้เวลาดีๆ กับ [entourage_member_1.GetFirstNameNoTooltip]"
 travel_events_oltner_2.1240.b: "ข้าต้องการตัวตลก และ [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('entourage_member_1'))]ของข้าคงจะรัก[local_character.GetHerHim]!"
 travel_events_oltner_2.1240.c: "การพักผ่อนที่สมควรได้รับสำหรับพวกเราทุกคน"
