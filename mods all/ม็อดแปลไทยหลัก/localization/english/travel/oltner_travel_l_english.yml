l_english: 
 travel_events_oltner_2.1000.t: "ผืนทรายอันเพาะปลูก"
 travel_events_oltner_2.1000.desc: "ดวงตะวันแผดเผาเนินทรายแห่ง [location.GetName] ทำให้ทุกย่างก้าวคือบทพิสูจน์ความอดทน ทว่าท่ามกลางผืนดินแห้งแล้งนี้ โอเอซิสอันเขียวชอุ่มกลับเบ่งบาน - สิ่งมหัศจรรย์ทางการเกษตร ณ ใจกลางทะเลทราย\n\nขณะที่เราชื่นชมความผิดปกตินี้ ผู้ดูแลดินแดนเหล่านี้ก็เข้ามาใกล้พร้อมรอยยิ้มกร้านแดด "ท่านผู้เดินทาง" [local_character.GetSheHe] เอ่ยเรียก "มาเถิด มาชมผลแห่งแรงงานของเรา บางทีท่านอาจนำเรื่องราวชัยชนะเหนือผืนทรายของเรากลับไปยังบ้านเกิดเมืองนอนของท่าน!""
 travel_events_oltner_2.1000.option.a: ""จงแสดงให้เราเห็นว่าท่านปราบทะเลทรายได้อย่างไร""
 travel_events_oltner_2.1000.option.b: ""เราขอบคุณท่าน แต่จำต้องปฏิเสธ""
 travel_events_oltner_2.1000.option.c: ""บางทีขอผลผลิตของท่านสักเล็กน้อยเพื่อประทังชีพเราได้หรือไม่?""
 travel_events_oltner_2.1000.option.d: ""ข้าอยากฟังเรื่องราวชีวิตของพวกท่านที่นี่เพิ่มเติม""
 cultural_acceptance_gain_travel_stories: "เรื่องราวที่แบ่งปันระหว่างการ[travel|E]"
 
 travel_events_oltner_2.1010.t: "สถานพยาบาลอันเอื้อเฟื้อ"
 travel_events_oltner_2.1010.desc: "ขณะที่เราเดินทางผ่าน[location.Custom('TerrainTypeProvince')]แห่ง [location.GetName] สถานพยาบาลที่ประดับด้วยศิลปะ [location.GetCulture.GetNameNoTooltip] อันงดงามก็ปรากฏขึ้นริมทาง\n\n"ท่านผู้เดินทาง ท่านดูเหนื่อยล้า ประตูของเราเปิดต้อนรับ เพื่อให้ท่านได้พักผ่อนและรับการดูแล" แพทย์ผู้หนึ่งเสนอพร้อมรอยยิ้มอ่อนโยน ภายใน อากาศสงบเงียบ อบอวลไปด้วยกลิ่นหอมผ่อนคลายของสมุนไพร\n\n"นี่ ลอง #EMP 'ยาต้มดอก[location.Custom('get_region_flower_type')|U]'#! อันเลื่องชื่อของข้าสิ มันจะช่วยฟื้นฟูจิตวิญญาณของท่าน!""
 travel_events_oltner_2.1010.b: ""อา ให้ข้าได้ลิ้มลองยาต้มนั่นเถิด!""
 travel_events_oltner_2.1010.c: ""[ROOT.Char.Custom('GetCourtType')]ของข้าต้องการแพทย์ เหตุใดท่านไม่เข้าร่วมกับเราเล่า?""
 travel_events_oltner_2.1010.d: ""นี่คือเงินบริจาค จงใช้มันเพื่อช่วยเหลือผู้ป่วยไข้""
 well_funded_hospices_modifier: "สถานพยาบาลที่ได้รับทุนสนับสนุนอย่างดี"
 well_funded_hospices_modifier_desc: "สถานพยาบาลในดินแดนเหล่านี้เจริญรุ่งเรืองด้วยเงินบริจาคอันเอื้อเฟื้อจากผู้เดินทาง"
 local_character_aptitude_physician: "[aptitude|E]ของ [local_character.GetUINamePossessive] ในฐานะ [GetCourtPositionType('court_physician_court_position').GetName()] คือ [local_character.GetCourtPositionAptitude( GetCourtPositionType( 'court_physician_court_position' ) )]"
 
 travel_events_oltner_2.1020.t: "งานเลี้ยงของคนเลี้ยงอูฐ"
 travel_events_oltner_2.1020.desc: "ขณะที่ข้าและคณะผู้ติดตามเดินทางผ่านดินแดนกว้างใหญ่ของ [location.GetName] เงาอันโดดเด่นของฟาร์มอูฐก็ปรากฏแก่สายตา เมื่อยามเย็นคืบคลานเข้ามา คนเลี้ยงสัตว์ผู้หนึ่งก็เข้ามาใกล้\n\n"ยินดีต้อนรับ แขกผู้มีเกียรติ" [local_character.GetSheHe] กล่าวด้วยใบหน้ายิ้มแย้ม "อูฐแห่ง [location.GetName] หล่อเลี้ยงชีวิตพวกเรา และค่ำคืนนี้เราจะให้เกียรติแก่สัตว์ประเสริฐเหล่านี้ ท่านจะร่วมงานเลี้ยงและฟังเรื่องเล่าแห่งทะเลทรายใต้แสงดาวกับเราหรือไม่?""
 travel_events_oltner_2.1020.a: ""ให้ความสนุกสนานในค่ำคืนนี้ปลุกพลังจิตวิญญาณของเราเถิด!""
 travel_events_oltner_2.1020.b: ""ข้าสนใจในความอดทนของอูฐ""
 travel_events_oltner_2.1020.c: ""ข้าประสงค์จะซื้ออูฐที่ดีที่สุดของท่านเพื่อกองทัพของข้า""
 travel_events_oltner_2.1020.d: ""น่าเสียดาย ข้าจำต้องเดินทางต่อและขอปฏิเสธ""
 travel_hardy_camels_modifier: "อูฐทรหด"
 travel_hardy_camels_modifier_desc: "การเดินทางนี้ได้รับความช่วยเหลือจากฝูงอูฐที่ทรหดและไว้ใจได้เป็นพิเศษ"
 war_camel_modifier: "อูฐศึกทรงพลัง"
 war_camel_modifier_desc: "ตัวละครนี้มีอูฐศึกที่น่าประทับใจเป็นพิเศษ"

 travel_events_oltner_2.1030.t: "คาราวานบรรทุกสินค้า"
 travel_events_oltner_2.1030.desc: "ขณะเดินทางข้ามผืนทรายแห่ง [location.GetName] คาราวานอูฐบรรทุกสินค้าก็ตัดผ่านเส้นทางของเรา นายกองคาราวานสังเกตเห็นคณะผู้ติดตามของเราและหยุดขบวน\n\n"ท่านผู้เดินทางผู้สูงศักดิ์" [local_character.GetSheHe] เอ่ยเรียก ดวงตาของ[local_character.GetHerHis]ฉายแววหลักแหลม "บางทีท่านอาจสนใจชมสมบัติที่สัตว์แข็งแกร่งเหล่านี้บรรทุกมา? หากราคาเหมาะสม สิ่งมหัศจรรย์แห่งทะเลทรายอาจร่วมเดินทางไปกับท่าน""
 travel_events_oltner_2.1030.a: ""ข้ากระตือรือร้นที่จะดูสินค้าของท่าน มาต่อรองราคากันเถิด""
 travel_events_oltner_2.1030.b: ""ไม่จำเป็น แต่บางทีเราอาจเดินทางร่วมกันสักพักได้หรือไม่?""
 travel_events_oltner_2.1030.c: ""จงแสดงของที่ไม่เหมือนใครให้ข้าดู สมบัติที่แท้จริงของ [location.GetNameNoTooltip]""
 travel_events_oltner_2.1030.d: ""เราแบกภาระมากพอแล้ว...""
 traveling_with_camel_merchants_modifier: "เดินทางร่วมกับพ่อค้าอูฐ"
 traveling_with_camel_merchants_modifier_desc: "คณะผู้ติดตามนี้ได้เข้าร่วมกับกลุ่มพ่อค้าทะเลทราย ทำให้การเดินทางปลอดภัยยิ่งขึ้น"
 artifact_purchased: "ซื้อสิ่งประดิษฐ์แล้ว"
 purchase_artifact_trinket_tt: "ท่านได้รับเครื่องประดับเล็กๆ น้อยๆ [artifact|E] แบบสุ่ม"
 purchase_artifact_famed_tt: "ท่านได้รับ[artifact|E]ชื่อดังแบบสุ่ม"

 travel_events_oltner_2.1040.t: "โอเอซิสแห่งความสงบ"
 travel_events_oltner_2.1040.desc: "ขณะที่เราเดินทางข้ามที่ราบแห้งแล้งแห่ง [location.GetName] โอเอซิสอันเงียบสงบก็ปรากฏแก่สายตา ล้อมรอบด้วยฝูงอูฐ\n\nผู้อาวุโสผู้ทรงปัญญา เอนกายอยู่ริมน้ำ สังเกตเห็นเราเข้ามาใกล้และกวักมือเชื้อเชิญ "ท่านผู้เดินทางผู้เหนื่อยล้า" [local_character.GetSheHe] เริ่มกล่าว น้ำเสียงของ[local_character.GetHerHis]นุ่มนวลราวสายลมยามเย็น "จิตวิญญาณแห่งทะเลทรายอาจโหดร้าย พักผ่อนริมน้ำของเรา ให้พลังอันเงียบงันของอูฐฟื้นฟูท่านเถิด""
 travel_events_oltner_2.1040.a: ""ขอสาบานต่อ [ROOT.Char.GetFaith.HighGodName] ให้เราพักที่นี่สักสองสามวันเถิด!"
 travel_events_oltner_2.1040.b: ""ท่านดูทรงปัญญา เหตุใดท่านไม่เข้าร่วมกับเราเล่า?""
 travel_events_oltner_2.1040.c: ""บางทีเราควรค้าขายกัน?""
 travel_events_oltner_2.1040.d: ""โอเอซิสของท่านช่างน่าชื่นใจ แต่เวลาเป็นสิ่งสำคัญยิ่ง""

 travel_events_oltner_2.1050.t: "ทูตอาชา"
 travel_events_oltner_2.1050.desc: "ขณะที่เราเดินทางผ่านชานเมือง [location.GetName] เสียงกีบม้าดังกึกก้องทำลายความเงียบสงัด กองทหารม้าชั้นดีและผู้ขี่เข้ามาใกล้ เป็นภาพอันสง่างามตัดกับฉากหลังของ[location.Custom('TerrainTypeProvincePrefix')] [location.Custom('TerrainTypeProvince')]\n\n"คารวะ ท่านผู้เดินทาง!" ผู้นำของพวกเขาร้องเรียก "เราคือทูตจาก [location.GetTitle.GetName] ท่านสนใจจะชมความเก่งกาจของอาชาของเราหรือไม่?""
 travel_events_oltner_2.1050.a: ""ด้วยความยินดี!""
 travel_events_oltner_2.1050.b: ""ทองเท่าใดสำหรับตัวที่แข็งแกร่งที่สุด?""
 travel_events_oltner_2.1050.c: ""ข้าสนใจในความเก่งกาจ #EMP ของท่าน#! ในฐานะ $knight_culture_player_plural_no_tooltip_lowercase$ มากกว่า!""
 travel_events_oltner_2.1050.d: ""สัตว์ที่งดงาม แต่ข้าต้องให้ความสำคัญกับการเดินทางของข้า""
 prefix_verdant: "เขียวชอุ่ม"
 prefix_rolling: "ลูกคลื่น"
 prefix_mighty: "ยิ่งใหญ่"
 prefix_endless: "ไม่สิ้นสุด"
 prefix_lush: "อุดมสมบูรณ์"
 prefix_rich: "มั่งคั่ง"

 travel_events_oltner_2.1060.t: "ผู้ดูแลคอกม้า"
 travel_events_oltner_2.1060.desc: "กลิ่นหญ้าแห้งและเสียงม้าร้องนำเราไปยังคอกม้าอันเลื่องชื่อของ [location.GetName] นายคอกม้า บุคคลที่ได้รับความนับถืออย่างสูงในภูมิภาคนี้ ทักทายเราอย่างอบอุ่น\n\n"ยินดีต้อนรับ" [local_character.GetSheHe] ประกาศ "ม้าของข้าจัดอยู่ในหมู่ม้าที่เร็วที่สุด ท่านจะพิจารณาซื้อมิตรสหายผู้สูงศักดิ์ เช่นนี้เพื่อการเดินทางของท่านหรือไม่?""
 travel_events_oltner_2.1060.a: ""จงแสดงม้าที่เร็วที่สุดของท่านให้ข้าดู""
 travel_events_oltner_2.1060.b: ""ข้าต้องการม้าที่ดีที่สุดทั้งหมดของท่าน!""
 travel_events_oltner_2.1060.c: ""ท่านสนใจจะซื้อม้าตัวเมียสำรองของเราหรือไม่?""
 travel_events_oltner_2.1060.d: ""น่าเสียดาย เราต้องจากไป #EMp อย่างรวดเร็ว#!...""
 swift_horse_modifier: "ม้าเร็ว"
 swift_horse_modifier_desc: "ผู้นำการเดินทางนี้มีม้าที่เร็วเป็นพิเศษ"
 swift_horses_modifier: "ม้าเร็วหลายตัว"
 swift_horses_modifier_desc: "ตัวละครนี้จัดเตรียมคณะผู้ติดตามด้วยอาชาที่เร็วที่สุดเท่านั้น"
 sold_horses_modifier: "ขายม้าแล้ว"
 sold_horses_modifier_desc: "คณะผู้ติดตามนี้ได้ขายม้าสำรองของตนไปแล้ว"
 
 travel_events_oltner_2.1070.t: "หมอรักษาม้า"
 travel_events_oltner_2.1070.desc: "ท่ามกลางทุ่งหญ้าอันเงียบสงบของ [location.GetName] ร่างหนึ่งกำลังดูแลม้าที่ขาบาดเจ็บ เมื่อเราเข้าใกล้ หมอผู้นั้นเงยหน้าขึ้น ดวงตาของ[local_character.GetHerHis]สะท้อนความรู้ที่สั่งสมมานานหลายปี\n\n"แค่ก้าวพลาดเล็กน้อย" [local_character.GetSheHe] อธิบาย "แต่มันจะกลับมาวิ่งได้อีกครั้ง" ด้วยความประทับใจในการดูแลของ[local_character.GetHerHis] เราจึงหยุดพักการเดินทาง"
 travel_events_oltner_2.1070.a: ""ให้เราช่วยท่านรักษาสัตว์ประเสริฐนี้ได้หรือไม่?""
 travel_events_oltner_2.1070.b: ""ท่านควรมาเป็นเจ้ากรมม้าของข้า!""
 travel_events_oltner_2.1070.c: ""นี่ ท่านช่วยสอนวิชานี้ให้ข้าได้หรือไม่?""
 travel_events_oltner_2.1070.d: ""ข้าหวังว่ามันจะหายดีในเร็ววัน ลาก่อน""
 free_court_position: "ทำงานโดยไม่รับค่าจ้าง"
 master_of_the_horse_free: "[local_character.GetFirstName] จะได้รับการว่าจ้างเป็น [GetCourtPositionType('master_of_horse_court_position').GetName()] ของท่านและไม่คิดค่าจ้าง"
 excellent_horse_care_modifier: "การดูแลม้าชั้นเลิศ"
 excellent_horse_care_modifier_desc: "ตัวละครนี้มีความเชี่ยวชาญในศิลปะการดูแลม้าเป็นอย่างดี"
 
 travel_events_oltner_2.1080.t: "อัจฉริยะกลิ่นฉุน"
 travel_events_oltner_2.1080.desc: "ขณะที่เราผ่านฟาร์มอูฐแห่ง [location.GetName] กลิ่นฉุนกึกก็ปะทะเข้ากับประสาทสัมผัสของเรา เหล่าอูฐ แม้จะสำคัญเพียงใด ก็ส่งกลิ่นเหม็นคละคลุ้งไปทั่วทุกมุม\n\nพลัน ม้าตัวหนึ่งของเราก็เตลิดหนีไปไกลลิบ ดูเหมือนจะหวาดกลัวกลิ่นนั้น\n\n"ขออภัย [ROOT.Char.Custom('FormOfAddressForLiege')]!" ชาวไร่ร้องอุทาน "ข้าจะให้ท่านเลือกอูฐที่ดีที่สุดตัวหนึ่งของข้า เพื่อชดเชยความสูญเสียของท่าน""
 travel_events_oltner_2.1080.a: ""ข้าเลือกอูฐที่สง่างามที่สุดของท่าน""
 travel_events_oltner_2.1080.b: ""ข้าต้องการตัวที่ทรหดที่สุด""
 travel_events_oltner_2.1080.c: ""สัตว์ที่เร็วที่สุดของท่านก็ใช้ได้""
 travel_events_oltner_2.1080.d: ""ข้าอยากให้ท่านจ่ายเป็นทองคำมากกว่า...""
 exchange_camel_fast_modifier: "อูฐเร็ว"
 exchange_camel_fast_modifier_desc: "ม้าตัวหนึ่งของคณะเดินทางนี้วิ่งหนีไป และถูกแทนที่ด้วยอูฐเร็ว"
 exchange_camel_sturdy_modifier: "อูฐแข็งแกร่ง"
 exchange_camel_sturdy_modifier_desc: "ม้าตัวหนึ่งของคณะเดินทางนี้วิ่งหนีไป และถูกแทนที่ด้วยอูฐแข็งแกร่ง"

 travel_events_oltner_2.1090.t: "ยามแห่งเนินทรายอันเงียบงัน"
 travel_events_oltner_2.1090.desc: "ในความเงียบงันของ [location.GetName] ที่ ซึ่งลมร้อนปั้น แต่งผืนทราย หอสังเกตการณ์โดดเดี่ยวตั้งตระหง่านอย่างระแวดระวัง ผู้ดูแล ซึ่งเป็นยามผู้เคร่งขรึม ทักทายเราอย่างอบอุ่น\n\n"แขกผู้ทรงเกียรติ!" [local_character.GetWomanMan] ตะโกนลงมาจากด้านบน "มีสิ่งใดที่ข้าสามารถทำเพื่อท่านได้หรือไม่? บางทีท่านอาจต้องการร่วมกับข้าเพื่อทอดสายตามองความสงบของ [location.Custom('TerrainTypeProvince')]?""
 travel_events_oltner_2.1090.a: ""ให้เราพักผ่อนภายใต้การคุ้มครองของท่านเถิด สหาย""
 travel_events_oltner_2.1090.b: ""บอกเราที เรากำลังตามเส้นทางที่ถูกต้องหรือไม่?""
 travel_events_oltner_2.1090.c: ""บางทีท่านอาจเป็นผู้นำทางของเราในดินแดนเหล่านี้ได้หรือไม่?""
 travel_events_oltner_2.1090.d: ""เราต้องรีบไปแล้ว""
 watchtower_guidance_modifier: "การนำทางจากหอสังเกตการณ์"
 watchtower_guidance_modifier_desc: "คณะผู้ติดตามนี้ได้รับการนำทางจากยามผู้มองการณ์ไกล"
 watchman_guidance_modifier: "ยามทะเลทราย"
 watchman_guidance_modifier_desc: "คณะผู้ติดตามนี้มีผู้ร่วมทางเป็นยามผู้รอบรู้ ซึ่งคุ้นเคยกับภูมิประเทศท้องถิ่นเป็นอย่างดี"

 travel_events_oltner_2.1100.t: "ความอุดมสมบูรณ์ของวัวควาย"
 travel_events_oltner_2.1100.desc: "การเดินทางผ่าน [location.GetName] เผยให้เห็นทุ่งหญ้ากว้างใหญ่ไพศาลที่เต็มไปด้วยฝูงปศุสัตว์ ขณะที่ขบวนผู้ติดตามของข้าหยุดพักที่ขอบทุ่งอันเขียวขจี คนเลี้ยงสัตว์ก็เดินเข้ามา [local_character.GetSheHe] ดีดพิณลูทของ [local_character.GetHerHis] อย่างร่าเริง พลางส่งยิ้มกว้างทักทาย\n\n"[ROOT.Char.Custom('FormOfAddressForLiege')|U]" [local_character.GetSheHe] เริ่มกล่าว "สัตว์เหล่านี้คือความภาคภูมิใจของแคว้นเรา! ท่านจะร่วมเป็นสักขีพยานในการทำงานของเรา เติมเสบียง หรือบางทีอาจจะลิ้มลอง [location.GetTitle.GetNameNoTierNoTooltip]-บลูชีส อันเลื่องชื่อของเราหรือไม่?""
 travel_events_oltner_2.1100.a: ""จงแสดงให้ข้าเห็นว่าท่านดูแลฝูงสัตว์ของท่านอย่างไร""
 travel_events_oltner_2.1100.b: ""ให้เราเติมเสบียง และเติมท้องของเราเถิด!""
 travel_events_oltner_2.1100.c: ""ชีสสีฟ้า [location.GetTitle.GetNameNoTierNoTooltip] ฟังดู #EMP อร่อยยิ่งนัก!#!""
 travel_events_oltner_2.1100.d: ""เราต้องรีบไป""
 extra_supplies_modifier: "เสบียงเพิ่มเติม"
 extra_supplies_modifier_desc: "คณะเดินทางนี้มีเสบียงอย่างเพียงพอ"
 herding_insights_modifier: "ความเข้าใจในการเลี้ยงสัตว์"
 herding_insights_modifier_desc: "ผู้ปกครองดินแดนเหล่านี้กำลังใช้เทคนิคการเลี้ยงสัตว์ขั้นสูงที่ได้เรียนรู้มาระหว่างการเดินทาง"

 travel_events_oltner_2.1110.t: "เสียงตีเหล็กของช่างตีเหล็ก"
 travel_events_oltner_2.1110.desc: "การเดินทางของเรานำมาสู่ [location.GetName] ที่ ซึ่งเสียงค้อนทุบตีเหล็กเป็นจังหวะเปรียบดังหัวใจของการค้าท้องถิ่น ควันโขมงจากปล่องไฟขณะที่ช่างตีเหล็ก อาบไปด้วยเหงื่อและเขม่า กำลังหล่อหลอมวัตถุดิบให้กลายเป็นสิ่งที่น่าทึ่ง\n\nช่างตีเหล็กคนหนึ่งปาดเหงื่อบนหน้าผากของ [local_character.GetHerHis] และกวักมือเรียกข้าเข้าไปใกล้ "ยินดีต้อนรับ [ROOT.Char.Custom('FormOfAddressForLiege')]" [local_character.GetSheHe] ประกาศ "พวกเราคือสุดยอดช่างตีเหล็ก [local_character.GetCulture.GetNameNoTooltip] ที่เก่งกาจที่สุด! เชิญเลือกชมสินค้าของเราได้เลย""
 travel_events_oltner_2.1110.a: ""ชุดเกราะสักชุดคงไม่เสียหาย""
 travel_events_oltner_2.1110.b: ""ข้ากำลังมองหาอาวุธ""
 travel_events_oltner_2.1110.c: ""ท่านทำโล่หรือไม่?""
 travel_events_oltner_2.1110.d: ""ข้าพอใจช่างตีเหล็กของข้าเองมากกว่า ลาก่อน""
 purchase_artifact_common_armor_tt: "ท่านซื้อชุดเกราะ [artifact|E] [rarity|E]ที่ไม่รู้จัก"
 purchase_artifact_common_weapon_tt: "ท่านซื้ออาวุธ [artifact|E] [rarity|E]ที่ไม่รู้จัก"
 purchase_artifact_common_shield_tt: "ท่านซื้อโล่ติดผนัง [artifact|E] [rarity|E]ที่ไม่รู้จัก"

 travel_events_oltner_2.1120.t: "ช่างตีเหล็กผู้แตกสลาย"
 travel_events_oltner_2.1120.desc: "ขณะที่คณะผู้ติดตามของเราเดินทอดน่องผ่าน [location.GetName] เราก็พบโรงตีเหล็กที่อยู่ในสภาพไม่เป็นระเบียบ ช่างตีเหล็ก ผู้เปรอะเปื้อนเขม่า ดูตกอยู่ในความทุกข์ คร่ำครวญถึงเตาหลอมที่แตกสลาย\n\n"โอ้ [local_character.GetFaith.HighGodName] ได้สาปแช่ง [local_character.GetTitledFirstName] ผู้น่าสงสาร! โชคร้ายถาโถมใส่ทั่งตีเหล็กของข้า!" [local_character.GetSheHe] อธิบาย "หากไม่ซ่อมแซม ฝีมือ—และอาชีพ—ของข้าก็ร่วงโรย โอ้ ช่างโชคร้ายอะไร เช่นนี้!""
 travel_events_oltner_2.1120.a: ""นี่ รับทองคำนี้ไปเพื่อช่วยให้ท่านกลับมาตั้งตัวได้""
 travel_events_oltner_2.1120.b: ""เข้าร่วมกับเราเถิด เราต้องการช่างตีเหล็ก""
 travel_events_oltner_2.1120.c: ""ช่างน่ากลัวเสียนี่กระไร ช่างเถอะ!""
 becomes_inspired: "กลายเป็น [inspired|E]"
 
 travel_events_oltner_2.1130.t: "ยามแห่ง[location.Custom('TerrainTypeProvince')|U]"
 travel_events_oltner_2.1130.desc: "ขณะที่เงาตะคุ่มของ [location.GetName] ปรากฏอยู่เบื้องหน้า เค้าร่างอันขรุขระของป้อมปราการบนเนินเขาก็เด่นตระหง่านอยู่บนภูมิทัศน์\n\nนักรบกลุ่มหนึ่งท่าทางป่าเถื่อนเดินเข้ามา หัวหน้าของพวกเขาดูกระด้างที่สุด "[ROOT.Char.Custom('FormOfAddressForLiege')]" [local_character.GetSheHe] พยักหน้า "พวกเราคือ [local_character.GetWomenMen] จากกองทหารรักษาการณ์ของ [location.GetTitle.GetHolder.GetTitledFirstNamePossessive] เพียงจ่ายค่าธรรมเนียมเล็กน้อย พวกเราสามารถคุ้มกันท่านในการเดินทางนี้ได้ ว่าอย่างไร?""
 travel_events_oltner_2.1130.a: ""โปรดนำทางเราผ่าน [location.Custom('TerrainTypeProvince')] อย่างปลอดภัย""
 travel_events_oltner_2.1130.b: ""ท่านดูแข็งแกร่ง เข้าร่วมกับข้าเป็นอย่างไร?""
 travel_events_oltner_2.1130.c: ""พวกท่านทุกคนดูน่าเกรงขาม ข้าจะให้ค่าจ้างเป็นสองเท่าของที่ [location.GetTitle.GetHolder.GetFirstNameNoTooltip] จ่าย!""
 travel_events_oltner_2.1130.d: ""ไม่จำเป็น แต่ขอบคุณ""
 hill_fort_guards_modifier: "ทหารยามจากกองรักษาการณ์ป้อมเนินเขา"
 hill_fort_guards_modifier_desc: "คณะผู้ติดตามนี้กำลังว่าจ้างผู้พิทักษ์ป้อมเนินเขาผู้แข็งแกร่ง"
 toll_payed: "จ่ายค่าผ่านทางแล้ว"
 
 travel_events_oltner_2.1140.t: "ผู้พิทักษ์ตัวน้อย"
 travel_events_oltner_2.1140.desc: "ณ เชิงป้อมปราการบนเนินเขาที่น่าเกรงขามเป็นพิเศษใน [location.GetName] เด็กกลุ่มหนึ่งกำลังเล่นเป็นนักรบ เสียงหัวเราะของพวกเขาตัดกับความขรึมขลังของหินผา\n\nเด็กคนหนึ่ง กล้าหาญและตาเป็นประกาย เข้ามาใกล้พร้อมดาบไม้ "หยุด! ไม่มีใครผ่านป้อมของ [local_character.GetFirstName] และกองทัพ [local_character.Custom('ComplimentAdjective')] ของ[local_character.GetHerHis]ได้!" เด็กคนนั้นอุทานอย่างร่าเริง "โอ้ เดี๋ยว อะ... ท่านคือ [ROOT.Char.GetTitleAsNameNoTooltip] หรือ!?""
 travel_events_oltner_2.1140.a: ""ถูกต้อง! ทีนี้จงไปบอกหมู่บ้านของเจ้าเกี่ยวกับข้าให้หมด!""
 travel_events_oltner_2.1140.b: ""ผู้พิทักษ์ผู้กล้าหาญ บอกทางที่เร็วที่สุดผ่าน [location.Custom('TerrainTypeProvince')] เหล่านี้ให้เราที""
 travel_events_oltner_2.1140.c: ""#EMP *ชักอาวุธของท่านและไล่เด็กๆ ไป*#!""
 travel_events_oltner_2.1140.d: ""จงสนุกกับการเล่นของเจ้าเถิด เด็กน้อย เราต้องไปแล้ว""
 travel_hastened: "เร่งการเดินทาง"
 travel_delayed: "การเดินทางล่าช้า"
 famous_visit_modifier: "ผู้มาเยือนผู้มีชื่อเสียง"
 famous_visit_modifier_desc: "หมู่บ้านรอบดินแดนเหล่านี้กำลังฮือฮาเกี่ยวกับข่าวขุนนางมาเยือน แม้สิ่งนี้จะดึงดูดผู้คนจากทั่วสารทิศให้มาเยี่ยมเยียนและค้าขาย แต่ก็ดึงดูดโจรที่มองหาราชวงศ์ผู้มั่งคั่งด้วยทองคำ เช่นกัน"
 child_scouts_modifier: "หน่วยสอดแนมเด็ก"
 child_scouts_modifier_desc: "คณะผู้ติดตามนี้กำลังได้รับการนำทางโดยกลุ่มเด็กผู้หวังดี"
 extra_patrols_modifier: "การลาดตระเวนเพิ่มเติม"
 extra_patrols_modifier_desc: "บารอนีนี้ได้เพิ่มการลาดตระเวนเป็นสองเท่าหลังจากเด็กในท้องถิ่นถูกคุกคามโดยผู้เดินทาง"

 travel_events_oltner_2.1150.t: "เสียงแตรสะท้อน"
 travel_events_oltner_2.1150.desc: "เสียงเรียกระดมพลของแตรดังก้องไปในอากาศขณะที่เราเดินทางผ่าน [location.Custom('TerrainTypeProvince')] ใกล้ [location.GetName] ป้อมปราการบนเนินเขาสะท้อนเสียงนั้น เป็นสัญญาณเรียกระดมพลที่ดังมาหลายชั่วอายุคน\n\nเพียงไม่กี่วินาทีหลังเสียงแตรแรกดังขึ้น ฝูงนักรบ [local_character.GetCulture.GetName] จากกองรักษาการณ์ก็พรั่งพรูออกมาจากป้อมที่ใกล้ที่สุด เข้าโจมตีกลุ่มโจรปล้นสะดมและโจรป่าที่หวาดกลัว"
 travel_events_oltner_2.1150.a: ""เราต้องช่วยพวกเขา บุก!""
 travel_events_oltner_2.1150.b: ""เรารอ แล้วค่อยเก็บของจากศพ""
 travel_events_oltner_2.1150.c: ""[retinue_member.GetFirstNameNoTooltip] ช่วยพวกเขา! เราจะ... อยู่ที่นี่""
 travel_events_oltner_2.1150.d: ""นี่ไม่ใช่ศึกของเรา""
 cultural_acceptance_gain_assisted_battle: "ช่วยเหลือการต่อสู้กับโจรระหว่างการ[travel|E]"
 travel_events_oltner_2.1150.a.success: "ท่านสังหารโจรทั้งหมด"
 travel_events_oltner_2.1150.a.failure: "พวกโจรสังหารผู้บัญชาการ แล้วหลบหนีไป"
 travel_events_oltner_2.1150.b.success: "กองรักษาการณ์ชนะ"
 travel_events_oltner_2.1150.b.failure: "พวกโจรชนะ"
 travel_events_oltner_2.1150.c.success: "[retinue_member.GetFirstName] สังหารหัวหน้าโจร"
 travel_events_oltner_2.1150.c.failure: "[retinue_member.GetFirstName] ถูกสังหาร 'อย่างน่าเศร้า'"

 travel_events_oltner_2.1160.t: "สายสัมพันธ์ริมทาง"
 travel_events_oltner_2.1160.desc: "ขณะเดินทางผ่านเส้นทางที่ท้าทายใน [location.GetName] ข้าได้ยินเสียงหัวเราะอยู่ข้างหน้า [ROOT.Char.Custom2('RelationToMeShort', entourage_member_1 )]ของข้า [entourage_member_1.GetFirstName] และ [ROOT.Char.Custom2('RelationToMeShort', entourage_member_2 )]ของข้า [entourage_member_2.GetFirstName] กำลังทำงานร่วมกันเพื่อข้าม [location.Custom('GetRandomCrossingToBridge')]\n\n"[entourage_member_1.GetFirstNameNoTooltip] ความคิดของท่านที่จะสร้างสะพานชั่วคราวนั้นยอดเยี่ยมมาก!" [entourage_member_2.GetFirstNameNoTooltip] อุทาน [entourage_member_1.GetFirstNameNoTooltip] ตอบพร้อมหัวเราะเบาๆ "และความคิดอันรวดเร็วของท่านกับ [location.Custom('GetRandomImprovisedBridgeMaterial')] เหล่านั้นก็เชื่อมทุกอย่างเข้าด้วยกัน!"\n\nดูเหมือนว่าอุปสรรคนี้ได้นำไปสู่มิตรภาพใหม่!"
 travel_events_oltner_2.1160.a: ""ความเฉลียวฉลาดของพวกท่านน่าชื่นชมยิ่งนัก!""
 travel_events_oltner_2.1160.b: ""อย่าสมาคมกับผู้ที่ต่ำต้อยกว่า!""
 travel_events_oltner_2.1160.c: ""สิ่งนี้จะเร่งการเดินทางของเราได้จริง""
