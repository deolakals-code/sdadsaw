 travel_events_oltner_2.1180.t: "คำสารภาพใต้แสงจันทร์"
 travel_events_oltner_2.1180.desc: "ใต้แสงจันทร์ใน [location.GetName] ข้าบังเอิญได้ยินการสนทนาส่วนตัวระหว่าง [ROOT.Char.Custom2('RelationToMeShort', entourage_member_1 )]ของข้า [entourage_member_1.GetFirstName] และ [ROOT.Char.Custom2('RelationToMeShort', entourage_member_2 )]ของข้า [entourage_member_2.GetFirstName]\n\n"โอ้ [entourage_member_1.GetFirstNameNoTooltip] [entourage_member_1.Custom('RomanticComplimentNoun')] [entourage_member_1.Custom('RomanticComplimentAdjective')] ของข้า ท่าน ทำให้ค่ำคืนที่เต็มไปด้วยดาวเหล่านี้มิอาจลืมเลือน" [entourage_member_2.GetFirstNameNoTooltip] สารภาพ น้ำเสียงของ[entourage_member_2.GetHerHis]สั่นเครือ [entourage_member_1.GetFirstNameNoTooltip] ตอบเบาๆ "ข้าไม่เคยคาดคิดว่าจะพบบุคคลที่เข้าใจข้าดีถึงเพียงนี้"\n\nดูเหมือนว่าความรักกำลังเบ่งบานในคณะผู้ติดตามของข้า..."
 travel_events_oltner_2.1180.a: "น่ารักดี แต่ [seduced_entourage.GetFirstNameNoTooltip] ไม่อาจต้านทาน #EMP ข้า#! ได้หรอก"
 travel_events_oltner_2.1180.b: ""สวัสดี! พวกท่านคุยอะไรกันอยู่? ข้าขอร่วมด้วยได้หรือไม่!?""
 travel_events_oltner_2.1180.c: "เรื่องวุ่นวาย... มันคงจะ #EMP น่าเสียดายจริงๆ#! หากเรื่องนี้แพร่งพรายออกไป..."
 travel_events_oltner_2.1180.d: "ช่างอ่อนโยนนัก ข้าจะปล่อยให้พวกเขาอยู่ตามลำพัง"
 lover_moonlit_evening_on_the_road: "[CHARACTER.GetShortUIName|U] และ [TARGET_CHARACTER.GetShortUIName] ตกหลุมรักกันหลังจากดูดาวด้วยกันใน [PROVINCE.GetName] ในฐานะส่วนหนึ่งของคณะผู้ติดตามของ [TARGET_CHARACTER_2.GetFirstNamePossessive]"
