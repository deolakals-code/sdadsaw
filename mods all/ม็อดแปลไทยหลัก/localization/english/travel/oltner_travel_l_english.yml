 travel_events_oltner_2.1190.t: "ของที่ระลึกที่ถูกขโมย"
 travel_events_oltner_2.1190.desc: "ในความเงียบสงัดของค่ายพักเราใกล้ [location.GetName] พลันมีเสียงอื้ออึงอึกทึกทลายความสงบลง [entourage_member_1.GetFirstName] [ROOT.Char.Custom2('RelationToMeShort', entourage_member_1 )] ของข้า เข้าเผชิญหน้า [entourage_member_2.GetFirstName] [ROOT.Char.Custom2('RelationToMeShort', entourage_member_2 )] ของข้าด้วยท่าทีกล่าวโทษ ในมือกำ [entourage_member_1.Custom('GetRandomSmallPreciousItem')] อันล้ำค่าไว้\n\n"เจ้าหัวขโมย! นี่เป็นของมารดาข้า!" [entourage_member_1.GetFirstNameNoTooltip] ร้องลั่น นัยน์ตาลุกโชนด้วยโทสะ [entourage_member_2.GetFirstNameNoTooltip] ปฏิเสธเสียงแข็ง "เจ้า [entourage_member_1.Custom2('InsultNoun', SCOPE.sC('entourage_member_2'))] จอมมุสา มันเป็นของข้ามา แต่ไหน แต่ไร!""
 travel_events_oltner_2.1190.a: ""มันเป็นของ [entourage_member_1.GetFirstNameNoTooltip]""
 travel_events_oltner_2.1190.b: ""[entourage_member_2.GetFirstNameNoTooltip] จะเก็บมันไว้""
 travel_events_oltner_2.1190.c: ""พวกท่านทั้งคู่เป็นเด็ก ส่งมันมา!""
 travel_events_oltner_2.1190.d: ""เรา #EMP ไม่มี#! เวลาสำหรับเรื่องนี้จริงๆ!""
