 # Intro
 BattlePoiDescriptionIntro1: "ทั้งสองฝ่ายปะทะกันที่ $BattlePoiProvince$ ฝ่ายหนึ่งนำโดย $BattlePoiCommander$ และอีกฝ่ายนำโดย $BattlePoiEnemyCommander$"
 BattlePoiDescriptionIntroAttacker2: "$BattlePoiCommander$ เปิดฉากการรุกอันน่าเกรงขามต่อกองทัพของ $BattlePoiEnemyCommander$"
 BattlePoiDescriptionIntroDefender2: "$BattlePoiCommander$ ตั้งรับอย่างเชี่ยวชาญต่อกองทัพที่กำลังรุกเข้ามาของ $BattlePoiEnemyCommander$"
 BattlePoiDescriptionIntroAttackerFallback: "$BattlePoiCommander$ นำทัพของ $BattlePoiCommanderHisHer$ บุกโจมตีกองทัพ $BattlePoiEnemyCommanderCulture$ ของ $BattlePoiEnemyCommander$ อย่างกล้าหาญ"
 BattlePoiDescriptionIntroDefenderFallback: "$BattlePoiCommander$ นำทัพของ $BattlePoiCommanderHisHer$ ตั้งรับการโจมตีจากกองทัพ $BattlePoiEnemyCommanderCulture$ ของ $BattlePoiEnemyCommander$ อย่างกล้าหาญ"

 # Key Moment
 BattlePoiDescriptionLocArchers: "ช่วงเวลาสำคัญของยุทธการคือเมื่อพลธนู $BattlePoiCommanderCulture$ สามารถอ้อมไปโจมตีข้าศึกได้ "
 BattlePoiDescriptionLocHeavyInfantry: "ยุทธการตัดสินเมื่อกองทหารราบหนัก $BattlePoiCommanderCulture$ ทะลวงแนวข้าศึกได้สำเร็จ "
 BattlePoiDescriptionLocLightCavalry: "ผลลัพธ์ตัดสินเมื่อทหารม้า $BattlePoiCommanderCulture$ สามารถอ้อมไปด้านหลังกองทหารข้าศึกได้ "
 BattlePoiDescriptionLocHeavyCavalry: "ยุทธการสิ้นสุดลงเมื่อทหารม้า $BattlePoiCommanderCulture$ ทะลวงแนวรบเข้าไปยังใจกลางของขบวนทัพข้าศึก "
 BattlePoiDescriptionLocPikemen: "ชัยชนะของพวกเขาแน่นอนเมื่อพลหอก $BattlePoiCommanderCulture$ ผลักดันการบุกของข้าศึกกลับไปได้ "
 BattlePoiDescriptionLocArchersKnight: "ช่วงเวลาสำคัญของยุทธการคือเมื่อพลธนู $BattlePoiCommanderCulture$ นำโดย $BattlePoiBraveKnight$ สามารถอ้อมไปโจมตีข้าศึกได้ "
 BattlePoiDescriptionLocHeavyInfantryKnight: "ยุทธการตัดสินเมื่อกองทหารราบหนัก $BattlePoiCommanderCulture$ นำโดย $BattlePoiBraveKnight$ ทะลวงแนวข้าศึกได้สำเร็จ "
 BattlePoiDescriptionLocLightCavalryKnight: "ผลลัพธ์ตัดสินเมื่อทหารม้า $BattlePoiCommanderCulture$ นำโดย $BattlePoiBraveKnight$ สามารถอ้อมไปด้านหลังกองทหารข้าศึกได้ "
 BattlePoiDescriptionLocHeavyCavalryKnight: "ยุทธการสิ้นสุดลงเมื่อทหารม้า $BattlePoiCommanderCulture$ นำโดย $BattlePoiBraveKnight$ ทะลวงแนวรบเข้าไปยังใจกลางของขบวนทัพข้าศึก "
 BattlePoiDescriptionLocPikemenKnight: "ชัยชนะของพวกเขาแน่นอนเมื่อพลหอก $BattlePoiCommanderCulture$ นำโดย $BattlePoiBraveKnight$ ผลักดันการบุกของข้าศึกกลับไปได้ "
 BattlePoiDescriptionLocVarangian: "ยุทธการสิ้นสุดลงเมื่อกลุ่มทหารวารันเจียนนำโดย $BattlePoiBraveKnight$ ทะลวงแนวรบเข้าไปลึกในขบวนทัพข้าศึก "
 BattlePoiDescriptionLocBerserker: "ยุทธการพลิกผันอย่างไม่คาดคิดเมื่อ $BattlePoiBraveKnight$ บุกตะลุยฝ่าแนวรบ $BattlePoiEnemyCommanderCulture$ เข้าไป "
 BattlePoiDescriptionLocMidFallback: "ทั้งสองฝ่ายต่างอ่อนล้า และในที่สุดฝ่าย $BattlePoiCommanderCulture$ ก็โอบล้อมข้าศึกได้ "

 # Outcome
 BattlePoiDescriptionLocOutcomeBerserker: "ทำลายขวัญกำลังใจของข้าศึก แต่เพียงผู้เดียวด้วยการสังหารนักรบข้าศึกไปหลายสิบนาย "
 BattlePoiDescriptionLocOutcomeBerserkerFled: "และทำลายขวัญกำลังใจของข้าศึก แต่เพียงผู้เดียวด้วยการสังหารนักรบข้าศึกไปหลายสิบนาย"
 BattlePoiDescriptionLocOutcomeDevastation: "ทำลายล้างศัตรูของพวกเขา "
 BattlePoiDescriptionLocOutcomeDevastationFled: "และทำลายล้างกองทัพฝ่ายตรงข้าม"
 BattlePoiDescriptionLocOutcomeChaos: "สร้างความสูญเสียอย่างหนักแก่ศัตรู "
 BattlePoiDescriptionLocOutcomeChaosFled: "และสร้างความสูญเสียอย่างหนักแก่ศัตรู"
 BattlePoiDescriptionLocOutcomeLoss: "ทำลายขวัญกำลังใจของฝ่ายตรงข้าม "
 BattlePoiDescriptionLocOutcomeLossFled: "และทำลายขวัญกำลังใจของฝ่ายตรงข้าม"

 # Outro
 BattlePoiDescriptionLocOutroImprisoned: "และจับกุม $BattlePoiEnemyCommander$ ได้"
 BattlePoiDescriptionLocOutroSlain: "และสังหาร $BattlePoiEnemyCommander$"
 BattlePoiDescriptionLocOutroFledChaos: "ท่ามกลางความโกลาหล $BattlePoiEnemyCommander$ สามารถหลบหนีไปพร้อมกับข้ารับใช้ที่ใกล้ชิดที่สุดของ $BattlePoiCommanderHisHer$ ได้"
 BattlePoiDescriptionLocOutroFledOrganized: "แม้จะสูญเสียอย่างหนัก $BattlePoiEnemyCommander$ ก็สามารถจัดการถอยทัพอย่างมีแบบแผนได้"


