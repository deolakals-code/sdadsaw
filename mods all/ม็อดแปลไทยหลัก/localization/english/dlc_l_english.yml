 dlc_001:0 "$DLC001_PREORDER$"
 dlc_001_desc:0 "ดื่มด่ำไปกับจักรวรรดิโรมันอันศักดิ์สิทธิ์ด้วยคอลเลกชันเครื่อง แต่งกายสำหรับทั้งสามัญชน นักรบ และผู้ปกครองแห่งยุโรปกลาง"
 dlc_002:0 "$DLC002_SP_DAY1$"
 dlc_002_desc:0 "มอบรูปลักษณ์ใหม่อันสง่างามให้กับราชสำนักของคุณด้วยชุดเครื่อง แต่งกายและตัวเลือกเสื้อผ้าตก แต่งสำหรับตะวันออกกลางและแอฟริกาเหนือ"
 dlc_003:0 "$DLC003_FP1$"
 dlc_003_desc:0 "นักปล้นสะดมผู้ดุร้ายจากแดนเหนืออันหนาวเหน็บ หรือสังคมอันซับซ้อนที่เต็มไปด้วยนักสำรวจผู้กล้าหาญ พ่อค้า และกวี? ค้นพบความร่ำรวยที่แท้จริงของโลกนอร์สด้วย Crusader Kings III: Northern Lords ชุดเสริมรสชาติเชิงลึกชุดแรกสำหรับเกม Crusader Kings III ที่ได้รับคำชมอย่างสูง"
 dlc_004:0 "$DLC004_EP1$"
 dlc_004_desc:0 "ส่วนขยาย The Royal Court สำหรับ Crusader Kings III เพิ่มวิธีใหม่ในการโต้ตอบกับตัวละครในราชอาณาจักรหรือจักรวรรดิของคุณ รวมถึงการเปลี่ยนแปลงครั้งใหญ่ในระบบวัฒนธรรมของเกม เพิ่มพลวัตและความลื่นไหลทางประวัติศาสตร์ที่มากขึ้น"
 dlc_005:0 "$DLC005_FP2$"
 dlc_005_desc:0 "ดินแดนแห่งไอบีเรียที่อาบไล้ด้วยแสงแดดรอคอยการปกครองอันรุ่งโรจน์ของคุณด้วยชุดเสริมรสชาติ Crusader Kings III: Fate of Iberia คาบสมุทรแห่งนี้ร่ำรวยไปด้วยประวัติศาสตร์ วัฒนธรรม และผู้คนอย่างลึกซึ้ง ชะตากรรมยุคกลางพร้อมแล้วที่จะถูกกำหนดโดยหัตถ์อันสง่างามของคุณ ไม่ว่าจะหุ้มด้วยกำมะหยี่แห่งการประนีประนอมหรือเป็นกำปั้นเหล็ก"
 dlc_006:0 "$DLC006_BP1$"
 dlc_006_desc:0 "ระวังเถิด ท่านผู้ปกครอง - จงก้าวเดินอย่างระมัดระวังกับผู้ที่คุณเรียกว่ามิตรหรือศัตรู พวกเขาคือสองด้านของเหรียญเดียวกัน ความสัมพันธ์ของคุณมีความสำคัญมากกว่าที่เคย และด้วย Crusader Kings III: Friends & Foes ร่วมเป็นสักขีพยานให้ผู้ที่ใกล้ชิดคุณที่สุดมีชีวิตชีวาขึ้นในรายละเอียดที่ใกล้ชิดที่สุด"
 dlc_007:0 "$DLC007_EP2$"
 dlc_007_desc:0 "เขียนประวัติศาสตร์ใหม่ขณะที่คุณเดินทางข้ามดินแดนยุคกลางอันทุรกันดารเพื่อดื่มด่ำกับเกียรติยศที่ได้รับจากการเป็นเจ้าภาพและเข้าร่วมการประลองอันยิ่งใหญ่ งานอภิเษกสมรสอันยิ่งใหญ่ และการเดินทางอันยิ่งใหญ่"
 dlc_008:0 "$DLC008_SP2$"
 dlc_008_desc:0 "แต่งกายผู้ปกครองของคุณด้วยอาภรณ์อันเลิศหรูที่สุดด้วยชุดเสื้อผ้านี้ อิงตามเครื่อง แต่งกายและเครื่องราชกกุธภัณฑ์ของจักรพรรดิไฮน์ริชที่ 2 และจักรพรรดินีคูนีกุนเดอ ชุดนี้ไม่เพียง แต่ รวมถึงเสื้อคลุมและชุดกระโปรงใหม่เท่านั้น แต่ยังมีมงกุฎและสิ่งของอื่น ๆ ที่เหมาะสมตามประวัติศาสตร์อีกด้วย มีให้เฉพาะสำหรับเจ้าของ Chapter II เท่านั้น"
 dlc_009: "$DLC009_BP2$"
 dlc_009_desc: "ใน Wards & Wardens ผู้ปกครองที่เป็นเด็กและผู้พิทักษ์ของพวกเขาจะกลายเป็นศูนย์กลาง เลี้ยงดูเจ้าชายและขุนนางรุ่นเยาว์ในโลกที่เกียรติยศนิรันดร์อยู่ห่างเพียงการรบครั้งเดียว และอันตรายซุ่มซ่อนอยู่ในทุกเงามืด"
 dlc_010: "$DLC010_FP3$"
 dlc_010_desc: "จักรวรรดิซาเซเนียนล่มสลายไปนานแล้ว และกาหลิบอับบาซิดกำลังกดดันราชวงศ์อิหร่านที่เหลืออยู่ให้ยอมจำนน คุณจะยอมสยบ หรือสร้างจักรวรรดิใหม่? อนาคตของเปอร์เซียอยู่ในมือของคุณ!"
 dlc_011: "$DLC011_CE1$"
 dlc_011_desc: "ข่าวสารการกระทำของคุณแพร่สะพัดไปไกลและกว้าง: จารึกชื่อของคุณลงในบันทึกประวัติศาสตร์และสร้างอนุสรณ์สถานเพื่อเกียรติยศของคุณเอง! ถักทอเรื่องราวอันเข้มข้นแห่งตำนานของคุณ และสร้างสรรค์เรื่องเล่าที่จะขับขานถึงคุณไปอีกนานแสนนาน"
 dlc_012: "$DLC012_CP1$"
 dlc_012_desc: "ชุดเสื้อผ้านี้สำหรับวัฒนธรรมแอฟริกาเหนือ รวมถึงไอเทมใหม่ ๆ ให้ตัวละครสวมใส่ เช่น เสื้อท่อนบน กางเกง เสื้อคลุม หมวก และอื่น ๆ พร้อมดีไซน์และลวดลายใหม่ “เครื่อง แต่งกายแอฟริกาเหนือ” เป็นชุดแรกที่สร้างขึ้นโดยความร่วมมือและกำกับโดยผู้สร้างในชุมชน"
 dlc_013: "$DLC013_SP3$"
 dlc_013_desc: "ได้รับแรงบันดาลใจจากแฟชั่นของราชสำนักฝรั่งเศสในยุคกลางตอนกลาง ชุดตก แต่งนี้จะนำสไตล์และลวดลายใหม่ ๆ มาสู่ Crusader Kings III แต่งตัวด้วยเสื้อคลุมใหม่ หมวกประเภทใหม่ หนวดเคราและทรงผมใหม่ - ทุกสิ่ง เพื่อให้เข้ากับเสื้อผ้าที่หรูหราและสง่างามของคุณ มีให้เฉพาะสำหรับเจ้าของ Chapter III เท่านั้น"
 dlc_014: "$DLC014_EP3$"
 dlc_014_desc: "นำตระกูลขุนนางในจักรวรรดิโบราณ โดยใช้อิทธิพลและเล่ห์เหลี่ยมเพื่อรักษาตำแหน่งของคุณ หรือเป็นทหารรับจ้างพเนจร สร้างชื่อเสียงในฐานะนักแก้ปัญหาหรือคนนอกกฎหมาย พบกับเหตุการณ์ใหม่ ระบบการปกครอง แผนการ และวิถีชีวิตใหม่ ๆ ให้คุณสำรวจด้วย Roads to Power"
 dlc_015: "$DLC015_BP3$"
 dlc_015_desc: "นำเสนอเนื้อหาใหม่ให้กับระบบที่เป็นที่รักหลายอย่าง: การเดินทาง กิจกรรม และวิถีชีวิต ส่งผู้ปกครองของคุณไปในการเดินทางอันน่าตื่นเต้น ไม่ว่าจะเพื่อแสวงหาความมั่งคั่ง เกียรติยศ หรือการเติบโตส่วนบุคคล อย่าปล่อยให้พวกเขานั่งเฉย — การผจญภัยรออยู่ทุกมุม!"
 dlc_016: "$DLC016_CP2$"
 dlc_016_desc: "ชุดสร้างสรรค์เนื้อหานี้ได้รับแรงบันดาลใจจากอาภรณ์สลาฟตะวันตกในยุคกลาง ประกอบด้วยเสื้อผ้าใหม่ กางเกง หมวกอันยิ่งใหญ่ และลวดลายหลากหลายให้เลือก"
 dlc_017: "$DLC017_CP3$"
 dlc_017_desc: "ค้นพบความสำเร็จทางสถาปัตยกรรมอันยิ่งใหญ่แห่งยุคกลางด้วยชุดสร้างสรรค์เนื้อหา Medieval Monuments\n\nสร้างขึ้นโดยความร่วมมือกับ PiGu ผู้สร้างม็อด Crusader Kings III ที่มีชื่อเสียง Medieval Monuments นำเสนออนุสรณ์สถานใหม่ที่หลากหลายและมีความสำคัญทางวัฒนธรรม 20 แห่งสู่เกม"
 dlc_018: "$DLC018_CP4$"
 dlc_018_desc: "ท้าทายความหนาวเย็นของดินแดนทางเหนืออันไกลโพ้นอย่างมีสไตล์ด้วยชุดสร้างสรรค์เนื้อหา Arctic Attire สร้างขึ้นโดยความร่วมมือกับ Aj ผู้สร้างม็อด Crusader Kings III ที่มีชื่อเสียง Arctic Attires เพิ่มเครื่องสำอางที่ได้รับแรงบันดาลใจจากสุนทรียศาสตร์ของชาวซามิและคานตี"
 dlc_019: "$DLC019_SP4$"
 dlc_019_desc: "มอบกลิ่นอายแห่งราชวงศ์ให้กับการปกครองของคุณด้วย Crowns of the World คอลเลกชันตัวเลือกเครื่องสำอางระดับราชวงศ์เพื่อเสริมรูปลักษณ์ของผู้ปกครองของคุณ มีให้เฉพาะสำหรับเจ้าของ Chapter IV เท่านั้น"
 dlc_020: "$DLC020_CE2$"
 dlc_020_desc: "จงเป็นผู้ปกครอง หรือยอมถูกปกครอง จงอพยพ หรือพินาศสิ้น ในจอมข่านแห่งทุ่งสเตปป์, ผู้กล้าแกร่งที่สุดเท่านั้นจึงจักยืนหยัดฝ่าความจริงอันแสนทารุณแห่งชีวิตในทุ่งสเตปป์ได้ ท่านจะผงาดขึ้นสู่ความยิ่งใหญ่ สลักเสลาตำนานแห่งการพิชิตชัย, หรือเหล่าประชาของท่านจักสูญสลายไปในพงศาวดาร? ทางเลือกย่อมเป็นของท่าน"
 dlc_021: "$DLC021_BP4$"
 dlc_021_desc: "เริ่มต้นรัชสมัยของท่านอย่างสง่างาม! สร้างความชอบธรรมให้อำนาจของท่านผ่านพิธีกรรมอันน่าเกรงขามที่เรียกความเคารพจากทั้งข้าหลวงและคู่แข่งโดยถ้วนหน้า นับ แต่มงกุฎสัมผัสแรก มรดกของท่านจะถูกหลอมรวมขึ้นในความยิ่งใหญ่ด้วยพิธีบรมราชาภิเษก"
 dlc_022: "$DLC022_EP4$"
 dlc_022_desc: "ด้วย ทั่วใต้หล้า ประวัติศาสตร์อันกว้างใหญ่และเปี่ยมพลวัตของเอเชียตะวันออกจักมีชีวิตชีวาขึ้น จงอ้างอาณัติสวรรค์ รวมผู้คนของท่านให้เป็นหนึ่ง และกำหนดอนาคตของเหล่าจักรวรรดิในภาคขยายอันยิ่งใหญ่นี้!"
 dlc_023: "$DLC023_CP5$"
 dlc_023_desc: "เตรียมตัวให้พร้อมสำหรับสงครามด้วยอุปกรณ์ใหม่สุดอลังการกับเครื่อง แต่งกายสงครามยุคกลางสูง (High Medieval Warfare Attire) แพ็กผู้สร้างนี้โดยม็อดเดอร์ JedNick ประกอบด้วยหมวก เครื่องสวมศีรษะ และชุดเกราะยุโรปตะวันตกหลากหลายรูปแบบจากยุคกลางสูง"
 dlc_024: "$DLC024_CP6$"
 dlc_024_desc: "เพิ่มความหลากหลายและรายละเอียดทางประวัติศาสตร์ให้กับแผนที่ของท่านด้วยศาสนสถานศักดิ์สิทธิ์ (Holy Buildings) แพ็กผู้สร้างนี้โดยม็อดเดอร์ Kefir úr ประกอบด้วยโมเดล 3 มิติใหม่สำหรับอาคารทางศาสนา ตั้งแต่โบสถ์เล็กๆ ไปจนถึงอนุสรณ์สถานอันยิ่งใหญ่ ศาสนสถานศักดิ์สิทธิ์จะนำรสชาติทางศาสนาและท้องถิ่นมาสู่เกมของท่านมากยิ่งขึ้น!"
 dlc_025: "$DLC025_CP7$"
 dlc_025_desc: "ค้นพบเครื่องแต่งกาย ชุดเกราะ และการตั้งถิ่นฐานอันเป็นเอกลักษณ์ของแปซิฟิกเหนือ ซึ่งได้รับแรงบันดาลใจจากวัฒนธรรมไอนุ นิฟข์ และเอมิชิ"
 dlc_026: "$DLC026_CP8$"
 dlc_026_desc: "ยกระดับแผนที่โลกด้วยสิ่งปลูกสร้างอันยิ่งใหญ่และสถานที่ศักดิ์สิทธิ์ซึ่งได้รับแรงบันดาลใจจากสิ่งมหัศจรรย์ทางสถาปัตยกรรมของเอเชียตะวันออก"
 dlc_027: "$DLC027_CP9$"
 dlc_027_desc: "ประดับผู้ปกครองของท่านด้วยเครื่องแต่งกายที่ประณีตและชุดพิธีการซึ่งได้รับแรงบันดาลใจจากความยิ่งใหญ่ของราชสำนักของจักรพรรดิ"
 dlc_028: "$DLC028_SP5$"
 dlc_028_desc: "สัญลักษณ์แห่งอำนาจประกอบด้วยทรงผมและเครื่องประดับศีรษะของราชวงศ์แบบใหม่เจ็ดแบบ ซึ่งได้รับแรงบันดาลใจจากรูปแบบในประวัติศาสตร์ เพื่อเน้นย้ำความสง่างามของตัวละครของท่าน"
 dlc_029: "$DLC029_MP1$"
 dlc_029_desc: "บทเพลงแห่งอาณาจักรมี 13 เพลงเพื่อบรรเลงคลอไปกับการปกครองของท่าน ตั้งแต่ท่วงทำนองในราชสำนักอันสงบสุข ไปจนถึงเพลงรบอันเร้าใจ เพลงคลาสสิกของ Crusader Kings ที่ได้รับการปรับปรุงใหม่จะบรรเลงไปพร้อมกับการเรียบเรียงเพลงเต้นรำพื้นบ้านของยุโรปแบบใหม่ ชุดเพลงนี้คือเพลงประกอบที่สมบูรณ์แบบสำหรับความทะเยอทะยานแห่งราชวงศ์ของท่าน"
