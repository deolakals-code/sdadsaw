 top_liege_redirected_to_border_wars_law_effects: "$EFFECT_LIST_BULLET$#indent_newline:3 [top_liege|E] จะเป็น [war_leader|E] ฝ่ายป้องกันเสมอใน [wars|E] ที่เกี่ยวกับ [title|E] ใด ๆ ใน [realm|E] ของตน#!"
 top_liege_not_redirected_to_border_wars_law: "การเข้าร่วมแบบมีเงื่อนไข"
 top_liege_not_redirected_to_border_wars_law_effects: "$EFFECT_LIST_BULLET$#indent_newline:3 [holders|E] ของ [title|E] ทั้งหมดภายใน [realm|E] สามารถตกเป็นเป้าหมายของ [wars|E] ที่ประกาศโดย [rulers|E] อื่นได้#!\n$EFFECT_LIST_BULLET$#indent_newline:3 [top_liege|E] จะ #N #bold ไม่#!#! เข้าไปเกี่ยวข้องในสงครามเหล่านั้นเมื่อมีการประกาศ#!\n$EFFECT_LIST_BULLET$#indent_newline:3 [top_liege|E] ยังคงสามารถเข้าร่วมสงครามในฐานะพันธมิตรได้โดยใช้ [interaction|E] #V $join_vassal_war_interaction$#!#!\n\n#weak เจ้านายสูงสุดมีแนวโน้มที่จะเข้าร่วมมากขึ้น:\n$EFFECT_LIST_BULLET$#indent_newline:3 บรรดาศักดิ์ที่เป็นข้อพิพาทคือระดับราชอาณาจักรหรือสูงกว่า#!\n$EFFECT_LIST_BULLET$#indent_newline:3 สงครามมีเป้าหมายหลายบรรดาศักดิ์#!\n$EFFECT_LIST_BULLET$#indent_newline:3 สงครามกินเวลามากกว่า 5 ปี#!\n$EFFECT_LIST_BULLET$#indent_newline:3 หากฝ่ายป้องกันอ่อนแอกว่าฝ่ายโจมตี#!\nเจ้านายสูงสุดจะ #bold ไม่#! เข้าร่วม:\n$EFFECT_LIST_BULLET$#indent_newline:3 ในช่วงปีแรกของสงคราม#!\n$EFFECT_LIST_BULLET$#indent_newline:3 เมื่อกำลังอยู่ในสงคราม#!\n$EFFECT_LIST_BULLET$#indent_newline:3 เมื่อมีหนี้สิน#!\n$EFFECT_LIST_BULLET$#indent_newline:3 หากฝ่ายป้องกันแข็งแกร่งกว่าฝ่ายโจมตี#!"
