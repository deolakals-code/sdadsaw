 camp_purpose: "จุดประสงค์ของค่าย"
 camp_purpose_pass_phrase: "ให้เป็น [Law.GetNameNoTooltip]"
 camp_purpose_confirmation_button_text: "เปลี่ยนเจตจำนงค่าย"
 camp_purpose_mercenaries: "ดาบรับจ้าง"
 camp_purpose_mercenaries_effects: "$EFFECT_LIST_BULLET$พบ [mercenary_task_contracts|E] มากขึ้น\n$EFFECT_LIST_BULLET$พบ [task_contracts|E] ด้าน [prowess|E] และ [martial|E] มากขึ้น\n$EFFECT_LIST_BULLET$ปลดล็อก [camp_buildings|E]:\n$BULLET_WITH_TAB$#high [GetDomicileBuilding('baggage_train_siege_engineers').GetName]#!\n$BULLET_WITH_TAB$#high [GetDomicileBuilding('proving_grounds_lockwagon').GetName]#!\n$BULLET_WITH_TAB$#high [GetDomicileBuilding('camp_perimeter_palisade').GetName]#!\n$BULLET_WITH_TAB$#high [GetDomicileBuilding('camp_perimeter_ditch').GetName]#!\n$EFFECT_LIST_BULLET$สามารถเข้าถึง [officers|E] พิเศษบางตำแหน่ง:\n$BULLET_WITH_TAB$[GetCourtPositionType('chief_engineer_camp_officer').GetName()] #weak (ปลดล็อกผ่าน $baggage_train_siege_engineers_domicile_building$)#!\n$BULLET_WITH_TAB$[GetCourtPositionType('master_of_spoils_camp_officer').GetName()] #weak (ปลดล็อกผ่าน $proving_grounds_lockwagon_domicile_building$)#!\n\n#WEAK ทหารรับจ้างหาเงินด้วยดาบเป็นอันดับแรกและสำคัญที่สุด โดยปกติแล้วจะถูกกฎหมาย แต่เมื่อถึงคราวลำบากและสิ่งที่คุณมีคือขวาน...#!"
 camp_purpose_wanderers: "ผู้พเนจร"
 camp_purpose_wanderers_effects: "$EFFECT_LIST_BULLET$โอกาสเท่ากันในการพบ [task_contracts|E] ทุกประเภท\n$EFFECT_LIST_BULLET$อาจเปลี่ยนเป็น $camp_purpose$ อื่นใดก็ได้โดยไม่ต้องจ่าย [prestige|E] จำนวนมาก\n\n#WEAK ถนนที่เปิดกว้างมอบอิสรภาพที่ไม่เหมือนใคร: เหตุใดจึงต้องทำให้มัวหมองด้วยช่องทางที่ไม่จำเป็น?#!"
 camp_purpose_scholars: "นักปราชญ์"
 camp_purpose_scholars_effects: "$EFFECT_LIST_BULLET$พบ [task_contracts|E] ด้าน [learning|E] และ [stewardship|E] มากขึ้น\n$EFFECT_LIST_BULLET$พบ [task_contracts|E] ด้าน [diplomacy|E] มากขึ้นเล็กน้อย\n$EFFECT_LIST_BULLET$ปลดล็อก [camp_buildings|E]:\n$BULLET_WITH_TAB$#high [GetDomicileBuilding('barber_tent_reference_corpus').GetName]#!\n$BULLET_WITH_TAB$#high [GetDomicileBuilding('barber_tent_morticians_tools').GetName]#!\n$BULLET_WITH_TAB$#high [GetDomicileBuilding('baggage_train_siege_engineers').GetName]#!\n$BULLET_WITH_TAB$#high [GetDomicileBuilding('baggage_train_scribes').GetName]#!\n$BULLET_WITH_TAB$#high [GetDomicileBuilding('baggage_train_ascetics').GetName]#!\n$BULLET_WITH_TAB$#high [GetDomicileBuilding('camp_fire_nightly_debates').GetName]#!\n$BULLET_WITH_TAB$#high [GetDomicileBuilding('proving_grounds_martial_study').GetName]#!\n$EFFECT_LIST_BULLET$สามารถเข้าถึง [officers|E] พิเศษบางตำแหน่ง:\n$BULLET_WITH_TAB$[GetCourtPositionType('chief_engineer_camp_officer').GetName()] #weak (ปลดล็อกผ่าน $baggage_train_siege_engineers_domicile_building$)#!\n\n#WEAK หนังสือที่เก็บไว้ในห้องสมุดแห่งเดียวคือความกระสับกระส่าย ความคิดที่อยู่ในใจเพียงคนเดียวคือความสูญเปล่า#!"
 camp_purpose_explorers: "นักสำรวจ"
 camp_purpose_explorers_effects: "$EFFECT_LIST_BULLET$พบ [transport_task_contracts|E] มากขึ้น\n$EFFECT_LIST_BULLET$พบ [task_contracts|E] ด้าน [diplomacy|E] และ [intrigue|E] มากขึ้น\n$EFFECT_LIST_BULLET$พบ [task_contracts|E] ด้าน [martial|E] มากขึ้นเล็กน้อย\n$EFFECT_LIST_BULLET$ปลดล็อก [camp_buildings|E]:\n$BULLET_WITH_TAB$#high [GetDomicileBuilding('supply_tent_reserve_provisions').GetName]#!\n$BULLET_WITH_TAB$#high [GetDomicileBuilding('supply_tent_reserve_water').GetName]#!\n$BULLET_WITH_TAB$#high [GetDomicileBuilding('supply_tent_climbing_gear').GetName]#!\n$BULLET_WITH_TAB$#high [GetDomicileBuilding('camp_fire_local_hangers_on').GetName]#!\n$BULLET_WITH_TAB$#high [GetDomicileBuilding('camp_perimeter_extra_watch').GetName]#!\n\n#WEAK ยังมีเนินเขาอื่น ภูเขาอื่น วัฒนธรรมอื่น ภาษาอื่น รออยู่เสมอ ณ ขอบฟ้านั้น...#!"
 camp_purpose_brigands: "โจรสลัดบก"
 camp_purpose_brigands_effects: "$EFFECT_LIST_BULLET$พบ [criminal_task_contracts|E] ทุกประเภทมากขึ้น\n$EFFECT_LIST_BULLET$พบ [task_contracts|E] ด้าน [prowess|E] และ [intrigue|E] มากขึ้น\n$EFFECT_LIST_BULLET$ปลดล็อก [camp_buildings|E]:\n$BULLET_WITH_TAB$#high [GetDomicileBuilding('supply_tent_subdued_gear').GetName]#!\n$BULLET_WITH_TAB$#high [GetDomicileBuilding('barber_tent_morticians_tools').GetName]#!\n$BULLET_WITH_TAB$#high [GetDomicileBuilding('baggage_train_ransom_cages').GetName]#!\n$BULLET_WITH_TAB$#high [GetDomicileBuilding('baggage_train_negotiators').GetName]#!\n$BULLET_WITH_TAB$#high [GetDomicileBuilding('camp_fire_juicy_rumors').GetName]#!\n$BULLET_WITH_TAB$#high [GetDomicileBuilding('proving_grounds_lockwagon').GetName]#!\n$BULLET_WITH_TAB$#high [GetDomicileBuilding('proving_grounds_the_stick_game').GetName]#!\n$EFFECT_LIST_BULLET$สามารถเข้าถึง [officers|E] พิเศษบางตำแหน่ง:\n$BULLET_WITH_TAB$[GetCourtPositionType('master_thief_camp_officer').GetName()] #weak (ปลดล็อกผ่าน $supply_tent_subdued_gear_domicile_building$)#!\n$BULLET_WITH_TAB$[GetCourtPositionType('person_haggler_camp_officer').GetName()] #weak (ปลดล็อกผ่าน $baggage_train_ransom_cages_domicile_building$)#!\n$BULLET_WITH_TAB$[GetCourtPositionType('master_of_spoils_camp_officer').GetName()] #weak (ปลดล็อกผ่าน $proving_grounds_lockwagon_domicile_building$)#!\n\n#WEAK "โจร" เป็นคำที่น่าเกลียด — ไม่มีอะไรผิดกับการตัดสินใจเด็ดขาดและปฏิบัติได้จริง โดยเฉพาะอย่างยิ่งหากคุณสามารถทำกำไรได้อย่างงดงามในเวลาเดียวกัน#!"
 camp_purpose_legitimists: "ผู้สนับสนุนความชอบธรรม"
 camp_purpose_legitimists_effects: "$EFFECT_LIST_BULLET$โอกาสเท่ากันในการพบ [task_contracts|E] ทุกประเภท\n$EFFECT_LIST_BULLET$สามารถใช้ปฏิสัมพันธ์ $request_laamp_legitimist_support$ กับกษัตริย์และจักรพรรดิได้\n$EFFECT_LIST_BULLET$สามารถใช้ [casus_belli|E] $claim_cb$ ได้\n$EFFECT_LIST_BULLET$พบ [task_contract|E] $laamp_legitimist_support_contract$ ที่ไม่เหมือนใคร\n$EFFECT_LIST_BULLET$ปลดล็อก [camp_buildings|E]:\n$BULLET_WITH_TAB$#high [GetDomicileBuilding('camp_fire_future_dreams').GetName]#!\n$BULLET_WITH_TAB$#high [GetDomicileBuilding('proving_grounds_bodyguard_drills').GetName]#!\n$BULLET_WITH_TAB$#high [GetDomicileBuilding('proving_grounds_martial_study').GetName]#!\n$BULLET_WITH_TAB$#high [GetDomicileBuilding('proving_grounds_lockwagon').GetName]#!\n$BULLET_WITH_TAB$#high [GetDomicileBuilding('baggage_train_scribes').GetName]#!\n$BULLET_WITH_TAB$#high [GetDomicileBuilding('baggage_train_proof_of_claims').GetName]#!\n$BULLET_WITH_TAB$#high [GetDomicileBuilding('baggage_train_ransom_cages').GetName]#!\n$EFFECT_LIST_BULLET$สามารถเข้าถึง [officers|E] พิเศษบางตำแหน่ง:\n$BULLET_WITH_TAB$[GetCourtPositionType('witness_camp_officer').GetName()] #weak (ปลดล็อกผ่าน $baggage_train_proof_of_claims_domicile_building$)#!\n$BULLET_WITH_TAB$[GetCourtPositionType('master_of_spoils_camp_officer').GetName()] #weak (ปลดล็อกผ่าน $proving_grounds_lockwagon_domicile_building$)#!\n\n#WEAK สิทธิ์เรียกร้อง พวกเขาเรียกมันว่าอย่างนั้น แค่สิทธิ์เรียกร้อง มันไม่ใช่แค่สิทธิ์เรียกร้อง มันคือจดหมายหนี้ คำประกาศเจตนา และเครื่องหมายที่แน่นอนของการทวงคืนที่ยังมาไม่ถึง#!"
