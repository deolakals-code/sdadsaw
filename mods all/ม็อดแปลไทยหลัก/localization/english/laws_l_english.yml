 imperial_bureaucracy_2_effects_not_in_prev: "$EFFECT_LIST_BULLET$#indent_newline:3 ค่าใช้จ่ายสำหรับ [liege|E] ในการเรียกพล [provincial_armies|E]: [influence_i|E]#P -[EmptyScope.ScriptValue('admin_law_cost_reduction_value')|+0%]#!#!\n$EFFECT_LIST_BULLET$#indent_newline:3 [vassals|E] ที่ไม่ใช่ [governor|E] ไม่สามารถก่อ [war|E] ใดๆ ได้ เว้นแต่พวกเขาจะใช้ [hook|E] กับ [liege|E] ของพวกเขา#!"
