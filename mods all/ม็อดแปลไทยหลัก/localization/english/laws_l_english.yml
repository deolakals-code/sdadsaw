 meritocratic_bureaucracy_1_effects: "$EFFECT_LIST_BULLET$สามารถเพิกถอน [titles|E] ได้\n$EFFECT_LIST_BULLET$สามารถเรียกคืน [vassals|E] ได้"
 meritocratic_bureaucracy_1_effects_not_in_prev: "$EFFECT_LIST_BULLET$#indent_newline:3 [vassals|E] ที่ไม่ใช่ [governor|E] ไม่สามารถก่อ [war|E] ต่อสู้กับวาสซัลอื่นได้ เว้นแต่พวกเขาจะใช้ [hook|E] กับ [liege|E] ของพวกเขา#!"
 meritocratic_bureaucracy_2: "กระทรวงรวมศูนย์"
