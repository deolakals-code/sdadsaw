 action_upgrade_tribal_holding_type_HELP:0 "\n\n#help $game_concept_tribal$ $game_concept_holdings$ มีประโยชน์อย่างมากสำหรับ [rulers|E] ที่มี [government|E] $game_concept_tribal$ แต่ไม่สามารถปกครองได้อย่างเหมาะสมโดยผู้อื่น อย่างไรก็ตาม ด้วยการลงทุน [gold|E] ในการปฏิรูปชนเผ่าท้องถิ่น [holding_type|E] สามารถเปลี่ยนแปลงอย่างถาวรเป็น $game_concept_castle$ ซึ่งใครๆ ก็สามารถบริหารจัดการได้!#!"

