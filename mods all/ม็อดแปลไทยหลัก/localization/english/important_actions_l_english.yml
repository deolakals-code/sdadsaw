 action_can_use_hook_to_change_contract_desc:1 "เนื่องจากท่านมี [hook|E] เหนือ [vassal|E] [GetGovernment( 'feudal_government' ).GetName] ของท่าน [recipient.GetUIName] ท่านสามารถใช้มันเพื่อแก้ไข [vassal_contract|E] ของพวกเขาได้\n\n#help การเพิ่ม [vassals_possessive|E] ของ [obligations|E] ต่อท่านเป็นการใช้ [hook] ที่คุ้มค่าที่สุดอย่างหนึ่ง\n\nโดยปกติ การเสนอการเปลี่ยนแปลง [vassal_contract|E] ที่ไม่ยุติธรรมจะก่อให้เกิด [tyranny|E] – แต่ท่านหลีกเลี่ยงสิ่งนี้ได้โดยการใช้ [hook|E] ท่านสามารถเสนอการเปลี่ยนแปลงที่ไม่ยุติธรรมได้เพียงครั้งเดียว หากมากกว่านั้นท่านจะยังคงได้รับ [tyranny]\n\nอย่าลืม #high เลือกช่อง 'ใช้สิทธิ์บังคับ'#! เมื่อแก้ไข [vassal_contract|E]!#!"
 action_can_use_hook_to_change_contract_combined_group_description:0 "เนื่องจากท่านมี [hooks|E] เหนือ [vassals|E] [GetGovernment( 'feudal_government' ).GetName] ท่านสามารถใช้มันเพื่อแก้ไข [vassal_contracts|E] ของพวกเขาได้\n\n#help การเพิ่ม [vassals_possessive|E] ของ [obligations|E] ต่อท่านเป็นการใช้ [hook] ที่คุ้มค่าที่สุดอย่างหนึ่ง\n\nโดยปกติ การเสนอการเปลี่ยนแปลง [vassal_contract|E] ที่ไม่ยุติธรรมจะก่อให้เกิด [tyranny|E] – แต่ท่านหลีกเลี่ยงสิ่งนี้ได้โดยการใช้ [hook] ท่านสามารถเสนอการเปลี่ยนแปลงที่ไม่ยุติธรรมได้เพียงครั้งเดียว หากมากกว่านั้นท่านจะยังคงได้รับ [tyranny]\n\nอย่าลืม #high เลือกช่อง 'ใช้สิทธิ์บังคับ'#! เมื่อแก้ไข [vassal_contract|E]!#!"
