 action_grant_vassal_to_rightful_liege_desc:0 "โดยการโอน [secondary_actor.GetNameNoTooltip] ให้แก่ [recipient.GetNameNoTooltip] ท่านจะกำจัดบทลงโทษ [rightful_liege|E] ได้$action_grant_vassal_to_rightful_liege_HELP$"
