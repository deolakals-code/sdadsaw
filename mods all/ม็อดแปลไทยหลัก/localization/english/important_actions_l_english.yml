 action_can_claim_liege_title_desc:2 "ท่านควบคุม [counties|E] ส่วนใหญ่ที่เป็น [de_jure|E] ของ [titles|E] หนึ่งของ [liege_possessive|E] ของท่าน ซึ่งหมายความว่าท่านสามารถใช้ [prestige|E] เพื่อรับ [unpressed_claim|E] เหนือมันได้!\n\n#help การมีสิทธิ์เรียกร้องที่ไม่ถูกกดดันเหนือบรรดาศักดิ์ระดับสูงกว่าจะเปิดโอกาสให้ท่านเพิ่มระดับยศของท่านได้ ท่านสามารถใช้มันเพื่อเริ่ม [claimant_faction|E] หรือเพียงแค่ประกาศ [war|E] โดยตรงต่อนายเหนือหัวของท่านเพื่อชิงมันมา#!"
