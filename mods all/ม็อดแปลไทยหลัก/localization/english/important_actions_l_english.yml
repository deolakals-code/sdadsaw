 action_no_player_heir_but_replacement_exists_gameover_risk_desc:1 "ท่านไม่มี [titles|E] ที่สามารถเล่นได้ ซึ่งสมาชิก [dynasty|E] ของท่านจะสืบทอดเมื่อท่านจากไป!\n\n#help ซึ่งหมายความว่าเกมของท่านจะจบลงหากท่านสิ้นพระชนม์! อย่างไรก็ตาม มีสมาชิกใน $game_concept_dynasty$ ของท่านอยู่ในลำดับถัดไปของ [line_of_succession|E] สำหรับ $game_concept_titles$ อย่างน้อยหนึ่งรายการของท่าน ท่านควรทำให้แน่ใจว่าหนึ่งในนั้นจะได้รับการสืบทอด $game_concept_title$ ระดับ [count|E] [title_rank|E] หรือสูงกว่า ผ่านการเปลี่ยน [succession_laws|E] หรือโดยการวางแผน [GetScheme('murder').GetTypeName]...#!"
