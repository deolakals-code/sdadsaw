 action_powerful_vassal_not_on_council_HELP:0 "\n\n#help ท่านควรพิจารณาให้ตำแหน่ง [councillor|E] แก่ข้าหลวงผู้ทรงอำนาจ มิฉะนั้น [opinion|E] ของพวกเขาจะลดลง และพวกเขาอาจเข้าร่วม [faction|E] ต่อต้านท่าน\n\nอย่างไรก็ตาม ไม่ใช่ทุกคนที่มี [skills|E] สูงพอที่จะมีประโยชน์ และหาก [rank|E] ของท่านสูงพอ อาจมีข้าหลวงผู้ทรงอำนาจมากกว่าจำนวนตำแหน่งในสภา#!"

