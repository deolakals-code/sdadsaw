 CREATE_USURP_TITLE_PROS_CONS:1 "\n$BULLET_WITH_TAB$ท่านอาจเพิ่ม [rank|E] ของท่าน\n$BULLET_WITH_TAB$ท่านจะได้รับ [casus_bellis|E] โดย [de_jure|E]\n$BULLET_WITH_TAB$[vassals|E] อาจพิจารณาว่าท่านเป็น [rightful_liege|E] ของพวกเขา\n$BULLET_WITH_TAB$ท่านได้รับ [prestige|E]\n\nอย่างไรก็ตาม มีข้อเสียบางประการ:\n$BULLET_WITH_TAB$ข้าหลวงของท่านอาจต้องการบรรดาศักดิ์นั้น\n$BULLET_WITH_TAB$หาก [realm|E] ของท่านมี [succession_law|E] ที่มี [realm_heirs|E] หลายคน จะส่งผลต่อผู้ที่จะได้รับบรรดาศักดิ์ใดบ้าง"
 action_above_domain_limit:1 "@domain_icon! เกิน [domain_limit|E]"
 action_above_domain_limit_label:1 "@domain_icon! เกิน [domain_limit|E]"
 action_above_domain_limit_desc:2 "ท่านมี [holdings|E] เกินขีดจำกัด [domain|E] ของท่าน ([actor.GetDomainLimit|V]) อยู่ [actor.GetDomainLimitOverrunWithoutGracePeriod|V] แห่ง ซึ่งจะลด [taxes|E] และ [levies|E] ของท่าน\n\n#help ในฐานะ [ruler|E] ท่านสามารถถือครองที่ถือครองได้ในจำนวนจำกัดเท่านั้น ที่ถือครองส่วนที่เหลือใน [realm|E] ของท่านควรถูกถือครองโดย [vassals|E] ของท่าน\n\nท่านควรมอบ [titles|E] บางส่วนพร้อมที่ถือครองออกไป [courtiers|E] และ [guests|E] เป็นตัวเลือกที่ดี เนื่องจากพวกเขาจะอ่อนแอ ข้าหลวงที่มีอยู่แล้วก็สามารถรับบรรดาศักดิ์ได้ แต่พวกเขาจะแข็งแกร่งขึ้นและอาจเป็นภัยคุกคามในอนาคต!#!"
 action_above_domain_limit_click:0 "#I คลิกเพื่อแสดงบรรดาศักดิ์ของท่าน#!"
 action_above_vassal_limit:0 "เกิน [vassal_limit|E]"
 action_above_vassal_limit_label:0 "เกิน [vassal_limit|E]"
 action_above_vassal_limit_desc:1 "ท่านมี [direct_vassals|E] เกินขีดจำกัดข้าหลวงของท่าน ([actor.GetVassalLimit|V]) อยู่ [actor.GetVassalLimitOverrun|V] คน ซึ่งจะลด [taxes|E] และ [levies|E] ที่ได้รับจาก [vassals|E] ของท่าน\n#help [ruler|E] แต่ละคนสามารถควบคุมข้าหลวงโดยตรงได้จำนวนหนึ่งเท่านั้น แทนที่จะให้พวกเขาเป็นข้าหลวงโดยตรง พวกเขาควรถูกจัดการโดยข้าหลวงคนอื่นของท่านแทน ในการทำเช่นนี้ ให้มอบข้าหลวงคนหนึ่งของท่านให้กับข้าหลวงอีกคนหนึ่ง#!"
 action_above_vassal_limit_click:0 "#I คลิกเพื่อแสดงข้าหลวงของท่าน#!"

