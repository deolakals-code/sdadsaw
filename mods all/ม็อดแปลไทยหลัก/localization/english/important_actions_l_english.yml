 action_can_propose_alliance_to_family_member:1 "@alliance_icon! ท่านสามารถเจรจาพันธมิตรได้"
 action_can_propose_alliance_to_family_member_combined_group_label:1 "@alliance_icon! ท่านสามารถเจรจาพันธมิตรได้"
 action_can_propose_alliance_to_family_member_combined_group_name:0 "$action_can_propose_alliance_to_family_member_combined_group_label$"
 action_can_propose_alliance_to_family_member_desc:3 "ท่านสามารถเจรจา [alliance|E] กับ [actor.Custom2('RelationToMe', recipient)] ของท่าน [recipient.GetUIName] ได้ เนื่องจากท่านมีสายสัมพันธ์ทางสายเลือดอยู่แล้ว\n\n[actor.Custom2('GetInOrOutsideRealmAllianceInfo', recipient)]#help \n\nโปรดระวัง! [alliances|E] บางครั้งสร้างปัญหามากกว่าผลดี...\n\nตรวจสอบให้แน่ใจว่าท่านต้องการ [alliance|E] นี้อย่างแท้จริง เนื่องจากท่านอาจถูกลากเข้าไปในความขัดแย้งที่ไร้จุดหมายของพวกเขา#!"
 action_can_propose_alliance_to_family_member_combined_group_description:3 "ท่านสามารถเจรจา [alliances|E] กับสมาชิกบางคนใน [family|E] ของท่านหรือผู้ที่พวกเขาสมรสด้วยโดยไม่ต้องจัดการ [marriage|E] ใหม่ เนื่องจากท่านมีสายสัมพันธ์ทางสายเลือดอยู่แล้ว#help \n\nโปรดระวัง! [alliances|E] บางครั้งสร้างปัญหามากกว่าผลดี...\n\nตรวจสอบให้แน่ใจว่าท่านต้องการ [alliance|E] นี้อย่างแท้จริง เนื่องจากท่านอาจถูกลากเข้าไปในความขัดแย้งที่ไร้จุดหมายของพวกเขา#!"
 action_can_propose_alliance_to_family_member_label:1 "@alliance_icon! ท่านสามารถเจรจาพันธมิตรกับ [actor.Custom2('RelationToMe', recipient)] ของท่าน [recipient.GetPrimaryTitle.Custom('GetTierIcon')][recipient.GetShortUINameNoTooltip] #low @soldier_icon![recipient.GetMilitaryStrengthText]#! [actor.Custom2('GetInOrOutsideRealm', recipient)]"
