 action_should_pay_ransom_desc:0 "[actor.Custom2('RelationToMe', secondary_recipient)] ของท่าน [secondary_recipient.Custom('GetPrimaryTitleTierIcon')][secondary_recipient.GetShortUIName] [secondary_recipient.Custom2('GetSuccessionLinePositionCurrentSituation', actor)] อยู่ใน [secondary_recipient.Custom('PrisonTypeModifier')] และอาจมีอาการป่วย หรือแม้แต่ถูก [executed|E] หากถูกทิ้งไว้ใน [prison|E] ท่านควรจ่ายค่าไถ่ของ [secondary_recipient.GetHerHis] หากท่านต้องการปกป้อง [health|E] ของ [secondary_recipient.GetHerHis]\n\nค่าไถ่ของ [secondary_recipient.GetHerHis|U] คือ @gold_icon!#V [secondary_recipient.MakeScope.ScriptValue('ransom_cost_value')|0]#! [gold|E]$action_should_pay_ransom_HELP$"
 action_should_pay_ransom_combined_group_description:0 "ท่านมีตัวละครที่สำคัญต่อท่าน ซึ่งถูก [imprisoned|E] ท่านควรจ่ายค่าไถ่ของพวกเขาหากท่านต้องการปกป้อง [health|E] ของพวกเขา$action_vassal_ransom_gives_hook_HELP$"
 action_should_pay_ransom_label:0 "@gold_icon! ท่านควรจ่ายค่าไถ่สำหรับ [actor.Custom2('RelationToMe', secondary_recipient)] ของท่าน [secondary_recipient.Custom('GetPrimaryTitleTierIcon')][secondary_recipient.GetShortUINameNoTooltip] [secondary_recipient.Custom2('GetSuccessionLinePositionCurrentSituation', actor)] @gold_icon!#V [secondary_recipient.MakeScope.ScriptValue('ransom_cost_value')|0]#!"
 action_should_pay_ransom_combined_label:0 "[actor.Custom2('RelationToMe', secondary_recipient)] ของท่าน [secondary_recipient.Custom('GetPrimaryTitleTierIcon')][secondary_recipient.GetShortUINameNoTooltip] [secondary_recipient.Custom2('GetSuccessionLinePositionCurrentSituation', actor)] @gold_icon!#V [secondary_recipient.MakeScope.ScriptValue('ransom_cost_value')|0]#!"
 action_should_pay_ransom_click:0 "#I คลิกเพื่อจ่ายค่าไถ่#!"
 action_should_pay_ransom_HELP:0 "\n\n#help ท่านควรทำให้แน่ใจว่า [heirs|E] ของท่านปลอดภัยดี โดยเฉพาะอย่างยิ่ง [player_heir|E] ของท่าน\n\nเว้นเสียแต่ว่า #EMP บังเอิญ#! ที่ [skills|E] ของพวกเขาไม่ดีและน้องๆ คนใดคนหนึ่งดีกว่า — ในกรณี เช่นนั้น การตายอย่างหลีกเลี่ยงไม่ได้ของพวกเขาในคุกใต้ดินต่างชาติก็เป็นเพียงโศกนาฏกรรมอันน่าสยดสยอง...#!"
