 action_in_debt:0 "อยู่ในภาวะหนี้สิน"
 action_in_debt_label: "@debt_icon! ท่านกำลังเป็นหนี้"
 action_in_debt_desc: "ท่านมี [gold|E] น้อยกว่า [gold_i|E]#V 0#! จึง ทำให้ตกอยู่ใน [debt|E]!\n\nการเป็นหนี้มีผลกระทบดังต่อไปนี้:\n$BULLET_WITH_TAB$ไม่สามารถประกาศ [war|E]\n$BULLET_WITH_TAB$ไม่สามารถเสริมกำลัง [men_at_arms|E] ที่ต้องใช้ [gold_i|E][gold|E]\n$BULLET_WITH_TAB$[county_corruption|E] แพร่กระจายใน [domain|E] ของท่าน\n$BULLET_WITH_TAB$[vassals|E] มีแนวโน้มที่จะเข้าร่วม [factions|E] มากขึ้น\n\nยิ่งท่านเป็นหนี้มากเท่าใด บทลงโทษที่ท่านเผชิญก็จะรุนแรงมากขึ้น ระดับหนี้ปัจจุบันของท่านมีผลกระทบเพิ่มเติมดังต่อไปนี้:\n\n[GetPlayer.GetDebtModifierDescription]\n\n#help หากท่านไม่ได้รับทองในแต่ละเดือน โปรดพิจารณาลดค่าใช้จ่ายของท่าน เช่น โดย:\n$BULLET_WITH_TAB$การยุบ [armies|E] ของท่าน\n$BULLET_WITH_TAB$ลดขนาด — หรือทำลาย — [men_at_arms|E] ของท่าน\n$BULLET_WITH_TAB$เพิ่ม [control|E] โดยใช้ [marshal|E] ของท่าน\n$BULLET_WITH_TAB$เพิกถอน [court_positions|E]#!"
 action_in_debt_click:0 ""
 action_in_treasury_debt: "$action_in_debt$"
 action_in_treasury_debt_label: "$action_in_debt_label$"
 action_in_treasury_debt_desc: "ท่านมี [treasury|E] น้อยกว่า [treasury_i|E]#V 0#! จึง ทำให้ตกอยู่ใน [treasury_debt|E]!\n\nการเป็นหนี้มีผลกระทบดังต่อไปนี้:\n$BULLET_WITH_TAB$ไม่สามารถประกาศ [war|E]\n$BULLET_WITH_TAB$ไม่สามารถเสริมกำลัง [men_at_arms|E] ที่ต้องใช้ [treasury_i|E][treasury|E]\n$BULLET_WITH_TAB$[county_corruption|E] แพร่กระจายใน [domain|E] ของท่าน\n$BULLET_WITH_TAB$[vassals|E] มีแนวโน้มที่จะเข้าร่วม [factions|E] มากขึ้น\n\nยิ่งท่านเป็นหนี้มากเท่าใด บทลงโทษที่ท่านเผชิญก็จะรุนแรงมากขึ้น ระดับหนี้ปัจจุบันของท่านมีผลกระทบเพิ่มเติมดังต่อไปนี้:\n\n[GetPlayer.GetTreasuryDebtModifierDescription]\n\n#help หากท่านไม่ได้รับคลังสมบัติในแต่ละเดือน โปรดพิจารณาลดค่าใช้จ่ายของท่าน เช่น โดย:\n$BULLET_WITH_TAB$การยุบ [armies|E] ของท่าน\n$BULLET_WITH_TAB$ลดขนาด — หรือทำลาย — [men_at_arms|E] ของท่าน\n$BULLET_WITH_TAB$เพิ่ม [control|E] โดยใช้ [marshal|E] ของท่าน\n$BULLET_WITH_TAB$เพิกถอน [court_positions|E]#!"
 action_in_treasury_debt_click: "$action_in_debt_click$"

