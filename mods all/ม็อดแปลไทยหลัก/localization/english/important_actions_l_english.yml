 action_vassal_ransom_gives_hook_click:0 "#I คลิกเพื่อจ่ายค่าไถ่#!"
 action_vassal_ransom_gives_hook_HELP:0 "\n\n#help การได้รับสิทธิ์บังคับเหนือข้าหลวงอาจมีประโยชน์ โดยเฉพาะอย่างยิ่งหากท่านต้องการเพิ่ม [obligations|E] ของพวกเขาต่อท่านโดยการเปลี่ยน [vassal_contract|E] ของพวกเขา — ซึ่งในกรณีนี้ท่านสามารถทำได้!#!"
