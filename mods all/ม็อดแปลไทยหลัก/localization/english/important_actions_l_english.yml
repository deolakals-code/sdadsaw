 action_wrong_holding_type_click:1 "#I คลิกเพื่อเลือกบรรดาศักดิ์#!"
 action_wrong_holding_type_HELP:0 "\n\n#help ผู้ปกครองแต่ละคนมีประเภทการปกครอง ซึ่งกำหนดประเภทของ [holdings|E] ที่พวกเขาสามารถจัดการได้อย่างเหมาะสม ตัวอย่างเช่น ผู้ปกครองระบบศักดินาสามารถจัดการ [castles|E] ได้อย่างเหมาะสมเท่านั้น ที่ถือครองประเภทที่ไม่ถูกต้องใดๆ แทบจะไม่มีค่า และนับรวมกับ [domain_limit|E] ของท่านเท่านั้น\n\nท่านควรมอบที่ถือครองประเภทเหล่านี้ให้แก่สมาชิก [unlanded|E] ใน [court|E] ของท่าน และพวกเขาจะกลายเป็น [vassal|E] ของท่าน#!"

