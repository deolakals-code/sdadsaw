 action_empty_council_position_desc:2 "ตำแหน่ง [council|E] ตำแหน่งหนึ่งของท่านขาด [councillor|E]\n\n#help หากตำแหน่งในสภาว่าง งานของสภาตำแหน่งนั้นจะถูกระงับ ท่านสามารถเลือกสมาชิกสภาคนใหม่ตาม [skill|E] ที่เกี่ยวข้อง หรือเพราะพวกเขาเป็น [powerful_vassal|E] ที่คาดหวังตำแหน่ง#!"
