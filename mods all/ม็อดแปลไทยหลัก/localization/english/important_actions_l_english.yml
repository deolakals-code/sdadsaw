 action_can_raze_holding_HELP: "\n\n#help หากท่านไม่ได้วางแผนที่จะตั้งถิ่นฐานโดยใช้ [decisions|E] $step_away_from_the_steppe_decision$ หรือ $settle_people_decision$, ท่านควรพิจารณาการทำลาย [holdings|E] เพื่อเปลี่ยนให้เป็น [nomadic_holdings|E]\n\n[nomadic_holdings|E] จะช่วยปรับปรุง [fertility_equilibrium|E] และทำให้ดินแดนนั้นไม่น่าดึงดูดใจสำหรับผู้ปกครองที่ตั้งถิ่นฐานแล้วในการเข้าพิชิต\n\nในการทำลายที่ดิน ให้คลิกปุ่มกลมที่มุมล่างซ้ายของมุมมองที่ดิน#!"

