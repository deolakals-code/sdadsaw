 action_not_rightful_liege_desc:3 "ท่านไม่ใช่ [rightful_liege|E] ของ [actor.Custom2('RelationToMe', recipient)] [recipient.GetShortUIName]\n\nท่านควรตรวจสอบว่าท่านสามารถ [create|E] หรือ [usurp|E] บรรดาศักดิ์ที่จะ ทำให้ท่านเป็น [liege|E] โดย [de_jure|E] ของ [recipient.GetHerHis] ได้หรือไม่ การทำ เช่นนั้นจะปรับปรุง [opinion|E] ของ [recipient.GetHerHis] ที่มีต่อท่าน รวมถึงเพิ่ม [taxes|E] และ [levies|E] ที่ท่านได้รับจาก [recipient.GetHerHim]\n\nหากไม่สามารถทำได้ ท่านอาจพิจารณา [transferring|E] พวกเขาไปยังข้าหลวงคนอื่นของท่าน โดยเฉพาะอย่างยิ่งหากข้าหลวงคนนั้นจะเป็น [rightful_liege|E] ของพวกเขา"
 action_not_rightful_liege_combined_group_description:1 "ท่านไม่ใช่ [rightful_liege|E] ของข้าหลวงหลายคนของท่าน\n\nตรวจสอบว่าท่านสามารถ [create|E] หรือ [usurp|E] บรรดาศักดิ์ ซึ่งจะ ทำให้ท่านเป็น [liege|E] โดย [de_jure|E] ของพวกเขาได้หรือไม่ การทำ เช่นนั้นจะปรับปรุง [opinion|E] ของพวกเขาที่มีต่อท่าน รวมถึงเพิ่ม [taxes|E] และ [levies|E] ที่ท่านได้รับจากพวกเขา\n\nหากไม่สามารถทำได้ ท่านอาจพิจารณา [transferring|E] พวกเขาไปยังข้าหลวงคนอื่นของท่าน โดยเฉพาะอย่างยิ่งหากข้าหลวงคนนั้นจะเป็น [rightful_liege|E] ของพวกเขา"
