 action_can_potentially_propose_alliance_to_family_member:0 "@alliance_icon! การเจรจาพันธมิตรที่เป็นไปได้"
 action_can_potentially_propose_alliance_to_family_member_combined_group_label:0 "@alliance_icon! การเจรจาพันธมิตรที่เป็นไปได้"
 action_can_potentially_propose_alliance_to_family_member_combined_group_name:0 "$action_can_potentially_propose_alliance_to_family_member_combined_group_label$"
 action_can_potentially_propose_alliance_to_family_member_desc:0 "[actor.Custom2('RelationToMe', recipient)] ของท่าน [recipient.GetUIName] จะ #EMP ไม่#! ยอมรับ [alliance|E] กับท่านในตอนนี้ แต่อาจถูกโน้มน้าวได้\n\n[actor.Custom2('GetInOrOutsideRealmAllianceInfo', recipient)]#help \n\nหากท่านพบว่าตนเองต้องการพันธมิตร การปรับปรุง [opinion|E] หรือการได้รับ [hook|E] อาจช่วยให้ท่านสามารถเจรจาได้\n\nท่านสามารถตรวจสอบว่าพวกเขาใกล้จะยอมรับข้อเสนอพันธมิตรของท่านเพียงใดโดยการวางเมาส์เหนือคะแนนการยอมรับเมื่อปฏิสัมพันธ์เปิดอยู่#!"
 action_can_potentially_propose_alliance_to_family_member_combined_group_description:0 "ตัวละครเหล่านี้จะ #EMP ไม่#! ยอมรับ [alliance|E] กับท่านในตอนนี้ แต่อาจถูกโน้มน้าวได้\n\n[actor.Custom2('GetInOrOutsideRealmAllianceInfo', recipient)]#help \n\nหากท่านพบว่าตนเองต้องการพันธมิตร การปรับปรุง [opinion|E] หรือการได้รับ [hook|E] อาจช่วยให้ท่านสามารถเจรจาได้\n\nท่านสามารถตรวจสอบว่าพวกเขาใกล้จะยอมรับข้อเสนอพันธมิตรของท่านเพียงใดโดยการวางเมาส์เหนือคะแนนการยอมรับเมื่อปฏิสัมพันธ์เปิดอยู่#!"
 action_can_potentially_propose_alliance_to_family_member_label:0 "@alliance_icon! ท่านอาจสามารถเจรจาพันธมิตรกับ [actor.Custom2('RelationToMe', recipient)] ของท่าน [recipient.GetPrimaryTitle.Custom('GetTierIcon')][recipient.GetShortUINameNoTooltip] #low @soldier_icon![recipient.GetMilitaryStrengthText]#! [actor.Custom2('GetInOrOutsideRealm', recipient)] ได้"
