 action_too_many_held_duchies_combined_group_description:3 "ท่านถือครอง [duchies|E] มากกว่าสองแห่งในฐานะ [king|E] หรือ [emperor|E] ซึ่งลด [opinion|E] ของ [vassals|E] ที่มีต่อท่าน\n\n#help ยิ่งท่านถือครอง $game_concept_duchies$ มากกว่าสองแห่งแรกมากเท่าใด ข้าหลวงของท่านก็จะยิ่งอิจฉามากขึ้นเท่านั้น แม้ว่าท่านจะสามารถเพิกเฉยต่อคำร้องเรียนของพวกเขาได้ แต่ให้พิจารณามอบ [titles|E] $game_concept_duchy$ บางส่วนของท่านออกไป\n\nท่านควรเก็บ $game_concept_duchies$ ที่ท่านถือครอง $game_concept_counties$ หลายแห่ง โดยเฉพาะอย่างยิ่ง [realm_capital|E] ของท่าน#!"
