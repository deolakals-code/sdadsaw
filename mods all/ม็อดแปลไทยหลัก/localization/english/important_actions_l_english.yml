 action_title_election_desc:1 "มีการเลือกตั้งที่กำลังดำเนินอยู่ใน [landed_title.Custom('GetTierIcon')][landed_title.GetName] ซึ่งเป็น [title|E] ที่ปกครองโดย [landed_title.GetHolder.GetShortUIName] ปัจจุบัน ผู้สมัครชั้นนำคือ [landed_title.GetHeir.GetUIName]\n\n#help หากท่านเป็น [elector|E] เป็นการคุ้มค่าที่จะติดตามการเลือกตั้งที่ดำเนินอยู่ แม้ว่าท่านจะได้ลงคะแนนเสียงไปแล้วก็ตาม จำไว้ว่าท่านสามารถเปลี่ยนคะแนนเสียงของท่านได้ตลอดเวลา!\n\nแม้ว่าท่านจะไม่ใช่ [elector|E] ก็เป็นการดีที่จะติดตามการเลือกตั้ง ท้ายที่สุด อะไรก็เกิดขึ้นได้... อาจเป็น #emp ท่าน#! ที่เป็นผู้สมัครชั้นนำ!#!"
