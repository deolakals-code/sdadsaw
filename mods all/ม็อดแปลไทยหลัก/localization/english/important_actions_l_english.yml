 action_grant_vassal_to_rightful_liege_HELP:0 "\n\n#help [vassals|E] ที่ท่านไม่ใช่ นายเหนือหัวโดยชอบธรรม จะให้ทรัพยากรแก่ท่านน้อยลงและมี [opinion|E] ลดลงต่อท่าน บางครั้งเป็นการดีที่สุดที่จะมอบข้าหลวงเหล่านี้ให้แก่นายเหนือหัวโดยชอบธรรมของพวกเขา โดยสมมติว่าพวกเขาก็เป็นข้าหลวงของท่านด้วย\n\nบางครั้งการมอบข้าหลวงให้แก่นายเหนือหัวโดยชอบธรรมของพวกเขาหมายความว่าท่านจะได้รับน้อยลง แต่โดยปกติแล้วคุ้มค่าที่จะมอบให้อยู่ดี – นายเหนือหัวโดยชอบธรรมของพวกเขาจะมีบทลงโทษทางความคิดเห็นที่รุนแรงต่อท่านสำหรับการถือครองข้าหลวงที่พวกเขาคิดว่าเป็นของพวกเขา\n\nการรักษาโครงสร้างข้าหลวงที่ดีเป็นกุญแจสำคัญสู่อาณาจักรที่มั่นคง#!"
