 bm_1066_iberia:0 "ไอบีเรียแตกเป็นเสี่ยง"
 bm_1066_iberia_desc:0 "เมื่อกษัตริย์เฟร์นันโดที่ 1 ผู้ชราสวรรคตลง โอรสทั้งสามพระองค์ต่างได้รับมรดกเป็นส่วนหนึ่งของราชอาณาจักรไอบีเรียของพระองค์ ความโลภ ความทะเยอทะยาน และสงครามศักดิ์สิทธิ์ในไม่ช้าก็ผลักดันให้คาบสมุทรไอบีเรียเดือดพล่าน และสายสัมพันธ์ระหว่างสมาชิกในครอบครัวก็เริ่มคลอนแคลน\n\n#bold พี่น้องเฟร์นันเดซคนใดแข็งแกร่ง หรือมีเล่ห์เหลี่ยม พอที่จะได้รับชัยชนะเหนือผู้อื่น? สงครามและการทูตจะหล่อหลอมคาบสมุทรไอบีเรียอย่างไร?#!"

 # Carcía Fernandez, King of Galicia, Iberia
 bookmark_iberia_king_garcia:0 "กษัตริย์การ์เซีย"
 bookmark_iberia_king_garcia_subheading: "$BOOKMARK_SUBHEADING_DEFAULT$"
 bookmark_iberia_king_garcia_desc:0 "การ์เซียได้รับราชอาณาจักรที่วุ่นวายที่สุดในบรรดาสามพี่น้อง พระองค์พยายามใช้วิธีการสุดโต่งหลายอย่างเพื่อรักษาเสถียรภาพในการปกครอง อย่างไรก็ตาม ดินแดนที่เปราะบางนี้ในไม่ช้าก็เย้ายวนเกินไปสำหรับพระเชษฐาอัลฟองโซ ซึ่งบุกเข้ามาในปี 1071 การโจมตีครั้งนี้จุดชนวนสงครามมากมายที่ตามมาระหว่างพี่น้อง แต่การ์เซียจะใช้เวลาส่วนใหญ่อยู่หลังลูกกรง\n\n#bold จับอาวุธต่อสู้กับพี่น้องของท่านและนำราชอาณาจักรที่ไม่มั่นคงนี้ไปสู่ความรุ่งโรจน์และชัยชนะ!#!"

 bookmark_iberia_king_alfonso_alt_sancha:0 "$Sancha$"
 bookmark_iberia_king_alfonso_alt_nuno:0 "$NuN_o$"

 # Alfonso VI Fernandez, King of León, Iberia
 bookmark_iberia_king_alfonso:0 "กษัตริย์อัลฟองโซที่ 6"
 bookmark_iberia_king_alfonso_subheading: "$BOOKMARK_SUBHEADING_DEFAULT$"
 bookmark_iberia_king_alfonso_desc:0 "โอรสองค์กลาง และเป็นที่โปรดปรานของพระบิดา อัลฟองโซได้รับมรดกราชอาณาจักรเลออนอันมั่งคั่งที่อยู่ตรงกลาง พระองค์ดำเนินการต่อไปเพื่อเอาชนะและปราบปรามพี่น้องทั้งสองพระองค์ และปกครองราชอาณาจักรที่รวมกันเป็นหนึ่งเดียวของพระบิดา\n\n#bold ด้วยการทูตและการรุกรานทางการเมืองและครอบครัว ท่านมีคุณสมบัติพอที่จะรวมสามราชอาณาจักรไว้ภายใต้ธงผืนเดียวหรือไม่?#!"

 # Sancho II Fernandez, King of Castile, Iberia
 bookmark_iberia_king_sancho:0 "กษัตริย์ซานโชที่ 2"
 bookmark_iberia_king_sancho_subheading: "$BOOKMARK_SUBHEADING_DEFAULT$"
 bookmark_iberia_king_sancho_desc:0 "ซานโชถูกโกงมรดกเต็มส่วนโดยการแบ่งดินแดนของพระบิดาให้แก่พี่น้องทั้งสามพระองค์ ในฐานะชายผู้แสวงหาโอกาส พระองค์รีบจับอาวุธต่อสู้กับพี่น้องทันทีที่สันติภาพเริ่มพังทลาย แต่ได้ปกครองราชอาณาจักรที่รวมกันเป็นหนึ่งเดียวเพียงช่วงสั้น ๆ ก่อนที่จะถูกลอบสังหาร\n\n#bold ด้วยปฏิบัติการทางทหารและการวางแผน ท่านจะสามารถฟื้นฟูราชอาณาจักรเต็มรูปแบบให้กลับมารุ่งโรจน์ภายใต้ผู้ปกครองที่ชอบธรรมเพียงผู้เดียว และรักษาอำนาจไว้ได้หรือไม่?#!"

 bookmark_iberia_king_sancho_alt_rodrigo:0 "$Rodrigo$"

 # Urraca Fernandez, Countess of Zamorra, Iberia
 bookmark_iberia_infanta_urraca:0 "เจ้าหญิงอูร์รากา"
 bookmark_iberia_infanta_urraca_subheading: "$BOOKMARK_SUBHEADING_DEFAULT$"
 bookmark_iberia_infanta_urraca_desc:0 "โอรสธิดาองค์โตสุดของเฟร์นันโด อูร์รากามีอิทธิพลอย่างกว้างขวางทั้งต่อพี่น้องชายและศาสนจักร พระนางและพระขนิษฐาเอลบีราได้รับอำนาจปกครองเหนืออารามทั้งหมดในสามราชอาณาจักร และพระนางไม่ได้นิ่งเฉย ในขณะที่พี่น้องชายฉีกกระชากกันเอง\n\n#bold เพื่อเอาชนะพี่น้องชายและรักษาตำแหน่งของตนในประวัติศาสตร์ อูร์รากาต้องการทั้งความอดทนและความกล้าหาญ – ท่านจะประสบความสำเร็จหรือไม่?#!"

 bookmark_iberia_infanta_urraca_alt_elvira:0 "$Elvira$"

 # Antso IV Gartziez, King of Navarra, Iberia
 bookmark_iberia_king_antso:0 "กษัตริย์อันโซที่ 4"
 bookmark_iberia_king_antso_subheading: "$BOOKMARK_SUBHEADING_DEFAULT$"
 bookmark_iberia_king_antso_desc:1 "ขุนนางจำนวนมากทางตะวันตกของราชอาณาจักรละทิ้งกษัตริย์อันโซหลังจากที่พระองค์ขึ้นครองบัลลังก์หลังจากการสวรรคตของพระบิดามารดา ในไม่ช้าพระองค์ก็พัวพันในสงครามกับพระญาติกษัตริย์ซานโช ซึ่งเห็นอันโซพ่ายแพ้ และหลังจากการปกครองที่เต็มไปด้วยสงครามและความพ่ายแพ้ พระองค์ก็ถูกลอบสังหารโดยพี่น้องของพระองค์เอง\n\n#bold เขียนประวัติศาสตร์ใหม่ เอาชนะครอบครัวของท่าน และรักษาอาณาเขตและมรดกของท่าน!#!"

 bookmark_iberia_king_antso_alt_ramiro:0 "$Ramiro$"
 bookmark_iberia_king_antso_alt_sancho:0 "$Sancho$"
