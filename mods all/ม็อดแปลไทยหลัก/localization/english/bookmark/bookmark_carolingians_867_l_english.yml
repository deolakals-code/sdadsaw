 bm_867_carolingians:0 "ราชวงศ์คาโรแล็งเชียง"
 bm_867_carolingians_desc:1 "หลังจากการสวรรคตของหลุยส์ผู้ศรัทธา จักรวรรดิคาโรแล็งเชียงอันยิ่งใหญ่ครั้งหนึ่งได้ถูกแบ่งออกเป็นสามราชอาณาจักรที่แยกจากกัน คือ ฟรังเกียตะวันออก ฟรังเกียตะวันตก และฟรังเกียกลาง นับ แต่นั้นมา อาณาจักรเหล่านี้ก็แตกแยกออกไปอีกเมื่อสงคราม การกบฏ และการสืบมรดกต่าง ๆ ก่อให้เกิดความไม่มั่นคงและการแตกกระจาย\n\n#bold มีคาโรแล็งเชียงคนใดแข็งแกร่งพอที่จะรวมจักรวรรดิของตนกลับคืนมาได้หรือไม่? หรือการทะเลาะวิวาทในครอบครัวจะทำให้พวกเขาอ่อนแอและถูกฉวยโอกาสโดยพวกฉวยโอกาส?#!"

 #Charles the Bald
 bookmark_carolingians_charles_the_bald:0 "ชาร์ลส์ผู้ศีรษะล้าน"
 bookmark_carolingians_charles_the_bald_subheading: "$BOOKMARK_SUBHEADING_DEFAULT$"
 bookmark_carolingians_charles_the_bald_desc:0 "ในขณะที่ชาร์ลส์ประสูติ เหล่าพระเชษฐาต่างมารดาที่เจริญพระชันษาเต็มที่แล้วต่างปกครองราชอาณาจักรของตนเองภายในจักรวรรดิคาโรแล็งเชียง เมื่อไม่มีมงกุฎเป็นของตนเอง พระองค์จึงเป็นที่รู้จักในนาม 'ผู้ศีรษะล้าน' แม้ว่าในที่สุดพระองค์จะได้รับสืบทอดอากีแตนและฟรังเกียตะวันตกก็ตาม ในอนาคตพระองค์จะได้สืบทอดอิตาลีและจักรวรรดิโรมันอันศักดิ์สิทธิ์ด้วยซ้ำ แต่สายเลือดของพระองค์จะไม่ยืนยง — พระนัดดาองค์สุดท้ายจะสิ้นพระชนม์โดยไร้รัชทายาทเพียงเจ็ดปีหลังจากการสวรรคตของพระองค์เอง\n\n#bold ท่านจะสามารถเปลี่ยนเส้นทางประวัติศาสตร์และรับประกันสายเลือดที่ยืนยาวและรุ่งเรืองของทายาทชาร์ลส์ได้หรือไม่?#!"

 bookmark_carolingians_charles_the_bald_alt_judith:0 "$Judith$"
 bookmark_carolingians_charles_the_bald_alt_louis:0 "$Louis$ $nick_the_stammerer$"

 #King Lothaire
 bookmark_carolingians_king_lothaire:0 "กษัตริย์โลแทร์ที่ 2"
 bookmark_carolingians_king_lothaire_subheading: "$BOOKMARK_SUBHEADING_DEFAULT$"
 bookmark_carolingians_king_lothaire_desc:0 "แม้ว่าพระองค์จะทรงรักวัลดราดา ชายาของพระองค์ แต่พระบิดาของโลแทร์บังคับให้พระองค์อภิเษกสมรสทางการเมืองกับทอยต์แบร์กา การอภิเษกสมรสของพวกเขามิได้ให้กำเนิดบุตร และชีวิตของโลแทร์คือการต่อสู้อย่างต่อเนื่องเพื่อหย่าขาดจากพระมเหสีและ ทำให้บุตรนอกสมรสของพระองค์ได้รับการรับรอง แม้ว่าพระองค์จะไม่เคยหยุดพยายาม โลแทร์จะสวรรคตโดยไม่มีทายาทตามกฎหมาย\n\n#bold ท่านจะสามารถเอาชนะกลอุบายของผู้ที่วางแผนต่อต้านท่านและรับประกันความต่อเนื่องของตระกูลของท่านได้หรือไม่?#!"

 bookmark_carolingians_king_lothaire_alt_waldrada:0 "$Waldrada$"
 bookmark_carolingians_king_lothaire_alt_teutberga:0 "$Teutberga$"

 #Ludwig the German
 bookmark_carolingians_ludwig_the_german:0 "ลุดวิกชาวเยอรมัน"
 bookmark_carolingians_ludwig_the_german_subheading: "$BOOKMARK_SUBHEADING_DEFAULT$"
 bookmark_carolingians_ludwig_the_german_desc:0 "ลุดวิกเป็นบุรุษผู้ทะเยอทะยาน แสวงหาที่จะยึดคืนส่วนต่าง ๆ ของจักรวรรดิที่เขามองว่าเป็นสิทธิ์โดยกำเนิดมานานแล้ว อย่างไรก็ตาม ความทะเยอทะยานเหล่านี้ประสบกับความพ่ายแพ้ครั้งแล้วครั้งเล่า เนื่องจากการทัพต่าง ๆ ของเขาทั้งหมดจบลงด้วยความล้มเหลว และเหล่าโอรสผู้ก่อกบฏของเขาก็ได้แย่งชิงดินแดนส่วนใหญ่ไปจากการควบคุมของเขา\n\n#bold ท่านจะสามารถพลิกผันโชคร้ายของลุดวิกและทวงคืนจักรวรรดิให้แก่ทายาทของเขาได้หรือไม่ หรือโอรสของเขาถูกลิขิตให้เป็นเพียงเชิงอรรถในประวัติศาสตร์?#!"

 bookmark_carolingians_ludwig_the_german_alt_youngerludwig:0 "$Ludwig$ $nick_the_younger$"
 bookmark_carolingians_ludwig_the_german_alt_karl:0 "$Karl$"

 #King Louis of Italy
 bookmark_carolingians_king_louis:0 "กษัตริย์หลุยส์ที่ 2"
 bookmark_carolingians_king_louis_subheading: "$BOOKMARK_SUBHEADING_DEFAULT$"
 bookmark_carolingians_king_louis_desc:1 "อำนาจของจักรวรรดิลดน้อยลงมากเมื่อถึงเวลาที่หลุยส์ได้รับการสวมมงกุฎเป็นจักรพรรดิโรมันอันศักดิ์สิทธิ์ จนตำแหน่งนี้ไม่มีอำนาจที่แท้จริงอีกต่อไป แม้ว่าพระองค์จะสามารถทวงคืนราชอาณาจักรโพรวองซ์ได้ แต่เหล่าพระปิตุลาและพระเชษฐาของหลุยส์ ซึ่งไม่ผูกพันกับความจงรักภักดีต่อมงกุฎจักรวรรดิ แต่อย่างใด ยังคงกระทำการตามอำเภอใจต่อไป หลุยส์ที่ 2 ซึ่งต้องเผชิญกับเพื่อนบ้านที่ชอบทะเลาะวิวาทและอาณาจักรที่ไม่มั่นคง จะสวรรคตก่อนที่จะมีโอรส\n\n#bold ท่านจะสามารถทวงคืนดินแดนที่สูญเสียไปทั้งหมดของจักรวรรดิและสถาปนามงกุฎจักรวรรดิให้เป็นอำนาจที่แท้จริงอีกครั้งได้หรือไม่?#!"

 bookmark_carolingians_king_louis_alt_ermengarde:0 "$Ermengarde$"
 bookmark_carolingians_king_louis_alt_engelberga:0 "$Engelberga$"

 # King Karlmann of Bavaria
 bookmark_carolingians_king_karlmann:1 "เจ้าชายคาร์โลมันน์"
 bookmark_carolingians_king_karlmann_subheading: "$BOOKMARK_SUBHEADING_DEFAULT$"
 bookmark_carolingians_king_karlmann_desc:0 "คาร์โลมันน์ โอรสองค์โตของลุดวิกชาวเยอรมัน ก่อกบฏต่อพระบิดาและบังคับให้พระองค์มอบการควบคุมดินแดนบาวาเรียให้แก่เขา เขาจะขยายอาณาเขตนี้ในสงครามกับพวกสลาฟทางตะวันออก และต่อมาจะได้รับเลือกเป็นกษัตริย์แห่งอิตาลีด้วยซ้ำ — แม้ว่าโรคหลอดเลือดสมองอันโชคร้ายจะบังคับให้เขาสละราชบัลลังก์บาวาเรียและอิตาลีให้แก่พระอนุชาของเขา เขาจะสิ้นพระชนม์ในอีกไม่กี่ปีต่อมา\n\n#bold ด้วยโชคช่วยเล็กน้อย ท่านจะสามารถหลีกเลี่ยงการสิ้นพระชนม์อันโชคร้ายของคาร์โลมันน์และสร้างมรดกที่จะคงอยู่ชั่วกาลนานได้หรือไม่?#!"

 bookmark_carolingians_king_karlmann_alt_arnulf:0 "$Arnulf$"
 bookmark_carolingians_king_karlmann_alt_hemma:0 "$Hemma$"
