l_english: 
 bm_1066_hastings:0 "ชะตากรรมแห่งอังกฤษ"
 bm_1066_hastings_desc:2 "เมื่อกษัตริย์เอ็ดเวิร์ดผู้สารภาพบาป ซึ่งไร้รัชทายาทสวรรคตลง อังกฤษก็ตกอยู่ในวิกฤตการสืบราชบัลลังก์อย่างที่ไม่เคยมีมาก่อน\n\nชายสามคนพยายามที่จะยึดครองบัลลังก์เพื่อตนเอง: ฮาโรลด์ กอดวินสัน, วิลเลียมบุตรนอกสมรส และฮารัลด์ ฮาร์ดราเด ในขณะที่สเวนและมัลคอล์มยืนดูอยู่ข้าง ๆ พร้อมที่จะฉวยโอกาสเมื่อเห็นสัญญาณแห่งความอ่อนแอใด ๆ\n\n#bold ใครจะเป็นผู้ยืนหยัดได้รับชัยชนะหลังจากช่วงเวลาอันวุ่นวายในประวัติศาสตร์นี้?#!"

 bookmark_hastings_england:0 "กษัตริย์ฮาโรลด์แห่งอังกฤษ"
 bookmark_hastings_england_subheading: "$BOOKMARK_SUBHEADING_DEFAULT$"
 bookmark_hastings_england_desc:2 "ฮาโรลด์ กอดวินสัน เป็นผู้นำของตระกูลขุนนางที่ทรงอำนาจ และเป็นพระเทวัน (พี่เขย/น้องเขย) ของกษัตริย์ เมื่อกษัตริย์เอ็ดเวิร์ดผู้ไร้รัชทายาทสวรรคต บัดนี้ พระองค์ได้รับเลือกเป็นกษัตริย์องค์ใหม่แห่งอังกฤษโดยเหล่าขุนนาง แต่ต้องเผชิญกับความท้าทายในการรักษาบัลลังก์ไว้ เนื่องจากดยุกแห่งนอร์ม็องดีผู้ละโมบ รวมถึงกษัตริย์ฮารัลด์แห่งนอร์เวย์ ซึ่งได้รับการยุยงและช่วยเหลือจากพระอนุชาที่ถูกเนรเทศของฮาโรลด์ ต่างก็พยายามที่จะเข้ามาแทนที่พระองค์!\n\n#bold ด้วยกองทัพขนาดใหญ่หนุนหลังและการสนับสนุนจากเหล่าขุนนางแองโกล-แซกซอน — เหล่าหมาป่าจะพบว่าพวกมันกัดคำใหญ่เกินตัวหรือไม่?#!"

 bookmark_hastings_england_alt_tostig:0 "$Tostig$"
 bookmark_hastings_england_alt_eadgifu:0 "$Eadgifu$ $nick_the_fair$"

 bookmark_hastings_normandy:0 "วิลเลียมบุตรนอกสมรส"
 bookmark_hastings_normandy_subheading: "$BOOKMARK_SUBHEADING_DEFAULT$"
 bookmark_hastings_normandy_desc:1 "ราชวงศ์นอร์ม็องดีสืบเชื้อสายมาจากไวกิ้งชาวนอร์ส และได้สถาปนาตนเองบนแผ่นดินใหญ่ของยุโรปเมื่อกว่า 200 ปีก่อน บัดนี้ วิลเลียมที่ 2 ใฝ่ฝันที่จะนำพาครอบครัวของตนไปปกครองราชอาณาจักรอังกฤษ และเชื่อว่าสถานะผู้สืบทอดบัลลังก์ของตนได้รับการสัญญาจากกษัตริย์เอ็ดเวิร์ดผู้ล่วงลับ และแม้กระทั่งได้รับการยอมรับจากฮาโรลด์ กอดวินสันเอง อย่างไรก็ตาม บัดนี้เมื่อเอ็ดเวิร์ดสิ้นพระชนม์ไปแล้ว ฮาโรลด์ได้ละเมิดคำสาบานและยึดมงกุฎไปเป็นของตนเอง!\n\n#bold วิลเลียมกำลังทำสงครามกับอังกฤษ ท่านจะสามารถรวบรวมกองกำลังและอ้างสิทธิ์ในสิ่งที่ชอบธรรมของท่านได้หรือไม่?#!"

 bookmark_hastings_normandy_alt_robert:0 "$Robert$ $nick_the_curthose$"
 bookmark_hastings_normandy_alt_william:0 "$William$ $nick_the_red$"

 bookmark_hastings_norway:0 "ฮารัลด์ ฮาร์ดราเด"
 bookmark_hastings_norway_subheading: "$BOOKMARK_SUBHEADING_DEFAULT$"
 bookmark_hastings_norway_desc:1 "ฮารัลด์แสดงความสามารถทางทหารอันน่าเกรงขามมาตั้งแต่เยาว์วัย เมื่อเร็ว ๆ นี้ได้พยายามและล้มเหลวในการพิชิตเดนมาร์ก บัดนี้ พระองค์มองข้ามทะเลไป — ตามสัญญาโบราณ มงกุฎแห่งอังกฤษควรตกเป็นของฮารัลด์ เมื่อกษัตริย์องค์สุดท้ายสวรรคตโดยไม่มีทายาท แต่แทนที่จะเป็น เช่นนั้น พวกแองโกล-แซกซอนกลับยกฮาโรลด์ กอดวินสันขึ้นครองบัลลังก์! โชคดีที่กษัตริย์จอมปลอมได้สร้างศัตรูไว้ และทอสติก กอดวินสัน น้องชายของฮาโรลด์เอง ก็อาศัยอยู่ในนอร์เวย์อย่างผู้ลี้ภัย...\n\n#bold โดยการใช้ศัตรูของเขาเองต่อสู้กับเขา ท่านจะสามารถมอบอำนาจควบคุมทะเลเหนือให้แก่นักรบวารันเจียนผู้นี้ได้หรือไม่?#!"
 
 bookmark_hastings_norway_alt_olaf:0 "$Olaf$"
 bookmark_hastings_norway_alt_ingegerd:0 "$Ingegerd$"

 bookmark_hastings_denmark:0 "กษัตริย์สเวนแห่งเดนมาร์ก"
 bookmark_hastings_denmark_subheading: "$BOOKMARK_SUBHEADING_DEFAULT$"
 bookmark_hastings_denmark_desc:1 "ด้วยสายสัมพันธ์ทางสายเลือดกับอังกฤษและนอร์เวย์ สเวนจึงมีสิทธิ์อ้างสิทธิ์ในบัลลังก์ทั้งสองอย่างแข็งขัน น่าเสียดายที่กองทัพของพระองค์มีขนาดเล็กและขาดระเบียบวินัย ทำให้สงครามพิชิตดินแดนเป็นไปไม่ได้ อย่างไรก็ตาม ยังมีหนทางอื่นในการไล่ตามความฝัน...\n\n#bold หากบุตรหลานของท่านได้แต่งงานกับตระกูลที่ทรงอำนาจ ก็อาจได้รับพันธมิตรที่มีประโยชน์มากมาย — พันธมิตรที่ท่านสามารถใช้ประโยชน์เพื่อก่อตั้งจักรวรรดิที่จะทัดเทียมกับโรมได้!#!"

 bookmark_hastings_denmark_alt_harald:0 "$Harald$ $nick_the_whetstone$"
 bookmark_hastings_denmark_alt_knud:0 "$Knud$"

 bookmark_hastings_scotland:0 "กษัตริย์มัลคอล์มแห่งสกอตแลนด์"
 bookmark_hastings_scotland_subheading: "$BOOKMARK_SUBHEADING_DEFAULT$"
 bookmark_hastings_scotland_desc:1 "เป็นที่รู้จักในสกอตแลนด์ในนาม "มหาประมุข" สถานการณ์ของมัลคอล์มที่ 3 นั้นเปราะบาง แต่เต็มไปด้วยโอกาส ทางใต้ ดินแดนอันอุดมสมบูรณ์ของนอร์ธัมเบรียตกอยู่ในภาวะเสี่ยง เนื่องจากอังกฤษถูกฉีกเป็นชิ้น ๆ ด้วยสงคราม แต่ขุนศึกชาวนอร์สและชาวเขาเกลิกยังคงท้าทายการปกครองของกษัตริย์ในบ้านเกิด\n\n#bold หมู่เกาะบริเตนเต็มไปด้วยอันตรายและโอกาส: ท่านจะสามารถเด็ดดอกกุหลาบจากสวนหนามแห่งนี้ได้หรือไม่?#!"

