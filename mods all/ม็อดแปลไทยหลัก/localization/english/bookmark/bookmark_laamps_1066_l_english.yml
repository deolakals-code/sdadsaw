 bm_1066_laamps: "เหล่าผู้พลัดถิ่นพเนจร"
 bm_1066_laamps_desc: "เหล่าขุนนางและท่านหญิงฉีกโลกออกเป็นสองส่วนด้วยเกมแห่งอำนาจอันไร้สาระของพวกเขา ในขณะเดียวกัน เหล่านักผจญภัยผู้ยิ่งใหญ่ก็ผงาดขึ้นจากจุดเริ่มต้นอันต่ำต้อยเพื่อสลักชื่อของตนลงบนหน้าประวัติศาสตร์ ไม่ผูกมัดด้วยหน้าที่ ปราศจากยศถาบรรดาศักดิ์หรือมงกุฎ บ้านของพวกเขาคือท้องถนน และโชคชะตาของพวกเขาก็ไร้ขีดจำกัด\n\n#bold ด้วยความกล้าหาญ เล่ห์เหลี่ยม และความทะเยอทะยานอันยิ่งใหญ่ ท่านอาจหาญกล้าเผชิญหน้ากับการทะเลาะวิวาทของเหล่าขุนนางและใช้ประโยชน์จากแผนการอันไร้ค่าของพวกเขาเพื่อความรุ่งโรจน์ของท่านเอง! ท่านมีคุณสมบัติพอที่จะดิ้นรนฝ่าฟันโคลนและฝุ่นผงเพื่อกลายเป็นตำนานหรือไม่?#!"

 bookmark_laamps_hassan_sabbah: "ฮะซัน เศาะบาห์"
 bookmark_laamps_hassan_sabbah_subheading: "$BOOKMARK_SUBHEADING_ADVENTURER$"
 bookmark_laamps_hassan_sabbah_desc: "[Concept( 'story_content_hasan', '$bm_story_content_available_icon|q$' )|E] [Concept( 'story_content_hasan', '$bm_story_content_available_copy|q$' )|E]\nฮะซัน เศาะบาห์ เกิดในตระกูลที่ไม่ค่อยมีชื่อเสียง แต่ความทุ่มเทอย่างต่อเนื่องต่อศาสนาอิสลามและการต่อต้านอย่างคลั่งไคล้ต่อการยึดครองของเซลจุคจะนำเขาไปสู่เส้นทางที่จะเปลี่ยนแปลงประวัติศาสตร์ไปตลอดกาล\n\nจากจุดเริ่มต้นอันต่ำต้อย ฮะซันถูกลิขิตให้ก่อตั้งกลุ่มแอสซาซินในฐานที่มั่นบนภูเขาแห่งอาลามุต เขาจะกลายเป็นตำนาน และทุกคนจะหวาดกลัวชายชราแห่งขุนเขาผู้น่าสะพรึงกลัว\n\n#bold ท่านมีเล่ห์เหลี่ยมและศรัทธาอันแน่วแน่พอที่จะรวบรวมผู้ศรัทธาและโค่นล้มจักรวรรดิได้หรือไม่?#!"

 bookmark_laamps_suleyman_qutalmishoglu: "สุลัยมาน กูตัลมิโชฆลู"
 bookmark_laamps_suleyman_qutalmishoglu_subheading: "$BOOKMARK_SUBHEADING_ADVENTURER$"
 bookmark_laamps_suleyman_qutalmishoglu_desc: "ในการต่อสู้แย่งชิงบัลลังก์เซลจุค สุลัยมานพ่ายแพ้ต่ออัลป์ อาร์สลาน ลูกพี่ลูกน้องของเขา และถูกขับไล่ให้เนรเทศไปพร้อมกับพี่น้องของเขา แม้จะถูก ทำให้ต่ำต้อย แต่ไม่แตกสลาย เขาก็สามารถได้รับการสวามิภักดิ์จากชนเผ่าเติร์กเมนในท้องถิ่นในเทือกเขาทอรัสได้\n\nสุลัยมานจะสร้างรัฐสุลต่านแห่งรูมขึ้นท่ามกลางความวุ่นวายในอานาโตเลีย และเข้าไปพัวพันในสงครามของผู้แอบอ้างสิทธิ์ในไบแซนไทน์\n\n#bold ความแข็งแกร่งของท่านจะเพียงพอที่จะวางรากฐานของจักรวรรดิใหม่ได้หรือไม่?#!"
 bookmark_laamps_alt_alp_arslan: "อัลป์ อาร์สลาน"
 bookmark_laamps_alt_mensur_qutalmishoglu: "มันศูร"

 bookmark_laamps_el_cid: "โรดริโก ดิอัซ 'เอล กัมเปอาดอร์'"
 bookmark_laamps_el_cid_subheading: "$BOOKMARK_SUBHEADING_ADVENTURER$"
 bookmark_laamps_el_cid_desc: "[Concept( 'story_content_el_cid', '$bm_story_content_available_icon|q$' )|E] [Concept( 'story_content_el_cid', '$bm_story_content_available_copy|q$' )|E]\nสืบเชื้อสายมาจากตระกูลขุนนาง โรดริโกเข้าร่วมสภาหลวงตั้งแต่อายุยังน้อย ในการรับใช้ซานโชที่ 2 แห่งกัสติยา โรดริโกได้รับการฝึกฝนทั้งด้านราชสำนักและการทหาร ภายใต้การดูแลอย่างใกล้ชิดของกษัตริย์\n\nอย่างไรก็ตาม สงครามของซานโชกับอัลฟองโซที่ 6 แห่งเลออน น้องชายของเขา จะนำไปสู่การสิ้นพระชนม์ก่อนวัยอันควร และอัลฟองโซก็จะเนรเทศโรดริโก ซึ่งเป็นการเริ่มต้นตำนานของเขาโดยไม่ได้ตั้งใจ\n\n#bold โรดริโกจะเติบโตขึ้นเป็นเอลซิด "ท่านลอร์ด" และผงาดขึ้นเป็นกษัตริย์ในสิทธิของตนเอง หรือจะยังคงเป็นขุนนางธรรมดา?#!"

 bookmark_laamps_hereweard_the_wake: "เฮริเวิร์ด 'ผู้ตื่นตัว'"
 bookmark_laamps_hereweard_the_wake_subheading: "$BOOKMARK_SUBHEADING_ADVENTURER$"
 bookmark_laamps_hereweard_the_wake_desc: "[Concept( 'story_content_hereward', '$bm_story_content_available_icon|q$' )|E] [Concept( 'story_content_hereward', '$bm_story_content_available_copy|q$' )|E]\nถูกเนรเทศและถูกตราหน้าว่าเป็นคนนอกกฎหมายโดยเอ็ดเวิร์ดผู้สารภาพบาป เฮริเวิร์ดได้เดินทางไปยังแฟลนเดอร์สเพื่อแสวงหาชื่อเสียงและโชคลาภ\n\nวันหนึ่งเฮริเวิร์ดจะกลับมาอังกฤษและนำการต่อต้านอย่างมุ่งมั่นต่อผู้บุกรุกชาวนอร์มัน กลายเป็นวีรบุรุษพื้นบ้านผู้มีชื่อเสียงโด่งดัง\n\n#bold เฮริเวิร์ดจะยังคงเป็นวายร้ายผู้ฉาวโฉ่ภายใต้การนำทางของท่าน หรือจะกลายเป็นวีรบุรุษที่เขาเกิดมาเพื่อเป็น?#!"
 bookmark_laamps_alt_boudewijn_v: "โบเดอแวนที่ 5"

 bookmark_laamps_robert_crispin: "รอแบร์ 'ฟรังโกปูโลส'"
 bookmark_laamps_robert_crispin_subheading: "$BOOKMARK_SUBHEADING_ADVENTURER$"
 bookmark_laamps_robert_crispin_desc: "ในฐานะบุตรชายคนที่สองที่ไม่มีสิทธิ์สืบทอดมรดก รอแบร์ กริสแป็ง ได้น้อมรับจิตวิญญาณแห่งการผจญภัยของชาวนอร์มัน\n\nรอแบร์เป็นทหารผ่านศึกผู้ช่ำชองในความขัดแย้งในไอบีเรียอยู่แล้ว ได้เข้ารับราชการกับจักรพรรดิไบแซนไทน์ และตอนนี้เป็นผู้นำกองทหารรับจ้างชาวนอร์มันเพื่อต่อสู้กับพวกเติร์ก\n\n#bold รอแบร์จะพบความรุ่งโรจน์ที่เขาแสวงหาในฐานะผู้บัญชาการผู้ยิ่งใหญ่ หรือจะตกเป็นเหยื่อของรังอสรพิษแห่งราชสำนักไบแซนไทน์?#!"
 bookmark_laamps_alt_konstantinos_x: "คอนสแตนตินอสที่ 10"
 bookmark_laamps_alt_roussel_de_baeilleul: "รูสเซล เดอ บายเยอล"


 bookmark_laamps_wallada_bint_al_mustakfi: "วัลลาดะฮ์ บินต์ อัลมุสตักฟี"
 bookmark_laamps_wallada_bint_al_mustakfi_subheading: "$BOOKMARK_SUBHEADING_ADVENTURER$"
 bookmark_laamps_wallada_bint_al_mustakfi_desc: "[Concept( 'story_content_wallada', '$bm_story_content_available_icon|q$' )|E] [Concept( 'story_content_wallada', '$bm_story_content_available_copy|q$' )|E]\nธิดาของเคาะลีฟะฮ์แห่งกอร์โดบาและหนึ่งในราชวงศ์อุมัยยะฮ์คนสุดท้าย วัลลาดะฮ์อุทิศชีวิตให้กับการศึกษาและการเรียนรู้ โดยไม่สนใจความคาดหวังต่อสตรีในสังคมอันดาลูเซีย วัลลาดะฮ์เดินโดยไม่คลุมหน้าผ่านโลกที่เคร่งครัด ลับคมความคิดของสตรีจากทุกชนชั้น\n\nชีวิตของวัลลาดะฮ์ไร้พรมแดน และศักยภาพของนางไร้ขีดจำกัด\n\n#bold รับเลี้ยงและฝึกฝนสตรีผู้ชาญฉลาดจากทั่วโลกเพื่ออุดมการณ์ของท่าน ท่านจะสามารถทำลายขอบเขตของประเพณีและสืบทอดมรดกของรัฐเคาะลีฟะฮ์อุมัยยะฮ์ได้หรือไม่?#!"

 bookmark.1073.t: "เซลจุคผู้ชอบธรรม"
 bookmark.1073.desc: "เป็นเวลาสามปีแล้วนับตั้งแต่ [tughril.GetTitledFirstName] สวรรคตโดยไม่มีทายาท ทำให้ [GetTitleByKey('k_persia').GetBaseNameNoTier] ตกอยู่ในความโกลาหล มีเพียง [qutalmish.GetTitledFirstName] บิดาผู้ชอบธรรมของข้า ซึ่งเป็นลูกพี่ลูกน้องของพระองค์เท่านั้น ที่จะรักษาความสงบเรียบร้อยได้\n\n[alp_arslan.GetFirstName] หลานชายผู้ละโมบของทูฆริล ถลาร่อนลงมาจากโฆรอซอนเพื่อชิงมงกุฎ ขณะที่ผู้ภักดีรวมตัวกันอยู่เบื้องหลังบิดาของข้าและข้า แต่ชะตากรรมของเราถูกตัดสินที่ยุทธการ [GetTitleByKey('b_damghan').GetNameNoTier]: บิดาของข้าสิ้นชีพ ข้าถูกจับ...\n\nแม้จะได้รับการอภัยโทษ แต่ถูกเนรเทศโดยญาติผู้ไร้เกียรติ พี่น้องของข้าและข้านำผู้ศรัทธาที่เหลืออยู่ ใช้ชีวิตอย่างแร้นแค้นบนภูเขา ข้า #EMP รู้#! ว่าสิ่งยิ่งใหญ่รอเราอยู่ — แม้ แต่ตอนนี้กองทัพโอฆุซก็กำลังกดดันเข้าสู่ [GetTitleByKey('e_byzantium').GetNameNoTier|l] ดินแดนอันอุดมสมบูรณ์ที่พร้อมให้เก็บเกี่ยว!"
 bookmark.1073.a: "เป็นชะตาของข้าที่จะก่อตั้งอาณาจักรเซลจุค #EMP ใหม่#! "
 bookmark.1073.b: "บัลลังก์เซลจุคเป็นของ #EMP ข้า#!."
