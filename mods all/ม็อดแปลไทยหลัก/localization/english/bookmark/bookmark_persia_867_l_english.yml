 bm_867_persia: "ช่วงว่างระหว่างรัชกาลอิหร่าน"
 bm_867_persia_desc: "สองร้อยปีผ่านไปนับตั้งแต่รัฐเคาะลีฟะฮ์รอชิดูนพิชิตเปอร์เซีย ผนวกที่ราบสูงอันกว้างใหญ่เข้ากับจักรวรรดิอาหรับอันยิ่งใหญ่\n\nสองร้อยปีแห่งการรับใช้ — ทว่าทุกสิ่งย่อมหมุนเวียนไปตามกาลเวลา\n\nบัดนี้ เหล่าขุนนางแห่งอาระเบียกำลังเสื่อมอำนาจลง ขณะที่ขุนนางโบราณของเปอร์เซียกลับทวีความแข็งแกร่งและสมบูรณ์ยิ่งกว่าที่เคยเป็นมาในรอบหลายศตวรรษ เจริญรุ่งเรืองท่ามกลางการแตกสลายของประชาคมอิสลาม (อุมมะฮ์) ที่เคยเป็นหนึ่งเดียวและยิ่งใหญ่\n\nทางตะวันตก รัฐเคาะลีฟะฮ์อับบาซียะฮ์ควบคุมได้เพียงดินแดนใจกลางของจักรวรรดิรอชิดูนในอดีต ผู้ว่าการที่ยิ่งใหญ่ของพวกเขาตั้งแต่ไอบีเรียถึงอินเดียเป็นอิสระในทุกด้านยกเว้นเพียงในนาม การสืบทอดราชบัลลังก์พัวพันอยู่ในความโกลาหลอันไร้ระเบียบของการทรยศ การฆาตกรรม และการกบฏ\n\nทางตะวันออก เหล่านักผจญภัยและทหารรับจ้างชาวอิสลามที่ถูกตัดขาดโดยเทือกเขาฮินดูกูชจับจ้องสมบัติแห่งราชสถานและเดลีด้วยความโลภ\n\nเปอร์เซียพบว่าตนเองอยู่ ณ ทางแยก ผู้ที่ภักดีต่อเคาะลีฟะฮ์ปะทะกับผู้ติดตามที่เหลืออยู่ของศาสนาโซโรอัสเตอร์และศาสนาพุทธ ขุนศึกผู้ทะเยอทะยานทะเลาะวิวาทกับหัวหน้าเผ่าบนภูเขา และทหารรับจ้างชาวเติร์กปะทะกับผู้รุกรานชาวอาหรับ\n\n#Bold โลกกำลังหมุนเวียน: มันจะนำพา #Italic ท่าน#! ไปยังที่ใด?"

 bookmark_persia_amir_yaqub: "อะมีร ยะอ์กูบ"
 bookmark_persia_amir_yaqub_subheading: "$BOOKMARK_SUBHEADING_DEFAULT$"
 bookmark_persia_amir_yaqub_desc: "บุตรชายของช่างทองแดงผู้ต่ำต้อย ยะอ์กูบเป็นชายที่สร้างตนเองขึ้นมา ซึ่งความพิการจากคมดาบมิได้ ทำให้เขาช้าลงหรือขัดขวางเขา แต่อย่างใด\n\nหลังจากสร้างอาณาจักรอันกว้างใหญ่ในซิสถาน บัดนี้เขากำลังพัวพันในสงครามกับราชวงศ์ฏอฮิรียะฮ์ ข้ารับใช้เก่าแก่ของเคาะลีฟะฮ์ ในแนวหลัง ผู้บัญชาการคนเดียวกันที่สนับสนุนการชิงอำนาจของยะอ์กูบกำลังกระซิบกระซาบถึงการเปลี่ยนความภักดีอีกครั้ง\n\n#bold ดูเหมือนท่านพร้อมที่จะสร้างชะตากรรมใหม่ให้เปอร์เซีย — ท่านกล้าท้าทายอำนาจอันยั่งยืนของราชวงศ์อับบาซียะฮ์หรือไม่?#!"
 bookmark_persia_yaqub_alt_amr: "อัมร์ อิบน์ อัลลัยษ์"
 bookmark_persia_yaqub_alt_sebuk_eri: "เซบุก-เอรี"

 bookmark_persia_ismail_samani: "อิสมาอีล ซามานี"
 bookmark_persia_ismail_samani_subheading: "$BOOKMARK_SUBHEADING_DEFAULT$"
 bookmark_persia_ismail_samani_desc: "เป็นเวลาหลายทศวรรษที่ตระกูลของอิสมาอีลครอบครองตำแหน่งผู้ว่าการแห่งทรานส์ออกเซียนา การแตกสลายของรัฐเคาะลีฟะฮ์ได้ทำลายอำนาจส่วนกลางนั้นลง ปล่อยให้ราชวงศ์ซามานียะฮ์ทะเลาะวิวาทกันเองเพื่อแย่งชิงการปกครอง\n\nโอกาสของอิสมาอีลหนุ่มในการแย่งชิงอำนาจมาถึงเมื่อเขาได้รับการต้อนรับในฐานะผู้ปกครองบูฆอรอ ซึ่งเพิ่งถูกปล้นสะดมโดยกองทัพของควาเรซม์ชาห์ทางตะวันตกผู้ดุร้าย แม้จะมีพรสวรรค์อันน่าทึ่ง แต่สมาชิกคนอื่น ๆ ในครอบครัวของเขาก็คาดหวังการยอมจำนนอย่างภักดีและสมบูรณ์\n\n#bold ท่านจะสามารถเหนือกว่าพี่น้องของท่านและฟื้นฟูความรุ่งโรจน์ของเปอร์เซียได้หรือไม่?"
 bookmark_persia_ismail_alt_nasr: "อะมีร นัศร์"

 bookmark_persia_muhammad_ibn_abdallah: "มุฮัมมัด อิบน์ อับดุลลอฮ์"
 bookmark_persia_muhammad_ibn_abdallah_subheading: "$BOOKMARK_SUBHEADING_DEFAULT$"
 bookmark_persia_muhammad_ibn_abdallah_desc: "ในฐานะผู้บริหารที่เชี่ยวชาญและเป็นมืออาชีพ มุฮัมมัดได้รับใช้อับบาซียะฮ์อย่างซื่อสัตย์ตลอดอาชีพอันยาวนานในฐานะผู้ว่าการอิรัก นครศักดิ์สิทธิ์ และแม้ แต่แบกแดดเอง\n\nถึงกระนั้น ความวุ่นวายล่าสุดได้ทดสอบแม้กระทั่งความเฉียบแหลมทางการเมืองของเขา ขณะที่เขาหนีรอดความตายมาได้อย่างหวุดหวิดหลังจากเข้าข้างเคาะลีฟะฮ์ผิดคน แม้ แต่ตอนนี้ สุขภาพของเขาก็เริ่มเสื่อมถอย\n\n#bold ท่านจะใช้ช่วงเวลาสุดท้ายของชีวิตสนับสนุนหลานชายที่ถูกรุมเร้า อะมีรแห่งโฆรอซอน หรือจะมุ่งเน้นไปที่การกอบกู้ชื่อเสียงของตระกูลในสายตาของเคาะลีฟะฮ์?#!"
 bookmark_persia_muhammad_ibn_abdallah_alt_caliph: "เคาะลีฟะฮ์ อัลมุอ์ตัซ"
 bookmark_persia_muhammad_ibn_abdallah_alt_muhammad_ibn_tahir: "มุฮัมมัด อิบน์ ฏอฮิร"

 bookmark_persia_rostam: "รอสตัมที่ 1"
 bookmark_persia_rostam_subheading: "$BOOKMARK_SUBHEADING_DEFAULT$"
 bookmark_persia_rostam_desc: "ตระกูลของรอสตัมมีสายเลือดที่แทบจะหาใครเทียบไม่ได้ในโลกที่รู้จัก: สายบิดาของเขาคือหนึ่งในราชวงศ์ซาซาเนียนกลุ่มสุดท้าย ขณะที่ภรรยาของเขาสืบเชื้อสายย้อนกลับไปถึงราชวงศ์อาร์ซาซิดแห่งอาร์เมเนียที่มีอายุเกือบพันปี\n\nราชวงศ์เก่าแก่และศรัทธาโบราณยังคงดำรงอยู่ได้ดีในแถบภูเขาตาบาริสถาน ที่ ซึ่งขุนนางภูเขาชาวดัยลัมยึดมั่นในความแค้นที่สืบทอดกันมาหลายชั่วอายุคน และหลายคน รวมถึงรอสตัม ยังคงต่อสู้กับการครอบงำ "ใหม่" ของศาสนาอิสลามเหนือประเพณีในอดีต\n\n#bold ท่านจะสามารถทวงคืนความรุ่งโรจน์อันน่าเคารพแห่งสิทธิ์โดยกำเนิดของท่าน หรือจะยอมรับโลกสมัยใหม่?#!"
 bookmark_persia_rostam_alt_hasan: "ฮะซัน ผู้เผยแผ่ศาสนา"
 bookmark_persia_rostam_alt_shervin: "ชาร์วิน"

 bookmark_persia_suri_of_mandesh: "ซูรี แห่งมันเดช"
 bookmark_persia_suri_of_mandesh_subheading: "$BOOKMARK_SUBHEADING_DEFAULT$"
 bookmark_persia_suri_of_mandesh_desc: "ในฐานะขุนนางชาวพุทธคนสุดท้ายทางตะวันตกของแม่น้ำสินธุ ซูรียืนอยู่ ณ ทางแยก — ดินแดนของเขาอุดมไปด้วยเงินและเหล็ก สามารถกลายเป็นศูนย์กลางของจักรวรรดิอันทรงพลังได้อย่างง่ายดาย แต่ขุนศึกผู้หิวโหยแห่งโฆรอซอนทางตอนเหนือและมักรอนทางตอนใต้ก็ตระหนักถึงสิ่งนี้ เช่นเดียวกับเขา\n\nในฐานะทายาทของกษัตริย์แห่งกุซกันในอดีต ซูรีรู้สึกถึงน้ำหนักของมรดกและความกดดันของการเมืองปัจจุบันอย่างแหลมคมยิ่งกว่าคนส่วนใหญ่\n\n#bold ท่านจะสามารถรวมชนเผ่าอัฟกันที่ชอบทะเลาะวิวาทและปกป้องมรดกทางจิตวิญญาณอันเก่าแก่ของท่าน หรือในที่สุดจะยอมรับพระประสงค์ของอัลลอฮ์?#!"
