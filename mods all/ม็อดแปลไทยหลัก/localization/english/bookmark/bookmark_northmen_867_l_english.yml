l_english: 
 bm_867_northmen:0 "พิโรธแห่งชาวเหนือ"
 bm_867_northmen_desc:1 "สองปีก่อน กษัตริย์แอ็ลลาแห่งนอร์ธัมเบรียได้โยนรagnar โลดโบรค วีรบุรุษไวกิ้งผู้ยิ่งใหญ่ ลงไปในบ่องูจนสิ้นใจ เมื่อได้ยินข่าว บุตรชายของรagnar ก็ออกเรือไปยังอังกฤษเพื่อล้างแค้นให้บิดา\n\nนับ แต่นั้นมา พี่น้องก็ได้ตั้งหลักปักฐานอย่างมั่นคงในยอร์กและหมู่เกาะ เหล่ากษัตริย์แองโกล-แซกซอนพ่ายแพ้ครั้งแล้วครั้งเล่า — อนาคตของพวกเขาดูมืดมนยิ่งนัก\n\nแต่ความหวังทั้งหมดยังไม่สูญสิ้น และวีรบุรุษผู้ยิ่งใหญ่ยังคงสามารถพลิกกระแสประวัติศาสตร์ได้\n\n#bold ท่านจะนำอังกฤษทั้งหมดมาอยู่ภายใต้การปกครองของชาวนอร์ส หรือจะขับไล่กองทัพนอกรีตอันยิ่งใหญ่ออกจากแผ่นดินแองโกล-แซกซอน?#!"

 #Halfdan Whiteshirt
 bookmark_northmen_halfdan_whiteshirt:0 "ฮาล์ฟดาน ไวท์เชิร์ต"
 bookmark_northmen_halfdan_whiteshirt_subheading: "$BOOKMARK_SUBHEADING_DEFAULT$"
 bookmark_northmen_halfdan_whiteshirt_desc:0 "การรุกรานระลอกแรกเป็นไปด้วยดีสำหรับฮาล์ฟดาน ไวท์เชิร์ต ด้วยความช่วยเหลือจากอีวาร์ น้องชายของเขา เขาได้แย่งชิงการควบคุมยอร์กมาจากเงื้อมมือของกษัตริย์แอ็ลลา และเขาจะยึดครองได้มากกว่านั้นอีกมาก\n\n#bold ท่านจะดำเนินตามรอยประวัติศาสตร์และล้างแค้นอย่างสาสม หรือจะบุกเบิกเส้นทางใหม่ให้ฮาล์ฟดาน?#!"

 bookmark_northmen_halfdan_whiteshirt_alt_gudfrid:0 "$GuT_friT_$"
 bookmark_northmen_halfdan_whiteshirt_alt_saga:0 "$Saga$ $nick_the_truthspeaker$"

 #Ivar the Boneless
 bookmark_northmen_ivar_the_boneless:0 "อีวาร์ผู้ไร้กระดูก"
 bookmark_northmen_ivar_the_boneless_subheading: "$BOOKMARK_SUBHEADING_DEFAULT_WITH_THE$"
 bookmark_northmen_ivar_the_boneless_desc:0 "มีข่าวลือว่าอีวาร์ร่างกายอ่อนแอ แต่ไม่มีใครสามารถอ้างได้ว่าเขามีจิตใจที่อ่อนแอ ด้วยเล่ห์เหลี่ยมและความมั่นใจ เขาได้รวบรวมกองทัพนักรบชาวนอร์สจำนวนมากไว้ภายใต้ธงของเขา และได้รับชัยชนะอันยิ่งใหญ่บนชายฝั่งต่างแดนเหล่านี้ แต่แม้ แต่นักรบไวกิ้งที่ยิ่งใหญ่ที่สุดก็ไม่สามารถหลอกลวงความตายได้ ในปี 870 อีวาร์จะเลือนหายไปจากประวัติศาสตร์ตลอดกาล...\n\n#bold ท่านจะสามารถชนะสงครามของอีวาร์ และรักษาชีวิตเขาไว้เพื่อปกครองต่อไปอีกหลายปีได้หรือไม่?#!"

