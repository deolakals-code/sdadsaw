 #Sigurdr Snake-in-the-eye
 bookmark_northmen_sigurdr_snake_in_the_eye:0 "ซิกูร์เดอร์ เนตรงู"
 bookmark_northmen_sigurdr_snake_in_the_eye_subheading: "$BOOKMARK_SUBHEADING_DEFAULT$"
 bookmark_northmen_sigurdr_snake_in_the_eye_desc:1 "ขณะที่พี่น้องของเขาออกเรือไปยังอังกฤษเพื่อล้างแค้น ซิกูร์เดอร์ เนตรงู ยังคงอยู่เบื้องหลังเพื่อปกครองดินแดนของบิดาผู้ล่วงลับ รagnar โลดโบรค ได้ทิ้งภาระอันใหญ่หลวงไว้ให้เขาแบกรับ\n\n#bold ทายาทของซิกูร์เดอร์จะเป็นกษัตริย์แห่งเดนมาร์ก นอร์เวย์ และอังกฤษนานกว่าศตวรรษ ท่านจะสามารถเติมเต็มชะตากรรมของราชวงศ์ของเขาได้หรือไม่?#!"

