 bm_1066_china: "บทเพลงแห่งความรุ่งโรจน์"
 bm_1066_china_desc: "เกียรติภูมิแห่งราชวงศ์ซ่งถือกำเนิดขึ้นจากซากปรักหักพังของราชวงศ์ถัง ความยิ่งใหญ่ เช่นนี้มิได้ปรากฏให้เห็นมาเกือบสองศตวรรษ – เครื่องราชบรรณาการหลั่งไหลสู่เมืองหลวงของจักรวรรดิจากแดนไกลดุจดั่งแม่น้ำอันยิ่งใหญ่, การกบฏเกิดขึ้นนานครั้งและถูกปราบปรามอย่างรวดเร็ว, และการปกครองก็อยู่ในหัตถ์ของผู้มีความสามารถและเปี่ยมคุณธรรมอย่างมั่นคง\n\nทว่า ความรุ่งเรืองอันยิ่งใหญ่ย่อมมาพร้อมกับสิ่งยั่วยวนอันใหญ่ยิ่ง ชนเผ่าเร่ร่อนต่างโลภละโมบในความอุดมสมบูรณ์ของจงหยวนนับ แต่โบราณกาล, ขณะที่แม้ แต่ภายในจักรวรรดิ เหล่าผู้ไร้ยางอายก็มักแอบอ้างตนเป็นขุนนางเพื่อฉกฉวยความมั่งคั่งเข้ากระเป๋าตนเอง\n\n#bold โอรสแห่งสวรรค์กุมโลกไว้ในอุ้งหัตถ์, แต่จะเกิดอันใดขึ้นกับเหล่าผู้ที่อาจบีบบังคับแม้กระทั่งโอรสแห่งสวรรค์ให้กระทำการตามเจตจำนงของพวกตนเล่า?#!"

 bookmark_china_1066_qin_guan: "ฉิน กวน"
 bookmark_china_1066_qin_guan_subheading: "$BOOKMARK_SUBHEADING_LANDLESS_ADMIN$"
 bookmark_china_1066_qin_guan_desc: "ครอบครัวของเขายากจนลงหลังการตายของบิดา, ทว่าความยากลำบากมิได้บั่นทอนความปรารถนาของ ฉินกวน ผู้เยาว์วัยเลย; หากจะมีสิ่งใด, มันกลับยิ่งโชติช่วงขึ้นในสภาวะอันตกต่ำของเขา\n\nด้วยตำราทุกเล่มที่เขาสามารถหยิบยืมมาได้, เขาจมดิ่งลงในบทกวีและยุทธศาสตร์การทหาร, เฝ้าฝันถึงวันที่เขาจะทัดเทียมวีรกรรมอันเป็นอมตะในหน้ากระดาษเหล่านี้\n\n#bold การฝันถึงความยิ่งใหญ่นั้นเป็นเรื่องหนึ่ง, แต่การทำให้มันเป็นจริงนั้นเป็นอีกเรื่องหนึ่งโดยสิ้นเชิง โชคชะตาใดที่หัตถ์ของท่านจะนำพาเขาไปสู่?#!"
 
 bookmark_china_1066_duan_silian: "ซือเหลียน หวัง"
 bookmark_china_1066_duan_silian_subheading: "$BOOKMARK_SUBHEADING_DEFAULT$"
 bookmark_china_1066_duan_silian_desc: "ในฐานะทายาทอันห่างไกลของผู้ก่อตั้งต้าหลี่, น้อยคนนักจะจินตนาการได้เมื่อครั้งเขาเกิดมาว่า วันหนึ่ง Duan ซือเหลียน จะได้นั่งบนบัลลังก์, แต่โชคชะตานั้นแปรปรวนและมิอาจคาดเดาได้\n\nลำดับตามธรรมชาติของสรรพสิ่งถูกพลิกผันโดยตระกูลเกาผู้ทรงอำนาจ, ซึ่งเป็นรองเพียงราชตระกูลในด้านอิทธิพล, ผู้ ซึ่งปลดจักรพรรดิผู้เสเพลที่ครองราชย์อยู่ในขณะนั้น และ แต่งตั้ง ซือเหลียน ขึ้นแทนที่\n\n#bold ซือเหลียน หวัง จะหลุดพ้นจากเงื้อมมือของตระกูลเกาเพื่อปกครองในนามของตนเองได้หรือไม่, หรือเขาจะตกเป็นเหยื่อความทะเยอทะยานของพวกเขากัน?#!"

 bookmark_china_1066_ly_thanh_tong: "ญัต ตน เวือง"
 bookmark_china_1066_ly_thanh_tong_subheading: "$BOOKMARK_SUBHEADING_DEFAULT$"
 bookmark_china_1066_ly_thanh_tong_desc: "ในฐานะผู้ปกครองแห่งเวียด, ลี เญิ้ต ตน เปล่งประกายความเชื่อมั่นในตนเองอย่างมิตรสั่นคลอน ซึ่งมีเพียงผู้ที่ถูกเลี้ยงดูมาเพื่อปกครองตั้งแต่กำเนิดเท่านั้นที่จะครอบครองได้ ได้รับการพิสูจน์แล้วในสมรภูมิ, เปี่ยมเมตตาในการปกครอง, และขยันหมั่นเพียรในความยุติธรรม, สำหรับอาณาราษฎรของเขา คำพูดของเขาถือเป็นที่สุด\n\nแม้ แต่เงาทมึนเดียวที่ทอดทับรัชสมัยอันรุ่งโรจน์ของเขา, คือการไร้ทายาท, ก็เพิ่งถูกปัดเป่าไปเมื่อเร็ว ๆ นี้ด้วยการกำเนิดของบุตรชายคนแรก, ก่าน ดึ๊ก\n\n#bold เญิ้ต ตน เวือง จะสามารถยกระดับเวียดขึ้นเป็นจักรวรรดิเพื่อต่อกรกับเพื่อนบ้านทางทิศเหนือได้หรือไม่, หรือความสำเร็จอันยั่งยืนจะพิสูจน์ได้ว่าเปราะบางเพียงชั่วครู่ยาม?#!"

 bookmark_china_1066_new_noble_family: "ตัวละครที่สร้างเอง"
 bookmark_china_1066_new_noble_family_desc: "สร้างตัวละครใหม่และ [noble_family|E] พร้อมกับที่ดินผืนเล็ก ๆ ในเมืองหลวงของจักรวรรดิ \n\n#bold ท่านจะสามารถเริ่มต้นจากจุดต่ำสุดของลำดับขั้นข้าราชการและสร้างชื่อให้ตนเองกับตระกูลที่เพิ่งตั้งไข่ของท่านได้หรือไม่?#!"

 bookmark_china_1066_empress_liang: "$king_female$ $dynn_Liang_6881$ $Luoyao_843D_7464$"
 bookmark_china_1066_empress_liang_subheading: "จักรพรรดินีมเหสีแห่ง $k_xia$"
 bookmark_china_1066_empress_liang_desc: "ครั้งหนึ่งเป็นเพียงบุตรสะใภ้ของรัฐบุรุษแห่งเซี่ยผู้ทรงอำนาจ $dynn_Mozang_6C92_85CF$ $Epang_8BB9_5E9E$, ความทะเยอทะยานที่ซ่อนเร้นของ $dynn_Liang_6881$ $Luoyao_843D_7464$ ได้พิสูจน์แล้วว่ายิ่งใหญ่กว่าของตระกูลสามีผู้เหลวแหลกของนาง\n\nด้วยความหลงใหลในความงามและสติปัญญาของนางอย่างที่สุด, ผู้ปกครองชาวตันกุตผู้เยาว์วัย $king_male_tangut$ $Liangcha_5169_5C94$ จึงสังหารตระกูล $dynn_Mozang_6C92_85CF$ จนสิ้นซาก, รวมถึงภรรยาของเขาเองด้วย, และ แต่งตั้งนางขึ้นเคียงข้างเขาในฐานะราชินี\n\n#bold รัฐเซี่ยยังคงอ่อนเยาว์และเปราะบาง – ท่านจะกุมอนาคตของมันไว้ในมือของท่านเองหรือไม่?#!"

 bookmark_china_1066_su_shi: "เจ้าเมือง ซูซื่อ"
 bookmark_china_1066_su_shi_subheading: "$BOOKMARK_SUBHEADING_GOVERNOR$"
 bookmark_china_1066_su_shi_desc: "บิดาของ ซูซื่อ, แม้จะล้มเหลวในการสอบขุนนาง, ก็ได้รับชื่อเสียงจากงานเขียนของเขาในช่วงทศวรรษที่ห้าของชีวิต, ชื่อเสียงดังกล่าวยิ่งได้รับการหนุนเสริมด้วยผลงานอันเป็นแบบอย่างและโด่งดังของ ซูซื่อ ในการสอบของเขาเอง\n\nการที่ได้รับความสนใจและความโปรดปรานจากทั้งนักประวัติศาสตร์ผู้โดดเด่นที่สุดของจักรวรรดิและองค์จักรพรรดิเอง, การตายของบิดาเขาเมื่อเร็ว ๆ นี้จึงเป็นเมฆหมอกเดียวที่บดบังสิ่งที่คาดหวังว่าจะเป็นอนาคตอันเป็นมงคล\n\n#bold ซูซื่อ จะสามารถดำเนินชีวิตให้สมดังความคาดหวังอันหนักอึ้งที่วางไว้บนตัวเขาได้หรือไม่?#!"

 bookmark.0400.t: "อำนาจหลังม่าน"
 bookmark.0400.desc: "เพียงธนูดอกเดียวก็เพียงพอที่จะ ทำให้แผนการหลายปีต้องพังทลาย [emperor.GetWifeHusband] ของข้า [emperor.GetFirstName] บาดเจ็บสาหัส, อ่อนแอลงทุกวันที่ผ่านไป, ถูกล้มลงโดยนักธนูของซ่งหลังจากที่หลงเข้าไปใกล้สมรภูมิอย่างโง่เขลา\n\nหลังจากทุกสิ่งที่ข้าอดทนมา, ข้าจะ #EMP ไม่#! ยอมปล่อยให้ทุกอย่างหลุดลอยไปจากนิ้วมือของข้า สตรีเคยปกครองมาก่อน; หากไม่ผ่านสามีของพวกนาง, ก็ผ่านบุตรชายของพวกนาง, และ [Glossary('บูเช็กเทียน', 'EMPRESS_WU_GLOSS')] ถึงกับก่อตั้ง #EMP ราชวงศ์#! ของนางเอง\n\nด้วยอิทธิพลที่ข้าสั่งสมมาและการสนับสนุนอันแน่วแน่ของ [brother.Custom('SisterBrother')] ของข้า [brother.GetTitledFirstName], อนาคตของ [xia.GetNameNoTierNoTooltip] อยู่ใน #EMP มือข้า#! ที่จะตัดสินใจ"
 bookmark.0400.a: "การปกครองของเขาจะถูกจดจำ...ในฐานะบทโหมโรงสู่รัชสมัยของ #EMP ข้า#! "
 bookmark.0400.a.tt: "[emperor.GetTitledFirstName] จะสิ้นพระชนม์อย่าง #EMP น่าเศร้า#! จากอาการบาดเจ็บของ [emperor.GetHerHis] และท่านจะเข้าควบคุม [realm|E] แต่เพียงผู้เดียว โดยมี [brother.Custom('SisterBrother')] ของท่าน [brother.GetTitledFirstName] เป็น [emperor.GetCouncillor('councillor_chancellor').GetCouncilTitle] ของท่าน"
 bookmark.0400.b: "ตราบใดที่ [emperor.GetSheHe] ยังมีลมหายใจ, ข้าจะปกครองจากหลังม่าน"
 bookmark.0400.b.tt: "ด้วยสภาวะที่อ่อนแอและความสามารถที่ลดลงของ [emperor.GetHerHis], ท่านจะเข้ารับบทบาท [regent|E] ให้กับ [emperor.GetTitledFirstName] โดยมี [brother.GetTitledFirstName] เป็น [emperor.GetCouncillor('councillor_chancellor').GetCouncilTitle] ของ [emperor.GetHerHis]"
 bookmark.0400.c: "ข้าจะเลี้ยงดู [child.Custom('GetDaughterSon')] ของเราให้ยิ่งใหญ่กว่าที่ [emperor.GetMotherFather] ของ [child.GetHerHis] เคยเป็น"
 bookmark.0400.c.tt: "[emperor.GetTitledFirstName] จะสิ้นพระชนม์อย่าง #EMP น่าเศร้า#! จากอาการบาดเจ็บของ [emperor.GetHerHis] และท่านจะเข้ารับบทบาท [regent|E] ให้กับ [child.Custom('GetDaughterSon')] ของท่าน [child.GetTitledFirstName] โดยมี [brother.Custom('SisterBrother')] ของท่าน [brother.GetTitledFirstName] เป็น [emperor.GetCouncillor('councillor_chancellor').GetCouncilTitle] ของ [child.GetHerHis]"

 EMPRESS_WU_GLOSS: "Wǔ Zétiān (624–705) ได้ละทิ้งจารีตประเพณีและปลดบุตรชายของตนเองออกจากบัลลังก์หลังการสิ้นพระชนม์ของสวามี, แต่กลับประกาศ #EMP ตนเอง#! เป็นผู้ก่อตั้งราชวงศ์จ้าวใหม่แทน"

 bookmark.0500.t: "ความเสื่อมถอยแห่งธรรม"
 bookmark.0500.desc: "ล้มเหลว #EMP อีกครา#! ต้องให้ข้าลดเกียรติลงไปเกลือกกลั้วกับการสอบอันน่าสังเวชนี้อีกกี่ครั้งกี่หน ต้องท่องบทร้อยกรองอันจืดชืดต่อหน้าสายตาเหยียดหยามของผู้คุมสอบ? พวกมันเป็น #EMP ใคร#! ถึงจะมาวัดคุณค่าของ #EMP ข้า#!? ปากพร่ำสอนคุณธรรม แต่ข้าเห็นธาตุแท้ของพวกมัน—เป็นเพียงสุกรที่ตะกละตะกลามรุมทึ้งรางอาหารที่เรียกว่าระบบขุนนาง\n\nลูกหลานที่ถูกตามใจของพวกมันเดินเข้าสู่สนามสอบโดยรู้คำตอบล่วงหน้า ได้รับการประคบประหงมจากอาจารย์ที่ถูกจ้างด้วยเงินที่รีดไถมาจากผู้ยากไร้ที่แทบจะไม่มีหลังคาคุ้มหัว\n\n[ROOT.Char.GetTopLiege.GetPrimaryTitle.GetNameNoTier] ถูกสวรรค์ทอดทิ้งแล้ว เมื่อผู้ใดรู้ว่าสิ่งใดถูกต้อง การนิ่งเฉยย่อมเป็นความขลาดเขลา หึ เป็น เช่นนั้นเถิด ให้ทวยเทพเป็นพยานและผู้มีอำนาจจงสั่นสะท้าน #EMP เพราะบัดนี้ข้าคือผู้พิพากษา#!."
 bookmark.0500.a: "หนทางที่แน่นอนที่สุดในการเปลี่ยนแปลงคือการเริ่มจากภายใน"
 bookmark.0500.b: "เวลาของข้ามาถึงแล้ว ยุคสมัยของ [ROOT.Char.GetTopLiege.GetPrimaryTitle.GetNameNoTierNoTooltip] ได้ #EMP จบสิ้นลงแล้ว#!!"
 bookmark.0500.c: "โอกาสอันมั่งคั่งรอคอยผู้ที่กล้าพอจะคว้ามันไว้"
 bookmark.0500.d: "ผู้คนโหยหาผู้กอบกู้ และผู้กอบกู้นั้นคือ #EMP ข้า#! เอง."
 faithful_followers: "ผู้ติดตามผู้ภักดี"
