 raiktor_gains_byzantium: "[claimant.GetShortUIName|U] ยึด [GetTitleByKey('e_byzantium').GetName]"
 hard_raiktor_war: "นี่คือ [war|E] ที่ยากลำบาก ซึ่งท่านจะต้อง [occupy|E] พื้นที่ส่วนใหญ่ของ [de_jure|E] ไบแซนเทียม และเอาชนะ [armies|E] ของพวกเขา เพื่อที่จะชนะ"
 easy_raiktor_war: "นี่คือ [war|E] ที่ง่ายกว่า ซึ่ง [occupations|E] และ [battles|E] จะให้ [war_score|E] มากกว่าปกติ"
 raiktor_vassal_desc: "[vassal_to_be.GetShortUIName] ได้รับ [counties|E] แห่ง [GetTitleByKey('c_dyrrachion').GetNameNoTier], [GetTitleByKey('c_avlonas').GetNameNoTier], และ [GetTitleByKey('c_buthrotum').GetNameNoTier] และกลายเป็น [vassal|E] ของท่าน"
 raiktor_vassal_backup_desc: "ท่านยึด [counties|E] แห่ง [GetTitleByKey('c_dyrrachion').GetNameNoTier], [GetTitleByKey('c_avlonas').GetNameNoTier], และ [GetTitleByKey('c_buthrotum').GetNameNoTier]"
 guiscard_modifier: "กีสการ์"
 guiscard_modifier_desc: "ตัวละครนี้มีเล่ห์เหลี่ยมและโหดเหี้ยมเป็นพิเศษ"
 
 bookmark.1072.t: "พิชิตกอร์โดบา"
 bookmark.1072.desc: "อา [GetTitleByKey('c_cordoba').GetNameNoTier] อันงดงาม! อดีตศูนย์กลางอำนาจของเคาะลีฟะฮ์ใน [GetTitleByKey('e_spain').GetNameNoTier] ในรัชสมัยของราชวงศ์อุมัยยะฮ์ รางวัลอันคู่ควรสำหรับผู้ปกครองทุกคนที่จะไล่ตาม\n\nบัดนี้ข้าต้องตัดสินใจ — ข้าจะพึ่งพากำลังทหาร หรือจะใช้เล่ห์เหลี่ยมของข้าเพื่อหว่านความไม่พอใจในหมู่พวกเขา?\n\nแนวทางที่ข้าเลือกจะเป็นแนวทางที่ข้าใช้ต่อจากนี้ไป"
 bookmark.1072.a: "สงครามชนะได้ด้วยคำพูดและคมมีดที่วางไว้อย่างดี..."
 bookmark.1072.b: "ข้าต้องพึ่งพากองทัพ"
 bookmark.1072.c: "[GetTitleByKey('c_cordoba').GetNameNoTierNoTooltip] รอได้"
 start_cordoba_war: "ท่านเริ่ม [war|E] ต่อต้าน [cordoba_holder.GetShortUIName] เพื่อพิชิต [county|E] แห่ง [GetTitleByKey('c_cordoba').GetNameNoTier] #weak (และ [GetTitleByKey('c_cabra').GetNameNoTier] หาก [cordoba_holder.GetSheHe] ถือครองอยู่)#!"
 intrigue_challenge: "ทุกครั้งที่ท่านประกาศ [war|E] คู่ต่อสู้ของท่านต้องเอาชนะการดวล [intrigue|E][intrigue_i] กับท่านให้ได้ มิฉะนั้นจะได้รับ [modifier|E] [GetModifier('hampered_by_false_information_modifier').GetNameWithTooltip]"
 hampered_by_false_information_modifier: "ถูกขัดขวางโดยข่าวกรองเท็จ"
 hampered_by_false_information_modifier_desc: "กองทัพของตัวละครนี้กำลังถูก ทำให้เข้าใจผิดโดยกระแสข้อมูลที่ไม่ถูกต้อง ซึ่งป้อนให้โดยสายลับของศัตรู"
 armies_hampered: "กองทัพถูกขัดขวาง"
 armies_unhampered: "กองทัพไม่ถูกขัดขวาง"
