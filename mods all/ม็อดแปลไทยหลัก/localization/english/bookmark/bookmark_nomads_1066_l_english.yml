 bm_1066_nomads: "ณ ประตูเมือง"
 bm_1066_nomads_desc: "นับ แต่บรรพกาล เหล่าชนเผ่าได้อพยพข้ามทุ่งหญ้าสเตปป์ และดำเนินวิถีแห่งคนพเนจรมานับชั่วอายุคนมิถ้วน บัดนี้ โลกภายนอกกำลังรุกล้ำเข้ามาในดินแดนของพวกเขา เหล่าอาณาจักรที่ตั้งรกรากมั่นคงต่างขยายพรมแดนออกไปทุกปี\n\n#bold คลื่นแห่งการตั้งถิ่นฐานจะถูกต้านทานได้หรือไม่? หรือวิถีแห่งคนพเนจรควรถูกทอดทิ้ง? ในเมืองและไร่นา เหล่าผู้คนแห่งทุ่งหญ้าสเตปป์สามารถค้นพบชีวิตใหม่... แต่หากยุคแห่งมหาผู้พิชิตอุบัติขึ้น วิถีดั้งเดิมอาจได้รับการธำรงไว้!#!"

 bookmark_nomads_cumans: "ข่านซารูแห่งคูมาเนีย"
 bookmark_nomads_cumans_subheading: "$BOOKMARK_SUBHEADING_KHAN$"
 bookmark_nomads_cumans_desc: "เพิ่งขึ้นคุมบังเหียน ซารูบัญชาการกองพลเร่ร่อนอันไพศาลแห่งคูมาเนีย ณ ชายแดนของตน เหล่าราชรัฐอันมั่งคั่งตั้งอยู่ พร้อมให้เด็ดสอย แต่ซารูมีทักษะสามารถเพียงพอที่จะรวมกองพลเร่ร่อนให้เป็นหนึ่งเพื่อการพิชิตครั้งใหม่หรือไม่?\n\nแม้คูมาเนียจะกว้างใหญ่ไพศาล แต่ผู้คนของตนก็อาจเป็นได้ทั้งภาระและกำลังสำคัญ — เบื้องหลังทุกปากท้องที่ต้องเลี้ยงดู คืออัตตาที่หิวโหยไม่แพ้กัน\n\n#bold ท่านจะสามารถกดข่มเหล่าเพื่อนบ้านและรักษาฐานะของท่านไว้ได้หรือไม่ ในขณะที่ท่านควบม้านำหน้ากองพลเร่ร่อนคูมาน?#!"

 bookmark_nomads_keraits: "มหาประมุขเผ่าอินันช์"
 bookmark_nomads_keraits_subheading: "$BOOKMARK_SUBHEADING_HIGH_CHIEFTAIN$"
 bookmark_nomads_keraits_margus: "มาร์กุส"
 bookmark_nomads_keraits_hongji: "คากานหงจี"
 bookmark_nomads_keraits_desc: "ถูกเนรเทศจากจักรวรรดิจีนตามพระราชกฤษฎีกาของจักรพรรดิอู่จงเมื่อสองศตวรรษก่อน เหล่ามิชชันนารีนิกายเนสโตเรียนได้พบผู้ฟังที่เปิดรับในหมู่ชาวเคราอิท ด้วยแรงผลักดันจากความทะเยอทะยานและศรัทธา อินันช์ ผู้ปกครองชาวเคราอิท บัดนี้พยายามรวบรวมผู้คนแห่งทุ่งหญ้าสเตปป์มาอยู่ภายใต้ธงของตน — ธง ซึ่งประดับด้วยไม้กางเขน\n\n#bold จงรวมเหล่าชนเผ่าเร่ร่อนแห่งบูรพาทิศ และเผยแผ่หลักธรรมเนสโตเรียนไปทั่วทุ่งหญ้าสเตปป์!#!"

 bookmark_nomads_late_kirghiz: "โคโคทอยแห่งชาวคีร์กีซ"
 bookmark_nomads_late_kirghiz_subheading: "$BOOKMARK_SUBHEADING_HIGH_CHIEFTAIN$"
 bookmark_nomads_late_kirghiz_desc: "เพียงเสียงกระซิบเอ่ยถึงชาวคีร์กีซก็เคย ทำให้ทุกคนที่อาศัยในทุ่งหญ้าสเตปป์ทางตอนเหนือหนาวสะท้านไปถึงสันหลัง วันเวลาเหล่านั้นผ่านพ้นไปนานแล้ว — อาณาจักรของพวกเขาแตกสลาย และมีเพียงเศษเสี้ยวอันเลือนรางของคากาเนตคีร์กีซที่ยังคงหลงเหลืออยู่ทางตอนเหนือ\n\n#bold ประกายสุดท้ายแห่งเกียรติภูมิของชาวคีร์กีซจะมอดดับลง หรือเปลวไฟนั้นจะสามารถลุกโชติช่วงยิ่งกว่าดวงอาทิตย์ได้อีกครั้ง?#!"

 bookmark_nomads_eastern_karakhanids: "มุห์มุดแห่งชาวคาร์ลุก"
 bookmark_nomads_eastern_karakhanids_subheading: "$BOOKMARK_SUBHEADING_KHAN$"
 bookmark_nomads_eastern_karakhanids_desc: "กองพลเร่ร่อนแห่งคาราขานิด — #italic เหล่าข่านดำ#! — แห่งทรานส็อกเซียนาเคยควบคุมเส้นทางสายไหม แต่วันเวลาแห่งความรุ่งโรจน์เหล่านั้นได้ผ่านพ้นไปนานแล้ว ด้วยการแบ่งแยกระหว่างตระกูลอาลีและตระกูลฮาซัน สองส่วนของอาณาจักรของพวกเขาบัดนี้ต่างแก่งแย่งชิงความเป็นใหญ่\n\nทางตะวันออก ตระกูลอาลีได้ละทิ้งมรดกแห่งชนเผ่าเร่ร่อนของตน แต่ตระกูลฮาซันทางตะวันตกยังคงยึดมั่นในรากเหง้าของวิถีชนเผ่าเร่ร่อน\n\n#bold เหล่าคาราขานิดแตกแยกกัน — อนาคตของรัฐข่านจะขึ้นอยู่กับอานม้าหรือราชสำนักอันโอ่อ่า?#!"

 bookmark_nomads_pechenegs: "ทาทุสแห่งชาวเปเชเนก"
 bookmark_nomads_pechenegs_subheading: "$BOOKMARK_SUBHEADING_KHAN$"
 bookmark_nomads_pechenegs_desc: "ชาวเปเชเนกผู้เร่ร่อนถูกรายล้อมไปด้วยเหล่าชนผู้ตั้งถิ่นฐาน: ทางทิศใต้ การเมืองอันแตกแยกของไบแซนไทน์เปิดโอกาสให้ทั้งผู้รุกรานและทหารรับจ้าง ชาวแมกยาร์บัดนี้ได้ตั้งถิ่นฐานในพันโนเนียทางทิศตะวันตก — หาก แต่ชนอื่น ๆ ก็เคยตั้งรกราก ณ ที่นั่นมาก่อน เพียงเพื่อจะถูกกลืนกินโดยผู้รุกรานรายต่อไป และทางทิศเหนือ เหล่าเจ้าชายแห่งรุสก็ขัดแย้งกันไม่หยุดหย่อนในการแข่งขันอันไร้สาระ\n\n#bold จงนำชาวเปเชเนกเข้าสู่ยุคสมัยใหม่ เติบโตและเปลี่ยนแปลงเพื่อบรรลุชะตากรรมใดก็ตามที่รอคอยพวกเขาอยู่!#!"
