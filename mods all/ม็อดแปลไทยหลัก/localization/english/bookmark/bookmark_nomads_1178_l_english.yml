 bm_1178_nomads: "นภาอันมิสิ้นสุด"
 bm_1178_nomads_desc: "การเคลื่อนย้ายอพยพของชนเผ่าเร่ร่อนเป็นภาพอันน่าอัศจรรย์ยิ่งนัก — ดุจดั่งทะเลมีชีวิตอันเนืองแน่นด้วยผู้คนและปศุสัตว์ เดินทางไกลแสนไกลเพื่อแสวงหาทุ่งหญ้าเลี้ยงสัตว์\n\nเสียงกีบเท้าของฝูงสัตว์ที่ดูเหมือนจะไม่มีที่สิ้นสุดดังกระหึ่มประดุจกลองศึก เป็นเครื่องเตือนใจแก่เหล่าเพื่อนบ้านผู้ตั้งถิ่นฐานว่ากองพลเร่ร่อนอาจจู่โจมได้ทุกเมื่อ! ด้วยว่าชนเผ่าพเนจร เช่นนี้มิใช่อื่นใดเลยนอกจากกองทัพที่เดินทัพอยู่เป็นนิจ?\n\n#bold โลกของผู้เพาะปลูกนอนรอให้ผู้นำเผ่าผู้กล้าหาญพอจะอ้างสิทธิ์ในความอุดมสมบูรณ์ของมัน ท่านจะนำพาชนเผ่าของท่านข้ามพ้นดินแดนอันไร้ขอบเขตและสถาปนาอาณาจักรจากบนหลังม้าได้หรือไม่?#!"

 bookmark_nomads_togrul: "มหาประมุขเผ่าโทกรูล"
 bookmark_nomads_togrul_subheading: "$BOOKMARK_SUBHEADING_HIGH_CHIEFTAIN$"
 bookmark_nomads_togrul_oghuul: "โอกูล"
 bookmark_nomads_togrul_desc: "การสังหารเหล่าพี่น้องต่างมารดาอาจนำพาตำแหน่งประมุขเผ่าเคราอิทมาสู่โทกรูล แต่ด้วยความช่วยเหลือของเยซูเกย สหายและพันธมิตรของเขาเท่านั้น ที่ ทำให้เขาสามารถรักษามันไว้ได้ สองครั้งที่โทกรูลถูกขับไล่ให้ลี้ภัย และสองครั้งที่เยซูเกยนำเขากลับคืนสู่อำนาจ\n\nแต่จะไม่มีครั้งที่สาม ด้วยเยซูเกยได้สิ้นชีพแล้ว ถูกสังหารโดยเผ่าอริ และเหล่าศัตรูของโทกรูลก็ตระหนักดีถึงการจากไปของผู้พิทักษ์ของเขา\n\n#bold เหล่าศัตรูของท่านรุมล้อมดุจฝูงหมาป่า แล้วกำลังที่จะปัดเป่าพวกมันทั้งหมดอยู่ที่ใดเล่า?#!"

 bookmark_nomads_temujin: "มหาประมุขเผ่าเตมูจิน"
 bookmark_nomads_temujin_subheading: "$BOOKMARK_SUBHEADING_HIGH_CHIEFTAIN$"
 bookmark_nomads_temujin_borte: "บอร์เต"
 bookmark_nomads_temujin_hoelun: "โฮเอลุน"
 bookmark_nomads_temujin_desc: "[Concept( 'story_content_temujin', '$bm_story_content_available_icon|q$' )|E] [Concept( 'story_content_temujin', '$bm_story_content_available_copy|q$' )|E]\nเตมูจินเกิดมาพร้อมลิ่มเลือดในมือขวา — สัญญาณแห่งชะตากรรมอันไม่ธรรมดา แม้จะยังเยาว์วัย เขาก็ได้เผชิญกับบททดสอบอันหนักหนาสาหัสมาแล้ว: การสังหารบิดา ความหิวโหยอย่างแสนสาหัส และการถูกคุมขังโดยเผ่าอริ ทว่าความมุ่งมั่นของเขายังคงไม่สั่นคลอน และบัดนี้เขากำลังรวบรวมเหล่าทหารม้าผู้กล้าหาญมาอยู่ใต้ธงของตน\n\n#bold จงให้ปฐพีสั่นสะเทือนภายใต้เสียงกีบม้าอันกึกก้องของกองพลเร่ร่อนอันมิรู้จบของท่าน และจงทำให้โลกก้มหัวให้แก่เจตจำนงของท่าน!#!"

 bookmark_nomads_jamukha: "ประมุขเผ่าจามูกา"
 bookmark_nomads_jamukha_subheading: "$BOOKMARK_SUBHEADING_CHIEFTAIN$"
 bookmark_nomads_jamukha_desc: "[Concept( 'story_content_jamukha', '$bm_story_content_available_icon|q$' )|E] [Concept( 'story_content_jamukha', '$bm_story_content_available_copy|q$' )|E]\nจามูกาเป็นนักรบผู้เกรียงไกรโดยกำเนิด เขาผ่านพ้นวัยเยาว์ด้วยความช่วยเหลือของเตมูจิน และต่างก็ได้สร้างสายสัมพันธ์อันแน่นแฟ้นยิ่งกว่าสายเลือด ความหยิ่งทะนงโดยกำเนิดของเขาส่งเสริมรสนิยมในอำนาจที่เพิ่มพูนขึ้นของเตมูจิน... แต่ทั้งสองเห็นพ้องต้องกันในเรื่องการเป็นผู้นำน้อยครั้งนัก\n\n#bold ดาบแห่งอัลไตเอ๋ย ท่านจะพิชิต #EMP อันด้า#! ของท่าน หรือจะดับสูญในเงาของเขา?#!"

 bookmark_nomads_koncek: "ข่านคอนเชค"
 bookmark_nomads_koncek_subheading: "$BOOKMARK_SUBHEADING_KHAN$"
 bookmark_nomads_koncek_kotyan: "โคเทียน"
 bookmark_nomads_koncek_svoboda: "สโวโบดา"
 bookmark_nomads_koncek_desc: "จากทะเลดำจรดดินแดนรกร้างอัลติน — ทุกคนรู้จักนามของเขา การรวมชาวคูมานภายใต้ธงผืนเดียวมิใช่เรื่องง่ายที่จะปกครองดินแดนอันผันผวนเหล่านี้ และต้องใช้ความอดทนอดกลั้นที่จำเป็นเพื่อรักษาอำนาจไว้\n\nเหล่าเจ้าชายแห่งรัสเซียหมายมั่นจะ ทำให้ภาพลักษณ์ของเขาเสื่อมเสียอีกครั้ง และในวัยชราของเขา คอนเชคจำต้องทุ่มเทให้กับการศึกที่กำลังจะมาถึง ด้วยข่านองค์เดียวมิอาจครองราชย์ได้ชั่วนิรันดร์\n\n#bold ญาติพี่น้องของท่านพึ่งพาท่าน ท่านจะเป็นผู้ที่ยืนหยัดเป็นหนึ่งเดียว หรือผู้คนของท่านจะตกสู่การต่อสู้กันเองและความระส่ำระสายอีกครั้ง?#!"

 bookmark_nomads_inanch_bilge: "ข่านอินันช์ บิลเก"
 bookmark_nomads_inanch_bilge_subheading: "$BOOKMARK_SUBHEADING_KHAN_WITH_THE$"
 bookmark_nomads_inanch_bilge_gurbesu: "กูร์เบซู"
 bookmark_nomads_inanch_bilge_tayang: "ตายังผู้อ่อนแอ"
 bookmark_nomads_inanch_bilge_desc: "ด้วยการอ้างว่าเป็นผู้สืบเชื้อสายในตำนานจากโหราจารย์ในพระคัมภีร์ อินันช์ บิลเก ได้พิสูจน์สายเลือดของตนด้วยการต่อสู้แย่งชิงอิสรภาพจากพวกคาราคิดไท\n\nแต่ชะตากรรมอันโหดร้ายรออยู่: ตายัง โอรสและทายาทของข่าน จะต้องเผชิญหน้ากับเตมูจินผู้ยิ่งใหญ่ในสนามรบ และพ่ายแพ้ จากนั้น กูร์เบซู ชายาของเขา ก็จบชีวิตลงด้วยการเป็นนางบำเรอของผู้ชนะ...\n\n#bold ท่านจะสามารถท้าทายชะตากรรมนี้และสร้างความมั่นคงให้แก่การสืบทอดอำนาจได้หรือไม่? หรือความอ่อนแอของบุตรชายท่านจะทำให้สายเลือดของท่านต้องพบกับความอัปยศชั่วนิรันดร์?#!"

 bookmark_nomads_duolubu: "ประมุขเผ่าตั๋วหลูปู้"
 bookmark_nomads_duolubu_subheading: "$BOOKMARK_SUBHEADING_CHIEFTAIN$"
 bookmark_nomads_duolubu_wolila: "โวลิลา"
 bookmark_nomads_duolubu_desc: "ตั๋วหลูปู้เคยเป็นบากาฮาตูร์ผู้ภักดีต่อคาราคิดไท แต่แล้วกลับต้องทนทุกข์ทรมานจากการทรยศหักหลังโดยเลือดเนื้อเชื้อไขของตนเอง ภรรยาของเขาสิ้นใจในอ้อมแขนของน้องชายตนเอง และหลานชายของนางบัดนี้ได้ครองบัลลังก์\n\nขณะที่บิดาของเขานอนรอความตายบนเตียง เวลาแห่งการลงมือใกล้เข้ามาแล้ว หากจื๋อลู่กู่ผู้อ่อนวัยยังมิอาจถูกโน้มน้าวได้ ก็อาจถึงเวลาที่จะทอดทิ้งเขาโดยสิ้นเชิง\n\n#bold วันคืนอันมืดมิดที่สุดของท่านได้ผ่านพ้นไปแล้ว และดวงอาทิตย์ก็ขึ้นใหม่อีกครั้ง ท่านจะสามารถกอบกู้เกียรติยศของท่านกลับคืนมาได้หรือไม่ หรือจะถูกจดจำว่าเป็นคนเขลาไปตลอดกาล?#!"

 bookmark_nomads_wolila: "ประมุขเผ่าโวลิลา"
 bookmark_nomads_wolila_subheading: "$BOOKMARK_SUBHEADING_CHIEFTAIN$"
 bookmark_nomads_wolila_zhilugu: "คากานจี๋หลูกู่"
 bookmark_nomads_wolila_desc: "โวลิลามีบุตรชายผู้เข้มแข็งสองคน คนแรกคือตั๋วหลูปู้ผู้แน่วแน่ ผู้สร้างสันติแห่งบูรพาทิศ ได้สมรสกับจักรพรรดินีแห่งคาราคิดไท คนที่สองคือปูกูซีผู้ไม่ซื่อสัตย์ ได้กลายเป็นชู้รักของนาง ภรรยาและน้องชาย: ทั้งสองร่วมกันวางแผนสังหารตั๋วหลูปู้ ด้วยความเดือดดาลจากการฆ่าพี่น้อง โวลิลาได้นำชู้รักทั้งสองมารับโทษทัณฑ์จนถึงแก่ความตาย จากนั้นจี๋หลูกู่แห่งตระกูลเยลูจึงได้ขึ้นครองบัลลังก์แห่งคาราคิดไท\n\n#bold พายุลูกสุดท้ายกำลังจะมาเยือนชาวคิตัน ท่านจะสามารถเป็นปากเสียงให้แก่ผู้คนของท่าน ยืนหยัดเพื่อเกียรติยศของท่านอีกครั้ง และเปลี่ยนแปลงชะตากรรมของพวกเขาได้หรือไม่?#!"
