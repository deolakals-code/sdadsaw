l_english: 
 bm_1178_call_of_the_empire: "เสียงเพรียกแห่งจักรวรรดิ"
 bm_1178_call_of_the_empire_desc: "จักรพรรดิผู้ชราภาพ รัชทายาทผู้เยาว์วัย และความพ่ายแพ้ในสนามรบล่าสุดด้วยน้ำมือของพวกเซลจุคแห่งอนาโตเลีย ได้ ทำให้ไบแซนไทน์ตกอยู่ในสภาวะเปราะบาง และประวัติศาสตร์ได้พิสูจน์ครั้งแล้วครั้งเล่าว่าภัยคุกคามที่ยิ่งใหญ่ที่สุดต่อจักรวรรดิมักมาจากภายในบ่อยครั้งพอ ๆ กับจากภายนอก\n\n#bold ทายาทแห่งโรมจะเผชิญกับแสงสุดท้ายแห่งสนธยา หรือพวกเขาจะฝ่าฟันค่ำคืนอันยาวนานไปสู่รุ่งอรุณใหม่ได้หรือไม่?#!"

 bookmark_call_of_the_empire_tamar: "เจ้าหญิงทามาร์"
 bookmark_call_of_the_empire_tamar_subheading: "$BOOKMARK_SUBHEADING_DEFAULT$"
 bookmark_call_of_the_empire_tamar_giorgi: "กษัตริย์จิออร์จิแห่งจอร์เจีย"
 bookmark_call_of_the_empire_tamar_rusudan: "รูซูดาน"
 bookmark_call_of_the_empire_tamar_desc: "แม้จะมีการคัดค้านอย่างแข็งขันจากขุนนางจอร์เจีย กษัตริย์แห่งจอร์เจียได้ทรงประกาศชัดเจนว่า ทามาร์ พระธิดาองค์โตของพระองค์ จะสืบทอดราชบัลลังก์ต่อจากพระองค์ ซึ่งเป็นการกระทำที่ไม่เคยมีมาก่อนในประวัติศาสตร์อันยาวนานของราชอาณาจักร\n\nเส้นทางข้างหน้าจะยากลำบาก และน้อยคนนักในหมู่ข้าในบังคับในอนาคตของนางที่จะยินดีเห็นนางประสบความสำเร็จ แต่ผู้ที่รู้จักเจ้าหญิงเป็นอย่างดีต่างมั่นใจว่านางจะสามารถรับมือกับสถานการณ์ได้\n\n#bold ท่านจะสามารถพิสูจน์ให้ผู้ที่สงสัยในคุณค่าของท่านเห็นว่าพวกเขาคิดผิด และนำจอร์เจียไปสู่ยุคทองอันรุ่งโรจน์ได้หรือไม่?#!"

 bookmark_call_of_the_empire_kilij_arslan: "สุลต่านคิลิจ อาร์สลาน"
 bookmark_call_of_the_empire_kilij_arslan_subheading: "$BOOKMARK_SUBHEADING_DEFAULT$"
 bookmark_call_of_the_empire_kilij_arslan_suleyman: "สุไลมาน"
 bookmark_call_of_the_empire_kilij_arslan_kaykhusraw: "ไคคุสเรา"
 bookmark_call_of_the_empire_kilij_arslan_desc: "สดใหม่จากชัยชนะเหนือพวกไบแซนไทน์ในยุทธการที่มิริโอเคฟาลอน คิลิจ อาร์สลาน ได้พิสูจน์ตนเองว่าเป็นอำนาจที่ต้องคำนึงถึงในอนาโตเลีย\n\nหากมีเวลา เขาอาจเดินทัพไปถึงกำแพงเมืองคอนสแตนติโนเปิล แต่การแย่งชิงตำแหน่งผู้สืบทอดของบุตรชายหลายคนของเขาอาจกลายเป็นสิ่งรบกวนที่ร้ายแรง เพราะแม้ แต่บิดาของคิลิจ อาร์สลาน เองก็ยังขึ้นครองบัลลังก์เหนือร่างของพี่น้องของตนเอง\n\n#bold บุตรชายคนใดของท่านที่จะพิสูจน์ว่าคู่ควรที่จะสานต่อความพยายามของท่าน และรุมจะสามารถอยู่รอดจากการแข่งขันของพวกเขาได้หรือไม่?#!"

 bookmark_call_of_the_empire_angelos: "สตราเตกอส อันโดรนิคอส"
 bookmark_call_of_the_empire_angelos_subheading: "$BOOKMARK_SUBHEADING_GOVERNOR$"
 bookmark_call_of_the_empire_angelos_alexios: "อเล็กซิออส"
 bookmark_call_of_the_empire_angelos_ioannes: "ไอโออันเนส"
 bookmark_call_of_the_empire_angelos_desc: "ในฐานะหลานชายของบาซิลิอุส อเล็กซิออส คอมเนนอส อันโดรนิคอสมีอาชีพการงานที่โดดเด่นในการรับใช้จักรวรรดิ แต่เมื่อพี่น้องและบุตรชายของเขาไต่เต้าขึ้นสู่ยอดพีระมิดแห่งอำนาจมากขึ้นเรื่อย ๆ พวกเขาก็เข้าใกล้ความสูงอันตรายที่การก้าวพลาดเพียงครั้งเดียวอาจเป็นอันตรายถึงชีวิตต่อทุกคน\n\n#bold ราชวงศ์คอมเนนอสสร้างขึ้นบนสายสัมพันธ์ของพี่น้อง และท่านก็มีความสัมพันธ์ทางสายเลือดมากมาย ท่านจะสามารถใช้ประโยชน์จากสายสัมพันธ์ในครอบครัวเพื่อก้าวขึ้นสู่ตำแหน่งที่สูงขึ้นได้หรือไม่?#!"

 bookmark_call_of_the_empire_palaiologos: "สตราเตกอส อเล็กซิออส"
 bookmark_call_of_the_empire_palaiologos_subheading: "$BOOKMARK_SUBHEADING_GOVERNOR$"
 bookmark_call_of_the_empire_palaiologos_eirene: "ไอรีนี"
 bookmark_call_of_the_empire_palaiologos_desc: "ตระกูลของอเล็กซิออสมีความโดดเด่นแม้ในหมู่นามสกุลที่ทรงอำนาจและมีอิทธิพลของจักรวรรดิไบแซนไทน์ โดยได้ดำรงตำแหน่งสำคัญมานานกว่าศตวรรษ และบรรพบุรุษของเขาก็มีส่วนอย่างมากต่อการขึ้นสู่อำนาจของราชวงศ์คอมเนนอส\n\nความภักดีต่อราชบัลลังก์ของพวกเขานั้นมั่นคง แต่ความใกล้ชิดกับอำนาจมักนำไปสู่การล่อลวงอันทรงพลัง: ตระกูลปาไลโอโลกอสจะพอใจกับการรับใช้ไปได้นานแค่ไหน?\n\n#bold อเล็กซิออสและครอบครัวของเขาจะยังคงสนับสนุนราชบัลลังก์ต่อไป หรือพวกเขาจะโลภอยากได้มันเสียเอง?#!"

 bookmark_call_of_the_empire_ioannes_kantakouzenos: "สตราเตกอส ไอโออันเนส"
 bookmark_call_of_the_empire_ioannes_kantakouzenos_subheading: "$BOOKMARK_SUBHEADING_GOVERNOR$"
 bookmark_call_of_the_empire_ioannes_kantakouzenos_michael: "มิคาเอล"
 bookmark_call_of_the_empire_ioannes_kantakouzenos_desc: "หนึ่งในผู้บัญชาการที่เก๋าประสบการณ์ที่สุดของบาซิลิอุส มานูเอล รูปร่างกำยำดุจเฮอร์คิวลีสและความกล้าหาญในสนามรบของไอโออันเนสนั้นเทียบเท่ากับความเย่อหยิ่งอันน่าทึ่งและความหุนหันพลันแล่นที่ไม่ยับยั้งชั่งใจของเขา ซึ่งเป็นลักษณะนิสัยที่ไม่ค่อยเอื้อต่อชีวิตที่ยืนยาวและแข็งแรงในเวทีการเมืองไบแซนไทน์\n\n#bold ความกล้าหาญของไอโออันเนสจะนำพาตระกูลคันตาคูเซนอสไปไกลกว่าสถานะปัจจุบันของพวกเขา หรือความเย่อหยิ่งของเขาจะกลายเป็นหายนะของพวกเขาในที่สุด?#!"
