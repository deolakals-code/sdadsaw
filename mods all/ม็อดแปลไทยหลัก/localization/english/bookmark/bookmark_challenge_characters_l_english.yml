 # 867

 # Haraldr
 challenge_character_haraldr_vestfold:0 "หัวหน้าเผ่าฮารัลด์"
 challenge_character_haraldr_vestfold_desc:0 "วีรบุรุษแห่งตำนานซากา ฮารัลด์เป็นที่จดจำในฐานะกษัตริย์ผู้ยิ่งใหญ่ที่รวบรวมเหล่าหัวหน้าเผ่าที่ขัดแย้งกันของนอร์เวย์ไว้ภายใต้ธงผืนเดียวกัน\n\n#bold ท่านจะสามารถยุติความขัดแย้งและรวมนอร์เวย์ไว้ภายใต้การปกครองของท่านได้หรือไม่?#!"

 # Ashot
 challenge_character_ashot_armenia:0 "เจ้าชายอาชอต"
 challenge_character_ashot_armenia_desc:0 "แม้ว่ารัชสมัยของพระองค์จะเป็นยุคแห่งความเจริญรุ่งเรืองสำหรับประชาชน แต่บัลลังก์และราชอาณาจักรของอาชอตนั้นเป็นหนี้บุญคุณของเคาะลีฟะฮ์ และยังคงเป็นข้าราชบริพารของพระองค์ จนกระทั่งสิ้นพระชนม์\n\n#bold ท่านจะสามารถหลุดพ้นจากเจ้าเหนือหัวต่างแดนและพิสูจน์ตนเองว่าเป็นกษัตริย์โดยชอบธรรมได้หรือไม่?#!"

 # Aella
 challenge_character_aella_northumberland:0 "เจ้าผู้ครองแคว้นแอ็ลลา"
 challenge_character_aella_northumberland_desc:0 "ดินแดนของพระองค์ถูกรุกรานโดยผู้บุกรุกจากต่างแดน การสิ้นพระชนม์ของแอ็ลลาด้วยน้ำมือของพวกเขาถือเป็นจุดสิ้นสุดของการต่อต้านที่มีความหมาย ผู้สืบทอดตำแหน่งของพระองค์เป็นเพียงหุ่นเชิดของพวกนอร์ส\n\n#bold ท่านจะสามารถพลิกสถานการณ์และปกป้องนอร์ธัมเบรียจากภัยพิบัติไวกิ้งได้หรือไม่?#!"

 # Gregorios
 challenge_character_gregorios_napoli:0 "เคานต์เกรกอริออส"
 challenge_character_gregorios_napoli_desc:0 "เมื่ออิทธิพลของไบแซนไทน์ในอิตาลีลดน้อยลง ผู้ปกครองเนเปิลส์จึงหันไปหาโลกมุสลิมเพื่อหาพันธมิตรในการเผชิญหน้ากับการรุกล้ำของลอมบาร์ด ซึ่งสร้างความไม่พอใจอย่างยิ่งแก่พระสันตะปาปา\n\n#bold ท่านจะสามารถใช้ประโยชน์จากช่องว่างที่ไบแซนไทน์ทิ้งไว้เพื่อก่อตั้งจักรวรรดิของตนเองได้หรือไม่?#!"

 # Dawit
 challenge_character_dawit_dembiya:0 "ราสดาวิต"
 challenge_character_dawit_dembiya_desc:0 "แม้จะมีจำนวนน้อยและมักตกอยู่ในอันตราย ชาวเบตาอิสราเอลก็สามารถต่อต้านการกลืนชาติโดยเพื่อนบ้านที่ใหญ่กว่าและมีอำนาจมากกว่าได้สำเร็จ\n\n#bold ท่านจะสามารถเอาชนะอุปสรรคและสร้างมาตุภูมิที่เจริญรุ่งเรืองและปลอดภัยสำหรับชาวเบตาอิสราเอลได้หรือไม่?#!"

 # Werner
 challenge_character_werner_worms:0 "เคานต์แวร์เนอร์"
 challenge_character_werner_worms_desc:0 "แม้ว่าชื่อซาเลียนจะยังไม่โด่งดังในสมัยของแวร์เนอร์ แต่ทายาทของเขาจะมีจักรพรรดิโรมันอันศักดิ์สิทธิ์ถึงสี่พระองค์และแม้กระทั่งพระสันตะปาปาหนึ่งองค์รวมอยู่ด้วย\n\n#bold ท่านจะสามารถอ้างสิทธิ์ในมรดกของชาร์เลอมาญเพื่อตนเองและหลอมรวมจักรวรรดิที่แตกแยกของพระองค์ขึ้นใหม่ได้หรือไม่?#!"

 # Siemowit
 challenge_character_siemowit_wielkopolska:0 "หัวหน้าเผ่าใหญ่เซียโมวิต"
 challenge_character_siemowit_wielkopolska_desc:0 "เซียโมวิต บุตรชายของเปียสต์ช่างทำล้อในตำนาน และบิดาของเขาได้ก่อตั้งราชวงศ์ที่จะปกครองโปแลนด์จนถึงปลายศตวรรษที่สิบสี่\n\n#bold ท่านจะสามารถนำพาโปแลนด์ผ่านศตวรรษต่าง ๆ ได้อย่างปลอดภัยและทำให้โปแลนด์เป็นที่อิจฉาของทั้งตะวันออกและตะวันตกได้หรือไม่?#!"

 # Ahmad
 challenge_character_ahmad_egypt:0 "สุลต่านอะห์มัด"
 challenge_character_ahmad_egypt_desc:0 "อะห์มัดผงาดขึ้นมาจากจุดเริ่มต้นอันต่ำต้อยเพื่อครอบครองอียิปต์ แต่ทายาทของเขาล้มเหลวในการพิสูจน์ตนเองว่าทัดเทียมกับเขา และอาณาจักรของเขาก็ล่มสลายลงเพียงยี่สิบเอ็ดปีหลังจากการตายของเขา\n\n#bold ด้วยความมั่งคั่งและอำนาจของอียิปต์ที่ท่านบัญชาการ ท่านจะสามารถทำให้ตนเองเป็นเจ้าแห่งทะเลเมดิเตอร์เรเนียนได้หรือไม่?#!"

 # Dyre
 challenge_character_dyre_kiev:0 "ยาร์ลดีเรอ"
 challenge_character_dyre_kiev_desc:0 "นักผจญภัยชาวนอร์สที่พยายามสร้างชื่อเสียงในแดนตะวันออก ความพยายามอันกล้าหาญของดีเรอจบลงด้วยการถูกชิงบัลลังก์อย่างน่าอดสูและการสิ้นชีพด้วยน้ำมือของโอเลกผู้ปราดเปรื่อง\n\n#bold ท่านจะสามารถเขียนเรื่องราวอันน่าเศร้าของดีเรอขึ้นใหม่ให้เป็นตำนานซากาที่จะดังก้องไปชั่วกาลนานได้หรือไม่?#!"

 # Dumnarth
 challenge_character_dumnarth_cornwall:0 "เจ้าผู้ครองแคว้นดุมนาร์ธ"
 challenge_character_dumnarth_cornwall_desc:0 "ดุมนาร์ธมีเกียรติอันน่าสงสัยที่ถูกจดจำส่วนใหญ่ในฐานะกษัตริย์คอร์นิชองค์สุดท้าย และประสบจุดจบในแม่น้ำด้วยอุบัติเหตุ\n\n#bold ภายใต้การปกครองของท่าน คอร์นวอลล์จะสามารถเผชิญหน้ากับผู้ท้าชิงทั้งแองโกล-แซกซอนและนอร์ส และได้รับชัยชนะได้หรือไม่?#!"

 # Rhodri
 challenge_character_rhodri_gwynedd:0 "เจ้าชายโรดรี"
 challenge_character_rhodri_gwynedd_desc:0 "โรดรีสืบทอดบัลลังก์ของราชอาณาจักรเวลส์เล็ก ๆ ในช่วงก่อนการรุกรานของไวกิ้ง มงกุฎของพระองค์วางอยู่บนพระเศียรอย่างไม่มั่นคง แต่พระองค์ก็ทรงรับมือกับสถานการณ์ที่เผชิญได้อย่างคล่องแคล่ว\n\n#bold ท่านจะสามารถนำทางผ่านน่านน้ำแห่งยุคสมัยอันวุ่นวายนี้ได้อย่างปลอดภัยและรับประกันว่ากวินเน็ดจะได้รับชัยชนะได้หรือไม่?#!"

 # Gunda
 challenge_character_gunda_orangallu:0 "สมันตะ กุณฑะ"
 challenge_character_gunda_orangallu_desc:0 "จนกระทั่งราชวงศ์กากฏียะเปลี่ยนจากศาสนาเชนมานับถือศาสนาฮินดู พวกเขาจึงสามารถครอบครองดินแดนได้มากพอที่จะเรียกตนเองว่ากษัตริย์ ซึ่งอาจเป็นเรื่องง่ายขึ้นหากปราศจากความมุ่งมั่นอย่างเคร่งครัดของศาสนาเชนต่อการไม่ใช้ความรุนแรง\n\n#bold ท่านจะสามารถได้บัลลังก์เป็นของตนเองในขณะที่ยังคงยึดมั่นในหลักธรรมของศาสนาของท่านได้หรือไม่?#!"

 # Muhammad
 challenge_character_muhammad_africa: "สุลต่านมุฮัมมัด"
 challenge_character_muhammad_africa_desc: "แม้ว่ารัชสมัยอันสั้นของพระองค์จะถูกจดจำส่วนใหญ่จากการใช้ชีวิตอย่างเสเพลและความฟุ่มเฟือย แต่นายพลของมุฮัมมัดประสบความสำเร็จอย่างมากจนบังคับให้พระสันตะปาปาต้องส่งเครื่องบรรณาการให้แก่ประมุขผู้เสื่อมทรามผู้นี้\n\n#bold เมื่อได้ลิ้มรสความมั่งคั่งของอิตาลีแล้ว ท่านจะกลืนกินมันทั้งหมดเพื่อสนองความปรารถนาของท่านหรือไม่?#!"

 # Alfonsu
 challenge_character_alfonsu_asturias: "กษัตริย์อัลฟองโซ"
 challenge_character_alfonsu_asturias_desc: "ใกล้สิ้นพระชนม์ อัลฟองโซตกเป็นเหยื่อความทะเยอทะยานของเหล่าโอรสและถูกปลดจากราชบัลลังก์ ถูกบังคับให้แบ่งอาณาจักรของพระองค์ให้แก่โอรสสามพระองค์\n\n#bold ท่านจะสามารถหลีกเลี่ยงชะตากรรมของอัลฟองโซ และรับประกันว่าชาวคริสต์ในไอบีเรียจะยังคงเป็นแนวร่วมที่เป็นปึกแผ่นต่อต้านภัยคุกคามจากราชวงศ์อุมัยยะฮ์ได้หรือไม่?#!"

 # Vicayalaya
 challenge_character_vicayalaya_chola_nadu: "ราชา วิชัยยาละยะ"
 challenge_character_vicayalaya_chola_nadu_desc: "เดิมทีเป็นข้าในบังคับของราชวงศ์ปัลลวะ วิชัยยาละยะเห็นโอกาสและแยกตัวออกมาเพื่อก่อตั้งจักรวรรดิที่จะรวมอินเดียตอนใต้ทั้งหมดไว้ภายใต้ธงของตน\n\n#bold ท่านจะสามารถนำความทะเยอทะยานของโจฬะไปสู่บทสรุปตามธรรมชาติและนำอินเดียทั้งหมดมาอยู่ภายใต้การปกครองของท่านได้หรือไม่?#!"

 # Lambert
 challenge_character_lambert_spoleto: "ดยุกแลมเบิร์ต"
 challenge_character_lambert_spoleto_desc: "แลมเบิร์ตได้รับเชิญให้เข้าร่วมพิธีสถาปนาของพระสันตะปาปา แต่กลับปล้นสะดมเมืองอย่างอื้อฉาว ปล้นคฤหาสน์และอารามอย่างเท่าเทียมกัน และไม่มีใครรอดพ้นจากความละโมบของเขา\n\n#bold เมื่อไม่เคารพทั้งกฎหมายของมนุษย์และพระเจ้า ท่านจะไปได้ไกลแค่ไหนในการไล่ตามความทะเยอทะยานของท่าน?#!"

 # Amoghavarsha
 challenge_character_amoghavarsha_karnata: "มหาราชา อโมฆวรรษ"
 challenge_character_amoghavarsha_karnata_desc: "อโมฆวรรษขึ้นครองราชย์เมื่อพระชนมายุเพียงสิบสี่พรรษา ทรงครองราชย์ยาวนานที่สุดครั้งหนึ่งในประวัติศาสตร์ และมีชื่อเสียงในด้านความเมตตากรุณาและความสำเร็จทางวรรณกรรมและวัฒนธรรม\n\n#bold ท่านจะสามารถรับประกันได้หรือไม่ว่าความสำเร็จของอโมฆวรรษจะได้รับการอนุรักษ์ไว้สำหรับคนรุ่นหลัง?#!"

 # 1066

 # Gudrod
 challenge_character_gudrod_western_isles:0 "เจ้าผู้ครองแคว้นกุดรอด"
 challenge_character_gudrod_western_isles_desc:0 "ขุนศึกชาวเฮบริดีสผู้กล้าหาญ ซึ่งมีพื้นเพเป็นทหารรับจ้าง กุดรอดขยายอำนาจของตนจนกลายเป็นเจ้าแห่งดับลิน เกาะแมน และทะเลไอริช แต่การต่อสู้ภายในหมู่ทายาทของเขาก็ได้ลดทอนความสำเร็จของเขาลงไปมาก\n\n#bold ท่านจะสามารถสถาปนาอำนาจที่ถาวรกว่าเหนือหมู่เกาะอันงดงามเหล่านี้ได้หรือไม่?#!"

 # Richard
 challenge_character_richard_capua:0 "ดยุกริชาร์ด"
 challenge_character_richard_capua_desc:0 "แม้ว่าตระกูลโอตวิลล์อาจยึดอำนาจสูงสุดเหนือซิซิลีไปแล้ว แต่ปฏิเสธไม่ได้ว่าตระกูลเดรงโกต์มาถึงก่อน โดยเป็นหนึ่งในกลุ่มนักปล้นสะดมชาวนอร์มันกลุ่มแรกสุดที่เหยียบย่างคาบสมุทร\n\n#bold ท่านจะสามารถสั่งสอนพวกโอตวิลล์หน้าใหม่ที่เพิ่งมาถึงให้อยู่ในที่ของตน และพิสูจน์ความเหนือกว่าของเดรงโกต์ได้หรือไม่?#!"

 # Fariburz
 challenge_character_fariburz_shirvan:0 "ชีร์วานชาห์ ฟาริบุรซ์"
 challenge_character_fariburz_shirvan_desc:0 "เหล่าชีร์วานชาห์เป็นที่จดจำในฐานะผู้อุปถัมภ์และผู้มีพระคุณต่อนักกวีและนักปรัชญา ศิลปะและชีวิตทางปัญญามักเจริญรุ่งเรืองภายใต้การปกครองของพวกเขา\n\n#bold ท่านจะสามารถทำให้ราชสำนักของท่านเป็นประภาคารแห่งวัฒนธรรมอันส่องสว่างให้ทั่วโลกชื่นชมได้หรือไม่?#!"

 # Shisnand
 challenge_character_shisnand_coimbra:0 "เคานต์ชิสนันด์"
 challenge_character_shisnand_coimbra_desc:0 "ขุนนางโมซาราบิกที่เปลี่ยนจากการรับใช้อับบาดิดมาเป็นการรับใช้เลออน ชิสนันด์ปกครองกูอิงบราเกือบจะโดยอิสระนานกว่ายี่สิบปี และบุตรเขยของเขาก็สืบทอดตำแหน่งต่อเมื่อเขาสิ้นชีวิต\n\n#bold เมื่อเคยรับใช้เจ้าเหนือหัวทั้งมุสลิมและคริสเตียน ท่านจะสามารถสร้างสะพานเชื่อมระหว่างศาสนาและนำสันติภาพมาสู่ไอบีเรียได้หรือไม่?#!"

 # Alusian
 challenge_character_alusian_vidin:0 "เคานต์อาลูเซียน"
 challenge_character_alusian_vidin_desc:0 "บุตรชายคนที่สองของจักรพรรดิองค์สุดท้ายของบัลแกเรียอาจได้รับเกียรติยศมากมายจากเจ้านายไบแซนไทน์คนใหม่ของเขา แต่เขาก็ไม่มองข้ามโอกาสที่จะฟื้นฟูจักรวรรดิของบิดา แม้ว่าในที่สุดเขาจะกลับคืนสู่ฝูงก็ตาม\n\n#bold ท่านจะสามารถสลัดแอกไบแซนไทน์และทวงคืนสิทธิ์โดยกำเนิดของท่านได้หรือไม่?#!"

 # Rostislav
 challenge_character_rostislav_tmutarakan:0 "เคานต์รอสติสลาฟ"
 challenge_character_rostislav_tmutarakan_desc:0 "รอสติสลาฟถูกริบทรัพย์สินมรดก เนื่องจากการตายก่อนวัยอันควรของบิดา เขาจึงพิชิตคาบสมุทรทมูทาราคานอันห่างไกลและ ทำให้เป็นฐานที่มั่นของตน แต่ถูกวางยาก่อนที่จะสามารถบรรลุความทะเยอทะยานของตนได้\n\n#bold ท่านจะสามารถเอาชนะความเป็นปรปักษ์ของญาติพี่น้องและได้รับอาณาเขตที่คู่ควรกับสายเลือดของท่านได้หรือไม่?#!"

 # Werner
 challenge_character_werner_aargau:0 "เคานต์แวร์เนอร์"
 challenge_character_werner_aargau_desc:0 "แม้ว่าตระกูลฮับส์บูร์กจะยังไม่ได้สร้างชื่อเสียงในสมัยของแวร์เนอร์ แต่การเมืองที่ชาญฉลาดจะ ทำให้ทายาทของเขานั่งบนบัลลังก์มากมายในอีกหลายศตวรรษต่อมา\n\n#bold ท่านสามารถยึดครองออสเตรียให้แก่ตระกูลฮับส์บูร์ก และทำให้ทั่วโลกยอมรับการขึ้นสู่อำนาจของพวกเขาได้หรือไม่?#!"

 # Herbert
 challenge_character_herbert_vermandois:0 "เคานต์แอร์แบร์"
 challenge_character_herbert_vermandois_desc:0 "แม้ว่าสายเลือดของชาร์เลอมาญอาจไม่ได้เป็นกษัตริย์อีกต่อไป แต่เลือดของพวกเขายังคงสืบทอดอยู่ในแอร์แบร์แห่งแวร์ม็องดัว แม้ว่าคนรุ่นต่อไปจะได้เห็นดินแดนของเขาหลุดออกจากครอบครัวไปก็ตาม\n\n#bold ท่านจะสามารถย้อนเวลากลับไปและวางแผนการกลับคืนสู่อำนาจ ไม่ว่าจะด้วยวิธีใดก็ตาม สำหรับราชวงศ์คาโรแล็งเชียงได้หรือไม่?#!"

 # Erik
 challenge_character_erik_svealand:0 "เจ้าชายเอริค"
 challenge_character_erik_svealand_desc:0 "ผู้ปกครองนอกรีตที่ละทิ้งศาสนาคริสต์และกลับคืนสู่รากเหง้าของตน เอริคเป็นหนึ่งในกลุ่มคนสุดท้ายที่กำลังจะสูญพันธุ์ในสแกนดิเนเวียที่กลายเป็นคริสเตียนมากขึ้นเรื่อย ๆ\n\n#bold ท่านจะสามารถพิสูจน์ให้ทุกคนเห็นว่าวิถีดั้งเดิมนั้นเหนือกว่าเหล่านักบวชต่างชาติและพระเจ้าองค์ใหม่ของพวกเขาได้หรือไม่?#!"

 # Krutoj
 challenge_character_krutoj_nordmark:0 "ดยุกครูตอย"
 challenge_character_krutoj_nordmark_desc:0 "ผู้ยึดมั่นในวิถีดั้งเดิมของประชาชนอย่างเคร่งครัด ครูตอยนำการลุกฮือและสังหารเจ้าเหนือหัวคริสเตียนของตน ยึดบัลลังก์มาเป็นของตนเอง แต่แผนการกำจัดบุตรชายของเจ้าเหนือหัวกลับจบลงด้วยการตายของตนเอง\n\n#bold ท่านจะสามารถเอาชนะคู่แข่งและทำให้การปกครองของท่านชอบธรรม แม้จะเริ่มต้นด้วยเลือดได้หรือไม่?#!"

 # Ishaq
 challenge_character_ishaq_baalbek:0 "เชคอิสฮาก"
 challenge_character_ishaq_baalbek_desc:0 "แม้จะมีจำนวนน้อยและถูกข่มเหงโดยผู้ที่ถือว่าความเชื่อของพวกเขาเป็นพวกนอกรีต ชาวดรูซก็อดทนมาได้ตลอดหลายศตวรรษโดยการลี้ภัยในเทือกเขาขรุขระของเลแวนต์\n\n#bold ท่านจะสามารถนำชาวดรูซออกจากเทือกเขาเพื่อค้นหามาตุภูมิอันสงบสุขเป็นของตนเองได้หรือไม่?#!"

 # Badr
 challenge_character_badr_acre: "เชคบัดร์"
 challenge_character_badr_acre_desc: "ทหารฟาติมิดเชื้อสายอาร์เมเนีย บัดร์ไต่เต้าตำแหน่งจนกลายเป็นเผด็จการทหารสูงสุดของรัฐเคาะลีฟะฮ์ ลดทอนอำนาจของเคาะลีฟะฮ์เองให้เหลือเพียงแค่หุ่นเชิด\n\n#bold บัดร์และผู้สืบทอดของเขาครอบงำการเมืองอียิปต์นานกว่าหกสิบปี – ท่านจะสามารถทำได้เหนือกว่าพวกเขาและกำจัดเคาะลีฟะฮ์ไปเสียทั้งหมดได้หรือไม่?#!"

 # Berenguer
 challenge_character_berenguer_barcelona: "ดยุกเบเรนเกร์"
 challenge_character_berenguer_barcelona_desc: "ในการแสวงหาความยุติธรรม เบเรนเกร์ได้จัดการประมวลกฎหมายจารีตประเพณีของอาณาจักรของตนเป็น Usatges of Barcelona ซึ่งจะเป็นรากฐานสำหรับกฎหมายคาตาลันไปอีกหลายศตวรรษ\n\n#bold ทายาทของเบเรนเกร์จะเข้ามาควบคุมพื้นที่ส่วนใหญ่ของทะเลเมดิเตอร์เรเนียนในเวลาต่อมา ท่านจะสามารถต่อยอดความสำเร็จของเขาและทำเช่นเดียวกันได้หรือไม่?#!"
 
 # Raoul
 challenge_character_raoul_valois: "เคานต์ราอูล"
 challenge_character_raoul_valois_desc: "แม้จะเป็นศัตรูของราชวงศ์กาเปเซียงในช่วงต้นของชีวิต แต่ต่อมาราอูลได้เปลี่ยนข้างและกลายเป็นข้ารับใช้ผู้ภักดีของราชบัลลังก์ฝรั่งเศส ในที่สุดก็ได้อภิเษกสมรสกับมเหสีม่ายของกษัตริย์ที่เขาเคยต่อสู้ด้วย\n\n#bold ด้วยมารดาของเจ้าเหนือหัวหนุ่มเป็นภรรยาของท่าน ท่านจะสามารถใช้อิทธิพลของท่านให้กลายเป็นสิ่งที่ยิ่งใหญ่กว่าได้หรือไม่?#!"
 
 # Ali
 challenge_character_ali_siracusa: "เชคอาลี"
 challenge_character_ali_siracusa_desc: "หนึ่งในฐานที่มั่นสุดท้ายที่ต่อต้านการรุกรานซิซิลีของนอร์มัน อาลีกระโดดลงไปในมหาสมุทรและจมน้ำตายขณะพยายามกระโดดขึ้นเรือของศัตรู\n\n#bold พวกนอร์มันมาถึงแล้ว แต่พวกเขายังไม่ได้พิชิตทั้งหมด – ท่านจะสามารถพลิกสถานการณ์และยึดซิซิลีมาเป็นของท่านเองได้หรือไม่?#!"
 
 # Eadgar
 challenge_character_eadgar_warwickshire: "เอ็ดการ์"
 challenge_character_eadgar_warwickshire_desc: "เกิดในแดนเนรเทศ ทายาทคนสุดท้ายของราชวงศ์เวสเซ็กซ์กลับมาอังกฤษทันเวลาพอดีที่จะได้เห็นสิทธิ์โดยกำเนิดของตนถูกแย่งชิงเป็นครั้งที่สองโดยฮาโรลด์ กอดวินสัน จากนั้นก็สูญเสียไปอย่างไม่อาจแก้ไขได้ให้กับผู้พิชิตชาวนอร์มัน\n\n#bold แสงสว่างของราชวงศ์เวสเซ็กซ์ริบหรี่ลง แต่ยังไม่ดับสิ้น ท่านจะสามารถฟื้นฟูโชคชะตาของราชวงศ์ได้หรือไม่?#!"
 
 # Ali
 challenge_character_ali_taizz: "เอมีร์ อาลี"
 challenge_character_ali_taizz_desc: "บุตรชายของผู้พิพากษา อาลีออกเดินทางพร้อมกับผู้ติดตามกลุ่มเล็ก ๆ และได้รับชัยชนะในราชอาณาจักร แต่ได้รับคำยกย่องมากกว่าจากสติปัญญาของอัสมา ภรรยาของเขา ซึ่งเขาไว้วางใจให้ดูแลการบริหารรัฐของเขา\n\n#bold ด้วยคู่ครองที่มีความสามารถเช่นนี้อยู่เคียงข้าง ทุกสิ่งดูเหมือนจะเป็นไปได้ ด้วยกันแล้ว อาระเบียทั้งหมดก็เป็นของท่าน!#!"
 
 # Pierre
 challenge_character_pierre_piedmonte: "ดยุกปิแอร์"
 challenge_character_pierre_piedmonte_desc: "ตระกูลซาวอยเป็นหนี้บุญคุณดินแดนส่วนใหญ่จากการสืบทอดมรดกของอาเดลาอีเดแห่งตูริน มารดาของปิแอร์ ซึ่งมีอิทธิพลสูงสุดในราชสำนักของบุตรชาย ซึ่งเกือบจะแน่นอนว่าเป็นไปในทางที่ดีขึ้น\n\n#bold ท่านจะสามารถหลุดพ้นจากเงาของมารดาผู้โด่งดังและพิสูจน์ตนเองว่าเป็นผู้ปกครองที่คู่ควรในสิทธิของท่านเองได้หรือไม่?#!"
 
 # Anawrahta
 challenge_character_anawrahta_pagan: "กษัตริย์อโนรธา"
 challenge_character_anawrahta_pagan_desc: "ผู้ก่อตั้งอาณาจักรพุกาม อโนรธาปกครองอย่างรอบคอบและปราบปรามภัยคุกคามใด ๆ ต่ออาณาจักรใหม่อย่างโหดเหี้ยม และการอุปถัมภ์พุทธศาสนานิกายเถรวาทของพระองค์ก็มีส่วนอย่างมากต่อการเผยแผ่ศาสนา\n\n#bold ผู้สืบทอดของอโนรธามีความสามารถทัดเทียมกับบรรพบุรุษ แต่พวกมองโกลพิสูจน์แล้วว่าเป็นศัตรูที่แข็งแกร่งเกินไปสำหรับชาวพุกาม – ท่านจะสามารถรับมือกับพายุที่กำลังจะมาถึงได้ดีกว่าหรือไม่?#!"

 # 1178

 # Piarres
 challenge_character_piarres_albarracin:0 "เคานต์ปิอาร์เรส"
 challenge_character_piarres_albarracin_desc:0 "ครั้งหนึ่งเคยเป็นข้าในบังคับของผู้มีอำนาจมุสลิม ปิอาร์เรส ทำให้ดินแดนของตนเป็นคริสเตียนและประกาศอิสรภาพ โดยไม่ยอมรับเจ้าเหนือหัวใด ๆ นอกจากนักบุญมารีย์เอง\n\n#bold เมื่อประกาศตนเองว่าเท่าเทียมกับกษัตริย์และเคาะลีฟะฮ์แล้ว บัดนี้ท่านจะสามารถทำตามคำกล่าวอ้างของท่านและก่อตั้งราชอาณาจักรใหม่เพื่อแข่งขันกับอาณาจักรใด ๆ ที่เคยมีมาก่อนได้หรือไม่?#!"

 # John
 challenge_character_john_ulster:0 "เอิร์ลจอห์น"
 challenge_character_john_ulster_desc:0 "ด้วยสิทธิ์แห่งดาบข้างกายและความช่วยเหลือจากคนสนิทไม่กี่คน จอห์น เดอ คูร์ซี ทำให้ตนเองเป็นเจ้าแห่งอัลสเตอร์ตะวันออก จนกระทั่งการล่มสลายและการถูกจองจำด้วยน้ำมือของกษัตริย์อังกฤษที่สงสัยในความทะเยอทะยานของเขา\n\n#bold ท่านจะสามารถสานต่อสิ่งที่จอห์นเริ่มต้นและดูแลให้ธงของคูร์ซีโบกสะบัดเหนือไอร์แลนด์ทั้งหมดได้หรือไม่?#!"

 # Rogier
 challenge_character_rogier_albi:0 "เคานต์โรเจียร์"
 challenge_character_rogier_albi_desc:0 "แม้ว่าพวกเขาอาจไม่ได้ยอมรับหลักคำสอนนี้อย่างเปิดเผย แต่ตระกูลตรองกาแวลเป็นที่รู้จักในเรื่องความอดทนและความเห็นอกเห็นใจที่ขัดแย้งต่อพวกนอกรีตคาธาร์ที่แพร่กระจายไปทั่วดินแดนของพวกเขา\n\n#bold ท่านจะสามารถปกป้องชาวคาธาร์จากการข่มเหงและรับประกันว่าศรัทธาของพวกเขาจะเจริญรุ่งเรืองได้หรือไม่?#!"

 # Khusraw Malik
 challenge_character_khusraw_malik_punjab:0 "สุลต่านคุสเรา มาลิก"
 challenge_character_khusraw_malik_punjab_desc:0 "คุสเรา มาลิก ถูกศัตรูรุมล้อมทุกด้าน ต่อสู้อย่างกล้าหาญเพื่อรักษาราชอาณาจักรของบรรพบุรุษ แต่สายเลือดของเขาก็จบลงในไม่ช้าด้วยน้ำมือของเพชฌฆาตฆูริด\n\n#bold ท่านจะสามารถต่อสู้กลับคืนสู่ตำแหน่งที่แข็งแกร่งและทำการพิชิตซ้ำรอยมะห์มูดแห่งกัซนีได้หรือไม่?#!"

 # Kulin
 challenge_character_kulin_bosna:0 "ดูซ์ คูลิน"
 challenge_character_kulin_bosna_desc:0 "คูลิน ซึ่งอยู่ระหว่างความทะเยอทะยานของไบแซนไทน์และฮังการีในคาบสมุทรบอลข่าน ได้ใช้ประโยชน์จากความขัดแย้งระหว่างสองมหาอำนาจอย่างชาญฉลาดเพื่อรักษาเอกราชและแผ่อิทธิพลของตน\n\n#bold ท่านจะสามารถหลุดพ้นจากเจ้าเหนือหัวและนำพาสู่ยุคทองแห่งสันติภาพและความเจริญรุ่งเรืองสำหรับบอสเนียได้หรือไม่?#!"

 # Nur al-Din Muhammed
 challenge_character_nur_al_din_muhammed_nizari:0 "อิหม่าม มุฮัมมัด"
 challenge_character_nur_al_din_muhammed_nizari_desc:0 "จากฐานที่มั่นอันน่าเกรงขามในเทือกเขาแห่งเปอร์เซีย มุฮัมมัดปกครองอย่างยาวนานในฐานะอิหม่ามตามสายเลือดของชาวนิซารี ซึ่งยอมรับเขาว่าเป็นผู้ดูแลศรัทธาที่ชอบธรรมเพียงผู้เดียว เนื่องจากการสืบเชื้อสายมาจากนิซาร์\n\n#bold ท่านจะสามารถเผยแพร่หลักคำสอนของท่านและได้รับการยอมรับอย่างกว้างขวางสำหรับศรัทธาของท่านได้หรือไม่?#!"

 # Algimantas
 challenge_character_algimantas_lithuanians:0 "หัวหน้าเผ่าใหญ่ อัลกิมันตัส"
 challenge_character_algimantas_lithuanians_desc:0 "อัลกิมันตัสและทายาทของเขาสามารถรักษาอาณาเขตของพวกนอกรีตได้นานกว่าชนชาติอื่นใดในยุโรป โดยสามารถต่อต้านการเปลี่ยนมานับถือศาสนาคริสต์ได้สำเร็จจนถึงปลายศตวรรษที่สิบสี่\n\n#bold ในเมื่อชาวคริสต์มุ่งมั่นที่จะเปลี่ยนศาสนาของประชาชนของท่าน ท่านจะสามารถเปิดตาพวกเขาให้เห็นความจริงของลัทธิวิดิลิสม์แทนได้หรือไม่?#!"

 # Sargis
 challenge_character_sargis_greater_armenia:0 "ดยุกซาร์กิส"
 challenge_character_sargis_greater_armenia_desc:0 "ข้าในบังคับชาวอาร์เมเนียผู้แข็งแกร่งของกษัตริย์จอร์เจีย ความภักดีของซาร์กิสอาจเป็นที่น่าสงสัยในบางครั้ง แต่อิทธิพลและอำนาจของเขาก็มากพอที่จะไม่อาจมองข้ามได้\n\n#bold ท่านจะสามารถแยกตัวออกมาเพื่อฟื้นฟูอาร์เมเนียใหญ่ของบรรพบุรุษโบราณของท่านได้หรือไม่?#!"

 # Aba
 challenge_character_aba_socotra:0 "เอมีร์ อาบา"
 challenge_character_aba_socotra_desc:0 "ความโดดเดี่ยวของโซโคตรา ทำให้เกาะแห่งนี้ยังคงเป็นเกาะแห่งนิกายเนสโตเรียนมานานหลายศตวรรษ ผู้อยู่อาศัยไม่ค่อยได้รับการต้อนรับนอกเหนือจากชายฝั่งหินของตนเอง\n\n#bold ท่านจะสามารถนำพาประชาชนของท่านออกจากที่มั่นอันไม่แน่นอนนี้ไปสู่ชื่อเสียงอันอมตะนอกขอบฟ้าได้หรือไม่?#!"

 # Prithviraja
 challenge_character_prithviraja_rajputana: "มหาราชา ปฤถวีราช"
 challenge_character_prithviraja_rajputana_desc: "ปฤถวีราชต่อสู้อย่างกล้าหาญกับการรุกรานของฆูริดซ้ำแล้วซ้ำเล่า ได้รับชัยชนะเหนือผู้บุกรุกในสมรภูมิใหญ่อย่างน้อยหนึ่งครั้ง แต่ก็สิ้นพระชนม์ในฐานะเชลยของพวกฆูริด\n\n#bold ท่านจะสามารถขับไล่ภัยคุกคามจากฆูริดและรับประกันอนาคตของราชวงศ์จาหุมานะได้หรือไม่?#!"

 # Renaud
 challenge_character_renaud_kerak: "เคานต์เรโนด์"
 challenge_character_renaud_kerak_desc: "ศัตรูที่ดุร้ายและร้ายกาจที่สุดของเศาะลาฮุดดีนในราชอาณาจักรเยรูซาเลม การโจมตีขบวนคาราวานผู้แสวงบุญชาวมุสลิมของเรโนด์นำไปสู่การสูญเสียเยรูซาเลมและการประหารชีวิตของเขาเองโดยสุลต่านแห่งอียิปต์\n\n#bold ประวัติศาสตร์จดจำเรโนด์ว่าเป็นนักปล้นสะดมผู้ละโมบ – ท่านจะสามารถรับประกันมรดกที่สูงส่งกว่าสำหรับเขาได้หรือไม่?#!"

 # Henry
 challenge_character_henri_champagne: "ดยุกอองรี"
 challenge_character_henri_champagne_desc: "อองรีได้รับการศึกษาด้านศิลปศาสตร์ การปกครองที่รู้แจ้งของเขานำความมั่งคั่งมาสู่ประชาชนของเขา ด้วยงานแสดงสินค้าอันโด่งดังของชองปาญที่ดึงดูดพ่อค้าและสินค้ามีค่าของพวกเขาจากทั่วยุโรป\n\n#bold ท่านจะสามารถทำให้ชองปาญเป็นชื่อพ้องของสันติภาพและความเจริญรุ่งเรืองได้หรือไม่?#!"

 # Richard
 challenge_character_richard_poitiers: "เจ้าชายริชาร์ด"
 challenge_character_richard_poitiers_desc: "เกิดเป็นบุตรชายคนที่สาม ชะตากรรมอันผันผวน ทำให้ริชาร์ดได้นั่งบนบัลลังก์อังกฤษ และการทัพต่อมาของเขาในดินแดนศักดิ์สิทธิ์ ทำให้เขาได้รับเกียรติยศชั่วนิรันดร์ในฐานะ #italic ริชาร์ดใจสิงห์#!.\n\n#bold แม้จะมีชื่อเสียงโด่งดัง แต่การรบของริชาร์ดได้รับชัยชนะถาวรเพียงเล็กน้อย ท่านจะสามารถใช้โอกาสครั้งที่สองของเขาให้เกิดประโยชน์สูงสุดเพื่อคว้าชัยชนะที่คู่ควรกับชื่อของเขาได้หรือไม่?#!"

 # Maghan
 challenge_character_maghan_sibi: "มาฆาน คอน ฟัตตา"
 challenge_character_maghan_sibi_desc: "ตำนานเล่าว่านายพรานเคยทำนายว่าหากมาฆาน แต่งงานกับหญิงอัปลักษณ์ บุตรชายของพวกเขาจะเป็นกษัตริย์ผู้ยิ่งใหญ่และทรงอำนาจ ไม่ว่าเรื่องเล่าจะเป็นจริงหรือไม่ ซุนจาตา บุตรชายของมาฆาน ก็ได้ก่อตั้งจักรวรรดิมาลีขึ้นจริง ๆ\n\n#bold ท่านจะสามารถทำให้คำทำนายของนายพรานผู้ต่ำต้อยกลายเป็นความจริงและก่อตั้งจักรวรรดิใหม่ได้หรือไม่?#!"

 # Mohammed
 challenge_character_mohammed_azerbaijan: "จาฮาน ปาห์ลาวาน โมฮัมเหม็ด"
 challenge_character_mohammed_azerbaijan_desc: "ผู้สร้างกษัตริย์ให้แก่สุลต่านเซลจุคองค์สุดท้าย โมฮัมเหม็ดปกครองจักรวรรดิอย่างมีประสิทธิภาพในทุกด้านยก เว้นแต่เพียงในนาม แม้ว่าทายาทของเขาจะไม่สามารถต้านทานการรุกคืบของควาราซม์ชาห์ได้ก็ตาม\n\n#bold ท่านกุมสุลต่านไว้ในกำมือ – ใช้เขาให้ดี แล้วเปอร์เซียทั้งหมดจะยอมสยบต่อเจตจำนงของท่าน!#!"

 # Heinrich
 challenge_character_heinrich_angria: "ไฮน์ริชราชสีห์"
 challenge_character_heinrich_angria_desc: "คู่แข่งที่ขมขื่นของจักรพรรดิโรมันอันศักดิ์สิทธิ์ ไฮน์ริชเป็นขุนนางผู้มีอำนาจมากที่สุดในจักรวรรดิในสมัยของเขา แต่ความเป็นศัตรูกับจักรพรรดิของเขาจะกลายเป็นหายนะของเขาในที่สุด\n\n#bold ท่านจะสามารถเอาชนะในสิ่งที่ไฮน์ริชในประวัติศาสตร์ล้มเหลวและมีชัยเหนือศัตรูโฮเฮนชเตาเฟินของท่านได้หรือไม่?#!"
