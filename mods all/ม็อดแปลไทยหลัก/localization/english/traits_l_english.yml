 trait_possessed_1:0 "ถูกสิง"
 trait_possessed_1_desc:1 "การเปลี่ยนแปลงอย่างฉับพลันทางอารมณ์ การรับรู้ และความสามารถที่ตัวละครนี้ประสบ สามารถอธิบายได้เพียงว่าเกิดจากวิญญาณที่สิงสู่ในร่างของพวกเขา"
 trait_possessed_1_character_desc:0 "การเปลี่ยนแปลงอย่างฉับพลันทางอารมณ์ การรับรู้ และความสามารถที่ [ROOT.GetCharacter.GetFirstNameNoTooltip] ประสบ สามารถอธิบายได้เพียงว่าเกิดจากวิญญาณที่สิงสู่ในร่างของ[ROOT.GetCharacter.GetHerHis]"
 trait_possessed_genetic:0 "$trait_possessed_1$"
 trait_possessed_genetic_desc:1 "$trait_possessed_1_desc$"
 trait_possessed_genetic_character_desc:0 "$trait_possessed_1_character_desc$"
 trait_ill:0 "ป่วยไข้"
 trait_ill_desc:0 "ธาตุเสียสมดุลรบกวนตัวละครนี้ และความรุนแรงของอาการป่วยยังมิอาจระบุได้"
 trait_ill_character_desc:0 "ธาตุเสียสมดุลรบกวน [ROOT.GetCharacter.GetFirstNameNoTooltip] และความรุนแรงของอาการป่วยของ[ROOT.GetCharacter.GetHerHis]ยังมิอาจระบุได้"
 trait_pneumonic:0 "ปอดบวม"
 trait_pneumonic_desc:0 "ทนทุกข์ทรมานจากการไอและวิงเวียนด้วยพิษไข้ ตัวละครนี้ป่วยด้วยโรคปอดติดเชื้อ"
 trait_pneumonic_character_desc:0 "ทนทุกข์ทรมานจากการไอและวิงเวียนด้วยพิษไข้ [ROOT.GetCharacter.GetFirstNameNoTooltip] ป่วยด้วยโรคปอดติดเชื้อ"
 trait_early_great_pox:0 "$trait_lovers_pox$"
 trait_early_great_pox_desc:0 "$trait_lovers_pox_desc$"
 trait_early_great_pox_character_desc:0 "$trait_lovers_pox_character_desc$"
 trait_great_pox:0 "ซิฟิลิส"
 trait_great_pox_desc:0 "ถูกรบกวนด้วยแผลพุพองและการอักเสบ ตัวละครนี้ป่วยด้วยโรคระบาดทางเพศสัมพันธ์"
 trait_great_pox_character_desc:0 "ถูกรบกวนด้วยแผลพุพองและการอักเสบ [ROOT.GetCharacter.GetFirstNameNoTooltip] ป่วยด้วยโรคระบาดทางเพศสัมพันธ์"
 trait_lovers_pox:0 "กามโรคจากชู้รัก"
 trait_lovers_pox_desc:0 "มีตุ่มพองและการติดเชื้อ ตัวละครนี้ป่วยด้วยโรคติดต่อทางเพศสัมพันธ์"
 trait_lovers_pox_character_desc:0 "มีตุ่มพองและการติดเชื้อ [ROOT.GetCharacter.GetFirstNameNoTooltip] ป่วยด้วยโรคติดต่อทางเพศสัมพันธ์"
 trait_leper:0 "คนโรคเรื้อน"
 trait_leper_desc:1 "ผิวหนังของตัวละครนี้มีรอยแผลและรอยด่าง บ่งชี้ถึงความสามารถที่ลดลงในการรับรู้ความสุข ความเจ็บปวด และความรู้สึกอื่นๆ"
 trait_leper_character_desc:1 "ผิวหนังของ[ROOT.GetCharacter.GetFirstNamePossessiveNoTooltip]มีรอยแผลและรอยด่าง บ่งชี้ถึงความสามารถที่ลดลงในการรับรู้ความสุข ความเจ็บปวด และความรู้สึกอื่นๆ"
 trait_wounded_1:0 "บาดเจ็บ"
 trait_wounded_1_desc:0 "ตัวละครนี้ได้รับบาดเจ็บ แต่คงจะหายดีได้เมื่อเวลาผ่านไป"
 trait_wounded_1_character_desc:0 "[ROOT.GetCharacter.GetFirstNameNoTooltip] ได้รับบาดเจ็บ แต่คงจะหายดีได้เมื่อเวลาผ่านไป"
 trait_wounded_2:0 "บาดเจ็บสาหัส"
 trait_wounded_2_desc:0 "ตัวละครนี้ได้รับบาดเจ็บสาหัส และหนทางสู่การฟื้นตัวอาจยาวนาน"
 trait_wounded_2_character_desc:0 "[ROOT.GetCharacter.GetFirstNameNoTooltip] ได้รับบาดเจ็บสาหัส และหนทางสู่การฟื้นตัวอาจยาวนาน"
 trait_wounded_3:0 "ถูกทำร้ายปางตาย"
 trait_wounded_3_desc:0 "ตัวละครนี้ถูกทำร้ายจนแหลกเหลว และกำลังยื้อชีวิตอยู่"
 trait_wounded_3_character_desc:0 "[ROOT.GetCharacter.GetFirstNameNoTooltip] ถูกทำร้ายจนแหลกเหลว และกำลังยื้อชีวิตอยู่"
 trait_one_legged:0 "ขาเดียว"
 trait_one_legged_desc:0 "ตัวละครนี้มีขาเพียงข้างเดียว"
 trait_one_legged_character_desc:0 "[ROOT.GetCharacter.GetFirstNameNoTooltip] มีขาเพียงข้างเดียว"
 trait_maimed:0 "พิการ"
 trait_maimed_desc:1 "ตัวละครนี้ได้รับบาดเจ็บสาหัสจนพิการ"
 trait_maimed_character_desc:0 "[ROOT.GetCharacter.GetFirstNameNoTooltip] ได้รับบาดเจ็บสาหัสจนพิการ"
 trait_one_eyed:0 "ตาเดียว"
 trait_one_eyed_desc:0 "ตัวละครนี้มีตาเพียงข้างเดียว"
 trait_one_eyed_character_desc:0 "[ROOT.GetCharacter.GetFirstNameNoTooltip] มีตาเพียงข้างเดียว"
 trait_disfigured:0 "เสียโฉม"
 trait_disfigured_desc:0 "ตัวละครนี้เสียโฉมอย่างน่าเกลียดน่ากลัว"
 trait_disfigured_character_desc:0 "[ROOT.GetCharacter.GetFirstNameNoTooltip] เสียโฉมอย่างน่าเกลียดน่ากลัว"
 trait_infirm:0 "ทุพพลภาพ"
 trait_infirm_desc:0 "ร่างกายอ่อนแอ ตัวละครนี้ไม่เหมาะที่จะทำสิ่งใดมากนัก เว้น แต่รอคอยความตายมาพรากไป"
 trait_infirm_character_desc:0 "ร่างกายอ่อนแอ [ROOT.GetCharacter.GetFirstNameNoTooltip] ไม่เหมาะที่จะทำสิ่งใดมากนัก เว้น แต่รอคอยความตายมาพราก[ROOT.GetCharacter.GetHerHim]ไป"
 trait_track_infirm: "ความชราภาพ"
 trait_track_infirm_desc: "การสึกหรอที่มิอาจหลีกเลี่ยงของเลือดเนื้อและกระดูก"
 trait_withering_mind: "จิตใจร่วงโรย"
 trait_withering_mind_desc: "ด้วยความทรงจำที่พร่ามัว ตัวละครผู้นี้เลื่อนลอยอยู่ท่ามกลางห้วงฝันยามตื่น วันวานของพวกเขาร่วงหล่นไปดั่งใบไม้ร่วงหล่นเบื้องหน้าสายลมแห่งเหมันตฤดู"
 trait_withering_mind_character_desc: "ด้วยความทรงจำที่พร่ามัว [ROOT.GetCharacter.GetFirstNameNoTooltip] เลื่อนลอยอยู่ท่ามกลางห้วงฝันยามตื่น วันวานของ [ROOT.GetCharacter.GetHerHis] ร่วงหล่นไปดั่งใบไม้ร่วงหล่นเบื้องหน้าสายลมแห่งเหมันตฤดู"
 trait_track_withering_mind: "จิตใจร่วงโรย"
 trait_track_withering_mind_desc: "การดิ่งลงสู่ความหลงลืมอย่างช้าๆ"
 culture_parameter_withering_mind_less_likely: "[trait|E] [GetTrait('withering_mind').GetName( GetNullCharacter )] มีพบได้น้อยกว่า"
 trait_clouded_eyes: "ดวงตาฝ้าฟาง"
 trait_clouded_eyes_desc: "ทั้งโลกหล้าและถ้อยคำล้วนเลือนรางไปเบื้องหลังม่านอันขุ่นมัว ทิ้งให้ตัวละครผู้นี้ต้องไขว่คว้าเงาในจุดที่เคยมีความแน่นอนดำรงอยู่"
 trait_clouded_eyes_character_desc: "ทั้งโลกหล้าและถ้อยคำล้วนเลือนรางไปเบื้องหลังม่านอันขุ่นมัว ทิ้งให้ [ROOT.GetCharacter.GetFirstNameNoTooltip] ต้องไขว่คว้าเงาในจุดที่เคยมีความแน่นอนดำรงอยู่"
 trait_track_clouded_eyes: "ดวงตาฝ้าฟาง"
 trait_track_clouded_eyes_desc: "วิสัยทัศน์เลือนราง และแสงสว่างเริ่มถดถอย"
 trait_faltering_heart: "หัวใจอ่อนระทวย"
 trait_faltering_heart_desc: "ด้วยลมหายใจที่สั้นและชีพจรที่เต้นหนัก ตัวละครผู้นี้ต้อนรับรุ่งอรุณของแต่ละวันโดยไม่แน่ใจว่าหัวใจที่อ่อนล้าของพวกเขาจะได้เห็นยามพลบค่ำหรือไม่"
 trait_faltering_heart_character_desc: "ด้วยลมหายใจที่สั้นและชีพจรที่เต้นหนัก [ROOT.GetCharacter.GetFirstNameNoTooltip] ต้อนรับรุ่งอรุณของแต่ละวันโดยไม่แน่ใจว่าหัวใจที่อ่อนล้าของ [ROOT.GetCharacter.GetHerHis] จะได้เห็นยามพลบค่ำหรือไม่"
 trait_track_faltering_heart: "หัวใจอ่อนระทวย"
 trait_track_faltering_heart_desc: "ทุกจังหวะการเต้นของหัวใจฟังดูอ่อนแรงกว่าครั้งก่อน"
 trait_fragile_bones: "กระดูกเปราะบาง"
 trait_fragile_bones_desc: "ด้วยโครงสร้างร่างกายที่เปราะบาง ตัวละครผู้นี้รู้สึกถึงทุกแรงสั่นสะเทือนราวกับถูกค้อนทุบ และมีชีวิตอยู่ด้วยความหวาดกลัวแม้เพียงการสะดุดเพียงเล็กน้อย"
 trait_fragile_bones_character_desc: "ด้วยโครงสร้างร่างกายที่เปราะบาง [ROOT.GetCharacter.GetFirstNameNoTooltip] รู้สึกถึงทุกแรงสั่นสะเทือนราวกับถูกค้อนทุบ และมีชีวิตอยู่ด้วยความหวาดกลัวแม้เพียงการสะดุดเพียงเล็กน้อย"
 trait_track_fragile_bones: "กระดูกเปราะบาง"
 trait_track_fragile_bones_desc: "ในแต่ละวัน ร่างกายยิ่งเข้าใกล้การแตกสลาย"
 TRAIT_FLAG_DESC_infirm_random_xp_gain: "\n#indent_newline:6 @time_icon!#help [trait_level_track|E] นี้จะลุกลามคืบหน้าขึ้นทุกปีและเมื่อล้ม [sick|E] มันสามารถถูก [Concept( 'infirm_mitigation', 'บรรเทาได้' )|E]#!#!#!"
