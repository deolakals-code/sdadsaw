 trait_forgiving_character_desc:0 "[ROOT.GetCharacter.GetFirstNameNoTooltip] พร้อมที่จะก้าวข้ามผ่านเรื่องส่วนใหญ่ได้อย่างรวดเร็ว"
 trait_eccentric: "พิลึก"
 trait_eccentric_desc: "พฤติกรรมของตัวละครนี้ถูกมองจากผู้อื่นว่าผิดปกติและไร้เหตุผล แต่ดูเหมือนว่าจะมีความสมเหตุสมผลบางอย่างซ่อนอยู่ในความบ้าคลั่งนั้น"
 trait_eccentric_character_desc: "พฤติกรรมของ[ROOT.GetCharacter.GetFirstNamePossessiveNoTooltip]ถูกมองจากผู้อื่นว่าผิดปกติและไร้เหตุผล"
 trait_rowdy:0 "ซุกซน"
 trait_rowdy_desc:1 "เด็กคนนี้เคลื่อนไหวอยู่เสมอ เต็มไปด้วยพลังงานและความซน เมื่อพวกเขากำลังทำอะไรบางอย่าง ก็ไม่ใช่เรื่องแปลกที่ผู้อื่นจะได้รับบาดเจ็บ"
 trait_rowdy_character_desc:0 "[ROOT.Char.GetFirstNameNoTooltip] เคลื่อนไหวอยู่เสมอ เต็มไปด้วยพลังงานและความซน เมื่อ[ROOT.Char.GetSheHe]กำลังทำอะไรบางอย่าง ก็ไม่ใช่เรื่องแปลกที่ผู้อื่นจะได้รับบาดเจ็บ"
 trait_charming:0 "น่ารักน่าเอ็นดู"
 trait_charming_desc:2 "เด็กคนนี้รู้วิธีที่จะ ทำให้คนอื่นหลงใหลได้อย่างแน่นอน พวกเขาน่ารักและเป็นมิตร ซึ่ง ทำให้พวกเขารอดพ้นจากเกือบทุกสิ่ง"
 trait_charming_character_desc: "[ROOT.Char.GetFirstNameNoTooltip] รู้วิธีที่จะพันผู้คนรอบนิ้วก้อยของ[ROOT.Char.GetHerHis]ได้อย่างแน่นอน [ROOT.Char.GetSheHe|U] เป็นคนอ่อนหวานและเป็นมิตร ซึ่ง ทำให้[ROOT.Char.GetHerHim]สามารถทำอะไรก็ได้แทบทุกอย่างโดยไม่ถูกตำหนิ"
 trait_curious:0 "อยากรู้อยากเห็น"
 trait_curious_desc:1 "แทบจะไม่มีช่วงเวลาที่เงียบสงบกับเด็กคนนี้ พวกเขาถามคำถามอยู่ตลอดเวลา อยากรู้อยากเห็นเกี่ยวกับทุกสิ่งและทุกคน"
 trait_curious_character_desc:0 "แทบจะไม่มีช่วงเวลาที่เงียบสงบกับ [ROOT.Char.GetFirstNameNoTooltip] [ROOT.Char.GetSheHe] ถามคำถามอยู่ตลอดเวลา อยากรู้อยากเห็นเกี่ยวกับทุกสิ่งและทุกคน"
 trait_pensive:0 "ช่างคิด"
 trait_pensive_desc:1 "เด็กคนนี้มักจะจมอยู่ในความคิด พยายามทำความเข้าใจโลกรอบตัว พวกเขามักจะพึ่งพาหนังสือและระบบเพื่อทำความเข้าใจสิ่งต่างๆ"
 trait_pensive_character_desc:0 "[ROOT.Char.GetFirstNameNoTooltip] มักจะจมอยู่ในความคิด พยายามทำความเข้าใจโลกรอบ[ROOT.Char.GetHerHim] [ROOT.Char.GetSheHe|U] มักจะพึ่งพาหนังสือและระบบเพื่อทำความเข้าใจสิ่งต่างๆ"
 trait_bossy:0 "เจ้ากี้เจ้าการ"
 trait_bossy_desc:1 "มักจะเห็นเด็กคนนี้สั่งเด็กคนอื่นๆ อยู่บ่อยครั้ง แม้ว่าพวกเขาจะกังวลเกี่ยวกับการ ทำให้เสร็จอย่างถูกวิธี แต่การ ทำให้เสร็จตาม#EMP วิธีของพวกเขา#! ก็สำคัญไม่แพ้กัน"
 trait_bossy_character_desc:0 "[ROOT.Char.GetFirstNameNoTooltip] มักจะเห็นสั่งเด็กคนอื่นๆ อยู่บ่อยครั้ง แม้ว่า[ROOT.Char.GetSheHe]จะกังวลเกี่ยวกับการ ทำให้เสร็จอย่างถูกวิธี แต่การ ทำให้เสร็จตาม#EMP วิธีของ[ROOT.Char.GetHerHis]#! ก็สำคัญไม่แพ้กัน"

 trait_loyal:0 "ภักดี"
 trait_loyal_desc:0 "บุคคลนี้ให้ความสำคัญกับความสัมพันธ์ของตนมากกว่าคนส่วนใหญ่"
 trait_loyal_character_desc:0 "[ROOT.GetCharacter.GetFirstNameNoTooltip] ให้ความสำคัญกับความสัมพันธ์ของ[ROOT.GetCharacter.GetHerHis]มากกว่าคนส่วนใหญ่"

 TRAIT_FLAG_DESC_join_factions_less:0 "มีโอกาสน้อยที่จะเข้าร่วม[factions|E]ต่อต้าน[liege|E]ของตน"
 TRAIT_FLAG_DESC_join_factions_more:0 "มีโอกาสมากขึ้นที่จะเข้าร่วม[factions|E]ต่อต้าน[liege|E]ของตน"
