 trait_disloyal:0 "ไม่ภักดี"
 trait_disloyal_desc:1 "ในขณะที่คนส่วนใหญ่มองเห็นความสัมพันธ์ บุคคลนี้กลับมองเห็นโอกาส"
 trait_disloyal_character_desc:1 "ในขณะที่คนส่วนใหญ่มองเห็นความสัมพันธ์ [ROOT.GetCharacter.GetFirstNameNoTooltip] กลับมองเห็นโอกาส"

#Stress traits
 trait_drunkard:0 "ขี้เมา"
 trait_drunkard_desc:0 "ตัวละครนี้หันไปพึ่งพาขวดเหล้า และมองหาก้นขวดอยู่ตลอดเวลา"
 trait_drunkard_character_desc:0 "[ROOT.GetCharacter.GetFirstNameNoTooltip] หันไปพึ่งพาขวดเหล้า และมองหาก้นขวดอยู่ตลอดเวลา"
 trait_hashishiyah:0 "ผู้ติดฮาชิช"
 trait_hashishiyah_desc:0 "ตัวละครนี้ต้องพึ่งพาการบริโภคฮาชิชเพื่อรับมือกับความเครียดในชีวิตประจำวัน"
 trait_hashishiyah_character_desc:0 "[ROOT.GetCharacter.GetFirstNameNoTooltip] ต้องพึ่งพาการบริโภคฮาชิชเพื่อรับมือกับความเครียดในชีวิตประจำวัน"

 trait_rakish:0 "เสเพล"
 trait_rakish_desc:0 "ตัวละครนี้ใช้เวลาอยู่ในซ่องนางโลมมากเสียจนกลายเป็นบ้านหลังที่สอง"
 trait_rakish_character_desc:0 "[ROOT.GetCharacter.GetFirstNameNoTooltip] ใช้เวลาอยู่ในซ่องนางโลมมากเสียจนกลายเป็นบ้านหลังที่สองของ[ROOT.GetCharacter.GetHerHis]"
 trait_reclusive:0 "สันโดษเก็บตัว"
 trait_reclusive_desc:0 "ตัวละครนี้มักจะปลีกตัวออกไปและละเลยความรับผิดชอบของตน"
 trait_reclusive_character_desc:0 "[ROOT.GetCharacter.GetFirstNameNoTooltip] มักจะปลีก[ROOT.GetCharacter.GetHerselfHimself]ออกไปและละเลยความรับผิดชอบของ[ROOT.GetCharacter.GetHerHis]"
 trait_irritable:0 "หงุดหงิดง่าย"
 trait_irritable_desc:0 "ความเครียด ทำให้ตัวละครนี้มีแนวโน้มที่จะระเบิดอารมณ์และอาละวาดบ่อยครั้ง"
 trait_irritable_character_desc:0 "ความเครียด ทำให้ [ROOT.GetCharacter.GetFirstNameNoTooltip] มีแนวโน้มที่จะระเบิดอารมณ์และอาละวาดบ่อยครั้ง"
 trait_flagellant:0 "ผู้ทรมานตน"
 trait_flagellant_desc:0 "การปลดปล่อยอารมณ์ด้วยการโบยตีตนเองเป็นสิ่งเดียวที่ ทำให้ตัวละครนี้รู้สึกดีขึ้น"
 trait_flagellant_character_desc:0 "การปลดปล่อยอารมณ์ด้วยการโบยตีตนเองเป็นสิ่งเดียวที่ ทำให้ [ROOT.GetCharacter.GetFirstNameNoTooltip] รู้สึกดีขึ้น"
 trait_profligate:0 "ฟุ่มเฟือย"
 trait_profligate_desc:0 "การใช้จ่ายอย่างหุนหันพลันแล่น ทำให้ตัวละครนี้สิ้นเปลืองเงินไปกับการซื้อของที่ไม่จำเป็นอยู่บ่อยครั้ง"
 trait_profligate_character_desc:0 "การใช้จ่ายอย่างหุนหันพลันแล่น ทำให้ [ROOT.GetCharacter.GetFirstNameNoTooltip] สิ้นเปลืองเงินไปกับการซื้อของที่ไม่จำเป็นอยู่บ่อยครั้ง"
 trait_improvident:0 "ใจบุญเกินตัว"
 trait_improvident_desc:0 "ตัวละครนี้บริจาคเงินให้การกุศลเป็นนิสัย มากเกินกว่าที่ตนจะสามารถจ่ายได้อย่างสมเหตุสมผล"
 trait_improvident_character_desc:0 "[ROOT.GetCharacter.GetFirstNameNoTooltip] บริจาคเงินให้การกุศลเป็นนิสัย มากเกินกว่าที่[ROOT.GetCharacter.GetSheHe]จะสามารถจ่ายได้อย่างสมเหตุสมผล"
 trait_contrite:0 "สำนึกผิด"
 trait_contrite_desc:0 "ตัวละครนี้ทนทุกข์จากความรู้สึกผิด มักรู้สึกถูกบีบให้สารภาพในสิ่งที่ควรปล่อยผ่านไป"
 trait_contrite_character_desc:0 "[ROOT.GetCharacter.GetFirstNameNoTooltip] ทนทุกข์จากความรู้สึกผิด มักรู้สึกถูกบีบให้สารภาพในสิ่งที่ควรปล่อยผ่านไป"
 trait_comfort_eater:0 "กินเพื่อปลอบใจ"
 trait_comfort_eater_desc:0 "ตัวละครนี้มักพยายามเติมเต็มความว่างเปล่าที่รู้สึกด้วยการตามใจตนเองกับอาหารที่ปลอบประโลม"
 trait_comfort_eater_character_desc:0 "[ROOT.GetCharacter.GetFirstNameNoTooltip] มักพยายามเติมเต็มความว่างเปล่าที่[ROOT.GetCharacter.GetSheHe]รู้สึกด้วยการตามใจตนเองกับอาหารที่ปลอบประโลม"
 trait_inappetetic:0 "เบื่ออาหาร"
 trait_inappetetic_desc:0 "ความเครียดทำลายความอยากอาหารของตัวละครนี้ ทำให้พวกเขาอดอาหารและผ่ายผอมลง..."
 trait_inappetetic_character_desc:0 "ความเครียดทำลายความอยากอาหารของ[ROOT.GetCharacter.GetFirstNamePossessiveNoTooltip] ทำให้[ROOT.GetCharacter.GetHerHim]อดอาหารและผ่ายผอมลง..."
 trait_journaller:0 "ผู้บันทึกประจำวัน"
 trait_journaller_desc:0 "ตัวละครนี้หันมาจดบันทึกความคิดที่รบกวนจิตใจเพื่อ ทำให้จัดการได้ง่ายขึ้น"
 trait_journaller_character_desc:0 "[ROOT.GetCharacter.GetFirstNameNoTooltip] หันมาจดบันทึกความคิดที่รบกวนจิตใจ[ROOT.GetCharacter.GetHerHim]เพื่อ ทำให้จัดการได้ง่ายขึ้น"
 trait_confider:0 "ผู้มีเพื่อนคู่คิด"
 trait_confider_desc:0 "ในการแบ่งปันปัญหากับเพื่อนสนิท ตัวละครนี้สามารถจัดการชีวิตได้ดีกว่าที่ทำได้เพียงลำพัง"
 trait_confider_character_desc:0 "ในการแบ่งปันปัญหาของ[ROOT.GetCharacter.GetHerHis]กับเพื่อนสนิท [ROOT.GetCharacter.GetFirstNameNoTooltip] สามารถจัดการชีวิตได้ดีกว่าที่[ROOT.GetCharacter.GetSheHe]ทำได้เพียงลำพัง"
 trait_athletic:0 "ผู้รักการออกกำลังกาย"
 trait_athletic_desc:0 "การออกกำลังกายเป็นประจำช่วยให้ตัวละครนี้มีสติและเผาผลาญความเครียดได้"
 trait_athletic_character_desc:0 "การออกกำลังกายเป็นประจำช่วยให้ [ROOT.GetCharacter.GetFirstNameNoTooltip] มีสติและเผาผลาญความเครียดได้"
 trait_burdened: "ภาระหนัก"
 trait_burdened_desc: "ความสำเร็จด้านวิชาการหลบเลี่ยงตัวละครนี้ เส้นทางของตนเต็มไปด้วยขวากหนาม เพื่อหลีกหนีจากความรู้สึกไร้ความสามารถอันต่อเนื่อง ตัวละครนี้จึงปล่อยให้จิตใจล่องลอยไปสู่เมฆอันนุ่มนวลเบื้องบน"
 trait_burdened_character_desc: "ความสำเร็จด้านวิชาการหลบเลี่ยง [ROOT.GetCharacter.GetFirstNameNoTooltip] เส้นทาง [ROOT.GetCharacter.GetHerHis] เต็มไปด้วยขวากหนาม เพื่อหลีกหนีจากความรู้สึกไร้ความสามารถอันต่อเนื่อง [ROOT.GetCharacter.GetSheHe] จึงปล่อยให้จิตใจ [ROOT.GetCharacter.GetHerHis] ล่องลอยไปสู่เมฆอันนุ่มนวลเบื้องบน"

