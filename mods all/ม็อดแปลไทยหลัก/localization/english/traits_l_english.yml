 game_concept_clouded_eyes_mitigation: "บรรเทาดวงตาฝ้าฟาง"
 game_concept_clouded_eyes_mitigation_desc: "แม้จะไม่สามารถหยุดยั้ง [GetTrait('clouded_eyes').GetName( GetNullCharacter )] มิให้ลุกลามได้ แต่ท่านสามารถชะลอได้โดย:\n$EFFECT_LIST_BULLET$หลีกเลี่ยงการ [travel|E]\n$EFFECT_LIST_BULLET$หลีกเลี่ยงพื้นที่ที่มี [terrain|E] แบบ [GetTerrain( 'desert' ).GetName] หรือ [GetTerrain( 'desert_mountains' ).GetName]\n$EFFECT_LIST_BULLET$หลีกเลี่ยงพื้นที่ที่มีความรุนแรงของฤดูหนาวในระดับ [winter_severity_normal|E] หรือ [winter_severity_harsh|E]"
 game_concept_fragile_bones_mitigation: "บรรเทากระดูกเปราะบาง"
 game_concept_fragile_bones_mitigation_desc: "แม้จะไม่สามารถหยุดยั้ง [GetTrait('fragile_bones').GetName( GetNullCharacter )] มิให้ลุกลามได้ แต่ท่านสามารถป้องกันไม่ให้ [trait_level_track|E] เพิ่มขึ้นอย่างมากได้โดย:\n$EFFECT_LIST_BULLET$หลีกเลี่ยงการ [travel|E] และเข้าร่วม [activities|E]\n$EFFECT_LIST_BULLET$หลีกเลี่ยงการ [Concept( 'commander', 'บัญชาการกองทัพ' )|E]"
 game_concept_withering_mind_mitigation: "บรรเทาจิตใจร่วงโรย"
 game_concept_withering_mind_mitigation_desc: "แม้จะไม่สามารถหยุดยั้ง [GetTrait('withering_mind').GetName( GetNullCharacter )] มิให้ลุกลามได้ แต่ท่านสามารถชะลอได้โดย:\n$EFFECT_LIST_BULLET$การมี [friends|E] #weak (ยิ่งมากยิ่งดี)#!\n$EFFECT_LIST_BULLET$การมี [lovers|E] #weak (ยิ่งมากยิ่งดี)#!\n$EFFECT_LIST_BULLET$การรักษาระดับ [stress|E] ให้ต่ำ\n$EFFECT_LIST_BULLET$การมี [traits|E] [GetTrait('family_first').GetName( GetNullCharacter )] หรือ [GetTrait('seducer').GetName( GetNullCharacter )]\n$EFFECT_LIST_BULLET$การ [traveling|E] และเข้าร่วม [activities|E]\n\nปัจจัยหลายประการเหล่านี้ยังช่วยลดโอกาสที่จะได้รับ [trait|E] นี้ตั้งแต่แรกด้วย"
 game_concept_infirm_mitigation: "บรรเทาความชราภาพ"
 game_concept_infirm_mitigation_desc: "การรักษาสุขภาพให้แข็งแรงเป็นวิธีหลักในการปัดเป่าความชราภาพ\n\n[trait|E] [GetTrait('infirm').GetName( GetNullCharacter )] จะลุกลามขึ้นหนึ่งระดับเต็มเมื่อติดโรค [illness|E] และลุกลามขึ้นทีละน้อยทุกปี\n\nหากท่านป่วยเป็นเวลานาน [trait_level_track|E] จะลุกลามเร็วขึ้นมากในแต่ละปี และจะลุกลามเร็วขึ้นอย่างมากหากท่านมีอายุเกิน 65 ปี"
 game_concept_elder_traits: "ลักษณะนิสัยสุขภาพวัยชรา"
 game_concept_elder_traits_desc: "เมื่อ [characters|E] มีอายุมากขึ้น พวกเขาสามารถได้รับ [traits|E] ที่เกี่ยวข้องกับอายุ เช่น [GetTrait('faltering_heart').GetName( GetNullCharacter )] หรือ [GetTrait('fragile_bones').GetName( GetNullCharacter )] โดยปกติลักษณะเหล่านี้จะปรากฏเมื่ออายุประมาณ #V 50#! ปี แต่อาจปรากฏก่อนหน้านั้นได้\n\nท่านจะมีโอกาสได้รับลักษณะนิสัยเหล่านี้น้อยลงหากท่านมี:\n$BULLET_WITH_TAB$[health|E] ที่ดี\n$BULLET_WITH_TAB$[GetTrait('athletic').GetName( GetNullCharacter )], [GetTrait('physique_good_1').GetName( GetNullCharacter )] หรือ [GetTrait('whole_of_body').GetName( GetNullCharacter )]\n$BULLET_WITH_TAB$#indent_newline:6 สำหรับ [GetTrait('withering_mind').GetName( GetNullCharacter )]: มี [GetTrait('family_first').GetName( GetNullCharacter )], [GetTrait('seducer').GetName( GetNullCharacter )], รู้หลาย [languages|E], มี [friends|E] และ [lovers|E] มากมาย#!\n\nท่านจะมีโอกาสได้รับลักษณะนิสัยเหล่านี้มากขึ้นหากท่านมี:\n$BULLET_WITH_TAB$[health|E] ย่ำแย่\n$BULLET_WITH_TAB$[GetTrait('drunkard').GetName( GetNullCharacter )] หรือ [GetTrait('reclusive').GetName( GetNullCharacter )]\n$BULLET_WITH_TAB$[GetModifier( 'obese_modifier' ).GetNameWithTooltip] หรือ [GetModifier( 'malnourished_modifier' ).GetNameWithTooltip]\n$BULLET_WITH_TAB$[stress|E] สูง\n$BULLET_WITH_TAB$บิดามารดา หรือปู่ย่าตายายมีลักษณะนิสัยเหล่านี้"
 trait_incapable:0 "ไร้ความสามารถ"
 trait_incapable_desc:0 "เนื่องจากอาการบาดเจ็บทางร่างกายหรือความพิการทางจิต ตัวละครนี้ไม่สามารถดูแลตนเองหรือตัดสินใจได้อย่างอิสระ"
 trait_incapable_character_desc:0 "เนื่องจากอาการบาดเจ็บทางร่างกายหรือความพิการทางจิต [ROOT.GetCharacter.GetFirstNameNoTooltip] ไม่สามารถดูแล[ROOT.GetCharacter.GetHerselfHimself]หรือตัดสินใจได้อย่างอิสระ"
 trait_gout_ridden:0 "เป็นโรคเกาต์"
 trait_gout_ridden_desc:0 "ตัวละครนี้ทนทุกข์จากข้อต่อบวม ทำให้การเคลื่อนไหวเจ็บปวดและผิวหนังอ่อนนุ่มแดง"
