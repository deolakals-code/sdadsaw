# Commander Traits (cultural traditions)
 trait_sea_raider:0 "นักปล้นทางทะเล"
 trait_sea_raider_desc:0 "นักปล้นทางทะเลไม่มีความหวาดกลัวต่อความโหดร้ายของธาตุต่างๆ ในทะเล และใช้การผสมผสานระหว่างความกล้าหาญและการเดินเรือที่ชำนาญเพื่อโจมตีชายฝั่งที่ไม่มีการป้องกันโดยไม่แจ้งเตือน"
