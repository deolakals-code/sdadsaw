 trait_track_lifestyle_scholar: "Religious Scholar"
 trait_track_lifestyle_scholar_desc: "The divinity gives knowledge generously to all without reproach.\n\n#weak This [trait|E] can be levelled by attending an [GetActivityType( 'activity_ecumenical_council').GetName].\n\nAt Level 3, the [trait|E] begins granting immunity to the [ecclesiastic_transfer_land_interaction|E] [interaction|E].#!"
 trait_lifestyle_scholar_character_desc: "This character has started a journey to comprehend the nature of religion."
 trait_lifestyle_scholar_desc: "[ROOT.GetCharacter.GetFirstNameNoTooltip] has just started [ROOT.GetCharacter.GetHerHis] journey to comprehend the nature of religion."
 trait_lifestyle_scholar_1: "Initiate"
 trait_lifestyle_scholar_1_desc: "[ROOT.GetCharacter.GetFirstNameNoTooltip] has taken [ROOT.GetCharacter.GetHerHis] first steps into the study of Holy Writ, understanding its words more than its depths."
 trait_lifestyle_scholar_2: "Exegete"
 trait_lifestyle_scholar_2_desc: "[ROOT.GetCharacter.GetFirstNameNoTooltip] interprets scripture with growing skill, able to explain passages that confound lesser minds."
 trait_lifestyle_scholar_3: "Doctor of Scripture"
 trait_lifestyle_scholar_3_desc: "[ROOT.GetCharacter.GetFirstNameNoTooltip] is respected for [ROOT.GetCharacter.GetHerHis] keen insight into biblical texts."
 trait_lifestyle_scholar_4: "Scholastic Eminence"
 trait_lifestyle_scholar_4_desc: "For [ROOT.GetCharacter.GetFirstNameNoTooltip] debating doctrine is almost easier than talking about the weather."
 trait_lifestyle_scholar_5: "Divine Interpreter"
 trait_lifestyle_scholar_5_desc: "[ROOT.GetCharacter.GetFirstNamePossessiveNoTooltip] understanding of scripture borders on the inspired."
 trait_track_monastic: "Monastic Seniority"
 trait_track_monastic_desc: "This devotee has obeyed a Rule while living in a pious community of their fellows, and has advanced within their Order's sheltered hierarchy. \n\n#weak This [trait|E] increases while belonging to a [monastic_holy_order|E], and is leveled by [piety|E], [learning|E], and influential ties to secular [rulers|E] and [clergy|E]"
