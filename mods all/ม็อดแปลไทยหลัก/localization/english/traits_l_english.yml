 TRAIT_LEVEL_TRACK_ENTRY_DESC_BASE:0 "ต้องการ [trait_level_track_xp|E] จำนวน [TraitLevelTrackEntry.GetXpRequired|V0]+\n[TraitLevelTrackEntry.GetModifierDescription( Character.Self )][AddLocalizationIf( GreaterThan_int32( TraitLevelTrackEntry.GetLevel, '(int32)1' ), 'MODIFIER_PREVIOUS_LEVELS_APPLY_NEWLINE' )]"
 TRAIT_LEVEL_TRACK_ENTRY_DESC:2 "#V ระดับ [TraitLevelTrackEntry.GetLevel]#!\n$TRAIT_LEVEL_TRACK_ENTRY_DESC_BASE$"
 TRAIT_LEVEL_TRACK_ENTRY_DESC_TT:0 "\n\n#S ระดับ [TraitLevelTrackEntry.GetLevel]#!\n$TRAIT_LEVEL_TRACK_ENTRY_DESC_BASE$"
 TRAIT_LEVEL_TRACK_TT:2 "#T [TraitLevelTrack.GetName]#!\nระดับปัจจุบัน: [Character.GetTraitTrackLevel( Trait.Self, TraitLevelTrack.Self )|V] #weak ([ComplexBar.GetCurrentValue] [trait_level_track_xp|E])#!\n#flavor [TraitLevelTrack.GetDescription]#![AddLocalizationIf( GreaterThan_int32( TraitLevelTrackEntry.GetLevel, '(int32)0' ), 'TRAIT_LEVEL_TRACK_ENTRY_DESC_TT' )]"
 TRAIT_LEVEL_TRACK_SHORT_TT:0 "#T [TraitLevelTrack.GetName] [Trait.GetName( Character.Self )]#!\n#flavor [TraitLevelTrack.GetDescription]#!"
 TRAIT_LEVEL_TRACK_PROGRESS_TOOTLIP:0 "#T [TraitLevelTrack.GetName]#!\n[trait_level_track_xp|E] ปัจจุบัน: [ComplexBar.GetNextValue|0V]\n#flavor [TraitLevelTrack.GetDescription]#!"
 TRAIT_LEVEL_TRACKS_HEADER:0 "[Trait.GetNameNoTooltipWithDefault( Character.Self )] [trait_level_track|E]"
 TRAIT_LEVEL_TRACK_HEADER:0 "#V #bold [TraitLevelTrack.GetName]#!#!\n#flavor [TraitLevelTrack.GetDescription]#!\n"

#Reasons
 ALREADY_CONTAINTS_TRAIT:2 "@warning_icon! #X $CHARACTER_NAME$ มีคุณลักษณะ [TRAIT.GetName( CHARACTER.Self )] อยู่แล้ว#!"
 CONTAINTS_OPPOSITE_TRAIT:2 "@warning_icon! #X ไม่สามารถเพิ่มคุณลักษณะ [TRAIT.GetName( CHARACTER.Self )] ได้ เนื่องจาก $CHARACTER_NAME$ มีคุณลักษณะตรงข้าม [TRAIT_2.GetName( CHARACTER.Self )] อยู่แล้ว#!"
 IS_POTENTIAL_TRAIT_FALSE:2 "@warning_icon! #X ไม่สามารถเพิ่มคุณลักษณะ [TRAIT.GetName( CHARACTER.Self )] ได้ เนื่องจาก $CHARACTER_NAME$ ถูกขวางกั้นมิให้มีคุณลักษณะนี้#!"
 TRAIT_AGE_NOT_IN_RANGE_TOO_YOUNG:0 "@warning_icon! #X ไม่สามารถเพิ่มคุณลักษณะ [TRAIT.GetName( CHARACTER.Self )] ได้ เนื่องจาก $CHARACTER_NAME$ อายุอ่อนกว่า $TRAIT_AGE|V$ ปีบริบูรณ์ #weak (ปัจจุบันอายุ $CHARACTER_AGE|V$ ปี)#!#!"
 TRAIT_AGE_NOT_IN_RANGE_TOO_OLD:0 "@warning_icon! #X ไม่สามารถเพิ่มคุณลักษณะ [TRAIT.GetName( CHARACTER.Self )] ได้ เนื่องจาก $CHARACTER_NAME$ อายุมากกว่า $TRAIT_AGE|V$ ปีบริบูรณ์ #weak (ปัจจุบันอายุ $CHARACTER_AGE|V$ ปี)#!#!"
 TRAIT_SEX_NOT_MATCHING:0 "@warning_icon! #X ไม่สามารถเพิ่มคุณลักษณะ [TRAIT.GetName( CHARACTER.Self )] ได้ เนื่องจาก $CHARACTER_NAME$ มิใช่เพศ $TRAIT_SEX$#!"
 ALREADY_HAS_TRAIT_IN_GROUP:0 "@warning_icon! #X ไม่สามารถเพิ่มคุณลักษณะ [TRAIT.GetName( CHARACTER.Self )] ได้ เนื่องจาก $CHARACTER_NAME$ มีคุณลักษณะในกลุ่ม [TRAIT_GROUP.GetName] อยู่แล้ว #weak ([TRAIT_2.GetName( CHARACTER.Self )])#!#!"
 SEX_MALE:0 "บุรุษ"
 SEX_FEMALE:0 "สตรี"

#Education Traits
 trait_education_intrigue_1:0 "นักวางแผนมือสมัครเล่น"
 trait_education_intrigue_1_desc:0 "นักวางแผนมือสมัครเล่นผู้นี้ได้รับการศึกษาด้านศิลปะแห่งกลอุบายมาบ้าง หาก แต่ความรู้ที่แท้จริงในศาสตร์นี้กลับเลือนหายไปจากความเข้าใจ"
 trait_education_intrigue_1_character_desc:0 "[ROOT.GetCharacter.GetFirstNameNoTooltip] ได้รับการศึกษาด้านศิลปะแห่งกลอุบายมาบ้าง หาก แต่ความรู้ที่แท้จริงในศาสตร์นี้กลับเลือนหายไปจากความเข้าใจของ[ROOT.GetCharacter.GetHerHim]"
 trait_education_intrigue_2:0 "นักเล่นกลเจ้าสำราญ"
 trait_education_intrigue_2_desc:0 "นักเล่นกลเจ้าสำราญผู้นี้ได้รับการศึกษาด้านศิลปะแห่งกลอุบาย แต่ยังคงต้องเรียนรู้อีกมากนัก กว่าความผิดพลาดพลั้งเผลอจะกลายเป็นข้อยกเว้น หาใช่เรื่องปกติ"
 trait_education_intrigue_2_character_desc:0 "[ROOT.GetCharacter.GetFirstNameNoTooltip] ได้รับการศึกษาด้านศิลปะแห่งกลอุบาย แต่ยังคงต้องเรียนรู้อีกมากนัก กว่าความผิดพลาดพลั้งเผลอจะกลายเป็นข้อยกเว้น หาใช่เรื่องปกติ"
 trait_education_intrigue_3:0 "ผู้ชักใยอันซับซ้อน"
 trait_education_intrigue_3_desc:0 "ผู้ชักใยอันซับซ้อนคือปรมาจารย์แห่งกลอุบาย การชักจูง และความลับ"
 trait_education_intrigue_3_character_desc:0 "[ROOT.GetCharacter.GetFirstNameNoTooltip] คือปรมาจารย์แห่งกลอุบาย การชักจูง และความลับ"
 trait_education_intrigue_4:0 "เงาผู้เร้นกาย"
 trait_education_intrigue_4_desc:0 "เงาผู้เร้นกายได้ก้าวล้ำสู่ความเป็นปรมาจารย์แห่งกลอุบาย และม่านแห่งความลับที่ห้อมล้อมตัวนั้นหาผู้ใดเปรียบมิได้"
 trait_education_intrigue_4_character_desc:0 "[ROOT.GetCharacter.GetFirstNameNoTooltip] ได้ก้าวล้ำสู่ความเป็นปรมาจารย์แห่งกลอุบาย และม่านแห่งความลับที่ห้อมล้อม[ROOT.GetCharacter.GetHerHim]นั้นหาผู้ใดเปรียบมิได้"
 trait_education_intrigue_5: "นายหุ่นเชิดผู้เจ้าเล่ห์"
 trait_education_intrigue_5_desc: "นายหุ่นเชิดผู้เจ้าเล่ห์เปรียบดั่งเสียงกระซิบในสายลม ดั่งเงาบนกำแพง มีดของพวกเขาทำหน้าที่ในที่ ซึ่งวาจามิอาจเอื้อมถึง"
 trait_education_intrigue_5_character_desc: "[ROOT.GetCharacter.GetFirstNameNoTooltip] เปรียบดั่งเสียงกระซิบในสายลม ดั่งเงาบนกำแพง มีดของพวกเขาทำหน้าที่ในที่ ซึ่งวาจามิอาจเอื้อมถึง"
 trait_education_diplomacy_1:0 "ผู้ประนีประนอมอันไร้เดียงสา"
 trait_education_diplomacy_1_desc:0 "ผู้ประนีประนอมอันไร้เดียงสาได้รับการศึกษาด้านศิลปะการทูตมาบ้าง แต่กระนั้นก็มักสร้างความอับอายให้ตนเองและคนรอบข้างเสียมากกว่า"
 trait_education_diplomacy_1_character_desc:0 "[ROOT.GetCharacter.GetFirstNameNoTooltip] ได้รับการศึกษาด้านศิลปะการทูตมาบ้าง แต่กระนั้นก็มักสร้างความอับอายให้แก่[ROOT.GetCharacter.GetHerselfHimself]และคนรอบข้าง[ROOT.GetCharacter.GetHerHim]เสียมากกว่า"
 trait_education_diplomacy_2:0 "นักต่อรองผู้พอใช้ได้"
 trait_education_diplomacy_2_desc:0 "เรื่องต่างๆ มักลงเอยเป็นผลดีต่อนักต่อรองผู้พอใช้ได้ผู้นี้ แต่จะเป็น เพราะทักษะทางการทูตหรือโชคช่วยนั้นยังเป็นที่ถกเถียง"
 trait_education_diplomacy_2_character_desc:0 "เรื่องต่างๆ มักลงเอยเป็นผลดีต่อ [ROOT.GetCharacter.GetFirstNameNoTooltip] แต่จะเป็น เพราะทักษะทางการทูตของ[ROOT.GetCharacter.GetHerHis]หรือโชคช่วยนั้นยังเป็นที่ถกเถียง"
 trait_education_diplomacy_3:0 "นักเจรจาผู้ทรงเสน่ห์"
 trait_education_diplomacy_3_desc:0 "ปรมาจารย์แห่งวาทศิลป์โน้มน้าวใจและความละเอียดอ่อนทางการทูต นักเจรจาผู้ทรงเสน่ห์คือนักการทูตที่ยอดเยี่ยม"
 trait_education_diplomacy_3_character_desc:0 "ด้วยความเป็นปรมาจารย์แห่งวาทศิลป์โน้มน้าวใจและความละเอียดอ่อนทางการทูต [ROOT.GetCharacter.GetFirstNameNoTooltip] จึงเป็นนักการทูตที่ยอดเยี่ยม"
 trait_education_diplomacy_4:0 "ผู้อยู่เบื้องหลังผู้ทรงอิทธิพล"
 trait_education_diplomacy_4_desc:0 "ด้วยความคุ้นเคยกับความละเอียดอ่อนทางการทูตราวกับหลังมือของตน ผู้อยู่เบื้องหลังผู้ทรงอิทธิพลจึงเป็นปรมาจารย์แห่งศาสตร์แขนงนี้"
 trait_education_diplomacy_4_character_desc:0 "ด้วยความคุ้นเคยกับความละเอียดอ่อนทางการทูตราวกับหลังมือของ[ROOT.GetCharacter.GetHerHis] [ROOT.GetCharacter.GetFirstNameNoTooltip] จึงเป็นปรมาจารย์แห่งศาสตร์แขนงนี้"
 trait_education_diplomacy_5: "อนุญาโตตุลาการผู้เลิศล้ำ"
 trait_education_diplomacy_5_desc: "ลิ้นเงินลิ้นทองของอนุญาโตตุลาการผู้เลิศล้ำสามารถโน้มน้าวใจที่แข็งกระด้างที่สุดและเปิดประตูที่กีดขวางแน่นหนาที่สุดได้"
 trait_education_diplomacy_5_character_desc: "ลิ้นเงินลิ้นทองของ[ROOT.GetCharacter.GetFirstNamePossessiveNoTooltip]สามารถโน้มน้าวใจที่แข็งกระด้างที่สุดและเปิดประตูที่กีดขวางแน่นหนาที่สุดได้"
 trait_education_stewardship_1:0 "นักผลาญทรัพย์ผู้ตามใจตน"
 trait_education_stewardship_1_desc:0 "นักผลาญทรัพย์ผู้ตามใจตนได้รับการศึกษาด้านการคลังเพื่อเรียนรู้การไหลเวียนของเงินตรา แต่น่าเสียดายที่กระแสเงินดูเหมือนจะไหลไปทางเดียว..."
 trait_education_stewardship_1_character_desc:0 "[ROOT.GetCharacter.GetFirstNameNoTooltip] ได้รับการศึกษาด้านการคลังเพื่อเรียนรู้การไหลเวียนของเงินตรา แต่น่าเสียดายที่กระแสเงินดูเหมือนจะไหลไปทางเดียว..."
 trait_education_stewardship_2:0 "เสมียนผู้มัธยัสถ์"
 trait_education_stewardship_2_desc:0 "เสมียนผู้มัธยัสถ์มีความสามารถพอใช้ได้ในเรื่องการลงทุนและการบริหาร แต่ความผิดพลาดในศิลปะการคลังยังคงเป็นเรื่องปกติ"
 trait_education_stewardship_2_character_desc:0 "[ROOT.GetCharacter.GetFirstNameNoTooltip] มีความสามารถพอใช้ได้ในเรื่องการลงทุนและการบริหาร แต่ความผิดพลาดในศิลปะการคลังยังคงเป็นเรื่องปกติ"
 trait_education_stewardship_3:0 "ผู้สร้างฐานะ"
 trait_education_stewardship_3_desc:0 "ผู้สร้างฐานะมีสัญชาตญาณอันเฉียบแหลมในทุกเรื่องที่เกี่ยวกับการคลังและเป็นพลังทางการบริหารที่น่าเกรงขาม"
 trait_education_stewardship_3_character_desc:0 "[ROOT.GetCharacter.GetFirstNameNoTooltip] มีสัญชาตญาณอันเฉียบแหลมในทุกเรื่องที่เกี่ยวกับการคลังและเป็นพลังทางการบริหารที่น่าเกรงขาม"
 trait_education_stewardship_4:0 "ผู้มีสัมผัสแห่งไมดาส"
 trait_education_stewardship_4_desc:0 "ผู้มีสัมผัสแห่งไมดาสประสบความสำเร็จครั้งแล้วครั้งเล่าในศิลปะการคลัง แสดงให้เห็นถึงความเชี่ยวชาญในศาสตร์นี้อย่างไม่มีข้อโต้แย้ง"
 trait_education_stewardship_4_character_desc:0 "[ROOT.GetCharacter.GetFirstNameNoTooltip] ประสบความสำเร็จครั้งแล้วครั้งเล่าในศิลปะการคลัง แสดงให้เห็นถึงความเชี่ยวชาญในศาสตร์นี้อย่างไม่มีข้อโต้แย้ง"
 trait_education_stewardship_5: "ราชันย์ทองคำ"
 trait_education_stewardship_5_desc: "ราชันย์ทองคำสามารถนำพากิจการที่ล้มเหลวไปสู่ความเจริญรุ่งเรืองได้ด้วยความใส่ใจเพียงน้อยนิด ความมั่งคั่งผุดขึ้นจากที่ ซึ่งเคยมี แต่ความขัดสน"
 trait_education_stewardship_5_character_desc: "[ROOT.GetCharacter.GetFirstNameNoTooltip] สามารถนำพากิจการที่ล้มเหลวไปสู่ความเจริญรุ่งเรืองได้ด้วยความใส่ใจเพียงน้อยนิด ความมั่งคั่งผุดขึ้นจากที่ ซึ่งเคยมี แต่ความขัดสน"
 trait_education_martial_1:0 "นักรบผู้หลงทิศ"
 trait_education_martial_1_desc:0 "นักรบผู้หลงทิศได้รับการศึกษาในศิลปะการสงคราม แต่มีแนวโน้มที่จะทำร้ายตนเองมากกว่าศัตรู"
 trait_education_martial_1_character_desc:0 "[ROOT.GetCharacter.GetFirstNameNoTooltip] ได้รับการศึกษาในศิลปะการสงคราม แต่มีแนวโน้มที่จะทำร้าย[ROOT.GetCharacter.GetHerselfHimself]มากกว่าศัตรูของ[ROOT.GetCharacter.GetHerHis]"
 trait_education_martial_2:0 "ทหารทรหด"
 trait_education_martial_2_desc:0 "ทหารทรหดได้แสดงความกล้าหาญในเรื่องการทหารอยู่บ้าง แต่ยังคงต้องเรียนรู้อีกมาก"
 trait_education_martial_2_character_desc:0 "[ROOT.GetCharacter.GetFirstNameNoTooltip] ได้แสดงความกล้าหาญในเรื่องการทหารอยู่บ้าง แต่ยังคงต้องเรียนรู้อีกมาก"
 trait_education_martial_3:0 "นักการยุทธผู้ชำนาญ"
 trait_education_martial_3_desc:0 "นักการยุทธผู้ชำนาญเป็นแม่ทัพที่ไว้ใจได้และนักรบที่น่าเกรงขาม มีชื่อเสียงในด้านทักษะการทหาร"
 trait_education_martial_3_character_desc:0 "[ROOT.GetCharacter.GetFirstNameNoTooltip] เป็นแม่ทัพที่ไว้ใจได้และนักรบที่น่าเกรงขาม มีชื่อเสียงในด้านทักษะการทหารของ[ROOT.GetCharacter.GetHerHis]"
 trait_education_martial_4:0 "นักยุทธศาสตร์ผู้ปราดเปรื่อง"
 trait_education_martial_4_desc:0 "สมรภูมิคืออาณาเขตของนักยุทธศาสตร์ผู้ปราดเปรื่อง และไม่มีเรื่องการทหารใดที่เกินความรู้ของพวกเขา"
 trait_education_martial_4_character_desc:0 "สมรภูมิคืออาณาเขตของ [ROOT.GetCharacter.GetFirstNameNoTooltip] และไม่มีเรื่องการทหารใดที่เกินความรู้ของ[ROOT.GetCharacter.GetHerHis]"
 trait_education_martial_5: "ขุนศึกผู้สูงส่ง"
 trait_education_martial_5_desc: "ขุนศึกผู้สูงส่งสามารถเอาชนะอุปสรรคที่ดูเหมือนจะผ่านพ้นไม่ได้ในสนามรบได้อย่างง่ายดาย พลิกสถานการณ์ทั้งการศึกได้ด้วยการเคลื่อนไหวที่คล่องแคล่วเพียงครั้งเดียว"
 trait_education_martial_5_character_desc: "[ROOT.GetCharacter.GetFirstNameNoTooltip] สามารถเอาชนะอุปสรรคที่ดูเหมือนจะผ่านพ้นไม่ได้ในสนามรบได้อย่างง่ายดาย พลิกสถานการณ์ทั้งการศึกได้ด้วยการเคลื่อนไหวที่คล่องแคล่วเพียงครั้งเดียว"
 trait_education_martial_prowess_1:0 "ผู้ติดตามอัศวินผู้อุ้ยอ้าย"
 trait_education_martial_prowess_1_desc:0 "ผู้ติดตามอัศวินผู้อุ้ยอ้ายเป็นอัศวินในทางเทคนิคเท่านั้น จดจำเพียงเล็กน้อยจากการฝึกฝนอย่างเป็นทางการ"
 trait_education_martial_prowess_1_character_desc:0 "[ROOT.GetCharacter.GetFirstNameNoTooltip] เป็นอัศวินในทางเทคนิคเท่านั้น จดจำเพียงเล็กน้อยจากการฝึกฝนอย่างเป็นทางการของ[ROOT.GetCharacter.GetHerHis]"
 trait_education_martial_prowess_2:0 "อัศวินผู้มั่นใจ"
 trait_education_martial_prowess_2_desc:0 "อัศวินผู้มั่นใจคุ้นเคยกับวิถีการต่อสู้ตามประเพณีของวัฒนธรรมตน แม้กระทั่งเคยต่อสู้กับชาวนาที่ไม่ยอมอ่อนข้อไม่กี่ครั้งเมื่อครั้งยังเยาว์"
 trait_education_martial_prowess_2_character_desc:0 "[ROOT.GetCharacter.GetFirstNameNoTooltip] คุ้นเคยกับวิถีการต่อสู้ตามประเพณีของวัฒนธรรม[ROOT.GetCharacter.GetHerHis] แม้กระทั่งเคยต่อสู้กับชาวนาที่ไม่ยอมอ่อนข้อไม่กี่ครั้งเมื่อครั้งยังเยาว์"
 trait_education_martial_prowess_3:0 "อัศวินธงชัยผู้น่าเกรงขาม"
 trait_education_martial_prowess_3_desc:0 "อัศวินธงชัยผู้น่าเกรงขามได้นำทัพและต่อสู้กับโจรแม้กระทั่งก่อนบรรลุนิติภาวะ ผ่านการกรำศึกจนกลายเป็นนักรบผู้มุ่งมั่น"
 trait_education_martial_prowess_3_character_desc:0 "[ROOT.GetCharacter.GetFirstNameNoTooltip] ได้นำทัพและต่อสู้กับโจรแม้กระทั่งก่อนบรรลุนิติภาวะ[ROOT.GetCharacter.GetHerHis] ผ่านการกรำศึกจนกลายเป็นนักรบผู้มุ่งมั่น"
 trait_education_martial_prowess_4:0 "ยอดฝีมือผู้เลื่องชื่อ"
 trait_education_martial_prowess_4_desc:0 "ยอดฝีมือผู้เลื่องชื่อเป็นที่รู้จัก ได้รับความเคารพ และอาจถึงขั้นเป็นที่หวาดกลัวไปทั่วดินแดนในฐานะแบบอย่างของวิถีนักรบตามวัฒนธรรมของตน"
 trait_education_martial_prowess_4_character_desc:0 "[ROOT.GetCharacter.GetFirstNameNoTooltip] เป็นที่รู้จัก ได้รับความเคารพ และอาจถึงขั้นเป็นที่หวาดกลัวไปทั่วดินแดนในฐานะแบบอย่างของวิถีนักรบ[ROOT.Char.GetCulture.GetName]"
 trait_education_martial_prowess_5: "คมดาบประกายปรอท"
 trait_education_martial_prowess_5_desc: "ความเชี่ยวชาญในการต่อสู้ของคมดาบประกายปรอทเป็นที่กล่าวขานด้วยเสียงกระซิบ ชื่อของพวกเขาก็เพียงพอที่จะ ทำให้แม้ แต่ทหารผ่านศึกที่เก๋าที่สุดต้องหยุดชะงัก"
 trait_education_martial_prowess_5_character_desc: "ความเชี่ยวชาญในการต่อสู้ของ[ROOT.GetCharacter.GetFirstNamePossessiveNoTooltip]เป็นที่กล่าวขานด้วยเสียงกระซิบ ชื่อของพวกเขาก็เพียงพอที่จะ ทำให้แม้ แต่ทหารผ่านศึกที่เก๋าที่สุดต้องหยุดชะงัก"
 trait_education_learning_1:0 "อาลักษณ์ผู้มีสติ"
 trait_education_learning_1_desc:0 "แม้จะได้รับการศึกษาที่มุ่งเน้นการเรียนรู้ อาลักษณ์ผู้มีสติกลับแสดงความถนัดในวิชานี้น้อยนัก — อย่างน้อยก็ยังอ่านออก..."
 trait_education_learning_1_character_desc:0 "แม้จะได้รับการศึกษาที่มุ่งเน้นการเรียนรู้ [ROOT.GetCharacter.GetFirstNameNoTooltip] กลับแสดงความถนัดในวิชานี้น้อยนัก — อย่างน้อย [ROOT.GetCharacter.GetSheHe] ก็ยังอ่านออก..."
 trait_education_learning_2:0 "นักคิดผู้มีญาณทัศนะ"
 trait_education_learning_2_desc:0 "นักคิดผู้มีญาณทัศนะมีความเชี่ยวชาญในเรื่องศาสนศาสตร์ส่วนใหญ่ แต่น่าเศร้าที่ทั้งทักษะและความทุ่มเทที่แท้จริงดูเหมือนจะขาดหายไป"
 trait_education_learning_2_character_desc:0 "[ROOT.GetCharacter.GetFirstNameNoTooltip] มีความเชี่ยวชาญในเรื่องศาสนศาสตร์ส่วนใหญ่ แต่น่าเศร้าที่ทั้งทักษะและความทุ่มเทที่แท้จริงดูเหมือนจะขาดหายไป"
 trait_education_learning_3:0 "ปัญญาชนผู้หลักแหลม"
 trait_education_learning_3_desc:0 "ปัญญาชนผู้หลักแหลมมีความเข้าใจอย่างลึกซึ้งในศาสนศาสตร์ ปรัชญา และทุกวิชาแห่งการเรียนรู้ที่ลึกซึ้งยิ่งขึ้น"
 trait_education_learning_3_character_desc:0 "[ROOT.GetCharacter.GetFirstNameNoTooltip] มีความเข้าใจอย่างลึกซึ้งในศาสนศาสตร์ ปรัชญา และทุกวิชาแห่งการเรียนรู้ที่ลึกซึ้งยิ่งขึ้น"
 trait_education_learning_4:0 "นักปรัชญาจอมวางแผน"
 trait_education_learning_4_desc:0 "นักปรัชญาจอมวางแผนมีความเข้าใจอย่างลึกซึ้งผิดปกติในทุกวิชาแห่งการศึกษาระดับสูง"
 trait_education_learning_4_character_desc:0 "[ROOT.GetCharacter.GetFirstNameNoTooltip] มีความเข้าใจอย่างลึกซึ้งผิดปกติในทุกวิชาแห่งการศึกษาระดับสูง"
 trait_education_learning_5: "เทพพยากรณ์ผู้รอบรู้"
 trait_education_learning_5_desc: "ความรู้ของเทพพยากรณ์ผู้รอบรู้เกี่ยวกับเรื่องศักดิ์สิทธิ์และเรื่องทางโลกนั้นไม่มีใครเทียบได้ คำปรึกษาของพวกเขาเป็นที่ต้องการของผู้ยิ่งใหญ่และผู้ดีในแวดวงวิชาการ"
 trait_education_learning_5_character_desc: "ความรู้ของ[ROOT.GetCharacter.GetFirstNamePossessiveNoTooltip]เกี่ยวกับเรื่องศักดิ์สิทธิ์และเรื่องทางโลกนั้นไม่มีใครเทียบได้ คำปรึกษาของพวกเขาเป็นที่ต้องการของผู้ยิ่งใหญ่และผู้ดีในแวดวงวิชาการ"

#Lifestyle Traits
 trait_diplomat:0 "นักการทูต"
 trait_diplomat_desc:0 "นักการทูตนำทางผ่านน่านน้ำอันตรายแห่งปฏิสัมพันธ์ทางสังคมได้อย่างคล่องแคล่ว และบรรลุเป้าหมายด้วยเสน่ห์อันเจิดจ้าและความเชื่อมั่นขณะไกล่เกลี่ยระหว่างผู้ปกครองสูงสุดของแผ่นดิน"
 trait_diplomat_character_desc:0 "[ROOT.GetCharacter.GetFirstNameNoTooltip] นำทางผ่านน่านน้ำอันตรายแห่งปฏิสัมพันธ์ทางสังคมได้อย่างคล่องแคล่ว และบรรลุเป้าหมายของ[ROOT.GetCharacter.GetHerHis]ด้วยเสน่ห์อันเจิดจ้าและความเชื่อมั่นขณะไกล่เกลี่ยระหว่างผู้ปกครองสูงสุดของแผ่นดิน"

 trait_family_first:0 "ครอบครัวต้องมาก่อน"
 trait_family_first_neutral:0 "ประมุขครอบครัว"
 trait_family_first_male:0 "ปิตุลาธิปดี"
 trait_family_first_female:0 "มาตุลาธิปดี"
 trait_family_first_desc:0 "บุคคลผู้ทุ่มเทอย่างแท้จริงเพื่อครอบครัวและความเจริญรุ่งเรืองของตระกูลตน"
 trait_family_first_character_desc:0 "[ROOT.Char.GetWomanMan] ผู้ทุ่มเทอย่างแท้จริงเพื่อครอบครัวของ[ROOT.Char.GetHerHis]และความเจริญรุ่งเรืองของตระกูล[ROOT.Char.GetHerHis]"

 trait_august:0 "สูงส่ง"
 trait_august_desc:0 "พวกเขาได้รับการยกย่องในฐานะผู้ปกครองที่แท้จริง คู่ควรกับจักรวรรดิในสมัยโบราณ!"
 trait_august_character_desc:0 "[ROOT.Char.GetSheHe|U] ได้รับการยกย่องในฐานะผู้ปกครองที่แท้จริง คู่ควรกับจักรวรรดิในสมัยโบราณ!"

 trait_reveler_1:0 "นักสำราญผู้กระตือรือร้น"
 trait_reveler_1_desc:0 "นักสำราญผู้กระตือรือร้นได้ลิ้มรสชีวิตอันมึนเมาของการเสเพลและการมั่วสุม และกระหายที่จะได้สัมผัสอีก"
 trait_reveler_1_character_desc:0 "[ROOT.GetCharacter.GetFirstNameNoTooltip] ได้ลิ้มรสชีวิตอันมึนเมาของการเสเพลและการมั่วสุม และกระหายที่จะได้สัมผัสอีก"
 trait_reveler_2:0 "นักสำราญผู้เลื่องชื่อ"
 #trait_reveler_2_desc:0 "The Famous Reveler is the life of every gathering, attracting both debauchery and glamor."
 trait_reveler_2_character_desc:0 "[ROOT.GetCharacter.GetFirstNameNoTooltip] คือชีวิตชีวาของทุกการรวมตัว ดึงดูดทั้งความเสเพลและความเย้ายวน"
 trait_reveler_3:0 "นักสำราญระดับตำนาน"
 #trait_reveler_3_desc:0 "Food, drink, intoxication of both body and mind — the Legendary Reveler denies themselves nothing and is the nexus of every feast."
 trait_reveler_3_character_desc:0 "อาหาร เครื่องดื่ม ความมึนเมาทั้งกายและใจ — [ROOT.GetCharacter.GetFirstNameNoTooltip] ไม่เคยปฏิเสธสิ่งใดแก่[ROOT.GetCharacter.GetHerselfHimself]และเป็นศูนย์กลางของทุกงานเลี้ยง"
 trait_blademaster_1:0 "ผู้มุ่งหวังเป็นยอดฝีมือดาบ"
 trait_blademaster_1_desc:0 "คล่องแคล่วในการต่อสู้ตัวต่อตัว — ผู้มุ่งหวังเป็นยอดฝีมือดาบรู้ดีว่าควรใช้ปลายด้านไหนแทงศัตรู"
 trait_blademaster_1_character_desc:0 "คล่องแคล่วในการต่อสู้ตัวต่อตัว — [ROOT.GetCharacter.GetFirstNameNoTooltip] รู้ดีว่าควรใช้ปลายด้านไหนแทงศัตรู"
 trait_blademaster_2:0 "ยอดฝีมือดาบ"
 #trait_blademaster_2_desc:0 "The Blademaster is a formidable and respected opponent in all kinds of combat."
 trait_blademaster_2_character_desc:0 "[ROOT.GetCharacter.GetFirstNameNoTooltip] คือคู่ต่อสู้ที่น่าเกรงขามและได้รับความเคารพในการต่อสู้ทุกรูปแบบ"
 trait_blademaster_3:0 "ยอดฝีมือดาบระดับตำนาน"
 #trait_blademaster_3_desc:0 "The prowess of the Legendary Blademaster is the stuff of stories."
 trait_blademaster_3_character_desc:0 "ความเก่งกาจของ [ROOT.GetCharacter.GetFirstNameNoTooltip] คือเรื่องราวที่เล่าขานกัน"
 trait_hunter_1:0 "พรานมือใหม่"
 trait_hunter_1_desc:0 "พรานมือใหม่ตอบรับเสียงเรียกแห่งพงไพรและคันธนูได้อย่างคล่องแคล่ว"
 trait_hunter_1_character_desc:0 "[ROOT.GetCharacter.GetFirstNameNoTooltip] ตอบรับเสียงเรียกแห่งพงไพรและคันธนูได้อย่างคล่องแคล่ว"
 trait_hunter_2:0 "พราน"
 #trait_hunter_2_desc:0 "The Hunter navigates the wilds with uncanny precision and knowledge."
 trait_hunter_2_character_desc:0 "[ROOT.GetCharacter.GetFirstNameNoTooltip] เดินทางในป่าด้วยความแม่นยำและความรู้ที่ไม่ธรรมดา"
 trait_hunter_3:0 "นายพราน"
 #trait_hunter_3_desc:0 "The Master Hunter lives for the kill."
 trait_hunter_3_character_desc:0 "[ROOT.GetCharacter.GetFirstNameNoTooltip] มีชีวิตอยู่เพื่อการล่าสังหาร"
 trait_strategist:0 "นักยุทธศาสตร์"
 trait_strategist_desc:0 "นักศึกษาผู้ทุ่มเทให้กับศิลปะแห่งสงคราม ผู้สามารถพลิกสถานการณ์ใดๆ ให้เป็นประโยชน์แก่ตนได้"
 trait_strategist_character_desc:0 "[ROOT.GetCharacter.GetFirstNameNoTooltip] เป็นนักศึกษาผู้ทุ่มเทให้กับศิลปะแห่งสงคราม สามารถพลิกสถานการณ์ใดๆ ให้เป็นประโยชน์แก่ตนได้"

 trait_overseer:0 "ผู้ควบคุมดูแล"
 trait_overseer_desc:0 "การชี้แนะ ความเด็ดขาด และอำนาจ เพื่อให้มั่นใจว่าปัญหาได้รับการแก้ไขอย่างเหมาะสม"
 
 trait_gallant:0 "ผู้กล้าหาญสง่างาม"
 trait_gallant_desc:0 "ความสูงศักดิ์ที่แท้จริงมิได้มาจากสายเลือดเพียงอย่างเดียว หาก แต่มาจากการกระทำที่กลั่นกรองด้วยจิตวิญญาณดุจเหล็กกล้าอันวาววับ"
 
 trait_architect:0 "สถาปนิก"
 trait_architect_desc:0 "ผลงานของช่างก่อสร้างผู้มีประสบการณ์จะคงอยู่ยืนยาวนับศตวรรษ"
 
 trait_administrator:0 "นักปกครอง"
 trait_administrator_desc:0 "การจัดระเบียบ บริหาร และเพิ่มประสิทธิภาพ — นักปกครองจะจัดการให้สำเร็จลุล่วง"
 trait_administrator_character_desc:0 "การจัดระเบียบ บริหาร และเพิ่มประสิทธิภาพ — [ROOT.GetCharacter.GetFirstNameNoTooltip] จะจัดการให้สำเร็จลุล่วง"

 trait_avaricious:0 "ผู้มักได้ในทรัพย์"
 trait_avaricious_desc:0 "ทอง ทอง ทอง! จะมีสิ่งใดสูงส่งกว่านี้ มีเป้าหมายใดอันทรงเกียรติยิ่งกว่าการแสวงหาความมั่งคั่งอีกหรือ?"
 
 trait_schemer:0 "นักวางอุบาย"
 trait_schemer_desc:0 "เพื่อเข้าใจและชักจูงสิ่งที่ขับเคลื่อนผู้อื่น — และฉวยประโยชน์จากมัน!"
 trait_schemer_character_desc:0 "[ROOT.GetCharacter.GetFirstNameNoTooltip] มีชีวิตอยู่เพื่อเข้าใจและชักจูงสิ่งที่ขับเคลื่อนผู้อื่น — และฉวยประโยชน์จากมัน!"
 
 trait_seducer:0 "นักยั่วยวน"
 trait_seducer_female:0 "นางยั่วยวน"
 trait_seducer_desc:0 "การปรารถนามิใช่เรื่องยาก ความท้าทายที่แท้จริงคือ #EMP การเป็นที่ปรารถนา#! ต่างหาก"
 
 trait_torturer:0 "ผู้ทรมาน"
 trait_torturer_desc:0 "การหยิบยื่นความเจ็บปวด การกุมชีวิตผู้อื่นไว้ในมือ นี่คืออำนาจที่แท้จริง"
 
 trait_whole_of_body:0 "กายาบริบูรณ์"
 trait_whole_of_body_desc:0 "จงรู้จักตนเอง รู้จักขีดจำกัดของตน และรู้ขอบเขตความสามารถของตนอย่างถ่องแท้"
 
 trait_scholar:0 "บัณฑิต"
 trait_scholar_desc:0 "ปรัชญา ธรรมชาติ และความรู้ การเข้าใจโลกคือหนทางเดียวที่จะปกครองมัน"
 
 trait_theologian:0 "นักศาสนศาสตร์"
