 trait_golden_lineage: "วงศ์ทองคำ"
 trait_golden_lineage_desc: "สิ่งที่สายเลือดของตัวละครนี้ได้กระทำไว้แก่โลกหล้านั้นมิอาจลืมเลือนได้ พวกเขาคือหน่อเนื้อเชื้อไขทองคำแห่งอัคคีและการพิชิต"
 trait_golden_lineage_character_desc: "สิ่งที่สายเลือดของ [ROOT.GetCharacter.GetFirstNamePossessiveNoTooltip] ได้กระทำไว้แก่โลกหล้านั้นมิอาจลืมเลือนได้ [ROOT.GetCharacter.GetSheHe|U] คือหน่อเนื้อเชื้อไขทองคำแห่งอัคคีและการพิชิต"
 descendants_gain_golden_lineage_female: "ทายาทหญิงทั้งหมดของ [golden_lineage.GetShortUIName] และบุตรหลานของพวกนาง"
 descendants_gain_golden_lineage_male: "ทายาทชายทั้งหมดของ [golden_lineage.GetShortUIName] และบุตรหลานของพวกเขา"

 # TGP
 trait_track_confucian_education: "ลัทธิขงจื๊อ"
 trait_track_confucian_education_desc: "ด้วยการประมาณตนและความเมตตากรุณา เราจะร่วมกันสร้างสังคมที่ดีขึ้น\n\n#weak [trait|E] นี้สามารถเพิ่มระดับได้ผ่านทาง #V $request_mentoring_interaction$#! [character_interaction|E] หรือ [court_position_tasks|E] ของ #V $grand_mentor_court_position$#! หรือ #V $court_tutor_court_position$#! [court_positions|E]"
 trait_confucian_education_character_desc: "ตัวละครนี้เพิ่งเริ่มต้นการเดินทางบนเส้นทางสู่ความปราดเปรื่อง"
 trait_confucian_education: "การศึกษาขงจื๊อ"
 trait_confucian_education_desc: "[ROOT.GetCharacter.GetFirstNameNoTooltip] เพิ่งเริ่มต้นการเดินทาง [ROOT.GetCharacter.GetHerHis] บนเส้นทางสู่ความปราดเปรื่อง"
 trait_confucian_education_1: "ชาวขงจื๊อโดยแท้"
 trait_confucian_education_1_desc: "[ROOT.GetCharacter.GetFirstNameNoTooltip] ได้เหลือบเห็นถึงปัญญาอันไพศาลแห่งวิถีขงจื๊อ"
 trait_confucian_education_2: "นักคัมภีร์ผู้ใฝ่รู้"
 trait_confucian_education_2_desc: "[ROOT.GetCharacter.GetFirstNameNoTooltip] นำคำสอนของขงจื๊อมาใช้อย่างถ่อมตนในชีวิตประจำวัน [ROOT.GetCharacter.GetHerHis]"
 trait_confucian_education_3: "นักจริยธรรมผู้ทรงคุณธรรม"
 trait_confucian_education_3_desc: "[ROOT.GetCharacter.GetFirstNameNoTooltip] กำลังเข้าใจถึงความหมายของการเป็นชาวขงจื๊อผู้ทรงคุณธรรม"
 trait_confucian_education_4: "แบบอย่างแห่งคุณธรรม"
 trait_confucian_education_4_desc: "[ROOT.GetCharacter.GetFirstNameNoTooltip] กำลังดำเนินชีวิตตามวิถีในฐานะแบบอย่างที่แท้จริง"
 trait_confucian_education_5: "ปราชญ์ผู้ไร้มลทิน"
 trait_confucian_education_5_desc: "[ROOT.GetCharacter.GetFirstNameNoTooltip] เปรียบเสมือนนักบุญในแวดวงขงจื๊อ ชาวขงจื๊ออื่น ๆ ทั้งใกล้และไกลต่างได้ยินถึงความสามารถอันสูงส่งด้านศีลธรรมและจริยธรรม [ROOT.GetCharacter.GetHerHis]"
 trait_lifestyle_scholar: "$trait_track_lifestyle_scholar$"
 trait_erudite:0 "Erudite"
 trait_erudite_desc:0 "Philosophy, nature, and knowledge. Understanding the world is the only way to rule it."
 TRAIT_FLAG_DESC_excommunicated_recovery_hint: "\n#indent_newline:6 @warning_icon!#help See [Concept( 'excommunicated_recovery', 'recovery options' )|E].#!#!#!"
 game_concept_excommunicated_recovery: "Recover from Excommunication"
 game_concept_excommunicated_recovery_desc: "When a [character|E] is [excommunicated|E], they suffer immediate harm and ongoing restrictions until absolution.\n\nUpon excommunication, they immediately suffer:\n$EFFECT_LIST_BULLET$Major [legitimacy|E] loss\n$EFFECT_LIST_BULLET$One [piety_level|E] lost\n$EFFECT_LIST_BULLET$#N -50%#! [piety|E] gain while the [trait|E] remains\n[AddLocalizationIf( HasDlcFeature( 'by_god_alone' ), 'game_concept_excommunicated_recovery_spiritual_fulfillment' )]\n\nWhile [excommunicated|E], they are restricted from:\n$EFFECT_LIST_BULLET$Holding or attending a [coronation|E]\n$EFFECT_LIST_BULLET$Using the #high $seek_indulgences_interaction$#! [interaction|E]\n$EFFECT_LIST_BULLET$[divorce|E] through the Church\n$EFFECT_LIST_BULLET$Hiring [holy_orders|E]\n\nThey may also face:\n$EFFECT_LIST_BULLET$The [GetModifier('recent_excommunication').GetNameWithTooltip] [modifier|E], which blocks absolution for one year\n$EFFECT_LIST_BULLET$An [excommunication_war|E] from neighboring [rulers|E] of the same [faith|E], if they are an [independent|E] [ruler|E]\n\nAbsolution can be sought by:\n[SelectLocalization( HasDlcFeature( 'by_god_alone' ), 'game_concept_excommunicated_recovery_absolution_PAM', 'game_concept_excommunicated_recovery_absolution_NO_PAM' )][AddLocalizationIf( HasDlcFeature( 'by_god_alone' ), 'game_concept_excommunicated_recovery_antipope' )]"
 game_concept_excommunicated_recovery_absolution_PAM: "$EFFECT_LIST_BULLET$Dukes and below (local excommunication): #high $declaration_of_repentance_interaction$#! with a valid cleric #weak (your [head_of_faith|E] if no lesser cleric outranks you)#!\n$EFFECT_LIST_BULLET$All [rulers|E] excommunicated by your [head_of_faith|E], or ruling a kingdom or empire: petition your [head_of_faith|E] in person and choose #high $petition_head_of_faith_decision_option_repentance$#!\n$EFFECT_LIST_BULLET$Winning an [excommunication_war|E] as the defender\n$EFFECT_LIST_BULLET$Converting to another [faith|E]\n\n"
 game_concept_excommunicated_recovery_absolution_NO_PAM: "$EFFECT_LIST_BULLET$Using #high $declaration_of_repentance_interaction$#! with your [head_of_faith|E] or a qualifying cleric\n$EFFECT_LIST_BULLET$Winning an [excommunication_war|E] as the defender\n$EFFECT_LIST_BULLET$Converting to another [faith|E]\n\n"
 game_concept_excommunicated_recovery_antipope: "After absolution, sponsoring a [challenger_hof|E] can protect a [ruler|E] from future [excommunication|E] by the [mainline_rite|E] [head_of_faith|E]."
 game_concept_excommunicated_recovery_spiritual_fulfillment: "$EFFECT_LIST_BULLET$Loss of [spiritual_fulfillment|E]\n"
