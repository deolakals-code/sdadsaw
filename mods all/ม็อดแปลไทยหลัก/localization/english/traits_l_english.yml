 # EP2
 trait_tourney_participant:2 "นักประลองทวน"
 trait_tourney_participant_desc:1 "ตัวละครนี้ได้เข้าร่วมการแข่งขันทางการทหาร ฝึกฝนทักษะในการทำสงครามและการต่อสู้ส่วนบุคคล"
 trait_tourney_participant_character_desc:1 "[ROOT.GetCharacter.GetFirstNameNoTooltip] ได้เข้าร่วมการแข่งขันทางการทหาร ฝึกฝนทักษะในการทำสงครามและการต่อสู้ส่วนบุคคล"
 trait_track_foot:0 "เดินเท้า"
 trait_track_foot_desc:0 "ร่างกายมนุษย์คือเครื่องมืออันสูงสุด และการเชี่ยวชาญมันจะนำโลกมาสู่ท่าน"
 trait_track_horse:0 "อาชา"
 trait_track_horse_desc:0 "สัตว์ร้ายและผู้ขี่ประสานกันอย่างสมบูรณ์แบบ สง่างามและเป็นอิสระภายใต้ท้องฟ้าสีครามอันไร้ที่สิ้นสุด"
 trait_track_bow:0 "ธนู"
 trait_track_bow_desc:0 "เส้นเอ็นในทั้งสายธนูและนักธนู รวมกันเป็นหนึ่งเพื่อส่งลูกธนูเข้าสู่เป้าหมาย"
 trait_track_wit:0 "ไหวพริบ"
 trait_track_wit_desc:0 "ความแข็งแกร่งจางหาย ความงามร่วงโรย แต่จิตใจที่เฉียบแหลมจะนำท่านผ่านสถานการณ์ที่มืดมนที่สุด"

 # REWORKED LIFESTYLES
 trait_lifestyle_hunter_desc:0 "ตัวละครนี้ได้ตอบรับเสียงเรียกแห่งพงไพร"
 trait_lifestyle_hunter_character_desc:0 "[ROOT.GetCharacter.GetFirstNameNoTooltip] ได้ตอบรับเสียงเรียกแห่งพงไพร"
 trait_track_hunter:0 "พรานล่าสัตว์ใหญ่"
 trait_track_hunter_desc:0 "เสียงแตร เสียงสุนัข เสียงเหยื่อ! ไม่ว่าจะด้วยธนูหรือคอกม้า ไม่มีสิ่งใดน่าตื่นเต้นเท่ากับการโค่นล้มสัตว์ร้าย!"
 trait_track_falconer:0 "นักเหยี่ยว"
 trait_track_falconer_desc:0 "ไม่มีการไล่ล่าใดจะสูงส่งไปกว่ากีฬาแห่งการล่าด้วยเหยี่ยวและเหยี่ยวฟอลคอน"
 trait_track_lifestyle_mystic:0 "ผู้ลึกลับ"
 trait_track_lifestyle_mystic_desc:0 "ความลึกลับของโลก ทั้งทางกายภาพและอื่นๆ จะถูกเปิดเผยด้วยการครุ่นคิดที่เพียงพอ"
 trait_track_pilgrim:0 "ผู้แสวงบุญ"
 trait_track_pilgrim_desc:0 "เท้าด้าน แขนขาปวดเมื่อย ใบหน้ากร้านแดด ทั้งหมดเป็นราคาเล็กน้อยที่ต้องจ่ายเพื่อปฏิบัติหน้าที่อันศักดิ์สิทธิ์"
 trait_track_lifestyle_reveler:0 "นักสำราญ"
 trait_track_lifestyle_reveler_desc:0 "เครื่องดื่มและเสียงหัวเราะ ทั้งหมดอยู่กับเพื่อนที่ดี จะมีอะไรในชีวิตอีกเล่า?"
 trait_track_lifestyle_blademaster:0 "ยอดฝีมือดาบ"
 trait_track_lifestyle_blademaster_desc:0 "ปีแห่งชีวิตที่ใช้ไปกับการฝึกฝนอาวุธ เพื่อที่ความสง่างามอันเป็นผลลัพธ์จะช่วยชีวิตหนึ่งและจบชีวิตอีกหนึ่งในวันหนึ่ง"
 trait_track_lifestyle_physician:0 "แพทย์"
 trait_track_lifestyle_physician_desc:0 "ห้ามเลือดตรงนั้น เปิดเส้นเลือดตรงนี้ ธาตุเหล่านั้นจะสมดุลในไม่ช้า!"
 trait_track_lifestyle_poet: "กวีนิพนธ์"
 trait_track_lifestyle_poet_desc:0 "ถ้อยคำสามารถสร้างชื่อเสียงอันเป็นนิรันดร์ และปากกาก็คมยิ่งกว่าดาบที่คมที่สุด"
 
 # EP3
 trait_governor: "ผู้ว่าการ"
 trait_track_governor: "$trait_governor$"
 trait_track_governor_desc: "ภาษี ที่ดิน กองทหาร ทุกสิ่งสามารถ และควร ถูกบริหารจัดการให้สมบูรณ์แบบ\n\n#weak [trait|E]นี้สามารถเพิ่มระดับได้ผ่านการกระทำที่ปรับปรุง[counties|E]ที่ถือครอง หรือเป็นประโยชน์ต่อ[realm|E] เช่น การแก้ไข[governance_issues|E] การสร้าง[buildings|E] หรือการเลือกตัวเลือกบางอย่างในเหตุการณ์#! "
 trait_governor_desc: "ตัวละครนี้ได้รับทักษะอันมีค่าในบทบาทผู้ว่าการ"
 trait_governor_3_byz: "$duke_administrative_male_byzantine_group$ ผู้ช่ำชอง"
 trait_governor_3: "ผู้ว่าการเจนศึก"
 trait_governor_2_byz: "$duke_administrative_male_byzantine_group$ ผู้มีประสบการณ์"
 trait_governor_2: "ผู้ว่าการชำนาญ"
 trait_governor_1_byz: "$duke_administrative_male_byzantine_group$"
 trait_governor_1_byz_female: "$duke_administrative_female_byzantine_group$"
 trait_governor_1: "ผู้ว่าการ"
 trait_governor_3_character_desc: "[ROOT.GetCharacter.GetFirstNameNoTooltip] เป็นนักปกครองและผู้พิพากษาที่ยอดเยี่ยม ทำให้[ROOT.GetCharacter.GetHerHim]เหมาะอย่างยิ่งในฐานะผู้ว่าการ"
 trait_governor_2_character_desc: "[ROOT.GetCharacter.GetFirstNameNoTooltip] มีประสบการณ์มากมายในการบริหารจัดการดินแดน และปฏิบัติหน้าที่ได้ดีในฐานะผู้ว่าการ"
 trait_governor_1_character_desc: "[ROOT.GetCharacter.GetFirstNameNoTooltip] ได้รับทักษะอันมีค่าในบทบาท[ROOT.GetCharacter.GetHerHis]ในฐานะผู้ว่าการ"

 trait_gallowsbait: "เหยื่อตะแลงแกง"
 trait_gallowsbait_desc: "ไม่ใช่ทุกอาชญากรรมที่จะเกี่ยวข้องกับผู้ยิ่งใหญ่และผู้ดี — ตัวละครนี้กำลังสร้างชื่อเสียงให้ตนเองในฐานะอาชญากรรายย่อย"
 trait_gallowsbait_character_desc: "ไม่ใช่ทุกอาชญากรรมที่จะเกี่ยวข้องกับผู้ยิ่งใหญ่และผู้ดี — [ROOT.GetCharacter.GetFirstNameNoTooltip] ได้สร้างชื่อเสียงให้[ROOT.GetCharacter.GetHerselfHimself]ในฐานะอาชญากรรายย่อย"
 trait_track_bandit: "โจร"
 trait_track_bandit_desc: "แสงแห่งกฎหมายส่องไปไม่ไกลเกินกำแพงเมือง ที่นี่ กำลังคือความถูกต้อง"
 trait_track_trickster: "นักเล่นกล"
 trait_track_trickster_desc: "จิตใจที่เชื่องช้าไม่ใช่แค่โศกนาฏกรรม — สำหรับคนฉลาด มันคือ #EMP โอกาส#! "
 trait_track_thief: "ขโมย"
 trait_track_thief_desc: "ท้ายที่สุดแล้ว การครอบครองคือเก้าในสิบส่วนของกฎหมาย"
 trait_track_poacher: "พรานเถื่อน"
 trait_track_poacher_desc: "ไม่เสียหายหรอก ถ้าเป็นแค่สัตว์ ใช่ไหม?"
 trait_track_marauder: "ผู้รุกราน"
 trait_track_marauder_desc: "การลักพาตัวและฆาตกรรมนอกสังคมชั้นสูงอาจดูไม่น่าดึงดูดใจนัก แต่ก็ไม่ได้หมายความว่าจะทำกำไรได้น้อยกว่าเสมอไป"

 trait_despoiler_of_byzantium: "ผู้ปล้นสะดมไบแซนเทียม"
 trait_despoiler_of_byzantium_desc: "[ROOT.GetCharacter.GetFirstNameNoTooltip] เป็นหนึ่งในขุนนางละตินผู้น่าสะพรึงกลัวที่พิชิตและทำลายจักรวรรดิคริสเตียนอันเก่าแก่"
 
 trait_campeador: "กัมเปอาดอร์"
 trait_campeador_desc: "ความเชี่ยวชาญในสนามรบของ[ROOT.GetCharacter.GetFirstNamePossessiveNoTooltip] ทำให้[ROOT.GetCharacter.GetHerHim]ได้รับสมญานามว่า "ยอดนักรบแห่งสมรภูมิ""

 trait_violet_poet: "กวีสีม่วง"
 trait_violet_poet_desc: "จะมีสิ่งใด ทำให้หัวใจขับขานและเสียงดังกึกก้องได้ยิ่งกว่าความรักเล่า? [ROOT.GetCharacter.GetFirstNameNoTooltip] รู้เรื่องนี้ และรู้ดีอย่างเชี่ยวชาญ"
 trait_track_violet_poet: "นักขับลำนำ"
 trait_track_violet_poet_desc: "การแสดงออกที่แท้จริงของกวีมิอาจผ่านเพียงถ้อยคำ แต่ต้องผ่านทั้งจิตวิญญาณและร่างกาย\n\n#weak [trait|E]นี้สามารถเพิ่มระดับได้สองวิธี: โดยการประพันธ์บทกวี หรือโดยวิธีการที่ #UND เกี่ยวกับความรัก#! มากกว่า"
 
 trait_knight_errant: "อัศวินพเนจร"
 trait_knight_errant_character: "$knight_culture_player_no_tooltip$-พเนจร"
 trait_knight_errant_desc: "อัศวินผู้มีชื่อเสียง ตัวละครนี้ปกป้องผู้อ่อนแอ คุ้มครองผู้ไร้อาวุธ และเอาชนะคนชั่วร้าย"
 trait_knight_errant_character_desc: "$knight_culture_player_no_tooltip_lowercase$ผู้มีชื่อเสียง [ROOT.GetCharacter.GetFirstNameNoTooltip] ปกป้องผู้อ่อนแอ คุ้มครองผู้ไร้อาวุธ และเอาชนะคนชั่วร้าย"
 trait_track_knight_errant: "ผู้กระทำความดี"
 trait_track_knight_errant_desc: "การอ้างว่าเป็นผู้ชอบธรรมนั้นไม่เพียงพอ แต่ต้องแสดงให้เห็น\n\n#weak [trait|E]นี้สามารถเพิ่มระดับได้โดยการทำ[task_contracts|E]ประเภทผู้พิพากษา ความกล้าหาญ หรือการทหาร ที่แสดงถึงคุณสมบัติอันน่าเคารพ"

 the_wake: "ผู้ตื่น"
 trait_track_the_wake: "ผู้ย่ำบึง"
 trait_track_the_wake_desc: "โชคชะตาทอใยอันละเอียดอ่อน สิ่งที่เป็นของข้าโดยชอบธรรมจะถูกทวงคืนด้วยกำลัง\n\n#weak คุณลักษณะนี้สามารถเพิ่มระดับได้โดยการเอาชนะ[characters|E]ที่มี[culture|E] #BOL $norman$#! ใน[battle|E]หรือใน[single_combat_duel_plural|E]#!"
 the_wake_1: "ผู้ถูกเนรเทศ"
 the_wake_2: "คนนอกกฎหมาย"
 the_wake_3: "นักฆ่า"
 the_wake_4: "อังคู"
 the_wake_5: "$the_wake$"

 the_wake_1_desc: "น่าสงสารเฮเรเวิร์ดหนุ่ม ขุนนางผู้ถูกเนรเทศ ชายไร้จุดหมาย ผู้ร่อนเร่ไร้เรี่ยวแรง ศักยภาพมากมายเหลือเกิน กลับไม่ถูกเติมเต็ม"
 the_wake_2_desc: "พบจุดหมายแล้ว แต่งานที่ต้องทำยังมีอีกมาก งานเลือด จนกว่าบึงโคลนจะแดงฉานด้วยเลือดคนนอก"
 the_wake_3_desc: "คนธรรมดาย่ำโคลนและจมลงในบึงเหนียวเหม็นที่ผู้นี้จากมา บ้างก็กระซิบว่าเขาสามารถเดินบนผิวหนองบึงใดก็ได้ ด้วยความเชี่ยวชาญในบึงของเขา"
 the_wake_4_desc: "เด็กเล็กที่หวาดกลัวถูกเล่านิทานเกี่ยวกับสัตว์ร้ายที่ซุ่มซ่อนอยู่ในบึง เพื่อที่พวกเขาจะได้ไม่เตร็ดเตร่ไปไกลจากความปลอดภัย"
 the_wake_5_desc: "เงาดำในยามพลบค่ำย่องไปทั่วแผ่นดิน เฝ้าระวังเสมอ ตื่นตัวเสมอ เฮเรเวิร์ดจอมโหด เฮเรเวิร์ดผู้น่าเกรงขาม เฮเรเวิร์ด ผู้ตื่น"

 norman_opinion: "ความคิดเห็นเกี่ยวกับนอร์มัน"
 TRAIT_FLAG_DESC_can_raid: "เปิดใช้งาน[raiding|E] (การปล้นสะดม)"

 trait_immortal: "อมตะ"
 trait_immortal_desc: "ตัวละครนี้แตกต่างจากมนุษยชาติที่เหลือ ไม่ต้องทนทุกข์ทรมานจากความชรา ความเสื่อมโทรม และกาลเวลา"
 trait_immortal_character_desc: "[ROOT.GetCharacter.GetFirstNameNoTooltip] แตกต่างจากมนุษยชาติที่เหลือ ไม่ต้องทนทุกข์ทรมานจากความชรา ความเสื่อมโทรม และกาลเวลา"

 # BP3
 trait_lifestyle_wayfarer: "นักเดินทาง"
 trait_lifestyle_wayfarer_desc: "การเดินทางเป็นมากกว่าวิธีการไปสู่เป้าหมายสำหรับ [ROOT.GetCharacter.GetFirstNameNoTooltip] การหายตัวไปหลายวันใน แต่ละครั้ง [ROOT.GetCharacter.GetSheHe] จะกลับมาเล่าเรื่องราวอันน่าอัศจรรย์เกี่ยวกับสถานที่ห่างไกล ภูเขาสูง ถ้ำมืด หรือป่าลึกเสมอ"
 trait_lifestyle_voyager: "นักเดินทางทางไกล"
 trait_lifestyle_voyager_desc: "เมืองที่รุ่งโรจน์ที่สุด ซากปรักหักพังเก่าแก่ กษัตริย์และราชินีแห่งอาณาจักรห่างไกล [ROOT.GetCharacter.GetFirstNameNoTooltip] ได้เห็นมาหมดแล้ว และยินดีที่จะแบ่งปันประสบการณ์[ROOT.GetCharacter.GetHerHis]กับผู้อื่น"
 trait_lifestyle_surveyor: "ผู้ตรวจการ"
 trait_lifestyle_surveyor_desc: "อาณาจักรเจริญรุ่งเรืองภายใต้สายตาที่เฝ้าระวังของ [ROOT.GetCharacter.GetFirstNameNoTooltip] ด้วยความชอบในการเดินทางที่ถักทอเข้ากับโครงสร้างการปกครองอย่างประณีต [ROOT.GetCharacter.GetSheHe] ดูแลข้าหลวงเป็นการส่วนตัวและฝ่าฟันความท้าทายในการจัดการ ทำให้มั่นใจได้ถึงอาณาเขตที่เจริญรุ่งเรืองและได้รับการดูแลอย่างดี"
 trait_lifestyle_surveyor_adventurer_desc: "[ROOT.GetCharacter.GetFirstNameNoTooltip] เป็นที่รู้จักจากความเชี่ยวชาญ[ROOT.GetCharacter.GetHerHis]ในการเดินทางผ่านดินแดน รู้จักถิ่นทุรกันดารเหมือนหลังมือ[ROOT.GetCharacter.GetHerHis] [ROOT.GetCharacter.GetSheHe]สามารถหลบหลีกกองทัพศัตรู ซุ่มโจมตีอย่างน่าสะพรึงกลัว หรือเพียงแค่รับประกันการเดินทางที่ปลอดภัยจากเมืองหนึ่งไปยังอีกเมืองหนึ่ง"

 #MPO
 trait_nomadic_philosophy: "วิถีแห่งชนเผ่าเร่ร่อน"
 trait_nomadic_philosophy_desc: "ตัวละครนี้ถูกหล่อหลอมมา แต่กำเนิดด้วยชีวิตอันแร้นแค้นในทุ่งหญ้าสเตปป์ วิถีของพวกเขา แม้นจักแปลกประหลาดในสายตาของเหล่าชนผู้อ่อนน้อมที่ตั้งรกราก แต่ก็นำมา ซึ่งพละกำลังและเล่ห์เหลี่ยมอันมิอาจมีผู้ใดเทียมได้\n\n#weak $nomadic_philosophy_ender$#!"
 trait_nomadic_philosophy_character_desc: "[ROOT.GetCharacter.GetFirstNameNoTooltip] ถูกหล่อหลอมมา แต่กำเนิดด้วยชีวิตอันแร้นแค้นในทุ่งหญ้าสเตปป์ วิถีของ [ROOT.GetCharacter.GetHerHis|U] แม้นจักแปลกประหลาดในสายตาของเหล่าชนผู้อ่อนน้อมที่ตั้งรกราก แต่ก็นำมา ซึ่งพละกำลังและเล่ห์เหลี่ยมอันมิอาจมีผู้ใดเทียมได้\n\n#weak $nomadic_philosophy_ender$#!"
 nomadic_philosophy_ender: "ตัวข้าต่อต้านเหล่าพี่น้อง — พี่น้องและตัวข้าร่วมกันต่อต้านเหล่าญาติวงศ์ — พี่น้อง, ญาติวงศ์ และตัวข้าร่วมกันต่อต้านเผ่าอื่น — ทุกเผ่าร่วมกันต่อต้านโลกหล้า"
 trait_lifestyle_seasoned_pastor: "นักเลี้ยงปศุสัตว์ผู้เจนจัด"
 trait_lifestyle_seasoned_pastor_desc: "ตัวละครนี้ได้กลายเป็นผู้เชี่ยวชาญในวิถีการเลี้ยงปศุสัตว์ และสามารถดูแลให้ฝูงโคของตนใช้ประโยชน์จากทุ่งหญ้าได้อย่างดีที่สุด"
 trait_lifestyle_seasoned_pastor_character_desc: "[ROOT.GetCharacter.GetFirstNameNoTooltip] ได้กลายเป็นผู้เชี่ยวชาญในวิถีการเลี้ยงปศุสัตว์ และสามารถดูแลให้ฝูงโคของ [ROOT.GetCharacter.GetHerHis] ใช้ประโยชน์จากทุ่งหญ้าได้อย่างดีที่สุด"

