 #State traits
 trait_disinherited:0 "ถูกตัดออกจากกองมรดก"
 trait_disinherited_desc:0 "ตัวละครนี้ถูกตัดออกจากกองมรดกโดย[dynast|E]และไม่สามารถสืบทอดบรรดาศักดิ์ใดๆ จากสมาชิกราชวงศ์คนอื่นได้"
 trait_disinherited_character_desc:1 "[ROOT.GetCharacter.GetFirstNameNoTooltip] ถูกตัดออกจากกองมรดกโดย[dynast|E]ของ[ROOT.GetCharacter.GetHerHis]และไม่สามารถสืบทอดบรรดาศักดิ์ใดๆ จากสมาชิกราชวงศ์คนอื่นได้"
 trait_denounced:0 "ถูกประณาม"
 trait_denounced_desc:0 "ตัวละครนี้ถูกประณามโดย[dynast|E]ของพวกเขา และตอนนี้สามารถถูกคุมขังโดยสมาชิกราชวงศ์คนอื่นได้"
 trait_denounced_character_desc:2 "[ROOT.GetCharacter.GetFirstNameNoTooltip] ถูกประณามโดย[dynast|E]ของ[ROOT.GetCharacter.GetHerHis]และตอนนี้สามารถถูกคุมขังโดยสมาชิกราชวงศ์คนอื่นได้"
 
 trait_decadent: "ถูกกล่าวหาว่าเสื่อมทราม"
 trait_decadent_desc: "ตัวละครนี้ถูกกล่าวหาว่าเสื่อมทรามโดย[house_head|E]ของพวกเขา ไม่ว่าข้อกล่าวหาจะเป็นจริงหรือไม่ ชื่อเสียงและความน่าเชื่อถือของพวกเขาก็เสื่อมเสียอย่างมาก"
 trait_decadent_character_desc: "[ROOT.GetCharacter.GetFirstNameNoTooltip] ถูกกล่าวหาว่าเสื่อมทรามโดย[house_head|E]ของ[ROOT.GetCharacter.GetHerHis] ไม่ว่าข้อกล่าวหาจะเป็นจริงหรือไม่ ชื่อเสียงและความน่าเชื่อถือของ[ROOT.GetCharacter.GetHerHis]ก็เสื่อมเสียอย่างมาก"
 trait_extolled: "ได้รับการยกย่องจากตระกูล"
 trait_extolled_desc: "ตัวละครนี้ได้รับการยกย่องคุณงามความดีจาก[house_head|E]ของพวกเขา ไม่ว่าความสนใจนั้นสมควรได้รับหรือไม่ ตอนนี้พวกเขามีช่วงเวลาที่ยากลำบากในการหลีกหนีจากสายตาที่สอดส่องของสาธารณชน"
 trait_extolled_character_desc: "[ROOT.GetCharacter.GetFirstNameNoTooltip] ได้รับการยกย่องคุณงามความดี[ROOT.GetCharacter.GetHerHis]จาก[house_head|E]ของ[ROOT.GetCharacter.GetHerHis] ไม่ว่าความสนใจนั้นสมควรได้รับหรือไม่ [ROOT.GetCharacter.GetSheHe] ตอนนี้มีช่วงเวลาที่ยากลำบากในการหลีกหนีจากสายตาที่สอดส่องของสาธารณชน"
 trait_gallivanter: "ผู้รักสนุกไม่รับผิดชอบ"
 trait_gallivanter_desc: "ตัวละครนี้หลีกเลี่ยงความรับผิดชอบนอกเหนือจากสิ่งที่พวกเขามีอยู่แล้ว — เวลาของพวกเขามีค่า และพวกเขาไม่ต้องการให้มันสูญเปล่าไปกับหน้าที่ไร้สาระและแรงบันดาลใจที่ไร้ความหมาย"
 trait_gallivanter_character_desc: "[ROOT.GetCharacter.GetFirstNameNoTooltip] หลีกเลี่ยงความรับผิดชอบนอกเหนือจากที่[ROOT.GetCharacter.GetSheHe]มีอยู่แล้ว — เวลาของ[ROOT.GetCharacter.GetHerHis]มีค่า และ[ROOT.GetCharacter.GetSheHe]ไม่ต้องการให้มันสูญเปล่าไปกับหน้าที่ไร้สาระและแรงบันดาลใจที่ไร้ความหมาย"

