 trait_lunatic_1:0 "เสียสติ"
 trait_lunatic_1_desc:1 "ถูกหลอกหลอนด้วยภาพหลอน ความหลงผิด และความคิดที่ไม่ปะติดปะต่อ ตัวละครนี้พยายามแยกแยะระหว่างสิ่งที่เป็นจริงและสิ่งที่ไม่ใช่ความจริง"
 trait_lunatic_1_character_desc:0 "ถูกหลอกหลอนด้วยภาพหลอน ความหลงผิด และความคิดที่ไม่ปะติดปะต่อ [ROOT.GetCharacter.GetFirstNameNoTooltip] พยายามแยกแยะระหว่างสิ่งที่เป็นจริงและสิ่งที่ไม่ใช่ความจริง"
