l_english: 
 unify_region_decision: "รวบรวมภูมิภาคเมืองหลวง"
 unify_region_decision_desc: "การรวบรวมผู้คนทั้งมวลในภูมิภาคของ#EMP ข้า#! ถือเป็นภารกิจอันคู่ควรและเที่ยงธรรม!"
 unify_region_decision_tooltip: "ตอกย้ำอำนาจของท่านเหนือภูมิภาคเมืองหลวง"
 unify_region_decision_confirm: "รวบรวมภูมิภาค"
 tutorial_event_prefix: "เป้าหมายของผู้ปกครอง:"
 tutorial.1001.t: "$tutorial_event_prefix$ $unify_region_decision$"
 tutorial.1001.desc: "[councillor.GetName] พบข้าที่ [ROOT.Char.Custom('GetCourtyard')]:\n\n"[councillor.Custom2('AppropriateGreetingPositive', ROOT.Char)] ท่านได้สร้างคุณประโยชน์อันใหญ่หลวงแก่ปวงประชาในอาณาเขตของเรา" [councillor.GetSheHe|U] เริ่มกล่าววาจาหวานหูใส่ข้า เห็นได้ชัดว่าต้องการบางสิ่งเป็นการตอบแทน\n\n"ท่านเคยคิดที่จะปกครองทั่วทั้งภูมิภาค [region.GetName] หรือไม่? ข้ามีแผน แผนการใหญ่อยู่!""
 tutorial.1001.a: "ได้ โปรดชี้แนะข้าด้วย [councillor.GetNameNoTooltip]!"
 opted_into_tutorial_objectives_tt: "#EMP เลือกรับเป้าหมายของผู้ปกครอง#!"
 enable_unify_region_decision_tt: "เปิดใช้งาน [decision|E] [GetDecisionWithKey('unify_region_decision').GetName]"
 tutorial.1001.b: "[councillor.GetSheHe] เมาหรืออย่างไร? ข้าไม่ต้องการความช่วยเหลือจาก [councillor.GetHerHis] หรอก"
 tutorial.1002.t: "$tutorial_event_prefix$ พิชิตภูมิภาค"
 tutorial.1002.desc: "ขณะประทับบนบัลลังก์ ข้าทอดสายตามองผ่านหน้าต่างออกไปไกลโพ้น ราวกับว่าข้าสามารถเห็นดินแดนทั้งหมดของข้าใน [region.GetName] — และพวกมันช่างกว้างใหญ่ไพศาลนัก"
 tutorial.1002.desc_alive: "ข้าเรียกหา [councillor.GetName]\n\n"เราทำได้ [councillor.GetFirstNameNoTooltip] แต่ข้ายังไม่อยากจะเชื่อเลย! แผนการอันทะเยอทะยานของท่าน #EMP ใช้ได้ผล#! จริง ๆ" ข้ากระโดดลงจากบัลลังก์เพื่อสวมกอด [councillor.GetHerHim]\n\n"ข้ารู้อยู่แล้วว่าท่านทำได้!" [councillor.GetFirstNameNoTooltip] กล่าว พลางโอบกอดข้า "เราทำเพื่อประชาชน""
 tutorial.1002.desc_dead: "\n\nไอ้สารเลว [councillor.GetName] นั่น แผนการอันทะเยอทะยานของ [councillor.GetHerHis] #EMP มันได้ผล#! จริง ๆ"
 tutorial.1002.a: "ข้าหวังว่า [councillor.GetNameNoTooltip] จะได้เห็นสิ่งนี้"
 tutorial.1002.a_councillor: "ใช่ เราทำเพื่อพวกเขา!"
 ruler_objective_region_conquered_modifier: "เหล่าลูกหลานแห่งปฐพี"
 ruler_objective_region_conquered_modifier_desc: "ราชวงศ์นี้ได้สร้างอิทธิพลอย่างท่วมท้นในภูมิภาคบ้านเกิดของตน และมุ่งหวังที่จะปกครองเหนือดินแดนนี้ไปอีกหลายศตวรรษ"
 EVENT_WINDOW_OPTION_AVAILABLE_RULER_OBJECTIVES: "ตัวเลือกนี้มีอยู่ เนื่องจากเป้าหมายของผู้ปกครองที่กำลังดำเนินอยู่"
 custom_ireland_development_growth: "$MOD_MONTHLY_DEVELOPMENT_GROWTH_FACTOR$ ใน [region|E] [GetGeographicalRegion('custom_ireland').GetName]"

 # Dev. only advice example loc
 hint_dev_example_summary: "#D สรุปคำแนะนำสั้น ๆ #!"
 hint_dev_example_description: "#D คำอธิบายที่ยาวขึ้นอย่างมากเกี่ยวกับสิ่งที่ผู้เล่นควรทำ หรืออาจกำลังทำอยู่ และที่สำคัญที่สุดคือเหตุผล#!"

 hint_summary_get_succession: "รับ [title.GetNameNoTier] ผ่านการสืบทอด"
 hint_murder_successors: "สังหารผู้สืบทอดที่อยู่ในลำดับก่อนหน้าท่านหรือบุตรของท่าน"
 hint_marry_into_succession: "ใช้ [character_interaction|E] #HIGH $arrange_marriage_interaction$#! เพื่อจัดแจงการสมรสระหว่าง [holder.GetName] หรือ [heirs|E] ของ [holder.GetHerHis] กับท่านหรือ [dynasty_members|E] ของท่าน เพื่อให้ [children|E] ของพวกเขาจะได้สืบทอด [title|E] ในอนาคต\n\n#help โปรดใส่ใจกับ [succession_laws|E] ของ [title.GetName] และตัวเลือก [marriage|E] แบบ [matrilineal|E] ใน [character_interaction|E] #HIGH $arrange_marriage_interaction$#! เพื่อให้แน่ใจว่าตำแหน่งจะถูกสืบทอดโดยบุตรแห่งราชวงศ์ของท่าน หลังจากมีบุตรเกิดมา ท่านสามารถเร่งรัดการสืบทอดได้โดยใช้ [scheme|E] #HIGH $start_murder_interaction$#! กับทุกคนที่อยู่ในลำดับการสืบทอดก่อนหน้าบุตรของท่าน#!"
 hint_summary_get_title: "สร้างตำแหน่งตามนิตินัยของ [title.GetNameNoTier]"
 hint_summary_fabricate_claim: "สร้างสิทธิ์อ้างเหนือ [title.GetNameNoTier]"
 hint_summary_ask_for_claim: "ร้องขอสิทธิ์อ้างเหนือ [title.GetNameNoTier]"
 hint_claim_benefits: "\n\nการมีสิทธิ์อ้างจะปลดล็อก [casus_belli|E] #HIGH อ้างสิทธิ์#! ซึ่งช่วยให้ท่านสามารถยึด [title.GetName] มาได้ด้วยสงคราม"
 hint_ask_for_claim: "ใช้ [character_interaction|E] #HIGH $hof_ask_for_claim_interaction$#! กับ [head_of_faith|E] ของท่าน [hof.GetFullName] เพื่อจ่าย [piety|E] แลกกับ [claim|E] เหนือ [title|E] นี้\n\n#help นี่จะเป็น [pressed_claim|E] ดังนั้น [children|E] ของท่านจะสืบทอดสิทธิ์อ้างนี้และจะสามารถใช้เหตุแห่งสงครามเดียวกันได้$hint_claim_benefits$#!"
 hint_fabricate_claim: "สร้าง [claim|E] โดยใช้ [councillor_task|E] #HIGH $task_fabricate_claim$#! ของ [ROOT.Char.GetCouncillorPosition( 'councillor_court_chaplain' ).GetPositionName] [chaplain.GetFirstNamePossessive]\n\n#help [ROOT.Char.GetCouncillorPosition( 'councillor_court_chaplain' ).GetPositionName] ที่มี [learning_skill|E] สูงกว่า จะมีโอกาสสูงกว่าในการได้รับสิทธิ์อ้างเหนือ [title_duchy.GetName] นี่จะเป็น [unpressed_claim|E] เสมอ ดังนั้น [children|E] ของท่านจะไม่สืบทอดมัน ท่านต้องรีบดำเนินการ $hint_claim_benefits$#!"
 hint_summary_get_war: "พิชิต [title.GetNameNoTier] ผ่านสงคราม"
 hint_declare_war_intro: "ประกาศ [war|E] โดยใช้ [casus_belli|E] #HIGH [cb.GetName]#! การชนะสงครามจะ"
 hint_declare_war_outro: "\n\n#help จงดู [alliances|E], [levies|E], [knights|E] และ [men_at_arms|E] ของ [holder.GetName] และเปรียบเทียบกับของท่านเพื่อรับประกันชัยชนะ#!"
 hint_conquest_war: "$hint_declare_war_intro$ มอบ [title.GetName] เข้าสู่ [domain|E] ของท่าน $hint_declare_war_outro$"
 hint_create_title: "สร้าง [title|E] [de_jure|E] ที่สูงกว่า: [de_jure_title.GetName]\n\n#help นี่จะปลดล็อก [casus_bellis|E] [de_jure|E] หรือเพิ่มการยอมรับ [character_interaction|E] #HIGH $offer_vassalization_interaction$#!#!"
 hint_summary_conquer_vassal: "บังคับ [holder.GetTitledFirstName] ให้เป็นข้าหลวงของท่าน"
 hint_summary_offer_vassal: "ขอให้ [holder.GetTitledFirstName] มาเป็นข้าหลวงของท่าน"
 hint_offer_vassalization: "ทำให้เป็น [vassalize|E] อย่างสันติ โดยใช้ [character_interaction|E] #HIGH $offer_vassalization_interaction$#!\n\n#help นี่จะ ทำให้ [holder.GetTitledFirstName] เป็น [vassal|E] ของท่าน"
 hint_vassalization_war: "$hint_declare_war_intro$ มอบ [holder.GetName] ให้เป็น [vassal|E] ของท่าน $hint_declare_war_outro$"
 hint_summary_help_offer_vassal: "พัฒนาความสัมพันธ์กับ [holder.GetTitledFirstName] ผ่านแผนการ"
 hint_help_offer_vassalization: "ใช้ [character_interaction|E] #HIGH $sway_interaction$#!, #HIGH $befriend_interaction$#! หรือ #HIGH $seduce_interaction$#! กับ [holder.GetName] เพื่อพัฒนา [opinion|E] ของพวกเขาที่มีต่อท่าน\n\n#help นี่จะทำให้ [holder.GetTitledFirstNameNoTooltip] เต็มใจที่จะยอมรับ [character_interaction|E] #HIGH $offer_vassalization_interaction$#! มากขึ้น$hint_opinion_schemes_benefits$#!"
 hint_summary_help_offer_vassal_interactions: "พัฒนาความสัมพันธ์กับ [holder.GetTitledFirstName] ผ่านปฏิสัมพันธ์"
 hint_help_offer_vassalization_interactions: "ใช้ [character_interaction|E] #HIGH $gift_interaction$#!, #HIGH $offer_ward_interaction$#! หรือ #HIGH $gift_artifact_interaction$#! กับ [holder.GetName] เพื่อพัฒนา [opinion|E] ของพวกเขาที่มีต่อท่าน\n\n#help นี่จะทำให้ [holder.GetTitledFirstNameNoTooltip] เต็มใจที่จะยอมรับ [character_interaction|E] #HIGH $offer_vassalization_interaction$#! มากขึ้น $hint_opinion_interaction_benefits$#!"
 hint_summary_murder_top_liege: "สังหาร [holder.GetTitledFirstName]"
 hint_murder_top_liege: "ใช้ [character_interaction|E] #HIGH $start_murder_interaction$#! กับ [holder.GetName] เพื่อสังหารพวกเขา\n\n#help นี่จะทำให้ [heir|E] ของ [title.GetName] คือ [title_heir.GetName] กลายเป็น [holder|E] คนใหม่ ผู้ปกครองคนใหม่มักจะมีอาณาจักรที่อ่อนแอกว่า เนื่องจากอาณาจักรถูกแบ่งแยกระหว่าง [heirs|E] อื่น ๆ หรือบทลงโทษ [short_reign|E] ที่ลดค่าความเห็นจากเหล่าข้าหลวงของพวกเขา ซึ่งจะทำให้ [taxes|E] และ [levies|E] ลดลง#!"
 hint_summary_get_knights: "จ้าง [ROOT.Char.Custom('KnightCulturePluralNoTooltip')]"
 hint_get_knights: "ใช้ [decision|E] [GetDecisionWithKey('invite_knights_decision').GetName] เพื่อรับ [guests|E] ใหม่ที่ท่านสามารถรับสมัครเป็น [knights|E] ได้โดยใช้ [character_interaction|E] #HIGH $recruit_guest_interaction$#!\n\nใช้ [character_interaction|E] #HIGH $invite_to_court_interaction$#! กับตัวละคร [unlanded|E] ใด ๆ ที่มี [prowess|E] สูงที่ท่านสามารถหาได้ โดยการมองหาใน [courts|E] ของ [rulers|E] อื่น ๆ\n\nใช้ [character_interaction|E] #HIGH $arrange_marriage_interaction$#! เพื่อ [marry|E] เหล่า [courtiers|E] ของท่านกับข้าราชสำนักไร้ที่ดินอื่น ๆ ที่มีความเก่งกาจสูง\n\n#help ขึ้นอยู่กับ [martial_custom|E] ของท่าน ท่านอาจต้องใช้การสมรสแบบ [matrilineal|E] เพื่อให้พวกเขามายัง [court|E] ของท่าน ท่านสามารถใช้เครื่องมือค้นหาตัวละครและจัดเรียงตาม ความเก่งกาจ ได้#!"
 hint_summary_marry_allies: "สมรสกับผู้ปกครองที่ทรงอำนาจ"
 hint_marry_allies: "ใช้ [character_interaction|E] #HIGH $arrange_marriage_interaction$#! เพื่อ [marry|E] ตัวท่านเองหรือ [close_family|E] ของท่าน กับ [rulers|E] อื่น ๆ หรือครอบครัวใกล้ชิดของพวกเขาที่มีกำลังทหารสูง เพื่อรับ [alliances|E] ที่ทรงพลัง (ใช้การจัดเรียงตาม: พลังพันธมิตร ในหน้าต่างปฏิสัมพันธ์)$hint_allies_benefits$"
 hint_summary_perk_negotiate_allies: "รับคุณสมบัติ $defensive_negotiations_perk_name$"
 hint_allies_benefits: "\n\n#help เมื่ออยู่ใน [war|E] กับ [holder.GetName] ใช้ [character_interaction|E] #HIGH $call_ally_interaction$#! กับพันธมิตรของท่าน พวกเขาสามารถเข้าร่วมและใช้กองทัพของพวกเขาเพื่อช่วยให้ท่านชนะสงครามได้#!"
 hint_perk_negotiate_allies: "เลือก [diplomacy_lifestyle|E] และรับคะแนน [experience|E] ให้เพียงพอเพื่อปลดล็อก [perk|E] [GetPerk('defensive_negotiations_perk').GetName(GetPlayer)]\n\n#help นี่จะปลดล็อก [character_interaction|E] #HIGH $perk_alliance_interaction$#! ซึ่งช่วยให้ท่านสามารถ [ally|E] กับ [rulers|E] อื่น ๆ ได้โดยไม่จำเป็นต้อง [marrying|E]$hint_allies_benefits$#!"
 hint_summary_negotiate_allies: "เจรจาพันธมิตร"
 hint_negotiate_allies: "ใช้ [character_interaction|E] #HIGH $perk_alliance_interaction$#! เพื่อ [ally|E] กับ [ruler|E] อื่น โดยไม่จำเป็นต้อง [marrying|E]$hint_allies_benefits$"
 hint_summary_help_ask_for_claim_interactions: "พัฒนาความเห็นของ [hof.GetTitledFirstName] ด้วยปฏิสัมพันธ์"
 hint_help_help_ask_for_claim_interactions: "ใช้ [character_interaction|E] #HIGH $gift_interaction$#!, #HIGH $seek_indulgences_interaction$#!, #HIGH $offer_ward_interaction$#! หรือ #HIGH $gift_artifact_interaction$#! กับ [hof.GetName] เพื่อพัฒนา [opinion|E] ของพวกเขาที่มีต่อท่าน\n\n#help นี่จะทำให้ [hof.GetTitledFirstNameNoTooltip] เต็มใจที่จะยอมรับ [character_interaction|E] #HIGH $hof_ask_for_claim_interaction$#! มากขึ้น\n\n#HIGH $seek_indulgences_interaction$#! และ $hint_opinion_interaction_benefits$#!"
 hint_opinion_interaction_benefits: "#HIGH $gift_interaction$#! สามารถใช้ได้เสมอหากท่านมี [gold_i][gold|E] เพียงพอ #HIGH $offer_ward_interaction$#! ใช้ได้เฉพาะเมื่อท่านมี [child|E] ที่ยังไม่โตเป็นผู้ใหญ่และไม่มี [guardian|E] #HIGH $gift_artifact_interaction$#! ใช้ได้เฉพาะเมื่อท่านมี [artifact|E]"
 hint_summary_help_ask_for_claim: "พัฒนาความเห็นของ [hof.GetTitledFirstName] ด้วยแผนการ"
 hint_help_help_ask_for_claim: "ใช้ [character_interaction|E] #HIGH $sway_interaction$#!, #HIGH $befriend_interaction$#! หรือ #HIGH $seduce_interaction$#! กับ [hof.GetName] เพื่อพัฒนา [opinion|E] ของพวกเขาที่มีต่อท่าน\n\n#help นี่จะทำให้ [hof.GetTitledFirstNameNoTooltip] เต็มใจที่จะยอมรับ [character_interaction|E] #HIGH $hof_ask_for_claim_interaction$#! มากขึ้น$hint_opinion_schemes_benefits$#!"
 hint_opinion_schemes_benefits: "\n\n#HIGH $sway_interaction$#! สามารถใช้ได้เสมอและกับทุกคนใน [diplomatic_range|E] ของท่าน #HIGH $befriend_interaction$#! ใช้ได้เฉพาะเมื่อท่านมี [perk|E] [GetPerk('befriend_perk').GetName(GetPlayer)] หรือ [tradition|E] [GetCultureTradition('tradition_fp2_ritualised_friendship').GetName] #HIGH $seduce_interaction$#! ใช้ได้เฉพาะเมื่อท่านมี [sexuality|E] ที่เข้ากันได้"
 hint_summary_recruit_maa: "สร้างกองทหารอาชีพ"
 hint_recruit_maa: "ใช้ [gold_i][gold|E] เพื่อสร้าง [regiments|E] ของ [men_at_arms|E] ที่มีอุปกรณ์ครบครันและได้รับการฝึกฝนมาอย่างดี เพื่อเสริมความแข็งแกร่งให้ [army|E] ของท่าน ไปที่หน้าต่างการทหารและเลือกประเภท [men_at_arms|E]\n\n#help เลือกประเภทโดยพิจารณาว่าประเภทใดเป็น [counter|E] ที่ดีที่สุดสำหรับ [men_at_arms|E] ของ [holder.GetNamePossessive] ท่านสามารถดูได้ในหน้าต่างตัวละครของ [holder.GetHerHis] ใต้คำแนะนำเครื่องมือความแข็งแกร่งทางการทหาร#!"
 hint_summary_recruit_mercenaries: "จ้างทหารรับจ้าง"
 hint_recruit_mercenaries: "ใช้ [gold_i][gold|E] เพื่อจ้าง [mercenaries|E] มาเสริมความแข็งแกร่งให้ [army|E] ของท่าน ไปที่หน้าต่างการทหารและเลือกแท็บทหารรับจ้าง\n\n#help [mercenaries|E] จะทำงานให้ท่านตาม [mercenary_contract|E] เป็นเวลา 3 ปี ท่านสามารถขยายเวลาได้ตลอดเวลาอีก 3 ปี โดยจ่ายทองในจำนวนเท่าเดิมเมื่อจ้าง\n\nเลือกประเภทโดยขึ้นอยู่กับจำนวน [gold|E] ที่ท่านมี (ท่านสามารถเป็น [debt|E] เพื่อจ้างพวกเขาได้ อย่างไรก็ตาม การเป็นหนี้จะลด [advantage|E] และขัดขวางการเสริมกำลัง [men_at_arms|E]) และประเภทใดเป็น [counter|E] ที่ดีที่สุดสำหรับ [men_at_arms|E] ของ [holder.GetNamePossessive] ท่านสามารถดูได้ในหน้าต่างตัวละครของ [holder.GetHerHis] ใต้คำแนะนำเครื่องมือความแข็งแกร่งทางการทหาร#!"
 hint_summary_take_decision: "ทำเป้าหมายของผู้ปกครองให้สำเร็จ"
 hint_take_decision: "ท่านบรรลุข้อกำหนดทั้งหมดของ [decision|E] [GetDecisionWithKey('unify_region_decision').GetName] จงเลือกมันเพื่อทำเป้าหมายของผู้ปกครองให้สำเร็จ"

 advice_become_house_head_summary: "เป็น [house_head|E] ของตระกูลท่าน"
 advice_become_house_head_description: "[house_head|E] มักจะดำรงตำแหน่งนั้นไปตลอดชีวิต แม้ว่าการสังหารสมาชิกครอบครัวของท่านเองเป็นจำนวนมากจะเป็นทางเลือกเสมอ แต่การสร้างตระกูลใหม่อาจรวดเร็วกว่า \n\n#help $EFFECT_LIST_BULLET$ เปิด '$DECISIONS_AND_CONTRACTS_BUTTON$' ทางด้านขวาของท่าน\n$EFFECT_LIST_BULLET$ ภายใต้ '#S $DECISIONS_VIEW_MAJOR_DECISIONS$#!' ท่านจะพบการตัดสินใจ '#S $create_cadet_branch_decision$#!'#!"
