 rule_difficulty:0 "ระดับความยาก"
 setting_easy_difficulty:1 "#high ง่าย#!"
 setting_easy_difficulty_desc:0 "ท่านจะได้รับโบนัส เช่น การลดผลกระทบของโรคภัย, แผนการที่เป็นปฏิปักษ์ และความเครียด นอกจากนี้ยังง่ายต่อการจัดการฝ่ายมากขึ้น"
 setting_very_easy_difficulty:1 "#high ง่ายมาก#!"
 setting_very_easy_difficulty_desc:0 "ท่านจะได้รับโบนัสอย่างมีนัยสำคัญ เช่น การลดผลกระทบของโรคภัย, แผนการที่เป็นปฏิปักษ์ และความเครียด นอกจากนี้ยังง่ายต่อการจัดการฝ่ายมากขึ้นอย่างมาก"
 setting_hard_difficulty: "#high ยาก#!"
 setting_hard_difficulty_desc: "ผู้ปกครอง AI จะได้รับโบนัส เช่น ความเครียดน้อยลงและอาณาจักรมีเสถียรภาพมากขึ้น @alert_icon! #alert_trial สิ่งนี้จะทำให้อาณาจักร AI มีเสถียรภาพและมั่งคั่งมากขึ้น ซึ่งจะทำให้เกมมีความสมดุลน้อยลง#!"
 setting_very_hard_difficulty: "#high ยากมาก#!"
 setting_very_hard_difficulty_desc: "ผู้ปกครอง AI จะได้รับโบนัสจำนวนมาก เช่น ความเครียดน้อยลงและอาณาจักรมีเสถียรภาพมากขึ้น @warning_icon! #X สิ่งนี้จะทำให้อาณาจักร AI มีเสถียรภาพและมั่งคั่งอย่างยิ่ง ซึ่งจะทำให้เกมมีความสมดุลน้อยลง#!"
 setting_normal_difficulty:0 "ปกติ"
 setting_normal_difficulty_desc:0 "ท่านจะเล่นในสนามแข่งขันที่เท่าเทียม โดยไม่มีโบนัสที่สำคัญใด ๆ"
 
