 game_rule.1141.t: "สภาวิเทนาเกมอทเลือก: [elect.GetFirstNameNoTooltip] แห่ง [elect.GetHouse.GetNameNoTooltip]"
 game_rule.1141.intro.battlefield: "[winner.GetTitledFirstName] สิ้นชีพในสนามรบ ถูกสังหารขณะต่อสู้กับผู้ชิงบัลลังก์ [loser.GetTitledFirstNameNicknamed]\n\n"
 game_rule.1141.intro.home: "[winner.GetTitledFirstName] สิ้นชีพอย่างไม่คาดฝัน โดยอ้างว่าเป็นอาการหัวใจวายเมื่อได้รับข่าวดีเรื่องความพ่ายแพ้ของ [loser.GetTitledFirstNameNicknamedPossessive]\n\n"
 game_rule.1141.choice.margaret: "ด้วยปาฏิหาริย์อันสับสนใดไม่ทราบ สภาวิเทนาเกโมทได้ตกลงเลือก #EMP ข้า#! เป็นผู้สมัครประนีประนอม ปัดทายาทที่คาดหวัง [jiltee.GetFullNameNoTooltip] ตกไป เหล่าเอิร์ลผู้ยิ่งใหญ่เชื่ออย่างชัดเจนว่าพวกเขาสามารถควบคุมข้าได้ คิดว่าข้าเป็นเพียงหุ่นเชิดสำหรับความทะเยอทะยานของพวกเขา\n\nข้าไม่ได้เป็น เช่นนั้นเลย แต่ข้าก็ยินดีรับการผลักดันสู่อำนาจอย่างไม่คาดฝันนี้ — เพราะอย่างไรเสีย ข้าก็เป็นบุตรคนแรกของบิดาข้า"
 game_rule.1141.choice.edgar: "ด้วยความสามารถอันไม่เคยพบเห็นในการเมืองอังกฤษมานานหลายปี สภาวิเทนาเกโมทได้เห็นสมควรที่จะยอมรับว่า #EMP ข้า#! คือทายาทอันชอบธรรมของ [GetScriptedCharacterByHistoryID( '114' ).GetTitledFirstNameNicknamedPossessive] และ แต่งตั้งให้ข้าปกครองอาณาจักร ปัดทายาทที่คาดหวัง [jiltee.GetFullNameNoTooltip] ตกไป\n\nข้ามิอาจกล่าวได้ว่าข้าได้ทำสิ่งใดเพื่อสมควรได้รับความโปรดปรานจาก [ROOT.Char.GetFaith.FateGodNamePossessive] ถึงเพียงนี้ แต่ข้าก็ยินดียิ่งที่ได้ทำ เช่นนั้น"
 game_rule.1141.choice.svend: "ด้วยความเบื่อหน่ายต่อความตายและความพินาศที่ผู้อ้างสิทธิ์อื่นทุกคนก่อขึ้น สภาวิเทนาเกโมทจึงได้ — อย่างมีเหตุผลเป็นครั้งแรก — หันมาหา #EMP ข้า#! ในฐานะตัวเลือกที่เป็นธรรมชาติที่สุดคนต่อไปที่จะนำความสงบเรียบร้อยมาสู่ ปัดทายาทที่คาดหวัง [jiltee.GetFullNameNoTooltip] ตกไป\n\nอีกครั้งหนึ่ง เดนมาร์กจะเข้าครองตำแหน่งอันชอบธรรมในการปกครองอังกฤษ"
 game_rule.1141.choice.aelfwine: "ราวกับถูกสิงสู่ด้วยความวิปลาสอันลึกลับใด สภาวิเทนาเกโมทได้อ้อนวอนให้ #EMP ข้า#! กลับบ้านเกิดและปกครองอาณาจักรของบิดาและปู่ของข้า ปัดทายาทที่คาดหวัง [jiltee.GetFullNameNoTooltip] ตกไป\n\nข้า... ข้ามิได้ทะเยอทะยานในสิ่งนี้ ข้าไม่ต้องการมัน ข้าปลีกตัวออกจากอำนาจให้ไกลที่สุดเท่าที่ข้าจะทำได้ แต่เป็นที่ชัดเจนแล้วว่ามิอาจหลีกหนีจากพระประสงค์ของ [elect.GetFaith.HighGodNamePossessive] ที่ต้องการให้ข้ากลับไปยังดินแดนที่ข้าได้จากมาอย่างมีความสุขตลอดกาลได้"
 game_rule.1141.choice.cadoc: "ด้วยการทะเลาะวิวาทตามปกติ สภาวิเทนาเกมอทได้ตัดสินใจอย่างน่าสงสัย ด้วยไม่เต็มใจที่จะทนกับกษัตริย์ต่างชาติอีกคนและสงสัย ซึ่งกันและกัน พวกเขาได้เลือก #EMP ข้า#! ให้ปกครองอังกฤษ เห็นได้ชัดว่าคิดว่าข้าเป็นหุ่นเชิดที่อ่อนแอ ซึ่งพวกเขาสามารถปั้นได้ตามใจชอบ\n\nบางทีพวกเขาอาจจะถูก บางทีอาจจะไม่ ข้าทำได้เพียงต้อนรับโอกาสที่ไม่คาดฝันนี้เพื่อพิสูจน์ตนเอง!"
 game_rule.1141.a.margaret: "ราชินีองค์แรกแห่งอังกฤษ!"
 game_rule.1141.a.edgar: "สิทธิ์โดยกำเนิดของข้า กลับคืนมาแล้ว!"
 game_rule.1141.a.svend: "ข้ารู้อยู่เสมอว่ามันจะจบลงแบบนี้"
 game_rule.1141.a.aelfwine: "ข้าไม่เคยขอสิ่งนี้!"
 # Geddit geddit GEDDIT d'you geddit
 game_rule.1141.a.cadoc: "แม้ห้าร้อยปีนับจากนี้ พวกเขาจะยังคงรู้จักนามของข้า!"

 game_rule.1142.t: "$game_rule.1141.t$"
 game_rule.1142.intro.battlefield: "[winner.Custom2('MyCharacterIntroduction', ROOT.Char)|U] สิ้นชีพในสนามรบ ถูกสังหารขณะต่อสู้กับผู้ชิงบัลลังก์ [loser.GetTitledFirstNameNicknamed]\n\n"
 game_rule.1142.intro.home: "[winner.Custom2('MyCharacterIntroduction', ROOT.Char)|U] สิ้นชีพอย่างไม่คาดฝัน โดยอ้างว่าเป็นอาการหัวใจวายเมื่อได้รับข่าวดีเรื่องความพ่ายแพ้ของ [loser.GetTitledFirstNameNicknamedPossessive]\n\n"
 game_rule.1142.choice.preamble: "เหนือความคาดหมายทั้งปวง ในตำแหน่งของ [winner.GetHerHis] สภาวิเทนาเกมอทได้เลือกที่จะเลือก [elect.GetFirstName] แห่ง [elect.GetHouse.GetName] —"
 game_rule.1142.choice.margaret: "หลานสาวของ [GetScriptedCharacterByHistoryID( '114' ).GetTitledFirstNameNicknamedPossessive] และธิดาของนักพเนจร [GetScriptedCharacterByHistoryID( '110' ).GetTitledFirstNameNicknamed]"
 game_rule.1142.choice.edgar: "หลานปู่ของ [GetScriptedCharacterByHistoryID( '114' ).GetTitledFirstNameNicknamedPossessive] ทายาทผู้ถูกเลือกก่อนที่ [winner.GetFirstNameNoTooltip] จะยึดอำนาจ และบุตรของนักพเนจร [GetScriptedCharacterByHistoryID( '110' ).GetTitledFirstNameNicknamed]"
 game_rule.1142.choice.svend: "หลานชายของ [GetScriptedCharacterByHistoryID( '101505' ).GetTitledFirstNameNicknamedPossessive] และ [elect.GetTitleAsNameNoTooltip] แห่ง [elect.GetPrimaryTitle.GetBaseNameNoTier] ผู้ ซึ่งเลือกที่จะไม่เข้าร่วมในระยะแรกของความขัดแย้ง"
 game_rule.1142.choice.aelfwine: "หลานชายของ [GetScriptedCharacterByHistoryID( '101510' ).GetTitledFirstNameNicknamed] ผู้ ซึ่งลี้ภัยด้วยตนเองในฐานะนักบวชผู้ยากจนในอ็อกซิตาเนีย"
 game_rule.1142.choice.cadoc: "ขุนนางคอร์นวอลล์จากตระกูลที่ไม่สามารถเอ่ยชื่อได้หรืออะไรทำนองนั้น"
 game_rule.1142.outro: "— เป็นผู้ปกครองคนใหม่ของอาณาจักรแทนที่จะเป็น #EMP ข้า#!.\n\nดูเหมือนว่าอังกฤษได้หลุดลอยไปจากเงื้อมมือของข้าทันที"
 game_rule.1142.a: "นี่มันอุกอาจ บัลลังก์เป็นของข้า!"
 game_rule.1142.b: "เจตจำนงของสภานั้นแน่วแน่"
 game_rule.1142.c: "ใกล้จะได้ครองราชย์แล้วแท้ๆ แต่ก็ยังห่างไกล..."

 rule_historicity_frankokratia: "โอกาสเกิดฟรังโกคราเตีย"
 setting_historicity_frankokratia_default: "สมดุล"
 setting_historicity_frankokratia_default_desc: "สงครามครูเสดที่แตกแยก ซึ่งเบี่ยงเบนชาวคาทอลิกไปโจมตีไบแซนไทน์ สามารถเกิดขึ้นได้ทันทีจากจุดเริ่มต้นปี 1178 หากใช้จุดเริ่มต้นก่อนหน้านี้ สิ่งนี้จะเกิดขึ้นได้ก็ต่อเมื่อ #EMP หลัง#! จาก [crusade|E] คาทอลิกครั้งแรกเท่านั้น"
