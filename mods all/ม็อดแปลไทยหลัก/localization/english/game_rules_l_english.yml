 setting_historicity_extra_admin_carolingians_gameplay_not_administrative_desc: "จะไม่มีรัฐสืบทอดของคาโรแล็งเชียงใดๆ ที่มี [governments|E] แบบ [administrative|E] ในปี 867 ซึ่งสะท้อนให้เห็นว่าอดีตจักรวรรดิส่วนใหญ่ได้กลายเป็นระบบเจ้าขุนมูลนาย (feudal) ในช่วงรุ่นหรือสองรุ่นที่ผ่านมา"
 setting_historicity_extra_admin_carolingians_alt_historic_all_administrative: "#high ทั้งหมดเป็นแบบบริหารในปี 867#!"
 setting_historicity_extra_admin_carolingians_alt_historic_all_administrative_desc: "อาณาจักรแฟรงก์ตะวันตก โลทาริงเจีย อาณาจักรแฟรงก์ตะวันออก และอิตาลี ทั้งหมดจะเริ่มต้นเป็น [governments|E] แบบ [administrative|E] ในปี 867 ซึ่งไม่ได้สะท้อนโครงสร้างองค์กรทางประวัติศาสตร์ ( แต่ก็ยังไม่ห่างไกลนัก — ในตอนนี้)"
 setting_historicity_extra_admin_carolingians_alt_historic_west_francia_administrative: "#high อาณาจักรแฟรงก์ตะวันตกในปี 867#!"
 setting_historicity_extra_admin_carolingians_alt_historic_west_francia_administrative_desc: "เฉพาะอาณาจักรแฟรงก์ตะวันตกเท่านั้นที่จะเริ่มต้นเป็น [government|E] แบบ [administrative|E] ในปี 867 ซึ่งไม่ได้สะท้อนโครงสร้างองค์กรทางประวัติศาสตร์"
 setting_historicity_extra_admin_carolingians_alt_historic_lotharingia_administrative: "#high โลทาริงเจียในปี 867#!"
 setting_historicity_extra_admin_carolingians_alt_historic_lotharingia_administrative_desc: "เฉพาะโลทาริงเจียเท่านั้นที่จะเริ่มต้นเป็น [government|E] แบบ [administrative|E] ในปี 867 ซึ่งไม่ได้สะท้อนโครงสร้างองค์กรทางประวัติศาสตร์"
 setting_historicity_extra_admin_carolingians_alt_historic_east_francia_administrative: "#high อาณาจักรแฟรงก์ตะวันออกในปี 867#!"
 setting_historicity_extra_admin_carolingians_alt_historic_east_francia_administrative_desc: "เฉพาะอาณาจักรแฟรงก์ตะวันออกเท่านั้นที่จะเริ่มต้นเป็น [government|E] แบบ [administrative|E] ในปี 867 ซึ่งไม่ได้สะท้อนโครงสร้างองค์กรทางประวัติศาสตร์"
 setting_historicity_extra_admin_carolingians_alt_historic_italy_administrative: "#high อิตาลีในปี 867#!"
 setting_historicity_extra_admin_carolingians_alt_historic_italy_administrative_desc: "เฉพาะอิตาลีเท่านั้นที่จะเริ่มต้นเป็น [government|E] แบบ [administrative|E] ในปี 867 ซึ่งไม่ได้สะท้อนโครงสร้างองค์กรทางประวัติศาสตร์"

