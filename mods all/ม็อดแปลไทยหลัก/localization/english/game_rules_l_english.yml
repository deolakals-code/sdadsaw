 game_rule.1131.desc.conquest_finished.die_battlefield: "$game_rule.1102.desc.outro.dead$"
 game_rule.1131.desc.conquest_finished.die_home: "เมื่อข่าวมาถึงข้าว่าเราชนะการรบ ข้ารู้สึกปลาบปลื้ม! หัวใจของข้าเต้นโลดด้วยความยินดี บิดตัว หมุนวน #EMP กระตุก#! #BER กรีดร้อง!#!\n\nเกิด...อะไร...ขึ้น...กับข้า...หายใจ... #DIE1 ไม่ออก... หายใจ...#!"
