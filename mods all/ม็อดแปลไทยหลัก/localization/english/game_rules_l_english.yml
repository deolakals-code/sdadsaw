 game_rule.1101.desc.combat.locale.stamford_bridge: "ตลอดรุ่งเช้า กองกำลังของเราผลักดันกันไปมาข้ามสะพาน กลุ่มย่อยแยกตัวข้ามแม่น้ำเดอร์เวนต์เพื่อสัประยุทธ์กับศัตรูบนฝั่งตรงข้ามทุกชั่วยาม\n\nมันคือ... การสังหารหมู่ ไม่มีสิ่งใดนอกจากเสียงกรีดร้องและความตาย คั่นด้วยเสียงร่างกระแทกผิวน้ำ แม่น้ำเดอร์เวนต์ไหลนองเป็นสีเลือด และคงเป็น เช่นนี้ไปอีกหลายไมล์ ข้าชูดาบขึ้นสูง พุ่งเข้าจู่โจมครั้งสุดท้ายเพื่อทำลายการคุมเชิง บุกข้ามสะพานไปพร้อมกับกองทหารประจำตัวของข้า และ—"
 game_rule.1101.desc.combat.locale.hastings: "ทั่วทั้งโลกเต็มไปด้วยเสียงโลหะกระทบไม้ เสียงโล่แตก เสียงม้าร้อง เสียงธนู #EMP ฟิ้ว#! นับพันดอกแหวกอากาศสู่ท้องฟ้าอย่างต่อเนื่อง\n\nทุกสิ่งลดเหลือเพียงเสียงกรีดร้อง เลือด และความน่าสะพรึงกลัว เสียงร้องของผู้บาดเจ็บและกำลังจะตาย คำสาปแช่งของผู้ต้องการแก้แค้น เสียงหัวเราะอย่างยินดีของผู้มีชัยที่อาศัยอะดรีนาลีนบุกตะลุยเข้าไปในสมรภูมิ\n\nชะตากรรมแขวนอยู่บนเส้นด้าย และด้วยเสียงร้องว่า #EMP รวมพล!#! ข้าสั่งให้กองทหารของข้าบุกไปข้างหน้า"
 game_rule.1101.desc.combat.locale.dover: "ใกล้กับขอบผาอันตราย กองทัพทั้งสองฝ่ายเคลื่อนพลเพียงเพื่อผลักดันศัตรูให้ตกหน้าผา — ได้ผลจำกัด\n\nกลิ่นคาวเลือดคละคลุ้งในอากาศ เสียงอึกทึกของการสู้รบต้องดังไปไกลหลายไมล์ในทะเล ผู้สังเกตการณ์ที่โชคร้ายอาจมองเห็นร่างที่ร่วงหล่นลงมาจากหน้าผาหินชอล์กเป็นครั้งคราว\n\nสิ่งนี้ดำเนินต่อไปไม่ได้ สิ่งนี้ #EMP จะต้อง#! ไม่ดำเนินต่อไป มิฉะนั้นเราจะหมดแรง ด้วยเสียงร้อง ข้าสั่งให้ทหารของข้าบุกไปข้างหน้า สู่ชัยชนะ สู่—"
 game_rule.1101.desc.combat.locale.isle_of_wight: "ห่างไกลจากแผ่นดินใหญ่ ไม่มีที่ให้หนี และกองทัพทั้งสองฝ่ายต่อสู้อย่างสิ้นหวังเหมือนผู้ที่เข้าใจว่าต้องสู้ตาย หากท่านไม่ถูกผลักลงสู่กระแสน้ำแห่งเมดินา เกาะก็ไม่ใหญ่พอที่จะซ่อนตัวได้นาน\n\nด้วยเหตุผลบางอย่าง ข้าได้แยกออกจากทหารของข้า มีเพียงทหารองครักษ์ไม่กี่นายที่ต่อสู้ฝ่าฟันการตะลุมบอนอยู่เคียงข้างข้า หากข้าสามารถเปลี่ยนสิ่งนี้ให้เป็นประโยชน์ได้ หากข้าสามารถเปลี่ยนทิศทางการต่อสู้ได้เพียงเล็กน้อย—"
 game_rule.1101.desc.combat.locale.forest_of_dean: "ภายใต้ต้นไม้อันดุร้ายเหล่านี้ ในพุ่มไม้และป่าละเมาะของป่าไม้อันเก่าแก่แห่งนี้ เลือดรดพื้นดินอย่างง่ายดายที่สุด และทัศนวิสัยก็ย่ำแย่จนไม่มีใครบอกได้ว่าการรบดำเนินไปอย่างไร\n\nป่าดูเหมือนจะดูดกลืนทั้งเสียงและชีวิต ทำให้การต่อสู้ของเรามีความเงียบสงัดอย่างน่าประหลาดสำหรับความโกลาหลและความตายที่แผ่กระจายไปทั่วกองทัพ ถึงกระนั้น ข้าคิดว่า บางที สิ่งต่างๆ กำลังเข้าข้างเรา—"
 game_rule.1101.desc.combat.locale.london: "แม้ว่าผู้ป้องกันจากบนเชิงเทินจะพยายามอย่างสุดความสามารถที่จะเปลี่ยนแปลงสถานการณ์ไปทางใดทางหนึ่ง แต่ทั้งสองฝ่ายก็เพียง แต่บดขยี้กันไปมาในภาวะชะงักงันที่ไม่หยุดยั้ง\n\nอากาศเหม็นคาวเลือด เสียงอึกทึกของผู้กำลังจะตายและนักฆ่าของพวกเขาปกคลุมไปทั่ว และไอพิษจากฝุ่นและเหงื่อ ทำให้ไม่สามารถบอกได้ว่าใครกำลังชนะ\n\nถึงกระนั้น ข้าไม่สามารถทอดทิ้งกองทหารของข้าไว้กับ #EMP ความอนาธิปไตย#! นี้ได้ และด้วยเสียงร้อง ข้าพุ่งเข้าใส่ศัตรูอีกครั้ง นี่คือเวลาของเรา เราจะได้รับชัยชนะ เราจะทำลายพวกเขา เราจะ—"
 game_rule.1101.desc.combat.locale.cirencester: "$game_rule.1101.desc.combat.locale.london$"
 game_rule.1101.desc.combat.locale.guildford: "เนินเขาที่คดเคี้ยว โดยไม่มีกองทัพใดควบคุมยอดเขาได้อย่างสมบูรณ์ ทำให้เกิดการต่อสู้ที่น่าตื่นตาตื่นใจ แนวรบยาวและแคบ ทั้งสองฝ่ายผลักดันอย่างหนักเพื่อบังคับให้อีกฝ่ายลงไปตามสันเขาฝั่งตรงข้าม ที่ ซึ่งความได้เปรียบด้านความสูงจะนำพวกเขาไปสู่ชัยชนะอย่างแน่นอน\n\nแต่ข้ารู้ว่ามันคือ #EMP กองทหารของข้า#! ที่จะได้รับชัยชนะนี้ #EMP กองกำลังของข้า#! ที่จะได้ลิ้มรสความหอมหวานแห่งชัยชนะ! บุกไปข้างหน้า #EMP บุกไป ไอ้พวกหมา!#! บุกไป! เราต้องการเพียงการผลักดันอย่างแข็งขันครั้งเดียวเพื่อชัยชนะ การผลักดันครั้งเดียวเพื่อ—"
 game_rule.1101.desc.combat.locale.lindisfarne: "ละอองน้ำทะเลกัดตา ลมหนาวที่พัดมาจากทะเลเหนือกัดกินเสื้อผ้าและโล่ และเสียงร้องของผู้ตายและกำลังจะตายดังไปถึงพระที่กำลังร่ำไห้ในอาราม ผู้ ซึ่งคร่ำครวญและฉีกเสื้อคลุมของตนเมื่อเห็นการสังหารหมู่ต่อหน้าพวกเขา\n\nหากข้าล้มลงที่นี่ ก็ขอให้เป็นไปตามพระประสงค์ของ [ROOT.Char.GetFaith.HighGodName] เพราะ มิฉะนั้น [ROOT.Char.GetFaith.HighGodNameSheHe|U] ย่อมสนับสนุนสิทธิ์ของข้าในอังกฤษอย่างแน่นอน! บุกไป ทหารของข้า บุกไปและนำมงกุฎของข้ามา! จงสู้สุดกำลัง หาไม่แล้ว—"
 game_rule.1101.desc.combat.locale.lands_end: "พื้นที่รกทึบเต็มไปด้วยหินและหน้าผาสั้นๆ หยักๆ ที่นี่นำไปสู่มหาสมุทรที่หนาวเย็น และภูมิประเทศที่ขรุขระ ทำให้การรบโกลาหลอย่างยิ่ง เป็นการปะทะกันของกลุ่มเล็กๆ มากกว่าแนวรบที่เป็นหนึ่งเดียว\n\nถึงกระนั้น ธงของข้าก็นำกองทหารมาหาข้า และข้าพยายามอย่างสุดความสามารถที่จะบุกเข้าไปในการตะลุมบอน รวมพลมาหาข้า! #EMP รวมพล#! เสียงร้องของข้าดังก้องไปตามแนวรบ ก้องไปเรื่อยๆ จนกระทั่ง—"
 game_rule.1101.desc.combat.locale.stonehenge: "ตามทฤษฎีแล้ว ที่ราบกว้างใหญ่เหล่านี้เป็นสถานที่ที่เหมาะอย่างยิ่งสำหรับการทำสงคราม มีพื้นที่มากมายให้กองทัพปะทะกัน แต่ ทว่า... มีบางอย่างที่ #EMP น่าขนลุก#! เกี่ยวกับสถานที่แห่งนี้ บางอย่างที่ไม่ค่อยถูกต้องนัก\n\nเราสู้ เราตาย และเราตะโกนก้องความโกรธแค้นของเราขึ้นสู่สรวงสวรรค์ แต่บางอย่างในอากาศดูเหมือนจะดูดซับความมุ่งร้ายของเราได้เร็วเท่าที่มันเกิดขึ้น ถึงกระนั้น ข้าก็ไม่อาจช้าลงได้ ข้าต้องนำ ข้าต้อง—"
 game_rule.1101.desc.combat.locale.southwark: "ด้วยเมืองที่ร่ำรวยที่สุดของอังกฤษอยู่ใกล้เพียงนี้ มีทุกสิ่งให้ต่อสู้เพื่อ ไม่ว่าจะเป็นบ้านหรือของปล้น ชัยชนะหรือความศรัทธา กองทัพทั้งสองฝ่ายปะทะกันครั้งแล้วครั้งเล่า\n\nชายฝั่งทางใต้ของแม่น้ำเทมส์เดือดพล่านด้วยเลือดของเรา แต่ข้าจะไม่ยอมแพ้ ข้าจะ #EMP ไม่#! ยอมอ่อนข้อ\n\nอังกฤษเป็นของข้าแล้ว การรบครั้งนี้จะพิสูจน์ เช่นนั้น และทั้งหมดที่ต้องทำคือการ #EMP ผลักดัน#! ครั้งสุดท้ายเพื่อพิสูจน์ว่า—"
 game_rule.1101.desc.combat.locale.riverside: "ด้วยพื้นที่ที่แทบจะไม่พอให้ทหารหกนายยืนเรียงกันได้ การรบจึงไม่ใช่เรื่องของกลยุทธ์ที่ชำนาญ แต่เป็นการบั่นทอนกำลังอย่างโหดเหี้ยม แรงกดดันจากร่างทั้งหลายทั้งช่วยและขัดขวางความพยายามที่จะลากผู้บาดเจ็บกลับจากแนวหน้า\n\nถึงกระนั้น หากเราสามารถทะลวงแนวรบได้ เพียงแค่ ทำให้กองกำลังของพวกเขากระจัดกระจาย เราก็จะทำสำเร็จ! โยนความระมัดระวังทิ้งไป ข้าต่อสู้ฝ่าฟันไปแนวหน้าสุด ดาบพร้อม และ—"
 game_rule.1101.desc.combat.random.present.1: "กองทัพของเราพุ่งเข้าใส่กัน และโลกทั้งใบก็ลดเหลือเพียงเสียงโล่แตก เสียงโลหะเสียดสี และการตายของคนและม้า\n\nสงครามอาจโหดร้าย แต่นี่ไม่ใช่สงคราม แต่เป็นการสังหารหมู่ ทหารผ่านศึกและทหารรับจ้างทั้งสองฝ่ายสังหารทหารเกณฑ์ใหม่ที่กรีดร้องด้วยความโหดเหี้ยม\n\nด้วยไม่เต็มใจที่จะปล่อยให้ฝันร้ายนี้ดำเนินต่อไป ข้าจึงบุกไปข้างหน้า โดยมีองครักษ์คอยคุ้มกันอย่างใกล้ชิด และ—"
 game_rule.1101.desc.combat.random.present.2: "กองกำลังทั้งสองของเราปะทะและหมุนวนรอบกัน ทั้งสองฝ่ายมองหาจุดอ่อน เราปะทะกันเล็กน้อย จากนั้นเราก็ถอย เพียง เพื่อที่จะพุ่งเข้าใส่กันอีกครั้งตามแนวรบ\n\nความสูญเสียยังน้อยในขณะนี้ แต่มีบรรยากาศที่หนักอึ้ง เราทุกคนรู้ว่าการร่ายรำนี้ไม่สามารถดำเนินต่อไปได้ตลอดไป การรบที่แท้จริงจะต้องเริ่มขึ้นในไม่ช้า\n\nควบคุมสนามรบดีกว่ายอมจำนน ชูง้าวขึ้นสูงและกรีดร้องถึง [ROOT.Char.GetFaith.WarGodName] ข้าพุ่งไปข้างหน้า กองทัพทั้งหมดของ [ROOT.Char.GetPrimaryTitle.GetDefinitiveName] อยู่ข้างหลังข้า และ—"
 game_rule.1101.desc.combat.random.present.3: "แสงของวันกำลังจะดับลงแล้ว สูญเสียไปกับการสังหารกันเองชั่วโมงแล้วชั่วโมงเล่า แขนที่ถือดาบเริ่มหนักด้วยความเหนื่อยล้า จิตใจมัวหมองจากความอ่อนเพลีย และเมื่อดวงอาทิตย์เริ่มลับขอบฟ้า การรบก็เสี่ยงที่จะจบลงด้วยการเสมอกัน\n\nไม่\n\nข้าจะไม่อนุญาตให้เป็น เช่นนั้น สิ่งนี้จะจบลง ที่นี่ เดี๋ยวนี้ ด้วยชัยชนะของข้า และข้าจะเห็นมันสำเร็จ หรือขอให้ [ROOT.Char.GetFaith.HighGodName] [ROOT.Char.GetFaith.HighGodHerselfHimself|U] สังหารข้า #EMP ซะ—#!"

 game_rule.1101.desc.combat.random.absent.1: "เกือบทั้งวัน กองทัพของเราพุ่งเข้าใส่กัน ตอนแรกตายไปหลายสิบ จากนั้นหลายร้อย จำนวนผู้เสียชีวิตค่อยๆ เพิ่มสูงขึ้นเรื่อยๆ ทุกชั่วโมงที่ผ่านไป ขณะที่ทหารสละชีวิตเพื่ออุดมการณ์ของข้า\n\nแน่นอน แน่นอนว่ามันจะคุ้มค่า แน่นอนว่าความตายมากมายขนาดนี้ต้องมีผลตอบแทนบางอย่าง ชดเชยสำหรับชีวิตที่ถูกส่งลงไปสู่อ้อมกอดอันหนาวเย็นของ [ROOT.Char.GetFaith.DeathDeityNamePossessive] พร้อมเสียงกรีดร้อง"
 game_rule.1101.desc.combat.random.absent.2: "ความขัดแย้งนั้นโหดร้าย เสียงโล่แตกและเสียงกรีดร้องของผู้กำลังจะตายดังก้องไปทั่ว ความเป็นระเบียบทั้งหมดหายไปภายใต้ความโกลาหลของการบุกที่ล้มเหลวหลายครั้งและแนวรบที่พันกันยุ่งเหยิง\n\nถึงกระนั้น กองทหารก็ยังคงสู้ต่อไป สู้เพื่อ [ROOT.Char.GetTitleAsNameNoTooltip] ของพวกเขา สู้ เพื่อให้แน่ใจว่าสิทธิ์และเอกสิทธิ์โดยกำเนิดของ [ROOT.Char.GetHerHis] จะไม่ถูกเหยียบย่ำ แม้ว่าจะต้องแลกด้วยชีวิตก็ตาม"
 game_rule.1101.desc.combat.random.absent.3: "ชีวิตถูกพรากไปนับร้อย ล้มลงเหมือนข้าวสาลีต่อหน้าเคียว เส้นด้ายชีวิตมากมายถูกตัดขาดภายใต้สีหน้าบูดบึ้งของนักฆ่ารับจ้างที่กำลังทำงานนองเลือดของตน\n\nการเสียสละของพวกเขาจะ #EMP คุ้มค่า#! อย่างแน่นอน เป็นเงื่อนไขที่จำเป็นสำหรับความรุ่งโรจน์ที่กำลังจะมาถึงของข้า แต่ละคนคือหินปูทางสู่โชคชะตา วางลงเพื่อเป้าหมายเดียว"

 game_rule.1101.desc.outro.present: "ความคิดหายไปเมื่อโลกกลายเป็นภาพเบลอของการฟันและสับ ทหารประจำบ้านของข้าอัดแน่นรอบตัวข้าขณะที่เราทำลายกองทัพของ [loser.GetTitledFirstNamePossessive] ภายใต้ดาบของข้า ศัตรูแตกพ่าย"
 game_rule.1101.desc.outro.absent: "ในที่สุด แนวรบของศัตรูก็แตกสลายและกองกำลังของ [loser.GetHerHis] ก็แตกพ่าย: วันนี้เป็นของ [winner.GetTitledFirstNameNicknamedNoTooltip]!"
 game_rule.1101.a: "อังกฤษจะไม่เห็นการปกครองของไวกิ้งอีกต่อไป!"
 
 game_rule.1102.desc.outro.alive: "แต่ในที่สุด ทุกอย่างก็ไร้ผล กองกำลังของข้าแตกพ่าย ศัตรูทะลวงเข้ามาในช่องว่าง และด้วยการทำลายล้างของพวกเขา ความทะเยอทะยานของข้าก็ถูกบดขยี้โดยสิ้นเชิง"
 game_rule.1102.desc.outro.dead: "ความเจ็บปวดพลุ่งพล่านในอก ข้า แต่... ไม่ ไม่ #BER ไม่#! ผู้ใดกัน... มา แต่ที่ใด... โลกรอบตัวโคลงเคลงขณะข้าทรุดลงกับพื้น โลหิตผลิบานจากบาดแผล ความตายค่อยๆ พรากข้าไป"
 game_rule.1102.a: "เกิดเรื่อง เช่นนี้ได้อย่างไร!?"
 game_rule.1102.b: "ข้า... #DIE1 พ่าย#! #DIE2 แพ้แล้ว...#!"
 
