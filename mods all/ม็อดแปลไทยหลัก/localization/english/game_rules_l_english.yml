 setting_historicity_extra_admin_player_wherever_alt_historic_with_august_trait_desc: "ผู้เล่นที่มี [trait|E] [GetTrait('august').GetName( GetNullCharacter )] และเริ่มต้นด้วย [realm|E] อย่างน้อยระดับ [kingdom|E]-[title_tier|E] จะเปลี่ยนเป็น [government|E] แบบ [administrative|E] โดยอัตโนมัติเมื่อเริ่มเกม (มีเจตนาสำหรับ $game_concept_governments$ ที่ไม่พร้อมกันในโหมดผู้เล่นหลายคน)"

