 setting_historicity_norman_conquest_determined_harald_desc: "การพิชิตจะถูกบังคับให้ได้รับชัยชนะโดย ฮารัลดร์ อิงลิง กษัตริย์ไวกิ้งองค์สุดท้ายที่พยายามอ้างสิทธิ์ในอังกฤษด้วยกำลัง"
 setting_historicity_norman_conquest_determined_william: "#high วิลเลียมแห่งนอร์ม็องดี#!"
 setting_historicity_norman_conquest_determined_william_desc: "การพิชิตจะถูกบังคับให้ได้รับชัยชนะโดย วิลเลียมแห่งนอร์ม็องดี ผู้ที่อาจเป็นผู้ชิงบัลลังก์ ซึ่งการอ้างสิทธิ์ส่วนหนึ่งมาจากคำสัญญาที่ถูกขู่เข็ญ"
