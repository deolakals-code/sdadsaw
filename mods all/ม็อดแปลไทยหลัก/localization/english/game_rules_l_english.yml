 setting_historicity_norman_conquest_determined_edgar_desc: "การพิชิตจะสิ้นสุดลงด้วยการตายของผู้รุกรานและการเลือกตั้ง เอียดการ์ ดิแอเทลิง หลานปู่และทายาทผู้ถูกเลือกของกษัตริย์องค์สุดท้าย"
 setting_historicity_norman_conquest_determined_margaret: "#high มาร์กาเร็ตแห่งเวสเซกซ์#!"
 setting_historicity_norman_conquest_determined_margaret_desc: "การพิชิตจะสิ้นสุดลงด้วยการตายของผู้รุกรานและการเลือกตั้งอันน่าตกตะลึงของ มาร์กาเร็ตแห่งเวสเซกซ์ หลานสาวของกษัตริย์องค์สุดท้าย"
 setting_historicity_norman_conquest_determined_aelfwine: "#high เอลฟ์ไวน์ คนึทลิง#!"
 setting_historicity_norman_conquest_determined_aelfwine_desc: "การพิชิตจะสิ้นสุดลงด้วยการตายของผู้รุกรานและการเลือกตั้งอันน่าตกตะลึงของ เอลฟ์ไวน์ ฮารัลด์สัน หลานชายของพระเจ้าคนุตมหาราช — แม้ว่าเขาจะไม่สนใจโดยสิ้นเชิงก็ตาม"
 setting_historicity_norman_conquest_determined_svend: "#high สเวนแห่งเดนมาร์ก#!"
 setting_historicity_norman_conquest_determined_svend_desc: "การพิชิตจะสิ้นสุดลงด้วยการตายของผู้รุกรานและการเลือกตั้งอันน่าตกตะลึงของ พระเจ้าสเวนแห่งเดนมาร์ก ซึ่งราชวงศ์ของพระองค์เคยดำรงตำแหน่งกษัตริย์อยู่บ่อยครั้ง"
 setting_historicity_norman_conquest_determined_cadoc: "#high คาด็อกแห่งคอร์นวอลล์#!"
 setting_historicity_norman_conquest_determined_cadoc_desc: "การพิชิตจะสิ้นสุดลงด้วยการตายของผู้รุกรานและการเลือกตั้งอันน่าตกตะลึงของ เอิร์ลคาด็อกแห่งคอร์นวอลล์ ซึ่งราชวงศ์ของเขามีประวัติการปกครองอย่างต่อเนื่องในหมู่เกาะบริเตนมาเกือบพันปี"

