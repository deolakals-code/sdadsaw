 setting_faster_culture_conversion_speed_desc:0 "ความเร็วเพิ่มขึ้น ทำให้การเปลี่ยนใช้เวลาประมาณครึ่งหนึ่ง"
 setting_significantly_faster_culture_conversion_speed:0 "#high เร็วขึ้นอย่างมีนัยสำคัญ#!"
 setting_significantly_faster_culture_conversion_speed_desc:0 "ความเร็วเพิ่มขึ้นอย่างมีนัยสำคัญ ทำให้การเปลี่ยนใช้เวลาประมาณหนึ่งในสี่"
 setting_significantly_slower_culture_conversion_speed:1 "#high ช้าลงอย่างมีนัยสำคัญ#!"
 setting_significantly_slower_culture_conversion_speed_desc:0 "ความเร็วลดลงอย่างมีนัยสำคัญ ทำให้การเปลี่ยนใช้เวลานานขึ้นประมาณสี่เท่า"
