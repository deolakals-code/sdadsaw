 setting_title_creation_imperial_power_projection_hard_power_only_strict_desc: "การสถาปนา [empire|E] จำต้องมีกองกำลังมากกว่า 50% เมื่อเทียบกับ #BER ทุก#! [realm|E] ระดับ $game_concept_empire$-[title_tier|E] ที่มีพรมแดนติดกับ [character|E] หรือแบ่งปัน [de_jure|E] ใดๆ ร่วมกัน"
