 setting_sexuality_distribution_equal:1 "#high เท่าเทียม#!"
 setting_sexuality_distribution_equal_desc:0 "รสนิยมทางเพศทั้งหมดในเกมพบได้บ่อยเท่ากัน"
 setting_sexuality_distribution_most_common_homosexuality:1 "#high รักร่วมเพศ#!"
 setting_sexuality_distribution_most_common_homosexuality_desc:0 "การรักร่วมเพศเป็นรสนิยมทางเพศที่พบบ่อยที่สุด ในขณะที่การรักต่างเพศ, การรักสองเพศ และการไม่ฝักใจทางเพศพบน้อยกว่า"
 setting_sexuality_distribution_most_common_bisexuality:1 "#high รักสองเพศ#!"
 setting_sexuality_distribution_most_common_bisexuality_desc:0 "การรักสองเพศเป็นรสนิยมทางเพศที่พบบ่อยที่สุด ในขณะที่การรักต่างเพศ, การรักร่วมเพศ และการไม่ฝักใจทางเพศพบน้อยกว่า"
 setting_sexuality_distribution_most_common_asexuality:1 "#high ไม่ฝักใจทางเพศ#!"
 setting_sexuality_distribution_most_common_asexuality_desc:0 "การไม่ฝักใจทางเพศเป็นรสนิยมทางเพศที่พบบ่อยที่สุด ในขณะที่การรักต่างเพศ, การรักร่วมเพศ และการรักสองเพศพบน้อยกว่า"

