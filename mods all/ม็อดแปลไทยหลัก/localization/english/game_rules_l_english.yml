 game_rule.1101.desc.stamford_bridge: "ที่สแตมฟอร์ดบริดจ์ ช่องทางหินแคบๆ ที่กว้างพอให้คนข้ามได้ทีละคนเท่านั้น,"
 game_rule.1101.desc.hastings: "ที่เนินเขาใกล้เมืองเฮสติงส์,"
 game_rule.1101.desc.dover: "บนยอดผาขาวแห่งโดเวอร์นั่นเอง,"
 game_rule.1101.desc.isle_of_wight: "ตามชายฝั่งแม่น้ำเมดินาบนเกาะไวท์อันโดดเดี่ยว,"
 game_rule.1101.desc.forest_of_dean: "ในป่าไม้อันมืดครึ้มแห่งป่าดีน,"
 game_rule.1101.desc.london: "นอกกำแพงเมืองลอนดอนนั่นเอง,"
 # And by Saxon, we mean Wessex: the only Saxons that count.
 ## Everyone else sucks.
 ### Someone had to say it & I'm not sorry that it was me.
 game_rule.1101.desc.winchester: "ใกล้กับเมืองหลวงเก่าของแซกซอนแห่งวินเชสเตอร์,"
 game_rule.1101.desc.york: "ใกล้ยอร์ก เมืองป้อมปราการโรมันแห่งเอโบรารัม,"
 game_rule.1101.desc.lincoln: "ใกล้เมืองโบราณแห่งลินคอล์น,"
 # Non-zero chance that there was _some_ kind of teaching tradition here by 1066, but it definitely wasn't anything like the university it came to be.
 game_rule.1101.desc.oxford: "ใกล้เมืองออกซฟอร์ดอันไม่โดดเด่น,"
 game_rule.1101.desc.cirencester: "รอบกำแพงเมืองเก่าไซเรนเซสเตอร์,"
 game_rule.1101.desc.guildford: "ตามสันเขาฮอกส์แบ็กนอกเมืองกิลด์ฟอร์ด,"
 game_rule.1101.desc.lindisfarne: "ข้ามฝั่งจากอารามบนเกาะลินดิสฟาร์น หนึ่งในสถานที่ศักดิ์สิทธิ์ที่สุดของบริเตน,"
 game_rule.1101.desc.lands_end: "ที่ตีนเขาแลนด์สเอนด์ เกือบจะถึงความกว้างใหญ่ไพศาลของมหาสมุทรแอตแลนติก,"
 game_rule.1101.desc.stonehenge: "ข้ามที่ราบซอลส์บรีอันกว้างใหญ่ภายใต้เงาของสโตนเฮนจ์,"
 # Destroyed in ~1014, rebuilt post-Conquest.
 game_rule.1101.desc.southwark: "ใกล้ซากสะพานลอนดอนและทางข้ามจากเซาธ์วาร์ก,"
 game_rule.1101.desc.scotland: "ในดินแดนอันไม่เป็นมิตรของสกอตแลนด์เพื่อนบ้าน,"
 game_rule.1101.desc.wales: "ในหุบเขาและเนินเขาแห่งเวลส์,"
 game_rule.1101.desc.norway: "ในนอร์เวย์นั่นเอง,"
 game_rule.1101.desc.normandy: "ในนอร์ม็องดีนั่นเอง,"
 game_rule.1101.desc.france: "บนแผ่นดินฝรั่งเศส,"
 game_rule.1101.desc.riverside: "ข้ามสะพานหินแคบๆ ที่ทอดข้ามแม่น้ำใน [new_location.GetName],"
 game_rule.1101.desc.coastal: "ตามแนวชายฝั่งของ [new_location.GetName],"
