 setting_historicity_extra_admin_player_wherever_alt_historic_always_desc: "ผู้เล่นที่เริ่มต้นด้วย [realm|E] อย่างน้อยระดับ [kingdom|E]-[title_tier|E] จะเปลี่ยนเป็น [government|E] แบบ [administrative|E] โดยอัตโนมัติเมื่อเริ่มเกม"
