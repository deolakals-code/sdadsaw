 setting_historicity_norman_conquest_default_random_desc: "ผลลัพธ์ของการพิชิตจะถูกตัดสินโดยกลไกของเกมล้วนๆ"
 setting_historicity_norman_conquest_determined_harold: "#high แฮโรลด์ ก็อดวิน แห่งอังกฤษ#!"
 setting_historicity_norman_conquest_determined_harold_desc: "การพิชิตจะถูกบังคับให้ได้รับชัยชนะโดย แฮโรลด์ ก็อดวิน ขุนศึกผู้กระหายอำนาจ ซึ่งประทับอยู่บนราชบัลลังก์อังกฤษ"
