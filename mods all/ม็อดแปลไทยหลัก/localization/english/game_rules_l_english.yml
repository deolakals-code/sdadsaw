 setting_historicity_frankokratia_fourth_crusade_desc: "จากจุดเริ่มต้นก่อนหน้านี้ ต้องมี [crusades|E] คาทอลิกอย่างน้อย 3 ครั้งเกิดขึ้นก่อนสงครามครูเสดที่แตกแยก จากปี 1178 ชาวคาทอลิกอาจโจมตีไบแซนไทน์ได้ก็ต่อเมื่อ #EMP หลัง#! จาก [crusade|E] 1 ครั้งเท่านั้น"

