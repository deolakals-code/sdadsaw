 setting_historicity_extra_admin_player_wherever_gameplay_not_administrative_desc: "ผู้เล่นจะเป็นแบบ [administrative|E] ก็ต่อเมื่อพวกเขาเลือก [realm|E] ที่มี [government|E] ที่เหมาะสมอยู่แล้วเท่านั้น"
