 rule_gender_equality:0 "ความเท่าเทียมทางเพศ"
 setting_default_gender_equality:0 "ค่าเริ่มต้น"
 setting_default_gender_equality_desc:0 "กฎเกี่ยวกับเพศกำหนดโดยกฎหมายเกี่ยวกับเพศและหลักคำสอนของศรัทธา"
 setting_full_gender_equality:1 "#high เท่าเทียม#!"
 setting_full_gender_equality_desc:0 "หลักคำสอนและกฎหมายที่เกี่ยวข้องกับเพศทั้งหมดถูกตั้งค่าเป็นเท่าเทียม กฎและสิทธิ์เดียวกันใช้กับตัวละครทั้งหมด โดยไม่คำนึงถึงเพศ"
 setting_inversed_gender_equality:1 "#high กลับด้าน#!"
 setting_inversed_gender_equality_desc:0 "หลักคำสอนและกฎหมายที่เกี่ยวข้องกับเพศทั้งหมดถูกกลับด้าน กฎและสิทธิ์ ซึ่งใช้กับผู้ชายภายใต้ "ค่าเริ่มต้น" ตอนนี้ใช้กับผู้หญิง และในทางกลับกัน"
 setting_lenient_gender_equality: "#high ผ่อนปรน#!"
 setting_lenient_gender_equality_desc: "กฎหมายดินแดนและบรรดาศักดิ์ ซึ่งถูกกำหนดเป็น ชายเท่านั้น จะถูกเปลี่ยนเป็น สิทธิ์บุรุษ"

 rule_sexuality_distribution:0 "การกระจายตัวของรสนิยมทางเพศ"
