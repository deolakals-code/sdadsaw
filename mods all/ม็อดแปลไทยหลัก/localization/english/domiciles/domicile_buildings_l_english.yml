 camp_perimeter_fixed_layout_domicile_building_desc: "#weak (ต้องการ [GetDomicileBuilding('camp_perimeter_01').GetName])#!\nผังที่คงที่และไม่เปลี่ยนแปลงสำหรับสิ่งที่ไปที่ไหนในค่ายพักสร้างลักษณะนิสัยและความรู้สึกถึงสถานที่โดยไม่คำนึงถึงตำแหน่ง"
 camp_perimeter_extra_watch_domicile_building: "เวรยามพิเศษ"
 camp_perimeter_extra_watch_domicile_building_desc: "#weak (ต้องการ [GetDomicileBuilding('camp_perimeter_01').GetName])#!\nในสภาพอากาศแปลกประหลาดห่างไกลจากบ้าน เราได้รับการเตือนมากที่สุดว่าเราเปราะบางเพียงใด — และสิ่งที่เราสามารถทำได้ดีที่สุดเกี่ยวกับเรื่องนี้"
 camp_perimeter_palisade_domicile_building: "ผู้สร้างรั้วไม้"
 camp_perimeter_palisade_domicile_building_desc: "#weak (ต้องการ [GetDomicileBuilding('camp_perimeter_01').GetName])#!\nการคิดเกี่ยวกับการป้องกันเป็นเรื่องง่ายที่สุดเมื่อท่าน ทำให้มันเป็นนิสัยจนท่านทำไปโดยไม่คิด"
 camp_perimeter_ditch_domicile_building: "การขุดคู"
 camp_perimeter_ditch_domicile_building_desc: "#weak (ต้องการ [GetDomicileBuilding('camp_perimeter_01').GetName])#!\n#EMP ไม่มีอะไร#! ควบคุมทหารได้ดีเท่ากับการบังคับให้พวกเขาขุดคันดินวันละครั้ง ทุกวัน ในตอนท้ายของวัน ตลอดไป"
 camp_perimeter_camp_hygiene_domicile_building: "สุขอนามัยในค่าย"
