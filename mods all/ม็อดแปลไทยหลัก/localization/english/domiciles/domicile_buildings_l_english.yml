 camp_fire_trailing_musicians_domicile_building_desc: "#weak (ต้องการ [GetDomicileBuilding('camp_fire_01').GetName])#!\nน่าประหลาดใจที่การฟังคนที่สามารถ #EMP เล่น#! ได้จริงนั้นสร้างแรงบันดาลใจได้มากกว่าคนที่เล่นไม่ได้อย่างแน่นอน"
