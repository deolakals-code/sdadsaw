 SUCCESSION_LAW_CHANGE_WINDOW_POWERFUL_APPROVE_TT:1 "#T อนุมัติการเปลี่ยนกฎหมายสืบทอดตำแหน่ง#!\n[Character.GetShortUIName] สนับสนุน หรืออย่างน้อยก็ไม่สามารถคัดค้าน การเปลี่ยนแปลง[succession_law|E]ใดๆ ได้\n\n[Character.GetSheHe|U] อนุมัติ เนื่องจาก:\n$BULLET_WITH_TAB$มี[opinion|E]เชิงบวกต่อท่าน\n$BULLET_WITH_TAB$ถูกท่าน[cowed|E]\n$BULLET_WITH_TAB$ถูก[imprisoned|E] (โดยผู้ใดก็ตาม)"
 SUCCESSION_LAW_CHANGE_WINDOW_POWERFUL_OPPOSE_TT:2 "#T คัดค้านการเปลี่ยนกฎหมายสืบทอดตำแหน่ง#!\n[Character.GetShortUIName] จะขัดขวางการเปลี่ยนแปลง[succession_law|E]ใดๆ\n\nเพื่อให้การอนุมัติ [Character.GetShortUIName] ต้อง:\n$BULLET_WITH_TAB$มี[opinion|E]เชิงบวกต่อท่าน\n$BULLET_WITH_TAB$ถูกท่าน[cowed|E]\n$BULLET_WITH_TAB$ถูก[imprisoned|E] (โดยผู้ใดก็ตาม)"
 
 SUCCESSION_LAW_CHANGE_WINDOW_CLAN_TITLE: "การเปลี่ยน[succession_laws|E]ของตระกูล"
 SUCCESSION_LAW_CHANGE_WINDOW_CLAN_DESC: "ใน[government|E]แบบ[GetGovernment('clan_government').GetName] [succession_laws|E]จะถูกกำหนดโดยคะแนน[house_unity|E]ปัจจุบัน แต่ละ[house_unity_level|E]จะเปิดใช้งาน[succession_law|E]ที่สอดคล้องกัน เว้น แต่ผู้ปกครองจะใช้กฎหมายแบบ$SUCCESSION_LAW_CHANGE_WINDOW_SINGLE_HEIR_LAWS$ เช่น $single_heir_succession_law$"
 SUCCESSION_LAW_CHANGE_WINDOW_CLAN_CHANGE_LAW_BUTTON_TOOLTIP: "ท่านเป็น[clan|E]และไม่สามารถเปลี่ยน[succession_laws|E]ด้วยวิธีนี้ได้ [succession_laws|E]ของ[clan|E]ถูกกำหนดโดย[house_unity_level|E]ของพวกเขา"

