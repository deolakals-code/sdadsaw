 COURT_TYPE_EFFECT_LEVEL:0 "#BOLD ระดับ $LEVEL$:#!"
 COURT_TYPE_EFFECT_TIME:0 "#S หลังจาก $MONTHS$ เดือน:#!"

 court_diplomatic:0 "ราชสำนักเน้นการทูต"
 court_diplomatic_desc:1 "#low การทูตคือกุญแจสำคัญในการได้รับความเคารพจากผู้เท่าเทียมและรักษาความสงบในอาณาจักร เจ้าประเทศราชที่พอใจคือเจ้าประเทศราชที่ภักดี \n\nข้าราชสำนักได้รับลักษณะ [GetTrait('diplomatic_court_1').GetName( GetNullCharacter )]#!"
 court_diplomatic_tooltip_desc:0 "ใน $court_diplomatic$ นั้นให้ความสำคัญอย่างมากกับความสัมพันธ์และการแก้ไขข้อขัดแย้งอย่างสันติ"
 court_warlike:0 "ราชสำนักเน้นการสงคราม"
 court_warlike_desc:1 "#low การแสดงแสนยานุภาพเป็นหนทางเดียวที่จะบัญชาความเกรงขามและความเคารพ! อัศวินและทหารของเรามีชื่อเสียงในด้านความเก่งกาจ \n\nข้าราชสำนักได้รับลักษณะ [GetTrait('warlike_court_1').GetName( GetNullCharacter )]#!"
 court_warlike_tooltip_desc:0 "ใน $court_warlike$ ร่างกายที่แข็งแรงและจิตใจเชิงกลยุทธ์มีค่าอย่างสูง"
 court_administrative:0 "ราชสำนักเน้นการบริหาร"
 court_administrative_desc:1 "#low เพียงราชสำนักที่มีประสิทธิภาพและได้รับการดูแลอย่างดีเท่านั้นที่จะทำให้อาณาจักรของเราเจริญรุ่งเรือง \n\nข้าราชสำนักได้รับลักษณะ [GetTrait('administrative_court_1').GetName( GetNullCharacter )]#!"
 court_administrative_tooltip_desc:0 "$court_administrative$ คือราชสำนักที่มุ่งเน้นการพัฒนาอาณาจักร"
 court_intrigue:0 "ราชสำนักเน้นกลอุบาย"
 court_intrigue_desc:1 "#low การปล่อยให้ผู้คนในราชสำนักโดยไม่ตรวจสอบนั้นอันตราย และเราต้องแน่ใจว่าไม่มีใครสามารถทำสิ่งไม่ดีได้โดยที่เราไม่รู้ \n\nข้าราชสำนักได้รับลักษณะ [GetTrait('intrigue_court_1').GetName( GetNullCharacter )]#!"
 court_intrigue_tooltip_desc:0 "ใน $court_intrigue$ ท่านต้องระวังหลัง ความลับอาจอันตรายพอๆ กับมีดในยามค่ำคืน และในราชสำนักนี้มีทั้งสองอย่างมากมาย"
 court_scholarly:0 "ราชสำนักเน้นวิชาการ"
 court_scholarly_desc:1 "#low ราชสำนักคือการดึงดูดผู้มีจิตใจที่ได้รับการขัดเกลาและผู้มีทักษะพิเศษ \n\nข้าราชสำนักได้รับลักษณะ [GetTrait('scholarly_court_1').GetName( GetNullCharacter )]#!"
 court_scholarly_tooltip_desc:0 "ความรู้และการศึกษาอย่างขยันหมั่นเพียรมีค่าใน $court_scholarly$"
 court_tribal:0 "ราชสำนักชนเผ่า"
 court_tribal_desc:0 "#low ในราชสำนัก พลังคือความถูกต้อง – และห้องโถงจะประดับประดาไปด้วยของริบและของปล้น! \n\nข้าราชสำนักได้รับลักษณะ [GetTrait('warlike_court_1').GetName( GetNullCharacter )]#!"
 court_tribal_tooltip_desc:0 "ความเก่งกาจทางการทหารและความทรหดมีค่าใน $court_tribal$"
 court_nomadic: "ค่ายหลวงเรร่อน"
 court_nomadic_desc: "#low ค่ายหลวงของเหล่าข้า เคลื่อนขบวนด้วยเดชแห่งกีบอาชานับพัน ณ ที่ซึ่งคันธนูและคมดาบครองความเป็นใหญ่ เกียรติยศจักได้มาด้วยการพิชิตชัย และหมู่ชนของข้าเติบใหญ่ด้วยสมบัติเชลย \n\nเหล่าขุนนางในราชสำนักจักได้รับลักษณะนิสัย [GetTrait('warlike_court_1').GetName( GetNullCharacter )]#!"
 court_nomadic_tooltip_desc:0 "ความเก่งกาจทางการรบและความทรหดอดทนเป็นสิ่งล้ำค่าใน $court_nomadic$"

 COURT_TYPE_GENERAL_TOOLTIP:0 "[CourtType.GetTooltipDesc]\n\n[CourtType.GetEffectDesc]"
 
