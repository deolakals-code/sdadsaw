 CHANGE_COURT_TYPE_ACCEPT_NO_SELECTION:0 "เลือกประเภทราชสำนัก"
 CHANGE_COURT_TYPE_HEADER:0 "เปลี่ยนประเภทราชสำนัก"
 CHANGE_COURT_TYPE_WARNING:0 "ท่านไม่สามารถเปลี่ยนกลับเป็นประเภทราชสำนักปัจจุบันของท่านได้เมื่อท่านปรับใช้ประเภทใหม่แล้ว เนื่องจากวัฒนธรรมของท่านไม่มี [ethos|e] ที่จำเป็นสำหรับ [CourtTypeSettingItem.GetName]"
