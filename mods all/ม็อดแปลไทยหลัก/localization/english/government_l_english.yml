 coinage_rights_granted:0 "ได้รับ $coinage_rights$"
 coinage_rights_granted_desc:0 "#flavor [vassal] ได้รับสิทธิ์ในการผลิตและใช้เหรียญใหม่ ซึ่งช่วยเสริมสร้าง [development|E] ของตน โดยเป็นค่าใช้จ่ายของ [liege] ของตน#!"
 coinage_rights_granted_short:0 "ได้รับสิทธิ์"
 
 war_declaration_rights:0 "การประกาศสงคราม"
 war_declaration_rights_default:0 "$war_declaration_rights$ ปกติ"
 war_declaration_rights_default_short:0 "ปกติ"
 war_declaration_rights_allowed:0 "$war_declaration_rights$ ที่ได้รับอนุมัติ"
 war_declaration_rights_allowed_desc:1 "#emphasis #bold สิทธิพิเศษของ[vassal|E]:#!#!\n$EFFECT_LIST_BULLET$ [vassal|E] สามารถประกาศ [war|E] ได้ โดยมิต้องคำนึงถึง [crown_authority|E] ของ [liege|E]\n$EFFECT_LIST_BULLET$ [vassal|E] จ่ายน้อยลง #high [EmptyScope.ScriptValue('war_declaration_rights_allowed_cost_reduction_tooltip')|0]%#! สำหรับ [casus_bellis|E] ภายใน [realm|E]\n\n#flavor [vassal] มิจำเป็นต้องใช้ [hook] หาก [crown_authority] ของ [lieges] ขัดขวางมิให้พวกเขาก่อสงคราม การปฏิบัติเป็นพิเศษนี้ยังทำให้ [vassal] ประกาศสงครามภายใน [realm|E] ได้ง่ายขึ้น โดยลดต้นทุนลง #high [EmptyScope.ScriptValue('war_declaration_rights_allowed_cost_reduction_tooltip')|0]%#!.#!"
 war_declaration_rights_allowed_short:0 "ได้รับอนุมัติ"
 
 council_rights:0 "สิทธิ์ในสภา"
 council_rights_none:0 "ไม่มี $council_rights$"
 council_rights_none_desc:0 "#flavor [vassal] ไม่ได้รับสิทธิพิเศษใดๆ นอกเหนือจากปกติเมื่อเกี่ยวกับ [council]#!"
 council_rights_none_short:0 "ไม่มี"
 council_rights_guaranteed:0 "$council_rights$ ที่รับประกัน"
 council_rights_guaranteed_desc:0 "#emphasis #bold สิทธิพิเศษของ[vassal|E]:#!#!\n$EFFECT_LIST_BULLET$ [interaction|E] #high $force_onto_council$#! สามารถใช้ได้ตามประสงค์\n\n#flavor [vassal] ได้รับสิทธิพิเศษทาง [council] และจะคาดหวังที่นั่งถาวรใน [council] การมอบสิทธิพิเศษนี้แก่ [vassals] มากเกินไป ท้ายที่สุดจะสร้างความไม่พอใจให้แก่เหล่า [powerful_vassals] ของ [realm|E]#!"
 council_rights_guaranteed_short:0 "รับประกัน"
 
