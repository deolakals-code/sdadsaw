 clan_government:0 "ระบบเครือญาติ"
 clan_government_with_icon: "@government_type_clan! $clan_government$"
 clan_government_adjective:0 "แบบเครือญาติ"
 clan_government_realm:0 "เครือญาติ"
 clan_government_desc:0 "\n$game_concept_clan_desc$\n\n#F เครือญาติรวมกันเป็นหนึ่งด้วยความเป็นญาติ — ไม่ว่าจะโดยสายเลือดหรือความสัมพันธ์ร่วมกับบรรพบุรุษเชิงสัญลักษณ์ ผู้นำเครือญาติพึ่งพาการสนับสนุนจากเครือญาติอย่างมาก หากรวมกัน พวกเขาคือพลังที่น่าเกรงขาม แต่เครือญาติที่ไม่พอใจจะร่วงโรยจากภายใน#!"
 clan_government_vassals_label:1 "[obligations|E] แบบเครือญาติขึ้นอยู่กับ [opinion|E]"
 clan_government_obligations:0 "จาก [opinion|E]"
 clan_government_tax_contribution_postfix:0 "(สูงสุด [FixedPointToProgressbarValue(EmptyScope.ScriptValue('clan_government_tax_max_possible'))|1V])"
 clan_government_levies_contribution_postfix:0 "(สูงสุด [FixedPointToProgressbarValue(EmptyScope.ScriptValue('clan_government_levies_max_possible'))|1V])"
 clan_government_unclamped_contribution_label:0 "ขึ้นอยู่กับ [opinion|E] ที่มีต่อข้า"
 clan_government_min_contribution_label:0 "ขั้นต่ำตาม [crown_authority|E]"
 clan_vassal: "ระบบเครือญาติ"
 clan_vassal_desc: "$game_concept_clan_desc$"

 republic_government:0 "ระบบสาธารณรัฐ"
 republic_government_with_icon: "@government_type_republic! $republic_government$"
 republic_government_adjective:0 "แบบสาธารณรัฐ"
 republic_government_realm:0 "สาธารณรัฐ"
 republic_government_desc:0 "\n$game_concept_republic_desc$\n\n#F เมืองต่างๆ ถูกปกครองโดยพลเมืองชนชั้นกระฎุมพีผู้มีสิทธิพิเศษ ซึ่งในหมู่พวกเขาจะถูกเลือกขึ้นมาเป็นนายกเทศมนตรี แม้ว่านายกเทศมนตรีจะมีอิทธิพลอย่างมาก แต่พวกเขาก็ต้องอาศัยความนิยมเพื่อได้รับเลือกตั้งใหม่#!"
 republic_government_vassals_label:1 "[obligations|E] แบบสาธารณรัฐเหมือนกันสำหรับ [vassals|E] ที่เป็นสาธารณรัฐทั้งหมด"
 republic_government_obligations:1 "[obligations|E] แบบสาธารณรัฐ"
 republican_vassals_pay_more_parameter:0 "จาก [culture_traditions|E] ของ [liege|E]"
