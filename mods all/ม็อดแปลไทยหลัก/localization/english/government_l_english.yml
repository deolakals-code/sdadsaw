 feudal_government_desc:1 "\n$game_concept_feudal_desc$\n\n#F ระบบศักดินาเป็นการปกครองที่โดดเด่นในยุโรประหว่างศตวรรษที่ 9 ถึง 15 ระบบศักดินานี้มีพื้นฐานอยู่บนความสัมพันธ์ระหว่างเจ้าของที่ดินและผู้ที่ให้บริการและแรงงานเพื่ออาศัยอยู่ที่นั่น ผู้ปกครองที่ถือครองที่ดินจะแต่งตั้งข้าหลวงซึ่งได้รับที่ดิน (fief) ไปปกครอง เป็นการตอบแทน ข้าหลวงจะมอบ [soldiers|E] และ [taxes|E] ให้แก่นายเหนือหัวของตน#!"
