 special_contract_castellan_short: "คาสเตลลัน"
 
 religious_rights:0 "สิทธิ์ทางศาสนา"
 religious_rights_none:0 "ไม่ได้รับการคุ้มครองทางศาสนา"
 religious_rights_none_short:0 "ไม่คุ้มครอง"
 religious_rights_protected:0 "ได้รับการคุ้มครองทางศาสนา"
 religious_rights_protected_desc:3 "#emphasis #bold สิทธิพิเศษของ[vassal|E]:#!#!\n$EFFECT_LIST_BULLET$ [liege|E] มิอาจ [demand_conversion|E] [vassal|E] ได้\n[liege|E] มิอาจใช้ [convert_county|E] ในดินแดนของเหล่า[vassals|E] ได้\n$EFFECT_LIST_BULLET$ [liege|E] มิอาจใช้ [faith|E] เป็นเหตุผลในการหลีกเลี่ยง [tyranny|E] เมื่อทำการริบตำแหน่ง\n\n#flavor [vassal|E] ได้รับสถานะคุ้มครองพิเศษ โดยอาณาจักรยอมรับสิทธิ์ในการปฏิบัติตาม [faith|E] ของตนเองอย่างเป็นทางการ#!"
 religious_rights_protected_short:0 "คุ้มครอง"
 
 fortification_rights:0 "สิทธิ์ในการสร้างป้อมปราการ"
 fortification_rights_none:0 "ไม่มี $fortification_rights$"
 fortification_rights_none_short:0 "ไม่มี"
 fortification_rights_granted:0 "ได้รับ $fortification_rights$"
 fortification_rights_granted_desc:0 "#flavor [vassal] ได้รับสิทธิ์ในการสร้างปราสาทและป้อมปราการใหม่โดยได้รับการสนับสนุนจาก [liege] ของตน ในทางปฏิบัติ การสนับสนุนนี้หมายความว่า [vassal] จ่าย [tax] น้อยลง #high [EmptyScope.ScriptValue('fortification_rights_contract_taxes_tooltip')|0]%#! กว่าที่ $feudal_government_taxes$ [obligation] กำหนด#!"
 fortification_rights_granted_short:0 "ได้รับสิทธิ์"
 
 succession_rights:0 "สิทธิ์ในการสืบทอด"
 succession_rights_default:0 "$succession_rights$ ปกติ"
 succession_rights_default_short:0 "ปกติ"
 succession_rights_forced_partition:0 "บังคับแบ่งมรดก"
 succession_rights_forced_partition_desc:0 "#emphasis #bold ข้อจำกัดของ[vassal|E]:#!#!\n$EFFECT_LIST_BULLET$ [vassal|E] มิอาจมี [succession_law|E] ใดนอกเหนือจาก Partition\n$EFFECT_LIST_BULLET$ [vassal|E] เปลี่ยน [succession_law|E] ของตนเป็น Partition\n$EFFECT_LIST_BULLET$ [vassal|E] จ่าย [prestige|E] เพิ่มขึ้น #high [EmptyScope.ScriptValue('succession_rights_contract_law_cost_tooltip')|0]%#! เพื่อเปลี่ยน [laws|E]\n\n#flavor [vassal|E] ถูกบังคับมิให้มีรูปแบบการสืบทอดอื่นใดนอกจาก Partition สำหรับ [realm|E] ของตน อุปสรรคทางการปกครองนี้ยังเพิ่มต้นทุน [law] ของ [vassals] ขึ้น #high [EmptyScope.ScriptValue('succession_rights_contract_law_cost_tooltip')|0]%#! ด้วย#!"
 succession_rights_forced_partition_short:0 "บังคับแบ่งมรดก"
 
 coinage_rights:0 "สิทธิ์ในการผลิตเหรียญ"
 coinage_rights_none:0 "ไม่มี $coinage_rights$"
