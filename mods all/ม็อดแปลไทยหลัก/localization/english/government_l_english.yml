 unity_reinforce_army_decision: "เสริมกำลังกองทัพด้วยนายทหารผู้ภักดี"
 unity_reinforce_army_decision_desc: "กองทัพจะแข็งแกร่งได้ก็ต่อเมื่อมีนายทหารผู้บัญชาการที่แข็งแกร่ง การร้องขอทหารฝีมือดีจากสมาชิกในตระกูลของข้า ทำให้ข้าได้ทหารที่มีประสบการณ์มากมาย ทหารที่ข้าสามารถเลื่อนตำแหน่งให้เป็นผู้บัญชาการในกองทัพของข้าเพื่อเสริมประสิทธิภาพของกองทหาร สมาชิกทุกคนมีส่วนร่วมในตระกูลของเราเพื่อประโยชน์ส่วนรวม และทุกคนก็ได้รับประโยชน์!"
 unity_reinforce_army_decision_tooltip: "ร้องขอสมาชิกในตระกูลของท่านให้ส่งนายทหารที่มีความสามารถมาให้"
 unity_reinforce_army_decision_confirm: "ส่งคำสั่ง"

 unity_establish_network_decision: "บังคับใช้เครือข่ายการวางอุบาย"
 unity_establish_network_decision_desc: "สมาชิกในตระกูลของข้า แต่ละคนมีเล่ห์เหลี่ยมในแบบของตนเอง ด้วยความเป็นผู้นำของข้า เราสามารถสร้างเครือข่ายการวางอุบายเพื่อจับแม้ แต่คนนอกที่เจ้าเล่ห์ที่สุดได้"
 unity_establish_network_decision_tooltip: "เกณฑ์สมาชิกในตระกูลของท่านเพื่อป้องกันและดำเนินแผนการที่เป็นปฏิปักษ์"
 unity_establish_network_decision_confirm: "ส่งและเผาประกาศิต"
 
 unity_improve_taxation_decision: "ปรับปรุงการเก็บภาษี"
 unity_improve_taxation_decision_desc: "ตระกูลของข้ามีสมาชิกจำนวนมากที่มีประสิทธิภาพในการเก็บภาษีและจัดการอาณาจักร ด้วยการแบ่งปันแนวคิดและบุคลากรที่มีความสามารถ เราทุกคนจะได้รับประโยชน์จากรายได้ที่เพิ่มขึ้น"
 unity_improve_taxation_decision_tooltip: "ทำงานร่วมกับสมาชิกในตระกูลของท่านเพื่อปรับปรุงการเก็บภาษีและรายได้ของอาณาจักร"
 unity_improve_taxation_decision_confirm: "มาจัดการประชุมกันเถอะ"
 
 unity_search_for_administrators_decision: "ค้นหานักเก็บภาษี"
 unity_search_for_administrators_decision_desc: "ภาษีคือกระดูกสันหลังของทุกอาณาจักร การใช้เวลาค้นหานักบริหารและอดีตทหารที่มีทักษะ เพื่อจ้างเป็นนักเก็บภาษี จะคุ้มค่ากับความพยายามอย่างแน่นอน"
 unity_search_for_administrators_decision_tooltip: "ค้นหานักบริหารและทหารที่มีความสามารถเพื่อเสริมกำลังพลนักเก็บภาษีของข้า"
 unity_search_for_administrators_decision_confirm: "สั่งให้ค้นหา"
 search_administors_decision.tt: "จะมี [characters|E] ที่มีทักษะหลากหลายสูงสุดสามคนเข้าร่วม [court|E] ของท่าน"
 unity_search_for_administrators_decision.msg.t: "นักบริหารมาถึงแล้ว"
 unity_search_for_administrators_decision.msg.desc: "นักบริหารคนใหม่ชื่อ [new_administrator.GetName] ได้มาถึงราชสำนักของท่านและพร้อมรับการจ้างงานแล้ว"

 unity_send_bailiffs_decision: "ส่งเจ้าพนักงาน"
 unity_send_bailiffs_decision_desc: "ข้าสามารถใช้ประโยชน์จากทัศนคติที่ให้ความร่วมมือของสมาชิกในตระกูลของข้าได้โดยการส่งเจ้าพนักงานของข้าไปหาพวกเขา เพื่อบังคับใช้คำสั่งของข้าในการรักษาความสงบเรียบร้อยทั่วทั้งอาณาจักร"
 unity_send_bailiffs_decision_tooltip: "ร่วมมือกับสมาชิกในตระกูลของท่านเพื่อเพิ่มการควบคุมทั่วทั้งอาณาจักร"
 unity_send_bailiffs_decision_confirm: "ส่งคนไปตามเจ้าพนักงาน"
 
 unity_placate_vassals_decision: "ปลอบประโลมข้าหลวง"
 unity_placate_vassals_decision_desc: "แม้ แต่ครัวเรือนที่ปรองดองก็ต้องเผชิญกับการทดลอง ด้วยการใช้อิทธิพลของข้าในฐานะประมุขตระกูล ข้าอาจคลี่คลายรอยร้าวทางสังคมเหล่านี้ก่อนที่มันจะเริ่มก่อตัวเป็นรอยแตกได้"
 unity_placate_vassals_decision_tooltip: "เตือนสมาชิกในตระกูลของท่านถึงอำนาจของท่านในฐานะนายเหนือหัว"
 unity_placate_vassals_decision_confirm: "ปลอบประโลมข้าหลวง"
 
 unity_organize_house_for_war_decision: "จัดระเบียบสมาชิกตระกูลเพื่อสงคราม"
 unity_organize_house_for_war_decision_desc: "การปรับปรุงอาณาจักรต้องอาศัยความทุ่มเท และบ่อยครั้งที่ต้องอาศัยการพิชิตอย่างมาก ด้วยการออกประกาศิตเฉพาะและชี้นำสมาชิกในตระกูลของเรา ข้าสามารถ ทำให้พวกเขามีความเต็มใจมากขึ้นที่จะทำสงครามและพิชิตดินแดนใหม่"
 unity_organize_house_for_war_decision_tooltip: "ชี้นำสมาชิกในตระกูลของท่านให้ทำสงครามบ่อยขึ้น"
 unity_organize_house_for_war_decision_confirm: "ส่งเสริมสงครามและความขัดแย้ง!"
 
 unity_encourage_house_economy_decision: "ส่งเสริมให้ตระกูลปรับปรุงเศรษฐกิจ"
 unity_encourage_house_economy_decision_desc: "อาณาจักรจะมีความสามารถได้ก็ต่อเมื่อดินแดนที่ตั้งอยู่นั้นมีความสามารถ ข้าควรตรวจสอบให้แน่ใจว่าสมาชิกทุกคนในตระกูลสามารถใช้จ่ายเงินทุนที่จำเป็นเพื่อสร้างอาณาจักรที่แข็งแกร่งขึ้นให้แก่เราได้"
 unity_encourage_house_economy_decision_tooltip: "ชี้นำสมาชิกในตระกูลของท่านให้มุ่งเน้นไปที่เศรษฐกิจ"
 unity_encourage_house_economy_decision_confirm: "ส่งเสริมเศรษฐกิจที่แข็งแกร่งขึ้น!"
 
 unity_promote_development_decision: "ส่งเสริมการพัฒนา"
 unity_promote_development_decision_desc: "วัฒนธรรมของเรามีประวัติศาสตร์อันยาวนานในด้านทักษะการบริหารที่ยอดเยี่ยม มีผู้ดูแลและหัวหน้างานที่มีทักษะจำนวนมากที่ได้รับการว่าจ้างภายในตระกูลของเรา เราสามารถใช้ประโยชน์จากสิ่งนี้และพัฒนาอาณาจักรต่อไปได้"
 unity_promote_development_decision_tooltip: "ส่งเสริมสมาชิกในตระกูลของท่านให้พัฒนาและเสริมสร้างอาณาจักร"
 unity_promote_development_decision_confirm: "ส่งเสริมการพัฒนา"
 
