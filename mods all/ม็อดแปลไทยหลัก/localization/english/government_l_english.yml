 special_contract_scutage:0 "สัญญาค่าสคิวเทจ"
 special_contract_scutage_desc:1 "#flavor ขณะอยู่ภายใต้ $special_contract_scutage$ [vassal|E] จะจ่าย [tax|E] มากกว่าที่ $feudal_government_taxes$ [obligation|E] กำหนด #high [EmptyScope.ScriptValue('scutage_contract_tax_tooltip')|0]%#! ขณะเดียวกันก็มอบ [levies|E] น้อยกว่าที่ $feudal_government_levies$ [obligation|E] กำหนด #high [EmptyScope.ScriptValue('scutage_contract_levies_tooltip')|0]%#!.#!"
 special_contract_march:0 "สัญญามาร์ช (เขตชายแดน)"
 special_contract_march_desc:2 "#flavor ขณะอยู่ภายใต้ $special_contract_march$ [vassal|E] จะได้รับโบนัสแก่ [levies] และความสามารถในการป้องกัน แต่จะมอบ [tax|E] น้อยกว่าที่ $feudal_government_taxes$ [obligation|E] กำหนด #high [EmptyScope.ScriptValue('march_contract_taxes_tooltip')|0]%#!.#!"
 special_contract_march_border_trigger: "[vassal.GetName] ไม่มีพรมแดนติดกับ [realm|E] ต่างชาติ"
 special_contract_palatinate:0 "สัญญาพาลาทิเนต"
 special_contract_palatinate_desc:2 "#flavor ขณะอยู่ภายใต้ $special_contract_palatinate$ [vassal|E] จะได้รับสิทธิพิเศษมากมายภายในอาณาจักร ซึ่งเพิ่มสถานะและอำนาจทางการเมืองมากขึ้น [vassals|E] แบบ $special_contract_palatinate_short$ จะเพิ่ม [prestige|E] ให้กับ [liege|E] แต่จะมอบ [tax|E] และ [levies|E] น้อยกว่าที่ $feudal_government_taxes$ และ $feudal_government_levies$ [obligations|E] กำหนด #high [EmptyScope.ScriptValue('palatinate_contract_taxes_tooltip')|0]%#!.#!"
 special_contract_castellan: "สัญญาคาสเตลลัน (ผู้ดูแลปราสาท)"
 special_contract_castellan_desc: "#flavor ขณะอยู่ภายใต้ $special_contract_castellan$ [vassal|E] จะได้รับโบนัสแก่ [levies] และความสามารถในการป้องกัน พวกเขาจะจ่าย [tax|E] น้อยลง #high [EmptyScope.ScriptValue('march_contract_taxes_tooltip')|0]%#! แต่จ่าย [levy|E] มากขึ้น #high [EmptyScope.ScriptValue('castellan_contract_levies_tooltip')|0]%#! กว่าที่ $feudal_government_taxes$ [obligation|E] ของพวกเขากำหนดไว้#!"
