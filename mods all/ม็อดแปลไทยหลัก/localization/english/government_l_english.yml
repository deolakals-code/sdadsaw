 title_revocation_rights_protected:0 "$title_revocation_rights$ ที่ได้รับการคุ้มครอง"
 title_revocation_rights_protected_desc:0 "#emphasis #bold สิทธิพิเศษของ[vassal|E]:#!#!\n$EFFECT_LIST_BULLET$ [liege|E] มิอาจริบ [titles|E] ของ [vassals_possessive|E] ได้\n\n#flavor [vassal] ได้รับการรับประกันกรรมสิทธิ์ใน [titles] ของตน ขัดขวางมิให้ [liege|E] ริบตำแหน่งเหล่านั้น – โดยมิต้องคำนึงว่า [liege|E] จะมี [revoke_title_reason] หรือไม่#!"
