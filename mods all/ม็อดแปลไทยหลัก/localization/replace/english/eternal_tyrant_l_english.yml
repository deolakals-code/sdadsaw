l_english:
 eternal_tyrant.0001.t: "จงคุกเข่า หรือมอดไหม้"
 eternal_tyrant.0001.desc: "พวกเขามาตั้งแต่ฟ้าสาง พร้อมข้าวเปลือก สุรา และปศุสัตว์ที่ดีที่สุด แล้ววางทุกสิ่งไว้หน้าประตูวังโดยไม่มีผู้ใดสั่ง ไม่มีใครข่มขู่พวกเขา และไม่จำเป็นต้องมีใครข่มขู่\n\nชายชราผู้หนึ่งก้มหน้าผากแนบแผ่นศิลา แล้วกระซิบว่า “พวกข้ายังจำได้ว่าเกิดสิ่งใดขึ้นกับหมู่บ้านที่ลืมไป พวกข้าจะไม่ลืมเลยพ่ะย่ะค่ะ”\n\nท่านทอดพระเนตรพวกเขาจากบนกำแพง ท่านจำหมู่บ้านนั้นไม่ได้ด้วยซ้ำ และนั่นแหละคือสิ่งที่พวกเขาหวาดกลัวที่สุด"
 eternal_tyrant.0001.a: "“ดีแล้ว ให้พวกมันจดจำต่อไป”"
 eternal_tyrant.0001.b: "“เพิ่มเป็นสองเท่า ทุกปี จนกว่าข้าจะเบื่อ”"
 eternal_tyrant.0001.c: "“นำไปถวายวิหาร ให้ทวยเทพเสวยในนามของข้า”"
 eternal_tyrant.0002.t: "ราตรีสุดท้ายของมือสังหาร"
 eternal_tyrant.0002.desc: "คมกริชแทงเข้ามาจนมิดด้าม ท่านรู้สึกได้ว่ามันครูดกระดูก แล้วท่านก็หันกลับไปช้าๆ และมองหน้ามัน\n\nมันยังหนุ่ม พวกมันหนุ่มเสมอในระยะหลัง เพราะพวกที่แก่กว่ารู้ดีกว่านั้น มันจ้องมองบาดแผลที่สมานปิดรอบคมเหล็กของตน แล้วบางสิ่งในจิตใจของมันก็แตกสลายลง\n\n“ท่าน...ท่านเป็นตัวอะไรกันแน่” มันถาม\n\n“ผู้ที่อดทนรอ” ท่านตอบ"
 eternal_tyrant.0002.a: "แขวนมันไว้ที่ประตูเมือง ให้กริชยังอยู่ในมือมัน"
 eternal_tyrant.0002.b: "ไว้ชีวิตมัน แล้วให้มันไปเล่าทุกสิ่งที่ได้เห็นแก่ทุกผู้คน"
 eternal_tyrant.0002.c: "ส่งศีรษะของมันห่อผ้าไหมไปให้ผู้ว่าจ้าง"
 eternal_tyrant.0003.t: "บททดสอบความภักดี"
 eternal_tyrant.0003.desc: "[tyrant_vassal.GetTitledFirstName]รับใช้ท่านมาหลายปี ส่วนท่านรับใช้บัลลังก์นี้มาหลายร้อยปี\n\nท่านเรียกข้าหลวงผู้นั้นเข้าเฝ้าในยามเที่ยงคืน แล้วมิได้ตรัสสิ่งใดเลย เพียงจ้องมองอย่างไม่กะพริบตา ขณะที่เทียนมอดลงทีละเล่ม และเหงื่อผุดขึ้นบนหน้าผากที่ซีดเผือดนั้น\n\nครั้นถึงยามสาม ข้าหลวงผู้นั้นก็ทรุดลงกับพื้น “หากข้ากระทำผิดสิ่งใด ขอฝ่าบาทโปรดอภัย สิ่งใดที่ฝ่าบาทต้องการ ข้าจะถวายทั้งสิ้น”\n\nทั้งที่ท่านยังมิได้กล่าวหาผู้ใดในเรื่องใดเลย"
 eternal_tyrant.0003.a: "“ถ้าเช่นนั้นจงสาบาน ด้วยเลือดของเจ้า และเลือดของลูกหลานเจ้า”"
 eternal_tyrant.0003.b: "“ข้ารู้ว่าเจ้าทำสิ่งใดไว้” ท่านไม่รู้ และนั่นไม่สำคัญเลย"
 eternal_tyrant.0003.c: "“ลุกขึ้นเถิด ความภักดีที่จริงใจถึงเพียงนี้สมควรได้รับบำเหน็จ”"
 eternal_tyrant.0004.t: "ประหารยามรุ่งสาง"
 eternal_tyrant.0004.desc: "ลานเมืองแน่นขนัด และเงียบกริบ นักโทษคือขุนนางผู้เอ่ยนามของท่านในโรงเตี๊ยมแล้วหัวเราะเยาะ\n\nฝูงชนมิได้มาเพื่อดูเขา พวกเขามาเพื่อดูท่าน ดูว่าผู้ที่ไม่มีวันตายจะเมตตาผู้ที่ต้องตายหรือไม่\n\nเพชฌฆาตเงยหน้าขึ้นมองระเบียงของท่าน แล้วรอคอย"
 eternal_tyrant.0004.a: "พยักหน้าเพียงครั้งเดียว แล้วเฝ้าดูโดยไม่กะพริบตา"
 eternal_tyrant.0004.b: "ยกมือขึ้นในวินาทีสุดท้าย ให้ความเมตตาน่าสะพรึงยิ่งกว่าคมขวาน"
 eternal_tyrant.0004.c: "เสด็จลงไปยังลานเมือง แล้วรับขวานมาลงมือเอง"
 eternal_tyrant.0005.t: "ยอดนักรบจากแดนไกล"
 eternal_tyrant.0005.desc: "เล่าลือกันว่าเขาเคยฆ่าหมีด้วยมือเปล่า และไม่เคยมีผู้ใดต้านทานเขาได้นานเกินกว่าบทสวดหนึ่งบท เขาเดินทางข้ามสามแผ่นดินมาเพื่อพิสูจน์ว่าอมตะแห่งแดนนี้เป็นเพียงเรื่องโกหก\n\nเขายืนอยู่ในท้องพระโรงในเกราะที่ยืมผู้อื่นมา และทั้งราชสำนักต่างกลั้นหายใจ\n\n“ข้ามาเพื่อดูเทพเจ้าหลั่งเลือด” เขากล่าว"
 eternal_tyrant.0005.a: "“ถ้าเช่นนั้นจงดูให้ดี” แล้วสังหารเขาด้วยมือเปล่า"
 eternal_tyrant.0005.b: "หักเขาทีละชิ้นอย่างช้าๆ แล้วส่งกลับบ้านทั้งที่ยังมีชีวิต ให้ไปเล่าขาน"
 eternal_tyrant.0005.c: "“จงคุกเข่า แล้วหลั่งเลือดเพื่อข้าแทน”"
 eternal_tyrant.0006.t: "คำสาบานแห่งโลหิต"
 eternal_tyrant.0006.desc: "พิธีกรรมโบราณนี้ถูกห้ามไว้ตั้งแต่ก่อนปู่ของปู่ท่านจะถือกำเนิด กระนั้นท่านก็ยังจดจำได้\n\nขุนนางของท่านกรีดฝ่ามือทีละคน ปล่อยให้โลหิตหยดลงในชามใบเดียวกัน ครั้นชามเต็ม ท่านก็ดื่มมันลงไป และเปลวเทียนทั้งหลายก็ไหววูบราวกับมีลมพัดผ่านท้องพระโรง\n\nนับแต่นี้จะไม่มีผู้ใดในห้องนั้นกล้าทรยศท่านอีก และไม่มีผู้ใดจะได้นอนหลับอย่างสงบอีกเช่นกัน"
 eternal_tyrant.0006.a: "“โลหิตของพวกเจ้าเป็นของข้าแล้ว อย่าได้ลืมเลือน”"
 eternal_tyrant.0006.b: "เทชามลงบนแท่นบูชาแทน ให้ทวยเทพได้ร่วมเสวย"
 eternal_tyrant.0101.t: "ผู้ที่รอดชีวิต"
 eternal_tyrant.0101.desc: "แผนการของท่านสำเร็จลุล่วง...เกือบทั้งหมด\n\nยังมีผู้หนึ่งที่รอดชีวิตมาได้ และเริ่มตั้งคำถามตามโรงเตี๊ยมและวิหาร ใครได้ประโยชน์ ใครถูกพบเห็น ใครยิ้มอยู่ คำถามเหล่านั้นยังมาไม่ถึงนามของท่าน ทว่ามันกำลังเดินเข้ามาใกล้ ทีละก้าวอย่างอดทน"
 eternal_tyrant.0101.a: "ตามหาผู้รอดชีวิตให้พบ แล้วทำให้หายสาบสูญไป"
 eternal_tyrant.0101.b: "ปล่อยให้มันมา นานแล้วที่ไม่มีผู้ใดกล้าหาญถึงเพียงนี้"
 eternal_tyrant.0101.c: "ป้อนนามของผู้อื่นให้มัน ให้มันไล่ล่าผิดตัว"
 eternal_tyrant.0102.t: "คำสาบานของเด็กกำพร้า"
 eternal_tyrant.0102.desc: "ท่านได้ยินถึงเด็กผู้หนึ่งที่กำพร้าเพราะงานเงียบเชียบชิ้นหนึ่งของท่าน เด็กผู้นั้นสาบานต่อหน้าแท่นบูชาว่าจะตามหามือที่พรากทุกสิ่งไปจากตน\n\nเด็กผู้นั้นจะเติบใหญ่ จะแก่ชรา และสุดท้ายก็จะตายไปทั้งที่ยังตามหาไม่พบ\n\nส่วนท่านจะยังอยู่ที่นี่"
 eternal_tyrant.0102.a: "ปล่อยคำสาบานไว้เช่นนั้น กาลเวลาจะรักษามันไว้แทนท่าน"
 eternal_tyrant.0102.b: "ลอบออกทุนเลี้ยงดูเด็ก ความกตัญญูเป็นสายจูงที่ดีกว่าความกลัว"
 eternal_tyrant.0102.c: "ให้คนคอยเฝ้ามองเด็กไว้เสมอ จากที่ห่างไกล"
 eternal_tyrant.0103.t: "คำสาปของนักบวช"
 eternal_tyrant.0103.desc: "นักบวชผู้หนึ่งยืนบนบันไดวิหาร แล้วประณามนามของท่านต่อหน้าคนทั้งเมือง “ปีศาจร้าย! ผู้ขโมยกาลเวลา! หลุมศพที่เจ้าหลอกหลบยังเฝ้ารอเจ้าอยู่!”\n\nฝูงชนค่อยๆ ถอยห่างจากเขา ราวกับเขาเป็นศพไปแล้ว\n\nท่านรอจนเขากล่าวจบ แล้วจึงแย้มยิ้มให้เขา บทสวดบทสุดท้ายของเขาไม่ทันได้จบลง"
 eternal_tyrant.0103.a: "เผาวิหารพร้อมนักบวชที่อยู่ข้างใน"
 eternal_tyrant.0103.b: "ให้เขาเทศนาสรรเสริญท่านในสัปดาห์หน้า เขาจะทำ"
 eternal_tyrant.0103.c: "“สาปข้าอีกสิ ท่านนักบวช ข้าอยู่ยืนยาวกว่าเทพที่ยิ่งใหญ่กว่าเทพของเจ้ามาแล้ว”"
 eternal_tyrant.0104.t: "ผู้จดพงศาวดารที่ใกล้ความจริงเกินไป"
 eternal_tyrant.0104.desc: "ผู้จดพงศาวดารในอารามไกลโพ้นผู้หนึ่ง ลากเส้นโยงเคราะห์กรรมของยุคสมัยเข้าหากัน และทุกเส้นที่เขาลากล้วนมุ่งตรงมายังราชสำนักของท่าน\n\nสาส์นฉบับล่าสุดที่เขาเขียนถึงบัณฑิตสหายลงท้ายด้วยคำถามเพียงข้อเดียว “ผู้ปกครองแผ่นดินนั้นมีชีวิตอยู่มานานเพียงใดแล้ว”"
 eternal_tyrant.0104.a: "ไปหาเขาด้วยตนเองในยามราตรี ให้เขาได้เห็นสิ่งที่ตนกำลังเขียนถึง"
 eternal_tyrant.0104.b: "เผาหอสมุดของอาราม อุบัติเหตุย่อมเกิดขึ้นได้เสมอ"
 eternal_tyrant.0104.c: "เป็นผู้อุปถัมภ์เขา จ้างให้เขาเขียนประวัติศาสตร์ฉบับอื่น"
 eternal_tyrant.0105.t: "บัลลังก์กระดูก"
 eternal_tyrant.0105.desc_f: "ตระกูลใหญ่สิบตระกูลล่มสลายใต้เงาของท่าน และไม่มีตระกูลใดเคยรู้แม้แต่นามของท่าน\n\nทว่าราษฎรได้เรียนรู้บางสิ่ง พวกเขาไม่เรียกท่านว่าราชินีอีกต่อไป ตามหมู่บ้านต่างเรียกท่านว่า “นางผู้คงอยู่” และมารดาทั้งหลายใช้นามนั้นขู่ลูกให้เงียบเสียง\n\nท่านประทับบนบัลลังก์ และเข้าใจในที่สุดว่า ท่านมิใช่ผู้ปกครองอีกแล้ว ท่านคือฤดูกาล ท่านคือเหมันต์ที่หวนคืนมาเสมอ"
 eternal_tyrant.0105.desc_m: "ตระกูลใหญ่สิบตระกูลล่มสลายใต้เงาของท่าน และไม่มีตระกูลใดเคยรู้แม้แต่นามของท่าน\n\nทว่าราษฎรได้เรียนรู้บางสิ่ง พวกเขาไม่เรียกท่านว่ากษัตริย์อีกต่อไป ตามหมู่บ้านต่างเรียกท่านว่า “ผู้คงอยู่” และมารดาทั้งหลายใช้นามนั้นขู่ลูกให้เงียบเสียง\n\nท่านประทับบนบัลลังก์ และเข้าใจในที่สุดว่า ท่านมิใช่ผู้ปกครองอีกแล้ว ท่านคือฤดูกาล ท่านคือเหมันต์ที่หวนคืนมาเสมอ"
 eternal_tyrant.0105.a: "“ให้พวกมันกลัวข้าดั่งกลัวความมืด”"
 eternal_tyrant.0105.b: "“ให้พวกมันบูชาข้าดั่งบูชาดวงตะวัน”"
 eternal_tyrant.0106.t: "เถ้าธุลีและความเงียบ"
 eternal_tyrant.0106.desc: "หลายเดือนต่อมา ท่านควบม้ากลับผ่านแว่นแคว้นที่ท่านทำให้ว่างเปล่า ท้องพระโรงเย็นเยียบ ธงทิวหายไปสิ้น\n\nกลางซากท้องพระโรงใหญ่ เด็กสาวรับใช้ผู้หนึ่งกำลังกวาดเถ้าถ่าน นางเงยหน้าขึ้น เห็นท่าน และมิได้กรีดร้อง นางเพียงคุกเข่าลง ก้มหน้ามองพื้น แล้วรอฟังว่าตนจะได้มีชีวิตอยู่หรือไม่\n\nนางเข้าใจสิ่งที่บรรดากษัตริย์ไม่เคยเข้าใจ"
 eternal_tyrant.0106.a: "“จงจำใบหน้าของข้าไว้ และอย่าบอกผู้ใด”"
 eternal_tyrant.0106.b: "ทิ้งถุงทองไว้ให้นาง แล้วจากไป"
 eternal_tyrant_blood_tribute_modifier: "บรรณาการโลหิต"
 eternal_tyrant_blood_tribute_modifier_desc: "ราษฎรจ่ายสองครา ครั้งหนึ่งด้วยเงินตรา อีกครั้งด้วยความกลัว"
 eternal_tyrant_iron_court_modifier: "ราชสำนักเหล็ก"
 eternal_tyrant_iron_court_modifier_desc: "ไม่มีผู้ใดในราชสำนักนี้กล้าพูดดังกว่าเสียงกระซิบ"
 eternal_tyrant_dread_lord_modifier: "เหมันต์ที่หวนคืน"
 eternal_tyrant_dread_lord_modifier_desc: "มิใช่ผู้ปกครอง หากคือฤดูกาล มารดาใช้นามนี้ขู่ลูกให้เงียบเสียง"
 eternal_tyrant_sworn_opinion: "สาบานด้วยโลหิต"
 eternal_tyrant_terrified_opinion: "หวาดกลัวจนขวัญหาย"
