l_english:
 ETERNAL_EDICT_ACTIONS: "ผู้อยู่ในโองการ"
 interaction_category_eternal_edict: "ผู้อยู่ในโองการ"
 eternal_under_edict_modifier: "ผู้อยู่ในโองการ"
 eternal_under_edict_modifier_desc: "ผู้ปกครองผู้นี้ถูกสตรีศักดิ์สิทธิ์เรียกตัวและยังอยู่ในอำนาจของนาง ทุกวันที่ผ่านไปบั่นทอนเส้นประสาท"
 eternal_edict_lesson_interaction: "บทเรียนการเมืองในราชสำนัก"
 eternal_edict_lesson_interaction_desc: "ให้แขกนั่งลงและสอนวิถีที่แท้จริงของราชสำนัก"
 eternal_edict_hunt_interaction: "ล่าสัตว์หลวง"
 eternal_edict_hunt_interaction_desc: "เสด็จออกล่าพร้อมแขก และกำหนดว่าใครเป็นผู้ล่าและใครเป็นเหยื่อ"
 eternal_edict_judge_interaction: "ผู้พิพากษาหนึ่งวัน"
 eternal_edict_judge_interaction_desc: "ให้แขกนั่งบัลลังก์ตุลาการ และดูว่าความยุติธรรมของเขาเป็นเช่นไร"
 eternal_edict_chess_interaction: "กระดานหมากรุกแห่งโชคชะตา"
 eternal_edict_chess_interaction_desc: "ท้าแขกเล่นเกมที่เดิมพันมิเคยเอ่ยออกเสียง"
 eternal_edict_jester_interaction: "ตลกหลวงหนึ่งวัน"
 eternal_edict_jester_interaction_desc: "ให้แขกสวมกระดิ่ง หรือให้นั่งบัลลังก์และท่านสวมกระดิ่งเอง"
 eternal_edict_riddle_interaction: "ปริศนาพนันคำสั่ง"
 eternal_edict_riddle_interaction_desc: "ตั้งปริศนา และกำหนดสิ่งที่ผู้แพ้ต้องมอบให้"
 eternal_edict_taste_interaction: "ชิมสุราปิดตา"
 eternal_edict_taste_interaction_desc: "ผูกตาแขกแล้ววางจอกสามใบ หนึ่งในนั้นอาจมีพิษหรือมิมี"
 eternal_edict_throne_interaction: "หนึ่งชั่วโมงบนบัลลังก์"
 eternal_edict_throne_interaction_desc: "ให้แขกนั่งบัลลังก์ของสตรีศักดิ์สิทธิ์หนึ่งชั่วโมง และดูว่าจะทำเช่นไร"
 eternal_edict_masked_interaction: "งานเต้นรำสวมหน้ากาก"
 eternal_edict_masked_interaction_desc: "จัดงานเต้นรำที่ทุกคน รวมทั้งสตรีศักดิ์สิทธิ์ สวมหน้ากาก"
 eternal_edict_bedchamber_interaction: "งานเลี้ยงที่จบที่ห้องบรรทม"
 eternal_edict_bedchamber_interaction_desc: "จัดงานเลี้ยงส่วนพระองค์สำหรับแขกผู้ถูกเสน่ห์ และให้จบหลังประตูห้องบรรทม"
 eternal_edict_night_interaction: "ราตรีเงียบงัน"
 eternal_edict_night_interaction_desc: "ใช้ราตรีอันยาวนานและไม่รีบร้อนกับแขกผู้เริ่มไว้ใจท่าน"
 eternal_edict.0001.t: "บทเรียนการเมืองในราชสำนัก"
 eternal_edict.0001.desc: "ท่านให้[summon_guest.GetTitledFirstName]นั่งที่โต๊ะเล็กในห้องสมุด และวางกระดานหมากแห่งนามไว้เบื้องหน้า ญาติผู้ใดนั่งที่ใด ใครเป็นหนี้ใคร ใครขายมารดาเพื่อยศ และใครขายเพื่อหนี้ ท่านอธิบายว่าราชสำนักมิใช่สถานที่ แต่เป็นสภาพอากาศ\n\nท่านตระหนักขณะกล่าวว่า นี่เป็นบทเรียนซื่อตรงบทแรกที่ใครมอบให้เขาในรอบหลายปี เขาฟังดั่งผู้อดอยากมานาน"
 eternal_edict.0001.a: "สอนอย่างซื่อตรง ให้เขาเห็นความจริง"
 eternal_edict.0001.b: "สอนให้เกรงกลัว ศิษย์ที่หวาดกลัวย่อมจำได้"
 eternal_edict.0001.c: "ตั้งคำถามหลอก และดูว่าเขาล้มไปทางใด"
 eternal_edict.0002.t: "ล่าสัตว์หลวง"
 eternal_edict.0002.desc: "แตรเขาดังก่อนรุ่งอรุณ ท่านเสด็จออกพร้อมแขกเคียงข้าง ผ่านน้ำค้างแข็งและต้นโอ๊กเก่าแก่ สุนัขล่าเห่านำหน้า และนักขี่ร้อยคนแผ่ออกเบื้องหลังดั่งอวน\n\nที่ใดสักแห่งในป่า กวางตัวหนึ่งรออยู่ และที่อื่น การตัดสินใจเล็ก ๆ ก็รออยู่เช่นกัน วันนี้ ใครเป็นผู้ล่า"
 eternal_edict.0002.a: "ล่าเคียงกัน และแบ่งเนื้อเหยื่อ"
 eternal_edict.0002.b: "ให้แขกเป็นเหยื่อ และให้ก้าวนำหน้า"
 eternal_edict.0002.c: "ปล่อยเหยี่ยวด้วยกัน และให้บ่ายนั้นเนิบช้า"
 eternal_edict.0003.t: "ผู้พิพากษาหนึ่งวัน"
 eternal_edict.0003.desc: "ท่านให้แขกนั่งเก้าอี้สูงของท้องพระโรงตุลาการและส่งไม้เท้าขาวให้ คดีแรกเป็นข้อพิพาทหลักเขต คดีที่สองเป็นเด็กถูกกล่าวหาว่าขโมยขนมปัง ฝูงชนซึ่งถูกบอกว่าผู้ใดเป็นผู้พิพากษา เฝ้าดูอย่างระมัดระวังยิ่ง\n\nท่านยืนข้างด้วยผ้าคลุมหน้าลดต่ำ ทุกคนในห้องรู้ว่าผู้ใดกุมศาลที่แท้จริง"
 eternal_edict.0003.a: "ให้เขาตัดสินอย่างเป็นธรรม และปรบมือให้"
 eternal_edict.0003.b: "ให้เขาสั่งโทษอันโหดร้าย และดูสีหน้า"
 eternal_edict.0003.c: "สลับที่นั่งกลางคัน และพิพากษาแขกเอง"
 eternal_edict.0004.t: "กระดานหมากรุกแห่งโชคชะตา"
 eternal_edict.0004.desc: "ท่านวางกระดานเอง ไม้มะเกลือและงาช้าง สลักโดยช่างผู้ล่วงลับ มีโคนที่หายไปแทนด้วยปลอกนิ้ว \"เราจะไม่กล่าวถึงเดิมพัน\" ท่านบอก[summon_guest.GetTitledFirstName] \"เราทั้งสองจะรู้\"\n\nเกมกินเวลาทั้งค่ำ เมื่อถึงตาที่สี่สิบ ไม่มีผู้ใดคิดถึงหมากรุกอีกแล้ว"
 eternal_edict.0004.a: "เล่นเพื่อเดิมพันอันมิเอ่ย แพ้หรือชนะ ย่อมมีบางสิ่งเปลี่ยน"
 eternal_edict.0004.b: "จงใจเล่นให้แพ้ ให้เขาเชื่อว่าชนะ"
 eternal_edict.0004.c: "เล่นโดยปิดตา เพื่อแสดงว่าท่านมองไกลเพียงใด"
 eternal_edict.0005.t: "ตลกหลวงหนึ่งวัน"
 eternal_edict.0005.desc: "ตลกหลวงถูกส่งไปพักร้อน และเสื้อสีฉูดฉาดของเขาถูกนำมายัง[summon_guest.GetTitledFirstName]บนเบาะ ข้าราชบริพารถูกสั่งให้หัวเราะทุกสิ่ง เท่าที่ใครบอกได้ มันเป็นมุกตลก และไม่มีใครแน่ใจว่าของผู้ใด\n\nผู้ปกครองสวมกระดิ่งด้วยหลังตรงและหน้าเรียบนิ่ง และข้าราชบริพารผู้ฉลาดจ้องจานของตน"
 eternal_edict.0005.a: "ให้แขกเป็นตลก และเพลิดเพลินกับการแสดง"
 eternal_edict.0005.b: "ท่านสวมเสื้อตลกเอง และให้แขกนั่งบัลลังก์"
 eternal_edict.0005.c: "ให้ทั้งราชสำนักสวมหน้ากาก และเล่นเกมทายตัว"
 eternal_edict.0006.t: "ปริศนาพนันคำสั่ง"
 eternal_edict.0006.desc: "\"ปริศนาหนึ่ง\" ท่านกล่าวพลางวางจอก \"หากเจ้าตอบได้ ข้าจะประทานความโปรดปราน หากมิได้ เจ้าจะประทานแก่ข้า\" แล้วท่านเอ่ยเดิมพันเป็นเสียงกระซิบ และ[summon_guest.GetTitledFirstName]ซีดเผือด แล้วค่อย ๆ ครุ่นคิด\n\nปริศนาเก่านัก เดิมพันมิเก่า และคำตอบ กลับเป็นคำสั้นยิ่ง"
 eternal_edict.0006.a: "เดิมพันคำสั่ง ผู้แพ้ต้องเชื่อฟัง"
 eternal_edict.0006.b: "เดิมพันความลับ ผู้แพ้ต้องเล่า"
 eternal_edict.0006.c: "ไม่เดิมพันสิ่งใด เพียงเพลิดเพลินกับปริศนา"
 eternal_edict.0007.t: "ชิมสุราปิดตา"
 eternal_edict.0007.desc: "จอกสามใบ ผ้าผูกตาไหม และโต๊ะกลางห้องโถงว่างเปล่า \"หนึ่งในนี้มีพิษ\" ท่านกล่าว ด้วยน้ำเสียงที่มิบอกสิ่งใด \"หรือมิมี หรือมีทั้งหมด ชิมแล้วบอกความเห็นข้า\"\n\n[summon_guest.GetTitledFirstName]เอื้อมมือไปด้วยมือที่เกือบจะมิสั่น"
 eternal_edict.0007.a: "มิกล่าวความจริง ให้จินตนาการของเขาทำงาน"
 eternal_edict.0007.b: "เปิดเผยว่าทั้งสามคือสุราชั้นเลิศของพระราชวัง"
 eternal_edict.0007.c: "สลับจอกลับหลังเขา และดูว่าสิ่งใดเปลี่ยน"
 eternal_edict.0008.t: "หนึ่งชั่วโมงบนบัลลังก์"
 eternal_edict.0008.desc: "ท่านลุกขึ้นและชี้ไปที่บัลลังก์ [summon_guest.GetTitledFirstName]จ้อง แล้วเพราะไม่มีสิ่งอื่นทำ จึงนั่งลง ห้องมิหายใจ\n\nเก้าอี้แข็งและกว้างเกินไป และทั้งราชสำนักจ้องมอง เป็นวิธีที่ได้ผลยิ่งนักที่จะเรียนรู้ว่าบัลลังก์หนักเพียงใด"
 eternal_edict.0008.a: "ให้เขานั่งหนึ่งชั่วโมง และมิกล่าวสิ่งใด"
 eternal_edict.0008.b: "คุกเข่าที่เท้าเขา ให้เขาสงสัยว่าหมายความว่าอย่างไร"
 eternal_edict.0008.c: "ยืนข้างไหล่เขา และแสดงวิธีปกครอง"
 eternal_edict.0009.t: "งานเต้นรำสวมหน้ากาก"
 eternal_edict.0009.desc: "หน้ากากร้อยใบถูกวางในห้องโถงใหญ่ จิ้งจอก นักบุญ ปีศาจ วงรีสีขาวเรียบ ไม่มีผู้ใดต้องบอกว่าตนคือผู้ใด แม้แต่สตรีศักดิ์สิทธิ์ ผู้สวมเพียงจันทร์เสี้ยวเงินเล็ก ๆ และไม่มีสิ่งอื่น ไวโอลินเริ่มช้า แล้วเร็ว\n\nในฝูงชน [summon_guest.GetTitledFirstName]สวมหน้ากากอีกา และเป็นครั้งแรกนับแต่มาถึงที่ดูเหมือนจะหายใจได้"
 eternal_edict.0009.a: "จัดงานเต้นรำใหญ่ที่สุดที่ราชสำนักเคยเห็น"
 eternal_edict.0009.b: "ปกปิดตัวตนของท่าน และเต้นรำกับแขก"
 eternal_edict.0009.c: "เต้นระบำเงา ที่ทุกคนถูกจับตา"
 eternal_edict.0010.t: "งานเลี้ยงที่จบที่ห้องบรรทม"
 eternal_edict.0010.desc: "งานเลี้ยงเล็ก เก้าอี้สองตัว โต๊ะยาว เทียนที่ไหวตามลมจากหน้าต่างที่เปิดสู่สวน ท่านรินสุราเอง และ[summon_guest.GetTitledFirstName]ผู้เริ่มไว้ใจมือที่รินสุรา หัวเราะกับถ้อยคำของท่าน และดูเหมือนมิสังเกตเมื่อเสียงหัวเราะหยุด\n\nมหาดเล็กถูกปลด ดนตรีเหลือเพียงพิณเดียวแผ่วไกล ท่านจับมือแขกและนำเดินตามทางเดิน ผ่านทหารที่จ้องเพดาน ไปยังประตูห้องบรรทม มันปิดลงเบื้องหลังท่านด้วยเสียงเบา\n\nเทียนข้างในต่ำกว่า กลิ่นไม้สนและกุหลาบเก่า และความเงียบยาวนานของสองคนที่ตัดสินใจ โดยมิต้องกล่าว ว่าสิ่งใดจะเกิดต่อไป จุมพิตเริ่มช้า แล้วมิช้าอีก ผ้าไหมร่วงหล่น มือค้นพบสิ่งที่ตามหา ราตรียาวและอบอุ่น และไม่มีพงศาวดารใดจะจดคำสักคำ\n\nรุ่งอรุณพบท่านพร้อมบานหน้าต่างที่เปิดอยู่ และแขกหลับพิงบ่า"
 eternal_edict.0010.a: "ให้งานเลี้ยงกลายเป็นการเต้นรำ และการเต้นรำกลายเป็นราตรี"
 eternal_edict.0010.b: "เดินช้า ๆ แวะทุกหน้าต่าง"
 eternal_edict.0010.c: "จุมพิตมือที่ประตู และส่งเขาไปนอนลำพัง"
 eternal_edict.0011.t: "ราตรีเงียบงัน"
 eternal_edict.0011.desc: "ไม่มีงานเลี้ยง ไม่มีดนตรี ไม่มีผู้ชม ท่านเรียก[summon_guest.GetTitledFirstName]มาเพียงเพื่อนั่งข้างกองไฟ และท่านทั้งสองนั่ง พร้อมหนังสือที่ไม่มีใครอ่าน เมื่อใดเมื่อหนึ่งหนังสือถูกปิด เมื่อใดเมื่อหนึ่งท่านมิได้พูดถึงสิ่งใดอีก\n\nเมื่อมือแขกพบมือท่าน มิใช่เรื่องประหลาด เมื่อท่านโน้มเข้าไป เป็นเพียงคำถาม และคำตอบนั้นช้าและยาวนาน ไฟลดต่ำ ผ้าห่มหนักและอุ่น และความเงียบในห้องเป็นแบบของสองคนที่อยู่ ณ ที่ที่ตนอยู่โดยสมบูรณ์ ชั่วโมงผ่านดั่งไหมผ่านนิ้ว\n\nในความเทาก่อนรุ่งสาง ท่านนอนฟังลมหายใจของอีกฝ่าย และรู้ โดยมิเสียใจ ว่ามีสิ่งหนึ่งถูกตกลงระหว่างท่านทั้งสอง ที่สนธิสัญญาใดทำมิได้"
 eternal_edict.0011.a: "ให้ค่ำคืนจบตามที่ราตรีปรารถนา"
 eternal_edict.0011.b: "ให้ราตรีช้า และกอดไว้จนเช้า"
 eternal_edict.0011.c: "เพียงสนทนา และหลับข้างกองไฟ"
