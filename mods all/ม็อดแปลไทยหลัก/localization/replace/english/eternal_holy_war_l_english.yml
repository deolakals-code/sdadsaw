l_english:
 eternal_holywar.0001.t: "ณ แท่นเทศน์"
 eternal_holywar.0001.desc: "มหาวิหารแน่นขนัดจรดประตู ครั้นท่านก้าวขึ้นสู่แท่นเทศน์ พระสังฆราชผู้พึงกล่าวก่อนก็ถอยให้โดยมิต้องร้องขอ เบื้องล่างคือพ่อค้า หญิงหม้าย และทหารผู้ถือหมวกเกราะไว้ในมือ นอกกำแพงนั้น ราชทูตจากหลายราชสำนักยืนรอพระวาจาของท่าน\n\nท่านได้ประกาศสงครามแล้ว บัดนี้ท่านต้องกำหนดว่าโลกจะจดจำสงครามนี้ในรูปแบบใด"
 eternal_holywar.0001.a: "\"จงมีเมตตาแก่ผู้ที่ยอมสยบ\""
 eternal_holywar.0001.b: "\"จงให้เพลิงสั่งสอนผู้ที่ไม่ยอมน้อมรับ\""
 eternal_holywar.0001.c: "\"จงให้ผู้ศรัทธาตัดสินเองว่าได้เห็นสิ่งใด\""
 eternal_holywar.0002.t: "ธงทั้งหลายรวมพล"
 eternal_holywar.0002.desc: "ม้าเร็วทยอยมาถึงนครหลวงทีละคนสองคน แล้วเป็นหลายสิบ แต่ละคนถือธงต่างสี และจดหมายต่างลายมือ ทว่าทุกฉบับกล่าวความเดียวกัน คือสตรีศักดิ์สิทธิ์ทรงเรียกหา และพวกเราได้มาแล้ว\n\nกองโล่ กองม้า กองธนู และกองทหารชั้นเลิศอันแต่ละราชสำนักเลี้ยงไว้เป็นศักดิ์ศรี ตั้งค่ายอยู่บนที่ราบนอกกำแพง ตามที่ไพร่ฟ้าของตนฝึกฝนมาตั้งแต่เยาว์วัย"
 eternal_holywar.0002.desc_mercy: "ค่ายสงบและเป็นระเบียบ ทหารเอ่ยนามท่านด้วยเสียงอ่อนโยนอันเป็นเสียงของผู้เคารพนักบุญ และพระในกองทัพมีงานมากกว่านายสิบเสียอีก"
 eternal_holywar.0002.desc_fire: "ค่ายเกรียวกราวและหิวกระหาย ทหารเอ่ยนามท่านดั่งเอ่ยถึงพายุ แม้นายสิบก็ยังเดินอ้อมกระโจมของท่านด้วยความระวัง"
 eternal_holywar.0002.desc_neutral: "ค่ายเต็มไปด้วยข่าวลือหลากหลาย แต่ละกองตีความถ้อยคำของท่านเอง กว่าตำนานจะนิ่งก็ต้องใช้เวลาอีกหลายสัปดาห์"
 eternal_holywar.0002.a: "เสด็จเดินตรวจแถวยามอรุณ"
 eternal_holywar.0002.b: "พระราชทานธงแก่พระในกองทัพ"
 eternal_holywar.0002.c: "ให้ค่ายเห็นท่านจากที่ไกลเท่านั้น"
 eternal_holywar.0003.t: "ทางแห่งผู้แสวงบุญ"
 eternal_holywar.0003.desc: "เบื้องหลังกองทัพคือผู้แสวงบุญ ไม่มีผู้ใดเรียกพวกเขา แต่พวกเขาเดินเท้าเปล่าเคียงรถสัมภาระ ขับบทสวดที่แต่งถวายท่านโดยท่านมิได้ล่วงรู้ ถือเทียนที่ดับแล้วจุดใหม่เองท่ามกลางลม\n\nเหล่านายทัพบ่นว่าพวกเขาทำให้เดินทัพช้า ทว่าก็สังเกตเห็นด้วยความกระดากใจว่า ทหารย่อมก้าวเร็วขึ้นเมื่อเสียงสวดอยู่ใกล้"
 eternal_holywar.0003.a: "ประสาทพรและให้พวกเขาเดินนำหน้า"
 eternal_holywar.0003.b: "ให้อยู่หลังแนว และแจ้งว่านี่คือเกียรติ"
 eternal_holywar.0003.c: "เสด็จเดินท่ามกลางพวกเขาด้วยพระองค์เอง"
 eternal_holywar.0004.t: "สตรีศักดิ์สิทธิ์ ณ สมรภูมิ"
 eternal_holywar.0004.desc: "ฝุ่น เหล็ก และเสียงอึกทึก แล้วกลับมีความนิ่งสงบอยู่กลางวงกรรม ประหนึ่งว่าสมรภูมิเองสูดลมหายใจ ท่านยืนบนเนินเหนือการรบในผ้าคลุมขาว ทั่วทั้งแนวรบ ผู้คนเงยหน้าขึ้นเห็นท่านในที่ซึ่งตนหวังไว้\n\nสิ่งที่ท่านกระทำต่อไปจะถูกเล่าขานเป็นร้อยฉบับ โดยผู้ที่มิได้อยู่ที่นั่น และโดยผู้ที่อยู่ไม่กี่คน"
 eternal_holywar.0004.a: "ยกพระหัตถ์ขึ้น เรียกแนวรบให้รุกไปข้างหน้า"
 eternal_holywar.0004.b: "เสด็จลงไปในแนวรบโดยมิมีอาวุธ"
 eternal_holywar.0004.c: "ประทับอยู่ที่เดิม ให้พวกเขามองดู"
 eternal_holywar.0005.t: "ระฆังหลังศึก"
 eternal_holywar.0005.desc: "ระฆังเริ่มจากมหาวิหาร แล้วทุกตำบลระหว่างแนวหน้าและนครหลวงก็ลั่นรับต่อกันมา สงครามชนะแล้ว ผู้วายชนม์ถูกนับลงในสมุดที่ไม่มีผู้ใดอยากเปิดซ้ำ\n\nท่านเสด็จกลับผ่านหมู่บ้านที่คุกเข่าเมื่อท่านผ่าน ท่านไม่แน่ใจว่าตนกลายเป็นสิ่งใด นักบุญหรือผู้พิชิต และเริ่มสงสัยว่าชาวบ้านมิได้แบ่งแยกสองสิ่งนั้นเลย"
 eternal_holywar.0005.a: "ให้ระฆังลั่นสามวันสามคืน"
 eternal_holywar.0005.b: "ใช้ยามสงบอยู่เคียงข้างผู้บาดเจ็บ"
 eternal_holywar.0006.t: "สัญญาสงบศึกอันประทับตรา"
 eternal_holywar.0006.desc: "ข้อสัญญาถูกอ่านออกเสียงในเช้าอันหนาวเหน็บ ไม่มีผู้ใดโห่ร้อง ทั้งสองค่ายหิวโหย ผู้นำทั้งสองอ่อนล้า ราชทูตแลกเปลี่ยนสำเนาด้วยมืออันระมัดระวัง ดั่งผู้ถือสิ่งที่อาจระเบิดขึ้นได้อีก\n\nท่านมิได้ชนะ ท่านมิได้แพ้ แต่ได้เรียนรู้ในแบบที่ชัยชนะใดมิอาจสอนได้ ว่ามีผู้คนเพียงใดที่ยินยอมตามท่านเข้าไปสู่ความมืด"
 eternal_holywar.0006.a: "ประกอบพิธีแก่ผู้วายชนม์ และให้ผู้เป็นอยู่ได้พักผ่อน"
 eternal_holywar.0006.b: "ให้ราชสำนักเห็นว่าท่านแน่วแน่ ไม่ใช่อ่อนล้า"
 eternal_holywar.0007.t: "เถ้าธุลีแห่งธงรบ"
 eternal_holywar.0007.desc: "คืนนั้นธงถูกเผาลานปราสาททีละผืนตามธรรมเนียม ควันบางและเทา กลิ่นไม้สนและขนแกะ พันธมิตรของท่านยืนรอบกองไฟ ด้วยสีหน้าของผู้ที่ทิ้งสิ่งมากมายไว้ในสมรภูมิที่จะไม่ได้เห็นอีก\n\nไม่มีผู้ใดโทษท่านออกเสียง นั่นแหละคือสิ่งที่เลวร้ายที่สุด"
 eternal_holywar.0007.a: "รับความผิดและความโศกเศร้าไว้ที่ตน"
 eternal_holywar.0007.b: "ให้คำมั่นว่าสงครามยังมิสิ้น เพียงแต่หยุดพัก"
 eternal_holy_descent_interaction: "การลงทัณฑ์ของสตรีศักดิ์สิทธิ์"
 eternal_holy_descent_interaction_desc: "เรียกห้าอาณาจักรที่ใกล้ที่สุดออกศึกต่อผู้ปกครองผู้นี้ในทันที"
