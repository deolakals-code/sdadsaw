l_english:
 eternal_maiden.0400.t: "ใบหน้าเบื้องหลังผ้าคลุม"
 eternal_maiden.0400.desc: "ท่านอยู่ในห้องเพียงลำพัง เลิกผ้าคลุมขึ้น แล้วมองเข้าไปในกระจก\n\nผู้ศรัทธาเห็นนักบุญ ศัตรูเห็นผู้วางอุบาย ทว่าสตรีในกระจกมิได้เห็นทั้งสองอย่าง นางเห็นผู้ที่ไม่เคยหวาดกลัวสิ่งใดเลยแม้สักครั้ง และเริ่มเพลิดเพลินกับการได้ดูผู้อื่นเรียนรู้ความหวาดกลัว\n\nนางยิ้มให้ท่าน ทั้งที่ท่านมิได้สั่งให้ยิ้ม"
 eternal_maiden.0400.a: "ยิ้มตอบ ให้โลกได้พบกับนาง"
 eternal_maiden.0400.b: "คุกเข่าสวดภาวนาจนกว่านางจะจากไป"
 eternal_maiden.0400.c: "ทุบกระจกให้แตกละเอียด"
 eternal_maiden.0401.t: "ยาพิษในจอกศักดิ์สิทธิ์"
 eternal_maiden.0401.desc: "บิชอปผู้กล่าวหาว่าท่านเป็นนักต้มตุ๋นจะคุกเข่าเบื้องหน้าท่านในวันพรุ่ง เพื่อรับจอกศักดิ์สิทธิ์จากมือของท่าน นั่นจะเป็นช่วงเวลาที่ศักดิ์สิทธิ์ที่สุดของงานฉลอง\n\nท่านชูขวดเล็กๆ ขึ้นส่องกับเปลวเทียน ของเหลวในนั้นใสบริสุทธิ์"
 eternal_maiden.0401.a: "ทั้งหมด ให้มันตายที่แท่นบูชา พร้อมพรของท่านบนริมฝีปาก"
 eternal_maiden.0401.b: "เพียงไม่กี่หยด ให้มันล้มป่วย แล้ว “หายดี” ด้วยคำภาวนาของท่าน"
 eternal_maiden.0401.c: "เทมันทิ้ง ไม่ใช่ที่แท่นบูชา"
 eternal_maiden.0402.t: "คำพยากรณ์ลวง"
 eternal_maiden.0402.desc: "นครคู่แข่งแห่งหนึ่งเยาะเย้ยนามของท่านในมหาวิหารของพวกมัน ท่านจึงประกาศจากธรรมาสน์ทั้งน้ำตาว่า สวรรค์ได้แสดงชะตากรรมของนครนั้นให้ท่านเห็นแล้ว คือเพลิงผลาญภายในปีนี้\n\nผู้ศรัทธาพากันอุทาน คำพยากรณ์จะน่ากลัวก็ต่อเมื่อมันเป็นจริงเท่านั้น"
 eternal_maiden.0402.a: "ปล่อยให้ความกลัวทำงาน พวกมันจะเผาตัวเองด้วยความกังวล"
 eternal_maiden.0402.b: "ส่งคนถือคบเพลิงไปให้แน่ใจว่าสวรรค์รักษาคำพูด"
 eternal_maiden.0402.c: "สวดภาวนาเสียงดังขอให้นครนั้นรอดพ้น ให้พวกมันติดหนี้ท่าน"
 eternal_maiden.0403.t: "แม่มดแห่งบึงน้ำ"
 eternal_maiden.0403.desc: "ผู้คนเริ่มกระซิบถึงท่านอีกครั้ง พวกเขาต้องการใครสักคนให้กระซิบถึงแทน\n\nในบึงน้ำมีหญิงชราผู้หนึ่งขายยาแก้ไข้และเครื่องรางเสน่ห์ นางไม่เคยทำร้ายผู้ใด และนางจะเป็นแม่มดที่สมบูรณ์แบบ"
 eternal_maiden.0403.a: "กล่าวโทษนางต่อหน้ามหาวิหาร แล้วจุดกองฟอนด้วยมือของท่านเอง"
 eternal_maiden.0403.b: "ไต่สวนนาง แล้วปล่อยตัว โยนความผิดให้ปีศาจที่นางขับไล่ไป"
 eternal_maiden.0403.c: "ลอบเตือนนางในยามราตรี แล้วปล่อยให้นางหนีไป"
 eternal_maiden.0404.t: "การค้าปาฏิหาริย์"
 eternal_maiden.0404.desc: "บ่าวลับของท่านชำนาญเรื่องปาฏิหาริย์ยิ่งขึ้นทุกที ขอทานที่ “กลับมาเดินได้” คนใบ้ที่ “พูดได้” เด็กหญิงตาบอดที่ “มองเห็น” แต่ละคนได้รับค่าจ้าง ซักซ้อมบทมาแล้ว และถูกส่งไปยังเมืองอื่น\n\nการค้านี้ใหญ่โตขึ้นทุกที และสิ่งที่ใหญ่โตย่อมเป็นที่สังเกต"
 eternal_maiden.0404.a: "ขยายมันออกไป ทุกเมืองสมควรได้ปาฏิหาริย์"
 eternal_maiden.0404.b: "ยุติมันเสีย ให้ปาฏิหาริย์กลายเป็นของหายากและล้ำค่า"
 eternal_maiden.0404.c: "ยุติทั้งการค้า และชีวิตของผู้แสดงทั้งหมด"
 eternal_maiden.0405.t: "หัตถ์ที่หลั่งโลหิต"
 eternal_maiden.0405.desc: "หมอหลวงของท่านแสดงวิธีให้ดูแล้ว ใบมีดบางเฉียบ เกลือเล็กน้อย และผ้าพันแผลอย่างระมัดระวัง ครั้นถึงวันศุกร์ศักดิ์สิทธิ์ ฝ่ามือของท่านจะหลั่งโลหิตดุจที่ศาสดาเคยเป็น\n\nผู้ศรัทธารอคอยสัญญาณเช่นนี้มาหลายร้อยปี"
 eternal_maiden.0405.a: "แสดงฝ่ามือที่มีบาดแผลต่อฝูงชนยามรุ่งอรุณ"
 eternal_maiden.0405.b: "แสดงให้เพียงคนในวงในเห็น แล้วปล่อยให้ข่าวลือทำส่วนที่เหลือ"
 eternal_maiden.0405.c: "ปฏิเสธ คำโกหกบางเรื่องหนักเกินไปแม้สำหรับท่าน"
 eternal_maiden.0406.t: "ผู้พลีชีพที่ท่านสร้างขึ้น"
 eternal_maiden.0406.desc: "ภคินีสาวในคณะของท่านผู้หนึ่งอาสานำสาส์นของท่านเข้าไปในแดนของพวกนอกรีต นางจะไม่ได้กลับมา และท่านทั้งสองต่างรู้ดี\n\nนางจุมพิตมือของท่าน “หากข้าต้องตาย ท่านหญิงผู้ศักดิ์สิทธิ์ ขอให้ตายเพื่อท่านเจ้าค่ะ”\n\nท่านหยุดนางได้ ทว่าผู้พลีชีพหนึ่งคนมีค่ายิ่งกว่าคำเทศนานับพันบท"
 eternal_maiden.0406.a: "อวยพร ส่งนางไป แล้วสร้างศาลเจ้าให้นางก่อนร่างนางจะเย็นชืด"
 eternal_maiden.0406.b: "ห้ามนางไว้ ให้นางอยู่ข้างกายท่าน"
 eternal_maiden.0406.c: "ให้ฝูงชนเห็นนางออกเดินทาง และเห็นว่าท่านร่ำไห้เพียงใด"
 eternal_maiden.0407.t: "บ่าวผู้รู้มากเกินไป"
 eternal_maiden.0407.desc_f: "[maiden_speaker.GetTitledFirstName]รับใช้ท่านมาหลายปี ถือจดหมายมามากมาย และเก็บกวาดสิ่งต่างๆ มานับไม่ถ้วน คืนนี้นางไม่กล้าสบตาท่าน\n\n“ข้าอยากออกจากการรับใช้ท่านเจ้าค่ะ ท่านหญิงผู้ศักดิ์สิทธิ์” นางกล่าว “ข้าอยากลืมทุกสิ่ง”\n\nไม่มีผู้ใดที่รู้สิ่งที่นางรู้ จะได้รับอนุญาตให้ลืม"
 eternal_maiden.0407.desc_m: "[maiden_speaker.GetTitledFirstName]รับใช้ท่านมาหลายปี ถือจดหมายมามากมาย และเก็บกวาดสิ่งต่างๆ มานับไม่ถ้วน คืนนี้เขาไม่กล้าสบตาท่าน\n\n“ข้าอยากออกจากการรับใช้ท่านขอรับ ท่านหญิงผู้ศักดิ์สิทธิ์” เขากล่าว “ข้าอยากลืมทุกสิ่ง”\n\nไม่มีผู้ใดที่รู้สิ่งที่เขารู้ จะได้รับอนุญาตให้ลืม"
 eternal_maiden.0407.a: "“ถ้าเช่นนั้นข้าจะช่วยให้เจ้าลืม” ส่งไปยังอารามแห่งความเงียบอันไกลโพ้น ภายใต้การคุมตัว"
 eternal_maiden.0407.b: "“เจ้าไปได้ แต่จงจำไว้ว่าข้าเองก็รู้เรื่องของเจ้ามากเพียงใด”"
 eternal_maiden.0407.c: "“ไปเป็นสุขเถิด ข้าไว้ใจเจ้า” ท่านไว้ใจจริงหรือ"
 eternal_maiden.0408.t: "เสียงเรียกสู่สงครามศักดิ์สิทธิ์"
 eternal_maiden.0408.desc: "พวกนอกรีตฝั่งโน้นแม่น้ำเผาโบสถ์ไปหลังหนึ่ง ผู้ศรัทธาต่างหันมามองท่าน มือวางอยู่บนด้ามดาบแล้ว\n\nเพียงคำเดียวจากท่าน แม่น้ำจะกลายเป็นสีแดง เพียงคำเดียว ธงของขุนนางนับร้อยจะเดินทัพใต้พรของท่าน"
 eternal_maiden.0408.a: "“สวรรค์ประสงค์เช่นนั้น” แล้วอวยพรคมดาบ"
 eternal_maiden.0408.b: "เรียกให้ขุนนางทุกผู้ถวายทศางค์ก่อนจึงจะได้รับพร"
 eternal_maiden.0408.c: "“ยังมิใช่เวลา” ปล่อยให้ความโกรธของพวกเขาสุกงอม"
 eternal_maiden.0409.t: "ศีลมหาสนิทแห่งความหวาดกลัว"
 eternal_maiden.0409.desc: "ในพิธีศีลมหาสนิทครั้งใหญ่ มหาวิหารแน่นขนัดจนถึงประตู ครั้นท่านยกจอกขึ้น ผู้ศรัทธาทั้งหมดก็สะดุ้งพร้อมกัน\n\nพวกเขารักท่าน พวกเขาสวดภาวนาถึงท่าน และที่ใดสักแห่งระหว่างทาง โดยไม่มีผู้ใดตั้งใจ พวกเขาเริ่มกลัวท่านยิ่งกว่ากลัวสวรรค์"
 eternal_maiden.0409.a: "“สมควรแล้ว”"
 eternal_maiden.0409.b: "เดินไปท่ามกลางพวกเขา สัมผัสทุกมือ ให้ความรักกลับคืนมา"
 eternal_maiden.0409.c: "ให้พวกเขามีทั้งสองอย่าง ความรักและความกลัวคือโซ่ตรวนที่แข็งแกร่งที่สุด"
