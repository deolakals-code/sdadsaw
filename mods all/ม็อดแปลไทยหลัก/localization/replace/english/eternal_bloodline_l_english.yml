 eternal_plot.1501.t: "สหายในราชสำนักอื่น"
 eternal_plot.1501.desc: "ท้องพระโรงอันยิ่งใหญ่ทุกแห่งล้วนต้องการสหายผู้ไม่รู้ว่าตนเป็นเพียงเบี้ยตัวหนึ่ง"
