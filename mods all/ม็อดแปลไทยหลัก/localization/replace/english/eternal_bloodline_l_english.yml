l_english:
 trait_eternal_bloodline: "สายเลือดแห่งเทพนิรันดร์"
 trait_eternal_bloodline_desc: "สายเลือดที่ต้องสาปและได้รับพรในคราเดียวกัน ผู้สืบสายเลือดนี้มิรู้แก่ มิรู้ตาย โรคภัยและยาพิษใดก็มิอาจกล้ำกราย กายมิเคยมีรอยแผลเป็น กองทัพมิเคยพ่ายแพ้ แว่นแคว้นก่อสร้างได้เร็วกว่าผู้อื่นสองเท่า และค้นพบวิทยาการใหม่ได้มากกว่าสิบเท่า"
 trait_eternal_bloodline_character_desc: "$trait_eternal_bloodline_desc$"
 eternal_bloodline_awakened_tt: "สายเลือดอมตะของท่านตื่นขึ้นแล้ว นับแต่นี้ไม่มีผู้ใดปลิดชีพท่านได้อีก"
 eternal_bloodline_worshipped_modifier: "ผู้ได้รับการบูชาดุจเทพเจ้า"
 eternal_bloodline_worshipped_modifier_desc: "ราษฎรพากันกราบกรานต่อผู้ที่จะไม่มีวันดับสูญ"
 eternal_bloodline.0001.t: "รุ่งอรุณแห่งนิรันดร์"
 eternal_bloodline.0001.desc: "ในราตรีที่แสงจันทร์สาดส่องผ่านบานหน้าต่าง ท่านรู้สึกถึงบางสิ่งเคลื่อนไหวอยู่ในสายโลหิต เป็นประกายไฟที่จะไม่มีวันมอดดับ บาดแผลเก่าปิดสนิทในชั่วพริบตา ผิวกายกลับคืนสู่ความสมบูรณ์ดังเดิม บัดนี้ท่านตระหนักแล้วว่า...ตนจะไม่มีวันตาย"
 eternal_bloodline.0001.a: "“[ROOT.Char.GetFirstName] ผู้เป็นนิรันดร์...ข้าพร้อมแล้ว”"
 eternal_bloodline.0002.t: "เสียงแห่งราษฎร"
 eternal_bloodline.0002.desc: "ข่าวลือแพร่สะพัดไปทั่วหมู่ไพร่ฟ้าว่า ผู้ปกครองแผ่นดินนี้หาใช่มนุษย์สามัญไม่ ผู้คนพากันมาชุมนุมหน้าประตูวัง คุกเข่าลงกราบไหว้อธิษฐาน ท่านจะทำเช่นไรกับศรัทธาของพวกเขา"
 eternal_bloodline.0002.a: "“รับการบูชาเถิด ข้าคืออมตะผู้อยู่เหนือมนุษย์ทั้งปวง”"
 eternal_bloodline.0002.b: "“ปฏิเสธเสีย ข้ายังเป็นผู้รับใช้ราษฎรอยู่เช่นเดิม”"
 eternal_bloodline.0003.t: "มือสังหารผู้อาภัพ"
 eternal_bloodline.0003.desc: "บุรุษผู้หนึ่งลอบเข้ามาในวังพร้อมกริชอาบยาพิษ แล้วถาโถมเข้าใส่ท่าน...ทว่ายาพิษนั้นไร้ผลโดยสิ้นเชิง บาดแผลสมานตัวในพริบตา มือสังหารหน้าซีดเผือดแล้ววิ่งหนีไปด้วยความหวาดผวา เขาจะนำเรื่องนี้ไปเล่าขานทั่วแผ่นดิน"
 eternal_bloodline.0003.a: "“ปล่อยมันไป ความหวาดกลัวที่มันหว่านไว้คือกำลังของข้า”"
 eternal_divine_knight: "อัศวินเทวา"
 eternal_divine_knight_desc: "ทหารม้าเกราะหนักผู้ปฏิญาณตนต่อสายเลือดอมตะ กำลังพลแปดสิบนาย ไม่ต้องเสียค่าบำรุง มีเพียงผู้สืบสายเลือดเท่านั้นที่ระดมพวกเขาได้"
 eternal_divine_knight_plural: "อัศวินเทวา"
 eternal_forage_expedition_decision: "ทัพหาเสบียงนิรันดร์"
 eternal_forage_expedition_decision_desc: "ส่งทหารม้าออกตระเวนทั่วแผ่นดินเพื่อหาเสบียงและของปล้นสะดม จะไปไกลเพียงใดก็ได้ เพราะผู้เป็นนิรันดร์มิรู้จักความเหนื่อยล้า"
 eternal_forage_expedition_decision_tooltip: "กวาดหาหรือปล้นชิงดินแดนโดยรอบเพื่อ[provisions|E]"
 eternal_forage_expedition_decision_confirm: "ออกเดินทัพ"
 eternal_expedition.0001.t: "ทัพหาเสบียงนิรันดร์"
 eternal_expedition.0001.desc: "ทหารม้าของท่านกระจายออกไปทั่วชนบท บ้างกลับมาพร้อมสัตว์ป่าและผลไม้จากสวน บ้างก็ทอดสายตาอันหิวกระหายไปยังพรมแดนของเพื่อนบ้าน"
 eternal_expedition.0001.a: "หาเสบียงจากผืนดิน"
 eternal_expedition.0001.b: "ปล้นเคาน์ตีข้างเคียง"
 eternal_annihilate_interaction: "มหาวินาศแห่งนิรันดร์"
 eternal_annihilate_interaction_desc: "ควบม้าลำพังไปยังแว่นแคว้นของเป้าหมาย กวาดล้างวงศ์ตระกูลของเป้าหมายจนสิ้น และบดขยี้กองทัพของแคว้นนั้นให้แหลกลาญ ท่านไม่มีวันตาย ท่านจะไปด้วยตนเองและริบทองกับของวิเศษของเป้าหมาย (ไม่รวมที่ดิน) พร้อม[provisions|E]อีก 1000 หน่วย ไม่มีผู้ใดจะรู้เลยว่าใครเป็นผู้ลงมือ โอกาสสำเร็จ 99%"
 eternal_annihilate.0001.t: "การเดินทางอันเดียวดาย"
 eternal_annihilate.0001.desc: "ท่านออกเดินทางเพียงลำพัง ไร้ไพร่พล ไร้ธงชัย มีเพียงนามของ[ROOT.Char.MakeScope.Var('eternal_annihilate_target').Char.GetTitledFirstName]กับหนทางที่ปลายทางคือความเงียบงัน"
 eternal_annihilate.0001.a: "“พวกมันจะไม่ทันเห็นข้ามาถึง”"
 eternal_annihilate.0002.t: "ความเงียบเข้าครอบงำ"
 eternal_annihilate.0002.desc: "ไม่มีสิ่งใดขวางท่านได้ ทั้งกำแพง ทหารยาม หรือคำสวดอ้อนวอน ครั้นท่านก้าวออกจากท้องพระโรงของแคว้นนั้น สายเลือดของเป้าหมายก็เหลือเพียงเถ้าธุลี และกองทัพของแคว้นก็แตกพ่ายย่อยยับ"
 eternal_annihilate.0002.a: "“เสร็จสิ้นแล้ว”"
 eternal_annihilate.0002.b: "“คมดาบเล่มเดียวที่หลุดมือ แคว้นนั้นจึงยังไม่สิ้น”"
 eternal_annihilated_army_modifier: "กองทัพถูกกวาดล้าง"
 eternal_annihilated_army_modifier_desc: "อมตะเพียงผู้เดียวฟันฝ่าทัพทั้งทัพ ไพร่พลยังมิอาจฟื้นคืน"
 eternal_annihilate.0003.t: "เสียงกระซิบในท้องพระโรงร้าง"
 eternal_annihilate.0003.desc: "กวีขับขานถึงโรคระบาด คำสาป และวงศ์ตระกูลที่สาบสูญ ทว่าไม่มีผู้ใดเอ่ยนามของท่านเลย ในราชสำนักที่ท่านผ่านไป ผู้คนลดเสียงลงแล้วเหลือบมองเงามืด ท่านปล่อยให้พวกเขาคาดเดากันต่อไป บัลลังก์ที่มั่นคงที่สุดคือบัลลังก์ที่ไม่มีผู้ใดมองเห็น"
 eternal_annihilate.0003.a: "“ให้โลกหวาดกลัวสิ่งที่มันเรียกนามไม่ได้”"
 eternal_shadow_sovereign_modifier: "จอมราชันในเงามืด"
 eternal_shadow_sovereign_modifier_desc: "อำนาจที่แท้จริงไม่เคยนั่งบนบัลลังก์ นามของมันถูกเอ่ยถึงได้เพียงแผ่วเบาดุจเสียงกระซิบ"
 eternal_machinations.0100.t: "เมล็ดพันธุ์แห่งคำเท็จ"
 eternal_machinations.0100.desc: "เรื่องเล่าหนึ่งถูกกระซิบในโรงเตี๊ยม แล้วก็มีอีกเรื่องตามมา ไม่มีเรื่องใดเป็นความจริง ทว่าทุกเรื่องล้วนน่าเชื่อ"
 eternal_machinations.0100.a: "“ปล่อยให้มันแพร่ไป”"
 eternal_machinations.0101.t: "คำเท็จหยั่งราก"
 eternal_machinations.0101.desc: "เรื่องเล่าข้ามทุ่งนาและตลาดไปแล้ว ชาวบ้านบอกต่อกันโดยไม่รู้ว่ามันเริ่มต้นจากที่ใด"
 eternal_machinations.0101.a: "“ปล่อยให้พวกมันเชื่อไป”"
 eternal_machinations.0102.t: "ผู้ปกครองผู้ล่มสลาย"
 eternal_machinations.0102.desc: "ผู้ปกครองต้องอัปยศต่อหน้าราษฎรของตนเอง ไม่มีผู้ใดบอกได้ว่าใครเป็นต้นเรื่อง"
 eternal_machinations.0102.a: "“พวกมันไม่เคยรู้แม้แต่นามของข้า”"
 eternal_machinations.0200.t: "กระซิบถึงเหล่าข้าหลวง"
 eternal_machinations.0200.desc: "จดหมายไร้นามส่งถึงตระกูลใหญ่ทุกตระกูล ทุกฉบับเอ่ยเป็นนัยถึงการหยามหมิ่นที่เจ้าเหนือหัวไม่เคยกระทำ"
 eternal_machinations.0200.a: "“หว่านเมล็ดแห่งความแคลงใจ”"
 eternal_machinations.0201.t: "เหล่าขุนนางแปรพักตร์"
 eternal_machinations.0201.desc: "เหล่าข้าหลวงลอบนัดพบกัน ต่างคนต่างมั่นใจว่ามีเพียงตนเท่านั้นที่ถูกกระทำย่ำยี"
 eternal_machinations.0201.a: "“ปล่อยให้แผ่นดินฉีกตัวเองเป็นเสี่ยงๆ”"
 eternal_machinations.0300.t: "จอกอาบยาพิษ"
 eternal_machinations.0300.desc: "สาส์นปลอมเดินทางไปมาระหว่างสองบัลลังก์ แต่ละฉบับหยามเหยียดอีกฝ่ายด้วยถ้อยคำของอีกฝ่ายเอง"
 eternal_machinations.0300.a: "“ส่งสาส์นไปเถิด”"
 eternal_machinations.0301.t: "ธงศึกถูกชูขึ้น"
 eternal_machinations.0301.desc: "ผู้ปกครองผู้ทระนงสองพระองค์ต่างเชื่อว่าอีกฝ่ายต่ำช้าที่สุด และพระองค์หนึ่งก็ระดมพลใต้ธงของตน"
 eternal_machinations.0301.a: "“สงครามที่เกิดจากคำเท็จเพียงคำเดียว”"
 eternal_machinations.0400.t: "โรคระบาดที่ไม่เคยมีอยู่จริง"
 eternal_machinations.0400.desc: "ผู้ป่าวประกาศร้องว่าโรคระบาดมาถึงเมืองหลวงแล้ว ทั้งที่ไม่มีโรคใดเลย กระนั้นตลาดก็ยังร้างผู้คนไม่ผิดกัน"
 eternal_machinations.0400.a: "“ปล่อยให้พวกมันตื่นตระหนก”"
 eternal_machinations.0401.t: "นครที่อดอยากเพราะความกลัว"
 eternal_machinations.0401.desc: "การค้าหยุดชะงัก ประตูเมืองถูกลงกลอนกั้นโรคร้ายที่ไม่มีผู้ใดเคยเห็น"
 eternal_machinations.0401.a: "“ความกลัวราคาถูกกว่ากองทัพ”"
 eternal_machinations.0500.t: "ยาพิษอันเงียบงัน"
 eternal_machinations.0500.desc: "นักเทศน์ วณิพก และพ่อค้าเร่ ต่างเล่าถึงความอยุติธรรมที่มองไม่เห็นเรื่องเดียวกัน ไพร่ฟ้าเริ่มเงี่ยหูฟัง"
 eternal_machinations.0500.a: "“ให้ราษฎรเป็นปากเสียงแทนข้า”"
 eternal_machinations.0501.t: "ความหิวโหยและโทสะ"
 eternal_machinations.0501.desc: "ไร่นาถูกทิ้งร้าง เจ้าพนักงานเก็บภาษีถูกขับไล่กลับจากประตูเมือง ไพร่ฟ้ามิไว้ใจผู้ใดอีกแล้ว"
 eternal_machinations.0501.a: "“พวกมันคิดว่านั่นเป็นความคิดของตนเอง”"
 eternal_rumor_interaction: "ปล่อยเรื่องเล่าเท็จ"
 eternal_rumor_interaction_desc: "หว่านเรื่องเล่าลงในหมู่ไพร่ฟ้า ทุกเคาน์ตีในแว่นแคว้นของเป้าหมายจะหันมาต่อต้านเขา และจะไม่มีผู้ใดรู้ว่าใครเป็นผู้เริ่ม"
 eternal_incite_vassals_interaction: "ยุยงเหล่าข้าหลวง"
 eternal_incite_vassals_interaction_desc: "วางยาพิษในใจข้าหลวงทุกคนให้ชิงชังเป้าหมาย แล้วปล่อยให้ฝักฝ่ายในแคว้นทำส่วนที่เหลือเอง"
 eternal_feud_interaction: "ใส่ร้ายจนเกิดศึก"
 eternal_feud_interaction_desc: "ปลอมแปลงถ้อยคำหยามหมิ่นระหว่างเป้าหมายกับผู้ปกครองข้างเคียง สิทธิ์เหนือดินแดนจะถูกทวงถาม และสงครามจะถูกประกาศ"
 eternal_false_calamity_interaction: "กุเรื่องหายนะ"
 eternal_false_calamity_interaction_desc: "ปล่อยข่าวโรคระบาดหรือภัยพิบัติ เมืองหลวงจะทุกข์ยากไปอีกหลายปี"
 eternal_sow_commoners_interaction: "หว่านความไม่สงบในหมู่ไพร่ฟ้า"
 eternal_sow_commoners_interaction_desc: "ยุยงไพร่ฟ้าในแว่นแคว้นของเป้าหมายให้ต่อต้านขุนนางทุกผู้ ภาษีและไพร่พลจะพังทลาย"
 eternal_rumor_county_modifier: "คำเท็จที่กระซิบกัน"
 eternal_rumor_county_modifier_desc: "เรื่องเท็จเรื่องหนึ่งอยู่บนปากของทุกผู้คน"
 eternal_false_calamity_county_modifier: "โรคระบาดในจินตนาการ"
 eternal_false_calamity_county_modifier_desc: "ผู้คนหนีภัยพิบัติที่ไม่เคยมาถึง"
 eternal_commoner_unrest_county_modifier: "ความขุ่นเคืองอันเงียบงัน"
 eternal_commoner_unrest_county_modifier_desc: "ไพร่ฟ้ามิไว้ใจขุนนางผู้ใดอีก"
 eternal_incited_opinion: "ถูกยุยงให้ชิงชัง"
 eternal_slandered_opinion: "หลงเชื่อถ้อยคำหยามหมิ่นที่ปลอมขึ้น"
 eternal_heirs_plot_interaction: "วางยาพิษในใจทายาท"
 eternal_heirs_plot_interaction_desc: "กระซิบกับทายาทสองคนของเป้าหมายว่าอีกฝ่ายหมายปองส่วนแบ่งของตน เลือดอาจหลั่งตามมา และไม่มีผู้ใดแน่ใจได้เลยว่าใครเป็นต้นเหตุ"
 eternal_plot.0101.t: "สองจอก หนึ่งยาพิษ"
 eternal_plot.0101.desc: "ราชินีมิจำเป็นต้องยกดาบขึ้นเอง เพียงสอนพี่น้องสองคนให้รู้จักนับว่าอีกฝ่ายจะได้มรดกไปเท่าใดก็เพียงพอ"
 eternal_plot.0101.a: "กระซิบผ่านนางกำนัลคนสนิท"
 eternal_plot.0101.b: "จ้างกวีให้ขับขานเรื่องความแค้นแต่หนหลัง"
 eternal_plot.0101.c: "ปลอมจดหมายด้วยลายมือของทายาทแต่ละคน"
 eternal_plot.0101.d: "ยังมิใช่เวลา ฤกษ์ยังไม่เป็นใจ"
 eternal_plot.0102.t: "ความริษยาหยั่งราก"
 eternal_plot.0102.desc: "บรรดาทายาทเริ่มจ้องมองกันและกันที่โต๊ะเสวย บางส่วนเป็นฝีมือของท่าน ส่วนที่เหลือเป็นเพียงสันดานมนุษย์"
 eternal_plot.0102.a: "โหมไฟให้ลุกโชนจนผู้หนึ่งคว้ามีดขึ้นมา"
 eternal_plot.0102.b: "ถอยออกมา ปล่อยให้หัวใจของพวกมันทำงานแทน"
 eternal_plot.0102.f: "บ่าวผู้หนึ่งนึกขึ้นได้ถึงมือคู่หนึ่งที่ไม่ควรอยู่ในห้องของเด็ก"
 eternal_parent_plot_interaction: "เร่งวันสืบทอด"
 eternal_parent_plot_interaction_desc: "โน้มน้าวทายาทของเป้าหมายให้เชื่อว่าบัลลังก์ถูกกีดกันไว้จากตน ลูกที่อดทนบางคราก็หมดความอดทนได้"
 eternal_plot.0201.t: "น้ำหนักแห่งมงกุฎ"
 eternal_plot.0201.desc: "ทายาททุกผู้ล้วนรอคอย แต่น้อยนักที่จะรอได้ชั่วกาลนาน เพียงเตือนด้วยถ้อยคำอ่อนโยนว่าพวกเขารอมานานเพียงใดแล้ว ก็เพียงพอ"
 eternal_plot.0201.a: "กล่าวคำลวงอันอ่อนโยนเรื่องพระพลานามัยของบิดาให้ทายาทฟัง"
 eternal_plot.0201.b: "ชำระหนี้ลับของทายาทให้"
 eternal_plot.0201.c: "ยื่นพินัยกรรมปลอมให้ทายาทดู"
 eternal_plot.0201.d: "ยังมิใช่เวลา ฤกษ์ยังไม่เป็นใจ"
 eternal_plot.0202.t: "ทายาทผู้ใจร้อน"
 eternal_plot.0202.desc: "ทายาทมิกล้าสบตาบิดามารดาอีกต่อไป จอกใบหนึ่งถูกเตรียมไว้ในห้องเครื่องที่ห่างไกลจากท่าน"
 eternal_plot.0202.a: "โน้มกายเข้าไปใกล้ แล้วบอกยามที่แน่ชัดให้"
 eternal_plot.0202.b: "ปล่อยให้ความแคลงใจหมักหมมไปเอง"
 eternal_plot.0202.f: "ทายาทสารภาพถ้อยคำยุยงที่ได้ยินต่อนักบวช"
 eternal_bastard_plot_interaction: "กังขาในสายเลือด"
 eternal_bastard_plot_interaction_desc: "ปล่อยความแคลงใจว่าทายาทเป็นสายเลือดแท้ของผู้ปกครองหรือไม่ บัลลังก์จะมั่นคงได้เพียงเท่าความชอบธรรมของมัน"
 eternal_plot.0301.t: "เด็กผู้มีดวงตาของผู้อื่น"
 eternal_plot.0301.desc: "ไม่มีสิ่งใดทำร้ายราชวงศ์ได้เท่าประโยคเดียว คือ “เด็กคนนั้นหาได้เหมือนบิดาไม่”"
 eternal_plot.0301.a: "ปล่อยให้เรื่องซุบซิบของหมอตำแยแพร่ไปตามทางของมัน"
 eternal_plot.0301.b: "ซื้อพยานสักปาก แล้วฝังค่าจ้างให้มิดชิด"
 eternal_plot.0301.c: "ว่าจ้างช่างวาดภาพเหมือนที่บอกทุกสิ่งโดยไม่ต้องเอ่ยปาก"
 eternal_plot.0301.d: "ยังมิใช่เวลา ฤกษ์ยังไม่เป็นใจ"
 eternal_plot.0302.t: "ข่าวลือตกตะกอน"
 eternal_plot.0302.desc: "เหล่าข้าราชสำนักพินิจใบหน้าของทายาทใต้แสงคบเพลิง ผู้ปกครองเลิกยิ้มให้พวกเขาแล้ว"
 eternal_plot.0302.a: "เรียกหมอหลวงมายืนยัน"
 eternal_plot.0302.b: "ไม่ต้องกล่าวสิ่งใดอีก ปล่อยให้ความแคลงใจทำงานอย่างเชื่องช้า"
 eternal_plot.0302.f: "เอกสารปลอมถูกสาวไปถึงอาลักษณ์ที่ท่านเคยว่าจ้าง"
 eternal_forgotten_plot_interaction: "ปลุกทายาทที่ถูกลืม"
 eternal_forgotten_plot_interaction_desc: "เตือนน้องผู้เกิดทีหลังว่าตนก็มีสิทธิ์อ้างสิทธิ์เช่นกัน แว่นแคว้นที่มีทายาทสองคนก็เท่ากับไม่มีทายาทเลย"
 eternal_plot.0401.t: "บุตรผู้เกิดเป็นคนที่สอง"
 eternal_plot.0401.desc: "บุตรที่ถูกมองข้ามคือผู้ที่อันตรายที่สุด เพราะพวกเขาใช้เวลาหลายปีเรียนรู้ว่าตนถูกพรากสิ่งใดไป"
 eternal_plot.0401.a: "ส่งจดหมายอ่อนโยนพร้อมผังวงศ์ตระกูลไปให้"
 eternal_plot.0401.b: "อุดหนุนพันธมิตรให้คอยเยินยอความทะเยอทะยานของเขา"
 eternal_plot.0401.c: "เปิดเผยถ้อยคำที่พี่ผู้เกิดก่อนเคยกล่าวถึงเขา"
 eternal_plot.0401.d: "ยังมิใช่เวลา ฤกษ์ยังไม่เป็นใจ"
 eternal_plot.0402.t: "สิทธิ์ที่ถูกปลุกคืน"
 eternal_plot.0402.desc: "ทายาทผู้น้องเริ่มกล่าวถึงสิ่งที่ตนพึงได้ เหล่าข้าราชสำนักกำลังเลือกข้าง"
 eternal_plot.0402.a: "ยัดธงผืนหนึ่งใส่มือเขา"
 eternal_plot.0402.b: "ทิ้งสำเนาผังวงศ์ตระกูลไว้ แล้วเดินจากไป"
 eternal_plot.0402.f: "ทายาทผู้พี่ดักยึดจดหมายของท่านได้"
 eternal_spouse_plot_interaction: "พลิกใจคู่ครอง"
 eternal_spouse_plot_interaction_desc: "บ่มเพาะความขุ่นแค้นในใจคู่ครองของผู้ปกครอง การสมรสย่อมสิ้นสุดได้หลายหนทาง"
 eternal_plot.0501.t: "ฟากที่เย็นเยียบของแท่นบรรทม"
 eternal_plot.0501.desc: "ไม่มีผู้ใดรู้จุดอ่อนของผู้ปกครองได้ดีเท่าผู้ที่ร่วมห้องบรรทม"
 eternal_plot.0501.a: "ส่งผู้รับฟังด้วยใจเมตตาและถ้อยคำอ่อนโยนไปให้"
 eternal_plot.0501.b: "มอบของกำนัลที่ผู้ปกครองไม่เคยให้"
 eternal_plot.0501.c: "บอกเป็นนัยถึงสิ่งที่ผู้ปกครองคิดจะทำกับเขา"
 eternal_plot.0501.d: "ยังมิใช่เวลา ฤกษ์ยังไม่เป็นใจ"
 eternal_plot.0502.t: "การทรยศอันเงียบงัน"
 eternal_plot.0502.desc: "บัดนี้คู่ครองมีรอยยิ้มที่ผู้ปกครองอ่านไม่ออก ความลับถูกแบ่งปันในที่สุด"
 eternal_plot.0502.a: "กระซิบนามหนึ่งนาม พร้อมขวดยาหนึ่งขวด"
 eternal_plot.0502.b: "เป็นเพียงมิตร ปล่อยให้เขาตัดสินใจเอง"
 eternal_plot.0502.f: "คู่ครองผงะถอย แล้วนำจดหมายของท่านไปทูลผู้ปกครอง"
 eternal_feast_plot_interaction: "จัดงานเลี้ยงอาบยาพิษ"
 eternal_feast_plot_interaction_desc: "เชิญข้าหลวงของเป้าหมายมาร่วมงานเลี้ยงที่โอฬารอย่างหาที่เปรียบมิได้ ความกตัญญูคือตะขอที่ไม่มีวันขึ้นสนิม"
 eternal_plot.0601.t: "โต๊ะที่จัดไว้รอคนทรยศ"
 eternal_plot.0601.desc: "อาวุธที่ร้ายกาจที่สุดของราชินีคือการต้อนรับขับสู้ ไม่มีสิ่งใดผูกมัดบุรุษได้เท่าการได้อิ่มหนำที่โต๊ะของท่าน"
 eternal_plot.0601.a: "เสิร์ฟสุราเรียบง่ายกับเสน่ห์อันจริงใจ"
 eternal_plot.0601.b: "ไม่เสียดายสิ่งใดเพื่อแขกเหรื่อ"
 eternal_plot.0601.c: "ให้แขกทุกผู้กลับไปพร้อมความลับที่ติดค้างท่าน"
 eternal_plot.0601.d: "ยังมิใช่เวลา ฤกษ์ยังไม่เป็นใจ"
 eternal_plot.0602.t: "แขกเหรื่อลากลับ"
 eternal_plot.0602.desc: "สาส์นขอบคุณทยอยมาถึง ทุกฉบับอบอุ่นยิ่งกว่าความภักดีที่เคยมีมา"
 eternal_plot.0602.a: "เตือนพวกเขาว่ายังติดค้างสิ่งใดอยู่"
 eternal_plot.0602.b: "ปล่อยให้น้ำใจที่ต้อนรับพูดแทนตัวเอง"
 eternal_plot.0602.f: "แขกผู้หนึ่งรู้ตัวว่าคำอวยพรทั้งหลายถูกเตรียมบทไว้ล่วงหน้า"
 eternal_ward_plot_interaction: "ให้ที่พึ่งแก่ผู้ถูกทอดทิ้ง"
 eternal_ward_plot_interaction_desc: "ผูกมิตรกับบุตรที่ถูกละเลยของเป้าหมาย ความกตัญญูยังคงอยู่ได้นานหลังความรักของบิดามารดาจืดจางไปแล้ว"
 eternal_plot.0701.t: "หัตถ์อันอ่อนโยน"
 eternal_plot.0701.desc: "นางไม่เคยขึ้นเสียง เพียงแต่รับฟังในยามที่ไม่มีผู้ใดรับฟัง"
 eternal_plot.0701.a: "ส่งของกำนัลอันอ่อนโยนไปโดยไม่ออกนาม"
 eternal_plot.0701.b: "เสนอการศึกษาและครูผู้สอนให้"
 eternal_plot.0701.c: "เชิญพวกเขามายังราชสำนักของท่านอย่างเงียบเชียบ"
 eternal_plot.0701.d: "ยังมิใช่เวลา ฤกษ์ยังไม่เป็นใจ"
 eternal_plot.0702.t: "เด็กผู้จดจำ"
 eternal_plot.0702.desc: "บัดนี้เด็กที่ถูกทอดทิ้งกล่าวถึงท่านด้วยความอบอุ่นที่ไม่เคยมอบให้ครอบครัวของตนเลย"
 eternal_plot.0702.a: "เป็นผู้ที่เขาไว้ใจคนแรก"
 eternal_plot.0702.b: "เมตตาโดยไม่ขอสิ่งใดตอบแทน"
 eternal_plot.0702.f: "ผู้ปกครองสังเกตเห็นของกำนัลแล้วส่งคืนมา"
 eternal_mediate_plot_interaction: "ไกล่เกลี่ยสันติภาพจอมปลอม"
 eternal_mediate_plot_interaction_desc: "ก้าวเข้าไปเป็นผู้ไกล่เกลี่ยในสงครามที่ท่านเองช่วยโหมให้ยืดเยื้อ แล้วรับคำขอบคุณจากทั้งสองฝ่าย"
 eternal_plot.0801.t: "ค่าตอบแทนของผู้สร้างสันติ"
 eternal_plot.0801.desc: "สงครามที่ให้กำไรมากที่สุด คือสงครามที่ท่านเป็นผู้ยุติเอง"
 eternal_plot.0801.a: "เสนอความช่วยเหลืออย่างสง่างาม"
 eternal_plot.0801.b: "เรียกค่าตอบแทนพอประมาณ"
 eternal_plot.0801.c: "เรียกราคาเป็นหัวเมืองและความโปรดปราน"
 eternal_plot.0801.d: "ยังมิใช่เวลา ฤกษ์ยังไม่เป็นใจ"
 eternal_plot.0802.t: "หมึกแห้งสนิท"
 eternal_plot.0802.desc: "ทั้งสองทัพวางอาวุธ ผู้ปกครองทั้งสองต่างก้มศีรษะให้ผู้ที่ทำให้ทุกสิ่งเป็นไปได้"
 eternal_plot.0802.a: "รับบำเหน็จอันยิ่งใหญ่"
 eternal_plot.0802.b: "ปฏิเสธทอง รับไว้เพียงความกตัญญู"
 eternal_plot.0802.f: "ฝ่ายหนึ่งล่วงรู้ว่าใครเป็นผู้สุมไฟ"
 eternal_lull_plot_interaction: "กล่อมด้วยคำสรรเสริญ"
 eternal_lull_plot_interaction_desc: "สรรเสริญเป้าหมายต่อหน้าธารกำนัลอย่างท่วมท้น ผู้ปกครองที่รู้สึกว่าตนเป็นที่รักย่อมลืมเฝ้าระวังเงามืด"
 eternal_plot.0901.t: "คำเยินยอดุจสุรา"
 eternal_plot.0901.desc: "เขาคิดว่าท่านชื่นชมเขา โดยไม่รู้เลยว่าสิ่งที่ท่านชื่นชมคือช่องโหว่ของทหารองครักษ์"
 eternal_plot.0901.a: "เขียนสาส์นอันสง่างาม"
 eternal_plot.0901.b: "ส่งของกำนัลอันหรูหรา"
 eternal_plot.0901.c: "ยกย่องเขาต่อหน้าราชสำนัก"
 eternal_plot.0901.d: "ยังมิใช่เวลา ฤกษ์ยังไม่เป็นใจ"
 eternal_plot.0902.t: "การระวังตัวที่หย่อนยาน"
 eternal_plot.0902.desc: "เป้าหมายเริ่มหลับใหลอย่างสนิท ทหารยามของเขาก็มึนเมาด้วยคำเยินยอไม่ต่างกัน"
 eternal_plot.0902.a: "ให้เขาสาบานเป็นมิตร"
 eternal_plot.0902.b: "อบอุ่นต่อเขา แต่ปล่อยให้เขาอยู่กับความระแวงของตนเอง"
 eternal_plot.0902.f: "เขาอ่านคำเยินยอ แล้วได้กลิ่นคมมีดที่ซ่อนอยู่เบื้องหลัง"
 eternal_faith_plot_interaction: "แตกแยกผู้ศรัทธา"
 eternal_faith_plot_interaction_desc: "ใส่ร้ายนิกายหนึ่งว่าเป็นต้นเหตุแห่งเคราะห์กรรมของแว่นแคว้น ผู้ศรัทธาจะทำส่วนที่เหลือเอง"
 eternal_plot.1101.t: "การแตกนิกายด้วยข่าวลือ"
 eternal_plot.1101.desc: "เทพเจ้ามิจำเป็นต้องขัดแย้งกัน ทว่าผู้ศรัทธาของพวกท่านย่อมขัดแย้งกันเสมอ"
 eternal_plot.1101.a: "หว่านข่าวลือในหมู่ผู้แสวงบุญ"
 eternal_plot.1101.b: "ติดสินบนนักเทศน์ให้ประณามนิกายคู่แข่ง"
 eternal_plot.1101.c: "ปลอมคำพยากรณ์แห่งหายนะ"
 eternal_plot.1101.d: "ยังมิใช่เวลา ฤกษ์ยังไม่เป็นใจ"
 eternal_plot.1102.t: "ผู้ศรัทธาแตกเป็นสองฝ่าย"
 eternal_plot.1102.desc: "บัดนี้ศาสนสถานต่างทะเลาะกันด้วยถ้อยคำที่ไม่มีผู้ใดจดจำได้ ผู้ปกครองมิอาจระงับพวกเขาได้อีก"
 eternal_plot.1102.a: "ทำให้รอยร้าวลึกยิ่งขึ้นด้วยปาฏิหาริย์"
 eternal_plot.1102.b: "ถอนตัวออกมา ปล่อยให้หลักคำสอนทำส่วนที่เหลือ"
 eternal_plot.1102.f: "ผู้ไต่สวนศรัทธาสาวคำพยากรณ์ปลอมไปถึงสายลับของท่าน"
 eternal_market_plot_interaction: "ทำให้ตลาดล่มสลาย"
 eternal_market_plot_interaction_desc: "ปล่อยข่าวพืชผลเสียหายและการเฉือนเหรียญ ความกลัวทำให้ท้องพระคลังว่างเปล่าได้มากกว่ากองทัพ"
 eternal_plot.1201.t: "เหรียญกลวง"
 eternal_plot.1201.desc: "ความตื่นตระหนกเดินทางเร็วกว่ากองคาราวานใดๆ เสียงกระซิบเท็จเพียงครั้งเดียวก็ทำให้ตลาดร้างผู้คน"
 eternal_plot.1201.a: "ปล่อยข่าวลือในหมู่พ่อค้า"
 eternal_plot.1201.b: "จ้างสายลับกว้านซื้อข้าวแล้วกักตุนไว้"
 eternal_plot.1201.c: "วางยาพิษในบ่อน้ำของเส้นทางค้าขายสามสาย"
 eternal_plot.1201.d: "ยังมิใช่เวลา ฤกษ์ยังไม่เป็นใจ"
 eternal_plot.1202.t: "ตลาดปิดตัว"
 eternal_plot.1202.desc: "พ่อค้าปฏิเสธเหรียญของแว่นแคว้น เจ้าพนักงานภาษีกลับมาพร้อมถุงเปล่า"
 eternal_plot.1202.a: "ทำลายโรงกษาปณ์เสียเลย"
 eternal_plot.1202.b: "ถอยออกมา ปล่อยให้ความกลัวดำเนินไปอย่างเงียบงัน"
 eternal_plot.1202.f: "สมาคมพ่อค้าระแวงว่ามีผู้ยุยงจากต่างแดน"
 eternal_wolf_plot_interaction: "ปล่อยฝูงหมาป่าออกล่า"
