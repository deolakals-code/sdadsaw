 eternal_plot.9501.c: "เทน้ำมันลงบนถ่านเพลิงให้มากขึ้น"
 eternal_plot.9501.d: "ปล่อยไว้ก่อน เมล็ดพันธุ์ย่อมรอได้"
 eternal_plot.9501.e: "ไว้ทุกข์ต่อหน้าผู้คน แล้วรับคำชื่นชมจากเรื่องนั้น"
 eternal_plot.9000.t: "คำถามในเงามืด"
 eternal_plot.9000.desc: "ความโศกเศร้ามากเกินไปเดินตามรอยท่านมา บรรดาผู้จดพงศาวดารเริ่มลากเส้นโยงเรื่องเหล่านั้นเข้าหากัน อีกไม่นานจะมีผู้เอ่ยนามของท่านออกมา"
