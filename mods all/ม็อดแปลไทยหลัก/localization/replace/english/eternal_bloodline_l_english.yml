 eternal_ledger_decision: "เปิดบัญชีลับ"
 eternal_ledger_decision_desc: "สมุดส่วนตัวที่จดหนี้สิน ความแค้น และกิจที่ยังค้างคา มีเพียงผู้เดียวเท่านั้นที่เคยอ่าน"
