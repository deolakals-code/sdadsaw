 eternal_plot.1302.t: "ธงศึกถูกชูขึ้น"
 eternal_plot.1302.desc: "บัดนี้สองราชสำนักต่างเชื่อว่าอีกฝ่ายต่ำช้าที่สุด ม้าเร็วควบไปมาทั้งสองทิศ"
