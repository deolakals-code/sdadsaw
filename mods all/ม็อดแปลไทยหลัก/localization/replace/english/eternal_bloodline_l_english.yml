 eternal_praise_plot_interaction: "เล่าขานคุณธรรม"
 eternal_praise_plot_interaction_desc: "ส่งสายลับไปกระซิบเรื่องความเมตตาของเป้าหมายในทุกโรงเตี๊ยมและตลาด ภายในสามสิบวันไพร่ฟ้าจะรักใคร่เขา และเขาอาจไม่มีวันรู้ว่าเพราะเหตุใด"
 eternal_plot.1601.t: "ชื่อเสียงที่ถูกปั้นแต่ง"
 eternal_plot.1601.desc: "ความรักมิได้เกิดจากการสมควรได้รับ หากเกิดจากการถูกเล่าขาน สายลับออกเดินทางแต่รุ่งสางพร้อมเรื่องเล็กๆ นับร้อย แต่ละเรื่องจริงพอที่จะบอกต่อได้"
 eternal_plot.1601.a: "ส่งสายลับที่ไว้ใจได้ไม่กี่คนพร้อมถ้อยคำอ่อนโยน"
 eternal_plot.1601.b: "จ้างกวีและวณิพกให้ขับขานคำสรรเสริญ"
 eternal_plot.1601.c: "ท่วมทุกตลาดด้วยปาฏิหาริย์และตำนาน"
 eternal_plot.1601.d: "ยังมิใช่เวลา ฤกษ์ยังไม่เป็นใจ"
 eternal_plot.1602.t: "ไพร่ฟ้าจดจำ"
 eternal_plot.1602.desc: "สามสิบวันต่อมา ชาวนาเอ่ยนามนั้นด้วยความกตัญญู ไม่มีผู้ใดบอกได้ว่าใครเล่าให้ฟังเป็นคนแรก"
 eternal_plot.1602.a: "ปล่อยให้ตำนานเติบโตจนเป็นเทพนิยาย"
 eternal_plot.1602.b: "หยุดเพียงเท่านี้ ให้รู้สึกว่าเป็นความคิดของพวกเขาเอง"
 eternal_plot.1602.f: "นักบวชผู้ช่างสงสัยสังเกตว่าคำสรรเสริญทั้งหลายเหมือนกันจนน่าระแวง"
 eternal_plot.9501.t: "คมมีดในครอบครัว"
 eternal_plot.9501.desc: "ในตระกูลใหญ่ ความทะเยอทะยานไม่เคยรอการอนุญาต"
 eternal_plot.9501.desc_dead: "ญาติผู้หนึ่งสิ้นชีพแล้ว และทุกผู้รู้ว่าเป็นคมมีดของผู้ใด ทว่าไม่มีใครสงสัยผู้ที่ลับคมมีดเล่มนั้นเลย"
 eternal_plot.9501.desc_alive: "ถ้อยคำถูกแลกเปลี่ยน ประตูถูกกระแทกปิด ยังไม่มีเลือดตก แต่เมล็ดพันธุ์ถูกหว่านลงแล้ว"
