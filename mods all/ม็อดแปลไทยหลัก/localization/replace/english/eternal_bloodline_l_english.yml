 eternal_plot.1501.b: "เสนอทรัพย์ให้เขาแลกกับงานที่มิได้เอ่ยนาม"
 eternal_plot.1501.c: "เสนอบัลลังก์ที่เขาปรารถนาอยู่ลึกๆ"
 eternal_plot.1501.d: "ยังมิใช่เวลา ฤกษ์ยังไม่เป็นใจ"
 eternal_plot.1502.t: "ข้าหลวงผู้ภักดี"
 eternal_plot.1502.desc: "บัดนี้ข้าหลวงผู้นั้นเอ่ยถึงท่านด้วยความอบอุ่น และเอ่ยถึงเจ้าเหนือหัวของตนด้วยความเย็นชา"
 eternal_plot.1502.a: "ทำให้ความภักดีของเขามิอาจแปรเปลี่ยน"
 eternal_plot.1502.b: "ให้เขาเพียงชอบพอท่านก็พอ"
