l_english:
 eternal_royal_summons_interaction: "พระราชโองการเรียกตัว"
 eternal_royal_summons_interaction_desc: "ส่งรถม้าไปรับผู้ใดก็ได้มาเข้าเฝ้าสตรีศักดิ์สิทธิ์ ผู้ปฏิเสธจะถูกประหาร"
 eternal_summons_result_ok: "เป็นอันสิ้นเรื่อง"
 eternal_summons.0001.t: "รถม้าหน้าประตู"
 eternal_summons.0001.desc: "มิใช่ราชทูตที่มา แต่เป็นรถม้า ลงรักดำ ม้าขาว ทหารคุ้มกันที่มิกล่าวสิ่งใด ตราประทับบนจดหมายเป็นของสตรีศักดิ์สิทธิ์ และจดหมายมีเพียงประโยคเดียวว่า \"เจ้าถูกเรียกตัว\"\n\nสารถียืนรอพลางถือหมวกในมือ และมิเงยหน้า เขาเคยทำเช่นนี้มาแล้ว เขารู้ว่าผู้ที่ปฏิเสธเป็นเช่นไร และเขาเคยขับรถนำบางคนกลับบ้านเป็นชิ้น ๆ"
 eternal_summons.0001.a: "ขึ้นรถไป ผู้ใดมิโต้แย้งสตรีศักดิ์สิทธิ์"
 eternal_summons.0001.b: "ปฏิเสธ ไม่มีผู้ใดสั่งมงกุฎได้"
 eternal_summons.0002.t: "ผู้ขัดขืน"
 eternal_summons.0002.desc: "คำปฏิเสธมาถึงในสามวัน ด้วยลายมือสุภาพยิ่ง [summon_guest.GetTitledFirstName]เสียใจที่กิจการบ้านเมืองมิอาจให้เดินทาง\n\nท่านมิตอบ ท่านส่งรถม้ากลับไป พร้อมนายทหารองครักษ์คนเดียวกับคำสั่งเดียว เมื่อข่าวกลับมาถึงท่าน ก็เป็นข่าวเก่าแล้ว อาณาจักรนั้นมีงานศพและการสืบสันตติวงศ์ และทุกราชสำนักในระยะหนึ่งเดือนม้าได้ปรับความเห็นต่อคำว่า \"ไม่\" อย่างเงียบ ๆ"
 eternal_summons.0002.a: "ให้ความกลัวทำงานที่เหลือเอง"
 eternal_summons.0002.b: "สวดภาวนาให้วิญญาณ ไม่ต้องเสียสิ่งใด และให้ความฝันสงบ"
 eternal_summons.0010.t: "รถม้ามาถึง"
 eternal_summons.0010.desc: "รถม้าดำเคลื่อนผ่านประตูพระราชวังยามสนธยา และ[summon_guest.GetTitledFirstName]ก้าวลงด้วยขาที่ยังมิคืนจากหนทาง ข้าราชบริพารก้มหน้า ในราชสำนักนี้มิเคยมีผู้ใดเห็นแขกที่ถูกเรียกจากไปในสภาพเดิมเมื่อมา\n\nบัดนี้แขกเป็นของท่าน เนิ่นนานเท่าที่ท่านกำหนด หนึ่งปักษ์ หนึ่งฤดู หนึ่งปี หรือหลายปีที่เด็กหนึ่งคนอาจเกิดและหัดพูดได้"
 eternal_summons.0010.a: "หนึ่งปักษ์ บทเรียนสั้นและเฉียบ"
 eternal_summons.0010.b: "ครึ่งปี นานพอจะรู้จักพวกเขา"
 eternal_summons.0010.c: "หนึ่งปีเต็ม หนึ่งฤดูต่อหนึ่งอารมณ์"
 eternal_summons.0010.d: "ห้าปี ให้พระราชวังกลายเป็นโลกของพวกเขา"
 eternal_summons.0010.e: "จนกว่าข้าจะเบื่อ"
 eternal_summons.0100.t: "พระประสงค์ของสตรีศักดิ์สิทธิ์"
 eternal_summons.0100.desc: "แขกนั่งในห้องที่ท่านเลือก บนเก้าอี้ที่ต่ำกว่าปกติเล็กน้อย เป็นเรื่องเล็ก แต่พวกเขาสังเกต ผู้ที่หวาดกลัวย่อมสังเกตเรื่องเล็กทุกเรื่อง\n\nท่านคือสตรีศักดิ์สิทธิ์ ไม่มีกฎหมายใดเอื้อมถึงห้องนี้ ไม่มีพระองค์ใดกล้าก้าวเข้า และไม่มีเสียงใดที่นี่จะถูกเชื่อนอกห้อง คำถามมิใช่ว่าท่านทำสิ่งใดได้ คำถามคือท่านต้องการสิ่งใด"
 eternal_summons.0100.a: "งานเลี้ยง และเสน่ห์อันอดทน"
 eternal_summons.0100.b: "ห้องใต้ดิน และคำถามอันเงียบงัน"
 eternal_summons.0100.c: "ห้องบรรทมส่วนพระองค์ และราตรี"
 eternal_summons.0100.d: "คำปฏิญาณผูกพัน และที่นั่งข้างโต๊ะเสวย"
 eternal_summons.0100.e: "จุดจบ ในวันนี้"
 eternal_summons.1100.t: "โต๊ะอันยาวนาน"
 eternal_summons.1100.desc: "ท่านให้[summon_guest.GetTitledFirstName]นั่งข้างพระหัตถ์ขวา และเลี้ยงด้วยพระหัตถ์ของท่านเอง ท่านงามสง่า ขบขัน และสนใจไม่รู้จบ ท่านหัวเราะมุกของพวกเขา จำชื่อบุตรของพวกเขา และถามคำถามที่ไม่มีใครถามมาหลายปี\n\nเมื่อถึงอาหารจานที่สาม ไหล่ของพวกเขาผ่อนคลาย จานที่ห้า พวกเขาเล่าสิ่งที่สาบานว่าจะไม่เล่าแก่ผู้ใด เมื่อถึงการดื่มอวยพรสุดท้าย พวกเขามองท่านด้วยสิ่งที่เมื่อไม่นานเป็นความกลัว และบัดนี้เป็นสิ่งที่ยากจะเรียกชื่อ\n\nท่านยิ้ม และปล่อยให้พวกเขาเชื่อว่าเป็นความคิดของตนเอง"
 eternal_summons.2100.t: "ห้องใต้ดิน"
 eternal_summons.2100.desc: "ห้องใต้ดินของพระราชวังเก่าแก่ แห้งสนิท และเงียบสงัด ท่านมิลงไปเอง ไม่ใช่ในครั้งแรก ท่านส่งผู้ไต่ถาม และรออยู่เบื้องบนพร้อมหนังสือเล่มหนึ่ง เมื่อเสียงฝีเท้ากลับมา ท่านมิถามว่ากระทำสิ่งใด ท่านถามเพียงว่ากล่าวสิ่งใด\n\nสิ่งที่กล่าวอยู่ในรายงานเรียบร้อย และสิ่งที่กระทำเป็นสิ่งที่รายงานมิบรรยาย เมื่อท่านลงไปเยี่ยม[summon_guest.GetTitledFirstName]เอง พวกเขามิสบตาท่าน\n\nบางคนแตกสลาย บางคนมิ บางคนมิเหมือนเดิมอีกเลย และบางคนมิได้ขึ้นบันไดกลับมา"
 eternal_summons.3100.t: "ประตูที่ปิดสนิท"
 eternal_summons.3100.desc_f: "ประตูห้องบรรทมปิดลงเบื้องหลัง[summon_guest.GetTitledFirstName] และมหาดเล็กถูกปลดด้วยท่าทางเดียว ท่านรินสุราให้นางด้วยมือเอง มือมิสั่น และบอกนางเบา ๆ ว่านางพูดได้อย่างอิสระ\n\nนางมิพูด นางจ้องท่านดั่งสัตว์ที่ถูกล่าจ้องตะเกียง สิ่งที่เกิดขึ้นในห้องนั้นหลังจากนั้นมิถูกจดไว้ในพงศาวดารใด และมหาดเล็กที่ยืนนอกประตูจะไม่จำได้ว่าได้ยินสิ่งใดเลย\n\nเมื่อรุ่งสาง บางสิ่งเปลี่ยนไประหว่างท่านทั้งสอง มันย้อนคืนมิได้ และไม่มีผู้ใดเอ่ยชื่อมัน"
 eternal_summons.3100.desc_m: "ประตูห้องบรรทมปิดลงเบื้องหลัง[summon_guest.GetTitledFirstName] และมหาดเล็กถูกปลดด้วยท่าทางเดียว ท่านรินสุราให้เขาด้วยมือเอง มือมิสั่น และบอกเขาเบา ๆ ว่าเขาพูดได้อย่างอิสระ\n\nเขามิพูด เขาจ้องท่านดั่งสัตว์ที่ถูกล่าจ้องตะเกียง สิ่งที่เกิดขึ้นในห้องนั้นหลังจากนั้นมิถูกจดไว้ในพงศาวดารใด และมหาดเล็กที่ยืนนอกประตูจะไม่จำได้ว่าได้ยินสิ่งใดเลย\n\nเมื่อรุ่งสาง บางสิ่งเปลี่ยนไประหว่างท่านทั้งสอง มันย้อนคืนมิได้ และไม่มีผู้ใดเอ่ยชื่อมัน"
 eternal_summons.4100.t: "คำปฏิญาณข้างโต๊ะเสวย"
 eternal_summons.4100.desc: "ท่านมิขอทอง มิขอแผ่นดิน ท่านขอสิ่งเดียวที่ผู้ปกครองให้ซ้ำมิได้ คือคำปฏิญาณ สาบานบนมงกุฎของตน ณ แท่นบูชาของท่าน ต่อหน้าทุกราชสำนักที่ส่งพยานมา\n\n[summon_guest.GetTitledFirstName]สาบาน พวกเขามิได้รับทางเลือกและรู้ดี และกล่าวถ้อยคำด้วยเสียงชัดเจนอยู่ดี นับแต่นี้จดหมายของพวกเขาจะมาถึงท่านก่อนผู้ใด และนามท่านจะอยู่บรรทัดแรกของทุกสนธิสัญญาที่พวกเขาลงนาม\n\nท่านรำพึง นี่คือการพิชิตที่อ่อนโยนที่สุดเท่าที่มี"
 eternal_summons.5100.t: "จุดจบของการเข้าเฝ้า"
 eternal_summons.5100.desc: "ทำสำเร็จยามเช้า ในลานปราสาท ด้วยการฟันครั้งเดียว ท่านมองจากระเบียงและมิหันหน้าหนี มีผู้กล่าวว่าผู้ปกครองที่มองความยุติธรรมของตนมิได้ ย่อมไม่มีสิทธิ์ประทานมัน\n\nร่างถูกหามออกใต้ผ้าขาว ประชาชนกล่าวว่าสตรีศักดิ์สิทธิ์ทรงเมตตา เพราะรวดเร็ว พวกเขากล่าวเบา ๆ และมิเงยหน้า"
 eternal_summons.0200.t: "รถม้ากลับบ้าน"
 eternal_summons.0200.desc: "กำหนดที่ท่านตั้งไว้มาถึงแล้ว รถม้ารออยู่ในลานพร้อมม้าตัวใหม่และสารถีที่ถูกสั่งมิให้พูด [summon_guest.GetTitledFirstName]ยืนข้างรถด้วยหลังตรง\n\nชาวบ้านมีคำกล่าวแล้ว และมันเติบโตขึ้นทุกสัปดาห์ ผู้ใดถูกเรียกโดยสตรีศักดิ์สิทธิ์และรอดกลับบ้านได้ ย่อมแบกโชคของนางไปด้วย ข้าวของพวกเขาอุดม หลังคาของพวกเขาทน ลูกหลานพวกเขาสูงใหญ่ ไม่มีผู้ใดรู้ว่าใครเริ่ม ทุกคนกล่าวซ้ำ ของกำนัลที่ท่านให้ตอนลาจะกำหนดว่าพวกเขาเชื่อในพรนี้มากเพียงใด"
 eternal_summons.0200.a: "ถุงทอง ห้าเหรียญ ของที่ระลึกเล็กน้อย"
 eternal_summons.0200.b: "ถุงทอง สิบเหรียญ"
 eternal_summons.0200.c: "ถุงทอง ยี่สิบเหรียญ"
 eternal_summons.0200.d: "ถุงทอง ห้าสิบเหรียญ การอำลาแบบราชา"
 eternal_summons.0200.e: "เพียงพรของท่าน ให้พวกเขาสงสัยเอง"
 eternal_summons.1200.t: "ของที่ระลึกเล็กน้อย"
 eternal_summons.1200.desc: "ท่านวางถุงลงในมือ[summon_guest.GetTitledFirstName]เอง และกล่าวว่าสตรีศักดิ์สิทธิ์มิลืมผู้รับใช้ นั่นมิมาก ทุกคนในลานรู้ และด้วยเหตุใดมิทราบ มันกลับรู้สึกมีความหมายยิ่งขึ้น\n\nรถม้าเคลื่อนไป ในหมู่บ้านริมทาง เด็ก ๆ วิ่งเคียงรถพลางตะโกนคำกล่าวเก่า และข่าวลือเดินทางเร็วกว่าม้า"
 eternal_summons.2200.t: "ถุงทองพอเหมาะ"
 eternal_summons.2200.desc: "ถุงหนักพอรู้สึกในมือและเบาพอแบกไปโดยมิลำบาก ท่านบอก[summon_guest.GetTitledFirstName]ว่าสตรีศักดิ์สิทธิ์กตัญญู และหวังจะได้ยินข่าวพืชผลดี\n\nรถม้าออกไปด้วยย่างก้าวสม่ำเสมอ เมื่อถึงพรมแดน เจ้าหน้าที่ด่านรู้เรื่องแล้ว และโบกให้ผ่านพร้อมคำนับ"
 eternal_summons.3200.t: "ของกำนัลอันใจกว้าง"
 eternal_summons.3200.desc: "ท่านมอบทองยี่สิบเหรียญและพรที่กล่าวนานนัก [summon_guest.GetTitledFirstName]ซาบซึ้งอย่างเห็นได้ชัด แม้ทุกสิ่งที่ผ่านมา ความกตัญญู ท่านพบ เป็นโซ่ที่เชื่อถือได้ที่สุด\n\nหนทางกลับบ้านเรียงรายด้วยผู้คนที่มาดูรถผ่าน บางคนคุกเข่า บางคนโปรยดอกไม้ และหญิงชราคนหนึ่งเดินเคียงล้อรถหนึ่งชั่วโมง ริมฝีปากขยับเงียบ ๆ"
 eternal_summons.4200.t: "การอำลาแบบราชา"
 eternal_summons.4200.desc: "ท่านมอบทองห้าสิบเหรียญ ผ้าคลุมงามเลิศ และการอำลาในท้องพระโรงต่อหน้าทั้งราชสำนัก [summon_guest.GetTitledFirstName]ถูกพาไปยังรถม้าโดยทหารรักษาพระองค์ พร้อมคบเพลิงและกลองศึก ประหนึ่งกลับจากชัยชนะ มิใช่จากการถูกจองจำ\n\nเรื่องนี้จะถูกเล่าไปทั้งรุ่น สตรีศักดิ์สิทธิ์เรียกผู้ปกครองมาข้างกาย และส่งกลับไปดั่งราชา ในอาณาจักรของพวกเขา ระฆังลั่นตั้งแต่ชายแดนจนถึงนครหลวง"
 eternal_summons.5200.t: "เพียงพร"
 eternal_summons.5200.desc: "ท่านมิให้ทองเลย เพียงวางมือบนหน้าผาก[summon_guest.GetTitledFirstName]และกล่าวสามคำเบา ๆ มันมิทำให้ท่านเสียสิ่งใด และเป็นการอำลาที่น่าสะพรึงที่สุดในแบบของมัน เพราะไม่มีผู้ใดรู้ว่าถ้อยคำนั้นหมายความว่าอย่างไร\n\nรถม้าจากไปโดยไร้พิธี ชาวบ้านริมทางกระซิบว่าแขกถูกประทับตราแล้ว พวกเขามิแน่ใจว่าเป็นตราแห่งความโปรดปรานหรือความพินาศ และระวังให้เกียรติรถม้าทั้งสองทาง"
 eternal_fortune_0_modifier: "ผู้ถูกต้องพระหัตถ์"
 eternal_fortune_0_modifier_desc: "ประชาชนว่ามีพรทิ้งไว้บนหน้าผากของผู้ปกครองนี้ และอาณาจักรดีขึ้นอย่างเงียบ ๆ"
 eternal_fortune_1_modifier: "ผู้แบกโชคแห่งสตรีศักดิ์สิทธิ์"
 eternal_fortune_1_modifier_desc: "ชาวบ้านเชื่อว่าผู้ใดถูกเรียกโดยสตรีศักดิ์สิทธิ์ ย่อมนำโชคของนางกลับบ้าน และอาณาจักรจะรุ่งเรืองเพราะเหตุนั้น"
 eternal_fortune_2_modifier: "ผู้ถือโชคลาภแห่งสตรีศักดิ์สิทธิ์"
 eternal_fortune_2_modifier_desc: "ชาวบ้านเชื่อว่าผู้ใดถูกเรียกโดยสตรีศักดิ์สิทธิ์ ย่อมนำโชคของนางกลับบ้าน และอาณาจักรจะรุ่งเรืองเพราะเหตุนั้น"
 eternal_fortune_3_modifier: "ผู้ได้รับความโปรดปรานจากสตรีศักดิ์สิทธิ์"
 eternal_fortune_3_modifier_desc: "ชาวบ้านเชื่อว่าผู้ใดถูกเรียกโดยสตรีศักดิ์สิทธิ์ ย่อมนำโชคของนางกลับบ้าน และอาณาจักรจะรุ่งเรืองเพราะเหตุนั้น"
 eternal_fortune_4_modifier: "ผู้ได้รับมงกุฎจากสตรีศักดิ์สิทธิ์"
 eternal_fortune_4_modifier_desc: "ชาวบ้านเชื่อว่าผู้ใดถูกเรียกโดยสตรีศักดิ์สิทธิ์ ย่อมนำโชคของนางกลับบ้าน และอาณาจักรจะรุ่งเรืองเพราะเหตุนั้น"
 eternal_revival_0_modifier: "เมตตาของสตรีศักดิ์สิทธิ์"
 eternal_revival_0_modifier_desc: "ประชาชนว่ามีพรทิ้งไว้บนหน้าผากของผู้ปกครองนี้ และอาณาจักรยากจนเริ่มฟื้นตัวอย่างช้า ๆ"
 eternal_revival_1_modifier: "ผู้แบกความเมตตาแห่งสตรีศักดิ์สิทธิ์"
 eternal_revival_1_modifier_desc: "ชาวบ้านเชื่อว่าผู้ปกครองที่ถูกเรียกโดยสตรีศักดิ์สิทธิ์ ย่อมนำความเมตตาของนางกลับบ้าน และแม้อาณาจักรที่ล่มสลายก็จะลุกขึ้น"
 eternal_revival_2_modifier: "ผู้ถือความเมตตาแห่งสตรีศักดิ์สิทธิ์"
 eternal_revival_2_modifier_desc: "ชาวบ้านเชื่อว่าผู้ปกครองที่ถูกเรียกโดยสตรีศักดิ์สิทธิ์ ย่อมนำความเมตตาของนางกลับบ้าน และแม้อาณาจักรที่ล่มสลายก็จะลุกขึ้น"
 eternal_revival_3_modifier: "ผู้ได้รับการฟื้นฟูจากสตรีศักดิ์สิทธิ์"
 eternal_revival_3_modifier_desc: "ชาวบ้านเชื่อว่าผู้ปกครองที่ถูกเรียกโดยสตรีศักดิ์สิทธิ์ ย่อมนำความเมตตาของนางกลับบ้าน และแม้อาณาจักรที่ล่มสลายก็จะลุกขึ้น"
 eternal_revival_4_modifier: "ผู้ได้รับการยกขึ้นโดยสตรีศักดิ์สิทธิ์"
 eternal_revival_4_modifier_desc: "ชาวบ้านเชื่อว่าผู้ปกครองที่ถูกเรียกโดยสตรีศักดิ์สิทธิ์ ย่อมนำความเมตตาของนางกลับบ้าน และแม้อาณาจักรที่ล่มสลายก็จะลุกขึ้น"
 eternal_royal_progress_interaction: "เสด็จเยือนต่างแดน"
 eternal_royal_progress_interaction_desc: "เดินทางด้วยรถม้าผลัดม้าไปยังราชสำนักของผู้ปกครองต่างอาณาจักรและเยือนแว่นแคว้นของเขา"
 eternal_carriage_travel_modifier: "ม้าผลัดแห่งสตรีศักดิ์สิทธิ์"
 eternal_carriage_travel_modifier_desc: "ม้าสดรออยู่ทุกด่านตลอดทาง รถม้าเดินทางด้วยความเร็วของนักขี่ม้าแห่งทุ่งหญ้าใหญ่"
 eternal_carriage_rider_modifier: "ผู้ขี่ม้าผลัด"
 eternal_carriage_rider_modifier_desc: "ถูกนำพาด้วยม้าผลัดของสตรีศักดิ์สิทธิ์ เร็วกว่านักเดินทางทั่วไป"
 eternal_summons.0020.t: "การต้อนรับในราชสำนัก"
 eternal_summons.0020.desc: "แขกมาถึงแล้ว เปื้อนฝุ่นและเงียบงัน มหาดเล็กใหญ่รอสัญญาณ และทั้งราชสำนักกลั้นหายใจ วิธีที่สตรีศักดิ์สิทธิ์ต้อนรับผู้ปกครองที่ถูกเรียกจะถูกจดจำไปทั้งรุ่น"
 eternal_summons.0020.a: "ขบวนแห่ผ่านนคร พร้อมระฆังและธง"
 eternal_summons.0020.b: "งานเลี้ยงต้อนรับ พร้อมดนตรีและสุราชั้นเลิศ"
 eternal_summons.0020.c: "การเข้าเฝ้าอย่างเงียบงัน ไม่มีถ้อยคำและไม่มีเก้าอี้"
 eternal_summons.0020.d: "ชมท้องพระโรง แล้วลงสู่ห้องใต้ดิน"
 eternal_summons.0100.desc_pomp: "ถนนยังเต็มด้วยกลีบดอกไม้จากขบวนแห่ แขกจำได้ทุกระฆังและทุกใบหน้าที่คุกเข่า และตัดสินมิได้ว่าเป็นเกียรติหรือคำเตือน"
 eternal_summons.0100.desc_feast: "รสของงานเลี้ยงยังติดอยู่ แขกถูกเสน่ห์ด้วยอาหารและดนตรี และเกือบลืมเหตุที่ถูกพามา ชั่วขณะหนึ่ง"
 eternal_summons.0100.desc_quiet: "ความเงียบของการเข้าเฝ้ายังมิแตก แขกยืนมาหนึ่งชั่วโมง และทุกวินาทีสอนสิ่งหนึ่งเกี่ยวกับสตรีผู้เรียกพวกเขา"
 eternal_summons.0100.desc_dread: "แขกได้เห็นท้องพระโรงและบันไดที่ทอดลงเบื้องล่าง พวกเขามิได้รับการบอกว่าปลายบันไดมีสิ่งใด และมือมิหยุดสั่น"
 eternal_summons.0100.desc_none: "แขกรอฟังว่าสตรีศักดิ์สิทธิ์ทรงประสงค์สิ่งใด"
 eternal_summons.0030.t: "รถม้ากลางทาง"
 eternal_summons.0030.desc: "ม้าเร็วนำข่าวจากหนทาง รถม้าดำเปลี่ยนม้าที่ด่านที่สิบเอ็ดและกำลังวิ่งฝ่าราตรี ทหารคุ้มกันรายงานว่าผู้ปกครองที่ถูกเรียกมิกล่าวสักคำนับแต่ออกเดินทาง\n\nหนทางยาวนาน และมีอีกมากที่ทำต่อนักเดินทางได้ก่อนที่เขาจะมาถึงท่าน"
 eternal_summons.0030.a: "สั่งประสาทพรที่ศาลเจ้าริมทางตลอดเส้นทาง"
 eternal_summons.0030.b: "ให้กองคุ้มกันทดสอบแขกด้วยการดักซุ่มปลอม"
 eternal_summons.0030.c: "ให้รถม้าแวะเมืองชายแดน และให้ชาวบ้านได้เห็น"
 eternal_summons.1300.t: "ถึงบ้านเสียที"
 eternal_summons.1300.desc: "รถม้าดำแล่นผ่านประตูนครหลวงและจอดในลานกว้าง ราชสำนักรออยู่ ประชาชนเรียงรายตามถนน ผู้ยืนใกล้ล้อที่สุดกระซิบว่าใบหน้าของผู้ปกครองเปลี่ยนไป สงบขึ้น แข็งขึ้น และสว่างขึ้นเล็กน้อย ประหนึ่งมีตะเกียงถูกจุดอยู่เบื้องหลัง\n\nเล่ากันว่าผู้ใดถูกเรียกโดยสตรีศักดิ์สิทธิ์และกลับมา ย่อมนำโชคของนางกลับมาด้วย ทุกคนในนครหลวงตัดสินใจเชื่อเช่นนั้น"
 eternal_summons.1300.a: "จัดงานเลี้ยงใหญ่ฉลองการกลับมา"
 eternal_summons.1300.b: "เสด็จตรวจอาณาจักร ให้ประชาชนได้เห็นผู้ปกครองผู้ได้รับพร"
 eternal_summons.1300.c: "ประกาศพรของสตรีศักดิ์สิทธิ์จากระเบียงสูงสุด"
 eternal_summons.1310.t: "งานเลี้ยงแห่งการกลับมา"
 eternal_summons.1310.desc: "งานเลี้ยงดำเนินสามวัน สุราเก่าถูกนำขึ้นจากห้องใต้ดิน คนยากจนได้เลี้ยงในลานปราสาท และขุนนางทุกคนในอาณาจักรถูกให้ดื่มอวยพรสตรีศักดิ์สิทธิ์ ไม่ว่าจะชอบหรือไม่\n\nเมื่อถึงคืนสุดท้าย เรื่องเล่าก็ขยายใหญ่ว่าสตรีศักดิ์สิทธิ์ทรงจับพระหัตถ์ผู้ปกครองและกล่าวสามคำ และพืชผลเริ่มพลิกผันแล้ว"
 eternal_summons.1320.t: "การเสด็จตรวจอาณาจักร"
 eternal_summons.1320.desc: "ท่านเสด็จออกด้วยรถเปิด มณฑลแล้วมณฑลเล่า และทุกหมู่บ้านออกมาชม หญิงชราแตะล้อรถ เด็กถูกยกขึ้นบนบ่าบิดา คนเมาในลานโรงเตี๊ยมตะโกนว่าปีนี้ข้าวจะดี และเป็นครั้งแรกในสิบปี ที่ทุกคนเชื่อเขา\n\nเหนื่อยยิ่งนัก และเป็นสิ่งดีที่สุดที่ท่านเคยทำเพื่ออาณาจักร"
 eternal_summons.1330.t: "พรของสตรีศักดิ์สิทธิ์"
 eternal_summons.1330.desc: "ท่านยืนบนระเบียงสูงสุดของพระราชวัง และต่อหน้าทั้งนคร ท่านเอ่ยนามสตรีศักดิ์สิทธิ์ เล่าสิ่งที่นางกล่าว สิ่งที่นางขอ และสิ่งที่นางให้ ท่านระมัดระวังต่อความจริง มันน่าสะพรึงขึ้นและงดงามขึ้นเมื่อจัดการอย่างระมัดระวัง\n\nเมื่อท่านกล่าวจบ ลานเงียบ แล้วสตรีนางหนึ่งเริ่มขับร้อง และมันแพร่จากถนนสู่ถนน เมื่อเที่ยงคืน ครึ่งนครคุกเข่าอยู่"
 eternal_summons.0400.t: "สตรีศักดิ์สิทธิ์ในราชสำนักต่างแดน"
 eternal_summons.0400.desc: "รถม้าดำแล่นเข้านครหลวงของ[host_realm.GetTitledFirstName]ต่อหน้าสายตาทั้งเมือง ท่านก้าวลงในอาภรณ์ขาว ข้าราชบริพารทุกคนก้มต่ำกว่าธรรมเนียมกำหนด และไม่มีผู้ใดมั่นใจว่าท่านเป็นแขกหรือผู้พิชิต\n\nท่านเป็นทั้งสองในยามนี้ สิ่งที่ท่านทำในชั่วโมงถัดไปจะกำหนดว่าพวกเขาจดจำแบบใด"
 eternal_summons.0400.a: "รับการต้อนรับอย่างเป็นทางการ ด้วยเกียรติอย่างกษัตริย์"
 eternal_summons.0400.b: "ตรวจอาณาจักร เมืองต่อเมือง ประหนึ่งเป็นเจ้าของ"
 eternal_summons.0400.c: "เสวยร่วมกับเจ้าภาพ ให้เขาคิดว่าตนเป็นมิตร"
 eternal_summons.0400.d: "เรียกเครื่องบรรณาการ ให้ราชสำนักค้นพบราคาของการต้อนรับ"
 eternal_summons.1400.t: "เกียรติแห่งกษัตริย์"
 eternal_summons.1400.desc: "พวกเขามอบท้องพระโรง ห้องบรรทมที่ดีที่สุด และจอกแรกในงานเลี้ยงแก่ท่าน [host_realm.GetTitledFirstName]ยืน นั่ง และยืนอีก ไม่แน่ใจว่าจะวางตัวต่อแขกที่ยึดที่นั่งอันทรงเกียรติโดยมิเคยถูกเชื้อเชิญ\n\nเมื่อท่านจากไป พวกเขาเดินเคียงรถม้าไปจนประตูนคร ศีรษะเปล่า"
 eternal_summons.2400.t: "การตรวจแว่นแคว้น"
 eternal_summons.2400.desc: "ท่านขี่ผ่านอาณาจักรด้วยผู้ติดตามเล็กน้อยและสมุดบัญชีเล่มใหญ่ ถามคำถามทุกตลาด ทำไมกำแพงนี้มิซ่อม ใครสร้างโบสถ์นั้น เพื่อผู้ใด [host_realm.GetTitledFirstName]เดินตามหลังสองก้าว ตอบสั้นลงและระมัดระวังขึ้นทุกไมล์\n\nเมื่อสิ้นสัปดาห์ ท่านรู้ว่าทุกสิ่งอยู่ที่ใดและใครได้ประโยชน์ นั่นคือก้าวแรกของการพิชิตทุกครั้ง"
 eternal_summons.3400.t: "โต๊ะของเจ้าภาพ"
 eternal_summons.3400.desc: "[host_realm.GetTitledFirstName]จัดงานเลี้ยงเกียรติท่าน และท่านปล่อยให้ตนถูกเสน่ห์ ท่านหัวเราะถูกจังหวะ ชมพ่อครัว และดื่มจากจอกของเจ้าภาพ เมื่อเที่ยงคืน เขาตัดสินว่าท่านมิใช่อสุรกายที่เรื่องเล่าบรรยาย\n\nเป็นความผิดพลาดเล็กน้อยและสบายยิ่ง และท่านจะใช้มันภายหลัง"
 eternal_summons.4400.t: "ราคาของการต้อนรับ"
 eternal_summons.4400.desc: "ท่านปล่อยความเงียบดำรงอยู่จนเจ้าภาพเข้าใจ แล้วท่านเอ่ยจำนวนหนึ่ง อย่างสุภาพ ประหนึ่งเป็นมารยาท เป็นจำนวนมหาศาล และถูกส่งมาถึงก่อนค่ำในหีบเล็กหนักอึ้ง หามโดยบุรุษผู้มิสบตาท่าน\n\nราชสำนักจะจดจำการเยือนนี้ ดั่งวันที่สตรีศักดิ์สิทธิ์ขอสิ่งหนึ่งและได้รับก่อนนางขอจบ"
