l_english:
 eternal_maiden_result_ok: "เรื่องจบลงเพียงนั้น"
 eternal_maiden_echo_ok: "กาลเวลาย่อมจดจำ"
 eternal_maiden.1100.t: "รุ่งอรุณเหนือแท่นบูชา"
 eternal_maiden.1100.desc: "ท่านวางฝ่ามือลงบนดวงตาขุ่นมัวของเขา แล้วเริ่มสวดภาวนาบทโบราณ ทั่วสถานศักดิ์สิทธิ์สงัดลงรอบกายท่านทั้งสอง ถ้อยคำมิได้ยากเย็น สิ่งที่ยากคือการรอคอย ชั่วโมงแล้วชั่วโมงเล่า เทียนไหววูบ หลานชายหลับพิงเสา ริมฝีปากของชายชรายังขยับตามท่านแม้เสียงจะหายไปนานแล้ว\n\nครั้นแสงแรกของวันทอดผ่านโถงกลางมาตกที่ใบหน้าเขา เขาไม่ได้เห็นท่าน และไม่จำเป็นต้องเห็น เขาร่ำไห้ แล้วกล่าวว่าได้รู้สึกถึงความอบอุ่นในที่ซึ่งมีแต่ราตรีมายี่สิบปี ผู้แสวงบุญที่อยู่ดูต่างค่อยๆ คุกเข่าลงทีละคน\n\nจะเป็นสวรรค์หรือแสงอรุณก็ตาม ไม่มีผู้ใดในโบสถ์นั้นจะยอมเชื่อว่านี่มิใช่ปาฏิหาริย์"
 eternal_maiden.2100.t: "หมอหลวงหลังม่าน"
 eternal_maiden.2100.desc: "หมอหลวงชราผู้นี้ค่าตัวแพงและไม่เคยถามสิ่งใด หลังม่านผ้าลินินสีขาวเขาลงมืออย่างรวดเร็ว น้ำมันหนึ่งหยด ผ้าอุ่นหนึ่งผืน และกลอุบายของแสงต่อต้อกระจกที่ดื้อดึงยิ่งกว่าตาบอดจริง\n\nเมื่อท่านรูดม่านออก ชายชราก็กะพริบตาใส่เปลวเทียนแล้วร้องออกมา โบสถ์ทั้งหลังก็แตกตื่น สตรีผลักบุตรของตนเข้ามาหาท่าน บุรุษผู้ไม่เคยสวดมนต์มาหลายปีคุกเข่าลงต่อหน้าปาฏิหาริย์ที่ท่านมิได้ก่อ\n\nท่านยิ้มและมิได้กล่าวสิ่งใด หมอหลวงลอบออกทางห้องเก็บอาภรณ์ เขาฉลาดพอจะไม่เหลียวหลัง และท่านก็ฉลาดพอจะสงสัยในคืนนั้นว่ามีผู้ใดเห็นเขาจากไปบ้างหรือไม่"
 eternal_maiden.3100.t: "ตาใจก่อนตากาย"
 eternal_maiden.3100.desc: "“สวรรค์เปิดดวงตาภายในก่อนเสมอ” ท่านกล่าวเบาๆ แล้ววางมือบนศีรษะที่ก้มต่ำ “ที่เหลือเป็นเรื่องของความอดทน ท่านผู้เฒ่า จงไปเป็นสุขเถิด ท่านเดินมาสี่สิบวันเพื่อพบใบหน้าหนึ่ง ข้าคิดว่าท่านได้เห็นสิ่งที่มาหาแล้ว”\n\nความเงียบยาวนาน แล้วชายชราก็หัวเราะ เป็นเสียงหัวเราะบางเบาและอัศจรรย์ใจ เขากล่าวว่าไม่มีนักบวชผู้ใดในสี่สิบปีเคยบอกเขาว่าเขาไม่ขาดสิ่งใดเลย ผู้แสวงบุญมองตามเขาด้วยศีรษะที่ก้มลง บางคนน้ำตาไหล\n\nนี่มิใช่ปาฏิหาริย์ หากเป็นสิ่งที่เงียบงันกว่า และบางทีอาจดีกว่า ท่านรู้สึกว่าน้ำหนักของวันอันยาวนานเบาลงจากบ่า เมื่อประตูปิดตามหลังเขา"
 eternal_maiden.5100.t: "ชายชราหวนกลับมา"
 eternal_maiden.5100.desc_a: "หลายเดือนต่อมา คนแปลกหน้าผู้หนึ่งบนทางแสวงบุญหยุดท่านด้วยมือสั่นเทา คือชายชราผู้นั้น ผอมลง หลังค่อม และยังคงมองไม่เห็น ทว่าเขาเล่าเรื่องนี้ในทุกหมู่บ้านระหว่างบ้านของเขากับวังของท่าน และทุกหมู่บ้านก็ส่งคนตามเขามาฟังอีกครั้ง\n\n“ข้ามองไม่เห็นสิ่งใด” เขากล่าวอย่างยิ้มแย้ม “แต่ข้าไม่เคยมั่นใจในสิ่งที่ข้าได้เห็นเท่านี้มาก่อน”"
 eternal_maiden.5100.desc_b: "หลานชายของชายชราเดินทางมายังวังเพียงลำพัง ถือหมวกไว้ในมือ ชายชราสิ้นแล้ว ก่อนสิ้นลมเขาสารภาพต่อนักบวชว่ามือของหมอหลวงเป็นผู้คืนแสงสว่างให้ และเขาไม่เคยรู้สึกอับอายที่มีความสุขเท่าครั้งนั้นมาก่อน\n\nนักบวชเก็บความลับไว้ ส่วนเด็กหนุ่มไม่เก็บ เขามิได้ขอสิ่งใด เพียงต้องการให้ท่านรู้ว่ามีผู้หนึ่งกำลังแบกเรื่องนี้ไว้"
 eternal_maiden.5100.desc_c: "จดหมายฉบับหนึ่งมาถึง ด้วยลายมือเขียนตามคำบอก ชายชราสิ้นในนิทรา สงบดั่งเด็กน้อย ชาวบ้านล้อมเตียงอยู่ ก่อนสิ้นเขาขอให้ฝังตนหันหน้าไปทางทิศตะวันออก เพราะที่นั่นคือที่ซึ่งสตรีศักดิ์สิทธิ์บอกเขาว่าเขาได้เห็นสิ่งที่มาหาแล้ว\n\nโบสถ์หลังเล็กถูกสร้างขึ้นตรงที่เขาถูกฝัง ไม่มีพระธาตุใดๆ มีเพียงประตูบานหนึ่งที่หันไปรับอรุณ"
 eternal_maiden.1101.t: "ปาฏิหาริย์สองประการ"
 eternal_maiden.1101.desc: "ท่านมาถึงโบสถ์หมู่บ้านยามพลบค่ำและคุกเข่าลงเบื้องหน้ารูปปั้นไม้ แล้วทำสิ่งเดียวที่ไม่มีผู้ใดคาดคิด ท่านเริ่มร่ำไห้ไปพร้อมกับมัน มิใช่หยดน้ำตาเงียบๆ หากเป็นน้ำตาที่ไหลหลั่งอย่างไม่ปิดบัง ไหลลงบนขั้นศิลา\n\nชาวบ้านหยุดสนทนา นักบวชทำสัญลักษณ์กางเขน ครั้นท่านลุกขึ้น ไม่มีผู้ใดในโบสถ์เหลืออยู่ที่เชื่อว่ารูปปั้นเป็นเพียงความอัศจรรย์เดียวในห้องนั้น"
 eternal_maiden.1101.desc_hi: "ทว่าข่าวลือมักเดินทางไปถึงหูผิดคนเสมอ เสมียนเดินทางผู้หนึ่งบนระเบียงสังเกตท่านร้องไห้ด้วยสีหน้าสงบยิ่ง ครั้นรุ่งเช้าเขาก็ถามคนสามคนด้วยคำถามเดียวกันเรื่องช่างไม้"
 eternal_maiden.1101.desc_lo: "ตำนานนี้จะอยู่ยืนยาวกว่ารูปปั้นไปอีกร้อยปี"
 eternal_maiden.2101.t: "ผู้ที่จ่ายเงินช่างไม้"
 eternal_maiden.2101.desc: "สายลับของท่านใช้เวลาสามวัน ช่างไม้ผู้นั้นเป็นคนขี้เมามีหนี้สินและมีลูกสาวหนึ่งคน ส่วนคนแปลกหน้าที่จ่ายเงินให้เขาคือนักบวชเล็กๆ จากสังฆมณฑลคู่แข่ง ผู้คิดว่าปาฏิหาริย์ปลอมจะทำให้ท่านอับอายเมื่อถูกเปิดโปง\n\nท่านมิได้เปิดโปง ท่านซื้อหนี้ของช่างไม้ ส่งลูกสาวของเขาเข้าโรงเรียนในอาราม และปล่อยให้นักบวชผู้นั้นพบ ในอีกหนึ่งสัปดาห์ต่อมา ว่ามหาวิหารของตนเองก็เริ่มหลั่งน้ำตาเช่นกัน"
 eternal_maiden.2101.desc_hi: "นักบวชผู้นั้นจะเงียบไปอีกนาน แต่เสมียนบนระเบียงน่าเสียดายที่ไม่เงียบ"
 eternal_maiden.2101.desc_lo: "เรื่องนี้ดับสนิทเงียบงัน ดั่งเทียนที่ถูกดับในห้องปิดทึบ"
 eternal_maiden.3101.t: "ไม่บูชาในรูปท่อนไม้"
 eternal_maiden.3101.desc: "ท่านเดินเข้าโบสถ์พร้อมคบไฟในมือของท่านเอง ชั่วครู่หนึ่งชาวบ้านคิดว่าท่านจะจุดไฟเผารูปปั้น และท่านก็จุดจริง เปลวไฟไต่ขึ้นอย่างรวดเร็วบนไม้เก่าแห้ง ใบหน้าที่ทาสีดูอ่อนลงและละลายไหลก่อนจะดำสนิท\n\n“ข้าจะไม่ยอมให้ผู้ใดบูชาข้าในรูปเคารพที่แกะสลัก” ท่านกล่าวแก่ฝูงชนที่ตะลึงงัน “หากพวกเจ้าปรารถนาจะสวดภาวนาแก่ข้า จงสวดแก่ใบหน้าของข้า ข้ายืนอยู่ที่นี่แล้ว”\n\nนั่นคือคำเทศนาที่น่าสะพรึงที่สุดที่ท่านเคยกล่าว ไม่มีผู้ใดในโบสถ์นั้นจะลืมได้เลย"
 eternal_maiden.1102.t: "ยุ้งฉางที่เปิดออก"
 eternal_maiden.1102.desc: "ท่านสั่งให้เปิดประตูยุ้งฉางตั้งแต่รุ่งเช้า ขุนคลังเป็นลมเงียบๆ ลงในอ้อมแขนของมหาดเล็ก ครั้นเที่ยงวัน มารดาแห่งเมืองที่ราบลุ่มมาอยู่ที่ประตู และเมื่อถึงเย็นท่านก็ยืนอยู่ในแถวยาวของสตรี แจกก้อนขนมปังด้วยมือของท่านเอง\n\nเด็กหญิงคนหนึ่งถามว่าท่านเป็นเทวดาหรือไม่ ท่านตอบว่าท่านเป็นเพียงผู้ถือกุญแจ นางครุ่นคิด พยักหน้าอย่างขึงขัง แล้วกินขนมปัง\n\nความหิวผ่านไป สิ่งที่ยังคงอยู่คือน้ำเสียงที่สตรีเหล่านั้นเอ่ยนามของท่านในยามคิดว่าไม่มีใครได้ยิน"
 eternal_maiden.2102.t: "คำภาวนาขอฝน"
 eternal_maiden.2102.desc: "ท่านนำชาวเมืองทั้งเมืองออกไปยังทุ่งแห้งในอาภรณ์สีขาวและเท้าเปล่า บทสวดที่ท่านกล่าวยาวและงดงาม และมิได้เอ่ยถึงข้าวเลยแม้แต่คำเดียว\n\nฝนตกในวันที่สาม ดั่งที่มันจะตกอยู่แล้ว ชาวนากล่าวว่าเป็นเพราะท่าน นักดาราศาสตร์ในมหาวิหารกล่าวอย่างเงียบๆ ว่าท้องฟ้าก่อตัวมาตลอดสัปดาห์\n\nนักดาราศาสตร์เงียบ ส่วนชาวนาไม่เงียบ"
 eternal_maiden.3102.t: "ราคาของศรัทธา"
 eternal_maiden.3102.desc: "ข้าวถูกขายให้พ่อค้าผู้มั่งคั่งจากชายฝั่ง ผู้จ่ายเงินเงินก้อนมหึมาและไม่ถามว่าผู้หิวโหยจะไปที่ใด ครั้นสัปดาห์ที่สอง ท่านพบว่าพวกเขาไปที่วิหาร ซึ่งเป็นที่ที่ท่านต้องการให้ไป\n\nท่านนั่งบนขั้นสูงสุด แจกซุปใสที่วิหารพอจ่ายได้ และเฝ้ามองใบหน้าที่ไม่เคยเห็นเงยขึ้นมองท่านราวกับท่านเป็นดวงตะวัน นั่นเป็นครั้งที่ท่านเข้าใจความรู้สึกของเทพเจ้าใกล้ที่สุด\n\nท่านไม่แน่ใจว่าท่านชอบมันหรือไม่"
 eternal_maiden.1103.t: "ฝ่าไข้"
 eternal_maiden.1103.desc: "ท่านไม่ละไปจากเด็กน้อย ท่านเช็ดหน้าผากเขาจนผ้าอุ่น เปลี่ยนผ้า แล้วเช็ดอีก ท่านขับกล่อมเขาด้วยภาษาโบราณที่เรียนมาจากอารามที่ท่านจำได้เลือนราง มารดาหลับพิงกำแพงในที่สุด ท่านอยู่ลำพังท่ามกลางแสงเทียนกับเด็กชายที่ลมหายใจช้า เบา และเล็กนัก\n\nยามสามของรุ่งเช้า ไข้ก็ลดลงทันที ดั่งคลื่นที่ถอยกลับ เขาลืมตาขึ้น และขอน้ำอย่างชัดเจน\n\nท่านป้อนน้ำให้เขา มือท่านสั่น และท่านประหลาดใจที่พบว่าตนกำลังสวดภาวนาด้วยใจจริง"
 eternal_maiden.2103.t: "หมอหลวงผู้เงียบงัน"
 eternal_maiden.2103.desc: "ท่านเรียกหมอหลวงส่วนตัว ซึ่งมาถึงภายในหนึ่งชั่วยามพร้อมกล่องยาผงรสขมและคำขออภัยที่รีบร้อน มารดาได้รับแจ้งเพียงว่าสตรีศักดิ์สิทธิ์ส่งพรมาให้ เด็กชายได้รับแจ้งเพียงว่าเขาจะรู้สึกดีขึ้น\n\nครั้นรุ่งเช้า ไข้ก็หาย ครั้นเที่ยง ทั้งถนนก็ตกลงกันแล้วว่าเป็นเพราะคำภาวนาของท่านหญิงผู้ศักดิ์สิทธิ์ และท่านก็มิได้เอ่ยแก้ไข\n\nท่านไม่แน่ใจว่านับเป็นการโกหกหรือไม่ เมื่อมันก็เป็นความจริงในแบบของมัน"
 eternal_maiden.3103.t: "สวรรค์จะทรงตัดสิน"
 eternal_maiden.3103.desc: "ท่านอวยพรเด็กชาย แล้วกดเหรียญเงินเล็กๆ ลงในมือมารดา ส่งพวกเขากลับบ้านพร้อมสัญญาว่าจะสวดภาวนาให้ นั่นมิใช่คำตอบที่นางหวัง และนางก็รู้ แต่นางก็ขอบคุณท่านอยู่ดี ด้วยใบหน้าที่พยายามอย่างยิ่งมิให้พังทลาย\n\nท่านใช้เวลาทั้งคืนที่แท่นบูชาเพียงลำพัง สวรรค์ ดังที่มักเป็น ไม่ตรัสสิ่งใด"
 eternal_maiden.5103.t: "เด็กน้อยเติบใหญ่"
 eternal_maiden.5103.desc_a: "เด็กชายร่างสูงวัยสิบสองรออยู่บนระเบียงพร้อมช่อดอกไม้ป่าและคำอนุญาตจากมารดาให้เข้าเฝ้า เขากล่าวว่าเขาเคยป่วยหนัก และสตรีผู้นั่งอยู่ข้างเขาตลอดคืนร้องเพลงให้เขาฟังบทหนึ่งที่เขาไม่เคยลืม\n\nเขาร้องเพลงนั้น เพี้ยนเสียงไปเล็กน้อย และท่านพบว่าตนจำได้ทุกถ้อยคำ"
 eternal_maiden.5103.desc_b: "มารดาของเด็กชายมาถึงวังพร้อมขนมปังก้อนหนึ่งที่นางอบเอง ลูกชายของนางแข็งแรงดี นางกล่าว เป็นลูกมือช่างก่ออิฐ นางไม่เคยรู้ว่าเป็นหมอหลวงหรือคำภาวนากันแน่ และนางตัดสินใจแล้วว่ามันไม่สำคัญ\n\nนางไม่อยู่รอรับคำขอบคุณ"
 eternal_maiden.5103.desc_c: "จดหมายฉบับหนึ่งมาถึงจากย่านช่างฟอกหนัง ด้วยลายมือที่ชัดเจนว่ามิใช่ของมารดา เด็กชายหายดีอย่างช้าๆ และแข็งแรงแล้ว เขาอยากให้ท่านรู้ว่าเขามิได้โทษสวรรค์ที่ทรงใช้เวลา\n\nท่านเก็บจดหมายไว้ในแขนเสื้อพับไว้อยู่นาน"
 eternal_maiden.1104.t: "มือของพ่อค้า"
 eternal_maiden.1104.desc: "ท่านให้นำเขามายังลานตลาดบนเกวียนทั้งที่ถูกพันธนาการ ทั้งเมืองมาชุมนุมดูว่าท่านหญิงผู้ศักดิ์สิทธิ์จะทำเช่นไรกับบุรุษผู้ขายผ้าคลุมของนางไปสามร้อยครั้ง เพชฌฆาตผู้นี้เมตตา คมมีดเร็ว และพ่อค้าซึ่งกล้าหาญมาตลอดก็เริ่มกรีดร้อง\n\nเศษผ้าถูกเผาเป็นกองต่อหน้าเขา ฝูงชนมองควันลอยขึ้น และไม่มีผู้ใดเอ่ยปาก ตลอดฤดูกาล ตลาดไม่ขายสิ่งใดที่อ้างว่ามาจากท่านอีก\n\nมันได้ผล และยังทิ้งรสชาติไว้ในอากาศที่ล้างไม่ออก"
 eternal_maiden.2104.t: "ครึ่งหนึ่งของทุกเหรียญ"
 eternal_maiden.2104.desc: "ท่านมิได้ให้โบยเขา ท่านเรียกเขาเข้าห้องส่วนตัว วางกระดานชนวนบนโต๊ะ และเสนอการร่วมกิจการ เขาเป็นบุรุษที่ยินดีขายคำโกหกให้ทุกผู้ มิต้องเสียสิ่งใดที่จะให้เขาขายคำโกหกของท่าน ภายในหนึ่งเดือน เศษผ้าถูกอวยพร ตีเลขหมาย และขายในราคาคงที่จากบันไดมหาวิหาร\n\nครึ่งหนึ่งของทุกเหรียญตกเป็นของท่าน พ่อค้ามั่งคั่งกว่าที่เคยเป็น และหวาดกลัวกว่าที่เคยหากต้องหยุด\n\nท่านยอมรับว่านี่เป็นข้อตกลงที่ดียิ่ง"
 eternal_maiden.3104.t: "ทุกเศษผ้าเป็นความจริง"
 eternal_maiden.3104.desc: "ท่านยืนบนบันไดมหาวิหารต่อหน้าคนทั้งเมือง หยิบเศษผ้าชิ้นแรกจากตะกร้าของพ่อค้า ท่านจุมพิตมัน ชูมันขึ้นสู่สวรรค์ และกล่าวด้วยเสียงกังวานว่า ทุกชิ้นของผ้านี้มีเศษเสี้ยวของคำภาวนาของท่านอยู่\n\nมันเป็นคำโกหกที่ท่านกล่าวด้วยความเชื่อมั่นเต็มที่ และเพราะเช่นนั้นมันจึงเลิกเป็นคำโกหก พ่อค้าร่ำไห้ ทรุดลงคุกเข่า ฝูงชนทำตาม\n\nเมื่อเศษผ้าทั้งหมดได้รับพร พวกมันมีค่าเป็นร้อยเท่าของต้นทุน ท่านนึกว่า คำโกหกก็คือคำภาวนาที่ยังไม่ได้รับคำตอบ"
 eternal_maiden.1105.t: "เสียงจากระเบียง"
 eternal_maiden.1105.desc: "ท่านตรัสกับพวกเขาจนเสียงแหบหาย แล้วตรัสต่อเป็นเสียงกระซิบ และพวกเขาโน้มตัวเข้ามาฟังเป็นร่างเดียวกัน ท่านเล่าเรื่องความอดทน เล่าเรื่องหนทางยาวไกลกับประตูที่ปิดและแสงที่อยู่ห่างออกไปอีกหนึ่งโค้งเสมอ\n\nไม่มีผู้ใดในฝูงชนนั้นจะลืมความรู้สึกของการถูกท่านมองเห็น แม้เพียงจากที่ไกล ครั้นท่านเงียบลงในที่สุด สตรีผู้หนึ่งแถวหน้าเริ่มฮัมเพลงเบาๆ และเสียงนั้นแผ่ไปทั่วมหาชนจนทั้งลานต่างร้องเพลงกันหมด"
 eternal_maiden.1105.desc_hi: "ณ ที่ใดที่หนึ่งริมฝูงชน บุรุษในผ้าคลุมเรียบๆ เขียนบางสิ่งลงในสมุดเล่มเล็ก เขาไม่ร้องเพลง"
 eternal_maiden.1105.desc_lo: "ท่านหลับไปสิบเอ็ดชั่วโมงหลังจากนั้น และตื่นขึ้นอย่างยิ้มแย้ม"
 eternal_maiden.2105.t: "ด่านบนเส้นทางแห่งศรัทธา"
 eternal_maiden.2105.desc: "มันเป็นค่าผ่านทางเล็กน้อย เหรียญเดียวที่ทุกทางแยก จัดเก็บโดยภคินีในอาภรณ์ขาวผู้ประทานพรกับทุกใบเสร็จ ไม่มีผู้แสวงบุญคนใดบ่น หลายคนกล่าวว่าเป็นเกียรติ\n\nสิ้นฤดูกาล ถนนปูดีขึ้น โรงเตี๊ยมสะอาดขึ้น และท้องพระคลังหนักกว่าที่ท่านคาดไว้ ผู้แสวงบุญจ่ายค่าการแสวงบุญของตนเองและขอบคุณท่านที่ให้โอกาส\n\nท่านไม่รู้สึกผิด แต่บางครั้งท่านก็สงสัยว่านักบุญจะทำเช่นไร"
 eternal_maiden.3105.t: "บานหน้าต่างปิดลง"
 eternal_maiden.3105.desc: "ท่านปิดบานหน้าต่าง แล้วนั่งในความมืดกับถ้วยน้ำเย็นและความเงียบอันยาวนาน ท่านเหนื่อยในแบบที่การนอนหลับแตะต้องไม่ถึง ฝูงชนเบื้องล่างยังพึมพำอยู่ อดทนดั่งมหาสมุทร และเป็นครั้งแรกในรอบเวลานานที่ท่านปล่อยให้มันพึมพำโดยไม่ตอบ\n\nครั้นระฆังยามเย็นดัง เสียงเดียวในลานเริ่มบทสวดสรรเสริญ ท่านมิได้ร่วมร้อง แต่ท่านฟัง และการฟังเป็นภาวนาอย่างหนึ่ง และในชั่วโมงแรกหลังหลายวัน ท่านรู้สึกเป็นคน แทนที่จะเป็นสัญลักษณ์"
 eternal_maiden.1106.t: "ใบหน้าในอุ้งมือ"
 eternal_maiden.1106.desc: "ทหารยามตะลึงเกินกว่าจะห้ามท่าน ท่านเดินผ่านปลายหอกที่ลดต่ำ คุกเข่าลงบนผงธุลี และประคองใบหน้าของคนโรคเรื้อนไว้ในสองมือ ดั่งประคองใบหน้าของเด็ก ผิวของเขาแห้งหยาบและมีกลิ่นควันเก่า ท่านประคองไว้จนเขาหยุดสั่น\n\nไม่มีผู้ใดในลานเอ่ยปาก นักบวชคนหนึ่งทำกระถางธูปหล่น สตรีนางหนึ่งเริ่มร้องไห้ แล้วอีกนาง\n\n“ขอบคุณ” ชายผู้นั้นกล่าว มิใช่เพราะการรักษา หากเพียงเพราะได้รับการสัมผัส และนั่นเป็นถ้อยคำที่ซื่อตรงที่สุดที่ผู้ใดเคยกล่าวกับท่านในรอบสิบปี"
 eternal_maiden.2106.t: "ผ่านถุงมือไหม"
 eternal_maiden.2106.desc: "ท่านดึงถุงมือไหมสีขาวออกจากแขนเสื้ออย่างไม่รีบร้อน ปล่อยให้ทั้งลานเฝ้ามองท่านสวมมัน แล้วจึงแตะหน้าผากของคนโรคเรื้อนเบาๆ เพียงครั้งเดียว\n\nมันเป็นท่าทางที่ไม่เสียสิ่งใดและมีความหมายทุกสิ่ง ฝูงชนเห็นนักบุญที่ไม่หวาดกลัว คนโรคเรื้อนผู้เข้าใจดีว่าเกิดสิ่งใดขึ้นขอบคุณท่านด้วยการโค้งคำนับที่ซ่อนรอยยิ้มไม่มิด\n\nท่านมอบศักดิ์ศรีให้เขา และสอนผู้แสวงบุญทุกคนในลานว่าท่าทางหนึ่งมีค่าเพียงใด"
 eternal_maiden.3106.t: "นักบุญไม่แตะต้องสิ่งโสโครก"
 eternal_maiden.3106.desc: "“นำเขาไปนอกกำแพงเมือง” ท่านกล่าว และทหารยามซึ่งรอคำสั่งนี้อยู่ก็ปิดแถว คนโรคเรื้อนมิได้คัดค้าน เขาเพียงมองท่านด้วยสีหน้าที่ท่านจะจดจำไปอีกนาน แล้วปล่อยให้ถูกนำตัวไป\n\nฝูงชนมองดูอย่างสั่นสะเทือน บางคนคิดว่าท่านโหดร้าย ส่วนใหญ่คิดว่าท่านศักดิ์สิทธิ์ และความศักดิ์สิทธิ์เป็นสิ่งที่แข็งกระด้าง รักษาระยะห่างจากสิ่งไม่สะอาด พวกเขาก้มศีรษะต่ำกว่าเดิมเล็กน้อย\n\nท่านไม่แน่ใจว่าเคยชนะสิ่งใดด้วยราคาถูกถึงเพียงนี้ หรือสูญเสียมากถึงเพียงนี้"
 eternal_maiden.5106.t: "สิ่งที่คนโรคเรื้อนทิ้งไว้"
 eternal_maiden.5106.desc_a: "ผู้แสวงบุญผู้หนึ่งมาถึงประตูพร้อมชามเรียบง่ายใบเล็กห่อด้วยผ้า เขากล่าวว่ามันเป็นของคนโรคเรื้อนผู้ตายบนทางไปฝั่งทะเล และผู้ตายขอให้มอบมันแก่สตรีผู้แตะใบหน้าของเขา มันเป็นของน่าสงสาร บิ่นและเปื้อน\n\nท่านวางมันไว้บนแท่นบูชา และไม่มีผู้ใดแตะต้องมันนอกจากท่าน"
 eternal_maiden.5106.desc_b: "จดหมายจากเมืองไกลกล่าวว่า ชายผู้ท่านแตะผ่านถุงมือไหมได้เปิดสถานพยาบาลของตนเองในนามของท่าน ด้วยเงินที่ไม่มีผู้ใดอธิบายได้ เขาลงนามจดหมายด้วยการโค้งคำนับเล็กๆ อย่างระมัดระวังเท่านั้น\n\nท่านพบว่าตนกำลังยิ้ม อย่างไม่สบายใจนัก ให้แก่หนี้เก่าที่ได้รับการชดใช้"
 eternal_maiden.5106.desc_c: "ข่าวมาจากทางหลวงว่า คนโรคเรื้อนที่ท่านขับไล่ออกจากเมืองถูกพบเห็นในสามเมือง เสมอที่ท้ายฝูงชน และมองมาทางท่านเสมอ เขาเริ่มพูดแล้ว สิ่งที่เขาพูด ผู้ที่ได้ยินบอกท่าน แผ่วเบาและน่าสะพรึงยิ่ง\n\nเขาว่ามีสิ่งที่ศักดิ์สิทธิ์ยิ่งกว่าการถูกหวาดกลัว"
 eternal_maiden.1107.t: "ลับดาบให้คม"
 eternal_maiden.1107.desc: "“ข้าเห็นนครที่ลุกเป็นไฟ” ท่านกล่าวต่อเหล่านักบวชที่ชุมนุมกัน “ธงผืนขาว และเสียงของสวรรค์เองบอกข้าว่าเวลาแห่งความอดทนสิ้นสุดแล้ว”\n\nความเงียบเป็นไปโดยสมบูรณ์ แล้วอัศวินหนุ่มก้าวออกมาและวางดาบลงแทบเท้าท่าน คนอื่นๆ ตามมาทีละคน ครั้นเย็น เตาหลอมก็ลุกโชน ครั้นเช้า ท้องพระโรงใหญ่ก็เต็มด้วยบุรุษผู้ต้องการเป็นคนแรกที่ตายเพื่อความฝันที่ท่านฝันเมื่อคืน"
 eternal_maiden.1107.desc_hi: "ท่านสงสัยชั่วครู่ว่าท่านพูดจริงหรือไม่ แล้วท่านก็นึกได้ว่าความสงสัยเป็นของฟุ่มเฟือยของผู้ที่ยังมิได้กุมกองทัพไว้"
 eternal_maiden.1107.desc_lo: "ท่านไม่เคยแน่ใจเท่านี้ หรือควบคุมได้น้อยเท่านี้มาก่อน"
 eternal_maiden.2107.t: "ระฆังแห่งสันติ"
 eternal_maiden.2107.desc: "“ข้าเห็นสันติ” ท่านกล่าว และทั้งห้องถอนหายใจพร้อมกัน “ทุ่งข้าวสาลี เด็กหัวเราะ และระฆังที่ดังโดยไร้เหตุผล”\n\nเหล่านักบวชตื้นตัน ภิกษุเริ่มร่ำไห้ ก่อนเที่ยงผู้ตีระฆังถูกเรียกตัว และเป็นครั้งแรกในรอบชั่วอายุคนที่ทุกโบสถ์ในนครดังพร้อมกัน เป็นเสียงกึกก้องอย่างรื่นเริงที่ต่อเนื่องไปหนึ่งชั่วโมง ผู้คนหยุดฟังกลางถนน และบางคนที่ท่านสังเกตเห็นไม่รู้เลยว่าตนร้องไห้เพราะเหตุใด\n\nท่านยืนที่หน้าต่างให้มันไหลผ่านตัว นี่อาจเป็นสิ่งเดียวที่เป็นจริงที่ท่านกล่าวในรอบเดือน"
 eternal_maiden.3107.t: "นิมิตที่เก็บงำไว้"
 eternal_maiden.3107.desc: "ท่านมิได้บอกผู้ใด ท่านปล่อยให้ข่าวลือทำงานอย่างช้าๆ บ่าวผู้เห็นท่านสวดภาวนาก่อนรุ่งสาง ภคินีผู้ได้ยินท่านกระซิบเป็นภาษาที่ไม่มีใครรู้จัก นักบวชผู้สังเกตเห็นว่าดวงตาของท่านชุ่มน้ำ\n\nภายในหนึ่งสัปดาห์ มีนิมิตของท่านเจ็ดฉบับแพร่ไปในเมือง และแต่ละฉบับน่าประทับใจยิ่งกว่าฉบับก่อน ท่านมิได้แก้ไขฉบับใดเลย คำพยากรณ์ที่มีประโยชน์ที่สุด ท่านเรียนรู้แล้ว คือคำที่เติบโตในปากของผู้อื่น"
 eternal_maiden.1108.t: "การโต้วาทีในมหาวิหาร"
 eternal_maiden.1108.desc: "มหาวิหารเต็มแน่น เงียบสงัดและร้อนด้วยลมหายใจ ภิกษุกล่าวก่อน เสียงแผ่วเบา และสิบนาทีนั้นเขาเก่งกาจยิ่ง แล้วถึงตาท่าน และท่านมิได้โต้แย้ง ท่านถามเขา คำถามเรียบง่ายและเจ็บปวด ว่าเขาสละสิ่งใดไป เขากลัวสิ่งใด และเขาให้อภัยผู้ใด\n\nครั้นถึงท้ายเขามิได้มองฝูงชนอีกต่อไป เขามองท่าน เขากล่าวด้วยเสียงต่ำที่ดังไปถึงแถวสุดท้ายว่า เขามาเพื่อเปิดโปงนักต้มตุ๋น และพบสตรีผู้กำลังรับฟัง\n\nฝูงชนยืนปรบมือให้เขา เขายังคุกเข่าอยู่ และท่านจับมือเขาไว้"
 eternal_maiden.2108.t: "ก้นบ่อน้ำ"
 eternal_maiden.2108.desc: "ท่านมิได้ออกคำสั่ง ท่านเพียงถอนหายใจออกมา ให้ผู้ที่ควรได้ยินได้ยิน ว่าการถูกสงสัยน่าเหนื่อยหน่ายเพียงใด สองคืนต่อมาภิกษุถูกพบที่ก้นบ่อน้ำของหมู่บ้าน ไม่มีร่องรอยบนร่างนอกจากรอยยิ้มจางๆ แปลกๆ\n\nเมืองไว้ทุกข์หนึ่งวัน แล้วก็จดจำได้ว่ามีสตรีศักดิ์สิทธิ์ผู้ดูแลตน และการไว้ทุกข์ก็สิ้นสุดลง\n\nท่านมิได้ถามว่าใครเป็นผู้ทำ ท่านเลือกที่จะไม่รู้เสียมากกว่า"
 eternal_maiden.3108.t: "ของกำนัลแด่อาราม"
 eternal_maiden.3108.desc: "เงินอุปถัมภ์ก้อนใหญ่มาถึงอารามบนภูเขาพร้อมตราประทับของท่าน คานหลังคาใหม่ แกะสองร้อยตัว และแท่นบูชาแกะสลัก น้ำเสียงของภิกษุเปลี่ยนไปภายในหนึ่งเดือน เขาเริ่มเทศน์เรื่องความถ่อมตน เรื่องการให้อภัยผู้มั่งคั่ง และเรื่องที่สวรรค์มีปากมากมาย\n\nท่านมิได้ขอให้เขาสรรเสริญท่าน ท่านเพียงทำให้เขาเลิกคัดค้านง่ายขึ้น มันคือความเงียบที่เมตตาที่สุดที่ท่านเคยซื้อ"
 eternal_maiden.5108.t: "เทศน์ครั้งสุดท้ายของภิกษุ"
 eternal_maiden.5108.desc_a: "ร่างของภิกษุถูกนำลงจากภูเขาในฤดูหนาว และถูกฝังในมหาวิหารที่เขาเคยเผชิญหน้า ในงานศพ นักบวชผู้หนึ่งอ่านจากจดหมายฉบับสุดท้ายของเขา ซึ่งเขียนถึงท่าน และเป็นจดหมายรักในแบบแปลกๆ ถึงทุกข้อโต้แย้งที่ซื่อตรง\n\nมันจบว่า “ข้าผิดเรื่องนาง และถูกในทุกเรื่องที่เหลือ”"
 eternal_maiden.5108.desc_b: "บ่อน้ำถูกลอกในฤดูใบไม้ผลิ และไม่มีผู้ใดพบร่าง ชาวบ้านว่าภิกษุเดินออกจากบ่อในคืนที่สาม แล้วขึ้นภูเขาไป พวกเขาว่าบัดนี้เขาเทศน์ให้ต้นไม้ฟัง\n\nท่านไม่เคยอึดอัดกับข่าวลือใดเท่านี้ และไม่เคยดีใจกับข่าวลือใดเท่านี้"
 eternal_maiden.5108.desc_c: "อารามส่งเกวียนบรรทุกเนยแข็งและสุราเพื่อท่านทุกฤดูใบไม้ร่วง พร้อมบัตรที่เหมือนเดิมเสมอ ลายมือของภิกษุ หนึ่งประโยค “ข้ายังไม่แน่ใจ”\n\nท่านอ่านมันทุกปี และทุกปีท่านก็ยิ้มมากขึ้นอีกเล็กน้อย"
 eternal_maiden.1109.t: "ให้พวกเขาร้องเถิด"
 eternal_maiden.1109.desc: "ท่านปล่อยให้บทเพลงสรรเสริญแพร่ไป แพร่ไป และแพร่ไป ครั้นกลางฤดูร้อน มีฉบับเด็ก ฉบับเมาสุรา และฉบับสำหรับพิณที่นักดนตรีในราชสำนักร้องไห้ให้ ทุกท่อนปิดท้าย เป็นธรรมดา ด้วยการหันไปทางหน้าต่างวังของท่าน\n\nเหล่าบิชอปดูกระวนกระวาย ผู้คนดูมีความสุข ตลอดฤดูกาลหนึ่ง ท่านปล่อยให้ตนเชื่อว่าสองสิ่งนี้มิได้ขัดแย้งกัน"
 eternal_maiden.2109.t: "ท่อนสุดท้ายถูกเขียนใหม่"
 eternal_maiden.2109.desc: "ท่านเรียกนักประพันธ์เข้าโบสถ์ส่วนตัว และถามเขาอย่างเมตตาว่าท่อนสุดท้ายจะหันไปทางแท่นบูชาได้หรือไม่ เขาร้องไห้ เขาว่าเขาไม่เคยตระหนักเลย เขาเขียนท่อนใหม่ในคืนนั้นเอง และเป็นสิ่งที่งดงามที่สุดที่เขาเคยสร้าง คือคำภาวนาแด่สวรรค์ ที่มีเงาอ่อนๆ ของผ้าคลุมอยู่ตามขอบ\n\nเหล่าบิชอปสงบลง ผู้คนไม่แน่ใจเลยว่าอะไรเปลี่ยนไป ท่านเปลี่ยนบทเพลงที่อาจล้มศาสนจักรให้กลายเป็นเสาหนึ่งของมัน"
 eternal_maiden.3109.t: "ราคาของนักประพันธ์"
 eternal_maiden.3109.desc: "นักประพันธ์ถูกโบยกลางลานมหาวิหารฐานอวดดี สิบที เบากว่าที่ฝูงชนคาดไว้ บทเพลงถูกสั่งห้ามในทุกโบสถ์ของแผ่นดินก่อนตะวันตกดิน\n\nคืนนั้นมันถูกขับร้องในทุกโรงเตี๊ยม ด้วยเสียงกระซิบ และความหวานที่ท้าทายแบบใหม่ ท่านทำให้มันโด่งดังในบ่ายเดียว และยังทำให้ชายผู้เพียงต้องการกล่าวขอบคุณกลายเป็นผู้พลีชีพ\n\nท่านนึกว่า นี่เป็นวิธีที่ได้ผลยิ่งในการถูกเกลียด และเป็นวิธีที่ช้ายิ่งในการถูกลืม"
