l_english:
 eternal_maiden.0200.t: "สาส์นจากประมุขแห่งศรัทธา"
 eternal_maiden.0200.desc: "ตราประทับหนักอึ้ง ครั่งมีสีดั่งโลหิตเก่า [maiden_pontiff.GetTitledFirstName]เขียนมาด้วยถ้อยคำสุภาพยิ่งนัก ทว่าทุกบรรทัดอันสุภาพนั้นซ่อนคำถามเดียวกันไว้ ด้วยอำนาจของผู้ใดเล่าที่ท่านกล้าเอ่ยวาจาแทนสวรรค์\n\nสาส์นปิดท้ายด้วยคำอวยพร มิใช่คำขู่ และไม่จำเป็นต้องเป็นคำขู่"
 eternal_maiden.0200.a: "ตอบในฐานะธิดาผู้ถ่อมตนแห่งศรัทธา"
 eternal_maiden.0200.b: "ตอบอย่างผู้เสมอกัน สวรรค์มีเสียงมากกว่าหนึ่งเสียง"
 eternal_maiden.0200.c: "ตอบเพียงบรรทัดเดียว ถึงความลับที่ควรรู้กันเพียงสองคน"
 eternal_maiden.0201.t: "นักเทศน์นอกรีต"
 eternal_maiden.0201.desc: "นักเทศน์พเนจรผู้หนึ่งเที่ยวป่าวประกาศไปทั่วเมืองริมน้ำว่า ท่านหาใช่นักบุญไม่ หากเป็นแม่มดที่ดื่มกินคำภาวนาของผู้ศรัทธา\n\nเขาถูกลากเข้ามาในท้องพระโรง ฟกช้ำแต่ยังแย้มยิ้ม “เผาข้าเสียสิ แล้วทุกประกายไฟจะพาถ้อยคำของข้าไปไกลยิ่งขึ้น”"
 eternal_maiden.0201.a: "“ถ้าเช่นนั้นมาดูกันว่ามันจะลอยไปได้ไกลเพียงใด” แล้วเผามันเสีย"
 eternal_maiden.0201.b: "โต้วาทีกับเขากลางลานเมือง จนเขาร่ำไห้และถอนคำ"
 eternal_maiden.0201.c: "ปล่อยตัวเขา แล้วชี้ทางให้ไปเทศน์ในเมืองของศัตรูแทน"
 eternal_maiden.0202.t: "สภาบิชอป"
 eternal_maiden.0202.desc: "เหล่าบิชอปทั่วแผ่นดินมาชุมนุมกันเพื่อหารือ “เรื่องของสตรีศักดิ์สิทธิ์” โดยมิได้เชิญท่าน\n\nประตูห้องประชุมทำด้วยไม้โอ๊กและลงดานไว้ ทว่ามันจะลงดานอยู่ได้ไม่นาน หากท่านประสงค์"
 eternal_maiden.0202.a: "เสด็จเข้าไปโดยไม่ให้ประกาศ แล้วรอดูว่าพวกเขาจะหาเสียงของตนเจอหรือไม่"
 eternal_maiden.0202.b: "ปล่อยให้พวกเขาพูดไป คนแก่ย่อมต้องการรู้สึกว่าตนสำคัญ"
 eternal_maiden.0202.c: "จัดการให้บิชอปทุกองค์พบของกำนัลอันงามอยู่ในที่พักคืนนี้ (150 ทอง)"
 eternal_maiden.0203.t: "พระธาตุที่ถูกขโมย"
 eternal_maiden.0203.desc: "มหาวิหารคู่แข่งอ้างว่าครอบครองกระดูกนิ้วของศาสดาองค์แรก ผู้แสวงบุญจึงพากันไปที่นั่นแทนที่จะมาหาท่าน\n\nสายลับทูลว่าผอบพระธาตุมีเพียงภิกษุชราสองรูปกับสุนัขหนึ่งตัวคอยเฝ้า และว่ากันว่าสุนัขตัวนั้นอันตรายกว่า"
 eternal_maiden.0203.a: "ให้ขโมยมา แล้ว “ค้นพบใหม่” บนแท่นบูชาของท่านเอง"
 eternal_maiden.0203.b: "ซื้อมาอย่างเปิดเผย ให้มหาวิหารนั้นอับอายที่ขายมันไป (200 ทอง)"
 eternal_maiden.0203.c: "ประกาศว่าเป็นของปลอม พระธาตุจะจริงได้ก็เพียงเท่าผู้ที่เก็บรักษามัน"
 eternal_maiden.0204.t: "ผู้ไต่สวนศรัทธาที่หน้าประตู"
 eternal_maiden.0204.desc: "ผู้ไต่สวนศรัทธามาพร้อมม้วนคำถามหนึ่งม้วนกับเกวียนบรรทุกสมุดบัญชีว่างเปล่า เขาสุภาพ ไม่รู้เหน็ดเหนื่อย และได้สนทนากับพ่อครัวของท่านไปแล้ว\n\n“ข้าแสวงหาเพียงความจริงขอรับ ท่านหญิงผู้ศักดิ์สิทธิ์” เขากล่าว “ท่านย่อมไม่มีสิ่งใดต้องเกรงกลัวจากมันเป็นแน่”"
 eternal_maiden.0204.a: "หว่านเสน่ห์ใส่เขา เลี้ยงอาหารเขา ให้เขาจากไปพร้อมความหลงใหลในตัวท่าน"
 eternal_maiden.0204.b: "ปล่อยให้เขาล้มป่วยระหว่างทางกลับ ป่วยหนักทีเดียว"
 eternal_maiden.0204.c: "สารภาพบาปเล็กๆ ข้อหนึ่งให้เขาฟัง เพื่อให้เขาเลิกมองหาบาปใหญ่"
 eternal_maiden.0205.t: "เสียงกระซิบแห่งการแตกนิกาย"
 eternal_maiden.0205.desc: "ผู้ศรัทธากำลังแตกแยก บ้างว่าสตรีศักดิ์สิทธิ์คือเสียงของศรัทธาเก่าที่บริสุทธิ์แล้ว บ้างว่านางคือผู้ประกาศศรัทธาใหม่\n\nทั้งสองฝ่ายรอให้ท่านเอ่ยวาจา และทั้งสองฝ่ายต่างมีดาบอยู่ในมือ"
 eternal_maiden.0205.a: "ยืนข้างศรัทธาเก่า ความเป็นหนึ่งเดียวอยู่เหนือสิ่งอื่นใด"
 eternal_maiden.0205.b: "นำฝ่ายปฏิรูป ให้ศรัทธาใหม่จารึกนามของท่าน"
 eternal_maiden.0205.c: "ไม่กล่าวสิ่งใด แล้วขายข้าวให้ทั้งสองฝ่าย"
 eternal_maiden.0206.t: "ฎีกาของเหล่าภคินี"
 eternal_maiden.0206.desc: "คณะภคินีผู้ถือพรตคณะหนึ่งขอความคุ้มครองและการอุปถัมภ์จากท่าน พวกนางว่าจะสวดภาวนาให้ท่านทั้งวันทั้งคืน และจะไปทุกแห่งที่ท่านส่งไป\n\nทุกแห่งที่ท่านส่งไป ทั้งเรือนของตระกูลใหญ่ โรงหมอ และข้างเตียงทุกเตียงที่ผู้คนกระซิบความลับในวาระสุดท้าย"
 eternal_maiden.0206.a: "อุปถัมภ์อารามของพวกนาง แล้วปล่อยให้พวกนางทำกุศลไป (100 ทอง)"
 eternal_maiden.0206.b: "รับไว้ แล้วสอนพวกนางให้ตั้งใจฟังทุกถ้อยคำข้างเตียง"
 eternal_maiden.0206.c: "ปฏิเสธ ท่านไม่ต้องการคำภาวนาของผู้ใด"
 eternal_maiden.0207.t: "ทศางค์ที่ถูกหน่วงไว้"
 eternal_maiden.0207.desc: "[maiden_vassal.GetTitledFirstName]มิได้ส่งทศางค์ให้ศาสนจักรมาสองปีแล้ว ซ้ำยังโอ้อวดบนโต๊ะเสวยว่า สตรีใต้ผ้าคลุมไม่มีวันเก็บมันได้\n\nคำโอ้อวดนั้นมาถึงหูท่านแล้ว และบัดนี้[maiden_vassal.GetTitledFirstName]เองก็มาถึงเช่นกัน ถูกเรียกตัวมาด้วยใบหน้าซีดเผือด"
 eternal_maiden.0207.a: "“จ่ายเสีย หรือจะถูกขับออกจากศาสนา” ริบทั้งทศางค์และศักดิ์ศรี"
 eternal_maiden.0207.b: "ยกหนี้ให้ต่อหน้าผู้คน ให้ความเมตตาเป็นโซ่ตรวนที่หนักกว่า"
 eternal_maiden.0207.c: "เรียกเป็นสองเท่า แล้วให้ขุนนางทุกผู้ได้ยินว่ามันต้องจ่ายเท่าใด"
 eternal_maiden.0208.t: "เสียงเล่าลือถึงความเป็นนักบุญ"
 eternal_maiden.0208.desc: "ตามโรงเตี๊ยมและระเบียงคด ผู้คนเริ่มเรียกขานท่านว่านักบุญแล้ว ทั้งที่ท่านยังมีลมหายใจอยู่\n\nอธิการผู้คงแก่เรียนผู้หนึ่งเขียนหนังสือว่าด้วยปาฏิหาริย์ของท่าน บางเรื่องในนั้นเกิดขึ้นจริงเสียด้วย"
 eternal_maiden.0208.a: "รับศรัทธาของพวกเขาไว้ สวรรค์ได้ตรัสผ่านพวกเขาแล้ว"
 eternal_maiden.0208.b: "“ข้าเป็นเพียงผู้รับใช้” ให้ความถ่อมตนทำให้ตำนานเติบใหญ่"
 eternal_maiden.0208.c: "เรียกร้องให้ศาสนจักรประกาศรับรองอย่างเป็นทางการ"
 eternal_maiden.0209.t: "คำสารภาพของนักบวช"
 eternal_maiden.0209.desc_f: "[maiden_speaker.GetTitledFirstName]คุกเข่าลงในห้องสารภาพบาป ทว่ามิได้มาเพื่อสารภาพ “ข้ารู้ว่าในจอกที่งานเลี้ยงของบิชอปมีสิ่งใดเจ้าค่ะ ท่านหญิงผู้ศักดิ์สิทธิ์ ข้ารู้ว่าผู้ใดเป็นคนถือมันไป ข้ายังมิได้บอกผู้ใด”\n\nนางเว้นจังหวะไปครู่หนึ่ง “ยังมิได้บอกเจ้าค่ะ”"
 eternal_maiden.0209.desc_m: "[maiden_speaker.GetTitledFirstName]คุกเข่าลงในห้องสารภาพบาป ทว่ามิได้มาเพื่อสารภาพ “ข้ารู้ว่าในจอกที่งานเลี้ยงของบิชอปมีสิ่งใดขอรับ ท่านหญิงผู้ศักดิ์สิทธิ์ ข้ารู้ว่าผู้ใดเป็นคนถือมันไป ข้ายังมิได้บอกผู้ใด”\n\nเขาเว้นจังหวะไปครู่หนึ่ง “ยังมิได้บอกขอรับ”"
 eternal_maiden.0209.a: "“ถ้าเช่นนั้นเจ้าเป็นของข้าแล้ว” ประทานอภัยบาป แล้วยึดครองชีวิตเขาไว้"
 eternal_maiden.0209.b: "“ผู้ใดจะเชื่อเจ้าเล่า” แล้วทำให้แน่ใจว่าจะไม่มีใครเชื่อเลย"
 eternal_maiden.0209.c: "ตอบแทนความเงียบของเขาอย่างงาม (100 ทอง)"
