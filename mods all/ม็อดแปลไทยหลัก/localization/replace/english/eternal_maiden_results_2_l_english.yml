l_english:
 eternal_maiden.1200.t: "ถ้อยตอบของธิดาแห่งศรัทธา"
 eternal_maiden.1200.desc: "ท่านเขียนคำตอบด้วยมือของท่านเอง ด้วยลายมือเรียบง่ายที่สุดเท่าที่มี และมิได้ลงนามด้วยฐานันดรใด ท่านกล่าวขอบคุณ[maiden_target.GetTitledFirstName]ในโอวาท ทูลขอพรสำหรับหนทางแสวงบุญ และว่าท่านถือพรสวรรค์ของตนประดุจตะเกียงที่ยืมมา พร้อมคืนเมื่อถูกทวง\n\nคำตอบมาถึงในสิบเอ็ดวัน และอบอุ่น อบอุ่นดั่งกำแพงที่แดดต้องมาตลอดบ่าย ไม่มีถ้อยคำใดใช้กล่าวโทษท่านได้ และไม่มีถ้อยคำใดเป็นคำมั่น\n\nผู้แสวงบุญได้ยินเรื่องจดหมายจากเสมียนผู้เก็บความลับมิได้ จึงเพิ่มบทสวดอีกหนึ่งท่อน"
 eternal_maiden.2200.t: "สวรรค์มีหลายเสียง"
 eternal_maiden.2200.desc: "\"สวรรค์มิเคยขาดปาก\" ท่านเขียน \"สวรรค์ขาดแต่หู\" ท่านส่งจดหมายไปกับม้าเร็วผู้ไม่ได้ล่วงรู้เนื้อความ และได้รับค่าจ้างมากพอที่จะไม่ถาม\n\nความเงียบที่ตามมายาวนานหนึ่งเดือน และดังที่สุดในนครหลวง พระสังฆราชทั้งหลายเดินระมัดระวังขึ้นเล็กน้อย พระผู้ใหญ่ที่ท่านไม่เคยพบส่งมะเดื่อมาเป็นของกำนัล ในตลาดมีเรื่องเล่าว่าสตรีศักดิ์สิทธิ์ตอบประมุขแห่งศรัทธาดั่งกษัตริย์องค์หนึ่งตอบอีกองค์หนึ่ง\n\nนั่นเป็นทั้งคำชมและมีดคมกริบ และท่านรู้ดีว่าด้านใดชี้ไปยังผู้ใด"
 eternal_maiden.3200.t: "บรรทัดเดียวที่กล่าวทุกสิ่ง"
 eternal_maiden.3200.desc: "จดหมายมีเพียงบรรทัดเดียว กล่าวถึงราตรีหนึ่ง สวนหนึ่ง และถ้อยคำที่เอ่ยกันที่นั่น อันทั้งสองฝ่ายมิเคยเล่าซ้ำ มิได้คุกคาม เพียงตั้งอยู่ในหน้ากระดาษดั่งก้อนหินกลางลำธาร\n\nคำตอบมิใช่คำตอบ ผู้ส่งสารมาถึงพร้อมกล่องเครื่องหอมชั้นเลิศและบันทึกด้วยลายมือที่สั่นเล็กน้อย \"ข้าระลึกถึงสวนนั้นดี\"\n\nท่านมิได้มีมิตรเพิ่ม ท่านได้สิ่งที่มีประโยชน์กว่ามาก และอดทนกว่ามาก"
 eternal_maiden.5200.t: "ประมุขแห่งศรัทธากล่าวถึงท่าน"
 eternal_maiden.5200.desc_a: "ข่าวกลับมาจากหนทางแสวงบุญโดยมิต้องร้องขอ ประมุขแห่งศรัทธาเอ่ยชมจดหมายของท่านในที่ประชุมเปิด \"นางเขียนดั่งสตรีผู้ไม่ต้องหวาดหวั่น\" ท่านว่า และยังมีอีกหลายถ้อยคำ ทุกบรรทัดล้วนเมตตา\n\nคำชมเช่นนี้ซื้อไม่ได้ และเรียกคืนมิได้"
 eternal_maiden.5200.desc_b: "ข่าวลือมาถึงท่านจากสามทางพร้อมกัน ในการประชุมลับของสภา มีผู้หยิบจดหมายของท่านขึ้นมา และไม่มีผู้ใดเอ่ยปากอยู่นาน จนพระผู้ใหญ่ท่านหนึ่งกล่าวเบา ๆ ว่าบางทีสตรีศักดิ์สิทธิ์ควรได้รับการปฏิบัติดั่งกษัตริย์\n\nญัตติมิได้ผ่าน ความเงียบภายหลังนั้น ท่านได้ยินมาว่า คือการลงคะแนนอย่างหนึ่ง"
 eternal_maiden.5200.desc_c: "หีบพระธาตุเล็กมาถึงประตูท่านในห่อธรรมดา ไร้ตราประทับ ข้างในคือหวีด้ามกระดูกว่าเป็นของนักบุญ พร้อมบันทึก \"จากผู้ที่มิเคยลืมสวนนั้น\"\n\nเป็นทั้งบุญคุณและคำเตือน ท่านเก็บหวีไว้ และมิลืมสวนนั้นเช่นกัน"
 eternal_maiden.1201.t: "เชิงตะกอนยามสนธยา"
 eternal_maiden.1201.desc: "พวกเขาก่อเชิงตะกอนกลางลานตลาดยามสนธยา นักเทศก์ปีนขึ้นไปเองด้วยคางเชิดและมือถูกมัด เมื่อเปลวไฟแรกติด ทั้งนครเงียบสนิท แล้วอย่างน่าประหลาด มีผู้หนึ่งเริ่มขับร้อง\n\nเป็นบทสวดของเขา มิใช่ของท่าน ไม่นานทั้งลานก็ร้องตาม แม้ผู้ที่เคยสาบานว่าชังทุกถ้อยคำ และนักเทศก์ ทั้งที่เปลวไฟสูงถึงเข่า ก็หลับตาลงแล้วยิ้ม ดั่งผู้ได้กล่าวคำสุดท้าย\n\nท่านยืนบนระเบียงมองควันลอยขึ้น ท่านมั่นใจสิ่งเดียว เรื่องนี้มิจบลงในวันนี้"
 eternal_maiden.1201.desc_hi: "เสมียนผู้บันทึกการประหารจดมากกว่าคำพิพากษา เขาจดถ้อยคำของนักเทศก์ถึงน้ำพุผู้แสวงบุญและห้องใต้ดินที่ปิดผนึก และมีผู้พบเห็นเขาสนทนากับชายในผ้าคลุมสีเทา"
 eternal_maiden.1201.desc_lo: "รุ่งเช้าขี้เถ้าถูกกวาด ลานตลาดถูกขัดล้าง และเรื่องก็ปิดลง ณ บัดนี้"
 eternal_maiden.2201.t: "วาทะกลางลาน"
 eternal_maiden.2201.desc: "ท่านมิได้เสียงดัง ท่านประทับบนเก้าอี้ธรรมดาใต้หอนาฬิกา นักเทศก์นั่งบนตั่งตรงข้าม ท่านถามเขาทีละข้อว่าเขาเชื่อสิ่งใดจริง ๆ เพราะเหตุใด ใครเป็นผู้สอน และจะทำเช่นไรในวันที่พิสูจน์ได้ว่าเขาผิด\n\nฝูงชนที่มาด้วยหวังชมมหรสพค่อย ๆ เงียบลง เขามิใช่คนโง่และต่อสู้ได้ดี ทว่าผู้ปกป้องความเท็จต่อหน้าผู้อดทนย่อมถือไพ่ที่แพ้ เมื่อชั่วโมงที่สามเขามิมองท่านอีก เมื่อชั่วโมงที่สี่เขาร่ำไห้\n\nเขาถอนคำ และฝูงชนก็ปรบมือด้วยความประหลาดใจของตนเอง"
 eternal_maiden.3201.t: "เมล็ดพันธุ์ในสายลมอื่น"
 eternal_maiden.3201.desc: "ท่านชำระค่าปรับให้นักเทศก์เอง มอบลาหนึ่งตัว และส่งเขาไปด้วยรอยยิ้มและแผนที่ชี้ไปยังทุกนครที่เคยทำให้ท่านขุ่นเคือง เขาเป็นผู้มีความสามารถและสงสัยในของกำนัล ทว่าคนอิสระที่มีผู้ฟังย่อมมีจุดมุ่งหมาย\n\nภายในหนึ่งฤดู เรื่องกลับมาถึงท่านจากสามทิศ นักเทศก์ทางใต้บอกราชสำนักคู่อริว่าสตรีศักดิ์สิทธิ์เป็นแม่มด และโน้มน้าวได้ยิ่งนัก ราชสำนักเหล่านั้นก็วุ่นอยู่กับลัทธินอกรีตของตนเอง\n\nมิใช่ชัยชนะอันหมดจด ทว่าสง่างามยิ่ง"
 eternal_maiden.1202.t: "ประตูที่เปิดออก"
 eternal_maiden.1202.desc: "ท่านมิได้เคาะ ท่านก้าวผ่านประตูไม้โอ๊กพร้อมมหาดเล็กสองนายและผ้าคลุมหน้า เสียงทั้งปวงในห้องประชุมดับลง พระสังฆราชสิบสององค์เงยหน้า องค์หนึ่งถือร่างมติเขียนค้างไว้ และพยายามซ่อนไว้ข้างหลังอย่างไม่สำเร็จ\n\n\"เชิญเถิด\" ท่านกล่าวพลางนั่งเก้าอี้ว่างหัวโต๊ะ \"โปรดดำเนินต่อ ข้าหวังนักว่าจะได้ฟังถ้อยคำของท่านเกี่ยวกับข้า\"\n\nพวกเขาดำเนินต่อ ด้วยเสียงของผู้อ่านประกาศงานศพของตนเอง"
 eternal_maiden.1202.desc_hi: "ในหมู่สิบสององค์ มีพระสังฆราชหนึ่งมิได้ดูหวาดกลัว เขาดูครุ่นคิด สายตาจับอยู่ที่มือของท่าน และภายหลังเขาเขียนจดหมายอย่างระมัดระวังยิ่งถึงสหายที่อยู่ไกล"
 eternal_maiden.1202.desc_lo: "เมื่อท่านจากไป มติถูกถอนอย่างเงียบ ๆ และพระสังฆราชหนุ่มที่สุดขออาสาถือผ้าคลุมของท่านไปส่งถึงประตู"
 eternal_maiden.2202.t: "ปล่อยผู้เฒ่าพูด"
 eternal_maiden.2202.desc: "ท่านส่งเหล้าองุ่นและข้อความว่าสตรีศักดิ์สิทธิ์ไว้วางใจในปัญญาของพวกเขาเต็มที่ แล้วท่านก็เสด็จเดินเล่นในสวนหลวงอย่างสบายใจ มิได้นึกถึงพระสังฆราชเลย\n\nสภาประชุมสองวัน และออกมติที่ไร้ความหมายอย่างวิจิตรครบถ้วน จนต้องใช้ล่ามสามคนตัดสินว่ามติกล่าวอะไร ในที่สุดมันกล่าวว่าสตรีศักดิ์สิทธิ์เป็น \"เรื่องที่ควรสวดภาวนาต่อไป\"\n\nท่านมิอาจเขียนได้ดีกว่านี้ และบางส่วนของท่านสงสัยว่าท่านเขียนจริง ในความหมายที่สำคัญ"
 eternal_maiden.3202.t: "ของกำนัลในทุกที่พำนัก"
 eternal_maiden.3202.desc: "ของกำนัลเล็กและเจาะจง หนังสือหายากสำหรับนักปราชญ์ ม้าตัวงามสำหรับผู้ชอบขี่ จดหมายแนะนำสำหรับหลานชายที่ยังมิได้เป็นพระ ไม่มีสองชิ้นเหมือนกัน และไม่มีชิ้นใดเป็นสินบน เพราะสินบนคือสิ่งที่ผู้ให้ปิดบัง\n\nรุ่งเช้าพระสังฆราชทุกองค์ในสภามีเหตุผลส่วนตัวที่จะคิดดีต่อท่าน และเหตุผลสาธารณะที่จะกล่าวเช่นนั้น มติเมื่ออ่านขึ้นกลายเป็นบทสรรเสริญ\n\nที่ใดสักแห่งในห้องมีชายผู้รู้แน่ว่าเกิดอะไรขึ้น และเขายิ้มอย่างสุภาพยิ่งต่อรองเท้าของตน"
 eternal_maiden.1203.t: "นิ้วกระดูกในความมืด"
 eternal_maiden.1203.desc: "สำเร็จในคืนเดียว และเรียบร้อย พระสองรูปหลับไหล สุนัขได้อาหารที่ทำให้สุนัขมีความสุขยิ่ง หีบพระธาตุเลื่อนลงในกล่องเดินทางด้วยเสียงดั่งการกลั้นลมหายใจ\n\nสามวันถัดมา พระธาตุถูก \"พบ\" ในซอกของแท่นบูชาท่านเอง หลังผนังที่ว่าปิดผนึกมาสองศตวรรษ ปาฏิหาริย์ถูกเป็นพยานโดยผู้แสวงบุญที่คัดสรรอย่างดีหนึ่งโหล และมหาวิหารของท่านร่ำไห้ด้วยปีติ\n\nมหาวิหารคู่แข่งร่ำไห้เช่นกัน ด้วยเหตุผลต่างออกไป และท่านมิได้ยื่นผ้าเช็ดหน้าให้"
 eternal_maiden.2203.t: "การซื้อขายอย่างซื่อตรง"
 eternal_maiden.2203.desc: "ท่านส่งทูตสุภาพพร้อมข้อเสนอเป็นธรรมและกองเกียรติยศที่เห็นได้ชัด มหาวิหารซึ่งเตรียมจะปฏิเสธ พบว่าไม่อาจกล่าวเช่นนั้นต่อหน้าผู้แสวงบุญที่ตนพยายามเอาใจ\n\nพระธาตุมาถึงท่านในขบวน มหาวิหารได้ราคาของตน และชื่อเสียงของสถานที่ที่ขายนักบุญของตัว ผู้แสวงบุญซึ่งคาดว่าจะเป็นการลักขโมย รู้สึกซาบซึ้งในสุจริตของท่านเล็กน้อย และไม่สบายใจกับสีหน้าของเจ้าอาวาสเล็กน้อย\n\nนิ้วกระดูกถูกตั้งแสดงในตู้กระจกใหม่ ดูเล็กกว่าที่ท่านหวัง และนั่นคือข้อบกพร่องเดียว"
 eternal_maiden.3203.t: "พระธาตุเป็นเพียงกระดูก"
 eternal_maiden.3203.desc: "\"ในราชสำนักของข้ามีกวีผู้หนึ่ง\" ท่านบอกผู้แสวงบุญที่ชุมนุม \"ซึ่งสลักนิ้วกระดูกจากขาหมูได้ในเวลาที่สวดภาวนาจบบทหนึ่ง ข้าขอให้เขาแสดงให้พวกท่านดู\"\n\nกวีทำตาม ห้องเย็นเยียบ เจ้าอาวาสแห่งมหาวิหารคู่แข่งนั่งลงบนม้านั่งอย่างช้า ๆ และผู้แสวงบุญฝั่งของเขาก็เริ่มข้ามมายังฝั่งท่านทีละคน\n\nไม่มีสิ่งใดในศรัทธาที่ห้ามสิ่งนี้ มีเพียงทุกสิ่งที่ทำให้มันรู้สึกเป็นบาปเล็ก ๆ ที่สว่างไสว"
 eternal_maiden.5203.t: "พระธาตุกลายเป็นสิ่งใด"
 eternal_maiden.5203.desc_a: "พระธาตุเริ่มรักษาผู้คน ไม่มาก ไม่บ่อย แต่พอที่มหาวิหารคู่แข่งหยุดเอ่ยถึง และผู้แสวงบุญที่มายังแท่นบูชาของท่านทิ้งเครื่องบูชาที่หนักกว่าที่นำมา\n\nท่านมิแน่ใจว่ากระดูกนั้นศักดิ์สิทธิ์จริงหรือไม่ ท่านแน่ใจยิ่งว่าความเชื่อศักดิ์สิทธิ์"
 eternal_maiden.5203.desc_b: "มหาวิหารคู่แข่งละทิ้งสิทธิ์ในพระธาตุอย่างเงียบ ๆ และเริ่มขออนุญาตส่งผู้แสวงบุญมาชม ทำให้ท่านขบขันเล็กน้อย ท่านอนุญาต พร้อมค่าผ่านทางอย่างใจกว้าง\n\nเป็นครั้งแรกในหลายปีที่มีผู้จ่ายเงินเพื่อคืนดีกับท่าน"
 eternal_maiden.5203.desc_c: "สามเดือนถัดมา พระธาตุของมหาวิหารคู่แข่งถูกเปิดโปงว่าเป็นของปลอม และเจ้าอาวาสถูกปลด กวีในราชสำนักท่านถ่อมตนผิดปกติมาตั้งแต่นั้น\n\nเป็นเรื่องที่ท่านมิเล่า เป็นเรื่องที่เล่าตัวมันเอง"
 eternal_maiden.1204.t: "เสวยร่วมกับผู้ไต่สวน"
 eternal_maiden.1204.desc: "ท่านเลี้ยงเขาด้วยสิ่งดีที่สุดบนโต๊ะของท่านและไม่มีความลับของท่านเลย ท่านถามถึงมารดาของเขา โรงเรียนสงฆ์ ความสงสัยใหญ่หลวงเมื่อวัยเยาว์ และท่านฟังราวกับทุกคำตอบเป็นสิ่งน่าสนใจสิ่งแรกที่ใครเล่าให้ท่านฟังในรอบสิบปี\n\nเขาอยู่สี่วันแทนสองวัน ในค่ำสุดท้ายเขาเผลอเอื้อมไปหยิบสมุดบัญชี แล้ววางลงด้วยความเขินอาย และถามว่าสตรีศักดิ์สิทธิ์จะโปรดประสาทพรให้ข้าหรือไม่\n\nท่านประสาท และเขาจากไปในตอนเช้า และเขียนรายงานซึ่งสำหรับผู้ไต่สวนแล้ว เกือบเป็นจดหมายรัก"
 eternal_maiden.2204.t: "ไข้กลางทาง"
 eternal_maiden.2204.desc: "ผู้ไต่สวนจากไปยามรุ่งอรุณพร้อมขนมปังน้ำผึ้งเป็นของกำนัล สองสัปดาห์ต่อมาม้าเร็วนำข่าวว่าเขาล้มป่วยที่โรงเตี๊ยมข้างทางและสิ้นใจก่อนพระจะมาถึง น่าเศร้านัก\n\nศาสนจักรส่งผู้ไต่สวนใหม่ ชายผู้นี้ระมัดระวังกว่า และเก็บขนมปังไว้กินเอง เขายังพบว่าพยานจำนวนมากซึ่งเมื่อสัปดาห์ก่อนเต็มใจพูด กลับเกิดความไม่เต็มใจอย่างฉับพลันและสิ้นเชิง\n\nท่านเสียใจแทนมารดาของเขา ดั่งเสียใจต่อสิ่งที่เกิดขึ้นแน่นอนอยู่แล้ว"
 eternal_maiden.3204.t: "บาปน้อย ๆ ที่มอบให้เอง"
 eternal_maiden.3204.desc: "ท่านคุกเข่าในห้องสารภาพต่อหน้าเขา และเล่าบาปหนึ่ง เป็นบาปเล็ก ๆ ของมนุษย์ ความโกรธวูบหนึ่ง คำโกหกด้วยเมตตา ราตรีแห่งความริษยาพ่อครัวที่เก่งกว่า และท่านเล่าด้วยความถ่อมตนอย่างเป็นธรรมชาติจนเขาปั่นป่วนไปหมด\n\nเขาอภัยโทษแก่ท่าน และมิได้เปิดสมุดบัญชี ผู้ที่เห็นสิ่งเลวร้ายที่สุดที่คนยอมรับ ย่อมนึกไม่ออกว่ามีสิ่งเลวร้ายใหญ่กว่านั้นซ่อนอยู่เบื้องหลัง\n\nเขาจากไปด้วยใจสะอาดและหน้ากระดาษว่าง และท่านได้มอบทุกสิ่งที่เขามาตามหาแล้ว"
 eternal_maiden.1205.t: "ศรัทธาเก่า อันบริสุทธิ์"
 eternal_maiden.1205.desc: "ท่านยืนบนบันไดมหาวิหารในอาภรณ์เรียบง่ายแห่งพิธีเก่าแก่ที่สุด และเรียกร้องเอกภาพ ท่านมิได้กล่าวต่อต้านนักปฏิรูป ท่านกล่าวถึงศาสดาองค์แรกผู้เดินด้วยรองเท้าแตะ และมือมากมายที่ภายหลังสร้างบ้านครอบรอยเท้า\n\nผู้ยึดจารีตร่ำไห้ด้วยโล่งใจ นักปฏิรูปผู้คาดว่าจะถูกประณาม พบว่าตนได้รับเชิญเข้าร่วมงานเลี้ยง และส่วนใหญ่ก็นั่งลงด้วยความระมัดระวัง\n\nความแตกแยก ท่านเตือนตนเอง เป็นเพียงข้อพิพาทที่ไม่มีใครมีความอดทนจะเอาชนะ"
 eternal_maiden.2205.t: "ศรัทธาใหม่ที่มีนามของท่าน"
 eternal_maiden.2205.desc: "ท่านชูธงของนักปฏิรูปหน้ามหาวิหาร ครึ่งนครร่ำไห้และอีกครึ่งโห่ร้อง พระสังฆราชเฒ่าซีดเผือด ผู้เยาว์ซึ่งรอมาหลายปีให้ใครสักคนกล่าวสิ่งนี้ คุกเข่าลงในฝุ่น\n\nเป็นห้วงเวลาอันงดงามยิ่ง ตามวิถีของสิ่งเช่นนี้ และจะต้องแลกด้วยชีวิตมากมายก่อนจบ ท่านรู้ ท่านยังเลือกมัน เพราะมีห้วงเวลาในประวัติศาสตร์ที่นำจะดีกว่ามองดู\n\nเมื่อค่ำลง ผู้ศรัทธากล่าวนามท่านในทำนองใหม่ และครึ่งหนึ่งเชื่อแล้วว่ามันเป็นของพวกเขามาตั้งแต่ต้น"
 eternal_maiden.3205.t: "ธัญญาหารแก่ทั้งสองฝ่าย"
 eternal_maiden.3205.desc: "ท่านส่งประกาศเงียบ ๆ ถึงผู้ดูแลยุ้งฉาง สตรีศักดิ์สิทธิ์จะขายในราคายุติธรรมแก่ผู้ใดก็ตามที่มา และมิถามถึงธง\n\nเมื่อสิ้นเดือน ทั้งสองค่ายอิ่มท้อง ทั้งสองติดหนี้ และไม่มีผู้ใดเดินทัพต่อต้านอีกฝ่ายได้โดยไม่ผูกไมตรีกับท่านก่อน ดาบต้องมีท้องหนุนหลัง และท่านซื้อท้องเหล่านั้นไว้แล้ว\n\nเป็นอำนาจชนิดไร้ความงดงาม และทนทานที่สุดเท่าที่มี"
 eternal_maiden.5205.t: "ศรัทธา หนึ่งฤดูต่อมา"
 eternal_maiden.5205.desc_a: "หนึ่งฤดูต่อมา ข้อพิพาทเลือนเป็นเรื่องเล่าเรื่องเดียวในงานเลี้ยง สตรีศักดิ์สิทธิ์ยืนบนบันไดในอาภรณ์เรียบง่าย เรียกทุกคนกลับบ้าน นับแต่นั้นไม่มีลัทธินอกรีตใดหยั่งรากอีก ผู้ศรัทธาสงบขึ้น อ่อนโยนขึ้น และเป็นของท่านยิ่งขึ้น"
 eternal_maiden.5205.desc_b: "หนึ่งฤดูต่อมา นักปฏิรูปมีนาม บทสวด และธง และธงนั้นมีใบหน้าท่าน เป็นสิ่งน่าอึดอัดที่เห็นบนกำแพงในหมู่บ้านที่ท่านไม่เคยไปเยือน และท่านสังเกตว่า มีประโยชน์ยิ่งเช่นกัน"
 eternal_maiden.5205.desc_c: "หนึ่งฤดูต่อมา ความแตกแยกกลายเป็นภาวะชะงักงันอันยาวนานและแพงหูฉี่ และยุ้งฉางที่ท่านออกทุนอย่างเงียบ ๆ คือสิ่งเดียวที่ทั้งสองฝ่ายยังเห็นพ้อง ท่านได้รับเงิน และได้รับอีก และการจ่ายมิสิ้นสุด"
 eternal_maiden.1206.t: "อารามชายขอบเมือง"
 eternal_maiden.1206.desc: "ท่านบริจาคสวนผลไม้ โรงเรียน และโรงพยาบาลเล็ก ๆ แก่อาราม และมิขอสิ่งใดตอบแทน ภคินีทั้งหลายงงงันกับของกำนัล แล้วซาบซึ้งอย่างลึกซึ้งและถ่อมตน\n\nภายในปี อารามกลายเป็นที่ซึ่งสตรีนำบุตรมาเมื่อไม่มีใครให้พึ่ง และชาวเมืองเริ่มเอ่ยนามท่านดั่งเอ่ยถึงสภาพอากาศ ด้วยความกตัญญูเงียบ ๆ ของผู้ที่พึ่งพามัน\n\nความดี ท่านรำพึง ไม่เคยสูญเปล่า เพียงแต่ถูกลงทุน"
 eternal_maiden.2206.t: "ภคินีผู้เงี่ยหูฟัง"
 eternal_maiden.2206.desc: "ท่านรับพวกนางอย่างงามสง่า และในเดือนแรกท่านสอนศิลปะอ่อนโยนเล็ก ๆ วิธีนั่งข้างเตียงผู้ป่วย วิธีเงียบ วิธีฟังสิ่งที่พูดเมื่อผู้ป่วยคิดว่าไม่มีใครได้ยิน\n\nพวกนางเป็นศิษย์ดีเยี่ยม ภายในหนึ่งปี ไม่มีราชตระกูลใหญ่ในอาณาจักรที่ไม่มีภคินีข้างเตียงผู้ใกล้สิ้นลม และไม่มีเสียงกระซิบบนที่นอนมรณะใดที่ไม่หาทางกลับมายังห้องเงียบในพระราชวังของท่านไม่ช้าก็เร็ว\n\nมันคือการสวดภาวนาอย่างหนึ่ง ท่านเตือนตนเอง"
 eternal_maiden.3206.t: "ข้าไม่ต้องการคำภาวนาของผู้ใด"
 eternal_maiden.3206.desc: "ท่านรับพระแม่อธิการด้วยมารยาทสมบูรณ์ และปฏิเสธทุกสิ่งที่นางขอด้วยมารยาทเท่ากัน ท่านว่าท่านมิต้องการคำภาวนา ต้องการเพียงการกระทำ และอวยพรให้คณะของนางเจริญ\n\nนางจากไปด้วยศีรษะเชิดและมือพนม และแววตาที่ท่านอ่านไม่ออกนัก เป็นแววตาของสตรีผู้เพิ่งจดบันทึกอย่างระมัดระวังยิ่ง\n\nทว่าเรื่องการปฏิเสธของท่านเมื่อแพร่ออกไป ถูกเล่าด้วยความเกรงขาม สตรีศักดิ์สิทธิ์ผู้ไม่ต้องการสิ่งใดจากผู้ใด"
 eternal_maiden.1207.t: "ส่วนสิบและความทะนง"
 eternal_maiden.1207.desc: "[maiden_target.GetTitledFirstName]มาถึงท้องพระโรงพร้อมสมุดบัญชีใต้แขนข้างหนึ่งและคำปราศรัยใต้แขนอีกข้าง และพบว่าคำปราศรัยไม่จำเป็น ท่านบอกว่าส่วนสิบของศาสนจักรมิใช่หนี้ แต่เป็นประตู และผู้นั้นยืนอยู่หน้าประตูมาสองปี แสร้งทำมิเห็น\n\nส่วนสิบถูกชำระครบพร้อมดอกเบี้ย ในพิธีที่ต้องคุกเข่า ไม่มีผู้ใดในท้องพระโรงหัวเราะ นั่นแหละคือความโหดร้ายของมัน"
 eternal_maiden.1207.desc_hi: "ที่ท้ายห้องมีเสมียนบัญชีผู้เห็นทั้งหมดนี้และจดลงด้วยลายมือเล็กเรียบร้อย เขามิได้อยู่ในบัญชีเงินเดือนของท่าน"
 eternal_maiden.1207.desc_lo: "เมื่อค่ำ หนี้ถูกลืมโดยทุกคนยกเว้นลูกหนี้ ผู้จะจดจำไปตลอดชีวิต"
 eternal_maiden.2207.t: "เมตตา โซ่ที่หนักกว่า"
 eternal_maiden.2207.desc: "ท่านยกหนี้ต่อหน้าสาธารณะ ต่อหน้าทั้งราชสำนัก ด้วยความงามสง่าเป็นธรรมชาติจน[maiden_target.GetTitledFirstName]หาถ้อยคำตอบไม่ได้สักคำ เมตตาที่มอบกลางแจ้งปฏิเสธมิได้ ตอบแทนมิได้ และทำให้ผู้รับเป็นหนี้ท่านในแบบที่สมุดบัญชีใดก็ชำระมิได้\n\nพวกเขาชำระส่วนสิบเต็มปีภายในสัปดาห์ และของปีหน้าโดยมิต้องทวง และปีต่อมาก็ส่งของกำนัลมา ผู้ได้รับการอภัย ท่านรู้มาแต่ช้านาน เป็นผู้ภักดีที่สุด"
 eternal_maiden.3207.t: "สองเท่า และให้พวกเขาได้ยิน"
 eternal_maiden.3207.desc: "\"สองเท่า\" ท่านกล่าว ด้วยเสียงที่ท้องพระโรงพาไปถึงมุมไกลสุด \"และค้างชำระ และค่าปรับ และดอกเบี้ยของดอกเบี้ย\" ท่านเพิ่มตัวเลข เป็นตัวเลขที่ท่านเชื่อว่าข้าราชบริพารจ่ายได้ และมิขาดสักเหรียญ\n\n[maiden_target.GetTitledFirstName]ชำระ ขุนนางทุกคนในท้องพระโรงมองดู และทุกคนกลับบ้านคืนนั้นตรวจบัญชีตนสองรอบ\n\nท่านมิได้มีมิตรเพิ่ม ท่านได้บุรุษผู้ระมัดระวังเป็นจำนวนมาก"
 eternal_maiden.3207.desc_hi: "ภรรยาของขุนนางผู้มองดูจากระเบียงมิได้ลืม และกำลังเขียนจดหมายที่ท่านจะไม่ชอบ"
 eternal_maiden.3207.desc_lo: "ภายในเดือน ส่วนสิบของอาณาจักรถูกชำระตรงเวลาเป็นครั้งแรกในความทรงจำของผู้ยังมีชีวิต"
 eternal_maiden.1208.t: "น้ำหนักแห่งความภักดี"
 eternal_maiden.1208.desc: "ท่านปล่อยให้พวกเขากล่าวถึงท่านดั่งนักบุญ ท่านมิยืนยันและมิปฏิเสธ เพียงยิ้มเมื่อพวกเขาคุกเข่าและอวยพรเมื่อขอ ไม่กี่สัปดาห์ เรื่องนี้ก็ฝังแน่นในใจผู้ศรัทธาจนการปฏิเสธจะดูเป็นการหมิ่นพระเจ้า\n\nหนังสือปาฏิหาริย์ของเจ้าอาวาสถูกคัดลอกร้อยฉบับ ปาฏิหาริย์ที่มิได้เกิดขึ้นคือสิ่งที่ผู้แสวงบุญรักที่สุด\n\nท่านตระหนักว่าค่อย ๆ กลายเป็นสิ่งที่พวกเขาว่าท่านเป็น และท่านมิแน่ใจว่ารู้สึกเช่นไร"
 eternal_maiden.2208.t: "ผู้รับใช้ผู้ถ่อมตน"
 eternal_maiden.2208.desc: "\"ข้าเป็นเพียงผู้รับใช้\" ท่านบอกพวกเขา ด้วยสายตาทอดต่ำและรอยยิ้มอ่อนหวานของผู้จริงใจยิ่ง \"และข้ามิได้ทำสิ่งใดที่ท่านทั้งหลายมิทำเช่นกันหากอยู่ในที่ของข้า\"\n\nเป็นถ้อยคำได้ผลที่สุดที่ท่านกล่าวได้ ยิ่งท่านปฏิเสธ พวกเขายิ่งยืนกราน ยิ่งท่านถ่อมตน พวกเขายิ่งยกท่านขึ้น เมื่อสิ้นเดือนมีศาลเจ้าในนครหลวงจารึกนามท่าน และแถวหน้าศาลเจ้ามิเคยสั้นลง\n\nท่านเกือบภูมิใจที่ต้องทำน้อยนัก"
 eternal_maiden.3208.t: "ให้ศรัทธาประกาศเถิด"
 eternal_maiden.3208.desc: "ท่านส่งจดหมายสุภาพ เป็นทางการสมบูรณ์ ถึงประมุขแห่งศรัทธา ขอให้ผู้มีอำนาจพิจารณาการเป็นนักบุญของท่าน เป็นจดหมายประเภทที่ปฏิเสธมิได้โดยไม่ฟังเป็นการทะเลาะ และตอบรับมิได้โดยไม่ฟังเป็นการยอมแพ้\n\nสภาประชุม การโต้แย้งยาวนานและน่าสะพรึง จบลงด้วยข้อประนีประนอมที่ไม่มีใครชอบและทุกคนอยู่ได้ ท่านเป็น \"ผู้น่าเคารพ\" ถ้อยคำที่ไม่มีความหมายและมีทุกความหมาย\n\nยังมิใช่นักบุญ เป็นประตูสู่สิ่งนั้น และท่านยืนอยู่ที่ประตู"
 eternal_maiden.5208.t: "ลัทธิหยั่งราก"
 eternal_maiden.5208.desc_a: "หนึ่งฤดูต่อมา โบสถ์น้อยถูกถวายในนามท่านในแดนที่ท่านมิเคยไปเยือน พระผู้ทำพิธีเป็นสตรีท้องถิ่นผู้มิเคยเห็นใบหน้าท่านและร่ำไห้เมื่อเอ่ยนาม ท่านกำลังกลายเป็นสถานที่ ในแบบที่ท่านมิได้ตั้งใจ"
 eternal_maiden.5208.desc_b: "หนึ่งฤดูต่อมา หนังสือเล่มหนึ่งแพร่ในอาราม ชีวประวัติเงียบสงบเชิงปราชญ์ของสตรีศักดิ์สิทธิ์ เขียนโดยผู้ที่ท่านมิเคยพบ และอ่อนโยนจนท่านอ่านสองรอบ มิกล่าวถึงปาฏิหาริย์แม้สักข้อ และเป็นสิ่งอันตรายที่สุดที่ใครเคยเขียนถึงท่าน"
 eternal_maiden.5208.desc_c: "หนึ่งฤดูต่อมา ประมุขแห่งศรัทธาออกแถลงการณ์อย่างระมัดระวังยิ่งในที่สุดเรื่องความศักดิ์สิทธิ์ของท่าน มิได้กล่าวสิ่งใดแน่ชัด ทว่าเรียกท่านว่า \"ผู้ได้รับพร\" และในภาษาของศาสนจักร ถ้อยคำเพียงคำเดียวนั้นเพียงพอจะสร้างบัลลังก์"
 eternal_maiden.1209.t: "หนี้แห่งห้องสารภาพ"
 eternal_maiden.1209.desc_f: "ท่านอภัยโทษ[maiden_speaker.GetFirstName]ด้วยประโยคอ่อนโยนเพียงประโยคเดียว และปล่อยให้ความเงียบดำรงอยู่จนนางเริ่มร่ำไห้ \"หม่อมฉันจะไม่กล่าวถึงเรื่องนี้เลย หม่อมฉันขอตายเสียดีกว่า\"\n\n\"ข้ารู้\" ท่านกล่าว และท่านรู้จริง เป็นถ้อยคำเมตตาที่สุดที่ท่านกล่าวได้ และเป็นจุดจบของอิสรภาพของนางด้วย นับแต่วันนี้ นางจะแบกการอภัยของท่านดั่งปลอกคอ"
 eternal_maiden.1209.desc_m: "ท่านอภัยโทษ[maiden_speaker.GetFirstName]ด้วยประโยคอ่อนโยนเพียงประโยคเดียว และปล่อยให้ความเงียบดำรงอยู่จนเขาเริ่มร่ำไห้ \"ข้าพเจ้าจะไม่กล่าวถึงเรื่องนี้เลย ข้าพเจ้าขอตายเสียดีกว่า\"\n\n\"ข้ารู้\" ท่านกล่าว และท่านรู้จริง เป็นถ้อยคำเมตตาที่สุดที่ท่านกล่าวได้ และเป็นจุดจบของอิสรภาพของเขาด้วย นับแต่วันนี้ เขาจะแบกการอภัยของท่านดั่งปลอกคอ"
 eternal_maiden.2209.t: "ใครจะเชื่อเจ้า"
 eternal_maiden.2209.desc_f: "\"ใครจะเชื่อเจ้า\" ท่านถามเสียงเบา และ[maiden_speaker.GetFirstName]เข้าใจในประโยคเดียวนั้นว่าห้องสารภาพกลายเป็นกับดัก ภคินีผู้กล่าวหาสตรีศักดิ์สิทธิ์ว่าเป็นผู้วางยา จะพบว่าตนถูกประณามเป็นคนโกหก ขโมย สตรีมักง่ายและปากพล่อย\n\nเมื่อสิ้นเดือน[maiden_speaker.GetFirstName]ถูกย้ายไปอารามไกลอย่างเงียบ ๆ และคำกล่าวหาของนางมิเคยถูกจดไว้"
 eternal_maiden.2209.desc_m: "\"ใครจะเชื่อเจ้า\" ท่านถามเสียงเบา และ[maiden_speaker.GetFirstName]เข้าใจในประโยคเดียวนั้นว่าห้องสารภาพกลายเป็นกับดัก พระผู้กล่าวหาสตรีศักดิ์สิทธิ์ว่าเป็นผู้วางยา จะพบว่าตนถูกประณามเป็นคนโกหก ขโมย บุรุษมักง่ายและปากพล่อย\n\nเมื่อสิ้นเดือน[maiden_speaker.GetFirstName]ถูกย้ายไปอารามไกลอย่างเงียบ ๆ และคำกล่าวหาของเขามิเคยถูกจดไว้"
 eternal_maiden.3209.t: "ความเงียบที่จ่ายอย่างงาม"
 eternal_maiden.3209.desc_f: "ท่านมิเอ่ยถึงถ้วย หรือพระสังฆราช หรือชั่วโมงมืดยาวนานของงานเลี้ยง ท่านเพียงมอบบำนาญพอควร บ้านเล็กริมแม่น้ำ และจดหมายแนะนำเข้าโรงเรียนดีแก่หลานสาวของ[maiden_speaker.GetFirstName]\n\nนางเข้าใจสมบูรณ์ นางขอบคุณท่านด้วยเสียงมั่นคงจนตนเองหวาดกลัว ทุกปีในวันเดียวกัน นางจะได้รับของกำนัลเล็ก ๆ อีกชิ้น และทุกปีนางจะไม่กล่าวสิ่งใด และรู้สึกถึงน้ำหนักของมันมากขึ้นอีกนิด"
 eternal_maiden.3209.desc_m: "ท่านมิเอ่ยถึงถ้วย หรือพระสังฆราช หรือชั่วโมงมืดยาวนานของงานเลี้ยง ท่านเพียงมอบบำนาญพอควร บ้านเล็กริมแม่น้ำ และจดหมายแนะนำเข้าโรงเรียนดีแก่หลานสาวของ[maiden_speaker.GetFirstName]\n\nเขาเข้าใจสมบูรณ์ เขาขอบคุณท่านด้วยเสียงมั่นคงจนตนเองหวาดกลัว ทุกปีในวันเดียวกัน เขาจะได้รับของกำนัลเล็ก ๆ อีกชิ้น และทุกปีเขาจะไม่กล่าวสิ่งใด และรู้สึกถึงน้ำหนักของมันมากขึ้นอีกนิด"
