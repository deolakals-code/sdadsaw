l_english:
 eternal_maiden.0300.t: "คู่แข่งผู้ริษยา"
 eternal_maiden.0300.desc_f: "ในยามเสวยพระกระยาหารเย็น [maiden_speaker.GetTitledFirstName]ยกจอกขึ้นแล้วยิ้มข้ามโต๊ะมา “ขอดื่มให้ท่านหญิงผู้ศักดิ์สิทธิ์ของเรา ผู้บริสุทธิ์ยิ่งนักจนไม่เคยต้องอธิบายเลยว่ายามค่ำคืนไปที่ใดมาเจ้าค่ะ”\n\nบางคนในราชสำนักหัวเราะ ทว่าส่วนใหญ่หันมามองท่าน"
 eternal_maiden.0300.desc_m: "ในยามเสวยพระกระยาหารเย็น [maiden_speaker.GetTitledFirstName]ยกจอกขึ้นแล้วยิ้มข้ามโต๊ะมา “ขอดื่มให้ท่านหญิงผู้ศักดิ์สิทธิ์ของเรา ผู้บริสุทธิ์ยิ่งนักจนไม่เคยต้องอธิบายเลยว่ายามค่ำคืนไปที่ใดมาขอรับ”\n\nบางคนในราชสำนักหัวเราะ ทว่าส่วนใหญ่หันมามองท่าน"
 eternal_maiden.0300.a: "ตอบกลับด้วยประโยคเดียว ที่ทำให้ทั้งท้องพระโรงเงียบกริบ"
 eternal_maiden.0300.b: "หัวเราะ แล้วดื่มอวยพรกลับ เปลี่ยนศัตรูให้เป็นสาวก"
 eternal_maiden.0300.c: "ยิ้มรับ แล้วเริ่มทำลายมันตั้งแต่รุ่งเช้า"
 eternal_maiden.0301.t: "คำขอวิวาห์ของเจ้าชาย"
 eternal_maiden.0301.desc: "เจ้าชายแห่งแดนไกลส่งแหวนหนึ่งวง กลอนหนึ่งบท และขบวนล่อบรรทุกของกำนัลมาให้ เขาขอมอบทั้งหัตถ์ ราชอาณาจักร และความภักดีชั่วนิรันดร์แด่ท่าน\n\nกลอนบทนั้นแย่เหลือเกิน แต่ของกำนัลนั้นดียิ่งนัก"
 eternal_maiden.0301.a: "“ข้าได้วิวาห์กับสวรรค์แล้ว” แล้วส่งแหวนคืน"
 eternal_maiden.0301.b: "เก็บของกำนัลไว้ ให้เขารอต่อไป ให้เขาหวังต่อไป"
 eternal_maiden.0301.c: "ส่งคำอวยพรไปให้แทนคำตอบ"
 eternal_maiden.0302.t: "จิตรกรประจำราชสำนัก"
 eternal_maiden.0302.desc: "จิตรกรประจำราชสำนักวาดภาพของท่านเสร็จแล้ว ท่านยืนในอาภรณ์สีขาวบนพื้นทองคำ มีรัศมีทองคำเปลวล้อมศีรษะ ดวงตาเหลือบขึ้นสู่สวรรค์\n\n“เหมือนท่านหรือไม่ขอรับ ท่านหญิงผู้ศักดิ์สิทธิ์” เขาถามอย่างกระวนกระวาย\n\nมันไม่เหมือนเลย มันดีกว่าตัวจริงเสียอีก"
 eternal_maiden.0302.a: "แขวนไว้ในมหาวิหาร เหนือแท่นบูชา"
 eternal_maiden.0302.b: "ขอให้เขาวาดท่านตามที่เป็นจริง สักครั้งเดียว ให้ท่านดูเพียงผู้เดียว"
 eternal_maiden.0302.c: "เผามันเสีย ไม่มีผู้ใดจะได้ครอบครองใบหน้าของท่าน"
 eternal_maiden.0303.t: "ราชทูตผู้ไม่ยอมคุกเข่า"
 eternal_maiden.0303.desc: "ราชทูตจากแผ่นดินอันทระนงยืนตัวตรงเบื้องหน้าบัลลังก์ ขณะที่ทั้งราชสำนักคุกเข่าอยู่รอบกาย\n\n“กษัตริย์ของข้าไม่ก้มหัวให้สตรีที่ห่มผ้าปูที่นอน” เขากล่าวดังพอให้ทุกคนบนระเบียงได้ยิน"
 eternal_maiden.0303.a: "“ถ้าเช่นนั้นเจ้าจะก้มหัวให้สตรีที่สวมมงกุฎ” แล้วสั่งให้กดเขาลงคุกเข่า"
 eternal_maiden.0303.b: "ยิ้มแล้วอวยพรให้กษัตริย์ของเขามีพระพลานามัยแข็งแรง ปล่อยให้ความหยาบคายของเขาก้องอยู่เพียงลำพัง"
 eternal_maiden.0303.c: "ส่งเขากลับบ้านโดยโกนหัว เท้าเปล่า และนั่งบนหลังลา"
 eternal_maiden.0304.t: "คำเตือนของหมอหลวง"
 eternal_maiden.0304.desc_f: "[maiden_speaker.GetTitledFirstName]ตรวจสุราในห้องบรรทมของท่านแล้ว “มีผู้ลอบใส่ลำโพงลงในจอกของท่านเจ้าค่ะ ท่านหญิงผู้ศักดิ์สิทธิ์ ทีละเล็กละน้อยทุกวัน”\n\nนางลังเล “ข้าอดสังเกตไม่ได้เจ้าค่ะ ว่ามันดูจะไม่ทำอันตรายท่านเลย”"
 eternal_maiden.0304.desc_m: "[maiden_speaker.GetTitledFirstName]ตรวจสุราในห้องบรรทมของท่านแล้ว “มีผู้ลอบใส่ลำโพงลงในจอกของท่านขอรับ ท่านหญิงผู้ศักดิ์สิทธิ์ ทีละเล็กละน้อยทุกวัน”\n\nเขาลังเล “ข้าอดสังเกตไม่ได้ขอรับ ว่ามันดูจะไม่ทำอันตรายท่านเลย”"
 eternal_maiden.0304.a: "ตอบแทนความรอบคอบและการปิดปากเงียบ (50 ทอง)"
 eternal_maiden.0304.b: "“เจ้าไม่ได้สังเกตเห็นสิ่งใด” แล้วทำให้แน่ใจว่ามันจะเป็นเช่นนั้นตลอดไป"
 eternal_maiden.0304.c: "“ถ้าเช่นนั้นเจ้ารู้ความลับหนึ่งแล้ว มาแบ่งปันอีกเรื่องกันเถิด”"
 eternal_maiden.0305.t: "งานฉลองแห่งผ้าคลุม"
 eternal_maiden.0305.desc: "วันนี้เป็นวันฉลองของคณะท่าน ท้องพระโรงใหญ่รอคำบัญชา จะเป็นงานเลี้ยงที่ทำให้ทั้งแผ่นดินตะลึง หรือการถือศีลอดที่ทำให้ทั้งแผ่นดินถ่อมตน\n\nแน่นอนว่ายังมีหนทางที่สาม หนทางที่สามมีอยู่เสมอ คู่แข่งผู้หนึ่งของท่านตอบรับคำเชิญมาแล้ว"
 eternal_maiden.0305.a: "ไม่เสียดายสิ่งใด ให้ทั้งแผ่นดินเล่าขานถึงงานนี้ไปอีกชั่วอายุคน (150 ทอง)"
 eternal_maiden.0305.b: "ขนมปัง น้ำเปล่า และคำภาวนา ให้ทั้งแผ่นดินถือศีลอดไปกับท่าน"
 eternal_maiden.0305.c: "ให้จอกใบหนึ่งถูกรินจากเหยือกอีกใบ"
 eternal_maiden.0306.t: "สายลับถูกเปิดโปง"
 eternal_maiden.0306.desc_f: "เหล่าภคินีของท่านจับได้ว่า[maiden_speaker.GetTitledFirstName]กำลังลอกจดหมายของท่านใต้แสงเทียน นางมิได้ปฏิเสธ เพียงถามเบาๆ ว่ามันจะจบลงอย่างรวดเร็วหรือไม่เจ้าคะ"
 eternal_maiden.0306.desc_m: "เหล่าภคินีของท่านจับได้ว่า[maiden_speaker.GetTitledFirstName]กำลังลอกจดหมายของท่านใต้แสงเทียน เขามิได้ปฏิเสธ เพียงถามเบาๆ ว่ามันจะจบลงอย่างรวดเร็วหรือไม่ขอรับ"
 eternal_maiden.0306.a: "“มันจะไม่เกิดขึ้นเลย นับแต่นี้เจ้าทำงานให้ข้า”"
 eternal_maiden.0306.b: "“ใช่ รวดเร็ว และต่อหน้าธารกำนัล”"
 eternal_maiden.0306.c: "ปล่อยให้ลอกต่อไป แล้วเขียนจดหมายของท่านให้ผู้อ่านปลายทางอ่านแทน"
 eternal_maiden.0307.t: "ฎีกาของเหล่าแม่ม่าย"
 eternal_maiden.0307.desc: "แม่ม่ายจากศึกครั้งก่อนสามสิบนางคุกเข่าอยู่ในลานวัง สามีของพวกนางตายใต้ธงที่มือของท่านเป็นผู้อวยพร และพวกนางขอเพียงขนมปังกับหลังคาคุ้มหัว\n\nขุนคลังกราบทูลเบาๆ ว่าแม่ม่ายไม่ต้องเสียภาษี"
 eternal_maiden.0307.a: "มอบเรือนให้พวกนางอยู่ร่วมกันภายใต้ความคุ้มครองของท่าน (100 ทอง)"
 eternal_maiden.0307.b: "อวยพรให้พวกนาง แล้วส่งกลับบ้าน"
 eternal_maiden.0307.c: "ริบที่ดินของสามีพวกนางเข้าเป็นของศาสนจักร"
 eternal_maiden.0308.t: "คำปฏิญาณของอัศวิน"
 eternal_maiden.0308.desc_f: "[maiden_speaker.GetTitledFirstName]คุกเข่าลงเบื้องหน้าท่านในชุดเกราะเต็มยศ แล้ววางดาบลงแทบเท้า “ข้าจะเป็นโล่ของท่านเจ้าค่ะ ท่านหญิงผู้ศักดิ์สิทธิ์ จนกว่าลมหายใจสุดท้าย จะทรงใช้ข้าทำสิ่งใดก็ได้”\n\nสิ่งใดก็ได้ ท่านเคยได้ยินคำนี้มาก่อน และน้อยครั้งนักที่มันจะเป็นความจริง"
 eternal_maiden.0308.desc_m: "[maiden_speaker.GetTitledFirstName]คุกเข่าลงเบื้องหน้าท่านในชุดเกราะเต็มยศ แล้ววางดาบลงแทบเท้า “ข้าจะเป็นโล่ของท่านขอรับ ท่านหญิงผู้ศักดิ์สิทธิ์ จนกว่าลมหายใจสุดท้าย จะทรงใช้ข้าทำสิ่งใดก็ได้”\n\nสิ่งใดก็ได้ ท่านเคยได้ยินคำนี้มาก่อน และน้อยครั้งนักที่มันจะเป็นความจริง"
 eternal_maiden.0308.a: "รับคำปฏิญาณ แล้วเจิมคมดาบด้วยมือของท่านเอง"
 eternal_maiden.0308.b: "“สิ่งใดก็ได้หรือ” ทดสอบมันเสียก่อนจะเชื่อ"
 eternal_maiden.0308.c: "“ดาบของเจ้าเป็นของสวรรค์ มิใช่ของข้า”"
 eternal_maiden.0309.t: "คำถามของคู่ครอง"
 eternal_maiden.0309.desc: "[maiden_spouse.GetTitledFirstName]พบท่านกำลังสวดภาวนาอยู่เมื่อล่วงเลยเที่ยงคืนไปนาน แล้วนั่งลงข้างกาย\n\n“เราร่วมเตียงกันมาหลายปี” คู่ครองของท่านเอ่ย “แต่ข้ายังไม่รู้เลยว่าเบื้องหลังผ้าคลุมนั้นท่านเป็นใคร บอกข้าได้หรือไม่ สักครั้งเดียวก็ยังดี”"
 eternal_maiden.0309.a: "บอกความจริง ทั้งหมด"
 eternal_maiden.0309.b: "บอกคำโกหกอันงดงาม มันเมตตากว่า"
 eternal_maiden.0309.c: "“อย่าได้ถามข้าเช่นนี้อีก”"
