l_english:
 eternal_maiden.0100.t: "ผู้แสวงบุญตาบอด"
 eternal_maiden.0100.desc: "ชายชราผู้หนึ่งถูกหลานชายจูงเข้ามาในสถานศักดิ์สิทธิ์ ดวงตาของเขาขาวขุ่นดั่งน้ำนม และเขาเดินทางมาสี่สิบวันเพื่อพบท่าน\n\n“เขาว่ากันว่าท่านหญิงคือธิดาแห่งสวรรค์ขอรับ” เขากล่าวพลางหันหน้าตามเสียงฝีเท้าของท่าน “ข้ามิได้ขอให้ได้เห็นโลกอีกครั้ง ขอเพียงได้เห็นพักตร์ของท่านสักครั้งเดียวเท่านั้น”\n\nทั้งโบสถ์ต่างจับจ้องไปที่มือของท่าน"
 eternal_maiden.0100.a: "วางมือลงบนดวงตาของเขา แล้วสวดภาวนาด้วยกันจนรุ่งสาง"
 eternal_maiden.0100.b: "ให้หมอหลวงรออยู่หลังม่าน แล้วปล่อยให้ผู้คนได้เห็น “ปาฏิหาริย์”"
 eternal_maiden.0100.c: "“สวรรค์ประทานการมองเห็นแก่ดวงจิตก่อนเสมอ จงไปเป็นสุขเถิด ท่านผู้เฒ่า”"
 eternal_maiden.0101.t: "รูปปั้นหลั่งน้ำตา"
 eternal_maiden.0101.desc: "ในโบสถ์ของหมู่บ้านแห่งหนึ่ง รูปปั้นไม้ของสตรีผู้คลุมผ้าเริ่มหลั่งน้ำตา ชาวบ้านต่างสาบานว่านั่นคือท่าน ฝูงชนพากันมาชุมนุม และนักบวชประจำท้องถิ่นก็เขียนสาส์นวิงวอนให้ท่านเสด็จไปทอดพระเนตร\n\nสายลับของท่านทูลเบาๆ ว่า มีผู้จ้างช่างไม้ให้เจาะร่องเล็กๆ ไว้หลังดวงตาของรูปปั้น ทว่าพวกเขาไม่รู้ว่าผู้ใดเป็นผู้จ้าง"
 eternal_maiden.0101.a: "เสด็จไป แล้วหลั่งน้ำตาไปพร้อมกับมัน ให้พวกเขาได้เห็นปาฏิหาริย์สองประการแทนหนึ่ง"
 eternal_maiden.0101.b: "สืบให้รู้ว่าใครจ้างช่างไม้ ก่อนที่ผู้อื่นจะรู้"
 eternal_maiden.0101.c: "เผารูปปั้นเสีย “ข้าจะไม่ยอมให้ผู้ใดบูชาข้าในรูปท่อนไม้”"
 eternal_maiden.0102.t: "ขนมปังแด่ผู้หิวโหย"
 eternal_maiden.0102.desc: "พืชผลในที่ราบลุ่มล้มเหลว มารดาทั้งหลายยืนถือชามเปล่าอยู่หน้าประตูวิหาร สายตาของพวกนางมองข้ามเหล่านักบวช ไปยังหน้าต่างที่เชื่อกันว่าท่านกำลังสวดภาวนาอยู่\n\nยุ้งฉางยังมีข้าวมากพอจะเลี้ยงพวกนาง และมากพอจะขายได้เช่นกัน"
 eternal_maiden.0102.a: "เปิดยุ้งฉาง แล้วแจกขนมปังด้วยมือของท่านเอง"
 eternal_maiden.0102.b: "นำชาวเมืองสวดภาวนาขอฝน"
 eternal_maiden.0102.c: "ขายข้าวให้ผู้ที่เสนอราคาสูงสุด ความหิวสอนให้ผู้คนศรัทธา"
 eternal_maiden.0103.t: "เด็กน้อยผู้จับไข้"
 eternal_maiden.0103.desc: "เด็กชายวัยหกขวบไข้ขึ้นสูงอยู่ในกระท่อมของช่างฟอกหนัง มารดาของเขาอุ้มเขาฝ่าความมืดมาทั้งคืนเพื่อวางไว้เบื้องหน้าแท่นบูชา\n\n“ได้โปรดเถิดเจ้าค่ะ ท่านหญิงผู้ศักดิ์สิทธิ์” นางกระซิบ “เขาคือทุกสิ่งที่ข้ายังเหลืออยู่”\n\nท่านคุกเข่าลงข้างเด็กน้อย ลมหายใจของเขาสั้นและถี่ มือเล็กๆ กำนิ้วของท่านไว้แน่น"
 eternal_maiden.0103.a: "อยู่เฝ้าเขาตลอดคืน สวดภาวนาจนกว่าไข้จะลด"
 eternal_maiden.0103.b: "เรียกหมอหลวงส่วนตัวมา แล้วปล่อยให้ชาวเมืองเชื่อว่าเป็นเพราะคำภาวนาของท่าน"
 eternal_maiden.0103.c: "อวยพรให้เขา แล้วส่งสองแม่ลูกกลับบ้าน ให้สวรรค์ทรงตัดสิน"
 eternal_maiden.0104.t: "พ่อค้าพระธาตุ"
 eternal_maiden.0104.desc: "ในตลาด มีพ่อค้าผู้หนึ่งขายเศษผ้าขาว แต่ละชิ้นสาบานว่าฉีกมาจากผ้าคลุมของท่าน เขาขายไปแล้วสามร้อยชิ้น ทั้งที่ผ้าคลุมของท่านยังอยู่ครบทุกส่วน\n\nเขาถูกคุมตัวมาเบื้องหน้าท่านในพันธนาการ มือยังกำถุงเงินไว้แน่น"
 eternal_maiden.0104.a: "ตัดมือของมันกลางลานตลาด ให้คำเท็จจบลงตรงที่มันเริ่มต้น"
 eternal_maiden.0104.b: "ปล่อยให้มันขายต่อไป แล้วเก็บไว้ครึ่งหนึ่งของทุกเหรียญ"
 eternal_maiden.0104.c: "อวยพรสินค้าของมันต่อหน้าผู้คน ให้เศษผ้าทุกชิ้นกลายเป็นของจริง"
 eternal_maiden.0105.t: "ทะเลแห่งผู้แสวงบุญ"
 eternal_maiden.0105.desc: "พวกเขามาจากสามราชอาณาจักร ถนนหนทางแน่นขนัด โรงเตี๊ยมเต็มทุกแห่ง และพวกเขาก็ยังหลั่งไหลมาไม่หยุด นอนกลางทุ่งและข้างคูน้ำเพื่อหวังได้เห็นท่านผ่านไปสักครั้ง\n\nจากระเบียง ฝูงชนดูราวทุ่งดอกไม้สีขาว ทุกใบหน้าหันมาทางท่าน"
 eternal_maiden.0105.a: "ตรัสกับพวกเขาจากระเบียงจนกว่าเสียงจะแหบหาย"
 eternal_maiden.0105.b: "ตั้งด่านเก็บค่าผ่านทางบนเส้นทางผู้แสวงบุญ ศรัทธาย่อมมีราคา"
 eternal_maiden.0105.c: "ปิดบานหน้าต่างเสีย แม้นักบุญก็ต้องการลมหายใจ"
 eternal_maiden.0106.t: "คนโรคเรื้อนที่หน้าประตู"
 eternal_maiden.0106.desc: "คนโรคเรื้อนผู้หนึ่งรออยู่ที่ประตูสถานศักดิ์สิทธิ์ ห่อกายด้วยผ้าขี้ริ้วสีเทา ทหารยามลดปลายหอกกั้นระหว่างเขากับบานประตู\n\n“ข้ามิได้ขอให้หายขอรับ” เขาร้องบอก “ขอเพียงให้ใครสักคนที่ไม่หวาดกลัวได้สัมผัสข้าสักครั้ง”\n\nผู้แสวงบุญทุกคนในลานหยุดนิ่ง รอดูว่าท่านจะทำเช่นไร"
 eternal_maiden.0106.a: "เดินผ่านปลายหอกไป แล้วประคองใบหน้าของเขาไว้ด้วยสองมือ"
 eternal_maiden.0106.b: "สัมผัสเขาผ่านถุงมือไหม แล้วให้ฝูงชนเห็นเพียงการสัมผัส"
 eternal_maiden.0106.c: "ขับไล่มันออกจากเมือง นักบุญย่อมไม่แตะต้องสิ่งโสโครก"
 eternal_maiden.0107.t: "นิมิตกลางราตรี"
 eternal_maiden.0107.desc: "ท่านตื่นขึ้นก่อนรุ่งสางพร้อมรสเหล็กบนปลายลิ้น ในความฝันมีนครที่ลุกเป็นไฟ ธงผืนขาว และเสียงหนึ่งที่เหมือนเสียงของท่านเอง\n\nอาจเป็นสวรรค์ หรืออาจเป็นเพียงสุรา ไม่ว่าอย่างไร เหล่านักบวชย่อมอยากรู้ว่าท่านเห็นสิ่งใด"
 eternal_maiden.0107.a: "“ข้าเห็นสงครามศักดิ์สิทธิ์ จงลับดาบให้คม”"
 eternal_maiden.0107.b: "“ข้าเห็นสันติสุข จงตีระฆังให้ดังก้อง”"
 eternal_maiden.0107.c: "ไม่บอกผู้ใด นิมิตมีอานุภาพยิ่งกว่าเมื่อเป็นเพียงข่าวลือ"
 eternal_maiden.0108.t: "ภิกษุผู้กังขา"
 eternal_maiden.0108.desc: "ภิกษุจากอารามบนภูเขาผู้หนึ่งเทศนาอยู่กลางตลาด “สวรรค์มิต้องการสตรีในแพรไหมสีขาวมาพูดแทนพระองค์”\n\nเขาผอมแห้ง เท้าเปล่า และไม่หวาดกลัวสิ่งใดเลย ฝูงชนฟังเขาด้วยท่าทีเดียวกับที่เคยฟังท่าน"
 eternal_maiden.0108.a: "โต้วาทีกับเขาในมหาวิหาร ต่อหน้าทุกผู้คน"
 eternal_maiden.0108.b: "ปล่อยให้มีผู้พบร่างเขาที่ก้นบ่อน้ำ"
 eternal_maiden.0108.c: "ถวายทรัพย์แก่อารามของเขาอย่างงาม ความเงียบราคาถูกกว่าผู้พลีชีพ"
 eternal_maiden.0109.t: "บทเพลงสรรเสริญสตรีศักดิ์สิทธิ์"
 eternal_maiden.0109.desc: "นักประพันธ์หนุ่มผู้หนึ่งแต่งบทเพลงสรรเสริญถวายท่าน บัดนี้มันถูกขับขานในทุกโบสถ์ทั่วแผ่นดิน และเมื่อจบแต่ละท่อน ผู้คนก็หันหน้ามาทางวังของท่านเองโดยไม่ต้องมีใครบอก\n\nเหล่าบิชอปเริ่มกระสับกระส่าย บทเพลงสรรเสริญควรหันหน้าเข้าหาแท่นบูชา"
 eternal_maiden.0109.a: "ปล่อยให้พวกเขาร้องต่อไป แท่นบูชารอได้"
 eternal_maiden.0109.b: "ให้แก้ท่อนสุดท้ายให้สรรเสริญสวรรค์แต่เพียงผู้เดียว"
 eternal_maiden.0109.c: "สั่งห้ามบทเพลง แล้วโบยนักประพันธ์ฐานอวดดี"
 eternal_maiden_miracle_modifier: "ผู้บันดาลปาฏิหาริย์"
 eternal_maiden_miracle_modifier_desc: "ข่าวปาฏิหาริย์แพร่สะพัดเร็วกว่าม้าเร็วใดๆ"
 eternal_maiden_beloved_modifier: "มารดาแห่งผู้หิวโหย"
 eternal_maiden_beloved_modifier_desc: "ไพร่ฟ้าอวยพรแก่มือที่เคยหยิบยื่นอาหารให้"
 eternal_maiden_feared_modifier: "นักบุญผู้น่าสะพรึง"
 eternal_maiden_feared_modifier_desc: "แม้ความเมตตาของนางก็ยังทำให้ผู้คนตัวสั่น"
 eternal_maiden_martyr_cult_modifier: "ลัทธิผู้พลีชีพ"
 eternal_maiden_martyr_cult_modifier_desc: "โลหิตของผู้พลีชีพหล่อเลี้ยงศรัทธาของผู้คนนับพัน"
 eternal_maiden_devoted_opinion: "ภักดีต่อสตรีศักดิ์สิทธิ์"
 eternal_maiden_shamed_opinion: "อับอายต่อหน้าสตรีศักดิ์สิทธิ์"
