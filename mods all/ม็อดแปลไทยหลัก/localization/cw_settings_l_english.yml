 SETTING_SCROLL_SPEED: "ความเร็วการเลื่อน"
 SETTING_SCROLL_SPEED_TOOLTIP: "#T $SETTING_SCROLL_SPEED$#!\nตั้งค่าความเร็วในการเลื่อนแผนที่เมื่อใช้คีย์บอร์ดหรือเมาส์"
