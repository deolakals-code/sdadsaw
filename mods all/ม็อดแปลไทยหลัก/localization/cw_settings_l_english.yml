 SETTING_TEXTURE_STREAMING: "การสตรีมพื้นผิว"
 SETTING_TEXTURE_STREAMING_TOOLTIP: "#T $SETTING_TEXTURE_STREAMING$#!\nพื้นผิวจะถูกโหลดเมื่อจำเป็น\n\nลดการใช้หน่วยความจำ GPU โดยต้องแลกกับภาระเวลา CPU บางส่วน อาจเพิ่มประสิทธิภาพสำหรับ GPU ที่มีหน่วยความจำน้อย"
