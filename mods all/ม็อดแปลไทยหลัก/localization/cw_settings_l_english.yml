 SETTING_GUI_SCALING: "การปรับสเกล GUI"
 SETTING_GUI_SCALING_TOOLTIP: "#T $SETTING_GUI_SCALING$\n#!ตั้งค่าสเกลของอินเทอร์เฟซผู้ใช้ทั้งหมด มีประโยชน์สำหรับความละเอียดหน้าจอที่สูงขึ้น\n\n#X การตั้งค่าให้สูงเกินไปจะทำให้อินเทอร์เฟซไม่พอดีกับหน้าจอ!#!"
