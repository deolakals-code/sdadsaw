l_english: 
 # General 
 SETTING_VALUE_NONE: "$VALUE$"
 SETTING_VALUE_TOTAL_PERCENTAGE: "$VALUE|%/0$"
 SETTING_VALUE_PERCENTAGE: "$VALUE|%0$"
 SETTING_VALUE_SECONDS: "$VALUE$ วินาที"
 SETTING_VALUE_MINUTES: "$VALUE$ นาที"
 # Graphics
 SETTING_RENDERER: "ตัวแสดงผล"
 SETTING_RENDERER_TOOLTIP: "กำหนดตัวแสดงผลที่จะใช้"
 SETTING_VSYNC: "VSync"
 SETTING_VSYNC_TOOLTIP: "#T $SETTING_VSYNC$\n#!ทำให้เกมและจอภาพของท่านมีอัตราเฟรมเท่ากัน ลดการฉีกขาดของภาพ\n\nการปิดอาจช่วยเพิ่มประสิทธิภาพได้"
 SETTING_PORTRAIT_MULTI_SAMPLING: "Portrait MultiSampling"
 SETTING_PORTRAIT_MULTI_SAMPLING_TOOLTIP: "#T $SETTING_PORTRAIT_MULTI_SAMPLING$\n#!ใช้ multi-sample สำหรับ Alpha-To-Coverage เพื่อให้เส้นผมผสมผสานอย่างนุ่มนวลขึ้น\n\nการตั้งค่าที่ต่ำลงจะเพิ่มประสิทธิภาพ"
 SETTING_MULTI_SAMPLING: "การลบรอยหยัก (MSAA)"
 SETTING_MULTI_SAMPLING_TOOLTIP: "#T $SETTING_MULTI_SAMPLING$\n#!การใช้ multi-sample anti-aliasing (MSAA) จะทำให้ขอบของภาพนุ่มนวลขึ้น\n\nการตั้งค่าที่ต่ำลงอาจเพิ่มประสิทธิภาพ"
 SETTING_ANTI_ALIASING: "การลบรอยหยัก"
 SETTING_ANTI_ALIASING_TOOLTIP: "#T $SETTING_ANTI_ALIASING$\n#!การใช้การลบรอยหยักจะทำให้ขอบของภาพนุ่มนวลขึ้น\n\nแนะนำให้ใช้ FXAA"
 OPTION_ANTI_ALIASING_DISABLED: "ปิดใช้งาน"
 OPTION_ANTI_ALIASING_FXAA: "FXAA"
 SETTING_UPSCALE: "วิธีการอัปสเกล"
 OPTION_UPSCALE_FSR2: "AMD FidelityFX Super Resolution 2"
 OPTION_UPSCALE_DLSS: "NVIDIA DLSS"
 OPTION_UPSCALE_XESS: "Intel® XeSS"
 SETTING_UPSCALE_QUALITY: "คุณภาพการอัปสเกล"
 OPTION_UPSCALE_QUALITY_ULTRA_QUALITY: "คุณภาพสูงสุด"
 OPTION_UPSCALE_QUALITY_QUALITY: "คุณภาพ"
 OPTION_UPSCALE_QUALITY_BALANCED: "สมดุล"
 OPTION_UPSCALE_QUALITY_PERFORMANCE: "ประสิทธิภาพ"
 OPTION_UPSCALE_QUALITY_ULTRA_PERFORMANCE: "ประสิทธิภาพสูงสุด"
 SETTING_ANISOTROPIC_FILTERING: "การกรองพื้นผิว"
 SETTING_ANISOTROPIC_FILTERING_TOOLTIP: "#T $SETTING_ANISOTROPIC_FILTERING$\n#!การใช้ anisotropic filtering จะทำให้พื้นผิวดูดีขึ้น\n\nการตั้งค่าที่ต่ำลงอาจเพิ่มประสิทธิภาพ"
 SETTING_FULLSCREEN_RESOLUTION: "ความละเอียด"
 SETTING_FULLSCREEN_RESOLUTION_TOOLTIP: "#T $SETTING_FULLSCREEN_RESOLUTION$\n#!กำหนดคุณภาพของภาพในเกม\n\nความละเอียดที่ต่ำลงอาจเพิ่มประสิทธิภาพ\n\n#X ความละเอียดของเกมที่มีอัตราส่วนภาพไม่รองรับอาจทำให้อินเทอร์เฟซปรากฏนอกจอได้#!"
 SETTING_WINDOWED_RESOLUTION: "ความละเอียดโหมดหน้าต่าง"
 SETTING_WINDOWED_RESOLUTION_TOOLTIP: "#T $SETTING_WINDOWED_RESOLUTION$\n#!กำหนดความละเอียดของหน้าต่างเกมหากเกมอยู่ในโหมดหน้าต่าง\n\nต้องอยู่ในรูปแบบ #b NUMBER#!x#b NUMBER#!.\n\n#X ความละเอียดของเกมที่มีอัตราส่วนภาพไม่รองรับอาจทำให้อินเทอร์เฟซปรากฏนอกจอได้#!"
 SETTING_RENDER_SCALE: "สเกลการเรนเดอร์"
 SETTING_RENDER_SCALE_TOOLTIP: "#T $SETTING_RENDER_SCALE$#!\nสเกลของความละเอียดการเรนเดอร์ของเกมเทียบกับความละเอียดหลัก โดยไม่รวมอินเทอร์เฟซผู้ใช้\n\nการตั้งค่าที่ต่ำลงอาจเพิ่มประสิทธิภาพแต่จะลดความคมชัดโดยรวม ในขณะที่การตั้งค่าเกิน 100% อาจเพิ่มความคมชัดแต่มีแนวโน้มที่จะลดประสิทธิภาพ"
 SETTING_RENDER_SCALE_FORMAT: "$VALUE|%0$"
 SETTING_DISPLAY: "จอภาพ"
 SETTING_DISPLAY_TOOLTIP: "#T $SETTING_DISPLAY$\n#!หากคอมพิวเตอร์ของท่านมีหลายจอภาพ ให้เลือกจอที่จะใช้สำหรับเกม"
 SETTING_GRAPHICS_DEVICE: "การ์ดแสดงผล"
 SETTING_GRAPHICS_DEVICE_TOOLTIP: "#T $SETTING_GRAPHICS_DEVICE$\n#!เลือกการ์ดแสดงผลที่เกมจะใช้ \n\nการใช้การ์ดแสดงผลออนบอร์ดหรือตัวเรนเดอร์ซอฟต์แวร์อาจลดประสิทธิภาพ"
 SETTING_SHADOW_MAP_RESOLUTION: "คุณภาพเงา"
 SETTING_SHADOW_MAP_RESOLUTION_TOOLTIP: "#T $SETTING_SHADOW_MAP_RESOLUTION$\n#!กำหนดความละเอียดของแผนที่เงาที่เรนเดอร์ หากเปิดใช้งานเงา\n\nการตั้งค่าที่ต่ำลงอาจเพิ่มประสิทธิภาพ"
 SETTING_DISPLAY_MODE: "โหมดการแสดงผล"
 SETTING_DISPLAY_MODE_TOOLTIP: "#T $SETTING_DISPLAY_MODE$\n#!กำหนดวิธีการแสดงผลเกมบนหน้าจอของท่าน"
 SETTING_BLOOM: "แสงฟุ้ง"
 SETTING_MESH_LOD_BIAS: "คุณภาพ LOD ของเมช"
 SETTING_MESH_LOD_FADE: "การเฟด LOD ของเมช"
 SETTING_TERRAIN_SMOOTHING: "ความเรียบของภูมิประเทศ"
 OPTION_FULLSCREEN: "เต็มจอ"
 OPTION_FULLSCREEN_TOOLTIP: "#T $OPTION_FULLSCREEN$\n#!แสดงเกมโดยใช้ทั้งหน้าจอ การตั้งค่าความละเอียดจะเปลี่ยนความคมชัดของภาพ"
 OPTION_WINDOWED: "หน้าต่าง"
 OPTION_WINDOWED_TOOLTIP: "#T $OPTION_WINDOWED$\n#!แสดงเกมในหน้าต่าง การตั้งค่าความละเอียดจะเปลี่ยนขนาดของหน้าต่าง"
 OPTION_DISABLED: "ปิดใช้งาน"
 OPTION_OFF: "ปิด"
 OPTION_LOW: "ต่ำ"
 OPTION_MEDIUM: "ปานกลาง"
 OPTION_HIGH: "สูง"
 OPTION_VERY_HIGH: "สูงมาก"
 OPTION_ULTRA: "สูงสุด"
 OPTION_CUSTOM: "กำหนดเอง"
 OPTION_DEFAULT: "ค่าเริ่มต้น"
 SETTINGS_CATEGORY_UI: "อินเทอร์เฟซ"
 SETTINGS_CATEGORY_GAME: "เกม"
 SETTING_TEXTURE_QUALITY: "คุณภาพพื้นผิว"
 SETTING_TEXTURE_QUALITY_TOOLTIP: "#T $SETTING_TEXTURE_QUALITY$#!\nควบคุมความละเอียดของพื้นผิวที่โหลด\n\nการตั้งค่าที่ต่ำลงอาจเพิ่มประสิทธิภาพ"
 SETTING_QUALITY: "ค่าที่ตั้งไว้ล่วงหน้า (คุณภาพ)"
 SETTING_SFX: "SFX"
 SETTING_UI: "อินเทอร์เฟซ"
 SETTING_QUALITY_TOOLTIP: "#T $SETTING_QUALITY$\n#!เลือกค่าที่ตั้งไว้ล่วงหน้าของตัวเลือกกราฟิกขั้นสูงด้านล่าง\n\nค่าที่ตั้งไว้ล่วงหน้าที่ต่ำจะเพิ่มประสิทธิภาพ"
 SETTING_BLOOM_TOOLTIP: "#T $SETTING_BLOOM$\n#!เปิดใช้งานเอฟเฟกต์ "แสงฟุ้ง" ที่ซึ่งแสงที่สว่างมากจะส่องไปยังส่วนอื่นของภาพ\n\nการปิดอาจช่วยเพิ่มประสิทธิภาพได้"
 SETTING_DOF_TOOLTIP: "#T $SETTING_DOF$\n#!เปิดใช้งาน depth of field เพื่อจำลองเลนส์กล้อง ทำให้จุดที่อยู่นอกโฟกัสของภาพเบลอ\n\nการปิดอาจช่วยเพิ่มประสิทธิภาพได้"
 SETTING_LENS_FLARE_TOOLTIP: "#T $SETTING_LENS_FLARE$\n#!เปิดใช้งานเอฟเฟกต์แสงแฟลร์ซึ่งปรากฏในบริเวณที่มีแสงฟุ้งมาก ต้องเปิดใช้งานแสงฟุ้งเพื่อให้เอฟเฟกต์ปรากฏ \n\nการปิดอาจช่วยเพิ่มประสิทธิภาพได้"
 SETTING_SECONDARY_LENS_FLARE_TOOLTIP: "#T $SETTING_SECONDARY_LENS_FLARE$\n#!เปิดใช้งานเอฟเฟกต์แสงแฟลร์รองซึ่งปรากฏในบริเวณที่มีแสงฟุ้งมาก ต้องเปิดใช้งานแสงฟุ้งเพื่อให้เอฟเฟกต์ปรากฏ \n\nการปิดอาจช่วยเพิ่มประสิทธิภาพได้"
 SETTING_MAP_SSAO_TOOLTIP: "#T $SETTING_MAP_SSAO$\n#!กำหนดว่าควรใช้ screen space ambient occlusion กับแผนที่หรือไม่\n\nการปิดอาจช่วยเพิ่มประสิทธิภาพได้"
 SETTING_REFRACTION_TOOLTIP: "กำหนดว่าการหักเหของแสงจะปรากฏบนผิวน้ำหรือไม่"
 SETTING_REFRACTION_QUALITY_TOOLTIP: "#T $SETTING_REFRACTION_QUALITY$#!\nควบคุมคุณภาพของการหักเหของแสงบนผิวน้ำหากเปิดใช้งาน\n\nการตั้งค่าที่ต่ำลงอาจเพิ่มประสิทธิภาพ"
 SETTING_MAPOBJECT_QUALITY_TOOLTIP: "#T $SETTING_MAPOBJECT_QUALITY$#!\nกำหนดระดับคุณภาพสูงสุดของวัตถุบนแผนที่ (เช่น อาคาร)\n\nการตั้งค่าที่ต่ำลงอาจเพิ่มประสิทธิภาพ"
 SETTING_MESH_LOD_BIAS_TOOLTIP: "#T $SETTING_MESH_LOD_BIAS$#!\nกำหนดคุณภาพของ LODs (ระดับรายละเอียด) บนวัตถุแผนที่ เช่น โมเดลยูนิต\n\nการตั้งค่าที่ต่ำลงอาจเพิ่มประสิทธิภาพ"
 SETTING_MESH_LOD_FADE_TOOLTIP: "#T $SETTING_MESH_LOD_FADE$\n#!หากเปิดใช้งาน โมเดล 3 มิติจะเปลี่ยนระหว่างระดับรายละเอียด (LOD) ต่างๆ อย่างราบรื่นเมื่อท่านซูมเข้าหรือออก\n\nการปิดอาจช่วยเพิ่มประสิทธิภาพได้"
 SETTING_PROVINCE_NAMES_TOOLTIP: "กำหนดวิธีที่ชื่อเมืองและจังหวัดปรากฏบนแผนที่"
 SETTING_FILL_IN_IMPASSABLE_TERRAIN_TOOLTIP: "กำหนดว่าภูมิประเทศที่ผ่านไม่ได้จะรวมอยู่ในพรมแดนของชาติบนแผนที่หรือไม่"
 SETTING_LANGUAGE_TOOLTIP: "#T $SETTING_LANGUAGE$#!\nกำหนดภาษาของอินเทอร์เฟซผู้ใช้"
 SETTING_ACCOUNT_EMAIL_TOOLTIP: "อีเมลบัญชี Paradox ของท่าน"
 SETTING_FRAMERATE_CAP: "FPS สูงสุด"
 SETTING_FRAMERATE_CAP_TOOLTIP: "#T $SETTING_FRAMERATE_CAP$#!\nFPS (เฟรมต่อวินาที) สูงสุดที่เกมจะเรนเดอร์\n\nการตั้งค่าที่ต่ำลงอาจลดการใช้พลังงาน"
 OPTION_CAP_MONITOR: "อัตรารีเฟรชจอภาพ"
 OPTION_CAP_UNCAPPED: "อัตรารีเฟรชไม่จำกัด"
