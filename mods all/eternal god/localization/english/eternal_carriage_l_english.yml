l_english:
 eternal_send_carriage_interaction: "ส่งรถม้าไปรับ"
 eternal_send_carriage_interaction_desc: "ส่งรถม้าที่ลากด้วยม้าเร็วระดับม้าสื่อสารของมองโกลไปหาเป้าหมาย เมื่อไปถึงจะมีทางเลือกให้ทำหลายอย่าง เช่น จัดงานเลี้ยง เจรจา หรือรับตัวกลับเข้าราชสำนัก จากนั้นเดินทางกลับด้วยความเร็วเท่าเดิม"
 eternal_carriage_speed_modifier: "ม้าเร็วแห่งราชโองการ"
 eternal_carriage_speed_modifier_desc: "มีม้าสำรองประจำทุกสถานี วิ่งทั้งวันทั้งคืนไม่หยุดพัก"
 eternal_carriage.0001.t: "ตรวจราชการในดินแดนของเรา"
 eternal_carriage.0001.desc: "รถม้าหยุดลงที่ [carriage_guest.GetTitledFirstName] ผู้คนในเมืองเรียงแถวต้อนรับริมทาง ทุกคนรู้ดีว่านี่คือแผ่นดินของท่าน และไม่มีใครกล้าเงยหน้าสบตา\n\nท่านจะใช้เวลาที่นี่อย่างไร"
 eternal_carriage.0001.a: "ออกว่าราชการและรับฟังเรื่องร้องทุกข์ของราษฎร"
 eternal_carriage.0001.b: "จัดงานเลี้ยงใหญ่ให้ขุนนางท้องถิ่น (100 ทอง)"
 eternal_carriage.0001.c: "ตรวจท้องพระคลังและเก็บภาษีที่ค้างอยู่"
 eternal_carriage.0001.d: "ไปสักการะที่ศาสนสถานประจำเมือง"
 eternal_carriage.0001.e: "รับตัวขึ้นรถม้ากลับเข้าราชสำนัก"
 eternal_carriage.0001.f: "ไม่ต้องรอช้า ออกเดินทางกลับทันที"
 eternal_carriage.0002.t: "เยือนต่างอาณาจักร"
 eternal_carriage.0002.desc: "รถม้าข้ามเขตแดนมาถึงดินแดนของ [carriage_guest.GetTitledFirstName] ทหารยามชักอาวุธครึ่งหนึ่งแล้วลืมว่าต้องทำอะไรต่อ ผู้ที่ได้ยินว่าใครมาถึงต่างพากันเงียบ\n\nท่านอยู่ในต่างแดน ทุกอย่างที่ท่านทำจะถูกจดจำ"
 eternal_carriage.0002.a: "จัดงานเลี้ยงใหญ่ในราชสำนักของเจ้าภาพ (150 ทอง)"
 eternal_carriage.0002.b: "เจรจาอย่างเป็นทางการแบบรัฐต่อรัฐ"
 eternal_carriage.0002.c: "แสดงแสนยานุภาพให้ทุกคนเห็น"
 eternal_carriage.0002.d: "มอบเครื่องบรรณาการแก่ผู้ครองถิ่น (100 ทอง)"
 eternal_carriage.0002.e: "รับตัวขึ้นรถม้ากลับเข้าราชสำนัก"
 eternal_carriage.0002.f: "ลาจากอย่างเงียบ ๆ แล้วเดินทางกลับ"
