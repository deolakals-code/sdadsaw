l_english:
 eternal_maiden_result_ok: "So it was."
 eternal_maiden_echo_ok: "The years remember."
 eternal_maiden.1100.t: "Dawn Over the Altar"
 eternal_maiden.1100.desc: "You lay your palms over his clouded eyes and begin the old prayer, and the sanctuary falls silent around the two of you. The words are not hard. It is the waiting that is: hour after hour, the candles guttering, the grandson asleep against a pillar, the old man's lips moving with yours long after his voice has gone.\n\nAt first light a shaft of gold crosses the nave and lands on his face. He does not see you. He does not need to. He weeps, and says that he has felt warmth where there was only night for twenty years, and the pilgrims who stayed to watch begin, one by one, to kneel.\n\nWhether it was heaven or the sunrise, no one in that chapel will ever be persuaded it was not a miracle."
 eternal_maiden.2100.t: "The Physician Behind the Curtain"
 eternal_maiden.2100.desc: "The physician is old and expensive and asks no questions. Behind the veil of white linen he works quickly: a drop of oil, a warm cloth, a trick of the light on a cataract that was always more stubborn than blind.\n\nWhen you draw the curtain the old man is blinking at the candles, and he cries out. The chapel erupts. Women press their children toward you; men who have not prayed in years are on their knees before the miracle you did not perform.\n\nYou smile and say nothing at all. The physician slips out through the vestry. He is wise enough not to look back, and you are wise enough to wonder, later that night, who else might have seen him leave."
 eternal_maiden.3100.t: "Sight for the Soul"
 eternal_maiden.3100.desc: "\"Heaven opens the inner eye first,\" you tell him gently, and lay your hand on his bowed head. \"The rest is a matter of patience, father. Go in peace. You have walked forty days to see a face; I think you have already seen what you came for.\"\n\nThere is a long silence. Then the old man laughs, a thin, astonished laugh, and says that no priest in forty years has told him he lacked nothing. The pilgrims watch him go with their heads bowed. Some of them are crying.\n\nIt was not a miracle. It was something quieter, and perhaps better, and you feel the weight of the long day lift from your shoulders as the door closes behind him."
 eternal_maiden.5100.t: "The Old Man Returns"
 eternal_maiden.5100.desc_a: "Months later, a stranger on the pilgrim road stops you with a trembling hand. It is the old man, thinner, stooped, and still sightless. But he has told the story in every village between his home and yours, and every village has sent someone back with him to hear it again.\n\n\"I see nothing,\" he says, smiling, \"and I have never been so sure of what I saw.\""
 eternal_maiden.5100.desc_b: "The old man's grandson comes to the palace alone, hat in hand. The old man has died. Before the end he confessed to a priest that the physician's hands had given him back the light, and that he had never in his life felt so ashamed of being so happy.\n\nThe priest kept the secret. The boy has not. He does not ask for anything. He only wants you to know that someone is carrying it."
 eternal_maiden.5100.desc_c: "A letter arrives in a scrawl that must have been dictated: the old man has died in his sleep, calm as a child, the village gathered around his bed. At the end he asked them to bury him facing the east, because that was where the Maiden had told him he had already seen what he came for.\n\nA small chapel has been built where he is buried. It has no relics. It only has a door that faces the sunrise."
 eternal_maiden.1101.t: "Two Miracles at Once"
 eternal_maiden.1101.desc: "You arrive at the village chapel at dusk and kneel before the wooden statue, and then you do the one thing no one expected: you begin to weep with it. Not a quiet tear, but great, unguarded tears that run down your face and fall onto the stone step.\n\nThe villagers stop talking. The priest crosses himself. By the time you rise there is no one left in the chapel who believes the statue was ever the only wonder in the room."
 eternal_maiden.1101.desc_hi: "Rumors, though, have a way of reaching the wrong ears. A traveling clerk in the gallery watched you weep with a very calm face, and by morning he has asked three people the same question about the carpenter."
 eternal_maiden.1101.desc_lo: "The legend will outlast the statue by a hundred years."
 eternal_maiden.2101.t: "Whoever Paid the Carpenter"
 eternal_maiden.2101.desc: "It takes your agents three days. The carpenter, it turns out, is a drunk with debts and a daughter, and the stranger who paid him was a petty cleric from a rival see who thought a false miracle would shame you when it was exposed.\n\nYou do not expose it. You buy the carpenter's debts, send his daughter to a convent school, and let the cleric find, a week later, that his own cathedral has begun to weep as well."
 eternal_maiden.2101.desc_hi: "The cleric will be very quiet for a long time. The clerk in the gallery, unfortunately, will not."
 eternal_maiden.2101.desc_lo: "The matter dies as quietly as a candle snuffed in a closed room."
 eternal_maiden.3101.t: "No Worship in Wood"
 eternal_maiden.3101.desc: "You walk into the chapel with a torch in your own hand, and for a moment the villagers think you are going to light the statue. You do. The flames climb quickly in the dry old wood, and the painted face seems to soften and run before it blackens.\n\n\"I will not be worshipped in a carved thing,\" you tell the stunned crowd. \"If you wish to pray to me, pray to my face. I am standing here.\"\n\nIt is the most frightening sermon you have ever given. Not one person in that chapel will forget it."
 eternal_maiden.1102.t: "The Open Granaries"
 eternal_maiden.1102.desc: "You order the granary doors thrown open at dawn, and the treasurer faints, quietly, into an attendant's arms. By noon the mothers of the lowland towns are at the gate, and by evening you are standing in a long line of women, handing out loaves with your own hands.\n\nA child asks if you are an angel. You say you are only the one who has the keys. She considers this, nods gravely, and eats.\n\nThe hunger passes. What lasts is the way those women say your name when they think no one is listening."
 eternal_maiden.2102.t: "A Prayer for Rain"
 eternal_maiden.2102.desc: "You lead the whole city out onto the dry fields in white, barefoot, and the prayer you speak is long and beautiful and does not mention grain at all.\n\nIt rains on the third day, as it was always going to. The farmers say it was you. The astronomers in the cathedral say, privately, that the sky had been gathering for a week.\n\nThe astronomers are very quiet. The farmers are not."
 eternal_maiden.3102.t: "The Price of Devotion"
 eternal_maiden.3102.desc: "The grain goes to a wealthy merchant from the coast, who pays you a fortune in silver and does not ask where the hungry will go. By the second week, you discover, they go to the temple, which is exactly where you want them.\n\nYou sit on the highest step, handing out the thin broth that the temple can afford, and watch faces you have never seen look up at you as if you were the sun. It is the closest you have ever come to understanding what a god feels.\n\nYou are not certain you like it."
 eternal_maiden.1103.t: "Through the Fever"
 eternal_maiden.1103.desc: "You do not leave the child. You wipe his forehead until the cloth is warm, change it, wipe it again. You sing to him in the old language you learned at a convent you barely remember. The mother sleeps at last against the wall, and you are alone in the candlelight with a boy whose breathing is slow and shallow and very small.\n\nAt the third hour of the morning the fever breaks all at once, like a wave drawing back. He opens his eyes and asks, quite clearly, for water.\n\nYou give it to him. Your hands are shaking. You are surprised to find that you have been praying for real."
 eternal_maiden.2103.t: "The Quiet Physician"
 eternal_maiden.2103.desc: "You send for your own physician, who arrives within the hour with a case of bitter powders and an apology for his hurry. The mother is told only that the Maiden has sent her blessing. The boy is told only that he will feel better.\n\nBy dawn the fever has gone. By noon the whole street has decided it was the holy lady's prayer that did it, and you do not trouble to correct them.\n\nYou are not sure if it counts as a lie when it is also, in its way, true."
 eternal_maiden.3103.t: "Heaven Will Decide"
 eternal_maiden.3103.desc: "You bless the boy and press a small silver medallion into his mother's hand, and send them home with a promise to pray for them. It is not the answer she hoped for, and she knows it. She thanks you anyway, with a face that is trying very hard not to break.\n\nYou spend the night alone at the altar. Heaven, as it often does, says nothing."
 eternal_maiden.5103.t: "The Child Grows Up"
 eternal_maiden.5103.desc_a: "A tall boy of twelve is waiting in the gallery with a bunch of wildflowers and his mother's permission to speak. He says that he was very ill once, and that the lady who sat beside him through the night told him a song he has never forgotten.\n\nHe sings it, a little off-key. You discover that you remember every word."
 eternal_maiden.5103.desc_b: "The boy's mother comes to the palace with a loaf of bread she baked herself. Her son is well and strong, she says, apprenticed to a mason. She has never known which of you it was, the physician or the prayer, and she has decided it does not matter.\n\nShe does not stay to be thanked."
 eternal_maiden.5103.desc_c: "A letter arrives from the tanner's quarter, in a hand that is clearly not the mother's. The boy recovered, slowly, and he is well. He wanted you to know that he does not blame heaven for taking its time.\n\nYou keep the letter folded in your sleeve for a long while."
 eternal_maiden.1104.t: "The Merchant's Hands"
 eternal_maiden.1104.desc: "You have him brought to the market square on a cart, in chains, and the whole town gathers to see what the holy lady does to a man who sold her veil three hundred times. The executioner is gentle; the knife is fast; and the merchant, who has been very brave until now, begins to scream.\n\nThe cloth scraps are burned in a heap before his eyes. The crowd watches the smoke rise, and not one of them speaks. For the rest of the season, the market sells nothing that claims to come from you.\n\nIt works. It also leaves a taste in the air that does not wash out."
 eternal_maiden.2104.t: "Half of Every Coin"
 eternal_maiden.2104.desc: "You do not have him whipped. You summon him to a private room, set a slate on the table, and propose a partnership. He is a man who will gladly sell a lie to anyone; it costs nothing to make him sell yours. Within a month the scraps are blessed, numbered and sold at fixed prices from the cathedral steps.\n\nHalf of every coin comes to you. The merchant has never been richer, or more afraid of what would happen to him if he stopped.\n\nIt is, you admit, a very good arrangement."
 eternal_maiden.3104.t: "Every Scrap Made True"
 eternal_maiden.3104.desc: "You stand on the cathedral steps in the sight of the whole town and take the first scrap from the merchant's basket. You kiss it. You hold it up to heaven. You say, in a ringing voice, that every piece of that cloth carries a fragment of your prayer.\n\nIt is a lie that you tell with absolute conviction, and so it ceases to be one. The merchant, weeping, falls to his knees. The crowd follows him.\n\nWhen the scraps are all blessed they are worth a hundred times what they cost. A lie, you reflect, is only a prayer that has not been answered yet."
 eternal_maiden.1105.t: "The Balcony Voice"
 eternal_maiden.1105.desc: "You speak to them until your voice fails, and then you keep speaking in a whisper, and they lean forward as one body to hear it. You tell them about patience. You tell them about the long road and the closed door and the light that is always one more turn away.\n\nNobody in that crowd will forget how it felt to be seen by you, even from a distance. When you finally fall silent, a woman in the front row begins to hum, softly, and the sound spreads through the multitude until the whole square is singing."
 eternal_maiden.1105.desc_hi: "Somewhere at the edge of the throng, a man in a plain cloak writes in a small book. He does not sing."
 eternal_maiden.1105.desc_lo: "You sleep for eleven hours afterwards, and wake smiling."
 eternal_maiden.2105.t: "A Toll on the Road of Faith"
 eternal_maiden.2105.desc: "It is a small toll, a coin at each crossroads, and it is administered by sisters in white who give a blessing with every receipt. No pilgrim complains. Many say it is an honor.\n\nBy the end of the season the roads are better paved, the inns are cleaner, and the treasury is heavier by more than you would have guessed. The pilgrims have paid for their own pilgrimage and thanked you for the privilege.\n\nYou do not feel guilty. You do wonder, on occasion, what a saint would have done."
 eternal_maiden.3105.t: "The Shutters Close"
 eternal_maiden.3105.desc: "You close the shutters and sit in the dark with a cup of cold water and a long silence. You are tired in a way that sleep does not touch. The crowd below is still murmuring, patient as the sea, and for the first time in a very long time you let it murmur without answering.\n\nWhen the evening bells ring, a lone voice in the courtyard begins a hymn. You do not join in. But you listen, and the listening is a kind of prayer, and for the first hour in many days you feel like a person instead of a symbol."
 eternal_maiden.1106.t: "The Face in Your Hands"
 eternal_maiden.1106.desc: "The guards are too astonished to stop you. You walk past the lowered spears, kneel in the dust, and take the leper's face in both your hands, as you would take a child's. His skin is dry and rough and smells of old smoke. You hold it until his shaking stops.\n\nNobody in the courtyard speaks. A priest drops his censer. A woman starts to cry, and then another.\n\n\"Thank you,\" the man says. It is not for healing. It is only for being touched, and it is the most honest thing anyone has said to you in ten years."
 eternal_maiden.2106.t: "Through a Silk Glove"
 eternal_maiden.2106.desc: "You draw a white silk glove from your sleeve with an unhurried hand, and let the whole courtyard watch you put it on. Then you touch the leper's forehead, lightly, once.\n\nIt is a gesture that costs you nothing and means everything. The crowd sees a saint who is not afraid. The leper, who understands very well what has just happened, thanks you with a bow that does not entirely hide a smile.\n\nYou have given him dignity. You have also taught every pilgrim in the square what a gesture can be worth."
 eternal_maiden.3106.t: "Saints Do Not Touch Filth"
 eternal_maiden.3106.desc: "\"Take him beyond the walls,\" you say, and the guards, who have been waiting for exactly this, close ranks. The leper does not protest. He only looks at you with an expression you will remember for a long time, and lets himself be led away.\n\nThe crowd watches, shaken. Some think you are cruel. Most think you are holy, and that holiness is a hard thing, and that it keeps its distance from the unclean. They bow a little lower than before.\n\nYou are not certain you have ever won anything so cheaply, or lost so much."
 eternal_maiden.5106.t: "What the Leper Left"
 eternal_maiden.5106.desc_a: "A pilgrim comes to the gate with a small, plain bowl wrapped in cloth. He says it belonged to a leper who died on the road to the coast, and that the dead man asked that it be given to the lady who touched his face. It is a poor thing, chipped and stained.\n\nYou keep it on the altar, and no one ever touches it but you."
 eternal_maiden.5106.desc_b: "A letter from a distant town says that the man you touched through the silk glove has opened a hospice of his own, in your name, with money no one can account for. He signs the letter only with a small, careful bow.\n\nYou find that you are smiling, a little uneasily, at an old debt repaid."
 eternal_maiden.5106.desc_c: "Word comes from the road that the leper you had driven from the city has been seen in three different towns, always at the back of the crowd, and always looking in your direction. He has begun to speak. What he says, those who have heard him tell you, is very quiet and very terrible.\n\nHe says that there are things holier than being feared."
 eternal_maiden.1107.t: "Sharpen the Swords"
 eternal_maiden.1107.desc: "\"I saw a burning city,\" you tell the assembled priests, \"and a white banner, and heaven's own voice telling me that the time for patience is over.\"\n\nThe silence is complete. Then a young knight steps forward and lays his sword at your feet, and one by one the others follow. By evening the forges are lit, and by morning the great hall is full of men who want to be the first to die for a dream you had last night."
 eternal_maiden.1107.desc_hi: "You wonder, briefly, if you meant it. Then you remember that wonder is a luxury for people who are not already holding an army."
 eternal_maiden.1107.desc_lo: "You have never felt so certain, or so little in control."
 eternal_maiden.2107.t: "The Bells of Peace"
 eternal_maiden.2107.desc: "\"I saw peace,\" you say, and the whole room exhales. \"A field of wheat, a child laughing, and bells that rang for no reason at all.\"\n\nThe priests are moved. The monks begin to weep. Before noon the bell-ringers have been summoned, and for the first time in a generation every church in the city rings at once, a great loose joyful clamor that goes on for an hour. People stop in the street to listen, and some of them, you notice, do not know why they are crying.\n\nYou stand at the window and let it wash over you. It is, perhaps, the only true thing you have said in a month."
 eternal_maiden.3107.t: "A Vision Kept Close"
 eternal_maiden.3107.desc: "You tell no one. You let the rumor do its slow work: a servant who saw you at prayer before dawn, a nun who heard you whisper in a language no one knew, a priest who noticed that your eyes were wet.\n\nWithin a week there are seven versions of your vision circulating in the city, and each is more impressive than the last. You have not contradicted any of them. The most useful prophecies, you have learned, are the ones that grow in other people's mouths."
 eternal_maiden.1108.t: "The Debate in the Cathedral"
 eternal_maiden.1108.desc: "The cathedral is full, hushed and hot with breath. The monk speaks first, quietly, and for ten minutes he is very good. Then it is your turn, and you do not argue. You ask him questions: simple, painful ones, about what he has given up, and what he is afraid of, and whom he has forgiven.\n\nBy the end he is not looking at the crowd anymore. He is looking at you. He says, in a low voice that carries to the last pew, that he came to unmask a fraud and found a woman who was listening.\n\nThe crowd gives him a standing ovation. He stays on his knees, and you take his hand."
 eternal_maiden.2108.t: "The Bottom of the Well"
 eternal_maiden.2108.desc: "You do not give an order. You merely sigh, aloud, in the hearing of the right person, about how tiresome it is to be doubted. Two nights later the monk is found at the bottom of a village well, with no marks on him but a faint, odd smile.\n\nThe town mourns for a day. Then it remembers that it has a holy lady who cares for it, and the mourning ends.\n\nYou do not ask who did it. You prefer, on the whole, not to know."
 eternal_maiden.3108.t: "A Gift to the Abbey"
 eternal_maiden.3108.desc: "A generous endowment arrives at the mountain abbey with your seal on it: new roof beams, two hundred sheep, a carved altar. The monk's tone changes within the month. He begins to preach about humility, and about forgiving the rich, and about how heaven has many mouths.\n\nYou have not asked him to praise you. You have only made it easier for him to stop objecting. It is the kindest silence you have ever bought."
 eternal_maiden.5108.t: "The Monk's Last Sermon"
 eternal_maiden.5108.desc_a: "The monk's body is brought down from the mountain in the winter, and he is buried in the cathedral he once confronted. At the funeral, a priest reads aloud from his final letter, which was addressed to you and is, in an odd way, a love letter to every honest argument.\n\nIt ends: \"I was wrong about her, and right about everything else.\""
 eternal_maiden.5108.desc_b: "The well is dredged in spring, and no one can find the body. The villagers say the monk walked out of it on the third night and went up the mountain. They say he now preaches to the trees.\n\nYou have never been more uncomfortable with a rumor, and you have never been so glad of one."
 eternal_maiden.5108.desc_c: "The abbey sends a wagon of cheese and wine in your honor each autumn, with a card that is always the same: the monk's hand, a single sentence. \"I am still not sure.\"\n\nYou read it every year, and each year you smile a little more."
 eternal_maiden.1109.t: "Let Them Sing"
 eternal_maiden.1109.desc: "You let the hymn spread, and spread, and spread. By midsummer there is a children's version, a drinking version, and a version for the lute that the court musicians weep over. Every chorus, as a matter of course, ends with a turn toward your palace window.\n\nThe bishops look nervous. The people look happy. For a season, you let yourself believe that these two things are not in conflict."
 eternal_maiden.2109.t: "The Final Verse Rewritten"
 eternal_maiden.2109.desc: "You summon the composer to your private chapel and ask him, kindly, whether the last verse might face the altar. He weeps. He says he had not realized. He writes the new verse that same night, and it is the most beautiful thing he has ever made: a prayer to heaven with, here and there, a gentle shadow of a veil in the margins.\n\nThe bishops are placated. The people are not even sure what changed. You have taken a hymn that might have toppled the church and turned it into one of its pillars."
 eternal_maiden.3109.t: "The Composer's Price"
 eternal_maiden.3109.desc: "The composer is whipped in the cathedral square for presumption, ten lashes, administered more gently than the crowd expected. The hymn is banned in every church in the realm by sundown.\n\nThat night it is sung in every tavern, in whispers, with a new and defiant sweetness. You have made it famous in a single afternoon. You have also made a martyr of a man who only wanted to say thank you.\n\nIt is, you reflect, a very efficient way to be hated, and a very slow way to be forgotten."
