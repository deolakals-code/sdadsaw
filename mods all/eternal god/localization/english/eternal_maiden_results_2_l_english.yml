l_english:
 eternal_maiden.1200.t: "A Daughter's Reply"
 eternal_maiden.1200.desc: "You write the reply yourself, in the plainest hand you own, and you do not sign it with any title. You thank [maiden_target.GetTitledFirstName] for the guidance, ask for their blessing on the pilgrim roads, and say that you hold your own gifts as a borrowed lamp, to be returned when asked.\n\nThe answer comes in eleven days, and it is warm. Warm in the way a wall is warm when the sun has been on it all afternoon. Nothing in it can be quoted against you, and nothing in it is a promise.\n\nThe pilgrims, hearing of your letter from a clerk who cannot keep a secret, add another verse to the hymn."
 eternal_maiden.2200.t: "Heaven Has Many Voices"
 eternal_maiden.2200.desc: "\"Heaven,\" you write, \"has never been short of mouths. It has been short of ears.\" You send the letter by a rider who is not told what is in it, and who is paid enough not to ask.\n\nThe silence that follows lasts a month, and is the loudest thing in the capital. Bishops walk a little more carefully. A cardinal you have never met sends you a gift of figs. In the markets the story grows that the Maiden has answered the head of the faith as one sovereign answers another.\n\nThat is both a compliment and a very sharp knife, and you know which edge is pointed at whom."
 eternal_maiden.3200.t: "The Line That Said Everything"
 eternal_maiden.3200.desc: "The letter is a single line. It names a night, a garden, and a thing that was said there that neither of you has ever repeated. It does not threaten. It simply stands in the page like a stone in a stream.\n\nThe reply is not a reply at all. A courier arrives instead with a sealed box of the finest incense, and a note in a hand that trembles a little: \"I remember the garden well.\"\n\nYou have not made a friend. You have made something much more useful, and much more patient."
 eternal_maiden.5200.t: "The Head of Faith Speaks of You"
 eternal_maiden.5200.desc_a: "Word comes back from the pilgrim road, unprompted: the head of the faith has praised your letter in open council. \"She writes,\" he said, \"as a woman who does not need to be afraid.\" There is more of it, and every line is kind.\n\nIt is the sort of praise that cannot be bought and cannot be taken back."
 eternal_maiden.5200.desc_b: "A rumour reaches you from three different sources at once: in a closed session of the council, someone raised the matter of your letter, and no one spoke for a very long time. At last an old cardinal said, quietly, that perhaps the Maiden should be treated as a sovereign.\n\nThe motion was not carried. The silence afterwards, you are told, was a kind of vote."
 eternal_maiden.5200.desc_c: "A small reliquary arrives at your door in plain wrapping, without a seal. Inside is a bone-handled comb said to have belonged to a saint, and a note: \"From someone who has not forgotten the garden.\"\n\nIt is a favour, and also a reminder. You keep the comb. You do not forget the garden either."
 eternal_maiden.1201.t: "The Pyre at Dusk"
 eternal_maiden.1201.desc: "They build the pyre in the market square at dusk, and the preacher climbs it himself with his chin up and his hands bound. When the first flames take, the whole city is silent, and then, strangely, someone begins to sing.\n\nIt is his hymn, not yours. Within a verse the square has taken it up, men who would have sworn they hated every word, and the preacher, with the fire already at his knees, closes his eyes and smiles, as a man smiles who has had the last word.\n\nYou stand on the balcony and watch the smoke go up. You are very sure of one thing: this will not end today."
 eternal_maiden.1201.desc_hi: "The clerk who recorded the execution wrote down more than the sentence. He wrote down what the preacher said about the pilgrim's spring and the sealed cellar, and he has been seen speaking to a man in a grey cloak."
 eternal_maiden.1201.desc_lo: "By morning the ashes have been swept, the square has been scrubbed, and the matter is, for now, closed."
 eternal_maiden.2201.t: "The Debate in the Square"
 eternal_maiden.2201.desc: "You do not raise your voice. You sit on a plain chair under the clock tower with the preacher on the stool opposite, and you ask him, one question at a time, what he actually believes, and why, and who taught him, and what he would do on the day he was proved wrong.\n\nThe crowd, which came for a spectacle, slowly goes quiet. He is not stupid, and he fights well, but a man who defends a lie against someone who is patient is playing a losing hand. By the third hour he has stopped looking at you. By the fourth he is weeping.\n\nHe recants, and the crowd, to its own surprise, applauds."
 eternal_maiden.3201.t: "Seeds on Another Wind"
 eternal_maiden.3201.desc: "You pay the preacher's fines yourself, give him a donkey, and send him off with a smile and a map pointing at every city that has ever annoyed you. He is a talented man and he is suspicious of the gift, but a free man with an audience is a free man with a purpose.\n\nWithin a season the story comes back to you from three directions: a preacher in the south is telling the rival courts that the Maiden is a witch, and being very, very convincing about it. The rival courts, for their part, are suddenly very busy with their own heresies.\n\nIt is not a clean victory. It is a very elegant one."
 eternal_maiden.1202.t: "The Doors That Opened"
 eternal_maiden.1202.desc: "You do not knock. You walk through the oak doors with two attendants and your veil, and every voice in the chamber dies. Twelve bishops look up. One of them has a half-written resolution in his hand, and he tries, unsuccessfully, to put it behind his back.\n\n\"Please,\" you say, taking the empty chair at the head of the table. \"Continue. I was so hoping to hear what you had to say about me.\"\n\nThey continue, in the voices of men reading their own funeral notices."
 eternal_maiden.1202.desc_hi: "Among the twelve, one bishop did not look afraid. He looked thoughtful, and his eyes were on your hands, and afterwards he wrote a very careful letter to a distant colleague."
 eternal_maiden.1202.desc_lo: "When you leave, the resolution has been quietly withdrawn, and the youngest bishop has offered to carry your veil to the door."
 eternal_maiden.2202.t: "Let Old Men Talk"
 eternal_maiden.2202.desc: "You send wine and a message that the Maiden has every confidence in their wisdom. Then you take a long, pleasant walk through the palace gardens and do not think about bishops at all.\n\nThe council meets for two days and produces a resolution of such thorough, elegant meaninglessness that it takes three translators to decide what it says. It says, in the end, that the Maiden is \"a matter for further prayer.\"\n\nYou could not have written it better yourself, and part of you suspects that you did, in the sense that matters."
 eternal_maiden.3202.t: "A Gift in Every Lodging"
 eternal_maiden.3202.desc: "The gifts are small and specific. A rare book for the scholar, a fine mare for the one who likes to ride, a letter of introduction for the nephew who is not yet a priest. No two are alike, and not one is a bribe, because a bribe is something one hides.\n\nBy morning every bishop in the council has a private reason to think kindly of you, and a public reason to say so. The resolution, when it is read, is a hymn.\n\nSomewhere in the room there is a man who knows exactly what happened, and he is smiling very politely at his shoes."
 eternal_maiden.1203.t: "The Finger in the Dark"
 eternal_maiden.1203.desc: "It is done in a single night, and cleanly. The two monks are asleep, the dog has been fed a dish of something that makes dogs very happy, and the reliquary slides into a travelling case with a noise like a held breath.\n\nThree days later the relic is \"found\" in a niche of your own altar, behind a wall that was supposedly sealed for two centuries. The miracle is witnessed by a dozen carefully chosen pilgrims, and your cathedral weeps with joy.\n\nThe rival cathedral weeps, too, for a different reason, and you do not offer them a handkerchief."
 eternal_maiden.2203.t: "An Honest Sale"
 eternal_maiden.2203.desc: "You send a courteous envoy with a fair offer and a very visible escort. The cathedral, which had planned to refuse, finds itself unable to say so in front of the pilgrims it is trying to impress.\n\nThe relic comes to you in a procession. The cathedral gets its price, and a reputation for being the sort of house that sells its saints. The pilgrims, who had expected a theft, are a little moved by your good faith, and a little unsettled by the look on the abbot's face.\n\nThe finger-bone is displayed in a new case of glass. It looks smaller than you had hoped, and that is the only flaw."
 eternal_maiden.3203.t: "A Relic Is Only a Bone"
 eternal_maiden.3203.desc: "\"There is a poet in my court,\" you tell the assembled pilgrims, \"who can carve a finger-bone from a pig's shank in the time it takes to say a prayer. I have asked him to show you how.\"\n\nThe poet obliges. The room goes cold. The abbot of the rival cathedral sits down very slowly on a bench, and the pilgrims on his side of the nave begin, one by one, to cross to yours.\n\nThere is nothing in the faith that forbids this. There is only everything that makes it feel like a small, bright sin."
 eternal_maiden.5203.t: "What Became of the Relic"
 eternal_maiden.5203.desc_a: "The relic has begun to heal people. Not many, not often, but enough that the rival cathedral has stopped speaking of it, and the pilgrims who come to your altar leave offerings that are heavier than the ones they brought.\n\nYou are not sure the bone was ever holy. You are quite sure that belief is."
 eternal_maiden.5203.desc_b: "The rival cathedral has quietly dropped its claim to the relic and has begun, to your faint amusement, to petition you for permission to send its pilgrims to see it. You grant the request, with a generous toll.\n\nIt is the first time in years that anyone has paid to be reconciled to you."
 eternal_maiden.5203.desc_c: "Three months later, the rival cathedral's own relic is revealed to be a fraud, and the abbot is dismissed. The poet in your court has been unusually modest ever since.\n\nIt is a story you do not tell. It is a story that tells itself."
 eternal_maiden.1204.t: "Supper with the Inquisitor"
 eternal_maiden.1204.desc: "You serve him the best of your table and none of your secrets. You ask about his mother, his seminary, his one great doubt as a young man, and you listen as though each answer were the first interesting thing anyone had told you in a decade.\n\nHe stays four days instead of two. On the last evening he catches himself reaching for the ledgers and instead puts them down, a little embarrassed, and asks if the Maiden would do him the honour of a blessing.\n\nYou give it, and he leaves in the morning, and writes a report that is, for an inquisitor, almost a love letter."
 eternal_maiden.2204.t: "The Fever on the Road"
 eternal_maiden.2204.desc: "The inquisitor leaves at dawn with a gift of honeyed bread, and a fortnight later a rider brings word that he fell ill in a roadside inn and died before a priest could reach him. It is very sad.\n\nThe church sends a new inquisitor. The new man is more cautious, and keeps his bread to himself. He also finds that a great many witnesses, who had been willing to speak a week before, have developed a sudden and complete reluctance.\n\nYou are sorry for the man's mother, as one is sorry for something that was always going to happen."
 eternal_maiden.3204.t: "A Small Sin, Freely Given"
 eternal_maiden.3204.desc: "You kneel in the confessional in front of him, and you tell him a sin. It is a small, human one, a flash of temper, a lie of kindness, a night of envy at a better cook, and you tell it with such unforced humility that he is quite undone.\n\nHe absolves you, and he does not look in the ledgers. A man who has seen the worst a person will admit can hardly imagine that there is a much larger worst behind it.\n\nHe leaves with a clean conscience and an empty page, and you have given him everything he came to find."
 eternal_maiden.1205.t: "The Old Faith, Made Pure"
 eternal_maiden.1205.desc: "You stand on the steps of the great cathedral in the plain robes of the oldest rite and call for unity. You do not speak against the reformers. You speak of the first prophet, who walked in sandals, and of the many hands that have since built a house over the footprints.\n\nThe traditionalists weep with relief. The reformers, who had expected to be condemned, find that they have been invited to the feast, and cautiously, most of them sit down.\n\nA schism, you remind yourself, is only a quarrel that nobody has had the patience to win."
 eternal_maiden.2205.t: "The New Faith Bears Your Name"
 eternal_maiden.2205.desc: "You raise the reformers' banner in front of the cathedral, and half the city weeps and half cheers. The old bishops go pale. The young ones, who have waited for years for someone to say it, kneel in the dust.\n\nIt is, as these things go, a very beautiful moment, and it will cost a great many lives before it is over. You know this. You choose it anyway, because there are moments in history that are better led than watched.\n\nBy nightfall, the faithful are saying your name in the new way, and half of them already believe it was always theirs."
 eternal_maiden.3205.t: "Grain for Both Sides"
 eternal_maiden.3205.desc: "You send a quiet notice to the granary-keepers: the Maiden will sell at fair prices to anyone who comes, and ask no questions about banners.\n\nBy the end of the month, both camps are fed, both are indebted, and neither can march against the other without first making peace with you. A sword needs a belly behind it, and you have bought the bellies.\n\nIt is a very unglamorous kind of power, and the most durable kind there is."
 eternal_maiden.5205.t: "The Faith, a Season Later"
 eternal_maiden.5205.desc_a: "A season later the quarrel has faded into a single story told at feasts: how the Maiden stood on the steps in plain robes and called them all home. Not one new heresy has taken root since, and the faithful are quieter, and kinder, and more yours."
 eternal_maiden.5205.desc_b: "A season later the reformers have a name, a hymn, and a banner, and the banner carries your face. It is an uncomfortable thing to see on a wall in a village you have never visited. It is also, you notice, extremely useful."
 eternal_maiden.5205.desc_c: "A season later the schism has settled into a long, expensive stalemate, and the granaries you quietly funded are the only thing both sides still agree on. You have been paid, and paid again, and the paying does not stop."
 eternal_maiden.1206.t: "The Convent at the Edge of Town"
 eternal_maiden.1206.desc: "You endow the convent with an orchard, a school, and a modest hospital, and you ask nothing in return. The sisters are bewildered by the gift, and then deeply, humbly moved.\n\nWithin the year, the convent has become the kind of place women bring their children when there is no one else to bring them to, and the townspeople have begun to speak of your name the way they speak of the weather: with the quiet gratitude of those who depend on it.\n\nA good deed, you reflect, is never wasted. It is merely invested."
 eternal_maiden.2206.t: "The Sisters Who Listen"
 eternal_maiden.2206.desc: "You accept them with grace, and in the first month you teach them a small, gentle art: how to sit by a sickbed, how to be silent, how to hear what is said when the patient thinks no one is listening.\n\nThey are very good students. Within a year, there is not a great house in the realm that does not have a sister at the bedside of someone dying, and not a deathbed whisper that does not, sooner or later, find its way back to a quiet room in your palace.\n\nIt is, you remind yourself, a kind of prayer."
 eternal_maiden.3206.t: "You Need No One's Prayers"
 eternal_maiden.3206.desc: "You receive the prioress with perfect courtesy and refuse, with equal courtesy, every single thing she asked for. You do not need prayers, you say, only deeds, and you wish her order well.\n\nShe leaves with her head high and her hands folded, and a look in her eyes that you cannot quite read. It is the look of a woman who has just made a very careful note.\n\nBut the story of your refusal, when it spreads, is told with a kind of awe: the Maiden, who needs nothing from anyone."
 eternal_maiden.1207.t: "The Tithe and the Pride"
 eternal_maiden.1207.desc: "[maiden_target.GetTitledFirstName] arrives at your hall with a ledger under one arm and a speech under the other, and finds that the speech is unnecessary. You tell them that the church's tithe is not a debt, it is a doorway, and they have been standing in front of it for two years pretending not to see.\n\nThe tithe is paid in full, with interest, in a ceremony in which they have to kneel. No one in the hall laughs. That is the cruelty of it."
 eternal_maiden.1207.desc_hi: "There is a ledger-keeper in the back of the hall who sees all this and writes it down in a very small, very neat hand. He is not on your payroll."
 eternal_maiden.1207.desc_lo: "By evening the debt has been forgotten by everyone but the debtor, who will remember it for the rest of their life."
 eternal_maiden.2207.t: "Mercy, the Heavier Chain"
 eternal_maiden.2207.desc: "You forgive the debt in public, in front of the whole court, with such unforced grace that [maiden_target.GetTitledFirstName] cannot find a single word to answer. A mercy given in the open cannot be refused, and it cannot be repaid, and it leaves the receiver in your debt in a way that no ledger can ever settle.\n\nThey pay a year's tithe within the week, and the next year's without being asked, and the year after that they send a gift. A forgiven man, you have long known, is the most loyal one there is."
 eternal_maiden.3207.t: "Double, and Let Them Hear"
 eternal_maiden.3207.desc: "\"Double,\" you say, in a voice that the hall carries to its furthest corner. \"And the arrears, and the penalty, and the interest on the interest.\" You add a sum. It is the sum of what you believe the vassal can pay, and not a coin less.\n\n[maiden_target.GetTitledFirstName] pays. Every lord in the hall watches them do it, and every one of them goes home that night and counts their own accounts twice.\n\nYou have not made a friend. You have made a very large number of very careful men."
 eternal_maiden.3207.desc_hi: "The lord's wife, watching from the gallery, has not forgotten, and is writing a letter that you will not like."
 eternal_maiden.3207.desc_lo: "Within the month, the realm's tithes are paid on time for the first time in living memory."
 eternal_maiden.1208.t: "The Weight of Devotion"
 eternal_maiden.1208.desc: "You let them speak of you as a saint. You do not confirm it and you do not deny it, you simply smile when they kneel and bless them when they ask, and in a few weeks the thing has become so settled in the minds of the faithful that to deny it would seem like blasphemy.\n\nThe abbot's book of your miracles is copied a hundred times. The ones that did not happen are the ones the pilgrims love best.\n\nYou are, you realise, slowly becoming the thing they say you are, and you are not sure how you feel about that."
 eternal_maiden.2208.t: "The Humble Servant"
 eternal_maiden.2208.desc: "\"I am only a servant,\" you tell them, with downcast eyes and the faint, sweet smile of the very sincere, \"and I have done nothing that any of you would not have done in my place.\"\n\nIt is, of course, the most effective thing you could have said. The more you deny, the more they insist; the more you humble yourself, the higher they raise you. By the end of the month there is a shrine in the capital with your name on it, and a line outside it that has not shortened since.\n\nYou are almost proud of how little you had to do."
 eternal_maiden.3208.t: "Let the Faith Proclaim It"
 eternal_maiden.3208.desc: "You send a polite, perfectly formal letter to the head of the faith requesting that your sainthood be considered by the proper authorities. It is the kind of letter that cannot be answered with a refusal without sounding like a quarrel, and cannot be answered with a yes without sounding like a surrender.\n\nThe council convenes. The debate is long, and terrible, and ends in a compromise that nobody likes and everyone can live with: you are \"venerable,\" a word that means nothing and everything.\n\nIt is not yet sainthood. It is the doorway to it, and you are standing in the doorway."
 eternal_maiden.5208.t: "The Cult Takes Root"
 eternal_maiden.5208.desc_a: "A season on, a chapel has been consecrated in your name in a country you have never visited. The priest is a local woman who has never seen your face and weeps when she says your name. You are, in a way you did not intend, becoming a place."
 eternal_maiden.5208.desc_b: "A season on, a book is circulating in the monasteries: a quiet, scholarly life of the Maiden, written by someone you have never met, and so gentle that you read it twice. It does not mention a single miracle, and it is the most dangerous thing anyone has ever written about you."
 eternal_maiden.5208.desc_c: "A season on, the head of the faith has issued, at last, a very cautious statement on the question of your sanctity. It says nothing definite. It does, however, refer to you as \"blessed,\" and in the language of the church, that single word is enough to build a throne on."
 eternal_maiden.1209.t: "The Debt of the Confessional"
 eternal_maiden.1209.desc_f: "You absolve [maiden_speaker.GetFirstName] in a single, gentle sentence, and you let the silence stand until she begins to weep. \"I will never speak of it,\" she says. \"I would rather die.\"\n\n\"I know,\" you say, and you do. It is the kindest thing you could have said, and it is also the end of her freedom. From this day, she will carry your absolution like a collar."
 eternal_maiden.1209.desc_m: "You absolve [maiden_speaker.GetFirstName] in a single, gentle sentence, and you let the silence stand until he begins to weep. \"I will never speak of it,\" he says. \"I would rather die.\"\n\n\"I know,\" you say, and you do. It is the kindest thing you could have said, and it is also the end of his freedom. From this day, he will carry your absolution like a collar."
 eternal_maiden.2209.t: "Who Would Believe You"
 eternal_maiden.2209.desc_f: "\"Who would believe you?\" you ask, quite softly, and [maiden_speaker.GetFirstName] understands, in that one sentence, that the confessional has become a trap. A priestess who names the Maiden a poisoner will find that she herself has been named a liar, a thief, a woman of loose habits and loose tongue.\n\nBy the end of the month, [maiden_speaker.GetFirstName] has been quietly transferred to a distant convent, and none of her accusations have ever been written down."
 eternal_maiden.2209.desc_m: "\"Who would believe you?\" you ask, quite softly, and [maiden_speaker.GetFirstName] understands, in that one sentence, that the confessional has become a trap. A priest who names the Maiden a poisoner will find that he himself has been named a liar, a thief, a man of loose habits and loose tongue.\n\nBy the end of the month, [maiden_speaker.GetFirstName] has been quietly transferred to a distant monastery, and none of his accusations have ever been written down."
 eternal_maiden.3209.t: "Silence, Well Paid"
 eternal_maiden.3209.desc_f: "You do not mention the cup, or the bishop, or the long dark hour of the feast. You simply give [maiden_speaker.GetFirstName] a modest pension, a small house by the river, and a letter of introduction to a good school for her nieces.\n\nShe understands perfectly. She thanks you in a voice so steady that it frightens her. Every year, on the same day, she will receive another small gift, and every year she will say nothing, and feel the weight of it a little more."
 eternal_maiden.3209.desc_m: "You do not mention the cup, or the bishop, or the long dark hour of the feast. You simply give [maiden_speaker.GetFirstName] a modest pension, a small house by the river, and a letter of introduction to a good school for his nieces.\n\nHe understands perfectly. He thanks you in a voice so steady that it frightens him. Every year, on the same day, he will receive another small gift, and every year he will say nothing, and feel the weight of it a little more."
