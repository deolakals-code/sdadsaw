l_english:
 eternal_maiden.0100.t: "The Blind Pilgrim"
 eternal_maiden.0100.desc: "An old man is led into the sanctuary by his grandson. His eyes are milk-white, and he has walked for forty days to reach you.\n\n\"They say you are heaven's daughter, lady,\" he says, turning his face toward the sound of your steps. \"I do not ask to see the world again. Only your face. Once.\"\n\nThe whole chapel is watching your hands."
 eternal_maiden.0100.a: "Lay your hands upon his eyes and pray with him until dawn."
 eternal_maiden.0100.b: "Have a physician wait behind the curtain, and let the \"miracle\" be seen."
 eternal_maiden.0100.c: "\"Heaven gives sight to the soul first. Go in peace, father.\""
 eternal_maiden.0101.t: "The Weeping Statue"
 eternal_maiden.0101.desc: "In a village chapel, a wooden statue of a veiled woman has begun to weep. The villagers swear it is you. Crowds are gathering, and the local priest has written begging you to come and see.\n\nYour agents tell you, quietly, that a carpenter was paid to drill a tiny channel behind its eyes. They do not know who paid him."
 eternal_maiden.0101.a: "Go, and weep with it. Let them see two miracles instead of one."
 eternal_maiden.0101.b: "Find out who paid the carpenter before anyone else does."
 eternal_maiden.0101.c: "Burn the statue. \"I will not be worshipped in wood.\""
 eternal_maiden.0102.t: "Bread for the Hungry"
 eternal_maiden.0102.desc: "The harvest has failed in the lowlands. Mothers stand at the temple gates with empty bowls, and they look past the priests, toward the window where they believe you pray.\n\nThe granaries still hold enough to feed them. They also hold enough to sell."
 eternal_maiden.0102.a: "Open the granaries, and serve the bread with your own hands."
 eternal_maiden.0102.b: "Lead the city in prayer for rain."
 eternal_maiden.0102.c: "Sell the grain to the highest bidder. Hunger teaches devotion."
 eternal_maiden.0103.t: "The Fevered Child"
 eternal_maiden.0103.desc: "A boy of six burns with fever in a tanner's hovel, and his mother has carried him through the night to lay him at the altar.\n\n\"Please, holy lady,\" she whispers. \"He is all I have left.\"\n\nYou kneel beside the child. His breath is shallow and quick, and his small hand closes around your finger."
 eternal_maiden.0103.a: "Stay with him through the night, praying until the fever breaks."
 eternal_maiden.0103.b: "Summon your own physician, and let the city believe it was your prayer."
 eternal_maiden.0103.c: "Bless him, and send them home. Heaven will decide."
 eternal_maiden.0104.t: "The Relic Seller"
 eternal_maiden.0104.desc: "In the market a merchant is selling scraps of white cloth, each one sworn to be torn from your veil. He has sold three hundred of them. Your veil is whole.\n\nHe is brought before you in chains, still clutching his purse."
 eternal_maiden.0104.a: "Have his hands struck off in the market square. Let the lie end where it began."
 eternal_maiden.0104.b: "Let him keep selling, and take half of every coin."
 eternal_maiden.0104.c: "Bless his wares in public. Let every scrap become true."
 eternal_maiden.0105.t: "A Sea of Pilgrims"
 eternal_maiden.0105.desc: "They have come from three kingdoms. The roads are choked, the inns are full, and still they come, sleeping in fields and ditches for the chance to see you pass.\n\nFrom the balcony, the crowd looks like a field of white flowers, every face turned toward you."
 eternal_maiden.0105.a: "Speak to them from the balcony until your voice fails."
 eternal_maiden.0105.b: "Set a toll on the pilgrim roads. Devotion has a price."
 eternal_maiden.0105.c: "Close the shutters. Even a saint must breathe."
 eternal_maiden.0106.t: "The Leper at the Gate"
 eternal_maiden.0106.desc: "A leper waits at the sanctuary gate, wrapped in grey rags, and the guards keep their spears lowered between him and the doors.\n\n\"I do not ask to be healed,\" he calls. \"Only to be touched, once, by someone who is not afraid.\"\n\nEvery pilgrim in the courtyard has stopped to see what you will do."
 eternal_maiden.0106.a: "Walk past the spears, and take his face in your hands."
 eternal_maiden.0106.b: "Touch him through a silken glove, and let the crowd see only the touch."
 eternal_maiden.0106.c: "Have him driven from the city. Saints do not touch filth."
 eternal_maiden.0107.t: "A Vision in the Night"
 eternal_maiden.0107.desc: "You wake before dawn with the taste of iron on your tongue. In the dream there was a burning city, a white banner, and a voice that sounded like your own.\n\nIt may have been heaven. It may have been the wine. Either way, the priests will want to know what you saw."
 eternal_maiden.0107.a: "\"I saw a holy war. Sharpen the swords.\""
 eternal_maiden.0107.b: "\"I saw peace. Let the bells ring.\""
 eternal_maiden.0107.c: "Tell no one. Visions are more powerful as rumors."
 eternal_maiden.0108.t: "The Doubting Monk"
 eternal_maiden.0108.desc: "A monk from a mountain abbey has been preaching in the market: \"Heaven does not need a woman in white silk to speak for it.\"\n\nHe is thin, barefoot and utterly unafraid, and the crowd listens to him the way they used to listen to you."
 eternal_maiden.0108.a: "Debate him in the cathedral, before everyone."
 eternal_maiden.0108.b: "Let him be found at the bottom of a well."
 eternal_maiden.0108.c: "Endow his abbey generously. Silence is cheaper than martyrs."
 eternal_maiden.0109.t: "The Hymn of the Maiden"
 eternal_maiden.0109.desc: "A young composer has written a hymn in your honor. It is sung in every church in the realm now, and at the end of each verse the congregation turns, without being told, toward your palace.\n\nThe bishops are uneasy. A hymn is meant to face the altar."
 eternal_maiden.0109.a: "Let them sing it. The altar can wait."
 eternal_maiden.0109.b: "Have the final verse rewritten to praise heaven alone."
 eternal_maiden.0109.c: "Ban the hymn, and have the composer whipped for presumption."
 eternal_maiden_miracle_modifier: "Worker of Miracles"
 eternal_maiden_miracle_modifier_desc: "Word of the miracle has spread faster than any herald."
 eternal_maiden_beloved_modifier: "Mother of the Hungry"
 eternal_maiden_beloved_modifier_desc: "The common folk bless the hand that fed them."
 eternal_maiden_feared_modifier: "The Terrible Saint"
 eternal_maiden_feared_modifier_desc: "Even her mercy makes men tremble."
 eternal_maiden_martyr_cult_modifier: "Cult of the Martyr"
 eternal_maiden_martyr_cult_modifier_desc: "A martyr's blood waters the faith of thousands."
 eternal_maiden_devoted_opinion: "Devoted to the Holy Maiden"
 eternal_maiden_shamed_opinion: "Shamed by the Holy Maiden"
