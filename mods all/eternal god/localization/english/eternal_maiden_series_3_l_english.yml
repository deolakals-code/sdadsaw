l_english:
 eternal_maiden.0300.t: "The Jealous Rival"
 eternal_maiden.0300.desc_f: "At supper [maiden_speaker.GetTitledFirstName] raises a cup and smiles across the table. \"To our holy lady, who is so very pure that she never needs to explain where she goes at night.\"\n\nSome of the court laughs. Most of it looks at you."
 eternal_maiden.0300.desc_m: "At supper [maiden_speaker.GetTitledFirstName] raises a cup and smiles across the table. \"To our holy lady, who is so very pure that she never needs to explain where she goes at night.\"\n\nSome of the court laughs. Most of it looks at you."
 eternal_maiden.0300.a: "Answer with one sentence that leaves the hall in silence."
 eternal_maiden.0300.b: "Laugh, and toast them in return. Make an enemy into a disciple."
 eternal_maiden.0300.c: "Smile, and begin ruining them by morning."
 eternal_maiden.0301.t: "A Prince's Proposal"
 eternal_maiden.0301.desc: "A foreign prince has sent a ring, a poem and a train of mules laden with gifts. He offers his hand, his kingdom and his eternal devotion.\n\nThe poem is very bad. The gifts are very good."
 eternal_maiden.0301.a: "\"I am wedded to heaven.\" Return the ring."
 eternal_maiden.0301.b: "Keep the gifts. Keep him waiting. Keep him hoping."
 eternal_maiden.0301.c: "Send him a blessing instead of an answer."
 eternal_maiden.0302.t: "The Court Painter"
 eternal_maiden.0302.desc: "The court painter has finished your portrait. You stand in white against a field of gold, a halo of beaten leaf around your head, eyes lifted to heaven.\n\n\"Is it a true likeness, holy lady?\" he asks, anxious.\n\nIt is not. It is better."
 eternal_maiden.0302.a: "Hang it in the cathedral, above the altar."
 eternal_maiden.0302.b: "Ask him to paint you as you are. Just once, for yourself."
 eternal_maiden.0302.c: "Burn it. No one shall own your face."
 eternal_maiden.0303.t: "The Envoy Who Would Not Kneel"
 eternal_maiden.0303.desc: "The envoy of a proud kingdom stands straight before your throne while the whole court kneels around him.\n\n\"My king bows to no woman in a sheet,\" he says loudly enough for the galleries to hear."
 eternal_maiden.0303.a: "\"Then you will bow to a woman in a crown.\" Have him forced to his knees."
 eternal_maiden.0303.b: "Smile, and bless his king's health. Let his rudeness echo alone."
 eternal_maiden.0303.c: "Send him home shaven, barefoot and on a donkey."
 eternal_maiden.0304.t: "The Physician's Warning"
 eternal_maiden.0304.desc_f: "[maiden_speaker.GetTitledFirstName] has examined the wine in your chambers. \"Someone has been adding nightshade to your cup, holy lady. A little each day.\"\n\nShe hesitates. \"I could not help noticing that it does not seem to harm you.\""
 eternal_maiden.0304.desc_m: "[maiden_speaker.GetTitledFirstName] has examined the wine in your chambers. \"Someone has been adding nightshade to your cup, holy lady. A little each day.\"\n\nHe hesitates. \"I could not help noticing that it does not seem to harm you.\""
 eternal_maiden.0304.a: "Reward their diligence, and their discretion."
 eternal_maiden.0304.b: "\"You noticed nothing.\" Make sure it stays that way."
 eternal_maiden.0304.c: "\"Then you know a secret. Let us share another.\""
 eternal_maiden.0305.t: "The Feast of the Veil"
 eternal_maiden.0305.desc: "It is the feast day of your order, and the great hall waits for your command: a banquet to dazzle the realm, or a fast to humble it.\n\nThere is a third choice, of course. There always is. One of your rivals has accepted the invitation."
 eternal_maiden.0305.a: "Spare nothing. Let the realm talk of this feast for a generation."
 eternal_maiden.0305.b: "Bread, water and prayer. Let the realm fast with you."
 eternal_maiden.0305.c: "Let one particular cup be filled from a different jug."
 eternal_maiden.0306.t: "The Spy Unmasked"
 eternal_maiden.0306.desc_f: "Your sisters have caught [maiden_speaker.GetTitledFirstName] copying your letters by candlelight. She does not deny it. She only asks, very quietly, whether it will be quick."
 eternal_maiden.0306.desc_m: "Your sisters have caught [maiden_speaker.GetTitledFirstName] copying your letters by candlelight. He does not deny it. He only asks, very quietly, whether it will be quick."
 eternal_maiden.0306.a: "\"It will not happen at all. You work for me now.\""
 eternal_maiden.0306.b: "\"Yes. Quick, and public.\""
 eternal_maiden.0306.c: "Let them keep copying, and write your letters for their readers."
 eternal_maiden.0307.t: "The Widows' Petition"
 eternal_maiden.0307.desc: "Thirty widows of the last war kneel in your courtyard. Their husbands died under banners blessed by your hand, and they ask only for bread and a roof.\n\nThe treasurer reminds you, softly, that widows do not pay taxes."
 eternal_maiden.0307.a: "Give them a house of their own, under your protection."
 eternal_maiden.0307.b: "Bless them, and send them home."
 eternal_maiden.0307.c: "Seize their husbands' lands for the church."
 eternal_maiden.0308.t: "A Knight's Vow"
 eternal_maiden.0308.desc_f: "[maiden_speaker.GetTitledFirstName] kneels before you in full armor and lays her sword across your feet. \"I will be your shield, holy lady, until my last breath. Ask anything of me.\"\n\nAnything. You have heard that word before. It is rarely meant."
 eternal_maiden.0308.desc_m: "[maiden_speaker.GetTitledFirstName] kneels before you in full armor and lays his sword across your feet. \"I will be your shield, holy lady, until my last breath. Ask anything of me.\"\n\nAnything. You have heard that word before. It is rarely meant."
 eternal_maiden.0308.a: "Accept the vow, and anoint the blade yourself."
 eternal_maiden.0308.b: "\"Anything?\" Test it before you believe it."
 eternal_maiden.0308.c: "\"Your sword belongs to heaven, not to me.\""
 eternal_maiden.0309.t: "The Spouse's Question"
 eternal_maiden.0309.desc: "[maiden_spouse.GetTitledFirstName] finds you at prayer long after midnight and sits down beside you.\n\n\"I have shared your bed for years,\" your spouse says, \"and I still do not know who you are behind the veil. Will you tell me? Just once?\""
 eternal_maiden.0309.a: "Tell the truth. All of it."
 eternal_maiden.0309.b: "Tell a beautiful lie. It is kinder."
 eternal_maiden.0309.c: "\"Never ask me that again.\""
