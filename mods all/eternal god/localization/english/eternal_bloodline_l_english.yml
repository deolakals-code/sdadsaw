 eternal_divine_mandate_decision: "Proclaim a Divine Mandate"
 eternal_divine_mandate_decision_desc: "Declare before the faithful that heaven itself has chosen you. No one will dare ask for proof."
 eternal_divine_mandate_decision_tooltip: "Claim divine authority for piety and clerical support"
 eternal_holy_absolution_decision: "Grant Yourself Absolution"
 eternal_holy_absolution_decision_desc: "Who can judge the sins of a saint? Cleanse your own record and bury what the chroniclers might say."
 eternal_holy_absolution_decision_tooltip: "Spend piety to erase kinslaying and lower suspicion"
 eternal_maiden.0001.t: "The Veil Is Lifted"
 eternal_maiden.0001.desc: "You step into the sanctuary in white and gold. The priests lower their eyes. You let them believe whatever they wish."
 eternal_maiden.0001.a: "Speak as the voice of heaven."
 eternal_maiden.0001.b: "Appear humble, and let them crown you in their hearts."
 eternal_maiden.0001.c: "Let a sealed warning leave the sanctuary with the pilgrims."
 eternal_maiden.0002.t: "A Saint Cannot Sin"
 eternal_maiden.0002.desc: "You kneel before the altar alone. In a quiet voice, you forgive yourself for everything."
 eternal_maiden.0002.a: "Bury it all. (200 piety)"
 eternal_maiden.0002.b: "Pray, and let some shadows remain. (100 piety)"
 eternal_decree_excommunicate_interaction: "Decree of Exile from the Faith"
 eternal_decree_excommunicate_interaction_desc: "Cast anyone out of the faithful, even the head of the faith. Costs 100 piety."
