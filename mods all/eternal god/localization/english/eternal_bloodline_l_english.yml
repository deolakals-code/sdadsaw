 eternal_divine_mandate_modifier_desc: "Heaven has chosen. No one will question it aloud."
 eternal_holy_fervor_modifier: "Holy Fervor"
 eternal_holy_fervor_modifier_desc: "A command from the Maiden needs no explanation. They march."
 eternal_blessed_modifier: "Blessed by the Maiden"
 eternal_blessed_modifier_desc: "A sacred hand touched them and the world noticed."
