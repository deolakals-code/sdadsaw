l_english:
 trait_eternal_bloodline: "Bloodline of the Eternal God"
 trait_eternal_bloodline_desc: "A bloodline cursed and blessed in equal measure. Its bearers do not age, do not die, and no disease or poison can touch them. Their bodies never scar, their armies are never defeated, their realms build twice as fast and discover new ideas tenfold."
 trait_eternal_bloodline_character_desc: "$trait_eternal_bloodline_desc$"
 eternal_bloodline_awakened_tt: "Your eternal bloodline has awakened — no one can kill you any longer."
 eternal_bloodline_worshipped_modifier: "Worshipped as a God"
 eternal_bloodline_worshipped_modifier_desc: "The people kneel before one who will never die."
 eternal_bloodline.0001.t: "The Awakening of Eternity"
 eternal_bloodline.0001.desc: "On a night when moonlight spills through the window, you feel something stir in your blood — a spark that will never go out. Old wounds close in the blink of an eye and your skin returns to wholeness. You understand now... you will never die."
 eternal_bloodline.0001.a: "[ROOT.Char.GetFirstName], the Eternal... I am ready."
 eternal_bloodline.0002.t: "Voices of the People"
 eternal_bloodline.0002.desc: "Rumors spread among the commoners — that the ruler of this land is no ordinary mortal. People gather at the palace gates to kneel and pray. What will you do with their faith?"
 eternal_bloodline.0002.a: "Accept their worship — I am an immortal above men."
 eternal_bloodline.0002.b: "Refuse — I remain a servant of the people."
 eternal_bloodline.0003.t: "The Unlucky Assassin"
 eternal_bloodline.0003.desc: "A man slips into the palace with a poisoned blade and lunges at you... but the poison has no effect. The wound knits shut in an instant. The assassin turns pale and flees in terror — he will carry the tale across the whole land."
 eternal_bloodline.0003.a: "Let him go — the fear he spreads is my strength."
 eternal_divine_knight: "Divine Knights"
 eternal_divine_knight_desc: "Heavily armored riders sworn to the Eternal Bloodline. Eighty strong, free of upkeep. Only a bearer of the bloodline may raise them."
 eternal_divine_knight_plural: "Divine Knights"
 eternal_forage_expedition_decision: "Eternal Expedition"
 eternal_forage_expedition_decision_desc: "Send riders across the land to find food and plunder. They may range as far as they like; the Eternal does not tire."
 eternal_forage_expedition_decision_tooltip: "Scour or raid the surrounding land for [provisions|E]"
 eternal_forage_expedition_decision_confirm: "Ride out."
 eternal_expedition.0001.t: "The Eternal Expedition"
 eternal_expedition.0001.desc: "Your riders scatter across the countryside. Some return with game and fruit from the orchards; others look hungrily toward the neighbouring borders."
 eternal_expedition.0001.a: "Forage the land."
 eternal_expedition.0001.b: "Raid the neighbouring county."
 eternal_annihilate_interaction: "Eternal Annihilation"
 eternal_annihilate_interaction_desc: "Ride alone to the target's realm and wipe out the target's entire dynasty and shatter the realm's armies. You cannot die. You ride there in person and plunder the target's gold and artifacts (not land), plus 1000 [provisions|E]. No one will ever know who did it. 99% chance of success."
 eternal_annihilate.0001.t: "The Lone March"
 eternal_annihilate.0001.desc: "You set out alone. No army, no banner. Only the name of [ROOT.Char.MakeScope.Var('eternal_annihilate_target').Char.GetTitledFirstName] and a road that ends in silence."
 eternal_annihilate.0001.a: "They will not see me coming."
 eternal_annihilate.0002.t: "Silence Falls"
 eternal_annihilate.0002.desc: "Nothing stops you, not walls, not guards, not prayers. When you leave the realm's halls, the target's bloodline is ash and the realm's armies are broken."
 eternal_annihilate.0002.a: "It is done."
 eternal_annihilate.0002.b: "A single stray blade. The realm still stands."
 eternal_annihilated_army_modifier: "Armies Annihilated"
 eternal_annihilated_army_modifier_desc: "A lone immortal cut through the host. The levies have not recovered."
 eternal_annihilate.0003.t: "Whispers in Empty Halls"
 eternal_annihilate.0003.desc: "The bards sing of a plague, a curse, a vanished dynasty. Not one of them names you. In the courts you pass, men lower their voices and glance at the shadows, and you let them wonder. The strongest throne is the one no one can see."
 eternal_annihilate.0003.a: "Let the world fear what it cannot name."
 eternal_shadow_sovereign_modifier: "Shadow Sovereign"
 eternal_shadow_sovereign_modifier_desc: "The true power never sits on the throne. Its name is spoken only in whispers."
 eternal_machinations.0100.t: "Seeds of a Lie"
 eternal_machinations.0100.desc: "A story is whispered in a tavern, then another. None of it is true. All of it is believable."
 eternal_machinations.0100.a: "Let it spread."
 eternal_machinations.0101.t: "The Lie Takes Root"
 eternal_machinations.0101.desc: "The tale has crossed the fields and the markets. Villagers repeat it without knowing where it began."
 eternal_machinations.0101.a: "Let them believe."
 eternal_machinations.0102.t: "A Ruler Undone"
 eternal_machinations.0102.desc: "The ruler is shamed before their own people. Nobody can say who began it."
 eternal_machinations.0102.a: "They never knew my name."
 eternal_machinations.0200.t: "Whispers to the Vassals"
 eternal_machinations.0200.desc: "Anonymous letters reach every great house. Each hints at slights the liege never committed."
 eternal_machinations.0200.a: "Plant the doubt."
 eternal_machinations.0201.t: "The Lords Turn"
 eternal_machinations.0201.desc: "The vassals meet in private, each certain they alone have been wronged."
 eternal_machinations.0201.a: "Let the realm tear itself apart."
 eternal_machinations.0300.t: "A Poisoned Chalice"
 eternal_machinations.0300.desc: "False letters travel between two thrones, each insulting the other in the other's own voice."
 eternal_machinations.0300.a: "Send the letters."
 eternal_machinations.0301.t: "The Banners Rise"
 eternal_machinations.0301.desc: "Two proud rulers believe the worst of one another. One calls his banners."
 eternal_machinations.0301.a: "War, from a single lie."
 eternal_machinations.0400.t: "The Plague That Never Was"
 eternal_machinations.0400.desc: "Heralds cry plague in the capital. There is no plague. But the markets empty all the same."
 eternal_machinations.0400.a: "Let them panic."
 eternal_machinations.0401.t: "The City Starves of Fear"
 eternal_machinations.0401.desc: "Trade has stopped. Gates are barred against a sickness no one has seen."
 eternal_machinations.0401.a: "Fear is cheaper than armies."
 eternal_machinations.0500.t: "The Quiet Poison"
 eternal_machinations.0500.desc: "Preachers, ballad-singers and wandering peddlers speak of the same unseen injustice. The commons begin to listen."
 eternal_machinations.0500.a: "Let the people speak for me."
 eternal_machinations.0501.t: "Hunger and Anger"
 eternal_machinations.0501.desc: "Fields go untended and tax-collectors are turned back at the gate. The commons trust no one."
 eternal_machinations.0501.a: "They think it was their own idea."
 eternal_rumor_interaction: "Spread a False Tale"
 eternal_rumor_interaction_desc: "Plant a story in the commons. Every county of the target's realm turns against them. No one learns who began it."
 eternal_incite_vassals_interaction: "Incite the Vassals"
 eternal_incite_vassals_interaction_desc: "Poison every vassal's opinion of the target. Let the realm's own factions do the rest."
 eternal_feud_interaction: "Frame a War"
 eternal_feud_interaction_desc: "Forge insults between the target and a neighbouring ruler. A claim is pressed and war is declared."
 eternal_false_calamity_interaction: "Invent a Calamity"
 eternal_false_calamity_interaction_desc: "Spread word of a plague or disaster. The capital suffers for years."
 eternal_sow_commoners_interaction: "Sow Unrest Among the Commons"
 eternal_sow_commoners_interaction_desc: "Turn the common folk of the target's realm against every lord. Taxes and levies collapse."
 eternal_rumor_county_modifier: "Whispered Lies"
 eternal_rumor_county_modifier_desc: "A false story is on everyone's lips."
 eternal_false_calamity_county_modifier: "Imaginary Plague"
 eternal_false_calamity_county_modifier_desc: "People flee a disaster that never came."
 eternal_commoner_unrest_county_modifier: "Quiet Resentment"
 eternal_commoner_unrest_county_modifier_desc: "The common folk trust no lord."
 eternal_incited_opinion: "Incited against them"
 eternal_slandered_opinion: "Believes forged insults"
 eternal_heirs_plot_interaction: "Poison the Heirs"
 eternal_heirs_plot_interaction_desc: "Whisper to two of the target's heirs that the other covets their share. Blood may follow. Nobody is ever sure who started it."
 eternal_plot.0101.t: "Two Cups, One Poison"
 eternal_plot.0101.desc: "A queen need not lift a blade. She only has to teach two siblings to count what the other will inherit."
 eternal_plot.0101.a: "Whisper through a trusted lady-in-waiting."
 eternal_plot.0101.b: "Pay a bard to sing of ancient grudges. (100 gold)"
 eternal_plot.0101.c: "Forge letters in each heir's hand."
 eternal_plot.0101.d: "Not yet. The time is not right."
 eternal_plot.0102.t: "Envy Takes Root"
 eternal_plot.0102.desc: "The heirs have begun to watch each other at table. Some of it is your doing. The rest is simply human."
 eternal_plot.0102.a: "Fan the flames until one of them reaches for a knife."
 eternal_plot.0102.b: "Step back. Let their own hearts do the work."
 eternal_plot.0102.f: "A servant remembers a pair of hands that should not have been in the nursery."
 eternal_parent_plot_interaction: "Hasten the Inheritance"
 eternal_parent_plot_interaction_desc: "Convince the target's heir that the throne is being kept from them. A patient child sometimes grows impatient."
 eternal_plot.0201.t: "The Weight of a Crown"
 eternal_plot.0201.desc: "Every heir waits. Few wait forever. All it takes is a gentle reminder of how long they have already waited."
 eternal_plot.0201.a: "Tell the heir kind lies about their father's health."
 eternal_plot.0201.b: "Fund the heir's secret debts. (100 gold)"
 eternal_plot.0201.c: "Show the heir a forged will."
 eternal_plot.0201.d: "Not yet. The time is not right."
 eternal_plot.0202.t: "An Impatient Heir"
 eternal_plot.0202.desc: "The heir no longer meets their parent's eyes. A cup is prepared in a kitchen far from you."
 eternal_plot.0202.a: "Lean closer. Name the very hour."
 eternal_plot.0202.b: "Let the doubt ferment on its own."
 eternal_plot.0202.f: "The heir confesses the whispered suggestions to a priest."
 eternal_bastard_plot_interaction: "Question the Bloodline"
 eternal_bastard_plot_interaction_desc: "Spread doubt about whether the heir is truly of the ruler's blood. A throne is only as strong as its legitimacy."
 eternal_plot.0301.t: "A Child With Another's Eyes"
 eternal_plot.0301.desc: "Nothing wounds a dynasty like a single sentence: that child does not look like their father."
 eternal_plot.0301.a: "Let a midwife's gossip travel on its own."
 eternal_plot.0301.b: "Buy a witness, then bury the price. (100 gold)"
 eternal_plot.0301.c: "Commission a portrait that says it all."
 eternal_plot.0301.d: "Not yet. The time is not right."
 eternal_plot.0302.t: "The Rumor Settles"
 eternal_plot.0302.desc: "Courtiers study the heir's face in the torchlight. The ruler has stopped smiling at them."
 eternal_plot.0302.a: "Bring in the physician to confirm it."
 eternal_plot.0302.b: "Say no more. Let doubt do its slow work."
 eternal_plot.0302.f: "A forged document is traced to a scribe you had paid."
 eternal_forgotten_plot_interaction: "Wake the Forgotten Heir"
 eternal_forgotten_plot_interaction_desc: "Remind a younger sibling that they too have a claim. A realm with two heirs has none."
 eternal_plot.0401.t: "The Second Born"
 eternal_plot.0401.desc: "The overlooked child is the most dangerous: they have spent years learning what they were denied."
 eternal_plot.0401.a: "Send them a kind letter and a family tree."
 eternal_plot.0401.b: "Fund an ally to flatter their ambitions. (100 gold)"
 eternal_plot.0401.c: "Reveal what the elder sibling said of them."
 eternal_plot.0401.d: "Not yet. The time is not right."
 eternal_plot.0402.t: "A Claim Revived"
 eternal_plot.0402.desc: "The younger heir has begun to speak of what is owed. Courtiers are choosing sides."
 eternal_plot.0402.a: "Press a banner into their hand."
 eternal_plot.0402.b: "Leave a copy of the genealogy and walk away."
 eternal_plot.0402.f: "The elder heir intercepts your letters."
 eternal_spouse_plot_interaction: "Turn the Spouse"
 eternal_spouse_plot_interaction_desc: "Cultivate resentment in the ruler's spouse. Marriages end in many ways."
 eternal_plot.0501.t: "The Cold Side of the Bed"
 eternal_plot.0501.desc: "No one knows a ruler's weaknesses like the person who shares their chamber."
 eternal_plot.0501.a: "Send a sympathetic ear and a kind word."
 eternal_plot.0501.b: "Offer gifts the ruler never gave. (100 gold)"
 eternal_plot.0501.c: "Hint at what the ruler plans to do to them."
 eternal_plot.0501.d: "Not yet. The time is not right."
 eternal_plot.0502.t: "A Quiet Betrayal"
 eternal_plot.0502.desc: "The spouse now wears a smile the ruler cannot read. A secret has been shared at last."
 eternal_plot.0502.a: "Whisper a name and a vial."
 eternal_plot.0502.b: "Be only a friend. Let them decide."
 eternal_plot.0502.f: "The spouse recoils and tells the ruler of your letters."
 eternal_feast_plot_interaction: "Host a Poisoned Feast"
 eternal_feast_plot_interaction_desc: "Invite the target's vassals to a feast of unmatched generosity. Gratitude is a hook that never rusts."
 eternal_plot.0601.t: "A Table Set for Traitors"
 eternal_plot.0601.desc: "A queen's greatest weapon is hospitality. Nothing binds a man like having eaten well at your table."
 eternal_plot.0601.a: "Serve modest wine and honest charm."
 eternal_plot.0601.b: "Spare no expense for the guests. (100 gold)"
 eternal_plot.0601.c: "Let every guest leave owing a secret."
 eternal_plot.0601.d: "Not yet. The time is not right."
 eternal_plot.0602.t: "The Guests Depart"
 eternal_plot.0602.desc: "Letters of thanks arrive. Each carries more warmth than loyalty ever did."
 eternal_plot.0602.a: "Remind them of what they owe."
 eternal_plot.0602.b: "Let the hospitality speak for itself."
 eternal_plot.0602.f: "A guest realizes the toasts were scripted."
 eternal_ward_plot_interaction: "Shelter the Neglected"
 eternal_ward_plot_interaction_desc: "Befriend the target's neglected children. Gratitude survives long after a parent's love fails."
 eternal_plot.0701.t: "The Gentle Hand"
 eternal_plot.0701.desc: "She never raised her voice. She only listened when no one else did."
 eternal_plot.0701.a: "Send kind gifts anonymously."
 eternal_plot.0701.b: "Offer lessons and a tutor. (100 gold)"
 eternal_plot.0701.c: "Invite them quietly to your court."
 eternal_plot.0701.d: "Not yet. The time is not right."
 eternal_plot.0702.t: "A Child Remembers"
 eternal_plot.0702.desc: "A neglected child now speaks of you with a warmth they have never given their own family."
 eternal_plot.0702.a: "Become their first confidante."
 eternal_plot.0702.b: "Be kind and ask for nothing."
 eternal_plot.0702.f: "The ruler notices the gifts and sends them back."
 eternal_mediate_plot_interaction: "Broker a False Peace"
 eternal_mediate_plot_interaction_desc: "Step in as peacemaker in a war you helped sustain. Collect thanks from both sides."
 eternal_plot.0801.t: "The Peacemaker's Fee"
 eternal_plot.0801.desc: "The most profitable war is the one you end yourself."
 eternal_plot.0801.a: "Offer your services graciously."
 eternal_plot.0801.b: "Demand a modest honorarium. (100 gold)"
 eternal_plot.0801.c: "Name your price in provinces and favors."
 eternal_plot.0801.d: "Not yet. The time is not right."
 eternal_plot.0802.t: "The Ink Dries"
 eternal_plot.0802.desc: "Both armies lay down their arms. Both rulers bow to the one who made it possible."
 eternal_plot.0802.a: "Accept the grand reward."
 eternal_plot.0802.b: "Decline gold, take only gratitude."
 eternal_plot.0802.f: "One side learns who stoked the fires."
 eternal_lull_plot_interaction: "Lull With Praise"
 eternal_lull_plot_interaction_desc: "Shower the target with public admiration. A ruler who feels loved forgets to watch the shadows."
 eternal_plot.0901.t: "Flattery Like Wine"
 eternal_plot.0901.desc: "He thinks you admire him. He has no idea what you have admired about his guard."
 eternal_plot.0901.a: "Write a gracious letter."
 eternal_plot.0901.b: "Send a lavish gift. (100 gold)"
 eternal_plot.0901.c: "Praise him publicly before the court."
 eternal_plot.0901.d: "Not yet. The time is not right."
 eternal_plot.0902.t: "The Guard Drops"
 eternal_plot.0902.desc: "The target has begun to sleep soundly. His watchmen are drunk with praise too."
 eternal_plot.0902.a: "Make him swear friendship."
 eternal_plot.0902.b: "Be warm, but leave him with his own suspicions."
 eternal_plot.0902.f: "He reads the flattery and smells the knife behind it."
 eternal_faith_plot_interaction: "Split the Faithful"
 eternal_faith_plot_interaction_desc: "Frame one sect as the cause of the realm's misfortunes. Believers will do the rest."
 eternal_plot.1101.t: "A Schism by Rumor"
 eternal_plot.1101.desc: "Gods do not need to disagree. Their followers always will."
 eternal_plot.1101.a: "Seed rumors among the pilgrims."
 eternal_plot.1101.b: "Bribe a preacher to denounce a rival sect. (100 gold)"
 eternal_plot.1101.c: "Forge a prophecy of doom."
 eternal_plot.1101.d: "Not yet. The time is not right."
 eternal_plot.1102.t: "The Faithful Divide"
 eternal_plot.1102.desc: "Temples now quarrel over words no one remembers. The ruler can no longer calm them."
 eternal_plot.1102.a: "Deepen the schism with a miracle."
 eternal_plot.1102.b: "Withdraw. Let doctrine do the rest."
 eternal_plot.1102.f: "An inquisitor traces the forged prophecy to your agents."
 eternal_market_plot_interaction: "Collapse the Markets"
 eternal_market_plot_interaction_desc: "Spread word of ruined harvests and coin-clipping. Fear empties more coffers than armies."
 eternal_plot.1201.t: "A Hollow Coin"
 eternal_plot.1201.desc: "Panic travels faster than any caravan. A single false whisper empties a marketplace."
 eternal_plot.1201.a: "Spread rumors among merchants."
 eternal_plot.1201.b: "Hire agents to buy up grain and hoard it. (100 gold)"
 eternal_plot.1201.c: "Poison the wells of three trade routes."
 eternal_plot.1201.d: "Not yet. The time is not right."
 eternal_plot.1202.t: "The Markets Close"
 eternal_plot.1202.desc: "Merchants refuse the realm's coin. Taxmen return with empty satchels."
 eternal_plot.1202.a: "Crash the mint itself."
 eternal_plot.1202.b: "Pull back. Let fear run its quiet course."
 eternal_plot.1202.f: "A merchant guild suspects foreign agitation."
 eternal_wolf_plot_interaction: "Set the Wolves at War"
 eternal_wolf_plot_interaction_desc: "Choose the rival who will be told the worst of the target. Opinion drops and a claim is pressed."
 eternal_plot.1301.t: "Choosing the Wolf"
 eternal_plot.1301.desc: "Every realm has a neighbor who is hungry. The art is choosing which one."
 eternal_plot.1301.a: "Whisper to [SCOPE.sC('w1').GetTitledFirstName], the strongest neighbour."
 eternal_plot.1301.b: "Whisper to [SCOPE.sC('w2').GetTitledFirstName], the weakest and most desperate neighbour."
 eternal_plot.1301.c: "Whisper to [SCOPE.sC('w3').GetTitledFirstName], whoever is closest."
 eternal_plot.1301.d: "Not yet. The time is not right."
 eternal_plot.1302.t: "The Banners Rise"
 eternal_plot.1302.desc: "Two courts now believe the worst of one another. Heralds ride in both directions."
 eternal_plot.1302.a: "Light the fuse."
 eternal_plot.1302.b: "Let them decide how bold to be."
 eternal_plot.1302.f: "The chosen neighbour reads the forged letters and laughs."
 eternal_counsel_plot_interaction: "Corrupt the Council"
 eternal_counsel_plot_interaction_desc: "Buy or charm the target's councillors, who then advise their liege badly."
 eternal_plot.1401.t: "The Whispering Council"
 eternal_plot.1401.desc: "A throne is only as clear-sighted as the voices around it."
 eternal_plot.1401.a: "Befriend them one at a time."
 eternal_plot.1401.b: "Pay them from a hidden purse. (100 gold)"
 eternal_plot.1401.c: "Hold their families as leverage."
 eternal_plot.1401.d: "Not yet. The time is not right."
 eternal_plot.1402.t: "Bad Counsel"
 eternal_plot.1402.desc: "The council's advice grows strange. The ruler follows it anyway."
 eternal_plot.1402.a: "Make the corruption permanent."
 eternal_plot.1402.b: "Step back before anyone realizes."
 eternal_plot.1402.f: "An honest councillor reports your attempt."
 eternal_puppet_plot_interaction: "Plant a Loyal Vassal"
 eternal_puppet_plot_interaction_desc: "Cultivate a vassal of the target who answers to you in secret."
 eternal_plot.1501.t: "A Friend at the Other Court"
 eternal_plot.1501.desc: "Every great hall needs a friend who does not know he is a pawn."
 eternal_plot.1501.a: "Be a friendly voice in a lonely hall."
 eternal_plot.1501.b: "Offer him wealth for services unnamed. (100 gold)"
 eternal_plot.1501.c: "Offer him the throne he secretly craves."
 eternal_plot.1501.d: "Not yet. The time is not right."
 eternal_plot.1502.t: "A Loyal Vassal"
 eternal_plot.1502.desc: "The vassal now speaks of you warmly and of his liege coldly."
 eternal_plot.1502.a: "Make his loyalty irreversible."
 eternal_plot.1502.b: "Keep him merely fond of you."
 eternal_plot.1502.f: "The vassal turns your letters in to his liege."
 eternal_praise_plot_interaction: "Spread Tales of Virtue"
 eternal_praise_plot_interaction_desc: "Send agents to whisper of the target's kindness in every tavern and marketplace. In thirty days the commons will adore them. The target may never know why."
 eternal_plot.1601.t: "A Reputation, Carefully Built"
 eternal_plot.1601.desc: "Love is not earned. It is told. The agents leave at dawn with a hundred small stories, each one true enough to repeat."
 eternal_plot.1601.a: "Send a few trusted agents with kind words."
 eternal_plot.1601.b: "Hire bards and balladeers to sing the praises. (100 gold)"
 eternal_plot.1601.c: "Flood every market with miracles and legends."
 eternal_plot.1601.d: "Not yet. The time is not right."
 eternal_plot.1602.t: "The Commons Remember"
 eternal_plot.1602.desc: "Thirty days later, farmers speak the name with gratitude. No one can say who first told them."
 eternal_plot.1602.a: "Let the legend grow into myth."
 eternal_plot.1602.b: "Stop here. Let it feel like their own idea."
 eternal_plot.1602.f: "A skeptical priest notes that the praises are suspiciously uniform."
 eternal_plot.9501.t: "The Knife in the Family"
 eternal_plot.9501.desc: "In a great house, ambition does not wait for permission."
 eternal_plot.9501.desc_dead: "A kinsman is dead, and everyone knows whose blade did it. No one suspects the one who sharpened it."
 eternal_plot.9501.desc_alive: "Words have been exchanged, doors slammed. No blood yet. But the seed is planted."
 eternal_plot.9501.a: "Offer the killer comfort. They will remember who understood."
 eternal_plot.9501.b: "Claim a share of the dead one's coin as a 'funeral gift'."
 eternal_plot.9501.c: "Pour more oil on the embers."
 eternal_plot.9501.d: "Let it rest. The seed will keep."
 eternal_plot.9501.e: "Mourn publicly, and be admired for it."
 eternal_plot.9000.t: "Questions in the Shadows"
 eternal_plot.9000.desc: "Too many sorrows follow in your wake. Chroniclers have begun to draw lines between them. Someone will say your name aloud soon."
 eternal_plot.9000.a: "Silence the witnesses."
 eternal_plot.9000.b: "Bribe the investigators. (400 gold)"
 eternal_plot.9000.c: "Retire from public life for a season."
 eternal_mercy_decision: "Alms for the Ruined"
 eternal_mercy_decision_desc: "Be seen mending what you quietly broke. The poor will love the hand that feeds them, even if it once held the knife."
 eternal_mercy_decision_tooltip: "Win the love of your own people and calm suspicion"
 eternal_ledger_decision: "Review the Ledger"
 eternal_ledger_decision_desc: "A private book of debts, grudges and unfinished business. Only one person has ever read it."
 eternal_ledger_decision_tooltip: "Review your hidden plots and suspicion"
 eternal_appoint_agent_decision: "Name a Shadow"
 eternal_appoint_agent_decision_desc: "A queen who does everything herself is always the first to be suspected. Choose someone who will take the blame."
 eternal_appoint_agent_decision_tooltip: "Choose a trusted agent to reduce the suspicion each plot draws"
 eternal_no_agent_tt: "You have no shadow agent."
 eternal_praise_self_decision: "Spread Tales of Your Virtue"
 eternal_praise_self_decision_desc: "Send agents among the commons to tell kind stories about their ruler. In thirty days they will love you for deeds half-invented."
 eternal_praise_self_decision_tooltip: "Send agents to raise your people's opinion of you over 30 days"
 eternal_praise_busy_tt: "A campaign of praise is already underway."
 eternal_gracious_court_decision: "Hold a Gracious Court"
 eternal_gracious_court_decision_desc: "Receive petitioners in a gown of white and silver. Smile. Remember every face."
 eternal_gracious_court_decision_tooltip: "Cultivate a flawless public image"
 eternal_plot.1001.t: "Mercy, Publicly"
 eternal_plot.1001.desc: "The ruined villages are still smoking. Bring bread, and weep convincingly."
 eternal_plot.1001.a: "Rebuild the villages. (150 gold)"
 eternal_plot.1001.b: "Pray loudly at the cathedral steps."
 eternal_plot.1001.c: "Build an orphanage in your own name. (300 gold)"
 eternal_plot.1701.t: "The Ledger"
 eternal_plot.1701.desc: "You open the ledger. Names, dates, debts and sorrows, all in a neat hand."
 eternal_plot.1701.clear: "No one suspects you of anything."
 eternal_plot.1701.low: "A few eyebrows have been raised. Nothing more."
 eternal_plot.1701.mid: "Rumors have begun to form patterns. Chroniclers are curious."
 eternal_plot.1701.high: "The pattern is clear to anyone who looks. You will be named soon."
 eternal_plot.1701.agent: "Your shadow agent stands ready to take the blame."
 eternal_plot.1701.noagent: "You have no agent. Every plot is your own."
 eternal_plot.1701.active: "A plot is in motion. You cannot begin another until it ends."
 eternal_plot.1701.idle: "No plot is in motion."
 eternal_plot.1701.a: "Close the book."
 eternal_plot.1701.b: "Burn the loosest pages. (50 gold)"
 eternal_plot.1801.t: "The Chosen Shadow"
 eternal_plot.1801.desc: "Someone in your court is clever, and wants more than they have. That is the best kind of servant."
 eternal_plot.1801.a: "Bind them with gold and generous promises. (200 gold)"
 eternal_plot.1801.b: "Bind them with a secret only you know."
 eternal_plot.1801.c: "No. Not yet."
 eternal_plot.1901.t: "The White and Silver Court"
 eternal_plot.1901.desc: "They kneel in awe. They will never imagine what hand wrote their misfortunes."
 eternal_plot.1901.a: "A lavish court, remembered for years. (200 gold)"
 eternal_plot.1901.b: "Hear petitions with quiet grace."
 eternal_plot.1901.c: "Smile just a little too long at a certain petitioner."
 eternal_plot.9502.t: "The Knife in the Family"
 eternal_plot.9502.desc: "In a great house, ambition does not wait for permission."
 eternal_plot.9502.desc_dead: "A kinsman is dead, and everyone knows whose blade did it. No one suspects the one who sharpened it."
 eternal_plot.9502.desc_alive: "Words have been exchanged, doors slammed. No blood yet. But the seed is planted."
 eternal_plot.9502.a: "Offer the killer comfort. They will remember who understood."
 eternal_plot.9502.b: "Claim a share of the dead one's coin as a 'funeral gift'."
 eternal_plot.9502.c: "Pour more oil on the embers."
 eternal_plot.9502.d: "Let it rest. The seed will keep."
 eternal_plot.9502.e: "Mourn publicly, and be admired for it."
