l_english:
 eternal_maiden.0400.t: "The Face Behind the Veil"
 eternal_maiden.0400.desc: "Alone in your chamber, you lift the veil and look into the mirror.\n\nThe faithful see a saint. Your enemies see a schemer. The woman in the glass sees neither. She sees someone who has never once been afraid, and who has begun to enjoy watching others learn to be.\n\nShe smiles at you. You did not tell her to."
 eternal_maiden.0400.a: "Smile back. Let the world meet her."
 eternal_maiden.0400.b: "Kneel and pray until she goes away."
 eternal_maiden.0400.c: "Shatter the mirror."
 eternal_maiden.0401.t: "Poison in the Chalice"
 eternal_maiden.0401.desc: "The bishop who called you a fraud will kneel before you tomorrow to take the holy cup from your hands. It will be the most sacred moment of the feast.\n\nYou hold a small vial up to the candle. It is perfectly clear."
 eternal_maiden.0401.a: "All of it. Let him die at the altar, with your blessing on his lips."
 eternal_maiden.0401.b: "A few drops. Let him sicken, and be \"healed\" by your prayers."
 eternal_maiden.0401.c: "Pour it away. Not at the altar."
 eternal_maiden.0402.t: "The False Prophecy"
 eternal_maiden.0402.desc: "A rival city has mocked your name in its cathedral. From your pulpit you announce, with tears in your eyes, that heaven has shown you its fate: fire, within the year.\n\nThe congregation gasps. Prophecies are only frightening when they come true."
 eternal_maiden.0402.a: "Let fear do the work. They will burn themselves with worry."
 eternal_maiden.0402.b: "Send men with torches to make sure heaven keeps its word. (150 gold)"
 eternal_maiden.0402.c: "Pray loudly for the city's salvation. Let them owe you."
 eternal_maiden.0403.t: "The Witch of the Marshes"
 eternal_maiden.0403.desc: "People have begun to whisper about you again. They need someone else to whisper about.\n\nIn the marshes lives an old herbwoman who sells cures for fever and charms for love. She has never harmed anyone. She would make a perfect witch."
 eternal_maiden.0403.a: "Accuse her before the cathedral, and light the pyre yourself."
 eternal_maiden.0403.b: "Try her, then acquit her and blame the demons she drove out."
 eternal_maiden.0403.c: "Warn her in the night, and let her flee."
 eternal_maiden.0404.t: "The Miracle Trade"
 eternal_maiden.0404.desc: "Your hidden servants have grown skilled at miracles: a beggar who \"walks again\", a mute who \"speaks\", a blind girl who \"sees\". Each one is paid, rehearsed and sent to another town.\n\nThe trade has grown large. Large things are noticed."
 eternal_maiden.0404.a: "Expand it. Every town deserves a miracle."
 eternal_maiden.0404.b: "End it, and let the miracles grow rare and precious."
 eternal_maiden.0404.c: "End the actors along with the trade."
 eternal_maiden.0405.t: "The Bleeding Hands"
 eternal_maiden.0405.desc: "Your physician has shown you how: a thin blade, a little salt, a careful bandage. By Holy Friday your palms will bleed as the prophet's did.\n\nThe faithful have waited centuries for such a sign."
 eternal_maiden.0405.a: "Show your wounded hands to the crowd at dawn."
 eternal_maiden.0405.b: "Show them only to your inner circle, and let the rumor do the rest."
 eternal_maiden.0405.c: "Refuse. Some lies are too heavy even for you."
 eternal_maiden.0406.t: "The Martyr You Made"
 eternal_maiden.0406.desc: "A young sister of your order has volunteered to carry your message into the lands of the heretics. She will not come back. You both know it.\n\nShe kisses your hand. \"If I die, holy lady, let it be for you.\"\n\nYou could stop her. A martyr, however, is worth a thousand sermons."
 eternal_maiden.0406.a: "Bless her, send her, and build her shrine before she is cold."
 eternal_maiden.0406.b: "Forbid it. Keep her by your side."
 eternal_maiden.0406.c: "Let the crowd watch her leave, and see how you weep."
 eternal_maiden.0407.t: "The Servant Who Knew Too Much"
 eternal_maiden.0407.desc_f: "[maiden_speaker.GetTitledFirstName] has served you for many years, carried many letters and cleaned up many things. Tonight she will not meet your eyes.\n\n\"I want to leave your service, holy lady,\" she says. \"I want to forget.\"\n\nNo one who knows what she knows is allowed to forget."
 eternal_maiden.0407.desc_m: "[maiden_speaker.GetTitledFirstName] has served you for many years, carried many letters and cleaned up many things. Tonight he will not meet your eyes.\n\n\"I want to leave your service, holy lady,\" he says. \"I want to forget.\"\n\nNo one who knows what he knows is allowed to forget."
 eternal_maiden.0407.a: "\"Then I will help you forget.\" Send them to a distant cloister of silence, under guard."
 eternal_maiden.0407.b: "\"You may leave. Remember what I could tell about you.\""
 eternal_maiden.0407.c: "\"Go in peace. I trust you.\" Do you?"
 eternal_maiden.0408.t: "The Call to Holy War"
 eternal_maiden.0408.desc: "The heretics across the river have burned a chapel. The faithful look to you, their hands already on their sword hilts.\n\nOne word from you and the river will run red. One word, and the banners of a hundred lords will march under your blessing."
 eternal_maiden.0408.a: "\"Heaven wills it.\" Bless the swords."
 eternal_maiden.0408.b: "Demand that every lord pay a tithe for your blessing first."
 eternal_maiden.0408.c: "\"Not yet.\" Let their anger ripen."
 eternal_maiden.0409.t: "The Communion of Fear"
 eternal_maiden.0409.desc: "At the great communion the cathedral is packed to the doors. When you raise the cup, the whole congregation flinches.\n\nThey love you. They pray to you. And somewhere along the way, without anyone deciding it, they have begun to fear you more than heaven."
 eternal_maiden.0409.a: "\"As they should.\""
 eternal_maiden.0409.b: "Walk among them, and touch every hand. Let love return."
 eternal_maiden.0409.c: "Let them have both. Love and fear make the strongest chain."
