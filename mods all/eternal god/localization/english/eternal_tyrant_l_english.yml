l_english:
 eternal_tyrant.0001.t: "Kneel or Burn"
 eternal_tyrant.0001.desc: "They come at dawn with grain, wine and the best of their herds, and they lay it all before the gate without being asked. No one has threatened them. No one needs to.\n\nAn old man presses his forehead to the stones. \"We remember what happened to the village that forgot,\" he whispers. \"We will not forget.\"\n\nYou watch them from the walls. You do not remember the village. That is what frightens them most."
 eternal_tyrant.0001.a: "\"Good. Let them keep remembering.\""
 eternal_tyrant.0001.b: "\"Double it. Every year, until I tire of it.\""
 eternal_tyrant.0001.c: "\"Take it to the temple. Let the gods eat in my name.\""
 eternal_tyrant.0002.t: "The Assassin's Last Night"
 eternal_tyrant.0002.desc: "The blade went in to the hilt. You felt it scrape bone. And then you turned, slowly, and looked at him.\n\nHe is young. They are always young now; the old ones know better. He stares at the wound as it closes around his steel, and something in his mind simply breaks.\n\n\"What... what are you?\" he asks.\n\n\"Patient,\" you answer."
 eternal_tyrant.0002.a: "Hang him from the gate. Leave the knife in his hand."
 eternal_tyrant.0002.b: "Let him live. Make him tell everyone what he saw."
 eternal_tyrant.0002.c: "Send his head to whoever paid him, wrapped in silk."
 eternal_tyrant.0003.t: "The Test of Loyalty"
 eternal_tyrant.0003.desc: "[tyrant_vassal.GetTitledFirstName] has served you for years. You have served this throne for centuries.\n\nYou summon your vassal at midnight and say nothing at all. You simply watch, unblinking, as the candles burn down and the sweat gathers on that pale brow.\n\nAt the third hour your vassal falls to the floor. \"Whatever I have done, forgive me. Whatever you need, it is yours.\"\n\nYou had not accused anyone of anything."
 eternal_tyrant.0003.a: "\"Then swear it. On your blood, and your children's.\""
 eternal_tyrant.0003.b: "\"I know what you have done.\" You do not. It does not matter."
 eternal_tyrant.0003.c: "\"Rise. Loyalty this sincere deserves a reward.\""
 eternal_tyrant.0004.t: "Execution at Dawn"
 eternal_tyrant.0004.desc: "The square is full, and silent. The condemned is a nobleman who spoke your name in a tavern, and laughed.\n\nThe crowd is not here for him. They are here for you: to see whether the one who never dies will show the one who must any mercy.\n\nThe headsman looks up at your balcony and waits."
 eternal_tyrant.0004.a: "Nod once. Watch without blinking."
 eternal_tyrant.0004.b: "Raise a hand at the last moment. Let mercy be more frightening than the axe."
 eternal_tyrant.0004.c: "Descend to the square and take the axe yourself."
 eternal_tyrant.0005.t: "A Champion from Afar"
 eternal_tyrant.0005.desc: "He has killed bears with his hands, they say, and no man has ever stood against him for longer than a prayer. He has walked across three kingdoms to prove that the immortal of this land is a lie.\n\nHe stands in your hall in borrowed mail, and the court holds its breath.\n\n\"I came to see a god bleed,\" he says."
 eternal_tyrant.0005.a: "\"Then watch closely.\" Kill him with your bare hands."
 eternal_tyrant.0005.b: "Break him slowly, and send him home alive to tell of it."
 eternal_tyrant.0005.c: "\"Kneel, and bleed for me instead.\""
 eternal_tyrant.0006.t: "The Blood Oath"
 eternal_tyrant.0006.desc: "The old rite was forbidden before your grandfather's grandfather was born. You remember it anyway.\n\nOne by one, your lords cut their palms and let the blood fall into a single bowl. When the bowl is full you drink, and the candles gutter as if a wind had passed through the hall.\n\nNo one in the room will ever betray you now. None of them will ever sleep well again either."
 eternal_tyrant.0006.a: "\"Your blood is mine. Never forget it.\""
 eternal_tyrant.0006.b: "Pour the bowl onto the altar instead. Let the gods share the meal."
 eternal_tyrant.0101.t: "The One Who Survived"
 eternal_tyrant.0101.desc: "Your plan did its work. Almost.\n\nThere is one who lived through it, and who has begun asking questions in taverns and temples: who profited, who was seen, who smiled. The questions have not reached your name yet. They are walking toward it, one patient step at a time."
 eternal_tyrant.0101.a: "Have the survivor found. Then have them disappear."
 eternal_tyrant.0101.b: "Let them come. It has been a long time since anyone was brave."
 eternal_tyrant.0101.c: "Feed them a different name. Let them hunt someone else."
 eternal_tyrant.0102.t: "The Orphan's Oath"
 eternal_tyrant.0102.desc: "You hear of a child, orphaned by one of your quiet works, who has sworn before a holy altar to find the hand that took everything.\n\nThe child will grow. The child will grow old. The child will die, eventually, still searching.\n\nYou will still be here."
 eternal_tyrant.0102.a: "Let the oath stand. Time will keep it for you."
 eternal_tyrant.0102.b: "Pay for the child's upbringing in secret. Gratitude is a better leash than fear. (100 gold)"
 eternal_tyrant.0102.c: "Have someone watch over the child, always, from a distance."
 eternal_tyrant.0103.t: "The Priest's Curse"
 eternal_tyrant.0103.desc: "A priest stands on the temple steps and names you before the whole town: \"Abomination. Thief of years. The grave you cheated waits for you still.\"\n\nThe crowd edges away from him as if he were already dead.\n\nYou wait until he has finished, and then you smile at him. He does not finish his last prayer."
 eternal_tyrant.0103.a: "Burn the temple with the priest inside it."
 eternal_tyrant.0103.b: "Have him preach the opposite sermon next week. He will."
 eternal_tyrant.0103.c: "\"Curse me again, holy man. I have outlived better gods than yours.\""
 eternal_tyrant.0104.t: "A Chronicler Too Close"
 eternal_tyrant.0104.desc: "A chronicler in a distant abbey has been drawing lines between the misfortunes of the age, and every line he draws leads toward your court.\n\nHis latest letter to a fellow scholar ends with a single question: \"How long has the ruler of that land been alive?\""
 eternal_tyrant.0104.a: "Visit him yourself, at night. Let him see what he is writing about."
 eternal_tyrant.0104.b: "Burn the abbey's library. Accidents happen."
 eternal_tyrant.0104.c: "Become his patron. Pay him to write a different history. (150 gold)"
 eternal_tyrant.0105.t: "Throne of Bones"
 eternal_tyrant.0105.desc_f: "Ten great houses have fallen in your shadow, and not one of them ever learned your name.\n\nBut the people have learned something. They no longer call you queen. In the villages they call you \"She Who Remains\", and mothers use your name to hush their children.\n\nYou sit upon your throne and understand at last: you are no longer a ruler. You are a season. You are the winter that always returns."
 eternal_tyrant.0105.desc_m: "Ten great houses have fallen in your shadow, and not one of them ever learned your name.\n\nBut the people have learned something. They no longer call you king. In the villages they call you \"He Who Remains\", and mothers use your name to hush their children.\n\nYou sit upon your throne and understand at last: you are no longer a ruler. You are a season. You are the winter that always returns."
 eternal_tyrant.0105.a: "\"Let them fear me as they fear the dark.\""
 eternal_tyrant.0105.b: "\"Let them worship me as they worship the sun.\""
 eternal_tyrant.0106.t: "Ash and Silence"
 eternal_tyrant.0106.desc: "Months later you ride back through the realm you emptied. The halls are cold. The banners are gone.\n\nIn the ruin of the great hall a servant girl is sweeping ash. She looks up, sees you, and does not scream. She simply kneels, and keeps her eyes on the floor, and waits to learn whether she will live.\n\nShe has understood what kings did not."
 eternal_tyrant.0106.a: "\"Remember my face. Tell no one.\""
 eternal_tyrant.0106.b: "Leave her a purse of gold, and go."
 eternal_tyrant_blood_tribute_modifier: "Blood Tribute"
 eternal_tyrant_blood_tribute_modifier_desc: "The commons pay twice: once in coin, once in fear."
 eternal_tyrant_iron_court_modifier: "Court of Iron"
 eternal_tyrant_iron_court_modifier_desc: "No one in this court speaks above a whisper."
 eternal_tyrant_dread_lord_modifier: "The Winter That Returns"
 eternal_tyrant_dread_lord_modifier_desc: "Not a ruler. A season. Mothers use this name to hush their children."
 eternal_tyrant_sworn_opinion: "Sworn in blood"
 eternal_tyrant_terrified_opinion: "Terrified of them"
