l_english:
 eternal_maiden.0200.t: "A Letter from the Head of Faith"
 eternal_maiden.0200.desc: "The seal is heavy and the wax is the color of old blood. [maiden_pontiff.GetTitledFirstName] writes with great courtesy, and every courteous line hides the same question: by whose authority do you speak for heaven?\n\nThe letter ends with a blessing. It does not end with a threat. It does not need to."
 eternal_maiden.0200.a: "Answer as a humble daughter of the faith."
 eternal_maiden.0200.b: "Answer as an equal. Heaven has more than one voice."
 eternal_maiden.0200.c: "Answer with a single line about a secret only the two of you should know."
 eternal_maiden.0201.t: "The Heretic Preacher"
 eternal_maiden.0201.desc: "A wandering preacher has been telling the river towns that you are no saint at all, but a witch who drinks the prayers of the faithful.\n\nHe is dragged into your hall, bruised and smiling. \"Burn me,\" he says, \"and every spark will carry my words further.\""
 eternal_maiden.0201.a: "\"Then let us see how far they fly.\" Burn him."
 eternal_maiden.0201.b: "Debate him in the square until he weeps and recants."
 eternal_maiden.0201.c: "Release him, and point him toward your rivals' cities instead."
 eternal_maiden.0202.t: "The Council of Bishops"
 eternal_maiden.0202.desc: "The bishops of the realm have gathered to discuss \"the matter of the Maiden\". They have not invited you.\n\nThe doors of their chamber are oak, and barred. They will not stay barred for long, if you choose."
 eternal_maiden.0202.a: "Walk in unannounced, and let them find their voices if they can."
 eternal_maiden.0202.b: "Let them talk. Old men need to feel important."
 eternal_maiden.0202.c: "See that every bishop finds a generous gift in his lodgings tonight."
 eternal_maiden.0203.t: "The Stolen Relic"
 eternal_maiden.0203.desc: "A rival cathedral claims to hold a finger-bone of the first prophet, and pilgrims flock there instead of to you.\n\nYour agents tell you the reliquary is guarded by two old monks and a dog. The dog, they say, is the more dangerous."
 eternal_maiden.0203.a: "Have it stolen, and \"rediscovered\" on your own altar."
 eternal_maiden.0203.b: "Buy it openly, and let the cathedral be ashamed of selling it."
 eternal_maiden.0203.c: "Declare it a forgery. A relic is only as true as its keeper."
 eternal_maiden.0204.t: "The Inquisitor at the Gates"
 eternal_maiden.0204.desc: "An inquisitor has come with a scroll of questions and a cart of empty ledgers. He is courteous, tireless, and has already spoken to your cook.\n\n\"I seek only the truth, holy lady,\" he says. \"Surely you have nothing to fear from it.\""
 eternal_maiden.0204.a: "Charm him. Dine with him. Let him leave in love with you."
 eternal_maiden.0204.b: "Let him fall ill on the road home. Very ill."
 eternal_maiden.0204.c: "Confess a small sin to him, so that he stops looking for a large one."
 eternal_maiden.0205.t: "Whispers of Schism"
 eternal_maiden.0205.desc: "The faithful are dividing. Some say the Maiden is the voice of the old faith made pure; others say she is the herald of a new one.\n\nBoth sides wait for you to speak. Both sides have swords."
 eternal_maiden.0205.a: "Stand with the old faith. Unity above all."
 eternal_maiden.0205.b: "Lead the reformers. Let the new faith bear your name."
 eternal_maiden.0205.c: "Say nothing, and sell grain to both sides."
 eternal_maiden.0206.t: "The Sisters' Petition"
 eternal_maiden.0206.desc: "An order of holy sisters asks for your protection and your patronage. They will pray for you day and night, they say, and go wherever you send them.\n\nWherever you send them. Into every great house, every hospital, every bedside where secrets are whispered at the end."
 eternal_maiden.0206.a: "Endow their convent, and let them do good works."
 eternal_maiden.0206.b: "Accept, and teach them to listen well at every bedside."
 eternal_maiden.0206.c: "Refuse. You need no one's prayers."
 eternal_maiden.0207.t: "The Withheld Tithe"
 eternal_maiden.0207.desc: "[maiden_vassal.GetTitledFirstName] has not paid the church's tithe in two years, and boasts at table that a woman in a veil will never collect it.\n\nThe boast has reached you. So, now, has [maiden_vassal.GetTitledFirstName], summoned and pale."
 eternal_maiden.0207.a: "\"Pay, or be cast out of the faith.\" Take the tithe and the pride."
 eternal_maiden.0207.b: "Forgive the debt in public. Let mercy be the heavier chain."
 eternal_maiden.0207.c: "Demand double, and let every lord hear what it cost."
 eternal_maiden.0208.t: "Talk of Sainthood"
 eternal_maiden.0208.desc: "In the taverns and cloisters they have begun to speak of you as a saint already, though you still breathe.\n\nA learned abbot has written a book of your miracles. Some of them even happened."
 eternal_maiden.0208.a: "Accept their devotion. Heaven has spoken through them."
 eternal_maiden.0208.b: "\"I am only a servant.\" Let humility make the legend grow."
 eternal_maiden.0208.c: "Demand that the faith proclaim it officially."
 eternal_maiden.0209.t: "A Priest's Confession"
 eternal_maiden.0209.desc_f: "[maiden_speaker.GetTitledFirstName] kneels in the confessional, but not to confess. \"I know what was in the cup at the bishop's feast, holy lady. I know who carried it. I have told no one.\"\n\nA pause. \"Yet.\""
 eternal_maiden.0209.desc_m: "[maiden_speaker.GetTitledFirstName] kneels in the confessional, but not to confess. \"I know what was in the cup at the bishop's feast, holy lady. I know who carried it. I have told no one.\"\n\nA pause. \"Yet.\""
 eternal_maiden.0209.a: "\"Then you are mine now.\" Absolve them, and own them."
 eternal_maiden.0209.b: "\"Who would believe you?\" Make sure no one ever does."
 eternal_maiden.0209.c: "Reward their silence, generously."
