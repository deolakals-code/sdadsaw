l_english:
 eternal_holywar.0001.t: "From the Pulpit"
 eternal_holywar.0001.desc: "The cathedral is full to the doors when you climb the pulpit, and the bishop who would normally speak first steps aside without being asked. Below you are merchants, widows, soldiers with their helmets in their hands. Beyond the walls, the envoys of a dozen courts wait for your word.\n\nYou have declared the war. Now you must decide what kind of war the world will remember it as."
 eternal_holywar.0001.a: "\"Let there be mercy for those who yield.\""
 eternal_holywar.0001.b: "\"Let fire teach those who will not.\""
 eternal_holywar.0001.c: "\"Let the faithful decide what they have seen.\""
 eternal_holywar.0002.t: "The Banners Gather"
 eternal_holywar.0002.desc: "Riders reach the capital in ones and twos, then in dozens. Each carries a standard in a different colour and a letter in a different hand, and every letter says the same thing: the Holy Maiden has called, and we have come.\n\nShield walls, horsemen, archers, and the strange elite companies each court keeps for its own pride camp on the plain beyond the walls, each according to what its people have trained for since childhood."
 eternal_holywar.0002.desc_mercy: "The camp is quiet and orderly. Soldiers speak of you in the soft, bright voice reserved for saints, and the chaplains have more work than the sergeants."
 eternal_holywar.0002.desc_fire: "The camp is loud and hungry. The soldiers speak of you the way they would speak of a storm, and even the sergeants walk carefully around your tent."
 eternal_holywar.0002.desc_neutral: "The camp is a patchwork of rumours. Each company has decided for itself what you meant, and it will take weeks for the myth to settle."
 eternal_holywar.0002.a: "Walk the lines at dawn."
 eternal_holywar.0002.b: "Give the chaplains a banner of their own."
 eternal_holywar.0002.c: "Let the camp see you only from a distance."
 eternal_holywar.0003.t: "The Pilgrim Road"
 eternal_holywar.0003.desc: "Behind the army come the pilgrims. Nobody called them. They walk barefoot beside the baggage carts, singing the hymn that was written for you without your knowing, and they carry candles that gutter and relight in the wind.\n\nThe captains grumble that they slow the march. The captains also notice, with some embarrassment, that the soldiers walk faster when the singing is near."
 eternal_holywar.0003.a: "Bless the pilgrims and let them walk in front."
 eternal_holywar.0003.b: "Keep them behind the lines, and tell them it is an honour."
 eternal_holywar.0003.c: "March among them yourself."
 eternal_holywar.0004.t: "The Maiden on the Field"
 eternal_holywar.0004.desc: "Dust, iron, and noise, and then a stillness in the middle of it, as if the field itself has drawn a breath. You stand on the slope above the fighting in your white mantle, and across the whole battle line men look up and see you where they hoped to.\n\nWhat you do next will be told in a hundred versions by men who were not there, and by a few who were."
 eternal_holywar.0004.a: "Raise your hand and call the line forward."
 eternal_holywar.0004.b: "Walk down into the lines unarmed."
 eternal_holywar.0004.c: "Stay where you are, and let them look."
 eternal_holywar.0005.t: "The Bells After"
 eternal_holywar.0005.desc: "The bells begin in the cathedral and are taken up, one after another, by every parish between the front and the capital. The war is won, and the dead are counted in a book that no one will ever want to read twice.\n\nYou ride home through villages that kneel as you pass. You are not sure which of the two you have become, a saint or a conqueror, and you have begun to suspect that the villagers do not draw the distinction."
 eternal_holywar.0005.a: "Let the bells ring for three days."
 eternal_holywar.0005.b: "Spend the quiet hours with the wounded."
 eternal_holywar.0006.t: "The Sealed Truce"
 eternal_holywar.0006.desc: "The terms are read aloud on a cold morning and nobody cheers. Both camps are hungry, both leaders are tired, and the envoys exchange the sealed copies with the careful hands of men carrying something that might still go off.\n\nYou have not won. You have not lost. It has taught you, in a way no victory would, exactly how many people were willing to follow you into the dark."
 eternal_holywar.0006.a: "Give the dead their rites and the living their rest."
 eternal_holywar.0006.b: "Let the court see you resolved, not weary."
 eternal_holywar.0007.t: "The Ash of the Banners"
 eternal_holywar.0007.desc: "The banners are burned in the courtyard that night, one at a time, as is the custom. The smoke is thin and grey and smells of cedar and wool, and your allies stand around it with the faces of people who have left a great deal on a field they will not see again.\n\nNo one blames you aloud. That is the worst part."
 eternal_holywar.0007.a: "Take the blame and the grief on yourself."
 eternal_holywar.0007.b: "Promise that the war is not over, only paused."
