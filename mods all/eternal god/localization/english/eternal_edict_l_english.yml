l_english:
 ETERNAL_EDICT_ACTIONS: "Under the Edict"
 interaction_category_eternal_edict: "Under the Edict"
 eternal_under_edict_modifier: "Under the Edict"
 eternal_under_edict_modifier_desc: "This ruler was called by the Holy Maiden and remains in her power. Every day of it wears on the nerves."
 eternal_edict_lesson_interaction: "A Lesson in Court Politics"
 eternal_edict_lesson_interaction_desc: "Sit the guest down and teach them how a court truly works."
 eternal_edict_hunt_interaction: "The Royal Hunt"
 eternal_edict_hunt_interaction_desc: "Ride out with the guest, and decide who hunts and who is hunted."
 eternal_edict_judge_interaction: "Judge for a Day"
 eternal_edict_judge_interaction_desc: "Seat the guest on the judge's bench and see what kind of justice they give."
 eternal_edict_chess_interaction: "The Chessboard of Fate"
 eternal_edict_chess_interaction_desc: "Challenge the guest to a game where the stakes are never said aloud."
 eternal_edict_jester_interaction: "Jester for a Day"
 eternal_edict_jester_interaction_desc: "Dress the guest in bells, or put them on the throne and take the bells yourself."
 eternal_edict_riddle_interaction: "The Riddle Wager"
 eternal_edict_riddle_interaction_desc: "Set a riddle, and name what the loser must give."
 eternal_edict_taste_interaction: "The Blind Tasting"
 eternal_edict_taste_interaction_desc: "Blindfold the guest and put three cups in front of them. One of them may or may not be poisoned."
 eternal_edict_throne_interaction: "An Hour on the Throne"
 eternal_edict_throne_interaction_desc: "Let the guest sit on the Holy Maiden's throne for an hour, and watch what they do with it."
 eternal_edict_masked_interaction: "The Masked Ball"
 eternal_edict_masked_interaction_desc: "Hold a ball where everyone, the Maiden included, wears a mask."
 eternal_edict_bedchamber_interaction: "A Feast That Ends in the Bedchamber"
 eternal_edict_bedchamber_interaction_desc: "Hold a private feast for the charmed guest, and let it end behind your chamber doors."
 eternal_edict_night_interaction: "A Quiet Night"
 eternal_edict_night_interaction_desc: "Spend a long, unhurried night with the guest who has come to trust you."
 eternal_edict.0001.t: "A Lesson in Court Politics"
 eternal_edict.0001.desc: "You sit [summon_guest.GetTitledFirstName] at the small table in the library and put a chessboard of names in front of them: whose cousin sits where, who owes whom, who would sell their mother for a title and who for a debt. You explain how a court is not a place but a weather.\n\nIt is, you realise as you talk, the first honest lesson anyone has given them in years. They listen like someone who has been starving for it."
 eternal_edict.0001.a: "Teach them honestly, and let them see the truth."
 eternal_edict.0001.b: "Teach them fear. A frightened pupil remembers."
 eternal_edict.0001.c: "Set them trick questions, and watch which way they fall."
 eternal_edict.0002.t: "The Royal Hunt"
 eternal_edict.0002.desc: "The horns sound before dawn. You ride out with the guest at your side, through frost and old oaks, with the hounds baying ahead and a hundred riders spread out behind like a net.\n\nSomewhere in the forest, a stag is waiting. Somewhere else, a very small decision is also waiting: who, today, is the hunter."
 eternal_edict.0002.a: "Hunt side by side, and share the kill."
 eternal_edict.0002.b: "Make the guest the quarry, and give them a head start."
 eternal_edict.0002.c: "Fly the hawks together, and let the afternoon be slow."
 eternal_edict.0003.t: "Judge for a Day"
 eternal_edict.0003.desc: "You put the guest in the high chair of the justice hall and hand them the white staff. The first case is a quarrel over a boundary stone; the second, a child accused of stealing bread. The crowd, which has been told who is judging, watches very carefully.\n\nYou stand to one side with your veil lowered. Everyone in the room knows who truly holds the court."
 eternal_edict.0003.a: "Let them rule fairly, and applaud them for it."
 eternal_edict.0003.b: "Make them pass a cruel sentence, and watch their face."
 eternal_edict.0003.c: "Swap seats halfway, and judge the guest instead."
 eternal_edict.0004.t: "The Chessboard of Fate"
 eternal_edict.0004.desc: "You set out the board yourself: ebony and ivory, carved by a dead master, with a missing bishop that has been replaced by a thimble. \"We will not speak of stakes,\" you tell [summon_guest.GetTitledFirstName]. \"We will both know.\"\n\nThe game takes the whole evening. By the fortieth move, neither of you is thinking about chess."
 eternal_edict.0004.a: "Play for the unspoken stakes. Win or lose, something will change."
 eternal_edict.0004.b: "Play to lose, on purpose, and let them believe they won."
 eternal_edict.0004.c: "Play blindfolded, to show them how far ahead you can see."
 eternal_edict.0005.t: "Jester for a Day"
 eternal_edict.0005.desc: "The court jester is sent on holiday, and his motley is brought to [summon_guest.GetTitledFirstName] on a cushion. The courtiers have been told to laugh at anything. It is, as far as anyone can tell, a joke, and no one is sure whose.\n\nThe ruler wears the bells with a stiff back and a very straight face, and the wisest courtiers keep their eyes on their plates."
 eternal_edict.0005.a: "Make the guest the jester, and enjoy the show."
 eternal_edict.0005.b: "Wear the motley yourself, and let the guest sit on your throne."
 eternal_edict.0005.c: "Mask the whole court, and make a game of who is who."
 eternal_edict.0006.t: "The Riddle Wager"
 eternal_edict.0006.desc: "\"A riddle,\" you say, setting down your cup. \"If you answer it, I will grant you a favour. If you do not, you will grant me one.\" Then you add the stake in a whisper, and [summon_guest.GetTitledFirstName] goes pale and then, slowly, thoughtful.\n\nThe riddle is old. The stake is not. The answer, as it happens, is a very small word."
 eternal_edict.0006.a: "Stake a command. The loser obeys."
 eternal_edict.0006.b: "Stake a secret. The loser tells."
 eternal_edict.0006.c: "Stake nothing at all, and only enjoy the puzzle."
 eternal_edict.0007.t: "The Blind Tasting"
 eternal_edict.0007.desc: "Three cups, a silk blindfold, and a table in the middle of an otherwise empty hall. \"One of these is poisoned,\" you say, in a voice that gives nothing away. \"Or none. Or all. Taste, and tell me what you think.\"\n\n[summon_guest.GetTitledFirstName] reaches out with a hand that does not quite shake."
 eternal_edict.0007.a: "Say nothing of the truth, and let their imagination work."
 eternal_edict.0007.b: "Reveal that all three are the finest wine in the house."
 eternal_edict.0007.c: "Swap the cups behind their back, and see what changes."
 eternal_edict.0008.t: "An Hour on the Throne"
 eternal_edict.0008.desc: "You rise and gesture at the throne. [summon_guest.GetTitledFirstName] stares, and then, because there is nothing else to do, sits. The room does not breathe.\n\nThe chair is hard and too wide, and the whole court is looking. It is, as it turns out, a very effective way to learn what a throne weighs."
 eternal_edict.0008.a: "Let them sit for the hour, and say nothing."
 eternal_edict.0008.b: "Kneel at their feet, and let them wonder what it means."
 eternal_edict.0008.c: "Stand at their shoulder, and show them how to rule."
 eternal_edict.0009.t: "The Masked Ball"
 eternal_edict.0009.desc: "A hundred masks are laid out in the great hall: foxes, saints, devils, plain white ovals. Nobody is to say who they are, not even the Holy Maiden, who wears a small silver crescent and nothing else. Violins start, slow and then fast.\n\nIn the crowd, [summon_guest.GetTitledFirstName] puts on a mask of a crow, and for the first time since arriving, seems to breathe."
 eternal_edict.0009.a: "Hold the grandest ball the court has ever seen."
 eternal_edict.0009.b: "Keep your own identity secret, and dance with the guest."
 eternal_edict.0009.c: "Dance the dance of shadows, where everyone is watched."
 eternal_edict.0010.t: "A Feast That Ends in the Bedchamber"
 eternal_edict.0010.desc: "The feast is small: two chairs, a long table, candles that gutter in the draught from a window left open to the garden. You pour the wine yourself, and [summon_guest.GetTitledFirstName], who has come to trust the hand that pours it, laughs at something you say, and does not seem to notice when the laugh stops.\n\nThe servants are dismissed. The music becomes a single lute, somewhere far off. You take the guest's hand and lead them down the corridor, past the guards who study the ceiling, to the door of your chambers. It closes behind you with a soft click.\n\nThe candles are lower inside. There is a scent of cedar and old roses, and the long silence of two people who have decided, without saying so, what happens next. Kisses begin slowly, and then not. Silk falls. Hands find what they were looking for. The night is long and warm, and no chronicle will ever record a word of it.\n\nThe dawn finds you with the shutters open and the guest asleep against your shoulder."
 eternal_edict.0010.a: "Let the feast become a dance, and the dance become the night."
 eternal_edict.0010.b: "Take the long walk slowly, with a stop at every window."
 eternal_edict.0010.c: "Kiss their hand at the door, and send them to bed alone."
 eternal_edict.0011.t: "A Quiet Night"
 eternal_edict.0011.desc: "There is no feast, no music, no audience. You have sent for [summon_guest.GetTitledFirstName] only to sit by the fire, and you do, with a book neither of you reads. At some point the book is closed. At some point you are no longer talking about anything at all.\n\nWhen the guest's hand finds yours, it is not a surprise. When you lean in, it is only a question, and the answer is a long, slow one. The fire burns low. The blankets are heavy and warm, and the quiet in the room is the kind that comes from two people being entirely where they are. The hours go by like silk through the fingers.\n\nIn the grey before dawn, you lie listening to the other's breathing and know, without regret, that something has been settled between you that no treaty could have done."
 eternal_edict.0011.a: "Let the evening end as the night wishes."
 eternal_edict.0011.b: "Keep the night slow, and hold on until the morning."
 eternal_edict.0011.c: "Only talk, and fall asleep by the fire."
