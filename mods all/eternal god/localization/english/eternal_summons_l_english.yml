l_english:
 eternal_royal_summons_interaction: "Royal Summons"
 eternal_royal_summons_interaction_desc: "Send a carriage to bring anyone before the Holy Maiden. Those who refuse are executed."
 eternal_summons_result_ok: "So it is done."
 eternal_summons.0001.t: "A Carriage at the Gate"
 eternal_summons.0001.desc: "It is not an envoy who comes, but a carriage: black lacquer, white horses, an escort that does not speak. The seal on the letter is the Holy Maiden's, and the letter has only one sentence: \"You are summoned.\"\n\nThe coachman waits with his hat in his hands, and he does not look up. He has done this before. He knows what happens to those who say no, and he has driven some of them home in pieces."
 eternal_summons.0001.a: "Climb in. One does not argue with the Maiden."
 eternal_summons.0001.b: "Refuse. No one commands a crown."
 eternal_summons.0002.t: "The Defiant"
 eternal_summons.0002.desc: "The refusal arrives three days later, in a very polite hand. [summon_guest.GetTitledFirstName] regrets that the affairs of the realm do not permit travel.\n\nYou do not reply. You send the carriage back, and in it, a single guard captain with a single order. By the time the news returns to you, it is already old: the realm has a funeral and a succession, and every court within a month's ride has quietly revised its opinion of the word \"no\"."
 eternal_summons.0002.a: "Let the fear do the rest of the work."
 eternal_summons.0002.b: "Pray for the soul. It costs nothing, and calms the dreams."
 eternal_summons.0010.t: "The Carriage Arrives"
 eternal_summons.0010.desc: "The black carriage rolls through the palace gates at dusk, and [summon_guest.GetTitledFirstName] steps down on legs that have not quite recovered from the road. The courtiers lower their eyes. No one at court has ever seen a summoned guest leave in the same condition they arrived.\n\nThe guest is yours now, for as long as you decide. A fortnight, a season, a year, or a span of years in which a child could be born and learn to speak."
 eternal_summons.0010.a: "A fortnight. A short, sharp lesson."
 eternal_summons.0010.b: "Half a year. Long enough to know them."
 eternal_summons.0010.c: "A full year. A season for each mood."
 eternal_summons.0010.d: "Five years. Let the palace become their world."
 eternal_summons.0010.e: "Until I tire of them."
 eternal_summons.0100.t: "What the Maiden Wills"
 eternal_summons.0100.desc: "The guest sits in the chamber you chose, in a chair that is just a little too low. It is a small thing, but they notice. Everyone notices small things when they are afraid.\n\nYou are the Holy Maiden. No law reaches this room, no priest dares to enter it, and no voice here will ever be believed outside it. The question is not what you are allowed to do. The question is what you want."
 eternal_summons.0100.a: "A banquet, and a very patient charm."
 eternal_summons.0100.b: "The cellars, and the quiet questions."
 eternal_summons.0100.c: "Your private chambers, and the night."
 eternal_summons.0100.d: "A binding oath, and a place at your table."
 eternal_summons.0100.e: "An end. Today."
 eternal_summons.1100.t: "The Long Table"
 eternal_summons.1100.desc: "You seat [summon_guest.GetTitledFirstName] at your right hand and serve them with your own hands. You are gracious, funny, and endlessly interested. You laugh at their jokes; you remember the names of their children; you ask the questions that no one has asked them in years.\n\nBy the third course their shoulders have loosened. By the fifth, they are telling you things that they swore they would never tell anyone. By the last toast they are looking at you with something that was fear, not long ago, and is now something much harder to name.\n\nYou smile, and you let them believe it was their own idea."
 eternal_summons.2100.t: "The Cellars"
 eternal_summons.2100.desc: "The cellars of the palace are very old, very dry, and very quiet. You do not go down yourself, not at first. You send your questioners, and you wait upstairs with a book, and when the footsteps return you do not ask what was done. You ask only what was said.\n\nWhat was said is in a neat report, and what was done is a thing the report does not describe. When you finally descend to see [summon_guest.GetTitledFirstName] for yourself, they will not meet your eyes.\n\nSome break. Some do not. Some are never quite the same, and a few do not come back up the stairs at all."
 eternal_summons.3100.t: "The Closed Door"
 eternal_summons.3100.desc_f: "The doors of your chambers close behind [summon_guest.GetTitledFirstName], and the servants are dismissed with a gesture. You pour wine for her yourself, with a hand that does not shake, and you tell her, quietly, that she may speak freely.\n\nShe does not. She watches you the way a hunted creature watches a lamp. What happens in that room afterwards is not written in any chronicle, and the servants who stand outside the door will not remember hearing anything at all.\n\nWhen the dawn comes, something has changed between you. It cannot be undone, and neither of you will name it."
 eternal_summons.3100.desc_m: "The doors of your chambers close behind [summon_guest.GetTitledFirstName], and the servants are dismissed with a gesture. You pour wine for him yourself, with a hand that does not shake, and you tell him, quietly, that he may speak freely.\n\nHe does not. He watches you the way a hunted creature watches a lamp. What happens in that room afterwards is not written in any chronicle, and the servants who stand outside the door will not remember hearing anything at all.\n\nWhen the dawn comes, something has changed between you. It cannot be undone, and neither of you will name it."
 eternal_summons.4100.t: "The Oath at Your Table"
 eternal_summons.4100.desc: "You do not ask for gold. You do not ask for land. You ask for the one thing a ruler cannot give twice: an oath, sworn on their own crown, before your altar and in front of every court that has sent a witness.\n\n[summon_guest.GetTitledFirstName] swears it. They have been given no choice, and they know it, and they say the words in a clear voice anyway. From now on their letters will come to you before they go to anyone else, and your name will be on the first line of every treaty they sign.\n\nIt is, you reflect, the gentlest form of conquest there is."
 eternal_summons.5100.t: "The End of the Audience"
 eternal_summons.5100.desc: "It is done in the morning, in the courtyard, with a single stroke. You watch from the balcony and you do not look away. There are those who say that a ruler who cannot watch her own justice has no right to deliver it.\n\nThe body is carried out under a white cloth. The people say that the Maiden is merciful, because it was quick. They say it quietly, and they do not look up."
 eternal_summons.0200.t: "The Carriage Home"
 eternal_summons.0200.desc: "The time you set has come. The carriage waits in the courtyard with fresh horses and a driver who has been told not to speak. [summon_guest.GetTitledFirstName] stands beside it with a very straight back.\n\nThe common folk have a saying now, and it grows by the week: whoever is called by the Holy Maiden and lives to go home carries her luck with them. Their harvests fatten; their roofs hold; their children grow tall. No one knows who began it. Everyone repeats it. The gift you give them at parting will decide how much of the blessing they believe in."
 eternal_summons.0200.a: "A purse of five gold. A small token."
 eternal_summons.0200.b: "A purse of ten gold."
 eternal_summons.0200.c: "A purse of twenty gold."
 eternal_summons.0200.d: "A purse of fifty gold. A royal farewell."
 eternal_summons.0200.e: "Only your blessing. Let them wonder."
 eternal_summons.1200.t: "A Small Token"
 eternal_summons.1200.desc: "You press the purse into [summon_guest.GetTitledFirstName]'s hand yourself, and say that the Maiden does not forget those who have served her. It is not much, and everyone in the courtyard knows it, and somehow that makes it feel more meaningful.\n\nThe carriage rolls away. In the villages along the road, children run beside it and shout the old saying, and the rumour travels faster than the horses."
 eternal_summons.2200.t: "A Modest Purse"
 eternal_summons.2200.desc: "The purse is heavy enough to feel in the hand and light enough to carry without effort. You tell [summon_guest.GetTitledFirstName] that the Maiden is grateful, and that she expects to hear of good harvests.\n\nThe carriage leaves at a steady trot. By the time it reaches the border, the customs officers have already heard the story, and wave it through with a bow."
 eternal_summons.3200.t: "A Generous Gift"
 eternal_summons.3200.desc: "You give twenty gold and a blessing that takes a long time to say. [summon_guest.GetTitledFirstName] is visibly moved, in spite of everything. Gratitude, you have found, is the most reliable chain of all.\n\nThe road home is lined with people who have come to see the carriage pass. Some of them kneel. A few throw flowers, and one old woman walks beside the wheel for an hour, her lips moving silently."
 eternal_summons.4200.t: "A Royal Farewell"
 eternal_summons.4200.desc: "You give fifty gold, a fine cloak, and a farewell in the great hall in front of the whole court. [summon_guest.GetTitledFirstName] is escorted to the carriage by the palace guards, with torches and drums, as if returning from a triumph and not a captivity.\n\nThe story will be told for a generation: how the Holy Maiden called a ruler to her side and sent them home as a king. In their own realm, the bells ring all the way from the border to the capital."
 eternal_summons.5200.t: "Only a Blessing"
 eternal_summons.5200.desc: "You give no gold at all, only your hand on [summon_guest.GetTitledFirstName]'s brow and three quiet words. It costs you nothing and it is, in its own way, the most frightening farewell of all, because no one knows what the words mean.\n\nThe carriage leaves without ceremony. The people along the road whisper that the guest has been marked. They are not sure whether it is a mark of favour or of doom, and they are careful to be polite to the carriage either way."
 eternal_fortune_0_modifier: "Touched by the Maiden"
 eternal_fortune_0_modifier_desc: "The people say a blessing was left on this ruler's brow, and the realm is quietly the better for it."
 eternal_fortune_1_modifier: "Carrier of the Maiden's Luck"
 eternal_fortune_1_modifier_desc: "The folk believe that anyone called by the Holy Maiden brings her luck home, and that the realm will prosper for it."
 eternal_fortune_2_modifier: "Bearer of the Maiden's Fortune"
 eternal_fortune_2_modifier_desc: "The folk believe that anyone called by the Holy Maiden brings her luck home, and that the realm will prosper for it."
 eternal_fortune_3_modifier: "Favoured of the Holy Maiden"
 eternal_fortune_3_modifier_desc: "The folk believe that anyone called by the Holy Maiden brings her luck home, and that the realm will prosper for it."
 eternal_fortune_4_modifier: "Crowned by the Holy Maiden"
 eternal_fortune_4_modifier_desc: "The folk believe that anyone called by the Holy Maiden brings her luck home, and that the realm will prosper for it."
 eternal_revival_0_modifier: "Mercy of the Maiden"
 eternal_revival_0_modifier_desc: "The people say a blessing was left on this ruler's brow, and a poor realm begins, slowly, to mend."
 eternal_revival_1_modifier: "Carrier of the Maiden's Mercy"
 eternal_revival_1_modifier_desc: "The folk believe that a ruler called by the Holy Maiden brings her mercy home, and that even a failing realm will rise for it."
 eternal_revival_2_modifier: "Bearer of the Maiden's Mercy"
 eternal_revival_2_modifier_desc: "The folk believe that a ruler called by the Holy Maiden brings her mercy home, and that even a failing realm will rise for it."
 eternal_revival_3_modifier: "Renewed by the Holy Maiden"
 eternal_revival_3_modifier_desc: "The folk believe that a ruler called by the Holy Maiden brings her mercy home, and that even a failing realm will rise for it."
 eternal_revival_4_modifier: "Raised by the Holy Maiden"
 eternal_revival_4_modifier_desc: "The folk believe that a ruler called by the Holy Maiden brings her mercy home, and that even a failing realm will rise for it."
 eternal_royal_progress_interaction: "Royal Progress"
 eternal_royal_progress_interaction_desc: "Travel by relay carriage to the court of a foreign ruler and visit their realm."
 eternal_carriage_travel_modifier: "Relay of the Holy Maiden"
 eternal_carriage_travel_modifier_desc: "Fresh horses wait at every post along the road. The carriage travels at the speed of the great steppe riders."
 eternal_carriage_rider_modifier: "Rider of the Relay"
 eternal_carriage_rider_modifier_desc: "Carried by the Holy Maiden's relay of horses, faster than any ordinary traveller."
 eternal_summons.0020.t: "Reception at Court"
 eternal_summons.0020.desc: "The guest has arrived, dusty and silent. Your chamberlain waits for a sign, and the whole court holds its breath. How the Holy Maiden greets a summoned ruler will be remembered for a generation."
 eternal_summons.0020.a: "A grand procession through the city, with bells and banners."
 eternal_summons.0020.b: "A welcome feast, with music and the best wine."
 eternal_summons.0020.c: "A silent audience, with no words and no chairs."
 eternal_summons.0020.d: "A tour of the throne room, and then the cellars."
 eternal_summons.0100.desc_pomp: "The streets are still full of flower petals from the procession. The guest remembers every bell and every kneeling face, and cannot quite decide whether it was an honour or a warning."
 eternal_summons.0100.desc_feast: "The taste of the feast still lingers. The guest has been charmed with food and music, and, for a moment, has almost forgotten the reason they were brought here."
 eternal_summons.0100.desc_quiet: "The silence of the audience has not broken. The guest has been standing for an hour, and every second has taught them something about the woman who summoned them."
 eternal_summons.0100.desc_dread: "The guest has seen the throne room and the stairs that go down. They have not been told what lies at the bottom, and their hands will not stop shaking."
 eternal_summons.0100.desc_none: "The guest waits to learn what the Holy Maiden intends."
 eternal_summons.0030.t: "The Carriage on the Road"
 eternal_summons.0030.desc: "A rider brings news from the road: the black carriage has changed horses at the eleventh post and is racing through the night. The escort reports that the summoned ruler has not spoken once since they left.\n\nThe road is long, and a great deal can be done to a traveller before they ever reach you."
 eternal_summons.0030.a: "Order a blessing at the roadside shrines along their way."
 eternal_summons.0030.b: "Have the escort test the guest with a false ambush."
 eternal_summons.0030.c: "Let the carriage stop at a border town, and let the people see it."
 eternal_summons.1300.t: "Home at Last"
 eternal_summons.1300.desc: "The black carriage rolls through the gates of the capital and stops in the great courtyard. The court is waiting. The people have lined the streets, and those who stand closest to the wheels whisper that the ruler's face has changed: calmer, harder, and a little brighter, as if a lamp had been lit behind it.\n\nIt is said that anyone who is called by the Holy Maiden and returns brings her luck back with them. Everyone in the capital has decided to believe it."
 eternal_summons.1300.a: "Hold a great feast to celebrate the return."
 eternal_summons.1300.b: "Tour the realm, and show the people the blessed ruler."
 eternal_summons.1300.c: "Proclaim the Maiden's blessing from the highest balcony."
 eternal_summons.1310.t: "The Feast of the Return"
 eternal_summons.1310.desc: "The feast lasts three days. The old wine is brought up from the cellars, the poor are fed in the courtyard, and every lord of the realm is made to drink to the Holy Maiden's health, whether they like it or not.\n\nBy the last night, the story has grown. The Maiden, they say, held their ruler's hand and said three words, and the harvests have already begun to turn."
 eternal_summons.1320.t: "The Tour of the Realm"
 eternal_summons.1320.desc: "You ride out in an open carriage, county by county, and every village turns out to see you. Old women touch the wheels; children are lifted onto their fathers' shoulders; a drunk in an inn yard shouts that the harvest will be good this year, and for the first time in a decade, everyone believes him.\n\nIt is exhausting, and it is the best thing you have ever done for your realm."
 eternal_summons.1330.t: "The Maiden's Blessing"
 eternal_summons.1330.desc: "You stand on the highest balcony of the palace, and before the whole city you speak the Maiden's name, and describe what she said, and what she asked, and what she gave. You are careful with the truth. It is more frightening, and more beautiful, when handled carefully.\n\nWhen you finish, the square is silent. Then a woman begins to sing, and it spreads from street to street, and by midnight half the city is on its knees."
 eternal_summons.0400.t: "The Maiden in a Foreign Court"
 eternal_summons.0400.desc: "The black carriage rolls into the capital of [host_realm.GetTitledFirstName] with the whole town watching. You step down in white, and every courtier bows lower than protocol requires, and not one of them is certain whether you are a guest or a conqueror.\n\nYou are, for the moment, both. What you do in the next hours will decide which one they remember."
 eternal_summons.0400.a: "Accept a formal reception, with all the honours due to a sovereign."
 eternal_summons.0400.b: "Inspect the realm, city by city, as if you owned it."
 eternal_summons.0400.c: "Dine with the host, and let them think themselves a friend."
 eternal_summons.0400.d: "Demand tribute, and let the court discover the price of hospitality."
 eternal_summons.1400.t: "The Honours of a Sovereign"
 eternal_summons.1400.desc: "They give you the throne room, the best chambers, and the first cup at the feast. [host_realm.GetTitledFirstName] stands, sits, and stands again, unsure how to behave towards a guest who has taken the place of honour without ever being offered it.\n\nWhen you depart, they walk beside the carriage to the city gate, bareheaded."
 eternal_summons.2400.t: "The Inspection"
 eternal_summons.2400.desc: "You ride through the realm with a small retinue and a very large ledger, asking questions at every market. Why is this wall not repaired? Who built that church, and for whom? [host_realm.GetTitledFirstName] follows two steps behind, giving answers that grow shorter and more careful with each mile.\n\nBy the end of the week, you have learned where everything is, and who benefits from it. That is the first step of any conquest."
 eternal_summons.3400.t: "The Host's Table"
 eternal_summons.3400.desc: "[host_realm.GetTitledFirstName] hosts a feast in your honour, and you let yourself be charmed by it. You laugh in the right places, praise the cook, and drink from the host's own cup. By midnight they have decided that you are not at all the monster the stories describe.\n\nIt is a very small mistake, and a very comfortable one, and you will use it later."
 eternal_summons.4400.t: "The Price of Hospitality"
 eternal_summons.4400.desc: "You let the silence stand until the host understands. Then you name a sum, politely, as if it were a courtesy. It is a very large sum, and it is delivered by nightfall in small, heavy chests, carried by men who do not meet your eyes.\n\nThe court will remember this visit as the day the Holy Maiden asked for something and it was given before she finished asking."
