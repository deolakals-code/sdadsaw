l_english: 
 elder_events.1000.t: "ท่านเคยรู้จักข้า"
 elder_events.1000.desc: ""[confusion_target.GetFirstName] ยอดรักของข้า [elder.Custom2('RelationToMeShort', SCOPE.sC('confusion_target'))] — ช่างดีเหลือเกินที่ได้พบหน้า!" [elder.GetFirstName] ผู้เป็น[ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('elder'))]ของข้ามองลึกลงไปในดวงตาข้า ความลังเลฉายวาบขึ้นหลังรอยยิ้มของ[elder.GetHerHis] "เจ้าเป็นคน[confusion_target.Custom('ComplimentAdjective')]เสมอมา นั่นคือเหตุผลที่ข้ารักเจ้ามากที่สุด"\n\nใน[GetTrait('withering_mind').GetName( GetNullCharacter )]ของ[elder.GetHerHis] วันนี้ข้ากลายเป็น[confusion_target.Custom('SisterBrother')]ไปเสียแล้ว...\n\nทว่าพรุ่งนี้ ข้าอาจกลายเป็นเพียงคนแปลกหน้า"
 elder_events.1000.a: "ได้โปรดเถิด [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('elder'))] — ข้าคือ [ROOT.Char.GetFirstNameNoTooltip]!"
 elder_events.1000.b: "อะ... อา ช่างดีเหลือเกินที่ได้พบท่านเช่นกัน..."
 elder_events.1100.t: "บันไดสู่..."
 elder_events.1100.desc: "ข้าปีนบันไดเหล่านี้มาแล้วนับครั้งไม่ถ้วน เหตุใดวันนี้จึงรู้สึกราวกับกำลังปีนป่ายเทือกเขาแห่ง [mountain_reference.GetName] กันหนอ?\n\nขาสองข้างของข้าสั่นเทา หัวเข่าของข้าไร้เรี่ยวแรง ไม่มีสิ่งใดจะหยุดยั้งการร่วงหล่นนี้ได้เลย\n\nข้าร่วงหล่นลงสู่เบื้องล่าง"
 elder_events.1100.a: "อ๊ากกก!"
 elder_events.1100.bodyguard: "ช่วยด้วย! ช่วยข้าที!"
 EVENT_WINDOW_OPTION_AVAILABLE_BODYGUARD: "ตัวเลือกนี้สามารถใช้ได้เนื่องจากท่านมี [GetCourtPositionType('bodyguard_court_position').GetName()]"
 EVENT_WINDOW_OPTION_AVAILABLE_TUTOR: "ตัวเลือกนี้สามารถใช้ได้เนื่องจากท่านมี [GetCourtPositionType('court_tutor_court_position').GetName()]"
 partially_mute_modifier: "ใบ้บางส่วน"
 partially_mute_modifier_desc: "ตัวละครนี้ประสบความยากลำบากอย่างยิ่งในการพูดจา อันเนื่องมาจากความเจ็บป่วยตามวัย"
 elder_events.1200.t: "อาการชา"
 elder_events.1200.desc: "มันจู่โจมโดยไร้สัญญาณเตือน ร่างกายซีกซ้ายของข้าชาหนึบ ข้าพยายามจะยิ้ม แต่ริมฝีปากกลับไม่ขยับตาม\n\nข้าพยายามเปล่งเสียง ทว่าไม่อาจทำได้\n\nท้ายที่สุด เสียงของข้าก็หวนคืนมา แต่ความหวาดกลัวต่อ [ROOT.Char.GetFaith.NegativeAfterLife] ยังคงฝังรากลึก"
 elder_events.1200.a: "..."
 elder_events.1300.t: "บทเรียนที่ลืมเลือน"
 elder_events.1300.desc: "ข้าเคยอ่านม้วนคัมภีร์เกี่ยวกับ [ROOT.Char.Custom('education_scroll_subject')] เหล่านี้หรือไม่? ข้า... ข้าจำไม่ได้เลย บางทีข้าอาจจะเคยอ่านงั้นหรือ?\n\nพวกมันย่อมเป็นส่วนหนึ่งของการศึกษาของข้า เป็นส่วนหนึ่งของการเล่าเรียน...\n\nใช่แล้ว การ... เล่าเรียนของข้า..."
 elder_events.1300.a: "มันคงไม่ได้สลักสำคัญอันใดนักหรอก..."
 elder_events.1300.tutor: "ข้าต้องการผู้ช่วยเพื่อรื้อฟื้นความจำ"
 elder_events.1400.t: "เกลือกกลิ้งกันสักครา"
 elder_events.1400.desc: ""มาที่เตียงสิ [ROOT.Char.Custom('RaunchyComplimentNoun')]ผู้[ROOT.Char.Custom('RomanticComplimentAdjective')]ของข้า," [lover.GetFirstName] ผู้เป็น[ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('lover'))]ของข้า [lover.Custom('PurrGrowl')] ดวงตาของ[lover.GetHerHis]ลุกโชนด้วยไฟราคะ "ท่านไม่สงสัยสักนิดเลยหรือว่า [lover.Custom('RaunchyComplimentNoun')]ผู้[lover.Custom('GetRaunchyPrefix')]ของท่านได้เรียนรู้สิ่งใดมาบ้าง?"\n\nด้วยรอยยิ้มเจ้าเล่ห์ [lover.GetSheHe]กัดริมฝีปาก[lover.GetHerHis]แล้วล้มตัวลงบนผืนผ้าปูเตียง\n\n"จงครอบครองข้าเสีย เดี๋ยวนี้เลย""
 elder_events.1400.a: "ม้าศึกนับพันก็มิอาจหยุดยั้งข้าได้!"
 elder_events.1400.b: "ขอ [ROOT.Char.GetFaith.HighGodName] ทรงคุ้มครองข้าจาก[lover.GetWomanMan]ผู้นี้ด้วยเถิด"
 death_best_sex_of_their_life: "หัวใจวายขณะกำลังเสพสังวาสอย่างถึงอกถึงใจที่สุดในชีวิตของ[CHARACTER.GetHerHis]"
 purrs: "ครางกระเส่า"
 growls: "คำรามต่ำ"
 raunchy_little: "ตัวน้อย"
 raunchy_sweet: "แสนหวาน"
 raunchy_pretty: "รูปงาม"
 raunchy_bold: "อาจหาญ"
 raunchy_wild: "เร่าร้อนดั่งสัตว์ป่า"
 raunchy_fiery: "ร้อนแรงดั่งไฟ"
 raunchy_young: "วัยเยาว์"
 raunchy_eager: "กระหายอยาก"
 elder_events.1500.t: "ความหฤหรรษ์ที่แลกด้วยชีวิต"
 elder_events.1500.desc: ""ใครๆ ต่างเคยเรียกข้าว่า '[lover.Custom('GetRaunchyPrefix')] [lover.Custom('RaunchyComplimentNoun')]'," [lover.GetFirstName] ผู้เป็น[lover.GetWifeHusband]ของข้าทอดถอนใจ รอยยิ้มจางๆ ปรากฏบนริมฝีปาก[lover.GetHerHis] "ทว่ายามนี้ แค่เดินขึ้นบันไดข้าก็แทบจะหอบจนขาดใจแล้ว..."\n\nด้วยความกระชุ่มกระชวยแห่งวัยหนุ่มสาว ข้าอาจช่วยให้[lover.GetHerHim]รำลึกได้ว่าความรู้สึกของการเป็นที่ปรารถนานั้นเป็นเช่นไร\n\nแต่ทว่า... [GetTrait('faltering_heart').GetName( GetNullCharacter )]ของ[lover.GetHerHis]จะทนรับไหวหรือ?"
 elder_events.1500.a: "ข้าจะมอบประสบการณ์รักที่ถึงอกถึงใจที่สุดในชีวิตของ[lover.GetHerHis]ให้แก่[lover.GetHerHim]เอง!"
 elder_events.1500.b: "อย่าเสี่ยงจะดีกว่า"
 elder_events.1600.t: "มิอาจวิ่งหนีกาลเวลา"
 elder_events.1600.desc: "ข้าออกวิ่ง แต่จำต้องหยุด ข้าหอบเหนื่อยเสียแล้ว\nเมื่อก่อนข้าเคยวิ่งเหยาะๆ รอบ [ROOT.Char.Custom('ResidenceBuilding')] แท้ๆ...\n\nข้าเริ่มวิ่งอีกครั้ง ข้าแทบล้มลง แล้วก็ต้องหยุดลงอีกหน\n\nขอสาปแช่งร่างกายอันบอบบางนี้"
 elder_events.1600.a: "วันเวลาแห่งการวิ่งพ้นผ่านไปเสียแล้ว"
 elder_events.1600.b: "ข้า #EMP ต้อง#! ฝืนข้ามผ่านความเจ็บปวดไปให้จงได้"
