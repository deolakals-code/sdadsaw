l_english: 
 situation_steppe_abundant_grazing_season: "ทุ่งหญ้าอุดมสมบูรณ์"
 situation_steppe_abundant_grazing_season_desc: "$situation_steppe_abundant_grazing_season$ เป็นฤดูที่ทุ่งหญ้าเลี้ยงสัตว์อุดมสมบูรณ์และปศุสัตว์สามารถเล็มหญ้าได้อย่างอิสระ"
 situation_steppe_severe_drought_season: "ภัยแล้งรุนแรง"
 situation_steppe_severe_drought_season_desc: "$situation_steppe_severe_drought_season$ ทำให้ทุ่งหญ้าเลี้ยงสัตว์เหี่ยวเฉา และเสบียงอาหารสัตว์ลดน้อยลง\n\n#weak ในช่วงเวลานี้ การสงครามจะพบได้บ่อยขึ้น#!"
 situation_steppe_white_zud_season: "ซูดขาว"
 situation_steppe_white_zud_season_desc: "ในยามแห่ง $situation_steppe_white_zud_season$ หิมะจะตกทับถมทุ่งหญ้าเลี้ยงสัตว์ ปกคลุมจนมิดชิดด้วยชั้นที่อาจหนาหลายฟุต ปศุสัตว์ไม่สามารถเข้าถึงหญ้าได้ และ ดังนั้นจึงอดตาย#weak $situation_steppe_zud_effect$#!"
 situation_steppe_zud_effect: "\n\nในช่วงซูด ชนร่อนเร่ถูกบังคับให้สวามิภักดิ์ต่อผู้ปกครองที่แข็งแกร่งกว่าเพื่อความอยู่รอด"
 situation_steppe_cold_zud_season: "ซูดเย็น"
 situation_steppe_cold_zud_season_desc: "$situation_steppe_cold_zud_season$ นำมา ซึ่งลมแรงและพายุหิมะ อุณหภูมิที่ต่ำอย่างยิ่งยวดบังคับให้ปศุสัตว์ต้องใช้พลังงานส่วนใหญ่เพื่อรักษาความอบอุ่น และพวกมันไม่สามารถเล็มหญ้าได้#weak $situation_steppe_zud_effect$#!"
 situation_steppe_warm_nights_season: "คิมหันต์นิรันดร์"
 situation_steppe_warm_nights_season_desc: "$situation_steppe_warm_nights_season$ เป็นช่วงเวลาแห่งความสุขและความอุดมสมบูรณ์ อุณหภูมิเหมาะสมอย่างยิ่งสำหรับปศุสัตว์และสภาพอากาศเอื้อให้หญ้าฟื้นตัวได้อย่างง่ายดาย"
 situation_steppe_sky_blessing_season: "พรแห่งฟ้าสีคราม"
 situation_steppe_sky_blessing_season_desc: "ครั้งหนึ่งในชีวิต อาจมีผู้โชคดีพอที่จะได้ประสบกับ $situation_steppe_sky_blessing_season$ ช่วงเวลาที่ความขาดแคลนเป็นสิ่งที่ไม่รู้จักและแผ่นดินเจริญรุ่งเรือง"
 situation_steppe_havsarsan_zud_season: "ฮัฟซาร์ซันซูด"
 situation_steppe_havsarsan_zud_season_desc: "$situation_steppe_havsarsan_zud_season$ คือการรวมกันของซูดสองประเภทขึ้นไป หญ้าถูกปกคลุมด้วยน้ำแข็งและหิมะ พายุพัดกระหน่ำแผ่นดิน อุณหภูมิเยือกแข็ง ทำให้สัตว์ไม่สามารถเคลื่อนไหวได้และหญ้าก็ตาย\n\n#weak ในช่วง $situation_steppe_havsarsan_zud_season$ หนทางเดียวคือการจากไป#!"
