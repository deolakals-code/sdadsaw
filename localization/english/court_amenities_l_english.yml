l_english: 
 court_fashion:0 "แฟชั่นในราชสำนัก"
 court_fashion_default:2 "แฟชั่นศตวรรษที่แล้ว"
 court_fashion_default_desc:0 "ข้าราชสำนัก แต่งกายตามธรรมเนียม ซึ่งปลอดภัย หากไม่สร้างสรรค์นัก"
 court_fashion_acceptable:1 "แฟชั่นล้าสมัย"
 court_fashion_acceptable_desc:0 "ข้าราชสำนักเป็นที่จับตามองเมื่อพวกเขาไปเยือนเมืองเล็กและเมืองใหญ่"
 court_fashion_decent:0 "แฟชั่นพอใช้"
 court_fashion_decent_desc:0 "ข้าราชสำนักปรับเปลี่ยนเสื้อผ้าตามฤดูกาลอย่างคล่องแคล่ว ทิ้งเสื้อผ้าเก่าเมื่อสไตล์ใหม่เป็นที่นิยม"
 court_fashion_good:1 "แฟชั่นนำสมัย"
 court_fashion_good_desc:0 "บ่อยครั้งที่สไตล์ของราชสำนักนี้แพร่กระจายไปทั่วโลกและมีอิทธิพลต่อราชสำนักอื่นๆ"
 court_fashion_fantastic:1 "แฟชั่นชั้นสูง (โอต์กูตูร์)"
 court_fashion_fantastic_desc:0 "ราชสำนักนี้ถือเป็นผู้ริเริ่มด้านสไตล์ คนรับใช้ แต่งกายเหมือนผู้ปกครองของอาณาจักรอื่น และเจ้าผู้ครองนครของพวกเขาจะเป็นที่รู้จักชั่วนิรันดร์ในด้านรสนิยมการ แต่งกาย"

 court_food_quality:0 "คุณภาพอาหาร"
 court_food_quality_default:1 "อาหารรสจืดชืด"
 court_food_quality_modest:0 "อาหารพอประมาณ"
 court_food_quality_decent:0 "อาหารพอใช้"
 court_food_quality_lavish:0 "อาหารหรูหราฟุ่มเฟือย"
 court_food_quality_exotic:0 "อาหารแปลกใหม่จากต่างแดน"
 court_food_quality_default_desc:0 "ไม่มีผู้ใดตั้งตารอรับประทานอาหารในราชสำนักนี้ แต่กล่าวกันว่ามิตรสหายช่วยชดเชยได้"
 court_food_quality_modest_desc:0 "แขกได้รับการเลี้ยงดูอย่างดีด้วยอาหารท้องถิ่นที่เพียงพอ"
 court_food_quality_decent_desc:0 "ราชสำนักนี้สามารถจัดหาอาหารอันโอชะแปลกใหม่ได้เป็นครั้งคราว"
 court_food_quality_lavish_desc:0 "กองทัพพ่อครัวจัดหาอาหารรสเลิศอย่างต่อเนื่อง คนรับใช้พร้อมถาดอาหารคอยติดตามกลุ่มแขกที่รวมตัวกันเสมอ"
 court_food_quality_exotic_desc:0 "คนรับใช้ถูกส่งไปยังดินแดนต่างแดนและกลับมาพร้อมอาหารแปลกใหม่มากมาย ไม่มีความสุขทางรสชาติใดที่ไม่เคยผ่านห้องโถงเหล่านี้"

 court_lodging_standards:0 "มาตรฐานที่พัก"
 court_lodging_standards_default:1 "ที่พักคับแคบ"
 court_lodging_standards_small:0 "ที่พักขนาดเล็ก"
 court_lodging_standards_middling:0 "ที่พักขนาดกลาง"
 court_lodging_standards_spacious:0 "ที่พักกว้างขวาง"
 court_lodging_standards_grand:0 "ที่พักโอ่อ่า"
 court_lodging_standards_default_desc:0 "มีเหตุการณ์ทางการทูตเกิดขึ้นเป็นครั้งคราวเมื่อแขกถูกขอให้พักรวมกัน"
 court_lodging_standards_small_desc:0 "มีพื้นที่เพียงพอสำหรับข้าราชสำนักทุกคนที่จะมีห้องส่วนตัว"
 court_lodging_standards_middling_desc:0 "ห้องพักของข้าราชสำนักทุกคนได้รับการจัดเตรียมอย่างดี"
 court_lodging_standards_spacious_desc:0 "ผู้อยู่อาศัยในราชสำนักนี้ทุกคนสามารถคาดหวังห้องชุดได้"
 court_lodging_standards_grand_desc:0 "แขกรู้ว่าพวกเขาสามารถขอความหรูหราใดๆ ก็ได้ภายในที่พักของตน หนังสือใดๆ สำหรับการศึกษา เครื่องดื่มยามดึกใดๆ - มีผู้ดูแลห้องพักตลอดเวลา"

 court_servants:0 "คนรับใช้ในราชสำนัก"
 court_servants_default:1 "คนรับใช้น้อยมาก"
 court_servants_few:0 "คนรับใช้น้อย"
 court_servants_some:0 "คนรับใช้จำนวนหนึ่ง"
 court_servants_many:0 "คนรับใช้จำนวนมาก"
 court_servants_endless:0 "คนรับใช้ไม่สิ้นสุด"
 court_servants_default_desc:0 "คนรับใช้เพียงหยิบมือของราชสำนักนี้เหนื่อยล้าจากการตอบสนองความต้องการของแขกทุกคน"
 court_servants_few_desc:0 "ราชสำนักนี้มีคนรับใช้ที่สามารถให้ความสะดวกสบายที่สำคัญเกือบทุกอย่างได้"
 court_servants_some_desc:0 "ราชสำนักนี้มีคนรับใช้เฉพาะทางที่ภาคภูมิใจในงานของตน"
 court_servants_many_desc:0 "ราชสำนักนี้มีคนรับใช้สำหรับทุกวัตถุประสงค์ที่ใครจะนึกออกได้"
 court_servants_endless_desc:0 "ราชสำนักนี้มีคนรับใช้มากกว่าที่ใครจะรู้ว่าจะทำอย่างไรกับพวกเขา ต้องใช้ความพยายามอย่างมากในการทำงานที่ง่ายที่สุดโดยไม่มีคนรับใช้ขอร้องที่จะทำแทนท่าน"
