 SUGGESTION_TITLE:0 "#T $NAME$#!"
 
 suggestion_recruit_maa_label:0 "เกณฑ์ทหารอาชีพ"
 suggestion_recruit_maa:0 "ข้อเสนอแนะ: เกณฑ์กองทหารอาชีพ"
 suggestion_recruit_maa_desc:0 "ท่านมี [men_at_arms|E] น้อยกว่าที่คาดไว้สำหรับ [ruler|E] ใน [rank|E] ของท่าน\n\nการเกณฑ์ทหารเพิ่มจะช่วยเสริม [armies|E] ของท่าน ทั้งเพื่อยับยั้งศัตรูที่อาจเกิดขึ้นและต่อสู้กับผู้ที่ยืนกรานจะสู้รบอยู่ดี"
 suggestion_recruit_maa_click:0 "#I คลิกเพื่อดูกองทัพของท่าน#!"

 suggestion_declare_war_label:0 "ประกาศสงคราม"
 suggestion_declare_war:0 "ข้อเสนอแนะ: ประกาศสงครามกับ [recipient.GetShortUINameNoTooltip]"
 suggestion_declare_war_desc:1 "การชนะสงครามกับ [recipient.GetShortUIName] จะ ทำให้ท่านสามารถพิชิตดินแดนเพิ่มและขยาย [realm|E] ของท่าน ช่วยให้ [house|E] ของท่านประสบความสำเร็จในระยะยาว"
 suggestion_declare_war_click:1 "#I คลิกเพื่อประกาศสงคราม#!"

 suggestion_construct_building_label:0 "ก่อสร้างอาคาร"
 suggestion_construct_building:0 "ข้อเสนอแนะ: ก่อสร้างอาคารใน [landed_title.GetNameNoTierNoTooltip]"
 suggestion_construct_building_desc:1 "การก่อสร้างอาคารใน [landed_title.GetNameNoTooltip] จะมอบผลประโยชน์และโบนัสต่างๆ ให้แก่ท่าน ซึ่งเป็นประโยชน์อย่างยิ่งในระยะยาว"
