 suggestion_fabricate_claim_desc:1 "[landed_title.GetName] ที่อยู่ใกล้เคียงนั้นทั้งร่ำรวยและเจริญรุ่งเรือง แต่ท่านไม่สามารถพิชิตได้หากไม่มี [casus_belli|E]\n\nการส่ง [court_chaplain|E] หรือ [realm_priest|E] ของท่านไปสร้าง [claim|E] เหนือดินแดนนั้นจะให้เหตุผลที่ท่านต้องการในการทำ [war|E] และยึดบรรดาศักดิ์มาเป็นของท่านเอง!"
 suggestion_fabricate_claim_click:1 "#I คลิกเพื่อดูบรรดาศักดิ์#!"

 suggestion_create_title_label:0 "สร้างบรรดาศักดิ์"
 suggestion_create_title:0 "ข้อเสนอแนะ: สร้าง [landed_title.GetNameNoTooltip]"
 suggestion_create_title_desc:1 "ท่านครอบครองดินแดน [de_jure|E] เพียงพอที่จะ [create|E] [landed_title.GetName] การทำ เช่นนี้จะเพิ่ม [prestige|E] ของท่านอย่างมาก และ ทำให้ท่านกลายเป็น [rightful_liege|E] ของบรรดาศักดิ์ทั้งหมดภายใต้นั้น"
 suggestion_create_title_click:1 "#I คลิกเพื่อดูบรรดาศักดิ์#!"

 SUGGESTIONS_DEBUG:0 "#D SUGGESTIONS DEBUG:#!"

