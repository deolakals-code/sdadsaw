 suggestion_increase_opinion_desc:0 "[actor.Custom2('RelationToMeShort', SCOPE.sC('recipient'))] [recipient.GetShortUIName] ของท่านมีความเห็น [opinion|E] ต่อท่านต่ำ การเพิ่มความเห็นด้วย [personal_scheme|E] จะ ทำให้ชีวิตของท่านง่ายขึ้น"
