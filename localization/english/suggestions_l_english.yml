 suggestion_increase_control_desc:2 "การส่ง [Concept( 'marshal', GetPlayer.GetCouncillorPosition( 'councillor_marshal' ).GetPositionName )|E] ของท่านไปเพิ่มการควบคุมใน [landed_title.GetName] จะนำไปสู่การลด [county_corruption|E] ในเคาน์ตี และอาจมีผลดีอื่นๆ ตามมาด้วย"
