 # Intro Lines
 ## Romance
 GeneratePoem_Intro_Rhyming_Romance_01_A_01:0 "โอ้ ใบหน้างามผุดผ่องส่องประกาย,"
 GeneratePoem_Intro_Rhyming_Romance_01_A_02:0 "$GeneratePoem_Intro_Rhyming_Romance_01_A_01$"
 GeneratePoem_Intro_Rhyming_Romance_01_A_03:0 "$GeneratePoem_Intro_Rhyming_Romance_01_A_01$"
 GeneratePoem_Intro_Rhyming_Romance_01_B_01:0 "ระยิบระยับ วับวาว หลอนในฝัน,"
 GeneratePoem_Intro_Rhyming_Romance_01_B_02:0 "บริสุทธิ์ผุดผ่องจนใจข้าแทบขาดพลัน,"
 GeneratePoem_Intro_Rhyming_Romance_01_B_03:0 "ติดอยู่ในรอยยิ้ม[ROOT.Var('poem_subject').Char.GetHerHis] อบอุ่นดั่งตะวัน,"
 GeneratePoem_Intro_Rhyming_Romance_02_A_01:0 "[ROOT.Var('poem_subject').Char.GetWomanMan|U]ผู้งามเลิศผู้ ทำให้ข้าหลงใหล,"
 GeneratePoem_Intro_Rhyming_Romance_02_A_02:0 "$GeneratePoem_Intro_Rhyming_Romance_02_A_01$"
 GeneratePoem_Intro_Rhyming_Romance_02_A_03:0 "$GeneratePoem_Intro_Rhyming_Romance_02_A_01$"
 GeneratePoem_Intro_Rhyming_Romance_02_B_01:0 "โอ้ [ROOT.Var('poem_subject').Char.GetWomanMan] ผู้นั้นหายไปแห่งหนใด?"
 GeneratePoem_Intro_Rhyming_Romance_02_B_02:0 "ผู้ ซึ่งใบหน้าดูเหมือนจะเปล่งประกายเสมอไป,"
 GeneratePoem_Intro_Rhyming_Romance_02_B_03:0 "ผู้ ซึ่งข้าขอมอบความภักดีชั่วนิรันดร์ให้,"
 GeneratePoem_Intro_Rhyming_Romance_03_A_01:0 "ข้าสงสัยว่าหน้ากาก[ROOT.Var('poem_subject').Char.GetHerHis] ซ่อนความลับใดไว้?"
 GeneratePoem_Intro_Rhyming_Romance_03_A_02:0 "$GeneratePoem_Intro_Rhyming_Romance_03_A_01$"
 GeneratePoem_Intro_Rhyming_Romance_03_A_03:0 "$GeneratePoem_Intro_Rhyming_Romance_03_A_01$"
 GeneratePoem_Intro_Rhyming_Romance_03_B_01:0 "สิ่งมหัศจรรย์ซ่อนเร้น? หรือเรื่องราวปิดบังไว้?"
 GeneratePoem_Intro_Rhyming_Romance_03_B_02:0 "เพราะแน่แท้ [ROOT.Var('poem_subject').Char.GetWomanMan] นี้ไร้ ซึ่งตำหนิ,"
 GeneratePoem_Intro_Rhyming_Romance_03_B_03:0 "มันคือเกราะป้องกันหรือเพียงแค่ท่าทีที่แสดงไว้?"
 ## Mourning
 GeneratePoem_Intro_Rhyming_Mourning_01_A_01:0 "ไม่ว่ากี่วันจะผันผ่านไป,"
 GeneratePoem_Intro_Rhyming_Mourning_01_A_02:0 "$GeneratePoem_Intro_Rhyming_Mourning_01_A_01$"
 GeneratePoem_Intro_Rhyming_Mourning_01_A_03:0 "$GeneratePoem_Intro_Rhyming_Mourning_01_A_01$"
 GeneratePoem_Intro_Rhyming_Mourning_01_B_01:0 "ชีวิตไร้[ROOT.Var('poem_subject').Char.GetHerHim]คือห้วงทุกข์ทนอันน่าสะอิดสะเอียน,"
 GeneratePoem_Intro_Rhyming_Mourning_01_B_02:0 "โลกดูห่างไกล ราวกับมองผ่านกระจกเงา,"
 GeneratePoem_Intro_Rhyming_Mourning_01_B_03:0 "สายลมกระซิบเย็นเยียบผ่านทุ่งหญ้า,"
 GeneratePoem_Intro_Rhyming_Mourning_02_A_01:0 "เมื่อใบหน้างาม เช่นนั้นลับหายไปจากสายตา,"
 GeneratePoem_Intro_Rhyming_Mourning_02_A_02:0 "$GeneratePoem_Intro_Rhyming_Mourning_02_A_01$"
 GeneratePoem_Intro_Rhyming_Mourning_02_A_03:0 "$GeneratePoem_Intro_Rhyming_Mourning_02_A_01$"
