 #Marco Polo quotes
 marco_polo_quote_intro_1: "ท่านจะได้ยินด้วยตนเอง และมันจะ ทำให้ท่านเต็มไปด้วยความพิศวงอย่างแน่นอน (...)"
 marco_polo_quote_intro_2: "โลกนี้เปรียบเสมือนผืนผ้าทออันกว้างใหญ่ ทอด้วยเส้นด้ายแห่งวัฒนธรรมและประเพณีที่แตกต่างกัน (...)"
 marco_polo_quote_desc_1: "เราเปลือยกาย เพราะเราไม่ต้องการสิ่งใดในโลกนี้ เพราะเราเกิดมาในโลกนี้อย่างเปลือยเปล่าและไร้เสื้อผ้า ส่วนการไม่อับอายที่จะแสดงอวัยวะของเรานั้น ความจริงคือเราไม่ได้ทำบาปด้วยอวัยวะเหล่านั้น ดังนั้นจึงไม่มีความละอายในอวัยวะเหล่านั้นมากไปกว่าที่ท่านมีเมื่อท่านแสดงมือหรือใบหน้าหรือส่วนอื่นๆ ของร่างกายที่ไม่นำท่านไปสู่บาปทางเนื้อหนัง ในขณะที่ท่านใช้อวัยวะของท่านเพื่อทำบาปและตัณหา ดังนั้นท่านจึงปกปิดมันและละอายในมัน แต่เราไม่ละอายที่จะแสดงมันมากไปกว่าที่เราแสดงนิ้วมือของเรา เพราะเราไม่ได้ทำบาปด้วยมัน (...)"
 marco_polo_quote_desc_2: "และข้ารับรองกับท่านว่าสตรีเพศซื้อขายและทำทุกสิ่งที่จำเป็นสำหรับสามีและครัวเรือนของพวกนาง เพราะบุรุษไม่สนใจสิ่งใดนอกจากการล่าสัตว์ การสงคราม และการเลี้ยงเหยี่ยว พวกเขาดำรงชีวิตด้วยเนื้อ นม และสัตว์ป่า และด้วยหนู ซึ่งมีอยู่มากมายทุกหนแห่ง (...)"
 marco_polo_quote_desc_3: "พวกเขาเป็นนักสู้ที่แข็งแกร่ง ยอดเยี่ยมในด้านความกล้าหาญและความทรหดอดทน ให้ข้าอธิบายว่าเหตุใดพวกเขาจึงสามารถอดทนได้มากกว่าบุรุษอื่นใด บ่อยครั้ง หากจำเป็น พวกเขาจะไปหรืออยู่เป็นเวลาหนึ่งเดือนเต็มโดยไม่มีเสบียง ดื่มเพียงนมม้าและกินสัตว์ป่าที่จับมาได้เอง (...)"
 marco_polo_quote_desc_4: "นี่คือประเพณีแปลกประหลาดอีกอย่างหนึ่งที่ข้าลืมบรรยายไป ท่านอาจถือเป็นข้อเท็จจริงได้ว่า เมื่อมีชายสองคน คนหนึ่งมีบุตรชาย ซึ่งเสียชีวิตเมื่ออายุสี่ขวบ หรือเท่าใดก็ตามที่ท่านจะว่าไป และอีกคนหนึ่งมีบุตรสาว ซึ่งเสียชีวิต เช่นกัน พวกเขาจะจัดการ แต่งงานระหว่างเด็กทั้งสอง (...)"
 marco_polo_quote_desc_5: "มีหุบเขาใหญ่และลึกบางแห่ง ซึ่งไม่สามารถเข้าถึงก้นหุบเขาได้ ด้วยเหตุนี้ ชายผู้ที่ออกค้นหาเพชรจึงนำชิ้นเนื้อติดตัวไปด้วย ซึ่งบางที่สุดเท่าที่จะหาได้ และพวกเขาโยนชิ้นเนื้อเหล่านี้ลงไปที่ก้นหุบเขา เมื่อนกอินทรีเห็นเนื้อถูกโยนลงมา พวกมันก็จะโฉบลงไปคาบเนื้อนั้นขึ้นไปบนยอดเขาหินบางแห่ง ผู้คนไปที่รังของนกอินทรีสีขาวเหล่านั้น ซึ่งมีอยู่มากมาย และในมูลของพวกมัน พวกเขาพบเพชรมากมาย ซึ่งนกได้กลืนเข้าไปขณะกินเนื้อที่ถูกโยนลงไปในหุบเขา (...)"
 marco_polo_quote_desc_6: "มีบ่อน้ำมันแห่งหนึ่ง ซึ่งบังเกิดน้ำมันปริมาณมหาศาลเพียงพอสำหรับบรรทุกอูฐได้หลายตัว ประโยชน์ของมันมิได้ใช้เพื่อการบริโภค หาก แต่ใช้เป็นยาทาสำหรับเยียวยาโรคผิวหนังในมนุษย์และปศุสัตว์ ตลอดจนอาการป่วยอื่นๆ อีกทั้งยังเหมาะสำหรับเป็นเชื้อเพลิง ในดินแดนโดยรอบนั้น มิมีการใช้น้ำมันอื่นใดในตะเกียงของพวกเขา และผู้คนจากแดนไกลต่างเดินทางมาเพื่อเสาะหาน้ำมันนี้"
 marco_polo_quote_desc_7: "หากมีผู้ตั้งคำถามว่าพลเมืองของแว่นแคว้นนี้สามารถจัดหาผู้คนจำนวนเพียงพอสำหรับภาระหน้าที่เหล่านี้ได้อย่างไร และด้วยวิธีใดที่พวกเขาจะได้รับการค้ำจุน เราอาจตอบได้ว่า บรรดาผู้บูชารูปเคารพทั้งปวงนั้น ต่างมีภริยาหก แปด หรือสิบคน ตาม แต่สถานภาพของตน อันเป็นเหตุให้พวกเขามีบุตรธิดาจำนวนมากมายมหาศาล บางคนมีบุตรชายมากถึงสามสิบคนที่สามารถสืบทอดหน้าที่การรบต่อจากบิดาได้"
 marco_polo_quote_end_1: "ข้าพูดแล้วพูดอีก แต่ผู้ฟังจดจำได้เพียงคำที่เขาคาดหวัง ไม่ใช่เสียงที่บัญชาเรื่องราว แต่เป็นหูต่างหาก"
 marco_polo_quote_end_2: "เพราะ ไม่ว่าข้าจะเล่าอย่างไร ท่านก็คงไม่พอใจว่าข้ายังคงอยู่ในขอบเขตของความจริงและเหตุผล"

