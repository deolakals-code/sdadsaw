 # GovernorChitChat
 chariot_governor_chitchat_1: "ชื่นชมความยิ่งใหญ่ของการแข่งรถม้าเถิด สหายผู้ว่าการของข้า ฮิปโปโดรมคือที่ที่จิตวิญญาณแห่งไบแซนไทน์มีชีวิตชีวาอย่างแท้จริง!"
 chariot_governor_chitchat_2: "ในเสียงโห่ร้องดังกึกก้องของฝูงชนและเสียงกีบม้าที่ดังสนั่น เราพบหัวใจของจักรวรรดิอันยิ่งใหญ่ของเรา ท่านเห็นด้วยหรือไม่?"
 chariot_governor_chitchat_3: "การแข่งขันเหล่านี้ไม่ใช่แค่การแสดง แต่เป็นเครื่องพิสูจน์ถึงความสามัคคีและความแข็งแกร่งของประชาชนของเรา เป็นเครื่องเตือนใจว่าแม้ในการแข่งขัน เราก็ยืนหยัดเป็นหนึ่งเดียว"
 chariot_governor_chitchat_4: "ดูสีสันสดใสของฝ่ายที่แข่งขันกันสิ ช่างเป็นภาพที่งดงามสะท้อนความหลากหลายและความร่ำรวยของจักรวรรดิอันเป็นที่รักของเรา"
 chariot_governor_chitchat_5: "ในฐานะผู้ว่าการ เราคือผู้พิทักษ์ประเพณี การแข่งรถม้าในฮิปโปโดรมเป็นสายใยที่ไม่ขาดสายเชื่อมโยงปัจจุบันของเราเข้ากับอดีตอันรุ่งโรจน์"
 chariot_governor_chitchat_6: "ดูสิว่าเสียงเชียร์และเสียงโห่ร้องดังก้องผ่านยุคสมัยอย่างไร สะท้อนเสียงของจักรพรรดิที่ล่วงลับไปนานแล้ว ฮิปโปโดรมคือมรดกร่วมกันของเรา"
 chariot_governor_chitchat_7: "ในสนามประลอง ที่ ซึ่งทักษะและกลยุทธ์มาบรรจบกัน สะท้อนให้เห็นถึงหน้าที่การบริหารของเรา เราต้องนำทางผ่านอุปสรรคด้วยความแม่นยำ เช่นเดียวกับนักขับรถม้าเหล่านี้"
 chariot_governor_chitchat_8: "เป็นสักขีพยานในความกระตือรือร้นของผู้คนขณะที่พวกเขารวมตัวกันสนับสนุนนักขับรถม้าคนโปรด เป็นเครื่องเตือนใจว่าการปกครองก็เหมือนกับการแข่งรถ เป็นการเต้นรำไปกับความรู้สึกของสาธารณชน"
 chariot_governor_chitchat_9: "ฮิปโปโดรมกระซิบเรื่องราวแห่งชัยชนะและความพ่ายแพ้ เตือนเราว่าความสำเร็จต้องอาศัยทั้งกลยุทธ์และการปรับตัว เช่นเดียวกับหน้าที่ของเราเอง"
 chariot_governor_chitchat_10: "ขอให้เราพักผ่อนจากหน้าที่สักครู่เถิด สหายข้า และเพลิดเพลินกับการแสดงอันน่าตื่นตาตื่นใจของฮิปโปโดรม ท้ายที่สุด แม้ แต่ผู้ว่าการก็สมควรได้รับช่วงเวลาแห่งการพักผ่อนหย่อนใจบ้าง"

 # ChariotComeback
 chariot_comeback_fallback: "ทะยานจากอันดับสุดท้ายขึ้นมาท้าทายผู้นำ"
 chariot_comeback_blazing: "พุ่งแซงคู่แข่งจากท้ายแถวขึ้นมาเผชิญหน้ากับผู้นำ"
 chariot_comeback_sprinting: "วิ่งทะยานไปข้างหน้าจากท้ายสุด ไล่ตามผู้นำอย่างรวดเร็ว"
 chariot_comeback_surging: "พุ่งขึ้นมาจากด้านหลัง เข้าปะทะกับนักขับรถม้าชั้นนำอย่างกล้าหาญ"
 chariot_comeback_dashing: "พุ่งไปข้างหน้าจากอันดับสุดท้าย เข้าปะทะกับผู้นำอย่างรวดเร็ว"
 chariot_comeback_rocketing: "พุ่งทะยานจากท้ายแถวเพื่อท้าทายนักแข่งชั้นนำโดยตรง"
 chariot_comeback_bursting: "ระเบิดพลังจากท้ายสุด ไล่ตามผู้นำอย่างดุดัน"
 chariot_comeback_miracle: "กระโดดขึ้นมาอย่างปาฏิหาริย์จากอันดับสุดท้ายเพื่อแข่งขันกับผู้นำโดยตรง"
 chariot_comeback_rallying: "ตีตื้นขึ้นมาจากท้ายแถว เข้าใกล้ผู้เข้าแข่งขันชั้นนำอย่างอาจหาญ"
 chariot_comeback_soaring: "ทะยานขึ้นมาจากท้ายขบวนเพื่อเผชิญหน้ากับผู้นำอย่างกล้าหาญ"
 chariot_comeback_propelling: "ขับเคลื่อนจากท้ายสุด แข่งขันกับนักขับรถม้าชั้นนำอย่างมุ่งมั่น"

