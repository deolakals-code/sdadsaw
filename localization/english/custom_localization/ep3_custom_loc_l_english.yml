 BLUE_VENETOI_GLOSS: "#bold เวเนตอย#! (เวเนทอย) ชื่อเรียกในยุคนั้นของฝ่าย "สีน้ำเงิน" ถือเป็นหนึ่งในทีมที่มีชื่อเสียงที่สุดที่แข่งขันในฮิปโปโดรมแห่งคอนสแตนติโนเปิล และเชื่อกันว่ามีความเกี่ยวข้องกับชนชั้นสูง นักขับรถม้าศึกผู้โด่งดัง พอร์ฟิเรียส (Porphyrius) เป็นสมาชิกที่ได้รับการยกย่องของฝ่ายน้ำเงิน แม้ว่าเขาจะเปลี่ยนไปสังกัดฝ่ายเขียวในช่วงสั้นๆ ระหว่างเหตุการณ์จลาจลนิกา (Nika Riots)"
 GREEN_PRASINOI_GLOSS: "#bold พราซินอย#! (ปราซินอย) ชื่อเรียกในยุคนั้นของฝ่าย "สีเขียว" ถือเป็นฝ่ายของประชาชน ในศตวรรษที่ 6 ฝ่ายเขียวได้สังหารสมาชิกฝ่ายน้ำเงินเกือบ 3,000 คนในอัฒจันทร์ของคอนสแตนติโนเปิล"
 WHITE_LEUKOI_GLOSS: "#bold ลิวคอย#! (ลิวคอย) ชื่อเรียกในยุคนั้นของฝ่าย "สีขาว" ในอดีตถูกบดบังรัศมีโดยฝ่ายน้ำเงินและฝ่ายเขียว แต่ก็ไม่ได้ไร้ความสำคัญ แต่อย่างใด ในยุคของเรา พวกเขาได้ถูกรวมเข้ากับฝ่ายน้ำเงินแล้ว"
 RED_RHOUSIOI_GLOSS: "#bold รูซิออย#! (รูซิออย) ชื่อเรียกในยุคนั้นของฝ่าย "สีแดง" ในอดีตถูกบดบังรัศมีโดยฝ่ายน้ำเงินและฝ่ายเขียว แต่ก็ไม่ได้ไร้ความสำคัญ แต่อย่างใด ในยุคของเรา พวกเขาได้ถูกรวมเข้ากับฝ่ายเขียวแล้ว"

