l_english: 
 miracle_reclusive:0 "ใช้ชีวิตอยู่บนยอดเสาตลอดชีวิตของ [ROOT.Char.GetHerHis]"
 miracle_irritable:0 "สังหารมังกรด้วยรองเท้าของ [ROOT.Char.GetHerHis] เพราะมารบกวนการนอนของ [ROOT.Char.GetHerHis]"
 miracle_inappetetic:0 "กินเพียงผลไม้ป่าตลอดชีวิตของ [ROOT.Char.GetHerHis]"
 miracle_drunkard:0 "เปลี่ยนไวน์ที่ [ROOT.Char.GetSheHe] ดื่มให้กลายเป็นน้ำ"
 miracle_contrite:0 "สารภาพบาปทั้งปวงของ [ROOT.Char.GetHerHis] ต่อหน้าฝูงชน"
 miracle_flagellant:0 "ขับไล่ [ROOT.Char.GetFaith.DevilName] ด้วยแส้"
 miracle_improvident:0 "อาศัยอยู่ในถังหลังจากบริจาคทรัพย์สินทั้งหมดของ [ROOT.Char.GetHerHis] แก่คนยากจน"
 miracle_lunatic:0 "ขว้างถั่วใส่สตรี"
 miracle_possessed:0 "ทำนายถึงวันสิ้นโลก"
 miracle_disfigured:0 "ได้รับแผลเป็นอันน่าสะพรึงกลัวจากการต่อสู้ของ [ROOT.Char.GetHerHis] กับ [ROOT.Char.GetFaith.DevilName]"
 miracle_eunuch:0 "ระงับกามราคะอันพลุ่งพล่านของผู้อื่นด้วยรัศมีศักดิ์สิทธิ์ของ [ROOT.Char.GetHerHis]"
 miracle_blind:0 "อ่านคัมภีร์ศักดิ์สิทธิ์ได้แม้ดวงตาของ [ROOT.Char.GetHerHis] จะบอดสนิท"
 miracle_herculean:0 "ต่อย [ROOT.Char.GetFaith.DevilName] อย่างแรงโทษฐานที่มายั่วยวน [ROOT.Char.GetHerHim]"
 miracle_spindly:0 "ไม่แก่ชราลงเลย"
 miracle_chaste:0 "อาบน้ำอย่างบริสุทธิ์ร่วมกับ [ROOT.Char.GetWomenMen] อื่น"
 miracle_garlic:0 "กินกระเทียมโดยไม่มีกลิ่น"
 miracle_birds:0 "เทศนาสั่งสอนฝูงนก"
