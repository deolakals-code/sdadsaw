 #GROUPS
 culture_group_military:0 "การทหาร"
 culture_group_civic:0 "พลเรือน"
 culture_group_regional:1 "วัฒนธรรมและภูมิภาค"
 culture_group_any:0 "ใด ๆ"
 #ERAS
 culture_era_tribal:0 "ยุคชนเผ่า"
 culture_era_tribal_desc:0 "ยุคชนเผ่าของ [culture|E] เป็นยุคสมัยก่อนการเกิดขึ้นของกฎหมายที่บัญญัติเป็นลายลักษณ์อักษรและการปกครองที่มีสถาบันรองรับ ผู้ปกครองที่มี [tribal_government|E] และ [nomadic_government|E] สามารถใช้ประโยชน์ได้เฉพาะ [innovations|E] ในยุคชนเผ่าเท่านั้น"
 culture_era_early_medieval:0 "ยุคกลางตอนต้น"
 culture_era_early_medieval_desc:0 "ยุคกลางตอนต้นเห็นการเกิดขึ้นของนักปกครองมืออาชีพและ [innovations|E] ที่สำคัญจำนวนหนึ่ง ทำให้ [culture|E] สามารถหลุดพ้นจากยุคมืดได้"
 culture_era_high_medieval:0 "ยุคกลางตอนสูง"
 culture_era_high_medieval_desc:0 "ยุคกลางตอนสูงเป็นช่วงเวลาแห่งความก้าวหน้าทางเทคโนโลยีและการบริหารที่ยิ่งใหญ่ เห็นเมืองเล็กเติบโตเป็นเมืองใหญ่ และการเกิดขึ้นของชนชั้นกลางชาวเมือง แม้ว่าชนชั้นสูงจะยังคงครองอำนาจสูงสุดก็ตาม"
 culture_era_late_medieval:0 "ยุคกลางตอนปลาย"
 culture_era_late_medieval_desc:0 "ยุคกลางตอนปลายถือเป็นจุดสูงสุดของโลกศักดินา ข้าราชการ ช่างฝีมือ พ่อค้า และผู้ให้กู้ยืมเงินเริ่มรุกล้ำอำนาจของชนชั้นอภิสิทธิ์เก่า ยกเว้นเพียงกษัตริย์เท่านั้น"
