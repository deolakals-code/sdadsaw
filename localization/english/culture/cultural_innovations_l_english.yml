#####################

 #Military
 innovation_hoardings:0 "เชิงเทินไม้"
 innovation_hoardings_desc:0 "ติดตั้งอยู่บนยอดใบสอของเรา โครงสร้างไม้เหล่านี้ยื่นออกไปเหนือฐานกำแพงปราสาทของเรา\n\nมันช่วยให้ผู้ป้องกันของเรายิงธนู ทิ้งหิน หรือเทน้ำมันเดือดใส่ผู้โจมตีได้ ในขณะที่ยังคงได้รับการปกป้องอย่างสมบูรณ์จากพลธนูข้าศึก"

 innovation_trebuchet:0 "เทรบูเชต"
 innovation_trebuchet_desc:0 "สิ่งมหัศจรรย์ทางวิศวกรรม เทรบูเชตที่ใช้ตุ้มน้ำหนักถ่วงสามารถเหวี่ยงกระสุนหนักได้ไกลกว่าเครื่องยิงในยุคก่อนหน้าใด ๆ"

 innovation_trebuchet_chinese: "หอคอยเคลื่อนที่"
 innovation_trebuchet_chinese_desc: "เพื่อพิชิตหอคอยหินของศัตรู หอคอยไม้สูงติดล้อเหล่านี้จะถูกผลักเข้าไปประชิด ทำให้ทหารสามารถเข้าถึงกำแพงศัตรูโดยมีความปลอดภัยในระดับหนึ่ง"

 innovation_castle_baileys:0 "ลานปราสาท"
 innovation_castle_baileys_desc:0 "ในขณะที่หอรบทำหน้าที่เป็นหัวใจของปราสาท แต่ก็ยังห่างไกลจากการเป็นอาคารสำคัญเพียงแห่งเดียว การสร้างอาคาร เช่นคอกม้าและคลังอาวุธในลานปราสาทที่มีการป้องกัน จะช่วยให้แน่ใจว่าเราสามารถจัดกองรักษาการณ์และจัดเตรียมอาวุธให้ไพร่พลของเราได้อย่างเหมาะสมไม่ว่าในสถานการณ์ใด"
 
 innovation_men-at-arms:0 "ทหารอาชีพ"
 innovation_men-at-arms_desc:0 "ผู้ที่เชี่ยวชาญด้านม้าและทวนยาวจะเป็นที่ต้องการเสมอ แต่ก็ไม่ได้มีอยู่เสมอไป การจ้างกลุ่มทหารอาชีพไว้เป็นประจำ จะช่วยให้แน่ใจว่าเราจะไม่ขาดนักรบที่มีประสบการณ์เมื่อสงครามปะทุขึ้นอย่างหลีกเลี่ยงไม่ได้"

 innovation_knighthood:0 "ตำแหน่งอัศวิน"
 innovation_knighthood_desc:0 "การพระราชทานตำแหน่งอัศวินแก่นักรบที่ดีที่สุดของเราและจ่ายค่าตอบแทนพวกเขาด้วยที่ดินถือครองแทนที่จะเป็นเพียงเหรียญกษาปณ์ จะ ทำให้เรามอบเกียรติที่พวกเขาสมควรได้รับ รวมถึงประกันความภักดีที่พวกเขามีต่อเรา"

 innovation_advanced_bowmaking:0 "การทำคันธนูขั้นสูง"
 innovation_advanced_bowmaking_desc:0 "ในขณะที่พลธนูตามประเพณีแล้วจะทำและบำรุงรักษาคันธนูของตนเอง ช่างฝีมือได้เริ่มทำคันธนูประเภทใหม่ ซึ่งแข็งแรงและซับซ้อนกว่าเดิม การยอมรับการออกแบบใหม่เหล่านี้จะ ทำให้เราสามารถเปลี่ยนช่างทำคันธนูผู้เชี่ยวชาญเหล่านี้ให้กลายเป็นทรัพย์สินทางทหารอันประเมินค่ามิได้"
 unlock_maa_crossbowmen: "สามารถเกณฑ์ [GetMaA('crossbowmen').GetName] เป็น [men_at_arms|E] ได้"
 eligible_accolade_crossbower_attribute_ACCOLADES_DLC:0 "[knights|E] ของ [culture|E] นี้จะมีสิทธิ์ได้รับ [accolades|E] ประเภท [GetAccoladeType('crossbowmen_attribute').GetName]"
 eligible_accolade_crossbower_attribute:1 "[AddLocalizationIf( HasDlcFeature( 'accolades' ), 'eligible_accolade_crossbower_attribute_ACCOLADES_DLC')]"

 #Civic

 innovation_heraldry:0 "มุทราศาสตร์"
 innovation_heraldry_desc:0 "การจัดตั้งการออกแบบที่สืบทอดทางสายเลือดเพื่อระบุตระกูลขุนนางของเรา จะ ทำให้สมาชิกของพวกเขาเห็นว่าตนเองเป็นส่วนหนึ่งของภาพรวมที่ใหญ่กว่า กระตุ้นให้พวกเขาปรับปรุงชื่อเสียงของราชวงศ์แทนที่จะหมกมุ่นอยู่กับสถานะส่วนตัวเพียงอย่างเดียว"

 innovation_windmills:0 "กังหันลม"
 innovation_windmills_desc:0 "การประดิษฐ์กังหันลมแนวตั้งช่วยให้เราควบคุมพลังงานลมได้อย่างมีประสิทธิภาพมากขึ้นกว่าเดิม ลดแรงงานที่จำเป็นในการบดเมล็ดธัญพืชและแปรรูปวัตถุดิบลงอย่างมาก"

 innovation_divine_right:0 "เทวสิทธิ์"
 innovation_divine_right_desc:0 "ถึงเวลาแล้วที่เราจะยอมรับว่าเป็นเจตจำนงแห่งสวรรค์ที่ได้วางผู้ปกครองของเราไว้บนบัลลังก์ของพวกเขา และการต่อต้านพวกเขาก็คือการต่อต้านสิ่งศักดิ์สิทธิ์นั่นเอง"

 innovation_land_grants:0 "การมอบที่ดิน"
 innovation_land_grants_desc:0 "ที่ดินเป็นรางวัลที่มีค่าที่สุดที่เราสามารถมอบให้กับข้าราชบริพารของเราได้ แต่มีเพียงส่วนน้อยที่เราเป็นเจ้าของโดยตรง อย่างไรก็ตาม หากเราอนุญาตให้พวกเขาเริ่มทำฟาร์มบนที่ดินรกร้างผืนนั้น... ใครจะคัดค้าน? แม้ว่าจะเกิดความขัดแย้งขึ้น เราก็จะอยู่ในฐานะที่ถูกต้องอย่างชัดเจนเมื่อเราปกป้องข้าราชบริพารของเรา!"

 innovation_scutage:0 "สคิวเทจ"
 innovation_scutage_desc:0 "การรับราชการทหารเป็นสิ่งที่คาดหวังจากข้าราชบริพารของเรามาโดยตลอด แต่มีบางคนที่ไม่สามารถหรือไม่เต็มใจที่จะให้ได้ การเสนอหนทางให้พวกเขาปฏิบัติตามพันธะด้วยเหรียญกษาปณ์แทนเหล็กกล้า จะช่วยให้แน่ใจว่าเราได้รับส่วนที่พึงได้จากทุกคน"

 innovation_guilds:0 "สมาคมช่างฝีมือ"
 innovation_guilds_desc:0 "เมื่อดินแดนของเราขยายตัว การจัดการการค้าทั้งหมดที่เกิดขึ้นภายในอาณาเขตของเราโดยตรงก็มีประสิทธิภาพน้อยลงเรื่อย ๆ การมอบกฎบัตรสมาคมให้กับองค์กรของพ่อค้าและช่างฝีมือ จะ ทำให้พวกเขามีอิสระในการดำเนินธุรกิจมากขึ้น ในขณะที่ยังคงรับประกันว่าเราจะได้กำไรจากกิจการของพวกเขา"

 innovation_development_03:0 "ความเป็นเมือง"
 innovation_development_03_desc:0 "มหานครแห่งโรม ไบแซนทิอุม และเดลี ยืนหยัดมายาวนานในฐานะสิ่งตกทอดจากมรดกอันยิ่งใหญ่ที่ไม่มีใครเทียบได้ เมื่อโครงสร้างพื้นฐานและประชากรของเราเติบโตขึ้น ในที่สุดเราก็มีหนทางที่จะพัฒนาชุมชนใหม่ ๆ ที่สามารถแข่งขันกับศูนย์กลางเมืองโบราณเหล่านี้ได้"

 innovation_currency_03:0 "การธนาคาร"
 innovation_currency_03_desc:0 "การค้าขนาดใหญ่หรือมีราคาสูงโดยเฉพาะมักต้องใช้เหรียญกษาปณ์หนักจำนวนมากที่เทอะทะ การฝากทรัพย์สมบัตินั้นไว้ในคลังที่ปลอดภัยและการโอนกรรมสิทธิ์โดยไม่ต้องเคลื่อนย้ายเหรียญจริง จะช่วยให้สินค้าจำนวนมากสามารถซื้อขายได้ง่ายขึ้น"

 #Regional

 innovation_east_settling:0 "ออสซีดลุง"
 innovation_east_settling_desc:0 "ดินแดนทางตะวันออกของเรามีผู้คนอาศัยอยู่อย่างเบาบาง แต่อุดมไปด้วยทรัพยากรธรรมชาติ การริเริ่มขยายและจัดตั้งที่ดินทำกินพร้อมบ้านที่นั่นจะนำไปสู่การเติบโตและความเจริญรุ่งเรืองของประชาชนของเรา"

 innovation_seigneurialism:0 "ระบบเจ้าขุนมูลนาย"
 innovation_seigneurialism_desc:0 "การมอบหมายความรับผิดชอบมากขึ้นให้กับขุนนางท้องถิ่น จะ ทำให้พวกเขามีความสุขและ ทำให้เรามีเวลามากขึ้นในการมุ่งเน้นไปที่อาณาเขตของเราเอง"

 innovation_muladi:0 "มูลดี"
 innovation_muladi_desc:0 "สงคราม การปล้นสะดม และการกดขี่ข่มเหงทั่วโลกได้ขับไล่ผู้คนจำนวนมากออกจากบ้านเกิด การต้อนรับผู้พลัดถิ่นเหล่านี้สู่ดินแดนของเราโดยไม่คำนึงถึงภูมิหลังของพวกเขา จะ ทำให้เราสามารถพัฒนาสังคมที่ร่ำรวยและเจริญรุ่งเรืองได้"

 innovation_french_peerage:0 "บรรดาศักดิ์ขุนนาง"
 innovation_french_peerage_desc:0 "การยอมรับอย่างชอบธรรมต่อขุนนางข้าหลวงที่โดดเด่นที่สุดในอาณาจักรของเรา จะเป็นการส่งเสริมความรู้สึกภักดีต่อราชบัลลังก์ให้มากขึ้น"

#####################
# Late Medieval Era #
##################### 
 
 #Military
 innovation_machicolations:0 "ช่องเชิงเทิน"
 innovation_machicolations_desc:0 "การปรับปรุงที่โดดเด่นจากเชิงเทินไม้ก่อนหน้าของเรา ช่องเชิงเทินหินทำหน้าที่เดียวกัน ในขณะที่ทนทานกว่าอย่างมีนัยสำคัญและให้การป้องกันแก่ผู้ป้องกันของเรามากขึ้น"

 innovation_gunpowder: "ดินปืน"
 innovation_gunpowder_desc: "การพัฒนาผงระเบิดได้ก่อให้เกิดอาวุธสายพันธุ์ใหม่ และนักรบประเภทใหม่เพื่อใช้งานพวกมัน การนำปืนที่ทรงอานุภาพเหล่านี้เข้าสู่สนามรบ จำต้องมีสายการผลิตและห่วงโซ่อุปทาน ซึ่งไม่เคยมีความจำเป็นมาก่อนในอดีต ทว่าต้นทุนของสิ่งเหล่านี้ก็คุ้มค่าด้วยแสนยานุภาพที่ปลดล็อกโดยเทคโนโลยีใหม่นี้"

 innovation_royal_armory:0 "คลังแสงหลวง"
 innovation_royal_armory_desc:0 "เมื่อขนาดกองทัพของเราเพิ่มขึ้น เราต้องรับประกันว่าทหาร แต่ละคนจะได้รับการติดอาวุธและสวมเกราะอย่างเหมาะสม การจัดตั้งคลังแสงหลวงเพื่อผลิตและเก็บรักษาอุปกรณ์ทั้งหมดของกองทัพจะช่วยตอบสนองความต้องการนี้ได้อย่างมาก"

 innovation_standing_armies:0 "กองทัพประจำการ"
 innovation_standing_armies_desc:0 "การเกณฑ์ทหาร ทำให้เรามีทหารจำนวนมาก แต่ไม่ว่าเราจะพยายามฝึกฝนและจัดเตรียมอาวุธให้พวกเขาดีเพียงใด พวกเขาก็ยังด้อยกว่าทหารอาชีพเสมอ การจัดตั้งกองทัพประจำการขนาดใหญ่จะช่วยให้แน่ใจว่าผลประโยชน์ของอาณาจักรเราได้รับการคุ้มครองโดยนักรบที่ดีที่สุด"

 innovation_sappers:0 "ทหารช่าง"
 innovation_sappers_desc:0 "ไม่สำคัญว่ากำแพงข้าศึกจะแข็งแกร่งเพียงใดหากพื้นดินใต้นั้นสามารถขุดทะลุได้ การจ้างทหารช่างเพื่อขุดอุโมงค์ใต้ป้อมปราการข้าศึกเป็นวิธีที่มีประสิทธิภาพในการทลายแม้กระทั่งแนวป้องกันที่แข็งแกร่งที่สุด"

 innovation_plate_armor:0 "เกราะแผ่น"
 innovation_plate_armor_desc:0 "รูปแบบขั้นสูงสุดของการป้องกันส่วนบุคคล ชุดเกราะแผ่นที่สร้างขึ้นอย่างดีมีข้อต่อที่ขยับได้ ซึ่งให้ช่วงการเคลื่อนไหวที่เหนือกว่าเกราะรุ่นก่อน ๆ ในขณะที่แทบจะไม่สามารถเจาะทะลุได้ด้วยอาวุธของศัตรู"

 #Civic

 innovation_primogeniture:0 "สิทธิบุตรหัวปี"
 innovation_primogeniture_desc:0 "หนึ่งอาณาจักร หนึ่งทายาท แม้ว่าพระโอรสธิดาองค์รอง ๆ ของกษัตริย์อาจรู้สึกถูกทอดทิ้งจากการถูกปฏิเสธมรดก แต่นี่เป็นวิธีที่ดีที่สุด เพื่อให้แน่ใจว่าเราจะรักษาอาณาจักรที่มั่นคง ซึ่งไม่ถูกฉีกออกเป็นเสี่ยง ๆ ด้วยวิกฤตการณ์สืบทอดราชสมบัติ"

 innovation_cranes:0 "ปั้นจั่น"
 innovation_cranes_desc:0 "สิ่งมหัศจรรย์ทางวิศวกรรมที่ถูกลืม ชาวโรมันใช้ปั้นจั่นแบบใช้แรงคนถีบอย่างมีประสิทธิภาพในการสร้างจักรวรรดิของพวกเขา และเราก็จะทำ เช่นนั้นด้วย"

 innovation_noblesse_oblige:0 "พันธะแห่งขุนนาง"
 innovation_noblesse_oblige_desc:0 "ความเป็นขุนนางเป็นมากกว่าสิทธิพิเศษและสิทธิ์ มันมาพร้อมกับหน้าที่ต่ออาณาจักร พันธะที่จะต้องกระทำในลักษณะที่เหมาะสมและยุติธรรม การกำหนดสิ่งที่คาดหวังจากชนชั้นสูงของเราอย่างชัดเจน จะ ทำให้เรามีอุดมคติที่จะยึดถือและนำเรามารวมกัน ในขณะที่เราทำงานเพื่อบรรลุเป้าหมายนั้น"

 innovation_rightful_ownership:0 "กรรมสิทธิ์อันชอบธรรม"
 innovation_rightful_ownership_desc:0 "เป็นเทวสิทธิ์ของเราที่จะครอบครองดินแดนตามนิตินัยของเรา และถึงเวลาแล้วที่โลกจะยอมรับความจริงข้อนี้ เราจะไม่ถูกฉุดรั้งด้วยพิธีการและมารยาทที่ล้าสมัยอีกต่อไป"

 innovation_ermine_cloaks:0 "เสื้อคลุมขนเออร์มิน"
 innovation_ermine_cloaks_desc:0 "ใคร ๆ ก็อาจอ้างสิทธิ์ในตำแหน่งได้ แต่การที่จะเป็นกษัตริย์ที่แท้จริง พวกเขาต้องสร้างความยำเกรงและความสง่างามในหมู่ข้าราชบริพาร เสื้อคลุมขนเออร์มินใหม่ของเราเป็นรูปแบบของเครื่องทรงกษัตริย์ ซึ่งแน่นอนว่าจะบรรลุเป้าหมายนั้นได้"

 innovation_ermine_cloaks_ermine: "เสื้อคลุมขนเออร์มิน"
 innovation_ermine_cloaks_ermine_desc: "ผู้ใดก็อาจอ้างสิทธิ์ในบรรดาศักดิ์ได้ แต่การที่จะเป็นองค์กษัตริย์อย่างแท้จริงนั้นจำต้องสร้างความน่าเกรงขามและความสูงส่งในหมู่ไพร่ฟ้าข้าแผ่นดิน เสื้อคลุมขนเออร์มินใหม่ของเราคือเครื่องทรงอันสง่างามรูปแบบหนึ่ง ซึ่งจะบรรลุจุดประสงค์นั้นได้อย่างแน่นอน"

 innovation_court_officials:0 "ข้าราชสำนัก"
 innovation_court_officials_desc:0 "อาณาจักรของเราได้ขยายตัวจนถึงจุดที่แม้ แต่ขุนนางเล็ก ๆ ก็ไม่สามารถบริหารทุกอย่างได้อย่างมีประสิทธิภาพ การ แต่งตั้งข้าราชสำนักและข้าราชการเพื่อจัดการงานราชสำนักที่น่าเบื่อกว่า จะช่วยให้แน่ใจว่ากลไกการปกครองยังคงดำเนินต่อไปอย่างราบรื่น"

 innovation_development_04:0 "แนวคิดเรอเนซองส์"
 innovation_development_04_desc:0 "การพัฒนาทางวิทยาศาสตร์ ปรัชญา และตรรกะ ได้เปลี่ยนเมืองของเราให้กลายเป็นศูนย์กลางการศึกษาและนวัตกรรมอันน่าอัศจรรย์ การก้าวกระโดดทางเทคโนโลยีและวัฒนธรรมครั้งใหญ่ที่เรากำลังทำอยู่นี้ได้นำศักยภาพที่ไม่เคยฝันถึงมาก่อนมาอยู่ในมือเรา"

 innovation_currency_04:0 "ตั๋วสัญญาใช้เงิน"
 innovation_currency_04_desc:0 "วิวัฒนาการของระบบธนาคารก่อนหน้านี้ ตั๋วสัญญาใช้เงินกระดาษช่วยให้พลเมืองของเราสามารถซื้อขายสินค้าและบริการข้ามระยะทางไกลได้อย่างรวดเร็วและปลอดภัยโดยไม่ต้องถูกถ่วงด้วยน้ำหนักของเหรียญกษาปณ์หนัก ๆ"

 #Regional

 innovation_wierdijks:0 "เวียร์ไดก์"
 innovation_wierdijks_desc:0 "การสร้างเขื่อนที่แข็งแรงและเชื่อถือได้เป็นงานที่จำเป็นหากเราต้องการอาศัยและเจริญรุ่งเรืองในกลุ่มประเทศต่ำ เทคนิคใหม่ในการเสริมความแข็งแรงของเขื่อนดินด้วยเสื่อสาหร่ายจะเพิ่มความแข็งแรงและความทนทาน"

 innovation_condottieri:0 "คอนดอตติเอรี"
 innovation_condottieri_desc:0 "เนื่องจากทั้งร่ำรวยและตั้งอยู่ใจกลาง อิตาลีจึงกลายเป็นศูนย์กลางสำคัญสำหรับกองร้อยทหารรับจ้างที่จะเดินทางมาเมื่อไม่ได้อยู่ในระหว่างการทัพ เนื่องจากพวกเขาอยู่ที่นี่แล้ว เราควรจะสามารถต่อรองราคาที่ดีกว่าที่พวกเขาจะเรียกเก็บตามปกติได้"

 innovation_deccan_unity:0 "เอกภาพแห่งเดคคาน"
 innovation_deccan_unity_desc:0 "การหลั่งไหลเข้ามาของความเชื่อและศาสนาใหม่ ๆ สู่สังคมของเรา ทำให้เห็นได้ชัดว่าการมุ่งเน้นไปที่ภูมิภาคนิยมในอดีตของเราเป็นความผิดพลาด เราควรรวมกลุ่มกับผู้อื่นที่มีศรัทธาเดียวกันและสร้างรัฐที่เข้มแข็งและยั่งยืน ซึ่งสามารถยืนหยัดต่อแรงกดดันจากภายนอกได้"

 students_of_knighthood:1 "เด็กที่สำเร็จ [education|E] ด้วย [education_focus|E] เชิง [martial|E] จะได้รับ [trait|E] $trait_education_martial_prowess$"

 # Sponsor Research Related
 fp3_innovation_mural_sextant: "เซกซ์แทนต์ติดผนัง"
 fp3_innovation_mural_sextant_desc: "เครื่องมือติดผนังขนาดใหญ่เหล่านี้สามารถใช้อ่านและวัดตำแหน่งของวัตถุท้องฟ้าได้อย่างแม่นยำ"

 fp3_innovation_fritware: "ฟริตแวร์"
 fp3_innovation_fritware_desc: "เครื่องปั้นดินเผาเนื้อหินสวยงามเลียนแบบเครื่องลายครามตะวันออก โดยผสมวัสดุอย่างควอตซ์หรือแก้วเข้าไป เป็นสินค้าล้ำค่า หรือของขวัญอันน่าประทับใจ"
 fp3_innovation_fritware_tooltip: "ได้รับ [opinion|E] จาก [send_gift|E]: #P +20%#!"

