 #Military 
 innovation_battlements:0 "ใบสอ"
 innovation_battlements_desc:0 "นอกเหนือจากการเสริมความแข็งแกร่งให้แก่หอรบแล้ว การสร้างกำแพงชั้นนอกที่ทนทาน ซึ่งพลธนูของเราสามารถประจำการได้อย่างปลอดภัย จะช่วยเพิ่มการป้องกันอีกชั้นให้แก่ปราสาทของเราจากการโจมตี"

 innovation_mangonel:0 "แมงโกเนล"
 innovation_mangonel_desc:0 "การปรับปรุงที่สำคัญต่อการออกแบบเครื่องดีดหินที่มีอยู่ของเรา แมงโกเนลที่ขับเคลื่อนด้วยแรงดึงนั้นบรรจุและยิงได้เร็วกว่าเครื่องจักรที่ขับเคลื่อนด้วยแรงบิดมาก"

 innovation_mangonel_chinese: "บันไดเมฆา"
 innovation_mangonel_chinese_desc: "บันไดโจมตีแบบบานพับที่พับเก็บได้ มักติดตั้งโล่, เครื่องกว้าน, ตะขอเกี่ยว และอุปกรณ์ยกที่ใช้ระบบรอก นอกจากนี้ยังใช้เป็นจุดสังเกตการณ์บนที่สูงระหว่างการล้อมโจมตีอีกด้วย"
 eligible_accolade_besieger_attribute_ACCOLADES_DLC:0 "[knights|E] ของ [culture|E] นี้จะมีสิทธิ์ได้รับ [accolades|E] ประเภท [GetAccoladeType('besieger_attribute').GetName]"
 eligible_accolade_besieger_attribute:1 "[AddLocalizationIf( HasDlcFeature( 'accolades' ), 'eligible_accolade_besieger_attribute_ACCOLADES_DLC')]"

 innovation_burhs:0 "เบอร์"
 innovation_burhs_desc:0 "กระจายอยู่ทั่วชนบท เบอร์เป็นชุมชนป้อมปราการที่สำคัญที่เราสามารถใช้ทั้งในการรวมพลและทำหน้าที่เป็นศูนย์กลางการบริหาร"

 innovation_burhs_japan: "Suki" # 柵
 innovation_burhs_japan_desc: "นับตั้งแต่การก่อสร้าง #italic มิซุกิ#! ในรัชสมัยของจักรพรรดิเท็นจิ ความสำคัญของป้อมปราการก็ได้รับการประจักษ์คุณค่าอีกครั้ง เราสามารถใช้ศูนย์กลางที่มีป้อมปราการเหล่านี้เพื่อระดมพลและใช้เป็นศูนย์กลางการปกครองได้"

 innovation_burhs_chinese: "Wū Bì" # 塢壁
 innovation_burhs_chinese_desc: "อู ปี้ ซึ่งกระจายอยู่ทั่วชนบท คือชุมชนที่มีป้อมปราการที่สำคัญที่เราสามารถใช้ทั้งเพื่อระดมพลและใช้เป็นศูนย์กลางการปกครอง"

 innovation_burhs_anglo_saxon: "เบิร์ช"
 innovation_burhs_anglo_saxon_desc: "เบิร์ช ซึ่งกระจายอยู่ทั่วชนบท คือชุมชนที่มีป้อมปราการที่สำคัญที่เราสามารถใช้ทั้งเพื่อระดมพลและใช้เป็นศูนย์กลางการปกครอง"

 innovation_burhs_latin: "คาสตรา"
 innovation_burhs_latin_desc: "หลักการสร้างป้อมปราการ แต่โบราณยังคงมีประโยชน์ในปัจจุบัน และเราสามารถใช้ศูนย์กลางที่มีป้อมปราการเหล่านี้เพื่อระดมพลและใช้เป็นศูนย์กลางการปกครองได้"

 innovation_house_soldiers:0 "ทหารประจำตระกูล"
 innovation_house_soldiers_desc:0 "เมื่อตระกูลขุนนางของเราเติบโตในอำนาจ พวกเขาต้องการทหารเพื่อบังคับใช้ความประสงค์ของตน การจัดตั้งหน่วยทหารประจำตระกูลโดยเฉพาะ จะช่วยให้แน่ใจว่าเรามีกองกำลังที่ได้รับการฝึกฝนและติดอาวุธดีกว่าไพร่พลเกณฑ์มาตรฐาน"

 innovation_horseshoes:0 "เกือกม้า"
 innovation_horseshoes_desc:0 "ม้าที่กีบเท้าแตกจะขาเป๋อย่างรวดเร็วและไม่สามารถทำงานหรือขี่เข้าสู่การรบได้ การตอกเกือกม้าด้วยแผ่นทองแดงหรือเหล็ก จะช่วยให้กีบเท้าของพวกมันแข็งแรงและได้รับการปกป้องจากความเสียหาย"

 innovation_arched_saddle:0 "อานม้าทรงโค้ง"
 innovation_arched_saddle_desc:0 "ทหารม้าเบาเป็นกองกำลังที่น่าเกรงขาม แต่พวกเขายังไม่ได้ใช้ศักยภาพของม้าศึกอย่างแท้จริง อานม้าทรงโค้งช่วยให้เราส่งนักรบหุ้มเกราะหนักพร้อมทวนยาวที่ถือแนบลำตัวลงสนาม ซึ่งช่วยให้พวกเขาใช้ประโยชน์จากแรงผลักดันได้อย่างเต็มที่ขณะพุ่งเข้าใส่แนวข้าศึก"
 eligible_accolade_lancer_attribute_ACCOLADES_DLC:0 "[knights|E] ของ [culture|E] นี้จะมีสิทธิ์ได้รับ [accolades|E] ประเภท [GetAccoladeType('lancer_attribute').GetName]"
 eligible_accolade_lancer_attribute:1 "[AddLocalizationIf( HasDlcFeature( 'accolades' ), 'eligible_accolade_lancer_attribute_ACCOLADES_DLC')]"
 unlock_maa_armored_horsemen: "สามารถเกณฑ์ [GetMaA('armored_horsemen').GetName] เป็น [men_at_arms|E] ได้"

 #Civic
 innovation_hereditary_rule:0 "การปกครองแบบสืบสันตติวงศ์"
 innovation_hereditary_rule_desc:0 "การแบ่งอาณาจักรอย่างเท่าเทียมกันในหมู่ทายาทที่มีสิทธิ์ทั้งหมด ทำให้ความเป็นปึกแผ่นของประชาชนเราแตกแยก แทนที่จะฉีกอาณาจักรของเราเป็นชิ้น ๆ ทุกครั้งที่มีการสืบทอดตำแหน่ง เราสามารถสร้างความมั่นใจว่าเราจะมีดินแดนศูนย์กลางที่มั่นคงและเจริญรุ่งเรืองโดยการจัดตั้งระบบการปกครองแบบสืบสันตติวงศ์"

 innovation_manorialism:0 "ระบบแมเนอร์"
 innovation_manorialism_desc:0 "ด้วยการรวมศูนย์การถือครองที่ดินภายใต้ชนชั้นสูงของเรา ชายและหญิงจำนวนมากพบว่าตนเองไม่สามารถทำงานได้ เราจะจัดตั้งระบบแมเนอร์ที่ไพร่สามารถทำงานในที่นาของเราแลกกับค่าเช่า ในขณะที่ผู้ที่ไม่สามารถจ่ายได้อาจเข้ารับใช้เราในฐานะทาสติดที่ดินแทน"

 innovation_royal_prerogative:0 "พระราชอำนาจพิเศษ"
 innovation_royal_prerogative_desc:0 "เนื่องจากราชวงศ์ของเรามีภาระมากขึ้นจากความรับผิดชอบในการปกครองอาณาจักร พวกเขาจึงจะได้รับสิทธิพิเศษที่สงวนไว้สำหรับพวกเขาโดยเฉพาะด้วย เช่นกัน"

 innovation_chronicle_writing:0 "การเขียนพงศาวดาร"
 innovation_chronicle_writing_desc:0 "เรื่องราววีรกรรมของตระกูลเราจะไม่ถูกส่งต่อผ่านเพียงประเพณีมุขปาฐะอีกต่อไป เราจะเก็บบันทึกทุกสิ่งที่เราทำสำเร็จ ทั้งเพื่อสร้างแรงบันดาลใจให้คนรุ่นหลัง และเพื่อพิสูจน์สิทธิ์เรียกร้องของเราเหนือดินแดนที่เราควรจะถือครองอย่างชอบธรรม"

 innovation_armilary_sphere:0 "แบบจำลองทรงกลมท้องฟ้า"
 innovation_armilary_sphere_desc:0 "ประกอบด้วยโครงทรงกลมของวงแหวนที่เคลื่อนที่ได้ อุปกรณ์เหล่านี้ช่วยให้เราทำแผนที่และทำนายการเคลื่อนที่ของสรวงสวรรค์ได้ แม้จะเป็นอุปกรณ์ทางโหราศาสตร์ที่น่าทึ่งในตัวเอง แต่ความรู้นี้ก็จะช่วยเหลือกัปตันของเราในการเดินเรือในน่านน้ำที่ห่างไกลจากแผ่นดินด้วย"

 innovation_baliffs:0 "เจ้าพนักงาน"
 innovation_baliffs_desc:0 "กษัตริย์ไม่สามารถอยู่ทุกที่ได้ในคราวเดียว การ แต่งตั้งเจ้าพนักงานเพื่อบังคับใช้กฎหมายของกษัตริย์ทั่วทั้งอาณาจักร จะช่วยให้เราปกครองพื้นที่ขนาดใหญ่ได้อย่างมีประสิทธิภาพมากกว่าที่เราจะทำได้"

 innovation_baliffs_bailiffs: "เจ้าพนักงานท้องถิ่น"
 innovation_baliffs_bailiffs_desc: "$innovation_baliffs_desc$"

 innovation_baliffs_latin: "โปเตสตัส"
 innovation_baliffs_latin_desc: "ชาวโรมันโบราณนิยามอำนาจของเจ้าหน้าที่ในการสร้าง, บังคับใช้ และตัดสินกฎหมายว่า #italic โปเตสตัส#! ซึ่งเป็นแนวคิดที่ใช้มอบอำนาจแก่ฝ่ายตุลาการเพื่อบังคับใช้กฎหมายทั่วทั้งอาณาจักร ด้วยการมอบ #italic โปเตสตัส#! ให้แก่เจ้าพนักงานท้องถิ่น เราจะสามารถปกครองพื้นที่ที่กว้างใหญ่ขึ้นได้อย่างมีประสิทธิภาพมากกว่าที่เป็นอยู่"

 innovation_development_02:0 "การปกครองชุมชน"
 innovation_development_02_desc:0 "เมืองขนาดใหญ่มักเผชิญกับปัญหาที่ซับซ้อนมากขึ้นเรื่อย ๆ การมอบอำนาจบางส่วนให้กับสภาท้องถิ่นจะช่วยให้พวกเขาแก้ไขปัญหาเหล่านี้ได้โดยไม่จำเป็นต้องให้กษัตริย์เข้ามาเกี่ยวข้อง"

 innovation_currency_02:0 "เหรียญกษาปณ์"
 innovation_currency_02_desc:0 "เงินตราที่ไม่มีการควบคุมนั้นควบคุมได้ยากและขาดเสถียรภาพ เหรียญกษาปณ์ที่ผลิตขึ้น วัดตามน้ำหนักเฉพาะ และประทับตราหลวง ให้ความมั่นใจใหม่แก่ธุรกรรมทางการค้า"

 #Regional

 innovation_reconquista:1 "การขยายอำนาจทางจิตวิญญาณ"
 innovation_reconquista_desc:0 "เนื่องจากมัว แต่ต่อสู้กันเอง เราจึงทนต่อการมีอยู่ของพวกนอกศาสนาในฮิสปาเนียนานเกินไป ถึงเวลาแล้วที่เราจะรวบรวมกำลังเพื่อขับไล่พวกเขาออกจากดินแดนนี้ให้สิ้นซาก!"

 innovation_stem_duchies:0 "ชตัมเมสแฮร์โซกทุม"
 innovation_stem_duchies_desc:0 "แม้จะมาจากชนเผ่าต่าง ๆ แต่เราตระหนักถึงความสำคัญของความสามัคคีและความร่วมมือ เอกราชถูกให้ค่าสูงเกินไปเมื่อเสถียรภาพคือสิ่งที่นำไปสู่ความปลอดภัยและความเจริญรุ่งเรือง"

 innovation_ghilman:0 "กิลมาน"
 innovation_ghilman_desc:0 "ทาสทหารที่จับมาเป็นเชลยศึก กิลมานเป็นนักรบที่ทุ่มเท ซึ่งทั้งภักดีต่อเรามากกว่าและจ่ายค่าจ้างถูกกว่าทหารรับจ้างทั่วไป"

