 # The Silk Road #
 #################

 culture_parameter_silk_road_innovation_parameter: "สามารถได้รับเป็น [cultural_fascination|E] ที่มีศักยภาพผ่านทาง [heritage|E] [GetCulturePillar('heritage_chinese').GetName], [tradition|E] [GetCultureTradition('tradition_sinophilic').GetName] หรือ [silk_road|E] เท่านั้น"

 innovation_fire_medicine: "ยาอัคคี" # 'Huoyao,' 火藥
 innovation_fire_medicine_desc: "การหยั่งลึกถึงปริศนาแห่งชีวิตบางครั้งก็นำไปสู่การค้นพบบางสิ่งที่สร้างเพียงความตาย ยาอัคคี ซึ่งเป็นส่วนผสมอันทรงพลังของกำมะถัน, ดินประสิว และวัสดุติดไฟบางชนิด ได้สร้างเปลวไฟมรณะที่เผาไหม้อย่างรุนแรง, เกือบจะระเบิดออกมา"

 innovation_champa_rice: "ข้าวจำปา"
 innovation_champa_rice_desc: "ข้าวต้องการเวลาและน้ำปริมาณมหาศาล — ยกเว้นข้าวจากจำปา สายพันธุ์นี้เติบโตเร็วกว่า, ทนแล้งได้ดีกว่า และให้ผลผลิตที่อุดมสมบูรณ์กว่าข้าวชนิดอื่นใดที่รู้จัก ในบางกรณี มันสามารถเก็บเกี่ยวได้ถึงสองครั้งในหนึ่งปี หากมีการจัดการอย่างเหมาะสม ข้าวนี้สามารถส่งเสริมฟาร์มและขับเคลื่อนการเติบโตของประชากรได้"

 culture_parameter_champa_rice_wet_land_paddies: "สาย[buildings|E] [GetBuilding('paddy_fields_01').GetTypeName|V] สามารถสร้างได้ใน [GetTerrain( 'wetlands' ).GetName]"
 culture_parameter_champa_rice_building_bonuses: "สาย[buildings|E] [GetBuilding('paddy_fields_01').GetTypeName|V] มอบโบนัสเพิ่มเติม"
 building_paddy_fields_requirement_terrain_tt: "ต้องการหนึ่งในเงื่อนไขต่อไปนี้:\n$EFFECT_LIST_BULLET$[province|E] เป็น [GetTerrain( 'terraced_hills' ).GetName]\n$EFFECT_LIST_BULLET$[province|E] เป็น [GetTerrain( 'floodplains' ).GetName] และอยู่ใน [region|E] [GetGeographicalRegion('paddy_fields_region').GetName]\n$EFFECT_LIST_BULLET$[province|E] เป็น [GetTerrain( 'wetlands' ).GetName] และ [culture|E] มี [innovation|E] #V $innovation_champa_rice$#!\n$EFFECT_LIST_BULLET$[province|E] เป็น [GetTerrain( 'hills' ).GetName] หรือ [GetTerrain( 'jungle' ).GetName] และ [culture|E] มี [tradition|E] [GetCultureTradition('tradition_tgp_rice_cultivators').GetName|V]"

 innovation_sericulture: "การปลูกหม่อนเลี้ยงไหม"
 innovation_sericulture_desc: "ศิลปะการผลิตผ้าไหมเป็นกระบวนการที่ซับซ้อน แต่ให้ผลตอบแทนสูงยิ่ง ซึ่งองค์ความรู้นี้ถูกหวงแหนอย่างที่สุดโดยผู้ที่แสวงหาผลกำไรจากความเชี่ยวชาญในอุตสาหกรรมนี้"
 culture_parameter_unlocks_silk_buildings_parameter: "ปลดล็อกสาย[domicile_buildings|E] [GetDomicileBuilding('silk_01').GetNameNoTooltip|V]"

 innovation_dragon_kiln: "เตามังกร"
 innovation_dragon_kiln_desc: "เครื่องเคลือบดินเผาชั้นเลิศสามารถผลิตได้เฉพาะในเตาเผาที่มีความเชี่ยวชาญสูง ซึ่งตั้งอยู่ใกล้แหล่งแร่ล้ำค่า เตาเผาเหล่านี้สร้างขึ้นบนเนินสูงชัน ซึ่งช่วยสร้างกระแสความร้อนวนเพื่อเผาเครื่องปั้นดินเผาที่แข็งแกร่งที่สุดเท่าที่จะเป็นได้ แม้ว่าจะสร้างได้ท้าทาย แต่ผลิตภัณฑ์ที่ได้ก็นับเป็นเครื่องปั้นดินเผาที่เป็นที่นิยมที่สุด (และทำกำไรได้มากที่สุด) ที่ราชสำนักใด ๆ รู้จัก"

 innovation_rocket_cart: "เกวียนจรวด"
 innovation_rocket_cart_chinese: "Huochē" # 火車 (Huǒchē)
 innovation_rocket_cart_koreanic: "Hwacha" # 火車 (화차)
 innovation_rocket_cart_desc: "ด้วยการใช้สูตรระเบิดที่หยาบกว่าที่จำเป็นสำหรับปืนใหญ่ราคาแพง ลูกธนูไฟจำนวนมหาศาลสามารถถูกยิงออกจากอุปกรณ์เพียงชิ้นเดียวได้ และ เนื่องจากลูกธนูไฟเหล่านี้ยังคงมีแรงปะทะเพียงแค่... ลูกธนู พวกมันจึงเหมาะกว่ามากสำหรับการยิง #italic จาก#! กำแพง มากกว่ายิง #italic ใส่#! กำแพง"
 innovation_rocket_cart_chinese_desc: "$innovation_rocket_cart_desc$"
 innovation_rocket_cart_koreanic_desc: "$innovation_rocket_cart_desc$"

 innovation_compass: "เข็มทิศ"
 innovation_compass_desc: "ด้วยหินแม่เหล็กธรรมดาชิ้นหนึ่ง ก็เป็นไปได้ที่จะล่วงรู้ทิศทางที่ผู้คนกำลังเดินทางไปได้เสมอ เมื่อเวลาผ่านไปและการพัฒนาเพิ่มเติม ในที่สุดก็อาจเป็นไปได้ที่จะนำทางโดยมิต้องหยุดถามทิศทางจากผู้ใดเลย"
 culture_parameter_cheaper_adventure_inspiration: "ค่าใช้จ่าย[inspiration|E]การผจญภัย: #P -50%#!"

 innovation_block_printing: "การพิมพ์บล็อกไม้"
 innovation_block_printing_desc: "ด้วยการใช้ชุดบล็อกไม้แกะสลัก ทำให้สามารถรวบรวมชุดแม่พิมพ์ที่สามารถใช้ซ้ำได้หลายครั้งเพื่อทำซ้ำคำและภาพเดิม ๆ บนวัสดุใด ๆ ที่เหมาะสม สิ่งนี้ช่วยลดความซับซ้อนของกระบวนการผลิตหนังสือลงอย่างมาก ทั้งยังลดต้นทุนและ ทำให้ตัวอักษรเป็นสิ่งที่ทุกคนเข้าถึงได้มากขึ้น"
 culture_parameter_block_printing_scriptorium_bonuses: "[SelectLocalization( HasDlcFeature( 'legends' ), 'culture_parameter_block_printing_scriptorium', 'blank_line' )]"
 culture_parameter_block_printing_scriptorium: "สาย[buildings|E] [GetBuilding('scriptorium_01').GetTypeName|V] มอบโบนัสเพิ่มเติม"
 culture_parameter_block_printing_university_bonuses: "[SelectLocalization( HasDlcFeature( 'wards_and_wardens' ), 'culture_parameter_block_printing_university_bonuses_text', 'blank_line' )]"
 culture_parameter_block_printing_university_bonuses_text: "ค่าใช้จ่ายวัสดุการเรียน [GetActivityType('activity_adult_education').GetName]: #P -50%#!"

 innovation_grenades: "ระเบิดมือ"
 innovation_grenades_desc: "แม้จะมีความก้าวหน้าทั้งมวลในการสงคราม เครื่องมือโบราณสิ่งหนึ่งยังคงประเมินค่ามิได้: นั่นคือแขน ภาชนะขนาดเล็กที่บรรจุสารไวไฟหรือวัตถุระเบิดสามารถทำขึ้นและขว้างได้อย่างง่ายดายโดยทุกคนที่มีเทคนิคการขว้างที่ดี ระเบิดมือที่แจกจ่ายให้ทหารก่อนการรบสามารถให้หนทางรองแก่พวกเขาในการโจมตีและสร้างความตื่นตระหนกแก่ศัตรู"

 innovation_cupellation: "การถลุงแบบคิวเพลเลชัน"
 innovation_cupellation_desc: "เตาหลอมอุณหภูมิสูงแบบพิเศษสามารถหลอมโลหะมีค่าออกจากตัวอย่างที่ขุดได้ โดยสกัดพวกมันออกจากแร่ที่ถลุงแล้ว และผลิตตัวอย่างที่บริสุทธิ์ ซึ่งสามารถตรวจสอบเพิ่มเติมได้โดยนักประเมิน การถลุงแร่จากเหมืองตะกั่วด้วยวิธีคิวเพลเลชันเป็นวิธีที่ดีที่สุดในการระบุปริมาณเงินในเหมืองนั้น และการถลุงทองคำด้วยวิธีนี้สามารถระบุความบริสุทธิ์ของมันสำหรับศักยภาพในการผลิตเหรียญกษาปณ์ได้"
 culture_parameter_cupellation_mine_building_bonuses: "[baronies|E] ที่มี [special_building|E] #V เหมืองแร่#! [taxes|E]ของ[holding|E]: #P @gold_icon![EmptyScope.ScriptValue('innovation_cupellation_mine_tax_bonus_value')|%0+=]#! "

 innovation_lacquered_armor: "ชุดเกราะเคลือบเงา"
 innovation_lacquered_armor_desc: "การใช้เรซินบางชนิดกับชุดเกราะอย่างพิถีพิถันช่วยเสริมความแข็งแกร่งได้อย่างมาก และช่วยให้แผ่นเหล็กที่หนักกว่าทนต่อสภาพอากาศ แม้ว่ากระบวนการนี้จะเป็นที่รู้จักมาระยะหนึ่งแล้ว แต่การใช้งานส่วนใหญ่จำกัดอยู่ที่กล่อง, ขวด และเครื่องใช้อื่น ๆ ชุดเกราะเคลือบเงาแสดงถึงหนทางใหม่ในการปกป้องทั้งทหารและยุทโธปกรณ์ของพวกเขา"
 culture_parameter_higher_quality_armor_artifacts_parameter: "[artifacts|E]ชุดเกราะ จาก [inspirations|E]ที่[sponsored|E] และ [GetDecision('commission_artifact_decision').GetName] จะมีคุณภาพที่สูงขึ้น"

 innovation_double_entry_bookkeeping: "การทำบัญชีคู่"
 innovation_double_entry_bookkeeping_desc: "บันทึกจะต้องตามให้ทันความซับซ้อนที่เพิ่มขึ้นของการคลังและเศรษฐกิจ การบันทึกการชำระเงินเข้าและการชำระเงินออกทั้งหมดเป็นรายการแยกกันจะช่วยรักษางบดุลที่น่าเชื่อถือ และรับประกันว่ารายการจะไม่ถูกมองข้ามโดยบังเอิญ — หรือ "โดยบังเอิญ" — เมื่อทำการตรวจสอบบัญชี"
 culture_parameter_bookkeeping_collect_taxes_bonus: "$task_collect_taxes$ [councillor_task|E]: [gold_i|E]#P +10%#!"

 innovation_waterworks: "ระบบการจัดการน้ำ"
 innovation_waterworks_desc: "น้ำคือผู้ให้ชีวิต แต่มีประโยชน์มากมายนอกเหนือจากการดับกระหายหรือชลประทานทุ่งนา หากถูกควบคุมอย่างมีศิลปะ ทรัพยากรจากฟากฟ้านี้อาจขับเคลื่อนเครื่องจักรที่แข็งแกร่งกว่าปศุสัตว์หลายเท่า, อำนวยความสะดวกในการเดินทางและการค้าตามลำคลองที่มนุษย์สร้างขึ้น หรือเพียงแค่รักษาถนนที่พลุกพล่านให้ถูกสุขอนามัยและน่าอยู่"
 culture_parameter_unlocks_waterworks_buildings: "ปลดล็อกสาย[buildings|E] [GetBuilding('waterworks_01').GetTypeName|V]"

 innovation_tiefutu: "$tiefutu$"
 innovation_tiefutu_desc: "$tiefutu_flavor$"

 innovation_bulkheads: "ผนังกั้นน้ำ"
 innovation_bulkheads_desc: "วิธีที่แน่นอนที่สุดในการป้องกันไม่ให้เรือจมคือการไม่ ทำให้ท้องเรือแตกตั้งแต่แรก แต่หากเกิดขึ้น เรืออาจยังคงรอดได้หากท้องเรือถูกแบ่งออกเป็นส่วน ๆ โดยมีผนังกันน้ำอยู่ระหว่างนั้น แม้ว่าเรือจะเสียหาย ผนังกั้นน้ำก็สามารถป้องกันไม่ให้น้ำจมเรือทั้งลำ, ช่วยชีวิตคน, เสบียง และตัวเรือเองได้ในกระบวนการนี้"

 innovation_coking: "การผลิตถ่านโค้ก"
 innovation_coking_desc: "ถ่านไม้เป็นส่วนสำคัญของการตีเหล็ก แต่ต้องการป่าไม้ที่อุดมสมบูรณ์ในบริเวณใกล้เคียงเพื่อแปรรูปไม้ให้เป็นเชื้อเพลิงที่จำเป็นนี้ ถ่านหิน ซึ่งถูกให้ความร้อนในสิ่งที่คล้ายกับเตาเผาถ่าน สามารถแปรรูปเป็นถ่านโค้กได้ ถ่านโค้กมีประโยชน์ เช่นเดียวกับถ่านไม้ในการตีเหล็กและเพลิงอุตสาหกรรมอื่น ๆ โดยไม่จำเป็นต้องตัดไม้ทำลายป่าทั้งผืน"
 culture_parameter_coking_smith_bonuses: "สาย[buildings|E] [GetBuilding('smiths_01').GetTypeName|V] และ [GetBuilding('blacksmiths_01').GetTypeName|V] มอบโบนัสเพิ่มเติม"

 innovation_composite_crossbow: "หน้าไม้คอมโพสิต"
 innovation_composite_crossbow_desc: "เช่นเดียวกับคันธนูทั่วไป ความแข็งแรงของคันธนูจะกำหนดพลังศักยภาพในการน้าวสาย ด้วยการเสริมความแข็งแรงของคันธนูด้วยเขา หรือแม้แต่เหล็ก น้ำหนักน้าวสาย และด้วยเหตุนี้ ระยะและพลังของหน้าไม้จึงสามารถสูงกว่าแบบที่ทำจากไม้หลายเท่า เช่นเดียวกับ ทำให้ทนทานและมีอายุการใช้งานยาวนานขึ้น"

 innovation_pharmacopoeia: "ตำรับยา"
 innovation_pharmacopoeia_desc: "แพทย์ที่ดีทุกคนจำเป็นต้องรู้วิธีผลิตยาที่ถูกต้องในเวลาที่เหมาะสม โดยใช้ส่วนผสมที่ถูกต้อง เตรียมด้วยวิธีที่ถูกต้อง ในปริมาณที่ถูกต้อง แม้ว่าองค์ความรู้นี้มักจะถูกถ่ายทอดจากอาจารย์สู่ลูกศิษย์เป็นรายบุคคล แต่การ #italic จดบันทึก#! วิธีการทำยาเฉพาะทางสามารถช่วยได้อย่างมหาศาลในการสร้างมาตรฐานและเผยแพร่การเตรียมการรักษาที่แตกต่างกัน"
 culture_parameter_physician_pharmacopoeia_bonus: "[court_position|E] [GetCourtPositionType('court_physician_court_position').GetName()] ประสิทธิผลการรักษา: #P +20%#!"

