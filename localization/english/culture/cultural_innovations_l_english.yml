 #Military
 innovation_motte:0 "มอตต์"
 innovation_motte_desc:0 "เรียบง่าย แต่ได้ผล การสร้างปราสาทของเราบนเนินดินยกสูงเป็นวิธีที่ดีที่สุด เพื่อให้แน่ใจว่าเราจะได้เปรียบเชิงชัยภูมิเหนือศัตรูอย่างแท้จริง"

 innovation_motte_chinese: "Hāng Tu" # 夯土
 innovation_motte_chinese_desc: "เรียบง่าย ทว่าทรงประสิทธิภาพ การสร้างป้อมปราการของเราจากดินบดอัดคือวิถีอันประเสริฐที่สุดที่จะรับประกันว่า เราจะได้เปรียบเหนือศัตรูจากที่สูงอย่างแท้จริง"

 innovation_motte_actual_motte: "มอตต์"
 innovation_motte_actual_motte_desc: "$innovation_motte_desc$"

 innovation_catapult:0 "โอเนเจอร์"
 innovation_catapult_desc:0 "แม้จะบรรจุและยิงได้ช้า แต่เครื่องดีดหินพลังงานบิด เช่นนี้ช่วยให้เราโจมตีป้อมปราการข้าศึกได้ขณะที่อยู่นอกระยะยิงของพลธนูฝ่ายนั้น"

 innovation_catapult_chinese: "หน้าไม้กลไกโจมตี"
 innovation_catapult_chinese_desc: "หน้าไม้กลขนาดใหญ่ที่เคลื่อนย้ายได้ ประกอบด้วยคันหน้าไม้หลายอันที่วางตรงข้ามกันเพื่อเพิ่มระยะน้าวสายและอานุภาพ มักติดตั้งบนโครงรถลากเพื่อความคล่องตัวในการเคลื่อนที่"

 innovation_barracks:0 "โรงทหาร"
 innovation_barracks_desc:0 "การสร้างอาคารเฉพาะสำหรับให้ทหารของเราพักอาศัย จะช่วยให้แน่ใจว่าเรามีพื้นที่เพียงพอรองรับกองทัพที่กำลังเติบโตของเรา"

 innovation_mustering_grounds:0 "ลานรวมพล"
 innovation_mustering_grounds_desc:0 "เพียงแค่มีคนที่เต็มใจสู้เพื่อเรานั้นไม่เพียงพอที่จะชนะสงคราม การจัดสรรพื้นที่สำหรับให้ผู้คนทั้งฝึกซ้อมและรวมพลเพื่อการรบ จะช่วยให้เราสนับสนุนกลุ่มนักรบที่มีประสบการณ์มากขึ้น ซึ่งสามารถนำเราไปสู่ชัยชนะได้"

 innovation_bannus:0 "บานนุส"
 innovation_bannus_desc:0 "บนพื้นฐานของอำนาจในการบัญชาการรบ บานนุสให้ผู้ปกครองของเรามีอำนาจบังคับไพร่ให้ต่อสู้เพื่อตน ก่อเกิดเป็นพื้นฐานทางกฎหมายสำหรับการระดมพลกองทัพขนาดใหญ่"
 eligible_accolade_vanguard_attribute_ACCOLADES_DLC:0 "[knights|E] ของ [culture|E] นี้จะมีสิทธิ์ได้รับ [accolades|E] ประเภท [GetAccoladeType('vanguard_attribute').GetName]"
 eligible_accolade_vanguard_attribute:1 "[AddLocalizationIf( HasDlcFeature( 'accolades' ), 'eligible_accolade_vanguard_attribute_ACCOLADES_DLC')]"
 unlock_maa_armored_footmen: "ปลดล็อก [men_at_arms|E] [GetMaA('armored_footmen').GetName]"
 unlock_maa_onager: "สามารถเกณฑ์ [GetMaA('onager').GetName] เป็น [men_at_arms|E] ได้"

 innovation_quilted_armor:0 "เกราะผ้าบุนวม"
 innovation_quilted_armor_desc:0 "สร้างขึ้นจากผ้าลินินนับสิบชั้นหรือมากกว่าเย็บติดกัน เสื้อเกราะเหล่านี้สามารถหยุดแม้กระทั่งลูกธนูหนัก ๆ ได้ และเป็นวิธีที่ไม่แพงสำหรับเราในการจัดหาเกราะให้ทั้งกรมทหารสำหรับการรบ"

 #Civic
 innovation_gavelkind:0 "กาเวลไคนด์"
 innovation_gavelkind_desc:0 "เสถียรภาพและความเจริญรุ่งเรืองเป็นของคู่กัน แทนที่จะให้ข้าหลวงแย่งชิงอำนาจเมื่อกษัตริย์องค์เก่าสวรรคต เราสามารถกำหนดระบบการสืบทอดมรดกที่กำหนดไว้ล่วงหน้าและเท่าเทียม ซึ่งจะขจัดความไม่มั่นคงส่วนใหญ่ที่เกิดขึ้นตามปกติในการสืบทอดตำแหน่ง"

 innovation_crop_rotation:0 "การปลูกพืชหมุนเวียน"
 innovation_crop_rotation_desc:0 "การเปลี่ยนจากรูปแบบการทำนาแบบสองแปลงดั้งเดิมมาเป็นการปลูกพืชหมุนเวียนแบบสามแปลง จะช่วยให้เราปลูกพืชผลได้มากขึ้นใน แต่ละปีโดยไม่ ทำให้ดินในนาของเราเสื่อมโทรม"

 innovation_city_planning:0 "การวางผังเมือง"
 innovation_city_planning_desc:0 "การออกแบบผังเมืองก่อนที่เราจะเริ่มก่อสร้าง จะช่วยให้เราสร้างที่ดินถือครองใหม่ในทำเลที่ตั้งทางยุทธศาสตร์ ซึ่งใช้งานได้ดีและสวยงามน่ามองกว่าที่ดินเก่า ๆ ที่เกิดขึ้นอย่างสะเปะสะปะเมื่อเวลาผ่านไป"

 innovation_casus_belli:0 "เหตุแห่งสงคราม"
 innovation_casus_belli_desc:0 "อำนาจคือธรรมเป็นกฎของแผ่นดินมาหลายชั่วอายุคน แต่หากเรามีเหตุผลอันชอบธรรมสำหรับสงครามของเรา เราก็จะสามารถหลีกเลี่ยงการยั่วยุความโกรธเคืองของเพื่อนบ้านและการตอบโต้ที่มักจะตามมาได้"

 innovation_plenary_assemblies:0 "สมัชชาเต็มคณะ"
 innovation_plenary_assemblies_desc:0 "เพื่อให้การปกครองมีประสิทธิภาพ เราต้องนำไพร่ทุกคนในอาณาจักรมารวมกันเพื่อหารือและแก้ไขปัญหาทางกฎหมาย การเข้าร่วมเป็นข้อบังคับ และผู้ที่ไม่มาจะถูกปรับและถูกริบสิทธิ์ในการมีอิทธิพลต่อการตัดสินใจใด ๆ ที่เกิดขึ้น"

 innovation_development_01:0 "งานสาธารณะ"
 innovation_development_01_desc:0 "การให้ทุนสนับสนุนการก่อสร้างงานสาธารณะ เช่น ถนน โรงเรียน และสะพานส่งน้ำ จะช่วยให้ชุมชนของเราเติบโตมีขนาดใหญ่ขึ้น สร้างความมั่นคงให้แก่ความเจริญรุ่งเรืองของประชาชนของเราไปอีกหลายชั่วอายุคน"

 innovation_currency_01:0 "เงินตรา"
 innovation_currency_01_desc:0 "การแลกเปลี่ยนสิ่งของนั้นช้าและไม่มีประสิทธิภาพ การนำเงินตราที่ได้รับการยอมรับอย่างเป็นทางการมาใช้ เช่น เบี้ยหอยหรือก้อนโลหะ จะช่วยส่งเสริมการค้าและเพิ่มการแพร่กระจายของแนวคิดภายในอาณาจักรของเรา"

 innovation_ledger:0 "สมุดบัญชี"
 innovation_ledger_desc:0 "เมื่อดินแดนของเราเติบโตขึ้น เราต้องการวิธีที่ดีกว่าในการติดตามสิ่งที่เราเป็นเจ้าของ การดูแลสมุดบัญชีทรัพย์สินของเราจะช่วยให้แน่ใจว่าเรารู้เสมอว่าเรามีทรัพยากรอะไรบ้างที่พร้อมใช้"

 #Regional
 innovation_viking_tradition:0 "ยุทธวิธีไวกิ้ง"
 innovation_viking_tradition_desc:0 "ผู้คนทางเหนือมีประเพณีการค้ามายาวนาน แต่ก็มีการกระทำเยี่ยงโจรสลัดด้วย เช่นกัน มีเพียงไม่กี่คนที่พร้อมจะต่อสู้กับภัยคุกคามที่ปรากฏขึ้นโดยไม่มีสัญญาณเตือนจากริมฝั่งแม่น้ำ และนักรบไวกิ้งก็เป็นปรมาจารย์แห่งการสงคราม เช่นนั้น"
 
 innovation_longboats:1 "เรือยาว"
 innovation_longboats_desc:1 "เรือยาวของเราเป็นเรือเดินทะเลที่น่าเกรงขาม ซึ่งสามารถเดินทางไปได้เกือบทุกที่และแม้กระทั่งฝ่าฟันสภาพอากาศเลวร้าย ทำให้เรามีความคล่องตัวเป็นพิเศษในทะเล"

 innovation_war_camels:0 "อูฐศึก"
 innovation_war_camels_desc:0 "อูฐมีความเหมาะสมตามธรรมชาติในการอาศัยอยู่ในภูมิประเทศทะเลทราย แต่โดยธรรมชาติแล้วไม่ใช่สัตว์สำหรับการรบ ผู้เพาะพันธุ์และผู้ฝึกของเราสามารถเปลี่ยนแปลงสิ่งนี้ได้ ทำให้เราเข้าถึงทหารม้าที่ปรับตัวได้ ซึ่งจะช่วยให้เราเชี่ยวชาญผืนทราย"
 eligible_accolade_camelry_attribute_ACCOLADES_DLC:0 "[knights|E] ของ [culture|E] นี้จะมีสิทธิ์ได้รับ [accolades|E] ประเภท [GetAccoladeType('camelry_attribute').GetName]"
 eligible_accolade_camelry_attribute:1 "[AddLocalizationIf( HasDlcFeature( 'accolades' ), 'eligible_accolade_camelry_attribute_ACCOLADES_DLC')]"

 innovation_elephantry:0 "การใช้ช้างศึก"
 innovation_elephantry_desc:0 "ช้างเลี้ยงยากในกรง ดังนั้นควาญช้าง แต่ละคนต้องจับช้างป่าของตนเองและฝึกฝน นี่หมายความว่ามีศิลปะอันละเอียดอ่อนในการใช้สัตว์ใหญ่เหล่านี้ในการรบอย่างเหมาะสม แต่มันเป็นศิลปะที่เราทุ่มเทเพื่อฝึกฝนให้เชี่ยวชาญ"
 eligible_accolade_elephantry_attribute_ACCOLADES_DLC:0 "[knights|E] ของ [culture|E] นี้จะมีสิทธิ์ได้รับ [accolades|E] ประเภท [GetAccoladeType('elephantry_attribute').GetName]"
 eligible_accolade_elephantry_attribute:1 "[AddLocalizationIf( HasDlcFeature( 'accolades' ), 'eligible_accolade_elephantry_attribute_ACCOLADES_DLC')]"
 
 innovation_wootz_steel:0 "เหล็กวูทซ์"
 innovation_wootz_steel_desc:0 "หรือที่รู้จักกันในชื่อเหล็กฮินดูวานีหรือเหล็กเซริก โลหะที่มีคาร์บอนสูงนี้ยอดเยี่ยมสำหรับการทำอาวุธ เหล็กวูทซ์มีการซื้อขายกันอย่างแพร่หลายและถือเป็นเหล็กกล้าที่ดีที่สุดในโลก ตลอดประวัติศาสตร์ส่วนใหญ่ มันดึงดูดความสนใจของพ่อค้าชาวอาหรับ อียิปต์ จีน และแม้กระทั่งโรมัน"
 
 innovation_african_canoes:0 "เรือแคนูแอฟริกาตะวันตก"
 innovation_african_canoes_desc:0 "เรือแคนูขนาดใหญ่ของแอฟริกาตะวันตกยอดเยี่ยมสำหรับการเดินทางในแม่น้ำและช่วยให้เราขนส่งทหารไปยังที่ที่เราต้องการได้อย่างรวดเร็ว"
 
 innovation_table_of_princes:0 "โต๊ะแห่งเจ้าชาย"
 innovation_table_of_princes_desc:0 "โต๊ะแห่งเจ้าชายคือบัลลังก์ของราชวงศ์โบฮีเมีย โดยผู้ที่นั่ง ณ โต๊ะนั้นจะได้รับการยอมรับว่าเป็นผู้ปกครองที่ชอบธรรม ภายใต้ประมวลกฎหมายอาวุโสในราชวงศ์ ตำแหน่งต่าง ๆ จะมอบให้กับสมาชิกที่อาวุโสที่สุดที่ยังมีชีวิตอยู่ในราชวงศ์ผู้ปกครอง"
 unlock_single_heir_dynasty_house_changing:0 "สามารถบัญญัติ $single_heir_dynasty_house$ ได้ไม่ว่า [crown_authority|E] จะอยู่ในระดับใด"


 tradition_visigothic_codes_name:0 "$innovation_visigothic_codes$"
 tradition_visigothic_codes_desc:0 "$innovation_visigothic_codes_desc$"
 innovation_visigothic_codes:0 "ประมวลกฎหมายวิซิกอท"
 innovation_visigothic_codes_desc:0 "แม้ว่าประเพณีเก่าแก่หลายอย่างของชาววิซิกอทจะเลือนหายไปจากโลกนานแล้ว แต่ลูกหลานแห่งเทือกเขาพิรินียังคงจดจำวิถีโบราณ และวิธีแบ่งที่ดินระหว่างบุตรชายและบุตรสาวอย่างเป็นธรรมและเหมาะสมกับการใช้งาน"
 unlock_equal_succession_changing:0 "สามารถบัญญัติ [law|E] $equal_law$ ได้ไม่ว่า [crown_authority|E] จะอยู่ในระดับใด"

