l_english: 
 submit_to_the_great_khan_decision:0 "ยอมสวามิภักดิ์ต่อมหาข่าน"
 submit_to_the_great_khan_decision_confirm:0 "ถวายสัตย์ปฏิญาณ"
 submit_to_the_great_khan_decision_opening_desc:0 "ถึงเวลาแล้วที่จะยอมรับว่าแท้จริงแล้วชาวมองโกลคือผู้ปกครองโลก ข้าจะเข้าร่วมกองทัพของพวกเขา แทนที่จะต่อต้าน"
 submit_to_the_great_khan_decision_tooltip:0 "ท่านจะกลายเป็นข้าหลวงของจักรพรรดิข่านแห่งมองโกล และเข้าร่วมจักรวรรดิมองโกล"

 mongol_invasion.1001.title:0 "ข่านสวรรคต!"
 mongol_invasion.1001.generic.desc: "[ROOT.Char.GetFaith.HighGodName] ทรงเมตตา และ [ROOT.Char.GetFaith.DeathDeityName] โค่นล้มแม้กระทั่งผู้ยิ่งใหญ่ที่สุด! ข่าวดีคือ: [old_khan.GetTitledFirstNameNicknamed] เจ้าแห่งอาชาและผู้ทำลายล้าง [old_khan.GetDeathReasonHideKiller|l]\n\nด้วยความหวาดกลัว เราพูดถึงนายท่านผู้น่าสะพรึงกลัวคนใหม่สำหรับ [new_khan.GetPrimaryTitle.GetNameNoTier] แล้ว... แต่ [new_khan.GetTitledFirstNameNicknamed] ผู้นี้ #EMP ไม่มีทาง#! น่าเกรงขามเท่าบรรพบุรุษของ [new_khan.GetHerHis]...\n\nบางทีนี่อาจเป็นจุดสิ้นสุดของการพิชิตของ [new_khan.GetPrimaryTitle.GetAdjectiveNoTooltip]?"
 mongol_invasion.1001.sympathetic.desc: "#EMP โอ้ เสียงคร่ำครวญ! เสียงร่ำไห้!#! [old_khan.GetTitledFirstNameNicknamed] ผู้ยิ่งใหญ่ ที่ถูกเลือกโดยสวรรค์ให้พิชิตทั่วทั้งผืนปฐพี ไม่มีอีกต่อไปแล้ว ผู้คนต่างกล่าวขานกันว่า [old_khan.GetTitleAsNameNoTooltip] [old_khan.GetDeathReasonHideKiller|l]\n\nด้วยการจากไปของนายเหนือหัว [new_khan.GetPrimaryTitle.GetDefinitiveName] ได้รวบรวม #EMP คุรุลไต#! ระดับสูงและประกาศสถาปนา [new_khan.GetTitleAsNameNoTooltip] องค์ใหม่\n\nและด้วยเหตุนี้ ในขณะที่ [old_khan.GetFirstNameNoTooltip] ทรงม้าไปชั่วนิรันดร์บนสรวงสวรรค์ ผืนแผ่นดินทั้งหมดจะตกเป็นของ [new_khan.GetTitledFirstNameNicknamed]!"
 mongol_invasion.1001.a:0 "พ้นภัยเสียที!"
 mongol_invasion.1001.b: "[new_khan.GetPrimaryTitle.GetTierAsNameNoTooltip] ผู้ยิ่งใหญ่ยังคงอยู่รอด"
 mongol_invasion.1001.c: "[old_khan.GetFirstNameNoTooltip] ได้รับตำแหน่งอันทรงเกียรติใน [ROOT.Char.GetFaith.NegativeAfterLife]"

 mongol_invasion.1002.t:0 "การผงาดขึ้นของ [genghis_khan.GetCulture.GetCollectiveNounNoTooltip]"
 mongol_invasion.1002.desc.close: "ผู้นำผู้น่าสะพรึงกลัว [genghis_khan.GetTitledFirstName] ถือกำเนิดขึ้นจากเผ่าต่างๆ ที่ทำสงครามกันของ"
 mongol_invasion.1002.desc.close_mongolia:0 "มองโกเลีย"
 mongol_invasion.1002.desc.close_steppes:0 "ทุ่งหญ้าสเตปป์"
 mongol_invasion.1002.desc.close.mid: "และ — โดยเหล่าปราชญ์แห่งผู้คนของ [genghis_khan.GetHerHis], ณ #EMP คุรุลไท#! อันยิ่งใหญ่ — ได้รับการประกาศ"
mongol_invasion.1002.desc.genghis: "[Glossary( 'เจงกิสข่าน', 'GENGHIS_KHAN_GLOSS' )]."
mongol_invasion.1002.desc.gok: "มหาข่านผู้ยิ่งใหญ่เหนือข่านทั้งปวง!"
 mongol_invasion.1002.desc.close.end: "โดยชอบธรรมแล้ว [genghis_khan.GetSheHe] จะต้องปกครองทั่วทั้งสี่มุมจักรวาล\n\nนักขี่ม้าเร่ร่อนนับไม่ถ้วนรวมตัวกันภายใต้ธงของ [genghis_khan.GetHerHis] ตามพระประสงค์ของข่านผู้ยิ่งใหญ่ที่สุด พวกเขาถูกแยกออกจากความภักดีต่อเผ่าเก่า จัดระเบียบใหม่เพื่อสงคราม และเคลื่อนทัพออกไปเพื่อพิชิตทุ่งหญ้าสเตปป์ทั้งหมด โลกทั้งใบ — ทุกสิ่งภายใต้ท้องฟ้าสีครามอันยิ่งใหญ่!"
 GENGHIS_KHAN_GLOSS: "มีเพียงมหาประมุขผู้ยิ่งใหญ่เพียงองค์เดียวที่เคยดำรงสมัญญานามอันทรงเกียรติของมองโกเลีย #G เจงกิส#! หรือ #G ชิงกิสข่าน#! ความหมายของนามนั้นยังมิแน่ชัด อาจสื่อถึงความแข็งแกร่ง, ความเที่ยงธรรม, หรือการปกครองแบบ 'สากลจักรวาล', 'ดุจมหาสมุทร' และโดยแท้จริงแล้ว ผู้ที่ดำรงยศฐาบรรดาศักดิ์นี้ได้ก้าวขึ้นเหนือกว่า #EMP กูรข่าน#! ในยุคสมัยของตน และได้สร้างจักรวรรดิทุ่งหญ้าสเตปป์ที่ใหญ่ที่สุดเท่าที่เคยปรากฏมา"
 mongol_invasion.1002.desc.far_intro: "มีข่าวลือมาว่า... ทรราชผู้ป่าเถื่อนได้ผงาดขึ้นท่ามกลางหมู่ชนเผ่าอนารยชนแห่งทุ่งหญ้าสเตปป์อันห่างไกล '[genghis_khan.GetTitledFirstName]' ผู้ประกาศตนให้ [genghis_khan.GetHerselfHimself] เป็นผู้ปกครองแห่งจักรวาลทั้งมวล —"
 mongol_invasion.1002.desc.far: "\n\nท่ามกลางเสียงหัวเราะอย่างประหม่า สมาชิกสภาของข้าบอกข้าว่า [genghis_khan.GetSheHe] ได้สาบานว่าจะพิชิตโลกทั้งใบ บดขยี้เมืองให้เป็นผุยผงใต้กีบม้า ทำลายกำแพงปราสาทด้วยธนูและลูกศร\n\n[genghis_khan.GetSheHe|U] ไม่ใช่ชนเผ่าเร่ร่อนคนแรกที่กล่าวอ้าง เช่นนี้... แต่พวกเขายังกล่าวอีกว่า [genghis_khan.GetTitleAsNameNoTooltip] ขี่ม้าอยู่หน้ากองทัพนับพัน ของทหารม้าที่อยู่ยงคงกระพัน ซึ่งฆ่าไม่ตาย"
 mongol_invasion.1002.a: "พวกหน้าใหม่! [genghis_khan.GetCulture.GetCollectiveNounNoTooltip] เสียสติไปแล้ว"
 mongol_invasion.1002.b: "หลังกำแพงของเรา... แน่นอน เราปลอดภัย"
 mongol_invasion.1002.craven: "และ [genghis_khan.GetSheHe] กำลังมาที่นี่?!"
 mongol_invasion.1002.genghis_khan_tt: "@warning_icon! #X [counties|E] ที่ถูกยึดครองโดย [genghis_khan.GetCulture.GetCollectiveNoun] จะสูญเสียส่วนใหญ่ของ [development|E] ของพวกเขา#!"
genghis_khan_mongol_empire_tt: "ได้รับ [GetTitleByKey('e_mongol_empire').GetName]"
genghis_khan_mongol_troops_tt: "ได้รับกองทัพขนาดมหึมาแห่ง [special_troops|E]"
mongol_invasion_submission_reminder_tt: "ท่านอาจหลีกเลี่ยงความพินาศได้ด้วย [decision|E] #high $submit_to_the_great_khan_decision$#! "
gok_threatening_powers_tt: "@warning_icon! #X จักคุกคามเหล่า [rulers|E] ด้วยการทำลายล้าง [holdings|E], สังหารหมู่ [courtiers|E] และยึดครอง [title|E] หากพวกเขาปฏิเสธการยอมเป็น [vassalization|E]#!"

 mongol_invasion.1003.t:0 "หอแห่งปัญญาถูกเพลิงไหม้"
 mongol_invasion.1003.desc:0 "สถาบันอันยิ่งใหญ่แห่งการเรียนรู้และปัญญาของแบกแดด, หอแห่งปัญญา, ได้ตกเป็นเหยื่อของเพลิงไหม้และการทำลายล้างระหว่างการล้อมเมืองของชาวมองโกล\n\nเหลือไว้เพียงซากปรักหักพัง ราวกับจะส่งสัญญาณถึงคุณค่าของความรู้เก่าในโลกใหม่ของชาวมองโกล"
 mongol_invasion.1003.a:0 "สูญเสียไปมากมายเหลือเกิน..."
 mongol_invasion.1003.b:0 "ก็แค่อนารยชนได้รับสิ่งที่สมควรได้รับ!"
 mongol_invasion.1003.c:0 "ชาวมองโกลจะทำลายโลก หากพวกเราไม่หยุดพวกเขา!"

 mongol_invasion.1004.t:0 "จักรวรรดิล่มสลาย"
 mongol_invasion.1004.desc: "ด้วยการสิ้นชีพของ [old_mongol_emperor.GetFirstName] ผู้ยิ่งใหญ่ — จ้าวแห่งดินแดนทั้งปวงที่ถูกพิชิตโดยชาวมองโกล — เหล่าผู้สืบทอดหลายคนต่างหมายปองที่จะเข้าแทนที่ [old_mongol_emperor.GetHerHis] ในฐานะมหาข่าน ทว่าหามีผู้ใดยอมรับในความชอบธรรมของผู้อื่นไม่\n\nและ ดังนั้น นี่คืออวสานของชาวมองโกลในฐานะจักรวรรดิอันเป็นหนึ่งเดียว\n\nเหล่าผู้สืบเชื้อสายของผู้พิชิตอันยิ่งใหญ่คนแรกนี้ยังคงยึดมั่นในพละกำลังอยู่บ้าง พวกเขาร้องเรียกหาสงคราม แต่หามีผู้ใดเลย แม้ [successor_1.GetName] หรือ [successor_2.GetName] ที่จะยืนหยัดอยู่เหนือกว่าผู้อื่นใดในฐานะผู้ปกครองแห่งจักรวาลทั้งมวลไม่"
 mongol_invasion.1004.a:0 "จักรวรรดิจะกลับมารุ่งเรืองอีกครั้งในสักวัน..."
 mongol_invasion.1004.b: "ในที่สุดความเมตตาของ [ROOT.Char.GetFaith.HighGodNamePossessive] ก็ปรากฏให้เห็น..."

 mongol_invasion.1005.t:0 "ข่านสวรรคต"
 mongol_invasion.1005.desc: "ด้วยการเปลี่ยนผ่านบัลลังก์ [new_khan.GetPrimaryTitle.GetAdjective] จาก [old_khan.GetTitledFirstName] สู่ [new_khan.GetTitledFirstName] เหล่าที่ปรึกษาของข้าต่างหัวร่อด้วยความยินดีระคนถอนใจด้วยความโล่งอก... ด้วยว่า [new_khan.GetFirstNameNoTooltip] นั้นหามิกล้ายกตนให้ [new_khan.GetHerselfHimself] เป็น "ผู้ปกครองแห่งจักรวาลทั้งมวล"\n\nครั้งหนึ่ง เหล่าชนเผ่าเร่ร่อนแห่งทุ่งหญ้าสเตปป์เคยคุกคามทั่วทั้งโลกหล้า ได้รวบรวมไพร่พลอานารยชนอันมหาศาล บัดนี้ ในที่สุดพวกเขาก็ยอมรับว่าเป้าหมายนั้นอยู่ไกลเกินกว่าจะไขว่คว้าได้"
 mongol_invasion.1005.a:0 "ยุคสมัยหนึ่งได้สิ้นสุดลงแล้ว"
 mongol_invasion.1005.a.tt: "[GetTitleByKey('e_mongol_empire').GetName] จะก้าวร้าวน้อยลงนับจากนี้ไป"

 mongol_invasion.2001.opening:0 "ผู้รับใช้ที่ถูกลิขิตของข้า,"
 mongol_invasion.2001.desc:0 "ในฐานะผู้ปกครองแห่งจักรวาล เป็นสิ่งที่หลีกเลี่ยงมิได้ที่เจ้าจะต้องก้มหัวให้แก่ข้า จงกระทำด้วยการถวายสัตย์ปฏิญาณ มิใช่ด้วยคมขวานของเพชฌฆาตที่จ่อคอของเจ้า"
 mongol_invasion.2001.a:0 "ข้ายอมจำนนด้วยเกียรติ, [mongol_emperor.GetTitleAsNameNoTooltip] ของข้า"
 mongol_invasion.2001.a.tt:0 "ท่านจะกลายเป็นข้าหลวงของ [mongol_emperor.GetShortUIName]"
 mongol_invasion.2001.b:0 "เจ้ามิได้เป็นภัยคุกคามต่อข้าเลย, เจ้าคนโง่อวดดี!"
 mongol_invasion.2001.b.tt:0 "[mongol_emperor.GetShortUIName|U] ประกาศสงครามต่อท่าน"

 mongol_invasion.2002.opening:0 "ผู้ปกครองแห่งจักรวาลผู้ทรงเกียรติ,"
 mongol_invasion.2002.desc:0 "ข้าขอสวามิภักดิ์ต่อพระกรุณาอันชอบธรรมและเปี่ยมด้วยเมตตาของพระองค์ ข้าจะยืนหยัดเคียงข้างพระองค์ต่อผู้ใดก็ตามที่ต่อต้านลิขิตของพระองค์"
 mongol_invasion.2002.a:0 "เป็นการตัดสินใจที่ชาญฉลาด, ผู้รับใช้ของข้า"

 mongol_invasion.2003.opening:0 "เจ้า [mongol_emperor.Custom2('InsultAdjective', SCOPE.sC('demand_recipient'))] เงาของ [mongol_emperor.GetTitleAsNameNoTooltip],"
 mongol_invasion.2003.desc:0 "เจ้าบังอาจคิดว่าเจ้าสามารถข่มขู่ให้ข้ายอมจำนนได้รึ? ข้าจะแสดงให้เจ้าเห็นว่าผู้ปกครองที่แท้จริงจะกระทำ เช่นไรกับกองทหารม้าไร้เทียมทานที่เจ้าโอ้อวด!"
 mongol_invasion.2003.a:0 "ถ้า เช่นนั้นก็จงเป็นสงครามและความตาย"

 mongol_invasion.2101.desc:0 "เจ้าเป็นสหายและผู้รับใช้ที่ดีของข้ามาโดยตลอด ถึงเวลาแล้วที่เราจะ ทำให้การรับใช้ของเจ้าเป็นทางการ ในขณะที่เจ้าถวายสัตย์ปฏิญาณต่อผู้ปกครองแห่งจักรวาล"
 mongol_invasion.2101.a:0 "แน่นอน, องค์เหนือหัวของข้า"
 mongol_invasion.2101.b:0 "ท่านคิดว่าข้ารับใช้ท่านรึ? เหลวไหลสิ้นดี!"
 mongol_invasion.2101.b.tt:0 "@warning_icon! [mongol_emperor.GetShortUIName] ทรงยกเลิก [mongol_emperor.GetHerHis] พันธมิตรกับท่าน และอาจทรงก่อสงครามแทน!"

 mongol_invasion.2103.a:0 "เจ้าจะต้องก้มหัวให้แก่ข้า ไม่ทางใดก็ทางหนึ่ง!"
 mongol_invasion.2103.b:0 "คอยดูเถิด, เจ้าสุนัขไร้มารยาท..."

 mongol_invasion.2111.b:0 "ท่านคิดว่าข้าด้อยกว่าท่านรึ? น่าโมโห!"
 mongol_invasion.2111.b.tt:0 "@warning_icon! [mongol_emperor.GetShortUIName] ทรงยกเลิก [mongol_emperor.GetHerHis] พันธมิตรกับท่าน"

 mongol_invasion.2112.desc:0 "เจ้าเชื่อมั่นในตนเองจริง ๆ รึว่าเจ้าเหนือกว่าข้า? เจ้ามิได้เสมอเหมือนข้าด้วยซ้ำ! เป็นที่แน่ชัดว่ามิตรภาพที่ข้าหยิบยื่นให้เจ้าด้วยความเอื้อเฟื้อนั้นมิได้ต่างจากการโยนไข่มุกให้สุกร"
 mongol_invasion.2112.a:0 "โอ้, เจ้าจะต้องเสียใจต่อคำพูดและการกระทำของเจ้า..."
 
 temujin_horde_gathers_tt: "@alert_icon! #alert_trial เหล่านักรบชนเผ่าเร่ร่อนจักยังคงรวมตัวกันอยู่เบื้องหลังท่าน, ข่านผู้ถูกเลือกโดยสวรรค์, มอบ @herd_icon![herd|E], @prestige_icon![prestige|E], และ @gold_icon![gold|E] เพิ่มเติม — หาก [dominance|E] ของท่านยังคงอยู่เหนือกว่า [GetLaw('nomadic_authority_3').GetName]#!"
 mpo_greatest_of_khans.1010_title: "เหล่าตระกูลน้อยเข้าร่วมกองทัพอนารยชน"
 mpo_greatest_of_khans.1010_desc: "พลขี่ม้าไร้นายต่างร่วมสัตย์ปฏิญาณ! นักรบผู้กระหายสงครามต่างมอบคันธนู! ครอบครัวนับไม่ถ้วนหลั่งไหลสู่ค่ายหลวงอันยิ่งใหญ่ของท่าน!"
cadet_name_great_yuan: "บอร์จิกิน"
