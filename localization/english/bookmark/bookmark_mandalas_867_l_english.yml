 bm_867_mandalas: "สมมติเทพบนผืนโลก"
 bm_867_mandalas_desc: "มิมีที่ใดที่ราชอำนาจและอำนาจทางธรรมจะผูกพันกันอย่างใกล้ชิดยิ่งกว่าในเอเชียตะวันออกเฉียงใต้ เป็นเวลาหลายร้อยปีที่ศาสนาสายธรรมะได้หยั่งรากลึกลงในหมู่ผู้คน แต่เพียงศตวรรษที่ผ่านมาเท่านั้นที่เหล่าผู้ ซึ่งครั้งหนึ่งเคยเป็นเพียงกษัตริย์ได้เริ่มสถาปนาตนเองขึ้นดำรงพระยศเทวราชา, หรือสมมติเทพ\n\n#bold สมมติเทพองค์ใดจักสร้างมรดกแห่งศรัทธาไว้สืบไป และผู้ใดจักพ่ายแพ้และถูกลืมเลือน?#!"

 bookmark_mandalas_867_jayavarman_angkor: "ชัยวรมันที่ 3"
 bookmark_mandalas_867_jayavarman_angkor_subheading: "สดัจแห่งอังกอร์"
 bookmark_mandalas_867_jayavarman_angkor_desc: "อังกอร์ได้กลายเป็นอำนาจใหม่ที่กำลังผงาดขึ้นนับตั้งแต่สมัยของชัยวรมันที่ 2, องค์แรกในสายราชสกุลนี้ที่สถาปนาตนขึ้นเป็นเทวราชา หลังจากการสวรรคตของพระองค์ อาณาจักรก็แทบไม่เหลือเค้าจักรวรรดิอันยิ่งใหญ่ที่เคยเป็น ถูกลดทอนลงเหลือเพียงนครรัฐ\n\nถึงกระนั้น การเป็นสมมติเทพแห่งชาวเขมรมิใช่บทบาทที่จักเชี่ยวชาญได้โดยง่าย ชัยวรมันที่ 3 ยังคงประสบปัญหาในการก้าวข้ามผู้ครองบัลลังก์องค์ก่อน และในการเป็นผู้รังสรรค์ที่ยิ่งใหญ่ด้วยตนเอง\n\n#bold ราชวงศ์วรมันจักสามารถสืบสานมรดกอันศักดิ์สิทธิ์ของพวกเขาได้ฤา? หรือจักถูกผู้อื่นที่อ้างสิทธิ์ความเป็นใหญ่เหนือปฐพีนี้บดบังรัศมี?#!"

 bookmark_mandalas_867_indra: "อินทร"
 bookmark_mandalas_867_indra_subheading: "ราชาแห่งกูไต"
 bookmark_mandalas_867_indra_desc: "อาณาจักรอันน้อยนิดแห่งกูไตเป็นหนึ่งในดินแดนแรก ๆ ในหมู่เกาะที่อัญเชิญเหล่าพราหมณ์ฮินดูมาเพื่อค้ำจุนการปกครองของตน\n\nทว่า ราชวงศ์เซอการากลับมิอาจใช้พันธมิตรนี้เพื่อเสริมสร้างพระราชอำนาจดั่งที่ปรากฏในดินแดนอื่นได้ อาณาจักรของพวกเขาตั้งอยู่บนความภักดีของชนเผ่าไม่ยิ่งหย่อนไปกว่าพิธีกรรมทางศาสนา\n\n#bold อินทราจะยังคงมุ่งหน้าสู่เส้นทางการเป็นมณฑล หรือจักหวนคืนสู่รากเหง้า, น้อมรับวิถีแห่งรัฐชนเผ่าบนเกาะนี้?#!"

 bookmark_mandalas_867_padumaraja: "ปทุมราชา"
 bookmark_mandalas_867_padumaraja_subheading: "สดัจแห่งหริภุญชัย"
 bookmark_mandalas_867_padumaraja_desc: "แม้จะยังมิได้รุ่งโรจน์เฉก เช่นมหานครที่กำลังผงาดขึ้นอย่างพุกามหรืออังกอร์ แต่นครรัฐมอญเล็ก ๆ แห่งหริภุญชัยก็มักจะรับบทบาทเป็นข้าหลวงผู้อยู่ใต้อาณัติเสมอมา แม้จักมีที่ตั้งอันได้เปรียบระหว่างอาณาจักรเหล่านี้ก็ตาม\n\nปทุมราชาคือผู้สืบสันตติวงศ์องค์สุดท้ายแห่งหริภุญชัย, ราชวงศ์อันเปี่ยมด้วยความทะเยอทะยานอันยิ่งใหญ่ ซึ่งจนบัดนี้ ก็ยังมิอาจบรรลุสถานะที่สูงส่งกว่าเดิมได้\n\n#bold ในที่สุด ปทุมราชาจักเป็นผู้ที่ยกระดับราชวงศ์ของตนให้ทัดเทียมทวยเทพได้สำเร็จฤา?#!"

 bookmark_mandalas_867_lokapala: "โลกบาล"
 bookmark_mandalas_867_lokapala_subheading: "ราชาแห่งมาตารัม"
 bookmark_mandalas_867_lokapala_desc: "โลกปาลได้เข้าครอบครองดินแดนฝั่งตะวันออกทั้งหมดของชวา และบัดนี้ก็มีอำนาจปกครองโดยตรงอย่างไพศาล ทว่า ดินแดนฝั่งตะวันตกของเกาะยังคงส่งเครื่องบรรณาการให้แก่เหล่าจักรพรรดิแห่งศรีวิชัยผู้เป็นปรปักษ์\n\n#bold ชะตากรรมของราชวงศ์สัญชัยคือการขยายอำนาจปกครองไปยังเกาะอื่น ๆ? หรือพวกเขาจักจบลงด้วยการเป็นเพียงรัฐบรรณาการชายขอบของจักรวรรดิทางทะเลแห่งศรีวิชัย?#!"

 bookmark_mandalas_867_pyinbya: "เปียนเปีย"
 bookmark_mandalas_867_pyinbya_subheading: "ราชาแห่งพุกาม"
 bookmark_mandalas_867_pyinbya_desc: "ในฐานะหนึ่งในนครคู่แข่งแห่งลุ่มน้ำอิรวดี บัดนี้พุกามได้กลายเป็นอำนาจระดับภูมิภาค โดยมีรัฐบรรณาการจำนวนมหาศาลอยู่ใต้อาณัติ\n\nพินพญาแห่งพุกามสืบเชื้อสายมาจากกษัตริย์ท้องถิ่นมาอย่างยาวนาน แต่พระองค์คือผู้ที่เปลี่ยนนครแห่งนี้ให้กลายเป็นอาณาจักรที่เปี่ยมด้วยปณิธาน\n\n#bold พินพญาจักสามารถเปลี่ยนพุกามให้เป็นราชธานีอันโอฬารดังที่ชะตาลิขิตไว้ได้ฤา?#!"

 bookmark_mandalas_867_tanet: "ตะเนตร"
