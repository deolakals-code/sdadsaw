l_english: 
 start_year_1178_10_01_desc:0 "ยุคแห่งสงครามครูเสดดำเนินไปอย่างแท้จริงในปี ค.ศ. 1178 กษัตริย์โบดวงผู้เป็นโรคเรื้อนประทับบนบัลลังก์แห่งราชอาณาจักรครูเสดเยรูซาเลม อาณาจักรที่มีอนาคตไม่แน่นอน เช่นเดียวกับพระองค์เอง ขณะที่สุลต่านองค์ใหม่แห่งอียิปต์ เศาะลาฮุดดีน เตรียมทวงคืนดินแดนศักดิ์สิทธิ์ครั้งสุดท้าย ในขณะเดียวกัน ทางตอนเหนือ จักรวรรดิไบแซนไทน์เผชิญกับการสูญเสียการควบคุมเหนืออนาโตเลียและโอกาสที่ใกล้เข้ามาของจักรพรรดิองค์ใหม่บนบัลลังก์เป็นครั้งแรกในรอบเกือบสี่ทศวรรษ พร้อมด้วยเล่ห์กลทั้งหมดที่ตามมา"
 start_year_1066_09_15_desc:0 "การกลับมาของดาวหางฮัลเลย์เป็นลางบอกเหตุถึงปี ค.ศ. 1066 อันวุ่นวาย เมื่อความขัดแย้งครั้งใหญ่ปะทุขึ้นทั่วโลก ขณะที่พวกเซลจุกรุกคืบเข้าสู่ดินแดนไบแซนไทน์มากขึ้นเรื่อย ๆ และชาวสิงหลลุกฮือต่อต้านผู้กดขี่ในศรีลังกา สงครามเต็มรูปแบบได้ปะทุขึ้นในอังกฤษเมื่อผู้อ้างสิทธิ์สามรายต่างแสวงหามงกุฎเพื่อตนเอง ความตึงเครียดสูงขึ้นในคาบสมุทรไอบีเรียที่แตกแยก ขณะที่ผู้ปกครองชนเผ่าจับตามองความสมดุลของอำนาจที่เปลี่ยนแปลงไปในทวีป ด้วยความกลัวและความโลภเท่า ๆ กัน"
 start_year_867_01_01_desc:0 "ปี ค.ศ. 867 เห็นผู้บุกรุกทางเหนือคุกคามชายฝั่งและริมฝั่งแม่น้ำ ขณะที่ยุโรปยังคงแตกแยกภายใต้ราชวงศ์คาโรลิงเจียน ในอนุทวีปอินเดีย การต่อสู้สามฝ่ายระหว่างราชวงศ์ประติหาร ปาละ และราษฏรกูฏได้คุกรุ่นมานานหลายทศวรรษ แต่ความขัดแย้งยังอยู่ในช่วงเริ่มต้นเท่านั้น"
