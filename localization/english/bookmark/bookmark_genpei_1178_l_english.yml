l_english: 
 bm_1178_genpei: "การผงาดของเหล่าบูชิ"
 bm_1178_genpei_desc: "ทีละเล็กทีละน้อย เหล่าซามูไรได้แย่งชิงอำนาจไปจากเมืองหลวง ปกครองแคว้นต่าง ๆ ของญี่ปุ่นดั่งดินแดนศักดินาของตน สร้างความมั่งคั่งให้แก่ตนเองและเหล่าผู้ติดตาม\n\nหลายทศวรรษที่ผ่านมา ตระกูลมินาโมโตะอันหยิ่งทะนงได้พ่ายแพ้ครั้งแล้วครั้งเล่าแก่ตระกูลไทระผู้มิอาจต้านทาน พวกเขาได้ แต่ซุ่มรักษาตัว ในขณะที่คิโยโมริครอบงำเมืองหลวง บัดนี้ ความกลัวและกำลังคือสิ่งที่ปกครองที่นั่น โดยที่คัมปากุและราชวงศ์ได้ แต่มองดูอย่างสิ้นหนทาง\n\n#bold ตระกูลมินาโมโตะจะสามารถหยุดยั้งการเรืองอำนาจของตระกูลไทระได้หรือไม่ หรือชะตากรรมอื่นใดกำลังรอคอยหมู่เกาะเหล่านี้อยู่?#!"

 bookmark_genpei_yoritomo: "$dynn_Minamoto$ $Yoritomo$"
 bookmark_genpei_yoritomo_subheading: "เจ้าเมืองแห่ง $c_izu$"
 bookmark_genpei_yoritomo_noriyori: "$Noriyori$"
 bookmark_genpei_yoritomo_yoshitsune: "$Yoshitsune$"
 bookmark_genpei_yoritomo_desc: "ตระกูล [Glossary( 'มินาโมโตะสายเซวะ', 'MINAMOTO_GLOSS' )] อันเคยเกรียงไกร ได้เผชิญความปราชัยมิรู้จบ ต้องพ่ายแพ้ให้กับการแก่งแย่งภายใน ในขณะที่คู่ปรับเก่าอย่างตระกูล [Glossary( 'ไทระสายคันมุ', 'TAIRA_GLOSS' )] เข้ามาฉกฉวยผลประโยชน์ไป\n\nเมื่อมินาโมโตะ โยริมาสะ แทบมิได้ต่อต้าน โยริโตโมะและเหล่าบุตรชายผู้รอดชีวิตคนอื่น ๆ ของขุนพลโยชิโตโมะผู้เลื่องชื่อ จึงอาจเป็นเพียงสิ่งเดียวที่ขวางกั้นระหว่างไทระ คิโยโมริ และการครอบงำญี่ปุ่นโดยสิ้นเชิง\n\n#BOLD ในไม่ช้า ตระกูลไทระจะทรงอำนาจเกินกว่าจะต่อต้าน ท่านจะยอมถูกบั่นทอนจนสิ้น หรือจะรวมแผ่นดินให้เป็นหนึ่ง และนำมาซึ่งสันติสุขอันยั่งยืน?#!"

 bookmark_genpei_kiyomori: "$emperor_daijo_daijin_male_japanese_feudal$ $dynn_Taira$ $Kiyomori$"
 bookmark_genpei_kiyomori_subheading: "$BOOKMARK_SUBHEADING_RULING_REGENT$"
 bookmark_genpei_kiyomori_shigemori: "$Shigemori$"
 bookmark_genpei_kiyomori_tsunemori: "$Tsunemori$"
 bookmark_genpei_kiyomori_desc: "ตระกูล [Glossary( 'ไทระสายคันมุ', 'TAIRA_GLOSS' )] ได้สถาปนาตนเองขึ้นอย่างมั่นคงในฐานะตระกูลซามูไรที่ทรงอำนาจที่สุดในญี่ปุ่น หลังจากผลักไสคู่ปรับบูชิอันแข็งกร้าวอย่างตระกูล [Glossary( 'มินาโมโตะ', 'MINAMOTO_GLOSS' )] และตระกูล [Glossary( 'ฟูจิวาระ', 'FUJIWARA_GLOSS' )] ฝ่ายขุนนาง ออกไปจากอำนาจได้สำเร็จ\n\nด้วยการที่ธิดาของเขาได้อภิเษกสมรสกับจักรพรรดิโนริฮิโตะแห่ง [Glossary( 'ยามาโตะ', 'YAMATO_GLOSS' )] คิโยโมริกำลังรอคอยพระนัดดา เจ้าชายสายเลือดไทระผู้มีสิทธิ์ในบัลลังก์จะช่วยตอกย้ำความเป็นใหญ่ของตระกูลเหนือราชสำนัก รากฐานสำคัญแห่งอำนาจนี้จะมิอาจวางลงได้โดยง่าย ตราบใดที่ศัตรูผู้อิจฉาริษยายังคงอยู่รายรอบ\n\n#BOLD ท่านจะสถาปนาอำนาจของตระกูลไทระในญี่ปุ่นให้คงอยู่ตลอดไป หรือจะล้มเหลว ณ ก้าวสุดท้าย?#!"

 bookmark_genpei_motofusa: "$dynn_Fujiwara$ $Motofusa$"
 bookmark_genpei_motofusa_subheading: "$game_concept_governor$ แห่ง $c_oki$"
 bookmark_genpei_motofusa_kanezane: "$Kanezane$"
 bookmark_genpei_motofusa_takatada: "$Takatada$"
 bookmark_genpei_motofusa_desc: "แม้ในนามจะรับใช้ในฐานะ [Glossary( 'ผู้สำเร็จราชการแทน', 'KAMPAKU_GLOSS' )] ตระกูล [Glossary( 'ฟูจิวาระ', 'FUJIWARA_GLOSS' )] ก็ได้ปกครองญี่ปุ่นจากเงามืดมานานหลายศตวรรษ โดยครอบงำระบบขุนนางในเมืองหลวงและสมรสเข้าสู่ราชวงศ์ [Glossary( 'ยามาโตะ', 'YAMATO_GLOSS' )]\n\nทว่า ห่างไกลออกไปจากเมืองหลวง เหล่าซามูไรได้สร้างดินแดนศักดินาส่วนตัวขึ้นมา บัดนี้ ความมั่งคั่งและกำลังรบของพวกเขามีมากเกินกว่าเหล่าขุนนางสูงศักดิ์ เหล่าบูชิที่ทรงอำนาจที่สุด [Glossary( 'ไทระ', 'TAIRA_GLOSS' )] ภายใต้การนำของคิโยโมริ ได้เข้ายึดครองเมืองหลวงแล้ว\n\n#BOLD ท่านจะสามารถหยุดยั้งการผงาดของเหล่าซามูไร และจุดประกายความรุ่งโรจน์ของราชสำนักที่นำโดยฟูจิวาระขึ้นมาใหม่ได้หรือไม่?#!"

 bookmark_genpei_hidehira: "$dynn_Fujiwara$ $Hidehira$"
 bookmark_genpei_hidehira_subheading: "เจ้าเมืองแห่งมุตสึ"
 bookmark_genpei_hidehira_yasuhira: "$Yasuhira$"
 bookmark_genpei_hidehira_hidehisa: "$Hidehisa$"
 bookmark_genpei_hidehira_desc: "ในขณะที่ชาว [Glossary( 'ฟูจิวาระ', 'FUJIWARA_GLOSS' )] ส่วนใหญ่กำลัง แต่งบทกวีในเมืองหลวง เหล่าทายาทของขุนพลฮิเดซาโตะได้ตั้งถิ่นฐานในแดนเหนืออันทุรกันดาร ปราบปรามชนเผ่าต่าง ๆ และแก่งแย่งชิงดีกับเหล่าบูชิอื่น ๆ\n\nปู่ของฮิเดฮิระได้รับการอุปการะจากตระกูลคิโยฮาระ ผู้ปกครองแห่งโอชู ด้วยการทำลายคู่แข่งทั้งหมดในการสืบทอดตระกูลนั้น เขาก็ได้ฟื้นฟูนามฟูจิวาระของตนกลับคืนมา และขยายอำนาจควบคุมเหนือแดนเหนือ\n\n#BOLD ความชะล่าใจในราชสำนักของฟูจิวาระได้ก่อให้เกิดภัยคุกคามจาก [Glossary( 'มินาโมโตะ', 'MINAMOTO_GLOSS' )] และ [Glossary( 'ไทระ', 'TAIRA_GLOSS' )] ดาบเล่มที่พิชิตแดนเหนือ; จะสามารถฟื้นฟูความเป็นใหญ่ของฟูจิวาระได้หรือไม่?#!"

 bookmark_genpei_yoshinaka: "$dynn_Minamoto$ $Yoshinaka$"
 bookmark_genpei_yoshinaka_subheading: "เจ้าเมืองแห่ง $c_shinano$"
 bookmark_genpei_yoshinaka_tomoe: "$Tomoe$ $Gozen$"
 bookmark_genpei_yoshinaka_yoshitaka: "$Yoshitaka_2$"
 bookmark_genpei_yoshinaka_desc: "เนื่องจากความแตกแยกเหนือการนำและการสืบทอดแห่งคาวาจิ [Glossary( 'มินาโมโตะ', 'MINAMOTO_GLOSS' )] บุตรชายคนโต โยชิโตโมะ จึงได้สังหารโยชิคาตะ น้องชายของตน ในการต่อสู้ที่ตามมา\n\nตระกูลนาคาฮาระได้ให้ที่พักพิงแก่บุตรผู้หลบหนีของโยชิคาตะในภูเขาแห่งชินาโนะ และ แม้ว่าโยชิโตโมะอาจสิ้นชีพไปนานแล้ว โยชินากะ ซึ่งบัดนี้เติบใหญ่ ก็ยังมิได้ลืมเลือนสิทธิ์โดยกำเนิดที่สูญเสียไป\n\n#BOLD ท่านจะล้างแค้นให้บิดาต่อโยริโตโมะ ลูกพี่ลูกน้องของท่าน ผู้เป็นทายาทของโยชิโตโมะ หรือจะช่วยเหลือตระกูลในการต่อกรกับศัตรูที่ยิ่งใหญ่กว่า?#!"
