 bm_1178_swords_of_faith: "ดาบแห่งศรัทธา"
 bm_1178_swords_of_faith_desc: "ด้วยแรงขับเคลื่อนจากความศรัทธาทางศาสนาและคำมั่นสัญญาถึงรางวัลทั้งทางโลกและทางธรรม เจ้าชายและยาจกต่างเดินทัพมุ่งหน้าสู่ตะวันออกในนามของพระเจ้า ทองคำ และความรุ่งโรจน์อันเป็นนิรันดร์\n\nสงครามศักดิ์สิทธิ์ของพวกเขา ทำให้ได้มา ซึ่งราชอาณาจักรเยรูซาเลม และบัดนี้ เกือบศตวรรษต่อมา ทายาทของพวกเขาต้องดิ้นรนเพื่อรักษามรดกของเหล่านักรบครูเสดเมื่อต้องเผชิญหน้ากับผู้ปกครองมุสลิมผู้ทรงอำนาจอย่างเศาะลาฮุดดีน ยูซุฟ สุลต่านองค์ใหม่แห่งอียิปต์\n\n#bold นี่คือยุคแห่งสงครามครูเสด ณ ทางแยกของความกระตือรือร้นทางศาสนาและความทะเยอทะยานทางโลก จงเลือกเส้นทางของท่านอย่างชาญฉลาด เพราะรางวัลใดเล่าจะยิ่งใหญ่ไปกว่าดินแดนศักดิ์สิทธิ์?#!"

 bookmark_swords_of_faith_saladin: "เศาะลาฮุดดีน ยูซุฟ"
 bookmark_swords_of_faith_saladin_subheading: "$BOOKMARK_SUBHEADING_DEFAULT$"
 bookmark_swords_of_faith_saladin_saphadin: "ซัยฟุดดีน อะห์มัด"
 bookmark_swords_of_faith_saladin_ali: "อะลี"
 bookmark_swords_of_faith_saladin_desc: "วิเซียร์คนสุดท้ายแห่งฟาฏิมียะฮ์ได้พิสูจน์ตนเองแล้วว่าเป็นผู้สืบทอดที่กระตือรือร้นและมีความสามารถต่อราชวงศ์ที่เขาล้มล้าง แม้จะเพิ่งพ่ายแพ้ต่อกษัตริย์หนุ่มผู้เป็นโรคเรื้อนแห่งเยรูซาเลมก็ตาม\n\nแม้จะได้รับการ แต่งตั้งอย่างเป็นทางการจากเคาะลีฟะฮ์อับบาซียะฮ์ให้เป็นสุลต่านแห่งอียิปต์และซีเรีย ตราบใดที่ทายาทของเหล่านักรบครูเสดยังคงยึดมั่นในการพิชิตของบรรพบุรุษอย่างดื้อรั้น ราชอาณาจักรของเขาก็จะไม่มีวันสมบูรณ์อย่างแท้จริง\n\n#bold ราชวงศ์อัยยูบียะฮ์จะสามารถมีชัยเหนือราชอาณาจักรเยรูซาเลมเพื่อทวงคืนดินแดนศักดิ์สิทธิ์ได้หรือไม่ หรือการล่มสลายของราชวงศ์ใหม่นี้จะมาถึงอย่างกะทันหันเช่นเดียวกับการผงาดขึ้นมา?#!"

 bookmark_swords_of_faith_sibylla: "เจ้าหญิงซีบิลลา"
 bookmark_swords_of_faith_sibylla_subheading: "$BOOKMARK_SUBHEADING_DEFAULT$"
 bookmark_swords_of_faith_sibylla_baudouin: "กษัตริย์โบดวงแห่งเยรูซาเลม"
 bookmark_swords_of_faith_sibylla_baudouin_son: "โบดวง"
 bookmark_swords_of_faith_sibylla_desc: "เยรูซาเลมเคยมีราชินีมาแล้วหนึ่งพระองค์ในประวัติศาสตร์อันสั้น และดูเหมือนว่าในไม่ช้าจะได้เห็นอีกพระองค์หนึ่ง โบดวง พระเชษฐาของซีบิลลา ทรงปกครองอย่างสามารถแม้จะเป็นโรคเรื้อน แต่ก็เป็นเพียงเรื่องของเวลาก่อนที่โรคร้ายจะคร่าชีวิตพระองค์ไป\n\nในฐานะม่ายสาวและทายาทที่ได้รับการยอมรับของพระเชษฐา มือของซีบิลลาเป็นที่ต้องการอย่างมากจากหลายฝ่าย และพันธมิตรที่แข็งแกร่งจะช่วยเสริมสร้างตำแหน่งของนางได้อย่างมาก\n\n#bold ตำแหน่งของเยรูซาเลมนั้นล่อแหลมและกษัตริย์ของเมืองก็อยู่ได้อีกไม่นาน ท่านจะสามารถขึ้นครองบัลลังก์และทำให้แน่ใจว่าอาณาจักรไม่เพียงแต่จะอยู่รอด แต่ยังเจริญรุ่งเรืองได้หรือไม่?#!"

 bookmark_swords_of_faith_levon: "เคานต์เลวอน"
 bookmark_swords_of_faith_levon_subheading: "$BOOKMARK_SUBHEADING_DEFAULT$"
 bookmark_swords_of_faith_levon_roupen: "เจ้าชายรูเพนแห่งซิลิเซีย"
 bookmark_swords_of_faith_levon_desc: "ความตายมาเยือนครอบครัวของเลวอนถึงสองครั้ง: ครั้งแรกมาถึงบิดาของเขา เหยื่อของการทรยศของไบแซนไทน์ และจากนั้นก็กลับมาหาลุงของเขา ผู้ละทิ้งศาสนาที่กดขี่ข่มเหง ซึ่งถูกสังหารโดยข้าราชสำนักของตนเอง เพราะกลัวว่าพวกเขาจะเป็นรายต่อไปที่จะประสบกับความโหดร้ายของเขา\n\nบัดนี้ รูเพน พี่ชายของเลวอน ปกครองในซิลิเซีย ชายผู้มีอารมณ์เยี่ยงนักบุญเป็นประธานในรังอสรพิษแห่งเล่ห์กลและความทะเยอทะยาน และอาจเป็นเพียงเรื่องของเวลาก่อนที่ความตายจะมาเยือนเป็นครั้งที่สาม\n\n#bold ท่านจะสามารถเอาชนะมรดกแห่งความขัดแย้งของครอบครัวและทำให้ซิลิเซียเป็นราชอาณาจักรในสิทธิของตนเองได้หรือไม่?#!"

 bookmark_swords_of_faith_gokbori: "มุซัฟฟัรุดดีน เกิกเบอรี"
 bookmark_swords_of_faith_gokbori_subheading: "$BOOKMARK_SUBHEADING_DEFAULT$"
 bookmark_swords_of_faith_gokbori_ghazi: "ซัยฟุดดีน ฆอซี"
 bookmark_swords_of_faith_gokbori_yusuf: "ซัยนุดดีน ยูซุฟ"
 bookmark_swords_of_faith_gokbori_desc: "ถูกกีดกันจากมรดกของบิดาและถูกเนรเทศเพื่อหลีกทางให้น้องชาย เกิกเบอรีได้มอบดาบและความกล้าหาญให้กับเจ้าชายเซนกิดและได้รับศักดินาใหม่ในฮัรรอน\n\nการรับใช้เจ้าเหนือหัวคนใหม่ของเขานั้นมั่นคง แต่เจ้าชายที่เขารับใช้นั้นป่วยหนักด้วยโรคที่เขาไม่น่าจะรอดชีวิต และเกิกเบอรีรู้ดีว่าความภักดีต้องมีขีดจำกัด และอนาคตที่ไม่แน่นอนมักจะนำมา ซึ่งโอกาส\n\n#bold สุลต่านแห่งอียิปต์ได้พิสูจน์แล้วว่าชายผู้มีความมุ่งมั่นและความสามารถสามารถก้าวขึ้นมาได้ไกลเพียงใด: ท่านจะสามารถดำเนินตามรอยเท้าของเขา และก่อตั้งราชวงศ์ใหม่ของท่านเองได้หรือไม่?#!"

 bookmark_swords_of_faith_raimon: "ดยุกแรมง"
 bookmark_swords_of_faith_raimon_subheading: "$BOOKMARK_SUBHEADING_DEFAULT$"
 bookmark_swords_of_faith_raimon_eschiva: "เอสชีวา"
 bookmark_swords_of_faith_raimon_desc: "ถูกพรากบิดาไปตั้งแต่อายุยังน้อยโดยมือสังหารนิซารี แรมงได้ต่อสู้กับผู้บุกรุกชาวเติร์กเมนตั้งแต่อายุสิบเจ็ด จ้างโจรสลัดเพื่อปล้นสะดมชายฝั่งไบแซนไทน์ และทนทุกข์ทรมานจากการถูกจองจำเกือบทศวรรษในคุกเซนกิด\n\nเมื่อได้รับการปล่อยตัว เขาเป็นตัวเลือกที่เป็นธรรมชาติในฐานะผู้สำเร็จราชการแทนกษัตริย์เด็ก โบดวง แต่ชายหนุ่มผู้เป็นโรคเรื้อนผู้นั้นบัดนี้บรรลุนิติภาวะแล้ว และแรมงได้กลับไปยังดินแดนของตนเพื่อพิจารณาอนาคตของราชอาณาจักร เช่นเดียวกับอนาคตของตนเอง\n\n#bold ท่านได้ลิ้มรสและสละอำนาจของกษัตริย์ และท่านยังคงเป็นเสาหลักของอาณาจักร ท่านจะทำอย่างไรกับอิทธิพลของท่าน?#!"

 #EVENTS
 bookmark.0300.t: "บุตรแห่งบิดา?"
 bookmark.0300.desc: "สามีผู้ล่วงลับของข้า [dead_husband.GetFirstName] สิ้นใจไปหลายเดือนก่อนที่บุตรชายของเราจะเกิด เด็กคนนี้จะไม่มีวันได้รู้จักบิดาของตน และระยะทางไม่น้อยที่แยกเขากับญาติฝ่ายบิดา\n\nแม้บิดาของเขาจะใจกว้างและกล้าหาญเพียงใด การสมรสของเรา #italic ก็#! สั้นนัก และชื่อของเขาก็แทบไม่มีน้ำหนักที่นี่...\n\nหาก [baby_baudouin.GetFirstName] จะได้สวมมงกุฎบนศีรษะในวันหนึ่ง ก็อาจเป็นประโยชน์ต่อเขาหากข้าปล่อยให้ความทรงจำเกี่ยวกับบิดาของเขาเลือนหายไป และเลี้ยงดูเขาตามประเพณีของสายเลือดราชวงศ์ของข้าแทน"
 bookmark.0300.a: "ข้าจะเลี้ยงดู [baby_baudouin.GetFirstNameNoTooltip] ให้คิดว่าตนเองเป็นชาว [ROOT.Char.GetHouse.GetBaseNameNoTooltip] ก่อน"
 bookmark.0300.b: "ไม่ เราควรให้เกียรติความทรงจำของ [dead_husband.GetFirstNamePossessiveNoTooltip]"
 bookmark.0300.b.tt: "#warning @warning_icon! ตัวเลือกนี้จะทำให้ท่านมี [player_heir|E] ที่ไม่ได้อยู่ในราชวงศ์ของท่าน!#!"
