 #EVENTS
 bookmark.0101.t:0 "นามนั้นสำคัญไฉน?"
 bookmark.0101.desc_intro:0 "เป็นเวลาหลายชั่วอายุคนแล้วที่ [hausaland.GetNameNoTier] ถูกปกครองโดยมากาจิยา สายเลือดของผู้ปกครองฝ่ายหญิง ซึ่งข้าเป็นคนล่าสุด\n\nประเพณีของเราได้รับใช้เรามาอย่างดี แต่โลกกำลังเปลี่ยนแปลง การกระทำอันกล้าหาญของ [ROOT.Char.Custom2('RelationToMeShort', bayajidda)] ของข้า [bayajidda.GetFirstName] ทำให้ [bayajidda.GetSheHe] ได้รับความมั่งคั่งและความเคารพอย่างใหญ่หลวง... แม้ว่า [bayajidda.GetSheHe] จะมาจากดินแดนอันห่างไกล ความสำเร็จของ [bayajidda.GetHerHis] ก็ยังบ่งบอกถึงการเปลี่ยนแปลงครั้งใหญ่สำหรับผู้คนของข้า\n\n"
 bookmark.0101.desc_living:1 "บุตรชายของข้า [bewo.GetTitledFirstName] เป็นแก้วตาดวงใจของบิดา แม้จะเป็นเพียงทารก ข้าสงสัยว่าเขาจะผูกพันกับบิดานักผจญภัยของเขา หรือมรดกตามประเพณีของข้ามากกว่ากัน?"
 bookmark.0101.desc_dead:1 "บุตรชายของข้า [bewo.GetTitledFirstName] เคยเป็นแก้วตาดวงใจของบิดา แม้จะเป็นเพียงทารก ข้าสงสัยว่าเขาจะผูกพันกับตำนานของบิดานักผจญภัยของเขา หรือมรดกตามประเพณีของข้ามากกว่ากัน?"
 bookmark.0101.a:1 "[bewo.GetFirstNameNoTooltip] ต้องสืบทอดประเพณีของชาว [ROOT.Char.GetCulture.GetNameNoTooltip] สู่ยุคใหม่"
 bookmark.0101.a.tt:1 "[bewo.GetUIName] จะกลายเป็น [player_heir|E] ของท่าน"
 bookmark.0101.b:1 "บุตรชายก็คือบุตรชาย ไม่ว่าชื่อหรือวัฒนธรรมของเขาจะเป็น เช่นไร"
 bookmark.0101.b.tt:1 "#warning @warning_icon! ตัวเลือกนี้อาจทำให้ท่านไม่มี [player_heir|E]!#!"
 bookmark.0101.c:0 "เหล่ามากาจิยาไม่ต้องการบุรุษเพื่อสืบทอดมรดก!"
 bookmark.0101.c.tt:1 "น้องสาวของท่าน [shawata.GetUIName] จะยังคงเป็น [player_heir|E] ของท่าน"

 # Credit to Stu Taylor of Dead Good Comics for the title line and entire lead-in to this event.
 bookmark.0211.t: "เพื่อรำลึกถึงรสนิยมอันดีของท่าน"
 # Historically, both of Michael's hands were severed — we don't have a portrait modifier for that, I'm afraid, so we pretend it was just the one.
 bookmark.0211.desc: "ศพของ [michael.GetFirstNamePossessive] นอนขดอยู่บนพื้นเบื้องหน้าข้า เลือดที่พุ่งออกมาในตอนแรกจากแขนขาที่ถูกตัดขาดของเขา บัดนี้ไหลช้าลงจนแทบจะหยด เป็นค่ำคืนที่ดี แม้ว่าเราจะ [Glossary( 'ลงมือก่อนกำหนด', 'BOOKMARK_0211_MICHAEL_III_DEATH_GLOSS' )] ก็ตาม\n\n#EMP จักรพรรดิ#! อาวุโส เฮอะ ไอ้โง่เขลาเบาปัญญาที่ไร้ทั้งพรสวรรค์และความกล้าในการเมือง มีข้อได้เปรียบทุกอย่างที่พระเจ้าประทานให้บุรุษได้ แต่เขาก็ยังสูญเสียทุกสิ่งให้กับคนไร้ชื่อจากหัวเมือง\n\nไม่ใช่ว่าข้าเป็นเพียงคนหัวเมืองอีกต่อไปแล้ว นับ แต่คืนนี้ ข้าคือ #EMP จักรพรรดิ#! [basil.GetTitledFirstName] ปฐมกษัตริย์แห่งราชวงศ์ [basil.GetDynasty.GetName] อันรุ่งโรจน์อย่างแน่นอน\n\nขณะดื่มไวน์หยดสุดท้ายจากถ้วย — หนึ่งในไวน์โปรดของ [michael.GetFirstNamePossessiveNoTooltip] — ข้าครุ่นคิดว่าประวัติศาสตร์จะจดจำชายหนุ่มผู้นี้อย่างไร ข้าจะ #EMP อนุญาต#! ให้ประวัติศาสตร์จดจำเขาอย่างไร"
 bookmark.0211.a: "เขาตายอย่างคนขี้เมา เขาก็จะยังคงเป็นคนขี้เมา!"
 bookmark.0211.a.flavour: "ท่านและทายาทของท่านจะใส่ร้ายป้ายสี [michael.GetFirstNameNoTooltip] ไปอีกหลายทศวรรษหลังความตายของเขา ทำให้เขาดูเป็นคนขี้เมาและคนเสเพล"
 bookmark.0211.b: "คนโง่นั่นมอบครอบครัว บัลลังก์ และชีวิตให้ข้า แค่นั้นก็พอแล้ว"
 bookmark.0211.b.flavour: "ท่านปล่อยให้ชื่อเสียงของ [michael.GetFirstNamePossessiveNoTooltip] ฟื้นคืน โดยยกย่องการฟื้นฟูการนับถือรูปเคารพของมารดาในระหว่างที่นางสำเร็จราชการแทนเขาว่าเกือบจะเป็นดั่งนักบุญ"
 bookmark.0211.c: "นี่เป็นเหล้าองุ่นชั้นดีเป็นพิเศษจริง ๆ..."
 bookmark.0211.c.flavour: "ท่านปล่อยให้ความทรงจำเกี่ยวกับ [michael.GetFirstNamePossessiveNoTooltip] เลือนหายไปตามกาลเวลา — ส่วนใหญ่"
 BOOKMARK_0211_MICHAEL_III_DEATH_GLOSS: "ตามประวัติศาสตร์ ไมเคิลที่ 3 ถูกลอบสังหารเมื่อวันที่ 24 กันยายน ปี 867 แทนที่จะเป็นวันที่ 31 ธันวาคม ปี 866 วันที่สวรรคตของพระองค์ถูกเลื่อนมาข้างหน้าในเกม Crusader Kings 3 ด้วยเหตุผลด้านเกมเพลย์"

