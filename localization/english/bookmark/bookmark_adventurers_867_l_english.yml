 #Almos Arpad 
 bookmark_adventurers_almos_arpad:0 "อาลโมช อาร์ปาด"
 bookmark_adventurers_almos_arpad_subheading: "$BOOKMARK_SUBHEADING_KHAN_WITH_THE$"
 bookmark_adventurers_almos_arpad_desc:0 "เมื่อเจ็ดชนเผ่าฮังการีรวมตัวกันเพื่อเลือกผู้นำสูงสุด พวกเขาลงคะแนนให้อาลโมชผู้กล้าหาญ วันหนึ่ง อาร์ปาด บุตรชายของเขา จะรับช่วงต่อบทบาทนี้ — แต่ก็ต่อเมื่อชาวฮังการีสามารถรักษาเอกราชไว้ได้ ภัยอันตรายปรากฏขึ้นที่ขอบฟ้าตะวันออก\n\n#bold ท่านจะสามารถปกป้องชาวฮังการีและนำพวกเขาไปสู่ความยิ่งใหญ่ได้หรือไม่? นี่คือโอกาสของท่านที่จะเล่าขานการผจญภัยของราชวงศ์อาร์ปาดอีกครั้ง!#!"

 #Daurama Daura
 bookmark_adventurers_daurama_daura:0 "เดารามา เดารา"
 bookmark_adventurers_daurama_daura_subheading: "$BOOKMARK_SUBHEADING_DEFAULT$"
 bookmark_adventurers_daurama_daura_desc:0 "ในฐานะมากาจิยาองค์สุดท้ายแห่งเดารา เดารามาคือสัญลักษณ์แห่งวิถีดั้งเดิมของชาวเฮาซา บายาจิดดา สามีใหม่ของนาง (เดิมมาจากอิรัก) เป็นตัวแทนของการเปลี่ยนแปลง เมื่อคนนอกจำนวนมากขึ้นเรื่อย ๆ หลั่งไหลเข้ามายังดินแดนเฮาซา นำพาความเชื่อและวัฒนธรรมอันแปลกประหลาดติดตัวมาด้วย...\n\n#bold เดารามาถูกกำหนดให้จารึกในประวัติศาสตร์ว่าเป็นมากาจิยาองค์สุดท้าย แต่นางจำเป็นต้องเป็นเช่นนั้นหรือไม่?!#!"

