l_english: 
 bm_867_adventurers:0 "เหล่านักผจญภัยผู้ยิ่งใหญ่"
 bm_867_adventurers_desc:0 "ทุกราชวงศ์ล้วนมีจุดเริ่มต้นอันต่ำต้อย การไต่เต้าสู่อำนาจมักเป็นกระบวนการที่เชื่องช้า แต่ละชั่วอายุคนขยับขึ้นบันไดไปทีละขั้น ผ่านการ แต่งงานที่วางแผนอย่างรอบคอบและสงครามที่ไม่หยุดหย่อน\n\n#bold ทว่านี่คือยุคแห่งความเปลี่ยนแปลงและความวุ่นวายครั้งใหญ่ ด้วยความกล้าหาญอย่างยิ่ง และอาจรวมถึงโชคช่วยเล็กน้อย วีรบุรุษอาจสามารถยกระดับชื่อเสียงวงศ์ตระกูลจากไร้คนรู้จักสู่ตำนานได้ ท่านพร้อมรับความท้าทายนี้แล้วหรือไม่?!#!"


 #Jarl Haesteinn
 bookmark_adventurers_jarl_haesteinn:0 "ยาร์ลแฮสไตน์"
 bookmark_adventurers_jarl_haesteinn_subheading: "$BOOKMARK_SUBHEADING_DEFAULT$"
 bookmark_adventurers_jarl_haesteinn_desc:0 "ด้วยความหลักแหลมและความกล้าหาญ ยาร์ลแฮสไตน์ได้กลายเป็นบุรุษผู้มั่งคั่ง หลังจากนำการปล้นสะดมอันมั่งคั่งผ่านทะเลเมดิเตอร์เรเนียนร่วมกับบียอร์น ไอออนไซด์ แฮสไตน์ได้ตั้งรกรากในบริตตานี พวกแฟรงก์มีคลังสมบัติพร้อมให้ปล้นสะดม และนักรบไวกิ้งผู้ยิ่งใหญ่ย่อมเป็นพันธมิตรชั้นยอดในยามที่การเมืองวุ่นวาย\n\n#bold อย่างไรก็ตาม โชคลาภมิได้มาโดยปราศจากศัตรู ความโลภของแฮสไตน์จะนำภัยมาสู่ตัวเขา หรือราชวงศ์ของเขาจะเจริญรุ่งเรืองภายใต้การชี้นำของท่าน?#!"

 bookmark_adventurers_jarl_haesteinn_alt_ragnarr:0 "$Ragnarr$"
 bookmark_adventurers_jarl_haesteinn_alt_ragnarr_desc:0 "คำอธิบายทางเลือก"

 #Rurik Rurikid
 bookmark_adventurers_rurik_rurikid:0 "รูริค รูริคิด"
 bookmark_adventurers_rurik_rurikid_subheading: "$BOOKMARK_SUBHEADING_DEFAULT$"
 bookmark_adventurers_rurik_rurikid_desc:0 "น้อยคนนักที่จะผงาดจากความว่างเปล่าสู่ความยิ่งใหญ่ได้ เช่นรูริคผู้กล้าหาญ! เขาร่วมกับพี่น้องนำระเบียบมาสู่ดินแดนรกร้างทางตะวันออก และนับตั้งแต่การตายของพวกเขา เขาก็เป็นผู้ปกครอง แต่เพียงผู้เดียวของเขตปกครองอันยิ่งใหญ่ กระนั้น นี่เป็นเพียงจุดเริ่มต้น\n\n#bold วันหนึ่ง ทายาทของรูริคจะก่อตั้งอาณาจักรซาร์แห่งรัสเซีย หรือพวกเขาจะไม่ทำเช่นนั้น? ชะตากรรมของราชวงศ์อันยิ่งใหญ่นี้อยู่ในมือของท่าน#!"

 bookmark_adventurers_rurik_rurikid_alt_helgi:0 "$Helgi$ $nick_the_seer$"

 #Eudes Capet
 bookmark_adventurers_count_eudes:0 "เคานต์เออเดอ"
 bookmark_adventurers_count_eudes_subheading: "$BOOKMARK_SUBHEADING_DEFAULT$"
 bookmark_adventurers_count_eudes_desc:0 "ในเดือนกรกฎาคม ปี 866 นักปล้นสะดมไวกิ้ง แฮสไตน์ ได้สังหารโรแบร์ผู้แข็งแกร่ง บิดาของเออเดอ เพียงไม่กี่เดือนต่อมา อาเดลาอิส มารดาของเขา สิ้นใจขณะให้กำเนิดโรแบร์ น้องชายของเขา โลกช่างโหดร้ายและอนาคตอาจดูไม่แน่นอน แต่เด็กกำพร้าเหล่านี้ถูกลิขิตให้นั่งบนบัลลังก์ฝรั่งเศส ทายาทของพวกเขา ราชวงศ์กาเปเซียง จะปกครองฝรั่งเศสไปอีกหลายศตวรรษ\n\n#bold ท่านจะสามารถฝ่าฟันการเมืองอันตรายของฝรั่งเศสยุคกลางและบรรลุชะตากรรมของพี่น้องโรแบร์แต็งได้หรือไม่?#!"

