 bm_1178_china: "ใต้หล้าวุ่นวาย"
 bm_1178_china_desc: "แผ่นดินจีนแตกสลาย โอรสสวรรค์ถูกขับไล่ออกจากที่ราบภาคกลางโดยผู้รุกรานชาวจูร์เชน และเหล่าเสาหลักของจักรวรรดิกลับเลือกที่จะดำเนินนโยบายประนีประนอมอันน่าอดสู แทนที่จะทวงคืนดินแดนของบรรพบุรุษ\n\nเหล่าอธรรมดั่งเสือสิงห์คอยข่มเหง และสายน้ำนองไปด้วยโลหิตของผู้ทรงธรรม การที่ปล่อยให้ชะตากรรมอันเลวร้าย เช่นนี้เกิดขึ้นแก่อาณาจักร ย่อมเป็น เพราะสวรรค์มิโปรดปรานอย่างใหญ่หลวง\n\n#bold เหล่าประชาราษฎร์ร่ำร้องเรียกหาวีรบุรุษเพื่อยุติความโกลาหลนี้ - ผู้ใดเล่าจะขานรับ?#!"

 bookmark_china_1178_xin_qiji: "ผู้ตรวจการซินชี่จี๋"
 bookmark_china_1178_xin_qiji_subheading: "$BOOKMARK_SUBHEADING_GOVERNOR$"
 bookmark_china_1178_xin_qiji_desc: "ซินชี่จี๋กำพร้าบิดามารดา แต่เยาว์วัย และได้รับการเลี้ยงดูจากปู่ของเขา ผู้ ซึ่งปลูกฝังความปรารถนาอันแรงกล้าที่จะขับไล่ผู้รุกรานชาวจูร์เชนออกจากที่ราบภาคกลาง\n\nซินชี่จี๋สร้างชื่อเสียงขึ้นมาหลังจากการล้างแค้นให้ผู้บังคับบัญชาที่ถูกลอบสังหาร ทว่าความสำเร็จของเขาก็จบลงเพียงเท่านั้น - ความใฝ่ฝันของเขาที่จะผลักดันคลื่นชาวจูร์เชนกลับไปนั้นถูกขัดขวางครั้งแล้วครั้งเล่าด้วยนโยบายประนีประนอมของราชวงศ์ซ่ง\n\n#bold ซินชี่จี๋จะสามารถทวงคืนแดนเหนือได้สำเร็จ หรือเขาจะหันเหพลังของตนไปสู่ความพยายามอื่นใด?#!"

 bookmark_china_1178_zhang_shi: "เจ้าเมืองจางซื่อ"
 bookmark_china_1178_zhang_shi_subheading: "$BOOKMARK_SUBHEADING_MILITARY_GOVERNOR$"
 bookmark_china_1178_zhang_shi_desc: "จางซื่อเป็นบุตรของวีรบุรุษทหาร เขาเป็นทั้งปราชญ์และนักปรัชญาผู้ปรีชาสามารถ เทียบเท่ากับบิดาของเขาที่เป็นขุนพล\n\nแม้ว่าเขาจะได้รับความเคารพนับถือจากงานเขียน แต่ ทว่าอนาคตทางการเมืองของเขากลับไม่แน่นอน เนื่องมาจากการสนับสนุนอย่างแรงกล้าที่จะทวงคืนดินแดนทางเหนือจากราชวงศ์จิน ซึ่งเป็นแนวคิดที่ไม่เป็นที่ชื่นชอบอย่างยิ่งในหมู่ผู้ที่ต้องการสันติภาพมากกว่าสงคราม\n\n#bold จางซื่อจะเป็นผู้หนึ่งที่ขับเคลื่อนโลก หรือเขาจะเป็นเพียงผู้หนึ่งที่เคลื่อนไปตามโลก... ดั่งเช่นคนอื่นอีกมากมาย?#!"

 bookmark_china_1178_zhu_xi: "เจ้าเมืองจูซี"
 bookmark_china_1178_zhu_xi_subheading: "$BOOKMARK_SUBHEADING_GOVERNOR$"
 bookmark_china_1178_zhu_xi_desc: "จูซีมีชื่อเสียงเลื่องลือว่าเป็นอัจฉริยะ แต่เยาว์วัย และได้พิสูจน์แล้วว่าความสำเร็จของเขานั้นมิใช่เพียงชื่อเสียงอันฉาบฉวย - เขาละทิ้งแนวคิดของลัทธิเต๋าและศาสนาพุทธ อุทิศตนให้กับการศึกษาปรัชญาขงจื๊อ ปัจจุบันงานเขียนของเขาได้รับการเผยแพร่อย่างกว้างขวาง ขณะที่เหล่าบัณฑิตผู้มุ่งมาดต่างแข่งขันกันเพื่อสิทธิ์ในการเข้ารับฟังการบรรยายของเขา\n\n#bold ด้วยชื่อเสียงอันเลื่องลือจากงานเขียนและการครุ่นคิดเชิงปรัชญา บางทีการแสวงหาอำนาจอาจจะช่วยให้จูซีอยู่ในจุดที่สามารถสร้างสังคมในอุดมคติของเขาให้เป็นจริงได้ดีกว่า?#!"

 bookmark_china_1178_li_renxiao: "จักรพรรดิเอิงเหว่ยหมี่ เหรินเซี่ยว"
 bookmark_china_1178_li_renxiao_subheading: "$BOOKMARK_SUBHEADING_DEFAULT$"
 bookmark_china_1178_li_renxiao_desc: "หลังจากการครองราชย์มาเกือบสี่ทศวรรษ ประชาราษฎร์ของเหรินเซี่ยวต่างก็โอ้อวดว่ารัชสมัยของพระองค์นั้นยิ่งใหญ่และรุ่งเรืองที่สุดเท่าที่อาณาจักรตันกุตเคยมีมา ทว่า แม้ปัจจุบันจะรุ่งโรจน์เพียงใด อนาคตของพวกเขากลับเต็มไปด้วยความไม่แน่นอนยิ่งกว่า\n\nเป็นเวลาไม่ถึงสิบปีนับตั้งแต่ที่เหรินเซี่ยวได้ประหารชีวิตอัครเสนาบดีและเหล่าขุนพลของตนเองอันเป็นผลพวงมาจากกบฏที่ล้มเหลว และความสัมพันธ์ระหว่างองค์กษัตริย์และกองทัพก็ไม่เคยเป็นเหมือนเดิมอีกเลยนับ แต่นั้น\n\n#bold ท่านจะสามารถปกป้องอาณาจักรเซี่ยอันยิ่งใหญ่จากการรุกรานของเหล่าเพื่อนบ้านได้หรือไม่?#!"

 bookmark_china_1178_tudan_xixian: "ผู้บัญชาการถูตานซีเสียน"
 bookmark_china_1178_tudan_xixian_subheading: "$BOOKMARK_SUBHEADING_GOVERNOR$" #meritorcatic khan
 bookmark_china_1178_tudan_xixian_desc: "ซีเสียนเป็นทายาทแห่งหนึ่งในตระกูลจูร์เชนที่สูงศักดิ์ที่สุด และเป็นราชบุตรเขยแห่งราชวงศ์จิน ชาติกำเนิดของซีเสียนนั้นไร้ที่ติ เฉก เช่นเดียวกับความสามารถในการยิงธนูและขี่ม้าของเขา\n\nเขาเป็นคนพูดน้อย ยึดมั่นในคุณธรรม และเชี่ยวชาญในกิจการสงคราม ชื่อเสียงของเขานั้นเลื่องลือถึงขั้นกล่าวกันว่า เขาทรงพลังเทียบเท่ากับกองทัพหนึ่งหมื่นนาย\n\n#bold ราชวงศ์จินได้เข้ายึดครองที่ราบภาคกลางแล้ว แต่ดินแดนทางใต้ยังคงอยู่ ผู้ใดเล่าจะเหมาะสมไปกว่ายอดขุนพลชาวจูร์เชนผู้นี้ที่จะพิชิตแผ่นดินให้เสร็จสิ้น?#!"
