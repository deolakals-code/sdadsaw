 # Bookmark
 bm_867_iberia:1 "การต่อสู้เพื่อไอบีเรีย"
 bm_867_iberia_desc:3 "มหาอำนาจเก่าแก่แห่งไอบีเรียกำลังแตกสลาย\n\nทางตอนเหนือ อัสตูเรียสเต็มไปด้วยข้าในบังคับผู้ทะเยอทะยาน พยายามดิ้นรนเพื่อเป็นอิสระ\n\nทางตอนใต้ อัลอันดะลุสทวีความแข็งแกร่ง แต่เผชิญกับเสียงกระซิบกระซาบแห่งความไม่พอใจ เขตทหารชายแดนพึมพำถึงความเป็นอิสระและเล่ห์กลอุบายรบกวนราชวงศ์อุมัยยะฮ์ผู้ปกครอง\n\nมหาอำนาจต่างชาติผู้หิวโหยจับจ้องดินแดนอันอุดมสมบูรณ์ของไอบีเรียด้วยความโลภ\n\n#bold การต่อสู้ที่สั่งสมมานานหลายศตวรรษ $game_concept_iberian_struggle$ กำลังเข้าสู่ช่วงใหม่ และไม่ว่ามันจะจบลงด้วยเลือดหรือภราดรภาพ ก็ขึ้นอยู่กับการทอยลูกเต๋า#!"
 war_867_Vimara_conquest_Portucale:0 "สงครามเพื่อ [claim|E] ของวีมาราเหนือ $d_porto$"
 war_Andalusian_Rebellion:0 "กบฏเขตชายแดน"

 # Wilfred the Hairy
 bookmark_fp2_iberia_wilfred_the_hairy:0 "$GuifrE_$ $nick_the_hairy$"
 bookmark_fp2_iberia_wilfred_the_hairy_subheading: "$BOOKMARK_SUBHEADING_DEFAULT$"
 bookmark_fp2_iberia_sunyer:0 "$Sunyer$"
 bookmark_fp2_iberia_bernat_of_gothia:0 "$Bernat$"
 bookmark_fp2_iberia_wilfred_the_hairy_desc:0 "เมื่อบิดาและลุงของเขาถูกสังหารโดยดยุกแห่งตูลูส กษัตริย์แฟรงก์ก็ยึดดินแดนของพวกเขาไป ทิ้งให้ $GuifrE_$ และญาติ ๆ ของเขาตกอยู่ในความยากจนข้นแค้น\n\nยี่สิบปีผ่านไป กงล้อแห่งโชคชะตาหมุนเวียน $GuifrE_$ ได้รับการ แต่งตั้งกลับคืนสู่ดินแดนของบิดา ญาติผู้มีเล่ห์เหลี่ยมของเขาก็ได้สิทธิ์โดยกำเนิดกลับคืนมา เช่นกัน และเจ้าเหนือหัวคนใหม่ของพวกเขาก็เป็นญาติกับชายผู้สังหารบิดามารดาของพวกเขา\n\n#bold ท่านรู้ดีกว่าใครว่าโชคชะตาสามารถเปลี่ยนแปลงได้ในพริบตา และปรารถนารางวัลที่มั่นคงกว่า — $d_barcelona$#!"

# Lupp ibn Musa / Lope Musez
 bookmark_fp2_iberia_lupp_ibn_musa:1 "$Lubb$ มูเซซ"
 bookmark_fp2_iberia_lupp_ibn_musa_subheading: "$BOOKMARK_SUBHEADING_DEFAULT$"
 bookmark_fp2_iberia_lupp_ibn_musa_desc:0 "ราชวงศ์บานูกอซีอันทรงอำนาจ บุตรแห่งกัสซิอุส ครั้งหนึ่งเคยครอบครองหุบเขาเอโบรทั้งหมด แต่ช่วงเวลาที่ยากลำบากได้มาเยือนพวกเขานับตั้งแต่รัชสมัยของบิดาผู้รุ่งโรจน์ของ $Lubb$ และบานูมูซาที่เพิ่งเปลี่ยนชื่อใหม่ทำได้เพียงพึมพำและเลียแผลจากที่นั่งอันเก่าแก่ของพวกเขาที่ตูเดลา วางแผนที่จะกอบกู้อาณาเขตทางใต้ของตนคืนมา\n\n#bold ท่านจะสามารถยึดคืนสิ่งที่เคยเป็นของบานูกอซีและนำราชวงศ์กลับคืนสู่ความรุ่งโรจน์ในอดีตได้หรือไม่?#!"

