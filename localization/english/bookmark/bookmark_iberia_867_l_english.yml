 bookmark_fp2_iberia_ibn_marwan:0 "อิบน์ มัรวาน"
 bookmark_fp2_iberia_ibn_marwan_subheading: "$BOOKMARK_SUBHEADING_DEFAULT$"
 bookmark_fp2_iberia_ibn_marwan_desc:1 "อับดุลเราะห์มาน อิบน์ มัรวาน ผู้มีหัวใจเป็นกบฏ มีความสัมพันธ์ที่วุ่นวายกับเจ้าเหนือหัวของเขา สุลต่านอุมัยยะฮ์ แต่ได้รับการสนับสนุนอย่างแข็งขันจากชาวโมซาราบิกในอาณาเขตของเขา และในความเป็นจริงอาจมีความเหมือนกันกับพวกเขาและศรัทธาของพวกเขามากกว่า เขาได้สร้างฐานที่มั่นในบาดาโฆซ แต่ทางตะวันตก ตระกูลบานูดานิสผู้คลั่งไคล้ศาสนาก็ต่อต้านการปกครองของเขาเหนือมาร์ชตอนล่างมากขึ้นเรื่อย ๆ\n\n#bold พันธมิตรกับอัลฟองโซที่ 3 กษัตริย์ผู้ฉวยโอกาสเสมอของอัสตูเรียส จะช่วยให้ท่านได้รับมงกุฎเป็นของตนเองได้หรือไม่?#!"
 bookmark_fp2_iberia_ibn_marwan_alt_surunbaqi:0 "เอมีร์ ซะอ์ดูน แห่งปอร์โต"
 bookmark_fp2_iberia_ibn_marwan_alt_rahman:0 "อับดุลเราะห์มาน"

 bookmark_fp2_iberia_adanis_ibn_awsaga:0 "เอมีร์ อะดานิส"
 bookmark_fp2_iberia_adanis_ibn_awsaga_subheading: "$BOOKMARK_SUBHEADING_DEFAULT$"
 bookmark_fp2_iberia_adanis_ibn_awsaga_desc:0 "ราชวงศ์บานูดานิสชาวเบอร์เบอร์ ซึ่งได้รับมอบหมายจากสุลต่านอุมัยยะฮ์ให้ปกป้องชายฝั่งตะวันตกจากการบุกปล้นของไวกิ้ง ได้เติบโตอย่างรวดเร็วทั้งในด้านอิทธิพลและอำนาจ เอมีร์ อะดานิส ได้สร้างป้อมปราการที่แข็งแกร่งในอัลกาเซร์และกูอิงบรา แต่กังวลเกี่ยวกับชาวโมซาราบิกภายใต้การปกครองของเขา ซึ่งอยากจะเข้าข้างศัตรูตัวฉกาจของเขา อิบน์ มัรวาน มากกว่า\n\n#bold ท่านจะสามารถรักษาดินแดนของท่านและนำชาวเบอร์เบอร์ไปสู่อนาคตอันยิ่งใหญ่ในอัลอันดะลุสได้หรือไม่?#!"
 bookmark_fp2_iberia_ibn_awsaga_alt_masud:0 "มัสอูด อิบน์ อะดานิส"
 bookmark_fp2_iberia_ibn_awsaga_alt_yahya:0 "ยะห์ยา อิบน์ อะดานิส"
