 #Mendo Guterres of Santiago
 bookmark_fp2_iberia_mendo_guterres:0 "เคานต์ $Hermenexildo$ กูเตียเรซ"
 bookmark_fp2_iberia_mendo_guterres_subheading: "$BOOKMARK_SUBHEADING_DEFAULT$"
 bookmark_fp2_iberia_mendo_guterres_desc:0 "$Hermenexildo$ ข้าในบังคับผู้ทรงอำนาจของกษัตริย์อัลฟองโซที่ 3 ควบคุมดินแดนทางตอนใต้ของกาลิเซียด้วยการบริหารที่ไร้ที่ติ ความจงรักภักดีอย่างไม่มีข้อกังขาต่อกษัตริย์ของเขาได้ช่วยให้เขาขยายอาณาเขตบรรพบุรุษของตระกูล – แต่นั่นเพียงพอแล้วหรือ?\n\n#bold ด้วยความสนใจที่เพิ่มขึ้นในภาคใต้ ท่านจะสามารถพิชิตดินแดนปูร์ตูกาเลและเริ่มต้นหนึ่งในราชวงศ์ที่มีอิทธิพลมากที่สุดได้หรือไม่?#!"

