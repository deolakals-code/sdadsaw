 bm_867_china: "สารทแห่งคุณธรรม"
 bm_867_china_desc: "เป็นเวลากว่าสองศตวรรษครึ่ง ที่ราชวงศ์ถังผู้ยิ่งใหญ่ได้ปกครองแผ่นดินจีน ในช่วงเวลานั้น ราชวงศ์ได้ประสบและยืนหยัดผ่านความขัดแย้งใหญ่หลวงและภัยพิบัตินับไม่ถ้วน โดยเฉพาะอย่างยิ่งการกบฏที่คร่าชีวิตผู้คนสุดคณานับ ทว่าราชวงศ์ก็ยังคงอยู่รอด และกระทั่งเจริญรุ่งเรือง\n\nทว่าการอยู่รอดนั้นย่อมมีราคาที่ต้องจ่าย เพื่อการปกป้องจักรวรรดิที่ดียิ่งขึ้น ราชวงศ์ถังได้พระราชทานอำนาจพิเศษแก่เหล่าผู้ว่าการทหาร ผู้ ซึ่งในอิสรภาพที่เพิ่งได้รับมาใหม่ ได้เห็นโอกาสในการก่อตั้งรัฐของตนเอง แคว้นเผด็จการย่อยๆ ที่ภักดีต่อบัลลังก์ แต่เพียงในนาม\n\n#bold แม้เพียงใบไม้ใบร่วงหล่นก็อาจเป็นสัญญาณแห่งสารทกาลที่กำลังจะมาถึง ผู้มีปัญญาย่อมแสวงหาความอบอุ่นและที่พักพิงจากเหมันต์ที่ใกล้เข้ามา ส่วนผู้กล้าย่อมวางแผนการ#!"

 bookmark_china_867_huang_chao: "หวง เฉา"
 bookmark_china_867_huang_chao_subheading: "$BOOKMARK_SUBHEADING_LANDLESS_ADMIN$"
 bookmark_china_867_huang_chao_desc: "ถือกำเนิดในตระกูลผู้ลอบค้าเกลือมาช้านาน หวง เฉา จึงมีความกล้าบ้าบิ่นและความมั่งคั่งที่ได้มาจากชีวิตนอกกฎหมาย แต่กระนั้น เขาก็ยังคงโหยหาสิ่งหนึ่งที่เขาไม่เคยได้มา – นั่นคือสถานะที่มาพร้อมกับตำแหน่งข้าราชการ\n\nแม้จะพยายามอย่างที่สุด แต่เขาก็ไม่สามารถผ่านการสอบหลวงได้ ในทุกปีที่ผ่านไป ความคับข้องใจของเขาก็ยิ่งทวีคูณ ขณะที่โอกาสแห่งความสำเร็จของเขาริบหรี่ลง\n\n#bold หวง เฉา จะบรรลุความฝันของเขาได้หรือไม่ หรือความทะเยอทะยานที่ถูกขัดขวางจะนำพาเขาไปสู่การเดิมพันที่สิ้นหวัง?#!"

 bookmark_china_867_zhuye_chixin: "ผู้บัญชาการ จูเหย่ ชื่อซิน"
 bookmark_china_867_zhuye_chixin_subheading: "$BOOKMARK_SUBHEADING_MILITARY_GOVERNOR$"
 bookmark_china_867_zhuye_chixin_desc: "เหล่าชนเผ่าซาถัวเป็นที่หมายปองของราชวงศ์ถังมาช้านาน ด้วยความกล้าหาญและเก่งกาจในการรบ และในเรื่องนี้ จูเหย่ ชื่อซิน ก็มิได้เบี่ยงเบนไปจากธรรมเนียมของบรรพบุรุษ\n\nด้วยเกียรติคุณจากการร่วมภารกิจช่วยเหลือพระมาตุจฉาขององค์จักรพรรดิอย่างกล้าหาญเมื่อหลายปีก่อน การไต่เต้าอย่างมั่นคงในความโปรดปรานของจักรวรรดิของแม่ทัพชาวซาถัวผู้นี้ ทำให้บางคนสงสัยว่าแรงปรารถนาของเขานั้นสูงส่งเพียงใด\n\n#bold บัดนี้ เมื่อดวงดาวแห่งราชวงศ์ถังกำลังร่วงโรย จูเหย่ ชื่อซิน จะกล้าพอที่จะคว้ามันมาหรือไม่?#!"

 bookmark_china_867_he_quanhao: "ผู้บัญชาการ เหอ ฉวนห่าว"
 bookmark_china_867_he_quanhao_subheading: "$BOOKMARK_SUBHEADING_MILITARY_GOVERNOR$"
 bookmark_china_867_he_quanhao_desc: "ตระกูลของ เหอ ฉวนห่าว ได้ปกครองในฐานะขุนศึกอิสระมาตั้งแต่สมัยปู่ของเขา ซึ่งแทบไม่ต่างอะไรกับการเป็นอิสระ เพียง แต่ยอมสวามิภักดิ์ต่อราชวงศ์ถังในนามเท่านั้น\n\nฉวนห่าว ได้รับการแซ่ซ้องจากกองทัพให้เป็นผู้ว่าการหลังจากการจากไปของบิดา ทว่าก็มิใช่ปราศจากความหวั่นเกรง – ด้วยมีสายธารแห่งความโหดร้ายอยู่ในสันดานของชายหนุ่มผู้นี้\n\n#bold เหอ ฉวนห่าว จะสามารถเอาชนะสันดานของตนเพื่อสืบสานงานของบรรพบุรุษต่อไปได้หรือไม่ หรือแรงกระตุ้นภายในของเขาจะพิสูจน์ว่าเป็นจุดจบของตนเอง?#!"

 bookmark_china_867_zhang_huaishen: "เจี๋ยตู้สื่อ จาง หวายเซิ่น"
 bookmark_china_867_zhang_huaishen_subheading: "$BOOKMARK_SUBHEADING_DEFAULT$"
 bookmark_china_867_zhang_huaishen_desc: "หลังจากพิชิตและผนวกดินแดนผืนกว้างใหญ่ในนามของราชวงศ์ถัง ขุนศึก จาง อี้เชา ก็ได้รับตำแหน่งอันทรงเกียรติในราชสำนัก และได้ แต่งตั้ง หวายเซิ่น ผู้เป็นหลานชาย ให้ปกครองดินแดนเหล่านี้ในนามของเขา\n\nทว่า หวายเซิ่น ผู้เป็นแม่ทัพที่เจ้าเล่ห์และมีความสามารถ ก็มิใช่จะไร้ ซึ่งความทะเยอทะยานของตนเอง และเขาไม่เต็มใจนักที่จะสละตำแหน่งของตนให้แก่เหล่าลูกพี่ลูกน้อง เมื่อเวลานั้นมาถึง\n\n#bold จาง หวายเซิ่น จะสามารถมีชัยในการต่อสู้แย่งชิงสิทธิ์สืบทอดที่กำลังจะมาถึง และอ้างสิทธิ์ในตำแหน่งอันสูงส่งที่สุดในตระกูลได้หรือไม่?#!"

 bookmark_china_867_gao_pian: "ผู้บัญชาการ เกา เปียน"
 bookmark_china_867_gao_pian_subheading: "$BOOKMARK_SUBHEADING_MILITARY_GOVERNOR$"
 bookmark_china_867_gao_pian_desc: "สืบเชื้อสายจากเหล่ากษัตริย์โบราณแห่งรัฐฉีและเป็นหลานชายของแม่ทัพผู้โด่งดัง หลายคนจึงคาดว่า เกา เปียน ถูกลิขิตมาให้กระทำการอันยิ่งใหญ่ และวีรกรรมของเขาที่ยิงธนูดอกเดียวสอยอินทรีสองตัวร่วงจากฟากฟ้า ก็ดูเหมือนจะยืนยันถึงความสามารถอันเหนือธรรมชาติของเขา\n\nเขาถูกส่งไปยังชายแดนใต้เพื่อป้องกันการรุกรานจากต่างแดน ความสำเร็จของ เกา เปียน ได้สร้างความเป็นอริกับเหล่าผู้ที่มองว่าเขาเป็นภัยคุกคามต่อความทะเยอทะยานของตน\n\n#bold ชะตากรรมอันสูงส่งกำลังรอ เกา เปียน อยู่ หรือเขาจะร่วงหล่นสู่ปฐพีเฉกเช่นอินทรีที่เขาสังหาร?#!"
