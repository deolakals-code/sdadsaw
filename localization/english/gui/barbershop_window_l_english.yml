 BARBERSHOP_PRESET_CUSTOM_TT:1 "#T ค่าที่ตั้งไว้ล่วงหน้า: กำหนดเอง#!\n#I คลิกเพื่อดูตัวละครที่ท่านปักหมุดไว้#!"
 BARBERSHOP_TOGGLE_NAME_TT:0 "#T สลับการแสดงชื่อ#!\n#I คลิกเพื่อแสดงหรือซ่อนชื่อตัวละคร#!"
 BARBERSHOP_TOGGLE_CHARACTER_TT:1 "#T สลับการแสดงผล#!\n#I คลิกเพื่อแสดงหรือซ่อนตัวละคร#!"
 BARBERSHOP_ROTATE_LEFT_TT:1 "#T หมุนซ้าย#!\n#I คลิกเพื่อหมุนตัวละครไปทางซ้าย#!"
 BARBERSHOP_ROTATE_RIGHT_TT:1 "#T หมุนขวา#!\n#I คลิกเพื่อหมุนตัวละครไปทางขวา#!"
 BARBERSHOP_ZOOM_IN_TT:1 "#T ซูมเข้า#!\n#I คลิกเพื่อเพิ่มขนาดภาพเหมือน#!"
