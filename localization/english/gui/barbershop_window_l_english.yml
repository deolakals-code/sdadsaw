 BARBERSHOP_TAB_SCENE_TT:1 "#T ฉาก#!\n#I ดูตัวละครของท่านในพื้นหลังและท่าทางต่างๆ#!"
 BARBERSHOP_APPLY_CHANGES_TT:1 "#T ใช้การเปลี่ยนแปลง#!\n#I คลิกเพื่อปิดห้องแต่งกายและบันทึกการเปลี่ยนแปลงรูปลักษณ์ปัจจุบัน#!"
 BARBERSHOP_RESET_CHANGES_APPEARANCE_TT:1 "#T รีเซ็ตรูปลักษณ์#!\n#I คลิกเพื่อรีเซ็ตการเปลี่ยนแปลงรูปลักษณ์ปัจจุบัน#!"
 BARBERSHOP_RESET_CHANGES_SCENE_TT:1 "#T รีเซ็ตฉาก#!\n#I คลิกเพื่อรีเซ็ตการเปลี่ยนแปลงฉากปัจจุบัน#!"
 BARBERSHOP_SCREENSHOT_TT:1 "#T ถ่ายภาพหน้าจอ#!\n#I คลิกเพื่อถ่ายภาพหน้าจอ#!"
 BARBERSHOP_COA_TOGGLE_TT:0 "#T สลับการแสดงผล#!\n#I คลิกเพื่อแสดงหรือซ่อนตราอาร์มของท่าน#!"
 BARBERSHOP_COA_TOGGLE_TEXT_TT:0 "#T สลับข้อความ#!\n#I คลิกเพื่อแสดงหรือซ่อนข้อความตราอาร์ม#!"
