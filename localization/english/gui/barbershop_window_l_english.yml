 BARBERSHOP_RESET_NATURAL_COLORS_TT:0 "#T สีธรรมชาติ#!\n#I คลิกเพื่อรีเซ็ตเป็นสีธรรมชาติ#!"
 BARBERSHOP_FUZZY_SEARCH_TT:1 "#T ค้นหาแบบคลุมเครือ#!\n#I คลิกเพื่อเปิดใช้งานการค้นหาโดยการพิมพ์#!"
