 RAID_ON_ME_TOOLTIP: "#T อาณาจักรกำลังถูกปล้นสะดม#!\n[GetPlayer.GetTopLiege.GetPrimaryTitle.GetDefinitiveNameNoTooltip|U] กำลังถูก [Character.GetShortUIName] เข้า [raided|E]\n\n[armies|E] ที่เข้าปล้นสะดมจะไม่เป็น [hostile_army|E] อีกต่อไปเมื่อผ่านพ้น [GetPlayer.GetRaidHostilityEnd( Character.Self ).GetTimeDiffFromNow]\n\n#I คลิกเพื่อดูตัวละครที่เข้าปล้นสะดม#!"
 RAID_BY_ME_TOOLTIP: "#T การปล้นสะดม#!\nกำลังปล้นสะดม [Character.GetShortUIName]\n\n[armies|E] ของท่านจะไม่เป็น [hostile_army|E] ต่อ [Character.GetTopLiege.GetPrimaryTitle.GetDefinitiveNameNoTooltip] อีกต่อไปเมื่อผ่านพ้น [GetPlayer.GetRaidHostilityEnd( Character.Self ).GetTimeDiffFromNow]\n\n#I คลิกเพื่อดูผู้ปกครองที่ถูกปล้นสะดม#!"
