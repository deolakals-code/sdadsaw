 COA_DESIGNER_RESET_HISTORICAL_BUTTON_TT:0 "#T $COA_DESIGNER_RESET_HISTORICAL_BUTTON$#!\nรีเซ็ตกลับไปเป็นการออกแบบตามประวัติศาสตร์ ดังที่เห็นในตัวอย่าง"
 COA_DESIGNER_SAVE_TO_DISK:0 "บันทึกลงดิสก์"
 COA_DESIGNER_SAVE_TO_DISK_TT:0 "#T $COA_DESIGNER_SAVE_TO_DISK$#!\nบันทึกการออกแบบปัจจุบันลงในโฟลเดอร์ภาพหน้าจอ"
 COA_DESIGNER_UNDO_EDIT:0 "#T เลิกทำการเปลี่ยนแปลง#!\nเลิกทำการเปลี่ยนแปลงล่าสุดกับการออกแบบตราอาร์ม"
