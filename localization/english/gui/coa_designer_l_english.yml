l_english: 
 COA_DESIGNER_HEADER:0 "ตราอาร์ม"

 COA_DESIGNER_QUARTERING_OPTIONS:0 "การแบ่งช่องของ [cadet_branch|E]"
 COA_DESIGNER_TOGGLE_QUARTERING_BUTTON_TT:0 "#T ใช้ตราอาร์มแบบแบ่งสี่ส่วน#!\nเมื่อเปิดใช้งาน ตราอาร์มจะคงตราอาร์มแบบแบ่งสี่ส่วนที่แสดง [dynasty|E] และ [houses|E] ของบิดามารดาที่เป็นไปได้ อย่างไรก็ตาม ท่านสามารถแก้ไขได้เฉพาะตราอาร์มของตระกูลนี้เท่านั้น"
 
 COA_DESIGNER_MODE_CUSTOM:0 "โหมด: #V กำหนดเอง#!"
 COA_DESIGNER_MODE_ADJUSTED:0 "โหมด: #V ปรับแก้#!"
 COA_DESIGNER_MODE_SELECTION_HEADER:0 "ออกแบบตราอาร์มของท่านเอง"
 COA_DESIGNER_MODE_SELECTION_CONTINUE_CUSTOM_DESC:0 "#T ตราอาร์มแบบกำหนดเอง#!\nดำเนินการปรับแก้การออกแบบของตราอาร์มนี้ต่อไป"
 COA_DESIGNER_MODE_SELECTION_CONTINUE_CUSTOM_BUTTON:0 "ปรับ แต่งการออกแบบ"
 COA_DESIGNER_MODE_SELECTION_CUSTOM_DESC:0 "#T ตราอาร์มแบบกำหนดเอง#!\nการเริ่มต้นจากศูนย์จะ ทำให้ท่านมีตัวเลือกในการปรับ แต่งมากขึ้น"
 COA_DESIGNER_MODE_SELECTION_CUSTOM_BUTTON:0 "เริ่มต้นจากศูนย์"
 COA_DESIGNER_MODE_SELECTION_ADJUSTED_DESC:0 "#T ตราอาร์มแบบปรับแก้#!\nเริ่มต้นจากการออกแบบปัจจุบัน โดยคงโครงสร้างดั้งเดิมไว้พร้อมตัวเลือกที่จำกัดลงเล็กน้อย"
 COA_DESIGNER_MODE_SELECTION_ADJUSTED_BUTTON:0 "ปรับแก้การออกแบบที่มีอยู่"

 COA_DESIGNER_RANDOMIZE_BUTTON:0 "สุ่ม"
 COA_DESIGNER_RANDOMIZE_BUTTON_TT:0 "#T สุ่มการออกแบบ#!\nเมื่อแก้ไขตราอาร์มแบบแบ่งช่องของ [cadet_branch|E] เฉพาะช่องของ [house|E] เท่านั้นที่จะถูกสุ่ม"
 COA_DESIGNER_COPY_TO_CLIPBOARD_BUTTON:0 "คัดลอกไปยังคลิปบอร์ด"
 COA_DESIGNER_COPY_TO_CLIPBOARD_BUTTON_TT:0 "#T $COA_DESIGNER_COPY_TO_CLIPBOARD_BUTTON$#!\nคัดลอกการออกแบบที่แสดงอยู่ในปัจจุบันไปยังคลิปบอร์ดของท่าน"
 COA_DESIGNER_PASTE_FROM_CLIPBOARD_BUTTON:0 "วางจากคลิปบอร์ด"
 COA_DESIGNER_PASTE_FROM_CLIPBOARD_BUTTON_TT:0 "#T $COA_DESIGNER_PASTE_FROM_CLIPBOARD_BUTTON$#!\nวางการออกแบบตราอาร์มจากคลิปบอร์ดของท่านลงในเครื่องมือออกแบบ\nเมื่อแก้ไขหรือวางตราอาร์มแบบแบ่งช่องของ [cadet_branch|E] เฉพาะช่องของ [house|E] เท่านั้นที่จะถูกวาง ดังที่เห็นในตัวอย่าง[SelectLocalization(CoatOfArmsDesigner.CanPasteFromClipboard, '', 'COA_DESIGNER_PASTE_FROM_CLIPBOARD_DISABLED_TT')]"
 COA_DESIGNER_PASTE_FROM_CLIPBOARD_DISABLED_TT:0 "\n\n#X @warning_icon! ไม่พบตราอาร์มในคลิปบอร์ดของท่าน#!"
 COA_DESIGNER_RESET_BUTTON:0 "ยกเลิกการเปลี่ยนแปลง"
 COA_DESIGNER_RESET_BUTTON_TT:0 "#T $COA_DESIGNER_RESET_BUTTON$#!\nรีเซ็ตกลับไปเป็นการออกแบบเริ่มต้น ดังที่เห็นในตัวอย่าง"
