 board_games.0031.t:0 "$board_games.0000.t$"


 board_games.0031.desc.intro.01:0 "ด้วยเสียงคำรามแห่งชัยชนะ ข้าผุดลุกขึ้นยืน ทำให้ [SCOPE.Custom('BG_GamePiecePlural')] กระจัดกระจายไปทุกหนแห่ง"
 board_games.0031.desc.intro.02:0 "ด้วยรอยยิ้มอย่างภาคภูมิ ข้าวาง [SCOPE.Custom('BG_GamePiece')] ตัวสุดท้ายของข้าลงบนกระดาน"
 board_games.0031.desc.intro.03:0 "เราทั้งคู่จ้องมองไปที่ [SCOPE.Custom('BG_GamePiece')] ตัวสุดท้าย ข้าทำได้แล้ว ข้าชนะแล้ว"

 board_games.0031.desc.middle.01:0 "เกม [SCOPE.Custom('BG_GameType')] นี้เป็นของข้า อีกหนึ่งชัยชนะอันงดงามบนเส้นทางอันไม่อาจโต้แย้งได้ของข้าสู่บทบาทราชาแห่งเกม"
 board_games.0031.desc.middle.02:0 "อีกครั้งหนึ่งที่ความเหนือกว่าทางปัญญาของข้ามีชัยเหนือสิ่งอื่นใด"
 board_games.0031.desc.middle.03:0 "[ROOT.Char.GetFaith.HighGodName] ได้เป็นพยานถึงชัยชนะของข้าในวันนี้ ตั้งแต่แรกเริ่ม ข้าเชื่อมั่นอย่างเต็มเปี่ยมว่า [ROOT.Char.GetFaith.HighGodName] จะเห็นข้าเป็นผู้ชนะ ไม่มีทางเป็นอื่นไปได้"

 board_games.0031.desc.end.01:0 "\n\n[bg_loser.GetFirstName] ผู้สิ้นหวังยังคงนั่งอยู่ มือวางบนสะโพกของ [bg_loser.GetHerHis] พยายามทำความเข้าใจว่า [bg_loser.GetSheHe] ผิดพลาดตรงไหน"
 board_games.0031.desc.end.02:0 "\n\nเหลือเพียงเปลือกนอกอันว่างเปล่าของ [bg_loser.GetWomanMan] ในตัว [bg_loser.GetFirstName] [bg_loser.GetSheHe|U] ไม่อยากเชื่อว่าข้าชนะ"
 board_games.0031.desc.end.03:0 "\n\n[bg_loser.GetFirstName] แทบจะควบคุมอารมณ์ของ [bg_loser.GetHerHis] ไม่ได้ ข้าได้เอาชนะและ ทำให้ [bg_loser.GetHerHim] อับอาย"


 board_games.0031.a:0 "เกมดีมาก!"
 board_games.0031.a.a:0 "การแข่งที่ยอดเยี่ยม!"
 board_games.0031.b:0 "รู้สึกอย่างไรที่แพ้ เจ้า [bg_loser.GetWomanMan] ตัวน้อย?"
 board_games.0031.b.a:1 "จงคุกเข่าต่อหน้าข้า เจ้า [bg_loser.Custom2('InsultNoun', ROOT.Char)]!"
 board_games.0031.b.b:0 "อย่ารู้สึก #EMP แย่#! ไปเลย ไม่ใช่ทุกคนที่จะฉลาดเท่าข้าได้"
 board_games.0031.b.progress_towards_rival:0 "[bg_loser.GetTitledFirstName] ถือเป็นเรื่องส่วนตัว"
 board_games.0031.c:0 "ข้าอยากจะเล่นอีกครั้งในภายภาคหน้า..."
 board_games.0031.a.tt.success:0 "คู่ต่อสู้ของท่านเห็นด้วยว่าเป็นเกมที่ดี"
 board_games.0031.a.tt.failure:0 "คู่ต่อสู้ของท่านทำท่าทางหยาบคายและจากไป"
 board_games.0031.desc.result.skill:0 "#BOL ผลลัพธ์:#! ข้าชนะ [board_game_match|E] กับ [bg_loser.GetFirstNameNoTooltip] เนื่องจากคะแนน [board_game_winning|E] ของข้า"
 board_games.0031.desc.result.sudden_death:0 "#BOL ผลลัพธ์:#! ข้าชนะ [board_game_match|E] กับ [bg_loser.GetFirstNameNoTooltip] เนื่องจาก [board_game_winning_sudden_death|E]"

 board_games.0041.t:0 "$board_games.0000.t$"


 board_games.0041.desc.intro.01:0 "ด้วยเสียงโห่ร้องอย่างผู้มีชัยเยี่ยงสัตว์ป่า [bg_victor.GetFirstName] ก็กระโจนลุกขึ้นยืนบนเท้า [bg_victor.GetHerHis]\n\nข้า... ข้าพ่ายแพ้เสียแล้ว มือของข้าเลื่อนลงไปที่เข่าเพื่อหาที่พยุง"
 board_games.0041.desc.intro.02:0 "รอยยิ้มอย่างภาคภูมิแผ่กว้างจากแก้มหนึ่งไปอีกแก้มหนึ่งบนใบหน้าของ [bg_victor.GetFirstName] [bg_victor.GetSheHe] ชนะแล้ว ขณะที่ข้าแพ้\n\n"
 board_games.0041.desc.intro.03:0 "ไม่มีความผิดหวังใดยิ่งใหญ่ไปกว่าที่ข้ารู้สึกเมื่อจ้องมอง [SCOPE.Custom('BG_GamePiecePlural')] บนกระดานนี้ การจัดเรียงของมันบ่งบอกอย่างชัดเจนว่าข้าพ่ายแพ้แล้ว"

 board_games.0041.desc.middle.01:0 "โดยมี [ROOT.Char.GetFaith.HighGodName] เป็นพยาน ข้าได้ทำทุกอย่างที่ข้าทำได้แล้ว..."
 board_games.0041.desc.middle.02:0 "คาดไม่ถึงว่าคนโง่อย่าง [bg_victor.GetFirstName] จะชิงไหวชิงพริบข้าได้"
 board_games.0041.desc.middle.03:0 "\n\n[SCOPE.Custom('BG_GameType')|U] เป็นเพียงการเลียนแบบ #EMP สงครามจริง#! ที่ราคาถูกอยู่แล้ว ซึ่งเป็นสิ่งที่ข้าเหนือกว่าอย่างไม่ต้องสงสัยเมื่อเทียบกับคู่ต่อสู้ที่ต่ำต้อยของข้า ขณะที่ [bg_loser.GetSheHe] ศึกษา [SCOPE.Custom('BG_GameType')] #EMP ข้าศึกษาดาบ#! อย่างไรก็ตาม..."

 board_games.0041.desc.end.01:0 "\n\nข้าเล่น [SCOPE.Custom('BG_GameType')] #EMP ไม่เก่ง#! หรือ?"
 board_games.0041.desc.end.02:0 "\n\nฝ่ามือของข้าชื้นเหงื่อและเข่าอ่อนเมื่อตระหนักว่าความสามารถที่ดีที่สุดของข้าก็ยังไม่เพียงพอที่จะเอาชนะ [bg_victor.GetFirstName]"
 board_games.0041.desc.end.03:0 "\n\nไอ้ [recipient.Custom2('InsultNoun', ROOT.Char)]! ไอ้ [recipient.Custom2('InsultNoun', ROOT.Char)]! มันต้องโกงข้าแน่ๆ เป็นไปได้อย่างไรที่ #EMP ข้า#! จะแพ้?!"

 board_games.0041.a:0 "คราวหน้าเราจะได้เห็นกันว่าใครจะชนะ..."
 board_games.0041.b:0 "เจ้าได้สร้างศัตรูขึ้นที่นี่ในวันนี้"
 board_games.0041.b.b:0 "ฉลองต่อไปเถอะ และขอสาบานต่อ [ROOT.Char.GetFaith.HighGodName] เจ้าจะได้ลิ้มรสเท้าของข้า!"
 board_games.0041.c:0 "เอาล่ะ [bg_victor.GetWomanMan] ที่เก่งกว่าก็ชนะไป!"
 board_games.0041.desc.result.skill:0 "#BOL ผลลัพธ์:#! ข้าแพ้ [board_game_match|E] ให้กับ [bg_victor.GetFirstNameNoTooltip] เนื่องจากคะแนน [board_game_winning|E] ของ [bg_victor.GetHerHis]"
 board_games.0041.desc.result.sudden_death:0 "#BOL ผลลัพธ์:#! ข้าแพ้ [board_game_match|E] ให้กับ [bg_victor.GetFirstNameNoTooltip] เนื่องจาก [board_game_winning_sudden_death|E]"

 ##################################################
 # Gaining a Trinket
 board_games.0051.t:0 "โชคช่วย"
 board_games.0051.desc:0 "แม้ แต่ตอนนี้ ข้าก็ยังคงระลึกถึงการเอาชนะ [bg_loser.GetFirstName] อย่างราบคาบใน [SCOPE.Custom('BG_GameType')] เมื่อไม่กี่เดือนก่อนด้วยความรักใคร่ สีหน้าบน [bg_loser.Custom('MaskFace')] ของ [bg_loser.GetHerHis] นั้น #EMP ประเมินค่าไม่ได้#!.\n\nข้าคิดว่าข้าอาจจะยังเก็บกระดานที่เราเล่นกันไว้อยู่ที่ไหนสักแห่ง? กระดานที่ดี กระดานนำโชค พร้อมด้วย [SCOPE.Custom('BG_GamePiecePlural')] ที่ได้เป็นพยานในเกมที่ดีที่สุดเท่าที่เคยมีมา\n\nไม่ต้องสงสัยเลยว่า [bg_victor.GetFaith.KnowledgeGodName] ยิ้มให้กับมันแล้ว ข้าคงเป็นคนโง่หากปล่อยให้มันหายไป"
 board_games.0051.a:0 "อาาา แน่ใจได้ว่าจะนำโชคดีมาให้ตลอดไป!"
 board_games.0051.b:0 "อีกแค่ไม่กี่ชิ้น ข้าก็จะมีชุดที่ #EMP หายากอย่างแท้จริง#! แล้ว..."
 board_games.0051.c:0 "ข้าไม่ต้องการของเล่นพิเศษ"

 ##################################################
 # Debug Events
 board_games.0102.t:0 "สุดยอดเกมกระดาน"
 board_games.0102.desc:0 "BGE คือเกมกระดานสุดโปรดทั้งหมดของคุณรวมอยู่ในเกมเดียว: หมากรุก ปาจีซี เนฟาฟฟเฟตต์เทิลเอลเฟ หมากทอย\n\nคุณชอบเกมอื่นอะไรอีกบ้าง?\n\nมันอาจจะมีเกมอื่นๆ เหล่านั้นด้วย แต่ดีกว่า!\n\n#EMP และถูกกฎหมายล่วงหน้าหลายศตวรรษ#!.\n\nเกมกระดานธรรมดาควรถูกเรียกว่า ฉันเบื่อ เกมส์"
 board_games.0102.a:0 "ขอเกมธรรมดา"
 board_games.0102.b:0 "ขอให้ศัตรูใช้ แต่ข้อความตอนชนะ"
 board_games.0102.c:0 "ขอให้ศัตรูใช้ แต่ข้อความตอนแพ้"
