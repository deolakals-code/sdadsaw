 ##################################################
 # Misc
 board_games.0000.t:0 "มหาเกมกระดาน: [SCOPE.Custom('BG_GameType')|U]"
 board_games.0001.t:0 "$board_games.0000.t$"

 ##################################################
 # Opponent Winning
 board_games.0001.desc.opponent_winning.diplomacy.low:0 ""รู้หรือไม่," คู่ต่อสู้ของข้าเอ่ยรำพึง, "ข้าอาจมิใช่ผู้ที่เจรจาเก่งกาจนัก แต่ข้ากลับเชี่ยวชาญ [SCOPE.Custom('BG_GameType')] อย่างน่าประหลาด""
 board_games.0001.desc.opponent_winning.diplomacy.medium:0 ""อาาาห์ หากเพียงการพูดในที่สาธารณะมันง่ายดายเฉก เช่นการเอาชนะท่านใน [SCOPE.Custom('BG_GameType')] ได้," คู่ต่อสู้ของข้าเอ่ยขึ้น"
 board_games.0001.desc.opponent_winning.diplomacy.high:0 ""ข้ามิรู้เลยว่าสิ่งใดง่ายดายกว่ากัน," คู่ต่อสู้ของข้าคร่ำครวญ, "ระหว่างการเอาชนะท่านใน [SCOPE.Custom('BG_GameType')] หรือการบอกเล่าเรื่องราวความพ่ายแพ้อันน่าอับอายของท่าน""
 board_games.0001.desc.opponent_winning.martial.low:0 ""หากสงครามง่ายดายปาน [SCOPE.Custom('BG_GameType')] แล้วไซร้ ป่านนี้ข้าคงครองโลกไปแล้ว," คู่ต่อสู้ของข้าหัวร่อ "แต่นั่นก็เป็นเพียงความคิดข้าเท่านั้น""
 board_games.0001.desc.opponent_winning.martial.medium:0 ""หึมมม ท่านนี่ช่างไม่ใช่นักวางกลยุทธ์เอาเสียเลย ใช่หรือไม่?" คู่ต่อสู้ของข้าหัวเราะในลำคอ"
 board_games.0001.desc.opponent_winning.martial.high:0 ""สนามรบ กระดาน ทั้งหมดล้วนเป็นเรื่องของสิ่งสำคัญที่สุดสิ่งนั้น," คู่ต่อสู้ของข้ากล่าวเนิบนาบ [bg_opponent.GetSheHe|U] ใช้ข้อนิ้วเคาะหน้าผากของ [bg_opponent.GetHerHis] เพื่อเน้นย้ำ"
 board_games.0001.desc.opponent_winning.stewardship.low:0 ""ข้าหวังว่าเรื่องเงินทองจะง่ายดายเหมือนการเล่น [SCOPE.Custom('BG_GameType')]," คู่ต่อสู้ของข้าให้ความเห็น "ข้าคงได้แหวกว่ายในกองเงินกองทองไปแล้ว""
 board_games.0001.desc.opponent_winning.stewardship.medium:0 ""ท่านคิดว่า [SCOPE.Custom('BG_GameType')] เป็นการฝึกฝนที่ดีสำหรับการบริหารจัดการจริงหรือไม่?" คู่ต่อสู้ของข้าเอ่ยถามอย่างสบายๆ "ข้าคิด เช่นนั้นเสมอมา ใช่ว่าข้ากำลัง... จะสื่อความหมายใดๆ หรอกนะ""
 board_games.0001.desc.opponent_winning.stewardship.high:0 ""ข้ากล่าวเสมอว่า [SCOPE.Custom('BG_GameType')] สามารถสอน [bg_opponent.GetWomanMan] ได้มากเกี่ยวกับการบริหารจัดการอาณาจักร," คู่ต่อสู้ของข้ากล่าวอย่างอวดภูมิ "และในทางกลับกัน ก็ เช่นกันโดยธรรมชาติ""
 board_games.0001.desc.opponent_winning.intrigue.low:0 ""เห็นไหม นี่คือเหตุผลที่ข้ามักชอบเล่น [SCOPE.Custom('BG_GameType')]," คู่ต่อสู้ของข้าแสดงความเห็น "ไม่มีการซุ่มซ่อน ไม่มีคำโกหก มีเพียงเกมแห่งปัญญาอันยุติธรรม เกมหนึ่งที่ เอาเถอะ...""
 board_games.0001.desc.opponent_winning.intrigue.medium:0 ""ท่านรู้หรือไม่ว่าท่านสามารถเรียนรู้ #EMP อย่างถ่องแท้#! ว่าใครบางคนโกหกอย่างไรโดยการสังเกต [bg_myself.Custom('MaskFace')] ของพวกเขาในระหว่างเล่น [SCOPE.Custom('BG_GameType')]?" คู่ต่อสู้ของข้าเอ่ยถาม "โอ้ ข้ามิได้หมายความว่า... แค่ข้อสังเกตเท่านั้น...""
 board_games.0001.desc.opponent_winning.intrigue.high:0 ""ระวังตัวให้ดี," คู่ต่อสู้ของข้าแสยะยิ้ม, "อีกตาเดิน เช่นนั้น ท่านจะไปปลุก [SCOPE.Custom('BG_GamePiece')] ดักจับของข้าเข้า""
 board_games.0001.desc.opponent_winning.learning.low:0 ""รู้หรือไม่ พวกเขาบอกข้าว่าข้าต้องใช้ #EMP ตำรา#! เพื่อพิสูจน์ความหลักแหลมของข้า," คู่ต่อสู้ของข้ากล่าวอวดภูมิ, "แต่ข้าคิดว่าบัดนี้มันชัดเจนแล้วว่าข้ามิใช่คนโง่เง่า""
 board_games.0001.desc.opponent_winning.learning.medium:0 ""ตามจริงแล้ว," คู่ต่อสู้ของข้ากล่าวอย่างภาคภูมิใจ, "ข้าประทับใจที่ท่านเล่นได้ดีเท่าที่เป็นอยู่ เมื่อพิจารณาว่าท่านกำลังสู้กับใคร""
 board_games.0001.desc.opponent_winning.learning.high:0 ""ข้าได้ศึกษา [SCOPE.Custom('BG_GameType')] อย่างละเอียดถี่ถ้วน," คู่ต่อสู้ของข้าอธิบาย, "และข้าเสียใจที่ต้องกล่าวว่า ณ จุดนี้ ข้าไม่คิดว่าจะมีทางใดให้ท่านชนะได้เลย""
 board_games.0001.desc.opponent_winning.trait.lustful:0 ""ในฐานะยอดนักรักที่ยิ่งใหญ่ที่สุดในโลก #EMP และ#! ผู้เล่น [SCOPE.Custom('BG_GameType')] ที่เก่งกาจ ข้าไม่โทษท่านหรอกที่พ่ายแพ้แก่ข้า," คู่ต่อสู้ของข้าหัวเราะในลำคอ"
 board_games.0001.desc.opponent_winning.trait.chaste:0 ""วินัยในบ้านนำมา ซึ่งวินัยบนกระดาน ท่านรู้หรือไม่," คู่ต่อสู้ของข้ากล่าวอย่างอวดภูมิ "ความยับยั้งชั่งใจเพียงเล็กน้อยนั้นสำคัญยิ่งนัก""
 board_games.0001.desc.opponent_winning.trait.gluttonous:0 ""ข้าคิดว่าข้าอาจจะฉลองชัยชนะด้วยงานเลี้ยง," คู่ต่อสู้ของข้าครุ่นคิด "ข้ารู้สึกอยากได้ของหวานๆ ให้เข้ากับชัยชนะ""
 board_games.0001.desc.opponent_winning.trait.temperate:0 ""ข้าอาจจะอนุญาตให้ตัวเองดื่มน้ำกุหลาบสักถ้วยหลังจบเกมนี้," คู่ต่อสู้ของข้าครุ่นคิด "ข้าไม่ได้ให้รางวัลตัวเองบ่อยนัก แต่ข้าคิดว่าข้าสมควรได้รับมัน""
 board_games.0001.desc.opponent_winning.trait.greedy:0 ""สิ่งเดียวที่หอมหวานกว่าเสียงทองกระทบกัน คือเสียงหยาดน้ำตาอันแผ่วเบาของ [bg_myself.GetWomanMan] ที่หยดลงบนกระดาน [SCOPE.Custom('BG_GameType')]," คู่ต่อสู้ของข้ายิ้ม "ท่านเห็นด้วยหรือไม่?""
 board_games.0001.desc.opponent_winning.trait.generous:0 ""ฟังนะ ข้าอาจจะกำลังชนะอยู่ แต่หากท่านร้องขออย่างสุภาพ ข้ายินดีที่จะ... ปล่อยให้ท่านชนะไป," คู่ต่อสู้ของข้าอธิบาย น้ำเสียงเต็มไปด้วยความเมตตาและความสงสาร "ชีวิตยังมีอะไรมากกว่าการชนะใน [SCOPE.Custom('BG_GameType')]"
 board_games.0001.desc.opponent_winning.trait.lazy:0 "คู่ต่อสู้ของข้าหาวเสียงดัง "ตามจริงข้าคาดหวังความท้าทายมากกว่านี้สักหน่อยนะ [bg_myself.GetFirstNameNoTooltip] ข้าแทบจะไม่ได้ตื่นตัวเลย""
 board_games.0001.desc.opponent_winning.trait.diligent:0 ""นี่คือเหตุผลว่าทำไมท่านต้องทุ่มเท," คู่ต่อสู้ของข้าปลอบใจด้วยน้ำเสียงที่ #EMP เหลือทนอย่างยิ่ง#! "ไม่มีสิ่งใดทดแทนการทำงานหนักได้ ไม่ว่าจะในชีวิตจริงหรือใน [SCOPE.Custom('BG_GameType')]"
 board_games.0001.desc.opponent_winning.trait.wrathful:0 "คู่ต่อสู้ของข้าสงบอย่างประหลาด ผิดวิสัย "โอ้ ไม่มีอะไรให้ต้องโกรธเคืองมากนักหรอก," [bg_opponent.GetSheHe] กล่าวขณะสบตาข้า, "เมื่อทุกอย่างกำลังเป็นไปได้ #EMP สวย#! ขนาดนี้""
 board_games.0001.desc.opponent_winning.trait.calm:0 ""ข้าพบเสมอว่ากุญแจสู่ [SCOPE.Custom('BG_GameType')] คือจิตใจที่ปลอดโปร่งและศีรษะที่เยือกเย็น," คู่ต่อสู้ของข้าครุ่นคิด "ท่านคงเข้าใจได้ในสักวันหนึ่ง""
 board_games.0001.desc.opponent_winning.trait.patient:0 ""คนส่วนใหญ่," คู่ต่อสู้ของข้าเทศนา, "ไม่เห็นคุณค่าอย่างถ่องแท้ว่ามันยากเพียงใดที่จะทำ [bg_opponent.Custom('BG_RandomArticleDirection')] [bg_opponent.Custom('BG_RandomRankPossessive')] [bg_opponent.Custom('BG_RandomMoveType')] ให้สำเร็จ นับประสาอะไรกับการป้องกันมัน""
 board_games.0001.desc.opponent_winning.trait.impatient:0 ""ท่านนี่ช่างเดินหมากใน [SCOPE.Custom('BG_GameType')] ช้าเสียจริง [bg_myself.Custom2('GetYoungMiddleAgedOld',bg_opponent)] [bg_myself.GetWomanMan]," คู่ต่อสู้ของข้าพึมพำพลางใช้นิ้วเคาะกระดานของ [bg_opponent.GetHerHis]"
 board_games.0001.desc.opponent_winning.trait.arrogant:0 ""อย่าได้รู้สึกแย่ไปเลย [bg_myself.GetFirstNameNoTooltip]," คู่ต่อสู้ของข้าพูดประจบประแจง เอนกายลงในท่าที่ [bg_opponent.GetSheHe] นั่งอย่างสบายอารมณ์ "เราทุกคนไม่ได้มี #EMP พรสวรรค์#! โดยธรรมชาต เช่นนี้กันหมดหรอก""
 board_games.0001.desc.opponent_winning.trait.humble:0 ""ตามจริงแล้ว ท่านทำได้ดีมาก," คู่ต่อสู้ของข้าพูดเสียงแจ้ว "ปกติข้าไม่ค่อยทำได้ดีขนาดนี้ ข้าว่าท่านคงแค่โชคไม่ดีเท่านั้น""
 board_games.0001.desc.opponent_winning.trait.deceitful:1 ""อย่ารู้สึกแย่นักเลย," คู่ต่อสู้ของข้าปลอบโยน น้ำเสียงหวานปานน้ำผึ้ง แต่กัดกร่อนเหมือนบาป "แม้ แต่ [bg_opponent.GetFaith.TricksterGodName] ก็ยังตามการเดินหมากของข้าไม่ทัน""
 board_games.0001.desc.opponent_winning.trait.honest:0 ""โอ้ นี่มันไปได้ #EMP สวย#! กว่าที่ข้าคาดไว้มาก!" คู่ต่อสู้ของข้าอุทาน "ท่านไม่ใช่คู่ต่อสู้ที่ยากเย็นเลย... โอ้ ขอโทษ ข้าไม่ได้ตั้งใจจะหยาบคาย แค่พูดตามตรงเท่านั้น""
 board_games.0001.desc.opponent_winning.trait.craven:0 ""ข้า... ข้ากำลังชนะ? ข้ากำลังชนะ!" คู่ต่อสู้ของข้าร้องออกมา [bg_opponent.GetSheHe|U] ดูประหลาดใจอย่างแท้จริง แต่ก็นั่นแหละ [bg_opponent.GetSheHe] ใช้เวลาครึ่งเกมมองผ่านง่ามนิ้วของ [bg_opponent.GetHerHis] เลยทีเดียว"
 board_games.0001.desc.opponent_winning.trait.brave:0 ""ท่านคงอนุญาตให้ข้าหัวเราะเยาะได้เล็กน้อย," คู่ต่อสู้ของข้าเอ่ย "แต่ท่านจะต้องเดินหมากให้กล้าหาญกว่า #EMP นี้#! เพื่อเอาชนะ #EMP ข้า#!""
 board_games.0001.desc.opponent_winning.trait.shy:0 ""การฝึกฝนทั้งหมดกำลังเห็นผล!" คู่ต่อสู้ของข้าส่งเสียงร้องอย่างตื่นเต้น ยิ้มกว้างด้วยความภาคภูมิใจอย่างขวยเขินต่อสถานการณ์บนกระดาน"
 board_games.0001.desc.opponent_winning.trait.gregarious:0 ""อย่ารู้สึกแย่ไปนักเลย," คู่ต่อสู้ของข้าพูดเนิบๆ พลางหักข้อนิ้วของ [bg_opponent.GetHerHis] "ข้าชนะใน [SCOPE.Custom('BG_GameType')] เหมือนกับที่ข้าผูกมิตรนั่นแหละ อย่างง่ายดายจนน่าตกใจ""
 board_games.0001.desc.opponent_winning.trait.ambitious:0 ""ท่านคิดว่าพวกเขา แต่งตั้งตำแหน่งประเภท... #EMP ราชา#! แห่งเกมกระดานหรือไม่?" คู่ต่อสู้ของข้าเอ่ยถามพลางเกาคางของ [bg_opponent.GetHerHis] "ท่านก็เห็น ข้ารู้สึกเหมือนกำลังก้าวไปสู่ตำแหน่งนั้นอยู่แล้ว""
 board_games.0001.desc.opponent_winning.trait.content:0 ""ช่างเป็นเกมที่น่าเล่นเสียนี่กระไร," คู่ต่อสู้ของข้าหัวเราะเบาๆ "เราคงไม่ร้องขอสิ่งใดที่ดีกว่านี้ได้แล้ว ใช่หรือไม่? นอกจากโชคของท่านน่ะนะ ข้าหมายถึง""
 board_games.0001.desc.opponent_winning.trait.arbitrary:0 ""ปกติข้าไม่ใช่คนยึดติดกับกฎเกณฑ์สักเท่าไหร่," คู่ต่อสู้ของข้าแสดงความเห็น, "แต่ [SCOPE.Custom('BG_GameType')] ทำให้ข้าเห็นถึงเสน่ห์ของมันอยู่บ้างเหมือนกัน พวกมัน ทำให้ท่าน #EMP บังคับ#! ผู้อื่นให้ยอมรับว่าท่านเก่งกว่าพวกเขาได้ในบางครั้ง""
 board_games.0001.desc.opponent_winning.trait.just:0 ""ดูนี่สิ," คู่ต่อสู้ของข้าอธิบาย พลางโบกมัดกระดาษมาทางข้า "ข้าเสียใจที่ท่านพยายามเดินหมากผิดกติกาอยู่เรื่อย แต่หากท่านได้ #EMP อ่านกติกา#! เสียบ้าง ท่านคงทำได้ดีกว่านี้""
 board_games.0001.desc.opponent_winning.trait.cynical:0 ""แน่นอนว่าข้าไม่ได้ออมมือให้ท่าน," คู่ต่อสู้ของข้ากล่าวพลางยิ้มเยาะ "ท่านเองก็ #EMP ไม่มีทาง#! ออมมือให้ข้าอยู่แล้ว แล้วจะทำไปไยเล่า?""
 board_games.0001.desc.opponent_winning.trait.zealous:0 ""ข้าหวังว่าข้าจะสามารถรับเครดิตสำหรับชัยชนะอันแน่นอนนี้ได้," คู่ต่อสู้ของข้ากล่าวอย่างเกียจคร้าน, "แต่มันเป็นผลงานของ [bg_opponent.GetFaith.KnowledgeGodName] ที่ทำ #EMP ผ่าน#! ตัวข้าทั้งสิ้น""
 board_games.0001.desc.opponent_winning.trait.paranoid:0 ""ข้ารู้ว่าท่านยังมีเล่ห์เหลี่ยมซ่อนไว้อยู่," คู่ต่อสู้ของข้าขมวดคิ้ว "ไม่มีใครที่จะเอาชนะได้ง่ายดาย #EMP ขนาดนี้#! หรอก""
 board_games.0001.desc.opponent_winning.trait.trusting:0 ""ข้าอาจจะแวบไปปลดทุกข์ระหว่างที่ท่านกำลังเดินหมากนะ," คู่ต่อสู้ของข้ายิ้ม "อย่าไปยุ่งกับ [SCOPE.Custom('BG_GamePiecePlural')] ของข้าล่ะ!""
 board_games.0001.desc.opponent_winning.trait.compassionate:0 ""ข้าขออภัยหากข้ากำลัง ทำให้ท่านต้องเดินหมากที่ไม่ดี, [bg_myself.GetFirstNameNoTooltip]," คู่ต่อสู้ของข้ากล่าว เสียงของ [bg_opponent.GetHerHis] แสดงความเสียใจอย่างแท้จริง "ข้าเล่น [SCOPE.Custom('BG_GameType')] เพื่อความสนุก แต่ข้าคิดว่ามันจะสนุกก็ต่อเมื่อเรา #EMP ทั้งคู่#! กำลังเพลิดเพลินกับมัน""
 board_games.0001.desc.opponent_winning.trait.callous:0 ""สาบานต่อ [bg_opponent.GetFaith.HouseholdGodName] ท่านนี่ช่างไม่สู้เอาเสียเลยนะ?" คู่ต่อสู้ของข้าอุทานอย่างทื่อๆ"
 board_games.0001.desc.opponent_winning.trait.sadistic:0 ""มัน #EMP สนุกกว่า#! มากที่จะหยอกล้อกับศัตรูที่บาดเจ็บ," คู่ต่อสู้ของข้ากล่าวเนิบๆ ด้วยพิษสงแห่งความยินดีไม่น้อย, "ท่านเห็นด้วยหรือไม่, [bg_myself.GetFirstNameNoTooltip]?""
 board_games.0001.desc.opponent_winning.trait.stubborn:0 ""ช่างดีเหลือเกินที่ได้ชนะง่ายๆ แบบนี้บ้าง," คู่ต่อสู้ของข้ากล่าวเยาะเย้ย "ปกติข้าต้องเถียงอยู่หลายชั่วโมงกว่าผู้เล่นอีกฝ่ายจะยอมรับว่าข้าชนะ""
 board_games.0001.desc.opponent_winning.trait.fickle:0 ""ข้าชอบจริงๆ ที่ไม่ว่าข้าจะใช้กลยุทธ์ใด ท่านก็แพ้ยับเยินเท่าเดิมเสมอ," คู่ต่อสู้ของข้ากล่าวติดตลก"
 board_games.0001.desc.opponent_winning.trait.vengeful:0 ""แน่นอน ทั้งหมดนี้เป็นเพียงการชำระแค้น," คู่ต่อสู้ของข้ากระซิบเสียงเย็นชา "และท่านก็รู้ #EMP ดีอยู่แก่ใจ#! ว่าเรื่องอะไร""
 board_games.0001.desc.opponent_winning.trait.forgiving:0 ""พูดตามตรง ข้าคาดหวังความท้าทายมากกว่านี้สักหน่อย," คู่ต่อสู้ของข้าคร่ำครวญ "ไม่เป็นไรหรอก อย่างน้อยท่านก็เป็นคู่ซ้อมที่ดี""
 board_games.0001.desc.opponent_winning.trait.rowdy:0 "คู่ต่อสู้วัยเยาว์ของข้าตะโกน หรืออย่างน้อยก็พูดอ้อแอ้ ข่มขู่ข้าอย่างไม่ใคร่จะไตร่ตรองนัก ทั้งยังแทบจะปัดกระดานหลุดไปด้วยความตื่นเต้นของ [bg_opponent.GetHerHis]"
 board_games.0001.desc.opponent_winning.trait.charming:0 ""เราควรเล่น [SCOPE.Custom('BG_GameType')] ทุกวันเลยนะ [bg_myself.GetFirstNameNoTooltip]," คู่ต่อสู้วัยเยาว์ของข้าส่งเสียงเจื้อยแจ้ว "มันสนุกเสมอเลย!""
 board_games.0001.desc.opponent_winning.trait.curious:0 ""รู้ไหม," คู่ต่อสู้วัยเยาว์ของข้าครุ่นคิด, "ข้ากำลังเรียนรู้อะไรมากมายจากการเอาชนะท่าน""
 board_games.0001.desc.opponent_winning.trait.pensive:0 ""ข้าอ่านมาเยอะเลยเกี่ยวกับวิธีเล่น [SCOPE.Custom('BG_GameType')]," คู่ต่อสู้วัยเยาว์ของข้ายิ้มกว้าง, "แต่ข้าไม่รู้เลยว่ามันจะง่ายขนาดนี้ที่จะ #EMP นำมาใช้#!""
 board_games.0001.desc.opponent_winning.trait.bossy:0 ""หลังจากข้าเอาชนะท่านแล้ว," คู่ต่อสู้วัยเยาว์ของข้าประกาศ, "ข้าต้องการขนมปังม้วนหวานๆ เป็นเครื่องบรรณาการ""
 board_games.0001.desc.opponent_winning.relation.friend:0 ""ร่าเริงหน่อยสิ เจ้า [bg_myself.Custom('MaskFace')] หน้าบึ้ง," คู่ต่อสู้ของข้าหัวเราะ "มันก็แค่เกมเล็กๆ น้อยๆ ระหว่างเพื่อน ใช่หรือไม่?""
 board_games.0001.desc.opponent_winning.relation.best_friend:0 ""ไม่ว่าจะแพ้หรือชนะ," สหายรักของข้ากล่าว, "ไม่มีใครในโลกที่ข้าอยากเล่น [SCOPE.Custom('BG_GameType')] ด้วยมากไปกว่าท่านอีกแล้ว""
 board_games.0001.desc.opponent_winning.relation.rival:0 ""สาบานต่อ [bg_opponent.GetFaith.FateGodName] ท่านนี่เล่น [SCOPE.Custom('BG_GameType')] ห่วยพอๆ กับการปกครองเลย!" คู่ปรับของข้าหัวเราะเสียงดัง"
 board_games.0001.desc.opponent_winning.relation.nemesis:0 "ศัตรูคู่อาฆาตของข้าไม่เอ่ยสิ่งใด [bg_opponent.GetSheHe|U] เพียงจ้องมองมาที่ข้า [bg_opponent.Custom('EyeEyes')] ลุกโชนไปด้วย #EMP ความเกลียดชัง#! อันบริสุทธิ์ ไร้ ซึ่งการเจือปน"
 board_games.0001.desc.opponent_winning.relation.lover:0 "โดยไม่ละสายตาจากข้า คนรักของข้าเริ่มลูบไล้ [SCOPE.Custom('BG_GamePiecePlural')] ตัวหนึ่งอย่างแผ่วเบาด้วยปลายนิ้วของ [bg_opponent.GetHerHis] และ... โอ้ #EMP โอ้ พระเจ้า#!"
 board_games.0001.desc.opponent_winning.relation.soulmate:0 "คู่แท้ของข้าให้ความสนใจกับเกม [SCOPE.Custom('BG_GameType')] ของเราเพียงครึ่งเดียว ส่วนใหญ่แล้ว [bg_opponent.GetSheHe] ดูเหมือนจะมุ่งความสนใจไปที่การจ้องมองลึกเข้าไปใน [bg_myself.Custom('EyeEyes')] ของข้า"
 board_games.0001.desc.opponent_winning.relation.bully:0 ""เห็นไหม?" คู่ต่อสู้ของข้าหัวเราะคิกคัก, "นี่แหละเหตุผลที่ข้าตบตีท่าน ท่านมันช่างเป็น #EMP ขี้แพ้#! เสียนี่กระไร""
 board_games.0001.desc.opponent_winning.relation.victim:0 "ดวงตาของเหยื่อของข้าลุกโชนไปด้วยความโกรธแค้นอันชอบธรรม ยินดีที่อย่างน้อยสักครั้ง ที่บางสิ่งกำลังเป็นไปตามทางของ #EMP [bg_opponent.GetHerHis]#! "
 board_games.0001.desc.opponent_winning.relation.crush:0 "เดี๋ยวนะ [bg_opponent.GetSheHe] พูดอะไรหรือเปล่า? ข้าคิดว่า [bg_opponent.GetSheHe] พูดอะไรบางอย่าง! โธ่เอ๊ย บางครั้งข้าก็เผลอใจลอยไปกับการมอง [bg_opponent.GetHerHim] จนตอนนี้ข้าทำทุกอย่างพังหมดแล้ว"
 board_games.0001.desc.opponent_winning.relation.guardian:0 ""จงดูข้าให้ดี [bg_myself.GetFirstName]," ผู้ปกครองของข้ากล่าว "ศึกษาว่าข้าเล่นอย่างไร แล้วท่านอาจจะได้เรียนรู้อะไรบางอย่าง""
 board_games.0001.desc.opponent_winning.relation.ward:0 "ผู้อยู่ในอุปการะของข้ายิ้มกว้างให้ข้า "เราเล่น [SCOPE.Custom('BG_GameType')] บ่อยขึ้นได้ไหม? #EMP ได้โปรดเถิด#!!""
 board_games.0001.desc.opponent_winning.hook_on.weak:0 ""$board_games.0001.desc.opponent_winning.hook_on.strong$""
 board_games.0001.desc.opponent_winning.hook_on.strong:0 ""มันรู้สึกดีนะที่ได้พลิกสถานการณ์กับท่าน ท่านรู้ไหม," คู่ต่อสู้ของข้ากล่าว "ดูเหมือนท่านจะควบคุมข้าไว้ใต้อุ้งมือเสมอ เว้น แต่ตอนที่เราเล่น [SCOPE.Custom('BG_GameType')] น่ะนะ แน่นอน""
 board_games.0001.desc.opponent_winning.hooked_by.weak:0 ""$board_games.0001.desc.opponent_winning.hooked_by.strong$""
 board_games.0001.desc.opponent_winning.hooked_by.strong:0 ""ท่านไม่ได้กำลังแกล้งแพ้โดยเจตนา เพราะ #EMP ข้อตกลง#! ของเราใช่ไหม?" คู่ต่อสู้ของข้าเอ่ยถาม พลางเกาคางของ [bg_opponent.GetHerHis] อย่างครุ่นคิด "เพราะท่านเล่นเหมือนพยายามจะแพ้เลย""
 board_games.0001.desc.opponent_winning.match_history.recently_won_against.default:0 ""อาาา ตอนนี้ข้าเอาชนะท่านมากี่ครั้งแล้วนะ?" คู่ต่อสู้ของข้าหัวเราะเบาๆ "ข้า #EMP ลืม#! นับไปแล้วตามตรง""
 board_games.0001.desc.opponent_winning.match_history.recently_won_against.county:0 ""[bg_myself.MakeScope.Var('bg_recent_land_loss_stake').Title.GetNameNoTier] กำลังไปได้สวย ท่านรู้ไหม," คู่ต่อสู้ของข้ากล่าวเนิบๆ, "#EMP ดีขึ้นมาก#! ตั้งแต่ข้ายึดครองที่นั่น""
 board_games.0001.desc.opponent_winning.match_history.recently_won_against.gamble:0 ""อีกแมตช์หนึ่งแล้ว," คู่ต่อสู้ของข้าตั้งข้อสังเกต, "เป็นอีกชัยชนะหนึ่งสำหรับข้า ท่านกำลังจะล้มละลายนะ ท่านรู้ไหม""
 board_games.0001.desc.opponent_winning.match_history.recently_lost_against.default:0 ""ตอนนี้สิ," คู่ต่อสู้ของข้าหัวเราะคิกคัก, "มัน #EMP ดีกว่า#! ไอ้แมตช์ #EMP อื่น#! ที่เราเล่นกันเยอะเลย""
 board_games.0001.desc.opponent_winning.match_history.recently_lost_against.county:0 ""หลังจากเสีย [bg_opponent.MakeScope.Var('bg_recent_land_loss_stake').Title.GetNameNoTier] ไปแล้ว ข้าไม่สามารถเอาชนะท่านได้มากพอ," คู่ต่อสู้ของข้าพึมพำ ยังคงเจ็บใจหลังจากการพนันเก่าของเรา"
 board_games.0001.desc.opponent_winning.match_history.recently_lost_against.gamble:0 ""ดูเหมือนว่าการเดิมพันครั้งนี้จะเข้าทางข้าแล้วสินะ?" คู่ต่อสู้ของข้าหัวเราะในลำคอ"
 board_games.0001.desc.opponent_winning.other.pro_gamer:0 ""ท่านควรให้ความสนใจกับเทคนิคของข้าอย่างใกล้ชิด," คู่ต่อสู้ของข้าพูดประจบประแจง "ข้ากำลังจะทำในสิ่งที่เรียกว่าการเดินหมากแบบนักเล่นมืออาชีพ""
 board_games.0001.desc.opponent_winning.other.avlf:0 ""#EMP ท่านน่ะ#! เป็นปรมาจารย์แห่งเกมงั้นรึ? อย่าหลงตัวเองไปหน่อยเลย [bg_myself.GetFirstNameNoTooltip] ท่านยังไม่เป็นแม้ แต่ผู้เล่นด้วยซ้ำ""

 ##################################################
 # Player Winning
 board_games.0001.desc.i_am_winning.diplomacy.low:0 ""ข้าไม่... ข้าไม่สามารถ... แค่ออมมือให้ข้าหน่อย!" คู่ต่อสู้ของข้าแทบจะกรีดร้องออกมา เห็นได้ชัดว่าคับข้องใจและไม่สามารถหาคำพูดที่เหมาะสมได้"
 board_games.0001.desc.i_am_winning.diplomacy.medium:0 "คู่ต่อสู้ของข้าไม่เอ่ยสิ่งใด เพียงใช้นิ้วของ [bg_opponent.GetHerHis] เคาะโต๊ะอย่างฉุนเฉียว"
 board_games.0001.desc.i_am_winning.diplomacy.high:0 ""ดูเหมือนว่า," คู่ต่อสู้ของข้ากล่าวอย่างแดกดัน, "ท่านจะได้เปรียบข้าอยู่เล็กน้อย ณ ตอนนี้""
 board_games.0001.desc.i_am_winning.martial.low:0 ""นำทหารก็ไม่ได้," คู่ต่อสู้ของข้าคร่ำครวญ, "เล่น [SCOPE.Custom('BG_GameType')] ก็ไม่ได้ ข้าจะมีประโยชน์อะไรเล่า?""
 board_games.0001.desc.i_am_winning.martial.medium:0 "คู่ต่อสู้ของข้าลูบคางของ [bg_opponent.GetHerHis] อย่างครุ่นคิด "ข้า #EMP แน่ใจ#! ว่าแผนการนั้นจะต้องได้ผล..."
 board_games.0001.desc.i_am_winning.martial.high:0 ""หากนี่เป็นสนามรบจริง," คู่ต่อสู้ของข้าประกาศ, "สถานการณ์ #EMP มันคง#! แตกต่างออกไป""
 board_games.0001.desc.i_am_winning.stewardship.low:0 ""ทำไมตัวเลขมัน #EMP ยาก#! อย่างนี้เสมอเลย?" คู่ต่อสู้ของข้าทำปากยื่น "[SCOPE.Custom('BG_GameType')|U] ต้องให้คิดล่วงหน้าไปไกลมาก และข้าก็แค่ #EMP ทำไม่ได้#!""
 board_games.0001.desc.i_am_winning.stewardship.medium:0 "คู่ต่อสู้ของข้าจ้องมองกระดานอย่างตั้งใจ "ข้าต้อง... ข้าต้องคำนวณผิดพลาดไปที่ไหนสักแห่ง..."
 board_games.0001.desc.i_am_winning.stewardship.high:0 ""มันเจ็บปวดที่ต้องเอ่ยปาก," คู่ต่อสู้ของข้าพึมพำ, "แต่โอกาสมันดูไม่ค่อยดีสำหรับข้าเลย""
 board_games.0001.desc.i_am_winning.intrigue.low:0 ""ท่านช่วยหยุดโกงอย่าง #EMP โจ่งแจ้ง#! สักครู่ได้ไหม?" คู่ต่อสู้ของข้าตะคอก"
 board_games.0001.desc.i_am_winning.intrigue.medium:0 ""ข้าสงสัยว่ากลยุทธ์ของข้าอาจต้องการ... ความเจ้าเล่ห์... มากกว่านี้" คู่ต่อสู้ของข้าพึมพำ พลางมองกระดานอย่างคับข้องใจ"
 board_games.0001.desc.i_am_winning.intrigue.high:0 ""ท่านอาจคิดว่าท่านกำลังชนะ," คู่ต่อสู้ของข้าหัวเราะในลำคอ, "แต่ท่านคิด เช่นนั้นเพียง เพราะข้าต้องการให้ท่านคิด เช่นนั้น และข้ารู้ว่าท่านรู้ว่าข้ารู้ว่าท่านรู้ เช่นนั้น""
 board_games.0001.desc.i_am_winning.learning.low:0 ""นี่มันไม่ยุติธรรมเลย ข้าไม่ #EMP เข้าใจ#! กติกาเหล่านี้แม้เพียงครึ่งเดียว," คู่ต่อสู้ของข้าพ่นลมออกจมูก "เห็นได้ชัดว่าท่าน แต่งกฎขึ้นมาระหว่างที่เราเล่น""
 board_games.0001.desc.i_am_winning.learning.medium:0 ""ท่านกำลังใช้ [bg_myself.Custom('BG_RandomRankPossessive')] [bg_myself.Custom('BG_RandomMoveType')] #EMP อีกแล้ว#! รึ?" คู่ต่อสู้ของข้าคร่ำครวญ "ท่านนี่มัน #EMP ขี้โกง#! จริงๆ""
 board_games.0001.desc.i_am_winning.learning.high:0 ""ข้ารู้อยู่แล้วว่าข้าไม่ควรเปิดด้วย [bg_opponent.Custom('BG_RandomMoveType')] ของคนโง่," คู่ต่อสู้ของข้าครวญคราง "ข้าแพ้ไปแล้วโดยพื้นฐาน""
 board_games.0001.desc.i_am_winning.trait.lustful:0 "คู่ต่อสู้ของข้าดูเหมือนจะไม่สนใจเกมเลยแม้ แต่น้อย แต่กลับจดจ่ออยู่กับ... รูปทรง ของ [SCOPE.Custom('BG_GamePiecePlural')] บางตัว"
 board_games.0001.desc.i_am_winning.trait.chaste:0 ""นี่คือปัญหาของ [SCOPE.Custom('BG_GameType')]," คู่ต่อสู้ของข้าร้องออกมา พลางกวัดแกว่งมืออย่างบ้าคลั่ง "มันปลุกเร้าอารมณ์! กระตุ้นความรู้สึก! มันคือความดิบเถื่อน ความใคร่ในรูปแบบที่ต่ำทรามที่สุด""
 board_games.0001.desc.i_am_winning.trait.gluttonous:0 "คู่ต่อสู้ของข้าเคี้ยวขนมปังม้วนเล็กๆ อย่างเหม่อลอย จมอยู่ในภวังค์ของเศษขนมปังและสมาธิ"
 board_games.0001.desc.i_am_winning.trait.temperate:0 ""หึมมม," คู่ต่อสู้ของข้าพึมพำ "การเสี่ยง เช่นนี้จะนำความเดือดร้อนมาให้ท่านสักวันหนึ่ง""
 board_games.0001.desc.i_am_winning.trait.greedy:0 "คู่ต่อสู้ของข้าดีดเหรียญเล่นระหว่างนิ้วของ [bg_opponent.GetHerHis] อย่างเหม่อลอย โลหะเย็นๆ คงจะช่วยปลอบประโลม [bg_opponent.GetHerHim] ขณะที่ [bg_opponent.GetSheHe] มองดูความพ่ายแพ้ที่ใกล้เข้ามาของ [bg_opponent.GetHerHis]"
 board_games.0001.desc.i_am_winning.trait.generous:0 "คู่ต่อสู้ของข้ายิ้มให้ข้าอย่างใจดี "ท่านทำได้ #EMP เยี่ยม#! มาก ทำต่อไป!"
 board_games.0001.desc.i_am_winning.trait.lazy:0 ""โอ้ ถึงตาข้าแล้วรึ?" คู่ต่อสู้ของข้าหาว "ขออภัย ข้าไม่ได้ใส่ใจมาก #EMP นัก#!""
 board_games.0001.desc.i_am_winning.trait.diligent:0 ""ใช่ ท่านกำลังนำอยู่ตอนนี้," คู่ต่อสู้ของข้าเทศนา, "แต่ด้วยความพยายามอีกเล็กน้อย ข้าก็สามารถตามทันได้!""
 board_games.0001.desc.i_am_winning.trait.wrathful:0 "เส้นเลือดอันน่าเกลียดเส้นหนึ่งกำลังปูดโปน [bg_opponent.Custom('MaskFace_BehindIn')] [bg_opponent.Custom('MaskFace')] ของคู่ต่อสู้ของข้า "หากเจ้ายังชนะต่อไป ข้าจะ #EMP กระอัก#! โลหิตรดกระดานนี้ให้ทั่วเลย ไอ้ [bg_myself.Custom2('InsultNoun', SCOPE.sC('bg_opponent'))] ขี้โกง!""
 board_games.0001.desc.i_am_winning.trait.calm:0 "ท่าทีอันสงบนิ่งตามปกติของคู่ต่อสู้ข้านั้น... บิดเบี้ยวไป รอยขมวดคิ้วเล็กน้อยบดบัง [bg_opponent.Custom('MaskFace_BehindAcross')] [bg_opponent.GetHerHis] [bg_opponent.Custom('MaskFace')] ของ [bg_opponent.GetHerHis]"
 board_games.0001.desc.i_am_winning.trait.patient:0 ""ท่านอาจจะได้เปรียบอยู่ ณ ตอนนี้," คู่ต่อสู้ของข้าสังเกต, "แต่ท่านจะต้องพลาดในที่สุด พวกเขาพลาดกันทุกคน""
 board_games.0001.desc.i_am_winning.trait.impatient:0 ""สาบานต่อ [bg_opponent.GetFaith.HighGodName] ท่านชนะแล้ว #EMP โอเค#!?" คู่ต่อสู้ของข้าขมวดคิ้ว "แค่ #EMP จบ#! มันเสียที""
 board_games.0001.desc.i_am_winning.trait.arrogant:0 ""ท่านไม่ได้กำลังเอาชนะข้าจริงๆ หรอก ท่านรู้ไหม," คู่ต่อสู้ของข้าป่าวประกาศ "ท่านอาจจะ #EMP คิด#! ว่าท่านทำได้ แต่มันเป็นไปไม่ได้""
 board_games.0001.desc.i_am_winning.trait.humble:0 "ใบหูของคู่ต่อสู้ข้าแดง #EMP อย่างเห็นได้ชัด#! ด้วยความไม่พอใจ "ปฏิเสธไม่ได้เลยว่าเทคนิคของท่านนั้น...," [bg_opponent.GetSheHe] กลืนน้ำลาย, "ไร้ที่ติ""
 board_games.0001.desc.i_am_winning.trait.deceitful:0 ""ดูเหมือนท่านต้องการไปส้วมนะ," คู่ต่อสู้ของข้าแนะนำอย่างเห็นอกเห็นใจ "เชิญตามสบายเลย ข้าจะเฝ้ากระดานให้เอง""
 board_games.0001.desc.i_am_winning.trait.honest:0 ""ข้าไม่ได้คาดว่าท่านจะเป็น..." คู่ต่อสู้ของข้าหยุดชั่วครู่, "#EMP คู่ต่อสู้ที่ยากลำบาก#! ขนาดนี้""
 board_games.0001.desc.i_am_winning.trait.craven:0 "คู่ต่อสู้ของข้าอยู่ไม่สุข กระสับกระส่ายไปมา ดูเหมือนใกล้จะเผ่นหนีไปเต็มที"
 board_games.0001.desc.i_am_winning.trait.brave:0 ""ข้ามีแผนแล้ว," คู่ต่อสู้ของข้าโอ้อวด, "และมันจะพลิกเกมนี้ทั้งหมด!""
 board_games.0001.desc.i_am_winning.trait.shy:0 "คู่ต่อสู้ของข้านิ่งเงียบและไม่เคลื่อนไหว ขมวดคิ้วขณะที่ [bg_opponent.GetSheHe] ครุ่นคิดว่าจะพลิกเกมของเราเข้าข้าง [SCOPE.Custom('BG_GamePiecePlural')] ของ [bg_opponent.GetHerHis] ได้อย่างไร"
 board_games.0001.desc.i_am_winning.trait.gregarious:0 ""ท่านเก่งกว่าคู่เล่นปกติของข้ามาก," คู่ต่อสู้ของข้าชื่นชม, "และข้าก็เล่น [SCOPE.Custom('BG_GameType')] #EMP บ่อยมาก#!""
 board_games.0001.desc.i_am_winning.trait.ambitious:0 ""ข้าเคย..." คู่ต่อสู้ของข้าพูดติดขัด พูดไม่ออก, "...มีหวังกับแมตช์นี้ #EMP สูงกว่านี้#!""
 board_games.0001.desc.i_am_winning.trait.content:0 ""อา เอาเถอะ," คู่ต่อสู้ของข้าถอนหายใจ, "ข้าอาจจะไม่ชนะเกมนี้ แต่ข้าก็ได้พยายามอย่างเต็มที่แล้ว""
 board_games.0001.desc.i_am_winning.trait.arbitrary:0 ""ข้าไม่เข้าใจว่าทำไมเราถึงใช้กฎของข้าไม่ได้," คู่ต่อสู้ของข้าคร่ำครวญ "ข้าบอกท่านแล้วนะ นี่คือวิธีที่ทุกคนเล่นกันใน [bg_opponent.GetCurrentLocation.GetNameNoTooltip]""
 board_games.0001.desc.i_am_winning.trait.just:0 ""ข้าพิสูจน์ไม่ได้," คู่ต่อสู้ของข้าพึมพำ, "แต่ข้า #EMP แน่ใจ#! ว่าท่านต้องโกงแน่ๆ""
 board_games.0001.desc.i_am_winning.trait.cynical:0 ""แหงล่ะ #EMP ท่าน#! กำลังชนะอยู่แล้ว," คู่ต่อสู้ของข้าครวญครางอย่างหดหู่ "ไม่เคยมี #EMP ใคร#! ปล่อยให้ข้าชนะเกม [SCOPE.Custom('BG_GameType')] เลย""
 board_games.0001.desc.i_am_winning.trait.zealous:0 "\"ขอ [bg_opponent.GetFaith.KnowledgeGodName] โปรดช่วยข้าพเจ้าให้พ้นจากภัยนี้ด้วยเถิด\" คู่ต่อสู้ของข้าพึมพำอยู่ใต้ลมหายใจของ [bg_opponent.GetHerHis]"
 board_games.0001.desc.i_am_winning.trait.paranoid:0 ""ท่านวางแผนเรื่องนี้ไว้แล้วใช่ไหม?" คู่ต่อสู้ของข้าแทบจะคำรามออกมา "วางแผนที่จะ #EMP ทำให้อับอาย#! ด้วยเกมที่จัดฉากไว้!""
 board_games.0001.desc.i_am_winning.trait.trusting:0 ""สาบานต่อ [bg_opponent.GetFaith.KnowledgeGodName]," คู่ต่อสู้ของข้าคร่ำครวญ "ท่านคิดว่าข้าเปิดช่องให้ท่านมากเกินไปหรือไม่? ข้าไม่ได้คาดว่าจะแพ้ยับเยินเร็วขนาดนี้""
 board_games.0001.desc.i_am_winning.trait.compassionate:0 ""รู้ไหม," คู่ต่อสู้ของข้าครุ่นคิดอย่างมีความหมาย, "[SCOPE.Custom('BG_GameType')] ควรจะเป็นเรื่องของการมี #EMP ความสนุก#! ไม่ใช่แค่การชนะไม่ว่าจะต้องแลกด้วยอะไรก็ตาม""
 board_games.0001.desc.i_am_winning.trait.callous:0 ""หืม นี่สินะความรู้สึกของการพ่ายแพ้?" คู่ต่อสู้ของข้าสงสัย "ไม่ใช่สิ่งที่ข้าชอบเป็นพิเศษเลย""
 board_games.0001.desc.i_am_winning.trait.sadistic:0 "คู่ต่อสู้ของข้านิ่งเงียบ [bg_opponent.Custom('EyeEyes')] เผยให้เห็นความเคารพอย่างไม่เต็มใจต่อทักษะและชัยชนะที่ใกล้เข้ามา"
 board_games.0001.desc.i_am_winning.trait.stubborn:0 ""ท่านไม่มีทางเอาชนะข้าได้," คู่ต่อสู้ของข้าเอ่ยลอดไรฟัน "ไม่เคยมี #EMP ใคร#! เอาชนะข้าได้""
 board_games.0001.desc.i_am_winning.trait.fickle:0 ""ข้าเริ่มเบื่อ [SCOPE.Custom('BG_GameType')] เต็มทีแล้ว," คู่ต่อสู้ของข้าครวญคราง "เราไปเล่นอย่างอื่นกันไม่ได้หรือ?""
 board_games.0001.desc.i_am_winning.trait.vengeful:0 "สีหน้าของคู่ต่อสู้ข้าแข็งกระด้าง นิ้วของ [bg_opponent.GetHerHis|U] กำขอบกระดานแน่น ราวกับกำลังควบคุมตัวเองอยู่"
 board_games.0001.desc.i_am_winning.trait.forgiving:0 "คู่ต่อสู้ของข้าดูสงบนิ่งอย่างสมบูรณ์ ไร้ ซึ่งร่องรอยความเคียดแค้นใดๆ ปรากฏ [bg_opponent.Custom('MaskFace_BehindAcross')] [bg_opponent.GetHerHis] [bg_opponent.Custom('MaskFace')]"
 board_games.0001.desc.i_am_winning.trait.rowdy:0 ""แค่บอกให้รู้นะ," คู่ต่อสู้ของข้ากระซิบ, "ถ้าข้าแพ้ ข้าจะขว้างเกมบ้านี่ใส่หัวโง่ๆ ของท่าน""
 board_games.0001.desc.i_am_winning.trait.charming:0 ""ท่านไม่อยากจะออมมือให้ข้า #EMP สักหน่อย#! รึ?" คู่ต่อสู้ของข้าถาม เสียงของ [bg_opponent.GetHerHis] หวานเลี่ยน"
 board_games.0001.desc.i_am_winning.trait.curious:0 ""เดี๋ยวนะ... ท่าน #EMP ชนะ#! ได้อย่างไร?". คู่ต่อสู้ของข้าดูประหลาดใจอย่างยิ่ง"
 board_games.0001.desc.i_am_winning.trait.pensive:0 ""โอ้ ไม่นะ ข้ารู้อยู่แล้วว่าข้าไม่ควรเล่น... ตอนนี้ข้า ทำให้ท่านเสียเวลาแล้ว..." คู่ต่อสู้ของข้าพึมพำ"
 board_games.0001.desc.i_am_winning.trait.bossy:0 ""หึ ถ้าเราเล่นตามกฎ #EMP ของข้า#! #EMP แล้วล่ะก็#! ข้าคงสอนบทเรียนให้ท่านไปแล้ว!" คู่ต่อสู้ของข้าครวญคราง"
 board_games.0001.desc.i_am_winning.relation.friend:0 ""ให้ตายสิ," สหายของข้าหัวเราะเบาๆ, "ท่านไม่ออมมือใน [SCOPE.Custom('BG_GameType')] ให้ใครเลยสินะ?""
 board_games.0001.desc.i_am_winning.relation.best_friend:0 ""ไม่มีอะไรดีไปกว่านี้อีกแล้ว ข้าพูดเสมอ," สหายรักของข้าป่าวประกาศ, "ยิ่งกว่าการเอาชนะใครสักคนใน [SCOPE.Custom('BG_GameType')] อย่างราบคาบ ข้าอิจฉาท่านนะ!""
 board_games.0001.desc.i_am_winning.relation.rival:0 ""ท่านนี่มัน #EMP ชอบ#! ทำให้อับอายเสียจริงนะ?" คู่ปรับของข้าถ่มน้ำลายออกมา ผู้แพ้ที่เจ็บใจเสมอ"
 board_games.0001.desc.i_am_winning.relation.nemesis:0 "$board_games.0001.desc.opponent_winning.relation.nemesis$"
 board_games.0001.desc.i_am_winning.relation.lover:0 ""เราไม่ #EMP จำเป็น#! ต้องเล่น [SCOPE.Custom('BG_GameType')] กันนะ [bg_myself.GetFirstNameNoTooltip]," คนรักของข้ากระซิบ "ข้าแน่ใจว่ามีวิธีอื่นที่เราจะสร้างความบันเทิงให้กันได้..."
 board_games.0001.desc.i_am_winning.relation.soulmate:0 "$board_games.0001.desc.opponent_winning.relation.soulmate$"
 board_games.0001.desc.i_am_winning.relation.bully:0 ""ถ้าท่านเอาชนะข้า ข้าก็จะตบตีท่าน มันง่ายแค่นั้นแหละ," อันธพาลของข้าขมวดคิ้ว"
 board_games.0001.desc.i_am_winning.relation.victim:0 "เหยื่อของข้านิ่งเงียบ แต่ดูเหมือน [bg_opponent.GetSheHe] จะใกล้จะร้องไห้เต็มที"
 board_games.0001.desc.i_am_winning.relation.crush:0 "คนที่ข้าแอบชอบคือ... โอ้ ไม่นะ! [bg_opponent.GetSheHe|U] โกรธข้าแล้ว ข้ารู้แน่ ข้าอ่านได้จาก [bg_opponent.GetHerHis] [bg_opponent.Custom('MaskFace')] ของ [bg_opponent.GetHerHis]!"
 board_games.0001.desc.i_am_winning.relation.guardian:0 ""ดูเหมือนท่านกำลังเรียนรู้," ผู้ปกครองของข้าตั้งข้อสังเกตอย่างสงสัย "หรืออย่างน้อยก็เลียนแบบข้าได้อย่างมีประสิทธิภาพมากขึ้น""
 board_games.0001.desc.i_am_winning.relation.ward:0 "ผู้อยู่ในอุปการะของข้าเจ็บปวดอย่างเห็นได้ชัดจากการที่ [bg_opponent.GetSheHe] กำลังแพ้อย่างยับเยิน รอยขมวดคิ้วอันแข็งกร้าวปรากฏ [bg_opponent.Custom('MaskFace_BehindAcross')] [bg_opponent.GetHerHis] [bg_opponent.Custom('MaskFace')]"
 board_games.0001.desc.i_am_winning.hook_on.weak:0 "$board_games.0001.desc.i_am_winning.hook_on.strong$"
 board_games.0001.desc.i_am_winning.hook_on.strong:0 ""[bg_opponent.GetFaith.random_GoodGodNames]! ท่านปล่อยให้ข้ามีอำนาจควบคุมแม้ แต่น้อยนิดไม่ได้เลยใช่ไหม?" คู่ต่อสู้ของข้าคร่ำครวญ"
 board_games.0001.desc.i_am_winning.hooked_by.weak:0 "$board_games.0001.desc.i_am_winning.hooked_by.strong$"
 board_games.0001.desc.i_am_winning.hooked_by.strong:0 ""หากไม่ใช่ เพราะมันเป็นการสิ้นเปลืองที่จะเรียกคืนสิ่งที่ท่าน #EMP ติดหนี้#! ที่นี่," คู่ต่อสู้ของข้าขมวดคิ้ว, "ข้าคงอยากจะ #EMP บังคับ#! ให้ท่านแพ้เสียแล้ว""
 board_games.0001.desc.i_am_winning.match_history.recently_won_against.default:0 ""อืม," คู่ต่อสู้ของข้าครวญคราง, "ดูเหมือนเกม #EMP นี้#! จะไม่เข้าทางข้าเสียแล้ว""
 board_games.0001.desc.i_am_winning.match_history.recently_won_against.county:0 ""หากเพียงท่านเล่นได้ดีขนาดนี้ตอนที่ [bg_myself.MakeScope.Var('bg_recent_land_loss_stake').Title.GetNameNoTier] เป็นเดิมพัน," คู่ต่อสู้ของข้าแสยะยิ้ม"
 board_games.0001.desc.i_am_winning.match_history.recently_won_against.gamble:0 ""อาาา," คู่ต่อสู้ของข้าถอนหายใจ "มีแพ้ มีชนะ ครั้งนี้ถึงตาของท่านที่จะชนะแล้ว ข้าคิดว่านะ""
 board_games.0001.desc.i_am_winning.match_history.recently_lost_against.default:0 ""ไม่ ไม่ ไม่!" คู่ต่อสู้ของข้าครวญคราง "ไม่ #EMP อีกแล้ว#! ไม่ใช่กับ #EMP ท่าน#!!"
