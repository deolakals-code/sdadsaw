 # EVENTS
 char_interaction.0300.desc: "ข้าไม่เห็นประโยชน์อันใดที่จะได้รับจากการรับ [actor.Custom2('RelationToMeShort', SCOPE.sC('secondary_actor'))] ของท่าน, [secondary_actor.GetFirstName], มาเป็นตัวประกันของข้าในเวลานี้"
 char_interaction.0300.a: "เป็น เช่นนั้นรึ?"
 char_interaction.0301.desc: "ข้าคงทำได้เพียงปฏิเสธคำเรียกร้องอันไร้ไหวพริบของท่านที่จะรับ [recipient.Custom2('RelationToMeShort', SCOPE.sC('secondary_recipient'))] ของข้า, [secondary_recipient.GetFirstName], ไปเป็นตัวประกันของท่าน"
 char_interaction.0301.a: "โง่เขลา."
 char_interaction.0311.desc: "โปรดหยุดความพยายามที่จะเจรจาสงบศึกระหว่างเรา ข้าไม่สามารถตกลงแลกเปลี่ยนตัวประกันกับท่านได้ในเวลานี้"
 char_interaction.0311.a: "ให้มันเป็นไป."
 char_interaction.0320.opening: "[actor.Custom2('AppropriateGreetingPositive', recipient )]"
 char_interaction.0320.desc: "ข้าไม่พบเหตุผลใดที่จะควบคุมตัว [recipient.Custom2('RelationToMeShort', SCOPE.sC('secondary_recipient'))] ของท่าน, [secondary_recipient.GetFirstName], ไว้ในฐานะตัวประกันของ [actor.GetPrimaryTitle.GetAdjectiveNoTooltip] อีกต่อไป"
 char_interaction.0320.a: "[secondary_recipient.GetSheHe|U] กลับมาแล้ว!"
 char_interaction.0330.desc: "ข้ายินดีที่จะรับ [hostage_sender.Custom2('RelationToMeShort', SCOPE.sC('hostage'))] ของท่าน, [hostage.GetFirstName], มาเป็นตัวประกันของข้า\n\nข้าตั้งตารอการมาถึงของ [hostage.GetHerHis] ใน [hostage_taker.GetCapitalLocation.GetNameNoTooltip]"
 char_interaction.0330.a: "ดีมาก"
 char_interaction.0331.desc: "ข้าไม่เห็นทางเลือกอื่นนอกจากยอมรับคำเรียกร้องของท่านที่จะรับ [hostage_sender.Custom2('RelationToMeShort', SCOPE.sC('hostage'))] ของข้า, [hostage.GetFirstName], ไปเป็นตัวประกันของท่าน\n\n[hostage.GetSheHe|U] จะออกเดินทางไปยัง [hostage_taker.GetCapitalLocation.GetNameNoTooltip] โดยทันที"
 char_interaction.0331.a: "ยอดเยี่ยม"
 char_interaction.0332.desc: "ข้าต้องยอมรับข้อเสนอของท่านที่จะแลกเปลี่ยน [hostage_sender_2.Custom2('RelationToMeShort', SCOPE.sC('hostage_2'))] ของข้า, [hostage_2.GetTitledFirstName], และ [hostage_sender_1.Custom2('RelationToMeShort', SCOPE.sC('hostage_1'))] ของท่าน, [hostage_1.GetTitledFirstName], ในฐานะตัวประกัน"
 char_interaction.0332.a: "สมบูรณ์แบบ"
 char_interaction.0340.opening: "[recipient.Custom2('AppropriateGreetingPositive', actor)]"
 char_interaction.0340.desc: "ข้ายอมรับคำขอของท่านให้ [home_court.Custom2('RelationToMeShort', SCOPE.sC('hostage'))] ของท่าน, [hostage.GetFirstNamePossessive], กลับคืนไป\n\nข้าเชื่อว่าสิ่งนี้จะไม่ ทำให้ความสัมพันธ์ของเราขุ่นเคือง"
 char_interaction.0340.a: "ขอบคุณ [ROOT.Char.GetFaith.HighGodNameAlternate]"
 char_interaction.0341.desc: "ข้าเกรงว่าข้าจำเป็นต้องควบคุมตัว [actor.Custom2('RelationToMeShort', SCOPE.sC('secondary_recipient'))] ของท่าน, [secondary_recipient.GetFirstName], ไว้ใน [recipient.GetCapitalLocation.GetNameNoTooltip] อีกสักระยะ"
 char_interaction.0341.a: "เจ้าคนหยาบคาย..."
