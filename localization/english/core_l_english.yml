 variable_desc:0 "ตัวแปรสคริปต์สามารถเข้าถึงและแก้ไขได้โดยสคริปต์ ปัจจุบันมีรูปแบบดังต่อไปนี้:\n\nvariable:example_number = 1\nvariable:example_flag = flag:example\nvariable:example_scope = root\nvariable:example_bool = yes"
 flag_desc:0 "แฟล็กเป็นเครื่องหมายอย่างง่ายที่คุณสามารถใช้เพื่อติดตามว่ามีบางอย่างเกิดขึ้นในเกม พวกมันมีประเภทเฉพาะขึ้นอยู่กับชนิดของสโคปที่ตั้งค่าไว้ (แฟล็กตัวละคร, แฟล็กแผนการ, ฯลฯ) สโคปเฉพาะ ( เช่น ตัวละครเฉพาะ) จะมีแฟล็กตั้งค่าไว้จนกว่าจะถูกลบโดยเอฟเฟกต์ หรือจนกว่าตัวจับเวลาจะหมดลง หากมีการกำหนดตัวจับเวลาไว้"
