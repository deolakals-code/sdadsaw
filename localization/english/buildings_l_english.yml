 building_type_holy_site_cologne_cathedral_01:0 "อาสนวิหารโคโลญ"
 building_type_holy_site_cologne_cathedral_01_desc:0 "อาสนวิหารโคโลญเป็นที่ประดิษฐานพระธาตุของกษัตริย์สามองค์ ซึ่งดึงดูดความสนใจของผู้แสวงบุญจากทั่วโลกคริสเตียน อาสนวิหารสร้างขึ้นโดยใช้สถาปัตยกรรมกอทิกและประดับประดาอย่างหรูหราด้วยยอดแหลมและรายละเอียดอันซับซ้อน"
