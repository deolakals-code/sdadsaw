 building_type_brihadeeswarar_temple_01:0 "วัดพฤหัตถีศวร"
 building_type_brihadeeswarar_temple_01_desc:0 "วัดพฤหัตถีศวรอุทิศให้กับพระศิวะ เทพเจ้าในศาสนาฮินดู และเป็นหนึ่งในวัดอินเดียใต้ที่ใหญ่ที่สุดที่สร้างขึ้นในสถาปัตยกรรมดราวิเดียนอันวิจิตร ชื่อของวัดเป็นคำประสมภาษาสันสกฤตที่แปลคร่าวๆ ว่า "วัดแห่งพระศิวะผู้ยิ่งใหญ่""
