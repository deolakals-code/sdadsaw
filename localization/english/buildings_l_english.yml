 building_type_powder_magazine_01: "ผู้ผลิตดินปืน"
 building_type_powder_magazine_01_desc: "ดินปืนต้องการการผลิต การจัดเก็บ และการบำรุงรักษาโดยเฉพาะ เพื่อให้คงประสิทธิภาพ เพื่อที่จะเกณฑ์ [GetMaA('handgunners').GetName] และหน่วยอื่น ๆ ที่ต้องการกำลังอันทรงพลังนี้ จำเป็นต้องสร้างอาคารพิเศษ"
 building_powder_magazine_01: "คลังเก็บดินปืน"
 building_powder_magazine_01_desc: "คลังที่สามารถเก็บดินปืนให้ปลอดภัยจากสภาพอากาศ เพื่อลดความเสี่ยงต่ออุบัติเหตุ"
 building_powder_magazine_02: "สำนักงานขนส่งดินปืน"
 building_powder_magazine_02_desc: "การจ้างเจ้าหน้าที่ที่สามารถควบคุมดูแลแรงงานที่อุทิศตนเพื่อจัดการการขนส่งดินปืนอันซับซ้อน จะช่วยให้มั่นใจว่าดินปืนถูกจัดเก็บอย่างถูกต้องและขนส่งไปทั่วอาณาจักรโดยไม่เกิดอุบัติเหตุ"
 building_powder_magazine_03: "เหมืองกำมะถัน"
 building_powder_magazine_03_desc: "กำมะถัน หรือบางครั้งเรียกว่าหินติดไฟ มีอยู่มากมาย แต่ยากที่จะผลิตในปริมาณมาก เหมืองโดยเฉพาะจะช่วยให้มั่นใจว่ามีแร่ธาตุล้ำค่านี้อย่างต่อเนื่อง"
 building_powder_magazine_04: "โรงงานดินประสิว"
 building_powder_magazine_04_desc: "ส่วนประกอบสำคัญในการสร้างดินปืน ดินประสิวต้องการฝีมือที่ชำนาญในสภาพแวดล้อมควบคุม หากต้องการผลิตในปริมาณมากโดยไม่ ทำให้อาคารทั้งหลังมอดไหม้"
 building_powder_magazine_05: "คลังแสงดินปืน"
 building_powder_magazine_05_desc: "การเก็บดินปืนจำเป็นต้องสร้างอาคารโดยเฉพาะที่มีกำแพงเสริมความแข็งแรง ตั้งอยู่ในที่ปลอดภัย ห่างจากสถานที่ที่มีผู้อยู่อาศัยและมีค่า"
 building_powder_magazine_06: "ป้อมยาม"
 building_powder_magazine_06_desc: "ดินปืนเป็นอันตรายในตัวมันเอง แต่จะยิ่งอันตรายมากขึ้นหากตกไปอยู่ในมือคนผิด บัดนี้สามารถจ้างยามจำนวนมากเพื่อเก็บดินปืนให้ปลอดภัยจากสายตาที่สอดส่อง"
 building_powder_magazine_07: "ห้องปฏิบัติการกลั่นดินปืน"
 building_powder_magazine_07_desc: "อาคารแยกต่างหากที่ ซึ่งส่วนประกอบต่าง ๆ ถูกรวมเข้าด้วยกันเพื่อสร้างดินปืน หากเกิดอุบัติเหตุ หวังว่ามันจะไม่ทำลายสถานที่ทั้งหมดอีกต่อไป"
 building_powder_magazine_08: "โรงงานปืนใหญ่ทือ"
 building_powder_magazine_08_desc: "ปืนใหญ่ทืออาจไม่น่าเชื่อถือและแตกหักระหว่างใช้งาน เราจึงต้องจัดหาอุปกรณ์ที่ดีที่สุดเท่าที่จะเป็นไปได้ และจ้างช่างฝีมือที่เก่งกาจที่สุดเพื่อผลิตอาวุธคุณภาพสูงสุด"
 powder_magazine_1_effect_desc: "$unlocks_building_desc$ขีดจำกัดการเกณฑ์ [men_at_arms|E] [gunpowder|E]: #P +[EmptyScope.ScriptValue('gunpowder_building_limit_bonus_1')|0]#!"
 powder_magazine_2_effect_desc: "$unlocks_building_desc$ขีดจำกัดการเกณฑ์ [men_at_arms|E] [gunpowder|E]: #P +[EmptyScope.ScriptValue('gunpowder_building_limit_bonus_2')|0]#!"
 powder_magazine_3_effect_desc: "$unlocks_building_desc$ขีดจำกัดการเกณฑ์ [men_at_arms|E] [gunpowder|E]: #P +[EmptyScope.ScriptValue('gunpowder_building_limit_bonus_3')|0]#!"
 
 building_type_mandala_capital_01: "กลุ่มวิหารเมืองหลวง"
 building_type_mandala_capital_01_desc: "[great_project|E] นี้ไม่ได้เป็นเพียงวิหาร มันคือเครื่องพิสูจน์ถึงความมุ่งมั่นของเรา ความสำเร็จของเรา #EMP ความยิ่งใหญ่#! ของเรา วิหาร เช่นนี้แสดงถึงการปกครองและความเมตตาของเทวราชาผู้ศักดิ์สิทธิ์และทรงพลังของเรา"
 building_mandala_capital_01: "วิหารอันวิจิตร"
 building_mandala_capital_01_desc: "จุดเริ่มต้นอันถ่อมตนสู่มรดกอันยิ่งใหญ่ วิหารอันวิจิตรแห่งนี้เป็นสถานที่สักการะและสวดภาวนาต่อเทวราชาผู้ปกครอง"
 building_mandala_capital_02: "วิหารอันตระการตา"
 building_mandala_capital_02_desc: "ปรับปรุงจากอาคารวิหารเดิม วิหารเมืองหลวงได้ขยายเพิ่มเติมด้วยศาลเจ้า เครื่องตก แต่ง และเครื่องประดับ"
 building_mandala_capital_03: "เขตวิหาร"
 building_mandala_capital_03_desc: "มีการเพิ่มที่พักอาศัยเพื่อขยายวิหารให้กลายเป็นเขตวิหารที่กำลังเติบโต\nบัดนี้เป็นที่ตั้งของศาลเจ้าหลายแห่งสำหรับการสักการะ ตลอดจนที่พักพิงสำหรับผู้สักการะ ผู้รับใช้ และคณะสงฆ์"
 building_mandala_capital_04: "กลุ่มมหาวิหาร"
 building_mandala_capital_04_desc: "กลุ่มวิหารบัดนี้มีขนาดเท่าหมู่บ้านเล็ก ๆ และพึ่งพาตนเองได้เป็นส่วนใหญ่ในสิ่งจำเป็นส่วนมาก\nมีการเพิ่มที่เก็บวัตถุมงคลขนาดเล็กและสระน้ำสะท้อนเงาที่ทอดยาวจากตะวันออกไปตะวันตก เพิ่มการเชื่อมต่อกับภพภูมิวิญญาณยิ่งขึ้น"
 building_mandala_capital_05: "ราชมณเฑียรวิหารสวรรค์"
 building_mandala_capital_05_desc: "อัญมณีทางสถาปัตยกรรมที่พบเห็นได้ยาก ราชมณเฑียรวิหารได้ขยายเพิ่มเติมด้วยที่พักอันงดงามสำหรับเทวราชาผู้ศักดิ์สิทธิ์\nอนุสาวรีย์ วัตถุมงคล สมบัติ — นักเดินทางมาจากทั่วทุกสารทิศเพื่อตื่นตตลึงกับความหรูหราของราชมณเฑียรวิหารสวรรค์แห่งนี้"

 building_type_wulingyuan_01: "$building_wulingyuan_01$"
 building_type_wulingyuan_01_desc: "$building_wulingyuan_01_desc$"
 building_wulingyuan_01: "อู่หลิงหยวน"
 building_wulingyuan_01_desc: "ภูเขาเหล่านี้เต็มไปด้วยเสาหินทรายตระหง่านนับพันที่สูงตระหง่านเหนือพื้นดิน แม้ว่าเสาหินจะเป็นลักษณะเด่นที่สุด แต่พื้นที่นี้ยังเต็มไปด้วยหุบเหว ลำธาร ทะเลสาบเล็ก ๆ และถ้ำ"

 building_type_leshan_giant_buddha_01: "$building_leshan_giant_buddha_01$"
 building_type_leshan_giant_buddha_01_desc: "$building_leshan_giant_buddha_01_desc$"
 building_leshan_giant_buddha_01: "พระพุทธรูปเล่อซาน"
 building_leshan_giant_buddha_01_desc: "แกะสลักเข้าไปในหน้าผา พระพุทธรูปองค์นี้หันหน้าไปทางจุดบรรจบของแม่น้ำหมิ่นและแม่น้ำต้าตู้ ทักทายนักเดินทางผู้เหนื่อยล้าในการเดินทาง"

 building_type_yungang_grottoes_01: "$building_yungang_grottoes_01$"
 building_type_yungang_grottoes_01_desc: "$building_yungang_grottoes_01_desc$"
 building_yungang_grottoes_01: "ถ้ำหยุนกัง"
 building_yungang_grottoes_01_desc: "กลุ่มถ้ำวัดขนาดใหญ่ ประกอบด้วยถ้ำขนาดใหญ่หลายสิบแห่งและถ้ำขนาดเล็กอีกหลายร้อยแห่ง ถ้ำเหล่านี้เต็มไปด้วยพระพุทธรูปนับพันนับหมื่นองค์"

 building_type_wudang_mountain_temples_01: "$building_wudang_mountain_temples_01$"
 building_type_wudang_mountain_temples_01_desc: "$building_wudang_mountain_temples_01_desc$"
 building_wudang_mountain_temples_01: "หมู่วิหารภูเขาอู่ตัง"
 building_wudang_mountain_temples_01_desc: "เทือกเขาอู่ตังเป็นหนึ่งในภูเขาหลายแห่งที่ศักดิ์สิทธิ์สำหรับลัทธิเต๋า อีกทั้งยังเป็นที่ตั้งของกลุ่มวิหารขนาดใหญ่ ซึ่งมีชื่อเสียงในเรื่องการฝึกไท่เก๊ก"

 building_type_shaolin_monastery_01: "$building_shaolin_monastery_01$"
 building_type_shaolin_monastery_01_desc: "$building_shaolin_monastery_01_desc$"
 building_shaolin_monastery_01: "วัดเส้าหลิน"
 building_shaolin_monastery_01_desc: "วัดเส้าหลินอาจมีชื่อเสียงที่สุดในฐานะแหล่งกำเนิดของกังฟูเส้าหลินและผลิตพระภิกษุที่มีทักษะสูงในศิลปะการต่อสู้ อย่างไรก็ตาม ที่นี่ยังเป็นสถานที่แห่งการเรียนรู้และการศึกษา และสำหรับการแปลคัมภีร์พุทธศาสนา"

 building_type_lingyin_temple_01: "$building_lingyin_temple_01$"
 building_type_lingyin_temple_01_desc: "$building_lingyin_temple_01_desc$"
 building_lingyin_temple_01: "วัดหลิงอิ่น"
 building_lingyin_temple_01_desc: "วัดหลิงอิ่นก่อตั้งโดยพระภิกษุและผู้แสวงบุญชาวอินเดียในปี ค.ศ. 328 เพื่อเผยแผ่พระพุทธศาสนา ตั้งแต่นั้นมา วัดก็ได้เติบโตอย่างมหาศาล มีศาลาหลายหลัง ถ้ำและเจดีย์จำนวนมาก และมีหอพักเพียงพอสำหรับพระภิกษุนับพันรูป"

 building_type_giant_wild_goose_pagoda_01: "$building_giant_wild_goose_pagoda_01$"
 building_type_giant_wild_goose_pagoda_01_desc: "$building_giant_wild_goose_pagoda_01_desc$"
 building_giant_wild_goose_pagoda_01: "เจดีย์ห่านป่าใหญ่"
 building_giant_wild_goose_pagoda_01_desc: "เจดีย์ห่านป่าใหญ่เดิมสร้างขึ้นในปี ค.ศ. 652 เพื่อเป็นสถานที่เก็บรักษาตำรา งานแกะสลัก และรูปปั้นต่าง ๆ ต่อมาถูกสร้างขึ้นใหม่ให้มีความสูงสิบชั้นที่น่าประทับใจ จนกระทั่งการบูรณะและฟื้นฟูหลายครั้งลดความสูงลงเหลือเจ็ดชั้น"

 building_type_kaifeng_palace_01: "$building_kaifeng_palace_01$"
 building_type_kaifeng_palace_01_desc: "$building_kaifeng_palace_01_desc$"
 building_kaifeng_palace_01: "พระราชวังหลวงไคเฟิง"
 building_kaifeng_palace_01_desc: "พระราชวังหลวงในไคเฟิงสร้างขึ้นเมื่อราชวงศ์ซ่งสถาปนาเมืองหลวงในนครแห่งนี้ รัฐบาลที่เข้มแข็งและมีประสิทธิภาพปกครองภายในกำแพงเหล่านี้ สร้างความมั่นใจว่านครและอาณาจักรโดยรวมจะเจริญรุ่งเรือง"
 kaifeng_examination_cost_bonus_desc: "ค่าใช้จ่ายสำหรับ [activity|E] [GetActivityType('activity_imperial_examination').GetTextIcon][GetActivityType( 'activity_imperial_examination').GetName] ขณะที่ [barony|E] นี้เป็น [realm_capital|E]: #P -[EmptyScope.ScriptValue('kaifeng_examination_cost_value')|%0]#!"
 kaifeng_palace_name_desc: "[GetBuilding('kaifeng_palace_01').GetName]"

 building_type_forbidden_city_01: "$building_forbidden_city_01$"
 building_type_forbidden_city_01_desc: "$building_forbidden_city_01_desc$"
 building_forbidden_city_01: "พระราชวังต้องห้าม"
 building_forbidden_city_01_desc: "พระราชวังต้องห้ามเป็นพระราชวังหลวงอันกว้างใหญ่ ประกอบด้วยอาคารเกือบหนึ่งพันหลัง บริเวณทั้งหมดล้อมรอบด้วยกำแพงสูงและคูลึก ปกป้องรัฐบาลผู้ปกครองและขุนนางจำนวนมากที่ทำงานอย่างไม่รู้จักเหน็ดเหนื่อยอยู่ภายใน"
 beijing_palace_bonus_desc: "[governor_efficiency|E] ของ [governors|E] ขณะที่ [barony|E] นี้เป็น [realm_capital|E]: @governor_efficiency!#P +[EmptyScope.ScriptValue('forbidden_city_bonus_value')]%#!"

 building_type_qianling_mausoleum_01: "$building_qianling_mausoleum_01$"
 building_type_qianling_mausoleum_01_desc: "$building_qianling_mausoleum_01_desc$"
 building_qianling_mausoleum_01: "สุสานเฉียนหลิง"
 building_qianling_mausoleum_01_desc: "สุสานเฉียนหลิงเป็นสุสานหลักของจักรพรรดิเกาจงและจักรพรรดินีอู่ เจ๋อเทียน แม้ว่าสมาชิกคนอื่น ๆ ในตระกูลหลี่จะถูกฝังไว้ที่นี่ เช่นกัน เนินสุสานได้รับการคุ้มครองโดยกำแพงสี่เหลี่ยมผืนผ้า และรูปปั้นหินจำนวนมากที่ประดับภูมิทัศน์เป็นหนึ่งในลักษณะที่เป็นที่รู้จักมากที่สุดของสุสาน"

 building_type_quanzhou_seaport_01: "$building_quanzhou_seaport_01$"
 building_type_quanzhou_seaport_01_desc: "$building_quanzhou_seaport_01_desc$"
 building_quanzhou_seaport_01: "ท่าเรือฉวนโจว"
 building_quanzhou_seaport_01_desc: "ท่าเรือของฉวนโจวดึงดูดพ่อค้าต่างชาติจากแดนไกล พ่อค้าเป็นที่รู้จักว่ามาจากอาระเบียและอนาโตเลีย ญี่ปุ่นและเกาหลี และทุกหนทุกแห่งในระหว่างนั้น การหลั่งไหลเข้ามาของเรือการค้านี้ช่วยให้มั่นใจว่าอุตสาหกรรมในท้องถิ่นกำลังเฟื่องฟู และ ทำให้ฉวนโจวเป็นผู้ต่อเรือชั้นนำในภูมิภาค"

 building_type_angkor_wat_01: "$building_angkor_wat_01$"
 building_type_angkor_wat_01_desc: "$building_angkor_wat_01_desc$"
 building_angkor_wat_01: "นครวัด"
 building_angkor_wat_01_desc: "นครวัดเป็นกลุ่มวิหารขนาดใหญ่ที่อุทิศให้กับเทพวิษณุ ได้รับการออกแบบให้เป็นตัวแทนของเขาพระสุเมรุ ที่ประทับของเหล่าทวยเทพในตำนานฮินดู กลุ่มวิหารล้อมรอบด้วยคูน้ำที่น่าประทับใจและมีวิหารระเบียงคดหลายแห่ง เปี่ยมไปด้วยศิลปะทางศาสนา ประติมากรรม และภาพนูนต่ำ"

 building_type_citadel_thang_long_01: "ป้อมปราการทังลอง" # 昇龍
 building_type_citadel_thang_long_01_desc: "$building_citadel_thang_long_01_desc$"
 building_citadel_thang_long_01: "ป้อมปราการด่ายลา"
 building_citadel_thang_long_01_desc: "ป้อมปราการที่ทำหน้าที่เป็นฐานทัพสำหรับกองทัพท้องถิ่นและเสริมความแข็งแกร่งอย่างมากเพื่อช่วยขับไล่ผู้บุกรุก"
 building_citadel_thang_long_02: "พระราชวังหลวงทังลอง" # 昇龍
 building_citadel_thang_long_02_desc: "พระราชวังหลวงทำหน้าที่เป็นป้อมปราการและที่ประทับของราชวงศ์ กลุ่มป้อมปราการประกอบด้วยสามส่วน คือ ป้อมปราการหลัก นครหลวง และนครต้องห้าม"

 building_type_po_klong_garai_01: "$building_po_klong_garai_01$"
 building_type_po_klong_garai_01_desc: "$building_po_klong_garai_01_desc$"
 building_po_klong_garai_01: "ปราสาทโป กลาง กาไร"
 building_po_klong_garai_01_desc: "จุดสูงสุดของสถาปัตยกรรมจาม ปราสาทโป กลาง กาไร กล่าวกันว่าสร้างขึ้นเพื่อเป็นเกียรติแก่กษัตริย์ในตำนานที่มีพระนามเดียวกัน มีหอคอยอิฐที่โดดเด่นสามหลังและประติมากรรมอันน่าประทับใจของพระศิวะเป็นงานศิลปะหลัก"

 building_type_dau_temple_01: "$building_dau_temple_01$"
 building_type_dau_temple_01_desc: "$building_dau_temple_01_desc$"
 building_dau_temple_01: "วัดเหย่า"
 building_dau_temple_01_desc: "วัดที่เคารพนับถือในลุยเลา เป็นจุดที่พระภิกษุจากแดนไกลมารวมตัวกันเป็นครั้งแรก หอคอยอิฐ พระธาตุ และปรมาจารย์มัมมี่ที่ยังคงอยู่ที่นั่น สะท้อนถึงการอุทิศตนหลายศตวรรษต่อพระพุทธศาสนา"

 building_type_liuhe_pagoda_01: "$building_liuhe_pagoda_01$"
 building_type_liuhe_pagoda_01_desc: "$building_liuhe_pagoda_01_desc$"
 building_liuhe_pagoda_01: "เจดีย์ลิ่วเหอ"
 building_liuhe_pagoda_01_desc: "เจดีย์สูงตระหง่านที่กษัตริย์สร้างขึ้นเพื่อสงบกระแสน้ำและบูชาพระพุทธเจ้า ประภาคารส่องสว่างเหนือแผ่นดิน เป็นสัญลักษณ์ของความสามัคคีระหว่างมนุษย์และสวรรค์"

 building_type_muaro_jambi_01: "$building_muaro_jambi_01$"
 building_type_muaro_jambi_01_desc: "$building_muaro_jambi_01_desc$"
 building_muaro_jambi_01: "กลุ่มอาคารมัวโรจัมบี"
 building_muaro_jambi_01_desc: "กลุ่มอาคารอิฐอันกว้างขวางของมัวโรจัมบีตั้งอยู่ริมแม่น้ำบาตังฮารี ปกป้องทั้งการค้าและความศรัทธา ในฐานะที่มั่นของศรีวิชัย ที่นี่เป็นที่ลี้ภัยสำหรับผู้ปกครองและระดมกองทัพในใจกลางเกาะสุมาตรา"

 building_type_hanging_temple_01: "$building_hanging_temple_01$"
 building_type_hanging_temple_01_desc: "$building_hanging_temple_01_desc$"
 building_hanging_temple_01: "วัดแขวน"
 building_hanging_temple_01_desc: "วัดแขวนเป็นอารามที่ห้อยอยู่บนหน้าผาที่ภูเขาเหิง ตามตำนาน การก่อสร้างเริ่มขึ้นเมื่อหลายศตวรรษก่อนโดยพระภิกษุนามว่าเลี่ยวหราน โถงไม้ ซึ่งสร้างบนเสาค้ำยัน เป็นที่ตั้งของศาลเจ้าของนักปราชญ์ชาวพุทธ เต๋า และขงจื๊อ ผสมผสานความเชื่อและท้าทายแรงโน้มถ่วงด้วยความสง่างามอันเงียบสงบ"

 building_type_pagoda_of_fogong_temple_01: "$building_pagoda_of_fogong_temple_01$"
 building_type_pagoda_of_fogong_temple_01_desc: "$building_pagoda_of_fogong_temple_01_desc$"
 building_pagoda_of_fogong_temple_01: "เจดีย์วัดโฝกง"
 building_pagoda_of_fogong_temple_01_desc: "เจดีย์วัดโฝกงเป็นเจดีย์ไม้สูงที่สร้างขึ้นโดยไม่ใช้ตะปู สูงเก้าชั้น เป็นที่ประดิษฐานพระธาตุและรูปปั้นอันศักดิ์สิทธิ์ และการออกแบบอันชาญฉลาดของมันยังคงเป็นสิ่งมหัศจรรย์ทางวิศวกรรมและสัญลักษณ์แห่งศรัทธา"

 building_type_plain_of_jars_01: "$building_plain_of_jars_01$"
 building_type_plain_of_jars_01_desc: "$building_plain_of_jars_01_desc$"
 building_plain_of_jars_01: "ทุ่งไหหิน"
 building_plain_of_jars_01_desc: "ทุ่งไหหินเป็นที่ราบสูงกว้างใหญ่ที่เกลื่อนไปด้วยภาชนะหินขนาดยักษ์ จุดประสงค์ของมันยังคงเป็นปริศนา เคยใช้ในพิธีกรรมโบราณ พวกมันคงอยู่เป็นมรดกของกลุ่มคนที่ถูกลืม สร้างแรงบันดาลใจให้เกิดความยำเกรงและความเคารพในท้องถิ่น"

 building_type_dieng_plateau_01: "$building_dieng_plateau_01$"
 building_type_dieng_plateau_01_desc: "$building_dieng_plateau_01_desc$"
 building_dieng_plateau_01: "ที่ราบสูงเดียง"
 building_dieng_plateau_01_desc: "ที่ราบสูงเดียงเป็นแอ่งภูเขาไฟที่ปกคลุมด้วยหมอก ซึ่งมีสระกำมะถันและช่องระบายก๊าซกระจายอยู่ทั่วภูมิทัศน์ วิหารโบราณที่กระจัดกระจายและตำนานพิธีกรรม ทำให้ที่นี่เป็นที่น่าเกรงขามและเคารพยำเกรง เป็นที่ราบสูงศักดิ์สิทธิ์ที่เทพเจ้าฝ่ายดีและฝ่ายชั่วในสมัยโบราณเคยท่องไป"

 building_type_mount_apo_01: "$building_mount_apo_01$"
 building_type_mount_apo_01_desc: "$building_mount_apo_01_desc$"
 building_mount_apo_01: "ภูเขาอาโป"
 building_mount_apo_01_desc: "ภูเขาอาโปสูงตระหง่านเหนือทะเลสาบเวนาโด ชื่อของมันหมายถึง "ผู้อาวุโสที่เคารพนับถือ" ในภาษาลูมัด เป็นรูปแบบย่อของ อาโปซันดาวา วิญญาณแห่งภูเขาศักดิ์สิทธิ์ หรือที่เรียกว่า "ผู้อาวุโสซันดาวา" หรือ "ปู่ซันดาวา" พิธีกรรมสำหรับ อาโปซันดาวา ดำเนินการโดยหมอผีของชนเผ่า ซึ่งถูกมองว่าเป็นสื่อกลางสำหรับวิญญาณบรรพบุรุษ"

 building_type_besakih_temple_01: "$building_besakih_temple_01$"
 building_type_besakih_temple_01_desc: "$building_besakih_temple_01_desc$"
 building_besakih_temple_01: "วัดเบอซากิห์"
 building_besakih_temple_01_desc: "รู้จักกันในนาม "วัดแม่แห่งบาหลี" เบอซากิห์เป็นกลุ่มวิหารฮินดูที่สำคัญและศักดิ์สิทธิ์ที่สุดของเกาะ ตั้งอยู่บนเนินเขาอากุง ภูเขาไฟที่สูงที่สุดและภูเขาศักดิ์สิทธิ์ของบาหลี ที่นี่คือหัวใจทางศาสนาและวัฒนธรรมของเกาะ เป็นเจ้าภาพจัดพิธีอันยิ่งใหญ่สำหรับทุกคน"

 building_type_gongsanseong_fortress_01: "$building_gongsanseong_fortress_01$"
 building_type_gongsanseong_fortress_01_desc: "$building_gongsanseong_fortress_01_desc$"
 building_gongsanseong_fortress_01: "ป้อมคงซานซอง"
 building_gongsanseong_fortress_01_desc: "ป้อมคงซานซองตั้งตระหง่านอยู่บนเนินเขาเหนือแม่น้ำกึม สร้างขึ้นเพื่อเป็นป้อมปราการของราชวงศ์แพ็กเจ กำแพงยาวและประตูหินช่วยปกป้องกษัตริย์และไพร่ฟ้าเหมือนกัน เป็นที่มั่นบนภูเขาแห่งอำนาจและการป้องกันราชวงศ์"

 building_type_krakatoa_01: "$building_krakatoa_01$"
 building_type_krakatoa_01_desc: "$building_krakatoa_01_desc$"
 building_krakatoa_01: "กรากะตัว"
 building_krakatoa_01_desc: "กรากะตัวเป็นภูเขาไฟตระหง่านที่ตั้งอยู่บนหมู่เกาะเล็ก ๆ นอกชายฝั่ง"

 building_type_borobudur_01: "$building_borobudur_01$"
 building_type_borobudur_01_desc: "$building_borobudur_01_desc$"
 building_borobudur_01: "บุโรพุทโธ"
 building_borobudur_01_desc: "บุโรพุทโธเป็นวัดพุทธขนาดใหญ่ประกอบด้วยฐานหินเก้าชั้นซ้อนกัน มียอดโดมกลาง วัดประดับด้วยภาพนูนต่ำนับพันและพระพุทธรูปหลายร้อยองค์"

 building_type_hoshi_ryokan_01: "$building_hoshi_ryokan_01$"
 building_type_hoshi_ryokan_01_desc: "$building_hoshi_ryokan_01_desc$"
 building_hoshi_ryokan_01: "โฮชิเรียวกัง"
 building_hoshi_ryokan_01_desc: "โฮชิเรียวกังเป็นโรงเตี๊ยมแบบดั้งเดิมเก่าแก่และเป็นธุรกิจครอบครัว ให้บริการนักเดินทางได้พักผ่อนระหว่างการเดินทางด้วยที่พัก อาหาร และการเข้าถึงบ่อน้ำพุร้อน"
 
 building_type_celestial_great_barracks_01: "$building_celestial_great_barracks_01$"
 building_type_celestial_great_barracks_01_desc: "$building_celestial_great_barracks_01_desc$"
 building_celestial_great_barracks_01: "กรมทหารขนาดใหญ่"
 building_celestial_great_barracks_01_desc: "กรมทหารและป้อมปราการขนาดใหญ่นี้จัดหาทหารให้ผู้ว่าการท้องถิ่นเพื่อเสริมกำลังกองทัพ และปรับปรุงการป้องกันพื้นที่ท้องถิ่นอย่างมาก"
 celestial_great_barracks_enabled_desc: "[holder.GetShortUIName|U] [holder.LocalPlayerString( 'are', 'is' )] ไม่ใช่ [governor|E] ฝ่ายทหาร"
 celestial_great_barracks_effect_desc: "[governor_efficiency|E]: @governor_efficiency!#P +[EmptyScope.ScriptValue('great_barracks_bonus_value')]%#!"
 
 building_type_the_great_wall_01: "$building_the_great_wall_01$"
 building_type_the_great_wall_01_desc: "$building_the_great_wall_01_desc$"
 building_the_great_wall_01: "กำแพงเมืองจีน"
 building_the_great_wall_01_desc: "นี่คือส่วนที่เก่าแก่ที่สุดของกำแพงเมืองจีน ส่วนใหญ่สร้างโดยราชวงศ์ฉิน ทรายแห่งกาลเวลาอาจกัดกร่อนหิน อิฐ และปูน แต่ก็ยังคงเป็นป้อมปราการที่น่าเกรงขาม"
 building_type_the_great_wall_02: "$building_the_great_wall_01$"
 building_type_the_great_wall_02_desc: "$building_the_great_wall_02_desc$"
 building_the_great_wall_02: "กำแพงเมืองจีน"
 building_the_great_wall_02_desc: "ราชวงศ์ฮั่นขยายกำแพงที่มีอยู่ ซึ่งสร้างโดยบรรพบุรุษของพวกเขาอย่างมาก พวกเขาสร้างส่วนที่กว้างขวางที่สุดบางส่วน ทอดยาวข้ามทะเลทรายและภูเขาเป็นระยะทางหลายร้อยไมล์"
 building_type_the_great_wall_03: "$building_the_great_wall_01$"
 building_type_the_great_wall_03_desc: "$building_the_great_wall_03_desc$"
 building_the_great_wall_03: "กำแพงเมืองจีน"
 building_the_great_wall_03_desc: "ราชวงศ์เว่ย ฉี และสุย ล้วนต่อเติมกำแพงในช่วงศตวรรษที่ 5 และ 6 ปรับปรุงหลายส่วนด้วยป้อมปราการที่ดีขึ้น"
 building_type_the_great_wall_04: "$building_the_great_wall_01$"
 building_type_the_great_wall_04_desc: "$building_the_great_wall_04_desc$"
 building_the_great_wall_04: "กำแพงเมืองจีน"
 building_the_great_wall_04_desc: "ความสำเร็จทางวิศวกรรมที่น่าประทับใจที่สุด กำแพงขนาดมหึมานี้ถูกขยายหลายครั้งนับตั้งแต่การก่อสร้างครั้งแรกในศตวรรษที่ 7 ก่อนคริสตกาล บัดนี้ทอดยาวหลายพันไมล์และครอบคลุมหอสังเกตการณ์ กรมทหาร และสถานีทหารรักษาการณ์จำนวนมาก แน่นอนว่า คงไม่มีผู้บุกรุกอนารยชนคนใดสามารถเอาชนะอุปสรรคอันยิ่งใหญ่นี้ได้?"
 building_type_the_great_wall_shanhai_pass: "$building_the_great_wall_01$"
 building_type_the_great_wall_shanhai_pass_desc: "$building_the_great_wall_04_desc$"
 building_the_great_wall_shanhai_pass: "$building_the_great_wall_04$"
 building_the_great_wall_shanhai_pass_desc: "$building_the_great_wall_04_desc$"
 building_type_the_great_wall_liaodong: "$building_the_great_wall_01$"
 building_type_the_great_wall_liaodong_desc: "$building_the_great_wall_04_desc$"
 building_the_great_wall_liaodong: "$building_the_great_wall_04$"
 building_the_great_wall_liaodong_desc: "$building_the_great_wall_04_desc$"

 special_building_improve_silk_road: "เมื่อ [special_building|E] นี้เสร็จสมบูรณ์ จะ ทำให้ [situation_sub_region|E] [sub_region_temp.GetName] ใกล้เคียงกับ [situation_phase|E] [silk_road|E] [situation_silk_road_phase_exceptional_bounty|E] มากขึ้น #weak (หากยังไม่ได้อยู่ในสถานะนั้น)#!"

 building_type_herat_bazaar_01: "$building_herat_bazaar_01$"
 building_type_herat_bazaar_01_desc: "$building_herat_bazaar_01_desc$"
 building_herat_bazaar_01: "ตลาดบาซาร์แห่งเฮราต"
 building_herat_bazaar_01_desc: "ตลาดที่คึกคักของเฮราตมีชื่อเสียงมาตั้งแต่สมัยอะคีเมนิดโบราณ #italic ฮาไรวา#! กองคาราวานที่เข้าและออกจากเมืองทุกวันเป็นเครื่องหมายว่าตลาดบาซาร์แห่งเฮราตคือไข่มุกแห่งโฆราซาน"
 building_herat_bazaar_02: "ตลาดบาซาร์แห่งเฮราตอันกว้างใหญ่"
 building_herat_bazaar_02_desc: "ตลาดบาซาร์ของเฮราตล้นหลามไปด้วยการพาณิชย์และการค้า ไข่มุกแห่งโฆราซานส่องประกายงดงามยิ่งกว่าอัญมณีที่ขัดมันที่สุดบนมงกุฎใด ๆ"

 building_type_dvin_shuka_01: "$building_dvin_shuka_01$"
 building_type_dvin_shuka_01_desc: "$building_dvin_shuka_01_desc$"
 building_dvin_shuka_01: "ตลาดชูกาแห่งดวิน"
 building_dvin_shuka_01_desc: "ตลาดอันเก่าแก่ของดวินทำหน้าที่เป็นศูนย์กลางการค้าที่ยิ่งใหญ่ของอาร์เมเนียมาตั้งแต่โบราณกาล กำแพงประดับด้วยกระเบื้องสีสันสดใสและปูนปลาสเตอร์ย้อมสี สะท้อนถึงความมั่งคั่งและเกียรติภูมิของตลาดโบราณแห่งนี้"
 building_dvin_shuka_02: "ตลาดชูกาแห่งดวินอันกว้างใหญ่"
 building_dvin_shuka_02_desc: "วัยไม่ได้พรากความมีชีวิตชีวาไปจากตลาดที่สง่างามและเก่าแก่ของดวินเลย — หากมีสิ่งใด ตลาดชูกาอันเก่าแก่ดูเหมือนจะมีชีวิตชีวามากกว่าที่เคยเป็นมา"

 building_type_khiva_bazaar_01: "$building_khiva_bazaar_01$"
 building_type_khiva_bazaar_01_desc: "$building_khiva_bazaar_01_desc$"
 building_khiva_bazaar_01: "ตลาดบาซาร์แห่งฆีวา"
 building_khiva_bazaar_01_desc: "ประตูสู่ทุ่งหญ้าสเตปป์ เมืองฆีวาอันถ่อมตนมีชื่อเสียงในด้านพ่อค้าและนักเดินทางมากมายที่แสวงหาผลกำไรหรือโชคลาภบนชายแดน"
 building_khiva_bazaar_02: "ตลาดบาซาร์แห่งฆีวาอันกว้างใหญ่"
 building_khiva_bazaar_02_desc: "ภายใต้แสงแดดที่แผดเผา ชนร่อนเร่ พ่อค้า และนักผจญภัยต่างไขว่คว้าหาโชคลาภและกระซิบกระซาบถึงความมั่งคั่งของจีนอันไกลโพ้นผ่านเหรียญตราแปลกตาของฮ่องเต้"

 building_type_lhasa_market_01: "$building_lhasa_market_01$"
 building_type_lhasa_market_01_desc: "$building_lhasa_market_01_desc$"
 building_lhasa_market_01: "ตลาดโครมแห่งลาซา"
 building_lhasa_market_01_desc: "ณ สี่แยกสำคัญระหว่างอินเดียและจีน พ่อค้าแห่งลาซาเบียดเสียดกันเพื่อเรียกร้องความสนใจจากนักเดินทางในเงาของพระราชวังโปตาลาอันสูงส่ง"
 building_lhasa_market_02: "ตลาดโครมแห่งลาซาอันกว้างใหญ่"
 building_lhasa_market_02_desc: "ไม่มีสิ่งใดใหม่ภายใต้ดวงอาทิตย์ พ่อค้าแห่งลาซาอยากให้ท่านเชื่อ เช่นนั้น เพราะไม่มีเครื่องประดับหรืออัญมณีใดที่พวกเขาไม่เคยพบเห็น ซึ่งเดินทางมาตามเส้นทางสายไหม"

 building_type_changan_market_01: "$building_changan_market_01$"
 building_type_changan_market_01_desc: "$building_changan_market_01_desc$"
 building_changan_market_01: "ตลาดแห่งฉางอาน"
 building_changan_market_01_desc: "ตลาดของนครหลวงฉางอาน #EMP สันติภาพชั่วนิรันดร์#! คึกคักไปด้วยการค้าทุกรูปแบบ และเป็นจุดแวะพักที่สำคัญสำหรับการค้าเกือบทั้งหมดที่มุ่งหน้าเข้าและออกจากจีน"
 building_changan_market_02: "ตลาดแห่งฉางอานอันกว้างใหญ่"
 building_changan_market_02_desc: "พ่อค้าผู้มั่งคั่งของฉางอานไม่กระพริบตาอีกต่อไปเมื่อเห็นสมบัติที่ยิ่งใหญ่ที่สุดที่มนุษย์รู้จัก — เพราะพวกเขาเคยเห็นมาหมดแล้ว และอาจเป็นเจ้าของบางส่วน"

 building_type_dunhuang_market_01: "$building_dunhuang_market_01$"
 building_type_dunhuang_market_01_desc: "$building_dunhuang_market_01_desc$"
 building_dunhuang_market_01: "ตลาดแห่งตุนหวง"
 building_dunhuang_market_01_desc: "เมืองตุนหวงตั้งอยู่บนริมฝั่งแม่น้ำซูเล่อที่ส่องประกาย เป็นประตูระหว่างระเบียงเหอซีและแอ่งทาริม และเป็นจุดแวะพักสำคัญสำหรับนักเดินทางทุกคนระหว่างสองแห่งนี้"
 building_dunhuang_market_02: "ตลาดแห่งตุนหวงอันกว้างใหญ่"
 building_dunhuang_market_02_desc: "ถนนที่อาบแดดของตุนหวงรู้จักเพียงการเดินทัพที่มั่นคงและเชื่องช้าของอูฐ ล่อ และผู้คนที่บรรทุกสัมภาระนับไม่ถ้วน และเส้นทางที่ข้ามไปมาทางตะวันออกและตะวันตกตลอดเวลา"

 building_type_lahur_bazaar_01: "$building_lahur_bazaar_01$"
 building_type_lahur_bazaar_01_desc: "$building_lahur_bazaar_01_desc$"
 building_lahur_bazaar_01: "ตลาดบาซาร์แห่งลาฮอร์"
 building_lahur_bazaar_01_desc: "เมืองเก่าของลาฮอร์สร้างขึ้นรอบตลาดหลักสองแห่ง ล้อมรอบด้วยบ้านเรือน ทั้งหมดล้อมรอบด้วยกำแพงดินยาว กลุ่มตลาดที่คึกคักนี้เต็มไปด้วยกิจกรรมตราบเท่าที่ทุกคนจำได้ และน่าจะเต็มไปด้วยกิจกรรมต่อไปอีกหลายชั่วอายุคน"
 building_lahur_bazaar_02: "ตลาดบาซาร์แห่งลาฮอร์อันกว้างใหญ่"
 building_lahur_bazaar_02_desc: "การค้าไหลผ่านลาฮอร์อย่างเป็นธรรมชาติเหมือนน้ำไหลผ่านก้นแม่น้ำ ตลาดที่รวมกลุ่มกันล้นหลามไปด้วยสินค้า และพ่อค้าดูเหมือนจะมีภูมิปัญญาทั้งหมดของประวัติศาสตร์อันยาวนานของเมืองซ่อนอยู่หลังดวงตาที่เฉียบแหลม"

 building_type_hamadan_bazaar_01: "ตลาดบาซาร์ฮามาดาน"
 building_type_hamadan_bazaar_01_desc: "$building_hamadan_bazaar_01_desc$"
 building_hamadan_bazaar_01: "ตลาดบาซาร์ฮามาดาน"
 building_hamadan_bazaar_01_desc: "ดินแดนหัวใจของชาวมีเดียนโบราณ ฮามาดานเป็นศูนย์กลางการค้ามาตั้งแต่สมัยแผ่นดินเหนียวและจารึกคูนิฟอร์ม พ่อค้าหลายร้อยชั่วอายุคนเร่ขายสินค้าและทำงานฝีมือท่ามกลางแผงลอยในตลาดบาซาร์หลักของฮามาดาน"
 building_hamadan_bazaar_02: "ตลาดบาซาร์ฮามาดานอันกว้างใหญ่"
 building_hamadan_bazaar_02_desc: "ตลาดบาซาร์ที่ยิ่งใหญ่ของฮามาดานเจริญรุ่งเรืองอย่างที่ไม่เคยเป็นมาก่อน บรรลุถึงจุดสูงสุดใหม่ของความมั่งคั่งและกิจกรรมที่ไม่มีใครเทียบได้ในประวัติศาสตร์อันยาวนานและสง่างาม"

 building_type_sunday_bazaar_01: "ตลาดนัดวันอาทิตย์"
 building_type_sunday_bazaar_01_desc: "$building_sunday_bazaar_01_desc$"
 building_sunday_bazaar_01: "ตลาดนัดวันอาทิตย์"
 building_sunday_bazaar_01_desc: "คนในท้องถิ่นบางคนจะบอกท่านว่าก่อนที่จะมีเงิน คัชการ์ก็มีตลาดนัดวันอาทิตย์แล้ว เมื่อเดินระหว่างแผงลอยในตลาด ก็รู้สึก เช่นนั้นจริง ๆ — เป็นไปไม่ได้ที่จะจินตนาการถึงช่วงเวลาที่ไม่มีสถานที่แห่งนี้"
 building_sunday_bazaar_02: "ตลาดนัดวันอาทิตย์อันกว้างใหญ่"
 building_sunday_bazaar_02_desc: "แม้ว่าตลาดนัดวันอาทิตย์ที่ยิ่งใหญ่ของคัชการ์อาจคงอยู่มาตั้งแต่โบราณกาล แต่ความเจริญรุ่งเรืองที่รู้สึกได้ในตอนนี้จะถูกจดจำไปอีกนานเท่านาน"
 
 building_type_mount_fuji_01: "ภูเขาไฟฟูจิ"
 building_type_mount_fuji_01_desc: "ยอดเขาฟูจิซังที่โดดเดี่ยว สูงตระหง่าน ปกคลุมด้วยหิมะ เป็นเครื่องหมายทางผ่านสู่ญี่ปุ่นตะวันออกและเป็นทิวทัศน์ที่มีชื่อเสียงไปทั่วเกาะ ดึงดูดนักเดินทางและผู้แสวงบุญ และมอบความสงบแก่ทุกคนที่จ้องมอง ในบรรดาภูเขาชินโตที่ศักดิ์สิทธิ์ที่สุด ฟูจิเป็นที่ประทับของ #EMP โคโนฮานะซากุยะ-ฮิเมะ#! เทพีแห่งภูเขาไฟ ดอกซากุระ และความเปราะบางชั่วขณะของชีวิต"
 building_mount_fuji_01: "$building_type_mount_fuji_01$"
 building_mount_fuji_01_desc: "$building_type_mount_fuji_01_desc$"

 building_type_waterworks_01: "การจัดการน้ำ"
 building_type_waterworks_01_desc: "น้ำคือรากฐานที่ทุกชีวิตต้องพึ่งพา การรักษาระดับน้ำให้คงที่ และการใช้น้ำอย่างมีประสิทธิภาพ เป็นสิ่งจำเป็นสำหรับการรักษาอาณาจักรที่เข้มแข็งและการปกครองที่มั่นคง"
 building_waterworks_01: "สระน้ำที่มนุษย์สร้างขึ้น"
 building_waterworks_01_desc: "ขั้นตอนแรกในการจัดการน้ำคือการมีน้ำให้จัดการ แอ่งดินธรรมดา ปูด้วยดินเหนียวเพื่อกักเก็บ สร้างจุดธรรมชาติให้น้ำสะสมเพื่อใช้ในภายหลัง"
 building_waterworks_02: "ถังเก็บน้ำใต้ดิน"
 building_waterworks_02_desc: "หลุมที่ลึกขึ้น การบุรองที่ซึมผ่านได้น้อยลง และหลังคาเรียบง่ายช่วยสร้างสถานที่ที่สามารถเก็บน้ำได้มากขึ้นและนานขึ้น โดยสูญเสียจากมลพิษหรือการระเหยน้อยลง"
 building_waterworks_03: "คลองระดับ"
 building_waterworks_03_desc: "การขุดคูระหว่างสถานที่จัดเก็บ ทำให้น้ำที่จัดการแล้วเข้าถึงได้ง่ายขึ้นสำหรับผู้คนจำนวนมาก กระบวนการนี้ช่วยลดแรงกดดันจากน้ำท่วมเมื่อมีน้ำมากเกินไป ในขณะที่ยังคงจัดหาน้ำให้กับผู้คน ปศุสัตว์ และพืชผลในยามแล้ง หากวางแผนอย่างถูกวิธี สิ่งเหล่านี้ยังสามารถใช้สำหรับการสัญจรทางเรือเบาได้"
 building_waterworks_04: "อ่างเก็บน้ำชลประทาน"
 building_waterworks_04_desc: "เนินเขา สันเขา หรือการเปลี่ยนแปลงระดับความสูงใด ๆ สามารถเปลี่ยนเป็นสถานที่เก็บน้ำได้ หากมีการขุดคันดินที่เหมาะสม อ่างเก็บน้ำเปิดเหล่านี้เชื่อมต่อกันด้วยคลอง สามารถป้อนน้ำเข้าหากัน ทำให้ควบคุมปริมาณน้ำที่เก็บไว้และปริมาณน้ำที่ใช้ได้มากขึ้นในเวลาใดก็ตาม"
 building_waterworks_05: "บ่อน้ำขั้นบันได"
 building_waterworks_05_desc: "การควบคุมน้ำสามารถรวมกับการขุดบ่อพื้นฐานเพื่อสร้างโครงสร้างขนาดใหญ่ที่ขุดลงไปในดิน ซึ่งจะมีน้ำบางส่วนจากใต้ดินตลอดเวลา อาคารใต้ดินเหล่านี้ยังสามารถเชื่อมต่อกับประตูน้ำและคลองระดับพื้นดิน ซึ่งป้อนน้ำเข้าหรือสูบน้ำออกไปยังพื้นที่อื่นตามต้องการ"
 building_waterworks_06: "ประตูน้ำคลอง"
 building_waterworks_06_desc: "ความลึกของทางน้ำสามารถควบคุมได้ด้วยประตูและท่อระบายน้ำ น้ำที่เก็บไว้หลังประตูน้ำเหล่านี้สามารถใช้เพื่อ ทำให้คลองเป็นทางน้ำที่ใช้การได้สำหรับเรือบรรทุกและเรือขนาดเล็ก ทำให้คลองเหมาะสำหรับการขนส่ง"
 building_waterworks_07: "ทะเลสาบเทียม"
 building_waterworks_07_desc: "อ่างเก็บน้ำขนาดมหึมาสามารถจุน้ำได้มหาศาล ทะเลสาบเทียมที่ได้รับน้ำจากแม่น้ำและคลอง สามารถจัดหาน้ำสำหรับพื้นที่เกษตรกรรมกว้างใหญ่และหมู่บ้านมากมาย ความยิ่งใหญ่ของมันหมายความว่าพวกมันยังสามารถทำหน้าที่เป็นสถานที่อันทรงเกียรติในตัวเอง ทำให้เป็นสถานที่ที่มีประสิทธิภาพสำหรับการสักการะและการปกครอง"
 building_waterworks_08: "ระบบประปาและท่อระบายน้ำ"
 building_waterworks_08_desc: "ด้วยท่อและเครื่องสูบน้ำ น้ำสามารถไหลขึ้นลงได้ ส่งน้ำไปยังหอคอยที่สูงที่สุดและชำระล้างของเสียไปยังบ่อส้วมที่ไกลที่สุด ไม่มีที่ใดขาดแคลนน้ำ และส่วนเกินใด ๆ สามารถระบายออกไปได้ก่อนที่จะกลายเป็นน้ำท่วมที่เป็นอันตราย"

 building_type_spice_plantation_01: "สวนเครื่องเทศ"
 building_type_spice_plantation_01_desc: "กลิ่นหอมที่ดีที่สุดและรสชาติที่ละเอียดอ่อนที่สุดสามารถสกัดได้จากพืชที่เติบโตในภูมิภาคที่เฉพาะเจาะจงมากของโลกเท่านั้น ความหายากและคุณภาพของมัน ทำให้พวกมันมีกำไรงามเป็นพิเศษในการผลิต หากผืนดินสามารถหล่อเลี้ยงพวกมันได้"
 building_spice_plantation_01: "การเสาะหาเครื่องเทศ"
 building_spice_plantation_01_desc: "เครื่องเทศถูกผลิตขึ้นตามธรรมชาติจากต้นไม้ พุ่มไม้ และดอกไม้นานาชนิด เคล็ดลับคือการ #italic ค้นหา#! พืชเหล่านั้นให้พบตั้งแต่แรก"
 building_spice_plantation_02: "สวนเครื่องเทศเพาะปลูก"
 building_spice_plantation_02_desc: "เครื่องเทศที่เป็นที่ต้องการมากที่สุดสามารถเพาะปลูกได้ภายใต้เงื่อนไขที่เหมาะสม ด้วยแรงงานที่เหมาะสม และการกำกับดูแลที่เหมาะสมจากผู้ดูแลที่เหมาะสม"
 building_spice_plantation_03: "สวนเครื่องเทศ"
 building_spice_plantation_03_desc: "การปลูกพืชผลด้วยวิธีเรขาคณิตในพื้นที่ขนาดใหญ่สามารถผลิตเครื่องเทศในปริมาณที่คาดการณ์ได้มากขึ้น ปีแล้วปีเล่า"
 building_spice_plantation_04: "การตากเครื่องเทศ"
 building_spice_plantation_04_desc: "การจัดสรรพื้นที่ใกล้กับพืชผลเพื่อตากเครื่องเทศก่อนจัดส่งหมายความว่าผลผลิตส่วนใหญ่จะถูกแปรรูปก่อนที่จะเน่าเสีย ประหยัดเงินในการผลิตเครื่องเทศโดยรวม"
 building_spice_plantation_05: "โรงบดเครื่องเทศ"
 building_spice_plantation_05_desc: "การบดอาจ ทำให้เครื่องเทศเน่าเสียได้ง่ายขึ้น แต่ก็สามารถ ทำให้การจัดเก็บมีประสิทธิภาพมากขึ้น โรงบดยังสามารถช่วยในการฝัดได้อีกด้วย ทำให้ได้พืชผลที่บริสุทธิ์ยิ่งขึ้น"
 building_spice_plantation_06: "นิคมเครื่องเทศ"
 building_spice_plantation_06_desc: "การรวมที่พักคนงาน การแปรรูปพืชผล และการจัดเก็บผลิตภัณฑ์ไว้ในสถานที่ใกล้กับแหล่งปลูกเครื่องเทศจริง ๆ ช่วยให้ผลิตและขายเครื่องเทศได้มากขึ้นโดยมีค่าใช้จ่ายโดยรวมน้อยลงอย่างมาก"
 building_spice_plantation_07: "การจัดการที่ดินสวน"
 building_spice_plantation_07_desc: "ผืนดินสามารถถูกปรับเปลี่ยนเพื่อเปิดพื้นที่สำหรับปลูกพืชผลได้มากขึ้น นาขั้นบันไดและคลองส่งน้ำสร้างโอกาสใหม่ ๆ สำหรับพืชผลที่มากขึ้น"
 building_spice_plantation_08: "การผลิตเครื่องเทศระดับอุตสาหกรรม"
 building_spice_plantation_08_desc: "ด้วยทิศทางที่ถูกต้อง แผ่นดินทั้งผืนสามารถอุทิศให้กับการผลิตเครื่องเทศที่ทำกำไรงามที่สุด ทุกต้นไม้ที่ปลูก ทุกพุ่มไม้ที่เพาะปลูก ทุกใบที่เก็บ และทุกเมล็ดที่ตากแห้งคือเหรียญอีกเหรียญในคลัง"

 building_type_examination_hall_01: "หอสอบ"
 building_type_examination_hall_01_desc: "การสอบของจักรวรรดิไม่สามารถดำเนินการได้หากไม่มีสถานที่สำหรับดำเนินการสอบ เป็นความรับผิดชอบของผู้ว่าการท้องถิ่นที่จะต้องแน่ใจว่าเจ้าหน้าที่มีทรัพยากรทั้งหมดที่จำเป็นในการดำเนินการสอบอย่างถูกต้อง และผู้เข้าสอบได้รับการสนับสนุนที่จำเป็น ในขณะที่ลดโอกาสในการโกงให้เหลือน้อยที่สุด"
 building_examination_hall_01: "ห้องสอบ"
 building_examination_hall_01_desc: "ในการทดสอบผู้สมัครเข้ารับตำแหน่งราชการ จำเป็นต้องมีสถานที่สำหรับทำการทดสอบ ห้องที่จัดไว้สำหรับการสอบเป็นสิ่งจำเป็นขั้นต่ำ แต่ก็ถือเป็นจุดเริ่มต้น"
 building_examination_hall_02: "วัดเหวินอู่ (วัดบุ๋นบู้)"
 building_examination_hall_02_desc: "การสวดภาวนาเล็กน้อยสามารถให้ความมั่นใจแก่ผู้เข้าสอบบางคนได้มากกว่าการศึกษาและการเตรียมตัวทั้งหมดในโลก"
 building_examination_hall_03: "สถาบันหลวง"
 building_examination_hall_03_desc: "กลุ่มอาคารบรรยาย สถานที่สอบ สำนักงานคณาจารย์ และห้องเก็บของ ให้การสนับสนุนอย่างครอบคลุมที่จำเป็นในการดำเนินการสอบของจักรวรรดิในทุก ๆ ส่วนด้วยประสิทธิภาพและคุณภาพสูงสุด"
 examination_hall_effects_desc: "[SelectLocalization( HasDlcFeature( 'all_under_heaven' ), 'examination_hall_effect_desc', 'examination_hall_cost_discount_max_desc' )]"
 examination_hall_effect_desc: "ลดค่าใช้จ่ายสำหรับ [activities|E] [GetActivityType('activity_imperial_examination').GetTextIcon][GetActivityType('activity_imperial_examination').GetName] และ [GetActivityType('activity_local_examination').GetTextIcon][GetActivityType('activity_local_examination').GetName] ที่จัดใน [holding|E] นี้: [EmptyScope.ScriptValue('imperial_examination_cost_discount_max_value')|P0%]"
 examination_hall_cost_discount_max_desc: "$examination_hall_effect_desc$[EmptyScope.ScriptValue('imperial_examination_cost_discount_max_value')|P0%]"
 imperial_examination_cost_discount_examination_hall: "สถานที่ตั้งมี $building_type_examination_hall_01$"

 building_can_benefit_requirements: "#S หากท่านมีคุณสมบัติตรงตามข้อกำหนด:#!\n"
 rebuilding_grants_full_benefits: "#S หลังจาก [rebuilding|El]:#!\n"
