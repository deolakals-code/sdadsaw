 building_type_doges_palace_01:0 "วังโดเจ"
 building_type_doges_palace_01_desc:0 "วังโดเจทำหน้าที่เป็นที่พำนักของรัฐบาลแห่งสาธารณรัฐเวนิส เป็นโครงสร้างที่น่าประทับใจ มีห้องหลายห้องที่อุทิศให้กับสิ่งต่าง ๆ เช่น สภา วุฒิสภา การบริหาร และความยุติธรรม"
 building_doges_palace_01:0 "$building_type_doges_palace_01$"
