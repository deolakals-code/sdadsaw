 building_type_holy_site_canterbury_cathedral_02:0 "$building_type_holy_site_canterbury_cathedral_03$"
 building_type_holy_site_canterbury_cathedral_02_desc:0 "อาสนวิหารไม่รอดพ้นจากกาลเวลาและสถานการณ์ที่ไม่เอื้ออำนวย สไตล์นอร์มันถูกเลือกเพื่อซ่อมแซมความเสียหายที่เกิดจากไฟไหม้ โถงกลางโบสถ์รูปกางเขนใหม่เข้ามาแทนที่มหาวิหารเดิม และหอระฆังเดี่ยวถูกเพิ่มเข้ามาในภายหลัง"
 building_holy_site_canterbury_cathedral_02:0 "วิหารแห่งแคนเทอร์เบอรี"
 building_holy_site_canterbury_cathedral_02_desc:0 "$building_type_holy_site_canterbury_cathedral_02_desc$"
 
 building_type_holy_site_canterbury_cathedral_03:0 "อาสนวิหารแคนเทอร์เบอรี"
 building_type_holy_site_canterbury_cathedral_03_desc:0 "ความเสียหายร้ายแรงที่เกิดขึ้นกับอาสนวิหารเรียกร้องให้มีโครงการสร้างขึ้นใหม่ แม้ว่าโครงสร้างแบบนอร์มันจะยังคงรักษาไว้ในบางส่วน แต่สไตล์กอทิกที่เฟื่องฟูก็ถูกเลือกเพื่อยกระดับโครงสร้าง"
