 building_type_khajuraho_01:0 "นครวัด"
 building_type_khajuraho_01_desc:0 "หมู่ปราสาทขชุราโหอุทิศให้กับการอยู่ร่วมกันระหว่างชาวฮินดูและชาวเชน ที่ ซึ่งมุมมองทางศาสนาที่หลากหลายของพวกเขาได้รับการเฉลิมฉลอง ผนังวัดปกคลุมไปด้วยศิลปะและประติมากรรมอันวิจิตร ทำให้สถานที่แห่งนี้งดงามอย่างแท้จริงและน่าดึงดูดใจสำหรับผู้แสวงบุญและนักวิชาการ"
