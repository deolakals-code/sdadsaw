 building_type_capital_bureau_01: "ศาลาว่าการนครหลวง"
 building_type_capital_bureau_01_desc: "สาขาเฉพาะของรัฐบาล ซึ่งอุทิศทรัพยากรทั้งหมดเพื่อจัดการนครหลวง กลุ่มเสมียนและข้าราชการจำนวนมากพำนักอยู่ภายในกำแพงเหล่านี้ พร้อมรับใช้ตามคำสั่งของเอพาร์ค"
 building_capital_bureau_01: "ศาล"
 building_capital_bureau_01_desc: "กฎหมายคือสิ่งที่ ทำให้เมืองเจริญรุ่งเรือง และกฎหมายสามารถบังคับใช้ได้ในศาลเท่านั้น"
 building_capital_bureau_02: "สำนักงานความมั่นคง"
 building_capital_bureau_02_desc: "สำนักงานนี้จ้างกองกำลังตำรวจขนาดใหญ่ ซึ่งรักษาความปลอดภัยของเมืองจากอาชญากรและจับกุมผู้กระทำผิดกฎหมาย"
 building_capital_bureau_03: "กองบัญชาการดับเพลิง"
 building_capital_bureau_03_desc: "ไฟไหม้เป็นภัยคุกคามอย่างต่อเนื่องที่คุกคามพื้นที่ที่มีประชากรหนาแน่น ทีมดับเพลิงที่ได้รับการฝึกฝนมาอย่างดีจะดับไฟก่อนที่จะลุกลาม"
 building_capital_bureau_04: "การบริหารสมาคมช่างฝีมือ"
 building_capital_bureau_04_desc: "การ แต่งตั้งเจ้าหน้าที่เป็นผู้ดูแลสมาคมช่างฝีมือจำนวนมากภายในเมืองจะ ทำให้มั่นใจได้ว่า แต่ละสมาคมมีประสิทธิภาพ รักษาคุณภาพ และปฏิบัติตามขั้นตอนที่จำเป็นทั้งหมด"
 building_capital_bureau_05: "กรมตุลาการ"
 building_capital_bureau_05_desc: "กรมที่ขยายเพื่อดูแลเรื่องตุลาการเป็นสิ่งจำเป็นในเมืองใหญ่ที่กำลังเติบโต กองทัพเจ้าหน้าที่ เสมียน และผู้พิพากษา ทำงานอย่างไม่รู้จักเหน็ดเหนื่อยเพื่อบังคับใช้กฎหมายและความสงบเรียบร้อย"
 building_capital_bureau_06: "เรือนจำเมือง"
 building_capital_bureau_06_desc: "แม้ว่าอาจจะมีเรือนจำเล็ก ๆ กระจายอยู่ทั่วเมือง แต่เรือนจำที่ใหญ่กว่าจะ ทำให้มั่นใจได้ว่าใครก็ตามที่ฝ่าฝืนกฎหมายจะมีห้องขังรออยู่"
 building_capital_bureau_07: "วิทยาลัยการค้า"
 building_capital_bureau_07_desc: "การค้าเป็นธุรกิจที่ทำกำไรได้มากเกินกว่าที่จะไม่ได้รับการควบคุมที่ดีขึ้นตามกฎหมาย ด้วยการดูแลค่าผ่านทางและสินค้าที่เข้ามาในเมือง เราสามารถจัดการเสบียงของนครหลวงได้อย่างมีประสิทธิภาพมากขึ้น และอาจจะได้รับทองคำเพิ่มเติมด้วย"
 building_capital_bureau_08: "วังในเมือง"
 building_capital_bureau_08_desc: "ที่พำนักขนาดใหญ่และสง่างาม งดงามพอที่จะ ทำให้พระราชวังส่วนใหญ่อับอาย ทำให้มั่นใจได้ว่าหัวหน้าผู้บริหารสามารถอยู่ใกล้และพร้อมให้บริการได้ตลอดเวลา เพราะ ในขณะที่เมืองไม่เคยหลับใหลอย่างแท้จริง ผู้บริหารของเมืองย่อมหลับใหลแน่นอน"
 capital_bureau_custom_effect_desc: "#low ปลดล็อก:#!\nเพิ่ม [aptitude|E] ของ [court_position|E] [GetCourtPositionType('eparch_court_position').GetName()]"

 building_type_breweries_01: "โรงเบียร์"
 building_type_breweries_01_desc: "อาคารนี้อุทิศให้กับการต้ม การหมัก และการเก็บรักษาเอล เบียร์ และเครื่องดื่มหมักประเภทต่าง ๆ มีบทบาทสำคัญในวัฒนธรรมและเศรษฐกิจท้องถิ่น"
 building_breweries_01: "โรงต้มเบียร์"
 building_breweries_01_desc: "หัวใจของโรงเบียร์ทุกแห่ง ที่ ซึ่งกระบวนการต้มเริ่มต้นขึ้น ที่นี่ ส่วนผสมจะถูกผสม ต้ม และเตรียมพร้อมสำหรับการหมัก"
 building_breweries_02: "ห้องเก็บของใต้ดิน"
 building_breweries_02_desc: "สถานที่เย็นและมืดที่เก็บเครื่องดื่มที่ต้มแล้วเพื่อบ่ม ทำให้มั่นใจได้ว่าพวกมันจะพัฒนารสชาติและคุณภาพที่ต้องการ"
 building_breweries_03: "ถังต้ม"
 building_breweries_03_desc: "ภาชนะขนาดใหญ่ที่ใช้ต้มเวิร์ตและเติมสมุนไพรหรือฮอปส์ ซึ่งเป็นขั้นตอนสำคัญในกระบวนการต้ม เพื่อให้ความขมและกลิ่นหอม"
 building_breweries_04: "โรงนาเก็บธัญพืช"
 building_breweries_04_desc: "โรงนาสำหรับเก็บธัญพืชปริมาณมากให้แห้งและปลอดภัยจากศัตรูพืช ทำให้มั่นใจได้ถึงการจัดหาส่วนผสมสำหรับการต้มอย่างสม่ำเสมอ"
 building_breweries_05: "โรงบ่อน้ำ"
 building_breweries_05_desc: "บ่อน้ำที่สร้างขึ้น เพื่อให้แน่ใจว่ามีแหล่งน้ำที่สะอาดและเชื่อถือได้ ซึ่งจำเป็นสำหรับเบียร์คุณภาพสูง"
 building_breweries_06: "ห้องเก็บถังไม้"
 building_breweries_06_desc: "พื้นที่ที่เก็บเบียร์หมักอย่างระมัดระวังในถังไม้ ปิดผนึกอย่างเหมาะสมและพร้อมสำหรับการจำหน่าย"
 building_breweries_07: "ห้องบรรจุถังเบียร์"
 building_breweries_07_desc: "พื้นที่เฉพาะสำหรับบรรจุถังเบียร์ มักใช้สำหรับปริมาณที่มากขึ้นและเป็นที่นิยมของโรงเตี๊ยมและร้านเหล้า"
 building_breweries_08: "โถงชิมเบียร์"
 building_breweries_08_desc: "โถงที่นักต้มเบียร์และแขกสามารถชิมเบียร์ต่าง ๆ ได้ เปิดโอกาสให้เพลิดเพลินกับเบียร์ล่าสุด"

 brewery_effect_desc: "#low ปลดล็อก:#!\n[court_position|E]: [GetCourtPositionType('court_brewmaster_court_position').GetName()]"

 #ACH
 building_type_oath_warriors_building_01: "การพระราชทานที่ดินทางทหาร"
 building_type_oath_warriors_building_01_desc: "องค์อธิปัตย์แห่งดินแดนนี้ได้ให้สัตย์ปฏิญาณในพิธีราชาภิเษกเพื่อจัดหาให้แก่นักรบ"
 building_oath_warriors_building_01: "ที่ดินแปลงเล็กของทหารผ่านศึก"
 building_oath_warriors_building_01_desc: "นักรบชนชั้นสูงที่รับใช้มานานได้รับที่ดินท้องถิ่นอย่างงาม และความสนใจในการรับใช้อย่างภักดีก็เพิ่มขึ้นตามไปด้วย"
 building_oath_warriors_building_02: "อสังหาริมทรัพย์ทางทหาร"
 building_oath_warriors_building_02_desc: "ชนชั้นนักรบสูงศักดิ์ผู้ไม่ตายในสมรภูมิอาศัยอยู่อย่างสุขสบาย ที่ดินที่ได้รับอนุญาตให้พวกเขาสรรหากำลังคนและติดอาวุธให้ตนเองอย่างเพียงพอ"
 building_oath_warriors_building_03: "เขตศักดินาหมู่บ้าน"
 building_oath_warriors_building_03_desc: "หมู่บ้านท้องถิ่นหลายแห่งถูกมอบให้แก่นายทหารอัศวินเป็นสมบัติส่วนตัว ทำให้พวกเขาสะสมกำลังและความมั่งคั่งโดยแลกมากับชนชั้นอื่น"
 building_oath_warriors_building_04: "ที่ดินทางทหารอันกว้างใหญ่"
 building_oath_warriors_building_04_desc: "ส่วนแบ่งภาษีท้องถิ่นจำนวนมากถูกส่งมอบให้แก่นักรบชนชั้นสูงผู้น้อย ผู้ถือครองที่ดินและนิคม อย่างไรก็ตาม คณะผู้ติดตามอันยิ่งใหญ่ของพวกเขายังคงรับใช้"

 building_type_oath_faithful_building_01: "อนุสรณ์สถานทางศาสนา"
 building_type_oath_faithful_building_01_desc: "องค์อธิปัตย์แห่งดินแดนนี้ได้ให้สัตย์ปฏิญาณในพิธีราชาภิเษกเพื่อจัดหาให้แก่ผู้ศรัทธา"
 building_oath_faithful_building_01: "ศาลเจ้าริมทาง"
 building_oath_faithful_building_01_desc: "ที่พักพิงเล็ก ๆ ริมถนนเป็นที่ตั้งของสัญลักษณ์ศักดิ์สิทธิ์เรียบง่าย"
 building_oath_faithful_building_02: "ประตูศักดิ์สิทธิ์"
 building_oath_faithful_building_02_desc: "เหนือทางเข้าและทั่วทั้งนิคมนี้ งานศิลปะทางศาสนาที่มีรายละเอียดสร้างแรงบันดาลใจและความยำเกรง และให้คำมั่นสัญญาถึงการสัญจรที่ปลอดภัย"
 building_oath_faithful_building_03: "เขตศักดิ์สิทธิ์ของวิหาร"
 building_oath_faithful_building_03_desc: "กลุ่มวิหารท้องถิ่นได้ขยายพื้นที่ด้วยสวนหลังคาโค้ง สถานที่อันเงียบสงบ ซึ่งเป็นที่ตั้งของบ่อน้ำจืด"
 building_oath_faithful_building_04: "จัตุรัสอนุสรณ์"
 building_oath_faithful_building_04_desc: "การลงทุนครั้งใหญ่ได้ทุ่มไปกับจัตุรัสกลางขนาดใหญ่ที่เต็มไปด้วยงานศิลปะทางศาสนา ปราศจากขยะส่วนเกินและการขูดรีด และจ่ายน้ำให้กับคนในท้องถิ่น"

 building_type_oath_poor_building_01: "โรงทานหลวง"
 building_type_oath_poor_building_01_desc: "องค์อธิปัตย์แห่งดินแดนนี้ได้ให้สัตย์ปฏิญาณในพิธีราชาภิเษกเพื่อจัดหาให้แก่คนยากจน"
 building_oath_poor_building_01: "ธรรมเนียมการกุศล"
 building_oath_poor_building_01_desc: "ผู้มี อันจะกินได้รับการสนับสนุนจากทางการให้บริจาคอาหารและทรัพย์สินส่วนเกินแก่ผู้ด้อยโอกาส โดยเฉพาะในช่วงวันสำคัญทางศาสนา"
 building_oath_poor_building_02: "โรงทานคนยากจน"
 building_oath_poor_building_02_desc: "คนยากจนมาก แม่ม่าย และผู้สูงอายุจะได้รับที่พักอาศัยพอประมาณและการดูแลบ้างในที่พักเรียบง่าย"
 building_oath_poor_building_03: "พันธกิจเมตตาธรรม"
 building_oath_poor_building_03_desc: "โรงทานและความต้องการของพลเมืองอื่น ๆ ที่ให้บริการแก่ผู้ยากไร้ได้รับการบริการอย่างดีจากเสนาบดีผู้มี อันจะกิน"
 building_oath_poor_building_04: "สถาบันการกุศล"
 building_oath_poor_building_04_desc: "ทั่วทั้งแผ่นดิน ผู้ขัดสนไม่ต้องการสิ่งใด ที่พักอันสะดวกสบายเป็นที่อยู่ของคนจรจัด โรงพยาบาลดูแลผู้ป่วยและผู้สูงอายุ และมีการให้เบี้ยเลี้ยงอย่างงามแก่ชาวนาที่ยากจน"

