 building_type_fengtian_mines_01_desc: "เหมืองหยกเฟิ่งเถียนตั้งอยู่บนที่สูงตอนกลางของเกาะ ช่วยอำนวยความสะดวกในการค้าทางทะเลในหินมีค่า หยกสีเขียวส่องสว่างนี้เป็นที่ชื่นชอบของทางการ คนในท้องถิ่น และผู้ค้าจากแดนไกล ถือเป็นสถานที่พิเศษในรายได้ของเคาน์ตี"
