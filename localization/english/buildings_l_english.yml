 building_sado_mines_02: "เหมืองทองคำซาโดะ"
 building_sado_mines_02_desc: "หลุมเหมืองถูกขยาย และมีการนำวิศวกรเข้ามาเพื่อเร่งการสกัดทองคำอย่างแท้จริง"
