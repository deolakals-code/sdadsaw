 building_type_hpakant_mines_01_desc: "ลึกลงไปใต้เนินเขาที่ปกคลุมด้วยป่า สายแร่หยกเจไดต์สว่างไสวส่องประกายท่ามกลางแม่น้ำที่พันกันและสันเขาหินปูน เป็นเวลาหลายปีที่แหล่งแร่เหล่านี้ถูกซ่อนไว้จากผู้สัญจรและผู้ค้าต่างชาติ มอบก้อนหินสีเขียวล้ำค่าจำนวนมากแก่คนในท้องถิ่น"
