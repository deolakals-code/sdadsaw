 building_type_holy_site_canterbury_cathedral_01:1 "$building_type_holy_site_canterbury_cathedral_03$"
 building_type_holy_site_canterbury_cathedral_01_desc:1 "ออกัสติน มิชชันนารีชาวโรมันและต่อมาเป็นอาร์ชบิชอป ได้สร้างอาสนวิหารแคนเทอร์เบอรีหลังจากเลือกเมืองนี้เป็นศูนย์กลางสังฆมณฑลในเคนต์ อาสนวิหารใหม่นี้ฟื้นฟูความสำคัญของเมือง ทำให้มีอำนาจเหนือคริสตจักรอังกฤษ"
