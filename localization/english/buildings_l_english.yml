 building_palace_of_ctesiphon_02_desc: "$building_type_palace_of_ctesiphon_02_desc$"

 building_type_falak_ol_aflak_citadel_01: "ฟาลัก-โอล-อัฟลัก"
 building_type_falak_ol_aflak_citadel_01_desc: "ตั้งอยู่บนยอดเนินเหนือเมืองโคร์รามาบัด ป้อมปราการอิฐโคลนซาเซเนียนแห่งนี้ยังคงเป็นภาพที่น่าประทับใจ ชาวหุบเขาเรียกมันว่า #italic ฟาลัก-โอล-อัฟลัก#! "สวรรค์แห่งสวรรค์" เพราะสำหรับพวกเขาดูเหมือนว่ามันตั้งอยู่บนยอดโลก และภายในกำแพงอันแข็งแกร่ง พวกเขามักพบที่หลบภัย"
 building_falak_ol_aflak_citadel_01: "$building_type_falak_ol_aflak_citadel_01$"
 building_falak_ol_aflak_citadel_01_desc: "$building_type_falak_ol_aflak_citadel_01_desc$"

 building_type_minarets_and_remains_of_jam_01: "หออะซานแห่งญาม"
 building_type_minarets_and_remains_of_jam_01_desc: "โครงสร้างนี้ตั้งตระหง่านเหนือหุบเขาแม่น้ำฮารี ปกคลุมด้วยปูนปั้นและการตก แต่งกระเบื้องเคลือบและแถบอักษรวิจิตรที่สลับกัน เป็นอนุสาวรีย์อันวิจิตรของสิ่งที่ศรัทธาและความมั่งคั่งสามารถบรรลุได้แม้ในดินแดนที่ห่างไกลและขรุขระเหล่านี้"
 building_minarets_and_remains_of_jam_01: "$building_type_minarets_and_remains_of_jam_01$"
 building_minarets_and_remains_of_jam_01_desc: "$building_type_minarets_and_remains_of_jam_01_desc$"

 building_type_great_wall_of_gorgan_01: "กำแพงใหญ่แห่งกอร์กอน"
 building_type_great_wall_of_gorgan_01_desc: "ระบบป้อมปราการอันกว้างใหญ่ที่สร้างขึ้นโดยกษัตริย์โบราณเพื่อเป็นกำแพงป้องกันชาวฮันเฮฟทาไลต์ กำแพงใหญ่แห่งกอร์กอนถูกปกคลุมไปด้วยตำนาน กล่าวกันว่าอเล็กซานเดอร์มหาราชเองได้เสด็จผ่านประตูของมันในการเดินทัพเพื่อพิชิตตะวันออก"
 building_great_wall_of_gorgan_01: "$building_type_great_wall_of_gorgan_01$"
 building_great_wall_of_gorgan_01_desc: "$building_type_great_wall_of_gorgan_01_desc$"

 building_type_maharloo_lake_01: "ทะเลสาบมาฮาร์ลู"
 building_type_maharloo_lake_01_desc: "แม้ว่าทะเลสาบตามฤดูกาลแห่งนี้บางครั้งจะเป็นเพียงที่ราบเกลือแห้ง แต่ในช่วงกลางฤดูร้อน น้ำจะมีสีแดงซีดอันวิจิตร นักกวีหนุ่มสาวรวมตัวกันที่ชายฝั่งเพื่อจ้องมองน้ำที่แปลกประหลาด และครุ่นคิดถึงความงามและความลึกลับของโลก"
 building_maharloo_lake_01: "$building_type_maharloo_lake_01$"
 building_maharloo_lake_01_desc: "$building_type_maharloo_lake_01_desc$"

 building_type_tomb_of_cyrus_01: "สุสานบัทเชบา"
 building_type_tomb_of_cyrus_01_desc: "กล่าวกันว่าสุสานหินปูนสีขาวโบราณแห่งนี้เป็นที่พักผ่อนของบัทเชบา มารดาของกษัตริย์โซโลมอน ซึ่งได้รับการยกย่องจากหลายศาสนา ผู้หญิงดูแลสถานที่แห่งนี้ และอนุญาตเฉพาะผู้หญิงเท่านั้นที่จะเข้าไปภายในสุสานที่มืดมิด พวกเธอไม่ค่อยพูดถึงสิ่งที่เห็นข้างใน กล่าวกันว่าน้ำในบริเวณใกล้เคียงได้รับพร และสามารถรักษาผู้ที่ถูกสุนัขบ้ากัดได้"
 building_tomb_of_cyrus_01: "$building_type_tomb_of_cyrus_01$"
 building_tomb_of_cyrus_01_desc: "$building_type_tomb_of_cyrus_01_desc$"

 building_type_rainbow_mountains_01: "ภูเขาสายรุ้ง"
 building_type_rainbow_mountains_01_desc: "ดูเหมือนว่าพระผู้สร้างเองได้ทาสีสันเขาสันเขาเหล่านี้ด้วยสีรุ้ง แถบสีแดง ขาว เหลือง เทา ส้ม และเฉดสีที่แปลกตายิ่งกว่านั้น แต่งแต้มภูมิทัศน์หินที่เงียบสงบ ผู้ปกครองท้องถิ่นมักจะนำแขกมาล่าสัตว์ที่นี่ เพื่อชมสิ่งมหัศจรรย์อันสูงส่งนี้"
 building_rainbow_mountains_01: "$building_type_rainbow_mountains_01$"
 building_rainbow_mountains_01_desc: "$building_type_rainbow_mountains_01_desc$"

 building_type_mount_damavand_01: "ยอดเขาดามาวานด์"
 building_type_mount_damavand_01_desc: "ยอดเขาสูงตระหง่านปกคลุมด้วยหิมะอันยิ่งใหญ่ ซึ่งเต็มไปด้วยตำนานโบราณ กล่าวกันว่ายอดเขาดามาวานด์เป็นที่คุมขังของทรราชผู้น่าสะพรึงกลัว ซาห์ฮาก ที่ ซึ่งเขาจะอาศัยอยู่จนถึงวันสิ้นโลก วีรบุรุษในอดีตหลายคนได้สร้างวีรกรรมอันยิ่งใหญ่บนภูเขาลูกนี้ และสำหรับผู้ที่เดินทางไปที่นั่นในปัจจุบัน การปรากฏตัวอันยิ่งใหญ่ของมันดูเหมือนจะสัมผัสจิตวิญญาณของพวกเขา ภูเขาไฟที่สงบเงียบ ลาดเขาเต็มไปด้วยบ่อน้ำพุร้อนที่นักเดินทางผู้เหนื่อยล้าสามารถหยุดพักผ่อน ครุ่นคิดถึงการกระทำของคนโบราณได้"
 building_mount_damavand_01: "$building_type_mount_damavand_01$"
 building_mount_damavand_01_desc: "$building_type_mount_damavand_01_desc$"

 building_type_holy_site_fire_temple_01: "มหาวิหารอัคคี"
 building_type_holy_site_fire_temple_01_desc: "ภายในอาคารอันยิ่งใหญ่แห่งนี้ลุกโชนด้วย #italic อาตัช เบห์ราม#! ไฟแห่งชัยชนะ เปลวไฟที่ยิ่งใหญ่และบริสุทธิ์ที่สุด รวบรวมจากฟ้าผ่า เทียนหลวง กองไฟเผาศพ เตาหลอมของช่างทอง และเตาไฟของนักพรต ผู้แสวงบุญจากดินแดนอันห่างไกลมาเพื่อชมสิ่งมหัศจรรย์นี้ ในขณะที่เหล่านักบวชประกอบพิธีชำระล้างที่ดูเหมือนไม่มีที่สิ้นสุด"
 building_holy_site_fire_temple_01: "มหาวิหารอัคคี"
 building_holy_site_fire_temple_01_desc:1 "$building_type_holy_site_fire_temple_01_desc$"

 building_type_ark_of_bukhara_01: "อาร์กแห่งบูคารา"
 building_type_ark_of_bukhara_01_desc: "กล่าวกันว่าเจ้าชายซิยาวูชาสร้างป้อมปราการขนาดมหึมาแห่งนี้เมื่อโลกยังเยาว์วัย สามพันปีต่อมา มันได้รับการบูรณะโดยบูคารา คูดาส ผู้ปกครองโบราณของภูมิภาคนี้ และถูกใช้งานตั้งแต่นั้นเป็นต้นมา นักเดินทางมาจากใกล้และไกลเพื่อชื่นชมการก่อสร้าง ด้วยเสาใหญ่เจ็ดต้นที่สะท้อนดาวเจ็ดดวงของกลุ่มดาวหมีใหญ่ แต่มันเป็นป้อมปราการเป็นอันดับแรกและสำคัญที่สุด น่าเกรงขามในความงดงามของมัน"
 building_ark_of_bukhara_01: "$building_type_ark_of_bukhara_01$"
 building_ark_of_bukhara_01_desc: "$building_type_ark_of_bukhara_01_desc$"

 building_type_shah_i_zinda_01: "ชาห์-อิ-ซินดา"
 building_type_shah_i_zinda_01_desc: "ชื่อของศูนย์รวมสุสานแห่งนี้หมายถึง #italic กษัตริย์ผู้มีชีวิต#! ซึ่งหมายถึง กุษัม อิบน์ อับบาส ลูกพี่ลูกน้องของมุฮัมมัด ซึ่งกล่าวกันว่าฝังอยู่ที่นี่ สุสานค่อนข้างเล็กและเรียบง่าย แต่ก็มีความงามอันเคร่งขรึมที่ ทำให้หลายคน lingered ท่ามกลางสุสานที่เงียบสงบ เพื่อครุ่นคิดถึงความไม่เที่ยงของชีวิต"
 building_shah_i_zinda_01: "$building_type_shah_i_zinda_01$"
 building_shah_i_zinda_01_desc: "$building_type_shah_i_zinda_01_desc$"
 building_shah_i_zinda_02: "สุสานหลวงชาห์-อิ-ซินดา"
 building_shah_i_zinda_02_desc: "สุสานหลวงอันกว้างใหญ่ประกอบด้วยสุสาน ประตูสูง และทางเดินโดมที่หุ้มด้วยกระเบื้องเทอร์ควอยซ์ #italic กษัตริย์ผู้มีชีวิต#! เป็นสถานที่ฝังศพของลูกพี่ลูกน้องของศาสดาและขุนนางผู้ยิ่งใหญ่ในอดีตอีกหลายคน ศูนย์รวมขยายตัวอย่างต่อเนื่องและสูงส่ง น่าขนลุกและน่าประทับใจในระดับเท่ากัน"

 building_type_alamut_castle_01: "ปราสาทอาลามุต"
 building_type_alamut_castle_01_desc: "รังอินทรีแห่งนี้ ตั้งอยู่บนยอดผาสูงตระหง่าน สร้างขึ้นโดยราชวงศ์จัสตานิดเพื่อใช้เป็นป้อมปราการของอาณาจักรที่ถูกล้อม ด้วยที่ตั้งอันน่าเกรงขามและเชิงเทินอันแข็งแกร่ง มันแทบจะตีไม่แตกในทุกด้าน และอาจเป็นฐานที่มั่นในอุดมคติสำหรับกลุ่มนักรบหรือนิกายใด ๆ ที่จะเจริญรุ่งเรืองในสถานที่ห่างไกล เช่นนี้"
 building_alamut_castle_01: "$building_type_alamut_castle_01$"
 building_alamut_castle_01_desc: "$building_type_alamut_castle_01_desc$"
 building_type_alamut_castle_02: "ป้อมปราการอาลามุต"
 building_type_alamut_castle_02_desc: "ตั้งอยู่บนยอดผาสูงตระหง่าน ปราสาทแห่งนี้ทำหน้าที่เป็นฐานที่มั่นบนภูเขาอันห่างไกลมานาน บัดนี้ได้รับการสร้างขึ้นใหม่เป็นป้อมปราการ #italic เฟดายีน#! ที่น่าเกรงขาม เป็นที่ตั้งของหอสมุด ห้องปฏิบัติการ และสวนอันเงียบสงบท่ามกลางป้อมปราการอันโอ่อ่า สำหรับบางคน มันเป็นสถานที่แห่งการนองเลือดและสงคราม สำหรับบางคนเป็นสถานที่พักผ่อนทางจิตวิญญาณ - หรืออาจจะทั้งสองอย่าง"
 building_alamut_castle_02: "$building_type_alamut_castle_02$"
 building_alamut_castle_02_desc: "$building_type_alamut_castle_02_desc$"
 building_type_assassin_castle_01: "$holy_order_hashshashin$ $building_castle_04$"
 building_type_assassin_castle_01_desc: "$building_type_alamut_castle_02_desc$"
 building_assassin_castle_01: "$building_type_assassin_castle_01$"
 building_assassin_castle_01_desc: "$building_type_assassin_castle_01_desc$"
 
 building_type_qanats_01: "$building_qanats_06$"
 building_type_qanats_01_desc: "$building_qanats_05_desc$"
 building_qanats_01: "ยัคชาล"
 building_qanats_01_desc: "บ้านน้ำแข็งรูปโดมเหล่านี้ผสมผสานพื้นที่เก็บของใต้ดินกับวัสดุก่อสร้างที่ทนความร้อนเพื่อสร้างพื้นที่ฉนวนที่ทำหน้าที่เป็นเครื่องทำความเย็นแบบระเหย"
 building_qanats_02: "อ่างเก็บน้ำใต้ดิน"
 building_qanats_02_desc: "เรียกว่า #italic อับ อันบาร์#! ในภาษาเปอร์เซีย โครงสร้างโค้งเหล่านี้ ซึ่งอยู่ใต้ดินครึ่งหนึ่ง ใช้เพื่อเก็บน้ำปริมาณมาก"
 building_qanats_03: "หอดักลม"
 building_qanats_03_desc: "สิ่งประดิษฐ์ของชาวเปอร์เซีย หอคอยสูงเหล่านี้เชื่อมต่อกับอ่างเก็บน้ำใต้ดินและอาคารอื่น ๆ ผ่านช่องเปิดในทิศทางลมที่พัดผ่าน พวกมันดักจับกระแสลม ซึ่งจะหมุนเวียนภายใน เพื่อให้ความเย็น"
 building_qanats_04: "คารีซ"
 building_qanats_04_desc: "ขั้นตอนแรกของระบบท่อส่งน้ำใต้ดิน คารีซคือชุดปล่องแนวตั้งที่เชื่อมต่อกันด้วยอุโมงค์ที่ลาดเอียงเล็กน้อย ซึ่งเข้าถึงแหล่งน้ำใต้ดินและส่งขึ้นสู่ผิวดิน"
 building_qanats_05: "กะนาตขนาดเล็ก"
 building_qanats_05_desc: "กะนาตคือท่อส่งน้ำใต้ดินที่ออกแบบมาเพื่อลดการสูญเสียน้ำจากการระเหย แม้จะมีขนาดค่อนข้างเล็กในระยะนี้ แต่ระบบนี้ก็ยังคงให้ประโยชน์อย่างมากต่อการเกษตร"
 building_qanats_06: "กะนาต"
 building_qanats_06_desc: "ท่อส่งน้ำใต้ดินได้รับการขยาย เชื่อมต่อกับอ่างเก็บน้ำใต้ดินท้องถิ่น โรงน้ำแข็ง และระบบชลประทาน"
 building_qanats_07: "กะนาตขนาดใหญ่"
 building_qanats_07_desc: "ระบบท่อส่งน้ำใต้ดินขนาดใหญ่นี้ทอดยาวหลาย #italic พาราซัง#! ให้แหล่งน้ำที่น่าเกรงขามสำหรับทั้งเกษตรกรและชาวเมือง"
 building_qanats_08: "ระบบกะนาตขนาดมหึมา"
 building_qanats_08_desc: "ไหลเข้าสู่อ่างเก็บน้ำใต้ดินนับไม่ถ้วน คลองชลประทาน โรงน้ำแข็ง โรงอาบน้ำ น้ำพุ และบ่อน้ำดื่ม ระบบท่อส่งน้ำใต้ดินอันน่าเกรงขามนี้เป็นเครื่องพิสูจน์ถึงความเฉลียวฉลาดและความรุ่งโรจน์ของชาวเปอร์เซียอย่างแท้จริง"

 building_type_tower_of_silence_01: "มหาหอคอยแห่งความเงียบ"
 building_type_tower_of_silence_01_desc: "ศรัทธาของเราสอนให้เรากำจัดซากศพของผู้ศรัทธาผู้ชอบธรรมโดยทิ้งไว้ให้สัตว์และท้องฟ้าเปิด ด้วยวิธีนี้ จิตวิญญาณจะยังคงบริสุทธิ์และชุมชนจะปราศจากความเน่าเปื่อยของเนื้อหนังที่ย่อยสลาย\n\nเมื่อคนภายนอกไม่อนุญาตให้เราประกอบพิธีกรรมของเรา เราต้องสร้างหอคอยเหล่านี้เพื่อปกป้องซากศพดังกล่าวและเป็นสัญลักษณ์ของความเชื่อที่ยั่งยืนของเรา"
 building_tower_of_silence_01: "มหาหอคอยแห่งความเงียบ"
 building_tower_of_silence_01_desc: "สร้างขึ้นในส่วนที่เงียบสงบของดัชชี หอคอยยอดแบนเปิดโล่งแห่งนี้เป็นที่ที่คนท้องถิ่นวางศพเพื่อพักผ่อน ร่างกายภายในสัมผัสกับนกกินซากและความรุนแรงของดวงอาทิตย์ ส่งวิญญาณผู้ล่วงลับไปสู่ชีวิตหลังความตายอย่างปลอดภัยและรักษาผู้ที่ยังมีชีวิตให้ปราศจากความเน่าเปื่อย ข้อห้ามทางศาสนาจำเป็นต้องใช้หอคอยแทนที่จะเป็นป่าตามประเพณี แต่การมีอยู่ของมันผูกพันชุมชนไว้อย่างแน่นแฟ้น"
 tower_of_silence_01.tt.liege_not_approve_of_burial: "[faith|E] ของ [liege_possessive|E] อนุญาตให้ผู้คนของท่านประกอบพิธีฝังศพตามประเพณีได้โดยไม่จำเป็นต้องมี $building_type_event_tower_of_silence_01$"
 tower_of_silence_01.tt.county_not_tos_users: "[faith|E] ของ [county|E] ไม่ได้กำจัดศพด้วยวิธีนี้"

 building_type_event_tower_of_silence_01: "หอคอยแห่งความเงียบ"
 building_type_event_tower_of_silence_01_desc: "$building_tower_of_silence_01_desc$"
 building_event_tower_of_silence_01: "หอคอยแห่งความเงียบ"
 building_event_tower_of_silence_01_desc: "$building_type_tower_of_silence_01_desc$"

 building_church_of_the_theotokos: "วิหารธีโอโทกอส"
 building_church_of_the_theotokos_desc: "ไม้กางเขนศักดิ์สิทธิ์ได้พิชิตโครงสร้างอันงดงามนี้มานานแล้ว กำจัดลัทธินอกรีตที่บูชาเทพีพรหมจารี อาธีนา\nปัจจุบัน เป็นที่ประดิษฐานศาลเจ้าแด่พระแม่มารี พาร์เธนอส พระมารดาแห่งพระเจ้าและพรหมจารีเพียงองค์เดียวที่คู่ควรกับนาม #EMP ศักดิ์สิทธิ์#!."
 building_type_church_of_the_theotokos: "$building_church_of_the_theotokos$"
 building_type_church_of_the_theotokos_desc: "$building_church_of_the_theotokos_desc$"
 building_parthenon: "พาร์เธนอน"
 building_parthenon_desc: "วิหารศักดิ์สิทธิ์ของอาธีนาผู้ยิ่งใหญ่ตั้งตระหง่านอีกครั้ง ปราศจากความเชื่องมงายงมงาย\nเสาและกำแพงอันสง่างามเหล่านี้ ซึ่งสร้างขึ้นเมื่อกว่า 1000 ปีที่แล้ว ได้ทนทานต่อการทดสอบของกาลเวลาและยังคงปกป้องบ้านของผู้ศรัทธาจากเบื้องบน เป็นสัญลักษณ์เงียบ ๆ ของพรจากเทพีพรหมจารีผู้ตั้งชื่อเมือง"
 building_type_parthenon: "$building_parthenon$"
 building_type_parthenon_desc: "$building_parthenon_desc$"

 building_hagios_demetrios: "ฮากิออส เดเมตริออส"
 building_hagios_demetrios_desc: "โบสถ์นักบุญเดเมตริออสเป็นสักการสถานที่สำคัญที่สุดในเมือง\nสร้างขึ้นครั้งแรกเมื่อศรัทธาในพระคริสต์ยังเยาว์วัย ผสมผสานโรงอาบน้ำโรมัน ซึ่งนักบุญ พร้อมด้วยผู้เชื่อยุคแรกเริ่มคนอื่น ๆ อีกหลายคน ถูกคุมขัง พลีชีพ และฝังไว้"
 building_type_hagios_demetrios: "$building_hagios_demetrios$"
 building_type_hagios_demetrios_desc: "$building_hagios_demetrios_desc$"

 building_kassiopi_castle: "ปราสาทคาสซิโอปี"
 building_kassiopi_castle_desc: "ป้อมปราการอันโอ่อ่าบนชายฝั่ง ตำแหน่งทางยุทธศาสตร์ที่มองเห็นช่องแคบที่แยกเกาะออกจากแผ่นดินใหญ่ ทำให้เป็นจุดควบคุมที่สำคัญในพื้นที่ไอโอเนียน"
 building_type_kassiopi_castle: "$building_kassiopi_castle$"
 building_type_kassiopi_castle_desc: "$building_kassiopi_castle_desc$"

 building_saint_lazarus: "โบสถ์นักบุญลาซารัส"
 building_saint_lazarus_desc: "ตามประเพณี ลาซารัสแห่งเบธานี ซึ่งครั้งหนึ่งเคยฟื้นคืนชีพโดยพระคริสต์ ถูกฝังไว้ในเมืองลาร์นากาเมื่อเขาตายครั้งที่สอง\nหลุมฝังศพหายไปนานหลายศตวรรษ แต่เมื่อพบแล้ว จักรพรรดิเลโอที่ 6 ได้ย้ายศพของนักบุญไปยังคอนสแตนติโนเปิลและสร้างโบสถ์อันโอ่อ่านี้ทับหลุมฝังศพ"
 building_type_saint_lazarus: "$building_saint_lazarus$"
 building_type_saint_lazarus_desc: "$building_saint_lazarus_desc$"

 building_type_sumela_monastery_01: "อารามซูเมลา"
 building_type_sumela_monastery_01_desc: "ต้นกำเนิดของอารามแห่งนี้ ซึ่งสร้างขึ้นบนหน้าผาสูงชันบนภูเขาสีดำนั้น ห่างไกลจนเกือบถูกปกคลุมไปด้วยความลึกลับ ตามที่บางคนกล่าว มันถูกสร้างขึ้นครั้งแรกตามคำสั่งของจักรพรรดิธีโอโดซิอุสในศตวรรษที่ 4 แต่น้ำพุศักดิ์สิทธิ์และจิตรกรรมฝาผนังโบราณอาจเก่าแก่กว่านั้น\nอัญมณีของอารามคือจิตรกรรมฝาผนังของพระมารดาแห่งพระเจ้า ซึ่งกล่าวกันว่าวาดโดยอัครสาวกลูกาเอง"
 building_sumela_monastery_01: "$building_type_sumela_monastery_01$"
 building_sumela_monastery_01_desc: "อารามตกอยู่ในสภาพทรุดโทรมและต่อมาได้รับการบูรณะและขยายโดยจักรพรรดิหลายพระองค์ ผู้มีส่วนสำคัญในการสร้างรูปลักษณ์ปัจจุบันคือจักรพรรดิจัสติเนียนผ่านการแทรกแซงของนายพลเบลิซาเรียส"
 building_sumela_monastery_02: "บูรณะ $building_type_sumela_monastery_01$"
 building_sumela_monastery_02_desc: "หลายศตวรรษผ่านไปนับตั้งแต่ครั้งสุดท้ายที่อารามแห่งนี้ได้รับการบูรณะ การแทรกแซงครั้งล่าสุดได้มอบที่ดินและผู้พึ่งพิงที่สืบทอดได้มากขึ้น การยกเว้นภาษี และเงินทุนของจักรวรรดิเพื่อสร้างอาคารใหม่ โบสถ์หินได้รับประโยชน์มากที่สุด เนื่องจากได้รับชุดจิตรกรรมฝาผนังใหม่ทั้งหมด"

 building_patras_castle: "ปราสาทพาทราส"
 building_patras_castle_desc: "อโครโพลิสโบราณของเมืองพาทราส ซึ่งตั้งอยู่บนเนินเขาของเทือกเขาโวเดียส ถูกแทนที่ด้วยป้อมปราการในรัชสมัยของจักรพรรดิจัสติเนียน\nปราสาทถูกใช้งานอย่างต่อเนื่องตั้งแต่นั้นมา อยู่ภายใต้การคุ้มครองของนักบุญองค์อุปถัมภ์ท้องถิ่น นักบุญแอนดรูว์ และของ #EMP จีเนียส โลไซ#! พาทริเนลลา รูปปั้นโรมันของหญิงสาว"
 building_type_patras_castle: "$building_patras_castle$"
 building_type_patras_castle_desc: "$building_patras_castle_desc$"

 building_maiden_tower: "หอคอยหญิงสาว"
 building_maiden_tower_desc: "โขดหินนี้หน้าชายฝั่งเคยเป็นที่ตั้งของด่านศุลกากรในสมัยของอัลซิไบอาดีสแห่งเอเธนส์ ด้วยตำแหน่งในอุดมคติที่ทางเข้าช่องแคบบอสฟอรัส\nหอคอยเสริมกำลังบนเกาะเล็ก ๆ เดียวกันนี้สามารถควบคุมการจราจรทางเรือทั้งหมดที่มาจากและมุ่งหน้าไปยังทะเลดำได้ นอกจากนี้ โซ่ขนาดใหญ่สามารถยกขึ้นสู่ระดับน้ำทะเลระหว่างหอคอยและคอนสแตนติโนเปิล ปิดกั้นทางผ่านของเรืออันตรายหรือที่ไม่ต้องการได้อย่างมีประสิทธิภาพ"
 building_type_maiden_tower: "$building_maiden_tower$"
 building_type_maiden_tower_desc: "$building_maiden_tower_desc$"

 building_despot_palace: "วังเดสปอท"
 building_despot_palace_desc: "พระราชวังอันโอ่อ่าในทำเลที่ปลอดภัยบนภูเขาไทเกตอส เหนือเมืองมีสทราสที่มีป้อมปราการ\nพระราชวังมีความหรูหราทั้งหมดเพื่อแข่งขันกับความยิ่งใหญ่ของโถงในคอนสแตนติโนเปิล และคู่ควรกับผู้ว่าราชการที่ร่ำรวยและมีอิทธิพลที่สุดเท่านั้น"
 building_type_despot_palace: "$building_despot_palace$"
 building_type_despot_palace_desc: "$building_despot_palace_desc$"

 building_type_meteora_01: "เมทีโอร่า"
 building_type_meteora_01_desc: "เมทีโอร่าเป็นชื่อที่คนท้องถิ่นตั้งให้กับกลุ่มหินอันน่าทึ่งที่เกิดจากเสาธรรมชาติที่ตั้งตระหง่านอยู่ข้างภูเขาพินดอส"
 building_meteora_01: "$building_type_meteora_01$"
 building_meteora_01_desc: "ถ้ำธรรมชาติและโพรงของเมทีโอร่ามีฤาษีอาศัยอยู่มาตั้งแต่ต้นศตวรรษที่ 9 แต่ไม่มีอาคารที่มนุษย์สร้างขึ้นใด ๆ มาเปลี่ยนแปลงภูมิทัศน์เลย"
 building_meteora_02: "$building_type_meteora_01$"
 building_meteora_02_desc: "เมื่อพระฤาษีมากขึ้นเรื่อย ๆ แสวงหาที่หลบภัยบนยอดเขาที่เว้าแหว่งของเมทีโอร่า อารามก็เริ่มปรากฏมากขึ้นเรื่อย ๆ\nการครอบครองธรรมชาติที่ไม่เป็นมิตรของมนุษย์ที่นี่ยังคงอ่อนแอมาก อารามเข้าถึงได้ยากอย่างยิ่ง ส่วนใหญ่อาศัยเพียงบันได เชือก การลากด้วยมือ และ #EMP คำอธิษฐาน#! เนื่องจากการตกในกรณีที่อุปกรณ์ขัดข้องนั้นถึงแก่ชีวิต"

 building_type_mount_athos_01: "ภูเขาอาธอส"
 building_type_mount_athos_01_desc: "ตามประเพณี พระแม่มารีกำลังล่องเรือจากปาเลสไตน์ไปยังไซปรัสเพื่อเยี่ยมลาซารัส เพื่อนของบุตรชายของเธอ ซึ่งกำลังประกาศข่าวประเสริฐบนเกาะ เมื่อเรือถูกพัดออกนอกเส้นทางและถูกบังคับให้จอดที่นี่ ข้างภูเขาอาธอส เมื่อพระแม่มารีลงจากเรือ พระองค์ทรงประทับใจในความงามตามธรรมชาติของพื้นที่ จึงทรงอวยพรและขอให้เป็นสวนของพระองค์เอง เสียงจากสวรรค์ประทานพรตามความปรารถนาของพระองค์ ตั้งแต่นั้นมา พื้นที่นี้ถือว่าศักดิ์สิทธิ์และห้ามผู้หญิงคนอื่นเข้า"
 building_mount_athos_01: "$building_type_mount_athos_01$"
 building_mount_athos_01_desc: "ชุมชนคริสเตียนอาศัยอยู่บนแหลมนี้มาตั้งแต่อย่างน้อยในสมัยของจักรพรรดิคอนสแตนตินที่ 1 และพระจากภูเขาอาธอสได้เข้าร่วมในสภาครั้งที่เจ็ดแห่งไนเซียแล้ว อย่างไรก็ตาม ยังไม่มีชุมชนสงฆ์ที่เหมาะสมหรืออาคารถาวรใด ๆ"
 building_mount_athos_02: "$building_type_mount_athos_01$"
 building_mount_athos_02_desc: "การมาถึงของพระภิกษุนามว่า อะทานาซิออส สู่ภูเขาอาธอส ทำให้เกิดการก่อตั้งอารามหลายแห่งทั่วคาบสมุทร: ก่อนอื่นคือ เกรท ลาฟรา และ วาโตเปดี ซึ่งทั้งสองอุทิศให้กับการประกาศข่าวดี ด้วยอารามที่เหมาะสม ชีวิตสงฆ์ในท้องถิ่นจึงมีระเบียบและกฎเกณฑ์"
 building_mount_athos_03: "$building_type_mount_athos_01$"
 building_mount_athos_03_desc: "ความนิยมของภูเขาอาธอสในฐานะศูนย์กลางสงฆ์ ซึ่งมีพื้นฐานมาจากการผ่อนปรนมากมายที่มอบให้โดยอำนาจทางโลก กฎเกณฑ์ที่เป็นอิสระ วิถีชีวิตที่โดดเดี่ยวอย่างแท้จริง และการผลิตรูปเคารพที่เฟื่องฟู ได้รับประกันกระแสธารของพระภิกษุที่เข้าร่วมใหม่มานานหลายศตวรรษ\nเมื่อจำนวนพระภิกษุเพิ่มขึ้น จำนวนอารามก็เพิ่มขึ้น เช่นกัน ปัจจุบันมีอารามยี่สิบแห่งบนภูเขาอาธอส ทำให้เป็นหนึ่งในชุมชนสงฆ์ที่ใหญ่ที่สุดและมีอิทธิพลมากที่สุดในพื้นที่"

 building_apollinare_nuovo: "ซันตาโปลินาเร นูโอโว"
 building_apollinare_nuovo_desc: "มหาวิหารซันตาโปลินาเร นูโอโว เพิ่งได้รับชื่อปัจจุบันเมื่อไม่นานมานี้ เมื่อพระธาตุของนักบุญอพอลลินาริสถูกย้ายมาจากมหาวิหารข้างเคียงในคลาสเซ อย่างไรก็ตาม ประวัติศาสตร์ของมันยาวนานกว่านั้นมาก\n consecrated ครั้งแรกในช่วงต้นศตวรรษที่ 6 โดยกษัตริย์ธีโอโดริกแห่งออสโตรกอทในฐานะโบสถ์อาเรียน อาคารได้เห็นการบูรณะหลายครั้งทั้งในโครงสร้างและการตก แต่ง ในขณะที่ยังคงรักษารูปแบบที่เป็นเอกลักษณ์ - การผสมผสานที่หรูหราของศิลปะตะวันตกและตะวันออก - และโมเสกไบแซนไทน์ที่น่าตื่นตาตื่นใจ"
 building_type_apollinare_nuovo: "$building_apollinare_nuovo$"
 building_type_apollinare_nuovo_desc: "$building_apollinare_nuovo_desc$"

 building_saint_catherine: "อารามนักบุญแคทเธอรีน"
 building_saint_catherine_desc: "อารามที่ไม่โอ้อวดกลางทะเลทราย แต่มีประวัติศาสตร์อันหนักหน่วง โครงสร้างสงฆ์แห่งแรก อันที่จริงแล้ว ได้รับคำสั่งให้สร้างโดยพระมารดาของจักรพรรดิคอนสแตนติน ณ สถานที่ปรากฏของพุ่มไม้เพลิงต่อโมเสส จักรพรรดิจัสติเนียนให้ทุนสนับสนุนการขยายเป็นอารามที่มีป้อมปราการในปัจจุบัน รวมถึงบ่อน้ำของโมเสสด้วย หลายศตวรรษหลังจากก่อตั้งขึ้น ศพของนักบุญแคทเธอรีนจึงมาถึงอาราม เปลี่ยนชื่อไป\nอารามแห่งนี้เป็นหนึ่งในศูนย์คัดลอกคัมภีร์และสร้างรูปเคารพที่เก่าแก่และอุดมสมบูรณ์ที่สุดเสมอมา"
 building_type_saint_catherine: "$building_saint_catherine$"
 building_type_saint_catherine_desc: "$building_saint_catherine_desc$"

 building_jvari_monastery: "อารามจวารี"
 building_jvari_monastery_desc: "อารามโบราณที่สร้างขึ้น ณ จุดที่แน่นอน ซึ่งนักบุญนีโนปลูกไม้กางเขนอัศจรรย์ขณะประกาศข่าวประเสริฐในจอร์เจีย\nอาคารศักดิ์สิทธิ์ดึงดูดผู้แสวงบุญจากทั่วทั้งคอเคซัส"
 building_type_jvari_monastery: "$building_jvari_monastery$"
 building_type_jvari_monastery_desc: "$building_jvari_monastery_desc$"

 building_etchmiadzin_cathedral: "อาสนวิหารวากัรชาปัต"
 building_etchmiadzin_cathedral_desc: "อาสนวิหารโบราณแห่งนี้เป็นศูนย์กลางทางประวัติศาสตร์ของศาสนาคริสต์นิกายอาร์เมเนียนอัครทูต ก่อตั้งขึ้นครั้งแรกโดยนักบุญเกรกอรี ผู้ให้ความกระจ่าง เหนือวิหารนอกรีตเพื่อเป็นสัญลักษณ์แห่งชัยชนะของศาสนาที่เพิ่งรับมาใหม่ของราชอาณาจักรอาร์เมเนีย โบสถ์ถูกทำลายเกือบทั้งหมดระหว่างการรุกรานของซาเซเนียน และสร้างขึ้นใหม่จากพื้นดินในอีกไม่กี่ปีต่อมา\nอย่างไรก็ตาม หลังศตวรรษที่ 7 อาสนวิหารถูกปล้นสะดมและถูกทิ้งร้างซ้ำแล้วซ้ำเล่า และตกอยู่ในสภาพทรุดโทรม มีเพียงการแทรกแซงที่รุนแรงและมีราคาแพงเท่านั้นที่จะสามารถคืนความงดงามดังเดิมได้"
 building_type_etchmiadzin_cathedral: "$building_etchmiadzin_cathedral$"
 building_type_etchmiadzin_cathedral_desc: "$building_etchmiadzin_cathedral_desc$"

 building_cattolica_stilo: "คัตโตลีกา ดิ สติโล"
 building_cattolica_stilo_desc: "อิทธิพลของไบแซนไทน์ต่ออาคารนี้แข็งแกร่ง: โบสถ์เล็ก ๆ พร้อมหอศีลจุ่ม ทำด้วยอิฐสีแดงตั้งอยู่บนโขดหินเปลือย มีแผนผัง "กางเขนจารึก" และการตก แต่งที่หรูหราด้วยชุดจิตรกรรมฝาผนัง ครอบคลุมหุบเขาของลำธารสติลาโร\nโบสถ์เป็นอัญมณีที่โดดเดี่ยวท่ามกลางธรรมชาติที่ไม่เป็นมิตร ที่ ซึ่งมนุษย์สามารถรู้สึกใกล้ชิดกับพระเจ้าได้มากขึ้น"
 building_type_cattolica_stilo: "$building_cattolica_stilo$"
 building_type_cattolica_stilo_desc: "$building_cattolica_stilo_desc$"

 building_hosios_loukas: "โฮซิออส ลูกัส"
 building_hosios_loukas_desc: "อารามอุทิศให้กับการเก็บรักษาพระธาตุของท่านลูกาแห่งสติริส พระฤาษีผู้เป็นที่เคารพนับถือ\nกล่าวกันว่าพระธาตุศักดิ์สิทธิ์หลั่งน้ำมันอัศจรรย์ และดึงดูดผู้แสวงบุญนับไม่ถ้วนที่นอนข้างหลุมฝังศพเพื่อรับการรักษาโดยการบ่ม การตก แต่งภายในได้รับการยกย่องทั่วทะเลเมดิเตอร์เรเนียนตะวันออกในด้านคุณภาพและความหรูหรา เนื่องจากศิลปินที่เก่งกาจที่สุดในยุคนั้นได้ตก แต่งด้วยโมเสก รูปเคารพ โคมระย้า งานแกะสลัก และผ้า"
 building_type_hosios_loukas: "$building_hosios_loukas$"
 building_type_hosios_loukas_desc: "$building_hosios_loukas_desc$"

 building_sofia_ohrid: "โบสถ์นักบุญโซเฟีย"
 building_sofia_ohrid_desc: "อาสนวิหารแห่งโอครีดถูกทำลายครั้งแรกเมื่อชาวสลาฟลงมายังดินแดนเหล่านี้ครั้งแรก และไม่ได้สร้างขึ้นใหม่ จนกระทั่งพื้นที่กลับมาอยู่ในร่มเงาของศรัทธาในศาสนาคริสต์อย่างปลอดภัย\nรูปลักษณ์สุดท้ายคือมหาวิหารโดมที่ตก แต่งอย่างหรูหราด้วยชุดจิตรกรรมฝาผนังจากศิลปินที่เก่งกาจที่สุดในยุคนั้น"
 building_type_sofia_ohrid: "$building_sofia_ohrid$"
 building_type_sofia_ohrid_desc: "$building_sofia_ohrid_desc$"

 building_fairy_chimneys: "การตั้งถิ่นฐานถ้ำ"
 building_fairy_chimneys_desc: "หินมีความอ่อนตัวอย่างมากในบริเวณนี้ ก่อตัวเป็นกรวย ยอด และถ้ำตามธรรมชาติ\nมนุษย์ได้ใช้ประโยชน์จากโครงสร้างเหล่านี้มานานหลายศตวรรษ สร้างคอกสัตว์ ที่เก็บของ และที่หลบภัย จากนั้นก็สร้างบ้านและอาคารผลิต จากนั้นก็สร้างโบสถ์ภายในกรวยหิน และการตั้งถิ่นฐานทั้งหมดจึงก่อตัวขึ้น"
 building_type_fairy_chimneys: "$building_fairy_chimneys$"
 building_type_fairy_chimneys_desc: "$building_fairy_chimneys_desc$"

 building_cilician_gates: "ช่องเขาซิลิเซียน"
 building_cilician_gates_desc: "ช่องเขาซิลิเซียนเป็นช่องทางผ่านเทือกเขาทอรัสที่เชื่อมต่อที่ราบซิลิเซียกับที่ราบสูงอนาโตเลีย\nตั้งแต่สมัยโบราณ ช่องทางนี้ได้รับการเสริมกำลัง และการควบคุมมันหมายถึงการควบคุมเส้นเลือดใหญ่ทางการค้าและการทหารสายหลักสายหนึ่งของเอเชียไมเนอร์และตะวันออกกลาง"
 building_type_cilician_gates: "$building_cilician_gates$"
 building_type_cilician_gates_desc: "$building_cilician_gates_desc$"

 building_swahili_port_pemba: "ท่าเรือการค้าเพมบา"
 building_swahili_port_pemba_desc: "แนวปะการัง ชายหาด และป่าชายเลนของเกาะเพมบาเป็นแหล่งของเวิ้งอ่าวและทรัพยากรมากมายสำหรับชาวเพมบา ทำให้เป็นศูนย์กลางการค้าโดยธรรมชาติของซันจ์"
 building_type_swahili_port_pembas: "$building_swahili_port_pemba$"
 building_type_swahili_port_pemba_desc: "$building_swahili_port_pemba_desc$"

 building_swahili_port_zanzibar: "ท่าเรือการค้าแซนซิบาร์"
 building_swahili_port_zanzibar_desc: "ชายฝั่งทรายของเกาะอุงกูจาที่กำบังด้วยเกาะปะการังเล็ก ๆ ทำให้เป็นสวรรค์สำหรับเรือ พ่อค้าจากทั่วทั้งมหาสมุทรอินเดียมาเพลิดเพลินกับจุดแข็งทางธรรมชาติของอุงกูจาในฐานะศูนย์กลางการค้าทางทะเล"
 building_type_swahili_port_zanzibar: "$building_swahili_port_zanzibar$"
 building_type_swahili_port_zanzibar_desc: "$building_type_swahili_port_zanzibar_desc$"

 building_swahili_port_mombasa: "ท่าเรือมอมบาซา"
 building_swahili_port_mombasa_desc: "มอมบาซาตั้งอยู่บนเกาะหินที่รายล้อมด้วยหน้าผาสูงชัน มีที่ตั้งที่ป้องกันได้ตามธรรมชาติ ซึ่งยังคงเข้าถึงการสัญจรทางทะเลได้อย่างมีเอกลักษณ์"
 building_type_swahili_port_mombasa: "$building_swahili_port_mombasa$"
 building_type_swahili_port_mombasa_desc: "$building_swahili_port_mombasa_desc$"

 building_swahili_port_pate: "ท่าเรือการค้าเกาะปาเต"
 building_swahili_port_pate_desc: "เกาะปาเตตั้งอยู่บริเวณขอบด้านเหนือของดินแดนสวาฮีลี เป็นหนึ่งในภูมิภาคสวาฮีลีแรก ๆ ที่รับอิสลามและ ดังนั้นจึงเข้าสู่เครือข่ายการค้าตะวันออกกลาง"
 building_type_swahili_port_pate: "$building_swahili_port_pate$"
 building_type_swahili_port_pate_desc: "$building_swahili_port_pate_desc$"

 building_swahili_port_lamu: "ท่าเรือการค้าลามู"
 building_swahili_port_lamu_desc: "หาดทรายสีขาวอันอบอุ่นและน้ำทะเลสีฟ้าสดใสที่ค่อย ๆ ซัดสาดชายฝั่ง ซ่อนเร้นการค้าอันคึกคัก ซึ่งเป็นดั่งสายเลือดของลามู เชื่อมโยงกับการค้าข้ามมหาสมุทรมานาน สินค้าจากสุดขอบตะวันตกและตะวันออกของโลกที่รู้จักสามารถซื้อและขายได้ที่นี่"
 building_type_swahili_port_lamu: "$building_swahili_port_lamu$"
 building_type_swahili_port_lamu_desc: "$building_swahili_port_lamu_desc$"

 building_type_dragon_kiln_01: "เตาเผามังกร"
 building_type_dragon_kiln_01_desc: "สร้างขึ้นบนด้านข้างของเนินลาดชัน กลุ่มเตาเผานี้สามารถสร้างไฟอุณหภูมิสูงมากที่จำเป็นในการผลิตเครื่องปั้นดินเผาแปลกใหม่ ซึ่งมีมูลค่าสูงในฐานะสินค้าและของกำนัล"
 building_dragon_kiln_01: "เตาเผาแบบปีน"
 building_dragon_kiln_01_desc: "เตาเผายาวนี้ดึงลมจากไฟในแนวนอน ทำให้เกิดความร้อนสูงที่ช่างปั้นต้องการเพื่อสร้างชาม แจกัน และเครื่องปั้นดินเผาอื่น ๆ ที่มีค่า"
 building_dragon_kiln_02: "เตาเผาแบบมีกล่อง"
 building_dragon_kiln_02_desc: "การผลิตเซรามิกสามารถทำได้ง่ายขึ้นด้วยการใช้กังไส ซึ่งเป็นภาชนะเรียบง่ายที่ช่วยปกป้องเครื่องปั้นดินเผาที่กำลังเผาจากสิ่งเจือปนและความเสียหาย เช่น ควัน เถ้า และเศษซากจากการผลิตขนาดใหญ่"
 building_dragon_kiln_03: "เตาเผาแบบแบ่งห้อง"
 building_dragon_kiln_03_desc: "การปิดล้อมไฟหลักของเตาเผาในห้องต่าง ๆ ทั้งช่วยควบคุมอุณหภูมิไฟและ ทำให้การบรรจุและขนถ่ายเครื่องปั้นดินเผาง่ายขึ้นสำหรับคนงาน สร้างสรรค์เครื่องปั้นคุณภาพสูงขึ้นในขนาดที่ใหญ่ขึ้น ซึ่งผู้คนยินดีจ่ายในราคาสูงขึ้น"
 dragon_kiln_terrain_requirement_tt: "[terrain|E] ไม่ใช่ #V $terrain_mountains$#!, #V $terrain_desert_mountains$#!, หรือ #V $terrain_hills$#!"
 dragon_kiln_quarry_requirement_tt: "ต้องการ [GetBuilding('quarries_01').GetName] หรือสูงกว่า"

 TERRAIN_NOT_FARMLANDS: "ภูมิประเทศไม่ใช่ $farmlands$"
 building_type_burkhan_khaldun_01: "บูรข่าน คัลดุน"
 building_type_burkhan_khaldun_01_desc: "บูรข่าน คัลดุน คือขุนเขาอันโดดเด่นตระหง่านที่สุดในบรรดาเทือกเขาเคนตี\nกล่าวกันว่าเป็นสถานที่ประสูติของวีรบุรุษชาวมองโกลหลายท่าน เชิงผาปกคลุมไปด้วยโอโว และมีการประกอบพิธีสังเวยมากมายด้วยหวังที่จะได้รับความเมตตาจากขุนเขา"
 building_burkhan_khaldun_01: "$building_type_burkhan_khaldun_01$"
 building_burkhan_khaldun_01_desc: "$building_type_burkhan_khaldun_01_desc$"

 building_pleasure_dome: "มณฑปสุขารมณ์"
 building_pleasure_dome_desc: "ปราสาทแห่งชาวมองโกล อันเป็นศูนย์กลางทั้งด้านการทหารและวัฒนธรรมอย่างเสมอภาค สิ่งอันเป็นมิ่งขวัญสูงสุดคือธาราประดิษฐ์รูปพฤกษาเงินยวง ซึ่งมีเมรัยนานาชนิดไหลหลั่งจากเหล่านาคากลมเกลียวที่รัดพันรูปปั้นนั้น"
 building_type_pleasure_dome: "$building_pleasure_dome$"
 building_type_pleasure_dome_desc: "$building_pleasure_dome_desc$"

 building_type_murex_farm_01: "แหล่งประมงหอยมูเร็กซ์"
 building_type_murex_farm_01_desc: "สีม่วงหลวงเป็นที่ต้องการสูงเสมอ หอยทากที่ใช้ทำสีย้อมหรูหรานี้ถูกเก็บเกี่ยวและแปรรูปที่นี่"
 building_murex_farm_01: "ผู้เก็บเกี่ยวหอยมูเร็กซ์"
 building_murex_farm_01_desc: "อุตสาหกรรมประมงหอยมูเร็กซ์ที่เจริญรุ่งเรืองได้ถูกก่อตั้งขึ้นตามแนวชายฝั่งทะเลเมดิเตอร์เรเนียน ให้รายได้ที่พอประมาณ แต่สม่ำเสมอจากการขายหอยทากที่เก็บเกี่ยวได้"
 building_murex_farm_02: "ศูนย์แปรรูปหอยมูเร็กซ์"
 building_murex_farm_02_desc: "ศูนย์แห่งนี้แปรรูปหอยทากมูเร็กซ์อย่างมีประสิทธิภาพ เพิ่มการสกัดสารคัดหลั่งอันมีค่าของพวกมัน ผลลัพธ์คือคุณภาพที่สูงขึ้นของสีย้อมสีม่วงที่เป็นที่ต้องการ"
 building_murex_farm_03: "โรงกลั่นสีย้อม"
 building_murex_farm_03_desc: "โรงกลั่นเฉพาะทางกลั่นสารคัดหลั่งของหอยมูเร็กซ์ให้เป็นสีย้อมสีม่วงเข้มข้น การดำเนินงานเพิ่มความสดใสและมูลค่าของสีย้อมอย่างมาก"
 building_murex_farm_04: "ลานตากแห้ง"
 building_murex_farm_04_desc: "ลานกลางแจ้งเร่งกระบวนการออกซิเดชันของสีย้อม ลดเวลาการผลิตสีย้อมสีม่วง ทำให้มั่นใจได้ถึงขั้นตอนการทำงานที่มีประสิทธิภาพมากขึ้น"
 building_murex_farm_05: "สมาคมช่างย้อมชั้นครู"
 building_murex_farm_05_desc: "สมาคมช่างย้อมชั้นครู ซึ่งมีชื่อเสียงในการได้เฉดสีม่วงไทร์ที่สมบูรณ์แบบ เพิ่มความแม่นยำในการย้อมสิ่งทอ ส่งผลให้ได้เสื้อผ้าสีม่วงคุณภาพสูงอย่างสม่ำเสมอ"
 building_murex_farm_06: "โรงทอผ้าไหม"
 building_murex_farm_06_desc: "โรงงานนี้เชี่ยวชาญในการทอผ้าหรูหรา เช่น ผ้าไหม สำหรับการย้อม ปลดล็อกความสามารถในการผลิตเสื้อผ้าคุณภาพเยี่ยม เพิ่มมูลค่าทางการค้า"
 building_murex_farm_07: "โรงงานสิ่งทอหลวง"
 building_murex_farm_07_desc: "โรงงานหลวงเน้นการผลิตสิ่งทอที่ย้อมสีม่วงไทร์จำนวนมาก เพิ่มรายได้อย่างมากจากการขายเสื้อผ้าอันทรงเกียรติเหล่านี้"
 building_murex_farm_08: "พระราชวังสีม่วง"
 building_murex_farm_08_desc: "พระราชวังอันงดงามที่ประดับประดาด้วยของตก แต่งธีมสีม่วงไทร์ ตั้งตระหง่านเป็นสัญลักษณ์แห่งความมั่งคั่งและอำนาจ แสดงถึงความเชี่ยวชาญในท้องถิ่นในการผลิตสีม่วงไทร์"

 building_type_generic_copper_mines_01: "เหมืองทองแดง"
 building_type_generic_copper_mines_01_desc: "เหมืองทองแดงที่สำคัญ ให้แร่ทองแดงที่ทำกำไรได้อย่างเหลือเชื่อแก่ใครก็ตามที่โชคดีพอที่จะเป็นเจ้าของ"
 building_generic_copper_mines_01: "การตั้งถิ่นฐานเหมืองทองแดง"
