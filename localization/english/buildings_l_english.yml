 building_type_citadel_shrine_01: "ศาลเจ้าปราการ"
 building_type_citadel_shrine_01_desc: "$building_type_temple_citadel_01$ จะไม่สมบูรณ์หากไม่มีสถานที่สำหรับสักการะเทพเจ้า ไม่ว่าจะเป็นพลเมืองทั่วไปหรือกองกำลังรักษาการณ์ ความศักดิ์สิทธิ์ที่เล็ดลอดออกมาจากภายในกำแพงจะช่วยปลอบประโลมจิตวิญญาณที่กระสับกระส่าย"
 building_citadel_shrine_01: "หอคอยปราสาท"
 building_citadel_shrine_01_desc: "ปราสาทตั้งตระหง่านอยู่บน $building_type_temple_citadel_01$ วาดภาพเงาราชวงศ์ในระยะไกล ช่วยให้ผู้สักการะชื่นชมศาลเจ้าได้จากระยะไกล"
 building_citadel_shrine_02: "ยอดปรางค์"
 building_citadel_shrine_02_desc: "เต็มไปด้วยงานแกะสลักอันละเอียดอ่อน ปรางค์สูงตระหง่านเหนือโครงสร้างที่ลดหลั่นกัน เสริมความประทับใจในความสูง เป็นที่พักสายตาอันน่ายินดีขณะสวดภาวนา ไม่ว่าจะเปล่งวาจาหรือเงียบสงบในฌาน"
 building_citadel_shrine_03: "รูปปั้นศักดิ์สิทธิ์"
 building_citadel_shrine_03_desc: "กลุ่มรูปปั้นจ้องมองไปยังท้องฟ้าชั่วนิรันดร์ ครุ่นคิดถึงความเป็นนิรันดร์ และมักจะกระตุ้นอารมณ์ที่ซับซ้อนในตัวผู้สักการะ"
 building_citadel_shrine_04: "รูปปั้นสิงห์"
 building_citadel_shrine_04_desc: "ฟันยิงและดวงตาจ้องเขม็ง สิงโตผู้พิทักษ์ที่ดุร้ายเหล่านี้มอบพรแห่งการคุ้มครองแก่ผู้อยู่อาศัยใน $building_type_temple_citadel_01$"
 building_citadel_shrine_05: "นาคผู้พิทักษ์"
 building_citadel_shrine_05_desc: "สร้างขึ้นอย่างปราณีตด้วยหินทรายและมณฑลที่จารึกไว้อย่างวิจิตรบนหน้าอก พญานาคเจ็ดเศียรเหล่านี้มอบความสงบสุขและความเจริญรุ่งเรืองแก่ผู้อยู่อาศัยในศาลเจ้า"
 building_citadel_shrine_06: "ภาพนูนต่ำ"
 building_citadel_shrine_06_desc: "พลเมืองมักจะหยุดเพื่อตรวจสอบรายละเอียดเล็ก ๆ น้อย ๆ ของภาพนูนต่ำเหล่านี้ เนื่องจากพวกมันแสดงถึงช่วงเวลาการต่อสู้อันน่าทึ่ง แต่ยัง รวมถึงภพภูมิต่าง ๆ ของเทพเจ้าและตำนานการสร้างโลก"
 building_citadel_shrine_07: "ที่เก็บพระธาตุ"
 building_citadel_shrine_07_desc: "ขุมสมบัติของรูปปั้นและวัตถุทางศาสนาและพิธีกรรมต่าง ๆ $building_type_temple_citadel_01$ แห่งนี้มีคอลเลกชันที่ยิ่งใหญ่กว่าที่อื่นใด"
 building_citadel_shrine_08: "พระรูปเทวราชา"
 building_citadel_shrine_08_desc: "องค์เทพผู้ศักดิ์สิทธิ์ หยุดนิ่งเหนือกาลเวลาในท่วงท่าอันสง่างาม เปิดโอกาสให้ผู้สักการะได้สวดภาวนาและแสดงความเคารพอย่างนอบน้อมเพื่อรับพร"

 building_type_sacred_pool_01: "สระศักดิ์สิทธิ์"
 building_type_sacred_pool_01_desc: "แหล่งน้ำขนาดใหญ เช่นนี้อาจมีจุดประสงค์หลายประการ แต่เป็นที่ชัดเจนว่าเมื่อเวลาผ่านไปและฤดูกาลเปลี่ยนแปลง ปรากฏการณ์ทางสายตาที่สะท้อนในสระน้ำบางครั้งก็กลายเป็นสิ่งที่เหนือธรรมชาติอย่างแท้จริง สระน้ำเหล่านี้เป็นแหล่งป้อมปราการ เช่นเดียวกับแหล่งน้ำ เป็นส่วนสำคัญในชีวิตประจำวันของผู้อยู่อาศัย"
 building_sacred_pool_01: "สระบัว"
 building_sacred_pool_01_desc: "สระน้ำที่กลมกลืน ทำให้ผู้พบเห็นตะลึงในความงามและความเงียบสงบ และกล่าวกันว่าเป็นสถานที่เกิดเหตุการณ์สำคัญทางจิตวิญญาณ"
 building_sacred_pool_02: "อ่างเก็บน้ำศักดิ์สิทธิ์"
 building_sacred_pool_02_desc: "ด้วยขนาดที่เพิ่มขึ้น $building_sacred_pool_02$ นี้ยังนำพาสัตว์ป่ามาเป็นครั้งคราว พืชและสัตว์ทำงานร่วมกันเป็นหนึ่งเดียวเพื่อสร้างแรงบันดาลใจให้ผู้มาเยือนด้วยความรู้สึกถึงวัฏจักรแห่งชีวิต"
 building_sacred_pool_03: "อ่างน้ำ"
 building_sacred_pool_03_desc: "สถานที่สำหรับพิธีการและพิธีกรรมแปลก ๆ แหล่งน้ำนี้บอกเล่าเรื่องราวความรุ่งโรจน์ที่เพิ่มขึ้นของผู้ปกครอง"
 building_sacred_pool_04: "คูเมือง"
 building_sacred_pool_04_desc: "บัดนี้ล้อมรอบศาสนสถาน ผู้อยู่อาศัยรู้สึกปลอดภัยมากขึ้นเมื่อ $building_type_sacred_pool_01$ มอบป้อมปราการบางส่วนระหว่างพวกเขาและกองกำลังศัตรูที่อาจเกิดขึ้น"
 building_sacred_pool_05: "บารายย่อย"
 building_sacred_pool_05_desc: "กลุ่มสิงโตผู้พิทักษ์เฝ้าดูบาราย ทำให้ผู้บุกรุกคิดทบทวนก่อนที่จะข้ามผืนน้ำนิ่ง"
 building_sacred_pool_06: "บาราย"
 building_sacred_pool_06_desc: "$building_sacred_pool_06$ ที่ทอดยาวจากตะวันออกไปตะวันตกเป็นภาพที่งดงามน่าชม รูปปั้นพญานาคช่วยเฝ้าระวังบริเวณขอบนอก"
 building_sacred_pool_07: "บารายใหญ่"
 building_sacred_pool_07_desc: "รูปปั้น พืชพรรณที่เบ่งบาน และทิวทัศน์อันงดงามเป็นสัญลักษณ์ของแหล่งน้ำอันสง่างามนี้ นำมา ซึ่งความเย็นสบายและการดับกระหายในช่วงเวลาที่ร้อนระอุ"
 building_sacred_pool_08: "บารายศักดิ์สิทธิ์"
 building_sacred_pool_08_desc: "นักเดินทางและผู้มาเยือนคนอื่น ๆ ที่ผ่านไปมามักจะยืนตะลึงในแหล่งน้ำที่มนุษย์สร้างขึ้นนี้ ความกว้างของมัน ทำให้สายตามองแทบไม่เห็นขอบอีกด้านหนึ่ง ข้อพิสูจน์ที่แท้จริงถึงความเชื่อมโยงอันศักดิ์สิทธิ์ของสถานที่แห่งนี้"

 building_type_vihara_halls_01: "โถงวิหาร"
 building_type_vihara_halls_01_desc: "อาคารสงฆ์ สร้างขึ้น เพื่อให้พระภิกษุหลบฝนในฤดูฝน ที่นี่เป็นสถานที่แห่งการทำสมาธิอันเงียบสงบ การสวดมนต์ และการพักฟื้น การขยายโถงมีส่วนช่วยในความแข็งแรงและความทุ่มเทของผู้ติดตามทางศาสนาที่อาศัยอยู่"
 building_vihara_halls_01: "ศาลสวดมนต์"
 building_vihara_halls_01_desc: "การเพิ่ม $building_vihara_halls_01$ ทำให้ผู้มาเยือนมีสถานที่สักการะและไตร่ตรอง"
 building_vihara_halls_02: "หอพระไตรปิฎก"
 building_vihara_halls_02_desc: "พระคัมภีร์โบราณและใหม่ ถูกเก็บไว้ภายในกำแพงของหอไตร ผู้ศรัทธาที่มาเยือนสามารถอ่านและศึกษาเพิ่มเติมเพื่อการรู้แจ้งได้ตามอัธยาศัย"
 building_vihara_halls_03: "โบสถ์มีเสาเรียงราย"
 building_vihara_halls_03_desc: "เสาเรียงรายอันสง่างามสูงตระหง่านเหนือโบสถ์เหล่านี้ เผยให้เห็นจารึกที่ซับซ้อนและภาพวาดทางศาสนาต่าง ๆ แก่ผู้สักการะภายใน"
 building_vihara_halls_04: "มณฑป"
 building_vihara_halls_04_desc: "ขนาดที่แท้จริงของโถงเสานี้เหมาะอย่างยิ่งสำหรับการประกอบพิธีกรรมสาธารณะหรือพิธีทางศาสนาอื่น ๆ"
 building_vihara_halls_05: "ศาลา"
 building_vihara_halls_05_desc: "ศาลากลางแมกไม้เขียวขจี ความงามของโครงสร้างนี้เทียบได้กับบรรยากาศแห่งจิตวิญญาณเท่านั้น"
 building_vihara_halls_06: "หินสีมา"
 building_vihara_halls_06_desc: "หินเขตแดนช่วยผู้ดูแล $building_type_vihara_halls_01$ ในการประมาณขนาดและระยะห่างที่เพียงพอของพื้นที่ที่จำเป็นสำหรับพระสงฆ์ในการประกอบพิธีสักการะได้อย่างถูกต้อง"
 building_vihara_halls_07: "หอระฆัง"
 building_vihara_halls_07_desc: "$building_vihara_halls_07$ อันสง่างามตั้งตระหง่านอยู่บน $building_type_vihara_halls_01$ เหล่านี้ สะท้อนแสงแดดยามกลางวันและปรากฏเป็นเงาราง ๆ ในระยะไกลยามค่ำคืน"
 building_vihara_halls_08: "โถงใหญ่"
 building_vihara_halls_08_desc: "ความสะดวกสบายและสิ่งอำนวยความสะดวกของโถงเหล่านี้ ทำให้พระสงฆ์เดินทางมาจากแดนไกลเพื่อเยี่ยมเยียน รวบรวมและเผยแพร่คำสอนและแนวคิดในเครือข่ายข้อมูลอันล้ำค่า เผยแพร่ความสามัคคีไปยังอาณาจักรใกล้เคียง"

 building_type_itsukushima_jinja_01: "$building_itsukushima_jinja_01$"
 building_type_itsukushima_jinja_01_desc: "$building_itsukushima_jinja_01_desc$"
 building_itsukushima_jinja_01: "ศาลเจ้าอิสึกุชิมะ" # 厳島神社
 building_itsukushima_jinja_01_desc: "ก่อตั้งขึ้นในศตวรรษที่ 6 และอุทิศให้กับเทพีชินโตแห่งท้องทะเลและพายุ ระเบียงของศาลเจ้าอิสึกุชิมะตั้งตระหง่านอยู่เหนือน้ำ มองไปยังประตูโทริอิอันโด่งดัง ซึ่งดูเหมือนจะลอยอยู่เหนือผืนน้ำของอ่าวมัตสึชิมะ"
 building_itsukushima_jinja_02: "$building_itsukushima_jinja_01$"
 building_itsukushima_jinja_02_desc: "$building_itsukushima_jinja_01_desc$"

 building_type_heian_palace_01: "$building_heian_palace_01$"
 building_type_heian_palace_01_desc: "$building_heian_palace_01_desc$"
 building_heian_palace_01: "พระราชวังเฮอัง" # 平安宮
 building_heian_palace_01_desc: "สร้างขึ้นโดยจักรพรรดิคัมมุเพื่อเป็นศูนย์กลางของนครหลวงเฮอังเกียว หรือ 'นครแห่งสันติภาพ' อันยิ่งใหญ่ของพระองค์ กลุ่มพระราชวังอันกว้างใหญ่เป็นที่ตั้งของราชสำนัก ที่ประทับ และสำนักงานระบบราชการส่วนกลางของญี่ปุ่น ระเบียงทางเดินเป็นศูนย์กลางที่คึกคักของพิธีกรรม การเมือง และเล่ห์เหลี่ยม ที่ ซึ่งตระกูลขุนนางโบราณต่างแย่งชิงอิทธิพล"

 building_type_ise_jingu_01: "$building_ise_jingu_01$"
 building_type_ise_jingu_01_desc: "$building_ise_jingu_01_desc$"
 building_ise_jingu_01: "ศาลเจ้าอิเสะ" # 伊勢神宮
 building_ise_jingu_01_desc: "อิเสะจิงงูศักดิ์สิทธิ์ต่อเทพีแห่งดวงอาทิตย์ #EMP อามาเตราสึ#! และเป็นหนึ่งในสถานที่ชินโตที่เคารพนับถือมากที่สุด ศาลเจ้าเป็นที่ประดิษฐานเครื่องราชกกุธภัณฑ์ของยามาโตะ และดูแลโดยนักบวชหญิงไซกูผู้บริสุทธิ์ ซึ่งได้รับเลือกจากราชวงศ์"

 building_type_kofuku_ji_01: "$building_kofuku_ji_01$"
 building_type_kofuku_ji_01_desc: "$building_kofuku_ji_01_desc$"
 building_kofuku_ji_01: "วัดโคฟุกุ" # 興福寺
 building_kofuku_ji_01_desc: "สืบเนื่องมาถึงศตวรรษที่ 7 โคฟุกุจิเป็นหนึ่งในเจ็ดวัดใหญ่แห่งนารา ซึ่งเป็นหนึ่งในศูนย์กลางความคิดและอำนาจทางพุทธศาสนาที่เก่าแก่และสำคัญที่สุดในญี่ปุ่น"

 building_type_enryaku_ji_01: "$building_enryaku_ji_01$"
 building_type_enryaku_ji_01_desc: "$building_enryaku_ji_01_desc$"
 building_enryaku_ji_01: "วัดเอ็นเรียกุ" # 延暦寺
 building_enryaku_ji_01_desc: "ก่อตั้งโดย $SaichO_$ ในช่วงปลายศตวรรษที่ 8 เอ็นเรียกุจิตั้งอยู่บนภูเขาฮิเอ มองเห็นเมืองหลวงเฮอังเกียวของจักรพรรดิคัมมุ และเป็นศูนย์กลางของพุทธศาสนานิกายปุณฑริกะ หรือเท็นได ในญี่ปุ่น"

 building_type_dazaifu_01: "$building_dazaifu_01$"
 building_type_dazaifu_01_desc: "$building_dazaifu_01_desc$"
 building_dazaifu_01: "สำนักงานดาไซฟุ" # 興福寺
 building_dazaifu_01_desc: "เมืองดาไซฟุเป็นศูนย์กลางการบริหารของราชสำนักบนเกาะคิวชูอันห่างไกล ก่อตั้งขึ้นเพื่อดูแลการป้องกันเกาะ อำนวยความสะดวกทางการค้าในต่างประเทศ และต้อนรับบุคคลสำคัญจากต่างประเทศ ตำแหน่งผู้ว่าการดาไซฟุเป็นบันไดอาชีพทั่วไปของข้าราชการที่ทะเยอทะยาน"

 building_type_chinjufu_01: "$building_chinjufu_01$"
 building_type_chinjufu_01_desc: "$building_chinjufu_01_desc$"
 building_chinjufu_01: "เขตชินจูฟุ" # 鎮守府
 building_chinjufu_01_desc: "เดิมทีมีฐานอยู่ที่ทากะ ชินจูฟุเป็นศูนย์กลางป้อมปราการของความพยายามในการสร้างสันติภาพของจักรวรรดิในญี่ปุ่นตอนเหนือ ดูแลโดยผู้บัญชาการพิเศษที่รับผิดชอบการป้องกันและเก็บภาษีของภูมิภาค"

 building_type_hakata_port_01: "$building_hakata_port_01$"
 building_type_hakata_port_01_desc: "$building_hakata_port_01_desc$"
 building_hakata_port_01: "ท่าเรือฮากาตะ" # 博多
 building_hakata_port_01_desc: "นับตั้งแต่ยุคแรก ๆ ของยามาโตะ เมืองท่าฮากาตะบนชายฝั่งทางเหนือของคิวชูเป็นประตูทางทะเล เป็นศูนย์กลางที่คึกคัก ซึ่งดูแลโดยสำนักงานดาไซฟุที่อยู่ใกล้เคียง ที่ ซึ่งพ่อค้าขายสินค้าจากดินแดนห่างไกลและคณะทูตย่างเท้าก้าวสู่ชายฝั่งญี่ปุ่น"
 building_hakata_port_02: "$building_hakata_port_01$"
 building_hakata_port_02_desc: "$building_hakata_port_01_desc$"

 building_type_hwangnyongsa_01: "$building_hwangnyongsa_01$"
 building_type_hwangnyongsa_01_desc: "$building_hwangnyongsa_01_desc$"
 building_hwangnyongsa_01: "วัดฮวังนยง" # 皇龍寺 (황룡사)
 building_hwangnyongsa_01_desc: "สร้างเสร็จในศตวรรษที่ 7 วัดฮวังนยงซา หรือ 'วัดมังกรหลวง' เป็นกลุ่มอาคารขนาดใหญ่ที่สร้างโดยพระเจ้าจินฮึงแห่งชิลลา เพื่อเป็นศูนย์กลางการสอนและอำนาจทางพุทธศาสนา และมีเจดีย์ที่สูงที่สุดแห่งหนึ่งของโลก"

 building_type_white_deer_grotto_academy_01: "$building_white_deer_grotto_academy_01$"
 building_type_white_deer_grotto_academy_01_desc: "$building_white_deer_grotto_academy_01_desc$"
 building_white_deer_grotto_academy_01: "สถาบันถ้ำกวางขาว"
 building_white_deer_grotto_academy_01_desc: "ก่อตั้งโดยฤๅษีหลี่ โป๋ ที่ ซึ่งกวางขาวท่องไปอย่างอิสระ สถาบันแห่งนี้เจริญรุ่งเรืองในฐานะศูนย์กลางของลัทธิขงจื๊อใหม่"

 building_type_shigu_academy_01: "$building_shigu_academy_01$"
