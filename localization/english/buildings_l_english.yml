 building_special_sicilian_parliament_01:0 "รัฐสภา"
 building_special_sicilian_parliament_01_desc:1 "ผู้แทนจากฐานันดรทั้งสามประชุมกันเป็นนิจ ณ อาคารแห่งนี้ เพื่อปรึกษาหารือราชการแผ่นดินและถวายคำแนะนำแด่ผู้ปกครององค์ปัจจุบัน"
 building_special_greenhouse_01:0 "อนุสรณ์สถานกระจก"
 building_special_greenhouse_01_desc:0 "อาคารหลังนี้ดูเหมือนจะยอดเยี่ยมสำหรับการปลูกผัก"
 building_type_special_greenhouse_01:0 "อนุสรณ์สถานกระจก"
 building_type_special_greenhouse_01_desc:1 "อาคารหลังนี้ดูเหมือนจะยอดเยี่ยมสำหรับการปลูกผัก"
 building_type_university_01:0 "มหาวิทยาลัย"
 building_type_university_01_desc:2 "สถานศึกษาขั้นสูงสำหรับผู้มีอิทธิพลและทองคำมากพอที่จะได้รับเข้าศึกษา"
 building_university_01:0 "มหาวิทยาลัย I"
