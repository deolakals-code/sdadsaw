 building_type_rammelsberg_mines_01:0 "เหมืองรัมเมิลส์แบร์ก"
 building_type_rammelsberg_mines_01_desc:1 "ณ ตีนเขารัมเมิลส์แบร์กมีเหมืองเงินที่ทำกำไรและเป็นที่ต้องการเสมอ"
 building_rammelsberg_mines_01:1 "การตั้งถิ่นฐานเหมืองแร่รัมเมิลส์แบร์ก"
 building_rammelsberg_mines_01_desc:1 "การตั้งถิ่นฐานเหมืองแร่ขนาดเล็กได้ผุดขึ้นใกล้กับบริเวณที่มีสายแร่ ผู้ตั้งถิ่นฐานได้เริ่มเปิดสายแร่และสกัดแร่ แต่จนถึงขณะนี้พวกเขายังเป็นเพียงการเริ่มต้นเท่านั้น"
 building_rammelsberg_mines_02:1 "เหมืองรัมเมิลส์แบร์ก"
 building_rammelsberg_mines_02_desc:1 "เมื่อการตั้งถิ่นฐานเติบโตขึ้น แร่ก็ถูกสกัดมากขึ้นเรื่อย ๆ การหลั่งไหลเข้ามาของวิศวกรผู้มีความสามารถ ทำให้สามารถก่อสร้างเหมืองที่แท้จริงได้"
 building_rammelsberg_mines_03:1 "เหมืองรัมเมิลส์แบร์กขนาดใหญ่"
 building_rammelsberg_mines_03_desc:1 "เมื่อการดำเนินงานเหมืองแร่เติบโตขึ้น เหมืองเองก็เติบโตขึ้น เช่นกัน มีการสร้างทางเข้าเพิ่มขึ้น และมีการขุดปล่องขนาดใหญ่ เพื่อให้สามารถสกัดแร่ที่อยู่ลึกได้"
 building_rammelsberg_mines_04:1 "ศูนย์รวมเหมืองแร่รัมเมิลส์แบร์ก"
 building_rammelsberg_mines_04_desc:1 "เมื่อการผลิตแร่เพิ่มขึ้น โรงหล่อและโรงถลุงหลายแห่งได้ถูกจัดตั้งขึ้นรอบ ๆ การตั้งถิ่นฐาน การแปรรูปโลหะกลายเป็นเรื่องธรรมดาสำหรับผู้อยู่อาศัย และทักษะของพวกเขาก็มีชื่อเสียงไปทั่วโลกที่รู้จัก"
