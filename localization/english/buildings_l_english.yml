 building_type_the_friday_mosque_01:0 "มัสยิดวันศุกร์"
 building_type_the_friday_mosque_01_desc:0 "มัสยิดวันศุกร์ หรือ มัสยิดจาเมห์แห่งเอสฟาฮาน สร้างขึ้นในสมัยราชวงศ์อุมัยยะฮ์ กล่าวกันว่าเคาะลีฟะฮ์ทรงสร้างเสาต้นหนึ่งในมัสยิดด้วยพระองค์เอง ก่อนที่จะกลายเป็นมัสยิด กล่าวกันว่าเคยเป็นศาสนสถานของชาวโซโรอัสเตอร์มาก่อน"
