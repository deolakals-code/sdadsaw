 building_type_generic_silver_mines_01: "เหมืองเงิน"
 building_type_generic_silver_mines_01_desc: "เหมืองเงินที่อุดมสมบูรณ์ ให้กระแสธารของเงินมีค่าอย่างต่อเนื่อง"
