 building_type_kollur_mines_01:0 "เหมืองกอลลูร์"
 building_type_kollur_mines_01_desc:0 "เหมืองกอลลูร์ใช้ประโยชน์จากแหล่งเพชรที่ใหญ่ที่สุดในอนุทวีปอินเดียทั้งหมด งานนี้อันตรายอย่างยิ่ง แต่ความร่ำรวยนั้นเกินจินตนาการ"
 building_kollur_mines_01:0 "หลุมเหมืองกอลลูร์"
 building_kollur_mines_01_desc:0 "เป็นเพียงหลุมดินเหนียวและกรวด คนงานที่นุ่งผ้าเตี่ยวผืนเดียวทำงานที่นี่ทั้งกลางวันและกลางคืนเพื่อสกัดเพชร"
 building_kollur_mines_02:0 "เหมืองกอลลูร์"
 building_kollur_mines_02_desc:1 "หลุมเหมืองได้ถูกขยาย และมีการนำวิศวกรเข้ามาเพื่อเพิ่มการสกัดเพชรอย่างแท้จริง"
 building_kollur_mines_03:0 "เหมืองกอลลูร์ขนาดใหญ่"
 building_kollur_mines_03_desc:0 "หมู่บ้านได้ผุดขึ้นรอบ ๆ หลุมเหมืองหลายแห่ง และคนงานพบเพชรขนาดใหญ่เป็นประจำ"
 building_kollur_mines_04:0 "ศูนย์รวมเหมืองแร่กอลลูร์"
 building_kollur_mines_04_desc:0 "การสกัดเพชรได้มาถึงระดับเกือบอุตสาหกรรม โดยมีจำนวนคนงานอยู่ในหลักพัน ความร่ำรวยไม่สิ้นสุดดูเหมือนจะไหลออกจากเหมือง"
 
 building_type_tribe_01:1 "ป้อมชนเผ่า"
 building_type_tribe_01_desc:1 "ป้อมชนเผ่าที่เรียบง่าย แต่มีประสิทธิภาพ ตั้งตระหง่านเฝ้าหมู่บ้านชนเผ่า"
 building_tribe_01:1 "ป้อมชนเผ่า"
 building_tribe_01_desc:1 "สร้างจากท่อนซุงและหินที่สกัดหยาบ ๆ ป้อมนี้ดูน่าเกรงขามแม้จะมีขนาดเล็ก"
 building_tribe_02:1 "ป้อมชนเผ่าเสริมกำลัง"
 building_tribe_02_desc:1 "ป้อมเสริมกำลังได้รับแรงบันดาลใจจากปราสาทศักดินา เพิ่มองค์ประกอบป้องกันใหม่ ๆ มากมาย"
 
 building_type_longhouses_01:1 "โถงชุมนุม"
 building_type_longhouses_01_desc:1 "หัวหน้าเผ่า ผู้อาวุโส และขุนศึกล้วนปรึกษาหารือกันในโถงยาวเมื่อทำการตัดสินใจ โถงอันยิ่งใหญ่นำเกียรติภูมิมาสู่ผู้ที่เป็นเจ้าภาพการชุมนุม"
 building_longhouses_01:1 "โถงยาว"
 building_longhouses_01_desc:1 "โถงยาวมีขนาดใหญ่พอที่จะรองรับการประชุมสำคัญระหว่างผู้อาวุโส กฎหมายและนโยบายถูกกำหนดขึ้นที่นี่"
 building_longhouses_02:1 "โถงใหญ่"
 building_longhouses_02_desc:1 "โถงใหญ่มีเวทีกลาง ซึ่งหัวหน้าเผ่าหรือขุนศึกสามารถกล่าวสุนทรพจน์ปลุกใจได้"
 
 building_type_war_camps_01:0 "ค่ายสงคราม"
 building_type_war_camps_01_desc:1 "นักรบชนเผ่าผู้ดุร้ายรวมตัวกันในค่ายสงครามเมื่อเสียงเขาสัตว์เรียกพวกเขาสู่สงคราม แม้ในยามสงบ ก็สามารถพบพวกเขาประลองยุทธ์ เตรียมพร้อมสำหรับความขัดแย้งที่หลีกเลี่ยงไม่ได้"
 building_war_camps_01:1 "ลานประลอง"
 building_war_camps_01_desc:2 "อุปกรณ์ฝึกซ้อม เวทีประลอง และกำแพงไม้เป็นตัวกำหนดลานประลอง นักรบมาที่นี่เพื่อฝึกฝนทักษะของตน"
 building_war_camps_02:1 "เรือนพักนักรบ"
 building_war_camps_02_desc:1 "อนุญาตเฉพาะนักสู้ที่เก่งกาจที่สุดเท่านั้นที่จะเข้าสู่เรือนพักนักรบ และการปรากฏตัวของพวกเขาเพียงอย่างเดียวก็เป็นแรงบันดาลใจ"
 
 building_type_palisades_01:0 "รั้วปัก"
 building_type_palisades_01_desc:2 "ชั้นของรั้วปักไม้ปกป้องการตั้งถิ่นฐานของชนเผ่าที่กระจัดกระจาย ป้องกันพวกเขาจากภัยคุกคามง่าย ๆ เช่น สัตว์ป่า หรือการปล้นสะดมขนาดเล็ก"
 building_palisades_01:1 "รั้วปักอย่างง่าย"
 building_palisades_01_desc:1 "รั้วปักอย่างง่ายให้การป้องกันที่จำกัด แม้จะมีประสิทธิภาพในการต่อต้านการปะทะกันเล็กน้อย แต่ก็เชื่อถือได้น้อยกว่าในการต่อต้านกลุ่มศัตรูขนาดใหญ่"
 building_palisades_02:1 "กำแพงและคู"
 building_palisades_02_desc:1 "คูด้านนอกรวมกับกำแพงรั้วปักเสริมหินให้การป้องกันที่ดีพอสมควรจากการล้อมเมือง"
 
 building_type_market_villages_01:1 "ตลาด"
 building_type_market_villages_01_desc:1 "หมู่บ้านตลาดขนาดเล็กจำนวนมากได้ผุดขึ้นรอบ ๆ ส่วนที่มีการเดินทางบ่อยครั้งของดินแดนเหล่านี้ ที่นี่ชนเผ่าทำการค้าและแลกเปลี่ยนสินค้ากับพ่อค้าที่เดินทาง"
 building_market_villages_01:1 "ด่านการค้า"
 building_market_villages_01_desc:1 "ด่านการค้าเปิดโอกาสให้ชนเผ่าและพ่อค้าได้พบปะและแลกเปลี่ยนสินค้า"
 building_market_villages_02:1 "หมู่บ้านตลาด"
 building_market_villages_02_desc:2 "ในเวลาที่กำหนด หมู่บ้านเหล่านี้จะจัดตลาดสาธารณะที่ดึงดูดพ่อค้าจากทั่วทั้งภูมิภาคและเพิ่มความมั่งคั่งในท้องถิ่น"
 
 building_type_water_temples_01: "วิหารน้ำสุบัก"
 building_type_water_temples_01_desc: "สหกรณ์ชลประทานที่เป็นมิตรต่อแผ่นดินภายใน ซึ่งยึดโยงโดยศาลเจ้าและวิหารน้ำ ปฏิทินพิธีกรรมประสานงานการเพาะปลูกและการบำรุงรักษาคลอง"
 building_water_temples_01: "ฝายสุบักและศาลเจ้าในนา"
 building_water_temples_01_desc: "ฝายขนาดเล็กและคลองดินเชื่อมต่อนาข้าว ศาลเจ้าดูแลเครื่องบูชาและเวรยามทำงาน ผลผลิตส่วนเกินที่เชื่อถือได้เริ่มหลั่งไหลเข้ามา เช่นเดียวกับพิธีกรรม"
 building_water_temples_02: "ศาลเจ้าสภาสุบัก"
 building_water_temples_02_desc: "ศาลเจ้าหลายแห่งประสานงาน 'สุบัก' ที่กว้างขึ้นด้วยการแบ่งปันน้ำตามปฏิทิน ข้อพิพาทและการซ่อมแซมได้รับการจัดการร่วมกัน ช่วยปรับปรุงการควบคุมและผลผลิต"
 building_water_temples_03: "เครือข่ายวิหารน้ำ"
 building_water_temples_03_desc: "วงจรวิหารน้ำที่เหมาะสมจะดูแลการเพาะปลูกและการพักดินที่ประสานกัน ศัตรูพืชลดลง ผลผลิตเพิ่มขึ้น และความศรัทธาในพิธีกรรมก็เพิ่มพูน"
 building_water_temples_04: "ภูมิทัศน์มหาวิหารน้ำ"
 building_water_temples_04_desc: "การระบายน้ำทั้งหมดถูกจัดระบบผ่านการประชุมที่นำโดยวิหาร นาขั้นบันได ประตูน้ำ และการเฉลิมฉลอง ทำให้จังหวัดนี้เป็นอู่ข้าวอู่น้ำอันเปี่ยมศรัทธา"
 
 building_type_stilted_granaries_01: "ยุ้งฉางยกพื้น"
 building_type_stilted_granaries_01_desc: "ยุ้งฉางกันหนูที่ยกขึ้นบนเสาสี่ต้นหรือมากกว่า เหมาะสำหรับเก็บเครื่องบรรณาการและจัดเตรียมเสบียงให้กองทัพ"
 building_stilted_granaries_01: "ยุ้งฉางยกเสา"
 building_stilted_granaries_01_desc: "ยุ้งฉางสี่เสาธรรมดาช่วยให้เมล็ดพันธุ์และเครื่องบรรณาการแห้ง ยามหมู่บ้านได้กินดีขึ้นในการทัพ"
 building_stilted_granaries_02: "แถวยุ้งฉาง"
 building_stilted_granaries_02_desc: "แถวของยุ้งฉางยกพื้นพร้อมที่กันหนูและบันไดมีหลังคา ภาษีธัญพืชเติบโตอย่างมั่นคงขึ้นและการฟื้นตัวของไพร่พลดีขึ้น"
 building_stilted_granaries_03: "ยุ้งฉางยกพื้นแกะสลัก"
 building_stilted_granaries_03_desc: "งานแกะสลักอันทรงเกียรติบ่งบอกถึงส่วนเกิน ผู้ดูแลหมุนเวียนคลังและปันส่วนสำหรับการเดินทัพที่ยาวนานขึ้น"
 building_stilted_granaries_04: "เขตยุ้งฉาง"
 building_stilted_granaries_04_desc: "กลุ่มอาคารมีรั้วล้อมพร้อมที่พักยามและโรงนับสต็อก ความมั่นคงทางอาหาร ทำให้ทั้งเคาน์ตีมั่นคง"
 
 building_type_kora_kora_yards_01: "อู่เรือโกระ-โกระ"
 building_type_kora_kora_yards_01_desc: "โรงเก็บเรือแคนูของตระกูลและคานเรือสำหรับเรือแคนูศึกติดแขนค้ำ"
 building_kora_kora_yards_01: "โรงเก็บเรือแคนู"
 building_kora_kora_yards_01_desc: "คานเรือมีหลังคาสำหรับเรือติดแขนค้ำแบบพาย ลูกเรือฝึกซ้อมเพื่อบุกปล้นชายฝั่งและเดินทางระหว่างเกาะ"
 building_kora_kora_yards_02: "อู่เรือตระกูล"
 building_kora_kora_yards_02_desc: "กองไม้ ซุง เชือกเถาวัลย์ และแขนค้ำสำรองช่วยเร่งการกลับลำเรือ นักปล้นนำถ้วยรางวัลและสินค้าแลกเปลี่ยนกลับมา"
 building_kora_kora_yards_03: "อู่เรือโกระ-โกระ"
 building_kora_kora_yards_03_desc: "ลำเรือที่ใหญ่ขึ้น แท่นต่อสู้ และกลองสัญญาณ การลาดตระเวนชายฝั่งและการเดินทางตามฤดูกาลกลายเป็นจังหวะของชีวิต (และรายได้)"
 building_kora_kora_yards_04: "คลังแสงเรือแคนูศึกขนาดใหญ่"
 building_kora_kora_yards_04_desc: "นายอู่ต่อเรือติดตั้งอุปกรณ์ให้กองเรือทั้งกอง ทางลาดปล่อยเรือ ห้องเก็บเชือก และแท่นรวมพลสร้างความหวาดกลัวให้เพื่อนบ้าน"
 
 building_type_idjang_forts_01: "ป้อมอิดจัง"
 building_type_idjang_forts_01_desc: "ปราการชนเผ่าแบบขั้นบันได จุดยุทธศาสตร์บนสันเขาหรือเนินดิน"
 building_idjang_forts_01: "อิดจังล้อมรั้ว"
 building_idjang_forts_01_desc: "รั้วไม้ซุงล้อมรอบที่สูงที่ป้องกันได้ กองไฟยามและคูน้ำแห้งช่วยป้องปรามผู้บุกรุก"
 building_idjang_forts_02: "อิดจังกำแพงหิน"
 building_idjang_forts_02_desc: "กำแพงหินเศษแทนที่ไม้ในด้านสำคัญ ทางเดินมีหลังคาช่วยให้ผู้ป้องกันเคลื่อนย้ายได้อย่างปลอดภัย"
 building_idjang_forts_03: "อิดจังขั้นบันได"
 building_idjang_forts_03_desc: "ทางเข้าแบบขั้นบันได บันไดตีฝ่า และแท่นยิงสร้างมุมสังหารสำหรับลูกธนูและหอก"
 building_idjang_forts_04: "ปราการอิดจัง"
 building_idjang_forts_04_desc: "ป้อมประตู ป้อมชั้นใน และถังเก็บน้ำ กองทหารรักษาการณ์สามารถยึดที่มั่นได้นานหลายฤดูกาล"
 
 building_type_wantilan_01: "วันติลัน"
 building_type_wantilan_01_desc: "โถงขนาดใหญ่ไร้ผนังและศาลาชุมชนสำหรับประชุม ทำพิธี และจัดการแสดง"
 building_wantilan_01: "วันติลันขนาดเล็ก"
 building_wantilan_01_desc: "ศาลาหมู่บ้านเป็นเจ้าภาพจัดการชุมนุม กล่าวคำสาบาน และซ้อมรบ ผู้อาวุโสไกล่เกลี่ยความบาดหมางก่อนที่จะลุกลาม"
 building_wantilan_02: "ศาลาวันติลัน"
 building_wantilan_02_desc: "โถงกว้างหลังคาหลายชั้นใช้จัดงานเทศกาลและพิธีรับเข้า ซึ่งพิธีกรรมร่วมกันช่วยยกระดับขวัญกำลังใจและเกียรติภูมิ"
 building_wantilan_03: "วันติลันวิหาร"
 building_wantilan_03_desc: "พื้นที่ประกอบพิธีกรรมที่เชื่อมโยงกับสถานศักดิ์สิทธิ์ในท้องถิ่น พร้อมพื้นที่กว้างขวางสำหรับเครื่องบูชาและขบวนแห่"
 building_wantilan_04: "วันติลันขนาดใหญ่"
 building_wantilan_04_desc: "เวทีสำคัญที่กลอง นักเต้น และแม่ทัพอยู่ร่วมชายคาเดียวกัน"
 
 building_type_military_academy_01:0 "โรงเรียนทหาร"
 building_type_military_academy_01_desc:0 "สิ่งอำนวยความสะดวกเฉพาะสำหรับการฝึกนายทหารและอัศวิน เพิ่มประสิทธิภาพในการรบ"
 building_military_academy_01:0 "โรงเรียนนายร้อย"
 building_military_academy_01_desc:0 "ผู้ที่ต้องการเป็นนายทหารจะได้รับการคัดเลือกตามคุณธรรมในโรงเรียนนายร้อย โดยธรรมชาติแล้ว โรงเรียนรับเฉพาะนักเรียนที่มีเชื้อสายขุนนางเท่านั้น"
 building_military_academy_02:0 "โรงเรียนเสนาธิการ"
 building_military_academy_02_desc:1 "นายทหารระดับกลางถึงสูงได้รับการฝึกฝนที่นี่ ที่ ซึ่งพวกเขาได้รับความเข้าใจที่มากขึ้นเกี่ยวกับการเคลื่อนพล การเตรียมสนามรบ และสภาพสนามรบ"
 building_military_academy_03:0 "โรงเรียนนายร้อยชั้นสูง"
 building_military_academy_03_desc:2 "โรงเรียนนายร้อยชั้นสูงเป็นหัวใจสำคัญของกลไกทางทหารขั้นสูง นายทหารที่ฝึกที่นี่เรียนรู้ทั้งหมดเกี่ยวกับกลยุทธ์ภาคสนาม การจัดกองทัพ และความก้าวหน้าทางเทคโนโลยีล่าสุดในการสงคราม"
 
 building_type_march_01:0 "เขตชายแดน"
 building_type_march_01_desc:0 "เจ้าเมืองชายแดนปกป้องพรมแดนด้วยป้อมปราการและกองทหารรักษาการณ์ท้องถิ่น"
 marches_effect_desc: "ลดทอนโอกาสสำหรับ [raid_intents|E] พิเศษ"
 marches_effect_2_desc: "ยับยั้ง [raid_intents|E] พิเศษ"
 building_march_01:0 "เขตชายแดนยุทธศาสตร์"
 building_march_01_desc:0 "เขตชายแดนถูกสร้างขึ้นในพื้นที่ที่เปราะบางและห่างไกลที่สุดของดัชชี เพื่อป้องกันการโจมตี แม้จะมีน้อยและอยู่ห่างไกลกัน แต่ก็ทำหน้าที่เป็นระบบเตือนภัยที่มีประโยชน์ และยังจับผู้ลักลอบขนของเถื่อนเป็นครั้งคราวได้อีกด้วย"
 building_march_02:0 "เขตชายแดน"
 building_march_02_desc:1 "ระบบเจ้าเมืองชายแดนถูกขยายไปตามแนวพรมแดนทั้งหมด ให้แนวป้องกันที่แข็งแกร่ง"
 building_march_03:0 "เขตชายแดนใหญ่"
 building_march_03_desc:0 "ป้อมปราการชายแดนขนาดใหญ่ถูกสร้างขึ้นทั่วทั้งดัชชี ขัดขวางกองกำลังโจมตีใด ๆ อย่างมาก"
 
 building_type_siege_works_01:0 "โรงสรรพาวุธ"
 building_type_siege_works_01_desc:0 "โรงสรรพาวุธเฉพาะช่วยให้ผู้ปกครองสามารถนำอาวุธล้อมเมืองคุณภาพสูงออกสู่สนามรบและบำรุงรักษาได้"
 building_siege_works_01:0 "โรงช่างสรรพาวุธ"
 building_siege_works_01_desc:1 "โรงช่างสรรพาวุธช่วยให้มีการไหลเวียนของอาวุธล้อมเมืองที่รวดเร็วและต่อเนื่องมากขึ้นผ่านขั้นตอนการสร้างเฉพาะทางและเป็นมาตรฐาน"
 building_siege_works_02:0 "วิศวกรเครื่องยิงหิน"
 building_siege_works_02_desc:1 "จำเป็นต้องใช้วิศวกรเฉพาะทางเพื่อนำอาวุธที่ทันสมัยที่สุดในการสงครามล้อมเมืองออกสู่สนามรบ: เครื่องยิงหิน (เทรบูเชต์)"
 building_siege_works_03:0 "โรงหล่อปืนใหญ่"
 building_siege_works_03_desc:1 "ปืนใหญ่เป็นอาวุธล่าสุดที่ปรากฏในฉากสงคราม เสียงดัง หนัก และเคลื่อนย้ายยาก แต่ถึงกระนั้นก็อันตรายถึงชีวิตต่อป้อมปราการหิน การสามารถผลิตและนำปืนใหญ่ออกสู่สนามรบ ทำให้เราได้เปรียบอย่างไม่อาจโต้แย้งได้เมื่อเทียบกับศัตรูของเรา"
 
 building_type_royal_armory_01:0 "คลังอาวุธหลวง"
 building_type_royal_armory_01_desc:2 "คลังอาวุธที่ได้รับทุนสนับสนุนจากราชสำนักรับประกันการจัดหาและบำรุงรักษาอาวุธที่ใช้งานได้สำหรับกองทัพอย่างสม่ำเสมอ"
 building_royal_armory_01:0 "คลังอาวุธ"
 building_royal_armory_01_desc:1 "ในยามสงคราม ไพร่พลสามารถได้รับอาวุธจากคลัง ส่วนใหญ่เป็นขวานเก่าขึ้นสนิม หอกแตกปลาย และดาบทื่อ แต่ด้วยการบำรุงรักษาเล็กน้อย พวกมันก็สามารถมีประสิทธิภาพมากกว่าเครื่องมือทำฟาร์มทั่วไปที่ไพร่พลมักติดอาวุธมาได้อย่างง่ายดาย"
 building_royal_armory_02:0 "คลังแสงหลวง"
 building_royal_armory_02_desc:1 "คลังแสงที่ดำเนินการโดยราชสำนักรวบรวมและบำรุงรักษาอาวุธและชุดเกราะสำหรับใช้ในสงคราม สิ่งเหล่านี้มีคุณภาพดีพอสมควร และสามารถ ทำให้คนขี้เมาจรจัดดูเหมือนทหารที่เหมาะสมได้ แม้ว่าจะไม่ได้ทำตัวเหมือนก็ตาม"
 building_royal_armory_03:0 "พระคลังสรรพาวุธ"
 building_royal_armory_03_desc:1 "พระคลังสรรพาวุธเป็นที่เก็บและบำรุงรักษาอาวุธจำนวนมหาศาล เพียงพอที่จะส่งไพร่พลนับไม่ถ้วนออกสู่สนามรบในเวลาอันสั้นและดึงดูดทหารรับจ้างที่ดีที่สุดในดินแดน"
 
 building_type_jousting_lists_01:0 "ลานประลองทวน"
 building_type_jousting_lists_01_desc:0 "ด้วยการมีลานเฉพาะสำหรับการประลองทวน ทำให้มีผู้ขี่ม้าและอัศวินมากขึ้นได้รับการสนับสนุนให้ฝึกฝนและเข้าร่วมกองทัพ"
 building_jousting_lists_01:0 "สนามประลองทวน"
 building_jousting_lists_01_desc:0 "พื้นที่โล่งถูกเปิดไว้ตลอดทั้งปีเพื่ออำนวยความสะดวกในการฝึกฝนผู้ขี่ม้าและอัศวิน"
 building_jousting_lists_02:0 "ลานประลองยุทธ์"
 building_jousting_lists_02_desc:0 "ด้วยลานประลองทวนและอัฒจันทร์สำหรับสาธารณชน ลานประลองยุทธ์เหล่านี้ดึงดูดผู้เข้าแข่งขันจำนวนมหาศาล"
 building_jousting_lists_03:0 "สนามประลองยุทธ์หลวง"
 building_jousting_lists_03_desc:0 "ปรับปรุงด้วยที่นั่งสำหรับแขกของราชวงศ์และลานจัดงานที่ใหญ่ขึ้น สนามประลองยุทธ์น่าประทับใจอย่างแท้จริง"
 
 building_type_blacksmiths_01:1 "โรงตีเหล็กหลวง"
 building_type_blacksmiths_01_desc:0 "ช่างตีเหล็กที่ได้รับการว่าจ้างจากราชสำนักตีอาวุธและชุดเกราะสำหรับราชองครักษ์ รับประกันการจัดหาอาวุธยุทโธปกรณ์ที่เหนือกว่าอย่างสม่ำเสมอ"
 building_blacksmiths_01:1 "ช่างตีเหล็กหลวง"
 building_blacksmiths_01_desc:1 "ช่างตีเหล็กที่ดีที่สุดและมีประสิทธิผลที่สุดได้รับการว่าจ้างจากราชสำนักและได้รับมอบหมายให้ผลิตดาบ เกราะโซ่ และหอกสำหรับราชองครักษ์"
 building_blacksmiths_02:0 "สมาคมช่างตีเหล็ก"
 building_blacksmiths_02_desc:0 "ด้วยการร่วมมือกับสมาคมต่าง ๆ สามารถผลิตอุปกรณ์จำนวนมากในราคาถูกตามคำสั่งซื้อได้"
 building_blacksmiths_03:0 "เตาหลอมหลวง"
 building_blacksmiths_03_desc:0 "เตาหลอมขนาดใหญ่ถูกสร้างขึ้นเพื่อจุดประสงค์เดียวในการจัดหาอาวุธให้กับราชสำนัก มีเพียงช่างตีเหล็กที่ดีที่สุดเท่านั้นที่ได้รับการว่าจ้างให้ทำงานในนั้น"
 
 building_type_archery_ranges_01:0 "ลานยิงธนู"
 building_type_archery_ranges_01_desc:0 "ลานยิงธนูเฉพาะช่วยให้คนทั่วไปสามารถฝึกฝนด้วยคันธนู และพลธนูผู้มีประสบการณ์สามารถฝึกฝนทักษะของตนได้"
 building_archery_ranges_01:0 "สนามยิงธนู"
 building_archery_ranges_01_desc:0 "ทุกคนยินดีต้อนรับที่สนามยิงธนู ไม่ว่าคุณจะร่ำรวยหรือยากจน เหตุผลมีสองประการ ชาวนาที่สามารถยิงธนูได้มีประโยชน์มากกว่าในสงคราม และพลแม่นปืนที่มีประสบการณ์จะรักษาฟอร์มสูงสุดไว้ได้เมื่อพวกเขาสามารถแข่งขันในทัวร์นาเมนต์ได้"
 building_archery_ranges_02:0 "ช่างทำคันธนูหลวง"
 building_archery_ranges_02_desc:1 "ช่างทำคันธนูที่ดีที่สุดได้รับการว่าจ้างจากราชสำนัก และได้รับมอบหมายให้สร้างคันธนูคุณภาพสูงสุดเท่าที่จะทำได้ในโรงงานที่สร้างขึ้นเพื่อการนี้โดยเฉพาะ"
 building_archery_ranges_03:0 "สนามยิงเป้าแม่น"
 building_archery_ranges_03_desc:0 "เพื่อสร้างแรงบันดาลใจให้ชาวนาและให้ความท้าทายที่เพียงพอสำหรับพลแม่นปืนของเรา สนามยิงพิเศษเหล่านี้ได้รับการออกแบบมาเพื่อฝึกพลธนูของเราในการยิงธนูระยะไกล"
 
 building_type_tax_assessor_01:0 "สำนักงานภาษี"
 building_type_tax_assessor_01_desc:0 "การเก็บเงินจากชาวนาเป็นกิจการที่ 'เก็บภาษี' (taxing) ด้วยการมอบหมายสำนักงานให้กับกลุ่มเจ้าหน้าที่เก็บภาษี เรามั่นใจว่าจะได้รับสิ่งที่ถึงกำหนด!"
 building_tax_assessor_01:0 "ผู้ประเมินภาษี"
 building_tax_assessor_01_desc:0 "เป็นหน้าที่ของชาวนาทุกคนที่จะต้องจ่ายภาษีตามสัดส่วนเป็นเหรียญหรือผลผลิตให้กับราชสำนัก ผู้ประเมินภาษีของเรารับประกันว่าสิ่งที่พวกเขาจ่ายนั้น 'ตามสัดส่วน' เพียงพอสำหรับความต้องการของเรา และโชคดีสำหรับเราที่ชาวนาส่วนใหญ่ไม่รู้หนังสือ"
 building_tax_assessor_02:0 "สำนักงานปลัดอำเภอ"
 building_tax_assessor_02_desc:0 "วิธีที่ยอดเยี่ยมในการ ทำให้แน่ใจว่าชาวนาจ่ายภาษีคือการขู่ว่าจะถูกโยนเข้าคุกใต้ดินหากไม่จ่าย นี่คือหน้าที่ของปลัดอำเภอ ผู้ ซึ่งอยู่ข้าง #emphasis เรา#! เสมอ!"
 building_tax_assessor_03:0 "ศาลแขวง"
 building_tax_assessor_03_desc:0 "แม้ว่าชาวนาอาจจะเก็บภาษีได้ง่าย แต่เจ้าของที่ดินที่ร่ำรวยกว่านั้นยากที่จะบังคับ ด้วยการสร้างเครือข่ายการบริหารที่ซับซ้อน ซึ่งดำเนินการโดยผู้พิพากษาที่ภักดี เราสามารถรับประกันได้ว่าแม้ แต่ราษฎรที่ร่ำรวยที่สุดของเราก็จ่ายค่าธรรมเนียมของตน"
 
 building_type_leisure_palace_01:0 "วังพักผ่อน"
 building_type_leisure_palace_01_desc:0 "แม้ว่าการอยู่ในปราสาทที่หรูหราฟุ่มเฟือยหลังเดียวก็ดี แต่การมีเพิ่มอีกสองสามหลังให้เลือกก็ไม่เสียหาย"
 building_leisure_palace_01:0 "ชาโต"
 building_leisure_palace_01_desc:0 "เมื่อภาระความรับผิดชอบหนักเกินไป (หรือฝูงชนชาวนาที่โกรธแค้นกำลังบุกประตู) ไม่มีที่ใดเหมือนชาโตในชนบทที่ห่างไกลสำหรับการพักผ่อนหย่อนใจอย่างกะทันหัน!"
 building_leisure_palace_02:0 "พระราชวังฤดูร้อน"
 building_leisure_palace_02_desc:0 "พระราชวังฤดูร้อนตั้งอยู่ในส่วนที่สวยงามของดัชชี ห่างไกลจากชีวิตประจำวันของราษฎรที่ตรากตรำทำงานของเรา ไม่มีวิธีใดที่ดีไปกว่าการแสดงอำนาจและเกียรติภูมิของราชวงศ์ และข้อเท็จจริงง่าย ๆ ที่ว่าเรา #emphasis ดีกว่า#! ทุกคน"
 building_leisure_palace_03:0 "พระราชวังฤดูหนาว"
 building_leisure_palace_03_desc:0 "พระราชวังฤดูหนาวได้รับการออกแบบมาเพื่อเป็นที่ประทับของราชวงศ์ในช่วงเดือนที่รุนแรงของปี ด้วยห้องเก็บอาหารที่ stocked อย่างดีและตำแหน่งที่ป้องกันได้ มันตั้งตระหง่านเหนือราษฎรที่หนาวสั่น ซึ่งมีสิทธิพิเศษในการทำงานในบริเวณใกล้เคียง"
 
 building_type_royal_forest_01:0 "ป่าสงวนหลวง"
 building_type_royal_forest_01_desc:0 "ป่าหลวงเป็นแหล่งความมั่งคั่งอันล้ำค่า ช่วยให้คุณสามารถยกเลิกกฎหมายของแผ่นดินในจังหวัด เพิกถอนสิทธิ์จากคนท้องถิ่น แล้วขายคืนให้พวกเขา ไม่ต้องบอกก็รู้ว่าการล่าสัตว์ก็ยอดเยี่ยม เช่นกัน"
 building_royal_forest_01:0 "ป่าหลวง"
 building_royal_forest_01_desc:0 "พื้นที่ป่าขนาดใหญ่ในดัชชีนี้สงวนไว้สำหรับใช้โดยราชวงศ์ ห้ามชาวนาอาศัยอยู่ในป่า ล่าสัตว์ใด ๆ ในนั้น หรือถางต้นไม้เพื่อการเกษตร ห้ามโจมตีผู้ประเมินภาษีของราชสำนักโดยเฉพาะขณะที่พวกเขากำลังผ่านไป"
 building_royal_forest_02:0 "ป่าหลวงอันกว้างใหญ่"
 building_royal_forest_02_desc:0 "บัดนี้เมืองทั้งเมืองถูกรวมเข้ากับป่าหลวงแห่งนี้ และการตั้งถิ่นฐานในบริเวณใกล้เคียงมักพบว่าคนของกษัตริย์ได้ 'ค้นพบ' แผนที่ที่ระบุตำแหน่งที่อยู่อาศัยของตนอย่างมั่นคงภายในป่าหลวงท้องถิ่น"
 building_royal_forest_03:0 "ศาลป่าหลวง"
 building_royal_forest_03_desc:0 "กฎหมายจะดีได้ก็ต่อเมื่อมีระบบสนับสนุน และบัดนี้ป่าหลวงแห่งนี้มีระบบศาล ผู้ดูแล และเสมียนทั้งหมด ซึ่งได้รับการสนับสนุนจากผู้พิพากษาที่ผ่านการฝึกอบรม พร้อมที่จะบังคับใช้คำสั่งของราชสำนัก"
 
 building_type_royal_garden_01:0 "อุทยานหลวง"
 building_type_royal_garden_01_desc:0 "มีสถานที่ไม่กี่แห่งที่ช่วยให้ผู้คนผ่อนคลายและสังสรรค์ได้ดีเท่ากับสวนสวย แม้ว่าสวนเล็ก ๆ ส่วนตัวจะเพียงพอสำหรับคนส่วนใหญ่ แต่มีเพียงการสร้างสรรค์ที่งดงามที่สุดเท่านั้นที่ดีพอสำหรับผู้มั่งคั่งและมีอำนาจ!"
 building_royal_garden_01:0 "สวนปิดล้อม"
 building_royal_garden_01_desc:0 "สวนเล็ก ๆ ที่ล้อมรอบด้วยกำแพงหิน เป็นสวรรค์แห่งความสงบสุขและความสะดวกสบายเล็ก ๆ โดยการปิดกั้นโลกที่วุ่นวายภายนอก"
 building_royal_garden_02:0 "ศูนย์รวมสวน"
 building_royal_garden_02_desc:0 "สวนที่กว้างขวางและน่าประทับใจ ซึ่งมีทั้งดอกไม้ สมุนไพร ไม้ผล และทุกสิ่งในระหว่างนั้น ดูแลโดยคนสวนจำนวนมาก สวนอยู่ภายใต้การดูแลอย่างต่อเนื่อง"
 building_royal_garden_03:0 "อุทยานหลวง"
 building_royal_garden_03_desc:0 "อุทยานหลวงเป็นภูมิทัศน์ที่กว้างใหญ่และน่าทึ่ง ซึ่งสร้างขึ้นอย่างระมัดระวังให้เข้ากับภูมิประเทศและสถาปัตยกรรมโดยรอบ เปิดกว้างและพร้อมใช้งานสำหรับทุกคน นำความประทับใจมาสู่ผู้มาเยือนจากแดนไกล"
 
 building_type_ananda_temple_01:0 "วัดอนันดา"
 building_type_ananda_temple_01_desc:0 "แม้ว่าพุกามจะมีเจดีย์ วัด และศาลเจ้าหลายพันแห่งกระจัดกระจายอยู่ทั่วเมืองและที่ราบโดยรอบ แต่วัดอนันดาก็ตั้งตระหง่านเป็นความสำเร็จสูงสุดในหมู่พวกนั้น โครงสร้างที่สมส่วนอย่างสมบูรณ์แบบมีแผ่นจารึกและรูปหินที่เป็นเอกลักษณ์มากมาย เป็นสถานที่สักการะบูชาและศูนย์กลางการเรียนรู้เพื่อการศึกษาผู้คนในหลักธรรมทางศาสนา"
 building_ananda_temple_01:0 "$building_type_ananda_temple_01$"
 building_ananda_temple_01_desc:0 "$building_type_ananda_temple_01_desc$"
 
 building_type_hotin_fort_01:0 "ป้อมปราการโฮติน"
