 building_type_taghaza_mines_01:0 "แอ่งเกลือทาฆาซา"
 building_type_taghaza_mines_01_desc:0 "เหมืองเกลือทาฆาซาเป็นจุดกำเนิดของเกลือส่วนใหญ่ในมักเริบและแอฟริกาตะวันตก"
