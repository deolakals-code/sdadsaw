 building_type_generic_gold_mines_01: "เหมืองทองคำ"
 building_type_generic_gold_mines_01_desc: "เหมืองทองคำที่หายากและมีค่าอย่างเหลือเชื่อ เป็นที่ต้องการอย่างสูงจากขุนนางทุกคนในภูมิภาค"
