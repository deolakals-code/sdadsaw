 building_type_pastures_01:3 "ทุ่งเลี้ยงปศุสัตว์"
 building_type_pastures_01_desc:1 "พื้นที่ส่วนสำคัญของจังหวัดนี้อุทิศให้กับการเลี้ยงสัตว์และใช้เป็นทุ่งหญ้าสำหรับฝูงสัตว์เลี้ยง"
 building_pastures_01:1 "ทุ่งหญ้าธรรมดา"
 building_pastures_01_desc:1 "ทุ่งหญ้าถูกใช้โดยชาวบ้านในท้องถิ่นเพื่อเลี้ยงสัตว์ขนาดเล็ก เช่น แกะ หรือ แพะ"
 building_pastures_02:1 "เรือนไร่นา"
 building_pastures_02_desc:1 "เรือนไร่นาเป็นที่อยู่อาศัยของชาวนาไพร่ ผู้ ซึ่งปลูกธัญพืชและเลี้ยงสัตว์ไว้ใช้เอง"
 building_pastures_03:1 "ทุ่งหญ้าเลี้ยงสัตว์"
 building_pastures_03_desc:1 "ทุ่งหญ้าเลี้ยงสัตว์ใช้ทั้งสำหรับปล่อยสัตว์กินหญ้าและผลิตหญ้าแห้งสำหรับช่วงเวลาที่ยากลำบาก"
 building_pastures_04:1 "เล้าสัตว์ปีก"
 building_pastures_04_desc:1 "เล้าสัตว์ปีกเป็นที่อยู่ของสัตว์ปีกที่เลี้ยงง่าย ซึ่งมีค่าทั้งไข่และเนื้อ"
 building_pastures_05:1 "คอกปศุสัตว์"
 building_pastures_05_desc:1 "คอกปศุสัตว์มีความแข็งแรงพอที่จะกักขังสัตว์ขนาดใหญ่ให้อยู่ในพื้นที่และปลอดภัย"
 building_pastures_06:1 "โรงเลี้ยงผึ้ง"
 building_pastures_06_desc:1 "ระหว่างผืนป่าและทุ่งนา ผึ้งที่เลี้ยงในโรงเลี้ยงผึ้งผลิตน้ำผึ้งอันเป็นที่ต้องการอย่างมาก"
 building_pastures_07:1 "คอกม้า"
 building_pastures_07_desc:2 "คอกม้าขนาดใหญ่เป็นที่อยู่ของม้าและสัตว์ใช้งานอื่น ๆ ทำให้พวกมันปลอดภัยและมีความสุข"
 building_pastures_08:1 "ฟาร์มปศุสัตว์ขนาดใหญ่"
 building_pastures_08_desc:2 "ฟาร์มปศุสัตว์เหมาะอย่างยิ่งสำหรับเลี้ยงฝูงวัวควายขนาดใหญ่ เนื่องจากมีทุ่งหญ้ากว้างขวางและพื้นที่เคลื่อนไหวเหลือเฟือ"
 
 building_type_orchards_01:0 "สวนผลไม้"
 building_type_orchards_01_desc:1 "ด้วยคุณสมบัติอันเป็นเอกลักษณ์ของดิน สวนผลไม้เหล่านี้จึงผลิตผลไม้และเบอร์รี่ที่หวานอร่อยเป็นพิเศษ"
 building_orchards_01:1 "สวนผลไม้"
 building_orchards_01_desc:2 "สวนผลไม้เฉพาะทาง แม้จะมีขนาดเล็ก แต่ให้ผลผลิตที่อุดมสมบูรณ์และมีคุณภาพสูงกว่า"
 building_orchards_02:1 "พุ่มเบอร์รี่"
 building_orchards_02_desc:1 "แถวพุ่มเบอร์รี่ช่วยทำลายความจำเจของต้นไม้ผล"
 building_orchards_03:1 "สวนปลูกไม้ผล"
 building_orchards_03_desc:1 "พื้นที่ขนาดใหญ่ที่เว้นระยะห่างอย่างเป็นระเบียบ เต็มไปด้วยต้นไม้ที่ได้รับการตัด แต่งกิ่งอย่างดี ทั้งหมดให้ผลหรือถั่ว"
 building_orchards_04:1 "โรงเลี้ยงผึ้ง"
 building_orchards_04_desc:2 "การวางโรงเลี้ยงผึ้งแทรกอยู่ระหว่างต้นไม้ช่วยให้ได้ผลผลิตน้ำผึ้งและ ทำให้สวนผลไม้ทั้งหมดยิ่งมีผลิตผลมากขึ้น"
 building_orchards_05:1 "แถวต้นถั่วเปลือกแข็ง"
 building_orchards_05_desc:1 "นอกเหนือจากต้นไม้ผลแล้ว แถวต้นถั่วเปลือกแข็งยังทอดยาวไปไกลสุดสายตา"
 building_orchards_06:1 "สวนผสม"
 building_orchards_06_desc:1 "ต้นไม้ทุกชนิด ทั้งพันธุ์ท้องถิ่นและนำเข้า ถูกกระจายปลูกอยู่ภายในสวน — รับประกันผลผลิตที่อุดมสมบูรณ์ไม่ว่าในสถานการณ์ใด"
 building_orchards_07:1 "สวนผลไม้ใหญ่"
 building_orchards_07_desc:1 "สุดลูกหูลูกตา มี แต่แถวต้นไม้ผลเรียงราย"
 building_orchards_08:1 "ต้นไม้ต่อกิ่ง"
 building_orchards_08_desc:1 "ด้วยการต่อกิ่งต้นไม้บางชนิดเข้าด้วยกัน การขยายพันธุ์ผลไม้และถั่วเปลือกแข็งที่เติบโตช้าจะได้รับการส่งเสริมอย่างมาก"
 
 building_type_farm_estates_01:1 "คฤหาสน์เจ้าที่ดิน"
 building_type_farm_estates_01_desc:2 "เจ้าขุนมูลนายแห่งคฤหาสน์จ้างไพร่หลายร้อยคนเพื่อไถนาและดูแลปศุสัตว์ ยิ่งพวกเขามีอำนาจมากเท่าใด ไพร่ฟ้าข้าแผ่นดินก็ยิ่งสามารถเพาะปลูกที่ดินได้มากขึ้นเท่านั้น และที่สำคัญที่สุดคือ ยิ่งสร้างภาษีได้มากขึ้น"
 building_farm_estates_01:1 "คฤหาสน์"
 building_farm_estates_01_desc:1 "คฤหาสน์เป็นที่พำนักของตระกูลเจ้าของที่ดิน เหล่าคนรับใช้ และไพร่ที่ทำงานในที่นาของพวกเขา"
 building_farm_estates_02:1 "สวนและแปลงผัก"
 building_farm_estates_02_desc:1 "ติดกับคฤหาสน์คือสวนขนาดใหญ่และแปลงผักที่สุกงอม ทำให้สามารถพึ่งพาตนเองได้อย่างแท้จริง"
 building_farm_estates_03:1 "ที่ดินเกษตรกรรม"
 building_farm_estates_03_desc:1 "ที่ดินเกษตรกรรมมีอำนาจเหนือทุ่งนา ป่าไม้ และอาคารประกอบที่อยู่รายรอบ"
 building_farm_estates_04:1 "ทุ่งนาร้อยเอเคอร์"
 building_farm_estates_04_desc:1 "ทุ่งนาขนาดมหึมาร้อยเอเคอร์จ้างไพร่จำนวนมาก และนำความมั่งคั่งมหาศาลมาสู่ตระกูลที่เป็นเจ้าของที่ดิน"
 building_farm_estates_05:1 "ที่ดินกรรมสิทธิ์อิสระ"
 building_farm_estates_05_desc:1 "ที่ดินกรรมสิทธิ์อิสระมีขนาดมหึมา พร้อมด้วยที่ดินกว้างใหญ่ล้อมรอบ — เนื่องจากสืบทอดกันทางสายเลือด ตระกูลที่พำนักจึงมีเวลาเหลือเฟือที่จะปรับปรุงผลผลิตจากที่ดินของตนให้ได้สูงสุด"
 building_farm_estates_06:1 "กังหันลม"
 building_farm_estates_06_desc:1 "กังหันลมช่วยลดภาระงานส่วนใหญ่ในการโม่แป้ง เพิ่มประสิทธิภาพอย่างมหาศาล"
 building_farm_estates_07:1 "การรวบรวมที่ดินถือครอง"
 building_farm_estates_07_desc:2 "ตระกูลที่มั่งคั่งกว่าซื้อที่ดินจากตระกูลที่ยากจนกว่า รวบรวมทรัพย์สินของตนเข้าเป็นที่ดินอันกว้างใหญ่ไพศาล ทั้งหมดทำงานภายใต้การนำเดียวกัน และที่สำคัญกว่านั้นคือ ชำระภาษีร่วมกัน"
 building_farm_estates_08:1 "มหาคฤหาสน์"
 building_farm_estates_08_desc:1 "ที่ดินอันกว้างใหญ่ในขนาดที่ไม่ค่อยพบเห็น อาคารอันยิ่งใหญ่เหล่านี้สามารถดูแลครัวเรือนได้หลายพันคน"
 farm_estates_3_4_trigger: "ต้องการหนึ่งในเงื่อนไขต่อไปนี้:\n$EFFECT_LIST_BULLET$[culture|E] ของ [holder_possessive|E] มี [innovation|E] #V $innovation_manorialism$#! และ [province|E] นี้เป็น [GetTerrain( 'farmlands' ).GetName] และมี [holding|E] ระดับ 2\n$EFFECT_LIST_BULLET$[culture|E] ของ [holder_possessive|E] มี [tradition|E] [GetCultureTradition('tradition_pastoralists').GetName|V] และ [province|E] นี้มี [building|E] [GetBuilding('pastures_04').GetName]\n$EFFECT_LIST_BULLET$[culture|E] ของ [holder_possessive|E] มี [innovations|E] #V $innovation_manorialism$#! และ #V $innovation_champa_rice$#!, [province|E] นี้มี [holding|E] ระดับ 2 และเข้าถึงสายการผลิต [buildings|E] [GetBuilding('paddy_fields_01').GetName]"

 building_type_regimental_grounds_01:0 "ลานฝึกกรมกอง"
 building_type_regimental_grounds_01_desc:1 "ลานฝึกกรมกองไม่เพียง แต่ประกอบด้วยอาคารหลายหลังที่ออกแบบมาเพื่อรองรับไพร่พลจำนวนมาก แต่ยังเชื่อมต่อกับผืนดินอันกว้างใหญ่ เพื่อให้พวกเขาฝึกฝนการสงคราม"
 building_regimental_grounds_01:1 "ที่โล่งกรมกอง"
 building_regimental_grounds_01_desc:1 "ผืนดินขนาดใหญ่ถูกเตรียมไว้สำหรับการมาถึงของไพร่พล มีพื้นที่กว้างขวางสำหรับกางกระโจมและฝึกซ้อม"
 building_regimental_grounds_02:1 "สำนักงานพลาธิการ"
 building_regimental_grounds_02_desc:1 "สำนักงานพลาธิการเป็นที่ทำงานของเจ้าหน้าที่ธุรการ ผู้ ซึ่งดูแลให้ไพร่พล แต่ละนายมีที่อยู่ ที่นอน และอาวุธสำหรับชี้ไปยังศัตรู"
 building_regimental_grounds_03:1 "ที่พักกึ่งถาวร"
 building_regimental_grounds_03_desc: "โรงทหารไม้นั้นไม่ทนทานนัก แต่ก็ช่วยให้ไพร่พลในท้องถิ่นแห้งและอบอุ่น — ส่วนใหญ่"
 building_regimental_grounds_04:1 "โรงทหารกรมกอง"
 building_regimental_grounds_04_desc:2 "โรงทหารหินอันแข็งแรงเรียงรายอยู่ริมขอบของลานฝึกทหารโดยเฉพาะ สามารถเตรียมไพร่พลจำนวนมหาศาลได้อย่างแท้จริงที่นี่"
 building_regimental_grounds_05:1 "ฉางหลวงทหาร"
 building_regimental_grounds_05_desc:1 "ฉางหลวงสำหรับเลี้ยงดูไพร่พลเตรียมพร้อมตลอดทั้งปี ทำให้การระดมพลแทบไม่ต้องใช้ความพยายามใด ๆ"
 building_regimental_grounds_06:1 "โรงตีเหล็ก"
 building_regimental_grounds_06_desc:2 "โรงตีเหล็กหลายแห่งถูกสร้างขึ้นรอบนอกของลานฝึก สนับสนุนไพร่พลด้วยอาวุธและการซ่อมแซม"
 building_regimental_grounds_07:2 "เรือนพักนายทหาร"
 building_regimental_grounds_07_desc: "เรือนพักนายทหารถูกสร้างขึ้นด้วยมาตรฐานที่สูงกว่าโรงทหารทั่วไป ทั้งเพื่อเป็นการยอมรับในความกล้าหาญของนายทหารและเป็นเป้าหมายที่เหล่าทหารควรใฝ่ฝันที่จะไปให้ถึง"
 building_regimental_grounds_08:1 "ลานฝึกขยาย"
 building_regimental_grounds_08_desc:0 "$building_type_regimental_grounds_01_desc$"
 
 building_type_curtain_walls_01:1 "กำแพงและหอคอย"
 building_type_curtain_walls_01_desc:1 "กำแพงหินและหอคอยป้อมปราการอันน่าเกรงขามให้การป้องกันที่ยอดเยี่ยมจากการปล้นสะดมและการล้อมเมือง ยิ่งสร้างป้อมปราการมากเท่าใด ปราสาทที่พวกมันปกป้องก็จะยิ่งแข็งแกร่งมากขึ้นเท่านั้น"
 building_curtain_walls_01:1 "ป้อมปราการและกำแพงม่าน"
 building_curtain_walls_01_desc:1 "ขั้นตอนแรกสำหรับป้อมปราการที่น่านับถือคือการสร้างป้อมปราการและกำแพงม่าน พวกมันทำหน้าที่ได้ดีในการป้องกันศัตรูและชาวบ้านที่ก่อจลาจล"
 building_curtain_walls_02:1 "ลานปราสาทชั้นนอก"
 building_curtain_walls_02_desc:2 "ลานปราสาทชั้นนอกเป็นสถานที่ที่ป้องกันได้ดีที่สุดในการจัดเก็บเสบียงสำคัญเพื่อเอาตัวรอดจากการล้อมเมือง: อาวุธ ชุดเกราะ และหัวหมูป่าดอง"
 building_curtain_walls_03:1 "หอคอยกำแพง"
 building_curtain_walls_03_desc:1 "หอคอยกำแพงทำหน้าที่เป็นจุดชมวิวที่ยอดเยี่ยม ทำให้ทหารของเราสามารถยิงโจมตีกองทัพที่กำลังเคลื่อนเข้ามาได้อย่างปลอดภัย เมื่อไม่ได้อยู่ในภาวะสงคราม พวกมันยอดเยี่ยมสำหรับการเยาะเย้ยชาวบ้านจากเบื้องบน"
 building_curtain_walls_04:1 "กำแพงม่านชั้นที่สอง"
 building_curtain_walls_04_desc:1 "การเพิ่มกำแพงม่านชั้นที่สองสร้างตำแหน่งป้องกันที่ไม่มีใครเทียบได้ หากกองทัพศัตรูสามารถฝ่ากำแพงชั้นแรกเข้ามาได้ พวกเขาจะพบกับกำแพงอีกชั้น — เพียงพอที่จะ ทำให้ผู้โจมตีเสียขวัญ!"
 building_curtain_walls_05:1 "ซวิงเงอร์"
 building_curtain_walls_05_desc:1 "เมื่อกองทัพศัตรูสามารถฝ่ากำแพงชั้นนอกเข้ามาได้ พวกเขาจะถูกต้อนเข้าไปใน 'ซวิงเงอร์' โดยไม่รู้ตัว — หรือที่รู้จักกันในนาม #emphasis ลานสังหาร#! ช่างหลักแหลมเสียจริง!"
 building_curtain_walls_06:1 "ลานปราสาทชั้นนอกเพิ่มเติม"
 building_curtain_walls_06_desc:1 "กำแพงที่มากขึ้นหมายถึงลานปราสาทชั้นนอกที่มากขึ้น และโดยนัยยะคือ การจัดเก็บเสบียงที่ปลอดภัยมากขึ้น ด้วยลานปราสาทมากมายขนาดนี้ เราสามารถเก็บม้าศึกของอัศวินได้ทั้งคอกภายในกำแพง — เป็นสิ่งยอดเยี่ยม หากเราหมดหัวหมูป่าดอง..."
 building_curtain_walls_07:1 "ตราซ อิตาเลียน"
 building_curtain_walls_07_desc:1 "ตราซ อิตาเลียน หรือป้อมปราการแบบป้อมปืนใหญ่ เป็นโครงสร้างป้องกันชนิดหนึ่งที่สามารถต้านทานได้แม้กระทั่งการระดมยิงอย่างไม่หยุดยั้งของปืนใหญ่ อืม ก็ไม่นานนัก แต่อย่างน้อยก็เพียงพอที่จะหลบหนีได้อย่างปลอดภัยผ่านอุโมงค์ลับ"
 building_curtain_walls_08:1 "แรฟลินและคาวาเลียร์"
 building_curtain_walls_08_desc:1 "คาวาเลียร์คือแท่นยกสูงที่ช่วยให้ทหารของเรายิงข้ามเชิงเทินหลักไปยังศัตรูได้โดยตรง! แต่น่าเสียดายที่นี่หมายความว่าศัตรูก็รู้ตำแหน่งที่จะเล็งยิงได้อย่างแม่นยำ เช่นกัน... แม้ว่าทหารที่ประจำอยู่บนแรฟลิน ซึ่งเป็นป้อมยื่นสามเหลี่ยมที่แบ่งแยกศัตรูที่ล้อมเมือง จะสามารถพยายามอย่างเต็มที่เพื่อป้องกันไม่ให้สิ่งนี้เกิดขึ้น"
 
 building_type_cereal_fields_01:1 "เรือกสวนไร่นา"
 building_type_cereal_fields_01_desc:1 "เรือกสวนไร่นาเป็นกระดูกสันหลังของเศรษฐกิจทุกรูปแบบ หล่อเลี้ยงทั้งคน สัตว์ กองทัพ และงานเลี้ยง – ไม่อาจกล่าวถึงพลังของธัญพืชธรรมดาได้น้อยเกินไป"
 building_cereal_fields_01:1 "แปลงพืชผล"
 building_cereal_fields_01_desc:1 "แปลงพืชผล กระดูกสันหลังของเศรษฐกิจศักดินา แต่ละแปลงดูแลโดยครอบครัวชาวนาเล็ก ๆ แต่ใจกว้าง – ซึ่งเต็มใจอย่างยิ่งที่จะสละผลผลิตส่วนใหญ่เป็นส่วยให้กับราชสำนัก!"
 building_cereal_fields_02:1 "หมู่บ้านเล็ก"
 building_cereal_fields_02_desc:2 "การสร้างหมู่บ้านเล็กเพิ่มขึ้นหมายความว่าสามารถส่งชาวนาไปทำงานในทุ่งนาได้มากขึ้น เพิ่มผลผลิตและภาษีในท้องถิ่น"
 building_cereal_fields_03:1 "โรงนาและยุ้งฉาง"
 building_cereal_fields_03_desc:2 "การสร้างโรงนาและยุ้งฉางขนาดใหญ่ช่วยให้ชาวนาสามารถเก็บรักษาหญ้าแห้งและฟาง ให้พวกเขามีที่เก็บเครื่องมือ และทำหน้าที่เป็นหลังคาชั่วคราวสำหรับกองทัพที่เดินทางและคนจรจัด"
 building_cereal_fields_04:1 "ที่ดินทำกิน"
 building_cereal_fields_04_desc:2 "ที่ดินทำกินขนาดใหญ่รองรับครอบครัวชาวนาขนาดใหญ่ เมื่อครอบครัวมีพื้นที่และปัจจัยในการเติบโต พวกเขาจะผลิตลูกหลานมากขึ้นที่สามารถส่งไปทำงานในทุ่งนาได้"
 building_cereal_fields_05:1 "ฉางหลวง"
 building_cereal_fields_05_desc:2 "ฉางหลวงช่วยให้ชาวนาสามารถเก็บธัญพืช เนื้อแห้ง และอาหารประเภทอื่น ๆ ได้ตลอดฤดูหนาว แม้จะไม่สามารถป้องกันหนูและศัตรูพืชอื่น ๆ ได้ แต่ก็ช่วยรักษาอาหารให้แห้งได้"
 building_cereal_fields_06:1 "ไร่นาและโรงนาสิบลด"
 building_cereal_fields_06_desc:2 "ชาวนารวบรวมส่วนผลิตผลที่ต้องถวายแด่คณะนักบวชอย่างปลอดภัยในโรงนาสิบลด – แน่นอนว่า สิ่งนี้ยังช่วยให้เราเก็บภาษีจากพวกเขาได้ง่ายขึ้นด้วย"
 building_cereal_fields_07:1 "แปลงพืชผลกว้างใหญ่"
 building_cereal_fields_07_desc:2 "ด้วยการส่งเสริมให้ชาวนาไถที่นามากขึ้นและใหญ่ขึ้นใกล้กับที่ดินของกันและกัน เราสามารถเพิ่มผลิตภาพได้ แม้ว่าการรุกล้ำที่ดินของกันและกันอาจนำมา ซึ่งความขัดแย้งระหว่างชาวนาก็ตาม"
 building_cereal_fields_08:1 "ยุ้งฉางธัญพืช"
 building_cereal_fields_08_desc:2 "ยุ้งฉางขนาดมหึมาเหล่านี้เก็บธัญพืชในปริมาณมหาศาลตลอดทั้งปี และแม้กระทั่งข้ามปี และสามารถรองรับประชากรจำนวนมหาศาลได้อย่างแท้จริง"

 building_type_paddy_fields_01: "นาข้าว"
 building_type_paddy_fields_01_desc: "กองทัพเดินด้วยท้อง เมล็ดข้าวอันต่ำต้อยอาจดูไร้ความสำคัญเมื่ออยู่ลำพัง แต่มันได้หล่อเลี้ยงชาติต่าง ๆ มานับ แต่โบราณกาล"
 building_paddy_fields_01: "นาชุ่มน้ำ"
 building_paddy_fields_01_desc: "การทำนาข้าวแพร่หลายไปทั่วภูมิภาคที่ชุ่มชื้นของโลก โดยปกติเมล็ดจะถูกปลูกลงในดิน รดน้ำ และดูแลหลังจากนั้น แต่พวกมันไม่ได้จมอยู่ใต้น้ำทั้งหมด — แต่นั่นคือวิธีการเพาะปลูกข้าวอย่างแท้จริง"
 building_paddy_fields_02: "การไถพรวนนา"
 building_paddy_fields_02_desc: "น้ำและดินเพียงอย่างเดียวไม่ใช่ทั้งหมดที่จำเป็นในการเพาะปลูกข้าวอย่างมีประสิทธิภาพ พื้นดิน แม้จะอยู่ใต้น้ำ ก็ต้องมีการเตรียมการ ไถด้วยคันไถและพรวนด้วยคราด"
 building_paddy_fields_03: "นาขั้นบันไดชลประทาน"
 building_paddy_fields_03_desc: "น้ำเป็นสิ่งที่แปรปรวน มันต้องได้รับการจัดการ เพื่อให้มีความสม่ำเสมอ และเมื่อปลูกข้าว น้ำ #italic จำเป็นต้อง#! สม่ำเสมอ"
 building_paddy_fields_04: "ยุ้งฉางข้าว"
 building_paddy_fields_04_desc: "การเพาะปลูกที่ดีขึ้นย่อมต้องการการจัดเก็บที่ดีขึ้น ข้าวที่มากขึ้นจะไร้ประโยชน์หากมันเน่าเสียในกองที่ไม่มีใครดูแล อาคารเฉพาะที่สร้างบนเสาค้ำยัน ยกพื้นสูงไม่สัมผัสดิน ช่วยตากและเก็บข้าวที่เก็บเกี่ยวแล้ว"
 building_paddy_fields_05: "การเพาะต้นกล้า"
 building_paddy_fields_05_desc: "ไม่ใช่ข้าวที่ปลูกทั้งหมดจะต้องเก็บเกี่ยวเพื่อเป็นอาหาร บางครั้งก็มีประโยชน์ที่จะนำต้นกล้าที่เพิ่งงอกใหม่ทั้งต้นก่อนที่จะสุก เพื่อสงวนข้าวสายพันธุ์หนึ่งไว้ และเพิ่มสต็อกเมล็ดพันธุ์สำหรับภายหลัง"
 building_paddy_fields_06: "พันธุ์ข้าวที่หลากหลาย"
 building_paddy_fields_06_desc: "'มากเกินไปก็ไม่ดี' ยังคงเป็นจริงสำหรับการทำฟาร์ม เช่นเดียวกับสิ่งอื่นใด การปลูกข้าวเพียงชนิดเดียวอาจนำไปสู่ความสูญเสียอย่างร้ายแรง หากปีใดปีหนึ่งแล้งหรือฝนตกมากเกินไป หรือมีเมฆมากเล็กน้อย หรือ #italic บางสิ่ง#! มากเกินไปเล็กน้อยในอีกนับไม่ถ้วน ปลอดภัยกว่ามากที่จะรักษาพันธุ์ข้าวที่หลากหลายผสมกันไว้และป้องกันความเสี่ยงในอนาคต"
 building_paddy_fields_07: "การเก็บเกี่ยวข้าวตอซัง"
 building_paddy_fields_07_desc: "ตอซังที่เหลืออยู่ของต้นข้าวที่เก็บเกี่ยวแล้วสามารถถูกกระตุ้นให้แตกหน่อเพิ่มเติม สร้างผลผลิตข้าวครั้งที่สองในฤดูเก็บเกี่ยวเดียวกัน ไม่ใช่ข้าวทุกสายพันธุ์ที่จะตอบสนองดีต่อการไว้ตอซัง แต่เมื่อมันได้ผล ก็มี แต่ข้อดีต่อการเพาะปลูกข้าว"
 building_paddy_fields_08: "โรงสีข้าวขนาดใหญ่"
 building_paddy_fields_08_desc: "ข้าวไม่ได้ถูกเก็บจากนาและโยนลงในชามอาหารทันที มันมีกระบวนการแปรรูปทั้งระบบ ตั้งแต่การทำความสะอาด ตากแห้ง ไปจนถึงการสีและการคัดแยก เตาเผาและไฟที่มีการจัดการอย่างระมัดระวังสามารถเร่งการตากแห้งได้ และครกตำข้าวสามารถเชื่อมต่อกับกังหันน้ำเพื่อ ทำให้กระบวนการสีข้าวเป็นกลไก"

 building_type_barracks_01:0 "โรงทหาร"
 building_type_barracks_01_desc:1 "โรงทหารเป็นอาคารที่แข็งแรง ซึ่งมีจุดประสงค์เพียงอย่างเดียวคือเป็นที่พักและเตรียมไพร่พลในท้องถิ่นให้พร้อมสำหรับสงคราม"
 building_barracks_01:1 "โรงทหารไม้"
 building_barracks_01_desc:2 "โรงทหารไม้ธรรมดาเหล่านี้ให้การป้องกันพื้นฐานจากสภาพอากาศแก่ไพร่พลขณะที่พวกเขาฝึกฝนเพื่อสงคราม"
 building_barracks_02:1 "ลานเกณฑ์ไพร่พล"
 building_barracks_02_desc:1 "ด้วยการเคลียร์พื้นที่ขนาดใหญ่ให้ปราศจากสิ่งกีดขวาง เราสามารถรวบรวมทหารของเราไว้ในที่เดียวเพื่อแบ่งเป็นหน่วย ทัศนวิสัยที่ชัดเจนยังช่วยให้สังเกตเห็นผู้หนีทัพได้ง่ายขึ้น"
 building_barracks_03:1 "โรงทหารหิน"
 building_barracks_03_desc:2 "โรงทหารหินที่แข็งแรงกว่าให้การป้องกันจากสภาพอากาศได้ดีขึ้นอย่างมาก และการแบกหินก็เป็นการฝึกที่ยอดเยี่ยมสำหรับทหารของเรา"
 building_barracks_04:1 "ค่ายเคลื่อนที่"
 building_barracks_04_desc:2 "แม้ว่าโรงทหารถาวรจะมีประโยชน์สำหรับการฝึก แต่การมีค่ายเคลื่อนที่ที่ทำจากกระโจมจะช่วยเพิ่มประสิทธิภาพของเราในยามสงคราม เนื่องจากโรงทหารสามารถเคลื่อนที่ไปพร้อมกับกองทัพได้"
 building_barracks_05:1 "โรงตีเหล็ก"
 building_barracks_05_desc:2 "ด้วยการเกณฑ์ช่างตีเหล็กในค่ายเพื่อบำรุงรักษาหอกขึ้นสนิมและส้อมงอของไพร่พล เราสามารถ ทำให้กองทหารของเรามีประสิทธิภาพมากขึ้นและอย่างน้อยก็อันตรายขึ้นเล็กน้อย"
 building_barracks_06:1 "ลานฝึก"
 building_barracks_06_desc:1 "ด้วยการตั้งหุ่นฝึกและสิ่งกีดขวาง เราสามารถคัดแยกผู้ที่อ่อนแอออกจากผู้ที่แข็งแกร่ง – และด้วยวิธีนั้น เรารู้ว่าควรส่งทหารคนใดไปอยู่แนวหน้าของรูปขบวน"
 building_barracks_07:1 "ศูนย์เกณฑ์ทหาร"
 building_barracks_07_desc:1 "ด้วยการสร้างศูนย์เกณฑ์ทหารโดยเฉพาะในหมู่บ้านใกล้เคียงทั้งหมด เรารับประกันกระแสธารของผู้ก่อกวนที่ไม่เต็มใจ เมาสุรา เพื่อมาเพิ่มจำนวนทหารของเรา"
 building_barracks_08:1 "โรงทหารถาวร"
 building_barracks_08_desc:2 "แม้ว่าเรามักจะต้องเคลื่อนย้ายไพร่พลของเราในทันที แต่การสร้างโรงทหารถาวรที่สร้างอย่างดีช่วยให้เรามีสถานที่สำหรับพักทหารและนายทหารชั้นยอด"
 
 building_type_camel_farms_01:1 "ค่ายอูฐ"
 building_type_camel_farms_01_desc:1 "ฟาร์มเหล่านี้อุทิศให้กับการเพาะพันธุ์และเลี้ยงอูฐเพื่อใช้ในกองทัพ เช่นเดียวกับที่ชาวบ้านในท้องถิ่นใช้ในการทำงานประจำวัน อูฐเป็นพาหนะที่ยืดหยุ่นและแข็งแกร่ง เหมาะอย่างยิ่งกับสภาพอากาศทะเลทรายที่รุนแรง"
 building_camel_farms_01:1 "นักเพาะพันธุ์อูฐ"
 building_camel_farms_01_desc:0 "$building_type_camel_farms_01_desc$"
 building_camel_farms_02:1 "ด่านสอดแนม"
 building_camel_farms_02_desc:1 "พลขี่อูฐเดินทางระหว่างด่านสอดแนมเป็นประจำ นำเสบียงและข่าวสารเกี่ยวกับเหตุการณ์ปัจจุบันติดตัวไปด้วย"
 building_camel_farms_03:2 "ช่างทำคันธนู"
 building_camel_farms_03_desc:2 "ทหารม้าอูฐทำผลงานได้ดีเมื่อพลขี่มีคันธนู และช่างทำคันธนูในท้องถิ่นรับประกันการจัดหาอุปกรณ์ยิงธนูอย่างต่อเนื่อง"
 building_camel_farms_04:1 "ตลาดอูฐ"
 building_camel_farms_04_desc:1 "ตลาดคึกคักไปด้วยกิจกรรมเสมอ พ่อค้าซื้อขายอูฐหลายร้อยตัวต่อวัน สิ่งนี้ ทำให้มั่นใจได้ว่านักเพาะพันธุ์ของเราจะเข้าถึงตัวอย่างที่ทนทานและอดทนที่สุด"
 building_camel_farms_05:1 "ลานเกณฑ์ชนเผ่าเร่ร่อน"
 building_camel_farms_05_desc:1 "ชนเผ่าเร่ร่อนในทะเลทรายที่ดุร้ายเป็นทหารที่ยอดเยี่ยม แต่พวกเขาไม่ทำงานฟรี ด้วยการจัดหาพาหนะที่เหนือกว่าให้เป็นค่าตอบแทน เรารับประกันความภักดีของพวกเขาในความขัดแย้งในอนาคต"
 building_camel_farms_06:1 "คอกทหาร"
 building_camel_farms_06_desc:1 "คอกขนาดใหญ่และแข็งแรงเป็นที่อยู่ของอูฐศึกอันมีค่าของเรา ปกป้องพวกมันจากทั้งขโมยและความโหดร้ายของทะเลทราย"
 building_camel_farms_07:1 "ช่างทำเกราะ"
 building_camel_farms_07_desc:1 "การทำเกราะสำหรับอูฐไม่ใช่เรื่องง่าย แต่รางวัลนั้นคุ้มค่าอย่างยิ่ง การเข้าตีโดยอูฐติดเกราะเต็มยศที่น่าเกรงขามสามารถ ทำให้กองทัพที่ใช้ม้าหันหลังหนีได้"
 building_camel_farms_08:1 "นักเพาะพันธุ์ขั้นสูง"
 building_camel_farms_08_desc:2 "ที่นี่ ผู้เชี่ยวชาญด้านการเลี้ยงอูฐอย่างแท้จริงเพาะพันธุ์และเลี้ยงอูฐสายพันธุ์ที่แข็งแกร่งและดุร้ายที่สุดในพื้นที่"
 
 building_type_logging_camps_01:1 "สถานีป่าไม้"
 building_type_logging_camps_01_desc:1 "ไม้ซุง ยางไม้ ถ่าน และทรัพยากรอื่น ๆ จำนวนมากถูกเก็บเกี่ยวจากป่าเหล่านี้ เป็นแหล่งวัสดุก่อสร้างที่ยอดเยี่ยมและอยู่ใกล้สำหรับเมืองโดยรอบ"
 building_logging_camps_01:1 "ค่ายตัดไม้"
 building_logging_camps_01_desc:2 "คนตัดไม้ได้ตั้งค่ายพักตามชายป่า เพื่อให้แน่ใจว่ามีการผลิตไม้ซุงอย่างสม่ำเสมอ"
 building_logging_camps_02:1 "คนเก็บยางไม้"
 building_logging_camps_02_desc:1 "ตลอดแนวป่า มีการเก็บรวบรวมยางไม้เพื่อใช้เป็นกาว หรือขายให้กับคณะนักบวชเพื่อใช้ในพิธีกรรมต่าง ๆ"
 building_logging_camps_03:1 "คนเผาถ่าน"
 building_logging_camps_03_desc:2 "คนเผาถ่านทำงานอย่างไม่รู้จักเหน็ดเหนื่อยท่ามกลางควันและหมอกควันเพื่อผลิตวัสดุอันมีค่าสำหรับช่างตีเหล็กในท้องถิ่น"
 building_logging_camps_04:1 "ทุ่งเลี้ยงสัตว์ในป่า"
 building_logging_camps_04_desc:2 "พื้นที่บางส่วนของป่าถูกสงวนไว้เป็นทุ่งเลี้ยงสัตว์ สัตว์ได้รับอนุญาตให้เล็มหญ้าระหว่างต้นไม้และอ้วนท้วนด้วยถั่ว เบอร์รี่ และใบไม้จำนวนมาก"
 building_logging_camps_05:1 "แปลงเพาะปลูก"
 building_logging_camps_05_desc:1 "ที่ ซึ่งเคยมีต้นไม้ บัดนี้มีทุ่งนา ป่าไม้เดิมกลายเป็นพื้นที่เกษตรกรรมที่น่าเกรงขาม"
 building_logging_camps_06:1 "ทุ่งเลี้ยงผึ้ง"
 building_logging_camps_06_desc:1 "ที่ขอบป่า มีการวางโรงเลี้ยงผึ้งเพื่อใช้ประโยชน์จากดอกไม้ป่าจำนวนมากที่ปรากฏขึ้นในที่ที่ป่าเคยตั้งอยู่"
 building_logging_camps_07:1 "โรงงานแก้วในป่า"
 building_logging_camps_07_desc:1 "ป่าเป็นสถานที่ที่สมบูรณ์แบบสำหรับช่างเป่าแก้วในการทำงาน ด้วยการเข้าถึงวัสดุส่วนใหญ่ที่ต้องการได้อย่างง่ายดาย ทำให้สามารถผลิตและค้าขายแก้วอันมีค่าได้"
 building_logging_camps_08:1 "โรงเลื่อย"
 building_logging_camps_08_desc:2 "โรงเลื่อยเป็นการปรับปรุงครั้งใหญ่เมื่อเทียบกับขวาน ป่าสามารถถูกใช้ไปเกือบหมดในเวลาอันสั้น โดยไม้ที่มีค่าของมันเป็นเชื้อเพลิงให้กับนครและเมืองของเรา"
 
 building_type_peat_quarries_01:1 "พื้นที่เกษตรกรรมชุ่มน้ำ"
 building_type_peat_quarries_01_desc:1 "แม้ว่าพื้นที่ชุ่มน้ำจะไม่เคยให้โอกาสในการปลูกพืชผล เช่นเดียวกับที่ราบ แต่พืชพันธุ์ที่อุดมสมบูรณ์สามารถรองรับสัตว์เลี้ยงในฟาร์มจำนวนมากได้ นอกจากนี้ยังมีโอกาสในการสกัดทั้งพีทและเกลือ"
 building_peat_quarries_01:1 "ทุ่งเลี้ยงวัวควาย"
 building_peat_quarries_01_desc:2 "ความอุดมสมบูรณ์ของพื้นที่ชุ่มน้ำ ทำให้เป็นทุ่งหญ้าเลี้ยงสัตว์ที่ยอดเยี่ยมสำหรับสัตว์เลี้ยงทุกขนาด"
 building_peat_quarries_02:1 "เหมืองพรุ"
 building_peat_quarries_02_desc:1 "พีทจำนวนมากถูกขุดขึ้นที่นี่ การมีอยู่ของมันช่วยในการพัฒนาฟาร์มและทุ่งนาใหม่"
 building_peat_quarries_03:1 "ทุ่งหญ้าแห้ง"
 building_peat_quarries_03_desc:2 "รอบ ๆ พื้นที่ชุ่มน้ำ หญ้าจำนวนมากเติบโต เมื่อเก็บเกี่ยวแล้ว สามารถใช้เป็นอาหารสัตว์สำหรับฤดูหนาวได้"
 building_peat_quarries_04:1 "บ่อเกลือ"
 building_peat_quarries_04_desc:1 "คนงานใช้กระทะขนาดใหญ่เพื่อต้มน้ำและสกัดเกลือจากพื้นที่ชุ่มน้ำ เกลือนี้ใช้ในการถนอมเนื้อสัตว์ ซึ่งจะถูกนำไปค้าขายต่อไป"
 building_peat_quarries_05:1 "พื้นที่ชุ่มน้ำมีกำแพงล้อม"
 building_peat_quarries_05_desc:1 "ด้วยการสร้างกำแพงล้อมรอบพื้นที่ชุ่มน้ำ ชาวนาสามารถควบคุมการเจริญเติบโตของพืชได้ง่ายขึ้น และปกป้องผลผลิตอันมีค่าภายใน"
 building_peat_quarries_06:1 "ทุ่งพื้นที่ชุ่มน้ำ"
 building_peat_quarries_06_desc:1 "คุณสมบัติเฉพาะตัวของพื้นที่ชุ่มน้ำช่วยให้ชาวนาสามารถปลูกพืชหลายชนิดที่ปกติไม่สามารถปลูกได้สำเร็จ เช่น ป่าน หรือ แฟลกซ์"
 building_peat_quarries_07:1 "เหมืองพรุขนาดใหญ่"
 building_peat_quarries_07_desc:1 "มีการขุดพีทมากขึ้นเรื่อย ๆ ที่นี่ โดยส่วนใหญ่ส่งออกไปทั่วเพื่อใช้เป็นปุ๋ย"
 building_peat_quarries_08:1 "ฟาร์มปศุสัตว์พื้นที่ชุ่มน้ำขนาดใหญ่"
 building_peat_quarries_08_desc:1 "ฝูงสัตว์ขนาดใหญ่กินพืชพันธุ์ที่อุดมสมบูรณ์ในพื้นที่ชุ่มน้ำ เติบโตใหญ่โตและอ้วนท้วน"
 
 building_type_hill_farms_01:0 "พื้นที่เกษตรกรรมเนินเขา"
 building_type_hill_farms_01_desc:1 "เนินเขาที่ทอดยาวของจังหวัดนี้ปกคลุมไปด้วยทุ่งนา แม้ว่าการทำฟาร์มบนทางลาดจะช่วยในการรดน้ำพืชผล แต่พื้นที่จำกัดหมายถึงผลผลิตที่น้อยลง"
 building_hill_farms_01:1 "ทุ่งนาไหล่เขา"
 building_hill_farms_01_desc:1 "ตามไหล่เขาจำนวนมากมีทุ่งนาเล็ก ๆ มากมาย ปลูกพืชผลและหล่อเลี้ยงประชากรชาวนาจำนวนน้อย"
 building_hill_farms_02:1 "ทุ่งเลี้ยงสัตว์บนเนิน"
 building_hill_farms_02_desc:2 "วัวควายถูกนำไปยังที่สูงที่ยังไม่ได้เพาะปลูก หรือเนินเขา และได้รับอนุญาตให้เล็มหญ้าที่อุดมสมบูรณ์ที่เติบโตที่นั่น"
 building_hill_farms_03:1 "ห้องเก็บของใต้ดิน"
 building_hill_farms_03_desc:1 "ห้องเก็บของใต้ดินช่วยให้สามารถเก็บผักได้ตลอดทั้งปี ซึ่งเป็นสิ่งที่มีความสำคัญอย่างยิ่งในเนินเขาที่อุดมสมบูรณ์น้อย"
 building_hill_farms_04:1 "แปลงผัก"
 building_hill_farms_04_desc:1 "แปลงผักขนาดใหญ่ให้เป็นอาหารที่จำเป็นอย่างยิ่งแก่ฟาร์มที่กระจัดกระจาย"
 building_hill_farms_05:1 "ขั้นบันไดเกษตร"
 building_hill_farms_05_desc:2 "ด้วยการผันน้ำจากลำธารใกล้เคียงไปยังขั้นบันได เราสามารถเพิ่มความอุดมสมบูรณ์ของทุ่งนาไหล่เขาได้อย่างมหาศาล"
 building_hill_farms_06:1 "ถนนและบันได"
 building_hill_farms_06_desc:2 "ถนนและบันไดที่เหมาะสมเชื่อมต่อฟาร์มและหมู่บ้านเล็ก ๆ ที่กระจัดกระจาย ช่วยให้การสื่อสารง่ายขึ้นและการเดินทางของผู้คน ข่าวสาร และสินค้าเร็วขึ้น"
 building_hill_farms_07:1 "ฉางหลวงฤดูหนาว"
 building_hill_farms_07_desc:2 "สัตว์เลี้ยงในฟาร์มและผู้คนจำนวนมากสามารถได้รับอาหารตลอดฤดูหนาวด้วยอาหารที่เก็บรักษาไว้ในฉางหลวงเหล่านี้"
 building_hill_farms_08:1 "สวนแอปเปิล"
 building_hill_farms_08_desc:1 "เนินเขาที่ทอดยาวเป็นสภาพแวดล้อมที่สมบูรณ์แบบสำหรับสวนผลไม้ โดยเฉพาะอย่างยิ่งพันธุ์แอปเปิล"
 
 building_type_hill_forts_01:0 "ป้อมเนิน"
 building_type_hill_forts_01_desc:1 "สร้างขึ้นบนเนินเขาสูงชันหรือหน้าผา ป้อมปราการขนาดมหึมาเหล่านี้ตั้งมั่นคงต่อต้านกองทัพที่ล้อมเมืองใด ๆ ที่ขาดความสามารถในการบิน!"
 building_hill_forts_01:1 "ป้อมเนินขนาดเล็ก"
 building_hill_forts_01_desc:1 "ป้อมเนินตั้งตระหง่านอยู่บนยอดเนินเขา บังคับให้ผู้ล้อมเมืองต้องต่อสู้ในสมรภูมิที่เสียเปรียบ (สู้ขึ้นเนิน)"
 building_hill_forts_02:1 "เชิงเทินดินอย่างง่าย"
 building_hill_forts_02_desc:1 "ป้อมล้อมรอบด้วยเชิงเทินดิน ก่อตัวเป็นกำแพงดินที่ไม่อาจทะลวงได้ ซึ่งสามารถ ทำให้ทหารที่แข็งแกร่งที่สุดเสียขวัญได้"
 building_hill_forts_03:1 "คูเมือง"
 building_hill_forts_03_desc:2 "คูเมืองขนาดใหญ่ถูกขุดรอบเนินป้องกัน เนื่องด้วยกำแพงคูที่เต็มไปด้วยโคลนและลื่น ผู้โจมตีที่โง่เขลาอาจพบว่าตนเองติดอยู่ที่ก้นคู จมอยู่ในโคลนจากการรุกคืบของทหารพวกเดียวกัน"
 building_hill_forts_04:1 "รั้วปัก"
 building_hill_forts_04_desc:1 "กำแพงขนาดใหญ่ที่ทำจากท่อนไม้แหลมล้อมรอบป้อม เป็นอุปสรรคอีกอย่างหนึ่งก่อนที่จะไปถึงสมบัติภายใน"
 building_hill_forts_05:1 "ป้อมยาม"
 building_hill_forts_05_desc:1 "ป้อมยามถูกวางไว้รอบป้อม พร้อมด้วยยามที่ตื่นตัวพร้อมปฏิบัติหน้าที่ทันทีหากการโจมตีเริ่มขึ้น"
 building_hill_forts_06:1 "กำแพงชั้นนอก"
 building_hill_forts_06_desc:1 "กำแพงหินขนาดใหญ่บัดนี้ล้อมรอบป้อมเนิน ตอกย้ำความเป็นป้อมปราการที่ไม่อาจทะลวงได้อย่างถาวร"
 building_hill_forts_07:1 "ป้อมเนินขนาดใหญ่"
 building_hill_forts_07_desc:1 "ป้อมกลางได้รับการขยายและปรับปรุงอย่างมาก บัดนี้มันสูงตระหง่านขึ้นสู่ท้องฟ้าอย่างน่าเกรงขาม"
 building_hill_forts_08:1 "เชิงเทินดินอันซับซ้อน"
 building_hill_forts_08_desc:1 "เชิงเทินดินที่ล้อมรอบป้อมเนินนั้นซับซ้อนและสับสนมากจนกองทัพศัตรูแทบไม่รู้ว่าควรจะบุกเข้าทางใด ซึ่งเป็นประโยชน์ต่อเรา – โดยเฉพาะอย่างยิ่งเมื่อเห็นว่าครึ่งหนึ่งของทางเข้าเหล่านั้นนำไปสู่กับดักมรณะ..."
 
 building_type_plantations_01:1 "เกษตรกรรมทะเลทราย"
 building_type_plantations_01_desc:1 "พื้นที่เพาะปลูกเหล่านี้เน้นการปลูกผลไม้และผักที่ทนทานพอที่จะทนต่อสภาพอากาศที่รุนแรงได้"
 building_plantations_01:1 "พื้นที่เพาะปลูกขนาดย่อม"
 building_plantations_01_desc:1 "แม้จะขาดแคลนน้ำ แต่พื้นที่เพาะปลูกขนาดเล็กเหล่านี้ก็ประสบความสำเร็จในการปลูกผลไม้ที่ทนทานเป็นพิเศษ"
 building_plantations_02:1 "สถานีการค้า"
 building_plantations_02_desc:1 "ชนเผ่าเร่ร่อนในทะเลทรายที่ทรหดเดินทางระหว่างสถานีการค้า นำอาหารติดตัวไปยังที่ที่ต้องการมากที่สุด"
 building_plantations_03:1 "ช่างทอผ้า"
 building_plantations_03_desc:1 "ช่างทอผ้าปั่นด้ายในโรงทอผ้าของตน ซึ่งจากนั้นพวกเขาก็นำไปแลกเปลี่ยนกับชนเผ่าเร่ร่อนในทะเลทราย"
 building_plantations_04:1 "แหล่งน้ำพุ"
 building_plantations_04_desc:1 "ด้วยน้ำที่จำกัด บ่อน้ำใหม่ย่อม ทำให้พื้นที่เจริญรุ่งเรืองอย่างแน่นอน มีการค้นพบแหล่งน้ำพุดังกล่าวหลายแห่ง และได้มีการสร้างบ่อน้ำที่เหมาะสมขึ้น"
 building_plantations_05:1 "โรงเตี๊ยมคาราวาน"
 building_plantations_05_desc:1 "กองคาราวานค้าขนาดใหญ่ต้องการสถานที่พัก เพื่อให้สัตว์ของพวกเขาได้พักผ่อน โรงเตี๊ยมคาราวานให้พื้นที่ที่พวกเขาต้องการและยังเป็นสถานที่ที่ยอดเยี่ยมในการเก็บภาษีสินค้าของพวกเขา"
 building_plantations_06:1 "สวนอินทผลัม"
 building_plantations_06_desc:1 "เมื่อมีที่ดินที่เหมาะสำหรับการเพาะปลูกมากขึ้น สวนอินทผลัมก็ได้รับการเพาะปลูก อินทผลัมหวานเก็บไว้ได้นาน และเป็นสินค้าที่มีค่าสำหรับพ่อค้า"
 building_plantations_07:1 "ชลประทาน"
 building_plantations_07_desc:1 "ด้วยการทดน้ำท่วมทุ่งนาจากบ่อน้ำ ทำให้สามารถรองรับการทำฟาร์มได้มากกว่าแค่เพื่อยังชีพ อย่างไรก็ตาม นี่เป็นงานใหญ่ การ ทำให้ทะเลทรายเบ่งบานไม่ใช่เรื่องง่าย"
 building_plantations_08:1 "พื้นที่เพาะปลูกขนาดใหญ่"
 building_plantations_08_desc:1 "บัดนี้พื้นที่เพาะปลูกเหล่านี้ผลิตผลผลิตส่วนเกินได้อย่างแน่นอน ซึ่งสามารถนำไปค้าขายและขายเพื่อหากำไรได้"
 
 building_type_outposts_01:0 "ป้อมสังเกตการณ์"
 building_type_outposts_01_desc:1 "ชุดป้อมสังเกตการณ์ตั้งอยู่รอบนอกการตั้งถิ่นฐานที่สำคัญทั้งหมดในจังหวัดนี้ เป็นระบบเตือนภัยล่วงหน้าในกรณีที่มีการปล้นสะดมหรือการโจมตีจากสัตว์"
 building_outposts_01:1 "หอสังเกตการณ์"
 building_outposts_01_desc:1 "เพื่อติดตามสัตว์ (และการปล้นสะดมที่กำลังจะมาถึง) ชุดหอสังเกตการณ์มีทหารยามที่ระแวดระวังประจำการอยู่ หากพบสัตว์ร้าย คำเตือนจะแพร่กระจายอย่างรวดเร็ว เพื่อให้วัวควายที่อ่อนแอสามารถถูกนำไปยังที่ปลอดภัยได้ทัน"
 building_outposts_02:1 "ด่านทหาร"
 building_outposts_02_desc:1 "ตามถนนหลายสายและเส้นทางที่คดเคี้ยว มีด่านหลายแห่ง ซึ่งมีทหารยามที่ได้รับการว่าจ้างจากพ่อค้าท้องถิ่นประจำการอยู่ การปรากฏตัวของพวกเขา ทำให้มั่นใจได้ว่าพื้นที่จะยังคงสงบสุขและปลอดภัย ปราศจากโจรปล้นคนเดินทาง"
 building_outposts_03:2 "คลังอาวุธลับ"
 building_outposts_03_desc:1 "ข้อดีอย่างหนึ่งของการอาศัยอยู่ในภูมิประเทศที่ขรุขระคือความสามารถในการพรางตัวได้เกือบทุกอย่าง หากมีการปล้นสะดมเข้ามา ชาวบ้านสามารถติดอาวุธให้ตนเองด้วยอาวุธจากคลังลับจำนวนมาก"
 building_outposts_04:1 "ป้อมสังเกตการณ์รั้วปัก"
 building_outposts_04_desc:1 "ป้อมสังเกตการณ์เก่าที่โยกเยกบัดนี้ถูกแทนที่ด้วยหอคอยรั้วปักที่แข็งแรงและทนทาน ยิ่งไปกว่านั้น พวกมันซ่อนตัวอยู่ในภูมิประเทศที่ขรุขระได้อย่างสมบูรณ์แบบ"
 building_outposts_05:1 "จุดเกณฑ์ไพร่พล"
 building_outposts_05_desc:1 "ใกล้หอคอย แต่ละแห่ง บัดนี้มีจุดเกณฑ์ไพร่พล ในช่วงเวลาแห่งการเรียกระดมพล ชาวนาที่ถูกเกณฑ์สามารถรวมตัวกันอย่างปลอดภัยใกล้กับที่ที่พวกเขาสามารถหาทั้งอาวุธและการป้องกันได้"
 building_outposts_06:1 "ด่านชายแดน"
 building_outposts_06_desc:1 "ตรงกันข้ามกับป้อมสังเกตการณ์ที่ซ่อนไว้อย่างดี ด่านชายแดนมีจุดมุ่งหมายเพื่อป้องปราม สร้างขึ้นจากวัสดุที่แข็งแรงกว่า ขนาดที่แท้จริงของหอคอยเหล่านี้เพียงพอที่จะ ทำให้ผู้ปล้นสะดมต้องหันหลังกลับ"
 building_outposts_07:1 "สถานีสอดแนม"
 building_outposts_07_desc:1 "เพื่อให้แน่ใจว่าหน่วยสอดแนมของเราได้รับอาหารอย่างดีและสามารถเดินทางได้โดยไม่ต้องแบกสัมภาระมาก เราได้สร้างชุดสถานีสอดแนมที่วางไว้อย่างมีกลยุทธ์ อาคารเหล่านี้ซ่อนตัวจากสายตาที่สอดส่องของศัตรูได้อย่างดี ช่วยให้สามารถรวบรวมข่าวกรองที่ไม่มีใครเทียบได้ในยามถูกรุกราน"
 building_outposts_08:1 "ป้อมสังเกตการณ์เสริมกำลัง"
 building_outposts_08_desc:1 "บัดนี้ป้อมสังเกตการณ์ที่สกัดจากหินอันน่าเกรงขามผงาดขึ้นสู่ท้องฟ้า ทำให้ทหารและยามกองคาราวานที่ประจำอยู่ภายในรู้สึกถึงการมีอยู่ของมัน"
 
 building_type_watchtowers_01:0 "หอสังเกตการณ์"
 building_type_watchtowers_01_desc:1 "หอสังเกตการณ์อันสง่างามหลายแห่งคอยเฝ้าดูชาวนาที่ตรากตรำทำงาน เป็นจุดชมวิวที่ยอดเยี่ยมสำหรับพลธนู"
 building_watchtowers_01:1 "หอคอยอิฐโคลน"
 building_watchtowers_01_desc:1 "หอคอยที่ทำจากอิฐโคลนเหล่านี้ให้การป้องกันที่เรียบง่าย แต่มีประสิทธิภาพ"
 building_watchtowers_02:1 "บ้านหอคอย"
 building_watchtowers_02_desc:1 "บ้านหอคอยสร้างขึ้นเพื่อทั้งการป้องกันและอยู่อาศัย และตั้งอยู่ในตำแหน่งทางยุทธศาสตร์"
 building_watchtowers_03:1 "หอสังเกตการณ์ไม้"
 building_watchtowers_03_desc:1 "หอสังเกตการณ์ไม้หลายแห่งมองเห็นชาวนาขณะที่พวกเขากำลังทำงานในทุ่งนา จากจุดชมวิวของพวกเขา พลธนูให้การป้องกันที่ยอดเยี่ยม"
 building_watchtowers_04:1 "ป้อมอิฐโคลนขนาดเล็ก"
 building_watchtowers_04_desc:1 "ป้อมอิฐโคลนที่ปรับปรุงใหม่ แม้จะมีขนาดเล็ก แต่ให้การป้องกันที่เหนือกว่าหอสังเกตการณ์ทั่วไป ในยามสงคราม พวกมันสามารถปกป้องชาวนาจำนวนมากจากผู้ปล้นสะดม และยังมีฉางหลวงขนาดเล็กสำหรับช่วงเวลาที่ขาดแคลน"
 building_watchtowers_05:1 "หอสังเกตการณ์หิน"
 building_watchtowers_05_desc:1 "หอสังเกตการณ์เหล่านี้เป็นจุดชมวิวที่งดงาม ไม่เพียง แต่สำหรับพลธนูเท่านั้น แต่ยังสำหรับเจ้าขุนมูลนายที่ตรวจตราดูชาวนาของตนด้วย"
 building_watchtowers_06:1 "ช่องยิงธนู"
 building_watchtowers_06_desc:1 "ด้วยการสร้างหอคอยให้มีชุดช่องสำหรับยิงธนูออกมา ระยะยิงและการป้องกันของพลธนูจะเพิ่มขึ้นอย่างมาก"
 building_watchtowers_07:1 "หอคอยพีล"
 building_watchtowers_07_desc:1 "บ้านหอคอยขนาดเล็กเหล่านี้ได้รับการเสริมกำลังอย่างน่าเกรงขาม และบ่งบอกถึงเกียรติภูมิของเจ้าของ ในกรณีที่มีการปล้นสะดม ฝูงวัวควายทั้งฝูงสามารถถูกล้อมและปกป้องโดยหอคอยได้"
 building_watchtowers_08:1 "หอคอยโดม"
 building_watchtowers_08_desc:1 "หอคอยอันโอ่อ่าเหล่านี้สร้างด้วยหินทั้งหมด มียอดเป็นโดม เทคนิคการก่อสร้างที่เกี่ยวข้อง ทำให้พวกมันแทบจะต้านทานการโจมตีของผู้ปล้นสะดมได้"
 
 building_type_quarries_01:1 "เหมืองหิน"
 building_type_quarries_01_desc:1 "ภูเขาของจังหวัดนี้เป็นแหล่งจัดหาวัสดุก่อสร้างที่ยอดเยี่ยมให้แก่การก่อสร้างในท้องถิ่น"
 building_quarries_01:1 "เหมืองหินอย่างง่าย"
 building_quarries_01_desc:2 "หินที่ขุดได้ง่ายจากเหมืองเป็นวัสดุก่อสร้างสำหรับการก่อสร้างในบริเวณใกล้เคียง"
 building_quarries_02:1 "เหมืองแร่ตื้น"
 building_quarries_02_desc:1 "เหมืองอย่างง่ายเรียงรายตามตีนเขา รวบรวมแร่จากแหล่งแร่บนผิวดินที่เข้าถึงได้ง่าย"
 building_quarries_03:1 "โรงสีพลังน้ำ"
 building_quarries_03_desc:1 "ด้วยการผันน้ำไปยังแหล่งทำเหมือง พลังงานของมันสามารถถูกใช้โดยโรงสีพลังน้ำเพื่อขับเคลื่อนเครื่องมือที่ช่วยในการขุดค้น"
 building_quarries_04:1 "เหมืองหินขนาดใหญ่"
 building_quarries_04_desc:1 "เมื่อความต้องการวัสดุก่อสร้างเพิ่มขึ้น เหมืองหินก็ดึงดูดคนงานมากขึ้นเรื่อย ๆ เหมืองหินกำลังใหญ่ขึ้นและลึกขึ้นทุกปีที่ผ่านไป"
 building_quarries_05:1 "เหมืองขนาดใหญ่"
 building_quarries_05_desc:1 "ความต้องการโลหะยังคงเพิ่มขึ้น และเทคนิคใหม่ไม่ใช่ทุกสิ่ง – การผลิตต้องขยายขนาด และมีการเปิดเหมืองมากขึ้น!"
 building_quarries_06:1 "เหมืองหินขนาดมหึมา"
 building_quarries_06_desc:1 "เหมืองเปิดขนาดใหญ่หลายแห่งเห็นคนงานแกะสลักก้อนหินในระดับเกือบอุตสาหกรรม เหมืองหินที่หมดสภาพแล้วทิ้งร่องรอยไว้เหมือนปากอ้าอยู่ทั่วจังหวัด เนื้อหาของมันบัดนี้ก่อตัวเป็นปราสาทและกำแพงจำนวนมาก"
 building_quarries_07:1 "เหมืองปล่อง"
 building_quarries_07_desc:1 "ด้วยการมาถึงของเทคนิคใหม่ คนงานสามารถเข้าถึงโลหะที่ลึกกว่า ซึ่งซ่อนอยู่ใต้ผิวดินได้ สิ่งสำคัญที่สุดคือวิธีการใหม่ในการระบายน้ำออกจากปล่องที่ถูกน้ำท่วม"
 building_quarries_08:2 "การสูบน้ำด้วยเครื่องจักร"
 building_quarries_08_desc:2 "เครื่องสูบน้ำไม้ ซึ่งขับเคลื่อนด้วยกังหันลมหรือม้าด้านบน สามารถระบายน้ำออกจากปล่องเหมืองได้เร็วกว่าการใช้ถังหนังสองสามใบมาก"
 
 building_type_military_camps_01:1 "ค่ายทหารกองหนุน"
 building_type_military_camps_01_desc:2 "ลานฝึกอย่างง่ายที่ทหารราบติดอาวุธเบาได้รับการเตรียมพร้อมสำหรับสงคราม"
 building_military_camps_01:1 "กระโจมหนังสัตว์"
 building_military_camps_01_desc:1 "เมื่อเรียกระดมไพร่พล พวกเขาจะรวมตัวกันในค่ายชั่วคราวที่พวกเขาได้นอนในกระโจมธรรมดา แม้จะไม่สะดวกสบายที่สุด แต่ก็เป็นค่ายประเภทที่ราคาถูกและเคลื่อนย้ายได้"
 building_military_camps_02:1 "พ่อครัวค่าย"
 building_military_camps_02_desc:1 "ด้วยการมอบหมายส่วนหนึ่งของไพร่พลให้รวบรวมและเตรียมอาหารสำหรับส่วนที่เหลือ ทำให้มีคนจากชนบทถูกดึงดูดเข้ามามากขึ้น – ดึงดูดด้วยกลิ่นอาหาร"
 building_military_camps_03:1 "ลานฝึกซ้อม"
 building_military_camps_03_desc:1 "เป้ายิงธนูและหุ่นฝึกให้ทั้งความบันเทิงและการฝึกฝนเล็กน้อยแก่ไพร่พล ก่อนที่จะถูกโยนเข้าสู่ความร้อนแรงของการรบ"
 building_military_camps_04:1 "ป้อมยาม"
 building_military_camps_04_desc:1 "ป้อมยามทำหน้าที่เป็นสัญญาณไฟ จุดสังเกตการณ์ และจุดรวมพลตามธรรมชาติ แม้จะไม่ได้อยู่ในช่วงเวลาของการเรียกระดมพล ยามก็ประจำอยู่ที่นี่เสมอ"
 building_military_camps_05:1 "ช่างตีเหล็กประจำค่าย"
 building_military_camps_05_desc:1 "ช่างตีเหล็กประจำค่ายทำการซ่อมแซมง่าย ๆ และใส่เกือกม้า"
 building_military_camps_06:1 "โถงเรียกระดมพล"
 building_military_camps_06_desc:1 "โถงเรียกระดมพลโดยเฉพาะที่ตั้งอยู่ในทุกหมู่บ้าน ทำให้การเกณฑ์ไพร่พลเข้ารับราชการง่ายขึ้นมาก"
 building_military_camps_07:1 "โรงทหารกองหนุน"
 building_military_camps_07_desc:1 "แต่ละเมืองบัดนี้มีโรงทหารกองหนุนของตนเอง ซึ่งเก็บอาวุธไว้หากจำเป็น โรงทหารยังทำหน้าที่เป็นสถานที่พบปะสำหรับนายทหารที่รับผิดชอบการเรียกระดมพล"
 building_military_camps_08:1 "จัตุรัสเกณฑ์ไพร่พล"
 building_military_camps_08_desc:1 "จัตุรัสเกณฑ์ไพร่พลขนาดใหญ่ไม่เพียง แต่ให้สถานที่สำหรับทหารรวมตัวกันเท่านั้น แต่ยังเป็นสถานที่ฝึกซ้อมสำหรับการรบที่กำลังจะมาถึงด้วย"
 
 building_type_ramparts_01:1 "ป้อมปราการป่า"
 building_type_ramparts_01_desc:1 "ป้อมปราการเหล่านี้ถูกสร้างขึ้นในลักษณะที่เป็นส่วนหนึ่งของป่าที่พวกมันปกป้อง กองทัพที่รุกคืบพบว่าตนเองถูกขัดขวางโดยป้อมปราการ แต่ยังพันพัวอยู่ในพงไม้ด้วย"
 building_ramparts_01:1 "ป้อมไม้ซุง"
 building_ramparts_01_desc:1 "ป้อมไม้ขนาดเล็กตั้งเป็นส่วนหนึ่งของป่า ใช้ต้นไม้เป็นรั้วปักตามธรรมชาติ"
 building_ramparts_02:1 "เชิงเทินดิน"
 building_ramparts_02_desc:1 "แนวคันดินยาวก่อตัวเป็นแนวป้องกันรอบป้อม ขัดขวางการรุกคืบของศัตรู"
 building_ramparts_03:1 "กับดักและคู"
 building_ramparts_03_desc:1 "แม้ศัตรูอาจรู้สึกปลอดภัยเมื่อเข้าใกล้ป้อมปราการ แต่ในไม่ช้าพวกเขาจะพบว่าตนเองติดกับดักหรือถูกแทงด้วยอันตรายมากมายที่ซ่อนอยู่ทั่วป่า"
 building_ramparts_04:1 "กำแพงเชิงเทิน"
 building_ramparts_04_desc:1 "บัดนี้กำแพงหินและรั้วปักป้องกันป้อมจากศัตรูที่กำลังจะมาถึง ขัดขวางการรุกคืบผ่านป่าอย่างมาก"
 building_ramparts_05:1 "ช่องเชิงเทิน"
 building_ramparts_05_desc:1 "ด้วยการสร้างช่องเชิงเทินในกำแพง เราสามารถทั้งมองเห็นและยิงธนูใส่ศัตรูที่เข้ามาทางเราได้อย่างง่ายดาย"
 building_ramparts_06:1 "งานสนาม"
 building_ramparts_06_desc:1 "ด้วยการสร้างเชิงเทินดินอย่างรวดเร็วในที่ที่เราคาดการณ์ว่าศัตรูจะผ่านไป เราสามารถชิงไหวชิงพริบและตีขนาบข้างพวกเขาได้ขณะที่พวกเขาพยายามเคลื่อนที่อ้อมป่า"
 building_ramparts_07:2 "กำแพงเชิงเทินมีใบเสมา"
 building_ramparts_07_desc:1 "ด้วยการปรับปรุงเชิงเทินด้วยใบเสมา เราได้เปรียบอย่างชัดเจนในการล้อมเมืองใด ๆ โดยทหารของเราสามารถเคลื่อนที่ได้อย่างค่อนข้างปลอดภัยและตอบโต้การโจมตีใด ๆ ได้อย่างเท่าเทียม"
 building_ramparts_08:1 "ป้อมปราการป่าใหญ่"
 building_ramparts_08_desc:1 "ป้อมปราการหินขนาดใหญ่เหล่านี้ตั้งตระหง่านเหมือนภูเขาจากป่า ปกป้องผืนดินอันกว้างใหญ่"
 
 building_type_elephant_pens_01:1 "ค่ายช้าง"
 building_type_elephant_pens_01_desc:1 "ช้างถูกเลี้ยงและฝึกฝนที่นี่ พวกมันเป็นสัตว์ใช้งานที่ยอดเยี่ยม มีประโยชน์ทั้งสำหรับงานและสงคราม"
 building_elephant_pens_01:1 "คอกช้าง"
 building_elephant_pens_01_desc:1 "คอกที่แข็งแรงเหล่านี้สามารถกักขังแม้กระทั่งช้างที่ดื้อรั้นที่สุดได้"
 building_elephant_pens_02:1 "กับดักช้าง"
 building_elephant_pens_02_desc:1 "ช้างใหม่ถูกรวบรวมโดยการดักจับพวกมันด้วยวิธีการต่าง ๆ เช่น หลุม หรือ บ่วง บางครั้งช้างตัวเมียก็จะถูกใช้เป็นเหยื่อล่อ"
 building_elephant_pens_03:1 "ลานฝึกช้าง"
 building_elephant_pens_03_desc:1 "ช้างไม่ใช่สัตว์ที่สอนง่ายนัก แต่ในลานฝึก ผู้ฝึกที่มากประสบการณ์ที่สุดพยายามอย่างเต็มที่เพื่อจัดหาสัตว์สงครามให้กับราชสำนัก"
 building_elephant_pens_04:1 "ลานขี่ช้าง"
 building_elephant_pens_04_desc:1 "ในลานขี่ช้าง ช้างจะถูกทดสอบ โดยบรรทุกทั้งพลประจำช้าง เกราะ และอุปกรณ์"
 building_elephant_pens_05:1 "สำนักงานผู้ดูแล"
 building_elephant_pens_05_desc:1 "ผู้ดูแลรับผิดชอบสวัสดิภาพของช้าง และด้วยการสร้างสำนักงานที่เหมาะสมสำหรับพวกเขา ประสิทธิภาพของพวกเขาจึงได้รับการรับประกัน"
 building_elephant_pens_06:1 "โรงพยาบาลช้าง"
 building_elephant_pens_06_desc:1 "โรงพยาบาลช้างเฉพาะทางมีขนาดใหญ่พอที่จะรองรับแม้กระทั่งช้างเพศผู้ที่ใหญ่ที่สุด ช่วยชีวิตสัตว์ที่ มิฉะนั้นจะต้องสูญเสียไปอย่างแน่นอน"
 building_elephant_pens_07:1 "เขตรักษาพันธุ์ช้าง"
 building_elephant_pens_07_desc:1 "ด้วยการกำหนดพื้นที่ขนาดใหญ่ของป่าให้เป็นเขตรักษาพันธุ์ช้าง เรารับประกันว่าเราจะสูญเสียสัตว์จากการลักลอบล่าน้อยลงและประชากรจะคงที่"
 building_elephant_pens_08:1 "นักเพาะพันธุ์ช้าง"
 building_elephant_pens_08_desc:1 "นักเพาะพันธุ์ช้างรับประกันว่าลูกช้างใหม่จะเกิดและเติบโตจากสายพันธุ์ที่ดีที่สุดและแข็งแรงที่สุดเท่านั้น"
 
 building_type_guild_halls_01:1 "สมาคมช่างฝีมือ"
 building_type_guild_halls_01_desc:1 "นครจัดหาสถานที่กว้างขวางให้แก่สมาคมช่างฝีมือหลักและตระกูลชาวเมืองทั้งหมดเพื่อจัดระเบียบและฝึกฝนฝีมือของตน"
 building_guild_halls_01:0 "หอสมาคมช่างฝีมือ"
 building_guild_halls_01_desc:0 "$building_type_guild_halls_01_desc$"
 building_guild_halls_02:1 "สมาคมช่างแกะสลัก"
 building_guild_halls_02_desc:1 "ช่างแกะสลักผลิตสิ่งของจากไม้หรือกระดูก เช่น กรอบรูป ของตก แต่ง หรือเครื่องมือ พวกเขายังแกะสลักโล่ตราประจำตระกูล ทำให้สมาคมเป็นที่นิยมในหมู่ขุนนาง"
 building_guild_halls_03:1 "สมาคมช่างไม้"
 building_guild_halls_03_desc:1 "ช่างไม้ทำงานเกี่ยวกับการก่อสร้าง โดยใช้ไม้เป็นวัสดุหลัก บริการของพวกเขาเป็นที่ต้องการของทั้งขุนนางและคณะนักบวช โดยเฉพาะอย่างยิ่งสำหรับงานเข้าไม้ขอบที่สวยงามที่พวกเขาทำสำหรับโบสถ์และคฤหาสน์"
 building_guild_halls_04:1 "สมาคมนายพราน"
 building_guild_halls_04_desc:1 "นายพรานค้าขายเนื้อและหนังสัตว์ บริการของพวกเขาช่วยให้ทั้งคนฆ่าสัตว์และช่างฟอกหนังสามารถทำงานฝีมือของตนได้ หนังสัตว์ที่ดีที่สุดย่อมตกเป็นของตระกูลขุนนางที่มีชื่อเสียงที่สุด"
 building_guild_halls_05:1 "สมาคมช่างหิน"
 building_guild_halls_05_desc:1 "ช่างหินทำงานกับหิน ทั้งสำหรับการก่อสร้างและประติมากรรม ทักษะของพวกเขาเป็นที่ต้องการอย่างกว้างขวาง เนื่องจากความเชี่ยวชาญของพวกเขามีค่าอย่างยิ่งในการสร้างป้อมปราการ"
 building_guild_halls_06:1 "สมาคมช่างตัดเสื้อ"
 building_guild_halls_06_desc:1 "ช่างตัดเสื้อใช้เข็ม ด้าย และผ้าเป็นอาวุธคู่กาย ด้วยทักษะที่ไม่มีใครเทียบได้ พวกเขาผลิตเสื้อผ้าที่สวยงามสำหรับขุนนาง"
 building_guild_halls_07:1 "สมาคมช่างแก้ว"
 building_guild_halls_07_desc:1 "ช่างแก้วสร้างสรรค์สิ่งของที่น่าทึ่งจากแก้ว ตั้งแต่ถ้วยไปจนถึงกระจกหน้าต่าง การมีสิ่งของที่ทำจากแก้วถือเป็นเกียรติอย่างสูง ทำให้บริการของพวกเขาเป็นที่ต้องการอย่างยิ่ง"
 building_guild_halls_08:1 "สมาคมช่างศิลป์"
 building_guild_halls_08_desc:1 "ช่างศิลป์ใช้วัสดุหลากหลายไม่เพียง แต่เพื่อผลิตงานศิลปะเท่านั้น แต่ยัง รวมถึงนวัตกรรมใหม่ ๆ อีกด้วย ความเฉลียวฉลาดและทักษะอันประณีตของพวกเขากำลังดึงดูดความสนใจของขุนนางชั้นสูงทุกหนแห่ง"
 
 building_type_monastic_schools_01:1 "อาราม"
 building_type_monastic_schools_01_desc:1 "โรงเรียนแห่งนี้สอนวิชาต่าง ๆ มากมายและเป็นศูนย์กลางการเรียนรู้ชั้นสูงที่หาได้ยาก แต่นักเรียนที่ลงทะเบียนเรียนที่นี่ส่วนใหญ่ศึกษาเพื่อเตรียมตนเองสำหรับอาชีพในอนาคตในคณะนักบวช"
 building_monastic_schools_01:1 "โบสถ์น้อย"
 building_monastic_schools_01_desc:1 "สถานที่สักการะอันเรียบง่ายและเงียบสงบสำหรับผู้ศรัทธาในการสวดภาวนาและใคร่ครวญ"
 building_monastic_schools_02:1 "โถงสวดมนต์"
 building_monastic_schools_02_desc:1 "โถงสวดมนต์ใช้จัดพิธีเทศนาและเป็นสถานที่สำหรับการใคร่ครวญอย่างเงียบสงบ"
 building_monastic_schools_03:2 "โรงเรียนในอาราม"
 building_monastic_schools_03_desc:2 "$building_type_monastic_schools_01_desc$"
 building_monastic_schools_04:2 "สวนอาราม"
 building_monastic_schools_04_desc:2 "สวนของอารามเป็นสถานที่เงียบสงบสำหรับการใคร่ครวญสำหรับผู้ศรัทธาเพื่อชื่นชมความงามแห่งการสร้างสรรค์"
 building_monastic_schools_05:2 "มหาวิทยาลัยในอาราม"
 building_monastic_schools_05_desc:2 "มหาวิทยาลัยให้การศึกษาอย่างกว้างขวางในหลากหลายวิชาศักดิ์สิทธิ์ รวมถึงเทววิทยา การแปล และนิติศาสตร์"
 building_monastic_schools_06:2 "ภาควิชาปรัชญา"
 building_monastic_schools_06_desc:2 "การศึกษาในสาขาวิชาปรัชญาโบราณได้รับการสอนที่นี่ และพระสงฆ์มักนำแนวคิดเหล่านี้ไปประยุกต์ใช้ในชีวิตประจำวัน"
 building_monastic_schools_07:2 "หอดูดาว"
 building_monastic_schools_07_desc:2 "พระสงฆ์ที่นี่สังเกตดวงดาวและจากพวกมัน พวกเขาทำนายเวลาที่เหมาะสมและถูกต้องเพื่อเฉลิมฉลองวันสำคัญในปฏิทินศาสนาและพัฒนาความเข้าใจเกี่ยวกับการสร้างสรรค์"
 building_monastic_schools_08:1 "ระเบียงฉันนบถ"
 building_monastic_schools_08_desc:1 "ระเบียงฉันนบถก่อตัวเป็นแนวกั้นที่แข็งแกร่งต่อโลกภายนอก แยกชีวิตของผู้ที่อยู่ภายในกำแพงออกจากชาวบ้านภายนอกอย่างมีประสิทธิภาพ"

 building_type_megalith_01:0 "เมกะลิท"
 building_type_megalith_01_desc:0 "โครงสร้างนี้คือการจัดเรียงหินกลางแจ้ง ซึ่งโดยทั่วไปจัดวางตามแนวของดวงดาวและกลุ่มดาว ความเชื่อที่เชื่อในการก่อสร้างเมกะลิทจัดหาสถานที่สักการะบูชาที่เป็นประจำและราคาถูกให้แก่ผู้ศรัทธา ดึงดูดนักเดินทางและผู้แสวงบุญ"
 building_megalith_01:0 "เมกะลิทน้อย"
 building_megalith_01_desc:0 "การจัดเรียงหินกลางแจ้งอันยิ่งใหญ่นี้ทำหน้าที่เป็นสถานที่สักการะบูชาแบบเปิดถาวร โครงสร้างที่เรียบง่ายนี้สร้างจากหินธรรมดาในการจัดเรียงแบบง่าย ๆ รองรับผู้สักการะได้จำนวนน้อย"
 building_megalith_02:0 "สุสานเมกะลิท"
 building_megalith_02_desc:0 "สถานที่ได้รับการขยายด้วยการจัดเรียงหินหลายแบบเพื่อรองรับผู้สักการะมากขึ้น นอกเหนือจากการขยายตัวของเมกะลิทเองแล้ว สุสานใต้ดินยังถูกสร้างขึ้นในบริเวณใกล้เคียง เพื่อให้บุคคลสำคัญสามารถฝังศพ ณ สถานที่แห่งนี้ได้"
 building_megalith_03:0 "แท่นบูชาเมกะลิท"
 building_megalith_03_desc:0 "การจัดเรียงหินกลางแจ้งอันยิ่งใหญ่นี้ทำหน้าที่เป็นสถานที่สักการะบูชาแบบเปิดถาวร เมกะลิทนี้ถูกสร้างขึ้นจากหินราคาแพงและแปลกตาจากทั่วทุกมุมในท้องถิ่น และได้รับการติดตั้งแท่นบูชาสำหรับใช้ในพิธีกรรม"
 building_megalith_04:0 "เมกะลิทขนาดใหญ่"
 building_megalith_04_desc:1 "นอกเหนือจากแท่นบูชาและสิ่งของในพิธีกรรมจำนวนมากแล้ว เมกะลิทนี้ยังได้รับการขยายให้ รวมถึงหินโมโนลิธขนาดใหญ่ที่น่าเกรงขามอย่างแท้จริง ซึ่งแกะสลักอย่างประณีตด้วยสัญลักษณ์ศักดิ์สิทธิ์"
 building_megalith_05:1 "วิหารท้องถิ่น"
 building_megalith_05_desc:1 "สักการสถานขนาดเล็กและสถานที่สักการะบูชาได้ถูกสร้างขึ้นท่ามกลางเมกะลิท เพื่อเป็นสถานที่เงียบสงบสำหรับการใคร่ครวญสำหรับนักเดินทางผู้ศักดิ์สิทธิ์"
 building_megalith_06:1 "สุสานเมกะลิท"
 building_megalith_06_desc:1 "ผู้นำ นักรบ และบุคคลศักดิ์สิทธิ์ผู้ยิ่งใหญ่ได้รับการฝังไว้ภายในแท่นบูชาเหนือดืนเหล่านี้ สถานที่เหล่านี้ให้ผู้แสวงบุญและผู้สักการะมีสถานที่เคารพบรรพบุรุษผู้ล่วงลับที่มาก่อนพวกเขา"
 building_megalith_07:1 "กองหินผู้แสวงบุญ"
 building_megalith_07_desc:1 "กองหินเล็ก ๆ ถูกตั้งขึ้นกระจัดกระจายไปทั่วถิ่นทุรกันดารรอบ ๆ สถานที่เมกะลิท นำทางผู้แสวงบุญและนักเดินทางไปยังแท่นบูชาที่พวกเขาสามารถแสวงหาการสักการะได้"
 building_megalith_08:1 "เมกะลิทในตำนาน"
 building_megalith_08_desc:1 "เมกะลิทนี้เติบโตขึ้นจนถึงขนาดที่สถานะของมันกลายเป็นตำนานท้องถิ่น ผู้สักการะอ้างว่ารู้สึกถึงความเชื่อมโยงอย่างลึกซึ้งกับศรัทธาของตนขณะยืนอยู่ในสถานที่แห่งนี้"
 building_type_great_megalith_01:0 "มหาเมกะลิท"
 building_type_great_megalith_01_desc:0 "โครงการมหาเมกะลิท ซึ่งเป็นรูปแบบที่ทะเยอทะยานอย่างยิ่งของเมกะลิท เกี่ยวข้องกับการครอบคลุมภูมิทัศน์ของชนบทด้วยโครงสร้างเมกะลิทขนาดเล็กจำนวนมาก โดยมีศูนย์กลางอยู่ที่โครงสร้างขนาดมหึมาเพียงแห่งเดียว"
 building_great_megalith_01:0 "มหาเมกะลิท"
 building_great_megalith_01_desc:0 "มหาเมกะลิทคือวงกลมหินอันกว้างใหญ่และน่าทึ่งที่ทอดยาวข้ามภูมิทัศน์ พร้อมด้วยสถานที่ขนาดเล็กกว่านับไม่ถ้วนทั่วชนบท เปิดกว้างและพร้อมใช้งานสำหรับทุกคน นำผู้สักการะและผู้แสวงบุญจากทั่วโลกเข้ามาใกล้ชิดกับสิ่งศักดิ์สิทธิ์มากขึ้น"
 building_type_hospices_01: "โรงพยาบาลสงเคราะห์"
 building_type_hospices_01_desc: "โรงพยาบาลสงเคราะห์เป็นสถานที่พักผ่อนสำหรับผู้ป่วยและผู้อ่อนล้า ที่ ซึ่งพวกเขาอาจได้รับการดูแลจากบุคคลศักดิ์สิทธิ์ที่อุทิศตน"
 building_hospices_01: "ห้องพักผู้แสวงบุญ"
 building_hospices_01_desc: "ผู้แสวงบุญหลากหลายได้รับอนุญาตให้พักผ่อนในห้องพักผู้แสวงบุญหากพวกเขาต้องการที่พักพิงระหว่างการเดินทางอันยาวนาน ณ ที่นี่ พวกเขายังได้รับการเลี้ยงดูด้วยอาหาร เครื่องดื่ม และบางครั้งถึงกับได้อาบน้ำ"
 building_hospices_02: "เรือนผู้ป่วย"
 building_hospices_02_desc: "เรือนผู้ป่วยที่เรียบง่ายได้ถูกสร้างขึ้นที่นี่ เพื่อกักอากาศเสียของผู้ป่วยให้อยู่ห่างจากผู้มีสุขภาพดี และเพื่อเป็นสถานที่เงียบสงบสำหรับการรักษาสำหรับผู้ทุพพลภาพ"
 building_hospices_03: "สถานพยาบาล"
 building_hospices_03_desc: "ในยามสงครามหรือโรคระบาด สถานพยาบาลมอบโอกาสครั้งที่สองแก่เหยื่อผู้เคราะห์ร้ายที่น่าสงสาร หากพวกเขาสามารถไปถึงที่นั่นได้ทันเวลา"
 building_hospices_04: "โรงพยาบาลสงเคราะห์"
 building_hospices_04_desc: "โรงพยาบาลสงเคราะห์ให้การดูแลระยะยาวแก่ผู้ที่ มิฉะนั้นจะไม่รอดชีวิต ผู้ป่วยเรื้อรัง ผู้พิการ และบางครั้งแม้ แต่ผู้ที่ถูกปีศาจสิงสู่ก็ยินดีต้อนรับ"
 building_hospices_05: "สวนโรงพยาบาล"
 building_hospices_05_desc: "สวนดอกไม้ได้ถูกปลูกไว้รอบโรงพยาบาลสงเคราะห์ ดอกไม้ แต่ละดอกมีกลิ่นหอมแรงและน่าพึงพอใจเพื่อต่อต้านไอพิษที่เกิดจากผู้ป่วย"
 building_hospices_06: "โรงพยาบาล"
 building_hospices_06_desc: "อาคารโรงพยาบาลกลางมีอยู่ เพื่อให้การดูแลและเป็นศูนย์กลางสำหรับโรงพยาบาลสงเคราะห์ทั้งหมด พยาบาลและบุคคลศักดิ์สิทธิ์พำนักอยู่ที่นี่ เพื่อให้ทานและการดูแลแก่คนท้องถิ่นและนักเดินทางที่ป่วยไข้"
 building_hospices_07: "นิคมโรคเรื้อน"
 building_hospices_07_desc: "ในถิ่นทุรกันดารใกล้กับโรงพยาบาลสงเคราะห์ ชุมชนเล็ก ๆ ได้ถูกสร้างขึ้นที่ ซึ่งพวกเขาสามารถปลูกพืชผลของตนเองและใช้ชีวิตในวันสุดท้ายท่ามกลางกันและกัน โดยไม่ก่อให้เกิดความเสี่ยงต่อผู้มีสุขภาพดีในสังคมวงกว้าง"
 building_hospices_08: "โรงพยาบาลใหญ่"
 building_hospices_08_desc: "โรงพยาบาลให้ทานและการพยาบาลแก่ผู้สูงอายุและผู้ทุพพลภาพ และการรักษาแก่ผู้ป่วยและผู้อ่อนล้า ที่นี่ พวกเขาถูกแยกออกจากส่วนที่เหลือของสังคมและได้รับการดูแลจากบุคคลศักดิ์สิทธิ์ที่อุทิศตน"
 building_type_scriptorium_01: "ห้องคัดลอกคัมภีร์"
 building_type_scriptorium_01_desc: "ห้องคัดลอกคัมภีร์เป็นสถานที่แห่งการเรียนรู้สำหรับผู้ศักดิ์สิทธิ์และผู้มีการศึกษาเพื่อบันทึกภูมิปัญญาของตนลงบนกระดาษตลอดไป"
 building_scriptorium_01: "หอสมุด"
 building_scriptorium_01_desc: "หอสมุดอารามเต็มไปด้วยหนังสือ ตั้งแต่ตำราขนาดเล็กไปจนถึงคัมภีร์เล่มใหญ่เกี่ยวกับเทววิทยา ขุมทรัพย์แห่งความรู้อย่างแท้จริงถูกเก็บไว้ภายในกำแพง"
 building_scriptorium_02: "ห้องคัดลอก"
 building_scriptorium_02_desc: "อาลักษณ์ผู้อุทิศตนทำงานทั้งวันทั้งคืนเพื่อคัดลอกคัมภีร์ศักดิ์สิทธิ์ในห้องคัดลอก แม้ในเวลากลางคืน พวกเขาก็ทำงาน ส่องสว่างด้วยเพียงแสงเทียนและแสงจันทร์ ทั้งหมดนี้เพื่อการแสวงหาความรู้"
 building_scriptorium_03: "สำนักแปล"
 building_scriptorium_03_desc: "นักแปลผู้อุทิศตนหลั่งไหลมายังห้องคัดลอกคัมภีร์แห่งนี้เพื่อแปลงผลงานที่เขียนในภาษาโบราณหรือภาษาต่างประเทศเป็นภาษาพิธีกรรมของวิหาร ขยายการเข้าถึงผลงานนับไม่ถ้วนอย่างมาก"
 building_scriptorium_04: "สำนักอาลักษณ์"
 building_scriptorium_04_desc: "อาลักษณ์จำนวนมากพำนักอยู่ที่นี่ เพื่อให้ผู้ประพันธ์ที่มีศักยภาพสามารถบอกให้เขียนผลงานของตนได้ โดยไม่จำเป็นต้องบันทึกลงบนกระดาษด้วยมือของตนเอง"
 building_scriptorium_05: "ระบบทวีป"
 building_scriptorium_05_desc: "บัดนี้ผลงานถูกจัดระเบียบอย่างเข้มงวดตามทวีปที่มา เพิ่มความสามารถของนักวิชาการในการค้นหาภูมิปัญญาไม่ว่าจะมาจากที่ใดก็ตาม"
 building_scriptorium_06: "หอจดหมายเหตุใหญ่"
 building_scriptorium_06_desc: "ผลงานวรรณกรรมจากทั่วโลกได้รับการแปลและเก็บรักษาไว้ที่นี่ เพื่อรักษาภูมิปัญญาของพวกเขาไว้ตลอดไป"
 building_scriptorium_07: "โรงเรียนการแปล"
 building_scriptorium_07_desc: "ผู้ศรัทธาได้รับการศึกษาในภาษาทั้งโบราณและต่างประเทศ ขยายความสามารถของห้องคัดลอกคัมภีร์ในการรักษาผลงานแห่งภูมิปัญญาและความรู้"
 building_scriptorium_08: "หอจดหมายเหตุลับ"
 building_scriptorium_08_desc: "วิหารแห่งนี้บัดนี้เป็นที่ตั้งของเครือข่ายหอจดหมายเหตุใต้ดินอันกว้างใหญ่ ซึ่งไม่เพียง แต่บรรจุผลงานของวิหารแห่งนี้เท่านั้น แต่ยัง รวมถึงผลงานมากมายที่กู้คืนมาจากต่างประเทศด้วย"
 building_type_burial_site_01: "สุสาน"
 building_type_burial_site_01_desc: "ด้วยการสร้างสุสานอันกว้างใหญ่สำหรับผู้ตายของเรา เราจะทั้งป้องกันไอพิษให้ห่างไกลจากประชาชนและให้สถานที่เคารพและระลึกถึงบรรพบุรุษของเรา"
 building_burial_site_01: "สุสานใหญ่"
 building_burial_site_01_desc: "สุสานอันกว้างใหญ่นี้เต็มไปด้วยแปลงสำหรับหลุมฝังศพทั่วไป และสุสานขนาดเล็กสองสามแห่งสำหรับบุคคลสำคัญ"
 building_burial_site_02: "สุสานใหญ่"
 building_burial_site_02_desc: "สุสานใหญ่ได้ถูกสร้างขึ้น เต็มไปด้วยพื้นที่สำหรับหลุมฝังศพทั่วไป และเป็นที่ตั้งของสุสานสองสามแห่งสำหรับนักบุญและนักรบที่เคารพนับถือ"
 building_burial_site_03: "มหาอนุสาวรีย์สุสาน"
 building_burial_site_03_desc: "สุสานได้ถูกขยายเป็นอนุสาวรีย์ผู้ตายที่สูงตระหง่าน ภายในเต็มไปด้วยหลุมฝังศพและห้องสวดมนต์เพื่อเคารพผู้ตาย"
 
 building_type_hunting_grounds_01:0 "พื้นที่ล่าสัตว์"
 building_type_hunting_grounds_01_desc:1 "กระจายอยู่ทั่วดินแดนเหล่านี้คือเรือนพักขนาดใหญ่หลายแห่งที่นายพรานล่าสัตว์ป่าสามารถรวมตัวกันและวางแผนการเดินทางของพวกเขาได้"
 building_hunting_grounds_01:1 "เรือนพักนายพราน"
 building_hunting_grounds_01_desc:1 "นายพรานมาประชุมกันในเรือนพักเหล่านี้เพื่อวางแผนการเดินทางเข้าสู่ป่า และยังทำหน้าที่เป็นสถานที่เก็บถ้วยรางวัลและพบปะสังสรรค์หลังจากการล่าที่ประสบความสำเร็จ"
 building_hunting_grounds_02:1 "คอกสุนัขล่าเนื้อ"
 building_hunting_grounds_02_desc:1 "คอกสุนัขล่าเนื้อเพาะพันธุ์สุนัขที่ว่องไว ซึ่งเป็นเพื่อนร่วมทางที่ยอดเยี่ยมสำหรับการล่า โดยปกติแล้วจะนำสุนัขล่าเนื้อจำนวนมากมาด้วยในการล่า แต่ละครั้ง"
 building_hunting_grounds_03:1 "กรงนก"
 building_hunting_grounds_03_desc:1 "เพื่อนร่วมทางที่สำคัญที่สุดอันดับสองสำหรับนายพรานคือนกล่าเหยื่อ ซึ่งหลายตัวถูกเลี้ยงไว้ในกรงนก"
 building_hunting_grounds_04:1 "หอคอยล่าสัตว์"
 building_hunting_grounds_04_desc:1 "เพื่อติดตามและมองหาเหยื่อ ยามเฝ้าดูในหอคอยทั่วดินแดน รายงานสิ่งที่พวกเขาเห็นกลับไปยังนายพราน"
 building_hunting_grounds_05:1 "คอกม้านายพราน"
 building_hunting_grounds_05_desc:2 "นายพรานที่ประสบความสำเร็จต้องการพาหนะที่รวดเร็ว แข็งแกร่ง และไม่เกรงกลัวเสมอ คอกม้านายพรานจัดหาสายพันธุ์พิเศษที่ทำผลงานได้ดีในการเดินทางไกล"
 building_hunting_grounds_06:1 "กระท่อมพรานป่า"
 building_hunting_grounds_06_desc:2 "พรานป่าท่องไปในพื้นที่ล่าสัตว์เพื่อค้นหาเหยื่อ แม้ว่าพวกเขาจะทำงานคนเดียว แต่ก็มีความสามารถมากพอที่จะจัดการกับเหยื่อขนาดเล็กได้ด้วยตนเอง"
 building_hunting_grounds_07:1 "เขตสงวนล่าสัตว์"
 building_hunting_grounds_07_desc:1 "ผืนดินขนาดใหญ่ถูกกำหนดให้เป็นเขตสงวน ซึ่งป้องกันไม่ให้นายพรานที่ไม่ได้รับอนุญาตล่าสัตว์ภายใน สิ่งนี้ ทำให้มั่นใจได้ว่ามีเหยื่อมากมายสำหรับนายพรานทางการเสมอ แม้ว่าบางครั้งจะมีพวกลักลอบล่าสัตว์หลุดรอดไปบ้าง..."
 building_hunting_grounds_08:1 "เรือนพักผู้ดูแลสัตว์ป่า"
 building_hunting_grounds_08_desc:1 "ผู้ดูแลสัตว์ป่ารับผิดชอบความเป็นอยู่ที่ดีของผืนดินและสัตว์ทั้งหมดในนั้น เมื่อใดก็ตามที่ขุนนางตัดสินใจไปล่าสัตว์ ผู้ดูแลสัตว์ป่าจะรู้ว่าต้องส่งพวกเขาไปที่ไหน เพื่อให้การล่าของพวกเขาพบเหยื่อ"
 
 building_type_stables_01:0 "คอกม้า"
 building_type_stables_01_desc:1 "ม้าใช้งาน ม้าบรรทุกของ และสัตว์ใช้งานอื่น ๆ ต้องการอาคารเฉพาะ คอกม้ายังรับประกันว่ามีม้าสดใหม่พร้อมให้บริการสำหรับทุกคนที่สามารถจ่ายได้"
 building_stables_01:0 "คอกม้าขนาดเล็ก"
 building_stables_01_desc:0 "อาคารขนาดเล็กที่เหมาะสำหรับม้าสองสามตัวเป็นศูนย์กลางตามธรรมชาติสำหรับที่ดินถือครองใด ๆ เช่นเดียวกับเป็นจุดแวะพักแรกและสุดท้ายสำหรับผู้มาเยือนที่ขี่ม้ามา"
 building_stables_02:1 "ลานปล่อยม้า"
 building_stables_02_desc:1 "ลานภายนอกช่วยให้ม้าในคอกสามารถยืดเส้นยืดสาย เล็มหญ้า และเพลิดเพลินกับอากาศบริสุทธิ์ได้"
 building_stables_03:0 "โรงเก็บหญ้าแห้ง"
 building_stables_03_desc:0 "ชุดโรงเก็บหญ้าแห้งอย่างง่ายช่วยให้แน่ใจว่ามีอาหารสำหรับม้าอย่างสม่ำเสมอนอกช่วงเวลาเล็มหญ้า"
 building_stables_04:0 "สถานีส่งข่าว"
 building_stables_04_desc:0 "ด้วยม้าประจำการและรถม้าที่กระจายอยู่ทั่วพื้นที่อย่างเพียงพอ ทำให้สามารถเดินทางทั้งวันทั้งคืนพร้อมกับสาส์นสำคัญ สินค้าเน่าเสียง่าย และความต้องการเร่งด่วนอื่น ๆ ได้"
 building_stables_05:0 "ห้องพักคนเลี้ยงม้า"
 building_stables_05_desc:0 "การเพิ่มห้องพักอย่างง่ายที่คนงานสามารถนอนหลับได้ช่วยให้พวกเขาออกมาจากคอกม้า ทำให้ชีวิตสะดวกสบายขึ้นทั้งสำหรับคนและสัตว์"
 building_stables_06:0 "รางระบายน้ำ"
 building_stables_06_desc:0 "รางที่ขุดในพื้นคอกม้าช่วยให้ม้าแห้งและอบอุ่น แทบไม่ต้องใช้ความพยายามใด ๆ"
 building_stables_07:0 "สมาคมช่างเกือกม้า"
 building_stables_07_desc:0 "ปริมาณงานและทักษะที่จำเป็นในการดูแลกีบม้าอย่างเหมาะสมส่งเสริมการเติบโตของสมาคมช่างเกือกม้า ซึ่งทำงานอย่างไม่รู้จักเหน็ดเหนื่อยในการทำ ปรับ และซ่อมแซมเกือกม้า"
 building_stables_08:0 "ฟาร์มเพาะพันธุ์ม้า"
 building_stables_08_desc:0 "การเพิ่มสิ่งอำนวยความสะดวกเฉพาะสำหรับการดูแลและเอาใจใส่ม้าที่เป็นแบบอย่างอันล้ำค่าที่สุดของความสมบูรณ์แบบของม้า สนับสนุนการเพาะพันธุ์ม้าศึกที่งดงามตัวใหม่ และ ทำให้ม้าที่เรามีอยู่แทบจะเปล่งประกาย"
 
 building_type_smiths_01:0 "โรงตีเหล็ก"
 building_type_smiths_01_desc:0 "ด้วยการถลุงแร่ในเตาหลอมและตีโลหะให้เป็นรูปทรงที่ต้องการ โรงตีเหล็กจึงจัดหาเครื่องมือและอาวุธที่จำเป็นให้กับชุมชนใกล้เคียง"
 building_smiths_01:0 "เตาถลุงเหล็กแบบบลูมเมอรี"
 building_smiths_01_desc:0 "ทั่วชนบท ควันลอยขึ้นจากเตาถลุงเหล็กแบบบลูมเมอรี โครงสร้างอย่างง่ายที่มีผนังทำจากดินเหนียวและหินทนความร้อน ซึ่งมีการเติมส่วนผสมของถ่านและแร่เหล็กบดจากด้านบนที่เปิดโล่งเพื่อทำเหล็กฟองน้ำ"
 building_smiths_02:0 "เครื่องสูบลม"
 building_smiths_02_desc:0 "สร้างจากหนังสัตว์ที่แข็งแรง เครื่องสูบลมมักดำเนินการโดยลูกศิษย์ของช่างตีเหล็ก สูบลมแรงอย่างต่อเนื่องเข้าไปในกองไฟ"
 building_smiths_03:0 "แผ่นดึงลวด"
 building_smiths_03_desc:0 "อุปกรณ์ที่ช่วยช่างตีเหล็กในการผลิตลวดสำหรับทำเกราะโซ่ ชิ้นส่วนเหล็กที่ได้รับความร้อนจะถูกดึงผ่านรูที่เล็กลงเรื่อย ๆ ซึ่งเป็นวิธีการทำงานที่ง่ายกว่าการตีด้วยค้อนอย่างลำบากบนเตาหลอม"
 building_smiths_04:0 "ย่านช่างตีเหล็ก"
 building_smiths_04_desc:0 "ช่างตีเหล็กได้รับการสนับสนุนอย่างยิ่งให้ประกอบอาชีพนอกพื้นที่ที่มีประชากรหนาแน่น เนื่องจากนวัตกรรมในการผลิตโลหะช่วยให้พวกเขาทำงานได้เกือบตลอดเวลา ความไม่พอใจของประชาชนในบริเวณใกล้เคียงจึงเพิ่มขึ้นตามเสียงค้อน แต่ละครั้งและไฟที่ลุกโชนในตอนกลางคืน"
 building_smiths_05:0 "ค้อนกล"
 building_smiths_05_desc:0 "ขับเคลื่อนด้วยกังหันน้ำหรือลูกศิษย์ที่โชคร้าย ลูกเบี้ยวหมุนอย่างง่ายจะยกค้อนขึ้น จากนั้นปล่อยให้ตกลงมาตามธรรมชาติในจังหวะที่สม่ำเสมอ"
 building_smiths_06:0 "โรงช่างทอง"
 building_smiths_06_desc:0 "การเพิ่มห้องสำหรับหล่อและทำงานกับทองคำและเงิน ซึ่ง แต่ละห้องมีโต๊ะทำงานและเตาหลอมที่ออกแบบมาเป็นพิเศษ ทำให้การทำงานกับเครื่องประดับและการชุบด้วยโลหะมีค่าทำได้ง่ายขึ้นมาก"
 building_smiths_07:0 "เตาถลุงเหล็กแบบพ่นลม"
 building_smiths_07_desc:0 "เตาถลุงเหล็กแบบพ่นลมทำงานร้อนตลอดวัน ถลุงเหล็ก ตะกั่ว และทองแดง คุณภาพของโลหะที่ผลิตได้นั้นยอดเยี่ยมเกินบรรยาย"
 building_smiths_08:0 "เหล็กหล่อ"
 building_smiths_08_desc:0 "อ่อนแอกว่าเล็กน้อย แต่ผลิตได้ถูกกว่ามากเมื่อเทียบกับวิธีอื่น เหล็กหล่อใช้ในการผลิตเครื่องมือหลากหลายประเภท เช่น ใบไถ ตะปู หรือคราด"
 
 building_type_horse_pastures_01:0 "ทุ่งเลี้ยงม้าศึก"
 building_type_horse_pastures_01_desc:0 "ใคร ๆ ก็สามารถถืออาวุธหยาบ ๆ และโจมตีเพื่อนมนุษย์ได้ เกือบทุกคนสามารถรวบรวมกลุ่มชาวนาที่ถืออาวุธหยาบ ๆ ได้ แต่จากความกลมกลืนอันละเอียดอ่อนของม้าที่เลี้ยงดูมาอย่างดี นักรบผู้ชำนาญ และอาวุธที่เหมาะสม นำโดยผู้บัญชาการที่เก่งกาจที่สุดเท่านั้น จึงจะเกิดกองกำลังรบที่ไม่มีใครเทียบได้เพื่อกวาดล้างไปทั่วปฐพี"
 building_horse_pastures_01:0 "การฝึกม้าป่า"
 building_horse_pastures_01_desc:0 "ม้าที่สามารถอยู่รอดได้ด้วยตัวเองในภูมิประเทศที่โหดร้ายมีสัญชาตญาณที่น่าทึ่ง ดังนั้น แทนที่จะทำลายพวกมัน เราจะใช้ความถนัดของพวกมันเพื่อช่วยนักรบของเรา"
 building_horse_pastures_02:0 "แส้หนังม้า"
 building_horse_pastures_02_desc:0 "แทนที่จะทำร้ายม้าด้วยเครื่องมือหยาบ ๆ เช่น เดือย นักรบของเราใช้แส้ที่มีห่วงหนังผูกรอบข้อมือของผู้ขี่ หลังจากใช้แส้แล้ว นักรบจะปล่อยให้มันห้อยหลวม ๆ เพื่อให้มือว่าง"
 building_horse_pastures_03:0 "อานม้านักธนู"
 building_horse_pastures_03_desc:0 "อานที่มีโกลนสูง ที่นั่งลึก โก่งอานสูง และพนักอานสูง ช่วยให้นักรบของเราสามารถขี่ต่อไปได้ ในขณะที่มุ่งเน้นไปที่การยิงธนูใส่ศัตรูของเราโดยสิ้นเชิง"
 building_horse_pastures_04:0 "หัวลูกศรเจาะเกราะ"
 building_horse_pastures_04_desc:0 "การโค่นม้าที่โดยปกติไม่สวมเกราะนั้นง่ายกว่าการเล็งเป้าและ ทำให้นักขี่ศัตรูบาดเจ็บมาก"
 building_horse_pastures_05:0 "เกราะหนังม้า"
 building_horse_pastures_05_desc:0 "ชุดเกราะเบาปกป้องสัตว์ทั้งตัวโดยไม่จำกัดการเคลื่อนไหวและความอดทนของม้า"
 building_horse_pastures_06:0 "คันธนูคอมโพสิตโค้งกลับ"
 building_horse_pastures_06_desc:0 "คันธนูคอมโพสิต ทำจากไม้ เขาสัตว์ และเอ็น ยึดติดกันด้วยกาวหนังสัตว์ เป็นอาวุธที่สมบูรณ์แบบสำหรับพลธนูบนหลังม้าชั้นยอดของเรา"
 building_horse_pastures_07:0 "ม้าสำรอง"
 building_horse_pastures_07_desc:0 "เมื่อม้าศึกล้า ผู้ขี่จะลงจากหลังม้าและเปลี่ยนไปขี่ตัวอื่น ม้าที่ใช้แล้วจะเดินทางต่อไปพร้อมกับผู้ขี่และม้าสำรองที่เหลือ แม้ว่าจะไม่มีน้ำหนักของผู้ขี่ก็ตาม วิธีการดังกล่าวช่วยให้กองทัพของเราสามารถครอบคลุมระยะทางมหาศาลและสามารถสอดแนมล่วงหน้ากองกำลังหลักได้อย่างต่อเนื่อง"
 building_horse_pastures_08:0 "กฎการทำสงครามบนหลังม้า"
 building_horse_pastures_08_desc:0 ""จงดูแลให้คนของท่านปล่อยทับทรวงบนหลังม้าให้หลวมและเอาบังเหียนออกจากปาก เว้น แต่เมื่อท่านอนุญาตให้พวกเขาล่าสัตว์ ด้วยวิธีนั้น พวกเขาจะไม่สามารถควบม้าหนีไปตามใจชอบได้ เมื่อกำหนดกฎเหล่านี้แล้ว จงดูแลจับกุมและเฆี่ยนตีผู้ใดก็ตามที่ฝ่าฝืน ผู้ใดก็ตามที่เพิกเฉยต่อคำสั่งนี้ จงตัดศีรษะเขา ณ ที่ที่เขายืนอยู่""
 
 building_type_warrior_lodges_01:0 "เรือนพักนักรบ"
 building_type_warrior_lodges_01_desc:0 "พันธะส่วนตัวที่หล่อหลอมขึ้นในสนามรบสมควรได้รับโถงแห่งการระลึกถึง ที่ ซึ่งนักรบในอดีตสามารถแบ่งปันเรื่องราวอันน่าอัศจรรย์ แต่ยังคงน่าเชื่อถือกับเยาวชนที่ตาเป็นประกาย"
 building_warrior_lodges_01:0 "โถงถ้วยรางวัล"
 building_warrior_lodges_01_desc:0 "ชีวิตในสนามรบและความทรงจำของมนุษย์เป็นสิ่งที่หายวับไปทั้งคู่ ในขณะที่กำแพงที่สมาชิกเรือนพัก แต่ละคนสามารถแขวนถ้วยรางวัลอันล้ำค่าของตนได้จะคงอยู่ยาวนานกว่ามาก"
 building_warrior_lodges_02:0 "ห้องพักเด็กรับใช้"
 building_warrior_lodges_02_desc:0 "ที่เก็บอุปกรณ์ที่เรียบง่ายและตารางการฝึกที่เข้มงวดที่กำหนดไว้ คือทั้งหมดที่จำเป็นสำหรับผู้ที่ยังเด็กเกินไปที่จะจำการรบในอดีตได้เรียนรู้จากผู้ที่แก่เกินไปที่จะเข้าร่วมแถวในอนาคต"
 building_warrior_lodges_03:0 "โถงเลี้ยงฉลอง"
 building_warrior_lodges_03_desc:0 "การเพิ่มโถงเลี้ยงฉลอง ซึ่งเต็มไปด้วยอาหารและเสียงหัวเราะเสมอ ตอบสนองต่อจำนวนการรบที่ได้รับการเฉลิมฉลองที่เพิ่มขึ้นในเรือนพักนักรบแห่งนี้"
 building_warrior_lodges_04:0 "ลานฝึกรูปขบวนรบ"
 building_warrior_lodges_04_desc:0 "บนลานที่จัดไว้โดยเฉพาะ ซึ่งจำลองภูมิประเทศที่กองทัพปะทะกัน กลุ่มนักรบสามารถเรียนรู้วิธีการต่อสู้และเคลื่อนที่เป็นหน่วยที่เหนียวแน่น กองทหารที่ฝึกที่นี่เป็นกองกำลังที่น่าเกรงขาม ได้เรียนรู้ที่จะไว้วางใจทั้งผู้บังคับบัญชาและทหารในแถวข้าง ๆ พวกเขา"
 building_warrior_lodges_05:1 "หลุมฝังศพนักรบ"
 building_warrior_lodges_05_desc:0 "ด้วยพื้นที่ศักดิ์สิทธิ์ที่ปลอดภัยสำหรับการฝังศพ สมาชิกที่เคารพนับถือของเรือนพักนักรบแห่งนี้สามารถพักผ่อนอย่างสงบสุขได้ตลอดไป ไม่ถูกจำกัดอยู่ในดินแดนต่างถิ่นอันหนาวเย็นของสนามรบอีกต่อไป... ในขณะเดียวกันก็ทำหน้าที่เป็นแรงบันดาลใจสำหรับนักรบรุ่นต่อ ๆ ไป"
 building_warrior_lodges_06:0 "โถงระลึกเกียรติคุณ"
 building_warrior_lodges_06_desc:0 "ในโถงเหล่านี้ นักขับลำนำและกวีที่ได้รับค่าตอบแทนอย่างดีกำลังสรรเสริญการกระทำของนักรบผู้กล้าหาญที่สุด เมื่อมีผู้คนรวมตัวกันเพียงพอ - หรือผู้อุปถัมภ์ที่ร่ำรวยพอปรารถนา - การแสดงทั้งหมดจะเกิดขึ้น จำลองการรบที่มีชื่อเสียงและชัยชนะในอดีต"
 building_warrior_lodges_07:1 "หอสมุดนักรบ"
 building_warrior_lodges_07_desc:0 "ผู้ฝึกหัดรุ่นเยาว์หลายรุ่นได้เรียนรู้ที่นี่ แต่เรียนรู้จากนักรบที่รอดชีวิตและยังคงอยู่เท่านั้น บัดนี้ขุมทรัพย์แห่งความรู้ที่สะสมไว้ และบางครั้งก็ขัดแย้งกัน สามารถเข้าถึงได้โดยเกือบทุกคนโดยเสียค่าธรรมเนียมเล็กน้อย"
 building_warrior_lodges_08:0 "ห้องพักผู้มาเยือน"
 building_warrior_lodges_08_desc:0 "โถงเหล่านี้ได้กลายเป็นจุดหมายปลายทางอันศักดิ์สิทธิ์ของการแสวงบุญทางโลก เป็นที่รู้จักและใฝ่ฝันไปทั่วทั้งในหมู่นักรบผู้ทะเยอทะยานและผู้มีประสบการณ์"
 
 building_type_hillside_grazing_01:0 "ทุ่งหญ้าเลี้ยงสัตว์เนินเขา"
 building_type_hillside_grazing_01_desc:0 "ไม่เหมาะสำหรับการทำฟาร์มและส่วนใหญ่ปกคลุมไปด้วยหญ้าและพืชอื่น ๆ ที่ม้าสามารถกินได้ เนินเขาเหล่านี้จึงถูกนำมาใช้เพื่อการเลี้ยงสัตว์เป็นหลัก"
 building_hillside_grazing_01:0 "ทุ่งเลี้ยงสัตว์เนินเขา"
 building_hillside_grazing_01_desc:0 "พื้นที่เปิดโล่งขนาดใหญ่เหมาะอย่างยิ่งสำหรับใช้เป็นทุ่งเลี้ยงสัตว์สำหรับม้าทุกขนาดและทุกประเภท ทุกคนที่มีม้ามีสิทธิ์ใช้ทุ่งหญ้าเลี้ยงสัตว์เหล่านี้ สนับสนุนการเกษตรและทหารม้าในท้องถิ่น"
 building_hillside_grazing_02:0 "คนเลี้ยงสัตว์"
 building_hillside_grazing_02_desc:0 "เมื่อการเลี้ยงม้ามีความสำคัญต่อเศรษฐกิจท้องถิ่นมากขึ้น ทุ่งหญ้าเลี้ยงสัตว์แห่งนี้จึงรองรับผู้คนจำนวนมากที่เกี่ยวข้องกับการต้อนสัตว์"
 building_hillside_grazing_03:0 "พื้นที่เลี้ยงสัตว์ขยาย"
 building_hillside_grazing_03_desc:0 "แม้ว่านี่จะเป็นพื้นที่ที่เอื้อต่อการเลี้ยงสัตว์โดยธรรมชาติ แต่ก็ยังมีวิธีที่จะขยายพื้นที่ที่มีอยู่ได้ สามารถตัดต้นไม้และกำจัดหินได้ การทวงคืนที่ดินจากธรรมชาติไม่เคยหยุดนิ่งจริง ๆ"
 building_hillside_grazing_04:0 "ฟาร์มม้า"
 building_hillside_grazing_04_desc:0 "พื้นที่เกษตรกรรมที่ใช้งานได้ในบริเวณนี้ ในที่สุดก็จะถูกซื้อโดยชาวนาเลี้ยงม้า ซึ่งผักและผลผลิตขนาดเล็กสามารถช่วยสนับสนุนแรงงานที่เพิ่มขึ้นของพวกเขาได้"
 building_hillside_grazing_05:0 "ฟาร์มม้าขนาดเล็ก"
 building_hillside_grazing_05_desc:0 "เมื่อเวลาผ่านไป ฟาร์มเฉพาะทางจำนวนหนึ่ง ซึ่งมีการเพาะพันธุ์ เลี้ยง และฝึกม้า ได้กลายเป็นส่วนสำคัญของเศรษฐกิจท้องถิ่น"
 building_hillside_grazing_06:0 "ตลาดม้า"
 building_hillside_grazing_06_desc:0 "การค้าม้าเป็นส่วนหนึ่งตามธรรมชาติของการเลี้ยงและเพาะพันธุ์ม้า เมื่อธุรกิจพัฒนาขึ้น เมืองตลาดม้าที่ถาวรไม่มากก็น้อยจะเริ่มก่อตัวขึ้นตามฤดูกาล"
 building_hillside_grazing_07:0 "ผู้ดูแลม้า"
 building_hillside_grazing_07_desc:0 "เพื่อที่จะเพาะพันธุ์และเลี้ยงม้าศึกคุณภาพสูง จำเป็นต้องมีใครสักคนที่จะดูแลอาการป่วยและการบาดเจ็บต่าง ๆ ของพวกมัน รวมถึงประเมินคุณภาพของพวกมันอย่างเป็นระบบ เมื่อการเลี้ยงม้ามีความสำคัญมากขึ้นในบริเวณนี้ ผู้ดูแลม้าที่จะดูแลม้าก็จะมีความสำคัญมากขึ้น เช่นกัน"
 building_hillside_grazing_08:0 "ฟาร์มม้าขนาดใหญ่"
 building_hillside_grazing_08_desc:0 "เมื่อเวลาผ่านไป ทุ่งหญ้าเลี้ยงสัตว์ทั้งหมดได้ถูกรวมอยู่ภายใต้ฟาร์มขนาดใหญ่จำนวนหนึ่ง ซึ่งรับผิดชอบในการเพาะพันธุ์และฝึกม้าศึกที่แข็งแกร่งจำนวนมาก"
 
 building_type_windmills_01:0 "กังหันลม"
 building_type_windmills_01_desc:0 "กังหันลมตั้งอยู่ในพื้นที่ที่มีลมแรงที่สุด เช่น บนเนินเขาหรือริมชายฝั่ง ซึ่งแตกต่างจากโรงสีพลังน้ำ กังหันลมจะไม่หยุดทำงานเมื่อแม่น้ำกลายเป็นน้ำแข็งและสามารถโม่ได้ตลอดทั้งปี"
 building_windmills_01:0 "กังหันลมอย่างง่าย"
 building_windmills_01_desc:0 "ใบพัดแนวตั้งอย่างง่าย ที่เพิ่มเข้าไปด้านบนของโรงสีที่ใช้สัตว์หมุน ไม่เพียง แต่เพิ่มกำลังให้กับโรงสีเท่านั้น แต่ยังช่วยรักษาแรงของสัตว์ใช้งานได้นานขึ้นอีกด้วย"
 building_windmills_02:0 "พาเนโมน"
 building_windmills_02_desc:0 "พาเนโมนคือกังหันลมที่วางในแนวตั้ง โดยครึ่งหนึ่งของกังหันลมถูกกำบังจากลม สิ่งนี้ ทำให้มั่นใจได้ว่าใบพัดด้านรับลมจะไม่ต้านการหมุน"
 building_windmills_03:0 "ใบพัดกังหันลมหมุนได้"
 building_windmills_03_desc:0 "ด้วยความชาญฉลาดเล็กน้อยในการออกแบบ ใบพัดที่หมุนกลับจะหมุนต้านลมได้อย่างรวดเร็ว"
 building_windmills_04:0 "กังหันน้ำพลังลม"
 building_windmills_04_desc:0 "ด้วยการใช้พลังงานลมเพื่อหมุนกังหันน้ำ ทำให้เกิดการไหลของน้ำในคลองหรือท่อไม้อย่างง่าย หินโม่และหินบดสามารถวางในตำแหน่งที่เข้าถึงได้ง่ายขึ้น"
 building_windmills_05:0 "กังหันลมแนวนอน"
 building_windmills_05_desc:0 "เมื่อใบพัดทุกใบผลักไปในทิศทางที่ถูกต้อง พลังงานมากขึ้นสามารถส่งไปยังหินโม่หลายก้อนได้ แม้ว่างานมักจะถูกขัดจังหวะโดยการเปลี่ยนแปลงทิศทางลม ซึ่งต้องมีการปรับกังหันลมทั้งหมดด้วยตนเอง"
 building_windmills_06:0 "โรงสีเสา"
 building_windmills_06_desc:0 "ด้วยกังหันลมทั้งหลังวางอยู่บนเสาที่แข็งแรง ทำให้สามารถหมุนไปตามทิศทางลมได้อย่างง่ายดาย การเปลี่ยนแปลงความแรงของลมต้องมีการปรับด้วยตนเอง โดยการพับใบพัดและถ่วงน้ำหนักปีก เพื่อให้การหมุนคงที่"
 building_windmills_07:0 "ชุดเกียร์"
 building_windmills_07_desc:0 "การหมุนช้า ๆ ของใบพัดกังหันลมอันทรงพลังถูกเร่งความเร็วด้วยการเพิ่มชุดเกียร์ไม้อย่างง่าย ช่วยให้โรงสีหมุนได้เร็วขึ้น สิ่งนี้ ทำให้เหมาะสมกับวัสดุส่วนใหญ่ที่นำมาแปรรูปมากขึ้น"
 building_windmills_08:0 "โรงสีหอคอย"
 building_windmills_08_desc:0 "ตัวกังหันลมเป็นงานก่ออิฐอย่างดี มีเพียงส่วนบนเท่านั้นที่ยังคงเป็นไม้ เพื่อให้ใบพัดหันรับลมได้ ไม่มีพายุหรืออัศวินที่หลงทางใดสามารถโค่นหอคอยนี้และขัดขวางการโม่ได้"
 
 building_type_watermills_01:0 "โรงสีพลังน้ำ"
 building_type_watermills_01_desc:0 "โรงสีพลังน้ำเปลี่ยนการเคลื่อนที่ของน้ำทุกรูปแบบ ตั้งแต่น้ำขึ้นน้ำลงไปจนถึงน้ำตก ให้เป็นการหมุนที่ใช้สำหรับการโม่ การเลื่อย การบด และการอัดผ้า ใบอนุญาตประกอบกิจการโรงสีพลังน้ำเป็นแหล่งภาษีเพิ่มเติมที่ง่ายและเชื่อถือได้สำหรับเจ้าของที่ดินถือครอง"
 building_watermills_01:0 "กังหันน้ำแบบอันเดอร์ช็อต"
 building_watermills_01_desc:0 "กังหันอย่างง่ายที่วางอยู่ในแม่น้ำที่ไหลเชี่ยวสามารถทำงานได้มากกว่าโรงสีที่ใช้คนหรือม้าหมุนมาก และที่สำคัญที่สุดคือ จะไม่มีวันเหนื่อยหรือขอค่าจ้าง"
 building_watermills_02:0 "ข้อเหวี่ยงและก้านสูบ"
 building_watermills_02_desc:0 "ด้วยชุดเกียร์ไม้อย่างง่าย ความเร็วในการหมุนของหินโม่จึงไม่ผูกติดกับความผันผวนของสภาพอากาศโดยตรงอีกต่อไป"
 building_watermills_03:0 "กังหันน้ำแบบโอเวอร์ช็อต"
 building_watermills_03_desc:0 "การใช้ความแตกต่างของระดับน้ำ ซึ่งเกิดขึ้นตามธรรมชาติหรือเกิดจากความชาญฉลาดของมนุษย์เล็กน้อย เป็นวิธีสร้างแรงบิดที่มีประสิทธิภาพและเชื่อถือได้มากกว่ามาก"
 building_watermills_04:0 "โรงสีอุตสาหกรรม"
 building_watermills_04_desc:0 "สิ่งที่เริ่มต้นจากการเป็นโรงสีข้าวบาร์เลย์อย่างง่าย ซึ่งส่วนใหญ่แปรรูปสินค้าเกษตร บัดนี้ดึงดูดการค้าอื่น ๆ คนขนของของสมาคมกำลังรอจนกว่าโรงสีจะบดมัสตาร์ด อัดผ้า หรือบดแร่ของพวกเขา"
 building_watermills_05:0 "ถนนที่เป็นระเบียบ"
 building_watermills_05_desc:0 "ผู้บังคับใช้กฎหมายที่ได้รับการว่าจ้าง ที่พักพิง ใบผ่านทาง และแม้ แต่โรงเตี๊ยม ที่วางอยู่ตามถนนที่นำไปสู่โรงสี จัดระเบียบและให้บริการแก่ผู้ที่รอคิว เกวียนที่ลากด้วยม้าหรือคน ซึ่งเต็มไปด้วยสินค้าที่กำลังจะถูกโม่ เช่น ไม้ซุง ป่าน หรือหนังสัตว์ กำลังเข้าแถวทั้งวันทั้งคืน"
 building_watermills_06:0 "โรงสีเรือ"
 building_watermills_06_desc:0 "เรือบรรทุกที่ทอดสมออย่างถาวรอยู่กลางแม่น้ำกำลังใช้ประโยชน์จากกระแสน้ำที่แรงที่สุด บนแม่น้ำที่คดเคี้ยว เรือบรรทุกสามารถย้ายไปจอดที่โค้งด้านนอกได้โดยไม่ต้องใช้ความพยายามมากนัก"
 building_watermills_07:0 "คันกั้นน้ำและเขื่อน"
 building_watermills_07_desc:0 "ชุดคันกั้นน้ำ เขื่อน และคลองเทียม สำหรับทั้งกังหันน้ำแบบอันเดอร์ช็อตและโอเวอร์ช็อต รองรับความต้องการในการโม่ที่เพิ่มขึ้น ด้วยจุดที่เหมาะสมตามธรรมชาติเกือบทุกจุดถูกครอบครองแล้ว ทางน้ำที่ขุดขึ้นใหม่จึงพาดผ่านชนบท"
 building_watermills_08:0 "โรงทำดินปืน"
 building_watermills_08_desc:0 "โรงสีแยกต่างหาก ซึ่งตั้งอยู่ห่างไกลจากอุตสาหกรรมอื่น ๆ อุทิศตนอย่างเต็มที่เพื่อการโม่ถ่านและกำมะถันอย่างมีประสิทธิภาพและ #EMP ค่อนข้าง#! ปลอดภัย"
 
 building_type_caravanserai_01:0 "โรงเตี๊ยมคาราวาน"
 building_type_caravanserai_01_desc:0 "ที่พักพิงที่ตั้งอยู่ในภูมิประเทศที่ไม่เอื้ออำนวย ซึ่งต้อนรับนักเดินทางที่เหนื่อยล้า ในขณะที่พยายามกันพวกที่ไม่น่าคบหาออกไป"
 building_caravanserai_01:0 "โรงเตี๊ยมคาราวานขนาดเล็ก"
 building_caravanserai_01_desc:0 "อาคารสี่เหลี่ยมผืนผ้าอย่างง่ายที่ให้สิ่งอำนวยความสะดวกพื้นฐานสำหรับนักเดินทางและพ่อค้า เพื่อให้พวกเขาสามารถพักผ่อนและฟื้นกำลังในระหว่างการเดินทางไกล"
 building_caravanserai_02:0 "แผงค้า"
 building_caravanserai_02_desc:0 "แผงค้าขนาดเล็ก ขายเสบียงพื้นฐานสำหรับการเดินทาง ด้วยจุดเติมเสบียงที่รับประกัน กองคาราวานสามารถบรรทุกสินค้าค้าขายได้มากขึ้น"
 building_caravanserai_03:0 "ห้องพักยาม"
 building_caravanserai_03_desc:0 "การเพิ่มห้องพักยามถาวรและชุดหอสังเกตการณ์ ซึ่งมียามเฝ้าระวังประจำการอยู่ ปกป้องอย่างแข็งขันจากอันตรายที่ซุ่มซ่อนอยู่ในความมืดมิดยามค่ำคืน"
 building_caravanserai_04:0 "โถงพ่อค้า"
 building_caravanserai_04_desc:0 "ในโถงเหล่านี้ พ่อค้าจากทุกมุมโลกกำลังแลกเปลี่ยนสินค้าค้าขายและแบ่งปันเรื่องราวจากดินแดนที่พวกเขาเดินทางผ่าน"
 building_caravanserai_05:0 "ด่านศุลกากร"
 building_caravanserai_05_desc: "ท่ามกลางความร้อนแรงของแสงแดด เจ้าหน้าที่หน้าตาเคร่งขรึมชั่งน้ำหนัก ลงทะเบียน และเก็บภาษีสินค้าค้าขายทั้งหมดที่ผ่านโรงเตี๊ยมคาราวานแห่งนี้อย่างเหมาะสม ในเงามืด บุคคลหน้าตาใจดีเสนอหนทางในการขนย้ายสินค้าด้วยค่าธรรมเนียมที่... #EMP เหมาะสม#! ยิ่งกว่า"
 building_caravanserai_06:0 "โรงช่างฝีมือ"
 building_caravanserai_06_desc:0 "ด้วยวัตถุดิบที่อุดมสมบูรณ์และผู้อุปถัมภ์ที่ร่ำรวย ช่างฝีมือสามารถสร้างสรรค์และขายสิ่งประดิษฐ์ที่งดงามได้"
 building_caravanserai_07:0 "โรงอาบน้ำ"
 building_caravanserai_07_desc: "โรงอาบน้ำที่กว้างขวางตอบสนองแม้กระทั่งความปรารถนาที่หรูหราที่สุด สำหรับผู้ที่เดินทางด้วยงบประมาณที่จำกัด พวกมันให้ความสดชื่นที่เรียบง่าย แต่ก็เป็นที่ต้อนรับ"
 building_caravanserai_08:0 "ห้องพักหลวง"
 building_caravanserai_08_desc:0 "การเพิ่มห้องพักที่เหมาะสมรองรับบุคคลสำคัญและผู้ทรงเกียรติที่สุดที่มาเยือนบ่อยครั้งได้อย่างเหมาะสม ทั้งจากอาณาจักรนี้และจากที่อื่น ๆ"
 
 building_type_workshops_01:0 "โรงช่างยุทธภัณฑ์"
 building_type_workshops_01_desc:0 "ช่างทำลูกธนู ช่างทำคันธนู และช่างไม้ทำงานในโรงช่างเหล่านี้เพื่อสร้างอาวุธล้อมเมืองและจัดหาเสบียงให้กับกองทหารสำหรับการทัพที่ยืดเยื้อ"
 building_workshops_01:0 "สนามยิง"
 building_workshops_01_desc:0 "พื้นที่ขนาดใหญ่ได้ถูกเคลียร์สิ่งกีดขวางเพื่อรองรับพลธนูหรือวิศวกรล้อมเมืองด้วยพื้นที่สำหรับทดลองสินค้าและฝึกฝนทักษะของพวกเขา"
 building_workshops_02:0 "โรงทำเชือก"
 building_workshops_02_desc:0 "ทั้งวันทั้งคืน ในคูแคบยาวที่กำบังจากสภาพอากาศได้บางส่วน คนงานกำลังวางและถักเชือกและเส้นด้าย ทั้งจากพืชและสัตว์"
 building_workshops_03:0 "โรงเก็บเส้นเชือก"
 building_workshops_03_desc:0 "โรงเก็บของเฉพาะเก็บสต็อกพร้อมใช้งานสำหรับคันธนู หน้าไม้ และอาวุธล้อมเมืองแบบบิด"
 building_workshops_04:0 "สมาคมนักขุดอุโมงค์"
 building_workshops_04_desc:0 "แม้จะดูเรียบง่ายหลอกตา แต่การขุดอุโมงค์ระหว่างการล้อมเมืองเป็นอาชีพที่ต้องใช้ความทุ่มเทและความเชี่ยวชาญอย่างมาก ผู้ที่รอดชีวิตจากการล้อมเมืองครั้งแรกสามารถแบ่งปันความรู้และทักษะเชิงปฏิบัติกับอาสาสมัครที่กระตือรือร้นได้"
 building_workshops_05:0 "สมาคมช่างทำลูกธนู"
 building_workshops_05_desc:0 "ไม่ได้เป็นส่วนหนึ่งของสมาคมช่างทำคันธนูอีกต่อไป เนื่องจากความต้องการที่เพิ่มขึ้นทั้งอาวุธและกระสุน สมาคมช่างทำลูกธนูแยกต่างหากทำงานอย่างไม่รู้จักเหน็ดเหนื่อยเพื่อจัดหาลูกธนูทั้งหมดที่จำเป็นเพื่อดำรงกองทหารในสนามรบ"
 building_workshops_06:0 "โถงนักคณิตศาสตร์"
 building_workshops_06_desc:0 "การปรับพารามิเตอร์เครื่องยิงแบบบิดซ้ำ ๆ ด้วยการลองผิดลองถูก เพื่อให้ได้ความแม่นยำและระยะที่ดีขึ้น ได้นำวิศวกรล้อมเมืองบางคนของเราให้เริ่มจดบันทึกวิธีการที่ประสบความสำเร็จของพวกเขา บัดนี้ม้วนกระดาษหนังของพวกเขาเต็มโถงทั้งหมด มีชีวิตชีวาด้วยความโกลาหลและการสนทนา"
 building_workshops_07:0 "ขนาดอาวุธมาตรฐาน"
 building_workshops_07_desc:0 "ด้วยบัญชีแยกประเภทที่เต็มไปด้วยความยาวที่ต้องการของคานไม้ต่าง ๆ ในที่สุดเราก็สามารถรับประกันได้ว่า กระสุน น้ำหนัก 90 กิโลกรัมจะถูกขว้างไปไกล 300 เมตรพอดี ภายใต้สภาพอากาศที่เหมาะสม ส่วนใหญ่แล้ว"
 building_workshops_08:0 "โรงเก็บดินปืน"
 building_workshops_08_desc:0 "อาคารแยกต่างหากที่แข็งแรงพร้อมนโยบายการเข้าที่เข้มงวด ทำหน้าที่เป็นที่เก็บดินปืนปริมาณมหาศาล เพื่อใช้สำหรับระเบิดเจาะทะลวงที่ทรงพลังในการสงครามอุโมงค์หรือเป็นเชื้อเพลิงขับเคลื่อนสำหรับปืนใหญ่บอมบาร์ด"
 
 building_type_wind_furnace_01:0 "เตาถลุงลม"
 building_type_wind_furnace_01_desc:0 "ตั้งอยู่ในภูมิประเทศที่เป็นเนินเขาบนชายฝั่งมหาสมุทร ที่ ซึ่งลมมรสุมพัดกระทบแผ่นดินเป็นครั้งแรก เตาถลุงลมถลุงเหล็กกล้าที่มีชื่อเสียงระดับโลก ซึ่งมีคุณภาพไร้ที่ติ"
 building_wind_furnace_01:0 "เตาถลุงลมขนาดเล็ก"
 building_wind_furnace_01_desc:0 "เตาหลอมที่หันหน้าไปทางทิศตะวันตกโดยตรง เพื่อให้สามารถรับและใช้ลมที่พัดเข้ามาได้มากที่สุด"
 building_wind_furnace_02:0 "หัวฉีดลมแบบใช้ซ้ำได้"
 building_wind_furnace_02_desc: "หัวฉีดลม ซึ่งเป็นช่องรับอากาศโลหะเข้าไปในเตาหลอม ได้รับการติดตั้งอย่างระมัดระวังตรงกลาง เพื่อให้มีความเสถียรของอากาศภายในระดับหนึ่ง ลดผลกระทบของลมกระโชก สำหรับการถลุงครั้งต่อไป พวกมันจะถูกนำกลับมาใช้ใหม่โดยวางไว้ที่ด้านล่างของผนังด้านหน้า ช่วยให้ตะกรันไหลออกจากเตาหลอมได้"
 building_wind_furnace_03:0 "ผนังด้านหน้าดินเหนียว"
 building_wind_furnace_03_desc:0 "ผนังด้านหน้าดินเหนียวของเตาหลอมได้รับการออกแบบอย่างประณีต เพื่อให้ทนทานต่อทั้งความร้อนและการก่อตัวของตะกรันในระหว่างการถลุง ในขณะเดียวกันก็แตกหักได้ง่ายเมื่อสิ้นสุดการถลุง"
 building_wind_furnace_04:0 "ขั้นตอนการอุ่นเตา"
 building_wind_furnace_04_desc:0 "การอุ่นเตาล่วงหน้าเป็นเวลานาน ซึ่งช่วยให้ถ่านเผาไหม้อย่างเหมาะสม ตามด้วยการเติมส่วนผสมของแร่และถ่านอย่างค่อยเป็นค่อยไป เสร็จสิ้นด้วยการเติมถ่านเพิ่มเติม"
 building_wind_furnace_05:0 "ผนังด้านหลังโค้ง"
 building_wind_furnace_05_desc:0 "รองรับด้วยหินตั้งตรงสองก้อน ความโค้งของผนังด้านหลังถาวรจำกัดการสัมผัสกับตะกรันที่ร้อนและกัดกร่อน ทำให้เตาหลอมทำงานได้นานขึ้นโดยไม่จำเป็นต้องสร้างใหม่ทั้งหมด"
 building_wind_furnace_06:0 "ผนังด้านหน้าที่ยาวขึ้น"
 building_wind_furnace_06_desc:0 "ผนังด้านหน้าที่ยาวขึ้นช่วยเพิ่มปริมาณเหล็กกล้าที่ผลิตได้ใน แต่ละการถลุง ในขณะที่ยังคงรักษาขนาดอื่น ๆ ไว้เท่าเดิม และด้วยเหตุนี้จึงรักษาคุณสมบัติอันยอดเยี่ยมของเตาหลอมและเหล็กกล้าไว้ได้"
 building_wind_furnace_07:0 "คนเผาถ่าน"
 building_wind_furnace_07_desc:0 "ห่างจากชายฝั่งมากกว่าเตาหลอม แถวของคนเผาถ่านกำลังให้ความร้อนแก่ไม้อย่างต่อเนื่องเพื่อจัดหาให้กับอุตสาหกรรมที่กำลังขยายตัว"
 building_wind_furnace_08:0 "การแปรรูปแร่เหล็ก"
 building_wind_furnace_08_desc:0 "ด้วยการบดแร่ให้ละเอียดขึ้น และย่างก่อนนำไปใส่ในเตาหลอม จะสามารถได้ผลผลิตที่มากขึ้นและมีคุณภาพดียิ่งขึ้น"
 
 building_type_theodosian_walls_01:0 "กำแพงธีโอโดเซียน"
 building_type_theodosian_walls_01_desc:1 "กำแพงธีโอโดเซียนถูกสร้างขึ้นในรัชสมัยของจักรพรรดิธีโอโดซิอุสที่ 2 ในช่วงต้นศตวรรษที่ 5 แต่ก็ยังคงเป็นหนึ่งในป้อมปราการที่น่าเกรงขามที่สุดที่สร้างขึ้นด้วยมือมนุษย์"
 building_theodosian_walls_01:0 "กำแพงธีโอโดเซียน"
 building_theodosian_walls_01_desc:0 "$building_type_theodosian_walls_01_desc$"
 
 building_type_aurelian_walls_01:0 "กำแพงเอาเรเลียน"
 building_type_aurelian_walls_01_desc:1 "กำแพงเอาเรเลียนถูกสร้างขึ้นในรัชสมัยของจักรพรรดิโรมัน เอาเรเลียน และ โพรบุส จนถึงทุกวันนี้ก็ยังคงให้การป้องกันที่น่าเกรงขาม ล้อมรอบเนินเขาทั้งเจ็ดของกรุงโรมไว้อย่างสมบูรณ์"
 building_aurelian_walls_01:0 "กำแพงเอาเรเลียน"
 building_aurelian_walls_01_desc:0 "$building_type_aurelian_walls_01_desc$"
 
 building_type_the_colosseum_01:0 "โคลอสเซียม"
 building_type_the_colosseum_01_desc:0 "โคลอสเซียมเป็นหนึ่งในอัฒจันทร์ที่ใหญ่ที่สุดที่เคยสร้างมาและได้เป็นเจ้าภาพจัดการแสดงนับไม่ถ้วน เช่น การต่อสู้ของกลาดิเอเตอร์ การล่าสัตว์ และแม้กระทั่งการจำลองการรบทางทะเล การก่อสร้างเริ่มขึ้นโดยจักรพรรดิโรมัน เวสปาเซียน ในปี ค.ศ. 72 และเสร็จสมบูรณ์ในปี ค.ศ. 80 ภายใต้ผู้สืบทอดตำแหน่งของพระองค์ ไททัส\n\nแม้จะมีประวัติศาสตร์ที่สดใส แต่การใช้งานหลักในปัจจุบันคือการเก็บเกี่ยวหินอ่อนและทองสัมฤทธิ์เพื่อนำไปใช้ที่อื่น"
 building_the_colosseum_01:0 "$building_type_the_colosseum_01$"
 building_the_colosseum_01_desc:0 "$building_type_the_colosseum_01_desc$"
 
 building_type_hadrians_wall_01:0 "กำแพงเฮเดรียน"
 building_type_hadrians_wall_01_desc:0 "กำแพงเฮเดรียนถูกสร้างขึ้นในสมัยโรมันเพื่อป้องกันชาวพิกต์ทางตอนเหนือไม่ให้เข้ามาในจังหวัดบริทานเนีย ปัจจุบันไม่มีจุดประสงค์ในการป้องกัน แต่หินเหล่านี้เป็นแหล่งวัสดุก่อสร้างราคาถูกและสะดวก!"
 building_hadrians_wall_01:0 "$building_type_hadrians_wall_01$"
 building_hadrians_wall_01_desc:0 "$building_type_hadrians_wall_01_desc$"
 
 building_type_offas_dyke_01:0 "คันดินออฟฟา"
 building_type_offas_dyke_01_desc:0 "คันดินออฟฟา ซึ่งเป็นคูยาวขนาบด้วยกำแพงดิน ถูกสร้างขึ้นโดยกษัตริย์แองโกล-แซกซอนแห่งเมอร์เซียเพื่อป้องกันพรมแดนที่ติดกับเวลส์ เชิงเทินดินที่ยกสูงนี้ให้ความได้เปรียบแก่ใครก็ตามที่ยืนอยู่ฝั่งกำแพง เนื่องจากผู้โจมตีต้องต่อสู้ในสมรภูมิที่เสียเปรียบ (สู้ขึ้นเนิน) จากคู"
 building_offas_dyke_01:0 "$building_type_offas_dyke_01$"
 building_offas_dyke_01_desc:0 "$building_type_offas_dyke_01_desc$"
 
 building_type_buddhas_of_bamian_01:1 "พระพุทธรูปแห่ง $c_bamian$"
 building_type_buddhas_of_bamian_01_desc:0 "สลักจากไหล่เขา พระพุทธรูปขนาดมหึมาแห่งบามิยันตั้งตระหง่านเหนือผู้มาเยือนทุกคน แม้ว่าบริเวณโดยรอบจะไม่ใช่ศูนย์กลางการเรียนรู้ทางพุทธศาสนาที่เจริญรุ่งเรืองเหมือนในอดีต แต่ก็ยังมีผู้แสวงบุญและนักวิชาการชาวพุทธจำนวนมากมาเยี่ยมชมพระพุทธรูป ผู้ปกครอง $rf_eastern$ ที่ชาญฉลาดอาจสามารถทำกำไรจากผู้แสวงบุญได้ นอกเหนือจากการได้รับข้อมูลเชิงลึกส่วนตัว"
 building_buddhas_of_bamian_01:0 "$building_type_buddhas_of_bamian_01$"
 building_buddhas_of_bamian_01_desc:0 "$building_type_buddhas_of_bamian_01_desc$"
 NOT_BUDDHAS_OF_BAMIAN_ENABLED:1 "[holder|E] ต้องนับถือศาสนาในกลุ่ม $rf_eastern$ [religious_family|E]"
 
 building_type_petra_01:0 "เปตรา"
 building_type_petra_01_desc:0 "นครเปตราเป็นสิ่งมหัศจรรย์ที่แท้จริงของโลกยุคโบราณ สลักขึ้นโดยตรงจากหินสีชมพูที่เกิดขึ้นตามธรรมชาติ นครแห่งนี้ตั้งตระหง่านเป็นสิ่งน่าพิศวงที่ดึงดูดความสนใจแม้กระทั่งสุลต่านผู้ยิ่งใหญ่ที่สุด"
 building_petra_01:0 "$building_type_petra_01$"
 building_petra_01_desc:0 "$building_type_petra_01_desc$"
 
 building_type_house_of_wisdom_01:0 "บัยตุลฮิกมะฮ์ (บ้านแห่งปัญญา)"
 building_type_house_of_wisdom_01_desc:0 "บัยตุลฮิกมะฮ์มีคอลเล็กชันหนังสือมากมาย และอาลักษณ์ในนั้นทำงานอย่างไม่รู้จักเหน็ดเหนื่อยทั้งกลางวันและกลางคืนเพื่อแปลผลงานวรรณกรรมที่ยิ่งใหญ่ยิ่งขึ้นไปอีก แหล่งที่มามีหลากหลายตั้งแต่กรีก เปอร์เซีย อินเดีย และอื่น ๆ อีกมากมาย – แท้จริงแล้ว มันบรรจุความรู้ของทั้งโลกไว้! ประภาคารอันส่องสว่างแห่งความรู้ของมนุษย์! และอยู่ห่างไกลจากพลม้าที่ไม่รู้หนังสือแห่งทุ่งหญ้าสเตปป์อย่างสบาย..."
 building_house_of_wisdom_01:0 "$building_type_house_of_wisdom_01$"
 building_house_of_wisdom_01_desc:0 "$building_type_house_of_wisdom_01_desc$"
 
 building_type_palace_of_aachen_01:1 "$building_palace_of_aachen_01$"
 building_type_palace_of_aachen_01_desc:0 "พระราชวังอาเคินได้รับเลือกจากชาร์เลอมาญให้เป็นศูนย์กลางอำนาจของจักรวรรดิการอแล็งเฌียง ทำหน้าที่ทั้งทางการเมืองและศาสนา และยังคงเป็นสถานที่ที่ยอดเยี่ยมสำหรับการจัดการชุมนุมที่สำคัญ"
 building_palace_of_aachen_01:0 "พระราชวังอาเคิน"
 building_palace_of_aachen_01_desc:0 "$building_type_palace_of_aachen_01_desc$"
 
 building_type_notre_dame_01:1 "$building_notre_dame_01$"
 building_type_notre_dame_01_desc:0 "หรือที่รู้จักกันในนาม 'แม่พระแห่งปารีส' มหาวิหารอันงดงามแห่งนี้อุทิศให้กับพระแม่มารี สร้างขึ้นในสไตล์กอทิก สร้างความประทับใจด้วยรูปปั้นจำนวนมากและหน้าต่างกุหลาบสีสันสดใสขนาดใหญ่\n\nด้านนอก มหาวิหารปกคลุมไปด้วยประติมากรรมที่เล่าเรื่องราวในพระคัมภีร์อย่างมีชีวิตชีวา ช่วยให้แม้ แต่ชาวนาที่ไม่รู้หนังสือก็สามารถเข้าใจถึงพระสิริของพระเจ้าได้!"
 building_notre_dame_01:0 "นอเทรอดาม"
 building_notre_dame_01_desc:0 "$building_type_notre_dame_01_desc$"
 
 building_type_hagia_sophia_01:1 "ฮาเกียโซเฟีย"
 building_type_hagia_sophia_01_desc:0 "ฮาเกียโซเฟียเป็นสิ่งมหัศจรรย์ทางวิศวกรรมอย่างแท้จริง โดยมีโดมขนาดมหึมาโดดเด่นเป็นลักษณะที่น่าประทับใจที่สุด สร้างเสร็จในปี ค.ศ. 537 โดยจักรพรรดิจัสติเนียนที่ 1 บัดนี้เป็นที่พำนักของอัครบิดรแห่งคริสตจักรอีสเทิร์นออร์ทอดอกซ์และตั้งตระหง่านเป็นอนุสาวรีย์แห่งศาสนาคริสต์\n\nและจะยังคงเป็น เช่นนี้ตลอดไป เพราะแน่นอนว่าไม่มีสิ่งใดสามารถโค่นล้มอำนาจของกรุงโรมได้"
 building_hagia_sophia_01:0 "มหาวิหารฮาเกียโซเฟีย"
 building_hagia_sophia_01_desc:0 "$building_type_hagia_sophia_01_desc$"
 building_hagia_sophia_02:0 "มัสยิดฮาเกียโซเฟีย"
 building_hagia_sophia_02_desc:0 "ฮาเกียโซเฟียเป็นสิ่งมหัศจรรย์ทางวิศวกรรมอย่างแท้จริง โดยมีโดมขนาดมหึมาและหออะซานอันน่าประทับใจสี่หอโดดเด่นเป็นลักษณะที่น่าประทับใจที่สุด เริ่มสร้างในปี ค.ศ. 537 โดยจักรพรรดิจัสติเนียนที่ 1 ตั้งแต่นั้นมาก็ได้กลายเป็นมัสยิดที่น่าเกรงขาม\n\nและจะยังคงเป็น เช่นนี้ตลอดไป เพราะแน่นอนว่าไม่มีสิ่งใดสามารถโค่นล้มอำนาจของรุมได้"
 
 building_type_dome_of_the_rock_01:0 "วิหารในเยรูซาเลม"
 building_type_dome_of_the_rock_01_desc:0 "โดมแห่งศิลาตั้งอยู่ใจกลางเนินพระวิหาร ในสถานที่ ซึ่งวิหารโซโลมอนและพระวิหารที่สองของชาวยิวเคยตั้งอยู่ กล่าวกันว่าศิลาฤกษ์ของวิหารเป็นสถานที่ที่พระเจ้าสร้างโลกและมนุษย์คนแรก อาดัม โดมแห่งศิลาและโบสถ์พระคูหาศักดิ์สิทธิ์ที่อยู่ใกล้เคียงดึงดูดผู้แสวงบุญในศาสนาอับราฮัมจากทั่วทุกมุมโลก"
 building_dome_of_the_rock_01:0 "โดมแห่งศิลา"
 building_dome_of_the_rock_01_desc:0 "$building_type_dome_of_the_rock_01_desc$"
 building_temple_in_jerusalem_01:0 "พระวิหารที่สาม"
 building_temple_in_jerusalem_01_desc:0 "หลายร้อยปีหลังจากการทำลายพระวิหารที่สอง ในที่สุดก็ถึงเวลาฟื้นฟูพระวิหารในเยรูซาเลม! พระวิหารที่สามนี้จะยืนหยัดผ่านการทดสอบของกาลเวลา ได้รับการปกป้องอย่างระแวดระวังจากทุกคนที่จะเห็นมันถูกทำลาย"
 
 building_type_stonehenge_01:0 "สโตนเฮนจ์"
