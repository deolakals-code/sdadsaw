 building_type_holy_site_mahabodhi_temple_01:0 "วัดมหาโพธิ์"
 building_type_holy_site_mahabodhi_temple_01_desc:0 "วัดมหาโพธิ์เป็นสถานที่ที่กล่าวกันว่าพระพุทธเจ้าทรงตรัสรู้ สถานที่แห่งนี้เป็นจุดหมายปลายทางสำคัญสำหรับการแสวงบุญของทั้งชาวพุทธและชาวฮินดู การก่อสร้างวัดเริ่มขึ้นราวปี ค.ศ. 200 โดยจักรพรรดิอโศก และตั้งแต่นั้นมาก็ได้รับการปรับปรุงและบูรณะหลายครั้ง"
 building_holy_site_mahabodhi_temple_01:0 "$building_type_holy_site_mahabodhi_temple_01$"
