 building_alhambra_02:0 "พระราชวังหลวง $building_type_alhambra_01$"
 building_alhambra_02_desc:1 "นับตั้งแต่วันที่เป็นเพียงซากปรักหักพังของโรมัน อัลฮัมบราได้รับการปรับปรุงให้เป็นพระราชวังหลวงที่คู่ควรกับจักรพรรดิ! ตัวอย่างอันเปล่งประกายของสถาปัตยกรรมท้องถิ่น สีของอาคารที่ตัดกับป่าโดยรอบ ทำให้นักกวีบรรยายว่า "ไข่มุกที่ประดับอยู่ในมรกต""
 
 building_type_shwedagon_pagoda_01:0 "เจดีย์ชเวดากอง"
 building_type_shwedagon_pagoda_01_desc:0 "เจดีย์ชเวดากองเป็นสถูปศักดิ์สิทธิ์ทางพุทธศาสนาที่สร้างขึ้นโดยชาวมอญประมาณปี ค.ศ. 500 เป็นที่ประดิษฐานพระบรมสารีริกธาตุที่มีชื่อเสียงมากมาย เช่น ไม้เท้าของพระกกุสันธพุทธเจ้า เครื่องกรองน้ำของพระโกนาคมนพุทธเจ้า ชิ้นส่วนจีวรของพระกัสสปพุทธเจ้า และเส้นพระเกศาแปดเส้นจากพระเศียรของพระโคตมพุทธเจ้า"
