 BUILDING_DEBUG_KEY: "#D DEBUG KEY:#! [BUILDING.GetKey]"
 BUILDING_DEBUG_FULL: "#D DEBUG KEY:#! [Building.GetKey]\n#D DEBUG DESC:#! [Building.GetDescKey]"
