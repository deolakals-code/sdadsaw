 building_type_visby_ringmur_01:0 "กำแพงเมืองวิสบี"
 building_type_visby_ringmur_01_desc:0 "กำแพงเมืองวิสบีปกป้องเมืองจากภัยคุกคามภายนอก เช่น โจรปล้นสะดม หรือ ชาวเดนมาร์ก นอกจากนี้ยังกันเจ้าหน้าที่เก็บภาษีที่ส่งมาจากสภาของกอตลันด์ได้อย่างมีประสิทธิภาพ! เพื่อไปให้ถึงความร่ำรวยภายใน ผู้โจมตีต้องจัดการกับหอคอยจำนวนมากที่มีพลธนูประจำการอยู่ก่อน"
