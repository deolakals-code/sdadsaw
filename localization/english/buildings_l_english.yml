 building_taghaza_mines_01_desc:0 "$building_type_taghaza_mines_01_desc$"
 building_taghaza_mines_02:0 "เหมืองทาฆาซา"
 building_taghaza_mines_02_desc:1 "เมื่อการตั้งถิ่นฐานเติบโตขึ้น เกลือก็ถูกสกัดมากขึ้นเรื่อย ๆ การหลั่งไหลเข้ามาของวิศวกรผู้มีความสามารถ ทำให้สามารถก่อสร้างเหมืองที่แท้จริงได้"
 building_taghaza_mines_03:0 "เหมืองทาฆาซาขนาดใหญ่"
 building_taghaza_mines_03_desc:0 "เมื่อการดำเนินงานเหมืองแร่เติบโตขึ้น เหมืองเองก็เติบโตขึ้น เช่นกัน มีการสร้างทางเข้าเพิ่มขึ้น และมีการขุดปล่องขนาดใหญ่ เพื่อให้สามารถสกัดเกลือได้มากขึ้น"
 building_taghaza_mines_04:0 "ศูนย์รวมเหมืองแร่ทาฆาซา"
 building_taghaza_mines_04_desc:0 "เมื่อการผลิตเกลือเพิ่มขึ้น ก็ได้ดึงดูดพ่อค้าและช่างฝีมือจากทั่วทุกมุมโลก"

 building_type_ijil_mines_01:0 "เหมืองเกลืออิจิล"
 building_type_ijil_mines_01_desc:0 "อิจิลเป็นหนึ่งในเหมืองเกลือที่เก่าแก่ที่สุดในแอฟริกาและในหลาย ๆ ทางเป็นหนึ่งในสถานีการค้าแห่งแรกของเครือข่ายการค้าข้ามทะเลทรายซาฮารา"
