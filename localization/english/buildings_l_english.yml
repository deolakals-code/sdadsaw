 building_type_castle_01:0 "ปราสาท"
 building_type_castle_01_desc:1 "ป้อมปราการที่ออกแบบมามิใช่เพียงเพื่อเป็นที่พำนักของตระกูลขุนนางผู้มีชื่อเสียงเท่านั้น หาก แต่ยังเพื่อปกป้องคุ้มครองเมืองและเรือกสวนไร่นาโดยรอบอีกด้วย"
 building_castle_01:1 "ม็อต"
 building_castle_01_desc:1 "ป้อมปราการขนาดย่อม แต่แข็งแกร่งยิ่งนักนี้ ตั้งอยู่บนเนินดินที่ถมสูงขึ้น"
 building_castle_02:1 "หอปราการ"
 building_castle_02_desc:1 "หอปราการ #weak (หรือ ดงจอง)#! คือหอคอยขนาดใหญ่ที่ใช้เป็นที่พำนักอันแข็งแกร่งและเป็นแนวป้องกันสุดท้าย"
 building_castle_03:1 "ปราสาทวงแหวน"
 building_castle_03_desc:1 "ปราสาทวงแหวนนั้นล้อมรอบด้วยกำแพงตั้งแต่สองชั้นขึ้นไป โดยกำแพงชั้นในจะสูงกว่ากำแพงชั้นนอก"
 building_castle_04:1 "ป้อมปราการใหญ่"
 building_castle_04_desc:1 "ป้อมปราการใหญ่นับเป็นสุดยอดแห่งการป้องกัน สามารถขับไล่การโจมตีของศัตรูและเป็นที่ตั้งของกองทหารขนาดใหญ่ได้"
 building_type_temple_01:0 "วิหาร"
 building_type_temple_01_desc:1 "ศาสนสถานที่ปกครองโดยคณะนักบวช ล้อมรอบด้วยหมู่บ้านของเหล่าไพร่ผู้มีศรัทธา"
 building_temple_01:1 "สักการสถาน"
 building_temple_01_desc:0 "$building_type_temple_01_desc$"
 building_temple_02:1 "เขตวิหาร"
 building_temple_02_desc:1 "วิหารตั้งอยู่ ณ ศูนย์กลางของหมู่บ้าน สร้างขึ้นอย่างประณีตโดยช่างฝีมือท้องถิ่นเพื่อแสดงความอุทิศตนต่อศรัทธา"
 building_temple_03:1 "ศาสนสถาน"
 building_temple_03_desc:1 "แม้วิหารจะรองรับศาสนิกชนได้จำนวนมาก แต่นั่นมิใช่จุดประสงค์เพียงอย่างเดียว — ยังต้องเป็นที่พำนักของคณะนักบวช รองรับหอสมุดขนาดใหญ่ และปกปักรักษาสิ่งศักดิ์สิทธิ์อีกด้วย การเพิ่มเติมส่วนศาสนสถานนี้ ทำให้มีพื้นที่กว้างขวางเพียงพอสำหรับผู้ศรัทธาในการสวดภาวนาเสมอ"
 building_temple_04:1 "มหาวิหาร"
 building_temple_04_desc:1 "เหล่าช่างฝีมือและสถาปนิกท้องถิ่นมิพึงพอใจกับวิหารขนาดเล็กและเรียบง่าย จึงได้ร่วมกันสร้างสรรค์ผลงานศิลปะที่แท้จริงขึ้น มหาวิหารแห่งนี้ดูราวกับจะเชื้อเชิญอำนาจแห่งสรวงสวรรค์ลงมาสู่ศาสนิกชนทุกคนที่ก้าวเข้าสู่โถงอันโอ่อ่าแห่งนี้"
 building_type_city_01:0 "นคร"
 building_type_city_01_desc:1 "นครอันมีประชากรหนาแน่น เป็นที่พำนักของชาวเมือง พ่อค้า และชาวบ้านผู้ขยันขันแข็งจำนวนมาก"
 building_city_01:1 "ศูนย์กลางหมู่บ้าน"
 building_city_01_desc:0 "$building_type_city_01_desc$"
 building_city_02:1 "นครใหญ่"
 building_city_02_desc:1 "นครแห่งนี้ได้ดึงดูดความสนใจของพ่อค้าและช่างฝีมือจากทั่วสารทิศ พ่อค้าผู้มั่งคั่งต่างมาตั้งร้านค้า และช่างฝีมือขยันขันแข็งก็ก่อสร้างบ้านเรือนใหม่แทบทุกวัน"
 building_city_03:1 "ศูนย์กลางนคร"
 building_city_03_desc:1 "นครมิได้จำกัดอยู่เพียงพื้นที่เดิมอีกต่อไป บัดนี้ได้ขยายครอบคลุมพื้นที่เรือกสวนไร่นาใกล้เคียงเข้าสู่ศูนย์กลางอันรุ่งเรือง นครแห่งนี้กว้างใหญ่และเปี่ยมด้วยความมั่งคั่งและโอกาส"
 building_city_04:1 "มหานครอันพลุกพล่าน"
 building_city_04_desc:1 "นครแห่งนี้เป็นที่รู้จักไปทั่วถึงโอกาสอันอุดมสมบูรณ์ภายใน — กล่าวกันว่าแม้ แต่ไพร่ที่ต่ำต้อยที่สุดก็สามารถพบโชคลาภได้ที่นี่ บ้านเรือนเรียงรายตามท้องถนนสุดลูกหูลูกตา เกวียนและสัตว์ต่าง ๆ ขวักไขว่ขนส่งสินค้าไปทุกหนแห่ง"

 building_type_temple_citadel_01: "ปราการวิหาร"
 building_type_temple_citadel_01_desc: "สถานที่แห่งการสักการะและการป้องกันอันทัดเทียมกัน กำแพงมหึมาโอบล้อมพื้นที่ศักดิ์สิทธิ์เหล่านี้ไว้"
 building_temple_citadel_01: "ป้อมวิหาร"
 building_temple_citadel_01_desc: "$building_type_temple_citadel_01_desc$"
 building_temple_citadel_02: "อารามล้อมกำแพง"
 building_temple_citadel_02_desc: "ปราการแห่งนี้มีความจุและการจัดระเบียบที่เพิ่มขึ้น ให้ที่พักพิงแก่ศาสนิกชนในท้องถิ่น และยังจัดเตรียมที่พักพำนักสำหรับทหารอย่างเพียงพอ เพื่อรับมือการจู่โจมใด ๆ"
 building_temple_citadel_03: "เขตวิหาร"
 building_temple_citadel_03_desc: "มีการจัดเตรียมอาคารเพิ่มเติมเพื่อความสะดวกสบายและประสิทธิภาพ ศาสนสถานแห่งนี้เตรียมพร้อมรับมือเหตุการณ์แทบทั้งปวง พลเมืองได้รับคำสั่งให้เฝ้าระวังบนกำแพง เช่นเดียวกับการสวดภาวนาในศาลเจ้าท้องถิ่น"
 building_temple_citadel_04: "ปราการสถานลี้ภัย"
 building_temple_citadel_04_desc: "สถานศักดิ์สิทธิ์แห่งนี้ได้รับการปกป้องอย่างดีด้วยป้อม หอคอย กำแพง คูน้ำ และด่านหน้าทางทหาร และดูเหมือนจะได้รับการคุ้มครองจากสวรรค์เบื้องบนด้วย ทำให้พลเมืองและศาสนิกชนจำนวนมากรู้สึกปลอดภัย"

 building_type_common_tradeport_01:0 "ท่าเรือพาณิชย์"
 building_type_common_tradeport_01_desc:1 "เรือใบพาณิชย์ขนถ่ายสินค้าขึ้นและลง ณ ท่าเรือแห่งนี้"
 building_common_tradeport_01:1 "ท่าเรือน้อย"
 building_common_tradeport_01_desc:1 "ท่าเรืออันเรียบง่ายตั้งอยู่ริมฝั่ง ช่วยให้เรือสามารถขนถ่ายสินค้าขึ้นลงได้โดยมิต้องใช้ความพยายามมากนัก"
 building_common_tradeport_02:1 "โรงทอแหจับปลา"
 building_common_tradeport_02_desc:1 "โรงงานสำหรับทอแหจับปลาได้ถูกจัดตั้งขึ้นที่นี่ มีการผลิตและซ่อมแซมแหอย่างไม่รู้จักเหน็ดเหนื่อยทั้งวันทั้งคืน"
 building_common_tradeport_03:1 "ท่าเรือพาณิชย์"
 building_common_tradeport_03_desc:1 "ท่าเรือได้กลายเป็นศูนย์กลางการค้าและการเดินทางในพื้นที่ เรือจากทั่วทุกชายฝั่งต่างมาที่นี่เพื่อทำการค้า"
 building_common_tradeport_04:1 "อู่ต่อเรือ"
 building_common_tradeport_04_desc:1 "ช่างต่อเรือผู้มีฝีมือมารวมตัวกันที่ท่าเรือแห่งนี้เพื่อสร้างและซ่อมแซมเรือให้กับผู้ที่เสนอราคาสูงสุด"
 building_common_tradeport_05:1 "ท่าเทียบเรือขยาย"
 building_common_tradeport_05_desc:2 "ท่าเทียบเรือที่มากขึ้นและใหญ่ขึ้นรองรับจำนวนเรือพาณิชย์ที่เพิ่มขึ้นเรื่อย ๆ"
 building_common_tradeport_06:1 "อู่เรือ"
 building_common_tradeport_06_desc: "การปรากฏขึ้นของอาคารสำหรับบำรุงรักษาเรือโดยเฉพาะถือเป็นก้าวสำคัญในการเปลี่ยนท่าเรือธรรมดาให้กลายเป็นศูนย์กลางอำนาจทางทะเลอันคึกคัก"
 building_common_tradeport_07:1 "ท่าเรือใหญ่"
 building_common_tradeport_07_desc:2 "ท่าเรือใหญ่นี้มีท่าเทียบเรือ อู่เรือ และลูกเรือฝีมือดีที่สุดในบริเวณนี้อย่างเหลือเฟือ สินค้าจำเป็นทั้งหมดสำหรับนักเดินทางระยะไกลสามารถหาได้ที่นี่ และพ่อค้า ชาวประมง และกองทัพต่างได้รับการสนับสนุนที่ต้องการทั้งหมด"
 building_common_tradeport_08:1 "อู่แห้ง"
 building_common_tradeport_08_desc:2 "ในอู่แห้งนั้น เรือจะถูกนำเข้าสู่ช่องทางแคบ จากนั้นจึงสูบน้ำออก เรือจะถูกค้ำไว้บนแท่นหิน ทำให้สามารถซ่อมแซมและบำรุงรักษาได้โดยง่ายดายยิ่งขึ้น"
 building_type_hall_of_heroes_01:0 "หอวีรชน"
 building_type_hall_of_heroes_01_desc:2 "โถงอันโอ่อ่าที่เหล่านักรบผู้กล้าสามารถมาพบปะและวางแผนการผจญภัยครั้งต่อไปได้"
 building_hall_of_heroes_01:0 "หอวีรชน I"
 building_hall_of_heroes_01_desc:0 "$building_type_hall_of_heroes_01_desc$"
