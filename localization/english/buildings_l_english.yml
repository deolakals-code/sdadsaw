 building_type_turda_mines_01_desc:0 "แหล่งเกลือขนาดใหญ่ของตอร์ดาเป็นศูนย์กลางเศรษฐกิจของทรานซิลเวเนียมานานหลายศตวรรษ เหมืองและตลาดเกลือยังคงเป็นแหล่งรายได้ที่ดีเยี่ยมสำหรับภูมิภาค"
