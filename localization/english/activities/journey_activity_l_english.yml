 suggestive_miniature_monument.desc: "รูปจำลองดินเหนียวนี้ ซื้อมาจาก [location.GetName] แสดงภาพ [location.Custom('GetSpecialBuildingPrefix')][location.GetHolding.GetSpecialBuildingType.GetName] \n\n[location.GetHolding.GetSpecialBuildingType.GetDescription] หอคอยที่ดูคล้ายอวัยวะเพศชายและรูปจำลองคนเปลือยอกน่าจะไม่ได้เป็นส่วนหนึ่งขององค์ประกอบดั้งเดิม"
 
 bp3_journey.1100.t: "นามหนึ่ง, ชั่วนิรันดร์"
 bp3_journey.1100.desc_intro: "ขณะที่ข้าเดินสำรวจบริเวณ ข้าสังเกตเห็นเครื่องหมายแปลกๆ บน [location.Custom('GetSpecialBuildingSurface')]\n\n"
 bp3_journey.1100.desc_name: "เมื่อเข้าไปดูใกล้ๆ มันอ่านว่า: #EMP '[ancient_vandal.GetFullName] อยู่ที่นี่ จงมองดูนามของข้าและรู้ไว้ว่าข้าคือ [ancient_vandal.Custom('FormalComplimentAdjective')]!'#! หืม ถ้า [ancient_vandal.GetSheHe] สามารถสลักชื่อ [ancient_vandal.GetHerHis] ไว้ให้ผู้คนที่ผ่านไปมาด้วยความสงสัยใคร่รู้ได้ชื่นชมไปชั่วนิรันดร์ เช่นนั้นแล้วบางที..."
 bp3_journey.1100.desc_first: "มันบริสุทธิ์ ไม่ถูกแตะต้อง อยู่ในสายตาของผู้คนที่ผ่านไปมาอย่างชัดเจน... รอคอยให้ใครสักคนมาจารึกชื่อของตนให้เป็นอมตะ"
 bp3_journey.1100.desc_outro: "\n\nข้าเหลือบมองลงไปเห็นหินคล้ายสิ่วกวักมือเรียกข้า"
 bp3_journey.1100.knowledge_hoarding: "ต้องมีปัญญาซ่อนอยู่ในหมู่รอยแกะสลักเหล่านี้!"
 bp3_journey.1100.curiosity: ""[ROOT.Char.GetFirstNameNoTooltip], สหายแห่งชาว [location.GetCulture.GetCollectiveNounNoTooltip], เดินอยู่ที่นี่""
 bp3_journey.1100.a: "แหม มันคงน่าเสียดายถ้าผู้คนจำชื่อ #EMP ข้า#! ไม่ได้!"
 bp3_journey.1100.b: "นั่นคงเป็นของที่ระลึกที่ดี..."
 bp3_journey.1100.c: "ข้าขอไม่เปิดเผยตัวตนดีกว่า"
 a_large_rock: "หินแบนขนาดใหญ่ก้อนหนึ่งตั้งอยู่ใกล้ [location.Custom('GetSpecialBuildingPrefix')][location.GetHolding.GetSpecialBuildingType.GetName]"
 the_mine_entrance: "ทางเข้าที่เป็นหินของ [location.Custom('GetSpecialBuildingPrefix')][location.GetHolding.GetSpecialBuildingType.GetName]"
 a_wall: "กำแพงด้านหนึ่งที่ประกอบเป็น [location.Custom('GetSpecialBuildingPrefix')][location.GetHolding.GetSpecialBuildingType.GetName]"
 artifact_gained: "ได้รับสิ่งประดิษฐ์"
 prestige_trinket: "ท่านได้รับ[artifact|E]เบ็ดเตล็ดที่มอบ[prestige|E]"
 grafitti_rock: "หินแกะสลักจาก [location.GetNameNoTooltip]"
 grafitti_rock.desc: "หินก้อนนี้ถูกเคลื่อนย้ายมาจาก [location.Custom('GetSpecialBuildingPrefix')][location.GetHolding.GetSpecialBuildingType.GetName] และมีรอยแกะสลักอยู่ ซึ่งอ่านว่า: #EMP '[ancient_vandal.GetFullName] อยู่ที่นี่ จงมองดูนามของข้าและรู้ไว้ว่าข้าคือ [ancient_vandal.Custom('FormalComplimentAdjective')]!'#!"
 defaced_monument_opinion: "ทำให้เสียโฉมอนุสรณ์สถาน"
 
 bp3_journey.1200.t: "โกนและตัดผม"
 bp3_journey.1200.desc: "ที่มุมหนึ่งของตลาด ข้าเห็นประตูที่มีป้ายเขียนว่า #EMP '[local_character.GetFirstNameNicknamed] – ช่างตัดผมและศัลยแพทย์'#! พร้อมด้วยผู้คนเข้าคิวยาวเหยียดอยู่ด้านนอก ดูเหมือนจะเป็นสถานที่ที่#EMP ได้รับความนิยม#!อย่างมาก\n\nเมื่อเข้าไปใกล้ ข้าเห็น[local_character.GetWomanMan]กำลังตัดผมด้วยความรวดเร็วและแม่นยำอย่างที่ข้าไม่เคยเห็นมาก่อน! ผมที่หมองคล้ำและพันกันยุ่งเหยิงกลับกลายเป็นผมที่เงางามและสลวยที่สุดเท่าที่จะจินตนาการได้"
 bp3_journey.1200.knowledge_hoarding: "[local_character.GetSheHe] เคลื่อนไหวอย่างสง่างาม เช่นนั้นได้อย่างไร?"
 bp3_journey.1200.curiosity: "ตัดผมให้ข้าทรง #EMP '[location.GetNameNoTooltip]-สไตล์'#! แท้ๆ แล้วมาร่วมกับข้า!"
 bp3_journey.1200.a: "ขอตัดผมทรงหนึ่ง!"
 bp3_journey.1200.b: "ข้าสามารถใช้ประโยชน์จากช่างตัดผม-ศัลยแพทย์ผู้นี้ที่ [ROOT.Char.Custom('GetCourtType')] ได้"
 bp3_journey.1200.c: "เสียเวลาเปล่า"
 barber_success: "ท่านได้ทรงผมใหม่ที่งดงาม"
 barber_fail: "ท่านได้ทรงผมที่แย่มาก"
 hair_will_change: "ทรงผมของท่านจะเปลี่ยนไปเป็นเวลา #V 6#! เดือน"
 
 bp3_journey.1300.t: "บทเพลงแห่ง [location.Custom('GetSpecialBuildingPrefix')][location.GetHolding.GetSpecialBuildingType.GetNameNoTooltip]"
 bp3_journey.1300.desc: "ท่วงทำนองอันเย้ายวนลอยมาเข้าหูข้าขณะที่ข้ายืนอยู่ด้านนอก [location.Custom('GetSpecialBuildingPrefix')][location.GetHolding.GetSpecialBuildingType.GetNameNoTooltip] นักดนตรีคนหนึ่ง กำลังถือเครื่องดนตรีท้องถิ่นอันวิจิตร กำลังบรรเลงเพลงอันเชี่ยวชาญ ขณะที่ตัวตลกผู้มีสีสัน – ซึ่งน่าทึ่งไม่แพ้กันในการแสดงของ [local_character_2.GetHerHis] – กำลังร้องเพลงและเต้นรำไปกับมัน:\n\n#EMP "[location.Custom('GetSpecialBuildingSong')]"#!"
 bp3_journey.1300.knowledge_hoarding: "ต้องมีความหมายลึกซึ้งกว่านี้ในเพลงนี้..."
 bp3_journey.1300.curiosity: "ทำไมเจ้าทั้งสองไม่เข้าร่วม [ROOT.Char.Custom('GetCourtType')] ของข้าล่ะ?"
 bp3_journey.1300.spread_legend_intent: "เจ้าควรร้องเพลงเกี่ยวกับ [ROOT.Char.GetPromotedLegend.GetNameNoTooltip]!"
 bp3_journey.1300.a: "ตัวตลกนั้นสง่างาม ข้าต้องได้ [local_character.GetHerHim] มา!"
 bp3_journey.1300.b: "ดนตรี เช่นนี้ต้องประดับประดาห้องของข้าที่บ้าน!"
 bp3_journey.1300.c: "น่ายินดี!"
 
 # Religious Buildings Song
 event_song_religious_01: "ใต้ своды [location.Custom('GetSpecialBuildingPrefix')][location.GetHolding.GetSpecialBuildingType.GetNameNoTooltip], ที่ ซึ่งศรัทธาและความเงียบสงบสถิต, เรารวมตัวกันในแสงสว่าง, จิตวิญญาณของเราไม่มีวันตาย"
 event_song_religious_02: "ในโถงแห่งสันติภาพอันศักดิ์สิทธิ์, [location.Custom('GetSpecialBuildingPrefix')][location.GetHolding.GetSpecialBuildingType.GetNameNoTooltip] ยืนตระหง่าน, ยอดแหลมของมันเอื้อมสู่ท้องฟ้า, ขณะที่คำอธิษฐานและเสียงร้องเรียกขาน"
 event_song_religious_03: "ที่ ซึ่งระฆังแห่ง [location.Custom('GetSpecialBuildingPrefix')][location.GetHolding.GetSpecialBuildingType.GetNameNoTooltip] ดังกังวาน, เสียงสะท้อนของมันบริสุทธิ์และชัดเจน, เราพบความปลอบประโลมที่นี่, ในการนมัสการ, ความหวัง, และคำอธิษฐาน"
 # Learning Buildings Song
 event_song_learning_01: "ท่ามกลางตำราที่เต็มไปด้วยฝุ่นและความรู้เก่าแก่, [location.Custom('GetSpecialBuildingPrefix')][location.GetHolding.GetSpecialBuildingType.GetNameNoTooltip] กระซิบถึงปัญญา, ความลับ, และอีกมากมาย"
 event_song_learning_02: "ที่ ซึ่งความคิดมาบรรจบกันในโถงของ [location.Custom('GetSpecialBuildingPrefix')][location.GetHolding.GetSpecialBuildingType.GetNameNoTooltip], การแสวงหาความรู้ทลายกำแพงแห่งความไม่รู้"
 event_song_learning_03: "ใต้โค้งของ [location.Custom('GetSpecialBuildingPrefix')][location.GetHolding.GetSpecialBuildingType.GetNameNoTooltip], เหล่านักปราชญ์ถกเถียง, ไขความลี้ลับที่กาลเวลาไม่อาจลดทอน"
 # Mines Buildings Song
 event_song_mines_01: "ลึกเข้าไปในใจกลางของ [location.Custom('GetSpecialBuildingPrefix')][location.GetHolding.GetSpecialBuildingType.GetNameNoTooltip], ที่ ซึ่งสมบัติซ่อนอยู่, คนงานเหมืองตรากตรำในความมืด, โดยมีความภาคภูมิใจเป็นผู้นำทาง"
 event_song_mines_02: "ใต้พื้นโลก ณ [location.Custom('GetSpecialBuildingPrefix')][location.GetHolding.GetSpecialBuildingType.GetNameNoTooltip], เสียงจอบเสียมขับขาน, ไล่ตามสายแร่แห่งความมั่งคั่ง, เพื่อนำโชคลาภอันยิ่งใหญ่มาให้"
 event_song_mines_03: "ในส่วนลึกของ [location.Custom('GetSpecialBuildingPrefix')][location.GetHolding.GetSpecialBuildingType.GetNameNoTooltip], ที่ ซึ่งเสียงสะท้อนดังก้อง, เราแกะสลักความลับของหิน, เพื่อบอกเล่าเรื่องราวของมัน"
 # Martial Buildings Song
 event_song_martial_01: "ท่ามกลางเงาของ [location.Custom('GetSpecialBuildingPrefix')][location.GetHolding.GetSpecialBuildingType.GetNameNoTooltip], ที่ ซึ่งทหารฝึกฝนและตรากตรำ, เสียงเหล็กกระทบกันดังก้อง, บนผืนดินอันศักดิ์สิทธิ์นี้"
 event_song_martial_02: "ในเงาแห่งอำนาจของ [location.Custom('GetSpecialBuildingPrefix')][location.GetHolding.GetSpecialBuildingType.GetNameNoTooltip], ดาบของเราถูกชักออกมาเพื่อความถูกต้อง, ปกป้องบ้านและครอบครัว, จนกว่าแสงแรกแห่งรุ่งอรุณจะมาถึง"
 event_song_martial_03: "ภายใต้การจับตามองของ [location.Custom('GetSpecialBuildingPrefix')][location.GetHolding.GetSpecialBuildingType.GetNameNoTooltip], ที่ ซึ่งธงโบกสะบัดอย่างกล้าหาญ, เสียงสะท้อนของคำสาบาน, ในศิลปะแห่งสงครามโบราณ"
 # Ancient Wonders Buildings Song
 event_song_ancient_wonders_01: "ในเงาอันไร้กาลเวลาของ [location.Custom('GetSpecialBuildingPrefix')][location.GetHolding.GetSpecialBuildingType.GetNameNoTooltip], ที่ ซึ่งประวัติศาสตร์หลับใหล, เรื่องราวโบราณยังคงอยู่, ในความเงียบที่รักษาไว้"
 event_song_ancient_wonders_02: "เมื่อมองดู [location.Custom('GetSpecialBuildingPrefix')][location.GetHolding.GetSpecialBuildingType.GetNameNoTooltip], สิ่งมหัศจรรย์แห่งอดีต, เรื่องเล่าเก่าแก่, เสียงกระซิบแห่งตำนานและเรื่องเล่าขาน"
 event_song_ancient_wonders_03: "เป็นนิรันดร์ดุจดวงดาว, [location.Custom('GetSpecialBuildingPrefix')][location.GetHolding.GetSpecialBuildingType.GetNameNoTooltip] ยืนหยัด, เป็นเครื่องพิสูจน์ถึงกาลเวลา, ก่อร่างสร้างขึ้นด้วยมือโบราณ"
 # Economic Buildings Song
 event_song_economic_01: "ในใจกลางอันคึกคักของ [location.Custom('GetSpecialBuildingPrefix')][location.GetHolding.GetSpecialBuildingType.GetNameNoTooltip], ที่ ซึ่งการค้าเจริญรุ่งเรือง, ชีพจรของการค้าและการตกลง, ที่ ซึ่งความเจริญรุ่งเรืองมาถึง"
 event_song_economic_02: "บทเพลงอันมีชีวิตชีวาของตลาดเติมเต็มอากาศของ [location.Custom('GetSpecialBuildingPrefix')][location.GetHolding.GetSpecialBuildingType.GetNameNoTooltip], ซิมโฟนีแห่งการประกอบการ, ความมั่งคั่งที่หาที่เปรียบมิได้"
 event_song_economic_03: "งานฝีมือและสินค้ามีอยู่มากมายในโถงของ [location.Custom('GetSpecialBuildingPrefix')][location.GetHolding.GetSpecialBuildingType.GetNameNoTooltip], ที่ ซึ่งเสียงเรียกของพ่อค้าดังก้อง, และโชคลาภมาเยือน"
 # Diplomatic Buildings Song
 event_song_diplomatic_01: "ภายใต้การจับตามองของ [location.Custom('GetSpecialBuildingPrefix')][location.GetHolding.GetSpecialBuildingType.GetNameNoTooltip], ที่ ซึ่งพันธมิตรก่อตัวขึ้น, วาจาถักทออนาคต, จนกว่าดวงอาทิตย์จะลับขอบฟ้า"
 event_song_diplomatic_02: "โถงอันโอ่อ่าของ [location.Custom('GetSpecialBuildingPrefix')][location.GetHolding.GetSpecialBuildingType.GetNameNoTooltip], ที่ ซึ่งเสียงดังขึ้นและลดลง, ในการเต้นรำของการทูต, คำเดียวสามารถเปลี่ยนแปลงทุกสิ่งได้"
 event_song_diplomatic_03: "ในราชสำนักอันยิ่งใหญ่ของ [location.Custom('GetSpecialBuildingPrefix')][location.GetHolding.GetSpecialBuildingType.GetNameNoTooltip], ท่ามกลางเสียงกระซิบและแผนการ, ทุกท่าทางมีความหมาย, ในอาณาจักรของกษัตริย์และราชินี"
 event_song_natural_wonders_01: "โอ้ ความยิ่งใหญ่ของธรรมชาติ ช่างกว้างใหญ่ไพศาล ที่ ซึ่งอินทรีทะยานสูง และความลับซ่อนเร้น ในใจกลางโลก หรือที่ ซึ่งสายน้ำไหล มีความงามอันดิบเถื่อนที่น้อยคนนักจะรู้จักอย่างแท้จริง"
 event_song_natural_wonders_02: "ใต้ผืนฟ้าอันไร้ขอบเขต บนผืนดินโบราณ ที่ ซึ่งเสียงกระซิบแห่งอดีตพบได้ในสายลม ท่ามกลางยอดเขาสูงตระหง่าน หรือริมฝั่งน้ำใสกระจ่าง จิตวิญญาณแห่งโลกขับขานให้ผู้ที่ได้ยิน"
 event_song_natural_wonders_03: "ในอ้อมกอดของธรรมชาติ ที่ ซึ่งสิ่งมีชีวิตป่าเถื่อนท่องไป ท่ามกลางความงามอันขรุขระ เราพบที่พักพิงของเรา ด้วยพลังแห่งขุนเขา หรือทะเลสาบอันสงบเงียบ ในทุกใบไม้และก้อนหิน ความมหัศจรรย์ของธรรมชาติปรากฏให้เห็น"


 bp3_journey.1400.t: "การเร่ขายเนื้อ"
 bp3_journey.1400.desc: "ข้าเข้าใกล้[local_character.GetWomanMan]ท่าทางดุร้ายที่กำลังแบกขนสัตว์น่าประทับใจไว้ที่แผงของ [local_character.GetHerHis] ดูเหมือน [local_character.GetSheHe|U] จะเป็นนักล่าที่เก่งกาจ "ข้ามี [local_character.Custom('GetRandomRegionalSmallGame')], [local_character.Custom('GetRandomRegionalWildDaytimeBird')], [local_character.Custom('GetRegionalDeerType')] – มาเอาเนื้อและหนังสัตว์ของเจ้าที่นี่!" [local_character.GetSheHe] ตะโกน\n\nทันใดนั้น [local_character.GetSheHe] ก็มองตรงมาที่ตาข้า สายตาของ [local_character.GetHerHis] เฉียบคมราวกับ [local_character.Custom('GetRegionalWolfType')] "อ่า ท่าน #EMP [ROOT.Char.GetTitleAsNameNoTooltip|U]#! สำหรับท่าน ข้ามีเนื้อที่สูงศักดิ์ที่สุด: #EMP [ROOT.Char.Custom('RegionalOnlyFerociousAnimal')]#!""
 bp3_journey.1400.knowledge_hoarding: "เจ้ารู้เส้นทางแถวนี้ดี โปรดนำทางข้า"
 bp3_journey.1400.curiosity: "เจ้าสามารถสอนข้าได้สักอย่างสองอย่าง!"
 bp3_journey.1400.a: "ให้ข้าซื้อ [newly_created_artifact.GetNameNoTooltip]"
 bp3_journey.1400.b: "เจ้าควรเป็นนายพรานหลวงของข้า!"
 bp3_journey.1400.c: "เนื้อนั้นสูงศักดิ์พอสำหรับข้าจริงๆ!"

 bp3_journey.1500.t: "ชาวบ้านผู้คงแก่เรียน"
 bp3_journey.1500.desc: "ขณะที่ข้ากำลังสำรวจ ข้าได้ยินบทสนทนาระหว่างชาวบ้านผู้คงแก่เรียนสองคน "การแจกทานไม่เคยง่ายเท่านี้มาก่อนตั้งแต่ท่านจัดระเบียบบริเวณนี้ [local_character.GetFaith.HighGodName|U] จะต้องอวยพรท่านอย่างแน่นอน ท่าน [local_character_2.GetFirstName]" [local_character.GetWomanMan] คนหนึ่งกล่าว\n\n"ข้าขอน้อมรับ ท่าน [local_character.GetFirstName] ที่รัก แต่ท่านเป็นผู้รับใช้ที่รักยิ่งและ [local_character.Custom('ComplimentAdjective')] ของพระเจ้า – ข้าเพียงแค่ทำหน้าที่ของข้าในฐานะผู้ดูแลพื้นที่ของ [location.Custom('GetSpecialBuildingPrefix')][location.GetHolding.GetSpecialBuildingType.GetNameNoTooltip]" อีกคนกล่าวต่อ"
 bp3_journey.1500.knowledge_hoarding: "หากข้าบริจาคทาน ท่านจะนำข้าชมบริเวณหรือไม่?"
 bp3_journey.1500.curiosity: "ท่านทั้งสองช่าง [local_character.Custom('ComplimentAdjective')] ยิ่งนัก ท่านจะให้เกียรติแก่ [ROOT.Char.Custom('GetCourtType')] ของข้าหรือไม่?"
 bp3_journey.1500.curiosity_2: "จากชาว [ROOT.Char.GetCulture.GetCollectiveNounNoTooltip] ถึงชาว [local_character.GetCulture.GetCollectiveNounNoTooltip] – การบริจาคแห่งมิตรภาพ!"
 bp3_journey.1500.a: "ข้าต้องการให้ท่านแจกทานให้ข้าใน [ROOT.Char.GetPrimaryTitle.GetBaseNameNoTierNoTooltip]"
 bp3_journey.1500.b: "คนรับใช้ของข้าไม่เคยตรงเวลาเลย – โปรดจัดระเบียบ [ROOT.Char.Custom('GetCourtType')] ของข้า!"
 bp3_journey.1500.c: "เช่นนี้นี่เองที่พวกเขาบริหารจัดการที่นี่..."
 inspired_by_alms_modifier: "ได้รับแรงบันดาลใจจากการจัดระเบียบการให้ทาน"
 inspired_by_alms_modifier_desc: "ตัวละครนี้ได้รับแรงบันดาลใจจากวิธีการจัดระเบียบการให้ทานอย่างดีเยี่ยมระหว่างการเยี่ยมชมอนุสรณ์สถาน"
 
 bp3_journey.1600.t: "เมืองแห่งแมว"
 bp3_journey.1600.desc: "แมวอยู่ #EMP ทุกหนทุกแห่ง#! แถวนี้ – ไม่มีมุมไหน ซอกไหน หรือรอยแยกไหนที่ไม่มีแมวนอนอยู่! แม้กระทั่งแมวที่นอนหลับอยู่ [location.Custom('GetSpecialBuildingCatSleepingSpot')] ของ [location.Custom('GetSpecialBuildingPrefix')][location.GetHolding.GetSpecialBuildingType.GetNameNoTooltip]...\n\nทันใดนั้นลูกแมวตัวน้อยก็คลอเคลียขาข้า เกือบจะกวักมือเรียกข้าไปยังตรอกที่ข้าไม่เห็นมาก่อน ช่างน่าสงสัยเสียจริง"
 bp3_journey.1600.knowledge_hoarding: "มีความลับอะไรรออยู่หรือ สหายตัวน้อย?"
 bp3_journey.1600.curiosity: "ชาวบ้านรักแมวของพวกเขา ดังนั้นข้าจะให้อาหารพวกมันทั้งหมด!"
 bp3_journey.1600.a: "พวกเขาคงไม่สังเกตเห็นถ้าหายไปแค่ #EMP ตัวเดียว#!..."
 bp3_journey.1600.b: "ไปให้พ้น เจ้าตัวก่อกวน!"
 cat_help: "แมวนำทางท่านไปยังแผ่นศิลาจารึกที่น่าสนใจ"
 get_lost: "ท่านถูกปล้น แต่ได้เรียนรู้บางอย่าง"
 # Religious
 cats_sleeping_religious_01: "ในแสงแดดอันอบอุ่นที่ส่องผ่านหน้าต่างเข้ามา"
 cats_sleeping_religious_02: "บนแท่นบูชามากมาย"
 cats_sleeping_religious_03: "บนยอดสุสานที่เคารพนับถือ"
 # Learning
 cats_sleeping_learning_01: "บนกองต้นฉบับที่ถูกเปิดอ่านจนช้ำ"
 cats_sleeping_learning_02: "บนตักของเหล่านักปราชญ์ที่กำลังจดจ่ออย่างลึกซึ้ง"
 cats_sleeping_learning_03: "บนขอบหน้าต่างที่อาบแดด"
 # Mines
 cats_sleeping_mines_01: "บนก้อนหินเย็นๆ ที่ทางเข้า"
 cats_sleeping_mines_02: "อย่างสบายในรถเข็นเหมือง"
 cats_sleeping_mines_03: "บนโขดหินใกล้ปากปล่องเหมือง"
 # Martial
 cats_sleeping_martial_01: "ในร่มเงาของเชิงเทิน"
 cats_sleeping_martial_02: "บนตักของยามที่เฝ้าระวัง"
 cats_sleeping_martial_03: "ท่ามกลางซุ้มประตูที่เงียบสงบ"
 # Ancient Wonders
 cats_sleeping_ancient_wonders_01: "ใต้เงาของเสาโอเบลิสก์ที่อยู่ใกล้เคียง"
 cats_sleeping_ancient_wonders_02: "ในซอกบนกำแพง"
 cats_sleeping_ancient_wonders_03: "บนขั้นบันไดของส่วนที่เก่าแก่"
 # Economic
 cats_sleeping_economic_01: "ท่ามกลางแผงขายของในตลาดที่พลุกพล่าน"
 cats_sleeping_economic_02: "บนถังสินค้าในสถานีการค้าที่วุ่นวาย"
 cats_sleeping_economic_03: "ในซอกของบ้านพ่อค้าที่มั่งคั่ง"
 # Diplomatic
 cats_sleeping_diplomatic_01: "ภายในสวนที่ตก แต่งอย่างหรูหรา"
 cats_sleeping_diplomatic_02: "บนตักของนักการทูต"
 cats_sleeping_diplomatic_03: "บนพรมที่หรูหรา"
 # Natural Wonders
 cats_sleeping_natural_wonders_01: "ใต้ร่มเงาของต้นไม้ใกล้เคียง"
 cats_sleeping_natural_wonders_02: "บนโขดหินที่อาบแดดอยู่ใกล้ๆ"
 cats_sleeping_natural_wonders_03: "บนทิวทัศน์ที่อาบแสงแดด"

 bp3_journey.1700.t: "การฝึกซ้อมแบบ [location.GetCulture.GetNameNoTooltip]"
 bp3_journey.1700.desc: ""[local_character.Custom('GetMilitaryDrillSentence')]" ผู้บัญชาการตะโกนสั่งยามสองคนของ [local_character.GetHerHis] ดูเหมือนจะมีการสาธิตทางการทหารใกล้กับ [location.Custom('GetSpecialBuildingPrefix')][location.GetHolding.GetSpecialBuildingType.GetNameNoTooltip]\n\n"
 bp3_journey.1700.desc_different_culture: "การสังเกตการณ์การเคลื่อนไหวและยุทธวิธีของทหารยามชาว [location.GetCulture.GetName] เหล่านี้ ทำให้ข้าเปี่ยมไปด้วยความเคารพและความยำเกรง แน่นอนว่ามีบางอย่างให้พวกเราชาว [ROOT.Char.GetCulture.GetCollectiveNounNoTooltip] ได้เรียนรู้จากการแสดงนี้"
 bp3_journey.1700.desc_same_culture: "การสังเกตการณ์การเคลื่อนไหวและยุทธวิธีของทหารยาม ทำให้ข้าเปี่ยมไปด้วยความเคารพและความยำเกรง แน่นอนว่ามีบางอย่างให้ข้าได้เรียนรู้จากการแสดงนี้"
 bp3_journey.1700.knowledge_hoarding: "ผู้บัญชาการ #EMP ต้อง#! สอนยุทธวิธีเหล่านี้ให้ข้า!"
 bp3_journey.1700.curiosity: "ข้าสามารถใช้ประโยชน์จากเจ้าทั้งสามใน [ROOT.Char.Custom('GetCourtType')] ของข้าได้!"
 bp3_journey.1700.b: "หืม ข้าสามารถใช้ทหารองครักษ์ใหม่สองคนได้"
 bp3_journey.1700.c: "ข้าจะเสนองานให้กับทหารรักษาการณ์ทั้งหมดในกองทัพของข้า"
 bp3_journey.1700.d: "#EMP *ทำความเคารพทหารยาม*#!"
 drill_order_1: "ตามคำสั่งข้า เดินหน้า มั่นคงราวกับพื้นดินนำทางเจ้า!"
 drill_order_2: "จัดแถว ยืนเคียงบ่าเคียงไหล่ ราวกับสายลมมิกล้าผ่าน!"
 drill_order_3: "หันซ้าย ให้เสียงฝีเท้าของเราดังกึกก้องราวกับฟ้าร้องไล่อีกา!"
 drill_order_4: "ตามสบาย ทหาร แต่ให้ความระแวดระวังของเจ้าเป็นผู้พิทักษ์เงียบ เฝ้ามองเสมอ"
 drill_order_5: "ยกโล่ขึ้น ราวกับท้องฟ้าโปรยลูกธนูแทนสายฝนใส่เรา!"
 drill_order_6: "ถอยกลับเข้าแถว ราวกับพื้นดินเคลื่อนที่ใต้เท้าเจ้า!"
 drill_order_7: "ตั้งแถว ประจัญบานด้วยโล่ เป็นเพียงการฝึกซ้อมเพื่อยืนหยัดต่อสู้กับศัตรูในจินตนาการ!"
 drill_order_8: "รุกคืบพร้อมหอกเตรียมพร้อม ราวกับเผชิญหน้าศัตรูเล่นๆ ไม่ใช่ในการรบจริงจัง!"
 drill_order_9: "ล้อมวงและรวมพล เยาะเย้ยการบุกของศัตรู การร่ายรำแห่งสงครามโดยไม่มีศัตรูให้เห็น!"
 drill_order_10: "ยืนหยัดมั่นคง จินตนาการว่าพื้นดินสั่นสะเทือนภายใต้การบุกของทหารม้าผี!"
 drill_order_11: "ถอนกำลังและรวมพลใหม่ ราวกับอากาศที่เจ้าฟาดฟันด้วยดาบหัวเราะเยาะเจ้า!"
 maa_increases_tt: "[men_at_arms|E] [maa.GetName] ของท่านหนึ่งหน่วยเพิ่มขนาดขึ้น #P +2#!\n#weak (สิ่งนี้อาจทำให้ขนาดเกินขีดจำกัดสูงสุดได้)#!"
 imported_tactics_modifier: "ยุทธวิธีนำเข้า"
 imported_tactics_modifier_desc: "ผู้ปกครองดินแดนเหล่านี้ได้นำเข้ายุทธวิธีจากต่างแดน ทำให้กองทหารที่ประจำการอยู่ที่นี่มีประสิทธิภาพเป็นพิเศษ"
 imported_tactics_character_modifier: "$imported_tactics_modifier$"
 imported_tactics_character_modifier_desc: "จากการเดินทาง ตัวละครนี้ได้เชี่ยวชาญยุทธวิธีใหม่ๆ สร้างความผูกพันที่ลึกซึ้งยิ่งขึ้นกับกองทหารของตน"
 
 bp3_journey.1800.t: "เชื่อข้าเถิด"
 bp3_journey.1800.desc: ""[location.Custom('GetSpecialBuildingNonsensicalClaim')]" ผู้นำทางท้องถิ่นท่าทางมีเลศนัยอ้าง "เป็นความจริงแท้ หรือนามข้ามิใช่ [local_character.GetFirstNameNicknamed]!"\n\n"มาเถิด ให้ข้าแสดงให้ท่านเห็น! ข้าเพียงต้องการค่าธรรมเนียมเล็กน้อย – มันมิใช่อะไรเลยสำหรับ [ROOT.Char.GetTitleAsNameNoTooltip|U] เช่นท่าน!""
 bp3_journey.1800.spread_legend_intent: "#EMP ท่าน#! เคยได้ยินเรื่องจริงของ [ROOT.Char.GetPromotedLegend.GetNameNoTooltip] หรือไม่?"
 bp3_journey.1800.knowledge_hoarding: "จะเป็นจริงได้หรือ!? เจ้าต้องแสดงให้ข้าเห็น!"
 bp3_journey.1800.curiosity: "แสดงให้ข้าเห็นวิถีชีวิตที่นี่ใน [location.GetNameNoTooltip] แทนเถิด!"
 bp3_journey.1800.a: "นี่มันไร้สาระ – แสดงสิ่งที่เป็นจริงให้ข้าเห็นแทน"
 bp3_journey.1800.b: "หยุดการแสดงตบตาของเจ้าเสีย ข้าสามารถเสนอให้เจ้าได้มากกว่าชีวิตนี้"
 bp3_journey.1800.c: "ไปเร่ขายคำโกหกของเจ้าให้ผู้อื่นเถิด"
 bp3_journey.1800.trusting: "แน่นอน สิ่งนี้ฟังดูน่าเชื่อถือ!"
 mostly_true_tt: "ทิวทัศน์นั้นน่าหลงใหลอย่างยิ่ง"
 almost_true_tt: "ทิวทัศน์นั้นน่าสนใจ"
 not_true_tt: "ข้าเพียงได้รับการนำเที่ยวตามปกติ"
 utterly_scammed_tt: "เรา "หลงทาง" และข้าต้องจ่ายเงินเพื่อกลับ"
 interesting_insight_modifier: "ข้อมูลเชิงลึกที่น่าสนใจ"
 interesting_insight_modifier_desc: "ตัวละครนี้ได้รับข้อมูลเชิงลึกที่สร้างแรงบันดาลใจจากการเยี่ยมชมเมืองอื่น"
 beautiful_vista: "ท่านยืนอยู่บนจุดชมวิวที่สวยงาม"
 relaxing_sights: "ท่านเดินตามทางเดินเล่นที่ผ่อนคลาย"
 interesting_insight: "ท่านเห็นสถาปัตยกรรมที่น่าทึ่งบางอย่าง"
 # Religious
 guide_religious_1: "พวกเขากล่าวว่าเงาภายใน [location.Custom('GetSpecialBuildingPrefix')][location.GetHolding.GetSpecialBuildingType.GetNameNoTooltip] เคลื่อนไหวได้เอง เผยให้เห็นการมีอยู่ของวิญญาณศักดิ์สิทธิ์แก่ผู้ศรัทธา"
 guide_religious_2: "ตำนานท้องถิ่นอ้างว่าระฆังของ [location.Custom('GetSpecialBuildingPrefix')][location.GetHolding.GetSpecialBuildingType.GetNameNoTooltip] ดังกังวานด้วยท่วงทำนองที่ได้ยินเฉพาะผู้ที่ถูกกำหนดให้ยิ่งใหญ่ในชีวิตหลังความตายเท่านั้น"
 guide_religious_3: "มีเสียงกระซิบว่าห้องลับใต้ [location.Custom('GetSpecialBuildingPrefix')][location.GetHolding.GetSpecialBuildingType.GetNameNoTooltip] เก็บวัตถุมงคลที่สามารถเปลี่ยนคำอธิษฐานที่ศรัทธาที่สุดให้กลายเป็นความจริงได้"
 guide_religious_4: "ตำนานเล่าว่าแท่นบูชาของ [location.Custom('GetSpecialBuildingPrefix')][location.GetHolding.GetSpecialBuildingType.GetNameNoTooltip] ถูกแกะสลักอย่างน่าอัศจรรย์จากอุกกาบาตศักดิ์สิทธิ์ก้อนเดียว ทำให้เปี่ยมไปด้วยพลังแห่งสวรรค์"
 guide_religious_5: "เรื่องเล่าเก่าแก่เล่าว่าหน้าต่างกระจกสีของ [location.Custom('GetSpecialBuildingPrefix')][location.GetHolding.GetSpecialBuildingType.GetNameNoTooltip] เปลี่ยนเรื่องราวเพื่อสะท้อนหัวใจของผู้ที่จ้องมอง"
 # Learning
 guide_learning_1: "พวกเขากล่าวว่าซ่อนอยู่ภายในกำแพงของ [location.Custom('GetSpecialBuildingPrefix')][location.GetHolding.GetSpecialBuildingType.GetNameNoTooltip] มีหนังสือเล่มหนึ่งที่สามารถอ่านได้เฉพาะในแสงจันทร์เต็มดวงเท่านั้น"
 guide_learning_2: "ตำนานเล่าว่าห้องลับใต้ [location.Custom('GetSpecialBuildingPrefix')][location.GetHolding.GetSpecialBuildingType.GetNameNoTooltip] ครั้งหนึ่งเคยเป็นสถานที่นัดพบของสมาคมนักคิดผู้รู้แจ้ง ซึ่งผู้ที่ไม่ได้รับเลือกจะไม่สามารถมองเห็นได้"
 guide_learning_3: "มีข่าวลือว่าต้นไม้ที่เก่าแก่ที่สุดในลานถูกปลูก ณ จุดที่ผู้ก่อตั้ง [location.Custom('GetSpecialBuildingPrefix')][location.GetHolding.GetSpecialBuildingType.GetNameNoTooltip] มีนิมิตถึงความยิ่งใหญ่ในอนาคต"
 guide_learning_4: "เสียงกระซิบเล่าถึงต้นฉบับที่ซ่อนอยู่ภายใน [location.Custom('GetSpecialBuildingPrefix')][location.GetHolding.GetSpecialBuildingType.GetNameNoTooltip] ที่สามารถมอบปัญญาอันหาที่เปรียบมิได้แก่ผู้ที่ถอดรหัสอักษรโบราณได้"
 guide_learning_5: "กล่าวกันว่าการเดินวนรอบ [location.Custom('GetSpecialBuildingPrefix')][location.GetHolding.GetSpecialBuildingType.GetNameNoTooltip] สามครั้งตอนเที่ยงคืนจะเผยให้เห็นวิญญาณของนักปราชญ์ที่ถูกลืมเลือนไปนาน ผู้กระตือรือร้นที่จะแบ่งปันความรู้ของตน"
 # Mines
 guide_mines_1: "นิทานพื้นบ้านอ้างว่าอุโมงค์ที่ลึกที่สุดนำไปสู่ยมโลก ที่ ซึ่งวิญญาณนำทางคนงานเหมืองไปยังสายแร่ที่อุดมสมบูรณ์ที่สุด"
 guide_mines_2: "เรื่องเล่าของคนงานเหมืองเก่าแก่กล่าวถึงสายแร่ทองคำที่บริสุทธิ์มากจนส่องแสงได้ด้วยตัวเอง แต่มีเพียงผู้มีใจบริสุทธิ์เท่านั้นที่มองเห็นได้"
 guide_mines_3: "ตำนานกระซิบถึงห้องลับที่เต็มไปด้วยความมั่งคั่งที่ไม่ถูกแตะต้องของกษัตริย์โบราณ ถูกปิดผนึกและเฝ้าพิทักษ์โดยคนงานเหมืองที่เป็นวิญญาณ"
 guide_mines_4: "พวกเขากล่าวว่าการเคาะหินก้อนหนึ่งที่ไม่มีเครื่องหมายในเหมืองสามครั้งจะเปิดทางไปสู่สมบัติที่เหนือจินตนาการ"
 guide_mines_5: "มีข่าวลือเกี่ยวกับอัญมณีลึกลับที่มอบนิมิตแห่งอนาคต ซึ่งถูกฝังอยู่ที่ไหนสักแห่งในเขาวงกตของอุโมงค์"
 # Martial
 guide_martial_1: "มีตำนานว่ากำแพงของ [location.Custom('GetSpecialBuildingPrefix')][location.GetHolding.GetSpecialBuildingType.GetNameNoTooltip] มีหินก้อนหนึ่งที่จะหลั่งเลือดหากศัตรูเข้าใกล้พรมแดนของอาณาจักร"
 guide_martial_2: "มีเสียงกระซิบว่าคลังอาวุธลับที่อยู่ยงคงกระพันซ่อนอยู่ใต้ [location.Custom('GetSpecialBuildingPrefix')][location.GetHolding.GetSpecialBuildingType.GetNameNoTooltip] ซึ่งเข้าถึงได้เฉพาะในช่วงจันทรุปราคาเท่านั้น"
 guide_martial_3: "ทหารเก่าเล่าเรื่องอุโมงค์ลับใต้ [location.Custom('GetSpecialBuildingPrefix')][location.GetHolding.GetSpecialBuildingType.GetNameNoTooltip] ซึ่งกษัตริย์ในอดีตใช้เพื่อแอบฟังศัตรูของตน"
 guide_martial_4: "ตำนานในหมู่ทหารยามกล่าวถึงยามผีที่เดินตรวจการณ์บนเชิงเทินในเวลากลางคืน ปกป้อง [location.Custom('GetSpecialBuildingPrefix')][location.GetHolding.GetSpecialBuildingType.GetNameNoTooltip] จากอันตรายที่มองไม่เห็น"
 guide_martial_5: "นิทานพื้นบ้านเล่าว่าผู้สร้างดั้งเดิมได้สลักคำสาปไว้ที่ประตูของ [location.Custom('GetSpecialBuildingPrefix')][location.GetHolding.GetSpecialBuildingType.GetNameNoTooltip] ซึ่งจะ ทำให้ผู้บุกรุกหันมาต่อสู้กันเอง"
 # Ancient Wonders
 guide_ancient_wonders_1: "พวกเขากล่าวว่าการกระซิบคำอธิษฐานเข้าไปในรอยแตกของ [location.Custom('GetSpecialBuildingPrefix')][location.GetHolding.GetSpecialBuildingType.GetNameNoTooltip] ในยามรุ่งอรุณจะ ทำให้คำอธิษฐานนั้นเป็นจริง"
 guide_ancient_wonders_2: "ตำนานอ้างว่าเงาของ [location.Custom('GetSpecialBuildingPrefix')][location.GetHolding.GetSpecialBuildingType.GetNameNoTooltip] ในยามพระอาทิตย์ตกดินชี้ทางไปยังขุมทรัพย์ที่ถูกฝังไว้ของผู้ปกครองโบราณ"
 guide_ancient_wonders_3: "มีเรื่องเล่าว่าสถาปนิกที่แท้จริงของ [location.Custom('GetSpecialBuildingPrefix')][location.GetHolding.GetSpecialBuildingType.GetNameNoTooltip] ได้ทิ้งห้องลับไว้ ซึ่งกุมกุญแจสู่อมตะ"
 guide_ancient_wonders_4: "เรื่องเล่าเก่าแก่ชี้ว่าการเดินวนรอบ [location.Custom('GetSpecialBuildingPrefix')][location.GetHolding.GetSpecialBuildingType.GetNameNoTooltip] ถอยหลังตอนเที่ยงคืนจะเผยให้เห็นทางเข้าสู่ยมโลกที่ซ่อนอยู่"
 guide_ancient_wonders_5: "มีเสียงกระซิบว่าหินของ [location.Custom('GetSpecialBuildingPrefix')][location.GetHolding.GetSpecialBuildingType.GetNameNoTooltip] ส่งเสียงหึ่งๆ ด้วยคาถาโบราณเมื่อถึงวันเหมายัน เปิดประตูสู่ดินแดนที่ถูกลืมเลือน"
 # Economic
 guide_economic_1: "มีข่าวลือว่าความมั่งคั่งที่แท้จริงของ [location.Custom('GetSpecialBuildingPrefix')][location.GetHolding.GetSpecialBuildingType.GetNameNoTooltip] ไม่ใช่สินค้า แต่เป็นห้องนิรภัยที่ซ่อนอยู่ใต้ตลาด ซึ่งเต็มไปด้วยความร่ำรวยที่บอกเล่าไม่ได้"
 guide_economic_2: "ตำนานเล่าถึงบัญชีลับภายใน [location.Custom('GetSpecialBuildingPrefix')][location.GetHolding.GetSpecialBuildingType.GetNameNoTooltip] ที่บันทึกหนี้สินของกษัตริย์และจักรพรรดิ มอบอำนาจเหนือประชาชาติแก่ผู้อ่าน"
 guide_economic_3: "กล่าวกันว่าผู้ก่อตั้ง [location.Custom('GetSpecialBuildingPrefix')][location.GetHolding.GetSpecialBuildingType.GetNameNoTooltip] ได้ฝังแผนที่ไว้ภายในกำแพง ซึ่งนำไปสู่ที่ซ่อนอัญมณีล้ำค่า"
 guide_economic_4: "มีเรื่องเล่าว่าพ่อค้าผีเร่ร่อนไปตามโถงของ [location.Custom('GetSpecialBuildingPrefix')][location.GetHolding.GetSpecialBuildingType.GetNameNoTooltip] ในเวลากลางคืน เสนอแลกเปลี่ยนความลับกับวิญญาณของผู้โลภ"
 guide_economic_5: "เสียงกระซิบในหมู่ชาวบ้านชี้ว่าการเคาะตามรูปแบบที่แน่นอนบนหินปูพื้นของลาน [location.Custom('GetSpecialBuildingPrefix')][location.GetHolding.GetSpecialBuildingType.GetNameNoTooltip] จะเผยให้เห็นช่องลับพร้อมเหรียญโบราณ"
 # Diplomatic
 guide_diplomatic_1: "ข่าวลือที่กระซิบกันในหมู่ข้าราชสำนักคืออำนาจที่แท้จริงของ [location.Custom('GetSpecialBuildingPrefix')][location.GetHolding.GetSpecialBuildingType.GetNameNoTooltip] อยู่ในห้องลับที่ ซึ่งสนธิสัญญาทั่วโลกถูกผูกมัดด้วยเวทมนตร์และสามารถเปลี่ยนแปลงได้โดยผู้ที่คู่ควร"
 guide_diplomatic_2: "กล่าวกันว่าทางลับภายใน [location.Custom('GetSpecialBuildingPrefix')][location.GetHolding.GetSpecialBuildingType.GetNameNoTooltip] นำไปสู่ห้องที่สะท้อนความคิดของบุคคลสำคัญที่มาเยือน เผยให้เห็นเจตนาที่แท้จริงของพวกเขา"
 guide_diplomatic_3: "ตำนานเล่าว่ากระจกในโถงใหญ่ของ [location.Custom('GetSpecialBuildingPrefix')][location.GetHolding.GetSpecialBuildingType.GetNameNoTooltip] ไม่เพียงสะท้อนรูปลักษณ์ภายนอก แต่ยังสะท้อนธรรมชาติที่แท้จริงของจิตวิญญาณ เผยให้เห็นพันธมิตรและศัตรู"
 guide_diplomatic_4: "เรื่องเล่าเก่าแก่ในหมู่นักการทูตคือรูปปั้นในสวนของ [location.Custom('GetSpecialBuildingPrefix')][location.GetHolding.GetSpecialBuildingType.GetNameNoTooltip] กระซิบความลับของการเจรจาในอดีตแก่ผู้ที่ตั้งใจฟังในยามพลบค่ำ"
 guide_diplomatic_5: "มีเรื่องเล่าว่าน้ำพุในลานของ [location.Custom('GetSpecialBuildingPrefix')][location.GetHolding.GetSpecialBuildingType.GetNameNoTooltip] มอบความสามารถในการพูดโน้มน้าวใจแก่ผู้ที่ดื่มน้ำภายใต้แสงจันทร์เต็มดวง"
 # Natural Wonder
 guide_natural_wonder_1: "ชาวบ้านเชื่อว่าน้ำของ [location.Custom('GetSpecialBuildingPrefix')][location.GetHolding.GetSpecialBuildingType.GetNameNoTooltip] สามารถรักษาอาการป่วยใดๆ ได้หากอาบในแสงแรกแห่งรุ่งอรุณ"
 guide_natural_wonder_2: "ตำนานในหมู่นักปีนเขาคือการไปถึงยอดของ [location.Custom('GetSpecialBuildingPrefix')][location.GetHolding.GetSpecialBuildingType.GetNameNoTooltip] จะมอบนิมิตถึงโชคชะตาของตน แต่เฉพาะผู้ที่ขึ้นไปคนเดียวและไม่มองย้อนกลับมาเท่านั้น"
 guide_natural_wonder_3: "พวกเขากล่าวว่าเสียงสะท้อนของเสียงท่านจากยอด [location.Custom('GetSpecialBuildingPrefix')][location.GetHolding.GetSpecialBuildingType.GetNameNoTooltip] สามารถส่งข้อความไปยังผู้ล่วงลับ นำความสงบสุขมาสู่วิญญาณที่ไม่สงบ"
 guide_natural_wonder_4: "ตำนานโบราณเล่าถึงถ้ำที่ซ่อนอยู่ภายใน [location.Custom('GetSpecialBuildingPrefix')][location.GetHolding.GetSpecialBuildingType.GetNameNoTooltip] ซึ่งจะพาผู้ที่เข้าไปยังสวรรค์ที่ไม่เคยมีผู้ใดเห็น"
 guide_natural_wonder_5: "มีเสียงกระซิบว่าดอกไม้ที่หายากที่สุดที่เติบโตอยู่ที่ฐานของ [location.Custom('GetSpecialBuildingPrefix')][location.GetHolding.GetSpecialBuildingType.GetNameNoTooltip] จะบานเพียงครั้งเดียวในรอบศตวรรษ และกลิ่นของมันจะมอบความฝันเชิงพยากรณ์"

 bp3_journey.1900.t: "[local_character.GetFirstNameNoTooltip] ผู้น่าสงสาร"
 bp3_journey.1900.desc: ""โปรดเมตตา [local_character.GetFirstName] ผู้น่าสงสารด้วยเถิด ข้าต้องการเพียงเหรียญไม่กี่เหรียญเท่านั้น!" [local_character.GetWomanMan] วิงวอนด้วยเสียงสั่นเครือ\n\n[ROOT.Char.Custom('FormerJob')]"
 court_tutor_court_position_job: ""ข้าเคยให้การศึกษาแก่เหล่าบุตรธิดาแห่งตระกูล [former_employer.GetHouse.GetName] เพื่อรับใช้นายท่าน [former_employer.Custom2('InsultAdjective', SCOPE.sC('local_character'))] [former_employer.GetTitledFirstName] ข้าทำงานของข้าได้ดี สั่งสอนเหล่าเยาวชนเกี่ยวกับ [ROOT.Char.Custom('highest_skill_noun')] – แต่อนิจจา! บริการของข้ากลับ #EMP 'ไม่เป็นที่ต้องการอีกต่อไป'#! หลังจากเจ้าตัวน้อยเหล่านั้นโตขึ้น และบัดนี้ข้าต้องมาอาศัยอยู่ข้างถนน!""
 royal_architect_court_position_job: ""ข้าเคยออกแบบสิ่งที่ยิ่งใหญ่ให้กับ [former_employer.GetTitledFirstName] ทั้งหอคอย คฤหาสน์ หรือแม้ แต่ปราสาท! เมื่อโครงการล่าสุดของข้าในนามของ [former_employer.GetHerHis] เสร็จสิ้น [former_employer.GetSheHe] ก็ขโมยความรุ่งโรจน์ไปและเนรเทศข้า! ตอนนี้ข้าอาศัยอยู่ในเงาของ [location.Custom('GetSpecialBuildingPrefix')][location.GetHolding.GetSpecialBuildingType.GetNameNoTooltip] ฝันถึงวันที่ข้าจะได้สร้างอีกครั้ง...""
 cupbearer_court_position_job: ""ข้าเคยเสิร์ฟเครื่องดื่มในสภาของ [former_employer.GetTitledFirstName] และข้ามั่นใจว่าไม่มีถ้วยใดเคยแห้ง! วันหนึ่งข้าถูกกล่าวหาว่าวางยาพิษแขก – แต่มันเป็นเพียงเนื้อเสียจากอาหารค่ำเท่านั้น เขาหายดีในวันรุ่งขึ้น! แน่นอนว่านั่นไม่ได้หยุดพวกเขาจากการปล้นศักดิ์ศรีและอาชีพของข้าไป...""
 court_poet_court_position_job: ""ข้าเคย แต่งบทกวีที่สวยงามให้กับ [former_employer.GetTitledFirstName] ยกย่องคุณธรรมและลักษณะนิสัยที่ดีของ [former_employer.GetHerHis]! ทุกคนในตระกูล [former_employer.GetHouse.GetName] ชื่นชอบบทกวีและร้อยแก้วของข้า แต่เมื่อทรัพย์สินในคลังของพวกเขาเริ่มหายไป – ความรักในบทกวีของพวกเขาก็หายไปด้วย และตอนนี้ข้าอยู่ที่นี่ ยากจนและโดดเดี่ยว""
 chronicler_court_position_job: ""ข้าบันทึกตำนานของตระกูล [former_employer.GetHouse.GetName] ข้าทำงานทั้งวันทั้งคืน มือของข้าดำไปด้วยหมึก... แต่ทันทีที่หนังสือเสร็จสิ้น นายจ้างของข้า [former_employer.GetTitledFirstName] ก็กล้าเรียกข้าว่า #EMP 'ส่วนเกิน'#! และโยนข้าลงไปตามท้องถนนอย่างไม่ใยดี!""
 wet_nurse_court_position_job: ""ข้าดูแลทารกน้อยของตระกูล [former_employer.GetHouse.GetName] ข้าเฝ้าดูพวกเขาเติบโต ข้าป้อนอาหาร เปลี่ยนเสื้อผ้า สอนพวกเขาเดิน... และพวกเขาก็รักข้า! ตอนนี้ข้าหลงทางและสิ้นเนื้อประดาตัว เนื่องจาก [former_employer.GetTitledFirstName] ผู้ไร้หัวใจและโหดร้ายอ้างว่าข้าเป็น #EMP 'ภาระที่ไร้ประโยชน์'#! เมื่อเด็กๆ โตขึ้น!""
 antiquarian_court_position_job: ""ข้าเคยดูแลโบราณวัตถุ [former_employer.GetPrimaryTitle.GetAdjective] เพื่อรับใช้นายท่าน [former_employer.Custom2('InsultAdjective', SCOPE.sC('local_character'))] [former_employer.GetTitledFirstName] ข้าขัดถูโกศและหีบ ชโลมอาวุธและเครื่องเพชรพลอยด้วยน้ำมันแวววาว พับผ้าไหมและผ้าลินินด้วยความใส่ใจอย่างที่สุด – แล้วข้าได้สิ่งใดตอบแทนเล่า? ข้าถูกส่งไปอยู่ข้างถนนน่ะสิ! โอ้ ข้าปรารถนาที่จะได้ดูแลสมบัติล้ำค่า เช่นนั้นอีกครั้งเหลือเกิน...""
 bp3_journey.1900.knowledge_hoarding: "เจ้ารู้อะไรเกี่ยวกับสถานที่นี้บ้าง? บอกข้ามาให้หมด!"
 bp3_journey.1900.curiosity: "เจ้าผู้น่าสงสาร มาร่วมกับข้าแล้วข้าจะดูแลเจ้าเอง!"
 bp3_journey.1900.a: "รับเหรียญเหล่านี้ไป และเล่าเรื่องของเจ้าให้ข้าฟัง"
 bp3_journey.1900.b: "ข้าสามารถให้เจ้าได้มากกว่าเหรียญ – ข้าสามารถให้งานเจ้าได้!"
 bp3_journey.1900.c: "ไปให้พ้น เจ้าขอทานสกปรก!"
 
 bp3_journey.2000.t: "ตำนานเดินได้"
 bp3_journey.2000.desc: ""คารวะ ข้าเชื่อว่าท่านคือ [ROOT.Char.GetTitledFirstName]?" [new_promoter.GetWomanMan] กวักมือเรียกข้า\n\n"ข้าคือ [new_promoter.GetFirstNameNicknamed], [new_promoter.GetTitleAsNameNoTooltip|U] แห่ง [new_promoter.GetPrimaryTitle.GetBaseNameNoTier], และข้าได้ยินตำนานของ [ROOT.Char.GetPromotedLegend.GetName]!" [new_promoter.GetSheHe] กล่าวต่อ "นักดนตรีบางคนใกล้ [location.Custom('GetSpecialBuildingPrefix')][location.GetHolding.GetSpecialBuildingType.GetNameNoTooltip] ดึงดูดฝูงชนจำนวนมากด้วยการขับขานเกี่ยวกับการผจญภัยของ [ROOT.Char.GetPromotedLegend.GetProtagonist.GetShortUINamePossessive] ซึ่งกระตุ้นความสนใจของข้า – ท่านจะให้เกียรติข้าโดยการเล่าเรื่องนั้นด้วยคำพูดของท่านเองได้หรือไม่?""
 bp3_journey.2000.a: "นักดนตรีเหล่านี้อยู่ที่ไหน? ข้าอยากจะอุปถัมภ์พวกเขา..."
 bp3_journey.2000.b: "ข้ายินดีที่จะเล่าให้ท่านฟัง!"
 bp3_journey.2000.c: "ข้ามีเรื่องอื่นที่ดีกว่าต้องทำ"
 
 bp3_journey.2100.t: "ของพิเศษแห่ง [location.GetCounty.GetTitle.GetAdjectiveNoTooltip]"
 bp3_journey.2100.desc: ""มาซื้ออาหารที่นี่!" พ่อค้าข้างถนนตะโกน "ข้ามีเนื้อ [local_character.Custom('RegionalEdibleMeat')] ย่างเสียบไม้ ข้ามี [local_character.Custom('GetRandomRegionalSmallGame')] ยัดไส้ [local_character.Custom('GetFoodDetail')] ข้ามี [local_character.Custom('FavoriteTreatDemand')] – และทำไมไม่ลองดื่ม [local_character.Custom('RegionalDrink')] สักแก้วเพื่อล้างปากเล่า!\n\n"อันที่จริง!" [local_character.GetSheHe] หันมาหาข้า "ทำไมท่านไม่ลอง [local_character.Custom('FunFoodPrefix')]-[local_character.Custom('GetLocalStreetFood')] พิเศษของ [location.GetCounty.GetTitle.GetAdjectiveNoTooltip] ของข้าล่ะ? มันดีต่อสุขภาพมากและมีผลวิเศษ: มันจะ ทำให้ท่าน [ROOT.Char.Custom('ComplimentAdjective')] ยิ่งขึ้นไปอีก!""
 bp3_journey.2100.knowledge_hoarding: "ผลวิเศษรึ? หืม ขอลองชิ้นหนึ่ง"
 bp3_journey.2100.curiosity: "ข้าชอบอาหาร [local_character.GetCulture.GetNameNoTooltip] ขอลองชิมทุกอย่าง!"
 bp3_journey.2100.curiosity_2: "เจ้าควรลองชิมอาหาร [ROOT.Char.GetCapitalLocation.GetCounty.GetTitle.GetAdjectiveNoTooltip] ที่ [ROOT.Char.Custom('GetCourtType')] ของข้า!"
 bp3_journey.2100.a: "ขอ [local_character.Custom('RegionalDrink')] แก้วหนึ่งกับเนื้อ [local_character.Custom('RegionalEdibleMeat')] เสียบไม้"
 bp3_journey.2100.b: "ดูเหมือนเจ้าจะเป็นนักชิมอาหารที่ยอดเยี่ยม"
 bp3_journey.2100.c: "ไม่ ข้ามาที่นี่เพื่อสำรวจ"
 food_prefix_honey: "น้ำผึ้ง"
 food_prefix_berry: "เบอร์รี่"
 food_prefix_salt: "เกลือ"
 chance_of_food_poisoning: "โอกาสเกิดอาหารเป็นพิษ #weak ([GetTrait('ill').GetName( GetPlayer )])#!: #N [SCOPE.ScriptValue('food_poison_value')|0]%#!"
 
 bp3_journey.2200.t: "[local_character.Custom('RaunchyComplimentNoun')|U] แห่ง [location.GetCounty.GetTitle.GetNameNoTierNoTooltip]"
 bp3_journey.2200.desc: ""ท่านปรารถนาเพื่อนคู่เคียงหรือไม่ [ROOT.Char.Custom('FormOfAddressForLiege')]?" [local_character.GetWomanMan] ผู้หนึ่งกระซิบอย่างยั่วยวน พลางลูบไล้นิ้วไปทั่ว [local_character.Custom('ObjectifiedFeature')] ของ [local_character.GetHerHis] "ไม่ว่าท่านจะปรารถนาสิ่งใด ข้ามั่นใจว่าสามารถ ทำให้ท่านพึงพอใจได้ –" [local_character.GetSheHe] เอ่ยต่อเบา ๆ\n\n"ข้าสามารถผ่อนคลายร่างกายของท่านด้วยน้ำมันอุ่น หรือสร้างความสำราญให้จิตใจท่านด้วยการอ่าน [SCOPE.Custom('RandomEntertainmentTextName')] หรือหากความปรารถนาของท่าน... เร่าร้อนกว่านั้น ข้าก็พร้อมเป็นของท่านในค่ำคืนนี้""
 bp3_journey.2200.spread_legend_intent: "ข้าสามารถอ่านบางอย่างให้ท่านฟังได้: [ROOT.Char.GetPromotedLegend.GetNameNoTooltip]!"
 bp3_journey.2200.knowledge_hoarding: "ข้าปรารถนาเพื่อนร่วมทาง – ในรูปแบบของการสนทนา!"
 bp3_journey.2200.curiosity: "เจ้าน่าทึ่งมาก! ละทิ้งชีวิตนี้แล้วมาร่วมกับข้า"
 bp3_journey.2200.curiosity_2: "ช่างงามเหลือเกิน – จงเป็นของข้าเถิด [local_character.Custom('RaunchyComplimentNoun')] แห่ง [location.GetCounty.GetTitle.GetAdjectiveNoTooltip] ของข้า!"
 bp3_journey.2200.a: "ข้าจะมอบความสุขให้ [local_character.GetHerHim] อย่างเต็มที่!"
 bp3_journey.2200.a_2: "น้ำมันอุ่นๆ ฟังดูดี..."
 bp3_journey.2200.b: "คนที่มีพรสวรรค์ เช่นเจ้าเสียเปล่าที่นี่"
 bp3_journey.2200.c: "อย่ามายุ่งกับข้า เจ้า [local_character.Custom2('InsultNounSexual', ROOT.Char)]!"
 local_monument_tt: "[local_character.GetSheHe|U] อาศัยอยู่ใกล้ [location.Custom('GetSpecialBuildingPrefix')][location.GetHolding.GetSpecialBuildingType.GetNameNoTooltip] มาเกือบตลอดชีวิตของ [local_character.GetHerHis] ดังนั้น [local_character.GetSheHe] คงมีเรื่องมากมายที่จะเล่าให้ข้าฟังเกี่ยวกับมัน"
 
 bp3_journey.2300.t: "[regiment.GetNameNoTooltip] ของ [local_ruler.GetTitledFirstNamePossessiveNoTooltip]"
 bp3_journey.2300.desc: "ใกล้ทางเข้า [location.Custom('GetSpecialBuildingPrefix')][location.GetHolding.GetSpecialBuildingType.GetNameNoTooltip] ข้าเห็นขบวน [regiment.GetName] กำลังจัดขบวนแห่ฉลองชัยชนะเพื่อ [local_ruler.GetLadyLord|U] ท้องถิ่น [local_ruler.GetTitledFirstName]\n\n"พวกเจ้าคือความภาคภูมิใจของดินแดนเหล่านี้!" เสียงของ [local_ruler.GetFirstNamePossessiveNoTooltip] ดังก้องไปทั่วลาน "นักรบชาว [location.GetCulture.GetNameNoTooltip] ผู้รุ่งโรจน์ของข้า – ผู้ถูกเลือกอันดับแรกของ [regiment.GetNameNoTooltip] ของข้า – และผู้พิทักษ์นิรันดร์แห่ง [location.Custom('GetSpecialBuildingPrefix')][location.GetHolding.GetSpecialBuildingType.GetNameNoTooltip]!""
 bp3_journey.2300.knowledge_hoarding: "มาคุยกันเรื่องสถานที่อันน่าทึ่งนี้เถิด ท่าน[local_ruler.GetLadyLord|U] [local_ruler.GetFirstNameNoTooltip]"
 bp3_journey.2300.curiosity: "ท่านปกครองชาว [location.GetCulture.GetCollectiveNounNoTooltip] ได้อย่างน่าชื่นชมยิ่ง!"
 bp3_journey.2300.curiosity_2: "ข้าจะรู้สึกเป็นเกียรติอย่างยิ่งหากข้าสามารถรับยอดฝีมือไปได้ ท่าน [local_ruler.GetFirstNameNoTooltip]!"
 bp3_journey.2300.a: "ด้วยพรของ [local_ruler.GetFirstNamePossessiveNoTooltip] ข้าก็สามารถจัดตั้ง [regiment.GetNameNoTooltip] ได้ เช่นกัน!"
 bp3_journey.2300.b: "หนึ่งใน [regiment.GetNameNoTooltip] เหล่านี้จะเป็นยอดฝีมือที่ยอดเยี่ยม"
 bp3_journey.2300.c: "ข้าควรจะปรากฏตัวอยู่ข้าง [local_ruler.GetFirstNameNoTooltip]"
 
