 journey_curiosity_intent_idesc: "ข้าแทบรอไม่ไหวที่จะได้คลุกคลีกับผู้คนรอบ [location.Custom('GetSpecialBuildingPrefix')][location.GetHolding.GetSpecialBuildingType.GetName] ฟังเรื่องราวของพวกเขา และเป็นประจักษ์พยานในชีวิตประจำวันของพวกเขา"
 journey_curiosity_intent_idesc2: "ความคึกคักมีชีวิตชีวารอบ [location.Custom('GetSpecialBuildingPrefix')][location.GetHolding.GetSpecialBuildingType.GetName] สัญญาถึงการเผชิญหน้าและการเรียนรู้ที่หลากหลาย"
 journey_curiosity_intent_idesc3: "เสน่ห์ของการค้นพบแง่มุมที่ไม่รู้จักของ [location.Custom('GetSpecialBuildingPrefix')][location.GetHolding.GetSpecialBuildingType.GetName] ผ่านสายตาของผู้คนนั้นช่างน่าตื่นเต้น"
 spread_legend_intent_idesc: "ความคิดที่จะ ทำให้ [me_scope.GetPromotedLegend.GetName] เป็นอมตะท่ามกลางความพลุกพล่านของ [location.Custom('GetSpecialBuildingPrefix')][location.GetHolding.GetSpecialBuildingType.GetName] ทำให้ข้าเปี่ยมไปด้วยเป้าหมายที่ไม่เหมือนใคร"
 spread_legend_intent_idesc2: "ในเงาของ [location.Custom('GetSpecialBuildingPrefix')][location.GetHolding.GetSpecialBuildingType.GetName] ข้าจินตนาการถึง [me_scope.GetPromotedLegend.GetName] ที่ก้องกังวานไปตามท้องถนน เรื่องราวที่จะ ทำให้ชาวบ้านตกตะลึง!"
 spread_legend_intent_idesc3: "ข้าก้าวไปยัง [location.Custom('GetSpecialBuildingPrefix')][location.GetHolding.GetSpecialBuildingType.GetName] ฉากหลังที่สมบูรณ์แบบเพื่อจารึก [me_scope.GetPromotedLegend.GetName] ลงในบันทึกประวัติศาสตร์ ตำนานที่จะถูกเล่าขานโดยชาวบ้านสืบไปชั่วลูกชั่วหลาน"
 monument_view_intro_1: "เมื่อเงาของ [location.Custom('MonumentTypeDesc')] ปรากฏขึ้นที่ขอบฟ้า ความคาดหวังก็พองโตในใจข้า"
 monument_view_intro_2: "ในที่สุด การได้เห็น [location.Custom('MonumentTypeDesc')] ก็จุดประกายในใจข้า เชื้อเชิญให้ข้าออกสำรวจ"
 monument_view_intro_3: "เมื่อรูปร่างอันห่างไกลของ [location.Custom('MonumentTypeDesc')] ปรากฏขึ้น ความรู้สึกยำเกรงก็ก่อตัวขึ้นเมื่อข้าเข้าใกล้"
