 bp3_journey.0010.t: "อำลา [location.Custom('GetSpecialBuildingPrefix')][location.GetHolding.GetSpecialBuildingType.GetNameNoTooltip]"
 bp3_journey.0010.desc: "ถึงเวลาเก็บข้าวของและเดินทางกลับบ้านแล้ว\n\nข้าได้เดินสำรวจบริเวณ [location.Custom('GetSpecialBuildingPrefix')][location.GetHolding.GetSpecialBuildingType.GetName] และได้เห็นทิวทัศน์มากมาย จดบันทึกและวาดภาพ และได้พบปะกับชาว [location.GetCulture.GetCollectiveNounNoTooltip] ท้องถิ่น ข้าไม่คิดว่าข้าจะลืมการเดินทางครั้งนี้ได้ในเร็ววัน!\n\nลาก่อน [location.GetHolding.GetSpecialBuildingType.GetNameNoTooltip] – ลาก่อน [location.Custom('ProvinceCompliment')] [location.GetNameNoTooltip]!"
 bp3_journey.0010.a: "ข้าต้องไม่ลืมสิ่งที่ข้าได้เรียนรู้ที่นี่"
 extra_skill_gained_tt: "ท่านได้รับแต้ม[skill|E]พิเศษ #weak (โอกาส [activity.MakeScope.Var( 'skill_chance' ).GetValue|0]%)#!"
 no_extra_skill_gained_tt: "ท่านไม่ได้รับแต้ม[skill|E]เพิ่มเติม #weak (โอกาส [activity.MakeScope.Var( 'skill_chance' ).GetValue|0]%)#!"
 scribes_skill_tt: "[activity_options|E]ของท่านมอบแต้ม[skill|E]พิเศษหนึ่งแต้ม"
 
 bp3_journey.0015.t: "ทิวทัศน์ของ [location.GetNameNoTooltip]"
 bp3_journey.0015.desc: "[ROOT.Char.Custom('MonumentViewIntro')]\n\n[location.Custom('GetSpecialBuildingTouristDescriptor')]"
 bp3_journey.0015.a: "ข้าจะฝึกฝนทักษะทางการทูตของข้า!"
 bp3_journey.0015.b: "กลยุทธ์, ยุทธวิธี, การก่อสร้างเชิงเทิน – ล้วนน่าสนใจทั้งสิ้น!"
 bp3_journey.0015.c: "มีสิ่งให้เรียนรู้มากมายในสถานที่แห่งนี้"
 bp3_journey.0015.d: "พวกเขาบริหารจัดการที่นี่อย่างไร? ข้าต้องรู้ให้ได้"
 bp3_journey.0015.e: "ข้าสงสัยว่ามีอะไรเกิดขึ้นเบื้องหลังบ้าง..."
 bp3_journey.0015.knowledge_hoarding: "ถึงเวลาจดบันทึกแล้ว!"
 bp3_journey.0015.journey_curiosity_intent: "ข้าจะไปคลุกคลีกับชาวบ้าน!"
 bp3_journey.0015.spread_legend_intent: "ผู้คนทั้งหลาย! ท่านเคยได้ยินตำนานของ [ROOT.Char.GetPromotedLegend.GetNameNoTooltip] หรือไม่?"
 bp3_journey.0015.friend: "ข้ายินดีเหลือเกินที่ได้แบ่งปันช่วงเวลานี้กับ [potential_friend.GetFirstNameNoTooltip]!"
 bp3_journey.0015.lover: "#EMP *เอนกายเข้าไปจุมพิต [potential_lover.GetFirstNameNoTooltip] อย่างสุขุม*#!"
 bp3_journey.0015.prestige: "ข้ามาที่นี่ เพื่อให้เป็นที่ประจักษ์!"
 friend_bonded_by_monument: "[CHARACTER.GetShortUIName|U] และ [TARGET_CHARACTER.GetShortUIName] กลายเป็นสหายกันขณะสำรวจ [PROVINCE.Custom('GetSpecialBuildingPrefix')][PROVINCE.GetHolding.GetSpecialBuildingType.GetNameNoTooltip] ใน [PROVINCE.GetName] ด้วยกัน"
 friend_bonded_by_monument_corresponding: "[TARGET_CHARACTER.GetShortUIName|U] และ [CHARACTER.GetShortUIName] กลายเป็นสหายกันขณะสำรวจ [PROVINCE.Custom('GetSpecialBuildingPrefix')][PROVINCE.GetHolding.GetSpecialBuildingType.GetNameNoTooltip] ใน [PROVINCE.GetName] ด้วยกัน"
 lover_kissed_by_monument: "[CHARACTER.GetShortUIName|U] และ [TARGET_CHARACTER.GetShortUIName] แบ่งปันจุมพิตอันเร่าร้อนใกล้กับ [PROVINCE.Custom('GetSpecialBuildingPrefix')][PROVINCE.GetHolding.GetSpecialBuildingType.GetName] ใน [PROVINCE.GetName]"
