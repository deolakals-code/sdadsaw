 bp3_journey.1000.t: "การเร่ขายสถาปัตยกรรม"
 bp3_journey.1000.desc: ""รับ [location.GetHolding.GetSpecialBuildingType.GetNameNoTooltip] จำลองไปสิขอรับ!" เสียงพ่อค้าเร่ดังก้องไปทั่วตลาด\n\nเมื่อเข้าไปพินิจดูใกล้ ๆ ข้าสังเกตเห็นว่าเครื่องประดับดินเผาเหล่านี้มีคุณภาพ #EMP ยอดเยี่ยม#! อย่างน่าทึ่ง ทุกอย่างล้วนมีอยู่ครบถ้วน แม้กระทั่งรายละเอียดที่เล็กที่สุด ช่างยอดเยี่ยมอย่างไม่น่าเชื่อโดยแท้\n\n"ปั้นด้วยมือขอรับ [ROOT.Char.Custom('FormOfAddressForLiege')|U]! ท่านประสงค์จะซื้อสักชิ้นหรือไม่ขอรับ?""
 bp3_journey.1000.knowledge_hoarding: "เจ้าต้องแสดงให้ข้าเห็นว่าเจ้าทำมันได้อย่างไร"
 bp3_journey.1000.curiosity: "ช่างฝีมือชาว [local_character.GetCulture.GetNameNoTooltip] อย่างเจ้านี่น่าทึ่งจริงๆ! มาร่วมกับข้าสิ!"
 bp3_journey.1000.lechery: "เจ้ารับ... คำสั่งทำพิเศษหรือไม่?"
 bp3_journey.1000.a: "ข้าจะเอาอันหนึ่ง!"
 bp3_journey.1000.b: "ข้าสามารถใช้ทักษะของเจ้าที่ [ROOT.Char.Custom('GetCourtType')] ได้"
 bp3_journey.1000.c: "ข้าคือ #EMP [ROOT.Char.GetTitleAsNameNoTooltip|U]#! หยุดเสียเวลาของข้า!"
