 journey_skilled_scribes_desc: "#indent_newline:8 $BULLET_WITH_TAB$ $increase_skill_chance_20$#!\n#indent_newline:8 $BULLET_WITH_TAB$ ตัวละคร[GetTrait('devoted').GetName( GetNullCharacter )]ผู้มีความสามารถสูงสองคนจะเข้าร่วมคณะผู้ติดตาม หลังจาก[activity|E]สิ้นสุดลง พวกเขาจะยังคงเป็น[courtiers|E]ของท่าน และท่านจะมี#EMP ข้อผูกมัด#! [hooks|E]ต่อพวกเขา ซึ่งช่วยลดเงินเดือนสำหรับ[court_positions|E]#!\n\n#flavor การขอความช่วยเหลือจากภายนอกไม่ใช่เรื่องน่าอาย ท้ายที่สุดแล้ว ข้าไม่สามารถจดจำ#EMP ทุกสิ่ง#!ได้ด้วยตนเอง#!"

