l_english: 
 activity_journey: "การเดินทางสำรวจอนุสรณ์สถาน"
 activity_journey_desc: "ดำเนินการเดินทางสำรวจไปยังอนุสรณ์สถานหรือสถานสำคัญที่มีชื่อเสียง เพื่อพัฒนาตนเองโดยการเจาะลึกประวัติศาสตร์ ความรู้ และความลี้ลับที่สถิต ณ ที่แห่งนั้น"
 activity_journey_guest_desc: "" # (No text to translate)
 activity_journey_conclusion_desc: "การเดินทางสำรวจครั้งนี้เปิดโอกาสให้ท่านได้ไตร่ตรองและพัฒนาความสามารถในฐานะผู้ปกครอง"
 activity_journey_selection_tooltip: "ออกเดินทางสำรวจไปยัง [special_building|E] เพื่อแสวงหาความรู้และการพัฒนาตนเอง\n\nรางวัลที่คาดว่าจะได้รับ:\n$activity_journey_host_desc$"
 activity_journey_host_desc: "#indent_newline:8 $BULLET_WITH_TAB$[intrigue_i|E][diplomacy_i|E][martial_i|E][learning_i|E][stewardship_i|E]#V 1#! แต้ม[skill|E]ที่การันตี, #V 1#! โอกาสได้รับแต้ม[skill|E]พิเศษเพิ่ม\n#weak (รางวัลแต้มทักษะขึ้นอยู่กับ[special_building|E]ที่ไปเยือน)#!#!\n$BULLET_WITH_TAB$[court_position_i]ยอดเยี่ยม-[aptitude|E] [court_positions|E]\n$BULLET_WITH_TAB$[prestige_i|E][prestige|E]\n\n#weak ท่านจะนำ[children|E]และ[spouses|E]ติดตามไปด้วยใน[entourage|E]#!"
 activity_journey_predicted_cost: "ค่าใช้จ่ายของ[monument_expedition|E]ส่วนใหญ่ขึ้นอยู่กับระยะทางไปยัง[special_building|E]ที่ท่านเลือก"
 activity_journey_destination_selection: "จุดหมายปลายทางที่ใช้ได้ต้องมี[special_building|E]ที่สร้างเสร็จแล้ว ซึ่งไม่ใช่สถานศักดิ์สิทธิ์ทั่วไป #weak (เช่น [GetBuilding('holy_site_cathedral_01').GetName])#! หรือ [GetBuilding('generic_university').GetName] ทั่วไป แต่ละจุดหมายสามารถไปเยือนได้เพียงครั้งเดียว\n\n[intrigue_i|E][diplomacy_i|E][martial_i|E][learning_i|E][stewardship_i|E] การเพิ่ม[skill|E]ขึ้นอยู่กับประเภท[point_of_interest|E]ของ[special_building|E]ที่ไปเยือน"
 
 journey_knowledge_hoarding_intent: "การกักตุนความรู้"
 journey_knowledge_hoarding_intent_desc: "ท่านมีเป้าหมายเพียงหนึ่งเดียวเท่านั้น – คือการรวบรวมความรู้ให้ได้มากที่สุดเท่าที่จะทำได้ ท่านสามารถเลือกเพิ่มโอกาสได้รับแต้ม[skill|E]พิเศษเพื่อแลกกับ[stress|E]"
 
 journey_curiosity_intent: "ความใฝ่รู้"
 journey_curiosity_intent_desc: "มีสิ่งมากมายให้ค้นพบ ไม่เพียง แต่ในตัวอนุสรณ์สถานเท่านั้น แต่ยัง รวมถึงผู้คนที่อาศัยอยู่ใกล้เคียง ท่านจะได้รับ[cultural_acceptance|E]และ[strong_hooks|E]ต่อผู้ที่ท่านชักชวนมากขึ้น"
 
 activity_journey_guest_help_text: "[activity_guests|E]จะได้รับโอกาสในการเพิ่ม[skills|E]ของตน โดยเฉพาะอย่างยิ่งหากพวกเขาเป็นคนสำคัญต่อท่าน เช่น [player_heir|E]ของท่าน"
 phase_experience: "การสำรวจ"
 phase_experience_desc: "สังเกตการณ์อนุสรณ์สถาน เดินสำรวจบริเวณโดยรอบ และปฏิสัมพันธ์กับคนท้องถิ่นที่อาศัยอยู่ใกล้เคียง – เพื่อแสวงหาความรู้"

