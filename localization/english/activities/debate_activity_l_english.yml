 ### TOOLTIPS
 activity_debate_guest_help_text: "[activity_guests|E] ที่ได้รับเชิญจะเข้าร่วมชมหรือมีส่วนร่วมในการโต้วาที การโต้แย้งที่สำเร็จผลจะให้ [movement_power|E], หรือลดทอนอำนาจจากขบวนการอื่น การเข้าร่วมการโต้วาทีถือเป็นโอกาสอันดีที่จะได้รับ [merit|E], เพิ่มพูน [trait_level_track_xp|E] ของ [GetTrait('confucian_education').GetName( GetNullCharacter )], และอาจได้รับ [elder|E]"
