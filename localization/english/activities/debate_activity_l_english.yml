 ### OPTIONS
 debate_type_leadership: "โต้วาที $Movement$"
 debate_type_leadership_desc: "$EFFECT_LIST_BULLET$ โต้วาทีกับสมาชิกในขบวนการของท่านเพื่อขึ้นเป็น [movement_leader|E]\n\n#weak ด้วยไหวพริบหรือเล่ห์เหลี่ยม, ข้าจะเป็นผู้กุมอำนาจ.#!"
 debate_type_favor: "การโต้วาทีในราชสำนัก"
 debate_type_favor_desc: "$EFFECT_LIST_BULLET$ โต้วาทีกับขบวนการอื่นต่อหน้า [son_of_heaven|E] เพื่อ ทำให้ [GetPlayer.Custom('GetMyMovementNoTooltip')] เป็น [favored_movement|E]\n\n#weak เรือย่อมต้องถูกนำทางโดยลูกเรือที่เหมาะสม.#!"

 debate_option_books: "$adult_education_option_books$"
 debate_books_bad: "$adult_education_books_bad$"
 debate_books_bad_desc: "$EFFECT_LIST_BULLET$ลดค่าใช้จ่าย [gold|E]\n\n#weak ข้านำความรู้ของข้าติดตามตัวไปทุกที่ มีเพียงผู้ที่ไม่แน่ใจในข้อกล่าวอ้างของตนเท่านั้น ที่ต้องซ่อนตัวอยู่หลังข้อโต้แย้งของนักปราชญ์อื่น.#!"
 debate_books_normal: "ม้วนคัมภีร์และบันทึก"
 debate_books_normal_desc: "$EFFECT_LIST_BULLET$เพิ่มโอกาสสำเร็จของกิจกรรมเล็กน้อย\n\n#weak ข้าต้องการเพียงตำราและบทวิจารณ์ที่จำเป็นเพื่อสร้างข้อโต้แย้งของข้า.#!"
 debate_books_good: "$adult_education_books_good$"
 debate_books_good_desc: "$EFFECT_LIST_BULLET$เพิ่มโอกาสสำเร็จของกิจกรรม\n\n#weak ข้าจะนำบ่อเกิดแห่งความรู้อันแท้จริงมาเพื่อสร้างความประทับใจให้แขกและสนับสนุนข้อโต้แย้งของข้า#!"

 debate_argument_major_decrease_desc: "#N #bold ลดลงอย่างมาก#!#!ต่อ #V โอกาสสำเร็จ#! ของท่าน"
