 ### SETUP
 activity_debate: "การโต้วาที"
 activity_debate_plural: "การโต้วาที"
 activity_debate_destination_selection: "ท่านสามารถจัด $activity_debate$ ได้เพียงใน [capital|E] ที่เป็นของท่าน, [movement_leader|E] ของท่าน, [liege|E] ของท่าน หรือ [GetTitleByKey('h_china').GetName] เท่านั้น"
 activity_debate_selection_tooltip: "จงจัด [GetActivityType('activity_debate').GetName] เพื่อชิงอำนาจทางการเมือง — ยึดกุมอำนาจไว้เพื่อตนเองหรือขบวนการของท่าน $activity_debate_host_rewards$"
 activity_debate_desc: "คุณธรรม, อิทธิพล, #EMP อำนาจ#! — สิ่งเหล่านี้จะมีความหมายเพียงเล็กน้อย หากท่านมิอาจนำเสนอข้อโต้แย้งอันสมเหตุสมผลเพื่อตัวท่านและอุดมการณ์ของท่านได้\n\nจงเรียกการโต้วาทีเพื่อโน้มน้าวผู้อื่นว่าท่านคู่ควร ซึ่งอำนาจที่มากขึ้น, หรือท้าทายขบวนการอื่นเพื่อวางตนให้อยู่ในจุดที่ได้เปรียบกว่า"
 activity_debate_host_desc: "$activity_debate_host_rewards$$activity_debate_guest_rewards$"
 activity_debate_host_rewards: "\n$BULLET_WITH_TAB$[movement_power_i] [movement_power|E]\n$BULLET_WITH_TAB$[influence_i|E] [influence|E]\n$BULLET_WITH_TAB$[merit_i|E] [merit|E]"
 activity_debate_guest_desc: "\n$BULLET_WITH_TAB$อาจได้รับ [disciples|E]\n$BULLET_WITH_TAB$อาจเพิ่ม [trait_level_track_xp|E] ของ [GetTrait('confucian_education').GetName( GetNullCharacter )] ของท่าน"
 activity_debate_guest_rewards: "\n$BULLET_WITH_TAB$ผู้เข้าร่วมอาจได้รับ [trait_level_track_xp|E] ของ [GetTrait('confucian_education').GetName( GetNullCharacter )]\n$BULLET_WITH_TAB$ผู้เข้าร่วมอาจได้รับ [elder|E]"
 debate_base_cost: "ค่าใช้จ่ายพื้นฐาน"
 activity_debate_predicted_cost: "ค่าใช้จ่ายโดยประมาณ"

