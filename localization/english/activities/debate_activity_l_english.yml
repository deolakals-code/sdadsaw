 debate_phase_discussion_desc: "โถงศึกษาเล่าเรียนเปี่ยมไปด้วยการหารืออย่างสุภาพ, ขณะที่ผู้เข้าโต้วาทีพยายามอนุมานว่าจุดยืนใดจะมียุทธศาสตร์ที่ดีที่สุด"
 debate_phase_debate: "การโต้วาที"
