 ### CONCLUSION
 activity_debate_conclusion_desc_leadership_winner: "การโต้วาทีเพื่อชิงตำแหน่งผู้นำของ [GetPlayer.Custom('GetMyMovement')] สิ้นสุดลงแล้ว, โดยข้าได้รับการประกาศให้เป็นผู้ชนะ!"
 activity_debate_conclusion_desc_leadership_loser: "แผนการของข้าล้มเหลว และ [Activity.MakeScope.Var('challenged_movement_leader').Char.GetFirstNameNoTooltip] ยังคงเป็นผู้นำของ [GetPlayer.Custom('GetMyMovement')] ต่อไป"
 activity_debate_conclusion_desc_leadership_challenged_loser: "[Activity.MakeScope.Var('debate_winner').Char.GetFirstNameNoTooltip] ได้รับการประกาศให้เป็นผู้นำของ [GetPlayer.Custom('GetMyMovement')] แม้ข้าจะพยายามขัดขวางเพียงใด"
 activity_debate_conclusion_desc_favor_winner: "การโต้วาทีเพื่อชิงความโปรดปรานของ [ROOT.Char.GetTopLiege.GetTitleAsNamePossessiveNoTooltip] สิ้นสุดลงแล้ว, โดย [GetPlayer.Custom('GetMyMovement')] ได้รับการประกาศให้เป็นผู้ชนะ!"
 activity_debate_conclusion_desc_favor_loser: "ข้าไม่ประสบผลสำเร็จในการได้รับความโปรดปรานของ [ROOT.Char.GetTopLiege.GetTitleAsNamePossessiveNoTooltip] เพื่อ [GetPlayer.Custom('GetMyMovement')] ข้าคงต้องพยายามให้หนักขึ้นในคราต่อไป"
