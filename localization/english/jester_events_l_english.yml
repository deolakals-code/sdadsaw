l_english: 
 court_jester_prefix:0 "ตัวตลกหลวง: "
 jester.100.t:0 "$court_jester_prefix$คู่แข่งตัวตลกของข้า ผู้เปรอะเปื้อนมูล"
 jester.100.desc:0 "ช่างเป็นวันที่เคร่งเครียดอีกวัน... ขณะที่ข้านั่งลงเพื่อพักผ่อนอย่างสงบ ประตูห้องของข้าก็พลันเปิดผางออก\n\nนั่นคือ [jester.GetTitledFirstName] คู่แข่งที่กลายมาเป็นตัวตลกของข้างั้นรึ แต่งกายในชุด [jester.Custom('GetClothingArticle')] ที่เปียกโชกด้วยสิ่งโสโครก พร้อมด้วย [jester.Custom('GetAccessory')|l] ที่ฉูดฉาดบาดตาอย่างไม่น่าเชื่อ!? บัดนี้ [jester.GetSheHe] ดูภายนอกเหมือนอุจจาระ เฉก เช่นที่ข้ารู้ว่าภายในของ [jester.GetHerHim] เป็น เช่นนั้น!\n\n"[ROOT.Char.Custom('GetExpensiveDrink_Singular')] ของท่าน... #EMP ใต้ฝ่าพระบาท#! ที่เคารพ" [jester.GetSheHe] เอ่ย ใบหน้าของ [jester.GetHerHis] บึ้งตึงอย่างยิ่ง\n\nบางครั้งชีวิตก็ดี เช่นนี้เอง"
 jester.100.a:0 "ดื่มอวยพรให้เจ้า [jester.GetFirstNameNoTooltip] ที่รัก!"
 covered_in_feces:0 "เปรอะเปื้อนมูล"
 covered_in_feces_desc:1 "ตัวละครนี้ถูกปกคลุมด้วยอุจจาระตั้งแต่ศีรษะจรดเท้า"
 jester.200.t:0 "$court_jester_prefix$เสียงหัวเราะคือยาวิเศษ"
 jester.200.desc:0 ""พระองค์เคยฟังเรื่องตลกเกี่ยวกับ [ROOT.Char.GetTitleTierName] กับ [ROOT.Char.Custom('lowly_servant_type')] หรือไม่ [ROOT.Char.Custom('FormOfAddressForLiege')]? เรื่องมันมีอยู่ว่า!" [jester.GetTitledFirstName] ตัวตลกของข้าครุ่นคิดอย่างเปรมปรีดิ์\n\nใบหน้าของข้าแดงก่ำและน้ำตาแห่งความขบขันไหลอาบแก้ม [jester.GetSheHe] ไปได้มุกตลกเหล่านี้มาจากที่ใดกัน? [jester.GetSheHe|U] ช่างตลกสิ้นดี!\n\nบางทีคงถึงเวลากลับไปทำงานแล้วกระมัง ขืนอยู่ต่อข้าคง #EMP สิ้นใจ#! เพราะหัวเราะเป็นแน่!"
 jester.200.a:0 "เล่ามาเลย!"
 jester.200.b:0 "สนุกมาก ถึงเวลาข้ากลับไปทำงานแล้ว!"
 death_laughter:0 "สิ้นใจ เพราะหัวเราะมากเกินไป"
 jester.300.t:0 "$court_jester_prefix$การโยนสลับอันเชี่ยวชาญ"
 jester.300.desc:0 ""มาที่ห้องโถงใหญ่เถิด ใต้ฝ่าพระบาท! ท่านต้องมาดูสิ่งนี้!" คนรับใช้คนหนึ่งอุทานขึ้นทันใด\n\nเมื่อข้ามาถึง ข้าเห็นตัวตลกของข้า [jester.GetTitledFirstName] อยู่กลางห้อง กำลังโยนสลับ [ROOT.Char.Custom('DeviantObjectArticle')] [ROOT.Char.Custom('RandomPrivateObject')] ของข้า ขวด [ROOT.Char.Custom('GetExpensiveDrink_Singular')]"
 jester.300.desc_child:0 "[child_to_juggle.GetFirstName] ตัวน้อย,"
 jester.300.desc_2:0 "[ROOT.Char.Custom('GetLivestockFowlIndef')] และ [ROOT.Char.Custom('GetSmallFoodIndef')] อย่างเชี่ยวชาญ\n\nคนรับใช้ทุกคนต่างจ้องมองด้วยความทึ่ง และข้าก็ เช่นกัน"
 jester.300.a:0 "นี่ #EMP มัน#! เป็นสิ่งที่ไม่เห็นได้ทุกวันจริงๆ!"
 jester.300.b:0 "โอ้ เอาเถอะ ส่ง [jester.GetHerHim] เข้าคุกใต้ดินไป!"
 jester.400.t:0 "$court_jester_prefix$นักผายลมศิลป์และสุภาพ[jester.GetWomanMan]"
 jester.400.desc:0 ""ใต้ฝ่าพระบาท ท่านดูเศร้าสร้อยยิ่งนัก! ให้ข้า ทำให้ท่านรื่นเริงด้วยบทกวีที่ข้าได้ขัดเกลาแล้ว!" ตัวตลกของข้าเอ่ย กระดิ่งส่งเสียงกรุ๊งกริ๊ง\n\n"อะแฮ่ม [jester.Custom('GeneratePoem_Title')]"\n#flatulence *ปู้ด ปู้ด*#! [jester.GetSheHe] ผายลม\n"[jester.Custom('GeneratePoem_Intro_Rhyming')]"\n#flatulence *ปู้ด ปู้ด ปู้ด*#! [jester.GetSheHe] ผายลมอีกครั้งเป็นจังหวะ\n"[jester.Custom('GeneratePoem_Outro_Rhyming')]"\n#flatulence *ปู้ดดด*#! เสียงผายลมครั้งสุดท้ายดังขึ้น\n\n"ท่านชอบหรือไม่?" [jester.GetSheHe] ถามพลางหัวเราะคิกคัก"
 jester.400.a:0 "ทั้งกวี #EMP และ#! นักผายลมศิลป์!? ทักษะของเจ้าน่าอัศจรรย์ยิ่งนัก!"
 jester.400.b:0 "ข้าชอบมาก! เจ้าสอนเคล็ดลับของเจ้าให้ข้าได้หรือไม่?"
 aspiring_flatulist:0 "นักผายลมศิลป์ฝึกหัด"
 aspiring_flatulist_desc:0 "ตัวละครนี้กำลังฝึกฝนศิลปะอันประณีตและสูงส่งแห่งการผายลม\n#flatulence *ปู้ด*#!"
 jester.500.t:0 "$court_jester_prefix$โจรขโมยเสื้อผ้า"
 jester.500.desc:0 "ขณะที่ข้ากำลังจะเข้านอน ภาพเหตุการณ์ที่ตลกขบขันอย่างไม่น่าเชื่อก็ปรากฏขึ้นต่อหน้าต่อตาข้า — [SCOPE.sC('you').Custom2('RelationToMeShort', SCOPE.sC('courtier'))] [courtier.GetFirstName] ของข้า เปลือยกายล่อนจ้อนเหมือนวันที่ [courtier.GetSheHe] เกิด กำลังไล่ตามตัวตลกประจำราชสำนักของข้าพร้อมขวาน!\n\n"มานี่นะ! เอาเสื้อผ้าข้าคืนมา ไม่งั้นข้าจะผ่าเจ้าเป็นสองซีก!" [courtier.GetFirstNameNoTooltip] กรีดร้อง\n\n"โอ้ เจ้าไม่มีทางจับข้าได้หรอก! ข้าต้องการเสื้อผ้าของเจ้าเพื่อสร้างรังตัวตลกน้อยแสนสบายของข้า!" [jester.GetFirstName] หัวเราะคิกคัก พร้อมกับอุ้มเสื้อผ้าที่ขโมยมาเต็มแขน"
 jester.500.a:0 "ฮ่าๆ! นี่แหละสิ่งที่ข้าต้องการเห็น!"
 jester.500.b: "ไม่ว่าเรื่องนี้จะสนุกเพียงใด จงคืนเสื้อผ้าของ[courtier.GetHerHis]ให้ [courtier.GetHerHim] เสีย!"
 jester.600.t:0 "$court_jester_prefix$ศึกปาอาหาร"
 jester.600.desc:0 ""ใต้ฝ่าพระบาท ข้ารู้บางสิ่งที่จะ ทำให้ท่านร่าเริงขึ้น — จับตาดูให้ดีขณะที่ข้าย่องเข้าหาเหยื่อ..." [jester.GetFirstName] ตัวตลกของข้ากระซิบกับข้า\n[jester.GetSheHe] กำลังทำอะไรอยู่กันแน่?\n\n"หิวหรือ?" [jester.GetFirstNameNoTooltip] ตะโกน พลางปา [ROOT.Char.Custom('GetExpensiveDessertInTheFace')] ใส่หน้า [courtier.GetFirstName] [SCOPE.sC('you').Custom2('RelationToMeShort', SCOPE.sC('courtier'))] ของข้า!\n\nช่างเป็นสีหน้าที่ประเมินค่ามิได้! โอ้ และดูเหมือน [courtier.GetFirstNameNoTooltip] จะรับมือกับมันได้ #EMP ค่อนข้าง#! ดี โอ้ ช่างสนุกสนานอะไร เช่นนี้!"
 jester.600.a:0 "ช่างเป็นการล้อเล่นแบบคลาสสิกเสียจริง!"
 jester.600.b:0 "ให้ข้าช่วยท่านทำความสะอาดเถิด [courtier.GetFirstNameNoTooltip]!"
 jester.600.c:0 "แค่นี้เองรึ..? เอาล่ะ #EMP สู้กันเลย!#!"
 jester.700.t:0 "$court_jester_prefix$การประณามอันเผ็ดร้อน"
 jester.700.desc:0 "[jester.GetFirstName] ตัวตลกของข้า กำลังยืนเผชิญหน้ากับ [courtier.GetFirstName] [SCOPE.sC('you').Custom2('RelationToMeShort', SCOPE.sC('courtier'))] ของข้า — ข้ามาทันเวลาได้ยินการหยามเหยียดอัน #EMP แสน#! เจ็บแสบพอดิบพอดี!\n\n""เจ้า [courtier.Custom2('InsultNounSexual', SCOPE.sC('jester'))] [courtier.Custom2('InsultAdjective', SCOPE.sC('jester'))] และ [courtier.Custom2('InsultNoun', SCOPE.sC('jester'))] [courtier.Custom2('InsultAdjective', SCOPE.sC('jester'))] [courtier.Custom2('PointOfRidicule', SCOPE.sC('jester'))] และ [courtier.Custom2('InsultBehavior', SCOPE.sC('jester'))] ของเจ้าช่างเป็นที่เลื่องลือ! [courtier.Custom2('InsultSentence', SCOPE.sC('jester'))|U] เจ้า [courtier.Custom2('InsultNounSexual', SCOPE.sC('jester'))]!" [jester.GetFirstNameNoTooltip] เอ่ย ราวกับถูก [ROOT.Char.GetFaith.DevilName] เข้าสิง!\n\nใบหน้าของ [courtier.GetFirstNamePossessiveNoTooltip] แดงก่ำ แต่ [courtier.GetSheHe] รู้ว่าข้ากำลังมองอยู่ [courtier.GetSheHe] จึงแสร้งหัวเราะออกมาอย่างเจ็บปวด"
 jester.700.a:0 "นั่นเป็นการประณามที่ดี เป็นการประณามที่ #EMP ดีมาก#! จริงๆ!"
 jester.700.b:0 "อย่าเพิ่งเสียใจไป [courtier.GetFirstNameNoTooltip]! ท่านยังคง [courtier.Custom('ComplimentAdjective')] ที่สุดอยู่!"
 jester.800.t:0 "$court_jester_prefix$ตลกเจ็บตัว"
 jester.800.desc:0 ""โอ้ ไม่นะ! ดูเหมือนข้าจะล้มอีกแล้ว!" [jester.GetFirstName] ตัวตลกของข้าอุทานด้วยน้ำเสียงตลกขบขัน "
 jester.800.desc_2:0 ""ข้าซุ่มซ่ามมากจริงๆ! ข้าหวังเป็นอย่างยิ่งว่าครั้งนี้ข้าจะทรงตัวอยู่ได้!" [jester.GetSheHe] กล่าว "
 jester.800.desc_3:0 ""[jester.Custom('CulturalCurse')|U]. โชคของข้าช่างร้ายกาจนัก!" [jester.GetSheHe] หัวเราะคิกคัก "
 jester.800.desc_4:0 "หลังจากทั้งหมดนี้ ไม่มีรอยขีดข่วนบนร่างกายของ [jester.GetHerHis] เลย!"
 jester.800.a:0 "ฮ่า! ล้มลงโดยไม่เจ็บตัว น่าประทับใจ!"
 jester.800.b:0 "บา! มันไม่สนุกเลยถ้าไม่มีเลือด ทำอีกครั้งสิ #EMP แรงกว่านี้.#!"
 fall_into_sculpture:0 "กระแทกหน้าเข้ากับ [furniture_to_crash_into.GetName] ของข้าอย่างจัง!\n\n"
 somersault_into_sculpture:0 "ตีลังกาเข้าใส่ [furniture_to_crash_into.GetName] ของข้า!\n\n"
 faceplant:0 "หน้าทิ่มลงพื้นเสียงดังฟังชัด!\n\n"
 walk_into_wall:0 "ล้มกระแทกกำแพงเสียงดัง *ตุ้บ*!\n\n"
 weapon_pratfall:0 "ล้มทับลงบน [weapon_pratfall.GetName] ของข้า!\n\n"
 weapon_plummet:0 "ร่วงลงใกล้ [weapon_pratfall.GetName] ของข้าอย่างน่าหวาดเสียว!\n\n"
 forceful_tumble:0 "ล้มกลิ้งอย่างแรง!\n\n"
 jester.900.t:0 "$court_jester_prefix$ตัวตลกหลายตัวในเสื้อคลุมตัวเดียว"
 jester.900.desc: "อืม ข้าจำไม่ได้ว่าตัวตลก [jester.Custom('ComplimentAdjective')] ของข้าจะ... #EMP อวบอั๋น#!เยี่ยงนี้\n\n\"ท่าน[ROOT.Char.GetLadyLord]! ขออภัยเถิด ท่านก็เห็น... ข้ารับประทานมากไปหน่อย แลดูเหมือนว่าท้องไส้ของข้าจะไม่ค่อยจะเห็นด้วยนัก!\" [jester.GetFirstName] กล่าว ด้วยสีหน้าเจ็บปวดบนใบหน้าของ[jester.GetHerHis]\n\n#flatulence *พรืดดด*#!\n\nทันใดนั้น เสื้อคลุมหลากสีของ [jester.GetFirstNamePossessiveNoTooltip] ก็ปริแตกออก "
 jester.900.cat:0 "เผยให้เห็นลูกแมวครอกหนึ่ง! ต้องมีอย่างน้อยสามสิบตัวอยู่ในนั้น — ร้องเหมียวๆ และกลิ้งเกลื่อนไปทั่ว!\n\n"
 jester.900.dog:0 "ปล่อยลูกสุนัขร่าเริงออกมาอย่างน้อยสิบสองตัว ซึ่งเริ่มรุมทึ้งข้าราชบริพารของข้าทันทีด้วยทั้งจมูกและอุ้งเท้า!\n\n"
 jester.900.bird:0 "เผยให้เห็น [ROOT.Char.Custom('GetLivestockFowlIndef')] อีกตัวหนึ่ง อีกตัวหนึ่ง อีกตัวหนึ่ง และอีกตัวหนึ่ง #EMP และอีกตัวหนึ่ง!#!\n\n"
 jester.900.eagle: "เผยให้เห็นลูกอินทรีอันทรงสง่า ซึ่งเหินทะยานขึ้นอย่างคึกคะนองแล้วโบยบินวนเวียนอยู่ภายในห้อง!\n\n"
 jester.900.a:0 "คงไม่มีใครสังเกตเห็นถ้าข้าเก็บไว้แค่ #EMP ตัวเดียว#!..."
 jester.900.b:0 "อ่า! ลูกสุนัขซุกซนตัวนี้จะได้ร่วมล่าสัตว์กับข้าหลายครั้ง!"
 jester.900.c:0 "โอ้ ช่างเป็นภาพที่น่าตื่นตาตื่นใจ! น่ายินดียิ่งนัก!"
 jester.900.d: "ข้าจักฝึกเจ้าลูกอินทรีนี้ให้เชื่อง และจักให้มันเป็นของข้า แต่เพียงผู้เดียว!"
 jester.1000.t:0 "$court_jester_prefix$เรื่องเล่าที่ดี"
 jester.1000.desc:0 ""[ROOT.Char.Custom('FormOfAddressForLiege')] ดูเหนื่อยล้า" [jester.GetFirstName] ตัวตลกของข้าเอ่ย\n\n"ข้ารู้วิธีรักษา — มันเรียกว่า '[SCOPE.Custom('RandomEntertainmentTextName')]' ว่าอย่างไร? ให้ข้าเริ่มอ่านเลยหรือไม่?" [jester.GetFirstNameNoTooltip] กวักมือเรียกให้ข้านั่งลง\n\nมัน #EMP เป็น#! เรื่องที่น่าขบขัน... ข้าต้องการการพักผ่อนนี้เสียจริง"
 jester.1000.a:0 "[jester.GetSheHe|U] ยังทำเสียงต่างๆ ให้ตัวละครด้วย!"
 jester.1000.b:0 "[jester.GetFirstNameNoTooltip] เหตุใดเจ้าไม่เล่าเรื่องของเจ้าให้ข้าฟังแทนล่ะ?"
 jester.1000.c:0 "ข้าอยากให้เจ้าอ่านจาก #EMP [my_book.GetNameNoTooltip] มากกว่า!#!"
 jester.1000.c_flavor:0 "โอ้ ข้ารัก [my_book.GetName] จริงๆ!"
 reinvigorating_reading_modifier:0 "การอ่านที่เติมพลัง"
 reinvigorating_reading_modifier_desc:0 "ตัวละครนี้ได้รับการอ่านหนังสือล้ำค่าเล่มหนึ่งของพวกเขาให้ฟัง ซึ่งเป็นแรงบันดาลใจให้พวกเขา"
 jester.1100.t:0 "$court_jester_prefix$ผีใน [hiding_place.GetNameNoTooltip]"
 jester.1100.desc:0 "เหตุใดจึงมีเสียงดังมาจากใน [hiding_place.GetName] ของข้า? ข้ามองไปรอบห้อง ไม่มีใครอื่นอยู่ที่นี่ มันว่างเปล่าและมืดมิด\n\n#EMP *เอี๊ยดดด*#!\n\nอาจเป็นวิญญาณ? ภูตผีปีศาจร้ายบางชนิด?\nทันใดนั้นมันก็เปิดผางออก — เผยให้เห็นตัวตลกของข้า [jester.GetFirstName] กำลังกระโดดและแกว่งแขน [jester.GetHerHis] ไปมา!\n\n"ระวังผีใน [hiding_place.GetNameNoTooltip]! ข้ามาเพื่อ ทำให้ท่านหัวเราะ!" [jester.GetSheHe] กรีดร้องอย่างร่าเริง"
 jester.1100.a:0 "ฮ่า! เกือบหลอกข้าได้แล้ว!"
 jester.1100.b:0 "โดย [ROOT.Char.GetFaith.HighGodName]... แล้วถ้าเจ้าเป็นนักฆ่าล่ะ!?"
 jester.1100.c:0 "ใจข้า...!"
 jester.1100.d:0 "ทหาร เอาค้อนและตะปูมา..."
 jester.1100.d_flavor:0 "หาก [jester.GetFirstNameNoTooltip] เป็น 'ผีใน [hiding_place.GetNameNoTooltip]' จริงๆ [jester.GetSheHe] ก็คงรู้สึกเหมือนอยู่บ้านเมื่ออยู่ในนั้น... ไปตลอดชีวิตของ [jester.GetHerHis]"
