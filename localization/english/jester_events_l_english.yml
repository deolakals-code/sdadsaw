 jester.1200.t:0 "$court_jester_prefix$แหล่งข่าวลือ"
 jester.1200.desc:0 ""โอ้ ฝ่าบาท ทรงทราบหรือไม่ว่า [vassal_1.GetTitledFirstName] ได้แสดง [vassal_1.Custom('ObjectifiedFeature')] ของ [vassal_1.GetHerHis] ในที่สาธารณะเมื่อวานนี้! ไม่น่าเชื่อเลย ใช่หรือไม่?" [jester.GetFirstName] กระซิบข้างหูข้า\nตัวตลกของข้าช่างหูตาไวเสียจริง\n\n""และ — โฮ่ โฮ่! เป็นเรื่องจริง! [vassal_2_spouse.GetWifeHusband] ของ [vassal_2.GetTitledFirstNamePossessive] เรียก [vassal_2.GetHerHim] ว่า #EMP [vassal_2.Custom2('InsultNoun', SCOPE.sC('jester'))] [vassal_2.Custom2('InsultAdjectiveArticle', SCOPE.sC('jester'))]!#! ช่างน่าตื่นเต้น!" [jester.GetSheHe] กล่าวต่อ\n\n""โอ้ และพระองค์ทรงทราบหรือไม่ว่า [secret_holder.GetTitledFirstName] แอบ [secret_holder.Custom('GetSecretCrimeDescIndef')]?""
 jester.1200.a:0 "ช่างเป็นข่าวซุบซิบที่น่าอร่อยเสียจริง!"
 jester.1200.b:0 "เดี๋ยวก่อน... เรื่องเกี่ยวกับ [secret_holder.GetTitledFirstNameNoTooltip] ว่าอย่างไรนะ!?"
