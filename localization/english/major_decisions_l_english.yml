l_english: 
 major_decisions.1001.t:0 "เนื้อทิพย์"
 major_decisions.1001.desc:0 ""เราถูกส่งมายังโลกนี้เพื่อรับใช้เพื่อนมนุษย์" เสียงของ [court_chaplain.GetCouncilTitle] [court_chaplain.GetNamePossessive] ดังก้องไปทั่วห้องโถงเสวย"
 major_decisions.1001.desc_landless: ""การรับใช้เพื่อนมนุษย์นั้น หมายความว่ากระไร?" ข้าถามเชิงวาทศิลป์ขณะที่สายตาคมกริบกวาดมองใบหน้าเหล่าผู้ติดตามของข้า ณ โต๊ะอาหารค่ำอันอุดมสมบูรณ์ "มิใช่การรักและเอาใจใส่ในทุกแง่มุมของความเป็นมนุษย์ดอกหรือ?""
 major_decisions.1001.desc_outro: "\n\n"โดยการยอมรับของขวัญแห่งเนื้อหนัง ท่านก็ยอมรับความรักของ [ROOT.Char.GetFaith.HighGodHerHis|U] ด้วย เช่นกัน"\n\nเหล่าข้ารับใช้ — ผู้ที่ยังอยู่กับเรา — ได้ทำงานอย่างยอดเยี่ยม เราเลี้ยงฉลองกันจนดึกดื่น เมามายด้วย [ROOT.Char.Custom('RegionalDrink')] และรสชาติแห่งความเป็นทิพย์ของมนุษย์""
 major_decisions.1001.a:0 "ยื่นมือมาช่วยส่ง [ROOT.Char.Custom('RegionalDrink')] ให้ข้าเพิ่มที!"

 major_decisions.1002.t: "งานเลี้ยงวิปลาส"
 major_decisions.1002.desc:0 "ข้าไม่อยากจะเชื่อหูตัวเอง: ทั้งราชสำนักของ [cannibal.GetName] – แม้กระทั่ง [cannibal.GetHerHis] [court_chaplain.GetCouncilTitle] – ได้หันไปกินเนื้อคน!\n\nท้องถนนนองไปด้วยเลือดขณะที่กลุ่มอันชั่วร้ายของ [cannibal.GetHerHis] กำลังเลี้ยงฉลอง"
 major_decisions.1002.desc_landless: "ข้าไม่อยากจะเชื่อหูตัวเอง: ทั้ง [cannibal.Custom('GetCourt')|l] ของ [cannibal.GetName] ได้หันไปกินเนื้อคน!\n\nชนบทจะนองไปด้วยเลือดขณะที่กลุ่มอันชั่วร้ายของ [cannibal.GetHerHis] กำลังเลี้ยงฉลอง"
 major_decisions.1002.desc_cannibal:0 "[cannibal.GetName] ได้โน้มน้าวให้ [cannibal.GetHerHis] [court_chaplain.GetCouncilTitle] ยอมรับการกินเนื้อคนอย่างเปิดเผย\n\nข้ายินดีที่ได้รู้ว่ารสนิยมในเนื้อหนังกำลังแพร่กระจายไปไกลกว่าที่เคย!"
 major_decisions.1002.desc_cannibal_landless: "[cannibal.GetName] และ [cannibal.GetHerHis] [cannibal.Custom('GetCourt')|l] ได้ยอมรับความมหัศจรรย์ของการกินเนื้อคนอย่างเปิดเผย\n\nอย่าได้เมินเฉยต่อ [cannibal.GetHerHim] เลย — ข้ายินดีที่ได้รู้ว่ารสนิยมในเนื้อหนังกำลังแพร่กระจายไปไกลกว่าที่เคย!"
 major_decisions.1002.a:0 "ข้ารอไม่ไหวแล้วที่จะได้ร่วมโต๊ะเสวยกับ [ROOT.Char.GetHerHim]!"
 major_decisions.1002.b:0 "ขอ [ROOT.Char.GetFaith.HighGodName] ทรงเมตตาวิญญาณอันชั่วร้ายของพวกเขาด้วยเถิด!"

 major_decisions.1101.t:0 "อาณาจักรที่หลอมใหม่"
 major_decisions.1101.opening_duchies:0 "ข้าได้ทำในสิ่งที่ไม่มีใครทำได้ ข้าได้รวมดินแดนแห่ง [duchy_1.GetNameNoTierNoTooltip] เข้ากับดินแดนแห่ง [duchy_2.GetNameNoTierNoTooltip] และ [duchy_3.GetNameNoTierNoTooltip]"
 major_decisions.1101.desc:0 "ตลอดชีวิตข้า ข้าได้ทำงานเพื่อสิ่งนี้ เพื่อเรียกข้าหลวงของข้ามาและให้พวกเขาสาบานความภักดีอีกครั้ง\n\nบัดนี้และตลอดไป พวกเขาจะถวายความเคารพต่อข้า ไม่เพียงในฐานะเจ้าเหนือหัวของพวกเขา แต่ในฐานะ [ROOT.Char.GetTitleAsNameNoTooltip]! [ROOT.Char.GetTitleAsNameNoTooltip] แห่ง [new_title.GetNameNoTier]!"
 major_decisions.1101.a:0 "อาณาจักรของข้าจะคงอยู่ชั่วนิรันดร์"
 major_decisions.1101.i_have_become_royal:0 "ท่านได้กลายเป็น [founder.GetTitleAsNameNoTooltip] แห่ง [new_title.GetNameNoTier]"

 major_decisions.1102.desc:0 "เจ้าเหนือหัวของเราได้เรียกข้าหลวงของ [founder.GetHerHis] และข้ารับใช้ทั้งปวงในอาณาจักรมาเข้าเฝ้า [founder.GetHerHim] เรารู้ว่าถึงเวลาแล้ว และไม่มีผู้ใดจะโต้แย้งการอ้างสิทธิ์ของ [founder.GetHerHis]\n\n[founder.GetFirstName] จะปกครองในฐานะ [new_title.GetTierAsNameNoTooltip] เหนืออาณาจักรอันยิ่งใหญ่แห่ง [new_title.GetNameNoTier]!"
 major_decisions.1102.a:0 "ทรงพระเจริญ [founder.GetTitleAsNameNoTooltip]!"
 major_decisions.1102.a.dislike:0 "ทรงพระเจริญ [founder.GetTitleAsNameNoTooltip]..."
 major_decisions.1102.has_become_royal:0 "[founder.GetFirstName] ได้กลายเป็น [founder.GetTitleAsNameNoTooltip] แห่ง [new_title.GetNameNoTier]"

 major_decisions.1103.opening_kingdoms:0 "ข้าได้ทำในสิ่งที่ไม่มีใครทำได้ ข้าได้รวมดินแดนแห่ง [kingdom_1.GetNameNoTierNoTooltip] เข้ากับดินแดนแห่ง [kingdom_2.GetNameNoTierNoTooltip] และ [kingdom_3.GetNameNoTierNoTooltip]"
 major_decisions.1103.opening:0 "ข้าหลวงและ [ROOT.Char.GetFaith.PriestNeuterPlural] ทั้งหมดของข้าได้มาชุมนุมกันเบื้องหน้าบัลลังก์ของข้าในที่สุด ข้าได้รับช่วงเวลานี้ในสายตาของพวกเขา และที่สำคัญกว่านั้น ในสายตาของ [ROOT.Char.GetFaith.PantheonTerm]"
 major_decisions.1103.i_am_religious_head:0 "\n\nเป็นการสมควรแล้วที่ข้าจะสวมมงกุฎลงบนศีรษะของข้าเอง ขณะที่ข้ารับใช้ของข้า ทั้งทางโลกและทางธรรม ค้อมคำนับต่อข้า"
 major_decisions.1103.blessed_by_religious_head:0 "\n\nขณะที่ [religious_figure.GetTitledFirstName] สวมมงกุฎลงบนศีรษะของข้า ข้าประกาศจักรวรรดิใหม่ของข้า นี่คือสิ่งที่ข้าหลวงข้ารับใช้ของข้าอยู่ที่นี่เพื่อเป็นสักขีพยาน และเมื่อคำประกาศออกจากริมฝีปากของข้า อำนาจทั้งหมดในอาณาจักรของข้า ทั้งทางธรรมและทางโลก คุกเข่าลงเบื้องหน้าข้า"
 major_decisions.1103.a:0 "[new_title.GetNameNoTierNoTooltip] ครองความเป็นใหญ่สูงสุด!"

 major_decisions.1104.opening:0 "[founder.GetFirstName] [founder.GetLadyLord] และผู้ปกครองของเรา ได้เรียกข้าหลวงและ [founder.GetFaith.PriestNeuterPlural] ทั้งหมดในอาณาจักรมาเข้าเฝ้า [founder.GetHerHim] ข้าไม่อาจโต้แย้งได้ว่า [founder.GetSheHe] ได้รับช่วงเวลานี้อย่างชอบธรรมในสายตาของ [ROOT.Char.GetFaith.PantheonTerm]"
 major_decisions.1104.i_am_religious_head:0 "\n\nขณะที่ข้าสวมมงกุฎใหม่ของ [founder.GetHerHis] ลงบนศีรษะของ [founder.GetHerHis]"
 major_decisions.1104.religious_head_empire:0 "\n\nขณะที่ [founder.GetSheHe] สวมมงกุฎใหม่ของ [founder.GetHerHis] ลงบนศีรษะของ [founder.GetHerHis]"
 major_decisions.1104.blessed_by_religious_head:0 "\n\n\n\nขณะที่ [religious_figure.GetTitledFirstName] สวมมงกุฎใหม่ของ [founder.GetTitledFirstNamePossessive] ลงบนศีรษะของ [founder.GetHerHis]"
 major_decisions.1104.end:0 "[founder.GetFirstName] ประกาศว่านี่คือจุดกำเนิดของอาณาจักรใหม่ของ [founder.GetHerHis] ข้ารับใช้ของ [founder.GetHerHis|U] ค้อมคำนับด้วยความเคารพเบื้องหน้า [founder.GetHerHim]"
 major_decisions.1104.a:0 "[new_title.GetNameNoTierNoTooltip] จะคงอยู่ชั่วนิรันดร์!"

 major_decisions.1105.t:0 "อาณาจักรของผู้ชิงบัลลังก์"
 major_decisions.1105.desc:0 ""[founder.GetTitleAsNameNoTooltip]" [founder.GetFirstName] แห่ง [new_title.GetNameNoTierNoTooltip] ได้ประกาศราชอาณาจักรใหม่ และว่าดินแดนอันชอบธรรม #EMP ของข้า#! บางส่วนเป็นส่วนหนึ่งของมัน!"
 major_decisions.1105.a:0 "ผู้แอบอ้างนั้นจะไม่มีวันอยู่รอด..."

 
 major_decisions.2001.t:0 "มหาวิทยาลัย"
 major_decisions.2001.desc_first:0 "ยุคใหม่แห่งความรู้มาถึงแล้ว! ข้าได้พบปะกับช่างก่อสร้างและนักปราชญ์อย่างต่อเนื่อง และแผนการสำหรับมหาวิทยาลัยอันงดงามกำลังเป็นรูปเป็นร่าง\n\n"
 major_decisions.2001.desc_more:0 "นายช่างก่อสร้างแจ้งข้าว่าอิฐสำหรับมหาวิทยาลัยพร้อมที่จะวางแล้ว — สิ่งที่เหลือที่ต้องตัดสินใจคือสถานที่และชื่อ!"
 major_decisions.2001.desc:0 "นายช่างก่อสร้างแจ้งข้าว่าอิฐสำหรับมหาวิทยาลัยพร้อมที่จะวางแล้ว — สิ่งที่เหลือที่ต้องตัดสินใจคือชื่อ!"
 major_decisions.2001.b_fes:0 "ข้าจะก่อตั้งมหาวิทยาลัยอัล-กอรอวียีน!"
 major_decisions.2001.b_cairo:0 "ข้าจะก่อตั้งมหาวิทยาลัยอัล-อัซฮัร!"
 major_decisions.2001.b_bologna:0 "ข้าจะก่อตั้งมหาวิทยาลัยโบโลญญา!"
 major_decisions.2001.b_salamanca:0 "ข้าจะก่อตั้งมหาวิทยาลัยซาลามังกา!"
 major_decisions.2001.b_madrid:0 "ข้าจะก่อตั้งมหาวิทยาลัยกอมปลูเตนเซแห่งมาดริด!"
 major_decisions.2001.b_oxford:0 "ข้าจะก่อตั้งมหาวิทยาลัยออกซฟอร์ด!"
 major_decisions.2001.b_cambridge:0 "ข้าจะก่อตั้งมหาวิทยาลัยเคมบริดจ์!"
 major_decisions.2001.b_padua:0 "ข้าจะก่อตั้งมหาวิทยาลัยปาดัว!"
 major_decisions.2001.b_siena:0 "ข้าจะก่อตั้งมหาวิทยาลัยซีเอนา!"
 major_decisions.2001.b_coimbra:0 "ข้าจะก่อตั้งมหาวิทยาลัยโกอิมบรา!"
 major_decisions.2001.b_napoli:0 "ข้าจะก่อตั้งมหาวิทยาลัยโรมันอันศักดิ์สิทธิ์แห่งเนเปิลส์!"
 major_decisions.2001.b_tirakka:0 "ข้าจะก่อตั้งมหาวิทยาลัยซันโกเร!"
 major_decisions.2001.fallback:0 "ข้าจะก่อตั้ง... ไม่มีมหาวิทยาลัยในวันนี้"
 major_decisions.2001.fallback.tt:0 "การพัฒนาของเคาน์ตีต่ำเกินไป หรือมีช่องอาคารพิเศษอยู่แล้ว"

 major_decisions.2002.desc:1 "ยุคใหม่แห่งความรู้มาถึงแล้ว มหาวิทยาลัยได้ถูกก่อตั้งขึ้นในอาณาจักรของ [founder.GetName] มันกำลังกลายเป็นศูนย์กลางสำหรับนักปราชญ์และผู้มีความรู้อื่นๆ อย่างรวดเร็ว ประกาศว่าเป็นสภาพแวดล้อมที่ดีที่สุดสำหรับคนหนุ่มสาวในการเรียนรู้ไตรศาสตร์และจตุรศาสตร์ และทุกสิ่งอื่นใดที่อาจจำเป็นเพื่อทำความเข้าใจโลก"
 major_decisions.2002.a:1 "ขอให้ความรู้ของพวกเขาเป็นประโยชน์แก่เราทุกคน!"

 major_decisions.2011.t:0 "[new_courtier.GetWomanMan|U] ผู้ปราดเปรื่อง"
 major_decisions.2011.desc:0 "[new_courtier.GetName] [new_courtier.GetWomanMan] ผู้ทั้ง [ROOT.Char.Custom2('DescriptorPositive', SCOPE.sC('new_courtier') )] และปราดเปรื่อง ทักทายข้าอย่างสง่างาม\n\n"ข้าได้ยินเรื่องมหาวิทยาลัยใหม่ของท่านแล้ว! [ROOT.Char.GetTitleAsNameNoTooltip] ที่ชื่นชอบความรู้ถึงขนาดนั้น... ข้าคงเป็นเกียรติอย่างยิ่งที่จะได้รับใช้ท่าน""
 major_decisions.2011.a:0 "ยินดีต้อนรับ ยินดีต้อนรับ!"
 major_decisions.2011.b:0 "เจ้าจะหาที่สำหรับเจ้าที่นี่ไม่ได้"

 major_decisions.3001.t:0 "เรือนพฤกษา"
 major_decisions.3001.desc:0 "รอบตัวข้า พืชพรรณนานาชนิดเจริญงอกงาม น้ำควบแน่นบนบานกระจกด้านบนขณะที่แสงอาทิตย์ส่องผ่านกระจกเข้ามายังใบหน้าที่เงยขึ้นของข้า ข้าหมุนตัว — เร็วขึ้นและเร็วขึ้น — และข้าโยนเสื้อคลุมลงกับพื้นด้วยความยินดีขณะที่ข้าหัวเราะ\n\n"ดวงอาทิตย์อยู่ในนี้กับเรา มันคุ้มค่ากับทรัพย์สมบัติที่เสียไปจริงๆ!""
 major_decisions.3001.a:0 "ข้าได้ ทำให้แสงอาทิตย์เชื่องแล้ว!"

 major_decisions.3002.desc:0 "[builder.GetName] เสียสติไปแล้วจริงๆ! [builder.GetSheHe|U] ได้ใช้ทรัพย์สมบัติมหาศาลสร้างอาคารทั้งหลังด้วยกระจกและประกาศว่าดวงอาทิตย์ถูก ทำให้เชื่องและจับไว้ได้\n\nรายงานเรื่องพืชพรรณที่เจริญงอกงามนั้นย่อมเป็นผลมาจากความหลงผิดของ [builder.GetHerHis] อย่างแน่นอน การแสดงตบตาของ [builder.GetWomanMan] บ้าคนนั้นจะสิ้นสุดลงเมื่อใดกัน?!"
 major_decisions.3002.a:0 "นี่มันชักจะไร้สาระเกินไปแล้ว!"

 major_decisions.3100.t:0 "ปัญหาการสืบราชสมบัติ"
 major_decisions.3100.desc:0 "คำถามว่าใครจะสืบทอดตำแหน่งต่อจากข้าหลังจากข้าสิ้นชีพได้รบกวนจิตใจข้าอย่างไม่หยุดหย่อนเมื่อเร็วๆ นี้ ภัยคุกคามของการแบ่งแยกอาณาจักรอยู่ในใจข้าเสมอ\n\nแน่นอนว่า ในขณะที่ปกติแล้วเป็นการยากที่จะโน้มน้าวให้อาณาจักรยอมรับระเบียบใหม่ในการสืบราชสมบัติ มันอาจจะ #EMP ง่ายกว่ามาก#! ที่จะกลับไปสู่แบบเก่า..."
 major_decisions.3100.a:0 "วิถีโบราณของชนชาติข้านั้นดีที่สุด!"
 major_decisions.3100.d:0 "เอ่อ คิดดูอีกที การแบ่งแยกยุติธรรมกว่า"
 major_decisions.3100.tt_opinion_witengamot:1 "ข้าหลวงของ [cultures|E] ที่มี [culture_tradition|E] $tradition_the_witenagemot_name$"
 major_decisions.3100.tt_opinion_thing:1 "ข้าหลวงของ [cultures|E] ที่มี [heritage|E] $heritage_north_germanic_name$"
 major_decisions.3100.tt_opinion_tanistry:1 "ข้าหลวง ซึ่ง [cultures|E] มี [heritage|E] $heritage_goidelic_name$"
 major_decisions.3100.tt_opinion_jirga: "ข้าหลวงของ [cultures|E] ที่มี [culture_tradition|E] $tradition_fp3_jirga_name$"
