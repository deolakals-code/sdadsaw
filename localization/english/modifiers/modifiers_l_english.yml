 piety_level_0: "คนบาป"
 piety_level_0_desc: "$piety_level_0$ เป็น[piety_level|E]เชิงลบเพียงระดับเดียว ระดับถัดไปคือ [GetModifier( 'piety_level_1' ).GetNameWithTooltip|L]\nผลกระทบ:\n[GetPietyLevelDesc( '(int32)0' )]"
 piety_level_1: "ผู้ปฏิบัติหน้าที่"
 piety_level_1_desc: "$piety_level_1$ เป็น[piety_level|E]ระดับแรก ระดับถัดไปคือ [GetModifier( 'piety_level_2' ).GetNameWithTooltip|L]\nผลกระทบ:\n[GetPietyLevelDesc( '(int32)1' )]"
 piety_level_2: "ผู้มีศรัทธา"
 piety_level_2_desc: "$piety_level_2$ เป็น[piety_level|E]ระดับที่สอง ระดับถัดไปคือ [GetModifier( 'piety_level_3' ).GetNameWithTooltip|L]\nผลกระทบ:\n[GetPietyLevelDesc( '(int32)2' )]"
 piety_level_3: "ผู้รับใช้ที่อุทิศตน"
 piety_level_3_desc: "$piety_level_3$ เป็น[piety_level|E]ระดับที่สาม ระดับถัดไปคือ [GetModifier( 'piety_level_4' ).GetNameWithTooltip|L]\nผลกระทบ:\n[GetPietyLevelDesc( '(int32)3' )]"
 piety_level_4: "แบบอย่างแห่งคุณธรรม"
 piety_level_4_desc: "$piety_level_4$ เป็น[piety_level|E]ระดับที่สี่ ระดับถัดไปคือ [GetModifier( 'piety_level_5' ).GetNameWithTooltip|L]\nผลกระทบ:\n[GetPietyLevelDesc( '(int32)4' )]"
 piety_level_5: "สัญลักษณ์ทางศาสนา"
 piety_level_5_desc: "$piety_level_5$ คือ [piety_level|E] ระดับที่ห้าและสูงสุดที่เป็นไปได้สำหรับ [governments|E] ที่มิใช่ [mandala|E] ระดับถัดไปคือ [GetModifier( 'piety_level_6' ).GetNameWithTooltip|L].\nผลกระทบ:\n[GetPietyLevelDesc('(int32)5')|=+]"
 piety_level_6: "เทวะ"
 piety_level_6_desc: "$piety_level_6$ คือ [piety_level|E] ระดับที่หก ระดับถัดไปคือ [GetModifier( 'piety_level_7' ).GetNameWithTooltip|L].\n\nเมื่อ [ruler|E] [mandala|E] สิ้นชีพในลักษณะที่ [aspect|E] ของตนยอมรับได้ หลังจากบรรลุ [GetModifier( 'piety_level_5' ).GetNameWithTooltip|L], [heir|E] ของผู้ปกครองผู้นั้นจะบังเกิดความสามารถในการก้าวหน้าสู่ระดับแห่งศรัทธานี้\n\nผลกระทบ:\n[GetPietyLevelDesc('(int32)6')|=+]"
 piety_level_7: "กึ่งเทพ"
 piety_level_7_desc: "$piety_level_7$ คือ [piety_level|E] ระดับที่เจ็ด ระดับถัดไปคือ [GetModifier( 'piety_level_8' ).GetNameWithTooltip|L].\n\nเมื่อ [ruler|E] [mandala|E] สิ้นชีพในลักษณะที่ [aspect|E] ของตนยอมรับได้ หลังจากบรรลุ [GetModifier( 'piety_level_6' ).GetNameWithTooltip|L], [heir|E] ของผู้ปกครองผู้นั้นจะบังเกิดความสามารถในการก้าวหน้าสู่ระดับแห่งศรัทธานี้\n\nผลกระทบ:\n[GetPietyLevelDesc('(int32)7')|=+]"
 piety_level_8: "ดุจเทพเจ้า"
 piety_level_8_desc: "$piety_level_8$ คือ [piety_level|E] ระดับที่แปดและสูงสุดที่เป็นไปได้สำหรับ [government|E] [mandala|E]\n\nเมื่อ [ruler|E] [mandala|E] สิ้นชีพในลักษณะที่ [aspect|E] ของตนยอมรับได้ หลังจากบรรลุ [GetModifier( 'piety_level_7' ).GetNameWithTooltip|L], [heir|E] ของผู้ปกครองผู้นั้นจะบังเกิดความสามารถในการก้าวหน้าสู่ระดับแห่งศรัทธาสูงสุดนี้\n\nผลกระทบ:\n[GetPietyLevelDesc('(int32)8')|=+]"

 prestige_level_0: "ผู้อัปยศ"
 prestige_level_0_desc: "$prestige_level_0$ เป็น[prestige_level|E]ระดับต่ำสุดที่เป็นไปได้ ระดับถัดไปคือ [GetModifier( 'prestige_level_1' ).GetNameWithTooltip|L]\nผลกระทบ:\n[GetPrestigeLevelDesc( '(int32)0' )]"
 prestige_level_1: "ผู้เป็นที่ยอมรับ"
 prestige_level_1_desc: "$prestige_level_1$ เป็น[prestige_level|E]ระดับที่สอง ระดับถัดไปคือ [GetModifier( 'prestige_level_2' ).GetNameWithTooltip|L]\nผลกระทบ:\n[GetPrestigeLevelDesc( '(int32)1' )]"
 prestige_level_2: "ผู้โดดเด่น"
 prestige_level_2_desc: "$prestige_level_2$ เป็น[prestige_level|E]ระดับที่สาม ระดับถัดไปคือ [GetModifier( 'prestige_level_3' ).GetNameWithTooltip|L]\nผลกระทบ:\n[GetPrestigeLevelDesc( '(int32)2' )]\n[SelectLocalization( IsLandlessAdventurer( GetPlayer ), 'prestige_level_2_laamp_desc', 'blank_line' )]"
 prestige_level_3: "ผู้มีชื่อเสียง"
 prestige_level_3_desc: "$prestige_level_3$ เป็น[prestige_level|E]ระดับที่สี่ ระดับถัดไปคือ [GetModifier( 'prestige_level_4' ).GetNameWithTooltip|L]\nผลกระทบ:\n[GetPrestigeLevelDesc( '(int32)3' )]\n[SelectLocalization( IsLandlessAdventurer( GetPlayer ), 'prestige_level_3_laamp_desc', 'blank_line' )]"
 prestige_level_4: "ผู้สูงส่งในหมู่ชน"
 prestige_level_4_desc: "$prestige_level_4$ เป็น[prestige_level|E]ระดับที่ห้า ระดับถัดไปคือ [GetModifier( 'prestige_level_5' ).GetNameWithTooltip|L]\nผลกระทบ:\n[GetPrestigeLevelDesc( '(int32)4' )]\n[SelectLocalization( IsLandlessAdventurer( GetPlayer ), 'prestige_level_4_laamp_desc', 'blank_line' )]"
 prestige_level_5: "บุคคลในตำนาน"
 prestige_level_5_desc: "$prestige_level_5$ เป็น[prestige_level|E]ระดับที่หกและสูงสุดที่เป็นไปได้\nผลกระทบ:\n[GetPrestigeLevelDesc('(int32)5')]\n[SelectLocalization( IsLandlessAdventurer( GetPlayer ), 'prestige_level_5_laamp_desc', 'blank_line' )]"
 prestige_level_2_laamp_desc: "ปลดล็อกสิ่งต่อไปนี้:\n\t#weak $EP3_LAAMP_INVASION_CB_COUNTY_NAME$ [casus_belli|e]\n\t$purchase_land_interaction$ [interaction|E] สำหรับ[counties|E]\n\tรางวัล[county|E]จาก $hire_laamp_mercenaries_interaction$\n\t$procure_estate_interaction$ [interaction|E] #!"
 prestige_level_3_laamp_desc: "ปลดล็อกสิ่งต่อไปนี้:\n\t#weak $EP3_LAAMP_INVASION_CB_DUCHY_NAME$ และต่ำกว่า [casus_bellis|e]\n\t$purchase_land_interaction$ [interaction|E] สำหรับ[counties|E]และ[duchies|E]\n\tรางวัล[county|E]และ[duchy|E]จาก $hire_laamp_mercenaries_interaction$ [interaction|E]\n\t[scheme|E]$seize_realm$ สำหรับ[duchies|E]และ[counties|E]\n\t$request_laamp_invasion_sponsorship_interaction$ [interaction|E]#!"
 prestige_level_4_laamp_desc: "ปลดล็อกสิ่งต่อไปนี้:\n\t#weak $EP3_LAAMP_INVASION_CB_KINGDOM_NAME$ และต่ำกว่า [casus_bellis|e]\n\t$purchase_land_interaction$ [interaction|E] สำหรับ[duchies|E]และ[counties|E]พร้อมการยอมรับที่เพิ่มขึ้น\n\tรางวัล[county|E]และ[duchy|E]จาก $hire_laamp_mercenaries_interaction$\n\t[scheme|E]$seize_realm$ สำหรับ[kingdoms|E]และต่ำกว่า\n\t$request_laamp_invasion_sponsorship_interaction$ [interaction|E] #!"
 prestige_level_5_laamp_desc: "ปลดล็อกสิ่งต่อไปนี้:\n\t#weak $EP3_LAAMP_INVASION_CB_EMPIRE_NAME$ และต่ำกว่า\n\t$purchase_land_interaction$ [interaction|E] สำหรับ[duchies|E]และ[counties|E]พร้อมการยอมรับที่เพิ่มขึ้น\n\tรางวัล[county|E]และ[duchy|E]จาก $hire_laamp_mercenaries_interaction$\n\t[scheme|E]$seize_realm$ สำหรับ[empires|E]และต่ำกว่า\n\t$request_laamp_invasion_sponsorship_interaction$ [interaction|E] #!"

