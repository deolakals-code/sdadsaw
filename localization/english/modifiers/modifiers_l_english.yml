 parliamentary_bureaucracy_modifier:0 "ระบบราชการแบบรัฐสภา"
 parliamentary_bureaucracy_modifier_desc:0 "ชุดกฎหมายที่ประมวลและขยายขอบเขตได้จัดระเบียบและมอบอำนาจแก่สมาชิกของฐานันดรทั้งสามที่อาศัยอยู่ในที่ดินผืนนี้"
 flourishing_culture_modifier:0 "วัฒนธรรมรุ่งเรือง"
 flourishing_culture_modifier_desc:0 "ที่ดินผืนนี้กำลังประสบกับความเจริญรุ่งเรืองด้านประชากร ความมั่งคั่ง และศิลปะ"
 hungarian_resettlement_modifier:0 "ผู้ตั้งถิ่นฐานชาวคริสต์"
 hungarian_resettlement_modifier_desc:0 "ดินแดนที่เคยรกร้างแห่งนี้กำลังเติบโตอย่างไม่คาดคิด เนื่องจากการหลั่งไหลเข้ามาอย่างต่อเนื่องของผู้ตั้งถิ่นฐานใหม่จากอาณาจักรใกล้เคียง"
 magyar_appreciation_modifier:0 "ความเห็นใจชาวแมกยาร์"
 magyar_appreciation_modifier_desc:0 "ชุมชนชาวแมกยาร์ท้องถิ่นในที่ดินผืนนี้รู้สึกอบอุ่นใจจากการสนับสนุนที่เจ้าเหนือหัวแสดงต่อประเพณีโบราณของพวกเขา"
 modifier_dusgruntled_church:0 "การลงทุนในโบสถ์ที่ถูกขัดขวาง"
 modifier_dusgruntled_church_desc:0 "โบสถ์ท้องถิ่นไม่พอใจนับตั้งแต่โอกาสดีหลุดลอยไป"
 modifier_religious_understanding_modifier:0 "ความเข้าใจทางศาสนา"
 modifier_religious_understanding_modifier_desc:0 "เจ้าเหนือหัวของดินแดนเหล่านี้ได้แสดงความเข้าใจต่อศาสนาของพื้นที่นี้"
 fertile_desert_mountains_modifier:0 "อัล-ยัมนัต"
 fertile_desert_mountains_modifier_desc:0 "ตั้งแต่สมัยโบราณ ส่วนใต้ของอาระเบียเป็นที่รู้จักในนามอาระเบียที่อุดมสมบูรณ์ หรือเฟลิซิตัส ภูมิภาคนี้มีผู้คนอาศัยอยู่มากกว่าและเพาะปลูกได้ดีกว่าส่วนอื่นๆ โดยรอบของคาบสมุทร\nสามารถสร้าง [GetBuilding('cereal_fields_01').GetName]"
 dodekapolis_modifier: "โดเดคาโพลิส"
 dodekapolis_modifier_desc: "นับตั้งแต่ยุคของโฮเมอร์ เมื่อชาวอาณานิคมเอโอเลียนและไอโอเนียนขึ้นฝั่งบนชายฝั่งตะวันตกของอนาโตเลีย เมืองทั้ง 12 แห่งของชายฝั่งอนาโตเลีย — #EMP โดเดคาโพลิส#! — ได้ยืนหยัดเป็นประภาคารอันส่องสว่างแห่งอารยธรรมและการพัฒนามนุษย์\nสามารถสร้าง [GetBuilding('cereal_fields_01').GetName]"
 backwater_county_modifier: "พื้นที่ห่างไกลความเจริญ"
 backwater_county_modifier_desc: "ยิ่งใหญ่เท่าไร ยิ่งล้มดังเท่านั้น เคาน์ตีนี้ ซึ่งครั้งหนึ่งเคยเป็นดินแดนของผู้ปกครองเฮลลาสผู้แข็งกร้าว ได้ตกต่ำลงอย่างน่าเศร้า แม้ปัจจุบันจะเป็นเพียงเงาของอดีต แต่เคาน์ตีนี้ก็อาจผงาดขึ้นสู่ความยิ่งใหญ่อีกครั้งได้\n\n#X @warning_icon! ตัวปรับแต่งนี้อาจถูกลบออกได้โดยใช้ [GetDecisionWithKey('restore_backwater_counties_decision').GetName] [decision|E] เมื่อ [development|E] ของ [county|E] นี้มีค่า #V 50#! หรือมากกว่า!#!\n\n"

 dance_plague_modifier:0 "โรคระบาดเต้นรำถูกมองข้าม"
 dance_plague_modifier_desc:0 "ชาวนาในพื้นที่นี้ที่ป่วยด้วยโรคเออร์กอต ได้รับการเพิกเฉยต่อคำร้องขอความช่วยเหลือจากผู้ปกครองดินแดน"

