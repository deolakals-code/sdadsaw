l_english: 
 liege_respected_fighter_modifier:0 "ผู้นำไพร่ถูกหยามเกียรติ"
 liege_respected_fighter_modifier_desc:0 "ผู้นำไพร่ท้องถิ่นจากเคาน์ตีนี้เพิ่งถูกหยามเกียรติในการต่อสู้ด้วยหมัดกับเจ้าเหนือหัวของตน"
 reduced_taxes_modifier:0 "ลดหย่อนภาษี"
 reduced_taxes_modifier_desc:0 "เคาน์ตีนี้ได้เจรจาต่อรองสำเร็จ "
 scared_of_liege_modifier:0 "การทรมานล่าสุด"
 scared_of_liege_modifier_desc:0 "ไพร่ท้องถิ่นผู้ไม่กล่าวถึงเจ้าเหนือหัวอย่างเหมาะสมถูกทรมานอย่างโหดเหี้ยมเพื่อเป็นการลงโทษ ทำให้ชาวบ้านไม่พอใจและหวาดกลัว"
 terrified_of_liege_modifier:0 "การทรมานอันโหดร้าย"
 terrified_of_liege_modifier_desc:0 "ไพร่ท้องถิ่นผู้ไม่กล่าวถึงเจ้าเหนือหัวอย่างเหมาะสมถูกควักไส้กระจายไปทั่วชนบท"
 sacred_touch:0 "สัมผัสอันศักดิ์สิทธิ์"
 sacred_touch_desc:0 "เคาน์ตีนี้เพิ่งได้รับพรจากการสัมผัสของเชื้อพระวงศ์องค์สำคัญ"
 alms_distributed:0 "แจกทาน"
 alms_distributed_desc:0 "คนยากจนในเคาน์ตีนี้เพิ่งได้รับความเมตตาอย่างใหญ่หลวง"
 chastised_tyrant_modifier:0 "ทรราชผู้ถูกตำหนิ"
 chastised_tyrant_modifier_desc:0 "ผู้ปกครองอาณาจักรเพิ่งถูกตำหนิจากการใช้อำนาจกดขี่ในเคาน์ตีนี้"
 locals_terrorised_modifier:0 "ชาวบ้านถูกคุกคาม"
 locals_terrorised_modifier_desc:0 "อาชญากรรายย่อยเพิ่งถูกคุกคามโดยไม่จำเป็นในเคาน์ตีนี้"
 sacred_site_vandalised_modifier:0 "สถานที่ศักดิ์สิทธิ์ถูกทำลาย"
 sacred_site_vandalised_modifier_desc:0 "สถานที่อันศักดิ์สิทธิ์ที่สุดของผู้คนในเคาน์ตีนี้เพิ่งถูกทำลายโดยผู้ปกครองท้องถิ่น"
 kings_carving_modifier:0 "รอยแกะสลักของขุนนาง"
 kings_carving_modifier_desc:0 "ขุนนางระดับสูงได้ทิ้งร่องรอยไว้ในภูมิภาคนี้ ทำให้ชาวบ้านรู้สึกว่าได้รับการยอมรับ"
 tutored_by_landless_modifier:0 "การสอนโดยขุนนาง"
 tutored_by_landless_modifier_desc:0 "ตัวละครนี้เพิ่งได้รับการสอนในหัวข้อที่ยาก"
 healed_by_wise_woman_modifier:0 "การรักษาลี้ลับ"
 healed_by_wise_woman_modifier_desc:0 "ตัวละครนี้เพิ่งได้รับการดูแลจากผู้รักษาทางจิตวิญญาณลึกลับ"
 tended_by_wise_woman_modifier:0 "การดูแลลี้ลับ"
 tended_by_wise_woman_modifier_desc:0 "บาดแผลของตัวละครนี้เพิ่งได้รับการดูแลจากผู้รักษาทางจิตวิญญาณลึกลับ"
 balanced_by_wise_woman_modifier:0 "ปรับสมดุลธาตุ"
 balanced_by_wise_woman_modifier_desc:0 "ด้วยวิธีปฏิบัติลี้ลับแปลกประหลาด ธาตุในกายของตัวละครนี้เพิ่งได้รับการปรับสมดุล"
 makeover_from_wise_woman_modifier:0 "เครื่องสำอางสมุนไพร"
 makeover_from_wise_woman_modifier_desc:0 "ตัวละครนี้เพิ่งได้รับการบำรุงความงามจากผู้รักษาทางจิตวิญญาณ"
 hurt_by_wise_woman_modifier:0 "การรักษาอันอัปมงคล"
 hurt_by_wise_woman_modifier_desc:0 "ตัวละครนี้เพิ่งไปพบผู้รักษาทางจิตวิญญาณ และกลับมารู้สึกแย่กว่าตอนแรกมาก"
 bad_makeover_from_wise_woman_modifier:0 "เครื่องสำอางน่าเกลียด"
 bad_makeover_from_wise_woman_modifier_desc:0 "$makeover_from_wise_woman_modifier_desc$"
 full_of_dessert_modifier:0 "อิ่มของหวาน"
 full_of_dessert_modifier_desc:0 "ตัวละครนี้เพิ่งเพลิดเพลินกับงานเลี้ยงของหวานอันยิ่งใหญ่ ทำให้พวกเขารู้สึกพึงพอใจและอิ่มหนำ"
 stomach_ache_modifier:0 "ปวดท้อง"
 stomach_ache_modifier_desc:0 "ตัวละครนี้เพิ่งบริโภคอาหารมากเกินไปและมีอาการปวดท้อง"
 ate_human_heart:0 "กระเพาะกล้าหาญ"
 ate_human_heart_desc:0 "ตัวละครนี้เพิ่งกินบางอย่างที่พวกเขาเชื่อว่าจะมอบความแข็งแกร่งของนักรบผู้ทรงพลังให้แก่ตน"
 ate_human_heart_bad:0 "กระเพาะปั่นป่วน"
 ate_human_heart_bad_desc:0 "ตัวละครนี้เพิ่งกินบางอย่างที่พวกเขาเชื่อว่าจะมอบความแข็งแกร่งของนักรบผู้ทรงพลังให้แก่ตน แต่พวกเขามีปฏิกิริยาที่ไม่ดีต่อมัน"
 succesful_food_experiment_modifier:0 "การทดลองอาหารสำเร็จ"
 succesful_food_experiment_modifier_desc:0 "ตัวละครนี้ได้ทดลองกับอาหารและสัมผัสกับความรู้สึกที่ใครๆ ก็ได้ แต่ฝันถึง"
 well_rested_modifier:0 "พักผ่อนเต็มที่"
 well_rested_modifier_desc:0 "ตัวละครนี้สามารถพักผ่อนได้อย่างที่สมควรได้รับ"
 tour_sleep_deprived_modifier:0 "อดนอน"
 tour_sleep_deprived_modifier_desc:0 "ตัวละครนี้อยู่ทั้งคืนเพื่อค้นหาที่พักอาศัยอย่างหมกมุ่น ตามล่าความลับ"
 highwaymen_eliminated_modifier:0 "กำจัดโจร"
 highwaymen_eliminated_modifier_desc:0 "เส้นทางสัญจรยอดนิยมในเคาน์ตีนี้เพิ่งถูกกวาดล้างโจร ทำให้ผู้เดินทางและพ่อค้าปลอดภัย"

 courtier_cook_modifier:0 "พ่อครัวข้าราชสำนัก"
 courtier_cook_modifier_desc:0 "ตัวละครนี้ได้จัดหาพ่อครัวที่มีความสามารถมา"

 drunken_stupor:0 "เมามายไม่ได้สติ"
 drunken_stupor_desc:0 "ตัวละครนี้เพิ่งดื่มจนเมามายไม่ได้สติ การกระทำอันน่าอับอายที่พวกเขาอาจทำไปอาจไม่มีวันถูกกล่าวถึงอีก"
 boozeless_modifier:0 "คลังเอลหมดเกลี้ยง"
 boozeless_modifier_desc:0 "คลังเครื่องดื่มแอลกอฮอล์ของตัวละครนี้หมดเกลี้ยง ทำให้พวกเขาเป็นเจ้าบ้านที่ไม่ดี"

 tour_liege_extra_taxation_county_modifier:0 "ภาษีเจ้าเหนือหัว"
 tour_liege_extra_taxation_county_modifier_desc:0 "เจ้าของเคาน์ตีนี้กำลังชดเชยการเก็บภาษีพิเศษของเจ้าเหนือหัวด้วยการเก็บภาษีประชาชนของตน"
 tours_grounds_luxury_dining_modifier:0 "การรับประทานอาหารหรูหรา"
 tours_grounds_luxury_dining_modifier_desc:0 "ตัวละครนี้ได้ยึดสินค้าฟุ่มเฟือยจำนวนมากจากข้าหลวงและกำลังเพลิดเพลินกับมัน"
 tours_grounds_hunting_companions_modifier:0 "สหายล่าสัตว์"
 tours_grounds_hunting_companions_modifier_desc:0 "ตัวละครนี้ได้ยึดสัตว์เลี้ยงล่าสัตว์ชั้นยอดบางตัวจากข้าหลวง"
 tours_grounds_excellent_horses_modifier:0 "ม้าที่ถูกยึด"
 tours_grounds_excellent_horses_modifier_desc:0 "ตัวละครนี้ได้ยึดม้าชั้นยอดบางตัวจากข้าหลวง"
 tours_grounds_sharing_tips_with_friend_modifier:0 "แบ่งปันเคล็ดลับกับสหาย"
 tours_grounds_sharing_tips_with_friend_modifier_desc:0 "ตัวละครนี้แบ่งปันเคล็ดลับกับสหายเกี่ยวกับความสนใจร่วมกันเป็นประจำ"
 tour_grounds_hidden_assets_modifier:0 "ทรัพย์สินที่ซ่อนไว้"
 tour_grounds_hidden_assets_modifier_desc:0 "ตัวละครนี้สามารถซ่อนทรัพย์สินมีค่าบางส่วนจากการเก็บภาษีของเจ้าเหนือหัวได้"

 embarassing_performance_modifier:0 "การแสดงอันน่าอับอาย"
 embarassing_performance_modifier_desc:0 "ตัวละครนี้ได้ ทำให้เจ้าเหนือหัวขุ่นเคืองผ่านการแสดงอันน่าอับอาย"
 skirmisher_learnings:0 "นวัตกรรมทหารราบเบา"
 skirmisher_learnings_desc:0 "ตัวละครนี้เพิ่งสังเกตว่าอาณาจักรต่างแดนจัดการทหารราบเบาอย่างไร"
 heavy_infantry_learnings:0 "นวัตกรรมทหารราบหนัก"
 heavy_infantry_learnings_desc:0 "ตัวละครนี้เพิ่งสังเกตว่าอาณาจักรต่างแดนจัดการทหารราบหนักอย่างไร"
 archers_learnings:0 "นวัตกรรมพลธนู"
 archers_learnings_desc:0 "ตัวละครนี้เพิ่งสังเกตว่าอาณาจักรต่างแดนจัดการพลธนูอย่างไร"
 cavalry_learnings:0 "นวัตกรรมทหารม้า"
 cavalry_learnings_desc:0 "ตัวละครนี้เพิ่งสังเกตว่าอาณาจักรต่างแดนจัดการทหารม้าอย่างไร"
 general_maa_learning:0 "การจัดการที่มีประสิทธิภาพ"
 general_maa_learning_desc:0 "ตัวละครนี้เพิ่งเรียนรู้วิธีที่มีประสิทธิภาพมากขึ้นในการประจำการทหารประจำการของตน"
 clearing_crime_modifier:0 "กวาดล้างอาชญากรรม"
 clearing_crime_modifier_desc:0 "เมื่อเร็วๆ นี้ มีการดำเนินการทางทหารในเคาน์ตีนี้เพื่อกวาดล้างอาชญากรรม แม้จะมีประสิทธิภาพในการใช้อำนาจเหนือพื้นที่ แต่ชาวบ้านก็ได้รับผลกระทบจากมาตรการรุนแรงเหล่านี้"
 liege_bad_micromanagement:0 "การจัดการที่ผิดพลาด"
 liege_bad_micromanagement_desc:0 "ขุนนางท้องถิ่นคนหนึ่งรู้สึกว่าพวกเขาสามารถปรับปรุงทหารประจำการของตัวละครนี้ได้ พวกเขาคิดผิด"
 totally_lost_modifier:0 "หลงทางโดยสิ้นเชิง"
 liesurely_studies:0 "การศึกษาตามอัธยาศัย"
 liesurely_stroll:0 "การเดินเล่นตามอัธยาศัย"
 guarded_garden:0 "สวนที่มีการป้องกัน"
 military_studies:0 "การศึกษาทางการทหาร"
 festival_disruption:0 "การขัดขวางเทศกาล"
 liege_judged_festival:0 "ขุนนางตัดสินเทศกาล"
 pious_liege:0 "เจ้าเหนือหัวผู้ศรัทธา"
 tolerant_liege:0 "เจ้าเหนือหัวผู้ใจกว้าง"
 recent_cultural_festival:0 "เทศกาลวัฒนธรรมล่าสุด"
 ep2_popular_liege:0 "เจ้าเหนือหัวผู้เป็นที่นิยม"
