 VIRTUE_MODIFIER:0 "[TRAIT.GetName( GetPlayer )|L] ([virtue|E])"
 SIN_MODIFIER:0 "[TRAIT.GetName( GetPlayer )|L] ([sin|E])"

 recent_excommunication:0 "การขับออกจากศาสนาล่าสุด"
 recent_excommunication_desc:0 "ตัวละครนี้เพิ่งถูก [excommunicated|E] ทำลายสถานะในสายตาแห่งศรัทธาของตน"
 
 excommunication_recently_lifted:0 "การขับออกจากศาสนาเพิ่งถูกยกเลิก"
 excommunication_recently_lifted_desc:0 "ต้องใช้เวลาสักพักกว่ามลทินจากการ [excommunication|E] ในอดีตของตัวละครนี้จะจางหายไปโดยสิ้นเชิง"

 vow_of_poverty_modifier:0 "คำปฏิญาณแห่งความยากจน"
 vow_of_poverty_modifier_desc:0 "ตัวละครนี้ได้ให้คำปฏิญาณอันศักดิ์สิทธิ์ที่จะบริจาคทรัพย์สมบัติส่วนใหญ่ของตน"

 temporal_condemnation_modifier:0 "การประณามทางโลก"
 temporal_condemnation_modifier_desc:0 "ผู้มีอำนาจทางศาสนาได้ประณามตัวละครนี้ว่าไม่เหมาะสมที่จะนำผู้ศรัทธา"

 scorned_theocrats_modifier:0 "นักบวชผู้ถูกดูหมิ่น"
 scorned_theocrats_modifier_desc:0 "ตัวละครนี้ได้ดูหมิ่นและข่มขู่สมาชิกของคณะสงฆ์ในที่สาธารณะ"

 known_non_believer:0 "ผู้ไม่เชื่อ"
 known_non_believer_desc:0 "ตัวละครนี้ถูกเปิดโปงว่าเป็นผู้ไม่เชื่อ"

 dynasty_beneficiary_won_ghw:0 "ราชวงศ์อันแรงกล้า"
 dynasty_beneficiary_won_ghw_desc:1 "มิมีผู้ใดปฏิเสธความศรัทธาอันแรงกล้าและความกล้าหาญ ซึ่งสมาชิกแห่งราชวงศ์นี้ได้แสดงให้ประจักษ์ครั้งแล้วครั้งเล่าในสงคราม โดยเฉพาะอย่างยิ่งเมื่อเป็นเรื่องของศรัทธา"

 house_beneficiary_won_ghw_crusade:0 "ตระกูลนักรบครูเสด"
 house_beneficiary_won_ghw_crusade_desc:0 "เมื่อถึงเวลาพิสูจน์ความจงรักภักดีต่อคริสตจักร สมาชิกแห่งตระกูลนี้พร้อมที่จะตอบรับการเรียกระดมพลและสร้างชื่อเสียงในการต่อสู้กับพวกนอกรีต"
 house_beneficiary_won_ghw_jihad:0 "ตระกูลมุญาฮิด"
 house_beneficiary_won_ghw_jihad_desc:0 "ไม่ต้องสงสัยเลย: จิตวิญญาณแห่งการต่อสู้อันศักดิ์สิทธิ์ยังคงมีชีวิตและแข็งแกร่งในหมู่สมาชิกแห่งตระกูลนี้"
 house_beneficiary_won_ghw:0 "นักรบศักดิ์สิทธิ์"
 house_beneficiary_won_ghw_desc:0 "สมาชิกแห่งตระกูลนี้ได้สร้างชื่อเสียงในการต่อสู้กับศัตรูแห่งศรัทธาครั้งแล้วครั้งเล่า พิสูจน์ความกระตือรือร้นของพวกเขาอย่างไม่ต้องสงสัย"
 resurging_saoshyant:0 "เซาชยันต์ฟื้นคืนชีพ"
 resurging_saoshyant_desc:0 "ราชวงศ์นี้ให้กำเนิดเซาชยันต์ตามคำทำนาย ผู้กลับมานำโลกออกจากความมืด"

 wind_spirit_blessing:0 "พรจากวิญญาณลม"
 wind_spirit_blessing_desc:0 "มีข่าวลือว่าตัวละครนี้ได้รับพรจากเหล่าวิญญาณ"
 water_spirit_blessing:0 "พรจากวิญญาณน้ำ"
 water_spirit_blessing_desc:0 "$wind_spirit_blessing_desc$"
 rock_spirit_blessing:0 "พรจากวิญญาณหิน"
 rock_spirit_blessing_desc:0 "$wind_spirit_blessing_desc$"
 tree_spirit_blessing:0 "พรจากวิญญาณไม้"
 tree_spirit_blessing_desc:0 "$wind_spirit_blessing_desc$"
 bush_spirit_blessing:0 "พรจากวิญญาณพุ่มไม้"
 bush_spirit_blessing_desc:0 "$wind_spirit_blessing_desc$"

 bhakti_hinduism_ganga:0 "ผู้ภักดีต่อพระแม่คงคา"
 bhakti_hinduism_ganga_desc:0 "ภักติของตัวละครนี้มีต่อพระแม่คงคา เทพแห่งความบริสุทธิ์ การไถ่บาป และโมกษะ"
 bhakti_hinduism_saraswati:0 "ผู้ภักดีต่อพระสุรัสวดี"
 bhakti_hinduism_saraswati_desc:0 "ภักติของตัวละครนี้มีต่อพระสุรัสวดี เทพีแห่งการเรียนรู้ ดนตรี ศิลปะ และปัญญา"
 bhakti_hinduism_kali:0 "ผู้ภักดีต่อพระแม่กาลี"
 bhakti_hinduism_kali_desc:0 "ภักติของตัวละครนี้มีต่อพระแม่กาลี เทพีแห่งการทำลายล้างพลังชั่วร้าย"
 bhakti_hinduism_kubera:0 "ผู้ภักดีต่อท้าวกุเวร"
 bhakti_hinduism_kubera_desc:0 "ภักติของตัวละครนี้มีต่อท้าวกุเวร เทพผู้พิการแห่งความมั่งคั่ง ความยุติธรรม และทรัพย์สมบัติทางวัตถุ"
 bhakti_vaishnavism_lakishmi:0 "ผู้ภักดีต่อพระลักษมี"
 bhakti_vaishnavism_lakishmi_desc:0 "ภักติของตัวละครนี้มีต่อพระลักษมี เทพีแห่งความมั่งคั่ง โชคลาภ และความเจริญรุ่งเรือง"
 bhakti_vaishnavism_jagganath:0 "ผู้ภักดีต่อพระชคันนาถ"
 bhakti_vaishnavism_jagganath_desc:0 "ภักติของตัวละครนี้มีต่อพระชคันนาถ เจ้าแห่งจักรวาล"
 bhakti_vaishnavism_hayagriva:0 "ผู้ภักดีต่อพระหัยครีวะ"
 bhakti_vaishnavism_hayagriva_desc:0 "ภักติของตัวละครนี้มีต่อพระหัยครีวะ เทพเศียรม้าแห่งความรู้และปัญญา"
 bhakti_shaivism_parvati:0 "ผู้ภักดีต่อพระปารวตี"
 bhakti_shaivism_parvati_desc:0 "ภักติของตัวละครนี้มีต่อพระปารวตี เทพีแห่งความอุดมสมบูรณ์ ความรัก ความงาม การสมรส บุตร และความภักดี"
 bhakti_shaivism_virabhadra:0 "ผู้ภักดีต่อพระวีรภัทร"
 bhakti_shaivism_virabhadra_desc:0 "ภักติของตัวละครนี้มีต่อพระวีรภัทร ปางที่ดุร้ายและน่าเกรงขามอย่างยิ่งของพระศิวะ ผู้เป็นตัวแทนของความโกรธและความพิโรธอันชอบธรรม"
 bhakti_shaivism_munishwarar:0 "ผู้ภักดีต่อพระมุนีศวร"
 bhakti_shaivism_munishwarar_desc:0 "ภักติของตัวละครนี้มีต่อพระมุนีศวร ปางนักบุญของพระศิวะ ผู้เป็นตัวแทนของความรักในครอบครัว"
 bhakti_shaivism_dakshinamoorthy:0 "ผู้ภักดีต่อพระทักษิณามูรติ"
 bhakti_shaivism_dakshinamoorthy_desc:0 "ภักติของตัวละครนี้มีต่อพระทักษิณามูรติ เทพแห่งการเรียนรู้ในทุกรูปแบบ"
 bhakti_smartism_ganesha:0 "ผู้ภักดีต่อพระพิฆเนศ"
 bhakti_smartism_ganesha_desc:0 "ภักติของตัวละครนี้มีต่อพระพิฆเนศ เทพเศียรช้างแห่งความรู้ การเขียน ปัญญา และการเริ่มต้นใหม่"
 bhakti_smartism_vishnu:0 "ผู้ภักดีต่อพระวิษณุ"
 bhakti_smartism_vishnu_desc:0 "ภักติของตัวละครนี้มีต่อพระวิษณุ เทพผู้ดูแลและปกป้องการสร้างสรรค์"
 bhakti_smartism_shiva:0 "ผู้ภักดีต่อพระศิวะ"
 bhakti_smartism_shiva_desc:0 "ภักติของตัวละครนี้มีต่อพระศิวะ เทพผู้ตามล่าและทำลายความชั่วร้ายในทุกรูปแบบ"

 bhakti_germanic_generic_odin:0 "ผู้ภักดีต่อโอดิน"
 bhakti_germanic_generic_odin_desc:0 "เทพองค์โปรดของตัวละครนี้คือโอดิน เทพแห่งสงคราม เวทมนตร์ ความตาย และบทกวี"
 bhakti_germanic_not_danish_ullr:0 "ผู้ภักดีต่ออุลล์"
 bhakti_germanic_not_danish_ullr_desc:0 "เทพองค์โปรดของตัวละครนี้คืออุลล์ เทพแห่งสงครามและเกียรติยศ"
 bhakti_germanic_danish_tyr:0 "ผู้ภักดีต่อเทียร์"
 bhakti_germanic_danish_tyr_desc:0 "เทพองค์โปรดของตัวละครนี้คือเทียร์ เทพแห่งสงครามและความกล้าหาญ"
 bhakti_germanic_generic_thor:0 "ผู้ภักดีต่อธอร์"
 bhakti_germanic_generic_thor_desc:0 "เทพองค์โปรดของตัวละครนี้คือธอร์ เทพแห่งการปกป้อง พายุ มนุษยชาติ และความแข็งแกร่ง"
 bhakti_germanic_generic_freyr:0 "ผู้ภักดีต่อเฟรย์"
 bhakti_germanic_generic_freyr_desc:0 "เทพองค์โปรดของตัวละครนี้คือเฟรย์ เทพแห่งสันติภาพ การเก็บเกี่ยว และการปกครองที่เมตตา"

 meditating_in_seclusion_modifier:0 "กำลังทำสมาธิในที่สันโดษ"
 meditating_in_seclusion_modifier_desc:0 "ตัวละครนี้ได้เริ่มการเดินทางภายในและให้ความสนใจกับสิ่งของทางวัตถุน้อยลง"

 astrology_great_battle:0 "คาดการณ์การรบครั้งใหญ่"
 astrology_great_battle_desc:0 "ตัวละครนี้กำลังคาดการณ์และฝึกฝนสำหรับการรบครั้งใหญ่"
 astrology_new_friends:0 "กำลังสร้างมิตรใหม่"
 astrology_new_friends_desc:0 "ตัวละครนี้กำลังเยียวยาความขัดแย้งเก่าและสร้างมิตรใหม่"
 astrology_hard_work:0 "คนงานผู้ทุ่มเท"
 astrology_hard_work_desc:0 "ตัวละครนี้วางแผนที่จะพิสูจน์ว่าการทำงานหนักและความทุ่มเทนั้นคุ้มค่า"
 astrology_betrayal:0 "ระแวงผู้อื่น"
 astrology_betrayal_desc:0 "บางสิ่ง ทำให้ตัวละครนี้ระแวงและไม่ไว้วางใจผู้อื่น"
 astrology_new_beginnings:0 "เปิดใจกว้าง"
 astrology_new_beginnings_desc:0 "ตัวละครนี้กำลังพยายามอย่างแข็งขันที่จะเปิดใจให้กว้าง"

 feud_with_the_church_modifier:0 "ความขัดแย้งกับคริสตจักร"
 feud_with_the_church_modifier_desc:0 "ตัวละครนี้เป็นที่รู้จักว่ามีความขัดแย้งอย่างรุนแรงกับคริสตจักร และอาจทำบางสิ่งที่รุนแรง"

 sun_trial_suspicious_modifier:0 "การทดสอบสุริยะที่น่าสงสัย"
 sun_trial_suspicious_modifier_desc:0 "ตัวละครนี้เป็นที่รู้จักว่าได้ดำเนินการทดสอบสุริยะ ซึ่งจบลงในสถานการณ์ที่ค่อนข้างน่าสงสัย ทำให้เสื่อมเสียชื่อเสียง"
