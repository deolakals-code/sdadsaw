l_english: 
 fp2_smooth_market_oversight_modifier:0 "การกำกับดูแลตลาดที่ราบรื่น"
 fp2_smooth_market_oversight_modifier_desc:0 "ความระแวดระวังของมุห์ตาซิบในท้องถิ่นช่วยให้การทำธุรกรรมง่ายและน่าเชื่อถือ"
 fp2_inefficient_market_oversight_modifier:0 "การกำกับดูแลตลาดที่ไร้ประสิทธิภาพ"
 fp2_inefficient_market_oversight_modifier_desc:0 "มุห์ตาซิบในท้องถิ่นไม่สามารถแก้ไขปัญหาในตลาดได้ ทำให้เป็นภาระแก่กอฎี"
 fp2_free_market_boom_modifier:0 "ตลาดเสรีไร้ฮิสบะฮ์"
 fp2_free_market_boom_modifier_desc:0 "ตลาดในเมืองนี้ไม่ปฏิบัติตามฮิสบะฮ์และไม่อยู่ภายใต้การตรวจสอบของมุห์ตาซิบ"
 fp2_ruthless_market_oversight_modifier:0 "การกำกับดูแลตลาดที่โหดเหี้ยม"
 fp2_ruthless_market_oversight_modifier_desc:0 "มุห์ตาซิบในท้องถิ่นพึ่งพาทหารในการบังคับใช้กฎระเบียบแม้เพียงเล็กน้อยด้วยกำลัง"
 fp2_forsaken_turned_levies_modifier:0 "ลัทธิทหารที่เพิ่มขึ้น"
 fp2_forsaken_turned_levies_modifier_desc:0 "กองกำลังชาวนาขนาดเล็กกำลังก่อตัวขึ้นเพื่อล่ากลุ่มกบฏและเอาใจเจ้าเหนือหัวของตน"
 fp2_veteran_mercenaries_as_instructors_modifier:0 "ทหารรับจ้างผ่านศึกที่ได้รับการว่าจ้างเป็นผู้ฝึกสอน"
 fp2_veteran_mercenaries_as_instructors_modifier_desc:0 "เคาน์ตีนี้จ้างหัวหน้าทหารรับจ้างผู้ช่ำชองศึกเพื่อฝึกฝนไพร่พลในท้องถิ่น"
 fp2_mercenary_acquaintances_modifier:0 "คนรู้จักที่เป็นทหารรับจ้าง"
 fp2_mercenary_acquaintances_modifier_desc:0 "ตัวละครนี้เป็นคนรู้จักกับอดีตหัวหน้าทหารรับจ้างหลายคนและได้เรียนรู้มากมายจากการปฏิสัมพันธ์กับพวกเขา"
 fp2_mercs_slaughtered_populance_modifier:0 "ทหารรับจ้างสังหารหมู่ประชากร"
 fp2_mercs_slaughtered_populance_modifier_desc:0 "กองทหารติดอาวุธได้ทำลายล้างดินแดนนี้ ยึดทุกสิ่งจากคนท้องถิ่นและไม่เหลือใครไว้เล่าเรื่อง"
 fp2_local_garrison_slaughtered_modifier:0 "กองทหารรักษาการณ์ท้องถิ่นถูกกวาดล้าง"
 fp2_local_garrison_slaughtered_modifier_desc:0 "กองทหารรักษาการณ์ท้องถิ่นของเคาน์ตีนี้ถูกทำลายล้างจนเกือบหมดสิ้น ทำให้พื้นที่ไร้การป้องกัน"
 fp2_elite_tactics_for_civil_guards_modifier:0 "กองทหารรักษาการณ์ท้องถิ่นใช้กลยุทธ์ชั้นยอด"
 fp2_elite_tactics_for_civil_guards_modifier_desc:0 "กองทหารที่เป็นส่วนหนึ่งของกองทหารรักษาการณ์ท้องถิ่นนี้เป็นผู้รักษาสันติภาพผู้เชี่ยวชาญพร้อมประสบการณ์ที่จำเป็นในการปราบปรามผู้ละเมิดกฎหมายอย่างเหมาะสม"
 fp2_mercs_turned_farmers_modifier:0 "ทหารรับจ้างผันตัวเป็นชาวนา"
 fp2_mercs_turned_farmers_modifier_desc:0 "กองทหารรับจ้างอันตรายได้มายังดินแดนนี้เพื่อ...ทำฟาร์ม แม้ตอนนี้จะสงบสุข แต่พวกเขาก็อาจถูกเรียกเข้ารับใช้โดยเจ้าเหนือหัวคนใหม่หากจำเป็น"
 fp2_lenient_towards_foreign_merchants_modifier:0 "ผ่อนปรนต่อพ่อค้าต่างชาติ"
 fp2_lenient_towards_foreign_merchants_modifier_desc:0 "ตัวละครนี้เต็มใจที่จะละเว้นการไม่ยอมรับทางศาสนาเพื่อประโยชน์ทางการค้า ซึ่ง ทำให้ได้รับทั้งความมั่งคั่งมหาศาลและการดูถูกจากพวกพ้อง"
 fp2_2001_promise_reminder:0 "สัญญาว่าจะปลดปล่อย"
 fp2_2001_promise_reminder_desc:1 "ตัวละครนี้ได้เดิมพันเกียรติยศของตนในการปลดปล่อยหมู่บ้านที่ถูกกดขี่ภายในไม่กี่ปี"
 fp2_inexplicable_accounting_modifier:0 "การบัญชีที่อธิบายไม่ได้"
 fp2_inexplicable_accounting_modifier_desc:0 "การบัญชีของเคาน์ตีนี้ไม่ลงตัว ทองคำหายไป"
 fp2_improved_administrative_checks_modifier:0 "การตรวจสอบทางการบริหารที่ปรับปรุงแล้ว"
 fp2_improved_administrative_checks_modifier_desc:0 "เคาน์ตีนี้มีการตรวจสอบที่เข้มงวด เพื่อให้แน่ใจว่าแม้ แต่การฉ้อโกงทางเศรษฐกิจเพียงเล็กน้อยก็จะถูกตรวจพบโดยทางการ"
 fp2_mozarab_quarter_modifier:0 "ย่านโมซาราบ"
 fp2_mozarab_quarter_modifier_desc:0 "เมืองในเคาน์ตีนี้มีย่านที่แตกต่างกันสำหรับชาวโมซาราบ"
 fp2_mozarab_church_modifier:0 "ยอมรับชาวโมซาราบ"
 fp2_mozarab_church_modifier_desc:0 "ตัวละครนี้อนุญาตให้สร้างโบสถ์โมซาราบในดินแดนของตน"
 fp2_mozarab_rejected_modifier:0 "การเลือกปฏิบัติต่อชาวโมซาราบ"
 fp2_mozarab_rejected_modifier_desc:0 "ตัวละครนี้ไม่อนุญาตให้ชาวโมซาราบสร้างโบสถ์ในดินแดนของตน"
 fp2_multifaith_county_modifier:0 "การยอมรับความหลากหลายทางศาสนา"
 fp2_multifaith_county_modifier_desc:0 "ตัวละครนี้ได้แสดงความอนุญาตต่อผู้ที่นับถือศาสนาอื่นภายในอาณาจักรของตน"
 fp2_religious_strife_modifier:0 "ความขัดแย้งทางศาสนา"
 fp2_religious_strife_modifier_desc:0 "การบังคับเปลี่ยนศาสนาในเคาน์ตีนี้ ส่งผลให้เกิดความขัดแย้งทางศาสนาอย่างกว้างขวาง"
 fp2_camino_santiago_ho_protected_modifier:0 "การคุ้มครองโดยคณะนักรบศักดิ์สิทธิ์"
 fp2_camino_santiago_ho_protected_modifier_desc:0 "เส้นทางสู่ซานเตียโกที่ผ่านเคาน์ตีนี้ได้รับการคุ้มครองโดย [holy_order|E]"
 fp2_camino_santiago_protected_modifier:0 "ทหารยามรับจ้าง"
 fp2_camino_santiago_protected_modifier_desc:0 "เส้นทางสู่ซานเตียโกที่ผ่านเคาน์ตีนี้ได้รับการคุ้มครองโดยทหารยามรับจ้าง"
 fp2_horchata_colonialism_modifier:0 "การแสวงหาประโยชน์จากออร์ชาตา"
 fp2_horchata_colonialism_modifier_desc:0 "เคาน์ตีนี้ถูกบังคับให้ผลิตเพียงถั่วเสือเพื่อทำออร์ชาตา"
 fp2_funded_agriculture_modifier:0 "การเกษตรที่ได้รับทุนสนับสนุน"
 fp2_funded_agriculture_modifier_desc:0 "เคาน์ตีนี้ได้รับทรัพยากรที่จำเป็นในการขยายพื้นที่เกษตรกรรม"
 fp2_vow_against_conscription_modifier:0 "คำปฏิญาณต่อต้านการเกณฑ์ทหาร"
 fp2_vow_against_conscription_modifier_desc:0 "เคาน์ตีนี้ได้รับสิทธิ์ในการปฏิเสธคำร้องขอระดมพล ทำให้พวกเขาสามารถมุ่งเน้นไปที่เรื่องพลเรือนได้"
 fp2_monument_to_war_modifier:0 "อนุสาวรีย์แห่งการพิชิต"
 fp2_monument_to_war_modifier_desc:0 "อนุสาวรีย์ของผู้พิชิตอาณาจักรนี้ตั้งอยู่บนกองซากปรักหักพังที่ล้อมรอบด้วยอาคารที่ถูกเผาไหม้"
 fp2_village_rebuiling_efforts_modifier:0 "ความพยายามในการบูรณะหมู่บ้าน"
 fp2_village_rebuiling_efforts_modifier_desc:0 "เคาน์ตีนี้กำลังพยายามบูรณะหลังจากภัยพิบัติครั้งใหญ่ เจ้าเหนือหัวของพวกเขาได้บริจาคทรัพยากรที่จำเป็นเพื่อเร่งกระบวนการ"
 fp2_border_encampments_modifier:0 "ค่ายพักชานเมือง"
 fp2_border_encampments_modifier_desc:0 "เคาน์ตีนี้เต็มไปด้วยเต็นท์และด่านหน้า ซึ่งเป็นที่พักของกลุ่มลาดตระเวนขนาดเล็กเพื่อรักษาความปลอดภัยสิ่งของเล็กน้อยที่มีอยู่"
 fp2_scallop_shell_artifact:0 "เปลือกหอยเชลล์"
 fp2_scallop_shell_artifact_desc:0 "เปลือกหอยเชลล์นี้บ่งบอกว่าเจ้าของเป็นผู้ที่เดินทางอย่างยากลำบากตามเส้นทางกามิโนเดซานเตียโกจนสำเร็จ"
 fp2_fake_scallop_shell_artifact:0 "เปลือกหอยเชลล์ที่ไม่น่าเชื่อถือ"
 fp2_fake_scallop_shell_artifact_desc:0 "เปลือกหอยเชลล์ที่โดยปกติแล้วเป็นของผู้ที่เดินทางแสวงบุญไปยังซานเตียโกตลอดเส้นทาง อย่างไรก็ตาม เปลือกหอยนี้เห็นได้ชัดว่าถูกขโมยมา"
 fp2_malato_bark_artifact:0 "เปลือกต้นมาลาโต"
 fp2_malato_bark_artifact_desc:0 "เปลือกไม้ชิ้นเล็กๆ ที่นำมาจากต้นมาลาโตอันโด่งดังของชาวบาสก์"
 fp2_dismantling_verracos_modifier:0 "การรื้อถอนเวร์ราโกส"
 fp2_dismantling_verracos_modifier_desc:0 "รูปปั้นหมูป่าโบราณที่กระจัดกระจายอยู่ในเคาน์ตีนี้กำลังถูกรื้อถอนและเปลี่ยนเป็นวัสดุก่อสร้าง สร้างความตกตะลึงให้กับเจ้าหน้าที่ท้องถิ่น"
 fp2_saints_tombs_modifier:0 "สุสานนักบุญ"
 fp2_saints_tombs_modifier_desc:0 "รูปปั้นหมูป่าหินที่เกลื่อนกลาดในเคาน์ตีนี้เป็นที่รู้กันว่าเป็นสุสานของนักบุญคริสเตียน"
 fp2_controls_the_mediterranean_house_modifier:1 "เจ้าแห่งทะเลเมดิเตอร์เรเนียน"
 fp2_controls_the_mediterranean_house_modifier_desc:0 "ตระกูลนี้มีชื่อเสียงในการเข้าควบคุมทะเลเมดิเตอร์เรเนียนและการค้าที่ไหลผ่าน"
 fp2_aragon_title_reward_house_modifier:0 "ผู้ก่อตั้งอารากอน"
 fp2_aragon_title_reward_house_modifier_desc:0 "ตระกูลนี้ได้ก่อตั้งอาณาจักรอารากอนบนดินแดนที่มีภูมิประเทศทุรกันดารและนักรบที่แข็งแกร่งกว่า"
 fp2_sponsored_golden_age_modifier:0 "สนับสนุนยุคทอง"
 fp2_sponsored_golden_age_modifier_desc:0 "ตัวละครนี้ได้สนับสนุนยุคทองแห่งความก้าวหน้าทางวิชาการครั้งสำคัญครั้งต่อไปในภูมิภาค"
 fp2_part_of_golden_age_modifier:0 "อยู่ร่วมในยุคทอง"
 fp2_part_of_golden_age_modifier_desc:0 "ตัวละครนี้อยู่ร่วมเมื่อยุคทองแห่งความก้าวหน้าทางวิชาการเริ่มต้นขึ้น"
 fp2_epicenter_of_golden_age_modifier:0 "ศูนย์กลางแห่งยุคทอง"
 fp2_epicenter_of_golden_age_modifier_desc:0 "สถานที่นี้เป็นศูนย์กลางแห่งปัญญาที่ ซึ่งปราชญ์ผู้ยิ่งใหญ่ที่สุดแห่งยุคทองอาศัยและทำงาน"
 fp2_translated_skill_book_diplomacy_modifier:0 "บันทึกช่วยจำทางการทูตโบราณ"
 fp2_translated_skill_book_diplomacy_modifier_desc:0 "ตัวละครนี้ได้แปลสำเนาบันทึกช่วยจำโบราณที่ให้รายละเอียดเกี่ยวกับวิธีจัดการสถานการณ์ทางการทูตที่หลากหลาย"
 fp2_translated_skill_book_martial_modifier:0 "หนังสือประวัติศาสตร์การทหาร"
 fp2_translated_skill_book_martial_modifier_desc:0 "ตัวละครนี้ได้อ่านหนังสือประวัติศาสตร์การทหารหลายเล่ม เรียนรู้กลยุทธ์และยุทธวิธีต่างๆ ที่ผู้คนในสมัยโบราณใช้"
 fp2_translated_skill_book_stewardship_modifier:0 "หนังสือทฤษฎีเศรษฐศาสตร์"
 fp2_translated_skill_book_stewardship_modifier_desc:0 "ตัวละครนี้เป็นเจ้าของหนังสือหลากหลายเล่มที่ตั้งทฤษฎีว่าจักรวรรดิโบราณจัดการและจัดโครงสร้างตนเองอย่างไรเพื่อสนับสนุนเศรษฐกิจขนาดใหญ่"
 fp2_translated_skill_book_intrigue_modifier:0 "เรื่องราวแห่งเล่ห์กล"
 fp2_translated_skill_book_intrigue_modifier_desc:0 "ตัวละครนี้มีหนังสือเกี่ยวกับเล่ห์กลมากมายในครอบครอง ทำให้พวกเขามีความคิดสร้างสรรค์มากมายสำหรับแผนการ"
 fp2_translated_skill_book_learning_modifier:0 "งานปรัชญาที่แปลแล้ว"
 fp2_translated_skill_book_learning_modifier_desc:0 "ตัวละครนี้ได้มอบหมายให้แปลงานปรัชญาโบราณ ทำให้พวกเขาสามารถเพลิดเพลินกับความเข้าใจในระดับที่สูงขึ้น"
 fp2_rejection_of_old_thoughts_modifier:0 "การปฏิเสธแนวคิดเก่า"
 fp2_rejection_of_old_thoughts_modifier_desc:0 "เคาน์ตีนี้ดึงดูดนักคิดที่ปฏิเสธความจำเป็นในการเรียนรู้จากอดีต แนวคิดใหม่ๆ มากมายจะเฟื่องฟู แต่ไม่มีแนวคิดใดที่จะคงอยู่"
 fp2_removed_cataracts_modifier:0 "การผ่าตัดต้อกระจกที่ประสบความสำเร็จ"
 fp2_removed_cataracts_modifier_desc:0 "ตัวละครนี้ได้รับการผ่าตัดต้อกระจกสำเร็จ จากที่เกือบตาบอดกลายเป็นสามารถรับรู้ภาพเบลอของสีและรูปร่างได้"
 fp2_religious_riots_modifier:0 "การจลาจลทางศาสนาที่กำลังโหมกระหน่ำ"
 fp2_religious_riots_modifier_desc:0 "ความขัดแย้งทางศาสนากำลังฉีกทำลายถนนในชุมชนหลักของเคาน์ตีนี้"
 fp2_religious_riots_suppressed_modifier:0 "การจลาจลทางศาสนาถูกปราบปราม"
 fp2_religious_riots_suppressed_modifier_desc:0 "แม้ว่าจะยังคุกรุ่นอยู่ใต้พื้นผิว แต่ความขัดแย้งทางศาสนาในเคาน์ตีนี้ได้ถูกจำกัดอย่างโหดเหี้ยม"
 fp2_religious_riots_defused_modifier:0 "การจลาจลทางศาสนาถูกคลี่คลาย"
 fp2_religious_riots_defused_modifier_desc:0 "บางคนยังคงบ่นพึมพำ แต่การต่อสู้ทางศาสนาภายในเพิ่งถูกหลีกเลี่ยงในเคาน์ตีนี้"
 fp2_pilgrim_roads_modifier:0 "ถนนผู้แสวงบุญ"
 fp2_pilgrim_roads_modifier_desc:0 "เคาน์ตีนี้มีเครือข่ายถนนที่กว้างขวางเพื่อนำทางผู้แสวงบุญไปยังสถานที่ศักดิ์สิทธิ์"
 fp2_trusted_by_pilgrim_warriors_modifier:0 "มีชื่อเสียงในหมู่นักรบศักดิ์สิทธิ์"
 fp2_trusted_by_pilgrim_warriors_modifier_desc:0 "ตัวละครนี้เป็นที่รู้จักในด้านนิสัยที่ดีต่อนักรบแห่งศรัทธา ในทางกลับกัน พวกเขาก็ปฏิบัติต่อตัวละครนี้อย่างดีกว่า"
 fp2_kept_accused_traitor_in_court_modifier:0 "เสียงกระซิบแห่งความอ่อนแอ"
 fp2_kept_accused_traitor_in_court_modifier_desc:0 "การกระทำของตัวละครนี้ ทำให้เกิดข่าวลือที่ไม่เหมาะสมทุกประเภทแพร่กระจายเกี่ยวกับพวกเขา"
 fp2_kept_op_knight_in_court_modifier:0 "นักรบผู้หม่นหมอง"
 fp2_kept_op_knight_in_court_modifier_desc:0 "อัศวินภายใต้คำสั่งของตัวละครนี้มีขวัญกำลังใจต่ำ เนื่องจากเงาของนักรบที่เก่งกว่า"
 fp2_kept_upstart_knight_in_court_modifier:0 "อัศวินหน้าใหม่"
 fp2_kept_upstart_knight_in_court_modifier_desc:0 "สมาชิกของขุนนางสมคบคิดต่อต้านตัวละครนี้ เพื่อให้แน่ใจว่าจะไม่มีนักรบหน้าใหม่ปรากฏตัวในราชสำนักของพวกเขาอีก"
 fp2_kept_godless_mercenary_in_court_modifier:0 "ทหารรับจ้างไร้ศาสนา"
 fp2_kept_godless_mercenary_in_court_modifier_desc:0 "อิทธิพลภายนอก ทำให้อัศวินทุกคนที่ตัวละครนี้จ้างงานได้รับชื่อเสียงที่ไม่ดีในฐานะนักรบไร้ศาสนาที่ต่อสู้ด้วยความโลภ"
