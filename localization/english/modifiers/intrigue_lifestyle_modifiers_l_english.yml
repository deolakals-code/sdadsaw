 intrigue_risky_poison_experimentation_modifier:0 "การทดลองยาพิษอันเสี่ยงภัย"
 intrigue_risky_poison_experimentation_modifier_desc:0 "ตัวละครนี้กำลังทำการทดลองอันชั่วร้ายที่สุดเพื่อปรุงยาพิษชนิดใหม่ที่ร้ายแรง"

 intrigue_fond_memories_modifier:0 "ความทรงจำอันแสนสุข"
 intrigue_fond_memories_modifier_desc:0 "ตัวละครนี้มีความทรงจำอันแสนสุขเกี่ยวกับเหตุการณ์ล่าสุดบางอย่าง ซึ่ง ทำให้พวกเขารู้สึกผ่อนคลาย"
 intrigue_starved_and_deprived_modifier:0 "อดอยากและขาดแคลน"
 intrigue_starved_and_deprived_modifier_desc:0 "ตัวละครนี้ถูกปฏิเสธอาหาร น้ำ และการนอนหลับ ทำให้สูญเสียพลังงานไป"
 intrigue_suffered_degredation_modifier:0 "ได้รับความอัปยศอดสู"
 intrigue_suffered_degredation_modifier_desc:0 "ตัวละครนี้ต้องเผชิญกับประสบการณ์ที่ลดทอนความเป็นมนุษย์อย่างที่สุด ทำลายอัตตาของพวกเขา"
 intrigue_broken_modifier:0 "แหลกสลาย"
 intrigue_broken_modifier_desc:0 "ตัวละครนี้ได้รับบาดแผลทางใจอย่างรุนแรงจนยากที่จะรับมือกับความต้องการในชีวิตประจำวันได้"

 intrigue_court_spies_modifier:0 "สายลับในราชสำนัก"
 intrigue_court_spies_modifier_desc:0 "ตัวละครนี้ได้ส่งสายลับแทรกซึมเข้าไปในราชสำนักเพื่อรายงานแผนการหรือการวางแผนใดๆ"

 intrigue_hoarding_secrets_modifier:0 "กักตุนความลับ"
 intrigue_hoarding_secrets_modifier_desc:0 "ตัวละครนี้กำลังรวบรวมความลับเพื่อจุดประสงค์บางอย่างที่ไม่ทราบแน่ชัด..."

 intrigue_threatened_merchant_modifier:0 "พ่อค้าผู้ถูกคุกคาม"
 intrigue_theatre_troupe_modifier:0 "คณะนักแสดงต่างถิ่น"
 intrigue_theatre_troupe_modifier_desc:0 "คณะนักแสดงพเนจรที่แปลกประหลาดกำลังให้ความบันเทิงแก่ชาวบ้าน"
 intrigue_theatre_troupe_loss_modifier:0 "การแสดงอันน่าบันเทิง"

 intrigue_studying_people_modifier:0 "ศึกษาผู้คน"
 intrigue_studying_people_modifier_desc:0 "ตัวละครนี้กำลังมุ่งเน้นไปที่การทำความเข้าใจปฏิสัมพันธ์ทางสังคมอันละเอียดอ่อนให้ดียิ่งขึ้น"
 intrigue_flirtatious_modifier:0 "เจ้าชู้"
 intrigue_flirtatious_modifier_desc:0 "ตัวละครนี้กำลังขัดเกลาทักษะการยั่วยวนของตน"

 intrigue_understands_desires_modifier:0 "เข้าใจความปรารถนา"
 intrigue_understands_desires_modifier_desc:0 "ตัวละครนี้ได้รับความเข้าใจอย่างลึกซึ้งเกี่ยวกับพฤติกรรมและความปรารถนาของผู้คน"
 intrigue_understands_people_modifier:0 "เข้าใจผู้คน"
 intrigue_understands_people_modifier_desc:0 "ตัวละครนี้บรรลุความเข้าใจอย่างลึกซึ้งเกี่ยวกับความซับซ้อนอันละเอียดอ่อนของชีวิตในราชสำนัก"

 intrigue_picky_about_partners:0 "ช่างเลือกคู่ครอง"
 intrigue_picky_about_partners_desc:0 "ตัวละครนี้ขึ้นชื่อว่าช่างเลือกอย่างยิ่งเกี่ยวกับผู้ที่พวกเขาจะพิจารณามีความสัมพันธ์ด้วย"

 dark_insights_prowess_modifier:0 "ญาณทมิฬ: ความสามารถในการรบ"
 dark_insights_prowess_modifier_desc:0 "ผ่านเครื่องมือของนักทรมาน ตัวละครนี้ได้เรียนรู้มากมายเกี่ยวกับการสร้างความเจ็บปวดและการรีดเค้นความปรารถนาของผู้อื่น"
 dark_insights_intrigue_modifier:0 "ญาณทมิฬ: เล่ห์กล"
 dark_insights_intrigue_modifier_desc:0 "$dark_insights_prowess_modifier_desc$"

 intrigue_clandestine_informant_modifier:0 "ผู้ให้ข้อมูลนิรนาม"
 intrigue_clandestine_informant_modifier_desc:0 "ด้วยการใช้ข้อมูลที่ได้มาอย่างลับๆ ตัวละครนี้สามารถเจาะทะลุใจกลางกลยุทธ์การป้องกันของศัตรูได้"
 intrigue_fooled_by_enemy_modifier:0 "ถูกศัตรูหลอกลวง"
 intrigue_fooled_by_enemy_modifier_desc:0 "ตัวละครนี้พยายามที่จะชิงความได้เปรียบเหนือกลยุทธ์การป้องกันของศัตรู แต่สุดท้ายกลับถูกหลอกให้ซื้อข้อมูลปลอม"
