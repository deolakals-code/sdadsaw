l_english: 
 cat_story_modifier:0 "แมวเลี้ยง"
 cat_story_modifier_desc:0 "ตัวละครนี้เพลิดเพลินกับการมีสหายแมวเหมียว"
 dog_story_modifier:0 "สุนัขเลี้ยง"
 dog_story_modifier_desc:0 "สุนัขผู้ภักดีติดตามตัวละครนี้ไปทุกหนแห่ง"
 dog_story_walking_modifier:0 "พาสุนัขเดินเล่น"
 dog_story_walking_modifier_desc:0 "ตัวละครนี้เพลิดเพลินกับการพาสุนัขไปเดินเล่นบ่อยครั้ง"
 dog_story_fur_carpet_modifier:0 "พรมขนสัตว์"
 dog_story_fur_carpet_modifier_desc:0 "ตัวละครนี้มีพรมขนสัตว์ที่สวยงาม"
 cat_story_allergy_modifier:0 "อาการแพ้แมว"
 cat_story_allergy_modifier_desc:0 "ตัวละครนี้กำลังประสบกับอาการน่ารำคาญจากการมีแมวอยู่ใกล้"
 cat_killing_rodents_modifier:0 "ปราศจากหนู"
 cat_killing_rodents_modifier_desc:0 "ที่พำนักของตัวละครนี้แทบจะปราศจากหนูโดยสิ้นเชิง"
 cat_story_fur_mittens_modifier:0 "ถุงมือขนสัตว์"
 cat_story_fur_mittens_modifier_desc:0 "ตัวละครนี้มีถุงมือขนสัตว์หนึ่งคู่ เพื่อให้มืออบอุ่นเมื่ออากาศหนาว"
 rat_hunting_dog_modifier:0 "สุนัขนักล่าหนู"
 rat_hunting_dog_modifier_desc:0 "สุนัขของตัวละครนี้เป็นนักล่าหนูที่เก่งกาจ"
 rat_hunting_cat_modifier:0 "แมวนักล่าหนู"
 rat_hunting_cat_modifier_desc:0 "แมวของตัวละครนี้เป็นนักล่าหนูที่เก่งกาจ"
 cat_dopey_modifier:0 "แมวเซ่อซ่า"
 cat_dopey_modifier_desc:0 "แมวของตัวละครนี้ เอ่อ... ค่อนข้างซุ่มซ่ามเล็กน้อย"
 cat_wrangler_modifier:0 "ผู้ชำนาญการจับแมว"
 cat_wrangler_modifier_desc:0 "ตัวละครนี้ได้พิสูจน์ตนเองว่าเป็นผู้เชี่ยวชาญในศิลปะอันยุ่งยากของการจัดการแมว"
 cat_coitus_interrupted_modifier:0 "ผู้ขัดจังหวะแมวเหมียว"
 cat_coitus_interrupted_modifier_desc:0 "การพบปะเชิงชู้สาวของตัวละครนี้ถูกขัดจังหวะโดยการปรากฏตัวของแมวที่เป็นมิตรเกินไป"
 cat_rejection_modifier:0 "การปฏิเสธจากแมว"
 cat_rejection_modifier_desc:0 "ตัวละครนี้ได้ค้นพบด้วยความขุ่นเคืองใจว่าแมวของตนค่อนข้างชอบอยู่กับผู้อื่นมากกว่า"
 cat_ill_modifier:0 "พยาบาลแมวเหมียว"
 cat_ill_modifier_desc:0 "ตัวละครนี้มีแมวที่เป็นมิตรคอยอยู่เป็นเพื่อนระหว่างพักฟื้น"
 cat_lover_modifier:0 "คนรักแมว"
 cat_lover_modifier_desc:0 "ตัวละครนี้อุทิศตนให้กับสหายขนปุยของตนอย่างยิ่งยวด จนถึงขั้นสร้างความรำคาญเล็กน้อยให้กับสภาของตน"
 eagle_story_modifier: "อินทรีนักล่า"
 eagle_story_modifier_desc: "ตัวละครนี้มีนกอินทรีอันสง่างามเป็นสหายสำหรับการล่าสัตว์และผจญภัยในทุ่งหญ้าสเตปป์\n$hunt_type_falconry$ [hunt_success_chance|E]: #P +10%#!"
 brave_eagle_story_modifier: "อินทรีผู้กล้าหาญ"
 brave_eagle_story_modifier_desc: "อินทรีนักล่าของตัวละครนี้กล้าหาญเป็นพิเศษและจะไม่หลีกหนีจากอันตรายใดๆ ที่สงสัย\n$hunt_type_falconry$ [hunt_success_chance|E]: #P +10%#!."
 curious_eagle_story_modifier: "อินทรีผู้ใฝ่รู้"
 curious_eagle_story_modifier_desc: "อินทรีนักล่าของตัวละครนี้อยากรู้อยากเห็นราวกับเด็ก และมักจะสำรวจสิ่งที่ดึงดูดสายตาของมัน\n$hunt_type_falconry$ [hunt_success_chance|E]: #P +10%#!"
 loyal_eagle_story_modifier: "อินทรีผู้ภักดี"
 loyal_eagle_story_modifier_desc: "อินทรีนักล่าของตัวละครนี้ภักดีอย่างยิ่งยวดและจะไม่ละทิ้งข้างกายเจ้าของเลย\n$hunt_type_falconry$ [hunt_success_chance|E]: #P +10%#!"
 calm_eagle_story_modifier: "อินทรีผู้สุขุม"
 calm_eagle_story_modifier_desc: "อินทรีนักล่าของตัวละครนี้สุขุมและเยือกเย็น ไม่เคยตื่นเต้นหรือหวาดกลัวจนเกินไป\n$hunt_type_falconry$ [hunt_success_chance|E]: #P +10%#!"
 wise_eagle_story_modifier: "อินทรีผู้เปี่ยมปัญญา"
 wise_eagle_story_modifier_desc: "อินทรีนักล่าของตัวละครนี้มีปัญญาเกินวัย และมักจะตัดสินใจในสิ่งที่ ทำให้เจ้าของประหลาดใจ\n$hunt_type_falconry$ [hunt_success_chance|E]: #P +10%#!"
 cunning_eagle_story_modifier: "อินทรีเจ้าเล่ห์"
 cunning_eagle_story_modifier_desc: "อินทรีนักล่าของตัวละครนี้มีเล่ห์เหลี่ยมแพรวพราวและมักจะชิงไหวชิงพริบเหนือกว่าเหยื่อของมัน\n$hunt_type_falconry$ [hunt_success_chance|E]: #P +10%#!."
 weak_eagle_modifier: "อินทรีอ่อนแอ"
 weak_eagle_modifier_desc: "อินทรีนักล่าของตัวละครนี้อ่อนแอและมักจะประสบปัญหาในการจับเหยื่อ"
 very_weak_eagle_modifier: "อินทรีผู้เปราะบาง"
 very_weak_eagle_modifier_desc: "อินทรีนักล่าของตัวละครนี้กำลังป่วยหนัก และใกล้จะสิ้นใจเต็มที"
 strong_eagle_modifier: "อินทรีผู้แข็งแรงสมบูรณ์"
 strong_eagle_modifier_desc: "อินทรีนักล่าของตัวละครนี้มีสุขภาพและความแข็งแรงเป็นเลิศ"
 skilled_eagle_modifier: "พรานอินทรีผู้ชำนาญ"
 skilled_eagle_modifier_desc: "ตัวละครนี้เป็นนักเหยี่ยวผู้ชำนาญ และอินทรีนักล่าของพวกเขาก็ได้รับการฝึกฝนมาเป็นอย่างดีเป็นพิเศษ"
 eagle_personality_level_desc: "ยังไม่ได้รับการฝึกฝน"
 observant_eagle_story_modifier: "อินทรีผู้ช่างสังเกต"
 observant_eagle_story_modifier_desc: "อินทรีนักล่าของตัวละครนี้มีสายตาแหลมคมเป็นพิเศษ และมักจะมองเห็นในสิ่งที่เจ้าของอาจมองข้ามไป"
 protective_eagle_story_modifier: "อินทรีผู้ปกป้อง"
 protective_eagle_story_modifier_desc: "อินทรีนักล่าของตัวละครนี้คอยปกป้องเจ้าของ และมักจะเข้าขัดขวางเพื่อมิให้เจ้าของได้รับอันตราย"
 aggressive_eagle_story_modifier: "อินทรีผู้ดุดัน"
 aggressive_eagle_story_modifier_desc: "อินทรีนักล่าของตัวละครนี้พร้อมต่อสู้เป็นพิเศษ และมักจะโจมตีสิ่งที่มันมองว่าเป็นภัยคุกคามโดยไม่มีการเตือนล่วงหน้า"
 eagle_hunter_childhood_modifier: "นักเหยี่ยวผู้ถูกลิขิต"
 eagle_hunter_childhood_modifier_desc: "ตัวละครนี้ฝึกฝนกับนกอินทรีมาตั้งแต่เยาว์วัย และมีแววที่จะเป็นนักเหยี่ยวผู้ชำนาญได้\n[hunt_success_chance|E]: #P +5%#!"
 hunt_success_chance.eagle_hunter_childhood_modifier: "[GetModifier('eagle_hunter_childhood_modifier').GetNameWithTooltip]"
