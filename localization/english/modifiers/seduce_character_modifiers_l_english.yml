l_english: 
 seduce_tapestry_gift_modifier:0 "พรมแขวนผนังราชวงศ์"
 seduce_tapestry_gift_modifier_desc:0 "พรมแขวนผนังที่บันทึกชัยชนะอันยิ่งใหญ่และช่วงเวลาสำคัญของราชวงศ์"
 seduce_horse_gift_modifier:0 "ม้าพันธุ์ดี"
 seduce_horse_gift_modifier_desc:0 "ม้าที่มีลักษณะดีเลิศ"
 seduce_tailor_gift_modifier:0 "เสื้อผ้าตัดเย็บอย่างสมบูรณ์แบบ"
 seduce_tailor_gift_modifier_desc:0 "ตัดเย็บ เพื่อให้ผู้สวมใส่ดูสง่างามน่าเกรงขาม"
 seduce_rare_book_gift_modifier:0 "หนังสือหายาก"
 seduce_rare_book_gift_modifier_desc:0 "หน้ากระดาษไม่กี่หน้าที่พออ่านออกได้ บ่งบอกถึงการรวบรวมภูมิปัญญาอันยิ่งใหญ่"
 seduce_embroidery_gift_modifier:0 "งานปักราชวงศ์"
 seduce_embroidery_gift_modifier_desc:0 "งานปักตราประจำตระกูลอย่างละเอียด"
 seduce_poem_gift_modifier:0 "บทกวีอุทิศ"
 seduce_poem_gift_modifier_desc:0 "บทกวีเกี่ยวกับความสุขทั้งปวงในชีวิต อุทิศให้โดยระบุชื่อ"
 seduce_woodcarving_gift_modifier:0 "งานแกะสลักไม้รูปปราสาท"
 seduce_woodcarving_gift_modifier_desc:0 "ซับซ้อนและละเอียดลออ ทำให้จินตนาการถึงทหารตัวจิ๋วกำลังลาดตระเวนบนกำแพงและคนรับใช้กำลังวิ่งข้ามลานไม้โอ๊ก"
 seduce_object_gift_modifier:0 "ของที่ระลึก"
 seduce_object_gift_modifier_desc:0 "วัตถุที่มีความสำคัญส่วนตัวอย่างลึกซึ้ง อาจเป็นสัญลักษณ์ของความสัมพันธ์ที่เคยมีอยู่ หรือเปลวไฟที่ยังคงลุกโชน"
 seduce_jewelry_gift_modifier:0 "ล็อกเกตเงิน"
 seduce_jewelry_gift_modifier_desc:0 "เครื่องประดับที่ดูเรียบง่าย แต่แน่นอนว่าจะดึงดูดสายตาที่เผลอมองมา"
 seduce_stuffed_animal_gift_modifier:0 "สุนัขจิ้งจอกสตัฟฟ์"
 seduce_stuffed_animal_gift_modifier_desc:0 "สัตว์ที่ถูก \"ชุบชีวิต\" อย่างเชี่ยวชาญ เหมาะสำหรับวางบนหิ้งเหนือเตาผิง"
 seduce_flower_display_gift_modifier:0 "การจัดแสดงดอกไม้"
 seduce_flower_display_gift_modifier_desc:0 "เครื่องประดับสวนที่สร้างความประทับใจให้แขกได้อย่างแน่นอน ตราบใดที่ได้รับการดูแลอย่างดี"
 seduce_handkerchief_gift_modifier:0 "ผ้าเช็ดหน้าเนื้อดี"
 seduce_handkerchief_gift_modifier_desc:0 "ผ้าชิ้นเล็กๆ ที่มีตราของตระกูลขุนนางอื่น"
 seduce_warfare_military_ideas_modifier:0 "แนวคิดอันน่าหลงใหล"
 seduce_warfare_military_ideas_modifier_desc:0 "แนวคิดเกี่ยวกับการปฏิรูปกองทัพเหล่านี้น่าสนใจอย่างยิ่ง และมาจากแหล่งที่ไม่คาดคิด..."
 seduce_intrigue_knowing_knowledge_modifier:0 "ข้ารู้ว่าพวกเขารู้"
 seduce_intrigue_knowing_knowledge_modifier_desc:1 "อา เครือข่ายอันซับซ้อน วิธีที่สายลับสอดแนม ซึ่งกันและกัน โดยรู้ว่าพวกเขาทั้งหมดทิ้งร่องรอยปลอมไว้ เหมือนกับการเต้นรำอันเย้ายวน..."
 seduce_diplomatic_practice_modifier:0 "การฝึกฝนทางการทูต"
 seduce_diplomatic_practice_modifier_desc:1 "เผชิญหน้ากัน ตัวละครนี้กำลังฝึกฝนการพูดสิ่งที่ตนต้องการโดยไม่เคยพูดสิ่งที่ตนหมายถึงจริงๆ"
 seduce_rested_modifier:0 "พักผ่อนเต็มที่"
 seduce_rested_modifier_desc:0 "การพักผ่อนอย่างเต็มที่เป็นเวลาหลายชั่วโมงส่งผลดี!"
 seduce_obviously_courted_modifier:0 "ถูกเกี้ยวพาราสีอย่างไม่ต้องสงสัย"
 seduce_obviously_courted_modifier_desc:0 "ทั่วทั้งราชสำนักต่างรู้กันถ้วนหน้าว่าใครบางคนกำลังอยู่บนเส้นทางแห่งความรัก"
 seduce_figting_modifier:0 "เก่งกาจในการต่อสู้"
 seduce_figting_modifier_desc:1 "ข้อนิ้วถลอกและริมฝีปากแตก ไม่มีสิ่งใด ทำให้ตัวละครนี้ช้าลงได้!"

 seduce_bold_start_modifier:0 "กล้าหาญขึ้นจากความพยายามยั่วยวน"
 seduce_bold_start_modifier_desc:0 "รู้สึกกล้าหาญหลังจากรุกคืบอย่างกล้าหาญระหว่างการพบปะเชิงโรแมนติก"
 seduce_gentle_start_modifier:0 "อ่อนโยนลงจากความพยายามยั่วยวน"
 seduce_gentle_start_modifier_desc:0 "อ่อนโยนลงทั้งหมดหลังจากเข้าหาอย่างนุ่มนวล"
