l_english: 

 bp2_stranger_at_home_modifier: "คนแปลกหน้าในบ้านเกิด"
 bp2_stranger_at_home_modifier_desc: "หลังจากตกเป็นตัวประกัน ตัวละครนี้ได้ยอมรับความห่างเหินจากบ้านเกิดเมืองนอนของตน"
 bp2_stranger_no_more_modifier: "กำลังปรับตัวกลับคืน"
 bp2_stranger_no_more_modifier_desc: "หลังจากตกเป็นตัวประกัน ตัวละครนี้กำลังพยายามปรับตัวให้คุ้นเคยกับบ้านเกิดเมืองนอนของตนอีกครั้ง"
 bp2_uni_bad_encounters_modifier: "การเผชิญหน้าที่ไม่ดี"
 bp2_uni_bad_encounters_modifier_desc: "ระหว่างการศึกษาในวัยผู้ใหญ่ ตัวละครนี้ประสบปัญหาบางอย่างจากการคบค้าสมาคมกับคนผิด"
 bp2_dialogue_with_the_masters_modifier: "สนทนากับปรมาจารย์"
 bp2_dialogue_with_the_masters_modifier_desc: "ระหว่างการศึกษาในมหาวิทยาลัย ตัวละครนี้สามารถสนทนาต่อหน้ากับเหล่าปรมาจารย์ด้วยภาษาพิธีกรรมของพวกเขาได้"
 foolish_endeavor_modifier: "ทำให้ตนเองเป็นตัวตลก"
 foolish_endeavor_modifier_desc: "ความพยายามอันโง่เขลาของตัวละครนี้ที่จะสนทนาอย่างเท่าเทียมกับอาจารย์ในมหาวิทยาลัยได้ล้มเหลวอย่างน่าสังเวช"
 bp2_uni_connections_modifier: "เครือข่ายมหาวิทยาลัย"
 bp2_uni_connections_modifier_desc: "ระหว่างการศึกษาในมหาวิทยาลัย ตัวละครนี้ได้ผสมผสานเข้ากับชุมชนนักศึกษาท้องถิ่นเป็นอย่างดี"
 bp2_uni_isolation_modifier: "ความโดดเดี่ยวในการศึกษา"
 bp2_uni_isolation_modifier_desc: "ระหว่างการศึกษาในมหาวิทยาลัย ตัวละครนี้ล้มเหลวในการสร้างความสัมพันธ์กับเพื่อนร่วมรุ่น"
 bp2_understanding_modifier: "ความเข้าอกเข้าใจ"
 bp2_understanding_modifier_desc: "ตัวละครนี้มีสัญชาตญาณในการรับรู้เมื่อผู้อื่นไม่ได้กระตือรือร้นในบางสิ่งเท่ากับตน"
 bp2_careful_modifier: "ระวังข้าวของ"
 bp2_careful_modifier_desc: "หลังจากเหตุการณ์ร้ายที่เกี่ยวข้องกับฟุตบอลในวัยเยาว์ ตัวละครนี้จึงระมัดระวังข้าวของของตนเป็นอย่างมาก"
 bp2_cowardly_modifier: "ขี้ขลาด"
 bp2_cowardly_modifier_desc: "ไม่ว่าอุปนิสัยปัจจุบันจะเป็น เช่นไร ตัวละครนี้แบกรับมลทินของการทอดทิ้งเด็กคนอื่นให้ถูกรังแกในวัยเยาว์"
 bp2_disrespects_elderly_modifier: "ไม่เคารพผู้อาวุโส"
 bp2_disrespects_elderly_modifier_desc: "ตั้งแต่วัยเยาว์ ตัวละครนี้แสดงความดูแคลนอย่างเห็นได้ชัดต่อผู้ที่อาวุโสกว่าและ—คาดว่า—ฉลาดกว่า ซึ่งอย่างน้อยก็ ทำให้เป็นที่รักของคนหนุ่มสาว"
 bp2_guilt_ridden_modifier: "รู้สึกผิด"
 bp2_guilt_ridden_modifier_desc: "ตัวละครนี้บอบช้ำทางจิตใจจากการไม่ลงมือทำสิ่งใดระหว่างเกมฟุตบอล เพียงแค่เฝ้ามองเด็กคนอื่นถูกฝูงชนเหยียบย่ำ"
 bp2_ringing_ears_modifier: "หูอื้อ"
 bp2_ringing_ears_modifier_desc: "หูของตัวละครนี้ยังคงอื้อหลังจากผู้ปกครองที่กระตือรือร้นเกินเหตุได้ตะคอกใส่กลุ่มคนระหว่างเกมฟุตบอล"
 bp2_self_preserving_modifier: "รักษาตัวรอด"
 bp2_self_preserving_modifier_desc: "สัญชาตญาณการรักษาตัวรอดของตัวละครนี้เคยเป็นประโยชน์ต่อพวกเขาในอดีต"

 imaginary_friend_modifier: "เพื่อนในจินตนาการ"
 imaginary_friend_modifier_desc: "ตัวละครนี้มีเพื่อนในจินตนาการ"

 imaginary_friend_murder_scheme_modifier: "$imaginary_friend_modifier$"
 imaginary_friend_murder_scheme_modifier_desc: "ตัวละครนี้มั่นใจในความสำเร็จของตนในแผนการนี้หลังจากได้รับอิทธิพลจากเพื่อนในจินตนาการ"

 imaginary_friend_mad_modifier: "เสียสติอย่างรุนแรง"
 imaginary_friend_mad_modifier_desc: "ตัวละครนี้มีความคันคะเยอเป็นพิเศษ... และวิธีเดียวที่จะเกาได้คือ #EMP การฆาตกรรม#!"

 bp2_stifled_potential_modifier: "ศักยภาพที่ถูกกดขี่"
 bp2_stifled_potential_modifier_desc: "ตัวละครนี้มีศักยภาพที่ยังไม่ได้ใช้ประโยชน์อยู่มหาศาล ถูกขัดขวางไม่ให้เข้าถึงได้ด้วยกลอุบายของผู้อื่น"
 bp2_destined_modifier: "ถูกลิขิตสู่ความรุ่งโรจน์"
 bp2_destined_modifier_desc: "ตัวละครนี้มีบางสิ่งที่พิเศษเกี่ยวกับตน ซึ่ง ทำให้หลายคนเชื่อว่าพวกเขาถูกลิขิตมาเพื่อความยิ่งใหญ่"
 bp2_destiny_tutor_modifier: "คำแนะนำทางการทหาร"
 bp2_destiny_tutor_modifier_desc: "ตัวละครนี้ได้รับคำแนะนำเชิงกลยุทธ์ที่ดี ซึ่งพวกเขาจะจดจำไปอีกนาน"
 bp2_tool_of_fate_modifier: "เครื่องมือแห่งโชคชะตา"
 bp2_tool_of_fate_modifier_desc: "แรงดึงดูดตามธรรมชาติของตัวละครนี้ ทำให้พวกเขาโดดเด่นตั้งแต่วัยเยาว์ และพรสวรรค์ที่ได้รับการบ่มเพาะ ทำให้พวกเขาแตกต่างจากเพื่อนร่วมรุ่น"

 rock_story_modifier: "หินสัตว์เลี้ยง"
 rock_story_modifier_desc: "ตัวละครนี้เพลิดเพลินกับการอยู่ร่วมกับสหายหิน"
 sated_stone_modifier: "หินอิ่มหนำ"
 sated_stone_modifier_desc: "ตัวละครนี้รู้สึกดีขึ้นที่ได้ตามใจหินสัตว์เลี้ยงของตน"
 rock_dopey_modifier: "หินเซ่อซ่า"
 rock_dopey_modifier_desc: "หินสัตว์เลี้ยงของตัวละครนี้ เอ่อ ซุ่มซ่ามเล็กน้อย"
 lost_rock_modifier: "หินหาย"
 lost_rock_modifier_desc: "หินสัตว์เลี้ยงของตัวละครนี้ถูกวางผิดที่ และหายไปตลอดกาลในเวลาต่อมา พวกเขายังทำใจไม่ได้"
 bp2_bed_rock_modifier: "หินบนเตียง"
 bp2_bed_rock_modifier_desc: "ตัวละครนี้รักหินสัตว์เลี้ยงของตนมากจนยอมให้มันงีบหลับอย่างสบายบนเตียง สร้างความรำคาญให้แก่คู่นอนเป็นอย่างยิ่ง"
 bp2_sore_thumb_modifier: "นิ้วโป้งเจ็บ"
 bp2_sore_thumb_modifier_desc: "ความพยายามทำงานฝีมือของตัวละครนี้ ทำให้พวกเขาบาดเจ็บเล็กน้อย"
 bp2_valued_friendship_modifier: "ความสัมพันธ์ดั่งหินผา"
 bp2_valued_friendship_modifier_desc: "ตัวละครนี้ปฏิเสธโอกาสที่จะประดิษฐานหินสัตว์เลี้ยงไว้ในบ้าน แต่กลับพกพามันติดตัวไปทุกหนทุกแห่ง"
 bp2_solid_foundations_modifier: "รากฐานที่มั่นคง"
 bp2_solid_foundations_modifier_desc: "ตัวละครนี้ให้ความสำคัญกับความสมบูรณ์ของโครงสร้างมากเสียจนถึงกับประดิษฐานหินสัตว์เลี้ยงไว้ในผนังบ้านของตน"

 bp2_one_upper_modifier: "ผู้ชอบข่ม"
 bp2_one_upper_modifier_desc: "ตัวละครนี้เป็นที่รู้จักในเรื่องนิสัยชอบข่มผู้อื่นอันน่าเบื่อหน่ายในการสนทนาทั่วไป"
 bp2_trusted_parent_modifier: "บิดามารดาที่ไว้ใจได้"
 bp2_trusted_parent_modifier_desc: "บิดามารดาของตัวละครนี้ได้รับความไว้วางใจจากพวกเขา และพวกเขาจะจดจำสิ่งนี้ไปอีกหลายปี"
 bp2_tight_knit_modifier: "ผูกพันแน่นแฟ้น"
 bp2_tight_knit_modifier_desc: "ตัวละครนี้จดจำวัยเยาว์ในอ้อมอกอันปลอดภัยและอบอุ่นของครอบครัว และยังคงรักษาความสัมพันธ์อันใกล้ชิดกับพวกเขามาจนถึงทุกวันนี้"
 bp2_listened_elders_modifier: "คำแนะนำจากผู้อาวุโส"
 bp2_listened_elders_modifier_desc: "ตัวละครนี้แสวงหาคำแนะนำจากผู้อาวุโส รับฟังปัญญาอันลึกซึ้งของพวกเขาเพื่อรวบรวมข้อมูลเชิงลึกอันมีค่า"
 bp2_foreign_influences_modifier: "อิทธิพลต่างแดน"
 bp2_foreign_influences_modifier_desc: "ความสนใจในวัฒนธรรมอื่นของตัวละครนี้ ทำให้คนใกล้ชิดเกิดความสงสัย"
 bp2_parental_heartbreak_modifier: "ความเสียใจจากบิดามารดา"
 bp2_parental_heartbreak_modifier_desc: "ตัวละครนี้ยังคงรับมือกับบาดแผลทางอารมณ์ที่เกิดจากบิดามารดา"
 bp2_culturally_adventurous_modifier: "ชอบผจญภัยทางวัฒนธรรม"
 bp2_culturally_adventurous_modifier_desc: "ความเต็มใจของตัวละครนี้ที่จะยอมรับสิ่งที่ไม่คุ้นเคย ทำให้พวกเขามีปัญญาและเป็นที่ยอมรับอย่างกว้างขวางมากขึ้น"
 bp2_expanded_horizons_modifier: "เปิดโลกทัศน์"
 bp2_expanded_horizons_modifier_desc: "โลกทัศน์ของตัวละครนี้กว้างขึ้นตั้งแต่วัยเยาว์ เนื่องจากการคบค้าสมาคมกับผู้คนจากวัฒนธรรมอื่น"

 parent_helped_grief_modifier: "ช่วยเรื่องความโศกเศร้า"
 parent_helped_grief_modifier_desc: "บิดามารดาของตัวละครนี้ช่วยให้พวกเขารับมือกับความโศกเศร้าต่อแม่นมอันเป็นที่รัก"
 wet_nurse_bonding_modifier: "ผูกพันกับแม่นม"
 wet_nurse_bonding_modifier_desc: "ตัวละครนี้ผูกพันกับแม่นมผ่านศรัทธาและวัฒนธรรมร่วมกัน"
 wet_nurse_faith_bonding_modifier: "$wet_nurse_bonding_modifier$"
 wet_nurse_faith_bonding_modifier_desc: "ตัวละครนี้ผูกพันกับแม่นมผ่านศรัทธาร่วมกัน"
 wet_nurse_cultural_bonding_modifier: "$wet_nurse_bonding_modifier$"
 wet_nurse_cultural_bonding_modifier_desc: "ตัวละครนี้ผูกพันกับแม่นมผ่านวัฒนธรรมร่วมกัน"
 bp2_good_parent_modifier: "บิดามารดาผู้เห็นอกเห็นใจ"
 bp2_good_parent_modifier_desc: "ตัวละครนี้เห็นอกเห็นใจและสนใจในความรู้สึกและการกระทำของบุตรหลาน"
 under_childs_boot_modifier: "อยู่ใต้อาณัติบุตร"
 under_childs_boot_modifier_desc: "ตัวละครนี้กระทำการตามอำเภอใจและความปรารถนาของบุตรหลาน"

 bp2_strong_willed_modifier: "ใจแข็ง"
 bp2_strong_willed_modifier_desc: "ความดื้อรั้นและความหยิ่งทะนงในวัยเด็กของตัวละครนี้ ทำให้พวกเขามีปัญหากับผู้อาวุโสอย่างมาก แต่ก็ได้รับการชื่นชมอย่างมากจากเพื่อนรุ่นเยาว์"

 bp2_sweet_treat_modifier: "ของหวานแสนอร่อย"
 bp2_sweet_treat_modifier_desc: "ตัวละครนี้สามารถฉกของหวานแสนอร่อยจากห้องครัวได้ ของโปรดของพวกเขา!"

 bp2_empathetic_modifier: "เห็นอกเห็นใจ"
 bp2_empathetic_modifier_desc: "ตัวละครนี้ได้แสดงความฉลาดทางอารมณ์ที่หลากหลายในการปฏิสัมพันธ์กับผู้อื่น"

 bp2_joust_prodigy_modifier: "อัจฉริยะการประลองทวน"
 bp2_joust_prodigy_modifier_desc: "ตัวละครนี้ได้แสดงพรสวรรค์ตามธรรมชาติในการประลองทวนตั้งแต่วัยเยาว์"

 bp2_afterlife_citer_modifier: "ผู้เชื่อในชีวิตหลังความตาย"
 bp2_afterlife_citer_modifier_desc: "ความเชื่อมั่นอย่างเปิดเผยของตัวละครนี้ในการมีอยู่ของชีวิตหลังความตาย ทำให้พวกเขาดูเป็นคนสบายๆ เป็นพิเศษ"

 bp2_numbed_to_death_modifier: "ชาชินต่อความตาย"
 bp2_numbed_to_death_modifier_desc: "ประสบการณ์เกี่ยวกับความตายในวัยเยาว์ของตัวละครนี้ ทำให้พวกเขามีท่าทีเคร่งขรึมเมื่อเผชิญกับเรื่องดังกล่าว"

 shaven_bald_modifier: "ถูกโกนอย่างโหดเหี้ยม"
 shaven_bald_modifier_desc: "ผมของตัวละครนี้ถูกโกนออกจนหมดระหว่างพิธีเปลี่ยนผ่าน เหลือเพียงหนังศีรษะที่ถลอก"

 scorched_soles_modifier: "ฝ่าเท้าไหม้เกรียม"
 scorched_soles_modifier_desc: "หลังจากการเดินลุยไฟในพิธีอันอุตสาหะ ตัวละครนี้ก้าวเดินอย่างระมัดระวังบนฝ่าเท้าที่ไหม้เกรียมอย่างน่าสยดสยอง"

 tough_and_confident_modifier: "ชนเผ่าผู้ทรหดและมั่นใจ"
 tough_and_confident_modifier_desc: "จากการดิ้นรนผ่านพิธีเปลี่ยนผ่าน ตัวละครนี้ได้เรียนรู้ความมุ่งมั่น ความเด็ดเดี่ยว และการพึ่งพาตนเอง"

 peace_over_honor_modifier: "สันติภาพเหนือเกียรติยศ"
 peace_over_honor_modifier_desc: "เมื่อราชสำนักที่รับญาติเป็นตัวประกันตกอยู่ภายใต้ภัยคุกคาม ตัวละครนี้ปฏิเสธที่จะให้ความช่วยเหลือ"

 a_noble_fight_modifier: "การต่อสู้อันสูงส่ง"
 a_noble_fight_modifier_desc: "โดยการตอบรับคำร้องขอของตัวประกันที่ตกที่นั่งลำบาก ตัวละครนี้ได้ผูกมัดตนเองกับการผจญภัยทางการทหาร"

aggressive_unpredictable_modifier: "ก้าวร้าว, คาดเดาไม่ได้"
aggressive_unpredictable_modifier_desc: "นักก่อสงครามผู้นี้เป็นที่รู้จักในการเปลี่ยนจากการสงบศึกไปสู่การโจมตีอย่างรุนแรงเมื่อถูกยั่วยุเพียงเล็กน้อย"
