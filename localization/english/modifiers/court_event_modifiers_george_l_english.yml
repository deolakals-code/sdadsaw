## Court Event 7300
 incentivized_food_taster:0 "ผู้ชิมอาหารที่ได้รับแรงจูงใจ"
## Court Event 7400
 expensive_guests:0 "เจ้าบ้านผู้ฟุ่มเฟือย"
 expensive_guests_desc:0 "ผู้ปกครองผู้นี้เป็นที่รู้จักในเรื่องการต้อนรับอันเหลือเชื่อ"
 inhospitable_court:0 "เจ้าบ้านผู้ไม่ต้อนรับขับสู้"
 inhospitable_court_desc:0 "ราชสำนักของผู้ปกครองผู้นี้ไม่ใช่สถานที่ที่ต้อนรับขับสู้ที่สุด"
## Court Event 7610
 struggling_with_destrier:0 "กำลังลำบากกับม้าศึกเดสเทรีย"
 struggling_with_destrier_desc:0 "ตัวละครนี้ขี่ม้าศึกขนาดใหญ่เต็มตัว แม้จะไม่มีประสบการณ์เพียงพอที่จะควบคุมมัน"
 practicing_with_palfrey:0 "กำลังฝึกกับม้าพัลฟรีย์"
 practicing_with_palfrey_desc:0 "ตัวละครนี้ไม่ได้เกิดมาบนหลังม้า แต่ได้ฝึกฝนทักษะการขี่ม้ากับม้าที่เหมาะสม"
## Court Event 7620
 peregrine_falcon:1 "เหยี่ยวล่าเหยื่อ"
 peregrine_falcon_desc:3 "ตัวละครนี้เป็นเจ้าของเหยี่ยวฟอลคอนหรือเหยี่ยวฮอว์ก ซึ่งเป็นนกอันทรงเกียรติที่ใช้ในการล่าสัตว์และอวดแสดง\n#weak เพิ่ม [hunt_success_chance|E] ของ $hunt_type_falconry$#!"
## Court Event 7630
 master_of_horse_cavalry_bonus:0 "$master_of_horse_court_position$ ผู้มีแรงจูงใจ"
 master_of_horse_cavalry_bonus_desc:1 "[GetCourtPositionType('master_of_horse_court_position').GetName()] ของตัวละครนี้มีเหตุผลที่จะใช้ความพยายามเป็นพิเศษในภารกิจอันยากลำบากในการสั่งสอนผู้อื่นให้ดูแลม้าเป็นอย่างดี"
 master_of_hunt_activity_bonus:0 "$master_of_hunt_court_position$ ผู้มีแรงจูงใจ"
 master_of_hunt_activity_bonus_desc:1 "[GetCourtPositionType('master_of_hunt_court_position').GetName()] ของตัวละครนี้ใช้ความพยายามเพิ่มเติมในการล่าสัตว์ตามกำหนดการทุกครั้ง เพื่อเป็นการขอบคุณสำหรับการสนับสนุนและความภักดีของตัวละครนี้\n\n[activity|E] [GetActivityType('activity_hunt').GetName] ใช้ [gold|E] น้อยลงเล็กน้อย"
## Court Event 7700
 honorable_ruler:0 "ผู้ปกครองผู้ทรงเกียรติ"
 honorable_ruler_desc:0 "ตัวละครนี้เลือกเดินทางสายสูงส่งเมื่อไม่จำเป็นต้องทำ"
 pigeon_thief:0 "นกพิราบสัตว์เลี้ยง"
 pigeon_thief_desc:0 "ตัวละครนี้ก้าวนำหน้าอยู่เสมอด้วยนกพิราบสัตว์เลี้ยง #EMP อันชั่วร้าย#! ของตน"
 profiting_from_pigeon_thievery:0 "ผู้ให้ข้อมูลนกพิราบ"
 profiting_from_pigeon_thievery_desc:0 "บางคนเรียกผู้ให้ข้อมูลของตนว่า "นกน้อย" ตัวละครนี้หมายความตามนั้นจริงๆ"
