 ### Modifiers
 fired_court_position:0 "ผู้ดำรงตำแหน่งในราชสำนักที่ถูกไล่ออก"
## Court Event 7030
 cultural_acceptance_foreign_merchants:0 "ชุมชนพ่อค้าชาว [foreign_merchant.GetCulture.GetName]"
 cultural_acceptance_foreigners_expelled:0 "พ่อค้าชาว [foreign_merchant.GetCulture.GetName] ถูกขับไล่"
 court_7030_merchant_privileges:0 "ขยายสิทธิพิเศษแก่พ่อค้า"
 court_7030_merchant_privileges_desc:0 "ตัวละครนี้ได้มอบสิทธิพิเศษแก่กลุ่มพ่อค้าต่างชาติ เพื่อแลกกับการเข้าถึงกองเรือพาณิชย์อันกว้างขวางของพวกเขา"
 foreign_merchant_community:0 "ชุมชนพ่อค้าต่างชาติ"
 foreign_merchant_community_desc:0 "ชุมชนพ่อค้าต่างชาติเจริญรุ่งเรืองในเคาน์ตีนี้"
## Court Event 7040
 fervor_gain_ascetic_example:0 "ได้รับแรงบันดาลใจจากนักพรต"
 court_7040_ascetic_practices:0 "ปฏิบัติพรตนิยม"
 court_7040_ascetic_practices_desc:0 "ตัวละครนี้ได้นำแนวปฏิบัติพรตนิยมบางอย่างมาใช้เพื่อดำเนินชีวิตให้ใกล้ชิดกับอุดมคติทางศาสนาของตนมากขึ้น"
## Court Event 7050
 cultural_artifact_gift_accepted:0 "ได้รับของขวัญเป็นโบราณวัตถุชาว [friend.GetCulture.GetName]"
 cultural_artifact_gift_rejected:0 "ปฏิเสธโบราณวัตถุชาว [friend.GetCulture.GetName]"
 cultural_artifact_heretical:0 "โบราณวัตถุชาว [friend.GetCulture.GetName] ถูกตัดสินว่าเป็นพวกนอกรีต"
 intolerance_of_icons:0 "การไม่ยอมรับวัฒนธรรมนอกรีต"
 court_7050_listens_to_church:0 "ผู้ศรัทธาที่เชื่อฟัง"
 court_7050_listens_to_church_desc:0 "ตัวละครนี้มีความกระตือรือร้นอย่างแท้จริง และรับฟังนักบวชและผู้มีอำนาจทางศาสนาของตน"
 court_7050_tolerance:0 "ความอดทนต่อผู้อื่น"
 court_7050_tolerance_desc:0 "ตัวละครนี้มีใจที่เปิดกว้างเกี่ยวกับแนวปฏิบัติของผู้อื่น ซึ่งสร้างความระคายเคืองให้กับผู้มีอำนาจทางศาสนาของตน แต่ได้รับการชื่นชมจากผู้ที่มีศรัทธาต่างกัน"
## Court Event 7070
 court_7070_palace_renovations:0 "พระราชวังได้รับการปรับปรุงใหม่"
 court_7072_homogenising_culture:0 "ผู้รักษามรดกทางวัฒนธรรม"
 court_7072_renowned_court:0 "พระราชวังอันเลื่องชื่อ"
 cultural_palace_architecture:0 "รับเอารูปแบบสถาปัตยกรรมต่างชาติ"
