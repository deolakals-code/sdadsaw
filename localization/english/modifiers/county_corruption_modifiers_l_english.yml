l_english: 
 county_corruption_inefficient_tax_collection_modifier:0 "การเก็บภาษีที่ไร้ความสามารถ"
 county_corruption_inefficient_tax_collection_modifier_desc:0 "[county_corruption|E]\nความพยายามในการเก็บภาษีกำลังล้มเหลวในเคาน์ตี"
 county_corruption_deserting_levies_modifier:0 "ไพร่พลหนีทัพ"
 county_corruption_deserting_levies_modifier_desc:0 "[county_corruption|E]\nไพร่พลกำลังหนีทัพเป็นจำนวนมากในเคาน์ตีนี้"
 county_corruption_smuggling_ring_modifier:0 "เครือข่ายลักลอบขนสินค้า"
 county_corruption_smuggling_ring_modifier_desc:0 "[county_corruption|E]\nผู้ลักลอบขนสินค้ากำลังอาละวาดไปทั่วเคาน์ตี"
 county_corruption_bandits_rampant_modifier:0 "โจรผู้ร้ายชุกชุม"
 county_corruption_bandits_rampant_modifier_desc:0 "[county_corruption|E]\nโจรผู้ร้ายเตร็ดเตร่อย่างอิสระในเคาน์ตี"
 county_corruption_inefficient_census_modifier:0 "การสำรวจสำมะโนประชากรที่ไร้ประสิทธิภาพ"
 county_corruption_inefficient_census_modifier_desc:1 "ผู้ปกครองของเคาน์ตีนี้ไม่รู้ว่าใครหรือมีคนอาศัยอยู่ที่นี่กี่คน"
 county_corruption_lack_of_sheriffs_modifier:0 "การขาดแคลนนายอำเภอ"
 county_corruption_lack_of_sheriffs_modifier_desc:0 "[county_corruption|E]\nมีนายอำเภอไม่เพียงพอที่จะดูแลอาณาเขตทั้งหมดในเคาน์ตีนี้"
 county_corruption_lack_of_courts_modifier:0 "ความไม่ไว้วางใจศาล"
 county_corruption_lack_of_courts_modifier_desc:0 "[county_corruption|E]\nมีศาลไม่เพียงพอที่จะพิจารณาคดีของชาวนาในเคาน์ตีนี้"
 county_corruption_thieves_guild_modifier:0 "สมาคมหัวขโมย"
 county_corruption_thieves_guild_modifier_desc:0 "[county_corruption|E]\nสมาคมหัวขโมยกำลังดำเนินการอย่างอิสระในเคาน์ตีนี้"
 county_corruption_unsafe_highways_modifier:0 "ทางหลวงที่ไม่ปลอดภัย"
 county_corruption_unsafe_highways_modifier_desc:0 "[county_corruption|E]\nทางหลวงของเคาน์ตีนี้ปลอดภัยน้อยกว่าการเดินเตร็ดเตร่ในป่ายามค่ำคืน"
 county_corruption_uncooperative_guilds_modifier:0 "สมาคมที่ไม่ให้ความร่วมมือ"
 county_corruption_uncooperative_guilds_modifier_desc:1 "[county_corruption|E]\nสมาคมท้องถิ่นไม่เต็มใจที่จะร่วมมือกับผู้ปกครองของเคาน์ตีนี้"
 county_corruption_lackluster_administration_modifier:0 "การบริหารที่ขาดประสิทธิภาพ"
 county_corruption_lackluster_administration_modifier_desc:1 "[county_corruption|E]\nผู้ปกครองของเคาน์ตีนี้ไม่สามารถให้ทุนสนับสนุนการบริหารที่เหมาะสมที่นี่ได้อีกต่อไป!"
 county_corruption_roaming_bandits_modifier: "กลุ่มโจรพเนจร"
 county_corruption_roaming_bandits_modifier_desc: "[county_corruption|E]\nกลุ่มโจรพเนจรกำลังสร้างความหวาดผวาแก่ผู้คนที่เดินทางผ่านเคาน์ตีนี้!"
 county_corruption_wild_beast_attacks_modifier: "การโจมตีจากสัตว์ป่า"
 county_corruption_wild_beast_attacks_modifier_desc: "[county_corruption|E]\nฝูงสัตว์ป่าขนาดใหญ่กำลังเข้าทำร้ายและกัดกินทั้งแกะและคนเลี้ยงแกะในเคาน์ตีนี้"
 county_corruption_upset_shepherds_modifier: "คนเลี้ยงแกะขุ่นเคือง"
 county_corruption_upset_shepherds_modifier_desc: "[county_corruption|E]\nเหล่าคนเลี้ยงแกะในเคาน์ตีนี้ขุ่นเคืองและจงใจละเลยการดูแลฝูงสัตว์ของตน"
 county_corruption_rogue_warriors_modifier: "นักรบเถื่อน"
 county_corruption_rogue_warriors_modifier_desc: "[county_corruption|E]\nกลุ่มนักรบเถื่อนจำนวนมากกำลังต่อสู้และรีดไถทุกคนในเคาน์ตีนี้"
 county_corruption_unruly_nomads_modifier: "ชนเผ่าเร่ร่อนที่ไม่เคารพกฎเกณฑ์"
 county_corruption_unruly_nomads_modifier_desc: "[county_corruption|E]\nชนเผ่าเร่ร่อนที่อาศัยอยู่ในเคาน์ตีนี้ไม่เคารพกฎเกณฑ์และมักก่อการทะเลาะวิวาท"

