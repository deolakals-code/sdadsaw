l_english: 
 court_possessed_improved_condition_modifier:0 "การรักษาอาการถูกสิงที่ประสบความสำเร็จ"
 court_possessed_improved_condition_modifier_desc:1 "ตัวละครนี้รู้สึกดีขึ้นหลังการรักษา และผู้คนรอบข้างก็หวาดกลัวน้อยลง"
 6050_juicy_readings_modifier:0 "การอ่านที่เร้าใจ"
 6050_juicy_readings_modifier_desc:0 "ตัวละครนี้ได้หมกมุ่นอยู่กับการอ่านเนื้อหาที่ชี้นำ และนำสิ่งที่เรียนรู้ไปปรับใช้"
 court_no_wine_modifier:0 "การงดเว้นไวน์"
 court_no_wine_modifier_desc:1 "ตัวละครนี้ได้ปรับใช้วิถีชีวิตที่เข้มงวดในการงดเว้นไวน์"
 court_moderate_drinking_modifier:0 "การดื่มอย่างพอประมาณ"
 court_moderate_drinking_modifier_desc:1 "ตัวละครนี้เป็นนักดื่มเพื่อสังคม"
 rivers_of_wine_modifier: "แม่น้ำแห่งไวน์"
 rivers_of_wine_modifier_desc: "ตัวละครนี้ได้ปรับใช้วิธีการดื่มไวน์แบบสุขนิยม ซึ่งไม่จำเป็นต้องดีต่อสุขภาพ แต่เพื่อนของพวกเขาก็ ทำให้มันราคาถูก"
 court_fancy_seal_modifier:0 "ตราประทับขี้ผึ้งอันหรูหรา"
 court_fancy_seal_modifier_desc:1 "ตราประทับขี้ผึ้งอันหรูหราสำหรับลงนามในเอกสารโดยไม่ต้องอ่าน"
 court_tax_relief_county_modifier:0 "การลดหย่อนภาษี"
 court_tax_relief_county_modifier_desc:1 "เจ้าเหนือหัวของเคาน์ตีนี้ได้ลดหย่อนภาษีให้ ซึ่งส่งเสริมการเติบโต"
 hold_court_inspector_modifier:0 "ผู้ตรวจการอย่างเป็นทางการ"
 hold_court_inspector_modifier_desc:1 "ตัวละครนี้ถูกส่งมาจากเมืองหลวงเพื่อกำกับดูแลการเติบโตในท้องถิ่น"
 hold_court_bilingual_readings_modifier:0 "การอ่านสองภาษา"
 hold_court_bilingual_readings_modifier_desc:1 "ตัวละครนี้กำลังศึกษาวรรณกรรมที่ยิ่งใหญ่ที่สุดของวัฒนธรรมอื่น"
 hold_court_mysterious_book_modifier:0 "หนังสือลึกลับ"
 hold_court_mysterious_book_modifier_desc:1 "ตัวละครนี้เป็นเจ้าของหนังสือโบราณที่เขียนด้วยภาษาลึกลับ"
 court_6080_cultural_hostility_modifier:0 "เป็นปฏิปักษ์ต่อวัฒนธรรมที่แตกต่าง"
 court_6080_cultural_hostility_modifier_desc:1 "ตัวละครนี้ได้ข่มเหงวัฒนธรรมที่แตกต่างในอาณาเขตของตน"
 court_6090_almoners_county_modifier:0 "ผู้ให้ทาน"
 court_6090_almoners_county_modifier_desc:0 "ทานอันเอื้อเฟื้อส่งเสริมให้ประชากรท้องถิ่นเปลี่ยนศาสนา"
 court_6090_executioners_county_modifier:0 "การประหารชีวิต"
 court_6090_executioners_county_modifier_desc:0 "การประหารชีวิตพวกนอกรีตเพื่อเป็นเยี่ยงอย่างช่วยควบคุมประชากรให้อยู่ในระเบียบ"
 6110_war_compensations_county_modifier:0 "ค่าปฏิกรรมสงคราม"
 6110_war_compensations_county_modifier_desc:0 "ผู้ปกครองดินแดนเหล่านี้ได้ส่งเงินเพื่อบรรเทาความทุกข์ทรมานของประชากรในช่วงสงคราม"
 6110_sent_alms_county_modifier:0 "ทานจากผู้ปกครอง"
 6110_sent_alms_county_modifier_desc:0 "ผู้ปกครองดินแดนเหล่านี้ได้ส่งทานอันเอื้อเฟื้อเพื่อบรรเทาความทุกข์ทรมานของประชากรในช่วงสงคราม"
 6120_extra_taxes_modifier:0 "ภาษีพิเศษ"
 6120_extra_taxes_modifier_desc:0 "ภาษีพิเศษไม่เคยเป็นที่นิยมในหมู่ข้าหลวง"
 6121_seneschal_domesday_modifier:0 "การสำรวจที่ดินโดยผู้ดูแลวัง"
 6121_seneschal_domesday_modifier_desc:0 "การเก็บภาษีข้าหลวงของตัวละครนี้มีประสิทธิภาพมากขึ้นด้วยการสำรวจอาณาจักรอย่างสมบูรณ์"
 6121_steward_domesday_modifier:0 "การสำรวจที่ดินโดยสมุหพระคลัง"
 6121_steward_domesday_modifier_desc:0 "การเก็บภาษีข้าหลวงของตัวละครนี้มีประสิทธิภาพมากขึ้นด้วยการสำรวจอาณาจักรอย่างสมบูรณ์"
 6131_mapped_wilderness_county_modifier:0 "พื้นที่รกร้างที่ทำแผนที่แล้ว"
 6131_mapped_wilderness_county_modifier_desc:0 "แผนที่ที่ดินท้องถิ่นยัง รวมถึงพื้นที่รกร้างในท้องถิ่นด้วย ทำให้พื้นที่ปลอดภัยและควบคุมได้ง่ายขึ้น"
 6140_new_carpet_modifier:0 "พรมหนังสัตว์"
 6140_new_carpet_modifier_desc:0 "ตัวละครนี้มีพรมอุ่นที่ทำจากหนังสัตว์อันสง่างาม"
 6140_pet_modifier:0 "สัตว์เลี้ยงอสูร"
 6140_pet_modifier_desc:0 "สัตว์ร้ายที่น่าเกรงขามเพื่อสร้างความหวาดกลัวและความยำเกรงในหมู่ข้าราชสำนักและข้าหลวงของตัวละครนี้"
 6140_animal_guardian_modifier:0 "ผู้พิทักษ์ดุร้าย"
 6140_animal_guardian_modifier_desc:0 "สัตว์ร้ายที่คำรามกำลังควบคุมนักโทษคนนี้"
 6160_seneschal_help_modifier:0 "การสนับสนุนจากผู้ดูแลวัง"
 6160_seneschal_help_modifier_desc:0 "ตัวละครนี้กำลังได้รับความช่วยเหลือจากผู้ดูแลวังของผู้ปกครองในเรื่องการบริหาร"
 6190_safe_graves_county_modifier:0 "สุสานที่ปลอดภัย"
 6190_safe_graves_county_modifier_desc:0 "เจ้าเหนือหัวของเคาน์ตีนี้ได้ยุติการปล้นสุสานที่น่าสงสัย"
 6190_grave_robbing_county_modifier:0 "การปล้นสุสานที่ได้รับการส่งเสริม"
 6190_grave_robbing_county_modifier_desc:0 "เจ้าเหนือหัวของเคาน์ตีนี้อดทนและถึงกับส่งเสริมการปล้นสุสานเพื่อวัตถุประสงค์ในการวิจัย"
 6210_architect_county_modifier:0 "ประทับใจในวัฒนธรรม"
 6210_architect_county_modifier_desc:0 "ผู้คนในเคาน์ตีนี้ประทับใจในความสำเร็จทางวัฒนธรรมของเจ้าเหนือหัว"
 6230_new_elephants_modifier:0 "ช้างดุร้าย"
 6230_new_elephants_modifier_desc:0 "กองทัพของตัวละครนี้ได้รับการสนับสนุนจากฝูงช้างป่าที่ดุร้ายเป็นพิเศษ"
 6230_elephant_slayer_county_modifier:0 "ผู้สังหารช้าง"
 6230_elephant_slayer_county_modifier_desc:0 "เจ้าเหนือหัวของเคาน์ตีนี้ได้สั่งการสังหารหมู่ช้าง"
 6230_rebuilding: "การบูรณะ"
 6230_rebuilding_desc: "เคาน์ตีนี้ได้รับทุนสนับสนุนจำนวนมากเพื่อช่วยบูรณะหลังจากเหตุการณ์สำคัญที่เกี่ยวข้องกับช้างอาละวาด"

 court_fashion_foreign_modifier: "การปรากฏตัวอันน่าทึ่ง"
 court_fashion_foreign_modifier_desc: "ชาวต่างชาติทุกคนชื่นชมและอิจฉาแฟชั่นของราชสำนักของตัวละครนี้ เพิ่มประสิทธิภาพของ [foreign_affairs|E]"
 court_fashion_culture_modifier: "วัฒนธรรมที่เจิดจรัสที่สุด"
 court_fashion_culture_modifier_desc: "ชาวต่างชาติทุกคนต้องการเลียนแบบแฟชั่นของราชสำนักของตัวละครนี้ เพิ่มประสิทธิภาพของ [promote_culture|E]"
 court_fashion_sell_modifier: "แฟชั่นที่เหนือกว่า"
 court_fashion_sell_modifier_desc: "ชาวต่างชาติทุกคนต้องการซื้อเสื้อผ้าตามแฟชั่นของราชสำนักของตัวละครนี้"
 healthy_and_modest_diet_modifier: "อาหารสุขภาพและเรียบง่าย"
 healthy_and_modest_diet_modifier_desc: "ตัวละครนี้ได้เลือกอาหารที่พอประมาณและถ่อมตน"
 cant_poison_soup_modifier: "ไม่สามารถวางยาพิษในซุปเดิมได้"
 cant_poison_soup_modifier_desc: "ท่านจะไม่พลาดรสชาติของยาพิษหากซุปของท่านมีรสชาติเหมือนเดิมเสมอ!\n[GetScheme('murder').GetTypeName] [scheme|E] ที่เป็นศัตรู [success_chance|E] #P -50#!."
 cant_poison_soup_modifier_value: "$cant_poison_soup_modifier$: $VALUE|+0=-+$"
 lodgings_epidemics_resistance_modifier: "ที่พักที่ปรับปรุงแล้ว"
 lodgings_epidemics_resistance_modifier_desc: "ที่พักของราชสำนักตอนนี้สะอาดและกว้างขวางขึ้น ซึ่งช่วยลดการแพร่กระจายของโรค"
 lodgings_epidemics_resistance_modifier_1: "$lodgings_epidemics_resistance_modifier$"
 lodgings_epidemics_resistance_modifier_1_desc: "$lodgings_epidemics_resistance_modifier_desc$"
 lodgings_epidemics_resistance_modifier_2: "$lodgings_epidemics_resistance_modifier$"
 lodgings_epidemics_resistance_modifier_2_desc: "$lodgings_epidemics_resistance_modifier_desc$"
 lodgings_epidemics_no_resistance_modifier: "สภาพความเป็นอยู่ที่ย่ำแย่"
 lodgings_epidemics_no_resistance_modifier_desc: "ที่พักของราชสำนักคับแคบและสกปรก ซึ่งเพิ่มการแพร่กระจายของโรค"
 court_war_immigration_modifier: "ผู้ลี้ภัยสงคราม"
 court_war_immigration_modifier_desc: "เคาน์ตีนี้กำลังเห็นการหลั่งไหลเข้ามาอย่างต่อเนื่องของผู้ลี้ภัยสงครามจากเคาน์ตีชายแดน"
 spies_behind_every_corner_modifier: "สายลับอยู่ทุกมุม"
 spies_behind_every_corner_modifier_desc: "มีคนรับใช้จำนวนมากในราชสำนักของตัวละครนี้จนเป็นไปไม่ได้ที่จะติดตามทุกคน\nเพิ่มการยอมรับ [agent|E] และ [success_chance|E] สำหรับ [hostile_schemes|E] ทั้งที่เป็นเจ้าของและเป้าหมาย"
 servants_aplenty_cleaning_modifier: "คนรับใช้มากมาย"
 servants_aplenty_cleaning_modifier_desc: "เจ้าเหนือหัวไม่จำเป็นต้องรู้ชื่อหรือใบหน้าของคนรับใช้ทุกคน พวกเขาเพียงแค่ต้องรู้ว่าทุกคนทำงานหนักเพื่อรักษาที่พักให้อยู่ในสภาพดีเยี่ยม"
 humble_appearance_modifier: "รูปลักษณ์ที่ถ่อมตน"
 humble_appearance_modifier_desc: "ตัวละครนี้ไม่สนใจเสื้อผ้าหรูหราและรูปลักษณ์ภายนอกที่ฉาบฉวย การประหยัดทองคำมีประโยชน์มากกว่ามาก"
 ghost_writer_at_court_modifier: "นักเขียนสุนทรพจน์"
 ghost_writer_at_court_modifier_desc: "ตัวละครนี้กำลังจ้างศิลปินด้านคำพูดเพื่อ แต่งสุนทรพจน์สาธารณะของตน"
 poet_for_diplo_schemes_modifier: "กวีลิ้นเงิน"
 poet_for_diplo_schemes_modifier_desc: "ตัวละครนี้กำลังจ้างกวีผู้มีทักษะเพื่อช่วยในแผนการของตน\n[schemes|E] ทางการทูต [success_chance|E] #P +15#!."
 poet_for_seduction_schemes_modifier: "ถ้อยคำยั่วยวน"
 poet_for_seduction_schemes_modifier_desc: "ตัวละครนี้กำลังจ้างกวีผู้มีทักษะเพื่อช่วยในแผนการของตน\n [GetScheme('seduce').GetTypeName] [scheme|E] [success_chance|E] #P +20#!."
 court_confident_rider_modifier: "นักขี่ม้าผู้มั่นใจ"
 court_confident_rider_modifier_desc: "ตัวละครนี้ได้รับการสอนขี่ม้าโดยบิดามารดาอันเป็นที่รักตั้งแต่อายุยังน้อย และได้ทำมันด้วยความกระตือรือร้น"
 pressured_to_learn_court_language_modifier: "การเรียนรู้ภาษาในราชสำนัก"
 pressured_to_learn_court_language_modifier_desc: "ตัวละครนี้ถูกกดดันให้เรียนรู้ภาษาในราชสำนักของตนและกำลังพยายามอย่างหนัก"
 linguist_help_for_court_language_modifier: "ความช่วยเหลือจากนักภาษาศาสตร์"
 linguist_help_for_court_language_modifier_desc: "ตัวละครนี้กำลังเรียนรู้ภาษาในราชสำนักของครอบครัวด้วยความช่วยเหลือจากนักภาษาศาสตร์ผู้ทรงคุณวุฒิ"
 architect_building_program_county_modifier: "โครงการก่อสร้างของสถาปนิก $building_program_county_modifier$"
 architect_building_program_county_modifier_desc: "โครงการก่อสร้างของเคาน์ตีนี้อยู่ในมือของสถาปนิกผู้มีความสามารถ"
 building_program_county_modifier: "โครงการก่อสร้างอันทะเยอทะยาน"
 building_program_county_modifier_desc: "ผู้ปกครองของเคาน์ตีนี้กำลังส่งเสริมโครงการก่อสร้างอันทะเยอทะยาน"
 estate_building_program_modifier: "$building_program_county_modifier$"
 estate_building_program_modifier_desc: "ตัวละครนี้กำลังส่งเสริมโครงการก่อสร้างอันทะเยอทะยานในที่ดินของตระกูล"
