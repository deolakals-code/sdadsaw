l_english: 
 tgp_doddering_magistrate_modifier: "ขุนนางผู้งกเงิ่น"
 tgp_doddering_magistrate_modifier_desc: "เป็นที่น่าทึ่งอย่างแท้จริงว่าความโกลาหลอลหม่านในระบบราชการมากมายเพียงใดที่สามารถบังเกิดขึ้นได้จากคนเพียงคนเดียว"
 tgp_disrespected_elderly_modifier: "ปรามาสผู้อาวุโส"
 tgp_disrespected_elderly_modifier_desc: "ผู้อาวุโสที่ไม่พอใจเพียงคนเดียวสามารถก่อความวุ่นวายได้มากมายอย่างน่าประหลาดใจ"
 tgp_reduced_taxes_modifier: "ภาระภาษีที่ลดลง"
 tgp_reduced_taxes_modifier_desc: "การลดภาษีอาจมิได้ ทำให้รัฐมั่งคั่งขึ้น แต่ก็ปฏิเสธมิได้ว่ามันส่งผลดีอย่างยิ่งยวดต่อความนิยมชมชอบ"
 tgp_imprisoned_poor_modifier: "จองจำผู้ยากไร้"
 tgp_imprisoned_poor_modifier_desc: "ดูเหมือนว่าการจองจำผู้ยากไร้จะเป็นสิ่งที่ไม่เป็นที่พอใจอย่างน่าประหลาดใจ"
 tgp_compelled_labor_modifier: "การเกณฑ์แรงงาน"
 tgp_compelled_labor_modifier_desc: "ผู้คนถูกเกณฑ์ไปใช้แรงงาน และแม้นมิได้ยินดีกับโอกาสนี้นัก แต่พวกเขาก็ทำงานได้อย่างมีประสิทธิภาพ"
 tgp_appreciative_populace_modifier: "ไพร่ฟ้าผู้รู้คุณ"
 tgp_appreciative_populace_modifier_desc: "ขุนนางผู้ทรงคุณธรรมย่อมเป็นที่ชื่นชมของเหล่าสามัญชนเสมอ"
 tgp_pardoned_prisoners_modifier: "นักโทษที่ถูกปล่อยตัว"
 tgp_pardoned_prisoners_modifier_desc: "เหล่าผู้มีความผิดน้อยที่สุดก็ยังคงมีความผิดบางประการอยู่ดี - และบางคนก็หวนกลับไปสู่พฤติกรรมเดิมอย่างรวดเร็ว"
 tgp_convict_labor_modifier: "แรงงานนักโทษ"
 tgp_convict_labor_modifier_desc: "เมื่อเป็นเรื่องการก่อสร้าง เหล่านักโทษคือทางออกที่ใช้สืบต่อกันมา แต่โบราณสำหรับการขาดแคลนแรงงาน"
 tgp_enforced_justice_on_official_modifier: "ความยุติธรรมอันเข้มงวด"
 tgp_enforced_justice_on_official_modifier_desc: "ฝ่ายปกครองที่ปฏิบัติต่อคนของตนเองอย่างเคร่งครัด เช่นเดียวกับที่ปฏิบัติต่อผู้อื่นนั้น ย่อมควรค่าแก่การเคารพนับถือ"
 tgp_potent_physick: "โอสถอันทรงพลัง"
 tgp_potent_physick_desc: "ยาของพ่อค้าเร่ได้พิสูจน์แล้วว่า #EMP ชูกำลัง#! ในมากกว่าหนึ่งความหมาย"
 tgp_expelled_popular_peddler_modifier: "ขับไล่พ่อค้าเร่ผู้เป็นที่นิยม"
 tgp_expelled_popular_peddler_modifier_desc: "ผู้คนในตลาดต่างอาลัยอาวรณ์ต่อการสูญเสียยาขนานเอก เช่นนี้"
 tgp_delayed_taxes_modifier: "การผ่อนผันภาษี"
 tgp_delayed_taxes_modifier_desc: "ประชากรในแคว้นนี้ได้รับอนุญาตให้ผ่อนผันการชำระภาษี - ซึ่งเป็นผลเสียต่อท้องพระคลังของฝ่ายปกครอง แต่ก็เป็นที่ชื่นชมของเหล่าประชาราษฎร์"
 tgp_reassured_populace: "ประชาราษฎร์ผู้อุ่นใจ"
 tgp_reassured_populace_desc: "ผู้นำที่ได้รับความไว้วางใจเป็นแหล่งสร้างความอุ่นใจอันยิ่งใหญ่ให้แก่ผู้คนที่กำลังวิตกกังวล"
 tgp_state_annexed_land: "ที่ดินที่รัฐผนวก"
 tgp_state_annexed_land_desc: "สิ่งใดที่รัฐต้องการ รัฐก็มักจะเข้ายึดครองสิ่งนั้น และมีเพียงไม่กี่คนที่อยู่ในฐานะที่จะคัดค้านได้"
 tgp_empowered_merchants_association: "สมาคมพ่อค้าที่ได้รับอำนาจ"
 tgp_empowered_merchants_association_desc: "การมอบอภิสิทธิ์พิเศษแก่กลุ่มพ่อค้ากลุ่มใดกลุ่มหนึ่งสามารถแก้ไขปัญหาหลายประการในตลาดได้ แต่ก็สามารถสร้างบรรทัดฐานอันตรายขึ้นได้ เช่นกัน"
 tgp_army_reconstruction: "การฟื้นฟูโดยกองทัพ"
 tgp_army_reconstruction_desc: "เหล่าทหารอาจพร่ำบ่นที่ถูกสั่งให้ไปทำงานโยธา แต่ประสิทธิภาพของพวกเขานั้นมิอาจปฏิเสธได้"
 tgp_well_planned_bridge: "สะพานที่วางแผนมาอย่างดี"
 tgp_well_planned_bridge_desc: "สะพานอันควรค่าแก่การยกย่องเพิ่งถูกสร้างขึ้น ณ ที่แห่งนี้"
 tgp_settled_caravans: "กองคาราวานพ่อค้าที่ตั้งถิ่นฐาน"
 tgp_settled_caravans_desc: "การโน้มน้าวให้กองคาราวานพ่อค้าตั้งถิ่นฐานอย่างถาวรได้พิสูจน์แล้วว่าเป็นคุณประโยชน์อย่างยิ่งต่อเศรษฐกิจในท้องถิ่น"
 tgp_suppressed_popular_storyteller: "การปราบปรามนักเล่าเรื่องผู้เป็นที่นิยม"
 tgp_suppressed_popular_storyteller_desc: "การปิดปากผู้ที่พูดจาอย่างตรงไปตรงมาอาจช่วยระงับความไม่สงบได้ แต่ก็สามารถก่อให้เกิดความไม่สงบขึ้นได้ เช่นกัน"
 tgp_state_sponsored_storytellers: "นักเล่าเรื่องที่รัฐสนับสนุน"
 tgp_state_sponsored_storytellers_desc: "ผู้คนที่นี่ได้รับความบันเทิงเป็นประจำด้วยเรื่องเล่าของขุนนางผู้เมตตาและเหล่าทหารผู้กล้าหาญ"
 tgp_converted_storyteller: "นักเล่าเรื่องผู้แปรพักตร์"
 tgp_converted_storyteller_desc: "มีเพียงไม่กี่คนที่จะสั่งสอนด้วยความแรงกล้าเทียบเท่าผู้เปลี่ยนความเชื่อ และดูเหมือนว่าสิ่งนี้จะใช้ได้กับนักเล่าเรื่องมากพอๆ กับนักบวช"
 tgp_consolidated_population: "การรวบรวมประชากร"
 tgp_consolidated_population_desc: "การรวบรวมประชากรจากหมู่บ้านที่กระจัดกระจายมาไว้ยังสถานที่แห่งเดียวได้ช่วยส่งเสริมการพัฒนาในภูมิภาคอย่างมีนัยสำคัญ"
 tgp_market_regulation: "ตลาดที่มีการควบคุมอย่างดี"
 tgp_market_regulation_desc: "การควบคุมอย่างเข้มงวดของรัฐช่วยให้มั่นใจได้ว่าการค้าดำเนินไปอย่างถูกต้องและเป็นไปตามกฎระเบียบ"
 tgp_purchased_land: "การจัดหาที่ดิน"
 tgp_purchased_land_desc: "การรับราชการมักเสนอโอกาสมากมายสำหรับการสร้างความมั่งคั่งส่วนตน"
 tgp_hastily_rebuilt_bridge: "สะพานที่สร้างใหม่อย่างเร่งรีบ"
 tgp_hastily_rebuilt_bridge_desc: "ความเร่งรีบอาจมิใช่แนวทางที่ฉลาดที่สุดเสมอไปในเรื่องการก่อสร้าง แต่บางครั้งความจำเป็นก็ยิ่งใหญ่เกินกว่าจะรอได้"
 tgp_ferry_crossing: "ท่าเรือข้ามฟาก"
 tgp_ferry_crossing_desc: "ปัญหาที่ยากลำบากมักต้องการทางแก้ไขอันชาญฉลาด และเรือข้ามฟากก็เป็นสิ่งทดแทนสะพานได้อย่างดีเยี่ยม"
 tgp_harem_medical_treatment_modifier: "การดูแลฮาเร็ม"
 tgp_harem_medical_treatment_modifier_desc: "เหล่าบุปผาแห่งฮาเร็มนั้นบอบบางเฉก เช่นความงดงาม สุขภาพของพวกนางจำต้องได้รับการพิทักษ์รักษาอย่างเข้มงวดและแน่นอน ดุจเดียวกับความจงรักภักดีของพวกนาง"
 tgp_emperors_notice_modifier: "การสังเกตเห็นจากโอรสแห่งสวรรค์"
 tgp_emperors_notice_modifier_desc: "ตัวละครนี้ถูกค้นพบท่ามกลางฝูงชนโดยโอรสแห่งสวรรค์ในระหว่างการสอบส่วนกลาง แม้ว่าจะมีสายเลือดต่ำต้อยก็ตาม"
 tgp_harsh_cultivation_modifier: "การบ่มเพาะอันเข้มงวด"
 tgp_harsh_cultivation_modifier_desc: "การแข่งขันอันดุเดือดกับศิษย์คนอื่นของอาจารย์สร้างสภาพแวดล้อมการเรียนรู้ที่ยากลำบาก แต่ก็ ทำให้ได้รับความเอาใจใส่มากมาย"
 tgp_strict_supervision_modifier: "การสอดส่องอันเข้มงวด"
 tgp_strict_supervision_modifier_desc: "ผู้นับหมื่นนับแสนต่างจ้องมองสรวงสวรรค์ มีเพียงไม่กี่คนที่ถูกจ้องมองกลับ และมีเพียงตัวละครนี้เท่านั้นที่ถูกจับตามองอย่างพินิจพิเคราะห์เป็นพิเศษ"
