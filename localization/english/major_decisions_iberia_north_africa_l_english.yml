l_english: 
 
 iberia_north_africa.0005.t:0 "การรวมสเปนเป็นหนึ่ง"
 iberia_north_africa.0005.desc:0 "อีกครั้งหนึ่ง บัลลังก์แห่งสเปนได้รวมเป็นหนึ่งภายใต้ [ROOT.Char.GetTitleAsNameNoTooltip] เพียงผู้เดียว เหล่ากษัตริย์จอมปลอมถูกถอดถอน ขณะที่ [ROOT.Char.GetPrimaryTitle.GetNameNoTier] อันภาคภูมิกลับแข็งแกร่งยิ่งกว่าครั้งใด\n\nวันหนึ่งข้าจักลาจากโลกนี้ไปสู่ [ROOT.Char.GetFaith.DivineRealm] ทว่ามรดกของข้าจะคงอยู่บนโลกหล้าชั่วนิรันดร์ พวกเขาจะขนานนามข้าว่า '[ROOT.Char.GetTitledFirstNameNoTooltip] — [ROOT.Char.GetMotherFather|U] แห่งสเปน'"
 iberia_north_africa.0005.a:1 "นี่คือรุ่งอรุณแห่งยุคสมัยใหม่"

 iberia_north_africa.0006.start.desc:0 "อาณาจักรสเปนทั้งหลายต่างทยอยตกอยู่ภายใต้การปกครองของ [spain_uniter.GetPrimaryTitle.GetNameNoTier] ทีละแห่ง"
 iberia_north_africa.0006.relation_former.desc:0 "[ROOT.Char.Custom2('RelationToMe', spain_uniter)] ของข้า [spain_uniter.GetTitledFirstName]"
 iberia_north_africa.0006.former.desc:0 "[spain_uniter.GetTitledFirstName]"
 iberia_north_africa.0006.end.desc:0 "ได้ประกาศว่า [spain_uniter.GetHerselfHimself] คือ '[spain_uniter.GetMotherFather|U] แห่งสเปน'\n\nชื่อของ [spain_uniter.GetHerHis|U] จะคงอยู่ไปอีกหลายศตวรรษอย่างแน่นอน แต่ [spain_uniter.GetSheHe] จะถูกจดจำในฐานะวีรบุรุษหรือทรราช? มีเพียง [ROOT.Char.GetFaith.FateGodName] เท่านั้นที่รู้"

 iberia_north_africa.0010.t:0 "แอฟริกาหนึ่งเดียว"
 iberia_north_africa.0010.start.desc:0 "มิมีผู้ใดคาดคิดว่าจะทำได้ ทว่าข้าก็ยืนหยัดอยู่ ณ ที่นี้ ในฐานะ [ROOT.Char.GetTitleAsNameNoTooltip] เหนือทั่วแผ่นดินแอฟริกา"
 iberia_north_africa.0010.vassals.desc:0 "จากชายฝั่งแอตแลนติกจรดมหาสมุทรบูรพา ทุกชนเผ่า [vassal_1.GetTitleAsNameNoTooltip] และ [vassal_2.GetTitleAsNameNoTooltip] บัดนี้ล้วนสวามิภักดิ์ต่อข้า"
 iberia_north_africa.0010.spirits.desc:0 "\n\nเหล่า [africa_uniter.Custom('DefaultPriestTitlePlural')] บอกข้าว่าดวงวิญญาณทั้งหลายต่างพึงพอใจ ในที่สุด ดินแดนของเราก็เป็นอิสระ! แม้ยังมีงานที่ต้องทำ แต่ในวันนี้ เราจะเฉลิมฉลอง!"
 iberia_north_africa.0010.ancestors.desc:0 "\n\nเหล่า [africa_uniter.Custom('DefaultPriestTitlePlural')] บอกข้าว่าบรรพบุรุษต่างพึงพอใจ ในที่สุด ดินแดนของเราก็เป็นอิสระ! แม้ยังมีงานที่ต้องทำ แต่ในวันนี้ เราจะเฉลิมฉลอง!"
 iberia_north_africa.0010.generic.desc:0 "\n\nไพร่ฟ้าข้าแผ่นดินของข้ามาจากทุกสารทิศ แต่ข้าจะนำพาพวกเราให้เป็นหนึ่งเดียวและสร้างเส้นทางใหม่ นับ แต่วันนี้ไป เราคือประชากรหนึ่งเดียวภายใต้ [ROOT.Char.GetFaith.HighGodName]"
 iberia_north_africa.0010.a:0 "เกียรติแด่แอฟริกา!"

 iberia_north_africa.0011.start.desc:0 "ผู้คนทั้งมวลในแอฟริกา ตั้งแต่ชนเผ่าเล็กที่สุดไปจนถึงกษัตริย์ผู้ยิ่งใหญ่ที่สุด บัดนี้ล้วนอยู่ภายใต้การปกครองของ [africa_uniter.GetPrimaryTitle.GetNameNoTier]"
 iberia_north_africa.0011.relation_former.desc:0 "[ROOT.Char.Custom2('RelationToMe', africa_uniter)] ของข้า [africa_uniter.GetTitledFirstName]"
 iberia_north_africa.0011.former.desc:0 "[africa_uniter.GetTitledFirstName]"
 iberia_north_africa.0011.end.desc:0 "ได้รวบรวมพวกเขาทั้งหมดไว้ภายใต้ธง [africa_uniter.GetFaith.GetAdjective]\n\n[africa_uniter.GetPrimaryTitle.GetTierAsNameNoTooltip] อันกว้างใหญ่ไพศาล เช่นนี้จะยืนหยัดผ่านกาลเวลาได้หรือไม่ หรือการรวมเป็นหนึ่งนี้จะล่มสลายในที่สุด? มีเพียง [ROOT.Char.GetFaith.FateGodName] เท่านั้นที่ล่วงรู้"
 decision_unite_africa_confirm:0 "รวมแอฟริกาเป็นหนึ่ง"
 iberia_north_africa.0015.t:0 "ล้างแค้นแด่ผู้พลีชีพ"
 iberia_north_africa.0015.part1.desc:0 "ชาวมุสลิมผู้กล้าหาญนับพันนับหมื่นได้ล้มตายบนเส้นทางสู่ตูร์ บนเส้นทางแห่งผู้พลีชีพ พวกเขาต่อสู้เพื่ออนาคตที่ดีกว่า เพื่อยุคทองใหม่สำหรับผู้ศรัทธาที่แท้จริง วันนี้ อนาคตนั้นมาถึงแล้วในที่สุด"
 iberia_north_africa.0015.part2.desc:0 "\n\nด้วยฐานที่มั่นอันแข็งแกร่งในยุโรป การพิชิตอันรุ่งโรจน์ของข้าเพิ่งจะเริ่มต้น..."
 iberia_north_africa.0015.a:0 "อัลลอฮุอักบัร"

 iberia_north_africa.0016.t:0 "เสียงสะท้อนจากอดีต"
 iberia_north_africa.0016.relation_former.desc:0 "\n\n[ROOT.Char.Custom2('RelationToMe', avenger)] ของข้า [avenger.GetTitledFirstName]"
 iberia_north_africa.0016.former.desc:0 "\n\n[avenger.GetTitledFirstName]"
 iberia_north_africa.0015.islam.desc:0 "ได้นำทัพของ [avenger.GetHerHis] เข้าสู่ใจกลางอาณาจักรแฟรงก์เก่าแก่และบดขยี้ผู้ต่อต้านทั้งปวง ด้วยฐานที่มั่นอันแข็งแกร่งของ [avenger.GetHerHis] ในยุโรป อนาคตของอิสลามดูสดใสยิ่งกว่าครั้งใด"
 iberia_north_africa.0016.christianity.a:0 "ขอพระเจ้าทรงเมตตาวิญญาณของพวกเราด้วยเถิด"
 iberia_north_africa.0016.generic.desc:0 "หลายปีก่อน บนเส้นทางสู่ตูร์ กองทัพคริสเตียนแฟรงก์ได้ยุติการรุกรานยุโรปของราชวงศ์อุมัยยะฮ์ ชาร์ลส์ มาร์เตลและไพร่พลของเขาได้เปลี่ยนเส้นทางประวัติศาสตร์\n\nแต่ไม่มีสิ่งใดคงอยู่ตลอดไป [avenger.GetName] ได้กรีธาทัพลึกเข้าไปในอาณาจักรแฟรงก์เก่าแก่และอ้างสิทธิ์เป็นของ [avenger.GetHerHis] ด้วยฐานที่มั่นอันแข็งแกร่งในยุโรปนี้ มีเพียง [ROOT.Char.GetFaith.FateGodName] เท่านั้นที่ล่วงรู้ว่า [avenger.GetTitledFirstNameNoTooltip] จะทำสิ่งใดต่อไป..."

 iberia_north_africa.0001.t:0 "ราชอาณาจักรโปรตุเกส"
 iberia_north_africa.0001.start.desc:0 "วันนี้จะถูกจดจำตลอดไปในฐานะรุ่งอรุณแห่งราชอาณาจักรโปรตุเกสอันยิ่งใหญ่"
 iberia_north_africa.0001.christian.desc:0 "ผู้คนของเราทนทุกข์ภายใต้การปกครองของมุสลิมมานานหลายศตวรรษ แต่บัดนี้ไม่ใช่อีกต่อไป ในที่สุด ด้วยการพิชิตอันรุ่งโรจน์ในนามแห่ง [ROOT.Char.GetFaith.WarGodName] เราคือชาติ [ROOT.Char.GetFaith.GetAdjectiveNoTooltip] ที่เป็นอิสระ!\n\n"
 iberia_north_africa.0001.muslim.desc:0 "ด้วยพลานุภาพแห่ง [ROOT.Char.GetFaith.WarGodName] เราได้พิชิตดินแดนเหล่านี้และบัดนี้สามารถเรียกชายฝั่งตะวันตกของคาบสมุทรไอบีเรียว่าเป็นบ้านของเราได้อย่างภาคภูมิ ขอให้ชาว [ROOT.Char.GetFaith.GetAdjective] เจริญรุ่งเรือง ณ ที่นี้ไปอีกนานหลายปี!\n\n"
 iberia_north_africa.0001.end.desc:0 "ตลอดหลายพันปี อารยธรรมมากมายได้ปกครองดินแดนเหล่านี้ พวกเขาทั้งหมดได้มีส่วนร่วมในโครงข่ายอันซับซ้อน ซึ่งเป็นมรดกทางวัฒนธรรมของเรา วันนี้เรามีเอกลักษณ์เฉพาะตัวของเราเอง และขณะที่ข้าก่อตั้งราชอาณาจักรใหม่นี้ เราเรียกตนเองอย่างภาคภูมิว่าชาวโปรตุเกส!"
 iberia_north_africa.0001.a:0 "บัดนี้ถึงเวลาของเราแล้ว!"
 iberia_north_africa.0002.start.desc:0 "ยุคสมัยใหม่ได้มาถึงคาบสมุทรไอบีเรียแล้ว!"
 iberia_north_africa.0002.relation_former.desc:0 "[ROOT.Char.Custom2('RelationToMe', portugal_former)] ของข้า [portugal_former.GetTitledFirstName]"
 iberia_north_africa.0002.former.desc:0 "[portugal_former.GetTitledFirstName]"
 iberia_north_africa.0002.end.desc:0 "ได้ก่อตั้งราชอาณาจักรโปรตุเกสขึ้นบนชายฝั่งตะวันตก หลังจากหลายศตวรรษแห่งการอพยพและสงคราม ชนชาติโปรตุเกสอันภาคภูมิได้ถือกำเนิดขึ้น โดยมี [portugal_former.GetTitledFirstNameNoTooltip] เป็นผู้นำของพวกเขา\n\nชาติที่เพิ่งถือกำเนิดนี้จะรุ่งเรืองสู่ความรุ่งโรจน์หรือจะถูกกลืนกินในการพิชิตอีกครั้ง? มีเพียงกาลเวลาเท่านั้นที่จะบอกได้"
 iberia_north_africa.0002.a1:0 "เกียรติแด่ [ROOT.Char.GetFaith.WarGodName]!"
 name_alas:0 "อนิจจา"
 name_i_see:0 "ข้าเข้าใจแล้ว"
 iberia_north_africa.0002.b:0 "[ROOT.Char.GetFaith.WarGodName] อวยพรโปรตุเกส!"
 iberia_north_africa.0002.c:0 "ข้ายังคงเป็น [ROOT.Char.GetCulture.GetNameNoTooltip] ไม่ว่าพวกเขาจะคิด เช่นไร"
 
 iberia_north_africa.9101.t:0 "ราชอาณาจักรกานาเรียส"
 iberia_north_africa.9101.desc.intro:0 "นับ แต่โบราณกาล แต่ละเกาะต่างเรียกตนเองว่า “ราชอาณาจักร” แต่บัดนี้เมื่อเกาะทั้งปวงอยู่ภายใต้การปกครองอันขยันขันแข็งของ [canarias_former.GetTitledFirstName] ก็ถึงเวลารวมราชบัลลังก์เป็นหนึ่งเดียว\n\n"
 iberia_north_africa.9101.desc.iberian:1 "ด้วยความพ่ายแพ้ครั้งสุดท้ายของเหล่ากษัตริย์กวนเชนอกรีต จึงเหลือสิ่งกีดขวางเพียงน้อยนิดต่อการเผยแผ่ [canarias_former.GetFaith.GetName] ในหมู่ผู้อยู่อาศัยบนเกาะ และเสริมสร้างความมั่นคงในการปกครองหมู่เกาะของ [canarias_former.GetTitledFirstNamePossessiveNoTooltip] บัดนี้ [title_k_canarias.GetNameNoTierNoTooltip] ได้รับการประกาศให้เป็น [title_k_canarias.GetTierAsNameNoTooltip] โดยมี [canarias_former.GetName] เป็น [canarias_former.GetTitleAsNameNoTooltip] พระองค์แรก!"
 iberia_north_africa.9101.desc.guanche:1 "เมื่อขอบฟ้ากว้างไกลและเปิดออกเบื้องหน้าเรา เราเห็นการรุ่งเรืองของราชอาณาจักรยิ่งใหญ่กว่าของเราเอง และหากเราจะต้านทานผู้รุกรานจากต่างแดน เราต้องกำหนดชะตาและราชบัลลังก์ของเราเอง ด้วย [canarias_former.GetName] ได้รับการสวมมงกุฎเป็น [canarias_former.GetTitleAsNameNoTooltip] พระองค์แรกแห่ง [title_k_canarias.GetNameNoTierNoTooltip] ในที่สุดผู้อยู่อาศัยบนเกาะก็มีสัญลักษณ์ที่รวมพวกเขาเป็นหนึ่งและเป้าหมายร่วมกันในการรักษาวิถีชีวิตของเรา"
 iberia_north_africa.9101.desc.outro:0 "\n\nอนาคตยังคงไม่แน่นอนสำหรับ [title_k_canarias.GetNameNoTierNoTooltip] แต่การประกาศ [title_k_canarias.GetTierAsNameNoTooltip] ใหม่จะนำไปสู่ยุคสมัยใหม่โดยสิ้นเชิงสำหรับหมู่เกาะและอนาคตของแอฟริกาเหนืออย่างไม่ต้องสงสัย"
 iberia_north_africa.9101.a:0 "ราชอาณาจักรใหม่ถือกำเนิดแล้ว!"
 iberia_north_africa.9101.b:0 "อนาคตของ [title_k_canarias.GetNameNoTierNoTooltip] อยู่ในไอบีเรีย!"
 
 iberia_north_africa.0101.t:0 "ความภักดีต่อบัลลังก์แห่งนักบุญเปโตร"
 iberia_north_africa.0101.desc:0 "ไม่ใช่เรื่องง่ายเลย แต่ตระกูลของข้าได้รวบรวมดินแดน [religious_leader.GetFaith.GetAdjective] และอำนาจทางจิตวิญญาณมากพอที่จะสามารถเรียกประชุมสภาสงฆ์ชั้นสูงของเราได้ ในที่สุด เลือด หยาดเหงื่อ และความเหนื่อยยากของเราก็ได้ผลตอบแทนอย่างเต็มที่\n\nเหล่า [religious_leader.GetFaith.PriestNeuterPlural] ที่มาชุมนุมกันใน [religious_leader.GetCapitalLocation.GetTitle.GetBaseNameNoTier] ต่างถกเถียงกันอย่างกระตือรือร้นเกี่ยวกับนโยบาย เดินขวักไขว่ไปตามโถงและทางเดินในปราการของข้าพร้อมข้อเสนอมากมายและการชกต่อยกันเป็นครั้งคราวอันเนื่องมาจากประเด็นทางเทววิทยา เรารู้ว่าเราปรารถนาที่จะยึดมั่นในโรมและ [pope.GetTitledFirstName] แต่เห็นพ้องกันในเรื่องอื่นเพียงเล็กน้อยเท่านั้น\n\nหลังจากหลายสัปดาห์แห่งความขัดแย้ง ก็ตกเป็นหน้าที่ของข้า ในฐานะเจ้าภาพและ [religious_leader.GetTitleAsNameNoTooltip] ของพวกเขา ที่จะต้องตัดสินชี้ขาด"
 iberia_north_africa.0101.a:0 "หนึ่งประชากร หนึ่งศรัทธา!"
 iberia_north_africa.0101.a.tt:0 "ท่านสนับสนุนแนวทาง $doctrine_pluralism_righteous_name$ มากขึ้น"
 iberia_north_africa.0101.b:0 "เรา #EMP จะต้องไม่#! กลัวที่จะยึดอำนาจเพื่อปกป้องพวกเราเอง"
 iberia_north_africa.0101.b.tt:0 "ท่านสนับสนุนแนวทาง $doctrine_pluralism_fundamentalist_name$ มากขึ้น"
 iberia_north_africa.0101.c:0 "[religious_leader.GetFaith.ReligiousText] จะยังคงต้องการการตีความ..."
 iberia_north_africa.0101.c.tt:0 "ท่านสนับสนุนแนวทาง $doctrine_pluralism_pluralistic_name$ ที่มากขึ้นไปอีก"

 iberia_north_africa.0102.t:0 "[religious_leader.GetFaith.GetAdjectiveNoTooltip] $iberia_north_africa.0101.t$"
 iberia_north_africa.0102.desc.intro:0 "หลังจากชั่วชีวิตแห่งการสั่งสมอำนาจทางศาสนาและการเมือง ในที่สุด [religious_leader.GetTitledFirstName] ก็สามารถรวบรวมการประชุมใหญ่ของนักบวช [religious_leader.GetFaith.GetAdjective] ณ เมืองหลวงของ [religious_leader.GetHerHis] ที่ [religious_leader.GetCapitalLocation.GetTitle.GetBaseNameNoTier] เพื่อหารือเกี่ยวกับอนาคตของศรัทธา\n\nหลังจากหลายสัปดาห์แห่งการถกเถียงอย่างเผ็ดร้อน เหล่าสมณะที่มาชุมนุมกันได้เลือกที่จะยืนยันความภักดีต่อ [pope.GetTitledFirstName] อีกครั้ง แม้ว่าจะมีการ... #EMP ปรับเปลี่ยน#! นโยบายทางศาสนจักรอยู่บ้าง\n\nการปรับปรุงเหล่านี้มุ่งเน้นไปที่"
 iberia_north_africa.0102.desc.fundamentalist:0 "ความผิดที่รับรู้ว่าได้กระทำต่อผู้ศรัทธา และวิธีป้องกันสิ่งนั้นสามารถทำได้โดยการสถาปนาอำนาจทางโลกผ่านทุกวิถีทางที่มีอยู่"
 iberia_north_africa.0102.desc.righteous:0 "การมองเข้าสู่ภายใน เพื่อให้แน่ใจถึงความเป็นเนื้อเดียวกันทางศาสนาระหว่างวัฒนธรรมหลักที่ยึดถือศาสนจักร"
 iberia_north_africa.0102.desc.pluralist:0 "การสร้างขนบธรรมเนียมและแนวปฏิบัติที่เข้มงวดสำหรับการศึกษา [religious_leader.GetFaith.ReligiousText] และวิธีการที่เป็นทางการเพื่อท้าทายความเข้าใจในสิ่งนั้น"
 iberia_north_africa.0102.a.same_faith:0 "เราต้องปกป้องตนเอง!"
 iberia_north_africa.0102.a.same_religion:0 "พวกเขาถือว่า #EMP เรา#! เป็นภัยคุกคามหรือไม่?"
 iberia_north_africa.0102.a.misc:0 "ช่างเป็นพวกคลั่งศาสนาที่น่ากังวล!"
 iberia_north_africa.0102.b.same_faith:0 "ศรัทธาเพื่อพวกเราเอง!"
 iberia_north_africa.0102.b.same_religion:0 "ช่างหมกมุ่นอยู่กับตนเอง..."
 iberia_north_africa.0102.b.misc:0 "ตราบใดที่พวกเขายังอยู่ แต่ในส่วนของตน"
 iberia_north_africa.0102.c.same_faith:0 "การศึกษา [religious_leader.GetFaith.ReligiousText] อย่างเข้มงวดเป็นประโยชน์ต่อทุกคน"
 iberia_north_africa.0102.c.same_religion:0 "ช่างไร้จุดหมายสิ้นดี ที่จะศึกษาอย่างหนักเมื่อผิดพลาดไปแล้ว..."
 iberia_north_africa.0102.c.misc:0 "ทางแก้ปัญหาความเบี่ยงเบนทางหลักคำสอนของพวกเขาคือการจับผิดหลักคำสอนหรือ?"

 iberia_north_africa.0111.t:0 "อิสรภาพจากพันธนาการแห่งโรม"
 iberia_north_africa.0111.desc:0 "ต้องใช้เวลาหลายปีในการสร้างเอกภาพทางการเมืองและจิตวิญญาณเพื่อรวบรวมการประชุมใหญ่นี้ แต่ในที่สุดข้าก็ได้นำทั้งชาวบ้านและนักบวชมาสู่ร่มธงของข้ามากพอที่จะปฏิเสธ [pope.GetTitledFirstName] จอมปลอมได้อย่างมีความหมาย\n\nแม้กระทั่งตอนนี้ ทางเดินและห้องพักแขกของ [religious_leader.GetCapitalLocation.GetTitle.GetBaseNameNoTier] ก็เต็มไปด้วยนักบวชที่โต้เถียงกันและบิชอปที่แสดงความรู้สึกอย่างรุนแรง ทุกภราดาที่ไม่พอใจและ [religious_leader.GetFaith.PriestNeuter] ชั้นผู้น้อยที่โรมเคยดูแคลนต่างอุดตันอยู่ในโถงของข้า\n\nการถกเถียงทั้งหมดนี้มีความสำคัญต่อความชอบธรรม แต่ท้ายที่สุด ในฐานะผู้ปกครอง [religious_leader.GetFaith.GetAdjective] ที่โดดเด่นที่สุด คำพูด #EMP ของข้า#! จะเป็นการตัดสินครั้งสุดท้าย"
 iberia_north_africa.0111.a:0 "พระบุตรของพระเจ้าทรงสอนสันติภาพ และเราจะปฏิบัติตาม"
 iberia_north_africa.0111.a.tt:0 "$iberia_north_africa.0101.a.tt$"
 iberia_north_africa.0111.b:0 "แม้ปราศจากโรม เราก็รู้คุณค่าของการปกป้องพวกเราเอง!"
 iberia_north_africa.0111.b.tt:0 "$iberia_north_africa.0101.b.tt$"
 iberia_north_africa.0111.c:0 "อิสลามมิใช่ศาสนาแห่งคัมภีร์ด้วยหรือ?"
 iberia_north_africa.0111.c.tt:0 "$iberia_north_africa.0101.c.tt$"
 mozarabic_break_with_rome_decision.tt.you_gain_a_hof:0 "มีการสร้าง [title|E] [head_of_faith|E] [faith|E] เดียวกันใหม่สำหรับ [religious_leader.GetFaith.GetName]"
 mozarabic_break_with_rome_decision.tt.new_hof_id:0 "[new_religious_head.GetTitledFirstName] คือ [head_of_faith|E] ใหม่ของท่าน"

 iberia_north_africa.0112.t:0 "ศาสนจักร [religious_leader.GetFaith.GetAdjectiveNoTooltip] แตกแยกจาก [pope.GetFaith.GetNameNoTooltip]"
 iberia_north_africa.0112.desc.intro:0 "ด้วยความพยายามอย่างยิ่ง ในที่สุด [religious_leader.GetTitledFirstName] ก็บรรลุผลงานชั่วชีวิตของ [religious_leader.GetHerHis] ในการสั่งสมอำนาจทางการเมืองและจิตวิญญาณมากพอที่จะนำศาสนจักร [religious_leader.GetFaith.GetAdjective] มารวมกันเพื่อเป้าหมายเดียว: การแตกหักกับคำสั่งของ [pope.GetTitledFirstName]\n\nสภาศาสนจักรที่ตามมานั้นมีการอภิปรายอย่างดุเดือดเกี่ยวกับวิธีเติมเต็มช่องว่างที่เกิดจากการครอบงำของโรม โดยมีรายงานว่านักบวชบางคนทะเลาะวิวาทกันอย่างเปิดเผยในโถงของ [religious_leader.GetCapitalLocation.GetTitle.GetBaseNameNoTier]\n\nการแทรกแซงของ [religious_leader.GetTitledFirstNamePossessiveNoTooltip] เป็นสิ่งเดียวที่ทำลายทางตัน โดยเลือกที่จะมุ่งเน้นไปที่"
 iberia_north_africa.0112.desc.fundamentalist:0 "การรับหน้าที่ปกป้องการจาริกแสวงบุญไปยังสถานที่ศักดิ์สิทธิ์ [religious_leader.GetFaith.GetAdjectiveNoTooltip] ด้วยกำลังอาวุธ"
 iberia_north_africa.0112.desc.righteous:0 "การย้อนกลับสิ่งที่ [religious_leader.GetSheHe] มองว่าเป็นความรุนแรงอันเป็นบาปที่แพร่ระบาดไปทั่ว [religious_leader.GetFaith.GetReligion.GetName]\n\nตามคำกล่าวของ [religious_leader.GetHerHim] [religious_leader.GetFaith.GetAdherentNamePluralNoTooltip] ควรมุ่งเน้นไปที่ความศรัทธาในการดำเนินชีวิตที่ดี แทนที่จะพยายามปูทางไปสู่ [religious_leader.GetFaith.PositiveAfterLife] ด้วยเลือดของผู้นอกรีต"
 iberia_north_africa.0112.desc.pluralist:0 "การผ่อนคลายข้อจำกัดและข้อห้ามที่ขัดขวางการผ่อนปรนกับเพื่อนบ้านชาวมุสลิมได้ง่ายขึ้น โดยสนับสนุนแนวทางสากลสัมพันธ์ต่อความสัมพันธ์ระหว่างศาสนา"
 iberia_north_africa.0112.a.same_faith:0 "โดย [religious_leader.GetFaith.HighGodName] และสิทธิ์ของเรา!"
 iberia_north_africa.0112.a.same_religion:0 "พวกเขาไม่ควรปิดกั้นสถานที่ศักดิ์สิทธิ์ #EMP ของเรา#! เป็นอย่างยิ่ง"
 iberia_north_africa.0112.a.misc:0 "ดูเหมือนว่าพวกเขากำลังจับผิดเรื่องเล็กน้อย..."
 iberia_north_africa.0112.b.same_faith:0 "อำนาจผ่านสันติภาพ!"
 # ^Kane lives in Death!
 iberia_north_africa.0112.b.same_religion:0 "ข้าคาดว่าพวกเขาคิดว่าตนเองดีกว่าเรา..."
 iberia_north_africa.0112.b.misc:0 "สงสัยว่า #EMP นั่น#! จะเป็นผลดีต่อพวกเขาอย่างไร..."
 iberia_north_africa.0112.c.same_faith:0 "เรามีอะไรเหมือนกันมากกว่าต่างกัน"
 iberia_north_africa.0112.c.same_religion:0 "น่ากังวล..."
 iberia_north_africa.0112.c.islam:0 "หวังว่านี่จะเป็นก้าวแรกสู่การเปลี่ยนศาสนาที่แท้จริง..."
 iberia_north_africa.0112.c.misc:0 "ถ้า เช่นนั้น พวกเขาเป็นศรัทธาแบบผสมผสานหรือ?"

 iberia_north_africa.0121.t:0 "การกลับคืนสู่ชนบท"
 iberia_north_africa.0121.desc.intro:0 "ไม่ใช่ความลับที่ข้ามี... ปัญหากับศรัทธา [old_faith.GetAdjective] ของข้า"
 iberia_north_africa.0121.desc.excommunicated:0 "การถูกขับออกจากศาสนาเป็นเรื่องยากสำหรับข้า ทำให้จิตวิญญาณของข้าต้องแบกรับภาระอย่างไม่เป็นธรรม และก่อให้เกิดความขัดแย้งไม่สิ้นสุดกับ [old_faith.GetAdherentNamePluralNoTooltip] คนอื่นๆ ในชีวิตของข้า"
 iberia_north_africa.0121.desc.rivalry_with_hof:0 "การโต้เถียงอย่างต่อเนื่องกับ [old_faith.GetReligiousHead.GetTitledFirstName] การทะเลาะวิวาททางโลกอันเล็กน้อยที่ [old_faith.GetReligiousHead.GetSheHe] #EMP ควรจะ#! อยู่เหนือกว่า ได้ ทำให้ข้ารู้สึกท้อแท้"
 iberia_north_africa.0121.desc.negative_piety_level:0 "การกระทำของข้าได้ตีตราข้าว่าเป็นคนบาป ผู้ ซึ่งศรัทธาดูเหมือนจะพอใจที่จะปล่อยให้ตกไปตามทางจิตวิญญาณ และปฏิเสธไม่ได้ว่ามันโดดเดี่ยวเพียงใด"
 iberia_north_africa.0121.desc.lorgar:0 "แม้ว่าไฟแห่งความเชื่อของข้าจะลุกโชติช่วงสว่างไสวดุจดวงอาทิตย์ ข้าก็ไม่อาจสลัดความรู้สึกที่ว่าต้องมีบางสิ่ง #EMP มากกว่า#! ในจักรวาลนี้นอกเหนือจาก [old_faith.HighGodName] ความจริงอันเก่าแก่กว่านั้น"
 iberia_north_africa.0121.desc.sinful_traits:0 "รู้สึกราวกับว่าทุกการกระทำ ทุกความคิด วิถีชีวิตของข้าล้วนถูกตีตราว่าเป็นบาปโดยเนื้อแท้"
 iberia_north_africa.0121.desc.virtuous_basque_pagan_traits:0 "บางครั้งข้าก็สงสัยว่าเคยรักมันได้อย่างไร ในเมื่อบุคลิกทั้งหมดของข้าดูเหมือน #EMP ถูกสร้าง#! มาเพื่อบางสิ่งที่แตกต่างออกไป"
 iberia_north_africa.0121.desc.naked_cynicism:0 "ข้าพบว่ามันไม่น่าสนใจ และที่แย่กว่านั้นคือ ตกอยู่ภายใต้อำนาจที่ข้าแทบไม่มีอำนาจควบคุมเลย"
 iberia_north_africa.0121.desc.outro:0 "\n\nในที่สุด ข้าคิดว่าข้าได้พบความปลอบใจกับ [basque_faith.GetName] แล้ว การผสมผสานความเชื่อในชนบทของนิกายเล็กๆ นี้ไม่มีการตัดสินใดๆ ต่อข้า มีเพียงความตื่นเต้นดีใจกับโอกาสที่จะกลายเป็นมากกว่าผู้รักษานิทานพื้นบ้าน\n\nความตื่นเต้นที่อาจ ทำให้พวกเขาเปิดรับ... ข้อเสนอแนะ"
 iberia_north_africa.0121.a:0 "[basque_faith.GetNameNoTooltip] จะเป็นศรัทธาของนักรบอีกครั้ง!"
 iberia_north_africa.0121.a.tt:0 "ท่านสนับสนุนแนวทาง $doctrine_pluralism_fundamentalist_name$ มากขึ้น"
 iberia_north_africa.0121.b:0 "ความกลมกลืนกับธรรมชาติย่อมดีกว่าความกลมกลืนกับเพื่อนบ้าน"
 iberia_north_africa.0121.b.tt:0 "ท่านสนับสนุนแนวทาง $doctrine_pluralism_righteous_name$ มากขึ้น"
 iberia_north_africa.0121.c:0 "มีศาสนาที่คู่ควรแก่การแบ่งปันประเพณีมากกว่านี้"
 iberia_north_africa.0121.c.tt:0 "ท่านสนับสนุนแนวทาง $doctrine_pluralism_pluralistic_name$ ที่แตกต่างออกไป"
 iberia_north_africa.0121.d:0 "หากข้าพยายามบังคับให้เกิดการเปลี่ยนแปลง ข้าจะทุจริตน้อยกว่า [old_faith.GetNameNoTooltip] หรือไม่?"
 iberia_north_africa.0121.d.tt:0 "ท่านปล่อยให้ศรัทธาเป็นไปตามที่ท่านพบ"

 iberia_north_africa.0122.t:0 "$iberia_north_africa.0121.t$"
 iberia_north_africa.0122.desc.intro:0 "ดูเหมือนว่า [religious_leader.GetTitledFirstNamePossessive]"
 iberia_north_africa.0122.desc.excommunicated:0 "การถูกขับออกจาก [old_faith.GetName] ในที่สุดก็กลายเป็นเรื่องน่าเบื่อหน่ายเกินไปสำหรับ [religious_leader.GetHerHim]"
 iberia_north_africa.0122.desc.rivalry_with_hof:0 "ความเป็นปฏิปักษ์กับ [old_faith.GetReligiousHead.GetTitledFirstName] ในที่สุดก็ถึงจุดเดือดที่หลีกเลี่ยงไม่ได้"
 iberia_north_africa.0122.desc.negative_piety_level:0 "การล่วงละเมิดก่อนหน้านี้ต่อ [old_faith.GetName] กำลังจะถูกบดบังด้วยการกระทำครั้งต่อไปของ [religious_leader.GetHerHis]"
 iberia_north_africa.0122.desc.lorgar:0 "ความปรารถนาในบางสิ่งที่... #EMP เก่าแก่กว่า#! ที่จะเชื่อมั่นได้แข็งแกร่งเกินไป นำ [religious_leader.GetHerHim] ไปสู่เส้นทางแห่งความเชื่อนอกรีต"
 iberia_north_africa.0122.desc.sinful_traits:0 "วิถีทางอันเป็นบาปของ [religious_leader.GetHerHis] ในที่สุดก็ได้ชัยชนะเหนือศรัทธา [old_faith.GetAdjective] ของ [religious_leader.GetHerHis] โดยสิ้นเชิง"
 iberia_north_africa.0122.desc.virtuous_basque_pagan_traits:0 "การถูกล่อลวงอย่างช้าๆ โดยคุณธรรมของชีวิตชนบท ในที่สุดก็เสร็จสมบูรณ์"
 iberia_north_africa.0122.desc.naked_cynicism:0 "ความปรารถนาอย่างโจ่งแจ้งที่จะควบคุมชีวิตทางจิตวิญญาณของอาณาจักรของ [religious_leader.GetHerHis] มากขึ้นนั้นควบคุมไม่ได้โดยสิ้นเชิง"
 iberia_north_africa.0122.desc.midtro:0 "\n\nด้วยความบ้าคลั่งอย่างแน่นอน [religious_leader.GetTitleAsNameNoTooltip|U] ได้ยกย่องศรัทธาพื้นบ้านที่ผสมผสานความเชื่ออันคลุมเครือจากเทือกเขาพิรินี [basque_faith.GetName] ขึ้นเป็นศาสนาชั้นนำใหม่ของ [religious_leader.GetPrimaryTitle.GetNameNoTier]\n\n"
 iberia_north_africa.0122.desc.fundamentalist:0 "แม้เดิมจะสงบสุข [religious_leader.GetTitledFirstNameNoTooltip] ได้ปลุกปั่นนิกายที่เพิ่งก่อตั้งขึ้นให้เกิดความคลั่งไคล้อย่างรุนแรง โดยสัญญากับพวกเขาว่าจะให้ค่าจ้างของนักรบเป็นของปล้นสะดมหากพวกเขาสนับสนุนการรณรงค์แบบมูลฐานนิยมของ [religious_leader.GetHerHis]"
 iberia_north_africa.0122.desc.righteous:0 "เพื่อพยายาม ทำให้นิกายเล็กๆ นี้ห่างเหินจากความสัมพันธ์ใกล้ชิดกับศาสนาคริสต์ [religious_leader.GetTitledFirstNameNoTooltip] กำลังส่งเสริมการกลับไปสู่สิ่งที่ [religious_leader.GetSheHe] มองว่าเป็นส่วนที่นอกรีตอย่างแท้จริงของตำนาน"
 iberia_north_africa.0122.desc.pluralist:0 "แม้ว่านิกายนี้จะใช้เวลาหลายศตวรรษในการซึมซับองค์ประกอบของศาสนาคริสต์ [religious_leader.GetTitledFirstNameNoTooltip] กำลังใช้อิทธิพลอันมหาศาลของ [religious_leader.GetHerHis] เพื่อแนะนำองค์ประกอบที่แข่งขันกันของศาสนาอิสลาม ลบ แทนที่ และปรับปรุงพิธีกรรมของชาวนาซาเร็ธในที่ที่ [religious_leader.GetSheHe] สามารถทำได้"
 iberia_north_africa.0122.desc.unchanged:0 "โดยพื้นฐานแล้วไม่เปลี่ยนแปลงจากความคลุมเครือแม้จะได้รับความสนใจทางเทววิทยาใหม่ๆ นิกายนี้สนับสนุนการผสมผสานระหว่างหลักคำสอนของคริสเตียนที่รับมาและตำนานดั้งเดิมของชาววาสโกเนียน"
 iberia_north_africa.0122.a:0 "รู้ไหม ข้าคิดว่า [religious_leader.GetSheHe] มีเหตุผล..."
 iberia_north_africa.0122.b.same_faith:0 "นี่มันนอกรีตชัดๆ!"
 iberia_north_africa.0122.b.same_religion:0 "สิ่งนี้จะจบลงด้วยการทำลายล้างของพวกเขาเท่านั้น"
 iberia_north_africa.0122.b.respects_fellow_warmongers:0 "อย่างน้อยพวกเขาก็ไม่กลัวการต่อสู้ที่ดี"
 iberia_north_africa.0122.b.misc:0 "ตราบใดที่พวกเขาต่อสู้กันไกลๆ"
 iberia_north_africa.0122.c.same_faith:0 "[religious_leader.GetFirstNameNoTooltip] ละทิ้ง [old_faith.HighGodName] เพื่อป่าละเมาะที่ผุพังหรือ?!"
 iberia_north_africa.0122.c.same_religion:0 "[religious_leader.GetFirstNameNoTooltip] คิดว่า [religious_leader.GetSheHe] #EMP ดีกว่า#! เราหรือ?"
 iberia_north_africa.0122.c.believes_in_harmony_with_nature:0 "อย่างน้อยพวกเขาก็เข้าใจความมหัศจรรย์ของธรรมชาติ"
 iberia_north_africa.0122.c.misc:0 "ถ้า เช่นนั้น พวกเขาพูดแทนต้นไม้หรือ?"
 iberia_north_africa.0122.d.muslim:0 "อย่างน้อย [basque_faith.GetAdherentNamePluralNoTooltip] ก็เข้าใกล้ [islam_religion.GetNameNoTooltip] มากขึ้น"
 iberia_north_africa.0122.d.same_faith:0 "พวกเขาละทิ้งเราถึงสองครั้ง!"
 iberia_north_africa.0122.d.same_religion:0 "น่าขุ่นเคือง!"
 iberia_north_africa.0122.d.syncretised_with_islam:0 "อย่างน้อยพวกเขาก็ไม่ได้ละทิ้งสติปัญญาไปโดยสิ้นเชิง"
 iberia_north_africa.0122.d.misc:0 "เอ่อ ไม่ใช่เทศกาลของข้า ไม่ใช่หมีเต้นรำของข้า"
 iberia_north_africa.0122.e.same_faith:0 "ถ้า เช่นนั้น #EMP นี่#! คือมาตรวัดของความอดทน"
 iberia_north_africa.0122.e.same_religion:0 "น่ากังวล..."
 iberia_north_africa.0122.e.syncretised_with_christianity:0 "$iberia_north_africa.0122.d.syncretised_with_islam$"
 iberia_north_africa.0122.e.misc:0 "ดูเหมือนเป็นการเปลี่ยนแปลงที่ธรรมดามากจริงๆ"

 iberia_north_africa.0131.t:0 "บุตรแห่งเอโบร"
 iberia_north_africa.0131.desc.intro:0 "ด้วยการสร้าง [k_aragon.GetDefinitiveName] ข้าได้กระตุ้นการขยายตัวอย่างรุ่งเรืองของวัฒนธรรม [aragonese_culture.GetName] ในเมืองต่างๆ ของอาณาจักรของข้า ไม่เพียง แต่ในดินแดนใจกลางของเราที่ $d_aragon$ เท่านั้น แต่ยัง รวมถึง"
 iberia_north_africa.0131.desc.duchy.one:0 "[duchy_a.GetBaseNameNoTier]"
 iberia_north_africa.0131.desc.duchy.two:1 "[duchy_a.GetBaseNameNoTier] และ [duchy_b.GetBaseNameNoTier]"
 iberia_north_africa.0131.desc.duchy.three:0 "[duchy_a.GetBaseNameNoTier], [duchy_b.GetBaseNameNoTier], และ [duchy_c.GetBaseNameNoTier]"
 iberia_north_africa.0131.desc.outro:0 "ด้วย เช่นกัน เผยแพร่อิทธิพลของชนชาติที่ข้าเพิ่งค้นพบไปไกลและกว้าง\n\nกระนั้น... ข้าอดไม่ได้ที่จะคิดถึงวิถีทางบางอย่างของ [founder_culture.GetName] เวลาของมันในฐานะศูนย์กลางชีวิตของข้าอาจสิ้นสุดลงแล้ว แต่ด้วยอิทธิพลและตำแหน่งของข้า มันไม่จำเป็นต้องจากไปโดยสิ้นเชิง"
 # We can't use a script value here since we're using a while loop for the count, and they don't _currently_ support scripted values.
 form_the_kingdom_of_aragon_decision.tt.x_random_counties_in_d_aragon:0 "3 [counties|E] สุ่มใน $d_aragon$:"
 iberia_north_africa.0131.a:0 "คนเหล่านี้คือคนของข้า และพวกเขาก็เพียงพอแล้ว"
 iberia_north_africa.0131.b:0 "ไม่ใช่ว่าเครื่องประดับทั้งหมดของวัฒนธรรม [founder_culture.GetNameNoTooltip] จะเลวร้ายนัก..."
 iberia_north_africa.0131.c:0 "สิ่งที่สำคัญอย่างแท้จริงสำหรับเราไม่ได้เปลี่ยนแปลงไป"
 iberia_north_africa.0131.d:0 "ไม่ว่าโลกจะหมุนไปอย่างไร เราไม่อาจลืมรากเหง้าของเราได้!"

 iberia_north_africa.2105.t:0 "ผู้ปกครองแห่งเมดิเตอร์เรเนียน"
 iberia_north_africa.2105.desc:0 "ด้วยการยึดครอง [mallorca.GetNameNoTier], [sardinas.GetNameNoTier] และ [sicily.GetNameNoTier] เราได้ประกาศตนเป็นผู้ปกครองโดยชอบธรรมแห่งทะเลเมดิเตอร์เรเนียน ทูตได้ล่องเรือไปยังทุกมุมโลกและแจ้งให้ผู้ปกครองที่ด้อยกว่าทราบถึงความสำเร็จอันรุ่งโรจน์ของเรา\n\nทะเลนี้ และทุกสิ่งที่สัมผัส เป็นของเรา!"
 iberia_north_africa.2105.a:0 "ไม่มีใครสามารถต่อต้านเราได้!"
 
 iberia_north_africa.fp2_golden_age_generic_title_intro:0 "วิทยาการยุคทอง:"
 iberia_north_africa.2001.t:0 "$iberia_north_africa.fp2_golden_age_generic_title_intro$ ความรู้ที่สูญหาย"
 iberia_north_africa.2001.desc:0 "นักแปลชื่อดัง [generated_actor.GetFullName] ได้มาถึงราชสำนักของข้าหลังจากได้ยินว่าข้ากำลังสนับสนุนวิทยาการ "หากเป็นความรู้ที่ท่านแสวงหา สิ่งที่ดีที่สุดสามารถพบได้ในหนังสือเก่าแก่ เพราะ แม้ว่ามันอาจถูกลืมเลือนไป แต่มันก็ยังคงเป็นจริงไม่น้อย" นักแปลกล่าว\n\n"ข้ามีหนังสือมากมายที่ยังไม่ได้แปล หากท่านสนับสนุนข้า ท่านก็จะได้รับประโยชน์จากมัน เช่นกัน!""
 iberia_north_africa.2001.a:0 "ข้าจะไม่เสียดายค่าใช้จ่ายใดๆ กับ"
 iberia_north_africa.2001.a.learning:0 "ปรัชญา"
 iberia_north_africa.2001.a.martial:0 "การทหาร"
 iberia_north_africa.2001.a.stewardship:0 "เศรษฐกิจ"
 iberia_north_africa.2001.a.diplointrigue:0 "วาทศิลป์"
 iberia_north_africa.2001.a.end:0 "สิ่งพิมพ์"
 iberia_north_africa.2001.a.a:0 "ท่านขอหนังสือเพื่อช่วยพัฒนาทักษะที่ต่ำที่สุดของท่าน"
 iberia_north_africa.2001.b:0 "เจ้าได้รับการสนับสนุนจากข้าแล้ว จงนำสิ่งที่เป็นประโยชน์มา"
 iberia_north_africa.2001.b.a:0 "[generated_actor.GetFirstNameNoTooltip] จะมอบหนังสือพัฒนา [skill|E] แบบสุ่มให้ท่าน"
 iberia_north_africa.2001.c:0 "เหตุใดข้าจึงต้องการหนังสือเก่า? ประวัติศาสตร์ไม่มีที่ยืนในวิทยาศาสตร์!"
 iberia_north_africa.2002.t:0 "$iberia_north_africa.fp2_golden_age_generic_title_intro$ ศัลยแพทย์ผู้มองดาว"
 iberia_north_africa.2002.desc:0 ""ฝ่าบาท โปรด ทำให้คนโง่นี่ฟังด้วย! ศัลยแพทย์ผู้นี้ผ่าตัดต้อกระจกตาขวาของข้า แต่ตอนนี้ปฏิเสธที่จะรักษาตาซ้าย!" [patientzero.GetTitledFirstName] อุทาน "การผ่าตัดสำเร็จได้ก็ เพราะการเรียงตัวของดวงดาวสมบูรณ์แบบ ท่าน #italic ต้อง#! รออีกสิบสองปี เพื่อให้แน่ใจว่าการผ่าตัดจะสำเร็จอีกครั้ง!" แพทย์ผู้หงุดหงิด [generated_actor.GetFirstName] ตอบ\n\nในฐานะผู้ปกครอง เป็นหน้าที่ของข้าที่จะต้องตัดสินเรื่อง เช่นนี้ ข้าควรจะเข้าไปยุ่งเกี่ยวกับโหราศาสตร์และเสี่ยงต่อการผ่าตัดที่ผิดพลาดหรือไม่?"
 iberia_north_africa.2002.a:0 "นี่เป็นโอกาสอันดีที่ [child_offering.GetFirstNameNoTooltip] จะได้เรียนรู้การแพทย์!"
 iberia_north_africa.2002.a.flavor:0 "ท่านเสนอให้บุตรของท่าน [child_offering.GetFirstName] เป็นผู้ช่วยในการผ่าตัดต้อกระจกด้วยวิธีดูดของ [patientzero.GetFirstName]"
 iberia_north_africa.2002.a.a:0 "[child_offering.GetFirstName] ช่วยในการผ่าตัด"
 iberia_north_africa.2002.a.b:0 "ผลการผ่าตัดต้อกระจก"
 iberia_north_africa.2002.b:0 "ดวงดาวไม่มีผลต่อความสามารถของเจ้า จงทำการผ่าตัด!"
 iberia_north_africa.2002.b.a:0 "ท่านสั่งให้ดำเนินการผ่าตัด โดยรู้ถึงความเสี่ยง"
 iberia_north_africa.2002.c:0 "จริงอยู่ อาจเป็นการดีที่สุดที่จะรอจนกว่าสภาวะจะเอื้ออำนวย"
 iberia_north_africa.2002.d:0 "#italic อันที่จริง#! หากท่านมองในแง่ #italic นี้#! ดวงดาวก็อยู่ในตำแหน่งที่เหมาะสมพอดี!"
 iberia_north_africa.2003.t:0 "$iberia_north_africa.fp2_golden_age_generic_title_intro$ ธรรมชาติที่ขัดแย้ง"
 iberia_north_africa.2003.desc:0 "นักปราชญ์มากมายได้มาและผ่านไปใน [playerprovince.GetNameNoTooltip] นับตั้งแต่ให้การสนับสนุน แต่มีสองคนที่โดดเด่นสำหรับข้า บางทีอาจเป็น เพราะพวกเขาทั้งคู่เป็นบุคคลที่มีสติปัญญาล้ำเลิศ บางทีอาจเป็น เพราะพวกเขา #italic ไม่ยอมหุบปาก#! และหยุดโต้เถียงเกี่ยวกับความแตกต่างเล็กน้อยของความเชื่อกลางราชสำนักของข้า "ข้า #italic ปฏิเสธ#! ที่จะทำงานกับคนโง่อย่าง [generated_actor_r.GetFirstName]!" [generated_actor_k.GetFirstName] อุทาน ก่อนที่ [generated_actor_r.GetFirstName] จะตอบกลับว่า "ดีสำหรับข้า ข้าไม่มีทางทำงานกับคนที่ดื้อรั้นอย่าง #italic เจ้า!#!"\n\n"[ROOT.Char.GetTitledFirstName] ท่านเชื่ออย่างไร? เป็นบทบาทของนักปราชญ์ที่จะอธิบายโลกธรรมชาติ หรือตกอยู่ภายใต้อำนาจของศาสดา?""
 iberia_north_africa.2003.a:0 "อันที่จริง มันตกอยู่ภายใต้อำนาจ #ber ของข้า#! บัดนี้ จงไปทำงานเสีย"
 iberia_north_africa.2003.a.flavor:0 "ท่าน ทำให้นักปราชญ์ทั้งสองขุ่นเคือง โดยมุ่งความดูถูกมาที่ท่านแทนที่จะเป็นกันเอง"
 iberia_north_africa.2003.b:0 "แน่นอนว่าเป็นนักปราชญ์ ผู้มีปัญญา เช่นอริสโตเติลควรทำ"
 iberia_north_africa.2003.c:0 "ท่านจะเชื่อนักปราชญ์ได้อย่างไรหากท่านไม่สามารถไว้วางใจเอเสเคียลได้?"
 iberia_north_africa.fp2_pilgrim_roads_generic_title_intro:0 "เส้นทางจาริกแสวงบุญ:"
 iberia_north_africa.2011.t:0 "$iberia_north_africa.fp2_pilgrim_roads_generic_title_intro$ นักรบพเนจร"
 iberia_north_africa.2011.desc:0 "ขณะที่ข้าเดินเตร่ไปใน [chosen_location_for_pilgrim_roads.GetName] ข้าพบต้นไม้ใหญ่ต้นหนึ่งกำลังเชื้อเชิญให้ข้าพักผ่อนอยู่ใต้ร่มเงาอย่างเงียบๆ ข้านั่งลงใต้ร่มเงาอันเย็นสบายข้าง [generated_actor.GetWomanMan] ผู้หนึ่ง "ท่านเป็นผู้จาริกแสวงบุญหรือ?" ข้าถาม"
 iberia_north_africa.2011.desc_merge_into:0 "ซึ่งบุคคลที่กำลังพักผ่อนตอบว่า"
 iberia_north_africa.2011.desc_soldier:0 "$iberia_north_africa.2011.desc_merge_into$ "ข้าเป็นเพียงนักรบผู้หลงผิดนามว่า [generated_actor.GetName] ข้ามาเยี่ยม [chosen_holy_site_for_pilgrim_roads.GetNameNoTier] เพื่อค้นหาว่าเหตุใด [generated_actor.GetFaith.HighGodName] จึงทอดทิ้งข้า และเพื่อรู้ว่าข้าต้องฟาดฟันดาบไปที่ใดต่อไป""
 iberia_north_africa.2011.desc_captain:0 "$iberia_north_africa.2011.desc_merge_into$ "บางที ข้าอาจใช่ แต่ข้ารู้จักตนเองในฐานะวิญญาณที่หลงทางมากกว่า ข้าชื่อ [generated_actor.GetName] อดีตหัวหน้าคณะนักรบศักดิ์สิทธิ์ บัดนี้เป็นคนพเนจรเร่ร่อนเพื่อค้นหา [generated_actor.GetFaith.HighGodName] และอุดมการณ์ที่ยิ่งใหญ่กว่าเพื่อรับใช้""
 iberia_north_africa.2011.a:0 "[generated_actor.GetFaith.HighGodName] คงต้องการให้เจ้าเข้าร่วมกองทัพของข้า [generated_actor.GetFirstNameNoTooltip]"
 iberia_north_africa.2011.b:0 "ข้ามั่นใจว่า [generated_actor.GetFaith.HighGodName] ต้องการให้เจ้าเดินทางต่อไปเพื่อค้นหาศัตรู"
 iberia_north_africa.2011.b.flavor:0 "ท่านสนับสนุนให้นักรบต่อสู้เพื่อ [generated_actor.GetFaith.HighGodName] ต่อไป ด้วยตนเอง เผยแพร่กิตติศัพท์ความดีงามของท่าน"
 iberia_north_africa.2011.c:0 "เจ้าจะพบ [generated_actor.GetFaith.HighGodName] อย่างแน่นอนเมื่อสิ้นสุดการจาริกแสวงบุญของเจ้า"
 iberia_north_africa.2011.c.flavor:0 "ท่านปล่อยให้นักรบปฏิบัติหน้าที่ต่อ [generated_actor.GetFaith.HighGodName] โดยไม่ถูกรบกวน"
 iberia_north_africa.2012.t:0 "$iberia_north_africa.fp2_pilgrim_roads_generic_title_intro$ นักศึกษาผู้ยากไร้"
 iberia_north_africa.2012.desc:0 "ขณะเดินไปตามถนนที่สร้างขึ้นใหม่ของข้าที่ [chosen_location_for_pilgrim_roads.GetName] ข้าพบ [generated_actor.GetWomanMan] หนุ่มสาวคนหนึ่งนั่งอยู่บนหลักหินด้วยใบหน้าเศร้าหมองและถุงเปล่าในมือ [generated_actor.GetWomanMan] หันมาหาข้าและถามว่า "[ROOT.Char.Custom2('RelationToMeAddress', generated_actor)] โปรดเมตตาเหรียญสักอันแก่นักศึกษาที่กำลังจาริกแสวงบุญได้หรือไม่? "
 iberia_north_africa.2012.desc_student:0 "ข้าเป็นนักศึกษาเทววิทยา ปรารถนาที่จะเข้าใจโลกที่ [generated_actor.GetFaith.HighGodName] ประทานแก่เราให้ดีขึ้น ข้ายินดีมอบบันทึกการเดินทางของข้าให้ท่านเพื่อเป็นเครื่องแสดงความขอบคุณในฐานะชาว [generated_actor.GetFaith.GetAdjective] เช่นกัน!""
 iberia_north_africa.2012.desc_architect:0 "ข้าศึกษาสถาปัตยกรรม เดินทางมาไกลเพื่อชมและเรียนรู้จากผลงานที่ได้รับการดูแลอย่างดีที่ [chosen_holy_site_for_pilgrim_roads.GetNameNoTier] ข้าอุทิศตนให้กับงานฝีมือนี้เท่านั้น หากท่านจะเมตตาเหรียญแก่ข้า ข้ายินดีมอบคัมภีร์สถาปัตยกรรมของข้าให้ท่าน!""
 iberia_north_africa.2012.a:0 "ข้าต้องการความรู้นั้น ตกลง ข้ายอมรับการแลกเปลี่ยนนี้"
 iberia_north_africa.2012.b:0 "บางทีเจ้าควรลองหางานทำ"
 iberia_north_africa.2012.b.flavor:0 "ท่านเสนองานที่ดีให้นักศึกษาในราชสำนักของท่าน ทำให้นักศึกษาประหลาดใจ"
 iberia_north_africa.2012.c:0 "ไม่มีการต่อรอง ในฐานะ [ROOT.Char.GetFaith.GetAdherentNameNoTooltip] เป็นหน้าที่ของข้าที่จะต้องช่วยเหลือเจ้า"
 iberia_north_africa.2013.t:0 "แด่ [ROOT.Char.GetSheHe] ผู้ปูทางให้ผู้จาริกแสวงบุญ"
 iberia_north_africa.2013.desc:0 "ท่านได้ทำงานที่เป็นแบบอย่างในการวางรากฐานที่จำเป็นอย่างแท้จริงเพื่ออำนวยความสะดวกในการเข้าถึงสถานที่ศักดิ์สิทธิ์ [chosen_holy_site_for_pilgrim_roads.GetNameNoTierNoTooltip] ด้วยเหตุนี้ ข้าจึงจำเป็นต้องให้รางวัลแก่ท่าน\n\nบอกข้ามา มีสิ่งใดที่ท่านปรารถนาหรือไม่?"
 iberia_north_africa.2013.a:0 "เพียงคำชมของท่านก็เพียงพอแล้ว [fp2_iberia_north_africa_2013_head_of_faith.GetFaith.ReligiousHeadName] ของข้า"
 iberia_north_africa.2013.b:0 "จงเผยแพร่กิตติศัพท์การกระทำของข้าในนามแห่ง [ROOT.Char.GetFaith.HighGodName]"
 iberia_north_africa.2013.c:0 "ขอให้นักรบทุกคนรู้ถึงความทุ่มเทของข้าที่มีต่อ [ROOT.Char.GetFaith.GetNameNoTooltip]"
 iberia_north_africa.2013.d:0 "มอบสิ่งประดิษฐ์ที่คู่ควรแก่การจัดแสดงที่ [chosen_holy_site_for_pilgrim_roads.GetNameNoTierNoTooltip] ให้ข้า"
 iberia_north_africa.2013.d.tooltip:0 "[fp2_iberia_north_africa_2013_head_of_faith.GetTitledFirstName] จะมอบ [artifact|E] อันศักดิ์สิทธิ์ให้ท่าน"
 iberia_north_africa.2013.notif.t:0 "เส้นทางแห่งความศรัทธา"
 struggle_iberia_form_portugal_decision_correct_phase_tt:0 "[struggle_phase|E] ปัจจุบันคือ [struggle_phase_iberia_opportunity|E]"

 iberia_north_africa.2100.t: "วาสโกเนียเก่าแก่ฟื้นคืน"
 iberia_north_africa.2100.desc: "เป็นเวลาหลายศตวรรษ ที่พวกเราชาวบาสก์อดทนต่อความโชคร้ายของเราอย่างไม่ย่อท้อด้วยความทรหดและความมุ่งมั่น ราวกับสกัดมาจากหินพิรินีโบราณ เรายืนหยัดต่อสู้กับการรุกรานนับไม่ถ้วน รอคอยช่วงเวลาที่เหมาะสมที่จะโจมตี\n\nวันอันมืดมนเหล่านั้นผ่านพ้นไปแล้ว และในที่สุดเราก็ประสบความสำเร็จในการยึดคืนดินแดนของบรรพบุรุษของเรา ซึ่งบัดนี้เป็นหัวใจของราชอาณาจักร [GetTitleByKey('k_navarra').GetNameNoTier] ใหม่ที่เป็นอิสระ\n\nหลังจากได้รับบทเรียนที่โหดร้ายที่สุดในประวัติศาสตร์ ข้าขอปฏิญาณว่าเราจะไม่ยอมให้ตนเองถูกขับไล่ออกจากบ้านของเราอีกต่อไป"
 iberia_north_africa.2100.a: "ภายใต้การนำของข้า เราสามารถบรรลุทุกสิ่งได้!"
 iberia_north_africa.2100.b: "เราจะไม่ยอมถูกข่มขู่อีกต่อไป!"
 iberia_north_africa.2101.desc: "ตลอดหลายศตวรรษ ชาวบาสก์ถูกต้อนให้จนมุมเข้าไปในเทือกเขาพิรินีอย่างต่อเนื่อง ถูกรังควานจากผู้รุกรานที่รุกล้ำเข้ามาจาก แต่ละด้าน\n\nบัดนี้ ด้วยส่วนสำคัญของดินแดนบ้านเกิดของบรรพบุรุษของ [founder.GetHerHis] ได้รับการกู้คืน [founder.GetTitledFirstNameRegnal] ได้ประกาศว่า [founder.GetHerselfHimself] คือ "[founder.Custom('QueenKing')] แห่ง [GetTitleByKey('k_navarra').GetNameNoTier]" โดยอ้างว่าดินแดนที่สูญหายเป็นส่วนหนึ่งของอาณาจักรบาสก์ใหม่\n\nชนชาติเพื่อนบ้านมองว่าการเปลี่ยนแปลงโชคชะตานี้เป็นเพียงความผิดปกติในประวัติศาสตร์ของภูมิภาค และแน่นอนว่ากำลังมองหาโอกาสแรกสุดที่จะแก้ไขความพลิกผันนี้..."
 iberia_north_africa.2101.b: "พวกเขาควรจะอยู่ในภูเขา!"
 iberia_north_africa.2101.c: "น่าประหลาดใจอย่างแน่นอน"
