 #Spread Theravada Faith
 spread_theravada_faith_decision:0 "เผยแผ่ศรัทธา [ROOT.Char.GetFaith.GetNameNoTooltip]"
 spread_theravada_faith_decision_desc:0 "ศรัทธา [ROOT.Char.GetFaith.GetName] กำลังเสื่อมถอย และบัดนี้เป็นหน้าที่ของข้าที่จะต้องรับประกันความอยู่รอดต่อไป ขั้นตอนแรกบนเส้นทางนั้นคือการหาวิธีที่ดีที่สุดในการเชื่อมความแตกต่างทางศาสนาในหุบเขาอิรวดี"
 spread_theravada_faith_decision_tooltip:0 "ตัดสินใจเกี่ยวกับวิธีจัดการกับความขัดแย้งทางศาสนา"
 spread_theravada_faith_decision_confirm:0 "ปรึกษา [ROOT.Char.GetFaith.PriestNeuter|U]"
 spread_theravada_faith_decision_cus_tt:0 "ท่านครุ่นคิดถึงวิธีที่ดีที่สุดในการชักจูงประชาราษฎร์..."
