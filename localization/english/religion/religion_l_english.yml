 doctrine_deviancy_accepted_desc:0 "ความรักนั้นสวยงามและศักดิ์สิทธิ์ ไม่ว่าจะเป็นรูปแบบใดก็ตาม ทุกคนควรได้รับอนุญาตให้รักและทำตามใจปรารถนา"
