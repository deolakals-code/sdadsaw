 doctrine_deviancy_virtuous_desc:0 "ความสุขทางเนื้อหนังนำเราเข้าใกล้พระเจ้ามากขึ้น ดังนั้นผู้ที่ไม่ถูกพันธนาการด้วยความปรารถนาตามแบบแผนจึงเป็นจุดสูงสุดของคุณธรรมในศรัทธาของเรา"
