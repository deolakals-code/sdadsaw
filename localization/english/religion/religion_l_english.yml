 doctrine_parameter_kinslaying_shunned:0 "[kinslayers|E] ถือเป็น [shunned|E]"
 doctrine_parameter_kinslaying_accepted:0 "ตัวละครที่สังหารญาติไม่ถูกมองว่าเป็น [kinslayers|E]"
 doctrine_kinslaying_extended_family_crime_name:0 "การสังหารสมาชิกครอบครัวถือเป็นอาชญากรรม"
 doctrine_kinslaying_extended_family_crime_desc:0 "การฆาตกรรมคนในครอบครัวของตนเองเป็นหนึ่งในอาชญากรรมที่น่ารังเกียจที่สุดที่คนๆ หนึ่งสามารถกระทำได้ ใครก็ตามที่ทำ เช่นนั้นจะถูกลงโทษอย่างรุนแรง"
 doctrine_kinslaying_close_kin_crime_name:0 "การสังหารญาติสนิทถือเป็นอาชญากรรม"
 doctrine_kinslaying_close_kin_crime_desc:0 "การฆ่าพี่น้องและการกระทำ เช่นนั้นไม่สามารถยอมรับได้ในสังคมที่ยุติธรรมและชอบธรรม ผู้ที่กระทำความผิดดังกล่าวจะถูกลงโทษ"
 doctrine_kinslaying_shunned_name:0 "น่ารังเกียจ"
 doctrine_kinslaying_shunned_desc:0 "แม้ว่าการฆาตกรรมญาติของตนเองจะเป็นเรื่องน่าตกใจ แต่การกระทำดังกล่าวไม่ได้เป็นอาชญากรรมโดยเนื้อแท้มากกว่าการฆาตกรรมอื่นๆ"
 doctrine_kinslaying_accepted_name:0 "ยอมรับได้"
 doctrine_kinslaying_accepted_desc:0 "การฆาตกรรมคนในครอบครัวของตนเองไม่แตกต่างจากการฆาตกรรมอื่นๆ และจะได้รับการปฏิบัติในลักษณะเดียวกัน"
 kinslayer_crime_dynasty:0 "ผู้สังหารญาติ"
 
 doctrine_consanguinity_name:0 "การสมรสในหมู่ญาติ"
 doctrine_consanguinity_dynastic_name: "ข้อห้ามตามสายสกุล"
 doctrine_consanguinity_dynastic_desc: "เป็นที่ต้องห้ามอย่างเคร่งครัดในการสมรสกับผู้ที่ใช้แซ่เดียวกันและมีบรรพบุรุษร่วมกัน, ไม่ว่าจะห่างไกลกันเพียงใดก็ตาม, และไม่เป็นที่ยอมรับในการสมรสกับผู้ที่ใช้แซ่อื่น แต่มีความสัมพันธ์ใกล้ชิดทางสายเลือด"
 doctrine_consanguinity_restricted_name:0 "ข้อห้ามสมรสในหมู่ญาติสนิท"
 doctrine_consanguinity_restricted_desc:0 "เป็นการบาปต่อ [ROOT.Faith.HighGodName] ที่จะอนุญาตให้ญาติสองคน แต่งงานกันหรือมีความสัมพันธ์ทางเพศ"
 doctrine_parameter_consanguinity_restricted_marriage:0 "ห้ามการสมรสระหว่าง [extended_family_members|E] และ/หรือ [close_family_members|E]"
 doctrine_parameter_consanguinity_restricted_close_kin_incest:0 "ความสัมพันธ์ทางเพศระหว่าง [extended_family_members|E] และ/หรือ [close_family_members|E] จะให้ [secret|E] การสมสู่ในหมู่ญาติสนิท"
 doctrine_consanguinity_cousins_name:0 "การสมรสระหว่างลูกพี่ลูกน้อง"
 doctrine_consanguinity_cousins_desc:0 "ลูกพี่ลูกน้องอาจมีความสัมพันธ์กัน แต่ห่างกันพอที่จะยอมรับให้พวกเขา แต่งงานกันเพื่อรักษาเชื้อสายของพวกเขา"
 doctrine_parameter_consanguinity_cousins_marriage:0 "อนุญาตให้สมรสระหว่างลูกพี่ลูกน้อง"
 doctrine_parameter_consanguinity_cousins_incest:0 "ความสัมพันธ์ทางเพศระหว่างลูกพี่ลูกน้องจะไม่ให้ [secret|E] การสมสู่ในหมู่ญาติสนิท"
 doctrine_consanguinity_aunt_nephew_and_uncle_niece_name:0 "การสมรสระหว่างป้า/หลานชาย และลุง/หลานสาว"
 doctrine_consanguinity_aunt_nephew_and_uncle_niece_desc:0 "ตราบใดที่พวกเขาไม่ได้มีความสัมพันธ์กันโดยตรง สมาชิกในครอบครัวได้รับอนุญาตให้ แต่งงานกันเพื่อประโยชน์ของราชวงศ์"
 doctrine_parameter_consanguinity_aunt_nephew_and_uncle_niece_marriage:0 "อนุญาตให้สมรสระหว่างลูกพี่ลูกน้อง, ป้า/หลานชาย และลุง/หลานสาว"
 doctrine_parameter_consanguinity_aunt_nephew_and_uncle_niece_incest:0 "ความสัมพันธ์ทางเพศระหว่างลูกพี่ลูกน้อง, ป้า/หลานชาย และลุง/หลานสาวจะไม่ให้ [secret|E] การสมสู่ในหมู่ญาติสนิท"
 doctrine_consanguinity_unrestricted_name:0 "การสมรสโดยไม่มีข้อจำกัด"
 doctrine_consanguinity_unrestricted_desc:0 "เป็นเรื่องธรรมชาติและดีต่อสุขภาพที่สมาชิกในครอบครัวจะรักกัน และผู้ที่กล่าวว่าความรักควรจำกัดอยู่แค่ความสัมพันธ์ที่ไม่ใช่ทางเพศนั้นเป็นคนโง่"
 doctrine_parameter_consanguinity_unrestricted_marriage:0 "อนุญาตให้สมรสระหว่างสมาชิกในครอบครัวทุกคน"
 doctrine_parameter_consanguinity_unrestricted_incest:0 "ความสัมพันธ์ทางเพศระหว่างสมาชิกในครอบครัวใดๆ จะไม่ให้ [secret|E] การสมสู่ในหมู่ญาติสนิท"
 doctrine_parameter_consanguinity_restricted_dynastic_marriage: "การสมรสระหว่างสมาชิกใน [dynasty|E] เดียวกันเป็นสิ่งต้องห้าม"
