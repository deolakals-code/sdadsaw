 doctrine_funeral_name: "ธรรมเนียมพิธีศพ"
 doctrine_funeral_stoic_name: "การฝังศพแบบสโตอิก"
 doctrine_funeral_stoic_desc: "ร่างกายได้ตายไปแล้ว แต่จิตวิญญาณยังคงอยู่ ความตายไม่ใช่เวลาสำหรับความโศกเศร้าและการคร่ำครวญ แต่พิธีศพคือการให้เกียรติผู้ตายโดยการมอบร่างกายของพวกเขาให้กับผืนดินในพิธีที่เงียบสงบและถ่อมตน"
 doctrine_funeral_bewailment_name: "การฝังศพพร้อมการคร่ำครวญ"
 doctrine_funeral_bewailment_desc: "จิตวิญญาณได้เริ่มต้นการเดินทางอันยาวนานสู่ [ROOT.Faith.PositiveAfterLife] และเราจะไม่มีวันได้เห็นพวกเขาอีกในโลกของคนเป็น เป็นสิ่งสำคัญที่ทุกคนที่รู้จักผู้ตายจะต้องรวมตัวกันและแสดงความโศกเศร้าในการแสดงความคร่ำครวญต่อสาธารณะ สิ่งนี้ทั้งให้เกียรติผู้ตายและชำระล้างจิตวิญญาณของเราจากความโศกเศร้าที่เกิดจากการจากไปของพวกเขา"
 doctrine_funeral_cremation_name: "การเผาศพ"
 doctrine_funeral_cremation_desc: "เรามาจากเถ้าถ่าน เรากลับสู่เถ้าถ่าน ร่างกายของผู้ตายของเราถูกกำจัดในกองฟอนขนาดใหญ่ และเถ้าถ่านที่ได้จะถูกโปรยไปทั่วผืนดินเพื่อสานต่อการเดินทางของผู้ตาย"
 doctrine_funeral_sky_burial_name: "$tenet_sky_burials_name$"
 doctrine_funeral_sky_burial_desc: "$tenet_sky_burials_desc$"
 doctrine_funeral_mummification_name: "การทำมัมมี่"
 mummification_funeral_name: "การทำมัมมี่"
 doctrine_funeral_mummification_desc: "ร่างกายได้หยุดทำงานแล้ว แต่มันยังคงเป็นภาชนะที่วิญญาณจะใช้เดินทางไปยัง [ROOT.Faith.PositiveAfterLife] ดังนั้น รูปแบบทางกายภาพจึงต้องคงที่เหมือนกับจิตวิญญาณ รอคอยการตัดสินของ [ROOT.Faith.FateGodName]"
 doctrine_family_rites_name: "พิธีกรรมครอบครัว"
 doctrine_family_rites_desc: "ความตายคือช่วงเวลาแห่งการไว้ทุกข์และพิธีกรรมสำหรับผู้ที่ยังมีชีวิตอยู่ ลำดับชั้นและอาวุโสมีความสำคัญในความตาย เช่นเดียวกับในชีวิต; เป็นสิ่งสำคัญที่จะต้องเคารพบูชาผู้อาวุโสกว่าแม้หลังจากที่พวกเขาจากไปแล้ว, และต้องแสดงความเคารพบูชาในลักษณะที่ถูกต้อง"
 doctrine_parameter_burial_funeral: ""
