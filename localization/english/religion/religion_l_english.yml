 doctrine_polytheist_name: "พหุเทวนิยม"
 doctrine_polytheist_desc: "จักรวาลเต็มไปด้วยเทพเจ้าและดวงวิญญาณอันทรงพลัง อาจมีชุดของเทพเจ้าที่จัดตั้งขึ้นในวิมานอย่างชัดเจน, แต่ก็อาจเป็นไปได้ว่าโลกแห่งวิญญาณนั้นมีมากมายนับไม่ถ้วน, แทรกซึมอยู่ทั่วทุกสิ่งรอบตัวเรา, และอาจไม่มีแม้กระทั่งเทพเจ้าที่มีชื่อเรียกขาน"

