 doctrine_kinslaying_any_dynasty_member_crime_desc:0 "ญาติทุกคนผูกพันกันด้วยสายเลือด และการสังหารแม้ แต่ญาติห่างๆ ก็ถือเป็นอาชญากรรมร้ายแรงต่อราชวงศ์ทั้งหมด การล่วงละเมิดดังกล่าวจะไม่ถูกลืม"
