 doctrine_parameter_adultery_male_accepted:1 "บุรุษที่มีลักษณะนิสัย [GetTrait('adulterer').GetName( GetNullCharacter )] หรือ [GetTrait('fornicator').GetName( GetNullCharacter )] [trait|E] ได้รับการยอมรับอย่างเต็มที่"
 
 doctrine_adultery_women_name:0 "การผิดประเวณีของหญิง"
 doctrine_adultery_women_crime_name:0 "อาชญากรรม"
 doctrine_adultery_women_crime_desc:0 "เป็นอาชญากรรมสำหรับสตรีที่จะมีเพศสัมพันธ์นอกสมรส และพวกเธอจะต้องถูกลงโทษตามนั้น"
 doctrine_adultery_women_shunned_name:0 "น่ารังเกียจ"
 doctrine_adultery_women_shunned_desc:0 "เป็นบาปสำหรับสตรีที่จะมีเพศสัมพันธ์นอกสมรส แต่ เช่นเดียวกับบาปทั้งหมด พระเจ้าคือผู้ที่จะต้องตัดสินพวกเธอสำหรับความล้มเหลวของพวกเธอ"
 doctrine_adultery_women_accepted_name:0 "ยอมรับได้"
 doctrine_adultery_women_accepted_desc:0 "ไม่มีอะไรผิดโดยเนื้อแท้เกี่ยวกับการที่สตรีตัดสินใจที่จะมีเพศสัมพันธ์นอกสมรส ดังนั้นการตัดสินใจจึงเป็นของเธอ แต่เพียงผู้เดียว"
 doctrine_parameter_adultery_female_crime:1 "สตรีที่มีลักษณะนิสัย [GetTrait('adulterer').GetName( GetNullCharacter )] หรือ [GetTrait('fornicator').GetName( GetNullCharacter )] [trait|E] ถือเป็น [criminals|E]"
