 global_religion.1000.t: "[local_character.GetFaith.GetAdherentNamePluralNoTooltip] ผู้ลี้ภัย"
 global_religion.1000.desc_same_faith_counties: "[local_character.GetFaith.GetAdherentNamePlural] กว่า [local_character.MakeScope.Var( 'loc_number' ).GetValue|0] คน, ที่ลี้ภัยมาจาก [target_faith_associated_county.GetName], ปรารถนาที่จะเข้ามาในอาณาจักรของข้า ผู้นำของพวกเขา, [local_character.GetFirstName], ขอเข้าเฝ้า: "พวกเรากำลังมองหาชีวิตที่ดีกว่าและปลอดภัยกว่า, [ROOT.Char.GetTitleAsNameNoTooltip]," [local_character.GetSheHe] กล่าว "โปรดให้พวกเราตั้งถิ่นฐานทั่ว [ROOT.Char.GetPrimaryTitle.GetDefinitiveName] เถิด""
 global_religion.1000.desc_same_faith_counties_alt: "การข่มเหงทางศาสนากำลังแพร่ระบาดใน [target_faith_associated_county.GetName], ที่ ซึ่งขุนนาง [target_faith_associated_county_faith.GetAdjective] กำลังบังคับให้ [local_character.GetFaith.GetAdherentNamePlural] เปลี่ยนศาสนา\n\nบัดนี้, ผู้ลี้ภัยกว่า [local_character.MakeScope.Var( 'loc_number' ).GetValue|0] คน ปรารถนาที่จะเข้ามาในอาณาจักรของข้า ผู้นำของพวกเขา, [local_character.GetFirstName], ขอเข้าเฝ้า: "พวกเรากำลังมองหาชีวิตที่ดีกว่าและปลอดภัยกว่า, [ROOT.Char.GetTitleAsNameNoTooltip]," [local_character.GetSheHe] กล่าว "โปรดให้พวกเราตั้งถิ่นฐานทั่ว [ROOT.Char.GetPrimaryTitle.GetDefinitiveName] เถิด""
 global_religion.1000.desc_any_counties: "การข่มเหงทางศาสนากำลังแพร่ระบาดใน [target_faith_associated_county.GetName], ที่ ซึ่งขุนนาง [target_faith_associated_county_faith.GetAdjective] กำลังบังคับให้ [local_character.GetFaith.GetAdherentNamePlural] เปลี่ยนศาสนา\n\nบัดนี้, ผู้ลี้ภัยกว่า [local_character.MakeScope.Var( 'loc_number' ).GetValue|0] คน ปรารถนาที่จะเข้ามาในอาณาจักรของข้า ผู้นำของพวกเขา, [local_character.GetFirstName], ขอเข้าเฝ้า: "พวกเรากำลังมองหาชีวิตที่ดีกว่าและปลอดภัยกว่า, [ROOT.Char.GetTitleAsNameNoTooltip]," [local_character.GetSheHe] อ้อนวอน "โปรดให้พวกเราตั้งถิ่นฐานรอบ [initial_county_target.GetNameNoTier] เถิด"\n\nหากข้าอนุญาต, ศรัทธา [local_character.GetFaith.GetAdjective] จะแพร่กระจายไปทั่ว [ROOT.Char.GetPrimaryTitle.GetDefinitiveName]"
