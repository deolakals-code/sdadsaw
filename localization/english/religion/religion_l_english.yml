 adoptionist_school_name:0 "หลักความเชื่อบุตรบุญธรรม"
 special_doctrine_adoptionist_school_elipandic_doctrine_name:0 "สำนักเอลิปันดิก"
 special_doctrine_adoptionist_school_elipandic_doctrine_desc:0 "โดยเน้นที่ความแตกต่างเล็กน้อยในคริสตวิทยา รูปแบบเอลิปันดิกของ $adoptionist$ เน้นความสำคัญของความแตกต่างที่ #EMP แม่นยำ#! จากหลักความเชื่อตรีเอกานุภาพ ความแตกต่างที่ซับซ้อน ซึ่งทำได้ดีถือว่าดีกว่าคำอธิบายง่ายๆ ที่ให้เหตุผลไม่ดีอย่างไม่มีที่สิ้นสุด"
