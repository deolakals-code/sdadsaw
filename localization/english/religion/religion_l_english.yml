 doctrine_witchcraft_crime_desc:0 "มีเพียงพระเจ้าเท่านั้นที่มีสิทธิ์กระทำปาฏิหาริย์บนโลกนี้ ผู้ใดก็ตามที่พยายามกระทำการดูหมิ่น เช่นนั้นจะต้องถูกลงโทษสำหรับความโอหังและความเย่อหยิ่งของพวกเขา"
 doctrine_witchcraft_shunned_name:0 "น่ารังเกียจ"
 doctrine_witchcraft_shunned_desc:0 "พระเจ้ามีอำนาจโดยชอบธรรมเหนือพลังเหนือธรรมชาติในโลกนี้ ดังนั้นความพยายามใดๆ ที่จะบีบบังคับพลังเหล่านั้นให้เชื่อฟังเจตจำนงของมนุษย์จึงเป็นสิ่งที่ผิดโดยเนื้อแท้"
 doctrine_witchcraft_accepted_name:0 "ยอมรับได้"
 doctrine_witchcraft_accepted_desc:0 "เวทมนตร์เติมเต็มโลกรอบตัวเรา และเป็นสิทธิ์และเอกสิทธิ์ของเราที่จะมีส่วนร่วมกับมันเหมือนที่บรรพบุรุษของเราทำ"
 doctrine_witchcraft_virtuous_name:0 "คุณธรรม"
 doctrine_witchcraft_virtuous_desc:0 "การฝึกฝนเวทมนตร์คือการนำจิตวิญญาณของตนเองไปสู่อันตรายจากวิญญาณชั่วร้าย สำหรับความกล้าหาญของพวกเขาในแง่มุมที่จำเป็นนี้ในการรักษาจิตวิญญาณของเราให้สะอาด แม่มดจึงควรได้รับการเคารพนับถือ"
 doctrine_parameter_witchcraft_illegal:0 "ตัวละครที่มีลักษณะนิสัย [GetTrait('witch').GetName( GetPlayer )] [trait|E] ถือเป็น [criminals|E]"
 doctrine_parameter_witchcraft_shunned:0 "ตัวละครที่มีลักษณะนิสัย [GetTrait('witch').GetName( GetPlayer )] [trait|E] ถือเป็น [shunned|E]"
 doctrine_parameter_witchcraft_accepted:0 "ตัวละครที่มีลักษณะนิสัย [GetTrait('witch').GetName( GetPlayer )] [trait|E] ได้รับการยอมรับอย่างเต็มที่"
 witchcraft_illegal_name:0 "หลักคำสอนเวทมนตร์อาชญากรรม"
 witchcraft_shunned_name:0 "หลักคำสอนเวทมนตร์น่ารังเกียจ"
 
 doctrine_head_of_faith_name:0 "ประมุขแห่งศรัทธา"
 doctrine_head_of_faith_desc:0 "[head_of_faith|E] คือผู้นำของ [faith|E]"
 doctrine_no_head_name:0 "ไม่มี"
 doctrine_no_head_desc:0 "เป็นการโง่เขลาอย่างยิ่งที่จะสันนิษฐานว่าบุคคลใดบุคคลหนึ่งสามารถเข้าใจพระประสงค์ของ [ROOT.Faith.HighGodName] ได้อย่างแท้จริง เราต้องทำตามหัวใจของเราเองเพื่อค้นหาว่าแผนการของ [ROOT.Faith.HighGodHerHis] สำหรับเราคืออะไร"
 doctrine_parameter_no_head_of_faith:0 "ไม่มี [head_of_faith|E]"
 no_head_of_faith_name: "ไม่มี [doctrine|E] [head_of_faith|E]"
 doctrine_parameter_minimum_fervor:0 "ความศรัทธาแรงกล้าไม่สามารถต่ำกว่า #V $VALUE|0$%#!"
 doctrine_spiritual_head_name:0 "ทางจิตวิญญาณ"
 doctrine_spiritual_head_desc:0 "โลกแห่งวัตถุและโลกแห่งจิตวิญญาณนั้นมิเหมือนกัน เราต้องแน่ใจว่าโลกแห่งจิตวิญญาณมีผู้นำของตนเอง เพื่อชี้นำเราและเพื่อปกป้องศรัทธาของเรามิให้แปดเปื้อนด้วยความปรารถนาทางโลก"
 doctrine_parameter_spiritual_head_of_faith:0 "ตำแหน่ง [head_of_faith|E] มอบให้กับสมาชิกคณะสงฆ์ที่โดดเด่น"
 doctrine_parameter_spiritual_head_of_faith_claims:0 "[head_of_faith|E] สามารถให้ [claims|E] ในบรรดาศักดิ์ที่ดินแก่ผู้นับถือที่ศรัทธา"
 doctrine_parameter_spiritual_head_of_faith_gold:0 "[head_of_faith|E] สามารถให้ [gold|E] แก่ผู้นับถือที่ศรัทธา"
 doctrine_temporal_head_name:0 "ทางโลก"
 doctrine_parameter_temporal_head_of_faith:0 "ตำแหน่ง [head_of_faith|E] มอบให้กับผู้ก่อตั้ง [faith|E] และส่งต่อไปยัง [primary_heir|E] ของพวกเขาเมื่อพวกเขาเสียชีวิต"
 doctrine_parameter_temporal_head_of_faith_directed_holy_wars:1 "หากศรัทธามี [great_holy_wars|E] ประมุขแห่งศรัทธาจะได้รับอนุญาตให้ชี้นำสงครามและเลือกเป้าหมายของสงคราม"
 doctrine_temporal_head_desc:0 "จิตวิญญาณและกายภาพผูกพันกันโดยเนื้อแท้ เป็นหนึ่งเดียวและแยกออกจากกันไม่ได้ เป็นการโง่เขลาที่จะมีผู้นำสองคนสำหรับอาณาจักรเดียว"
 
 doctrine_marriage_type_name:0 "ประเภทการสมรส"
 doctrine_monogamy_name:0 "ผัวเดียวเมียเดียว"
 doctrine_monogamy_desc:0 "การสมรสเป็นพันธะศักดิ์สิทธิ์ระหว่างบุคคลสองคน การพยายามสร้างพันธะดังกล่าวกับหลายคนพร้อมกันถือเป็นการลบหลู่"
 doctrine_polygamy_name:0 "มีคู่ครองหลายคน"
 doctrine_polygamy_desc:0 "เนื่องจากการสมรสเป็นการรวมกันอันศักดิ์สิทธิ์ การมีคู่ครองหลายคนจึงศักดิ์สิทธิ์กว่าการมีคู่ครองเพียงคนเดียวอย่างชัดเจน ตราบใดที่การสมรส แต่ละครั้งศักดิ์สิทธิ์ในตัวเอง"
 doctrine_concubines_name:1 "อนุภรรยา"
 doctrine_concubines_desc:1 "การสมรสเป็นพันธะศักดิ์สิทธิ์ แต่ตราบใดที่คู่สมรสของตนมีความสำคัญเป็นอันดับแรก ก็อาจได้รับอนุญาตให้มีอนุภรรยาเพื่อมีปฏิสัมพันธ์ด้วย เช่นกัน"
 
 hostility_group_name:0 "กลุ่มความเป็นปรปักษ์"
 abrahamic_hostility_doctrine_name:0 "อับราฮัม"
 abrahamic_hostility_doctrine_desc:0 "ศาสนาต่อไปนี้เป็นศาสนาอับราฮัม:\n[GetReligionFamily('rf_abrahamic').GetReligions]"
 pagan_hostility_doctrine_name:0 "เพแกน"
 pagan_hostility_doctrine_desc:0 "ศาสนาต่อไปนี้เป็นศาสนาเพแกน:\n[GetReligionFamily('rf_pagan').GetReligions]"
 eastern_hostility_doctrine_name:0 "ตะวันออก"
 eastern_hostility_doctrine_desc:0 "ศาสนาต่อไปนี้เป็นศาสนาตะวันออก:\n[GetReligionFamily('rf_eastern').GetReligions]"
 sinitic_hostility_doctrine_name: "ไซนิติก"
 sinitic_hostility_doctrine_desc: "ศาสนาต่อไปนี้เป็นศาสนาในกลุ่มไซนิติก:\n[GetReligionFamily('rf_eastern').GetReligions]"
 
 special_tolerance_name:0 "การยอมรับพิเศษ"
 special_doctrine_ecumenical_christian_name:0 "เอกภาพคริสตจักร"
 special_doctrine_ecumenical_christian_desc:0 "ผู้นำทางศาสนาของเรามีส่วนร่วมในการเสวนาระหว่างศรัทธาในอดีตเพื่อเพิ่มความร่วมมือระหว่างนิกายคริสเตียนต่างๆ"

 special_doctrine_full_tolerance_name:0 "การยอมรับอย่างเต็มที่"
 full_tolerance_name:0 "$special_doctrine_full_tolerance_name$"
 doctrine_parameter_hostility_override_special_doctrine_full_tolerance:1 "[faiths|E] ทั้งหมดถือว่าเป็น [GetHostilityLevelName( TOKEN_PARAMETER.GetIntValue )|V]"
 special_doctrine_full_tolerance_desc:0 "ทุกคนมีอิสระที่จะเลือกศรัทธาของตนเอง ความแตกต่างของเราไม่ได้แบ่งแยกเรา แต่ ทำให้เราแข็งแกร่งขึ้น"
 
 nudity_doctrine_name:0 "มุมมองต่อการเปลือยกาย"
 special_doctrine_naked_priests_name:0 "นักบวชเปลือยกาย"
 special_doctrine_naked_priests_desc:0 "นักบวชของเรารู้ว่าเสื้อผ้ากักขังจิตวิญญาณและขัดขวางไม่ให้เราบรรลุการรู้แจ้งที่แท้จริง เพียงแค่การสลัดเสื้อผ้าของเราออกไปเท่านั้นที่เราจะสามารถปลุกจิตวิญญาณของเราและสัมผัสกับความรักของ [ROOT.Faith.HighGodNamePossessive]"
 doctrine_parameter_naked_priests_active:0 "นักบวชและตัวละครที่เคร่งศาสนาไม่สวมเสื้อผ้า"

 doctrine_gender_name:0 "มุมมองต่อเพศ"
 doctrine_gender_male_dominated_name:0 "ชายเป็นใหญ่"
 doctrine_gender_male_dominated_desc:0 "บุรุษแข็งแกร่งกว่าและมีความพร้อมที่ดีกว่าในการนำเราในโลกที่โหดร้ายและไม่ปรานีนี้ ดังนั้นเราจะมอบหมายให้พวกเขาปกครองสังคมของเรา"
 doctrine_gender_equal_name:0 "เท่าเทียม"
 doctrine_gender_equal_desc:0 "เป็นการโง่เขลาที่จะปฏิเสธบทบาทในรัฐบาลแก่ผู้มีทักษะเพียง เพราะเพศของพวกเขา เราจะอนุญาตให้ทุกคนที่มีความสามารถปกครองสังคมของเรา"
 doctrine_gender_female_dominated_name:0 "หญิงเป็นใหญ่"
 doctrine_gender_female_dominated_desc:0 "สตรีได้พิสูจน์ครั้งแล้วครั้งเล่าว่ามีเพียงพวกเธอเท่านั้นที่มีปัญญาและความรอบคอบที่จำเป็นในการปกครองสังคมของเราอย่างเหมาะสม"
 
 doctrine_divorce_name:0 "การหย่าร้าง"
 doctrine_divorce_disallowed_name:0 "ไม่อนุญาต"
 doctrine_divorce_disallowed_desc:0 "คำสาบานในการสมรสถือเป็นที่สิ้นสุดและมีผลผูกพัน มีเพียงความตายเท่านั้นที่จะพรากเราจากกันได้"
 doctrine_divorce_approval_name:0 "ต้องได้รับการอนุมัติ"
 doctrine_divorce_approval_desc:0 "แม้ว่าพันธะแห่งการสมรสไม่ควรถูกมองข้าม แต่สถานการณ์ที่บรรเทาโทษได้บางครั้งอาจ ทำให้การหย่าร้างเป็นสิ่งจำเป็น"
 doctrine_divorce_allowed_name:0 "อนุญาตเสมอ"
 doctrine_divorce_allowed_desc:0 "การสมรสเป็นเพียงความร่วมมือระหว่างคนสองคน และ เช่นเดียวกับความร่วมมือทั้งหมด สามารถสิ้นสุดได้ตามต้องการ"
 doctrine_parameter_divorce_disallowed:0 "ตัวละครไม่ได้รับอนุญาตให้ [divorce|E] [spouse|E] ของตน"
 doctrine_parameter_divorce_approval:0 "ตัวละครได้รับอนุญาตให้ [divorce|E] [spouse|E] ของตนหาก [head_of_faith|E] ทางจิตวิญญาณของพวกเขาอนุมัติ (หรือ [house_head|E] หากไม่มีประมุขแห่งศรัทธาทางจิตวิญญาณ)"
 doctrine_parameter_divorce_allowed:1 "ตัวละครได้รับอนุญาตให้ [divorce|E] [spouse|E] ของตนเสมอโดยใช้ [piety|E]"
 
 doctrine_bastardry_name:0 "การเป็นลูกนอกสมรส"
 doctrine_bastardry_none_name:0 "ไม่มีลูกนอกสมรส"
 doctrine_bastardry_none_desc:0 "สายเลือดกำหนดเชื้อสาย ไม่ใช่การสมรส เด็กที่เกิดนอกสมรสก็ชอบธรรม เช่นเดียวกับคนอื่นๆ"
 doctrine_bastardry_legitimization_name:0 "การ ทำให้ชอบธรรม"
 doctrine_bastardry_legitimization_desc:0 "การสมรสเป็นสิ่งศักดิ์สิทธิ์ ดังนั้นเด็กที่เกิดนอกสมรสจะต้องได้รับพรในทางอื่นหากจะถือว่าชอบธรรม"
 doctrine_bastardry_all_name:0 "ไม่มีการ ทำให้ชอบธรรม"
 doctrine_bastardry_all_desc:0 "พันธะแห่งการสมรสเป็นสิ่งศักดิ์สิทธิ์ และเด็กที่เกิดนอกสมรสจะไม่มีวันชอบธรรม"
 doctrine_parameter_bastards_none:0 "ไม่มีสิ่งที่เรียกว่า [bastard|E] เด็กทุกคน [legitimate|E] เท่าเทียมกัน"
 doctrine_parameter_bastards_legitimize:0 "[bastards|E] สามารถ ทำให้ชอบธรรมได้หาก [house_head|E] หรือ [dynast|E] ของพวกเขาอนุมัติ"
 doctrine_parameter_bastards_always:0 "[bastards|E] ไม่สามารถ ทำให้ชอบธรรมได้"
 
 doctrine_adultery_men_name:0 "การผิดประเวณีของชาย"
 doctrine_adultery_men_crime_name:0 "อาชญากรรม"
 doctrine_adultery_men_crime_desc:0 "เป็นอาชญากรรมสำหรับบุรุษที่จะมีเพศสัมพันธ์นอกสมรส และพวกเขาจะต้องถูกลงโทษตามนั้น"
 doctrine_adultery_men_shunned_name:0 "น่ารังเกียจ"
 doctrine_adultery_men_shunned_desc:0 "เป็นบาปสำหรับบุรุษที่จะมีเพศสัมพันธ์นอกสมรส แต่ เช่นเดียวกับบาปทั้งหมด พระเจ้าคือผู้ที่จะต้องตัดสินพวกเขาสำหรับความล้มเหลวของพวกเขา"
 doctrine_adultery_men_accepted_name:0 "ยอมรับได้"
 doctrine_adultery_men_accepted_desc:0 "ไม่มีอะไรผิดโดยเนื้อแท้เกี่ยวกับการที่บุรุษตัดสินใจที่จะมีเพศสัมพันธ์นอกสมรส ดังนั้นการตัดสินใจจึงเป็นของเขา แต่เพียงผู้เดียว"
 doctrine_parameter_adultery_male_crime:1 "บุรุษที่มีลักษณะนิสัย [GetTrait('adulterer').GetName( GetNullCharacter )] หรือ [GetTrait('fornicator').GetName( GetNullCharacter )] [trait|E] ถือเป็น [criminals|E]"
