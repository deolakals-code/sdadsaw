 doctrine_pluralism_pluralistic_desc:0 "เป็นการโง่เขลาอย่างยิ่งที่จะกล่าวว่ามีการตีความพระประสงค์ของพระเจ้าที่ถูกต้องเพียงหนึ่งเดียว และมุมมองอื่นๆ ทั้งหมดนั้นผิด เรา แต่ละคนมีวิธีนมัสการ [ROOT.Faith.HighGodName] ของตนเอง"
