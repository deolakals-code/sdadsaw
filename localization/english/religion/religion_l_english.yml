 doctrine_parameter_cremation_funeral: "[activity|E] [funeral|E] มีค่าใช้จ่าย [gold|E] ลดลงอย่างมาก"
 doctrine_parameter_mummification_funeral: "[activity|E] [funeral|E] มีค่าใช้จ่าย [gold|E] มากขึ้นและให้ [artifacts|E] ที่ทรงพลังเมื่อสิ้นสุดกิจกรรม"
