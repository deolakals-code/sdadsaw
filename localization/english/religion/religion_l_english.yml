 special_doctrine_is_christian_faith_desc:0 "มีคนในโลกที่ยึดมั่นในคำสอนของพระเยซูโดยไม่ยอมรับความเป็นพระเจ้าของพระองค์ แม้จะเป็นการดูหมิ่น เราก็ควรแสดงความเมตตาต่อวิญญาณที่หลงผิดเหล่านี้ เนื่องจากวันหนึ่งพวกเขาอาจเปลี่ยนมานับถือศรัทธาที่แท้จริง"
