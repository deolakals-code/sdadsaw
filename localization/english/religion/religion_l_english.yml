 special_doctrine_adoptionist_school_felicitous_doctrine_desc:0 "$adoptionist$ แบบเฟลิเซียนเชื่อในความเป็นจริงมากกว่าความบริสุทธิ์ โดยเข้าใจว่าต้องทำงานภายในระบบที่เป็นศัตรูเพื่อบ่อนทำลายพวกเขา การโกหกที่น่ารังเกียจเพื่อแสวงหาสาเหตุอันสูงส่งถือว่ามีค่ามากกว่าความจริงที่ตรงไปตรงมานับพัน"
 special_doctrine_adoptionist_school_radical_doctrine_name:0 "สำนักหัวรุนแรง"
 special_doctrine_adoptionist_school_radical_doctrine_desc:0 "$adoptionist_adherent_plural$ หัวรุนแรงไม่ยอมรับพระเจ้าอื่นใดนอกจากพระบิดา ไม่ยอมรับความเป็นพระเจ้าจากเนื้อหนัง และไม่ยอมรับ $christianity_religion_adherent_plural$ อื่นใดนอกจากตนเอง การรับพระคริสต์โดยไม่เห็นด้วยกับทุก #EMP ตัวอักษร#! ของบัญญัติถือเป็นการยอมรับการละทิ้งศาสนา"

