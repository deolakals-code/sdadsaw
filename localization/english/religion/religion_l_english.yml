 doctrine_clerical_marriage_allowed_name:0 "อนุญาต"
 doctrine_clerical_marriage_allowed_desc:0 "การสมรสเป็นสถาบันอันศักดิ์สิทธิ์ และ [ROOT.Faith.PriestNeuterPlural] ควรสามารถมีส่วนร่วมได้ เช่นเดียวกับผู้ติดตามที่ซื่อสัตย์คนอื่นๆ"
