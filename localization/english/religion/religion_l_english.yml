 doctrine_pilgrimage_name:0 "ทัศนคติต่อการจาริกแสวงบุญ"
 doctrine_pilgrimage_local_rites_name: "พิธีกรรมท้องถิ่น"
 doctrine_pilgrimage_local_rites_desc: "ผู้นับถือศรัทธานี้พึงพอใจกับความสะดวกสบายและความมั่นคงของพิธีกรรมตามปกติ ณ ศาลเจ้าในท้องถิ่น มากกว่าอันตรายและความยากลำบากของการจาริกแสวงบุญอันยาวไกล"
 doctrine_parameter_local_shrine_offering:0 "สามารถเข้าถึง [decision|E] [GetDecisionWithKey('visit_local_shrine_decision').GetName] แต่ [activity|E] [pilgrimage|E] นั้นมีค่าใช้จ่ายสูงกว่า"
