 doctrine_parameter_pluralism_pluralistic_holy_wars_preserve_vassals:0 "การชนะ [holy_war|E] จะ ทำให้ [rulers|E] คนนอกศาสนาในพื้นที่เป้าหมายกลายเป็นข้าหลวงแทนที่จะยึดที่ดินของพวกเขา"
 
 doctrine_theocracy_name:0 "ธรรมเนียมสงฆ์"
 doctrine_theocracy_temporal_name:0 "เทวาธิปไตย"
 doctrine_theocracy_temporal_desc:0 "เฉพาะ [ROOT.Faith.PriestNeuterPlural] ที่ได้รับอนุญาตเท่านั้นที่สามารถได้รับความไว้วางใจให้รักษาหลักคำสอนของศรัทธาของเรา และโดยการขยายความ ด้วยการจัดการและดูแลสถานที่ศักดิ์สิทธิ์ของเรา"
