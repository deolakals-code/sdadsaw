 doctrine_homosexuality_accepted_name:1 "ยอมรับได้"
 doctrine_homosexuality_accepted_desc:0 "ความรักอยู่เหนือขอบเขตทางกายภาพ กลายเป็นสิ่งที่ลึกซึ้งและน่าอัศจรรย์จนไม่สามารถจำกัดได้ด้วยเพียงเพศสภาพ"
