 doctrine_pilgrimage_forbidden_name:0 "ต้องห้าม"
 doctrine_pilgrimage_forbidden_desc:0 "การประทับอยู่ของ [ROOT.Faith.HighGodName] สามารถสัมผัสได้ทุกหนทุกแห่ง และความคิดที่ว่าสถานที่บางแห่งศักดิ์สิทธิ์กว่าที่อื่นนั้นไม่ใช่อะไรนอกจากการนอกรีต"
 doctrine_pilgrimage_encouraged_name:0 "สนับสนุน"
 doctrine_pilgrimage_encouraged_desc:0 "ศรัทธานี้สนับสนุนให้สมาชิกไปเยือนสถานที่ทางโลกที่ถือว่ามีความสำคัญทางจิตวิญญาณเพื่อแสดงความเคารพต่อ [ROOT.Faith.PantheonTerm]"
 doctrine_pilgrimage_mandatory_name:0 "บังคับ"
 doctrine_pilgrimage_mandatory_desc:0 "คาดว่า [ROOT.Faith.GetAdherentNamePlural] ที่แข็งแรงทุกคนจะเดินทางทางจิตวิญญาณไปยังสถานที่ศักดิ์สิทธิ์ทันทีที่สามารถทำได้ การไม่ทำ เช่นนั้นแสดงถึงความล้มเหลวในการยอมจำนนต่อ [ROOT.Faith.HighGodName]"
 doctrine_pilgrimage_mandatory_hajj_name:0 "ฮัจญ์"
 doctrine_pilgrimage_mandatory_hajj_desc:0 "คาดว่าชาวมุสลิมที่แข็งแรงทุกคนจะทำฮัจญ์ไปยังเมกกะในช่วงชีวิตของพวกเขา แม้ว่าจะมีการยกเว้นพิเศษอยู่บ่อยครั้ง แต่ [ROOT.Faith.GetAdherentNameNoTooltip] ใดๆ ที่ไม่สามารถทำฮัจญ์ได้จะถูกมองด้วยความสงสัย"
 forbidden_from_pilgrimage_name:0 "$doctrine_pilgrimage_name$: $doctrine_pilgrimage_forbidden_name$"
 doctrine_parameter_forbidden_from_pilgrimage:0 "ไม่สามารถเข้าถึง [activity|E] [pilgrimage|E] ได้[AddLocalizationIf( GetPlayer.GetGovernment.HasGovernmentFlag( 'government_is_mandala' ), 'mandala_pilgrimage_warning')]"
 doctrine_parameter_can_go_on_pilgrimage:0 "สามารถเข้าถึง [activity|E] [pilgrimage|E]"
 mandatory_pilgrimage_name:0 "$doctrine_pilgrimage_name$: $doctrine_pilgrimage_mandatory_name$"
 doctrine_parameter_mandatory_pilgrimage:1 "ลักษณะนิสัย [GetTrait('pilgrim').GetName( GetNullCharacter )] [trait|E] ให้โบนัสเพิ่มเติม และ [activity|E] [pilgrimage|E] ให้ [piety|E] เพิ่มเติมเมื่อเสร็จสิ้น"
 mandatory_hajj_name:0 "$doctrine_pilgrimage_name$: $doctrine_pilgrimage_mandatory_name$"
 doctrine_parameter_mandatory_hajj:1 "ลักษณะนิสัย [GetTrait('hajjaj').GetName( GetNullCharacter )] [trait|E] ให้โบนัสเพิ่มเติม และ [activity|E] [hajj|E] ให้ [piety|E] เพิ่มเติมเมื่อเสร็จสิ้น"
