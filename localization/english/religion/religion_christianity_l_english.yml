 waldensian_desc:0 "โดยถือว่าการสะสมความมั่งคั่งเป็นสิ่งต้องห้าม ซึ่งเข้ากันไม่ได้กับการบรรลุถึงความรอดพ้น ชาววัลเดนเซียนเทศนาถึงความยากจนตามแบบอัครสาวกว่าเป็นหนทางสู่ความสมบูรณ์แบบ และเชื่อว่านักบวชไม่ควรดำรงตำแหน่งหรือถือครองที่ดิน"

