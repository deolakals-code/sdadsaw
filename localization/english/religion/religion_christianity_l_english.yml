 catholic_desc:0 "คริสตจักรโรมันคาทอลิกอ้างว่าพระเยซูได้ประทานกุญแจสู่อาณาจักรสวรรค์แก่นักบุญเปโตร และในฐานะผู้สืบทอดอันชอบธรรมของท่าน พระสันตะปาปาจึงทรงเป็นผู้มีอำนาจทางจิตวิญญาณสูงสุดของโลกคริสเตียนทั้งมวล"


