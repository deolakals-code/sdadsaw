 mozarabic_church_desc:0 "สืบเชื้อสายมาจากพิธีกรรมไอบีเรียยุคแรก ศาสนาคริสต์แบบโมซาราบิกยังคงรักษาความเป็นอิสระจากโรมได้ในระดับหนึ่ง เนื่องจากการอยู่ภายใต้การปกครองของอิสลามมานานหลายศตวรรษ การอยู่ร่วมกันอย่างยาวนานกับศาสนาอื่น ๆ ทำให้พวกเขายอมรับความแตกต่างได้มากกว่านิกายที่เคร่งครัดกว่า"

