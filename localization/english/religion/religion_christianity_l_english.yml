 conversos_desc:0 "ชาวคอนเวอร์โซมีต้นกำเนิดเมื่อชุมชนชาวยิวถูกบังคับให้เปลี่ยนมานับถือศาสนาคริสต์ แม้ว่าพวกเขาจะยอมรับศรัทธาใหม่แล้ว แต่พวกเขายังคงจดจำประเพณีเก่าแก่ของตนและเห็นอกเห็นใจผู้ที่ยังคงปฏิบัติตามประเพณีเหล่านั้น"

