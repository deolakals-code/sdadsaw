 lollard_desc:0 "ชาวลอลลาร์ดประณามศีลศักดิ์สิทธิ์ทั่วไปของศาสนาคริสต์หลายอย่าง เช่น ศีลล้างบาปและศีลอภัยบาป โดยถือว่าพระคัมภีร์ไบเบิลอันศักดิ์สิทธิ์เป็นแหล่งหลักคำสอนคริสเตียนที่ถูกต้องเพียงแหล่งเดียว และคำสอนใดๆ ที่ไม่ได้อิงตามพระคัมภีร์โดยตรงถือว่าไม่ชอบธรรมโดยเนื้อแท้"

