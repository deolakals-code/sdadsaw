 nestorian_desc:0 "ในการสอนว่าพระเยซูคริสต์มีสองธรรมชาติ คือธรรมชาติพระเจ้าและธรรมชาติมนุษย์ ลัทธิเนสโตเรียนถูกประกาศว่าเป็นพวกนอกรีตโดยศาสนาคริสต์ส่วนใหญ่ อย่างไรก็ตาม ทัศนะที่เป็นเอกลักษณ์นี้ได้รวบรวมผู้ติดตามในดินแดนไกลโพ้นทางตะวันออก เช่น จีน อินเดีย และแม้ แต่มองโกเลีย"
