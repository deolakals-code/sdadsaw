 #Doctrines for FP3 

 doctrine_zoroastrian_branches_name: "ความดีและความชั่ว"
 doctrine_zoroastrian_branches_desc: "เราจะสนับสนุนนักบวชที่จัดตั้งขึ้นและหลักคำสอนของพวกเขา เพื่อปกป้องความเชื่อของเราจากพวกนอกรีต - หรือแท้จริงแล้วพวกเขาคือผู้ที่หลงผิดและทุจริต?"
 doctrine_major_branch_behdin_name: "เบห์ดิน"
 doctrine_major_branch_behdin_desc: "แม้ว่าเราอาจแตกต่างกันในเรื่องความแปลกประหลาดบางประการของการปฏิบัติ แต่พวกเราชาวโซโรอัสเตอร์สายหลักไม่เห็นพ้องต้องกันในเรื่องพื้นฐานของความภักดีต่ออหุระ มาซดาหรือ?"
 doctrine_heretic_branch_zandik_name: "คอร์รัมดิน"
 doctrine_heretic_branch_zandik_desc: "$doctrine_major_branch_behdin_name$ เรียกเราว่าพวกนอกรีต พวกนอกคอก และพวกบ่อนทำลาย แม้จะไม่มีสิ่งใดผูกมัดเราเข้าด้วยกันนอกจากความดูถูกเหยียดหยามของพวกเขา แต่ความชอบธรรมกำหนดการต่อต้านของเรา และความดูหมิ่นของพวกเขา ทำให้ใจเราแข็งกระด้าง"
 doctrine_parameter_hostility_override_doctrine_major_branch_behdin: "พิจารณา [faiths|E] เบห์ดินอื่น ๆ ว่าเป็น [GetHostilityLevelName( TOKEN_PARAMETER.GetIntValue )|V]"
