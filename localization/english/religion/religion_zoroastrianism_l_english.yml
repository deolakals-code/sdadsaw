 khurmazta_desc:1 "ด้วยรากฐานอันลึกซึ้งในการผสมผสานทางศาสนาของซอกเดียนา ชาวคูร์มาซตาบูชาเทพเจ้าและวิญญาณหลากหลาย ทั้งบรรพชนและสากล พวกเขายังเคารพรูปเคารพ ซึ่งเป็นสิ่งที่น่ารังเกียจสำหรับชาวโซโรอัสเตอร์อื่น ๆ อีกมาก กระนั้น แม้บางแง่มุมของความเชื่อของพวกเขาอาจมีเอกลักษณ์เพียงใด ในทางอื่น ๆ พวกเขายังคงอยู่ในวงโคจรของหลักคำสอนโซโรอัสเตอร์กระแสหลัก ปฏิบัติพิธีกรรมความบริสุทธิ์และดูแลไฟนิรันดร์ด้วยความทุ่มเทอย่างไม่หยุดยั้ง"
