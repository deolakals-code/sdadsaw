 khurramism_adherent_plural:0 "ชาวคูร์ราไมต์"
 khurramism_desc:1 "ในโลกแห่งแสงสว่างและความมืด ผู้ปกครองที่ไม่ยุติธรรมจะต้องถูกโค่นล้มเพื่อสนับสนุนสิ่งที่ดีงาม ผ่านศาสดา เช่น มาซดัก, อาบู มุสลิม และ อัล-มุกันนา ชาวคูร์ราไมต์เชื่อว่าพระเจ้าถือกำเนิดในมนุษยชาติ และวันหนึ่งจะกลับมานำพวกเขาในฐานะพระเมสสิยาห์"

