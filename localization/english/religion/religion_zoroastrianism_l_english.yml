 #Mazdayasna
 mazdayasna:0 "มาซดายัสนา"
 mazdayasna_adj:0 "มาซดายัน"
 mazdayasna_adherent:0 "ชาวมาซดายัน"
 mazdayasna_adherent_plural:0 "ชาวมาซดายัน"
 mazdayasna_desc:1 "มนุษย์ช่วยเหลือในการต่อสู้กับ #italic อากา มานาห์#! ผ่านความคิดและการดำเนินชีวิตที่ดี สิ่งนี้กระทำผ่านความบริสุทธิ์ทางพิธีกรรม การอนุรักษ์ธรรมชาติ และการทำลายล้างสิ่งมีชีวิตชั่วร้าย"

 #Behafaridism
 zurvanism:1 "ลัทธิเบฮาฟาริด"
 zurvanism_adj:1 "เบฮาฟาริดี"
 zurvanism_adherent:1 "ชาวเบฮาฟาริด"
 zurvanism_adherent_plural:1 "ชาวเบฮาฟาริด"
 zurvanism_desc:1 "ผู้ติดตามคำสอนของเบฮาฟาริด $zurvanism_adherent_plural$ แสวงหาความร่วมมือกับโลกอิสลาม โดยทำการปฏิรูปความเชื่อของตนหลายประการเพื่อตอบสนองต่อคำวิจารณ์ของชาวมุสลิมต่อศาสนาโซโรอัสเตอร์สายหลัก ในบรรดาการปฏิรูปเหล่านี้ ได้แก่ การห้ามบริโภคเครื่องดื่มแอลกอฮอล์ การต่อต้านการ แต่งงานในครอบครัวอย่างเข้มงวด และการส่งเสริมการกุศลเพื่อเป็นมาตรวัดการใช้ทรัพย์สินเพื่อประโยชน์สาธารณะ"
 

 #Zurvanism doctrine - FP3 update: removed from doctrine_asceticism and saved for possible future Fatalism tenet. 
 tenet_zurvanism_name:0 "ลัทธิซูร์วาน"
 tenet_zurvanism_desc:1 "ผู้นับถือลัทธิซูร์วานเชื่อว่าโอห์รมาซด์และอาห์ริมันเป็นฝาแฝดที่เท่าเทียมกัน แต่ตรงกันข้าม กำเนิดจากซูร์วาน ผู้สร้างทุกสรรพสิ่ง ลัทธิซูร์วานเน้นย้ำอย่างยิ่งในการช่วยเหลืออหุระ มาซดา โดยการขจัดความชั่วร้ายและความเท็จ"
 zurvanism_creator_god_name:0 "ซูร์วาน"
 zurvanism_creator_god_name_possessive:0 "แห่งซูร์วาน"



 #Gayomarthianism
 gayomarthianism:0 "ลัทธิกาโยมาร์เทียน"
