 mazdakism_desc:1 "ศาสดาหัวรุนแรง ซาร์ดุชต์ คูรากัน และ มาซดัก ได้รับอิทธิพลจากความเชื่อลึกลับในยุคโบราณตอนปลาย และปลุกระดมให้มีการเป็นเจ้าของทรัพยากรร่วมกันและความร่วมมือสากลระหว่างมนุษย์เพื่อเอาชนะปีศาจทั้งห้า ได้แก่ ความโลภ ความโกรธ ความอิจฉา ความเป็นเจ้าของ และความอาฆาตแค้น"

 #Khurramism
 khurramism:0 "ลัทธิคูร์รัม"
