 gayomarthianism_desc:1 "บนพื้นฐานแนวคิดที่ว่าอหุระ มาซดา ผ่านความคิดของพระองค์ ได้สร้างวิญญาณชั่วร้ายขึ้นโดยบังเอิญ ชาวกาโยมาร์เทียนปฏิเสธความไม่ผิดพลาดของเจ้าแห่งปัญญา และเน้นย้ำการปฏิบัติพิธีกรรมเพื่อเรียนรู้สัจจะในการสื่อสารกับอหุระ มาซดาแทน"

