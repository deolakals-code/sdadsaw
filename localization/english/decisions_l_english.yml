 write_muwashshah_poem_decision: "ประพันธ์บทกวีมุวัชชะห์"
 write_muwashshah_poem_decision_desc: "ด้วยเหล่าปราชญ์ผู้ยิ่งใหญ่ที่ข้ารายล้อมอยู่ การประพันธ์บทกวีใหม่ในรูปแบบมุวัชชะห์ที่นิยมนั้นค่อนข้างง่ายดาย ด้วยผู้คนที่กระตือรือร้นที่จะอ่านผลงานของข้ามากมาย ข้าจึงมีทางเลือกหลายทางสำหรับสถานที่สุดท้ายของมัน เช่นกัน"
 write_muwashshah_poem_decision_tooltip: "ประพันธ์บทกวีใหม่เพื่อขายเป็นเงิน เก็บไว้กับตัว หรือแจกจ่ายฟรี\n\n$EFFECT_LIST_BULLET$การขายบทกวีจะได้รับ [gold_i][gold|E] จำนวนหนึ่ง\n$EFFECT_LIST_BULLET$การเก็บบทกวีไว้จะเพิ่มค่าปรับ แต่งให้กับสิ่งประดิษฐ์ [artifact|E] ตำราจันทร์คู่\n$EFFECT_LIST_BULLET$การแจกจ่ายบทกวีจะ ส่งผลให้ได้รับ [prestige_i][prestige|E] เพิ่มเติม"
 sell_poem_decision: "ขายบทกวี"
 sell_poem_decision_tooltip: "ขายบทกวี นำมา ซึ่ง [gold_i][gold|E]"
 keep_poem_decision: "เก็บบทกวี"
 keep_poem_decision_tooltip: "เก็บบทกวีไว้ ปรับ แต่งสิ่งประดิษฐ์ [artifact|E] ตำราจันทร์คู่ของท่าน"
