 MODIFIER_DEFINITION_BOSPORAN_KINGDOM: "ค่าปรับ แต่งนี้เพิ่มขึ้นสำหรับทุก [county|E] ที่ถือครองใน [region|E] [GetGeographicalRegion('black_sea_coast_region').GetName]"
 unlocks_black_sea_naval_conquest: "ปลดล็อก #emp การขยายเคาน์ตี#! และ #emp การขยายเคาน์ตีทางทะเล#! [casus_belli|E] ใน [region|E] [GetGeographicalRegion('black_sea_coast_region').GetName] ตลอดระยะเวลาของ [house|E] [modifier|E]"
