 mozarabic_break_with_rome_decision.tt.hof_and_ecumenism_warning:0 "ท่านจะสร้าง [head_of_faith|E] ของ [religious_leader.GetFaith.GetName] แต่ #X อย่างถาวร#! จะสูญเสีย [GetFaithDoctrine('special_doctrine_ecumenical_christian').GetBaseName]"
