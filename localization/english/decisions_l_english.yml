 appoint_a_righteous_caliph_decision:0 "แต่งตั้งกาหลิบผู้ทรงธรรม"
 appoint_a_righteous_caliph_decision_desc:0 "[ROOT.Char.GetFaith.GetReligiousHead.GetTitledFirstName] เป็นบุคคลที่ห่างไกล ไม่คู่ควร และไม่พร้อมที่จะนำอุมมะฮ์ เนื่องจากเป็น [ROOT.Char.GetFaith.GetReligiousHead.GetFaith.GetAdjective] [ROOT.Char.GetFaith.GetReligiousHead.GetSheHe] จึง #EMP ไม่เข้าใจ#! ความจริงอันละเอียดอ่อนมากมายของแนวคิด [ROOT.Char.GetFaith.GetAdjective]\n\n[ROOT.Char.GetFaith.GetReligiousHead.GetSheHe|U] อาจไม่เข้าใจ แต่ #EMP ข้า#! เข้าใจ..."
 appoint_a_righteous_caliph_decision_confirm:0 "ข้าได้รับนำทางโดย [ROOT.Char.GetFaith.PositiveAfterLife|U]!"
 appoint_a_righteous_caliph_decision_tooltip:0 "นำ [ROOT.Char.GetFaith.GetNameNoTooltip] ออกห่างจากเส้นทาง [ROOT.Char.GetFaith.GetReligiousHead.GetFaith.GetAdjectiveNoTooltip]"
 appoint_a_righteous_caliph_decision.tt.you_become_caliph:0 "ท่านกลายเป็น [head_of_faith|E] คนใหม่"
 appoint_a_righteous_caliph_decision.need_at_least_ten_same_faith_counties:0 "ท่านมี [counties|E] ที่นับถือ [CHARACTER.GetFaith.GetAdjective] อย่างน้อย [EmptyScope.ScriptValue('appoint_a_righteous_caliph_decision_same_faith_county_count')|0]"
 appoint_a_righteous_caliph_decision.cant_be_caliphal_controller:0 "ท่านไม่ใช่ [liege|E] ของ [head_of_faith|E] ของท่าน"
 appoint_a_righteous_caliph_decision.no_more_than_x_sinful_traits:0 "ท่านมี [traits|E] ที่ [sinful|E] ไม่เกิน [EmptyScope.ScriptValue('appoint_a_righteous_caliph_decision_own_max_sins')|0]"
 appoint_a_righteous_caliph_decision.caliph_not_in_diplo_range:0 "[head_of_faith|E] ของท่านอยู่นอก [diplomatic_range|E]"
