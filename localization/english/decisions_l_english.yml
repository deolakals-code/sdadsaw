 escape_from_prison_decision_desc:0 "กำแพงเดิม ๆ กิจวัตรเดิม ๆ อาหารหยาบ ๆ เดิม ๆ – ทุกวันเหมือนเดิมไม่เปลี่ยนแปลง คุกนี้กำลังกัดกินตัวข้า และข้าจะทนต่อไปไม่ได้อีกแล้ว!"
