 mozarabic_fate_county_count.need_at_least_twenty_same_faith_counties:0 "ท่านต้องถือครอง [counties|E] ที่นับถือ [faith|E] เดียวกันอย่างน้อย [EmptyScope.ScriptValue('mozarabic_fate_county_count')|0]"
