 encourage_confession_of_false_conversions_decision.tt:0 "ผู้นับถือศาสนาลับอาจเปิดเผย [faith|E] ที่ซ่อนเร้นของตน"
 encourage_confession_of_false_conversions_decision.desc:0 "#F เป็นความลับที่เปิดเผยว่ามีผู้นับถือศาสนาลับอยู่ในอาณาจักรของข้า ปฏิบัติศรัทธาของตนอย่างหลบซ่อน บางทีการนิรโทษกรรมอย่างเป็นทางการอาจโน้มน้าวให้พวกเขาทิ้งฉากหน้าได้?#!"
 encourage_confession_of_false_conversions_decision.desc.tt_pluralist:0 "ผู้นับถือศาสนาลับภายในอาณาจักรของท่านอาจเปิดเผยตนเอง หาก [faith|E] ของท่าน [tolerates|E] ศรัทธาลับของพวกเขาได้ดีกว่าศรัทธาที่เปิดเผย"
 encourage_confession_of_false_conversions_decision.desc.tt_paranoia:0 "[characters|E] ที่ [GetTrait('deceitful').GetName( GetNullCharacter )] หรือ [GetTrait('paranoid').GetName( GetNullCharacter )] จะไม่เปิดเผย [faith|E] ลับของตน เว้น แต่จะตรงกับของท่าน"
 encourage_confession_of_false_conversions_decision.desc.tt_pluralist_counties:0 "หากท่าน [independent|E] [counties|E] ภายใน [realm|E] ของท่านที่มี [GetModifier('false_convert_modifier').GetNameWithTooltip] อาจเปลี่ยนอย่างเปิดเผย ขึ้นอยู่กับว่าท่านจะเป็นปฏิปักษ์ต่อ [faith|E] ใหม่ของพวกเขาเพียงใด"
 encourage_confession_of_false_conversions_decision.desc.tt_coreligionist:0 "ผู้นับถือศาสนาลับภายในอาณาจักรของท่านอาจเปิดเผยตนเอง หาก [faith|E] ส่วนตัวของพวกเขาเหมือนกับศรัทธาที่เปิดเผยของท่าน"
