 scrape_the_barrel_decision:0 "หาคนจากชั้นต่ำสุด"
 scrape_the_barrel_decision_desc:0 "ราชสำนักของข้าขาดแคลนบุคคลผู้มีทักษะที่จะมาเติมเต็มตำแหน่งในราชสำนักมากมายที่จำเป็นต่อการรักษา [ROOT.Char.GetPrimaryTitle.GetTierAsNameNoTooltip] ที่เจริญรุ่งเรือง!\n\nครัวเรือนของข้าขาดความยิ่งใหญ่ที่สมควรได้รับ แต่บางทีทางแก้ปัญหานี้อาจอยู่ในสถานที่ที่ไม่น่าเป็นไปได้ที่สุด..."
 scrape_the_barrel_decision_tooltip:0 "เราจะรับสมัคร [lowborn|E] เพื่อเติมเต็มตำแหน่ง [court_position|E] แบบสุ่ม"
 scrape_the_barrel_decision.tt:0 "$scrape_the_barrel_decision_tooltip$"
 scrape_the_barrel_decision_confirm:0 "เริ่มการค้นหา!"
 minor_decisions.0003.t:0 "การหาคนจากชั้นต่ำสุด"
 minor_decisions.0003.desc.opening:0 "การกวาดล้างของข้าทั่ว [ROOT.Char.GetCapitalLocation.GetTitle.GetNameNoTierNoTooltip] ได้ลากตัว [barrel_character.GetName] มาพบข้า!"
 minor_decisions.0003.desc.diseased:0 "เบื้องหน้าข้าคือชาวนาที่ป่วยไข้ ปกคลุมไปด้วยสิ่งสกปรก อาเจียนแห้งกรัง และแววตาของ [barrel_character.GetHerHis] ที่แทบจะไร้สติสัมปชัญญะ"
 minor_decisions.0003.desc.physical:0 "สิ่งที่ข้าเห็นเบื้องหน้าคือชาวนาที่มีรูปลักษณ์ผิดปกติอย่างยิ่ง จ้องมองข้าด้วยความตกตะลึงและเกรงขามราวกับว่าข้าคือ [ROOT.Char.GetFaith.HighGodName] [ROOT.Char.GetFaith.HighGodHerselfHimself] เห็นได้ชัดว่าสภาพการเกิดของ [barrel_character.GetHerHis] ทำให้ [barrel_character.GetHerHim] ต้องทนทุกข์ทรมานโดยไม่จำเป็นและถูกกีดกันจากสามัญชนใน [ROOT.Char.GetCapitalLocation.GetTitle.GetNameNoTierNoTooltip]"
 minor_decisions.0003.desc.maimed:0 "[barrel_character.GetWomanMan] ผู้นี้ดูเหมือนจะเคยเผชิญความขัดแย้งและความโหดร้ายในโลกนี้มามากกว่าส่วนแบ่งอันยุติธรรมของ [barrel_character.GetHerHis] และสวมใส่เครื่องเตือนใจจากทุกหมัดและคมดาบที่ทุบตีและฟัน [barrel_character.GetHerHim] ลง"
 minor_decisions.0003.desc.criminal:0 "เจ้าคนเลวผู้นี้ถูกลากตัวมาจากคุกใต้ดิน ถูกขังในข้อหาก่ออาชญากรรมที่ไม่อาจเอ่ยถึงต่อราชบัลลังก์ หวังว่าจะได้รับการอภัยโทษเพื่อแลกกับทักษะของ [barrel_character.GetHerHis]"
 minor_decisions.0003.desc.ewan:0 "สิ่งที่ข้าถูกบังคับให้มองคือฝันร้ายอันชั่วร้ายของ [barrel_character.GetWomanMan] แทบจะไม่คล้ายคลึงกับมนุษย์เลย สิ่งมีชีวิตที่น่าสังเวชนี้เต็มไปด้วยโรคภัยไข้เจ็บ ความผิดปกติ และการบาดเจ็บ จนเป็นเรื่องของเวทมนตร์ที่ [barrel_character.GetSheHe] ยังสามารถยืนอยู่ได้!"
 minor_decisions.0003.desc.criminal_bridge:0 "\n\nแม้ว่า [barrel_character.GetSheHe] จะเป็นผู้ทรยศที่มีความผิด,"
 minor_decisions.0003.desc.bridge_1:0 "\n\nแม้จะมี [barrel_character.GetHerHis] ความทุกข์,"
 minor_decisions.0003.desc.bride_2:0 "แต่ก็มีผู้แจ้งให้ข้าทราบว่า [barrel_character.GetSheHe] เป็นผู้มีทักษะ"
 minor_decisions.0003.desc.educated:0 "นักปราชญ์ ที่ได้รับการศึกษาด้านภาษาเขียนอย่างน่าประหลาดใจแม้จะมี [barrel_character.GetHerHis] ตำแหน่งที่ต่ำต้อยในชีวิต ข้ารู้สึกว่า [barrel_character.GetNameNoTooltip] จะรับใช้ราชสำนักได้ดีในเรื่องศาสนา ทุนการศึกษา หรือสุขภาพ"
 minor_decisions.0003.desc.cunning:0 "นักต้มตุ๋น ที่สร้าง [barrel_character.GetHerHis] โชคลาภด้วยการหลอกลวงชาวบ้านเอาเงินทุกเพนนีที่พวกเขามี ความเจ้าเล่ห์และฝีมืออันคล่องแคล่วของพวกเขาจะทำได้ดีข้างกายข้า คอยฟังเสียงกระซิบมากมายที่เกิดขึ้นในราชสำนักและลงทัณฑ์ผู้ที่ทำผิดต่อราชบัลลังก์"
 minor_decisions.0003.desc.charismatic:1 "นักการทูตที่มีทักษะด้านภาษา [ROOT.Char.GetCulture.GetLanguage.GetNameNoTooltip] ที่เทียบเท่าขุนนางใด ๆ ! เสน่ห์ที่ล้มล้างและรูปลักษณ์ที่ไม่ธรรมดาของ [barrel_character.GetHerHis|U] จะดึงดูดความสนใจของขุนนางต่างชาติที่มาเยี่ยมราชสำนักของข้าอย่างไม่ต้องสงสัย"
 minor_decisions.0003.desc.organised:0 "พ่อค้าที่มีความเข้าใจด้านการเงินและการจัดระเบียบสูงกว่าที่ข้าคาดหวังจากชาวนาผู้ต่ำต้อย ไม่ต้องสงสัยเลยว่า [barrel_character.GetWomanMan] ผู้นี้เสียเปล่าในฐานะชนชั้นต่ำและได้รับการเลือกจาก [ROOT.Char.GetFaith.HighGodName] ให้เลื่อนขั้นสู่ตำแหน่งขุนนางและรับใช้ข้าในราชสำนัก"
 minor_decisions.0003.desc.strong:0 "ผู้นำ ชนะการต่อสู้เล็ก ๆ น้อย ๆ นับไม่ถ้วนและนำกลุ่มอันธพาลของ [barrel_character.GetHerHis] จากการปล้นครั้งหนึ่งไปสู่อีกครั้งหนึ่ง ไม่ต้องสงสัยเลยว่า [barrel_character.GetSheHe] เสียเปล่ากับการคลุกอยู่ในโคลนและเลือด ก่ออาชญากรรมเล็ก ๆ น้อย ๆ ในชนบท และควรสวมเครื่องราชกกุธภัณฑ์และเข้าร่วมราชสำนักอันดีงามของข้าแทน!"
 minor_decisions.0003.desc.outro:0 "สภาของข้าได้กำหนดบทบาทที่เหมาะสมที่สุดสำหรับ [barrel_character.GetNameNoTooltip] แล้ว คำถามเดียวที่เหลืออยู่คือข้าเต็มใจที่จะทำสิ่งนี้จริง ๆ หรือไม่"
 minor_decisions.0003.a:0 "แน่นอน! ยินดีต้อนรับสู่ความเป็นขุนนาง [barrel_character.GetNameNoTooltip]!"
 minor_decisions.0003.b:0 "มีเพียงการประหารชีวิตเท่านั้นที่เหมาะสมกับ #EMP สิ่งมีชีวิต#! นี้"
 minor_decisions.0003.c:0 "[ROOT.Char.GetFaith.HighGodName] โปรดหาคนอื่นมาให้ข้า!"
 minor_decisions.0003.d:0 "เอ่อ เรายังไม่สิ้นหวังขนาดนั้น..."
 
