 form_bosporan_kingdom_decision_desc: "เราจะเป็นผู้ปกครองทะเลดำอีกครั้ง ยึดครองความมั่งคั่งและกลายเป็นที่รู้จักไปไกลเกินขอบเขตของเรา"
