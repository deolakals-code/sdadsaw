 rebuke_roman_revanchism_sicily.tt.effects.option.3: "หากท่านเลือกที่จะผนวก [GetTitleByKey('k_sicily').GetNameNoTier]"

 roman_restoration.1211.t: "ความฝันของจัสติเนียนพังทลาย"
 roman_restoration.1211.desc.intro: "เป็นเวลาหลายร้อยปีที่ชาวไบแซนไทน์ยึดติดกับฐานที่มั่นสุดท้ายของตนในคาบสมุทรอิตาลี ฝังเล็บเปื้อนเลือดลงบนผืนดินและปฏิเสธที่จะปล่อยมือไม่ว่าเราจะเตะถีบพวกเขามากแค่ไหน\n\nไม่มีอีกแล้ว วันนี้ การควบคุมของพวกเขาสุดท้ายก็หลวมพอที่จะถูกฉีกออกไปให้พ้นทาง และข้าจะ ทำให้แน่ใจว่าทั่วโลกรู้\n\n"
 roman_restoration.1211.desc.body.emperor_exists: "[emperor.GetTitledFirstNameNicknamed] จะโกรธเกรี้ยวคร่ำครวญเท่าที่ [emperor.GetSheHe] ต้องการก็ได้ — หาก [emperor.GetSheHe] จะใส่ใจสังเกตเห็นมณฑลที่แตกแยกออกไป ซึ่งอยู่ห่างไกลจากวังอันแสนสบายของ [emperor.GetHerHis] — แต่ [emperor.GetSheHe] ก็ทำอะไรไม่ได้ที่จะหยุดยั้งข้า"
 roman_restoration.1211.desc.body.emperor_absent: "ไม่มีแม้ แต่จักรพรรดิที่จะประท้วงการประกาศของข้า น่าสมเพชสิ้นดี"
 roman_restoration.1211.desc.outro: "\n\nคำถามเดียวคือ... ข้าเห็นว่า [GetTitleByKey('k_sicily').GetNameNoTier] อันงดงามนั้นควรเป็นของที่ใด?"
 roman_restoration.1211.a: "เราผูกพันกับพี่น้องทางเหนือของเราตลอดไป"
 roman_restoration.1211.b: "ชะตากรรมของซิซิลีอยู่ ณ อีกฟากทะเล ดั่ง เช่นเคยเสมอมา"
 roman_restoration.1211.c: "แน่นอนว่าต้องอยู่กับ [ROOT.Char.GetPrimaryTitle.GetBaseNameNoTierNoTooltip]!"

 roman_restoration.1212.t: "$roman_restoration.1211.t$"
 roman_restoration.1212.desc.intro: "หลังจากการต่อต้านอย่างดื้อรั้นและเด็ดเดี่ยวต่อฝูงชนคนเถื่อนประเภทต่างๆ ที่ทำลายล้างร่องรอยสุดท้ายของบ้านเกิดโบราณของเรามานานหลายร้อยปี [taker.GetTitledFirstName] ก็ประสบความสำเร็จในที่สุดในสิ่งที่คนอื่น ๆ ล้มเหลว\n\nเจ้าคนเลวผู้นี้ได้กำจัดร่องรอยสุดท้ายของการควบคุมของโรมันบนคาบสมุทรตะวันตก,"
 roman_restoration.1212.desc.new_empire.italia: "โดยแทนที่ด้วยการจัดดินแดนให้อยู่ในแนวเดียวกับ [GetTitleByKey('e_italy').GetNameNoTier] อย่างแข็งขัน"
 roman_restoration.1212.desc.new_empire.maghreb: "นำมันเข้าสู่ขอบเขตแอฟริกาพร้อมกับ [GetTitleByKey('e_maghreb').GetNameNoTier]"
 roman_restoration.1212.desc.new_empire.own: "ผนวกดินแดนเข้ากับอาณาจักรของ [taker.GetHerHis] เอง คือ [taker.GetPrimaryTitle.GetBaseNameNoTier]"
 roman_restoration.1212.desc.outro.territory_left: "\n\nฐานที่มั่นที่กระจัดกระจายและเหลืออยู่น้อยนิดของเราไม่สามารถต่อต้านความหายนะครั้งนี้ได้อย่างแท้จริง"
 roman_restoration.1212.desc.outro.no_territory_left: "\n\nเมื่อไม่มีแม้ แต่ท่าเรือเดียวทางตอนใต้เป็นของเรา เราก็ไม่สามารถทำอะไรเพื่อต่อต้านความอยุติธรรมนี้ได้"
 roman_restoration.1212.a: "เจ้าคนโอหังอวดดีนั่น!"

 roman_restoration.1213.t: "$roman_restoration.1211.t$"
 roman_restoration.1213.desc.intro: "แม้จะหลั่งเลือดเป็นมหาสมุทรเพื่อดินแดนอิตาลีของตนมานานหลายศตวรรษ [taker.GetTitledFirstNameNicknamed] ก็ได้บังคับให้ชาวโรมันยอมรับในที่สุดว่า [GetTitleByKey('k_sicily').GetNameNoTier] นั้นสูญเสียไปแล้ว\n\nบัดนี้ ดินแดนเหล่านั้นหันไปพึ่งพา"
 roman_restoration.1213.desc.new_empire.italia: "ส่วนที่เหลือของคาบสมุทรเพื่อขอความช่วยเหลือ"
 roman_restoration.1213.desc.new_empire.maghreb: "เพื่อนบ้านชาวแอฟริกันข้ามมหาสมุทร มองว่าตนเองเป็นส่วนหนึ่งของญาติโบราณข้าม [GetTitleByKey('e_maghreb').GetNameNoTier]"
 roman_restoration.1213.desc.new_empire.own: "[taker.GetHerHis] เองคือ [taker.GetPrimaryTitle.GetBaseName] ในฐานะจักรวรรดิ #EMP ใหม่#!"
 roman_restoration.1213.desc.body.emperor_exists: "[emperor.GetTitledFirstName] ประท้วงมากเท่าที่คาดหวังได้สำหรับการสูญเสียมณฑลรอง แต่ไม่มากไปกว่านั้น"
 roman_restoration.1213.desc.body.emperor_absent: "เมื่อไม่มีแม้ แต่จักรพรรดิที่จะคัดค้าน อิตาลีของโรมันก็ตายไปอย่างเงียบ ๆ"
 roman_restoration.1213.desc.outro.territory_left: "\n\nฐานที่มั่นที่เหลืออยู่ไม่กี่แห่งของจักรวรรดิที่เหลืออยู่ข้ามทะเลเอเดรียติก บัดนี้ดูเหมือนตกอยู่ในอันตรายมากกว่าที่เคย"
 roman_restoration.1213.desc.outro.no_territory_left: "\n\nเมื่อไม่มีแม้ แต่เมืองโรมันเมืองเดียวเหลืออยู่ในดินแดนที่สูญหาย ก็ไม่มีใครเหลือให้โศกเศร้าต่อความตายแห่งความฝันของจัสติเนียนอีกต่อไป"
 roman_restoration.1213.a: "ไปให้พ้นเสียที!"
 roman_restoration.1213.b: "ช่างเป็นยุคมืดที่เราอาศัยอยู่..."

