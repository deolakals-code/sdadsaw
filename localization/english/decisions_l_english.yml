 mozarabic_bind_the_faith_to_rome_decision.tt.hof_and_ecumenism_warning:0 "ท่านจะรักษา [GetFaithDoctrine('special_doctrine_ecumenical_christian').GetBaseName] ไว้ แต่ #X อย่างถาวร#! จะรักษา [head_of_faith|E] [religious_leader.GetFaith.GetReligiousHead.GetFaith.GetAdjective] ไว้"
