 has_locations_to_map_tt: "แผนที่สามารถสร้างขึ้นได้เฉพาะกับสถานที่ที่เยี่ยมชมแล้ว ซึ่งเป็น:\n[points_of_interest|E]\n[capital|E] ของ [kingdom|E] ต่างแดน\nใน [domain|E] ของท่านเอง\n[capital|E] ของ [vassal|E] ของท่านเอง"
