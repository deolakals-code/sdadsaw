 appoint_a_righteous_caliph_decision.control_two_holy_sites:0 "ท่านควบคุม [holy_sites|E] อย่างน้อย 2 แห่ง"
 appoint_a_righteous_caliph_decision.caliph_has_x_or_more_traits_sinful_to_your_faith:0 "[head_of_faith|E] ของท่านมี [traits|E] ที่ [sinful|E] [EmptyScope.ScriptValue('appoint_a_righteous_caliph_decision_hof_min_sins')|0] หรือมากกว่า"
 appoint_a_righteous_caliph_decision.has_wishes_to_schism_caliphate_flag:0 "ท่านวางแผนที่จะแตกแยกออกไปอีกเมื่อ [faith|E] ของท่านถูกก่อตั้ง"
 appoint_a_righteous_caliph_decision_mutazila_variant: "ฟื้นฟูมุอ์ตะซิละฮ์"
 appoint_a_righteous_caliph_decision_general_iranian_variant: "ตัดขาดจากกาหลิบ"
 appoint_a_righteous_caliph_decision_mutazila_variant_desc: "นับตั้งแต่สิ้นสุดมิห์นะฮ์ ผู้ที่ยืนหยัดเพื่อความเชื่อว่าอัลกุรอานถูกสร้างขึ้น ได้ถูกข่มเหงหรือละเลยโดยผู้ที่ต้องการจะเป็นกาหลิบ ข้าจะรับหน้าที่ล้างแค้นความเจ็บช้ำที่เราได้รับ และนำหลักคำสอนมุอ์ตะซิละฮ์กลับมาสู่แนวหน้าของแนวคิดอิสลามอีกครั้ง"
 appoint_a_righteous_caliph_decision_general_iranian_variant_desc: "แม้ว่าศาสนาอิสลามจะถูกนำมาสู่เปอร์เซียโดยใช้กำลัง แต่บัดนี้ไม่มีใครสามารถปฏิเสธความเชื่อของเราในความเป็นเอกะของ [ROOT.Char.GetFaith.HighGodNameAlternate] ได้ แต่วิถีของเราและวิถีอาหรับได้แยกห่างกันไป และเราต้องตัดขาดจาก [ROOT.Char.GetFaith.GetReligiousHead.GetTitledFirstName] ครั้งแล้วครั้งเล่า นับจากนี้ไป ข้าจะนำชาว [ROOT.Char.GetFaith.GetAdjective] ด้วยตนเอง"

 mozarabic_bind_the_faith_to_rome_decision:0 "ผูกศรัทธากับโรม"
 mozarabic_bind_the_faith_to_rome_decision_desc:0 "แม้ว่า [ROOT.Char.GetFaith.GetReligiousHead.GetTitledFirstName] จะยังคงเป็นพระสันตะปาปาที่แท้จริงเพียงองค์เดียวของเรา แต่การแยกตัวออกจากเจตจำนงของผู้แทนพระคริสต์ได้นำเราไปสู่เส้นทางที่แปลกประหลาด วันเวลาที่สภาสงฆ์ผู้ยิ่งใหญ่แห่งยุโรปเดินอยู่ในห้องโถงแห่งโตเลโดได้ผ่านพ้นไปแล้ว\n\nกระนั้น พวกเขาไม่จำเป็นต้อง... หากศรัทธาของเราหลงทางไป คนเลี้ยงแกะที่แข็งแกร่งจะสามารถนำมันกลับเข้าฝูงได้หรือไม่?"
 mozarabic_bind_the_faith_to_rome_decision_tooltip:0 "ผูก [faith|E] [ROOT.Char.GetFaith.GetAdjective] ที่หลงทางกลับคืนสู่ [ROOT.Char.GetFaith.GetReligiousHead.GetFaith.GetName]"
