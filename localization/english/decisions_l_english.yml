 tribal_challenge_ruler_decision:0 "ท้าทาย [ROOT.Char.GetLiege.GetTitleAsNameNoTooltip|U]"
 tribal_challenge_ruler_decision_desc:0 "[ROOT.Char.GetLiege.GetFirstName] ครองบรรดาศักดิ์ [ROOT.Char.GetLiege.GetTitleAsNameNoTooltip] ราวกับว่าเป็นของ [ROOT.Char.GetLiege.GetHersHis] อย่างไม่มีข้อโต้แย้ง ราวกับว่าไม่ใช่ทักษะและความแข็งแกร่งเพียงอย่างเดียวที่ควรตัดสินผู้นำของเรา\n\nข้า [ROOT.Char.GetFullNameNoTooltip] ตั้งคำถามถึงสิทธิ์ของ [ROOT.Char.GetLiege.GetHerHis] ในบรรดาศักดิ์ ใน [ROOT.Char.GetLiege.GetPrimaryTitle.GetNameNoTier] ทั้งหมด และข้าจะไม่นิ่งเงียบอีกต่อไป!"
 tribal_challenge_ruler_decision_tooltip:0 "ท้าทาย [ROOT.Char.GetLiege.GetTitleAsNameNoTooltip|U] เพื่อชิงตำแหน่งและดินแดนของ [ROOT.Char.GetLiege.GetHerHis]"
 tribal_challenge_ruler_effect_tooltip:0 "[liege_to_challenge.GetTitledFirstNameNoTooltip] จะตัดสินใจเกี่ยวกับการท้าทาย\n"
 tribal_challenge_ruler_desc_success:0 "ท่านชนะการท้าทาย"
 tribal_challenge_ruler_desc_failure:0 "ท่านแพ้การท้าทาย"
 recently_took_tribal_challenge_ruler_decision:0 "เพิ่งท้าทายอำนาจปกครองของผู้อื่นเมื่อเร็ว ๆ นี้"
 tribal_challenge_ruler_decision_confirm:0 "ท้าทาย [ROOT.Char.GetLiege.GetTitledFirstNameNoTooltip]!"

 gain_weight_decision:0 "เพิ่มน้ำหนัก"
 gain_weight_decision_desc:0 "ความบกพร่องของร่างกายข้าเริ่มเห็นได้ชัดเจนเกินไป – ข้าแทบไม่มีเรี่ยวแรงจะผ่านพ้น แต่ละวันไปได้!\n\nมีผู้แนะนำอาหารที่ประกอบด้วยสิ่งต่าง ๆ เช่น นม เนย และอินทผลัมจำนวนมาก และข้าคิดว่าถึงเวลาต้องลองดูแล้ว"
 gain_weight_decision_tooltip:0 "ท่านจะอุทิศตนเพื่อเพิ่มน้ำหนัก"
 gain_weight_decision_confirm:0 "เอาเนยมา!"

 stop_gain_weight_decision:0 "หยุดเพิ่มน้ำหนัก"
 stop_gain_weight_decision_desc:0 "อาหารไขมันสูงที่หลั่งไหลเข้ามาไม่หยุดหย่อนได้ทำหน้าที่ของมันแล้ว และข้าทนกินต่อไปไม่ไหว ข้าจะละทิ้งความพยายามในการเพิ่มน้ำหนัก"
 stop_gain_weight_decision_tooltip:0 "ท่านจะไม่พยายามเพิ่มน้ำหนักอีกต่อไป"
 stop_gain_weight_decision_confirm:0 "หยุดเพิ่มน้ำหนัก"

 lose_weight_decision:0 "ลดน้ำหนัก"
 lose_weight_decision_desc:0 "ร่างกายของข้าอ่อนแอลงทุกวันที่ผ่านไป และความอ้วนท้วนก็นับเป็นภาระหนักแก่ข้าทั้งทางร่างกายและจิตใจ\n\nการวิ่ง การอาบน้ำอุ่น หรือแม้ แต่สารกระตุ้นให้อ่อนเพลียเล็กน้อย... ข้าจะหาทางลดน้ำหนักลงบ้าง"
 lose_weight_decision_tooltip:0 "ท่านจะอุทิศตนเพื่อลดน้ำหนัก"
 lose_weight_decision_confirm:0 "เอาสแกมโมนีมา!" # Note: Scammony is a type of purgative plant. Using the transliterated name seems appropriate.

 stop_lose_weight_decision:0 "หยุดลดน้ำหนัก"
 stop_lose_weight_decision_desc:0 "ข้าได้ลองยาทุกขนานและวิธีรักษาทุกอย่างที่แนะนำมาแล้ว และการผลักดันต่อไปคงจะเกินพอดี ข้าจะละทิ้งความพยายามในการลดน้ำหนัก"
 stop_lose_weight_decision_tooltip:0 "ท่านจะไม่พยายามลดน้ำหนักอีกต่อไป"
 stop_lose_weight_decision_confirm:0 "หยุดลดน้ำหนัก"

 commit_suicide_decision:1 "พยายามฆ่าตัวตาย"
 commit_suicide_decision_desc:0 "มีเพียงความมืดและความเจ็บปวด ผู้คนบอกข้าว่ามันจะดีขึ้น แต่พวกเขารู้ได้อย่างไร? และนั่นช่วยอะไรข้าได้ในตอนนี้? ถึงเวลาแล้วที่จะสลัดเครื่องพันธนาการแห่งภพภูมินี้"
 commit_suicide_decision_desc_depressed:0 "$commit_suicide_decision_desc$"
 commit_suicide_decision_desc_incapable:0 "ข้ารอดชีวิต แต่ไม่ได้มีชีวิตอย่างแท้จริง สภาพปัจจุบันบังคับให้ข้าต้องพึ่งพาผู้อื่นแม้ในกิจวัตรที่ง่ายที่สุด ข้าไม่ได้เลือกสิ่งนี้ บางทีมันอาจจะง่ายกว่าหากข้าเพียงแค่จบสิ้นทุกสิ่ง..."
 commit_suicide_decision_desc_cancer:0 "ข้ารู้สึกถึงความเจ็บป่วยที่แพร่กระจายในตัวข้า สิ่งที่เริ่มจากความรำคาญเล็กน้อยบัดนี้กลายเป็นความยากลำบากใน แต่ละวัน ความตายเป็นสิ่งที่หลีกเลี่ยงไม่ได้ ข้าเพียงต้องการให้ความเจ็บปวดหยุดลง"
 commit_suicide_decision_desc_leper:0 "ความเน่าเปื่อยได้ยึดครองร่างมนุษย์ของข้าอย่างมั่นคง นิ้วเท้าบางส่วนหายไปแล้วและหนองก็ไหลซึมจากบาดแผล ข้าต้องทนทุกข์ทรมานจากชะตากรรมอันน่าสยดสยองนี้ไปอีกนานเท่าใด?"
 commit_suicide_decision_desc_great_pox:0 "บัดนี้ตุ่มหนองปกคลุมทั่วร่างกายข้า แต่ละแผลใหญ่ขึ้นและเจ็บปวดกว่าเดิม ข้ามองเห็น แต่ความกลัวและความรังเกียจในสายตาของเหล่าข้าราชบริพาร มันมี แต่จะแย่ลง..."
 commit_suicide_decision_desc_lunatic:0 "ข้าหนีไม่พ้นเสียงกระซิบแห่งความเกลียดชังและความผิดหวังที่ไม่หยุดหย่อน พวกมันบอกให้ข้าทำในสิ่งที่ไม่ควรทำ ไม่มีอะไรสมเหตุสมผล ความจริงขัดแย้งในตัวเอง มีเพียงความตายเท่านั้นหรือที่จะปลดปล่อยข้า?"
 commit_suicide_decision_desc_parent:0 "ไม่มีทางก้าวต่อไปได้ ข้าติดอยู่ในความโศกเศร้าต่อบุตรที่สูญเสียไป [ROOT.Var('mourning_parent').Char.Custom2('MyCharacterIntroduction', ROOT.Char)|U] คือโลกทั้งใบของข้า จะมีประโยชน์อันใดในการมีชีวิตอยู่ เมื่อชีวิตได้สูญเสียแหล่งความสุขและเสียงหัวเราะเพียงหนึ่งเดียวไปแล้ว?"
 commit_suicide_decision_desc_soulmate:1 "ข้าไม่อาจทนต่อความว่างเปล่าที่รู้สึกอยู่ภายในจิตวิญญาณได้อีกต่อไป ชีวิตที่ปราศจากท่าน [ROOT.Var('mourning_soulmate').Char.GetFirstName] ที่รักของข้า เป็นเพียงภาระ หากหนทางเดียวที่จะกลับสู่อ้อมแขนของท่านคือการจากโลกนี้ไป ก็ขอให้เป็น เช่นนั้น"
 commit_suicide_decision_desc_friend:1 "ชีวิตช่างมืดมนเกินไปหากข้าไม่สามารถแบ่งปันกับสหายแท้ได้ ช่วงเวลาที่เคย ทำให้ทั้ง [ROOT.Var('mourning_friend').Char.GetFirstName] และข้าหัวเราะได้นานหลายชั่วโมง บัดนี้กลับเติมเต็มข้าด้วยความสิ้นหวัง เส้นทางแห่งความโดดเดี่ยวนี้ไม่เหมาะสำหรับข้า"
 commit_suicide_decision_desc_demoted:0 "น้อยคนนักที่จะต้องทนทุกข์กับความอัปยศ เช่นข้า ข้าผู้ ซึ่งเคยอยู่ ณ จุดสูงสุด บัดนี้ถูกบังคับให้ต้องประจบประแจงเหมือนคนโง่เขลาเหล่านี้ บางทีข้าควรจัดการเรื่องนี้ด้วยตนเองและจากไปในแบบที่ข้าเลือก"
 commit_suicide_decision_desc_divorce:0 "ข้าใช้เวลา แต่ละวันจมอยู่กับความเสียใจ ข้าสามารถทำสิ่งใดได้บ้างเพื่อป้องกันการพลัดพรากอันเจ็บปวดนี้? ข้าจะฟื้นฟูความรักที่สูญเสียไปได้อย่างไร? มันสิ้นหวังแล้ว หากปราศจากการสมรส ข้าก็ไม่มีค่าอะไรเลย"
 commit_suicide_decision_desc_witch:0 "ความหลงใหลในศาสตร์ลึกลับได้นำข้ามาสู่เส้นทางอันโดดเดี่ยวและอันตราย แต่ความอยากรู้อยากเห็นของข้าต้องแลกมาด้วยราคาอันแสนแพง ข้าถูกกีดกัน เพราะความเชื่อของข้า ข้าเกรงว่าพวกเขาจะไม่มีวันยอมรับในสิ่งที่ข้าเป็น"
 commit_suicide_decision_desc_cannibal:0 "ช่างเป็นสังคมที่ล้าหลังเสียจริง การได้ลิ้มรสเนื้อหนังมนุษย์อันโอชะกลับกลายเป็นสิ่งเดียวที่นำความสุขมาให้ข้า ข้าไม่ต้องการมีชีวิตอยู่ในโลกที่ห้ามปรามสิ่งนี้!"
 commit_suicide_decision_desc_sodomite:0 "โชคชะตาช่างโหดร้ายกับข้า เหตุใดข้าจึงต้องถูกข่มเหง เพราะความปรารถนาในใจ? ข้ามิอาจเลือกเกิดได้ หากพวกเขาประณามข้าในชีวิตนี้ ข้าจะได้รับการยอมรับในความตายเท่านั้นหรือ?"
 commit_suicide_decision_desc_deviant:0 "พวกเขาเป็นใครมาตัดสินข้า? การสำรวจตัณหาของข้าอาจนำข้าไปสู่เส้นทางอันน่าประหลาดใจมากมาย แต่ทั้งหมดก็นำไปสู่ความสุขอย่างลึกซึ้ง หากปราศจากความสุขทางกามารมณ์เหล่านี้ ข้าก็ไม่มีเหตุผลที่จะมีชีวิตอยู่"
 commit_suicide_decision_desc_criminal:0 "ข้าหนีอดีตของตนเองไม่พ้น ไม่ว่าข้าจะไปที่ใด ข้ารู้สึกถึงสายตาแห่งการตัดสินจับจ้องมาที่ข้า สิ่งนี้เกิดขึ้นได้อย่างไร? เหตุใดข้าจึงปล่อยให้เรื่องราวดำเนินมาถึงเพียงนี้? ข้าหวังว่าอาชญากรรมของข้าจะได้รับการอภัยหลังจากข้าจากไปแล้ว"
 commit_suicide_decision_desc_stressed:0 "วันแล้ววันเล่า ความกดดันเพิ่มพูนขึ้น ไม่ว่าข้าจะไปที่ใด ทำสิ่งใด ในไม่ช้ามันก็หนักหนาเกินไป ทุกสิ่งกำลังหมุนวนจนควบคุมไม่ได้ มันต้องจบลง!"
 commit_suicide_decision_tooltip:2 "ถึงเวลาที่จะจากโลกนี้ไปแล้ว"
 commit_suicide_decision_effect_tooltip:0 "@warning_icon! ท่านจะพยายามจบชีวิตตนเอง ท่านแน่ใจแล้วหรือว่านี่คือสิ่งที่ท่านต้องการ?"
 commit_suicide_decision_confirm:0 "เวลาของข้ามาถึงแล้ว"

