 convert_whole_realm_to_feudalism_west_african_pagan_decision.tt.wa_capital_development:0 "[capital|E] ของท่านอยู่ใน [GetGeographicalRegion('world_africa_west').GetName] และมี [development|E] อย่างน้อย [EmptyScope.ScriptValue('convert_whole_realm_to_feudalism_west_african_pagan_decision_wa_capital_development_value')|0]"
