 revoke_false_conversion_decision.desc.tt_landless: "ท่านกลับไปนับถือ [faith|E] ก่อนหน้าของท่าน [close_family|E] ของท่านอาจเปลี่ยนตามท่าน"
 revoke_false_conversion_decision.desc.tt_own_faith_counties:0 "หากท่าน [independent|E] [counties|E] ภายใน [realm|E] ของท่านที่มี [GetModifier('false_convert_modifier').GetNameWithTooltip] อาจเปลี่ยนตามท่าน หากแอบนับถือ [faith|E] ของท่านอยู่แล้ว"
