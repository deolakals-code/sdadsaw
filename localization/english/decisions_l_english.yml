 mozarabic_break_with_rome_decision:0 "ตัดขาดจากโรม"
 mozarabic_break_with_rome_decision_desc:0 "[ROOT.Char.GetFaith.GetReligiousHead.GetTitledFirstName] รู้อะไรเกี่ยวกับชีวิตหรือดินแดนของเรา? โรมเป็นเจ้าเหนือหัวทางโลกที่ห่างไกล ไม่สนใจและไม่เข้าใจความต้องการทางจิตวิญญาณของเรา\n\nเพียงการปลดปล่อยตนเองจากพันธนาการของ [ROOT.Char.GetFaith.GetReligiousHeadTitle.GetBaseName] และชำระล้างคำโกหกสุดท้ายของมันเท่านั้น ที่ [ROOT.Char.GetFaith.GetName] จะสามารถบรรลุความสมบูรณ์แบบได้"
 mozarabic_break_with_rome_decision_tooltip:0 "นำ [ROOT.Char.GetFaith.GetName] ไปสู่การแตกแยกออกจาก [ROOT.Char.GetFaith.GetReligiousHead.GetFaith.GetName]"
