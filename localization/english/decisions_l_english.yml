 borrow_from_holy_order_decision:0 "ขอยืมทองคำจากคณะนักรบศักดิ์สิทธิ์"
 borrow_from_holy_order_decision_tooltip:0 "ท่านจะขอยืมเงินจากคณะนักรบศักดิ์สิทธิ์ที่พร้อมให้ยืม"
 borrow_from_holy_order_decision_desc:0 "ข้ากำลังต้องการเงิน และจะมีใครให้ขอความช่วยเหลือได้ดีไปกว่าผู้รับใช้แห่ง [ROOT.Char.GetFaith.HighGodName]? ข้าสามารถส่งสาส์นออกไปและหวังว่าจะได้รับคำตอบ"
 borrow_from_holy_order_decision_confirm:0 "เขียนคำร้องขอ!"
 borrow_from_holy_order_decision_effect_tooltip:1 "ท่านขอยืม [gold|E][gold_i] จำนวน [SCOPE.ScriptValue('holy_order_gold_value')|P00] จาก [holy_order|E]\n\n@warning_icon! [holy_order|E] จะเริ่มเรียกร้องหากท่านไม่ชำระคืนเงินกู้\n@warning_icon! ท่านไม่สามารถขอยืมเงินเพิ่มได้อีกจนกว่าจะชำระคืนเงินกู้นี้"
 borrow_from_holy_order_gold_condition:3 "ไม่มีภาคีอัศวินศักดิ์สิทธิ์ [CHARACTER.GetFaith.GetAdjective] ใดที่มีทั้ง [gold_i|E][gold|E] เพียงพอและมีมุมมองที่ดีต่อท่าน"

 escape_from_prison_decision:0 "หลบหนีออกจากคุก"
