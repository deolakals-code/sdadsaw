 revoke_false_conversion_decision.desc:0 "#F แม้ว่าอย่างเป็นทางการข้าจะปฏิบัติตามศรัทธา [ROOT.Char.GetFaith.GetAdjectiveNoTooltip] ข้าก็ไม่อาจละทิ้งพิธีกรรมส่วนตัวและความเชื่อส่วนตัวมากมายที่บรรพบุรุษของข้ายึดถือได้ บางทีวิถีเก่าอาจจะดีกว่าจริง ๆ ?#!"
