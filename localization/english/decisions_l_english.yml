 major_decisions.3200.t: "[rightful_title.GetNameNoTierNoTooltip] เป็นหนึ่งเดียว"
 major_decisions.3200.desc: "ในฐานะ [rightful_liege.Custom('GetQueenKing')|l] แห่งบัลลังก์ [rightful_title.GetNameNoTier] และ [destroyed_title.GetNameNoTier] [rightful_liege.GetTitledFirstName] ได้ตัดสินใจว่าถึงเวลาแล้วที่จะปกครองทั้งสองจาก [rightful_liege.GetCapitalLocation.GetTitle.GetNameNoTier]\n\nต่อไปนี้ ข้าหลวงของ [rightful_liege.GetHerHis] จะไม่ถูกมองว่าเป็นสองชนชาติที่ปกครองโดย [rightful_liege.Custom('GetQueenKing')|l] คนเดียว แต่เป็นประชากรของราชอาณาจักรเดียว"
 major_decisions.3200.a: "และการปกครองของทรราชย์ [rightful_liege.GetCulture.GetNameNoTooltip] ก็ดำเนินต่อไป..."
 major_decisions.3200.b: "เพื่อประโยชน์สุขของชาว [rightful_title.GetNameNoTierNoTooltip] ทั้งปวง"

 major_decisions.3300.t: "การผงาดของคาร์เธจ"
 major_decisions.3300.desc: "จากแผ่นดินที่ถูกโรยด้วยเกลือ จักรวรรดิใหม่กำลังผงาดขึ้น ฟื้นคืนสู่ความรุ่งโรจน์ในอดีต ในไม่ช้า เรือของวาณิชจะเติมเต็มท่าเรือด้วยทรัพย์สมบัติ และความยิ่งใหญ่เหนือทะเลเมดิเตอร์เรเนียนจะเป็นของเรา\n\nที่ซึ่งฮันนิบาลผู้ยิ่งใหญ่ล้มลงในความพ่ายแพ้อันขมขื่น ข้าจะลุกขึ้นเพื่อทวงคืนมรดกของเรา โลกจะได้รับรู้ถึงอำนาจที่แท้จริงของคาร์เธจอีกครั้ง\n\nยังมีงานอีกมากที่ต้องทำ ทว่าสำหรับตอนนี้ ข้าคือ #EMP ผู้คว้าชัย! #!"
 major_decisions.3300.a: "ข้าจะน้อมรับธรรมเนียมโบราณ"
 major_decisions.3300.b: "ข้าจะหล่อหลอมจักรวรรดิในแบบที่ข้าเห็นควร"
 #Cossack kingdom creation decision
 major_decisions.3600.t: "การผงาดของคอสแซค"
 major_decisions.3600.desc: "เป็นเวลาหลายชั่วอายุคนแล้ว ที่เหล่าชายหญิงผู้เป็นไท ไม่ว่าจะเป็นนักผจญภัย ผู้ถูกเนรเทศ หรืออาชญากร ได้ค้นพบเส้นทางสู่ทุ่งหญ้าแคสเปียน\n\nบางครั้งก็ถูกเรียกว่า 'คาซัค' พวกเขาใช้ชีวิตตามกฎหมายของตนเอง แต่กระนั้นชาวคูมันก็ยังคงกดขี่เหล่าเสรีชนนี้ และครอบงำทุ่งหญ้าสเตปป์ [founder_culture.GetCollectiveNoun] ภายใต้การปกครองของข้ามองชาวคาซัคเหล่านี้เสมือนญาติมิตร และเราก็ต้อนรับพวกเขาเข้ามาอยู่ในหมู่พวกเราเพิ่มมากขึ้นทุกวัน\n\nบางทีอาจถึงเวลาไขว่คว้าชะตากรรมใหม่ร่วมกันแล้วกระมัง?"
 major_decisions.3600.a: "พวกเราชาวคอสแซคจะใช้ชีวิตอย่างเสรีใต้ท้องฟ้าอันไร้ที่สิ้นสุด"
 major_decisions.3600.b: "ข้าจะปกครองพวกเขา แต่จะยึดถือวิถีทางเดิม"
