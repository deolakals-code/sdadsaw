 court_amenities_interactions.0011.desc_intro:0 "ข้าเดินกรีดกรายไปรอบราชสำนัก ภูมิใจในคำประกาศแฟชั่นใหม่ที่กล้าหาญของข้า,"
 court_amenities_interactions.0011.desc.flag_big_collar:0 "เสื้อผ้าของข้าประดับด้วยปกเสื้อกลมขนาดใหญ่ เพื่อให้ทุกคนชื่นชม"
 court_amenities_interactions.0011.desc.flag_head_dress:0 "ผ้าโพกศีรษะปกติของข้าเอียงไปด้านหนึ่งของศีรษะ นำสิ่งใหม่และสดใหม่มาสู่เสื้อผ้าที่เก่าและน่าเบื่อ"
 court_amenities_interactions.0011.desc.flag_gold_boots:0 "รองเท้าบูททองคำหนักของข้าส่องประกายในแสงของห้องโถง [debate_locale.GetNameNoTierNoTooltip]"
 court_amenities_interactions.0011.desc.flag_sleeveless:0 "เสื้อผ้าแขนกุดใหม่ของข้าเผยให้เห็นแขนของข้า เพื่อให้ทุกคนเห็น!"
 court_amenities_interactions.0011.desc.flag_commoner_clothes:0 "ตั้งคำถามว่าทำไมขุนนางต้อง แต่งตัวแตกต่างจากสามัญชนมากนัก ในเมื่อความเรียบง่ายนั้นมีสไตล์มาก"
 court_amenities_interactions.0011.desc_bridge:0 "[recipient.Custom2('MyCharacterIntroduction', ROOT.Char)] ร้องตะโกนใส่ข้าจากอีกฟากของห้องโถง\n\nเราสาดคำดูถูกใส่กันไปมา ข้าปกป้องสิ่งที่เห็นได้ชัดว่าเป็นแฟชั่นที่ดี ซึ่งเกินกว่าที่คนจิตใจคับแคบจะเข้าใจ"
 court_amenities_interactions.0011.desc_won:0 "ขณะที่ขุนนางท้องถิ่นพากันมารุมล้อมข้า ข้าถือว่าคำประกาศแฟชั่นของข้าประสบความสำเร็จอย่างกึกก้อง!"
 court_amenities_interactions.0011.desc_lost:0 "ขณะที่ขุนนางแห่ง [debate_locale.GetNameNoTierNoTooltip] เข้าร่วมกับ [recipient.GetNameNoTooltip] อย่างรวดเร็วในการเยาะเย้ยชุดของข้า ข้ารู้ว่าคำประกาศแฟชั่นของข้าไม่ได้รับการชื่นชมอย่างโหดร้ายในยุคสมัยของมัน"
 court_amenities_interactions.0011.a_won:0 "ข้ารู้ดีที่สุดเสมอ!"
 court_amenities_interactions.0011.a_lost:0 "พวกเขาแค่ #EMP ไม่เข้าใจ#! ข้า!"
 court_amenities_interactions.0012.desc_intro:0 ""อืม พวกเราบางคนเป็นผู้ตาม และคนอื่น ๆ เป็นผู้นำ" [actor.GetNameNoTooltip] ยืนหยัดใน [actor.GetHerHis] ความมุ่งมั่นต่อชุดที่น่าหัวเราะนั้น\n\nเราใช้เวลาสองสามชั่วโมงถัดไปโต้เถียงกันเรื่องธรรมชาติของแฟชั่นชั้นสูง โดยมีฝูงชนข้าราชบริพารกลุ่มเล็ก ๆ เฝ้าดูขณะที่ข้าสาดคำดูถูกใส่เจ้าโง่นี้ครั้งแล้วครั้งเล่า"
 court_amenities_interactions.0012.desc_won:0 "ไม่นานนัก ข้าราชบริพารคนอื่น ๆ อีกหลายคนก็เริ่มเข้าร่วมกับข้าในการเยาะเย้ย [actor.GetNameNoTooltip] และข้ารู้ว่างานของข้าเสร็จสิ้นแล้ว"
 court_amenities_interactions.0012.desc_lost:0 "น่าเสียดายที่ฝูงชนดูเหมือนจะไม่คล้อยตามข้อโต้แย้งของข้า และภายในไม่กี่วัน ข้าก็เป็นคนเดียวในราชสำนักที่ #EMP ไม่ได้#! แต่งตัวเหมือน [actor.GetNameNoTooltip]"
 court_amenities_interactions.0012.desc_lost.kof:1 "ไม่เพียงแค่นั้น แต่หลายคนยังเรียก [actor.GetHerHim] ว่า "[actor.GetTitleAsNameNoTooltip] แห่งแฟชั่น""
 court_amenities_interactions.0012.a_lost:0 "ข้าถูกรายล้อมไปด้วยพวกประจบสอพลอและคนโง่!"
 court_amenities_interactions.0013.desc:1 "เมื่อเวลาผ่านไป หลายคนใน [debate_locale.GetNameNoTierNoTooltip] ได้เรียกข้าว่า [actor.GetTitleAsNameNoTooltip] แห่งแฟชั่น!"
 court_amenities_interactions.0013.a:0 "ทรงพระเจริญแด่ [actor.GetTitleAsNameNoTooltip]!"
 
