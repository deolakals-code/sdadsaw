 start_hunt_decision.tt.servants_prestige.reduced:0 "#N การขาดแคลน [Concept('court_amenities','Servants')|E] เพื่อไล่ต้อนสัตว์ป่าทำให้การล่าสัตว์ยากขึ้นและได้รับ [prestigious|E] น้อยลงหากผลลัพธ์ไม่เป็นที่น่าพอใจ#!"
 start_hunt_decision.tt.servants_prestige.increased:0 "#P การมี [Concept('court_amenities','Servants')|E] อย่างเพียบพร้อมช่วยไล่ต้อนสัตว์ได้ดีขึ้น ทำให้ได้รับ [prestige|E] มากขึ้นหากการล่าสัตว์สำเร็จลุล่วง#!"
 start_hunt_decision_master_of_hunt:0 "#P เนื่องจากท่านว่าจ้าง $master_of_hunt_court_position$ การล่าสัตว์ของท่านจึงมีแนวโน้มที่จะจบลงด้วยดีมากขึ้น#!"
 start_hunt_decision_confirm:0 "เป่าเขาสัตว์!"

