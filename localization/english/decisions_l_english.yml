 host_feast_decision_desc_court_musician_opinion:1 "#P เนื่องจากท่านว่าจ้าง $court_musician_court_position$ การเพิ่มขึ้นของค่าความเห็นจะมีความสำคัญยิ่งขึ้น#!"
 host_feast_decision_desc_shy:2 "#N ท่านจะไม่สูญเสีย [stress|E] เนื่องจากท่าน [GetTrait('shy').GetName( GetPlayer )] หรือ [GetTrait('reclusive').GetName( GetPlayer )]#!"
