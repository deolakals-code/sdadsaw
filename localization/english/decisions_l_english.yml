 convert_whole_realm_to_feudalism_west_african_pagan_decision:0 "$convert_whole_realm_to_feudalism_decision$ #weak (ลัทธินอกรีตแอฟริกาตะวันตก)#!"
 convert_whole_realm_to_feudalism_west_african_pagan_decision_desc:0 "การปกครองที่ดีเป็นเรื่องของขนาดที่เรียบง่าย เมืองอาจต้องการเพียงผู้อาวุโส แต่จักรวรรดิจำเป็นต้องมีผู้บริหาร — ผู้คนของเรารู้เรื่องนี้ และเราสามารถใช้ประโยชน์จากผู้มีการศึกษาในหมู่พวกเขาเพื่อจัดหาให้ได้"
 convert_whole_realm_to_feudalism_west_african_pagan_decision_confirm:0 "$convert_whole_realm_to_feudalism_decision_confirm$"
 convert_whole_realm_to_feudalism_west_african_pagan_decision_tooltip:0 "$convert_whole_realm_to_feudalism_decision_tooltip$"
