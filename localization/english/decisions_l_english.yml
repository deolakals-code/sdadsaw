 epidemic_events.0100.t: "การกักตัว"
 epidemic_events.0100.desc: "ถูกพาไปไกลจากกลิ่นเหม็นของใจกลางเมืองหลวงในยามค่ำคืน ข้าและครอบครัวอาจอยู่ห่างจากผู้คนในอาณาจักรจนกว่าจะถึงเวลาที่เหมาะสมที่จะออกมา\n\nการสื่อสารจะถูกจำกัด และบัลลังก์ของข้าจะรู้สึกว่างเปล่า แต่เราควรจะปลอดภัยจากความตายและการเน่าเปื่อยที่อยู่นอกกำแพงอันเรียบง่ายสี่ด้านของเรา"
 epidemic_events.0100.a: "ล็อกประตู"
 epidemic_events.0101.t: "ออกจากกรง"
 epidemic_events.0101.desc: "แสงอาทิตย์รู้สึกไม่คุ้นเคยและเป็นศัตรูบนผิวของข้า ลมรู้สึกเย็นและละเมิด\n\nครั้งสุดท้ายที่ข้าสูดอากาศบริสุทธิ์ดังที่ [ROOT.Char.GetFaith.HighGodName|U] ทรงสร้างคือเมื่อใด?"
 epidemic_events.0101.a: "ข้าดีใจเหลือเกินที่ได้กลับมา!"
 epidemic_events.0101.b: "ปิดประตู! ลมมันโกรก!"
 natural_disaster.0110.t: "การแยกตัวสันโดษ"
 natural_disaster.0110.desc: "ยามค่ำคืน ข้าและครอบครัวได้หลบหนีออกจากใจกลางเมืองหลวง เราอาจต้องอยู่ห่างไกลจากผู้คนในอาณาจักรในสถานที่ที่ปลอดภัยกว่า จนกว่าระเบียบแห่งธรรมชาติจะฟื้นฟูตนเอง\n\nการสื่อสารจะถูกจำกัด และบัลลังก์ของข้าจะว่างเปล่า แต่เราควรจะปลอดภัยจากพิโรธแห่งธรรมชาติ"
 natural_disaster.0110.a: "จงปิดประตู"
 natural_disaster.0111.t: "ออกจากกรงขัง"
 natural_disaster.0111.desc: "แสงแดดที่สัมผัสผิวกายรู้สึกแปลกหน้าและไม่เป็นมิตร สายลมรู้สึกเย็นเยือกและล่วงล้ำ\n\nครั้งสุดท้ายที่ข้าได้สูดอากาศที่ [ROOT.Char.GetFaith.HighGodName|U] สร้างขึ้นมานั้นคือเมื่อใดกัน?"
 natural_disaster.0111.a: "ข้ายินดีเพียงใดที่ได้กลับมา!"
