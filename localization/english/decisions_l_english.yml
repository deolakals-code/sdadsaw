 merge_aquitaine_decision_alt: "[GetTitleByKey('k_aquitaine').GetNameNoTierNoTooltip] เป็นหนึ่งเดียว"
 merge_aquitaine_decision_desc: "ผู้คนแห่ง [GetTitleByKey('k_france').GetNameNoTierNoTooltip] แตกแยกกันมานานเกินไป ทะเลาะวิวาทกันเรื่องพรมแดนและที่ดิน"
 merge_aquitaine_decision_desc_aquitaine: "ผู้คนแห่ง [GetTitleByKey('k_aquitaine').GetNameNoTierNoTooltip] แตกแยกกันมานานเกินไป ทะเลาะวิวาทกันเรื่องพรมแดนและที่ดิน"
 merge_aquitaine_decision_desc_outro: "จากแม่น้ำแซนทางตอนเหนือจรดเทือกเขาพิรินีทางตอนใต้ พวกเขาทั้งหมดจะต้องตอบสนองต่อ [ROOT.Char.GetTitleAsNameNoTooltip] ที่แท้จริงเพียงผู้เดียวของพวกเขา - #emp ข้า#!."
