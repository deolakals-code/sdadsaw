 FACTION_POWER_INTERNAL_ISSUES:0 "ฝ่ายที่มีอยู่: #V $VALUE|0$#!"
 FACTION_DEMAND_ACCEPT:0 "ข้าคงไม่มีทางเลือกอื่น..."
 FACTION_DEMAND_REFUSE:0 "ข้าจะไม่ยอมถูกคุกคาม!"
 FACTION_DEMAND_ACCEPTED_OPT:0 "เป็นการตัดสินใจที่ชาญฉลาด"
 FACTION_DEMAND_REFUSED_OPT:0 "เช่นนั้นก็ทำศึกสงคราม!"
 faction_demand.2004.opt_tt:1 "ข้าพเจ้าเข้าร่วมศึกสงครามต่อต้าน [faction_target.GetShortUIName]"
 FACTION_DEMAND_SEND_DEMAND_NOTIFICATION_OPT:0 "ส่งคำขาดไป!"
 FACTION_IMPRISONMENT_RETALIATION_WARNING:2 "#high การจองจำ [recipient.GetShortUIName] อาจยั่วยุให้ [retaliating_faction.GetName] ก่อกบฏได้!#!"
 faction_demand.9001.t:1 "[retaliating_faction.GetNameNoTooltip] โต้กลับ"
 FACTION_FAILED_IMPRISONMENT_RETALIATION:1 "[actor.GetShortUIName] ได้พยายามจองจำ [recipient.GetShortUIName] โดยมิชอบ ซึ่งเป็นหนึ่งในสมาชิกฝ่ายเดียวกันกับข้าพเจ้า"
 FACTION_SUCCESSFUL_IMPRISONMENT_RETALIATION:1 "[actor.GetShortUIName] ได้จองจำ [recipient.GetShortUIName] โดยมิชอบ ซึ่งเคยเป็นหนึ่งในสมาชิกฝ่ายเดียวกันกับข้าพเจ้า"
 FACTION_IMPRISONMENT_RETALIATION_END:0 "\n\nการโจมตีอันอุกอาจต่อ [retaliating_faction.GetName] เช่นนี้ ย่อมถือได้ว่าเป็นการกระทำอันเป็นปฏิปักษ์ และหากเราไม่ป้องกันตนเองเสีย แต่บัดนี้ เราย่อมถูกกำจัดทีละคนเป็นแน่แท้!"
 FACTION_IMPRISONMENT_RETALIATION_OPT:0 "สู่ศึกสงคราม!"

 # Independence Faction
 independence_faction:0 "$game_concept_independence_faction$"
 independence_faction_desc:0 "สมาชิกของ [faction|E] เรียกร้องเอกราช มุ่งหมายอิสรภาพจาก [liege|E] ของตน\n\n#S คำขาด#!\nสมาชิกฝ่ายทั้งหมดกลายเป็น [independent|E]\n[liege|E] สูญเสีย [prestige|E]"
 independence_faction_short_effect_desc:0 "ต้องการเอกราชจาก [liege|E] ของตน"

 nation_fracturing_faction:1 "ฝ่ายล่มสลายอาณาจักร"
 nation_fracturing_faction_desc:1 "สมาชิกของ $nation_fracturing_faction$ [faction|E] มุ่งหมายที่จะทำลายอาณาจักรของ [liege|E] ตน\n\n#S คำขาด#!\nสมาชิกฝ่ายทั้งหมดกลายเป็น [independent|E]\n[liege|E] สูญเสีย [primary_title|E] และ [titles|E] อื่น ๆ ที่มี [title_tier|E] เดียวกัน"
 nation_fracturing_faction_short_effect_desc:0 "ต้องการทำลายอาณาจักรของ [liege|E] ตน"
 liege_primary_title_dissolution:0 "บัดนี้ท่านเป็นเอกราชแล้ว!"
 liege_primary_title_dissolution_desc:0 "เจ้าเหนือหัวของท่านสูญเสีย [primary_title|E] เนื่องด้วย $nation_fracturing_faction$ [faction|E]"

 FACTION_DEMAND_COLLAPSE:1 "ข้อเรียกร้องให้ยุบ [faction_target.GetPrimaryTitle.GetNameNoTier]"
 FACTION_DEMAND_COLLAPSE_DESC:1 "[faction_leader.Custom2('AppropriateGreetingNegative', ROOT.Char)]\n\nถึงเวลาแล้วที่ท่านต้องยอมรับว่าท่านไม่สามารถรักษาเอกภาพของ [faction_target.GetPrimaryTitle.GetNameNoTier] ไว้ได้ ถึงเวลาที่จะยุติการปกครองของท่านหรือของผู้ใดก็ตาม ภูมิภาคนี้ต้องการอิสรภาพมากขึ้น จงยอมรับข้อเรียกร้องของเรา มิฉะนั้นจงเผชิญหน้ากับคมดาบของเราในสนามรบ!"
 FACTION_DEMAND_COLLAPSE_ACCEPTED:1 "ยอมรับข้อเรียกร้องให้ยุบอาณาจักรแล้ว"
 FACTION_DEMAND_COLLAPSE_ACCEPTED_DESC:1 "[faction_target.Custom2('AppropriateGreetingNegative', ROOT.Char)]\n\nข้อเรียกร้องอันผิดพลาดของท่านมี แต่จะ ทำให้เราทั้งมวลอ่อนแอลง อย่างไรก็ตาม เพื่อละเว้นอาณาจักรจากการเสียเลือดเนื้อโดยเปล่าประโยชน์ ข้าพเจ้าจำต้องยอมรับคำขอเอกราชของท่าน"
 FACTION_DEMAND_COLLAPSE_REFUSED:1 "ปฏิเสธข้อเรียกร้องให้ยุบอาณาจักร"
 FACTION_DEMAND_COLLAPSE_REFUSED_DESC:0 "[faction_target.Custom2('AppropriateGreetingNegative', ROOT.Char)]\n\nความพยายามขู่กรรโชกอันน่าละอายของท่านไม่ประสบผลสำเร็จ ไม่ว่าท่านจะชักจูงคนชั่วช้าได้มากเพียงใดเพื่อช่วยให้แผนการของท่านลุล่วง ข้าพเจ้าก็จะไม่ยอมจำนนโดยไม่ต่อสู้ ข้ายอมตายเพื่อปกป้องสิทธิ์อันชอบธรรมของข้าพเจ้าดีกว่า!"
 FACTION_DEMAND_COLLAPSE_SEND_DEMAND_NOTIFICATION:1 "อวสานแห่ง [faction_target.GetPrimaryTitle.GetNameNoTier]!"
 FACTION_DEMAND_COLLAPSE_SEND_DEMAND_NOTIFICATION_DESC:0 "ถึงเวลาแล้ว! เสียงอันเป็นเอกฉันท์ของ [faction.GetName] เห็นพ้องต้องกันว่า [faction_target.GetName] ได้สูญเสียสิทธิ์ในการปกครองใด ๆ ที่ [faction_target.GetSheHe] อาจเคยมีไปแล้ว พวกเราจะต้องได้รับเอกราช หรือ มิฉะนั้นก็จะยึดครองมันมาด้วยกำลัง!"
 faction_demand.1002.tt:1 "[faction_target.GetPrimaryTitle.GetNameNoTier] ถูกทำลาย"

 FACTION_DEMAND_INDEPENDENCE:0 "ข้อเรียกร้องเอกราช"
 FACTION_DEMAND_INDEPENDENCE_DESC:0 "[faction_leader.Custom2('AppropriateGreetingNegative', ROOT.Char)]\n\nถึงเวลาแล้วที่ท่านต้องยอมรับเอกราชโดยสมบูรณ์ของ [faction_leader.GetPrimaryTitle.GetNameNoTier] และรัฐอื่น ๆ ใน [faction.GetName] จงยอมรับข้อเรียกร้องของเรา มิฉะนั้นจงเผชิญหน้ากับคมดาบของเราในสนามรบ!"
 FACTION_DEMAND_INDEPENDENCE_ACCEPTED:0 "ยอมรับข้อเรียกร้องเอกราชแล้ว"
 FACTION_DEMAND_INDEPENDENCE_ACCEPTED_DESC:1 "[faction_target.Custom2('AppropriateGreetingNegative', ROOT.Char)]\n\nข้อเรียกร้องอันผิดพลาดของท่านมี แต่จะ ทำให้เราทั้งมวลอ่อนแอลง อย่างไรก็ตาม เพื่อละเว้นอาณาจักรจากการเสียเลือดเนื้อโดยเปล่าประโยชน์ ข้าพเจ้าจำต้องยอมรับคำขอเอกราชของท่าน"
 FACTION_DEMAND_INDEPENDENCE_REFUSED:0 "ปฏิเสธข้อเรียกร้องเอกราช"
 FACTION_DEMAND_INDEPENDENCE_REFUSED_DESC:0 "[faction_target.Custom2('AppropriateGreetingNegative', ROOT.Char)]\n\nความพยายามขู่กรรโชกอันน่าละอายของท่านไม่ประสบผลสำเร็จ ไม่ว่าท่านจะชักจูงคนชั่วช้าได้มากเพียงใดเพื่อช่วยให้แผนการของท่านลุล่วง ข้าพเจ้าก็จะไม่ยอมจำนนโดยไม่ต่อสู้ ข้ายอมตายเพื่อปกป้องสิทธิ์อันชอบธรรมของข้าพเจ้าดีกว่า!"
 FACTION_DEMAND_INDEPENDENCE_SEND_DEMAND_NOTIFICATION:0 "เอกราช!"
 FACTION_DEMAND_INDEPENDENCE_SEND_DEMAND_NOTIFICATION_DESC:0 "ถึงเวลาแล้ว! เสียงอันเป็นเอกฉันท์ของ [faction.GetName] เห็นพ้องต้องกันว่า [faction_target.GetName] ได้สูญเสียสิทธิ์ในการปกครองใด ๆ ที่ [faction_target.GetSheHe] อาจเคยมีไปแล้ว พวกเราจะต้องได้รับเอกราช หรือ มิฉะนั้นก็จะยึดครองมันมาด้วยกำลัง!"
 faction_demand.0002.tt:0 "สมาชิกฝ่ายทั้งหมดได้รับเอกราช!"
 
 FACTION_DEMAND_BRIBE_CO_EMPEROR: "แน่ละว่าการ แต่งตั้งให้ดำรงตำแหน่งยังคงบังคับให้พวกเขาร่วมมือได้กระมัง?"
 FACTION_DEMAND_BRIBE_CO_EMPEROR_REASON: "[faction_leader.GetShortUIName|U] ต้องเป็น [claimant|E] ของ [faction|E] #weak ([faction.GetSpecialCharacter.GetTitledFirstName])#!"
 faction_demand.0000.faction_leader_accepts: "หากผู้นำของพวกเขายอมรับข้อเสนอของท่าน"
 faction_demand.0000.faction_leader_rejects: "หากผู้นำของพวกเขาปฏิเสธข้อเสนอของท่าน"
 faction_demand.0000.enter_co_rule_avoiding_worst_effects: "[faction_target.GetShortUIName|U] แต่งตั้ง[_s(faction_target)] [faction_leader.GetShortUIName] เป็น [co_emperor|E] ของ [CharYourHerHis(faction_target)] หลีกเลี่ยงผลกระทบที่เลวร้ายที่สุดของ [faction.GetName]"
 faction_demand.0000.truce_from_co_rule: "[faction_target.GetShortUIName|U] ได้รับ[_s(faction_target)] [truce|E] เป็นเวลา [EmptyScope.ScriptValue('faction_counter_offer_appointed_co_emperor_value')] ปี กับสมาชิก [faction|E] ทุกคน"
 ep3_truce_appointed_faction_leader_coruler: "การสงบศึกหลังผู้นำฝ่ายได้รับการเลื่อนตำแหน่งเป็นผู้ปกครองร่วม"

 FACTION_DEMAND_COUNTER_OFFER_CORULE: "ข้อเสนอโต้กลับจากฝ่าย"
 FACTION_DEMAND_COUNTER_OFFER_CORULE_DESC: "[faction_target.Custom2('AppropriateGreetingNegative', ROOT.Char)]\n\nข้อเรียกร้องของท่านมีเหตุผล — บางทีอาจแสดงให้เห็นข้อผิดพลาดในการตัดสินใจของข้าเอง ลดอาวุธของท่านลงและเข้าร่วมกับข้าในฐานะจักรพรรดิร่วม [faction_target.GetTitleAsNameNoTooltip] ของข้า และเราจะปกครอง [faction_target.GetPrimaryTitle.GetDefinitiveName] ร่วมกัน!"
 FACTION_DEMAND_COUNTER_OFFER_CORULE_ACCEPT: "ข้อเสนอที่ข้าพเจ้ามิอาจปฏิเสธ..."
 FACTION_DEMAND_COUNTER_OFFER_CORULE_REJECT: "บาห์! ไม่ต่างอะไรกับจอกยาพิษ!"
 faction_demand.0000.offer_accepted: "ยอมรับข้อเสนอโต้กลับแล้ว"
 faction_demand.0000.enter_co_emperorship: "[faction_leader.GetFirstName] กลายเป็น [co_emperor|E] ของท่าน"
 faction_demand.0000.offer_rejected: "ปฏิเสธข้อเสนอโต้กลับ"

 FACTION_DEMAND_COUNTER_OFFER_CORULE_MEMBER_NOTIFICATION: "ผู้นำฝ่ายได้รับการเลื่อนตำแหน่ง"
 FACTION_DEMAND_COUNTER_OFFER_CORULE_MEMBER_NOTIFICATION_DESC: "[faction_leader.Custom2('AppropriateGreetingNegative', ROOT.Char)]\n\nข้ายินดีที่จะรายงานว่า [faction_target.GetTitledFirstName] ได้เปลี่ยนมาเห็นด้วยกับแนวคิดของเราแล้ว [faction_target.GetSheHe|U] ได้ แต่งตั้ง #EMP ข้า#! เป็นจักรพรรดิร่วม [faction_target.GetTitleAsNameNoTooltip] และข้าได้ตกลงว่าเราจะวางดาบของเราลง มีผลบังคับใช้ทันที"
 FACTION_DEMAND_COUNTER_OFFER_MEMBER_NOTIFICATION.A: "เราเกือบจะสำเร็จแล้วเชียว..."
 FACTION_DEMAND_COUNTER_OFFER_MEMBER_NOTIFICATION.B: "เจ้าคนโง่เขลาเห็นแก่ตัวนั่น!"

 # Peasant Faction
 peasant_faction:0 "ฝ่ายไพร่"
 peasant_faction_desc:0 "[faction|E] ชาวนาต้องการอิสรภาพสำหรับประชาชนจากการปกครองของต่างชาติหรือผู้ไม่เชื่อ และจะพยายามแทนที่เจ้าเหนือหัวที่ไม่ร่วม [culture|E] และ [faith|E] เดียวกันกับสามัญชนใน [counties|E]"
 peasant_faction_short_effect_desc:0 "ต้องการลด [county_control|E]"
 peasant_faction_every_county:0 "[county|E] ทุกแห่งของ [faction|E]"
 peasant_faction_spawn_county_levies:0 "ระดม [army|E] [new_title.GetAdjective] ตามสัดส่วนของ [levies|E]"
 FACTION_DEMAND_PEASANT:1 "ถึง [ROOT.Char.Custom2('InsultAdjective', ROOT.Char)] [ROOT.Char.GetTitledFirstName]"
 FACTION_DEMAND_PEASANT_DESC:0 "พวกเราแบกรับภาระกฎหมายอันกดขี่ของท่านมานานเกินไปแล้ว พอที! เราจะยุติการส่งส่วยให้ท่าน\n\nเมื่อใดที่ท้องพระคลังของท่านว่างเปล่าและยุ้งฉางของท่านหมดสิ้น ท่านจะนึกเสียใจที่มิได้ปฏิบัติต่อเราอย่างเป็นธรรมมากกว่านี้"
 FACTION_DEMAND_PEASANT_ACCEPT:0 "ข้าคงอนุญาตให้ผ่อนผันภาษีได้กระมัง..."
 FACTION_DEMAND_PEASANT_REFUSE:0 "ไม่มีวัน! หน้าที่ของไพร่คือรับใช้นายเหนือหัว!"
 FACTION_PEASANT_NAME:0 "กลุ่มไพร่ก่อจลาจล"
 FACTION_PEASANT_TITLE_NAME:0 "การกบฏของไพร่"

 # Nomadic Faction
 nomadic_faction: "ฝ่ายอนาจร"
 nomadic_faction_desc: "ฝ่าย [faction|E] อนาจรต้องการถูกปกครองโดย [ruler|E] แบบ [GetGovernment( 'nomad_government' ).GetName] ซึ่ง [yurt|E] ของเขามี [culture|E] และ [faith|E] เดียวกันกับพวกเขา"
 nomadic_faction_short_effect_desc: "ต้องการสถาปนาใหม่ ซึ่ง [realms|E] แบบ [GetGovernment( 'nomad_government' ).GetName]"
 FACTION_DEMAND_NOMADIC: "ถึง [ROOT.Char.Custom2('InsultAdjective', SCOPE.sC('peasant_leader'))] [ROOT.Char.GetTitledFirstName]"
 FACTION_DEMAND_NOMADIC_DESC: "พวกเราจะไม่ยอมก้มหัวภายใต้แอกการกดขี่ของท่านอีกต่อไป! พวกเรา, เหล่า [peasant_leader.GetCulture.GetCollectiveNoun] ผู้หยิ่งทะนงในวิถี [GetGovernment( 'nomad_government' ).GetName], เกิดมาเพื่อท่องเที่ยวอย่างอิสระภายใต้ผืนฟ้าอันไร้ขอบเขตนี้\n\nโดยมี [peasant_leader.GetFaith.WarGodName] นำทางเหล่านักรบอาชาของเรา, เราจักต้องทลายการปกครองอันน่าสมเพชของท่าน และทวงคืนถิ่นฐานของเราบนทุ่งสเตปป์อันเปิดกว้าง!"
 FACTION_DEMAND_NOMADIC_ACCEPT_GRANT_INDEPENDENCE: "ก็ได้! อาณาจักรของข้าไม่มีที่สำหรับฝูงสัตว์อันไม่ชำระล้างของพวกเจ้าดอก"
 FACTION_DEMAND_NOMADIC_VASSAL_DESC: "พวกเราจะไม่ทนต่อการกดขี่อันชั่วร้ายของท่านที่มีต่อเหล่า [peasant_leader.GetFaith.GetAdherentNamePlural] ชาว [peasant_leader.GetCulture.GetName] ผู้หยิ่งทะนงอีกต่อไป เราผู้เกิดมาเพื่อท่องเที่ยวอย่างอิสระภายใต้ผืนฟ้าอันเปิดกว้างนี้ ขอปฏิเสธอำนาจบาตรใหญ่ของท่าน — เวลาของเรามาถึงแล้ว!\n\nเราจักสลัดทิ้งการปกครองของท่านและของเจ้าเหนือหัวของท่าน, [faction_target.GetTitledFirstName], ให้สิ้นซากไปเสียที!!"
 FACTION_DEMAND_NOMADIC_VASSAL_JOIN_WAR: "เช่นนั้นข้าจักขอพบพวกเจ้าในสนามรบ, #EMP เจ้าเหล่าคนเถื่อน#!!"

 # Populist Faction
 populist_faction:0 "ฝ่ายประชานิยม"
 populist_faction_desc:1 "[faction|E] ประชานิยม ต้องการอิสรภาพจากการปกครองของต่างชาติหรือพวกนอกรีต และจะแสวงหาเอกราชจากเจ้าเหนือหัวที่ไม่มี [culture|E] หรือ [faith|E] เดียวกันกับตน"
 populist_faction_short_effect_desc:0 "ต้องการเอกราชจาก [liege|E] ของตน"
 populist_faction_short_effect_desc_admin: "ต้องการให้ [state_faith|E] ตรงกับของตนเอง"
 FACTION_DEMAND_POPULIST:0 "ถึง [ROOT.Char.Custom2('InsultAdjective', SCOPE.sC('peasant_leader'))] [ROOT.Char.GetTitledFirstName]"
 FACTION_DEMAND_POPULIST_DESC_ADMIN: "เราจะไม่อนุญาตให้มีการกดขี่ใด ๆ อีกต่อไปจากการปกครอง [ROOT.Char.Custom2('GetUnbelieverTermAdjective', peasant_leader)] ของท่าน [peasant_leader.GetFaith.GetName|U] จะต้องได้รับการยอมรับว่าเป็นศาสนาอันเป็นเอกของ [ROOT.Char.GetPrimaryTitle.GetName]!\n\nจงมอบสถานะอันชอบธรรมที่ศาสนาของเราสมควรได้รับ มิฉะนั้นจงเตรียมเผชิญหน้ากับโทสะของเหล่าผู้ศรัทธาจำนวนมากของเรา!"
 FACTION_DEMAND_POPULIST_DESC_CULTURE:0 "เราจะไม่ทนต่อการกดขี่ประเพณี [peasant_leader.GetCulture.GetName] โดยชาวต่างชาติอีกต่อไป บัดนี้ถึงเวลาของเราแล้ว!\n\nจงมอบสิทธิ์ให้เราปกครองตนเองตามที่เราเห็นสมควร มิฉะนั้นจงเผชิญหน้ากับโทสะของปวงชนร่วมชาติข้าพเจ้า!"
 FACTION_DEMAND_POPULIST_DESC_FAITH:0 "เราจะไม่ทนต่อการกดขี่อันชั่วร้ายของท่านต่อเหล่า [peasant_leader.GetFaith.GetAdherentNamePlural] ผู้มีศรัทธาอีกต่อไป บัดนี้ถึงเวลาของเราแล้ว!\n\nโดยมี [peasant_leader.GetFaith.WarGodName] นำทางเรา เราจะลุกฮือขึ้นและปลดปล่อยตนเองจากการปกครอง [ROOT.Char.Custom2('GetUnbelieverTermAdjective', peasant_leader)] ของท่าน!"
 FACTION_DEMAND_POPULIST_DESC:0 "เราจะไม่ทนต่อการกดขี่อันชั่วร้ายของท่านต่อเหล่า [peasant_leader.GetFaith.GetAdherentNamePlural] ชาว [peasant_leader.GetCulture.GetName] ผู้ดีงามอีกต่อไป บัดนี้ถึงเวลาของเราแล้ว!\n\nโดยมี [peasant_leader.GetFaith.WarGodName] นำทางเรา เราจะลุกฮือขึ้นและปลดปล่อยตนเองจากการปกครอง [ROOT.Char.Custom2('GetUnbelieverTermAdjective', peasant_leader)] ของท่าน!"
 FACTION_DEMAND_POPULIST_ACCEPT_CONVERT:0 "เดี๋ยวก่อน... จะเป็น เช่นไรหากข้าพเจ้าเปลี่ยนมารับวิถีของท่านแทน?"
 FACTION_DEMAND_POPULIST_ACCEPT_CONVERT_STATE_FAITH: "[peasant_leader.GetFaith.GetNameNoTooltip|U] จะได้รับเกียรตินี้"
 FACTION_DEMAND_POPULIST_ACCEPT_GRANT_INDEPENDENCE:0 "เอาเถิด ข้าพเจ้าไม่ต้องการข้าแผ่นดินเจ้าปัญหา เช่นนี้!"
 FACTION_DEMAND_POPULIST_ACCEPT_GRANT_INDEPENCE_TT:0 "#N การกระทำนี้จะทำให้ท่านไร้ที่ดิน!#!"
 FACTION_DEMAND_POPULIST_REFUSE:0 "เจ้าต้องการอิสรภาพรึ? เจ้าจะได้มันในความตาย!"
 FACTION_DEMAND_POPULIST_REFUSE_ADMIN: "การเปลี่ยนแปลง เช่นนี้มิใช่สิ่งที่เจ้าจะทำได้ เจ้า [peasant_leader.Custom2('InsultNoun', ROOT.Char)] ผู้บังอาจ!"
 FACTION_DEMAND_POPULIST_REFUSE_TT:0 "#high [peasant_leader.GetTitledFirstName]#! และ #high [faction.GetName]#! ประกาศ [war|E] ต่อท่าน"
 FACTION_POPULIST_REVOLT_TITLE_NAME:0 "การลุกฮือของฝ่ายประชานิยม"
 FACTION_NOMADIC_REVOLT_TITLE_NAME: "กบฏชาวอนาจร"
 FACTION_POPULIST_CREATED_TITLE_NAME:0 "ชาว [founder_culture.GetCollectiveNounNoTooltip]"
 FACTION_DEMAND_POPULIST_VASSAL_DESC_SAME_CULTURE_AND_FAITH:0 "เจ้าอาจมีประเพณีและความเชื่อร่วมกับเรา แต่พวกเรามิอาจทนเจ้าหรือ [faction_target.Custom2('InsultAdjective', SCOPE.sC('peasant_leader'))] [faction_target.GetTitledFirstName] ได้อีกต่อไป!\n\nจงหลีกทางเสีย หรือ มิฉะนั้นก็จงช่วยพวกเราให้ได้มา ซึ่งอิสรภาพที่พวกเราสมควรได้รับ!"
 FACTION_DEMAND_POPULIST_VASSAL_DESC_CULTURE:0 "เราจะไม่ทนต่อการกดขี่ประเพณี [peasant_leader.GetCulture.GetName] โดยชาวต่างชาติอีกต่อไป บัดนี้ถึงเวลาของเราแล้ว!\n\nเราจะไม่เรียกร้องสิ่งใดน้อยไปกว่าอิสรภาพโดยสมบูรณ์จากเจ้าเหนือหัวของท่าน [faction_target.GetTitledFirstName]!"
 FACTION_DEMAND_POPULIST_VASSAL_DESC_FAITH:0 "เราจะไม่ทนต่อการกดขี่อันชั่วร้ายของท่านต่อเหล่า [peasant_leader.GetFaith.GetAdherentNamePlural] ผู้มีศรัทธาอีกต่อไป บัดนี้ถึงเวลาของเราแล้ว!\n\nโดยมี [peasant_leader.GetFaith.WarGodName] นำทางเรา เราจะลุกฮือขึ้นและปลดปล่อยตนเองจากการปกครองของเจ้าเหนือหัวของท่าน [faction_target.GetTitledFirstName]!"
 FACTION_DEMAND_POPULIST_VASSAL_DESC:0 "เราจะไม่ทนต่อการกดขี่อันชั่วร้ายของท่านต่อเหล่า [peasant_leader.GetFaith.GetAdherentNamePlural] ชาว [peasant_leader.GetCulture.GetName] ผู้ดีงามอีกต่อไป บัดนี้ถึงเวลาของเราแล้ว!\n\nเราจะปลดปล่อยตนเองจากการปกครองของท่านและทรราชย์ของเจ้าเหนือหัวของท่าน [faction_target.GetTitledFirstName]!"
 FACTION_DEMAND_POPULIST_VASSAL_JOIN_REBELS:0 "ให้ข้าพเจ้าเข้าร่วมอุดมการณ์ของท่าน!"
 FACTION_DEMAND_POPULIST_VASSAL_CONVERTS:0 "เดี๋ยวก่อน! จะเป็น เช่นไรหากข้าพเจ้าเปลี่ยนมารับวิถีของท่านและ #EMP ช่วยเหลือ#! ท่าน?"
 FACTION_DEMAND_POPULIST_VASSAL_CONVERTS_TT:0 "ท่านจะเข้าข้างฝ่ายกบฏต่อต้าน [liege|E] ของท่าน"
 FACTION_DEMAND_POPULIST_VASSAL_JOIN_WAR:0 "เช่นนั้น ข้าพเจ้าจะพบกับท่านในสนามรบ เจ้า #EMP คนทรยศ#!!"
 FACTION_DEMAND_POPULIST_VASSAL_JOIN_WAR_BLOCK_TT:0 "ท่านไม่สามารถเข้าร่วมสงครามได้ เนื่องจากท่านกำลังทำสงครามกับผู้เข้าร่วมอื่นอยู่แล้ว"
 FACTION_DEMAND_POPULIST_VASSAL_JOIN_WAR_BLOCK_TT_2:0 "ท่านไม่สามารถเข้าร่วมสงครามได้ เนื่องจากจะ ทำให้ท่านต้องทำสงครามกับพันธมิตรในสงครามอื่น"
 FACTION_DEMAND_POPULIST_VASSAL_JOIN_WAR_TT:0 "ท่านจะช่วยเหลือ [liege|E] ของท่านต่อต้านฝ่ายกบฏ"
 FACTION_DEMAND_POPULIST_VASSAL_TAKE_NO_SIDE:0 "ข้าพเจ้าไม่ขอเกี่ยวข้องจะดีกว่า..."
 FACTION_DEMAND_POPULIST_VASSAL_TAKE_NO_SIDE_TT_A:0 "ท่านไม่ได้เข้าร่วม #high [populist_war.GetName]#!"
 FACTION_DEMAND_POPULIST_VASSAL_TAKE_NO_SIDE_TT_B:0 "#N ท่านจะสูญเสียส่วนหนึ่งของอาณาจักรท่านหากเจ้าเหนือหัวของท่านยอมจำนนต่อข้อเรียกร้องของพวกเขา!#!"
 POPULIST_FACTION_INDEPENDENCE_TITLE:0 "ได้รับเอกราช"
 POPULIST_FACTION_INDEPENDENCE_DESC:0 "ท่านได้รับเอกราชจาก [faction_target.GetTitledFirstName] อันเป็นผลมาจาก [popular_faction|E]"
 VASSAL_JOINS_LIEGE_TOOLTIP:0 "#high [vassal_to_join_liege.GetTitledFirstName]#! เข้าร่วมสงครามในฝ่ายของท่านในฐานะฝ่ายตั้งรับ"
 VASSAL_JOINS_REBELS_TOOLTIP:0 "#high [vassal_to_join_rebels.GetTitledFirstName]#! เข้าร่วมสงครามในฝ่ายกบฏในฐานะฝ่ายรุก"
 populist_faction_same_culture_faith_as_liege:0 "ไม่สามารถมี [culture|E] และ [faith|E] เดียวกันกับ [liege|E] ของท่านได้"

 # Liberty Faction
 liberty_faction:0 "ฝ่ายเรียกร้องเสรีภาพ"
 liberty_faction_desc:0 "[faction|E] เรียกร้องเสรีภาพ มุ่งหมายที่จะลด [crown_authority|E], [tribal_authority|E], หรือ [imperial_bureaucracy|E] แต่สมาชิกยังคงภักดีต่อ [realm|E] เป็นอย่างอื่น"
 liberty_faction_desc_admin: "[faction|E] เรียกร้องเสรีภาพ มุ่งหมายที่จะลด [imperial_bureaucracy|E] แต่สมาชิกยังคงภักดีต่อ [realm|E] เป็นอย่างอื่น"
 liberty_faction_desc_tribal: "[faction|E] เรียกร้องเสรีภาพ มุ่งหมายที่จะลด [tribal_authority|E] แต่สมาชิกยังคงภักดีต่อ [realm|E] เป็นอย่างอื่น"
 liberty_faction_desc_feudal: "[faction|E] เรียกร้องเสรีภาพ มุ่งหมายที่จะลด [crown_authority|E] แต่สมาชิกยังคงภักดีต่อ [realm|E] เป็นอย่างอื่น"
 liberty_faction_short_effect_desc:0 "ต้องการลด [crown_authority|E]"
 liberty_faction_short_effect_desc_admin: "ต้องการลด [imperial_bureaucracy|E]"
 liberty_faction_short_effect_desc_tribal: "ต้องการลด [tribal_authority|E]"
 FACTION_DISCONTENT_CA_1:0 "พระราชอำนาจจำกัด: #V $VALUE|0$%#!"
 FACTION_DISCONTENT_CA_2:0 "พระราชอำนาจสูง: #V $VALUE|0$%#!"
 FACTION_DISCONTENT_CA_3:0 "พระราชอำนาจเบ็ดเสร็จ: #V $VALUE|0$%#!"
 FACTION_DEMAND_LIBERTY:0 "ข้อเรียกร้องเสรีภาพ"
 FACTION_DEMAND_LIBERTY_DESC:0 "[faction_leader.Custom2('AppropriateGreetingNegative', ROOT.Char)]\n\nถึงเวลาแล้วที่ท่านต้องยอมรับสิทธิอันเก่าแก่และมิอาจเพิกถอนได้ของเหล่าข้าหลวงของท่าน! จงยอมรับข้อเรียกร้องของ [faction.GetName] มิฉะนั้นจงเผชิญหน้ากับคมดาบของเราในสนามรบ!"
 FACTION_DEMAND_LIBERTY_ACCEPTED:0 "ยอมรับข้อเรียกร้องเสรีภาพแล้ว"
 FACTION_DEMAND_LIBERTY_ACCEPTED_DESC:0 "[faction_target.Custom2('AppropriateGreetingNegative', ROOT.Char)]\n\nความคิดเรื่อง 'เสรีภาพ' อันเห็นแก่ตัวของท่านจะ ทำให้อาณาจักรโดยรวมอ่อนแอลง อย่างไรก็ตาม เพื่อหลีกเลี่ยงการเสียเลือดเนื้อโดยเปล่าประโยชน์ ข้าพเจ้าจะยอมรับข้อเรียกร้องของท่าน"
 faction_demand.0102.tt:0 "[crown_authority|E] ของเจ้าเหนือหัวท่านถูกลดลง!"
 FACTION_DEMAND_LIBERTY_REFUSED:0 "ปฏิเสธข้อเรียกร้องเสรีภาพ"
 FACTION_DEMAND_LIBERTY_REFUSED_DESC:0 "[faction_target.Custom2('AppropriateGreetingNegative', ROOT.Char)]\n\nความพยายามอันน่าขันของเจ้าที่จะข่มขู่ข้า จักไม่มีวันสำเร็จ ข้าคือ [faction_target.GetTitleAsNameNoTooltip]! เจ้าพวกกบฏผู้น่าสมเพช จักได้เรียนรู้ที่ทางของตนในสนามรบ!"
 FACTION_DEMAND_LIBERTY_SEND_DEMAND_NOTIFICATION:0 "เสรีภาพหรือความตาย!"
 FACTION_DEMAND_LIBERTY_SEND_DEMAND_NOTIFICATION_DESC:0 "ถึงเวลาแล้ว! เหล่าขุนนางใน [faction.GetName] เห็นพ้องต้องกันว่า [faction_target.GetName] คือทรราชที่ต้องยอมลดอำนาจทรราชย์ [faction_target.GetHerHis] ที่มีเหนือพวกเรา... หากจำเป็นก็ต้องใช้คมดาบ"

 # Claimant faction
 claimant_faction:0 "ฝ่ายผู้อ้างสิทธิ์"
 claimant_faction_desc:0 "สมาชิกของ [faction|E] ผู้อ้างสิทธิ์ สนับสนุนผู้อ้างสิทธิ์ในราชบัลลังก์ที่มุ่งหมายบรรดาศักดิ์ที่เป็นของ [liege|E] ของตน"
 claimant_faction_short_effect_desc:0 "ต้องการ [ROOT.Faction.GetSpecialTitle.GetDefinitiveName|l]"
 FACTION_DEMAND_CLAIMANT:0 "ข้อเรียกร้องของผู้อ้างสิทธิ์"
 FACTION_DEMAND_CLAIMANT_DESC:0 "[faction_leader.Custom2('AppropriateGreetingNegative', ROOT.Char)]\n\nสิทธิ์ในการปกครอง [faction_targeted_title.GetNameNoTier] เป็นของ [faction_claimant.GetName] โดยสิทธิ์อันสวรรค์ประทาน และเราได้รวบรวมการสนับสนุนที่จำเป็นเพื่อ ทำให้มันเป็น เช่นนั้นแล้ว จงยอมรับความจริงนี้โดยดี มิฉะนั้นเราจะบังคับให้ท่านยอมรับด้วยกำลัง!"
 FACTION_DEMAND_CLAIMANT_DESC_ME:0 "สิทธิ์ในการปกครอง [faction_targeted_title.GetNameNoTier] เป็นของข้าพเจ้าโดยสิทธิ์อันสวรรค์ประทาน และในที่สุดข้าพเจ้าก็มีหนทางที่จะ ทำให้มันเป็น เช่นนั้นแล้ว จงยอมรับความจริงนี้โดยดี มิฉะนั้นข้าพเจ้าจะบังคับให้ท่านยอมรับด้วยกำลัง!"
 FACTION_DEMAND_CLAIMANT_ACCEPTED:0 "ยอมรับข้อเรียกร้องของผู้อ้างสิทธิ์แล้ว"
 FACTION_DEMAND_CLAIMANT_ACCEPTED_DESC:0 "เป็นที่ประจักษ์แก่ข้าแล้วว่า พวกเจ้าคงยอมเห็นอาณาจักรลุกเป็นไฟ ดีกว่าล้มเลิกการกระทำอันโง่เขลานี้ เพื่อประโยชน์สุขแห่ง [ROOT.Char.GetTopLiege.GetPrimaryTitle.GetBaseNameNoTierNoTooltip] ข้าจำต้องยอมรับข้อเรียกร้องของพวกเจ้า แต่จงรู้ไว้ว่า ความอยุติธรรมครั้งใหญ่ได้บังเกิดขึ้น ณ ที่นี้ในวันนี้ เรื่องนี้จะปล่อยไว้ เช่นนี้มิได้!"
 FACTION_DEMAND_CLAIMANT_REFUSED:0 "ปฏิเสธข้อเรียกร้องของผู้อ้างสิทธิ์"
 FACTION_DEMAND_CLAIMANT_REFUSED_DESC:1 "สิทธิ์อ้างในบรรดาศักดิ์ของข้าพเจ้าของ [faction_claimant.GetShortUINamePossessive|U] ไม่ต่างอะไรกับนิทานที่เราเล่าให้เด็กฟังยามค่ำคืน ไม่ว่าท่านจะรวบรวมคนโง่เขลาที่หลงผิดได้มากเพียงใดเพื่อช่วยดำเนินแผนการของท่าน ข้าพเจ้าก็จะไม่ยอมจำนนต่อพวกสวะ เช่นนี้ ข้ายอมตายดีกว่าที่จะเห็นสิทธิ์โดยกำเนิดของข้าพเจ้าตกไปอยู่ในมือของคนชั้นต่ำ เช่นนี้!"
 FACTION_DEMAND_CLAIMANT_SEND_DEMAND_NOTIFICATION:0 "สิทธิ์อ้างอันชอบธรรม!"
 FACTION_DEMAND_CLAIMANT_SEND_DEMAND_NOTIFICATION_DESC:1 "ถึงเวลาแล้ว! ทุกผู้ที่สนับสนุน [faction_claimant.GetName] ในฐานะผู้ปกครองโดยชอบธรรมของ [faction_targeted_title.GetNameNoTier] จักลุกขึ้นพร้อมเพรียงกันบัดนี้ และ ทำให้มั่นใจว่า [faction_claimant.GetSheHe] สามารถขึ้นครองบัลลังก์อันชอบธรรม [faction_claimant.GetHerHis] ได้ เราจะ ทำให้สำเร็จ แม้ต้องใช้ดาบและเปลวเพลิงก็ตาม!"
 FACTION_CLAIMANT_INVITE:1 "[faction_invite_from.Custom2('AppropriateGreeting', ROOT.Char)]"
 FACTION_CLAIMANT_INVITE_DESC:0 "[faction_target.GetName] ครอบครองบัลลังก์ที่ควรเป็นของท่านโดยชอบธรรม! ข้าพเจ้ายินดีที่จะสนับสนุนสิทธิ์อ้างของท่านทั้งด้วยวาจาและคมดาบ และข้าพเจ้ามั่นใจว่าผู้อื่นในอาณาจักรก็จะสนับสนุนอุดมการณ์อันชอบธรรมนี้ เช่นกัน สิ่งที่ท่านต้องทำมีเพียงแค่ยอมรับ"
 FACTION_CLAIMANT_INVITE_ACCEPT:0 "ในที่สุด!"
 FACTION_CLAIMANT_INVITE_REFUSE:0 "มันไม่ถูกต้อง..."
 FACTION_CLAIMANT_INVITE_ACCEPTED:1 "[faction_claimant.Custom2('AppropriateGreeting', ROOT.Char)]"
 FACTION_CLAIMANT_INVITE_ACCEPTED_DESC:0 "ในที่สุด! [faction_target.GetName] ก็เป็นเพียงตัวตลกที่สวมบทบาท [faction_target.GetTitleAsNameNoTooltip] และข้าพเจ้ามั่นใจว่าอาณาจักรจะลุกขึ้นสนับสนุนอุดมการณ์ของข้าพเจ้า ผู้ที่ช่วยเหลือข้าพเจ้าจะไม่ถูกลืมเลือน"
 FACTION_CLAIMANT_INVITE_ACCEPTED_OPT:0 "มันเป็นเพียงเรื่องของเวลา..."

 FACTION_CLAIMANT_INVITE_REFUSED:1 "[faction_claimant.Custom2('AppropriateGreeting', ROOT.Char)]"
 FACTION_CLAIMANT_INVITE_REFUSED_ALLY_DESC:0 "สิทธิ์อ้างของข้าพเจ้าชอบธรรม ข้อนี้ข้าพเจ้าทราบดี แต่พันธมิตรของข้าพเจ้ากับ [faction_target.GetTitledFirstName] ทำให้ข้าพเจ้าไม่อาจทำสงครามได้ ข้าพเจ้าจะอยู่กับท่านด้วยใจ"
 FACTION_CLAIMANT_INVITE_REFUSED_HOOK_DESC:0 "แม้ว่าสิทธิ์อ้างของข้าพเจ้าจะชอบธรรม ข้าพเจ้า... ก็ไม่อาจเข้าร่วมกับท่านได้ [faction_target.GetTitledFirstName] มี... #emphasis 'เสน่ห์อันมิอาจปฏิเสธได้'#! นั้น ซึ่ง ทำให้ข้าพเจ้าไม่อาจยกมือต่อต้าน [faction_target.GetHerHim] ได้เลย ใช่แล้ว เป็น เช่นนั้น ข้าพเจ้าขอให้ท่านโชคดี"
 FACTION_CLAIMANT_INVITE_REFUSED_PREDICAMENT_DESC:1 "แม้ข้าพเจ้าจะยินดีที่เห็นอาณาจักรลุกขึ้นต่อต้าน [faction_target.GetTitledFirstName] จอมปลอม สถานการณ์ปัจจุบันของข้าพเจ้า ทำให้ข้าพเจ้าไม่อาจเข้าร่วมกับท่านในความพยายามอันชอบธรรมนี้ได้ หากท่านสำเร็จ ข้าพเจ้าจะเป็นหนี้บุญคุณท่าน"
 FACTION_CLAIMANT_INVITE_REFUSED_CHILD_DESC:1 "ข้าพเจ้ายินดีที่ท่านก็คิดว่า [faction_target.GetTitledFirstName] เป็นผู้มีใจชั่วร้ายยิ่งนัก และข้าพเจ้าจะเป็นผู้ปกครองที่ดีกว่า [faction_target.GetHerHim] มาก!\n\nตอนนี้ข้าพเจ้ากำลังเพลิดเพลินกับของเล่นชิ้นใหม่อยู่... แต่หากท่านชนะ ข้าพเจ้าสัญญาว่าจะแบ่งปันให้ท่าน!"
 FACTION_CLAIMANT_INVITE_REFUSED_INSIGNIFICANT_DESC:0 "ในที่สุด! [faction_target.GetName] ก็เป็นเพียงตัวตลกที่สวมบทบาท [faction_target.GetTitleAsNameNoTooltip] และข้าพเจ้ามั่นใจว่าอาณาจักรจะลุกขึ้นสนับสนุนอุดมการณ์ของข้าพเจ้า\n\nเนื่องด้วยสถานะอันต่ำต้อยในปัจจุบันของข้าพเจ้า ข้าพเจ้าจึงไม่อาจช่วยเหลือท่านได้ แต่จงรู้ไว้เถิด – #emphasis เมื่อ#! ท่านได้รับชัยชนะ ข้าพเจ้าจะตอบแทนท่านอย่างงาม!"
 FACTION_CLAIMANT_INVITE_REFUSED_DESC:1 "แม้ข้าพเจ้าจะชื่นชมในความกระตือรือร้นของท่านต่อสิทธิ์อ้างของข้าพเจ้า ข้าพเจ้าก็อดรู้สึกไม่ได้ว่าความพยายามนี้มี แต่จะล้มเหลว ข้าพเจ้าจะไม่ให้การสนับสนุนแก่ท่านด้วยเหตุนี้ แต่หากท่านบังเอิญประสบความสำเร็จได้อยู่ดี ข้าพเจ้าก็จะยอมรับตำแหน่งของข้าพเจ้าบนบัลลังก์"
 FACTION_CLAIMANT_INVITE_REFUSED_OPT:0 "น่าเสียดาย"
 FACTION_CLAIMANT_EVERY_FACTION_MEMBER:0 "สมาชิกฝ่ายทุกคน"
 FACTION_CLAMAINT_DYNAMIC_NAME:0 "สถาปนา [ROOT.Faction.GetSpecialCharacter.GetTitledFirstName] ขึ้นครองบัลลังก์ [ROOT.Faction.GetSpecialTitle.GetAdjective]"
