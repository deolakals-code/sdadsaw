 faction_demand.0227.t: "กลุ่มนโยบายจักรวรรดิ: การร่างกฎหมาย"
 faction_demand.0227.desc: "เมื่อ [faction_target.GetTitledFirstNamePossessive] ถูกบีบให้จำยอม ในที่สุดพวกเราก็สามารถบังคับใช้นโยบายที่เป็นประโยชน์ต่อผลประโยชน์ของพวกเรา — ผลประโยชน์ของ#EMP ทั้งปวง#! [ROOT.Char.GetTopLiege.GetPrimaryTitle.GetBaseNameNoTierNoTooltip]...\n\nข้อเสนอแนะและคำร้องขอมากมายได้ถูกยื่นเข้ามา และมันตกเป็นหน้าที่ของข้าในฐานะผู้นำกลุ่ม ที่จะตัดสินใจเลือกหนทางที่ดีที่สุด"
