 FACTION_DEMAND_CEREMONIAL_CLAIMANT: "ข้อเรียกร้องของผู้อ้างสิทธิ์เชิงพิธีการ"
 FACTION_DEMAND_CEREMONIAL_CLAIMANT_DESC: "[faction_leader.Custom2('AppropriateGreetingNegative', ROOT.Char)]\n\nมิมีผู้ใดปฏิเสธได้ว่า [faction_claimant.GetName] คือองค์ประมุขโดยชอบธรรมแห่ง [faction_targeted_title.GetNameNoTier] มิใช่ [faction_targeted_title.GetHolder.GetFirstName]\n\nจงยอมรับความจริงนี้โดยสันติ มิฉะนั้นพวกเราจะบังคับเจ้าด้วยกำลัง!"
 FACTION_DEMAND_CEREMONIAL_CLAIMANT_DESC_ME: "[faction_targeted_title.GetDefinitiveName|U] เป็นของข้าโดยสิทธิ์อันเทวะประทาน และในที่สุดข้าก็มีหนทางที่จะ ทำให้มันเป็น เช่นนั้น จงยอมรับความจริงนี้โดยสันติ มิฉะนั้นข้าจะบังคับเจ้าด้วยกำลัง!"
 FACTION_DEMAND_CEREMONIAL_CLAIMANT_ACCEPTED: "ยอมรับข้อเรียกร้องของผู้อ้างสิทธิ์เชิงพิธีการ"
 FACTION_DEMAND_CEREMONIAL_CLAIMANT_ACCEPTED_DESC: "เป็นที่ประจักษ์แก่ข้าแล้วว่า พวกเจ้าคงยอมเห็นอาณาจักรลุกเป็นไฟ ดีกว่าล้มเลิกการกระทำอันโง่เขลานี้ เพื่อประโยชน์สุขแห่งอาณาจักร ข้าจำต้องยอมรับข้อเรียกร้องของพวกเจ้า แต่จงรู้ไว้ว่า ความอยุติธรรมครั้งใหญ่ได้บังเกิดขึ้น ณ ที่นี้ในวันนี้ เรื่องนี้จะปล่อยไว้ เช่นนี้มิได้!"
 FACTION_DEMAND_CEREMONIAL_CLAIMANT_REFUSED: "ปฏิเสธข้อเรียกร้องของผู้อ้างสิทธิ์เชิงพิธีการ"
 FACTION_DEMAND_CEREMONIAL_CLAIMANT_REFUSED_DESC: "การสนับสนุนของเจ้าต่อการอ้างสิทธิ์ใน [faction_targeted_title.GetDefinitiveName|l] ของ [faction_claimant.GetShortUINamePossessive|U] ถือเป็นการดูหมิ่นเกียรติภูมิของ [faction_targeted_title.GetHolder.GetTitleAsName] ผู้โดยชอบธรรมของเรา!\n\nการทรยศและความไร้เกียรติของเจ้า จักได้รับการพิพากษาจากสวรรค์ในไม่ช้า เจ้าคนทรยศชั่วช้า!"
 FACTION_DEMAND_CEREMONIAL_CLAIMANT_SEND_DEMAND_NOTIFICATION: "การอ้างสิทธิ์อันชอบธรรม!"
 FACTION_DEMAND_CEREMONIAL_CLAIMANT_SEND_DEMAND_NOTIFICATION_DESC: "ถึงเวลาแล้ว! ทุกคนที่สนับสนุน [faction_claimant.GetName] ในฐานะ [faction_targeted_title.GetHolder.GetTitleAsName] ผู้โดยชอบธรรม บัดนี้จักลุกขึ้นสู้เป็นหนึ่งเดียว และจัก ทำให้แน่ใจว่า [faction_claimant.GetSheHe] สามารถเข้าแทนที่อันชอบธรรมของ [faction_claimant.GetHerHis] ใน [faction_targeted_title.GetDefinitiveName|l] ได้ พวกเราจะ ทำให้สำเร็จ แม้จะต้องใช้ดาบและไฟก็ตาม!"
 FACTION_CEREMONIAL_CLAIMANT_INVITE: "[faction_invite_from.Custom2('AppropriateGreeting', ROOT.Char)]"
 FACTION_CEREMONIAL_CLAIMANT_INVITE_DESC: "[faction_target.GetName] กำลังครอบครองบัลลังก์ที่สมควรเป็นของท่านโดยชอบธรรม! ข้าเต็มใจที่จะสนับสนุนการอ้างสิทธิ์ของท่านทั้งด้วยวาจาและคมดาบ และข้ามั่นใจว่าผู้อื่นในอาณาจักรก็จะร่วมสนับสนุนอุดมการณ์อันชอบธรรมนี้ เช่นกัน ทั้งหมดที่ท่านต้องทำคือตอบตกลง"
 FACTION_CEREMONIAL_CLAIMANT_INVITE_ACCEPT: "ในที่สุด!"
 FACTION_CEREMONIAL_CLAIMANT_INVITE_REFUSE: "มันไม่ถูกต้อง..."
 FACTION_CEREMONIAL_CLAIMANT_INVITE_ACCEPTED: "[faction_claimant.Custom2('AppropriateGreeting', ROOT.Char)]"
 FACTION_CEREMONIAL_CLAIMANT_INVITE_ACCEPTED_DESC: "ในที่สุด! [faction_target.GetName] ก็มิมีอะไรมากไปกว่าตัวตลกที่สวมบทเป็น [faction_target.GetTitleAsNameNoTooltip] และข้ามั่นใจว่าอาณาจักรจะลุกขึ้นสู้เพื่ออุดมการณ์ของข้า บรรดาผู้ที่ช่วยเหลือข้าจะมิถูกลืมเลือน"
 FACTION_CEREMONIAL_CLAIMANT_INVITE_ACCEPTED_OPT: "มันเป็นเพียงเรื่องของเวลา..."

 # Imperial Policy
 FACTION_DEMAND_IMPERIAL_POLICY: "นโยบายจักรวรรดิ"
 FACTION_DEMAND_IMPERIAL_POLICY_DESC: "[faction_leader.Custom2('AppropriateGreetingNegative', ROOT.Char)]\n\nเหล่าพสกนิกรผู้ภักดีแห่งอาณาจักรได้อดทนต่อนโยบายที่ผิดพลาดของท่านมานานเกินไปแล้ว [faction.GetName] เรียกร้องให้ท่านยินยอมต่อทิศทางใหม่สำหรับ [ROOT.Char.GetPrimaryTitle.GetBaseNameNoTierNoTooltip] มิฉะนั้นพวกเราจะบังคับมันแก่ท่าน!"
 FACTION_DEMAND_IMPERIAL_POLICY_ACCEPTED: "ยอมรับข้อเรียกร้องนโยบายจักรวรรดิ"
 FACTION_DEMAND_IMPERIAL_POLICY_ACCEPTED_DESC: "เป็นที่ประจักษ์แก่ข้าแล้วว่า พวกเจ้าคงยอมเห็นอาณาจักรลุกเป็นไฟ ดีกว่าล้มเลิกการกระทำอันโง่เขลานี้ เพื่อประโยชน์สุขแห่ง [ROOT.Char.GetTopLiege.GetPrimaryTitle.GetBaseNameNoTierNoTooltip] ข้าจำต้องยอมรับข้อเรียกร้องของพวกเจ้า แต่จงรู้ไว้ว่า ความอยุติธรรมครั้งใหญ่ได้บังเกิดขึ้น ณ ที่นี้ในวันนี้ เรื่องนี้จะปล่อยไว้ เช่นนี้มิได้!"
 FACTION_DEMAND_IMPERIAL_POLICY_REFUSED: "ปฏิเสธข้อเรียกร้องนโยบายจักรวรรดิ"
 FACTION_DEMAND_IMPERIAL_POLICY_REFUSED_DESC: "การเพิกเฉยอย่างอวดดีและเอา แต่ใจของเจ้าต่อนโยบายอันหลักแหลมของรัฐบาลข้า มี แต่จะพิสูจน์ว่าเจ้าไม่เหมาะสมเพียงใดที่จะทำการตัดสินใจ เช่นนี้!\n\nการทรยศและความไร้เกียรติของเจ้า จักได้รับการพิพากษาจากสวรรค์ในไม่ช้า เจ้าคนทรยศชั่วช้า!"
 FACTION_DEMAND_IMPERIAL_POLICY_SEND_DEMAND_NOTIFICATION: "เปลี่ยนทิศทาง"
 FACTION_DEMAND_IMPERIAL_POLICY_SEND_DEMAND_NOTIFICATION_DESC: "ถึงเวลาแล้ว! ทุกคนที่สนับสนุนการล้มเลิกนโยบายที่ผิดพลาดของ [faction_target.GetTitledFirstNamePossessive] บัดนี้จักลุกขึ้นสู้เป็นหนึ่งเดียว และจัก ทำให้แน่ใจว่าอาณาจักรดำเนินไปในทิศทางใหม่ พวกเราจะ ทำให้สำเร็จ แม้จะต้องใช้ดาบและไฟก็ตาม!"
