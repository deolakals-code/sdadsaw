 cupbearer_court_position_task_flatter_dignitaries: "ประจบประแจงบุคคลสำคัญ"
 cupbearer_court_position_task_flatter_dignitaries_desc: "ตัวละครนี้จะ ทำให้แน่ใจว่าจอกของผู้ที่ท่านห่วงใยที่สุดนั้นเปี่ยมล้นไปด้วยความกระปรี้กระเปร่า"
 
 cupbearer_court_position_task_collect_tallage: "เก็บภาษีทัลเลจ"
 cupbearer_court_position_task_collect_tallage_desc: "$cupbearer_court_position$ ของท่านจะเก็บภาษีเพิ่มเติมจากเจ้าประเทศราชที่เป็นนักสังคมและนักเฉลิมฉลอง ท้ายที่สุดแล้วงานเลี้ยงต้องไม่ขาดอาหารและเครื่องดื่ม!"
 cupbearer_court_position_task_collect_tallage_tt: "ท่านไม่มี [vassals|E] ที่เป็น [GetVassalStance( 'courtly' ).GetName] ใดๆ"
 high_almoner_court_position_task_appease_zealots_tt: "ท่านไม่มี [vassals|E] ที่เป็น [GetVassalStance( 'zealot' ).GetName] ใดๆ"
 
 chief_qadi_court_position_task_public_alms: "นำการให้ศอดะเกาะฮ์สาธารณะ"
 chief_qadi_court_position_task_public_alms_desc: "$chief_qadi_court_position$ ของท่านจะแบ่งปันทานให้แก่คนยากจนและผู้ขัดสนในดินแดนของท่านในนามของท่าน"
 
 high_almoner_court_position_task_appease_zealots: "เอาใจผู้คลั่งศาสนา"
 high_almoner_court_position_task_appease_zealots_desc: "ตัวละครนี้จะสร้างชื่อเสียงให้ท่านในสายตาของเจ้าประเทศราชผู้เคร่งศาสนาในอาณาจักร"
 
 food_taster_court_position_task_brew_poisons: "ปรุงยาพิษ"
 food_taster_court_position_task_brew_poisons_desc: "ตัวละครนี้จะใช้เวลาอยู่เบื้องหลัง ปรุงยาพิษเพื่อใช้ในแผนการ"
 
 food_taster_court_position_task_ear_to_the_ground: "เงี่ยหูฟังข่าวคราว"
 food_taster_court_position_task_ear_to_the_ground_desc: "ตัวละครนี้จะใช้เวลาซ่อนตัวอยู่หลังม่าน ฟังข่าวลือและเรื่องซุบซิบอย่างตั้งใจ"
 
 court_poet_court_position_task_create_poetry: "เขียนบทกวี"
 court_poet_court_position_task_create_poetry_desc: "$court_poet_court_position$ ของท่านจะใช้เวลาในการประพันธ์และขับขานบทกวีอันงดงามเกี่ยวกับท่าน อาณาจักรของท่าน และความสำเร็จของท่าน"
 court_poet_court_position_task_create_poetry_tt: "ทุกปี $court_poet_court_position$ จะเขียนบทกวี มอบ [modifier|E] ที่ปรับปรุง [legitimacy|E], [piety|E], [advantage|E], หรือ [attraction|E] ของท่านเป็นเวลาสามปี #weak (ผลกระทบเพิ่มขึ้นตาม [aptitude|E])#!"
 court_poet_court_position_task_japanese_legacy_addendum: "บทกวีที่เสร็จสมบูรณ์ แต่ละบทจะเพิ่ม [bloc_cohesion|E] หนึ่งครั้ง"
