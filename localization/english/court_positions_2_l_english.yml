l_english: 
 master_of_hunt_court_position_task_dangerous_game: "แกะรอยสัตว์อันตราย"
 master_of_hunt_court_position_task_dangerous_game_desc: "$master_of_hunt_court_position$ ของท่านจะแกะรอยสัตว์อันตราย เช่น หมาป่าหรือหมี ซึ่งจะนำมา ซึ่งเกียรติภูมิอย่างมากในการล่า"
 master_of_hunt_court_position_task_dangerous_game_tt: "ทุกปี $master_of_hunt_court_position$ ของท่านมีโอกาสที่จะ [hunt_sighting_no_prefix|E] สัตว์อันตราย เพื่อให้ท่าน [GetActivityType('activity_hunt').GetTextIcon][GetActivityType('activity_hunt').GetName]\n$master_of_hunt_court_position_task_generic_tt$"
 
 master_of_hunt_court_position_task_regular_game: "แกะรอยสัตว์ธรรมดา"
 master_of_hunt_court_position_task_regular_game_desc: "$master_of_hunt_court_position$ ของท่านจะแกะรอยสัตว์ธรรมดา เช่น สุนัขจิ้งจอกหรือกวาง ซึ่งจะนำมา ซึ่งเกียรติภูมิโดยเฉลี่ยในการล่า"
 master_of_hunt_court_position_task_regular_game_tt: "ทุกปี $master_of_hunt_court_position$ ของท่านมีโอกาสที่จะ [hunt_sighting_no_prefix|E] สัตว์ธรรมดา เพื่อให้ท่าน [GetActivityType('activity_hunt').GetTextIcon][GetActivityType('activity_hunt').GetName]\n$master_of_hunt_court_position_task_generic_tt$"
 
 master_of_hunt_court_position_task_legendary_game: "แกะรอยสัตว์ในตำนาน"
 master_of_hunt_court_position_task_legendary_game_desc: "$master_of_hunt_court_position$ ของท่านจะพยายามแกะรอยสัตว์ร้ายในตำนาน ซึ่งจะนำมา ซึ่งเกียรติภูมิอย่างมหาศาลในการล่า"
 master_of_hunt_court_position_task_legendary_game_tt: "ทุกปี $master_of_hunt_court_position$ ของท่านมีโอกาสเล็กน้อยที่จะ [hunt_sighting_no_prefix|E] สัตว์ในตำนาน เพื่อให้ท่าน [GetActivityType('activity_hunt').GetTextIcon][GetActivityType('activity_hunt').GetName]\n$master_of_hunt_court_position_task_generic_tt$"
 
 master_of_hunt_court_position_task_generic_tt: "ความถี่ของการ [hunt_sightings_no_prefix|E] เพิ่มขึ้นตาม [aptitude|E] #weak (การพบเห็นสูงสุดหนึ่งครั้งทุก 3 ปี)#!"
 
 court_jester_court_position_task_entertain_court: "สร้างความบันเทิงแก่ข้าราชสำนัก"
 court_jester_court_position_task_entertain_court_desc: "$court_jester_court_position$ ของท่านจะใช้เวลาสร้างความบันเทิงแก่ข้าราชสำนักของท่านด้วยเรื่องตลก เรื่องเล่า และกายกรรม"
 court_jester_court_position_task_entertain_court_tt: "ทุกปี $court_jester_court_position$ มีโอกาสที่จะลด [stress_loss_i] [stress|E] ของ [courtier|E] แบบสุ่ม #weak (โดยเลือกผู้ที่ใกล้ชิดกับท่านก่อน เช่น [children|E] ของท่าน)#!\nหาก [aptitude|E] ของพวกเขามีค่าอย่างน้อย $aptitude_good$ สามารถเป้าหมาย [courtiers|E] ได้สูงสุดสองคนทุกปี"
 foreign_emissary_court_position_task_entertain_court_tt: "ทุกปี $foreign_emissary_court_position$ มีโอกาสที่จะลด [stress_loss_i] [stress|E] ของ [courtier|E] ผู้หนึ่งโดยการสุ่ม #weak (โดยจะเลือกผู้ใกล้ชิดท่านก่อน เช่น [children|E] ของท่าน)#!\nหาก [aptitude|E] ของพวกเขามีค่าอย่างน้อย $aptitude_good$, อาจส่งผลถึง [courtiers|E] ได้มากถึงสองคนใน แต่ละปี"
 
 court_jester_court_position_task_fuel_the_rumour_mill: "โหมกระพือโรงสีข่าวลือ"
 court_jester_court_position_task_fuel_the_rumour_mill_desc: "ตัวละครนี้จะใช้เวลาเผยแพร่ข่าวลือไร้สาระและเรื่องราวที่ ทำให้เข้าใจผิดเพื่อชะลอแผนการของศัตรู"
 court_jester_court_position_task_fuel_the_rumour_mill_tt: "ทุกปี $court_jester_court_position$ มีโอกาสที่จะลด [stress_loss_i] [stress|E] ของ [courtier|E] แบบสุ่ม #weak (โดยเลือกผู้ที่ใกล้ชิดกับท่านก่อน เช่น [children|E] ของท่าน)#!"
 
 court_jester_court_position_task_abuse_the_jester: "ทารุณตัวตลก"
 court_jester_court_position_task_abuse_the_jester_desc: "$court_jester_court_position$ ของท่านจะใช้เวลาในการถูกทารุณและ ทำให้อับอาย"
 court_jester_court_position_task_abuse_the_jester_tt: "ทุกปี $court_jester_court_position$ มีโอกาสที่จะลด [stress_loss_i] [stress|E] ของ [courtier|E] แบบสุ่ม #weak (โดยเลือกผู้ที่ใกล้ชิดกับท่านก่อน เช่น [children|E] ของท่าน)#!"
 
 court_artificer_court_position_task_martial: "สร้างอาวุธ ชุดเกราะ และออกผจญภัย"
 court_artificer_court_position_task_martial_desc: "$court_artificer_court_position$ ของท่านจะรวบรวมแรงบันดาลใจเพื่อสร้างดาบ โล่ ชุดเกราะ และออกผจญภัยสำหรับผู้ปกครองที่โน้มเอียงไปทางทหาร"
 court_artificer_court_position_task_martial_tt: "ทุกปี $court_artificer_court_position$ มีโอกาสที่จะได้รับ #V อาวุธ#! #V ชุดเกราะ#! หรือ #V การผจญภัย#! [inspiration|E] #weak (โดยเลือก [artifacts|E] ที่ท่านยังไม่มีก่อน)#!\n$court_artificer_court_position_task_improved_chances_tt$"
 
 court_artificer_court_position_task_learning: "สร้างหนังสือและพรมผนัง"
 court_artificer_court_position_task_learning_desc: "$court_artificer_court_position$ ของท่านจะรวบรวมแรงบันดาลใจเพื่อสร้างหนังสือ พรมผนัง หรือปรุงยาจากแร่ธาตุเพื่อเอาใจผู้ปกครองผู้ใฝ่รู้"
 court_artificer_court_position_task_learning_tt: "ทุกปี $court_artificer_court_position$ มีโอกาสที่จะได้รับ #V หนังสือ#! #V ช่างทอ#! หรือ #V การเล่นแร่แปรธาตุ#! [inspiration|E] #weak (โดยเลือก [artifacts|E] ที่ท่านยังไม่มีก่อน)#!\n$court_artificer_court_position_task_improved_chances_tt$"
 
 court_artificer_court_position_task_stewardship: "สร้างมงกุฎและประติมากรรม"
 court_artificer_court_position_task_stewardship_desc: "$court_artificer_court_position$ ของท่านจะรวบรวมแรงบันดาลใจเพื่อสร้างเครื่องราชกกุธภัณฑ์ มงกุฎ บัลลังก์ และสิ่งประดิษฐ์อื่นๆ สำหรับผู้ปกครองที่เน้นการจัดการ"
 court_artificer_court_position_task_stewardship_tt: "ทุกปี $court_artificer_court_position$ มีโอกาสที่จะได้รับ #V ช่างตีเหล็ก#! หรือ #V ช่างฝีมือ#! [inspiration|E]\n$court_artificer_court_position_task_improved_chances_tt$"
 
 court_artificer_court_position_task_improved_chances_tt: "การใช้งานภารกิจนี้จะเพิ่มโอกาสในการได้รับ [inspiration|E] อย่างมาก"
 
 must_have_an_equipped_illustrious_court_artifact: "ท่าน #bold ยังไม่มี#! [court_artifact|E] ระดับ #V เลื่องชื่อ#! ที่สวมใส่อยู่"
 must_have_upgradeable_artifact_tt: "ท่าน #bold ยังไม่มี#! [artifact|E] ที่สวมใส่อยู่ ซึ่งสามารถอัปเกรดได้"
 
 antiquarian_court_position_task_scout_for_artifacts: "ค้นหาสิ่งประดิษฐ์หายาก"
 antiquarian_court_position_task_scout_for_artifacts_desc: "$antiquarian_court_position$ ของท่านจะค้นคว้าตำราโบราณและสืบสวนข่าวลือที่ไม่ชัดเจน ค้นหาผู้ที่อาจสามารถนำบางสิ่งที่น่าตื่นตาตื่นใจกลับมายังราชสำนักได้"
 antiquarian_court_position_task_scout_for_artifacts_tt: "ทุกปี $antiquarian_court_position$ มีโอกาสที่จะมอบ [inspiration|E] การผจญภัยให้กับใครบางคนใน [court|E] #weak (โอกาสเพิ่มขึ้นตาม [aptitude|E])#!"
 antiquarian_inspired_adventurer_message: "$antiquarian_court_position$ สร้างแรงบันดาลใจการผจญภัย!"
 antiquarian_inspired_adventurer_effect: "[ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('adventure_target'))] ของท่าน [adventure_target.GetFirstName] ได้รับ [inspiration|E] #V การผจญภัย#!"
 
 antiquarian_court_position_task_improve_artifacts: "ปรับปรุงสิ่งประดิษฐ์"
 antiquarian_court_position_task_improve_artifacts_desc: "$antiquarian_court_position$ ของท่านจะปรับปรุงและขัดเกลาสิ่งประดิษฐ์ เพื่อให้พวกมันน่าประทับใจและมีประสิทธิภาพมากที่สุดเท่าที่จะเป็นไปได้"
 antiquarian_court_position_task_improve_artifacts_tt: "ทุกปี $antiquarian_court_position$ มีโอกาสที่จะปรับปรุง [artifact|E] ที่สวมใส่อยู่\nโอกาสในการปรับปรุง #weak (#bold ไม่ใช่#! คุณภาพ)#! เพิ่มขึ้นตาม [aptitude|E]\n[artifacts|E] ทั่วไปสามารถปรับปรุงได้หนึ่งครั้ง ผลงานชิ้นเอกสองครั้ง และอื่นๆ"
 antiquarian_improved_artifact_message: "[artifact_target.GetName] ได้รับการปรับปรุง!"
 
