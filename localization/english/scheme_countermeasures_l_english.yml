l_english: 
 # Boilerplate copy for the standard countermeasures.
 scheme_countermeasure_type_bounties_for_whispers: "ตั้งรางวัลข่าวลือ"
 scheme_countermeasure_type_bounties_for_whispers_desc: "#WEAK เหรียญตรานั้นทรงอานุภาพ ทำให้แม้แต่เหล่ามลทินก็ยังต้องเอ่ยปาก — แม้นั่น*หมายความ*ว่าต้องทนฟังพวกมันก็ตามที#!"
 scheme_countermeasure_type_arbitrary_arrests: "การจับกุมตามอำเภอใจ"
 scheme_countermeasure_type_arbitrary_arrests_desc: "#WEAK การจับกุมคนรับใช้ ผู้ติดตาม และทูตทุกคนที่แม้เพียงกะพริบตานับเป็นการบีบบังคับที่ได้ผลยิ่ง ทว่า... มันไม่เป็นที่นิยมชมชอบนัก#!"
 scheme_countermeasure_type_strengthen_sentries: "เสริมกำลังยามรักษาการณ์"
 scheme_countermeasure_type_strengthen_sentries_desc: "#WEAK สายตาที่สอดส่องป้องกันผู้บุกรุกที่ด้อมมองได้ดี แต่ยากจะรับมือผู้สมรู้ร่วมคิดที่เตรียมการและติดอาวุธมาอย่างดี#!\n\nป้องกันผู้บุกรุกที่ไม่ได้เตรียมการ"
 scheme_countermeasure_type_redouble_guards: "เพิ่มกำลังองครักษ์สองเท่า"
 scheme_countermeasure_type_redouble_guards_desc: "#WEAK ผู้ติดตามติดอาวุธเก่งกาจในการขัดขวางผู้มีเจตนาร้ายอย่างแท้จริง แต่ไม่อาจหยุดยั้งจดหมายลับที่สอดไว้ใต้บานประตู หรือการสนทนาในมุมมืดได้#!\n\nป้องกันแผนการสมคบคิดที่ใช้กำลังอาวุธ"
 scheme_countermeasure_type_withdraw_from_view: "เก็บตัวเลี่ยงผู้คน"
 scheme_countermeasure_type_withdraw_from_view_desc: "#WEAK เมื่อความปลอดภัยเป็นเรื่องน่าวิตกอย่างยิ่ง แต่ไม่ทราบถึงภยันตราย การหลีกเลี่ยงความรับผิดชอบทั้งปวงก็เป็นทางเลือกหนึ่ง#!\n\nป้องกันภัยส่วนใหญ่ แต่ไม่มีประสิทธิภาพนัก"

calculating_schemes_boilerplate.tt: "\n$BULLET_WITH_TAB$[GetScheme('murder').GetTypeName]\n$BULLET_WITH_TAB$[GetScheme('overthrow_regent').GetTypeName]\n$BULLET_WITH_TAB$[GetScheme('steal_back_artifact').GetTypeName]"
opportunistic_schemes_boilerplate.tt: "\n$BULLET_WITH_TAB$[GetScheme('seduce').GetTypeName]\n$BULLET_WITH_TAB$[GetScheme('convert_to_witchcraft').GetTypeName]\n$BULLET_WITH_TAB$[GetScheme('elope').GetTypeName]"
indirect_schemes_boilerplate.tt: "\n$BULLET_WITH_TAB$[GetScheme('claim_throne').GetTypeName]\n$BULLET_WITH_TAB$[GetScheme('fabricate_hook').GetTypeName][AddLocalizationIf( GetPlayer.GetGovernment.HasGovernmentFlag( 'government_is_mandala' ), 'tgp_disbelieve_mandala_boilerplate.tt' )]"
tgp_disbelieve_mandala_boilerplate.tt: "\n$BULLET_WITH_TAB$[GetScheme('disbelieve_mandala').GetTypeName]"

