l_english: 
 #A New Hobby
 bp1_yearly.1000.t:0 "งานอดิเรกใหม่"
 bp1_yearly.1000.desc:0 "สหายรักของข้า [friend.GetTitledFirstName] เข้ามาหาข้าพร้อมรอยยิ้มกว้างบนใบหน้าของ[friend.GetHerHis]\n\n"สหายรักของข้า ในที่สุดเราก็ได้พบกัน! ข้ารู้สึกเหมือนว่าช่วงนี้เราไม่เคยใช้เวลาร่วมกันอย่างมีคุณภาพเลย... บางที ท่านอาจจะอยากลองทำอะไรใหม่ๆ กับข้า? ข้ารู้สิ่งที่จะช่วยเบี่ยงเบนความคิด ฟื้นฟูร่างกาย และยกระดับจิตวิญญาณของท่านได้!"
 bp1_yearly.1000.desc_cannibal:0 "\n\n"ทำไมท่านไม่มาทานอาหารเย็นที่บ้านข้าล่ะ? ข้ามีเนื้อ #EMP พิเศษ#! สดใหม่ที่ท่านไม่เคยลิ้มลองมาก่อน — เนื้อ #EMP ต้องห้าม#! หากท่านเข้าใจความหมายของข้า...""
 bp1_yearly.1000.desc_deviant:0 "\n\n"ท่านควรเข้าร่วม #EMP การสำรวจ#! ของข้าในคืนหนึ่ง! ไม่มีอะไรสดชื่นไปกว่าการค้นหาความสุขในสิ่งเล็กๆ น้อยๆ ทั้งหมด... หรือ #EMP สิ่งใหญ่ๆ#! หากท่านต้องการ... ท่านคิดอย่างไรกับ #EMP [friend.Custom('DeviantObjectPlural')]#!?""
 bp1_yearly.1000.desc_witch:0 "\n\n"ทำไมท่านไม่ร่วมเดินเล่นยามค่ำคืนกับข้าล่ะ? ข้ารู้ศาสตร์ลับทั้งหมดในการจับโชคลาภ ดักจับความตาย ผูกมัดความรัก และดึงดูดทองคำ ข้า #EMP อยาก#! จะสอนทั้งหมดให้ท่านเหลือเกิน!""
 bp1_yearly.1000.desc_hashish:0 "\n\n"เมื่อความเครียดและความรับผิดชอบ ทำให้ท่านท้อแท้ ข้ามีสูตรเด็ดที่จะทิ้งปัญหาทั้งหมดไว้เบื้องหลัง! ท่านเคยลอง #EMP เค้กพิเศษ#! ของข้าหรือยัง?""
 bp1_yearly.1000.desc_drunkard:0 "\n\n"#EMP [ROOT.Char.Custom('RegionalAlcoholicDrink')|U]#!!! สหายข้า มาดื่มล้างความเศร้ากันเถอะ! การปล่อยให้ถ้วยหนึ่งผลักดันอีกถ้วยเป็นยาที่ดีที่สุด!""
 bp1_yearly.1000.desc_reveler:0 "\n\n"การเริงรมย์ตลอดทั้งคืน! กิน ดื่ม ร้องเพลง เต้นรำ และความสนุกสนานทั่วไป นั่นคือสิ่งที่ท่านต้องการ! มากับข้าสิ!""
 bp1_yearly.1000.desc_hunter:0 "\n\n"ความเงียบของป่าและความตื่นเต้นของการล่าจะ ทำให้ท่านรู้สึกดีขึ้นอย่างแน่นอน! มันไม่เคยล้มเหลวกับข้า และข้าอยากจะแบ่งปันความหลงใหลนี้กับท่านจริงๆ""
 bp1_yearly.1000.desc_confider:0 "\n\n"จากประสบการณ์ของข้า ไม่มีอะไร ทำให้ข้าสบายใจได้มากไปกว่าการแบ่งปันปัญหากับคนที่รัก หากท่านรู้สึกหนักใจ โปรดจำไว้ว่าท่านสามารถคุยกับข้าได้เสมอ ท่านจะรู้สึกดีขึ้น — ข้ารับรอง!""
 bp1_yearly.1000.desc_athletic:0 "\n\n"การออกกำลังกายคือคำตอบเสมอ! ขับเหงื่อไล่ความเจ็บปวด! ทำให้กล้ามเนื้อของท่านกรีดร้องดังจนท่านไม่ได้ยินความคิดของตัวเอง! #EMP ขับไล่ความโกรธด้วยเลือด#!! พบข้าที่ลานกว้าง แล้วข้าจะแสดงให้ท่านดู!""
 bp1_yearly.1000.desc_fallback_1:0 "\n\n"แล้วการตกปลาล่ะ? ความเงียบสงบของธรรมชาติรอบตัว และไม่มีอะไรนอกจากท่าน เหยื่อของท่าน เครื่องดื่มดีๆ และเพื่อนร่วมทางที่ดี...""
 bp1_yearly.1000.desc_fallback_2:0 "\n\n"แล้วการไปเยี่ยมตลาดท้องถิ่นล่ะ? การเห็นคนอื่นยุ่งอยู่ขณะที่ท่านเพียงแค่เดินเล่นสบายๆ นั้นเป็นการปลดปล่อยอารมณ์ที่ดี และท่านอาจพบของที่น่าพอใจที่จะซื้อ!""
 bp1_yearly.1000.desc_fallback_3:0 "\n\n"มีนักดนตรีพเนจรชื่อดังอยู่ในเมือง ทำไมเราไม่ไปชมการแสดงล่ะ? ข้ามั่นใจว่ามันจะต้องดีแน่!""
 bp1_yearly.1000.a1:0 "เรากำลังคิดถึง #EMP เนื้อพิเศษ#! เดียวกันอยู่หรือเปล่า?"
 bp1_yearly.1000.a:0 "แน่นอน ข้าจะลองดูเพื่อท่าน!"
 bp1_yearly.1000.a.tt:0 "[friend.GetShortUIName] สอนเคล็ดลับทั้งหมดให้ท่าน"
 bp1_yearly.1000.a.tt.2:0 "เรียนรู้เคล็ดลับแล้ว!"
 bp1_yearly.1000.a.tt.3:0 "ท่านติดนิสัยนี้"
 bp1_yearly.1000.b:0 "มันฟังดูไม่ #EMP น่าดึงดูด#! สำหรับข้าขนาดนั้น..."
 bp1_yearly.1000.b.tt:0 "ท่านอยากจะมุ่งเน้นไปที่หน้าที่ของท่านมากกว่า"
 bp1_yearly.1000.c:0 "ท่าน #EMP กล้า#! ดีอย่างไร!"
 #Holy Mediation
 bp1_yearly.1010.t:0 "การไกล่เกลี่ยอันศักดิ์สิทธิ์"
 bp1_yearly.1010.desc:0 "ขณะที่ข้าพบสหายของข้า [friend.GetTitledFirstName] กำลังออกจาก [friend.GetFaith.HouseOfWorship] ก็เห็นได้ชัดทันทีว่า [friend.GetSheHe] มีบางอย่างจะบอกข้า\n\n"สหายข้า! ข้าสวดภาวนาให้ท่านตั้งแต่วันที่ท่านถูกขับออกจากชุมชนผู้ศรัทธา! ข้าอดเป็นห่วงวิญญาณอันน่าสงสารของท่านไม่ได้... ข้าหวังเป็นอย่างยิ่งว่าข้าจะช่วยท่านได้มากกว่านี้!\n\n"ท่านจะให้ข้าอ้อนวอนแทนท่านต่อ [ROOT.Char.GetFaith.ReligiousHeadName] ได้หรือไม่? [pope.GetSheHe|U] อาจจะเต็มใจให้อภัยการล่วงละเมิดในอดีตของท่านแล้วในตอนนี้!""
 bp1_yearly.1010.a:0 "ได้โปรด ลองดูเถิด เพื่อเห็นแก่ข้า..."
 bp1_yearly.1010.a.success:0 "[friend.GetShortUIName] โน้มน้าว [pope.GetTitledFirstNameNoTooltip] ให้ยกเลิกการขับไล่ท่านออกจากศาสนา"
 bp1_yearly.1010.a.success.tt:0 "ยกเลิกการขับไล่ออกจากศาสนาแล้ว!"
 bp1_yearly.1010.a.failure:0 "[pope.GetTitledFirstNameNoTooltip|U] ไม่เชื่อ"
 bp1_yearly.1010.a.failure.tt:0 "[ROOT.Char.GetFaith.ReligiousHeadName|U] ไม่ถูกโน้มน้าว"
 bp1_yearly.1010.a.horrible_failure:0 "[pope.GetTitledFirstNameNoTooltip|U] รู้สึกขุ่นเคือง"
 bp1_yearly.1010.a.horrible_failure.tt:0 "[ROOT.Char.GetFaith.ReligiousHeadName|U] ขุ่นเคือง!"
 bp1_yearly.1010.b:0 "ไม่จำเป็นต้องทำ เช่นนี้"
 #A Friend till the End
 bp1_yearly.1020.t:0 "สหายจนวันสุดท้าย"
 bp1_yearly.1020.desc_intro:0 "ขณะที่ข้านอนอยู่บนเตียง สาปแช่งร่างกายที่อ่อนแอและกำลังจะดับสูญ ข้าแทบมองไม่เห็นร่างที่กำลังเข้ามาใกล้ ฝีเท้าที่เชื่องช้าและความเงียบงันของพวกเขากำลัง ทำให้ข้าหวาดกลัว"
 bp1_yearly.1020.desc:0 "\n\nพวกเขาคงเดาความไม่สบายใจของข้าได้จากเสียงแผ่วเบาที่ออกจากปากและการเคลื่อนไหวกระตุกของมือข้า เพราะฝีเท้าของพวกเขากลับรีบร้อน และในไม่ช้ามืออันอบอุ่นก็กุมมือข้าไว้ และใบหน้าที่คุ้นเคยก็เข้ามาในระยะสายตา\n\n"ชู่ว์ [ROOT.Char.GetFirstNameNoTooltip] นี่ข้าเอง [friend.GetFirstName] โอ ข้าเจ็บปวดเหลือเกินที่เห็นท่านเป็น เช่นนี้... ข้าหวังว่าข้าจะทำอะไรบางอย่างได้ #EMP อะไรก็ได้#! เพื่อบรรเทาความไม่สบายของท่าน""
 bp1_yearly.1020.a:0 "ได้โปรด อยู่กับข้า..."
 bp1_yearly.1020.b:0 "ข้าไม่อยากให้ท่านเห็นข้าเป็น เช่นนี้"
 bp1_yearly.1021.desc:1 "ข้ายังคงเห็นช่วงเวลาดีๆ ทั้งหมดที่ข้าเคยมีร่วมกับ [friend.GetFirstName] บัดนี้ ขณะที่ข้าก้าวเข้าไปในห้องที่มีแสงสลัวและเห็นร่างอันอ่อนแอของ[friend.GetHerHis]นอนอยู่บนเตียง แทบไม่เคลื่อนไหว ข้ารู้แน่ชัดว่าวันเหล่านั้นจะไม่กลับมาอีกแล้ว และข้ารู้สึกเจ็บปวดด้วยความเศร้าอย่างสุดซึ้ง\n\n[friend.GetSheHe|U] ได้ยินข้าเดินเข้ามาและดูเหมือนจะกระสับกระส่าย ดังนั้นข้ารีบไปอยู่ข้างๆ [friend.GetHerHis]\n\n"นี่ข้าเอง [ROOT.Char.GetFirstNameNoTooltip] ที่รักของท่าน! ข้าอยู่ที่นี่""
 bp1_yearly.1021.desc_bestie:0 "\n\nชั่วขณะหนึ่ง [friend.GetFirstNameNoTooltip] ดูเหมือนจะจำข้าได้ และทำท่าให้ข้าเข้าไปใกล้ขึ้น"
 bp1_yearly.1021.desc_token:0 ""รับ... สิ่งนี้ไป..." [friend.GetSheHe] พึมพำ ข้าพยักหน้าและคว้าสิ่งที่ [friend.GetSheHe] มอบให้ข้า ข้าสาบานกับตัวเองว่าจะเก็บรักษามันไว้เป็นความทรงจำของ [friend.GetFirstNamePossessiveNoTooltip]"
 1021_trinket_desc:0 "[new_trinket.GetDesc]\n\n[bestie.GetTitledFirstNameNoTooltip|U] ส่งต่อสิ่งนี้ให้กับสหายรักของ[bestie.GetHerHis] [ROOT.Char.GetTitledFirstNameNoTooltip] บนเตียงนอนก่อนตายของ[bestie.GetHerHis]"
 bp1_yearly.1021.desc_secret:0 ""มีบางอย่าง... ข้าไม่เคยบอกท่าน..." [friend.GetSheHe] กระซิบข้างหูข้า ดวงตาของข้าเบิกกว้างเมื่อได้ยินความจริง"
 bp1_yearly.1021.desc_misery:0 ""ได้โปรด ปลดปล่อยข้า..." [friend.GetSheHe] พึมพำ"
 bp1_yearly.1021.desc_end:0 "มันเป็นเพียงชั่วขณะหนึ่งเท่านั้น หลังจากนั้น ดวงตาของ [friend.GetFirstNamePossessiveNoTooltip] ก็เลื่อนลอยอีกครั้ง"
 bp1_yearly.1021.a:0 "ข้าจะอยู่เคียงข้างท่าน"
 bp1_yearly.1021.b:0 "ข้าทนเห็นท่านเป็น เช่นนี้ไม่ได้ ให้อภัยข้าด้วย"
 bp1_yearly.1021.c:0 "หลับให้สบายเถิด [friend.GetFirstNameNoTooltip] ที่รักของข้า"
 #Till the Bitter End
 bp1_yearly.1030.t:0 "จนถึงจุดจบอันขมขื่น"
 bp1_yearly.1030.desc:1 "\n\n"ฮ่า! ดูเจ้าตอนนี้สิ! ไม่น่าเกรงขามอีกต่อไปแล้วสินะ, หือ? เจ้าจำข้าได้หรือไม่, ไอ้ [ROOT.Char.Custom2('InsultAdjective', SCOPE.sC('rival'))] [ROOT.Char.Custom2('InsultNoun', SCOPE.sC('rival'))]? ข้าเอง, [rival.GetFirstName]! โอ้, ข้าปรารถนาที่จะเห็นเจ้าตกต่ำ เช่นนี้มานานเพียงใด!""
 bp1_yearly.1030.desc_nemesis:0 "\n\n"ไม่ ข้ายังไม่ได้ทำ" [nemesis.GetSheHe] ตอบ ข้าไม่ทันสังเกตเห็นแววตาอันตรายในดวงตาของ[nemesis.GetHerHis]ก่อนที่ [nemesis.GetFirstNameNoTooltip] จะมาอยู่ข้างเตียงข้า พร้อมรอยยิ้มเย็นชาบนใบหน้าของ[nemesis.GetHerHis]"
 bp1_yearly.1030.desc_nemesis_guard:0 "ข้าสิ้นหวังไปแล้วเมื่อ [GetCourtPositionType('bodyguard_court_position').GetName()] [guard.GetFirstName] ของข้าพุ่งเข้ามาในห้อง!"
 bp1_yearly.1030.desc_nemesis_no_guard:0 "ข้าพยายามขยับ หนี กรีดร้อง #EMP อะไรก็ได้#! แต่ร่างกายที่เปราะบางของข้าหยุดฟังข้ามานานแล้ว..."
 bp1_yearly.1030.desc_rival:1 "\n\nเสียงหัวเราะอันขมขื่นของ[rival.GetHerHis|U]ปลุกความทรงจำอันไม่น่าพอใจบางอย่างในใจข้า แต่ไม่นานหมอกหนาทึบก็กลืนกินมันไปอีกครั้ง ข้าจำไม่ได้ด้วยซ้ำว่าทำไมเราถึงเกลียดกันมากขนาดนี้"
 bp1_yearly.1030.a:0 "รู้อะไรไหม? #EMP ข้าให้อภัยเจ้า#!."
 bp1_yearly.1030.b:0 "#EMP ออกไปซะ!#!"
 bp1_yearly.1030.c:0 "...#EMP ช่วยด้วย#!..."
 bp1_yearly.1030.c_saved_guard:0 "[guard.GetShortUIName] สังหารผู้ที่มุ่งหมายจะฆ่า"
 bp1_yearly.1030.c_saved_guard.tt:0 "[guard.GetShortUIName] ช่วยท่านไว้!"
 bp1_yearly.1030.c_barely_saved_guard:0 "[guard.GetShortUIName] แทบจะไม่สามารถช่วยท่านไว้ได้"
 bp1_yearly.1030.c_barely_saved_guard.tt:0 "[guard.GetShortUIName] แทบจะช่วยท่านไว้ไม่ได้!"
 bp1_yearly.1030.c_killed_guard:0 "[guard.GetShortUIName] ช่วยท่านไว้ แต่เสียชีวิต"
 bp1_yearly.1030.c_killed_guard.tt:0 "[guard.GetShortUIName] ช่วยท่านไว้ แต่เสียชีวิต!"
 bp1_yearly.1030.c_killed_all:0 "ท่านและ [GetCourtPositionType('bodyguard_court_position').GetName()] ของท่านถูกสังหาร"
 bp1_yearly.1030.c_saved:0 "ท่านสามารถขับไล่ผู้โจมตีได้"
 bp1_yearly.1030.c_saved.tt:0 "ท่านขับไล่ผู้โจมตีได้!"
 bp1_yearly.1030.c_killed:0 "ท่านถูกสังหาร"
 bp1_yearly.1031.desc:0 "นับตั้งแต่ข่าวการป่วยของ [rival.GetTitledFirstNamePossessive] มาถึงหูข้า ข้าก็ไม่สามารถหาความสงบได้ ข้าเพียงต้องการเห็นมันด้วยตาตัวเอง บัดนี้เมื่อข้าอยู่ที่นี่ มองดูร่างอันอ่อนแอของ[rival.GetHerHis]นอนนิ่งอยู่บนเตียงนั้น ยึดมั่นในชีวิตอย่างสิ้นหวังด้วยพละกำลังที่เหลืออยู่ ข้ารู้สึกท่วมท้นไปด้วยอารมณ์ที่ขัดแย้งกัน"
 bp1_yearly.1031.desc_nemesis:0 "\n\nมันจะง่ายกว่าไหมที่จะปล่อยวางความเจ็บปวดและความโกรธทั้งหมด? แต่ถึงกระนั้น [nemesis.GetFirstNameNoTooltip] ก็ไม่เคยดูอ่อนแอหรือเปิดเผย เช่นนี้มาก่อน... เปราะบางพอที่ข้าจะ #EMP หักคอ#! [nemesis.GetHerHim] ด้วยมือเปล่าได้..."
 bp1_yearly.1031.desc_rival:0 "\n\n"เจ้าจำข้าได้หรือไม่ ไอ้ [rival.Custom2('InsultAdjective', ROOT.Char)] [rival.Custom2('InsultNoun', ROOT.Char)]?" ใบหน้าของ [rival.GetHerHis|U] ดูเหมือนจะหดเกร็งไปครู่หนึ่ง และดวงตาของ [rival.GetHerHis] ก็กลอกไปมาอย่างค้นหา แต่ไม่เคยจับจ้องมาที่ข้าเลย"
 bp1_yearly.1031.desc_guard:0 "ขณะที่ข้ากำลังครุ่นคิด ข้าก็สังเกตเห็นสายตาเย็นชาของ [GetCourtPositionType('bodyguard_court_position').GetName()] ของ [nemesis.GetFirstNamePossessiveNoTooltip] [guard.GetTitledFirstName] ที่จ้องมองข้าจากข้างห้องอย่างระแวดระวัง"
 bp1_yearly.1031.a:0 "ตอนนี้ทุกอย่างดูไร้จุดหมายไปหมดเลย ใช่ไหม?"
 bp1_yearly.1031.b:0 "เจ้าได้รับสิ่งที่เจ้าสมควรได้รับแล้ว"
 bp1_yearly.1031.c:0 "#EMP ช่าง... ช่าง... เปราะบางเหลือเกิน...#!"
 bp1_yearly.1031.c.tt:0 "แต่ข้าต้องกำจัดองครักษ์ก่อน!"
 bp1_yearly.1031.c_killed_all:0 "ท่านสังหารทั้ง [nemesis.GetShortUIName] และ [GetCourtPositionType('bodyguard_court_position').GetName()] [guard.GetShortUIName] ของ[nemesis.GetHerHis]"
 bp1_yearly.1031.c_killed_all.tt:0 "ท่านทำสำเร็จ!"
 bp1_yearly.1031.c_killed_guard:0 "ท่านเพียงแค่ ทำให้ [nemesis.GetShortUIName] บาดเจ็บ แต่สังหาร [guard.GetShortUIName]"
 bp1_yearly.1031.c_failed.tt:0 "ท่านลอบสังหารล้มเหลว!"
 bp1_yearly.1031.c_barely_saved_guard:0 "ท่านเพียงแค่ ทำให้ [nemesis.GetShortUIName] และ [guard.GetShortUIName] บาดเจ็บ"
 bp1_yearly.1031.c_saved_guard:0 "[guard.GetShortUIName] สังหารท่าน"
 bp1_yearly.1031.c_killed:0 "ท่านสังหาร [nemesis.GetShortUIName]"
 bp1_yearly.1031.c_saved:0 "[nemesis.GetShortUIName] สามารถขับไล่ท่านได้"
 # Something in Common
 bp1_yearly.1040.t:0 "บางสิ่งที่เหมือนกัน"
 bp1_yearly.1040.desc:0 "ข้ากำลังแช่น้ำอย่างมีความสุขที่โรงอาบน้ำ แบ่งปันความคิดลึกซึ้งและเรื่องตลกหยาบโลนกับ [new_friend.GetTitledFirstName] ขณะที่ข้ารู้สึกว่าความตึงเครียดทั้งหมดคลายออกจากร่างกาย ข้าก็ตระหนักว่าไม่ใช่แค่น้ำอุ่นที่ ทำให้กล้ามเนื้อของข้าคลายตัว\n\nข้ากำลังสนุกอย่างแท้จริง! และทั้งหมดนี้เป็น เพราะการอยู่ร่วมกับ [new_friend.GetFirstNamePossessiveNoTooltip]"
 bp1_yearly.1040.desc_best_friend:0 "ข้าถือว่า [new_friend.GetHerHim] เป็นหนึ่งในสหายของข้าแล้ว แต่ข้าก็ตระหนักว่าข้าตั้งตารอคอยเวลาใดๆ ที่เราจะได้ใช้ร่วมกัน ข้าให้ความสำคัญกับความคิดเห็นของ[new_friend.GetHerHis]เหนือสิ่งอื่นใด และทุกช่วงเวลากับ[new_friend.GetHerHim]เต็มไปด้วยเสียงหัวเราะและความอบอุ่น\n\n[new_friend.GetFirstNameNoTooltip] กลายเป็น #EMP สหายรัก#! ของข้าแล้วหรือยัง?"
 bp1_yearly.1040.desc_friend:0 "จนกระทั่งเราค้นพบความหลงใหลในโรงอาบน้ำเหมือนกัน เราไม่เคยมีโอกาสได้โต้ตอบหรือทำความรู้จักกันดีขนาดนั้นเลย บัดนี้ ข้าตั้งตารอคอยการนัดพบกันเป็นประจำที่นั่นจริงๆ เพราะมันเต็มไปด้วยเสียงหัวเราะและความรื่นเริงเสมอ!\n\nเรากลายเป็น #EMP สหาย#! กันจริงๆ แล้วหรือ?"
 bp1_yearly.1040.a:0 "แน่นอน! ดื่มให้กับ [new_friend.GetFirstNameNoTooltip]!"
 bp1_yearly.1040.b:0 "หรือบางทีอาจจะเป็นอะไรที่ #EMP มากกว่านั้น#!?"
 bp1_yearly.1040.b.tt:0 "ทุกคนรู้ว่าความสัมพันธ์ที่ดีที่สุดนั้นตั้งอยู่บนพื้นฐานของมิตรภาพที่แท้จริง!"
 bp1_yearly.1040.c:0 "ข้าไม่ค่อยชอบ [new_friend.GetHerHim] #EMP ขนาดนั้น#! หรอก..."
 # Annoying Company
 bp1_yearly.1050.t:0 "กลุ่มคนที่น่ารำคาญ"
 bp1_yearly.1050.desc:0 "ข้ากำลังแช่น้ำอย่างสบายใจที่โรงอาบน้ำ ในที่สุดก็ได้พักผ่อนตามสมควร เมื่อเสียงที่น่ารำคาญจากที่ไหนสักแห่งใกล้ๆ ขัดจังหวะความคิดอันสงบของข้า\n\n"เจ้าเห็น [ROOT.Char.GetHerHis]...? และไอ้ที่ #EMP เล็กจิ๋ว#! อย่างน่าขันนั่น...?" ไกลออกไปเล็กน้อยในห้อง ข้าเห็น [new_rival.GetTitledFirstName] กำลังทำท่าทางลามก ล้อมรอบด้วยฝูงคนประจบสอพลอที่หัวเราะเยาะ เป็นเรื่องยากที่จะพลาดว่าพวกเขาทั้งหมดกำลังจ้องมองมาที่ข้า"
 bp1_yearly.1050.desc_nemesis:0 "\n\nพอที!! ข้าเอือมระอากับเรื่องไร้สาระของ [new_rival.GetHerHis] เต็มทนแล้ว! [new_rival.GetFirstNameNoTooltip] ยั่วโมโหข้ามานานเกินไปแล้ว และตอนนี้ [new_rival.GetSheHe] ยังจะมาพยายามทำลายเวลาอาบน้ำของข้าอีกรึ?! ข้าไม่เคยพบ [new_rival.Custom2('InsultAdjective', ROOT.Char)] [new_rival.Custom2('InsultNoun', ROOT.Char)] เช่น [new_rival.GetHerHim] มาก่อนเลย! สาปแช่งเจ้า [new_rival.GetFirstNameNoTooltip]!"
 bp1_yearly.1050.desc_rival:0 "\n\nข้าแทบไม่รู้จัก [new_rival.GetHerHim] และข้าก็รู้สึกเหมือนเกลียด [new_rival.GetHerHim] แล้ว [new_rival.GetFirstNameNoTooltip] #EMP กล้า#! ดีอย่างไรมาเยาะเย้ยข้าในที่สาธารณะ?! ข้าจะไม่ลืมการดูหมิ่นครั้งนี้..."
 bp1_yearly.1050.a:0 "[new_rival.GetSheHe|U] จะต้องชดใช้"
 bp1_yearly.1050.b:0 "ข้าต้องการให้ [new_rival.GetHerHim] ตาย #EMP เดี๋ยวนี้#!."
 bp1_yearly.1050.c:0 "ข้าคงจะคิดมากเกินไป..."
 # A Superstitious Mind
 bp1_yearly.1060.t:0 "จิตใจที่งมงาย"
 bp1_yearly.1060.desc:0 "ครั้งสุดท้ายที่ข้าเห็น [friend.GetTitledFirstName] [friend.GetSheHe] กำลังแอบกำจัดหมวกสีเหลืองของข้า เพราะ "สีเหลืองเป็นสีอัปมงคลสำหรับคนเกิดปีข้า" ครั้งก่อนหน้านั้น ข้าต้องไปกับ[friend.GetHerHim]ในทางอ้อมที่ยาวอย่างน่าขันเพื่อหลีกเลี่ยงแมวดำที่กำลังนอนหลับ "มันเป็นลางร้าย!" [friend.GetSheHe] กล่าว ข้าไม่อยากจะจำครั้งที่ [friend.GetSheHe] #EMP คิด#! ว่า [friend.GetSheHe] ทำเครื่องรางนำโชคของ[friend.GetHerHis]หาย!\n\nอย่างไรก็ตาม ขณะที่ข้าจับได้ว่า [friend.GetHerHim] กำลังโยนเกลืออันมีค่าของข้าทิ้งไปครึ่งหนึ่งเพียง เพราะมันหก ข้าก็รู้สึกว่าความอดทนของข้าเริ่มหมดลง..."
 bp1_yearly.1060.a:0 "แต่ถ้ามันเป็น #EMP เรื่องจริง#! ทั้งหมดล่ะ?"
 bp1_yearly.1060.b:0 "ให้ข้าแสดงให้ท่านเห็นข้อผิดพลาดในแนวทางของท่าน"
 bp1_yearly.1060.b_persuaded:0 "ท่านโน้มน้าว [friend.GetShortUIName] ให้ละทิ้งความเชื่องมงายของ[friend.GetHerHis]"
 bp1_yearly.1060.b_persuaded.tt:0 "[friend.GetShortUIName] ถูกโน้มน้าวแล้ว!"
 bp1_yearly.1060.b_not_persuaded:0 "[friend.GetShortUIName] ไม่ประทับใจในประเด็นของท่าน"
 bp1_yearly.1060.b_not_persuaded.tt:0 "[friend.GetShortUIName] ไม่ถูกโน้มน้าว!"
 bp1_yearly.1060.b_you_persuaded:0 "[friend.GetShortUIName] พลิกสถานการณ์และโน้มน้าวท่าน"
 bp1_yearly.1060.b_you_persuaded.tt:0 "[friend.GetShortUIName] เปลี่ยนใจท่าน!"
 bp1_yearly.1060.c:0 "#EMP ความเชื่อที่ดูหมิ่นศาสนา!#!"
 bp1_yearly.1060.d:0 "ไร้สาระ!"
 # Bad Luck, X!
 bp1_yearly.1070.t:0 "โชคร้ายนะ [rival.GetFirstNameNoTooltip]!"
 bp1_yearly.1070.desc:0 "ข้าสังเกตเห็นว่า [rival.GetTitledFirstName] ที่น่ารังเกียจนั้นเป็น [rival.GetWomanMan] ที่งมงายมาก [rival.GetSheHe|U] กลัววันอัปมงคล สีอัปมงคล สัตว์อัปมงคล และแม้กระทั่งต้นไม้อัปมงคล! การเห็นเงาของนกผิดชนิดในเวลาที่ไม่ถูกต้องอาจ ทำให้ [rival.GetHerHim] ตื่นตระหนกเป็นเวลาหลายวัน\n\nในขณะที่การปฏิบัติตามพิธีกรรมของ[rival.GetHerHis]อย่างเคร่งครัดดูเหมือนจะนำความรู้สึกปลอดภัยอย่างหาที่เปรียบมิได้มาให้[rival.GetHerHim] การเบี่ยงเบนเพียงเล็กน้อยจากมันอาจส่งผลกระทบใหญ่หลวงอย่างคาดไม่ถึงต่อความสงบในใจของ[rival.GetHerHis] — ผลกระทบที่ข้าสามารถใช้ประโยชน์ได้..."
 bp1_yearly.1070.a:0 "ความเป็นไปได้นั้นไร้ขีดจำกัดอย่างแท้จริง..."
 bp1_yearly.1070.a.tt:0 "แผนการนี้ได้รับโอกาสสำเร็จเพิ่มขึ้น"
 bp1_yearly.1070.c:0 "ข้าจะไปปั่นหัว[rival.GetHerHis]!"
 bp1_yearly.1070.d:0 "ข้าจะไม่ลดตัวลงไปทำเรื่องต่ำช้า เช่นนั้น"
 # Dear Father, ...
 bp1_yearly.1080.opening:0 "[relative.Custom2('AppropriateGreeting', ROOT.Char)]"
 bp1_yearly.1080.desc:0 "นับตั้งแต่ข้าถูกส่งตัวไป แต่งงานกับ [spouse.GetTitledFirstName] ที่ชั่วร้าย วันเวลาของข้าก็เต็มไปด้วยความทุกข์ระทม"
 bp1_yearly.1080.intoxicated:1 "[spouse.GetSheHe|U] มึนเมาอยู่ตลอดเวลาและแทบจะไม่ได้สติอยู่กับ [spouse.GetHerselfHimself]"
 bp1_yearly.1080.sexuality:1 "[spouse.GetSheHe|U] ไม่ได้ปิดบังความต้องการทางเพศที่ไม่รู้จักพอของ[spouse.GetHerHis] — ข้าหน้าแดงเพียงแค่คิดถึงการผจญภัยมากมายของ[spouse.GetHerHis]!"
 bp1_yearly.1080.violence:1 "[spouse.GetSheHe|U] ดูเหมือนจะมีความสุขอย่างยิ่งกับความทุกข์ทรมานของผู้อื่น แม้ แต่ราษฎรของ[spouse.GetHerHis]ก็ยังหวาดกลัว ข้ากลัวความปลอดภัยของตัวเองที่นี่"
 bp1_yearly.1080.reclusive:1 "[spouse.GetSheHe|U] เกลียดชังการคบค้าสมาคมกับมนุษย์ หลีกหนีความรับผิดชอบของ[spouse.GetHerHis] และทอดทิ้งข้าด้วย ข้ารู้สึกเหมือน แต่งงานกับผี"
 bp1_yearly.1080.profligate:1 "นิสัยการใช้จ่ายของ[spouse.GetHerHis|U]ไม่มีขอบเขตหรือเหตุผล อาณาจักรใกล้จะล้มละลายอยู่ตลอดเวลา และเราใช้ชีวิตอย่างยากจนข้นแค้น!"
 bp1_yearly.1080.fallback:0 "ข้าเกรงว่าข้าจะไม่สามารถทนบุคลิกที่ไม่น่าพอใจและนิสัยที่น่าขยะแขยงของ[spouse.GetHerHis]ได้อีกต่อไป..."
 bp1_yearly.1080.ending:0 "โปรดอย่าลืม [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('relative'))] ผู้ภักดีของท่าน"
 bp1_yearly.1080.a:0 "นี่มัน #EMP เกินทนแล้ว#!!"
 bp1_yearly.1080.a.success:0 "ท่านสามารถลอบพา [relative.GetShortUIName] กลับบ้านได้สำเร็จ"
 bp1_yearly.1080.a.failure:0 "[relative.GetShortUIName] หนีไม่สำเร็จ"
 bp1_yearly.1080.a.failure.tt:0 "การหลบหนีของ [relative.GetFirstNamePossessiveNoTooltip] ล้มเหลว"
 bp1_yearly.1080.b:0 "เราไม่สามารถเสี่ยงกับพันธมิตรในเรื่องนี้ได้"
 bp1_yearly.1080.c:0 "โปรดอดทน..."
 bp1_yearly.1080.d:0 "ไม่อาจให้อภัยได้!"
 bp1_yearly.1080.d.success:0 "ท่านโน้มน้าว [spouse.GetShortUIName] ให้ปล่อย [relative.GetShortUIName] ไป"
 bp1_yearly.1080.d.failure:0 "[spouse.GetShortUIName] เมินเฉยต่อคำขอของท่าน"
 bp1_yearly.1080.d.failure.tt:0 "[relative.GetFirstNameNoTooltip] ไม่ได้รับการปล่อยตัว"
 bp1_yearly.1081.t:0 "ยินดีต้อนรับกลับบ้าน!"
 bp1_yearly.1081.desc:0 "ข้าแทบไม่เชื่อสายตาตนเอง เมื่อ [relative.GetTitledFirstName] [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('relative'))] อันเป็นที่รักของข้า ถูกนำตัวกลับมายัง [ROOT.Char.Custom('GetRoom')] ของข้าในที่สุด แผนของข้าสำเร็จแล้ว และในที่สุด [relative.GetSheHe] ก็หลุดพ้นจากเงื้อมมือของ [spouse.Custom2('InsultAdjective', ROOT.Char)] [spouse.Custom2('InsultNoun', ROOT.Char)] อย่าง [spouse.GetTitledFirstName]!\n\nขณะที่ข้าผายมือให้ [relative.GetHerHim] มาร่วมวงข้างกองไฟกับข้า ข้าก็นึกขึ้นได้ว่าพวกเขายังคง แต่งงานกันอยู่... ข้าสงสัยว่าจะมีสิ่งใดที่ข้าพอจะทำได้เกี่ยวกับเรื่องนั้นอีกหรือไม่ หรือข้าควรจะพอใจเพียงแค่ได้เห็น [relative.GetHerHim] กลับมาอยู่เคียงข้างข้าอย่างปลอดภัยอีกครั้ง"
 bp1_yearly.1081.a:0 "มาหย่ากันเถอะ #EMP เดี๋ยวนี้#!."
 bp1_yearly.1081.b:0 "บอกเล่าความทุกข์ของท่านให้ข้าฟังทั้งหมด..."
 bp1_yearly.1081.c:0 "#EMP จนกว่าความตายจะพรากเราจากกัน#! ท่านว่าอย่างนั้น...?"
 bp1_yearly.1082.desc:0 "เมื่อเร็วๆ นี้ ข้าได้ค้นพบว่า [spouse.GetFirstName] [spouse.GetWifeHusband] ของข้า — เจ้า [spouse.Custom2('InsultAdjective', SCOPE.sC('relative'))] [spouse.Custom2('InsultNoun', SCOPE.sC('relative'))] นั่น — มีความลับสกปรกอีกอย่าง! ข้ามิได้ลืมเลือนว่าท่านพยายามช่วยข้าให้หนีจากการ แต่งงานที่ไม่มีความสุข เพื่อเป็นเครื่องหมายแสดงความขอบคุณ ข้าจึงตัดสินใจแบ่งปันมันกับท่าน มันอาจจะไม่มากนัก แต่ข้าหวังว่าท่านจะเห็นว่ามันมีประโยชน์"
 bp1_yearly.1082.a:0 "ยอดเยี่ยม..."
