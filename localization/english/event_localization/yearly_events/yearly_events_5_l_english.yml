l_english: 
 yearly.5001.t:0 "การเผชิญหน้าอันโชคร้าย"
 yearly.5001.duelling.desc:1 "เสียงสะท้อนอันคุ้นเคยของสองเสียงดึงความสนใจของข้า นำข้าไปยังห้องบรรทมของ [bickering_spouse.GetWifeHusband] ของข้า\n\nเมื่อข้าไปถึง ข้าตกใจที่พบ [bickering_spouse.GetWifeHusband] ของข้า [bickering_spouse.GetFirstName] กำลังโต้เถียงอย่างดุเดือดกับชู้รักของข้า [bickering_lover.GetFirstName] เมื่อเห็นข้า [bickering_attacker.GetFirstNameNoTooltip] ก็ชักอาวุธของ [bickering_attacker.GetHerHis] ออกมาอย่างรวดเร็วและฟาดไปยัง [bickering_defender.GetFirstNameNoTooltip],"
 yearly.5001.backstabbing.desc:0 "ข้ากำลังจะออกจากห้องอาหารและกลับไปที่ห้องของข้าเมื่อข้าเห็นคนรักของข้า [bickering_lover.GetFirstNameNoTooltip] กำลังสนทนากับ [bickering_spouse.GetWifeHusband] ของข้าในมุมที่เงียบสงบ [bickering_defender.GetFirstName] หันกลับมาทักทายข้า โดยไม่รู้ตัวว่าเปิดช่องให้ [bickering_defender.GetHerselfHimself] ถูกโจมตีโดย [bickering_attacker.GetFirstName],"
 yearly.5001.duelling.attackerwins.desc:0 "ฟาด [bickering_loser.GetHerHim] ลงกับพื้น ทำให้ [bickering_loser.GetHerHim] นอนจมกองเลือด สิ้นใจ"
 yearly.5001.backstabbing.attackerwins.desc:0 "ผู้ ซึ่งฉวยโอกาสที่คู่แข่งของ [bickering_winner.GetHerHis] เผลออย่างรวดเร็ว แทงกริชทะลุปอดของ [bickering_loser.GetHerHis]"
 yearly.5001.duelling.defenderwins.desc:0 "แต่การโจมตีของ [bickering_loser.GetHerHis] ถูกป้องกันไว้ได้ในวินาทีสุดท้ายโดยคู่ต่อสู้ของ [bickering_loser.GetHerHis] ผู้ ซึ่งผลัก [bickering_loser.GetHerHim] ออกไปอย่างแรงแล้วแทง [bickering_loser.GetHerHim] ด้วยอาวุธของ [bickering_loser.GetHerHis] เอง"
 yearly.5001.backstabbing.defenderwins.desc:0 "ทว่า บางทีอาจตระหนักถึงอันตรายที่ใกล้เข้ามา [bickering_winner.GetFirstNameNoTooltip] หันกลับไปหา [bickering_loser.GetFirstNameNoTooltip] ทันที บิดข้อมือของ [bickering_loser.GetHerHis] และแทง [bickering_loser.GetHerHim] ด้วยกริชของ [bickering_loser.GetHerHis] เอง"
 yearly.5001.lover.epilogue.desc:0 "\n\n'ข้าทำเพื่อเรา' [bickering_winner.GetFirstNameNoTooltip] อ้าง พลางเหลือบมองข้าด้วยความเสียใจเล็กน้อย 'เพื่อให้เราได้อยู่ด้วยกัน'"
 yearly.5001.spouse.epilogue.desc:0 "\n\n'มันจำเป็นต้องเกิดขึ้น' [bickering_winner.GetFirstNameNoTooltip] อ้าง พลางเหลือบมองข้าด้วยความเสียใจเล็กน้อย 'ท่านนำสิ่งนี้มาสู่เราเอง'"
 yearly.5001.a.a.spouse:0 "ข้าเสียใจอย่างสุดซึ้ง... ท่านมีสิทธิ์ทุกประการ"
 yearly.5001.a.a.lover:0 "ถึงกระนั้น ข้าก็หวังว่ามันจะไม่ลงเอย เช่นนี้..."
 yearly.5001.a.b.spouse:0 "ท่านแสดงจุดยืนของท่านแล้ว [bickering_spouse.GetWifeHusband] บัดนี้ขอให้เราลืมเรื่องนี้เสีย"
 yearly.5001.a.b.lover:0 "ท่านแสดงจุดยืนของท่านแล้ว บัดนี้ขอให้เราลืมเรื่องนี้เสีย"
 yearly.5001.a.c.spouse:0 "ข้าเพียงหวังว่าข้าจะสามารถให้อภัยท่านได้จากใจจริง"
 yearly.5001.a.c.lover:0 "บางทีนี่อาจเป็นหนทางเดียวจริงๆ..."
 yearly.5001.b:0 "ท่านทำได้อย่างไร?! ไปให้พ้น ก่อนที่ข้าจะโยนท่านลงคุกใต้ดิน"
 yearly.5001.c:0 "ข้าจะไม่ลืมเรื่องนี้ [bickering_winner.GetFirstNameNoTooltip]"
 yearly.5001.d:0 "ไม่ ทั้งอาณาจักรจะต้องรับรู้อาชญากรรมอันทรยศของท่าน!"
 yearly.5001.e:0 "ท่านพูดถูก! ไม่มีสิ่งใดขวางกั้นระหว่างเราอีกแล้ว!"
 yearly.5001.f:0 "ราชสำนักจะรู้ว่า [bickering_loser.GetFirstNameNoTooltip] พยายามทำอะไรกับท่าน"
 yearly.5001.g:0 "ข้าไม่อาจปล่อยให้อาชญากรรมนี้ผ่านไปโดยไม่ลงโทษ ทหาร!"
 yearly.5001.i:0 "ข้าไม่เคยรู้เลยว่าท่านจะโหดเหี้ยมได้ถึงเพียงนี้... ข้าชอบ!"
 yearly.5002.t:0 "ความเสียใจในอดีต"
 yearly.5002.spouse.desc:0 "หลายเดือนผ่านไปนับตั้งแต่ข้าส่ง [bickering_loser.GetFirstName] ไปรับการพิพากษาของ [ROOT.Char.GetFaith.HighGodNamePossessive] เป็นการชำระชื่อเสียงของตระกูลข้าและแก้ไขนิสัยนอกใจของ [ROOT.Char.Custom2('RelationToMePossessive', SCOPE.sC('scoped_ruler'))] ของข้า ถึงกระนั้น ภาพหลอนของคู่แข่งของข้ายังคงหลอกหลอนข้าในยามค่ำคืน พรากนิทราอันชอบธรรมไปจากข้า..."
 yearly.5002.lover.desc:0 "หลายเดือนผ่านไปนับตั้งแต่ข้าปลดปล่อยผู้คุมอันโหดร้ายของคนรักของข้าไปจากโลกนี้ เพื่อที่เราจะได้อยู่อย่างอิสระจากทรราชย์แห่งการสมรสของ [bickering_loser.GetHerHis] ถึงกระนั้น ภาพหลอนของคู่แข่งของข้ายังคงหลอกหลอนข้าในยามค่ำคืน ทรมานข้าจากปรโลก..."
 yearly.5002.forgiven.desc:0 "\n\nแม้ว่า [scoped_ruler.GetFirstNamePossessive] จะยืนยันอย่างต่อเนื่องว่า [scoped_ruler.GetSheHe] ไม่ถือโทษโกรธเคืองข้าสำหรับการกระทำของข้า ข้ารู้สึกผิดท่วมท้น"
 yearly.5002.unforgiven.desc:0 "\n\nความเฉยเมยอันเย็นชาของ [scoped_ruler.GetFirstNamePossessive] ต่อชะตากรรมของข้ามี แต่จะ ทำให้เรื่องเลวร้ายลง เติมเต็มหัวใจข้าด้วยความสำนึกผิดต่อการกระทำอันรุนแรงของข้า"
 yearly.5002.a:0 "หากเพียง แต่ [scoped_ruler.GetFirstNameNoTooltip] จะช่วยข้าได้..."
 yearly.5002.b:0 "มีเพียง [ROOT.GetCharacter.GetFaith.HighGodName] เท่านั้นที่สามารถประทานความสงบแก่ข้าได้!"
 yearly.5002.c:0 "[bickering_loser.GetSheHe|U] จะหยุดทรมานข้าก็ต่อเมื่อข้าไปอยู่กับ [bickering_loser.GetHerHim]"
 yearly.5003.spouse.desc:0 "[bickering_winner.GetWifeHusband] ของข้า [bickering_winner.GetFirstName] ไม่เหมือนเดิมตั้งแต่การเผชิญหน้าอันโชคร้ายครั้งล่าสุดของ [bickering_winner.GetHerHis] กับคนรักของข้า [bickering_winner.GetSheHe|U] อ้างว่าถูกหลอกหลอนโดยวิญญาณอาฆาตของ [bickering_loser.GetFirstName] ตั้งแต่วันแห่งโชคชะตานั้น"
 yearly.5003.lover.desc:0 "[bickering_winner.GetFirstName] ไม่เหมือนเดิมตั้งแต่การเผชิญหน้าอันโชคร้ายครั้งล่าสุดของ [bickering_winner.GetHerHis] กับ [bickering_loser.GetFirstName] [bickering_winner.GetSheHe|U] อ้างว่าถูกหลอกหลอนโดยวิญญาณอาฆาตของ [bickering_loser.GetFirstNameNoTooltip] ตั้งแต่วันแห่งโชคชะตานั้น"
 yearly.5003.forgiven.desc:0 "\n\n[bickering_winner.GetSheHe|U] กลัวว่าความทรงจำอันน่าสะพรึงกลัวของอาชญากรรมลับของ [bickering_winner.GetHerHis] กำลังกัดกินจิตใจและวิญญาณของ [bickering_winner.GetHerHis]"
 yearly.5003.unforgiven.desc:0 "\n\n[bickering_winner.GetSheHe|U] กำลังอ้อนวอนให้ข้าอภัยให้ [bickering_winner.GetHerHim] สำหรับอาชญากรรมอันน่าสะพรึงกลัวที่ [bickering_winner.GetSheHe] ก่อขึ้นในนามของข้า โดยมั่นใจว่าการให้อภัยของข้าเป็นสิ่งเดียวที่จะช่วยจิตใจและวิญญาณของ [bickering_winner.GetHerHis] ได้"
 yearly.5003.a:0 "เอาเถิด [bickering_winner.GetFirstNameNoTooltip] ข้าอภัยให้ท่าน"
 yearly.5003.b.forgiven:0 "ข้าเกรงว่าจะไม่มีสิ่งใดที่ข้าสามารถทำเพื่อท่านได้อีกแล้ว"
 yearly.5003.b.forgotten:0 "ข้าขออภัย แต่ข้าทำ เช่นนั้นไม่ได้"
 yearly.5003.b.callous:0 "ท่านจะกรุณาหยุดเสียเวลาของข้ากับภาพหลอนของท่านได้หรือไม่?"
 yearly.5003.c:0 "มันไม่มากไปกว่าสิ่งที่ฆาตกรชั่วช้า เช่นท่านสมควรได้รับ"
 yearly.5004.desc: "ในที่สุด [scoped_ruler.GetFirstName] ก็ได้มอบการให้อภัยของ[scoped_ruler.GetHerHis]แก่ข้า และด้วยเหตุนั้น ข้าก็ได้พบความสงบสุขอีกครั้ง วิญญาณของ [bickering_loser.GetFirstName] ได้ถูกขับไล่ออกจากความฝันของข้าไปตลอดกาล"
 yearly.5004.a:0 "ความทรงจำของ [bickering_loser.GetHerHis|U] ก็จะเลือนหายไปในไม่ช้า เช่นกัน..."
 yearly.5005.desc:0 "ข้าช่างโง่เขลาที่หวังว่า [scoped_ruler.GetFirstName] จะช่วยข้า [scoped_ruler.GetSheHe|U] เป็น [scoped_ruler.GetWomanMan] ที่ใจแคบและโหดร้ายมาโดยตลอด [scoped_ruler.GetSheHe|U] ปฏิเสธชะตากรรมของข้าและเยาะเย้ยข้าสำหรับความอ่อนแอของข้า อ้างว่าข้าสมควรได้รับทุกสิ่งที่เกิดขึ้นกับข้า"
 yearly.5005.a:0 "เหตุใดข้าจึงเคยใส่ใจอสูรร้ายตนนี้?"
 yearly.5006.epilogue.desc:0 "ไม่สามารถเผชิญหน้ากับความผิดจากการกระทำของ [bickering_winner.GetHerHis] ได้ [bickering_winner.GetSheHe] จึงตัดสินใจละทิ้งราชสำนักและอุทิศชีวิตของ [bickering_winner.GetHerHis] ให้กับ [bickering_winner.GetFaith.HighGodNamePossessive]"
 yearly.5006.b.forgiven:0 "จงไปอย่างสงบเถิด หากนั่นคือสิ่งที่ท่านปรารถนา"
 yearly.5006.b.upset:0 "ท่านทำ เช่นนี้กับข้าได้อย่างไร?!"
 yearly.5006.b.default:0 "ข้าเข้าใจแล้ว..."
 yearly.5007.t:0 "ค่ำคืนอันน่าเบื่อ"
 yearly.5007.desc:0 "ข้ามักพบว่าตนเองคิดถึงการเผชิญหน้าครั้งสุดท้ายกับ [bickering_loser.GetFirstName] ในช่วงสองสามสัปดาห์ที่ผ่านมา นานแล้วที่ชีวิตไม่ได้รู้สึกมีความหมายเท่ากับตอนที่ข้ามีเลือดของ [bickering_loser.GetHerHis] อุ่นอยู่บนผิวหนัง \n\n[scoped_ruler.GetFirstName] ดูเหมือนจะรู้สึก เช่นเดียวกัน: เราไม่เคยใกล้ชิดกันเท่ากับตอนที่เราแบ่งปันความตื่นเต้นเร้าใจของการฆาตกรรม แต่บัดนี้เรากำลังค่อยๆ ห่างเหินกันไป..."
 yearly.5007.a:0 "บางทีอาจถึงเวลาจุดไฟให้ลุกโชนอีกครั้ง"
 yearly.5007.a.tt:0 "[bickering_winner.GetFirstName] จะมีแนวโน้มที่จะเข้าร่วมแผนการฆาตกรรมของข้ามากขึ้น"
 yearly.5007.b:0 "ข้าคิดว่าข้าทำมามากพอแล้ว"
 yearly.5008.desc:0 "ข้ามักพบว่าตนเองคิดถึง [bickering_loser.GetFirstName] ที่รักของข้าในช่วงสองสามสัปดาห์ที่ผ่านมา และการตายก่อนวัยอันควรของ [bickering_loser.GetHerHis] ด้วยน้ำมือของ [bickering_winner.GetFirstName] ข้าไม่เคยรู้สึกใกล้ชิดกับ [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('bickering_winner'))] ของข้าเท่ากับตอนที่เราแบ่งปันความตื่นเต้นเร้าใจของการฆาตกรรม น่าสนใจยิ่งกว่านั้น [bickering_winner.GetSheHe] ดูเหมือนจะกระตือรือร้นเท่ากับข้าที่จะหวนนึกถึงช่วงเวลาที่น่าจดจำนั้นและจุดไฟรักของเราให้ลุกโชนอีกครั้ง"
 yearly.5008.a:0 "แต่คราวนี้ ข้าจะเป็นคนเลือกเหยื่อ!"
 yearly.5008.b:0 "ไม่ ข้าเบื่อเกมนี้แล้ว"
 yearly.5009.desc:0 "ข้อเสนอถูกปฏิเสธ"
 yearly.5010.t:0 "ความขัดแย้งอันเห็นอกเห็นใจ"
 yearly.5010.desc: "ด้วยความเห็นใจในความทุกข์ยากของข้า [bickering_vassal_1.GetTitledFirstName] ได้เสนอคำปรึกษาและความช่วยเหลือของ[bickering_vassal_1.GetHerHis]แก่ข้าหลายครั้ง โดยหวังว่าจะช่วยแบ่งเบาภาระหน้าที่ของข้า\n\nอย่างไรก็ตาม ความใส่ใจของ [bickering_vassal_1.GetFirstNamePossessiveNoTooltip] ได้ก่อให้เกิดความโกรธเคืองแก่ [bickering_vassal_2.GetTitledFirstName] \"[bickering_vassal_1.GetFirstNameNoTooltip] ไว้ใจไม่ได้! นี่เป็นเพียงอุบายที่จะเอาเปรียบท่านเท่านั้น ใต้ฝ่าบาท\""
 yearly.5010.a:0 "ข้าจะไว้วางใจเฉพาะผู้ที่สมควรได้รับเท่านั้น"
 yearly.5010.b:0 "เราทั้งสามคนหาจุดร่วมกันไม่ได้หรือ?"
 yearly.5010.midwaysuccess.desc:0 "ข้าสามารถคลี่คลายความขัดแย้งบางส่วนระหว่าง [bickering_vassal_1.GetTitledFirstName] และ [bickering_vassal_2.GetTitledFirstName] ได้"
 yearly.5010.midwayfail.desc:0 "ข้าไม่สามารถคลี่คลายเรื่องราวระหว่าง [bickering_vassal_1.GetTitledFirstName] และ [bickering_vassal_2.GetTitledFirstName] ได้"
 yearly.5010.midwaycritfail.desc:0 "ความพยายามของข้าที่จะ ทำให้ [bickering_vassal_1.GetTitledFirstName] และ [bickering_vassal_2.GetTitledFirstName] ลืมความแตกต่างของพวกเขามี แต่จะ ทำให้ข้าหลวงทั้งสองโกรธข้าไปด้วย"
 yearly.5010.c:0 "ข้าจะรับฟังคำเตือนของท่าน [bickering_vassal_2.GetFirstNameNoTooltip]"
 yearly.5010.d:0 "เช่นนั้นจงปกป้องเกียรติของ [ROOT.Char.GetTitleTierName] ของท่าน!"
 yearly.5010.deceitfail.desc:0 "ข้าไม่สามารถหลอกล่อ [bickering_vassal_2.GetTitledFirstName] ให้ประลองกับ [bickering_vassal_1.GetTitledFirstName] ได้"
 yearly.5011.desc:0 "ใช้เวลาไม่นานในการปลุกปั่นความดูถูกเหยียดหยามของ [bickering_vassal_1.GetFirstNamePossessive] และ [bickering_vassal_2.GetFirstNamePossessive] ที่มีต่อกันให้กลายเป็นความเป็นปรปักษ์อย่างเปิดเผย มีการแลกเปลี่ยนคำพูดหยาบคายก่อนที่ [bickering_vassal_2.GetFirstNameNoTooltip] จะยก [bickering_vassal_2.Custom('signature_weapon')] ของ [bickering_vassal_2.GetHerHis] ขึ้นต่อสู้กับ [bickering_vassal_1.GetFirstNameNoTooltip] ซึ่งตอบโต้ในลักษณะเดียวกัน\n\nหลังจากการแลกเปลี่ยนการโจมตีอย่างรุนแรงสั้นๆ [bickering_vassal_winner.GetTitledFirstNameNoTooltip] ก็ได้รับชัยชนะ ในขณะที่คู่ต่อสู้ของ [bickering_vassal_winner.GetHerHis] ถูกทิ้งให้นอนจมกองเลือดอยู่บนพื้น"
 yearly.5011.a.new:0 "ข้าไม่เคยตระหนักเลยว่าท่านภักดีต่อข้าเพียงใด [bickering_vassal_winner.GetFirstNameNoTooltip]..."
 yearly.5011.b.new:0 "ดูเหมือนว่าการกระทำจะดังกว่าคำพูด"
 yearly.5011.b.old:0 "ข้าจะทำอย่างไรหากไม่มีท่าน [bickering_vassal_winner.GetFirstNameNoTooltip]?"
 yearly.5011.c:0 "เหตุใดท่านจึงต้องรบกวนข้าด้วยปัญหาทั้งหมดนี้ [bickering_vassal_winner.GetFirstNameNoTooltip]?"
 tooltip.5010.d.vassalsfight:0 "ข้าประสบความสำเร็จในการยุยงให้ข้าหลวงทั้งสองต่อสู้กัน"
 tooltip.5010.d.vassalsfightfail:0 "[bickering_vassal_2.GetFirstName] ปฏิเสธที่จะถูกลากเข้าไปในการต่อสู้"
 tooltip.5010.b.success:0 "ข้าสามารถประนีประนอมข้าหลวงทั้งสองได้"
 tooltip.5010.b.fail:0 "ข้าล้มเหลวในการประนีประนอมข้าหลวงทั้งสอง"
 tooltip.5010.b.critfail:0 "ข้า ทำให้ข้าหลวงทั้งสองโกรธ"
 tooltip.5010.d.vassalsfight.effect:0 "[bickering_vassal_2.GetFirstName] ท้าทาย [bickering_vassal_1.GetFirstName] ให้ประลองกันจนตาย!"

 yearly.5020.t:0 "เกี่ยวกับการสั่งสอน"
 yearly.5020.opening:0 "[helpful_councillor.Custom2('AppropriateGreeting', ROOT.Char)]"
 yearly.5020.intro.desc:0 "[scoped_heir.GetFirstName] [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('scoped_heir'))] ของท่านได้ให้ความสนใจอย่างยิ่งในงานของข้าในฐานะ [helpful_councillor.Custom('CouncilPosition')] ของท่านเมื่อไม่นานมานี้ หากท่านจะกรุณาอนุญาตให้ข้าใช้เวลากับ"
 yearly.5020.older.desc:0 "[scoped_heir.GetWomanMan] หนุ่มสาวผู้นี้ [scoped_heir.GetSheHe] จะได้เรียนรู้หลายสิ่งหลายอย่างอย่างแน่นอน"
 yearly.5020.younger.desc:0 "[scoped_heir.GetHerHim] [scoped_heir.GetSheHe] จะได้เรียนรู้หลายสิ่งหลายอย่างอย่างแน่นอน"
 yearly.5020.chancellor.desc:0 "เกี่ยวกับการเมือง มารยาท และการทูต"
 yearly.5020.marshal.desc:0 "เกี่ยวกับการฝึกทหาร การวางแผนการล้อม และเรื่องอื่นๆ ที่เกี่ยวกับสงคราม"
 yearly.5020.steward.desc:0 "เกี่ยวกับการคำนวณ การบริหารที่ดินและทรัพย์สิน"
 yearly.5020.spymaster.desc:0 "เกี่ยวกับการรักษาความลับและการได้มา ซึ่งข้อมูลที่คลุมเครือ"
 yearly.5020.court_chaplain.desc:0 "เกี่ยวกับประวัติศาสตร์ของอาณาจักรของเราและประเพณีของประชาชนของเรา"
 yearly.5020.kurultai.desc: "เกี่ยวกับศิลปะการยิงธนูบนหลังม้าและวิถีการเลี้ยงปศุสัตว์แห่งทุ่งหญ้าสเตปป์"
 yearly.5020.a:0 "ตราบใดที่ท่านรู้ว่ากำลังทำอะไรอยู่..."
 yearly.5020.a.e.tt:0 "[helpful_councillor.GetFirstNameNoTooltip] จะสอน [scoped_heir.GetFirstNameNoTooltip] เกี่ยวกับความรับผิดชอบของ [helpful_councillor.GetHerHis] ในฐานะ [helpful_councillor.GetCouncilTitle]"
 yearly.5020.b.a:0 "อนาคตของ [scoped_heir.GetFirstNamePossessiveNoTooltip] ไม่เกี่ยวกับท่าน"
 yearly.5020.b.b:0 "ข้าอยากจะสอน [scoped_heir.GetHerHim] ด้วยตนเองมากกว่า!"
 yearly.5020.c:0 "เราจะดูก่อนว่าท่านพูดความจริงหรือไม่!"
 tooltip.5020.c.success:0 "ข้าค้นพบเหตุผลของ [helpful_councillor.GetFirstNamePossessiveNoTooltip] ในการให้การศึกษาแก่ [scoped_heir.GetFirstNameNoTooltip]"
 tooltip.5020.c.success.effect:0 "การสอนดำเนินต่อไปโดยไม่มีการหยุดชะงัก"
 tooltip.5020.c.fail:0 "เหตุผลของ [helpful_councillor.GetFirstNamePossessiveNoTooltip] ในการให้การศึกษาแก่ [scoped_heir.GetFirstNameNoTooltip] นั้นข้าไม่อาจเข้าใจได้"
 tooltip.5020.c.fail.effect:0 "ข้าอาจจะต้องดำเนินการบางอย่าง"
 tooltip.5020.c.critfail:0 "[helpful_councillor.GetFirstNameNoTooltip] พบว่าข้าตัดสินใจที่จะสอดแนม [helpful_councillor.GetHerHim]"
 tooltip.5020.c.critfail.effect:0 "[helpful_councillor.GetFirstName] รู้สึกถูกดูหมิ่นและหยุดให้คำปรึกษาแก่ [scoped_heir.GetFirstName]"
 yearly.5020.ruler.diplomacy.tt:1 "ท่านพยายามปรับปรุง [diplomacy|E] ของ [scoped_heir.GetFirstNamePossessive]"
 yearly.5020.ruler.martial.tt:1 "ท่านพยายามปรับปรุง [martial|E] ของ [scoped_heir.GetFirstNamePossessive]"
 yearly.5020.ruler.stewardship.tt:1 "ท่านพยายามปรับปรุง [stewardship|E] ของ [scoped_heir.GetFirstNamePossessive]"
 yearly.5020.ruler.intrigue.tt:1 "ท่านพยายามปรับปรุง [intrigue|E] ของ [scoped_heir.GetFirstNamePossessive]"
 yearly.5020.ruler.learning.tt:1 "ท่านพยายามปรับปรุง [learning|E] ของ [scoped_heir.GetFirstNamePossessive]"
 yearly.5020.councillor.diplomacy.tt:1 "[helpful_councillor.GetFirstName] จะปรับปรุง [diplomacy|E] ของ [scoped_heir.GetFirstNamePossessive]"
 yearly.5020.councillor.martial.tt:1 "[helpful_councillor.GetFirstName] จะปรับปรุง [martial|E] ของ [scoped_heir.GetFirstNamePossessive]"
 yearly.5020.councillor.stewardship.tt:1 "[helpful_councillor.GetFirstName] จะปรับปรุง [stewardship|E] ของ [scoped_heir.GetFirstNamePossessive]"
 yearly.5020.councillor.intrigue.tt:1 "[helpful_councillor.GetFirstName] จะปรับปรุง [intrigue|E] ของ [scoped_heir.GetFirstNamePossessive]"
 yearly.5020.councillor.learning.tt:1 "[helpful_councillor.GetFirstName] จะปรับปรุง [learning|E] ของ [scoped_heir.GetFirstNamePossessive]"

 yearly.5021.deceitfulcouncillor.desc:0 "ข้าคิดถูกแล้วที่สงสัยในเจตนาของ [helpful_councillor.GetFirstNamePossessive]! หลังจากจับตาดู [helpful_councillor.GetHerHim] อยู่สองสามวัน ก็เห็นได้ชัดเจนว่า [helpful_councillor.GetSheHe] สนใจเพียงแค่การยุยงให้ [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('scoped_heir'))] ของข้าต่อต้านข้า"
 yearly.5021.honestcouncillor.desc:0 "แม้จะมีการตรวจสอบอย่างเข้มงวด [helpful_councillor.GetFirstName] สายลับของข้าก็ไม่สามารถพบสิ่งใดที่จะ ทำให้ข้าเชื่อได้ว่าเจตนาของ [helpful_councillor.GetHerHis] นั้นไม่บริสุทธิ์\n\n[helpful_councillor.GetSheHe|U] ดูเหมือนจะสนใจเพียงแค่การช่วยให้ [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('scoped_heir'))] ของข้ากลายเป็นผู้ปกครองที่ดีขึ้นเท่านั้น"
 yearly.5021.a:0 "ไม่มีอันตรายใดในการปล่อยให้ [helpful_councillor.GetHerHim] เป็นพี่เลี้ยงให้ [scoped_heir.GetFirstNameNoTooltip]!"
 yearly.5021.b.a:0 "ข้าไม่สามารถปล่อยให้ [helpful_councillor.GetHerHim] อยู่ใกล้ [scoped_heir.GetFirstNameNoTooltip] ได้อีกต่อไป"
 yearly.5021.b.b:0 "แต่ข้าก็ยังไม่ไว้วางใจ [helpful_councillor.GetHerHim]!"
 yearly.5021.c:0 "ข้าต้องการให้ [helpful_councillor.GetHerHim] ออกจากสภา!"
 yearly.5022.a:0 "ไม่มีอันตรายใดในการปล่อยให้ [helpful_councillor.GetHerHim] ดำเนินการต่อไป!"

 yearly.5023.desc:0 "สายลับไร้ประโยชน์ที่ข้าส่งไปจับตาดู [helpful_councillor.Custom('CouncilPosition')] ของข้า [helpful_councillor.GetTitledFirstName] ถูกจับได้! [helpful_councillor.GetFirstNameNoTooltip] โกรธมากที่รู้ว่าข้าไม่ไว้วางใจและได้ถอนข้อเสนอในการสอนของ [helpful_councillor.GetHerHis]"
 yearly.5023.a:0 "ข้าจะสันนิษฐานได้อย่างไรว่า [helpful_councillor.GetSheHe] จริงใจ?"
 yearly.5024.deceitfulcouncillor.desc:0 "มีบางอย่างไม่ถูกต้อง ข้าอนุญาตให้ [helpful_councillor.Custom('CouncilPosition')] ของข้า [helpful_councillor.GetFirstName] ช่วยสอน [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('scoped_heir'))] ของข้า เพื่อให้ [scoped_heir.GetFirstName] ได้เรียนรู้บางอย่างเกี่ยวกับการปกครอง อย่างไรก็ตาม ดูเหมือนว่า [helpful_councillor.GetSheHe] จะสนใจสอน [scoped_heir.GetHerHim] ให้ตั้งคำถามและไม่เห็นด้วยกับการตัดสินใจทุกอย่างของข้ามากกว่า"
 yearly.5024.deadlycouncillor.desc:0 "[helpful_councillor.Custom('CouncilPosition')] ของข้า [helpful_councillor.GetFirstName] พรวดพราดเข้ามาในห้องโถงใหญ่ ใบหน้าของ [helpful_councillor.GetHerHis] เต็มไปด้วยความหวาดกลัวและเสื้อผ้าของ [helpful_councillor.GetHerHis] เปียกโชกไปด้วยเลือด \n\n"โจรป่า [ROOT.Char.GetTitleTierName] ของข้า!" [helpful_councillor.GetSheHe] อุทาน เกือบจะหมดลมหายใจ [helpful_councillor.GetFirstNameNoTooltip] ได้ออกจาก [ROOT.Char.Custom('ResidenceBuilding')] พร้อมกับ [scoped_heir.GetFirstName] เมื่อเช้านี้เพื่อสำรวจชนบท "ข้าแบกร่างของ [scoped_heir.GetTitleTierNamePossessive] มาไกลเท่าที่จะทำได้ แต่...""
 yearly.5024.honestcouncillor.desc:0 "การสอนของ [helpful_councillor.GetCouncilTitle] [helpful_councillor.GetFirstNamePossessive] แก่ [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('scoped_heir'))] ของข้ากำลังออกผลแล้ว \n\n[scoped_heir.GetFirstName] ได้เรียนรู้มากกว่าที่ข้ากล้าหวังไว้มาก และ [scoped_heir.GetSheHe] กำลังรับผิดชอบต่อหน้าที่ในอนาคตบางอย่างของ [scoped_heir.GetHerHis] อย่างจริงจังมากกว่าเดิม"
 yearly.5024.a.a:0 "ยอดเยี่ยม! ข้ารู้อยู่แล้วว่าข้าสามารถไว้วางใจ [helpful_councillor.GetHerHim] ได้!"
 yearly.5024.a.b:0 "[helpful_councillor.GetSheHe] ทำ เช่นนี้กับข้าได้อย่างไร?!"
 yearly.5024.a.c:0 "เป็นไปไม่ได้!"
 yearly.5024.b:0 "ข้าไม่อยากจะเชื่อ ท่านอยู่เบื้องหลังเรื่องทั้งหมดนี้!"
 
 tooltip_yearly_5022_a:0 "อนุญาตให้ [helpful_councillor.GetFirstName] ดำเนินการสอนของ [helpful_councillor.GetHerHis] ต่อไป"

 yearly.5030.opening:0 "[squealing_vassal.Custom2('AppropriateGreeting', ROOT.Char)]"
 yearly.5030.earnestvassal.desc:0 "ข้าได้ค้นพบความจริงอันน่าตกใจเกี่ยวกับ [blackmailed_vassal.GetTitledFirstName] แม้ว่าข้าจะไม่อยากนำเรื่องนี้มารบกวนท่าน แต่ข้าต้องแจ้งให้ท่านทราบว่า [blackmailed_vassal.GetWomanMan] ผู้นี้กำลังเก็บงำความลับประเภทที่น่าตกใจที่สุดจากท่าน"
 yearly.5030.selfishvassal.desc:0 "ข้าเขียนมาเพื่อแจ้งให้ท่านทราบถึงการค้นพบอันน่าตกใจที่ข้าพบเกี่ยวกับ [blackmailed_vassal.GetTitledFirstName] [blackmailed_vassal.GetWomanMan] ผู้นี้กำลังมีส่วนร่วมในกิจกรรมที่ไม่น่าพึงพอใจและไร้เกียรติลับหลังท่าน\n\nข้าหวังเป็นอย่างยิ่งว่าการนำข้อมูลที่ละเอียดอ่อนนี้มาแจ้งให้ท่านทราบจะเป็นการพิสูจน์ความภักดีอันแน่วแน่ของข้าที่มีต่อท่าน [ROOT.Char.GetTitleTierName] ของข้า"
 yearly.5030.a.a:0 "ความห่วงใยของท่านเป็นที่ซาบซึ้งอย่างยิ่ง [squealing_vassal.GetFirstNameNoTooltip]"
 yearly.5030.a.b:0 "ข้าจะไม่ลืมน้ำใจของท่าน [squealing_vassal.GetFirstNameNoTooltip]"
 yearly.5030.a.tt:0 "[squealing_vassal.GetTitledFirstName] จะเปิดเผยความลับของ [blackmailed_vassal.GetTitledFirstNamePossessive] แก่ข้า"
 yearly.5030.secret.desc:0 "ได้รับแจ้งความลับ"
 yearly.5030.c:0 "ท่านควรลืมเรื่องทั้งหมดนี้เสีย [squealing_vassal.GetFirstNameNoTooltip]"
 yearly.5030.c.tt:0 "จะไม่ใช้ความลับของ [blackmailed_vassal.GetFirstNamePossessive] ต่อต้าน [blackmailed_vassal.GetHerHim]"

 yearly.5025.desc.a:0 "ต้องขอบคุณการสอนเมื่อเร็วๆ นี้ [scoped_heir.GetFirstName] สามารถเติมเต็มช่องว่างบางส่วนในการศึกษาของ [scoped_heir.GetHerHis] ได้\n\nคำขอของ [helpful_councillor.GetTitledFirstNamePossessive] เป็นแรงจูงใจที่ข้าต้องการอย่างแท้จริงเพื่อช่วยให้ [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('scoped_heir'))] ของข้าปลดล็อกศักยภาพที่ยังไม่ได้ใช้บางส่วนของ [scoped_heir.GetHerHis]"
 yearly.5025.desc.b:0 "น่าเสียดาย ความพยายามล่าสุดของข้าในการสอน [scoped_heir.GetFirstName] เพื่อเติมเต็มช่องว่างบางส่วนในการศึกษาของ [scoped_heir.GetHerHis] นั้นไร้ผล\n\nบางทีข้าไม่ควรปฏิเสธข้อเสนอของ [helpful_councillor.GetTitledFirstNamePossessive]..."
 yearly.5025.a:0 "ข้าภูมิใจในความสำเร็จของ [scoped_heir.GetHerHis]"
 yearly.5025.b:0 "[scoped_heir.Custom('GirlBoy')] ผู้นี้เพียงแค่เรียนรู้ช้าไปหน่อย"

 yearly.5040.t:0 "การสนทนาอันน่าสงสัย"
 yearly.5040.desc:0 "ข้ากำลังเดินผ่านสวนใน [ROOT.Char.Custom('ResidenceBuilding')] เพื่อเดินเล่นยามเช้า เมื่อลมพัดเบาๆ พัดพาเสียงของ [whisperer_1.GetFirstName] และ [whisperer_2.GetFirstName] มาเข้าหูข้า \n\nข้าราชสำนักทั้งสองกำลังคุยกันในจุดลับตาใกล้ๆ เหลือบมองไปรอบๆ บ่อยครั้ง เพื่อให้แน่ใจว่าไม่มีใครฟังอยู่ แม้ว่าจะเป็นการยากสำหรับข้าที่จะเข้าใจคำพูดส่วนใหญ่ของพวกเขาจากระยะไกล แต่ก็ชัดเจนว่าการสนทนาของพวกเขาเกี่ยวข้องกับ [scoped_vassal.GetTitledFirstName]"
 yearly.5040.a.a:0 "ข้าจะให้มัดตัวพวกเขาส่งไปให้ [scoped_vassal.GetFirstNameNoTooltip]"
 yearly.5040.a.b:0 "ข้าต้องเตือน [scoped_vassal.GetFirstNameNoTooltip]!"
 yearly.5040.b:0 "หากเพียง แต่ข้าจะเข้าใกล้ได้อีกสักหน่อย..."
 yearly.5040.b.success.desc.tt:0 "ข้าหลีกเลี่ยงการถูกตรวจพบ"
 yearly.5040.b.success.effect.tt:0 "ข้าเรียนรู้หัวข้อของการสนทนา"
 yearly.5040.b.failure.desc.tt:0 "[whisperer_1.GetFirstNameNoTooltip] และ [whisperer_2.GetFirstNameNoTooltip] เห็นข้า"
 yearly.5040.b.failure.effect.tt:0 "การสอบสวนไม่ได้ผล"
 yearly.5040.c.a:0 "ท่านคงไม่ปิดบังอะไรจาก [ROOT.Char.GetTitleTierName] ที่รักของท่านใช่ไหม?"
 yearly.5040.c.b:0 "ข้าต้องรู้ว่าพวกเขากำลังซ่อนอะไรอยู่ ไม่ว่าจะต้องแลกด้วยอะไรก็ตาม!"
 yearly.5040.c.success.tt:0 "ข้าทรมานเพื่อเค้นข้อมูลจาก [whisperer_1.GetFirstNameNoTooltip] และ [whisperer_2.GetFirstNameNoTooltip]"
 yearly.5040.c.failure.tt:0 "[whisperer_1.GetFirstName] และ [whisperer_2.GetFirstNameNoTooltip] ไม่ให้ความร่วมมือ"
 yearly.5040.d:0 "เอ๊ะ ข้าแน่ใจว่ามันคงไม่มีอะไรสำคัญ..."

 yearly.5041.desc.a:0 "ข้าสามารถเข้าใกล้ข้าราชสำนักทั้งสองได้โดยที่พวกเขาไม่สังเกตเห็นข้า\n\nพวกเขากำลังหารือเกี่ยวกับแผนการที่ [scoped_vassal.GetTitledFirstName] วางแผนไว้เพื่อต่อต้านข้า!"
 yearly.5041.desc.b:0 "ข้าสามารถเข้าใกล้ข้าราชสำนักทั้งสองได้โดยที่พวกเขาไม่สังเกตเห็นข้า\n\nพวกเขากำลังหารือเกี่ยวกับแผนการที่ [scoped_vassal.GetTitledFirstName] วางแผนไว้ในราชสำนักของข้าเอง!"
 yearly.5041.desc.c:0 "ข้าสามารถเข้าใกล้ข้าราชสำนักทั้งสองได้โดยที่พวกเขาไม่สังเกตเห็นข้า\n\nดูเหมือนว่าพวกเขากำลังหารือเกี่ยวกับชีวิตส่วนตัวของ [scoped_vassal.GetTitledFirstNamePossessive] และนิสัยที่ไม่น่าพึงประสงค์บางอย่างของ [scoped_vassal.GetHersHis]"
 yearly.5041.a:0 "น่าสนใจ..."

 yearly.5042.desc.safetorture:1 "ต้องใช้เวลาสักพักกว่านักโทษทั้งสองจะยอมเปิดปาก แต่นายคุกของข้าเป็น [dummy_jailor_gender.GetWomanMan] ที่อดทน หลังจากสอบสวนหลายชั่วโมง นักวางแผนทั้งสองก็พร้อมที่จะสารภาพความลับของพวกเขา"
 yearly.5042.desc.deadlytorture:1 "ปากของนักโทษปิดสนิทยิ่งกว่าที่ข้าคาดไว้ หลังจากสอบสวนมาทั้งคืน ความหงุดหงิดของนายคุกก็เข้าครอบงำ [dummy_jailor_gender.GetHerHim] และข้าราชสำนักทั้งสองก็ตายในตอนเช้า แต่ไม่ก่อนที่พวกเขาจะเปิดเผยความลับของพวกเขา"
 yearly.5042.desc.a:0 "\n\nดูเหมือนว่า [scoped_vassal.GetTitledFirstName] กำลังวางแผนต่อต้านข้า!"
 yearly.5042.desc.b:0 "\n\nดูเหมือนว่า [scoped_vassal.GetTitledFirstName] กำลังวางแผนในราชสำนักของข้าเอง!"
 yearly.5042.desc.c:0 "\n\nหัวข้อการสนทนาของพวกเขาคือนิสัยที่ไม่น่าพึงประสงค์ของ [scoped_vassal.GetTitledFirstNamePossessive] ที่ข้าไม่เคยรู้มาก่อนเลย"
 yearly.5042.a.a:0 "ช่างเป็นการค้นพบที่โชคดีและน่าตื่นเต้นอะไร เช่นนี้!"
 yearly.5042.a.b:0 "ราคาที่ต้องจ่ายอย่างหนักสำหรับข้อมูลสำคัญ"
 yearly.5040.torturefail.desc:0 "น่าเสียดายที่การสอบสวนไม่ได้ผล"
 yearly.5040.deceitfail.desc:0 "[whisperer_1.GetFirstName] และ [whisperer_2.GetFirstName] เห็นข้าและรีบกลับไปที่ [ROOT.Char.Custom('ResidenceBuilding')]"
 yearly.5043.torturedeadlyfail.desc:0 "การสอบสวนของข้าพิสูจน์แล้วว่ารุนแรงเกินไปสำหรับนักโทษทั้งสอง \n\nพวกเขาหมดลมหายใจก่อนที่จะบอกความลับแก่ข้า"
 yearly.5043.a.a:0 "ช่างเป็นการเสียเวลาอะไร เช่นนี้..."
 yearly.5043.a.b:0 "เหตุใดพวกเขาจึงไม่ยอมพูด?"
 
 yearly.5050.t:0 "การตำหนิว่ากล่าวในชีวิตสมรส"
 yearly.5050.desc.a:0 ""มิอาจยอมรับได้อย่างเด็ดขาด!" \n\n[scoped_spouse.GetFirstName] พรวดพราดเข้ามาใน [ROOT.Char.Custom('GetChamber')] ของข้า, ใบหน้าของ [scoped_spouse.GetHerHis] แดงก่ำด้วยโทสะ, ตะโกนเสียงดังพอที่ทั้ง [ROOT.Char.Custom('ResidenceBuilding')] จะได้ยิน [scoped_spouse.GetHerHim] \n\n"[slighting_courtier.GetTitledFirstName] เพิ่งจะสบประมาทเกียรติของข้า! ข้าต้องการให้ท่านขับไล่เจ้า [slighting_courtier.Custom2('InsultAdjective', SCOPE.sC('scoped_spouse'))] [slighting_courtier.Custom2('InsultNoun', SCOPE.sC('scoped_spouse'))] นั่นออกจาก [ROOT.Char.Custom('GetCourt')] ของเรา!""
 yearly.5050.desc.b:0 "ข้าประหลาดใจที่พบ [scoped_spouse.GetWifeHusband] ของข้าด้อมๆ มองๆ อยู่ในห้องทำงานของข้า จากสีหน้าของ [scoped_spouse.GetHerHis] เห็นได้ชัดว่ามีบางอย่างรบกวน [scoped_spouse.GetFirstName] แต่ข้าต้องใช้เวลาสักพักกว่าจะโน้มน้าวให้ [scoped_spouse.GetHerHim] แบ่งปันความกังวลของ [scoped_spouse.GetHerHis] กับข้าได้ \n\n"ที่รักของข้า ข้าต้องสารภาพกับท่านว่า [slighting_courtier.GetFirstName] ได้ดูหมิ่นข้าอย่างร้ายแรง ข้าทนคิดที่จะอยู่ใกล้ [slighting_courtier.GetWomanMan] หยาบคายผู้นั้นต่อไปไม่ได้อีกแล้ว""
 yearly.5050.a.a:0 "[slighting_courtier.GetSheHe|U] จะไปภายในวันพรุ่งนี้!"
 yearly.5050.b.a:0 "อย่ารบกวนข้าด้วยเรื่องไร้สาระ เช่นนี้"
 yearly.5050.b.b:0 "เป็นไปไม่ได้! [slighting_courtier.GetFirstNameNoTooltip] เป็น [slighting_courtier.GetWomanMan] ที่ดี เช่นนั้น!"
 yearly.5050.b.c:0 "ข้าคิดว่าท่านอาจจะคิดมากไปหน่อยนะ ที่รัก"
 yearly.5050.c:0 "เหตุใดท่านจึงไม่บอกข้าทุกอย่างตั้งแต่แรก?"
 yearly.5050.c.success.desc.tt:0 "ข้าหารือรายละเอียดของเหตุการณ์กับ [scoped_spouse.GetFirstNameNoTooltip]"
 yearly.5050.c.success.effect.tt:0 "ข้าเรียนรู้ว่า [scoped_spouse.GetFirstNameNoTooltip] จริงใจหรือไม่"
 yearly.5050.c.failure.desc.tt:0 "[scoped_spouse.GetFirstNameNoTooltip] ปฏิเสธที่จะฟังเหตุผล"
 yearly.5050.c.failure.effect.tt:0 "[scoped_spouse.GetWifeHusband] ของข้าเรียกร้องให้ข้าดำเนินการ"

 yearly.5051.desc.a.a:0 "ยิ่งข้าได้ยินเรื่องนี้มากเท่าไหร่ ข้าก็ยิ่งเชื่อมั่นว่า [scoped_spouse.GetWifeHusband] ของข้าไม่ได้บอกความจริงแก่ข้า ในตอนท้ายของการสนทนา ข้าเหลือความรู้สึกที่ชัดเจนว่า [scoped_spouse.GetFirstName] ได้กุเรื่องทั้งหมดขึ้นมาเพื่อใส่ร้าย [slighting_courtier.GetTitledFirstName]"
 yearly.5051.desc.a.b:0 "หลังจากตรวจสอบคำกล่าวอ้างของ [scoped_spouse.GetWifeHusband] ของข้าอย่างรอบคอบแล้ว ข้าได้ข้อสรุปว่า [scoped_spouse.GetFirstName] กำลังบอกความจริงแก่ข้า\n\n[slighting_courtier.GetTitledFirstName] ได้ดูหมิ่นเกียรติของ [scoped_spouse.GetHerHis] อย่างลึกซึ้ง และในการทำ เช่นนั้น [slighting_courtier.GetSheHe] ได้ถ่มน้ำลายรดการต้อนรับของข้า"
 yearly.5051.z:0 "หากราชสำนักรู้เรื่องข้อกล่าวหาเท็จของท่าน..."
 yearly.5051.a:0 "ข้าคาดหวังให้ท่านขอโทษ [slighting_courtier.GetFirstNameNoTooltip] สำหรับข้อกล่าวหาที่ไม่มีมูลนี้"
 yearly.5051.b:0 "อย่ากังวล ข้าจะอยู่เคียงข้างท่านเสมอ"
 yearly.5051.c:0 "บัดนี้ข้ารู้แน่แล้ว ข้าสามารถเผชิญหน้ากับ [slighting_courtier.GetFirstNameNoTooltip] ได้"
 yearly.5051.d:0 "ข้าคิดว่าท่านควรพยายามให้อภัย [slighting_courtier.GetFirstNameNoTooltip]"

 yearly.5052.desc.a:0 "แม้หลังจากหารือรายละเอียดของเหตุการณ์กับ [scoped_spouse.GetFirstName] แล้ว ข้าก็ยังไม่แน่ใจว่าจะคิดอย่างไรกับเรื่องทั้งหมด"
 yearly.5052.desc.b.a:0 "\n\n[ROOT.Char.GetTitleTierName] ที่ดีควรอยู่เคียงข้าง [scoped_spouse.GetTitleTierName] ของ [ROOT.Char.GetHerHis] แต่ข้าก็อดไม่ได้ที่จะรู้สึกว่า [scoped_spouse.GetFirstNameNoTooltip] อาจไม่ได้บอกเรื่องราวทั้งหมดแก่ข้า..."
 yearly.5052.desc.b.b:0 "\n\nแต่แล้ว [ROOT.Char.GetTitleTierName] ที่ดีก็ควรอยู่เคียงข้าง [scoped_spouse.GetTitleTierName] ของ [ROOT.Char.GetHerHis] และ [scoped_spouse.GetFirstName] ก็ดูเสียใจอย่างแท้จริงกับเหตุการณ์นี้"
 yearly.5052.a:0 "ข้าจะคุยกับ [slighting_courtier.GetTitledFirstNameNoTooltip]"
 yearly.5052.b:0 "ข้าคิดว่าท่านควรลืมเรื่องทั้งหมดนี้เสีย [scoped_spouse.GetFirstNameNoTooltip]"

 yearly.5053.desc.a:0 "[scoped_spouse.GetWifeHusband] ของข้ากำลังบ่นอีกครั้งเกี่ยวกับใครบางคนในราชสำนักที่ไม่เคารพ [scoped_spouse.GetHerHim] คราวนี้ ดูเหมือนว่าจะเป็น [slighting_courtier.GetTitledFirstName] ที่ ทำให้ [scoped_spouse.GetHerHis] โกรธเคือง [scoped_spouse.GetSheHe|U] กำลังขอให้ข้าทำอะไรบางอย่างเกี่ยวกับเรื่องนี้"
 yearly.5053.desc.b:0 "ข้าไม่แปลกใจเลยเมื่อ [scoped_spouse.GetWifeHusband] ของข้าขอให้ข้าลงโทษสมาชิกในราชสำนักอีกคนที่ ตามคำกล่าวของ [scoped_spouse.GetHerHim] ได้ลบหลู่เกียรติของ [scoped_spouse.GetHerHis] มันกลายเป็นเรื่องปกติจนข้าแทบไม่ได้ใส่ใจกับรายการความคับข้องใจที่ [scoped_spouse.GetFirstName] กล่าวหา [slighting_courtier.GetTitledFirstName]"
 yearly.5053.desc.b.a:0 "\n\nข้าไม่อาจเข้าใจได้ว่าเหตุใดผู้คนมากมายจึงมารบกวน [scoped_spouse.GetHerHim]..."
 yearly.5053.desc.b.b:0 "\n\n[ROOT.Char.GetWifeHusband] ที่น่าสงสัยกว่านี้อาจเริ่มสงสัยว่า [scoped_spouse.GetSheHe] กำลังใช้ประโยชน์จากความปรารถนาดีของข้าเพื่อกำจัดใครก็ตามที่ [scoped_spouse.GetSheHe] ไม่ชอบ..."
 yearly.5053.a:0 "พอแล้ว ข้าจะ ทำให้คนผู้นี้เป็นเยี่ยงอย่าง"
 yearly.5053.b:0 "อย่ากังวล ข้าจะจัดการกับ [slighting_courtier.GetTitledFirstNameNoTooltip]"
 yearly.5053.c:0 "พอเสียทีกับเรื่องเล็กน้อยเหล่านี้ [scoped_spouse.GetFirstNameNoTooltip]"
 
 yearly.5054.desc.a:0 "นับตั้งแต่ข้าประหาร [slighting_courtier.GetTitledFirstName] อย่างน่าสยดสยอง [scoped_spouse.GetWifeHusband] ของข้าก็มีท่าทีแปลกไป ไม่มีข้าราชสำนักมารบกวน [scoped_spouse.GetHerHim] อีกต่อไปแล้ว ดังที่ข้าคาดการณ์ไว้ หรือแม้ แต่เข้าใกล้ [scoped_spouse.GetHerHim] เว้น แต่จะถูกขอให้ทำ เช่นนั้น แต่ [scoped_spouse.GetSheHe] ก็ยังดูไม่พอใจ\n\nอันที่จริง [scoped_spouse.GetSheHe] ดูเศร้าหมองกว่าเดิมมาก"
 yearly.5054.desc.b:0 "ดังที่ข้าคาดไว้ การประหาร [slighting_courtier.GetTitledFirstName] ด้วยวิธีที่เจ็บปวดและเปิดเผยที่สุดสำหรับการดูหมิ่น [scoped_spouse.GetWifeHusband] ของข้า เป็นข้อความที่ข้าต้องการส่งไปยังราชสำนักอย่างแท้จริง\n\nไม่มีใครกล้าโต้เถียง หรือแม้แต่เข้าใกล้ [scoped_spouse.GetFirstName] โดยไม่ได้รับอนุญาตจาก [scoped_spouse.GetHerHis] อีกต่อไป ข้าจะไม่ต้องกังวลกับการบ่นไม่หยุดหย่อนของ [scoped_spouse.GetHerHis] อีกแล้ว"
 yearly.5054.a.a:0 "ข้าเชื่อว่าสมควรได้รับคำขอบคุณนะ ที่รัก"
 yearly.5054.a.b:0 "สงบสุขเสียที"

 yearly.9020.t:0 "ช้างอันทรงพลัง"
 yearly.9020.desc:1 "[marshal.Custom2('MyCharacterIntroduction', ROOT.Char)|U] เข้ามาหาข้าพร้อมรอยยิ้มบนใบหน้าของ [marshal.GetHerHis] [marshal.GetSheHe|U] อธิบายว่าข้าได้รับของกำนัลอันน่าประทับใจอย่างแท้จริงจากผู้ดูแลใน [county.GetNameNoTooltip] และกวักมือเรียกให้ข้าไปกับ [marshal.GetHerHim]\n\nและมันก็น่าประทับใจจริงๆ! ขณะที่ข้าเดินออกไปข้างนอก ข้าได้รับการต้อนรับจากช้าง #emphasis มหึมา#! ใหญ่กว่าตัวใดๆ ที่ข้าเคยเห็น สัตว์ร้ายนี้จะนำความพินาศมาสู่ศัตรูได้อย่างแน่นอน"
 yearly.9020.a:0 "ข้าจะขี่สัตว์ร้ายอันทรงพลังนี้เข้าสู่สมรภูมิด้วยตนเอง"
 yearly.9020.b:1 "[marshal.GetCouncilTitle] สัตว์ตัวนี้เป็นของท่าน"
 yearly.9020.c:2 "$knight_culture_player_no_tooltip_lowercase$ ของข้า [knight.GetTitledFirstNameNoTooltip] จะใช้ประโยชน์จากมันได้อย่างแน่นอน"
 yearly.9020.d1:1 "ขอให้เราถวายเกียรติแด่ [ROOT.Char.GetFaith.KnowledgeGodName] และปล่อยมันไป"
 yearly.9020.d2:0 "สัตว์ เช่นนี้ควรเป็นอิสระ ปล่อยมันไป"
 yearly_9020_personal_war_elephant:0 "ช้างศึกส่วนตัว"

# Oltner
 yearly.8000.t:0 "การถวายบังคม"
 yearly.8000.desc:1 "ข้าหลวงของข้า [vassal.GetTitledFirstName] ได้มาถึงนอก [ROOT.Char.Custom('ResidenceBuilding')] ของข้าพร้อมขบวนแห่อันยิ่งใหญ่ของนักการทูตที่ แต่งกายอย่างดี $knight_culture_player_plural_no_tooltip_lowercase$ และนักแสดงต่างแดน ขบวนนี้คล้ายกับขบวนพาเหรด นำโดย [vassal.GetFirstNameNoTooltip] [vassal.GetHerselfHimself]\n\nด้วยเสียงอันดัง [vassal.GetFirstNameNoTooltip] ประกาศว่า [vassal.GetSheHe] มาที่นี่เพื่อถวายบังคมและ [vassal.GetSheHe] มาพร้อมของกำนัลเป็น #emphasis ทองคำ!#!"
 yearly.8000.desc.paranoid:0 "\n\n...[vassal.GetSheHe] มาที่นี่เพื่อ #emphasis ฆ่าข้า#! อย่างแน่นอน"
 yearly.8000.desc.lunatic:0 "\n\n#emphasis บุรุษบนดวงจันทร์#! ต้องได้ยินคำวิงวอนยามเที่ยงคืนของข้าเพื่อหาเพื่อนเล่นคนใหม่แน่ๆ!"
 yearly.8000.desc.default:0 "\n\nความเอื้อเฟื้อ เช่นนี้หาได้ยากในหมู่ข้าแผ่นดิน ความภักดีของ [vassal.GetFirstNamePossessiveNoTooltip] เป็นสิ่งที่ควรค่าแก่การรักษาอย่างแท้จริง!"
 yearly.8000.desc.cannibal:0 "\n\nความเอื้อเฟื้ออันโอชะ เช่นนี้หาได้ยากในหมู่ข้าแผ่นดินผู้นุ่มนวล ความภักดีอันชุ่มฉ่ำของ [vassal.GetFirstNamePossessiveNoTooltip] เป็นสิ่งที่ควรค่าแก่การลิ้มลองอย่างแท้จริง!"
 yearly.8000.a:0 "เชิญเข้ามา! วางทองคำไว้ทางซ้ายของท่าน..."
 yearly.8000.b:0 "ทำไม... #emphasis แน่นอน#! ท่านต้องมีมากกว่านี้?"
 yearly.8000.c:0 "เก็บทองคำไว้ มิตรภาพของท่านก็เพียงพอแล้ว!"
 yearly.8000.d:0 "อย่า #emphasis ปล่อย#! ให้ [vassal.GetHerHim] เข้ามาใน [ROOT.Char.Custom('ResidenceBuilding')]!"
 yearly.8000.e:0 "ทำไมท่านไม่... อยู่ทานอาหารเย็นล่ะ?"
 yearly.8000.e.tt_eat_vassal:0 "ถูกท่านกิน"
 yearly.8000.e.tt_secret:0 "ท่านได้รับความลับเรื่องการฆาตกรรม"
 yearly.8100.t:0 "ชาวนาผู้ปิติยินดี"
 yearly.8100.desc:0 "ชาวนาใน [county.GetName] อารมณ์ดี การเก็บเกี่ยวอุดมสมบูรณ์ ถนนหนทางปลอดภัย และผู้อาวุโสในหมู่บ้านกำลังเล่าเรื่องไร้สาระเกี่ยวกับวัวที่ให้น้ำนมผสมน้ำผึ้งและห่านที่วางไข่ทองคำ\n\nชาวนากำลังสรรเสริญ #emphasis ข้า#! สำหรับโชคลาภของพวกเขา และได้ส่งคณะผู้แทนนำของกำนัลมาให้!"
 yearly.8100.a:0 "ข้ารับของกำนัลของพวกเขาด้วยความยินดี!"
 yearly.8100.b:0 "น่าสนใจ... ส่งทหารไปเก็บ 'ของกำนัล' เพิ่มเติม!"
 yearly.8100.c:0 "ไม่ พวกเขาต้องการส่วนเกินของพวกเขามากกว่าข้า"
 yearly.8200.t:0 "การบริจาคด้วยศรัทธาอันดี"
 yearly.8200.desc:0 "[realm_priest.GetCouncilTitle] ของข้า [realm_priest.GetFirstName] ได้รับบริจาคทองคำจำนวนมากจากทรัพย์สินของผู้ถือครองที่ดินที่ร่ำรวย แต่ไม่มีบุตร ซึ่งเสียชีวิตไปแล้ว [realm_priest.GetSheHe|U] อ้างว่าผู้ตายใช้ชีวิตอย่างประหยัดและเคร่งศาสนามาก และปรารถนาให้ทองคำไปอยู่ในที่ที่สามารถทำความดีได้\n\n[realm_priest.GetCouncilTitle] [realm_priest.GetFirstName] ยืนกรานว่าข้าควรได้รับส่วนหนึ่งของการบริจาค เนื่องจากข้าเป็น "แบบอย่างของ [ROOT.Char.GetFaith.GetNameNoTooltip] ใน [ROOT.Char.GetPrimaryTitle.GetNameNoTierNoTooltip]""
 yearly.8200.a:0 "มอบทรัพย์สมบัติของ #emphasis [ROOT.Char.GetFaith.HighGodNamePossessive]#! หรือ? #emphasis พวกนอกรีต!#!"
 yearly.8200.b:0 "ข้าสัญญา ทองคำนี้จะรับใช้อาณาจักร"
 yearly.8200.c:0 "'แบบอย่าง' ผู้นี้สมควรได้รับการบริจาคทั้งหมด!"
 yearly.8200.d:0 "ได้โปรด มอบให้คนยากจนในนามของข้า"
 yearly.8200.desc.zealous:0 "\n\n...[realm_priest.GetSheHe] ต้องถูก [ROOT.Char.GetFaith.DevilName] ครอบงำอย่างแน่นอน!"
 yearly.8200.desc.generous:0 "\n\nหัวใจของข้าเต้นแรงเพื่อวิญญาณทั้งหมดที่ข้าสามารถช่วยได้ด้วยทองคำนั้น!"
 yearly.8200.desc.greedy:0 "\n\n...โดยธรรมชาติแล้ว ข้าตั้งใจจะเก็บเงินไว้ใช้เอง!"
 yearly.8200.desc.default:0 "\n\nเป็นข้อเสนอที่น่าดึงดูดใจอย่างแท้จริง"
 yearly.8300.t:0 "การบริจาคเข้าคลังสงคราม"
 yearly.8300.desc:0 "ขณะที่ข้ามองคลังสมบัติที่เกือบจะว่างเปล่าด้วยความหวาดกลัว มหาดเล็กของข้าประกาศว่าข้าหลวงสี่คนของข้าได้มาถึงแล้ว\n\n"เรานำทองคำมา นายเหนือหัวของข้า เป็นการบริจาคเพื่อเอาชนะศัตรูของเรา!" [vassal_1.GetTitledFirstName] ประกาศ\n\n"ข้านำ [vassal_2.GetTitledFirstName] ผู้ [vassal_2.Custom('FormalComplimentAdjective')] [vassal_3.GetTitledFirstName] ผู้ [vassal_3.Custom('FormalComplimentAdjective')] และ [vassal_4.GetTitledFirstName] ผู้ [vassal_4.Custom('FormalComplimentAdjective')] มาด้วย — เราเพียงขอให้ท่านนำเราไปสู่ชัยชนะ!""
 yearly.8300.a:0 "ข้ายินดีรับความเอื้อเฟื้อของท่าน!"
 yearly.8300.b:0 "#emphasis ทองคำ#! ท่านว่าหรือ? ทหาร #emphasis ยึดทั้งหมดเสีย!#!"
 yearly.8300.c:0 "ท่านช่างเอื้อเฟื้อเกินไป ข้าไม่อาจรับได้"
 yearly.8300.d:0 "ทองคำ? ข้าอยากจะ #emphasis เกณฑ์กางเกงของท่านมากกว่า!#!"
 yearly.8400.t:0 "คนนอกคอกหลุดรอด"
 yearly.8400.desc:0 "ขณะที่ข้ากลับไปยัง [ROOT.Char.Custom('GetChamber')] เพื่อพักผ่อนในยามค่ำ ข้าบังเอิญไปพบแขกคนหนึ่งของข้า [deviant_guest.GetTitledFirstName] ในสถานที่ส่วนตัวที่สุดของข้า — [deviant_guest.GetSheHe] เข้ามาที่นี่ได้อย่างไร!?\n\n"มันไม่ใช่อย่างที่ท่านเห็น [ROOT.Char.Custom('FormOfAddressForLiege')]!" [deviant_guest.GetSheHe] อ้าง\n\nความจริงที่ว่า [deviant_guest.GetSheHe] อยู่ในสภาพกึ่งเปลือย และกำลังใช้ร่างกายลบหลู่ #emphasis [ROOT.Char.Custom('RandomPrivateObject')]#! ของข้า บอกข้าว่า อันที่จริง มันคือสิ่งที่เห็นนั่นแหละ"
 yearly.8400.a:0 "อะไรนะ... แต่... #emphasis ออกไปจาก [ROOT.Char.Custom('GetRealmOrDomicile')] ของข้า!#!"
 yearly.8400.special:0 "ฟังนะ ข้ารู้ #emphasis แน่นอน#! ว่าท่านควรไปที่ไหน"
 yearly.8400.b:0 "ท่านทำได้อย่างไร!? ไปที่ [ROOT.Char.Custom('GetDungeon')] กับเจ้า!"
 yearly.8400.c:0 "เรื่องนี้จะไม่เกิดขึ้นอีก เข้าใจไหม?"
 yearly.8400.d:0 "ข้าไม่เคยรู้เลยว่าท่านสามารถทำ #emphasis อย่างนั้น#! ได้ น่าสนใจ..."
 yearly.8400.a.tt:0 "ข้าส่ง [deviant_guest.GetTitledFirstName] ไปยัง [appropriate_court_target_owner.Custom('GetCourt')] ของ [appropriate_court_target_owner.GetTitledFirstName] ที่ ซึ่ง [deviant_guest.GetSheHe] จะเป็นสายลับชั้นดี..."
 
 yearly.8500.opening:0 "[current_head_of_faith.Custom2('AppropriateGreeting', ROOT.Char)]"
 yearly.8500.desc.a:0 "สถานการณ์ที่ท่านเผชิญอยู่นั้นโชคร้าย ถึงกระนั้น ข้าขอมอบของกำนัลนี้แก่ท่าน เพื่อที่ท่านจะได้ชัยชนะในช่วงเวลาอันตรายนี้\n\nข้าสวดภาวนาให้ [current_head_of_faith.GetFaith.HighGodName] อยู่เคียงข้างท่าน"
 yearly.8500.desc.b:0 "การต่อสู้อันชอบธรรมของท่านต่อผู้ไม่เชื่อในศรัทธาไม่ได้ถูกมองข้าม ข้าได้ส่งทูตเป็นการส่วนตัวพร้อมเหรียญมากพอที่จะช่วยให้ท่านผ่านช่วงเวลาที่วุ่นวายนี้ไปได้\n\nขอ [current_head_of_faith.GetFaith.HighGodName] คุ้มครองท่าน"
 yearly.8500.a:0 "ข้าคุกเข่าสรรเสริญ [current_head_of_faith.GetFaith.HighGodName]!"
 yearly.8500.b:0 "ข้าไม่อาจรับของกำนัลนี้ได้ มันมากเกินไป"
