l_english: 
 yearly.1001.t:0 "เหลือบมองผ่านแพขนตา"
 yearly.1001.start.desc:0 "เมื่อสายตาของข้าสบกับของ[married_seducer.GetTitledFirstNamePossessive]เป็นครั้งที่ยี่สิบเห็นจะได้ในคืนนี้ ข้ารู้ว่าข้าไม่ได้คิดไปเอง แม้จะอยู่คนละฟากของโต๊ะ สายตาของ[married_seducer.GetHerHis]ก็ยังรู้สึกร้อนแรงดุจดวงตะวันยามเที่ยงวัน\n\n[married_seducer.GetSheHe|U]ต้องการข้า,"
 yearly.1001.end_hesitation.desc:0 "และข้ารู้สึกได้ว่าร่างกายของข้ากำลังตอบสนอง ตื่นตัว แต่[seducer_spouse.GetTitledFirstName] – [seducer_spouse.GetWifeHusband]ของ[married_seducer.GetHerHis], และ[ROOT.Char.Custom2('RelationToMe', SCOPE.sC('seducer_spouse'))]ของข้า – ก็อยู่ที่นี่ในคืนนี้ด้วย..."
 yearly.1001.end_intimidated.desc:0 "และข้าหวาดกลัวเหลือเกิน กลัว[married_seducer.GetHerHim]รึ? กลัว[seducer_spouse.GetWifeHusband]ของ[married_seducer.GetHerHis] [seducer_spouse.GetTitledFirstName]รึ? หรือ... กลัวสิ่งที่ข้าอาจจะทำลงไป? ข้ามิอาจบอกได้"

 yearly.1001.end_spiteful.desc:0 "และข้ามิอาจโกหกได้ ข้าก็ต้องการ[married_seducer.GetHerHim] เช่นกัน... หรือว่าการลงโทษ[seducer_spouse.GetWifeHusband]ของ[married_seducer.GetHerHis], [seducer_spouse.GetTitledFirstName], คือสิ่งที่ข้าปรารถนาอย่างแท้จริง? มันสำคัญด้วยหรือ?"
 yearly.1001.a:0 "ข้าจะมอบความสุขสมให้[married_seducer.GetHerHim]!"
 yearly.1001.a.tt:0 "ข้าจะไปหา[married_seducer.GetTitledFirstName]เมื่อทุกคนหลับแล้ว"
 yearly.1001.b:0 "ทุกคนจะได้รู้ถึงความคิดอันบาปหนาของ[married_seducer.GetHerHis]!"
 yearly.1001.c:0 "ไม่! หัวใจของข้ายังคงบริสุทธิ์"
 
 yearly.1002.desc:0 "หลังจากนั้น, [married_seducer.GetFirstName]ทิ้งตัวลงบนฟูกเสียงดังตุ้บ ลมหายใจของ[married_seducer.GetHerHis]หอบกระชั้นและดวงตาปิดลงครึ่งหนึ่ง ข้าเช็ดเหงื่อจาก[married_seducer.Custom('ObjectifiedFeature')]ของ[married_seducer.GetHerHis]อย่างอ่อนโยนด้วยปลายนิ้วแผ่วเบา\n\nเพียงครู่ต่อมา, [married_seducer.GetFirstNameNoTooltip]ปัดมือข้าออกพร้อมรอยยิ้มขอโทษ "ใกล้รุ่งเช้าแล้ว ข้าควรไปดีกว่า""
 yearly.1002.a:0 ""ท่านอยู่ต่ออีกสักหน่อยได้หรือไม่? ได้โปรด?""
 yearly.1002.a.success:0 "[married_seducer.GetFirstNameNoTooltip]อยู่ต่อ"
 yearly.1002.a.success.message:0 "[married_seducer.GetFirstName]และข้าร่วมรักกันจนตะวันขึ้น"
 yearly.1002.a.failure:0 "[married_seducer.GetFirstNameNoTooltip]คิดว่าข้าน่ารำคาญ"
 yearly.1002.a.failure.message:0 "[married_seducer.GetFirstName]หัวเราะเยาะข้าแล้วจากไป"
 yearly.1002.b:0 ""จริงด้วย ท่านรีบไปเถอะ""
 yearly.1002.b.success:0 "[married_seducer.GetFirstNameNoTooltip]ชื่นชมในความไม่ยึดติดของข้า"
 yearly.1002.b.success.message:0 "[married_seducer.GetFirstName]ชื่นชมในความไม่ยึดติดของข้า"
 yearly.1002.b.failure:0 "[married_seducer.GetFirstNameNoTooltip]คาดหวังบางอย่างมากกว่านี้"
 yearly.1002.b.failure.message:0 "[married_seducer.GetFirstName]รู้สึกเจ็บปวด ราวกับว่า[married_seducer.GetSheHe]คาดหวังบางอย่างมากกว่านี้"

 yearly.1003.t:0 "ข้าน่าจะรู้"
 yearly.1003.start.desc: "เมื่อข้ามั่นใจว่าไม่มีใครตามมา ข้าก็แง้มประตูห้องของ [married_seducer.GetFirstNamePossessive] และชะโงกมองเข้าไป เป้าหมายแห่งความปรารถนาของข้ายืนหันหลังของ[married_seducer.GetHerHis]ให้ข้า เปลือยเปล่าราวกับวันที่ [married_seducer.GetSheHe] เกิด"
 yearly.1003.end.desc:0 "ข้าผลักประตู เอนตัวเข้าไปใกล้...\n\nทันใดนั้น ด้วยเสียงดังปังและความเจ็บปวดรุนแรง ข้าหงายหลัง ล้มลงกระแทกพื้นอย่างแรง มีเสียงกรีดร้อง กรีดร้องดังมาก และเสียงฝีเท้า ศีรษะของข้าหมุนติ้ว...\n\n"เหมือนหนูติดกับ" เสียงคุ้นเคยกระซิบข้างหูข้า [seducer_spouse.GetTitledFirstName] ให้ตายสิ"
 yearly.1003.a:0 "ข้า... ข้ากำลังมองหาห้องสุขา!"

 yearly.1010.t:0 "หายไปในยามค่ำคืน"
 yearly.1010.start.desc:0 "เมื่อข้าเข้าไปใน [ROOT.Char.Custom('GetChamberPlural')] ของ [abductee.GetTitledFirstNamePossessive] สิ่งแรกที่ข้าสังเกตเห็นคือทหารยามที่ฟุบหลับอยู่ตรงมุมห้อง สิ่งที่สองคือรอยแผลสีแดงสดที่คอของ [dummy_gender.GetHerHis] อย่างไรก็ตาม [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('abductee'))] ของข้ากลับหายไปไหนไม่รู้!\n\n"
 yearly.1010.friend.desc:0 "[hunter.GetTitledFirstName]ก้าวเข้ามาใน[ROOT.Char.Custom('GetRoom')] มีคันธนูพาดอยู่บนไหล่ของ[hunter.GetHerHis] "ข้าขออภัย สหายเก่า เป็น[abductor.GetTitledFirstName]ที่พา[abductee.GetHerHim]ไป""
 yearly.1010.marshal.desc:1 "[ROOT.Char.Custom2('RelationToMe', SCOPE.sC('hunter'))]ของข้าก้าวเข้ามาใน[ROOT.Char.Custom('GetRoom')] มีคันธนูพาดอยู่บนไหล่ของ[hunter.GetHerHis] "ยามที่รอดชีวิตอ้างว่าเป็น[abductor.GetTitledFirstName]ที่พา[abductee.GetHerHim]ไป นายท่าน/นายหญิงของข้า""
 yearly.1010.end.desc:0 "สุนัขล่าเนื้อและเหล่า[dummy_gender.GetWomenMen]พร้อมแล้ว ท่านมีคำสั่งใด?""
 yearly.1010.abduction.tt:0 "[abductee.GetTitledFirstName]ถูกลักพาตัวโดย [abductor.GetTitledFirstName]"
 yearly.1010.friend.tt:0 "[ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('hunter'))]ของข้า [hunter.GetTitledFirstName] อยู่ที่นี่เพื่อช่วย"
 yearly.1010.a:0 "จับเป็น[abductor.GetTitledFirstNameNoTooltip]"
 yearly.1010.a.tt:0 "ข้าจะสามารถตัดสินใจได้ว่าต้องการให้ช่วยชีวิต จับกุม หรือสังหาร[abductee.GetTitledFirstName]ในลำดับต่อไป\n\n"
 yearly.1010.b:0 "ข้าต้องการให้ [abductor.Custom2('InsultNoun', ROOT.Char)] นั่นตาย"
 yearly.1010.c:0 "สิ่งเดียวที่ข้าสนใจคือการกลับมาอย่างปลอดภัยของ[abductee.GetFirstNamePossessiveNoTooltip]"
 yearly.1010.d:0 "ข้าไม่สนใจ ปล่อยพวกเขาไป"
 yearly_1010_save_abductee_random_list_effect.success.tt:0 "[abductee.GetShortUIName|U]ได้รับการช่วยเหลือ"
 yearly_1010_save_abductee_random_list_effect.failure.tt:0 "[abductee.GetShortUIName|U]ถูกลักพาตัวโดย [abductor.GetShortUIName]"
 
 yearly.1011.desc:0 ""แล้ว[ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('abductee'))]ของท่านล่ะ?" [hunter.GetFirstName]ถาม "ไม่มีใครนอกจากยามของ[abductee.GetHerHis]ที่เห็นหรือได้ยินอะไรเลย ข้ามั่นใจว่ามีคำอธิบายที่ดี แต่ท่านควรรู้ไว้ — [dummy_gender.GetWomenMen]บางคนสงสัยว่า[abductee.GetSheHe]ไปโดยสมัครใจ...""
 yearly.1011.a:0 "ไร้สาระ ปกป้อง[abductee.GetFirstNameNoTooltip]ด้วยชีวิตของเจ้า"
 yearly.1011.b:0 "ข้าต้องการให้[abductee.GetHerHim]ถูกล่ามโซ่"
 yearly.1011.c:0 "เชือดคอ[abductee.GetHerHis]แล้วฝังศพเสีย"

 yearly_1010_outcome_effect_escape.tt:0 "[THIS.Char.GetTitledFirstName]หนีไปได้"
 yearly_1010_outcome_effect_abductee_save.tt:0 "[abductee.GetTitledFirstName]ได้รับการช่วยเหลือและกลับมาหาข้า"
 yearly_1010_outcome_effect_abductee_lost.tt:0 "[abductee.GetTitledFirstName]ถูกพาตัวไปโดย [abductor.GetTitledFirstName]"
 yearly_1010.target_imprison.desc:0 "[THIS.Char.GetTitledFirstNameNoTooltip]ถูกจับกุม"
 yearly_1010.target_wounded.desc:0 "[THIS.Char.GetTitledFirstNameNoTooltip]ได้รับบาดเจ็บ แต่หนีไปได้"
 yearly_1010.hunter_killed.desc:0 "[THIS.Char.GetTitledFirstNameNoTooltip]สังหาร[hunter.GetTitledFirstNameNoTooltip]และหนีไป"
 yearly_1010.target_killed.desc:0 "[THIS.Char.GetTitledFirstNameNoTooltip]ถูกสังหาร"
 yearly_1010.abductee_saved.desc:0 "[abductee.GetTitledFirstNameNoTooltip]ได้รับการช่วยเหลือ"
 yearly_1010.abductee_saved.tt:0 "[abductee.GetTitledFirstName]ถูกนำกลับมาหาข้าอย่างปลอดภัย"
 yearly_1010.abductee_lost.desc:0 "[abductor.GetTitledFirstNameNoTooltip]หนีไปพร้อมกับ[abductee.GetTitledFirstNameNoTooltip]"
 yearly_1010.abductee_lose.tt:0 "[abductee.GetTitledFirstName]ถูกพาตัวไปจากดินแดนของข้า"
 yearly_1010_kill_target_effect.tt:0 "[hunter.GetTitledFirstName]จะรู้ความลับของข้า"
 yearly.1013.start.desc:0 "ความไม่แน่นอนนั้นเหลือทน ชั่วโมงหนึ่งผ่านไป สอง สาม... ข้ากำลังจะเรียกม้าของข้าเมื่อได้ยินเสียงตะโกนจากอีกฟากของประตู\n\n"
 yearly.1013.hunter_dead_start.desc:0 "เมื่อข้าเข้าไปใน[ROOT.Char.Custom('GetCourtyard')] ข้าพบเพียงใบหน้าที่ขมขื่นและร่างไร้วิญญาณของ[hunter.GetFirstNamePossessive] วางอยู่บนเปลหามชั่วคราว"
 yearly.1013.hunter_alive_start.desc:0 "ข้าวิ่งเข้าไปใน[ROOT.Char.Custom('GetCourtyard')] เห็นใบหน้าที่เศร้าสลดของ[hunter.GetFirstNamePossessive]ทันที"
 yearly.1013.hunter_dead_abductee_lost.desc:0 "ข้ามองไปรอบๆ แต่ไม่มีความหวังใดๆ มีเพียงใบหน้าที่เต็มไปด้วยความขมขื่น\n\n"[abductor.GetTitledFirstName] พา [abductee.GetHerHim] ไปแล้ว ขอรับ [ROOT.Char.Custom('GetCourtOwner')] พวกเรา ทำให้ท่านผิดหวัง...""
 yearly.1013.hunter_dead_both_escaped.desc:0 "[abductor.GetTitledFirstName]และ[abductee.GetTitledFirstName]หลุดรอดเงื้อมมือข้าไปได้"
 yearly.1013.abductee_lost.desc:0 "ข้าเคลื่อนตัวไปยังประตู สวดภาวนาขอให้เห็นใบหน้าของ[abductee.GetTitledFirstNamePossessive]ที่มุมตึก แต่ทุกใบหน้าที่ข้าเห็นเต็มไปด้วยความขมขื่น และไม่มีใบหน้าใดเป็นของ[abductee.GetHersHis]"
 yearly.1013.abductor_escaped_abductee_killed.desc:0 "ถึงกระนั้น ภารกิจก็ไม่ได้ล้มเหลวโดยสิ้นเชิง ขณะที่[abductor.GetTitledFirstName]หนีไปได้ [hunter.GetFirstName]ก็กระซิบบอกข้าอย่างเงียบๆ ว่า[abductee.GetFirstName]ถูกฝังในหลุมตื้นๆ แล้ว"
 yearly.1013.abductor_escaped_abductee_imprisoned.desc:0 "ถึงกระนั้น ภารกิจก็ไม่ได้ล้มเหลวโดยสิ้นเชิง ขณะที่ข้าได้รับแจ้งว่า[abductor.GetTitledFirstName]หนีไปได้ [abductee.GetFirstName]กลับไม่โชคดี เช่นนั้น..."

 yearly.1013.a1:0 "ข้าจะจัดการกับเจ้าเร็วๆ นี้, [abductee.GetFirstNameNoTooltip]..."
 yearly.1013.a2:0 "อย่างน้อย[abductee.GetFirstNameNoTooltip]ก็ปลอดภัย..."
 yearly.1013.a3:0 "เจ้าจะต้องชดใช้, [abductor.GetFirstNameNoTooltip]..."

 yearly.1014.t:0 "การล่าที่ประสบความสำเร็จ"
 yearly.1014.safe_hunter_start.desc:0 "เมื่อข้าเข้าไปใน[ROOT.Char.Custom('GetCourtyard')] ข้าได้รับการต้อนรับด้วยรอยยิ้มกว้างของ[hunter.GetFirstNamePossessive] "
 yearly.1014.abductee_saved_abductor_killed.desc:0 "ห่อด้วยผ้าห่ม นั่งอยู่บนหลังม้าของ[hunter.GetHerHis] คือ[abductee.GetFirstName] ไม่ได้รับบาดเจ็บ\n\nขณะที่ข้าช่วย[abductee.GetHerHim]ลงมา ข้าเหลือบมองไปที่[hunter.GetFirstName] [hunter.GetSheHe|U]พยักหน้า [abductor.GetTitledFirstName]ถูกจัดการแล้ว"
 yearly.1014.abductee_saved_abductor_imprisoned.desc:0 "ห่อด้วยผ้าห่ม นั่งอยู่บนหลังม้าของ[hunter.GetHerHis] คือ[abductee.GetFirstName] ภาพนั้น ทำให้หัวใจข้าพองโต\n\nจากนั้น ข้าก็เห็นใบหน้าที่คุ้นเคยอีกใบหน้าหนึ่ง: [abductor.GetTitledFirstName], ถูกล่ามโซ่, ถูกลากอยู่หลังม้าอีกตัวหนึ่ง ยอดเยี่ยม"
 yearly.1014.abductee_saved_abductor_escaped.desc:0 "ห่อด้วยผ้าห่ม นั่งอยู่บนหลังม้าของ[hunter.GetHerHis] คือ[abductee.GetFirstName] ไม่ได้รับบาดเจ็บ\n\nขณะที่ข้าช่วย[abductee.GetHerHim]ลงมา ข้าเหลือบมองไปที่[hunter.GetFirstName] [hunter.GetSheHe|U]ส่ายหน้าของ[hunter.GetHerHis] ไม่เป็นไร ไม่ใช่ตอนนี้ เราจะจัดการกับ[abductor.GetTitledFirstName]ในเวลาที่เหมาะสม"
 yearly.1014.both_killed.desc:0 "[hunter.GetSheHe|U]กวักมือเรียกให้ข้าตามไป\n\nเมื่อเราอยู่ห่างจากหูคนอื่น [hunter.GetFirstName]ก็เล่าทุกอย่างให้ข้าฟัง ขณะที่[hunter.GetSheHe]บรรยายว่าพวกเขาตายอย่างไร ถูกฝังที่ไหนและอย่างไร ความตึงเครียดของข้าก็ค่อยๆ คลายลง จะไม่มีใครรู้เลย"
 yearly.1014.both_imprisoned.desc:0 "[hunter.GetSheHe|U]มีเชือกอยู่ในมือของ[hunter.GetHerHis] ซึ่ง[hunter.GetSheHe]กระตุก คนสองคนสะดุดล้มไปข้างหน้า\n\n[abductee.GetFirstName]และ[abductor.GetFirstName] – ถูกมัดและปิดตา"
 yearly.1014.abductee_killed_abductor_imprison.desc:0 "ข้างๆ [hunter.GetHerHim], ถูกปิดตาและล่ามโซ่, ยืนอยู่คือ[abductor.GetTitledFirstName]\n\nส่วน[abductee.GetTitledFirstName]... การหายตัวไปของ[abductee.GetHerHis|U]และสีหน้าของ[hunter.GetFirstNamePossessive]บอกข้าว่าทุกอย่างเป็นไปตามแผน"
 yearly.1014.abductee_imprisoneid_abductor_killed.desc:0 "ข้างๆ [hunter.GetHerHim], ถูกปิดตาและล่ามโซ่, ยืนอยู่คือ[abductee.GetTitledFirstName]\n\nส่วน[abductor.GetTitledFirstName]... การหายตัวไปของ[abductor.GetHerHis|U]และสีหน้าของ[hunter.GetFirstNamePossessive]บอกข้าว่าทุกอย่างเป็นไปตามแผน"
 yearly.1014.a:0 "นี่คือชะตากรรมที่รอคอยทุกคนที่ขวางทางข้า!"

 yearly.1015.t:0 "ลูกแกะที่หายไปของข้า"
 yearly.1015.start.desc:0 "เมื่อ[abductee.GetFirstName]ปรากฏตัวที่ประตูเมื่อคืนนี้ ข้าคิดว่าผีของ[abductee.GetHerHis]กลับมาหลอกหลอนข้า ข้าเริ่มเชื่อแล้วว่าจะไม่ได้เห็น[abductee.GetHerHim]อีก แต่[abductee.GetSheHe]ก็อยู่ที่นั่น ตัวตนจริงเหมือนพื้นดินใต้เท้าข้า\n\n[abductee.GetFirstNameNoTooltip]ไม่ได้พูดอะไรมากนักตั้งแต่[abductee.GetHerHis]กลับมา เพียง แต่บอกว่า"
 yearly.1015.released.desc: "[abductor.GetTitledFirstName] ตัดสินใจปล่อยตัว [abductee.GetHerHim] ไป ข้าไม่คิดว่า [abductor.GetTitledFirstNameNoTooltip] จะมีกระดูกสันหลังแห่งเกียรติยศอยู่ในร่างของ[abductor.GetHerHis]เลย แต่ [abductee.GetFirstNameNoTooltip] ก็เป็นอิสระแล้ว [abductee.GetSheHe] มิใช่หรือ...?"
 yearly.1015.escaped.desc:0 "[abductee.GetSheHe]เห็นโอกาสและหนีออกมาได้ แม้ว่าจะฟังดูไม่น่าเป็นไปได้อย่างยิ่ง แต่เรื่องแปลกประหลาดกว่านี้ก็เคยเกิดขึ้นมาแล้ว ใช่หรือไม่...?"
 yearly.1015.immediate.tt:0 "[abductee.GetTitledFirstName]กลับมายังราชสำนักของข้าแล้ว"
 yearly.1015.a.trusting:0 "ขอบคุณ[ROOT.Char.GetFaith.HighGodName]สำหรับการกลับมาอย่างปลอดภัยของ[abductee.GetFirstNamePossessiveNoTooltip]!"
 yearly.1015.a.paranoid:0 "[abductee.GetFirstNameNoTooltip]กำลังปิดบังบางอย่าง ข้ามั่นใจ..."
 yearly.1015.a:0 "ข้าไม่รู้จะเชื่ออะไรดี..."
 
 yearly.1020.opening:0 "[vip.Custom2('AppropriateGreeting', ROOT.Char)]"
 yearly.1020.desc:1 "ในอีกไม่กี่วัน [vip.Custom2('RelationToMeShort', SCOPE.sC('enemy'))] ที่ [enemy.Custom2('InsultAdjective', SCOPE.sC('vip'))] ของข้า, [enemy.GetTitledFirstName], จะเดินทางผ่าน [my_county.GetNameNoTierNoTooltip] หากเจ้าวางแผนซุ่มโจมตีและจับกุม [enemy.GetHerHim] ได้, ข้าจะตอบแทนเจ้าอย่างงาม\n\nหากเจ้ายอมรับข้อเสนอของข้า, เจ้าจะได้รับเงินครึ่งหนึ่งทันที, และอีกครึ่งหนึ่งเมื่อเจ้าส่งมอบ [enemy.GetTitledFirstNameNoTooltip] หาก [enemy.GetSheHe] พึงตายในระหว่างการต่อสู้, ข้าก็จะไม่เสียน้ำตา, แต่ข้าจะไม่จ่ายค่าศพของ [enemy.GetHerHis] หรอก\n\nข้าเชื่อใจว่าถ้อยคำบนแผ่นหนังนี้จะยังคงอยู่เพียงระหว่างเรา ข้ารอคอยคำตอบของเจ้า"
 yearly.1020.a:0 "ข้ารู้ที่ที่เหมาะที่สุดสำหรับการซุ่มโจมตี..."
 yearly.1020.a.rl.t:0 "ในอีกไม่กี่วัน"
 yearly.1020.a.capture.desc:0 "ข้าจับกุม[enemy.GetTitledFirstNameNoTooltip]"
 yearly.1020.a.capture.tt:0 "[vip.GetTitledFirstName]จะมอบเงินส่วนที่เหลือเมื่อ[vip.GetSheHe]มารับตัว[enemy.GetTitledFirstName]"
 yearly.1020.a.escape.desc:0 "[enemy.GetTitledFirstNameNoTooltip]หนีไปได้"
 yearly.1020.b:0 "ข้าจะแสร้งทำเป็นยอมรับ แต่จะเตือน[enemy.GetFirstNameNoTooltip]อย่างลับๆ"
 yearly.1020.a.kill.desc:0 "[enemy.GetTitledFirstNameNoTooltip]ถูกสังหารในการซุ่มโจมตี"
 yearly.1020.a.kill.message:0 "[enemy.GetTitledFirstName]ถูกสังหารในการซุ่มโจมตี"
 yearly.1020.b.success.desc:0 "[vip.GetTitledFirstNameNoTooltip]เชื่อว่าข้าซุ่มโจมตี[enemy.GetTitledFirstNameNoTooltip]"
 yearly.1020.b.success.tt:0 "[vip.GetTitledFirstName]จะไม่มีวันรู้ว่าข้าหักหลัง[vip.GetHerHis]"
 yearly.1020.b.failure.desc:0 "[vip.GetTitledFirstNameNoTooltip]พบว่าข้าเตือน[enemy.GetTitledFirstNameNoTooltip]"
 yearly.1020.c:0 "ข้อตกลงนี้ฟังดูอันตรายเกินไป"

 yearly.1021.desc:0 "สายลับที่ข้าส่งไปแทรกซึมในคณะของ [enemy.GetTitledFirstNamePossessive] ได้ส่งรายงานของหล่อนมาให้ข้า โอ้, ช่างเป็นเรื่องที่น่าตื่นเต้นอะไร เช่นนี้! แน่นอนว่า, สีหน้าอิ่มเอมใจนั่นคงหายไปจากใบหน้าของ [enemy.GetFirstNamePossessiveNoTooltip] แล้ว!\n\nเหล่าทหารที่จะไปรับตัวเจ้า [enemy.Custom2('InsultAdjective', SCOPE.sC('vip'))] [enemy.Custom2('InsultNoun', SCOPE.sC('vip'))] นั่นกำลังเดินทางไปแล้ว, และใช่, พวกเขานำทองคำไปด้วย\n\nนับเป็นความยินดีที่ได้ทำธุรกิจกับท่าน, [ROOT.Char.GetLadyLord|U] [ROOT.Char.GetFirstNameNoTooltip] ข้าหวังว่าเส้นทางของเราจะมาบรรจบกันอีกครั้ง"
 yearly.1021.a:0 "โอ้ ความยินดีเป็นของข้าทั้งหมด"
 yearly.1021.b:0 "อันที่จริง ข้าคิดว่าข้าจะเก็บ[enemy.GetHerHim]ไว้!"
 yearly.1021.b.tt:0 "[enemy.GetTitledFirstName]จะยังคงเป็นนักโทษของข้า"

 yearly.1022.opening:0 "[enemy.Custom2('AppropriateGreeting', ROOT.Char)]"
 yearly.1022.desc:0 "ท่านช่างเป็น [ROOT.Char.GetWomanMan] ผู้ทรงเกียรติอย่างยิ่ง, [ROOT.Char.GetLadyLord|U] [ROOT.Char.GetFirstNameNoTooltip] ข้าเป็นหนี้อิสรภาพของข้าแก่ท่าน — หรืออาจจะกระทั่งชีวิตของข้า ใครจะรู้ว่าเจ้า [vip.Custom2('InsultAdjective', SCOPE.sC('enemy'))] [vip.Custom2('InsultNoun', SCOPE.sC('enemy'))] [vip.GetTitledFirstName] นั่นจะทำอะไรกับข้า, หากข้าต้องไปลงเอยในคุกใต้ดินของ [vip.GetHerHis]?\n\nข้าจะตอบแทนบุญคุณนี้, ข้าสาบาน จนกว่าจะถึงตอนนั้น, ขอให้ท่านปลอดภัย"
 yearly.1022.a:0 "และท่านด้วย, [enemy.GetLadyLord] [enemy.GetFirstNameNoTooltip]"

 yearly.1023.opening:0 "[vip.Custom2('AppropriateGreetingNegative', ROOT.Char)]"
 yearly.1023.desc:0 "ท่านคิดจริงๆ หรือว่าท่านจะรอดพ้นจากแผนการเล็กๆ น้อยๆ ของท่านได้? ข้ามีหูตาอยู่ทุกหนแห่ง, [ROOT.Char.GetLadyLord|U] [ROOT.Char.GetFirstNameNoTooltip], และต่อจากนี้ไปพวกเขาจะจับตาดูท่านอย่างใกล้ชิด\n\nข้าสาบานด้วยชีวิตของข้า — ท่านจะต้องเสียใจในวันที่ท่านตัดสินใจหักหลังข้า"
 yearly.1023.a:0 "เรื่องนี้ควรจะจบลงได้ดีกว่านี้..."

 yearly.1030.t:0 "ทุกคน [hooked.GetWomanMan|U] เพื่อ [hooked.GetHerselfHimself|U]"
 yearly.1030.nervous.desc:0 "[hooked.GetTitledFirstName]กำลังขยับแขนเสื้อของ[hooked.GetHerHis]อย่างประหม่าขณะที่ข้าเข้าไปใน[ROOT.Char.Custom('GetChamber')]ของข้า [hooked.GetSheHe]มาทำอะไรที่นี่ในเวลานี้?\n\n"ขออภัยอย่างสุดซึ้ง แต่ข้าต้องพูดคุยกับท่านเป็นการส่วนตัว ข้าได้ค้นพบบางสิ่งที่#empน่าสนใจ#!อย่างยิ่ง""
 yearly.1030.confident.desc:0 "การประกาศแจ้งถึงแขกของยาม ทำให้ความง่วงงุนทั้งหมดหายไปจากความคิดของข้า ใครกันมารบกวนข้าในเวลานี้?\n\nแขกยามดึกของข้าไม่ใช่ใครอื่นนอกจาก[hooked.GetTitledFirstName] "ข้าต้องพูดคุยกับท่านเป็นการส่วนตัว ห่างจากหูที่คอยฟัง ข้าได้ค้นพบบางสิ่งที่#empน่าสนใจ#!อย่างยิ่ง""
 yearly.1030.end.desc:0 "\n\n[hooked.GetTitledFirstNameNoTooltip]ได้เปิดเผยความลับของ[secret_character.GetTitledFirstNamePossessive] [hooked.GetSheHe|U]ยินดีที่จะแบ่งปันกับข้าหากข้าปล่อย[hooked.GetHerHim]ไป"
 yearly.1030.a:0 "ข้าสาบาน หลังจากนี้ ท่านจะไม่เป็นหนี้บุญคุณข้าอีกต่อไป"
 yearly.1030.a.tt:1 "[hooked.GetTitledFirstName]จะบอก[secret|E]เกี่ยวกับ[secret_character.GetTitledFirstName]ให้ข้าทราบ"
 yearly.1030.b:0 "ท่านคิดว่าท่านสามารถเรียกร้องได้รึ? บอกข้ามา มิฉะนั้น!"
 yearly.1030.b.tt:1 "ข้าบังคับให้[hooked.GetTitledFirstName]บอก[secret|E]เกี่ยวกับ[secret_character.GetTitledFirstName]ให้ข้าทราบ"
 yearly.1030.c:0 "ข้าอยากให้ท่านอยู่ในกำมือข้ามากกว่า[secret_character.GetHerHim]"
 yearly.1030.a.start.desc:0 "ค้นพบความลับ"
 yearly.1030.a.secret_deviant.desc:0 "เกี่ยวกับความวิปริตของ[secret_character.GetTitledFirstNamePossessive]!"
 yearly.1030.a.secret_homosexual.desc:0 "เกี่ยวกับความใคร่ในเพศ[secret_character.GetWomenMen]ของ[secret_character.GetTitledFirstNamePossessive]!"
 yearly.1030.a.secret_murder_attempt.desc:0 "เกี่ยวกับความพยายามฆ่า[secret_target.GetTitledFirstNameOrMe]ที่ล้มเหลวของ[secret_character.GetTitledFirstNamePossessive]!"
 yearly.1030.a.secret_cannibal.desc:0 "เกี่ยวกับความกระหายเนื้อมนุษย์ของ[secret_character.GetTitledFirstNamePossessive]!"
 yearly.1030.a.secret_lover.desc:0 "เกี่ยวกับความสัมพันธ์ทางเพศอันเป็นความลับระหว่าง[secret_character.GetTitledFirstName]และ[secret_target.GetTitledFirstName]!"
 yearly.1030.a.secret_murder.desc:0 "[secret_character.GetTitledFirstName]คือผู้อยู่เบื้องหลังการตายก่อนวัยอันควรของ[secret_target.GetTitledFirstNamePossessive]!"
 yearly.1030.a.secret_heretic.desc:0 "เกี่ยวกับวิถีนอกรีตของ[secret_character.GetTitledFirstNamePossessive]!"
 yearly.1030.a.secret_incest.desc:0 "เกี่ยวกับความสัมพันธ์ร่วมสายเลือดระหว่าง[secret_character.GetTitledFirstName]และญาติสนิทคนหนึ่งของ[secret_character.GetHerHis]!"
 yearly.1030.a.secret_witch.desc:0 "ว่า[secret_character.GetTitledFirstName]เป็นแม่มด!"

 yearly.1040.t:0 "การมาเยือนที่ไม่คาดคิด"
 yearly.1040.tumble.desc:0 "ข้ามาถึง[suspicious.Custom('GetChamber')]ของ[suspicious.GetFirstNamePossessive]สุดที่รักของข้า โดยไม่มีใครเห็นและได้ยิน ด้วยความปรารถนาในหัวใจ — และในกาย — ข้าค่อยๆ เข้าไป\n\n"
 yearly.1040.dinner.desc:0 "ด้วยใจที่มุ่งหวังค่ำคืนอันผ่อนคลาย ข้ากำลังมุ่งหน้าไปยัง[suspicious.Custom('GetChamber')]ของ[ROOT.Char.Custom2('RelationToMeShort', suspicious)] [suspicious.GetFirstNamePossessive] พร้อมด้วย[ROOT.Char.Custom('RegionalDrink')]และ[ROOT.Char.Custom('RegionalGameObject')] ข้าเข้าไปโดยไม่เคาะประตู\n\n"
 yearly.1040.council_meeting.desc:0 "อีกครั้งที่[suspicious.GetTitledFirstName]มาประชุมสภาสาย ครั้งนี้ ข้าจะไม่ปล่อยผ่าน! เมื่อข้าไปถึง[suspicious.Custom('GetChamber')]ของ[suspicious.GetFirstNamePossessiveNoTooltip] ข้าไม่ให้เกียรติ[suspicious.GetHerHim]ด้วยการประกาศตัว\n\n"
 yearly.1040.vassal_talk.desc:0 "นับตั้งแต่ข้าหลวงของข้า [suspicious.GetTitledFirstName] มาถึงราชสำนัก ตามคำเชิญอันเอื้อเฟื้อของข้า [suspicious.GetSheHe]แทบไม่ได้ออกจาก[suspicious.Custom('GetChamber')]ของ[suspicious.GetHerHis]เลย ข้าต้องการคำอธิบาย!\n\nเมื่อข้าเข้าไป,"
 yearly.1040.end.desc:0 "[suspicious.GetTitledFirstNameNoTooltip]นั่งอยู่ กำลังเขียนอย่างขะมักเขม้น เมื่อข้ากระแอม [suspicious.GetSheHe]สะดุ้งสุดตัว [suspicious.GetSheHe|U]รีบยัดม้วนกระดาษหนังเข้ากระเป๋าของ[suspicious.GetHerHis]และหันมาหาข้าด้วยสีหน้าไม่สบายใจ"
 yearly.1040.a:0 ""ท่านซ่อนอะไรอยู่? ให้ข้าดู เดี๋ยวนี้!""
 yearly.1040.a.tt:0 "ข้าจะค้นพบสิ่งที่[suspicious.GetTitledFirstName]ซ่อนอยู่ ไม่ว่าดีหรือร้าย"
 yearly.1040.b:0 "กลับมาทีหลังแล้วค้น[suspicious.Custom('GetChamber')]ของ[suspicious.GetHerHis]อย่างลับๆ"
 yearly.1040.b.success.desc:0 "ข้าพบแผ่นหนัง"
 yearly.1040.b.failure.desc:0 "ข้าถูกค้นพบโดย[suspicious.GetTitledFirstNameNoTooltip]"
 yearly.1040.c:0 "เคารพความเป็นส่วนตัวของ[suspicious.GetHerHis]"

 yearly.1041.start.desc:0 "[suspicious.GetSheHe]คิดจริงๆ หรือว่าข้าจะไม่เห็นสิ่งนั้น? "ส่งมาให้ข้า! เดี๋ยวนี้!""
 yearly.1041.cross_arm.desc:0 "[suspicious.GetFirstNameNoTooltip] ยื่นม้วนกระดาษที่ยับยู่ยี่ให้ข้าและกอดอกของ [suspicious.GetHerHis]"
 yearly.1041.shivering_hand.desc:0 "ด้วยมือที่สั่นเทา [suspicious.GetFirstNameNoTooltip]ยื่นแผ่นหนังที่ยับยู่ยี่ให้ข้า"
 yearly.1041.middle.desc:0 "\n\n"
 yearly.1041.friend.desc:0 "มีคนตอบรับคำเชิญ แสดงความสุขและความตื่นเต้นที่จะใช้เวลากับ... ข้า! ผู้ที่เขียนสิ่งนี้คือสหายของข้า, [secret_friend.GetTitledFirstName]!\n\n"มันควรจะเป็นเซอร์ไพรส์ การเดินทางที่สนุกสนานและผ่อนคลายสำหรับท่านทั้งสอง... ตอนนี้มันพังหมดแล้ว!""
 yearly.1041.gift.desc:0 "มันคือจดหมาย มีบางอย่างเกี่ยวกับการทำธุรกรรมทางการเงิน และข้อกำหนดสำหรับ[ROOT.Char.Custom('SuitableGiftItem')]ที่สั่งทำพิเศษพร้อมตราประจำตระกูล[ROOT.Char.GetDynastyNameNoTooltip]...\n\n"ข้าต้องการเซอร์ไพรส์ท่าน มอบบางสิ่งเพื่อแสดงความขอบคุณของข้า และตอนนี้มันก็ไร้ค่าไปหมด!""
 yearly.1041.feast.desc:0 "มันคือรายการอาหารและเครื่องดื่ม และชื่อที่คุ้นเคยมากมาย รวมถึงชื่อ[ROOT.Char.Custom('MusicalPerformer')]คนโปรดของข้า...\n\n"มันควรจะเป็นเซอร์ไพรส์ ข้าคิดว่ามันจะเป็นท่าทีที่ดีที่จะจัดงานเลี้ยงเพื่อเป็นเกียรติแก่ท่าน แต่นี่คือวิธีที่ท่านขอบคุณข้า...""
 yearly.1041.hostile_scheme_agent_other.desc:0 "มันคือรายการเวลาและสถานที่ สิ่งที่ได้ยินและเห็น เรื่องส่วนตัว... [suspicious.GetFirstNameNoTooltip]กำลังช่วยใครบางคนวางแผนร้ายต่อ[ROOT.Char.Custom2('RelationToMe', SCOPE.sC('scheme_target'))]ของข้า [scheme_target.GetFirstName]!"
 yearly.1041.hostile_scheme_agent_me.desc:0 "มันคือรายการเวลาและสถานที่ สิ่งที่ได้ยินและเห็น สิ่งที่ข้าพูดและทำ! [suspicious.GetFirstNameNoTooltip]ได้รายงานกิจกรรมของข้า ช่วยใครบางคนวางแผนร้ายต่อข้า!"
 yearly.1041.secret_wicked.desc:0 "แหม แหม แหม ช่างชั่วร้ายน่าพอใจเสียนี่กระไร ตามจดหมายแบล็กเมล์ฉบับนี้ [suspicious.GetFirstNameNoTooltip] [secret.Custom('SecretDescriptionThirdPerson')]!"
 yearly.1041.secret_angry.desc:0 "ข้าอ่านจดหมายผ่านๆ อย่างสยดสยอง มันเป็นข้อกล่าวหาที่น่าเชื่อถือ อ้างว่า[suspicious.GetFirstNameNoTooltip] [secret.Custom('SecretDescriptionThirdPerson')]!"
 
 yearly.1041.a.good:0 "ข้า... ข้าขอโทษ ข้าไม่รู้เลย!"
 yearly.1041.a.bad:0 "หลักฐานเป็นลายลักษณ์อักษร ช่างรอบคอบเสียจริง"
 yearly.1041.friend.tt:0 "หากข้าไม่ทำลายเซอร์ไพรส์ของ[suspicious.GetTitledFirstNamePossessive] ข้าคงลด[stress|E]และเพิ่ม[opinion|E]กับ[secret_friend.GetTitledFirstName]"
 yearly.1041.gift.tt:0 "หากข้าไม่ทำลายเซอร์ไพรส์ของ[suspicious.GetTitledFirstNamePossessive] ข้าคงได้รับ[gold|E]จำนวนหนึ่ง"
 yearly.1041.feast.tt:0 "หากข้าไม่ทำลายเซอร์ไพรส์ของ[suspicious.GetTitledFirstNamePossessive] ข้าคงได้รับ[prestige|E]"

 yearly.1042.start.desc:0 "ขณะที่ข้ารื้อค้นข้าวของของ[suspicious.GetHerHis], [suspicious.GetTitledFirstName]หลับเหมือนทารก ยาระงับประสาทที่ข้าใส่ใน[suspicious.Custom('RegionalDrink')]ของ[suspicious.GetHerHis]ได้ผลจริงๆ! ภายในไม่กี่นาที ข้าก็พบแผ่นหนังที่[suspicious.GetSheHe]ซ่อนไว้จากข้า...\n\n"
 yearly.1042.friend.desc:0 "มีคนตอบรับคำเชิญ แสดงความสุขและความตื่นเต้นที่จะใช้เวลากับ... ข้า! ผู้ที่เขียนสิ่งนี้คือสหายของข้า, [secret_friend.GetTitledFirstName]!\n\nดูเหมือนว่า[suspicious.GetFirstNameNoTooltip]กำลังวางแผนที่จะเซอร์ไพรส์ข้าด้วยการเดินทางร่วมกับ[secret_friend.GetFirstNameNoTooltip]!"
 yearly.1042.gift.desc:0 "มันคือจดหมาย มีบางอย่างเกี่ยวกับการทำธุรกรรมทางการเงิน และข้อกำหนดสำหรับ[ROOT.Char.Custom('SuitableGiftItem')]ที่สั่งทำพิเศษพร้อมตราประจำตระกูล[ROOT.Char.GetDynastyNameNoTooltip]...\n\nดูเหมือนว่า[suspicious.GetFirstNameNoTooltip]กำลังวางแผนที่จะเซอร์ไพรส์ข้าด้วยของขวัญ!"
 yearly.1042.feast.desc:0 "มันคือรายการอาหารและเครื่องดื่ม และชื่อที่คุ้นเคยมากมาย รวมถึงชื่อ[ROOT.Char.Custom('MusicalPerformer')]คนโปรดของข้า...\n\nดูเหมือนว่า[suspicious.GetFirstNameNoTooltip]กำลังวางแผนที่จะเซอร์ไพรส์ข้าด้วยงานเลี้ยงที่จัดขึ้นเพื่อเป็นเกียรติแก่ข้า!"
 yearly.1042.a.good:0 "นี่ไม่ใช่สิ่งที่ข้าคาดหวัง"
 yearly.1042.good.tt:0 "ข้าจะทำเหมือนไม่รู้เรื่องเมื่อ[suspicious.GetTitledFirstName]เปิดเผยเซอร์ไพรส์"

 yearly.1043.t:0 "จับได้คาหนังคาเขา"
 yearly.1043.desc:0 "ข้ารื้อค้นข้าวของของ[suspicious.GetTitledFirstNamePossessive] รู้สึกว่าชีพจรเต้นเร็วขึ้น แผ่นหนังบ้าๆ นั่นอยู่ที่ไหน?\n\n"เอ่อ... [ROOT.Char.GetFirstNameNoTooltip]? ท่านมาทำอะไรที่นี่?!"\n\nข้าหันกลับไปพบ[suspicious.GetFirstNameNoTooltip]ที่งัวเงีย แต่ขุ่นเคืองอย่างเห็นได้ชัด กำลังโซเซออกจากเตียง ดูเหมือนว่ายาระงับประสาทที่ข้าใส่ใน[suspicious.Custom('RegionalDrink')]ยามเย็นของ[suspicious.GetHerHis]ไม่ได้ผลตามที่ตั้งใจไว้..."
 yearly.1043.a:0 "ข้า... กำลังจะไปพอดี"
 yearly.1043.a.tt:0 "ข้าไม่พบว่า[suspicious.GetTitledFirstName]ซ่อนอะไรอยู่"

 yearly.1044.t:0 "ท่าทีแห่งความขอบคุณ"
 yearly.1044.start.desc:0 "รอยยิ้มเจ้าเล่ห์ปรากฏบนริมฝีปากของ[suspicious.GetTitledFirstNamePossessive] "ข้ารู้ว่าข้าทำตัวแปลกๆ ในช่วงหลัง และข้าขออภัยสำหรับเรื่องนั้น แต่ข้ามีเหตุผลที่ดี!"\n\n"
 yearly.1044.friend.desc:0 "[suspicious.GetFirstNameNoTooltip]กวักมือเรียกให้ข้าตามไป และนำข้าออกไปข้างนอก นั่งอยู่บนหลังม้าของ[secret_friend.GetHerHis]และ แต่งกายพร้อมเดินทางคือ[secret_friend.GetTitledFirstName]!\n\n"ข้าได้จัดการเดินทางเล็กๆ น้อยๆ สำหรับท่านทั้งสอง!" [suspicious.GetFirstNameNoTooltip]กล่าวอย่างตื่นเต้น "ข้าคิดว่าท่านคงต้องการใช้เวลาดีๆ ร่วมกัน!""
 yearly.1044.gift.desc:0 "[suspicious.GetFirstNameNoTooltip]ยื่นของขวัญที่ห่ออย่างเรียบร้อย ประดับด้วยริบบิ้นสีสันสดใสให้ข้า "ข้าต้องการเซอร์ไพรส์ท่าน ข้าสั่งทำพิเศษ มีเพียงชิ้นเดียวเท่านั้น เชิญเปิดเลย!""
 yearly.1044.feast.desc:0 "[suspicious.GetFirstNameNoTooltip]กวักมือเรียกให้ข้าตามไป และนำข้าไปยังห้องโถงใหญ่ เมื่อ[suspicious.GetSheHe]ผลักประตูเปิด ใครบางคนก็เริ่มบรรเลงเพลงสนุกสนาน โอ้... การตก แต่ง กลิ่น! และทุกคนอยู่ที่นี่!\n\n"มันคืองานเลี้ยง เพื่อเป็นเกียรติแก่ท่าน! ให้ข้าเอา[ROOT.Char.Custom('RegionalDrink')]ให้ท่านสักถ้วย!""
 yearly.1044.a:0 "ขอบคุณ, [suspicious.GetFirstNameNoTooltip]!"

 yearly.1050.t:0 "นักประลองผู้ยิ่งใหญ่"
 yearly.1050.angry.desc:0 "[angry_vassal.Custom2('MyCharacterIntroduction', ROOT.Char)|U]มาถึงราชสำนักพร้อมแขนที่พันผ้าพันแผลและความกระหายที่จะแก้แค้น [angry_vassal.GetSheHe|U]บอกข้าว่า[ROOT.Char.Custom2('RelationToMe', SCOPE.sC('heir'))]ของข้า, [heir.GetTitledFirstName], ได้ "อาละวาด" ไปทั่ว[title.GetNameNoTierNoTooltip]\n\n"[heir.Custom('GirlBoy')]ของท่านนึกว่า[heir.GetHerselfHimself]เป็นนักประลอง – [heir.GetSheHe]ปรากฏตัวที่หน้าประตูบ้านข้าและท้าทายข้าต่อหน้าทุกคน! ข้าไม่มีทางเลือกนอกจากยอมรับ นี่ไม่ใช่ครั้งแรก เช่นกัน ข้าเป็นเพียงคนสุดท้ายในบรรดาเหยื่อจำนวนมาก!"
 yearly.1050.scared.desc:0 "[angry_vassal.Custom2('MyCharacterIntroduction', ROOT.Char)|U] ได้มาถึงราชสำนักพร้อมกับแขนที่พันผ้าพันแผลและแววตาหวาดกลัวในดวงตาของ[angry_vassal.GetHerHis] [angry_vassal.GetSheHe|U] บอกข้าว่า [heir.GetTitledFirstName] [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('heir'))] ของข้า กำลังท้าทายผู้คนให้ประลองตัวต่อตัวไปทั่ว [title.GetNameNoTierNoTooltip]\n\n"ขอประทานอภัย [ROOT.Char.Custom('FormOfAddressForLiege')] แต่เรื่องนี้ต้องหยุดได้แล้ว [heir.GetTitledFirstNameNoTooltip] ปรากฏตัวที่หน้าประตูบ้านข้าและท้าทายข้า ข้าไม่มีทางเลือกอื่นนอกจากต้องยอมรับ นี่ไม่ใช่ครั้งแรก เช่นกัน ข้าเป็นเพียงเหยื่อรายล่าสุดเท่านั้น!""

 yearly.1050.a:0 "การประลองเหล่านี้จะยุติลง เดี๋ยวนี้"
 yearly.1050.b:0 "งานอดิเรกที่อันตราย ท่านต้องการผู้ฝึกสอน"
 yearly.1050.c.failure.tt:0 "[heir.GetTitledFirstName]จะยังคงท้าทายผู้คนให้ประลองต่อไป"
 yearly.1050.c.success.tt:0 "[heir.GetTitledFirstName]จะไม่ประลองอีกต่อไป"
 yearly.1050.c.success.wounded.tt:0 "[heir.GetTitledFirstName]อาจได้รับบาดเจ็บ"
 yearly.1050.c.failure.wounded.tt:0 "ข้าอาจได้รับบาดเจ็บ"
 yearly.1050.c:0 "ปัดโธ่! [heir.Custom2('RelationToMeShort', ROOT.Char)]ของท่านจะแสดงให้ท่านเห็นว่าต้องทำอย่างไร!"
 yearly.1050.critical_success.desc:0 "ข้าเอาชนะ[heir.GetFirstNameNoTooltip]"
 yearly.1050.failure.desc:0 "ข้าแพ้การประลอง"

 yearly.1051.t:0 "นักประลองกลับมา"
 yearly.1051.victory.desc:0 "เมื่อ[heir.GetTitledFirstName]กลับมาจากการผจญภัยของ[heir.GetHerHis] ข้าราชสำนักทุกคนอยู่ที่นั่นเพื่อดู[heir.GetHerHim] บางคนโห่ร้องและตะโกนแสดงความชื่นชม ในขณะที่คนอื่นๆ... ไม่ค่อยประทับใจนัก\n\nแต่ไม่มีใครปฏิเสธได้ว่า[heir.GetFirstNameNoTooltip]ได้พิสูจน์[heir.GetHerselfHimself]ว่าเป็นนักประลองฝีมือดีหลังจากเอาชนะ[heir.GetLadyLord]แล้ว[heir.GetLadyLord]เล่า"
 yearly.1051.murder.desc:0 "ก่อนที่[heir.GetTitledFirstName]จะอ้าปากพูด ข้าก็บอกได้เลยว่ามันจะต้องแย่ ความตื่นตระหนกในดวงตาของ[heir.GetHerHis]นั้นไม่เหมือน[heir.GetHerHim]เลย\n\n"ได้โปรด, [heir.Custom2('RelationToMeShort', ROOT.Char)], ท่านต้องช่วยข้า ข้าไม่ได้ตั้งใจ... [angry_vassal_2.GetSheHe|U]ไม่ควรจะตาย!""
 yearly.1051.decent.desc:0 "[heir.GetTitledFirstName]กลับมาจากการผจญภัยของ[heir.GetHerHis]เป็น[heir.GetWomanMan]ที่แข็งแกร่งขึ้น ในขณะที่[heir.GetSheHe]แพ้การประลองไปบ้างและ ทำให้ข้าหลวงของข้าโกรธมากขึ้น [heir.GetSheHe]ก็มีชัยชนะพอสมควรและได้รับประสบการณ์อันมีค่า\n\nตอนนี้ อาจถึงเวลาที่จะเอาใจ[angry_vassal_2.GetTitledFirstName] [heir.GetFirstNameNoTooltip]น่าจะอ่อนโยนกับ[angry_vassal_2.GetHerHim]มากกว่านี้..."
 yearly.1051.defeat.desc:0 "[heir.GetTitledFirstName]กลับมาในที่สุดพร้อมกับหางที่ซุกอยู่ระหว่างขาของ[heir.GetHerHis] [heir.Custom('GirlBoy')]ผู้ไม่ยั้งคิดได้เดินทางไปทั่วอาณาจักรและท้าทายข้าหลวงแล้วข้าหลวงเล่า เพียงเพื่อแพ้การประลองทุกครั้ง\n\nหลังจากความพ่ายแพ้อันน่าอับอายด้วยน้ำมือของ[angry_vassal_2.GetTitledFirstName], [heir.GetSheHe]ดูเหมือนจะได้เรียนรู้บทเรียนในที่สุด"
 yearly.1051.great_victory_end.desc:0 "[heir.GetFirstNameNoTooltip]ยังเอาชนะแชมป์เปี้ยนผู้ยิ่งใหญ่[angry_vassal_2.GetTitledFirstName]ได้!"
 yearly.1051.regular_victory_end.desc:0 "ชัยชนะของ[heir.GetHerHis|U]เหนือ[angry_vassal_2.GetTitledFirstName]กล่าวกันว่าน่าประทับใจเป็นพิเศษ"
 yearly.1051.victorious.a:0 "[ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('heir'))|U], เจ้า ทำให้ข้าภูมิใจ"
 yearly.1051.murder.a:0 "เจ้าฆ่า[angry_vassal_2.GetTitledFirstNameNoTooltip]รึ?!"
 yearly.1051.decent.a:0 "เจ้าจะพักผ่อนตอนนี้หรือไม่, [heir.GetFirstNameNoTooltip]?"
 yearly.1051.defeat.a:0 "เจ้า ทำให้ข้าอับอาย"

 yearly.1060.t:0 "มุกตลกสุดคลาสสิก"
 yearly.1060.bed.desc:0 "[joker.Custom2('MyCharacterIntroduction', ROOT.Char)|U]ยันตัวขึ้นบนข้อศอก ริมฝีปากโค้งเป็นรอยยิ้มเจ้าเล่ห์"
 yearly.1060.dance.desc:0 "[joker.Custom2('MyCharacterIntroduction', ROOT.Char)|U]เคลื่อนไหวอย่างสง่างามไปกับเสียงเพลง ดวงตาของ[joker.GetHerHis]เปล่งประกายด้วยความขบขัน ขณะที่การเต้นรำนำเรามาใกล้กัน [joker.GetSheHe]เอนตัวเข้ามาใกล้และกระซิบข้างหูข้า "
 yearly.1060.dinner.desc:0 "[joker.Custom2('MyCharacterIntroduction', ROOT.Char)|U]หมุนแก้ว[joker.Custom('RegionalDrink')]ของ[joker.GetHerHis]และเอนตัวมาหาข้าพร้อมรอยยิ้มเจ้าเล่ห์"
 yearly.1060.garden.desc:0 "ขณะที่เราเดินเล่นในสวน [joker.Custom2('MyCharacterIntroduction', ROOT.Char)]เอนตัวมาหาข้าพร้อมรอยยิ้มเจ้าเล่ห์"
 yearly.1060.ride.desc:0 "[joker.Custom2('MyCharacterIntroduction', ROOT.Char)|U]ดึงบังเหียนม้าของ[joker.GetHerHis]และตบที่คอของมัน เมื่อ[joker.GetSheHe]เงยหน้ามองข้า ข้าเห็นแก้มที่แดงก่ำและแววตาเจ้าเล่ห์ในดวงตาของ[joker.GetHerHis]"
 yearly.1060.joke.desc:0 "\n\n"เอาล่ะ, [ROOT.Char.GetFirstNameNoTooltip]... อะไรเอ่ยห้อยอยู่ที่ต้นขาของผู้ชายและอยากจะแหย่รูที่มันเคยแหย่มาแล้วบ่อยครั้ง?""
 yearly.1060.a.tt:0 "ข้าสงสัยว่า[joker.GetFirstNameNoTooltip]อยากได้ยินอะไร?\n"
 yearly.1060.a:0 "กุญแจ"
 yearly.1060.charmed.message:0 "[joker.GetFirstNameNoTooltip]หลงเสน่ห์"
 yearly.1060.amused.message:0 "[joker.GetFirstNameNoTooltip]รู้สึกขบขัน"
 yearly.1060.disappointed.message:0 "[joker.GetFirstNameNoTooltip]รู้สึกผิดหวัง"
 yearly.1060.b:0 "ดาบ"
 yearly.1060.c.male:0 "ท่านอยากให้ข้าแสดงให้ดูหรือไม่?"
 yearly.1060.c.female:0 "บางทีท่านอาจจะแสดงให้ข้าดูได้หรือไม่?"
 yearly.1060.very_charmed.message:0 "[joker.GetFirstNameNoTooltip]หลงเสน่ห์อย่างมาก"
 yearly.1060.reveal_secret.tt:0 "[joker.GetTitledFirstName]จะรู้ความลับของข้า"
 yearly.1060.sex_and_maybe_lover.tt:0 "[joker.GetFirstNameNoTooltip]และข้าใช้เวลาค่ำคืนร่วมกัน..."
 yearly.1060.sex.tt:0 "[joker.GetFirstNameNoTooltip]และข้ามีความสุขสมกัน"
 yearly.1060.crude.message:0 "[joker.GetFirstNameNoTooltip]คิดว่าข้าหยาบคาย"
 yearly.1060.d:0 "ข้าไม่รู้ว่าท่านกำลังพูดถึงอะไร..."
 yearly.1060.e:0 "ช่างหยาบคายเสียนี่กระไร!"

 yearly.1070.t:0 "ดึงดูดสู่เปลวไฟ"
 yearly.1070.start.desc:0 "มีบางอย่างแปลกประหลาดเกี่ยวกับ[potential_soulmate.Custom2('MyCharacterIntroductionNoComma', ROOT.Char)] เป็นวิธีที่[potential_soulmate.GetSheHe]ยิ้มหรือ? เสียงหัวเราะที่ชัดเจน"
 yearly.1070.peal.desc:0 "ดังกังวาน"
 yearly.1070.rumble.desc:0 "ทุ้มนุ่ม"
 yearly.1070.middle.desc:0 "ของ[potential_soulmate.GetHerHis], หรือบางทีอาจเป็น"
 yearly.1070.benevolent.desc:0 "วิธีที่[potential_soulmate.GetSheHe]ปฏิบัติต่อทุกคนอย่างเมตตา ทั้งชนชั้นสูงและสามัญชน?"
 yearly.1070.dominant.desc:0 "เจตจำนงอันแน่วแน่ดุจเหล็กกล้าของ[potential_soulmate.GetHerHis]?"
 yearly.1070.submissive.desc:0 "ท่าทีอันอ่อนโยนของ[potential_soulmate.GetHerHis]?"
 yearly.1070.extroverted.desc:0 "วิธีที่[potential_soulmate.GetSheHe] ทำให้ทุกการสนทนาดูง่ายดายและน่าพอใจ?"
 yearly.1070.introverted.desc:0 "วิธีที่ดวงตาของ[potential_soulmate.GetHerHis]แสดงออกมากมาย แม้ไม่มีคำพูดใดๆ ผ่านริมฝีปาก?"
 yearly.1070.emotional.desc:0 "ธรรมชาติทางอารมณ์ที่มิอาจควบคุมได้?"
 yearly.1070.levelheaded.desc:0 "ความสุขุมเยือกเย็นอันสูงส่งและไม่สั่นคลอนของ[potential_soulmate.GetHerHis]?"
 yearly.1070.intelligent.desc:0 "ปัญญาอันเฉียบแหลมที่น่าประทับใจของ[potential_soulmate.GetHerHis]?"
 yearly.1070.fair.desc:0 "ลักษณะที่งดงามโดดเด่นของ[potential_soulmate.GetHerHis]?"
 yearly.1070.handsome.desc:0 "ลักษณะที่หล่อเหลาสง่างามของ[potential_soulmate.GetHerHis]?"
 yearly.1070.zealous.desc:0 "ความศรัทธาอันไม่สั่นคลอนต่อ[ROOT.Char.GetFaith.HighGodName]ของ[potential_soulmate.GetHerHis]?"
 yearly.1070.fallback.desc:0 "ดวงตาอันงดงามของ[potential_soulmate.GetHerHis]?"
 yearly.1070.end.desc:0 "\n\nข้าไม่สามารถระบุได้อย่างชัดเจน แต่มีสิ่งหนึ่งที่ข้ารู้แน่นอน: เมื่อข้าอยู่ต่อหน้า[potential_soulmate.GetHerHis] ข้าพบว่าเป็นการยากที่จะจดจ่อกับสิ่งอื่นใด"
 yearly.1070.a:0 "ข้าจะแสดงความรักอันไม่เสื่อมคลายต่อ[potential_soulmate.GetHerHim]!"
 yearly.1070.b:0 "ความปรารถนานี้ไม่ได้มาจากใจ..."
 yearly.1070.c:0 "ข้าจะเขียนบทกวีเล็กๆ ให้[potential_soulmate.GetHerHim]"
 yearly.1070.d:0 "ข้าปฏิเสธที่จะถูก[potential_soulmate.GetWomanMan]ใดๆ ทำให้ไขว้เขว!"
 yearly.1070.scheme.tt:0 "[scheme|E]จะได้รับโบนัส[success_chance|E]"

 ### YOU ARE BEING PARANOID ###
 yearly.1080.t:0 "ความสงสัยที่คืบคลาน"
 yearly.1080.normal.desc:0 "มีบางอย่างแปลกๆ เกี่ยวกับ[suspicious.Custom2('MyCharacterIntroductionNoComma', ROOT.Char)], แต่ข้าไม่สามารถระบุได้อย่างชัดเจน บางทีอาจเป็นเพียงจินตนาการของข้าที่เตลิดเปิดเปิง — อย่างไรก็ตาม ความรู้สึกเป็นลางร้ายนั้น ทำให้ข้านอนไม่หลับ"
 yearly.1080.paranoid.desc:0 "[suspicious.GetTitledFirstName] [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('suspicious'))] ผู้ [suspicious.Custom2('InsultAdjective', ROOT.Char)] ของข้ากำลังมีแผนการบางอย่าง ข้ารู้! มิฉะนั้นเหตุใด [suspicious.GetSheHe] จึงต้องเดินลับๆ ล่อๆ เช่นนั้น แถมยังมองข้าด้วยสายตาแปลกๆ? อีกทั้งข้าวของของข้าก็ไม่อยู่ในที่ที่ข้าทิ้งไว้! [suspicious.GetSheHe] เข้ามาใน [ROOT.Char.Custom('GetChamber')] ของข้าหรือ?!\n\n[suspicious.GetSheHe|U] ยิ้มอย่างหวานชื่น แต่ข้ารู้ว่ามีสิ่งใดซ่อนอยู่ภายใต้รอยยิ้มนั้น!"
 yearly.1080.a.friend:0 "สหายที่ไว้ใจได้ของข้า [investigator.GetFirstNameNoTooltip] ต้องสืบสวน"
 yearly.1080.a.spymaster:0 "หัวหน้าสายลับ [investigator.GetFirstNameNoTooltip] ต้องสืบสวน"
 yearly.1080.a.success:0 "การสืบสวนของ[investigator.GetTitledFirstNamePossessiveNoTooltip]สำเร็จ"
 yearly.1080.a.success.tt:0 "หาก[suspicious.GetShortUIName]ซ่อนอะไรอยู่ มันจะถูกเปิดเผย"
 yearly.1080.a.failure:0 "การสืบสวนของ[investigator.GetTitledFirstNamePossessiveNoTooltip]ล้มเหลว"
 yearly.1080.b:0 "ข้าจะตรวจสอบเรื่องนี้ทันที"
 yearly.1080.b.success:0 "การสืบสวนของท่านสำเร็จ"
 yearly.1080.b.failure:0 "การสืบสวนของท่านล้มเหลว"
 yearly.1080.c:0 ""เกิดอะไรขึ้นที่นี่, [suspicious.GetFirstNameNoTooltip]? บอกความจริงข้ามา!""
 yearly.1080.c.success:0 "[suspicious.GetFirstNameNoTooltip]บอกความจริง"
 yearly.1080.c.failure:0 "[suspicious.GetFirstNameNoTooltip]ปฏิเสธทุกอย่าง"
 yearly.1080.d:0 "ข้ากำลังหวาดระแวงไปเอง..."
 yearly.1080.c.lunatic:0 "[suspicious.GetFirstNameNoTooltip]ปลอบประโลมความกลัวของท่าน"

 # Paranoid investigation: discovery
 yearly.1081.investigator_start.desc:0 "[investigator.GetTitledFirstName]ได้ค้นพบหลักฐานที่ไม่อาจปฏิเสธได้ถึงความผิดของ[suspicious.GetTitledFirstNamePossessive]"
 yearly.1081.you_start.desc:0 "ระหว่างการสืบสวนของข้า ข้าได้ค้นพบหลักฐานที่ไม่อาจปฏิเสธได้ถึงความผิดของ[suspicious.GetTitledFirstNamePossessive]"
 yearly.1081.murder.desc:0 "[suspicious.GetSheHe|U]ได้วางแผนที่จะฆ่า"
 yearly.1081.abduct.desc:0 "[suspicious.GetSheHe|U]ได้วางแผนที่จะลักพาตัว"
 yearly.1081.seduce.desc:0 "[suspicious.GetSheHe|U]ได้วางแผนที่จะยั่วยวน"
 yearly.1081.elope.desc:0 "[suspicious.GetSheHe|U]ได้วางแผนที่จะหนีตามไปกับ"
 yearly.1081.scheme_type_fallback.desc:0 "[suspicious.GetSheHe|U]ได้วางแผนร้ายต่อ"
 yearly.1081.me.desc:0 "ข้า!"
 yearly.1081.my_introduction.desc:0 "[target.Custom2('MyCharacterIntroductionNoComma', ROOT.Char)]!"

 yearly.1081.agent_murder.desc:0 "[suspicious.GetSheHe|U]กำลังทำงานให้ใครบางคนที่วางแผนจะฆ่า"
 yearly.1081.agent_abduct.desc:0 "[suspicious.GetSheHe|U]กำลังทำงานให้ใครบางคนที่วางแผนจะลักพาตัว"
 yearly.1081.agent_seduce.desc:0 "[suspicious.GetSheHe|U]กำลังทำงานให้ใครบางคนที่วางแผนจะยั่วยวน"
 yearly.1081.agent_elope.desc:0 "[suspicious.GetSheHe|U]กำลังทำงานให้ใครบางคนที่วางแผนจะหนีตามไปกับ"
 yearly.1081.agent_scheme_type_fallback.desc:0 "[suspicious.GetSheHe|U]กำลังทำงานให้ใครบางคนที่วางแผนร้ายต่อ"

 yearly.1081.traitor_end.desc:0 "\n\nคนทรยศ [suspicious.Custom2('InsultAdjective', ROOT.Char)] นั่นจะได้รับสิ่งที่ [suspicious.GetSheHe] สมควรได้รับ!"
 yearly.1081.useful_end.desc:0 "\n\nเจ้า [suspicious.Custom2('InsultNoun', ROOT.Char)] เจ้าเล่ห์! ข้อมูลนี้จะเป็นประโยชน์อย่างแน่นอน"
 yearly.1081.secret.desc:0 "[suspicious.GetSheHe|U] [guilty_owned_secret.Custom('SecretDescriptionThirdPerson')]!"
 yearly.1081.a:0 "ข้ารู้อยู่แล้ว!"

 # Paranoid investigation: innocent
 yearly.1082.investigator_start.desc: "[investigator.GetTitledFirstName] ได้สรุปการสืบสวนของ[investigator.GetHerHis]เกี่ยวกับกิจกรรมของ [suspicious.GetTitledFirstNamePossessive] ด้วยมือเปล่า [investigator.GetSheHe|U] ไม่พบหลักฐานการกระทำผิดทางอาญาหรือการกระทำอันมืดมนอื่นๆ — แม้ แต่ข่าวลือที่น่าสงสัยก็ไม่มี"
 yearly.1082.you_start.desc:0 "ข้าได้ซ่อนตัวอยู่ในเงามืด ไปยังโรงเตี๊ยมที่น่าสงสัย และพลิกทุกก้อนหิน — แต่ข้าก็ไม่พบหลักฐานที่ปรักปรำ[suspicious.GetTitledFirstName]เลย แม้ แต่ข่าวลือที่น่าสงสัยก็ไม่มี!"
 yearly.1082.normal.desc:0 "\n\nแม้ดูเหมือนว่าข้าจะเข้าใจผิดในครั้งนี้ แต่มันก็ไม่ใช่เวลาที่เสียเปล่า คืนนี้ ข้าจะหลับเหมือนทารก"
 yearly.1082.paranoid.desc:0 "\n\n[suspicious.GetFirstNameNoTooltip]อาจจะบริสุทธิ์ในครั้งนี้ แต่ก็ยังมีบางอย่างเกี่ยวกับ[suspicious.GetHerHim]ที่ ทำให้ข้ารู้สึกไม่สบายใจ ข้าจะจับตาดู[suspicious.GetHerHim]ต่อไป นั่นแน่นอน"
 yearly.1082.a:0 "กันไว้ดีกว่าแก้!"
 yearly.1082.a.tt:0 "[suspicious.GetShortUIName|U]ดูเหมือนบริสุทธิ์"

 # Paranoid investigation: failure
 yearly.1083.investigator_start.desc:0 "[investigator.GetTitledFirstName]กลับมาหาข้ามือเปล่า "ข้าไม่พบหลักฐานที่ปรักปรำ[suspicious.GetTitledFirstName], และบางที[suspicious.GetSheHe]อาจจะบริสุทธิ์จริงๆ แต่ข้าไม่สามารถรับประกันได้ — [suspicious.GetSheHe]เป็น[suspicious.GetWomanMan]ที่ระมัดระวังตัว [investigator.GetFaith.HighGodName|U]ทรงทราบว่า[suspicious.GetSheHe]อาจซ่อนอะไรอยู่""
 yearly.1083.you_start.desc:0 "การสืบสวน[suspicious.GetTitledFirstName]ของข้าไม่พบสิ่งใดน่าสังเกต ยกเว้นว่า[suspicious.GetSheHe]ดูเหมือนจะเป็น[suspicious.GetWomanMan]ที่ระมัดระวังตัวเป็นพิเศษ [ROOT.Char.GetFaith.HighGodName|U]ทรงทราบว่า[suspicious.GetSheHe]อาจซ่อนอะไรอยู่"
 yearly.1083.a:0 "ข้าจะจับตาดู[suspicious.GetHerHim]ต่อไป นั่นแน่นอน"
 yearly.1083.a.tt:0 "การสืบสวน[suspicious.GetShortUIName]ล้มเหลว"

 # Paranoid confrontation: confession
 yearly.1084.start.desc:0 "ยามรักษาระยะห่างที่เหมาะสมจาก[suspicious.GetTitledFirstName], แต่พวกเขาพร้อมที่จะจับกุม[suspicious.GetHerHim]ได้ทุกเมื่อ [suspicious.GetSheHe|U]ดูเหมือนจะรู้ตัวดี สายตาของ[suspicious.GetHerHis]กวาดไปรอบๆ [ROOT.Char.Custom('GetRoom')]อย่างประหม่า กำลังมองหาทางหนีอยู่หรือ?\n\nข้าไม่ต้องพยายามมากนัก เพื่อให้ได้คำสารภาพ"
 yearly.1084.a:0 "โยน[suspicious.GetHerHim]เข้า[ROOT.Char.Custom('GetDungeon')]!"
 yearly.1084.b:0 "ไปให้พ้นสายตาข้า เจ้า [suspicious.Custom2('InsultNoun', ROOT.Char)] ทรยศ!"

 # Paranoid confrontation: denial
 yearly.1085.start.desc:1 "ยามรักษาระยะห่างที่เหมาะสมจาก[suspicious.GetTitledFirstName], แต่พวกเขาพร้อมที่จะจับกุม[suspicious.GetHerHim]ได้ทุกเมื่อ [suspicious.GetSheHe|U]ดูเหมือนจะรู้ตัวดี มีความตึงเครียดผิดปกติที่ไหล่ของ[suspicious.GetHerHis]\n\n"เหตุใดท่านจึงเรียกข้ามา, [ROOT.Char.Custom2('RelationToMeAddress', suspicious)]? ท่านมีอะไรจะถามข้ารึ?"\n\nคำกล่าวหาหลุดออกจากปากข้าเหมือนยาพิษ แต่เมื่อข้าเห็นสีหน้าของ[suspicious.GetFirstNamePossessiveNoTooltip] ความสงสัยก็เข้าครอบงำข้า นั่นไม่ใช่ความรู้สึกผิด,"
 yearly.1085.angry.desc:0 "แต่เป็นความโกรธ\n\n"ท่านกล้าดีอย่างไรมากล่าวหาข้า เช่นนี้? หลังจากทุกสิ่งที่ข้า ทำให้ท่าน!""
 yearly.1085.sad.desc:0 "แต่เป็นความเศร้าโศก\n\n"ข้าเป็นผู้รับใช้ที่ซื่อสัตย์ของท่านเสมอมา," [suspicious.GetSheHe]ร้องไห้ "ข้าไม่มีวันทรยศท่าน!""
 yearly.1085.a:0 "ท่านไปได้"
 yearly.1085.b:0 "ข้าเข้าใจผิด ท่านโปรดรับคำขอโทษอย่างจริงใจจากข้า, [suspicious.GetFirstNameNoTooltip]"
 yearly.1085.c:0 "#EMP โกหก!#! ยาม, โยน[suspicious.GetHerHim]เข้า[ROOT.Char.Custom('GetDungeon')]!"

 # Paranoid confrontation: soothe
 yearly.1086.desc:0 "ข้ามีแผน มีคำพูดที่เตรียมไว้อย่างดี แต่เมื่อข้าเห็น[suspicious.GetTitledFirstName] เลือดข้าก็เดือดพล่าน และคำกล่าวหาก็หลุดออกจากปากข้าเหมือนยาพิษ น่าประหลาดใจที่[suspicious.GetFirstNameNoTooltip]ไม่ได้ตอบสนองด้วยความโกรธหรือน้ำตา\n\n"โอ้, [suspicious.Custom2('RelationToMeShort', ROOT.Char)]ผู้[ROOT.Char.Custom('ComplimentAdjective')]ของข้า ข้ารู้ว่าท่านกำลังทุกข์ทรมาน คำพูดที่รุนแรงเหล่านี้ไม่ใช่ของท่านเอง ข้าจะตอบคำถามทั้งหมดของท่าน แล้วท่านจะเห็นว่าท่านไม่มีอะไรต้องกลัวจากข้า""
 yearly.1086.a:0 "ข้า... ข้าไม่รู้จะพูดอะไร"

 yearly.1090.t:0 "ห่างไกลจากบ้าน"
 yearly.1090.start.desc:0 "คนแปลกหน้าถูกนำตัวมาต่อหน้าข้า "[traveler.GetSheHe|U]รออยู่หน้าประตู[ROOT.Char.Custom('ResidenceBuilding')]มาหนึ่งสัปดาห์แล้ว นายท่าน/นายหญิงของข้า" ยามของข้าแจ้ง\n\n[traveler.GetWomanMan]ผู้นั้นโค้งคำนับอย่างลึกซึ้ง "นามของข้าคือ[traveler.GetFirstName], ฝ่าบาท ข้าเดินทางมาไกลและเห็นสิ่งต่างๆ มากมาย แต่"
 yearly.1090.family_member.desc:0 "[traveler.Custom2('RelationToMeShort', SCOPE.sC('traveler_family_1'))]ของข้า [traveler_family_1.GetFistName]และข้าเหนื่อยล้าจากการเดินทาง"
 yearly.1090.family.desc:0 "ครอบครัวของข้าและข้าเหนื่อยล้าจากการเดินทาง"
 yearly.1090.alone.desc:0 "ข้าเหนื่อยล้าจากการเดินทาง"
 yearly.1090.family_stay.desc:0 "หากท่านอนุญาตให้เราอยู่ ข้าจะยินดีแบ่งปันความรู้เกี่ยวกับโลกให้ท่าน และเป็นผู้รับใช้ที่ภักดีของท่าน""
 yearly.1090.alone_stay.desc:0 "หากท่านอนุญาตให้ข้าอยู่ ข้าจะยินดีแบ่งปันความรู้เกี่ยวกับโลกให้ท่าน และเป็นผู้รับใช้ที่ภักดีของท่าน""
 yearly.1090.a:0 "จงยอมรับ[ROOT.Char.GetFaith.HighGodName], และที่นี่จะเป็นบ้านของเจ้า"
 yearly.1090.b:0 "ยิ่งมากยิ่งดี!"
 yearly.1090.c:0 "เราไม่มีที่ว่างสำหรับคน เช่นเจ้า"
 yearly.1090.travelers_family:0 "[traveler.GetShortUIName|U]และครอบครัวของ[traveler.GetHerHis]"
 yearly_1090_add_courtier_effect.tt:0 "กลายเป็น[courtier|E]ของท่าน"
