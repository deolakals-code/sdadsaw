l_english: 
 yearly_persian.1002.t:0 "เนาว์รูซ"
 yearly_persian.1002.desc:1 "แม้ว่าราชสำนักของข้าจะเฉลิมฉลองเทศกาลเนาว์รูซของชาว [iranian.GetName] ทุกปี แต่ภาระหน้าที่ของข้าในฐานะ [ROOT.Char.GetTitleAsNameNoTooltip] มัก ทำให้เป็นการยากที่ข้าจะเข้าร่วมในงานเฉลิมฉลองได้\n\nเมื่อวันวิษุวัตใกล้เข้ามาและอาณาจักรของข้าอยู่ในสภาวะที่รุ่งเรืองและมั่นคง ข้าสงสัยว่าปีนี้ข้าควรจะสละเวลาเพิ่มเติมหรือไม่ เพื่อออกจาก [ROOT.Char.Custom('ResidenceBuilding')] และเข้าร่วมในบรรยากาศแห่งวันหยุด?"
 yearly_persian.1002.a:0 "ข้าจะถวายเกียรติแด่จัมชีดด้วยของขวัญอันล้ำค่าเป็นอัญมณีและทองคำ!"
 yearly_persian.1002.b:0 "นี่เป็นโอกาสอันน่ายินดี ควรใช้เวลาไปกับการเยี่ยมเยียนผู้อื่น!"
 yearly_persian.1002.c:0 "มุ่งเน้นไปที่พิธีกรรมฮัฟต์ซีนตามประเพณีกับครอบครัวของข้า"
 yearly_persian.1002.d:0 "ข้าพักผ่อนไม่ได้ มีงานต้องทำมากเกินไป!"
 yearly_persian.1002.every_iranian_character:2 "ข้าหลวงและข้าราชสำนักชาว [iranian.GetName] ทุกคนที่มี [heritage|E]"
 yearly_persian.1002.every_friend_and_neighboring_ruler:0 "[friend|E] และ [ruler|E] เพื่อนบ้านทุกคน"
 yearly_persian.1002.every_spouse_and_close_family_member:0 "[spouse|E] และ [close_family_member|E] ทุกคน"
 yearly_persian.1101.t:0 "ชุอูบียะฮ์"
 yearly_persian.1101.desc.arabic:0 "พร้อมกับการเผยแผ่ของศาสนาอิสลาม วัฒนธรรมอาหรับก็ได้แพร่กระจายออกจากคาบสมุทรอาหรับ เช่นกัน"
 yearly_persian.1101.desc.seljuk:0 "นับตั้งแต่การพิชิตอันยิ่งใหญ่ของเซลจุค ประวัติศาสตร์และวัฒนธรรมของเราได้แพร่กระจายไปในหมู่ไพร่ฟ้าข้าแผ่นดินใหม่ของเรา"
 yearly_persian.1101.desc.ending:0 "\n\nหลายชนเผ่าและวัฒนธรรมได้รับเอาภาษาและประเพณี [ROOT.Char.GetCulture.GetName] ของเราไปใช้ แต่ชาวเปอร์เซียที่อาศัยอยู่ในที่ราบสูงอิหร่านได้ต่อต้านการแพร่กระจายนี้อย่างแข็งขัน\n\nโดยสืบทอดประเพณีทางวัฒนธรรมของตนเองจากมรดกของจักรวรรดิอะคีเมนิดและซาเซเนียนอันยิ่งใหญ่ พวกเขาภาคภูมิใจในบรรพบุรุษของตนอย่างยิ่งและต้องการรักษาประวัติศาสตร์ของตนไว้ แม้จะต้องเผชิญกับการปกครองจากต่างชาติก็ตาม"
 yearly_persian.1101.every_county:0 "ทุกเคาน์ตีของชาว [persian.GetName]"
 yearly_persian.1101.every_family:0 "[close_family_member|E] ทุกคน"
 yearly_persian.1101.a:0 "ข้าจะบังคับให้พวกมันทั้งหมดยอมจำนนต่อความเป็นใหญ่แห่ง [ROOT.Char.GetCulture.GetNameNoTooltip]!"
 yearly_persian.1101.b.seljuk:0 "หากข้ารับเอาขนบธรรมเนียม #EMP ของพวกเขา#! มาใช้ ข้าอาจก่อตั้งจักรวรรดิเปอร์เซียที่สามได้!"
 yearly_persian.1101.c:0 "เราได้รับพรที่มีไพร่ฟ้าข้าแผ่นดินที่มีภูมิหลังหลากหลาย เช่นนี้!"
 yearly_persian.1101.c.warning:0 "$stewardship_domain.1073.c.warning$"
