l_english: 
 bp1_yearly.6000.t:0 "เพื่อบาปของ[my_rival.GetMotherFather|U]"
 bp1_yearly.6000.desc:0 "เสียงกรีดร้องอันดังแทรกผ่านความวุ่นวายภายนอก [ROOT.Char.Custom('ResidenceBuilding')] ของข้า\n\n"เจ้า [ROOT.Char.Custom2('InsultNoun', SCOPE.sC('rivals_child'))] ที่น่าชัง! ข้าคือ [rivals_child.Custom('GetDaughterSon')] ของ [my_rival.GetTitledFirstName] และถึงเวลาแล้วที่เจ้าจะต้องชดใช้ต่อการกระทำอันชั่วช้าของเจ้า\nเผชิญหน้ากับข้า, มิฉะนั้นโลกทั้งใบจะได้รู้ว่าเจ้าไม่เต็มใจที่จะปกป้องเกียรติของตนเอง!"\n\nเมื่อข้าหันกลับไป ข้าก็ประสพกับดวงตาอันลุกโชนของ [rivals_child.GetWomanMan] ผู้ถูกครอบงำด้วยความปรารถนาที่จะปกป้องเกียรติของ [my_rival.GetMotherFather] ของ [rivals_child.GetHerHis]\n\nยามของข้ายังอยู่ใกล้ๆ - หากข้าต้องการ ข้าสามารถสั่งให้โยนเจ้าหัวร้อนผู้นี้ออกไป, ให้อับอายและไร้ ซึ่งหนทางสู้"
 bp1_yearly.6000.a:0 "ความขัดแย้งของข้าอยู่กับ[my_rival.GetMotherFather]ของเจ้า ไม่ใช่กับเจ้า"
 bp1_yearly.6000.b:0 "ข้ารับคำท้า!"
 bp1_yearly.6000.c:0 "ทหารยาม! เอา#EMP เด็ก#! คนนี้ออกไปจากที่นี่"
 bp1_yearly.6000.a.tt:0 "พยายามโน้มน้าวให้[rivals_child.GetFirstNameNoTooltip]จากไป"
 bp1_yearly.6000.a.success:0 "ท่านโน้มน้าวให้[rivals_child.GetFirstName]ถอยกลับไปได้สำเร็จ"
 bp1_yearly.6000.a.failure:0 "[rivals_child.GetFirstName]พบว่าท่าทีดูแคลนของท่านนั้นน่าอัปยศ"
 bp1_yearly.6000.b.tt:0 "#V ประลอง#! กับ[rivals_child.GetFirstNameNoTooltip]เพื่อสอนให้[rivals_child.GetHerHim]รู้จักที่ทางของ[rivals_child.GetHerHis]!\n#weak การประลองนี้อาจนำไปสู่ความตายได้#!\nหากท่านชนะ ท่านจะได้รับ[prestige_i][prestige|E]\n\n[prowess|E]ของท่าน: [prowess_i]#V [SCOPE.GetRootScope.GetCharacter.GetProwess]#!\n[prowess|E]ของ[rivals_child.GetFirstNamePossessive]: [prowess_i]#V [rivals_child.GetProwess]#!"
 bp1_yearly.6001.victory_toast:0 "[rivals_child.GetFirstName]พ่ายแพ้และถูกส่งตัวกลับไปตามทางของ[rivals_child.GetHerHis]"
 bp1_yearly.6002.trigger_failure:0 "การประลองของข้ากับ[rivals_child.GetFirstNameNoTooltip]ได้กลายเป็นโมฆะ"
 defused_feud_escalation_opinion:0 "คลี่คลายความบาดหมางที่บานปลาย"
 bp1_yearly.6003.t:0 "บางสิ่งที่หุนหันพลันแล่น"
 bp1_yearly.6003.desc:0 ""ข้าทำเพียงสิ่งที่ต้องทำเพื่อปกป้องเกียรติของท่าน!"\n\n[rivals_child.GetFirstNameNoTooltip] กำลังแสดงความรู้สึกผสมผสานที่แปลกประหลาดระหว่างความละอายและความภาคภูมิใจขณะที่ [rivals_child.GetSheHe] อธิบายสิ่งที่เกิดขึ้นกับข้า ดูเหมือนว่าด้วยความกระตือรือร้นที่จะปกป้องชื่อเสียงของตระกูล [rivals_child.GetHerHis] [rivals_child.GetSheHe] ได้ซุ่มโจมตีศัตรูของข้า [attacked_rival.GetTitledFirstName] ที่บ้านของ [attacked_rival.GetHerHis]\n\n[rivals_child.GetFirstNameNoTooltip] ถูก ทำให้ขายหน้าอย่างรวดเร็วโดย [attacked_rival.GetFirstNameNoTooltip] และตอนนี้ถูกส่งตัวกลับบ้านมาหาข้าแล้ว"
 bp1_yearly.6003.a:0 "เจ้าทำได้ดีมาก [rivals_child.Custom('GetDaughterSon')]!"
 not_controlling_child_tooltip:0 "ท่านจะสูญเสียเกียรติภูมิที่ไม่สามารถควบคุม[rivals_child.Custom('GetDaughterSon')]ของท่านได้"
 bp1_yearly.6003.b:0 "เจ้าทำ เช่นนี้ได้อย่างไร? เราต้องชดเชยให้[attacked_rival.GetTitledFirstNameNoTooltip]"
 child_let_down_tooltip:0 "[rivals_child.GetFirstNameNoTooltip]จะผิดหวังที่ท่านไม่สนับสนุน"
 bp1_yearly.6004.t:1 "สังหาร[rivals_child.Custom('GetDaughterSon')|U]"
 bp1_yearly.6004.desc:0 "ขณะที่ข้ามองลงไปยังร่างของ[rivals_child.GetFirstName] ข้าตระหนักมากขึ้นเรื่อยๆ ว่าการประลองครั้งนี้จะมีผลตามมา ข้าได้สังหาร[rivals_child.Custom('GetDaughterSon')]ของ[my_rival.GetWomanMan]ที่ข้าถือว่าเป็นศัตรู และในไม่ช้าโลกก็จะรู้ถึงสิ่งที่ข้าได้ทำลงไป"
 bp1_yearly.6004.a:1 "ข้าต้องแสดงความเสียใจต่อ[my_rival.GetTitledFirstNameNoTooltip]"
 bp1_yearly.6004.b:1 "[my_rival.GetFirstNameNoTooltip]เพียงแค่เก็บเกี่ยวสิ่งที่[my_rival.GetSheHe]ได้หว่านไว้!"
 killed_my_child:0 "ผู้สังหารบุตรของข้า"
 bp1_yearly.6005.t:0 "การกลับบ้านอย่างมีชัย?"
 bp1_yearly.6005.desc:0 ""ข้าทำในสิ่งที่ต้องทำเพื่อปกป้องเกียรติของท่าน!"\n\n[rivals_child.GetFirstNameNoTooltip] กำลังแสดงความรู้สึกผสมผสานที่แปลกประหลาดระหว่างความภาคภูมิใจอย่างแรงกล้าและความหวั่นเกรงเล็กน้อยขณะที่ [rivals_child.GetSheHe] อธิบายสิ่งที่เกิดขึ้นกับข้า ดูเหมือนว่าด้วยความกระตือรือร้นที่จะปกป้องชื่อเสียงของตระกูล [rivals_child.GetHerHis] [rivals_child.GetSheHe] ได้ซุ่มโจมตีศัตรูของข้า [attacked_rival.GetTitledFirstName] ที่บ้านของ [attacked_rival.GetHerHis]\n\n[rivals_child.GetFirstNameNoTooltip] สามารถเอาชนะ [attacked_rival.GetFirstNameNoTooltip] ได้ เอาชนะ [attacked_rival.GetHerHim] ในการต่อสู้ตัวต่อตัว"
 bp1_yearly.6005.a:0 "บทเรียนอันล้ำค่าสำหรับ[attacked_rival.GetFirstNameNoTooltip]"
 rewarding_success_in_child_tooltip:0 "[rivals_child.GetFirstName]จะได้รับรางวัล"
 bp1_yearly.6005.b:0 "นี่มันผิดไปหมด! เราต้องชดเชยให้[attacked_rival.GetTitledFirstNameNoTooltip]"
 bp1_yearly.6005.outcome_toast:0 "[rivals_child.GetFirstName]ได้รับชัยชนะและชื่อเสียงอันดีงามของเราถูก ทำให้อัปยศ"
 bp1_yearly.6006.t:0 "วีรบุรุษกลับมา?"
 bp1_yearly.6006.desc:0 ""ข้าทำในสิ่งที่ต้องทำเพื่อปกป้องเกียรติของท่าน!"\n\n[rivals_child.GetFirstNameNoTooltip] กำลังแสดงความรู้สึกผสมผสานที่แปลกประหลาดระหว่างความภาคภูมิใจอย่างแรงกล้าและความหวั่นเกรงเล็กน้อยขณะที่ [rivals_child.GetSheHe] อธิบายสิ่งที่เกิดขึ้นกับข้า ดูเหมือนว่าด้วยความกระตือรือร้นที่จะปกป้องชื่อเสียงของตระกูล [rivals_child.GetHerHis] [rivals_child.GetSheHe] ได้ซุ่มโจมตีศัตรูของข้า [attacked_rival.GetTitledFirstName] ที่บ้านของ [attacked_rival.GetHerHis]\n\n[rivals_child.GetFirstNameNoTooltip] สามารถเอาชนะ [attacked_rival.GetFirstNameNoTooltip] ได้ สังหาร [attacked_rival.GetHerHim] ในการต่อสู้ตัวต่อตัว"
 bp1_yearly.6006.a:0 "เจ้า ทำให้ข้าภูมิใจ [rivals_child.Custom('GetDaughterSon')]"
 bp1_yearly.6006.outcome_toast:0 "[rivals_child.GetFirstName]เอาชนะและสังหาร[my_rival.GetFirstName]"
 murdered_my_vassal_crime:0 "การฆาตกรรม"
 bp1_yearly.6006.b:0 "เจ้าทำ เช่นนี้ได้อย่างไร? เราต้องชดเชยให้[rivals_beneficiary.GetTitledFirstNameNoTooltip]"
 bp1_yearly.6006.c:0 "การบริจาคเพื่อการกุศลจะช่วยลบล้างการกระทำอันชั่วร้ายนี้"
 bp1_yearly.6006.c.tt:0 "[rivals_child.GetFirstNameNoTooltip]จะผิดหวังที่ท่านไม่สนับสนุน"
 defended_family_honor_opinion:0 "ปกป้องเกียรติยศของตระกูล"
 attacked_by_rivals_child:0 "ตระกูลที่เป็นอริกัน"
 bp1_yearly.6010.t:0 "การสูญเสีย[rivals_child.Custom('GetDaughterSon')]"
 bp1_yearly.6010.desc:0 "ดูเหมือนว่า [rivals_child.Custom('GetDaughterSon')] ของข้า [rivals_child.GetTitledFirstName] ได้รับแรงบันดาลใจจากความเกลียดชังของข้าที่มีต่อศัตรู [attacked_rival.GetTitledFirstName] และได้ตัดสินใจยุติความบาดหมางของเราด้วย [rivals_child.GetHerselfHimself]\n\nด้วยแรงผลักดันจากความกระตือรือร้นของวัยหนุ่มสาว [rivals_child.GetFirstNameNoTooltip] ได้ซุ่มโจมตี [attacked_rival.GetFirstNameNoTooltip] และถูกสังหารอย่างโหดเหี้ยมในการต่อสู้ที่ตามมา"
 bp1_yearly.6010.desc.apology:0 "\n\nข่าวนี้มาพร้อมกับจดหมายจาก [attacked_rival.GetTitledFirstNameNoTooltip] [attacked_rival.GetHerselfHimself] ประกาศว่า ในขณะที่ [rivals_child.GetFirstNameNoTooltip] ได้พบกับจุดจบที่สมควรสำหรับการโจมตีใครบางคนในบ้านของพวกเขา [rivals_child.GetSheHe] เสียใจกับสิ่งที่เกิดขึ้นและ [rivals_child.GetSheHe] จะชดเชยทางการเงินให้ข้าสำหรับการสูญเสียของข้า"
 bp1_yearly.6010.a:0 "[attacked_rival.GetFirstNameNoTooltip]จะต้องเสียใจกับวันนี้!"
 bp1_yearly.6010.a.flavor:0 "สาบานว่าจะแก้แค้น[attacked_rival.GetFirstNameNoTooltip]ให้หนักขึ้น"
 bp1_yearly.6010.b:0 "ข้าทำอะไรลงไป!?"
 bp1_yearly.6010.b.flavor:0 "พยายามหลีกเลี่ยงการนองเลือดเพิ่มเติม"
 bp1_yearly.6010.vengeance.outcome_toast:0 "[my_rival.GetFirstName]ได้สาบานว่าจะแก้แค้นให้[rivals_child.GetFirstNameNoTooltip]"
 bp1_yearly.6010.deescalation.outcome_toast:0 "[my_rival.GetFirstName]ได้ทราบถึงการตายของ[rivals_child.GetFirstNameNoTooltip]"
 every_child_6010:0 "พี่น้องทุกคนของ[rivals_child.GetFirstNameNoTooltip]"
 culture_tradition_events.2000.t:0 "ความเป็นผู้นำที่สร้างแรงบันดาลใจ"
 culture_tradition_events.2000.desc:0 "ขณะที่ข้าพิจารณาคำร้องขอความช่วยเหลือจากข้าหลวงของข้า, [inspiring_vassal.GetTitledFirstName], ข้าก็ตระหนักขึ้นมาทันทีว่าความสัมพันธ์ของข้ากับเจ้าเหนือหัวของข้าเอง, [ROOT.Char.GetLiege.GetTitledFirstName], นั้นดีเพียงใดมาโดยตลอด\n\nข้าคิดว่าข้าควรพยายามเลียนแบบการปฏิบัติหน้าที่อย่างซื่อสัตย์ของ[ROOT.Char.GetLiege.GetFirstNameNoTooltip]ในการปฏิสัมพันธ์กับทุกคนที่ข้ามีพันธะหน้าที่ต่อ นี่อาจเป็นหนทางที่ข้าจะสามารถสร้างแรงบันดาลใจให้เกิดความรู้สึกถึงหน้าที่แบบเดียวกันในหมู่ผู้ที่อยู่ใต้อาณัติของข้า"
 culture_tradition_events.2000.a:0 "รับสิ่งนี้ไป [inspiring_vassal.GetTitledFirstNameNoTooltip], และบอกข้าหากท่านต้องการอะไรเพิ่มเติม"
 culture_tradition_events.2000.b:0 "ภักดีเป็นเพียงอีกคำหนึ่งของความอ่อนแอ"
 culture_tradition_events.2001.t:0 "การเป็นผู้นำด้วยแบบอย่าง?"
 culture_tradition_events.2001.desc:0 "ความขัดแย้งล่าสุดระหว่างข้าหลวงของข้า, [targeted_vassal.GetTitledFirstName] และไพร่ฟ้าข้าแผ่นดินของ[targeted_vassal.GetHerHis]เอง ทำให้จำเป็นต้องเดินทางไปยัง[targeted_vassal.GetCapitalLocation.GetTitle.GetNameNoTierNoTooltip]อย่างกะทันหัน การปรากฏตัวของข้าเพียงอย่างเดียวดูเหมือนจะแก้ไขปัญหาได้ และชาวบ้านในท้องถิ่นก็ดูพอใจที่ข้อร้องเรียนของพวกเขาได้รับการรับฟังจากข้า\n\nขณะที่ข้าเดินไปตามโถงทางเดินที่ว่างเปล่าในยามดึก ข้าใคร่ครวญถึงความสัมพันธ์อันน่าผิดหวังของข้ากับเจ้าเหนือหัวของข้าเอง, [ROOT.Char.GetLiege.GetTitledFirstName] [ROOT.Char.GetLiege.GetSheHe|U]มักจะเรียกร้องการเชื่อฟังจากข้าอย่างรวดเร็ว แต่ไม่ค่อยมีครั้งใดที่[ROOT.Char.GetLiege.GetSheHe]จะเข้ามาช่วยเหลือข้าเหมือนที่ข้าเพิ่งทำเพื่อ[targeted_vassal.GetTitledFirstNameNoTooltip]"
 culture_tradition_events.2001.a:0 "การตอบแทน ซึ่งกันและกันคือสิ่งที่ขับเคลื่อนโลก ไม่ใช่หน้าที่"
 culture_tradition_events.2001.b:0 "ข้าต้องพยายาม ทำให้ดีกว่า[ROOT.Char.GetLiege.GetTitledFirstNameNoTooltip]"
