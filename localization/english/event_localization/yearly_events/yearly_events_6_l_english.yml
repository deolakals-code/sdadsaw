l_english: 
 yearly.9100.t:0 "ปัญหาในสวน"
 yearly.9100.desc:0 "ขณะที่ข้าก้าวเข้าสู่สวน ข้าแทบจะไม่ได้ก้าวเท้าเลยสักก้าว ก็ได้ยินเสียงใครบางคนสบถออกมาเสียงดัง \"#EMP [gardener.Custom('CulturalCurse')|U]!#!"\n\nข้าเดินอ้อมพุ่มไม้เพื่อค้นหาต้นตอ และพบคนสวนของข้า [gardener.GetTitledFirstName] กำลังง่วนอยู่กับดินด้วยใบหน้าบึ้งตึง [gardener.GetSheHe|U] สังเกตเห็นข้าเข้ามาใกล้และรีบลุกขึ้นยืน\n\n\"โอ้! ขออภัยขอรับ/เจ้าค่ะ ท่าน[ROOT.Char.GetLadyLord|U] ข้ามิคาดว่าจะมีผู้ใดออกมาที่นี่... สัตว์โง่เง่าบางตัว คงเป็น [gardener.Custom('GetAnimalType')] เป็นแน่ ได้ทำลายงาน #EMP ทั้งหมด#! ของข้าที่เพิ่งทำไป! ข้าเพิ่งปลูกสมุนไพรเหล่านี้เมื่อวานซืนนี้เอง!\""
 yearly.9100.a:0 "ให้ข้าช่วยเถิด!"
 yearly.9100.b:0 "นี่คือสินน้ำใจเล็กน้อยสำหรับงานหนักของเจ้า!"
 yearly.9100.c:0 "นั่น #EMP ช่าง#! โชคร้าย... แต่อย่าหยุด เพราะข้าเลย!"
 yearly.9100.a.tooltip_a:0 "ท่านเรียนรู้มากมายเกี่ยวกับการทำสวน"
 yearly.9100.a.tooltip_b:0 "ท่าน ทำให้สถานการณ์แย่ลงไปอีก"
 yearly.9100.a.success:0 "ข้าได้เรียนรู้เกี่ยวกับการทำสวน!"
 yearly.9100.a.failure:0 "การทำสวนเป็นการเสียเวลา!"
 
 yearly.9110.t:0 "หัวขโมยดอกไม้"
 yearly.9110.desc:1 "คนสวนของข้า [gardener.GetTitledFirstName] บุกเข้ามาในห้องสภา และตรงเข้าไปหา [romantic_councillor.GetCouncilTitle] ของข้า [romantic_councillor.GetTitledFirstName] อย่างเกรี้ยวกราด\n\n\"เจ้า #EMP กล้าดี#! อย่างไรมาทำลายสวนของ[ROOT.Char.GetTitleTierNamePossessive]?! ด้วยการ #EMP ขโมย#! ดอกไม้หายากและล้ำค่าไปไม่น้อย!\"\n\n[romantic_councillor.GetFirstNameNoTooltip] เห็นได้ชัดว่าไม่สะทกสะท้านกับอารมณ์ของคนสวน \"ข้าคิดว่ามันจะเป็นของขวัญที่สมบูรณ์แบบสำหรับ [councillor_spouse.GetWifeHusband] ของข้า การเป็นคนโรแมนติกแทบจะไม่ใช่ความผิด ใช่หรือไม่?\""
 yearly.9110.a:0 "แต่การทำลายสวนของข้าคือความผิด เจ้าจะต้องชดใช้ค่าเสียหาย เดี๋ยวนี้"
 yearly.9110.b:0 "เจ้าก้าวล้ำเส้นแล้ว [gardener.GetFirstNameNoTooltip]!"
 yearly.9110.c:0 "ดอกไม้เหล่านั้นเป็นของขวัญที่ยอดเยี่ยม... สำหรับ #EMP [spouse.GetWifeHusband]#! ของข้า"
 yearly.9110.d:0 "ข้าจะ #EMP ไม่#! เข้าไปยุ่ง! แก้ปัญหากันเองเถิด"
 
 yearly.9120.t:0 "พ่อค้าเมล็ดพันธุ์"
 yearly.9120.desc:0 "ตลาดใน [barony_market.GetName] ค่อนข้างคึกคัก และมีพ่อค้าคนหนึ่งที่ดึงดูดสายตาข้าเป็นพิเศษ [seed_merchant.GetSheHe|U] ดูเหมือนจะขายเพียงกล่องใบเล็กๆ เมื่อสังเกตเห็นความสงสัยของข้า [seed_merchant.GetSheHe] ก็กวักมือเรียกข้า\n\n"สนใจสิ่งใดเป็นพิเศษหรือไม่ [ROOT.Char.Custom('FormOfAddressForLiege')]? ท่านเห็นไหม กล่องใบเล็กๆ เหล่านี้ล้วนเต็มไปด้วยเมล็ดพันธุ์นานาชนิด บ้างก็จะเติบโตเป็นดอกไม้สีสันสดใส บ้างก็เป็นสมุนไพร ข้ามีชนิดที่เป็นพิษหายากด้วยนะ หากท่านสนใจ?""
 yearly.9120.a:0 "ขอชนิดมีพิษ... สำหรับการวิจัยน่ะ"
 yearly.9120.b:0 "ดอกไม้แปลกตาจะ ทำให้สวนของข้าน่าประทับใจอย่างแน่นอน!"
 yearly.9120.c:0 "สมุนไพรมีประโยชน์เสมอ ข้าจะเอาพวกนั้น"
 yearly.9120.d:0 "สำหรับราคา #EMP เหล่านี้#! ที่แพงเกินไป?! ไม่มีทางเสียหรอก!"
