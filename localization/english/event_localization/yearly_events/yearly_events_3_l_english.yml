l_english: 
 yearly.3001.t:0 "คำเตือนที่เป็นประโยชน์"
 yearly.3001.desc:0 "ข้าได้รับสาส์นจาก [neighbor.GetName] อ้างว่า [vassal.GetTitledFirstName] [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('vassal'))] ของข้า ได้ร้องขอการสนับสนุนในแผนร้ายต่อต้านข้า!\n\n\"ไม่มีสิ่งใดที่ข้าให้ค่ามากไปกว่าความภักดี\" สาส์นของ [neighbor.GetFirstNamePossessive] กล่าวไว้ \"ด้วยเหตุนี้ข้าจึงแบ่งปันเรื่องนี้กับท่าน\""
 yearly.3001.friend_backs_neighbor:0 "\n\nโชคดีที่ [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('friend'))] [friend.GetFirstName] ของข้าอยู่ที่นั่น เพื่อให้คำแนะนำแก่ข้า \"ข้าสงสัยในตัว [vassal.GetFirstNameNoTooltip] มาระยะหนึ่งแล้ว เรื่องนี้ยิ่งเป็นการยืนยันข้อสงสัยเหล่านั้น\""
 yearly.3001.friend_backs_vassal:0 "\n\nโชคดีที่ [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('friend'))] [friend.GetFirstName] ของข้าอยู่ที่นั่น เพื่อให้คำแนะนำแก่ข้า \"ข้าปฏิเสธที่จะเชื่อว่า [vassal.GetFirstNameNoTooltip] จะลดตัวลงต่ำถึงเพียงนั้น\""
 yearly.3001.a:0 "ข้าจะเผชิญหน้ากับ [vassal.GetFirstNameNoTooltip] เป็นการส่วนตัว"
 yearly.3001.confront:0 "[vassal.GetSheHe|U] ได้เรียนรู้ถึงความสงสัยของข้า"
 yearly.3001.true_tt:0 "ข้อกล่าวหาของข้าเป็นความจริง"
 yearly.3001.false_tt:0 "ความสงสัยของข้าไม่มีมูล"
 yearly.3001.false_use_tt:0 "[vassal.GetTitledFirstNameNoTooltip] จะใช้การดูหมิ่นนี้ให้เป็นประโยชน์แก่[vassal.GetHerHis]"
 yearly.3001.b:0 "[vassal.GetSheHe|U] มีความผิด และข้าจะกล่าวหา[vassal.GetHerHim]ต่อสาธารณะ!"
 yearly.3001.c:0 "[neighbor.GetTitleAsNameNoTooltip] ไม่น่าไว้วางใจ ข้าหลวงของข้าได้รับการสนับสนุนจากข้า!"
 yearly.3001.c.if_wrong_tt:0 "หาก [vassal.GetFirstNameNoTooltip] ไม่ภักดี"
 yearly.3001.c.if_right:0 "หาก [vassal.GetFirstNameNoTooltip] ภักดี"
 yearly.3001.vassal_gains_strength:0 "แผนการของ [vassal.GetTitledFirstNamePossessiveNoTooltip] แข็งแกร่งขึ้น"
 yearly.3001.d:0 "ข้า #EMP รู้#! อยู่แล้ว! [vassal.GetFirstNameNoTooltip] จะต้องชดใช้!"

 yearly.3002.t:0 "คำสารภาพ"
 yearly.3002.desc:0 "[vassal.GetTitledFirstName] ทำอะไรไม่ได้นอกจากสารภาพเมื่อ [vassal.GetSheHe] ถูกเผชิญหน้าด้วยสาส์นของ [neighbor.GetTitledFirstNamePossessive]\n\n"มันไม่เคย... มันไม่ใช่... ข้าจะ ทำให้เรื่องนี้ถูกต้องได้อย่างไรอีก?" [vassal.GetSheHe|U] [vassal.Custom('quirk_neg_present')] แต่ข้าเห็นความกลัวปรากฏชัดบนใบหน้าของ[vassal.GetHerHis]"
 yearly.3002.a:0 "ทำทุกอย่างที่ข้าสั่ง แล้วเจ้าจะรอดพ้น"
 yearly.3002.b:0 "ข้าให้อภัย หากเจ้าบอกให้ผู้คนรู้ถึงความเมตตาของข้า"

 yearly.3003.t:0 "ข้อกล่าวหาที่ดูหมิ่น"
 yearly.3003.desc:2 "เมื่อข้านำจดหมายของ [neighbor.GetTitledFirstNamePossessiveNoTooltip] ไปให้ [vassal.GetTitledFirstName] ตอนแรกก็พบกับความสับสน จากนั้นก็ความโกรธ "ท่านเชื่อคำพูดของ [neighbor.GetHerHis] มากกว่าข้าหรือ? ข้าไม่ได้เป็นผู้รับใช้ที่ภักดีเสมอไปหรือ!"\n\nความขุ่นเคืองของ [vassal.GetHerHis|U] ทำให้เกิดเมล็ดพันธุ์แห่งความสงสัยในใจข้า บางทีข้าอาจจะทำเร็วเกินไป ข้าควรจะแก้ไขก่อนที่ข้าจะทำลายความสัมพันธ์นี้ไปมากกว่านี้!"
 yearly.3003.friend:0 "\nโชคดีที่ [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('friend'))] ของข้าเข้ามาแทรกแซง "นี่เป็นเพียงการเตือนท่านถึงการใส่ร้ายของ [neighbor.GetTitledFirstNamePossessive]" [friend.GetTitledFirstName] กล่าว"
 yearly.3003.a:0 "ใช่ อันที่จริงข้าปรารถนาที่จะให้รางวัลแก่ท่านสำหรับความภักดีของท่าน!"
 yearly.3003.b:0 "ท่านเป็นผู้รับใช้ที่ดีเสมอมา"
 yearly.3003.public_expression_of_gratitude:0 "การแสดงความขอบคุณต่อสาธารณะ"
 yearly.3003.vassal_loss_of_faith:0 "คำขอโทษที่ไม่จริงใจ"
 yearly.3003.c:0 "ใช่ สิ่งที่ [friend.GetFirstNameNoTooltip] พูด!"
 yearly.3003.c.enable:0 "ตัวเลือกนี้มีให้ เนื่องจากการทูตที่สูงของ [friend.GetTitledFirstNamePossessiveNoTooltip]"

 yearly.3004.t:0 "เปิดเผยต่อสาธารณะ"
 yearly.3004.desc:0 "ในการรวมตัวของข้าหลวงหลายคนของข้า ข้าประกาศว่าข้ารู้ถึงการทรยศของ [vassal.GetTitledFirstNamePossessive]\n\nข้าหลวงคนอื่นๆ ของข้าหลายคนลุกขึ้นสนับสนุน "เราทุกคนรู้ว่ามันเป็นความจริง จะเกิดอะไรขึ้นกับ[vassal.GetHerHim]?""
 yearly.3004.a:0 "[vassal.GetFirstNameNoTooltip] จะชดใช้ความผิดของ[vassal.GetHerHis]"
 
 yearly.3004.b:0 "ข้าจะ ทำให้แน่ใจว่า [vassal.GetSheHe] ไม่สามารถทำอันตรายข้าได้"
 yearly.3004.c:0 "ข้าจะ ทำให้ #EMP แน่ใจอย่างยิ่ง#! ว่า [vassal.GetSheHe] ไม่สามารถทำอันตรายข้าได้"

 yearly.3005.desc:0 "ในการรวมตัวของข้าหลวงหลายคนของข้า ข้าประกาศว่าข้ารู้ถึงการทรยศของ [vassal.GetTitledFirstNamePossessive] อย่างไรก็ตาม เพื่อนข้าหลวงของ[vassal.GetHerHis]ยังห่างไกลจากความพอใจกับสาส์นของ[neighbor.GetLadyLord]ต่างแดน\n\n[vassal.GetFirstName] พูดแทนพวกเขาทั้งหมด "มีหลักฐานอะไร? หากสาส์นเพียงพอ เราจะไม่ #EMP มีความผิด#! กันทั้งหมดหรือ?" การรวมตัวพึมพำเห็นด้วย เรื่องนี้กำลังจะควบคุมไม่ได้!"
 yearly.3005.a:0 "ข้าควรจะชิงลงมือก่อน!"
 yearly.3005.a.rousing_speech:0 "สุนทรพจน์ปลุกใจเรื่องความภักดี"
 yearly.3005.a.stumbling_apology:0 "คำขอโทษที่ตะกุกตะกัก"
 yearly.3005.b:0 "ข้าได้ประกาศว่า[vassal.GetHerHim]เป็นคนทรยศ และ[vassal.GetSheHe]จะถูกปฏิบัติ เช่นนั้น!"

 yearly.3011.t:0 "สร้างความประทับใจซ้ำสอง"
 yearly.3011.desc:0 "ก่อนงานเลี้ยงอีกครั้งเพื่อเป็นเกียรติแก่ [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('liege'))] ของข้า [liege.GetTitledFirstName] [vassal.GetTitledFirstName] ได้มาเยี่ยมข้า\n\n"เราทั้งคู่ไม่ได้อยู่ในความโปรดปรานที่ดีที่สุดของ [liege.GetTitleAsNamePossessiveNoTooltip]" [vassal.GetSheHe] ชี้ให้เห็น "แต่ถ้าเราจะจัดการแสดงที่น่าตื่นตาตื่นใจในงานเลี้ยง เราอาจจะปรับปรุงสถานะของเรากับ[liege.GetHerHim]ได้""
 yearly.3011.a:0 "ข้าจะจัดหาทองคำสำหรับการลงทุนครั้งนี้!"
 yearly.3011.a.success:0 "การแสดงอันรุ่งโรจน์"
 yearly.3011.a.failure:0 "ให้ความบันเทิงเพียงพอ"
 yearly.3011.b:0 "ข้าสามารถหานักแสดงที่เราต้องการได้"
 yearly.3011.c:0 "ข้าคิดว่าควรจะมุ่งเน้นไปที่สิ่งเล็กๆ น้อยๆ ดีกว่า"
 yearly.3011.d:0 "ข้ารู้วิธีจัดการแสดงอย่างแน่นอน"

 yearly.3012.desc:0 "ร่างที่แกว่งไกวและบิดเบี้ยว นักเต้นที่ [vassal.GetTitledFirstName] และข้าจ้างมา ทำให้ทุกคนตกตะลึง หลังอาหาร [liege.GetTitledFirstName] [liege.GetHerselfHimself] เข้ามาหาข้า "นั่นเป็นอะไรที่ยอดเยี่ยมจริงๆ [ROOT.Char.GetFirstNameNoTooltip]"\n\n[vassal.GetFirstName] และข้าอดไม่ได้ที่จะแลกเปลี่ยนรอยยิ้ม"
 yearly.3012.a:0 "ข้าสงสัยว่าเราควรจะทำอะไรต่อไป..."
 yearly.3012.b:0 "นี่เป็นความคิดที่ดีมาก [vassal.GetFirstNameNoTooltip]"

 yearly.3013.desc:0 "แม้จะมีการกวาดขาและหมุนแขนทั้งหมด [liege.GetTitledFirstName] ดูเหมือนจะไม่ประทับใจนักเต้นที่ [vassal.GetTitledFirstName] และข้าจ้างมาสำหรับงานเลี้ยง [liege.GetTitleAsNameNoTooltip] ฟังคำอุทิศของพวกเขาให้เราด้วยรอยยิ้ม แต่แล้วก็หันความสนใจของ [liege.GetHerHis] กลับไปที่อาหารอย่างรวดเร็ว\n\n[vassal.GetFirstName] มองข้าด้วยความไม่แน่ใจ แต่ [liege.GetFirstName] ดูเหมือนจะพอใจพอสมควร"
 yearly.3013.a:0 "ไม่ว่าจะอย่างไร เราจะดูแล ซึ่งกันและกัน"
 yearly.3013.b:0 "อย่างน้อยเราก็พยายามอย่างดีที่สุดแล้ว"

 yearly.3014.desc:0 "นักเต้นที่ [vassal.GetTitledFirstName] และข้าจ้างมาเป็นหายนะ พวกเขาแกว่งแขนขาและกระโดดไปมา ดูเหมือนคณะตลกมากกว่าการแสดงที่สง่างามตามที่สัญญาไว้ [liege.GetTitledFirstName] ดูเหมือนจะไม่พอใจที่ถูกรบกวนกลางอาหารค่ำของ[liege.GetHerHis] เช่นกัน\n\nเป็นเพียงระหว่างการอุทิศให้เราเท่านั้นที่ข้าตระหนักว่านี่ไม่ใช่กลุ่มเดียวกับที่เราเจรจาด้วย! ใครกันที่สามารถ-\n[nemesis.GetTitledFirstName]!"
 yearly.3014.a:0 "ให้ข้าบอกท่านเกี่ยวกับคนร้ายที่ทำลายสิ่งนี้ [vassal.GetFirstNameNoTooltip]"
 yearly.3014.b:0 "นี่ไม่ใช่ความผิดของเรา [vassal.GetFirstNameNoTooltip]"
 
 yearly.3021.t:0 "บนเตียงนอนก่อนตายของ[deathbed_character.GetHerHis|U]"
 yearly.3021.desc:0 "เป็นที่ชัดเจนแล้วว่า [deathbed_character.GetTitledFirstName] [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('deathbed_character'))] เก่าแก่ของข้า อยู่ในโลกนี้ได้อีกไม่นาน\n\nขณะที่ข้าไปที่เตียงนอนก่อนตายของ[deathbed_character.GetHerHis] ข้ารู้ว่า [deathbed_character.GetSheHe] มีชีวิตที่ยืนยาว แต่ก็ไม่เคยมีเวลาพอที่จะกล่าวคำอำลาใช่ไหม? ข้าจับมือ[deathbed_character.GetHerHis]ไว้ จนกระทั่งมันเย็นลงและลมหายใจของ[deathbed_character.GetSheHe]นิ่งไป"
 yearly.3021.a:0 "ขอให้ท่านพบความสงบสุขในชีวิตหลังความตาย [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('deathbed_character'))]"

 yearly.3031.t:0 "ก้าวไปข้างหน้า"
 yearly.3031.desc:0 "ทั้ง [fellow_vassal.Custom2('MyCharacterIntroduction', ROOT.Char)] และข้าต่างก็ได้รับความนับถือจากเจ้าเหนือหัวของเรา [liege.GetTitledFirstName] อย่างไรก็ตาม เมื่อถึงเวลาที่จะมอบตำแหน่ง เกียรติยศ และความมั่งคั่ง พวกเราคนหนึ่งจะเป็นคนแรกในหมู่ผู้เท่าเทียมกันเสมอ\n\nการรวมตัวที่กำลังจะมาถึงที่ [capital.GetNameNoTierNoTooltip] [liege.Custom('ResidenceBuilding')|U] ทำให้ข้ามีโอกาสที่จะ ทำให้แน่ใจว่าข้าเป็นคนหนึ่งที่ได้รับความโปรดปรานจาก [liege.GetTitleAsNamePossessiveNoTooltip]"
 yearly.3031.friend:0 "การมี [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('best_friend'))] [best_friend.GetTitledFirstName] ของข้าอยู่เคียงข้างก็จะช่วยได้อย่างแน่นอน เช่นกัน"
 yearly.3031.rival:0 "อย่างไรก็ตาม [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('nemesis'))] [nemesis.GetTitledFirstName] ของข้าไม่ได้ปิดบังความจริงที่ว่า [nemesis.GetSheHe] ตั้งใจที่จะขัดขวางความพยายามของข้า!"
 yearly.3031.a:0 "ในฐานะคนพูดเก่ง นี่ควรจะง่าย"
 yearly.3031.a.best_friend_success:0 "[best_friend.GetFirstNameNoTooltip] เบี่ยงเบนความสนใจ [fellow_vassal.GetFirstNameNoTooltip]"
 yearly.3031.a.success:0 "ข้ากลายเป็นมิตรกับ [liege.GetTitleAsNameNoTooltip]"
 yearly.3031.a.failure:0 "[fellow_vassal.GetFirstNameNoTooltip] ผูกมิตรกับ [liege.GetTitleAsNameNoTooltip]"
 yearly.3031.a.nemesis_failure:0 "[nemesis.GetFirstNameNoTooltip] ใส่ร้ายข้า"
 yearly.3031.b:0 "ข้าจะแสดงให้เห็นว่า [ROOT.Char.GetFaith.HighGodName] โปรดปรานข้าอยู่แล้ว"
 yearly.3031.b.success:0 "ข้าสร้างความประทับใจให้ [liege.GetTitleAsNameNoTooltip]"
 yearly.3031.b.failure:0 "[liege.GetTitleAsNameNoTooltip] ประทับใจ [fellow_vassal.GetFirstNameNoTooltip] มากกว่า"
 yearly.3031.c:0 "ข้ารู้วิธีดึงดูดความสนใจของ [liege.GetFirstNamePossessiveNoTooltip]..."
 yearly.3031.c.unlock_tt:0 "ตัวเลือกนี้มีให้ เนื่องจากความน่าดึงดูดใจของข้าต่อ [liege.GetTitledFirstNameNoTooltip]"
 yearly.3031.c.consequence:0 "[liege.GetFirstNameNoTooltip] อาจจะไล่ตามข้าต่อไป"
 yearly.3031.c.success:0 "ดึงดูดความสนใจ"
 yearly.3031.d:0 "เราเหล่าข้าหลวงควรทำงานร่วมกัน ไม่ใช่ต่อต้านกัน!"

 yearly.3040.t:0 "[ROOT.Char.GetFaith.GetAdjectiveNoTooltip|U] ที่ดี"
 yearly.3040.desc:1 "ข้าเป็นที่รู้จักในฐานะ [ROOT.Char.GetWomanMan] ที่เคร่งศาสนาอย่างลึกซึ้ง แน่นอนว่าความทุ่มเทของข้าต่อ [ROOT.Char.GetFaith.HighGodName] ควรจะเป็นประโยชน์ในชีวิตนี้ด้วย ไม่ใช่แค่ในชีวิตหน้า?\n\nมีคนจำนวนหนึ่งที่ควรจะได้รับการเตือนว่าข้าอยู่ในความโปรดปรานของ [ROOT.Char.GetFaith.HighGodNameAlternatePossessive]"
 yearly.3040.a:0 "ความทุ่มเทของข้าควรจะถูกป่าวประกาศจากหอคอย!"
 yearly.3040.b:0 "ข้าผ่อนปรนกับ [ROOT.Char.GetFaith.HouseOfWorship] มากเกินไปในปีนี้..."
 yearly.3040.c:0 "[religious_head.GetTitleAsNameNoTooltip] ย่อมชื่นชม [ROOT.Char.GetLadyLord] ที่เคร่งศาสนาอย่างแน่นอน!"
 yearly.3040.d:0 "[ROOT.Char.Custom('DefaultPriestTitlePlural')] ต่างก็ยำเกรงข้าอยู่แล้ว"

 yearly.3041.opening:0 "[vassal.Custom2('AppropriateGreeting', ROOT.Char)]"
 yearly.3041.desc:0 "ข้ารู้ว่าท่านเป็นผู้รับใช้ที่อุทิศตนของ [ROOT.Char.GetFaith.HighGodNameAlternate] ดังนั้นข้าจึงหวังว่าท่านจะมองด้วยความเห็นใจต่อข้อเท็จจริงที่ว่าหน้าที่ของเราต่อท่านนั้นเป็นภาระต่อความสามารถของเราในการทำงานของ [ROOT.Char.GetFaith.HighGodNamePossessive]\n\nบางทีภาระหน้าที่ที่หนักหนาบางอย่างของเราอาจจะได้รับการยกเว้น?"
 yearly.3041.a:1 "ทองคำของข้าคือทองคำของ [ROOT.Char.GetFaith.HighGodNamePossessive]"
 yearly.3041.b:1 "มุ่งกำลังคนของท่านไปที่อื่น"
 yearly.3041.c:0 "#EMP ข้า#! คือผู้ที่ทำงานของ [ROOT.Char.GetFaith.HighGodNamePossessive]!"

 yearly.3051.t:0 "โดยสิทธิ์"
 yearly.3051.desc:0 "[ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('councillor'))] ของข้าได้แจ้งให้ข้าทราบถึงกฎหมายที่ไม่ชัดเจนใน [county.GetName] ซึ่งระบุว่าไม่มีผู้ใดนอกจาก [ROOT.Char.GetTitleAsNameNoTooltip] เท่านั้นที่อาจเป็นผู้พิทักษ์ได้\n\nโดยปกติแล้วกฎหมายที่เก่าแก่ เช่นนี้จะถูกปัดตกไป แต่มันมอบโอกาสพิเศษให้ข้าในการ ทำให้ [vassal.GetTitledFirstName] [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('vassal'))] ของข้าและผู้ปกครองปัจจุบันของ [county.GetNameNoTooltip] รู้จักที่ทางของ[vassal.GetHerHis]"
 yearly.3051.a:0 "กฎหมายชัดเจน [ROOT.Char.GetTitleAsNameNoTooltip] มีสิทธิ์เต็มที่!"
 yearly.3051.b:0 "[vassal.GetFirstNameNoTooltip] สามารถรักษาตำแหน่งไว้ได้ ด้วยความเมตตาของข้า"

 yearly.3061.t:0 "การจัดการกับชาวคากอทส์"
 yearly.3061.desc:0 "ข้าอารมณ์เสียแค่คิดถึงมัน! ใน [county.GetName] ชาวคากอทส์ใช้ชีวิตอย่างอิสระเคียงข้างคนปกติ แทบไม่ถูกรังเกียจจากการกระทำผิดของพวกเขา! และทั้งหมดนี้เกิดขึ้นตามเส้นทางนักบุญเจมส์!\n\nแน่นอนว่าพวกเขาไม่ได้รับอนุญาตให้เดินเท้าเปล่า แตะราวสะพาน หรือรับศีลมหาสนิทโดยตรงจากมือของ [ROOT.Char.GetFaith.PriestNeuter] แต่ยิ่งไปกว่านั้นเรากำลังทำ #EMP อะไรไม่เลย!#!\n\nสถานการณ์ที่ทนไม่ได้นี้ไม่สามารถดำเนินต่อไปได้ จะเกิดอะไรขึ้นถ้าพวกเขากำลังวางแผนอะไรบางอย่าง?!"
 yearly.3061.a:0 "ข้าจะเรียกเก็บภาษีอย่างหนักจากชาวคากอทส์ เพื่อกดขี่พวกเขา!"
 yearly.3061.b:0 "พวกเขาต้องถูกแยกออกจากสังคมที่ดี!"
 yearly.3061.b.flavor:0 "แยกคากอเทอรี สร้างเครื่องหมายด้วยเท้าเป็ดสีแดง สร้างประตูโบสถ์ที่เล็กกว่าแยกต่างหากสำหรับพวกเขา... ใช่ นั่นน่าจะพอ"
 yearly.3061.c:0 "เราไม่สามารถลองอยู่เคียงข้างพวกเขาได้หรือ?"
 yearly.3061.d:0 "พวกนอกรีตที่ไม่เชื่อในพระเจ้า! ขับไล่พวกเขาออกไปและยึดทรัพย์สินของพวกเขา!"

 yearly.3071.t:0 "เป็นเพียงฝันร้าย"
 yearly.3071.desc:0 "ข้าตื่นขึ้นมากรีดร้อง หัวใจเต้นเร็ว\n\nข้าถูกล่ามโซ่เปลือยกาย — หรือสวมปลอกคอ? — ขณะที่ชายหญิงสิบสองคนที่มีหัวเป็นแพะเข้ามาหาข้า กัดและฉีกทึ้งผิวหนังของข้า...\n\nทันใดนั้นข้าก็กลายเป็นหนึ่งในพวกมัน ฉีกทึ้งเนื้อหนังของตนเองด้วยฟันอันแหลมคม กลืนกินเศษเนื้อ ดื่มเลือด... #EMP ซู้ด...#! ข้าไม่เคยรู้สึกถึงสิ่งใดที่น่าสะพรึงกลัวเท่ากับการได้เห็นชีวิตดับไปจากดวงตาของร่างที่ถูกทำลายยับเยินของข้า\n\nแต่มันเป็นเพียงความฝัน มันเป็นเพียงความฝัน"
 yearly.3071.a:0 "การสวดภาวนาขอความคุ้มครองจาก [ROOT.Char.GetFaith.HighGodNamePossessive] จะ ทำให้ข้าสงบลง"
 yearly.3071.b:0 "เหตุใดความทรงจำถึงรสชาตินั้นจึงไม่หายไปจากใจข้า?!"
