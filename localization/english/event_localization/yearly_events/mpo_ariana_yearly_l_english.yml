 mpo_events_ariana.0080.t: "ต้นไม้วิเศษ"
 mpo_events_ariana.0080.desc: ""ท่าน [ROOT.Char.GetTitledFirstName] [tree_lover.Custom2('RelationToMeShort', ROOT.Char)] ของข้า ท่านต้องฟังเรื่องนี้!" [tree_lover.GetName] อุทานพลางกวักมือเรียกข้า\n\n"ข้าได้ยินมาว่ามีต้นไม้ต้นหนึ่งที่ไม่เหมือนต้นอื่นใด ว่ากันว่ามันมีคุณสมบัติพิเศษ และถึงกับมีผู้กล่าวว่ามันได้รับพรจาก [ROOT.Char.GetFaith.HighGodName] ให้สามารถประทานพรได้ ข้าเชื่อว่าถึงเวลาแล้วที่เราจะไปตามหามัน และดูว่าตำนานเป็นจริงหรือไม่ มันอยู่ใน [tree_barony.GetName] หากท่านสนใจ"\n\n[tree_barony.GetNameNoTooltip] หรือ? นั่นเป็นการเดินทางที่ไกลทีเดียว แต่หากมีโอกาสที่ต้นไม้นี้จะมีอยู่จริง ข้าก็ต้องรู้ให้ได้"
 mpo_events_ariana.0080.a: "นำต้นไม้นี้มาให้ข้า"
 mpo_events_ariana.0080.a_tt: "ท่านส่ง [tree_lover.GetFirstNameNoTooltip] ไปตามหาต้นไม้วิเศษและนำมันมาให้ท่าน"
 mpo_events_ariana.0080.b: "ข้าจะไปดูด้วยตาตนเอง"
 mpo_events_ariana.0080.b_arrogant: "ข้าไม่ต้องการให้ใครมาหาเพียงแค่ต้นไม้ให้ข้า"
 mpo_events_ariana.0080.b_tt: "ท่านออกเดินทางไปยัง [tree_barony.GetName] เพื่อตามหาต้นไม้วิเศษด้วยตนเอง"
 mpo_events_ariana.0080.c_sus: "[tree_lover.GetFirstNameNoTooltip] กำลังพยายามจะหลอกลวงข้า!"
 mpo_events_ariana.0080.c: "เหตุใดจึงต้องเสียเวลากับเรื่องเพ้อฝัน?"
 mpo_events_ariana.0080.c_flavor: "ท่านไม่ใส่ใจคำพูดเพ้อเจ้อของ [tree_lover.GetFirstNamePossessive]"

 mpo_events_ariana.0081.desc_self: "ข้ามาถึง [tree_barony.GetName] สถานที่ที่ [tree_lover.GetFirstName] พูดถึงแล้ว ข้าพบว่าตัวเองอยู่ในที่โล่งแห่งหนึ่ง ที่ ซึ่งต้นไม้ต้นหนึ่งแผ่ความอบอุ่นสีทองอ่อนๆ ออกมา"
 mpo_events_ariana.0081.desc_guy: "เป็นเวลานานแล้วที่ข้าไม่ได้พูดคุยกับ [tree_lover.GetName] ข้ามักจะคิดถึง [tree_lover.GetHerHim] อยู่บ่อยครั้ง และสงสัยว่า [tree_lover.GetSheHe] ได้พบต้นไม้ที่ [tree_lover.GetSheHe] พูดถึงแล้วหรือยัง ทันทีที่ข้ากำลังจะปัดความคิดนั้นทิ้งไป"
 mpo_events_ariana.0081.desc: "[tree_lover.GetSheHe|U] ก็ปรากฏตัวต่อหน้าข้าพร้อมรอยยิ้มกว้างบนใบหน้าของ [tree_lover.GetHerHis] [tree_lover.GetSheHe|U] นำข้าไปยังลานในบ้านของข้า ที่ ซึ่งต้นไม้ที่เพิ่งปลูกใหม่ต้นหนึ่งยืนต้นสูงตระหง่าน\n\n"
 mpo_events_ariana.0081.desc_dead: "[tree_giver.GetName] ปรากฏตัวต่อหน้าข้าด้วยสีหน้าเคร่งขรึม [tree_giver.GetSheHe|U] นำข้าไปยังลานในบ้านของข้า ที่ ซึ่งต้นไม้ที่เพิ่งปลูกใหม่ต้นหนึ่งยืนต้นสูงตระหง่าน "[tree_lover.GetName] พูดถูก" [tree_giver.GetSheHe] กล่าว "แต่ข้าหวังว่า [tree_lover.GetSheHe] จะสามารถนำมันมามอบให้ท่านด้วย [tree_lover.GetHerHim]self ได้""\n\n"
 mpo_events_ariana.0081.desc_outro: "ข้าตะลึงงันกับภาพที่เห็น แม้จะเป็นเพียงเพราะตำนานนั้นกลายเป็นความจริง ใบไม้ของมันส่องประกายเจิดจ้าท่ามกลางแสงแดด ร่วงหล่นลงสู่พื้นดินอย่างงดงาม แสงที่สาดส่องผ่านกิ่งก้านอาบไล้ผิวของข้า และท่ามกลางความชื่นชม ข้าก็หวนคิดถึง [tree_lover.GetFirstNameNoTooltip] อีกครั้ง และข้าก็นึกถึงความสามารถของต้นไม้ที่ว่ากันว่าสามารถดลบันดาลพรได้ ข้าหลับตาลง แล้วอธิษฐานเงียบๆ ในใจ"
 mpo_events_ariana.0081.a: "ข้าปรารถนาให้ดินแดนและวงศ์ตระกูลของข้าจงเจริญรุ่งเรือง"
 mpo_events_ariana.0081.b: "ข้าปรารถนาพละกำลังเพื่อเอาชนะศัตรูของข้า"
 mpo_events_ariana.0081.c: "ข้าปรารถนาปัญญาและจิตใจที่ปลอดโปร่ง"
 mpo_events_ariana.0081.wish: "ท่านอธิษฐาน"
 mpo_events_ariana.0081.success: "คำอธิษฐานของท่านสัมฤทธิ์ผล"
 mpo_events_ariana.0081.failure: "คำอธิษฐานของท่านไม่ได้รับการตอบสนอง"

 mpo_magical_tree_fertility_modifier: "พรแห่งความอุดมสมบูรณ์"
 mpo_magical_tree_fertility_modifier_desc: "ตัวละครนี้ได้รับพรจากต้นไม้วิเศษ ทำให้ดินแดนของพวกเขาจะเจริญรุ่งเรือง และลูกหลานของพวกเขาจะมีมากมาย"

 mpo_magical_tree_power_modifier: "พรแห่งอำนาจ"
 mpo_magical_tree_power_modifier_desc: "ตัวละครนี้ได้รับพรจากต้นไม้วิเศษ ทำให้พวกเขามีพลังอำนาจมากขึ้นในการรบ"

 mpo_magical_tree_wisdom_modifier: "พรแห่งปัญญา"
 mpo_magical_tree_wisdom_modifier_desc: "ตัวละครนี้ได้รับพรจากต้นไม้วิเศษ ทำให้พวกเขามีปัญญาเกินวัย"

 mpo_magical_tree_modifier: "ได้รับการปลอบประโลม"
 mpo_magical_tree_modifier_desc: "ตัวละครนี้ได้เห็นต้นไม้วิเศษ และรู้สึกสงบลงด้วยการปรากฏตัวของมัน"

 mpo_events_ariana.0090.t: "ความทะเยอทะยานอันนุ่มฟู"
 mpo_events_ariana.0090.desc: "หลังจากใช้เวลาอยู่ในทุ่งหญ้ากับคนเลี้ยงแกะมาระยะหนึ่ง [child.GetFirstName] ก็กลับมาที่เยิร์ตด้วยรอยยิ้มบนใบหน้าของ [child.GetHerHis]\n\n"
 mpo_events_ariana.0090.desc_younger: ""ข้าปรารถนาที่จะเป็นคนเลี้ยงแกะ [child.Custom2('RelationToMeShort', ROOT.Char)]!" [child.GetSheHe] อุทาน "พวกเขาได้ใช้เวลาทั้งวันกับแกะ และดูสิว่าพวกเขามีความสุขแค่ไหน การเป็น [ROOT.Char.GetTitleAsNameNoTooltip] ดูน่าเบื่อ!"\n\n[child.GetSheHe|U] ยื่นมัดขนแกะที่เพิ่งตัดใหม่ให้ข้า และถึงแม้มันจะหยาบและสกปรก ข้าก็เห็นความภาคภูมิใจในดวงตาของ [child.GetHerHis]"
 mpo_events_ariana.0090.desc_older: ""ข้าต้องการเป็นคนเลี้ยงแกะ มากกว่าที่จะเป็น [ROOT.Char.GetTitleAsNameNoTooltip] เช่นท่าน [child.Custom2('RelationToMeShort', ROOT.Char)]" [child.GetSheHe] อุทาน "ชีวิตของพวกเขาดูเรียบง่าย ปราศจากความกังวลเรื่องการรบและการปกครอง"\n\n[child.GetSheHe|U] ยื่นมัดขนแกะที่เพิ่งตัดใหม่ให้ข้า และถึงแม้มันจะหยาบและสกปรก ข้าก็สัมผัสได้ถึงความมุ่งมั่นในคำพูดของ [child.GetHerHis]"
 mpo_events_ariana.0090.a: "การรู้จักวิถีของคนเลี้ยงแกะเป็นเรื่องฉลาด"
 mpo_events_ariana.0090.a_flavor: "ความฝันของ [child.GetFirstNamePossessiveNoTooltip] นั้นดี แม้จะเรียบง่ายก็ตาม"
 mpo_events_ariana.0090.b: "มรดกของเจ้าต้องยิ่งใหญ่กว่าคนเลี้ยงสัตว์!"
 mpo_events_ariana.0090.c: "ชีวิตของพวกเขามิได้เรียบง่ายอย่างที่เห็นนะ ลูกข้า"
 mpo_events_ariana.0090.c_duel: "[child.GetFirstNameNoTooltip] ถูกส่งไปทำงานในทุ่งหญ้า"
 mpo_events_ariana.0090.c_1: "[child.GetFirstNameNoTooltip] ได้เรียนรู้คุณค่าของความขยันหมั่นเพียร"
 mpo_events_ariana.0090.c_2: "[child.GetFirstNameNoTooltip] แข็งแรงขึ้นระหว่างการทำงานของ [child.GetHerHis]"
 mpo_child_herder_modifier: "ผู้เลี้ยงสัตว์โดยชะตาลิขิต"
 mpo_child_herder_modifier_desc: "ตัวละครนี้เคยใช้เวลาอยู่ในทุ่งหญ้า และได้รับทักษะบางอย่างจากผู้เลี้ยงสัตว์"

 mpo_events_ariana.0100.t: "ความแข็งแกร่งในที่ที่ไม่คาดคิด"
 mpo_events_ariana.0100.desc: "ฝุ่นตลบอบอวล ขณะที่ [ROOT.Char.Custom('KnightCulturePluralNoTooltip')|l] สองคนของข้ากำลังประลองมวยปล้ำกัน ค่ายโห่ร้องด้วยความตื่นเต้น ขณะที่ผู้ชนะที่ไม่มีใครเทียบได้ในวันนี้โยนคู่ต่อสู้ของ [ROOT.Char.Custom('GetMartialHerHis')] ลงกับพื้น\n\nข้าชะเง้อมองผ่านฝูงชน เพื่อค้นหาตัวตนของนักรบฝีมือดีผู้นี้ ด้วยความประหลาดใจ ข้าเห็น [warrior.GetFirstName] [ROOT.Char.Custom2('RelationToMeShort', warrior)] ของข้า! ข้าไม่เคยคาดคิดว่าจะได้เห็นความชำนาญและความกล้าหาญ เช่นนี้จาก [warrior.GetHerHim] และหลายคนก็คงไม่มองไปยัง [warrior.GetWomanMan] เลยด้วยซ้ำ!"
 mpo_events_ariana.0100.a: "นักสู้ เช่นนี้สมควรเป็นผู้นำ!"
 mpo_events_ariana.0100.b: "[warrior.GetFirstNameNoTooltip] อาจเข้าร่วมรบกับเรา"
 mpo_events_ariana.0100.c: "บางที [warrior.GetSheHe] อาจจะไม่ใช่ [warrior.GetWomanMan] เพียงคนเดียวที่มีทักษะ เช่นนี้"
 mpo_events_ariana.0100.d: "น่าประทับใจ แต่ [warrior.GetSheHe] ควรจะทำหน้าที่ของ [warrior.GetHerHis] ต่อไป"
 mpo_diverse_warriors_modifier: "นักรบนานัปการ"
 mpo_diverse_warriors_modifier_desc: "ตัวละครนี้ได้แสดงให้เห็นว่านักรบนั้นมีอยู่ทุกรูปแบบ\nค่าใช้จ่ายในการปฏิรูป [martial_custom|E]: #p -50%#!"
 mpo_diverse_warriors_modifier_value_desc: "[GetModifier('mpo_diverse_warriors_modifier').GetNameWithTooltip]"

 mpo_events_ariana.0110.t: "ผืนดินที่ไม่ภักดี"
 mpo_events_ariana.0110.desc: ""ท่าน [ROOT.Char.GetTitleAsNameNoTooltip] ข้าได้ยินเสียงกระซิบจากวิญญาณ" [astrologer.GetFirstName] โหรของข้ากล่าว "[ROOT.Char.GetFaith.HighGodNameSheHe|U] เตือนถึงภยันตรายที่รออยู่ เว้น แต่ท่านจะให้ญาติของท่านอยู่ใน [current_capital.GetNameNoTier]"\n\n"
 mpo_events_ariana.0110.desc_fertility: ""เนื่องจากฝูงสัตว์ของท่านไม่สามารถเล็มหญ้าที่นี่ได้ การรับประทานอาหารในสถานที่แห่งนี้จึงเป็นลางร้าย"
 mpo_events_ariana.0110.desc_opinion: ""ผู้คนที่นี่ไม่ได้ชื่นชอบท่านเหมือนเมื่อก่อน ความอาฆาตของพวกเขากำลังเป็นพิษต่อแผ่นดิน"
 mpo_events_ariana.0110.desc_ending: "ข้าขอแนะนำให้ย้ายเยิร์ตของท่านไปยัง [new_capital.GetNameNoTier] และท่านอาจจะพบความเจริญรุ่งเรืองที่นั่น""
 mpo_events_ariana.0110.a: "[ROOT.Char.GetFaith.HighGodName] ไม่เคยโป้ปด เราต้องย้าย"
 mpo_events_ariana.0110.b: "ไร้สาระ [current_capital.GetNameNoTierNoTooltip] คือบ้านของข้า"
 mpo_events_ariana.0110.c_cynical: "[ROOT.Char.GetFaith.HighGodName] มิใช่ [ROOT.Char.GetTitleAsNameNoTooltip] ข้าต่างหากที่เป็น!"
 mpo_events_ariana.0110.c: "พอได้แล้วสำหรับเจ้า [astrologer.GetFirstNameNoTooltip]"

 mpo_home_sweet_home_modifier: "เยิร์ตแสนสุข"
 mpo_home_sweet_home_modifier_desc: "ตัวละครนี้ผูกพันกับเยิร์ตและที่ตั้งของมันมาก"

 mpo_events_ariana.0111.t: "บ้านใหม่"
 mpo_events_ariana.0111.desc: "เป็นเวลานานแล้วที่ข้าย้ายจาก [current_capital.GetNameNoTier] มายัง [new_capital.GetNameNoTier] ตามคำเตือนของ [astrologer.GetFirstName] โหรของข้า\n\nดุจดังพรจาก [ROOT.Char.GetFaith.FertilityGodName] แผ่นดินอุดมสมบูรณ์ขึ้น และผู้คนของข้าก็พึงพอใจ"
