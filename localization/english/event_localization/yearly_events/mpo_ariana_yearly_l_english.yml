 criminal_family_dynasty_modifier_desc: "ราชวงศ์นี้ต้องมัวหมองจากการกระทำของสมาชิกคนหนึ่ง"

 mpo_events_ariana.0060.t: "รังสมบัติ"
 mpo_events_ariana.0060.desc: "[appropriate_child.GetName] [ROOT.Char.Custom2('RelationToMeShort', appropriate_child)] ของข้ารีบวิ่งมาหาข้าอย่างตื่นเต้น และก่อนที่ข้าจะทันได้ถามว่าอะไร ทำให้ [appropriate_child.GetHerHim] ตื่นเต้นถึงเพียงนั้น [appropriate_child.GetSheHe] ก็วางวัตถุเล็กๆ ส่องประกายชิ้นหนึ่งไว้ในมือข้า "ดูสิว่าข้าเจออะไร!" [appropriate_child.GetSheHe] อุทาน "มันตกลงมาจากรังอินทรี และข้าคิดว่ามันเป็นสมบัติ!" \n\nข้าตรวจสอบวัตถุนั้น และมันก็เป็นของกระจุกกระจิกสีทองเล็กๆ ชิ้นหนึ่งจริง มันไม่ได้มีค่ามากนัก แต่เห็นได้ชัดว่า [appropriate_child.GetSheHe] ภูมิใจในตัวเองมาก\n\n"ท่านอยากให้ข้าพาไปที่รังหรือไม่?" [appropriate_child.GetSheHe] ถาม "อาจจะมีอีกก็ได้""
 mpo_events_ariana.0060.a: "ข้ามั่นใจว่าข้าปีนขึ้นไปได้"
 mpo_events_ariana.0060.a_tt: "ท่านพยายามปีนขึ้นไปที่รังเพื่อค้นหาสมบัติเพิ่มเติม"
 mpo_events_ariana.0060.success: "ท่านไปถึงรังได้สำเร็จ"
 mpo_events_ariana.0060.success_tt: "ท่านพบขุมทรัพย์อยู่ข้างใน"
