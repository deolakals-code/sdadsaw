 mpo_events_ariana.0040.title_feast: "งานเลี้ยงที่น่าจดจำ"
 mpo_events_ariana.0040.title_wedding: "งานวิวาห์สวมหน้ากาก"
 mpo_events_ariana.0040.title_camp_party: "หลังเต็นท์"
 mpo_events_ariana.0040.desc_wedding_feast: "ห้องโถงสลัว แต่อากาศอบอวลไปด้วยเสียงหัวเราะและกลิ่น [ROOT.Char.Custom('GetExpensiveMeal')] ส่วนต่อไปของการเฉลิมฉลองคือแขกและเจ้าภาพต่างซ่อนตัว โดยมีปริศนาและความตื่นเต้นเป็นสำคัญ ข้าสวมหน้ากากอย่างระมัดระวัง ปิดบังตัวเองให้มิดชิด แล้วเข้าร่วมกับแขกคนอื่นๆ ในการเต้นรำและรื่นเริง ขณะที่งานเฉลิมฉลองดำเนินต่อไป ข้าพบว่าตัวเองถูกดึงดูดไปยังบุคคลลึกลับในหมู่ไพ่ [masked_guest.GetSheHe|U] สวมหน้ากากอันประณีตเป็นรูป [ROOT.Char.Custom('GetRandomRegionalBird')] [masked_guest.GetSheHe|U] กวักมือเรียกข้า และข้าก็มิอาจต้านทานแรงดึงดูดนั้นได้\n\nไม่นานนัก บทสนทนาของเราก็เร่าร้อนยิ่งขึ้น และข้าก็อดที่จะรู้สึกถึงความผูกพันที่ลึกซึ้งกว่าหน้ากากไม่ได้ [masked_guest.GetSheHe|U] ดึงข้าเข้าสู่อ้อมกอดอันอบอุ่น และบอกเป็นนัยให้เราย้ายไปยังที่ส่วนตัวยิ่งขึ้น"
 mpo_events_ariana.0040.desc_camp_party: "ค่ายมีชีวิตชีวาด้วยเสียงดนตรีและเสียงหัวเราะ และ [talker.GetName] ก็เสนอให้เราเล่นซ่อนหา ข้าแทบจะระเบิดหัวเราะออกมากับความคิดนั้น แต่ก็ตระหนักได้ว่า [talker.GetSheHe] จริงจัง ไม่นานนัก ข้าก็พบว่าตัวเองซ่อนอยู่หลังเต็นท์ เมื่อมีเสียงฝีเท้าใกล้เข้ามา ข้าก็วิ่งออกจากที่ซ่อน ลึกเข้าไปในป่า บางทีความมึนเมาของข้าอาจจะครอบงำข้า แต่ข้าพบว่าตัวเองหลงอยู่ในป่า และค่ำคืนก็มืดมิด ไม่นานนัก ข้าก็ชนเข้ากับใครบางคน และได้ยินเสียงถอนหายใจอย่างโล่งอก "โอ้ ข้าคิดว่าข้าหลงอยู่คนเดียวเสียอีก" [masked_guest.GetSheHe] หอบ "เราควรจะอยู่ด้วยกัน ท่านไม่คิด เช่นนั้นหรือ?"\n\nหลังจากเดินเตร็ดเตร่อยู่ครู่หนึ่ง เราพบว่าตัวเองกำลังสนทนากันในเรื่องที่ลึกซึ้งกว่ามารยาททั่วไป มีบางอย่างดึงดูดข้าไปยัง [masked_guest.Custom('WomanManGirlBoy')] ผู้นี้ แม้ใบหน้าของ [masked_guest.GetHerHis] จะถูกบดบังด้วยความมืดก็ตาม [masked_guest.GetSheHe|U] ดึงข้าเข้ามาใกล้ และเสนอให้เราสานต่อการผจญภัยของเราเมื่อกลับถึงค่าย"
 mpo_events_ariana.0040.a: "ข้ารู้สึกอยากผจญภัย..."
 mpo_events_ariana.0040.a_tt: "ท่านตอบรับคำเชิญของ [masked_guest.GetHerHis]"
 mpo_events_ariana.0040.b: "ข้าขอผ่านครั้งนี้"

 mpo_events_ariana.0041.title: "ไร้สิ่งปิดบัง"
 mpo_events_ariana.0041.desc_wedding_feast: "[masked_guest.Custom('WomanManGirlBoy')] และข้าลอบออกจากงานเลี้ยงอย่างเงียบเชียบ และ [masked_guest.GetSheHe] ก็โยนหน้ากากของ [masked_guest.GetHerHim] ลงพื้น แสงจันทร์สาดส่องผ่านหน้าต่าง อาบไล้ใบหน้าของ [masked_guest.GetHerHis] อย่างนุ่มนวล"
 mpo_events_ariana.0041.desc_camp_party: "[masked_guest.Custom('WomanManGirlBoy')] และข้าเดินทางกลับค่าย ดูเหมือนว่าคนที่เหลือจะพักผ่อนกันหมดแล้ว กองไฟมอดลง เพราะเราไม่อยู่ และเราก็พบว่าตัวเองอยู่ในความมืดอีกครั้ง ข้าหยิบเชื้อไฟโยนเข้าไปในกองไฟ และเปลวไฟก็ส่องสว่างใบหน้าของ [masked_guest.GetHerHis]"
 mpo_events_ariana.0041.desc_middle: "\n\nสิ่งที่เคยเบิกบานและหวานอมขมกลืนได้ถูกบดขยี้ด้วยความตึงเครียด เมื่อข้าตระหนักได้ว่าผู้ที่ยืนอยู่ตรงหน้าข้าคือ"
 mpo_events_ariana.0041.desc_rival: "ตัวหายนะของข้า [masked_guest.GetName]!"
 mpo_events_ariana.0041.desc_family: "ญาติสนิทของข้าเอง [masked_guest.GetName]..."
 mpo_events_ariana.0041.desc_family_spouse: "คู่ครองของญาติข้า [masked_guest.GetName]..."
 mpo_events_ariana.0041.desc_rival_spouse: "คู่ครองของ [masked_guest_spouse.GetName] ศัตรูของข้า [masked_guest.GetName]!"
 mpo_events_ariana.0041.desc_outro: "แม้ [masked_guest.GetSheHe] ดูเหมือนจะประหลาดใจไม่น้อยไปกว่าข้า แต่ [masked_guest.GetSheHe] ก็กลับคืนสู่ความสงบ [masked_guest.GetHerHis] ได้อย่างรวดเร็ว [masked_guest.GetSheHe|U] ยิ้มมุมปาก แล้วกระซิบว่า, "ข้ารอคอยช่วงเวลานี้มานานแล้ว [ROOT.Char.GetFirstNameNoTooltip]""
 mpo_events_ariana.0041.desc_family_outro: "การได้ยินถ้อยคำเหล่านั้นมาจาก [ROOT.Char.Custom2('RelationToMeShort', masked_guest)] ของข้าเอง...."
 mpo_events_ariana.0041.a_rival: "เป็นเกมที่อันตราย แต่ข้าจะเล่นด้วย"
 mpo_events_ariana.0041.a_family: "ไม่มีสิ่งใดผิดปกติกับการทำความรู้จักญาติของข้าให้ดีขึ้น"
 mpo_events_ariana.0041.a_rival_spouse: "หากเพียงเพื่อเย้ยหยัน [masked_guest_spouse.GetFirstName]..."
 mpo_events_ariana.0041.a: "ข้าตอบรับข้อเสนอของเจ้า..."
 mpo_events_ariana.0041.b_rival: "รวมเป็นหนึ่งด้วยความเกลียดชัง บัดนี้รวมเป็นหนึ่งด้วยหัวใจ!"
 mpo_events_ariana.0041.b_family: "สายสัมพันธ์ระหว่างเรามิอาจทำลายได้!"
 mpo_events_ariana.0041.b_rival_spouse: "ข้าจะเอาทุกสิ่งทุกอย่างไปจาก [masked_guest_spouse.GetFirstName]!"
