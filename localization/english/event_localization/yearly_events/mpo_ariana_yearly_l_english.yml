l_english: 
 mpo_events_ariana.0001.t: "การพบเห็นรังนก"
 mpo_events_ariana.0001.desc: "ระหว่างทางกลับค่าย ข้าพบเห็นรังนกเล็กๆ รังหนึ่ง แม้จะไม่เห็นตัวนกเลยก็ตาม มันทำจากกิ่งไม้และหญ้า และดูเหมือนจะอยู่ในสภาพดี\n\nเมื่อเข้าไปดูใกล้ๆ ก็พบลูกอินทรีสองตัวอยู่ข้างใน โตพอที่จะอยู่รอดได้โดยไม่มีแม่ของมันมาระยะหนึ่งแล้ว แต่ก็ยังเล็กเกินไปที่จะเดินทางไกลข้ามขอบฟ้าได้ โอกาสที่จะ"
 mpo_events_ariana.0001.desc_had_story: "มีอินทรีเป็นสหายอีกครั้งช่างเย้ายวนใจนัก แต่ข้าต้องระมัดระวัง เพราะข้ารู้ดีว่าสัตว์เหล่านี้เอาแน่เอานอนไม่ได้เพียงใด"
 mpo_events_ariana.0001.desc_has_eagle: "จับมันตัวหนึ่ง บางทีอาจเป็นของขวัญ ก็ปรากฏขึ้น"
 mpo_events_ariana.0001.desc_ending: "รับมันตัวหนึ่งมาเป็นสหายนั้นดีเกินกว่าจะปล่อยไป"
 mpo_events_ariana.0001.a: "อินทรีที่ดีมีค่าควรแก่การเดินทาง"
 mpo_events_ariana.0001.a_tt: "ท่านปีนภูเขาและพยายามจับลูกอินทรีด้วยกำลัง"
 mpo_events_ariana.0001.a_win: "ท่านจับลูกอินทรีได้สำเร็จ ไม่ว่าตัวเดียวหรือทั้งสองตัว"
 mpo_events_ariana.0001.a_win_desc: "ชะตากรรมของลูกอินทรี ไม่ว่าตัวเดียวหรือทั้งสองตัว อยู่ในมือของท่านแล้ว"
 mpo_events_ariana.0001.a_lose_ok: "ท่านจับลูกอินทรีไม่สำเร็จ แต่ท่านไม่ได้รับบาดเจ็บ"
 mpo_events_ariana.0001.a_lose_bad: "ท่านจับลูกอินทรีไม่สำเร็จ และพลัดตกจากภูเขาเล็กน้อย"
 mpo_events_ariana.0001.b: "หากมันถูกลิขิตมา พวกมันจะมาหาข้าเอง"
 mpo_events_ariana.0001.b_win_desc: "ลูกอินทรีตัวหนึ่ง หรือทั้งสองตัว บินมาหาท่าน"
 mpo_events_ariana.0001.c: "เป็นสัญญาณที่แน่นอน"

 mpo_daydreaming_birds_modifier: "ฝันกลางวันถึงปักษา"
 mpo_daydreaming_birds_modifier_desc: "ตัวละครนี้คุ้นเคยกับการมองเห็นสัตว์ปีกอันสง่างามเหล่านั้นเป็นอย่างดี\n[hunt_success_chance|E] ของ $hunt_type_falconry$: #P +5%#!"
 hunt_success_chance.mpo_daydreaming_birds_modifier: "[GetModifier('mpo_daydreaming_birds_modifier').GetNameWithTooltip]"

 mpo_events_ariana.0002.desc_intro: "ลูกอินทรีเริ่มกระสับกระส่าย การจากรังของพวกมันจะเป็นไปด้วยข้า หรือนักล่าอื่น\n\n"
 mpo_events_ariana.0002.desc_standard: "ตามรอยไปยังรัง การลงของข้าเป็นไปอย่างช้าๆ และระมัดระวัง ลูกอินทรีเหล่านี้ยังเล็กเกินไปที่จะบินได้ไกล แต่ก็ไม่เล็กเกินไปที่จะเป็นอันตราย\n\n"
 mpo_events_ariana.0002.desc_one_standard: "เท้าของข้าลื่นบนหญ้าบางส่วน แต่ข้าก็สามารถเกาะไว้ได้ ลูกอินทรีตัวหนึ่งสังเกตเห็นการดิ้นรนของข้า และเริ่มร้องเสียงแหลม ทำให้ตัวเองตกใจและบินหนีไป [ROOT.Char.Custom('CulturalCurse')|U]! แม้ข้าจะจับทั้งสองตัวไม่สำเร็จ แต่ได้มาตัวหนึ่งก็ยังดีกว่ากลับไปมือเปล่า"
 mpo_events_ariana.0002.desc_both_standard: "ฉวยพวกมันมาจากรัง ข้าสามารถมัดลูกอินทรีทั้งสองตัวได้สำเร็จ ใช้ผ้าคลุมตาพวกมันไว้ พวกมัน ทำให้ข้าหนักอึ้ง แต่ไม่มีนายพรานอินทรีในตำนานคนใดที่ปราศจากภาระของตน"
 mpo_events_ariana.0002.desc_lure: "ถือชิ้นเนื้อไว้ในมือ ข้าเรียกให้ลูกอินทรีมาหาข้า พวกมันร้องเสียงแหลมตอบ และข้าสามารถเห็นพวกมันสว่างไสวด้วยความอยากรู้ แม้จะอยู่ไกล\n\n"
 mpo_events_ariana.0002.desc_one_lure: "มีเพียงตัวเดียวที่มาหาข้า อีกตัวบางทีอาจจะชอบความปลอดภัยของรังมากกว่า ข้าอุ้มลูกอินทรีไว้ในอ้อมแขน และด้วยความอยากอาหารอันตะกละตะกลามของมัน มันก็เริ่มจัดการกับเหยื่อล่อของข้า"
 mpo_events_ariana.0002.desc_both_lure: "ข้าแบ่งเนื้อออกเป็นสองส่วน เสนอให้พวกมัน แต่ละตัว พวกมันร้องเสียงแหลมพร้อมกัน และข้าก็อดที่จะยิ้มให้กับภาพนั้นไม่ได้"
 mpo_events_ariana.0002.a: "มันงดงาม และมันเป็นของข้า"
 mpo_events_ariana.0002.b: "[eagle_first_recipient.GetFirstNameNoTooltip] อาจจะชื่นชมสัตว์ เช่นนี้"
 mpo_events_ariana.0002.c: "ข้าคิดว่า [eagle_second_recipient.GetFirstNameNoTooltip] น่าจะอยากได้มันมากกว่า"
 mpo_events_ariana.0002.b_two: "ข้าจะเก็บไว้ตัวหนึ่ง และให้อีกตัวแก่ [eagle_first_recipient.GetFirstNameNoTooltip]"
 mpo_events_ariana.0002.c_two: "ตัวหนึ่งเป็นของข้า และบางที [eagle_second_recipient.GetFirstNameNoTooltip] อาจจะต้องการอีกตัว?"
 mpo_events_ariana.0002.d: "[eagle_first_recipient.GetFirstNameNoTooltip] และ [eagle_second_recipient.GetFirstNameNoTooltip] ต่างก็สมควรได้รับของขวัญ เช่นนี้"
 mpo_events_ariana.0002.e: "ตัวหนึ่งจะเป็นสหายของข้า และอีกตัวจะนำเงินตราเข้ามา"
 mpo_events_ariana.0002.e_sell_first: "[eagle_first_recipient.GetFirstNameNoTooltip] จะชื่นชมตัวหนึ่ง และกระเป๋าของข้าจะชื่นชมอีกตัว"
 mpo_events_ariana.0002.e_sell_second: "ตัวหนึ่งสำหรับตลาด และอีกตัวสำหรับ [eagle_second_recipient.GetFirstNameNoTooltip]"
 mpo_events_ariana.0002.e_tt: "ท่านแลกเปลี่ยนลูกอินทรีอีกตัวไป"
 mpo_events_ariana.0002.f_tt: "ท่านแลกเปลี่ยนลูกอินทรีไป"
 mpo_events_ariana.0002.f_tt_two: "ท่านแลกเปลี่ยนลูกอินทรีทั้งสองตัวไป"
 mpo_events_ariana.0002.f_one: "มันจะได้ราคาดี"
 mpo_events_ariana.0002.f_two: "พวกมันจะได้ราคาดี"
 
 mpo_events_ariana.0010.t: "ไฟในใจ"
 mpo_events_ariana.0010.desc: ""[converting_heir.Custom2('RelationToMe', ROOT.Char)|U]" [converting_heir.GetName] [ROOT.Char.Custom2('RelationToMeShort', converting_heir)] ของข้ากระซิบพลางกวักมือเรียกข้า "[new_faith.HighGodName|U] ได้ทรงแสดงหนทางให้ข้าแล้ว" [converting_heir.GetSheHe] กล่าวต่อไป \n\n"และบัดนี้ข้าปฏิบัติตาม [new_faith.GetName] ข้ารู้สึก เช่นนี้มานานแล้ว และข้ามิอาจปล่อยให้มันหมักหมมต่อไปได้ ข้ารู้ว่าท่านมีความสงสัย แต่ข้าขอร้องให้ท่านเข้าร่วมกับข้าและเหล่า [new_faith.GetAdherentNamePluralNoTooltip] อื่นๆ อีกมากมายใน [ROOT.Char.GetPrimaryTitle.GetTierAsName] ข้าจะช่วยท่านในการเรียนรู้ที่จะดำเนินชีวิตเยี่ยง [new_faith.GetAdherentNameNoTooltip] ที่แท้จริง และเราจะไปถึง [new_faith.PositiveAfterLife] ด้วยกัน"\n\n[converting_heir.GetSheHe|U] จ้องมองข้าด้วยความแรงกล้าในดวงตาของ [converting_heir.GetHerHis] และกุมมือข้าไว้ รอคอยคำตอบของข้า"
 mpo_events_ariana.0010.desc_zealous: "[converting_heir.GetFirstNameNoTooltip] เยาะเย้ยข้าหรือ? [converting_heir.GetSheHe] จะเชื่อได้อย่างไรว่าข้าจะเป็น [new_faith.GetAdherentNameNoTooltip] ได้?!"
 mpo_events_ariana.0010.a: "เจ้าจะไม่โดดเดี่ยว [converting_heir.GetFirstNameNoTooltip]"
 mpo_events_ariana.0010.a_zealous: "บางทีข้าอาจจะใจร้ายเกินไป และ [converting_heir.GetSheHe] ก็พูดถูก"
 mpo_events_ariana.0010.b: "ในทุกสิ่งยกเว้นชื่อ ข้าคือ [old_faith.GetAdherentNameNoTooltip]"
 mpo_events_ariana.0010.b_zealous: "ครั้งนี้ข้าจะตามใจเจ้า [converting_heir.GetFirstNameNoTooltip]"
 mpo_events_ariana.0010.b.tt: "ท่านเปลี่ยนไปนับถือ [new_faith.GetName] แต่ยังคงปฏิบัติศาสนกิจ [old_faith.GetName] อย่างลับๆ"
 mpo_events_ariana.0010.c: "ข้าขออภัย แต่ข้าทำ เช่นนี้ไม่ได้"
 mpo_events_ariana.0010.c_cynical: "ศาสนาเป็นเรื่องส่วนตัว [converting_heir.GetFirstNameNoTooltip]"
 mpo_events_ariana.0010.c_zealous: "ข้ามิอาจละทิ้ง [old_faith.GetName] ได้เลย!"
 mpo_events_ariana.0010.d: "ไม่มี [new_faith.GetAdherentNameNoTooltip|U] ใดจะได้เห็น [old_faith.PositiveAfterLife|U]"
 mpo_events_ariana.0010.d_tt: "ท่านพยายามโน้มน้าวให้ [converting_heir.GetNameNoTooltip] ยังคงนับถือ [old_faith.GetAdjective]"
 mpo_events_ariana.0010.d_success: "[converting_heir.GetFirstNameNoTooltip] พิจารณาเรื่องการเปลี่ยนศาสนาใหม่"
 mpo_events_ariana.0010.d_failure: "[converting_heir.GetFirstNameNoTooltip] ยังคงแน่วแน่ที่จะเป็น [new_faith.GetAdjectiveNoTooltip]"

 mpo_events_ariana.0020.t: "ไม่น่าไว้วางใจ"
 mpo_events_ariana.0020.desc_intro: "[worried_spouse.GetName] พรวดพราดเข้ามาในห้องของข้าและโพล่งออกมาว่า "ท่านทราบหรือไม่ว่า [sus_councillor.GetName] เป็นชาว [councillor_culture.GetName]?"\n\nก่อนที่ข้าจะทันได้ตอบอะไร [worried_spouse.GetSheHe] ก็พูดแทรกขึ้นมาว่า "ข้ามิอาจหยั่งถึงได้เลย"
 mpo_events_ariana.0020.desc_marshal: "ว่ากองทัพใดๆ ของข้าจะถูกนำโดยชาว [councillor_culture.GetNameNoTooltip] เพราะข้าอยากจะอยู่ฝั่งตรงข้ามของสนามรบมากกว่า และถึงกระนั้น [sus_councillor.GetSheHe] ก็ยังเดินเพ่นพ่านอยู่ในลานฝึกของเราหรือ?""
 mpo_events_ariana.0020.desc_spymaster: "การอนุญาตให้ชาว [councillor_culture.GetNameNoTooltip] เจ้าเล่ห์คนใดเข้ามาอยู่ในวงในของข้า นับประสาอะไรกับการรู้เห็นการจารกรรมของเรา ข้าขอเชื่อใจงูเห่าเสียยังดีกว่า [sus_councillor.GetHerHim]""
 mpo_events_ariana.0020.desc_end: "แม้ว่าพฤติกรรมตลกขบขันของ [worried_spouse.GetFirstNamePossessiveNoTooltip] จะดูค่อนข้างเกินควร, แต่ก็เป็นที่ทราบกันว่าชาว [councillor_culture.GetCollectiveNounNoTooltip] บางคน [sus_councillor.Custom('mpo_yearly_ethos')]\n\n\"ได้โปรดเถิด...\" [worried_spouse.GetSheHe] คร่ำครวญ, \"ข้าขอร้องท่าน, อย่าอนุญาตให้ [sus_councillor.GetHerHim] ทำ [sus_councillor.GetHerHis] [sus_councillor.Custom2('InsultBehavior', SCOPE.sC('worried_spouse'))] ต่อไปในโถงของเราเลย มันบอกไม่ได้ว่า [sus_councillor.GetSheHe] อาจจะทำอะไรลงไป\""
 mpo_yearly_bellicose: "มักจะบุ่มบ่ามเกินไป เพื่อการแก้แค้นที่อาจจะไม่มีอยู่จริง"
 mpo_yearly_stoic: "จะไม่หลั่งน้ำตาแม้ แต่หยดเดียว แม้ญาติสนิทของตนจะสิ้นใจ"
 mpo_yearly_bureaucratic: "ใส่ใจม้วนกระดาษหรือหนังสือมากกว่าชีวิตของเพื่อนร่วมเผ่าพันธุ์ [sus_councillor.GetCulture.GetCollectiveNounNoTooltip] ของตนเสียอีก"
 mpo_yearly_spiritual: "อาจกระทำการโดยไม่สนใจผู้อื่น ตราบใดที่มันเป็นไปในนามของ [sus_councillor.GetFaith.HighGodName]"
 mpo_yearly_courtly: "มีแนวโน้มที่จะเอาหัวไปซุกอยู่กับก้นคนอื่นมากกว่าที่จะอยู่ในทุ่งนาและภูเขาเพื่อความอยู่รอด"
 mpo_yearly_egalitarian: "ไม่มีข้อกังขาใดๆ เกี่ยวกับการยอมรับคนนอก และน่าจะ ทำให้วัฒนธรรมของตนถูกลบเลือนไปภายในหนึ่งพันปี"
 mpo_yearly_communal: "ดำเนินงานภายในจิตสำนึกร่วม และการที่พวกเขาไม่สามารถดำเนินการเป็นรายบุคคลได้นั้นน่าเป็นห่วง"
 mpo_events_ariana.0020.a: "เจ้าพูดถูก [worried_spouse.GetFirstNameNoTooltip] [sus_councillor.GetSheHe|U] จะจากไปภายในวันพรุ่งนี้!"
 mpo_events_ariana.0020.a_tt: "[vassals|E] ชาว [councillor_culture.GetName] ทั้งหมด:\n$EFFECT_LIST_BULLET$จะสูญเสีย #n 10#! [opinion|E] ที่มีต่อ #V ท่าน#!"
 mpo_events_ariana.0020.b: "ข้าคิดว่าข้าควรจะระมัดระวังชาว [councillor_culture.GetCollectiveNounNoTooltip] เหล่านี้ให้มากขึ้น"
 mpo_events_ariana.0020.c: "ไม่มีสิ่งใดผิดปกติเกี่ยวกับ [sus_councillor.GetHerHim] หรือชาว [councillor_culture.GetNameNoTooltip] คนใด"
 mpo_events_ariana.0020.c_paranoid: "ข้าจะไม่หวั่นไหวไปกับความหวาดระแวงของเจ้า"
 mpo_events_ariana.0020.c_tt: "[vassals|E] ชาว [councillor_culture.GetName] ทั้งหมด:\n$EFFECT_LIST_BULLET$จะได้รับ #p 10#! [opinion|E] ที่มีต่อ #V ท่าน#!"
 cultural_suspicion_modifier: "ความหวาดระแวงทางวัฒนธรรม"
 cultural_suspicion_modifier_desc: "ตัวละครนี้ไม่ค่อยชอบชาวต่างชาติในอาณาจักรของตนเท่าใดนัก"

 mpo_events_ariana.0030.t: "เครื่องดื่มต้องห้าม"
 mpo_events_ariana.0030.desc: ""ชาม [Glossary( 'คูมิส', 'KUMIS_GLOSS')] ในงานเลี้ยงของเราแห้งเหือดไปมากแล้ว ท่าน [ROOT.Char.GetTitleAsNameNoTooltip] ของข้า..." [spymaster.GetName] บ่น "แต่อย่างน้อยข้าก็รู้ว่าใครเป็นผู้รับผิดชอบต่อความแห้งแล้งนี้" [spymaster.GetSheHe|U] ชี้ไปที่ [bartender.GetName] ผู้ ซึ่งกำลังแลกเปลี่ยนถ้วยนมม้าหมักกับชนชั้นต่ำอีกคน\n\n"แน่นอนว่าท่านจะไม่ปล่อยให้แขกของเราขาดเครื่องดื่มใช่หรือไม่? อย่างไรก็ตาม พวกมันถูกเตรียมไว้เป็นพิเศษสำหรับท่านลอร์ดและท่านหญิงผู้ยิ่งใหญ่แห่ง [ROOT.Char.GetPrimaryTitle.GetNameNoTier]" [spymaster.GetSheHe] ถาม พร้อมรอยยิ้มเจ้าเล่ห์บนใบหน้าของ [spymaster.GetHerHis]"
 mpo_events_ariana.0030.jail: "มาดูกันว่า [bartender.GetSheHe] จะทำอะไรได้บ้างจากในห้องขัง"
