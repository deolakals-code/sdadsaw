 mpo_events_ariana.0070.desc: "ข้าไปถึงรัง และพบลูกอินทรีตัวหนึ่งอยู่ข้างใน พร้อมกับย่ามใบเล็ก "อา นั่นคือที่มาของสมบัติสินะ" [appropriate_child.GetFirstName] กระซิบ [appropriate_child.GetFirstNameNoTooltip] มองมาที่ข้าด้วยดวงตาเบิกกว้าง และข้าก็เห็นความคิดในใจของ [appropriate_child.GetHerHis]\n\n"แม่อินทรีอยู่ที่ไหน?" [appropriate_child.GetSheHe] ถาม "เราควรจะไปก่อนที่มันจะกลับมา" ข้าพยักหน้าเห็นด้วย แต่ก่อนที่เราจะจากไป ข้าจะดูว่าข้าสามารถนำอะไรติดตัวไปได้บ้าง"
 mpo_events_ariana.0070.a: "ข้าจะเอาสมบัติที่ข้ามาตามหา"
