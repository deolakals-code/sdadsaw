 mpo_events_ariana.0041.c_family_spouse: "ข้าทำ เช่นนี้กับ [masked_guest_spouse.GetFirstName] ไม่ได้!"
 mpo_events_ariana.0041.c: "ข้าต้องปฏิเสธ..."
 mpo_events_ariana.0041.c_tt: "ท่านปฏิเสธการทอดไมตรีของ [masked_guest.GetFirstNamePossessiveNoTooltip]"
