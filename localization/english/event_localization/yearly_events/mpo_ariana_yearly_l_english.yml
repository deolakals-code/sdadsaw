 mpo_events_ariana.0050.t: "ถูกตีตรา"
 mpo_events_ariana.0050.desc: "เสียงกระซิบและข้อกล่าวหาเกี่ยวกับ [criminal_family.GetName] [ROOT.Char.Custom2('RelationToMeShort', criminal_family)] ของข้าเริ่มน่าหนักใจยิ่งขึ้น มีการพูดถึงการมีส่วนร่วมของ [criminal_family.GetHerHis] ในเหตุการณ์โจรกรรมต่อเนื่องเมื่อเร็วๆ นี้ และผู้คนเริ่มหวาดกลัวความปลอดภัยของตน ไม่ว่า [criminal_family.GetSheHe] จะถูกจับได้คาหนังคาเขา หรือเพียงแค่เผชิญกับความเสี่ยงที่จะถูกขับไล่ออกจากสังคม เนื่องจากธรรมชาติอัน [criminal_family.Custom('mpo_ariana_0050_description')] ของ [criminal_family.GetHerHis] ผู้คนต่างเรียกร้องให้ [criminal_family.GetHerHis] ถูกลงโทษ\n\nหากเป็น เช่นนั้น [criminal_family.GetFirstNameNoTooltip] จะถูกริบดินแดน บรรดาศักดิ์ และศักดิ์ศรีทั้งหมด เหลือไว้เพียงความอัปยศอดสู สร้างเงาทะมึนให้แก่ตระกูล [ROOT.Char.GetDynasty.GetName] อย่างใหญ่หลวง"
 mpo_ariana_0050_scheming: "เจ้าเล่ห์เพทุบาย"
 mpo_ariana_0050_greedy: "ละโมบโลภมาก"
 mpo_events_ariana.0050.a: "ข้ามิอาจปล่อยให้ชื่อเสียงของตระกูลข้าต้องมัวหมองได้"
 mpo_events_ariana.0050.a_tt: "ท่านจ่ายเงินเพื่อล้างมลทินให้ [criminal_family.GetFirstNamePossessiveNoTooltip]"
 mpo_events_ariana.0050.b: "[criminal_family.GetSheHe|U] จะต้องเผชิญกับการลงโทษ มันเกินกว่าที่ข้าจะควบคุมได้"
 mpo_events_ariana.0050.b_broke: "ดูเหมือนว่าข้าจะไม่มีเงินทุนเพียงพอที่จะล้างมลทินให้ [criminal_family.GetHerHis]"
 mpo_events_ariana.0050.c: "ไร้สาระ ข้าสามารถปัดเป่าข่าวลือเหล่านี้ได้ด้วยตนเอง"
 mpo_events_ariana.0050.c_tt: "ท่านพยายามล้างมลทินให้ [criminal_family.GetFirstNamePossessiveNoTooltip]"
