l_english: 
 # Commision Legend Book
 ce1_decision_events.0001.t: "จดบันทึกไว้"
 ce1_decision_events.0001.desc: "[ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('chronicler'))] ของข้า [chronicler.GetFirstName] ทักทายข้าด้วยรอยยิ้มอันปลาบปลื้ม โคมไฟอ่านหนังสือของ [chronicler.GetHerHis|U] น้ำมันเกือบจะหมด\n\n"[ROOT.Char.Custom('FormOfAddressForLiege')|U]" [chronicler.GetSheHe] เอ่ย ขณะที่ [chronicler.GetSheHe] วางหนังสือที่ประดับลวดลายงดงามลง "พวกเรามั่นใจว่าได้ติดตามทุกสิ่งละอันพันละน้อย ทุกการกระทำ ทุกการรบ ทุกการผจญภัย และทุกเรื่องรักใคร่"\n\n"ทั้งหมดนั้น" [chronicler.GetSheHe] กล่าวต่อ "ถูกบันทึกไว้ให้ชนรุ่นหลัง""
 ce1_decision_events.0001.a: "น่ายินดียิ่ง!"
 legend_book: "[ROOT.Var('finished_legend_var').Legend.GetName]"
 legend_book_desc: "#EMP [ROOT.Var('finished_legend_var').Legend.GetChapterDescriptionByName('opening')]#!\n\n#EMP ตำนานของ [ROOT.Var('finished_legend_var').Legend.GetProtagonist.GetTitledFirstNamePossessiveNoTooltip|U] สิ้นสุดลงด้วยการผจญภัยอันน่าอัศจรรย์: วีรกรรมอันยิ่งใหญ่ทางการทหารของ [ROOT.Var('finished_legend_var').Legend.GetProtagonist.GetHerHis] นั้นยิ่งใหญ่เสียจนพระราชาทั้งปวงต่างพิศวง และขุนนางรวมถึงสามัญชนจำนวนมากต่างเดินทางมาพบ [ROOT.Var('finished_legend_var').Legend.GetProtagonist.GetHerHis], ด้วยปรารถนาที่จะเห็นตำนานตัวเป็นๆ#!\n\n#EMP [ROOT.Var('finished_legend_var').Legend.GetChapterDescriptionByName('conclusion')]#!"
