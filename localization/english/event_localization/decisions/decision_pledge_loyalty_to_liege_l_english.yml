l_english: 
 # Decision Menu Localization
 pledge_loyalty_to_liege_decision: "ถวายสัตย์ปฏิญาณต่อ [GetPlayer.GetLiege.GetTitleTierName|U]"
 pledge_loyalty_to_liege_decision_desc: "ข้าจำต้องถวายสัตย์ปฏิญาณอย่างเป็นทางการและเปิดเผยต่อ [GetPlayer.GetLiege.GetTitleTierName|U] ณ ราชสำนักของ [ROOT.Char.GetLiege.GetHerHis] การละเลยที่จะกระทำ เช่นนั้นจะถูกมองว่าเป็นการสบประมาทและท้าทายต่อการปกครองของ [ROOT.Char.GetLiege.GetHerHis]"
 pledge_loyalty_to_liege_decision_tooltip: "#V ถวายสัตย์ปฏิญาณ#! อย่างเป็นทางการ ต่อ [liege|E] ของท่าน ณ [court|E] ของพวกเขา"
 pledge_loyalty_to_liege_decision_effects: "ท่านเดินทางไปยังราชสำนักของ [THIS.Char.GetLiege.GetTitledFirstNamePossessive] เพื่อหมอบกราบอย่างเป็นทางการต่อหน้าพวกเขา"
 pledge_loyalty_to_liege_decision_confirm: "$pledge_loyalty_to_liege_decision$"
 pledge_loyalty_to_liege_decision_second_tooltip: "$DESC$\n$pledge_loyalty_to_liege_grace_tt$"
 pledge_loyalty_to_liege_grace_tt: "#weak ท่านสามารถ #V ถวายสัตย์ปฏิญาณ#! ต่อเจ้าเหนือหัวคนเดิมได้เพียงครั้งเดียว#!"
 pledge_loyalty_to_liege_gift_warning_effect: "#weak ของกำนัลจะเพิ่มรางวัลสำหรับการ #V ถวายสัตย์ปฏิญาณ#! ของท่าน#!\n$pledge_loyalty_to_liege_grace_tt$"
 pledge_loyalty_to_liege_grace_valid_tt: "ยังมิได้ถวายสัตย์ปฏิญาณต่อ [THIS.Char.GetLiege.GetTitledFirstName] มาก่อน"
 pledge_loyalty_to_liege_DECISION_NEXT_STEP_BUTTON: "เลือกของกำนัล"
 pledge_loyalty_to_liege_available_adult_tt: "เป็นผู้ใหญ่ที่ว่าง"
 pledge_loyalty_to_liege_available_liege_tt: "[ROOT.Char.GetLiege.GetTitledFirstName] เป็นผู้ใหญ่ที่ว่าง"
 # Submission
 pledge_loyalty_to_liege_decision_option_submission: "แสดงการยอมจำนน\n#low ไม่มอบสิ่งใด#!"
 pledge_loyalty_to_liege_submission_desc: "[ROOT.Char.GetLiege.GetTitledFirstName] จะได้รับเพียงการแสดงการยอมจำนนของท่าน"
 pledge_loyalty_to_liege_submission_tooltip: "$pledge_loyalty_to_liege_decision_second_tooltip$"
 # Gold
 pledge_loyalty_to_liege_decision_option_gold: "...และมอบของกำนัล\n#low มอบ [gold|E]#!"
 pledge_loyalty_to_liege_gold_desc: "[ROOT.Char.GetLiege.GetTitledFirstName] จะได้รับของกำนัลเป็น [gold|E] จากท่าน"
 pledge_loyalty_to_liege_gold_tooltip: "$pledge_loyalty_to_liege_decision_second_tooltip$"
 pledge_loyalty_to_liege_decision_effects_gold: "[liege|E] ของท่านจะได้รับของกำนัลเป็น [gold|E] จากท่าน"
 pledge_loyalty_to_liege_gold_tt: "#X ท่านมี [gold|E] ไม่เพียงพอ#!"
 # Hook
 pledge_loyalty_to_liege_decision_option_hook: "...และสัญญาว่าจะให้ความช่วยเหลือ\n#low มอบ [hook|E]#!"
 pledge_loyalty_to_liege_hook_desc: "[ROOT.Char.GetLiege.GetTitledFirstName] จะได้รับ [hook|E] แบบอ่อนแอ เหนือตัวท่าน"
 pledge_loyalty_to_liege_hook_tooltip: "$pledge_loyalty_to_liege_decision_second_tooltip$"
 pledge_loyalty_to_liege_decision_effects_hook: "[liege|E] ของท่านจะได้รับ [hook|E] แบบรุนแรง เหนือตัวท่าน"
 pledge_loyalty_to_liege_hook_tt: "#X [liege|E] ของท่านมี [hook|E] เหนือตัวท่านอยู่แล้ว#!"
 # Contract
 pledge_loyalty_to_liege_decision_option_contract: "...และเพิ่มภาระผูกพัน\n#low มอบภาระผูกพันตาม [vassal_contract|E]#!"
 pledge_loyalty_to_liege_contract_desc: "[ROOT.Char.GetLiege.GetTitledFirstName] จะได้รับภาษีหรือไพร่พลมากขึ้นจาก [vassal_contract|E]"
 pledge_loyalty_to_liege_contract_tooltip: "$pledge_loyalty_to_liege_decision_second_tooltip$"
 pledge_loyalty_to_liege_decision_effects_contract_gold: "[liege|E] ของท่านจะได้รับ [taxes|E] มากขึ้นจากท่าน"
 pledge_loyalty_to_liege_decision_effects_contract_levies: "[liege|E] ของท่านจะได้รับ [levies|E] มากขึ้นจากท่าน"
 pledge_loyalty_to_liege_contract_modifiable_tt: "#X [vassal_contract|E] ของท่านเพิ่งถูกเปลี่ยนแปลงไปเมื่อไม่นานนี้#!"
 pledge_loyalty_to_liege_contract_increasable_tt: "#X [taxes|E] และ [levies|E] ของท่านไม่สามารถเพิ่มได้อีก#!"

 pledge_loyalty_to_liege_costs_refunded: "ค่าใช้จ่าย $pledge_loyalty_to_liege_decision$ ได้รับการคืนแล้ว"

 pledge_loyalty_to_liege_header: "ถวายสัตย์ปฏิญาณ:"

 # Activity Start: Liege decides whether or not to hear petition
 pledge_loyalty_to_liege.0001.opening: "[pledge_loyalty_to_liege_vassal.Custom2('AppropriateGreetingPositive', ROOT.Char )]"
 pledge_loyalty_to_liege.0001.desc: "ข้าได้เดินทางมาถึง [pledge_loyalty_to_liege_scope.GetCapitalLocation.GetTitle.GetNameNoTierNoTooltip] เพื่อถวายความเคารพต่อท่าน, โอ้ [pledge_loyalty_to_liege_scope.GetTitleAsNameNoTooltip] ผู้รุ่งโรจน์, เพื่อเป็นการแสดงความจงรักภักดีของข้า \n\n"
 pledge_loyalty_to_liege.0001.desc.submission: "ข้าหวังว่าเพียงคำสัตย์แห่งการยอมจำนนของข้า ก็เพียงพอที่จะเป็นหลักฐานแห่งเกียรติของข้าแล้ว"
 pledge_loyalty_to_liege.0001.desc.gold: "ข้านำของกำนัลอันล้ำค่ามาให้ท่าน อันคู่ควรต่อบารมีของท่าน เพื่อเป็นเครื่องหมายแห่งความปรารถนาดีและความภักดีของข้า"
 pledge_loyalty_to_liege.0001.desc.hook: "ท่านมีคำสัตย์ของข้าว่า ข้าจะกระทำทุกสิ่งที่ท่านปรารถนาจากข้า โอ้ [pledge_loyalty_to_liege_scope.GetLadyLord] ของข้า"
 pledge_loyalty_to_liege.0001.desc.contract: "เพื่อเป็นเครื่องหมายแห่งอำนาจปกครองของท่านและความจงรักภักดีของข้าที่มีต่อท่าน ข้าจะขอผูกพันตนด้วยภาระที่มากขึ้นในฐานะข้าหลวงของท่าน"
 pledge_loyalty_to_liege.0001.a: "มอบความช่วยเหลือตามธรรมเนียมเป็นการตอบแทน"
 pledge_loyalty_to_liege.0001.b: "ไม่มอบสิ่งใดตอบแทนแก่ [pledge_loyalty_to_liege_vassal.GetHerHim]"
 pledge_loyalty_to_liege.0001.c: "มอบของกำนัลตอบแทนที่หรูหรายิ่งกว่าของ [pledge_loyalty_to_liege_vassal.GetHerHis]"
 pledge_loyalty_to_liege.0001.c.insulted: "#EMP [pledge_loyalty_to_liege_vassal.GetShortUIName] จะถือว่านี่คือการสบประมาท!#!"
 pledge_loyalty_to_liege.0001.c.honored: "#EMP [pledge_loyalty_to_liege_vassal.GetShortUIName] จะถือว่าเป็นเกียรติอย่างยิ่ง#!"

 # Liege Event: Liege receives homage from vassal
 pledge_loyalty_to_liege.0101.t: "$pledge_loyalty_to_liege_header$ การคุกเข่า"
 pledge_loyalty_to_liege.0101.desc: "ข้ารออย่างอดทนบนบัลลังก์ของข้า เพื่อรอการมาถึงของ [pledge_loyalty_to_liege_vassal.GetTitledFirstName] ผู้ ซึ่งถูกประกาศนามและนำตัวมาอยู่เบื้องหน้าข้าในไม่ช้า \n\n"
 pledge_loyalty_to_liege.0101.desc.submission: "[pledge_loyalty_to_liege_vassal.GetSheHe|U] คุกเข่าลงด้วยความเคารพ โดยไม่มอบสิ่งใดนอกจากคำสัตย์ปฏิญาณของ [pledge_loyalty_to_liege_vassal.GetHerHis] ว่าจะรับใช้อย่างซื่อสัตย์ในฐานะข้าหลวงของ [pledge_loyalty_to_liege_scope.GetPrimaryTitle.GetTierAsNameNoTooltip].\n\n"
 pledge_loyalty_to_liege.0101.desc.gold: "[pledge_loyalty_to_liege_vassal.GetSheHe|U] คุกเข่าลงด้วยความเคารพ ขณะที่ผู้ติดตามนำของกำนัลของ [pledge_loyalty_to_liege_vassal.GetHerHis] อันเป็นเหรียญและวัตถุล้ำค่าออกมา คำสัตย์ปฏิญาณได้ถูกกล่าวขึ้น และเหล่าอาลักษณ์ได้บันทึกคำมั่นของ [pledge_loyalty_to_liege_vassal.GetHerHis] ที่จะรับใช้ [pledge_loyalty_to_liege_scope.GetPrimaryTitle.GetNameNoTooltip].\n\n"
 pledge_loyalty_to_liege.0101.desc.hook: "[pledge_loyalty_to_liege_vassal.GetSheHe|U] คุกเข่าลงด้วยความเคารพ และ ท่ามกลางคำสัตย์ปฏิญาณ [pledge_loyalty_to_liege_vassal.GetHerHis] อื่น ๆ ที่จะรับใช้ [pledge_loyalty_to_liege_scope.GetPrimaryTitle.GetNameNoTooltip] ก็ยังมอบตัว [pledge_loyalty_to_liege_vassal.GetHerselfHimself] ให้อยู่ภายใต้การควบคุมและหนี้บุญคุณของข้า\n\n"
 pledge_loyalty_to_liege.0101.desc.contract: "[pledge_loyalty_to_liege_vassal.GetSheHe|U] คุกเข่าลงด้วยความเคารพ และ ท่ามกลางคำสัตย์ปฏิญาณอื่น ๆ ของ[pledge_loyalty_to_liege_vassal.GetHerHis] ที่จะรับใช้ [pledge_loyalty_to_liege_scope.GetPrimaryTitle.GetNameNoTooltip] ก็ยังเสนอที่จะอุทิศตนมากขึ้นให้แก่ข้า ในฐานะขุนนางข้าหลวงของ [pledge_loyalty_to_liege_scope.GetPrimaryTitle.GetTierAsNameNoTooltip].\n\n"
 pledge_loyalty_to_liege.0101.desc.success: "ในที่สุด ข้าก็สั่งให้ [pledge_loyalty_to_liege_vassal.GetTitleAsNameNoTooltip] ลุกขึ้น ยืนยันความพึงพอใจของข้า และยืนยันสิทธิ์ของ [pledge_loyalty_to_liege_vassal.GetFirstNamePossessiveNoTooltip] ในดินแดนที่ [pledge_loyalty_to_liege_vassal.GetSheHe] ปกครองแทนข้า"
 pledge_loyalty_to_liege.0101.smooth.submission: ""รับใช้ข้าให้ดี, [pledge_loyalty_to_liege_vassal.GetTitledFirstNameNoTooltip].""
 pledge_loyalty_to_liege.0101.smooth.gold: ""ข้ารับของกำนัลอันมากมายของเจ้า, [pledge_loyalty_to_liege_vassal.GetTitledFirstNameNoTooltip].""
 pledge_loyalty_to_liege.0101.smooth.hook: ""ข้ายินดีที่รู้ว่าข้าสามารถเรียกใช้เจ้าได้, [pledge_loyalty_to_liege_vassal.GetTitledFirstNameNoTooltip].""
 pledge_loyalty_to_liege.0101.smooth.contract: ""การรับใช้ของเจ้านั้นประเมินค่ามิได้, [pledge_loyalty_to_liege_vassal.GetTitledFirstNameNoTooltip].""
# Activity End: Vassal learns that liege refuses to hear petition

 pledge_loyalty_to_liege.0009.opening: "[pledge_loyalty_to_liege_scope.Custom2('AppropriateGreeting', ROOT.Char )]"
 pledge_loyalty_to_liege.0009.desc: "ข้าไม่หลงกลการกระทำอัน [pledge_loyalty_to_liege_vassal.Custom2('InsultAdjective', SCOPE.sC('pledge_loyalty_to_liege_scope'))] ของเจ้าดอก; คำสัตย์ปฏิญาณจากเจ้าไร้ความหมายสิ้นดีสำหรับข้า"
 pledge_loyalty_to_liege.0009.a: "ช่างน่าเดือดดาล!"

 # Vassal Event: Vassal hears how it went
 pledge_loyalty_to_liege.0201.t: "$pledge_loyalty_to_liege_header$ การคุกเข่า"
 pledge_loyalty_to_liege.0201.desc: "เหล่าข้ารับใช้นำทางข้าเข้าไปยังห้องโถงใหญ่ของ [pledge_loyalty_to_liege_scope.GetTitledFirstNamePossessiveRegnal] ใน [pledge_loyalty_to_liege_scope.GetCapitalLocation.GetNameNoTooltip] ที่ ซึ่ง [pledge_loyalty_to_liege_scope.GetSheHe] ประทับบนบัลลังก์ของ [pledge_loyalty_to_liege_scope.GetHerHis] รอฟังคำสัตย์ปฏิญาณของข้า\n\n"
 pledge_loyalty_to_liege.0201.desc.success: "ข้าคุกเข่าลงแทบเท้า [pledge_loyalty_to_liege_scope.GetLadyLord] ของข้า และกล่าวคำสัตย์ปฏิญาณแห่งความเคารพมากมาย ขณะที่เหล่าอาลักษณ์ของ [pledge_loyalty_to_liege_scope.GetHerHis] บันทึกเหตุการณ์นั้น\n\n"
 pledge_loyalty_to_liege.0201.desc.submission: "เมื่อเสร็จสิ้น พิธีการก็สมบูรณ์ ข้ามิมีสิ่งใดจะมอบให้ [pledge_loyalty_to_liege_scope.GetTitleAsNameNoTooltip] ของข้า นอกเสียจากคำสัญญาว่าจะรับใช้อย่างซื่อสัตย์ในฐานะข้าหลวงของ [pledge_loyalty_to_liege_scope.GetPrimaryTitle.GetTierAsNameNoTooltip].\n\n"
 pledge_loyalty_to_liege.0201.desc.gold: "ผู้ติดตามของข้าจึงตามมา มอบของกำนัลอันล้ำค่าของข้าแก่ [pledge_loyalty_to_liege_scope.GetTitleAsNameNoTooltip] ต่อหน้าเหล่าขุนนางในราชสำนัก"
 pledge_loyalty_to_liege.0201.desc.gold.received_as_expected: "ตามธรรมเนียม [pledge_loyalty_to_liege_scope.GetSheHe] ได้มอบของกำนัลเล็กน้อยเป็นการตอบแทน เพื่อกระชับความสัมพันธ์ของเราสืบต่อไปในภายภาคหน้า\n\n"
 pledge_loyalty_to_liege.0201.desc.gold.received_more: "\n\nดังที่ข้าคาดไว้ [pledge_loyalty_to_liege_scope.GetTitleAsNameNoTooltip] ได้มอบของกำนัลตอบแทนแก่ข้า แต่ของกำนัลเหล่านั้นกลับหลั่งไหลมาไม่หยุด! ครั้นเวลาผ่านไปเนิ่นนาน ข้าพบว่าตนเองถูกห้อมล้อมด้วยทรัพย์สมบัติที่มากกว่าที่ข้ามอบให้ [pledge_loyalty_to_liege_scope.GetHerHim] เสียอีก เหล่าขุนนางรอบตัวเราพยายามเก็บงำความตื่นตะลึงต่อการละเมิดธรรมเนียมปฏิบัติอันควรนี้ โดยไม่แน่ใจว่า [pledge_loyalty_to_liege_scope.GetTitleAsNameNoTooltip] กำลังให้รางวัลข้า ติดสินบนข้า หรือเพียงแค่โอ้อวดอำนาจและความมั่งคั่งของ [pledge_loyalty_to_liege_scope.GetHerHis]\n\n"
 pledge_loyalty_to_liege.0201.desc.gold.received_nothing: "\n\nข้าคุกเข่านานจนรู้สึกว่านานเกินไป ก่อนจะประจักษ์ชัดว่า [pledge_loyalty_to_liege_scope.GetTitleAsNameNoTooltip] จะไม่มอบของกำนัลตอบแทนตามธรรมเนียมใด ๆ แก่ข้า เหล่าขุนนางรอบตัวเราดูอึดอัดใจ ไม่แน่ใจว่าคลังหลวงกำลังว่างเปล่า หรือว่า [pledge_loyalty_to_liege_scope.GetTitleAsNameNoTooltip] กำลังพยายามเชือดไก่ให้ลิงดูโดยใช้ข้าเป็นตัวอย่าง\n\n"

 pledge_loyalty_to_liege.0201.desc.hook: "จากนั้นก็ถึงคำมั่นสัญญาของข้า ว่า [pledge_loyalty_to_liege_scope.GetSheHe] อาจเรียกใช้ข้าให้ช่วยเหลือสิ่งใดก็ได้ ในฐานะผู้สนับสนุนผู้ภักดีของ [pledge_loyalty_to_liege_scope.GetTitleAsNameNoTooltip] ในทุกภารกิจของ [pledge_loyalty_to_liege_scope.GetHerHis]\n\n"
 pledge_loyalty_to_liege.0201.desc.contract: "จากนั้นก็ถึงของกำนัลของข้า ข้ายืนยันว่าข้าจะเพิ่มการอุทิศตนของข้าต่อ [pledge_loyalty_to_liege_scope.GetPrimaryTitle.GetTierAsNameNoTooltip] เพื่อเป็นเครื่องหมายแห่งความจงรักภักดีของข้าและเพื่อประโยชน์สุขแห่งราชบัลลังก์\n\n"
 pledge_loyalty_to_liege.0201.desc.brush_off: "ข้าประหลาดใจยิ่งนัก [pledge_loyalty_to_liege_scope.GetFirstNameNoTooltip] ทำราวกับว่าไม่มีสิ่งใดเกิดขึ้น และยอมรับความเคารพของข้าอย่างสง่างาม\n\n"
 pledge_loyalty_to_liege.0201.desc.outro: "[pledge_loyalty_to_liege_scope.GetFirstNameNoTooltip] สั่งให้ข้าลุกขึ้น และยืนยันความพึงพอใจของ [pledge_loyalty_to_liege_scope.GetHerHis] พร้อมทั้งสิทธิ์ของข้าในดินแดนที่ข้าปกครองแทน [pledge_loyalty_to_liege_scope.GetHerHis]"
 pledge_loyalty_to_liege.0201.smooth.submission: "สดุดีแด่ [pledge_loyalty_to_liege_scope.GetTitleAsNameNoTooltip]"
 pledge_loyalty_to_liege.0201.smooth.gold: "ราคาแห่งความจงรักภักดี..."
 pledge_loyalty_to_liege.0201.smooth.hook: "หวังว่าจะเป็นเพียงบุญคุณเล็กน้อย..."
 pledge_loyalty_to_liege.0201.smooth.contract: "ภาระแห่งการรับใช้..."
 pledge_loyalty_to_liege.0201.faux_pas: "สุดท้ายแล้วก็เป็นเจ้าเหนือหัวผู้เที่ยงธรรม"
 pledge_loyalty_to_liege.0201.insult: "ข้าไม่น่ามาเลย"

 # Invalidated event
 pledge_loyalty_to_liege.0601.t: "$pledge_loyalty_to_liege_header$ เป็นโมฆะ"
 pledge_loyalty_to_liege.0601.desc.court: "เมื่อพิธีราชาภิเษกของข้าในฐานะ [ROOT.Char.GetTitleAsNameNoTooltip] เสร็จสมบูรณ์ การเตรียมการเพื่อถวายความเคารพของข้าก็ไม่จำเป็นอีกต่อไป..."
 pledge_loyalty_to_liege.0601.desc.imprisoned_me: "$pledge_loyalty_to_liege.0601_shared_intro$ [ROOT.Char.GetImprisonedBy.GetTitledFirstName] จับข้าโยนเข้าคุก"
 pledge_loyalty_to_liege.0601.desc.imprisoned: "$pledge_loyalty_to_liege.0601_shared_intro$ ข้าถูกจับกุมโดย [ROOT.Char.GetImprisonedBy.GetTitledFirstName]"
 pledge_loyalty_to_liege.0601.desc.liege_dead_me: "$pledge_loyalty_to_liege.0601_shared_intro$ ข้าลงเอยด้วยการสังหาร [pledge_loyalty_to_liege_scope.GetTitledFirstName]... \n\n"
 pledge_loyalty_to_liege.0601.desc.liege_dead: "$pledge_loyalty_to_liege.0601_shared_intro$ [pledge_loyalty_to_liege_scope.GetTitledFirstName] [pledge_loyalty_to_liege_scope.GetDeathReasonHideKiller]... \n\n"
 pledge_loyalty_to_liege.0601.desc.liege_imprisoned_me: "$pledge_loyalty_to_liege.0601_shared_intro$ ข้าลงเอยด้วยการจับกุม [pledge_loyalty_to_liege_scope.GetTitledFirstName]!"
 pledge_loyalty_to_liege.0601.desc.liege_imprisoned: "$pledge_loyalty_to_liege.0601_shared_intro$ [pledge_loyalty_to_liege_scope.GetTitledFirstName] ถูกจับกุมโดย [pledge_loyalty_to_liege_scope.GetImprisonedBy.GetTitledFirstName]"
 pledge_loyalty_to_liege.0601.desc.new_liege: "หากข้าจะถวายสัตย์ปฏิญาณ ก็ต้องกระทำต่อเจ้าเหนือหัวคนใหม่ของข้า [ROOT.Char.GetLiege.GetTitledFirstNameRegnal]"
 pledge_loyalty_to_liege.0601_shared_intro: "ในขณะที่ข้ากำลังเตรียมการขั้นสุดท้ายสำหรับการถวายสัตย์ปฏิญาณของข้า,"
 pledge_loyalty_to_liege.0601.desc: "\n\nนี่มันเปลี่ยนสถานการณ์ไปอย่างสิ้นเชิง"
 pledge_loyalty_to_liege.0601.a_court: "มุ่งหน้าต่อไป สู่สิ่งที่ยิ่งใหญ่กว่า"
 pledge_loyalty_to_liege.0601.a_prison: "บัดซบ"
 pledge_loyalty_to_liege.0601.a_liege: "น่าหงุดหงิดยิ่งนัก..."
 pledge_loyalty_to_liege.0601.a: "ถึงเวลาทบทวนเรื่องต่าง ๆ ใหม่..."

 pledge_loyalty_to_liege_overdue.1000.t: "ข้าหลวงผู้ไร้เกียรติ"
 pledge_loyalty_to_liege_overdue.1000.desc.1: "ขณะที่ข้าตรวจสอบรายชื่อผู้ที่เข้ามาถวายสัตย์ปฏิญาณความภักดีต่อข้าในฐานะ [ROOT.Char.GetTitleAsName] นามหนึ่งยังคงขาดหายไปอย่างเห็นได้ชัด: [SCOPE.sC('pledge_loyalty_to_liege_offender').GetTitledFirstName] แห่งตระกูล [SCOPE.sC('pledge_loyalty_to_liege_offender').GetDynasty.GetName] เวลาได้ล่วงเลยไปกว่า [SCOPE.sC('pledge_loyalty_to_liege_offender').MakeScope.Var('pledge_loyalty_to_liege_found_overdue_years').GetValue|0] ปีแล้ว "
 pledge_loyalty_to_liege_overdue.1000.desc.new_liege: "นับตั้งแต่ข้าขึ้นครองบัลลังก์, "
 pledge_loyalty_to_liege_overdue.1000.desc.new_title: "นับตั้งแต่ [SCOPE.sC('pledge_loyalty_to_liege_offender').GetSheHe] มาเป็นข้าหลวงของข้า, "
 pledge_loyalty_to_liege_overdue.1000.desc.2: "แต่ก็ไร้ ซึ่งข่าวคราวหรือเครื่องบรรณาการใด ๆ มาจากดินแดนของ [SCOPE.sC('pledge_loyalty_to_liege_offender').GetHerHis]\n\nเหล่าขุนนางของข้าสบตากันอย่างอึดอัดใจ เสียงซุบซิบดังระงมไปทั่วห้องโถง — นี่อาจเป็นเพียงการหลงลืม หรือเป็นการจงใจสบประมาทสิทธิ์ในการปกครองของข้ากันแน่? บรรยากาศแห่งการท้าทายอันเงียบงันเริ่มคุกรุ่นไปทั่ว"
 pledge_loyalty_to_liege_overdue.1000.a: "ส่งทูตไปเรียกร้องให้ [SCOPE.sC('pledge_loyalty_to_liege_offender').GetHerHis] มาเข้าเฝ้าโดยทันที"
 pledge_loyalty_to_liege_overdue.1000.a.tt: "[SCOPE.sC('pledge_loyalty_to_liege_offender').GetTitledFirstName] จะได้รับจดหมายเตือนสติ [SCOPE.sC('pledge_loyalty_to_liege_offender').GetHerHim] ถึงภาระผูกพันของ [SCOPE.sC('pledge_loyalty_to_liege_offender').GetHerHis] ขึ้นอยู่กับการตอบสนองของ [SCOPE.sC('pledge_loyalty_to_liege_offender').GetHerHis] ท่านอาจสามารถ [usurp|E] [titles|E] ของ [SCOPE.sC('pledge_loyalty_to_liege_offender').GetHerHis] ได้"
 pledge_loyalty_to_liege_overdue.1000.b: "[SCOPE.sC('pledge_loyalty_to_liege_offender').GetSheHe|U] คงจะแค่ยุ่งอยู่กระมัง"
 pledge_loyalty_to_liege_overdue.1000.b.tt: "[SCOPE.sC('pledge_loyalty_to_liege_offender').GetTitledFirstName] จะได้รับการอภัยโทษสำหรับภาระผูกพันของ [SCOPE.sC('pledge_loyalty_to_liege_offender').GetHerHis]"
 pledge_loyalty_to_liege_overdue.1010.t: "เกียรติยศเรียกหา"
 pledge_loyalty_to_liege_overdue.1010.desc.new_liege: "ด้วยการขึ้นครองบัลลังก์อันสูงส่งแห่ง [ROOT.Char.GetLiege.GetPrimaryTitle.GetName] ของ [ROOT.Char.GetLiege.GetTitledFirstName], "
 pledge_loyalty_to_liege_overdue.1010.desc.new_title: "ในฐานะ [ROOT.Char.GetTitleTierName|U] แห่ง [ROOT.Char.GetPrimaryTitle.GetName] และข้าหลวงของ [ROOT.Char.GetLiege.GetPrimaryTitle.GetName], "
 pledge_loyalty_to_liege_overdue.1010.desc: "ถึงเวลาแล้วที่ข้าจะต้องออกเดินทางและถวายความเคารพ เพื่อยืนยันความจงรักภักดีและคำสัตย์ของข้า\n\nการละเลยที่จะกระทำ เช่นนั้นในเวลาอันควร อาจถูกมองว่าไร้เกียรติ — หรือที่เลวร้ายกว่านั้น คือถูกตีความว่าเป็นการประกาศเจตจำนงที่จะก่อกบฏ"
 pledge_loyalty_to_liege_overdue.1010.a: "ออกเดินทางทันที และเร่งมือเข้า!"
 pledge_loyalty_to_liege_overdue.1010.a.tt: "เปิดหน้าต่าง [decision|v] #V ถวายสัตย์ปฏิญาณต่อ [GetPlayer.GetLiege.GetTitleTierName|U]#! "
 pledge_loyalty_to_liege_overdue.1010.b: "[ROOT.Char.GetLiege.GetTitleAsName] คงต้องรอไปก่อน"
 pledge_loyalty_to_liege_overdue.1010.b.tt: "หากท่านชักช้านานเกินไป [titles|E] ของท่านอาจถูก [revoked|E]!"
 pledge_loyalty_to_liege_overdue.1020.t: "[spurned_liege.Custom2('AppropriateGreetingNegative', ROOT.Char)]"
 pledge_loyalty_to_liege_overdue.1020.desc: "การที่เจ้าล้มเหลวในการมาปรากฏตัวต่อหน้าข้า ณ ราชสำนัก มิได้รอดพ้นสายตาข้าไปได้ เกียรติยศผูกมัดให้เจ้าต้องแก้ไขความผิดพลาดนี้โดยพลัน\n\nการละเลยหน้าที่ของเจ้า อาจบีบให้ข้าต้องลงมือ เพื่อรักษาความสงบเรียบร้อยแห่งอาณาจักรของข้า"
 pledge_loyalty_to_liege_overdue.1020.a: "ออกเดินทางทันที และเร่งมือเข้า!"
 pledge_loyalty_to_liege_overdue.1020.a.tt: "เปิดหน้าต่าง [decision|v] #V ถวายสัตย์ปฏิญาณต่อ [GetPlayer.GetLiege.GetTitleTierName|U]#! \n$pledge_loyalty_to_liege_overdue.1020.b.tt$"
 pledge_loyalty_to_liege_overdue.1020.b: "คำขู่ที่บอบบางดั่งดอกซากุระต้องลม"
 pledge_loyalty_to_liege_overdue.1020.b.tt: "หากท่านชักช้านานเกินไป [titles|E] ของท่านอาจถูก [revoked|E]!"
 pledge_loyalty_to_liege_overdue.1020.c: "ทำลายตราประทับและส่งจดหมายคืนไป"
 pledge_loyalty_to_liege_overdue.1020.c.tt: "[SCOPE.sC('spurned_liege').GetName] อาจพยายาม [revoke|E] [titles|E] ของท่าน!"
 pledge_loyalty_to_liege_overdue.1030.t: "อภัยและลืมเลือน"
 pledge_loyalty_to_liege_overdue.1030.desc: "แม้ว่าข้าจะเมินเฉยต่อ [ROOT.Char.GetLiege.GetTitledFirstName] ดูเหมือนจะไม่มีผลกระทบตามมา เช่นปกติ เป็นไปได้หรือไม่ว่า [ROOT.Char.GetLiege.GetPrimaryTitle.GetName] ได้เพิกเฉยต่อธรรมเนียมของเรา?"
 pledge_loyalty_to_liege_overdue.1030.a: "ข้าหมดกังวลไปอีกหนึ่งเรื่อง"
 pledge_loyalty_to_liege_overdue.1030.b: "เห็นได้ชัดว่า [ROOT.Char.GetLiege.GetSheHe] หวาดกลัวอำนาจของ [ROOT.Char.GetDynasty.GetName]!"

 msg_pledged_loyalty_to_liege: "ข้าหลวงถวายสัตย์ปฏิญาณ"
 msg_pledged_loyalty_to_liege_desc: "$EFFECT$"
 msg_pledged_loyalty_to_liege.liege.desc: "[pledge_loyalty_to_liege_vassal.GetShortUIName] ได้ถวายสัตย์ปฏิญาณความจงรักภักดีของ [pledge_loyalty_to_liege_vassal.GetHerHis] ต่อท่าน โดยการหมอบกราบอย่างเป็นทางการต่อหน้าท่าน"
 msg_pledged_loyalty_to_liege.subject.desc: "ท่านได้แสดงความจงรักภักดีของท่านต่อ [pledge_loyalty_to_liege_vassal.GetLiege.GetShortUIName] โดยการหมอบกราบอย่างเป็นทางการต่อหน้า [pledge_loyalty_to_liege_vassal.GetLiege.GetHerHim]"

 msg_refused_pledge_loyalty_to_liege: "ปฏิเสธที่จะยอมนอบน้อม"
 msg_refused_pledge_loyalty_to_liege_desc: "$EFFECT$"
 msg_refused_pledge_loyalty_to_liege.liege.desc: "ท่านได้รับสิทธิ์ในการ $revoke_title_interaction$ เนื่องจากความล้มเหลวของ [SCOPE.sC('pledge_loyalty_to_liege_offender').GetShortUINamePossessive] ในการ #V ถวายสัตย์ปฏิญาณ#! ต่อท่าน"
 msg_refused_pledge_loyalty_to_liege.subject.desc: "[ROOT.Char.GetLiege.GetShortUIName] ได้รับสิทธิ์ในการ $revoke_title_interaction$ เนื่องจากความล้มเหลวของท่านในการ #V ถวายสัตย์ปฏิญาณ#! ต่อ [ROOT.Char.GetLiege.GetHerHim]"
