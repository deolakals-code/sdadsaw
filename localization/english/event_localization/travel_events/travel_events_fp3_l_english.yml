### Dying Embers
travel_events_fp3.0010.t: "ถ่านไฟใกล้ดับ"
travel_events_fp3.0010.desc.intro: "ขณะที่คณะของข้าฝ่าพายุที่โหมกระหน่ำอย่างกะทันหัน ข้าเห็นกลุ่มนักบวชโซโรอัสเตอร์ติดอาวุธเดินสวนทางมา พวกเขาแบกเสลี่ยงที่มีกระถางไฟ ซึ่งถ่านใกล้ดับอยู่ระหว่างกัน ลมและฝนกำลังกระหน่ำเปลวไฟศักดิ์สิทธิ์ เสี่ยงที่จะดับมอดลง\n\nแม้ว่ามือของพวกเขาจะวางอยู่บนอาวุธอย่างเหนื่อยล้า เหล่านักบวชก็ร้องเรียกเรา หวังว่าเราอาจช่วยกำบังถ่านไฟศักดิ์สิทธิ์ของพวกเขาได้"
travel_events_fp3.0010.a: "ล้อมจับพวกมันและดับลัทธินอกรีตของพวกมันเสีย!"
travel_events_fp3.0010.a.success: "ข้าดับเปลวไฟของพวกมัน"
travel_events_fp3.0010.a.failure: "เหล่านักบวชโซโรอัสเตอร์ขับไล่เรากลับไป"
travel_events_fp3.0010.a.lightning.desc: "การต่อสู้ท่ามกลางพายุอาจเป็นอันตรายและคาดเดาไม่ได้"
travel_events_fp3.0010.b: "ยึดกระถางไฟมา ไฟจะปลอดภัยกว่าในมือข้า!"
travel_events_fp3.0010.b.success: "ท่านยึดกระถางไฟมาได้"
travel_events_fp3.0010.b.failure: "เหล่านักบวชโซโรอัสเตอร์ขับไล่เรากลับไป"
travel_events_fp3.0010.c: "พวกท่านมาหลบภัยกับเราได้!"
travel_events_fp3.0010.c.success: "ถ่านไฟรอดพ้นจากพายุ"
travel_events_fp3.0010.c.success.desc: "ท่านได้รับความขอบคุณจากเหล่านักบวชโซโรอัสเตอร์"
travel_events_fp3.0010.c.flavor: "หากเราสามารถปกป้องผู้แสวงบุญได้ พวกเขาจะแสดงความขอบคุณ"
travel_events_fp3.0010.c.failure: "ไฟดับมอดลง"
travel_events_fp3.0010.d: "พายุนี้คือการพิพากษาของ [ROOT.Char.GetFaith.HighGodName]"
travel_events_fp3.0010.d.flavor: "ท่านปล่อยให้นักเดินทางเผชิญชะตากรรมตามศรัทธาของพวกเขา"

travel_events_fp3.0011.t: "ถ่านไฟใกล้ดับ"
travel_events_fp3.0011.desc.intro: "เหล่านักบวชโซโรอัสเตอร์ต่อสู้อย่างกล้าหาญ พยายามปกป้องถ่านไฟศักดิ์สิทธิ์ของพวกเขาขณะป้องกันข้าและคนของข้า แต่เมื่อข้าเห็นโอกาส ข้าก็เตะเสลี่ยงหลุดจากมือพวกเขา และกระถางไฟก็กลิ้งตกลงไปในโคลน ถ่านไฟก็ดับลงพร้อมเสียงฟู่\n\nเราเยาะเย้ยและโห่ร้องใส่นักบวชผู้พ่ายแพ้ แต่ความยินดีของเราก็ถูกตัดขาดอย่างกะทันหัน เมื่อโลกรอบตัวกลายเป็นแสงสว่างและเสียงดังสนั่น ภาพติดตาของสายฟ้าฟาดวาบเข้ามาในสายตาข้า ขณะที่ข้าพยุงตัวเองขึ้นจากอาการมึนงง ข้าเห็นเปลวไฟสว่างจ้าลุกโชนขึ้นจากกระถางไฟศักดิ์สิทธิ์ที่จุดติดขึ้นใหม่ คนของข้าต่างพากันวิ่งหนีด้วยความตื่นตระหนกอย่างบ้าคลั่งแล้ว"
travel_events_fp3.0011.a: "ทุกคนต้องรู้ถึงพลังอำนาจอันมิอาจปฏิเสธได้ของ [ROOT.Char.GetCurrentLocation.GetCounty.GetFaith.HighGodName]!"
travel_events_fp3.0011.b: "ข้าจะเก็บงำปาฏิหาริย์อันมิอาจหักล้างนี้ไว้ในใจอย่างลับๆ"
travel_events_fp3.0011.c: "นี่เป็นเพียงเรื่องบังเอิญ!"
travel_events_fp3.0012.t: "ถ่านไฟใกล้ดับ"
travel_events_fp3.0012.desc.intro: "ท่านและเหล่านักบวชได้พบที่กำบังอันเหมาะสมในโครงสร้างที่พังทลาย หลังจากบิดเสื้อผ้าที่เปียกชื้นและตรวจสอบให้แน่ใจว่าเตาอั้งโล่และถ่านไฟยังคงลุกโชนดี กลุ่มก็ผ่อนคลายลง ดูเหมือนว่าพวกท่านจะต้องรอให้พายุสงบลงด้วยกัน\n\nผู้นำของเหล่านักบวช [fp3_zoroastrian_armed_pilgrim.GetName] เป็นบุคคลที่รอบรู้และมีเรื่องราวมากมายที่จะแบ่งปัน"
travel_events_fp3.0012.a: "ข้าจะเอาถ่านไฟอันล้ำค่าของพวกเขาไปขณะที่พวกเขาพักผ่อน..."
travel_events_fp3.0012.a.success: "เราขโมยถ่านไฟของพวกเขาขณะที่พวกเขานอนหลับ"
travel_events_fp3.0012.a.failure: "ท่านถูกจับได้โดยเหล่านักบวชโซโรอัสเตอร์และถูกเปิดโปงว่าเป็นขโมย"
travel_events_fp3.0012.b: "ปัญญาของท่านอาจเป็นประโยชน์ต่อข้าได้"
travel_events_fp3.0012.c: "ขอให้เดินทางโดยสวัสดิภาพ"

zoroastrian_brazier_name: "กระถางไฟ[ROOT.Char.GetCurrentLocation.GetCounty.GetFaith.GetAdjective]"
zoroastrian_brazier_desc: "$zoroastrian_brazier_name$ ที่ได้รับการช่วยเหลือจากเหล่านักบวชโซโรอัสเตอร์ผู้ไร้ความสามารถท่ามกลางพายุอันดุร้าย ถ่านไฟจากวันนั้นยังคงลุกโชนอยู่"

### Qanat Diving
 travel_events_fp3.0020.t: "การเผชิญหน้าที่ไม่ธรรมดา"
 travel_events_fp3.0020.desc.intro: "เพื่อหลีกเลี่ยงแสงแดดอันร้อนแรงยามเที่ยงวัน เราได้ตั้งค่ายพักชั่วคราวภายในถ้ำที่แปลกประหลาดและชื้นมาก\n\n\"ท่านได้ยินหรือไม่ ท่าน [ROOT.GetCharacter.GetTitleTierName|U]?\" [travel_leader.GetName] ดูเหมือนจะไม่สบายใจกับที่พักอันมืดมิดของเรา\n\nขณะที่ข้าหันกลับไป ข้าก็เผชิญหน้ากับ [fp3_young_rascal.Custom('GirlBoy')] หนุ่มสาวคนหนึ่ง ซึ่งต้องเดินผ่าน [travel_leader.GetNameNoTooltip] มาได้อย่างไรก็ไม่รู้ เด็กที่ตกใจก็หายลับเข้าไปในถ้ำลึกทันที"
 travel_events_fp3.0020.a: "ตามเด็กคนนั้นไป!"
 travel_events.fp3.0020.a.flavor: "การสำรวจถ้ำอาจนำมา ซึ่งอันตรายหรือเปิดเผยความลับของมัน"
 travel_events_fp3.0020.a.success: "ท่านพบเด็กคนนั้น"
 travel_events_fp3.0020.a.success.tooltip: "ท่านตามเด็กไปและค้นพบความลับใต้ดิน"
 travel_events_fp3.0020.b: "เราต้องออกจากสถานที่แห่งนี้"
 travel_events.fp3.0020.b.flavor: "[travel_leader.GetNameNoTooltip] เร่งเร้าให้เราทิ้งถ้ำเหล่านี้ไว้เบื้องหลัง พวกมันไม่ปลอดภัย"
 travel_events_fp3.0020.b.tt: "การเดินทางของท่านดำเนินต่อไป"
 travel_events_fp3.0020.a.failure.title: "ท่านล้มและบาดเจ็บในอุโมงค์มืด"
 travel_events_fp3.0020.a.failure: "ท่านคลาดกับเด็กและหลงทางอยู่ในอุโมงค์เป็นเวลาหลายวัน"

 travel_events_fp3.0021.t: "คานัตแห่ง [ROOT.Char.GetCurrentLocation.GetCounty.GetName]"
 travel_events_fp3.0021.desc: "เราดำดิ่งลึกลงไปใต้พื้นดิน ทิ้งทิวทัศน์ที่สว่างไสวด้วยแสงแดดไว้เบื้องหลัง สู่ทางอุโมงค์ที่ชื้นและมืดมิดขึ้นเรื่อยๆ\n\nในที่สุดเมื่อข้าตามทัน [fp3_young_rascal.Custom('GirlBoy')] ข้าก็ถูกเบี่ยงเบนความสนใจด้วยภาพอันงดงาม ระบบคลองใต้ดินโบราณทอดยาวสุดลูกหูลูกตา\n\n\"ยินดีต้อนรับ ท่าน [ROOT.Char.GetTitleAsName] สู่พระราชวังส่วนตัวของข้าเอง มันอาจจะ ทำให้ของท่านดูเล็กไปเลยก็ได้\" [fp3_young_rascal.GetSheHe|U] เงยหน้ามองข้าอย่างท้าทาย เห็นได้ชัดว่าไม่พอใจที่ข้าสามารถตาม [fp3_young_rascal.GetHerHim] ลงมาถึงที่นี่ได้"
travel_events_fp3.0021.a: "ให้เราดำน้ำหาสมบัติที่ซ่อนอยู่ใต้น้ำเหล่านี้"
travel_events_fp3.0021.a.success.t: "ท่านงม [newly_created_artifact.GetName] ขึ้นมาได้"
travel_events_fp3.0021.a.success.desc: "ท่านพบสมบัติโบราณ"
travel_events_fp3.0021.a.failure.t: "สิ่งเดียวที่ข้าจับได้คืออาการหนาวสั่น"
travel_events_fp3.0021.a.failure.desc: "ท่านเกือบจมน้ำเน่า"
travel_events_fp3.0021.a.artifact: "ข้าพบสิ่งประดิษฐ์เก่าแก่ชิ้นหนึ่ง"

travel_events_fp3.0021.b: "ข้าสามารถเรียนรู้บางอย่างจากการศึกษาสิ่งก่อสร้างนี้"
travel_events_fp3.0021.b.success.t: "ท่านเรียนรู้ความลับการชลประทานบางอย่าง"
travel_events_fp3.0021.b.success.desc: "ท่านศึกษาคานัต"
travel_events_fp3.0021.b.failure.t: "ปัญหานี้เกินความเข้าใจของท่าน"
travel_events_fp3.0021.b.failure.desc: "นี่เกินความสามารถของท่าน"

travel_events_fp3.0021.c: "[fp3_young_rascal.Custom('GirlBoy')|U] เจ้าต้องเรียนรู้ที่จะเคารพผู้ที่เหนือกว่า!"

### Tower of Silence
travel_events_fp3.0030.t: "งานเลี้ยงสำหรับเหยี่ยว"
travel_events_fp3.0030.desc.intro: "ฝูงนกล่าเหยื่อบินวนอยู่เหนือศีรษะ ทอดเงาอันเป็นลางร้ายลงบนภูมิประเทศที่ถูกแดดแผดเผา ขณะที่ข้าปีนขึ้นไปตามเนินเขาที่ตั้งตระหง่าน กลิ่นเหม็นของเนื้อเน่าก็คละคลุ้งไปทั่วประสาทสัมผัสของข้า\n\nข้าเห็นร่างต่างๆ วางเรียงรายอย่างเป็นระเบียบบนโขดหิน ฝูงแร้งและเหยี่ยวกำลังฉีกทึ้งเนื้อ ชิ้นเนื้อเป็นเส้นๆ เปื้อนเลือดห้อยลงมาจากจะงอยปากของพวกมัน ชายในชุดเรียบง่ายคนหนึ่งกำลังดูแลการทำศพด้วยนกแร้ง เขาโบกมือให้ข้า\n\n\"โปรดจากไปเถิด ท่าน [ROOT.Char.GetTitleAsNameNoTooltip] สถานที่แห่งนี้มีไว้สำหรับผู้ดูแลศพเท่านั้น...\""
travel_events_fp3.0030.a: "นี่มันป่าเถื่อน เราจะฝังศพเหล่านี้!"
every_faith_vassal: "ข้าหลวงทุก[local_faith.GetAdjective]คน"
travel_events_fp3.0030.b: "ข้าหวังว่าข้าจะได้ไป เช่นนี้ มลทินจากศพถูกชำระล้างออกจากร่างข้า..."
travel_events_fp3.0030.c: "ลองจินตนาการถึงการขึ้นสู่ท้องฟ้า ถูกนำพาไปด้วยปีกอันทรงพลังเหล่านี้..."
travel_events_fp3.0030.d: "ความตายมาเยือนเราทุกคน"
travel_events_fp3.0030.d_flavor: "ใช้เวลาใคร่ครวญถึงความตายสักครู่แล้วจึงออกจากสถานที่นั้น"
travel_events_fp3.0030.e: "หาเหยี่ยวที่อายุน้อยที่สุดมาให้ข้า ข้าจะฝึกมันเพื่อประโยชน์ที่ดีกว่า"
travel_events_fp3.0030.e.tooltip: "ท่านจะได้รับโอกาสในการฝึกนก"

travel_events_fp3.0031.t: "งานเลี้ยงสำหรับเหยี่ยว"
travel_events_fp3.0031.desc.intro: "ข้าตั้งใจที่จะฝึกเหยี่ยวที่ข้าพบ ณ สถานที่ทำศพด้วยนกแร้ง เพื่อการนั้น เราจึงรวมตัวกันในสนามพร้อมคณะเดินทางเล็กๆ รวมถึง [falcon_victim.GetName] [ROOT.Char.Custom2('RelationToMe', falcon_victim)] ของข้า ซึ่งพร้อมอยู่กับกระต่ายป่าที่จับมา นกหนุ่มที่สวมหมวกคลุมหัวรอคอยอย่างคาดหวังบนมือที่สวมถุงมือของข้า\n\n[falcon_victim.GetNameNoTooltip] ปล่อยเหยื่อ ซึ่งวิ่งหนีไปตามทุ่งโล่ง ข้าถอดหมวกคลุมหัวของเหยี่ยวออก และมันก็บินขึ้นอย่างรวดเร็ว แต่แทนที่จะโฉบลงไปหาเหยื่อ มันกลับโฉบไปที่ศีรษะของ [falcon_victim.GetNameNoTooltip] ก่อนที่จะถูกดึงออกไป เหยี่ยวก็กัดและข่วน [falcon_victim.GetHerHim] ทิ้งรอยแผลฉกรรจ์เปื้อนเลือดไว้"
travel_events_fp3.0031.a: "ข้ามั่นใจว่าข้าสามารถแก้ไขพฤติกรรมนี้ได้"
travel_events_fp3.0031.a.success.desc: "การฝึกฝนได้ผล"
travel_events_fp3.0031.a.success.t: "นกจากหอคอยแห่งความเงียบกลายเป็นเหยี่ยวล่าสัตว์"
travel_events_fp3.0031.a.failure.desc: "นกยังคงดุร้าย"
travel_events_fp3.0031.a.failure.t: "เหยี่ยวยังคงความอยากเนื้อคนไว้"
travel_events_fp3.0031.b: "ข้าสามารถบ่มเพาะแนวโน้มเหล่านี้ได้..."
travel_events_fp3.0031.c: "ข้าควรจะกำจัดสัตว์ร้ายตัวนี้เสียดีกว่า"
travel_events_fp3.0031.d: "[ROOT.Char.GetWomanMan] [ROOT.Char.GetCulture.GetPrefixNoTooltip] ใดๆ ก็รู้วิธีฝึกฝนนกที่ดุร้ายที่สุดให้เชื่องได้"
travel_events_fp3.0031.d.tt: "ตัวเลือกนี้มีให้ เนื่องจากวัฒนธรรมของท่านมี [culture_tradition|E] $tradition_ep2_avid_falconers_name$"

### Mare's Milk
travel_events_fp3.0040.t: "นมม้า"
travel_events_fp3.0040.desc.intro: "เส้นทางของเราผ่านค่ายพักแรมขนาดใหญ่ของนักเดินทางชาวเติร์ก กลุ่มคนเหล่านั้นโบกมือเรียกเราอย่างเป็นมิตรให้เข้าร่วมกับพวกเขา [fp3_turkic_traveler.GetWomanMan] ท่าทางแข็งแกร่งคนหนึ่งกำลังคนของเหลวสีขาวข้นในหม้อ [fp3_turkic_traveler.GetSheHe|U] เทบางส่วนลงในชามเล็กๆ แล้วยื่นให้ข้า\n\n\"#EMP คูมิส!#! มันดีต่อลำไส้มาก!\"\n\nอีกสองคนมองมาที่ข้าและกระซิบกระซาบกันเป็นภาษาของพวกเขาเอง ดังพอที่ข้าจะได้ยิน"
travel_events_fp3.0040.desc.intro.a: "\n\"ทำไมเราต้องเสีย #EMP คูมิส#! ดีๆ ให้กับคนแปลกหน้าคนนี้ด้วย?\"\n\nพวกเขาเชื่ออย่างชัดเจนว่าข้าไม่สามารถเข้าใจคำพูดของพวกเขาได้ แต่อย่างน้อยพวกเขาก็ไม่ได้เสิร์ฟยาพิษให้ข้า"
travel_events_fp3.0040.desc.intro.b: "\n\"ข้าขอเลือกของของเขาก่อน! รองเท้าบู๊ตสวยๆ นั่นจะเหมาะกับข้าดี\"\n\nพวกเขาเชื่ออย่างชัดเจนว่าข้าไม่สามารถเข้าใจคำพูดของพวกเขาได้ โชคร้ายสำหรับพวกเขา: บัดนี้ข้ารู้เจตนาร้ายของพวกเขาแล้ว"
travel_events_fp3.0040.desc.intro.c: "แต่ข้าไม่เข้าใจคำพูดแปลกๆ ของพวกเขา หวังว่าพวกเขาจะมีเจตนาดี..."
travel_events_fp3.0040.a: "ข้าขอบคุณพวกเขาเป็นภาษาแม่ของพวกเขา เพื่อสุขภาพของเรา!"
travel_events_fp3.0040.ab.tt: "ตัวเลือกนี้มีให้ เพราะท่านพูดภาษา [fp3_turkic_traveler.GetCulture.GetLanguage.GetNameNoTooltip] ได้"
travel_events_fp3.0040.b: "เป็นภาษาแม่ของพวกเขา ข้าสั่งให้จับกุมพวกเขา"
travel_events_fp3.0040.c: "ข้าไม่ควรไม่ไว้วางใจ เช่นนี้"
travel_events_fp3.0040.c.success: "คูมิสอร่อยมาก"
travel_events_fp3.0040.c.success.t: "คูมิสอร่อยมาก!"
travel_events_fp3.0040.c.failure: "ท่านถูกวางยาและปล้น"
travel_events_fp3.0040.c.failure.t: "ข้าถูกวางยาและปล้น!"
travel_events_fp3.0040.d: "นมม้า? นั่นน่าขยะแขยง"
travel_events_fp3.0040.e: "ให้ [fp3_turkic_traveler.GetWomanMan] ผู้นี้สอนวิถีของ [fp3_turkic_traveler.GetHerHis] แก่เรา"

### Tomb Raiders
travel_events_fp3.0050.t: "โจรปล้นสุสาน"
travel_events_fp3.0050.desc.intro: "เมื่อเลี้ยวโค้งตามเส้นทาง เราก็พบกับกลุ่มคนที่เต็มไปด้วยฝุ่น กำลังออกมาจากสิ่งที่ครั้งหนึ่งต้องเคยเป็นสุสานอันน่าประทับใจ พวกเขาแบกกระสอบป่านที่ส่งเสียงกรุ๊งกริ๊ง หนักอึ้งไปด้วยของกระจุกกระจิกที่พวกเขาขุดออกมาจากอาคารโบราณ\n\n\"ช่วงเวลาลำบาก ท่าน [ROOT.Char.GetTitleAsNameNoTooltip] ผู้ยิ่งใหญ่! ครอบครัวของเราต้องกินต้องใช้ และเราไม่ได้ทำร้ายใครในหมู่คนเป็น\""
travel_events_fp3.0050.a: "ไม่มีอนาคตสำหรับผู้ที่ไม่ใส่ใจอดีต"
travel_events_fp3.0050.b: "ท่าน [ROOT.Char.GetTitleAsNameNoTooltip] สมควรได้รับส่วนแบ่งของ[ROOT.Char.GetHerHis]!"
travel_events_fp3.0050.b.entourage: "สหายร่วมทางของท่าน [entourage_helper.GetName] ช่วยท่านตรวจสอบของที่ปล้นมา"
travel_events_fp3.0050.b.success.desc: "ท่านเลือกสมบัติล้ำค่าชิ้นหนึ่ง"
travel_events_fp3.0050.b.success.tooltip: "ท่านได้รับสมบัติโบราณ"
travel_events_fp3.0050.b.failure.desc: "ไม่มีอะไรพิเศษสะดุดตาของท่าน"
travel_events_fp3.0050.b.failure.t: "ท่านได้ของมีค่าเล็กน้อยบางอย่าง"
travel_events_fp3.0050.c: "ข้าไม่มีเวลาให้พวกชาวนา"
