l_english: 
 travel_danger_events.3000.t:0 "$travel_danger_prefix$ บนเส้นทางภูเขา"
 travel_danger_events.3000.desc.first_time:0 "ก้าวแล้วก้าวเล่า ข้าค่อยๆ เคลื่อนไปข้างหน้าบนเส้นทางภูเขาอันคับแคบ ทันใดนั้น ข้าก็ได้ยินเสียงครืนและเสียงกรีดร้องที่เงียบลงอย่างรวดเร็ว\n\nด้วยความตกใจจากเสียงเอะอะ ข้าหันขวับไป แทนที่จะเป็น [fallen_victim.GetFirstName] เดินตามหลังข้า กลับมีเพียงใบหน้าที่งุนงงและเหนื่อยล้าไม่แพ้กันของ [char_next_in_line.GetFirstName] ยืนอยู่หน้ากองหินที่เพิ่งถล่มลงมา\n\n\"[fallen_victim.GetFirstNameNoTooltip] อยู่ไหน?\" ข้าต้องการคำตอบ เสียงของข้าแทบไม่เล็ดลอดออกจากปากที่แห้งผาก\n\nคำตอบเดียวคือเสียงลมหวีดหวิวแผ่วเบา"
 travel_danger_events.3000.desc.second_time:0 "ข้าเดินไปบนเส้นทางภูเขาอันคับแคบที่ดูเหมือนไม่มีที่สิ้นสุด ข้ารู้สึกถึงม่านแห่งความเหนื่อยล้าที่บดบังความคิด ข้าได้ยินเสียงกระซิบหลอกลวงจากความทรงจำที่เลือนรางและเสียงลมหวีดหวิวแผ่วเบา\n\nแต่มีบางอย่างที่จริงแท้เกี่ยวกับเสียงกรีดร้องอันแหลมคมของ [fallen_victim.GetFirstName] ด้วยความหนาวเย็นที่แล่นขึ้นมาตามสันหลัง ข้าค่อยๆ หันกลับไป และอีกครั้ง ข้าเห็นช่องว่างขนาดเท่าคนในแถวเดินของเรา\n\n\"เรา... เพิ่ง... เสียคนไปอีกคนหรือ?\" ข้าพึมพำช้าๆ [char_next_in_line.GetFirstName] ไม่จำเป็นต้องพูด ใบหน้า[char_next_in_line.GetHerHis|U]ที่แข็งค้างด้วยความหวาดกลัวก็เพียงพอแล้วสำหรับคำตอบ"

 travel_danger_events.3000.a.first_time:0 "ระวังฝีเท้า! เราต้องเดินหน้าต่อไป"
 travel_danger_events.3000.a.second_time:0 "อ้า [fallen_victim.GetFirstNameNoTooltip]! ข้า #EMP บอก#! เจ้าแล้วให้ระวังฝีเท้า!"
 travel_danger_events.3000.a.tt:0 "ภูมิประเทศที่ทรยศได้คร่าชีวิตเหยื่อไปอีกราย ไม่ใช่รายแรกอย่างแน่นอน และไม่ใช่รายสุดท้ายอย่างแน่นอน"

 travel_danger_events.3000.b:0 "[fallen_victim.GetFirstNameNoTooltip]! [fallen_victim.GetFirstNameNoTooltip]! เราจะช่วยเจ้า!"
 travel_danger_events.3000.b.tt:0 "ท่านและคณะเดินทางพยายามช่วยเหลือบนภูเขา #EMP #X นี่อันตรายมาก#! #!หลายคนจะเสียชีวิต"
 travel_danger_events.3000.b.found_nothing:0 "ไม่พบ [fallen_victim.GetFirstNameNoTooltip]"
 travel_danger_events.3000.b.found_cloth:0 "พบเพียงผ้าขาดรุ่งริ่งเปื้อนเลือด"
 travel_danger_events.3000.b.found_fallen_victim:0 "เหนือความคาดหมาย พบ [fallen_victim.GetFirstNameNoTooltip] ยังมีชีวิตอยู่"

 travel_danger_events.3000.c.first_time:0 "[fallen_victim.GetSheHe|U] จะอยู่ในคำอธิษฐานของเรา"
 travel_danger_events.3000.c.second_time:0 "ข้า แต่ [ROOT.Char.GetFaith.HighGodName] โปรดช่วยเราให้พ้นจากภยันตราย!"

 travel_danger_events.3000.d.first_time:0 "ข้าเองก็ทำได้ไม่ดีไปกว่านี้!"
 travel_danger_events.3000.d.second_time:0 "ครั้งที่สองยิ่งตลกกว่าเดิม!"

 travel_danger_events.3001.t:0 "$travel_danger_prefix$ หิมะถล่ม!"
 travel_danger_events.3001.desc:0 "หลังจากการเดินทางอันยาวนานและยากลำบากท่ามกลางยอดเขาที่ปกคลุมด้วยหิมะ ข้าค่อยๆ อุ่นกายข้างกองไฟที่ลุกโชนในโรงเตี๊ยมท้องถิ่น ขณะที่ [first_avalanche_victim.GetFirstName] และ [second_avalanche_victim.GetFirstName] ดูแลขบวนของเราอยู่ข้างนอก ทันใดนั้น ก็มีเสียงทุ้มดังสนั่นก้องกังวาน แต่ทรงพลังจากระยะไกล\n\n\"หิมะถล่ม!\" ใครบางคนตะโกน ก่อนที่ใครข้างในจะมีโอกาสตอบสนอง เสียงก็ดังขึ้นเรื่อยๆ จนกระทั่งดังกระหึ่มด้วยพลังมหาศาล เขย่าผนังและพื้น หลังจากชั่วอึดใจหรือชั่วนิรันดร์ ก็มีความเงียบที่น่าสะพรึงกลัวยิ่งกว่าเดิม"
 travel_danger_events.3001.a:0 "[ROOT.Char.GetCulture.GetCollectiveNoun] รู้วิธีเอาตัวรอดในภูเขา"
 travel_danger_events.3001.a.alternate:0 "[travel_leader.GetCulture.GetCollectiveNoun] รู้วิธีเอาตัวรอดในภูเขา"
 travel_danger_events.3001.a.flavor:0 "นี่เทียบไม่ได้เลยกับหิมะถล่มแบบ [ROOT.Char.GetCulture.GetName] แท้ๆ!"
 travel_danger_events.3001.a.flavor.alternate:0 "[travel_leader.GetFirstName] $travel_leader_court_position$ ของข้าได้เตรียมการป้องกันอันตรายบนภูเขาที่จำเป็นแล้ว ด้วยมรดกทางวัฒนธรรม [travel_leader.GetCulture.GetName] ของ[travel_leader.GetHerHis]"
 travel_danger_events.3001.b:0 "รอเดี๋ยว ความช่วยเหลือมาแล้ว!"
 travel_danger_events.3001.b.flavor:0 "เมื่อมีคนถูกฝังอยู่ใต้หิมะ ความเร็วคือสิ่งสำคัญที่สุด!"
 travel_danger_events.3001.b.success:0 "การช่วยเหลือจากหิมะถล่มอย่างรวดเร็ว"
 travel_danger_events.3001.b.failure:0 "การช่วยเหลือจากหิมะถล่มเป็นไปอย่างยากลำบาก"
 travel_danger_events.3001.c:0 "ข้าจะอยู่ข้างใน... สักพัก"

 travel_danger_events.3002.opening:1 "[ROOT.Char.GetTitledFirstName],"
 travel_danger_events.3002.desc:0 "ข้าเสียใจที่ต้องแจ้งให้ท่านทราบ ฝ่าบาท ว่าเมื่อเร็วๆ นี้มีหิมะถล่มอันน่าสะพรึงกลัวพัดผ่าน [avalanche_location.GetName]\n\nมันได้คร่าชีวิตผู้คนไปมากมายและรบกวนชีวิตของผู้รอดชีวิต รวมถึงนักเดินทางที่ผ่านไปมาด้วย"
 travel_danger_events.3002.a.special:0 "ข้ารู้! ข้า #EMP อยู่ที่นั่น!#"
 travel_danger_events.3002.a.default:0 "ช่างน่าสะพรึงกลัว!"
 travel_danger_events.3002.b:0 "สิ่งนี้ควรช่วยให้พวกเขาฟื้นตัวได้"

 travel_danger_events.3003.t:0 "$travel_danger_prefix$ ติดหิมะ"
 travel_danger_events.3003.desc:0 "หิมะตกมาหลายวันแล้ว ถนนข้างหน้าดูเหมือนจะผ่านไปไม่ได้โดยสิ้นเชิง อย่างไรก็ตาม ขณะที่ข้ามองไปข้างหน้า ข้าเห็นคนกลุ่มเล็กๆ กำลังเข้าใกล้เราอย่างรวดเร็วข้ามกองหิมะ ในไม่ช้า [maron_leader.GetWomanMan] คนหนึ่งก็ยืนอยู่ตรงหน้าข้าและพูดด้วยรอยยิ้มกว้าง:\n\n\"ท่านดูเหมือนจะตกอยู่ในสถานการณ์ที่ค่อนข้างลำบาก แต่ไม่ต้องกลัว ด้วยราคาที่ยุติธรรม เราจะช่วยให้ท่านกลับสู่การเดินทางได้\""
 travel_danger_events.3003.a:0 "การช่วยเหลือผู้อื่นคือรางวัลในตัวเอง!"
 travel_danger_events.3003.a.success:0 "คณะเดินทางของข้าเริ่มเคลื่อนที่อีกครั้งอย่างรวดเร็ว!"
 travel_danger_events.3003.a.failure:0 "คณะเดินทางของข้ายังคงติดอยู่ในหิมะ"
 travel_danger_events.3003.b:0 "เป็นราคาที่ยุติธรรม"
 travel_danger_events.3003.c:0 "เราจะจัดการกันเอง"
 travel_danger_events.3003.c.flavor:0 "ความเชี่ยวชาญในฤดูหนาวของเราจะช่วยให้เราเริ่มเคลื่อนที่ได้อีกครั้ง... หากเรามี"
 travel_danger_events.3003.c.complete_success:0 "คณะเดินทางของข้าเริ่มเคลื่อนที่อีกครั้งอย่างรวดเร็ว!"
 travel_danger_events.3003.c.partial_success:0 "คณะเดินทางของข้าเริ่มเคลื่อนที่อีกครั้งอย่างช้าๆ"
 travel_danger_events.3003.c.failure:0 "คณะเดินทางของข้าติดอยู่ในหิมะ"


 travel_danger_events.3004.t:0 "$travel_danger_prefix$ พายุขาวโพลน"
 travel_danger_events.3004.desc:0 "\"พายุขาวโพลน! หันไปทางกราบซ้าย!\"\n\nเสียงตะโกนอันน่าสะพรึงกลัวของนายท้ายเรือไม่เข้ากับสภาพอากาศที่สงบ แต่หูของข้าเต็มไปด้วยเสียงคำรามของลมที่ดังขึ้นเรื่อยๆ ในเวลาไม่ถึงชั่วอึดใจ หมอกสีขาวชื้นก็ปกคลุมเรือทั้งลำ เสียงดังกว่าลม เสากระโดงเรือหลักก็หักและตกลงไปในทะเล\n\nและทันใดนั้นเหมือนตอนที่มันมา พายุก็เคลื่อนผ่านไป เรือของเราโคลงเคลงอย่างเกียจคร้านบนทะเลที่สงบ ลากใบเรือที่ขาดรุ่งริ่งและไม้พายที่หักไปด้วย"
 travel_danger_events.3004.a:0 "เราต้องหาทางกางใบเรือชั่วคราวให้ได้!"
 travel_danger_events.3004.a.success:0 "เรือของเราแล่นได้อีกครั้ง!"
 travel_danger_events.3004.a.failure:0 "เราลอยไปตามลมอย่างช้าๆ"
 travel_danger_events.3004.b:0 "อย่ากลัว! เรามีใบเรือสำรอง"
 travel_danger_events.3004.b.flavor:0 "เนื่องจากความเชี่ยวชาญด้านการเดินเรือของคณะเดินทาง เราจึงเตรียมพร้อมสำหรับสิ่งนี้ มีการติดตั้งเสากระโดงใหม่จากใบเรือและคานไม้ที่เก็บไว้อย่างรวดเร็ว"
 travel_danger_events.3004.c:0 "ใครสักคน #EMP จะต้อง#! พบเรา... ข้าหวังว่า"
 travel_danger_events.3004.c.success:0 "เรือที่แล่นผ่านเสนอความช่วยเหลือ"
 travel_danger_events.3004.c.failure:0 "เป็นเวลาหลายวัน ไม่พบเรือลำอื่นเลย"

 travel_danger_events.3005.t:0 "$travel_danger_prefix$ ไฟในยามค่ำคืน"
 travel_danger_events.3005.desc:1 "เรากำลังเดินอยู่ท่ามกลางเนินเขาในช่วงเย็น ความมืดมาถึงอย่างกะทันหัน นำมาโดยเมฆดำทะมึนเหนือหัวเรา จากนั้น ก็มีเสียงฟ้าร้องดังสนั่นจากระยะไกล ในไม่ช้า ก็มีอีกครั้ง ควบคู่ไปกับแสงวาบของฟ้าผ่าที่ ทำให้ตาพร่า\n\nและอีกครั้งที่ฟ้าผ่า ส่องสว่างพื้นที่อย่างเจิดจ้า ภาพติดตาถูกเผาไหม้ในดวงตาของข้า ข้ากระพริบตาและเห็นว่าฟ้าผ่าลงที่ใด: บัดนี้ มีไฟป่าลุกลามอย่างรวดเร็ว และมันกำลังลามมาทางเรา!"
 travel_danger_events.3005.a:0 "หนีเร็ว!"
 travel_danger_events.3005.a.success:0 "เราวิ่งหนีไฟได้"
 travel_danger_events.3005.a.failure:0 "ไฟไล่ตามเราทันขณะวิ่งหนี!"
 travel_danger_events.3005.b:0 "ดับไฟก่อนที่มันจะลุกลามไปไกล!"
 travel_danger_events.3005.b.success:0 "ท่านดับไฟได้สำเร็จ"
 travel_danger_events.3005.b.failure:0 "ไฟถูกหยุดยั้ง แม้จะต้องแลกมาด้วยราคา"
 travel_danger_events.3005.b.c_failure:0 "ไฟเผาผลาญคณะเดินทางของข้า!"


