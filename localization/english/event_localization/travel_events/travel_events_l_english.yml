 travel_events.1010.b.aptitude:0 "[aptitude|E] ของ [good_travel_leader_option.GetFirstNamePossessiveNoTooltip] คือ [good_travel_leader_option.GetCourtPositionAptitude( GetCourtPositionType( 'travel_leader_court_position' ) )]"

 travel_events.1020.t:0 "[GetCourtPositionType('travel_leader_court_position').GetNameNoTooltip()] คนใหม่"
 travel_events.1020.intro.prev_leader_dead: "[GetCourtPositionType('travel_leader_court_position').GetName()] คนเก่าของข้า [old_travel_leader.GetFirstName] ได้ละสังขารของ[old_travel_leader.GetHerHis]ไปเมื่อ [old_travel_leader.GetSheHe] [old_travel_leader.GetDeathReason] เป็นการสมควรที่ข้าจะเลือกผู้อื่นมานำคณะผู้ติดตามของข้า\n\n"
 travel_events.1020.intro.fallback:0 "เมื่อตำแหน่ง [GetCourtPositionType('travel_leader_court_position').GetName()] ว่างลง ข้ามองไปยังคณะผู้ติดตามของข้า มีใครบ้างที่อาจรับใช้ได้ดี อย่างน้อยก็จนกว่าข้าจะกลับถึงบ้านและสามารถหาคนมาแทนที่ได้อย่างเหมาะสม?\n\n"
 travel_events.1020.desc.two_entourage_members:0 "อันที่จริง มีสองคนที่สามารถเข้ามาแทนที่ [old_travel_leader.GetFirstNamePossessiveNoTooltip] ได้อย่างง่ายดาย: ไม่ว่าจะเป็น [temp_caravan_master_option_1.GetName] [ROOT.Char.Custom2('RelationToMeShort',temp_caravan_master_option_1)] ของข้า หรือ [temp_caravan_master_option_2.GetName] [ROOT.Char.Custom2('RelationToMeShort',temp_caravan_master_option_2)] ของข้า ก็สามารถรับใช้ข้าได้ดีในยามคับขัน"
 travel_events.1020.desc.one_entourage_member:0 "มีเพียงคนเดียวในคณะผู้ติดตามของข้าที่สามารถรับตำแหน่งนี้ได้: [temp_caravan_master_option_1.GetFirstName] [ROOT.Char.Custom2('RelationToMeShort',temp_caravan_master_option_1)] ของข้า อย่างไรก็ตาม ชาวบ้านชื่อ [temp_caravan_master_option_2.GetName] ก็ได้เสนอบริการของ [temp_caravan_master_option_2.GetHerHis] เช่นกัน"
 travel_events.1020.desc.fallback:0 "น่าเสียดายที่ข้าไม่ไว้วางใจคนกลุ่มที่น่าสมเพชนี้ให้หาทางกลับบ้านจากตลาดได้ นับประสาอะไรกับการนำการเดินทางไปยัง [next_destination.GetName] โชคดีที่มีชาวบ้านสองคนเสนอบริการของพวกเขา"
 travel_events.1020.a:0 "ข้าจะเลือก [temp_caravan_master_option_1.GetFirstNameNoTooltip]"
 travel_events.1020.b:0 "[temp_caravan_master_option_2.GetFirstNameNoTooltip|U] จะทำได้ดีทีเดียว"
 travel_events.1020.a.aptitude:0 "[aptitude|E] ของ [temp_caravan_master_option_1.GetFirstNamePossessiveNoTooltip] คือ [temp_caravan_master_option_1.GetCourtPositionAptitude( GetCourtPositionType( 'travel_leader_court_position' ) )]"
 travel_events.1020.b.aptitude:0 "[aptitude|E] ของ [temp_caravan_master_option_2.GetFirstNamePossessiveNoTooltip] คือ [temp_caravan_master_option_2.GetCourtPositionAptitude( GetCourtPositionType( 'travel_leader_court_position' ) )]"

 travel_events.2200.t:0 "การประลองที่ถูกเรียกร้อง"
 travel_events.2200.desc:0 "[local_knight.GetWomanMan] ที่น่าเกรงขามกำลังยืนอยู่บนถนนข้างหน้าเรา\n\n"ข้าคือ [local_knight.GetName] แห่ง [local_knight.GetCurrentLocation.GetNameNoTooltip]! ข้าเอาชนะ [ROOT.Char.GetWomenMen] มาแล้วหลายสิบคนในการต่อสู้! และบอกตามตรง การต่อสู้เหล่านั้นน่าเบื่อทั้งหมด ดังนั้นข้าจึงมาอยู่ที่นี่ บนถนนสายนี้ มองหาใครสักคนที่เก่งกว่าข้า ใครสักคนที่ข้าสามารถเรียนรู้ได้\n\nหากเจ้าสามารถเอาชนะข้าในการต่อสู้ได้ ข้าจะกลายเป็นผู้รับใช้ที่มีค่าและภักดี และ ดังนั้น ในวันนี้ ข้าขอพบกับพวกเจ้าคนหนึ่งในการต่อสู้ที่ยุติธรรม!""
 travel_events.2200.a:0 "ข้าไม่สนใจทั้งเจ้าและการต่อสู้ที่ยุติธรรม"
