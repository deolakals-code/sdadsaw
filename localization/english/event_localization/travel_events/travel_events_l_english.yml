l_english: 
#Travel Flavor Events

# Travel event prefix
 travel_event_prefix:0 "การเดินทาง:"

# Travel Death Events 
 travel_events.0010.t:0 "ปลายทาง"
 travel_events.0010.intro:0 "ข้านั่งอยู่ที่โต๊ะ กำลังจะรับประทานอาหารเช้า แต่ความหิวทั้งหมดได้หายไป ข้ารู้สึกว่ามีบางอย่างผิดปกติ และข้ารู้ว่านี่เป็นความจริงเมื่อข้าเห็น [messenger.GetFirstNameNoTooltip] [ROOT.Char.Custom2('RelationToMe',messenger)] ของข้า เดินเข้ามาอย่างเศร้าสร้อย\n\n"ข้า แต่ [ROOT.Char.GetTitleAsNameNoTooltip] ของข้าพเจ้า ผู้ส่งสารมาถึงในยามค่ำคืนพร้อมข่าวร้ายพ่ะย่ะค่ะ" [messenger.GetSheHe] กล่าวเบาๆ\n\n"ข้าเกรงว่า... ข้าเกรงว่า [predecessor.GetTitledFirstNameNoTooltip] [ROOT.Char.Custom2('RelationToMe',predecessor)] ของท่าน [predecessor.GetDeathReason] "
 travel_events.0010.to_activity:0 "[predecessor.GetSheHe|U] อยู่ใน [predecessor_location.GetName] บนเส้นทางสู่ [travel_destination.GetNameNoTooltip] "
 travel_events.0010.at_destination:0 "[predecessor.GetSheHe|U] อยู่ใน [predecessor_location.GetName] "
 travel_events.0010.from_activity:0 "[predecessor.GetSheHe|U] กำลังเดินทางกลับบ้านในจังหวัด [predecessor_location.GetName] หลังจากไปเยือน [travel_destination.GetNameNoTooltip] "
 travel_events.0010.desc:0 "$travel_events.0011.desc$""
 travel_events.0010.a:0 "[predecessor.GetSheHe|U] ไม่สมควรตายไกลบ้าน เช่นนี้..."

 travel_events.0011.desc_opening:0 "[messenger.Custom2('AppropriateGreeting', ROOT.Char)]"
 travel_events.0011.intro:0 "ข้าเสียใจที่ต้องเขียนแจ้งข่าวร้าย เช่นนี้ แต่เราเพิ่งได้รับข่าวว่า [predecessor.GetTitledFirstNameNoTooltip] [ROOT.Char.Custom2('RelationToMe',predecessor)] ของท่าน [predecessor.GetDeathReason]\n\n"
 travel_events.0011.desc:0 "เมื่อ [predecessor.GetSheHe] สิ้นชีพ ข้าขอแสดงความเสียใจอย่างสุดซึ้ง [ROOT.Char.Custom('FormOfAddressForLiege')]"

#Travel lifestyle trait adoption
 travel_events.0050.t:0 "เสียงเรียกแห่งท้องถนน"
 travel_events.0050.landed: "นับตั้งแต่จากบ้านมาเมื่อ [ROOT.Char.Custom('GetPeriodOfTimeWord')] ก่อน"
 travel_events.0050.adventurer: "นับตั้งแต่ออกเดินทางจาก [ROOT.Char.GetTravelPlan.GetData.GetDepartureLocation.GetName] เมื่อ [ROOT.Char.Custom('GetPeriodOfTimeWord')] ก่อน"
 travel_events.0050.desc:1 "ข้าได้เห็นทั้งจุดสูงสุดและต่ำสุด ― รื่นเริงกับสายลมที่พัดผ่านเส้นผมและคร่ำครวญถึงก้อนหินในรองเท้าบู๊ต\n\nมีสถานที่มากมาย สิ่งต่างๆ มากมายที่ข้ายังไม่เคยเห็น ที่นั่น บนถนนที่เปิดโล่ง ข้ารู้สึกเป็นอิสระจากการถูกกักขังใน [ROOT.Char.Custom('GetCourt')] แม้เพียงชั่วครู่\n\nท้องถนนเต็มไปด้วยผู้แสวงบุญและนักพเนจร บางทีอาจเป็นท่ามกลาง #EMP พวกเขา#! ที่ข้าจะพบความสงบในใจ\n\n"
 travel_events.0050.a:0 "ณ ที่แห่งนี้ ข้าเป็นอิสระอย่างแท้จริง"

#Peasant with no shoes
 travel_events.1000.t:0 "วิญญาณผู้น่าสงสาร"
 travel_events.1000.desc:0 "ขณะที่ขบวนเคลื่อนผ่าน [ROOT.Char.GetCurrentLocation.GetTerrain.GetNameNoTooltip|l] แห่ง [ROOT.Char.GetCurrentLocation.GetNameNoTooltip] ข้าเห็นชาวบ้านคนหนึ่งเดินอยู่ข้างถนนโดยไม่มีรองเท้า เท้าของ [shoeless_peasant.GetHerHis|U] เต็มไปด้วยเลือดและบวมเป่ง: เห็นได้ชัดว่า [shoeless_peasant.GetSheHe|U] ต้องเดินมาเป็นเวลานาน\n\nขณะที่ข้าผ่าน [shoeless_peasant.GetHerHim] ไป ข้ามองใบหน้าของ [shoeless_peasant.GetHerHis] อย่างใกล้ชิด ดวงตาอันแสนเศร้า ใบหน้าที่บิดเบี้ยวด้วยความเจ็บปวด บางทีข้าอาจช่วยอะไรได้บ้าง? "
 travel_events.1000.a:0 "หารองเท้าให้ [shoeless_peasant.GetHerHim]!"
 travel_events.1000.b:0 "บางที [shoeless_peasant.GetSheHe] อาจต้องการร่วมเดินทางกับเรา?"
 travel_events.1000.c:0 "ไม่ใช่ธุระกงการอะไรของข้า ใช่หรือไม่?"
 travel_events.1001.title:0 "ขุนนางปลอมตัวมา!"
 travel_events.1001.desc:0 "เมื่อรองเท้าปกคลุมเท้าอันด้านหนาของ [shoeless_peasant.GetHerHis] แล้ว ชาวบ้านผู้นั้นก็ยิ้มให้ข้าอย่างรู้ทันและเดินมาเคียงข้างข้า\n\n"ท่านเป็น [ROOT.Char.GetTitleAsNameNoTooltip|U] ที่ดีและมีเมตตา และความเมตตานั้นจะได้รับการตอบแทน! ข้าคือ [shoeless_peasant.GetName] แห่งตระกูล [shoeless_peasant.GetDynastyName] และข้ามักจะตอบแทนผู้ที่มีจิตใจดีงามเสมอ""
 travel_events.1001.desc.outro.poet:0 "\n\nดูเหมือนว่า [shoeless_peasant.GetWomanMan] ผู้นี้ไม่ใช่ชาวบ้านเลย แต่เป็นกวีผู้มีชื่อเสียงโด่งดัง!"
 travel_events.1001.desc.outro:0 "\n\nดูเหมือนว่า [shoeless_peasant.GetWomanMan] ผู้นี้ไม่ใช่ชาวบ้านเลย แต่เป็นขุนนางผู้มั่งคั่ง!"
 travel_events.1001.a:0 "ข้าขอน้อมรับด้วยความยินดี"
 travel_events.1001.c:0 "ขอให้เราก้าวไปข้างหน้าในฐานะสหาย!"
 travel_events.1002.title:0 "$travel_events.1001.title$"
 travel_events.1002.desc:0 "ขณะที่เราขี่ม้าผ่านไป ชาวบ้านผู้นั้นคว้าเสื้อผ้าของข้าด้วยมืออันสกปรกของ [shoeless_peasant.GetHerHis] และจ้องลึกเข้ามาในดวงตาของข้า\n\n"นี่ไม่ใช่พฤติกรรมที่เหมาะสมกับ [ROOT.Char.GetTitleAsNameNoTooltip|U] ใช่หรือไม่? หากท่านรู้ว่าข้าเป็นใคร ท่านคงไม่ปล่อยให้ข้าเป็น เช่นนี้ต่อไป!"\n\n[shoeless_peasant.GetSheHe|U] เปิดเผยว่า [shoeless_peasant.GetHerselfHimself] เป็นขุนนางจากตระกูล [shoeless_peasant.GetDynastyName] และดูเหมือนจะดูหมิ่นข้าอย่างที่สุดในตอนนี้"
 travel_events.1002.a:0 "ข้าจะรู้ได้อย่างไร?"
 friend_showed_charity:0 "[CHARACTER.GetShortUIName|U] แสดงความเมตตาอย่างยิ่งต่อ [TARGET_CHARACTER.GetShortUIName]"
 friend_showed_charity_corresponding:0 "[TARGET_CHARACTER.GetShortUIName|U] แสดงความเมตตาอย่างยิ่งต่อ [CHARACTER.GetShortUIName]"
 rival_ungenerous:0 "[CHARACTER.GetShortUIName|U] ปฏิเสธที่จะช่วยเหลือ [TARGET_CHARACTER.GetShortUIName] ในยามที่ [TARGET_CHARACTER.GetHerHis] ต้องการความเมตตา"
 rival_ungenerous_corresponding:0 "[TARGET_CHARACTER.GetShortUIName|U] ปฏิเสธที่จะช่วยเหลือ [CHARACTER.GetShortUIName] ในยามที่ [CHARACTER.GetHerHis] ต้องการความเมตตา"

#Bandit attack
 travel_events.1003.t:0 "$travel_danger_prefix$ ผู้เก็บค่าผ่านทาง"
 travel_events.1003.desc:1 "เราอยู่บนถนนนานเกินไปเล็กน้อยและดวงอาทิตย์เริ่มคล้อยต่ำลับขอบฟ้า จากภูมิประเทศโดยรอบ รูปร่างต่างๆ เริ่มปรากฏและรวมตัวเป็นกลุ่มคนติดอาวุธท่าทางเกรี้ยวกราด \n\n "ถนนสายนี้มีค่าผ่านทาง จ่ายมา" ชายที่ตัวใหญ่ที่สุดและพูดตามตรงว่าน่าเกลียดที่สุดในกลุ่มกล่าว\n\n[travel_leader.GetFirstName] [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('travel_leader'))] ของข้าก้าวไปข้างหน้า ชูอาวุธขึ้นและมองมาที่ข้าเพื่อรอคำสั่ง"

 travel_events.1003.a:0 "อา แน่นอน ค่าผ่านทาง"
 travel_events.1003.b:0 "บางทีเจ้าอาจรับการชำระเป็นเลือด?"
 travel_events.1003.c:0 "ค่าผ่านทางมีไว้สำหรับชาวบ้าน และข้าคือ [ROOT.Char.GetTitleAsNameNoTooltip]"
 travel_events.1003.a.success:0 "ด้วยความหวาดกลัว พวกมันปล่อยให้ท่านผ่านไป"
 travel_events.1003.a.failure:0 "ท่านยังคงต้องต่อสู้ฝ่าฟันไป"

 travel_events.1005.t:1 "$travel_danger_prefix$ ค่าผ่านทางแด่ [ROOT.Char.GetFaith.WaterGodNamePossessive]"
 travel_events.1005.desc:0 "ลมกระโชกแรงและพายุฝนที่ยังคงอยู่ ทำให้เรือโคลงเคลงและเอียงไปมาเป็นเวลาหลายชั่วโมง และขณะที่ข้ายืนอยู่บนดาดฟ้าเรือ เกาะเสากระโดงไว้อย่างแน่นหนา ข้าเห็นหีบที่บรรจุ [overboard_artifact.GetName] ของข้าหลุดออกมา!\n\nข้าอยู่ไกลเกินไปที่จะช่วยมันด้วยตนเอง แต่ [travel_leader.GetFirstName] อยู่ในระยะที่เอื้อมถึง อย่างไรก็ตาม [travel_leader.GetSheHe] จะเสี่ยงต่อการตกน้ำ"
 travel_events.1005.a:0 "ช่วยมันไว้!"
 travel_events.1005.b:0 "มันไม่คุ้มกับความเสี่ยง"

 travel_events.4000.t:0 "ว่าด้วยการเดินทางที่จะมาถึง"
 travel_events.4000.desc.intro:0 "ขณะเดินทางผ่าน [ROOT.Char.GetCurrentLocation.GetName] ข้าผ่านกระโจมรูปร่างประหลาดที่เปิดอ้าซ่าพร้อมกับผู้อยู่อาศัยที่ดูประหลาดยิ่งกว่าอยู่ข้างใน\n\n"เข้ามาสิ โอ้ [ROOT.Char.GetTitleAsNameNoTooltip|U] ผู้ยิ่งใหญ่""
 travel_events.4000.desc.mid.long_to_go:0 "ข้าบอกได้ว่าท่านยังต้องเดินทางอีกหลายไมล์"
 travel_events.4000.desc.mid.travelled_far:0 "ข้าเห็นว่าท่านมาจากแดนไกลแสนไกล"
 travel_events.4000.desc.outro:0 "และข้าสามารถเสนอการอ่านอนาคตการเดินทางของท่านให้ได้ ในราคาพอประมาณ"\n\n[mystic_scope.GetWomanMan] ประหลาดผู้นี้ได้กระตุ้นความสนใจของคณะผู้ติดตามของข้า แต่ข้ายินดีที่จะจ่ายเงินเพื่อ 'การอ่าน' หรือไม่?"
 travel_events.4000.a:0 "บอกอนาคตของข้ามาเถิด ท่านผู้มีปัญญา"
 travel_events.4000.b:0 "มาสัมผัสอนาคต #EMP กับ#! ข้าสิ"
 travel_events.4000.c:0 "ข้าไม่สนใจ"
 travel_events.4000.d:0 "ปิดกระโจมแล้วเผาแม่มดนี่เสีย!"
 travel.good_reading:0 "การเดินทางของท่านเป็นลางดี"
 travel.bad_reading:0 "การเดินทางของท่านเป็นลางร้าย"

 travel_events.4001.t:0 "ผู้คลั่งไคล้"
 travel_events.4001.desc:1 "คณะผู้ติดตามของข้าเดินทางผ่าน [ROOT.Char.GetCurrentLocation.GetName] โดยไม่มีปัญหา จนกระทั่งข้าได้ยินเสียงเอะอะโวยวายดังมาจากรอบๆ ทหารองครักษ์ของข้า ในที่สุด คนแปลกหน้าคนหนึ่งก็สามารถผลักดันฝ่าเข้ามาและยืนอยู่ข้างกายข้า ใบหน้าเปล่งปลั่งราวกับได้รับพรจาก [ROOT.Char.GetFaith.HighGodName] [ROOT.Char.GetFaith.HighGodHerselfHimself]\n\n"ด้วยนามแห่ง [loyal_fan_scope.GetFaith.random_GoodGodNames]! ด้วยนามแห่ง [loyal_fan_scope.GetFaith.random_GoodGodNames]! ด้วยนามแห่ง [loyal_fan_scope.GetFaith.random_GoodGodNames]! นั่นคือ [ROOT.Char.GetTitleAsNameNoTooltip|U] แห่ง [ROOT.Char.GetPrimaryTitle.GetNameNoTierNoTooltip]! ข้าไม่ปรารถนาสิ่งใดมากไปกว่าการรับใช้ท่านอย่างไม่มีเงื่อนไขไปตลอดชีวิต!"\n\nทหารองครักษ์ของข้าเตรียมพร้อมที่จะโยน [loyal_fan_scope.GetHerHim] กลับลงไปในโคลน แต่ [loyal_fan_scope.GetSheHe] คงจะเป็นข้าราชบริพารที่ภักดีอย่างแน่นอน"
 travel_events.4001.a:0 "จงเข้าร่วมกับข้า"
 travel_events.4001.b:0 "นี่ เหรียญสำหรับความภักดีของเจ้า"
 travel_events.4001.c:0 "กลับไปยังคูคลองที่เจ้าจากมาเสีย"

 travel_events.4002.t:0 "[local_beauty_scope.GetCulture.GetNameNoTooltip] [local_beauty_scope.GetWomenMen|U]"
 travel_events.4002.desc:0 "ข้าได้เห็นโลกและประสบพบเจอสิ่งมหัศจรรย์มากมายในการเดินทาง แต่ข้าไม่เคยประสบพบเจอความงามใดๆ เช่นเดียวกับที่ข้าได้เห็นใน [ROOT.Char.GetCurrentLocation.GetName] อย่างแท้จริง [local_beauty_scope.GetCulture.GetName] [local_beauty_scope.GetWomenMen] นั้นเหนือกว่าผู้อื่นทั้งปวง\n\nตัวอย่างที่น่าหลงใหลเป็นพิเศษคนหนึ่งได้ดึงดูดสายตาของข้าเมื่อไม่นานมานี้ เป็น [local_beauty_scope.GetWomanMan] ชาวบ้านนามว่า [local_beauty_scope.GetName]\n\n[local_beauty_scope.Custom('LoverPetName')] น้อยผู้น่ารัก [local_beauty_scope.GetSheHe] ช่างน่าพึงพอใจต่อสายตาของข้าเกินกว่าจะใช้ชีวิต [local_beauty_scope.GetHerHis] ไปกับการตรากตรำทำงานใน [ROOT.Char.GetCurrentLocation.GetNameNoTooltip]"
 travel_events.4002.a:0 "คู่รักคนใหม่ของข้า"
 travel_events.4002.b:0 "[local_beauty_scope.GetSheHe|U] ต้องอยู่เคียงข้างข้าตลอดไป"
 travel_events.4002.c:0 "เราต้อง แต่งงานกันทันที!"
 travel_events.4002.d:0 "อนิจจา ข้าไม่สามารถมอบความรักของข้าให้ได้อย่างอิสระ เช่นนั้น"

 travel_events.4003.t:0 "อสูรร้ายที่ขอบฟ้า"
 travel_events.4003.desc.intro:0 "ทะเลเต็มไปด้วยหมอกหนา โขดหินและคลื่นปรากฏขึ้นและหายไปในพริบตา เงาร่างมหึมาปรากฏขึ้นที่ขอบฟ้า และทุกอย่างดูสงบเงียบ จนกระทั่งอสูรร้ายโผล่ออกมาจากหมอกให้เห็นชัดเจน\n\n"
 travel_events.4003.desc.viking:1 "หัวมังกรเข้าใกล้เรือของเรา พร้อมกับลูกเรือชาวเหนือที่ดุร้ายโห่ร้องอยู่บนหลังของมัน!"
 travel_events.4003.desc.berber_pirate:1 "เรือลำใหญ่ที่บรรทุกของปล้นปรากฏขึ้นที่ขอบฟ้า พร้อมกับลูกเรือโจรสลัดบาร์บารีชูใบมีด เตรียมพร้อมที่จะโจมตี!"
 travel_events.4003.desc.regular_pirate:1 "เรือที่เต็มไปด้วยโจรและขโมยที่สกปรกมอมแมมเข้าใกล้เรา รอยยิ้มไร้ฟันของพวกมันกระตือรือร้นที่จะวางนิ้วเค็มๆ ของพวกมันลงบนทรัพย์สมบัติของเรา"
 travel_events.4003.a:0 "เราจะสู้ขับไล่พวกมัน!"
 travel_events.4003.b:0 "แค่ปล่อยให้พวกมันเอาสิ่งที่ต้องการไป"
 travel_events.4003.c:0 "พยายามหลบหนีพวกมันในสายหมอก!"
 travel_events.4003.d:0 "ลิ้นเงินของข้าจะ ทำให้พวกมันเป็นพันธมิตรได้!"
 travel_events.4003.offer_accepted:0 "[viking_scope.GetFirstName] ยอมรับข้อเสนอของท่าน"
 travel_events.4003.offer_refused:0 "[viking_scope.GetFirstName] ปฏิเสธข้อเสนอของท่าน"

 travel_events.4004.t:0 "ปลาในทะเล"
 travel_events.4004.desc:0 "ข้าเคยได้ยินมาว่าชาวประมง [fishermen_county_scope.GetCountyData.GetCulture.GetName] มีชื่อเสียงไปทั่วโลกในด้านความสามารถในการกวาดต้อนสมบัติอันอุดมสมบูรณ์และอร่อยที่สุดจากมหาสมุทร วันนี้ ริมชายฝั่ง [fishermen_county_scope.GetNameNoTierNoTooltip] ข้าโชคดีพอที่จะได้พบกับกองเรือประมง [fishermen_county_scope.GetCountyData.GetCulture.GetNameNoTooltip]!\n\nคณะผู้ติดตามของเราแล่นเรือเข้าใกล้เรือลำหนึ่งที่พลัดหลงจากกองเรือ และข้าได้รับการต้อนรับทันทีด้วยกลิ่นฉุนของกัปตันเรือ\n\n"เป็นเกียรติอย่างยิ่ง นายท่าน/นายหญิงของข้า [ROOT.Char.GetLadyLord] สนใจปลาที่ดีที่สุดที่เราจับได้ในวันนี้หรือไม่ขอรับ?""
 travel_events.4004.a:0 "คืนนี้เราจะได้กินดี!"
 travel_events.4004.b:0 "ปลาของเจ้าหรือชีวิตของเจ้า กะลาสี!"
 travel_events.4004.c:0 "ไม่ใช่วันนี้"

 travel_events.4005.t:0 "ของกระจุกกระจิกหายาก"
 travel_events.4005.desc:0 "ทะเลแถวนี้หนาแน่นไปด้วยพ่อค้าชาว [merchant_character_scope.GetCulture.GetName] ที่กำลังประกอบอาชีพตามปกติ ขนส่งสินค้าหายากและแปลกใหม่จากท่าเรือหนึ่งไปยังอีกท่าเรือหนึ่ง\n\nเรือค้าขายลำหนึ่งมีสิ่งของชิ้นหนึ่งอยู่ภายใน ซึ่งดึงดูดความสนใจของข้าทันที ทันทีที่ข้าเห็น [merchant_artifact_scope.GetName] ข้ารู้ว่าข้าไม่มีทางหาสิ่งใด เช่นนี้ได้ใน [ROOT.Char.GetPrimaryTitle.GetNameNoTierNoTooltip] และมันต้องเป็นของข้าอย่างแน่นอน"
 travel_events.4005.a:0 "และมันจะเป็นของข้า!"
 travel_events.4005.b:0 "ข้าจะขโมยมัน!"
 travel_events.4005.c:0 "อนิจจา ข้าไม่สามารถให้เหตุผลกับการใช้จ่ายที่ประมาท เช่นนี้ได้"

 travel_events.4006.t:0 "ขโมยมีปีก"
 travel_events.4006.desc:0 "ข้าตื่นจากภวังค์ในการเดินทางอันผ่อนคลายข้ามทะลอันกว้างใหญ่ด้วยเสียงกรีดร้องฉับพลัน! ข้าวิ่งพรวดไปยังห้องเก็บเสบียงใต้ท้องเรือและต้องตกใจสุดขีดเมื่อพบ [ROOT.Char.Custom('GetRandomMigratoryBird')] อยู่ข้างซากเสบียงที่ถูกฉีกทำลาย ขนของมันตึงเปรี๊ยะแนบไปกับท้องที่ป่องอืดอันน่าสะอิดสะเอียน\n\nด้วยความพิโรธ ข้าเกือบจะสังหารภยันตรายติดปีกอันน่ารังเกียจนั้นทันที แต่ก็ถูก [superstituous_caravan_member.Custom2('MyCharacterIntroduction', ROOT.Char)] หยุดไว้\n\n"ฟังก่อน! หยุดมือท่านเดี๋ยวนี้ เจ้า [ROOT.Char.Custom2('InsultNoun', SCOPE.sC('superstitious_caravan_member'))] [ROOT.Char.Custom2('InsultAdjective', SCOPE.sC('superstitious_caravan_member'))]! ท่านไม่รู้หรือว่าการฆ่านกในทะลเป็นลางร้าย""
 travel_events.4006.a:0 "ข้าจะแสดงความเมตตา"
 travel_events.4006.b:0 "ไม่มีอะไรจะหยุดข้าจากการฆ่านกบ้าตัวนี้ได้!"

 travel_events.4007.t:1 "$travel_danger_prefix$ อากาศพายุ"
 travel_events.4007.desc:0 "[ROOT.Char.GetFaith.WaterGodName] เห็นได้ชัดว่าไม่โปรดปรานการเดินทางของเรา เนื่องจากคลื่นขนาดเท่าปราสาทซัดกระหน่ำลงมาบนเรือลำน้อยของเรา! เรือโคลงเคลงไปมา ชายหญิงต่างเกาะติดกับทุกสิ่งที่ทำได้เพื่อไม่ให้ตกน้ำขณะที่เรือใกล้จะล่มเต็มที\n\nแน่นอนว่าข้าถูกซ่อนตัวอยู่กับขุนนางคนอื่นๆ ในส่วนที่ปลอดภัยที่สุดของเรือ แต่ขณะที่ท้องฟ้าลุกไหม้ด้วยสายฟ้าและทะเลซัดกระหน่ำลงมาใส่เราด้วยพละกำลังทั้งหมด ข้าเกรงว่าข้าจะไม่มีชีวิตรอดไปเห็นวันพรุ่งนี้หากข้าพยายามเอาชีวิตรอดด้วยศรัทธาเพียงอย่างเดียว"
 travel_events.4007.a:0 "ข้าเชื่อใจกัปตันของเรา"
 travel_events.4007.b:0 "ด้วยนามแห่ง [ROOT.Char.GetFaith.WaterGodName] ข้าจะคุมหางเสือด้วยตนเอง!"
 travel_events.4007.c:0 "ตามเรือท้องถิ่นบางลำฝ่าพายุไป"

 travel_events.4008.t:1 "เรือร้าง"
 travel_events.4008.desc:0 "วันนี้ทะเลสงบและให้อภัย นิ่งสงบดุจก้อนหินและมีลมแรงพัดหนุนหลังเราอีกด้วย ดูเหมือนว่าจะเป็นวันที่ง่ายสำหรับคนพายเรือด้านล่าง แต่แล้วข้าก็เห็นซากเรือที่พังยับเยินปักหัวลงไปในโขดหินขรุขระบางส่วนข้างหน้า\n\nดูเหมือนจะไม่มีผู้รอดชีวิต และโขดหินก็ไม่ใช่เรื่องเล็กน้อยที่จะนำทาง แต่ข้ารู้สึกถูกกระตุ้นให้ไปตรวจสอบซากเรือลึกลับนี้"
 travel_events.4008.a:0 "ไปตรวจสอบกันเถอะ"
 travel_events.4008.b:0 "ไม่มีอะไรนอกจากความตายทางนั้น"

 travel_events.4009.t:1 "เรือร้าง: ของกระจุกกระจิก"
 travel_events.4009.desc:0 "ตามที่คาดไว้ ซากเรือไม่มีสิ่งมีชีวิตใดๆ ยกเว้นนกสองสามตัวที่กำลังจิกกินซากศพที่ถูกกินไปครึ่งหนึ่งของนักเดินทางที่มาก่อนเรา\n\nเมื่อตรวจสอบอย่างใกล้ชิด ข้าเห็นบางสิ่งส่องแสงอยู่ในจะงอยปากที่เปื้อนเลือดของนกตัวหนึ่ง ด้วยเสียงร้องแหลมสูง มันทิ้งวัตถุนั้นลงในซากเรือและบินหนีไป ปล่อยให้ข้าเก็บวัตถุที่น่าสนใจนี้"
 travel_events.4009.a:0 "ของวิเศษ!"

 travel_events.4010.t:1 "เรือร้าง: ทรัพย์สมบัติ"
 travel_events.4010.desc:0 "เช่นเดียวกับที่ทุกคนสันนิษฐานไว้ ไม่มีผู้รอดชีวิตจากซากเรือ อย่างไรก็ตาม เสื้อผ้าและสินค้าที่ทิ้งไว้บนซากศพบ่งชี้ว่านี่เคยเป็นเรือค้าขายที่มั่งคั่ง!\n\nท่ามกลางซากเรือ ข้าเห็นสินค้าแปลกใหม่และเสื้อผ้าหรูหราที่ยังคงสภาพสมบูรณ์ ยกเว้นเปียกเล็กน้อย ไม่ต้องสงสัยเลยว่าสิ่งของเหล่านี้จะขายได้ราคาดีเมื่อเราขึ้นฝั่ง"
 travel_events.4010.a:0 "ของดีที่พบ!"

 travel_events.4011.t:1 "เรือร้าง: ผู้รอดชีวิต"
 travel_events.4011.desc:0 "น่าประหลาดใจอย่างยิ่ง ข้าเริ่มได้ยินเสียงเรียกเรือของเราขณะที่เราเข้าใกล้ซากเรือ [castaway_scope.GetWomanMan] ผู้นั้นดูเหมือนจะเป็นขุนนางผู้มั่งคั่งลอยอยู่บนซากประตู\n\n"สวัสดี! ข้าคิดว่าข้าจะไม่ได้เห็นวิญญาณอื่นอีกเลยก่อนที่ทะเลจะพรากข้าไป เช่นเดียวกับที่มันทำกับสหายของข้า"\n\n[castaway_scope.GetSheHe|U] แนะนำ [castaway_scope.GetHerselfHimself] ว่าชื่อ [castaway_scope.GetName] อ้างว่าเป็นขุนนางจาก [nearby_coast_scope.GetName] และได้เสนอที่จะจ่ายค่าเดินทางและค่าเพื่อนร่วมทางอย่างปลอดภัย"
 travel_events.4011.a:0 "เราจะช่วยท่านขึ้นฝั่ง"
 travel_events.4011.b:0 "ร่วมเดินทางไปกับเราสิ!"
 travel_events.4011.c:0 "ข้าเกรงว่าข้าจะไม่ได้ยินท่าน..."

 travel_events.4012.t:0 "[feral_child_scope.GetFirstNameNoTooltip] [feral_child_scope.Custom('GirlBoy')|U] แห่ง [feral_child_scope.Custom('GetAnimalType')|U]"
 travel_events.4012.desc:1 "ขณะที่เราเดินทางผ่านดินแดนป่าเถื่อนแห่ง [ROOT.Char.GetCurrentLocation.GetNameNoTooltip] ข้ารู้สึกได้อย่างชัดเจนว่ากำลังถูกจับตามอง ข้าเห็น [feral_child_scope.Custom('GirlBoy')] ที่ผอมบาง สกปรก ซ่อนตัวอยู่ แม้จะซ่อนได้ไม่ดีนัก กำลังเฝ้ามองคณะผู้ติดตามของเรา\n\nสมาชิกคนหนึ่งในกองคาราวานของเราแจ้งข้าว่าชาวบ้านกล่าวว่าดินแดนเหล่านี้ถูกหลอกหลอนโดยใครบางคนที่พวกเขาเรียกว่า [feral_child_scope.GetFirstNameNoTooltip] ซึ่งกล่าวกันว่าถูกเลี้ยงดูมาห่างไกลจากสังคมมนุษย์โดย [feral_child_scope.Custom('GetAnimalType')]\n\nเห็นได้ชัดว่าสิ่งมีชีวิตที่น่าสงสารนี้เกิดความหลงใหลในตัวเรา และถึงกับเริ่มพูดภาษา [ROOT.Char.GetCulture.GetLanguage.GetNameNoTooltip] ขั้นพื้นฐานบางคำได้ แม้ว่าจะยังไม่ถึงระดับที่มีความหมายก็ตาม"
 travel_events.4012.a:0 "ข้าจะฝึกฝน [feral_child_scope.Custom('GirlBoy')] เอง!"
 travel_events.4012.b:0 "แค่เพิกเฉยต่อ [feral_child_scope.GetHerHim]"
 travel_events.4012.c:0 "ไล่ [feral_child_scope.GetHerHim] กลับไปหาเพื่อน [feral_child_scope.Custom('GetAnimalType')] ของ [feral_child_scope.GetHerHis] เสีย!"

 travel_events.4013.t:0 "[feral_child_scope.GetFirstNameNoTooltip] ความก้าวหน้า"
 travel_events.4013.desc:0 "แม้ว่าจะไม่มีใครกล้าฝันถึง แต่ดูเหมือนว่าจะมีความก้าวหน้าในพัฒนาการของ [feral_child_scope.GetFirstNamePossessive]!\n\nครั้งหนึ่งเคยเป็นเพียงเด็กน้อยที่ถูกเลี้ยงดูโดยสัตว์ป่า บัดนี้ [feral_child_scope.Custom('GirlBoy')] กำลังแสดงความก้าวหน้าในที่สุด [feral_child_scope.GetFirstNameNoTooltip] พูดเป็นประโยคสมบูรณ์และเล่นกับเด็กคนอื่นๆ ในวัย [feral_child_scope.GetHerHis] ราวกับว่า [feral_child_scope.GetSheHe] เป็นหนึ่งในพวกเขามาโดยตลอด\n\nวันนี้หลังจากการเรียนตามปกติของเรา [feral_child_scope.GetSheHe] ถึงกับขอให้ข้าเป็น [ROOT.Char.GetMotherFather] ของ [feral_child_scope.GetHerHis]"
 travel_events.4013.a:0 "[feral_child_scope.GetSheHe|U] เป็น [feral_child_scope.Custom('GetDaughterSon')] ของข้า ไม่ว่าจะเป็นสายเลือดหรือไม่ก็ตาม"
 travel_events.4013.b:0 "ช่างเป็นชัยชนะอันยิ่งใหญ่!"

 travel_events.4014.t:0 "[feral_child_scope.GetFirstNameNoTooltip] โหยหาป่า"
 travel_events.4014.desc:0 "[feral_child_scope.GetFirstName] เป็นความท้าทายอย่างแท้จริงในการเป็นพี่เลี้ยง นั่นแน่นอน [feral_child_scope.GetSheHe|U] แทบจะไม่สามารถเรียงประโยคได้ และยังคงเดินด้อมๆ มองๆ เหมือนสัตว์ป่า การใช้ชีวิตในร่มดูเหมือนจะ ทำให้ [feral_child_scope.GetHerHim] เครียดอย่างมาก และเมื่อ [feral_child_scope.GetSheHe] ตัดสินใจที่จะพูด [feral_child_scope.GetSheHe] ก็พูดถึง แต่เรื่องการกลับคืนสู่ป่าเกือบจะโดยเฉพาะ\n\nข้ามองดูขณะที่ [feral_child_scope.GetSheHe] ยืนอย่างอึดอัดบนสองขาและทำท่าจะจากไป และด้วยเหตุผลบางอย่าง ข้ารู้ว่าครั้งนี้ [feral_child_scope.GetSheHe] กำลังจะจากไปตลอดกาล"
 travel_events.4014.a:0 "เดี๋ยวก่อน! ให้โอกาสข้าอีกครั้ง!"
 travel_events.4014.b:0 "ข้าจะไม่มีวันลืมเจ้า [feral_child_scope.GetFirstNameNoTooltip]"

 travel_events.4015.t:0 "กำแพงภาษา"
 travel_events.4015.desc:0 "ดูเหมือนว่ากองคาราวานของเราจะหลงทางเล็กน้อยในดินแดนต่างถิ่นเหล่านี้\n\n[travel_leader_scope.GetName] ติดตามเราไปรอบๆ [ROOT.Char.GetCurrentLocation.GetNameNoTooltip] เป็นเวลาหลายชั่วโมง และ แม้ว่าในที่สุด [travel_leader_scope.GetSheHe] จะกลืนความภาคภูมิใจของ [travel_leader_scope.GetHerHis] และถามทาง แต่ [travel_leader_scope.GetSheHe] ดูเหมือนจะไม่ใช่ผู้เชี่ยวชาญในการพูดภาษา [ROOT.Char.GetCurrentLocation.GetCulture.GetLanguage.GetNameNoTooltip]"
 travel_events.4015.a:0 "ให้ข้าลองดู"
 travel_events.4015.b:0 "โชคดีที่ข้าพูดภาษา [ROOT.Char.GetCurrentLocation.GetCulture.GetLanguage.GetNameNoTooltip] ได้คล่อง!"

 travel_events.4016.t:1 "$travel_danger_prefix$ ร้อนเกินไปแล้ว"
 travel_events.4016.desc.intro:0 "ข้าเดินทางมาไกลจากบ้าน และลมหนาวเย็นยะเยือกก็อยู่เบื้องหลังไปไกลแล้ว แม้ว่าในตอนแรกการเปลี่ยนแปลงสภาพอากาศจะเป็นที่น่าพอใจและน่าอัศจรรย์สำหรับผิวพรรณของข้า"
 travel_events.4016.desc.mid.dry_heat:0 "ผิวของข้าเริ่มเปลี่ยนเป็นสีแดงเข้มและน้ำก็ไหลผ่านตัวข้าเหมือนทรายผ่านตะแกรง"
 travel_events.4016.desc.mid.humid_heat:0 "อากาศที่หนาแน่นไปด้วยความชื้น ทำให้ข้ารู้สึกเหมือนกำลังหายใจผ่านผ้าชื้นๆ"
 travel_events.4016.desc.outro:0 "\n\nน้ำเย็นและสดชื่น และช่วยบรรเทาอาการอ่อนเพลียจากความร้อนนี้ได้อย่างมาก แต่มันก็ยังไม่เพียงพอ"
 travel_events.4016.a:0 "ดวงอาทิตย์ ทำสิ่งที่เลวร้ายที่สุดของเจ้ามา!"
 travel.got_heatstroke:0 "ท่านมีอาการลมแดด"
 travel.found_a_place_to_cool:0 "ท่านพบแม่น้ำที่เย็นสบาย"
 travel_events.4016.b:0 "ข้าต้องการน้ำ!"
 every_entourage_tt:0 "สมาชิกคณะผู้ติดตามทุกคน"
 travel.stole_water:0 "ท่านขโมยจิบน้ำเย็นๆ"
 travel.caught_stealing_water:0 "ท่านถูกจับได้!"

 travel_events.4017.t:0 "ดาบรับจ้าง"
 travel_events.4017.desc.intro:0 "ข้าเคยได้ยินเรื่องราวการหาประโยชน์ทางทหารของทหารรับจ้าง [ROOT.Char.GetCurrentLocation.GetCulture.GetName] ในตำนาน และขณะเดินทางผ่าน [ROOT.Char.GetCurrentLocation.GetName] ข้าโชคดีพอที่จะได้พบกับผู้บัญชาการทหารรับจ้างที่มีทักษะสูง!\n\n"
 travel_events.4017.desc.mid.nomad:0 "[warrior_scope.GetName] ยกย่อง [warrior_scope.GetHerselfHimself] ว่าเป็นนักรบที่น่าสะพรึงกลัวที่สุดในทุ่งหญ้าสเตปป์ทั้งหมด"
 travel_events.4017.desc.mid.swordsman:0 "[warrior_scope.GetName] อ้างว่า [warrior_scope.GetSheHe] เป็นนักดาบ [ROOT.Char.GetCurrentLocation.GetCulture.GetNameNoTooltip] [warrior_scope.GetWomanMan] ที่เก่งที่สุดในโลก"
 travel_events.4017.desc.outro:0 "และจะรู้สึกเป็นเกียรติอย่างยิ่งที่จะได้รับใช้ หากได้ราคาที่เหมาะสม"
 travel_events.4017.a:0 "และราคาที่เหมาะสม [warrior_scope.GetSheHe] จะได้รับ!"
 travel_events.4017.b:0 "ข้ามั่นใจว่าเราสามารถเจรจาเรื่องนี้ได้"
 travel.haggle_succesful:0 "ท่านต่อรองราคาสำเร็จ!"
 travel.haggle_failed:0 "[warrior_scope.GetName] รู้สึกถูกดูหมิ่น"
 travel_events.4017.c:0 "บางทีเราอาจใช้ความสัมพันธ์นี้สำหรับข้อตกลงในอนาคต..."
 travel_events.4017.d:0 "ข้าไม่คิด เช่นนั้น"

 travel_events.4018.t:0 "นักพรต [ROOT.Char.GetCurrentLocation.GetCulture.GetNameNoTooltip]"
 travel_events.4018.desc.intro:1 "เราได้ยินมาว่า [ROOT.Char.GetCurrentLocation.GetCounty.GetTitle.GetHolder.GetPrimaryTitle.GetNameNoTierNoTooltip] เป็นดินแดนที่เต็มไปด้วยนักบุญที่เดินทางในสภาพยากจน มักดำรงชีวิตอยู่ด้วยศรัทธาเพียงอย่างเดียว\n\nนักพรตคนหนึ่งได้เข้าใกล้กองคาราวานของเรา"
 travel_events.4018.desc.mid.mystic:0 "เทศนาปรัชญาลึกลับเฉพาะตัวของ [mystic_scope.GetHerHis] ให้กับทุกคนที่ยอมฟัง"
 travel_events.4018.desc.mid.preacher:0 "กล่าวถึงการตีความพระประสงค์ของ [mystic_scope.GetFaith.HighGodNamePossessive] ของ [mystic_scope.GetHerHis] และวิธีการดำเนินชีวิตที่เปี่ยมศรัทธา"
 travel_events.4018.desc.outro:0 "\n\nสิ่งมีชีวิตที่ยากจนดูเหมือนจะไม่เต็มใจที่จะจากกลุ่มของเราไป แต่บางทีข้าอาจกำจัด [mystic_scope.GetHerHim] ได้..."
 travel_events.4018.a:0 "ข้าเป็นปรมาจารย์ด้านการโต้วาที"
 travel.debate_won:0 "ท่านชนะการโต้วาที!"
 travel.debate_lost:0 "ท่านแพ้การโต้วาที"
 travel_events.4018.b:0 "[mystic_scope.GetSheHe|U] ก็มีประเด็นที่ดีอยู่บ้าง..."
 travel_events.4018.c:0 "ข้ามั่นใจว่าพวกเขาจะจากไปในที่สุด"
 travel_events.4018.d:0 "ถึงเวลาเผาพวกนอกรีตดีๆ สักครั้ง!"

 travel_events.4019.t:0 "อาหารอันโอชะชั้นต่ำ"
 travel_events.4019.desc:0 "ระหว่างทางผ่าน [ROOT.Char.GetCurrentLocation.GetName] ดูเหมือนเราจะบังเอิญเดินเข้ามาในตลาดอาหารท้องถิ่น! ทุกหนแห่ง เหล่าไพร่และขุนนางจากทุกวัฒนธรรมและภาษาต่างส่งเสียงจอแจรอบแผงขายอาหารแปลกตา อากาศอบอวลไปด้วยกลิ่นหอมที่ข้ามิเคยจินตนาการถึง\n\nจมูกของข้าถูกดึงดูดไปยังแผงลอยซอมซ่อที่กองเต็มไปด้วยอาหารจานที่ข้าเคยได้ แต่ใฝ่ฝัน ข้าถูกดึงออกจากภวังค์ด้วยการคว้าจับของ [pompous_courtier.GetName]\n\n"อย่าไปเสียรสลิ้นของท่านกับของเหลือเดนพวกนี้เลย [ROOT.Char.Custom('FormOfAddressForLiege')] [ROOT.Char.Custom('GetLocalStreetFoodPlural')|U] มันสำหรับพวกไพร่ ที่บ้านเรามีอาหารเลิศรสกว่ามาก""
 travel_events.4019.a:0 "ข้าคือ [ROOT.Char.GetTitleAsNameNoTooltip] และข้าต้องการ [ROOT.Char.Custom('GetLocalStreetFood')] ของข้า!"
 travel.good_food:0 "อาหารอร่อยมาก"
 travel.bad_food:0 "อาหารน่าขยะแขยง"
 travel.food_poisoning:0 "ท่านได้รับอาหารเป็นพิษ"
 travel_events.4019.b:0 "ข้าไม่อยากจะเชื่อเลยว่าข้าเกือบจะกินขยะนี่เข้าไปแล้ว!"
 travel_events.4019.c:0 "บางทีข้าอาจจะขอสูตรได้!"

 travel_events.4020.t:1 "$travel_danger_prefix$ [ROOT.Char.GetFirstNameNoTooltip] คนนอก"
 travel_events.4020.desc:0 "เป็นที่ทราบกันดีว่าผู้คน [ROOT.Char.GetCurrentLocation.GetCounty.GetCulture.GetName] เป็นผู้ศรัทธาอย่างแรงกล้าในศรัทธา [ROOT.Char.GetCurrentLocation.GetCounty.GetFaith.GetAdjective] และไม่ค่อยเป็นมิตรกับผู้ที่ไม่เชื่อ อย่างไรก็ตาม [ROOT.Char.GetCurrentLocation.GetName] อยู่บนเส้นทางของเรา ดังนั้นเราจึงต้องผ่านไป\n\nแต่ในไม่ช้า สายตาอาฆาตแค้นของชาวบ้านก็จับจ้องมาที่เราเหมือน [ROOT.Char.Custom('GetAnimalType')] ที่กำลังย่องเข้าหาเหยื่อ ก่อนที่เราจะมีโอกาสตอบโต้ [ROOT.Char.GetCurrentLocation.GetCounty.GetFaith.PriestNeuter] ในท้องถิ่นก็ลงมาที่เราพร้อมกับกลุ่มผู้คลั่งไคล้ที่บ้าคลั่ง กรีดร้องเกี่ยวกับ "ความเชื่อนอกรีต" ที่ถูกกล่าวหาของเรา และเรียกร้องให้เราจ่ายค่าไถ่โทษสำหรับการเดินทางผ่าน "ดินแดนศักดิ์สิทธิ์" เหล่านี้"
 travel_events.4020.a:0 "เจ้า [strong_believer_scope.GetWomanMan] โง่เขลา #EMP เจ้า#! ต่างหากที่เป็นพวกนอกรีต!"
 travel_events.4020.b:0 "มันง่ายกว่าถ้าเราแค่จ่ายเงิน"
 travel_events.4020.c:0 "เผาคนบ้าพวกนี้ซะ"

 travel_events.4021.t:0 "แท่นบูชาแห่ง [ROOT.Char.GetCurrentLocation.GetCounty.GetFaith.HighGodName]"
 travel_events.4021.desc.intro:1 "ข้าเคยได้รับคำเตือนว่า [ROOT.Char.GetCurrentLocation.GetCounty.GetFaith.GetAdherentNamePlural] มีการบูชายัญมนุษย์ แต่ข้าไม่เคยจินตนาการเลยว่าจะได้เป็นพยานในการบูชายัญ เช่นนั้น บนแท่นบูชาหิน ข้าเห็น [sacrificed_person_scope.GetWomanMan] ถูกเปลื้องผ้าเปลือยเปล่า เคลือบบนพื้นผิวด้วยเชือกที่พันแน่น\n\n"
 travel_events.4021.desc.mid.sadist:0 "ข้าโชคดีอย่างแท้จริงที่ได้เห็นความป่าเถื่อนอันศักดิ์สิทธิ์นี้ด้วยตาของข้าเอง [sacrificed_person_scope.GetSheHe|U] ดิ้นรนและต่อสู้อย่างน่าพึงพอใจยิ่งนัก ข้าเสียใจที่ไม่สามารถแทงมีดทะลุหัวใจของ [sacrificed_person_scope.GetHerHis] และส่ง [sacrificed_person_scope.GetHerHim] ไปยัง [ROOT.Char.GetCurrentLocation.GetCounty.GetFaith.HighGodName] ด้วยตนเองได้!\n\n"
 travel_events.4021.desc.mid:1 "ข้าไม่อยากจะเชื่อในสิ่งที่ข้ากำลังเห็น [sacrificed_person_scope.GetSheHe|U] เต้นระรัวไปพร้อมกับลมหายใจที่ถี่เร็ว แต่ละครั้ง ดวงตาที่เปื้อนเลือดของ [sacrificed_person_scope.GetHerHis] อ้อนวอนให้ข้าเข้าไปแทรกแซง\n\n"
 travel_events.4021.desc.outro.cannibal:0 "ข้าได้ แต่หวังว่าข้าจะมีโอกาสได้ลิ้มรสเนื้อของ [sacrificed_person_scope.GetHerHis] เมื่อเรื่องทั้งหมดนี้จบลง"
 travel_events.4021.desc.outro.sadist:0 "ข้ามองดูอย่างร่าเริง ดวงตาของข้าจับจ้องไปที่คมมีดขณะที่มันส่ง [sacrificed_person_scope.GetHerHim] ไปสู่ความหลงลืม"
 travel_events.4021.desc.outro:0 "ข้ามองดูอย่างช่วยไม่ได้ ปรารถนาที่จะหยุดยั้งคมมีดและเลื่อนการเดินทางของ [sacrificed_person_scope.GetHerHis] ไปสู่ความหลงลืม"
 travel_events.4021.a:0 "ข้าต้องเบือนหน้าหนีไปเท่านั้น"
 travel_events.4021.a.sadist:0 "ข้าจะพยายามไม่พลาดแม้ แต่วินาทีเดียว!"
 travel_events.4021.b:0 "บางทีข้าอาจจะซื้ออิสรภาพของคนน่าสมเพชนี้ได้!"
 travel_events.4021.c:0 "หยุด! เอาตัว [rival_to_sacrifice.GetNameNoTooltip] ไปแทน!"

 travel_events.4022.t:0 "ต้นไม้ศักดิ์สิทธิ์"
 travel_events.4022.desc:1 "ข้าได้รับแจ้งว่าธรรมชาติได้รับการเคารพบูชาที่นี่ใน [ROOT.Char.GetCurrentLocation.GetName] ในฐานะส่วนขยายของพระประสงค์ของ [ROOT.Char.GetCurrentLocation.GetCounty.GetFaith.PantheonTerm]\n\nเราเฝ้าดูขณะที่ชาวบ้านประดับประดาต้นไม้เก่าแก่ด้วยวัสดุชั้นดีและเครื่องประดับ ราวกับว่าพวกเขากำลังเกี้ยวพาราสีมัน หลายคนในคณะผู้ติดตามของข้าพอใจที่จะเฝ้าดูจากระยะไกล แต่ข้ารู้สึกถูกกระตุ้นให้ทำอะไรมากกว่านั้น..."
 travel_events.4022.a:0 "น่าทึ่งมาก"
 travel_events.4022.a.not_so_different:0 "เราไม่ได้แตกต่างกันมากนัก"
 travel_events.4022.a.ignore_heretics:0 "ข้าจะไม่เข้าไปยุ่งเกี่ยวกับเรื่องของพวกนอกรีต"
 travel_events.4022.b:0 "เผาต้นไม้เสีย!"
 travel.burn_the_tree:0 "ต้นไม้ถูกจุดไฟเผา"
 travel.beaten_by_peasants:0 "ท่านถูกชาวบ้านผู้ศรัทธาตีกลับ"
 travel_events.4022.c:0 "ข้าควรเข้าร่วมการเฉลิมฉลอง!"
 cultural_acceptance_participated_in_festival:0 "เข้าร่วมในเทศกาล"

 travel_events.4023.t:2 "[prester_john_scope.GetFaith.GetReligion.GetAdherentNamePluralNoTooltip|U] ผู้หลงทาง"
 travel_events.4023.desc.intro:0 "มีตำนานเล่าขานถึง [prester_john_scope.GetPrimaryTitle.GetTierAsNameNoTooltip] [ROOT.Char.GetFaith.GetReligion.GetAdjective] ที่อยู่ห่างไกล ซึ่งถูกล้อมรอบด้วยพวกนอกรีตและไร้ศรัทธา วันหนึ่ง [prester_john_scope.GetTitleAsNameNoTooltip] ในตำนานของ [prester_john_scope.GetPrimaryTitle.GetTierAsNameNoTooltip] ผู้นี้จะจับอาวุธต่อสู้กับคนชั่วและสังหารพวกเขาด้วยความโกรธเกรี้ยวอันศักดิ์สิทธิ์!\n\n"
 travel_events.4023.desc.mid.john:0 "ตำนานเรียกเขาว่า "เพรสเตอร์ จอห์น" และ"
 travel_events.4023.desc.mid.joan:0 "ตำนานเรียกเขาว่า "เพรสเตอร์ จอห์น" แต่บางทีพวกเขาอาจหมายถึง "เพรสเตอร์ โจน"! ไม่ว่าจะด้วยวิธีใด"
 travel_events.4023.desc.mid:0 "บุคคลในตำนานผู้นี้ยังคงไร้นาม แต่"
 travel_events.4023.desc.outro:0 "ขณะที่ข้าใช้เวลามากขึ้นเรื่อยๆ ใน [prester_john_scope.GetPrimaryTitle.GetNameNoTierNoTooltip] ข้าก็ยิ่งเชื่อมั่นมากขึ้นเรื่อยๆ ว่า [prester_john_scope.GetName] คือ [prester_john_scope.GetTitleAsNameNoTooltip] ในตำนานผู้นี้!"
 travel_events.4023.a:0 "ข้าต้องพบ [prester_john_scope.GetHerHim] ทันที!"
 travel_events.4023.b:0 "[prester_john_scope.GetSheHe|U] ต้องได้รับการเตือนถึงหน้าที่ของ [prester_john_scope.GetHerHis] ในการต่อสู้กับพวกนอกรีต!"
 travel_events.4023.c:0 "[prester_john_scope.GetFaith.GetNameNoTooltip] เป็นเพียงการบิดเบือน [ROOT.Char.GetFaith.GetNameNoTooltip] เท่านั้น!"
 travel_events.4023.d:0 "น่าทึ่งมาก ไปต่อกันเถอะ"

 travel_events.4024.t:0 "[ROOT.Char.GetFaith.GetReligion.GetAdherentNameNoTooltip|U] ต่างแดน"
 travel_events.4024.desc.intro:0 "ข้าได้รับจดหมายที่เขียนด้วยภาษาแปลกใหม่จากใครบางคนที่อ้างว่าเป็น [foreign_visitor.GetTitleAsNameNoTooltip] ที่อยู่ห่างไกล ซึ่งเป็นบ้านของ "[foreign_visitor.GetFaith.GetAdherentNamePluralNoTooltip]" กลุ่ม [ROOT.Char.GetFaith.GetReligion.GetAdherentNameNoTooltip] ที่อยู่ห่างไกล"
 travel_events.4024.desc.mid:0 "\n\n[foreign_visitor.GetSheHe|U] อ้างว่าข้าเป็นบุคคลในตำนานสำหรับเหล่า [foreign_visitor.GetFaith.GetAdherentNamePluralNoTooltip] เหล่านี้ เป็น [ROOT.Char.GetTitleAsNameNoTooltip|U] ชาว [ROOT.Char.GetFaith.GetReligion.GetAdjective] ที่แท้จริงผู้กำลังถูกปิดล้อมโดย [ROOT.Char.Custom('GetDerogatoryNonbelieverPlural')]"
 travel_events.4024.a:0 "[foreign_visitor.GetSheHe|U] จะเป็นตำนานสำหรับเรา เช่นกัน!"
 travel_events.4024.b:0 "[foreign_visitor.GetFaith.GetNameNoTooltip] งั้นหรือ ฟังดูเหมือนพวกนอกรีต!"
 travel_events.4024.c:0 "บางที [chaplain_scope.GetNameNoTooltip] อาจสามารถสอนพวกเขาทั้งหมดเกี่ยวกับ [ROOT.Char.GetFaith.GetName] ได้!"
 travel.gift_from_john:0 "ของขวัญจาก [prester_john_scope.GetName]"
 travel_events.4024.d:0 "ดีจัง..."
 travel.turned_away_from_john:0 "ท่านถูกปฏิเสธ"

 travel_events.4025.t:0 "จงรับดาบศักดิ์สิทธิ์"
 travel_events.4025.desc.mid:1 "[foreign_visitor.GetSheHe|U] อ้างว่าข้าเป็นบุคคลในตำนานที่ถูกกำหนดให้จับดาบต่อสู้กับผู้ที่ไม่เชื่อในนามของ [ROOT.Char.GetFaith.HighGodNamePossessive] และส่งคนชั่วไปยัง [ROOT.Char.GetFaith.NegativeAfterLife] ที่ ซึ่งพวกเขาควรอยู่\n\nข้ามีเพื่อนบ้านหลายประเภทที่มีศรัทธาต่างๆ นานา [ROOT.Char.GetFaith.HighGodName] จะปรารถนาให้ข้ากระทำการรุนแรงในนามของ [ROOT.Char.GetFaith.HighGodHerHis|U] จริงหรือ?"
 travel_events.4025.a:1 "แน่นอน [ROOT.Char.GetFaith.HighGodNameSheHe|U] จะต้องปรารถนา!"
 travel_events.4025.b:0 "มีหลายเส้นทางสู่ [ROOT.Char.GetFaith.PositiveAfterLife]"
 travel.visitor_rejected_me:0 "[prester_john_scope.GetName] ปฏิเสธที่จะต่อสู้กับพวกนอกรีต"
 travel_events.4025.different_religion_neighbors_and_vassals:0 "ทุก [vassal|E] และ [ruler|E] เพื่อนบ้านที่มี [religion|E] แตกต่างกัน"

 travel_events.4026.t:0 "สหายจากแดนไกล"
 travel_events.4026.desc:0 "[prester_john_scope.GetName] ได้ตอบจดหมายของข้าและแสดงความชื่นชมร่วมกันของ [prester_john_scope.GetHerHis] ที่มีต่อตัวข้าและศรัทธา [ROOT.Char.GetFaith.GetAdjective]\n\n[prester_john_scope.GetSheHe|U] กล่าวต่อไปว่าหาก [ROOT.Char.GetFaith.HighGodName] ประสงค์ เราอาจได้พบกันอีกครั้ง และในระหว่างนี้ เราควรคงความเป็นผู้ชื่นชม ซึ่งกันและกันจากระยะไกล"
 travel_events.4026.a:0 "ฟังดูยอดเยี่ยม!"
 travel.became_friends_with_visitor:0 "[foreign_visitor.GetName] ได้กลายเป็นสหายของท่าน!"
 travel.visitor_rejected_friendship:0 "[foreign_visitor.GetName] ปฏิเสธที่จะเป็นสหาย"
 travel_events.4026.b:0 "ระยะทางไกลไม่ค่อยเหมาะกับข้าเท่าไหร่"

 travel_events.4027.t:0 "การมาเยือนของพวกนอกรีต"
 travel_events.4027.desc:0 "กลุ่มนักเดินทาง [foreign_visitor.GetFaith.GetAdherentNamePlural] กำลังเดินทางผ่าน [ROOT.Char.GetPrimaryTitle.GetNameNoTierNoTooltip] และวันนี้ [foreign_visitor.GetTitleAsNameNoTooltip|U] [foreign_visitor.GetFaith.GetAdherentNameNoTooltip] ที่โดดเด่นในหมู่พวกเขาได้กล่าวหาข้าว่าเป็นพวกนอกรีต!\n\n[foreign_visitor.GetSheHe|U] อ้างว่าไม่เพียง แต่ข้ากำลังบิดเบือนพระประสงค์ของ [ROOT.Char.GetFaith.HighGodNamePossessive] เท่านั้น แต่ศรัทธา [ROOT.Char.GetFaith.GetAdjective] ทั้งหมดเป็นเพียงการล้อเลียนที่น่าเกลียดของ [ROOT.Char.GetFaith.GetReligion.GetNameNoTooltip]!"
 travel_events.4027.a:0 "เจ้าพวกหัวรุนแรงจอมโอหังนั่น! เราจะได้เห็นกันว่าใครล้อเลียนใคร!"

 travel_events.4028.t:0 "ศิลาจารึกอักษรรูน"
 travel_events.4028.desc:1 "ชนบทของ [ROOT.Char.GetCurrentLocation.GetNameNoTooltip] เป็นที่ทราบกันดีว่าเต็มไปด้วยศิลาจารึกอักษรรูน: เสาหินสูงตระหง่านที่สลักบันทึกเหตุการณ์ต่างๆ ทั้งในตำนานและประวัติศาสตร์\n\nในการเดินทางของเรา เราได้พบกับศิลาจารึกอักษรรูนที่ยิ่งใหญ่เป็นพิเศษ ซึ่งประดับด้วยลวดลายที่ซับซ้อนและสิ่งที่น่าจะเป็นตำนานที่เขียนด้วยภาษาที่ข้าไม่เข้าใจอย่างไม่ต้องสงสัย\n\nบางทีด้วยเวลาและความอดทน ข้าอาจจะถอดรหัสความหมายได้..."
 travel_events.4028.a:0 "ข้าจะลองดู!"
 travel.read_runestone:0 "ท่านอ่านศิลาจารึกอักษรรูนแล้ว!"
 travel.failed_to_read_runestone:0 "ท่านอ่านศิลาจารึกอักษรรูนไม่สำเร็จ"
 travel_events.4028.b:0 "สัญลักษณ์อันเป็นมลทินนี้ควรถูกทำลาย!"
 travel_events.4028.c:0 "ข้าไม่มีเวลาสำหรับเรื่องนี้"

 travel_events.4029.t:0 "หุ่นไล่กาอันน่าสยดสยองแห่ง [ROOT.Char.GetCurrentLocation.GetNameNoTooltip]"
 travel_events.4029.desc.intro:0 "การเดินเล่นผ่านชนบท [ROOT.Char.GetCurrentLocation.GetNameNoTooltip] ไม่ใช่เรื่องสนุกสนานอย่างที่ข้าจินตนาการไว้ ท้องฟ้ามืดครึ้มไปด้วยเมฆและทุ่งนาเงียบสงัดราวกับป่าช้า\n\nนั่นคือ จนกระทั่งเราได้ยินเสียงร้องโหยหวนด้วยความเจ็บปวดดังมาจากส่วนลึกของทุ่งนา ขณะที่เราเข้าใกล้ เราพบ [brainless_character.GetWomanMan] ถูกแขวนอยู่บนเสาราวกับว่า [brainless_character.GetSheHe] เป็นหุ่นไล่กา\n\n"
 travel_events.4029.desc.mid.christian:0 "[brainless_character.GetSheHe|U] เป็นภาพสะท้อนความทุกข์ทรมานของพระคริสต์ ถูกแขวนอยู่บนไม้กางเขนในฟาร์มของ [brainless_character.GetHerHis]"
 travel_events.4029.desc.mid:0 "จากริมฝีปากที่แห้งผากและผิวซีดเซียวของ [brainless_character.GetHerHis] เห็นได้ชัดว่า [brainless_character.GetSheHe] อยู่ที่นี่มาสักพักแล้ว"
 travel_events.4029.desc.outro:0 "สมาชิกบางคนในคณะผู้ติดตามของข้าอ้อนวอนให้ข้าตัด [brainless_character.GetHerHim] ลงมา แต่มันเป็นเรื่องของข้าจริงๆ หรือ?"
 travel_events.4029.a:0 "แสดงความเมตตาต่อสิ่งมีชีวิตนี้!"
 travel_events.4029.b:0 "[brainless_character.GetSheHe|U] เป็นอาชญากรอย่างชัดเจน"
 travel_events.4029.c:0 "ปล่อย [brainless_character.GetHerHim] ไว้"

 travel_events.4030.t:0 "$travel_events.4029.t$"
 travel_events.4030.desc.intro:1 "[brainless_character.GetWomanMan] ผู้นั้นคุกเข่าลงแทบเท้าข้าอย่างน่าสมเพช ทำให้ดินเปื้อนเลือดด้วยมือของ [brainless_character.GetHerHis] ในไม่ช้า สมาชิกในคณะผู้ติดตามของข้าก็พยุง [brainless_character.GetHerHim] ให้ยืนขึ้นบนขาที่ไม่มั่นคง อ้อนวอนขอฟังว่า [brainless_character.GetSheHe] มาอยู่ที่นี่ได้อย่างไร\n\n"
 travel_events.4030.desc.mid.lowborn:1 ""โอ้ เป็นแม่ของข้าเอง ท่านเห็นไหม นางบอกว่าข้าเชื่องช้าและไร้ประโยชน์จนเป็นหุ่นไล่กาได้ดีกว่าคนงานในฟาร์ม นางจึงมัดข้าไว้ ข้าคิดว่าข้าจะไม่เป็นไร แต่มันเป็นการทรมาน""
 travel_events.4030.desc.mid.noble:1 ""โอ้ ข้าแค่มาที่นี่เพื่อเก็บภาษี ชาวบ้านบอกข้าว่าทองคำถูกฝังไว้ที่นี่ และก่อนที่ข้าจะรู้ตัว พวกเขาก็กรูกันเข้ามาหาข้าและแขวนข้าไว้เหมือนหุ่นไล่กา!""
 travel_events.4030.desc.outro:0 "\n\nสติปัญญาไม่ใช่จุดแข็งของ [brainless_character.GetHerHis] อย่างชัดเจน แต่ [brainless_character.GetSheHe] ก็เสนอทรัพย์สินจำนวนเล็กน้อยให้ข้าสำหรับความช่วยเหลือของข้าโดยไม่คำนึงถึงสิ่งใด"
 travel_events.4030.a:0 "[brainless_character.GetSheHe|U] ตกอยู่ในอันตรายอย่างชัดเจนที่นี่ มากับข้า!"
 travel_events.4030.b:0 "รางวัลที่ดีสำหรับการกระทำที่ดี"
 travel_events.4030.c:0 "ข้าไม่ต้องการรางวัลใดๆ"

 travel_events.4031.t:0 "[heartless_knight_scope.GetWomanMan|U] โลหะ"
 travel_events.4031.desc.intro:1 "อย่างแท้จริง การเดินเล่นผ่าน [ROOT.Char.GetCurrentLocation.GetName] เป็นของขวัญจาก [ROOT.Char.GetFaith.CreatorName] ความเงียบสงบของสถานที่แห่งนี้ถูกทำลายลงอย่างกะทันหันและรุนแรงด้วยเสียงคำรามอย่างโกรธเกรี้ยวและเสียงกระทบกันของชุดเกราะ!\n\n"ฟังนะ! เอาข้าออกจากคุกโลหะนี่ที! เด็กรับใช้ของข้าไม่พอใจกิริยาของข้า ถึงกับเรียกข้าว่า 'ไร้หัวใจ' และทอดทิ้งข้าไปแล้ว!"\n\n"
 travel_events.4031.desc.mid.callous:0 "ข้าพยายามกลั้นหัวเราะ แต่ภาพของคนโง่คนนี้ที่ส่งเสียงดังกร๊อกแกร๊กไปทั่วชนบทนั้นมันมากเกินไป"
 travel_events.4031.desc.mid:0 "ไม่ว่า [heartless_knight_scope.GetWomanMan] ประหลาดผู้นี้จะทำอะไรลงไป ก็คงไม่เพียงพอที่จะให้เหตุผลในการติดอยู่ในชุดเกราะของ [heartless_knight_scope.GetHerHis] ตลอดไป"
 travel_events.4031.desc.outro:0 "แน่นอนว่าข้าสามารถให้ใครสักคนช่วย [heartless_knight_scope.GetHerHim] ได้ แต่มันคุ้มค่าจริงๆ หรือ?"
 travel_events.4031.a:0 "ถือว่าชุดเกราะหายไปแล้ว แลกกับราคา"
 travel_events.4031.b:0 "เสนอเด็กรับใช้ที่ภักดีให้ [heartless_knight_scope.GetHerHim] แลกกับความจงรักภักดีของ [heartless_knight_scope.GetHerHis]"
 travel_events.4031.c:0 "ข้าปล่อย [heartless_knight_scope.GetHerHim] ไปตามชะตากรรมของ [heartless_knight_scope.GetHerHis]"

 travel_events.4032.t:2 "การต่อสู้ของ [ROOT.Char.Custom('GetAnimalType')|U]"
 travel_events.4032.desc:2 "การเดินทางของเราถูกขัดจังหวะอย่างรุนแรงด้วยเสียงเนื้อฉีกขาดและขากรรไกรขบเคี้ยว และเสียงร้องอย่างสิ้นหวังของ [cowardly_knight_scope.GetWomanMan] ที่กำลังจะถึงจุดจบ! เสียงนั้นน่าสยดสยองมากจนต้องมาจากส่วนลึกของ [ROOT.Char.GetFaith.NegativeAfterLife]!\n\nเมื่อพยายามติดตามแหล่งที่มา เราพบ $knight_culture_player_no_tooltip_lowercase$ ที่สิ้นหวังกำลังต่อสู้กับ [ROOT.Char.Custom('GetAnimalType')] ป่า! ดาบของ [cowardly_knight_scope.GetHerHis|U] ติดอยู่ระหว่างขากรรไกรของสัตว์ร้าย แต่การจับของ [cowardly_knight_scope.GetHerHis] เริ่มอ่อนแรงลง"
 travel_events.4032.a:1 "[cowardly_knight_scope.GetWomanMan] ผู้นี้สมควรได้รับความช่วยเหลือจากข้า!"
 travel.beat_back_lion:1 "ท่านเอาชนะ [ROOT.Char.Custom('GetAnimalType')]"
 travel.mauled_by_animal:1 "ท่านถูก [ROOT.Char.Custom('GetAnimalType')] ทำร้าย"
 travel_events.4032.b:1 "ช่วย [cowardly_knight_scope.GetHerHim] ด้วย [entourage_helper.GetFirstNameNoTooltip]!"
 travel_events.4032.c:0 "ข้าจะไม่เสี่ยงชีวิตเพื่อสิ่งนี้"
 
 travel_events.4033.t:0 "[witch_scope.Custom('MagicUserTerm')|U] แห่ง [ROOT.Char.GetCurrentLocation.GetNameNoTooltip]"
 travel_events.4033.desc.intro:0 "[ROOT.Char.GetCurrentLocation.GetNameNoTooltip] เป็นดินแดนแห่งขนบธรรมเนียมที่แปลกประหลาดและคลุมเครือสำหรับข้า การปฏิบัติของศรัทธา [ROOT.Char.GetCurrentLocation.GetCounty.GetFaith.GetAdjective] นั้นแปลกและแตกต่างอย่างไม่อาจจินตนาการได้จาก [ROOT.Char.GetFaith.GetName] และไม่มีที่ใดจะชัดเจนไปกว่าทัศนคติของพวกเขาต่อการใช้เวทมนตร์\n\nใจกลางเมือง มี [witch_scope.GetWomanMan] กำลังร่ายคาถาและมอบพรราวกับว่า [witch_scope.GetSheHe] เป็น [ROOT.Char.GetFaith.PriestNeuter]!"
 travel_events.4033.desc.mid.zealous:0 "เพียงแค่ได้เห็นการนอกรีตอันเสื่อมทรามนี้ก็เพียงพอที่จะ ทำให้ข้าป่วย และข้ารู้สึกได้ว่ามือที่ใช้เผาแม่มดของข้าเริ่มสั่นด้วยความโกรธ"
 travel_events.4033.desc.mid:0 "มันแปลกสำหรับข้า แต่ผู้คนดูเหมือนจะร่าเริงยินดีอย่างยิ่งที่ได้อยู่ต่อหน้า [witch_scope.GetHerHis]"
 travel_events.4033.a:0 "พวกเขาต้องเข้าใจว่า [witch_scope.Custom('MagicPracticeTerm')] เป็นบาป"
 travel_events.4033.b:0 "ข้ามีอะไรให้เรียนรู้อีกมาก สอนข้าที!"
 travel_events.4033.c:0 "นี่ไม่ใช่เรื่องของข้าจริงๆ"
 travel_events.4033.d:0 "[witch_scope.Custom('MagicPracticeTerm')|U]! [witch_scope.GetSheHe|U] จะต้องสำนึกผิด หรือ [witch_scope.GetSheHe] จะต้องถูกเผา!"
 travel.burned_witch:0 "ท่านจับและเผา [witch_scope.Custom('MagicUserTerm')]"
 travel.beaten_by_locals:0 "ท่านถูกชาวบ้านหยุดยั้งไว้"
 
 travel_events.4034.t:0 "จากเถ้าถ่านสู่สมบัติ"
 travel_events.4034.desc.intro:0 "[witch_scope.Custom('MagicUserTerm')] ผู้ชั่วร้ายแห่ง [ROOT.Char.GetCurrentLocation.GetNameNoTooltip] ถูกเผาทั้งเป็นอย่างสาสมแล้วสำหรับอาชญากรรมของ [witch_scope.GetHerHis] ที่ก่อต่อ [ROOT.Char.GetFaith.HighGodName] และเมื่อควันจางลง ข้าก็เห็นว่า [witch_scope.GetWomanMan] ผู้ [witch_scope.Custom2('InsultAdjective', ROOT.Char)] ผู้นี้ได้ทิ้งบางสิ่งไว้เบื้องหลัง\n\n"
 travel_events.4034.desc.mid.bones:0 "ฝังอยู่ท่ามกลางเถ้าถ่านคือกระดูกของ [witch_scope.GetHerHis] ซึ่งได้รับการเก็บรักษาไว้อย่างสมบูรณ์แบบแม้จะมีความรุนแรงของเปลวไฟ ไม่ต้องสงสัยเลยว่านี่เป็นการกระทำสุดท้ายของเวทมนตร์อันชั่วร้าย"
 travel_events.4034.desc.mid:0 "ส่องแสงระยิบระยับอยู่ในเถ้าถ่านคือวัตถุอันน่าอัศจรรย์ ซึ่งรอดพ้นจากเปลวไฟอันรุนแรงได้อย่างน่าอัศจรรย์ บางทีนี่อาจเป็นของขวัญจาก [ROOT.Char.GetFaith.HighGodName] สำหรับการรับใช้ของข้า หรือเป็นการกระทำสุดท้ายของเวทมนตร์จากแม่มดชั่วร้าย"
 travel_events.4034.desc.outro:0 "สิ่งประดิษฐ์ถูกเก็บกู้จากเถ้าถ่านและทำความสะอาดโดยสมาชิกในคณะผู้ติดตามของข้า เพื่อเป็นของข้าตลอดไป"
 travel_events.4034.a:0 "ส่วนเสริมที่ยอดเยี่ยมสำหรับคอลเลกชันของข้า"

 travel_events.4035.t:1 "ไม่ได้อยู่ใน [ROOT.Char.GetPrimaryTitle.GetNameNoTierNoTooltip] อีกต่อไป"
 travel_events.4035.desc.intro:1 "ในฐานะผู้รับใช้ที่ภักดีของ [ROOT.Char.GetFaith.WitchGodName] การเดินทางหมายถึงการประกอบพิธีกรรมและร่ายคาถาเพื่อปกป้องคณะผู้ติดตามของข้าจากวิญญาณชั่วร้าย\n\nที่นี่ใน [ROOT.Char.GetCurrentLocation.GetNameNoTooltip]"
 travel_events.4035.desc.mid.zealous:1 "พวกนอกรีตชั่วร้าย"
 travel_events.4035.desc.mid:1 "ผู้คน"
 travel_events.4035.desc.outro:1 "เชื่อว่าเวทมนตร์และปาฏิหาริย์ทั้งหมดที่กระทำโดยผู้ใดก็ตามนอกเหนือจากนักบวชของพวกเขาคือคาถาอาคม\n\nดังนั้น [zealous_priest_scope.GetFaith.PriestNeuter] ในท้องถิ่นจึงลงมายังขบวนของข้าราวกับสัตว์ร้าย ขัดถูสัญลักษณ์ป้องกันของข้าออกไปและพูดพล่ามเกี่ยวกับความชั่วร้ายที่ถูกกล่าวหาในวิถีทางของข้า"
 travel_events.4035.a:1 "บางที [zealous_priest_scope.GetSheHe] อาจจะฟังเหตุผล?"
 travel_events.4035.b:0 "ข้าสำนึกผิดในวิถีทางอันชั่วร้ายของข้า!"
 travel_events.4035.c:0 "หนีไป!"
 travel_events.4035.d:0 "ข้าจะต่อสู้ฝ่าฟันออกไป!"
 travel.beat_zealot:0 "ท่านเอาชนะกลุ่มคนที่โกรธแค้นได้"

 travel_events.4036.t:0 "คนขับคาราวาน [ROOT.Char.GetCurrentLocation.GetCounty.GetCulture.GetNameNoTooltip]"
 travel_events.4036.desc:1 "ขณะที่เราคดเคี้ยวไปตามชานเมือง [ROOT.Char.GetCurrentLocation.GetCounty.GetName] ข้าเห็นขบวนอูฐคาราวานอยู่ไกลๆ และในไม่ช้าเราก็ได้พบกับผู้นำที่แปลกประหลาดของพวกเขา\n\n"สวัสดีตอนเย็น สหายผู้ทรงเกียรติ เข้ามาสิ! เข้ามา! ข้าสัญญาว่าสิ่งที่ข้ามีในแผงขายของข้า เช่นเดียวกับ [kingdom_scope.GetBaseNameNoTierNoTooltip] นั้น มีค่ามากกว่าที่เห็น" [merchant_character_scope.GetSheHe] กล่าว พลางแสดงของกระจุกกระจิกที่ส่องแสงนับไม่ถ้วนต่อหน้าต่อตาข้า"
 travel_events.4036.a:0 "ข้าจะจ่ายตามที่ท่านต้องการ!"
 travel_events.4036.b:0 "ข้าจะขโมยมัน!"
 travel_events.4036.d:0 "บางทีเราอาจจะทำข้อตกลงกันได้"
 travel_events.4036.c:0 "ข้าไม่สนใจของกระจุกกระจิก [ROOT.Char.GetCurrentLocation.GetCounty.GetCulture.GetNameNoTooltip]"
 
 travel_events.4037.t:0 "[ROOT.Char.GetFaith.GetReligion.GetNameNoTooltip] และ [ROOT.Char.GetCurrentLocation.GetCounty.GetFaith.GetNameNoTooltip]"
 travel_events.4037.desc:0 "ข้าเคยได้ยินมาว่าผู้คนแห่ง [ROOT.Char.GetCurrentLocation.GetCounty.GetName] ปฏิบัติศาสนา [ROOT.Char.GetFaith.GetReligion.GetName] ควบคู่ไปกับความเชื่อแบบ [ROOT.Char.GetCurrentLocation.GetCounty.GetFaith.GetAdjective] ของตนเอง และบัดนี้เมื่อข้ามาอยู่ที่นี่ ข้าก็ได้เห็นการผสมผสานทางศาสนานี้ในทุกหนแห่ง\n\nชาวนาท่าทางแปลก ๆ แต่กระตือรือร้นผู้หนึ่ง ซึ่งเรียกตัว[fanboy_character_scope.GetHerselfHimself]ว่า [fanboy_character_scope.GetFirstName] เข้ามาหาคณะผู้ติดตามของข้าอย่างกระตือรือร้นและเริ่มศึกษาเครื่องหมายทางศาสนาของเราอย่างแข็งขัน\n\n"ขอสาบานต่อ [fanboy_character_scope.GetFaith.HighGodName] กลุ่มชาว [ROOT.Char.GetFaith.GetAdherentNamePluralNoTooltip] มาอยู่ที่นี่ได้อย่างไร! ได้โปรดบอกข้าที [ROOT.Char.Custom('FormOfAddressForLiege')] ท่านจะสอนพวกเราเกี่ยวกับวิถีการบูชาแบบ [ROOT.Char.GetFaith.GetAdjectiveNoTooltip] ได้หรือไม่""
 travel_events.4037.a:0 "ข้าจะสอนพวกเขา!"
 travel.good_cermon:0 "ท่านเทศนาได้ดี"
 travel.bad_cermon:0 "ท่านเทศนาได้ไม่ดี"
 travel_events.4037.b:0 "ข้าสนใจที่จะฟังเกี่ยวกับ [ROOT.Char.GetCurrentLocation.GetCounty.GetFaith.GetNameNoTooltip] มากกว่า"
 travel_events.4037.c:0 "ไปให้พ้น [ROOT.Char.Custom('GetDerogatoryNonbelieverPlural')]!"

 travel_events.4038.t:0 "[ROOT.Char.GetCurrentLocation.GetCounty.GetFaith.GetAdherentNamePluralNoTooltip] ท่ามกลางพวกเรา"
 travel_events.4038.desc:0 "ในศรัทธา [ROOT.Char.GetFaith.GetAdjective] เราปฏิบัติตามพิธีกรรมและความเชื่อของเราเอง แต่เรายังคงยึดถือ [ROOT.Char.GetCurrentLocation.GetCounty.GetFaith.GetReligion.GetName] เหนือศาสนาอื่นทั้งหมดและแสดงความผูกพันต่อความเชื่อของพวกเขา\n\nเป็นเรื่องปกติที่ [ROOT.Char.GetFaith.GetAdherentNamePluralNoTooltip] จะปฏิบัติ [ROOT.Char.GetCurrentLocation.GetCounty.GetFaith.GetReligion.GetNameNoTooltip] ควบคู่ไปกับการนมัสการแบบ [ROOT.Char.GetFaith.GetAdjectiveNoTooltip] ดั้งเดิม และตอนนี้ข้าอยู่ที่นี่ใน [ROOT.Char.GetCurrentLocation.GetCounty.GetName] ข้ามีโอกาสเข้าร่วมการเทศนาและเรียนรู้ทั้งหมดเกี่ยวกับศรัทธา [ROOT.Char.GetCurrentLocation.GetCounty.GetFaith.GetAdjective]"
 travel_events.4038.a:0 "ข้าต้องเข้าร่วมให้ได้!"
 travel_events.4038.b:0 "บางทีข้าอาจจะ ทำให้พวกเขาสนใจในวิถีทางของเราได้!"
 travel_events.4038.c:0 "ข้าไม่สนใจ"

 travel_events.4039.t:0 "การต้อนรับขับสู้หนึ่งวัน"
 travel_events.4039.desc:0 "การเดินทางยาวนานและเหน็ดเหนื่อย และเท้าของข้าก็ปวดมากจนบรรพบุรุษของข้าต้องรู้สึกได้ ขณะที่ข้ารู้สึกว่ากำลังจะหมดแรงล้มลง ข้ารู้สึกว่ามีบางอย่างหนักๆ ถ่วงคอข้าอยู่!\n\nไม่นานนัก ข้าก็ถูกประดับประดาตั้งแต่หัวจรดเท้าด้วยเครื่อง แต่งกาย [ROOT.Char.GetCurrentLocation.GetCounty.GetCulture.GetName] แบบดั้งเดิม ถนนหนทางมีชีวิตชีวาด้วยความรื่นเริง! หัวหน้าครอบครัวทุกคนกวักมือเรียกให้ข้าเข้าไปพักผ่อนหย่อนใจ ใช้เวลาเพียงครู่เดียวในการฟื้นกำลัง และข้าจะได้รับการต้อนรับในฐานะแขกผู้มีเกียรติ\n\nการต้อนรับขับสู้แบบ [ROOT.Char.GetCurrentLocation.GetCounty.GetCulture.GetNameNoTooltip] เป็นตำนาน ข้าจะสามารถ #EMP ไม่#! ไปเห็นด้วยตาตนเองได้อย่างไร?"
 travel_events.4039.a:0 "บางทีอาจจะพักผ่อนสั้นๆ..."
 travel_events.4039.b:0 "ข้าต้องเดินทางต่อไป!"
 
 travel_events.4040.t:0 "ความหลงใหลในวัฒนธรรม"
 travel_events.4040.desc:1 "นับตั้งแต่เข้าสู่ [ROOT.Char.GetCurrentLocation.GetCounty.GetName] ข้าได้รับการปฏิบัติเหมือนสัตว์ในสวนอันงดงาม ผู้คนจ้องมองด้วยความประหลาดใจเพียงแค่วิธีที่ข้าพูดและวางตัว\n\nขณะที่เราเดินทางผ่านไป ข้าถูกเข้าหาอย่างกะทันหันโดย [fanboy_character_scope.GetWomanMan] ที่แปลกประหลาดและกระตือรือร้น ซึ่งแตกต่างจากฝูงชนที่เหลือ ดูเหมือนจะพูดภาษา [ROOT.Char.GetCulture.GetLanguage.GetName] ได้\n\n"พระเจ้าช่วย เป็นความจริง! [ROOT.Char.GetTitleAsNameNoTooltip] ชาว [ROOT.Char.GetCulture.GetName] มาอยู่ที่นี่ได้อย่างไร! ข้าชื่นชมขนบธรรมเนียม [ROOT.Char.GetCulture.GetNameNoTooltip] มานานแล้ว และข้าถึงกับเรียนภาษา [ROOT.Char.GetCulture.GetLanguage.GetNameNoTooltip] ด้วยตนเอง! ช่างเป็นเกียรติอะไร เช่นนี้!""
