 travel_events.4050.t: "เกือบถึงบ้าน"
 travel_events.4050.interpreter: "ข้าได้อนุญาตให้กลุ่มบุคคลสำคัญชาว [foreign_county.GetAdjective] เข้าเฝ้าอย่างกะทันหันบนท้องถนน เพื่อแสดงความเคารพสักครู่\n\nข้าพบว่าตนเองเสียสมาธิไปกับ [friendly_child.GetName]: [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('friendly_child'))] วัยเยาว์ของข้ากำลังทำหน้าที่เป็นล่ามให้กับสหายบางคน สลับไปมาระหว่างภาษาและกิริยาท่าทางด้วยความละเอียดอ่อนและง่ายดาย ส่งเสริมการแลกเปลี่ยนที่มีชีวิตชีวา\n\nจากสิ่งที่ข้าเข้าใจ [friendly_child.Custom('GirlBoy')] กำลังเติบโตเป็นทูตโดยธรรมชาติ"
 travel_events.4050.religious: "ข้าได้อนุญาตให้กลุ่ม [friendly_child.GetFaith.AltPriestTermPlural] ชาว [foreign_county.GetAdjective] เข้าเฝ้าอย่างกะทันหันบนท้องถนน เพื่อแบ่งปันพรและปัญญา [friendly_child.GetFaith.GetAdjective] สักครู่\n\nข้าพบว่าตนเองเสียสมาธิไปกับ [friendly_child.GetName] เพราะ [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('friendly_child'))] วัยเยาว์ของข้าได้รวบรวมกลุ่มผู้นับถือรุ่นเยาว์ และท่ามกลางพวกเขาก็อธิบายธรรมชาติของศรัทธาร่วมกันอย่างสุขุม\n\nจากสิ่งที่ข้าเข้าใจ การได้รับการสอนทั้งวิถีแห่งความเชื่อของข้าและของ [friendly_child.GetHerHis] เองได้ให้ข้อมูลเชิงลึกบางอย่างแก่ [friendly_child.Custom('GirlBoy')]"
 travel_events.4050.singing: "ข้าได้อนุญาตให้เจ้าของที่ดินชาว [foreign_county.GetAdjective] สองสามคนเข้าเฝ้าอย่างกะทันหันบนท้องถนน เพื่อแสดงมารยาทสักครู่ขณะมองข้าอย่างประหม่า\n\nข้าพบว่าตนเองเสียสมาธิไปกับ [friendly_child.GetName]: [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('friendly_child'))] วัยเยาว์ของข้ากำลังมีช่วงเวลาที่ยอดเยี่ยม ร้องเพลงทั่วไป เต้นรำจิ๊ก และยกย่องวีรบุรุษ [friendly_child.GetCulture.GetHeritage.GetName] ในอดีตร่วมกับเยาวชน [friendly_child.GetCulture.GetName] บางคน\n\nการอยู่ในราชสำนักของข้าดูเหมือนจะยิ่ง ทำให้ความสนใจของ [friendly_child.Custom('GirlBoy')] ในการปฏิบัติตามวัฒนธรรมของตนเองลึกซึ้งยิ่งขึ้น"

 travel_events.4050.a: "พรสวรรค์ที่ต้องส่งเสริม"

 travel_events.4050.b: "ข้าควรหยุดเรื่องนี้..."
 travel_events.4050.b.tt: "เด็กคนนี้เป็นของราชสำนักของข้า — เป็นของคนของข้า"
 travel_events.4050.c.interpreter: "[friendly_child.Custom('GirlBoy')|U]! มาเล่าเรื่องให้เราฟังเป็นภาษา [friendly_child.GetCulture.GetLanguage.GetNameNoTooltip] ที"
 travel_events.4050.c.religious: "[friendly_child.Custom('GirlBoy')|U]! มา ทำให้ [friendly_child.GetFaith.GetAdherentNamePluralNoTooltip] เหล่านี้ประทับใจที"
 travel_events.4050.c.singing: "[friendly_child.Custom('GirlBoy')|U]! มา ทำให้ [friendly_child.GetCulture.GetCollectiveNounNoTooltip] เหล่านี้เพลิดเพลินที"
 travel_events.4050.c.tt: ""ทำให้ข้าภูมิใจนะ [friendly_child.Custom('GetLassLad')]!""

 sponsored_emissaries_modifier: "ทูตที่ได้รับการสนับสนุน"
 sponsored_emissaries_modifier_desc: "ตัวละครนี้ส่งเสริมการเรียนรู้ภาษาและการทูตข้ามวัฒนธรรม"

 raised_other_faiths_mystic_modifier: "เลี้ยงดูนักพรตต่างศรัทธา"
 raised_other_faiths_mystic_modifier_desc: "ตัวละครนี้เลี้ยงดูผู้นับถือรุ่นเยาว์ที่โดดเด่นของความเชื่ออื่น"

 insisting_on_norms_modifier: "ยืนกรานในบรรทัดฐาน"
 insisting_on_norms_modifier_desc: "ข้าราชบริพารถูกจับตามองอย่างใกล้ชิด วิถีทางต่างชาติหรือนอกรีตใดๆ ถูกจำกัด"

 custom.every_same_culture_courtier: "ทุก [courtier|E] ที่มี [culture|E] เดียวกัน"

 travel_events.5001.t: "เรื่องเล่ากระซิบกระซาบ"
 travel_events.5001.desc: "นี่เป็นครั้งที่สามของวันนี้แล้วที่ข้าได้ยินคนท้องถิ่นพูดจาไร้สาระเกี่ยวกับนิทานเรื่องหนึ่งขณะที่เราผ่านพวกเขาไป [travelling_character.GetFirstName] เห็นความสับสนของข้า\n\n"มันเป็นเรื่องเล่าประจำภูมิภาค [ROOT.Char.Custom('FormOfAddressForLiege')] พวกเขาเรียกมันว่า [potential_legend.GetName]" [travelling_character.GetSheHe|U] บอกอย่างไว้ใจ\n\nอืม มันฟังดูน่าสนใจทีเดียว..."
 travel_events.5001.a: "ข้าจะรับเรื่องเล่านี้ไว้!"
 travel_events.5001.b: "ข้าคงจะต้องพูดถึงมันด้วยตัวเองแน่ๆ"
 travel_events.5001.b.flavor: "อย่างน้อยมันก็จะเป็นเรื่องสนุกสำหรับใครก็ตามที่ข้าควรจะได้พบในการเดินทางของข้า!"
 travel_events.5001.c: "นี่มันเรื่องไร้สาระ"
