 travel_events.1010.desc:0 "ตามคำขอของข้า คนรับใช้ของข้าได้รวบรวมตัวเลือกสองคนมาให้ข้าพิจารณาสำหรับตำแหน่งนายกองคาราวาน กล่าวกันว่า [great_travel_leader_option.GetName] เป็นผู้มีประสบการณ์มากกว่า แต่แน่นอนว่า [good_travel_leader_option.GetName] ถูกกว่า "
 travel_events.1010.a:1 "[great_travel_leader_option.GetNameNoTooltip] เป็นตัวเลือกที่ดี"
