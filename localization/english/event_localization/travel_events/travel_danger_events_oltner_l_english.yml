l_english: 
 travel_danger_events.9000.t:1 "$travel_danger_prefix$ หายนะอันน่ารำคาญ"
 travel_danger_events.9000.desc:0 "[location.Custom('GetTerrainTypePlural')] แห่ง [location.GetName] #EMP เต็มไปหมด#! ด้วยแมลงตัวเล็ก สีดำ ดูดเลือด ไม่ว่าเราจะทำอะไร หรือไปที่ไหน พวกมันก็อยู่ที่นั่น — ดูดเลือดของเราเหมือนเมฆาทรมานที่ส่งมาจาก [ROOT.Char.GetFaith.DevilName] [ROOT.Char.GetFaith.DevilHerselfHimself]!\n\nไม่เพียง แต่ม้าจะตื่นตกใจและหงุดหงิดเท่านั้น แต่ผู้ติดตามของข้าก็ เช่นกัน... โดยเฉพาะอย่างยิ่ง [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('mosquito_victim'))] [mosquito_victim.GetFirstName] ของข้า ผู้ ซึ่งกำลังโบกแขนที่เปื้อนเลือดของ [mosquito_victim.GetHerHis] อย่างบ้าคลั่ง"
 travel_danger_events.9000.deviant:0 "#EMP น่าพึงพอใจยิ่งนัก!#! ทุกคน, ถอดเสื้อผ้าออก!"
 travel_danger_events.9000.herbalist:0 "ข้าคิดว่าสมุนไพรนี้อาจช่วยเราได้..."
 travel_danger_events.9000.a:0 "ฝ่าไป, พวกมันเป็นแค่ #EMP แมลง!#!"
 travel_danger_events.9000.b:0 "[mosquito_victim.GetFirstNameNoTooltip]! ถอดเสื้อผ้า, เจ้าจะเดินนำหน้า"
 drained_by_mosquitoes_modifier:0 "ถูกยุงสูบเลือด"
 drained_by_mosquitoes_modifier_desc:0 "ตัวละครนี้ถูกฝูงแมลงดูดเลือดโจมตี, สูบเลือดในปริมาณที่ไม่น้อยไปจากแก่นแท้แห่งโลหิตของพวกเขา"
 
 travel_danger_events.9010.t:1 "$travel_danger_prefix$ กิ่งไม้ในล้อ"
 travel_danger_events.9010.desc:0 ""[location.Custom('GetRandomRegionalDanger')|U]!" ข้าได้ยิน [irritated_character.GetFirstName] ตะโกนด้วยความตื่นตระหนก ไม่นานหลังจากนั้นข้าก็ได้ยินเสียงแตกดังลั่น — เหมือนเสียงไม้หัก, หรือความอดทนของข้าที่ขาดสะบั้นลงในที่สุด\n\nข้าก้าวออกไปบน [location.Custom('GetProvinceGroundDesc')] เพื่อดูเศษซากล้อเกวียนที่แตกละเอียด... ล้อเกวียน #EMP ของข้า#! \n\n"ข้าขออภัย, [irritated_character.Custom2('RelationToMeShort', SCOPE.sC('root_scope'))] ของข้า ถึงเวรยามของข้า, และข้าเผลอหลับไปขณะคุมบังเหียน...""
 travel_danger_events.9010.strong:0 "#EMP *ถอนหายใจเสียงดังขณะยกเกวียนขึ้นจากพื้น*#!"
 travel_danger_events.9010.a:0 "[root_scope.Custom('CulturalCurse')|U]... เราจะไปสายกันหมด"
 travel_danger_events.9010.b:0 "จัดเสบียงใหม่, ข้าจะขี่แบบสมบุกสมบันจากนี้ไป..."
 
 travel_danger_events.9020.t:1 "$travel_danger_prefix$ ความผอมโซที่ปรากฏ"
 travel_danger_events.9020.desc.first:0 ""เรา... เรา #EMP หมดเกลี้ยง#! แล้ว ซึ่ง [ROOT.Char.Custom('GetExpensiveDessert')]!" [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('emaciated_character'))] [emaciated_character.GetFirstName] ของข้าพูดตะกุกตะกักอย่างประหม่า "และ [ROOT.Char.Custom('GetExpensiveMeal')], และ [ROOT.Char.Custom('GetExpensiveMealAlt')], และ [ROOT.Char.Custom('GetLocalStreetFoodPlural')], และแม้กระทั่ง #EMP [ROOT.Char.Custom('get_region_root_vegetable_plural')]!#!"\n\n"
 travel_danger_events.9020.desc.war:0 ""ทหารที่คุ้ยหาของเหล่านั้นหนีไปพร้อมกับทุกสิ่งที่เรามีในตอนกลางคืน! เราไม่เหลือแม้ แต่ #EMP เศษขนมปังเดียว!#!" [emaciated_character.GetSheHe|U] ร้องไห้ "เรากำลังจะอดตาย!""
 travel_danger_events.9020.desc.other:0 ""เราน่าจะเตรียมอาหารมามากกว่านี้ — ไม่เหลือแม้ แต่ #EMP เศษขนมปังเดียว#!, และไม่มีอะไรกินสุดลูกหูลูกตา!" [emaciated_character.GetSheHe|U] ร้องไห้ "เรากำลังจะอดตาย!""
 travel_danger_events.9020.desc.last:0 "\n\nบางทีข้าไม่ควรกิน [ROOT.Char.Custom('GetExpensiveMeal')] สามส่วนพร้อมซอส [ROOT.Char.Custom('GetFoodDetail')] เมื่อวานนี้กระมัง?"
 travel_danger_events.9020.desc.last.alt:0 "\n\nแต่.. ข้ากินเหมือนหนูดอร์เมาส์, นี่มันยุติธรรมแล้วหรือ?"
 travel_danger_events.9020.a:0 "ข้าหวังว่าเราจะกินคำพูดเหล่านั้นได้นะ..."
 travel_danger_events.9020.b:0 "สิ่งเล็กน้อยที่เรามีตกเป็นของ #EMP ข้า!#!"
 travel_danger_events.9020.hunter:0 "ต้องมีเหยื่ออยู่ที่ไหนสักแห่งแน่!"
 travel_danger_events.9020.cannibal:0 "โอ้ [emaciated_character.GetFirstNameNoTooltip], เจ้าจะสละชีวิตเพื่อ [ROOT.Char.GetPrimaryTitle.GetBaseNameNoTierNoTooltip] หรือไม่?"
 emaciated_modifier:0 "ผอมโซ"
 emaciated_modifier_desc:0 "ตัวละครนี้เดินทางมาเป็นระยะทางไกลโดยไม่มีอาหารเลย"
 cannibalicus_maximus:0 "ท่านและสมาชิกผู้ติดตามทุกคนจะได้รับความลับ [secret|E] มนุษย์กินคน, หากท่านยังไม่ได้เป็นมนุษย์กินคนอยู่แล้ว"
 
 travel_danger_events.9030.t: "$travel_danger_prefix$ ติดหล่ม"
 travel_danger_events.9030.desc: "วันนี้ฝนตกไม่หนักนัก แต่มันตกไม่หยุดหย่อน — ถนนเบื้องหน้ากลายเป็นโคลนหนาเตอะ รถม้ากำลังจมลงไป และหมอกหนาก็ทำให้มองเห็นได้ยาก\n\nเราจะไปไหนไม่ได้อีกพักใหญ่"
 travel_danger_events.9030.caravan_master: "[GetCourtPositionType('travel_leader_court_position').GetNameNoTooltip()] ของข้าสามารถรับมือกับโคลนตมแค่นี้ได้"
 travel_danger_events.9030.a: "ขอสาปแช่งสภาพอากาศนี้"
 EVENT_WINDOW_OPTION_AVAILABLE_CARAVAN_MASTER: "ตัวเลือกนี้สามารถใช้ได้เนื่องจาก [GetCourtPositionType('travel_leader_court_position').GetName()] ของท่าน"
 
 travel_danger_events.9040.t: "$travel_danger_prefix$ พายุฝน"
 travel_danger_events.9040.desc: "ข้ามองอะไรไม่เห็นเลย — ฝนตกหนักเกินไป พวกเราเปียกปอนไปถึงกระดูก และเสียงฟ้าร้องทุกครั้งก็ทำให้ม้าตื่นตระหนก\n\nแล้วข้าก็ตระหนักถึงสิ่งเลวร้ายบางอย่าง...\n\n[victim.GetFirstName] [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('victim'))]ของข้าหายไปไหนกัน?"
 travel_danger_events.9040.caravan_master: "[travel_leader.GetFirstNameNoTooltip] จงไปตามหา[victim.GetHerHim]!"
 travel_danger_events.9040.a: "ขอ [ROOT.Char.GetFaith.HighGodName] ทรงเมตตาต่อ [victim.GetFirstNameNoTooltip]"
 low_aptitude_caravan_master_reason_tooltip: "[aptitude|E]ของ[travel_leader.GetFirstNamePossessive|U] ในฐานะ [GetCourtPositionType('travel_leader_court_position').GetName()] นั้นมีเพียง [travel_leader.GetCourtPositionAptitude( GetCourtPositionType( 'travel_leader_court_position' ) )]"
 
 travel_danger_events.9050.t: "$travel_danger_prefix$ จิตใจล่องลอย"
 travel_danger_events.9050.desc: "การเดินทางร่วมกับ [victim.GetFirstName] [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('victim'))]ของข้า กลายเป็นความท้าทายอย่างยิ่ง — [GetTrait('withering_mind').GetName( GetNullCharacter )]ของ[victim.GetHerHis]ค่อยๆ เลือนรางลงไปทุกวัน\n\nข้าต้องคอยเตือน[victim.GetHerHim]อยู่เสมอ: #EMP "เรากำลังมุ่งหน้าไปที่ [ROOT.Char.GetTravelPlan.GetData.GetFinalDestination.GetProvince.GetName]! [ROOT.Char.GetTravelPlan.GetData.GetActivity.GetShortName] จำได้ไหม?"#! แต่ดูเหมือนมันจะไม่เคยอยู่ในหัวของ[victim.GetHerHim]เลย\n\nและตอนนี้ คนแก่โง่เขลาผู้นั้นก็เดินเตร่หายไปไหนก็ไม่รู้ หาตัวไม่พบเลย..."
 travel_danger_events.9050.caravan_master: "หัวหน้ากองคาราวาน [travel_leader.GetFirstNameNoTooltip] ของข้าสามารถตามหา[victim.GetHerHim]พบได้"
 travel_danger_events.9050.a: "[victim.GetFirstNameNoTooltip] หลงทางไปแล้ว เราต้องเดินทางต่อ"
 travel_danger_events.9050.b: "หยุดก่อน! เราต้องค้นหา [victim.GetFirstNameNoTooltip]"
 death_lost: "เดินหลงทางและไม่มีใครพบเห็นอีกเลย"
 9050_lost: "[victim.GetFirstName] สูญหายไปตลอดกาล"
 9050_found: "[victim.GetFirstName] ขวัญเสีย แต่ถูกค้นพบแล้ว"
 
 travel_danger_events.9060.t: "$travel_danger_prefix$ ผู้โดยสารที่บอบบาง"
 travel_danger_events.9060.desc: ""โอ๊ย โอ๊ย! ได้โปรด หยุดรถม้าที — ข้าขอร้องล่ะ!" [victim.GetFirstName] [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('victim'))]ของข้า ร้องโอดครวญกับคนขับรถม้า "[elder_trait.GetName(GetNullCharacter)]ของข้าทนต่อแรงกระแทก ก้อนหิน และการสั่นคลอนไม่ไหวอีกต่อไปแล้ว!"\n\nถนนอันขรุขระแห่ง [location.GetName] กำลังกัดกินร่างกายอันอ่อนแอของ[victim.GetHerHis]\n\nบางทีเราควรจะลดความเร็วลงสักหน่อย"
 travel_danger_events.9060.sadistic: "#EMP ...เราต้องไปให้เร็วกว่านี้#!"
 travel_danger_events.9060.a: "เราจะไม่หยุดหรอก"
 travel_danger_events.9060.b: "เราต้องคำนึงถึงความสะดวกสบายของ [victim.GetFirstNamePossessiveNoTooltip]"
 traveling_slowly_modifier: "การเดินทางที่เชื่องช้าอย่างน่าเจ็บปวด"
 traveling_slowly_modifier_desc: "คณะเดินทางนี้เคลื่อนที่ไปอย่างเชื่องช้า ทำให้ตกเป็นเป้าหมายของพวกโจรปล้นคนเดินทางได้ง่าย"
 9060_wounded: "[victim.GetFirstName] ได้รับบาดเจ็บ"
