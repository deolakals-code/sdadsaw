l_english: 
 #Travel City Events
 #Generic:
 travel_city_companion_impressed:0 "\n\n[ROOT.Char.Custom2('RelationToMe', sightseeing_companion)] ของข้าพึมพำกับข้าขณะชมภาพอันน่าตื่นตาตื่นใจทางวิชาการนี้: “ข้าสามารถใช้เวลาทั้งชีวิตที่นี่ได้จริงๆ [ROOT.Char.Custom2('RelationToMeAddress', sightseeing_companion)|U]”\n"
 travel_city_companion_idea:0 "\n\n[sightseeing_companion.GetFirstName] [ROOT.Char.Custom2('RelationToMe', sightseeing_companion)] ของข้าครุ่นคิดอย่างไตร่ตรอง “[ROOT.Char.Custom2('RelationToMeAddress', sightseeing_companion)|U] เราสามารถใช้เวลาที่นี่เพื่อศึกษาขนบธรรมเนียมของพวกเขาได้”"
 travel_city_option_study_locals: "มาเรียนรู้สิ่งที่เราสามารถทำได้ที่นี่กันเถอะ"
 travel_city_option_souvenir: "ข้าจะหาของบางอย่างจากที่นี่กลับบ้านไป"
 travel_city_option_reflection_on_existance: "มันคุ้มค่าที่จะคิดว่าชีวิตเปราะบางเพียงใด"
 travel_city_option_reflection_on_existance_tooltip:0 "ข้าใช้เวลาใคร่ครวญถึงธรรมชาติอันเปราะบางของชีวิต"
 travel_city_contemplated_life_and_death:0 "ข้าใคร่ครวญถึงชีวิตและความตาย"
 travel_city_contemplated_religion_tooltip:0 "ข้าใช้เวลาใคร่ครวญถึงธรรมชาติของพระคริสต์"
 travel_city_religious_mystic:0 "ข้าเชื่อมโยงกับด้านลึกลับแห่งศรัทธาของข้า"
 travel_city_contemplated_life_and_death_companion:0 "[sightseeing_companion.GetName] และข้าสนทนาเรื่องชีวิตและความตาย"
 travel_city_option_learn_local_history: "ข้าต้องรู้เพิ่มเติมเกี่ยวกับนครที่เคยเป็น"
 travel_city_duel_history_fail:0 "[sightseeing_companion.GetName] ล้มเหลวในการสอนประวัติศาสตร์ของ [city_province.GetNameNoTooltip] แก่ข้า"
 travel_city_duel_teaching_fail_no_companion:0 "ข้าล้มเหลวในการเรียนรู้สิ่งที่มีค่าใดๆ ใน [city_province.GetNameNoTooltip]"
 travel_city_option_learning: "โอกาสอันดีสำหรับการสนทนาที่ได้เรียนรู้"
 travel_city_duel_teaching_great_success:0 "ข้าได้รับข้อมูลเชิงลึกอันยอดเยี่ยมจากการพักอยู่ใน [city_province.GetNameNoTooltip]"
 travel_city_duel_teaching_success:0 "ข้าเรียนรู้สิ่งใหม่ๆ ใน [city_province.GetNameNoTooltip]"
 travel_city_duel_teaching_fail:0 "ข้าสร้างความประทับใจได้พอประมาณ"
 travel_city_duel_teaching_great_fail:0 "ข้า ทำให้ตัวเองอับอายในการมีปฏิสัมพันธ์กับคนท้องถิ่นใน [city_province.GetNameNoTooltip]"
 travel_city_duel_learning_fail:0 "ข้าล้มเหลวในการเรียนรู้จากประวัติศาสตร์"
 duel_companion_tooltip:0 "[sightseeing_companion.GetName] ได้เพิ่มโอกาสของผลลัพธ์ที่เป็นบวกของตัวเลือกนี้"
 travel_city_option_study_fortifications: "ให้เราศึกษาอาคารอันน่าทึ่งเหล่านี้"
 travel_city_option_party_hard:0 "ข้าจะเพลิดเพลินกับทุกสิ่งที่สถานที่แห่งนี้มีให้!"
 travel_city_option_earn_money: "นี่เป็นโอกาสที่จะ #EMP ได้รับ#! เงิน!"
 travel_city_new_dessert:0 "[ROOT.Char.Custom('FavoriteTreat')] ของ [city_province.GetNameNoTooltip] ทำให้ข้าประทับใจ"
 travel_city_new_techniques:0 "ข้าจะนำเทคนิคและแบบสมัยนิยมใหม่ๆ จาก [city_province.GetNameNoTooltip] กลับบ้าน"
 travel_city_well_rested:0 "ข้าได้พักผ่อนอย่างสงบสุขใน [city_province.GetNameNoTooltip]"
 travel_city_resupplied:0 "ข้าสามารถหาเงินและเติมเสบียงได้ใน [city_province.GetNameNoTooltip]"
 travel_city_option_opt_out: "ข้าจะไม่เสียเวลาใดๆ ในสถานที่แห่งนี้"
 travel_city_major_windfall: "ข้าหาเงินได้เพียงเล็กน้อย แต่เรียนรู้ได้มาก ณ ย่านผู้ให้กู้ยืมเงินของ [city_province.GetNameNoTooltip]"
 travel_city_gained_money: "ข้าพบนักการเงิน ณ ย่านผู้ให้กู้ยืมเงินของคอนสแตนติโนเปิล"
 travel_city_option_opt_out_tooltip:0 "ใช้เวลาใน [city_province.GetNameNoTooltip] เพียงเท่าที่จำเป็นเพื่อเตรียมการเดินทางต่อไป"
 souvenir_bought_companion:0 "[sightseeing_companion.GetName] ช่วยข้าหา [souvenir.GetName] มาได้"
 book_souvenir_companion_tooltip:0 "โอกาสในการหาหนังสือที่ดีขึ้นเพิ่มขึ้นโดยสหายร่วมทางของข้า [sightseeing_companion.GetName]"
 book_souvenir_tooltip:0 "จะได้รับสิ่งประดิษฐ์ประเภทหนังสือจากตลาดหนังสือ"
 book_souvenir_bought:0 "[souvenir.GetName] ถูกซื้อจากตลาดหนังสือของ [city_province.GetNameNoTooltip]"
 book_artifact_loc:0 "[souvenir.GetDesc]\n\nในหน้าสุดท้ายมีคนเขียนบันทึกย่อเกี่ยวกับการซื้อมันมาจากตลาดหนังสือของ [city_province.GetName]"
 regalia_artifact_loc: "[souvenir.GetDesc]\n\nเครื่องราชกกุธภัณฑ์ถูกห่อด้วยผ้าชิ้นหนึ่ง ซึ่งมีคนเขียนบันทึกย่อเกี่ยวกับการซื้อมันมาจากช่างฝีมือคนหนึ่งใน [city_province.GetName]"
 crown_artifact_loc: "[souvenir.GetDesc]\n\nด้านในของมงกุฎมีตราประทับเล็กๆ จากโรงงานใน [city_province.GetName] ที่ผลิตมันขึ้นมา"
 souvenir_companion_tooltip:0 "โอกาสในการหาสิ่งประดิษฐ์ที่ดีขึ้นเพิ่มขึ้นโดยสหายร่วมทางของข้า [sightseeing_companion.GetName]"
 souvenir_tooltip:0 "จะได้รับสิ่งประดิษฐ์จากตลาดของ [city_province.GetNameNoTooltip]"
 souvenir_bought:0 "[souvenir.GetName] ถูกซื้อใน [city_province.GetNameNoTooltip]"

 #Baghdad - Specific:
 travel_city_baghdad_intro:0 "เมื่อผ่านประตูเมือง [city_province.GetNameNoTooltip] เป็นเรื่องยากที่จะไม่ใคร่ครวญถึงการมาถึงศูนย์กลางดั้งเดิมของโลกที่พูดภาษาอาหรับและโลกอิสลาม\n\n"
 travel_city_baghdad_suq_al_warraqin_title:0 "[city_province.GetNameNoTooltip]: ซุค อัล-วัรรอกีน"
 travel_city_baghdad_royal_enclosure_title:0 "[city_province.GetNameNoTooltip]: เขตพระราชฐาน"
 travel_city_baghdad_cemeteries_title:0 "[city_province.GetNameNoTooltip] แห่งอดีตกาล"
 travel_city_baghdad_suq_al_warraqin:0 "ขณะที่ข้าเข้าใกล้นครชั้นใน อากาศก็เต็มไปด้วยการสนทนาวรรณกรรมเชิงปัญญา ถนนทั้งสายนี้ แม้กระทั่งสะพาน ก็เต็มไปด้วยร้านหนังสือและร้านวรรณกรรมที่พลุกพล่านหลายร้อยแห่ง"
 travel_city_baghdad_royal_enclosure:0 "ณ ชานเมืองชั้นใน ข้าพบว่าตัวเองรายล้อมไปด้วยพระราชวังเล็กๆ ห้องครัว และร้านขนมปัง ที่สูงตระหง่านเหนือเราตลอดเวลาคือโดมสีเขียวของพระราชวังประตูทองคำ"
 travel_city_baghdad_cemeteries:0 "ระหว่างทางผ่านนคร ข้าสังเกตเห็นซากปรักหักพังและอนุสาวรีย์เก่าแก่มากมาย ในที่สุดข้าก็พบว่าตัวเองอยู่ข้างสุสาน ท่ามกลางหลุมฝังศพของคอลีฟะห์และนักวิชาการด้านกฎหมายในอดีตกาล"
 travel_city_baghdad_companion_reflection:1 "\n\n[sightseeing_companion.GetName] [ROOT.Char.Custom2('RelationToMe', sightseeing_companion)] ของข้าให้ข้อสังเกตว่าคนเหล่านี้คือผู้ที่รู้จักแบกแดดที่แตกต่างออกไป แทบจำไม่ได้ในปัจจุบัน"

#Rome - Specific
 travel_city_rome_intro:0 "จากระยะไกล นคร [city_province.GetNameNoTooltip] คือป่าแห่งหอคอยและเขาวงกตของอาคารหิน ขณะที่เราเข้าใกล้ ทิวทัศน์ก็เปลี่ยนไป: ซากปรักหักพังของอนุสาวรีย์ กำแพง และโบสถ์โบราณอยู่ร่วมกับฟาร์มและสัตว์ที่กำลังเล็มหญ้า\n\n"
 travel_city_rome_fortified_monuments_title:0 "[city_province.GetNameNoTooltip]: อนุสาวรีย์ที่มีป้อมปราการ"
 travel_city_rome_fortified_monuments:0 "ระหว่างทางผ่านนคร ข้าสังเกตเห็นว่าซากปรักหักพังได้รับการเสริมความแข็งแกร่งอย่างระมัดระวังโดยตระกูลที่เป็นศัตรูกัน ด้วยวิธีนี้ สุสานหลวงของเฮเดรียนและแม้ แต่โคลอสเซียมก็กลายเป็นป้อมปราการไปแล้ว"
 travel_city_rome_caesars_needle_title:0 "[city_province.GetNameNoTooltip]: เข็มของซีซาร์"
 travel_city_rome_caesars_needle:0 "ขณะที่เราหยุดอยู่หน้าเสาโอเบลิสก์ขนาดใหญ่ ชาวบ้านคนหนึ่งเล่าว่าที่ด้านบนสุด เถ้ากระดูกของจูเลียส ซีซาร์วางอยู่ในกล่องกลมเล็กๆ\n\n#EMP "ในความตายเช่นเดียวกับในชีวิต ซีซาร์ได้รับการยกย่องเหนือชาวโรมันทั้งปวง"#!"
 travel_city_rome_companion_reflection:0 "\n[sightseeing_companion.GetName] [ROOT.Char.Custom2('RelationToMe', sightseeing_companion)|U] ของข้าเสริมว่าเราควรใช้โอกาสนี้เรียนรู้เกี่ยวกับนครแห่งนี้"
 travel_city_rome_alone_reflection:0 "\nข้าอดไม่ได้ที่จะใคร่ครวญถึงอายุอันมหาศาลของนครแห่งนี้"
 travel_city_rome_pilgrims_and_shrines_title:0 "[city_province.GetNameNoTooltip]: ศาลเจ้าและผู้แสวงบุญ"
 travel_city_rome_pilgrims_and_shrines:0 "ดูเหมือนว่าจะมีผู้แสวงบุญอยู่ทุกหนทุกแห่ง กำลังต่อรองราคา สนทนา และต่อแถวไปยังศาลเจ้าและสุสานของนักบุญในนคร คฤหาสน์ของขุนนางที่ถูกลืม บัดนี้ทำหน้าที่เป็นที่พักแรมสำหรับผู้ศรัทธา"

#Constantinople - Specific
 travel_city_constantinople_augustaion_title: "[city_province.GetBaronyNameExplicitlyNoTooltip]: ศูนย์กลางของโลก"
 travel_city_constantinople_aqueducts_title: "[city_province.GetBaronyNameExplicitlyNoTooltip]: ท่อส่งน้ำและถังเก็บน้ำ"
 travel_city_constantinople_goldsmiths_moneychangers_title: "[city_province.GetBaronyNameExplicitlyNoTooltip]: ช่างทองและผู้รับแลกเปลี่ยนเงินตรา"
 PROSPHORION_GLOSS: "ท่าเรือพาณิชย์ทางตอนเหนือของ [GetTitleByKey('b_constantinople').GetNameNoTier] นครแห่งนี้ยังมีท่าเรือทางทหาร พาณิชย์ และของจักรวรรดิอีกจำนวนหนึ่ง"
 travel_city_constantinople_intro: "เป็นไปไม่ได้ที่จะมองไม่เห็น [city_province.GetBaronyNameExplicitlyNoTooltip] ที่ขอบฟ้า ด้วยกำแพงขนาดมหึมาที่สูงตระหง่านเหนือภูมิประเทศ และเมื่อเคลื่อนตัวขึ้นไปตาม [Glossary( 'ถนนเมเซ', 'MESE_GLOSS')] ฝูงชนก็ดูน่าเกรงขามไม่แพ้กัน\n\n"
 travel_city_constantinople_intro_chalcedon: "ชาวคอนสแตนติโนเปิลคุ้นเคยกับผู้มาเยือนที่แปลกตา แทบไม่สังเกตเห็นเราในท่าเรือ [Glossary( 'พรอสโฟเรียน', 'PROSPHORION_GLOSS')] #EMP เรา#! พบว่ากำแพงทะเลของ [city_province.GetBaronyNameExplicitlyNoTooltip] นั้นน่าทึ่งแม้จะมองจากท่าเทียบเรือของ [last_visited_location.GetBaronyNameExplicitlyNoTooltip]\n\n"
 travel_city_constantinople_intro_sea: "ขณะที่เราขึ้นฝั่งที่ท่าเรือ [Glossary( 'พรอสโฟเรียน', 'PROSPHORION_GLOSS')] เราต่างทึ่งในขนาดของ [city_province.GetBaronyNameExplicitlyNoTooltip] โดยได้เห็นหอคอย โดม และกำแพงทะเลจากระยะไกล\n\n"
 travel_city_constantinople_augustaion: "ช่วงกลางวัน เราพักผ่อนท่ามกลางความร้อนข้างอาคารที่น่าสนใจในจัตุรัสอันน่าทึ่งของ [Glossary( 'ออกุสเตียน', 'AUGUSTAION_GLOSS')] โครงสร้างนี้เป็นที่ตั้งของหลักไมล์ทองคำที่ชาวบ้านยืนยันว่าเป็นเครื่องหมายศูนย์กลางของโลก"
 travel_city_center_of_the_world_reflection: "\n\nรายล้อมไปด้วยอาคารขนาดใหญ่โต ไม่ยากที่จะเชื่อคำกล่าวอ้างของพวกเขา การดำรงอยู่ของข้าเองก็รู้สึกสำคัญน้อยลงในทันใด"
 travel_city_companion_center_of_the_world_reflection:0 "\n\n“[ROOT.Char.Custom2('RelationToMeAddress', sightseeing_companion)|U] นี่คือสถานที่ที่ไม่เหมือนที่ใดที่ท่านเคยไป เรายืนอยู่หน้าประวัติศาสตร์กว่าพันปี”"
 AUGUSTAION_GLOSS: "ออกุสเตียนคือจัตุรัสที่อยู่ด้านนอกประตูชาล์คของเขตพระราชวังของคอนสแตนติโนเปิล ที่ปลายสุดของจัตุรัสคือ [Glossary( 'มิเลียน', 'MILION_GLOSS' )] อยู่หน้าฮิปโปโดรม และด้านข้างเป็นที่ตั้งของโรงอาบน้ำขนาดใหญ่ของซูซิปปอสและมหาวิหารฮาเกียโซเฟีย"
 travel_city_constantinople_aqueduct_valens: "ด้วยความอยากรู้อยากเห็น เราเดินตาม [Glossary( 'ท่อส่งน้ำขนาดมหึมา', 'AQUEDUCT_OF_VALENS_GLOSS' )] ไปยังทางเข้าถังเก็บน้ำใต้ดิน ยามคนหนึ่งบอกเราว่ามันเป็นแหล่งน้ำของนครมาหลายชั่วอายุคนและเสนอที่จะพาชมภายในอันกว้างใหญ่ให้เราด้วยเงินจำนวนเล็กน้อย\n"
 travel_city_option_study_aqueducts: "เราต้องทำแผนที่และบันทึกความลึกเหล่านี้"
 travel_city_constantinople_goldsmiths_moneychangers: "ในที่สุดเราก็หยุดพักที่ย่านช่างทอง นี่คือหัวใจทางการเงินของนครที่มีการแลกเปลี่ยน ให้ยืม และฝากเงิน เหรียญทอง [ROOT.Char.GetCurrentLocation.Custom('GetByzantineCoinWithGloss')] ที่มีรูปจักรพรรดิที่ถูกลืมเลือนไปนานแล้วถูกเปลี่ยนมือไปพร้อมกับเหรียญทองแดงและเหรียญอิเล็กตรัม"
 BYZANTINE_COINAGE_GLOSS: "เหรียญทองแดงและเหรียญทองเป็นสกุลเงินหลักในจักรวรรดิไบแซนไทน์ เหรียญทองโซลิดัสและต่อมาคือฮีแปร์ปีรอนเป็นเหรียญที่มีมูลค่าสูงสุดและเป็นที่ต้องการอย่างสูงในตะวันตก ซึ่งเป็นที่รู้จักในชื่อ #EMP เบซันต์#!."
 AQUEDUCT_OF_VALENS_GLOSS: "#EMP ท่อส่งน้ำของวาเลนส์#! ถูกสร้างขึ้นในศตวรรษที่ 4 และยังคงส่งน้ำจืดให้กับนครคอนสแตนติโนเปิลมานานกว่าพันปี การผสมผสานระหว่างถังเก็บน้ำกลางแจ้งและถังเก็บน้ำใต้ดินขนาดมหึมา ทำให้นครสามารถเก็บน้ำได้มากกว่าหนึ่งล้านลูกบาศก์เมตร"
