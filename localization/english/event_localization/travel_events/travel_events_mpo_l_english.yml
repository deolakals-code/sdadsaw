l_english: 
 travel_events_mpo.0001.t: "$travel_event_prefix$ ฝูงปักษาทองคำ"
 travel_events_mpo.0001.desc: "บรรยากาศรอบตัวเรามิได้เงียบสงัดอีกต่อไป เมื่อข้าแหงนมองขึ้นไป ข้าสังเกตเห็นนกขนาดใหญ่สองสามตัวกำลังบินวนอยู่เบื้องบน เสียงร้องของพวกมันสะท้อนก้องไปทั่วทุ่งหญ้าสเตปป์ [eagle_noticer.GetName] ชี้ให้เห็นว่าพวกมันคืออินทรีทอง ซึ่งเป็นภาพที่หาดูได้ยากในแถบนี้\n\n[eagle_noticer.GetSheHe|U] พูดพร่ำถึงความสามารถในการล่าของพวกมัน และว่าหลายคนเลี้ยงพวกมันไว้เป็นสหายตลอดชีวิต [eagle_noticer.GetSheHe|U] ถึงกับเสนอแนะว่าเราควรพยายามจับพวกมันสักตัว เพราะมันอาจเป็นประโยชน์อย่างยิ่งต่อเราในอนาคต"
 travel_events_mpo.0001.a: "ข้าต้องการเพียงมือที่คล่องแคล่วเท่านั้น"
 travel_events_mpo.0001.a_tt: "ท่านสร้างกับดัก และรอคอยจังหวะที่เหมาะสมเพื่อจับอินทรี"
 travel_events_mpo.0001.b: "เรามีเสบียงเหลือพอสำหรับกับดักและเหยื่อล่อ..."
 travel_events_mpo.0001.b_tt: "ท่านสร้างกับดัก และใช้ทรัพยากรของท่านเพื่อเพิ่มประสิทธิภาพของมัน"
 travel_events_mpo.0001.c_noticer: "เหตุใดท่านไม่ทำด้วยตนเองเล่า [huntsmaster.GetFirstNameNoTooltip]?"
 travel_events_mpo.0001.c_huntsmaster: "ข้าเชื่อใจ [huntsmaster.GetFirstNameNoTooltip] ในภารกิจนี้"
 travel_events_mpo.0001.c: "นายพรานสามารถจัดการเรื่องนี้ได้"
 travel_events_mpo.0001.c_tt: "[huntsmaster.GetName] สร้างกับดัก และ [huntsmaster.GetSheHe] จะรอคอยในนามของท่าน"
 travel_events_mpo.0001.c_not: "ท่านไม่ได้จ้าง [GetCourtPositionType('master_of_hunt_court_position').GetName()] หรือพวกเขาไม่ได้เป็นส่วนหนึ่งของ [entourage|E] ของท่าน"
 travel_events_mpo.0001.d: "ข้าจะจับมันตัวหนึ่ง ดังที่ [eagle_childhood_teacher.GetName] เคยได้สอนข้าไว้"
 travel_events_mpo.0001.e: "นั่นก็ดีอยู่หรอก แต่ข้าไม่ต้องการนก"
 travel_events_mpo.0001_win: "ท่านจับอินทรีทองได้สำเร็จ"
 travel_events_mpo.0001_lose: "เหล่าอินทรีระแวดระวังความพยายามของท่านมากเกินไป"

 travel_events_mpo.0010.t: "$travel_event_prefix$ บนอูฐเผือก"
 travel_events_mpo.0010.desc: "ณ สุดขอบฟ้า จุดสีขาวจุดหนึ่งโดดเด่นตัดกับฉากหลังของทุ่งหญ้าสเตปป์ เมื่อข้าเข้าไปใกล้ ข้าจึงมองเห็นร่างของอูฐเผือกตัวหนึ่ง ขนของมันส่องประกายกลางแสงตะวัน แกะหลายสิบตัวหลั่งไหลมาจากพื้นผิว ตามหลังอูฐมาอย่างใกล้ชิด ทันใดนั้น [camel_rider.GetWomanMan] ผู้หนึ่งก็ขึ้นขี่มัน และผู้ขี่ก็ทักทายข้าด้วยรอยยิ้มอันอบอุ่น\n\n"ขอความสันติสุขจงมีแด่ท่าน" [camel_rider.GetSheHe] กล่าว "ดังที่ท่านเห็น อัลลอฮ์ได้ประทานพรแก่ข้าอย่างอุดมสมบูรณ์ ข้าสามารถมอบของขวัญนี้ให้แก่ผู้อื่นได้ ข้าจะสามารถ ทำให้ท่านสนใจสิ่งใดได้บ้างหรือไม่?""
 travel_events_mpo.0010.a: "ข้าอาจต้องการฝูงสัตว์ของท่านบ้าง"
 travel_events_mpo.0010.a_flavor: "ท่านซื้อแกะจาก [camel_rider.GetName]"
 travel_events_mpo.0010.b: "ศรัทธาของท่านเป็นของขวัญในตัวมันเอง"
 travel_events_mpo.0010.b_islamic: "ขอพรจงมีแด่ท่าน สหายของข้า"
 travel_events_mpo.0010.b_flavor: "อัลลอฮ์จะประทานพรสิ่งใดให้ข้าได้บ้าง?"
 travel_events_mpo.0010.c: "ความต้องการของข้า ข้าจะยึดมาด้วยกำลัง"
 travel_events_mpo.0010.c_tt: "ท่านพยายามขโมยสินค้าของ [camel_rider.GetNamePossessive]"
 travel_events_mpo.0010_win: "ท่านเอาชนะ [camel_rider.GetHerHim] ได้"
 travel_events_mpo.0010_lose: "[camel_rider.GetSheHe|U] เอาชนะท่านได้"

 mpo_islam_conversion_modifier: "การพิจารณาศาสนาอิสลาม"
 mpo_islam_conversion_modifier_desc: "ตัวละครนี้ได้สัมผัสกับคำสอนของศาสนาอิสลาม และกำลังพิจารณาที่จะเปลี่ยนศาสนา\n\nค่าใช้จ่ายในการเปลี่ยนไปนับถือ [faith|E] แบบ [GetReligionByKey('islam_religion').GetAdjective]: #p -25%#!"
 faith_conversion_cost_mpo_islam_event: "[GetModifier('mpo_islam_conversion_modifier').GetNameWithTooltip]"
