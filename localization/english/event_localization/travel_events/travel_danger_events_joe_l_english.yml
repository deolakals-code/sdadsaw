l_english: 
#Travel Danger Events
#Land: Beast of the wild
 travel_danger_events.6000.t:0 "$travel_danger_prefix$ สัตว์ร้ายน่าสะพรึงกลัว!"
 travel_danger_events.6000.desc:0 "เราเดินไปตามเส้นทาง [ROOT.Char.GetCurrentLocation.Custom('GetTerrainType')] ด้วยความเร็วที่ดี, เพลิดเพลินกับบรรยากาศอันเงียบสงบ หางตาของข้า, ข้ามั่นใจว่าข้าเหลือบเห็น [ROOT.Char.Custom('GetAnimalFeature')] ของ...! เสียง [ROOT.Char.Custom('GetAnimalSound')] ดังลั่นยืนยัน, มันคือ [ROOT.Char.Custom('GetAnimalType')]!"
 travel_danger_events.6000.desc.again:0 "ข้าเหยียบย่ำเส้นทาง [ROOT.Char.GetCurrentLocation.Custom('GetTerrainType')] อย่างช้าๆ, ระมัดระวังหลังจากการเผชิญหน้ากับสัตว์ป่าครั้งล่าสุด หัวใจข้าหล่นวูบเมื่อได้ยินเสียง [ROOT.Char.Custom('GetAnimalSound')] ใน [ROOT.Char.GetCurrentLocation.Custom('GetProvinceFoliageDesc')] — [ROOT.Char.GetFaith.FateGodName] เยาะเย้ยข้า! [ROOT.Char.Custom('GetAnimalType')]!"
 travel_danger_events.6000.desc.seriously:0 "ด้วยความหวาดผวาจากโชคร้ายครั้งล่าสุด, เราเดินทางผ่านเส้นทางของ [ROOT.Char.GetCurrentLocation.Custom('GetTerrainTypePlural')] ด้วยความระมัดระวังสูงสุด ทันทีที่ข้าเริ่มผ่อนคลาย, เสียง [ROOT.Char.Custom('GetAnimalSound')] ก็ดังสนั่นออกมาจาก [ROOT.Char.GetCurrentLocation.Custom('GetProvinceFoliageDesc')]! [ROOT.Char.Custom('GetAnimalType')] บ้าเอ๊ย!"
 travel_danger_events.6000.body:0 "\n\nสัตว์ร้ายสี [ROOT.Char.Custom('GetAnimalColor')] [ROOT.Char.Custom('GetAnimalChargePresent')] เข้ามาบนเส้นทาง, [ROOT.Char.Custom('GetAnimalTrackPlural')] อันใหญ่โตของมันเตะ [ROOT.Char.GetCurrentLocation.Custom('GetProvinceGroundDesc')] ฟุ้งกระจาย ขนาบข้างด้วยต้น [ROOT.Char.GetCurrentLocation.Custom('GetRandomAppropriateTree')], มันขวางทางเราไปยัง [destination.GetBaronyNameExplicitlyNoTooltip] อย่างสมบูรณ์"
 travel_danger_events.6000.victim:0 "\n\n[beast_victim.GetFirstName] กระซิบ, "ดู #EMP [ROOT.Char.Custom('GetAnimalDanger')]#! นั่นสิ...""
 travel_danger_events.6000.a:0 "หลีกไป, ข้าจะจัดการเอง!"
 travel_danger_events.6000.a_again:0 "ข้าจะส่งเจ้าไปอยู่กับตัวอื่น!"
 travel_danger_events.6000.a_seriously:0 "ให้ข้า #EMP ผ่าน#! ไป!!"
 travel_danger_events.6000.a.wounded.t:0 "รอด แต่บาดเจ็บ"
 travel_danger_events.6000.a.wounded.desc:0 "ลูกเรือช่วย [overboard_character.GetShortUIName] ไว้ได้ แต่ [overboard_character.GetSheHe] ได้รับบาดเจ็บจากการตก"
 travel_danger_events.6000.b:0 "ฆ่ามัน, [beast_victim.GetFirstNameNoTooltip]! เดี๋ยวนี้!"
 travel_danger_events.6000.b_again:0 "ตาเจ้าแล้ว, [beast_victim.GetFirstNameNoTooltip]!"
 travel_danger_events.6000.b_seriously:0 "ตัวนี้ #EMP ของเจ้า#!, [beast_victim.GetFirstNameNoTooltip]!"
 travel_danger_events.6000.b_travel_leader:0 "[travel_leader.GetFirstNameNoTooltip], ทำอะไรสักอย่างสิ!"
 travel_danger_events.6000.c:0 "#EMP หนี#!! หนีเอาชีวิตรอด#!!"
 travel_danger_events.6000.success:0 "[ROOT.Char.Custom('GetAnimalType')] ตายด้วยน้ำมือของ [beast_victim.GetShortUINamePossessiveNoTooltipNoFormat]"
 travel_danger_events.6000.wound:0 "[ROOT.Char.Custom('GetAnimalType')] ขย้ำ [beast_victim.GetShortUINameNoTooltipNoFormat]"
 travel_danger_events.6000.failure:0 "[ROOT.Char.Custom('GetAnimalType')] ฆ่า [beast_victim.GetShortUINameNoTooltipNoFormat]"
 travel_danger_events.6000.success_root: "[ROOT.Char.Custom('GetAnimalType')] ตายด้วยน้ำมือของ [root_scope.GetShortUINamePossessiveNoTooltipNoFormat]"
 travel_danger_events.6000.wound_root: "[ROOT.Char.Custom('GetAnimalType')] ขย้ำ [root_scope.GetShortUINameNoTooltipNoFormat]"
 travel_danger_events.6000.failure_root: "[ROOT.Char.Custom('GetAnimalType')] ฆ่า [root_scope.GetShortUINameNoTooltipNoFormat]"

 travel_danger_events.6010.t:0 "$travel_danger_prefix$ ควันเบื้องหน้า"
 travel_danger_events.6010.raid:0 "ขณะที่เราเข้าใกล้ [ROOT.Char.GetCurrentLocation.GetBaronyNameExplicitlyNoTooltip], กลุ่มควันและกลุ่มชาวบ้านที่เดินผ่านไปมา ทำให้เห็นได้ชัดว่าสถานที่แห่งนี้กำลังถูกปล้นสะดม ผู้แข็งแกร่งย่อมเอาสิ่งที่ตนต้องการได้...\n\n"
 travel_danger_events.6010.siege:0 "ค่ายล้อมเมืองตั้งตระหง่านอยู่บริเวณชานเมือง [ROOT.Char.GetCurrentLocation.GetBaronyNameExplicitlyNoTooltip], ธงสี [siege_owner.GetPrimaryTitle.GetAdjectiveNoTooltip] โบกสะบัดอย่างเชื่องช้า, เป็นลางบอกเหตุของ [siege_war.Custom('WarCasusBelliShort')]\n\n"
 travel_danger_events.6010.victim:0 "ข้าเจ็บปวดที่เห็นดินแดนของข้าถูกทำลายล้าง เช่นนี้ แต่นี่ไม่ใช่การต่อสู้ที่ข้าจะชนะได้"
 travel_danger_events.6010.owner:0 "กองกำลังของข้าควรจะจัดการกับข้ออ้างอันน่าสมเพชสำหรับ [siege_victim.Custom('FortifiedBuilding')] ของ [siege_victim.GetTitledFirstNamePossessive] ได้อย่างรวดเร็ว"
 travel_danger_events.6010.war_owner:0 "หากโชคดี ผู้โจมตีจะได้รับชัยชนะ, และลาก [siege_victim.GetTitledFirstName] ออกมาทั้งเตะทั้งกรีดร้อง"
 travel_danger_events.6010.war_victim:0 "หากเพียง แต่ข้าสามารถทำอะไรบางอย่างเพื่อช่วย [siege_victim.GetTitledFirstName], และกำจัด [siege_owner.GetTitledFirstName] ที่น่ารังเกียจนั้นออกไปได้"
 travel_danger_events.6010.ally_owner:0 "ข้ามั่นใจว่าพันธมิตรของข้าจะได้รับการพิสูจน์ความถูกต้อง, และจัดการ [siege_victim.GetTitledFirstName] ให้เข้าที่เข้าทาง"
 travel_danger_events.6010.ally_victim:0 "ข้าทำได้เพียงเฝ้ามองขณะที่ที่ดินของพันธมิตรของข้า, [siege_victim.GetTitledFirstNamePossessive], ถูกทำลายอย่างช้าๆ แต่แน่นอน"
 travel_danger_events.6010.relation_owner:0 "[ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('siege_owner'))] ของข้า, [siege_owner.GetTitledFirstName], ตั้งใจอย่างชัดเจนที่จะโค่นล้ม [siege_victim.GetTitledFirstName], ไม่ว่าจะต้องแลกด้วยอะไรก็ตาม"
 travel_danger_events.6010.relation_victim:0 "[ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('siege_victim'))] ของข้า, [siege_victim.GetTitledFirstName], กำลังประสบความยากลำบากอย่างเห็นได้ชัดในการปกป้องสถานที่แห่งนี้จากกองกำลังของ [siege_owner.GetTitledFirstNamePossessive]"
 travel_danger_events.6010.sieger_liege:0 "ข้าหลวงของข้า, [siege_owner.GetTitledFirstName], ตั้งใจอย่างชัดเจนที่จะโค่นล้ม [siege_victim.GetTitledFirstName], ไม่ว่าจะต้องแลกด้วยอะไรก็ตาม"
 travel_danger_events.6010.peace:0 "การทะเลาะวิวาทเล็กๆ น้อยๆ ระหว่าง [siege_owner.GetTitledFirstName] และ [siege_victim.GetTitledFirstName] นี้เป็นเรื่องน่ารำคาญอย่างแน่นอน"
 travel_danger_events.6010.raid_end:0 "ท่ามกลางกระท่อมที่ถูกเผาไหม้, ร่างต่างๆ กำลังคุ้ยเขี่ยซากปรักหักพัง, เปรียบเทียบของที่ปล้นมาได้และแลกเปลี่ยนเรื่องราวความกล้าหาญ\n\nกลุ่มผู้บุกรุกที่หน้าตาบูดบึ้งและมอซอกำลังเดินขึ้นมาตามทาง — พวกเขาดูไม่ฉลาดหรือยุติธรรมที่สุด..."
 travel_danger_events.6010.siege_end:0 "ท่ามกลาง [siege_owner.Custom('RegionalArtilleryPlural')], ทหารที่อยู่ห่างไกลกำลังผิงไฟที่กองไฟเล็กๆ\n\n$travel_danger_events.6010.closing$"
 travel_danger_events.6010.closing:0 "กลุ่มทหารที่หน้าตาบูดบึ้งและมอซอกำลังเดินขึ้นมาตามทาง — พวกเขาดูไม่ฉลาดหรือยุติธรรมที่สุด..."
 travel_danger_events.6010.a:0 "แฝงตัวไปกับพวกชาวบ้านกันเถอะ..."
 travel_danger_events.6010.a.success:0 "ท่านผ่านไปโดยไม่มีใครสังเกตเห็น"
 travel_danger_events.6010.a.failure:0 "พวกมันสังเกตเห็นเครื่อง แต่งกายอันหรูหราของท่าน"
 travel_danger_events.6010.capture_toast:0 "นักเดินทางถูกจับ"
 travel_danger_events.6010.b:0 "ข้าคือ [ROOT.Char.GetTitledFirstNameNoTooltip]! พวกมันจะปล่อยให้เราผ่านไป"
 travel_danger_events.6010.b.friend:0 "พาข้าไปหา [siege_commander.GetTitledFirstNameNoTooltip], เราเป็นสหายที่ดีต่อกัน"
 travel_danger_events.6010.b.flavor:0 "#EMP เจ้ารู้#! หรือไม่ว่า #EMP ข้าคือใคร?!#!"
 travel_danger_events.6010.b.success:0 "สถานะของท่าน ทำให้พวกมันสับสน"
 travel_danger_events.6010.b.failure:0 "พวกมันไม่สะทกสะท้าน"
 travel_danger_events.6010.c:0 "การแสดงแสนยานุภาพจะยับยั้งพวกมันได้"
 travel_danger_events.6010.c.success:0 "ท่านถูกปล่อยให้อยู่ตามลำพัง"
 travel_danger_events.6010.c.failure:0 "พวกมันท้าทายท่าน"
 travel_danger_events.6010.c.wound:0 "สมาชิกผู้ติดตามแบบสุ่มได้รับบาดเจ็บ"
 travel_danger_events.6010.d:0 "พวกมันแค่ต้องการสินบน"

 travel_danger_events.6011.t:0 "$travel_danger_prefix$ การรบเบื้องหน้า"
 travel_danger_events.6011.intro:0 "คำเตือนของชาวบ้านที่หวาดกลัวแทบไม่จำเป็น, เป็นที่ชัดเจนว่ามีการสู้รบเกิดขึ้นเบื้องหน้า; เศษซากสงคราม, เหยื่อ, และค่ายพักชั่วคราวมีให้เห็นอยู่ทุกหนแห่ง\n\n"
 travel_danger_events.6011.battle_both:0 "กองทัพที่ถือธงสีของศัตรูข้า, [battle_owner_1.GetTitledFirstName] และ [battle_owner_2.GetTitledFirstName], $travel_danger_events.6011.clash$"
 travel_danger_events.6011.war_battle_1:0 "กองทัพที่ถือธงสีของศัตรูข้า, [battle_owner_1.GetTitledFirstName], และ [battle_owner_2.GetTitledFirstName] $travel_danger_events.6011.clash$"
 travel_danger_events.6011.war_battle_2:0 "กองทัพที่ถือธงสีของศัตรูข้า, [battle_owner_2.GetTitledFirstName], และ [battle_owner_1.GetTitledFirstName] $travel_danger_events.6011.clash$"
 travel_danger_events.6011.ally_battle_1:0 "กองทัพที่ถือธงสีของพันธมิตรข้า, [battle_owner_1.GetTitledFirstName], และ [battle_owner_2.GetTitledFirstName] $travel_danger_events.6011.clash$"
 travel_danger_events.6011.ally_battle_2:0 "กองทัพที่ถือธงสีของพันธมิตรข้า, [battle_owner_2.GetTitledFirstName], และ [battle_owner_1.GetTitledFirstName] $travel_danger_events.6011.clash$"
 travel_danger_events.6011.relation_battle_1:0 "กองทัพที่ถือธงสีของ [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('battle_owner_1'))] ข้า, [battle_owner_1.GetTitledFirstName], และ [battle_owner_2.GetTitledFirstName] $travel_danger_events.6011.clash$"
 travel_danger_events.6011.relation_battle_2:0 "กองทัพที่ถือธงสีของ [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('battle_owner_2'))] ข้า, [battle_owner_1.GetTitledFirstName], และ [battle_owner_2.GetTitledFirstName] $travel_danger_events.6011.clash$"
 travel_danger_events.6011.peace:0 "กองทัพที่ถือธงสี [battle_owner_1.GetPrimaryTitle.GetAdjectiveNoTooltip] และ [battle_owner_2.GetPrimaryTitle.GetAdjectiveNoTooltip] $travel_danger_events.6011.clash$"
 travel_danger_events.6011.clash:0 "ปะทะกันใน [ROOT.Char.GetCurrentLocation.Custom('GetTerrainLandPlural')] ที่อยู่ห่างไกล,"
 travel_danger_events.6011.war:0 "ยุติ [battle_war.Custom('WarCasusBelliShort')] ของพวกเขา"
 travel_danger_events.6011.raid_both:0 "ต่อสู้แย่งชิงเศษซากของที่ปล้นมาได้"
 travel_danger_events.6011.raid:0 "ฝ่ายหนึ่งเพื่อปล้น, และอีกฝ่ายเพื่อกักตุน"
 travel_danger_events.6011.hostile:0 "ยุติข้อพิพาทเล็กน้อยบางอย่าง"
 travel_danger_events.6011.end:0 "\n\nกลุ่มคนที่ดูสิ้นหวัง — อาจเป็นทหารหนีทัพ, หรือทหารรับจ้าง — กำลังแอบหลบหนี, และมุ่งหน้าตรงมาทางเรา"
 travel_danger_events.6011.b:0 "พวกมันจะไม่ยุ่งเกี่ยวกับ [ROOT.Char.GetTitleAsNameNoTooltip]!"
 travel_danger_events.6011.d:0 "เงินตราคือภาษาเดียวของพวกมัน"
 
 travel_danger_events.6012.t:0 "$travel_danger_prefix$ เส้นทางแห่งสงคราม"
 travel_danger_events.6012.intro:0 "ถนนหนทางพลุกพล่านไปด้วยเกวียนและกองกำลังเสริมของกองทัพที่กำลังเคลื่อนผ่าน ในระยะไกล, ธงมาตรฐาน [army_owner.GetPrimaryTitle.GetAdjectiveNoTooltip] สีสันสดใสส่องประกายกลางแดด, เคลื่อนทัพอย่างเชื่องช้าข้าม [ROOT.Char.GetCurrentLocation.Custom('GetTerrainLandPlural')]\n\n"
 travel_danger_events.6012.war:0 "ภาพกองทัพของศัตรูข้า, [army_owner.GetTitledFirstNamePossessive], ทำให้ข้าเต็มไปด้วยความหวาดกลัว,"
 travel_danger_events.6012.ally:0 "ภาพกองทัพของพันธมิตรข้า, [army_owner.GetTitledFirstNamePossessive], เป็นที่น่ายินดีอย่างยิ่ง,"
 travel_danger_events.6012.relation:0 "ภาพกองทัพของ [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('army_owner'))] ข้า, [army_owner.GetTitledFirstNamePossessive], ทำให้ข้าชะงัก,"
 travel_danger_events.6012.peace:0 "ภาพกองทัพนี้ ทำให้คณะเดินทางกังวล,"
 travel_danger_events.6012.clash:0 "ปะทะกันใน [ROOT.Char.GetCurrentLocation.Custom('GetTerrainLandPlural')] ที่อยู่ห่างไกล,"
 travel_danger_events.6012.raid:0 "กำลังเดินทางไปปล้นสะดมหมู่บ้านโชคร้ายบางแห่ง"
 travel_danger_events.6012.other:0 "ขณะที่มันกำลังเดินทางไปยังเป้าหมายที่ห่างไกลบางแห่ง"
 travel_danger_events.6012.end:0 "\n\nกลุ่มทหารที่ดูโทรมกำลังเดินสวนทางมา พวกเขามีลักษณะเหมือนทหารหนีทัพ"

 travel_danger_events.6013.t:0 "$travel_danger_prefix$ พื้นที่พิพาท"
 travel_danger_events.6013.intro:0 "ร่องรอยของสงครามปรากฏให้เห็นอยู่ทุกหนแห่งขณะที่เราเดินทางผ่าน [ROOT.Char.GetCurrentLocation.GetNameNoTooltip], ที่ ซึ่งธงต่างๆ ถูกเปลี่ยนอย่างเร่งรีบเป็นสี [occupy_owner.GetPrimaryTitle.GetAdjectiveNoTooltip]\n\n"
 travel_danger_events.6013.war_owner:0 "ศัตรูของข้า, [occupy_owner.GetTitledFirstName], ได้เปรียบ [occupy_victim.GetTitledFirstName] อย่างชัดเจน,"
 travel_danger_events.6013.war_victim:0 "ศัตรูของข้า, [occupy_victim.GetTitledFirstName], ประสบความพ่ายแพ้ต่อ [occupy_owner.GetTitledFirstName] อย่างชัดเจน,"
 travel_danger_events.6013.ally_owner:0 "พันธมิตรของข้า, [occupy_owner.GetTitledFirstName], ได้เปรียบ [occupy_victim.GetTitledFirstName] อย่างชัดเจน,"
 travel_danger_events.6013.ally_victim:0 "พันธมิตรของข้า, [occupy_victim.GetTitledFirstName], ประสบความพ่ายแพ้ต่อ [occupy_owner.GetTitledFirstName] อย่างชัดเจน,"
 travel_danger_events.6013.relation_owner:0 "[ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('occupy_owner'))] ของข้า, [occupy_owner.GetTitledFirstName], ได้เปรียบ [occupy_victim.GetTitledFirstName] อย่างชัดเจน,"
 travel_danger_events.6013.relation_victim:0 "[ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('occupy_victim'))] ของข้า, [occupy_victim.GetTitledFirstName], ประสบความพ่ายแพ้ต่อ [occupy_owner.GetTitledFirstName] อย่างชัดเจน,"
 travel_danger_events.6013.peace:0 "เราโชคดีที่พลาดการปะทะกันไป, อย่างน้อยก็"
 travel_danger_events.6013.war:0 "แม้ว่า [occupy_war.Custom('WarCasusBelliShort')] จะยังคงดำเนินต่อไปที่อื่น"
 travel_danger_events.6013.hostile:0 "แม้ว่า, ใครจะรู้ผลสุดท้าย"
 travel_danger_events.6013.end:0 "\n\nขณะที่เราเดินทางต่อไปยัง [destination.GetNameNoTooltip], กลุ่มทหารผ่านศึกที่น่าเกรงขามกำลังเข้ามาจากทิศทางตรงกันข้าม"
 
