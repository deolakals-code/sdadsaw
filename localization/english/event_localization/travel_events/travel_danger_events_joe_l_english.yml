 travel_danger_events.6020.t:0 "$travel_danger_prefix$ อันตรายแห่งห้วงลึก"
 travel_danger_events.6020.desc:0 "เมฆทะมึนรวมตัว, และข้าสัมผัสได้ถึงความกลัวเบื้องหลังคำปลอบโยนของกัปตัน ไม่ช้าพายุร้ายก็โหมกระหน่ำเข้าใส่เรา, ฟาดฟันดาดฟ้าด้วยสายฝนอันเกรี้ยวกราดขณะที่ [ROOT.Char.Custom('RegionalShipType')] โคลงเคลงราวกับของเล่น\n\nเสียงแตกดังสนั่น, ดังยิ่งกว่าเสียงฟ้าร้อง, ราวกับโลกทั้งใบถูกยักษ์ร้ายกาจฉีกออกเป็นสองส่วน, แทงทะลุหูของเราขณะที่เรือบิดเบี้ยวอยู่ใต้ฝ่าเท้า\n\n"
 travel_danger_events.6020.hugger:0 "[hugger.GetTitledFirstName] และข้ากอดกันด้วยความหวาดกลัว, จ้องมองตาเบิกกว้างขณะที่คลื่นยักษ์ถาโถมเข้าใส่เรือ!"
 travel_danger_events.6020.prayer:0 "ข้ามองดู [prayer.GetTitledFirstName] คุกเข่าโดยยื่นแขน [prayer.GetHerHis] ออกไปสู่ท้องฟ้าที่เต็มไปด้วยสายฟ้า ร้องไห้ "[prayer.GetFaith.HighGodName]! [prayer.GetFaith.WaterGodName]! โปรดช่วยเราด้วย!" ขณะที่คลื่นลูกใหญ่ซัดท่วมดาดฟ้า!"
 travel_danger_events.6020.diver:0 "[diver.GetTitledFirstName] กุมขมับ [diver.GetHerHis] กรีดร้อง "ความน่าสะพรึงกลัวของ [diver.GetFaith.DevilNamePossessive] มาเพื่อเอาตัวเราไปแล้ว! ไม่มีทางหนี!" ก่อนจะโยน [diver.GetHerselfHimself] ลงไปในคลื่นลูกใหญ่ที่ซัดท่วมเรือ!"
 travel_danger_events.6020.director:0 "ข้ามองด้วยความตกตะลึง, ขณะที่ [director.GetTitledFirstName] ยืนตัวตรง, ตะโกนคำสั่งที่ไม่มีใครได้ยิน, ไม่สนใจคลื่นยักษ์ที่กำลังจะกลืน [director.GetHerHim]!"
 travel_danger_events.6020.fallback:0 "ข้าขดตัวแน่นอยู่ที่มุมหนึ่ง, มองดูด้วยความสยดสยองขณะที่กะลาสีถูกโยนลงไปในห้วงลึกสีดำ, และคลื่นยักษ์ซัดเข้าท่วมเรือ"
 travel_danger_events.6020.a:0 "อ๊ากกกกกกกกกกก!"

 travel_danger_events.6030.t:0 "$travel_danger_prefix$ เสบียงมีตำหนิ"
 travel_danger_events.6030.leader:0 "[travel_leader.GetFirstName] รับผิดชอบเสบียงอาหารของเรา, และเปิดเผยอย่างอับอายว่าเสบียงของเราตอนนี้แทบจะไร้ประโยชน์แล้ว, เนื่องจากเก็บรักษาไม่ดี..."
 travel_danger_events.6030.fallback:0 "ข้าแทบไม่อยากเชื่อ, แต่เสบียงอาหารสำหรับเดินทางของเราตอนนี้แทบจะไร้ประโยชน์แล้ว, เนื่องจากเก็บรักษาไม่ดี..."
 travel_danger_events.6030.desc:1 "\n\nหย่อมเชื้อราปกคลุมขนมปังและผลผลิต, และเราได้ใช้อาหารแห้งที่เหลืออยู่หมดอย่างรวดเร็ว คณะเดินทางเริ่มหิวโหยเมื่อพลบค่ำเริ่มคล้อยลง"
 travel_danger_events.6030.a:0 "มันก็แค่เชื้อรานิดหน่อย!"
 travel_danger_events.6030.b:0 "ธรรมชาติจะจัดหาให้เราเอง!"
 travel_danger_events.6030.b.success:0 "ท่านหาของป่าได้บ้าง"
 travel_danger_events.6030.b.failure:0 "ท่านไม่พบอะไรเลย"
 travel_danger_events.6030.b.critical:0 "ท่านกินพืชผิดชนิด"
 travel_danger_events.6030.b.death:0 "ท่านกินพืชที่เลวร้ายที่สุด"
 travel_danger_events.6030.c:1 "พวกชาวบ้านแถวนี้ต้องมี #EMP อะไรสักอย่าง#! แน่"
 travel_danger_events.6030.d:0 "เราคงต้องเปลี่ยนทุกอย่างใหม่หมด"

 travel_danger_events.6040.t:0 "$travel_danger_prefix$ รู้สึกไม่สบาย"
 travel_danger_events.6040.wet:0 "การเดินทางผ่าน [ROOT.Char.GetCurrentLocation.Custom('GetTerrainTypePlural')] ที่น่ารำคาญนี้เต็มไปด้วยความยากลำบาก, บั่นทอนประสาทและพลังงานขณะที่เราลุยฝ่าความชื้นแฉะที่เหนียวเหนอะหนะ, ปัดแมลงและพยายามไม่ให้เปียก"
 travel_danger_events.6040.war:0 "[ROOT.Char.GetCurrentLocation.Custom('GetTerrainTypePlural')] เต็มไปด้วยร่องรอยของสงคราม, กระจัดกระจายไปด้วยเหยื่อ, และค่ายของตัวแทน สภาพการณ์เลวร้ายมาก, และเราเผชิญหน้ากับทหารบ่อยครั้ง"
 travel_danger_events.6040.desc:0 "\n\nข้าเริ่มรู้สึกอ่อนแอ, ล้าหลังคนอื่นๆ ในคณะเดินทางทั้งที่ปกติข้าเป็นผู้นำ... มีบางอย่างผิดปกติ..."
 travel_danger_events.6040.a:0 "ข้าต้องกลับไป"
 travel_danger_events.6040.b:0 "ขอบคุณ [ROOT.Char.GetFaith.HealthGodName] ที่ $court_physician_court_position$ ของข้าอยู่ที่นี่"
 travel_danger_events.6040.c:0 "เราต้องเดินทางต่อไป..."
 travel_stealing_food_modifier:0 "เสบียงที่ถูกขโมย"
 travel_stealing_food_modifier_desc:0 "ขุนนางที่เดินทางผ่านเคาน์ตีนี้ได้หยิบฉวยผลผลิตของไพร่ของตนไป"
