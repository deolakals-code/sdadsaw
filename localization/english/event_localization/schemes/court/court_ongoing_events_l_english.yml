 court_ongoing.1100.t:1 "$court_event_title$ สิทธิ์ของกวี"
 court_ongoing.1100.desc:0 "ไม่มี [target.GetWomanMan] ใดน่ารักไปกว่า [target.GetTitledFirstName]! เมื่ออยู่ต่อหน้า [target.GetHerHis] คำพูดของข้ามักจะติดขัด — ไม่มีคำชมใดของข้าที่คู่ควรกับ [target.GetHerHim] เลย บางทีบทกวีที่ร่างขึ้นอย่างระมัดระวังอาจจะสามารถถ่ายทอดคุณธรรมของ [target.GetHerHis] ได้ดีกว่า?\n\nข้าจะเขียนเกี่ยวกับ [target.GetHerHis]..."
