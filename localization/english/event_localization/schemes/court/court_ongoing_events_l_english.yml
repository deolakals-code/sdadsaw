 court_ongoing.1050.start.desc:0 "ขณะที่ [target.Custom('LoverPetName')] ของข้าและข้าเดินเล่นในสวนของ [target_location.GetNameNoTooltip] ข้าชี้ไปยังหมู่แมกไม้รอบตัวเรา \"แม้จะงดงามเพียงใด ก็มิมีดอกไม้ใดเทียบเคียงความงามของท่านได้เลย [target.GetLadyLord] ของข้า\"\n\n\"มีอยู่ดอกหนึ่ง\" [target.GetSheHe] กล่าวพร้อมรอยยิ้มเจ้าเล่ห์ \"กล้วยไม้หายากจาก [orchid_origin.GetNameNoTierNoTooltip] ซึ่งแทบจะเป็นไปไม่ได้เลยที่จะเพาะปลูก\""
