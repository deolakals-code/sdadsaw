 #Dealing with competition, by Mathilda Bjarnehed
 court_ongoing.1110.t:0 "$court_event_title$ การแข่งขัน"
 court_ongoing.1110.desc:0 "ระยะหลังนี้ การไปเยือน [target.GetFirstName] ของข้าทุกครั้งล้วนถูกทำลายโดย [competitor.Custom2('MyCharacterIntroductionNoComma', ROOT.Char)]! [competitor.GetSheHe|U] ติดตาม [target.GetHerHim] ไปทุกหนทุกแห่ง ประดุจลูกสุนัขหลงทาง ความพยายามของ [competitor.GetHerHis|U] ที่จะเอาใจ [target.GetLadyLord] นั้นน่าหัวเราะยิ่งนัก แต่ข้าก็เกรงว่าความพากเพียรของ [competitor.GetHerHis] จะได้รับรางวัลตอบแทน"
 court_ongoing.1110.a:0 "การประลองจะพิสูจน์ว่าใครคู่ควร!"
 court_ongoing.1110.a.success:0 "ท่านชนะการประลอง"
 court_ongoing.1110.a.failure:0 "ท่านแพ้การประลอง"
 court_ongoing_1110.competitor_remains.tt:0 "[competitor.GetShortUIName|U] ยังคงเกี้ยวพาราสี [target.GetShortUIName]"
 court_ongoing.1110.b:0 "กรณี "อาหารเป็นพิษ" ที่ "โชคร้าย" จะได้ผล"
 court_ongoing.1110.b.success:0 "[competitor.GetShortUINameNoTooltip] สร้างฉากน่าอับอายในงานเลี้ยงอาหารค่ำ"
 court_ongoing.1110.b.failure:0 "[competitor.GetShortUINameNoTooltip] สังเกตเห็นเมื่อท่านเทยาพิษลงในถ้วยของ [competitor.GetHerHis]"
 court_ongoing.1110.b.murder:0 "ยาพิษมีฤทธิ์ #EMP แรงเกินไป#!"
 court_ongoing.1110.c:0 "ความรักของ [competitor.GetHerHis|U] นั้นไม่จริงแท้ เหรียญทองจะชักจูงให้ [competitor.GetHerHim] หยุดได้"
 court_ongoing.1110.c.success:0 "[competitor.GetShortUINameNoTooltip] รับสินบน"
 court_ongoing.1110.c.failure:0 "[competitor.GetShortUINameNoTooltip] บอก [target.GetShortUINameNoTooltip] เกี่ยวกับข้อเสนอของท่าน"
 court_ongoing.1111.t:0 "เป็นที่นิยม"
 court_ongoing.1111.start.desc:0 "[owner.GetTitledFirstName] ไม่ใช่คนเดียวที่พยายามเอาชนะใจข้า บ่อยครั้งขึ้นเรื่อย ๆ ที่ข้าถูกเข้าหาโดย [competitor.Custom2('MyCharacterIntroductionNoComma', ROOT.Char)] และคำชมของ [competitor.GetHerHis] ก็เปลี่ยนจากสุภาพเป็นสนิทสนม\n\n"
 court_ongoing.1111.duel_success.desc:0 "[owner.GetTitledFirstNameNoTooltip] มิได้พอใจกับการเอาอกเอาใจของ [competitor.GetFirstNamePossessiveNoTooltip] [owner.GetSheHe|U] ท้าทาย [competitor.GetFirstNameNoTooltip] ประลอง! เมื่อข้าไปถึง การประลองก็สิ้นสุดลงแล้ว [owner.GetTitledFirstNameNoTooltip] ยืนหยัดอย่างผู้มีชัยเหนือศัตรูที่บอบช้ำของ [owner.GetHerHis]"
 court_ongoing.1111.duel_failure.desc:0 "[owner.GetTitledFirstNameNoTooltip] มิได้พอใจกับการเอาอกเอาใจของ [competitor.GetFirstNamePossessiveNoTooltip] [owner.GetSheHe|U] ท้าทาย [competitor.GetFirstNameNoTooltip] ประลอง! เมื่อข้าไปถึง การประลองก็สิ้นสุดลงแล้ว [competitor.GetTitledFirstNameNoTooltip] ยืนหยัดอย่างผู้มีชัยเหนือศัตรูที่บอบช้ำของ [competitor.GetHerHis]"
 court_ongoing.1111.poison_success.desc:0 "แต่คืนนี้ ที่งานเลี้ยงอาหารค่ำ [competitor.GetTitledFirstNameNoTooltip] ดื่มมากเกินไปและอาเจียนรดชุดของข้า! โดยไม่เสียเวลาแม้ แต่วินาทีเดียว [owner.GetTitledFirstNameNoTooltip] ก็เข้ามาช่วยข้าจากความเลอะเทอะ"
 court_ongoing.1111.poison_failure.desc:0 "บัดนี้ [competitor.GetTitledFirstNameNoTooltip] บอกข้าว่า [owner.GetTitledFirstNameNoTooltip] ถูกขับเคลื่อนด้วยความหึงหวงจนเสียสติและพยายามวางยาพิษ [competitor.GetHerHim]!"

