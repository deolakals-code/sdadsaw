 court_ongoing.1111.a.duel_failure:0 "[owner.GetTitledFirstNameNoTooltip]ผู้น่าสงสาร! ให้ข้าดูแลรอยถลอกของท่านเถิด"
 court_ongoing.1111.a.poison_failure:0 "[owner.GetTitledFirstNameNoTooltip] จะไม่มีวันใช้กลอุบายอันน่ารังเกียจ เช่นนี้!"
 court_ongoing.1111.b.poison_success:0 "ปล่อยข้าไว้! ข้าจัดการเองได้!"
 court_ongoing.1111.b.poison_failure:0 "ท่านทำได้อย่างไร [owner.GetTitledFirstNameNoTooltip]?!"
 court_ongoing.1111.b.duel_success:0 "การทะเลาะวิวาทแบบเด็กๆ #EMP ไม่#! ทำให้ข้าประทับใจ"
 court_ongoing.1111.b:0 "ความหึงหวงไม่เหมาะกับท่าน [owner.GetTitledFirstNameNoTooltip]"
 court_ongoing.1111.c.duel_failure:0 "โอ้ [competitor.GetTitledFirstNameNoTooltip]! ท่านช่างกล้าหาญเสียนี่กระไร!"
 court_ongoing.1111.c:0 "[competitor.GetTitledFirstNameNoTooltip]ผู้น่าสงสาร! หัวใจข้าเจ็บปวดเพื่อท่าน!"
 court_ongoing.1111.d:0 "ข้าทนพวกท่านทั้งสองไม่ไหวแล้ว!"

 court_ongoing.1112.desc:0 "[competitor.GetTitledFirstName] ไม่มีทางสู้พลังของข้าได้เลย! ความพ่ายแพ้ของ [competitor.GetHerHis|U] ช่างน่าอับอายยิ่งนัก — และ [target.Custom('LoverPetName')] [target.GetFirstName] ของข้าก็เห็นเหตุการณ์ทั้งหมด! [target.GetSheHe|U] มิได้ให้ความสนใจ [competitor.GetHerHim] อีกเลยนับ แต่นั้น"
 court_ongoing.1112.a:0 "ศัตรูอีกคนถูกกำจัด!"

 court_ongoing.1113.desc:0 "ดูเหมือนว่าข้าจะประเมินความสามารถของ [competitor.GetTitledFirstNamePossessive] ต่ำไป — ความพ่ายแพ้ของข้าด้วยน้ำมือของ [competitor.GetHerHis] นั้นเจ็บปวดและน่าอับอายเท่าๆ กัน สิ่งเดียวที่ปลอบใจข้าได้คือ [target.GetTitledFirstName] มิได้อยู่ที่นั่นเพื่อเป็นพยาน"
 court_ongoing.1113.a:0 "ลืมเรื่องทั้งหมดนี้ไปเถอะ..."
 court_ongoing.1113.b:0 "ข้าจะแก้แค้นให้ได้! เชื่อคำพูดของข้า!"

 court_ongoing.1114.desc:0 "ไม่มีสิ่งใดเทียบได้กับความพึงพอใจของแผนการที่ดำเนินไปอย่างสมบูรณ์แบบ!\n\nไม่มีผู้ใดสังเกตเห็นขณะที่ข้าเทยาพิษลงในถ้วยของ [competitor.GetTitledFirstNamePossessive] และภาพที่ตามมานั้นจะไม่มีวันถูกลืมเลือนในเร็ววันนี้! [competitor.GetSheHe|U] อาเจียนรด [target.Custom('GetClothingArticle')] ของ [target.GetFirstNamePossessive] และ [target.GetSheHe] ก็รู้สึกขอบคุณอย่างใหญ่หลวงเมื่อข้าโฉบเข้าไปช่วย [target.GetHerHim] จากความโกลาหลนั้น"
 court_ongoing.1114.a:0 "[target.GetSheHe|U] จะไม่มองไปทาง [competitor.GetHerHis] อีกเลย!"


 court_ongoing.1115.desc:0 "ปรากฏว่า [competitor.GetTitledFirstName] ช่างสังเกตมากกว่าที่ข้าให้เครดิต [competitor.GetHerHim] ไว้มาก [competitor.GetSheHe|U] จับข้าได้คาหนังคาเขาเมื่อข้าพยายามวางยาพิษในถ้วยของ [competitor.GetHerHis] และเขาก็ฟ้องข้าในทันที!"
 court_ongoing.1115.a:0 "มันไม่ใช่สิ่งที่เห็น..."

 court_ongoing.1116.desc:0 "ส่วนแรกของแผนการของข้าดำเนินไปอย่างสมบูรณ์แบบ ไม่มีผู้ใดเห็นข้าเมื่อข้าเทยาพิษลงในถ้วยของ [competitor.GetTitledFirstNamePossessive] อย่างไรก็ตาม ดูเหมือนว่าข้าจะประเมินฤทธิ์ของมันต่ำไป\n\nเพียงไม่กี่วินาทีหลังจากที่ [competitor.GetFirstNameNoTooltip] ยกเครื่องดื่มขึ้นจรดริมฝีปาก [competitor.GetSheHe] ก็เริ่มสำลัก! ก่อนที่ผู้ใดจะช่วยเหลือได้ [competitor.GetSheHe] ก็ล้มลงในสตูว์ของ [competitor.GetHerHis] สิ้นใจตายสนิท"
 court_ongoing.1116.a:0 "อย่างน้อย [competitor.GetSheHe] ก็จะไม่มาเกี้ยว [target.GetFirstNameNoTooltip] อีกต่อไป"

 # Boring party guest
 court_ongoing.1120.t:0 "$court_event_title$ $court_ongoing.1121.t$"
 court_ongoing.1120.desc:0 "ข้ากำลังเข้าร่วมงานเต้นรำใน [target_location.GetNameNoTooltip] เพื่อใช้เวลากับ [target.GetTitledFirstName] เพียงแค่คิดว่าจะได้สัมผัสมือ หัวใจข้าก็เต้นระรัว! แต่เมื่อข้าไปถึง ข้ากลับพบ[target.GetHerHim]ติดพันสนทนากับ [unpleasant_guest.Custom2('MyCharacterIntroductionNoComma', ROOT.Char)]\n\n[unpleasant_guest.GetWomanMan][unpleasant_guest.Custom2('InsultAdjective', ROOT.Char)]ผู้นั้นพูดพร่ำไม่หยุด โดยไม่รับรู้ถึงความอึดอัดของ [target.GetFirstNamePossessiveNoTooltip] เลยแม้ แต่น้อย"
 court_ongoing.1120.a:0 "#EMP "สิ่งรบกวน"#! เล็กน้อยดูเหมือนจะเหมาะสม"
 court_ongoing.1120.a.failure:0 "บทสนทนาน่าเบื่ออย่างยิ่ง"
 court_ongoing.1120.b:0 "เสน่ห์ของข้าปรับปรุงบทสนทนาใดๆ ได้!"
 court_ongoing.1120.c:0 "ข้าจะรับหน้าที่แทน [target.GetHerHis] ให้ข้าทนทุกข์ดีกว่า [target.GetHerHim]"
 court_ongoing.1120.d:0 ""พอแล้ว! ท่านกำลัง ทำให้ใต้เท้า[target.GetLadyLord]เบื่อตาย!""
 court_ongoing.1120.e:0 "ข้าจะไม่ไปไหนใกล้ๆ [unpleasant_guest.GetWomanMan]คนนั้น!"


 court_ongoing.1121.t:0 "การทักทายอันไม่น่าพอใจ"
 court_ongoing.1121.start.desc:0 "เมื่อข้าส่งคำเชิญไปงานเต้นรำ ข้าตั้งตารอคอยค่ำคืนแห่งมิตรภาพที่ดีและความสนุกสนานอันไร้สาระ แต่ข้ากลับพบว่าตัวเองติดอยู่กับการสนทนาอันน่าสะพรึงกลัวกับ [unpleasant_guest.Custom2('MyCharacterIntroductionNoComma', ROOT.Char)]...\n\n"
 court_ongoing.1121.diplomacy.desc:0 "\"สวัสดีตอนเย็น\" เสียงที่คุ้นเคยทักทาย — [owner.GetTitledFirstName] เข้าร่วมการสนทนา [owner.GetSheHe|U] เป็นผู้ฟังที่ตั้งใจ และในไม่ช้าความสนใจของ [unpleasant_guest.GetFirstNamePossessiveNoTooltip] ก็มุ่งไปที่ [owner.GetHerHim] อย่างเต็มที่ ข้าจึงเป็นอิสระที่จะหลบหนีไปได้"
 court_ongoing.1121.intrigue.desc:1 ""ขออภัยอย่างสุดซึ้ง แต่มีสถานการณ์เร่งด่วนที่ต้องการความสนใจจากท่าน [unpleasant_guest.Custom2('RelationToMeAddress', owner)]" เสียงที่คุ้นเคยนั้นไม่ใช่ใครอื่นนอกจาก [owner.GetTitledFirstName] [owner.GetSheHe|U] ขยิบตาให้ข้าขณะที่ [owner.GetSheHe] ทำท่าให้ [unpleasant_guest.GetFirstNameNoTooltip] ตามไป"
 court_ongoing.1121.insult.desc:1 ""ข้าคิดว่า [ROOT.Char.GetLadyLord] พอแล้ว" [owner.GetWomanMan] คนหนึ่งขัดจังหวะ — คือ [owner.GetTitledFirstName]! "ท่านบอกไม่ได้หรือว่าท่านกำลัง ทำให้ [ROOT.Char.GetHerHim] เบื่อ [unpleasant_guest.Custom2('RelationToMeAddress', owner)]?""
 court_ongoing.1121.a:0 "บทเรียนทางการทูตที่มีประโยชน์ แม้จะไม่น่าพอใจ!"
 court_ongoing.1121.a.critical_success:0 "ท่านเรียนรู้กลอุบายทางการทูตใหม่"
 court_ongoing.1121.a.success:0 "ความเข้าใจทางการทูตของท่านเพิ่มขึ้น"
 court_ongoing.1121.b:0 "บทเรียนในการใช้เล่ห์เหลี่ยมที่มีประโยชน์ แม้จะไม่น่าพอใจ!"
 court_ongoing.1121.b.critical_success:0 "ท่านเรียนรู้กลอุบายใหม่"
 court_ongoing.1121.b.success:0 "ความเข้าใจในกลอุบายของท่านเพิ่มขึ้น"
 court_ongoing.1121.c:0 ""แน่นอน ข้าทนพอแล้ว""
 court_ongoing.1121.c.success:0 "[unpleasant_guest.GetShortUIName|U] ชื่นชมความซื่อสัตย์ของท่าน"
 court_ongoing.1121.c.failure:0 "[unpleasant_guest.GetShortUIName|U] รู้สึกถูกดูหมิ่น"
 court_ongoing.1121.d:0 "[ROOT.Char.GetTitleAsNameNoTooltip]มีเวลาให้ทุกคน [owner.GetFirstNameNoTooltip] ควรรู้ไว้"
 court_ongoing.1121.e:0 "ข้าจะไม่ทนอยู่นานเกินกว่าที่จำเป็น!"
 

 #EXTREME REQUEST — CHOOSE, by Linnéa Thimrén
 court_ongoing.1201.t:0 "คำขอ"
 court_ongoing.1201.desc:0 ""[target.GetLadyLord|U] [target.GetFirstName] ให้ข้าพิสูจน์ความทุ่มเทของข้าที่มีต่อท่านในทุกวิถีทางที่ท่านเห็นสมควร!" [owner.GetTitledFirstName] วิงวอนให้ข้าออกแบบการทดสอบความทุ่มเทของ [owner.GetHerHis] — การกระทำที่ข้าพอใจ ข้าจะให้ [owner.GetHerHim] งดเว้นจากการ... เป็นเวลาหลายวัน"
 court_ongoing.1201.a:0 "การนอนหลับ — จงปกป้องข้าจากฝันร้าย!"
 court_ongoing.1201.a_success:0 "การเฝ้าระวังของ [owner.GetHerHis|U] ทำให้ข้าพักผ่อนได้อย่างสนิทใจ"
 court_ongoing.1201.a_failure:0 "[owner.GetSheHe|U] ล้มเหลวในหน้าที่ของ [owner.GetHerHis]"
 court_ongoing.1201.b:0 "อาหาร — ความรักที่ท่านมีต่อข้าควรเป็นเครื่องหล่อเลี้ยงที่เพียงพอ"
 court_ongoing.1201.b_success:0 "[owner.GetSheHe|U] พิสูจน์ความทุ่มเทของ [owner.GetHerHis]"
 court_ongoing.1201.c:0 "ข้าไม่สนใจที่จะทดสอบ [owner.GetHerHim]"

 #EXTREME REQUEST — SLEEP, by Linnéa Thimrén
 court_ongoing.1211.t:1 "$court_event_title$ คำขอ"
 court_ongoing.1211.desc_opening:0 ""[target.GetLadyLord|U] [target.GetFirstName] ให้ข้าพิสูจน์ความทุ่มเทของข้าที่มีต่อท่านในทุกวิถีทางที่ท่านเห็นสมควร!"\n\n[target.GetFirstNameNoTooltip] ใคร่ครวญคำขออยู่ครู่หนึ่งก่อนที่ใบหน้าของ [target.GetHerHis] จะสว่างขึ้น"
 court_ongoing.1211.desc:0 ""ข้าถูกฝันร้ายรบกวนเมื่อเร็วๆ นี้ หากท่านภักดีต่อข้าอย่างแท้จริง ท่านจะยืนยามอยู่นอก [target.Custom('GetChambersOrTent')] ของข้าและ ทำให้แน่ใจว่าไม่มีความชั่วร้ายใดมาถึงข้า""
 court_ongoing.1211.a:0 "ท่านจะนอนหลับอย่างไม่ถูกรบกวน!"
 court_ongoing.1211.a.success:0 "ท่านสามารถตื่นอยู่ได้"
 court_ongoing.1211.a.failure:0 "ความง่วงงุนครอบงำท่าน"
 court_ongoing.1211.b:0 "ปล่อยให้ข้าไม่ถูกรบกวนทั้งคืน แล้วข้าจะยืนยาม"
 court_ongoing.1211.b.tt:0 "ไม้กวาดที่คลุมด้วยเสื้อคลุมของข้าก็สามารถต่อสู้กับฝันร้ายได้ เช่นกัน"
 court_ongoing.1211.b.success:0 "ไม่มีใครเปิดโปงกลอุบาย"
 court_ongoing.1211.b.failure:0 "[target.GetSheHe|U] สังเกตเห็นการหลอกลวง"
 court_ongoing.1211.c:0 "ข้าจะไม่ทำ"

 court_ongoing.1212.desc:0 "เมื่อดวงอาทิตย์ขึ้นหลังจากคืนแห่งการนอนหลับที่ดีอีกคืน ข้าทำอะไรไม่ได้นอกจากขอบคุณ [owner.GetTitledFirstName] ที่ยืนยามอยู่นอก [ROOT.Char.Custom('GetChambersOrTent')] ของข้า ทำให้การพักผ่อนของข้าสงบและไม่ถูกรบกวน"
 court_ongoing.1212.a:0 "ผู้พิทักษ์ผู้กล้าหาญของข้า!"

 court_ongoing.1213.desc:0 "ขณะที่ข้ากำลังเคลิ้มหลับ ในกลางดึกที่มืดมิดที่สุด ทันใดนั้นข้าก็ได้ยินเสียง #EMP ตุ้บ#!! ดังลั่น เมื่อแอบมองออกไปนอก [ROOT.Char.Custom('GetChambersOrTent')] ข้าก็เห็นไม่ใช่ใครอื่นนอกจาก [owner.GetTitledFirstName] หลับสนิทอยู่บนพื้น"
 court_ongoing.1213.a:0 "ผู้พิทักษ์ผู้กล้าหาญของข้า..."

 court_ongoing.1214.desc:0 "\n\nข้าถึงกับแอบมองออกไปนอกประตูสองสามครั้งเพื่อพบว่า [owner.GetHerHim] ยืนตัวตรงแข็งทื่อ ไม่เคยแม้ แต่จะโอนเอน"

 court_ongoing.1215.desc:0 "ขณะที่ข้ากำลังเคลิ้มหลับ ในกลางดึกที่มืดมิดที่สุด ทันใดนั้นข้าก็ได้ยินเสียง #EMP ตุ้บ#!! ดังลั่น เมื่อแอบมองออกไปนอก [ROOT.Char.Custom('GetChambersOrTent')] ข้าก็เห็นเสื้อคลุมเปล่าของ [owner.GetTitledFirstName] หมวกเกราะ และไม้กวาดล้มลงกับพื้น"
 court_ongoing.1215.a:0 "[owner.GetSheHe|U] ตั้งใจจะหลอกข้า!"

 #EXTREME REQUEST — FOOD, by Linnéa Thimrén
 court_ongoing.1221.desc:0 ""ท่านควรจะสามารถหล่อเลี้ยงตัวเองได้ด้วยความรักที่ท่านมีต่อข้าเพียงอย่างเดียวเป็นเวลาหลายวัน""
 court_ongoing.1221.a:0 "ความภักดีของข้าจะนำพาข้าผ่านไปได้!"
 court_ongoing.1221.a.success:0 "ท่านสามารถหลีกเลี่ยงการยังชีพได้"
 court_ongoing.1221.a.failure:0 "ท่านยอมจำนนต่อความต้องการของร่างกาย"
 court_ongoing.1221.b:0 "ไม่มีเศษอาหารใดจะผ่านริมฝีปากเหล่านี้ไปได้!"
 court_ongoing.1221.b.tt:0 "แต่ข้าจะไม่ปฏิเสธก้อนใหญ่ หรือชิ้น..."

 court_ongoing.1222.desc:0 "[owner.GetTitledFirstName] ดูซูบผอมลงเรื่อย ๆ ใน แต่ละวันที่ผ่านไป แต่ถึงแม้ร่างกายของ [owner.GetHerHis] จะเหี่ยวเฉาลง เจตจำนงและความทุ่มเทของ [owner.GetHerHis] ก็ยังคงแข็งแกร่ง\n\nข้าพบ [owner.GetHerHim] เพื่อประกาศว่าการท้าทายสำเร็จแล้ว และสิ่งแรกที่ออกจากริมฝีปากของ [owner.GetHerHis] คือคำสัญญาแห่งความซื่อสัตย์อีกครั้ง"
 court_ongoing.1222.a:0 "ใต้เท้า[owner.GetLadyLord]ผู้ภักดีของข้า!"

 court_ongoing.1223.desc:0 "[owner.GetTitledFirstName] ดูผอมโซลงเรื่อยๆ ใน แต่ละวันที่ผ่านไป"
 court_ongoing.1223.desc_ending:0 "แต่ ขณะที่ข้ามองหา [owner.GetHerHim] เพื่อประกาศว่าการท้าทายสำเร็จแล้ว ข้าพบ [owner.GetHerHim] ในห้องเก็บเสบียง ปกคลุมไปด้วยเศษขนมปังและกำลังเขมือบกงชีสทั้งก้อน"
 court_ongoing.1223.a:0 "ข้าเห็นท่านพบแหล่งยังชีพอื่นแล้ว..."

 court_ongoing.1225.desc:1 "[owner.GetTitledFirstName] ดูเหมือนจะรับมือกับการถือศีลอดได้ค่อนข้างดี และเมื่อข้าตามหา [owner.GetHerHim] เพื่อแสดงความประหลาดใจและชื่นชม ข้าก็พบว่าทำได้อย่างไร\n\nเสื้อคลุมทั้งตัวของ [owner.GetHerHis|U] อัดแน่นไปด้วยอาหาร! ดูจากสีหน้าละอายของ [owner.GetHerHis] แล้ว ข้าไม่ควรจะเห็นสิ่งนั้น..."
