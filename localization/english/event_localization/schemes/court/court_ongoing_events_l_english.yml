l_english: 
 court_event_title:0 "การเกี้ยวพาราสี:"

 #Modifiers
 court_competitor_modifier:0 "คู่แข่งชิงรัก"

 #ONGOING MANAGEMENT: Player target opted out
 court_ongoing.0001.t:0 "$court_event_title$ การปฏิเสธ"
 court_ongoing.0001.desc:0 "[target.Custom2('MyCharacterIntroduction', ROOT.Char)|U] ได้ปฏิเสธการเกี้ยวพาราสีของข้า! [target.GetSheHe|U] แสดงให้เห็นอย่างชัดเจนว่า [target.GetSheHe] ไม่สนใจ และอาจจะไม่มีวันสนใจเลย"
 court_ongoing.0001.a:0 "โอ้ อนิจจา!"

 #START EVENT: Owner picks method
 court_ongoing.0501.t:1 "$court_event_title$ การประกาศความรัก"
 court_ongoing.0501.desc:0 "ถึงเวลาแล้วที่จะเปิดเผยความรู้สึกของข้าที่มีต่อ [target.GetTitledFirstName] ข้าต้องการให้ [target.GetHerHim] จดจำวันนี้ไปตลอดชีวิตของ [target.GetHerHis]"
 court_ongoing.0501.a:0 "ขับร้องเพลงรัก"
 court_ongoing.0501.b:0 "แอบวางจดหมายไว้ใน [target.Custom('GetChambersOrTent')] ของ [target.GetHerHis]"
 court_ongoing.0501.c:0 "เขียนบทกวีรัก"
 court_ongoing.0501.d:0 "สร้างความประทับใจให้ [target.GetHerHim] ด้วยการชนะการประลอง"
 court_ongoing.0501.x:0 "ทำตามสัญชาตญาณในขณะนั้น"
 court_ongoing.0501.tt:0 "ท่านประกาศความภักดีอันไม่เสื่อมคลายต่อ [target.GetShortUIName]"

 #START EVENT: For Target 
 court_ongoing.0502.t:0 "$court_event_title$ การประกาศความรัก"
 court_ongoing.court_start_song.start.0502.desc:1 "ข้ากำลังเดินเล่นในสวนกับเหล่า [ROOT.Char.Custom('LadiesLords')] ในราชสำนัก เมื่อข้าสังเกตเห็น [owner.Custom2('MyCharacterIntroduction', ROOT.Char)] กำลังเข้ามาใกล้ ข้าหลีกทางให้ [owner.GetHerHim] ผ่านไป แต่ด้วยความประหลาดใจอย่างยิ่ง [owner.GetSheHe] กลับขวางทางข้าและคุกเข่าลงต่อหน้าข้า!\n\nก่อนที่ข้าจะมีเวลาประมวลผลเหตุการณ์ที่พลิกผันนี้อย่างเหมาะสม [owner.GetTitledFirstNameNoTooltip] ก็เริ่มขับขานบทเพลง\n\n"
 court_ongoing.court_start_song.bad.0502.desc:0 "ข้ารู้สึกท้อใจอย่างยิ่งที่ [owner.GetWomanMan] เบื้องหน้าข้าไม่สามารถร้องเพลงให้รอดชีวิต [owner.GetHerHis] ได้เลย ต้องใช้เวลาสักพักกว่าข้าจะจำเพลงได้ — มันเป็นเพลงรักบัลลาดที่มีชื่อเสียงของ [target.GetCulture.GetNameNoTooltip] [owner.GetSheHe|U] ได้เปลี่ยนเนื้อเพลงให้มีชื่อข้าและกล่าวถึงรูปลักษณ์ภายนอกของข้า ทำให้จังหวะเพลงยิ่งแย่ลงไปอีก"
 court_ongoing.court_start_song.good.0502.desc:0 "ข้าจำทำนองได้อย่างรวดเร็ว — มันคือเพลงรัก[target.GetCulture.GetNameNoTooltip]อันโด่งดัง ข้าเคยฟังเพลงนี้มานับครั้งไม่ถ้วน แต่ไม่เคยมีครั้งใดที่ขับร้องด้วยทักษะและความหลงใหล เช่นนี้!\n\nอารมณ์อันเข้มข้นของบทเพลงสะท้อนอยู่ในสายตาของ[owner.GetFirstNamePossessiveNoTooltip] ซึ่งจับจ้องมาที่ข้า [owner.GetSheHe|U] ไม่ละสายตาไปแม้เพียงชั่วขณะหัวใจเต้น"
 court_ongoing.court_start_sneaky_love_letter.start.0502.desc:0 "ขณะที่ข้าปัดผ้าปูที่นอนออกเพื่อจะนอนลง ข้าพบม้วนกระดาษเล็กๆ วางอยู่บนหมอนข้างของข้า มีใครบางคนเข้ามาใน [ROOT.Char.Custom('GetChambersOrTent')] ของข้าโดยไม่มีใครสังเกตเห็นรึ? ความเย็นวาบแล่นไปตามสันหลังขณะที่ข้าคลี่ม้วนกระดาษหนาออกอย่างระมัดระวัง\n\n"ยอดรัก[ROOT.Char.Custom('RomanticComplimentAdjective')]ของข้า"
 court_ongoing.court_start_sneaky_love_letter.compliment.0502.desc:0 "[ROOT.Char.Custom('RomanticComplimentNoun')]!"
 court_ongoing.court_start_sneaky_love_letter.relative.0502.desc:0 "[owner.Custom2('RelationToMeShort', ROOT.Char)]!"
 court_ongoing.court_start_sneaky_love_letter.end.0502.desc:0 "[ROOT.Char.GetLadyLord|U]ในดวงใจของข้า! ข้าไม่อาจเก็บงำความรู้สึกของข้าเป็นความลับได้อีกต่อไป นับจากวันนี้ไป ข้าจะทำทุกอย่างในอำนาจของข้าเพื่อพิสูจน์ความรักอันภักดีของข้า"\n\n"เราจะได้พบกันในไม่ช้า จนกว่าจะถึงตอนนั้น จงฝันถึงข้าเถิด ยอดรักของข้า เป็นของท่านตลอดไป [owner.GetTitledFirstName]""
 court_ongoing.court_start_poem_love_letter.0502.desc:0 "[owner.Custom2('love_letter', SCOPE.sC('target'))]\n\nถ้อยคำเหล่านี้เป็นเพียงภาพสะท้อนอันเลือนรางของความรู้สึกที่ข้ามีต่อท่าน ข้าจะทำทุกอย่างเพื่อพิสูจน์ความรักอันภักดีของข้า"
 court_ongoing.court_start_sparring.start.0502.desc:1 "เสียงอาวุธกระทบกันและเสียงเชียร์อันตื่นเต้นดึงดูดข้าไปยังลานกลางแจ้ง เกิดอะไรขึ้นกัน?\n\nข้าพบนักรบสวมเกราะสองคนกำลังประลองกันอย่าง"
 court_ongoing.court_start_sparring.bad.0502.desc:0 "เงอะงะ ข้าพยายามไม่แสดงสีหน้าเหยเกขณะที่คนหนึ่งสะดุดหลังจากการเหวี่ยงดาบที่แรงเกินความจำเป็น"
 court_ongoing.court_start_sparring.good.0502.desc:0 "ดุเดือด ทั้งสองคนไม่ต้องสงสัยเลยว่าเคยผ่านการทดสอบในสนามรบมาแล้ว"
 court_ongoing.court_start_sparring.great.0502.desc:0 "น่าทึ่ง ไม่เคยมีครั้งใดที่ข้าเคยเห็นทักษะ เช่นนี้กับ [owner.Custom('signature_weapon')] มาก่อน! ข้าไม่อาจละสายตาได้!"
 court_ongoing.court_start_sparring.end.0502.desc:0 "\n\nด้วยการโจมตีครั้งสุดท้ายอย่างบ้าบิ่น นักสู้คนหนึ่งปลดอาวุธอีกคนหนึ่ง ข้าประหลาดใจที่ [owner.GetSheHe] คุกเข่าลงต่อหน้าข้าและถอดหมวกเกราะของ [owner.GetHerHis] ออก มันคือ [owner.Custom2('MyCharacterIntroductionNoComma', ROOT.Char)]!\n\n"ข้าอุทิศชัยชนะนี้ให้ท่าน [ROOT.Char.GetTitledFirstNameNoTooltip]" เขากล่าวอย่างเคร่งขรึม "การนำเกียรติยศมาสู่ท่านคือความปรารถนาเดียวของข้า!"""
 court_ongoing.0502.a:0 "ท่านช่างยกยอข้าเหลือเกิน ใต้เท้า[owner.GetLadyLord]ของข้า!"
 court_ongoing.0502.b.incest:0 "อะไรนะ? ท่านคือ #EMP [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('owner'))]#!! ของข้านะ!!"
 court_ongoing.0502.b:0 "จงละทิ้งความพยายามอันโง่เขลานี้เสีย #EMP เดี๋ยวนี้#!."
 court_ongoing.0502.a.tt:0 "[owner.GetShortUIName|U] จะพยายามเอาชนะใจข้า"


 #START EVENT: For Owner (target's reaction)
 court_ongoing.court_start_song.intro.0503.desc:1 "ข้าได้พบบทเพลงรักบัลลาด [target.GetCulture.GetNameNoTooltip] สุดคลาสสิกที่เหมาะกับ [target.GetFirstName] อย่างสมบูรณ์แบบ! ข้าฝึกซ้อมมันซ้ำแล้วซ้ำเล่า — ทุกอย่างต้องสมบูรณ์แบบ!\n\nข้าพบ [target.Custom('LoverPetName')] ของข้ากำลังเดินอยู่ในสวน [target_location.GetNameNoTooltip] รายล้อมไปด้วยเพื่อน ๆ ของ [target.GetHerHis] ด้วยหัวใจที่เต้นรัวเหมือนค้อนทุบ ข้าคุกเข่าลงต่อหน้า [target.GetHerHim] และขับขานบทเพลง"
 court_ongoing.court_start_song.success.0503.desc:1 "\n\nดวงแก้มของ [target.GetFirstNamePossessiveNoTooltip] เปลี่ยนเป็นสีแดงดุจผลทับทิม แต่[target.GetSheHe]ก็มิได้ขัดจังหวะข้า เหล่าสหายของ[target.GetHerHis|U]ล้วนดูยินดี หรืออิจฉา — ช่างเป็นสัญญาณที่ดีโดยแท้!\n\n"ท่านช่างมีเสียงที่ไพเราะยิ่งนัก [ROOT.Char.Custom('FormOfAddressForLiege')]" [target.GetFirstNameNoTooltip] เอ่ยวาจาก่อนที่[target.GetSheHe]จะรีบจากไป เหล่าสหายของ[target.GetHerHis|U]ก็รีบติดตามไป ข้ายืนขึ้นด้วยขาที่สั่นเทา มองดูพวกเขาหายลับไประหว่างแนวพุ่มไม้ หัวใจของข้าเต้นแรงยิ่งกว่าครั้งใด"
 court_ongoing.court_start_sneaky_love_letter.intro.0503.desc:0 "คำประกาศความรักของข้ามีไว้สำหรับสายตาของ [target.GetTitledFirstNamePossessive] เท่านั้น! ไม่มีผู้ใดอื่นสำคัญ! ข้าเทหัวใจของข้าออกมา หน้าแล้วหน้าเล่า ความรู้สึกของข้าเพิ่มพูนขึ้นเมื่อข้าได้ถ่ายทอดมันออกมาเป็นคำพูด หมึกแทบจะยังไม่แห้งสนิทเมื่อข้ามุ่งหน้าไปยัง [target.Custom('GetChambersOrTent')] ของ [target.GetFirstNamePossessive]\n\nข้าค่อยๆ วางม้วนสาส์นลงบนหมอนอิงของ [target.GetHerHis] คืนนี้ [target.GetSheHe] จะนอนอยู่ที่นี่ ฝันถึงข้าหรือไม่?"
 court_ongoing.court_start_sneaky_love_letter.success.0503.desc:1 "\n\nการรอคอยช่างทรมานเหลือเกิน ความคิดเรื่องการถูกปฏิเสธ ทำให้ข้าคลื่นไส้! เมื่อคำตอบของ [target.GetHerHis] มาถึง ข้าฉีกผนึกด้วยมือที่สั่นเทา\n\n"แม้ข้าไม่อาจส่งเสริมท่านได้ [owner.Custom2('RelationToMeAddress', ROOT.Char)] ข้าซาบซึ้งอย่างยิ่งสำหรับถ้อยคำอันอ่อนโยนของท่าน ด้วยความนับถือ [target.GetFirstNameNoTooltip]""
 court_ongoing.court_start_poem_love_letter.intro.0503.desc:0 "แสงเทียนริบหรี่ลงเมื่อข้าเขียนบทกวีเสร็จในที่สุด ก่อนที่ข้าจะส่งมันไป ข้าอ่านมันเป็นครั้งสุดท้าย\n\n"[owner.Custom2('love_letter', SCOPE.sC('target'))]""
 court_ongoing.court_start_sparring.same_locaton_intro.0503.desc:0 "ข้าเกณฑ์ทหารอาวุโสที่สุดคนหนึ่งของข้าและฝึกซ้อมกับ [sparring_soldier.GetHerHim] เป็นเวลาสามวันติดต่อกัน เมื่อ [sparring_soldier.GetSheHe] เห็นว่าข้าพร้อมแล้ว เราก็มุ่งหน้าไปยังลานหลักด้วยกัน\n\nเมื่อเราเริ่มประลอง ฝูงชนก็มารวมตัวกัน และเสียงเชียร์ของพวกเขาก็ในไม่ช้าก็ดึงดูดใครอื่นไม่ได้นอกจาก [target.GetTitledFirstName] ผู้ [target.Custom('RomanticComplimentAdjective')]\n\nทหารผู้นั้นต่อสู้อย่างกล้าหาญ แต่ข้าปลดอาวุธ [sparring_soldier.GetHerHim] ด้วยการแทงครั้งสุดท้ายอันไร้ที่ติ ข้าคุกเข่าลงต่อหน้า [target.GetFirstNameNoTooltip] และประกาศเจตนาอันสูงส่งของข้า "ข้าอุทิศชัยชนะนี้ให้ท่าน [target.GetTitledFirstNameNoTooltip] การนำเกียรติยศมาสู่ท่านคือความปรารถนาเดียวของข้า!"\n\n"
 court_ongoing.court_start_sparring.other_locaton_intro.0503.desc:2 "ข้าเกณฑ์ทหารอาวุโสที่สุดคนหนึ่งของข้าและออกเดินทางไปยัง [target_location.GetNameNoTooltip] เราฝึกซ้อมตามกิจวัตรของเราหลังจากการขี่ม้าใน แต่ละวัน\n\nเมื่อเรามาถึง เราก็เริ่มประลองกันในลานหลัก ฝูงชนมารวมตัวกัน และเสียงเชียร์ของพวกเขาก็ในไม่ช้าก็ดึงดูดใครอื่นไม่ได้นอกจาก [target.GetTitledFirstName] ผู้ [target.Custom('RomanticComplimentAdjective')]\n\nทหารผู้นั้นต่อสู้อย่างกล้าหาญ แต่ข้าปลดอาวุธ [sparring_soldier.GetHerHim] ด้วยการแทงครั้งสุดท้ายอันไร้ที่ติ ข้าคุกเข่าลงต่อหน้า [target.GetFirstNameNoTooltip] และประกาศเจตนาอันสูงส่งของข้า "ข้าอุทิศชัยชนะนี้ให้ท่าน [target.Custom2('RelationToMeAddress', ROOT.Char)] การนำเกียรติยศมาสู่ท่านคือความปรารถนาเดียวของข้า!"\n\n"
 court_ongoing.court_start_sparring.success.0503.desc:0 "[ROOT.Char.Custom('LoverPetName')] ของข้าพูดไม่ออก แต่เห็นได้ชัดว่ารู้สึกปลื้มใจ เหตุใดเล่า [target.GetSheHe] จึงยิ้ม เช่นนั้น?"
 court_ongoing.public_sodomy_rejection.0503.desc:1 "ปฏิกิริยาของ[target.GetFirstNamePossessiveNoTooltip]ไม่ใช่สิ่งที่ข้าหวังไว้ "ท่านเสียสติไปแล้วหรือ [ROOT.Char.Custom2('RelationToMeAddress', target)]?! ท่านกำลังเสนออะไรกันแน่?"
 court_ongoing.public_incest_rejection.0503.desc:0 "ปฏิกิริยาของ[target.GetFirstNamePossessiveNoTooltip]ไม่ใช่สิ่งที่ข้าหวังไว้ "ท่านกำลังเสนออะไร? ข้าคือ #EMP [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('target'))]#!! ของท่านนะ""
 court_ongoing.public_regular_rejection.0503.desc:1 "ปฏิกิริยาของ[target.GetFirstNamePossessiveNoTooltip]ไม่ใช่สิ่งที่ข้าหวังไว้ "อย่า ทำให้ตัวเองขายหน้าไปมากกว่านี้เลย [ROOT.Char.Custom2('RelationToMeAddress', target)] ข้ายอมกิน[target.Custom('GetClothingArticle')]ของตัวเองเสียดีกว่าที่จะใช้เวลาอีกนาทีเดียวในที่ที่มีท่านอยู่!""
 court_ongoing.written_sodomy_rejection.0503.desc:0 "\n\nคำตอบของ[target.GetFirstNamePossessiveNoTooltip]รวดเร็วและชัดเจน "ท่านเสียสติไปแล้วหรือ? ท่านรู้หรือไม่ว่าคำพูดของท่านจะเป็นอันตรายเพียงใด หากตกไปอยู่ในมือคนผิด? ข้าขอร้องท่าน — จงละทิ้งความพยายามอันโง่เขลานี้เสียทันที!""
 court_ongoing.written_incest_rejection.0503.desc:0 "\n\nคำตอบของ[target.GetFirstNamePossessiveNoTooltip]รวดเร็วและชัดเจน "ท่านแปลกมาตลอด แต่เรื่องนี้รึ? การประกาศความหลงใหลต่อ #EMP [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('target'))]#!? ของท่านเอง!? แค่คิดว่าเราอยู่ด้วยกันก็ ทำให้ข้าคลื่นไส้แล้ว!""
 court_ongoing.written_regular_rejection.0503.desc:0 "\n\nคำตอบของ[target.GetFirstNamePossessiveNoTooltip]รวดเร็วและชัดเจน "ข้าขอขอบคุณอย่างสุดซึ้งสำหรับบันทึกของท่าน มัน ทำให้ข้าหัวเราะได้ดีทีเดียว! ช่างเป็นความคิดที่น่าหัวเราะเสียนี่กระไร ที่หัวใจของข้าจะปรารถนา #EMP ท่าน#!!""
 court_ongoing.0503.a:0 "[target.GetFirstNameNoTooltip] จะต้านทานเสน่ห์ของข้าได้ไม่นาน!"
 court_ongoing.0503.a.tt:0 "แผนการเกี้ยวพาราสี [target.GetShortUIName] ของข้าดำเนินต่อไป"
 court_ongoing.0503.b:0 "ข้าคิดว่าเราเกิดมาคู่กันเสียอีก..."


 #Someone farted! by Mathilda Bjarnehed
 court_ongoing.1000.t:1 "$court_event_title$ กลิ่นอันน่าอับอาย"
 court_ongoing.1000.desc:1 "ข้าได้รับการเชิญไปร่วมงานเลี้ยงใน [location.GetNameNoTooltip] และได้ที่นั่งใกล้กับ [target.GetFirstName] แม้ข้าจะพยายามอย่างแน่วแน่ ข้าก็ล้มเหลวในการเริ่มบทสนทนา [target.GetSheHe|U] อาจจะพูดไม่ออก เพราะความรู้สึกรักใคร่อันรุนแรงของข้า\n\nทันใดนั้น เสียงผายลมที่ดังที่สุดเท่าที่ข้าเคยได้ยินก็ดังมาจากโต๊ะของเรา แขกสองสามคนกำลังมองไปที่ [target.GetFirstNameNoTooltip] ข้าต้องช่วย [target.GetHerHim]!"
 court_ongoing.1000.a:0 "เป็นข้าเอง! ข้าผายลม!"
 court_ongoing.1000.a.success:0 "[target.GetFirstNameNoTooltip] รู้สึกโล่งใจและขอบคุณ"
 court_ongoing.1000.a.failure:0 "[target.GetFirstNameNoTooltip] ไม่ใช่คนที่ผายลม"
 court_ongoing.1000.b:0 "[scapegoat.GetTitledFirstNameNoTooltip] เจ้า[scapegoat.Custom2('InsultNoun', ROOT.Char)]เฒ่าเหม็นเน่า!"
 court_ongoing.1000.b.rl:0 "ข้าพยายามโยนความผิดให้ [scapegoat.GetTitledFirstNameNoTooltip]"
 court_ongoing.1000.b.failure:0 "[target.GetFirstNameNoTooltip] รู้สึกสงสาร [scapegoat.GetTitledFirstNameNoTooltip] อย่างมาก"
 court_ongoing.1000.b.tt:0 "ผลลัพธ์ขึ้นอยู่กับว่า [target.GetFirstNameNoTooltip] มีความเห็นอกเห็นใจเพียงใด"
 court_ongoing.1000.c:0 "บางทีข้าควรจะเงียบไว้..."

 #Defend their honor through duel or diplomacy, by Mathilda Bjarnehed
 court_ongoing.1010.t:1 "$court_event_title$ เกียรติยศของ[target.GetLadyLord|U]"
 court_ongoing.1010.desc:1 ""ขอสาบานต่อ [insulter.GetFaith.HighGodName], [target.GetTitledFirstName] ช่างเป็น[target.Custom2('InsultNoun', SCOPE.sC('insulter'))]ที่น่ารังเกียจเหลือทน! ท่านเคยเห็นหรือไม่ว่า[target.GetSheHe] [target.Custom('quirk_neg_present')]? น่าสมเพชสิ้นดี!"\n\n[insulter.Custom2('MyCharacterIntroduction', ROOT.Char)|U] แหงนศีรษะของ[insulter.GetHerHis]ไปด้านหลังพลางหัวเราะอย่างชั่วร้าย\n\n[target.GetFirstNameNoTooltip] ยังคงสนทนากับสหายของ[target.GetHerHis] แต่ข้าบอกได้เลยว่า[target.GetSheHe]ได้ยิน[insulter.GetHerHim] ข้ามิอยากเห็น[target.GetHerHim]เจ็บปวดเลย"
 court_ongoing.1010.a:0 "คำโป้ปดอันชั่วช้า! ชักดาบของเจ้าออกมา [insulter.Custom2('InsultNoun', ROOT.Char)]!"
 court_ongoing.1010.b:0 "ท่านควรขอโทษใต้เท้า[target.GetLadyLord]"
 court_ongoing.1010.c:0 "โอ้ [target.GetFirstNameNoTooltip] [insulter.GetSheHe|U] ช่างผิดมหันต์!"

 court_ongoing.1010.a.success:0 "ท่านเอาชนะ [insulter.GetFirstNameNoTooltip] ในการประลอง"
 court_ongoing.1010.a.failure:0 "ท่านพ่ายแพ้ต่อ [insulter.GetFirstNameNoTooltip]"
 court_ongoing.1010.b.success:0 "ท่านโน้มน้าวให้ [insulter.GetFirstNameNoTooltip] ขอโทษได้สำเร็จ"
 court_ongoing.1010.b.failure:0 "[insulter.GetFirstNameNoTooltip] ปฏิเสธที่จะรับฟัง"

 court_ongoing.1011.desc:0 "[insulter.GetTitledFirstName] ชักดาบของ [insulter.GetHerHis] ออกมาพร้อมกับรอยยิ้มเยาะเย้ย โอ้ ข้าจะสนุกเพียงใดกับการลบรอยยิ้มอันโอหังนั้นออกจากใบหน้าของ [insulter.GetHerHis]!\n\nเมื่อข้าจัดการกับ [insulter.GetHerHim] เสร็จสิ้น ความอัปยศของ [insulter.GetTitledFirstNamePossessiveNoTooltip] ก็ถึงที่สุด [insulter.GetSheHe] ทั้ง bruised และหน้าแดงก่ำ คร่ำครวญคำขอโทษและเดินโขยกเขยกจากไปเพื่อเลียแผลของ [insulter.GetHerHis]\n\n[target.GetTitledFirstName] ในทางกลับกัน กลับเปล่งประกายดุจดวงอาทิตย์ \"ท่านคือวีรบุรุษที่แท้จริง [ROOT.Char.GetTitledFirstNameNoTooltip]! ข้าขอขอบพระคุณท่านชั่วนิรันดร์!\""
 court_ongoing.1011.a:0 "เป็นเกียรติของข้า ใต้เท้า[target.GetLadyLord] [target.GetFirstNameNoTooltip]"

 #Fetch gift, by Mathilda Bjarnehed
 court_ongoing.1021.t:1 "ข้อพิสูจน์แห่งความภักดี"
 court_ongoing.1021.desc:0 ""[target.GetLadyLord|U] [target.GetFirstName]! [target.Custom('RomanticComplimentNoun')] ผู้ [target.Custom('RomanticComplimentAdjective')] ของข้า!"\n\n[owner.Custom2('MyCharacterIntroduction', ROOT.Char)|U] กำลังคุกเข่าอยู่ในฝุ่นต่อหน้าข้า มือขวาวางเหนือหัวใจของ [owner.GetHerHis] "ความปรารถนาเดียวของข้าคือการนำเกียรติยศและความสุขมาสู่ท่าน โปรดบอกข้าเถิด — ข้าจะพิสูจน์ความรักของข้าที่มีต่อท่านได้อย่างไร?""
 court_ongoing.1021.a:0 "จงสังหารหมาป่าและนำหนังของมันมาให้ข้า"
 court_ongoing.1021.wolf_pelt.success:0 "[owner.GetShortUINameNoTooltip] นำหนังหมาป่ามาให้ท่าน"
 court_ongoing.1021.wolf_pelt.failure:0 "[owner.GetShortUINameNoTooltip] ล้มเหลวในการสังหารหมาป่า"
 court_ongoing.1021.b:0 "ข้าต้องการสหายขนปุย"
 court_ongoing.1021.cat_pet.success:0 "[owner.GetShortUINameNoTooltip] มอบแมวให้ท่าน"
 court_ongoing.1021.dog_pet.success:0 "[owner.GetShortUINameNoTooltip] มอบสุนัขให้ท่าน"
 court_ongoing.1021.eagle_pet.success: "[owner.GetShortUINameNoTooltip]มอบลูกนกอินทรีให้ท่านเป็นของขวัญ"
 court_ongoing.1021.pet.failure:1 "[owner.GetShortUINameNoTooltip] ไม่ได้มอบสัตว์เลี้ยงให้ท่าน"
 court_ongoing.1021.c:0 "สร้อยคอของ[necklace_owner.GetTitledFirstNamePossessive]ดูน่ารักดีนะ..."
 court_ongoing.1021.necklace.success:0 "[owner.GetShortUINameNoTooltip] มอบสร้อยคอให้ท่าน"
 court_ongoing.1021.necklace.failure:0 "[owner.GetShortUINameNoTooltip] ปฏิเสธที่จะมอบสร้อยคอให้ท่าน"
 court_ongoing.1021.d:0 "นำบางสิ่งที่แปลกประหลาดมาให้ข้า — กล้วยไม้หายาก บางที?"
 court_ongoing.1021.orchid.success:0 "[owner.GetShortUINameNoTooltip] นำกล้วยไม้หายากมาให้ท่าน"
 court_ongoing.1021.orchid.failure:0 "[owner.GetShortUINameNoTooltip] ปฏิเสธที่จะมอบกล้วยไม้ให้ท่าน"
 court_ongoing.1021.x:0 "พอแล้ว! ความบ้าคลั่งนี้จบลงเดี๋ยวนี้!"

 #GIFT: wolf Pelt, by Mathilda Bjarnehed
 court_ongoing.1022.t:1 "$court_event_title$ เจ้าสีเทา"
 court_ongoing.1022.start.desc:0 ""[target.GetLadyLord] [target.GetFirstName] ผู้งดงาม!" ข้าถอนหายใจขณะคุกเข่าลงต่อหน้า [target.GetHerHim] "ความปรารถนาเดียวของข้าคือการนำเกียรติยศและความสุขมาสู่ท่าน โปรดบอกข้าเถิด — ข้าจะพิสูจน์ความรักของข้าที่มีต่อท่านได้อย่างไร?"\n\n"
 court_ongoing.1022.end.desc:0 "[target.GetTitledFirstNameNoTooltip] ลังเลและแก้มของ [target.GetHerHis] เปลี่ยนเป็นสีแดง ด้วย [ROOT.Char.GetFaith.HighGodName] ข้าหวังว่า [target.GetSheHe] จะพอใจและไม่อับอาย!\n\n"จงสังหารหมาป่าเพื่อข้าและนำหนังของมันมาให้ข้า แล้วเราค่อยสนทนากันต่อ""
 court_ongoing.1022.a:0 ""ความปรารถนาของท่านคือคำสั่งของข้า!""
 court_ongoing.1022.a.success:0 "ท่านสังหารหมาป่าได้สำเร็จ"
 court_ongoing.1022.a.failure:0 "ท่านกลับมามือเปล่า"
 court_ongoing.1022.b:0 "ข้าเห็นสัตว์ขนปุยตัวหนึ่งในคอกสุนัข..."
 court_ongoing.1022.b.success:0 "[target.GetShortUINameNoTooltip] เชื่อว่าเป็นหนังหมาป่า"
 court_ongoing.1022.b.failure:0 "[target.GetShortUINameNoTooltip] มองเห็นกลอุบายของท่าน"
 court_ongoing.1022.c:0 "ข้าจะติดสินบนนายพราน"
 court_ongoing.1022.c.master_of_hunt:0 "$master_of_hunt_court_position$ ของข้าจะหาหนังหมาป่ามาให้ข้า!"
 court_ongoing.1022.c.master_of_hunt.success:0 "[master_of_hunt.GetFirstNameNoTooltip] พบและสังหารหมาป่าระหว่างการล่า"
 court_ongoing.1022.c.master_of_hunt.success.tt:0 "ท่านได้หนังมาโดยไม่มีค่าใช้จ่าย และไม่มีความเสี่ยงต่อท่าน"
 court_ongoing.1022.c.master_of_hunt.failure:0 "[master_of_hunt.GetFirstNameNoTooltip] พบหนังหมาป่าสำหรับซื้อ"
 court_ongoing.1022.d:0 ""ข้าขออภัย แต่ข้าทำสิ่งนี้ไม่ได้""

 court_ongoing.1023.desc:0 "สุนัขตัวโปรดตัวหนึ่งของข้าพเจ้าหายไปจากคอกสุนัข [dummy_gender.Custom('MistressMaster')] ผู้ดูแลสุนัขได้จัดให้มีการค้นหาเมื่อคืนนี้ แต่ก็กลับมามือเปล่า "ข้าพเจ้าไม่รู้เลยว่า [dog_gender.GetSheHe] ออกไปได้อย่างไร" [dummy_gender.GetWomanMan] ผมสีเทากล่าวพร้อมถอนหายใจ "สุนัขไม่น่าจะเปิดประตูเองได้..."\n\n"นายหญิง/นายท่าน [ROOT.Char.GetLadyLord] [ROOT.Char.GetFirstNameNoTooltip]!" เมื่อข้าพเจ้าหันไป ก็พบกับรอยยิ้มกว้างของ [owner.GetTitledFirstNamePossessive] ในมือของ [target.GetHerHis] มีหนังสัตว์มันวาวอยู่ผืนหนึ่ง..."
 court_ongoing.1023.a:0 "ปล่อยข้าไว้ตามลำพัง ข้าต้องการเวลาคิด..."
 court_ongoing.1023.b:0 "ฆาตกร! ข้าไม่อยากเห็นหน้าเจ้าอีกเลย!"

 court_ongoing.1024.desc: "ภายใต้ความมืดมิดยามค่ำคืน ข้าแอบเข้าไปในคอกสุนัข ในไม่ช้าข้าก็พบเหยื่อที่สมบูรณ์แบบ \"มานี่สิ เจ้าสัตว์ร้าย\" ข้ากระซิบขณะโบกไส้กรอกชิ้นหนาต่อหน้าสิ่งมีชีวิตที่ไม่สงสัย...\n\nแต่แผนการอันแยบยลของข้ากลับพลิกผันเมื่อข้านำเสนอหนังสัตว์แก่ [target.GetTitledFirstName] ทันทีที่ [target.GetSheHe] ทอดสายตาของ[target.GetHerHis]มองมัน ข้ารู้ว่า [target.GetSheHe] จำมันได้ \"เจ้า... เจ้าฆาตกร! สุนัขตัวนั้นเหมือนลูกของข้า!\""
 court_ongoing.1024.a:0 "ข้า... ข้าไม่รู้ว่าท่านกำลังพูดถึงอะไร!"

 #GIFT: PET, by Mathilda Bjarnehed
 court_ongoing.1030.t:1 "$court_event_title$ แมวและสุนัข"
 court_ongoing.1030.desc:2 "ฝนกำลังเทลงมาข้างนอก [target.GetTitledFirstName] ผู้ [target.Custom('ComplimentAdjective')] ของข้าถอนหายใจขณะที่ [target.GetSheHe] มองออกไปนอกหน้าต่างที่พร่ามัว\n\n"[location.GetNameNoTooltip] ช่างน่าสังเวชเสียนี่กระไร ข้าหวังว่าจะมีใครสักคนอยู่เป็นเพื่อนข้าในช่วงวันที่ยาวนานและน่าเบื่อหน่าย..."\n\n[target.Custom('LoverPetName')] ของข้าเป็นคนรักแมวหรือคนรักสุนัขกันนะ ข้าสงสัย?"
 court_ongoing.1030.desc.eagle: "หรือบางที[target.GetSheHe]อาจจะโปรดสหายคู่คิดเชิงกลยุทธ์มากกว่า?"
 court_ongoing.1030.a:0 "แมวที่ฉลาดจะ ทำให้ [target.GetHerHim] มีความสุข"
 court_ongoing.1030.a.success:0 "[target.GetShortUINameNoTooltip] รักแมวตัวนั้นมาก"
 court_ongoing.1030.a.failure:0 "[target.GetShortUINameNoTooltip] ไม่ชอบแมวตัวนั้น"
 court_ongoing.1030.b:0 "สุนัขที่ซื่อสัตย์จะเป็นเพื่อนที่ดีเยี่ยม"
 court_ongoing.1030.b.success:0 "[target.GetShortUINameNoTooltip] รักสุนัขตัวนั้นมาก"
 court_ongoing.1030.b.failure:0 "[target.GetShortUINameNoTooltip] ไม่ชอบสุนัขตัวนั้น"
 court_ongoing.1030.d: "นกอินทรีที่ดุร้ายจะช่วยเหลือ[target.GetHerHim]ได้"
 court_ongoing.1030.d.success: "[target.GetShortUINameNoTooltip]รักนกอินทรีตัวนี้ยิ่งนัก"
 court_ongoing.1030.d.failure: "[target.GetShortUINameNoTooltip]ไม่ชอบนกอินทรีตัวนี้"
 court_ongoing.1030.c:0 ""อย่ากลัวไปเลย ข้าจะอยู่เคียงข้างท่านเสมอ!""

 court_ongoing.1031.start.desc:0 ""ข้าคิดอยู่นาน [ROOT.Char.Custom('LoverPetName')] ของข้า" [owner.GetTitledFirstName] กล่าวขณะที่ [owner.GetSheHe] ค่อย ๆ วางตะกร้าลงบนโต๊ะทำงานของข้า "อะไรจะเป็นเพื่อนที่สมบูรณ์แบบสำหรับสิ่งมีชีวิตที่ซื่อสัตย์ กระฉับกระเฉง และเข้าสังคมเก่ง เช่นท่าน? แล้วข้าก็นึกออก — ไม่มีอะไรจะเหมาะกับท่านไปกว่าสุนัข!"\n\n[owner.GetFirstNameNoTooltip|U] เอาผ้าห่มที่คลุมตะกร้าออก เผยให้เห็นลูกสุนัขตัวน้อย! มันกระโจนเข้าใส่ข้า สะดุดขอบตะกร้าด้วยความตื่นเต้นอย่างแท้จริง"
 court_ongoing.1031.a:0 "โอ้! ข้าจะดูแลเจ้าอย่างดี!"
 court_ongoing.1031.b:0 "นี่... ไม่ใช่สิ่งที่ข้าคาดหวังไว้"

 court_ongoing.1032.desc:0 ""ข้าคิดอยู่นาน [ROOT.Char.Custom('LoverPetName')] ของข้า" [owner.GetTitledFirstName] กล่าวขณะที่ [owner.GetSheHe] ค่อย ๆ วางตะกร้าลงบนโต๊ะทำงานของข้า "อะไรจะเป็นเพื่อนที่สมบูรณ์แบบสำหรับสิ่งมีชีวิตที่ฉลาดและรักอิสระ เช่นท่าน? แล้วข้าก็นึกออก — ไม่มีอะไรจะเหมาะกับท่านไปกว่าแมว!"\n\n[owner.GetFirstNameNoTooltip|U] เอาผ้าห่มที่คลุมตะกร้าออก เผยให้เห็นลูกแมวตัวน้อย! มันเงยหน้ามองข้าด้วยดวงตากลมโตสี [ROOT.Char.Custom('RandomCatEyeColor')] และเริ่มส่งเสียงครางในลำคอ"

 court_ongoing.1033.desc: ""ข้าคิดอยู่นานและหนักใจยิ่งนัก [ROOT.Char.Custom('LoverPetName')]ของข้า," [owner.GetTitledFirstName]กล่าวขณะที่[owner.GetSheHe]ชักชวนข้าออกไปข้างนอก [owner.GetSheHe|U]นำทางข้าไปยังผืนผ้าที่คลุมก้อนเล็กๆ บางอย่างไว้ "สหายใดเล่าจะเหมาะสมที่สุดสำหรับผู้ที่ทั้งดุดันและเปี่ยมด้วยกลยุทธ์ เช่นท่าน? แล้วข้าก็คิดออก — ไม่มีสิ่งใดจะเหมาะสมกับท่านยิ่งไปกว่านกอินทรีอีกแล้ว!"\n\n[owner.GetFirstNameNoTooltip|U]เปิดผ้าคลุมออก เผยให้เห็นลูกนกอินทรีน้อยอยู่บนคอนไม้ ดวงตาของมันถูกคลุมด้วยหมวกคลุมตาเล็กๆ เพื่อให้มันสงบ แต่เสียงร้องของมันกลับเติมเต็มข้าด้วยความตื่นเต้น"

