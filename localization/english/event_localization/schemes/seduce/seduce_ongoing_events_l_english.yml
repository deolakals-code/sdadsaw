l_english: 
 seduce_ongoing.success.rejection:0 "เป็นช่วงเวลาที่ดี แต่คงต้องพอเพียงเท่านี้"
 seduce_ongoing.failure.rejection:0 "ไม่ ไม่ และไม่มีวันเป็น เช่นนั้น [owner.GetFirstNameNoTooltip]"
 seduce_ongoing_decline_event.tt:0 "ข้าขอสละโอกาสนี้ในการสร้างความประทับใจให้ [target.GetTitledFirstName]"
 seduce_ongoing_possible_outcomes_tooltip_effect.success.desc:0 "ทุกอย่างเป็นไปตามแผน"
 seduce_ongoing_possible_outcomes_tooltip_effect.failure.desc:0 "[target.GetFirstNameNoTooltip] ไม่ได้รู้สึกประทับใจ"

 seduce_ongoing.1001.t:0 "การเต้นรำ"
 seduce_ongoing.1001.distant_opening:0 "ข้าได้เดินทางมายังราชสำนักใน [court_of_residence.GetNameNoTier] ทันเวลางานเต้นรำ ณ [court_owner.Custom('ResidenceBuilding')] ข้าได้รับคำเชิญมา ด้วยต้องพบ [target.GetTitledFirstName] ให้จงได้"
 seduce_ongoing.1001.close_opening:0 "ข้าเข้าร่วมงานเต้นรำมิใช่เพียง เพราะข้าคือ [ROOT.Char.GetLadyLord|U] แห่ง [court_owner.Custom('ResidenceBuilding')] แต่ เพราะข้าปรารถนาจะพบ [target.GetTitledFirstName] ที่นั่น"
 seduce_ongoing.1001.desc:0 "\n\n[target.GetSheHe|U] ดูงดงามเปล่งปลั่ง และเมื่อเรามีโอกาสอยู่ตามลำพังในที่สุด ข้าจึงเสนอคำแนะนำของข้า"
 seduce_ongoing.1001.a:0 "มาร่วมวงเต้นรำกับข้าในเพลงถัดไปเถิด [target.GetLadyLord] ของข้า?"
 seduce_ongoing.1001.a.tt:0 "#F ดึงดูดด้านขี้เล่นของ [target.GetFirstNamePossessiveNoTooltip]#!"
 seduce_ongoing.1001.b:0 "เดินเล่นในสวน ห่างจากทั้งหมดนี้ดีหรือไม่?"
 seduce_ongoing.1001.b.tt:0 "#F ดึงดูดด้านช่างคิดของ [target.GetFirstNamePossessiveNoTooltip]#!"
 seduce_ongoing.1001.c:0 "ให้ข้าหาอาหารมาให้ท่านเพิ่มอีกหน่อยดีหรือไม่?"
 seduce_ongoing.1001.c.tt:0 "#F ดึงดูดด้านตะกละของ [target.GetFirstNamePossessiveNoTooltip]#!"
 seduce_ongoing.1001.d:0 "ท่านเห็นหรือไม่ว่าคนเหล่านี้ "เต้นรำ" กันอย่างไร?"
 seduce_ongoing.1001.d.tt:0 "#F ดึงดูดด้านมุ่งร้ายของ [target.GetFirstNamePossessiveNoTooltip]#!"

 seduce_ongoing.1003.opening:0 "ณ งานเต้นรำที่[court_owner.Custom('ResidenceBuilding')] [owner.GetTitledFirstName] ได้เข้ามาหาข้า เสนอตัวร่วมทาง[owner.GetHerHis]"
 seduce_ongoing.1003.dance:0 "\n\nขณะที่เราหมุนตัวอยู่บนฟลอร์ เราดึงดูดสายตาผู้คนได้อย่างแน่นอน และข้าก็หัวเราะราวกับ [ROOT.Char.Custom('GirlBoy')] น้อย!"
 seduce_ongoing.1003.walk:0 "\n\nเราเดินเล่นในสวน พูดคุยกันสารพัดเรื่อง จนกระทั่งเรารู้ตัวว่าต่างฝ่ายต่างลืมเวลาไปแล้ว!"
 seduce_ongoing.1003.food:0 "\n\n[owner.GetSheHe|U] ให้คนรับใช้บางคนนำอาหารออกมาเพิ่มอีกสองสามจาน และเราก็นั่งรับประทานอาหารด้วยกันเกือบตลอดทั้งคืน มันอร่อยมาก!"
 seduce_ongoing.1003.mockery:0 "\n\nเรานั่งล้อเลียนแขกคนอื่นๆ แบ่งปันเรื่องตลกและเสียงหัวเราะ ข้าประทับใจอย่างยิ่งกับไหวพริบอันเฉียบแหลมของ [owner.GetFirstNamePossessiveNoTooltip]!"
 seduce_ongoing.1003.fallback:0 "\n\nสุดท้ายเราก็สนุกกันมาก เราเต้นรำกันเกือบตลอดเวลาของการเฉลิมฉลอง!"
 seduce_ongoing.1003.a:0 "ข้ามีค่ำคืนที่ดีเหลือเกิน!"

 seduce_ongoing.1004.dance:0 "[owner.GetSheHe|U] ไม่เข้าใจคำใบ้ที่ว่าข้าไม่สนใจที่จะเต้นรำ และหลังจากหมุนตัวอย่างไม่เต็มใจสองสามรอบ ข้าก็ต้องขอให้ [owner.GetHerHim] ปล่อยข้าไป"
 seduce_ongoing.1004.walk:0 "แม้ว่าการเดินเล่นในสวนจะ ทำให้สดชื่น แต่การพูดคุยของ [owner.GetFirstNamePossessive] ทำให้ข้าเบื่ออย่างยิ่ง\n\nในไม่ช้าข้าก็ขอตัว และหาทางกลับไปที่งานเต้นรำ"
 seduce_ongoing.1004.food:0 "แม้ว่าข้าจะไม่คัดค้านการปรากฏตัวของ [owner.GetHerHis] แต่ตลอดทั้งเย็น [owner.GetSheHe] ก็ส่งคนรับใช้ไปหาอาหารจานแล้วจานเล่า ข้าอิ่มอย่างรวดเร็ว และขอตัวไปเต้นรำแทน"
 seduce_ongoing.1004.mockery:0 "[target.GetSheHe|U] นั่งข้างข้า แสดงความคิดเห็นเกี่ยวกับแขกคนอื่นๆ\n\nไม่เพียง แต่โหดร้ายโดยไม่จำเป็นเท่านั้น แต่ยังหยาบคายและไร้ศิลปะโดยสิ้นเชิงอีกด้วย"
 seduce_ongoing.1004.fallback:0 "[owner.GetSheHe|U] คอยเสนอวิธีใช้เวลาในงานเฉลิมฉลอง แต่ [owner.GetSheHe] ทำได้เพียงเท่านี้เมื่อ [owner.GetSheHe] เป็นเพื่อนร่วมทางที่น่าสะพรึงกลัวด้วยตัว [owner.GetHerselfHimself]"
 seduce_ongoing.1004.a:0 "[owner.GetSheHe] กำลังคิดอะไรอยู่?"

 seduce_ongoing.1005.dance:0 "[target.GetTitledFirstName] และข้าหมุนตัวไปทั่วฟลอร์เต้นรำด้วยกัน เป็นที่จับตามองขณะที่[target.GetSheHe] หัวเราะอย่างสุดหัวใจ[target.GetHerHis]"
 seduce_ongoing.1005.walk:0 "[target.GetTitledFirstName] และข้าเดินเล่นในสวน พูดคุยกันสารพัดเรื่อง ในที่สุดเราก็รู้ตัวว่าต่างฝ่ายต่างลืมเวลาไปแล้ว และเมื่อเรากลับมา งานเต้นรำก็เริ่มเลิกราแล้ว"
 seduce_ongoing.1005.food:0 "ข้าให้คนรับใช้นำอาหารมาเพิ่มให้ [target.GetTitledFirstName] และตัวข้า และเมื่อค่ำคืนผ่านไป เราก็เพลิดเพลินกับอาหารอร่อยทุกจานที่พ่อครัวแห่ง [court_of_residence.GetNameNoTier] มีให้ [target.GetWomanMan] ผู้นั้นมีรสนิยมในสิ่งดีๆ ในชีวิตอย่างแน่นอน"
 seduce_ongoing.1005.mockery:0 "เรานั่งด้วยกัน เล่าเรื่องตลกเกี่ยวกับแขกคนอื่นๆ เรื่องแล้วเรื่องเล่า ข้าไม่คาดคิดว่า [target.GetTitledFirstName] จะมีทักษะในการล้อเลียน เช่นนี้!"
 seduce_ongoing.1005.fallback:0 "[target.GetTitledFirstName] และข้าลงเอยด้วยความสนุกสนาน เราเต้นรำกันเกือบตลอดเวลาของการเฉลิมฉลอง!"
 seduce_ongoing.1005.a:0 "ช่างเป็นค่ำคืนที่เรามี!"

 seduce_ongoing.1006.dance:0 "ข้าคิดว่าข้าพร้อมแล้วเมื่อ [target.GetSheHe] ตกลงที่จะเต้นรำ แต่ถึงแม้ข้าจะจัดการตัวเองอย่างคล่องแคล่ว [target.GetTitledFirstName] ก็รีบขอตัวและทิ้งข้าให้ยืนอยู่ตามลำพังท่ามกลางนักเต้นคนอื่นๆ"
 seduce_ongoing.1006.walk:0 "ข้าคิดว่าเป็นการเดินเล่นที่น่ารื่นรมย์ แต่บางทีอากาศอาจจะหนาวเกินไป หรือบางทีข้าอาจพูดมากเกินไป เพราะไม่นาน[target.GetSheHe] ก็กล่าวขอตัว[target.GetHerHis] และกลับไปยังงานเต้นรำ โดยไม่แม้ แต่จะรอว่าข้าจะตามไปด้วยหรือไม่\n\nเมื่อข้ากลับไปถึง [target.GetSheHe] ก็กำลังสนุกสนานอยู่กับนักเต้นคนอื่นๆ"
 seduce_ongoing.1006.food:0 "บางทีอาจมีบางอย่างผิดปกติกับอาหารที่ข้าให้คนรับใช้นำออกมาให้[target.GetTitledFirstName]? แม้หลังจากที่[target.GetSheHe] กล่าวขอตัว[target.GetHerHis] ไปแล้ว อาหารก็ยังคงหลั่งไหลมาจากห้องครัว กองพะเนินขณะที่ข้านั่งเขี่ยมันอยู่เพียงลำพัง"
 seduce_ongoing.1006.mockery:0 "ไม่ว่าข้าจะพยายามหนักแค่ไหน [target.GetTitledFirstName] ก็ไม่หัวเราะกับเรื่องตลกของข้า ในที่สุด [target.GetSheHe] ก็กล่าวหาว่าข้าโหดร้ายโดยไร้เหตุผล และทิ้งข้าให้นั่งอยู่ตามลำพัง"
 seduce_ongoing.1006.fallback:0 "ข้าคอยเสนอวิธีที่เราจะใช้เวลาในงานเฉลิมฉลอง แต่ [target.GetTitledFirstName] ดูเหมือนจะไม่สนใจเลย ข้าทำอะไรผิดไปหรือ?"
 seduce_ongoing.1006.a:0 "เรื่องนี้ไม่ค่อยดีนัก"

 seduce_ongoing.successful.target:0 "\n\nแม้ว่าของขวัญจะไม่ระบุชื่อผู้ให้ แต่ [owner.GetTitledFirstName] ก็พยายามอย่างยิ่ง เพื่อให้แน่ใจว่าข้าจะรู้ว่า [owner.GetSheHe] เป็นผู้อยู่เบื้องหลัง"
 seduce_ongoing.unsuccessful.target:0 "\n\nแม้ว่าของขวัญจะถูกส่งมาโดยไม่ระบุชื่อ แต่ก็ไม่ยากที่จะเข้าใจว่า [owner.GetTitledFirstName] เป็นผู้อยู่เบื้องหลัง..."
 seduce_ongoing.target_successful.option:0 "[owner.GetSheHe|U] สมควรได้รับคำขอบคุณอย่างจริงใจจากข้า!"
 seduce_ongoing.target_unsuccessful.option:0 "บางทีอาจมี #EMP ใครบางคน#! ที่จะชอบสิ่งนี้..."
 
 seduce_ongoing.target.opening:0 "[target.Custom2('AppropriateGreeting', ROOT.Char)]"
 seduce_ongoing.successful.owner:0 "ขอบคุณมากสำหรับ [SCOPE.Custom('SeductionGiftType')] ที่ท่านมอบให้ข้า ข้าแทบจำไม่ได้เลยว่าครั้งสุดท้ายที่ข้าได้รับของขวัญที่ยอดเยี่ยม เช่นนี้คือเมื่อใด!"
 seduce_ongoing.unsuccessful.owner:0 "ข้าได้รับ [SCOPE.Custom('SeductionGiftType')] ที่ท่านส่งมา ข้า... ไม่แน่ใจถึงเหตุผลที่ท่านส่งของขวัญ เช่นนี้มาให้ข้า แต่ข้าได้รับทราบแล้ว"
 seduce_ongoing.owner_successful.option:0 "ทุกสิ่งเพื่อท่าน [target.GetFirstNameNoTooltip]"
 seduce_ongoing.owner_unsuccessful.option:0 "ข้าทำอะไรผิดไป?"

 seduce_ongoing.1101.t:0 "ของราคาแพงบางอย่าง"
 seduce_ongoing.1101.desc:0 "ของขวัญย่อมดึงดูดความสนใจของ [target.GetTitledFirstNamePossessive] ได้อย่างแน่นอน และแน่นอนว่าใครๆ ก็ย่อมชื่นชมของขวัญชั้นดีที่เห็นได้ชัดว่ามีราคาแพง"
 seduce_ongoing.gift_selection.tapestry:0 "พรมแขวนผนัง แสดงภาพราชวงศ์ของ [target.GetHerHis]"
 seduce_ongoing.gift_selection.tapestry_tt:0 "ข้าคิดว่า [target.GetTitledFirstName] คือ [target.GetWomanMan] ที่ความภักดีมีต่อครอบครัวและราชวงศ์ของ [target.GetHerHis]"
 seduce_ongoing.gift_selection.horse:0 "ม้าพันธุ์แท้ย่อมเป็นที่ชื่นชม"
 seduce_ongoing.gift_selection.horse_tt:0 "ข้าคิดว่า [target.GetTitledFirstName] คือผู้ที่ชื่นชมกิจกรรมและท้องฟ้าที่เปิดโล่ง"
 seduce_ongoing.gift_selection.tailor:0 "ช่างตัดเสื้อเพื่อ แต่งกายให้ [target.GetHerHim] อย่างสมบูรณ์แบบ!"
 seduce_ongoing.gift_selection.tailor_tt:0 "ข้าคิดว่า [target.GetTitledFirstName] ชื่นชมสไตล์และการสร้างความประทับใจ"
 seduce_ongoing.gift_selection.decline:0 "บางทีอาจจะไม่"

 seduce_ongoing.1102.t:0 "ของขวัญแห่งแรงงาน"
 seduce_ongoing.1102.desc:0 "ทุกคนชื่นชมของขวัญ แต่บางทีข้าอาจจะคิดอะไรบางอย่างที่ไม่เหมือนใครอย่างแท้จริง ซึ่งจะสร้างความประทับใจอย่างแท้จริงให้กับ [target.GetTitledFirstName]!"
 seduce_ongoing.gift_selection.embroidery:0 "งานปักลายตราประจำตระกูลของ [target.GetHerHis]"
 seduce_ongoing.gift_selection.embroidery_tt:0 "ข้าคิดว่า [target.GetTitledFirstName] ใส่ใจในสถานะของครอบครัว [target.GetHerHis]"
 seduce_ongoing.gift_selection.poem:0 "บทกวีที่ได้รับมอบหมายเกี่ยวกับความสุขของชีวิต อุทิศให้กับ [target.GetHerHim]"
 seduce_ongoing.gift_selection.poem_tt:0 "ข้าคิดว่า [target.GetTitledFirstName] ชื่นชมความสุขทางกายภาพของชีวิต หรืออย่างน้อยก็บทกวี"
 seduce_ongoing.gift_selection.woodcarving:0 "งานแกะสลักไม้รูปปราสาท!"
 seduce_ongoing.gift_selection.woodcarving_tt:0 "ข้าคิดว่า [target.GetTitledFirstName] ชื่นชมสถาปัตยกรรม"
 
 seduce_ongoing.1103.t:0 "เล็กน้อย แต่มีความหมาย"
 seduce_ongoing.1103.desc:0 "ไม่ใช่ทุกของขวัญที่จะต้องเป็นการแสดงออกถึงความมั่งคั่งอย่างยิ่งใหญ่ สิ่งเล็กๆ น้อยๆ สามารถสร้างความประทับใจได้มากกว่า ตราบใดที่เลือกมาอย่างดี ข้าสงสัยว่า [target.GetTitledFirstName] จะชื่นชมอะไร"
 seduce_ongoing.gift_selection.jewelry:0 "ล็อกเกตเงิน อยู่ใกล้หัวใจของ [target.GetHerHis] เสมอ"
 seduce_ongoing.gift_selection.jewelry_tt:0 "ข้าคิดว่า [target.GetTitledFirstName] ชอบดึงดูดความสนใจของผู้คน — หรือเพียงแค่สิ่งที่ส่องประกาย"
 seduce_ongoing.gift_selection.stuffed_animal:0 "สุนัขจิ้งจอกสตัฟฟ์คงจะแปลกตา..."
 seduce_ongoing.gift_selection.stuffed_animal_tt:0 "ข้าคิดว่า [target.GetTitledFirstName] ชื่นชมสัญลักษณ์แห่งอำนาจ — เหนือชีวิต"
 seduce_ongoing.gift_selection.flower_display:0 "การจัดแสดงดอกไม้ สำหรับสวนที่ [court_location.GetNameNoTierNoTooltip]"
 seduce_ongoing.gift_selection.flower_display_tt:0 "ข้าคิดว่า [target.GetTitledFirstName] ชอบดูแลสิ่งต่างๆ หรืออย่างน้อยก็ชื่นชมความงาม"

 seduce_ongoing.1104.t:0 "บางสิ่งที่แปลกตา"
 seduce_ongoing.1104.desc:0 "ใครๆ ก็สามารถซื้อของขวัญแสดงความรักได้ ไม่ว่าจะเล็กหรือใหญ่ หากข้าต้องการสร้างความประทับใจให้ [target.GetTitledFirstName] ข้าควรส่งของที่พิเศษอย่างแท้จริงให้ [target.GetHerHim]"
 seduce_ongoing.gift_selection.rare_book:0 "ข้าควรหาหนังสือหายากเป็นพิเศษให้ [target.GetHerHim]"
 seduce_ongoing.gift_selection.rare_book_tt:0 "ข้าคิดว่า [target.GetTitledFirstName] ชอบความรู้ หรืออย่างน้อยก็วัตถุที่บรรจุความรู้นั้นไว้"
 seduce_ongoing.gift_selection.handkerchief:0 "ผ้าเช็ดหน้าที่มีตราประจำตระกูลของข้า"
 seduce_ongoing.gift_selection.handkerchief_tt:0 "ข้าคิดว่า [target.GetTitledFirstName] จะใช้สัญลักษณ์จากผู้มีสถานะ เช่นข้าได้เป็นอย่างดี"
 seduce_ongoing.gift_selection.object:0 "[SCOPE.Custom('SeductionObjectIndefinite')|U] สิ่งเตือนใจถึงการพบกันครั้งแรกของเรา"
 seduce_ongoing.gift_selection.object_tt:0 "ข้าคิดว่า [target.GetTitledFirstName] ใส่ใจข้าอยู่แล้ว ในทางใดทางหนึ่ง"

 seduce_ongoing.1201.t:0 "ของขวัญที่เลือกสรรมาอย่างดี"
 seduce_ongoing.1201.desc:0 "ข้าได้รับของขวัญ เป็นพรมแขวนผนังที่สวยงาม แสดงภาพฉากจากประวัติศาสตร์ราชวงศ์ของข้า และล้อมกรอบด้วยตราประจำตระกูลที่ทออย่างชำนาญ!"
 seduce_ongoing.1201.a:0 "[owner.GetSheHe|U] สมควรได้รับคำขอบคุณอย่างจริงใจจากข้า!"

 seduce_ongoing.1301.t:0 "ของขวัญประหลาด"
 seduce_ongoing.1301.desc:0 "ข้าได้รับพรมแขวนผนัง ซึ่งตั้งใจจะแสดงภาพฉากจากประวัติศาสตร์ราชวงศ์ของข้า แต่รูปร่างหน้าตาดูแปลกประหลาด และไม่มีใครสามารถตีความได้อย่างแน่ชัดว่าเกิดอะไรขึ้นในฉากใดๆ"
 seduce_ongoing.1301.a:0 "ขายมันเสีย อย่างน้อยก็ใช้เป็นผ้าห่มได้"

 seduce_ongoing.1202.opening:0 "ข้าได้รับม้าตัวหนึ่ง พันธุ์ดีและได้รับการบำรุงเลี้ยง! สัตว์ร้ายอันงดงามนี้ดูสมบูรณ์แบบสำหรับการขี่ และ"
 seduce_ongoing.1202.courtier:0 "ข้าจับได้ว่า [courtier.GetTitledFirstName] กำลังมองมันด้วยความอิจฉาแล้ว"
 seduce_ongoing.1202.no_courtier:0 "มันมีผู้ชื่นชมหลายคนในราชสำนักแล้ว"

 seduce_ongoing.1302.desc:0 "ข้าได้รับม้าตัวหนึ่ง ซึ่ง ทำให้ข้าสงสัยว่าคนอื่นคิดอย่างไรกับข้า พวกเขาคาดหวังว่าข้าจะขี่เจ้าแก่ผอมโซนั่นหรือ?"
 seduce_ongoing.1302.a:0 "ข้าจะทำอะไรกับเจ้าล่อนี่ได้? ขายมันเสีย"

 seduce_ongoing.1203.desc:0 "ช่างตัดเสื้อมาถึงราชสำนัก โดยเฉพาะเพื่อจัดหาเสื้อผ้าใหม่ๆ ที่ข้าอาจต้องการให้แก่ข้า บัดนี้เมื่องานของ [ROOT.Char.GetHerHis] เสร็จสิ้น ข้าต้องบอกว่า [ROOT.Char.GetSheHe] มีฝีมือมาก เช่นกัน!"
 seduce_ongoing.1203.a:0 "ข้ารู้สึกยอดเยี่ยม!"

 seduce_ongoing.1303.desc:0 "ช่างตัดเสื้อมาถึงราชสำนักเพื่อจัดหาเสื้อผ้าใหม่ๆ ที่ข้าอาจต้องการให้แก่ข้า [ROOT.Char.GetSheHe|U] ตกใจกลัวในไม่ช้ากับการกระทำผิดที่เกิดขึ้นเมื่อข้าสงสัยว่ามีอะไรผิดปกติกับเสื้อผ้าเก่าของข้า"
 seduce_ongoing.1303.a:0 "อย่างน้อยข้าก็สามารถขายผ้าขี้ริ้วน่าเกลียดเหล่านี้ที่ [ROOT.Char.GetSheHe] พยายาม แต่งให้ข้าได้"

 seduce_ongoing.1204.desc:0 "ข้าแทบไม่อยากเชื่อขณะที่ข้าแกะห่อหนังออก หนังสือเล่มหนาข้างในต้องมีอายุเป็นศตวรรษ หากไม่มากกว่านั้น เขียนอย่างระมัดระวัง ตก แต่งและปิดทองด้วยมือโบราณ"
 seduce_ongoing.1204.a:0 "หนังสือเล่มนี้มีความมหัศจรรย์อะไรบ้าง?"

 seduce_ongoing.1304.desc:0 "ข้าสับสนเล็กน้อยเมื่อเปิดห่อหนังเพื่อพบหนังสือเล่มหนาเก่าๆ ที่เต็มไปด้วยฝุ่น พลิกดูหน้าต่างๆ ข้าพบภาพประกอบสวยๆ สองสามภาพ แต่ข้าอ่านข้อความไม่ได้ด้วยซ้ำ"
 seduce_ongoing.1304.a:0 "ข้าจะมีประโยชน์อะไรกับหนังสือเล่มนี้? ขายมันเสีย"

 seduce_ongoing.1205.desc:0 "ข้าได้รับงานปักขนาดใหญ่ที่สวยงาม จำลองตราประจำตระกูลของข้าด้วยสีสันสดใส! มันจะเป็นของประดับที่สมบูรณ์แบบในห้องของข้า"
 seduce_ongoing.1205.a:0 "ฝีมือของมันจะสร้างความประทับใจอย่างไม่ต้องสงสัย"

 seduce_ongoing.1305.desc:0 "ข้าได้รับงานปักขนาดใหญ่ ซึ่งคาดว่าจะจำลองตราประจำตระกูลของข้า ข้าไม่แน่ใจว่าศิลปินใช้อะไรเป็นข้อมูลอ้างอิง อย่างไรก็ตาม เพราะข้าจำมันไม่ได้เลย บางทีคนอื่นอาจจะชอบมันมากกว่า..."
 seduce_ongoing.1305.a:0 "มันอาจจะดีถ้าเป็นตราที่ถูกต้อง..."

 seduce_ongoing.1206.desc:0 "กวีคนหนึ่งได้มาอยู่ต่อหน้าข้าเพื่อท่องบทประพันธ์เกี่ยวกับความสุขของชีวิต อุทิศให้กับ "[ROOT.Char.GetTitledFirstName] ผู้ [ROOT.Char.Custom('ComplimentAdjective')]!""
 seduce_ongoing.1206.a:0 "ลมหายใจแห่งบทกวีอันสดชื่น!"

 seduce_ongoing.1306.desc:0 "กวีคนหนึ่งได้มาอยู่ต่อหน้าข้าเพื่อท่องบทประพันธ์ยาวเหยียดเกี่ยวกับความสุขของชีวิต อุทิศให้กับ "[ROOT.Char.GetTitledFirstName] ผู้ [ROOT.Char.Custom('ComplimentAdjective')]" ความสุขของชีวิตไม่ได้ รวมถึงบทกวีนี้"

 seduce_ongoing.1207.desc:0 "ข้าได้รับงานแกะสลักไม้รูปปราสาทขนาดเล็ก! แขกทุกคนที่แวะมาต่างชื่นชมในรายละเอียดและฝีมือที่จัดแสดง"
 seduce_ongoing.1207.a:0 "ช่างเป็นสิ่งที่แปลกตา!"

 seduce_ongoing.1307.desc:0 "ข้าได้รับงานแกะสลักไม้รูป... อาคารบางประเภท? โอ้— มันควรจะเป็นปราสาท! ควรจะเป็น"
 seduce_ongoing.1307.a:0 "ข้าสงสัยว่ามันจะ ทำให้ไฟลุกได้นานแค่ไหน"

 seduce_ongoing.1208.desc:0 "[owner.GetTitledFirstName] ได้ส่ง [SCOPE.Custom('SeductionObjectIndefinite')] มาให้ข้า ของที่ระลึกจากการพบกันครั้งแรกของเรา"
 seduce_ongoing.1208.a:0 "[owner.GetSheHe] คิดว่าข้าจะลืมได้ลงคอหรือ?"

 seduce_ongoing.1308.desc:0 "[owner.GetTitledFirstName] ได้ส่ง [SCOPE.Custom('SeductionObjectIndefinite')] มาให้ข้า ของที่ระลึกจากการพบกันครั้งแรกของเรา [owner.GetSheHe|U] ต้องมีความทรงจำที่ดีกว่าข้ามาก"

 seduce_ongoing.1209.desc:0 "ข้าได้รับล็อกเกตเล็กๆ ชิ้นงานเงินที่สวยงาม แม้ว่าข้าจะสงสัยว่าข้างในมีอะไร แต่สิ่งที่สำคัญกว่าคือคนอื่นจะซุบซิบเกี่ยวกับสิ่งที่อาจบรรจุอยู่ข้างใน"
 seduce_ongoing.1209.a:0 "บางทีใครสักคนอาจช่วยข้าเปิดมันได้ สักวันหนึ่ง?"

 seduce_ongoing.1309.desc:0 "ข้าได้รับล็อกเกตเล็กๆ และในตอนแรกข้าไม่รู้ว่าก้อนที่ไม่ขัดเงาเล็กๆ นั้นเป็นเงินจริงๆ มันเปิดไม่ได้ด้วย ดังนั้นข้าจึงเห็นประโยชน์น้อยนิดสำหรับมัน"
 seduce_ongoing.1309.a:0 "ทำไมใครบางคนถึงคิดว่าข้าจะต้องการสิ่งนี้?"

 seduce_ongoing.1210.desc:0 "มันแปลกตา นั่นเป็นเรื่องจริง แต่มีบางอย่างที่น่าดึงดูดใจเกี่ยวกับสุนัขจิ้งจอกสตัฟฟ์ที่วางอยู่ตรงหน้าข้า บางทีอาจเป็นเสียงคำรามที่แข็งทื่อและดุร้ายบนริมฝีปากของมัน?"
 seduce_ongoing.1210.a:0 "ไม่ธรรมดา แต่ก็ไม่น่ารังเกียจ"

 seduce_ongoing.1310.desc:0 ""เอาของนั่นไปให้พ้นจากข้า!" สุนัขจิ้งจอกสตัฟฟ์มีเสียงคำรามที่น่าขยะแขยงบนริมฝีปาก แยกเขี้ยวที่ดุร้ายใส่ข้า"
 seduce_ongoing.1310.a:0 "ใครจะชอบของขวัญแบบนี้กัน?!"

 seduce_ongoing.1211.desc:0 "การจัดแสดงดอกไม้นั้นน่าทึ่ง และตั้งแต่ชาวนาปลูกเสร็จในสวน การเดินเล่นที่นั่นก็ได้รับความนิยมมากขึ้น"
 seduce_ongoing.1211.a:0 "ข้าไม่รู้ว่าความงามแบบนี้จะสัมผัสใจข้าได้ถึงเพียงนี้"

 seduce_ongoing.1311.desc:0 ""เช่นนั้นแล้ว [ROOT.Char.Custom('FormOfAddressForLiege')] ก็ไม่ประสงค์ให้พวกข้าปลูกมันดอกหรือขอรับ?" เหล่าไพร่ยืนอยู่เบื้องหน้าข้า ดินร่วงหกจากลังบนคานหาบ ดอกไม้ที่พวกเขานำมานั้นดูเหี่ยวเฉาและชอกช้ำ"
 seduce_ongoing.1311.a:0 "ข้าไม่ต้องการสิ่งเหล่านั้นใกล้สวนเลย"

 seduce_ongoing.1212.desc:0 "[owner.GetTitledFirstName] ได้ส่งของขวัญมาให้ข้า ผ้าเช็ดหน้าที่มีตราประจำตระกูล [owner.GetDynasty.GetBaseName] อยู่บนนั้น\n\nมันน่าสนใจอย่างแน่นอนที่จะได้เห็นปฏิกิริยาของผู้อื่นเมื่อข้าแสดงตราสัญลักษณ์ของ [owner.GetTitlePossessive] อย่างโจ่งแจ้ง เช่นนี้"
 seduce_ongoing.1212.a:0 "มันแน่ใจว่าจะทิ้งความประทับใจไม่ทางใดก็ทางหนึ่ง"

 seduce_ongoing.1312.desc:0 "[owner.GetTitledFirstName] ได้ส่งของขวัญมาให้ข้า ผ้าเช็ดหน้าที่มีตราประจำตระกูล [owner.GetDynasty.GetBaseName] อยู่บนนั้น\n\nหาก [owner.GetSheHe] คิดว่าข้าจะแสดงตราสัญลักษณ์ของ [owner.GetHerHis] ในที่สาธารณะ [owner.GetSheHe] คิดผิดอย่างมหันต์!"

