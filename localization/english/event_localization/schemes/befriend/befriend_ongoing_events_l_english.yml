l_english: 
 befriend_ongoing.0901.t:0 "ผูกมิตร: สิ่งที่อาจเป็นไปได้"
 befriend_ongoing.0901.desc:0 "ข้าได้รับข่าวที่น่าตกใจ [target.Custom2('MyCharacterIntroductionNoComma', ROOT.Char)|U] ได้ถึงแก่กรรมแล้ว\n\nชะตาลิขิตให้ข้าไม่มีวันได้ชื่นชมมิตรภาพของ [target.GetHerHis]"
 befriend_ongoing.0901.a:0 "โลกนี้ช่างโหดร้ายและไม่แน่นอน"

 befriend_ongoing.0902.t:0 "ผูกมิตร: ผู้ชมที่ถูกจองจำ"
 befriend_ongoing.0902.t.other:0 "ผูกมิตร: ถูกขังไว้"
 befriend_ongoing.0902.desc:0 "ข้าได้จองจำ [target.Custom2('MyCharacterIntroduction', ROOT.Char)]\n\nแม้ว่าตอนนี้ [target.GetSheHe] จะมีเวลาทั้งโลกที่จะใช้กับข้า แต่ตราบใดที่ [target.GetSheHe] ยังคงถูกจองจำ [target.GetSheHe] ก็ไม่น่าจะตอบรับความพยายามของข้าในการผูกมิตรกับ [target.GetHerHis]"
 befriend_ongoing.0902.desc.other:0 "[target.Custom2('MyCharacterIntroduction', ROOT.Char)|U] ถูกจองจำโดย [imprisoner.Custom2('MyCharacterIntroduction', ROOT.Char)]! ตราบใดที่ [target.GetSheHe] ยังคงถูกจองจำ ข้าจะไม่สามารถผูกมิตรกับ [target.GetHerHis] ได้"
 befriend_ongoing.0902.a:0 "ทำไมจะไม่ได้ล่ะ!? ข้าเป็นผู้จองจำที่ยอดเยี่ยมนะ!"
 befriend_ongoing.0902.a.other:0 "อนิจจา"

 befriend_ongoing.0903.t:0 "ผูกมิตร: สงครามและมิตรภาพ"
 befriend_ongoing.0903.desc:0 "ขณะที่อาณาจักรของเราปะทะกันในสนามรบ ความฝันของข้าในเรื่องความเมตตากรุณาและความเป็นเพื่อนกับ [target.Custom2('MyCharacterIntroductionNoComma', ROOT.Char)] ดูเหมือนจะเป็นไปไม่ได้ อย่างน้อยก็ในตอนนี้"
 befriend_ongoing.0903.a:0 "หวังว่าจะมีช่วงเวลาที่ดีกว่านี้"
 befriend_ongoing.0903.a.tt:0 "ยุติแผนการผูกมิตรกับ [target.GetTitledFirstNameNoTooltip] ของข้า"

 befriend_ongoing.1001.t:0 "ผูกมิตร: ความเคารพในความชื่นชม"
 befriend_ongoing.1001.desc.startnormal:0 "เมื่อพิจารณาถึงการกระทำในชีวิตของข้า เป็นเรื่องธรรมดาที่ผู้อื่นควรเคารพข้า"
 befriend_ongoing.1001.desc.starthumble:0 "แม้ว่าข้าจะไม่ค่อยเอ่ยถึง แต่ข้าก็มีความสำเร็จบางอย่างที่ข้าภาคภูมิใจ"
 befriend_ongoing.1001.desc.end:0 "ข้าเชื่อมั่นว่า [target.GetTitledFirstName] ก็ได้ทำบางสิ่งบางอย่างที่ ทำให้ [target.GetHerHim] ภาคภูมิใจ เช่นกัน\n\nบางทีข้าควรจะจ้างให้ แต่งบทกวีเล็กๆ เปรียบเทียบการกระทำของเรา เพื่อแสดงให้เห็นว่าเราทั้งคู่มีลักษณะคล้ายคลึงกัน"
 befriend_ongoing.1001.a:0 "[target.GetSheHe|U] จะต้องประทับใจในความสามารถของข้าอย่างแน่นอน!"
 befriend_ongoing.1001.b:0 "มุ่งเน้นไปที่ความสำเร็จของ [target.GetFirstNamePossessiveNoTooltip]"
 befriend_ongoing.1001.c:0 "ข้าจะ ทำให้แน่ใจว่า #EMP ทุกคน#! ได้ยินเกี่ยวกับความยิ่งใหญ่ของข้า!"
 
 befriend_ongoing.1002.t:0 "ผูกมิตร: ท่าทีแห่งความเอื้อเฟื้อ"
 befriend_ongoing.1002.desc.start:0 "ข้าควรจะสามารถช่วยให้ความพยายามผูกมิตรกับ [target.GetTitledFirstName] ของข้าดำเนินต่อไปได้ด้วยการมอบของขวัญให้ [target.GetHerHim]\n\n"
 befriend_ongoing.1002.desc.greedy:0 "ทุกคนชอบของขวัญ!"
 befriend_ongoing.1002.desc.malicious:0 "ผู้คนถูกชักจูงได้ง่ายเหลือเกินด้วยของประดับแวววาว..."
 befriend_ongoing.1002.desc.benevolent:0 "การหาของขวัญที่สมบูรณ์แบบให้ใครสักคนสามารถแสดงให้เห็นได้อย่างแท้จริงว่าท่านใส่ใจพวกเขามากแค่ไหน"
 befriend_ongoing.1002.desc.generic:0 "\n\nหากมัน ทำให้ข้าเข้าใกล้เป้าหมายมากขึ้น ก็ถือเป็นเหรียญที่ใช้ไปอย่างคุ้มค่า "
 befriend_ongoing.1002.d:0 "ข้าจะหาบางสิ่งที่หรูหราอย่างแท้จริง!"
 befriend_ongoing.1002.a:0 "นี่ไม่ใช่เวลาที่จะประหยัด"
 befriend_ongoing.1002.b:0 "ความคิดต่างหากที่สำคัญ"
 befriend_ongoing.1002.c:0 "ไม่ ข้าไม่ต้องการแสดงออกมากเกินไป"

 befriend_ongoing.1003.t:0 "ผูกมิตร: ศัตรูของศัตรูข้า"
 befriend_ongoing.1003.desc:0 "สิ่งหนึ่งที่ [target.GetTitledFirstName] และข้ามีร่วมกันคือความเกลียดชังต่อ [rival.GetTitledFirstName]\n\nมันจะเป็นการส่งสารที่ทรงพลังหากมีการสร้างหุ่นจำลองศัตรูของข้า เพื่อแขวนประจานบนกำแพงในครั้งต่อไปที่ [target.GetFirstNameNoTooltip] กลับมายัง [barony.GetTitledFirstNameNoTier]"
 befriend_ongoing.1003.a:0 "และมันจะถูกจุดไฟเผา!"
 befriend_ongoing.1003.b:0 "ข้าไม่จำเป็นต้องยั่วยุ [rival.GetFirstNameNoTooltip] เพิ่มเติม"

 befriend_ongoing.1004.t:0 "ศัตรูของศัตรูข้า"
 befriend_ongoing.1004.desc:1 "ในการเยือน [barony.GetNameNoTooltip] ของ [owner.GetTitledFirstNamePossessive] ครั้งล่าสุด ข้าได้พบกับภาพที่น่าตื่นตาเมื่อเข้าใกล้ [barony.Custom('BaronyTownType')] หุ่นจำลองที่แขวนอยู่บนกำแพง ซึ่งข้าจำได้ทันทีว่าเป็นศัตรูร่วมกันมานานของเรา [rival.GetTitledFirstName]!\n\n[owner.GetFirstNameNoTooltip] ตะโกนต้อนรับข้าขณะที่ [owner.GetSheHe] เทน้ำมันดินที่ลุกไหม้ลงบน "[rival.GetFirstNameNoTooltip]""
 befriend_ongoing.1004.a:0 "ข้ายินดีที่เห็นว่าเรามีความคิดเห็นตรงกันเกี่ยวกับ [rival.GetHerHim]!"

 befriend_ongoing.1005.t:0 "มิตรของศัตรูข้า"
 befriend_ongoing.1005.desc:1 "ผู้แจ้งข่าวลังเลที่จะแบ่งปันข่าวลือ\n\n"ดูเหมือนว่าศัตรูของท่าน [owner.GetTitledFirstName] และ [target.GetTitledFirstName] ได้เผาหุ่นจำลองของท่านที่แขวนอยู่บนกำแพงของ [barony.GetNameNoTooltip] พร้อมทั้งเยาะเย้ยชื่อของท่าน"\n\nเมื่อพวกเขารวมตัวกัน พวกเขาก็เลวร้ายกว่าเดิมสิบเท่า"
 befriend_ongoing.1005.a:0 "ข้ารู้อยู่แล้วว่าข้ามีเหตุผลที่ดีที่จะเกลียดพวกเขา"
 
 befriend_ongoing.2001.t:0 "ผูกมิตร: ความอบอุ่นแห่งมิตรไมตรี "
 befriend_ongoing.2001.desc:0 "ข้าคิดว่าข้าจะต้องพยายาม ทำให้ [target.GetTitledFirstName] ชอบข้า แต่ [target.GetSheHe] กลับกลายเป็นคนที่ข้ารู้จักที่เป็นมิตรที่สุด!\n\n[target.GetFirstNameNoTooltip] บอกข้าว่ามีที่ว่างเสมอข้างเตาผิงของ [target.GetHerHis] สำหรับคนรู้จักใหม่"
 befriend_ongoing.2001.a:0 "ยอดเยี่ยม ข้าจะปล่อยให้ [target.GetHerHim] มาหาข้าเอง"
 befriend_ongoing.2001.b:0 "ข้าจะไม่ปฏิเสธคำเชิญแบบนั้น!"
 
 befriend_ongoing.3001.t:0 "ผูกมิตร: ข้อต่อในโซ่"
 befriend_ongoing.3001.desc:0 "[befriend_envoy.GetTitledFirstName] ผู้ ซึ่งกำลังช่วยเหลือข้าในความพยายามที่จะใกล้ชิดกับ [target.GetTitledFirstName] มากขึ้น ได้เสนอตัวเป็นทูตระหว่างเรา [befriend_envoy.GetSheHe|U] เชื่อว่า [befriend_envoy.GetSheHe] สามารถนำเสนอข้าในแง่มุมที่ดีได้"
 befriend_ongoing.3001.a:0 "[befriend_envoy.GetSheHe|U] ควรเข้าหา [target.GetFirstNameNoTooltip] โดยตรง"
 befriend_ongoing.3001.b:0 "มีเดิมพันสูงเกินไปที่จะพึ่งพา [befriend_envoy.GetFirstNameNoTooltip]"
 befriend_ongoing.3001.tt:0 "#F [befriend_envoy.GetFirstName] จะขอเข้าเฝ้า [target.GetFirstName]#!"
 
 befriend_ongoing.3002.t:0 "การจัดการที่ไม่ปกติ"
 befriend_ongoing.3002.desc:0 "แม้ว่าการที่ [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('befriend_envoy') )] ของข้า [befriend_envoy.GetTitledFirstName] ขอเข้าเฝ้าข้าจะไม่ใช่เรื่องผิดปกติ แต่เหตุผลของ [befriend_envoy.GetHerHis] ในครั้งนี้ช่างแปลกประหลาดเสียจริง [befriend_envoy.GetSheHe|U] ได้ประกาศว่า [befriend_envoy.GetHerselfHimself] เป็นทูตแห่งมิตรภาพในนามของ [owner.GetTitledFirstName]!"
 befriend_ongoing.3002.a:0 "แปลก แต่ข้ายินดีให้ [befriend_envoy.GetHerHim] เล่าเรื่อง [owner.GetFirstNameNoTooltip] ให้ข้าฟัง"
 befriend_ongoing.3002.b:0 "ไม่มีข้าราชบริพารคนใดของข้าที่จะทำหน้าที่เป็นทูตให้ผู้อื่น!"

 befriend_ongoing.3003.t:0 "ผูกมิตร: ทูตรายงาน"
 befriend_ongoing.3003.accepted_envoy:0 "[befriend_envoy.GetTitledFirstName] ได้นำข่าวดีมาให้ข้า [target.GetTitledFirstName] ได้ต้อนรับ [befriend_envoy.GetHerHim] อย่างอบอุ่นในฐานะ "ทูต" ในนามแห่งมิตรภาพของข้า"
 befriend_ongoing.3003.dismissed_envoy:0 "ข้ารู้ว่าข้ากำลังก้าวล้ำขอบเขตบางอย่างโดยการใช้ [scheme.GetTargetCharacter.Custom2('RelationToMe', SCOPE.sC('befriend_envoy') )] ของ [target.GetTitledFirstNamePossessive] เอง แต่ข้าก็หวังว่า [target.GetSheHe] จะเห็นเจตนาดีเบื้องหลังท่าทีนั้น ข้าคิดผิดไปถนัด ข้าไม่น่าเห็นด้วยกับแผนของ [befriend_envoy.GetTitledFirstNamePossessive] เลย..."
 befriend_ongoing.3003.a:0 "แด่มิตรภาพที่กำลังผลิบานของเรา!"
 befriend_ongoing.3003.b:0 "ข้าจะต้องระมัดระวังมากขึ้น"

 befriend_ongoing.3007.t:0 "ผูกมิตร: คำตัดสินจาก [agent_speaking_highly.GetFaith.DivineRealm|U]"
 befriend_ongoing.3007.desc.conviction:0 "ปาฏิหาริย์! [agent_speaking_highly.GetTitledFirstName] ได้เห็นนิมิตจาก [agent_speaking_highly.GetFaith.HighGodName] [agent_speaking_highly.GetSheHe|U] รับรองกับข้าว่า [target.GetTitledFirstName] และข้าถูกกำหนดจากสวรรค์ให้เป็นเพื่อนกัน!"
 befriend_ongoing.3007.desc.doubt:0 "[agent_speaking_highly.GetTitledFirstName] ได้บอกข้าเกี่ยวกับนิมิตจาก [agent_speaking_highly.GetFaith.HighGodName] เห็นได้ชัดว่า [target.GetTitledFirstName] และข้าถูกกำหนดจากสวรรค์ให้เป็นเพื่อนกัน ช่างเป็นประโยชน์เสียจริง"
 befriend_ongoing.3007.a:0 "เราจะบอก [target.GetFirstNameNoTooltip] เกี่ยวกับนิมิตนี้"
 befriend_ongoing.3007.b:0 "[agent_speaking_highly.GetFirstNameNoTooltip] ให้เราสวดภาวนาขอบคุณร่วมกันเถิด"
 
 befriend_ongoing.3009.t:0 "ผูกมิตร: คำพูดดีๆ"
 befriend_ongoing.3009.desc:0 "[ROOT.Char.Custom2('RelationToMe', SCOPE.sC('spouse'))] ของข้าสังเกตเห็นความพยายามของข้าที่จะสร้างความประทับใจให้ [target.GetTitledFirstName] และตอนนี้ [spouse.GetSheHe] ก็มาหาข้าพร้อมข้อเสนอแนะ\n\n"ข้าเชื่อว่าคำพูดของข้ามีน้ำหนักมากกับ [spouse.Custom2('RelationToMe', SCOPE.sC('target'))] ของข้า ข้าสามารถบอกให้ [target.GetHerHim] รู้ได้ว่าข้าคิดว่าท่านยอดเยี่ยมเพียงใด""
 befriend_ongoing.3009.a:0 "อา อย่าเก็บงำสิ่งใดไว้เลย ที่รัก"
 befriend_ongoing.3009.a.success:0 "คำพูดของ [spouse.GetFirstNamePossessiveNoTooltip] โน้มน้าว [target.GetFirstNameNoTooltip]"
 befriend_ongoing.3009.a.failure:0 "[target.GetFirstNameNoTooltip] ยังคงไม่ประทับใจ"
 befriend_ongoing.3009.b:0 "ไม่ ข้าจะจัดการเรื่องนี้เอง"
 befriend_ongoing.3009.b.tt:0 "ข้าไม่สามารถพึ่งพาผู้อื่นในการผูกมิตรให้ข้าได้"
 
 befriend_ongoing.3010.t:0 "คำพูดดีๆ"
 befriend_ongoing.3010.desc:0 "[ROOT.Char.Custom2('RelationToMe', SCOPE.sC('spouse'))] ของข้าเล่าเรื่อง [spouse.Custom2('RelationToMe', SCOPE.sC('owner'))] ของ [spouse.GetHerHis] ให้ข้าฟังมากมายช่วงนี้\n\nข้าต้องยอมรับว่า [spouse.GetSheHe] ทำให้ [owner.GetTitledFirstName] ฟังดูเหมือนคนที่ควรค่าแก่ความเคารพของข้า"
 befriend_ongoing.3010.a:0 "บางทีข้าควรจะทำความรู้จัก [owner.GetHerHim] ให้ดีขึ้น"

 befriend_ongoing.3011.desc:0 ""[target.GetTitledFirstName] ดูเหมือนจะสนใจที่จะทำความรู้จักท่านมากขึ้นแล้วในตอนนี้" [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('spouse'))] ของข้าบอกข้า ดูเหมือนว่าแผนของ [spouse.GetHerHis] จะได้ผลอย่างสมบูรณ์แบบ!"
 befriend_ongoing.3011.a:0 "ข้าพึ่งพาท่านได้เสมอ [spouse.GetFirstNameNoTooltip]"

 befriend_ongoing.3012.desc:0 ""ข้าเสียใจที่ต้องบอกว่าแม้ข้าจะพยายามอย่างเต็มที่ [spouse.Custom2('RelationToMe', SCOPE.sC('target'))] ของข้าก็ยังคงไม่ประทับใจในตัวท่าน" [spouse.GetTitledFirstName] บอกข้า ดูเหมือนว่าแผนของ [spouse.GetHerHis] จะไม่ดีเท่าที่ควร"
 befriend_ongoing.3012.a:0 "ทำไมข้าถึงต้องพึ่งพาผู้อื่นอยู่เรื่อย"

 befriend_ongoing.3014.t:0 "ชื่อเสียงที่ไม่น่าพอใจ"
 befriend_ongoing.3014.desc:0 "ข้าพบว่า [owner.GetTitledFirstName] เป็นมิตรกับข้าผิดปกติในช่วงนี้ อย่างไรก็ตาม เมื่อข้าบอก [owner.Custom2('RelationToMe', SCOPE.sC('spouse'))] ของ [owner.GetHerHis] ซึ่งก็คือ [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('spouse'))] ของข้า [spouse.GetFirstName] [spouse.GetSheHe] ก็หัวเราะเยาะ\n\n"[owner.GetFirstNameNoTooltip] ไม่คู่ควรกับมิตรภาพของท่าน ให้ข้าบอกท่านว่า [owner.GetSheHe] เป็นคนอย่างไรจริงๆ...""
 befriend_ongoing.3014.a:0 "ใครจะรู้ดีไปกว่านี้?"

 befriend_ongoing.3015.t:0 "ผูกมิตร: การใส่ร้าย!"
 befriend_ongoing.3015.desc:0 "[target.GetTitledFirstName] เย็นชากับข้าเล็กน้อย แม้ว่าข้าจะพยายามอย่างเต็มที่ ดูเหมือนว่า [target.GetSheHe] จะได้ยินข่าวลือที่ไม่น่าพอใจเกี่ยวกับข้า และที่น่าตกใจคือ ข่าวลือนั้นมาจาก [target.Custom2('RelationToMe', SCOPE.sC('spouse'))] ของ [target.GetHerHis] ซึ่งก็คือ [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('spouse'))] ของข้าเอง!\n\n[spouse.GetFirstName] ดูไม่กังวล "ข้าเพียงแค่บอกความจริงกับ [target.GetHerHim] #EMP ที่รัก#!""
 befriend_ongoing.3015.a:0 "ท่านทำ เช่นนี้ได้อย่างไร?"

 befriend_ongoing.4000.t:0 "ผูกมิตร: เราผู้รู้สงคราม"
 befriend_ongoing.4000.desc:0 "ข้ากำลังพยายามผูกมิตรกับ [target.GetTitledFirstName] และข้ารู้ว่า [target.GetSheHe] เป็นผู้ศึกษาเรื่องการทหารอย่างทุ่มเท เช่นเดียวกับข้า แน่นอนว่าเราคงมีเรื่องให้พูดคุยกันมากมาย"
 befriend_ongoing.4000.a:0 "ข้าจะเข้าหา [target.GetHerHim]"
 befriend_ongoing.4000.a.tt:0 "#F ความสนใจร่วมกันของเราอาจทำให้เราใกล้ชิดกันมากขึ้น#!"
 befriend_ongoing.4000.b: "ข้าจะหาวิธีใช้ประโยชน์จากมัน"
 
 befriend_ongoing.4002.t:0 "เราผู้รู้สงคราม"
 befriend_ongoing.4002.desc:0 "[owner.GetTitledFirstName] เข้ามาหาข้า กล่าวถึงความสนใจร่วมกันของเราในเรื่องการทหารและต้องการแลกเปลี่ยนความคิดเห็น [owner.GetSheHe|U] ดูเหมือนจะมีความรู้กว้างขวางในทุกหัวข้อที่เกี่ยวกับกลยุทธ์และยุทธวิธี"
 befriend_ongoing.4002.a:0 "ในที่สุด ก็มีบทสนทนาที่น่าสนใจ!"
 befriend_ongoing.4002.b:0 "[owner.GetTitledFirstNameNoTooltip]? ข้าไม่คิด เช่นนั้น"

 befriend_ongoing.4004.a.desc:0 "[target.GetTitledFirstName] และข้าใช้เวลาพอสมควรในการหารือเกี่ยวกับการล้อมเมือง การโอบล้อม การปล้นเสบียง การใช้พลธนู และการวางกำลังอาวุธล้อมเมืองอย่างเหมาะสม เราหัวเราะคิกคักกับผู้ที่ไม่รู้อิโหน่อิเหน่ที่ส่ายหัวเมื่อได้ยินเราคุยกัน"
 befriend_ongoing.4004.b.desc:0 "[target.GetTitledFirstName] ตอบอย่างเย็นชาว่า [target.GetSheHe] ไม่ได้สนใจเรื่องการทหารจริงๆ แต่ข้ารู้ว่านั่นไม่เป็นความจริง"
 befriend_ongoing.4004.a:0 "สงครามคือศิลปะอันสูงส่งที่สุดอย่างแท้จริง"
 befriend_ongoing.4004.b:0 "น่าผิดหวัง"

 befriend_ongoing.4010.t:0 "ผูกมิตร: สุริยันคู่"
 befriend_ongoing.4010.desc:1 "เมื่อข้าถามผู้คนเกี่ยวกับ [target.GetTitledFirstName] พวกเขาพูดถึงปฏิภาณไหวพริบและเสน่ห์ของ [target.GetHerHis] และความง่ายดายตามธรรมชาติที่ [target.GetSheHe] โดดเด่นในทุกงานสังคม ดูเหมือนว่าเราจะมีบางอย่างที่เหมือนกัน"
 befriend_ongoing.4010.a:0 "สุริยันสองดวงรวมกันจะส่องสว่างเป็นสามเท่า!"
 
 befriend_ongoing.4012.t:0 "สุริยันคู่"
 befriend_ongoing.4012.desc:0 "[owner.GetTitledFirstName] กำลังส่งสัญญาณที่ชัดเจนว่า [owner.GetSheHe] ต้องการผูกมิตรกับข้า [owner.GetSheHe|U] ดูเหมือนจะเป็นนักสังคมสงเคราะห์โดยธรรมชาติ และกำลังบอกเป็นนัยว่าความสามารถร่วมกันของเราในด้านนี้ควรจะนำพาเรามาพบกันโดยธรรมชาติ"
 befriend_ongoing.4012.a:0 "และ [owner.GetSheHe] ก็พูดถูก!"
 befriend_ongoing.4012.b:0 "[owner.GetSheHe|U] ไม่ได้น่าสนใจอย่างที่ [owner.GetSheHe] คิดจริงๆ"

 befriend_ongoing.4014.a.desc:0 "ตามคำเชิญของข้า [target.GetTitledFirstName] และข้าได้พบกันในงานสังคม เรามีช่วงเวลาที่ดี และทุกคนก็ เช่นกัน เป็นเรื่องน่ายินดีที่ได้เห็นว่างานทั้งหมดเริ่มหมุนรอบตัวเราสองคนโดยธรรมชาติหลังจากผ่านไปเพียงไม่กี่นาที"
 befriend_ongoing.4014.b.desc:0 "[target.GetTitledFirstName] ใช้ทักษะทางสังคมอันยอดเยี่ยมของ [target.GetHerHis] อย่างมีประสิทธิภาพในการสร้างคำตอบที่โหดร้ายและเมินเฉยต่อคำเชิญของข้า ซึ่งส่งผ่านคำบอกใบ้และเสียงกระซิบจากคนรู้จักร่วมกัน"
 befriend_ongoing.4014.a:0 "เหมือนแมลงวันตอมหม้อน้ำผึ้งสองใบ!"
 befriend_ongoing.4014.b:0 "ข้าประทับใจพอๆ กับที่ข้ารู้สึกขุ่นเคือง"

 befriend_ongoing.4020.t:0 "ผูกมิตร: ไม่มีอะไรจะหารือ"
 befriend_ongoing.4020.desc:0 "ข้าตระหนักว่า [target.GetTitledFirstName] มีนิสัยคล้ายกับข้ามาก ในแง่ที่ว่า [target.GetSheHe] เข้าใจและเห็นคุณค่าของความสำคัญในการรักษาตัวเลขให้ถูกต้อง"
 befriend_ongoing.4020.a:0 "[target.GetSheHe] รู้จักเลขศูนย์หรือไม่? ข้าต้องหาคำตอบ!"
 
 befriend_ongoing.4022.t:0 "ไม่มีอะไรจะหารือ"
 befriend_ongoing.4022.desc:1 "[owner.Custom2('MyCharacterIntroductionNoComma', ROOT.Char)|U] ได้เข้ามาหาข้า ต้องการหารือเกี่ยวกับความสนใจร่วมกันของเราในด้านการบริหารและตัวเลข เลขศูนย์เป็นประเด็นเฉพาะที่ [owner.GetSheHe] ต้องการหารือ"
 befriend_ongoing.4022.a:0 "แน่นอน! นี่จะต้องให้ความกระจ่างอย่างยิ่ง!"
 befriend_ongoing.4022.b:0 "ตัวเลขนั้นอธิบายระดับความสนใจของข้าได้อย่างเพียงพอ"

 befriend_ongoing.4024.a.desc:0 "[target.GetTitledFirstName] และข้าพูดคุยกันยืดยาวเกี่ยวกับเลขศูนย์ ความสำคัญ และความเป็นไปได้ในทางคณิตศาสตร์และการบริหาร ข้ายินดีที่ได้พบคนที่มองตัวเลขในแง่บวกอย่างไม่มีข้อกังขาและเข้าใจคุณค่าที่แท้จริงของมัน"
 befriend_ongoing.4024.b.desc:0 "[target.GetTitledFirstName] ตอบเพียงว่าเลขศูนย์สอดคล้องกับระดับความสนใจของ [target.GetHerHis] ในการหารือเรื่องนี้กับข้ามากที่สุด"
 befriend_ongoing.4024.a:0 "บางครั้งการพูดคุยเรื่องไม่มีอะไรก็ดีเหมือนกัน"
 befriend_ongoing.4024.b:0 "แต่ความผิดหวังของข้านั้นไม่มีที่สิ้นสุด"

 befriend_ongoing.4030.t:0 "ผูกมิตร: ระบำของนักวางแผน"
 befriend_ongoing.4030.desc:0 "มีคนพูดถึง [target.GetTitledFirstName] ว่า [target.GetSheHe] ดูเหมือนจะเชี่ยวชาญในการหลอกลวงและการชักจูงเป็นอย่างดี บางทีข้าควรจะเข้าหา [target.GetHerHim] ในการสนทนาและดูว่ามันเป็นประเด็นที่เราสามารถสร้างความผูกพันได้หรือไม่"
 befriend_ongoing.4030.a:0 "ข้าจะทำ เช่นนั้น โดยอ้อมและด้วยเล่ห์เหลี่ยม"
 
 befriend_ongoing.4032.t:0 "ระบำของนักวางแผน"
 befriend_ongoing.4032.desc:1 "[owner.Custom2('MyCharacterIntroductionNoComma', ROOT.Char)|U] ได้บอกใบ้โดยอ้อมว่า [owner.GetSheHe] ต้องการผูกมิตรกับข้า เห็นได้ชัดว่าเป็นการทำในรูปแบบของเกมหรือระบำแห่งเล่ห์เหลี่ยมที่ข้าได้รับเชิญให้ตอบสนองโดยอ้อม"
 befriend_ongoing.4032.a:0 "ข้าจะให้คำตอบในเชิงบวกแก่ [owner.GetFirstNameNoTooltip]"
 befriend_ongoing.4032.b:0 "[owner.GetSheHe|U] เป็นคนโง่ และ [owner.GetSheHe] จะต้องรู้ตัว"

 befriend_ongoing.4034.a.desc:0 "[target.GetTitledFirstName] ตอบสนองต่อสัญญาณอันแยบยลของข้าในเชิงบวก และข้าเชื่อว่าสิ่งนี้ ทำให้เราใกล้ชิดกันมากขึ้นกว่าเดิม เป็นที่พิสูจน์แล้วว่าเรามีบางอย่างที่เหมือนกัน"
 befriend_ongoing.4034.b.desc:0 "[target.GetTitledFirstName] ตอบสนองต่อสัญญาณมิตรภาพของข้าในลักษณะที่ดูถูกเหยียดหยามที่สุด แม้จะแยบยลและอ้อมค้อมก็ตาม ข้าไม่สามารถตอบสนองได้เลยโดยไม่ ทำให้ตัวเองดูเหมือนคนโง่"
 befriend_ongoing.4034.a:0 "ใช้แผนการเพื่อผูกมิตรกับนักวางแผน"
 befriend_ongoing.4034.b:0 "นี่ไม่ใช่สิ่งที่ข้าคาดหวัง"

 befriend_ongoing.4040.t:0 "ผูกมิตร: ปัญญาชนผู้ยิ่งใหญ่"
 befriend_ongoing.4040.desc:0 "[target.GetTitledFirstName] ดูเหมือนจะเป็นนักปราชญ์ที่แท้จริง เช่นเดียวกับข้า แน่นอนว่ามีหัวข้อความรู้มากมายที่เราสามารถสนทนากันได้ ข้าควรจะเข้าหา [target.GetHerHim]"
 befriend_ongoing.4040.a:0 "มาดูกันว่าผลจะเป็นอย่างไร"

 befriend_ongoing.4042.t:0 "ปัญญาชนผู้ยิ่งใหญ่"
 befriend_ongoing.4042.desc:1 "[owner.Custom2('MyCharacterIntroductionNoComma', ROOT.Char)] ได้เข้ามาหาข้า บอกเป็นนัยว่า [owner.GetSheHe] ต้องการมีส่วนร่วมในการสนทนาเชิงวิชาการในหัวข้อที่ข้าเลือก [owner.GetSheHe|U] กำลังพยายามผูกมิตรกับข้าอย่างชัดเจน"
 befriend_ongoing.4042.a:0 "ใช่ ให้ปัญญาชนผู้ยิ่งใหญ่สองคนมาพบกัน!"
 befriend_ongoing.4042.b:0 "[owner.GetSheHe] จะมีอะไรน่าสนใจที่จะพูดได้บ้าง?"

 befriend_ongoing.4044.a.desc:0 "[target.GetTitledFirstName] และข้าได้สนทนากันยืดยาวเกี่ยวกับธรรมชาติของความรู้และเรื่องปรัชญาอื่นๆ ข้ารู้สึกว่าจิตใจของเราได้สัมผัสกันและเราใกล้ชิดกับการเป็นเพื่อนกันมากขึ้น"
 befriend_ongoing.4044.b.desc:0 "[target.GetTitledFirstName] ทำให้ชัดเจนว่า [target.GetSheHe] ไม่สนใจที่จะหารือเรื่องความรู้กับข้า มีน้ำเสียงเมินเฉยอย่างชัดเจนในคำตอบของ [target.GetHerHis]"
 befriend_ongoing.4044.a:0 "ปัญญาชนผู้ยิ่งใหญ่ย่อมคิดเหมือนกันอยู่แล้ว"
 befriend_ongoing.4044.b:0 "น่าผิดหวัง"

 befriend_ongoing.4050.t:0 "ผูกมิตร: กล่องเชื้อไฟ"
 befriend_ongoing.4050.desc:0 "มีข่าวลือว่า [target.GetTitledFirstName] เป็นผู้เชี่ยวชาญในการปลุกไฟแห่งความปิติยินดีในความรักในผู้อื่น เช่นเดียวกับข้า ดูเหมือนว่าเราควรจะพบกันและแลกเปลี่ยนความคิดเห็น"
 befriend_ongoing.4050.a:0 "[target.GetSheHe] เก็บรายชื่อผู้ที่ [target.GetHerHis] พิชิตไว้หรือไม่นะ ข้าสงสัย?"
 
 befriend_ongoing.4052.t:0 "กล่องเชื้อไฟ"
 befriend_ongoing.4052.desc:1 "[owner.Custom2('MyCharacterIntroductionNoComma', ROOT.Char)|U] ได้เข้ามาหาข้า อ้างถึงความสนใจร่วมกันของเราในการยั่วยวนและการผจญภัยในความรัก [owner.GetSheHe|U] ต้องการที่จะมาพบกันเพื่อเปรียบเทียบข้อสังเกตและประสบการณ์"
 befriend_ongoing.4052.a.wine:0 "ใช่ ให้เราแบ่งปันเรื่องราวรสจัดจ้านพร้อมกับไวน์สักถ้วย!"
 befriend_ongoing.4052.a.tee:0 "ใช่ ให้เราแบ่งปันเรื่องราวรสจัดจ้าน!"
 befriend_ongoing.4052.b:0 "[owner.GetSheHe|U] คิดจริงๆ หรือว่า [owner.GetSheHe] สามารถเปรียบเทียบ [owner.GetHerselfHimself] กับข้าได้? หึ!"

 befriend_ongoing.4054.a.desc:0 "[target.GetTitledFirstName] และข้าใช้เวลาหลายชั่วโมงพูดคุยและเปรียบเทียบการพิชิตของเรา เรื่องราวที่แปลกและซับซ้อน ทำให้เป็นเรื่องเล่าที่ดีกว่าเรื่องเล็กน้อย แม้ว่าอย่างหลังจะมีจำนวนมากกว่าก็ตาม"
 befriend_ongoing.4054.b.desc:0 "[target.GetTitledFirstName] ไม่ต้องการพบและแลกเปลี่ยนเรื่องราวการพิชิตในความรัก [target.GetSheHe|U] กล่าวว่าไม่มีทางที่ข้าจะเปรียบเทียบตัวเองกับ [target.GetHerHim] ได้"
 befriend_ongoing.4054.a:0 "เราพบว่าเราทั้งคู่เลิกนับไปนานแล้ว"
 befriend_ongoing.4054.b:0 "หึ! ความอิจฉาเป็นสัตว์ร้าย!"

 befriend_ongoing.4060.t:0 "ผูกมิตร: คมดาบที่ทัดเทียม"
 befriend_ongoing.4060.desc:0 "ผู้คนพูดถึงทักษะอันยอดเยี่ยมที่ [target.GetTitledFirstName] แสดงออกเมื่อถือดาบ ว่ากันว่ามีเพียงไม่กี่คนที่สามารถยืนหยัดได้นานกว่าสองสามวินาทีภายใต้การโจมตีของ [target.GetHerHis] เมื่อชักดาบออกมาแล้ว"
 befriend_ongoing.4060.a:0 "เราต้องพบกันและประลอง!"
 
 befriend_ongoing.4062.t:0 "คมดาบที่ทัดเทียม"
 befriend_ongoing.4062.desc:1 "[owner.Custom2('MyCharacterIntroductionNoComma', ROOT.Char)|U] ผู้ศรัทธาในคมดาบ เช่นเดียวกับข้า ได้เข้ามาหาข้า ต้องการที่จะประลองฝีมือฉันมิตรและอาจจะสนทนาในหัวข้อโปรดของเรา"
 befriend_ongoing.4062.a:0 "ข้อเสนอที่ยอดเยี่ยม!"
 befriend_ongoing.4062.b:0 "ไม่ [owner.GetSheHe] ไม่คู่ควรกับเวลาของข้า"

 befriend_ongoing.4064.a.desc:0 "[target.GetTitledFirstName] และข้าพบกันเพื่อประลองฝีมือ ดาบอยู่ในมือ หลังจากใช้เวลาสองชั่วโมงที่ดีในการร่ายรำอันรวดเร็วของการแทงและปัดป้อง เราใช้เวลาอีกสามชั่วโมงในการหารือเกี่ยวกับเทคนิคและยุทธวิธี"
 befriend_ongoing.4064.b.desc:0 "[target.GetTitledFirstName] ทำให้ชัดเจนมาก และอย่างไม่สุภาพ ว่า [target.GetSheHe] ไม่สนใจที่จะพบข้าเพื่อประลองฝีมือ"
 befriend_ongoing.4064.a:0 "มีน้อยคนนักที่จะเข้าใจความงามภายในของคมดาบ"
 befriend_ongoing.4064.b:0 "คนขี้ขลาดจึงพูด เช่นนี้"

 befriend_ongoing.4070.t:0 "ผูกมิตร: เรื่องเล่าจากพงไพร"
 befriend_ongoing.4070.desc:0 "[target.GetTitledFirstName] เป็นนักล่าที่ทุ่มเท เช่นเดียวกับข้า ข้ามั่นใจว่าเราคงมีเรื่องให้พูดคุยกันมากมาย และมีประสบการณ์มากมายที่จะสร้างความผูกพัน"
 befriend_ongoing.4070.a:0 "เราควรพบกันและเปรียบเทียบการล่า!"
 
 befriend_ongoing.4072.t:0 "เรื่องเล่าจากพงไพร"
 befriend_ongoing.4072.desc:1 "[owner.Custom2('MyCharacterIntroductionNoComma', ROOT.Char)|U] ได้เข้ามาหาข้า ต้องการพบและหารือเกี่ยวกับประสบการณ์ของเราในฐานะนักล่า เป็นโอกาสที่จะแลกเปลี่ยนเรื่องเล่าเกินจริงจากพงไพร"
 befriend_ongoing.4072.a:0 "การล่าที่ยากที่สุดของ [owner.GetHerHis] คืออะไรนะ ข้าสงสัย?"
 befriend_ongoing.4072.b:0 "ข้าไม่สนใจนักจับกระต่ายคนนั้น"

 befriend_ongoing.4074.a.desc:0 "[target.GetTitledFirstName] และข้าใช้เวลาทั้งเย็นพูดคุย แลกเปลี่ยนเรื่องราว และเปรียบเทียบประสบการณ์จากการล่าต่างๆ"
 befriend_ongoing.4074.b.desc:0 "[target.GetTitledFirstName] ตอบสนองต่อการเข้าหาของข้าด้วยความดูถูกเท่านั้น เรียกข้าว่านักจับกระต่าย"
 befriend_ongoing.4074.a:0 "ข้ามั่นใจว่า [target.GetSheHe] พูดเกินจริงในบางกรณี"
 befriend_ongoing.4074.b:0 "เช่นนั้น [target.GetSheHe] ก็เป็นกระต่ายเสียเอง"

 befriend_ongoing.4080.t:0 "ผูกมิตร: ค่ำคืนอันเมามัน"
 befriend_ongoing.4080.desc:0 "[target.GetTitledFirstName] เป็นนักเมาที่รู้จักกันดี เช่นเดียวกับข้า ข้าคิดว่าเราคงจะมีช่วงเวลาที่ดีมากหากเราจะจัดงานรื่นเริงเล็กๆ น้อยๆ"
 befriend_ongoing.4080.a:0 "ต้องทำ!"
 
 befriend_ongoing.4082.t:0 "ค่ำคืนอันเมามัน"
 befriend_ongoing.4082.desc:1 "[owner.Custom2('MyCharacterIntroductionNoComma', ROOT.Char)|U] ได้ถามข้าว่าข้าต้องการที่จะมาพบกันเพื่อดื่มกินและรื่นเริงเล็กน้อยหรือไม่ [owner.GetSheHe|U] เห็นได้ชัดว่าเป็น [owner.GetHerselfHimself] นักเมาที่มีชื่อเสียงพอสมควร"
 befriend_ongoing.4082.a:0 "นี่จะต้องสนุกแน่"
 befriend_ongoing.4082.b:0 "[owner.GetFirstNameNoTooltip]? ข้าขอดื่มคนเดียวดีกว่า"

 befriend_ongoing.4084.a.desc:0 "[target.GetTitledFirstName] และข้าใช้เวลาทั้งวันทั้งคืน (หรือสองคืน?) ในการดื่มกิน ข้าจำได้อย่างชัดเจนเพียงว่ามันเริ่มต้นที่ไหนและสิ้นสุดที่ไหน แต่ขอสาบานต่อ [ROOT.Char.GetFaith.random_GoodGodNames] เรามีช่วงเวลาที่ดี!"
 befriend_ongoing.4084.b.desc:0 "[target.GetTitledFirstName] ได้ประกาศว่า [target.GetSheHe] ขอดื่มคนเดียวดีกว่าใช้เวลากับข้า"
 befriend_ongoing.4084.a:0 "ไม่ใช่วิธีที่ไม่ดีในการใช้... เวลา"
 befriend_ongoing.4084.b:0 "ดูเหมือนว่าข้ารอดมาได้อย่างหวุดหวิดสินะ"

 befriend_ongoing.4090.t:0 "ผูกมิตร: ซิมโฟนีแห่งความเจ็บปวด"
 befriend_ongoing.4090.desc:0 "ข้าได้ทราบมาว่า [target.GetTitledFirstName] เป็นผู้ศึกษาศิลปะอันละเอียดอ่อนของความเจ็บปวดและการบีบบังคับอย่างทุ่มเท เช่นเดียวกับข้า คงจะน่าสนใจที่จะได้พบกับ [target.GetHerHim] และหารือเกี่ยวกับวิธีการและการประยุกต์ใช้"
 befriend_ongoing.4090.a:0 "เราจะต้องใช้เครื่องมือและผู้ถูกทดลอง แน่นอน"
 
 befriend_ongoing.4092.t:0 "ซิมโฟนีแห่งความเจ็บปวด"
 befriend_ongoing.4092.desc:0 "[owner.GetTitledFirstName] ได้ประกาศว่า [owner.GetSheHe] ต้องการพบข้าเพื่อหารือเกี่ยวกับความสนใจร่วมกันของเราในศิลปะอันละเอียดอ่อนของความเจ็บปวดและการบีบบังคับ"
 befriend_ongoing.4092.a:0 "ความคิดที่ยอดเยี่ยม ข้าจะนำเครื่องมือของข้ามาด้วย"
 befriend_ongoing.4092.b:0 "ข้าไม่มีอะไรจะพูดกับนักถอดเล็บหยาบคายคนนั้น"

 befriend_ongoing.4094.a.desc:0 "[target.GetTitledFirstName] และข้าใช้เวลาทั้งวันทั้งคืนอยู่กับอาชญากรรายย่อยที่โชคร้ายและถูกรวบรวมมาอย่างเร่งรีบ หารือและประยุกต์ใช้เทคนิคต่างๆ และวางแผนสำหรับการทดลองเพิ่มเติม"
 befriend_ongoing.4094.b.desc:0 "[target.GetTitledFirstName] ตอบรับคำเชิญของข้าเพียงโดยบอกเป็นนัยว่าวิธีการของข้าหยาบคายเกินไปและ [target.GetSheHe] ไม่มีความปรารถนาที่จะคบค้าสมาคมกับข้า"
 befriend_ongoing.4094.a:0 "นี่เป็นทั้งแรงบันดาลใจและให้ความกระจ่าง"
 befriend_ongoing.4094.b:0 "ข้ายินดีที่จะแสดงให้ [target.GetHerHim] เห็นว่าหยาบคายแค่ไหน..."

 befriend_ongoing.4100.t:0 "ผูกมิตร: ศัตรูของศัตรูข้า"
 befriend_ongoing.4100.desc:0 "สงครามนำมา ซึ่งความน่าสะพรึงกลัว เช่นเดียวกับโอกาสแห่งเกียรติยศ อีกสิ่งหนึ่งที่มันนำมาคือความผูกพันที่ก่อตัวขึ้นระหว่างผู้ที่ต่อสู้เคียงข้างกัน \n\nในความพยายามของเราในการต่อต้าน [befriend_ongoing_4100_enemy.GetTitledFirstName], ดูเหมือนว่า [befriend_ongoing_4100_text_scope.GetTitledFirstName] และข้าได้พบความสนใจร่วมกัน"
 befriend_ongoing.4100.a:0 "สงครามจะหล่อหลอมมิตรภาพ"

 befriend_ongoing.4110.t:0 "เป้าหมายร่วมกัน"
 befriend_ongoing.4110.desc:0 "การมีปฏิสัมพันธ์กับ [befriend_ongoing_4110_text_scope.GetTitledFirstName] ในฐานะสมาชิกของฝ่ายเดียวกัน ข้าพบว่าความผูกพันย่อมก่อตัวขึ้นอย่างหลีกเลี่ยงไม่ได้ระหว่างผู้ที่ทำงานเพื่อเป้าหมายระยะยาวร่วมกัน"
 befriend_ongoing.4110.a:0 "ขอให้เราทุกคนเจริญรุ่งเรือง"

 befriend_ongoing.4300.t:0 "ผูกมิตร: ภาพตระการตาบนตะแลงแกง"
 befriend_ongoing.4300.a:0 "ความยุติธรรมจะบังเกิด ความยุติธรรมและความหวาดกลัว"
 befriend_ongoing.4300.b:0 "ต้องมีหนทางอื่น"
 befriend_ongoing.4300.desc:0 "ข้าได้ทราบมาว่า [target.GetTitledFirstName] เป็นผู้ปกครองที่ความยุติธรรมของเขาเป็นที่หวาดกลัวของผู้อื่น เช่นเดียวกับข้า ข้าควรเชิญ [target.GetHerHim] มานั่งข้างข้าในการประหารชีวิตในที่สาธารณะครั้งต่อไป"
 befriend_ongoing.4300.a.tt:0 "#F ส่งจดหมายถึง [target.GetHerHim]#!"

 befriend_ongoing.4302.t:0 "คำเชิญร่วมชมการประหารชีวิต"
 befriend_ongoing.4302.desc:0 "[owner.GetTitledFirstName] ได้เชิญข้าให้นั่งในที่นั่งอันทรงเกียรติข้าง [owner.GetHerHis] สำหรับการประหารชีวิตในที่สาธารณะครั้งต่อไป"
 befriend_ongoing.4302.c:0 "ท่านคิดว่าข้าโง่หรือ? ข้าจะไม่ตกอยู่ในเงื้อมมือของท่านง่ายๆ หรอก!"
 befriend_ongoing.4302.a:0 "ความคิดที่ยอดเยี่ยม ข้าจะรู้สึกเป็นเกียรติที่ได้สังเกตว่าท่านตัดสินความยุติธรรมอย่างไร"
 befriend_ongoing.4302.b:0 "ข้ามีเรื่องสำคัญกว่าที่ต้องทำมากกว่าดูท่านจัดการกับอาชญากรรายย่อย"

 befriend_ongoing.4304.t:0 "ผูกมิตร: การแสดงอันน่าสะพรึงกลัว"
 befriend_ongoing.4304.a.desc:0 "[target.GetTitledFirstName] มาที่ราชสำนักของข้าเพื่อชมภาพตระการตาของการประหารชีวิตในที่สาธารณะและความรู้สึกยุติธรรมของข้า นี่เป็นโอกาสของข้าที่จะสร้างความประทับใจให้ [target.GetHerHim] ด้วยความรุนแรงของข้า ข้าควรประหารนักโทษคนใด?"
 befriend_ongoing.4304.b.desc:1 "[target.GetTitledFirstName] ได้ตอบรับคำเชิญของข้าว่า [target.GetSheHe] ไม่มีความปรารถนาที่จะคบค้าสมาคมกับข้าและให้ชื่อเสียงอันน่าสะพรึงกลัวของ [target.GetHerHis] มอบความชอบธรรมแก่ข้า"
 befriend_ongoing.4304.a:0 "ถึงเวลาตายแล้ว [prisoner_a.GetFirstNameNoTooltip]"
 befriend_ongoing.4304.b:0 "จุดจบของเจ้ามาถึงแล้ว [prisoner_b.GetFirstNameNoTooltip]"
 befriend_ongoing.4304.c:0 "ตัดหัว [prisoner_c.GetFirstNameNoTooltip] เสีย!"
 befriend_ongoing.4304.d:0 "ข้ารู้สึกเมตตา วันนี้ไม่มีใครตาย"
 befriend_ongoing.4304.d.tt:0 "#F [target.GetTitledFirstName] อาจมองว่าความเมตตาของข้าเป็นความอ่อนแอ#!"
 befriend_ongoing.4304.e:0 "สักวันหนึ่งคอของ [owner.GetHerHis] อาจได้สัมผัสคมดาบของข้า"
 befriend_ongoing.4304.e.tt:0 "#F [owner.GetTitledFirstName] ไม่ประสงค์จะมาเยือนราชสำนักของข้า#!"
 befriend_ongoing.4304.f:0 "ฆ่าพวกมันให้หมด!"

 befriend_ongoing.5001.t:0 "ผูกมิตร: ผู้มองโลกในแง่ร้ายและผู้คลั่งศาสนา"
 befriend_ongoing.5001.desc:0 "ความพยายามของข้าที่จะลดความตึงเครียดระหว่าง [target.GetTitledFirstName] กับตัวข้าเองถูกขัดขวางโดยข้อเท็จจริงที่ว่า [target.GetSheHe] ยังคงประณามการขาดความศรัทธาของข้า ความพยายามของ [target.GetHerHis|U] ที่จะโน้มน้าวข้าแทบไม่ได้ช่วยอะไรกับความเชื่อมั่นของข้าเลย..."
 befriend_ongoing.5001.a:0 "ข้าจะไปเยือน [ROOT.Char.GetFaith.HouseOfWorship] หากมัน ทำให้ [target.GetFirstNameNoTooltip] พอใจ"
 befriend_ongoing.5001.b:0 "เราสามารถหาเรื่องอื่นที่จะเห็นพ้องกันได้"
 
 befriend_ongoing.5002.t:0 "ผูกมิตร: เรื่องของความไว้วางใจ"
 befriend_ongoing.5002.desc:0 "มันจะง่ายกว่ามากที่จะ ทำให้ [target.GetTitledFirstName] ชอบข้ามากขึ้นหาก [target.GetSheHe] เพียงแค่เชื่อในความจริงใจของความพยายามของข้า! ข้าบอกได้เลยว่า [target.GetSheHe] สงสัยในความจริงใจของข้าเมื่อ [target.GetSheHe] ให้คำตอบคลุมเครือและถอนตัวจากการสนทนา..."
 befriend_ongoing.5002.a:0 "ข้าจะยืนกราน แต่จะไม่โกหกว่าข้าเป็นใคร"
 befriend_ongoing.5002.b:0 "น่าเสียดายที่คำโกหกน่าเชื่อถือกว่าความจริง"
 
 befriend_ongoing.5003.t:0 "ผูกมิตร: เมฆดำในวันฟ้าใส"
 befriend_ongoing.5003.desc:0 "สิ่งที่ข้าต้องการคือ ทำให้ [target.GetTitledFirstName] รู้สึกถึงความสุขของการอยู่ท่ามกลางผู้คน! แต่ยิ่งข้าพยายามมากเท่าไหร่ [target.GetSheHe] ก็ยิ่งถอยห่างจากข้ามากขึ้นเท่านั้น ตอนนี้ [target.GetSheHe] แทบจะไม่ออกจากห้องของ [target.GetHerHis] เลย..."
 befriend_ongoing.5003.c:0 "ข้าจะรับฟังและพยายามทำความเข้าใจ"
 befriend_ongoing.5003.a:0 "[target.GetSheHe|U] ต้องเข้มแข็ง!"
 befriend_ongoing.5003.b:0 "ถ้าพื้นที่คือสิ่งที่ [target.GetSheHe] ต้องการ ข้าจะให้มันแก่ [target.GetHerHim]"
 
 befriend_ongoing.5004.t:0 "ผูกมิตร: ไม่ถูกปาก [target.GetHerHis|U]"
 befriend_ongoing.5004.desc:0 "ไม่มีอะไร ทำให้ข้าเบิกบานใจได้เท่ากับ [ROOT.Char.Custom('FavoriteTreat')] ที่น่ารับประทาน ดังนั้นข้าจึงส่งส่วนหนึ่งที่ปรุงโดยพ่อครัวส่วนตัวของข้าไปให้ [target.GetTitledFirstName] เพื่อเป็นหลักฐานแสดงเจตนาดีของข้า \n\nอย่างไรก็ตาม ท่าทีดังกล่าวกลับกลายเป็นหายนะ เมื่อ [target.GetSheHe] ให้คนรับใช้โยนมันทิ้งไปโดยไม่แม้ แต่จะชิม..."
 befriend_ongoing.5004.a:0 "ข้าจะขอโทษสำหรับความเกินพอดีของข้า"
 befriend_ongoing.5004.b:0 "ช่างเป็น[target.Custom2('InsultNoun', ROOT.Char)]ที่อกตัญญูเสียจริง!"
 
 befriend_ongoing.5005.t:0 "ผูกมิตร: การเรียกร้องให้ลงมือทำ"
 befriend_ongoing.5005.desc:0 "ข้ากำลังพยายาม ทำให้ [target.GetTitledFirstName] เข้าใจข้าดีขึ้น แต่ผลลัพธ์ทั้งหมดคือข้าเข้าใจ [target.GetHerHim] น้อยลงเรื่อยๆ แรงผลักดันของ [target.GetHerHis] ความทะเยอทะยานของ [target.GetHerHis] อยู่ที่ไหน? ดูเหมือนว่า [target.GetSheHe] จะไม่สนใจเลยหากไม่มีอะไรเปลี่ยนแปลง"
 befriend_ongoing.5005.a:0 "ข้าอาจไม่เห็นด้วย แต่ข้ายอมรับได้"
 befriend_ongoing.5005.b:0 "คนแบบนั้นควรค่าแก่การรู้จักหรือไม่?"

 befriend_ongoing.5006.t:0 "ผูกมิตร: เชื่อมช่องว่าง"
 befriend_ongoing.5006.desc:0 "ข้าค้นหาแล้วค้นหาอีก แต่ [target.GetTitledFirstName] และข้าดูเหมือนจะไม่มีอะไรเหมือนกันเลย\n\nหากไม่มีจุดร่วมใดๆ ข้าจะเริ่มสร้างมิตรภาพได้อย่างไร?"
 befriend_ongoing.5006.a:0 "ด้วยความพยายาม ข้าจะเข้าใจ [target.GetHerHim]"
 befriend_ongoing.5006.b:0 "ในที่สุดก็ต้องมีบางอย่างเกิดขึ้นแน่"

 befriend_ongoing.5007.t:0 "ผูกมิตร: ความรู้ที่เอื้อมถึง"
 befriend_ongoing.5007.opening:0 "[target.GetTitledFirstName] และข้ามีอะไรเหมือนกันน้อยมาก ซึ่ง ทำให้ยากต่อการสื่อสารกับ [target.GetHerHim]\n\nอย่างไรก็ตาม ด้วยความพยายามบางอย่าง ข้าสามารถสอนตัวเองให้เพียงพอที่จะสนทนาได้"
 befriend_ongoing.5007.martial:0 "เกี่ยวกับกลยุทธ์และเส้นทางเสบียง"
 befriend_ongoing.5007.diplomacy:0 "ด้วยมารยาทและประเพณีในราชสำนักที่เหมาะสม"
 befriend_ongoing.5007.intrigue:0 "เกี่ยวกับอำนาจที่อยู่ในความลับ ความลับทุกประเภท"
 befriend_ongoing.5007.stewardship:0 "เกี่ยวกับความซับซ้อนของสัญญาศักดินาต่างๆ ของอาณาจักร"
 befriend_ongoing.5007.learning:0 "เกี่ยวกับธรรมชาติเชิงอภิปรัชญาของจิตวิญญาณ"
 befriend_ongoing.5007.a:0 "หัวข้อนี้สมควรได้รับการศึกษามากเท่าที่ข้าจะสามารถทำได้"
 befriend_ongoing.5007.a.success:0 "ท่านได้รับข้อมูลเชิงลึกใหม่"
 befriend_ongoing.5007.a.failure:0 "นี่เป็นแนวทางการศึกษาที่ผิด"
 befriend_ongoing.5007.b:0 "ข้าสามารถพักผ่อนแทนได้เสมอ"

 befriend_ongoing.6001.t:0 "อิสรภาพและมิตรไมตรี"

 befriend_ongoing.6002.t:0 "อิสรภาพและมิตรไมตรี"
 befriend_ongoing.6002.desc:0 "[owner.GetTitledFirstName] เป็นมิตรกับข้าผิดปกติในช่วงนี้\n\nหากการเปลี่ยนแปลงน้ำเสียงนี้บ่งบอกถึงการเปลี่ยนแปลงลักษณะนิสัย บางที [owner.GetSheHe] อาจถูกโน้มน้าวให้ปล่อย [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('prisoner'))] ของข้า [prisoner.GetTitledFirstName] จากการจองจำได้หรือไม่?"
 befriend_ongoing.6002.a:0 "แน่นอน หาก [owner.GetSheHe] ต้องการเป็นเพื่อนกับข้าจริงๆ..."
 befriend_ongoing.6002.a.tt:0 "หาก [owner.GetFirstNameNoTooltip] ยอมรับ:"
 befriend_ongoing.6002.b:0 "[prisoner.GetFirstNameNoTooltip] รอได้อีกหน่อย"
 befriend_ongoing.6002.b.tt:0 "#F [owner.GetFirstNameNoTooltip] สามารถเก็บ [prisoner.GetHerHim] ไว้ได้#!"

 befriend_ongoing.6004.desc:1 "ตีความความเป็นมิตรล่าสุดของข้าว่าเป็นสัญญาณ [target.GetTitledFirstName] ได้มาหาข้าพร้อมความกังวลเกี่ยวกับนักโทษคนหนึ่งของข้า\n\n"มันจะ ทำให้ข้าพอใจอย่างยิ่งหากท่านจะปล่อย [target.Custom2('RelationToMe', SCOPE.sC('prisoner'))] ของข้า [prisoner.GetTitledFirstName] จาก [prisoner.Custom('PrisonTypeCell')] ของ [prisoner.GetHerHis]" [target.GetSheHe] กล่าว [ROOT.Char.Custom2('QuirkPPPosOrNeg', SCOPE.sC('target'))]"
 befriend_ongoing.6004.a:0 "วิธีราคาถูกในการเอาชนะใจ [target.GetFirstNamePossessiveNoTooltip]"
 befriend_ongoing.6004.b:0 "ไม่ แต่ข้าสามารถ ทำให้ [prisoner.GetHerHim] สบายขึ้นเล็กน้อยได้"
 befriend_ongoing.6004.c:0 "ปล่อย [prisoner.GetFirstNameNoTooltip]? ไม่มีทาง!"

 befriend_ongoing.6005.desc:0 "[owner.GetTitledFirstName] ได้เสนอความเมตตาต่อ [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('prisoner'))] ของข้า! ในที่สุด [prisoner.GetTitledFirstName] ก็ปลอดภัยแล้ว"
 befriend_ongoing.6005.a:0 "ยินดีต้อนรับกลับบ้าน"

 befriend_ongoing.6006.desc:0 "แม้จะเสแสร้งทำเป็นมิตรของ [owner.GetHerHis] [owner.GetTitledFirstName] ก็ปฏิเสธที่จะปล่อยตัว [prisoner.GetFirstNameNoTooltip]"
 befriend_ongoing.6006.a:0 "ยังมีหนทางอื่น [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('prisoner'))] ของข้า"

 befriend_ongoing.6007.desc:0 "ในขณะที่ [owner.GetTitledFirstName] ใช้เวลานานเกินไปในการอธิบายอย่างเสียใจว่าทำไม [owner.GetSheHe] ไม่สามารถปล่อย [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('prisoner'))] ของข้าได้ อย่างน้อย [prisoner.GetTitledFirstName] ก็ถูกย้ายไปยังที่พักที่สะดวกสบายมากขึ้น"
 befriend_ongoing.6007.a:0 "สักวันหนึ่งท่านจะเป็นอิสระอีกครั้ง [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('prisoner'))] ของข้า"

 befriend_ongoing.6008.desc:0 "ดูเหมือนว่าการปล่อยตัวข้าจากการจองจำด้วยน้ำมือของ [owner.GetTitledFirstName] นั้นถูกจัดฉากโดย [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('target'))] ของข้า [target.GetTitledFirstName]!"
 befriend_ongoing.6008.a:0 "ข้าขอบคุณท่านไม่หมดสิ้น [target.GetFirstNameNoTooltip]"

 befriend_ongoing.6009.t:0 "ผูกมิตร: เจตนาดี"
 befriend_ongoing.6009.desc:0 "คำสัญญาแห่งความทุ่มเทจะส่งสารที่แข็งแกร่งเกี่ยวกับเจตนาดีของข้าที่มีต่อ [target.GetTitledFirstName]\n\nทุกคนชื่นชมบุญคุณอันทรงพลัง"
 befriend_ongoing.6009.a:0 "คำสัญญาจะเป็นทางการและเป็นพิธีรีตอง!"
 befriend_ongoing.6009.b:0 "ทำให้แน่ใจว่า [target.GetSheHe] จำคำสัญญาได้ทุกวัน"
 befriend_ongoing.6009.c:0 "เป็นการดีกว่าที่จะหลีกเลี่ยงสิ่งเหล่านี้"
 befriend_ongoing.6009.c.tt:0 "#F ข้าจะไม่ยอมเป็นหนี้บุญคุณใดๆ#!"

 befriend_ongoing.6010.t:0 "เจตนาดี"
 befriend_ongoing.6010.desc:0 "น่าประหลาดใจที่ [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('owner'))] ของข้า [owner.GetTitledFirstName] ได้มาหาข้า สัญญากับข้าว่าไม่ว่าข้าต้องการอะไรก็ตาม ไม่ว่า [owner.GetSheHe] จะทำอะไรได้ [owner.GetSheHe] จะจัดหาให้หากข้าขอ"
 befriend_ongoing.6010.a:0 "[owner.GetSheHe] ได้อะไรจากคำสัญญานี้?"

 befriend_ongoing.6011.desc:0 "แม้ว่า [target.GetTitledFirstName] จะเป็นหนี้บุญคุณข้าอย่างมาก แต่ก็อาจจะดีกว่าที่จะเน้นย้ำถึงมิตรภาพที่เท่าเทียมกัน\n\n[target.GetSheHe|U] ก็จะ — อย่างไม่ต้องสงสัย — รู้สึกขอบคุณอย่างยิ่งหากข้า ทำให้ชัดเจนว่าข้าไม่คาดหวังให้ตอบแทนบุญคุณ"
 befriend_ongoing.6011.a:0 "เพื่อนให้ด้วยความเต็มใจ ไม่ใช่ด้วยภาระผูกพัน"
 befriend_ongoing.6011.b:0 "บุญคุณที่พวกเขาเป็นหนี้ไม่สามารถเป็นเพียงมิตรภาพนิรันดร์ได้หรือ?"
 befriend_ongoing.6011.b.tt:0 "#F เห็นได้ชัดว่านั่นไม่ใช่วิธีที่มิตรภาพทำงาน#!"

 befriend_ongoing.6012.desc:0 "นับตั้งแต่มีการให้คำสัญญา ข้าก็กังวลว่า [owner.GetTitledFirstName] อาจจะเรียกร้องอะไรเป็นการตอบแทนบุญคุณที่ข้าเป็นหนี้ [owner.GetHerHim] อย่างไรก็ตาม ตอนนี้ [owner.GetSheHe] ได้แจ้งให้ข้าทราบว่า [owner.GetSheHe] จะถือว่าหนี้ของข้าได้รับการชำระแล้วตราบใดที่ข้าคิดถึง [owner.GetHerHim] ในแง่ดี"
 befriend_ongoing.6012.a:0 "[owner.GetSheHe] หวังจะได้อะไรจากสิ่งนี้?"

 befriend_ongoing.6013.desc:0 "ดูเหมือนจะมีความขัดแย้งไม่น้อยระหว่าง [target.GetTitledFirstName] กับข้า ซึ่งเกิดจากประเด็นเล็กน้อยที่ข้าแบล็กเมล์ [target.GetHerHim]\n\nข้าสามารถละทิ้งความพยายามของข้าได้ แน่นอน เพื่อให้ [target.GetHerHim] รู้ว่าเจตนาของข้า — ในท้ายที่สุด — มี แต่ดีเท่านั้น"
 befriend_ongoing.6013.a:0 "มิตรภาพจะมีพลังมากกว่าการบีบบังคับเสมอ"
 befriend_ongoing.6013.b:0 "ข้าไม่สามารถยอมแพ้ข้อได้เปรียบเพียงอย่างเดียวของข้าได้!"

 befriend_ongoing.6014.desc:0 "ช่างเป็นการปลดปล่อยอันยิ่งใหญ่! [owner.GetTitledFirstName] ได้สาบาน — อย่างเคร่งขรึมต่อทุกสิ่งที่ศักดิ์สิทธิ์ — ว่า [owner.GetSheHe] จะละทิ้งการแบล็กเมล์ที่ [owner.GetSheHe] มีต่อข้า\n\nข้าไม่รู้ว่าอะไรเป็นสาเหตุของสิ่งนี้ แต่รู้สึกเหมือนว่าในที่สุดข้าก็หายใจได้อีกครั้ง"
 befriend_ongoing.6014.a:0 "ขอบคุณ [ROOT.Char.GetFaith.HighGodNameAlternate]!"

 befriend_ongoing.6015.t:0 "ผูกมิตร: การเสนอความช่วยเหลือ"
 befriend_ongoing.6015.opening:0 "ความพยายามของข้าที่จะใกล้ชิดกับ [target.GetTitledFirstName] มากขึ้นนั้นพิสูจน์แล้วว่าท้าทาย ส่วนหนึ่งเป็น เพราะแรงกดดันที่ [target.GetSheHe] กำลังดิ้นรนเพื่อรับมือ\n\nบางทีมันอาจจะช่วยข้าได้มากกว่าหนึ่งทางหากข้าจะจัดหาวันให้ [target.GetHerHim] ได้อยู่กับ [target.GetHerselfHimself] ซึ่ง [target.GetSheHe] สามารถ"
 befriend_ongoing.6015.malicious:0 "ใช้เวลาในทุ่งนา หัวเราะเยาะความสกปรกและความงุ่มง่ามของชาวนา"
 befriend_ongoing.6015.benevolent:0 "แจกจ่ายเงินบริจาคเพื่อการกุศลให้กับโรงทาน — หรือขุนนางที่โชคดีน้อยกว่า"
 befriend_ongoing.6015.dominant:0 "ขี่ม้าไปกับหน่วยลาดตระเวนทางทหาร เพื่อให้แน่ใจว่าพวกเขารักษาความสงบเรียบร้อยอย่างเหมาะสม"
 befriend_ongoing.6015.submissive:0 "อุทิศ [target.GetHerselfHimself] ให้กับการสวดมนต์และการใคร่ครวญ ห่างไกลจากความต้องการของผู้อื่น"
 befriend_ongoing.6015.extroverted:0 "ใช้เวลากับข้าราชบริพารที่ไร้กังวล ห่างไกลจากห้องสภาที่น่าอึดอัดและบันทึกการบริหารที่เต็มไปด้วยฝุ่น"
 befriend_ongoing.6015.introverted:0 "ใช้เวลาห่างจากข้าราชบริพารและที่ปรึกษาที่เรียกร้องมากเกินไป ปล่อยให้มีช่วงเวลาแห่งความสงบสักครั้ง"
 befriend_ongoing.6015.emotional:1 "ทำให้จิตใจของ [target.GetHerHis] ออกจากเรื่องการปกครองโดยการไปชมละครใน [barony.Custom('BaronyTownType')] ของ [barony.GetNameNoTooltip]"
 befriend_ongoing.6015.levelheaded:0 "รักษาระยะห่างและมุมมองเพื่อประเมินลำดับความสำคัญของ [target.GetHerHis] ใหม่"
 befriend_ongoing.6015.a:0 "นี่จะต้องใช้ความพยายามมาก แต่มันจะคุ้มค่า"
 befriend_ongoing.6015.b:0 "ข้ามีปัญหาของตัวเองมากพอที่จะจัดการแล้ว"

 befriend_ongoing.6016.t:0 "การเสนอความช่วยเหลือ"
 befriend_ongoing.6016.opening:0 "น่าประหลาดใจที่ [owner.GetTitledFirstName] ได้ติดต่อกับที่ปรึกษาของข้าเพื่อจัดหาวันให้ข้าได้อยู่กับตัวเอง เพื่อลดแรงกดดันบางส่วนที่ข้าเผชิญอยู่\n\nในที่สุด ข้าก็ใช้เวลานั้นตามคำแนะนำจาก [owner.GetFirstName] [owner.GetHerselfHimself]"
 befriend_ongoing.6016.malicious:0 "ขี่ม้าท่ามกลางทุ่งนา หาความบันเทิงจากความสกปรกและความงุ่มง่ามอันน่าขบขันของชาวนา"
 befriend_ongoing.6016.benevolent:0 "แจกจ่ายเงินบริจาคตามโรงทาน และขุนนางที่โชคดีน้อยกว่า"
 befriend_ongoing.6016.dominant:0 "ขี่ม้าไปกับหน่วยลาดตระเวนทางทหาร รับผิดชอบความเป็นระเบียบเรียบร้อยของอาณาจักรของข้าโดยตรง"
 befriend_ongoing.6016.submissive:0 "อยู่กับตัวเองในการสวดมนต์และการใคร่ครวญ ห่างไกลจากความต้องการของผู้อื่นนอกจาก [ROOT.Char.GetFaith.HighGodName]"
 befriend_ongoing.6016.extroverted:0 "การอยู่ร่วมกับข้าราชบริพารที่ไร้กังวล ห่างไกลจากห้องสภาที่น่าอึดอัดและบันทึกการบริหารที่เต็มไปด้วยฝุ่น"
 befriend_ongoing.6016.introverted:0 "ห่างไกลจากข้าราชบริพารและที่ปรึกษาที่เรียกร้องมากเกินไป ปล่อยให้มีช่วงเวลาแห่งความสงบที่หาได้ยาก"
 befriend_ongoing.6016.emotional:1 "ทำให้จิตใจของข้าสนใจเรื่องอื่นนอกจากการปกครองโดยการไปชมละครใน [barony.Custom('BaronyTownType')] ของ [barony.GetNameNoTooltip]"
 befriend_ongoing.6016.levelheaded:0 "รักษาระยะห่างและมุมมองเพื่อประเมินลำดับความสำคัญของข้าใหม่"
 befriend_ongoing.6016.a:0 "ข้าต้องการสิ่งนี้"

 befriend_ongoing.6017.t:0 "ผูกมิตร: การพัฒนาที่เป็นมิตร"
 befriend_ongoing.6017.desc:1 "มีความแตกต่างมากมายระหว่าง [target.GetTitledFirstName] กับตัวข้าเอง หนึ่งในนั้นคือสภาพที่ค่อนข้างน่าเสียดายของ [county.GetNameNoTooltip]\n\nอย่างไรก็ตาม บางทีวิธีการบางอย่างที่เราใช้ใน [owner_county.GetNameNoTooltip] อาจมีประโยชน์ใน [county.GetNameNoTooltip] ด้วย เช่นกัน [target.GetFirstNameNoTooltip] ได้ ทำให้ชัดเจนว่าโครงการพัฒนาที่ดินที่ได้รับทุนสนับสนุนอย่างดีจะได้รับการชื่นชมอย่างมาก..."
 befriend_ongoing.6017.a:0 "แผนการที่ยอดเยี่ยม!"
 befriend_ongoing.6017.b:0 "แม้ว่ามิตรภาพของ [target.GetFirstNamePossessiveNoTooltip] จะมีค่าเท่ากับน้ำหนักทองคำ..."
 befriend_ongoing.6017.b.tt:0 "#F ... มันไม่ได้หนักขนาดนี้#! "

 befriend_ongoing.6018.t:0 "การพัฒนาที่เป็นมิตร"
 befriend_ongoing.6018.desc:1 "รับเอาคำบอกใบ้อันแยบยลของข้าเป็นการสนับสนุนอย่างแข็งขัน [owner.GetTitledFirstName] ได้ให้ทุนสนับสนุนไม่น้อยไปกว่าโครงการชลประทานขนาดใหญ่ใน [county.GetNameNoTooltip] ของข้า!\n\nมันอาจเป็นการก้าวล้ำขอบเขตในหลายๆ ด้าน แต่ด้วยเทคนิคที่ใช้ใน [owner_county.GetNameNoTooltip] [county.GetNameNoTooltip] อาจร่ำรวยกว่าที่เคยเป็นมา!"
 befriend_ongoing.6018.a:0 "ไม่เป็นไปตามแบบแผน แต่ข้ายินดีต้อนรับอย่างแน่นอน!"

 befriend_ongoing.6019.t:0 "ผูกมิตร: ปริศนาบทสนทนา"
 befriend_ongoing.6019.desc:0 "ข้ากำลังหารือเกี่ยวกับ [ROOT.Char.Custom('education_conversation_subject')] กับ [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('target') )] ของข้า [target.GetTitledFirstName] และ [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('opinion_target') )] ของข้า [opinion_target.GetTitledFirstName] เมื่อข้าตระหนักว่า [target.GetFirstNameNoTooltip] ไม่เข้าใจหัวข้อนั้นเลย...\n\nพยายามอย่างหนักที่จะไม่ ทำให้ [target.GetHerHim] ดูเหมือนคนโง่ ข้าตัวแข็งเมื่อ [opinion_target.GetTitledFirstNameNoTooltip] ขอให้เราคนใดคนหนึ่งอธิบายบางอย่างให้ [opinion_target.GetHerHim] ฟัง"
 befriend_ongoing.6019.a:0 "[target.GetFirstNameNoTooltip] ควรอธิบาย [target.GetSheHe] มีความเข้าใจที่เฉียบแหลม!"
 befriend_ongoing.6019.b:0 "ทีนี้ ฟังข้า..."
 befriend_ongoing.6019.c:0 "ข้าคิดว่าสิ่งนี้จะแก้ไขได้ดีที่สุดด้วยการหารือกลุ่ม!"
 
 befriend_ongoing.9001.t:0 "ผูกมิตร: การเผชิญหน้าโดยบังเอิญ"
 befriend_ongoing.9001.desc:0 "[target.GetTitledFirstName] กำลังเดินทางและจะพักสองสามคืนที่คฤหาสน์ของบารอนคนหนึ่งของข้า นี่อาจเป็นโอกาสที่ข้ารอคอย!"
 befriend_ongoing.9001.a:0 "เตรียมคณะผู้ติดตามของข้า เราจะออกเดินทางทันที!"
 befriend_ongoing.9001.b:0 "ข้าเกรงว่าเวลายังไม่เหมาะสม..."

 befriend_ongoing.9100.t:0 "ผูกมิตร: ความสัมพันธ์ที่เป็นอุปสรรค"
 befriend_ongoing.9100.desc:0 "ข้าเพิ่งได้รับข่าวที่น่ากังวลใจที่สุด! [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('scoped_rival') )][scoped_rival.Custom2('InsultAdjective', ROOT.Char)]ของข้า [scoped_rival.GetTitledFirstName] กำลังปล่อยข่าวลือเท็จเกี่ยวกับข้าให้ [target.GetFirstName] ฟัง โดยอ้างว่าความปรารถนาของข้าที่จะได้รับความไว้วางใจจาก[target.GetHerHis] นั้นมิใช่อื่นใดนอกจากการเสแสร้งเพื่อหาผลประโยชน์จาก[target.GetHerHim]"
 befriend_ongoing.9100.a:0 "ไร้สาระ! ไม่มีใครเชื่อคำโกหก เช่นนั้น"
 befriend_ongoing.9100.b:0 "ข้าจะไม่ยอมให้ [scoped_rival.GetHerHim] ทำให้ชื่อเสียงที่ดีของข้าเสื่อมเสีย!"
 befriend_ongoing.9100.b.success.desc.tt:0 "ข้าโน้มน้าว [target.GetFirstNameNoTooltip]"
 befriend_ongoing.9100.b.success.desc.toast:0 "[target.GetFirstName] ถูกโน้มน้าวโดยคำร้องขอของข้า"
 befriend_ongoing.9100.b.failure.desc.tt:0 "ข่าวลือของ [scoped_rival.GetFirstNamePossessiveNoTooltip] ยังคงแพร่กระจายต่อไป"
 befriend_ongoing.9100.c:0 "ดีที่สุดคือเพิกเฉยต่อ [scoped_rival.GetHerHim] ทั้งหมด"

 befriend_ongoing.9101.t:0 "ผูกมิตร: ความช่วยเหลือฉันมิตร"
 befriend_ongoing.9101.desc:0 "[ROOT.Char.Custom2('RelationToMe', SCOPE.sC('scoped_friend') )] ที่รักของข้า [scoped_friend.GetFirstName] ได้ทราบถึงความปรารถนาของข้าที่จะปรับปรุงสถานะของข้ากับ [target.GetTitledFirstName] และได้เสนอความช่วยเหลือจาก [scoped_friend.GetHerHis] แก่ข้า\n\n[scoped_friend.GetSheHe|U] รับรองกับข้าว่า [scoped_friend.GetSheHe] และ [target.GetFirstNameNoTooltip] เป็นคนประเภทเดียวกัน [scoped_friend.GetFirstNameNoTooltip] รู้แน่ชัดว่าข้าต้องทำอะไรเพื่อได้รับความไว้วางใจจาก [target.GetHerHis]"
 befriend_ongoing.9101.a:0 "ได้โปรด บอกข้าที!"
 befriend_ongoing.9101.b:0 "ขอบคุณ แต่ข้าไม่ต้องการความช่วยเหลือ"
 befriend_ongoing.9102.desc:1 "ช่วงนี้ ดูเหมือนว่า [owner.GetFirstName] จะคิดถึง แต่เรื่องเดียว [target.GetSheHe|U] มุ่งมั่นอย่างเต็มที่ที่จะได้รับความไว้วางใจจาก [target.GetFirstNamePossessive] ดังนั้นข้าจึงตัดสินใจช่วย [owner.GetHerHim]\n\n[owner.GetFirstNameNoTooltip] ตื่นเต้นที่ได้รับข้อมูลเชิงลึกของข้าและอ้างว่า [owner.GetSheHe] จะไม่ลืมท่าทีอันกรุณาของข้า"
 befriend_ongoing.9102.a:0 "นี่ไม่ใช่สิ่งที่เพื่อนมีไว้เพื่อกันหรือ?"

 befriend_ongoing.9103.t:0 "ผูกมิตร: ความเข้าใจผิดอันเลวร้าย"
 befriend_ongoing.9103.vassal.desc:0 "ข้าหวังว่าจะ ทำให้ [target.GetTitledFirstName] ประหลาดใจด้วยงานเลี้ยงใหญ่เพื่อเป็นเกียรติแก่ [target.GetHerHis] แต่ [target.GetSheHe] กลับตัดสินใจถอนตัวจากการเข้าร่วมในนาทีสุดท้าย\n\nดูเหมือนว่า [target.GetSheHe] คิดว่าความประหลาดใจของข้า แท้จริงแล้วเป็นส่วนหนึ่งของแผนการลอบสังหาร [target.GetHerHim]!"
 befriend_ongoing.9103.ruler.desc:1 "ข้าเพิ่งส่งทูตไปยังราชสำนักของ [target.GetTitledFirstNamePossessive] เพื่อเล่าถึงความร่ำรวยและอำนาจของ [ROOT.Char.GetPrimaryTitle.GetNameNoTooltip] และหวังว่าจะได้รับความเคารพจาก [target.GetHerHis]\n\nอย่างไรก็ตาม เมื่อฟังรายงานของผู้ส่งสาร ดูเหมือนว่าข้าได้สร้างความประทับใจที่แตกต่างไปมากให้กับ [target.GetHerHim] [target.GetSheHe|U] คิดว่าข้ากำลังขู่ว่าจะบุกรุก [target.GetPrimaryTitle.GetNameNoTierNoTooltip] ของ [target.GetHerHis] เว้น แต่ [target.GetSheHe] จะยอมจำนนต่อข้า!"
 befriend_ongoing.9103.a:0 "ปล่อยให้ [target.GetHerHim] คิดอะไรก็ได้ที่ [target.GetSheHe] ต้องการ"
 befriend_ongoing.9103.b:0 "บางทีอาจจะต้องขอโทษ"

 befriend_ongoing.9104.t:0 "ผูกมิตร: การเสนอที่เป็นมิตร"
 befriend_ongoing.9104.desc:0 "จะมีวิธีใดที่ดีไปกว่าการ ทำให้ [target.GetWomanMan] ผู้ศักดิ์สิทธิ์รักข้าได้ดีไปกว่าการแสดงความศรัทธาต่อ [owner.GetFaith.HighGodName] ในที่สาธารณะ?\n\nข้าสงสัยว่าท่าทีใดจะเหมาะสมที่สุดสำหรับโอกาสนี้..."
 befriend_ongoing.9104.a:0 "การประจานในที่สาธารณะน่าจะได้ผล"
 befriend_ongoing.9104.b:0 "บริจาคเงินจำนวนมากให้กับ [target.GetFaith.HouseOfWorship] ของ [target.GetHerHis]"
 befriend_ongoing.9104.c:0 "เลือดของผู้บริสุทธิ์จะแสดงให้เห็นถึงความเชื่อมั่นของข้า!"
 befriend_ongoing.9104.d:0 "ความเจ็บปวดของข้าเพื่อความรักของ [owner.GetFaith.HighGodNamePossessive]!"
 befriend_ongoing.9104.e:0 "จะเป็นอย่างไรถ้าข้าไปอยู่ที่แท่นบูชาของ [target.GetHerHis]?"
 befriend_ongoing.9104.e.tt:0 "#F ข้าจะเข้าร่วมพิธีมหาสนิทศักดิ์สิทธิ์กับ [target.GetTitledFirstName]#!"
 befriend_ongoing.9104.f:0 "ขอให้ [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('scoped_mate') )] ของข้าดับความกระหายของ [target.GetHerHis]!"
 befriend_ongoing.9104.f.tt:0 "#F [scoped_mate.GetFirstName] จะขอร้อง [target.GetTitledFirstName] แทนข้า#!"
 befriend_ongoing.9104.g:0 "อุทิศตนให้กับ [target.GetFaith.HouseOfWorship]"
 befriend_ongoing.9104.h:0 "อุทิศ [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('scoped_monk') )] ของข้าให้กับชีวิตแห่งการบูชา"
 befriend_ongoing.9104.z:0 "เมื่อคิดดูอีกที..."
