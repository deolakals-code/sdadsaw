l_english: 
 steal_back_artifact_outcome.1001.t:0 "$steal_back_artifact_event_title$ สำเร็จ!"
 steal_back_artifact_outcome.1001.desc:1 "ข้ารู้สึกภาคภูมิใจอย่างยิ่ง และอดไม่ได้ที่จะยิ้มกริ่มเมื่อได้รับโบราณวัตถุที่ข้าพยายามทวงคืนกลับมา [artifact.GetName] กลับคืนสู่เจ้าของโดยชอบธรรม!\n\nแม้ว่ามันอาจจะถลอกและสกปรกเล็กน้อยจากการผจญภัยเพื่อช่วยเหลือ แต่ข้าก็อดไม่ได้ที่จะลูบนิ้วไปบนพื้นผิวอันหรูหราของสิ่งของที่ถูกขโมยชิ้นนี้... [artifact.GetName] รางวัลอันล้ำค่า!"
 steal_back_artifact_outcome.1001.a:0 "มันกลับคืนสู่ที่อันชอบธรรม สู่มือที่ชอบธรรม"

 steal_back_artifact_outcome.1002.t:0 "$steal_back_artifact_event_title$ โบราณวัตถุถูกขโมย!"
 steal_back_artifact_outcome.1002.desc:0 "วันนี้ ข้านึกอยากชื่นชม [artifact_to_steal.GetName] ของข้า... แต่กลับต้องตกใจเมื่อพบว่ามันหายไป! #EMP หายไป!#!\n\nหลังจากการสืบสวนอย่างร้อนรน คนรับใช้คนหนึ่งก็ออกมาบอกว่า [owner.GetName] เป็นผู้วางแผนการขโมยอันอุกอาจนี้! แท้จริงแล้ว มีคนกล่าวว่า[owner.GetSheHe]มักจะพูดพร่ำเพ้ออยู่บ่อยครั้งว่า [artifact_to_steal.GetName] จะดูดีขึ้นเพียงใดหากอยู่ในความครอบครองของ[owner.GetHerHis]..."
 steal_back_artifact_outcome.1002.a:0 "สาปแช่งเจ้าหัวขโมยน่ารังเกียจนั่น!"

 steal_back_artifact_outcome.2001.t:0 "$steal_back_artifact_event_title$ ล้มเหลว"
 steal_back_artifact_outcome.2001:0 "การแทรกซึมที่วางแผนไว้อย่างแยบยลของข้าดำเนินไปตามแผน แต่กลับหา [artifact.GetName] ไม่พบ!\n\nมันถูกย้ายไปแล้วหรือ? ถูกซ่อนไว้? ไม่ว่าจะเป็นโชคช่วยเป้าหมายของข้า... หรือบริวารไร้ความสามารถของข้าถูกชิงไหวชิงพริบอย่างชาญฉลาด ด้วยความตื่นตระหนกจากความล้มเหลวอย่างสิ้นเชิงนี้ พวกเขาจะไม่ช่วยเหลือข้าอีกต่อไป ของล้ำค่าของข้ายังคงอยู่กับเจ้าของของมัน..."
 steal_back_artifact_outcome.2001.a:0 "ข้าไม่อยากจะเชื่อเลย! #EMP รับไม่ได้!#!"

