l_english: 
 murder_event_title:0 "การฆาตกรรม:"
 murder_ongoing.3010.t:0 "$murder_event_title$ สายลับขี้เมา"
 murder_ongoing.3010.desc_opening: "[agent_in_question.GetTitledFirstName] เมามายอยู่ในถ้วยของ[agent_in_question.GetHerHis]ทุกเมื่อเชื่อวัน"
 murder_ongoing.3010.desc_hero:0 "แม้ว่ามันจะเปิดโอกาสให้เรียนรู้เพิ่มเติมเกี่ยวกับ [scheme.GetTargetCharacter.GetTitledFirstName] แต่ [agent_hero_of_the_moment.GetTitledFirstName] – [target.Custom2('RelationToMe', SCOPE.sC('agent_hero_of_the_moment'))]ของ[scheme.GetTargetCharacter.GetTitleAsNamePossessiveNoTooltip]และสายลับของข้า — ได้แสดงความกังวลว่าคนขี้เมาผู้นั้นกำลังเป็นอันตรายต่อตำแหน่งของ[agent_hero_of_the_moment.GetHerHis]ในราชสำนักของ[scheme.GetTargetCharacter.GetTitleAsNamePossessiveNoTooltip]\n\n"มันเป็นเพียงเรื่องของเวลาก่อนที่อารมณ์ของ[agent_in_question.GetHerHis]จะควบคุม[agent_in_question.GetHerHim]ไม่ได้!""
 murder_ongoing.3010.desc:0 "แม้ว่ามันจะเปิดโอกาสให้เรียนรู้เพิ่มเติมเกี่ยวกับ [scheme.GetTargetCharacter.GetTitledFirstName] แต่ [agent_in_question.GetSheHe] ก็แทบไม่มีประโยชน์สำหรับสิ่งอื่นใดเลย..."
 murder_ongoing.3010.a:0 "ดื่มอีกแก้วสิ [agent_in_question.GetFirstNameNoTooltip]!"
 murder_ongoing.3010.a.success:0 "การเมามายอาละวาดของ[agent_in_question.GetHerHis|U]เป็นประโยชน์"
 murder_ongoing.3010.a.failure:0 "[agent_in_question.GetSheHe|U] เปิดโปง[agent_in_question.GetHerselfHimself]"
 murder_ongoing.3010.b:0 "[agent_in_question.GetTitledFirstNameNoTooltip] ต้องอยู่ห่างจากเครื่องดื่มทุกชนิด"
 murder_ongoing.3010.c:0 "ข้าจะ ทำให้แน่ใจว่ามันจะควบคุม[agent_in_question.GetHerHim]ไม่ได้! เตรียมพร้อมไว้"
 murder_ongoing.3301.t:0 "$murder_event_title$ ไม่ใช่คมที่สุด"
 murder_ongoing.3301.desc:0 "มีดในพิธีของข้าอยู่ที่ไหน?! มีดที่ข้าตั้งใจจะปักลงในอกของ[target.GetTitledFirstNamePossessive]! มีดที่ข้าลับมาหลายวันแล้ว!\n\nข้าพลิกห้องหาจนทั่ว แต่มันก็หาไม่เจอ"
 murder_ongoing.3301.a:0 "ข้าสาบานได้ว่าข้าทิ้งมันไว้ที่นี่!"
 #Apply poisonous herbs to the scheme that you found while travelling
 murder_ongoing.3302.t:0 "$murder_event_title$ โรยนี่นิด กิ่งนั้นหน่อย..."
 murder_ongoing.3302.desc:0 "ข้าพลันนึกถึงสมุนไพรที่ข้าได้จัดหามาเมื่อครั้งเดินทางผ่าน [herb_location.GetTerrain.GetNameNoTooltip|l] แห่ง [herb_location.GetNameNoTooltip]\n\nพวกมันน่าจะช่วย #EMP ปรุงแต่ง#! สถานการณ์ในภารกิจของข้าเพื่อปลดปล่อย [target.GetTitledFirstName] จากพันธนาการทางโลกของ[target.GetHerHis]ได้อย่างแน่นอน"
 murder_ongoing.3302.a:0 "สิ่งนี้จะเป็นประโยชน์แก่ข้าอย่างดี"
