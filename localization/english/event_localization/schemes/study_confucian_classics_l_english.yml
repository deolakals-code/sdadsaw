l_english: 
 study_confucian_classics_outcome.10.t: "$study_confucian_classics_title$การเลือกวิถี"
 study_confucian_classics_outcome.10.desc: "เบื้องหน้าข้าคือ #EMP ตำราหลุนอวี่แห่ง [Glossary( 'ขงจื่อ', 'CONFUCIUS_GLOSS' )]#!, #EMP คัมภีร์ซือจิง#!, #EMP คัมภีร์ซูจิง#!, #EMP คัมภีร์หลี่จี้#!, #EMP คัมภีร์อี้จิง#!, และ #EMP ตำนานชุนชิว#! ข้าได้เตรียม [Glossary( 'จตุรสมบัติ', 'FOUR_TREASURES')] ไว้พร้อมแล้ว — พร้อมกับชาอีก #EMP มากมาย#!...\n\nเพื่อพิสูจน์คุณงามความดีและความรู้ความสามารถ ข้าจำเป็นต้องศึกษา แต่ข้าเต็มใจจะทุ่มเทเพียงใดกัน?"
 study_confucian_classics_outcome.10.a: "ข้าจะมุ่งมั่นแสวงหาความรู้โดยไม่หยุดหย่อน!"
 study_confucian_classics_outcome.10.b: "ข้าจะปฏิบัติต่อการศึกษาของข้าอย่างสมศักดิ์ศรี"
 study_confucian_classics_outcome.10.c: "ก็คงต้องใช้เวลาเท่าที่จำเป็น"
 no_change_study_tt: "[scheme|E] [GetScheme('study_confucian_classics').GetTypeName] ของท่านดำเนินไปตามปกติ"
 tgp_focused_studies_modifier: "การศึกษามุ่งเน้น"
 tgp_focused_studies_personal_modifier: "มุ่งเน้นศึกษาลัทธิขงจื๊อ"
 tgp_focused_studies_personal_modifier_desc: "ตัวละครนี้อุทิศตนอย่างเต็มที่ในการศึกษาเล่าเรียนลัทธิขงจื๊อ"
 tgp_dignified_studies_modifier: "การศึกษาอย่างสมศักดิ์ศรี"
 tgp_dignified_studies_personal_modifier: "นักศึกษาลัทธิขงจื๊อผู้สง่างาม"
 tgp_dignified_studies_personal_modifier_desc: "ตัวละครนี้กำลังศึกษาคัมภีร์ขงจื๊ออย่างสมศักดิ์ศรี"
 
 study_confucian_classics_title: "$study_confucian_classics$: "
 study_confucian_classics_outcome.100.t: "$study_confucian_classics_title$ตลอดทั้งคืน"
 study_confucian_classics_outcome.100.desc: "ในการ [GetActivityType('activity_imperial_examination').GetName] ครั้งถัดไป ข้าจะต้องพร้อม ราตรีคืบคลานขณะที่ข้าหยิบตำนาน [ROOT.Char.Custom('GetRandomAnnalsPassage')] มาวางเบื้องหน้า หน้ากระดาษของมันสว่างขึ้นด้วยแสงอันริบหรี่\n\nหากข้าโหมอ่านตลอดคืนและท่องจำข้อความที่สำคัญที่สุด ข้าย่อมได้เปรียบ... แต่ข้าจะได้เรียนรู้จริงหรือ? บางทีข้าควรใช้เวลาเพื่อ #EMP ทำความเข้าใจ#! พวกมันจริง ๆ?"
 study_confucian_classics_outcome.100.a: "ข้าต้องสอบผ่าน ไม่ว่าจะต้องแลกด้วยสิ่งใด"
 study_confucian_classics_outcome.100.b: "ปัญญาย่อมต้องใช้เวลา"
 study_confucian_classics_outcome.100.c: "ข้าขอกลับไปนอนดีกว่า..."
 preparatory.imperial_examination.advantage.tt: "ท่านได้รับ [exam_advantage|E] สำหรับการ [GetActivityType('activity_imperial_examination').GetName] ครั้งถัดไป"
 
 study_confucian_classics_outcome.200.t: "$study_confucian_classics_title$เสียงเรียกแห่งกวี"
 study_confucian_classics_outcome.200.desc: "ความงดงามและลายมือใน [ROOT.Char.Custom('GetRandomPoetryPassage')] ช่าง #EMP น่าทึ่งยิ่งนัก!#! และผลงานของ [poet.GetTitledFirstName] — น่าชื่นชม ยืนยง เป็นบทกวีที่ควรค่าแห่งยุคสมัย อ่านจากบทหนึ่งไปยังอีกบทหนึ่ง ข้าหยุดอ่านไม่ได้เลย\n\nบางที ข้าเองก็ควรจรดพู่กัน... และเพิ่มเข้าในหอสมุดอันยิ่งใหญ่ของ [ROOT.Char.GetTopLiege.GetPrimaryTitle.GetNameNoTier] หรือ?"
 study_confucian_classics_outcome.200.a: ""[ROOT.Char.Custom('GeneratePoem_Title_Fragment_Season')] แห่งคุณธรรมอัน [ROOT.Char.Custom('FormalComplimentAdjective')] กำลังเรียกหา...""
 study_confucian_classics_outcome.200.b: "ข้าจะรอจนกว่าแรงบันดาลใจจะมาถึง!"
 study_confucian_classics_outcome.200.c: "[poet.GetFirstNameNoTooltip] สมควรได้รับจดหมายชื่นชม"
 study_confucian_classics_outcome.200.d: "ข้าควรอ่าน [ROOT.Char.Custom('GetRandomPoetryPassage')] ซ้ำอีกครั้ง"
 friend_praised_privately: "[CHARACTER.GetShortUIName|U] ได้ชื่นชม [TARGET_CHARACTER.GetShortUIName]"
 friend_praised_privately_corresponding: "[TARGET_CHARACTER.GetShortUIName|U] สรรเสริญ [CHARACTER.GetShortUIName]"
 
 study_confucian_classics_outcome.300.t: "$study_confucian_classics_title$แรงบันดาลใจแห่ง [ROOT.Char.Custom('GetSeason')|U]"
 study_confucian_classics_outcome.300.desc: "ขณะที่ข้าทอดสายตามองสวน [ROOT.Char.Custom('GetSeason')] อัน [location_province.Custom('ProvinceCompliment')] ข้าครุ่นคิดถึงบทกวีของมหากวี [ROOT.Char.Custom('GetRandomAncientChinesePoet')] สายลมพัดปลิวแขนเสื้อคลุมของข้า นำทางมือของข้าไปยังพู่กัน — ราวกับสวรรค์กำลังเชื้อเชิญให้ข้าเขียน\n\nกระดาษวางอยู่เบื้องหน้าข้า นิ่งสงบและรอคอย ที่จะรับถ้อยคำของข้า"
 study_confucian_classics_outcome.300.a: "ด้วยความพยายาม ข้าก็จะยิ่งใหญ่ได้ในสักวัน!"
 study_confucian_classics_outcome.300.b: "บทกวีเรียบง่าย เพื่อเก็บเกี่ยวช่วงเวลานี้"
 study_confucian_classics_outcome.300.c: "ปัญญาของท่านก็เป็นหมึกที่เพียงพอสำหรับข้าแล้ว"
 wang_wei: "หวัง เหว่ย"
 tao_yuanming: "เถา หยวนหมิง"
 li_bai: "หลี่ ไป๋"
 du_fu: "ตู้ ฝู่"
 meng_haoran: "เมิ่ง ฮ่าวหราน"
 liu_zongyuan: "หลิ่ว จงหยวน"
 bai_juyi: "ไป๋ จวีอี้"
 
 study_confucian_classics_outcome.110.t: "$study_confucian_classics_title$คัมภีร์ขงจื๊อ"
 study_confucian_classics_outcome.110.desc: "ตำนาน [ROOT.Char.Custom('GetRandomAnnalsPassage')], [ROOT.Char.Custom('GetRandomPoetryPassage')], [ROOT.Char.Custom('GetRandomRitesPassage')] — ทีละเล่ม ข้าศึกษาคัมภีร์ขงจื๊ออันยิ่งใหญ่ เก็บเกี่ยวปัญญาอันไร้กาลเวลาจากหน้ากระดาษ\n\nหากข้าจะรับใช้เป็นผู้ปกครองที่เที่ยงธรรม ข้าต้องเดินตามเส้นทางที่ [Glossary( 'ขงจื่อ', 'CONFUCIUS_GLOSS' )] กำหนดไว้ นี่คือถ้อยคำที่ข้าต้องจดจำ"
 study_confucian_classics_outcome.110.a: "ข้าต้องเรียนรู้ ไม่ว่าจะ อย่างไรก็ตาม"
 study_confucian_classics_outcome.110.b: "ข้าจะค่อย ๆ ใช้เวลา"
 
 study_confucian_classics_outcome.120.t: "$study_confucian_classics_title$การอ่านตำนาน"
 study_confucian_classics_outcome.120.desc: "ก่อนที่ข้าจะปกครองแผ่นดิน ข้าต้องปกครองโต๊ะทำงานของข้าให้ได้ก่อน ตำนาน [ROOT.Char.Custom('GetRandomAnnalsPassage')] เปิดอยู่เบื้องหน้าข้า — ผลงานอันชาญฉลาด รากฐานแห่งการปกครองอันชอบธรรม ผ่านถ้อยคำของมัน ข้าจะเพิ่มพูนความรู้และติดตามรอยเท้าของ [Glossary( 'ขงจื่อ', 'CONFUCIUS_GLOSS' )]\n\nข้าจะบรรลุได้ก็ต่อเมื่อมีวินัยเท่านั้น"
 study_confucian_classics_outcome.120.a: "ข้าจะพินิจพิเคราะห์ตำราเพื่อค้นหาความจริงที่ซ่อนอยู่"
 study_confucian_classics_outcome.120.b: "ชาสามถ้วย ไม่อนุญาตให้หลับจนกว่าจะถึงหน้าสุดท้าย"
 study_confucian_classics_outcome.120.c: "ปัญญาย่อมมาสู่[ROOT.Char.GetSheHe]ที่อดทน"
 confucian_xp_high_tt: "ท่านก้าวหน้าในการศึกษาลัทธิขงจื๊ออย่างมาก"
 confucian_xp_low_tt: "ท่านก้าวหน้าในการศึกษาลัทธิขงจื๊อเล็กน้อย"
 
 study_confucian_classics_outcome.130.t: "$study_confucian_classics_title$มุมมองต่อการเรียนรู้"
 study_confucian_classics_outcome.130.desc: "เหตุใดข้าจึงไม่เข้าใจตำรา? เหตุใดข้าจึงไม่เข้าใจความหมายอันลึกซึ้ง? ข้า #EMP ไร้ความสามารถ#! ถึงเพียงนี้เชียวหรือ? ข้าวางพู่กันและวางหน้าผากลงบนโต๊ะอย่างแผ่วเบา\n\n"ข้านำชามาให้" [servant.GetFirstName] [ROOT.Char.Custom2('RelationToMeShort', servant)] ของข้า กล่าวขณะที่ [servant.GetSheHe] ก้าวเข้ามาในห้องหนังสือ "นั่น #EMP [ROOT.Char.Custom('GetRandomRitesPassage')]?#! หรือ ข้ามีความทรงจำดี ๆ กับเล่มนั้น... ข้าขออ่านกับท่านสักครู่ได้หรือไม่?"\n\nข้าเงยหน้าขึ้น บางทีความช่วยเหลืออาจเป็นสิ่งที่ข้าต้องการ"
 study_confucian_classics_outcome.130.a: "ได้โปรด ช่วยข้าทำความเข้าใจพวกมันที"
 study_confucian_classics_outcome.130.b: "บางทีเราควรออกไปหาอะไรดื่มกัน?"
 
 study_confucian_classics_outcome.140.t: "$study_confucian_classics_title$ศิลปะแห่งการทูต"
 study_confucian_classics_outcome.140.desc: "ข้าปิดตำราหลุนอวี่พร้อมกับถอนหายใจ [Glossary( 'ปรมาจารย์ขงจื๊อ', 'CONFUCIUS_GLOSS' )] กล่าวถึงความปรองดอง — การแสดงคุณธรรมผ่านความชอบธรรม ไม่ใช่การประจบสอพลอ ทว่า [diplomatic_vassal.GetTitledFirstName] [ROOT.Char.Custom2('RelationToMeShort', diplomatic_vassal)] ของข้า กลับได้มา ซึ่งสันติภาพด้วยรอยยิ้มและการดื่มอวยพร\n\nข้าสงสัย... นั่นคือวิถีทาง เช่นกันหรือ?"
 study_confucian_classics_outcome.140.a: "ข้าควรเรียนรู้จาก[diplomatic_vassal.GetHerHim]"
 study_confucian_classics_outcome.140.b: "ไม่ ข้าจะแสวงหาคุณงามความดีด้วยวิธีอื่น"
 relation_servant_of_china_female: "สตรีผู้รับใช้แห่ง [ROOT.Char.GetTopLiege.GetPrimaryTitle.GetNameNoTier]"
 relation_servant_of_china_male: "บุรุษผู้รับใช้แห่ง [ROOT.Char.GetTopLiege.GetPrimaryTitle.GetNameNoTier]"
 
 study_confucian_classics_outcome.150.t: "$study_confucian_classics_title$รู้จักผืนดิน"
 study_confucian_classics_outcome.150.desc: ""เดินกับข้า" [servant.GetFirstName] [ROOT.Char.Custom2('RelationToMeShort', servant)] ของข้า กล่าว พลางกวักมือเรียกข้าออกไปข้างนอก "ให้เราไปสำรวจ [location_province.Custom('GetTerrainTypePlural')] แห่ง [location_province.GetName] กันเถิด"\n\n"จงสังเกตเนินดินและที่สูงชัน ลาดเขาและช่องแคบ ที่ราบและหนองบึง — แต่ละแห่งกำหนดว่าแผ่นดินนั้นควรใช้ประโยชน์สิ่งใดได้ดีที่สุด นี่คือปัญญาจาก #EMP คัมภีร์หลี่จี้#!""
 study_confucian_classics_outcome.150.a: "ช่างลึกซึ้งยิ่งนัก"
 study_confucian_classics_outcome.150.b: "อา ใช่ การเดินเล่นจะ ทำให้ข้าหัวปลอดโปร่ง"
 
 study_confucian_classics_outcome.160.t: "$study_confucian_classics_title$งานอันทรงคุณค่า"
 study_confucian_classics_outcome.160.desc: "ข้าได้เจาะลึก [ROOT.Char.Custom('GetRandomPoetryPassage')], [ROOT.Char.Custom('GetRandomRitesPassage')], และตำนาน [ROOT.Char.Custom('GetRandomAnnalsPassage')] — จิตใจข้าเฉียบแหลม ทักษะข้าขัดเกลา และข้ารู้สึกพร้อมที่จะพิสูจน์คุณงามความดีของข้า\n\nบางทีข้าควรช่วยผู้พิพากษาท้องถิ่นทบทวนคดีเก่า ๆ สำรวจสภาพสะพานในท้องที่,"
 study_confucian_classics_outcome.160.desc_own_elder: "หรือร่างรายงานทางการสำหรับผู้อาวุโสของข้า [higher_merit_vassal.GetTitledFirstName]"
 study_confucian_classics_outcome.160.desc_other_elder: "หรือร่างรายงานทางการสำหรับ [higher_merit_vassal.GetTitledFirstName] ผู้อาวุโสผู้มีชื่อเสียงและมีตำแหน่งสูง"
 study_confucian_classics_outcome.160.a: "หากข้ารับใช้ [higher_merit_vassal.GetFirstNameNoTooltip] ได้ดี ชื่อเสียงคุณงามความดีของข้าจะตามมา"
 study_confucian_classics_outcome.160.b: "การสำรวจที่เหมาะสมย่อมดังกว่าคำโอ้อวดใด ๆ"
 study_confucian_classics_outcome.160.c: "ข้าจะช่วยเหลือเหล่าผู้พิพากษา"
 merit_gain_high_tt: "ได้รับคุณงามความดีจำนวนมาก"
 merit_gain_low_tt: "ได้รับคุณงามความดีเล็กน้อย"
 because_of_your_diplomacy: "เนื่องจาก [diplomacy_i][diplomacy|E] ของท่าน:"
 because_of_your_stewardship: "เนื่องจาก [stewardship_i][stewardship|E] ของท่าน:"
 because_of_your_learning: "เนื่องจาก [learning_i][learning|E] ของท่าน:"
 
 study_confucian_classics_outcome.170.t: "$study_confucian_classics_title$อิทธิพลของผู้อาวุโส"
 study_confucian_classics_outcome.170.desc: ""ม้วนสาส์นประทับตราของผู้อาวุโสของท่าน [elder.GetTitledFirstName] เพิ่งมาถึง" [letterman.GetFirstName] [ROOT.Char.Custom2('RelationToMeShort', letterman)] ของข้า กล่าว พลางยื่นให้ข้า "ข้าเชื่อว่าเป็นข่าวดี!"\n\nข้าคลี่ม้วนสาส์นออกอย่างระมัดระวัง\n\n"ถึงศิษย์ผู้ [ROOT.Char.Custom('ComplimentAdjective')] ที่สุดของข้า — พู่กันอันมั่นคง หัวใจอันซื่อตรง และจิตใจอันอดทนของเจ้า หาได้ไร้ผู้สังเกตไม่ ข่าวการปฏิบัติตนของเจ้าไปถึงหูเหล่าเสมียนและผู้พิพากษาแล้ว คุณงามความดีของเจ้าเป็นที่ประจักษ์""
 study_confucian_classics_outcome.170.a: "ข้าจะเขียนจดหมายขอบคุณ"
 study_confucian_classics_outcome.170.b: "บางที [elder.GetSheHe] อาจถูกโน้มน้าวให้ช่วยใช้เส้นสายเพิ่มอีก?"
 study_confucian_classics_outcome.170.c: "ข้ามีความสุขมาก ข้าชงชาให้เจ้าสิบถ้วยยังได้!"
 
 study_confucian_classics_outcome.180.t: "$study_confucian_classics_title$ปลดเปลื้องภาระ"
 study_confucian_classics_outcome.180.desc: "ข้าทำได้ ข้าอ่าน #EMP คัมภีร์หลี่จี้#! จบทั้งเล่ม — และข้ายังจำปัญญาของมันได้! ราวกับม่านหมอกถูกยกออกจากดวงตาของข้า เป็นครั้งแรก ที่ข้ามองเห็นเส้นทางข้างหน้าอย่างชัดเจน\n\nและเมื่อคิดดู... ไม่มีใครเชื่อในตัวข้า แม้ แต่ตัวข้าเอง\n\nบางทีข้าอาจถูกลิขิตมาเพื่อสิ่งที่ยิ่งใหญ่กว่านี้"
 study_confucian_classics_outcome.180.a: "ทีนี้ จะอ่านอะไรต่อดี..."
 
 study_confucian_classics_outcome.190.t: "$study_confucian_classics_title$การใช้อิทธิพล"
 study_confucian_classics_outcome.190.desc: "คำพูดที่ถูกที่ถูกเวลา ของขวัญเป็นบทกวี ความโปรดปรานจากอาจารย์ผู้คู่ควร... โอกาสสำหรับ [Glossary( 'กวานซี', 'GUANXI_GLOSS' )] แม้ แต่ที่นั่งในงานชุมนุมกวีอันเงียบสงบก็อาจกำหนดเส้นทางได้\n\nข้าทำงานอย่างขยันขันแข็ง แต่ปราชญ์สอนไว้ว่าคุณธรรมต้องส่องสว่างจึงจะเป็นที่รู้จัก"
 GUANXI_GLOSS: "กวนซี่ (Guānxi) คือเครือข่ายความสัมพันธ์ส่วนตัว ผู้คนที่ไว้วางใจ ซึ่งกันและกันและแลกเปลี่ยนบุญคุณ มันถูกสร้างขึ้นแบบตัวต่อตัวผ่านการดื่มชา อาหารค่ำ หรือเมื่อมีการเสนอความช่วยเหลือ และมักจะมีความสำคัญมากกว่ากฎเกณฑ์ที่เป็นทางการ"
 study_confucian_classics_outcome.190.a: "ข้าจะ ทำให้แน่ใจว่าเหล่าผู้พิพากษาได้ยินชื่อข้า"
 study_confucian_classics_outcome.190.b: "ข้าจะขอบัณฑิตแบ่งปันบันทึกของพวกเขา"
 study_confucian_classics_outcome.190.c: "บทกวีที่ดีที่สุดต้องมีคนได้ยิน ข้าจะศึกษากับผู้ที่ดีที่สุด"
 study_confucian_classics_outcome.190.d: "คุณงามความดีของข้าย่อมประจักษ์ด้วยตัวมันเอง"
 tgp_known_by_magistrates_modifier: "เป็นที่รู้จักของผู้พิพากษา"
 tgp_known_by_magistrates_modifier_desc: "ตัวละครนี้เป็นที่รู้จักดีในหมู่ผู้พิพากษาท้องถิ่น"
 tgp_assisted_by_scholars_modifier: "ได้รับความช่วยเหลือจากบัณฑิตท้องถิ่น"
 tgp_assisted_by_scholars_modifier_desc: "กลุ่มบัณฑิตท้องถิ่นกำลังช่วยเหลือตัวละครนี้"
 tgp_known_by_poets_modifier: "เป็นที่รู้จักของเหล่ากวี"
 tgp_known_by_poets_modifier_desc: "ตัวละครนี้เป็นที่รู้จักดีในหมู่กวีท้องถิ่น"
 
 study_confucian_classics_outcome.1000.t: "$study_confucian_classics_title$การเลี้ยงดูที่เข้มงวด"
 study_confucian_classics_outcome.1000.desc: ""เหตุใดเจ้าไม่ตั้งใจเรียนให้หนักขึ้น? เจ้านำความอัปยศมาสู่ตระกูล [ROOT.Char.GetHouse.GetName]!" [parent.GetMotherFather] ของข้า โบกมือ [parent.GetHerHis] ด้วยความโกรธ "ข้อแก้ตัวของเจ้าเบากว่าฝุ่นบนโต๊ะทำงานของเจ้าเสียอีก"\n\n"หากเจ้าไม่เรียน เจ้าจะต้องไปทำงานในโรงเก็บของอย่างน่าอับอาย""
 study_confucian_classics_outcome.1000.a: "ข้าต้องไม่ ทำให้ [parent.GetMotherFather] ผิดหวัง"
 study_confucian_classics_outcome.1000.b: "ข้าคงไม่มีวันได้ดี"
 study_confucian_classics_outcome.1000.c: "อภัยให้ข้าด้วย ข้าต้องการหยุดพัก"
 tgp_gave_up_modifier: "ยอมแพ้"
 tgp_gave_up_modifier_desc: "ตัวละคร [GetTrait('burdened').GetName( GetNullCharacter )] นี้ ได้ยอมแพ้อย่างสิ้นเชิงแล้ว"
 tgp_study_harder_modifier: "เรียนหนักขึ้น"
 tgp_study_harder_modifier_desc: "บิดามารดาของตัวละครนี้ได้กระตุ้นให้พวกเขาเรียนหนักขึ้น\n[GetScheme('study_confucian_classics').GetTypeName] [success_chance|E]: #P +10%#!"
 never_study_again_tt: "ท่านจะไม่สามารถ [GetScheme('study_confucian_classics').GetTypeName] ได้อีกเลย"
 dishonor_opinion: "ความอัปยศ"
 honorable_opinion: "มีเกียรติ"
 satisfied_opinion: "พึงพอใจ"
 
 study_confucian_classics_outcome.1010.t: "$study_confucian_classics_title$คำแนะนำจากผู้อาวุโส"
 study_confucian_classics_outcome.1010.desc: "การศึกษาของข้าไม่สู้ดีนัก... ตำนาน [ROOT.Char.Custom('GetRandomAnnalsPassage')] ที่อ่านเพียงครึ่ง ๆ กลาง ๆ กวักมือเรียกความสนใจจากข้า แต่จิตใจข้ากลับโหยหาชาอีกถ้วย ขณะที่ข้ารินชา ข้าสังเกตเห็นม้วนสาส์นจากผู้อาวุโสของข้า [elder.GetTitledFirstName]\n\nมันเขียนว่า: "ถึงศิษย์รัก ข้าได้ยินว่าการเรียนของเจ้าสะดุด ข้าได้แนบความคิดของข้าเกี่ยวกับตำราหลุนอวี่ และบันทึกเล็กน้อยที่อาจช่วยเจ้าได้"\n\nความปรารถนาที่จะเรียนรู้ของข้าปะทุขึ้นอีกครั้ง!"
 study_confucian_classics_outcome.1010.a: "ด้วยความช่วยเหลือจาก[elder.GetHerHis] ข้าจะตั้งใจเรียนอย่างที่ไม่เคยเป็นมาก่อน!"
 study_confucian_classics_outcome.1010.b: "ม้วนสาส์นนี้จะเป็นประโยชน์อย่างยิ่ง"
 artifact_elder_text_name: "ข้อคิดของ [elder.GetFirstNamePossessiveNoTooltip]"
 artifact_elder_text_description: "ชุดความคิดที่ไตร่ตรองมาอย่างดีและบันทึกอย่างละเอียดโดย [elder.GetTitledFirstName] โดยตั้งใจที่จะช่วยศิษย์ของ[elder.GetHerHis] [owner.GetFirstName]"
 tgp_motivated_elder_study_modifier: "ความช่วยเหลือจากผู้อาวุโส"
 
 study_confucian_classics_outcome.1020.t: "$study_confucian_classics_title$ทุ่มเทเป็นสองเท่า"
 study_confucian_classics_outcome.1020.desc: "นี่มันไม่ได้ผล ข้าดูเหมือนจะไม่สามารถทำอะไรให้สำเร็จได้เลย ห้องหนังสือของข้าร้างไร้ผู้คน หนังสือที่ยังไม่ได้อ่านกองสุมราวกับข้อกล่าวหาต่อโจร และม้วนสาส์นกระจัดกระจายเกลื่อนพื้นราวกับใบไม้ที่ร่วงหล่น\n\nแต่ข้า #EMP รู้#! ว่าข้าทำได้\n\nข้า. แค่. ต้อง. ตั้งใจ"
 study_confucian_classics_outcome.1020.a: "ไม่มีข้อแก้อีกต่อไป ข้าจะพยายามต่อไป!"
 study_confucian_classics_outcome.1020.b: "[ROOT.Char.Custom('RegionalAlcoholicDrink')] สักหน่อยจะช่วยข้าผ่านพ้นไปได้..."
 study_confucian_classics_outcome.1020.c: "หายใจเข้าลึก ๆ และเริ่มต้นใหม่อีกครั้ง"
 tgp_double_down_on_studies_modifier: "ทุ่มเทเป็นสองเท่า"
 
 study_confucian_classics_outcome.1030.t: "$study_confucian_classics_title$ความช่วยเหลือจากสวรรค์"
 study_confucian_classics_outcome.1030.desc: "การศึกษาของข้าไม่สู้ดีนัก บางทีสิ่งที่ข้าต้องการอาจไม่ใช่สาส์นอีกม้วน... แต่เป็นคำชี้แนะจาก [ROOT.Char.GetFaith.KnowledgeGodName] ข้าก้าวเข้าไปในศาลเจ้าท้องถิ่น คุกเข่าลงต่อหน้าแท่นบูชา และพนมมือสวดอ้อนวอน\n\n"เจ้ากำลังมองหาปัญญาหรือ [priest.Custom2('RelationToMeShort', owner)] ของข้า?" [priest.GetFirstName] [ROOT.Char.Custom2('RelationToMeShort', priest)] ของข้า พึมพำ พลางก้าวออกมาจากเงา "หากเจ้าถวายเครื่องบูชาเล็กน้อย หรือยื่นมือช่วยงานรอบ ๆ ศาลเจ้า ข้าก็พอจะช่วยเจ้าได้""
 study_confucian_classics_outcome.1030.a: "ข้าสามารถถวายเครื่องบูชาเล็กน้อยได้"
 study_confucian_classics_outcome.1030.b: "มือของข้าเป็นของท่าน"
 study_confucian_classics_outcome.1030.c: "ข้าเชื่อมั่นใน [ROOT.Char.GetFaith.KnowledgeGodName] เท่านั้น"
 tgp_divine_favor_modifier: "ความโปรดปรานจากนักบวช"
 
 study_confucian_classics_outcome.1040.t: "$study_confucian_classics_title$คู่ครองผู้สนับสนุน"
 study_confucian_classics_outcome.1040.desc: "มันมากเกินไป ข้าไม่สามารถเข้าใจ #EMP [ROOT.Char.Custom('GetRandomRitesPassage')]#! ได้เลย! บันทึกทั้งหมดของข้าผิดหมด! ไร้ประโยชน์!\n\n"[partner.Custom('LoverPetName')|U] การเรียนของท่านกำลังสร้างปัญหาให้ท่านหรือ?" [partner.GetFirstName] [ROOT.Char.Custom2('RelationToMeShort', partner)] ของข้า ถามอย่างนุ่มนวล พลางถือถาดขนมเค้กชามา "ทำไมท่านไม่ให้ข้าเข้าร่วมด้วยล่ะ? ไม่มีอะไรที่เราทำไม่ได้หากเราร่วมมือกัน! โอ้ และทานเค้กสักชิ้นสิ ข้าทำมาเพื่อท่าน""
 study_confucian_classics_outcome.1040.a: "ได้โปรด นำหมึกและกระดาษเปล่ามาให้ข้า"
 study_confucian_classics_outcome.1040.b: "การสนับสนุนของท่านมีความหมายต่อข้ามาก"
 study_confucian_classics_outcome.1040.c: "ทั้งหมดที่ข้าต้องการในตอนนี้คือท่าน"
 tgp_servile_partner_modifier: "คู่ครองผู้รับใช้"
 tgp_assistant_partner_modifier: "คู่ครองผู้ช่วยเหลือ"
 lover_helped_study: "[CHARACTER.GetShortUIName|U] ตกหลุมรัก [TARGET_CHARACTER.GetShortUIName] ระหว่างช่วงเวลาการศึกษา"
 lover_helped_study_corresponding: "[TARGET_CHARACTER.GetShortUIName|U] ตกหลุมรัก [CHARACTER.GetShortUIName] ระหว่างช่วงเวลาการศึกษา"
