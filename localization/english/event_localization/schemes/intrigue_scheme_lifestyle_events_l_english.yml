l_english: 
 intrigue_scheme_lifestyle.1001.t:0 "วินัยและความภักดี"
 intrigue_scheme_lifestyle.1001.desc:0 "เมื่อทราบว่าเหล่าทหารปฏิบัติต่อกันอย่างไร และสังเกตว่าข้อมูลและข่าวลือแพร่สะพัดไปอย่างอิสระเพียงใด ข้าพลันเกิดความคิดขึ้น\n\nหากทหารบางส่วนของข้าเองแทรกซึมเข้าไปในกองทัพของ [target.GetTitledFirstNamePossessive] พวกเขาอาจให้ข้อมูลเชิงลึกที่แตกต่างเกี่ยวกับแผนการของ [target.GetHerHis] ได้"
 intrigue_scheme_lifestyle.1001.a:0 "ถึงเวลาที่ [target.GetFirstNameNoTooltip] จะต้องรับสมัครทหารใหม่แล้ว"
 intrigue_scheme_lifestyle.1001.a.tt:0 "#F ข่าวลือแพร่กระจายอย่างรวดเร็วในหมู่ทหาร... ข้าอาจเรียนรู้ได้มาก ตราบใดที่สายลับของข้าไม่ก่อปัญหา.#!\n"
 intrigue_scheme_lifestyle.1001.b:0 "ไม่ มันเสี่ยงเกินไป"
 intrigue_scheme_lifestyle.1001.b.tt:0 "#F ข้าจะไม่เสี่ยงพนันว่าความภักดีที่แท้จริงของทหารสามัญอยู่ ณ ที่ใด.#!\n"

 intrigue_scheme_lifestyle.1002.t:0 "วินัยและความภักดี"
 intrigue_scheme_lifestyle.1002.desc:1 "ข้าเพิ่งได้รับข่าวว่าทหารที่ข้าส่งไปแทรกซึมในกองทัพของ [target.GetTitledFirstNamePossessive] ถูกเปิดโปงแล้ว! ใครจะรู้ว่าพวกเขากำลังทนทุกข์ทรมานจากการลงโทษแบบใด — หรือที่เลวร้ายกว่านั้น คือการสอบสวน! — อยู่ในขณะนี้"
 intrigue_scheme_lifestyle.1002.a:0 "หวังว่าพวกเขาจะไม่เปิดเผยแผนการใดๆ ของข้า!"

 intrigue_scheme_lifestyle.3001.t:0 "กิจวัตรประจำ"
 intrigue_scheme_lifestyle.3001.desc_agents:0 "สายลับของข้าสังเกตเห็นว่า [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('target'))] ของข้า คือ [ROOT.Char.Custom2('RelationDescriptor', SCOPE.sC('target'))] [target.GetTitledFirstName] ดูเหมือนจะมีกิจวัตรประจำที่ค่อนข้างแน่นอน\n\nหากสามารถสังเกตการณ์สิ่งเหล่านี้ได้ ก็อาจเป็นกุญแจสำคัญสู่ความก้าวหน้าได้ เช่นกัน..."
 intrigue_scheme_lifestyle.3001.desc:0 "ข้าตระหนักได้ว่า [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('target'))] ของข้า คือ [ROOT.Char.Custom2('RelationDescriptor', SCOPE.sC('target'))] [target.GetTitledFirstName] มีตารางเวลาที่ค่อนข้างแน่นอน หากสามารถสังเกตการณ์สิ่งเหล่านี้ได้ ก็อาจเป็นกุญแจสำคัญสู่ความก้าวหน้าได้ เช่นกัน..."
 intrigue_scheme_lifestyle.3001.a:0 "ข้าจะศึกษากิจวัตรของพวกเขาเป็นการส่วนตัว"
 intrigue_scheme_lifestyle.3001.a_agent:0 "ข้าต้องการคนคอยจับตาดู [target.GetHerHim] ตลอดเวลา!"
 intrigue_scheme_lifestyle.3001.a.tt:0 "#F แน่นอนว่ามันเป็นความพยายามที่เสี่ยง...#!"
 intrigue_scheme_lifestyle.3001.b:0 "มันเสี่ยงเกินไป"
 intrigue_scheme_lifestyle.3001.b.tt:0 "#F [target.GetSheHe|U] อาจสังเกตเห็นว่า [target.GetSheHe] กำลังถูกจับตามองอยู่!#!"

 intrigue_scheme_lifestyle.3101.t:0 "รอบรู้ข้อมูลอย่างถ่องแท้"
 intrigue_scheme_lifestyle.3101.desc:0 "คนรับใช้ในราชสำนักมักถูกมองข้ามไปอย่างสะดวก ในขณะที่พวกเขาแอบฟังการสนทนา ทำความสะอาด เคลื่อนไหวไปตามโถงทางเดินโดยไม่มีใครสังเกตเห็น...\n\nนี่ก็เป็นกรณีเดียวกันในราชสำนักของ [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('target'))] [target.GetTitledFirstNamePossessive] ของข้า ซึ่งนับเป็นโอกาสอันดี"
 intrigue_scheme_lifestyle.3101.a:0 "บางคนจะถูกโน้มน้าวให้ปล่อยข้อมูลหลุดไปยังสายลับของข้า"
 intrigue_scheme_lifestyle.3101.a.tt:0 "#F ผู้ให้ข้อมูลอาจให้ข้อมูลอันประเมินค่ามิได้แก่ข้า แต่พวกเขาก็เป็นมือสมัครเล่นซึ่งหมายรวมถึงความเสี่ยงทั้งหมดที่ตามมาด้วย...#!"
 intrigue_scheme_lifestyle.3101.b:0 "ความเสี่ยงมันใหญ่หลวงเกินไป!"
 intrigue_scheme_lifestyle.3101.b.tt:0 "#F ข้าไม่สามารถไว้วางใจคนเช่นนั้นได้!#!"

 intrigue_scheme_lifestyle.3102.desc:0 "คนรับใช้ที่ป้อนข้อมูลเกี่ยวกับ [target.GetTitledFirstName] ให้สายลับของข้าถูกจับได้แล้ว!"
 intrigue_scheme_lifestyle.3102.a:0 "พวกเขาควรจะเงียบปากไว้!"

 intrigue_scheme_lifestyle.3201.t:0 "การสื่อสาร"
 intrigue_scheme_lifestyle.3201.desc_animal:0 "โชคดีอะไร เช่นนี้! ที่นกส่งสารของ [target.GetTitledFirstNamePossessive] จะชื่นชอบเมล็ดพืชชนิดที่พบได้ในสวนของข้าเป็นพิเศษ และพวกมันจะอยู่แถวนั้นนานพอให้ข้าได้อ่านข้อความ!"
 intrigue_scheme_lifestyle.3201.elope.desc:0 "โชคดีอะไร เช่นนี้! สายลับของข้าได้ค้นพบหนทางเข้าไปในห้องทำงานที่ [target.GetLiege.Custom2('NamePossessiveCharacterIntroduction', target )] เก็บจดหมายร่างของ [target.GetLiege.GetHerHis] ไว้ บัดนี้ข้อความทั้งหมดของ [target.GetLiege.GetHerHis] ตกเป็นของข้าให้อ่านแล้ว! "
 intrigue_scheme_lifestyle.3201.desc:1 "โชคดีอะไร เช่นนี้! สายลับของข้าได้ค้นพบหนทางเข้าไปในห้องทำงานที่ [target.GetTitledFirstName] เก็บจดหมายร่างของ [target.GetHerHis] ไว้ บัดนี้ข้อความทั้งหมดของ [target.GetHerHis] ตกเป็นของข้าให้อ่านแล้ว!"

 intrigue_scheme_lifestyle.3201.a:0 "มา ทำให้เรื่องนี้เป็นเรื่องปกติกันเถอะ!"
 intrigue_scheme_lifestyle.3201.b:1 "ข้า ทำให้ผู้ส่งสารของ [target.GetHerHis] กินอาหารจากมือข้าได้"
 intrigue_scheme_lifestyle.3201.b.tt:1 "ตัวเลือกนี้มีให้ เนื่องจากข้ามี $modifier_hunt_friend_of_animal$ Modifier"
 intrigue_scheme_lifestyle.3201.c:0 "มันเป็นแค่โชคช่วย ไม่มีอะไรมากกว่านั้น"

 intrigue_scheme_lifestyle.3301.t:0 "อีกเส้นทางหนึ่ง"
 intrigue_scheme_lifestyle.3301.desc_murder:0 "สายลับของข้าสังเกตเห็นว่า [ROOT.Char.Custom2('RelationDescriptor', SCOPE.sC('target'))] [target.GetTitledFirstName] มีปฏิกิริยาแปลกๆ ทุกครั้งที่ [target.GetHerHis] [target.Custom2('RelationToMe', SCOPE.sC('secret_to_reveal_target'))] [secret_to_reveal_target.GetTitledFirstName] ถูกเอ่ยถึง..."
 intrigue_scheme_lifestyle.3301.desc_lover:0 "สายลับของข้าสังเกตเห็นว่า [ROOT.Char.Custom2('RelationDescriptor', SCOPE.sC('target'))] [target.GetTitledFirstName] ใช้เวลาอยู่ตามลำพังกับ [target.GetHerHis] [target.Custom2('RelationToMe', SCOPE.sC('secret_to_reveal_target'))] [secret_to_reveal_target.GetTitledFirstName] มากเหลือเกิน..."
 intrigue_scheme_lifestyle.3301.desc_pregnancy:0 "สายลับของข้าสังเกตเห็นว่า [ROOT.Char.Custom2('RelationDescriptor', SCOPE.sC('target'))] [target.GetTitledFirstName] ดูเหมือนจะกังวลเกี่ยวกับสุขภาพของ [target.GetHerHis] [target.Custom2('RelationToMe', SCOPE.sC('secret_to_reveal_target'))] [secret_to_reveal_target.GetTitledFirstName] มาก"
 intrigue_scheme_lifestyle.3301.desc_child:0 "สายลับของข้าสังเกตเห็นว่า [ROOT.Char.Custom2('RelationDescriptor', SCOPE.sC('target'))] [target.GetTitledFirstName] มีส่วนเกี่ยวข้องอย่างมากในชีวิตของ [target.GetHerHis] [target.Custom2('RelationToMe', SCOPE.sC('secret_to_reveal_target'))] [secret_to_reveal_target.GetTitledFirstName]."
 intrigue_scheme_lifestyle.3301.desc_fallback:0 "สายลับของข้าสังเกตเห็นว่า [ROOT.Char.Custom2('RelationDescriptor', SCOPE.sC('target'))] [target.GetTitledFirstName] มีท่าทีแปลกๆ เมื่ออยู่ใกล้ [target.GetHerHis] [target.Custom2('RelationToMe', SCOPE.sC('secret_to_reveal_target'))] [secret_to_reveal_target.GetTitledFirstName]."
 intrigue_scheme_lifestyle.3301.desc_end:0 "\n\nการสืบสวนเพิ่มเติมหมายถึงการละทิ้งแผนการอันมืดมนของข้าที่มีต่อ [target.GetTitleTierName] แต่ข้าต้องยอมรับว่าความอยากรู้อยากเห็นของข้าถูกกระตุ้น!"
 intrigue_scheme_lifestyle.3301.a:0 "หาก [target.GetSheHe] ซ่อนอะไรบางอย่างไว้ ข้าต้องรู้ให้ได้!"
 intrigue_scheme_lifestyle.3301.b:0 "ข้าจะมุ่งมั่นอยู่กับเป้าหมายของข้า"
 intrigue_scheme_lifestyle.3301.b.tt:0 "#F ด้วยความแม่นยำถึงชีวิต!#!"

 intrigue_scheme_lifestyle.3302.t:0 "ความลับของ [target.GetTitleAsNamePossessiveNoTooltip]"
 intrigue_scheme_lifestyle.3302.desc_murder:0 "สายลับของข้าสังเกตเห็นความน่าสงสัย — สัญญาณ — หนึ่งแล้วอีกเล่า และไม่นานนักภาพก็เปิดเผยออกมา [ROOT.Char.Custom2('DescriptorNegative', SCOPE.sC('target'))] [target.GetTitledFirstName] สังหาร [target.GetHerHis] [target.Custom2('RelationToMe', SCOPE.sC('secret_to_reveal_target'))] [secret_to_reveal_target.GetTitledFirstName]!"
 intrigue_scheme_lifestyle.3302.desc_lover:0 "สายลับของข้าสังเกตเห็นความน่าสงสัย — สัญญาณ — หนึ่งแล้วอีกเล่า และใช้เวลาไม่นานก่อนที่ภาพจะเปิดเผยออกมา: [secret_to_reveal_target.GetTitledFirstName] คือชู้รักของ [target.GetTitledFirstName]!"
 intrigue_scheme_lifestyle.3302.desc_pregnancy:0 "สายลับของข้าสังเกตเห็นความน่าสงสัย — สัญญาณ — หนึ่งแล้วอีกเล่า และใช้เวลาไม่นานก่อนที่ภาพจะเปิดเผยออกมา: [secret_to_reveal_target.GetTitledFirstName] กำลังตั้งครรภ์บุตรของ [target.GetTitledFirstNamePossessive]!"
 intrigue_scheme_lifestyle.3302.desc_child:0 "สายลับของข้าสังเกตเห็นความน่าสงสัย — สัญญาณ — หนึ่งแล้วอีกเล่า และใช้เวลาไม่นานก่อนที่ภาพจะเปิดเผยออกมา: [secret_to_reveal_target.GetTitledFirstName] คือบุตรของ [target.GetTitledFirstName] และ [target.GetHerHis] [target.Custom2('RelationToMe', SCOPE.sC('secret_to_reveal_owner'))] [secret_to_reveal_owner.GetTitledFirstName]!"
 intrigue_scheme_lifestyle.3302.desc_fallback:0 "สายลับของข้าสังเกตเห็นความน่าสงสัย — สัญญาณ — หนึ่งแล้วอีกเล่า และใช้เวลาไม่นานก่อนที่ภาพจะเปิดเผยออกมา: [target.GetTitledFirstName] มีบางอย่างที่ต้องปิดบังจริงๆ!"
 intrigue_scheme_lifestyle.3302.a:0 "โอ้ นี่มันดีจริงๆ!"
 intrigue_scheme_lifestyle.3302.a.tt:0 "#F ข้าสามารถขู่กรรโชก [target.GetHerHim] หรือบังคับให้ [target.GetHerHim] ทำตามคำสั่งของข้า หรือ #EMP อะไรก็ได้#!!#!"

 intrigue_scheme_lifestyle.3401.t:0 "ช่องทางเข้า"
 intrigue_scheme_lifestyle.3401.desc:1 "[target.GetTitledFirstNamePossessive] [target.Custom2('RelationToMe', SCOPE.sC('courtier_to_fool'))] [courtier_to_fool.GetTitledFirstName] คือ [ROOT.Char.Custom2('RelationDescriptor', SCOPE.sC('courtier_to_fool'))] [courtier_to_fool.GetWomanMan] และเมื่อข้าพบว่าตนเองอยู่ร่วมกับ [courtier_to_fool.GetHerHis] ในตอนแรกข้าระมัดระวังตัว อย่างไรก็ตาม ไม่นานข้าก็ตระหนักว่า [courtier_to_fool.GetSheHe] ไม่ได้รังเกียจการอยู่ร่วมกับข้าอย่างที่ข้าคิดไว้ในตอนแรก..."
 intrigue_scheme_lifestyle.3401.a:0 "โปรดเถิด สหายข้า เล่าเรื่องของท่านให้ข้าฟังหน่อย!"
 intrigue_scheme_lifestyle.3401.a.tt:0 "#F ข้าคือหมาป่าในคราบลูกแกะ กำลังเข้าใกล้เหยื่อของข้า...!#!"
 intrigue_scheme_lifestyle.3401.b:1 "เรื่องนี้เป็นเรื่องระหว่าง [target.GetFirstNameNoTooltip] กับข้า"
