l_english: 
 bastardy_pregnancy_announcement_tooltip:0 "เป็นที่รู้กันทั่วหล้าถึงชาติกำเนิดอันแท้จริงของทารก"

 secret_bastard.0001.t:0 "สายเลือดอันคลุมเครือ"
 secret_bastard.0001.real_father:0 "ราชสำนักของ[mother.GetTitledFirstNamePossessive] กำลังเฉลิมฉลองการประสูติของบุตร[mother.GetHerHis] ดูเหมือนจะไม่ตระหนักถึงความจริง เด็กที่พักผ่อนอยู่ในอ้อมแขน[mother.GetHerHis] นั้นไม่ใช่บุตรของ[assumed_father.GetTitledFirstNamePossessive] อย่างแท้จริง แต่เป็นของข้า!"
 secret_bastard.0001.real_father.no_assumed_father:0 "เบื้องหลังฉากหน้าของการเฉลิมฉลอง ข่าวลือแพร่สะพัดในราชสำนักของ[mother.GetTitledFirstNamePossessive] หลังจากการประสูติของบุตร[mother.GetHerHis] หากพวกเขารู้สิ่งที่ข้ารู้ ว่าทารกที่พักผ่อนอยู่ในอ้อมแขน[mother.GetHerHis] นั้น แท้จริงแล้วเป็นของข้า..."
 secret_bastard.0001.real_father.multiple:0 "ราชสำนักของ[mother.GetTitledFirstNamePossessive] กำลังเฉลิมฉลองการประสูติของบุตร[mother.GetHerHis] หลายคน ดูเหมือนจะไม่ตระหนักถึงความจริง เด็กๆ ที่พักผ่อนอยู่ในอ้อมแขน[mother.GetHerHis] นั้นไม่ใช่บุตรของ[assumed_father.GetTitledFirstNamePossessive] อย่างแท้จริง แต่เป็นของข้า!"
 secret_bastard.0001.real_father.no_assumed_father.multiple:0 "เบื้องหลังฉากหน้าของการเฉลิมฉลอง ข่าวลือแพร่สะพัดในราชสำนักของ[mother.GetTitledFirstNamePossessive] หลังจากการประสูติของบุตร[mother.GetHerHis] หลายคน หากพวกเขารู้สิ่งที่ข้ารู้ ว่าทารกที่พักผ่อนอยู่ในอ้อมแขน[mother.GetHerHis] นั้นเป็นของข้า..."
 secret_bastard.0001.assumed_father:0 "[mother.GetTitledFirstName], [ROOT.Char.Custom2('RelationToMe', mother)] ของข้า, กอดทารกแรกเกิดของ [mother.GetHerHis] ไว้แนบอก นี่คงเป็นช่วงเวลาแห่งความปิติยินดี หากข้าไม่รู้ความจริง\n\nหาใช่บุตรของข้าที่นางกอดไว้แนบอกไม่ แต่เป็นเลือดเนื้อเชื้อไขของ [real_father.GetTitledFirstName]!"
 secret_bastard.0001.assumed_father.multiple:0 "[mother.GetTitledFirstName], [ROOT.Char.Custom2('RelationToMe', mother)] ของข้า, กอดทารกแรกเกิดทั้งหลายของ [mother.GetHerHis] ไว้แนบอก นี่คงเป็นช่วงเวลาแห่งความปิติยินดี หากข้าไม่รู้ความจริง\n\nหาใช่บุตรทั้งหลายของข้าที่นางกอดไว้แนบอกไม่ แต่เป็นเลือดเนื้อเชื้อไขของ [real_father.GetTitledFirstName]!"
 secret_bastard.0001.family_of_mother:0 "[mother.GetTitledFirstName], [ROOT.Char.Custom2('RelationToMe', mother)] ของข้า, ประคองทารกแรกเกิดผู้งดงามไว้ในอ้อมแขน ทว่า ข้าอดรู้สึกไม่สบายใจมิได้ เมื่อรู้ถึงสายเลือดที่แท้จริงของ [child.Custom('GetDaughterSon')] ของ [mother.GetHerHis] ทารกมิได้เกิดจากการสมรสของ [ROOT.Char.Custom2('RelationToMe', mother)] ของข้ากับ [assumed_father.GetTitledFirstName], หาก แต่เกิดจากสัมพันธ์สวาทอันมิชอบด้วย [real_father.GetTitledFirstName]!\n\nจะเกิดอะไรขึ้นกับ [mother.GetHerHim] และ [ROOT.Char.Custom2('RelationToMe', child)] ของข้า หากความจริงถูกเปิดเผย?"
 secret_bastard.0001.family_of_mother.multiple:0 "[mother.GetTitledFirstName], [ROOT.Char.Custom2('RelationToMe', mother)] ของข้า, ประคองทารกแรกเกิดทั้งหลายผู้งดงามไว้ในอ้อมแขน ทว่า ข้าอดรู้สึกไม่สบายใจมิได้ เมื่อรู้ถึงสายเลือดที่แท้จริงของพวกเขา ทารกทั้งหลายมิได้เกิดจากการสมรสของ [ROOT.Char.Custom2('RelationToMe', mother)] ของข้ากับ [assumed_father.GetTitledFirstName], หาก แต่เกิดจากสัมพันธ์สวาทอันมิชอบด้วย [real_father.GetTitledFirstName]!\n\nจะเกิดอะไรขึ้นกับ [mother.GetHerHim] และเหล่าทารก หากความจริงถูกเปิดเผย?"
 secret_bastard.0001.family_of_real_father:0 "[mother.GetTitledFirstName] และราชสำนัก[mother.GetHerHis] กำลังเฉลิมฉลองการประสูติของบุตรของ[assumed_father.GetTitledFirstNamePossessive] แต่หากความจริงเป็นที่รู้กัน การเฉลิมฉลองอาจจะเงียบเหงากว่านี้\n\nทารกที่[mother.GetFirstName] กอดไว้แนบอก[mother.GetHerHis] คือบุตรนอกสมรสของ[ROOT.Char.Custom2('RelationToMe', SCOPE.sC('real_father'))]ของข้า [real_father.GetTitledFirstName]!"
 secret_bastard.0001.family_of_real_father.multiple:0 "[mother.GetTitledFirstName] และราชสำนัก[mother.GetHerHis] กำลังเฉลิมฉลองการประสูติของบุตรของ[assumed_father.GetTitledFirstNamePossessive] หลายคน แต่หากความจริงเป็นที่รู้กัน การเฉลิมฉลองอาจจะเงียบเหงากว่านี้\n\nทารกที่[mother.GetFirstName] กอดไว้แนบอก[mother.GetHerHis] คือบุตรนอกสมรสของ[ROOT.Char.Custom2('RelationToMe', SCOPE.sC('real_father'))]ของข้า [real_father.GetTitledFirstName]!"
 secret_bastard.0001.family_of_assumed_father:0 "ราชสำนักของ[ROOT.Char.Custom2('RelationToMe', SCOPE.sC('assumed_father'))]ของข้า [father.GetTitledFirstName] และ[SCOPE.Char.Custom2('RelationToMe', mother)][father.GetHerHis] [mother.GetTitledFirstName] กำลังเฉลิมฉลองการประสูติของบุตรคนใหม่ของพวกเขา บรรยากาศอาจจะหม่นหมองลงหากความจริงเป็นที่รู้กันอย่างกว้างขวาง อย่างไรก็ตาม\n\nบุตรของ[mother.GetFirstNamePossessive] แท้จริงแล้วคือบุตรนอกสมรสของ[real_father.GetTitledFirstName]! ช่างเป็นความอัปยศที่จะนำมาสู่ตระกูลของเราหากสายเลือดที่แท้จริงของเด็กเป็นที่รู้กัน..."
 secret_bastard.0001.family_of_assumed_father.multiple:0 "ราชสำนักของ[ROOT.Char.Custom2('RelationToMe', SCOPE.sC('assumed_father'))]ของข้า [father.GetTitledFirstName] และ[SCOPE.Char.Custom2('RelationToMe', mother)][father.GetHerHis] [mother.GetTitledFirstName] กำลังเฉลิมฉลองการประสูติของบุตรคนใหม่ของพวกเขาหลายคน บรรยากาศอาจจะหม่นหมองลงหากความจริงเป็นที่รู้กันอย่างกว้างขวาง อย่างไรก็ตาม\n\nบุตรของ[mother.GetFirstNamePossessive] แท้จริงแล้วคือบุตรนอกสมรสของ[real_father.GetTitledFirstName]! ช่างเป็นความอัปยศที่จะนำมาสู่ตระกูลของเราหากสายเลือดที่แท้จริงของเด็กๆ เป็นที่รู้กัน..."
 secret_bastard.0001.other:0 "การเฉลิมฉลองบุตรที่เพิ่งเกิดใหม่ของ[mother.GetTitledFirstNamePossessive] เพิ่งเริ่มต้นขึ้น แต่บรรยากาศคงจะแตกต่างไปมากหากราชสำนัก[mother.GetHerHis] รู้ความจริง\n\nเด็กที่[mother.GetSheHe] อุ้มอยู่ในอ้อมแขน[mother.GetHerHis] ไม่ใช่ผลจากการสมรสของเธอกับ[assumed_father.GetTitledFirstName] แต่เป็นบุตรนอกสมรสของ[real_father.GetTitledFirstName]!"
 secret_bastard.0001.other.multiple:0 "การเฉลิมฉลองบุตรที่เพิ่งเกิดใหม่ของ[mother.GetTitledFirstNamePossessive] หลายคนเพิ่งเริ่มต้นขึ้น แต่บรรยากาศคงจะแตกต่างไปมากหากราชสำนัก[mother.GetHerHis] รู้ความจริง\n\nเด็กๆ ที่[mother.GetSheHe] อุ้มอยู่ในอ้อมแขน[mother.GetHerHis] ไม่ใช่ผลจากการสมรสของเธอกับ[assumed_father.GetTitledFirstName] แต่เป็นบุตรนอกสมรสของ[real_father.GetTitledFirstName]!"
 secret_bastard.0001.a:0 "หากเพียง แต่พวกเขารู้..."

 secret_bastard.0002.t:0 "ผู้มีชาติกำเนิดอันคลุมเครือ"
 secret_bastard.0002.real_father:0 "[mother.GetTitledFirstName] กำลังแบกรับภาระของการให้กำเนิดบุตรนอกสมรสที่ไร้บิดา\n\nมันช่างเลวร้ายสำหรับ [mother.GetWomanMan] ที่ยังมิได้สมรสและบุตรของ [mother.GetHerHis], ทว่า ข้ามิอาจปล่อยให้เป็นที่รู้กันได้ว่าข้าคือบิดาที่แท้จริง\n\nโอ้, จะเกิดอะไรขึ้นกับ [child.Custom('GetDaughterSon')] ของข้า..."
 secret_bastard.0002.family_of_mother:0 "[ROOT.Char.Custom2('RelationToMe', mother)]ของข้า [mother.GetTitledFirstName] ได้ให้กำเนิดบุตร ผู้ถูกสาปให้ต้องทนใช้ชีวิตในฐานะบุตรนอกสมรสที่ไร้บิดา\n\nมันนำความอัปยศมาสู่ครอบครัวของเรา แต่[real_father.GetTitledFirstName] จนถึงขณะนี้ยังไม่เต็มใจที่จะก้าวออกมาในฐานะบิดาของทารกของ[mother.GetFirstNamePossessive] หากเขารู้เรื่องด้วยซ้ำ..."
 secret_bastard.0002.family_of_real_father:0 "บุตรแรกเกิดของ[mother.GetTitledFirstNamePossessive] เป็นที่รู้จักกันอย่างกว้างขวางว่าเป็นบุตรนอกสมรสที่ไร้บิดา แต่ข้ารู้ความจริง คือ[ROOT.Char.Custom2('RelationToMe', SCOPE.sC('real_father'))]ของข้า [real_father.GetTitledFirstName] ผู้เป็นบิดาของเด็กที่ตอนนี้พักผ่อนอยู่ในอ้อมแขนของเธอ! ข้าทำได้เพียงภาวนาให้[real_father.GetFirstName] รู้ว่าเขากำลังทำอะไรอยู่"
 secret_bastard.0002.family_of_real_father.dislike:0 "ความหวังของข้าช่างริบหรี่"
 secret_bastard.0002.other:0 "ข่าวลือแพร่สะพัดและข้อกล่าวหาที่กระซิบกระซาบกันไปทั่วว่าใครอาจเป็นบิดาของบุตรนอกสมรสแรกเกิดของ[mother.GetTitledFirstNamePossessive]\n\nแน่นอน พวกเขาไม่รู้สิ่งที่ข้ารู้ ว่าบิดาของเด็กคือ[real_father.GetTitledFirstName]!"
 secret_bastard.0002.a:0 "เรื่องอื้อฉาวที่รอวันปะทุ"
 secret_bastard.0002.b:0 ""เดี๋ยวก่อน! เด็กคนนั้น... เป็นของข้า!""

 secret_bastard.0010.t:0 "ถูกเปิดโปง"
 secret_bastard.0010.spouse_reveal:0 "[ROOT.Char.Custom2('RelationToMe', SCOPE.sC('father'))]ของข้าได้ค้นพบธรรมชาติที่แท้จริงของบุตรของข้า และบัดนี้[father.GetSheHe] ได้เปิดเผยความจริงต่อโลกแล้ว!"
 secret_bastard.0010.other_reveal:0 "ความลับที่ข้าเก็บงำไว้อย่างดีถูก [secret_exposer.GetTitledFirstName] ลากออกมาสู่แสงสว่าง! ครอบครัวของข้าลังเลที่จะพูดคุยกับข้า, และ [father.GetFirstName] ปฏิเสธที่จะสบตาข้า"
 secret_bastard.0010.desc:0 "\n\nจะเกิดอะไรขึ้นกับข้าและบุตรของข้า บัดนี้เมื่อทุกคนรู้ว่า [real_father.GetTitledFirstName] คือบิดาที่แท้จริง?"
 secret_bastard.0010.a:0 "ข้าหวั่นเกรงต่ออนาคตของเรา!"

 secret_bastard.001.opening:0 "[mother.GetTitledFirstName] [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('mother'))]ของข้า แสดงอาการตั้งครรภ์มาระยะหนึ่งแล้ว"

 secret_bastard.0011.t:0 "มลทินแห่งการเป็นบุตรนอกสมรส"
 secret_bastard.0011.spouse_exposer:0 "และถึงเวลาแล้วที่โลกจะได้รู้ความจริง [mother.GetSheHe|U] ได้ร่วมเตียงกับ [real_father.GetTitledFirstName], และ [real_father.GetSheHe] คือบิดาที่แท้จริง!"
 secret_bastard.0011.desc:0 "และข้าไม่เคยคิดเลยว่าบุตรนั้นจะเป็นของผู้อื่นได้นอกจากข้า\n\nอย่างไรก็ตาม, บัดนี้ [mother.GetSheHe] ได้สารภาพอย่างเปิดเผยต่อโลกว่านางได้ร่วมเตียงกับ [real_father.GetTitledFirstName], และเขาคือบิดาที่แท้จริง!"
 secret_bastard.0011.a:0 "นางทำ เช่นนี้ได้อย่างไร?"
 secret_bastard.0011.b:0 "คิดไม่ถึงว่า [mother.GetSheHe] เคยกล่าวคำสัตย์ปฏิญาณแห่งความภักดี"

 secret_bastard.0012.t:0 "เรื่องอื้อฉาว"
 secret_bastard.0012.dislike_desc:0 "และทุกคนคิดว่า [father.GetTitledFirstName], [mother.Custom2('RelationToMe', SCOPE.sC('father'))] ของนาง, คือบิดาของทารก บัดนี้เป็นที่ประจักษ์แล้วว่าผู้ที่จะเป็นบิดาที่แท้จริงหาใช่ใครอื่นนอกจาก [real_father.GetTitledFirstName]!\n\nโอ้ พระเจ้า, ช่างเป็นเรื่องอื้อฉาวเสียนี่กระไร!"
 secret_bastard.0012.like_desc:0 "และทุกคนคิดว่า [father.GetTitledFirstName], [mother.Custom2('RelationToMe', SCOPE.sC('father'))] ของนาง, คือบิดาของทารก บัดนี้เป็นที่ประจักษ์แล้วว่าผู้ที่จะเป็นบิดาที่แท้จริงหาใช่ใครอื่นนอกจาก [real_father.GetTitledFirstName]!\n\nหากเพียง แต่มันยังคงเป็นความลับได้!"
 secret_bastard.0012.a:0 "บัดนี้ทุกคนรู้แล้ว"

 secret_bastard.0013.t:0 "บุตรผู้นี้ของข้า"
 secret_bastard.0013.desc:0 "การลักลอบพบปะของข้ากับ [mother.GetTitledFirstName] ได้ ส่งผลให้เกิดบุตรขึ้นมา!"
 secret_bastard.0013.secret_exposer:0 "ข้าจำต้องประกาศให้รู้กันไปทั่ว บุตรที่ [mother.GetTitledFirstName] อุ้มท้องอยู่นั้นเป็นของข้า!\n\nบัดนี้ทุกคนรู้แล้ว"
 secret_bastard.0013.suspicious_desc:0 "และความสงสัยของข้าว่าตนเป็นบิดาของทารกก็เพิ่มพูนขึ้นพร้อมกับครรภ์ที่โตขึ้นของนาง\n\nบัดนี้ข้ารู้แน่ชัดแล้ว เช่นเดียวกับทั่วทั้งอาณาจักร บุตรผู้นั้นเป็นของข้า!"
 secret_bastard.0013.a:0 "เป็น เช่นนี้ย่อมดีกว่าเป็นแน่"

 secret_bastard.0014.t:0 "สัญญาณแห่งการทรยศ"
 secret_bastard.0014.desc:0 "แต่ข้าไม่เคยคิดเลยว่า[ROOT.Char.Custom2('RelationToMe', SCOPE.sC('real_father'))]ของข้าอาจมีส่วนเกี่ยวข้องใดๆ กับเรื่องนี้ ทว่าบัดนี้เป็นที่ประจักษ์แล้วว่า[real_father.GetFirstName] คือบิดาที่แท้จริงของบุตรในครรภ์ของ[mother.GetFirstNamePossessive]!"
 secret_bastard.0014.a:0 "ท่านทำ เช่นนี้ได้อย่างไร, [real_father.GetFirstNameNoTooltip]?"
 
 secret_bastard.1000.t:0 "สายเลือดที่เป็นที่รู้กัน"
 secret_bastard.1000.desc:0 "ไม่มีการปิดบังความลับหรือพยายามกลบเกลื่อนความจริงอีกต่อไป!\n\nเป็นที่รู้กันอย่างกว้างขวางแล้วว่าบุตรที่เติบโตอยู่ภายในกายข้ามีบิดาหาใช่ใครอื่นนอกจาก [real_father.Custom2('MyCharacterIntroductionNoComma' , ROOT.Char)]"
 secret_bastard.1000.real_father_reveal:0 "ไม่มีการปิดบังความลับหรือพยายามกลบเกลื่อนความจริงอีกต่อไป!\n\n[real_father.Custom2('MyCharacterIntroduction' , ROOT.Char)|U] ได้ประกาศให้รู้กันว่า [real_father.GetSheHe] คือบิดาของบุตรในครรภ์ของข้า"
 secret_bastard.1000.a:0 "บัดนี้ความจริงปรากฏแล้ว"
 secret_bastard.1000.a.tt:0 "[real_father.GetShortUINameNoTooltip] จะเป็นที่รู้จักในฐานะบิดาของบุตรข้าเมื่อทารกถือกำเนิด"

 secret_bastard.1001.t:0 "สายเลือดของหลาน"
 secret_bastard.1001.desc:0 "การที่ [mother.GetTitledFirstName], [ROOT.Char.Custom2('RelationToMe', mother)] ของข้า, กำลังตั้งครรภ์บุตรที่ปฏิสนธิผ่านสัมพันธ์อันเป็นบาปนั้นไม่ใช่ความลับ, อย่างไรเสีย [mother.GetSheHe] ก็มิใช่ [mother.GetWomanMan] ที่สมรสแล้ว\n\nถึงกระนั้น การได้รู้ว่า [real_father.GetTitledFirstName] คือ [real_father.GetMotherFather] ของทารก..."
 secret_bastard.1001.a:0 "เขาทำกับ [ROOT.Char.Custom2('RelationToMe', mother)] ของข้า เช่นนี้ได้อย่างไร?"

 secret_bastard.1002.t:0 "นอกสมรส"
 secret_bastard.1002.desc:0 "ไม่ใช่ความลับที่ [mother.GetTitledFirstName], [ROOT.Char.Custom2('RelationToMe', mother)] ของข้า, กำลังตั้งครรภ์บุตรที่ปฏิสนธิผ่านสัมพันธ์อันเป็นบาป, อย่างไรเสีย [mother.GetSheHe] ก็มิใช่ [mother.GetWomanMan] ที่สมรสแล้ว\n\nอย่างไรก็ตาม ผู้ที่เป็น [real_father.GetMotherFather] ของทารกนั้นเป็นปริศนามาจนบัดนี้ – [real_father.GetTitledFirstName] คือผู้ที่รับผิดชอบ!"

 secret_bastard.1003.t:0 "[mother.GetFirstNameNoTooltip] และข้า"
 secret_bastard.1003.desc:0 "การที่ [mother.GetTitledFirstName], [ROOT.GetCharacter.Custom2('RelationToMe' , mother)] ของข้า, กำลังตั้งครรภ์บุตรของข้านั้น บัดนี้เป็นที่รู้กันทั่วไปแล้ว\n\nการที่สัมพันธ์สวาทของเราอาจนำไปสู่สิ่งนี้เป็นความเป็นไปได้ที่ข้าตระหนักดี, แต่การต้องเผชิญหน้ากับความเป็นจริงของมัน..."

 secret_bastard.1004.desc:0 "[mother.GetTitledFirstName] ได้ตั้งครรภ์บุตรผู้มีสายเลือดไม่ปรากฏมาระยะหนึ่งแล้ว, แต่ข้าไม่เคยคิดเลยว่า [real_father.GetTitledFirstName], [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('real_father'))] ของข้า, อาจมีส่วนเกี่ยวข้องใดๆ กับเรื่องนี้\n\nอนิจจา, บัดนี้เป็นที่แน่ชัดปราศจากข้อสงสัยแล้วว่า แท้จริงแล้ว [real_father.GetSheHe] คือบิดา!"

 secret_bastard.2000.t:0 "เป็นที่รู้กัน"
 secret_bastard.2000.desc_opening:0 "[secret_exposer.Custom2('MyCharacterIntroduction', ROOT.Char)|U] ได้เปิดเผยความลับของข้าต่อโลกแล้ว!"
 secret_bastard.2000.desc_opening.me:0 "ในที่สุดก็ถึงเวลาที่โลกจะได้รู้"
 secret_bastard.2000.desc:0 "\n\nข้าได้เก็บงำสายเลือดที่แท้จริงของ [child.GetTitledFirstName], [child.Custom('GetDaughterSon')] ของข้า, เป็นความลับมาตั้งแต่ก่อน [child.GetSheHe] เกิด อย่างไรก็ตาม, สัมพันธ์สวาทของข้ากับ [real_father.GetTitledFirstName], บิดาที่แท้จริงของ [child.GetHerHis], บัดนี้เป็นที่รู้กันอย่างกว้างขวางแล้ว!"
 secret_bastard.2000.a:0 "จะเกิดอะไรขึ้นกับ [child.Custom('GetDaughterSon')] ของข้า?"
 
 secret_bastard.2001.t:0 "ความจริง"
 secret_bastard.2001.desc_opening.me:0 "ข้าได้เปิดเผยหลักฐานของข้าว่า"
 secret_bastard.2001.desc:0 "[child.GetFirstName] หาใช่บุตรที่เกิดในสมรสของข้าไม่"
 secret_bastard.2001.father:0 "อันที่จริงแล้ว, [real_father.Custom2('MyCharacterIntroduction', ROOT.Char)] คือบิดาที่แท้จริงของ [child.GetHerHis]!"
 secret_bastard.2001.change_lineage_lowborn.twin:0 "\n\nน่าละอายที่ต้องมาถึงจุดนี้, แต่ก็จำต้องให้รู้กันว่าพวกเขาคือบุตรนอกสมรสชั้นต่ำ"
 secret_bastard.2001.change_lineage_lowborn:0 "\n\nน่าละอายที่ต้องมาถึงจุดนี้, แต่ก็จำต้องให้รู้กันว่า [child.GetSheHe] คือบุตรนอกสมรสชั้นต่ำ"
 secret_bastard.2001.change_lineage.twin:0 "\n\nน่าละอายที่ต้องมาถึงจุดนี้, แต่ต้องให้รู้กันว่าพวกเขาคือบุตรนอกสมรสแห่งตระกูล [child.GetHouse.GetBaseName]"
 secret_bastard.2001.change_lineage:0 "\n\nน่าละอายที่ต้องมาถึงจุดนี้, แต่ต้องให้รู้กันว่า [child.GetSheHe] คือบุตรนอกสมรสแห่งตระกูล [child.GetHouse.GetBaseName]"
 secret_bastard.2001.keep_lineage.twin:0 "\n\nแม้จะเป็นไปไม่ได้ที่จะรู้ความจริง, สายเลือดของพวกเขาจะถูกปกคลุมไปด้วยข่าวลือและความไม่แน่นอนตลอดไป"
 secret_bastard.2001.keep_lineage:0 "\n\nแม้จะเป็นไปไม่ได้ที่จะรู้ความจริง, สายเลือดของ [child.GetHerHis] จะถูกปกคลุมไปด้วยข่าวลือและความไม่แน่นอนตลอดไป"
 secret_bastard.2001.a:0 "เป็น เช่นนี้ย่อมดีกว่า"
 secret_bastard.2001.b:0 "จำต้องให้รู้กัน"

 secret_bastard.2002.t:0 "ความลับที่ถูกเปิดโปง"
 secret_bastard.2002.i_am_exposer:0 "ข้าได้ประกาศให้รู้กันว่า [child.GetTitledFirstName] แท้จริงแล้วคือบุตรของข้า! นั่นหมายความว่าข้าได้สารภาพถึงการประพฤตินอกลู่นอกทางของข้ากับ [mother.GetTitledFirstName] ด้วย, แต่ความจริงต้องเป็นที่รู้กัน"
 secret_bastard.2002.other_exposer:0 "[secret_exposer.Custom2('MyCharacterIntroduction', ROOT.Char)|U] ได้เปิดเผยว่า [child.GetTitledFirstName] คือบุตรของข้า! ด้วยเหตุนี้, บัดนี้ทุกคนจึงรู้ถึงการประพฤตินอกลู่นอกทางของข้ากับ [mother.GetTitledFirstName]!"
 secret_bastard.2002.known:0 "\n\nผลกระทบต่อ [child.GetFirstNameNoTooltip] อาจร้ายแรง; ชีวิตที่มีสายเลือดคลุมเครือไม่ใช่เรื่องง่าย"
 secret_bastard.2002.not_known:0 "\n\nแน่นอนข้ารู้ว่าการลักลอบพบปะของข้าอาจ ส่งผลให้มีบุตรได้, แต่ข้าไม่เคยรู้เลย... นางไม่บอกข้าเรื่องนี้ก่อนได้อย่างไร?!"
 secret_bastard.2002.assumed_father_exists:0 "\n\nจะมีผู้ที่อ้างเสมอว่า[child.GetSheHe] คือบุตรที่เกิดโดยชอบธรรมของ[father.GetTitledFirstNamePossessive] แต่ไม่มีสิ่งใดที่พวกเขาสามารถทำได้เพื่อขจัดเงาแห่งความสงสัย"
 secret_bastard.2002.a:0 "ความลับแตกแล้ว!"
 secret_bastard.2002.b:0 "โอ้, [child.GetFirstNameNoTooltip]..."

 secret_bastard.2003.t:0 "ความลับอันดำมืด"
 secret_bastard.2003.i_exposed:0 "ในที่สุดก็ถึงเวลาประกาศความจริงให้รู้กัน"
 secret_bastard.2003.other_exposer:0 "ความลับที่ข้าแบกรับมานาน บัดนี้ถูกเปิดโปงโดย [secret_exposer.Custom2('MyCharacterIntroductionNoComma', ROOT.Char)]"
 secret_bastard.2003.known:1 "ความจริงที่ว่า [real_father.GetTitledFirstName] คือบิดาที่แท้จริงของข้า, และไม่ใช่ [father.GetTitledFirstName] ดังที่ [mother.Custom('MotherFather')] ของข้าอยากให้ทุกคนเชื่อ, ในที่สุดก็เป็นที่รู้กันทั่วไปแล้ว"
 secret_bastard.2003.not_known:1 "ข้าเป็นบุตรนอกสมรสรึ?! [father.GetTitledFirstName], [father.GetWomanMan] ที่ข้าเติบโตมาโดยคิดว่าเป็นบิดาของข้า, ไม่มีความเกี่ยวข้องทางสายเลือดกับข้าเลย! [secret_exposer.Custom2('MyCharacterIntroduction', ROOT.Char)|U] ได้เปิดเผยว่า [father.Custom('MotherFather')] ที่แท้จริงของข้า เห็นได้ชัดว่าเป็น [real_father.GetTitledFirstName], และ [mother.GetTitledFirstName], [mother.Custom('MotherFather')] ของข้า, ไม่เคยบอกข้าเลยแม้ แต่น้อย"
 secret_bastard.2003.desc_ending_exposer:0 "\n\nข้าไม่อยากเชื่อเลยว่าบิดาข้— ว่า [father.GetTitledFirstName] จะเปิดเผยความลับนี้ต่อทุกคน!"
 secret_bastard.2003.desc_ending_known:0 "\n\nชีวิตของข้าจะไม่มีวันเหมือนเดิมอีกต่อไป!"
 secret_bastard.2003.desc_ending_not_known:0 "\n\nคิดไม่ถึงว่า [mother.Custom('MotherFather')] ของข้าจะทำเรื่อง เช่นนี้กับข้าได้!"
 secret_bastard.2003.a:0 "ช่างเป็นหายนะเสียนี่กระไร!"

 secret_bastard.2004.t:0 "สายเลือดอันสับสน"
 secret_bastard.2004.likes:0 "การที่ [child.GetTitledFirstName] เป็นบุตรนอกสมรสของ [mother.GetTitledFirstName] และ [real_father.GetTitledFirstName] เป็นความลับที่ข้ารับรู้เป็นการส่วนตัว, แต่บัดนี้คนอื่นๆ ก็รู้ เช่นกัน!\n\nยากที่จะเชื่อว่า [child.GetTitledFirstName] เป็นผลมาจากสัมพันธ์สวาทอันน่าละอาย เช่นนี้ ข้าได้ แต่หวังว่าการปลดเปลื้องความรู้สึกผ่านความจริงที่ถูกเปิดเผยจะเป็นผลดีต่อ [child.GetHerHim]"
 secret_bastard.2004.dislikes:0 "ในที่สุดความจริงก็ปรากฏ!\n\nการที่ [child.GetTitledFirstName] เป็นผลมาจากสัมพันธ์อันเป็นบาประหว่าง [real_father.GetTitledFirstName] และ [mother.GetTitledFirstName] คือสิ่งที่ทุกคนในราชสำนักกระซิบกระซาบกัน\n\n[child.GetSheHe|U] ประพฤติตนไม่เหมาะสมกับบุตรที่เกิดในสมรสมาโดยตลอด, และบัดนี้ [child.GetSheHe] จะได้รับการปฏิบัติอย่างเหมาะสมกับสถานะของ [child.GetHerHis] ในที่สุด"
 secret_bastard.2004.a:0 "น่าสงสาร [child.GetTitledFirstNameNoTooltip]!"
 secret_bastard.2004.b:0 "ลองนึกภาพความอัปยศอดสูที่ [child.GetFirstNameNoTooltip] ต้องเผชิญเถิด!"
 secret_bastard.2004.c:0 "น่าสงสาร [child.GetFirstNameNoTooltip] และ [child_twin.GetFirstNameNoTooltip]!"
 secret_bastard.2004.d:0 "ลองนึกถึงความอัปยศที่พวกเขาต้องรู้สึกดูสิ!"
 secret_bastard.2005.t:0 "ความลับที่ถูกเปิดโปง"
 secret_bastard.2005.alive:0 "[child.GetTitledFirstName] คือบุตรนอกสมรสของ [mother.GetTitledFirstName], [ROOT.Char.Custom2('RelationToMe', mother)] ของข้า, และ [real_father.GetTitledFirstName]!\n\nคิดไม่ถึงว่า [mother.GetSheHe] จะกระทำการอันน่าละอาย เช่นนี้ต่อ [father.GetTitledFirstName], ลับหลัง [father.GetHerHis] และคบชู้สู่ชาย"
 secret_bastard.2005.dead:0 "[child.GetTitledFirstName] คือบุตรนอกสมรสของ [mother.GetTitledFirstName], [ROOT.Char.Custom2('RelationToMe', mother)] ของข้า, และ [real_father.GetTitledFirstName]!\n\nคิดไม่ถึงว่า [father.GetTitledFirstName] ผู้ล่วงลับไปแล้ว จะถูก [mother.GetTitledFirstName] หลอกลวงด้วยวิธีอันชั่วช้า เช่นนี้"
 secret_bastard.2005.end:0 "\n\nข้าจะสามารถไว้วางใจ [mother.GetHerHim] ได้อีกต่อไปได้อย่างไร?"
 secret_bastard.2005.a:0 "[mother.GetSheHe|U] ไม่ซื่อสัตย์!"
 secret_bastard.3000.t:0 "ความลับที่ถูกเปิดโปง"
 secret_bastard.3000.married_known:0 ""ท่านมีบุตรนอกสมรสรึ?!"\nภรรยาของข้าเผชิญหน้าข้าด้วยความจริงอันน่าตกตะลึง, และข้าไม่มีคำตอบที่ดีจะให้\n\nข้ารู้อยู่แล้วว่า [child.GetTitledFirstName] เป็นผลมาจากการลักลอบพบปะของข้ากับ [mother.GetTitledFirstName], แต่การที่สายเลือดที่แท้จริงของ [child.GetHerHis] เป็นที่รู้กันแล้วนั้นเป็นเรื่องน่าประหลาดใจ ข้าควรทำ เช่นไร?"
 secret_bastard.3000.married_not_known:0 ""ท่านมีบุตรนอกสมรสรึ?!"\nภรรยาของข้าเผชิญหน้าข้าด้วยความจริงอันน่าตกตะลึง, และข้าไม่มีคำตอบที่ดีจะให้\n\nข้าพบว่าตนเองประหลาดใจไม่ต่างจากใครๆ, แม้ว่าแน่นอนข้ารู้ว่ามีความเสี่ยงที่มันจะเกิดขึ้น แต่การที่ [mother.GetTitledFirstName] ไม่บอกข้าถึงสายเลือดที่แท้จริงของ [child.GetTitledFirstName] มาก่อน... ข้าควรทำ เช่นไร?"
 secret_bastard.3000.known:0 "ความลับที่ว่า [child.GetTitledFirstName] คือบุตรของข้า พลันปรากฏอยู่บนริมฝีปากของทุกคน!\n\nข้ารู้อยู่แล้วว่า [child.GetFirstNameNoTooltip] เป็นผลมาจากการลักลอบพบปะของข้ากับ [mother.GetTitledFirstName], แต่ผลกระทบต่อ [child.GetFirstNameNoTooltip] อาจร้ายแรง การใช้ชีวิตในฐานะบุตรนอกสมรสไม่ใช่เรื่องง่าย"
 secret_bastard.3000.not_known:0 "ความลับที่ว่า [child.GetTitledFirstName] คือบุตรของข้า พลันปรากฏอยู่บนริมฝีปากของทุกคน!\n\nแม้ว่าข้าจะพบว่าตนเองประหลาดใจไม่ต่างจากใครๆ, แน่นอนข้ารู้ว่ามีความเสี่ยงที่มันจะเกิดขึ้น แต่การที่นางไม่บอกข้ามาก่อน..."
 secret_bastard.3000.a:0 "บัดนี้ทุกคนก็รู้ เช่นกัน!"
 secret_bastard.3000.b:0 "นี่คือหายนะ!"

 secret_bastard.3001.t:0 "ชาติกำเนิดที่แท้จริงของข้า"
 secret_bastard.3001.incest_marriage:0 "[real_father.GetTitledFirstName] คือ [real_father.Custom('MotherFather')] ของข้า!\n\nการได้รู้ความจริงเป็นความโล่งใจอย่างยิ่ง, แต่มันก็นำมา ซึ่ง... ความซับซ้อน [incest_spouse.GetTitledFirstName], [incest_spouse.Custom('WifeHusband')] ของข้า, คือ [real_father.Custom2('RelationToMe', SCOPE.sC('incest_spouse'))] ของ [real_father.GetFirstName] – ซึ่งหมายความว่า [incest_spouse.GetSheHe] ก็เป็น [incest_spouse.Custom('SisterBrother')] ของข้าด้วย!"
 secret_bastard.3001.known:0 "ความจริงที่ว่าข้าเกิดนอกพันธะการสมรสได้หลอกหลอนข้ามาทั้งชีวิต การที่รู้ว่า [real_father.GetTitledFirstName] คือบิดาของข้า, แต่ไม่เคยเอ่ยถึงมันเลย, เป็นภาระหนักที่ต้องแบกรับ\n\nบัดนี้เมื่อความลับเปิดเผย ข้ารู้สึกโล่งใจ!"
 secret_bastard.3001.not_known:0 "ความจริงที่ว่าข้าเกิดนอกพันธะการสมรสได้หลอกหลอนข้ามาตั้งแต่เกิด ข้าถูกทั้งรังเกียจและเยาะเย้ย, แต่ท่านแม่ของข้าปฏิเสธที่จะเปิดเผยชาติกำเนิดที่แท้จริงแก่ข้า ไม่ว่าข้าจะอ้อนวอนเพียงใด\n\n""เป็นการดีที่สุดที่จะไม่เอ่ยถึงเรื่อง เช่นนั้น""\n\nบัดนี้เมื่อข้ารู้ความจริง ข้าก็สามารถหายใจได้คล่องขึ้นในที่สุด, ความรู้ที่ว่า [real_father.GetTitledFirstName] คือบิดาของข้า มอบความสงบที่หลุดลอยไปจากเงื้อมมือข้ามานาน"
 secret_bastard.3001.a:0 "บัดนี้ความจริงเป็นที่รู้กันแล้ว!"
 secret_bastard.3001.b:0 "ในที่สุดข้าก็รู้ว่าใครคือบิดาของข้า!"
