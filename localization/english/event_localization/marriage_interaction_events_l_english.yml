l_english: 
 marriage_interaction.0001.desc.start:0 "ถึง [ROOT.Char.GetFullName],\n\nหลังจากพิจารณาอย่างถี่ถ้วนแล้ว ข้าพเจ้าได้ตัดสินใจที่จะถอน "
 marriage_interaction.0001.desc.liegetoliege:0 "การหมั้นหมายระหว่าง [actor.Custom2('RelationToMe', SCOPE.sC('rejecting_betrothed'))] ของข้าพเจ้า, [rejecting_betrothed.GetTitledFirstName], และ [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('rejected_betrothed'))] ของท่าน, [rejected_betrothed.GetTitledFirstName]."
 marriage_interaction.0001.desc.betrothedtobetrothed:0 "การหมั้นหมายของเรา"
 marriage_interaction.0001.desc.betrothedtoliege:0 "การหมั้นหมายของข้าพเจ้ากับ [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('rejected_betrothed'))] ของท่าน, [rejected_betrothed.GetTitledFirstName]."
 marriage_interaction.0001.desc.liegetobetrothed:0 "การหมั้นหมายของท่านกับ [actor.Custom2('RelationToMe', SCOPE.sC('rejecting_betrothed'))] ของข้าพเจ้า, [rejecting_betrothed.GetTitledFirstName]."
 marriage_interaction.0001.desc.end:0 "ข้าพเจ้าขออภัยในความไม่สะดวกใดๆ ที่การตัดสินใจของข้าพเจ้าอาจก่อให้เกิด และหวังเป็นอย่างยิ่งว่าสิ่งนี้จะไม่ทำลายความสัมพันธ์ระหว่างตระกูลของเรา"
 marriage_interaction.0001.a:0 "ช่างเป็นการดูหมิ่นอันร้ายแรง..."

 marriage_interaction.0002.desc:0 "ถึง [actor.Custom2('RelationToMe', SCOPE.sC('rejecting_betrothed'))] ของข้าพเจ้า [rejecting_betrothed.GetFullName],\n\nข้าพเจ้าได้ข้อสรุปว่าการสมรสที่รอดำเนินการของท่านกับ [rejected_betrothed.GetTitledFirstName] ไม่เป็นประโยชน์สูงสุดต่อตัวท่านหรือตระกูลของเรา ดังนั้น ข้าพเจ้าจึงตัดสินใจถอนการหมั้นหมาย" #<TO_REMOVE>
 marriage_interaction.0002.a:0 "อนิจจา" #<TO_REMOVE>

#Timeout notification when you are in charge of the betrothal of someone else
 marriage_interaction.0004.t:0 "การหมั้นหมายที่ถูกปล่อยให้เหี่ยวเฉา"
 marriage_interaction.0004.desc:0 "ข้อตกลงได้ทำขึ้นแล้ว และทุกอย่างก็เป็นไปตามระเบียบ จนกระทั่งถึงเวลาที่จะสรุปการสมรส ด้วยทั้งสองฝ่ายดูเหมือนจะพอใจที่จะแสร้งทำเป็นว่าข้อตกลงนั้นไม่เคยเกิดขึ้น ดูเหมือนไม่น่าเป็นไปได้ที่ [betrothed_1.GetTitledFirstName] และ [betrothed_2.GetTitledFirstName] จะได้สมรสกัน"
 marriage_interaction.0004.a:0 "นี่เป็นสิ่งที่ดีที่สุดแล้ว"

#Timeout notification for a betrothed when someone else is in charge of marrying them
 marriage_interaction.0005.t:0 "การหมั้นหมายที่ถูกปล่อยให้เหี่ยวเฉา"
 marriage_interaction.0005.desc:0 "แม้จะมีการเจรจาและการวางแผนอย่างรอบคอบ ดูเหมือนว่าข้าพเจ้าจะไม่ได้สมรสกับคู่หมั้นของข้าพเจ้า [other_betrothed.GetTitledFirstName] เลย แม้ว่าถึงเวลาที่จะต้องดำเนินการตามสัญญาการสมรสแล้ว แต่ก็ไม่มีฝ่ายใดดำเนินการเพื่อสรุปข้อตกลง"
 marriage_interaction.0005.a:0 "ใครจะรู้ว่าบัดนี้ข้าพเจ้าจะได้สมรสกับผู้ใด"

#Timeout notification for someone in charge of their own betrothal
 marriage_interaction.0006.t:0 "การหมั้นหมายที่ถูกปล่อยให้เหี่ยวเฉา"
 marriage_interaction.0006.desc:0 "แม้จะมีการเจรจาและการวางแผนอย่างรอบคอบ ดูเหมือนว่าข้าพเจ้าจะไม่ได้สมรสกับคู่หมั้นของข้าพเจ้า [other_betrothed.GetTitledFirstName] เลย แม้ว่าถึงเวลาที่จะต้องดำเนินการตามสัญญาการสมรสแล้ว แต่ก็ไม่มีฝ่ายใดดำเนินการเพื่อสรุปข้อตกลง"
 marriage_interaction.0006.a:0 "ท้ายที่สุดแล้ว ข้าพเจ้าจะได้สมรสกับผู้ใดกัน?"

 marriage_interaction.0008.t:0 "การหมั้นหมายถูกยกเลิกด้วยศรัทธา"
 marriage_interaction.0008.desc:0 "[betrothed_clergy.GetTitledFirstName] ได้อุทิศชีวิตของ [betrothed_clergy.GetHerHis] ให้แก่ [betrothed_clergy.GetFaith.HighGodName] – แม้จะมีการเจรจาและการวางแผนอย่างรอบคอบ ดูเหมือนว่า [betrothed_clergy.GetSheHe] จะไม่ได้สมรสกับ [betrothed_2.GetTitledFirstName] เลย "
 marriage_interaction.0008.a:0 "อนิจจา"

 marriage_interaction.0009.desc_clergy:0 "บัดนี้ข้าพเจ้าได้อุทิศชีวิตให้แก่ [betrothed_clergy.GetFaith.HighGodName] แล้ว ข้าพเจ้าจึงถูกห้ามมิให้สมรสและต้องทิ้งคู่หมั้น [betrothed_2.GetTitledFirstName] ไว้เบื้องหลัง ข้าพเจ้าหวังว่า [betrothed_2.GetSheHe] จะให้อภัยข้าพเจ้า"
 marriage_interaction.0009.desc:0 "[betrothed_clergy.GetTitledFirstName] ได้อุทิศชีวิตของ [betrothed_clergy.GetHerHis] ให้แก่ [betrothed_clergy.GetFaith.HighGodName] – แม้จะมีการเจรจาและการวางแผนอย่างรอบคอบ ดูเหมือนว่าข้าพเจ้าจะไม่ได้สมรสกับคู่หมั้นของข้าพเจ้าเลย"
 marriage_interaction.0009.a:0 "อนิจจา"
