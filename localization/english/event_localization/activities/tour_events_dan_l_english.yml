l_english: 
 tour_travel.3000.t:0 "ไม่มี[ROOT.Char.GetFaith.HouseOfWorshipPlural|U]หรือ?"
 tour_travel.3000.desc:0 "ข้าได้เยี่ยมเยียนหมู่บ้านแห่งหนึ่งขณะเดินทางผ่าน[ROOT.Char.GetCurrentLocation.GetNameNoTooltip] และใช้เวลาสนทนาเรื่องการสักการะในท้องถิ่นกับชาวนาผู้ศรัทธานามว่า [pious_peasant.GetName]\n\n"พวกเราไม่มีแม้ แต่[ROOT.Char.GetFaith.HouseOfWorship] ที่นี่เลยขอรับ หากต้องการย่างเท้าเข้าสู่เคหาสน์แห่ง[ROOT.Char.GetFaith.HighGodName|U] พวกเราต้องเดินทางเป็นวันๆ""
 tour_travel.3000.a:0 "เราอาจช่วยสร้าง[ROOT.Char.GetFaith.HouseOfWorship]อย่างง่ายขึ้นได้"
 tour_travel.3000.b:0 "ข้าจะสร้าง[ROOT.Char.GetFaith.HouseOfWorship]อันยิ่งใหญ่ ณ ที่แห่งนี้"
 tour_travel.3000.c:0 ""เช่นนั้นพวกเจ้าก็ต้องเดินต่อไป""

 tour_travel.3001.t:0 "พิธีอันกะทันหัน"
 tour_travel.3001.desc:0 "เราได้หยุดพักใน[ROOT.Char.GetCurrentLocation.GetNameNoTooltip] ณ หมู่บ้านเล็กๆ แห่งหนึ่ง ข้าพยายามนั่งร่วมงานเลี้ยงเกือบตลอดงานก่อนจะตระหนักว่ามีบางอย่างผิดปกติ\n\nข้าตระหนักได้ว่า [marriage_mother.GetName] ผู้ ซึ่งพูดถึง[marriage_candidate.Custom('GetDaughterSon')]ของนาง [marriage_candidate.GetName] ไม่หยุดหย่อนนั้น ไม่ใช่แค่กำลังโอ้อวด แต่กำลัง #EMP เสนอขาย#!.\n\n"เมื่อท่านทั้งสอง แต่งงานกัน ทุกสิ่งจะสมบูรณ์แบบ!" [marriage_mother.GetNameNoTooltip] กล่าว ดวงตาเปล่งประกายด้วยความภาคภูมิใจ"
 tour_travel.3001.desc.drunkard:0 "ข้าตื่นขึ้นมาในอาการมึนงง, ศีรษะข้าปวดตุบ ๆ, หูของข้าอื้ออึง, และแสงสว่างก็ทิ่มแทงเข้ามาในมโนสำนึกของข้าราวกับคมมีด ปากของข้าแห้งผากราวกับทะเลทราย, และก่อนที่ข้าจะทันได้ครางขอน้ำ, ข้าก็เห็นหญิงชาวบ้านแปลกหน้ายืนอยู่ข้างเตียงพร้อมกับเหยือกน้ำ\n\n"น้ำนี่เจ้าค่ะ, [ROOT.Char.Custom('FormOfAddressForLiege')], ท่านจำต้องใช้มันหลังจากค่ำคืนที่ท่านผ่านมา!"\n\nข้าพลิกตัวบนเตียงและเห็นคนแปลกหน้ากำลังนอนหลับอย่างเป็นสุขอยู่ข้างกายข้า\n\n"อย่างไรเสีย, มันก็ไม่ใช่วันที่ [marriage_candidate.Custom('DaughterSon')] ของข้าจะได้ แต่งงานกับ [ROOT.Char.GetTitleAsNameNoTooltip|U] กันทุกวันนี่นา!""
 tour_travel.3001.a:0 "ช่างเป็นความคิดที่วิเศษนัก"
 tour_travel.3001.a.drunkard:0 "#EMP ข้าทำอะไรลงไปนี่?!#!"
 tour_travel.3001.b:0 "ไม่ ข้าไม่ แต่งกับชาวนาสกปรกโสโครก"

 tour_travel.3002.t:0 "ราคาของชัยชนะ"
 tour_travel.3002.desc:0 ""[widow_peasant.Custom2( 'RelationToMeShort', widow_father )]ของข้า [widow_peasant.Custom2( 'RelationToMeShort', widow_husband )]ของข้า [widow_peasant.Custom2( 'RelationToMeShort', widow_son )]ของข้า ล้วนตายใน #EMP สงครามของท่าน#! ทั้งสิ้น" ชาวบ้านคนหนึ่งตะโกนด่าทอข้าข้ามลานหมู่บ้าน\n\n"เมื่อตอนที่ [battle_memory.GetSecondPerspectiveDescription] มันคือชัยชนะของท่าน แต่สำหรับข้า มันคือวันที่ครอบครัวข้าตายตกไปถึงสามชั่วคน"\n\nความโกรธแค้นของ[widow_peasant.GetHerHis|U]แปรเปลี่ยนเป็นน้ำตา และคำพูดต่อมาของ[widow_peasant.GetSheHe]ก็แผ่วเบาจนแทบไม่ได้ยิน\n\n"ท่านไม่ใช่[ROOT.Char.GetTitleAsNameNoTooltip|l]ของข้า""
 tour_travel.3002.a:0 ""ข้าไม่อาจนำพวกเขากลับมาได้ แต่บางทีทองคำอาจพอช่วยได้""
 tour_travel.3002.b:0 ""นั่นคือการเสียสละที่ข้ายินดีจะทำ""

 tour_travel.3003.t:0 "เหล่าสิ่งมีชีวิตน่ารังเกียจ"
 tour_travel.3003.desc:0 "ใน[ROOT.Char.GetCurrentLocation.GetNameNoTooltip] เราหยุดพูดคุยกับชาวนาคนที่ร้อยของวัน และท้องไส้ข้าปั่นป่วนเพียงแค่มองดูสิ่งมีชีวิตน่าสมเพชเหล่านี้\n\nฟันเหลืองและบิดเบี้ยว ดวงตาขุ่นมัวและว่างเปล่าซ่อนสมองเน่าเฟะที่ไม่รู้หนังสือ แต่ละคนล้วนแบกรับโรคภัยไร้นาม ซึ่ง ทำให้ใบหน้าเสียโฉมด้วยตุ่มหนองและรอยด่างนับไม่ถ้วน\n\nข้าไม่อาจใส่ใจแม้ แต่คำเดียวที่พวกมันพูดได้เลย"
 tour_travel.3003.a:0 "การเสแสร้งว่าใส่ใจพวกมันคือหน้าที่ของข้า"
 tour_travel.3003.b:0 "ข้าจะบอกพวกมันว่าข้าคิดอย่างไรกับพวกมัน"

 tour_travel.3004.t:0 "รูปปั้นอันอัปลักษณ์"
 tour_travel.3004.desc:0 "ข้าได้รับการเตือนล่วงหน้าว่าชาวบ้านแห่ง[ROOT.Char.GetCurrentLocation.GetNameNoTooltip]ได้ร่วมใจกันสร้างรูปปั้นของข้าขึ้น\n\nทว่าเมื่อข้ามาถึงและมองดูมัน ข้าไม่อาจประมวลผลสิ่งที่เห็นได้จริงๆ ไม่เพียง แต่รูปปั้นนั้นเป็นสิ่งที่อัปลักษณ์ที่สุดที่ข้าเคยเห็น แต่มันยังดูไม่เหมือนข้าเลยแม้ แต่น้อย!\n\nอย่างไรก็ตาม เมื่อข้าเหลือบมองไปรอบๆ ข้าเห็นเพียงใบหน้าที่ภาคภูมิใจกำลังยิ้มแย้มให้ข้า ไม่มีใครเห็นเลยหรือว่ามันแย่แค่ไหน?"
 tour_travel.3004.a:0 "นี่มัน... ยอดเยี่ยมมาก"
 tour_travel.3004.b:0 "นี่มันเรื่อง #EMP ตลก#! หรือไร!? ทุบทิ้งเสีย!"
 tour_travel.3004.c:0 "อันที่จริง มันค่อนข้างแม่นยำทีเดียว"

 tour_travel.3005.t:0 "อาชญากรรมที่คุ้นเคย"
 tour_travel.3005.desc:0 "ขณะเดินทางผ่าน[ROOT.Char.GetCurrentLocation.GetNameNoTooltip] ข้าผ่านนักโทษน่าสังเวชผู้หนึ่ง ถูกล่ามโซ่ไว้กับเสาราวกับสุนัข [criminal_peasant.GetSheHe] ร้องเรียกข้า วิงวอนขอความเมตตา\n\n"เจ้าก่ออาชญากรรมใด?" ข้าถามด้วยท่าทีวางอำนาจอันคู่ควรกับ[ROOT.Char.GetTitleAsNameNoTooltip]\n\n"ข้าถูกกล่าวหาว่าเป็น[criminal_secret.GetNameNoTooltip]: ข้อกล่าวหาที่โชคร้ายข้ามิอาจปฏิเสธได้"\n\nA few small beads of sweat appear on my brow, after all #EMP I#! am a [criminal_secret.GetNameNoTooltip] too."
 tour_travel.3005.a:0 "ปล่อยตัว[criminal_peasant.GetHerHim]!"
 tour_travel.3005.b:0 "ช่างเป็นอาชญากรรมที่เลวร้าย น่าสะพรึงกลัว..."

 tour_travel.3006.t:0 "ชีวิตของผู้ปกครอง"
 tour_travel.3006.desc:0 "ชาวนาหลายคนรวมตัวกันรอบตัวข้าเพื่อขอฟังเรื่องราวจากชีวิตข้า ข้าหวนนึกถึงสิ่งที่ข้าอาจเล่าให้พวกเขาฟังได้ และมีสองเรื่องผุดขึ้นมาในใจ เรื่องหนึ่ง เมื่อครั้ง[positive_memory.GetDescription] เป็นความทรงจำอันน่ารัก\n\nในทางกลับกัน เมื่อครั้ง[war_memory.GetDescription] เป็นเรื่องราวที่น่าเกรงขามกว่า ซึ่งน่าจะสร้างแรงบันดาลใจให้เกิดความภักดีและความกระตือรือร้น"
 tour_travel.3006.a:0 "ข้าจะเล่าเรื่องแรก"
 tour_travel.3006.b:0 "ทุกคนชอบเรื่องสงคราม"

 tour_travel.3007.t:0 "สถานเริงรมย์"
 tour_travel.3007.desc:0 "เมื่อเราหยุดพักในคืนนี้ ชาวบ้านคนหนึ่งเสนอที่จะพาชมเมืองท้องถิ่น\n\nข้าเพิ่งเข้าใจความหมายที่แท้จริงของคำพูดนั้นเมื่อข้าพบว่าตนเองอยู่ในส่วนลึกของสถานเริงรมย์\n\nทางซ้ายมือ ผู้คนกำลังเสพสมกันราวกับวันสิ้นโลก ทางขวามือ นักแสดงกำลังพยายามทำสิ่งที่ดูเหมือน #EMP [ROOT.Char.Custom('GetDescriptorManeuver')] [random_event_culture.GetNameNoTooltip] [ROOT.Char.Custom('GetManeuver')]#!."
 tour_travel.3007.a:0 "ข้าต้องออกไปเดี๋ยวนี้"
 tour_travel.3007.b:0 "ข้าอาจจะเข้าร่วมด้วยก็ได้"

 tour_travel.3010.t:0 "วีรชนท้องถิ่น"
 tour_travel.3010.desc:0 "ขณะที่เราเดินทางข้าม[shrine_province.Custom('GetTerrainTypePlural')] ลุยผ่าน[shrine_province.Custom('GetProvinceGroundDesc')] เราพบศาลเจ้าริมทางอันสมถะแห่งหนึ่ง มันถูกแกะสลักอย่างเรียบง่าย ประดับด้วย[shrine_province.GetCounty.GetFaith.ReligiousSymbol]ที่ส่วนหัว และด้านล่าง มีถ้อยคำที่ผุกร่อน:\n\n#EMP 'ณ ที่นี้ ร่างของนักบุญ [saint_name.GetFirstNameNoTooltip] แห่ง [shrine_province.GetCounty.GetTitle.GetDeJureLiege.GetNameNoTierNoTooltip] [saint_name.Custom('GetDaughterSon')]ผู้ศักดิ์สิทธิ์แห่ง [shrine_province.GetNameNoTooltip] ได้พักผ่อนอยู่'#!\n\nนักบุญ [saint_name.GetFirstNameNoTooltip]? แห่ง [shrine_province.GetCounty.GetTitle.GetDeJureLiege.GetNameNoTierNoTooltip]? ดูเหมือนว่าบุคคลสำคัญทางจิตวิญญาณในท้องถิ่นกำลังได้รับการอุปถัมภ์ในแถบนี้ เป็นผู้ที่ไม่ได้รับการรับรองจากเหล่า[ROOT.Char.GetFaith.AltPriestTermPlural]ชาว[ROOT.Char.GetFaith.GetAdjectiveNoTooltip]..."
 tour_travel.3010.a:0 "จงทำลายล้างความเชื่อนอกรีตนี้เสีย!"
 tour_travel.3010.b:0 "'นักบุญ [saint_name.GetFirstNameNoTooltip]'... ฟังดูเข้าทีดี"
 tour_travel.3010.c:0 "เราควรจะไปต่อได้แล้ว"
 cultural_acceptance_local_saint:0 "นักบุญท้องถิ่น"

 tour_travel.3020.t:0 "เดียวดายในความมืด"
 tour_travel.3020.desc:0 "เราหลบ[ROOT.Char.GetCurrentLocation.Custom('GetBadWeatherDesc')]ยามเย็นในโรงเตี๊ยมที่สะดวกสบาย หาก แต่คับแคบ จิบเครื่องดื่มขณะที่ลมพัดหวีดหวิวนอกหน้าต่าง สมาชิกในคณะเดินทางทยอยกลับเข้าห้องพักทีละคน\n\nข้ากำลังจมอยู่ในภวังค์เมื่อตระหนักว่าแสงเทียนใกล้จะดับ และข้าอยู่ตามลำพังกับ[ROOT.Char.Custom2('RelationToMeShort', love_professor)]ของข้า [love_professor.GetFirstName] มีแววตาแปลกๆ ในดวงตาของ[love_professor.GetHerHis]\n\nชั่วขณะหนึ่งผ่านไประหว่างเรา ก่อนที่[love_professor.GetSheHe]จะขมวดคิ้ว เลือกใช้คำพูดอย่างระมัดระวัง "ท่านรู้ไหม ข้าชื่นชมท่าน#EMP อย่างยิ่ง#! [ROOT.Char.GetFirstNameNoTooltip] — ข้าหมายถึง ท่าน[ROOT.Char.GetTitleAsNameNoTooltip]..." รอยยิ้มปรากฏขึ้นบนริมฝีปากของ[love_professor.GetHerHis]"
 tour_travel.3020.a:0 "มาเถิด คนอื่นๆ หลับหมดแล้ว"
 tour_travel.3020.c:0 "ฮ่า! เจ้าคิดว่าเจ้าเป็นใครกัน?!"
 tour_travel.3020.d:0 "ข้าควรจะพักผ่อนบ้าง..."

 tour_travel.3030.t:0 "ความจริงของเรื่องนี้"
 tour_travel.3030.desc:1 "เราเข้าใกล้หมู่บ้านเล็กๆ แห่งหนึ่ง ที่ ซึ่ง[wrongfully_accused.GetWomanMan]ผู้โศกเศร้ายืนถูกล่ามโซ่อยู่บนตะแลงแกง ฝูงชนกำลังรวมตัวกันที่ตีนตะแลงแกง\n\n"[ROOT.Char.GetTitleAsNameNoTooltip]! ท่าน[ROOT.Char.GetTitleAsNameNoTooltip]!" ชาวนาคนหนึ่งเดินโซซัดโซเซฝ่าฝูงชน ร้องไห้: "ได้โปรด! [wrongfully_accused.Custom('WifeHusband')]ของข้าบริสุทธิ์!""
 tour_travel.3030.framed:1 "[wrongfully_accused.GetSheHe|U] ไม่ได้ทำขอรับ, [ROOT.Char.Custom('FormOfAddressForLiege')]! ข้ารู้ดี!""
 tour_travel.3030.pinned:1 "เจ้าพวกปีศาจพวกนี้โยนบาปให้ผู้อื่น!""
 tour_travel.3030.wrongful:1 "มันเป็นเรื่องโกหก! ไม่มีใครเห็นด้วยซ้ำ!""
 tour_travel.3030.outro:0 "พวกเขาดึงตัว[accused_partner.GetHerHim]ออกไป พลางร้องโหยหวน "ไม่! #EMP [wrongfully_accused.GetFirstName]...!#!" ขณะที่[accused_partner.GetSheHe]ถูกลากไปตามถนน\n\nเจ้าหน้าที่โค้งคำนับอย่างอายๆ "ขอ อภัยขอรับ ท่าน[ROOT.Char.GetLadyLord]! โปรดอย่าใส่ใจ[accused_partner.GetHerHim]เลย [wrongfully_accused.GetWomanMan]ผู้นั้น#EMP มี#!ความผิด — ไม่ต้องกังวลเรื่องนั้นหรอกขอรับ...""
 tour_travel.3030.a:0 "ข้าอยากจะฟังข้อกล่าวหา..."
 tour_travel.3030.b.sadistic:0 "อา ข้าชอบการแขวนคอดีๆ!"
 tour_travel.3030.b:0 "ดำเนินการต่อไป"
 tour_travel.3030.c:0 "เจ้าโชคดีแล้ว เรามีเพชฌฆาตที่ดีที่สุดของ[ROOT.Char.GetPrimaryTitle.GetBaseNameNoTierPossessiveNoTooltip]อยู่ที่นี่!"
 tour_travel.3030.d:0 "ข้า... มาที่นี่เพื่ออภัยโทษให้[wrongfully_accused.GetHerHim]! และ[accused_partner.GetHerHim]!"

 tour_travel.3040.t:0 "หมู่บ้านอันโชคร้าย"
 tour_travel.3040.desc:0 "ขณะที่เราควบม้าเข้าสู่ชานหมู่บ้านเล็กๆ ตรงสี่แยก ชาวบ้านผู้หวาดกลัวคนหนึ่งเข้ามาหา ดวงตาของ[bandit_mayor.GetHerHis]เบิกกว้างด้วยความโล่งใจ\n\n"ขอบคุณสวรรค์! ท่านต้องช่วยพวกเรา ท่าน[ROOT.Char.GetLadyLord]ผู้ประเสริฐ!" คณะเดินทางของข้าและข้าแลกเปลี่ยนสายตากันอย่างสงสัย "พวกโจรหนีทัพได้ปล้นสะดมหมู่บ้านของเรามาหลายวันแล้ว พวกมันเอาไปเกือบทุกอย่าง!"\n\n"
 tour_travel.3040.own:0 "มันเป็นสถานที่เล็กๆ แต่ความไร้ระเบียบในดินแดนของข้านั้นไม่ดีเลย"
 tour_travel.3040.liege:0 "เช่นนั้น [ROOT.Char.GetTopLiege.GetTitledFirstName] ก็ไม่ได้รักษาความสงบใน..."
 tour_travel.3040.realm:0 "ดูเหมือนว่าดินแดนของ[ROOT.Char.GetLiege.GetTitledFirstNamePossessive]จะเกือบไร้กฎหมาย..."
