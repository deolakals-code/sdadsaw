 hunt.8590.t:0 "ถ้ำของ [activity.Custom('GetAnimalPlural')|U]"
 hunt.8590.desc:0 "เมื่อเราไปถึงยอดเนิน กลุ่มล่าของข้าพบถ้ำมืดที่ดูเหมือนไม่มีที่สิ้นสุด รอบๆ ทางเข้ามีร่องรอยที่ชัดเจนของ [activity.Custom('GetAnimalType')]!\n\nไม่ต้องสงสัยเลยว่า [activity.Custom('GetAnimalType')] หรือแม้ แต่ฝูง [activity.Custom('GetAnimalPlural')] เรียกที่นี่ว่าบ้าน! หากเรารออยู่ที่นี่จนถึงพลบค่ำ เราเกือบจะแน่นอนว่าจะพบเหยื่อของเรา"
 hunt.8590.a:0 "เช่นนั้นเราก็จะรอ!"
