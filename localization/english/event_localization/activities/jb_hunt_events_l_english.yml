l_english: 
 hunt.8000.t:0 "การอวดโฉม"
 hunt.8000.desc:0 "[swooning_attendee.GetName] ชื่นชมนกของข้ามาตั้งแต่เราเริ่มออกล่าครั้งแรก และข้าแทบจะโทษ [swooning_attendee.GetHerHim] ไม่ได้เลย มันช่างเป็นสัตว์ที่สง่างามและงดงาม เช่นนี้\n\nเราเข้าใกล้แม่น้ำสายเล็กๆ ที่อุดมสมบูรณ์และเต็มไปด้วยปลาขนาดใหญ่ และข้ารู้สึกว่านี่เป็นโอกาสอันสมบูรณ์แบบที่จะแสดงให้เห็นว่า [activity.Custom('GetRaptorType')] ของข้าทำอะไรได้บ้าง!"
 hunt.8000.a:0 "ทักษะการฝึกเหยี่ยวของข้าจะสร้างความประทับใจ!"
 hunt.8000.falcon_success:0 "[activity.Custom('GetRaptorType')] ของท่านจับปลาได้"
 hunt.8000.falcon_failure:0 "[activity.Custom('GetRaptorType')] ของท่านล้มเหลว"
 hunt.8000.b:0 "ข้าจะจับปลาด้วยตัวเอง!"
 hunt.8000.fist_success:0 "ท่านจับปลาด้วยมือเปล่าได้"
 hunt.8000.fist_failure:0 "ท่าน ทำให้ตัวเองกลายเป็นตัวตลก"
 hunt.8010.t:0 "งานเลี้ยงของ [activity.Custom('GetRaptorType')|U]"
 hunt.8010.desc:0 "[activity.Custom('GetRaptorType')] ของข้าดูเหมือนจะกระสับกระส่ายอยู่บนข้อมือของข้า จิกและเคาะข้าอย่างไม่หยุดหย่อน ไม่ต้องสงสัยเลยว่า สัตว์ร้ายตัวนี้กระตือรือร้นที่จะทะยานขึ้นสู่ท้องฟ้าอีกครั้งและนำเหยื่อสดๆ กลับมาให้ข้า!\n\nคงจะดีสำหรับนกที่จะได้ยืดปีก แต่ข้ายังไม่เห็นร่องรอยของสิ่งใดที่ควรค่าแก่การล่า ดังนั้นจึงเป็นไปได้ว่า [activity.Custom('GetRaptorType')] ของข้าจะกลับมามือเปล่า"
 hunt.8010.a:0 "บินไปเลย [activity.Custom('GetRaptorType')] ของข้า!"
 hunt.8010.falcon_success:0 "[activity.Custom('GetRaptorType')] ของท่านนำเหยื่อกลับมาได้"
 hunt.8010.falcon_failure:0 "$hunt.8000.falcon_failure$"
 hunt.8010.b:0 "มุ่งเน้นไปที่การติดตามร่องรอย"
 hunt.8020.t:0 "ผู้ให้ของขวัญ"
 hunt.8020.desc:0 "[activity.Custom('GetRaptorType')] ของข้าเกาะอยู่บนที่สูงและสอดส่องไปทั่วภูมิประเทศอย่างเฉียบคม ในพริบตา นกก็โฉบลงไปที่บางสิ่งและเริ่มคลุ้มคลั่งเมื่อถึงตัวเหยื่อ มันจิกและตะกุยบางอย่างบนพื้น แม้ว่าข้าจะมองไม่เห็นว่าคืออะไร\n\nข้ารีบไปยัง [activity.Custom('GetRaptorType')] ที่กำลังกรีดร้องอย่างบ้าคลั่ง และพบว่ามันไม่ได้กำลังจัดการกับซากสัตว์ แต่เป็นกองเหรียญและเครื่องประดับเล็กๆ น้อยๆ! มูลค่าดูเหมือนจะไม่ฟุ่มเฟือยนัก และข้ามั่นใจว่าข้าคงหาเจ้าของเดิมไม่พบ แม้ว่าจะต้องการก็ตาม"
 hunt.8020.a:0 ""เป็นการค้นพบที่ยอดเยี่ยม สหายมีปีกของข้า!""
 hunt.8020.b:0 ""ทรัพย์สมบัติเหล่านี้เป็นของ [ROOT.Char.WealthGodName]""
 hunt.8030.t:0 "การติดตาม [activity.Custom('GetRaptorType')|U]"
 hunt.8030.desc:0 "[activity.Custom('GetRaptorType')] ของข้าหายไปจากสายตาของข้าโดยสิ้นเชิง และเมื่อมองไปรอบๆ ภูมิประเทศ ข้าก็ไม่เห็นอะไรเลย จากนั้น ข้าก็ได้ยินเสียงมันกรีดร้องเรียกหาข้า และพบว่ามันเกาะอยู่โดยมีเลือดหยดจากกรงเล็บ แม้ว่าจะไม่มีร่องรอยของสัตว์อื่นใดในบริเวณใกล้เคียง\n\nเห็นได้ชัดว่า [activity.Custom('GetRaptorType')] ของข้าเพิ่งต่อสู้กับบางสิ่งที่ใหญ่เกินกว่าจะรับมือได้ด้วยตัวเอง และมันต้องอยู่ใกล้ๆ นี้!"
 hunt.8030.a:0 "ไปหาสัตว์ร้ายตัวนั้นกันเถอะ!"
 hunt.8030.success:0 "ท่านมีความคืบหน้าอย่างมาก"
 hunt.8030.failure:0 "ท่านมีความคืบหน้าเล็กน้อย"
 hunt.8030.b:0 ""ตามรอยมันไป ข้าจะตามไปหลังจากพักสักครู่""
 hunt.8040.t:0 "ถุงมือนำโชค"
 hunt.8040.desc:0 "[glove_salesman.GetName] เป็นดาวเด่นของการล่าครั้งนี้ กรงเล็บ [activity.Custom('GetRaptorType')] ของ [glove_salesman.GetHerHis] หยดเลือดสดสีแดงอยู่เสมอ มากเสียจนถุงมือของ [glove_salesman.GetHerHis] ดูเหมือนจะเปื้อนสีแดงเข้มถาวร ข้าอดไม่ได้ที่จะสอบถามว่า [glove_salesman.GetSheHe] ทำอะไรเพื่อฝึกนกล่าเหยื่อที่เชื่องและเชี่ยวชาญ เช่นนี้ และ [glove_salesman.GetSheHe] ก็แค่หัวเราะ\n\n"ข้าอยากจะบอกท่านว่าเป็นการฝึกที่ดีของข้า แต่พูดตามตรง ถุงมือของข้าได้รับพรจาก [glove_salesman.GetFaith.FateGodName] ข้ายินดีที่จะมอบมันให้ หากได้ราคาที่เหมาะสม""
 lucky_falconry_glove:0 "ถุงมือฝึกเหยี่ยวล่าเหยื่อนำโชค"
 lucky_falconry_glove_desc:0 "เชื่อกันว่าถุงมือฝึกเหยี่ยวล่าเหยื่อนี้จะนำโชคดีมาสู่ผู้สวมใส่ในการล่าสัตว์และการไล่ตามทางทหารอื่นๆ"
 hunt.8040.a:0 "ข้าต้องได้มันมา!"
 hunt.8040.b:0 "ข้าไม่ต้องการโชค"
 hunt.8040.c:0 ""ข้าสามารถเสนอ #EMP ราคาที่เหมาะสม#! ได้""
 hunt.8050.t:0 "พบร่องรอยแล้ว!"
 hunt.8050.desc:0 "อีกครั้งที่ข้าพบว่าตัวเองอยู่ในป่า ค้นหา [activity.Custom('GetAnimalType')|U] [activity.Custom('GetLegendaryColor')|U] ที่หาตัวจับยาก และข้ายังไม่เห็นร่องรอยของมันแม้ แต่น้อย นั่นคือ จนกระทั่งข้าเห็นรอยเท้าสัตว์ชุดหนึ่งที่นำทางออกไปไกลจากเส้นทาง\n\n[m_hunt.GetName] คว้าแขนข้าอย่างแรง และดึงข้าออกไป [m_hunt.GetSheHe|U] รับรองกับข้าว่านี่ไม่ใช่รอยเท้าของสัตว์ร้ายในตำนาน แต่เป็น [activity.Custom('GetAnimalType')] ธรรมดา"
 hunt.8050.a:0 "ตามรอยเท้าไป ไม่ว่าจะ อย่างไรก็ตาม"
 legendary_animal_close_tt:0 "รอยเท้านำท่านเข้าใกล้เป้าหมายมากขึ้น"
 legendary_animal_no_trace_tt:0 "รอยเท้านำไปสู่ที่ใดเลย"
 hunt.8050.b:0 ""ข้าคิดว่าเจ้าพูดถูก""
 hunt.8060.t:0 "ระวัง!"
 hunt.8060.desc:0 "เรากำลังมีความคืบหน้าในการติดตาม [activity.Custom('GetAnimalType')|U] [activity.Custom('GetLegendaryColor')|U] เมื่อเราถูกขัดจังหวะโดย [eccentric_hunter_scope.GetWomanMan] ที่ซูบซีดและอดนอน\n\n"ระวัง! ระวังสัตว์ร้าย! ข้าตามหา [activity.Custom('GetAnimalType')|U] [activity.Custom('GetLegendaryColor')|U] มาหลายปีแล้ว ทั่วทั้ง [ROOT.Char.GetCurrentLocation.GetTerrain.GetNameNoTooltip|l]! มันดุร้าย และกระหายเพียงเนื้อหนังมนุษย์! ออกไป นี่เป็นภาระที่ข้าต้องแบกรับ!""
 hunt.8060.a:0 ""บอกทุกอย่างที่เจ้ารู้มาให้ข้า""
 hunt.8060.success:0 "[eccentric_hunter_scope.GetSheHe|U] บอกทุกอย่างแก่ท่าน"
 hunt.8060.failure:0 "[eccentric_hunter_scope.GetSheHe|U] ไม่บอกอะไรแก่ท่านเลย"
 hunt.8060.b:0 ""เจ้ารู้จัก [ROOT.Char.GetCurrentLocation.GetTerrain.GetNameNoTooltip|l] เข้าร่วมกับข้าสิ!""
 hunt.8060.c:0 ""คนบ้า! ไปให้พ้นจากข้า!""
 hunt.8070.t:0 "ขึ้นคันศร, เล็ง..."
 hunt.8070.desc.intro:0 "ข้าเดินงุ่มง่ามอยู่ใน [ROOT.Char.GetCurrentLocation.GetTerrain.GetNameNoTooltip|l] มาหลายชั่วโมงแล้ว [activity.Custom('GetAnimalType')|U] [activity.Custom('GetLegendaryColor')|U] หลอกหลอนความฝันของข้า อยู่ไกลเกินเอื้อมเสมอ\n\nแต่แล้ว ข้าก็เห็นมัน! อยู่บนเนินดิน กำลัง [activity.Custom('GetAnimalSoundParticiple')] และยืนอวดโฉมกลางแสงแดด เย้ยหยันข้า!"
 hunt.8070.desc.mid.lunatic:0 "ข้าได้ยินเสียงกระซิบแผ่วเบาจากกลุ่มล่าของข้า พวกเขาคิดว่าข้าสังหารสัตว์ร้ายไม่ได้!"
 hunt.8070.desc.mid.paranoid:0 "มันดูไม่เหมือนจริง บางทีใครบางคนในคณะผู้ติดตามของข้าอาจสร้างของปลอมขึ้นมาหลอกข้า!"
 hunt.8070.desc.mid.fallback:0 "เป้าหมายแห่งความหมกมุ่นของข้านี้ไม่นำพาสิ่งใดมาให้ข้านอกจากความโกรธแค้นในทุกขณะที่ตื่น"
 hunt.8070.desc.outro:0 "ข้าอดไม่ได้ที่จะรู้สึกว่านี่เป็นเพียงความฝันอีกครั้ง แต่ข้าก็ตื่นเต็มตา"
 hunt.8070.a:0 "ยิงเลย!"
 hunt.8070.b:0 "ไม่ นี่ต้องไม่ใช่เรื่องจริง"
 hunt.8071.t:0 "... ยิง!"
 hunt.8071.desc.intro:0 "ข้าปล่อยลูกธนู และเฝ้าดูขณะที่มันพุ่งไปยังเนินดิน ข้าสาบานว่าได้ยินเสียงร้องด้วยความเจ็บปวด แต่ข้าไม่แน่ใจ\n\nข้ารีบไปยังต้นเสียง"
 hunt.8071.desc.outro:0 "และข้าพบสัตว์ร้ายกำลังวิ่งหนีลึกเข้าไปใน [ROOT.Char.GetCurrentLocation.GetTerrain.GetNameNoTooltip|l]! ทิ้งรอยเลือดไว้เบื้องหลัง แม้ว่าการยิงดูเหมือนจะไม่ ทำให้เจ้าตัวร้ายบาดเจ็บสาหัสก็ตาม"
 hunt.8071.a:0 "ตามรอยเลือดไป!"
 hunt.8072.desc.outro:0 "และพบร่างไร้วิญญาณของ [murder_target.GetNamePossessive] พร้อมลูกธนูปักอยู่ที่กะโหลกของ [murder_target.GetHerHis] ข้ารู้สึกเย็นยะเยือกไปทั้งตัวและแขนขาอ่อนแรง ข้าทำสิ่ง เช่นนี้ได้อย่างไร? [murder_target.GetSheHe|U] ดูไม่เหมือน [activity.Custom('GetAnimalType')|U] [activity.Custom('GetLegendaryColor')|U] เลย!"
 hunt.8072.a:0 "ข้ากำลังเสียสติ"
 hunt.8073.desc.outro:0 "และสิ่งที่เหลืออยู่คือลูกธนูที่ปักลึกลงไปในพื้นดิน ไม่มีรอยเท้า ไม่มีมูล ไม่มีร่องรอยของ [activity.Custom('GetAnimalType')] ใดๆ เลย มันเคยอยู่ที่นี่จริงหรือ หรือทั้งหมดอยู่ในหัวของข้า? มีสิ่งที่เรียกว่า [activity.Custom('GetAnimalType')] [activity.Custom('GetLegendaryColor')] อยู่จริงหรือ?"
 hunt.8073.a:0 "ข้าไม่ใช่คนบ้า!"
 hunt.8074.desc.outro:0 "และข้าพบซากของ [activity.Custom('GetAnimalType')] ธรรมดาตัวหนึ่ง โดยไม่มีร่องรอยของความเป็น [activity.Custom('GetLegendaryColor')] ใดๆ เลย บางทีอาจเป็นเพียงภาพลวงตา แต่การสังหารก็สะอาดหมดจดอย่างน้อย"
 hunt.8074.a:0 "การสังหารก็คือการสังหาร"
 hunt.8500.t:0 "บนยอดโลก"
 hunt.8500.desc:0 "ข้าปล่อย [activity.Custom('GetRaptorType')] ของข้า แต่แทนที่จะบินตรงไป สัตว์โง่เขลาตัวนี้กลับกระพือปีกไปยัง [ROOT.Char.GetCurrentLocation.Custom('GetTerrainTree')] ที่ใกล้ที่สุดและเกาะอยู่ที่นั่น\n\nมันมองกลับมาที่ข้าด้วยดวงตาที่ว่างเปล่าไร้ความรู้สึก ราวกับว่ามันไม่ได้เพิ่ง ทำให้ข้าอับอายต่อหน้ากลุ่มล่าทั้งหมด ข้าเรียกให้มันลงมาจากที่นั่น และไม่ได้รับอะไรตอบกลับมานอกจากเสียงหัวเราะที่กลั้นไว้ของเพื่อนนักล่าของข้า"
 hunt.8500.a:0 "ข้าจะปีนขึ้นไปเอง!"
 hunt.8500.success:0 "ท่านนำ [activity.Custom('GetRaptorType')] ของท่านกลับมาได้"
 hunt.8500.failure:0 "ท่านตกลงมา"
 hunt.8500.b:0 "ข้าเชื่อมั่นในการฝึก [activity.Custom('GetRaptorType')] ของข้า"
 hunt.8500.falcon_success:0 "[activity.Custom('GetRaptorType')] ของท่านกลับมาหาท่าน"
 hunt.8500.falcon_failure:0 "[activity.Custom('GetRaptorType')] ของท่านยังคงอยู่บนนั้น"
 hunt.8510.t:0 "ถูกโจมตี"
 hunt.8510.desc:0 "ไม่นานหลังจากหายเข้าไปในป่า ข้าได้ยินเสียง [activity.Custom('GetRaptorType')] ของข้ากรีดร้องและส่งเสียงร้องด้วยความทุกข์ทรมานอย่างยิ่ง ข้าวิ่งไปยังต้นเสียง และพบว่าเท้าของนกล่าเหยื่อผู้สูงศักดิ์ของข้าถูก [ROOT.Char.Custom('GetAnimalType')] ที่น่าเกลียดน่ากลัวตัวหนึ่งคว้าไว้!\n\nการต่อสู้ดูไม่ดีนักสำหรับ [activity.Custom('GetRaptorType')] ที่รักของข้า เลือดเปรอะเปื้อนปากของ [ROOT.Char.Custom('GetAnimalType')] ข้าเสี่ยงที่จะถูก [ROOT.Char.Custom('GetAnimalType')] โจมตีเองหากข้าเข้าแทรกแซง แต่ [activity.Custom('GetRaptorType')] ก็มีราคาแพงที่จะหามาทดแทน..."
 hunt.8510.a:0 "ข้าจะสู้กับเจ้าสัตว์ร้ายนั่นเอง!"
 hunt.8510.a.success:0 "ท่านต่อสู้ขับไล่ [ROOT.Char.Custom('GetAnimalType')] ได้"
 hunt.8510.a.failure:0 "ท่านถูก [ROOT.Char.Custom('GetAnimalType')] ขย้ำ"
 hunt.8510.b:0 "ทางที่ดีที่สุดคือไม่เข้าแทรกแซง"
 hunt.8510.b.success:0 "[activity.Custom('GetRaptorType')] ของท่านหนีรอดไปได้โดยไม่ได้รับบาดเจ็บ"
 hunt.8510.b.failure:0 "ท่านต้องซื้อตัวใหม่มาทดแทน"
 hunt.8510.c:0 "ข้าจะซื้อ [activity.Custom('GetRaptorType')] ที่ดีกว่าจากหนึ่งในคู่หูล่าสัตว์ของข้า"
 hunt.8510.d:0 "ข้ารู้วิธีจัดการกับ [ROOT.Char.Custom('GetAnimalPlural')] เป็นอย่างดี!"
 hunt.8520.t:0 "แยกทาง"
 hunt.8520.desc.intro:0 "เราติดตามรอยเท้า [activity.Custom('GetAnimalType')] ผ่าน [ROOT.Char.GetCurrentLocation.GetTerrain.GetNameNoTooltip|l] มาได้สักพัก เมื่อข้าสังเกตเห็นว่ารอยเท้าดูเหมือนจะแยกออกเป็นสองทางอย่างลึกลับ! ข้าเริ่มตามรอยเท้าไปทางซ้าย แต่ [m_hunt.GetName] ดึงข้าไปทางขวา\n\n"มาเถิด [ROOT.Char.GetTitleAsNameNoTooltip|U] ของข้า เห็นได้ชัดว่ารอยเท้าเหล่านั้นเก่าแล้ว เราต้องตามรอยที่ใหม่กว่า"\n\n"
 hunt.8520.desc.outro.obsessed:0 "[m_hunt.GetSheHe] คิดว่าข้าโง่หรือ? เห็นได้ชัดว่า [m_hunt.GetSheHe] ต้องการนำข้าหลงทาง"
 hunt.8520.desc.outro.fallback:0 "จากการสังเกต รอยเท้าทางซ้ายดูเหมือนจะจางกว่ารอยเท้าทางขวาเล็กน้อย"
 hunt.8520.a:0 "ข้าจะเลี้ยวซ้าย"
 hunt.8520.a.success:0 "เส้นทางนำท่านเข้าใกล้มากขึ้น"
 hunt.8520.a.failure:0 "เส้นทางไม่ได้นำท่านไปที่ใดเลย"
 hunt.8520.b:0 "ข้าจะตามไปทางขวา"
 hunt.8520.b.success:0 "$hunt.8520.a.success$"
 hunt.8520.b.failure:0 "$hunt.8520.a.failure$"
 hunt.8530.t:0 "ติดกับ"
 hunt.8530.desc.intro:0 "นั่นไง! ที่ขอบฟ้า ข้าเห็นมันแล้ว! [activity.Custom('GetAnimalType')|U] [activity.Custom('GetLegendaryColor')|U]! ข้าคลุ้มคลั่ง วิ่งเข้าหามันก่อนที่มันจะกลายเป็นหมอกควันในกำมือข้าอีกครั้ง!\n\n#EMP แกร๊บ!#!\n\nข้าไม่รู้สึกตัวด้วยซ้ำว่าขาของข้าติดอยู่ระหว่างก้อนหิน สิ่งที่ข้าเห็นคือโลกรอบตัวทรุดลงเบื้องหน้าขณะที่ข้าตกลงไปในกับดักของพรานเถื่อนธรรมดาๆ จนถึงสะโพก! ข้าดิ้นรน แต่ไม่มีสิ่งใดที่ข้าทำจะพอที่จะ ทำให้ขาของข้าหลุดเป็นอิสระได้"
 hunt.8530.desc.outro.obsessed:0 "ข้าปล่อยให้สัตว์ร้ายที่ถูกสาปแช่งตัวนั้นหนีข้าไปอีกไม่ได้! ข้าอาจจะต้องใช้มาตรการขั้นรุนแรง..."
 hunt.8530.desc.outro.fallback:0 "ข้าอาจไม่มีโอกาสจับสัตว์ร้ายอีก แต่ดูเหมือนจะไม่มีทางออก"
 hunt.8530.a:0 "ข้ามั่นใจว่าถ้าข้าหามุมที่ถูกต้อง..."
 hunt.8530.a.success:0 "ท่านเป็นอิสระ"
 hunt.8530.a.failure:0 "ท่าน ทำให้สถานการณ์แย่ลง"
 hunt.8530.b:0 ""ช่วยด้วย! ช่วยด้วย!""
 hunt.8530.c:0 "ข้าต้องกำจัดขาบ้าๆ นี่ทิ้งไป!"
 hunt.8540.t:1 "[activity.Custom('GetAnimalType')|U] [activity.Custom('GetLegendaryColor')|U]: ลางบอกเหตุ"
 hunt.8540.desc.intro:1 "ข้าฝันถึง [activity.Custom('GetAnimalType')] [activity.Custom('GetLegendaryColor')] อีกครั้ง และวิธีที่มันเย้ยหยันข้า มันจ้องมองข้า และด้วยเสียง [activity.Custom('GetAnimalSoundParticiple')] ดังกึกก้อง ข้าก็ถูกดึงกลับสู่โลกแห่งความเป็นจริงในค่ายล่าสัตว์พร้อมเสียงกรีดร้อง\n\n"
 hunt.8540.desc.mid.witch:0 "[ROOT.Char.GetFaith.WitchGodName|U] ต้องกำลังสื่อสารกับข้าผ่านความฝัน บอกข้าว่าสัตว์ร้ายอยู่ที่นั่น และเป็นหน้าที่ของข้าที่จะต้องสังหารมัน ข้ามองออกไปนอกหน้าต่าง และเห็นสัตว์ทุกชนิดอยู่ที่นั่น จ้องมองไปในทิศทางเดียวกัน"
 hunt.8540.desc.mid.orion:0 "เมื่อมองออกไปนอกหน้าต่าง กลุ่มดาวนายพรานส่องสว่างกว่าที่ข้าเคยเห็น ราวกับว่ามันกำลังเรียกหาข้า"
 hunt.8540.desc.mid.ursa_major:1 "เมื่อมองออกไปนอกหน้าต่าง กลุ่มดาว [activity.Custom('GetAnimalType')] ส่องประกายชัดเจนในท้องฟ้ายามค่ำคืนที่แจ่มใส เรียกหาข้าสู่ป่า"
 hunt.8540.desc.mid.lights:0 "เมื่อมองออกไปนอกหน้าต่าง ข้าสามารถเห็นลูกกลมสีขาวเป็นประกายชัดเจนราวกับกลางวัน ลอยหายเข้าไปในป่า บางทีอาจนำทางข้าไปยังเหยื่อ"
 hunt.8540.desc.mid.comet:0 "เมื่อมองออกไปนอกหน้าต่าง ข้าตกตะลึงกับดาวหางที่เคลื่อนผ่านท้องฟ้า บางทีอาจชี้ทางข้าไปยังจุดเฉพาะใน [ROOT.Char.GetCurrentLocation.GetTerrain.GetNameNoTooltip|l]"
 hunt.8540.desc.outro:0 "\n\nข้าไม่อาจปฏิเสธได้ว่าสิ่งที่ข้าเห็นเป็นเรื่องจริง แต่ร่างกายของข้าเหนื่อยล้าเหลือเกิน"
 hunt.8540.a:0 "นี่ #EMP ต้อง#! เป็นสัญญาณสำหรับวันพรุ่งนี้!"
 hunt.8540.a.success:0 "ท่านตีความสัญญาณได้อย่างถูกต้อง"
 hunt.8540.a.failure:0 "ท่านถูกนำไปสู่ที่ใดเลย"
 hunt.8540.b:0 "ข้านอนไม่หลับแล้วตอนนี้ ข้าต้องออกเดินทาง แต่เช้า!"
 hunt.8540.b.success:0 "ท่านมีความคืบหน้า"
 hunt.8540.b.failure:0 "ท่านไม่พบร่องรอยของสัตว์ร้าย"
 hunt.8540.c:0 "ของขวัญจาก [ROOT.Char.GetFaith.CreatorName|U]"
 hunt.8540.d:0 "งดงามยิ่งนัก ข้าต้องนำไปให้ [intent_target_character.GetFirstNameNoTooltip] ชม!"
 hunt.8550.t:0 "มูล [activity.Custom('GetLegendaryColor')|U]"
 hunt.8550.desc:0 "ข้ากำลังมีความคืบหน้าในการติดตาม [activity.Custom('GetAnimalType')|U] [activity.Custom('GetLegendaryColor')|U] ในตำนาน รอยเท้าของมันนำข้าออกจากเส้นทางที่ผู้คนใช้กันทั่วไป ก่อนจะเลือนหายไปจนหมดสิ้น ข้ารู้สึกสิ้นหวังเข้าครอบงำหัวใจ แต่ทันใดนั้นก็สังเกตเห็นบางสิ่งที่ ทำให้ข้าแทบหยุดหายใจ\n\nมูลสี [activity.Custom('GetLegendaryColor')] บริสุทธิ์ ไม่เหมือนสิ่งใดที่ข้าเคยเห็นมาก่อน! หากตัวสัตว์ร้ายเองเป็นสี [activity.Custom('GetLegendaryColor')] แน่นอนว่ามูลของมันก็ควรจะมีสีคล้ายกัน"
 hunt.8550.a:0 "นี่ #EMP ต้อง#! เป็นเรื่องจริง!"
 hunt.8550.a.success:0 "มูลนำท่านเข้าใกล้มากขึ้น"
 hunt.8550.a.failure:0 "ท่านสูญเสียร่องรอยของสัตว์ร้ายไป"
 hunt.8550.b:0 "บางทีข้าควรพยายามระบุชนิดของมัน"
 hunt.8550.b.success:0 "ท่านระบุชนิดของมูลได้อย่างถูกต้อง"
 hunt.8550.b.failure:0 "ท่านไม่สามารถระบุชนิดของมูลได้"
 hunt.8550.c:0 "นี่เป็นการ ทำให้เข้าใจผิด เราต้องหาสิ่งอื่น"
 hunt.8550.d:0 "นี่คือมูล #EMP ในตำนาน#!"
 legendary_fumes:0 "ควันในตำนาน"
 legendary_fumes_desc:0 "มูลเหล่านี้กล่าวอ้างว่าถูกขับถ่ายโดย [activity.Custom('GetAnimalType')] [activity.Custom('GetLegendaryColor')] ในตำนาน"
 hunt.8560.t:0 "แมวใหญ่ ลูกแมวน้อย"
 hunt.8560.desc:0 "ขณะที่เราท่องไปในป่า แสวงหา [activity.Custom('GetAnimalType')] ที่อันตราย ข้าได้ยินเสียงร้องแง้วๆ น่าสมเพชแผ่วเบามาจากอีกฟากหนึ่ง ข้าตามหาต้นเสียงและพบลูก [activity.Custom('GetAnimalType')] ตัวเล็กจิ๋ว เล็กกว่าแมวจรจัดทั่วไป ตัวสั่นและยืนนิ่งสนิทอยู่ในที่โล่ง\n\n[hunt_participant.GetName|U] รีบไปอยู่ข้างๆ และอุ้มมันที่กำลังส่งเสียงครางอยู่ในอ้อมแขนของ [hunt_participant.GetHerHis]\n\n"พ่อแม่ของเจ้าตัวน้อยน่าสงสารนี้คงตายหรือพลัดหลงไป เป็นหน้าที่ของเราที่จะต้องปกป้องสิ่งมีชีวิตที่เปราะบางของ [hunt_participant.GetFaith.CreatorNamePossessive] มิใช่หรือ?""
 hunt.8560.a:0 "เราสามารถใช้เสียงร้องของมันเพื่อล่อ [activity.Custom('GetAnimalType')] ตัวจริงได้!"
 hunt.8560.b:0 "ข้าจะดูแลมันเอง"
 hunt.8560.c:0 ""โยนเจ้าสิ่งนั้นกลับไปที่ที่เจ้าเจอมัน!""
 hunt.8570.t:0 "ฝูงสัตว์แตกตื่น!"
 hunt.8570.desc:0 "มันเริ่มต้นด้วยเสียงครืนๆ จากนั้นไม่นานทั้งโลกก็เริ่มสั่นสะเทือน ราวกับว่า [ROOT.Char.GetFaith.DevilName] [ROOT.Char.GetFaith.DevilHerselfHimself] กำลังพยายามฉีก [ROOT.Char.GetCurrentLocation.GetTerrain.GetNameNoTooltip|l] ให้เป็นเสี่ยงๆ!\n\nไม่นาน ทะเล [activity.Custom('GetAnimalPlural')] ก็กลืนกินทั้งทุ่งโล่ง โดยมี [stampede_victim.Custom2('MyCharacterIntroduction', ROOT.Char)] ติดอยู่ท่ามกลางพวกมัน!\n\nเจ้าสัตว์ร้ายดูเหมือนจะหลีกเลี่ยง [stampede_victim.GetHerHim] อยู่ในขณะนี้ แต่ถ้าข้าไม่ลงมือ [stampede_victim.GetSheHe] จะต้องตายอย่างแน่นอน"
 hunt.8570.a:0 ""ข้ากำลังไป!""
 hunt.8570.a.success:0 "ท่านช่วย [stampede_victim.GetHerHim] ได้โดยไม่ได้รับบาดเจ็บ"
 hunt.8570.a.failure:0 "ท่านช่วย [stampede_victim.GetHerHim] ได้พร้อมกับอาการบาดเจ็บ"
 hunt.8570.a.failure_2:0 "ท่านล้มเหลวในการช่วยเหลือ [stampede_victim.GetHerHim]"
 hunt.8570.a.crit_failure:0 "ท่านตายในความพยายามของท่าน"
 hunt.8570.b:0 "บางทีข้าอาจเบี่ยงเบนทิศทางฝูงสัตว์แตกตื่นได้"
 hunt.8570.b.success:0 "ท่านเบี่ยงเบนทิศทางฝูงสัตว์แตกตื่นได้"
 hunt.8570.b.failure:0 "ท่านล้มเหลวในการเบี่ยงเบนทิศทางฝูงสัตว์แตกตื่น"
 hunt.8570.c:0 "โอกาสอันดีที่จะกำจัดผู้ที่พลัดหลงบางตัว!"
 hunt.8570.c.success:0 "ท่านยิงได้ดีหลายครั้ง"
 hunt.8570.c.failure:0 "ท่านล้มเหลวในการสังหาร [activity.Custom('GetAnimalType')] แม้ แต่ตัวเดียว"
 hunt.8570.c.death:0 "[stampede_victim.GetName] ถูกเหยียบย่ำ"
 hunt.8570.c.survives:0 "[stampede_victim.GetName] รอดชีวิต"
 hunt.8570.d:0 "[stampede_victim.GetSheHe|U] สามารถช่วย [stampede_victim.GetHerselfHimself] ได้"
 hunt.8580.t:0 "การจ้องมอง"
 hunt.8580.desc:0 "ข้าแยกจากกลุ่มล่าของข้าเพียงครู่เดียว แต่ครู่เดียวก็เพียงพอให้ [activity.Custom('GetAnimalType')] ที่พลัดหลงตัวหนึ่งปรากฏตัวขึ้นบนก้อนหินใหญ่และหยุดนิ่งเพื่อจ้องมองข้าราวกับเหยื่อมื้อต่อไป ข้ารู้สึกคอแห้งผากและมือกำคันธนูแน่นขึ้น\n\nประสบการณ์ทั้งหมดในการล่าสัตว์บอกข้าว่าต้องอยู่นิ่งๆ รอบๆ [activity.Custom('GetAnimalType')] หากต้องการรอดชีวิต แต่ในขณะนั้น ข้าเป็นเพียงทาสของสัญชาตญาณของตัวเอง"
 hunt.8580.a:0 "ข้าต้องพยายามอยู่นิ่งๆ"
 hunt.8580.a.success:0 "[activity.Custom('GetAnimalType')] ถอยกลับไป"
 hunt.8580.a.failure:0 "ท่านถูก [activity.Custom('GetAnimalType')] ขย้ำ"
 hunt.8580.b:0 "ข้ายิงมันได้"
 hunt.8580.b.success:0 "ท่านยิงโดน [activity.Custom('GetAnimalType')]"
 hunt.8580.b.failure:0 "$hunt.8580.a.failure$"
 hunt.8580.c:0 "วิ่งและร้องขอความช่วยเหลือ!"
