l_english: 
 ##################################################
 # #Misc
 feasts_mischievous_t1_modifier:0 "รอยยิ้มเจ้าเล่ห์"
 feasts_mischievous_t1_modifier_desc:0 "ตัวละครนี้ดูสงบนิ่งอย่างประหลาดเมื่อคนรอบข้างประสบอุบัติเหตุอันน่าอับอายโดยไม่คาดฝัน"

 feasts_mischievous_t2_modifier:0 "นักสร้างปัญหา"
 feasts_mischievous_t2_modifier_desc:0 "อุบัติเหตุเล็กน้อยและการค้นพบอันน่าอับอายมักเกิดขึ้นกับผู้ที่อยู่ใกล้ตัวละครนี้เป็นประจำ"

 feasts_mischievous_t3_modifier:0 "ตัวปัญหา"
 feasts_mischievous_t3_modifier_desc:0 "แม้จะพิสูจน์ไม่ได้ แต่ก็เป็นความลับที่รู้กันทั่วไปว่าตัวละครนี้วางแผน \"เล่นตลก\" ครั้งต่อไปอยู่เสมอ"

 feast_learnt_habits_modifier:0 "อุปนิสัยที่สังเกตได้"
 feast_learnt_habits_modifier_desc:0 "อุปนิสัยส่วนตัวของเป้าหมายเมื่ออยู่ตามลำพังเป็นที่ทราบกันในหมู่ผู้วางแผน"
 feast_learnt_habits_modifier.tt:0 "$feast_learnt_habits_modifier$: $VALUE|+0=-+$"
 didnt_knock_hat_off_modifier:0 "ตาบอด เพราะแสง"
 didnt_knock_hat_off_modifier_desc:0 "ความเลิศหรูของเป้าหมายจะนำความพินาศมาให้!\n[GetScheme('slander').GetTypeName] [scheme|E] [success_chance|E] #P +20#!"
 didnt_knock_hat_off_modifier.tt:0 "$didnt_knock_hat_off_modifier$: $VALUE|+0=-+$"

 ##################################################
 # #Murder
 feast_events_ewan.0001.t:0 "ทำหัวให้โล่ง"
 feast_events_ewan.0001.desc.intro:0 "หาได้ยากนักที่ผู้ใดจะอยู่ในงานเลี้ยงได้ตลอดรอดฝั่งโดยไม่ต้องหาเวลาออกไปข้างนอกสักครู่ เพื่อหลีกหนีความวุ่นวาย หรือแม้เพียงเพื่อปลดทุกข์\n\nโชคดีสำหรับข้าพเจ้าที่ [intent_target.GetTitledFirstName] ก็ไม่ใช่ข้อยกเว้น จากซุ้มประตูใกล้ๆ ข้าพเจ้าเฝ้ามองขณะที่ [intent_target.GetSheHe]"
 feast_events_ewan.0001.desc.high_place:0 "จ้องมองออกไปนอกหน้าต่างของหอคอยสูงอันเปลี่ยวร้างแห่งนี้ เห็นได้ชัดว่ากำลังชื่นชมทิวทัศน์ที่น่าตายแทน — เพียงผลักแรงๆ ครั้งเดียว ปัญหาทั้งหมดของข้าพเจ้าก็จะหมดไป แถมยังดูเหมือนอุบัติเหตุอีกด้วย"
 feast_events_ewan.0001.desc.water:0 "เดินเตร่ไปตามริม [activity.GetHost.Custom('IndefiniteBodyOfWater')] ใกล้กับกำแพง กระบองในมือข้าพเจ้ากำแน่น เพียงแค่ต้องฟาด [intent_target.GetHerHim] ให้แรงพอจน [intent_target.GetSheHe] หมดสติ — ที่เหลือสายน้ำจะจัดการเอง และมันจะดูเหมือนอุบัติเหตุ"
 feast_events_ewan.0001.desc.critter:1 "เดินย่ำไปตามทางเดินในลาน ข้าพเจ้ากำ [SCOPE.Custom('VenomousCreature')] มีพิษไว้ในมือ (หวังว่าจะควบคุมมันได้ดี) มันดุร้ายและอันตรายถึงชีวิต ข้าพเจ้าเพียงแค่ต้องโยนมันไปที่ผิวหนังเปลือยเปล่า เพื่อให้มันทำงานชั่วร้ายของมัน"
 feast_events_ewan.0001.desc.rock:0 "เดินชมของประดับในลาน ก้อนหินในมือข้าพเจ้ามีน้ำหนักพอเหมาะ อีกทั้งยังมีปลายแหลมคมชั่วร้าย — การขว้างเข้าที่กะโหลกอย่างแม่นยำเพียงครั้งเดียวก็น่าจะเพียงพอที่จะกระทำการอันดำมืดนี้"
 feast_events_ewan.0001.desc.outro:0 "\n\nข้าพเจ้ามีความได้เปรียบจากการจู่โจม ดังนั้นหากแผนผิดพลาด การหลบหนีให้ทันเวลาก็ไม่น่าเป็นปัญหา แต่น่าเศร้าที่คงใช้เวลาสอบสวนไม่นานนัก [intent_target.GetFirstNameNoTooltip] ก็จะสังเกตเห็นการหายตัวไปอย่างน่าสงสัยของข้าพเจ้า"
 feast_events_ewan.0001.a:0 "เอาล่ะ ผลักแรงๆ ทีเดียวแล้ว..."
 feast_events_ewan.0001.a.tt.success:0 "[intent_target.GetSheHe] ร่วงลงไปแล้ว!"
 feast_events_ewan.0001.a.tt.failure:0 "[intent_target.GetFirstNameNoTooltip] โยน [intent_target.GetHerselfHimself] ไปด้านข้าง"
 feast_events_ewan.0001.b:0 "ฟาดหนักๆ ผลักแรงๆ แล้ว..."
 feast_events_ewan.0001.b.tt.success:0 "หมดสติ [intent_target.GetFirstNameNoTooltip] จมลงใต้น้ำ"
 feast_events_ewan.0001.b.tt.failure:0 "[intent_target.GetSheHe|U] ล้มลง แต่ยังคงมีสติ"
 feast_events_ewan.0001.c:0 "การโยนต้องมีพลัง #EMP พอดี#!..."
 feast_events_ewan.0001.c.tt.success:1 "[SCOPE.Custom('VenomousCreature')] โจมตี"
 feast_events_ewan.0001.c.tt.failure:0 "สัตว์ร้ายกระเด็นออกแล้วหนีไป"
 feast_events_ewan.0001.d:0 "เอาล่ะ ข้าพเจ้าต้องตี [intent_target.GetHerHim] เข้าที่หัวเต็มๆ..."
 feast_events_ewan.0001.d.tt.success:0 "ท่านตี [intent_target.GetHerHim] เข้าที่ขมับ"
 feast_events_ewan.0001.d.tt.failure:0 "ท่านพลาด"
 feast_events_ewan.0001.e:0 "บางทีข้าพเจ้าควรเฝ้าสังเกตการณ์ดีกว่าหรือไม่?"
 feast_events_ewan.0001.e.tt.bonus_to_murder_scheme.overwrite:0 "สิ่งนี้จะเขียนทับโบนัสที่เป็นไปได้ของท่านต่อ [GetScheme('murder').GetTypeName] [ROOT.Char.Var('feast_events_ewan_0001_bonus_value').GetTitledFirstName]"
 feast_events_ewan.0001.e.tt.bonus_to_murder_scheme:0 "ท่านจะได้รับโอกาสสำเร็จ #P [EmptyScope.ScriptValue('feast_events_ewan_0001_murder_scheme_bonus_added_base_success_value')|=+0]%#! เพิ่มเติมสำหรับ [GetScheme('murder').GetTypeName] [scheme|E] ใดๆ ที่ท่านเริ่มต่อต้าน [intent_target.GetTitledFirstName] ในอีก [EmptyScope.ScriptValue('feast_events_ewan_0001_murder_scheme_bonus_time_to_use_value')|0] ปีข้างหน้า"
 feast_events_ewan.0001.f:0 "นี่เป็นความคิดที่โง่เขลา"


 ##################################################
 # #Seduce
 feast_events_ewan.0201.t:0 "อาหารค่ำและการแสดง"
 feast_events_ewan.0201.desc.intro:0 "การนั่งตรงข้าม [intent_target.Custom2('MyCharacterIntroduction', ROOT.Char)] เปิดโอกาสให้ข้าพเจ้าหยอกเย้า [intent_target.GetHerHim] ได้มากมายโดยไม่ผิดกฎความเหมาะสม\n\n"
 feast_events_ewan.0201.desc.meat.dramatic_snap:0 ""... แน่นอน มันคือการเป็น", ข้าพเจ้าหักกระดูกชิ้นเล็กของ [activity.GetHost.Custom('RegionalEdibleAnimal')] ที่ถืออยู่อย่างชำนาญออกเป็นสองท่อน, "#EMP หนักแน่น#! ท่านไม่เห็นด้วยหรือ?""
 feast_events_ewan.0201.desc.meat.sink_teeth:0 "อย่างช้าๆ และจงใจ ข้าพเจ้าฝังเขี้ยวลงในเนื้อ [activity.GetHost.Custom('RegionalEdibleMeat')] ชิ้น #EMP โอชะ#! ค่อยๆ แต่หนักแน่น ฉีกเนื้อออกมา"
 feast_events_ewan.0201.desc.meat.lick:0 "ด้วยการเลียอย่างเต็มที่ แต่อ้อยอิ่ง ข้าพเจ้าตวัดลิ้นเก็บซอสที่เคลือบ [activity.GetHost.Custom('RegionalEdibleAnimal')] ส่วนของข้าพเจ้าเข้าปากคำโต เราสบตากันตลอดเวลา"
 # Weird phrasing to write around a/an because I'm not making a damned Article_RegionalRootVegetablePlural custom loc.
 feast_events_ewan.0201.desc.veggie.suggestive_gesture:0 "อย่างช้าๆ และหยอกเย้า ข้าพเจ้าลูบนิ้วไปตามส่วนโค้งของ [activity.GetHost.Custom('RegionalRootVegetablePlural')] คู่หนึ่ง ค่อยๆ หยอกล้อผักด้วยสัมผัสอันนุ่มนวล ที่ปลายสุด ข้าพเจ้าลากปลายเล็บเบาๆ ผ่านผิวของมัน ทิ้งรอยขีดข่วนเล็กน้อยไว้"
 feast_events_ewan.0201.desc.veggie.sink_teeth:0 "ด้วยความเอร็ดอร่อย ข้าพเจ้ากัด [activity.GetHost.Custom('RegionalRootVegetable')] ขนาดใหญ่ ฉ่ำ และ #EMP แน่น#! อย่างเต็มคำ ปล่อยให้น้ำเล็กน้อยไหลออกมาเปื้อนคาง ด้วยความพึงพอใจ ลิ้นของข้าพเจ้าตวัดเลียริมฝีปากจนสะอาด"
 feast_events_ewan.0201.desc.veggie.deep_bite:0 "ด้วยท่าทางอันน่าทึ่ง มือที่ยกขึ้นของข้าพเจ้าปล่อย [activity.GetHost.Custom('RegionalRootVegetable')] ชิ้นเล็กๆ เข้าปาก และข้าพเจ้ากลืนลงไปด้วยความพึงพอใจ #EMP อย่างได้ยินเสียง#! ดวงตาของข้าพเจ้าถึงกับเหลือบขึ้นเล็กน้อย เพื่อเพิ่มความเร่าร้อน"
 feast_events_ewan.0201.desc.outro:0 "\n\nข้าพเจ้าเห็นจากสีหน้าของ [intent_target.GetHerHis] ว่า [intent_target.GetFirstNameNoTooltip] เข้าใจสารของข้าพเจ้า สิ่งที่ข้าพเจ้าแยกแยะไม่ได้คือสีหน้าของ [intent_target.GetHerHis] — นั่นคือความสนใจใฝ่ต่ำหรืออาการท้องไส้ปั่นป่วน? มันยากที่จะบอกได้อย่างน่าตกใจ"
 feast_events_ewan.0201.a:0 "บางทีอีกสักคำ เพื่อตอกย้ำประเด็น"
 feast_events_ewan.0201.a.tt.success:0 "แหม [ROOT.Char.GetFirstNameNoTooltip]..."
 feast_events_ewan.0201.a.tt.failure:0 "ท่านกำลังทำ #EMP อะไร#! กัน?"
 feast_events_ewan.0201.b:0 "นี่ไม่ได้ผล บางที [intent_target.GetSheHe] อาจชอบการพูดคุยอย่างตรงไปตรงมามากกว่า?"
 feast_events_ewan.0201.b.tt.success:0 "การสนทนาของท่านน่าสนใจยิ่งขึ้น"
 feast_events_ewan.0201.b.tt.failure:0 "สาบานต่อ [intent_target.GetFaith.KnowledgeGodName] ท่านช่างน่าเบื่อ!"
 feast_events_ewan.0201.c:0 "นี่มัน... เร่าร้อนน้อยกว่าที่ข้าพเจ้าหวังไว้..."


 ##################################################
 # #Befriend
 feast_events_ewan.0401.t:0 "ท้องร้อง"
 feast_events_ewan.0401.desc.intro:0 "ใช้เวลาเกือบทั้งเย็นกว่าข้าพเจ้าจะเข้าใกล้ [intent_target.GetTitledFirstName] ได้โดยไม่ ทำให้รู้สึกฝืนใจ ท้ายที่สุดแล้ว มิตรภาพที่ดีที่สุดย่อมเกิดขึ้นตามธรรมชาติ และข้าพเจ้าต้องการให้ [intent_target.GetHerHim] คิดว่านี่เป็นเรื่องบังเอิญ\n\n"
 feast_events_ewan.0401.desc.target_personality.flamboyant:0 ""สาบานต่อ [intent_target.GetFaith.WealthGodName]", ว่าที่สหายของข้าพเจ้ากล่าวสรรเสริญ กลบเกลื่อนเสียงเรอแทบไม่มิด, "นั่นเป็นอาหารจานที่ #EMP หนัก#! เหลือเกิน และมาเร็วเหลือเกินหลังจากจานหนักจานที่แล้ว! มันหนักท้องเกินไป ข้าพเจ้าไม่อยากจะเชื่อเลยว่าพวกคนรับใช้คาดหวังว่าจะรับใช้ [activity.GetHost.Custom('MistressMaster')] ของพวกเขาต่อไปได้ ทั้งที่ทำงานได้แย่ขนาดนี้""
 feast_events_ewan.0401.desc.target_personality.sedate:0 "[intent_target.GetWomanMan] เขี่ยอาหาร [intent_target.GetHerHis] ดันเศษอาหารเล็กๆ สองสามชิ้นไปรอบๆ จานไม้ที่มันเยิ้ม\n\n"มันค่อนข้าง... หนักไปหน่อยใช่ไหม? จานนี้ จานก่อนหน้านั้น จานก่อนหน้า #EMP นั้น#! อีก และ" [intent_target.GetSheHe] มองคนรับใช้ที่นำอาหารจานต่อไปออกมาอย่างประหม่า "จานต่อไปด้วย อาหารเลี่ยนๆ มากมาย เรียงกันมา ทั้งที่สิ่งที่เราต้องการจริงๆ คือของล้างปากที่สร้างสรรค์""
 feast_events_ewan.0401.desc.target_personality.fallback:0 "[intent_target.GetWomanMan] ค่อยๆ ซับมุมปาก [intent_target.GetHerHis] ด้วยมุมผ้าปูโต๊ะที่เปื้อน ปัดเศษขนมปังกรอบออก\n\n"ข้าแค่หวังว่าจานต่อไปจะเบากว่านี้หน่อย" [intent_target.GetSheHe] แสดงความเห็น "จุดประสงค์ทั้งหมดของงานเลี้ยงคือการมอบประสบการณ์การทำอาหารที่หลากหลายและเข้มข้น และจนถึงตอนนี้รู้สึกเหมือนพยายามยัดเยียดเรามากกว่าที่จะ ทำให้เราตื่นเต้น""
 feast_events_ewan.0401.a:0 "ใช่ — น่าเศร้าที่มันเป็นเพียงตัวเลือกที่ไม่ดี ข้าพเจ้าคิดว่า"
 feast_events_ewan.0401.a.tt.success:0 "ท่าน ทำให้ [intent_target.GetHerHim] หลงใหลอย่างสิ้นเชิง"
 feast_events_ewan.0401.a.tt.partial_success:0 "[intent_target.GetSheHe|U] อยากจะคุยต่อ"
 feast_events_ewan.0401.a.tt.failure:0 "ท่านสนุก แต่ไม่ขนาดนั้น"
 feast_events_ewan.0401.b:0 ""ท่าน... #EMP รู้ตัว#! ไหมว่านี่คืองานเลี้ยงของข้าพเจ้า ใช่หรือไม่?""
 feast_events_ewan.0401.c:0 ""กล่าวสรรเสริญอาหารเสียงดัง""
 feast_events_ewan.0401.d:0 "เปลี่ยนเรื่องคุยเป็นเรื่องที่ไม่ก่อให้เกิดความขัดแย้ง"


 ##################################################
 # #Mischief
 feast_events_ewan.0601.t:0 "เพียงเรื่องตลก"
 feast_events_ewan.0601.desc.intro:0 "ห้องครัว ข้าพเจ้าคิดว่า เป็นสถานที่ที่ดีที่สุดเสมอในการสร้าง #EMP ความปั่นป่วน#! เล็กน้อย อย่างน้อยก็ตราบใดที่พนักงานจับไม่ได้\n\nเป้าหมายที่เป็นไปได้มากมาย แต่เวลามีน้อยเหลือเกิน: ข้าพเจ้าควรจะเข้าไปยุ่งกับถาด [activity.GetHost.Custom('GetExpensiveDrink')] อาหารจานหลักที่ประณีต หรือโต๊ะเล็กๆ ที่มีอาหารจานเล็กๆ สำหรับระหว่างคอร์ส?\n\nไม่ว่าข้าพเจ้าจะเลือกอะไร ข้าพเจ้ามีของที่เตรียมไว้เพื่อทำลายค่ำคืนของใครบางคน —"
 # This next one's for you, dear James.
 feast_events_ewan.0601.desc.dead_rat:0 "หนูตายส่งกลิ่นฉุนเป็นพิเศษ ใกล้จะเน่าเปื่อยเต็มที"
 feast_events_ewan.0601.desc.humongous_beetle:0 "ด้วงตัวมหึมาที่ตอนนี้หมดแรงแล้ว แต่มันน่าจะตื่นและดิ้นได้หลังจากได้พักผ่อนอย่างสบาย"
 feast_events_ewan.0601.desc.raw_eyeball:0 "ลูกตาดิบขนาดใหญ่เพียงลูกเดียว"
 feast_events_ewan.0601.desc.used_sponge:0 "ฟองน้ำที่ถูก... #EMP ใช้งาน#! มาอย่างชัดเจน"
 feast_events_ewan.0601.desc.rotten_vegetable:0 "[activity.GetHost.Custom('RegionalRootVegetable')] เน่าเหม็นที่ขึ้นราจนส่งกลิ่นฉุนจนข้าพเจ้าตกใจจริงๆ ที่ซ่อนมันไว้ได้"
 feast_events_ewan.0601.desc.dodgy_mushroom:0 "เห็ดที่ข้าพเจ้ามั่นใจอย่างยิ่งว่าจะ ทำให้ใครก็ตามต้องวิ่งไปเข้าส้วม อาจจะตลอดทั้งคืนที่เหลือ"
 feast_events_ewan.0601.desc.hank_of_hair:0 "กระจุกขนเล็กๆ จากสัตว์ในลาน ไม่ใช่ขนบนหัว"
 feast_events_ewan.0601.a:0 "ทำให้เครื่องดื่มสกปรก"
 feast_events_ewan.0601.a.tt.success:0 "ท่านเข้าออกรวดเร็วราวเสียงกระซิบของปีศาจ"
 feast_events_ewan.0601.a.tt.failure:0 "ท่านขาดความคล่องแคล่วในการลอบเร้น"
 feast_events_ewan.0601.b:0 "ทำให้จานหรูเสีย"
