 ##################################################
 # #Relax
 feast_events_ewan.0801.t:0 "บรรยากาศอันน่ารื่นรมย์"
 feast_events_ewan.0801.desc.intro:0 "อาาา มีอะไรจะรื่นเริงไปกว่างานเลี้ยงที่ดีอีกเล่า?\n\nแขกเหรื่อเดินขวักไขว่ กินและพูดคุยกันขณะที่แสงคบเพลิงริบหรี่สาดส่องไปทั่วผนัง แสงสะท้อนราวกับเสียงหัวเราะไปทั่วห้องโถง"
 feast_events_ewan.0801.desc.lustful:0 "มี... #EMP อาหารจานเด็ด#! มากมายให้ [ROOT.Char.Custom('SenseObserve_EyeTaste')] มีโอกาสมากมายสำหรับการลอบมอง หรือแม้กระทั่งการนัดพบอย่างลับๆ\n\nอาจจะสองครั้ง"
 feast_events_ewan.0801.desc.chaste:0 "เป็นการดีที่ได้เห็นผู้คนมากมายสนุกสนานโดยไม่ต้องพึ่งพาความสุขทางเนื้อหนัง"
 feast_events_ewan.0801.desc.gluttonous:0 "และอาหาร! โอ้ อาหาร... สาบานต่อ [ROOT.Char.GetFaith.HealthGodName] ข้าพเจ้า #EMP รัก#! อาหารมื้อใหญ่ที่ดี หรือห้ามื้อ"
 feast_events_ewan.0801.desc.temperate:0 "\n\nแน่นอน ข้าพเจ้าไม่ค่อยชอบอาหารจานหรูหรานัก แต่ข้าพเจ้าสามารถเพลิดเพลินกับเพื่อนร่วมวงที่ดีและบรรยากาศอันรื่นเริงขณะแทะก้อนขนมปังของข้าพเจ้าได้"
 feast_events_ewan.0801.desc.greedy:0 "\n\nในงานเลี้ยง ทุกคนต่างก็โลภในบางสิ่งเล็กน้อย — พูดตามจริง มันผ่อนคลายที่ได้เห็นโลก #EMP ซื่อสัตย์#! เช่นนี้บ้าง"
 feast_events_ewan.0801.desc.generous:0 "\n\nมีบางอย่างที่น่าพึงพอใจอย่างเรียบง่ายเกี่ยวกับการให้อาหารผู้อื่น การหักขนมปังและแบ่งปันถ้วยในห้องเดียวกัน"
 feast_events_ewan.0801.desc.lazy:0 "แล้วข้าพเจ้ารึ? ข้าพเจ้าไม่ต้องขยับเขยื้อนเลย ผู้คน อาหาร เครื่องดื่ม หมอนอิง คนรับใช้ ทุกอย่างมาหาข้าพเจ้าโดยไม่ต้องกระดิกนิ้ว #EMP สมบูรณ์แบบ#!."
 feast_events_ewan.0801.desc.diligent:0 "การประสานงานผู้คนและคนรับใช้จำนวนมากเป็นงานที่ไม่ค่อยมีใครเห็นคุณค่า เป็นงานที่มีความยากลำบากซ่อนเร้นอยู่ไม่น้อย และเป็นเรื่องน่ายินดีที่ได้เห็นงานนั้นสำเร็จลุล่วงไปด้วยดี"
 feast_events_ewan.0801.desc.wrathful:0 "ข้าพเจ้า #EMP อาจจะ#! เป็น... เหยื่อของความโกรธเกรี้ยวในบางครั้ง แต่ที่นี่ ตอนนี้ ข้าพเจ้าสงบ บางทีอาจถึงขั้นเยือกเย็น\n\nการเปลี่ยนแปลงจังหวะนี้น่าพอใจ"
 feast_events_ewan.0801.desc.calm:0 "\n\nบางคนคิดว่างานเลี้ยงเป็นสถานที่ที่วุ่นวาย แต่สำหรับข้าพเจ้า มันคือฐานที่มั่นแห่งความสงบและความปรองดองทางสังคม ท้ายที่สุดแล้ว ทุกคนนั่งสบายขึ้นเมื่อท้องอิ่มและมีถ้วยที่เต็มไปด้วยเครื่องดื่ม"
 feast_events_ewan.0801.desc.patient:0 "\n\nข้าพเจ้าถึงกับเพลิดเพลินกับการรอคอยระหว่างคอร์ส — มันไม่ใช่แค่โอกาสที่จะหัวเราะและพูดคุยเท่านั้น แต่ยังช่วยให้ท่านได้ไตร่ตรองถึงอาหารที่ท่านทานและความคิดที่ใส่ลงไปในนั้น"
 feast_events_ewan.0801.desc.impatient:0 "\n\nงานเลี้ยงที่ดีเป็นหนึ่งในไม่กี่สภาพแวดล้อมที่ท่านแทบไม่ต้องรออะไรเลย ต้องการอาหาร? มันอยู่ที่นั่น ต้องการเครื่องดื่ม? พวกเขาจะรินให้ท่าน อยากคุย? เพื่อนร่วมวงดีๆ มีอยู่ทุกหนทุกแห่ง สุขแท้"
 feast_events_ewan.0801.desc.arrogant:0 "\n\nเป็นการดีต่อข้าพเจ้าที่ได้สมาคมกับผู้น้อยกว่าบางคน เช่นนี้ วาง [ROOT.Char.Custom('FootFeet')] ของข้าพเจ้าบนเก้าอี้ เผยแพร่ความปรารถนาดีของข้าพเจ้าท่ามกลางเหล่าขุนนางชั้นผู้น้อยจำนวนมาก"
 feast_events_ewan.0801.desc.humble:0 "ผู้คนมากมาย มาจากทั่วทุกสารทิศ เพียงเพื่อมาอยู่ที่นี่ มัน ทำให้เห็นมุมมองว่าโลกกว้างใหญ่เพียงใด"
 feast_events_ewan.0801.desc.deceitful:0 "\n\nข้าพเจ้าได้เริ่มปล่อยข่าวลือสองสามเรื่องในหมู่ฝูงชนแล้ว เพียงเพื่อความสนุกสนาน ข้าพเจ้าพบว่ามันค่อนข้างน่าสนุกที่ได้เห็นว่าคำโกหกแพร่กระจายได้เร็วเพียงใด แม้ว่าจะไม่มีแรงจูงใจอื่นใดนอกจากการสร้างความโกลาหลเล็กน้อย"
 feast_events_ewan.0801.desc.honest:0 "มีการแสดงออกถึงประสบการณ์ของมนุษย์ที่แท้จริงน้อยกว่านี้ เปิดเปลือย ซื่อสัตย์ — เพียงแค่ผู้คนเพลิดเพลินกับการอยู่ร่วมกับผู้อื่น"
 feast_events_ewan.0801.desc.craven:0 "มีบางอย่างที่น่าอุ่นใจเกี่ยวกับการอยู่ท่ามกลางผู้คนมากมาย ราวกับว่าไม่มีอะไรผิดพลาดได้\n\nอาจจะ"
 feast_events_ewan.0801.desc.brave:0 "จริงอยู่ที่เราเป็นกลุ่มคนที่หลากหลาย แต่ที่นี่และตอนนี้ ข้าพเจ้ารู้สึกว่างานเลี้ยงนี้สามารถเผชิญหน้ากับโลกและได้รับชัยชนะ"
 feast_events_ewan.0801.desc.shy:0 "ข้าพเจ้านั่งอย่างมีความสุขในที่นั่งมุมห้อง พูดคุยกับคนที่น่าสนใจสองสามคน\n\nเป็นการดีที่ได้มีโอกาสเข้าสังคมโดยไม่รู้สึกอึดอัดเป็นครั้งคราว"
 feast_events_ewan.0801.desc.gregarious:0 "\n\nน่าเสียดายที่เราไม่สามารถมีแขกได้มากกว่านี้ เพียงแค่เพิ่มอีกสักโต๊ะหรือสองโต๊ะ แต่ไม่ใช่ทุกคนที่มีจิตวิญญาณแห่งงานเลี้ยง ไม่ใช่ทุกคน บางที แต่ #EMP ข้าพเจ้า#! มี และข้าพเจ้าคนเดียวก็ดีเท่ากับโต๊ะหนึ่งหรือสองโต๊ะแล้ว!"
 feast_events_ewan.0801.desc.ambitious:0 "โอกาสมากมายที่จะพูดคุย พบปะ สนทนา วางแผน การสนทนาใหม่ แต่ละครั้งคือเมล็ดพันธุ์แห่งเป้าหมายใหม่ อาหาร แต่ละจานเป็นข้ออ้างในการเพิ่มผู้ติดต่ออีกคน"
 feast_events_ewan.0801.desc.content:0 "ข้าพเจ้านึกไม่ออกเลยว่ามีสิ่งใดที่ข้าพเจ้าอยากจะเปลี่ยน ทุกอย่างมัน... สมบูรณ์แบบ"
 feast_events_ewan.0801.desc.arbitrary:0 "\n\nแน่นอน ไม่ใช่ทุกอย่างจะเป็นไปตามที่ข้าพเจ้าต้องการ แต่นั่นคือธรรมชาติของการรวมตัวเหล่านี้ ครั้งต่อไปสิ่งต่างๆ จะแตกต่างออกไป และรสชาติของการเปลี่ยนแปลง ทำให้มีบางสิ่งที่น่าตั้งตารอ"
 feast_events_ewan.0801.desc.just:0 "\n\nข้าพเจ้าพบว่าระเบียบตามธรรมชาติของงานเลี้ยงนั้นน่าชื่นชมเสมอ โต๊ะจัดวางอย่างเรียบร้อย ลำดับชั้นทางสังคมถูกบังคับใช้อย่างเงียบๆ ทุกคนมีความสุข หัวเราะ และอยู่ในที่ที่เหมาะสมของตนเอง ตรงที่ที่พวกเขาควรอยู่"
 feast_events_ewan.0801.desc.cynical:0 "แน่นอน ส่วนใหญ่มาที่นี่เพียงเพื่อกินและดื่มด้วยเงินของคนอื่น แต่ข้าพเจ้าเป็นใครที่จะตัดสิน? แทบจะไม่ใช่ทางเลือกที่ข้าพเจ้าจะตำหนิพวกเขาได้ และอาหารก็ #EMP อร่อย#!."
 feast_events_ewan.0801.desc.zealous:0 "\n\nข้าพเจ้าพึมพำบทสวดสั้นๆ ถวายแด่ [ROOT.Char.GetFaith.HealthGodName] ขอบคุณสำหรับอาหารจานต่อไปอันยอดเยี่ยมที่กำลังจะมาถึง แท้จริงแล้ว สิ่งสร้างสรรค์ของ [ROOT.Char.GetFaith.CreatorName] นี้เต็มไปด้วยความอัศจรรย์ และอาหารที่ดีก็ไม่ใช่ปาฏิหาริย์ที่เล็กที่สุดอย่างแน่นอน"
 feast_events_ewan.0801.desc.paranoid:0 "\n\nข้าพเจ้าระแวดระวังอยู่ตลอดเวลาสำหรับสัญญาณอันตรายใดๆ ไม่ว่าจะโดยเจตนาหรือโดยอุบัติเหตุ วางแผนไว้หรือเกิดขึ้นกะทันหัน มีเพียงพอที่จะตรงกับความคาดหวังของข้าพเจ้า — ไม่มากจนแผนการชัดเจน ไม่น้อยจนแผนการถูกปิดบังอย่างชัดเจน เป็นแบบที่ข้าพเจ้าชอบ"
 feast_events_ewan.0801.desc.trusting:0 "\n\nแน่นอน เมื่อทุกคนร่าเริงและมีอาหารเลิศรสมากมายให้ลอง ใครเล่าจะนำความประสงค์ร้ายมาสู่การรวมตัว เช่นนี้ได้? ไม่ นี่เป็นเรื่องน่ายินดี และข้าพเจ้าก็ยินดีไปกับมัน"
 feast_events_ewan.0801.desc.compassionate:0 "เป็นเรื่องน่ายินดีที่ได้เห็นน้ำใจของมนุษย์ถูกแบ่งปันอย่างอิสระ"
 feast_events_ewan.0801.desc.callous:0 "\n\nไม่ใช่ว่าข้าพเจ้าจะ #EMP เดือดร้อน#! มากเกินไปหากคนอื่นๆ มีช่วงเวลาที่แย่ แต่ข้าพเจ้ายังคงชื่นชมบรรยากาศที่น่ารื่นรมย์ได้ พอประมาณ"
 feast_events_ewan.0801.desc.sadistic:0 "ข้าพเจ้าเพลิดเพลินกับเสียงกรีดร้องและเสียงสะอื้นมากเท่ากับ [ROOT.Char.GetTitleAsNameNoTooltip] ที่ปรับตัวได้ดีคนต่อไป แต่เสียงร้องแห่งความรื่นเริงสามารถสร้างการเปลี่ยนแปลงที่ดีได้อย่างแน่นอน"
 feast_events_ewan.0801.desc.stubborn:0 "ข้าพเจ้าเคยคิดที่จะลุกขึ้นเดินเตร่ไปมาเหมือนคนอื่นๆ แต่ นั่นหมายถึงการสละที่นั่งของข้าพเจ้า และข้าพเจ้าขอสาปแช่งหากข้าพเจ้ายอมสละมัน"
 feast_events_ewan.0801.desc.fickle:0 "ข้าพเจ้าคิดว่าสิ่งที่ข้าพเจ้าชอบที่สุดเกี่ยวกับงานเลี้ยง #EMP ต้อง#! เป็นอาหาร ไม่สิ ผู้คน จริงๆ แล้ว อาจจะเป็นเครื่องดื่ม? หรือความบันเทิง หรือ..."
 feast_events_ewan.0801.desc.vengeful:0 "\n\nโดยธรรมชาติแล้ว ส่วนไม่น้อยมุ่งไปที่คนรับใช้ที่ข้าพเจ้าเพิ่งขัดขา ซึ่งตอนนี้เต็มไปด้วยอาหารเรียกน้ำย่อยที่เหนียวเหนอะหนะ สมควรแล้วไอ้สารเลวนั่นที่ลืมเติมเครื่องดื่มให้ข้าพเจ้าในคอร์สที่แล้ว"
 feast_events_ewan.0801.desc.forgiving:0 "\n\nข้าพเจ้ากังวลเล็กน้อยที่พนักงานเสิร์ฟมองข้ามถ้วยของข้าพเจ้าไปเมื่อครั้งที่แล้ว แต่ก็ยังมีคอร์สต่อไปเสมอ อันที่จริง นั่นเป็นหนึ่งในสิ่งที่น่ารักเกี่ยวกับงานเลี้ยง — มีคอร์สต่อไป #EMP เสมอ#!."
 feast_events_ewan.0801.desc.outro:0 "\n\nบางครั้งการนั่งพักผ่อนและเพลิดเพลินกับสิ่งเล็กน้อยในชีวิตก็เป็นเรื่องดี"
 feast_events_ewan.0801.a:0 "นี่คือที่ที่ข้าพเจ้าอยากอยู่"
 feast_events_ewan.0801.b:0 "มีผู้คนดีๆ ให้สังสรรค์ด้วยที่นี่"
 feast_events_ewan.0801.c:0 "โอกาสที่จะได้ปรากฏตัวร่วมกับผู้ยิ่งใหญ่และผู้ดี!"

