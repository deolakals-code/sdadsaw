l_english: 

 ### PHASES
 playdate_phase:0 "พบปะ"

 ### OPTIONS

 ### INTENTS

 child_return_from_playdate_title:0 "เด็กกลับมาแล้ว"
 child_return_from_playdate_desc:0 "[child_scope.GetShortUIName] ได้กลับมาจากการพบปะสหายที่ราชสำนักของ[host.GetShortUINamePossessive]"

 playdate_header:0 "พบปะสหาย:"
 playdate.0010.desc:0 "เหตุใดท่านจึงตอบรับคำเชิญของข้าเพียงเพื่อไปร่วมงานพบปะสหายของ[other_host.GetTitledFirstNamePossessive]แทน?! ข้าจะจำเรื่องนี้ไว้"
 playdate.0010.a:0 "อุ๊ย"

 playdate.1001.opening_desc:0 "โปรดมาพบปะสหายของท่านที่ราชสำนักของข้าใน [barony.GetNameNoTier]!"
 playdate.1001.host_likes_me:0 "ข้าหวังว่าท่านจะเข้าร่วม เพราะข้ารอคอยโอกาสที่จะได้พบท่าน!"
 playdate.1001.host_dislikes_me:0 "ข้าเชิญทุกคนที่มีความสำคัญ ซึ่งน่าเสียดายที่ รวมถึงท่านด้วย"
 playdate.1001.host_gets_along_with_me:0 "ข้าหวังว่าท่านจะเข้าร่วม เพราะข้าคงจะคิดถึงท่านมากหากท่านไม่มา!"
 playdate.1001.a:0 "แน่นอน ข้าจะไปที่นั่น"
 playdate.1001.b:0 "ไม่ ข้าปฏิเสธ!"

 playdate.1002.opening_desc:0 "ข้าพเจ้าจะยินดีเป็นอย่างยิ่งหาก [child_scope.Custom2('YourCharacterIntroduction', ROOT.Char)] สามารถมาเยือนราชสำนักของข้าพเจ้าใน [barony.GetNameNoTier] เพื่อพบปะสหายของ[child_scope.GetHerHis]!"
 playdate.1002.host_likes_child:0 "ข้าหวังว่า[child_scope.GetSheHe]จะเข้าร่วม เพราะข้ารอคอยโอกาสที่จะได้พบ[child_scope.GetHerHim]!"
 playdate.1002.host_dislikes_child:0 "ข้าเชิญทุกคนที่มีความสำคัญ ซึ่งน่าเสียดายที่ รวมถึง[child_scope.GetHerHim]ด้วย"
 playdate.1002.host_gets_along_with_child:0 "ข้าหวังว่า[child_scope.GetSheHe]จะเข้าร่วม เพราะข้าคงจะคิดถึง[child_scope.GetHerHim]มากหาก[child_scope.GetSheHe]ไม่มา!"
 playdate.1002.a:0 "แน่นอน [child_scope.GetSheHe] จะไปที่นั่น"
 playdate.1002.b:0 "ข้าพเจ้าต้องขอปฏิเสธ"

 playdate.2001.t:1 "การรวมตัว"
 playdate.2001.desc_opening:0 "ทุกคนอยู่ที่นี่แล้ว!\n\nขณะที่เหล่าขุนนางน้อยและท่านหญิงน้อยถูกนำเข้ามาในห้อง ข้าพเจ้ารู้สึกตื่นเต้นมากขึ้นเรื่อยๆ"
 playdate.2001.desc_guest_of_interest_1_2_3:0 "ข้าพเจ้าตื่นเต้นที่ [guest_of_interest_1.Custom2('MyCharacterIntroduction', ROOT.Char)] และ [guest_of_interest_2.Custom2('MyCharacterIntroduction', ROOT.Char)] สามารถมาได้ทั้งคู่ ไม่ต้องพูดถึง [guest_of_interest_3.Custom2('MyCharacterIntroductionNoComma', ROOT.Char)]!"
 playdate.2001.desc_guest_of_interest_1_and_2:0 "ข้าพเจ้าตื่นเต้นที่ทั้ง [guest_of_interest_1.Custom2('MyCharacterIntroduction', ROOT.Char)] และ [guest_of_interest_2.Custom2('MyCharacterIntroduction', ROOT.Char)] สามารถมาได้!"
 playdate.2001.desc_guest_of_interest_1:0 "ข้าพเจ้าตื่นเต้นที่ [guest_of_interest_1.Custom2('MyCharacterIntroduction', ROOT.Char)] สามารถมาได้!"
 playdate.2001.desc:0 "ข้าพเจ้าตื่นเต้นที่จะได้ใช้เวลากับเด็กคนอื่นๆ!"
 playdate.2001.desc_guest_of_interest_4:0 "อย่างไรก็ตาม ข้าพเจ้าตื่นเต้นน้อยลงที่ [guest_of_interest_4.Custom2('MyCharacterIntroduction', ROOT.Char)] ดูเหมือนจะปรากฏตัวด้วย เช่นกัน ช่างเถอะ อย่าไปสนใจ[guest_of_interest_4.GetHerHim]เลย"
 playdate.2001.a:0 "ยินดีต้อนรับ!"
 playdate.2001.a.tt:0 "การพบปะสหายเริ่มต้นขึ้น"

 playdate.2003.t:0 "$playdate_header$ การเฉลิมฉลองที่น่าสงสาร"
 playdate.2003.desc:0 "ข้าพเจ้าไม่อยากจะเชื่อเลย! แม้ว่าข้าพเจ้าจะส่งคำเชิญและเตรียมการแล้ว แต่ก็ไม่มีใครมางานพบปะสหายของข้าพเจ้าเลยแม้ แต่คนเดียว\n\nช่างเถอะ ข้าไม่สนใจ ข้าจะเพลิดเพลินกับขนมหวานเหล่านี้ด้วยตัวเอง และของเล่นเหล่านี้ และ... และ... ทำไมไม่มีใครมาเลย?"
 playdate.2003.a:0 "ทำไมไม่มีใครมาเลย?"
 
 playdate.2501.t:1 "การต้อนรับอันอบอุ่น"
 playdate.2501.likes_host:1 "ทุกคนรวมตัวกันในห้องโถงใหญ่ขณะที่ [host.GetTitledFirstNameNoTooltip] ต้อนรับพวกเราทุกคนสู่การพบปะสหาย!"
 playdate.2501.dislikes_host:1 "ทุกคนต่างมาชุมนุมกันในห้องโถง ในขณะที่ [host.GetTitledFirstNameNoTooltip] ผู้ [host.Custom2('InsultAdjective', ROOT.Char)] กล่าวต้อนรับพวกเราทั้งปวงสู่การพบปะสหาย"
 playdate.2501.a:0 "ข้าตั้งตารอคอยสิ่งนี้!"
 playdate.2501.a_dislike:0 "ให้มันจบๆ ไปเสียที"

 playdate.0020.t:0 "$playdate_header$ สิ้นสุดการละเล่น"
 playdate.0020.desc:0 "พวกเขาบอกว่า [host.Custom2('MyCharacterIntroduction', ROOT.Char)] ได้จากไปแล้ว แต่ดูเหมือนไม่มีใครสามารถบอกข้าพเจ้าได้ว่านั่นหมายความว่าอย่างไรจริงๆ สิ่งที่ข้ารู้คือการพบปะสหายของ[host.GetHerHis]สิ้นสุดลงแล้ว"
 playdate.0020.a:0 "แต่เราสนุกกันมาก!"
 playdate.0020.a.tt:0 "#F ท่านก็รู้... จนกระทั่ง[host.GetSheHe]หายตัวไป#!"

 playdate.0021.desc:0 "เนื่องจากตอนนี้ข้าติดอยู่ในคุก การพบปะสหายของข้าจึงถูกยกเลิก โอ้ ชั่วโมงทั้งหมดที่ข้าใช้รอคอยมัน... เสียเปล่า!"
 playdate.0021.a:0 "ความสนุกทั้งหมดที่เราน่าจะได้มี..."

 playdate.0022.desc:0 "[host.Custom2('MyCharacterIntroduction', ROOT.Char)|U] ถูกคุมขัง และการพบปะสหายของ[host.GetHerHis]ได้สิ้นสุดลงแล้ว ช่างเป็นช่วงเวลาที่โชคร้ายเสียนี่กระไร!"

 playdate.3001.t:1 "เล่นแรง"
 playdate.3001.desc:0 "ข้าพเจ้าคิดว่า [guest.Custom2('MyCharacterIntroduction', ROOT.Char)] และ[peasant_child.Custom('GirlBoy')]ชาวบ้านเพียงแค่แกล้งต่อสู้กัน แต่ทันใดนั้นก็มีเลือดเปื้อนดิน\n\n[guest.GetFirstNameNoTooltip] ล้มลงกับพื้นพร้อมเสียงครืดคราด และชาวบ้านที่ยืนอยู่เหนือ[guest.GetHerHim]ก็เคลื่อนไหวเพื่อโจมตีอีกครั้ง"
 playdate.3001.a:0 "ข้าจะช่วย[guest.GetHerHim]!"
 playdate.3001.a_injured:0 "ท่านได้รับบาดเจ็บ"
 playdate.3001.b:0 ""ใครก็ได้ ช่วยด้วย!""
 playdate.3001.c:0 "นี่ดูน่าสนุก ให้ข้าลองบ้าง!"

 playdate.3002.t:1 "ความลับ"
 playdate.3002.desc:0 "[secret_holder.Custom2('MyCharacterIntroduction', ROOT.Char)|U] กำลังซ่อนบางอย่างอย่างเห็นได้ชัด\n\nแต่ — ทันทีที่[secret_holder.GetSheHe]ตกลงที่จะบอกข้าพเจ้าว่ามันคืออะไร — [close_participant.Custom2('MyCharacterIntroduction', ROOT.Char)] ก็เข้ามาหาเราและยืนกรานให้ข้าพเจ้าเล่นหมากรุกกับ[close_participant.GetHerHim]"
 playdate.3002.a:0 "แน่นอน ข้าไม่สนใจความลับไร้สาระ"
 playdate.3002.b:0 "จุ๊ๆ ข้าอยากรู้ความลับ!"

 playdate.3003.t:1 "[ROOT.Char.Custom('CatStoryName')]"
 playdate.3003.desc_opening:0 "ข้าพเจ้าพาแมวของข้า [ROOT.Char.Custom('CatStoryName')] มาด้วย เพื่อให้ทุกคนได้เห็นว่าข้าพเจ้ามีแมวที่ยอดเยี่ยมแค่ไหน\n\n"
 playdate.3003.desc_bonding_cat_opening:0 ""ท่านมีแมวน่ารักจัง! ท่านอยากเห็นของข้าไหม?""
 playdate.3003.desc_bonding_cat:0 "[guest.Custom2('MyCharacterIntroduction', ROOT.Char)|U] ยื่นแมว[guest.Custom('CatFurColor')]มาให้ข้าพเจ้า "[guest.Custom('CatStoryHerHis')|U] ชื่อ [guest.Custom('CatStoryName')]!""
 playdate.3003.desc_bonding_dog_opening:0 ""ท่านมีแมวน่ารักจัง! ท่านอยากเห็นสุนัขของข้าไหม?""
 playdate.3003.desc_bonding_dog:0 "[guest.Custom2('MyCharacterIntroduction', ROOT.Char)|U] นำเสนอสุนัข[guest.Custom('DogFurColor')]ให้ข้าพเจ้า "[guest.Custom('DogStoryHerHis')|U] ชื่อ [guest.Custom('DogStoryName')]!""
 playdate.3003.a_cat:0 "แมวของท่านน่ารักมาก!"
 playdate.3003.a_dog:0 "สุนัขของท่านน่ารักมาก!"
 playdate.3003.b:0 "โอ้ ขอบคุณ! มานี่สิ [guest.Custom('DogStoryName')]!"
 playdate.3003.c:0 "อี๋ เจ้าตัวหมัดนี่ ช่างไม่เหมือนแมวของข้าเลย!"

 playdate.3004.t:1 "[ROOT.Char.Custom('DogStoryName')]"
 playdate.3004.desc_opening:0 "ข้าพเจ้าพาสุนัขของข้า [ROOT.Char.Custom('DogStoryName')] มาด้วย เพื่อให้ทุกคนได้เห็นว่าข้าพเจ้ามีลูกสุนัขที่ยอดเยี่ยมแค่ไหน\n\n"
 playdate.3004.desc_bonding_cat_opening:0 ""ท่านมีสุนัขน่ารักจัง! ท่านอยากเห็นแมวของข้าไหม?""
 playdate.3004.desc_bonding_dog_opening:0 ""ท่านมีสุนัขน่ารักจัง! ท่านอยากเห็นของข้าไหม?""
 playdate.3004.b:0 "โอ้ ขอบคุณ! มานี่สิ [guest.Custom('CatStoryName')]!"
 playdate.3004.c:0 "อี๋ เจ้าตัวหมัดนี่ ช่างไม่เหมือนสุนัขของข้าเลย!"

 playdate.3005.t:1 "ความลับ "
 playdate.3005.desc:0 "ข้าพเจ้ากำลังคุยกับ [guest.Custom2('MyCharacterIntroduction', ROOT.Char)] เกี่ยวกับชีวิตในราชสำนักและข่าวลือล่าสุด\n\n"และข้าพเจ้าได้ยินมาว่า [secret_owner.GetTitledFirstName] [secret.Custom('SecretDescriptionThirdPerson')]–"\n\nข้าพเจ้ายั้งตัวเองไว้ แต่ก็สายเกินไป; [guest.GetFirstNameNoTooltip] ได้ยินทุกอย่างแล้ว"
 playdate.3005.a: "อ่า... อุ๊ย"
 playdate.3005.b:0 "ได้โปรด ลืมสิ่งที่ข้าพูดไปเถอะ! ข้าจะทำทุกอย่าง!"
 playdate.3005.c:0 "ข้าจะจ่ายให้ท่าน! แค่เงียบไว้!"
 playdate.3005.d:0 "ถ้าท่านบอกใคร ข้าจะ– ข้าจะทำร้ายท่าน!"
 playdate.3005.d.success:0 "[guest.GetFirstNameNoTooltip] สัญญาว่าจะปิดปาก [guest.GetHerHis] ให้สนิท"
 playdate.3005.d.failure:0 "[guest.GetFirstNameNoTooltip] ไม่กลัวท่าน"
 promise_to_keep_secret: "[guest.GetFirstNameNoTooltip] สัญญาว่าจะไม่เปิดเผย[secret|E]"

 playdate.3006.t:1 "เพื่อนอ่านหนังสือ"
 playdate.3006.desc:0 "ข้าพเจ้าพกหนังสือเล่มเล็กติดตัวมาด้วย – อย่างที่ข้าพเจ้าทำเป็นปกติ – และ [fellow_nerd.Custom2('MyCharacterIntroduction', ROOT.Char)] ก็พบข้าพเจ้าขณะที่ข้าพเจ้ากำลังนั่งลงอ่านสองสามหน้า\n\n"โอ้ นั่นคือ #EMP [SCOPE.Custom('RandomInformativeTextName')|U]#!? ข้าพเจ้าเพิ่งอ่านมัน ท่านมีความเห็นอย่างไรเกี่ยวกับสำนวนโวหาร?""
 playdate.3006.a:0 "นี่จะเป็นการสนทนาที่ดี!"
 playdate.3006.b:0 "ไปให้พ้น ข้ากำลังอ่านหนังสือ"

 playdate.3007.t:1 "การปีนป่าย"
 playdate.3007.desc:0 "[participant.Custom2('MyCharacterIntroduction', ROOT.Char)|U] ได้ปีนขึ้นไปบน[ROOT.Char.Custom('ObjectToClimb')]ที่สูงที่สุดในบริเวณนี้และกำลังโบกมืออย่างกระตือรือร้นให้ข้าพเจ้าตามไป\n\nมันไม่ใช่[ROOT.Char.Custom('ObjectToClimb')]แรกที่ข้าพเจ้าปีน แต่มันดูเหมือนจะสูงมาก..."
 playdate.3007.a:0 "ข้าจะไม่ยอมแพ้!"
 playdate.3007.a.success:0 "ท่านปีนสำเร็จ"
 playdate.3007.a.failure:0 "ท่านตกลงมาอย่างแรง"
 playdate.3007.b:0 "ไม่ ข้าคิดว่าข้าจะอยู่ข้างล่างนี่แหละ"

 playdate.3008.t:1 "ไปว่ายน้ำกัน"
 playdate.3008.desc:0 "[participant.Custom2('MyCharacterIntroduction', ROOT.Char)|U] ตรงไปที่ [ROOT.Char.Custom('IndefiniteBodyOfWater')] และโยน [participant.GetHerselfHimself] ลงไปโดยไม่ลังเล\n\nสิ่งที่เริ่มต้นจากการสาดน้ำเล่นๆ ในไม่ช้าก็กลายเป็นสิ่งที่ตื่นตระหนกมากขึ้น และทันใดนั้น [participant.GetSheHe] ก็หายไปใต้ผิวน้ำ ขณะที่ช่วงเวลาผ่านไป ข้าตระหนักว่า [participant.GetSheHe] จะไม่โผล่ขึ้นมาอีก อย่างน้อยก็หากไม่ได้รับความช่วยเหลือ"
 playdate.3008.a:0 "รอเดี๋ยว ข้ากำลังไป!"
 playdate.3008.a.success:0 "ท่านช่วย[participant.GetFirstNameNoTooltip]ไว้ได้"
 playdate.3008.a.failure:0 "ท่านไปไม่ทันเวลา"
 playdate.3008.a.critical_failure:0 "ท่านเกือบจมน้ำตายเอง"
 playdate.3008.b:0 "ได้โปรด ใครก็ได้ ช่วยด้วย!"
 playdate.3008.b.success:0 "มีคนได้ยินและเข้ามาช่วย"
 playdate.3008.b.failure:0 "ไม่มีใครมาช่วย"
 playdate.3008.c:0 "[participant.GetSheHe|U] คงกลับบ้านไปแล้ว..."

 playdate.3009.t:1 "วันหิมะตก"
 playdate.3009.desc_two:0 "ข้าพเจ้าย่องไปข้างหลัง [participant.Custom2('MyCharacterIntroduction', ROOT.Char)] และ [to_blame.Custom2('MyCharacterIntroduction', ROOT.Char)] โดยมีหิมะเต็มมือ และทันทีที่[participant.GetFirstNameNoTooltip]กำลังจะหันกลับมา ข้าพเจ้าก็กระโจนเข้าใส่!"
 playdate.3009.desc_opening:0 "ข้าพเจ้าย่องไปข้างหลัง [participant.Custom2('MyCharacterIntroduction', ROOT.Char)] โดยมีหิมะเต็มมือ และทันทีที่[participant.GetSheHe]กำลังจะหันกลับมา ข้าพเจ้าก็กระโจนเข้าใส่!"
 playdate.3009.desc:0 "\n\n[participant.GetSheHe|U] กรีดร้อง แต่ก็ตอบโต้กลับอย่างรวดเร็ว; ไม่นานข้าพเจ้าก็ต้องถอยหนี และ[participant.GetSheHe]ก็พุ่งเข้ามาหาข้าพเจ้าเต็มแรงพร้อมกับก้อนหิมะขนาดใหญ่ในมือของ[participant.GetHerHis]!"
 playdate.3009.a:0 "ข้าจะไม่ยอมถอย!"
 playdate.3009.a.success:0 "ท่านชนะการต่อสู้ด้วยหิมะ"
 playdate.3009.a.failure:0 "ท่านโดนก้อนหิมะแข็งโป๊กปาใส่หัว"
 playdate.3009.b:0 "ได้โปรด ไว้ชีวิตข้าด้วย!"
 playdate.3009.c:0 "เป็น[to_blame.GetFirstNameNoTooltip] ไม่ใช่ข้า!"
 playdate.3009.c.success:0 "[participant.GetFirstNameNoTooltip] เชื่อท่าน"
 playdate.3009.c.failure:0 "[participant.GetSheHe|U] รู้ว่าท่านกำลังโกหก"

 playdate.3010.t:1 "วันตลาด"
 playdate.3010.desc:0 "[participant.Custom2('MyCharacterIntroduction', ROOT.Char)|U] และข้าพเจ้าเห็นพ้องกันว่าการค้าเป็นทักษะสำคัญที่ขุนนางควรเรียนรู้ ดังนั้นเราจึงตัดสินใจไปเยี่ยมชมตลาดท้องถิ่นใน [ROOT.Char.GetCurrentLocation.GetName]\n\nเรามีเพียงก้อนกรวดเป็นเงินตรา แต่มัน #EMP แวววาว#! มาก!"
 playdate.3010.a:0 "เอ่อ ข้าพเจ้าต้องการซื้อสินค้า โปรด"
 playdate.3010.a.success:0 "ท่านโน้มน้าวให้พ่อค้าทำการค้าได้สำเร็จ"
 playdate.3010.a.failure:0 "พ่อค้าไล่ท่านไป"
 playdate.3010.b:0 "ท่านต้องให้สิ่งที่ข้าต้องการ! ข้าเป็น #EMP [ROOT.Char.GetLadyLord]#!!"
 playdate.3010.c:0 "มาตั้งแผงขายของของเราเองกันเถอะ!"
 playdate.3010.c.tt:0 "พ่อค้าบางคนตามใจท่านและ "ซื้อ" ก้อนกรวดของท่านด้วยใบไม้"

 playdate.3011.t:1 "เล่นขายของ"
 playdate.3011.desc:1 "[participant.Custom2('MyCharacterIntroduction', ROOT.Char)|U] เข้ามาหาข้าพเจ้าพร้อมกับกองผ้าในอ้อมแขนของ[participant.GetHerHis] ขณะที่[participant.GetSheHe]ทิ้งมันลงบนพื้นตรงหน้าข้าพเจ้า ข้าพเจ้าก็ตระหนักว่ามันคือกองเสื้อผ้า – สำหรับผู้ใหญ่!\n\n"มาเล่นขายของกันเถอะ!""
 playdate.3011.a:0 "ต่อเมื่อเราเป็นพ่อแม่เท่านั้น!"
 playdate.3011.b:0 "แน่นอน และ[disliked_participant.GetFirstNameNoTooltip]เป็นสุนัข!"
 playdate.3011.c:0 "ไม่ นั่นมันไร้สาระ มาเล่นหมากรุกกันเถอะ"
 playdate.3011.c.tt:1 "ท่านศึกษาเพิ่มเติมในศิลปะแห่ง[THIS.Char.Custom('education_focus_child')]"

 playdate.3012.t:1 "$knight_culture_player_plural_no_tooltip$ผู้กล้าหาญ"
 playdate.3012.desc_knight:0 "[participant.Custom2('MyCharacterIntroduction', ROOT.Char)|U] และข้าพเจ้ากำลังดู$knight_culture_player_plural_no_tooltip_lowercase$ฝึกซ้อมในลานบ้านเมื่อ [knight.Custom2('MyCharacterIntroduction', ROOT.Char)] เข้ามาหาเราพร้อมรอยยิ้ม"
 playdate.3012.desc_no_knight:0 "[participant.Custom2('MyCharacterIntroduction', ROOT.Char)|U] และข้าพเจ้ากำลังดูชาวบ้านฝึกซ้อมเมื่อคนหนึ่งเข้ามาหาเราพร้อมรอยยิ้ม"
 playdate.3012.desc:0 "\n\n"ว่าอย่างไร [participant.Custom('GirlsBoysChildren')] คิดว่าพวกเจ้าจะรับมือกับพื้นฐานได้ไหม?""
 playdate.3012.a:0 "#EMP ได้!#!"
 playdate.3012.a.success:0 "ท่านเรียนรู้พื้นฐานได้"
 playdate.3012.a.neutral:0 "ไม่ว่าท่านจะพยายามหนักแค่ไหน ท่านก็ไม่เข้าใจ"
 playdate.3012.a.failure:0 "ท่านถูกตีที่หัว – #EMP อย่างแรง#!"
 playdate.3012.b:0 "ข้าอยากดูท่านฝึกมากกว่า"

 playdate.3013.t:1 "[witch.GetWomanMan|U]ผู้ปราดเปรื่อง"
 playdate.3013.desc:0 "เรากำลังเล่นอยู่ในป่า ทันใดนั้นข้าพเจ้าก็พบว่าตัวเองอยู่คนเดียว; ข้าพเจ้าสาบานได้ว่าคนอื่นๆ เพิ่งอยู่ข้างหลังข้าพเจ้า!\n\nทันทีที่ข้าพเจ้ากำลังจะเริ่มกรีดร้อง – เพื่อให้พวกเขาหาข้าพเจ้าเจอ ไม่ใช่ เพราะข้าพเจ้า #EMP กลัว#! – ข้าพเจ้าก็บังเอิญเจอ[witch.Custom2('MyCharacterIntroduction', ROOT.Char)]ในชุดคลุมสีดำ [witch.GetSheHe|U] กำลังนั่งยองๆ บนพื้นตรวจสอบพืชหน้าตาประหลาดบางชนิด เปรียบเทียบกับพืชที่วาดไว้ในตำราเล่มใหญ่สีดำที่เปิดอยู่ข้างๆ [witch.GetHerHim]\n\n"สวัสดี [ROOT.Char.GetLadyLord]น้อยของข้า การเรียกร้องแห่งความรู้ได้นำท่านมาหาข้าที่นี่หรือ?""
 playdate.3013.a:0 "ข้าพเจ้าแค่อยากรู้เกี่ยวกับพืชที่ท่านถืออยู่"
 playdate.3013.a.success:0 "ท่านเรียนรู้มากมายเกี่ยวกับสมุนไพรและพืช"
 playdate.3013.a.failure:0 "ท่านไม่เข้าใจเลยว่า[witch.GetSheHe]กำลังพูดถึงอะไร"
 playdate.3013.b:0 "ใช่ สอนทุกอย่างที่ท่านทำได้ให้ข้าพเจ้า!"
 playdate.3013.c:0 "ท่าน... ท่านเป็นแม่มด! ท่านเป็นคนไม่ดี"

 playdate.3014.t:1 "[priest.GetCouncilTitle|U]"
 playdate.3014.desc_participant:0 "เรากำลังสำรวจ[ROOT.Char.GetFaith.HouseOfWorship]ท้องถิ่นเมื่อ [participant.Custom2('MyCharacterIntroduction', ROOT.Char)|U] และข้าพเจ้าบังเอิญเจอ[priest.Custom2('MyCharacterIntroduction', ROOT.Char)]ท่ามกลางม้วนคัมภีร์\n\n"พวกมันคือบันทึกจากสมัยโบราณ ท่านสนใจเรื่อง เช่นนี้หรือไม่?""
 playdate.3014.desc:0 "ข้าพเจ้ากำลังสำรวจ[ROOT.Char.GetFaith.HouseOfWorship]ท้องถิ่นเมื่อข้าพเจ้าบังเอิญเจอ[priest.Custom2('MyCharacterIntroduction', ROOT.Char)|U]ท่ามกลางม้วนคัมภีร์\n\n"พวกมันคือบันทึกจากสมัยโบราณ ท่านสนใจเรื่อง เช่นนี้หรือไม่?""
 playdate.3014.a:0 "ใช่! สอนข้าพเจ้าเกี่ยวกับพวกมัน"
 playdate.3014.a.success:0 "ท่านเรียนรู้ศิลปะการจดบันทึก"
 playdate.3014.a.neutral:0 "ท่านเรียนรู้บางสิ่ง"
 playdate.3014.a.tt:0 "ท่านศึกษาเพิ่มเติมในศิลปะแห่ง[ROOT.Char.Custom('education_focus_child')]"
 playdate.3014.a.tt_participant:0 "ท่านและ[participant.GetFirstNameNoTooltip]ศึกษาเพิ่มเติมในศิลปะแห่ง[ROOT.Char.Custom('education_focus_child')]"
 playdate.3014.a.failure:0 "ท่านไม่ได้เรียนรู้อะไรเลย"
 playdate.3014.b:0 "ไม่ ข้าพเจ้าสนใจให้ท่านเล่าเรื่องการผจญภัยให้เราฟัง!"

# Learning your child drowned - by Isabella Welch

 playdate.4000.t:0 "เปียกปอนด้วยน้ำตา"
 playdate.4000.desc:0 "ผู้ส่งสารมาพร้อมข่าวร้ายและหีบสีดำใบเล็ก\n\n[ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('drowned_participant'))]ของข้า [drowned_participant.GetFirstNameNoTooltip] จมน้ำขณะเล่นกับ[host.GetTitledFirstName]\n\nข้าพเจ้าแทบมองไม่เห็นผ่านม่านน้ำตาเข้าไปในหีบ — แต่การเหลือบมองเพียงครั้งเดียวก็ยืนยันว่านี่คือศพของลูกรักของข้าพเจ้าจริงๆ"
 playdate.4000.a:0 "ข้าหวังว่า[participant.GetSheHe]จะได้เล่นอยู่ใน[ROOT.Char.GetFaith.PositiveAfterLife]"
 playdate.4000.b:0 "ความไร้เดียงสาคือยาพิษร้ายแรง"
 playdate.4000.c:0 "ข้าขอให้ชะตากรรมเดียวกันเกิดกับ[host.GetTitledFirstNameNoTooltip]"

 playdate.4001.t:1 "อุปสรรคทางภาษา"
 playdate.4001.desc.rowdy:0 ""ข้าบอกว่า #EMP "ตุ๊กตา"#! ไม่ใช่ #EMP "น่าเบื่อ!"#! ให้ตายสิ!" [participant.GetTitledFirstName] เห็นได้ชัดว่าหงุดหงิดกับอุปสรรคทางภาษาของเรา การยกมือขึ้นในอากาศแสดงภาพของอาการโมโหที่อยากจะเริ่มขึ้น"
 playdate.4001.desc.pensive:0 ""ขอโทษ... #EMP ที่พำนัก#! นางกลับไปยังที่พำนักอันต่ำต้อยของนาง ไม่ใช่ห่อของในต่างแดน" แม้ว่า[participant.GetHerHis]จะมีมารยาทดี แต่คิ้วของ[participant.GetTitledFirstNamePossessive]ก็ขมวดเข้าหากันด้วยความหงุดหงิด"
 playdate.4001.desc:0 "\n\nภาษา[ROOT.Char.GetCulture.GetLanguage.GetName]และภาษา[participant.GetCulture.GetLanguage.GetName]ดูเหมือนจะมีความแตกต่างมากกว่าความคล้ายคลึงกัน ด้วยเหตุนี้เราจึงพยายามพูดคุยกัน\n\nบางทีข้าอาจจะทำอะไรบางอย่าง เพื่อให้เราสามารถเล่นด้วยกันได้โดยไม่โกรธ หรือข้าควรหวังว่ามันจะคลี่คลายไปเอง?"
 playdate.4001.a:0 "ข้าจะพูดช้าๆ และดังๆ! นั่นน่าจะช่วยได้!"
 playdate.4001.b:0 "บางทีข้าอาจจะขอให้[participant.GetFirstNameNoTooltip]สอนภาษา[participant.GetCulture.GetLanguage.GetNameNoTooltip]ให้ข้าบ้าง?"
 playdate.4001.c:0 "เหอะ ทำไมข้าต้องใส่ใจด้วย? ข้าแค่อยากสนุก!"

 playdate.5001.t: "ออกมาเล่นกันไหม?"
 playdate.5001.desc: "ลูกบอลกระดอนผ่านข้าพเจ้าไป ถูกตักกลับเข้าไปในอ้อมแขนที่รออยู่ของ[participant.GetFirstName]\n\n"เจ้าอยากเข้าร่วมไหม? เรามีลูกบอล และเราต้องการผู้เล่นเพิ่มอีกหน่อย"\n\nกลุ่มเด็กเล็กๆ รวมตัวกันรอบตัวเราอย่างคาดหวัง"
 playdate.5001.a: "ข้าจะเข้าร่วม!"
 playdate.5001.a.tt: "เกมเริ่มต้นขึ้น!"
 playdate.5001.b: "ข้าไม่ค่อยอยากเล่นเท่าไหร่..."

 playdate.5002.t: "เล็งพลาด"
 playdate.5002.desc: "ลูกบอลกระดอนอย่างผิดปกติขณะที่มันผ่านข้าพเจ้าไป กระเด็นออกจากกำแพง... และเข้าไปในสวนใกล้เคียง! เสี้ยววินาทีต่อมา เสียงแตกหักและเสียงร้องด้วยความโกรธก็ประกาศถึงผลที่ตามมา\n\n[neighbour.GetFirstName] พรวดพราดออกมาจากประตู ประคอง[broken_artifact.GetName]ที่เสียหายของ[neighbour.GetHerHis]ไว้ สแกนฝูงชน [neighbour.GetSheHe] ระบุว่าข้าพเจ้าเป็นผู้กระทำผิด\n\n"เจ้ามีอะไรจะแก้ตัวไหม เจ้าเด็กเหลือขอจมูกมอมแมม?" [neighbour.GetSheHe|U] คำราม ข้าพเจ้ามองหารอบๆ เพื่อขอความช่วยเหลือ ไม่มีใครยื่นมือเข้ามา"
 playdate.5002.a: ""[ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('parent'))]ของข้าจะจ่ายค่าซ่อมแซม!""
 playdate.5002.a.tt: "หรือ เอ่อ ข้าเดาว่า #EMP ข้า#! จะจ่าย แต่ข้าจะไม่ต้องควักกระเป๋าจ่ายนานนัก..."
 playdate.5002.b: "ข้าขอสั่งให้เจ้าคืนลูกบอลมา, [neighbour.Custom2('InsultNoun', ROOT.Char)]"
 playdate.5002.b.tt: "[neighbour.GetSheHe]ลืมไปแล้วหรือว่าข้าเป็น[ROOT.Char.GetTitleAsNameNoTooltip]?"
 playdate.5002.b.success: "[neighbour.GetSheHe|U] คืนลูกบอลอย่างเชื่อฟัง"
 playdate.5002.b.failure: "[neighbour.GetSheHe|U] ขมวดคิ้วขณะคืนลูกบอล"
 playdate.5002.c: ""ข้าขอโทษ ขอเราคืนลูกบอลได้ไหม?""
 playdate.5002.c.success: "[neighbour.GetSheHe|U] คืนลูกบอลพร้อมรอยยิ้ม"
 playdate.5002.c.failure: "[neighbour.GetSheHe|U] คืนลูกบอลพร้อมถอนหายใจลึกๆ"

 playdate.5003.t: "สร้างมาต่างกัน"
 playdate.5003.desc: "[other_child.GetFirstName] เร็วและแข็งแรงเกินไป! เมื่อใดก็ตามที่ข้าพเจ้าพยายามตามให้ทัน ข้าพเจ้าก็แค่กระเด็นออกจาก[other_child.GetHerHim] แม้ขณะที่ข้าพเจ้าถอยกลับไปดู[other_child.GetHerHim]เล่น เตะฟุตบอลข้ามลาน ข้าพเจ้าก็ต้องหยุดพักหายใจจากการไล่ตามทั้งหมด\n\nต้องมีวิธีที่ข้าพเจ้าจะแข่งขันได้แน่ๆ?"
 playdate.5003.a: "[other_child.GetFirstNameNoTooltip] ไม่มีเครื่องป้องกันหน้าแข้งเลย..."
 playdate.5003.b: "ข้าแค่ต้องพยายามให้หนักขึ้น!"
 playdate.5003.b.success: "ท่านตามทัน"
 playdate.5003.b.failure: "[other_child.GetFirstNameNoTooltip] แข็งแรงเกินไป"
 playdate.5003.c: "บางทีถ้าข้าพเจ้าดูต่อไป ข้าพเจ้าอาจเรียนรู้อะไรบางอย่างได้"

 playdate.5004.t: "อีกมุมมองหนึ่ง"
 playdate.5004.desc: "ขณะที่เราวิ่งผ่านไป หัวเราะและพูดคุยกันในการไล่ตามลูกบอล ร่างหนึ่งโดดเดี่ยวก็สะดุดตาข้าพเจ้า\n\n[other_child.GetFirstName] นั่งอยู่ข้างๆ อย่างขี้อายเฝ้าดูเหตุการณ์ [other_child.GetSheHe|U] สบตาข้าพเจ้าครู่หนึ่งก่อนจะมองไปทางอื่นทันที แสร้งทำเป็นสนใจดอกไม้บางชนิด\n\n[other_child.GetSheHe|U] ดูเหมือน[other_child.GetSheHe]ต้องการเพื่อนคุย"
 playdate.5004.a: ""เจ้าจะว่าอะไรไหมถ้าข้าจะเข้าร่วมกับเจ้า?""
 playdate_5004_sports_removal: "ท่านจะไม่เกี่ยวข้องกับเกมฟุตบอลที่กำลังดำเนินอยู่อีกต่อไป"
 playdate.5004.b: ""มาเถอะ เข้าร่วมสิ!""
 playdate.5004.b.success: "พวกเขาเข้าร่วมอย่างลังเล"
 playdate.5004.b.failure: "พวกเขาไม่สนใจความพยายามของท่าน"
 playdate.5004.c: "ปล่อยพวกเขาไว้ตามลำพังดีกว่า"

 playdate.5005.t: "กำแพงใหญ่"
 playdate.5005.desc: "นั่นลูกบอล! ขณะที่มันผ่านข้าพเจ้าไป ข้าพเจ้าก็เหวี่ยงขาเตะมันสุดแรง ไกล #EMP เกินไป#! มาก\n\nลูกบอลลอยคว้างไปในอากาศ หมุนอย่างรวดเร็ว มันหวือผ่านฝูงชน สูงขึ้นไปในอากาศ และลอยข้ามกำแพงใกล้เคียง เสียงตกกระทบดังสนั่น\n\nข้าพเจ้าเงยหน้ามองกำแพง มันค่อนข้างสูง สูงกว่าความสูงของข้าพเจ้าถึงสองเท่า"
 playdate.5005.ending: "สูงเกินไปหน่อยสำหรับความชอบของข้าจริงๆ ขณะที่ข้าครุ่นคิดถึงทางเลือกต่างๆ ข้าสังเกตเห็น [bullied_kid.GetFirstName] ยืนอยู่ห่างออกไป ทำสุดความสามารถ [bullied_kid.GetHerHis] ที่จะมองไปทางอื่นนอกจากกำแพง"
 playdate.5005.a: "[bullied_kid.GetFirstNameNoTooltip] ควรไปเอามันมา!"
 playdate.5005.b: "เอาล่ะ #EMP กำแพง#! เอาเลย..."
 playdate.5005.b.success: "ท่านกระโดดข้ามกำแพง สง่างามที่สุด"
 playdate.5005.b.success.tt: "ผู้เข้าร่วมทั้งหมดได้รับความเห็น #positive_value +15#! จากท่าน"
 playdate.5005.b.failure: "ท่านกระโดดข้ามกำแพง แล้วคว้าลูกบอล"
 playdate.5005.b.failure.tt: "ผู้เข้าร่วมทั้งหมดเสียความเห็น #negative_value -5#! จากท่าน"
 playdate.5005.b.failure.gameends: "เกมฟุตบอลสิ้นสุดลง"
