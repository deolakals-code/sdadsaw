 playdate.5010.t: "นั่นคือ[embarrassed_child.Custom('GirlBoy')|U]ของข้า!"
 playdate.5010.desc: ""จับเขา! ผลักเธอเข้ากำแพง! นั่นแหละ!" เสียงของ[obnoxious_parent.GetFirstNamePossessive]ดังกระหึ่มไปทั่วลาน [obnoxious_parent.GetSheHe|U] ได้ไปยืนอยู่ที่มุมเพื่อดู[embarrassed_child.GetFirstName]เล่นในเกมฟุตบอล ความลำเอียงของพวกเขาที่มีต่อ[embarrassed_child.Custom('GirlBoy')]นั้นเห็นได้ชัดเจน\n\nพูดได้เลยว่า [obnoxious_parent.GetFirstNameNoTooltip] กำลังจริงจังกับมัน #EMP เกินไป#! นิดหน่อย\n\n"เฮ้! ห้ามผลัก[embarrassed_child.Custom('HerHim')] นั่นมันโกง!" การแสดงท่าทางเกินจริงของ[obnoxious_parent.GetFirstNamePossessiveNoTooltip]เริ่มน่ารำคาญจริงๆ"
