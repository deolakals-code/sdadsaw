 playdate.5007.b: ""#EMP ข้า#! อยากเป็น""
 playdate.5007.c: "ข้าควรอยู่ห่างๆ เรื่องนี้ดีกว่า"

 playdate.5008.t: "ช่วงเวลาของผู้สูงวัย"
 playdate.5008.desc: ""พวกเจ้าจะ #EMP เงียบ#! ได้ไหม เพื่อเห็นแก่[old_timer.GetFaith.HighGodName]?" [old_timer.GetFirstName] กำลังเอนตัวออกจากหน้าต่างลูกฟักเหนือพวกเรา โกรธจัด เขย่ากำปั้น "เจ้าเด็กเหลือขอพวกนี้ส่งเสียงดังเหลือเกิน! ข้าแทบจะไม่ได้ยินเสียงความคิดของตัวเอง #EMP เลย!#!"\n\nข้าพเจ้าหยิบลูกบอลขึ้นมาขณะที่มันเข้ามาใกล้ข้าพเจ้า มองดู[old_timer.GetWomanMan]ชราขณะที่[old_timer.GetSheHe]บ่นว่าพวกเรา [old_timer.GetSheHe|U] #EMP แก่#! จริงๆ: อาจจะอายุสามสิบหรือสี่สิบปี!\n\nไม่น่าแปลกใจที่[old_timer.GetSheHe]โกรธ"
 playdate.5008.a: ""เงียบไปเลย เจ้าคนแก่บ้า!""
 playdate.5008.b: ""พวกเราขอโทษ เราจะเงียบกว่านี้""

 playdate.5009.t: "เสียงฝีเท้าดังกึกก้อง"
 playdate.5009.desc: "แม้ว่าเราจะเป็นเด็ก แต่ฟุตบอลก็สามารถกลายเป็นการละเล่นที่รุนแรงได้อย่างน่ากลัว สิ่งที่เริ่มต้นจากการแข่งขันที่สนุกสนานกลับกลายเป็นการต่อสู้ระยะประชิดเต็มรูปแบบ และต้องใช้เวลาสองสามวินาทีในการตั้งสติกลับคืนมา\n\nเมื่อข้าพเจ้าทำได้ ข้าพเจ้าก็ได้ยินเสียงร้องด้วยความเจ็บปวดและความหวาดกลัวจากกองเด็กที่กำลังต่อสู้กัน ติดอยู่ที่ด้านล่าง ข้าพเจ้าเห็น[small_kid.GetFirstName] กำลังถูกเหยียบย่ำด้วยเท้าจำนวนมาก [small_kid.GetSheHe|U] ร้องออกมาอย่างน่าสงสาร แต่เสียงดังเกินไปและคนอื่นๆ ก็จดจ่ออยู่กับเกมมากเกินไป"
