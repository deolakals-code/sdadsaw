 playdate.5011.t: "กรรมตามสนอง"
 playdate.5011.desc: "ขณะที่ข้าพเจ้าแสดงละครอย่างสุดความสามารถโดยมีฝูงเด็กที่กังวลอยู่รอบตัวข้าพเจ้า ดวงตาของ[obnoxious_parent.GetFirstNamePossessive]เกือบจะถลนออกมาจากเบ้าตาของ[obnoxious_parent.GetHerHis]\n\n"เจ้าเด็ก... #EMP จอมหลอกลวง!#!" [obnoxious_parent.GetSheHe] คำราม ชี้หน้าข้าพเจ้าอย่างขุ่นเคือง "ข้าจะ ทำให้แน่ใจว่าเจ้า—"\n\n"[obnoxious_parent.GetFirstNameNoTooltip]!" เสียงตะโกนดังมาจากระยะไกล โกรธจัด ใกล้เข้ามาอย่างรวดเร็ว สีหน้าของ[obnoxious_parent.GetFirstNamePossessiveNoTooltip]ซีดเผือดเมื่อ[responsible_adult.GetFirstName]บุกเข้ามาในลาน "นี่มันหมายความว่าอย่างไร?"\n\nโชคดีที่ข้าพเจ้ามีสิ่งเบี่ยงเบนความสนใจ ดังนั้นจึงมีเพียง[obnoxious_parent.GetFirstNameNoTooltip]เท่านั้นที่เห็นรอยยิ้มที่พึงพอใจและสมใจของข้าพเจ้า"
 playdate.5011.a: ""โอ๊ย มันเจ็บมาก! โอ๊ยยยย!""
 playdate.5011.b: "ข้าควรจะสารภาพความจริง..."

 playdate.9001.t:1 "สิ้นสุดความสนุก"
 playdate.9001.desc:0 "เป็นการดีที่ได้ลืมความรับผิดชอบทั้งหมดไปชั่วขณะและใช้เวลากับเด็กคนอื่นๆ แต่ข้าพเจ้าได้รับแจ้งว่าต้องกลับไปปฏิบัติหน้าที่แล้ว...\n\nเราทุกคนสนุกกันมาก! หวังว่าเราจะได้ทำ เช่นนี้อีกในเร็วๆ นี้"
 playdate.9001.a:0 "แล้วพบกันใหม่!"

 playdate.9002.t:1 "กลับบ้าน"
 playdate.9002.desc:0 "เราสนุกกันแค่ไหน! ข้าพเจ้าจะจดจำวันที่ใช้เวลากับ[host.GetTitledFirstNamePossessive]ไปอีกนาน\n\nตอนนี้ข้าพเจ้าได้รับแจ้งว่าถึงเวลาเก็บของและกลับบ้านไปปฏิบัติหน้าที่แล้ว แต่หวังว่าเราจะได้ทำ เช่นนี้อีกในเร็วๆ นี้"
