 playdate.5006.t: "ข้าจะกลับบ้าน!"
 playdate.5006.desc: "การแข่งขันในเกมฟุตบอลเริ่มดุเดือดขึ้น ความคิดนั้นเพิ่งก่อตัวขึ้นในใจข้าพเจ้าเมื่อเกิดเหตุการณ์ปะทะกันอีกครั้ง เมื่อ[ball_kid.GetFirstName]ถูก[bully_kid.GetFirstName]กระแทกอย่างแรง ทำให้[ball_kid.GetHerHim]กลิ้งเข้าไปในพุ่มไม้ใกล้เคียง [bully_kid.GetFirstNameNoTooltip] อย่างช่วยเหลือ เริ่มหัวเราะ\n\n"พ- พอแล้ว!" [ball_kid.GetFirstNameNoTooltip] ตะกุกตะกักอย่างโกรธเคือง ดึง[ball_kid.GetHerselfHimself]ออกจากพุ่มไม้ [ball_kid.GetSheHe|U] คว้าลูกบอลขณะที่[ball_kid.GetSheHe]ทำ เช่นนั้น "ข้าจะกลับบ้าน และข้าจะเอาลูกบอลของข้าไปด้วย!"\n\nความเงียบงันอันน่าอึดอัดปกคลุม"
 playdate.5006.a: ""ข้าขอโทษ [ball_kid.GetFirstNameNoTooltip]""
 playdate.5006.a.tt: "ไม่ใช่ความผิดของท่าน แต่เห็นได้ชัดว่า[bully_kid.GetFirstNameNoTooltip]จะไม่ขอโทษ..."
