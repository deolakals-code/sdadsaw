 playdate.5007.t: "ถูกรังแก"
 playdate.5007.desc: "เสียงหัวเราะอันอึกทึกกึกก้องดังขึ้น เพียงแค่ฝั่งตรงข้ามลานจากข้า, [sad_kid.GetFirstName] กำลังตัวสั่นงันงกต่อหน้า [bully_kid.GetFirstName], ผู้กำลังชี้หน้า [sad_kid.GetHerHim] อย่างเย้ยหยัน\n\n"[sad_kid.GetSheHe|U] แทบจะเตะลูกบอลไม่เป็นด้วยซ้ำ! ใครเล่าจะอยากเป็นสหายกับเจ้า [sad_kid.Custom2('InsultNoun', SCOPE.sC('bully_kid'))] นั่น!"\n\n[sad_kid.GetFirstNameNoTooltip] น้ำมูกน้ำตาไหล, มองไปรอบกายเพื่อหาผู้สนับสนุน, แต่ดูเหมือนว่าช่างหาได้ยากยิ่ง"
 playdate.5007.a: ""เจ้าปล่อย[sad_kid.GetHerHim]ไว้คนเดียว!""
 playdate.5007.a.tt: "ท่านก้าวขึ้นไปเผชิญหน้ากับคนพาล..."
