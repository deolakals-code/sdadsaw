l_english: 
 feast_main_stew_flood.0002.t:1 "ทะเลสตูว์"
 feast_main_stew_flood.0002.stew_introduction_blamed:0 "ข้าดื่มไปมากเกินเล็กน้อยเมื่อข้าสะดุดเข้ากับหม้อต้มขนาดยักษ์ที่แขวนอยู่เหนือเตาผิงในห้องโถงจัดเลี้ยง มันหลุดออกจากสลักและร่วงลงมา น้ำซุปหอมกรุ่นของมันทะลักออกมาท่วมพื้นจนกลายเป็นทะเลสตูว์!"
 feast_main_stew_flood.0002.stew_introduction_blame:0 "ด้วยอาการเมามายสะดุด [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('stew_sea_blamed'))] ของข้า, [stew_sea_blamed.GetTitledFirstName], ได้ปลดสลักหม้อต้มขนาดมหึมาที่แขวนอยู่เหนือเตาผิงกลางห้องโถงจัดเลี้ยง! น้ำซุปหอมกรุ่นทะลักออกมาท่วมพื้นจนกลายเป็นทะเลสตูว์!"
 feast_main_stew_flood.0002.stew_introduction:0 "ท่ามกลางความวุ่นวายของงานเลี้ยง คนรับใช้คนหนึ่งของ [activity.GetOwner.GetTitledFirstNamePossessive] ได้ปลดสลักหม้อต้มขนาดมหึมาที่แขวนอยู่เหนือเตาผิงกลางห้องโถงจัดเลี้ยงโดยบังเอิญ! น้ำซุปหอมกรุ่นทะลักออกมาท่วมครึ่งห้องจนกลายเป็นทะเลสตูว์!"
 feast_main_stew_flood.0002.someone_got_covered:0 "\n\n[stew_sea_gets_covered.GetTitledFirstName] ผู้ [stew_sea_gets_covered.Custom('stew_flood_covered_adjective')] ถูกคลื่นซุปซัดเข้าใส่และสบถเสียงดังกับสภาพที่เละเทะของ [stew_sea_gets_covered.GetHerHis] ขณะที่ไขมันไหลอาบใบหน้าของ [stew_sea_gets_covered.GetHerHis]"
 feast_main_stew_flood.0002.splash_desc_standard:0 "\n\nแขกเหรื่อรีบวิ่งไปยังอีกฟากของห้องโถงขณะที่มวลข้นหนืดแผ่กระจายคราบมันเยิ้มไปตามเท้าที่กำลังวิ่งหลบ"
 feast_main_stew_flood.0002.every_target:0 "\nยอมจำนนต่อความหิวโหยอันไม่อาจสนองได้ของ [stew_sea_glutton.GetHerHis] [stew_sea_glutton.GetTitledFirstName] ทรุดตัวลงกับพื้น กลืนกินสตูว์เนื้อข้นคลั่กให้มากที่สุดเท่าที่ [stew_sea_glutton.GetSheHe] จะทำได้ ขณะที่ [stew_sea_horrified_character.GetTitledFirstName] มองดูด้วยความสยดสยองอย่างที่สุด"
 feast_main_stew_flood.0002.only_glutton:0 "\n\nยอมจำนนต่อความหิวโหยอันไม่อาจสนองได้ของ [stew_sea_glutton.GetHerHis] [stew_sea_glutton.GetTitledFirstName] ทรุดตัวลงกับพื้น กลืนกินสตูว์เนื้อข้นคลั่กให้มากที่สุดเท่าที่ [stew_sea_glutton.GetSheHe] จะทำได้"
 feast_main_stew_flood.0002.only_horror:0 "\n\n[stew_sea_horrified_character.GetTitledFirstName] ยืนนิ่งไม่ไหวติงอยู่ท่ามกลางเหตุการณ์ทั้งหมด ตกตะลึงและสยดสยองกับความสิ้นเปลืองอันฟุ่มเฟือย"
 feast_main_stew_flood.0002.a:0 "ข้าไม่เคยเห็นสตูว์มากขนาดนี้มาก่อน"
 feast_main_stew_flood.0003.t:1 "ทะเลสตูว์"
 feast_main_stew_flood.0003.stew_introduction_blame:0 "ด้วยอาการเมามายสะดุด [stew_sea_blamed.GetTitledFirstName] ได้ปลดสลักหม้อต้มขนาดมหึมาที่แขวนอยู่เหนือเตาผิงกลางห้องโถงจัดเลี้ยง! น้ำซุปหอมกรุ่นทะลักออกมาท่วมครึ่งห้องจนกลายเป็นทะเลสตูว์!"
 feast_main_stew_flood.0003.stew_introduction:0 "ท่ามกลางความวุ่นวายของงานเลี้ยง คนรับใช้โง่เง่าคนหนึ่งดันไปปลดสลักหม้อต้มขนาดมหึมาที่แขวนอยู่เหนือเตาผิงในห้องโถงจัดเลี้ยง! น้ำซุปหอมกรุ่นทะลักออกมาท่วมครึ่งพื้นจนกลายเป็นทะเลสตูว์!"
 feast_main_stew_flood.0003.someone_got_covered:0 "\n\n[stew_sea_gets_covered.GetTitledFirstName] ผู้ [stew_sea_gets_covered.Custom('stew_flood_covered_adjective')] ซึ่งนั่งอยู่ข้างหม้อต้ม ถูกคลื่นซุปซัดเข้าใส่และสบถเสียงดังกับสภาพที่เละเทะของ [stew_sea_gets_covered.GetHerHis] ขณะที่ไขมันไหลอาบใบหน้าของ [stew_sea_gets_covered.GetHerHis]"
 feast_main_stew_flood.0003.splash_desc_standard:0 "แขกเหรื่อรีบวิ่งไปยังอีกฟากของห้องโถงขณะที่มวลข้นหนืดแผ่กระจายคราบมันเยิ้มไปตามเท้าที่กำลังวิ่งหลบ"
 feast_main_stew_flood.0003.every_target:0 "\n\nยอมจำนนต่อความหิวโหยอันไม่อาจสนองได้ของ [stew_sea_glutton.GetHerHis] [stew_sea_glutton.GetTitledFirstName] ทรุดตัวลงกับพื้น กลืนกินสตูว์เนื้อข้นคลั่กให้มากที่สุดเท่าที่ [stew_sea_glutton.GetSheHe] จะทำได้ ขณะที่ [stew_sea_horrified_character.GetTitledFirstName] มองดูด้วยความสยดสยองอย่างที่สุด"
 feast_main_stew_flood.0003.only_glutton:0 "\n\nยอมจำนนต่อความหิวโหยอันไม่อาจสนองได้ของ [stew_sea_glutton.GetHerHis] [stew_sea_glutton.GetTitledFirstName] ทรุดตัวลงกับพื้น กลืนกินสตูว์เนื้อข้นคลั่กให้มากที่สุดเท่าที่ [stew_sea_glutton.GetSheHe] จะทำได้"
 feast_main_stew_flood.0003.only_horror:0 "\n\n[stew_sea_horrified_character.GetTitledFirstName] ยืนนิ่งไม่ไหวติงอยู่ท่ามกลางเหตุการณ์ทั้งหมด ตกตะลึงและสยดสยองกับความสิ้นเปลืองอันฟุ่มเฟือย"
 feast_main_stew_flood.0003.a:0 "สาปแช่งความเละเทะนี้!"
 feast_main_stew_flood.0004.t:1 "ทะเลสตูว์"
 feast_main_stew_flood.0004.stew_introduction_blame:0 "ด้วยอาการเมามายสะดุด [stew_sea_blamed.GetTitledFirstName] ได้ปลดสลักหม้อต้มขนาดมหึมาที่แขวนอยู่เหนือเตาผิงกลางห้องโถงจัดเลี้ยง! น้ำซุปหอมกรุ่นทะลักออกมาท่วมครึ่งพื้นจนกลายเป็นทะเลสตูว์!"
 feast_main_stew_flood.0004.stew_introduction:0 "ท่ามกลางความวุ่นวายของงานเลี้ยง คนรับใช้คนหนึ่งของ [activity.GetOwner.GetTitledFirstNamePossessive] ได้ปลดสลักหม้อต้มขนาดมหึมาที่แขวนอยู่เหนือเตาผิงกลางห้องโถงจัดเลี้ยงโดยบังเอิญ! น้ำซุปหอมกรุ่นทะลักออกมาท่วมครึ่งห้องจนกลายเป็นทะเลสตูว์!"
 feast_main_stew_flood.0004.getting_covered:0 "\nข้านั่งอยู่ใกล้เกินไป และอาหารมันเยิ้มนั้นก็ซัดสาดใส่ข้าราวกับคลื่นที่ปรุงขึ้นในห้วงลึกของ [ROOT.Char.GetFaith.NegativeAfterLife] เสื้อผ้าของข้าอาจทำความสะอาดได้ แต่ความอัปยศอันแสบสันต์จากเสียงหัวเราะเต็มห้องโถงจะไม่มีวันล้างออกได้เลย"
 feast_main_stew_flood.0004.a:0 "เหตุใดเรื่องนี้จึงเกิดขึ้นกับข้า?!"
 feast_main_stew_flood.0005.t:1 "ทะเลสตูว์"
 feast_main_stew_flood.0005.stew_introduction_blame:0 "ด้วยอาการเมามายสะดุด [stew_sea_blamed.GetTitledFirstName] ได้ปลดสลักหม้อต้มขนาดมหึมาที่แขวนอยู่เหนือเตาผิงกลางห้องโถงจัดเลี้ยง! น้ำซุปหอมกรุ่นทะลักออกมาท่วมครึ่งพื้นจนกลายเป็นทะเลสตูว์!"
 feast_main_stew_flood.0005.stew_introduction:0 "ท่ามกลางความวุ่นวายของงานเลี้ยง คนรับใช้คนหนึ่งของ [activity.GetOwner.GetTitledFirstNamePossessive] ได้ปลดสลักหม้อต้มขนาดมหึมาที่แขวนอยู่เหนือเตาผิงกลางห้องโถงจัดเลี้ยงโดยบังเอิญ! น้ำซุปหอมกรุ่นทะลักออกมาท่วมครึ่งห้องจนกลายเป็นทะเลสตูว์!"
 feast_main_stew_flood.0005.cannot_resist:0 "\nเมื่ออาหารอร่อยทั้งหมดนั้นหกกระจายไปทั่ว ข้าก็อดใจไม่ไหว ก่อนที่ข้าจะรู้ตัวว่าเกิดอะไรขึ้น ข้าก็ลงไปคลานสี่ขา เลียสตูว์เหมือนสุนัขข้างถนน! ข้าไม่ได้คิดถึงสิ่งที่แขกคนอื่นจะคิดด้วยซ้ำ ไม่ต้องพูดถึงเจ้าภาพเลย!"
 feast_main_stew_flood.0005.being_watched:0 "\nตลอดเหตุการณ์นั้น ข้าเพียงรับรู้อย่างเลือนรางว่า [stew_sea_horrified_character.GetTitledFirstName] กำลังมองดูข้าด้วยใบหน้าที่บิดเบี้ยวด้วยความรังเกียจ"
 feast_main_stew_flood.0005.a:0 "มันอร่อยเกินห้ามใจ!"
 feast_main_stew_flood.0006.t:1 "ทะเลสตูว์"
 feast_main_stew_flood.0006.stew_introduction_blame:0 "ด้วยอาการเมามายสะดุด [stew_sea_blamed.GetTitledFirstName] ได้ปลดสลักหม้อต้มขนาดมหึมาที่แขวนอยู่เหนือเตาผิงกลางห้องโถงจัดเลี้ยง! น้ำซุปหอมกรุ่นทะลักออกมาท่วมครึ่งพื้นจนกลายเป็นทะเลสตูว์!"
 feast_main_stew_flood.0006.stew_introduction:0 "ท่ามกลางความวุ่นวายของงานเลี้ยง คนรับใช้คนหนึ่งของ [activity.GetOwner.GetTitledFirstNamePossessive] ได้ปลดสลักหม้อต้มขนาดมหึมาที่แขวนอยู่เหนือเตาผิงกลางห้องโถงจัดเลี้ยงโดยบังเอิญ! น้ำซุปหอมกรุ่นทะลักออกมาท่วมครึ่งห้องจนกลายเป็นทะเลสตูว์!"
 feast_main_stew_flood.0006.shocking_experience:0 "มันมากเกินไป การได้เห็นปริมาณอาหารมหาศาลที่จะเสิร์ฟให้แขก ยิ่งเลวร้ายลงไปอีกเมื่อรู้ว่าตอนนี้มันกำลังจะสูญเปล่า"
 feast_main_stew_flood.0006.a:0 "ข้าต้องเบือนหน้าหนี"
 feast_main_stew_flood.0041.t:2 "ท้องอิ่ม"
 feast_main_stew_flood.0041.blame_placed:2 "พวกเราทุกคนยิ้มอย่างพึงพอใจ เจ้าภาพของเรามีเหตุผลที่จะภาคภูมิใจ แม้ว่า [stew_sea_blamed.GetTitledFirstName] อาจจะแบกรับความอัปยศมากกว่าความพึงพอใจหลังจากทำหม้อต้มคว่ำ!"
 feast_main_stew_flood.0041.no_blame_placed:1 "พวกเราทุกคนยิ้มอย่างพึงพอใจ ทิ้งให้เจ้าภาพของเรามีเหตุผลที่จะภาคภูมิใจ ยกเว้นคนรับใช้ที่ทำหม้อสตูว์คว่ำ นั่นเป็นช่วงเวลาที่น่าอับอายอย่างยิ่ง"
 feast_main_stew_flood.0041.a:0 "ช่างเป็นงานเลี้ยงที่ดี"
 feast_main_stew_flood.0042.t:2 "ท้องอิ่ม"
 feast_main_stew_flood.0042.blame_placed:1 "แขกทุกคนของข้ายิ้มอย่างพึงพอใจที่จานของพวกเขาเมื่อข้ามองดูพวกเขา ภูมิใจในการแสดงความเอื้อเฟื้อของข้า อย่างไรก็ตาม [stew_sea_blamed.GetTitledFirstName] อาจจะแบกรับความอัปยศมากกว่าความพึงพอใจหลังจากทำหม้อต้มคว่ำ! การทำความสะอาดคงไม่ถูกนัก"
 feast_main_stew_flood.0042.no_blame_placed:1 "แขกทุกคนของข้ายิ้มอย่างพึงพอใจที่จานของพวกเขาเมื่อข้ามองดูพวกเขา ภูมิใจในการแสดงความเอื้อเฟื้อของข้า อย่างไรก็ตาม ข้าอาจจะต้องทำอะไรบางอย่างกับคนรับใช้บัดซบที่ทำหม้อสตูว์คว่ำ และการทำความสะอาดคงไม่ถูกนัก"
 feast_main_stew_flood.0042.a:1 "เราควรทำ เช่นนี้บ่อยขึ้น!"
 feast_main_stew_flood.0043.blame_placed:1 "งานเลี้ยงใกล้จะเลิกแล้ว และข้าสามารถจากไปเพื่อจัดการกับความอัปยศของข้าได้\nสตูว์เนื้อบ้าๆ นั่นเปื้อนไปทุกที่ และข้าไม่แน่ใจว่าจะกำจัดกลิ่นออกจากผมของข้าได้หรือไม่! คงอีกนานกว่าข้าจะลืมสิ่งที่ [stew_sea_blamed.GetTitledFirstName] ทำกับข้า"
 feast_main_stew_flood.0043.no_blame_placed:1 "งานเลี้ยงใกล้จะเลิกแล้ว และข้าสามารถจากไปเพื่อจัดการกับความอัปยศของข้าได้\nสตูว์เนื้อบ้าๆ นั่นเปื้อนไปทุกที่ และข้าไม่แน่ใจว่าจะกำจัดกลิ่นออกจากผมของข้าได้หรือไม่! คงอีกนานกว่าข้าจะลืมสิ่งที่คนรับใช้คนนั้นทำกับข้า"
 feast_main_stew_flood.0043.a:0 "ข้าจะไม่กินสตูว์อีกเลย"
 feast_main_stew_flood.0044.desc:1 "งานเลี้ยงใกล้จะเลิกแล้ว หลังจากมีกลิ่นสตูว์อบอวลอยู่ราวกับภูตผี ข้าไม่อยากจะเชื่อเลยว่าข้าจะเป็นคนที่โชคร้าย เช่นนี้ และข้าก็แค่... หวังว่ามันจะไม่เกิดขึ้น!"
 feast_main_stew_flood.0044.a:0 "ข้าหวังว่าผู้คนจะเมาเกินกว่าจะจำได้"
 stew_flood_covered_adjective_wrathful:0 "หงุดหงิด"
 stew_flood_covered_adjective_proud:0 "หยิ่งผยอง"
 stew_flood_covered_adjective_beautiful:0 "งดงาม"
 stew_flood_fallback_adjective:0 "ไม่สงสัย"
 feast_stew_flood_log_title:0 "สตูว์ท่วม"
 feast_stew_flood_log:0 "[TARGET_CHARACTER.GetTitledFirstName] เปียกโชกไปด้วยสตูว์ร้อนๆ หลังจากเหตุการณ์หม้อสตูว์หกครั้งใหญ่"
