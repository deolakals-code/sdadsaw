 ach_coronation.0010.b.zealous: "เราได้รับพรอย่างแท้จริง!"
 ach_coronation.0010.a: "เดี๋ยวก่อน! ข้าต้องพูดคุยกับ [hof.GetHerHim]!"
 ach_coronation.0010.a.tt.success: "[hof.GetTitledFirstNameNoTooltip] ได้ยินคำร้องขอของท่าน! สรรเสริญ [ROOT.Char.GetFaith.HighGodName]!"
 ach_coronation.0010.a.tt.failure: "[hof.GetTitledFirstNameNoTooltip] ปฏิเสธที่จะพบ"
