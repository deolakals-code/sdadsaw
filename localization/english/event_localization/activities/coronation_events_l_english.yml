 ach_coronation.0013.t: "[ROOT.Char.GetTitleAsNameNoTooltip] และสามัญชน"
 ach_coronation.0013.intro: "วันของข้าหมดไปกับการปฏิบัติหน้าที่ในความสงบสุขพอสมควรของ [ROOT.Char.GetCurrentLocation.GetBaronyNameExplicitly] ณ ที่นั่น"
 ach_coronation.0013.desc_opening.rainy_day: "ขณะหลบฝน"
 ach_coronation.0013.desc_opening.dry_day: "ขณะพักผ่อนชั่วครู่"
 ach_coronation.0013.desc_opening: "ใกล้กับ [ROOT.Char.Custom('GetMainsquareCommons')] ข้าได้ยินใครบางคนตะโกนว่า #EMP "[host.GetTitleAsNameNoTooltip]!"#!\n\nต้นเสียงมาจากหัวมุม: [ROOT.Char.Custom('GetTaverngoersTribespeople')] บางคนกำลังเพลิดเพลินกับ [ROOT.Char.Custom('RegionalAlcoholicDrink')] และปล่อยข่าวลือ"
 ach_coronation.0013.desc_conversation.mean.1: ""ไม่เคยมี [host.GetTitleAsNameNoTooltip] ที่ [host.Custom('InsultAdjectiveGeneric')] กว่านี้อีกแล้ว!" [peasant.Custom2('dummy_peasant_profession', peasant)] คนหนึ่งถ่มน้ำลายพูด และคนทั้งโต๊ะก็เห็นด้วย"
 ach_coronation.0013.desc_conversation.mean.2: ""สาปแช่งไอ้ที่เรียกตัวเองว่า '[host.GetTitleAsNameNoTooltip]' [host.GetSheHe] จะนำความตายมาสู่ [host.GetPrimaryTitle.GetTierAsName] ในไม่ช้านี้!" [peasant.Custom2('dummy_peasant_profession', peasant)] คนหนึ่งประกาศกับสหายของ [peasant.GetHerHis]"
 ach_coronation.0013.desc_conversation.mean.3: "[dummy_gender.Custom('GetRandomRelation')] ของข้าเป็น [dummy_gender.Custom('lowly_servant_type')] ใน [ROOT.Char.GetCurrentLocation.Custom('GetCoronationSiteShort')] และ [dummy_gender.GetSheHe] บอกว่าลมหายใจของ [host.GetHerHis] เหม็นเน่าตลอดเวลา!""
 ach_coronation.0013.desc_conversation.mean.4: ""เจ้าได้ยินไหมว่า [host.GetSheHe] ไปนอนกับ [dummy_gender.Custom('lowly_servant_type')]?" [peasant.Custom2('dummy_peasant_profession', peasant)] คนหนึ่งหัวเราะ "[host.GetSheHe|U] ทำสิ่งนี้กับ [host.Custom('DeviantObjectArticle')] ที่ ซึ่ง [host.GetSheHe]-""
 ach_coronation.0013.desc_conversation.mean.4.chaste: "พระเจ้าช่วย! ข้ารีบเอามือปิดหูก่อนที่จะได้ยินอะไรไปมากกว่านี้"
 ach_coronation.0013.desc_conversation.mean.4.lustful.host: "พระเจ้าช่วย! พวกเขาคงคิดว่าข้าช่างเรียบร้อยเสียนี่กระไร!"
 ach_coronation.0013.desc_conversation.mean.4.lustful.guest: "พระเจ้าช่วย! พวกเขาคิดว่า [host.GetSheHe] ช่างเรียบร้อยเสียนี่กระไร!"
 ach_coronation.0013.desc_conversation.mean.4.not_lustful: "พระเจ้าช่วย! ทำไมถึงมีคนโกหกเรื่องแบบนั้นด้วย?"
 ach_coronation.0013.desc_conversation.mean.5: ""ข้าได้ยินมาว่า [host.GetSheHe] เป็นไอ้ชาติชั่ว [host.Custom('InsultAdjectiveGeneric')] สิ่งที่ [host.GetSheHe] ทำน่ะรึ? ปีศาจตัวจริงชัดๆ""
 ach_coronation.0013.desc_conversation.nice.1: ""[host.GetTitleAsNameNoTooltip] จงเจริญ!" [peasant.Custom2('dummy_peasant_profession', peasant)] คนหนึ่งพูดเสียงอ้อแอ้ ท่ามกลางเสียงเชียร์อย่างเมามาย"
 ach_coronation.0013.desc_conversation.nice.2: ""ข้าได้ยินมาว่า [host.GetTitleAsNameNoTooltip] เป็น [host.GetTitleAsNameNoTooltip] ที่ [host.Custom('GetPrettyAdjective')] และ [host.Custom('GetPiousAdj')] ที่สุดในโลก!" คนหนึ่งบอกอีกคน"
 ach_coronation.0013.desc_conversation.nice.3: "[dummy_gender.Custom('GetRandomRelation')] ของข้ามี [ROOT.Char.Custom('GetRandomRelation')] และ [ROOT.Char.GetSheHe] บอกว่า [host.GetTitledFirstNameNoTooltip] สามารถเต้นรำท่า [host.Custom('GetMedievalDance')] ได้เก่งกาจจนเจ้าร้องไห้เลยล่ะ!" [peasant.Custom2('dummy_peasant_profession', peasant)] คนหนึ่งประกาศ"
 ach_coronation.0013.desc_conversation.nice.4: ""ข้าเคยเห็น [host.GetTitleAsNameNoTooltip] ครั้งหนึ่ง" [peasant.Custom2('dummy_peasant_profession', peasant)] คนหนึ่งกล่าว "ข้ามองเห็นความดีงามในตัว [host.GetHerHim] ทันทีที่ข้าสบตากับ '[host.Custom('GetErIm')]'!""
 ach_coronation.0013.desc_conversation.nice.5: ""ความตายจงสู่ไอ้ผู้แอบอ้าง [claimant.Custom('InsultAdjectiveGeneric')] [claimant.GetTitledFirstName]!" [peasant.Custom2('dummy_peasant_profession', peasant)] คนหนึ่งประกาศท่ามกลางเสียงเชียร์ " [host.GetTitleAsNameNoTooltip] ผู้ชอบธรรมจงเจริญ!""
 ach_coronation.0013.ending.agrees: "\n\nฮ่า! ข้าว่าคนดีๆ เหล่านี้พูดถูก!"
 ach_coronation.0013.ending.disagrees: "\n\nเหล่า #EMP ไพร่# หัวทึบพวกนี้กล้าดียังไงมาดูหมิ่นเจ้านายของพวกมัน เช่นนี้!"
 ach_coronation.0013.ending.neutral: "\n\nแม้ แต่สามัญชนก็ดูเหมือนจะมีเวลาสนใจเรื่องการเมืองในทุกวันนี้"
 ach_coronation.0013.a.weaken_detractors: "เหล่าไพร่! ข้ามีข้อเสนอ"
 ach_coronation.0013.a.weaken_detractors.flavor: "ข้านึกถึงข่าวลือที่ดีกว่านี้มากให้พวกมันไปปล่อยได้!"
 ach_coronation.0013.a.weaken_detractors.tt: "ศัตรูของท่านถูกเยาะเย้ยโดยฝูงชน"
 ach_coronation.0013.b: "อืมม คงเอาชนะใจทุกคนไม่ได้ #EMP ทหาร!#!"
 ach_coronation.0013.c: "ข้าจะ ทำให้พวกมันหวาดกลัวต่อราชบัลลังก์!"
 ach_coronation.0013.c.tt.success: "เหล่าไพร่—ด้วยแววตาหวาดกลัว—ร้องขอความเมตตา"
 ach_coronation.0013.c.tt.failure: "ข่าวลือยังคงแพร่กระจายต่อไปอยู่ดี..."
 ach_coronation.0013.flavor: "การดุด่าว่ากล่าวอย่างรุนแรงควรจะเตือนสติพวกโง่เหล่านี้ให้หุบปากเสียบ้าง"
 ach_coronation.0013.d: "เจ้าตรงนั้น! รินเครื่องดื่มให้ข้า!"
 ach_coronation.0013.d.flavor: "ข้ากำลังจะเป็น [host.GetTitleAsNameNoTooltip] และข้าต้องการเครื่องดื่ม ให้ตายสิ!"
 ach_coronation.0013.e: "อา เอาเถอะ กลับไปทำธุระต่อดีกว่า"
 ach_coronation.0013.e.disagrees: "ตัวข้าอยู่สูงส่งกว่าคนโง่เหล่านี้มากนัก"
 ach_coronation.0013.e.flavor.mean: "เหตุใดข้าต้องสนใจคำพูดพล่ามของเหล่าสามัญชนด้วย?"
 ach_coronation.0013.e.flavor.nice: "แล้วใครว่าสามัญชนไร้การศึกษา!?"
 two_detractors_get_negative_rumors_tt: "[coronation_detractors|E] สองคนจะได้รับ [modifier|E] #N [GetModifier('ach_negative_rumors_modifier').GetNameWithTooltip]#! "
 because_you_have_overseer_tt: "#P ประสบการณ์ของท่านในฐานะ [GetTrait('overseer').GetName( GetNullCharacter )] จะช่วยให้ท่านหลีกเลี่ยงผลกระทบด้านลบต่อ [coronation_magnificence|E] ของท่านได้#!"
 violated_city_rights_opinion: "ละเมิดสิทธิ์ของเมือง"

 ach_coronation.0014.t: "บนปากเหวแห่งความโกลาหล"
 ach_coronation.0014.desc: "จากด้านหลังของฝูงชน ข้ามองดูคณะผู้แทนของ [first.GetTitleAsName] แห่ง [first.GetPrimaryTitle.GetNameNoTier] มาถึงเพื่อพิธีราชาภิเษกของ [host.GetTitledFirstNamePossessive]"
 ach_coronation.0014.desc.weather.rain: "วันนี้ฝนตกหนัก และ"
 ach_coronation.0014.desc.weather.clear: "แม้ว่าวันนี้จะเป็นวันที่อากาศดีพอสมควร"
 ach_coronation.0014.desc.weather.indoors: "[ROOT.Char.GetCurrentLocation.Custom('GetCoronationSitePrefix')][ROOT.Char.GetCurrentLocation.Custom('GetCoronationSite')] นั้นเนืองแน่นไปด้วยผู้คน "
 ach_coronation.0014.desc.reason.rain: "เหล่าสามัญชนถูกทิ้งให้มอมแมมและโกรธเกรี้ยวกว่าปกติ ชาวบ้านคนหนึ่งลื่นโคลนล้มลงบนถนน และในอีกไม่กี่อึดใจต่อมา เหล่าทหารที่กระตือรือร้นเกินเหตุของ [first.GetTitleAsNamePossessiveNoTooltip] ก็พุ่งเข้าใส่ฝูงชน ทุบตีและผลักไสสามัญชนให้ออกห่างจากนายของพวกมัน"
 ach_coronation.0014.desc.reason.local_discontent: "ความตึงเครียดใน [coronation_site.GetHolding.GetHoldingType.GetName] อยู่ในระดับสูง และสามัญชนหลายคนที่รวมตัวกันต่างโห่ร้องและตะโกนใส่ [first.GetTitleAsNameNoTooltip] ที่เดินผ่านไป—บางคนถึงกับเริ่มตะโกนสาปแช่ง [host.GetPrimaryTitle.GetTitleAsNameNoTooltip]!"
 ach_coronation.0014.desc.reason.low_control: "[ROOT.Char.GetCurrentLocation.GetBaronyNameExplicitly] ได้ต่อต้านการควบคุมของ [ROOT.Char.GetCurrentLocation.GetHolder.GetPrimaryTitle.GetAdjective] มาระยะหนึ่งแล้ว และฝูงชนที่กำลังเฝ้าดูคณะผู้แทนก็ดูไม่เป็นมิตรนัก"
 ach_coronation.0014.desc.reason.generic_indoors: "และข้าราชสำนักกับแขกจำนวนมากก็เริ่มหาที่ว่าง เพื่อให้ผู้มาใหม่เข้ามาได้ยากลำบาก ฝูงชนเริ่มปั่นป่วนและห้องโถงก็ร้อนอบอ้าวเกินไป และ [peasant.GetWomenMen] หลายคนก็เริ่มตะโกนและใช้ศอก"
 ach_coronation.0014.desc.reason.generic_outdoors: "ฝูงชนดูปั่นป่วน มีคนออกมาดูคณะผู้แทนมากเกินไป ทุกคนเบียดเสียดกันแน่นเกินไป และทหารยามของ [first.GetTitleAsNamePossessiveNoTooltip] ก็ดูตึงเครียด"
 ach_coronation.0014.desc.ending: "\n\nข้าตระหนักได้ว่า—ฝูงชนสามารถทำลายพิธีราชาภิเษกนี้ได้—ทั้งหมดที่พวกเขาต้องการคือ"
 ach_coronation.0014.desc.ending.byzantine: "\n\nข้าตระหนักได้ว่า—[Glossary( 'ฮอย โพลลอย', 'HOI_POLLOI_GLOSS')] ที่รวมตัวกันอาจถูกผลักดันให้ทำลายพิธีราชาภิเษกได้—ทั้งหมดที่พวกเขาต้องการคือ"
 ach_coronation.0014.desc.ending.outdoors: "ก้อนหิน..."
 ach_coronation.0014.desc.ending.indoors: "คำพูด..."
 ach_coronation.0014.a.outdoors: "#EMP เล็งไปที่ [first.GetTitleAsNameNoTooltip]#!"
 ach_coronation.0014.a.indoors: "#BER "ไฟไหม้!"#!"
 ach_coronation.0014.a.tt.success: "ท่านจุดชนวนให้เกิดการเหยียบกัน"
 ach_coronation.0014.a.tt.failure: "ท่านพลาด"
 ach_coronation.0014.a.tt.host.success: "นี่อาจช่วยเสริมชื่อเสียงของ [host.GetTitledFirstNamePossessive] โดยไม่ได้ตั้งใจ—ความล้มเหลวของท่านอาจ ทำให้ท่านเกิด [stress|E]"
 ach_coronation.0014.a.tt.host.failure.magnificence: "[coronation_magnificence|E] ของพิธีราชาภิเษกของ [host.GetTitledFirstNamePossessive] อาจลดลงอย่างมาก"
 ach_coronation.0014.a.tt.host.failure.host: "[host.GetTitledFirstName] อาจสูญเสีย [legitimacy|E] หรือ [prestige|E]"
 ach_coronation.0014.a.tt.host.failure.crackdown: "[host.GetTitledFirstName] อาจตอบโต้รุนแรงเกินไป ซึ่งอาจคร่าชีวิตผู้คนอีกมาก และเพิ่ม [dread|E] และ [tyranny|E] ของ [host.GetHerHis]"
 ach_coronation.0014.a.tt.failure.indoors: "ไม่มีใครได้ยินท่านท่ามกลางเสียงอึกทึก"
 ach_coronation.0014.a.rock: "[first.GetShortUIName] ถูกก้อนหินขว้างใส่หน้าและได้รับ [trait|E] [GetTrait('wounded_1').GetName( GetNullCharacter )|LV]"
 ach_coronation.0014.b: "บางทีฝูงชนอาจมีประโยชน์อย่างอื่น..."
 ach_coronation.0014.b.flavor: "สายลับของข้าเคลื่อนไหวโดยไม่มีใครตรวจจับได้ทั่วทั้ง [coronation_site.GetHolding.GetHoldingType.GetName]"
 ach_coronation.0014.b.tt: "ท่านเป็น [GetTrait('schemer').GetName( GetNullCharacter )] [GetTrait('deceitful').GetName( GetNullCharacter )] หรือมี [intrigue|E] อย่างน้อย [SCOPE.ScriptValue('very_high_skill_rating')|0V]"
 ach_coronation.0014.c: "ข้าจะเป็นคนแรกที่แสดงความเคารพ"
 if_host_calms_crowd_desc: "หาก [TARGET_CHARACTER.GetShortUIName] คืนความสงบเรียบร้อย:"
 if_crush_happens_desc: "#X มิฉะนั้น:#!"

 ach_coronation.0015.t: "เหตุอลหม่านครั้งใหญ่แห่งปี [GetCurrentDate.GetYear]"
 ach_coronation.0015.desc: "วิบัติ! ฝูงชนที่กำลังเฝ้าดูขบวนติดตามของ [first.GetTitledFirstName] ผู้ ซึ่งเพิ่งมาถึง ได้—โดยมิทราบสาเหตุ—ตกอยู่ในความโกลาหล ข้ามาถึงทันเวลาพอดีที่จะได้เห็นมวลชนท้องถิ่นกำลังเบียดเสียดไปมา เหล่าทหารยามของ [first.GetTitleAsNamePossessiveNoTooltip] บ้างก็กำลังทุบตีชาวบ้านที่ล้มลง หรือไม่ก็ถูกดึงลงไปและถูกเหยียบย่ำไปพร้อมกัน\n\nเหล่าทหารยามแทบจะต้านทานฝูงชนไว้ไม่อยู่ และความรุนแรงก็ยิ่งเพิ่มความตื่นตระหนกแก่พวกเขา อีกไม่ช้าจะเกิดเหตุเหยียบกัน!"
 ach_coronation.0015.has_happened: "เหตุนี้เกิดขึ้น เพราะการกระทำของ [coronation_detractor|E] ผู้ตีสองหน้า!"
 ach_coronation.0015.a: "ข้าต้อง ทำให้ฝูงชนสงบลง!"
 ach_coronation.0015.a.august: "เหล่าราษฎร! [ROOT.Char.GetTitleAsNameNoTooltip] ของพวกเจ้า สั่งให้สงบ!"
 ach_coronation.0015.a.august.tt: "อำนาจบารมีอันมิอาจปฏิเสธได้ของท่าน ทำให้ฝูงชนสงบลง"
 ach_coronation.0015.a.tt.success: "สำเร็จ!"
 ach_coronation.0015.a.tt.success.desc: "ท่านสามารถป้องกันการนองเลือดเพิ่มเติมได้ - นับเป็นนิมิตหมายอันดีสำหรับการปกครองของท่าน!"
 ach_coronation.0015.a.tt.critical_success: "สุนทรพจน์อันเป็นตำนาน"
 ach_coronation.0015.a.tt.critical_success.desc: "ฝูงชนเงียบกริบด้วยความตกตะลึง หลายคนถึงกับหลั่งน้ำตาให้กับความงดงามในถ้อยคำของท่าน"
 ach_coronation.0015.a.tt.failure.title: "ล้มเหลว"
 ach_coronation.0015.a.tt.failure: "เสียงกรีดร้องกลบเสียงของท่านจนมิด"
 ach_coronation.0015.a.tt.initiator.critical_failure: "วิบัติ!"
 ach_coronation.0015.a.tt.initiator.critical_failure.desc: "[host.GetShortUIName] ยุติความโกลาหลได้ — ที่เลวร้ายกว่านั้น [host.GetSheHe] กลับได้รับการสรรเสริญจากเรื่องนี้!"
 ach_coronation.0015.a.tt.initiator.failure: "ล้มเหลว!"
 ach_coronation.0015.a.tt.initiator.failure.desc: "[host.GetShortUIName] ป้องกันหายนะไว้ได้ — บัดซบ!"
 ach_coronation.0015.a.tt.initiator.failure.crackdown.desc: "เหล่าทหารของ [host.GetShortUINamePossessive] ยุติความโกลาหลได้สำเร็จ — [host.GetSheHe] เป็นที่น่าเกรงขามยิ่งกว่าที่เคย"
 ach_coronation.0015.a.tt.initiator.failure.physician.desc: "[host.GetShortUIName] ใช้ทักษะการเป็นแพทย์ของ [host.GetHerHis] ช่วยเหลือผู้บาดเจ็บ และได้รับการยกย่องว่าเป็น 'วีรบุรุษ'!"
 ach_coronation.0015.a.tt.initiator.success: "สำเร็จ!"
 ach_coronation.0015.a.tt.initiator.success.desc: "[host.GetShortUIName] ได้รับความอับอาย และพิธีราชาภิเษกของ [host.GetHerHis] ก็พังพินาศ!"
 ach_coronation.0015.a.tt.initiator.critical_success: "การสังหารหมู่!"
 ach_coronation.0015.a.tt.initiator.critical_success.desc: "เหล่าทหารของ [host.GetShortUINamePossessive] ตอบโต้รุนแรงเกินเหตุและสังหารผู้คนไปมากมาย — นับเป็นเรื่องอื้อฉาวโดยแท้!"
 ach_coronation.0015.b: "ไปช่วยผู้บาดเจ็บ! เร็วเข้า!"
 ach_coronation.0015.b.flavor: "บัดนี้เราต้องมุ่งเน้นเพียงการช่วยชีวิตเท่านั้น!"
 ach_coronation.0015.c: "พวกโง่ที่ตื่นตูมเกินเหตุ!"
 ach_coronation.0015.d: "ทหาร! จงคืนระเบียบ!"
 ach_coronation.0015.d.byzantines: "ปล่อยพวกวารันเจียน!"
 ach_coronation.0015.e: "โอ ไม่นะ ไพร่บางคนอาจตาย... ช่างเถอะ..."
 ach_coronation.0015.e.tt: "ท่านจะต้องฝ่าออกไป!"
 ach_coronation.0015.e.success: "ท่านฝ่าออกจากฝูงชนได้!"
 ach_coronation.0015.e.failure: "สามัญชนกล้าดียังไงมาเหยียบหัวท่าน!"
