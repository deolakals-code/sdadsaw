 ach_coronation.0011.t: "เงาทมึนหน้าบัลลังก์"
 ach_coronation.0011.desc: "ในเงามืดของ [ROOT.Char.GetCurrentLocation.Custom('GetCoronationSitePrefix')][ROOT.Char.GetCurrentLocation.Custom('GetCoronationSite')] เหล่าอสรพิษกำลังเลื้อยคลาน ท่ามกลางเหล่าข้ารับใช้และข้าราชสำนักที่กำลังเตรียม [ROOT.Char.GetCurrentLocation.Custom('GetCoronationSiteShort')] [plotter.GetTitledFirstName] กำลังกระซิบกระซาบกับกลุ่มแขกที่เพิ่งมาถึง\n\nพวกเขารีบเงียบลงทันทีเมื่อข้าเข้าไปใกล้ ก่อนที่ [plotter.GetFirstNameNoTooltip] จะโค้งคำนับอย่างนอบน้อม\n\n"[plotter.Custom2('RelationToMeShort', SCOPE.sC('host') )]," [plotter.GetSheHe] เริ่มพูด "ข้าขออภัย พวกเราเพียงแค่กำลังพูดถึง... เรื่องส่วนตัวเท่านั้น""
 ach_coronation.0011.a: "ข้าจะต้องเค้นความจริงจาก [plotter.GetHerHim] ให้ได้..."
 ach_coronation.0011.a.success: "[plotter.GetTitledFirstName] ถูกจับได้ว่าโกหก"
 ach_coronation.0011.a.success.tt: "แผนอุบายถูกเปิดโปง! อย่างน้อยก็ถ้ามีแผนการอยู่ล่ะนะ"
 ach_coronation.0011.a.failure: "[plotter.GetTitledFirstName] นั้นเจ้าเล่ห์เกินไป"
 ach_coronation.0011.b: "[coward.GetTitledFirstNameNoTooltip] พูดมันออกมา #BER เดี๋ยวนี้.#!"
 ach_coronation.0011.b.flavor: "[coward.GetSheHe|U] แทบจะร้องไห้อยู่แล้ว—แค่สะกิดนิดเดียวก็คง ทำให้ [coward.GetHerHim] สติแตกอย่างมิต้องสงสัย"
 ach_coronation.0011.b.tt: "[coward.GetTitledFirstName] จะเปิดเผย [scheme|E] และถ้ามันไม่มีอยู่จริง ก็จะเปิดเผย [secret|E]"
 ach_coronation.0011.c: "เจ้าเห็นข้าเป็นคนโง่หรือไร!? #EMP ทหาร!#!"
 ach_coronation.0011.c.paranoid: "ข้า #EMP รู้อยู่แล้ว#!! จับกุมพวกกบฏเหล่านี้!"
 ach_coronation.0011.c.wrathful: "บังอาจนัก!? เจ้าคิดว่าข้าโง่รึ! ทหาร!"
 ach_coronation.0011.d: "ข้าคงต้องจับตาดู [plotter.GetHerHim] ไว้..."
 ach_coronation.0011.scheme.plotter.toast: "[scheme|E] [hostile_scheme.GetSchemeType.GetTypeNameNoTooltip] ของ [plotter.GetTitledFirstNamePossessive] ที่มุ่งเป้าไปที่ [hostile_scheme.GetTargetCharacter.GetFirstName] ถูกเปิดโปง!"
 ach_coronation.0011.scheme.coward.toast: "[scheme|E] [coward_scheme.GetSchemeType.GetTypeNameNoTooltip] ของ [coward.GetTitledFirstNamePossessive] ที่มุ่งเป้าไปที่ [coward_scheme.GetTargetCharacter.GetFirstName] ถูกเปิดโปง!"
 ach_coronation.0011.secret.coward.toast: "ท่านได้ล่วงรู้ [secret|E] [revealed_secret.GetName] ของ [coward.GetTitledFirstNamePossessive]"
 ach_coronation.0011.coward.success: "[coward.GetSheHe|U] สารภาพภายในไม่กี่วินาที"
 ach_coronation.0011.hook.toast: "[coward.GetTitledFirstNamePossessive] เริ่มร้องไห้และพูดจาไม่เป็นศัพท์ พลางรับรองว่า [coward.GetSheHe] จะทำทุกอย่างเพื่อแสดงความภักดีของ [coward.GetHerHis]"
 ach_coronation.0011.false.toast: "[plotter.GetSheHe|U] กำลังวางแผนมอบของขวัญที่น่าพอใจ"

 ach_coronation.0012.t: "ปัญหาเรื่องพิธีรีตองและสิทธิ์"
 ach_coronation.0012.desc: "ขณะเตรียมการสำหรับพิธีราชาภิเษก ข้ารับใช้ท่าทางกังวลได้ประกาศนาม [first.GetTitledFirstName] และ [second.GetTitledFirstName] เพียงครู่เดียวก่อนที่พวกเขาจะพรวดพราดเข้ามาในห้อง ด้วยความผิดพลาดบางประการ ทั้งคู่ต่างถูกสัญญาว่าจะได้รับบทบาทอันทรงเกียรติในการถือ [ROOT.Char.Custom('GetRandomCoronationObject')] ในระหว่างพิธี\n\nทั้งสองเป็นที่รู้จักกันดีในเรื่องความบาดหมางที่มีมานาน และการที่ฝ่ายหนึ่งต้องยอมสละบทบาทให้อีกฝ่ายถือเป็นเครื่องหมายแห่งความอัปยศอดสูต่อตระกูลของตน—ไม่ว่าบทบาทนั้นจะดูเล็กน้อยเพียงใดก็ตาม"
 ach_coronation.0012.a: "[first.GetTitledFirstNameNoTooltip] จะได้รับเกียรตินี้"
 ach_coronation.0012.b: "มอบให้ [second.GetTitledFirstNameNoTooltip]"
 ach_coronation.0012.c: "เราสามารถจัดการเรื่องนี้ได้!"
 ach_coronation.0012.c.flavor: "บางทีพวกเขาอาจจะถือมันเดินไปตามทางเดินด้วยกันได้กระมัง?"
 ach_coronation.0012.c.tt.success: "ท่านมีแผนการที่ยอดเยี่ยม"
 ach_coronation.0012.c.tt.failure: "พวกเขาเริ่มโต้เถียงกันอีกแล้ว"
 ach_coronation.0012.d: "ฮ่า! ดูว่าเขาทำกันอย่างไร"
 ach_coronation.0012.d.flavor: "ราวกับว่าพวกมือสมัครเล่นเหล่านี้ไม่เคยเข้าร่วมพิธีในราชสำนักมาก่อน!"
 ach_coronation.0012.e: "[ROOT.Char.Custom('GetRandomCoronationObject')|U] น่ะหรือ? ให้หนึ่งใน #EMP พวกเจ้า#! ถือเนี่ยนะ?"
