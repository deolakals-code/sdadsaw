 ach_coronation.0016.t: "ของขวัญอันคู่ควรแก่ [host.GetTitleAsNameNoTooltip]"
 ach_coronation.0016.desc: "เหล่าแขกเหรื่อในพิธีราชาภิเษกของ [host.GetTitledFirstNameRegnal] ผู้เป็น [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('host') )] ของข้า กำลังหลั่งไหลเข้ามา ทุกคนต่างกล่าวคำสัตย์เล็กน้อย ขอบคุณสำหรับคำเชิญ และคำมั่นสัญญาแห่งความจงรักภักดีหรือการสนับสนุน อีกไม่ช้า ก็จะถึงตาข้า\n\nข้าจำเป็นต้องโดดเด่นกว่าผู้อื่นหรือไม่? ข้าจำเป็นต้องใช้การเข้าเฝ้าช่วงสั้นๆ นี้ เพื่อโน้มน้าว [host.GetTitleAsNameNoTooltip] ให้เห็นถึงคุณค่าของข้าหรือไม่?"
 ach_coronation.0016.a.martial: "ข้าจะมอบกองกำลังทหารให้!"
 ach_coronation.0016.a.stewardship: "ข้าจะจัดการเรียกเก็บสิบลดจากแขกคนอื่นๆ!"
 ach_coronation.0016.a.stewardship.greedy.tt: "แน่นอนว่าท่านจะไม่ร่วมจ่ายด้วย"
 ach_coronation.0016.a.diplomacy: "[detractor.GetTitledFirstNameNoTooltip] สามารถถูกโน้มน้าวมาเข้ากับ [host.GetTitledFirstNameNoTooltip] ได้..."
 ach_coronation.0016.a.intrigue: "สายลับของข้าจะพร้อมให้ [host.GetHerHis] ใช้งาน"
 ach_coronation.0016.a.learning: "ข้าจะพูดคุยกับเหล่านักบวชในนามของ [host.GetHerHis]"
 ach_coronation.0016.a.loyal: "ข้าจะปฏิญาณตนว่าจะสนับสนุนชั่วนิรันดร์"
 ach_coronation.0016.b.impress_attendees: "ข้าจะใช้ชื่อเสียงอันดีของข้า!"
 ach_coronation.0016.b.impress_attendees.writer: "มรดกของ [host.GetHerHis|U] จะถูกจารึกไว้ใน #EMP บทกวี#! ให้เป็นอมตะ!"
