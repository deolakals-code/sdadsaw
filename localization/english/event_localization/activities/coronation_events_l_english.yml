 ach_coronation.0016.b.bonds: "ข้าจะขับขานสรรเสริญ [host.GetHerHis] ให้ทุกคนได้ฟัง!"
 ach_coronation.0016.c.artifact: "[gifted_artifact.GetNameNoTooltip] น่าจะเป็นของขวัญชั้นดี"
 ach_coronation.0016.c.gold: "ใครเล่าจะปฏิเสธทองและของกำนัลได้?"
 ach_coronation.0016.d: "เพียงแค่การทักทายตามมารยาทก็น่าจะเพียงพอ"
 ach_coronation.0016.d.hate: "ข้าจะแสดงท่าทีเมินเฉยต่อไอ้ [host.Custom('InsultNoun')] นั่น!"
 ach_coronation.0016.reward.tt: "#low #EMP รางวัลขึ้นอยู่กับเจตนา [THIS.Char.GetInvolvedActivityIntent.GetName] ของท่าน#!#!"
 ach_coronation.0016.praise: "[host.GetTitledFirstNameNoTooltip] สรรเสริญท่านต่อหน้าสาธารณชน"
 ach_coronation.0016.gold: "[host.GetTitledFirstNameNoTooltip] มอบค่าตอบแทนสำหรับการทำงานของท่าน"
 ach_coronation.0016.friendship: "[host.GetTitledFirstNameNoTooltip] ขอบคุณท่านเป็นการส่วนตัว"

 ach_coronation.0017.t: "สิทธิอันศักดิ์สิทธิ์ที่มิได้มาด้วยตนเอง"
 ach_coronation.0017.desc: "ระหว่างการสวดมนต์ยามเช้าใน [ROOT.Char.GetCurrentLocation.Custom('GetCoronationSitePrefix')][ROOT.Char.GetCurrentLocation.Custom('GetCoronationSite')], [guest.Custom2('MyCharacterIntroduction', ROOT.Char)] สะกิดข้าและชี้ไปยังจุดที่ [host.Custom2('MyCharacterIntroduction', ROOT.Char)] คุกเข่าอยู่สำหรับพิธี\n\n"มันไม่กวนใจท่านบ้างหรือ ที่ [host.GetSheHe] ไม่เคยต่อสู้เพื่อศรัทธาเลย "
 ach_coronation.0017.ending.crusader: "เหมือนที่ท่านกับข้าเคยทำ แต่กลับอ้างตนว่าเที่ยงธรรมนัก?""
 ach_coronation.0017.ending.civilian: "เหมือนที่ท่านเคยทำ แต่กลับอ้างตนว่าเที่ยงธรรมนัก?""
 ach_coronation.0017.a: "ในฐานะ [GetTrait('faith_warrior').GetName( GetNullCharacter )] [host.GetTitledFirstNameNoTooltip] ได้รับการรับรองจากข้า!"
 ach_coronation.0017.a.christian: "ในฐานะนักรบครูเสด เช่นกัน [host.GetTitledFirstNameNoTooltip] ได้รับการรับรองจากข้า!"
 ach_coronation.0017.b: "ข้าจะประจานคนขลาดนั่นต่อหน้าสาธารณชน!"
 ach_coronation.0017.c: "ชิ! ตั้งใจสวดมนต์ของท่านไปเถอะ"
 ach_coronation.0017.d: "ศรัทธาไม่ใช่การแข่งขัน!"
 ach_coronation.0017.d.cynical: "อะไรนะ? ใครจะไปสนใจเรื่องพรรค์นั้นกัน?"
 crusader_endorsement_opinion: "การรับรองของนักรบศักดิ์สิทธิ์"
 crusader_sellout_opinion: "การรับใช้ศาสนาที่ถูกลดทอนคุณค่า"

 ach_coronation.0018.t: "หน้าที่แห่งราชวงศ์"
 ach_coronation.0018.desc: "การเตรียมการสำหรับพิธีราชาภิเษกของ [host.GetTitledFirstNamePossessive] อยู่ในความโกลาหล!"
 ach_coronation.0018.desc.seneschal: "ในฐานะ [GetCourtPositionType('seneschal_court_position').GetName] มัน #EMP ควร#! เป็นหน้าที่ของ [servant_boss.Custom2('MyCharacterIntroduction', ROOT.Char)] ในการสั่งการเหล่าคนรับใช้"
 ach_coronation.0018.desc.steward: "เมื่อไม่มี [GetCourtPositionType('seneschal_court_position').GetName] มัน #EMP ควร#! เป็นหน้าที่ของ [servant_boss.Custom2('MyCharacterIntroductionNoComma', ROOT.Char)] ในฐานะ [servant_boss.GetCouncilTitle|l] ในการสั่งการเหล่าคนรับใช้"
 ach_coronation.0018.desc.fallback: "ดูเหมือนไม่มีใครพร้อมที่จะสั่งการเหล่าคนรับใช้เลย"
 ach_coronation.0018.desc.ending.servant_boss: "อย่างไรก็ตาม ดูเหมือน [servant_boss.GetTitledFirstNameNoTooltip] จะรับมือไม่ไหวโดยสิ้นเชิง ในขณะเดียวกัน เหล่าคนรับใช้ก็พอใจที่จะนินทาและอู้งานโดยปราศจากการกำกับดูแลที่เหมาะสม\n\n[host.GetTitledFirstNameNoTooltip] ควรจะมุ่งเน้นไปที่พิธีที่กำลังจะมาถึง แต่ [host.GetSheHe] ดูเหมือนจะถูกรุมเร้าด้วยข้อกังวลหยุมหยิมตลอดเวลา"
 ach_coronation.0018.desc.ending.no_servant_boss: "การขาดภาวะผู้นำนั้นชัดเจน และคนที่ไม่ตื่นตระหนกก็ดูพอใจที่จะนินทาและอู้งาน\n\nในขณะที่ [host.GetTitledFirstNamePossessiveNoTooltip] ควรมุ่งเน้นไปที่พิธีที่กำลังจะมาถึง [host.GetSheHe] ดูเหมือนจะถูกรุมเร้าด้วยข้อกังวลหยุมหยิมตลอดเวลา"
 ach_coronation.0018.a.intent: "นี่คือโอกาสของข้า!"
 ach_coronation.0018.a: "ข้าจะช่วย [servant_boss.GetTitledFirstNameNoTooltip] เตรียมการ"
 ach_coronation.0018.a.tt_success: "[host.GetTitledFirstName] สังเกตเห็นความช่วยเหลือของท่าน"
 ach_coronation.0018.a.tt_failure: "ความพยายามของท่านไม่มีใครสังเกตเห็น"
 ach_coronation.0018.b: "ไยต้องนำ ในเมื่อเข้าร่วมได้?"
 ach_coronation.0018.b.tt.gossip_with_servants: "ท่านสนุกสนานกับการนินทาอย่างยิ่ง"
 ach_coronation.0018.b.tt.secret_unknown_desc: "โอ้โห #EMP นั่นมัน#! เรื่องเด็ดเลย"
 ach_coronation.0018.b.tt.secret_unknown: "ท่านค้นพบ [secret|E]"
 ach_coronation.0018.b.tt.secret: "ท่านค้นพบ [secret|E] [SECRET.GetName] ของ [secret_holder.GetFirstNamePossessive]"
 ach_coronation.0018.c: "นี่ดูเหมือนเป็นโอกาสอันดีในการเรียนรู้!"
 ach_coronation.0018.c.flavor: "มีอะไรให้เรียนรู้มากมายจากความล้มเหลวของเหล่าเจ้าหน้าที่"
 ach_coronation.0018.d: "โชคดีที่นั่นเป็นปัญหาของ [host.GetHerHis] ไม่ใช่ของข้า"
 ach_coronation.0018.diplomacy_trait.tt: "เพราะท่านมี [traits|E] [GetTrait('diplomat').GetName( GetNullCharacter )] หรือ [GetTrait('gregarious').GetName( GetNullCharacter )] [servant_boss.GetTitledFirstNameNoTooltip] จะไม่ถือโทษโกรธเคือง"
 ach_coronation.0018.servant_boss_opinion.tt: "[servant_boss.GetTitledFirstNameNoTooltip] อาจถือว่านี่เป็นความพยายามที่จะขโมยงานของ [servant_boss.GetHerHis]"
 ach_coronation.0018.d.pleased_servant_boss: "[servant_boss.GetFirstNameNoTooltip] รู้สึกขอบคุณในความช่วยเหลือของท่าน"
 ach_coronation.0018.d.annoyed_servant_boss: "[servant_boss.GetFirstNameNoTooltip] รู้สึกว่าท่านกำลังพยายามขโมยงานของ [servant_boss.GetHerHis]"
 ach_coronation.0018.a.seneschal: "[host.GetTitledFirstNameNoTooltip] แต่งตั้งท่านเป็น [GetCourtPositionType('seneschal_court_position').GetName]"
 ach_coronation.0018.a.vassal: "[host.GetTitledFirstNameNoTooltip] เสนอ [title|E] ให้ท่าน!"
 ach_coronation.0018.a.tt.vassal: "ท่านจะได้รับข้อเสนอตำแหน่งยศตามที่ [host.GetTitledFirstNamePossessive] เลือก"
 ach_can_refuse_reward: "ท่านจะได้รับอนุญาตให้ปฏิเสธรางวัลต่อไปนี้ เพื่อแลกกับ [gold_i][host.MakeScope.ScriptValue('minor_gold_value')|0V] [gold|E] หรือความสัมพันธ์ที่ดีขึ้นกับ [host.GetShortUIName]:"

 ach_coronation.0019.opening: "[host.Custom2('AppropriateGreetingPositive', ROOT.Char)]"
 ach_coronation.0019.desc: "ความช่วยเหลือของท่านที่นี่ ใน [host.GetCurrentLocation.Custom('GetCoronationSitePrefix')][host.GetCurrentLocation.Custom('GetCoronationSite')] มิได้ถูกมองข้าม"
 ach_coronation.0019.desc.title: "ข้าต้องการข้าหลวงที่ข้าสามารถไว้วางใจได้ และข้าเชื่อว่า [grantable_title.GetName] ต้องการผู้ปกครองคนใหม่ ท่านว่าอย่างไร?"
 ach_coronation.0019.desc.court_position: "ท่านได้พิสูจน์ตนเองแล้วว่าเป็น [GetCourtPositionType('seneschal_court_position').GetName] ที่มีความสามารถยิ่ง ท่านว่าอย่างไร?"
 ach_coronation.0019.desc.praise: "ข้าตัดสินใจแล้วว่าข้าจะประกาศสรรเสริญชื่อของท่านต่อหน้าทั้งราชสำนักอย่างเป็นทางการ! ทุกคนจะได้รู้ถึงความอุตสาหะของท่าน!"
 ach_coronation.0019.a: "ข้าขอน้อมรับ!"
 ach_coronation.0019.b: "ข้าหวังว่าจะเป็นอะไรที่... เป็นตัวเงินมากกว่านี้"
 ach_coronation.0019.c: "มิตรภาพฉัน [ROOT.Char.Custom2('RelationToMePossessive', SCOPE.sC('host'))] ของข้าก็เพียงพอแล้ว!"
 your_title_cannot_be_revoked_10_tt: "ตำแหน่งยศของท่านจะไม่สามารถถูกเพิกถอนได้เป็นเวลา 10 ปี"

 ach_coronation.0020.t: "[host.Custom2('RelationToMeShort', SCOPE.sC('helpful_family'))|U] ผู้สวมมงกุฎ"
 ach_coronation.0020.desc: "ในขณะที่ข้ายุ่งอยู่กับการเตรียมพิธีราชาภิเษกของข้า [helpful_family.Custom2('MyCharacterIntroduction', ROOT.Char)] ก็ได้เข้ามาจัดการสิ่งต่างๆ อย่างแท้จริง! ไม่มีคนรับใช้คนใดมารบกวนข้าด้วยเรื่องไร้สาระมาหลายวันแล้ว และในที่สุดข้าก็สามารถมุ่งเน้นไปที่พิธีที่กำลังจะมาถึงได้"
 ach_coronation.0020.a: "บัดนี้ [helpful_family.GetSheHe] จะเป็นข้าหลวงที่ข้าวางใจได้!"
 ach_coronation.0020.b: "#EMP นี่#! คือวิถีของราชวงศ์ [host.GetDynastyNameNoTooltip]!"
 ach_coronation.0020.c: "[helpful_family.GetSheHe|U] ช่างเป็น [host.Custom2('RelationToMeShort', SCOPE.sC('helpful_family'))] ที่ยอดเยี่ยมจริงๆ"
 ach_coronation.0020.d: "[helpful_family.GetSheHe|U] เป็นแบบอย่างให้กับข้ารับใช้ทุกคนของข้า"

 ach_coronation.0022.t: "มงกุฎที่ไอโขลก"
 ach_coronation.0022.desc: "[epidemic_scope.GetName] ที่น่าหวาดหวั่นเป็นที่พูดถึงของทุกคนในช่วงนี้ โดยเฉพาะอย่างยิ่งในหมู่ [zealot.GetFaith.AltPriestTermPlural] แห่ง [host.GetPrimaryTitle.GetTierAsName|l] "เหตุใด [zealot.GetFaith.GoodGodNames] จึงลงโทษ [host.GetPrimaryTitle.GetTierAsNameNoTooltip] เช่นนี้?" บ้างก็คร่ำครวญ"
 ach_coronation.0022.desc.whisper.byzantine: ""[host.GetTitledFirstNameNoTooltip] จะอ้างตนว่าเป็น [Glossary( 'ปิสตอส เอน คริสโตอี บาซิเลอุส', 'PISTOS_EN_CHRISTOI_BASILEUS_GLOSS' )] ได้อย่างไร หาก [host.GetFaith.HighGodName] ลงโทษ [host.GetHerHim] ถึงเพียงนี้?""
 PISTOS_EN_CHRISTOI_BASILEUS_GLOSS: "หมายถึง "ผู้ซื่อสัตย์ในพระคริสต์ องค์อธิปัตย์" ซึ่งเป็นคำไบแซนไทน์ที่ใช้แทนคำละตินว่า "Augustus""
 ach_coronation.0022.desc.whisper.hre: ""[host.GetTitledFirstNameNoTooltip] จะอ้าง [Glossary( 'ซาครา มาเยสตาส', 'SACRA_MAJESTAS_GLOSS' )] ได้อย่างไรในเวลา เช่นนี้?""
 SACRA_MAJESTAS_GLOSS: "ภาษาละตินแปลว่า #BOL "ความสูงส่งอันศักดิ์สิทธิ์"#! อาณัติแห่งสวรรค์ที่จักรพรรดิโรมันอันศักดิ์สิทธิ์อ้างสิทธิ์ในการปกครองอาณาราษฎรอย่างยุติธรรม ไม่เพียงในฐานะผู้ปกครองทางโลกเท่านั้น แต่ยัง รวมถึงในฐานะผู้ปกครองทางจิตวิญญาณด้วย"
 ach_coronation.0022.desc.whisper.divine_right: ""[host.GetTitledFirstNameNoTooltip] จะอ้างสิทธิ์อันศักดิ์สิทธิ์เมื่อเผชิญกับลางบอกเหตุ เช่นนี้ได้อย่างไร?""
 ach_coronation.0022.desc.whisper.sinner: ""นี่เป็นผลจากธรรมชาติอันชั่วร้ายของ [host.GetTitledFirstNamePossessiveNoTooltip] หรือไม่?""
 ach_coronation.0022.desc.whisper.fallback: ""[host.GetTitleAsNameNoTooltip] ต้องคำสาปหรือ?""
 ach_coronation.0022.desc.ending: "ถามไถ่ผู้อื่น\n\nข้อกังวลดังกล่าวดูเหมือนจะส่งผลกระทบต่อ [zealot.GetTitledFirstName] มากที่สุด [zealot.GetSheHe|U] ใช้เวลาทั้งวันในการสวดภาวนาด้วยความกังวลอย่างสุดซึ้ง"
 ach_coronation.0022.a.coronation_disrupt_loyalists: "แน่นอนว่า [zealot.GetShortUINameNoTooltip] ย่อมมองเห็นว่าใครคือผู้ที่ควรถูกตำหนิ?"
 ach_coronation.0022.a.coronation_disrupt_loyalists.flavor: "[zealot.GetShortUIName] พูดถูก! [host.GetShortUIName] #EMP นั่นแหละ#! ที่ต้องถูกตำหนิ!"
 ach_coronation.0022.a.coronation_disrupt_loyalists.failure: "[zealot.GetShortUIName] พบว่าบทสนทนานี้เกือบจะเป็นการดูหมิ่นศาสนา"
 ach_coronation.0022.a.coronation_disrupt_loyalists.success: "[zealot.GetSheHe] เชื่อมั่นว่า [host.GetShortUIName] คือผู้ที่ต้องถูกตำหนิ"
 ach_coronation.0022.a.offer_support: "ข้าจะไปพูดคุยกับ [zealot.GetHerHim] ทันที"
 ach_coronation.0022.a.offer_support.flavor: "[host.GetTitleAsName] คงจะยินดีไม่น้อยหากมีคนย้ำเตือนถึงอาณัติแห่งสวรรค์ของ [host.GetHerHis]"
 ach_coronation.0022.a.offer_support.success: "[zealot.GetShortUIName] ขอบคุณท่านที่เตือน [zealot.GetHerHim] ถึงความจงรักภักดีของ [zealot.GetHerHis]"
 ach_coronation.0022.a.offer_support.failure: "ศรัทธาของ [zealot.GetShortUINamePossessive] ดูเหมือนจะสั่นคลอนยิ่งกว่าเดิม"
 ach_coronation.0022.b: "ข้าสวดภาวนากับ [zealot.GetHerHim] ในฐานะ [ROOT.Char.Custom('SisterBrother')] ใน [zealot.GetFaith.GoodGodNames]"
 ach_coronation.0022.c: "มีหลายคนที่หากเพียงแค่สะกิด ก็จะเห็นด้วย..."
 ach_coronation.0022.c.failure: "ผู้คนค่อนข้างรำคาญกับการยุยงของท่าน"
 ach_coronation.0022.c.success: "ฝ่าย [GetVassalStance( 'zealot' ).GetTextIcon][GetVassalStance( 'zealot' ).GetName] รวมตัวกันต่อต้าน [host.GetTitledFirstNameNoTooltip]"
 ach_coronation.0022.d: "การอยู่ห่างๆ ดู... รอบคอบกว่า"
 ach_coronation.0022.d.flavor: "ในยามเจ็บไข้ การอยู่ห่างจากศัตรู และห่างจากมิตรให้ไกลกว่านั้น ถือเป็นเรื่องดี"

 ach_coronation.0023.t: "[foreign_warrior.Custom('KnightCultureNoTooltip')] ของ [ROOT.Char.GetTitleAsNamePossessiveNoTooltip]"
 ach_coronation.0023.desc: "ข้ากำลังทักทายแถวของผู้มาใหม่ เมื่อคนต่างแดนผู้หนึ่งปรากฏตัวต่อหน้าข้า—พร้อมดาบอันแปลกตาที่ข้างกาย [foreign_warrior.GetSheHe|U] ทรุดเข่าลงทันทีและถวายดาบของ [foreign_warrior.GetHerHis] อย่างสง่างาม\n\n"โอ้ ท่าน [ROOT.Char.GetTitleAsNameNoTooltip] ผู้ยิ่งใหญ่! ข้าใช้เวลาเดินทางยาวนาน ห่างไกลจาก [foreign_ruler.GetCapitalLocation.GetName] และได้ยินมาว่าท่านกำลังแสวงหาผู้รับใช้ที่ภักดี ผู้ปกครองผู้ทรงอำนาจ โปรดอนุญาตให้ข้าแสวงหาเกียรติยศและรับใช้ท่าน ดัง เช่นที่ข้ารับใช้ [foreign_warrior.GetFaith.HighGodName]!""
 ach_coronation.0023.desc.clergy.angry: "\n\n[clergy.Custom2('MyCharacterIntroduction', ROOT.Char)|U] มองอย่างฉุนเฉียวเมื่อมีการกล่าวถึงพระเจ้าของ [ROOT.Char.Custom2('GetUnbelieverTermAdjective', foreign_warrior)]"
 ach_coronation.0023.desc.clergy: "\n\nข้าเห็น [clergy.Custom2('MyCharacterIntroduction', ROOT.Char)] มองอย่างสงสัยใคร่รู้เมื่อมีการกล่าวถึงพระเจ้าของ [ROOT.Char.Custom2('GetUnbelieverTermAdjective', foreign_warrior)]"
 ach_coronation.0023.a: "นี่มัน #EMP [GetCourtPositionType('bodyguard_court_position').GetNameNoTooltip]#! ชัดๆ!"
 ach_coronation.0023.b: "[foreign_warrior.GetSheHe|U] จะเป็น [GetCourtPositionType('champion_court_position').GetNameNoTooltip] ของข้า!"
 ach_coronation.0023.c: "จงมาอยู่ในราชสำนักของข้า!"
 ach_coronation.0023.d: "นำไอ้ [foreign_warrior.Custom2('InsultAdjective', ROOT.Char)] [ROOT.Char.Custom2('GetUnbelieverTermAdjective', foreign_warrior)] ผู้นี้ออกไปเดี๋ยวนี้!"
 cultural_acceptance_gain_accepted_foreign_warrior:0 "ยอมรับนักรบต่างแดน"

 ach_coronation.0025.t: "เพื่อดื่มและสังสรรค์"
 ach_coronation.0025.desc: "นอกห้องจัดเลี้ยง ข้าออกมาสูดอากาศบริสุทธิ์และชมทิวทัศน์ของ [feast_location.GetBaronyNameExplicitly] พร้อมกับเสียงของคู่รักในพุ่มไม้ใกล้ๆ และเสียง [ROOT.Char.Custom('KnightCultureNoTooltip')|l] ท้องถิ่นที่กำลังอาเจียนใกล้พวกเขาอย่างน่าหวาดเสียว เหนือสิ่งอื่นใด เสียงเฉลิมฉลองของ [feast_location.GetTitle.Custom('BaronyTownType')] ดังอบอวลอยู่ในอากาศ\n\nทันใดนั้น ความคิดหนึ่งก็ผุดขึ้นมา!"
 ach_coronation.0025.desc.host: "ชาว [feast_location.GetBaronyNameExplicitlyNoTooltip] ทั้งหมดอาจกำลังดื่มอวยพรให้ข้า เพียงแค่เลี้ยงเครื่องดื่มฟรีสักสองสามคืน ข้าเพียงต้องหาพ่อค้าที่ยินดีขายในยามนี้..."
 ach_coronation.0025.desc.guest: "[host.GetTitledFirstName] คงจะยินดีไม่น้อยที่ผู้คนขับขานนามของ [host.GetHerHis] — และชาว [feast_location.GetTitle.Custom('BaronyTownType')] ก็คงยินดีกับเครื่องดื่มฟรีสักคืน — ข้าเพียงต้องหาพ่อค้าที่ยินดีขายในยามนี้..."
 ach_coronation.0025.a: "ข้าจะจ่ายค่า [baron.Custom('RegionalAlcoholicDrink')] เอง!"
 ach_coronation.0025.b: "จะเป็นอย่างไรหาก [baron.GetTitledFirstName] ร่วมสมทบทุนด้วย?"
 ach_coronation.0025.b.flavor: "ด้วยเครื่องดื่มทั้งหมดที่เราสองคนจะหามาได้ [feast_location.GetName] จะได้รู้จักความรื่นเริงที่ #EMP แท้จริง#! กัน!"
 ach_coronation.0025.b.tt.success: "[baron.GetTitledFirstName] ตกลง — ปล่อยให้ช่วงเวลาดีๆ ไหลมาเทมา!"
 ach_coronation.0025.b.tt.failure: "[baron.GetTitledFirstName] ไม่เห็นว่าความคิดของท่านจะยอดเยี่ยมตรงไหน"
 ach_coronation.0025.b.tt: "ท่านเป็น [GetTrait('lifestyle_reveler').GetName( GetNullCharacter )] หรือ [GetTrait('drunkard').GetName( GetNullCharacter )] และมีอย่างน้อย [gold_i][GetPlayer.MakeScope.ScriptValue('minor_gold_value')|0V] [gold|E]"
 ach_coronation.0025.c: "บางทีอาจจะไม่... เหลือไว้ให้ข้าเยอะขึ้น!"
 ach_coronation.0025.c.temperate: "คนเราไม่จำเป็นต้องดื่มเพื่อความสนุก!"
 ach_coronation.0025.c.flavor: "ยังมีเรื่องสนุกอีกมากมายรออยู่ข้างใน"

 ach_coronation.0026.t: "ลางร้าย"
 ach_coronation.0026.desc: "งานเลี้ยงดำเนินต่อไป ทุกเสียงกระหน่ำกลองส่งความสั่นสะท้านไปทั่วสันหลังของข้า และความคิดที่จะดื่ม [ROOT.Char.Custom('GetExpensiveDrink')] เพิ่มเติมเกือบ ทำให้ข้าคลื่นไส้ ไม่ต้องสงสัยเลยว่าเหล่าหัวหน้าเผ่าจะมองว่ามันเป็นลางร้ายหากข้าเกิดป่วยขึ้นมา โดยเฉพาะในตอนนี้!\n\nราวกับรู้จังหวะ [vassal.Custom2('MyCharacterIntroduction', ROOT.Char)] ก็เดินอาดๆ เข้ามาพร้อมจานอาหารและถ้วยเครื่องดื่มรสชาติแย่ๆ"
 ach_coronation.0026.a: "ข้าต้องเข้มแข็งไว้!"
 ach_coronation.0026.a.tt: "ท่านจะกัดฟันและพยายามเอาชีวิตรอดให้ผ่านพ้นคืนนี้ไปให้ได้"
 ach_coronation.0026.a.tt.sick: "ท่านรู้สึกเหมือนกำลังจะเป็นไข้"
 ach_coronation.0026.a.tt.sick.failure: "ท่านปิดบังมันไม่มิด"
 ach_coronation.0026.a.tt.sick.success: "ท่านยังคงเข้มแข็ง"
 ach_coronation.0026.a.tt.critical_success: "ขอบคุณ [ROOT.Char.GetFaith.HighGodName]! ความรู้สึกนั้นหายไปแล้ว"
 ach_coronation.0026.b: "[vassal.GetTitledFirstNameNoTooltip]! ช่วยข้าด้วย!"
 ach_coronation.0026.b.tt: "[vassal.GetTitledFirstName] จะใช้เวลาที่เหลือของงานเลี้ยงช่วยท่านปกปิดอาการป่วย"
 ach_coronation.0026.c: "พอแล้ว! ข้าต้องออกไปพักผ่อน"
 ach_coronation.0026.c.flavor: "การละทิ้งงานเลี้ยงของตัวเองน่าจะส่งผลเสีย"

 ach_coronation.0027.t: "ของว่างอันน่าอภิรมย์"
 ach_coronation.0027.desc: ""[ROOT.Char.Custom2('RelationToMeAddress', partaker)|U]!" [partaker.Custom2('MyCharacterIntroduction', ROOT.Char)] เอ่ยขึ้น — พร้อมกลิ่นแปลกๆ ที่ตาม [partaker.GetHerHim] มาถึงโต๊ะของข้า — "ท่านต้องมาพบกับ [stoner.GetWomanMan] ที่น่าสนใจผู้นี้ [stoner.GetSheHe] ได้นำ"
 ach_coronation.0027.desc.char.crusader: "เค้กซาราเซ็นที่แปลกใหม่และน่าอภิรมย์กลับมาจากการผจญภัยในสงครามครูเสดของ [stoner.GetHerHis]!""
 ach_coronation.0027.desc.char.varangian: "เค้กประหลาดเหล่านี้กลับมาจากการผจญภัยของ [stoner.GetHerHis] ในหมู่ [emperor_culture.GetCollectiveNoun]!""
 ach_coronation.0027.desc.char.other: "เค้กแฮชิชกลิ่นดอกไม้อันน่าอัศจรรย์!""
 ach_coronation.0027.a: "ข้าจะซื้อเสบียงทั้งหมดของ [stoner.GetHerHis]!"
 ach_coronation.0027.b: "เอาน่า มันจะเสียหายอะไรกัน?"
 ach_coronation.0027.b.hashishiyah: "ฟังดู [stoner.GetSheHe|U] เป็น [stoner.GetWomanMan] ที่มีวัฒนธรรม!"
 ach_coronation.0027.c: "ในงานราชาภิเษกของ #EMP ข้า#! เนี่ยนะ!? ไปให้พ้น!"
 ach_coronation.0027.d: ""เพลิดเพลินโดยไม่มีข้าเถอะ [partaker.GetFirstNameNoTooltip]""
 ach_coronation.0027.d.host: "เจ้าบ้านที่ดีต้องเหลือของไว้ให้แขกของ [ROOT.Char.GetHerHis] อย่างเพียงพอ!"
 purchased_hashish_opinion: "ซื้อแฮชิช"

 ach_coronation.0028.t: "ความมึนเมาอันชอบธรรม"
 ach_coronation.0028.desc: ""[ROOT.Char.GetFirstName]!" [drinker.Custom2('MyCharacterIntroduction', ROOT.Char)] ตะโกนข้ามโถงมา — ดังพอที่จะได้ยินฝ่าเสียงอึกทึกของงานฉลองราชาภิเษก "เจ้าคิดว่ามงกุฎใหม่ ทำให้เจ้าทรงพลังนักรึ!? เช่นนั้นก็ขอสาบานต่อ [drinker.GetFaith.HighGodName] จงดื่ม! พิสูจน์ตัวเองว่าเป็น [ROOT.Char.GetTitleAsNameNoTooltip] ที่คู่ควร!"\n\nสายตาคาดหวังมากมายจับจ้องมาที่ข้า รอคอยคำตอบของข้าอย่างใจจดใจจ่อ"
 ach_coronation.0028.a: "[drinker.GetTitledFirstNameNoTooltip] เจอคู่ต่อสู้ [drinker.GetHerHis] ที่สมน้ำสมเนื้อแล้ว!"
 ach_coronation.0028.a.win: "ท่านดื่มจน [drinker.GetFirstNameNoTooltip] หมอบคาโต๊ะ!"
 ach_coronation.0028.a.lose: "ท่านดื่มสู้ไม่ไหว"
 ach_coronation.0028.b.win: "[drinker.GetFirstNameNoTooltip] ไม่มีโอกาสชนะตั้งแต่แรกแล้ว"
 ach_coronation.0028.b.lose: "การสมรู้ร่วมคิดของท่านถูกค้นพบ!"
 ach_coronation.0028.b: "ถ้าข้าสามารถแอบใส่อะไรลงในถ้วยของ [drinker.GetHerHis] ได้..."
 ach_coronation.0028.c: "ข้าไม่คิด เช่นนั้น"

 ach_coronation.0029.t: "การล่าของ [ROOT.Char.GetTitleAsNamePossessiveNoTooltip]"
 ach_coronation.0029.desc: "[ROOT.Char.Custom('GetFoodBird')] อบ [ROOT.Char.Custom('FunFoodPrefix')] นั้นอร่อยเลิศ แต่เรื่องราวที่เราเล่านั้นดียิ่งกว่า! [first.Custom2('MyCharacterIntroduction', ROOT.Char)|U] [second.GetFirstName] [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('second') )] ของข้า และข้าใช้เวลาหลายชั่วโมงแลกเปลี่ยนเรื่องราวการล่าที่ยิ่งใหญ่ที่สุดของเรา\n\n"พอแล้ว!" [first.GetTitledFirstNameNoTooltip] ตะโกน "ตอนนี้ท่านสวมมงกุฎแล้ว ท่านสามารถเรียกการล่าสัตว์หลังงานเลี้ยงได้! เราจะ ทำให้มันพิเศษสำหรับ [ROOT.Char.GetTitleAsNameNoTooltip|l] คนใหม่ของเรา!"\n\n"ใช่!" [second.GetFirstNameNoTooltip] พยักหน้าอย่างกระตือรือร้น "การล่าสำหรับ [ROOT.Char.GetTitleAsNameNoTooltip|l]... การล่าของ [ROOT.Char.GetTitleAsNamePossessiveNoTooltip]!""
 ach_coronation.0029.a: "ใช่! การล่าของ [ROOT.Char.GetTitleAsNamePossessiveNoTooltip]!"
 ach_coronation.0029.a.flavor.impress_attendees: "และท่านจะ ทำให้แน่ใจว่าทั่วทั้ง [ROOT.Char.GetPrimaryTitle.GetNameNoTierNoTooltip] ได้ยินเรื่องนี้!"
 ach_coronation.0029.a.flavor.embrace_supporters: "มันจะนำพาข้าและผู้สนับสนุนของข้ามาใกล้ชิดกัน!"
 ach_coronation.0029.a.flavor.exalt_crown: "และสัตว์ที่เราจับได้จะเป็นสัญลักษณ์แห่งการปกครองของข้า!"
 ach_coronation.0029.a.impressive_hunt: "[GetActivityType('activity_hunt').GetName] ครั้งต่อไปของท่านจะเพิ่ม [opinion|E] ของ [vassals|E] ที่มีต่อท่าน"
 ach_coronation.0029.a.personal_hunt: "[GetActivityType('activity_hunt').GetName] ครั้งต่อไปของท่านอาจ ทำให้ [guests|E] ที่เป็น [vassal|E] ได้รับ [trait|E] [GetTrait('loyal').GetName( GetNullCharacter )]"
 ach_coronation.0029.a.glorious_hunt: "[GetActivityType('activity_hunt').GetName] ครั้งต่อไปของท่านจะเพิ่ม [legitimacy|E] ของท่าน"
 ach_coronation.0029.b: "ถ้าเราไปล่าเหยี่ยวแทนล่ะ?"
 ach_coronation.0029.b.free_falconry: "[GetActivityType('activity_hunt').GetName] ประเภท $hunt_type_falconry$ ครั้งต่อไปของท่านจะไม่เสียค่าใช้จ่าย [gold|E] ใดๆ"
 ach_coronation.0029.b.flavor: "และแน่นอนว่า ท่านสองคนจะต้องเป็นคนจัดหานกมา!"
 ach_coronation.0029.c: "ฮ่า! ข้าคงจะยุ่งเกินไป!"
 ach_coronation.0029.c.virtuous: "เกิดอะไรขึ้นกับ 'ความพอประมาณในทุกสิ่ง'?"
 ach_coronation.0029.c.virtuous.tt: "ตัวเลือกนี้ใช้ได้ เพราะ [faith|E] แบบ [THIS.Char.GetFaith.GetAdjective] ของท่านถือว่า [trait|E] [GetTrait('temperate').GetName( GetNullCharacter )] เป็น [virtuous|E]"
 hunt_kings_hunt_header: "การล่าของ [ROOT.Char.GetTitleAsNamePossessiveNoTooltip]"
 hunt_default_header: "การล่า"

 every_non_disloyal_vassal_attendee_tt: "[vassals|E] ที่ไม่ใช่ [GetTrait('disloyal').GetName( GetNullCharacter )] ของ [host.GetTitledFirstName] ที่เข้าร่วมพิธีราชาภิเษก"
 every_detractor_tt: "ทุก [coronation_detractor|E] ที่ [coronation|E]"
 every_non_detractor_tt: "[guest|E] [coronation|E] ทุกคนที่ไม่ได้เป็น [coronation_detractor|E]"
 every_zealot_vassal_guest_tt: "[vassal|E] [GetVassalStance( 'zealot' ).GetTextIcon][GetVassalStance( 'zealot' ).GetName] ทุกคนที่อยู่ใน [activity|E] นี้"
 every_faith_warrior_guest_tt: "ทุกคนที่เป็น [GetTrait('faith_warrior').GetName( GetNullCharacter )] หรือ [GetTrait('crusader_king').GetName( GetNullCharacter )] ที่อยู่ใน [activity|E] นี้"
 
 available_because_host_intent_tt: "ตัวเลือกนี้ใช้ได้ เนื่องจาก [intent|e] [host.GetInvolvedActivityIntent.GetName] ของ [host.GetTitledFirstName]"
 available_because_skill_learning_tt: "ตัวเลือกนี้ใช้ได้ เนื่องจาก [skill|E] ด้าน [learning|E] ที่สูงของท่าน"
 available_because_piety_vs_host_tt: "ตัวเลือกนี้ใช้ได้ เนื่องจาก [piety_level|E] ของท่านสูงกว่าของ [host.GetTitledFirstName]"
 available_because_of_shared_religion_tt: "ตัวเลือกนี้ใช้ได้ เนื่องจากท่านทั้งคู่เป็น [THIS.Char.GetFaith.GetReligion.GetAdherentNamePlural]"

 because_you_have_diligent_tt: "#P เพราะท่าน [GetTrait('diligent').GetName( GetNullCharacter )] ท่านจะไม่ [GetModifier('ach_negative_rumors_modifier').GetNameWithTooltip]#!"
