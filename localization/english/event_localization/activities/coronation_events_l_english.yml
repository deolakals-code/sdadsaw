l_english: 
 # Events
 ach_coronation.0001.t: "การมาถึง"
 ach_coronation.0001.travel: "ในที่สุดข้าก็มาถึง [ROOT.Char.GetCurrentLocation.GetBaronyNameExplicitly] เพื่อเข้าร่วมพิธีราชาภิเษก"
 ach_coronation.0001.notravel: "สารและเหล่าข้ารับใช้ถูกส่งออกไปจาก [ROOT.Char.GetCurrentLocation.GetBaronyNameExplicitly] เพื่อพิธีราชาภิเษก"
 ach_coronation.0001.intro.hre: "นี่มิใช่เรื่องเล็กน้อย การสวมมงกุฎให้แก่ [host.GetTitleAsName] ดูเหมือนว่าผู้คนทั่วทั้ง [host.GetPrimaryTitle.GetTierAsName] จะหลั่งไหลมายัง [ROOT.Char.GetCurrentLocation.GetBaronyNameExplicitlyNoTooltip] ทั้งธงทิวของเหล่าผู้คัดเลือกและขุนนางท้องถิ่นนับร้อยต่างโบกสะบัดแล้ว"
 ach_coronation.0001.intro.hre_host: "ในไม่ช้า ข้าจะได้ประทับบนบัลลังก์แห่งชาร์เลอมาญ สวมมงกุฎแห่งออตโต และกล่าววาจาดั่งออกัสตัส เหล่าผู้คัดเลือกได้เลือก [ROOT.Char.GetTitleAsNameNoTooltip] ของพวกเขาแล้ว บัดนี้ถึงเวลาแล้วที่ผู้อื่นทั้งปวงจะปฏิบัติตาม"
 ach_coronation.0001.intro.byzantine: "เหตุการณ์เหล่านี้จะยกย่อง [host.GetTitledFirstName] ให้อยู่ในระดับเดียวกับเฮราคลิออสและจัสติเนียน การปกครอง [Glossary( 'โรไมออย', 'ROMAIOS_GLOSS' )] คือการปกครองโลก และได้ แต่หวังว่า [host.GetTitledFirstNameNoTooltip] จะคู่ควรกับโอกาสนี้"
 ach_coronation.0001.intro.byzantine_host: "ในไม่ช้า ข้าจะเข้าแทนที่อันชอบธรรมเคียงข้างคอนสแตนตินและธีโอโดซิอุส ข้าจะเป็น [Glossary( 'ออโตครากตอร์', 'AUTOKRATOR_GLOSS')] ผู้เป็นนายแห่งจักรวาล ผู้ปกครองทั่วทั้งโรม [ROOT.Char.GetTitleAsName] ที่แท้จริง!"
 ach_coronation.0001.intro.host: "บรรยากาศอบอวลไปด้วยความคาดหวัง ข้าเพิ่งตระหนักได้ว่า ในที่สุดข้ากำลังจะได้รับการสวมมงกุฎเป็น [ROOT.Char.GetTitleAsNameNoTooltip] แห่ง [ROOT.Char.GetPrimaryTitle.GetNameNoTier]"
 ach_coronation.0001.intro.notravel_host: "เพียงเมื่อคำเชิญสุดท้ายถูกส่งออกไปและราชสำนักเริ่มเตรียมการ ข้าจึงตระหนักได้ว่า: ในที่สุดข้ากำลังจะได้รับการสวมมงกุฎเป็น [ROOT.Char.GetTitleAsName] แห่ง [ROOT.Char.GetPrimaryTitle.GetNameNoTier]"
 ach_coronation.0001.guest: "[host.GetTitledFirstName] จะเข้าพิธีสวมมงกุฎที่นี่ใน [ROOT.Char.GetCurrentLocation.GetBaronyNameExplicitlyNoTooltip] และข้าได้ แต่หวังว่า [host.GetSheHe] จะพิสูจน์ตนว่าคู่ควรกับมงกุฎของ [host.GetHerHis]"
 ach_coronation.0001.ending.host_arbitrary: "\n\nในไม่ช้า ข้าจะเป็น [ROOT.Char.GetTitleAsNameNoTooltip] และจะไม่มีผู้ใดกล่าวเป็นอื่นได้! ในที่สุดข้าก็มีอิสระที่จะปกครองตามที่ #emp ข้า#! ปรารถนาจะปกครอง"
 ach_coronation.0001.ending.host_cynical: "\n\nบัดนี้ข้าเตรียมพร้อมที่จะก้มหัวต่อหน้า [priest.GetFirstName] ต่อหน้าทั้งอาณาจักรดั่งคนเขลาผู้ศรัทธา แต่เมื่อข้ายืนขึ้น ข้าจะไม่ถูกบังคับให้ทนฟังคำพูดพล่ามไร้สาระของ [priest.GetHerHis] อีกต่อไป!"
 ach_coronation.0001.ending.host_cynical_hof: "\n\nข้ารอไม่ไหวจริงๆ ที่จะได้เห็น [priest.GetTitledFirstName] เดินวางท่าไปมากับกลุ่มคนที่น่าเบื่อที่สุดเท่าที่จะจินตนาการได้..."
 ach_coronation.0001.ending.host_impatient: "\n\nข้ารอให้เรื่องนี้มันจบๆ ไปไม่ไหวแล้ว! การรอคอยนี้ช่างทรมาน [ROOT.Char.Custom('GetBusynessOpinion')] ข้าจะยุ่งเกินกว่าจะนึกถึงมัน..."
 ach_coronation.0001.ending.host_just: "\n\nจนบัดนี้ ข้าเป็นผู้ไร้ความชอบธรรม ไม่ต่างอะไรกับผู้แอบอ้าง แต่เมื่อพิธีนี้สิ้นสุดลง ในที่สุดข้าจะเป็น [ROOT.Char.GetTitleAsNameNoTooltip] อย่างแท้จริง!"
 ach_coronation.0001.ending.host_ambitious: "\n\nการที่ได้รู้ว่าอีกไม่นานมงกุฎจะถูกสวมลงบนศีรษะข้านั้นช่างน่ายินดี แต่นี่เป็นเพียงก้าวแรกสู่เกียรติยศอัน #EMP แท้จริง#! เท่านั้น"
 ach_coronation.0001.ending.host_compassionate: "\n\nแม้ว่าเกียรติยศที่จะมาถึงนั้นจะยิ่งใหญ่ แต่ข้าต้องระลึกไว้ว่า ข้าต้องพิสูจน์ตนเองต่อประชาชนแห่ง [ROOT.Char.GetPrimaryTitle.GetTierAsName] ของข้า"
 ach_coronation.0001.ending.host_trusting: "\n\nในไม่ช้า เหล่าข้าหลวงทั้งหมดของข้าจะมาอยู่ที่นี่กับข้า ทุกคนต่างแซ่ซ้องโห่ร้องนามของข้าอย่างแน่นอน!"
 ach_coronation.0001.ending.host_paranoid: "\n\nในไม่ช้า เหล่าข้าหลวงทั้งหมดของข้าจะมาอยู่ที่นี่กับข้า และ [ROOT.Char.GetCurrentLocation.GetBaronyNameExplicitlyNoTooltip] ก็จะกลายเป็นรังอสรพิษ ข้าจำต้องระวังหลังไว้ให้ดี..."
 ach_coronation.0001.ending.host_zealous: "\n\nข้าต้องสวดภาวนา เพราะเพียง [ROOT.Char.GetFaith.HighGodName] เท่านั้นที่จะตัดสินได้ว่าข้าคู่ควรหรือไม่"
 ach_coronation.0001.ending.host_content: "\n\nตามจริงแล้ว ข้าอยู่ได้โดยไม่มีเรื่องทั้งหมดนี้ แต่มีบางสิ่งที่ [ROOT.Char.GetTitleAsNameNoTooltip] จำต้องกระทำ"
 ach_coronation.0001.ending.host_gregarious: "\n\nข้าจะมีผู้คนมากมายเหลือเกินที่ต้องพูดคุยด้วย... นี่อาจจะสนุกก็ได้!"
 ach_coronation.0001.ending.host_craven: "\n\nทุกอย่างจะเป็นไปด้วยดี ข้าหวังว่านะ ตราบใดที่เหล่าข้าหลวงของข้ายังอยู่ในแถว... พ-พวกเขาจะอยู่ในแถวใช่หรือไม่?"
 ach_coronation.0001.ending.host_shy: "\n\nทั่วทั้งอาณาจักรจะมาอยู่ที่ [ROOT.Char.GetCurrentLocation.GetBaronyNameExplicitlyNoTooltip] ในไม่ช้า... ยิ่งเรื่องนี้จบเร็วเท่าไหร่ก็ยิ่งดี"
 ach_coronation.0001.ending.host_arrogant: "\n\nในไม่ช้า ทุกคน—ทั้งไพร่และขุนนาง—จะต้องก้มหัวต่อหน้าข้า... ดี"
 ach_coronation.0001.ending.host_calm: "\n\nแม้ว่าพิธีราชาภิเษกควรเป็นวันที่น่ายินดีสำหรับทุกคน แต่ข้าต้องระมัดระวัง วันข้างหน้าอาจพิสูจน์ได้ว่าอันตราย..."
 ach_coronation.0001.ending.host_gluttonous: "\n\nข้ารอที่จะสวมมงกุฎไม่ไหวแล้ว! มันคงจะรุ่งโรจน์ยิ่งนักที่ได้ร่วมโต๊ะเสวยกับทั่วทั้งอาณาจักรในฐานะ [ROOT.Char.GetTitleAsNameNoTooltip] ที่แท้จริง!"
 ach_coronation.0001.ending.host_eccentric: "\n\nในไม่ช้าพวกเขาจะสวมมงกุฎให้ข้า และข้าจะครองราชย์ #EMP ตลอดกาล#!"
 ach_coronation.0001.ending.host_neutral: "\n\nแม้ว่าข้าจะครองราชย์อยู่แล้ว แต่พิธีราชาภิเษกนี้คือสิ่งที่จะประทับตราว่าข้าคือ [ROOT.Char.GetTitleAsNameNoTooltip] ที่แท้จริง และข้าพร้อมแล้ว"
 ach_coronation.0001.ending.hostile_host: "\n\n[host.GetTitledFirstNameNoTooltip] หามิได้เป็นสหายของข้า แต่อย่างใด แต่ข้า—และอาณาจักร—จะอดทน"
 ach_coronation.0001.ending.friendly_host: "\n\n[host.GetTitledFirstNameNoTooltip] เป็นที่รู้กันว่าชื่นชอบข้า—ขอให้การครองราชย์ของเขานำมา ซึ่งประโยชน์แก่เราทั้งสอง! หรืออย่างน้อยก็แก่ตัวข้า..."
 ach_coronation.0001.ending.neutral_host: "\n\nไม่ว่าจะรักหรือเกลียด [host.GetTitleAsNameNoTooltip] ก็ตาม ไม่มีผู้ใดปฏิเสธความรู้สึกถึงความสำคัญที่เราผู้เป็นสักขีพยานมีร่วมกันได้"
 ach_coronation.0001.a: "ในไม่ช้า การครองราชย์ของข้าจะเริ่มต้นขึ้น!"
 ach_coronation.0001.a.eccentric: "ตลอดกาล..."
 ach_coronation.0001.a.bad: "ถึงเวลาดูว่าข้าจะไปก่อปัญหาใดได้บ้าง..."
 ach_coronation.0001.a.good: "บทใหม่ได้เริ่มต้นขึ้นแล้วในวันนี้"
 ach_coronation.0001.tt.hof_visit.title: "การมาเยือนอันศักดิ์สิทธิ์"
 ach_coronation.0001.tt.hof_visit: "[hof.GetCurrentLocation.GetBaronyNameExplicitly] ได้รับ [GetModifier('ach_hof_visit_modifier').GetNameWithTooltip] เนื่องจากการมาถึงของ [hof.GetTitledFirstNamePossessive]"

 ach_coronation.0010.t: "[hof.GetTitledFirstNameNoTooltip] มาถึง"
 ach_coronation.0010.desc.desc_opening: "เสียงระฆังดังจาก [coronation_site.GetCounty.GetFaith.HouseOfWorship] ทุกแห่ง และผู้คนโห่ร้องยินดีตามท้องถนนของ [coronation_site.GetHolding.GetName] ขณะที่ธงทิวของ [hof.GetTitledFirstName] ปรากฏขึ้นที่ขอบฟ้า"
# Greeting
 ach_coronation.0010.desc.desc_greeting.first_person: "[greeter.GetCouncillorPosition( 'councillor_court_chaplain' ).GetPositionName] ของข้า [greeter_2.GetFirstName] และตัวข้า เป็นกลุ่มแรกที่ได้พบกับ [hof.GetTitleAsNameNoTooltip] และหลังจาก [greeter.Custom2('GetHoFGreeterExchangeFirstPerson', SCOPE.sC('hof'))], พวกเราก็เข้าสู่ [coronation_site.GetHolding.GetNameNoTooltip]\n\n"
 ach_coronation.0010.desc.desc_greeting.host: "[greeter.GetTitledFirstName] และ [greeter.GetCouncillorPosition( 'councillor_court_chaplain' ).GetPositionName] ของ [greeter.GetHerHis] [greeter_2.GetFirstName] เป็นกลุ่มแรกที่ได้พบคณะผู้แทน [hof.GetPrimaryTitle.GetAdjective] และจะเข้าสู่ [coronation_site.GetHolding.GetNameNoTooltip] ก็ต่อเมื่อ [greeter.Custom2('GetHoFGreeterExchange', SCOPE.sC('hof'))]\n\n"
 ach_coronation.0010.desc.desc_greeting.baron: "[greeter.GetTitledFirstName] และ [greeter.GetCouncillorPosition( 'councillor_court_chaplain' ).GetPositionName] ท้องถิ่น [greeter_2.GetTitledFirstName] เป็นกลุ่มแรกที่ได้พบคณะผู้แทน [hof.GetPrimaryTitle.GetAdjective] และจะเข้าสู่ [coronation_site.GetHolding.GetNameNoTooltip] ก็ต่อเมื่อ [greeter.Custom2('GetHoFGreeterExchange', SCOPE.sC('hof'))]\n\n"
# First description
 ach_coronation.0010.desc.desc_first.greedy: "เหล่าคนจนในท้องถิ่นไม่ควรคาดหวังของบริจาคมากนัก—กล่าวกันว่า [hof.GetTitledFirstNameNoTooltip] เป็นคนตระหนี่อย่างยิ่ง— แม้ว่าพวกเขาจะได้เห็น"
 ach_coronation.0010.desc.desc_first.generous: "[hof.GetTitledFirstName] เป็นที่รู้จักในฐานะ [hof.GetWomanMan] ผู้ใจกว้าง—คนท้องถิ่นจะได้รับของบริจาคมากมายอย่างมิต้องสงสัย ควบคู่ไปกับ"
 ach_coronation.0010.desc.desc_first.compassionate: "ความเมตตาของ [hof.GetTitleAsNameNoTooltip] นั้นเป็นที่เลื่องลือ และคำสวดภาวนามากมายต่อจิตใจอันดีงามของ [hof.GetHerHis] ก็ดังก้องไปทั่ว พร้อมกับเรื่องเล่าถึง"
 ach_coronation.0010.desc.desc_first.cynical: "[hof.GetTitledFirstName] เป็นที่รู้จักในทางเสียหายน้อยกว่าในเรื่องศรัทธาของ [hof.GetHerHis] แต่เป็นที่รู้จักมากกว่าในเรื่อง"
 ach_coronation.0010.desc.desc_first: "เหล่าผู้ศรัทธาต่างหลั่งไหลมาเพื่อยล [hof.GetTitledFirstNameNoTooltip] และพ่อค้ากับขอทานทุกคนในเมืองก็ติดตามมา เช่นกัน รวมถึงผู้ที่เพียงหวังจะได้เห็น"
# Second description
 ach_coronation.0010.desc.desc_second.zealous: "บทเทศน์อันร้อนแรงที่มีชื่อเสียงและความกระตือรือร้นอันยอดเยี่ยมของ [hof.GetHerHis]"
 ach_coronation.0010.desc.desc_second.wrathful: "ท่าทีอันร้อนแรงดั่งไฟที่เป็นตำนานและอารมณ์ฉุนเฉียวของ [hof.GetHerHis]"
 ach_coronation.0010.desc.desc_second.lustful: "รสนิยม... อันฉาวโฉ่ของ [hof.GetHerHis]"
 ach_coronation.0010.desc.desc_second.strong: "รูปร่างอันเป็นตำนานของ [hof.GetHerHis] สรีระที่ได้รับพรจาก [hof.GetFaith.HighGodName] อย่างมิต้องสงสัย"
 ach_coronation.0010.desc.desc_second.gluttonous: "ความตะกละอันฉาวโฉ่ของ [hof.GetHerHis]—ที่ถูกกล่าวหาว่าเป็นหายนะของ [hof.Custom('GetExpensiveDessert')] ทุกชิ้นใน [hof.GetCapitalLocation.GetBaronyNameExplicitlyNoTooltip]"
 ach_coronation.0010.desc.desc_second: "ความสำคัญและเกียรติภูมิอันยิ่งใหญ่ของ [hof.GetHerHis]"
# Ending
 ach_coronation.0010.desc.desc_ending.excommunicated_first_person: "ข้าประหลาดใจที่ [hof.GetTitledFirstNameNoTooltip] อุตส่าห์มา ทั้งที่ข้ากำลังถูกบัพพาชนียกรรม ไม่ต้องสงสัยเลยว่าราคาของพรจาก [hof.GetHerHis] คงจะสูงยิ่ง..."
 ach_coronation.0010.desc.desc_ending.excommunicated: "หลายคนประหลาดใจที่ [hof.GetTitledFirstName] อุตส่าห์มา ทั้งที่ [host.GetFirstNamePossessiveNoTooltip] กำลังถูกบัพพาชนียกรรม—[host.GetTitleAsNameNoTooltip] จะต้องจ่ายหนักเพื่อมงกุฎของ [host.GetHerHis] อย่างมิต้องสงสัย..."
 ach_coronation.0010.desc.desc_ending.opinion_very_good_first_person: "[hof.GetFirstNameNoTooltip] และข้าเป็นสหายรักกัน และพิธีราชาภิเษกนี้จะเป็นโอกาสอันน่ายินดีสำหรับเราทั้งสองอย่างมิต้องสงสัย"
 ach_coronation.0010.desc.desc_ending.opinion_very_good: "กล่าวกันว่า [hof.GetTitleAsNameNoTooltip] และ [host.GetTitleAsNameNoTooltip] เป็นสหายรักกัน และพิธีราชาภิเษกนี้จะเป็นโอกาสอันน่ายินดีสำหรับพวกเขาทั้งสองอย่างมิต้องสงสัย"
 ach_coronation.0010.desc.desc_ending.opinion_bad: "กระนั้น ความตึงเครียดระหว่าง [hof.GetTitleAsNameNoTooltip] และ [host.GetTitleAsNameNoTooltip] ก็ [host.Custom2('GetRandomConflictDescriptor', SCOPE.sC('hof'))] และบรรยากาศในพิธีราชาภิเษกก็จะตึงเครียดอย่างมิต้องสงสัย"
 ach_coronation.0010.desc.desc_ending.opinion_bad_first_person: "กระนั้น ความตึงเครียดระหว่าง [hof.GetTitleAsNameNoTooltip] และข้า [host.Custom2('GetRandomConflictDescriptor', SCOPE.sC('hof'))] และบรรยากาศในพิธีราชาภิเษกก็จะตึงเครียดอย่างมิต้องสงสัย"
 ach_coronation.0010.desc.desc_ending.low_fervor: "ศรัทธา [hof.GetFaith.GetName] เคยเห็นวันที่ดีกว่านี้มาก่อน เปลวไฟแห่งศรัทธาไม่เคยดูริบหรี่และผู้ศรัทธาที่แท้จริงก็หาได้ยากยิ่งนัก เหล่าผู้นมัสการและ [hof.GetTitleAsNameNoTooltip] ต่างก็หวังอย่างมิต้องสงสัยว่าพิธีราชาภิเษกของ [ROOT.Char.Custom2('RelationToMePossessive', SCOPE.sC('host'))|U] จะช่วยพยุงศรัทธาของ [host.GetPrimaryTitle.GetTierAsName]"
 ach_coronation.0010.desc.desc_ending.opinion_good_first_person: "ความสัมพันธ์ระหว่าง [hof.GetTitleAsNameNoTooltip] และข้าเป็นไปอย่างอบอุ่น และผู้คนใน [coronation_site.GetHolding.GetNameNoTooltip] จะเฉลิมฉลองให้แก่เราทั้งสองไปอีกหลายสัปดาห์อย่างมิต้องสงสัย"
 ach_coronation.0010.desc.desc_ending.opinion_good: "ความสัมพันธ์ระหว่าง [hof.GetTitleAsNameNoTooltip] และ [host.GetTitleAsNameNoTooltip] เป็นไปอย่างอบอุ่น และผู้คนใน [coronation_site.GetHolding.GetNameNoTooltip] จะเฉลิมฉลองให้แก่ทั้งสองไปอีกหลายสัปดาห์อย่างมิต้องสงสัย"
 ach_coronation.0010.desc.desc_ending.neutral: "เป็นเรื่องน่าประทับใจที่ [host.GetTitleAsNameNoTooltip] จะได้รับการสวมมงกุฎโดย [hof.GetTitledFirstNameNoTooltip] [hof.GetHerselfHimself] - แต่ไม่ต้องสงสัยเลยว่าราคาที่เรียกร้องจะต้องสูง"
 ach_coronation.0010.desc.desc_ending.neutral_first_person: "ความชอบธรรมของข้าจะมิอาจโต้แย้งได้เมื่อ [hof.GetTitledFirstName] สวมมงกุฎให้ข้า"
 ach_coronation.0010.b: "ช่างเป็นภาพที่น่าประทับใจ!"
 ach_coronation.0010.b.rival: "ชิ! โรคระบาดจงเกิดกับ '[hof.GetTitleAsNameNoTooltip]' นั่น"
 ach_coronation.0010.b.friend: "[hof.GetFirstNameNoTooltip] อยู่ที่นี่รึ? ไชโย!"
 ach_coronation.0010.b.lover: "อืมม ข้าต้องหวังว่า [hof.GetSheHe] จะมีเวลาให้เรา..."
 ach_coronation.0010.b.heretic: "พวกเขาไม่ใช่ [hof.GetTitleAsNameNoTooltip] ของข้า!"
 ach_coronation.0010.b.heathen: "ใครสนกัน?"
 ach_coronation.0010.b.witch: "บางทีตอนนี้อาจถึงเวลาที่ต้องเก็บตัวเงียบ..."
