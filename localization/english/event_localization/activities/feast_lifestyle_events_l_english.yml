l_english: 
 feast_lifestyle.1001.t:2 "วจีสงคราม"
 feast_lifestyle.1001.desc:0 "[strategy_opponent.GetTitledFirstName] คิดว่า [strategy_opponent.GetSheHe] มีสิทธิ์อันใดมากล่าวอ้างว่าแนวคิดการสงครามของข้าพเจ้านั้นผิดพลาด?\n\nอ้างว่าแนวคิดของข้าพเจ้าจะล้มเหลวทันทีที่เข้าสู่การรบ [strategy_opponent.GetSheHe] รู้อะไรกันแน่?"
 feast_lifestyle.1001.a:0 "ข้าพเจ้าอยากมีโอกาสตัดสินเรื่องนี้ในสนามรบ"
 feast_lifestyle.1001.a.tt:2 "อย่างน้อย [strategy_opponent.GetFirstName] ก็แสดงให้ท่านเห็นว่าท่านสามารถปกป้องความเข้าใจใน [martial_lifestyle|E] ของท่านได้"

 feast_lifestyle.1002.t:2 "ความหมายที่ซ่อนเร้น"
 feast_lifestyle.1002.opening:0 "แขกคนอื่นๆ กำลังหัวเราะและพูดคุยกันในห้องโถงที่อึกทึก ทำให้ยากที่จะจดจ่อกับข้าวต้มตรงหน้า ข้าพเจ้าวาดเส้นและแนวปะทะในโคลนเหนียวเหนอะขณะคิดหาวิธีตอบโต้แผนการรบต่างๆ"
 feast_lifestyle.1002.cavalry:0 "\n\n#EMP หากทหารม้าบุกโจมตีปีกนี้...#!"
 feast_lifestyle.1002.heavy_infantry:0 "\n\n#EMP โดยมีทหารราบหนักตรึงกำลังอยู่ที่นี่พอดี...#!"
 feast_lifestyle.1002.archers:0 "\n\n#EMP ขณะที่ห่าฝนธนูตกลงมากลางแนวรบ...#!"
 feast_lifestyle.1002.skirmishers:0 "\n\n#EMP โดยมีพลรบเบาคอยก่อกวนปีกแครอท...#!"
 feast_lifestyle.1002.pikemen:0 "\n\n#EMP แน่นอน พลหอกของข้าพเจ้าสามารถต้านทานอยู่ด้านนี้ได้...#!"
 feast_lifestyle.1002.a:0 "ดูเหมือนว่านี่อาจใช้ได้ผลในสนามรบจริง!"
 feast_lifestyle.1002.a.tt:2 "ใครจะคิดว่าชามข้าวต้มจะช่วยขยายความเข้าใจใน [martial_lifestyle|E] ของท่านได้"

 feast_lifestyle.1003.t:2 "ในกรณีอันตราย"
 feast_lifestyle.1003.desc:0 "ท่ามกลางการเฉลิมฉลอง ข้าพเจ้ากลับสนใจความสามารถในการป้องกันของห้องโถงนี้มากกว่า หากมีการโจมตีจากภายนอกในขณะนี้ ขุนนางชั้นผู้น้อยจะเป็นผู้ที่ตกอยู่ในอันตรายทันที นอกจากนั้น ป้อมปราการเล็กๆ สามารถสร้างขึ้นจากโต๊ะใหญ่ได้ ซึ่งให้การป้องกันได้ในระดับหนึ่ง\n\nทีนี้ เราจะต้องจัดฉากการโต้กลับอย่างไร..."
 feast_lifestyle.1003.a:0 "ท่านไม่มีทางปลอดภัยเกินไป"
 feast_lifestyle.1003.a.tt:2 "ท่านยอมคิดถึงเรื่องเหล่านี้ ดีกว่าใช้ชีวิตอย่างมีความสุขโดยไม่รู้เรื่องรู้ราวเพียงเพื่อจะตายหากวันนั้นมาถึง ท่านเข้าใจ [martial_lifestyle|E] ดีกว่านั้น"
 feast_lifestyle.1003.b:0 "แล้วถ้าการโจมตีมาจากภายในล่ะ?!"
 feast_lifestyle.1003.b.tt:3 "คงเป็นเรื่องโง่เขลาที่จะคิดว่าแขกทุกคนที่นี่จะเป็นสหายร่วมรบของท่าน ท่านเข้าใจ [martial_lifestyle|e] ดีกว่านั้น"

 feast_lifestyle.1004.t:2 "ความรู้ที่แบ่งปัน"
 feast_lifestyle.1004.desc:0 "งานเลี้ยงเป็นโอกาสอันดีที่จะได้พูดคุยกับผู้คนที่ข้าพเจ้าให้ความสำคัญ [consultant_3.GetTitledFirstName] มีความคิดที่น่าสนใจเกี่ยวกับความคล่องตัวทางทหาร ในขณะที่ [consultant_2.GetTitledFirstName] มีความคิดเกี่ยวกับกลยุทธ์การป้องกันแบบใหม่\n\nอย่างไรก็ตาม [consultant_1.GetTitledFirstName] คือผู้ที่มีความคิดอัจฉริยะอย่างแท้จริง หลังจากดื่มไปหลายแก้ว [consultant_1.GetTitledFirstName] บอกข้าพเจ้าเป็นการส่วนตัวถึงสิ่งที่ [consultant_1.GetSheHe] พิจารณาว่าเป็นการบุกโจมตีปราสาทในอุดมคติ!"
 feast_lifestyle.1004.a:0 "ข้าพเจ้าเรียนรู้มากมายในงานเลี้ยงเหล่านี้"
 feast_lifestyle.1004.a.tt:2 "การพูดคุยกับผู้บัญชาการที่มีประสบการณ์ช่วยเพิ่มความเข้าใจใน [martial_lifestyle|E] ของท่านได้อย่างแน่นอน"

 feast_lifestyle.2001.t:2 "รู้ที่ของเจ้าเสียบ้าง"
 feast_lifestyle.2001.mean:0 "ข้าก้าวหลบไปด้านข้างอย่างรวดเร็ว, เกือบจะหลบไวน์ไม่พ้น... ที่ [ROOT.GetCharacter.Custom2('RelationToMe' , SCOPE.sC('guest_victim'))] ของข้า [guest_victim.GetTitledFirstName] ทำหก #EMP โดยบังเอิญ#! ขณะเดินผ่านข้า\n\nข้าปล่อยผ่านการดูถูกครั้งล่าสุดของ [guest_victim.GetHerHis] ไป, เพราะในชั่วขณะนั้น [guest_victim.Custom2('InsultNoun', ROOT.Char)] ก็หน้าซีดและตัวแข็งทื่อ"
 feast_lifestyle.2001.loud:0 ""ทีนี้ ในหัวข้อเรื่องความผิดพลาด ข้าพเจ้าเคยเล่าให้ท่านฟังถึงตอนที่ [ROOT.Char.GetTitledFirstNameNoTooltip]—"\n\n[ROOT.GetCharacter.Custom2('RelationToMe' , SCOPE.sC('guest_victim'))] ของข้าพเจ้า [guest_victim.GetTitledFirstName] ก็เงียบไปทันที ใบหน้าซีดเผือด"
 feast_lifestyle.2001.quiet:0 "สายตาที่ [ROOT.GetCharacter.Custom2('RelationToMe' , SCOPE.sC('guest_victim'))] ของข้า [guest_victim.GetTitledFirstName] ชำเลืองมองข้า ขณะที่ [guest_victim.GetSheHe] กระซิบกับผู้คนรอบตัว [guest_victim.GetHerHim] นั้น ช่างแผดเผาเสียเหลือเกิน\n\nทันใดนั้น หลังของ [guest_victim.Custom2('InsultNoun', ROOT.Char)] ก็แข็งทื่อ, ใบหน้าซีดเผือด"
 feast_lifestyle.2001.desc_ending:0 "ท่าเดินงุ่มง่ามของ [guest_victim.GetHerHis|U] ขณะที่ [guest_victim.GetSheHe] หนีออกจากห้องไป ทำให้ข้าพเจ้ายิ้มออกมาขณะซ่อนขวดยาถ่ายเล็กๆ ไว้ในกระเป๋า"
 feast_lifestyle.2001.a:0 "นั่นจะเป็นบทเรียนให้ [guest_victim.Custom2('InsultAdjective', ROOT.Char)] [guest_victim.Custom2('InsultNoun', ROOT.Char)] นั่น!"

 feast_lifestyle.2002.t:2 "ลิ้นพล่อย"
 feast_lifestyle.2002.desc_lover:0 ""และด้วยดวงตา เช่นนั้น... ข้าพเจ้าหมายถึง ข้าพเจ้าจะต้านทานได้อย่างไร?""
 feast_lifestyle.2002.desc_cannibal:0 ""ท่านสามารถบอกได้แม้กระทั่งว่าพวกเขากำยำในชีวิตหรือไม่จากเนื้อสัมผัส ข้าพเจ้าจำทหารคนหนึ่งที่ข้าพเจ้าเคยกินได้—""
 feast_lifestyle.2002.desc_homosexual_male:0 ""แล้วข้าพเจ้าก็เห็นเขายิ้ม! ใครจะคิดว่าข้าพเจ้าควรจะพอใจกับผู้หญิงหลังจากนั้น...""
 feast_lifestyle.2002.desc_homosexual_female:0 ""แล้วข้าพเจ้าก็เห็นเธอยิ้ม! ใครจะคิดว่าข้าพเจ้าควรจะพอใจกับผู้ชายหลังจากนั้น...""
 feast_lifestyle.2002.desc_ending:0 "\n\nหลังจากดื่มไปหลายแก้ว [ROOT.GetCharacter.Custom2('RelationToMe' , SCOPE.sC('guest_with_secret'))] ของข้าพเจ้า [guest_with_secret.GetTitledFirstName] ก็เอนตัวพิงโต๊ะของเรา พรั่งพรูทั้งหัวใจและเครื่องดื่มออกมาต่อหน้าข้าพเจ้า\n\n"นำเครื่องดื่มทั้งหมดนี้มาให้ข้าพเจ้า และรับฟังข้าพเจ้าพูดพล่ามไม่หยุด... ขอบคุณท่าน [ROOT.Char.GetFirstNameNoTooltip]!""
 feast_lifestyle.2002.a:0 "นี่มันดีเกินกว่าจะเก็บไว้คนเดียว!"
 feast_lifestyle.2002.b:0 "ไม่ ขอบคุณ #EMP ท่าน#! ต่างหากที่เปิดเผยเรื่องนี้!"
 feast_lifestyle.2002.c:0 "ความเงียบของข้าพเจ้าย่อมมีราคา ท่านรู้หรือไม่"
 feast_lifestyle.2002.d:0 "ไชโย! สำหรับค่ำคืนอันน่ารื่นรมย์และสหายร่วมดื่มคนใหม่!"

 feast_lifestyle.2003.t:2 "พลังแห่งการโน้มน้าว"
 feast_lifestyle.2003.desc:0 "ไหลลื่นจากบทสนทนาหนึ่งไปยังอีกบทสนทนาหนึ่ง ข้าพเจ้าชี้นำการสนทนาไปในทิศทางใดก็ได้ตามที่ปรารถนา\n\nด้วยคำพูดที่วางไว้อย่างระมัดระวังเพียงไม่กี่คำ ข้าพเจ้าก็มีความเข้าใจอย่างลึกซึ้งเกี่ยวกับชีวิตรักของ [ROOT.GetCharacter.Custom2('RelationToMe' , SCOPE.sC('courtier_to_persuade'))] ของข้าพเจ้า [courtier_to_persuade.GetTitledFirstNamePossessive] มากกว่าที่แม้ แต่ [courtier_to_persuade.Custom('WifeHusbandOpp')] ของ [courtier_to_persuade.GetHerHis] จะปรารถนาเสียอีก"
 feast_lifestyle.2003.a:0 "งานเลี้ยงคือสนามฝึกของข้าพเจ้า..."
 feast_lifestyle.2003.a.tt:0 "#F ...และคำพูดคืออาวุธของข้าพเจ้า!#!"
 feast_lifestyle.2003.b:0 "ให้เราเพลิดเพลินกับการสนทนาเถิด"

 feast_lifestyle.2004.t:2 "เรื่องราวโดยละเอียด"
 feast_lifestyle.2004.desc1_a:1 "[ROOT.Char.Custom('RandomLadyLord')] ผู้นั้นที่อยู่ตรงนั้นกำลังยิ้มให้สาวใช้คนหนึ่งข้ามห้องโถงด้วยความคุ้นเคยสนิทสนม อาจเป็นชู้กัน"
 feast_lifestyle.2004.desc1_b:1 "[ROOT.Char.Custom('RandomLadyLord')] ผู้นั้นที่อยู่ตรงนั้นกำลังเติมแก้วที่กำแน่นเป็นครั้งที่สามนับตั้งแต่คู่สมรสของพวกเขามาร่วมวง ความสัมพันธ์ที่ใกล้จะพังทลาย"
 feast_lifestyle.2004.desc2_a:1 "[ROOT.Char.Custom('RandomLadyLord')] ผู้นั้นที่อยู่อีกฟากของห้องโถงสวมรองเท้าบูทคู่เดียวกับปีที่แล้ว ปัญหาทางการเงิน"
 feast_lifestyle.2004.desc2_b:1 "[ROOT.Char.Custom('RandomLadyLord')] ผู้นั้นที่อยู่อีกฟากของห้องโถงอยู่ติดกำแพง หลีกเลี่ยงการสนทนาทั้งหมด รวมถึงการสบตา มีความลับที่ต้องเก็บรักษาไว้หรือไม่?"
 feast_lifestyle.2004.desc_ending:0 "\n\nทุกคนต่างซ่อนบางสิ่งบางอย่างไว้ และด้วยสายตาที่ฝึกฝนมา แม้ แต่รายละเอียดที่เล็กที่สุดก็จะแสดงให้ท่านเห็นภาพรวมทั้งหมด"
 feast_lifestyle.2004.a:1 "พวกเขาสวมใส่ความอัปยศของตนอย่างเปิดเผย!"
 feast_lifestyle.2004.b:0 "ไม่มีสิ่งใดรอดพ้นสายตาข้าพเจ้าไปได้!"

 feast_lifestyle.3001.t:2 "ที่นั่งแห่งอำนาจ"
 feast_lifestyle.3001.desc:0 "ช่างเป็นงานเลี้ยงที่ยอดเยี่ยม! เป็นโอกาสอันดีเยี่ยมสำหรับทั้ง [ROOT.Char.Custom2('RelationToMe' , SCOPE.sC('important_guest_1'))] ของข้าพเจ้า [important_guest_1.GetTitledFirstName] และตัวข้าพเจ้าเองที่จะเรียนรู้เพิ่มเติมเกี่ยวกับผู้คนที่รับใช้เรา\n\nทั้ง [ROOT.Char.Custom2('RelationToMe' , SCOPE.sC('important_guest_2'))] ของข้าพเจ้า [important_guest_2.GetTitledFirstName] และ [ROOT.Char.Custom2('RelationToMe' , SCOPE.sC('important_guest_3'))] ของข้าพเจ้า [important_guest_3.GetTitledFirstName] ยังไม่ได้นั่งลง และข้าพเจ้ารีบเรียกคนรับใช้มาจัดที่นั่งใหม่"
 feast_lifestyle.3001.a:0 "[important_guest_1.GetFirstNameNoTooltip] ควรนั่งข้าง [important_guest_2.GetTitledFirstNameNoTooltip]"
 feast_lifestyle.3001.b:0 "[important_guest_1.GetFirstNameNoTooltip] คงจะเพลิดเพลินกับความเป็นเพื่อนของ [important_guest_3.GetTitledFirstNamePossessiveNoTooltip]"
 feast_lifestyle.3001.c:0 "พวกเขาทั้งสองจะรับประทานอาหารกับข้าพเจ้า"
