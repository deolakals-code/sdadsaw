 activity_hunt_desc_regular: "การไล่ล่ามอบความตื่นเต้นและอันตรายอย่างเหลือล้น และช่วยเป็นพื้นฐานที่มั่นคงในการขี่ม้าและยิงธนู\n\nการล่าสัตว์อยู่ภายใต้การดูแลของ [GetCourtPositionType('master_of_hunt_court_position').GetName()] ผู้ ซึ่งจะประกาศ [hunt_sightings_no_prefix|E] ของสัตว์ทั่วไป สัตว์หายาก และสัตว์ดุร้าย"
 activity_hunt_desc_adventurer: "การไล่ล่ามอบความตื่นเต้นและอันตรายอย่างเหลือล้น และช่วยเป็นพื้นฐานที่มั่นคงในการขี่ม้าและยิงธนู\n\nในฐานะ [GetGovernment('landless_adventurer_government').GetName] การล่าสัตว์จะให้ [prestige_i][prestige|E] น้อยลง แต่ให้ [provisions_i][provisions|E] การล่าสัตว์อยู่ภายใต้การดูแลของ [GetCourtPositionType('huntperson_camp_officer').GetName()]\n\nเมื่อเริ่มการล่าสัตว์ ท่านจะมีโอกาสซื้อสิทธิ์ในการล่าสัตว์ด้วย [gold_i][gold|E] มิฉะนั้น ท่านจะได้รับ [trait_level_track_xp|E] [GetTrait('gallowsbait').GetName( GetNullCharacter )] [GetTrait( 'gallowsbait' ).GetTraitTrackByKey( 'poacher' ).GetName]"
 activity_hunt_owner:0 "นักล่า"
