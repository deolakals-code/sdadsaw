 #Gruesome Festival (Blót)
 activity_gruesome_festival:2 "$tenet_gruesome_festivals_blot_name$"
 activity_gruesome_festival_selection_tooltip:0 "ท่านเชิญเหล่าผู้อยู่ใต้ปกครองให้เข้าร่วมในพิธีกรรมอันศักดิ์สิทธิ์และมีค่าใช้จ่ายสูง"
 activity_gruesome_festival_desc:0 "ถึงเวลาแล้วที่ทุกคนใน [GetPlayer.GetPrimaryTitle.GetNameNoTierNoTooltip] จะมารวมตัวกันเพื่อบูชายัญแด่ [GetPlayer.GetFaith.PantheonTerm] พิธีกรรมเหล่านี้ไม่เพียง แต่ผูกพันผู้ศรัทธาเข้าด้วยกัน แต่ยังยืนยันตำแหน่งของข้าในฐานะ [GetPlayer.GetTitleAsNameNoTooltip] แห่งดินแดนทั้งหมด"
 activity_gruesome_festival_owner:0 "เจ้าภาพ"
 activity_gruesome_festival_host_desc:1 "\nท่านจัด $gruesomefestivalname_blot$ ซึ่งเกี่ยวข้องกับ:\n#indent_newline:0 $EFFECT_LIST_BULLET$ การตัดสินใจขนาดของเทศกาล\n#indent_newline:0 $EFFECT_LIST_BULLET$ การเลือกสิ่งที่จะบูชายัญ แม้กระทั่งเลือกหนึ่งใน [prisoners|E] ของท่านเป็น [designate_chief_sacrifice_chief_sacrifice|E]\n#indent_newline:0 $EFFECT_LIST_BULLET$ การได้รับหรือสูญเสีย [county_opinion|E] และ [opinion|E] ของ [character|E] ขึ้นอยู่กับ [core_tenets|E] ของ [faith|E] ของผู้อยู่ใต้ปกครองของท่าน"
 activity_gruesome_festival_guest_help_text:0 "[guests|E] ที่ได้รับเชิญจะเข้าร่วมในการบูชายัญและงานเลี้ยงหลังจากนั้น พวกเขาจะได้รับหรือสูญเสีย [opinion|E] ต่อท่าน ขึ้นอยู่กับ [core_tenets|E] ของ [faith|E] ของพวกเขา"
 activity_gruesome_festival_province_desc:1 "$gruesome_festival_size_small_desc$"
 activity_gruesome_festival_fallback_name:0 "พิธีบูชายัญ"
 activity_gruesome_festival_desc.non_gf_practioner:0 "มีคนในหมู่ผู้อยู่ใต้ปกครองของข้าที่ประกอบพิธีบูชายัญอันยิ่งใหญ่ ซึ่งได้รับพรจาก [GetPlayer.GetTitleAsNameNoTooltip] ของพวกเขา การตกลงที่จะดำเนินการแม้เพียงรูปแบบที่จำกัดย่อมจะ ทำให้ข้าได้รับการยอมรับจากพวกเขาอย่างไม่ต้องสงสัย แม้ว่าการยอมรับประเพณีที่... ป่าเถื่อนกว่าของพวกเขาอาจ ทำให้ข้าถูกดูหมิ่นจากผู้ที่รังเกียจวิถีทางของพวกเขาก็ตาม"


