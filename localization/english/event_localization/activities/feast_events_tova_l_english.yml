l_english: 
 feast_events_tova.0001.t: "สิ่งมหัศจรรย์แห่งยุคสมัย"
 feast_events_tova.0001.desc: "แขกของข้าเคลื่อนไหวราวกับตกอยู่ในภวังค์ฝันกลางวัน, เคลิบเคลิ้มไปกับโดมที่อาบแสงตะวันและน้ำพุอันงดงามของวังข้า กลิ่นธูปหอมอบอวลของสวนลอยอบอวลในอากาศ และส่งผลอันน่าพึงพอใจอย่างยิ่งต่อหัวใจและจิตวิญญาณของผู้ที่ได้สัมผัส \n\n"[ROOT.Char.Custom('FormOfAddressForLiege')|U], ท่านช่างเหนือชั้นจริง ๆ กับสถานที่แห่งนี้! ฝีมืองานช่างของสถาปนิกของท่านเปล่งประกายในทุกรายละเอียด" [honorary_guest.GetTitledFirstName] เอ่ย, และเสียงพึมพำแสดงความเห็นชอบก็ดังระงมไปทั่วฝูงชนที่อยู่รอบตัวเขา \n\nแขกทุกคนที่อยู่ณ ที่นั้นหันมามองข้าอย่างคาดหวัง, ราวกับกำลังรอให้ข้ากล่าวอะไรบางอย่างเกี่ยวกับวังแห่งนี้"
 feast_events_tova.0001.a: "สถานที่อันคู่ควรแก่การต้อนรับเหล่านักรบผู้ยิ่งใหญ่อย่างเรา!"
 feast_events_tova.0001.b: "ให้ข้านำท่านชมเถิด [honorary_guest.GetTitledFirstNameNoTooltip]"
 feast_events_tova.0001.b.success: "การแสดงความโอ่อ่าของท่านสร้างความประทับใจให้ [honorary_guest.GetTitledFirstNameNoTooltip] อย่างยิ่ง"
 feast_events_tova.0001.b.failure: "พระราชวังของท่านสร้างความประทับใจให้ [honorary_guest.GetTitledFirstNameNoTooltip] แต่คำโอ้อวดของท่านกลับไม่เป็นที่สนใจ"
 feast_events_tova.0001.c: "แท้จริงแล้ว นี่คือเครื่องพิสูจน์อันยิ่งใหญ่ถึงการปกครองของข้า"
