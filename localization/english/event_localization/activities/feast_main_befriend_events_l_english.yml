l_english: 
 #Host Main Event
 feast_main_befriend.1001.t:2 "โต๊ะประธานพังทลาย"
 feast_main_befriend.1001.opening:1 "โต๊ะใหญ่สำหรับเหล่าขุนนางชั้นสูงบนแท่นยกพื้นส่งเสียงดังลั่น และครู่ต่อมาก็พังลงภายใต้น้ำหนักของอาหารและเครื่องประดับปิดทอง!\n\n"
 feast_main_befriend.1001.getting_close:1 "เมื่อแขกผู้ทรงเกียรติที่สุดของข้าและตัวข้าต้องไปนั่งรวมกับเหล่าขุนนางชั้นผู้น้อย ข้าจึงได้ใกล้ชิดกับ [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('potential_friend'))] ของข้า, [potential_friend.GetTitledFirstName]!"
 feast_main_befriend.1001.arrogant_guest:0 "ทว่า [arrogant_guest.GetTitledFirstName] กลับไม่พอใจอย่างยิ่ง และบอกทุกคนว่ามันเป็นความอยุติธรรมอย่างร้ายแรงที่ต้องมานั่งร่วมกับเหล่าลอร์ดและเลดี้ที่แทบไม่ต่างจากสามัญชน"
 feast_main_befriend.1001.arrogant_kind_link:0 "ในทางตรงกันข้าม,"
 feast_main_befriend.1001.kind_to_lower_nobility:0 "[kind_to_lower_nobility.GetTitledFirstName] แสดงความสง่างามและความอ่อนน้อมถ่อมตนท่ามกลางผู้ที่ด้อยกว่า [kind_to_lower_nobility.GetHerHis]"
 feast_main_befriend.1001.really_hungry:0 "[kind_to_lower_nobility.GetSheHe|U] บอกกับแขกที่หิวโหยที่สุดอยู่เสมอว่าพวกเขาควรไปเยี่ยมบ้านของ [kind_to_lower_nobility.GetHerHis] โดยเร็วที่สุด"
 feast_main_befriend.1001.no_kind_target:0 "ขณะที่ขุนนางชั้นสูงปะปนกับผู้ที่ด้อยกว่า วาจาทั้งที่เป็นมิตรและเป็นศัตรูก็ถูกแลกเปลี่ยนกันในหมู่ผู้คนที่ปกติไม่ค่อยสมาคมกัน"
 feast_main_befriend.1001.friendship:0 "\n\n[potential_friend.GetFirstNameNoTooltip] และข้าลงเอยด้วยการพูดคุยกันตลอดทั้งเย็น และเห็นพ้องกันว่านี่ไม่ควรเป็นครั้งสุดท้ายที่เราจะร่วมงานเลี้ยงและหัวเราะด้วยกัน!"
 feast_main_befriend.1001.a:0 "ช่างเป็นค่ำคืนที่ยอดเยี่ยม!"
 #Potential Friend Main Event
 feast_main_befriend.2001.t:2 "โต๊ะประธานพังทลาย"
 feast_main_befriend.2001.opening:1 "$feast_main_befriend.1001.opening$"
 feast_main_befriend.2001.getting_close:0 "สิ่งที่อาจกลายเป็นหายนะกลับกลายเป็นพรในคราบเคราะห์ร้าย เมื่อข้าได้ใกล้ชิดกับเจ้าภาพของเรา, [activity.GetOwner.GetTitledFirstName]!"
 feast_main_befriend.2001.arrogant_guest:0 "ทว่า [arrogant_guest.GetTitledFirstName] กลับไม่พอใจกับที่นั่งใหม่ของ [arrogant_guest.GetHerHis] อย่างยิ่ง และบอกทุกคนว่ามันเป็นความอยุติธรรมอย่างร้ายแรงที่ต้องมานั่งร่วมกับผู้คนที่แทบไม่ต่างจากสามัญชน"
 feast_main_befriend.2001.arrogant_kind_link:0 "ในทางตรงกันข้าม,"
 feast_main_befriend.2001.kind_to_lower_nobility:0 "[kind_to_lower_nobility.GetTitledFirstName] แสดงความสง่างามและความอ่อนน้อมถ่อมตนท่ามกลางผู้ที่ด้อยกว่า [kind_to_lower_nobility.GetHerHis]"
 feast_main_befriend.2001.really_hungry:0 "[kind_to_lower_nobility.GetFirstName] บอกกับแขกอยู่เสมอว่า [kind_to_lower_nobility.GetSheHe] พยายามมีเมตตาต่อผู้คนที่หิวโหยเกือบเท่า [kind_to_lower_nobility.GetSheHe] เสมอ"
 feast_main_befriend.2001.no_kind_target:0 "\n\nขณะที่ขุนนางชั้นสูงปะปนกับผู้ที่ด้อยกว่า วาจาทั้งที่เป็นมิตรและเป็นศัตรูก็ถูกแลกเปลี่ยนกันในหมู่ผู้คนที่ปกติไม่ค่อยสมาคมกันมากนัก"
 feast_main_befriend.2001.friendship:0 "\n\nจากที่นั่งของข้าที่โต๊ะชั้นล่าง งานเลี้ยงถือว่าประสบความสำเร็จ ไม่น้อยไปกว่าการที่ [activity.GetOwner.GetFirstNameNoTooltip] เห็นพ้องว่านี่ไม่ควรเป็นครั้งสุดท้ายที่เราจะนั่งลงร่วมงานเลี้ยง พูดคุย และหัวเราะด้วยกัน"
 feast_main_befriend.2001.a:0 "ช่างเป็นยามเย็นที่ยอดเยี่ยม!"
 #Arrogant Guest Main Event
 feast_main_befriend.2002.t:2 "โต๊ะประธานพังทลาย"
 feast_main_befriend.2002.arrogant_guest:1 "ข้าไม่อยากจะเชื่อเลยเมื่อขุนนางชั้นสูงทั้งหมดถูกย้ายจากแท่นยกพื้นลงมายังพื้นห้องโถงท่ามกลางเหล่าบารอนและ $knight_culture_player_plural_no_tooltip_lowercase$ [activity.GetOwner.GetTitledFirstName] เห็นข้าเป็นอะไรกัน? แค่สามัญชนคนหนึ่งงั้นรึ?! ข้าบอกความรู้สึกของข้าให้ผู้คนจำนวนมากที่สุดเท่าที่จะทำได้รู้ โดยเฉพาะอย่างยิ่งพวกขุนนางจอมปลอมรอบตัวข้า!"
 feast_main_befriend.2002.disgusted_by_kindness:0 "\n\nราวกับเป็นการตอกย้ำความเจ็บปวดของข้า [kind_to_lower_nobility.GetTitledFirstName] ได้รับคำชื่นชมตลอดทั้งคืนว่าเป็นผู้ \"มีเมตตา\" และ \"อ่อนน้อมถ่อมตน\" ท่ามกลางคนเหล่านี้ [kind_to_lower_nobility.GetSheHe] ไม่มีความเคารพในตนเองเลยหรือ?"
 feast_main_befriend.2002.a:0 "เปรียบข้ากับชาวนาเสียยังดีกว่า"
 feast_main_befriend.2002.because_of_hospitality_tenet:1 "เนื่องจาก [faith|E] ของท่านควรให้เกียรติแขก:"
 #Kind to Nobility Main Event
 feast_main_befriend.2003.t:2 "โต๊ะประธานพังทลาย"
 feast_main_befriend.2003.opening:0 "โต๊ะประธานสำหรับเหล่าขุนนางชั้นสูงบนแท่นยกพื้นส่งเสียงดังลั่น และครู่ต่อมาก็พังลงภายใต้น้ำหนักของอาหารและเครื่องประดับปิดทอง! พวกเราทั้งหมดต้องย้ายลงไปอยู่ท่ามกลางขุนนางชั้นผู้น้อยบนพื้นห้องโถงใหญ่"
 feast_main_befriend.2003.arrogant_guest:0 "\n\n[arrogant_guest.GetTitledFirstName] ไม่พอใจกับที่นั่งใหม่ของ [arrogant_guest.GetHerHis] อย่างยิ่ง และบอกทุกคนว่ามันเป็นความอยุติธรรมอย่างร้ายแรงที่ต้องมานั่งร่วมกับเหล่าลอร์ดและเลดี้ที่แทบไม่ต่างจากสามัญชน"
 feast_main_befriend.2003.kind_to_glutton:0 "\n\nในทางกลับกัน ข้าให้ความสนใจเป็นพิเศษกับ [glutton_target.GetTitledFirstName] และความอยากอาหารอันตะกละตะกลามของ [glutton_target.GetHerHis] [glutton_target.GetSheHe|U] ฉีกเนื้ออย่างตะกละตะกลาม น้ำจากเนื้อไหลลงมาตามแก้มของ [glutton_target.GetHerHis] ขณะที่ความหิวโหยอันไม่อาจสนองได้ที่ข้ารู้จักดีเริ่มส่งเสียงครืดคราดในท้องของข้า ขณะที่ข้าส่งอาหารให้ [glutton_target.GetHerHim] อย่างต่อเนื่อง"
 feast_main_befriend.2003.cannibal_kindness:1 "\n\nจากที่นั่งใหม่ของข้า ข้ามองดูเหล่าบารอนและ $knight_culture_player_plural_no_tooltip_lowercase$ ยัดอาหารเข้าปากที่อ้ากว้างของพวกเขามากขึ้นเรื่อยๆ และเมื่อความหิวโหยก่อตัวขึ้นในตัวข้า ข้าเสนอที่จะเช็ดไขมันออกจากคางของใครบางคน เพียงเพื่อจะได้สัมผัสลำคออันอ่อนนุ่มและอวบอิ่มนั้น..."
 feast_main_befriend.2003.kind_to_lower_nobility:1 "\n\nข้ามองไปยังเหล่าลอร์ด เลดี้ และ $knight_culture_player_plural_no_tooltip_lowercase$ โดยปราศจากการดูถูกเหยียดหยาม เมื่อได้พูดคุยกับพวกเขา ข้าพบว่าพวกเขามีความกังวล ปัญหา และความสุขหลายอย่าง เช่นเดียวกับข้าในตำแหน่งที่สูงส่งกว่า เมื่อค่ำคืนดำเนินไป ข้าแบ่งปันอาหารจากจานของข้า และเล่าเรื่องราวของข้าเองเพื่อเป็นการตอบแทน"
 feast_main_befriend.2003.ending:0 "\n\nต่อมา [activity.GetOwner.GetTitledFirstName] บอกข้าว่าแขกทุกคนสังเกตเห็นความอ่อนน้อมถ่อมตนและความเมตตาที่ข้าแสดงออกท่ามกลางผู้ที่ด้อยกว่า"
 feast_main_befriend.2003.a:0 "ข้ายินดีที่ได้พบปะผู้คนเหล่านี้"
 #Glutton Target Main Event
 feast_main_befriend.2004.t:2 "โต๊ะประธานพังทลาย"
 feast_main_befriend.2004.arrogant_guest:0 "\n\n[arrogant_guest.GetTitledFirstName] ไม่พอใจกับที่นั่งใหม่ของ [arrogant_guest.GetHerHis] อย่างยิ่ง และบอกทุกคนว่ามันเป็นความอยุติธรรมอย่างร้ายแรงที่ต้องมานั่งร่วมกับเหล่าลอร์ดและเลดี้ที่แทบไม่ต่างจากสามัญชน"
 feast_main_befriend.2004.kindness_from_other:0 "\n\nอย่างไรก็ตาม ข้าโชคดีที่ได้นั่งข้าง [kind_to_lower_nobility.GetTitledFirstName] และเราพูดคุยเกี่ยวกับความสุขของอาหารและการกินเป็นเวลาหลายชั่วโมง ตราบเท่าที่ข้าไม่ได้กำลังยัดเนื้อลงคอหอยของข้า แน่นอน! ข้าบอกได้เลยว่า [kind_to_lower_nobility.GetFirstName] หิวมากขึ้นเพียงแค่มองดูข้า!"
 feast_main_befriend.2004.a:0 "ทุกอย่างลงเอยด้วยดี"
 #General Guest Main Event
 feast_main_befriend.3001.t:2 "โต๊ะประธานพังทลาย"
 feast_main_befriend.3001.arrogant_guest:0 "\n\n[arrogant_guest.GetTitledFirstName] ไม่พอใจกับที่นั่งใหม่ของ [arrogant_guest.GetHerHis] อย่างยิ่ง และบอกทุกคนว่ามันเป็นความอยุติธรรมอย่างร้ายแรงที่ต้องมานั่งร่วมกับเหล่าลอร์ดและเลดี้ที่แทบไม่ต่างจากสามัญชน"
 feast_main_befriend.3001.kind_to_lower_nobility:0 "\n\n[kind_to_lower_nobility.GetTitledFirstName] แสดงความสง่างามและความอ่อนน้อมถ่อมตนท่ามกลางผู้ที่ด้อยกว่า [kind_to_lower_nobility.GetHerHis] การปฏิบัติตนของ [kind_to_lower_nobility.GetHerHis|U] เป็นสิ่งที่พวกเราทุกคนสามารถใฝ่ฝันถึงได้"
 feast_main_befriend.3001.really_hungry:0 "[kind_to_lower_nobility.GetSheHe|U] ยังเสนออาหารของ [kind_to_lower_nobility.GetHerHis] ให้ผู้อื่น โดยอวยพรให้พวกเขามีสุขภาพดีและร่างกายแข็งแรง"
 feast_main_befriend.3001.ending:0 "\n\nขณะที่ขุนนางชั้นสูงปะปนกับผู้ที่ด้อยกว่า วาจาทั้งที่เป็นมิตรและเป็นศัตรูก็ถูกแลกเปลี่ยนกันในหมู่ผู้คนที่ปกติไม่ค่อยสมาคมกันมากนัก"
 feast_main_befriend.3001.a:0 "ข้ารู้สึกว่าข้าได้เรียนรู้บางอย่าง"
 #Host End Event
 feast_main_befriend.5002.t:2 "มิตรภาพ"
 feast_main_befriend.5002.desc:0 "ขณะที่แขกของข้าจากไป ดูเหมือนพวกเขาจะจากไปด้วยอารมณ์ที่ดี ข้ายังโล่งใจที่เห็นว่า [potential_friend.GetTitledFirstName] ไม่จากไปโดยไม่กล่าวคำอำลา\n\nเราทั้งคู่รู้ว่าเราจะได้พบกันอีกในไม่ช้า"
 feast_main_befriend.5002.a:0 "ช่างเป็น [potential_friend.GetWomanMan] ที่ดี"
 #Potential Friend End Event
 feast_main_befriend.5003.t:2 "มิตรภาพ"
 feast_main_befriend.5003.desc:0 "ก่อนที่ข้าจะออกจากงานเลี้ยง ข้าต้องบอก [host_saying_goodbye.GetTitledFirstName] ว่าข้ามีช่วงเวลาที่ดีเพียงใด [host_saying_goodbye.GetSheHe|U] บอกให้ข้าลุกขึ้นจากการคุกเข่า และวางมืออันน่าไว้วางใจลงบนไหล่ของข้า\n\nข้าไม่เชื่อว่ามันจะนานนักก่อนที่เราจะได้พบกันอีก"
 feast_main_befriend.5003.a:0 "นี่เป็นสิ่งที่พิเศษ"
 #General Guest End Event
 feast_main_befriend.5004.t:2 "อุบัติเหตุที่น่าจดจำ"
 feast_main_befriend.5004.desc:0 "ขณะที่ข้าเตรียมตัวจากไปพร้อมกับแขกคนอื่นๆ ข้าอดไม่ได้ที่จะมองย้อนกลับไปในช่วงสองสามวันที่ผ่านมาด้วยรอยยิ้ม\n\nมันกลายเป็นงานเลี้ยงที่ยอดเยี่ยม และการคลุกคลีกับแขกต่างยศศักดิ์ของข้ายัง ทำให้ข้าได้มุมมองใหม่ๆ อีกด้วย"
 feast_main_befriend.5004.a:1 "ไว้พบกันใหม่, [ROOT.Char.Custom2('RelationToMe', activity.GetOwner)] ของข้า!"
