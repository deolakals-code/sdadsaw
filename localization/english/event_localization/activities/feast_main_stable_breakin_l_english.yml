l_english: 
 feast_main_stable_breakin.0002.t:2 "บุกคอกม้า"
 feast_main_stable_breakin.0002.breakin_with_helper:0 "เมื่อการกินดื่มดำเนินไปจนได้ที่ [breakin_stager.GetTitledFirstName] ก็ตัดสินใจว่าถึงเวลาขี่ม้าเล่นกันแล้ว คอกม้าถูกปิดล็อคอย่างแน่นหนา แต่ด้วยคำแนะนำจาก [breakin_helper.GetTitledFirstName] [breakin_stager.GetFirstName] ก็ได้นำกลุ่มผู้ที่กระตือรือร้นจะขี่ม้าเข้าไปข้างในในไม่ช้า\n\nเมื่อไม่อาจควบคุมสัตว์เหล่านั้นได้ ก็มีทั้งเสียงสบถ เสียงหัวเราะ และกระดูกหัก ขณะที่บุรุษและสตรีร่วงหล่นจากหลังม้าที่เดินตุปัดตุเป่อยู่ในโถง!"
 feast_main_stable_breakin.0002.breakin_with_deviant:0 "เมื่อการกินดื่มดำเนินไปจนได้ที่ [breakin_stager.GetTitledFirstName] ก็ตัดสินใจว่าถึงเวลาขี่ม้าเล่นกันแล้ว คอกม้าถูกปิดล็อคอย่างแน่นหนา แต่ด้วยคำแนะนำจาก [breakin_deviant.GetTitledFirstName] [breakin_stager.GetFirstName] ก็ได้นำกลุ่มผู้ที่กระตือรือร้นจะขี่ม้าเข้าไปข้างในในไม่ช้า\n\nเมื่อไม่อาจควบคุมสัตว์เหล่านั้นได้เลย ก็มีทั้งเสียงสบถ เสียงหัวเราะ และกระดูกหัก ขณะที่บุรุษและสตรีร่วงหล่นจากหลังม้าที่เดินตุปัดตุเป่อยู่ในโถง!"
 feast_main_stable_breakin.0002.breakin_with_noone:0 "เมื่อการกินดื่มดำเนินไปจนได้ที่ [breakin_stager.GetTitledFirstName] ก็ตัดสินใจว่าถึงเวลาขี่ม้าเล่นกันแล้ว คอกม้าถูกปิดล็อคอย่างแน่นหนา แต่ [breakin_stager.GetFirstName] ไม่ทราบด้วยวิธีใดจึงสามารถนำกลุ่มผู้ที่กระตือรือร้นจะขี่ม้าเข้าไปข้างในได้\n\nเมื่อไม่อาจควบคุมสัตว์เหล่านั้นได้เลย ก็มีทั้งเสียงสบถ เสียงหัวเราะ และกระดูกหัก ขณะที่บุรุษและสตรีร่วงหล่นจากหลังม้าที่เดินตุปัดตุเป่อยู่ในโถง!"
 feast_main_stable_breakin.0002.bystander_riding:0 "\n\nสัตว์อื่น ๆ ในคอกม้าก็มิได้รอดพ้นไปง่ายกว่านัก และแพะตัวหนึ่งเกือบจะหลังหักด้วยน้ำหนักของ [breakin_bystander.GetTitledFirstName]"
 feast_main_stable_breakin.0002.deviant_discovered:0 "\n\nอย่างไรก็ตาม ค่ำคืนนั้นกลับพลิกผัน เมื่อ [breakin_deviant.GetTitledFirstName] ถูกพบที่ด้านหลังของคอกม้า กำลังกระทำการอันมิอาจเอ่ยถึงกับวัวตัวผู้ตัวหนึ่ง! ตราประทับแห่งความอัปยศนี้จะไม่มีวันจางหายไปจากจิตวิญญาณของ[breakin_deviant.GetHerHis]"
 feast_main_stable_breakin.0002.what_a_silly_bunch:0 "\n\nในท้ายที่สุด เหล่าคนเลี้ยงม้าก็สามารถควบคุมสัตว์ที่ตื่นตระหนกเหล่านั้นได้ และอย่างน้อย พวกเราที่มีสติสัมปชัญญะก็ได้ชมการแสดงอันน่าตื่นตาตื่นใจ!"
 feast_main_stable_breakin.0002.a:0 "ช่างเป็นกลุ่มคนโง่ที่น่าบันเทิงใจเสียนี่กระไร"
 feast_main_stable_breakin.0002.b:0 "โอ้ ไม่นะ เจ้าสัตว์น่าสงสารตัวนั้น!"
 feast_main_stable_breakin.0002.secret_of_my_own:0 "ช่างเป็นเรื่องที่เลวร้าย... เลวร้ายอะไร เช่นนี้..."
 feast_main_stable_breakin.0003.t:2 "$feast_main_stable_breakin.0002.t$"
 feast_main_stable_breakin.0003.breakin_with_helper:1 "เมื่อการกินดื่มดำเนินไปจนได้ที่ [breakin_stager.GetTitledFirstName] ก็ตัดสินใจว่าถึงเวลาขี่ม้าเล่นกันแล้ว คอกม้าของข้าถูกปิดล็อคอย่างแน่นหนา แต่ด้วยคำแนะนำจาก [breakin_helper.GetTitledFirstName] [breakin_stager.GetFirstName] ก็ได้นำกลุ่มผู้ที่กระตือรือร้นจะขี่ม้าเข้าไปข้างในในไม่ช้า\n\nเมื่อไม่อาจควบคุมสัตว์ของข้าได้เลย ก็มีทั้งเสียงสบถ เสียงหัวเราะ และกระดูกหัก ขณะที่บุรุษและสตรีร่วงหล่นจากหลังม้าที่เดินตุปัดตุเป่อยู่ในโถง!"
 feast_main_stable_breakin.0003.breakin_with_deviant:1 "เมื่อการกินดื่มดำเนินไปจนได้ที่ [breakin_stager.GetTitledFirstName] ก็ตัดสินใจว่าถึงเวลาขี่ม้าเล่นกันแล้ว คอกม้าของข้าถูกปิดล็อคอย่างแน่นหนา แต่ด้วยคำแนะนำจาก [breakin_deviant.GetTitledFirstName] [breakin_stager.GetFirstName] ก็ได้นำกลุ่มผู้ที่กระตือรือร้นจะขี่ม้าเข้าไปข้างในในไม่ช้า\n\nเมื่อไม่อาจควบคุมสัตว์ของข้าได้เลย ก็มีทั้งเสียงสบถ เสียงหัวเราะ และกระดูกหัก ขณะที่บุรุษและสตรีร่วงหล่นจากหลังม้าที่เดินตุปัดตุเป่อยู่ในโถง!"
 feast_main_stable_breakin.0003.breakin_with_noone:1 "เมื่อการกินดื่มดำเนินไปจนได้ที่ [breakin_stager.GetTitledFirstName] ก็ตัดสินใจว่าถึงเวลาขี่ม้าเล่นกันแล้ว คอกม้าของข้าถูกปิดล็อคอย่างแน่นหนา แต่ [breakin_stager.GetFirstName] ไม่ทราบด้วยวิธีใดจึงสามารถนำกลุ่มผู้ที่กระตือรือร้นจะขี่ม้าเข้าไปข้างในได้\n\nเมื่อไม่อาจควบคุมสัตว์ของข้าได้เลย ก็มีทั้งเสียงสบถ เสียงหัวเราะ และกระดูกหัก ขณะที่บุรุษและสตรีร่วงหล่นจากหลังม้าที่เดินตุปัดตุเป่อยู่ในโถง!"
 feast_main_stable_breakin.0003.bystander_riding:0 "\n\nสัตว์อื่น ๆ ในคอกม้าก็มิได้รอดพ้นไปง่ายกว่านัก และแพะตัวหนึ่งเกือบจะหลังหักด้วยน้ำหนักของ [breakin_bystander.GetTitledFirstName]"
 feast_main_stable_breakin.0003.deviant_discovered:0 "\nอย่างไรก็ตาม ค่ำคืนนั้นกลับพลิกผัน เมื่อ [breakin_deviant.GetTitledFirstName] ถูกพบที่ด้านหลังของคอกม้า กำลังกระทำการอันมิอาจเอ่ยถึงกับวัวตัวผู้ตัวหนึ่งของข้า!\nตราประทับแห่งความอัปยศนี้จะไม่มีวันจางหายไปจากจิตวิญญาณของ[breakin_deviant.GetHerHis]"
 feast_main_stable_breakin.0003.what_a_silly_bunch:0 "\n\nในท้ายที่สุด เหล่าคนเลี้ยงม้าก็สามารถควบคุมสัตว์ที่ตื่นตระหนกเหล่านั้นได้ และอย่างน้อย พวกเราที่มีสติสัมปชัญญะก็ได้ชมการแสดงอันน่าตื่นตาตื่นใจ!"
 feast_main_stable_breakin.0003.a:0 "คนเลี้ยงม้าทั้งหลาย จงช่วยคนเหล่านั้นให้พ้นจากตัวเองที!"
 feast_main_stable_breakin.0003.b:0 "เจ้ากำลัง ทำให้สัตว์ของข้าเสื่อมเสียทางศีลธรรม!"
 feast_main_stable_breakin.0003.secret_of_my_own:0 "แซมซันที่รักของข้า! กับ [breakin_deviant.GetFirstName] งั้นรึ?!"
 feast_main_stable_breakin.0004.t:2 "$feast_main_stable_breakin.0002.t$"
 feast_main_stable_breakin.0004.breakin_with_helper:0 "การกินดื่มก็ดีอยู่หรอก แต่ข้าต้องการความสนุกบ้าง!\n[breakin_helper.GetTitledFirstName] มีแผนอันยอดเยี่ยมเกี่ยวกับคอกม้า และในไม่ช้า ข้าก็ได้นำกลุ่มผู้ที่กระตือรือร้นจะขี่ม้าผ่านประตูและกลอนอันน่าสมเพชเข้าไป\nมีเสียงกรีดร้องและเสียงหัวเราะดังขึ้นเมื่อพวกเรานำม้าเข้ามาในโถง ที่ ซึ่งข้าได้แสดงฝีมือการขี่ม้าอันน่าทึ่งให้แขกคนอื่น ๆ ได้ชม!"
 feast_main_stable_breakin.0004.breakin_with_deviant:0 "การกินดื่มก็ดีอยู่หรอก แต่ข้าต้องการความสนุกบ้าง!\n[breakin_deviant.GetTitledFirstName] มีแผนอันยอดเยี่ยมเกี่ยวกับคอกม้า และในไม่ช้า ข้าก็ได้นำกลุ่มผู้ที่กระตือรือร้นจะขี่ม้าผ่านประตูและกลอนอันน่าสมเพชเข้าไป\nมีเสียงกรีดร้องและเสียงหัวเราะดังขึ้นเมื่อพวกเรานำม้าเข้ามาในโถง ที่ ซึ่งข้าได้แสดงฝีมือการขี่ม้าอันน่าทึ่งให้แขกคนอื่น ๆ ได้ชม!"
 feast_main_stable_breakin.0004.breakin_with_noone:0 "การกินดื่มก็ดีอยู่หรอก แต่ข้าต้องการความสนุกบ้าง!\n\nข้าจึงถือวิสาสะนำกลุ่มผู้ที่กระตือรือร้นจะขี่ม้าผ่านประตูและกลอนอันน่าสมเพชที่เฝ้าคอกม้าอยู่\n\nในไม่ช้าก็มีเสียงกรีดร้องและเสียงหัวเราะตามมา ขณะที่แขกเหรื่อเฝ้าดูพวกเราขี่สัตว์ไปรอบ ๆ โถง!"
 feast_main_stable_breakin.0004.bystander_riding:0 "\nมีสัตว์อื่น ๆ นอกจากม้าถูกขังอยู่ในคอกม้าด้วย และ [breakin_bystander.GetTitledFirstName] ก็ขี่แพะเข้ามา! มันสนุกมาก จนกระทั่งมันล้มลงใต้ร่างของ[breakin_bystander.GetHerHim] และก็ยังสนุกอยู่หลังจากนั้น"
 feast_main_stable_breakin.0004.deviant_discovered:0 "\nอย่างไรก็ตาม เสียงหัวเราะและความสนุกสนานก็เงียบลง เมื่อ [breakin_deviant.GetTitledFirstName] ถูกพบที่ด้านหลังของคอกม้า กำลังประกอบบาปกรรมอันมิอาจเอ่ยถึงกับวัวตัวผู้ตัวหนึ่ง! ช่างเป็นคนพาลเสียนี่กระไร!"
 feast_main_stable_breakin.0004.signoff:0 "\n\nมันเป็นค่ำคืนที่ยอดเยี่ยม แม้ว่ารายละเอียดในความทรงจำของข้าจะเลือนรางไปบ้าง"
 feast_main_stable_breakin.0004.a:0 "รอที่จะทำมันอีกครั้งไม่ไหวแล้ว"
 feast_main_stable_breakin.0005.t:2 "$feast_main_stable_breakin.0002.t$"
 feast_main_stable_breakin.0005.breakin:0 "พวกเราทั้งคู่เมามายอย่างหนัก [breakin_stager.GetTitledFirstName] ต้องการความสนุก และข้าก็ได้ใส่ความคิดลงไปว่าบางทีมันควรจะเกี่ยวกับสัตว์ของเจ้าภาพ...\n\nในไม่ช้า ข้าก็พบว่าตัวเองกำลังตาม [breakin_stager.GetHerHim] ไปยังคอกม้า ที่ ซึ่งแขกขี้เมาคนอื่น ๆ เริ่มนำม้าเข้ามาในโถง!"
 feast_main_stable_breakin.0005.bystander_riding:0 "\n\nที่นั่นมีสัตว์อื่น ๆ นอกจากม้าด้วย และ [breakin_bystander.GetTitledFirstName] ก็ขี่แพะเข้ามา จนกระทั่งมันทรุดลงด้วยน้ำหนักของ[breakin_bystander.GetHerHis]"
 feast_main_stable_breakin.0005.deviant_discovered:0 "\n\nข้ารู้ว่ามันผิดมหันต์เพียงใด แต่ด้วยสิ่งรบกวนทั้งหมด ข้าก็ไม่อาจห้ามใจตัวเองให้ออกห่างจากวัวตัวผู้ที่อยู่ด้านหลังคอกม้าได้ \n\nเมื่อข้าได้ยินเสียงตะโกนเรียกชื่อข้าด้วยความตกตะลึง ข้ารู้ว่าชื่อเสียงของข้าป่นปี้แล้ว แต่ในชั่วขณะนั้น ข้ายินดีที่จะแบกรับความอัปยศใด ๆ "
 feast_main_stable_breakin.0005.got_away_with_it:0 "\n\nสิ่งรบกวนนั้นเป็นสิ่งที่ข้าต้องการพอดี และข้าก็ไม่อาจห้ามใจตัวเองให้ออกห่างจากวัวตัวผู้ที่อยู่ด้านหลังคอกม้าได้อีกต่อไป \nสิ่งที่ข้าทำลงไปนั้นผิดมหันต์ แต่ความเสี่ยงที่จะถูกค้นพบกลับ ทำให้มันน่าตื่นเต้นยิ่งขึ้นไปอีก!"
 feast_main_stable_breakin.0005.a:0 "ข้าหยุดคิดถึงค่ำคืนนั้นไม่ได้เลย"
 feast_main_stable_breakin.0006.t:2 "$feast_main_stable_breakin.0002.t$"
 feast_main_stable_breakin.0006.breakin_with_helper:0 "พวกเราทั้งคู่เมามายอย่างหนัก [breakin_stager.GetTitledFirstName] ต้องการความสนุก และเกิดความคิดขึ้นมาว่ามันควรจะเกี่ยวกับสัตว์ของเจ้าภาพ... \n\nในไม่ช้า ข้าก็พบว่าตัวเองกำลังช่วย [breakin_stager.GetHerHim] บุกเข้าไปในคอกม้า ที่ ซึ่งพวกเราและแขกขี้เมาคนอื่น ๆ เริ่มนำม้าเข้ามาในโถง!"
 feast_main_stable_breakin.0006.bystander_riding:1 "\n\nที่นั่นมีสัตว์อื่น ๆ นอกจากม้าด้วย และ [breakin_bystander.GetTitledFirstName] ก็ขี่แพะเข้ามา จนกระทั่งมันทรุดลงด้วยน้ำหนักของ[breakin_bystander.GetHerHis]"
 feast_main_stable_breakin.0006.deviant_discovered:0 "\n\nอย่างไรก็ตาม เสียงหัวเราะและความสนุกสนานก็หาไม่เจออีกต่อไป เมื่อ [breakin_deviant.GetTitledFirstName] ถูกพบที่ด้านหลังของคอกม้า กำลังประกอบบาปกรรมอันมิอาจเอ่ยถึงกับวัวตัวผู้ตัวหนึ่ง!"
 feast_main_stable_breakin.0006.all_in_good_fun:0 "\n\nเห็นได้ชัดว่ามันเป็นการแสดงที่ดี ดังนั้น [activity.GetOwner.GetTitledFirstName] จึง ทำให้ชัดเจนว่า [activity.GetOwner.GetSheHe]จะไม่ลงโทษพวกเราสำหรับการกระทำของเรา"
 feast_main_stable_breakin.0006.a:0 "ทำทุกอย่างเพื่องานเลี้ยงที่ดี!"
 feast_main_stable_breakin.0007.t:2 "$feast_main_stable_breakin.0002.t$"
 feast_main_stable_breakin.0007.breakin:0 "พวกเราทั้งคู่เมามายอย่างหนัก [breakin_stager.GetTitledFirstName] ต้องการความสนุก และเกิดความคิดขึ้นมาว่ามันควรจะเกี่ยวกับสัตว์ของเจ้าภาพ...\n\nในไม่ช้า ข้าก็พบว่าตัวเองกำลังช่วย [breakin_stager.GetHerHim] บุกเข้าไปในคอกม้า ที่ ซึ่งพวกเราและแขกขี้เมาคนอื่น ๆ เริ่มขี่ม้าเข้ามาในโถง!"
 feast_main_stable_breakin.0007.bystander_riding:0 "\n\nข้าปีนขึ้นขี่สัตว์อะไรก็ตามที่ข้าหาเจอ ซึ่งภายหลังข้าได้รับแจ้งว่าเป็นแพะจริง ๆ และการที่มันทรุดลงใต้ร่างข้าก็อธิบายรอยฟกช้ำบางส่วนของข้าได้"
 feast_main_stable_breakin.0007.deviant_discovered:0 "\n\nอย่างไรก็ตาม เรื่องราวก็จบลงอย่างกะทันหัน เมื่อ [breakin_deviant.GetTitledFirstName] ถูกจับได้ว่ากำลังสนุกสนานในรูปแบบที่แตกต่างไปมากกับวัวตัวผู้ที่ด้านหลังคอกม้า! ข้าคงจะตกใจและสยดสยองหากข้ายังมีสติอยู่"
 feast_main_stable_breakin.0007.what_a_silly_bunch:0 "\n\nฟังดูเหมือนพวกเราสร้างเรื่องวุ่นวายขึ้นมาแน่ ๆ โชคดีที่มันน่าบันเทิงใจพอสำหรับแขกคนอื่น ๆ จนเจ้าภาพดูเหมือนจะไม่ต้องการลงโทษพวกเราสำหรับการล่วงละเมิดของเรา"
 feast_main_stable_breakin.0007.a:0 "ข้าจะแสร้งทำเป็นว่าจำเรื่องทั้งหมดนี้ได้ก็แล้วกัน"
 feast_main_stable_breakin.9001.t:2 "ลดความคึกคะนองลง"
 feast_main_stable_breakin.9001.deviant_caught:1 "งานเลี้ยงของ [host_saying_goodbye.GetTitledFirstNamePossessive] ใกล้จะสิ้นสุดลงแล้ว เป็นเรื่องน่าเศร้าที่ต้องคิดว่าเราจะต้องกล่าวคำอำลา แม้ว่าการไม่ต้องอยู่ร่วมกับ [breakin_deviant.GetTitledFirstName] และวัวตัวนั้นอีกต่อไปก็คงไม่เลวร้ายนัก..."
 feast_main_stable_breakin.9001.in_good_fun:1 "งานเลี้ยงของ [host_saying_goodbye.GetTitledFirstNamePossessive] ใกล้จะสิ้นสุดลงแล้ว\n\nเป็นเรื่องน่าเศร้าที่ต้องคิดว่าเราจะต้องกล่าวคำอำลา แต่อย่างน้อยเราก็จะสามารถมองย้อนกลับไปและหัวเราะคิกคักกับการผจญภัยของ [breakin_stager.GetFirstName] และกลุ่มเพื่อนร่วมเมา [breakin_stager.GetHerHis] ที่ร่าเริงของเขาไปอีกหลายปี"
 feast_main_stable_breakin.9001.a:1 "ช่างเป็นช่วงเวลาที่ยอดเยี่ยมที่เรามี!"
 feast_main_stable_breakin.9002.deviant_caught:1 "คิดแล้วก็ใจหายที่ข้าจะต้องส่งแขกทั้งหมดกลับในไม่ช้า! \n\nคงจะน่าเศร้าที่เห็นพวกเขาจากไป ยกเว้น [breakin_deviant.GetTitledFirstName]\nแม้ว่าข้าจะไม่อาจลืมได้เลยเมื่อใดก็ตามที่ข้ามองดูวัวตัวผู้รางวัลของข้า"
 feast_main_stable_breakin.9002.in_good_fun_or_what:1 "แขกของข้าทุกคนอารมณ์ดีกันเหลือเกิน!\n\nงานเลี้ยงนี้ ทำให้พวกเราใกล้ชิดกันมากขึ้น และพวกเราจะสามารถมองย้อนกลับไปและหัวเราะเบา ๆ ให้กับการผจญภัยโลดโผนของ [breakin_stager.GetFirstName] และกลุ่มสหายขี้เมาที่ร่าเริงของ[breakin_stager.GetHerHis] ไปอีกหลายปี\n\n[breakin_deviant.GetTitledFirstName] ถึงกับกล่าวชมข้าติดตลกเกี่ยวกับสุขภาพที่ดีของปศุสัตว์ของข้า!"
 feast_main_stable_breakin.9002.in_good_fun:1 "แขกของข้าทุกคนอารมณ์ดีกัน!\n\nงานเลี้ยงนี้ ทำให้พวกเราใกล้ชิดกันมากขึ้น และพวกเราจะสามารถมองย้อนกลับไปและหัวเราะเบา ๆ ให้กับการผจญภัยโลดโผนของ [breakin_stager.GetFirstName] และกลุ่มสหายขี้เมาที่ร่าเริงของ[breakin_stager.GetHerHis] ไปอีกหลายปี"
 feast_main_stable_breakin.9002.a:0 "จงเก็บข้าไว้ในใจของพวกเจ้าเถิด เหล่าข้าหลวง!"
 feast_main_stable_breakin.9003.deviant_caught:1 "งานเลี้ยงของ [host_saying_goodbye.GetTitledFirstNamePossessive] ใกล้จะสิ้นสุดลงแล้ว\n\nข้าพบว่าเป็นการยากที่จะมอง [breakin_deviant.GetTitledFirstName] ในแบบเดิม แต่ข้าเกือบจะต้องขอบคุณ [breakin_deviant.GetHerHim] ที่ดึงความสนใจไปจากพวกเราคนอื่นๆ ที่บุกเข้าไปในคอกม้าตั้งแต่แรก"
 feast_main_stable_breakin.9003.in_good_fun:1 "ช่างเป็นช่วงเวลาที่เรามี! \n\nดูเหมือนว่า [host_saying_goodbye.GetTitledFirstName] จะให้อภัยพวกเราสำหรับการบุกเข้าไปเล็กน้อยของเรา เนื่องจาก [host_saying_goodbye.GetSheHe] เห็นว่าแขกคนอื่น ๆ สนุกสนานเพียงใดที่ได้ดูพวกเราขี่ม้า"
 feast_main_stable_breakin.9003.a:0 "ท้ายที่สุดแล้ว สิ่งที่เราทำก็ไม่ได้เลวร้ายนัก"
 feast_main_stable_breakin.9004.deviant_caught:1 "ข้ารู้ว่าไม่มีลอร์ดหรือเลดี้คนใดในอาณาจักรจะมองข้าเหมือนเดิมอีกต่อไป [host_saying_goodbye.GetTitledFirstName] ประณามชื่อของข้า และ [breakin_stager.GetFirstName] ซึ่งข้าเคยหัวเราะและดื่มด้วยกันเมื่อไม่นานมานี้ ไม่สามารถสบตา [breakin_stager.GetHerselfHimself] กับข้าได้อีกต่อไป"
 feast_main_stable_breakin.9004.in_good_fun:0 "ข้าไม่อยากจะเชื่อเลยว่าข้ารอดพ้นจากสิ่งที่ข้าทำลงไป!\nหลังจากที่สัตว์เหล่านั้นถูกนำกลับไปเก็บ ข้าได้กล่าวชม [host_saying_goodbye.GetTitledFirstName] เกี่ยวกับสุขภาพที่ดีของสัตว์ของ[host_saying_goodbye.GetHerHis]\n\nหากเพียง แต่ [host_saying_goodbye.GetSheHe] รู้!"
 feast_main_stable_breakin.9004.a:0 "ข้าจะยับยั้งชั่งใจตัวเองในอนาคต! หวังว่านะ"
 feast_stable_breakin_log_title:0 "การบุกคอกม้า"
 feast_stable_breakin_log:0 "[TARGET_CHARACTER.GetTitledFirstName] บุกเข้าไปในคอกม้าและปล่อยสัตว์ออกมาในโถงงานเลี้ยง"
