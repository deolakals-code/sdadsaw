 tour_general.3002.title:0 "[ROOT.Char.GetCurrentLocation.GetNameNoTooltip]: คำขอได้รับการอนุมัติ"
 tour_general.3002.title_denied:0 "[ROOT.Char.GetCurrentLocation.GetNameNoTooltip]: คำขอถูกปฏิเสธ"
 tour_general.3002.intro:0 "[stop_host_scope.GetTitledFirstName] กล่าวกับข้าโดยตรง\n\n'ฝ่าบาท[stop_host_scope.Custom2('RelationToMeShort', ROOT.Char )] ข้าได้พิจารณาเรื่องนี้แล้วและได้ข้อสรุปว่า "
 tour_general.3002.desc_free:0 "[tour_general_3001_target_courtier.GetFirstName] จะเข้าร่วมราชสำนักอันทรงเกียรติของท่านด้วยความยินดี'"
 tour_general.3002.desc_hook:0 "บุญคุณที่นี่อาจได้รับการตอบแทนด้วยบุญคุณในอนาคต... ?'"
 tour_general.3002.desc_gold:0 "ทองคำบางส่วนอาจช่วยบรรเทาความเสียหายได้ หากเราสูญเสีย[tour_general_3001_target_courtier.GetFirstName] ที่รักไป"
 tour_general.3002.desc_cannibal:0 "ข้ามีความคิดที่ดียิ่งกว่านั้น หากท่านชอบ [tour_general_3001_target_courtier.GetFirstName], ท่านจะ #EMP รัก#! สิ่งนี้, [ROOT.Char.Custom('FormOfAddressForLiege')] มันยอดเยี่ยม #EMP จนแทบขาดใจ#! เลยล่ะ'\n\n[stop_host_scope.GetSheHe|U] ชำเลืองมองไปในทิศทางของ [tour_general_3001_target_courtier.GetFirstNamePossessive] แล้วก็มองตรงมาที่ข้า, ราวกับจะส่งสัญญาณบางอย่าง"
 tour_general.3002.desc_declined:0 "ข้าไม่สามารถยอมรับคำขอนี้ได้ [tour_general_3001_target_courtier.GetFirstName] มีค่าเกินไปสำหรับข้าและราชสำนักของข้า'\n\nสายตาของ[stop_host_scope.GetHerHis|U] เริ่มมองไปรอบๆ ห้องอย่างงุ่มง่าม"
 tour_general.3002.a:0 "ขอบคุณมาก!"
 tour_general.3002.b:0 "ทำไมต้องแลกเปลี่ยนกับสิ่งที่ข้า #EMP เอา#! มาได้?"
 tour_general.3002.b_declined:0 "[tour_general_3001_target_courtier.GetFirstNameNoTooltip] เป็น #EMP ของข้า#!."
 tour_general.3002.c:0 "บุญคุณ? ฟังดูยุติธรรม"
 tour_general.3002.d:0 "ทองคำสองสามชิ้น? การค้าที่ยุติธรรม"
 tour_general.3002.e:0 "คิดดูอีกที..."
 tour_general.3002.f:0 "#EMP โอ้ พระเจ้า...#!"
 tour_general.3002.g:0 "พฤติกรรมอันชั่วร้ายนี้ต้องสิ้นสุดลง!"
 tour_general.3002.h:0 "นั่นน่าเสียดาย"
