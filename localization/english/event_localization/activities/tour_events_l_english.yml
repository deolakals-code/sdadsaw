 host_dinner_events.3003.host_noticed:0 "[stop_host_scope.GetNameNoTooltip] สังเกตเห็น"
 host_dinner_events.3004.title:0 "คำมั่นสัญญา แต่เนิ่นๆ"
 host_dinner_events.3004.desc.intro:0 "ข้ามาถึงอาหารค่ำเร็วในวันนี้ และพบว่าข้าอยู่ตามลำพังกับทายาทของ [stop_host_scope.GetNamePossessive] [stop_host_heir.GetName]"
 host_dinner_events.3004.desc.mid.child:0 "[stop_host_heir.GetSheHe|U] ยังเด็ก และเห็นได้ชัดว่ารู้สึกหวาดกลัวที่ต้องอยู่ในห้องเดียวกับ [stop_host_heir.GetHerHis] [ROOT.Char.GetTitleAsNameNoTooltip]"
 host_dinner_events.3004.desc.mid.adult:0 "ธรรมชาติที่ไว้ใจคนของ [stop_host_heir.GetHerHis|U] นั้นฉาวโฉ่ เหมือนเด็ก หัวของ [stop_host_heir.GetHerHis] ว่างเปล่าและอ่อนไหว และมันง่ายเกินไปที่จะปรับความคิดเล็กๆ ของ [stop_host_heir.GetHerHis] ให้สอดคล้องกับวิสัยทัศน์ของข้า"
 host_dinner_events.3004.desc.outro:0 "\n\nมันง่ายเกินไปที่จะชักจูงเจ้าหนูผู้น่าสงสารให้มอบคำสัตย์ปฏิญาณทางกฎหมาย [stop_host_heir.GetHerHis] แก่ข้าก่อนเวลาอันควร แต่นี่จะ ทำให้ [stop_host_scope.GetNameNoTooltip] ไม่พอใจอย่างแน่นอน"
 host_dinner_events.3004.a:0 "มาทำกันเถอะ!"
 host_dinner_events.3004.a.caught:0 "ความพยายามในความอยุติธรรมของท่านถูกสังเกตเห็น"
 host_dinner_events.3004.a.not_caught:0 "คำพูดได้กล่าวออกไปแล้ว และไม่สามารถยกเลิกได้"
 host_dinner_events.3004.b:0 "ข้าจะแค่สนทนา"
 host_dinner_events.3004.friendly_convo:0 "ท่านมีการสนทนาที่เป็นมิตร"
 host_dinner_events.3004.awkward_convo:0 "การสนทนาน่าอึดอัด"
 host_dinner_events.3005.title:0 "$host_dinner_events.3004.title$"
 host_dinner_events.3005.desc:0 "ข้าเข้าไปในห้องอาหารและพบว่า [visiting_liege.GetName] กำลังพูดคุยกับ [stop_host_heir.Custom2('MyCharacterIntroduction', ROOT.Char)] เกี่ยวกับเรื่องของรัฐและภาระผูกพัน\n\n[visiting_liege.GetName] ดูเหมือนกำลังชักจูง [stop_host_heir.GetHerHim] ให้ให้คำมั่นสัญญาแห่งความภักดีต่อราชบัลลังก์ ในขณะที่ข้าไม่อยู่! คำมั่นสัญญา เช่นนั้นจะหลอกหลอน [stop_host_heir.GetHerHim] ไปตลอดชีวิตและตอกย้ำอนาคตของเราในฐานะผู้ใต้บังคับบัญชาของ [visiting_liege.GetNamePossessive]!"
 host_dinner_events.3005.a:0 "ข้าจะอนุญาต เพื่อแลกกับบุญคุณของข้าเอง"
 host_dinner_events.3005.hook_for_hook:1 "[stop_host_scope.GetName] เรียกร้องค่าชดเชย"
 host_dinner_events.3005.b:0 ""หยุดความบ้าคลั่งนี้เดี๋ยวนี้!""
 host_dinner_events.3005.disallowed_hook:0 "ท่านถูกจับได้"
 host_dinner_events.3006.title:0 "ความฝันถึงชีวิตที่ดีกว่า"
 host_dinner_events.3006.desc.intro:0 "เย็นวันนี้ ข้านั่งถัดจาก [runaway_courtier.Custom2('NamePossessiveCharacterIntroduction', stop_host_scope)] เฝ้ามองขณะที่ [runaway_courtier.GetSheHe] ถอนหายใจลงในจานของ [runaway_courtier.GetHerHis] ด้วยความปรารถนา\n\n"
 host_dinner_events.3006.desc.mid.concubine:0 ""อา ข้าขออภัยในความเศร้าโศกของข้า [ROOT.Char.GetTitleAsNameNoTooltip|U] ของข้า [stop_host_scope.GetNameNoTooltip] อาจจะให้ข้านั่งถัดจากท่านเพื่อเอาใจท่าน [stop_host_scope.GetSheHe|U] เป็น เช่นนั้น [stop_host_scope.GetSheHe] มองข้าเป็นเพียงวัตถุที่จะถูกจ้องมองและเล่นด้วยเท่านั้น พูดตามตรง ข้าฝันที่จะกลับไปกับท่านที่ [ROOT.Char.GetCapitalLocation.GetName]""
 host_dinner_events.3006.desc.mid.neutral:0 ""แท้จริงแล้ว ข้าเบื่อหน่ายชีวิตที่นี่ใน [stop_host_scope.GetCapitalLocation.GetName] และปรารถนาที่จะยกระดับสถานะของข้าในชีวิต พรสวรรค์ของข้าสูญเปล่าที่นี่ และช่วงหลังมานี้ข้าคิดที่จะแอบไปกับท่านกลับไปที่ [ROOT.Char.GetCapitalLocation.GetName] ที่ ซึ่งข้าสามารถแสดงให้เห็นถึงคุณค่าของข้าได้อย่างแท้จริง!""
 host_dinner_events.3006.desc.outro:0 "\n\nความคร่ำครวญของ [runaway_courtier.GetHerHis|U] ดูเหมือนจะจริงใจ แต่ข้าสามารถขโมยจากราชสำนักของ [stop_host_scope.GetNamePossessiveNoTooltip] ได้จริงหรือ?"
 host_dinner_events.3006.a:0 "แน่นอน มากับข้า!"
 host_dinner_events.3006.b:0 ""ข้าจะชื่นชมมากกว่าความงามของท่าน""
 host_dinner_events.3006.c:0 "อย่างน้อยข้าก็เป็นไหล่ให้พักพิงได้"
 host_dinner_events.3006.d:0 ""จงเจียมตัวซะ, เจ้า [runaway_courtier.Custom2('InsultNoun', ROOT.Char)]!""
 host_dinner_events.3007.title:0 "ข้าราชบริพารที่ถูกขโมย"
 host_dinner_events.3007.desc.intro:0 "ข้าได้ตัดสินใจว่าเป็นความคิดที่ดีที่จะให้ [visiting_liege.GetName] นั่งถัดจาก [runaway_courtier.Custom2('MyCharacterIntroduction', ROOT.Char)] และดูเหมือนว่าจะไปได้ดี ดีเกินไปหน่อย"
 host_dinner_events.3007.desc.mid.concubine:0 "\n\n[runaway_courtier.GetNameNoTooltip] หน้าเบ้เมื่อ [runaway_courtier.GetSheHe] เห็นข้า และเบือนสายตาของ [runaway_courtier.GetHerHis] ไปทางอื่น"
 host_dinner_events.3007.desc.mid.neutral:0 "\n\n[runaway_courtier.GetNameNoTooltip] กลอกตาของ [runaway_courtier.GetHerHis] เมื่อ [runaway_courtier.GetSheHe] เห็นข้า ก่อนที่จะเบือนสายตาของ [runaway_courtier.GetHerHis] ไปทางอื่นทันที"
 host_dinner_events.3007.desc.outro:0 "[runaway_courtier.GetSheHe|U] ดูเหมือนจะตั้งใจที่จะออกจากราชสำนักของข้าไปหา [visiting_liege.GetName]! ข้าสามารถหยุดสิ่งนี้ได้ แต่แน่นอนว่าจะ ทำให้อารมณ์เสียในมื้อค่ำ"
 host_dinner_events.3007.a:0 "ข้าห้าม!"
 host_dinner_events.3007.refused_to_let_them_go:0 "[stop_host_scope.GetName] ปฏิเสธที่จะปล่อย [runaway_courtier.GetHerHim] ไป"
 host_dinner_events.3007.b:0 "ปล่อย [runaway_courtier.GetHerHim] ไป"
 host_dinner_events.3008.title:0 "การสอดแนมเล็กน้อย"
 host_dinner_events.3008.desc:0 "เป็นเวลาเช้า และข้าตื่นขึ้นมาสู่โลกแห่งความตื่นอย่างไม่เต็มใจเมื่อแสงอาทิตย์ยามเช้าสาดส่องเข้ามาในสายตาของข้าทันที ข้าเห็นคนรับใช้เดินวนเวียนอยู่ในห้องของข้าอย่างงุ่มง่าม ไม่มั่นคงขณะที่ [nervous_servant.GetSheHe] วางอาหารเช้าลงข้างๆ ข้า ข้าถามว่าอะไร ทำให้ [nervous_servant.GetHerHim] ไม่สบายใจ และแม้จะมีการยั่วยุเพียงเล็กน้อย [nervous_servant.GetSheHe] ก็เริ่มพรั่งพรูคำพูดออกมา\n\n"โอ้ [ROOT.Char.GetTitleAsNameNoTooltip] ผู้ชาญฉลาดและใจดีของข้า กำแพงเหล่านี้พูดได้ โอ้ สิ่งเลวร้ายอะไรที่พวกมันพูด ข้ารู้มากเกินไป มากเกินไปที่ข้าคิดในบางวัน [stop_host_scope.GetName] จะไม่มีวันให้อภัยข้าถ้าข้าบอกท่าน แต่ข้าไม่สามารถเก็บความลับเหล่านี้ไว้ในหัวได้อีกต่อไป!""
 host_dinner_events.3008.a:0 ""เจ้าต้องบอกข้าเดี๋ยวนี้!""
 host_dinner_events.3008.secret_discovered:0 "[nervous_servant.GetSheHe|U] เปิดเผยความลับ"
 host_dinner_events.3008.b:0 ""เหรียญบางส่วนจะ ทำให้ปากเหล่านั้นคลายลงหรือไม่?""
 host_dinner_events.3008.acting_sussy:0 "[stop_host_scope.GetName] สงสัยท่าน"
 host_dinner_events.3008.c:0 ""เจ้าควรจะหุบปากไว้""
 host_dinner_events.1009.title:0 "ฝ่าบาท"
 host_dinner_events.1009.desc:0 "ขณะที่เราทานอาหารจานหลักเสร็จ ข้ามองไปที่ [visiting_liege.Custom2('MyCharacterIntroduction', ROOT.Char)] อย่างคาดหวังเพื่อคำชมและการอนุมัติ เพียงเพื่อพบกับแววตาที่คาดหวังในดวงตาของ [visiting_liege.GetHerHis] เห็นได้ชัดว่าสิ่งที่ข้าจัดหาให้ไม่เพียงพอสำหรับแขกผู้มีเกียรติของข้า แต่พ่อครัวได้ทำทุกอย่างที่ข้าขอแล้ว และข้าไม่แน่ใจว่าเรามีอะไรเหลือให้เสิร์ฟอีกหรือไม่\n\nจากนั้นความคิดก็ผุดขึ้นมาว่าข้ายังมีเค้กฮาชิชกองโตอยู่ในตู้กับข้าวพร้อมที่จะกิน! คำถามเดียวคือ ข้ายินดีที่จะแบ่งปันความสุขนี้กับ [visiting_liege.GetTitleAsNameNoTooltip|U] ของข้าหรือไม่?"
 host_dinner_events.1009.a:0 "นำเค้กออกมา!"
 host_dinner_events.1009.b:0 "ข้าแน่ใจว่า [ROOT.Char.Custom('GetExpensiveDessert')] ก็ใช้ได้"
 host_dinner_events.1010.title:0 "ฝ่าบาทของข้า"
 host_dinner_events.1010.desc:0 "ขณะที่ข้าทานอาหารมื้อล่าสุดเสร็จ ข้าอดไม่ได้ที่จะรู้สึกเหมือนมีรูในท้องที่ควรจะมีของหวานอยู่ [stop_host_scope.GetName] ดูเหมือนจะอ่านใจข้าออก เพราะก่อนที่ข้าจะมีโอกาสบ่น [stop_host_scope.GetSheHe] ก็เรียกคนรับใช้ให้นำ 'เค้กพิเศษ' ของ [stop_host_scope.GetHerHis] ออกมา\n\n"ไม่มีอะไรนอกจากเค้กฮาชิชที่ดีที่สุดสำหรับ [visiting_liege.GetTitleAsNameNoTooltip|U] ของข้า!" เขากล่าวขณะที่กองเค้กขนาดมหึมาถูกวางลงบนจานของข้า"
 host_dinner_events.1010.a:0 "ข้าจะกินให้หมด!"
 host_dinner_events.1010.b:0 "ข้าไม่มีวันทำ!"
 host_dinner_events.1011.title:0 "ความแตกต่างด้านอาหาร"
 host_dinner_events.1011.desc.intro:0 "ขณะที่ [visiting_liege.GetName] นั่งลง [visiting_liege.GetHerHis] สำหรับอาหารค่ำ [ROOT.Char.GetPrimaryTitle.GetAdjective] อันยอดเยี่ยมอีกมื้อหนึ่ง ข้าอดไม่ได้ที่จะตระหนักว่า [visiting_liege.GetSheHe] คงจะเริ่มเบื่ออาหารของเราแล้ว\n\n"
 host_dinner_events.1011.desc.vegetarian:0 "เราเสิร์ฟเฉพาะพืชผักที่ [ROOT.Char.GetFaith.CreatorName] ประทานให้เรา และไม่เคยเสิร์ฟเนื้อนกหรือสัตว์ร้าย แต่ใน [visiting_liege.GetCapitalLocation.GetTitle.GetNameNoTierNoTooltip] พวกเขาทำสิ่งที่แตกต่างออกไปเล็กน้อย ข้าควรประนีประนอมความเชื่อของข้าเพื่อเป็นเจ้าภาพที่เอื้อเฟื้อมากขึ้นหรือไม่? ข้าควรเพิ่มเนื้อสัตว์ลงในเมนูหรือไม่?"
 host_dinner_events.1011.desc:0 "เรากินเนื้อสัตว์อย่างเสรี แต่ใน [visiting_liege.GetCapitalLocation.GetTitle.GetNameNoTierNoTooltip] สิ่งนั้นเป็นสิ่งต้องห้ามโดยสิ้นเชิง จนถึงตอนนี้ [visiting_liege.GetName] ดูเหมือนจะกินสิ่งที่จัดหาให้ แต่กันเนื้อสัตว์ใดๆ ออกไป ทำให้ [visiting_liege.GetTitleAsNameNoTooltip|U] ของข้าได้รับอาหารที่ไม่สมบูรณ์! ข้าจะปล่อยให้สิ่งนี้ดำเนินต่อไปได้จริงหรือ? บางทีเราทุกคนควรกินอาหารที่ไม่มีเนื้อสัตว์ ในขณะที่ [visiting_liege.GetTitleAsNameNoTooltip|U] อยู่"
 host_dinner_events.1011.a:0 "สิ่งนี้จะ ทำให้ข้าเป็นที่โปรดปรานของ [visiting_liege.GetHerHis]"
 host_dinner_events.1011.b:0 "ข้าแน่ใจว่า [visiting_liege.GetSheHe] จะไม่ลืมบุญคุณนี้ในไม่ช้า..."
 host_dinner_events.1011.c:0 "ขณะที่ [visiting_liege.GetSheHe] อยู่ที่นี่ [visiting_liege.GetSheHe] จะกินตามแบบของเรา!"
 host_dinner_events.1020.title:0 "เค้กที่น่าจดจำ"
 host_dinner_events.1020.desc:0 "อีกคืนหนึ่ง ของหวานอีกอย่าง และข้าบอกได้เลยว่า [visiting_liege.GetName] เริ่มเบื่อ [ROOT.Char.Custom('GetExpensiveDessert')] ของเราแล้ว บางทีคืนนี้อาจเป็นคืนที่จะทำอะไรที่แตกต่างออกไปเล็กน้อย\n\nบางทีทางออกสำหรับปัญหานี้อาจเป็นการขอให้พ่อครัวและคนทำขนมปังของข้าเตรียมของหวานในรูปทรงของบางสิ่งที่สำคัญต่อเจ้าเหนือหัวที่รักของข้า บางทีอาจเป็นป้อมปราการเพื่อแสดงถึงความกล้าหาญของ [visiting_liege.GetHerHis] หรือบางสิ่งที่ [visiting_liege.GetSheHe] ไม่เคยคาดคิด..."
 host_dinner_events.1020.a:0 "ป้อมปราการแน่นอน!"
 host_dinner_events.1020.b:0 "[visiting_liege.GetFaith.ReligiousSymbol] จะเป็นรูปทรงที่ยอดเยี่ยม!"
 host_dinner_events.1020.c:0 "บางทีอาจเป็นส่วนหนึ่งของกายวิภาคของมนุษย์..."
 host_dinner_events.1020.d:0 "นี่เป็นความคิดที่น่ากลัว"
 host_dinner_events.1021.title:0 "$host_dinner_events.1020.title$"
 host_dinner_events.1021.desc.intro:0 "ข้านั่งอยู่ที่โต๊ะอาหารรอของหวาน และเมื่อมันมาถึงในที่สุด ข้าแทบจะเก็บความปลาบปลื้มไว้ไม่อยู่!\n\n"
 host_dinner_events.1021.desc.mid.castle:0 "เค้กแสนอร่อยในรูปทรงป้อมปราการ [ROOT.Char.GetCulture.GetName] ถูกวางไว้ตรงหน้าข้า สิ่งนั้นเหมือนจริงมาก ข้าสามารถจินตนาการถึงผู้บุกรุกตัวน้อยที่เคลือบน้ำผึ้งพยายามบุกกำแพงของหวานของข้าได้"
 host_dinner_events.1021.desc.mid.religious:0 "ขนมหวานอันเคร่งศาสนาในรูปทรงของ [ROOT.Char.GetFaith.ReligiousSymbol] ถูกเลื่อนมาให้ข้าบนจานที่หรูหรา สิ่งนั้นได้รับการตก แต่งอย่างประณีตจนราวกับว่า [ROOT.Char.GetFaith.CreatorName] [ROOT.Char.GetFaith.CreatorHerHis] เองได้ทำมันขึ้นมาเพื่อข้าโดยเฉพาะ!"
 host_dinner_events.1021.desc.mid.lewd:0 "ข้าอดกลั้นต่อไปไม่ได้และระเบิดเสียงหัวเราะออกมาอย่างควบคุมไม่ได้เมื่อเสาเค้กสีเนื้อถูกวางไว้ตรงหน้าข้า มีรายละเอียดลามกทุกประเภทบนสัตว์ประหลาดขนาดมหึมานี้ที่ข้าแน่ใจว่าจะ ทำให้แม้ แต่ [ROOT.Char.GetFaith.DevilName] หน้าแดง!"
 host_dinner_events.1021.desc.mid.lewd_woman:0 "ข้าอดกลั้นต่อไปไม่ได้และระเบิดเสียงหัวเราะออกมาอย่างควบคุมไม่ได้เมื่อลูกกลมๆ สองลูกที่สั่นไหวของของหวานถูกวางลงตรงหน้าข้า โดยมี 'หัวนม' ผลไม้สองอันอยู่ด้านบน มีรายละเอียดลามกทุกประเภทบนขนมหวานนี้ที่ข้าแน่ใจว่าจะ ทำให้แม้ แต่ [ROOT.Char.GetFaith.DevilName] หน้าแดง!"
 host_dinner_events.1021.desc.outro:0 "\n\nแน่นอนว่าข้ารักมัน แต่คำถามเดียวคือ ข้าจะแสดงความขอบคุณได้อย่างไรดีที่สุด?"
 host_dinner_events.1021.a:0 "ข้าจะจำสิ่งนี้ไว้!"
 host_dinner_events.1021.b:0 ""ข้าติดหนี้ท่าน!""
 host_dinner_events.1022.title:0 "$host_dinner_events.1020.title$"
 host_dinner_events.1022.desc.intro:0 "ข้านั่งอยู่ที่โต๊ะอาหารรอของหวาน และเมื่อมันมาถึงในที่สุด ข้าแทบจะเก็บความโกรธไว้ไม่อยู่!\n\n"
 host_dinner_events.1022.desc.mid.castle:0 "ข้าตกใจที่เห็นสิ่งที่ควรจะเป็นเค้กในรูปทรงป้อมปราการ [ROOT.Char.GetCulture.GetName] ยุบตัวลงอย่างน่าสังเวชภายใต้น้ำหนักของมันเองบนจานของข้า นี่เป็นการดูหมิ่นความกล้าหาญของข้าหรือไม่?"
 host_dinner_events.1022.desc.mid.religious:0 "ข้าตกใจที่เห็นสิ่งที่ดูเหมือนจะเป็นเค้กในรูปทรงของ [ROOT.Char.GetFaith.ReligiousSymbol]! การแสดงการดูหมิ่นศาสนาในเชิงการทำอาหารนี้ ทำให้ข้าคลื่นไส้จนแทบจะแตะต้องมันไม่ได้"
 host_dinner_events.1022.desc.mid.lewd:0 "สิ่งที่ข้าเห็นคือเนินสีเนื้อที่น่ารังเกียจบางอย่างวางอยู่บนจาน เห็นได้ชัดว่าทำเป็นรูปทรงของส่วนต่างๆ ของร่างกายที่ลามกอนาจาร [stop_host_scope.GetName] คาดหวังให้ข้าถูกล่อลวงด้วยความหยาบคายนี้หรือ?"
 host_dinner_events.1022.desc.outro:0 "\n\nข้าทำได้เพียงรู้สึกถูกดูหมิ่นเมื่อมองดูสิ่งนี้ แต่จากดวงตาเหมือนลูกสุนัขของ [stop_host_scope.GetFirstNamePossessiveNoTooltip] ข้าบอกได้เลยว่านี่เป็นความพยายามอย่างจริงใจที่จะประจบประแจง"
 host_dinner_events.1022.a:0 "โอ้ ข้ารักมัน!"
 host_dinner_events.1020.likes_it:0 "[visiting_liege.GetFirstName] รักมัน"
 host_dinner_events.1022.b:0 ""ท่านกล้าดียังไง!""
 host_dinner_events.1020.hates_it:0 "[visiting_liege.GetFirstName] เกลียดเค้ก"
 host_dinner_events.1030.title:0 "แขกที่ไม่ได้รับเชิญ"
 host_dinner_events.1030.desc:0 "อาหารค่ำอีกมื้อได้ถูกเตรียมไว้สำหรับเจ้าเหนือหัวของข้าในระหว่างการพำนักของ [visiting_liege.GetHerHis] และดูเหมือนว่าจะเป็นผู้ชนะอย่างแท้จริง! [visiting_liege.GetName] ดูเหมือนจะน้ำลายสอเพียงแค่เห็นมัน และทันทีที่ [visiting_liege.GetSheHe] กำลังจะกัดคำแรก [rival_scope.Custom2('NamePossessiveCharacterIntroduction', visiting_liege)] ก็บุกเข้ามาในห้องอาหารและเดินกร่างไปที่จานของศัตรูของ [rival_scope.GetHerHis]\n\n"ช่างเป็นงานเลี้ยงที่ยอดเยี่ยมอะไร เช่นนี้! น่าเสียดายที่มันจะสูญเปล่าไปกับลิ้นที่เน่าเปื่อยของ [visiting_liege.GetTitleAsNameNoTooltip] ผู้ชั่วร้าย เช่นนี้!"\n\nอารมณ์ของ [visiting_liege.GetNamePossessiveNoTooltip] เสียทันที และถ้าข้าไม่ทำอะไรเลย ในไม่ช้าอาหารค่ำของข้าก็อาจจะกลายเป็นการชกต่อยกันได้"
 host_dinner_events.1030.a:0 ""ทหาร! นำคนโง่นี้ออกไปเดี๋ยวนี้!""
 host_dinner_events.1030.b:0 "บางทีข้าอาจจะกำจัดพวกเขาเพื่อแลกกับอำนาจต่อรองบางอย่าง"
 host_dinner_events.1030.c:0 "[rival_scope.GetFirstNameNoTooltip] ตลกมาก! เราควรคุยกัน!"
 host_dinner_events.1031.title:0 "$host_dinner_events.1030.title$"
 host_dinner_events.1031.desc.intro:0 "อาหารค่ำอีกมื้อได้ถูกเตรียมไว้สำหรับข้าในระหว่างการพำนักของข้า และดูเหมือนว่าจะเป็นผู้ชนะอย่างแท้จริง! ข้าน้ำลายสอเพียงแค่มองดูอาหารจานร้อนๆ ที่ชุ่มฉ่ำนี้ และทันทีที่ข้ากำลังจะกัดคำแรก เสียงที่คุ้นเคยจนน่ารำคาญก็ดังเสียดแก้วหูของข้า\n\n[rival_scope.Custom2('MyCharacterIntroduction', ROOT.Char)|U] มาถึงเพื่อทำลายความอยากอาหารของข้า และเพียงแค่การปรากฏตัวของ [rival_scope.GetHerHis] ก็ ทำให้เลือดของข้าเดือดพล่าน"
 host_dinner_events.1031.desc:0 "\n\n[stop_host_scope.GetName] ได้เสนอที่จะกำจัด [rival_scope.Custom2('InsultNoun', ROOT.Char)] ตัวปัญหานี้, แต่ข้าสัมผัสได้ว่า [stop_host_scope.GetSheHe] มีแรงจูงใจแอบแฝง"
 host_dinner_events.1031.a:0 "ใช่ ใช่ อะไรก็ได้!"
 host_dinner_events.1031.b:0 "ข้าเคยทนสิ่งที่เลวร้ายกว่านี้มาแล้ว"
 host_dinner_events.1030.liege_refuses:0 "[visiting_liege.GetFirstName] ปฏิเสธบุญคุณ"
 host_dinner_events.1032.title:0 "$host_dinner_events.1030.title$"
 host_dinner_events.1032.desc:0 "\n\nสิ่งที่ ทำให้เรื่องแย่ลงคือ [stop_host_scope.GetName] ดูเหมือนจะยินดีในความทุกข์ของข้า และได้เริ่มหัวเราะและพูดตลกกับศัตรูตัวฉกาจของราชบัลลังก์!"
 host_dinner_events.1032.a:0 "[stop_host_scope.GetFirstNameNoTooltip] กำลังเล่นเกมที่อันตราย"
 host_dinner_events.1032.b:0 "ข้าต้องหันแก้มอีกข้างให้"
 host_dinner_events.3010.title:0 "รสชาติที่ไม่คุ้นเคย"
 host_dinner_events.3010.desc:1 "เป็นอีกค่ำคืนหนึ่งของการพำนักของข้าในบ้านของ [stop_host_scope.GetNamePossessive] และอาหารต่างชาติอีกมื้อก็ถูกวางไว้ตรงหน้าข้า ข้าเขี่ยมันเล็กน้อยด้วยมีด เฝ้ามองขณะที่ซอสสีเข้มที่ไม่คุ้นเคยไหลไปมาเหมือนโคลนที่ไหลหลาก\n\nโอ้ สิ่งที่ข้าจะไม่ยอมแลกกับอาหารจากเมืองหลวง แค่ [ROOT.Char.Custom('GetExpensiveDessert')] ง่ายๆ ก็พอแล้ว ข้าสามารถขอ [stop_host_scope.GetTitledFirstNameNoTooltip] สำหรับบางอย่างจากบ้านเกิดได้แน่นอน แต่ข้าเสี่ยงที่จะ ทำให้ขุ่นเคือง"
 host_dinner_events.3010.a:0 "ข้าจะแค่ถาม"
 host_dinner_events.3010.b:0 "ข้าแน่ใจว่าอาหารท้องถิ่นก็ใช้ได้"
 host_dinner_events.3011.title:0 "$host_dinner_events.3010.title$"
 host_dinner_events.3011.desc:1 "ข้าทำอาหารมื้อนี้ได้ดีเยี่ยมจริงๆ! พ่อครัวของข้าได้ผลิตอาหารน่ารับประทานหลากหลายชนิด แต่ [visiting_liege.GetName] ดูเหมือนจะไม่เต็มใจที่จะแตะต้องมันเลย\n\n"อาหารนี้ไม่ถูกปากข้า ท่านช่วยนำ [ROOT.Char.Custom('GetExpensiveDessert')] มาให้ข้าได้ไหม? โอ้ ข้าคิดถึงรสหวานของมันบนลิ้นของข้าเหลือเกิน"\n\nนี่เป็นการดูหมิ่นเล็กน้อย แต่ท่าทาง เช่นนี้จะไม่ถูกลืมในไม่ช้า..."
 host_dinner_events.3011.a:0 "แน่นอน!"
 host_dinner_events.3011.gave_local_food:0 "[stop_host_scope.GetName] ตกลง"
 host_dinner_events.3011.b:0 "นี่เป็นการดูหมิ่น!"
 host_dinner_events.3011.refused_local_food:0 "[stop_host_scope.GetName] ถูกดูหมิ่น"
 host_dinner_events.3020.title:0 "การแข่งขัน"
 host_dinner_events.3020.desc:0 "เป็นค่ำคืนที่ยาวนานและมหัศจรรย์ของการเฉลิมฉลองและความรื่นเริง และมีการแบ่งปัน [stop_host_scope.Custom('RegionalAlcoholicDrink')] หลายแก้วระหว่างข้ากับเจ้าภาพที่ดีของข้า [stop_host_scope.GetName]\n\nอย่างไรก็ตาม ดูเหมือนว่า [stop_host_scope.GetTitledFirstNameNoTooltip] พยายามที่จะดื่มมากกว่าข้า โดยเติมแก้วของ [stop_host_scope.GetHerHis] ให้สูงกว่าของข้าเล็กน้อยเสมอ นี่เป็นการท้าทายโดยนัยหรือไม่? บางทีข้าควรจะตั้งเดิมพันที่นี่"
 host_dinner_events.3020.a:0 "ท่านประเมินความสามารถของข้าต่ำไป!"
 host_dinner_events.3020.b:0 "อย่าลองเลย"
 host_dinner_events.3021.title:0 "$host_dinner_events.3020.title$"
 host_dinner_events.3021.desc:0 "เป็นค่ำคืนที่ยาวนานและมหัศจรรย์ของการเฉลิมฉลองและความรื่นเริง และมีการแบ่งปัน [stop_host_scope.Custom('RegionalAlcoholicDrink')] หลายแก้วระหว่างข้ากับเจ้าเหนือหัวของข้า [visiting_liege.GetName]\n\nอย่างไรก็ตาม ดูเหมือนว่าข้าดื่มมากเกินไปเล็กน้อย ซึ่ง [visiting_liege.GetTitledFirstNameNoTooltip] ดูเหมือนจะถือเป็นการท้าทาย!\n\n"งั้น ท่านคิดว่าท่านสามารถดื่มเก่งกว่า [visiting_liege.GetTitleAsNameNoTooltip|U] ได้หรือ? ทำไมไม่ลองทดสอบดูแล้วดื่มกับข้าล่ะ? ผู้ชนะจะได้... อืม เราสามารถคิดหารางวัลที่เหมาะสมได้ในภายหลัง ใช่ไหม?""
 host_dinner_events.3021.a:0 "มาทำกันเถอะ!"
 host_dinner_events.3021.b:0 "ข้าควรจะหยุดจริงๆ"
 host_dinner_events.3020.refused_to_drink:0 "[stop_host_scope.GetName] ปฏิเสธการท้าทาย"
 host_dinner_events.3030.title:0 "ศิษย์เอก"
 host_dinner_events.3030.desc:0 "เย็นวันนี้ ข้าได้นั่งข้าง [promising_child.Custom2('NamePossessiveCharacterIntroduction', stop_host_scope)] และเด็กคนนี้เป็นที่น่าพอใจอย่างแท้จริง ยิ่งข้าพูดคุยกับ [promising_child.GetHerHim] มากเท่าไหร่ ข้าก็ยิ่งเห็นศักยภาพที่ [promising_child.GetHerHim] จะถูกหล่อหลอมในภาพลักษณ์ของข้ามากขึ้นเท่านั้น\n\nข้ารู้สึกอยากพา [promising_child.GetHerHim] กลับบ้านไปเป็นผู้อยู่ในอุปถัมภ์ของข้า แต่ข้าไม่สามารถทำ เช่นนั้นได้หากไม่มี [promising_child.GetHerHis] [stop_host_scope.GetMotherFather] และ [stop_host_scope.GetSheHe] อาจขออะไรบางอย่างจากข้าเป็นการตอบแทน"
 host_dinner_events.3030.a:0 "ข้าต้องถาม"
 host_dinner_events.3030.b:0 "ข้าไม่มีเวลา"
 host_dinner_events.3031.title:0 "[promising_child.GetFirstNameNoTooltip]: ผู้อยู่ในอุปถัมภ์ของ [visiting_liege.GetTitleAsNamePossessiveNoTooltip]"
 host_dinner_events.3031.desc:0 "ดูเหมือนว่า [visiting_liege.Custom2('MyCharacterIntroduction', ROOT.Char)] จะชอบ [promising_child.Custom2('MyCharacterIntroduction', ROOT.Char)] ทั้งสองใช้เวลาตลอดทั้งเย็นพูดคุยกันอย่างง่ายดายราวกับว่าพวกเขาเป็น [visiting_liege.GetMotherFather] และ [promising_child.Custom('GetDaughterSon')]!\n\n[visiting_liege.GetNameNoTooltip] เข้ามาหาข้าพร้อมรอยยิ้มกว้างบนใบหน้าของ [visiting_liege.GetHerHis] "[promising_child.Custom('GirlBoy')] คนนั้นเป็นที่น่าพอใจอย่างแท้จริง! ข้าไม่ปรารถนาสิ่งใดมากไปกว่าการพา [promising_child.GetHerHim] กลับบ้านและเลี้ยงดู [promising_child.GetHerHim] ในเมืองหลวง เยาวชนที่มีแนวโน้ม เช่นนี้ไม่ควรใช้เวลาทั้งวันใน [ROOT.Char.GetCurrentLocation.GetName] ใช่ไหม?""
 host_dinner_events.3031.a:0 "ท่านพูดถูก"
 host_dinner_events.3031.b:0 "ผิด!"
 host_dinner_events.3030.refused_to_allow_ward:1 "[stop_host_scope.GetFirstName] ห้าม [promising_child.GetFirstName] ไม่ให้ออกไป"
 host_dinner_events.3040.title:0 "ใครกินขนมอบทั้งหมด?"
 host_dinner_events.3040.desc:0 "อาหารกองสูงอีกครั้งในเย็นวันนี้ อย่างที่ข้าคาดหวัง อย่างไรก็ตาม ขนมอบเล็กๆ ที่ข้าชอบดูเหมือนจะหายไป ข้าหันไปหา [stop_host_scope.GetNameNoTooltip] ด้วยสีหน้าสงสัย\n\n"ข้ารู้ว่าท่านคาดหวังขนมอบมากกว่านี้ [visiting_liege.GetTitleAsNameNoTooltip|U] ของข้า แต่พ่อครัวรับรองกับข้าว่าทุกชิ้นหายไปก่อนที่จะพร้อมเสิร์ฟ เราพยายามจับขโมย แต่คนร้ายตะกละคนนั้นหลบหลีกเก่งเกินไป""
 host_dinner_events.3040.a:0 "ไม่หลบหลีกเก่งเกินไปสำหรับข้า!"
 host_dinner_events.3040.didnt_solve_mystery:0 "ท่านล้มเหลวในการหาพวกเขา"
 host_dinner_events.3040.b:0 "น่าเศร้า"
 host_dinner_events.3040.disappointed_in_vassal:0 "ข้าไม่โกรธ แค่ผิดหวัง"
 host_dinner_events.3041.title.deviant:0 "พาย [pie_eater_scope.GetCulture.GetNameNoTooltip]"
 host_dinner_events.3041.title:0 "[pie_eater_scope.GetFirstNameNoTooltip] กินขนมอบทั้งหมด!"
 host_dinner_events.3041.desc.deviant:0 "ข้าตามรอยเศษขนมปังและคราบไขมันและซอสไปตลอดทางเดิน จนกระทั่งในที่สุดข้าก็พบตัวผู้กระทำผิด แต่ข้าไม่คิดว่าจะมีอะไรเตรียมข้าให้พร้อมสำหรับสิ่งที่ข้ากำลังจะได้เห็น\n\nข้าพบ [pie_eater_scope.GetName] เปลือยกายโดยสิ้นเชิงโดยหันหลังให้ข้า และเมื่อข้าเข้าไป [pie_eater_scope.GetSheHe] ก็หันมาเห็นข้า เผยให้เห็นถาดพายทั้งถาดกองสูงระดับเอว โดยมีขนมอบชิ้นเดียวที่ยังคงปกปิดความสงวนของ [pie_eater_scope.GetHerHis] อยู่\n\n"โอ้! ข้า เอ่อ... ไม่ใช่ทุกอย่างที่เป็นอย่างที่เห็น [visiting_liege.GetTitleAsNameNoTooltip|U] ของข้า! โปรดอย่าบอกใครเรื่องนี้เลย!""
 host_dinner_events.3041.desc:0 "ข้าตามรอยเศษขนมปังและคราบซอสและไขมันไปตลอดทางเดิน จนกระทั่งในที่สุดข้าก็พบตัวผู้กระทำผิด!\n\nข้าเข้าไปในห้องนอนและพบ [pie_eater_scope.GetName] นั่งอยู่คนเดียวพร้อมกับกองขนมอบทั้งหมดอยู่ข้างๆ [pie_eater_scope.GetHerHis]\n\n"โอ้! [visiting_liege.GetTitleAsNameNoTooltip|U] ของข้า ข้ากำลังจะนำขนมอบมาให้ท่านแน่นอน แต่ท่านเห็นไหม... พวกมันหมดไปเสมอเมื่อถึงตาข้ากิน ดังนั้นข้าจึงคิดว่าจะแอบกินสักชิ้นสองชิ้นก่อน โปรดอย่าบอกใครเรื่องนี้เลย!""
 host_dinner_events.3041.a:0 "ข้าจะปล่อยท่านไป เพื่อแลกกับบุญคุณ"
 host_dinner_events.3041.b:0 "ความลับสำหรับท่านและข้า"
 host_dinner_events.3041.c:0 "ข้าจะไม่มีวันบอกใคร"
 host_dinner_events.3041.d:0 "ฮ่า! เจ้าถูกเปิดโปงแล้ว, เจ้า [pie_eater_scope.Custom2('InsultNoun', ROOT.Char)] [pie_eater_scope.Custom2('InsultAdjective', ROOT.Char)]."
 host_dinner_events.3041.e:0 "ข้าขอลองได้ไหม?"
 host_dinner_events.3041.f:0 "มาแบ่งกันเถอะ!"
 host_dinner_events.3050.title:0 "ไม่อยากอาหาร"
 host_dinner_events.3050.desc:0 "อาหารเย็นนี้อร่อยจนตายได้ แต่ขณะที่พ่อครัวยังคงกองอาหารสูงขึ้นเรื่อยๆ ข้าสังเกตเห็นว่า [non_eater_scope.Custom2('MyCharacterIntroduction', ROOT.Char)] แทบไม่ได้แตะต้องสิ่งที่ [non_eater_scope.GetSheHe] ตักใส่จานของ [non_eater_scope.GetHerHis] เลย\n\nแม้ว่าการขาดความอยากอาหารจะเป็นเรื่องปกติในเวลาอื่น แต่ [stop_host_scope.GetName] ดูเหมือนจะรู้สึกขุ่นเคืองที่สมาชิกในคณะผู้ติดตามของข้ากำลังเขี่ยและจิ้มอาหารของพวกเขา"
 host_dinner_events.3050.a:0 ""กินอะไรสักอย่างเพื่อเห็นแก่ [ROOT.Char.GetFaith.HighGodNamePossessive]!""
 host_dinner_events.3050.convinced_to_eat:0 "ท่านโน้มน้าวให้ [non_eater_scope.GetHerHim] กิน"
 host_dinner_events.3050.annoyed_courtier:0 "ท่าน ทำให้ [non_eater_scope.GetHerHim] รำคาญ"
 host_dinner_events.3050.b:0 "ข้าจะแก้ตัวให้ [non_eater_scope.GetHerHim]"
 host_dinner_events.3060.title:0 "ของหวานแสนอร่อย"
 host_dinner_events.3060.desc:0 "แท้จริงแล้วอาหารเย็นนี้เป็นที่น่าพอใจ ข้าได้ลิ้มลองอาหารคาวหวานทุกประเภท แต่ไม่มีอะไรที่ ทำให้ความอยากอาหารของข้าหลงใหลได้เท่ากับ [stop_host_scope.Custom('GetExpensiveDessert')] อันเลิศรสเหล่านี้!\n\nไม่ว่าข้าจะกินกี่ชิ้น ไม่ว่าข้าจะลิ้มรสชาติของมันมากแค่ไหน มันก็ไม่เพียงพอที่จะ ทำให้ข้าลืมมันได้ ข้าพบว่าตัวเองหลงใหลไปกับมันใน แต่ละคำ รสชาติระเบิดในปากของข้า ทำให้ข้าเข้าใกล้การสัมผัส [ROOT.Char.GetFaith.PositiveAfterLife] มากขึ้นอีกก้าว\n\nแม้ว่าท้องของข้าจะแน่นและเสื้อผ้าของข้าจะตึง แต่ข้าก็รู้สึกอยากเอื้อมมือไปหยิบอีก"
 host_dinner_events.3060.a:0 "มันดีเกินกว่าจะไม่ทำ!"
 host_dinner_events.3060.satisfying_dessert:0 "ท่านพอใจ"
 host_dinner_events.3060.too_much_dessert:0 "ท่านกินของหวานมากเกินไป"
 host_dinner_events.3060.b:0 "ไม่ ข้าต้องหยุด"
 host_dinner_events.3061.title:0 "หัวใจทรยศ"
 host_dinner_events.3061.desc:0 "ข้ากินอาหารค่ำมื้อสุดท้ายเสร็จ และข้าก็ได้กินจนอิ่มจริงๆ ข้าเข้านอนอย่างพอใจ แม้จะอึดอัดเล็กน้อย\n\nขณะที่ข้านอนอยู่ที่นั่น ข้ารู้สึกถึงความหวานที่มาถึงหัวใจของข้าและ #EMP ตุ้บ!#! แรงขึ้นเล็กน้อย ความรุนแรงเพิ่มขึ้นใน แต่ละจังหวะ แรงขึ้นและเร็วขึ้น ข้ารู้สึกว่าหัวใจของข้ากำลังจะระเบิดออกจากอก เหงื่อเย็นไหลท่วมตัว และคอของข้าแห้งผากเมื่อลมหายใจของข้าตื้นและเร็วเหมือน [ROOT.Char.Custom('GetAnimalType')] ที่จนมุม!\n\nจากนั้น ทันใดนั้น ทุกอย่างก็หยุดลง"
 host_dinner_events.3061.a:0 "มันต้องเป็นยาพิษ!"
 host_dinner_events.3070.title:0 "เรื่องเล่าสำหรับ [potential_friend_scope.GetFirstNameNoTooltip]"
 host_dinner_events.3070.desc:0 "ค่ำคืนแห่งความรื่นเริงอีกคืนหนึ่งใกล้จะสิ้นสุดลง และข้าพบว่าตัวเองติดอยู่ในการสนทนากับ [potential_friend_scope.GetName] ท่ามกลางผู้คนทั้งหมด\n\nก่อนที่ข้าจะรู้ตัว ห้องก็เงียบลงยกเว้นการสนทนาของเรา และทุกคนต่างรอฟังคำพูดต่อไปของข้า แม้จะน่าอึดอัดเล็กน้อย แต่ข้าแน่ใจว่าข้าสามารถเล่าเรื่องที่ทุกคนที่นี่จะต้องพอใจได้!"
 host_dinner_events.3070.a:0 "เรื่องเศร้า"
 host_dinner_events.3070.boring_story:0 "เรื่องเล่าของท่านน่าเบื่อ"
 host_dinner_events.3070.b:0 "เรื่องเบาๆ!"
 everyone_at_the_dinner:0 "ตัวละครทุกคนในงานเลี้ยงอาหารค่ำ"
 host_dinner_events.3070.story_was_impressive:0 "เรื่องเล่าของท่านน่าประทับใจ"
 host_dinner_events.3080.title:0 "สำลัก!"
 host_dinner_events.3080.desc:0 "ทุกคนกำลังสนุกสนานในงานเลี้ยงอาหารค่ำ และข้าเล่าเรื่องตลกในตำนานของข้าอีกเรื่องหนึ่ง ซึ่งเรียกเสียงหัวเราะและเสียงปรบมือ... และเสียงไอ\n\nข้ามองไปรอบๆ และเห็น [choking_character_scope.GetName] กำคอของ [choking_character_scope.GetHerHis] แน่นและไออย่างหนัก หน้าแดงก่ำ ดูเหมือนว่าเรื่องตลกของข้าอาจจะดีเกินไปสำหรับ [choking_character_scope.GetHerHim]!\n\nข้าสามารถกระโดดเข้าไปช่วยได้แน่นอน แต่นั่นเป็นเรื่องที่ข้าต้องกังวลจริงๆ หรือ?"
 host_dinner_events.3080.a:0 "ข้าสามารถช่วย [choking_character_scope.GetHerHim] ได้!"
 host_dinner_events.3080.failed_to_save_them:0 "ท่านล้มเหลวในการช่วย [choking_character_scope.GetFirstName]"
 host_dinner_events.3080.b:0 "นี่ไม่ใช่ปัญหาของข้าจริงๆ"
 host_dinner_events.3081.title:0 "ชีวิตที่ได้รับการช่วยเหลือ"
 host_dinner_events.3081.desc:0 "ข้าลุกขึ้นและตบหลัง [choking_character_scope.GetName] อย่างแรงซ้ำแล้วซ้ำเล่า และขณะที่ [choking_character_scope.GetSheHe] เริ่มหน้าเขียว ก้อนอาหารกูร์เมต์ที่น่าขยะแขยงก็ตกลงไปในซอสสมุนไพรราคาแพงพร้อมเสียงดังสแปลช\n\n"โอ้ ขอบคุณ! ท่านได้ช่วยชีวิตในวันนี้ [visiting_liege.GetTitleAsNameNoTooltip|U] ของข้า! ข้าจะเป็นหนี้บุญคุณท่านตลอดไป""
 host_dinner_events.3081.a:0 ""ท่านไม่ได้ติดหนี้อะไรข้านอกจากความเป็นเพื่อนของท่าน""
 host_dinner_events.3081.b:0 ""ใช่ ท่านติดหนี้ชีวิตข้า""
 host_dinner_events.1040.title:0 "เกมกระดานน่าเบื่อ"
 host_dinner_events.1040.desc:0 "งานเลี้ยงมาแล้วก็ไปทุกคืนตั้งแต่ [visiting_liege.GetName] มาถึง และทุกเย็นหลังจากกินจนอิ่ม [visiting_liege.GetSheHe] ก็หายเข้าไปในห้องของ [visiting_liege.GetHerHis] ตลอดทั้งเย็น ทิ้งให้ข้าอยู่กับความคิดของข้าเพียงลำพัง\n\nช่วงหลังมานี้ ข้ารู้สึกอยากนำกระดานหมากรุกเก่าออกมาและวางเดิมพันกับ [visiting_liege.GetTitleAsNameNoTooltip|U] ของข้า รางวัลจะเป็นอะไรนั้นข้ายังไม่ได้ตัดสินใจ แต่ข้าแน่ใจว่าเราสามารถคิดอะไรบางอย่างได้"
 host_dinner_events.1040.a:0 "มาเล่นกันเถอะ!"
 host_dinner_events.1040.b:0 "อย่าเลย"
 host_dinner_events.1041.title:0 "การท้าทาย"
 host_dinner_events.1041.desc:0 "ขณะที่ข้าทานอาหารเสร็จ กระดานอีกอันก็ถูกวางลงตรงหน้าข้า แต่คราวนี้แทนที่จะเป็นอาหาร มันกลับเต็มไปด้วยตัวหมากเกมเล็กๆ\n\n"เจ้าเหนือหัวของข้า แน่นอนว่าท่านรู้ว่าข้ามีชื่อเสียงในฐานะหนึ่งในผู้เล่นหมากรุกที่เก่งที่สุดของ [stop_host_scope.GetPrimaryTitle.GetNameNoTierNoTooltip]! แต่ข้าไม่ต้องการเล่นเพียงเพื่อความสนุก บางทีเราอาจจะ ทำให้มันน่าสนใจขึ้นโดยการวางเดิมพัน..."\n\n[stop_host_scope.GetName] ยิ้มให้ข้า คลึงตัวหมากระหว่างนิ้วของ [stop_host_scope.GetHerHis] อย่างเกียจคร้าน กระตือรือร้นที่จะแข่งขัน"
 host_dinner_events.1041.a:0 "ตาข้าเดิน [stop_host_scope.GetFirstNameNoTooltip]"
 host_dinner_events.1041.b:0 "ข้าจะไม่ทำลายค่ำคืนของข้าด้วยสิ่งนี้"
 host_dinner_events.1042.title:0 "บุญคุณ"
 host_dinner_events.1042.desc:1 "เมื่อขุนล้มลง ผู้ชนะก็ถูกประกาศ\n\nข้าได้รับบุญคุณจาก [bg_loser.GetName] และรางวัลที่ไม่แน่นอนของข้าก็พร้อมให้เลือกได้ตลอดเวลา"
 host_dinner_events.1042.desc.loser:0 "เมื่อขุนล้มลง ผู้ชนะก็ถูกประกาศ\n\nข้าพ่ายแพ้ให้กับ [bg_victor.GetName] อย่างสิ้นเชิง และรางวัลที่ไม่แน่นอนของ [bg_victor.GetHerHis] ก็พร้อมให้เลือกได้ตลอดเวลา"
 host_dinner_events.1042.a:0 "ยอดเยี่ยม"
 host_dinner_events.1042.a.bad:0 "บ้าจริง!"
 host_dinner_events.1050.title:0 "คลังว่างเปล่า"
 host_dinner_events.1050.desc:0 "พ่อครัวของข้าแจ้งว่าคลังอาหารดูเหมือนจะเหลือน้อยลงมาก และส่วนผสมที่แพงและแปลกใหม่ของข้าหลายอย่างก็หมดไปนานแล้ว\n\nต้องใช้โชคเล็กน้อยในการเติมคลังอาหาร และข้ารู้สึกใจสั่นอย่างประหม่าเพียงแค่คิดถึงการซื้อขนมปังและเนย [visiting_liege.GetName] อาจจะผิดหวังกับการแสดงอันน้อยนิดของเราในเย็นวันนี้ แต่ข้าสามารถทำอะไรได้มากกว่านี้อีกหรือ?"
 host_dinner_events.1050.a:0 "ขนมปังกับน้ำก็แล้วกัน"
 host_dinner_events.1050.b:0 "เราสามารถจ่ายได้ดีกว่านี้"
 host_dinner_events.1050.c:0 "ข้ามีเส้นสายที่ข้าสามารถใช้ได้!"
 host_dinner_events.3090.title:0 "กะโหลกศีรษะ"
 host_dinner_events.3090.desc:0 "ข้าสนุกสนานที่นี่ แต่ข้าไม่สามารถปล่อยให้ตัวเองไขว้เขวจากภารกิจของข้าในการเป็น [ROOT.Char.GetTitleAsNameNoTooltip|U] ที่น่าเกรงขามและเป็นที่เคารพนับถือได้!\n\nคุกใต้ดินของ [stop_host_scope.GetNamePossessive] เต็มไปด้วยคนร้ายและคนทรยศ และพวกเขากำลังดูดเงินจากคลังของราชบัลลังก์ด้วยความต้องการอาหารและน้ำที่ไม่หยุดหย่อน บางทีข้าอาจจะทำบุญคุณให้กับเจ้าภาพผู้มีน้ำใจของข้าและสร้างความหวาดกลัวในใจของ [stop_host_scope.GetHerHis] ได้ในคราวเดียวโดยการประหารนักโทษและดื่ม [stop_host_scope.Custom('RegionalAlcoholicDrink')] จากกะโหลกศีรษะที่กลวงของพวกเขา"
 host_dinner_events.3090.a:0 "ความคิดที่ยอดเยี่ยม"
 host_dinner_events.3090.skobletted_my_prisoner:0 "[visiting_liege.GetName] ทำให้กะโหลกของ [skoblet_target.GetFirstNamePossessive] กลวงเป็นถ้วย"
 host_dinner_events.3090.b:0 "นี่มันน่าขยะแขยง"
 host_dinner_events.3100.title:0 "ความฟุ่มเฟือยที่น่าสงสัย"
 host_dinner_events.3100.desc:0 "ข้าเพลิดเพลินกับเวลาของข้าที่นี่ แต่ข้าอดไม่ได้ที่จะสังเกตว่าข้าได้ลิ้มรสความฟุ่มเฟือยทุกวันขณะที่ข้าอยู่ที่นี่ บางที [stop_host_scope.GetName] อาจจะร่ำรวยกว่าที่ข้าคิดไว้ในตอนแรกอย่างมาก\n\nหากการครุ่นคิดของข้าเป็นจริง มันจะหมายความว่า [stop_host_scope.GetTitleAsNameNoTooltip|U] เป็นหนี้ทองคำข้ามากกว่าที่ [stop_host_scope.GetSheHe] จ่ายมาจนถึงตอนนี้ และข้าสามารถเรียกร้องการสกัดได้"
 host_dinner_events.3100.a:0 "ต้องชำระเงินย้อนหลัง"
 host_dinner_events.3100.b:0 "[stop_host_scope.GetSheHe|U] ต้องจ่ายมากขึ้นในอนาคต"
 host_dinner_events.3100.c:0 "ข้าจะปล่อยเรื่องนี้ไป"
 host_dinner_events.3101.title:0 "ความฟุ่มเฟือยที่ต้องเสียภาษี"
 host_dinner_events.3101.desc.intro:0 "ข้าเป็นเจ้าภาพที่ยอดเยี่ยมที่สุดสำหรับเจ้าเหนือหัวของข้า ให้ [visiting_liege.GetHerHim] ทุกสิ่งที่ [visiting_liege.GetSheHe] ปรารถนาและเสิร์ฟเฉพาะอาหารที่ดีที่สุดในคลังของข้า\n\nอย่างไรก็ตาม ดูเหมือนว่านี่เป็นความผิดพลาด เนื่องจาก [visiting_liege.GetSheHe] ตอนนี้เชื่อว่าทักษะการเป็นเจ้าภาพที่เหนือกว่าของข้าเกิดจากการหลีกเลี่ยงภาษี!"
 host_dinner_events.3101.desc:0 "$host_dinner_events.3101.desc.intro$\n\n[visiting_liege.GetSheHe|U] กำลังเรียกร้องให้ข้าจ่ายเงินก้อนหนึ่งของ "สิ่งที่ข้าเป็นหนี้" ทันที"
 host_dinner_events.3101.a:0 "ก็ได้"
 host_dinner_events.3101.b:0 "นี่มันอุกอาจ!"
 host_dinner_events.3102.title:0 "$host_dinner_events.3101.title$"
 host_dinner_events.3102.desc:0 "$host_dinner_events.3101.desc.intro$\n\n[visiting_liege.GetName] ตอนนี้เรียกร้องให้เพิ่มภาษีของข้าจากนี้ไป!"
 host_dinner_events.3102.a:0 "ข้าจะยอมรับ"
 host_dinner_events.3102.b:0 "ไปที่ [ROOT.Char.GetFaith.NegativeAfterLife]!"
 host_dinner_events.3110.title:0 "นักพเนจรผู้มีพรสวรรค์"
 host_dinner_events.3110.desc.intro:0 "ดูเหมือนว่าข้าไม่ใช่แขกผู้มีเกียรติเพียงคนเดียวในราชสำนักของ [stop_host_scope.GetNamePossessive]! เย็นวันนี้ข้าได้นั่งข้าง [talented_pool_character.GetName] ที่น่าทึ่ง และการสนทนาของเรา ทำให้ข้ารู้สึกปลาบปลื้มอย่างยิ่ง\n\n"
 host_dinner_events.3110.desc.mid.claim:0 ""อนิจจา ข้าก็ควรจะอยู่ในชนชั้นเจ้าของที่ดิน เช่นกัน [visiting_liege.GetTitleAsNameNoTooltip|U] ผู้ยุติธรรม หากโลกนี้เป็นสถานที่ที่ยุติธรรม การอ้างสิทธิ์อันชอบธรรมของข้าจะได้รับการยอมรับ และข้าก็จะมีห้องอาหารขนาดใหญ่ไว้บริการท่าน เช่นกัน""
 host_dinner_events.3110.desc.mid.martial:0 ""ทักษะของข้าในเรื่องสงครามเป็นตำนาน [visiting_liege.GetTitleAsNameNoTooltip|U] หากท่านต้องการข้า ข้ายินดีที่จะมอบทักษะเหล่านั้นให้ท่าน!""
 host_dinner_events.3110.desc.mid.learning:0 ""ไม่มีใครเข้าใจโลกและ [talented_pool_character.GetFaith.ReligiousText] เหมือนข้า [visiting_liege.GetTitleAsNameNoTooltip|U] ผู้มีเมตตา หากท่านต้องการข้า ข้าจะรู้สึกเป็นเกียรติที่จะมอบทักษะของข้าให้กับราชสำนักของท่าน""
 host_dinner_events.3110.desc.mid.statecraft:0 ""ข้ามีความเชี่ยวชาญในการปกครอง แต่ทักษะของข้ากำลังสูญเปล่าขณะที่ข้าพเนจรไปตามที่ต่างๆ หากท่านต้องการข้าในราชสำนักของท่าน ข้าจะรู้สึกเป็นเกียรติที่จะเรียกท่านว่า [visiting_liege.GetTitleAsNameNoTooltip|U] ของข้า""
 host_dinner_events.3110.desc.outro:0 "\n\nเป็นเรื่องยากที่จะพบบุคคลที่น่าทึ่ง เช่นนี้โดยไม่มีบ้านเป็นของตัวเอง แต่มีที่ว่างในราชสำนักของข้าสำหรับ [talented_pool_character.GetHerHim] หรือไม่?"
 host_dinner_events.3110.a:0 "แน่นอนว่ามี!"
 host_dinner_events.3110.b:0 "ไปให้พ้น"
