 cultural_festival.9060.t: "การแสดงระดับตำนาน"
 cultural_festival.9060.desc: "ในความรื่นเริง ข้าพเจ้าเดินเตร่ไปในเทศกาลและในที่สุดก็มาพบคณะนักแสดงกลุ่มหนึ่ง พวกเขาดูเหมือนกำลังซ้อมอะไรบางอย่าง และข้าพเจ้าบอกได้จากท่าทางของพวกเขาว่าข้าพเจ้ากำลังจะได้ชมความบันเทิงอันยอดเยี่ยม\n\nความคิดผุดขึ้นมาว่าคณะนักแสดงอาจได้รับประโยชน์จากเนื้อหาใหม่ๆ แท้จริงแล้ว [ROOT.Char.GetPromotedLegend.GetName] จะเป็นเนื้อหาที่เหมาะอย่างยิ่งสำหรับกลุ่มนักแสดงละครที่มีความสามารถ เช่นนี้"
 cultural_festival.9060.a: "พวกเขาควรแสดงตำนานของข้าพเจ้า!"
