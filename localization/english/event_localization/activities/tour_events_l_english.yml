 tour_general.3001.b.harmful_sideeffects.tt:0 "เนื่องจากบุคลิกภาพของ[stop_host_scope.GetShortUINamePossessive] สิ่งนี้อาจมีผลร้ายแรงถึงชีวิต"
 tour_general.3001.b_liege_decides.tt:0 "[visiting_liege.GetShortUIName] ตัดสินใจว่าจะเกิดอะไรขึ้นต่อไป"
 tour_general.3001.c:0 "[tour_general_3001_target_courtier.GetSheHe|U] #EMP สามารถ#! หายตัวไปในตอนกลางคืนได้..."
 tour_general.3001.c.tt_success:0 "ถูกลักพาตัวไป"
 tour_general.3001.c.tt_failure:0 "ความพยายามล้มเหลว"
 tour_general.3001.c.tt_failure.desc:0 "ความล้มเหลวของท่านไม่ได้ถูกมองข้าม"
 tour_general_3001_stolen_courtier:0 "[tour_general_3001_target_courtier.GetFirstNameNoTooltip] เข้าร่วมราชสำนักของข้าโดยไม่มีใครสังเกตเห็น"
