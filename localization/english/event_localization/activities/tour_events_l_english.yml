 tour_general.9998.desc:0 "[host.GetName] จะไม่มาเยี่ยมท่านอีกต่อไปในการเดินทางหลวงของ [host.GetHerHis]"
 tour_general.9998.a:0 "ช่างโชคร้ายเสียนี่กระไร"

