# Host Dinner
 host_dinner_events.1001.title:0 "งานเลี้ยงอาหารค่ำอันแห้งแล้ง"
 host_dinner_events.1001.desc:0 "ข้ากำลังสนุกสนานกับ [visiting_liege.GetName] ค่ำคืนของเราจนถึงตอนนี้เต็มไปด้วยความสุขสำราญและการหยอกล้ออย่างเมามาย แม้ว่าดูเหมือนว่าข้าจะใจกว้างเกินไปกับคลังเครื่องดื่มแอลกอฮอล์ของข้า เมื่อคนรับใช้แอบมากระซิบว่า [ROOT.Char.Custom('RegionalAlcoholicDrink')] ทุกหยดสุดท้ายได้หมดลงแล้ว!\n\nเจ้าเหนือหัวของข้านั่งอย่างใจร้อนอยู่ที่ปลายโต๊ะอีกด้าน หน้าแดงก่ำเหมือนทารกแรกเกิด กระแทกแก้วของ [visiting_liege.GetHerHis] ลงบนโต๊ะ\n\n"มา! คืนนี้ยังอีกยาว! เหล้าอยู่ไหน?""
 host_dinner_events.1001.a:0 ""เติมคลัง!"
