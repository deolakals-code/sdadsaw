 cultural_festival.9006.desc:0 "ข้าพเจ้าเปิดหีบและต้องหน้าแดงกับสิ่งที่พบอยู่ข้างใน\n\nวัตถุรูปองคชาตนี้ทำจากไม้เนื้อดี ไม่เหมือนสิ่งใดที่ข้าพเจ้าเคยเห็น — มันดูไม่เหมือน #EMP เครื่องมือ#! ของมนุษย์ด้วยซ้ำ แต่เหมือนบางสิ่งที่ข้าพเจ้าจินตนาการว่าอาจเป็นของสัตว์ในตำนาน\n\nเป็นของที่วิปริตอย่างแท้จริง"
