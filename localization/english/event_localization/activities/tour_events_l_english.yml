 cultural_festival.9001.c:0 "นี่มันเสียแรงเกินไป"
 cultural_festival.9002.title:0 "บันทึกลับ"
 cultural_festival.9002.desc:0 "ที่ซ่อนอยู่หลังหีบไม้เนื้อแข็งนั้นไม่มีอะไรนอกจากบันทึกเก่าๆ ที่เต็มไปด้วยฝุ่น พร้อมด้วยกระดาษส่วนเกินที่ยัดไว้อย่างลวกๆ ระหว่างหน้ากระดาษ\n\nข้าพเจ้าเปิดบันทึกและไม่เห็นอะไรนอกจากภาษาที่ไร้สาระ สัญลักษณ์แปลกประหลาด และสมการทางคณิตศาสตร์ ซึ่งดูเหมือนจะไม่เกี่ยวข้องกับสิ่งอื่นใดในหนังสือเล่มนี้\n\nนี่ต้องเป็นกุญแจในการไขปริศนาบางอย่าง แต่เป็นปริศนาอะไรกันแน่?"
