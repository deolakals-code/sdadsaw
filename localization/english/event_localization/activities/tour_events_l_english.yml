 host_dinner_events.1001.c:0 "บางทีอาจถึงเวลาเปลี่ยนสถานที่"
 host_dinner_events.1001.d:0 "ข้าจะเติมให้... เพื่อแลกกับบุญคุณ"
 host_dinner_events.1002.title:0 "สักไพนต์สองไพนต์"
 host_dinner_events.1002.desc:0 "เจ้าภาพของข้า [stop_host_scope.GetName] ได้พาข้าออกจากบ้านของ [stop_host_scope.GetHerHis] ไปยังโรงเตี๊ยมท้องถิ่น รอบตัวข้าเห็น แต่พวกน่าสังเวชและอ่อนแอกำลังดื่มและมั่วสุม แต่ [stop_host_scope.GetTitledFirstNameNoTooltip] รับรองกับข้าว่า [ROOT.Char.Custom('RegionalAlcoholicDrink')] ที่เสิร์ฟในสถานประกอบการแห่งนี้คุ้มค่าที่จะตายเพื่อลิ้มลอง\n\nเมื่อรอบแรกผ่านริมฝีปากข้า ข้ารู้สึกมีชีวิตชีวา เครื่องดื่มกระแทกเข้ามาเหมือนอิฐตัน และข้ารู้สึกว่าคืนนี้จะเป็นคืนแห่งการเฉลิมฉลองที่ไม่สิ้นสุด"
 host_dinner_events.1002.a:0 "ท่านทำได้ดีเยี่ยมจริงๆ [stop_host_scope.GetFirstNameNoTooltip]!"
 host_dinner_events.1002.b:0 "เราควรยับยั้งชั่งใจบ้าง"
 host_dinner_events.1002.c:0 "ข้าจะดื่มจนตาย"
 drank_too_much_toast:0 "ท่านดื่มจนเมามายไม่ได้สติ"
 host_dinner_events.1003.title:0 "[visiting_liege.GetTitleAsNameNoTooltip|U] ผู้หลับใหล"
 host_dinner_events.1003.desc:0 "[visiting_liege.Custom2('MyCharacterIntroduction', ROOT.Char)] ในที่สุดก็ได้เข้านอนและกำลังพักผ่อนอย่างสงบในห้องของ [visiting_liege.GetHerHis] ไม่ต้องสงสัยเลยว่ากำลังฝันถึงการ ทำให้คลังอาหารและเครื่องดื่มที่ข้าเหลืออยู่หมดไปอีก\n\nนี่อาจเป็นโอกาสที่ดีที่จะ ทำให้เจ้าเหนือหัวของข้าประหลาดใจ บางทีอาจเป็นความบันเทิงยามดึก หรือบางสิ่งที่น่าพอใจสำหรับ [visiting_liege.GetHerHim] เมื่อตื่นขึ้น..."
 host_dinner_events.1003.a:0 "มาสร้างเรื่องผีหลอกกันเถอะ!"
 host_dinner_events.1003.b:0 "[ROOT.Char.Custom('RegionalAlcoholicDrink')|U] เป็นของขวัญที่ดีเสมอ!"
 host_dinner_events.1003.c:0 "เค้กฮาชิชจะ ทำให้ [visiting_liege.GetHerHim] พอใจ"
 host_dinner_events.1003.d:0 "สัมผัสของนางบำเรอเป็นวิธีปลุกที่ดี"
 host_dinner_events.1003.e:0 "การอยู่เป็นเพื่อนของข้าจะ ทำให้ [visiting_liege.GetHerHim] พอใจอย่างแน่นอน"
 host_dinner_events.1004.title:0 "การตื่นอันน่าสะพรึงกลัว"
 host_dinner_events.1004.desc.intro:0 "ข้านอนอย่างสงบในห้องนอนที่ดีที่สุดของ [stop_host_scope.GetTitledFirstNamePossessive] ไม่มีเรื่องทะเลาะหรือกังวลในใจ ทันใดนั้น ข้าก็ถูกปลุกให้ตื่นจากนิทราอันไร้ฝันด้วยเสียงหัวเราะดังและน่ากลัวที่ดังมาจากปลายโถง\n\nข้าออกมาอย่างไม่เต็มใจ มือที่ไม่มั่นคงของข้าสั่นเทียนในแสงสลัว และจ้องมองไปตามโถง"
 host_dinner_events.1004.desc.ghost:0 "ข้าสาบานได้ว่าสิ่งที่ข้าเห็นยืนอยู่ที่ปลายสุดของทางเดินมืดทึบนั้นคือวิญญาณชั่วร้ายบางชนิด มันกระซิบเรียกชื่อข้า บางทีอาจต้องการลากข้าลงไปใน [ROOT.Char.GetFaith.NegativeAfterLife]! ไม่ว่ามันต้องการอะไร ข้าต้องลงมือเพื่อช่วยตัวเอง!"
 host_dinner_events.1004.desc.cynic:0 "ความกลัวของข้าหายไปทันทีเมื่อข้าเห็นว่ามันเป็นเพียงคนรับใช้ที่ยืนอยู่พร้อมผ้าลินินเนื้อดีคลุมตัว เขาทำเสียงและเรียกชื่อข้า แต่แม้ แต่เด็กก็บอกได้ว่านี่ไม่ใช่วิญญาณ\n\nนี่คือความพยายามสร้างความขบขันของ [stop_host_scope.GetNamePossessive] ไม่ต้องสงสัย"
 host_dinner_events.1004.a:0 "ร้องขอความช่วยเหลือ!"
 host_dinner_events.1004.b:0 "ปิดกั้นประตู!"
 host_dinner_events.1004.c:0 "สนุกอะไรอย่างนี้!"
 host_dinner_events.1004.enjoyed_spooky_ghost:0 "[visiting_liege.GetName] สนุกกับการแกล้ง"
 host_dinner_events.1004.d:0 "[stop_host_scope.GetFirstNameNoTooltip] รบกวนการนอนของข้าเพื่อสิ่งนี้หรือ?"
 host_dinner_events.1005.title:0 "ผีแห่ง [ROOT.Char.GetCurrentLocation.GetNameNoTooltip]"
 host_dinner_events.1005.desc:0 "ดูเหมือนว่าการแกล้งของข้าจะได้ผลดีเกินไป เพราะข้าได้ยิน [visiting_liege.GetName] กรีดร้องเหมือน [visiting_liege.Custom('GirlBoy')] ตัวน้อย และเรียกให้ข้าไปช่วย [visiting_liege.GetHerHim]\n\nข้ารีบวิ่งไปที่ห้องของ [visiting_liege.GetHerHis] และพบว่า [visiting_liege.GetHerHim] หน้าซีดเหมือนกระดาษ ชี้ไปที่ "ผี" ที่ปลายสุดของโถง\n\n"โอ้ ขอบคุณพระเจ้าที่ท่านอยู่ที่นี่! มีวิญญาณชั่วร้ายพยายามลากข้าไปที่ [visiting_liege.GetFaith.NegativeAfterLife]!""
 host_dinner_events.1005.a:0 "ช่างโง่เขลาเสียนี่กระไร!"
 host_dinner_events.1004.mocked_me:0 "ข้าถูกเยาะเย้ย"
 host_dinner_events.1005.b:0 "ข้าสามารถขับไล่วิญญาณนี้ได้ เพื่อแลกกับบุญคุณ"
 host_dinner_events.1004.hooked_me:0 "[stop_host_scope.GetName] ขับไล่วิญญาณ"
 host_dinner_events.1005.c:0 "จงไปเสียเถิด วิญญาณ!"
 host_dinner_events.1006.title:0 "การปลุกที่ไม่คาดคิด"
 host_dinner_events.1006.desc.intro:1 "ข้าตื่นจากการหลับใหลหลังจากค่ำคืนอันสงบสุขอีกคืนที่พักอยู่กับ [stop_host_scope.GetName] ขณะที่ข้าได้สติกลับคืนมา ข้ารู้สึกถึงบางสิ่งที่หนักอยู่ข้างๆ ซึ่งก่อนหน้านี้ไม่มี\n\n"
 host_dinner_events.1006.desc.alcohol:0 "ถัง [stop_host_scope.Custom('RegionalAlcoholicDrink')] ทั้งถังวางอยู่ข้างข้าเหมือนคนรัก ส่งเสียงกระฉอกและเอี๊ยดอ๊าดตามความเต็มเปี่ยมของมันทุกครั้งที่ข้าขยับตัวเล็กน้อย"
 host_dinner_events.1006.desc.weed:0 "ข้างๆ ข้ามีเค้กฮาชิชมากพอที่ข้าจะกินน้ำหนักตัวของข้าเองได้ถ้าข้ามีความปรารถนา เช่นนั้น!"
 host_dinner_events.1006.desc.hedonist:0 "ข้ารู้สึกถึงสัมผัสที่คุ้นเคยของ [concubine_scope.GetWomanMan] ที่กำลังใช้นิ้วของ [concubine_scope.GetHerHis] ลูบไล้หน้าอกของข้าอย่างสงสัยใคร่รู้"
 host_dinner_events.1006.desc.vanity:0 "ข้าหันไปเห็น [stop_host_scope.GetFirstNameNoTooltip] นั่งอยู่ที่ปลายเตียงของข้า แต่งกายเต็มยศ\n\n"อรุณสวัสดิ์ [ROOT.Char.GetTitleAsNameNoTooltip] ของข้า ข้าคิดว่าเป็นการสมควรที่จะมอบของขวัญให้ท่าน และจะมีของขวัญใดดีไปกว่าของขวัญแห่งการสนทนาของข้า?""
 host_dinner_events.1006.desc.outro:0 "\n\nของขวัญนี้ไม่คาดคิดอย่างแน่นอน แต่มันเป็นสิ่งที่น่าพอใจที่จะตื่นขึ้นมาเจอจริงๆ หรือ?"
 host_dinner_events.1006.a:0 "ช่างเป็นวิธีตื่นนอนที่ยอดเยี่ยมอะไร เช่นนี้"
 host_dinner_events.1006.liked_gift:0 "[visiting_liege.GetTitledFirstName] ชอบของขวัญ"
 host_dinner_events.1006.b:0 "ออกไปให้พ้นสายตาข้า!"
 host_dinner_events.1006.refused_gift:0 "[visiting_liege.GetTitledFirstName] ถูกดูหมิ่น"
 host_dinner_events.3001.title:0 "ข้อเสนอที่น่าสนใจ"
 host_dinner_events.3001.desc.intro:0 "ข้ากำลังเพลิดเพลินกับอาหารค่ำอันเงียบสงบกับ [stop_host_scope.GetName] และ [lusty_spouse_scope.GetName] ผู้เป็น [stop_host_scope.Custom2('RelationToMeShort', lusty_spouse_scope)] ของ [stop_host_scope.GetHerHis]\n\nเพียงครู่เดียวหลังจาก [stop_host_scope.GetNameNoTooltip] ขอตัว [stop_host_scope.GetHerselfHimself] ออกไป [lusty_spouse_scope.GetNameNoTooltip] ก็โผเข้าหาข้าดุจสุนัขบ้า!"
 host_dinner_events.3001.desc.not_into_it:0 "ข้าพยายามผลักไสไอ้คนเสื่อมทราม [lusty_spouse_scope.Custom2('InsultAdjective', ROOT.Char)] นี่ออกไป, แต่ [lusty_spouse_scope.GetSheHe] ก็ช่างดึงดันที่จะบิดเบือนจิตใจของข้าด้วยความคิดอันไม่บริสุทธิ์"
 host_dinner_events.3001.desc.into_it:0 "ข้าประหลาดใจกับการรุกคืบของ [lusty_spouse_scope.GetHerHis] แต่ข้าอดไม่ได้ที่จะรู้สึกว่ามือของข้าลูบไล้ไปทั่วร่างของ [lusty_spouse_scope.GetHerHis]"
 host_dinner_events.3001.desc.mid:0 "ข้าตัวแข็งด้วยความตกใจ ตกใจมากที่เพียงแค่ [stop_host_scope.GetFirstNameNoTooltip] ออกจากห้องไป [lusty_spouse_scope.GetFirstNameNoTooltip] ก็คิดที่จะคบชู้กับคนที่อยู่ใกล้ที่สุด"
 host_dinner_events.3001.desc.outro:0 "\n\n"โอ้ โปรดช่วยข้าให้พ้นจากความเบื่อหน่ายนี้ด้วยเถิด! [stop_host_scope.GetFirstNameNoTooltip] ไม่ใช่คนรักของข้า [stop_host_scope.GetSheHe] รักเหมือนท่อนไม้ พาข้าไป และรักข้าอย่างที่ [stop_host_scope.GetSheHe] ไม่เคยทำ""
 host_dinner_events.3001.a:0 "ด้วยความยินดี!"
 host_dinner_events.3001.b:0 "ข้าต้องบอก [stop_host_scope.GetTitledFirstNameNoTooltip] ทันที!"
 host_dinner_events.3001.c:0 "ข้าจะไม่บอก แต่ท่านติดหนี้ข้า"
 host_dinner_events.3001.d:0 "ออกไปจากตัวข้า อีแพศยาไร้ยางอาย!"
 host_dinner_events.3002.title:0 "[lusty_spouse_scope.GetFirstNameNoTooltip]: ผู้คบชู้"
 host_dinner_events.3002.desc:0 "ข้ากลับมาทานอาหารค่ำหลังจากพักผ่อนชั่วครู่ และพบว่า [lusty_spouse_scope.Custom2('MyCharacterIntroduction', ROOT.Char)] นั่งอยู่กับ [visiting_liege.GetName] อย่างอึดอัด\n\n"[ROOT.Char.GetTitledFirstNameNoTooltip] ข้าเกรงว่าข้ามีข่าวร้ายอย่างยิ่ง ขณะที่ท่านไม่อยู่ คนเสเพลไร้ยางอายผู้นี้พยายามชักชวนข้าให้มีความสัมพันธ์ฉันชู้สาว!""
 host_dinner_events.3002.a:0 "นี่เป็นเหตุผลสำหรับการหย่าร้าง"
 host_dinner_events.3002.b:0 "ให้เรื่องนี้อยู่ระหว่างเรา"
 host_dinner_events.3002.c:0 "ข้าจะแสร้งทำเป็นไม่ได้ยิน"
 host_dinner_events.3002.d:0 "ข้าจะไม่มีวันให้อภัย [lusty_spouse_scope.GetHerHim]"
 host_dinner_events.1007.title:0 "การแสดงอันน่าจดจำ"
 host_dinner_events.1007.desc:0 "ช่วงหลังมานี้ [visiting_liege.GetName] เริ่มเบื่อหน่ายในยามอยู่กับข้า บ่อยครั้งดูเหมือนจะอยู่ก้ำกึ่งระหว่างโลกแห่งความตื่นและความฝัน\n\nความคิดหนึ่งผุดขึ้นมา ในขณะที่ข้าเฝ้ามอง [visiting_liege.GetHerHim] เขี่ยอาหารของ [visiting_liege.GetHerHis] ไปมาอย่างเกียจคร้าน [visiting_liege.GetSheHe|U] มีชีวิตที่สมบูรณ์ บางที [visiting_liege.GetSheHe] อาจจะรู้สึกปลาบปลื้มหากเราจะจำลองวีรกรรมอันโด่งดังของ [visiting_liege.GetHerHis] ขึ้นมาใหม่ในรูปแบบของละคร!\n\nคำถามเดียวคือ ละครประเภทใดที่ [visiting_liege.GetNameNoTooltip] จะพบว่าน่าขบขันที่สุด?"
 host_dinner_events.1007.a:0 "ละครสงครามแน่นอน!"
 host_dinner_events.1007.b:0 "ละครตลกเกี่ยวกับการตายของศัตรูที่ [visiting_liege.GetHerHis] เกลียดชัง!"
 host_dinner_events.1007.c:0 "[visiting_liege.GetSheHe|U] จะต้องซาบซึ้งกับโศกนาฏกรรม"
 host_dinner_events.1007.d:0 "บางอย่างเกี่ยวกับความสุขของการ แต่งงาน!"
 host_dinner_events.1007.e:0 "นี่เป็นความคิดที่แย่มาก"
 host_dinner_events.1008.title:0 "$host_dinner_events.1007.title$"
 host_dinner_events.1008.desc.intro:0 "ดูเหมือนว่า [stop_host_scope.GetName] ได้ตัดสินใจจัดการแสดงเพื่อความบันเทิงของข้าในเย็นวันนี้ ข้านั่งอยู่ที่โต๊ะเลี้ยงอาหารรอคอยความบันเทิงอย่างใจจดใจจ่อ เมื่อ"
 host_dinner_events.1008.desc.mid.war_memory:0 "[stop_host_scope.GetNameNoTooltip] ปรากฏตัวต่อหน้าข้าในชุดเกราะ\n\n"จงดูเถิด! ข้าคือ [loser.GetName] ผู้ยิ่งใหญ่ และข้าจะส่งมอบ [visiting_liege.GetNameNoTooltip] ผู้น่ารังเกียจให้แก่ผู้สร้างของ [visiting_liege.GetHerHis] ด้วยตนเอง!"\n\nก่อนที่ข้าจะตอบสนอง ดาบไม้เล่มหนึ่งก็ถูกวางไว้ในมือข้า นี่คือการแสดงถึงช่วงเวลา [memory_performance_scope.GetDescription] อย่างไม่ต้องสงสัย"
 host_dinner_events.1008.desc.mid.dead_rival_memory:0 "[stop_host_scope.GetNameNoTooltip] ปรากฏตัวในชุด แต่งหน้าที่ไม่น่าดูและเสื้อผ้าที่ขาดรุ่งริ่ง\n\n"โอ้ อนิจจา! ข้าไม่สามารถยึดติดกับร่างมนุษย์ของข้าได้อีกต่อไป คำสาปแช่ง ข้าจะไม่มีวัน ทำให้ [visiting_liege.GetNameNoTooltip] อับอายอีก!"\n\nการแสดงเกี่ยวข้องกับเสียงการเคลื่อนไหวของลำไส้และเสียงความเจ็บปวดที่เยาะเย้ยมากมาย เป็นการจำลองช่วงเวลา [memory_performance_scope.GetDescription]"
 host_dinner_events.1008.desc.mid.dead_positive_relation_memory:0 "[stop_host_scope.GetNameNoTooltip] ปรากฏตัวในชุดเหมือน [dead_relation.GetName] อันเป็นที่รักของข้า\n\n"อนิจจา ข้าได้จากไปยัง [dead_positive_relation_memory_scope.dead_relation.GetFaith.PositiveAfterLife|U] ข้าคิดถึงเพียง [visiting_liege.GetNameNoTooltip] และช่วงเวลาอันแสนวิเศษทั้งหมดที่เราเคยมีร่วมกัน"\n\nการแสดงโศกนาฏกรรมอันซาบซึ้งที่จำลองช่วงเวลา [memory_performance_scope.GetDescription]"
 host_dinner_events.1008.desc.mid.marriage_memory:0 "[stop_host_scope.GetNameNoTooltip] ปรากฏตัวในชุดเกือบจะเหมือนกับ [spouse.GetName] ในวัน แต่งงานของเรา\n\n"แท้จริงแล้วนี่คือวันที่ยิ่งใหญ่ที่สุดในชีวิตของข้า! ข้าจะได้ แต่งงานกับ [visiting_liege.GetNameNoTooltip] ผู้วิเศษ!"\n\nข้าได้รับเชิญขึ้นไปบนเวทีเพื่อมอบมือของข้าให้กับ [stop_host_scope.GetName] แต่"
 host_dinner_events.1008.desc.outro:0 "ข้าสงสัยว่า ข้าควรจะตามใจสิ่งนี้หรือไม่?"
 host_dinner_events.1008.a:0 "ช่างวิเศษอะไร เช่นนี้!"
 host_dinner_events.1008.b:0 "นี่เป็นการดูหมิ่น!"
 host_dinner_events.3003.title:0 "อาหารอันโอชะท้องถิ่น"
 host_dinner_events.3003.desc:0 "อาหารค่ำเย็นนี้แตกต่างจากที่ข้าคุ้นเคยเล็กน้อย พ่อครัววางชามลงตรงหน้าข้าอย่างไม่ใส่ใจ และข้าก็สัมผัสได้ถึงกลิ่นที่ไม่เคยได้กลิ่นมาก่อนในชีวิตทันที\n\nอาหารจานนี้จากห้วงลึกของ [ROOT.Char.GetFaith.NegativeAfterLife] นั้นน่ารังเกียจต่อทุกประสาทสัมผัส สารสีเทาเหนียวๆ บางอย่างอยู่ในน้ำซุปฟองสีซีดของมันเหมือนหม้อห้องน้ำที่ไม่ได้รับการดูแล โดยมีสมุนไพรหนึ่งกิ่งวางอยู่ด้านบนในความพยายามที่ไร้ผลที่จะ ทำให้อาหารดูน่ารับประทาน\n\nสัญชาตญาณทุกอย่างของข้ากระตุ้นให้ข้าโยนสิ่งนั้นออกไปนอกหน้าต่างที่ใกล้ที่สุด แต่ [stop_host_scope.GetNameNoTooltip] รับรองกับข้าว่ามันเป็นอาหารอันโอชะท้องถิ่นที่คู่ควรกับ [ROOT.Char.GetTitleAsNameNoTooltip]"
 host_dinner_events.3003.a:0 "กลืนลงไป!"
 host_dinner_events.3003.disgusting:0 "อาหารน่าขยะแขยง"
 host_dinner_events.3003.delicious:0 "อาหารอันโอชะน่าทึ่งมาก"
 host_dinner_events.3003.b:0 "ข้าจะไม่ยอมให้สิ่งสกปรกนี้แตะต้องลิ้นข้า"
 host_dinner_events.3003.c.my_dog:0 "บางทีข้าอาจจะแอบให้สุนัขของข้า..."
 host_dinner_events.3003.c.lieges_dog:0 "บางทีข้าอาจจะแอบให้สุนัขของ [stop_host_scope.GetFirstNamePossessiveNoTooltip]..."
