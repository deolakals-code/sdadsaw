 fail_to_open_journal_tt:0 "ท่านเปิดบันทึกไม่สำเร็จ"
 more_mysteries_inside_tt:0 "ท่านค้นพบเนื้อหาของบันทึก"
 tour_general.5010.title:0 "$journal_events_prefix$ การถอดรหัส"
 tour_general.5010.desc.intro:0 "ในที่สุด หน้ากระดาษของบันทึกก็เปิดเผยตัวตนต่อข้าพเจ้า และข้าพเจ้าสามารถเริ่มถอดรหัสได้แล้ว! รหัสเปิดกล่าวว่า "ไม่ว่าข้าพเจ้าจะไปที่ใด ความจริงยังคงตามหลังอยู่สองก้าว" และด้วยสิ่งนี้ ข้าพเจ้าสามารถถอดรหัสปริศนาแรกได้\n\n"
 tour_general.5010.desc.puzzle.a:0 ""Uvtcpigvjkpiueqwnfdg.""
 tour_general.5010.desc.puzzle.b:0 ""Vjgurktkvuycvejwucnn.""
 tour_general.5010.desc.puzzle.c:0 ""Qwtjkuvqtakuqpnacnkg.""
 tour_general.5010.desc.puzzle.d:0 ""Hcnnudavjgktqypjcpfu.""
 tour_general.5010.desc.outro:0 "\n\nนี่มันไร้สาระสิ้นดี แต่มันต้องมีความหมายที่แท้จริง"
 tour_general.5010.a:0 "สิ่งแปลกประหลาดอาจเกิดขึ้นได้"
 tour_general.5010.b:0 "เหล่าวิญญาณเฝ้ามองเราทุกคน"
 tour_general.5010.c:0 "ประวัติศาสตร์ของเราเป็นเพียงเรื่องโกหก"
 tour_general.5010.d:0 "ล่มสลายด้วยน้ำมือของตนเอง"
 tour_general.5011.title:0 "$journal_events_prefix$ รูปปั้นอัปลักษณ์"
 tour_general.5011.desc:0 "ใช่แล้ว! เมื่อทำตามรหัสลับ ข้าพเจ้าก็สามารถเข้าใจเนื้อหาทั้งหมดของหนังสือได้ และดูเหมือนว่าจะเป็นบันทึกแปลกๆ ที่อธิบายธรรมชาติของรูปปั้นอัปลักษณ์ทุกรูปแบบ เช่น [ROOT.Char.Custom('GetGrotesquePlural')]\n\nโดยเฉพาะอย่างยิ่ง มันอธิบายถึงธรรมชาติของพวกมันและสถานที่ที่จะพบพวกมันได้ ไม่ต้องสงสัยเลยว่านี่เป็นสิ่งประดิษฐ์ที่สำคัญหากข้าพเจ้าต้องเดินทางไปยังดินแดนอันห่างไกล"
 tour_general.5011.a:0 "ช่างน่าเกลียดน่ากลัวเสียนี่กระไร!"
 tour_general.5012.title:0 "$journal_events_prefix$ เทววิทยาขั้นสูง"
 tour_general.5012.desc:0 "ใช่แล้ว! เมื่อทำตามรหัสลับ ข้าพเจ้าก็สามารถเข้าใจเนื้อหาทั้งหมดของหนังสือได้ และมันคือหนังสือเทววิทยาที่ซับซ้อน! มันอธิบายถึง [ROOT.Char.GetFaith.PantheonTerm] และมีแนวคิดที่น่าสนใจเกี่ยวกับความสัมพันธ์ระหว่าง [ROOT.Char.GetFaith.PositiveAfterLife] และ [ROOT.Char.GetFaith.NegativeAfterLife]\n\nนี่อาจเป็นตำราเทววิทยาที่ก้าวหน้าที่สุดในโลก [ROOT.Char.GetFaith.GetAdjectiveNoTooltip] และมันเป็นของข้าพเจ้า!"
 tour_general.5012.a:0 "น่าทึ่งยิ่งนัก!"
 tour_general.5013.title:0 "$journal_events_prefix$ ประวัติศาสตร์ลับ"
 tour_general.5013.desc:0 "ใช่แล้ว! เมื่อทำตามรหัสลับ ข้าพเจ้าก็สามารถเข้าใจเนื้อหาทั้งหมดของหนังสือได้ และมันอธิบายประวัติศาสตร์ของ [ROOT.Char.GetPrimaryTitle.GetName] ในแบบที่ข้าพเจ้าไม่เคยได้ยินมาก่อน!\n\nหากเป็นจริง บันทึกนี้อาจบ่อนทำลายความเข้าใจของเราเกี่ยวกับประวัติศาสตร์ และบุคคลสำคัญมากมายที่ช่วยสร้าง [ROOT.Char.GetPrimaryTitle.GetTierAsNameNoTooltip] อันยิ่งใหญ่นี้อย่างที่เรารู้จัก!"
 tour_general.5013.a:0 "เหลือเชื่อ!"
 tour_general.5014.title:0 "$journal_events_prefix$ การต่อสู้"
 tour_general.5014.desc:0 "ใช่แล้ว! เมื่อทำตามรหัสลับ ข้าพเจ้าก็สามารถเข้าใจเนื้อหาทั้งหมดของหนังสือได้ และมันมีข้อมูลเกี่ยวกับเทคนิคลับในสถานการณ์การต่อสู้ทุกรูปแบบ ไม่ว่าจะเป็นดาบ การต่อสู้ด้วยมือเปล่า หรือแม้ แต่บนหลังม้า บันทึกนี้อธิบายอย่างชัดเจนถึงวิธีการตอบโต้การเคลื่อนไหวใดๆ ที่คู่ต่อสู้อาจทำ\n\nด้วยการศึกษาบันทึกนี้อย่างเหมาะสมและฝึกฝนตามคำแนะนำ ข้าพเจ้าจะกลายเป็นนักดาบที่ยิ่งใหญ่ที่สุดในประวัติศาสตร์ของ [ROOT.Char.GetPrimaryTitle.GetName]!"
 tour_general.5014.a:0 "เหลือเชื่อ!"
 tour_grounds_events.3030.title:0 "แผนที่ลึกลับ"
 tour_grounds_events.3030.desc:0 "วันนี้ข้าพเจ้าใช้เวลาส่วนใหญ่สำรวจใจกลาง [touring_grounds_scope.GetNameNoTooltip] และเพลิดเพลินกับการรับใช้จากชาวบ้านในท้องถิ่น\n\nไกลออกไปเล็กน้อย ข้าพเจ้าเห็นร่างคลุมศีรษะเคลื่อนผ่านฝูงชน ในความพยายามอันไร้ผลที่จะกลมกลืนเข้าไป แผ่นกระดาษหลุดจากกระเป๋าของพวกเขา และปลิวตามลมมาทางข้าพเจ้าอย่างโหยหา ราวกับถูกนำทางมาหาข้าพเจ้า\n\nดูเหมือนว่าจะเป็นแผนที่บางอย่าง แผนที่ของพื้นที่โดยรอบ [touring_grounds_scope.GetNameNoTooltip]!"
 tour_grounds_events.3030.a:0 "มาดูกันว่ามันนำไปที่ใด"
 tour_grounds_events.3030.got_lost:0 "ท่านหลงทาง"
 tour_grounds_events.3030.b:0 "ชิ ช่างเสียเวลาจริง"
 tour_grounds_events.3031.title:0 "สมบัติที่ถูกฝัง"
 tour_grounds_events.3031.desc:0 "เมื่อตามแผนที่ไปจนสุด ข้าพเจ้าพบเพียงที่โล่งใน [ROOT.Char.GetCurrentLocation.GetTerrain.GetNameNoTooltip] ที่ไม่มีความสำคัญเป็นพิเศษ\n\nแต่เมื่อมองไปรอบๆ ข้าพเจ้าพบเนินดินหลายแห่งบนพื้น ราวกับว่ามีบางอย่างถูกฝังอยู่ที่นั่น เนินดินปรากฏขึ้นเป็นระยะๆ อย่างสมเหตุสมผล บางทีอาจบ่งบอกว่ามีการวางตำแหน่งอย่างมีตรรกะ..."
 tour_grounds_events.3031.a:0 "ข้าพเจ้าแยกแยะได้ว่าอันไหนเป็นอันไหน"
 tour_grounds_events.3031.fail_to_get_it_open:0 "ท่านหาจุดที่ถูกต้องไม่พบ"
 tour_grounds_events.3031.b:0 "ข้าพเจ้าจะขุดที่โล่งทั้งหมด!"
 tour_grounds_events.3031.c:0 "ข้าพเจ้าตามรอยนี้มาไกลพอแล้ว"
 tour_grounds_events.3032.title:0 "หนังสือที่ถูกฝัง"
 tour_grounds_events.3032.desc:0 "ในที่สุด ข้าพเจ้าคิดว่าพบเนินดินที่ถูกต้องแล้ว และการขุดมันขึ้นมาเผยให้เห็น... หนังสือประหลาดเล่มหนึ่ง\n\nปกหนังสือชำรุดและแทบจะหลุดออกจากกัน และข้างในมีเพียงสัญลักษณ์และปริศนาแปลกๆ ซึ่งบ่งบอกถึงความจริงที่ถูกบดบังบางอย่าง\n\nหลังจากนั้นไม่นาน ข้าพเจ้าก็เข้าใจว่านี่คือหนังสือรหัสลับ แต่ยังไม่ชัดเจนว่ามันมีไว้เพื่อถอดรหัสอะไร"
 artifact_secret_cipher_description:0 "หนังสือประหลาดที่เต็มไปด้วยปริศนาและรหัสลับ"
 tour_grounds_events.3032.a:0 "ข้าพเจ้าจะเอามันไป!"
