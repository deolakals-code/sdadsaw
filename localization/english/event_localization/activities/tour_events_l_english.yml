#Vassal Events
 tour_grounds_events.1001.title:0 "ความสามารถในการล่าสัตว์"
 tour_grounds_events.1001.desc.intro:0 "ขณะที่[visiting_liege.GetName] ยังคงเที่ยวชมบริเวณบ้านของข้า ข้ามีโอกาสมากมายรออยู่ข้างหน้าที่จะสร้างความประทับใจ"
 tour_grounds_events.1001.desc.mid:0 "\n\nโอกาสหนึ่งคือการอวดพื้นที่ล่าสัตว์ของ[touring_grounds_scope.GetNameNoTooltip] และบางทีอาจสร้างความประทับใจให้เจ้าเหนือหัวของข้าด้วยทักษะการล่าสัตว์ของข้า!"
 tour_grounds_events.1001.desc.outro:0 "ชัยชนะในสนามล่าสัตว์จะช่วยเสริมสถานะของข้าในฐานะ[ROOT.Char.GetTitleAsNameNoTooltip] ที่คู่ควรของอาณาจักรได้อย่างแน่นอน แต่ในทำนองเดียวกัน ความล้มเหลวก็จะน่าอับอายเป็นอย่างยิ่ง"
 tour_grounds_events.1001.a:0 "ข้าไม่เคยพลาด!"
 tour_grounds_events.1001.b:0 "บางทีอย่างอื่นอาจจะสร้างความประทับใจให้[visiting_liege.GetHerHim]..."

 tour_grounds_events.1002.title:0 "แผนการ"
 tour_grounds_events.1002.desc:0 "ขณะเฝ้าดู[visiting_liege.GetTitleAsNameNoTooltip|U] ของข้าเดินเล่นในบริเวณ[touring_grounds_scope.GetNameNoTooltip] ความคิดที่จะเล่นตลกซุกซนก็ผุดขึ้นในใจข้า ราวกับถูกสิงโดยวิญญาณของ[ROOT.Char.GetFaith.TricksterGodName] [ROOT.Char.GetFaith.TricksterGodHerHim]self ข้าจินตนาการถึงการพยายามลอบสังหารที่จัดฉากขึ้นเพื่อสร้างความบันเทิงให้แขกของข้า!\n\n[visiting_liege.GetNameNoTooltip] จะถูกจัดฉากให้เป็นวีรบุรุษของเรื่อง ขัดขวางความพยายามต่อคณะและส่ง "นักฆ่า" หนีไป! การล้อเลียนศัตรูของ[visiting_liege.GetPrimaryTitle.GetNameNoTooltip] อย่างดี [visiting_liege.GetNameNoTooltip] จะต้องรู้สึกปลื้มและสนุกสนานกับสิ่งนี้อย่างแน่นอน!"
 tour_grounds_events.1002.a:0 "จัดการเตรียมการ!"
 tour_grounds_events.1002.b:0 "อย่าทำเลย"
 tour_grounds_events.1003.title:0 "$murder_outcome.5001.t$"
 tour_grounds_events.1003.desc.intro:0 "ขณะที่ข้ายังคงเดินทางชมพื้นที่รอบ [touring_grounds_scope.GetNameNoTooltip] ต่อไป, ข้าก็ได้ยินเสียงที่ไม่คุ้นเคยอยู่รอบตัวพวกเรา ทันใดนั้น, ข้าก็พบว่าคณะเดินทางทั้งหมดของข้าถูกล้อมโดย [fake_assassin_scope.GetWomenMen] สวมผ้าคลุมศีรษะที่กำลังชี้มีดและคันธนูมาที่ข้าโดยตรง!\n\nหนึ่งในนักฆ่าก้าวเข้ามาหาข้าและจ่อมีดของ [fake_assassin_scope.GetHerHis] ที่สีข้างของข้าอย่างมั่นคง "มีความสุขกับการล่าหรือไม่, [ROOT.Char.Custom('FormOfAddressForLiege')]? พวกเรามาเพื่อล่า [ROOT.Char.GetTitleAsNameNoTooltip]!""
 tour_grounds_events.1003.desc.paranoid:0 "\n\nข้ารู้สึกว่าหัวใจเต้นแรงและเหงื่อเย็นไหลท่วมตัวขณะที่ข้ายังคงเป็นอัมพาต นักฆ่าขยิบตาให้ข้าอย่างรู้กันและชี้ไปที่อาวุธของ[fake_assassin_scope.GetHerHis] อวดอ้างชัยชนะของพวกเขา ชีวิตของข้าแขวนอยู่บนเส้นด้ายของการเคลื่อนไหวครั้งต่อไป ข้าควรทำอย่างไร?"
 tour_grounds_events.1003.desc.not_paranoid:0 "\n\nแม้ว่าตอนแรกข้าจะตกใจ แต่ในไม่ช้าก็ชัดเจนว่านี่เป็นเพียงการแสดง นักฆ่า "ขยิบตา" ให้ข้าและข้าสังเกตว่าอาวุธของพวกเขาทำจากไม้ทั้งหมดและทื่อทุกด้าน พวกเขาคาดหวังให้ข้าเล่นตามน้ำและขัดขวางความพยายามต่อชีวิตของข้า"
 tour_grounds_events.1003.a.paranoid:0 "$murder_outcome.5001.not_my_time$"
 tour_grounds_events.1003.a:0 "รับมือซะ, เจ้า [fake_assassin_scope.Custom2('InsultNoun', ROOT.Char)]!"
 tour_grounds_1002.assassination_was_fake:0 "การลอบสังหารเป็นของปลอม"
 tour_grounds_1002.liege_believed_it_was_real:0 "[visiting_liege.GetName] เชื่อว่าการลอบสังหารเป็นเรื่องจริง"
 tour_grounds_1002.liege_played_along:0 "[visiting_liege.GetName] สนุกสนานมาก"
 tour_grounds_1002_likes_tt:0 "หาก[visiting_liege.GetName] สนุกกับมัน"
 tour_grounds_1002_dislikes_tt:0 "หาก[visiting_liege.GetName] ไม่ชอบมัน"
 tour_grounds_1002_murder_tt:0 "หาก[visiting_liege.GetName] เชื่อว่าเป็นเรื่องจริง"
 tour_grounds_events.1003.b:0 "ข้าไม่ใช่นักขับลำนำ! ออกไปจากข้า!"
 tour_grounds_1002.liege_begrudgingly_played_along:0 "[visiting_liege.GetName] ไม่สนุก"
 tour_grounds_events.1003.c:0 "พวกเขาจะจับข้าไปไม่ได้หากไม่มีการต่อสู้!"

 tour_grounds_events.1004.title:0 "ช่วงเวลาในป่า"
 tour_grounds_events.1004.desc.intro:0 "ครู่หนึ่ง ข้าพบว่าตัวเองอยู่ตามลำพังในพื้นที่ล่าสัตว์ที่ยังไม่ถูกบุกรุกของ[touring_grounds_scope.GetNameNoTooltip] กับ[visiting_liege.Custom2('MyCharacterIntroduction', ROOT.Char)] ช่วงเวลาที่หาได้ยาก เช่นนี้จะ ทำให้ข้าสามารถไล่ตามความหลงใหลในตัว[visiting_liege.GetHerHim] ได้"
 tour_grounds_events.1004.desc.already_shagging:0 "\n\nแม้ว่าหัวใจและร่างกายของเราจะเป็นของกันและกันแล้ว แต่การเป็นผู้ปกครอง ทำให้เรามีเวลาน้อยมากที่จะไล่ตามความปรารถนาของเรา แต่ตอนนี้เรามีโอกาสที่จะเป็นเหมือนสัตว์ป่าในป่า"
 tour_grounds_events.1004.desc.trying_to_shag:0 "\n\nบางทีนี่อาจเป็นโอกาสสุดท้ายของข้าที่จะบอกความรู้สึกของข้าให้รู้ และหาก[visiting_liege.GetSheHe] รู้สึก เช่นเดียวกัน ในที่สุดเราก็อาจจะเป็นมากกว่าแค่ '[visiting_liege.GetTitleAsNameNoTooltip]' และ '[ROOT.Char.GetTitleAsNameNoTooltip]' แต่เป็นคู่รักในห้วงแห่งความปรารถนา"
 tour_grounds_events.1004.desc.outro:0 "\n\nชีวิตประกอบด้วยช่วงเวลา และบางครั้งเราก็มีช่วงเวลาที่หาได้ยาก เช่นนี้ ข้าสามารถทำตามความรู้สึกเหล่านี้ได้หรือไม่?"
 tour_grounds_events.1004.a:0 "เอาข้าไปเดี๋ยวนี้!"
 tour_grounds_events.1004.b:0 "ปล่อยมันไป"
 tour_grounds_events.1005.title:0 "$tour_grounds_events.1004.title$"
 tour_grounds_events.1005.desc.intro:0 "ข้าพบว่าตัวเองอยู่ตามลำพังในพื้นที่ล่าสัตว์ของ[touring_grounds_scope.GetNameNoTooltip] กับ[stop_host_scope.Custom2('MyCharacterIntroduction', ROOT.Char)] เพลิดเพลินกับความเงียบสงบที่ถูกทำลายเป็นครั้งคราวด้วยเสียงร้องของสัตว์ป่าที่อยู่ใกล้เคียง"
 tour_grounds_events.1005.desc.already_shagging:0 "ทันใดนั้น ข้าพบว่า [stop_host_scope.GetNameNoTooltip] โยน [stop_host_scope.GetHerselfHimself] เข้าใส่ข้าราวกับ [stop_host_scope.Custom('GetAnimalType')] ป่า ตรึงข้าไว้กับก้อนหินด้วยไฟในดวงตา [stop_host_scope.GetHerHis]\n\n"นานๆ ทีข้าจะได้พบท่านตามลำพัง [ROOT.Char.Custom('LoverPetName')] ของข้า และที่นี่เราอยู่ตามลำพังโดยมีเพียงนกและสัตว์ร้ายเป็นพยาน ให้เราโอบกอดความปรารถนาของเราที่มีต่อกันในที่สุด!""
 tour_grounds_events.1005.desc.trying_to_shag:0 "ข้าเห็น[stop_host_scope.GetNameNoTooltip] จ้องมองข้าเหมือน[stop_host_scope.Custom('GetAnimalType')] ที่พร้อมจะกระโจนเข้าใส่เหยื่อมื้อต่อไป\n\n"ฝ่าบาท[ROOT.Char.GetTitleAsNameNoTooltip|U] ข้าต้องบอกว่าท่านดูงดงามยิ่งกว่าสิ่งมีชีวิตใดๆ ที่ข้าเคยเห็นใน[touring_grounds_scope.Custom('TerrainTypeProvince')] เหล่านี้"\n[stop_host_scope.GetNameNoTooltip] เข้ามาหาข้าด้วยแววตานักล่าในดวงตาของ[stop_host_scope.GetHerHis] และข้ารู้สึกว่าการถือพรหมจรรย์ของข้าละลายหายไป"
 tour_grounds_events.1005.desc.outro:0 "\n\nข้าตกตะลึง จ้องมองเข้าไปในดวงตาที่กระหายของ[stop_host_scope.GetTitleAsNameNoTooltip] ของข้า การที่[ROOT.Char.GetTitleAsNameNoTooltip] ที่กำลังเดินทางจะมีช่วงเวลาแห่งความปรารถนาในสถานที่ เช่นนี้จะเหมาะสมจริงหรือ?"
 tour_grounds_events.1005.a:0 "เอาข้าไป!"
 tour_grounds.moment_in_the_woods:0 "ท่านมอบช่วงเวลาที่น่าจดจำให้แก่[visiting_liege.GetName]"
 tour_grounds_events.1005.b:0 "ออกไปจากข้า เจ้า [stop_host_scope.Custom2('InsultNoun', ROOT.Char)] ตัณหากลับ!"
 tour_grounds.rebuffed_in_the_woods:0 "[visiting_liege.GetName] ปฏิเสธการเกี้ยวพาราสีของท่าน"

 tour_grounds_events.1006.title:0 "นอกคิว"
 tour_grounds_events.1006.desc.intro:0 "ระหว่างการเที่ยวชม[touring_grounds_scope.GetNameNoTooltip] ข้ากำลังสนทนาอยู่กับ[visiting_liege.Custom2('MyCharacterIntroduction', ROOT.Char)] เกี่ยวกับ"
 tour_grounds_events.1006.desc.mid.martial:0 "ความรุ่งโรจน์ของสงครามและความขัดแย้ง,"
 tour_grounds_events.1006.desc.mid.learning:0 "แผนการอันศักดิ์สิทธิ์ของ[ROOT.Char.GetFaith.HighGodNamePossessive] สำหรับมนุษยชาติ,"
 tour_grounds_events.1006.desc.mid.stewardship:0 "ความซับซ้อนของการปกครองและการทำบัญชี,"
 tour_grounds_events.1006.desc.mid.diplomacy:0 "ศิลปะอันละเอียดอ่อนของการทูตและการประนีประนอม,"
 tour_grounds_events.1006.desc.mid.intrigue:0 "ความสำคัญของข้อมูลและการหลอกลวง,"
 tour_grounds_events.1006.desc.outro:0 "เมื่อข้าถูกขัดจังหวะโดย[landless_courtier_scope.Custom2('MyCharacterIntroduction', ROOT.Char)] ซึ่งดูเหมือนจะเชื่อว่า[landless_courtier_scope.GetSheHe] รู้เรื่องนี้ดีกว่าข้า\n\nอย่างไรก็ตาม เป็นการไม่เหมาะสมอย่างยิ่งที่ข้าราชสำนักธรรมดาจะขัดจังหวะการสนทนาระหว่าง[visiting_liege.GetTitleAsNameNoTooltip|U] แห่ง[visiting_liege.GetPrimaryTitle.GetNameNoTierNoTooltip] และ[visiting_liege.GetHerHis] [ROOT.Char.GetTitleAsNameNoTooltip|U]"
 tour_grounds_events.1006.a:0 "เงียบซะ, เจ้า [stop_host_scope.Custom2('InsultNoun', ROOT.Char)] [stop_host_scope.Custom2('InsultAdjective', ROOT.Char)]."
 tour_grounds_events.1006.b:0 "เมินเฉยและไปต่อ"
 tour_grounds_events.1007.desc.intro:0 "ระหว่างการเที่ยวชม[touring_grounds_scope.GetNameNoTooltip] ข้ากำลังสนทนาอยู่กับ[stop_host_scope.Custom2('MyCharacterIntroduction', ROOT.Char)] เกี่ยวกับ"
 tour_grounds_events.1007.desc.outro:0 "เมื่อ[stop_host_scope.GetSheHe] ถูกขัดจังหวะโดยข้าราชสำนักคนหนึ่งของ[stop_host_scope.GetHerHis]\n\n[landless_courtier_scope.GetWomanMan] ไม่ได้รับอนุญาตให้พูดนานนักก่อนที่จะถูก ทำให้เงียบโดยเจ้าเหนือหัวของ[landless_courtier_scope.GetHerHis] แต่ปัญญาที่[landless_courtier_scope.GetSheHe] สามารถมอบให้ได้พิสูจน์ทันทีว่า[landless_courtier_scope.GetSheHe] รู้เรื่องนี้มากกว่าที่[stop_host_scope.GetNameNoTooltip] จะฝันถึงได้\n\nหาก[stop_host_scope.GetTitledFirstNameNoTooltip] ไม่เต็มใจที่จะรับฟังข้อมูลเชิงลึกของ[landless_courtier_scope.GetHerHis] บางที[landless_courtier_scope.GetSheHe] อาจจะเต็มใจเข้าร่วมราชสำนักของข้าแทน"
 tour_grounds_events.1007.a:0 "เข้าร่วมราชสำนักของข้า!"
 tour_grounds_events.1007.b:0 "ไม่ควรมีใครพูดนอกคิว"
 tour_grounds_events.1007.c:0 "นี่เป็นอาชญากรรมที่ชัดเจน!"
 tour_grounds.recruited_my_courtier:0 "[landless_courtier_scope.GetName] ถูกล่อใจให้ออกไป"
 tour_grounds_events.1017.desc.outro:0 "เมื่อ[stop_host_scope.GetSheHe] ถูกขัดจังหวะโดยข้าราชสำนักคนหนึ่งของ[stop_host_scope.GetHerHis]\n\nแม้ว่าข้าราชสำนักที่ต่ำต้อยจะพูดนอกคิวโดยสิ้นเชิง แต่[stop_host_scope.GetNameNoTooltip] กลับไม่ได้ตำหนิ[landless_courtier_scope.GetHerHim] อย่างน่าประหลาด และอนุญาตให้[landless_courtier_scope.GetHerHim] พูดกับข้าโดยตรง\n\nแม้ว่าสิ่งที่[landless_courtier_scope.GetSheHe] พูดจะค่อนข้างน่าสนใจ แต่การละเมิดมารยาททางสังคมนี้ ทำให้ข้าประหลาดใจอย่างมาก"
 tour_grounds_events.1017.a:0 "ข้าจะฟัง"

 tour_grounds_events.1008.title:0 "เรื่องผี"
 tour_grounds_events.1008.desc.intro:0 "ขณะที่เราพักจากการเดินทาง เจ้าเหนือหัวน้อยของข้ายังคงเต็มไปด้วยพลังงานและเรียกร้องให้สร้างความบันเทิง ในขณะที่ขบวนที่เหลือพักฟื้นพลังงาน\n\nโชคดีที่[storyteller_scope.Custom2('MyCharacterIntroduction', ROOT.Char)] รับหน้าที่นี้อย่างกระตือรือร้น และเริ่มเล่าตำนานท้องถิ่น "โอ้ มีอะไรมากกว่าที่เห็นใน[touring_grounds_scope.Custom('TerrainTypeProvince')] เหล่านี้นะ [visiting_liege.Custom('GetLassLad')]"
 tour_grounds_events.1008.desc.mid.banshee:0 "แบนชีคร่ำครวญผู้ยิ่งใหญ่หลอกหลอนป่าแห่ง[touring_grounds_scope.GetNameNoTooltip] และขอเตือน: หากท่านได้ยินเสียงเรียกของนาง คนใกล้ชิดของท่านจะต้องพบจุดจบอย่างแน่นอน""
 tour_grounds_events.1008.desc.mid.ghul:0 "กูลสัตว์ประหลาดท่องไปในสุสานของ[touring_grounds_scope.GetNameNoTooltip] กินเนื้อมนุษย์ และหากมันเห็นท่าน มันอาจตัดสินใจว่า[visiting_liege.GetTitleAsNameNoTooltip|U] อยู่ในเมนู!""
 tour_grounds_events.1008.desc.mid.azdaha:0 "อัซดาฮาผู้น่าสะพรึงกลัวขุดโพรงอยู่ใต้เท้าของเรา รอคอยอยู่ เมื่อมันเห็นโอกาส มันจะพุ่งออกมาจากพื้นดินพร้อมกับฟันอันน่าสยดสยองและกลืนกินท่านทั้งตัว!""
 tour_grounds_events.1008.desc.mid.sasabonsam:0 "ซาซาบอนซัมผู้น่าสะพรึงกลัวอาศัยอยู่แถวนี้ อาจจะเฝ้าดูเราอยู่ตอนนี้ขณะที่เราพูด อยู่นอกสายตา หากท่านลดการป้องกันลง มันจะลงมาจากเบื้องบนและดูดเลือดของท่านด้วยฟันเหล็กอันน่าสะพรึงกลัวจนกว่าท่านจะกลายเป็นสีชมพูและเปื้อนเลือดเหมือนมัน!""
 tour_grounds_events.1008.desc.mid.ankou:0 "อังคูเองก็ท่องไปในแถบนี้บนรถม้าแห่งความตาย รวบรวมวิญญาณที่หลงหายและพาพวกเขาไปยังที่ที่[ROOT.Char.GetFaith.HighGodName] เท่านั้นที่รู้ ระวังตัวไว้นะ [visiting_liege.Custom('GetLassLad')] มิฉะนั้นมันจะพาเจ้าไปด้วย""
 tour_grounds_events.1008.desc.mid.witt_wieven:0 "หญิงขาวอาศัยอยู่ท่ามกลางพวกเราที่นี่ มองหา[visiting_liege.GetLadyLord] น้อยๆ เช่นท่านเพื่อนำท่านหลงทาง ผีของแม่มดที่ตายไปนานแล้ว พวกนางจะพาเจ้าไปและทำงานของ[ROOT.Char.GetFaith.DevilNamePossessive] กับเจ้า""
 tour_grounds_events.1008.desc.mid.baba_yaga:0 "แม่มดผู้น่าสะพรึงกลัว บาบายากา ทำเวทมนตร์ของนางอยู่แถวนี้ ระวังกระท่อมที่ดูเหมือนไม่อยู่ที่นี่ มิฉะนั้นนางจะกินเนื้อของท่านและตก แต่งด้วยกระดูกของท่าน""
 tour_grounds_events.1008.desc.mid:0 "มีสิ่งน่าสะพรึงกลัวมากมายท่องไปในแถบนี้ สิ่งที่ไม่ใช่ธรรมชาติ สัตว์ประหลาดที่ยิ่งใหญ่กว่าสัตว์ร้ายใดๆ ที่ไม่ต้องการอะไรมากไปกว่าการเพิ่ม[visiting_liege.GetTitleAsNameNoTooltip|U] เล็กน้อยลงในอาหารของพวกมัน""
 tour_grounds_events.1008.desc.outro:0 "\n\nเรื่องเล่าที่น่าสงสัยของ[storyteller_scope.GetFirstNamePossessiveNoTooltip] กำลังส่งผลกระทบต่อ[visiting_liege.GetFirstNameNoTooltip] น้อยๆ อย่างชัดเจน บางทีข้าควรจะเข้าไปแทรกแซง"
 tour_grounds_events.1008.a:0 "แล้วเกิดอะไรขึ้นต่อไป?"
 tour_grounds_events.1008.b:0 "เงียบนะ [storyteller_scope.GetFirstNameNoTooltip]!"
 tour_grounds_events.1009.title:0 "$tour_grounds_events.1008.title$"
 tour_grounds_events.1009.desc.intro:0 "สมาชิกที่อาวุโสกว่าในขบวนของเราหยุดพักจากการเดินทาง แต่ข้ายังคงเต็มไปด้วยความกระปรี้กระเปร่าและเริ่มหมดความอดทนกับคนแก่ที่ไร้ชีวิตชีวาเหล่านี้อย่างรวดเร็ว\n\nโชคดีที่[storyteller_scope.GetName] ดูเหมือนกระตือรือร้นที่จะสร้างความบันเทิงให้ข้าด้วยเรื่องน่ากลัวจากสถานที่แห่งนี้ "โอ้ มีอะไรมากกว่าที่เห็นใน[touring_grounds_scope.Custom('TerrainTypeProvince')] เหล่านี้นะ [visiting_liege.Custom('GetLassLad')]"
 tour_grounds_events.1009.desc.mid.finished:0 "\n\n[stop_host_scope.GetName] เข้าร่วมการเล่าเรื่องในไม่ช้า และข้าก็ติดอยู่กับเรื่องราวทั้งสอง ซึ่ง ทำให้ข้าหวาดกลัวไม่น้อย"
 tour_grounds_events.1009.desc.outro.interrupted:0 "\n\nทันทีที่เรื่องราวกำลังน่าสนใจ [stop_host_scope.GetName] ก็ขัดจังหวะและยืนยันว่า[storyteller_scope.GetSheHe] ไม่ควรไปต่อ และรับรองกับข้าว่าเรื่องราวทั้งหมดเป็นเรื่องไร้สาระ"
 tour_grounds_events.1009.a:0 "ช่างเป็นเรื่องราวที่ยอดเยี่ยม!"
 tour_grounds_events.1009.b:0 "นั่นน่ากลัวมาก"
 tour_grounds_events.1009.c:0 "ท่านหยุดมันตอนที่ดีที่สุด!"
 tour_grounds_events.1009.d:0 "ขอบคุณพระเจ้าที่ท่านหยุดมัน"

 tour_grounds_events.1010.title:0 "[rival_courtier.GetFirstNameNoTooltip]: พาหนะผู้ภักดี"
 tour_grounds_events.1010.desc:0 "ขี่ม้าผ่านบริเวณบนพาหนะของเราตลอดทั้งวัน ทันใดนั้นข้าก็เกิดความคิดที่ได้รับแรงบันดาลใจ!\n\nทุกคนรู้ถึงความเป็นปฏิปักษ์ระหว่าง[visiting_liege.Custom2('MyCharacterIntroduction', ROOT.Char)] และ[rival_courtier.GetName] และแน่นอนว่ามันจะ ทำให้ข้าเป็นที่โปรดปรานของ[visiting_liege.GetTitleAsNamePossessiveNoTooltip] หากข้าจับคู่แข่งของ[visiting_liege.GetHerHis] และให้[rival_courtier.GetHerHim] ใส่อานและขี่ไปรอบๆ เหมือนม้า!\n\nแน่นอนว่าความท้าทายเพียงอย่างเดียวคือการนำ[rival_courtier.GetHerHim] มาที่นี่ แต่ข้ามีวิธีของข้า..."
 tour_grounds_events.1010.a:0 "มาทำกันเถอะ!"
 tour_grounds_events.1010.b:0 "ความเสี่ยงนั้นยิ่งใหญ่เกินไป"
 tour_grounds_events.1011.title:0 "$tour_grounds_events.1010.title$"
 tour_grounds_events.1011.desc:0 "ขี่ม้าผ่านบริเวณ[touring_grounds_scope.GetNameNoTooltip] ทันใดนั้นข้าก็ถูกหยุดกลางถนนโดยเจ้าภาพของข้า [stop_host_scope.GetName]\n\nดูเหมือนว่า[stop_host_scope.GetSheHe] สามารถจับ[rival_courtier.Custom2('MyCharacterIntroduction', ROOT.Char)] ได้ และให้[rival_courtier.GetHerHim] ใส่อานเหมือนม้า พร้อมให้ข้าขึ้นขี่และขี่ไปทั่วชนบท!\n\nแม้ว่าจะเป็นโอกาสอันยอดเยี่ยมที่จะแสดงความเหนือกว่าโดยธรรมชาติของข้า แต่ข้าจะลดตัวลงต่ำขนาดนั้นจริงๆ หรือ?"
 tour_grounds_events.1011.a:0 "แน่นอน ข้าจะทำ!"
 tour_grounds_events.1011.b:0 "แม้ แต่[rival_courtier.GetFirstNameNoTooltip] ก็ไม่สมควรได้รับการดูหมิ่น เช่นนี้"

 tour_grounds_events.1012.title:0 "[stop_host_scope.Custom('get_region_root_vegetable')|U] ที่เหมือน[visiting_liege.GetTitleAsNameNoTooltip|U]"
 tour_grounds_events.1012.desc:0 "บ้านอันต่ำต้อยของเราขาดสิ่งอำนวยความสะดวกและความยิ่งใหญ่ที่[visiting_liege.GetName] คุ้นเคยอย่างไม่ต้องสงสัย แต่สิ่งที่เราขาดในความฟุ่มเฟือย เราสามารถชดเชยได้มากกว่าด้วยที่พักและความเอื้อเฟื้อเผื่อแผ่\n\nข้ากังวลว่าข้าจะต้องนำทาง[visiting_liege.GetTitleAsNameNoTooltip] ของข้าไปรอบๆ โดยไม่มีของขวัญ แต่แล้วทันใดนั้นข้าก็เห็น[ROOT.Char.Custom('get_region_root_vegetable')] ที่เจริญงอกงาม ซึ่งดูเหมือน[visiting_liege.GetNameNoTooltip] อย่างน่าอัศจรรย์! [visiting_liege.GetSheHe|U] จะจดจำการมาเยือน[touring_grounds_scope.GetNameNoTooltip] ของ[visiting_liege.GetHerHis] ไปตลอดกาลอย่างไม่ต้องสงสัย หาก[visiting_liege.GetSheHe] จากไปพร้อมกับ[ROOT.Char.Custom('get_region_root_vegetable')] ที่เหมือน[visiting_liege.GetHerHis]! แม้ว่า [visiting_liege.GetSheHe] อาจจะรู้สึกขุ่นเคืองได้ง่ายๆ ที่ข้าเปรียบเทียบ[visiting_liege.GetHerHim] กับ[ROOT.Char.Custom('get_region_root_vegetable')]"
 tour_grounds_events.1012.a:0 "และที่นี่ข้าคิดว่าของขวัญที่สมบูรณ์แบบไม่มีอยู่จริง"
 tour_grounds_events.1012.b:0 "กำจัด[ROOT.Char.Custom('get_region_root_vegetable')] อย่างเงียบๆ"
 tour_grounds_events.1012.c:0 "นี่ต้องมีค่ามหาศาล!"
 tour_grounds_events.1012.d:0 "เก็บไว้เพื่อ... ใช้ส่วนตัว"
 turnip_that_looks_like_liege:0 "[ROOT.Char.Custom('get_region_root_vegetable')|U] ของ[visiting_liege.GetTitleAsNamePossessiveNoTooltip|U]"
 turnip_that_looks_like_liege_description:0 "[ROOT.Char.Custom('get_region_root_vegetable')] ธรรมดาที่คล้ายคลึงกับ[visiting_liege.GetName] อย่างน่าทึ่ง"
 tour_grounds_events.1013.title:0 "$tour_grounds_events.1012.title$"
 tour_grounds_events.1013.desc:0 "[touring_grounds_scope.GetNameNoTooltip] ห่างไกลจากสิ่งที่ข้าจะพิจารณาว่าเป็นภูมิภาคที่เจริญแล้ว แทบไม่มีใครเรียกที่นี่ว่าบ้านและสิ่งอำนวยความสะดวกก็มีน้อยมาก\n\nวันนี้ [stop_host_scope.GetTitleAsNameNoTooltip] คิดที่จะสร้างความประทับใจให้ข้าโดยการนำเสนอ[stop_host_scope.Custom('get_region_root_vegetable')] ธรรมดาที่[stop_host_scope.GetSheHe] อ้างว่าดูเหมือนข้า\n\nตอนแรกข้ากลอกตา แต่ไม่นานข้าก็เริ่มเห็นความคล้ายคลึง..."
 tour_grounds_events.1013.a:0 "ช่างเป็นวัตถุที่น่าอัศจรรย์!"
 tour_grounds.liege_impressed:0 "[visiting_liege.GetName] ประทับใจ"
 tour_grounds_events.1013.b:0 "น่าขยะแขยง กำจัดมันซะ"
 tour_grounds.liege_insulted:0 "[visiting_liege.GetName] ถูกดูหมิ่น"

 tour_grounds_events.1014.title:0 "[visiting_liege.GetNameNoTooltip]: นักล่าตัวน้อย"
 tour_grounds_events.1014.desc:0 "[visiting_liege.Custom2('MyCharacterIntroduction', ROOT.Char)] ดูเหมือนกระตือรือร้นที่จะล่าสัตว์รอบๆ [touring_grounds_scope.GetNameNoTooltip] แสวงหาเหยื่อและความรุ่งโรจน์เหมือนผู้ใหญ่\n\nอย่างไรก็ตาม ข้าไม่สามารถอนุญาตให้[visiting_liege.Custom('GirlBoy')] อายุน้อย เช่นนี้วิ่งไปรอบๆ ที่ที่[visiting_liege.GetSheHe] อาจถูก[ROOT.Char.Custom('GetAnimalType')] ขย้ำทั้งเป็นได้ด้วยมโนธรรมที่ดี\n\nอย่างไรก็ตาม ข้าสามารถประจบประแจง[visiting_liege.GetLadyLord] น้อยๆ ได้โดยการจัดฉากการล่าปลอมๆ โดยไม่มีอันตรายจากสัตว์จริง"
 tour_grounds_events.1014.a:0 "ข้ามั่นใจว่า[visiting_liege.GetSheHe] จะชอบมัน!"
 tour_grounds_events.1014.b:0 "เสียเวลาจริงๆ"
 tour_grounds_events.1015.title:0 "การล่าเพื่อแสดง"
 tour_grounds_events.1015.desc:0 "ข้าอยากจะออกไปท่องป่าและจับเหยื่อสดๆ ด้วยตัวเอง เหมือนที่[ROOT.Char.GetTitleAsNameNoTooltip] ควรทำ และจนถึงตอนนี้ข้าก็ถูกปฏิเสธโอกาสโดยผู้อาวุโสและผู้ปกครองของข้า\n\nอย่างไรก็ตาม วันนี้ข้าได้รับการทาบทามจาก[stop_host_scope.GetName] และได้รับข้อเสนอให้ทดสอบพื้นที่ของ[touring_grounds_scope.GetNameNoTooltip] ในฐานะนักล่าที่แท้จริง!\n\nเมื่อข้ามาถึงพื้นที่ล่าสัตว์ ข้ากลับไม่ได้รับการต้อนรับจาก[stop_host_scope.Custom('GetAnimalType')] ที่ดุร้าย แต่เป็นท่อนไม้ที่ทาสีให้คล้ายกับ[stop_host_scope.Custom('GetAnimalType')]"
 tour_grounds_events.1015.a:0 "ข้าจะสังหารสัตว์ร้าย!"
 tour_grounds_events.1015.b:0 "นี่เป็นเรื่องตลกหรือเปล่า?"
 tour_grounds_events.1015.c:0 "เรียกร้อง[stop_host_scope.Custom('GetAnimalType')] ตัวจริงมาให้สังหาร"
 tour_grounds_events.1016.title:0 "การล่าที่แท้จริง"
 tour_grounds_events.1016.desc:0 "คำเรียกร้องของข้าได้รับการตอบสนอง และในไม่ช้าข้าก็ได้รับการต้อนรับด้วยสัตว์ร้ายตัวจริงให้สังหาร ตามคำสั่งของข้า สัตว์ร้ายถูกปล่อยออกจากพันธนาการและข้าถูกทิ้งให้อยู่ตามลำพังเพื่อเอาชนะสัตว์ประหลาดด้วยธนูของข้า\n\nข้าสูดหายใจลึกและปล่อยลูกธนู และข้าภาวนาให้ลูกธนูของข้าพุ่งตรงไปยังเป้าหมาย"
 tour_grounds_events.1016.a:0 "เป้าหมายของข้าแม่นยำ!"
 tour_grounds.killed_boar:0 "ข้าสังหารสัตว์"
 tour_grounds.mauled_by_boar:0 "ข้าพลาด"

#Liege Events
 tour_grounds_events.3001.title:1 "เที่ยวชมบริเวณ[stop_host_scope.GetPrimaryTitle.GetBaseNameNoTierNoTooltip]"
 tour_grounds_events.3001.desc.intro:1 "การมาถึงของข้าที่[stop_host_scope.Custom('FortifiedBuilding')] ของ[stop_host_scope.GetTitledFirstNamePossessive] ใน[touring_grounds_scope.GetProvince.GetName] มีการเฉลิมฉลองอย่างสมเกียรติ[ROOT.Char.GetTitleAsNameNoTooltip] แห่งอาณาจักร,"
 tour_grounds_events.3001.desc.type.majesty:0 "และคนในท้องถิ่นต่างประทับใจในความยิ่งใหญ่และความโอ่อ่าของขบวนเสด็จของข้าอย่างเห็นได้ชัด\n\n"
 tour_grounds_events.3001.desc.type.taxation:0 "และการปรากฏตัวของเกวียนหีบสมบัติและเจ้าหน้าที่เก็บภาษีของข้าก็เป็นที่สังเกตได้อย่างรวดเร็ว\n\n"
 tour_grounds_events.3001.desc.type.intimidation:0 "ในขณะที่ระเบียบวินัยอันเคร่งครัดของทหารองครักษ์จำนวนมากของข้า ทำให้เหล่าอาณาประชาราษฎร์ของข้าหยุดชะงักไปบ้าง\n\n"
 tour_grounds_events.3001.desc.mid.hates_vassal:0 "การต้องมาพักห้องร่วมกับ [visiting_liege.Custom2('InsultNoun', ROOT.Char)] [stop_host_scope.Custom2('InsultAdjective', ROOT.Char)] นี่เป็นความจำเป็นที่น่าขยะแขยง; หวังว่ามันจะจบลงโดยเร็ว"
 tour_grounds_events.3001.desc.mid.lover:0 "ข้าเจ็บปวดที่ต้องทำงานภายใต้พิธีการสาธารณะ เช่นนี้กับคนรักของข้า — หากเพียง แต่มีเวลาได้สานสัมพันธ์กันตามลำพัง..."
 tour_grounds_events.3001.desc.mid.friend:0 "แม้ว่าเราจะพบกันด้วยภาระทางพิธีการ แต่การมาเยี่ยมเพื่อนที่ดีก็เป็นการพักผ่อนที่น่ายินดีเสมอ"
 tour_grounds_events.3001.desc.mid.close_family:0 "[ROOT.Char.Custom2('RelationToMeShort', stop_host_scope)] ของข้าและข้าสวมกอดกัน ระมัดระวังที่จะรักษาพิธีการของโอกาสนี้อย่างเคร่งครัด"
 tour_grounds_events.3001.desc.mid.house:0 "โอกาสที่จะได้พบ[ROOT.Char.Custom2('RelationToMeShort', stop_host_scope)] ของข้า และดูว่าสถานการณ์ของ[stop_host_scope.GetHerHis] สมกับความสูงศักดิ์ของตระกูล[ROOT.Char.GetHouse.GetBaseName] หรือไม่"
 tour_grounds_events.3001.desc.mid.powerful_vassal:0 "ข้าให้การยอมรับที่จำเป็นต่อความสำคัญของ[stop_host_scope.GetHerHis] ในหมู่ข้าหลวง[ROOT.Char.GetPrimaryTitle.GetAdjectiveNoTooltip] จนถึงจุดหนึ่ง..."
 tour_grounds_events.3001.desc.mid.default:1 "ข้าหลวงของข้าต้อนรับข้าอย่างเคร่งครัดด้วยความเคารพที่จำเป็นทั้งหมด"
 tour_grounds_events.3001.desc.mid:2 "\n\n[stop_host_scope.GetFirstNameNoTooltip] สรุปแผนการเดินทาง และรับรองกับข้าว่า[stop_host_scope.GetPrimaryTitle.GetBaseNameNoTierNoTooltip] เป็นดินแดนที่งดงามและดีงามมากจนเพียงแค่การได้ชมเมืองและทุ่งนาก็เพียงพอแล้วสำหรับความบันเทิง"
 tour_grounds_events.3001.desc.outro:1 "\n\nเวลาเท่านั้นที่จะบอกได้"
 tour_grounds_events.3001.a:1 "ไปกันเถอะ!"
 tour_grounds_events.3002.title:0 "ความสามารถในการล่าสัตว์"
 tour_grounds_events.3002.desc.intro:0 "ขณะที่ข้ายังคงเที่ยวชมบริเวณ [touring_grounds_scope.GetNameNoTooltip] ต่อไป เจ้าภาพของข้าตัดสินใจที่จะแสดง [stop_host_scope.GetHerselfHimself] ความสามารถในการล่าสัตว์ [stop_host_scope.GetHerHis] ด้วยความสนใจของทุกคนจับจ้องไปที่ [stop_host_scope.GetHerHim]"
 tour_grounds_events.3002.desc.mid.crit:0 "[stop_host_scope.GetNameNoTooltip] แทงทะลุกะโหลก[stop_host_scope.Custom('GetAnimalType')] ที่อยู่ห่างไกลด้วยการยิงเพียงครั้งเดียว\n\nในขณะที่ทุกคนดูเหมือนจะประทับใจ นี่อาจเป็น"
 tour_grounds_events.3002.desc.mid.succ:0 "[stop_host_scope.GetNameNoTooltip] สังหาร[stop_host_scope.Custom('GetAnimalType')] ที่อยู่ใกล้เคียงด้วยสิ่งที่ดูเหมือนจะไม่ต้องใช้ความพยายามมากนัก\n\nในขณะที่ทุกคนดูเหมือนจะประทับใจ นี่อาจเป็น"
 tour_grounds_events.3002.desc.mid.fail:0 "[stop_host_scope.GetNameNoTooltip] ล้มเหลวแม้ แต่จะเฉี่ยวเป้าหมายของ[stop_host_scope.GetHerHis] ซึ่งสร้างความขบขันให้กับขบวนของข้าอย่างมาก\n\nในขณะที่ทุกคนหัวเราะ ข้าเห็น"
 tour_grounds_events.3002.desc.outro:0 "โอกาสที่จะเอาชนะเจ้าภาพของข้าและแสดงให้ทุกคนเห็นว่า[ROOT.Char.GetTitleAsNameNoTooltip] ยิงธนูอย่างไร!"
 tour_grounds_events.3002.a:0 "ข้าเป็นนักล่าที่ดีกว่า!"
 tour_grounds_events.3002.b:0 "ยินดีด้วย [stop_host_scope.GetNameNoTooltip]"

 tour_grounds_events.3003.title:0 "เหยื่อที่ล่อแหลม"
 tour_grounds_events.3003.desc.intro:0 "ด้วยธนูล่าสัตว์ข้างกาย สมาชิกในคณะของข้าแจ้งให้ข้าทราบถึงการปรากฏตัวของ[stop_host_scope.Custom('GetAnimalType')] ที่อยู่ใต้ตลิ่งใกล้กับตำแหน่งของเรา การยืนอยู่ที่ขอบหน้าผา ข้าควรจะสามารถแทงทะลุหัวใจของมันได้\n\n"
 tour_grounds_events.3003.desc.mid.high_skill:0 "สำหรับนักล่าที่มีทักษะ เช่นข้า มันควรจะง่าย แต่ก็ไม่ใช่ว่าจะไม่มีความเสี่ยง"
 tour_grounds_events.3003.desc.mid.low_skill:0 "ดูเหมือนจะเป็นการยิงที่ยาก แต่ถ้าข้าทำได้ ข้าจะสร้างความประทับใจให้กับขบวนทั้งหมดของข้าอย่างไม่ต้องสงสัย"
 tour_grounds_events.3003.desc.outro:0 "พื้นดินดูเหมือนจะไม่มั่นคงเล็กน้อย แต่ด้วยการวางเท้าอย่างระมัดระวัง ข้าควรจะสามารถสังหารสัตว์ร้ายได้โดยไม่มีปัญหา"
 tour_grounds_events.3003.a:0 "นี่ควรจะง่าย"
 tour_grounds_events.3003.b:1 "ให้คนอื่นยิงแทนเถอะ"
 tour_grounds_events.3004.title:0 "ฝ่าบาท[visiting_liege.GetTitleAsNameNoTooltip|U] นักล่า"
 tour_grounds_events.3004.desc.intro:0 "ขณะเที่ยวชมบริเวณ [visiting_liege.GetName] ได้ทำการยิงที่เสี่ยงจากยอดหน้าผาไปยัง[stop_host_scope.Custom('GetAnimalType')] ที่อยู่ใกล้เคียงด้านล่าง"
 tour_grounds_events.3004.desc:0 "แม้ว่าจะดูเหมือนว่า [visiting_liege.GetSheHe] อาจจะล้มลงชั่วขณะ แต่ [visiting_liege.GetSheHe] ก็หาที่ยืน [visiting_liege.GetHerHis] ได้อย่างรวดเร็วและสังหารสัตว์ร้าย ล้มมันลงทันที\n\nทุกคนในคณะดูเหมือนจะหลงใหลและประทับใจในความสามารถในการล่าสัตว์ของ [visiting_liege.GetTitleAsNamePossessiveNoTooltip] ของพวกเขา [visiting_liege.GetSheHe|U] เข้ามาหาข้า เลือดหยดจากเหยื่อสดๆ คาดหวังว่าจะได้รับคำแสดงความยินดีบางอย่าง"
 tour_grounds_events.3004.a:0 "ยิงได้ยอดเยี่ยม ฝ่าบาท[visiting_liege.GetTitleAsNameNoTooltip]"
 tour_grounds_events.3004.b:0 "ข้าควรจะประทับใจหรือ?"
 tour_grounds_events.3005.title:0 "ความเสี่ยงที่ได้รับรางวัล"
 tour_grounds_events.3005.desc.intro:0 "การทรงตัวของข้าพิสูจน์ว่ามั่นคงและการเล็งของข้าแม่นยำยิ่งกว่า ขณะที่ข้าล้มสัตว์ร้ายด้วยลูกธนูเพียงดอกเดียวโดยไม่แม้ แต่จะสะดุดขอบหน้าผาที่ล่อแหลม คณะล่าสัตว์ดูเหมือนจะประทับใจ บริเวณนั้นเต็มไปด้วยเสียงปรบมือของเพื่อนร่วมทางของข้า\n\n"
 tour_grounds_events.3005.desc.mid.congrats:0 "เจ้าภาพของข้า [stop_host_scope.GetName] มาแสดงความยินดีกับข้าเป็นการส่วนตัวสำหรับการสังหารของข้า เมื่อเรื่องนั้นจบลง ข้าก็โยนเหยื่อของข้าไปรวมกับที่เหลือและเดินทางต่อไปยังบริเวณนั้น"
 tour_grounds_events.3005.desc.mid.insult: "อย่างไรก็ตาม เจ้าภาพของข้า [stop_host_scope.GetName] ดูเหมือนจะไม่ค่อยประทับใจนัก ใบหน้าของ[stop_host_scope.GetHerHis|U] เต็มไปด้วยความดูถูกและความอิจฉา [stop_host_scope.GetSheHe] อ้างว่าการยิงของข้านั้นไม่น่าประทับใจเลย"
 tour_grounds_events.3005.a:0 "ยอดเยี่ยม"
 tour_grounds_events.3005.a.bad:0 "ช่างเป็น [stop_host_scope.Custom2('InsultNoun', ROOT.Char)] ที่เอา แต่ใจเสียจริง"
 tour_grounds_events.3006.title:0 "[visiting_liege.GetTitleAsNameNoTooltip|U] ผู้ร่วงหล่น"
 tour_grounds_events.3006.desc:0 "ชั่วขณะหนึ่ง ดูเหมือนว่า [visiting_liege.GetSheHe] อาจจะทำเครื่องหมาย [visiting_liege.GetHerHis] ได้จริงๆ แต่เมื่อ [visiting_liege.GetSheHe] เริ่มเสียการทรงตัว [visiting_liege.GetHerHis] ก็เห็นได้ชัดว่าการบาดเจ็บและความอับอายกำลังจะตามมาในไม่ช้า\n\nแน่นอนว่าข้าสามารถกระโดดเข้าไปช่วยเจ้าเหนือหัวของข้าได้ แต่นั่นจะ ทำให้ตัวข้าเองเสี่ยงต่อการบาดเจ็บ"
 tour_grounds_events.3006.a:0 "ข้าต้องปกป้อง[visiting_liege.GetTitleAsNameNoTooltip|U] ของข้า!"
 tour_grounds_events.3006.b:0 "ปล่อยให้[visiting_liege.GetHerHim] ล้มไป"
 tour_grounds_events.3006.c:0 "ผลัก[visiting_liege.GetHerHim] ออกไปและยิงเอง!"
 tour_grounds_events.3007.title:0 "$tour_grounds_events.3006.title$"
 tour_grounds_events.3007.desc.intro:0 "น่าเสียดายที่การทรงตัวของข้าดูเหมือนจะไม่มั่นคงพอ และข้ารู้สึกว่าร่างกายของข้าลอยออกจากพื้นดิน อยู่ในความเมตตาของการสร้างสรรค์ของ[ROOT.Char.GetFaith.CreatorNamePossessive]\n\n"
 tour_grounds_events.3007.desc.mid.protected:0 "อย่างไรก็ตาม ข้าถูก[stop_host_scope.GetName] คว้าตัวไว้อย่างรวดเร็วและดึงกลับมายืนได้ ผู้ช่วยชีวิตของข้าล้มหน้าคะมำลงกับพื้นในความพยายามอันกล้าหาญของ[stop_host_scope.GetHerHis]"
 tour_grounds_events.3007.desc.mid.fell:0 "ข้าบิดตัวกลางอากาศและเห็น[stop_host_scope.GetName] ยืนอยู่เฉยๆ และเฝ้าดู[ROOT.Char.GetTitleAsNameNoTooltip] ของ[stop_host_scope.GetHerHis] ล้มลง ขณะที่ร่างกายของข้ากลับสู่พื้นดิน ข้ารู้สึกว่าผิวหนังของข้าฉีกขาดและเลือดอันศักดิ์สิทธิ์ของข้าไหลนองพื้น"
 tour_grounds_events.3007.desc.mid.took_the_shot:0 "ข้าบิดตัวกลางอากาศและเห็น[stop_host_scope.GetName] เข้ามาแทนที่ข้า และไม่เพียง แต่ไม่ทำอะไรเพื่อช่วยข้า แต่ยังยิงเองด้วย[stop_host_scope.GetHerselfHimself]! ขณะที่ร่างกายของข้าลงสู่พื้นพร้อมกับเสียงแตก ข้าได้ยินเสียงปรบมือ เห็นได้ชัดว่า[stop_host_scope.GetNameNoTooltip] ประสบความสำเร็จในสิ่งที่ข้าล้มเหลว และข้าถูกปล่อยให้ดิ้นรนด้วยความเจ็บปวดและความอับอาย"
 tour_grounds_events.3007.a:0 "ข้าคิดว่าข้าทำพอแล้วสำหรับวันนี้"

 tour_grounds_events.3008.title:0 "อุบัติเหตุจากการขี่ม้า"
 tour_grounds_events.3008.desc:0 "ข้าขี่ม้าผ่านบริเวณ[touring_grounds_scope.GetNameNoTooltip] แทบไม่มีความคิดใดๆ ในหัวที่พึงพอใจของข้า\n\nทันใดนั้นข้าก็ถูกดึงกลับสู่ความเป็นจริงเมื่อเด็กคนหนึ่งวิ่งตัดหน้าม้าของข้า แขนโบกไปมาด้วยความเคารพเพื่อดู[ROOT.Char.GetTitleAsNameNoTooltip] ของ[trampled_child_scope.GetHerHis] การปรากฏตัวของพวกเขากะทันหันมาก ข้าแทบไม่มีเวลาตอบสนอง หรือแม้แต่ประมวลผลว่าเป็นเด็กที่ข้ารู้จักหรือไม่ ด้วยมือที่ชุ่มเหงื่อจับบังเหียน ข้าต้องตอบสนอง!"
 tour_grounds_events.3008.a:0 "พยายามหลีกเลี่ยงพวกเขา"
 tour_grounds_events.3008.b:0 "ไม่มีอะไรขวางทางขี่ม้าของข้าได้"
 tour_grounds_events.3009.title:0 "การเหยียบย่ำของราชวงศ์"
 tour_grounds_events.3009.desc.intro:0 "เป็นอีกวันหนึ่งของการมาเยือนของ[visiting_liege.GetNamePossessive] และ ในขณะที่สิ่งต่างๆ เริ่มต้นได้ดี [trampled_child_scope.GetName] ที่ไม่ได้รับการดูแลได้วิ่งตัดหน้าม้าของ[visiting_liege.GetFirstNamePossessiveNoTooltip] และถูกเหยียบย่ำจนตายทันที!\n\nสิ่งที่น่าตกใจที่สุดคือ[visiting_liege.GetNameNoTooltip] ไม่ได้พยายามป้องกันสิ่งนี้ไม่ให้เกิดขึ้นเลย"
 tour_grounds_events.3009.desc.mid.my_kid:0 "ข้าถูกบังคับให้เฝ้าดูเลือดเนื้อเชื้อไขของตัวเองถูกเหยียบย่ำใต้ฝ่าเท้าของม้าสัตว์ประหลาด"
 tour_grounds_events.3009.desc.mid.not_my_kid:0 "ข้าไม่สามารถละสายตาได้ทันก่อนที่เด็กน่าสงสารจะถูกเหยียบย่ำใต้ฝ่าเท้าของสัตว์ประหลาด"
 tour_grounds_events.3009.desc.outro.my_kid_dead:0 "เมื่อเหตุการณ์อันน่าสยดสยองสิ้นสุดลง ข้ามองเห็นร่างไร้วิญญาณของ[ROOT.Char.Custom2('RelationToMeShort',trampled_child_scope)] ของข้า กลายเป็นเพียงก้อนเนื้อเปื้อนเลือดบนพื้นดิน"
 tour_grounds_events.3009.desc.outro.not_my_kid_dead:0 "เมื่อเหตุการณ์อันน่าสยดสยองสิ้นสุดลง เด็กน่าสงสารดูเหมือนจะนิ่งอยู่ในกองเลือดของ[trampled_child_scope.GetHerHis] เอง"
 tour_grounds_events.3009.desc.outro.alive:0 "โชคดีที่[trampled_child_scope.GetNameNoTooltip] รอดพ้นจากเหตุการณ์นี้มาได้ แต่ก็ไม่ใช่ว่าจะไม่ได้รับบาดเจ็บ"
 tour_grounds_events.3009.a.callous:0 "ไม่เกี่ยวกับข้า"
 tour_grounds_events.3009.a:0 "ช่างชั่วร้าย!"
 tour_grounds_events.3009.b:0 "[visiting_liege.GetNameNoTooltip] เป็นสัตว์ประหลาด"
 tour_grounds.trampled_child_nemesis:0 "[stop_host_scope.GetNameNoTooltip] สาบานว่าจะแก้แค้นให้[stop_host_scope.GetHerHis|U]"

 tour_grounds_events.3010.title:0 "พาหนะที่ไม่น่าเชื่อถือ"
 tour_grounds_events.3010.desc.intro:0 "การขี่ม้าของข้าผ่านบริเวณ[touring_grounds_scope.GetNameNoTooltip] ต้องหยุดชะงักลงกะทันหันเมื่อข้ารู้สึกว่าม้าอันเป็นที่รักของข้าสะดุดก้อนหิน แม้ว่ามันจะฟื้นตัวได้อย่างรวดเร็ว และข้าเสียการทรงตัวเพียงชั่วครู่ แต่ข้าก็ได้ยินเสียงสมาชิกในขบวนของข้าหัวเราะคิกคักอยู่ข้างหลัง\n\n"
 tour_grounds_events.3010.desc.mid.irritable:0 "ข้าถูก ทำให้ผิดหวังโดยพาหนะที่อ้างว่าเป็นที่รักของข้า และข้ารู้สึกถึงความอัปยศอดสูและความโกรธที่เดือดพล่านอยู่ในท้องของข้า"
 tour_grounds_events.3010.desc.mid.calm:0 "ข้ารู้สึกอายเล็กน้อย แต่ข้ารู้จริงๆ ว่าไม่ใช่ความผิดของสัตว์"
 tour_grounds_events.3010.desc.outro:0 "[ROOT.Char.GetTitleAsNameNoTooltip|U] ควรจะแสดงท่าทีสง่างามที่แตะต้องไม่ได้ และได้รับความเคารพจากอาณาประชาราษฎร์ทั้งหมดของ[ROOT.Char.GetHerHis] และเหตุการณ์นี้ได้ทำลายภาพลักษณ์แห่งความสมบูรณ์แบบของข้า"
 tour_grounds_events.3010.a:0 "จงสังหารสัตว์ร้ายและนำตัวอื่นมาให้ข้า!"
 tour_grounds_events.3010.b:0 "ทุกคนทำผิดพลาดได้"
 tour_grounds_events.3011.title:0 "$tour_grounds_events.3010.title$"
 tour_grounds_events.3011.desc.intro:0 "ขณะขี่ม้าผ่านบริเวณพร้อมกับ[visiting_liege.Custom2('MyCharacterIntroduction', ROOT.Char)] พาหนะของ[visiting_liege.GetHerHis] สะดุดก้อนหินบนพื้น ทำให้[visiting_liege.GetHerHim] เสียการทรงตัวชั่วครู่ ทันทีที่สมาชิกบางคนในขบวนเริ่มหัวเราะคิกคัก [visiting_liege.GetNameNoTooltip] ก็ลงจากหลังม้า"
 tour_grounds_events.3011.desc.mid.irritable:0 "ด้วยความโกรธและเชือดคอสัตว์น่าสงสารอย่างเลือดเย็นและเฝ้าดูชีวิตไหลออกจากร่างของมัน"
 tour_grounds_events.3011.desc.mid.calm:0 "และยิงธนูเข้าไประหว่างตาของสัตว์ร้ายน่าสงสารอย่างระมัดระวัง"
 tour_grounds_events.3011.desc.outro:0 "\n\n"ข้าไม่ต้องการสัตว์หรืออาณาประชาราษฎร์ที่ ทำให้ข้าผิดหวัง ข้าสามารถหาตัวใหม่ได้เสมอ""
 tour_grounds_events.3011.a:0 "ข้าสามารถหาตัวใหม่ให้ท่านได้ ฝ่าบาท[visiting_liege.GetLadyLord]!"
 tour_grounds_3011.vassal_paid_for_new_horse:0 "[stop_host_scope.GetNameNoTooltip] เสนอที่จะซื้อม้าตัวใหม่"
 tour_grounds_events.3011.b:0 "เข้าใจแล้ว"
 tour_grounds_3011.vassal_did_not_pay:0 "ข้าซื้อม้าตัวใหม่"

 tour_grounds_events.3012.title:0 "พวกลักลอบล่าสัตว์!"
 tour_grounds_events.3012.desc.intro:0 "ขณะที่ข้าและคณะผู้ติดตามขี่ม้าไป ข้าได้ยินเสียงพึมพำดังก้องไปทั่วบริเวณ ข้าสั่งให้เด็กชายคนหนึ่งขี่ม้าไปข้างหน้า และเมื่อเขากลับมา เขาแจ้งให้ข้าทราบว่ามีกลุ่มพวกลักลอบล่าสัตว์ผิดกฎหมายอยู่ข้างหน้าเรา\n\n"
 tour_grounds_events.3012.desc.mid.sadistic:0 "นี่เป็นโอกาสอันดีที่จะสร้างความเจ็บปวดอย่างสมเหตุสมผลให้กับวิญญาณที่ไม่สงสัยบางดวง และ ทำให้ตัวเองเป็นที่โปรดปรานของ[stop_host_scope.Custom2('MyCharacterIntroduction', ROOT.Char)] ในเวลาเดียวกัน"
 tour_grounds_events.3012.desc.mid:0 "แม้ว่านี่จะไม่ใช่เรื่องของข้า แต่ไม่ต้องสงสัยเลยว่ามันจะ ทำให้ข้าเป็นที่โปรดปรานของ[stop_host_scope.Custom2('MyCharacterIntroduction', ROOT.Char)] หากข้ากำจัดกิจกรรมที่ผิดกฎหมายนี้ออกจากบริเวณ"
 tour_grounds_events.3012.desc.outro:0 "\n\nข้าสามารถรวบรวมคนพาลเหล่านี้ และมอบศีรษะและมือของพวกเขาให้กับ[stop_host_scope.GetNameNoTooltip] ได้โดยไม่มีปัญหามากนัก"
 tour_grounds_events.3012.a:0 "ถึงเวลาล่าสัตว์แล้ว"
 tour_grounds_events.3012.b:0 "ปล่อยพวกเขาไป โดยมีค่าธรรมเนียม"
 tour_grounds_events.3012.c:0 "หลีกเลี่ยงพวกเขา"
 tour_grounds_events.3013.title:0 "ถุงชิ้นส่วน"
 tour_grounds_events.3013.desc:0 "ข้าแยกจาก[visiting_liege.Custom2('MyCharacterIntroduction', ROOT.Char)] มาระยะหนึ่งแล้ว และเมื่อเรากลับมาพบกัน ข้าเห็น[visiting_liege.GetHerHim] ขี่ม้ามาพร้อมกับถุงสีแดงที่หยดอยู่หลายใบข้าง[visiting_liege.GetHerHis]\n\n[visiting_liege.GetSheHe|U] เทถุงลงที่เท้าของข้า และข้าก็ตกใจเมื่อเห็นมือและศีรษะที่ถูกตัดขาดของวิญญาณที่โชคร้ายบางดวงไหลออกมา ใบหน้าของพวกเขาถูกล็อคอย่างถาวรในสีหน้าแห่งความสยดสยอง\n\n"ข้าถือวิสาสะกำจัดพวกลักลอบล่าสัตว์และโจรออกจากดินแดนของท่านแล้ว ไม่ต้องคิดมาก เพื่อน""
 tour_grounds_events.3013.a:0 "ขอบคุณ ฝ่าบาท[visiting_liege.GetLadyLord]"
 tour_grounds.vassal_impressed:0 "[stop_host_scope.GetFirstNameNoTooltip] รู้สึกประทับใจ"
 tour_grounds_events.3013.b:0 "ช่างน่าสยดสยอง!"
 tour_grounds.vassal_horrified:0 "[stop_host_scope.GetFirstNameNoTooltip] รู้สึกสยดสยอง"

 tour_grounds_events.3014.title:0 "ความฟุ่มเฟือยที่ต้องเสียภาษี"
 tour_grounds_events.3014.desc:0 "ขณะที่ข้าถูกพาไปชมสถานที่ท่องเที่ยวทั้งหมดใน[touring_grounds_scope.GetNameNoTooltip] ข้าเริ่มสังเกตเห็นความหรูหราโอ่อ่าของมันทั้งหมด\n\nแม้จะเป็นเพียง[stop_host_scope.GetTitleAsNameNoTooltip] แต่[stop_host_scope.GetFirstNameNoTooltip] ก็อาศัยอยู่ในความหรูหราและเห็นได้ชัดว่ามีเหรียญทองมากเกินพอที่จะใช้จ่าย\n\nเมื่อมองดูจำนวนหน้าต่างในที่พักของ[stop_host_scope.GetHerHis] ข้าสามารถแนะนำภาษีหน้าต่างและรีดไถ[stop_host_scope.GetTitleAsNameNoTooltip|U] จากส่วนเกินของ[stop_host_scope.GetHerHis] ได้"
 tour_grounds_events.3014.a:0 "ภาษีหน้าต่างนี่แหละ"
 tour_grounds_events.3014.b:0 "ข้าจะปล่อย[stop_host_scope.GetHerHim] ไปก่อนตอนนี้"
 tour_grounds_events.3015.title:0 "ภาษีหน้าต่าง"
 tour_grounds_events.3015.desc:0 "ข้าพิถีพิถันในการแสดงให้ [visiting_liege.Custom2('MyCharacterIntroduction', ROOT.Char)] เห็นทิวทัศน์อันงดงามทั้งหมดใน [touring_grounds_scope.GetNameNoTooltip] โดยเชื่อว่าตัวเองเป็นเจ้าภาพที่ยอดเยี่ยม\n\nอย่างไรก็ตาม ข้าสังเกตเห็น [visiting_liege.GetHerHim] หันความสนใจ [visiting_liege.GetHerHis] ไปยังที่พักอาศัยของข้าและชี้ไปที่มันขณะพึมพำบางอย่างกับ [visiting_liege.GetHerselfHimself] ข้าสอบถาม [visiting_liege.GetHerHim] และ [visiting_liege.GetSheHe] ก็ยิ้มกว้าง\n\n"อ่า ข้าแค่นับหน้าต่างอยู่ ท่านทราบเกี่ยวกับภาษีหน้าต่างภาคบังคับใช่หรือไม่? มันมีมาตั้งแต่การก่อตั้ง [visiting_liege.GetPrimaryTitle.GetNameNoTooltip] และข้าไม่อาจปล่อยให้หน้าต่างจำนวนมากที่ไม่สมเหตุสมผล เช่นนี้ผ่านไปโดยไม่มีการเก็บภาษีที่เหมาะสมได้""
 tour_grounds_events.3015.a:0 "ก็ได้ ข้าจะจ่ายภาษีหน้าต่างของท่าน"
 tour_grounds.vassal_paid_tax:0 "[stop_host_scope.GetName] จ่ายภาษี"
 tour_grounds_events.3015.b:0 "ภาษีหน้าต่างอะไรนะ?"
 tour_grounds.vassal_refused_to_pay_tax:0 "[stop_host_scope.GetName] ปฏิเสธภาษี"
 tour_grounds.vassal_won_tax_duel:0 "[stop_host_scope.GetName] หลีกเลี่ยงภาษี"

 tour_grounds_events.3016.title:0 "ของที่ระลึก"
 tour_grounds_events.3016.desc:0 "ในที่สุดข้าก็พบว่าตัวเองอยู่ตามลำพังในป่าของ[touring_grounds_scope.GetNameNoTooltip] และจิตใจของข้าก็วนเวียนอยู่กับความคิดถึง[liege_lover_scope.Custom2('MyCharacterIntroduction', ROOT.Char)]\n\nข้าปฏิเสธไม่ได้ว่า[touring_grounds_scope.GetNameNoTooltip] เป็นสถานที่ที่สวยงามอย่างแท้จริง เกือบจะสวยงามพอๆ กับ[liege_lover_scope.GetNameNoTooltip] ที่รักของข้า ข้ารู้สึกอยากทิ้งร่องรอยไว้ที่นี่ เพื่อให้ทุกคนที่ผ่าน[touring_grounds_scope.GetNameNoTooltip] รู้ถึงความรักของข้าที่มีต่อ[liege_lover_scope.GetHerHim] บางทีอาจจะสลักชื่อของ[liege_lover_scope.GetHerHis] ลงบน[touring_grounds_scope.Custom('get_carvable_surface')]!"
 tour_grounds_events.3016.a:0 "มันจะต้องสำเร็จ"
 tour_grounds_events.3016.b:0 "ไม่ สถานที่แห่งนี้สมบูรณ์แบบอยู่แล้ว"
 tour_grounds_events.3017.title:0 "ถูก ทำให้เสื่อมเสีย"
 tour_grounds_events.3017.desc:0 "ในที่สุดข้าก็ตามทัน[visiting_liege.GetTitleAsNameNoTooltip|U] ของข้า และด้วยความสยดสยอง ข้าพบว่า[visiting_liege.GetHerHim] กำลังสลักชื่อของ[visiting_liege.GetHerHis] ลงบน[touring_grounds_scope.Custom('get_carvable_surface')]\n\nไม่ต้องสงสัยเลยว่า[visiting_liege.GetSheHe] ไม่มีทางรู้ว่า[touring_grounds_scope.Custom('get_carvable_surface')] นี้มีความสำคัญทางจิตวิญญาณอย่างยิ่งต่อคนในท้องถิ่น และหากพวกเขารู้ว่า[visiting_liege.GetTitleAsNameNoTooltip|U] ของพวกเขาทำลายสถานที่ศักดิ์สิทธิ์ เช่นนี้ พวกเขาจะสาปแช่งชื่อ[visiting_liege.GetName] ไปอีกหลายชั่วอายุคน!"
 tour_grounds_events.3017.a:0 "น่าเสียดาย"
 tour_grounds_events.3017.b:0 "ข้าจะรับผิดเอง!"
 tour_grounds_events.3018.title:0 "$tour_grounds_events.3017.title$"
 tour_grounds_events.3018.desc:1 "ข้ากำลังแกะสลักของข้าลงบน [touring_grounds_scope.GetProvince.Custom('get_carvable_surface')] อย่างมีความสุข เมื่อข้าได้ยินเสียงสูดลมหายใจอย่างกะทันหันจากข้างกายข้า\n\n[stop_host_scope.Custom2('MyCharacterIntroduction', ROOT.Char)|U] ดูสยดสยองอย่างยิ่งขณะที่ [stop_host_scope.GetSheHe] เห็นผลงานแกะสลักของข้า, และในไม่ช้าก็เข้ามาหาข้าเพื่ออธิบาย\n\n"[ROOT.Char.Custom('FormOfAddressForLiege')|U], ข้ามั่นใจว่าท่านไม่ทราบว่า [touring_grounds_scope.GetProvince.Custom('get_carvable_surface')] นี้ ถือเป็นวัตถุศักดิ์สิทธิ์สำหรับชาวบ้านใน [touring_grounds_scope.GetNameNoTooltip]!""
 tour_grounds_events.3018.desc.outro.took_the_blame:0 "อย่ากลัวไปเลย ข้าจะรับผิดในเรื่องนี้เอง เพียง แต่อย่าพูดถึงเรื่องนี้อีก""
 tour_grounds_events.3018.desc.outro.blamed_liege:0 "ชาวนาและนักบวชแห่ง[touring_grounds_scope.GetNameNoTooltip] จะสาปแช่งชื่อของท่านไปชั่วนิรันดร์สำหรับการลบหลู่ของท่าน!""
 tour_grounds_events.3018.a.took_blame:0 "ขอบคุณ"
 tour_grounds_events.3018.a.was_blamed:1 "ทำไม[touring_grounds_scope.GetProvince.Custom('get_carvable_surface')] ถึงไม่เคยเป็นแค่[touring_grounds_scope.GetProvince.Custom('get_carvable_surface')]?"

 tour_grounds_events.3019.title:0 "ส่วนเกินที่ต้องเสียภาษี"
 tour_grounds_events.3019.desc:0 "[touring_grounds_scope.GetNameNoTooltip] ดูเหมือนจะเป็นสถานที่ที่หรูหราและฟุ่มเฟือยอย่างแท้จริง โดยมี[stop_host_scope.GetTitleAsNameNoTooltip] ที่อ้วนท้วนเป็นผู้ปกครอง\n\nทุกที่ที่ข้ามอง ข้าเห็นสัญญาณ ซึ่งทั้งหมดชี้ไปที่สิ่งเดียว: สิ่งอำนวยความสะดวกที่ต้องเสียภาษีที่ไม่ได้แจ้ง จำนวนปศุสัตว์ดูเหมือนจะสูงกว่าที่รายงานไว้มาก ที่พักของ[stop_host_scope.GetTitleAsNamePossessiveNoTooltip] ดูหรูหราเกือบจะพอสำหรับ[ROOT.Char.GetTitleAsNameNoTooltip|U]!\n\n[greedy_entourage_member.GetName] แนะนำว่าข้าควรเก็บภาษีส่วนเกินนี้ เนื่องจาก[stop_host_scope.GetName] ไม่ได้จ่ายค่าธรรมเนียมของ[stop_host_scope.GetHerHis] อย่างชัดเจน"
 tour_grounds_events.3019.a:0 "เก็บภาษี[stop_host_scope.GetTitleAsNameNoTooltip]!"
 tour_grounds_events.3019.b:0 "ข้าจะยกเว้นให้พวกเขาก่อนตอนนี้"
 tour_grounds_events.3020.title:0 "$tour_grounds_events.3019.title$"
 tour_grounds_events.3020.desc:0 "[visiting_liege.GetName] ดูเหมือนจะห่างเหินและฟุ้งซ่านเล็กน้อยเมื่อเร็วๆ นี้ บางครั้งก็พึมพำกับ[visiting_liege.GetHerselfHimself] และกระซิบกับ[greedy_entourage_member.GetName] ในที่สุด [visiting_liege.GetSheHe] ก็เข้ามาหาข้าโดยตรงและพูดสิ่งที่อยู่ในใจของ[visiting_liege.GetHerHis] ออกมา\n\n"ในฐานะ[stop_host_scope.GetTitleAsNameNoTooltip] ท่านต้องตระหนักถึงภาระผูกพันทางการเงินที่มีต่อข้าในฐานะเจ้าเหนือหัวของท่าน เมื่อข้ามองไปรอบๆ ความยิ่งใหญ่ของบ้านท่าน ข้าอดไม่ได้ที่จะรู้สึกว่าท่านโกงภาษีไปเล็กน้อย บางทีเราควรจะแก้ไขให้ถูกต้อง""
 tour_grounds_events.3020.a:0 "ข้าจ่ายสิ่งที่ข้าเป็นหนี้แล้ว!"
 tour_grounds_events.3020.b:0 "ดีมาก"
 tour_grounds_events.3040.title:0 "อาณาประชาราษฎร์ที่ไม่ภักดี"
 tour_grounds_events.3040.desc.intro:0 "ข้าพบว่าตัวเองอยากรู้ว่าคนชั้นต่ำของ[ROOT.Char.GetCurrentLocation.GetNameNoTooltip] อาศัยอยู่อย่างไร ดังนั้นข้าจึงไปเยี่ยมสถานประกอบการแห่งหนึ่งที่คนในท้องถิ่นดูเหมือนจะค่อนข้างส่งเสียงดัง ชายคนหนึ่งยืนอยู่บนโต๊ะ ดึงดูดความสนใจของทุกคนที่ได้ยิน\n\n"เราต้องการ[stop_host_scope.GetTitleAsNameNoTooltip|U] ไปเพื่ออะไรกันแน่? [stop_host_scope.GetFirstName]"
 tour_grounds_events.3040.desc.mid.wrong_language:0 "ไม่แม้ แต่จะพูดภาษาของเรา,"
 tour_grounds_events.3040.desc.mid.wrong_culture:0 "เป็นคนต่างชาติ,"
 tour_grounds_events.3040.desc.mid.wrong_faith:0 "เป็น[stop_host_scope.GetFaith.GetAdherentName] ที่มุ่งหน้าสู่[angry_peasant.GetFaith.NegativeAfterLife],"
 tour_grounds_events.3040.desc.mid.shit_beer:0 "เลี้ยงเราด้วย[angry_peasant.Custom('RegionalAlcoholicDrink')] ห่วยๆ นี้,"
 tour_grounds_events.3040.desc.mid.shit_weed:0 "มอมเมาเราด้วยกัญชาราคาถูกและคาดหวังให้เราเงียบ,"
 tour_grounds_events.3040.desc.mid.conscription:0 "ทำให้เราต้องต่อสู้ในสงครามของ[stop_host_scope.GetHerHis] ในขณะที่[stop_host_scope.GetSheHe] พักผ่อนอยู่บนเกียรติยศของ[stop_host_scope.GetHerHis],"
 tour_grounds_events.3040.desc.mid.high_taxes:0 "รีดเลือดเราจนแห้งด้วยภาษีบ้านี่,"
 tour_grounds_events.3040.desc.mid.just_plain_dislike_em:0 "คือ [stop_host_scope.Custom2('InsultNoun', ROOT.Char)] ที่ [stop_host_scope.Custom2('InsultAdjective', ROOT.Char)] ที่สุดเท่าที่ข้าเคยเห็นมา,"
 tour_grounds_events.3040.desc.outro:0 "แต่[stop_host_scope.GetSheHe] คาดหวังความภักดีที่ไม่สิ้นสุดจากเรา!"\n\nทั้งอาคารก็ระเบิดเสียงทุบและปรบมือ เห็นได้ชัดว่า[stop_host_scope.GetTitleAsNameNoTooltip|U] ของข้าไม่เป็นที่นิยมในบ้านของ[stop_host_scope.GetHerHis] เอง"
 tour_grounds_events.3040.a:0 "จับกุมคนทรยศเหล่านี้!"
 tour_grounds_events.3040.b:0 "อย่าพูดจาไม่ดีถึง[stop_host_scope.GetTitleAsNameNoTooltip|U]! มาสู้กัน!"
 tour_grounds_events.3040.c:0 "ชาวนาเหล่านี้มีความคิดที่ถูกต้อง"
 tour_grounds_events.3050.title:0 "การทำร้ายร่างกาย"
 tour_grounds_events.3050.desc:0 ""เอาเงินคืนมาให้ข้า!"\n\nเสียงเลือดกระเซ็นและกระดูกแตกดังขึ้นเรียกความสนใจของข้าไปยังรางน้ำสกปรก ที่ ซึ่งข้าเห็น [beaten_peasant.GetWomanMan] ยากจนคนหนึ่งถูกอันธพาลท้องถิ่นจับคอเสื้อ [beaten_peasant.GetHerHis] อยู่\n\nโดยปกติแล้ว เรื่องแบบนี้จะต่ำกว่าศักดิ์ศรีของข้า แต่ข้าจะยอมให้อาชญากรรมที่โจ่งแจ้ง เช่นนี้เกิดขึ้นต่อหน้าต่อตาข้าได้อย่างไร?"
 tour_grounds_events.3050.a:0 "ทหาร! จับกุมคนโง่นี่!"
 tour_grounds_events.3050.b:0 "[ROOT.Char.GetTitleAsNameNoTooltip|U] ที่ดีปกป้องอาณาประชาราษฎร์ของ[ROOT.Char.GetHerHis]!"
 tour_grounds_events.3050.b.success:0 "ท่านชนะการต่อสู้"
 tour_grounds_events.3050.b.failure:0 "ท่านแพ้การต่อสู้"
 tour_grounds_events.3050.c:0 ""เฮ้ ให้ข้าทำร้าย[beaten_peasant.GetHerHim] หน่อยสิ!""
 tour_grounds_events.3060.title:0 "สุดยอดของ[ROOT.Char.GetCurrentLocation.GetNameNoTooltip|U]"
 tour_grounds_events.3060.desc.intro:0 "[stop_host_scope.Custom2('MyCharacterIntroduction', ROOT.Char)|U] ได้ตัดสินใจในวันนี้ที่จะพาข้าไปชมค่ายทหารของ[stop_host_scope.GetHerHis]\n\n"
 tour_grounds_events.3060.desc.light_infantry:0 "ทหารราบเบาเรียงแถวกันอย่างตั้งใจในชุดเกราะ พร้อมสำหรับการตรวจของข้า"
 tour_grounds_events.3060.desc.archers:0 "พลธนูเรียงแถวกันพร้อมรบ ถือคันธนูในมือ"
 tour_grounds_events.3060.desc.heavy_infantry:0 "ทะเลเกราะที่ส่องประกายระยิบระยับตั้งอยู่เบื้องหน้าข้า ทหาร แต่ละนายดูเหมือนจะไม่สะทกสะท้านกับน้ำหนักบนร่างกายของพวกเขา"
 tour_grounds_events.3060.desc.cavalry:0 "ม้าร้องและส่งเสียงฟืดฟาด กระตือรือร้นให้ผู้ขี่พาพวกมันไปบุก"
 tour_grounds_events.3060.desc.camel_cavalry:0 "อูฐร้องครวญครางและเตะ ราวกับคันที่จะ ทำให้ทหารม้าศัตรูหวาดกลัว"
 tour_grounds_events.3060.desc.elephant_cavalry:0 "ข้าทึ่งในขนาดมหึมาของกองทหารช้าง และข้ากลัวที่จะจินตนาการถึงช่วงเวลาสุดท้ายของผู้ที่ถูกเหยียบย่ำใต้ฝ่าเท้าของพวกมัน"
 tour_grounds_events.3060.desc.outro:0 "เหล่านี้เป็นทหารที่ดี แต่ดูเหมือนเป็นการสิ้นเปลืองที่จะให้พวกเขาอยู่เฉยๆ ทั้งวัน"
 tour_grounds_events.3060.a:0 "พวกเขาสามารถกำจัดอาชญากรรมได้!"
 tour_grounds_events.3060.b:0 "บางทีพวกเขาอาจจะได้รับการจัดการอย่างมีประสิทธิภาพมากขึ้น"
 tour_grounds_events.3060.b.success:0 "ค่ายทหารได้รับการปรับปรุง"
 tour_grounds_events.3060.b.failure:0 "คำแนะนำของท่านไม่ได้ผล"
 tour_grounds_events.3060.b.vassal:0 "[visiting_liege.GetFirstName] เข้ามายุ่งเกี่ยวกับกองทัพของท่าน"
 tour_grounds_events.3060.c:0 "ข้าสามารถใช้ทหาร เช่นนี้ได้"
 tour_grounds_events.3060.d:0 "บางทีข้าอาจจะได้เรียนรู้อะไรบางอย่างที่นี่"
 tour_grounds_events.3070.title:0 "ช่วงเวลาแห่งความเงียบสงบ"
 tour_grounds_events.3070.desc.intro:0 "ข้าพบว่าตัวเองกำลังเดินเล่นกับคณะผู้ติดตามไปรอบๆ สถานที่ท่องเที่ยวอันงดงามนอกเมือง[ROOT.Char.GetCurrentLocation.GetName] และ"
 tour_grounds_events.3070.desc.royal_garden:0 "รอบๆ สวนหลวงอันงดงามของ[stop_host_scope.GetNamePossessive]\n\nภายในกำแพงสวน ไม่มีอะไรนอกจากตัวข้า ขุนนางชั้นผู้น้อยไม่กี่คน และสวนที่จัดไว้อย่างแม่นยำและซับซ้อน การหยุดครู่หนึ่งเพื่ออยู่ที่นี่ ทำให้ข้าเต็มไปด้วยความสงบสุขที่ข้าไม่ค่อยมีโอกาสได้สัมผัส"
 tour_grounds_events.3070.desc.royal_forest:0 "รอบๆ ป่าหลวงอันน่าหลงใหลของ[stop_host_scope.GetNamePossessive]\n\nป่าแห่งนี้ปราศจากชาวนาหรือขุนนางชั้นผู้น้อยโดยสิ้นเชิง มีเพียงข้า คนสนิทที่ใกล้ชิดที่สุดของข้า และการสร้างสรรค์ของ[ROOT.Char.GetFaith.CreatorNamePossessive|U] ข้ารู้สึกเหมือนถูกส่งไปยังอาณาจักรแห่งความสงบอันบริสุทธิ์ ช่วงเวลาก่อนที่หัวใจอันหายนะของมนุษย์จะ ทำให้โลกแปดเปื้อนด้วยความชั่วร้ายและความอ่อนแอ"
 tour_grounds_events.3070.desc.leisure_palace:0 "รอบๆ พระราชวังฤดูร้อนของ[stop_host_scope.GetNamePossessive]\n\nภายนอกพระราชวังตก แต่งด้วยประติมากรรมที่งดงามและพืชพรรณท้องถิ่นที่จัดเรียงอย่างพิถีพิถัน และภายในก็ยิ่งใหญ่และหรูหราไม่แพ้กัน ทุกสิ่งเกี่ยวกับภาพและสัมผัสของการอยู่ในพระราชวังแห่งนี้มีอยู่เพื่อปลอบประโลมจิตวิญญาณที่ตึงเครียด"
 tour_grounds_events.3070.desc.outro:0 "\n\nข้าสามารถอยู่ที่นี่ได้ตลอดไป"
 tour_grounds_events.3070.a:0 "ข้าสามารถเรียนรู้มากมายจากสถานที่แห่งนี้"
 tour_grounds_events.3070.b:0 "การเดินเล่นสบายๆ เป็นของขวัญ"
 tour_grounds_events.3070.c:0 "ประจำการทหาร ความสงบสุขนี้ต้องได้รับการปกป้อง!"
 tour_grounds_events.3080.title:0 "กองทัพท้องถิ่น"
 tour_grounds_events.3080.desc.intro:0 "ข้าพบว่าตัวเองกำลังเดินเตร่ไปยังสถานที่ท่องเที่ยวทางทหารของ[ROOT.Char.GetCurrentLocation.GetName] และข้าบังเอิญเข้าไปใน[stop_host_scope.GetNamePossessive]"
 tour_grounds_events.3080.desc.military_academy:0 "โรงเรียนนายร้อย\n\nทั่วทั้งโรงเรียน ข้าเห็น$knight_culture_player_plural_no_tooltip_lowercase$ ผู้ทรงเกียรติฝึกฝนและลับคมทักษะของพวกเขา โดยรู้ดีว่าสงครามอยู่ใกล้แค่เอื้อมเสมอ"
 tour_grounds_events.3080.desc.march:0 "เขตชายแดน\n\nทั่วทั้งชายแดน พวกเขาเตรียมพร้อมสำหรับผู้บุกรุกหรือผู้ฝ่าฝืนกฎหมายที่จะเข้ามาในสายตาของพวกเขา ด้วยประสิทธิภาพของผู้เชี่ยวชาญ"
 tour_grounds_events.3080.desc.siege_works:0 "โรงงานเครื่องล้อม\n\nเครื่องยนต์อยู่ภายใต้การดูแลและบำรุงรักษาอย่างต่อเนื่อง บางส่วนกำลังได้รับการซ่อมแซมและบางส่วนกำลังถูกประกอบขึ้นเป็นครั้งแรก ข้ากลัวที่จะนึกถึงคนร้ายคนต่อไปที่กำแพงจะต้องเผชิญหน้ากับเครื่องจักรเหล่านี้"
 tour_grounds_events.3080.desc.royal_armories:0 "คลังแสงหลวง\n\nความแวววาวของชุดเกราะที่เรียงรายอยู่ในคลังแสงหลวงเกือบจะ ทำให้ห้องสว่างไสวราวกับแสงจากต่างโลกเมื่อข้าเข้าไป หมวกเกราะและเสื้อเกราะโซ่เรียงรายอยู่บนทุกพื้นผิว กลิ่นน้ำมันจางๆ ลอยออกมาจากพวกมัน"
 tour_grounds_events.3080.desc.jousting_lists:0 "ลานประลองทวน\n\nเสียงร้องและเสียงฮึดฮัดของม้าถูกขัดจังหวะด้วยเสียงกระแทกและแตกหักของหอก กีบเท้าที่ดังสนั่นตีจังหวะสตัคคาโตขณะที่ข้าเข้าใกล้ เสียงตะโกนให้กำลังใจดังก้องไปทั่ว"
 tour_grounds_events.3080.desc.archery_ranges:0 "สนามยิงธนู\n\nเสียง #EMP ตุ้บ-ตุ้บ-ตุ้บ#! ของลูกธนูที่กระทบเป้ามาพร้อมกับเสียงดีดสายธนู ลมพัดเบาๆ พัดผ่าน สร้างความปั่นป่วนให้กับพลธนูที่กำลังฝึกซ้อมเมื่อมันพัดแรงขึ้น"
 tour_grounds_events.3080.desc.outro:0 "\n\n[ROOT.Char.GetCurrentLocation.GetName] เป็นศูนย์กลางทางทหารที่ดี และเห็นได้ชัดว่าข้ามีอะไรให้เรียนรู้มากมายจากการปฏิบัติของพวกเขา"
 tour_grounds_events.3080.a:0 "และข้าจะเรียนรู้"
 tour_grounds_events.3080.b:0 "คนว่างงานเหล่านี้ควรจะกวาดล้างอาชญากร!"
 tour_grounds_events.3080.c:0 "บางทีข้าควรจะได้รับบทเรียน"
 tour_grounds_events.3090.title:0 "ความภาคภูมิใจของชาวนา"
 tour_grounds_events.3090.desc.intro:0 "เดินเตร่ไปตามชนบทของ[ROOT.Char.GetCurrentLocation.GetName] ข้าบังเอิญไปพบกับสิ่งที่ดูเหมือนจะเป็นการรวมตัวของชาวนาในหมู่บ้านเล็กๆ\n\nพร้อมด้วยเจ้าของที่ภาคภูมิใจ,"
 tour_grounds_events.3090.desc.vegetables:0 "[farmer.Custom('RegionalRootVegetablePlural')] ขนาดมหึมาเต็มเกวียนและแผงลอยในตลาด"
 tour_grounds_events.3090.desc.livestock:0 "ปศุสัตว์อ้วนท้วนและแข็งแรงเล็มหญ้า ดูดีพอที่จะกัดกินได้ทันที!"
 tour_grounds_events.3090.desc.outro:0 "ชาวนาจะนำสินค้าของตนมาให้ตัดสินเป็นครั้งคราว วิเคราะห์ขนาดและสุขภาพของมัน ดูเหมือนว่าพวกเขากำลังจัดเทศกาลบางอย่าง และทันทีที่ข้าถูกสังเกตเห็น พวกเขาก็กระตือรือร้นที่จะแสดงผลงานของพวกเขาให้ข้าดู"
 tour_grounds_events.3090.a:0 "เราควรสำรวจดินแดนเหล่านี้"
 tour_grounds_events.3090.b:0 ""นี่เป็นการเสียเวลา! กลับไปที่นาของพวกเจ้า!""
 tour_grounds_events.3090.c:0 "วิเศษมาก ข้าจะตัดสินการประกวด"
 tour_grounds_events.3100.title:0 "วันที่เงียบสงบ"
 tour_grounds_events.3100.desc.intro:0 "ในการเดินทางของข้าที่[ROOT.Char.GetCurrentLocation.GetName] ข้าพบช่วงเวลาที่หาได้ยาก ซึ่งข้าไม่ได้ถูกเจ้าภาพพาไปไหนมาไหน หรือถูกคาดหวังให้ปรากฏตัวที่ใด\n\nข้าเห็นศาสนสถานเต็มไปด้วยผู้คนสำหรับวันนั้น,"
 tour_grounds_events.3100.desc.booze:0 "โรงเตี๊ยมเริ่มต้อนรับนักดื่มช่วงเช้า,"
 tour_grounds_events.3100.desc.hash:0 "บุคคลน่าสงสัยเดินทางไปยังสวนกัญชาลับ,"
 tour_grounds_events.3100.desc.outro:0 "และขอทานนอนอยู่บนถนนอ้อนวอนขอเพียงเศษอาหารกิน"
 tour_grounds_events.3100.a:0 "ต้องทำการสำรวจสำมะโนประชากรของการตั้งถิ่นฐานนี้"
 tour_grounds_events.3100.b:0 "ข้าควรใช้เวลาทั้งวันในที่ประทับของ[ROOT.Char.GetFaith.HighGodNamePossessive]"
 tour_grounds_events.3100.c:0 "ข้าควรจะดูว่าชาว[ROOT.Char.GetCurrentLocation.GetCounty.GetFaith.GetAdherentNamePlural] นมัสการอย่างไร"
 tour_grounds_events.3100.d:0 "โอกาสอันยอดเยี่ยมสำหรับการกุศล"
 tour_grounds_events.3100.e:0 "ข้าแค่อยากพักผ่อน"

