 host_dinner_events.3100.vassal_refuses:0 "[stop_host_scope.GetFirstName] ปฏิเสธ"
 host_dinner_events.1009.enjoyed_weed:0 "[visiting_liege.GetFirstName] เพลิดเพลินกับฮาชิช"
 host_dinner_events.1009.didnt_enjoy_weed: "[visiting_liege.GetFirstName] ไม่เพลิดเพลินกับฮาชิช"
 host_dinner_events.3020.won_drinking_duel:0 "ท่านชนะการแข่งขันดื่ม"
 host_dinner_events.3020.lost_drinking_duel:0 "ท่านแพ้การแข่งขันดื่ม"
 host_dinner_events.1007.enjoyed_performance:1 "[visiting_liege.GetFirstName] เพลิดเพลินกับการแสดง"
 host_dinner_events.1007.disliked_performance:0 "[visiting_liege.GetFirstName] ไม่ชอบการแสดง"
 host_dinner_events.1060.title:0 "ความอยากอาหารอันแรงกล้า"
 host_dinner_events.1060.desc.intro:0 "ข้าได้รับแจ้งว่าเมื่อเร็วๆ นี้ ทหารที่ยิ่งใหญ่ที่สุดคนหนึ่งในคณะผู้ติดตามของข้าได้เสียชีวิตลง แต่ร่างของ [dead_soldier.GetHerHis] ยังคงบริสุทธิ์ ปราศจากรอยแผลหรือโรคภัยไข้เจ็บ\n\n"
 host_dinner_events.1060.desc.cannibal_legal:0 "แน่นอน ในฐานะ [ROOT.Char.GetTitleAsNameNoTooltip|U] ที่ [dead_soldier.GetSheHe] ต่อสู้และตายเพื่อข้า เป็นสิทธิ์ของข้าที่จะบริโภคหัวใจของ [dead_soldier.GetHerHis] และได้รับจิตวิญญาณนักรบของ [dead_soldier.GetHerHis]"
 host_dinner_events.1060.desc.secret_cannibal:1 "แม้ว่าแนวโน้มการกินเนื้อคนของข้ายังคงไม่เป็นที่รู้จักในโลกภายนอก แต่คนรับใช้ที่ไว้ใจได้บางคนของข้าได้สกัดหัวใจของ [dead_soldier.GetHerHis] เพื่อการบริโภคของข้าแล้ว"
 host_dinner_events.1060.desc.outro:0 "แต่ เนื่องจาก [visiting_liege.GetTitleAsNameNoTooltip|U] ของข้ากำลังมาเยือน บางทีข้าควรจะให้เกียรติ [visiting_liege.GetHerHim] ในการบริโภคหัวใจของนักรบที่เก่งที่สุดคนหนึ่งของ [ROOT.Char.GetPrimaryTitle.GetAdjective]!"
 host_dinner_events.1060.a:0 "หัวใจที่คู่ควรกับ [visiting_liege.GetTitleAsNameNoTooltip|U]!"
 host_dinner_events.1060.b:0 "ข้าจะกินหัวใจเอง"
 you_ate_a_human_heart:0 "ท่านกินหัวใจมนุษย์"
 host_dinner_events.1061.title:0 "$host_dinner_events.1060.title$"
 host_dinner_events.1061.desc.intro:0 "อาหารมื้อต่อไปของข้าถูกเปิดเผยให้ข้าเห็น วางอยู่บนจานชั้นดีคือหัวใจที่ย่างช้าๆ วางอยู่ในแอ่งซอสเลือด\n\n"หัวใจของนักรบผู้ยิ่งใหญ่ [visiting_liege.GetTitleAsNameNoTooltip|U] ของข้า! กินมัน แล้วท่านก็จะมีความกล้าหาญและจิตวิญญาณเหมือนที่ [dead_soldier.GetSheHe] มี"\n\n"
 host_dinner_events.1061.desc.cannibal_legal:1 "มันดูงดงามอย่างยิ่ง ปรุงสุกอย่างสมบูรณ์แบบและนุ่มนวลจนข้าไม่จำเป็นต้องเอื้อมมือไปหยิบมีดเลย"
 host_dinner_events.1061.desc.secret_cannibal:0 "ข้าไม่มีทางเลือกอื่นนอกจากแสร้งทำเป็นตกใจและไม่สบายใจเมื่อเห็นสิ่งนั้น [stop_host_scope.GetName] จะรู้ความลับของข้าได้อย่างไร?"
 host_dinner_events.1061.desc.mid:0 "ข้าเกือบจะอาเจียนเมื่อเห็นสิ่งนั้น! แน่นอนว่า [stop_host_scope.GetName] ไม่ได้หมายความว่านี่คือ #EMP เนื้อคน!#!"
 host_dinner_events.1061.desc.outro:0 "เจ้าภาพของข้ามองมาที่ข้าอย่างคาดหวัง และค่อยๆ เขยิบจานเข้ามาใกล้ข้า"
 host_dinner_events.1061.a:0 "อร่อย!"
 host_dinner_events.1061.b:0 "ไม่ ไม่เป็นไร"
 host_dinner_events.1061.liege_ate_heart:0 "[visiting_liege.GetFirstName] กินหัวใจ"
 host_dinner_events.1061.liege_refused_heart:0 "[visiting_liege.GetName] ปฏิเสธ"
 host_dinner_events.1070.title:0 "ศักยภาพที่สูญเปล่า"
 host_dinner_events.1070.desc:0 "ข้าไม่ได้คิดอะไรมากเมื่อข้าจัดให้ [runaway_courtier.GetName] อยู่ข้างๆ ข้าในเย็นวันนี้ แต่เมื่อจานมาแล้วก็ไป ข้าพบว่าตัวเองเริ่มสนใจ [runaway_courtier.GetWomanMan] ที่ดีคนนี้มากขึ้นเรื่อยๆ\n\n"โอ้ ถ้าเพียง แต่ชีวิตจะน่าสนใจ เช่นนี้กลับไปที่เมืองหลวง วันส่วนใหญ่ข้าแค่นอนเล่นอยู่ในราชสำนัก เบื่อหน่ายและเกียจคร้าน ที่นี่ข้าไม่ขาดการสนทนาที่ดี ท่านจะต้อนรับข้าในฐานะข้าราชบริพารของท่านหรือไม่?""
 host_dinner_events.1070.a:0 ""แน่นอน เข้าร่วมกับข้า!""
 host_dinner_events.1070.b:0 ""ไม่""
 host_dinner_events.1071.title:0 "การแลกเปลี่ยนในราชสำนัก"
 host_dinner_events.1071.desc:1 "[runaway_courtier.Custom2('MyCharacterIntroduction', ROOT.Char)|U] เข้ามาหาข้าโดยอ้างว่าได้รับอนุญาตจาก [stop_host_scope.GetNamePossessive] ให้มาเข้าร่วมราชสำนักของ [stop_host_scope.GetHerHis] แทนที่ของข้าเอง\n\nการปล่อยให้เรื่องนี้ผ่านไปจะช่วยปรับปรุงสถานะของข้ากับ [stop_host_scope.GetTitleAsNameNoTooltip|U] อย่างแน่นอน แต่การดูหมิ่นด้วยการขโมยสมาชิกในราชสำนักของข้าเป็นสิ่งที่ข้าสามารถมองข้ามได้จริงหรือ?"
 host_dinner_events.1071.a:0 ""[runaway_courtier.GetNameNoTooltip] เป็นของข้า!""
 host_dinner_events.1071.refused_to_let_them_go:0 "[visiting_liege.GetName] ปฏิเสธที่จะปล่อย [runaway_courtier.GetName] ไป"
 host_dinner_events.1071.b:0 ""ไปที่ที่หัวใจของท่านพอใจ""
 host_dinner_events.1080.title:0 "การแสดงของคนร้าย"
 host_dinner_events.1080.desc:0 "ไม่ใช่ความลับเลยที่ข้าถือว่า [visiting_liege.GetName] เป็น [visiting_liege.Custom2('InsultNoun', ROOT.Char)] [visiting_liege.Custom2('InsultAdjective', ROOT.Char)], แต่ถึงกระนั้นเจ้าโง่นั่นก็ยังมาเหยียบย่ำห้องโถงของข้าจนได้ ข้าไม่อยากจะอยู่ร่วมกับ [visiting_liege.GetHerHis] ขณะที่ [visiting_liege.GetSheHe] สวาปามอาหารของข้าลงไปในลำคอของ [visiting_liege.GetHerHis], แต่แล้วความคิดหนึ่งก็ผุดขึ้นมา\n\nข้าสามารถ ทำให้การมาเยือนของ [visiting_liege.GetHerHis] เป็นที่น่าจดจำได้ หากข้าแสดงความชั่วร้ายของ [visiting_liege.GetHerHis] ให้เป็นที่ประจักษ์!"
 host_dinner_events.1080.a:0 "[visiting_liege.GetSheHe|U] ไม่สมควรได้รับอะไรน้อยไปกว่านี้"
 host_dinner_events.1080.b:0 "ข้าอยู่เหนือสิ่งนี้"
 host_dinner_events.1081.title:1 "[ROOT.Char.GetFirstNameNoTooltip]: คนร้ายแห่ง [stop_host_scope.GetPrimaryTitle.GetNameNoTierNoTooltip]"
 host_dinner_events.1081.desc:0 "ตามปกติ อาหารของข้ามาพร้อมกับความบันเทิง นักแสดงแสดงความสามารถกายกรรมและทักษะอันยอดเยี่ยม แต่แล้วข้าก็เริ่มสังเกตเห็นบางอย่าง ตลอดการแสดงของพวกเขามี [ROOT.Char.GetWomanMan] สวมเสื้อผ้าเหมือนข้าโดยมีสิ่งที่ดูเหมือนอุจจาระทาอยู่บนใบหน้าของ [ROOT.Char.GetHerHis] ร้องเพลงเกี่ยวกับความชั่วร้ายที่ถูกกล่าวหาของข้า!\n\nข้าหันไปหา [stop_host_scope.GetName] ด้วยความตกใจ เพียงเพื่อเห็นว่า [stop_host_scope.GetSheHe] กำลังหัวเราะเยาะการแสดงความหยาบคายนี้! ข้าไม่สามารถแตะต้องอาหารของข้าได้ เฝ้าดูและฟังขณะที่ทั้งราชสำนักหัวเราะเยาะการล้อเลียนตัวละครของข้าที่บิดเบี้ยวนี้"
 host_dinner_events.1081.a:0 "ข้าจะแก้แค้น"
 host_dinner_events.1081.b:0 "มันค่อนข้างตลก..."
 host_dinner_events.1081.liked_performance:0 "[visiting_liege.GetName] ชอบการแสดง"
 host_dinner_events.3120.title:0 "ของขวัญที่คู่ควรกับ [stop_host_scope.GetTitleAsNameNoTooltip]"
 host_dinner_events.3120.desc:0 "ในงานเลี้ยงอาหารค่ำ ข้าพบโอกาสที่จะแสดงความยิ่งใหญ่ของข้า ขบวนของข้าเต็มไปด้วยของมีค่าและผู้คนที่มีความสามารถ และบางทีข้าอาจจะ ทำให้ [stop_host_scope.GetName] พอใจได้หากข้าทิ้งส่วนเล็กๆ ของข้าไว้เบื้องหลัง\n\nมีหลายสิ่งที่ข้าสามารถมอบให้ได้จากความเมตตาของข้า บางที..."
 host_dinner_events.3120.a:1 "[courtier_gift.GetNameNoTooltip] สามารถอยู่ที่นี่ได้"
 host_dinner_events.3120.b:0 "[artifact_gift.GetNameNoTooltip] อาจเป็นของ [stop_host_scope.GetHerHis] ก็ได้"
 host_dinner_events.3120.c:0 "ทองคำเป็นของขวัญที่ดีเสมอ"
 host_dinner_events.3120.d:0 "ของขวัญแห่งมิตรภาพที่แท้จริง!"
 host_dinner_events.3120.e:0 "ข้าไม่ติดหนี้ของขวัญใดๆ"
 host_dinner_events.3121.title:0 "$host_dinner_events.3120.title$"
 host_dinner_events.3121.desc.intro:0 "ข้าเข้าไปในห้องอาหารและพบ [visiting_liege.GetName] นั่งอยู่ที่หัวโต๊ะ วางเท้าอย่างเฉยเมยพักอยู่ข้างอาหารของ [visiting_liege.GetHerHis]\n\n"ข้าหลวงที่ดีของข้า!"
 host_dinner_events.3121.desc.courtier:0 "ข้าสัญญาว่า [courtier_gift.GetName] เป็นข้าราชบริพารที่ดีและภักดี ซึ่งจะรับใช้ท่านได้ดีในอนาคต"
 host_dinner_events.3121.desc.artifact:0 "ข้าพบว่าคลังสมบัติของข้าเต็มไปด้วยโบราณวัตถุและสิ่งประดิษฐ์ที่มีค่า บางทีท่านอาจต้องการรับ [artifact_gift.GetName] ของข้า"
 host_dinner_events.3121.desc.gold_gift:0 "ข้าแบกรับภาระจากโชคลาภอันมหาศาลของข้า และข้าต้องการส่งต่อโชคลาภบางส่วนนั้นให้กับข้าราชบริพารที่ภักดีที่สุดของข้า"
 host_dinner_events.3121.desc.best_friend:0 "เราเป็นเพื่อนกันมาสักพักแล้ว และบางทีอาจถึงเวลาที่เราจะยกระดับความสัมพันธ์ไปอีกขั้น ท่านสนใจที่จะสาบานตนเป็นเพื่อน #EMP แท้#! กับข้าหรือไม่?"
 host_dinner_events.3121.desc.outro:0 "นี่คือของขวัญของข้าสำหรับท่าน โดยไม่จำเป็นต้องมีการตอบแทน""
 host_dinner_events.3121.a:0 ""ขอบคุณ!""
 host_dinner_3120_gift_taken:0 "[stop_host_scope.GetFirstName] รับของขวัญ"
 host_dinner_3120_gift_refused:0 "[stop_host_scope.GetFirstName] ปฏิเสธของขวัญ"
 host_dinner_events.3121.b:0 ""เราเป็นเพื่อนกัน ชั่วนิรันดร์""
 host_dinner_events.3121.c:0 "ข้าจะไม่รับมัน"
 host_dinner_events.3130.title:0 "ไม่ใช่สิ่งที่ [stop_host_scope.GetSheHe|U] ดูเหมือน"
 host_dinner_events.3130.desc:0 "ข้าพบว่าตัวเองตื่นขึ้นมาด้วยความหิวโหยอย่างทรมาน ไม่สามารถกลับไปพักผ่อนได้\n\nข้าเดินไปในความมืดไปยังห้องครัว และพบว่าห้องสว่างเล็กน้อยด้วยบางสิ่งนอกเหนือจากตะเกียงของข้า ชั้นวางของในตู้กับข้าวส่องแสงสีทองที่ไม่ใช่ของโลก แต่เชิญชวน\n\nข้าเต็มไปด้วยความอยากรู้อยากเห็น ไม่สามารถหาแหล่งกำเนิดของแสงได้ เมื่อเปลวไฟจากแสงของข้าดับลง ข้าเริ่มตรวจสอบรอบๆ ขอบตู้กับข้าว"
 host_dinner_events.3130.a:0 "ข้า #EMP ต้อง#! หาความจริงให้ได้!"
 host_dinner_events.3130.b:0 "ข้าไม่สามารถไปสอดแนมได้"
 host_dinner_events.3131.title:0 "ห้องหลังตู้กับข้าว"
 host_dinner_events.3131.desc:0 "ด้วยความพยายามเล็กน้อย ข้าสามารถพบรอยขีดข่วนบนพื้นตรงที่ตู้วางอยู่ และส่วนของชั้นวางบางส่วนมีฝุ่นน้อยกว่าส่วนที่เหลือมาก ชั้นวางเผยให้เห็นว่าเป็นสวิตช์กลไกเมื่อสัมผัส และด้วยความพยายามเล็กน้อย ข้าสามารถเลื่อนตู้กับข้าวออกจากผนังเพื่อเผยให้เห็นห้องที่ซ่อนอยู่!\n\nท่ามกลางหินที่ชื้นแฉะคือประตูไม้ที่แข็งแรงพร้อมแม่กุญแจที่ตก แต่งอย่างประณีตที่มือจับ เมื่อตรวจสอบแล้ว ตัวเลขของแม่กุญแจไม่ใช่ทั้งตัวเลขหรือตัวอักษร แต่เป็นแผนภาพของสัตว์ร้ายและสิ่งแปลกประหลาดทุกประเภท"
 host_dinner_events.3131.a:0 "ปริศนา นี่ควรจะเป็นเรื่องเล็กน้อย"
 host_dinner_events.3131.fail_to_get_it_open:0 "ท่านล้มเหลวในการเปิดประตู"
 host_dinner_events.3131.b:0 "การเตะประตูแรงๆ น่าจะใช้ได้ผล!"
 host_dinner_events.3131.c:0 "นี่มันพยายามมากเกินไป"
 host_dinner_events.3132.title:0 "ห้องสมุดที่ซ่อนอยู่"
 host_dinner_events.3132.desc:0 "ในความว่างเปล่าที่ประตูเคยอยู่ ข้าเห็นห้องทำงานที่ประณีตพร้อมสารที่ไม่รู้จักทุกชนิดเดือดปุดๆ บนไฟอ่อนๆ และสัตว์เล็กๆ ที่ติดอยู่ในกรงเล็กๆ ที่ใจกลางห้องมีหนังสือเล่มเดียววางอยู่บนแท่น ปกของมันส่องแสงระยิบระยับด้วยภาพวาดของสัตว์ร้ายและสิ่งแปลกประหลาดเหมือนกับที่อยู่บนแม่กุญแจปริศนาเข้าไปในห้อง\n\nข้าหยิบหนังสือไว้ในมือและรู้สึกถึงความอยากรู้อยากเห็นท่วมท้นขณะที่ข้าลูบนิ้วไปตามพื้นผิวที่เป็นหนังของมัน จากนั้นข้าก็เห็นตัวอักษรที่อ่านออกได้ตัวเดียวซ่อนอยู่ท่ามกลางสัญลักษณ์ที่ไม่บริสุทธิ์บนหน้าปก: หมายเลขหนึ่ง ข้าพยายามเปิดหนังสือ แต่พบว่ามันถูกล็อคแน่นด้วยปริศนาสามเหลี่ยมเล็กๆ"
 host_dinner_events.3132.a:0 "นี่หมายความว่าอะไร?"
 host_dinner_events.3132.b:0 "อีกชิ้นส่วนหนึ่งของปริศนา"
 artifact_secret_journal_with_cipher_description:0 "สมุดบันทึกคู่หนึ่ง เล่มหนึ่งถูกล็อคแน่นด้วยปริศนาที่อ่านไม่ออก และอีกเล่มหนึ่งเต็มไปด้วยรหัสสำหรับภาษาที่เข้ารหัสบางประเภท ทั้งสองดูเหมือนจะเข้าคู่กัน"
 artifact_secret_journal_with_puzzle_description:0 "สมุดบันทึกปกหนังแปลกๆ ที่ล็อคด้วยปริศนาที่อ่านไม่ออก พร้อมกับสมุดบันทึกอีกเล่มที่มีกุญแจสำหรับถอดรหัสปริศนา"
 host_dinner_events.3132.c:0 "ในที่สุด ข้าก็ได้มันทั้งหมด"
 artifact_secret_journal_unsolved_description:0 "สมุดบันทึกสามเล่ม แต่ละเล่มมีชิ้นส่วนที่แตกต่างกันในการไขปริศนาของกันและกัน แม้ว่าปริศนาจะยังไม่ได้รับการแก้ไข"
 host_dinner_events.3132.d:0 "ข้าควรทิ้งสิ่งนี้ไว้ที่นี่"
 host_dinner_events.3133.title:0 "คุกใต้ดินที่ซ่อนอยู่"
 host_dinner_events.3133.desc:0 "ประตูเปิดออกและเผยให้ข้าเห็น... บางสิ่งที่ข้าหวังว่าข้าจะไม่เห็น\n\nผนังทุกด้านประดับด้วยวัตถุแปลกๆ: แส้ ขื่อคา ไม้เทียมองคชาต เป็นต้น พื้นเปียกชื้นด้วยสิ่งที่ข้า #EMP หวัง#! ว่าจะเป็นเพียงน้ำ แต่เมื่อพิจารณาจากอุปกรณ์ในห้องนี้ ข้าก็อดคิดไม่ได้ว่ามันอาจจะเป็นของเหลวในร่างกายประเภทใด"
 host_dinner_events.3133.a:0 "ตอนนี้ข้ารู้เรื่องต่างๆ แล้ว"
 host_dinner_events.3134.title:0 "โรงฆ่าสัตว์ที่ซ่อนอยู่"
 host_dinner_events.3134.desc:0 "เมื่อประตูแง้มเปิดออก ข้าก็ถูกกระแทกล้มลงกับพื้นด้วยกลิ่นเหม็นฉุน ก้นของข้าเปียกโชกอยู่ในแอ่งเลือดสด\n\nห้องเต็มไปด้วยศพมนุษย์ ถูกชำแหละครึ่งหนึ่งและแขวนอยู่บนตะขอแขวนเนื้อ หนังมนุษย์วางอยู่บนโต๊ะชำแหละข้างศพที่มันเคยเกาะอยู่ มีมีดปังตอสกปรกอยู่ข้างๆ สีหน้าสยดสยองที่บิดเบี้ยวบนใบหน้าของเหยื่อเป็นส่วนหนึ่งของห้องอย่างถาวร"
 host_dinner_events.3134.a:0 "ข้าไม่สามารถลืมสิ่งที่ได้เห็นไปได้เลย"
 host_dinner_events.3135.title:0 "อุโมงค์หลบหนี"
 host_dinner_events.3135.desc:0 "ประตูแง้มเปิดออกเผยให้เห็นอุโมงค์มืดๆ ลื่นๆ ที่ปกคลุมไปด้วยไลเคนและเชื้อรา ข้าเดินลุยผ่านไป และตามถ้ำนี้ไปจนสุดทางและพบว่าตัวเองโผล่ออกมาด้านนอกสู่เส้นทางชนบทที่ไม่น่าสงสัย\n\nเห็นได้ชัดว่า นี่คืออุโมงค์หลบหนีของ [stop_host_scope.GetNamePossessive] ในกรณีฉุกเฉิน"
 host_dinner_events.3135.a:0 "ช่างเป็นการค้นพบอะไร เช่นนี้!"
 host_dinner_events.3136.title:0 "ห้องนอนลับ"
 host_dinner_events.3136.desc:0 "ประตูเปิดออกพร้อมเสียงหอบหายใจด้วยความตกใจ! ยืนอยู่ที่ประตูคือ [quasimodo_child.Custom('GirlBoy')] ที่ผิดรูป จ้องมองมาที่ข้าด้วยความตกใจและความสยดสยองอย่างสมบูรณ์ในดวงตาของ [quasimodo_child.GetHerHis]\n\n"อย่ามองข้า!" [quasimodo_child.GetSheHe|U] กรีดร้อง ป้องใบหน้าของ [quasimodo_child.GetHerHis] ด้วยมือของ [quasimodo_child.GetHerHis] "โอ้ ความสยดสยองที่รอท่านอยู่หาก [stop_host_scope.GetMotherFather] พบว่าท่านเห็นข้า!"\n\nตอนนั้นเองที่ข้าสังเกตเห็นความคล้ายคลึง นี่คือลูกนอกสมรสของ [stop_host_scope.GetNamePossessiveNoTooltip] อย่างชัดเจน!"
 host_dinner_events.3136.a:0 "ทุกคนจะรู้"
 host_dinner_events.3136.b:0 "จะไม่มีใครรู้เลย"
 host_dinner_events.3140.title:0 "การผสมผสานรสชาติ"
 host_dinner_events.3140.desc:0 "ชีวิตในฐานะ [ROOT.Char.GetTitleAsNameNoTooltip|U] นำอาหารที่งดงามและแปลกตามาสู่จานของข้าทุกประเภท แต่ช่วงหลังมานี้ข้าเริ่มเบื่อรสชาติและเนื้อสัมผัสเดิมๆ เหล่านี้แล้ว ข้าปรารถนาสิ่งที่แปลกประหลาดอย่างแท้จริง สิ่งที่แปลกใหม่อย่างแท้จริง!\n\nด้านหนึ่งของข้า ข้าเห็น [stop_host_scope.Custom('GetExpensiveDessert')] และอีกด้านหนึ่งคือผักต้ม จะเป็นอย่างไรหากข้านำรสชาติที่แตกต่างกันสองอย่างนี้มาลิ้มลองพร้อมกัน!"
 host_dinner_events.3140.a:0 "การทดลองที่คุ้มค่า"
 host_dinner_events.3140.satisfying_taste:0 "รสชาติงดงามมาก"
 host_dinner_events.3140.it_did_not_work:0 "การทดลองล้มเหลว"
 host_dinner_events.3140.b:0 "ข้าไม่สามารถกล้าหาญขนาดนั้นได้"
 host_dinner_events.1090.title:0 "ยาพิษ"
 host_dinner_events.1090.desc:0 "ดูเหมือนว่าโอกาสทองได้ตกอยู่ในมือข้าแล้วกับการมาเยือนห้องโถงของข้าของ [visiting_liege.GetNamePossessive]\n\n[visiting_liege.GetSheHe|U] คาดหวังอาหารที่น่าจดจำ และด้วยต้นไนท์เชดบดละเอียด ข้าสามารถรับประกันได้ว่า [visiting_liege.GetSheHe] จะไม่มีวันได้สัมผัสกับอาหารค่ำ เช่นนี้อีกเลย!\n\nเวลาลงมือใกล้เข้ามาแล้ว ข้าสามารถรับความเสี่ยงนี้ได้จริงหรือ?"
 host_dinner_events.1090.a:0 "แน่นอนว่าข้าทำได้!"
 host_dinner_events.1090.b:0 "เวลายังไม่เหมาะสม"
 host_dinner_if_you_succeed_tt:0 "หากท่านสำเร็จ"
 host_dinner_if_you_fail_tt:0 "หากท่านล้มเหลว"
 host_dinner_events.1091.title:0 "ยาพิษ!"
 host_dinner_events.1091.desc:0 "ข้ากิน [stop_host_scope.Custom('GetExpensiveDessert')] ของข้าโดยไม่สนใจโลก พอใจกับอาหารมื้ออร่อยอีกมื้อในท้องของข้า\n\nอย่างไรก็ตาม ขณะที่ข้าเดินขึ้นบันไดไปนอน ข้าเริ่มรู้สึกอ่อนแอ ราวกับว่าเลือดในร่างกายของข้าข้นขึ้น เกือบจะจับตัวเป็นลิ่มในเส้นเลือดของข้า ก่อนที่จะถึงยอดบันได ข้าก็ล้มลง หายใจหอบเพื่ออากาศ ขณะที่โลกรอบตัวข้ากลายเป็นสีดำ สิ่งสุดท้ายที่ข้าเห็นคือ [stop_host_scope.GetNamePossessive] จ้องมองลงมาที่ข้าด้วยรอยยิ้มที่รู้ทัน"
 host_dinner_1091_murder_succesful:0 "ท่านวางยาพิษ [visiting_liege.GetTitleAsNameNoTooltip|U] ของท่าน"
 host_dinner_events.1091.a:0 "ทำไม... ท่านถึงทำได้..."
 host_dinner_events.1092.title:0 "พยายามฆ่า"
 host_dinner_events.1092.desc:0 "ข้าหันไปหา [stop_host_scope.Custom('GetExpensiveDessert')] ของข้าและเริ่มลงมือ แต่แล้วความรู้สึกที่คอยรบกวนก็เข้ามาครอบงำ ทำให้มือที่ตะกละของข้าหยุดชะงัก\n\nข้าเขี่ยของหวานและดมกลิ่นแรงๆ สองสามครั้ง และไม่ต้องสงสัยเลยว่าอาหารของข้าถูกใส่ยาพิษ! ไม่มีคำอธิบายอื่น [stop_host_scope.GetName] กำลังพยายามฆ่าข้า"
 host_dinner_events.1092.a:0 "เจ้าปีศาจ!"
 host_dinner_1091_murder_failed:0 "การฆาตกรรมของท่านล้มเหลว"
 host_dinner_events.1093.title:0 "$host_dinner_events.1092.title$"
 host_dinner_events.1093.desc:0 "นักชิมอาหารผู้ภักดีของข้า [food_taster_scope.GetName] ทำหน้าที่ของ [food_taster_scope.GetHerHis] [food_taster_scope.GetSheHe|U] สรุปการตรวจสอบของ [food_taster_scope.GetHerHis] ด้วยการชิม [stop_host_scope.Custom('GetExpensiveDessert')] ของข้าและพยักหน้าเล็กน้อยเป็นการอนุมัติ\n\nในไม่ช้า [food_taster_scope.GetWomanMan] ผู้น่าสงสารก็เริ่มสำลักและไอ พยายามหายใจและทุบกำปั้นของ [food_taster_scope.GetHerHis] ลงบนโต๊ะ ภายในไม่กี่วินาที ริมฝีปากสีฟ้าของ [food_taster_scope.GetHerHis] ก็หมดลมหายใจสุดท้าย และข้าก็ถูกทิ้งให้อยู่ตามลำพังกับรอยยิ้มที่ไม่สบายใจของ [stop_host_scope.GetNamePossessive]"
 host_dinner_events.1093.a:0 ""ฆาตกร!""
 host_dinner_events.3150.title:0 "คำถามแห่งเกียรติยศ"
 host_dinner_events.3150.desc:0 "ข้านั่งอยู่ข้างอัศวินผู้ภักดีของ [stop_host_scope.GetNamePossessive] [joker_knight.GetName] ตลอดทั้งเย็น และจนถึงตอนนี้, [joker_knight.GetWomanMan] ผู้นี้ก็ช่างน่าเพลิดเพลินใจยิ่งนัก, ไม่เคยอายที่จะเล่าเรื่องตลกเลย\n\n"ข้าขอบอกท่านเลย, ในบรรดา [ROOT.Char.Custom2('InsultNoun', ROOT.Char)] ทั้งหมดที่ข้าเคยพบมา, [ROOT.Char.GetName] คือผู้ที่ [ROOT.Char.Custom2('InsultAdjective', ROOT.Char)] ที่สุด! ฮ่า!"\n\n"เจ้ากล้าพูดอะไรเกี่ยวกับ [ROOT.Char.GetLadyLord] ของข้า?" [humorless_knight.GetName] ลุกขึ้นจากที่นั่งของ [humorless_knight.GetHerHis] "ข้าขอท้าเจ้า, เจ้าคนชั่ว!""
 host_dinner_events.3150.a:0 "สนุกอะไรอย่างนี้!"
 host_dinner_events.3150.your_knight_wins:0 "[humorless_knight.GetName] เป็นผู้ชนะ!"
 host_dinner_events.3150.your_knight_loses:0 "[humorless_knight.GetName] แพ้"
 host_dinner_events.3150.b:0 "ถอยไป เจ้าคนโง่"
 host_dinner_events.3000.title:0 "เตรียมตัวสำหรับอาหารค่ำ"
 host_dinner_events.3000.desc.intro:2 "ข้าได้รับการต้อนรับที่คู่ควรกับ [ROOT.Char.GetTitleAsNameNoTooltip] ที่ประตู [stop_host_scope.Custom('FortifiedBuilding')] ของ [stop_host_scope.GetTitledFirstNamePossessive] ใน [ROOT.Char.GetCurrentLocation.GetName]"
 host_dinner_events.3000.desc.type.majesty:0 "และไม่ต้องสงสัยเลยว่าความงดงามของขบวนรถไฟของข้าได้สร้างความประทับใจอย่างยิ่ง\n\n"
 host_dinner_events.3000.desc.type.taxation:0 "เกวียนหีบสมบัติและเจ้าหน้าที่เก็บภาษีของข้า ทำให้เป้าหมายของการมาเยือนของข้าชัดเจน\n\n"
 host_dinner_events.3000.desc.type.intimidation:0 "และการยอมรับอย่างเย็นชาของข้า ขนาบข้างด้วยทหารยามติดอาวุธหนัก กำหนดบรรยากาศที่ต้องการ\n\n"
 host_dinner_events.3000.desc.mid.hates_vassal:0 "การยอมรับการต้อนรับจาก [visiting_liege.Custom2('InsultNoun', ROOT.Char)] [stop_host_scope.Custom2('InsultAdjective', ROOT.Char)] ผู้นี้ก็เพียงพอที่จะทำลายความอยากอาหารของข้าแล้ว; หวังว่าที่นั่นคงจะมี [ROOT.Char.Custom('FavoriteTreat')] บ้างนะ..."
 host_dinner_events.3000.desc.mid.lover:0 "การรักษาพิธีรีตอง เช่นนี้กับ [stop_host_scope.Custom('RomanticComplimentNoun')] ที่รักของข้าเป็นชะตากรรมที่โหดร้าย — บางทีข้าจะไปเยี่ยม [stop_host_scope.GetHerHim] หลังอาหารเย็น..."
 host_dinner_events.3000.desc.mid.friend:0 "นานเกินไปแล้วที่ข้าไม่ได้นั่งทานอาหารค่ำกับเพื่อนที่ดี เช่นนี้! ภาระของอาณาจักรถูกลืมไปในจิตวิญญาณนี้น้อยครั้งเกินไป!"
 host_dinner_events.3000.desc.mid.close_family:0 "เป็นการดีที่ได้เห็น [ROOT.Char.Custom2('RelationToMeShort', stop_host_scope)] ของข้า! เราสวมกอดกันอย่างเป็นทางการ เป็นการแสดงถึงสายสัมพันธ์ของครอบครัวต่อสาธารณะ"
 host_dinner_events.3000.desc.mid.house:0 "นี่เป็นโอกาสที่หาได้ยากที่จะเพลิดเพลินกับตัวเองในกลุ่มเพื่อนที่ดีของ [stop_host_scope.Custom('GetDaughterSon')] แห่งตระกูล [ROOT.Char.GetHouse.GetBaseName]"
 host_dinner_events.3000.desc.mid.powerful_vassal:0 "แน่นอน ข้าต้องยอมรับความโดดเด่นของ [stop_host_scope.GetHerHis] ในหมู่ข้าหลวงของ [ROOT.Char.GetPrimaryTitle.GetBaseNameNoTierNoTooltip] อย่างน้อยก็ในที่สาธารณะ..."
 host_dinner_events.3000.desc.mid.default:1 "ข้าหลวงของข้ารับข้าอย่างเชื่อฟังด้วยความเคารพที่จำเป็นทั้งหมด"
 host_dinner_events.3000.desc.mid:2 "\n\n[stop_host_scope.GetFirstNameNoTooltip] อธิบายงานเลี้ยงยามเย็นที่วางแผนไว้ โดยสัญญาว่าความบันเทิงและอาหารที่นำเสนอจะใกล้เคียงกับมาตรฐานของงานเลี้ยงอาหารค่ำในราชสำนักของข้าเอง"
 #host_dinner_events.3000.desc.outro:1 "\n\nOnly time will tell."
 #host_dinner_events.3000.desc.mid: "I am ushered inside and placed at the head of the table, which is already rich with foods glistening in the candlelight."
 host_dinner_events.3000.desc.outro:0 "\n\n[stop_host_scope.GetName] รับรองกับข้าว่านี่เป็นเพียงอาหารที่ดีที่สุดที่ [stop_host_scope.GetSheHe] มีให้"
 host_dinner_events.3000.a:0 "มาเริ่มกันเถอะ!"

 tour_general.9999.opening:0 "[host.Custom2('AppropriateGreeting', ROOT.Char)]"
 tour_general.9999.desc:0 "ราชสำนักของข้ากำลังออกเดินทางและข้าจะไปเยือน [ROOT.Char.GetCapitalLocation.GetNameNoTooltip] ในไม่ช้า"
 tour_general.9999.phase_tour_grounds:0 "เพื่อตรวจสอบ [ROOT.Char.Custom('FortifiedBuilding')] และที่ดินของท่าน"
 tour_general.9999.phase_dinner:0 "เพื่อรับงานเลี้ยงชั้นเลิศใน [ROOT.Char.Custom('FortifiedBuilding')] ของท่าน"
 tour_general.9999.phase_cultural_festival:0 "เพื่อเพลิดเพลินกับเทศกาล [ROOT.Char.GetCulture.GetNameNoTooltip] ท้องถิ่น"
 tour_general.9999.phase_fallback:1 "เพื่อดูการถือครองของท่านและรับฟังข่าวคราวการกระทำของท่าน"
 tour_general.9999.type_majesty:0 "\n\nถึงเวลาแล้วที่ [host.GetPrimaryTitle.GetBaseNameNoTierNoTooltip] จะได้เห็นความงดงามและความสง่างามของ [host.GetLadyLord] โดยชอบธรรมของพวกเขา"
 tour_general.9999.type_intimidation:0 "\n\nถึงเวลาแล้วที่ [host.GetPrimaryTitle.GetBaseNameNoTierNoTooltip] จะได้รับการเตือนว่าพวกเขา รับใช้ใคร และบทลงโทษสำหรับการทรยศ"
 tour_general.9999.type_taxation:0 "\n\nเจ้านายและสตรีแห่ง [host.GetPrimaryTitle.GetBaseNameNoTierNoTooltip] จะต้องส่งมอบสิบลดที่ติดค้างข้า"
 tour_general.9999.closing:0 "\n\nข้าคาดหวังการต้อนรับที่คู่ควรกับ [host.GetTitleAsNameNoTooltip|U]"
 tour_general.9999.a:0 "ข้าต้องดูแลการเตรียมการ!"
