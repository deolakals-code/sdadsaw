l_english: 
#Tour Travel Events
 tour_travel.1001.title:1 "ทาสติดที่ดินและ[angry_peasant.GetHerHis|U] [ROOT.Char.GetTitleAsNameNoTooltip|U]"
 tour_travel.1001.desc.intro:2 "ข้าเข้าไปในโรงเตี๊ยมท้องถิ่นแห่งหนึ่งใน [ROOT.Char.GetCurrentLocation.GetNameNoTooltip], ด้วยความเหนื่อยล้าจากการเดินทาง และกระหาย [ROOT.Char.Custom('RegionalDrink')] กับการพักผ่อน\n\nการใคร่ครวญอันเงียบสงบของข้าถูกรบกวนด้วยเสียงทุบกำปั้นลงบนเนื้อไม้ที่ปริแตก ตามด้วยเสียงถ่มน้ำลายอย่างเหยียดหยาม "ไอ้ [ROOT.Char.Custom2('InsultNoun', SCOPE.sC('angry_peasant'))] [ROOT.Char.Custom2('InsultAdjective', SCOPE.sC('angry_peasant'))] นั่น!""
 tour_travel.1001.desc.mid.wrong_language:1 "[ROOT.Char.GetSheHe|U] ไม่แม้ แต่จะตรัสภาษา[angry_peasant.GetCulture.GetLanguage.GetName] แต่[ROOT.Char.GetSheHe] กลับเรียก[ROOT.Char.GetHerselfHimself] ว่าเป็นเจ้าเหนือหัวโดยชอบธรรมของเรา!""
 tour_travel.1001.desc.mid.wrong_culture:0 "[ROOT.Char.GetSheHe|U] เป็นคนต่างชาติโดยสิ้นเชิง! เราจะถูกปกครองโดยคนที่ไม่ใช่ชาว[angry_peasant.GetCulture.GetName] ได้อย่างไร?""
 tour_travel.1001.desc.mid.wrong_faith:0 "[ROOT.Char.GetSheHe|U] มันเป็นพวกนอกรีต [ROOT.Char.Custom2('InsultAdjective', SCOPE.sC('angry_peasant'))]! ทุกวินาทีที่ [ROOT.Char.GetSheHe] ยังคงอยู่บนบัลลังก์ คือการลบหลู่พระประสงค์ของ [angry_peasant.GetFaith.HighGodNamePossessive]""
 tour_travel.1001.desc.mid.pretender:0 "ตระกูล[ROOT.Char.GetHouse.GetName] ข้าถุยน้ำลายใส่พวกมันทั้งหมด! ทุกคนรู้ดีว่าผู้ปกครองที่แท้จริงของ[ROOT.Char.GetPrimaryTitle.GetNameNoTierNoTooltip] คือตระกูล[claimant_character_scope.GetHouse.GetName]""
 tour_travel.1001.desc.mid.powerful_diarch:0 "[ROOT.Char.GetTitleAsNameNoTooltip|U] ที่เรียกกันว่าของเราน่ะอ่อนแอ! ผู้ปกครองที่แท้จริงของ [ROOT.Char.GetPrimaryTitle.GetNameNoTierNoTooltip] คือ [ROOT.Char.GetDiarch.Custom2('InsultNoun', SCOPE.sC('angry_peasant'))] [ROOT.Char.GetDiarch.Custom2('InsultAdjective', SCOPE.sC('angry_peasant'))] นั่น, [ROOT.Char.GetDiarch.GetFirstName]!""
 tour_travel.1001.desc.mid.just_plain_dislike_em:0 "พวกเราไม่ควรแม้ แต่จะเรียกไอ้ [ROOT.Char.Custom2('InsultNoun', SCOPE.sC('angry_peasant'))] นั่นว่าเป็น [ROOT.Char.GetTitleAsNameNoTooltip] ของเรา, เราควรจะเรียก [ROOT.Char.GetHerHim] ว่าไอ้โง่ [ROOT.Char.Custom2('InsultAdjective', SCOPE.sC('angry_peasant'))]!""
 tour_travel.1001.desc.outro.nudist:1 "\n\nข้าพยายามทำตัวไม่ให้เป็นที่สังเกต แต่ดูเหมือนว่าท่าทีแบบ[ROOT.Char.GetTitleAsNameNoTooltip|l] และความสมบูรณ์แบบอันเป็นเอกลักษณ์ของร่างกายตระกูล[ROOT.Char.GetHouse.GetName] ที่ได้รับการดูแลเป็นอย่างดีได้เปิดเผยตัวข้า ข้าต้องคิดหาทางก่อนที่สถานการณ์จะบานปลาย"
 tour_travel.1001.desc.outro:1 "\n\nข้าพยายามทำตัวไม่ให้เป็นที่สังเกต แต่ดูเหมือนว่าท่าทีแบบ[ROOT.Char.GetTitleAsNameNoTooltip|l] และตรา[ROOT.Char.GetHouse.GetName] บนอาภรณ์ของข้าได้เปิดเผยตัวข้า ข้าต้องคิดหาทางก่อนที่สถานการณ์จะบานปลาย"
 tour_travel.1001.a:0 "มาพูดต่อหน้าข้าสิ, เจ้า [angry_peasant.Custom2('InsultNoun', ROOT.Char)]!"
 tour_travel.1001.b:0 "บางทีการลดหย่อนภาษีอาจเปลี่ยนใจเจ้าได้"
 tour_travel.1001.c:0 "โอ้ ข้าแค่ดูคล้าย[ROOT.Char.GetNameNoTooltip]!"

 tour_travel.1002.title:1 "[ROOT.Char.GetCurrentLocation.Custom('get_region_flower_type')|U] ท่ามกลางวัชพืช"
 tour_travel.1002.desc:1 "ขณะที่เราขี่ม้าผ่าน[pretty_peasant_county_scope.GetName] ข้าพบว่าตนเองหลงใหลในทิวทัศน์อย่างแท้จริง [pretty_peasant_county_scope.GetProvince.Custom('TerrainTypeProvince')] แห่ง[ROOT.Char.GetCurrentLocation.GetNameNoTooltip] ต้องงดงามที่สุดใน[ROOT.Char.GetPrimaryTitle.GetNameNoTierNoTooltip] และงดงามยิ่งกว่าคือเหล่า[pretty_peasant.GetWomenMen] ที่เรียกที่นี่ว่าบ้าน\n\nขณะที่คณะผู้ติดตามของข้าพาข้าผ่านหมู่บ้านอันต่ำต้อยอีกแห่ง ข้าพบ[pretty_peasant.GetWomanMan] สาวงามเป็นพิเศษกำลังทำหน้าที่อันต่ำต้อยของ[pretty_peasant.GetHerHis] และข้ารู้สึกว่าหัวใจเต้นระรัว การเฝ้ามอง[pretty_peasant.Custom('LoverPetName')] ผู้นี้ในความธรรมดาสามัญของ[pretty_peasant.GetHerHis] เปรียบเสมือนการเห็นบทกวีมีชีวิต และก่อนที่ข้าจะทันได้คิด หัวใจของข้าก็ได้สั่งให้ข้าหยุดขบวนแล้ว"
 tour_travel.1002.a:0 "ข้าต้องบอกความรู้สึกของข้าให้รู้"
 tour_travel.1002.b:0 "โอ้ ข้านึกว่าเห็นอะไรบางอย่าง... เดินทางต่อ"

 tour_travel.1003.title:0 "การปราศรัยต่อ[ROOT.Char.GetTitleAsNameNoTooltip|U]"
 tour_travel.1003.desc:0 "ขณะที่การเดินทางของข้าดำเนินต่อไปทั่วแถบชนบทของ [angry_county_scope.GetName], ข้าได้รับแจ้งว่าข้าได้เตรียมการเพื่อพบกับตัวแทนของเหล่าไพร่ที่ไม่พอใจ\n\nสิ่งมีชีวิตอันน่าสมเพชหมอบคลานอยู่เบื้องหน้าข้า, โต้เถียงเกี่ยวกับศักดิ์ศรีที่กล่าวอ้างของสามัญชนชาว [angry_county_scope.GetAdjective] อย่างไรก็ตาม, ในไม่ช้าข้าก็สังเกตเห็นว่า ไอ้ [rude_peasant.Custom2('InsultNoun', ROOT.Char)] [rude_peasant.Custom2('InsultAdjective', ROOT.Char)] ผู้นี้ ไม่เคยแม้ แต่ครั้งเดียวที่จะเรียกขานข้าว่า '[ROOT.Char.Custom('FormOfAddressForLiege')|U]', ซึ่งเป็นความผิดที่อาจถูกลงโทษไม่ว่าทางใดก็ตามที่ข้าเห็นสมควร"
 tour_travel.1003.a:0 "จงเฆี่ยนตีสิ่งมีชีวิตนี้เป็นระยะทางห้าไมล์"
 tour_travel.1003.b:0 "เครื่องในของ[rude_peasant.GetHerHis|U] จะประดับ[angry_county_scope.GetProvince.Custom('TerrainTypeProvince')]"
 tour_travel.1003.c:0 "ให้อภัยความเขลาของ[rude_peasant.GetHerHis]"

 tour_travel.1004.title:1 "$altruism_intent_header$ สัมผัสแห่งการเยียวยา"
 tour_travel.1004.desc.intro:0 "ข้าเข้าสู่[diseased_county_scope.GetName] พร้อมที่จะประทานสัมผัสแห่งราชวงศ์แก่ชาวนาในท้องถิ่น ข้าเผชิญหน้ากับสิ่งมีชีวิตที่น่าสังเวชที่สุดเท่าที่ข้าเคยเห็นมาในทันที ด้วยการยั่วยุเพียงเล็กน้อย [diseased_peasant.GetSheHe] ก็เผยให้เห็นเท้าที่ด้านแข็งของ[diseased_peasant.GetHerHis] ห่างจากมืออันบริสุทธิ์ของข้าเพียงไม่กี่นิ้ว\n\n"
 tour_travel.1004.desc.outro.christian:1 "เฉก เช่นพระคริสต์ทรงล้างเท้าเหล่าสาวก ข้าก็ได้รับการวิงวอนจาก[ROOT.Char.GetFaith.HighGodName] ให้ล้างเท้าเหล่าอาณาประชาราษฎร์ผู้ภักดีของข้า เช่นกัน"
 tour_travel.1004.desc.outro:0 "แม้ว่าข้าจะไม่อยากอยู่ใกล้คนยากจนที่ป่วยและมีกลิ่นเหม็นผู้นี้ แต่ก็กล่าวกันว่าสัมผัสของข้าสามารถรักษาได้แม้กระทั่งโรคภัยไข้เจ็บที่น่ารังเกียจที่สุด"
 tour_travel.1004.a.tarantino:0 "ข้าเกลียดที่จะยอมรับ แต่นี่มันช่างเร้าอารมณ์เล็กน้อย"
 tour_travel.1004.a:0 "พรสำหรับเจ้า ความทรงจำอันเลวร้ายสำหรับข้า"
 tour_travel.1004.b:0 "โอ้ ข้าสามารถถูเท้าอันเป็นก้อนเนื้อเหล่านี้ได้ตลอดไป"
 tour_travel.1004.c:0 "บางทีการสัมผัสเบาๆ ที่หน้าผากก็คงจะพอ"
 tour_travel.1004.d.meat:0 "เอาไส้กรอกสกปรกพวกนั้นไปให้พ้นหน้าข้า!"
 tour_travel.1004.d.two_veg:0 "เอา[ROOT.Char.Custom('get_region_root_vegetable_plural')] สกปรกพวกนั้นไปให้พ้นหน้าข้า!"

 tour_travel.1005.title:1 "$altruism_intent_header$ สัมผัสแห่งราชวงศ์"
 tour_travel.1005.desc:0 "ข่าวการมาถึงของข้าดูเหมือนจะแพร่กระจายไปยัง[county_to_bless_scope.GetName] เนื่องจากในไม่ช้าขบวนของเราก็ถูกรุมล้อมด้วยทาสติดที่ดินนับไม่ถ้วนที่ขอพรด้วยสัมผัสแห่งราชวงศ์\n\nแน่นอนว่าข้าสามารถเพียงแค่ประพรมน้ำมนต์ที่ข้าเสกให้พวกเขาเล็กน้อย และพวกเขาก็คงจะพอใจ แต่การมอบเหรียญศักดิ์สิทธิ์ให้พวกเขาเพื่อบรรเทาบริเวณที่ติดเชื้อจะ ทำให้พวกเขามีความสุขและได้รับพรนานขึ้น"
 tour_travel.1005.a:0 "ข้าจะแจกจ่ายเหรียญศักดิ์สิทธิ์"
 tour_travel.1005.b:0 "การประพรมน้ำเล็กน้อยน่าจะ ทำให้พวกเขาพอใจ"
 tour_travel.1005.c:0 "พวกเขาไม่ได้อะไรเลย!"

 tour_travel.1006.title:1 "$altruism_intent_header$ ทานแก่คนยากจน"
 tour_travel.1006.desc:0 "ขณะที่เราขี่ม้าผ่าน[county_holder_to_bless_scope.GetFaith.HouseOfWorship] อันยิ่งใหญ่ที่[church_barony_scope.GetNameNoTooltip] ข้าสั่งให้ขบวนหยุดเพื่อชื่นชมสถานที่ศักดิ์สิทธิ์แห่งนี้ ซึ่งตอบสนองความต้องการทางจิตวิญญาณของผู้คนมากมายที่นี่ใน[county_to_bless_scope.GetNameNoTooltip]\n\nบันไดของ[county_holder_to_bless_scope.GetFaith.HouseOfWorship] แทบจะเกลื่อนไปด้วยคนต่ำต้อยและขัดสน นี่อาจเป็นโอกาสอันดีที่จะแสดงให้ผู้คนใน[county_to_bless_scope.GetNameNoTooltip] เห็นว่าข้าเป็นเจ้าเหนือหัวที่ใจกว้างและเมตตาเพียงใด"
 tour_travel.1006.a:0 "ทานแก่คนยากจน!"
 tour_travel.1006.b:0 "หากพวกเขาต้องการเงิน พวกเขาไม่ควรเกิดมายากจน"
 tour_travel.1006.c:0 "กำจัดพวกหนอนแมลงเหล่านี้ไปจากบันได!"

 tour_travel.1007.title:0 "[wise_woman_scope.GetWomanMan|U] ผู้ปราดเปรื่องแห่ง[wise_woman_barony_scope.GetNameNoTierNoTooltip]"
 tour_travel.1007.desc.intro:0 "ขณะที่ขบวนของข้าเดินทางต่อไปทั่วอาณาจักร เราได้เดินทางผ่านภูมิภาคอันห่างไกลและไม่น่าสงสัยของ[wise_woman_barony_scope.GetNameNoTier] ข้าคงไม่คิดอะไรเลย แต่[superstituous_courtier_scope.GetName] ดึงข้าไปข้างๆ เพื่อยกย่องคุณธรรมของสิ่งที่เรียกว่า "[wise_woman_scope.GetWomanMan|U] ผู้ปราดเปรื่องแห่ง[wise_woman_barony_scope.GetNameNoTierNoTooltip]" อย่างกระตือรือร้น\n\n"
 tour_travel.1007.desc.mid.ill:0 ""ขออภัย ฝ่าบาท[ROOT.Char.GetLadyLord] แต่ข้าเห็นว่าท่านกำลังทุกข์ทรมานอย่างมากจากโรคภัยไข้เจ็บ [wise_woman_scope.GetWomanMan|U] ผู้ปราดเปรื่องแห่ง[wise_woman_barony_scope.GetNameNoTierNoTooltip] อยู่ห่างออกไปเพียงเล็กน้อย และข้ารู้ว่า[wise_woman_scope.GetSheHe] มีสิ่งที่ท่านต้องการ เพื่อให้กลับมามีสุขภาพดีอีกครั้ง!""
 tour_travel.1007.desc.mid.pregnant:0 ""ฝ่าบาท[ROOT.Char.GetTitleAsNameNoTooltip|U] ข้าเห็นว่าท่านช่างเปล่งปลั่งและสดใส เช่นเคย ดั่ง เช่นผู้ที่กำลังตั้งครรภ์ควรจะเป็น อย่างไรก็ตาม ข้าบอกได้ว่าการอุ้มท้องอันหนักหน่วงกำลัง ทำให้ท่านไม่สบายอย่างยิ่ง และ[wise_woman_scope.GetWomanMan] ผู้ปราดเปรื่องที่อยู่ใกล้ๆ จะมียาที่จำเป็นเพื่อบรรเทาสิ่งที่รบกวนท่าน""
 tour_travel.1007.desc.mid.psychological:0 "ข้ารู้ว่าท่านมีจิตใจที่ทุกข์ทรมาน, [ROOT.Char.Custom('FormOfAddressForLiege')], และมัน ทำให้ท่านเจ็บปวดรวดร้าวอย่างยิ่ง แม้ว่าจิตวิญญาณของท่านจะเข้มแข็งเพียงใด, สิ่งที่รบกวนจิตใจของท่านอาจได้รับการเยียวยาด้วยเครื่องหอมหรือยาบางอย่างจาก [wise_woman_scope.GetWomanMan|U] ผู้มีปัญญา อันเลื่องชื่อแห่ง [wise_woman_barony_scope.GetNameNoTierNoTooltip]!""
 tour_travel.1007.desc.mid.weakened:0 "ด้วยอาการบาดเจ็บของท่าน, [ROOT.Char.Custom('FormOfAddressForLiege')], ข้าเกรงต่อความปลอดภัยและสุขภาพของท่านในการเดินทางครั้งนี้ อย่างไรก็ตาม, ข้ารู้จักแพทย์ผู้ชำนาญการในบริเวณใกล้เคียงที่อาจสามารถรักษาบาดแผลของท่านได้ [wise_woman_scope.GetWomanMan|U] ผู้มีปัญญา แห่ง [wise_woman_barony_scope.GetNameNoTierNoTooltip] สามารถรักษาสิ่งใดก็ได้!""
 tour_travel.1007.desc.mid.ugly:0 "หากข้าจะขออาจหาญกล่าว, [ROOT.Char.Custom('FormOfAddressForLiege')], สมาชิกคนอื่น ๆ ในขบวนของท่านได้กล่าววิจารณ์เกี่ยวกับ... รูปลักษณ์ของท่าน อย่างไรก็ตาม, อย่ากังวลไปเลย! มี [wise_woman_scope.GetWomanMan] ผู้มีปัญญา อยู่ใกล้ ๆ ผู้สามารถรักษาความเจ็บป่วยใด ๆ ก็ได้, พวกเขากล่าวกัน เช่นนั้น""
 tour_travel.1007.desc.outro:0 "\n\nข้ามีข้อสงสัย แต่[superstituous_courtier_scope.GetNameNoTooltip] ดูเหมือนจะเชื่อมั่นในคุณธรรมของหมอวิเศษผู้นี้อย่างยิ่ง จนข้ารู้สึกอยากไปเยี่ยมเยียน"
 tour_travel.1007.a:0 "การอ้อมเล็กน้อยคงไม่เป็นไร"
 tour_travel.1007.b:0 "ไร้สาระสิ้นดี!"
 go_see_wise_woman_tt:0 "ท่านไปพบ[wise_woman_scope.GetWomanMan] ผู้ปราดเปรื่อง ซึ่งอาจมีผลลัพธ์ทั้งในเชิงบวกและลบ"
 tour_travel.1008.title:0 "$tour_travel.1007.title$"
 tour_travel.1008.desc.intro:0 "เมื่อค่ำลง ข้าเข้าไปในกระท่อมที่มีแสงสลัวของ[wise_woman_scope.GetWomanMan] ผู้ปราดเปรื่อง ขบวนของข้ายังคงอยู่ข้างนอก ข้าไม่สงสัยเลยว่า[wise_woman_scope.GetWomanMan] ที่แปลกประหลาด ซึ่งเดินกะโผลกกะเผลกอยู่ข้างในคือคนที่ข้าตามหา\n\n"อา ข้ารอท่านอยู่ เข้ามาสิ! มาผิงไฟของข้า ฝ่าบาท[ROOT.Char.GetTitleAsNameNoTooltip|U]" ก่อนที่ข้าจะทันได้เอ่ยคำใด มืออันเย็นเฉียบของ[wise_woman_scope.GetHerHis] ก็โอบรอบมือของข้า"
 tour_travel.1008.desc.mid.ill:0 "ข้าใช้เวลาทั้งคืนดื่มของเหลวสีดำรสชาติแย่และสูดดมเครื่องหอมที่ ทำให้มึนเมา และเมื่อข้าออกมาในวันรุ่งขึ้น ข้ารู้สึกเหมือนเป็น[ROOT.Char.GetWomanMan] คนใหม่"
 tour_travel.1008.desc.mid.pregnant:0 "ข้าใช้เวลาทั้งคืนกินอาหารแปลกๆ ทุกชนิด: ลูกตา สมุนไพร และผลไม้ที่ข้าไม่เคยเห็นมาก่อน ทั้งหมดนี้ ในขณะที่[wise_woman_scope.GetWomanMan] แปลกประหลาดผู้นี้คอยดูแลทุกความต้องการของข้า ข้าออกมาในตอนเช้าและรู้สึกกระปรี้กระเปร่า!"
 tour_travel.1008.desc.mid.psychological:0 "มือของ[wise_woman_scope.GetHerHis|U] เคลื่อนไปจับกะโหลกศีรษะของข้าเหมือนสัตว์ร้ายจับเหยื่อ เราใช้เวลาทั้งคืนสวดคำที่ข้าไม่เข้าใจ และเมื่อข้าออกมาในวันรุ่งขึ้น ข้ารู้สึกว่าศีรษะของข้าเบาลง"
 tour_travel.1008.desc.mid.weakened:0 "[wise_woman_scope.GetSheHe|U] ทาบาดแผลของข้าด้วยของเหลวหนืดและสมุนไพรที่แสบทุกชนิด และ แม้ว่ากระบวนการจะเจ็บปวด ข้ารู้สึกว่าบาดแผลของข้าปิดสนิทมากขึ้นในวันรุ่งขึ้น"
 tour_travel.1008.desc.mid.ugly:0 "[wise_woman_scope.GetSheHe|U] ใช้เวลาทั้งคืนทาใบหน้าของข้าด้วยครีมและสีต่างๆ ปกปิดรอยตำหนิและจุดหยาบกร้านมากมาย ในตอนเช้า ข้าเห็นเงาสะท้อนของตัวเองและเห็น[ROOT.Char.GetWomanMan] คนใหม่ที่จะ ทำให้แม้ แต่ผู้ถือพรหมจรรย์หน้าแดงด้วยความปรารถนา!"
 tour_travel.1008.desc.outro:0 "\n\nข้อสงสัยทั้งหมดของข้าคลี่คลาย และอาการป่วยของข้าก็หายไป"
 tour_travel.1008.a:0 "เหมือนเวทมนตร์!"
 tour_travel.1008.b:0 "[wise_woman_scope.GetSheHe|U] ควรเป็นแพทย์ของข้า!"
 tour_travel.1009.title:0 "นักต้มตุ๋นแห่ง[wise_woman_barony_scope.GetNameNoTierNoTooltip]"
 tour_travel.1009.desc.intro:0 "$tour_travel.1008.desc.intro$"
 tour_travel.1009.desc.mid.ill:0 "ข้าใช้เวลาทั้งคืนสูดดมกลิ่นเหม็นที่ทนไม่ได้อย่างยิ่ง ดื่มของเหลวหนืดรสชาติแย่ และถูกทาตัวด้วยวัชพืชที่แสบ! ประสบการณ์ทั้งหมดเพิ่มความคลื่นไส้และความเจ็บปวดให้กับอาการป่วยที่มีอยู่ของข้า และข้าจบลงในคืนนั้นด้วยความรู้สึกแย่กว่าตอนเริ่มต้น"
 tour_travel.1009.desc.mid.ugly:0 "[wise_woman_scope.GetSheHe|U] ใช้เวลาทั้งคืนทาใบหน้าของข้าด้วยครีมและสีต่างๆ ปกปิดรอยตำหนิและจุดหยาบกร้านมากมาย ในตอนเช้า ข้าเห็นเงาสะท้อนของตัวเองและกรีดร้องด้วยความกลัวเมื่อเห็นสัตว์ประหลาดที่[wise_woman_scope.GetSheHe] เปลี่ยนข้าให้เป็น!"
 tour_travel.1009.desc.mid.nothing:0 "ข้าทำทุกอย่างที่หญิงนางนั้นขอ: ข้าดื่มชาสมุนไพร ให้ถูแขนขา ยืนเหนือเปลวไฟ และกินสมุนไพรมากพอที่จะล้มชายคนหนึ่งได้ อย่างไรก็ตาม ทั้งหมดนี้ดูเหมือนจะมีผลต่อข้าเพียงเล็กน้อย และข้ารู้สึกไม่ดีขึ้นกว่าตอนที่มาถึง"
 tour_travel.1009.desc.outro:0 "\n\nข้าไม่รู้ว่า[superstituous_courtier_scope.GetNameNoTooltip] ได้ยินอะไรเกี่ยวกับ[wise_woman_scope.GetWomanMan] "ผู้ปราดเปรื่อง" ผู้นี้ แต่เป็นที่ชัดเจนแล้วว่า[wise_woman_scope.GetSheHe] เป็นเพียงนักต้มตุ๋นข้างถนนธรรมดา"
 tour_travel.1009.a:0 "เสียเวลาจริงๆ"
 tour_travel.1009.b:0 "การหลอกลวง[ROOT.Char.GetTitleAsNameNoTooltip|U] เป็นอาชญากรรมที่สมควรตาย"
 tour_travel.9010.t:0 "ระวังโจรปล้นคนเดินทาง!"
 tour_travel.9010.desc:0 "ขบวนของข้าเดินทางต่อไปตามเส้นทางที่วางแผนไว้ไปยัง[next_destination.GetName] ทันใดนั้นเราก็หยุดกะทันหัน ตามคำสั่งของ[travel_leader.GetNamePossessive]!\n\n"หยุดนะ พวกเจ้าโง่! ว่ากันว่าถนนสายนี้เต็มไปด้วยโจรและคนพาล เราต้องเปลี่ยนเส้นทาง!"\n\nเส้นทางที่[travel_leader.GetSheHe] เสนอนั้นยาวกว่า แต่[travel_leader.GetSheHe] รับรองกับข้าว่าปลอดภัยกว่า"
 tour_travel.9010.a:0 "ไปเส้นทางที่ปลอดภัยกันเถอะ"
 tour_travel.9010.b:0 "เราต้องมอบความยุติธรรมให้กับคนเลวเหล่านี้!"
 tour_travel.9010.success:0 "โจรพ่ายแพ้"
 tour_travel.9010.failure:0 "โจร ทำให้ท่านแตกพ่าย"
 tour_travel.9020.t:0 "ความยุติธรรมท้องถิ่น"
 tour_travel.9020.desc.intro:0 "พวกเรามาถึงหมู่บ้านเล็ก ๆ แห่งหนึ่งใน [ROOT.Char.GetCurrentLocation.GetName] ก็พบกับความโกลาหลพอสมควรที่จัตุรัสกลางเมือง สิ่งมีชีวิตผู้อาภัพตนหนึ่งถูกรายล้อมไปด้วยชาวบ้านที่โกรธเกรี้ยว, แววตาอันมืดมนสิ้นหวังในดวงตาของ [accused_character.GetHerHis] จางหายไปและสว่างขึ้นเมื่อ [accused_character.GetSheHe] สังเกตเห็นขบวนของข้าเข้ามาใกล้\n\n"[ROOT.Char.Custom('FormOfAddressForLiege')], ได้โปรดเถิด! อย่าไปฟังพวกเขา, มันเป็นเรื่องโกหกทั้งเพ, ข้าบริสุทธิ์! ท่านจะไม่มอบความยุติธรรมของ [ROOT.Char.GetTitleAsNamePossessiveNoTooltip|U] ให้แก่ข้าหรือ?"\n\n"
 tour_travel.9020.desc.outro.guilty:0 "จริงอยู่ หลักฐานดูเหมือนจะเป็นไปตามสถานการณ์ แต่ชาวนาที่ต่ำต้อยไม่ควรพูดกับ[ROOT.Char.GetTitleAsNameNoTooltip|U] ของตนโดยไม่ได้รับอนุญาต"
 tour_travel.9020.desc.outro:0 "หลักฐานดูเหมือนจะค่อนข้างชัดเจน และ[accused_character.GetSheHe] ก็พูดนอกเรื่องด้วย"
 tour_travel.9020.a:0 "การประหารชีวิตนั้นยุติธรรม"
 tour_travel.9020.b:0 "หลักฐานนั้นไร้สาระ ปล่อย[accused_character.GetHerHim] ไป"
 tour_travel.9020.c:0 "การรับใช้ข้าจะเป็นการลงโทษของ[accused_character.GetHerHis]"
 tour_travel.9030.t:0 "ถ้ำแห่งบาป"
 tour_travel.9030.desc.intro:0 "ขณะที่ข้าถูกปลุกให้ตื่นจากการหลับใหลยามเที่ยงคืน ข้าได้ยินเสียงโห่ร้องแห่งความสนุกสนานและความรื่นเริงค่อยๆ เข้ามาใกล้ข้าจากด้านหลัง [drunky_entourage.GetName|U] ปรากฏตัว [drunky_entourage.GetHerHis]"
 tour_travel.9030.desc.mid.hashish:0 "ดวงตาแดงก่ำด้วยกัญชา"
 tour_travel.9030.desc.mid:0 "ลมหายใจเหม็นกลิ่น[ROOT.Char.Custom('RegionalAlcoholicDrink')]"
 tour_travel.9030.desc.outro:0 "\n\n"สาบานต่อ[drunky_entourage.GetFaith.HighGodName]! มีถ้ำแห่งบาปอันยอดเยี่ยมอยู่ห่างออกไปเพียงไม่กี่นาที ฝ่าบาท[ROOT.Char.GetTitleAsNameNoTooltip|U] เราต้องอยู่ที่นี่สักพักและ ทำให้ตัวเองโง่เขลาด้วยความรื่นเริง!""
 tour_travel.9030.a:0 "ความสนุกสนานและความรื่นเริง ข้ามาแล้ว!"
 tour_travel.9030.b:0 "เราต้องไม่วอกแวก"
 tour_travel.9040.t: "วีรบุรุษผู้ยิ่งใหญ่ที่สุด"
 tour_travel.9040.desc: "คณะของข้าหยุดพักครู่หนึ่ง และข้าเดินเข้าไปในสถานประกอบการอันต่ำต้อยเพื่อทำความคุ้นเคยกับคนในท้องถิ่นอย่างเหมาะสม โดยไม่เปิดเผยตัวตน ข้าฟังบทสนทนาอันดังของชนชั้นล่าง\n\n[peasant.GetWomanMan] คนหนึ่งกำลังสนุกสนานกับเพื่อนร่วมชาติของ[peasant.GetHerHis] แลกเปลี่ยนเรื่องราวของวีรบุรุษในตำนานที่พวกเขาชื่นชอบ "...แล้ว[ROOT.Char.GetPromotedLegend.GetProtagonist.GetName] คนนี้ล่ะ? ข้าไม่แน่ใจว่า[ROOT.Char.GetPromotedLegend.GetProtagonist.GetSheHe] เคยมีตัวตนอยู่จริงหรือไม่ นับประสาอะไรกับเรื่องไร้สาระ '[ROOT.Char.GetPromotedLegend.GetName]' ที่เหลือ!""
 tour_travel.9040.a: "ข้าต้องปกป้องตำนานของข้า!"
 tour_travel.9040.a.success: "ชาวนาขับขานสรรเสริญเรื่องราวของท่าน"
 tour_travel.9040.a.failure: "ท่านถูกเยาะเย้ย"
 tour_travel.9040.b: "เห็นได้ชัดว่าเรื่องราวมันเกินความเข้าใจของ[peasant.GetHerHis]"

#Tour Arriving at a Stop
#Vassal: Liege arrival event
 tour_general.0001.title:1 "[visiting_liege.GetTitledFirstNameNoTooltip] เสด็จมาถึง!"
 tour_general.0001.desc.intro:1 "ในที่สุด ขบวนเสด็จของ[visiting_liege.GetTitledFirstNamePossessive] ก็มาถึงประตูเมืองของข้า เยี่ยมเยือน[ROOT.Char.GetCapitalLocation.GetName] ในการเสด็จประพาส[visiting_liege.GetPrimaryTitle.GetBaseNameNoTierNoTooltip] ของ[visiting_liege.GetHerHis]"
 tour_general.0001.desc.type.majesty:0 "อาภรณ์อันงดงามและการนำเสนออันสูงส่งของคณะบ่งบอกถึงความทะเยอทะยานที่จะ ทำให้ข้าประทับใจ\n\n"
 tour_general.0001.desc.type.intimidation:0 "แถวทหารองครักษ์ที่เคร่งขรึมและมีระเบียบวินัย ทำให้เห็นได้ชัดว่าความกลัวคือระเบียบของวันนี้\n\n"
 tour_general.0001.desc.type.taxation:0 "เกวียนหีบสมบัติและรายชื่อเจ้าหน้าที่เก็บภาษีบ่งบอกว่าข้าจะยากจนลงจากการมาเยือนครั้งนี้\n\n"
 tour_general.0001.desc.mid.hates_liege:1 "มันถึงเวลาแล้วที่ไอ้ [visiting_liege.Custom2('InsultNoun', ROOT.Char)] [visiting_liege.Custom2('InsultAdjective', ROOT.Char)] นั่นจะลงมาจากห้องโถงอันอึมครึมของ [visiting_liege.GetHerHis] และมาเห็นบ้านเมืองที่แท้จริงเสียที"
 tour_general.0001.desc.mid.lover:0 "นานเกินไปแล้วที่ข้าไม่ได้สัมผัสอ้อมกอดของ[visiting_liege.GetHerHis] — บางทีอาจจะมีเวลาได้สานสัมพันธ์กัน..."
 tour_general.0001.desc.mid.friend:0 "แม้ว่าเราจะพบกันด้วยภาระทางพิธีการ แต่การมาเยือนของเพื่อนที่ดี เช่นนี้เป็นที่ต้อนรับอย่างยิ่ง"
 tour_general.0001.desc.mid.close_family:0 "โอกาสที่หาได้ยาก แต่เป็นที่ต้อนรับในการพบ[ROOT.Char.Custom2('RelationToMeShort', visiting_liege)] ของข้า; เป็นการดีที่[visiting_liege.GetHerHim] เสด็จมา"
 tour_general.0001.desc.mid.house:0 "[ROOT.Char.Custom2('RelationToMeShort', visiting_liege)] ของข้ามาเพื่อกระชับทั้งสายสัมพันธ์แห่งความเป็นข้าหลวงและสายสัมพันธ์แห่งตระกูล[ROOT.Char.GetHouse.GetBaseName]"
 tour_general.0001.desc.mid.powerful_vassal:0 "ในฐานะหนึ่งในข้าหลวงที่ทรงอำนาจที่สุดของอาณาจักร จึงไม่น่าแปลกใจที่[visiting_liege.GetSheHe] เสด็จมาเยือนถึงประตูบ้านข้า"
 tour_general.0001.desc.mid.default:1 "การต้อนรับ[visiting_liege.GetLadyLord] แห่งอาณาจักรในโถงของข้าเองถือเป็นเกียรติอย่างยิ่ง"
 tour_general.0001.desc.phase.tour_grounds:0 "\n\nข้าจะต้องนำ[visiting_liege.GetTitleAsNameNoTooltip] ชม[ROOT.Char.Custom('FortifiedBuilding')] และดินแดน[ROOT.Char.GetPrimaryTitle.GetAdjectiveNoTooltip] ของข้า,"
 tour_general.0001.desc.phase.dinner:0 "\n\nข้าจะต้องจัดงานเลี้ยงอาหารค่ำอันหรูหราสมกับ[visiting_liege.GetTitleAsNameNoTooltip] — โอกาสที่จะแสดงการต้อนรับแบบ[ROOT.Char.GetPrimaryTitle.GetAdjectiveNoTooltip] —"
 tour_general.0001.desc.phase.cultural_festival:0 "\n\nข้าจะต้องแสดงให้[visiting_liege.GetTitleAsNameNoTooltip] เห็นเทศกาลที่จัดแสดงความบันเทิงและการแสดงที่ดีที่สุดของชาว[ROOT.Char.GetCulture.GetCollectiveNounNoTooltip],"
 tour_general.0001.desc.outro:1 "และจัดหาเตียงนอนและความบันเทิงให้แก่คณะของ[visiting_liege.GetHerHis]\n\nคำถามเดียวคือ ข้าจะเปิดประตูและให้[visiting_liege.GetHerHim] เข้ามาหรือไม่?"
 tour_general.0001.a:1 "ยินดีต้อนรับ ฝ่าบาท[visiting_liege.GetTitleAsNameNoTooltip]! ยินดีต้อนรับ!"
 tour_general.0001.b:1 "แสร้งทำเป็นว่าไม่มีใครอยู่บ้าน..."

#Liege: Phase invalidation
 tour_general.0500.title:0 "ไม่มีใครอยู่บ้าน"
 tour_general.0500.desc.intro:0 "ข่าวมาถึงข้าว่าแผนการของข้าถูกขัดจังหวะและเป็นไปไม่ได้อีกต่อไปที่ข้าจะเสด็จเยือน[tour_location.GetName] อย่างเป็นทางการ\n\n"
 tour_general.0500.desc.self:0 "ข้าได้กลายเป็น[ROOT.Char.GetLadyLord] คนใหม่ของ[tour_location.GetName] ทำให้ไม่มีใครนอกจากตัวข้าเองที่จะเป็นเจ้าภาพในการพำนักของข้า"
 tour_general.0500.desc.already_visited:0 "ข้าได้ไปเยือน[stop_host_scope.GetName] แล้วก่อนหน้านี้ใน Grand Tour ของข้า และข้าไม่สามารถแสดงการลำเอียงต่อ[stop_host_scope.GetHerHim] ได้ [stop_host_scope.GetSheHe|U] จะได้รับการเยี่ยมเยือนเพียงครั้งเดียวเท่านั้น ไม่มีอีกแล้ว"
 tour_general.0500.desc.no_longer_liege:0 "[stop_host_scope.GetTitleAsNameNoTooltip|U] แห่ง[tour_location.GetNameNoTooltip] ไม่ได้ขึ้นตรงต่อข้าอีกต่อไป"
 tour_general.0500.desc.lowly_baron:0 "[tour_location.GetNameNoTooltip|U] ขณะนี้อยู่ภายใต้[stop_host_scope.GetTitleAsNameNoTooltip|U] ที่ต่ำต้อย และเป็นการต่ำศักดิ์เกินไปที่ข้าจะไปเยือน[stop_host_scope.GetWomenMen] ที่มีสถานะต่ำ เช่นนี้"
 tour_general.0500.desc.leading_army:0 "[stop_host_scope.GetName|U] ได้ออกสู่สนามรบ และไม่สามารถเป็นเจ้าภาพให้ข้าได้อีกต่อไป"
 tour_general.0500.desc.gone_travelling:0 "[stop_host_scope.GetName|U] ได้ละทิ้งบ้านของ[stop_host_scope.GetHerHis] และเดินทางไปยังดินแดนที่ไม่รู้จัก"
 tour_general.0500.desc.imprisoned_by_me:0 "[stop_host_scope.GetName|U] ถูกจับกุมและตอนนี้เน่าเปื่อยอยู่ในคุกใต้ดินของข้า"
 tour_general.0500.desc.imprisoned:0 "[stop_host_scope.GetName|U] ไม่ใช่[stop_host_scope.GetWomanMan] อิสระอีกต่อไป เนื่องจาก[stop_host_scope.GetSheHe] เน่าเปื่อยอยู่ในคุกใต้ดินต่างแดน"
 tour_general.0500.desc.deadly_illness:0 "[stop_host_scope.GetName|U] ได้ป่วยเป็นโรคร้ายแรง และข้าไม่สามารถเสี่ยงไปเยี่ยมและสูดดมไอพิษของ[stop_host_scope.GetHerHis] ได้"
 tour_general.0500.desc.incapable:0 "[stop_host_scope.GetName|U] ไม่สามารถควบคุมสติสัมปชัญญะทั้งหมดของ[stop_host_scope.GetHerHis] ได้อีกต่อไป และจะเป็นเจ้าภาพที่ไม่ดี"
 tour_general.0500.desc.gone_adventuring:0 "[stop_host_scope.GetName|U] ได้ออกผจญภัยไปยังดินแดนที่ข้าไม่เต็มใจจะไปถึง"
 tour_general.0500.desc.at_war:0 "เงาแห่งสงครามได้ทอดทับ[tour_location.GetNameNoTooltip] และ[stop_host_scope.GetName] ได้เตือนข้าไม่ให้ไปที่นั่น"
 tour_general.0500.desc.outro:0 "\n\nแม้ว่านี่จะไม่ใช่จุดสิ้นสุดของการเดินทางของข้า แต่มันก็น่าผิดหวังอย่างยิ่ง"
 current_phase_skipped_tt:0 "ช่วงต่อไปของท่านถูกข้ามไป"
 tour_general.0500.a:0 "ข้าตั้งตารอคอยสิ่งนั้น..."

#Liege: Rejected at the gates
 tour_general.0501.title:0 "ถูกปฏิเสธ"
 tour_general.0501.desc:1 "ขณะที่ขบวนผู้ติดตามของข้าหยุดลงที่ประตูเมือง [stop_host_scope.GetCapitalLocation.GetTitle.GetBaseNameNoTier], ได้มีการขานเรียกให้ [stop_host_scope.GetName] ออกมารับข้า, แต่หลังจากผ่านไประยะหนึ่ง ซึ่งนานเกินพอ, ก็ไม่มีแม้ แต่คนรับใช้ชั้นต่ำปรากฏตัวออกมาต้อนรับข้า มีการขานเรียกอีกหลายต่อหลายครั้ง, แต่พวกเราก็ไม่ได้รับคำตอบใด นอกจากเสียงร้องของนกป่าและเสียงหวีดหวิวของสายลมอันอ่อนโยน\n\nเป็นที่ประจักษ์ชัดแล้วว่าข้าถูกปฏิเสธที่หน้าประตู, และ [stop_host_scope.GetTitleAsNameNoTooltip] ผู้ [stop_host_scope.Custom2('InsultAdjective', ROOT.Char)] ก็ได้กระทำการลบหลู่ราชบัลลังก์!"
 tour_general.0501.a:0 "ไปกันต่อเถอะ"
 tour_general.0501.b:0 "การดูหมิ่นครั้งนี้จะไม่มีวันลืมเลือนในเร็ววัน"
 tour_general.0501.c:0 "พังประตูบ้านี่ซะ!"
 tour_general.0501.liege_merciful:0 "[visiting_liege.GetFirstName] ให้อภัยท่าน"
 tour_general.0501.liege_angry:0 "[visiting_liege.GetFirstName] ถูกดูหมิ่น"
 tour_general.0501.raid:0 "[visiting_liege.GetFirstName] ปล้นสะดมที่ดินของท่าน"

 #Tour Remaining at a Stop
 #Vassal Events
 tour_general.1001.title:0 "$activity_tour$: คำขออันสุภาพ"
 tour_general.1001.title_theft:0 "[ROOT.Char.GetCurrentLocation.GetNameNoTooltip]: การอ้างสิทธิ์อันสุภาพ"
 tour_general.1001.intro:0 "ข้าได้รับทราบว่า [visiting_liege.GetTitledFirstName] ได้จับตา [visiting_liege.GetHerHis] มองไปที่ [tour_general_3001_target_courtier.GetTitledFirstName] ซึ่งเป็นที่รู้จักในประเทศสำหรับ [tour_general_3001_target_courtier.GetHerHis] [tour_general_3001_target_courtier.Custom('GetCourtierTrait')]"
 tour_general.1001.desc:0 "\n\nกล่าวโดยย่อคือ [visiting_liege.GetTitleAsNameNoTooltip] ประสงค์จะย้าย[tour_general_3001_target_courtier.GetHerHim] ไปยังราชสำนักของ[visiting_liege.GetTitleAsNamePossessiveNoTooltip]"
 tour_general.1001.desc_theft_liege:0 "\n\nโดยไม่คำนึงถึงความกังวลของข้า ดูเหมือนว่า[visiting_liege.GetTitleAsNameNoTooltip] ได้พยายามบังคับย้าย[tour_general_3001_target_courtier.GetTitledFirstNameNoTooltip] ไปยังราชสำนักของ[visiting_liege.GetTitleAsNamePossessiveNoTooltip] ในตอนกลางคืน"

 tour_general.1001.outro:0 "\n\nนี่เป็นโอกาสที่จะแสดงความเมตตาของข้าต่อ[visiting_liege.GetHerHim] อย่างแน่นอน!"
 tour_general.1001.outro_unusual_courtier:0 "\n\nแม้ว่าข้าจะไม่เข้าใจเหตุผลของ[ROOT.Char.Custom2('RelationToMePossessive', visiting_liege )] ของข้าเป็นพิเศษ แต่ข้าก็ไม่กังวลกับการสูญเสีย[tour_general_3001_target_courtier.GetHerHim] มากนัก"
 tour_general.1001.outro_unusual_host_unusual_courtier:0 "\n\nข้านึกถึงเหตุผล #EMP สองสามข้อ#! ว่าทำไมข้าถึงอยากเก็บ[tour_general_3001_target_courtier.GetTitledFirstNameNoTooltip] ไว้ อย่างไรก็ตาม..."
 tour_general.1001.outro_theft_liege:0 "\n\nไม่ต้องสงสัยเลยว่าสิ่งนี้ ทำให้ข้ารำคาญใจในหลายๆ ด้าน"
 tour_general.1001.outro_theft_liege_unusual_courtier:0 "\n\nยอมรับว่า ข้าไม่เห็นเหตุผลว่าทำไม[visiting_liege.GetTitledFirstName] ถึงต้องการ[tour_general_3001_target_courtier.GetTitledFirstNameNoTooltip] แต่[tour_general_3001_target_courtier.GetSheHe] คือ[ROOT.Char.Custom2('RelationToMeShort', tour_general_3001_target_courtier )] #EMP ของข้า#! ให้ตายสิ"
 tour_general.1001.a:0 "ข้าหวังว่า[tour_general_3001_target_courtier.GetFirstNameNoTooltip] จะรับใช้[visiting_liege.GetHerHim] เป็นอย่างดี"
 tour_general.1001.a_theft_liege:0 "[tour_general_3001_target_courtier.GetFirstNameNoTooltip] ไม่เคยมีประโยชน์กับข้าอยู่แล้ว"
 tour_general.1001.b:0 "แลกเปลี่ยนกัน [visiting_liege.GetTitledFirstNameNoTooltip]"
 tour_general.1001.b.tt:0 "ท่านขอความช่วยเหลือเป็นการแลกเปลี่ยนกับการที่[tour_general_3001_target_courtier.GetFirstName] เข้าร่วมราชสำนักของ[visiting_liege.GetTitledFirstNamePossessive]"
 tour_general.1001.c:0 "ข้ามั่นใจว่า[visiting_liege.GetTitleAsNameNoTooltip] สามารถ ทำให้มันคุ้มค่ากับเวลาของข้าได้..."
 tour_general.1001.c.tt:0 "ท่านขอทองคำเป็นการแลกเปลี่ยนกับการที่[tour_general_3001_target_courtier.GetFirstName] เข้าร่วมราชสำนักของ[visiting_liege.GetTitledFirstNamePossessive]"
 tour_general.1001.d:0 "มีเหตุผล #EMP เพียงอย่างเดียว#! ที่[visiting_liege.GetSheHe] ต้องการ[tour_general_3001_target_courtier.GetFirstNameNoTooltip]..."
 tour_general.1001.d.flavor:0 "มาตามใจกันเถอะ"
 tour_general.1001.d.tt:0 "ท่านเสนอที่จะร่วมรับประทานอาหาร #EMP แปลกใหม่#! กับ[visiting_liege.GetShortUIName]"
 tour_general.1001.d.tt_extra:0 "[visiting_liege.GetShortUIName] จะยอมรับคำเชิญหรือประณามการกินเนื้อคนของท่าน"
 tour_general.1001.e:0 "#EMP เจ้าตายเดี๋ยวนี้!#!"
 tour_general.1001.e.flavor:0 "สาบานต่อ[ROOT.Char.GetFaith.DevilName]!"
 tour_general.1001.e.tt:0 "ท่านพุ่งเข้าใส่[visiting_liege.GetShortUIName]"
 tour_general.1001.e.success:0 "การโจมตีของท่านสำเร็จ"
 tour_general.1001.e.success.tt:0 "ท่านรอดชีวิต"
 tour_general.1001.e.success.desc:0 "ท่านรอดชีวิตจากการต่อสู้"
 tour_general.1001.e.bodyguard.desc:0 "องครักษ์ของท่านเข้ามาช่วยท่าน"
 tour_general.1001.e.slain.tt:0 "ท่านถูกสังหาร"
 tour_general.1001.e.slain.desc:0 "ท่านแพ้การต่อสู้"
 tour_general.1001.e.failure:0 "ท่านโจมตีล้มเหลว"
 tour_general.1001.e.bodyguard:0 "[tour_general_1001_bodyguard.GetTitledFirstNameNoTooltip] ก้าวเข้ามา"
 tour_general.1001.f:0 "นี่ดูเหมือนเป็นความคิดที่ไม่ดี"
 tour_general.1001.f_theft_liege:0 "ข้า #EMP แทบจะ#! ไม่สามารถยอมรับคำขอนี้ได้ในตอนนี้"
 tour_general.1001.f.tt:0 "ท่านไม่ต้องการสละข้าราชสำนักของท่าน"

 #Vassal/Liege Event
 tour_general.1002.title:0 "[ROOT.Char.GetCurrentLocation.GetNameNoTooltip]: อาหารอันน่าสยดสยองและรุ่งโรจน์"
 tour_general.1002.title_vassal:0 "$activity_tour$: อาหารอันน่าสยดสยองและรุ่งโรจน์"
 tour_general.1002.desc_host:0 "ข้าพิจารณาการจัดจานบนโต๊ะอีกครั้ง พ่อครัวของข้าทำงานอย่างหนักเพื่อเตรียมทุกชิ้นส่วนของ[tour_general_3001_target_courtier.GetFirstName] เพื่อความสุขของเรา การตก แต่งนั้นยอดเยี่ยม \n\nข้าหันกลับไปเมื่อ[visiting_liege.GetTitledFirstName] เข้ามาในห้องเพียงลำพังตามที่เราตกลงกันไว้ ข้าสังเกตขณะที่[visiting_liege.GetSheHe] รับรู้ทุกอย่างและรอยยิ้มจางๆ ปรากฏขึ้นที่มุมปากของ[visiting_liege.GetHerHis] [visiting_liege.GetSheHe|U] เคลื่อนไปข้างหน้าและนั่งลงที่โต๊ะ ข้าเข้าร่วมกับ[visiting_liege.GetHerHim]"
 tour_general.1002.desc_liege:0 "ขณะที่ข้าเข้ามาในห้อง ไม่ต้องสงสัยเลยว่า[tour_general_3001_target_courtier.GetFirstName] คือดาวเด่นของงาน\n\n[stop_host_scope.GetTitledFirstName] ไม่ได้ประหยัดค่าใช้จ่ายใดๆ และโต๊ะก็เต็มไปด้วยอาหารเลิศรส ทั้งหมดเป็นไปตามปรัชญาที่ไม่ทิ้งขว้าง ไม่ต้องการ และใช้ประโยชน์จากทุกชิ้นส่วนอาหารอร่อยที่[tour_general_3001_target_courtier.GetFirstNameNoTooltip] สามารถนำมาปรุงได้ \n\nแม้ แต่ศีรษะของ[tour_general_3001_target_courtier.GetFirstNamePossessiveNoTooltip] แม้จะถูกคว้านและระบายออกแล้ว ก็ถูกวางไว้อย่างระมัดระวังที่ปลายโต๊ะและตก แต่งด้วยพืชพรรณท้องถิ่น ข้าหยุดครู่หนึ่งเพื่อซึมซับทุกอย่าง"
 tour_general.1002.a:0 "นี่มัน #EMP สุดยอด#!!"
 tour_general.1002.b:0 "... บางทีอาจจะแค่คำเล็กๆ"
 tour_general.1002.c:0 "แด่ผู้มีพระคุณของเรา [tour_general_3001_target_courtier.GetFirstNameNoTooltip]!"
 tour_general.1002.a.flavor:0 "ท่านลงมือกิน"

 #Liege Events
 tour_general.3001.title:0 "[ROOT.Char.GetCurrentLocation.GetNameNoTooltip]: ในสายตาของผู้มอง"
 tour_general.3001.desc_gluttonous_cannibal:0 "ในฐานะที่ข้าเป็นผู้จัดหา #EMP เนื้อชั้นดี#! [tour_general_3001_target_courtier.GetFirstName] โดดเด่นอย่างแท้จริงจากฝูงชน มวลกายอันน่าประทับใจของ[tour_general_3001_target_courtier.GetHerHis|U] ทำให้ข้าเข่าอ่อน มือของข้าสั่นขณะที่ข้าเฝ้าดู[tour_general_3001_target_courtier.GetHerHim] กินอาหารอย่างตะกละตะกลาม ไข่มุกแห่งไขมันส่องประกายบนแก้มอวบอิ่มของ[tour_general_3001_target_courtier.GetHerHis] \n\n#EMP ช่างอวบอิ่ม#! ข้าขบกรามแน่น นี่คือสิ่งที่ถูกกำหนดไว้แล้ว"
 tour_general.3001.desc_gluttonous:0 "[tour_general_3001_target_courtier.GetFirstName] ดูเหมือน[tour_general_3001_target_courtier.GetWomanMan] ที่รู้ว่าอะไรดีในชีวิตจริงๆ มีความอิจฉาเล็กน้อยในอกของข้า เมื่อมองดูความแข็งแรงของ[tour_general_3001_target_courtier.GetHerHis] และความสุขอย่างแท้จริงที่[tour_general_3001_target_courtier.GetSheHe] ดูเหมือนจะพบในอาหาร\n\n[stop_host_scope.GetTitledFirstName] [stop_host_scope.GetHerselfHimself] พูดไม่หยุดเกี่ยวกับคุณภาพการทำอาหารของ[tour_general_3001_target_courtier.GetFirstNamePossessiveNoTooltip]"
 tour_general.3001.desc_insanity_courtier:0 "มีบางอย่างที่น่าสนใจเกี่ยวกับ[tour_general_3001_target_courtier.GetFirstName] ข้าไม่สามารถระบุได้แน่ชัด แต่[tour_general_3001_target_courtier.GetSheHe] มีบรรยากาศของความลึกลับและความตรงไปตรงมา ซึ่งหาได้ยากในทุกวันนี้ \n\nรู้สึกราวกับว่า[tour_general_3001_target_courtier.GetSheHe] กำลังจ้องมองเข้าไปในที่ที่วิญญาณของข้าควรจะอยู่ หาก[ROOT.Char.GetFaith.DevilName] ไม่ได้ไปถึงที่นั่นก่อน \n\n[tour_general_3001_target_courtier.GetSheHe|U] เข้าใจ"
 tour_general.3001.desc_beauty:0 "ทันทีที่ข้าเห็น[tour_general_3001_target_courtier.GetFirstName] ข้าก็กลั้นหายใจ ราวกับว่า[ROOT.Char.GetFaith.HighGodName] [ROOT.Char.GetFaith.HighGodHerselfHimself] ได้ประทานพรให้[tour_general_3001_target_courtier.GetFirstNameNoTooltip] ด้วยความงามของ[ROOT.Char.Custom('get_region_flower_type_plural')] นับพัน และเวลาหยุดนิ่งขณะที่ข้าซึมซับลักษณะอันละเอียดอ่อนของ[tour_general_3001_target_courtier.GetHerHis] \n\nความงาม เช่นนี้สูญเปล่าไปกับฝูงชนชาวนานี้"
 tour_general.3001.desc_intellect:0 "[tour_general_3001_target_courtier.GetFirstName] ทำให้ข้าประหลาดใจอย่างต่อเนื่องด้วยสติปัญญาของ[tour_general_3001_target_courtier.GetHerHis] นักคิดที่แท้จริงในยุคของเรา มีศักยภาพมากมายในทักษะและลักษณะนิสัยของ[tour_general_3001_target_courtier.GetHerHis] ข้าสามารถใช้ประโยชน์จากทั้งสองอย่างได้อย่างแน่นอน แทนที่จะเฝ้าดูพวกมันเหี่ยวเฉาไปที่นี่ เหมือนต้นไม้ที่ขาดแสงแดด"
 tour_general.3001.desc_physique:0 "ขณะที่[tour_general_3001_target_courtier.GetFirstName] ก้มลงหยิบของเล็กๆ น้อยๆ จากพื้นโถงทางเดิน ข้าก็เอนตัวไปข้างหน้าเพื่อมองดูกล้ามเนื้อที่เด่นชัด ซึ่งเล่นอยู่ใต้ผิวหนัง ท่านไม่สามารถซื้อร่างกายแบบนั้นได้ แต่บางทีถ้าข้าล้อมรอบตัวเองด้วยบุคคลที่แข็งแรงเหล่านี้มากขึ้น...\n\n"
 tour_general.3001.desc_martial:0 "ความสามารถทางการทหารของ[tour_general_3001_target_courtier.GetFirstName] เป็นที่รู้จักกันดีในราชสำนักของ[stop_host_scope.GetTitledFirstNamePossessive] หากท่านต้องการหารือเกี่ยวกับแผนการโจมตี วิธีที่ดีที่สุดในการลับอาวุธและสติปัญญาของท่าน ท่านต้องไปหา[tour_general_3001_target_courtier.GetHerHim] มันเป็นทักษะที่เป็นที่ต้องการอย่างสูงและเป็นสิ่งที่ ทำให้ข้าสนใจ\n\n"
 tour_general.3001.desc_diplomacy:0 "ทักษะทางการทูตของ[tour_general_3001_target_courtier.GetFirstName] ไม่เคยหยุด ทำให้ข้าประหลาดใจ [tour_general_3001_target_courtier.GetSheHe|U] สามารถแจ้ง[ROOT.Char.GetFaith.ReligiousHeadName] ว่ากางเกงในของ[ROOT.Char.GetFaith.GetReligiousHead.GetHerHis] โผล่ออกมา ในขณะที่ยังคงได้รับรางวัลเป็นทองคำสองสามชิ้น รอยยิ้ม และคำว่า 'ขอบคุณ'"
 tour_general.3001.desc_stewardship:0 "[tour_general_3001_target_courtier.GetFirstName] เป็นแหล่งความรู้ที่ไม่สิ้นสุดเกี่ยวกับ... ความมั่งคั่ง [tour_general_3001_target_courtier.GetSheHe|U] มีแนวคิดเกี่ยวกับการดูแลทรัพย์สินที่[tour_general_3001_target_courtier.GetSheHe] คร่ำครวญว่าไม่สามารถนำไปใช้ในราชสำนักของ[stop_host_scope.GetTitledFirstNamePossessive] ได้ \n\nคงน่าเสียดายที่เห็นพรสวรรค์ เช่นนี้สูญเปล่าไป"
 tour_general.3001.desc_intrigue:0 "ข้าแทบไม่สังเกตเห็น[tour_general_3001_target_courtier.GetFirstName] จนกระทั่ง[tour_general_3001_target_courtier.GetSheHe] อยู่ตรงหน้าข้า แสดงความเคารพต่อ[tour_general_3001_target_courtier.Char.Custom2('RelationToMePossessive', stop_host_scope )] [stop_host_scope.Char.Custom2('RelationToMeShort', visiting_liege )] ของ[tour_general_3001_target_courtier.GetHerHis] ตอนนี้ข้าสังเกตเห็นแล้ว ข้าสังเกต[tour_general_3001_target_courtier.GetHerHim] ขณะที่[tour_general_3001_target_courtier.GetSheHe] เคลื่อนไหวอย่างง่ายดายระหว่างกลุ่มคนที่ราชสำนัก ดวงตาของ[tour_general_3001_target_courtier.GetHerHis|U] ตื่นตัวอยู่ตลอดเวลา มองไปทุกทิศทางและไม่มีทิศทาง \n\nสิ่งนี้ ทำให้ข้าสนใจ"
 tour_general.3001.desc_learning:0 "[tour_general_3001_target_courtier.GetWomanMan] ผู้คงแก่เรียน ดวงตาที่สดใสของ[tour_general_3001_target_courtier.GetFirstNamePossessive] กวาดไปทั่วห้องเพื่อมองหาคู่ต่อสู้กับคำแถลงทางวิทยาศาสตร์ที่[tour_general_3001_target_courtier.GetSheHe] เพิ่งกล่าวออกมา แต่ไม่มีใครลุกขึ้นมารับคำท้า ซึ่ง ทำให้[tour_general_3001_target_courtier.GetHerHis] ผิดหวังอย่างมาก \n\nไม่น่าแปลกใจ เมื่อพิจารณาถึงระดับสติปัญญาที่การสนทนาจะต้องดำเนินไป ข้าประทับใจ \n\nปัญญา เช่นนี้หาได้ยาก"
 tour_general.3001.desc_prowess:0 "คล่องแคล่วและเคลื่อนไหวไปทั่วห้องเหมือน[ROOT.Char.Custom('GetAnimalType')] กำลังล่าเหยื่อ [tour_general_3001_target_courtier.GetFirstName] ไม่เคย ทำให้ผิดหวัง ข้าติดตามการเคลื่อนไหวของ[tour_general_3001_target_courtier.GetHerHis] ซึ่งเป็นซิมโฟนีต่อสายตา ขณะที่[tour_general_3001_target_courtier.GetSheHe] หายไปตามโถงทางเดิน \n\nช่างเป็นความสามารถอันยอดเยี่ยม!"
 tour_general.3001.desc_outro:0 "ข้า #EMP ต้อง#! มี[tour_general_3001_target_courtier.GetHerHim] ในราชสำนักของข้า"
 tour_general.3001.a:0 "ตอนนี้เจ้าเป็นส่วนหนึ่งของราชสำนักของข้าแล้ว จงยินดีเถิด"
 tour_general.3001.a.flavor:0 "เมื่อได้มาแล้ว ก็เป็นของข้า"
 tour_general.3001.a.tt:0 "ข้าราชสำนักที่ถูกย้าย"
 tour_general.3001.a_cannibal:0 "ช่างเป็นการเพิ่มเติมที่น่าอร่อย!"
