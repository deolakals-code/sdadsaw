 tour_general.3002.h.tt.desc:0 "[visiting_liege.GetShortUIName] ไม่พอใจกับการตัดสินใจของท่าน"
 
 tour_general.0510.title:0 "คำเรียกร้องส่งท้าย"
 tour_general.0510.desc:0 "ข้าได้เสร็จสิ้นการเสด็จเยือน[ROOT.Char.GetCurrentLocation.GetName] อย่างเป็นทางการแล้ว และตอนนี้ขบวนของข้าก็เตรียมออกเดินทาง\n\n[stop_host_scope.GetName] และราชสำนักของ[stop_host_scope.GetHerHis] ได้เข้าแถวอย่างเรียบร้อยเพื่อส่งข้า และเมื่อทุกคนอยู่พร้อมหน้า ก็ถึงเวลาเก็บเครื่องบรรณาการสำหรับการประทานการปรากฏตัวของข้าแก่[stop_host_scope.GetHerHim]"
 tour_general.0510.a:0 "ถึงเวลาสำหรับเครื่องบรรณาการแล้ว"
 tour_general.0510.b:0 "ข้าไม่มีข้อเรียกร้องใดๆ"
 tour_general.0511.title:0 "ของขวัญส่งท้าย"
 tour_general.0511.desc:0 "ถึงเวลาที่[visiting_liege.GetName] จะจากไป และข้าต้องบอกว่าข้ารู้สึกว่าข้าเป็นเจ้าภาพที่ใจกว้าง\n\nอย่างไรก็ตาม ดูเหมือนว่า[visiting_liege.GetName] ไม่เชื่อว่าการเป็นเจ้าภาพของข้านั้นเพียงพอ และได้เรียกร้องจากข้า\n\n"
 tour_general.0511.desc.kneel:0 "[visiting_liege.GetSheHe|U] เรียกร้องให้ข้าคุกเข่าต่อหน้า[visiting_liege.GetTitleAsNameNoTooltip|U] ของข้า ต่อหน้าข้าราชสำนักทั้งหมดของข้า เพื่อแสดงความสวามิภักดิ์ต่อราชบัลลังก์"
 tour_general.0511.desc.money:0 "[visiting_liege.GetSheHe|U] ได้ยื่นใบเรียกเก็บเงินค่าใช้จ่ายทั้งหมดที่เกิดขึ้นระหว่างการเดินทางของ[visiting_liege.GetHerHis] ให้ข้า แม้ว่าค่าใช้จ่ายหลายรายการจะดูเหมือนปลอม แต่ข้าก็จำเป็นต้องจ่าย"
 tour_general.0511.desc.factions:0 "[visiting_liege.GetSheHe|U] ยื่นมือของ[visiting_liege.GetHerHis] ให้ข้าและเรียกร้องให้ข้าให้คำมั่นสัญญาว่าจะจงรักภักดีต่อ[visiting_liege.GetHerHim] และ[visiting_liege.GetPrimaryTitle.GetName] โดยสาบานว่าจะไม่ต่อต้านพระประสงค์ของราชวงศ์"
 tour_general.0511.a:0 "ข้ายอมจำนน"
 tour_general.0511.gave_demand:0 "[stop_host_scope.GetName] ยอมจำนน"
 tour_general.0511.b:0 "ข้าจะไม่ทำ เช่นนั้น!"
 tour_general.0512.title:0 "การโบกมือลา"
 tour_general.0512.desc:0 "ถึงเวลาที่[visiting_liege.GetName] จะจากไป และข้าต้องบอกว่าข้ารู้สึกว่าข้าเป็นเจ้าภาพที่ใจกว้าง\n\n[visiting_liege.GetSheHe|U] ดูเหมือนจะพอใจอย่างยิ่งกับการทำหน้าที่เจ้าภาพของข้า และไม่ได้เรียกร้องอะไรจากข้านอกจากคำสัญญาว่าเราอาจจะได้พบกันอีก"
 tour_general.0512.a:0 "ยอดเยี่ยม"
 tour_general.0513.title:0 "คำเรียกร้องถูกปฏิเสธ"
 tour_general.0513.desc:0 "[stop_host_scope.GetName] ได้ปฏิเสธอย่างท้าทายที่จะยอมจำนนต่อข้อเรียกร้องของข้า บัดนี้มีเพียงน้อยสิ่งที่ข้าสามารถทำได้, แต่การสบประมาท เช่นนี้ถือเป็นอาชญากรรมที่ไม่เพียง แต่ต่อต้านข้า, แต่ต่ออาณาจักรโดยตรง!"
 tour_general.0513.a:0 "สิ่งนี้จะไม่มีวันลืมเลือนในเร็ววัน"

