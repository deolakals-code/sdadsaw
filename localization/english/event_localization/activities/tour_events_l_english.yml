 cultural_festival.9000.title:0 "บัตรผ่านหลังเวที"
 cultural_festival.9000.desc:0 "ความมหัศจรรย์และความรื่นเริงตามปกติของเทศกาลวัฒนธรรมกำลังดำเนินไปรอบตัวข้าพเจ้า และราวกับว่าข้าพเจ้าถูกส่งไปยังอีกโลกหนึ่ง\n\nทว่าข้าพเจ้าถูกดึงกลับสู่โลกมนุษย์เมื่อเห็นบุคคลน่าสงสัยบางคนเดินปะปนอยู่รอบนอกฝูงชน ลอบเข้าไปหลังเวทีไม้ที่ส่งเสียงเอี๊ยดอ๊าด\n\nข้าพเจ้าเต็มไปด้วยความใคร่รู้ ไม่สามารถมองเห็นได้ชัดเจนว่าพวกคนชั่วเหล่านี้กำลังทำอะไรอยู่ จากนั้น ข้าพเจ้าเห็น [stop_host_scope.GetFirstName] ออกมาจากหลังเวทีพร้อมกับผู้ติดตามที่ดูต่ำทราม"
 cultural_festival.9000.a:0 "ข้าพเจ้าควรตรวจสอบ"
 cultural_festival.9000.host_noticed:0 "[stop_host_scope.GetFirstName] จับได้ว่าท่านกำลังสอดแนม"
 cultural_festival.9000.b:0 "ไม่ ข้าพเจ้าไม่ควรทำ เช่นนั้นจริงๆ"
 cultural_festival.9001.title:0 "หีบใต้เวที"
 cultural_festival.9001.desc:0 "หลังเวที ข้าพเจ้าไม่พบสิ่งใดนอกจากหีบใบเล็ก วัสดุของมันดูแข็งแรงทนทาน แต่งานฝีมือกลับดูเรียบง่ายและหยาบอย่างน่าประหลาด ไม่ใช่ของโชว์ที่คาดหวังจากเทศกาลขนาดนี้\n\nมันถูกผูกไว้ด้วยสิ่งที่ดูเหมือนจะเป็นกลอนปริศนาที่ปกคลุมไปด้วยงานแกะสลักหยาบๆ ของรูปปั้นอัปลักษณ์และสัตว์ร้ายนานาชนิด\n\nจิตใจของข้าพเจ้าเต็มไปด้วยความใคร่รู้ ข้าพเจ้าต้องรู้ให้ได้ว่าข้างในมีอะไร!"
 cultural_festival.9001.a:0 "ข้าพเจ้าแก้กลอนได้ ง่ายนิดเดียว!"
