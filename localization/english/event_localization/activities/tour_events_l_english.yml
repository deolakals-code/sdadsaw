 artifact_journal_of_grotesques:0 "บันทึกรูปปั้นอัปลักษณ์"
 artifact_journal_of_grotesques_desc:0 "บันทึกที่เข้ารหัสนี้เต็มไปด้วยข้อมูลเกี่ยวกับการศึกษารูปปั้นอัปลักษณ์และสถานที่ที่สามารถพบพวกมันได้"
 artifact_journal_of_theology:0 "บันทึกเทววิทยาขั้นสูง"
 artifact_journal_of_theology_desc:0 "บันทึกที่เข้ารหัสนี้มีการเปิดเผยที่ก้าวล้ำเกี่ยวกับเทววิทยา [ROOT.Char.GetFaith.GetAdjectiveNoTooltip]"
 artifact_journal_secret_history:0 "ประวัติศาสตร์ลับของ [ROOT.Char.GetPrimaryTitle.GetNameNoTierNoTooltip]"
 artifact_journal_secret_history_desc:0 "บันทึกที่เข้ารหัสนี้มีข้อมูลโดยละเอียดเกี่ยวกับประวัติศาสตร์ของ [ROOT.Char.GetPrimaryTitle.GetNameNoTierNoTooltip] และผู้ปกครอง"
 artifact_journal_of_martial_arts:0 "บันทึกศิลปะการต่อสู้"
 artifact_journal_of_martial_arts_desc:0 "บันทึกที่เข้ารหัสนี้ให้คำแนะนำเกี่ยวกับศิลปะการต่อสู้ทุกรูปแบบ ตั้งแต่ดาบ มือเปล่า ไปจนถึงม้า"

 cultural_festival.9010.title:0 "กระตือรือร้นเกินไป"
 cultural_festival.9010.desc:0 "ข้าพเจ้าเพลิดเพลินกับงานเทศกาลใน [ROOT.Char.GetCurrentLocation.GetName] วันนี้ แต่ไม่มากเท่ากับ [weeb_child.Custom2('MyCharacterIntroduction', ROOT.Char)]\n\n[weeb_child.GetSheHe|U] เต้นรำและหมุนตัวไปกับชาวบ้านด้วยความปิติยินดีและความกระฉับกระเฉงที่ข้าพเจ้าไม่เคยเห็นจาก [weeb_child.GetHerHim] มาก่อน [weeb_child.GetSheHe|U] ดื่มด่ำกับประเพณีแปลกใหม่ของวัฒนธรรม [festival_culture_scope.GetName] อย่างเต็มที่ ดูเหมือนจะรู้สึกเหมือนอยู่บ้าน และชาวบ้านก็ดูจะชื่นชอบ [weeb_child.GetHerHim] เช่นกัน!"
 cultural_festival.9010.a:0 "ดีจริง"
 cultural_festival.9010.b:0 ""อยู่กับพวกเขาเถิด [weeb_child.GetFirstNameNoTooltip]!""
 cultural_festival.9020.title:0 "จุดสุดยอดอันยิ่งใหญ่"
 cultural_festival.9020.desc:0 "ดวงอาทิตย์กำลังตกดินในอีกวันหนึ่งที่ [ROOT.Char.GetCurrentLocation.GetName] และชาวบ้านดูเหมือนกำลังเตรียมการแสดงครั้งสุดท้าย มีการตั้งเสาไม้ขนาดใหญ่ขึ้น และข้าพเจ้ารู้สึกตื่นเต้นที่จะได้เห็นสิ่งที่จะเกิดขึ้นต่อไป!\n\nแต่แล้ว [human_sacrifice.GetWomanMan] ที่อ่อนแอคนหนึ่งก็ถูกลากขึ้นมาทั้งเตะทั้งกรีดร้อง และถูกมัดไว้กับเสา มีดถูกนำมาจ่อที่ท้องของ [human_sacrifice.GetHerHis] และ [human_sacrifice.GetSheHe] ก็หลับตาลง เตรียมพร้อมเผชิญหน้ากับความดับสูญ"
 cultural_festival.9020.b:0 ""หยุดความบ้าคลั่งนี้ในนามของ [ROOT.Char.GetTitleAsNameNoTooltip|U] ของเจ้า!""
 cultural_festival.9030.title:0 "ประเพณี [ROOT.Char.GetFaith.GetAdherentNameNoTooltip|U]"
 cultural_festival.9030.desc:0 "[visiting_liege.Custom2('MyCharacterIntroduction', ROOT.Char)|U] ดูเหมือนจะหลงใหลในงานเทศกาลวันนี้อย่างยิ่ง นักเต้น นักแสดง และนักแสดงตลกต่างพยายามเอาใจนายเหนือหัวของข้าพเจ้า และดูเหมือนจะได้ผลอย่างสมบูรณ์แบบ\n\nในอารมณ์ที่ดี เช่นนี้ และรายล้อมไปด้วยประเพณีของเรา บางที [visiting_liege.GetFirstName] อาจเริ่มสนใจที่จะรักษาประเพณีเหล่านี้ให้คงอยู่ ประเพณี [ROOT.Char.GetFaith.GetAdherentName|U] จะต้องสูญสิ้นไปอย่างแน่นอนหากไม่มีการคุ้มครองทางกฎหมายที่เหมาะสมต่อการเปลี่ยนศาสนา"
 cultural_festival.9030.a:0 ""คงน่าเสียดายหากประเพณีเหล่านี้ต้องตายไป ใช่หรือไม่?""
 cultural_festival.9030.success:0 "ท่านโน้มน้าว [visiting_liege.GetFirstName] ได้สำเร็จ"
 cultural_festival.9030.failure:0 "ท่านโน้มน้าว [visiting_liege.GetFirstName] ไม่สำเร็จ"
 cultural_festival.9030.b:0 "ข้าพเจ้าควรเงียบไว้"
 cultural_festival.9040.t:0 "เหรียญหนึ่งเพื่อโชคชะตา"
 cultural_festival.9040.desc:0 "ในมุมห่างไกลของเทศกาล ข้าพเจ้าพบเต็นท์ที่ตก แต่งอย่างประณีต วัสดุและลวดลายแปลกตาสำหรับข้าพเจ้า แตกต่างจากที่เคยเห็นที่บ้านเกิด เจ้าของเต็นท์ยิ่งแปลกประหลาดยิ่งกว่า ยิ้มให้ข้าพเจ้าอย่างรู้ทันเหนือมือที่ประสานกัน\n\n"อา ท่าน [ROOT.Char.GetTitleAsNameNoTooltip|U]! ข้าพเจ้าเห็นหลายสิ่งในอนาคตของท่าน มาเถิด ให้เหรียญข้าพเจ้า แล้วข้าพเจ้าจะบอกทั้งหมด""
 cultural_festival.9040.a:0 ""เจ้าจะได้เหรียญไป""
 cultural_festival.9040.good_reading:0 "คำทำนายของท่านเป็นบวก"
 cultural_festival.9040.bad_reading:0 "คำทำนายของท่านบ่งบอกถึงหายนะ"
 cultural_festival.9040.b:0 ""ข้าพเจ้าไม่สนใจพวกนักต้มตุ๋นทั่วไป""
