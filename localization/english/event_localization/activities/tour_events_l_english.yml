 tour_general.5000.desc:0 "ข้าพเจ้ารวบรวมบันทึก อ่านหนังสือปริศนาอย่างละเอียด และนำไปใช้กับกลอนด้วยการเคลื่อนไหวที่แม่นยำดุจความคิดของข้าพเจ้า\n\nในที่สุด ข้าพเจ้าคิดว่าทำได้แล้ว และ #EMP แกร๊ง!#! บันทึกยังคงล็อกและดื้อด้านเหมือนเคย"
 tour_general.5000.a:0 "ให้ตายสิ!"
 tour_general.5000.b:0 "ข้าพเจ้าจะลองอีกครั้ง!"
 tour_general.5001.title:0 "$journal_events_prefix$ ความล้มเหลวอีกครั้ง"
 tour_general.5001.desc:0 "ข้าพเจ้ารู้สึกจริงๆ ว่าครั้งนี้ข้าพเจ้าไขมันออกแล้ว ทุกอย่างดูสมเหตุสมผล ไม่มีทางที่ข้าพเจ้าจะผิด\n\nหมุนไปทางซ้าย และ... #EMP แกร๊ง!#! บันทึกยังคงล็อกและดื้อด้านเหมือนเคย"
 tour_general.5001.a:0 "ปัดโธ่เอ๊ย!"
 tour_general.5001.b:0 "ข้าพเจ้าจะพังกลอนบ้าๆ นี่ซะ!"
