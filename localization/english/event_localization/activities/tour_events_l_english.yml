 cultural_festival.9050.t:0 "การเต้นรำยั่วยวน"
 cultural_festival.9050.desc:0 "ข้าพเจ้านั่งชมการแสดงอันน่าหลงใหลอีกชิ้นหนึ่ง เสียงเครื่องกระทบดังกระหึ่มในความเงียบที่รอคอย เสียงกลองดังราวกับเสียงหัวใจเต้น\n\nจากหลังม่าน [sexy_dancer.GetWomanMan] ผู้งดงามปรากฏตัว เคลื่อนไหวร่างกายของ [sexy_dancer.GetHerHis] ในลักษณะที่ทั้งลามกและน่าตื่นเต้น [sexy_dancer.GetSheHe|U] ทอดกายอย่างน่าตกตะลึงใกล้กับข้าพเจ้า แล้วจากไปพร้อมกับเพียงการขยิบตา กลับไปหาผู้ชมที่ชื่นชม [sexy_dancer.GetHerHis]"
 cultural_festival.9050.a:1 "[sexy_dancer.GetSheHe|U] ต้องเป็นของข้าพเจ้า!"
