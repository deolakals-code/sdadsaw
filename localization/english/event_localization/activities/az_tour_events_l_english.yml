l_english: 

 az_tour.0001.t: "การขับขานของบัณฑิต"
 az_tour.0001.desc: "[stop_host_scope.Custom2('MyCharacterIntroduction', ROOT.Char)|U] ยกมือขึ้นเพื่อขอความสงบขณะที่เหล่าคนรับใช้เก็บจานใบสุดท้าย จากข้างกาย [stop_host_scope.GetHerHim] [scholar.Custom2('MyCharacterIntroduction', ROOT.Char)] ก้าวออกมา และด้วยน้ำเสียงอันสุขุม ก็เริ่มขับขานบทกวี — ถ้อยคำอันวิจิตรเกี่ยวกับการผันผ่านของเวลาและน้ำหนักแห่งคุณธรรม\n\nเมื่อเสียงปรบมือแผ่วลง [stop_host_scope.GetTitledFirstNameNoTooltip] หันมาหาข้าพร้อมรอยยิ้ม "แล้วถ้อยคำใดเล่าที่ดวงใจของท่านอาจมอบให้, [ROOT.Char.GetTitledFirstNameNoTooltip]?""
 az_tour.0001.a.diplomacy: "กล่าวถึงว่าความปรองดองค้ำจุนอาณาจักรได้อย่างไร"
 az_tour.0001.a.martial: "ยืนกรานว่าคุณธรรมต้องได้รับการปกป้องด้วยกำลัง"
 az_tour.0001.a.stewardship: "ใคร่ครวญถึงภาระแห่งการปกครองอันชอบธรรม"
 az_tour.0001.a.intrigue: "ชี้แนะว่า [stop_host_scope.GetTitleAsName] ตระหนักถึงอำนาจอันเงียบงัน"
 az_tour.0001.a.learning: "เสนอการอรรถาธิบายที่อ้างอิงจากตำราคลาสสิก"
 az_tour.0001.a.fallback: "ตอบสนองด้วยการตีความอันลึกซึ้ง"
 az_tour.0001.b: "ขับขานบทกวีสั้น ๆ เกี่ยวกับอนิจจัง"
 az_tour.0001.c: "กล่าวสุนทรพจน์ถึงความกระหายที่จะรุ่งโรจน์"

 az_tour.0002.t: "มูลค่าแห่งความประณีต"
 az_tour.0002.desc: "[stop_host_scope.Custom2('MyCharacterIntroduction', ROOT.Char)|U] ก้าวออกมาพร้อมรอยยิ้มและมอบกล่องเคลือบเงา ผูกด้วยริบบิ้น [stop_host_scope.Custom('RegionalFabric')] อย่างดี\n\n"คงเป็นเรื่องน่าละอายหากข้าปล่อยให้ [ROOT.Char.Custom('FormOfAddressForLiege')] จากไปโดยไม่มีสิ่งใดเป็นที่ระลึกถึงความนับถือของข้า," [stop_host_scope.GetSheHe] กล่าว "ด้านในคือสมบัติเล็กน้อย — เครื่องเขินขัดเงา, บทกวีโบราณที่เขียนด้วยลายมืออันพริ้วไหว, และเครื่องหอมที่ครั้งหนึ่งเคยเป็นที่โปรดปรานในโถงของสำนักชั้นสูง"\n\nกิริยาท่าทางนั้นช่างสง่างาม ทว่าประกายของถาดเงิน, ลายไม้หายากของแผ่น [ROOT.Province.Custom('GetRandomRegionalWood')] — มันบ่งบอกถึงฐานะที่เกินกว่าที่ตำแหน่งนี้ควรจะมีได้ ข้าเหลือบมองของกำนัลอีกครั้ง มัน... ฟุ่มเฟือยเกินไป"
 az_tour.0002.a: ""เป็นของกำนัลที่วิจิตรยิ่ง ข้าเป็นเกียรติอย่างยิ่ง""
 az_tour.0002.b: ""รสนิยมของท่านช่างเลิศล้ำ... จนเกือบจะน่าสงสัย""
 az_tour.0002.c: ""ข้ามิอาจรับสิ่งนี้ไว้ได้ ด้วยมโนธรรมอันดี""

 az_tour.0003.t: "เสียงกระซิบในจอก"
 az_tour.0003.desc: "ขณะที่ [stop_host_scope.Custom('RegionalDrink')] ถูกรินและบทสนทนาล่องลอยไปรอบกายข้า [servant.Custom2('MyCharacterIntroduction', ROOT.Char)|U] ก้าวเข้ามาเพื่อเติมจอกให้ข้า แต่แทนที่จะเพียงแค่ริน นิ้วของ [servant.GetHerHis] กลับสอดกระดาษแผ่นเล็กที่พับไว้ใส่มือข้า — และหายตัวไปอย่างรวดเร็วเฉก เช่นตอนที่ [servant.GetSheHe] มา\n\nใต้โต๊ะ ข้าคลี่มันออก ชื่อหนึ่ง การกระทำหนึ่ง เรื่องอื้อฉาวหนึ่ง มันเกี่ยวกับเจ้าภาพของข้า: [stop_host_scope.GetTitledHouseNameOrFirstName] สารนั้นสั้น แต่ความหมายแฝงนั้นชัดเจนแจ้ง\n\nและฝั่งตรงข้ามโต๊ะ [stop_host_scope.Custom2('MyCharacterIntroduction', ROOT.Char)|U] ยิ้ม โดยมิได้ระแคะระคาย"
 az_tour.0003.a: "ข้าจะเก็บสิ่งนี้ไว้กับตัว... ในตอนนี้"
 az_tour.0003.b: "เรื่องนี้ไม่ควรถูกเก็บเงียบไว้"
 az_tour.0003.b.tt: "[stop_host_scope.GetTitledHouseNameOrFirstName] จะมีปฏิกิริยาตามลักษณะนิสัยของ [stop_host_scope.GetHerHis]"
 az_tour.0003.c: "บางเรื่องก็เป็นการดีกว่าที่จะปล่อยไว้โดยไม่แตะต้อง"
 az_tour.0003.d: "ข้าจะนำเรื่องนี้ไปถึงผู้มีอำนาจสูงสุดโดยตรง!"

 az_tour.1003.t: "เสียงกระซิบในจอก"
 az_tour.1003.desc: "[visiting_liege.Custom2('MyCharacterIntroduction', ROOT.Char)|U] ส่งสัญญาณเบา ๆ ให้ข้าไปสมทบกับ [visiting_liege.GetHerHim] ใกล้ห้องด้านข้าง, ทันทีที่เหล่าคนรับใช้เริ่มเปลี่ยนชุดอาหาร\n\n"[ROOT.Char.GetFirstName]," [visiting_liege.GetSheHe] เอ่ยขึ้น, น้ำเสียงนุ่มนวลดั่งไหม ทว่าแฝงความเด็ดเดี่ยวดั่งเหล็กกล้า "มีจดหมายฉบับหนึ่งมาถึงมือข้า — หมึกยังคงสดใหม่ มันบอกเล่าถึง... ความไม่รอบคอบ บางประการ ผู้หนึ่งอาจปัดเป่าคำพูด เช่นนี้ทิ้งไป, หากมันไม่ได้ถูกกระซิบมาจากหลายปาก"\n\nด้านนอก, เสียงจานกระทบกันและเสียงหัวเราะอันเงียบงันยังคงดำเนินต่อไป, ฉากกั้นห้องทอดเงาสั่นไหวไปทั่วพื้นขัดมัน"
az_tour.1003.a: ""คำโกหกและการใส่ร้าย ข้าจะไม่ฟังอีกแม้ แต่คำเดียว!""
az_tour.1003.b: ""ท่านได้ความเงียบของข้า... และสิ่งที่ตามมากับมัน""
az_tour.1003.c: "ทรัพย์สมบัติเพื่อปิดปากท่าน"
az_tour.1003.d: ""ข้าจะสละสิทธิ์ในการอ้างสิทธิ์ของข้า""
az_tour.1003.e: ""ข้าซื้อความเงียบของท่านด้วยความเงียบของข้า""

 az_tour.0004.t: "ปัญหาเรื่องการปกครอง"
 az_tour.0004.desc.intro: "ระหว่างการกัดคำและจิบ [stop_host_scope.Custom('RegionalDrink')] อย่างสุภาพ, บทสนทนาที่โต๊ะก็ดุเดือดขึ้น [stop_host_scope.Custom2('MyCharacterIntroduction', ROOT.Char)|U] หยิบยกปัญหาเร่งด่วนด้านการปกครองขึ้นมา — ไม่ได้พูดกับข้าโดยตรง, แต่ชัดเจนว่าอยู่ในระยะที่ได้ยิน\n\n"
 az_tour.0004.desc.stewardship: ""เราไม่สามารถเสียเงินแม้ แต่เหรียญเดียวไปกับความโง่เขลาได้อีก," [stop_host_scope.GetTitledHouseNameOrFirstName] ยืนกราน "เงินทุนพัฒนาต้องไปในที่ที่มันให้ผลตอบแทนสูงสุด"\n\n"แต่กระนั้นถนนก็แตกร้าวและคูคลองก็แห้งเหือดขณะที่คลังหลวงอยู่นิ่งเฉย," [opposing_counsel.Custom2('MyCharacterIntroduction', ROOT.Char)] โต้กลับ"
 az_tour.0004.desc.martial: ""กองทหารของข้าขาดม้า, แล้วท่านยังจะมาพูดเรื่องชุดเกราะสวนสนามอีกรึ?" [opposing_counsel.Custom2('MyCharacterIntroduction', ROOT.Char)] กล่าวอย่างราบเรียบ\n\n"ระเบียบวินัยเริ่มต้นจากความภาคภูมิใจในตำแหน่งของตน," [stop_host_scope.GetTitledHouseNameOrFirstName] สวนกลับ, พลางเลิกคิ้ว"
 az_tour.0004.desc.learning: ""วิธีการสำรวจที่ดินแบบใหม่นี้ได้รับการสนับสนุนจากตำราที่น่าเชื่อถือ," [stop_host_scope.GetTitledHouseNameOrFirstName] โต้แย้งด้วยน้ำเสียงหนักแน่น\n\n"แต่กระนั้น ก็ไม่มีบัณฑิตคนใดในที่นี้รับรองความถูกต้องของมัน," [opposing_counsel.Custom2('MyCharacterIntroduction', ROOT.Char)] ตอบกลับอย่างเย็นชาและเชือดเฉือน"
 az_tour.0004.a: "ข้าจำต้องเห็นด้วยกับการประเมินของเจ้าภาพของเรา"
 az_tour.0004.b.stewardship: "งบประมาณที่สมดุลรับใช้ทุกคน — ข้าขอเสนอข้อประนีประนอมนี้"
 az_tour.0004.b.stewardship.tt: "แบ่งส่วนเกินไปซ่อมแซมเร่งด่วน, และส่วนที่เหลือสำหรับการลงทุนระยะยาว ความมัธยัสถ์ไม่จำเป็นต้องหมายถึงการละเลย"
 az_tour.0004.b.martial: "ความมั่นคงต้องใช้งานได้จริง, ไม่ใช่เพื่อประดับ ขอข้าร่วมแสดงความเห็น"
 az_tour.0004.b.martial.tt: "จัดเตรียมกองทหารเพื่อการใช้งาน, ไม่ใช่เพื่อจัดแสดง — ชุดเกราะที่เหมาะสำหรับสนามรบ, และม้าที่เพียงพอสำหรับการลาดตระเวน เกียรติยศตามมาจากระเบียบวินัย, ไม่ใช่การปิดทอง"
 az_tour.0004.b.learning: "ให้เหตุผลอยู่เหนือสิ่งอื่นใด ข้าขอเสนอทางออกที่มีเหตุผล"
 az_tour.0004.b.learning.tt: "ทดลองวิธีการใหม่ในเขตเดียวภายใต้การสังเกตการณ์อย่างระมัดระวัง หากพิสูจน์ได้ว่าใช้ได้ผล, ก็ขยายผล หากไม่, ก็ละทิ้งมันไป — ดังที่ทฤษฎีที่ดีควรจะเป็น"
 az_tour.0004.c: "นี่คืองานเลี้ยงอาหารค่ำ, ไม่ใช่โถงโต้วาที"

 az_tour.0005.t: "โน้ตที่เพี้ยนไป"
 az_tour.0005.desc: "ความเงียบเข้าปกคลุมทั่วโถงเมื่อนักดนตรีเล่นโน้ตหนึ่งแรงเกินไป — เสียงแหลมดัง 'แผละ' ตัดผ่านเสียงพึมพำราวกับถูกตบหน้า ท่วงทำนองมลายสิ้น\n\n[stop_host_scope.Custom2('MyCharacterIntroduction', ROOT.Char)|U] ตัวแข็งทื่ออยู่กับที่\n\n"อา — ข้าขออภัย," นักดนตรีพูดตะกุกตะกัก, โค้งคำนับต่ำโดยมีเครื่องดนตรีของ [musician.GetHerHis] สั่นเทาในมือ แขกสองสามคนหยุดชะงักกลางคันขณะจิบ [stop_host_scope.Custom('RegionalDrink')], พลางมองไปรอบ ๆ อย่างไม่แน่ใจ\n\n[stop_host_scope.GetTitledHouseNameOrFirstName] ฝืนยิ้ม, แต่รอยแดงบนแก้มของ [stop_host_scope.GetHerHis] นั้นชัดเจนยิ่งนัก "อุบัติเหตุเล็กน้อย," [stop_host_scope.GetSheHe] กล่าวเบา ๆ, ด้วยน้ำเสียงที่ตึงเครียด "อย่าให้เราสูญเสียความสุขของค่ำคืนนี้ไปกับเรื่องนี้เลย""
 az_tour.0005.a: ""เป็นการแสดงที่ยอดเยี่ยม, แม้จะมีอุบัติเหตุก็ตาม!""
 az_tour.0005.b: ""เราแทบจะยังไม่ได้เริ่มเลย; ไปเอา [ROOT.Char.Custom('GetMusicalInstrument')] ของข้ามา!""
 az_tour.0005.c: ""ข้าแทบไม่ได้ตั้งใจฟังตั้งแต่แรกแล้ว""

 az_tour.1005.t: "ท่วงทำนองอันสูงส่ง"
 az_tour.1005.desc: "เสียงแตกดังลั่น — แล้วก็เงียบ [ROOT.GetCharacter.Custom('GetMusicalInstrument')] หักสะบั้นกลางโน้ต, และความเงียบงันอันน่าตะลึงที่ตามมานั้นบาดลึกยิ่งกว่าเสียงดนตรีใด ๆ นักแสดงคนที่สองเล่นพลาดตอนเริ่ม คนที่สามไออย่างประหม่า การแสดงพังทลายลง, ทีละโน้ตที่พลาดไป\n\nก่อนที่ข้าจะลุกขึ้นหรือเรียกคนมาแทน, [visiting_liege.Custom2('MyCharacterIntroduction', ROOT.Char)|U] ก้าวออกมาและหยิบ [visiting_liege.Custom('GetMusicalInstrument')] ออกจากกล่อง ไม่มีการประโคม, ไม่มีการประกาศ — มีเพียงความมั่นใจอันเงียบงันของผู้ที่คุ้นเคยกับการเป็นที่รับฟัง\n\nโน้ตแรกเริ่มล่องลอยออกมาดั่งควันกำยาน, เชื่องช้าและค้นหา บทสนทนาเลือนหายไป จอกถูกลดต่ำลง แม้ แต่คนรับใช้ก็หยุดนิ่ง [visiting_liege.GetTitleAsNameNoTooltip] ผู้ ซึ่งครั้งหนึ่งเคยเป็นแขกของข้า, บัดนี้กลับบัญชาโถงในฐานะนักแสดง\n\nและเมื่อคอร์ดสุดท้ายสั่นไหวสู่ความเงียบ, สิ่งเดียวที่ข้าทำได้คือนั่งอยู่กับความหนักอึ้งของมัน"
 az_tour.1005.a: "การแสดงอันยอดเยี่ยมที่มิอาจเทียบได้ — ช่างสง่างามอย่างแท้จริง!"
 az_tour.1005.b: "ช่างเชี่ยวชาญยิ่งนัก! ข้ารู้สึกถูกกระตุ้นให้พัฒนาตนเอง"
 az_tour.1005.c: ""การแสดงนี้ต่ำกว่าสถานะของ [visiting_liege.GetHerHis]""
 az_tour.1005.c.toast: "[stop_host_scope.GetTitledHouseNameOrFirstName] วิจารณ์การแสดงของท่าน"

 az_tour.0006.t: "การขัดจังหวะอันไร้มารยาท"
 az_tour.0006.desc: "เสียงตะโกนดังแทรกเสียงหัวเราะและดนตรีของเทศกาล [angry_farmer.GetWomanMan] ในเสื้อผ้าซอมซ่อผลักดันไปข้างหน้า, ใบหน้าแดงก่ำด้วยความขุ่นเคือง [angry_farmer.GetSheHe|U] ยืนหยัดอย่างมั่นคงและเปล่งเสียงของ [angry_farmer.GetHerHis] ให้ดังเหนือฝูงชน\n\n"พวกเราทำงานหนักในทุ่งนา, แต่เงินทั้งหมดกลับไปอยู่ที่ผ้าไหมและงานเลี้ยง! ท่านนั่งอยู่ใต้โคมไฟ, ดื่ม [stop_host_scope.Custom('RegionalDrink')] — แต่ใครกันเล่าที่ดูแลพวกเราที่ชามข้าวยังว่างเปล่า?"\n\nเทศกาลพลันหยุดนิ่ง [visiting_liege.Custom2('MyCharacterIntroduction', ROOT.Char)|U] ชำเลืองมองข้า — อย่างระแวดระวัง, และไม่พอใจอย่างชัดเจน"
 az_tour.0006.a: ""เรื่องนี้จะได้รับการตรวจสอบ ข้าให้สัญญา""
 az_tour.0006.b: ""เทศกาลไม่ได้มีไว้สำหรับการร้องเรียน""
 az_tour.0006.c: ""ดื่ม [stop_host_scope.Custom('RegionalDrink')] สักหน่อยเพื่อคลายอารมณ์""
 tgp_heard_complaints_modifier: "รับฟังคำร้องเรียน"
 tgp_heard_complaints_modifier_desc: "ผู้ปกครองของเคาน์ตีนี้ได้รับฟังคำร้องเรียนของไพร่ฟ้าแล้ว"
 tgp_dismissed_complaints_modifier: "ปฏิเสธคำร้องเรียน"
 tgp_dismissed_complaints_modifier_desc: "ผู้ปกครองของเคาน์ตีนี้ได้ปฏิเสธคำร้องเรียนของไพร่ฟ้า"

 az_tour.1006.t: "การขัดจังหวะอันไร้มารยาท"
 az_tour.1006.desc.intro: "จัตุรัสตลาดอบอวลไปด้วยเสียงดนตรีและความอึกทึกของการเฉลิมฉลอง, แต่ไม่ใช่ทุกเสียงที่เปล่งออกมาด้วยความยินดี ชาวนาท้องถิ่นคนหนึ่ง, หน้าแดงก่ำและแสดงท่าทาง, ผลักฝ่าฝูงชน, จ้องเขม็งไปที่ [stop_host_scope.GetTitledHouseNameOrFirstName]"
 az_tour.1006.desc.a: ""พวกเราทำงานหนักในทุ่งนา, แต่เงินทั้งหมดกลับไปอยู่ที่ผ้าไหมและงานเลี้ยง! ท่านนั่งอยู่ใต้โคมไฟ, ดื่ม [stop_host_scope.Custom('RegionalDrink')] — แต่ใครกันเล่าที่ดูแลพวกเราที่ชามข้าวยังว่างเปล่า?"\n\nใบหน้าของเจ้าภาพตึงเครียด, แต่ [stop_host_scope.GetSheHe] ตอบอย่างใจเย็น, สัญญาว่าจะชดเชยและมอบหมายให้สจ๊วตไปดูแลความเสียหาย"
 az_tour.1006.desc.b: ""พวกเราทำงานหนักในทุ่งนา, แต่เงินทั้งหมดกลับไปอยู่ที่ผ้าไหมและงานเลี้ยง! ท่านนั่งอยู่ใต้โคมไฟ, ดื่ม [stop_host_scope.Custom('RegionalDrink')] — แต่ใครกันเล่าที่ดูแลพวกเราที่ชามข้าวยังว่างเปล่า?"\n\n[stop_host_scope.GetSheHe|U] ยิ้มอย่างช้า ๆ และตามใจชอบ "ชามข้าวของเจ้าไม่ใช่ธุระของข้า ทหาร, จับตัว [angry_farmer.Custom2('InsultNoun', ROOT.Char)] นี่ไป!" เสียงสูดลมหายใจดังระลอกไปทั่วฝูงชนขณะที่ชาวนาถูกจับกุมโดยทหารของ [stop_host_scope.GetFirstNamePossessiveNoTooltip] และถูกลากออกไป, เสียงสาปแช่งของ [angry_farmer.GetHerHis] หายไปภายใต้เสียงดนตรี"
 az_tour.1006.desc.c: ""พวกข้าตรากตรำในท้องทุ่ง แต่เงินทองกลับมลายไปกับผ้าไหมและงานเลี้ยง! ท่านนั่งใต้โคมไฟ ดื่ม [stop_host_scope.Custom('RegionalDrink')] — แต่ผู้ใดเล่าจะเหลียวแลพวกข้าที่ชามเปล่า?"\n\n"[stop_host_scope.GetSheHe|U] ชูมือขึ้นเล็กน้อย น้ำเสียงสงบ แต่มั่นคง "เรามารวมกันอย่างสันติ จงใจเย็นลงแล้วเติมถ้วยให้เต็มเถิด — ข้ามั่นใจว่าเราสามารถรับฟังความคับข้องใจของท่านได้โดยมิต้องหยุดชะงัก" ชาวนาขยับตัวอย่างอึดอัด ความขุ่นเคืองยังคงอยู่ในดวงตาของ [angry_farmer.GetHerHis] ทว่าน้ำเสียงของ [angry_farmer.GetHerHis] ก็อ่อนลงภายใต้น้ำหนักของความเป็นทางการ"
 az_tour.1006.a: ""ทัศนคติที่คู่ควรแก่ [stop_host_scope.GetTitleAsNameNoTooltip] ผู้ [stop_host_scope.Custom('ComplimentAdjective')] ที่สุด!""
 az_tour.1006.a.toast: "[visiting_liege.GetTitleAsNameNoTooltip] กล่าวสนับสนุนแนวทางของท่าน"
 az_tour.1006.b: ""ข้าคงจะจัดการเรื่องนั้นแตกต่างออกไป""
 az_tour.1006.b.toast: "[visiting_liege.GetTitleAsNameNoTooltip] ไม่เห็นด้วยกับการตอบสนองต่อชาวนาของท่าน"
 az_tour.1006.c: ""ขออภัย, ข้ากำลังเคลิบเคลิ้มไปกับการเต้นรำอันมีสีสันนี้""
 az_tour.1006.c.toast: "[visiting_liege.GetTitleAsNameNoTooltip] เพิกเฉยต่อความวุ่นวายและไม่ยุ่งเกี่ยว [visiting_liege.GetHerselfHimself]"

 az_tour.0007.t: "คำสอพลอที่เบ่งบาน"
 az_tour.0007.desc: "ใต้ซุ้มกิ่งไม้ที่ประดับโคมไฟและกำลังเบ่งบาน, ผู้ติดตามประกาศนาม [elegant_noble.Custom2('MyCharacterIntroduction', ROOT.Char)] พวกเขาก้าวออกมา, ประคองม้วนภาพที่วาดอย่างปราณีต ภูเขาที่ถูกวาดขึ้นตั้งตระหง่านจากผืนผ้าไหม, ยอดเขาถูกสวมมงกุฎด้วยต้นไม้ที่ออกดอก, ขณะที่ตัวอักษรที่พริ้วไหวคดเคี้ยวอยู่ข้าง ๆ — การรวมกันของความปรองดองและความแข็งแกร่ง\n\n"เนินเขาอาจทลายลง," [elegant_noble.GetSheHe] กล่าวพร้อมรอยยิ้มถ่อมตน, "แต่ฤดูใบไม้ผลิย่อมกลับมาเสมอ — แม้เพียงชั่วครู่ก็ตาม นี่," [elegant_noble.GetSheHe] กล่าวต่อ, พลางจ้องมองข้า, "คือภาพสะท้อนการปกครองของท่าน, [ROOT.Char.Custom('FormOfAddressForLiege')]"\n\nศิลปะช่างมิอาจปฏิเสธได้, ความรู้สึกที่สื่อออกมานั้นช่างประจบประแจงอย่างแนบเนียน [stop_host_scope.Custom2('MyCharacterIntroduction', ROOT.Char)|U] ผงกศีรษะของ [stop_host_scope.GetHerHis] รับอย่างเงียบ ๆ, รอคอยการตอบสนองของข้า"
 az_tour.0007.a: ""ช่างสมดุลยิ่งนัก! เพียงฝีแปรงก็สมควรได้รับตำแหน่งแล้ว""
 az_tour.0007.b: ""เมื่อฤดูใบไม้ผลิผ่านไป, คำโอ้อวดของท่านก็ เช่นกัน""
 az_tour.0007.c: ""ศิลปะที่แท้จริงในที่นี้คือการสอพลอ, ไม่ใช่ดอกไม้""
 tgp_mocked_elites_modifier: "เยาะเย้ยชนชั้นสูง"

 az_tour.1007.t: "บุปผาร่วงโรย"
 az_tour.1007.desc: "อากาศอบอวลไปด้วยน้ำหอมและบทกวี — ทุกถ้อยคำถูกเลือกสรร, ทุกท่วงท่าถูกซักซ้อม เหล่าข้าราชสำนักเอนตัวไปข้างหน้าขณะที่ [elegant_noble.Custom2('MyCharacterIntroduction', ROOT.Char)] จบบทกวีท่อนสุดท้าย, น้ำเสียงของ [elegant_noble.GetHerHis] ยังคงก้องกังวาน, หอมหวานดั่งควันกำยาน\n\n[visiting_liege.Custom2('MyCharacterIntroduction', SCOPE.sCharacter('stop_host_scope'))] มอบรอยยิ้มอันเชื่องช้าและจงใจ "ช่างสง่างามยิ่งนัก," [visiting_liege.GetSheHe] กล่าว, น้ำเสียงราบเรียบดั่งเครื่องเขิน "มันมีเสน่ห์บางอย่างในความซื่อสัตย์แบบบ้านนอก เช่นนี้" ก่อนที่ข้าจะทันได้หายใจ, เสียงกระซิบก็เริ่มขึ้น — เสียงเสียดสีตามม้านั่งยาว, พัดถูกยกขึ้นเพื่อบดบังรอยยิ้มเยาะ [visiting_liege.Custom2('MyCharacterIntroduction', SCOPE.sCharacter('stop_host_scope'))] ผงกศีรษะของ [visiting_liege.GetHerHis], ยิ้มอย่างช้า ๆ และจงใจ, ราวกับกำลังลิ้มรสความอึดอัดของข้า"
 az_tour.1007.a: "ปล่อยให้ [visiting_liege.GetHerHim] หัวเราะไป, หาก [visiting_liege.GetSheHe] ต้องการ"
 az_tour.1007.b: "[visiting_liege.GetSheHe] หยามคนของข้า!"

 az_tour.0008.t: "พู่กันและการตัดสิน"
 az_tour.0008.desc: "ตามคำขอของข้า, [revered_scholar.Custom2('MyCharacterIntroduction', ROOT.Char)] เข้านั่งประจำที่ใต้ซุ้มผ้าไหม, โดยมีผู้ชมรวมตัวกันอย่างใกล้ชิดเพื่อรับชม พู่กันในมือ, [revered_scholar.GetSheHe] เริ่มการคัดลอกตำราคลาสสิกอย่างตั้งใจ, อักษร แต่ละตัวถูกวาดด้วยความเอาใจใส่จนดูเหมือนว่าแผ่นหนังจะหายใจออกมาเป็นความหมาย\n\nมันคงจะชัดเจนไม่น้อย, ใช่หรือไม่, หาก [visiting_liege.Custom2('MyCharacterIntroduction', ROOT.Char)] เป็นผู้ตัดสินผลงานชิ้นนี้? เพียงคำประกาศเดียวต่อหน้าทุกสายตา, และวิจารณญาณของ [visiting_liege.GetHerHis] ก็จะถูกแสดงออกมาอย่างเต็มที่"
 az_tour.0008.a: "เชิญ [visiting_liege.GetTitledHouseNameOrFirstName] มาตัดสินการสาธิต"
 az_tour.0008.a.tt: "ท่านจะได้รับรางวัลขึ้นอยู่กับความเห็นของเจ้าเหนือหัวของท่านที่มีต่อการสาธิต"
 az_tour.0008.b: "ปล่อยให้ [visiting_liege.GetTitledHouseNameOrFirstName] เพลิดเพลินกับมันอย่างสงบ"

 az_tour.1008.t: "พู่กันเอ่ยวาจา"
 az_tour.1008.desc.intro: "ข้าถูกนำมายังใต้ซุ้มผ้าไหมโดย [stop_host_scope.Custom2('MyCharacterIntroduction', ROOT.Char)], ที่ ซึ่งฝูงชนได้รวมตัวกัน "[revered_scholar.GetTitledHouseNameOrFirstName] จะแสดงให้เราเห็นถึงความงดงามของตำราคลาสสิก" [revered_scholar.GetSheHe|U] โค้งคำนับอย่างเคร่งขรึมให้ข้าและ [stop_host_scope.GetTitledHouseNameOrFirstName], เข้าประจำที่ [revered_scholar.GetHerHis] ณ ศูนย์กลางและคลี่แผ่นหนังอย่างดีออก ด้วยจังหวะที่ระมัดระวัง, [revered_scholar.GetSheHe] จรดหมึกลงบนกระดาษ, แต่ละฝีแปรงไหลลื่นต่อกันจนถ้อยคำปรากฏเป็นรูปลักษณ์อันสง่างาม [stop_host_scope.GetTitleAsNameNoTooltip] มองข้าอย่างตั้งใจ "[ROOT.Char.Custom('FormOfAddressForLiege')], การตัดสินของท่านมีน้ำหนักอย่างยิ่ง ท่านจะให้เกียรติศิลปินของเราโดยการกล่าวคำตัดสินของท่านต่อหน้าพวกเราทุกคนได้หรือไม่?"\n\n"
 az_tour.1008.desc.praise_subtle: "ข้าสังเกตเห็นความสมดุลอันระมัดระวังและการเคลื่อนไหวที่ลื่นไหลของ แต่ละฝีแปรง งานเขียนให้ความรู้สึกถึงความตั้งใจ, การไตร่ตรอง—ทักษะที่จับคู่กับเจตนาอันลึกซึ้ง"
 az_tour.1008.desc.arrogant_judgment: "สายตาของข้าจับจ้องไปที่ความแม่นยำของตัวอักษร, แต่กระนั้นก็รู้สึกว่ามีบางอย่างถูกควบคุมมากเกินไป, เกือบจะจงใจเกินไป มันขาดความอบอุ่นหรือความเป็นธรรมชาติ"
 az_tour.1008.desc.shy_discomfort: "ม้วนภาพนั้นงดงาม, แต่ความตึงเครียดอันเงียบงันก็ปกคลุมไปในอากาศ ข้ากล่าวถ้อยคำสั้น ๆ และระมัดระวัง, ไม่แน่ใจว่าควรเปิดเผยมากเพียงใด"
 az_tour.1008.desc.generic_comment: "เส้นสายชัดเจนและเว้นระยะห่างเท่ากัน ข้าให้ความเห็นอย่างสงวนท่าที, ระมัดระวังที่จะไม่พูดเกินความเข้าใจของข้า"
 az_tour.1008.a: ""การแสดงอันเชี่ยวชาญ: ลุ่มลึก, สมดุล, มีชีวิตชีวา""
 az_tour.1008.a.toast: "[visiting_liege.GetTitleAsNameNoTooltip] กล่าวชื่นชมการสาธิตอย่างสูง"
 az_tour.1008.b: ""งานที่เรียบร้อย, แม้จะ... บ้านนอก ไปหน่อย""
 az_tour.1008.b.toast: "[visiting_liege.GetTitleAsNameNoTooltip] เยาะเย้ยการสาธิต"
 az_tour.1008.c: ""รูปแบบนั้นน่าชื่นชม, แต่ข้าต้องพิจารณาถึงจิตวิญญาณด้วย""
 az_tour.1008.c.toast: "[visiting_liege.GetTitleAsNameNoTooltip] ยกย่องการสาธิต"
 az_tour.1008.d: ""อภัยให้ข้าด้วย ข้ามีธุระอื่นที่ต้องจัดการ""
 az_tour.1008.d.toast: "[visiting_liege.GetTitleAsNameNoTooltip] ปฏิเสธที่จะตัดสินการสาธิต"

 az_tour.0009.t: "เราควรจะเต้นรำหรือไม่?"
 az_tour.0009.desc: "ฤดูกาลนี้สอดคล้องกับประเพณีท้องถิ่น: นักเต้นสวมหน้ากาก, สวมใส่ผ้าและกระดาษแวววาว, ทำการเต้นรำโบราณหน้าแท่นบูชาโบราณ มันเป็นแบบชนบท — เสียงดัง, สว่างไสว, วุ่นวาย — แต่ก็เป็นที่รัก\n\n[chancellor.Custom2('MyCharacterIntroduction', ROOT.Char)|U] เข้ามาอย่างเงียบ ๆ "[visiting_liege.Custom2('MyCharacterIntroduction', chancellor)|U] จะมาถึงในไม่ช้า บางทีการแสดงนี้อาจ ทำให้ [visiting_liege.GetHerHim] พอใจได้? มันอาจจะต่ำต้อย, แต่ก็จริงใจ — เป็นการเหลือบมองเข้าไปในจิตวิญญาณของผู้คน"\n\nมันเป็นข้อคิดเห็นที่ดี, แต่เวลาของเรานั้นสั้นและมีค่า..."
 az_tour.0009.a: "ให้พวกเขาเตรียมการเต้นรำ"
 az_tour.0009.a.tt: "ท่านจะได้รับรางวัลขึ้นอยู่กับความเห็นของเจ้าเหนือหัวของท่านที่มีต่อการเต้นรำ"
 az_tour.0009.b: "เวลาของเราควรใช้ไปกับการหารือเรื่องหน้าที่ของเราจะดีที่สุด"

 az_tour.1009.t: "การเต้นรำพื้นบ้าน"
 az_tour.1009.desc: "เสียงกลองดังกระหึ่มราวกับกีบม้า, เสียงหัวเราะดังระลอกไปทั่วฝูงชน ใต้ธงที่ปลิวไสวและกลิ่นกำยาน, ชาวบ้านที่สวมใส่ชุดผ้าไหมสีสดใสและชุดม้ากระดาษ กระโดดและหมุนตัวในการเต้นรำพื้นบ้านโบราณ\n\n[stop_host_scope.Custom2('MyCharacterIntroduction', ROOT.Char)|U] ได้เชิญข้ามาเป็นสักขีพยานในการเฉลิมฉลองอันมีชีวิตชีวาของมรดก [ROOT.Char.GetCurrentLocation.GetCulture.GetNameNoTooltip] นี้ [stop_host_scope.GetSheHe|U] ยืนอยู่ใกล้ ๆ, ความภาคภูมิใจฉายชัดในรอยยิ้มของ [stop_host_scope.GetHerHis] ขณะที่นักเต้นคนหนึ่งโค้งคำนับต่ำต่อหน้าข้า, ข้ารับรู้ถึงความเคารพที่จ่ายให้กับตำแหน่งของข้าและความไว้วางใจที่พวกเขามีต่อการตัดสินของข้า"
 az_tour.1009.a: "ข้าเข้าหานักเต้นเพื่อเป็นเกียรติแก่พวกเขา"
 az_tour.1009.a.toast: "[visiting_liege.GetTitleAsNameNoTooltip] ให้เกียรติการเต้นรำ"
 az_tour.1009.b: "ของขวัญเล็กน้อย, เพื่อเป็นเกียรติแก่งานศิลปะของพวกเขา"
