l_english: 
 hunt_events_anna.0001.t: "หยั่งรากลึก"
 hunt_events_anna.0001.desc: "ต้นโอ๊กขนาดมหึมาแผ่กิ่งก้านสาขาอันสง่างาม ปกคลุมทุกสิ่งเบื้องล่างด้วยเงามืด การแหงนมองกิ่งก้านเหล่านั้นทำให้ข้าหวนนึกถึงราชวงศ์ต่างๆ ที่รุ่งเรืองและดับสูญ ทั้งผู้ที่มาก่อนหน้าข้า และผู้ที่จะสืบทอดมรดกของข้าต่อไปเมื่อข้าจากไปแล้ว\n\nเมื่อข้าเข้าใกล้มากขึ้น ข้าก็สังเกตเห็นรอยสลักชื่อย่อหลายแห่งบนเปลือกไม้ เป็นดั่งเครื่องเตือนใจอันอ่อนโยนว่าผู้คนล้วนผ่านมาและผ่านไปตามยุคสมัย และบุคคลที่ข้าปรารถนาจะให้ร่วมสืบทอดมรดกด้วยนั้น ก็คือทุกสิ่งทุกอย่างของข้า [love_interest.GetFirstName]"
 hunt_events_anna.0001.a: "สลักชื่อย่อของ [love_interest.GetFirstNameNoTooltip] ลงบนเปลือกไม้"
 hunt_events_anna.0001.b: "ไม่มีเวลาสำหรับเรื่องไร้สาระเช่นนี้หรอก!"
 hunt_events_anna.0001.b.t_toast: "การล่าสัตว์คือเป้าหมายหลักของข้า"
 
 hunt_events_anna.0005.t: "ทิ่มแทงใจ"
 hunt_events_anna.0005.desc: "การพักผ่อนเพียงครู่ของข้าถูกขัดจังหวะด้วยเสียงหัวเราะเยาะเย้ยที่ดังมุ่งตรงมาทางข้า ข้าเงยหน้าขึ้น และก็ไม่แปลกใจนักที่ได้รับการทักทายด้วยรอยยิ้มกว้างจาก [mocking_participant.GetFirstName] ขณะที่ในมือของ[mocking_participant.GetHerHis]ถือสิ่งที่ดูเหมือนจะเป็นซากศพของ[ROOT.Char.Custom('SmallAnimal')]\n\n"ข้าไม่เคยคิดเลยว่าท่านจะเป็นผู้ที่สามารถเอาตัวรอดได้ตามลำพังในป่ากว้าง ข้าจึงคิดว่าท่านคงต้องการการฝึกฝนสักหน่อย," [mocking_participant.GetSheHe|U] กล่าวด้วยน้ำเสียงเย้ยหยัน พลางโยนซากสัตว์นั้นลงแทบเท้าข้า"
 hunt_events_anna.0005.a: "พยายามถลกหนังซากสัตว์"
 hunt_events_anna.0005.a.toast.good: "ข้าถลกหนังสัตว์ได้สำเร็จ"
 hunt_events_anna.0005.a.toast.nothing: "เศษซากที่เหลืออยู่แทบดูไม่ออกว่าเป็นอะไร"
 hunt_events_anna.0005.b: "ฝึกฝนหรือ? ถ้านั่นคือความประสงค์ของท่าน ข้าก็ไม่ขัดข้อง..."
 hunt_events_anna.0005.c: "ไม่ใช่หน้าที่ของข้าที่จะต้องมาทำเรื่องต่ำต้อยเช่นนี้"
 
 hunt_events_anna.0010.t: "ติดกับเบื้องล่าง"
 hunt_events_anna.0010.desc: "ข้าตามรอยเหยื่อของข้าผ่าน [ROOT.Char.GetCurrentLocation.Custom('GetTerrainTypePlural')] ด้วยฝีเท้าที่หนักหน่วงและไม่มั่นคง จดจ่ออยู่กับการรักษาจังหวะ เสียงหักดังเป๊าะดังก้องกังวานในหู ข้ารู้สึกถึงความเบาหวิวที่เกิดขึ้นอย่างกะทันหัน และความรู้สึกวาบหวามลึกลงไปในท้อง การร่วงหล่นหยุดลง พร้อมกับความเจ็บปวดแผดเผาแล่นพล่านไปทั่วร่างจากแรงกระแทก\n\nเมื่อข้าพยายามกวาดสายตามองไปรอบๆ อย่างเจ็บปวด สิ่งที่ข้าเห็นมีเพียงกำแพงทั้งสี่ด้านที่ล้อมรอบตัว ข้าตกลงมาในหลุมพราง และข้าต้องหาทางปีนกลับขึ้นไปให้ได้"
 hunt_events_anna.0010.a: "ปีนออกไปจากหลุม"
 hunt_events_anna.0010.a.desc.good: "ข้าปีนออกมาได้สำเร็จ"
 hunt_events_anna.0010.a.toast.good: "ข้าสามารถอดทนต่อความเจ็บปวดและหนีออกมาได้"
 hunt_events_anna.0010.a.toast.bad: "ข้าสะดุดล้มอีกครั้งและได้รับบาดเจ็บในระหว่างนั้น"
 hunt_events_anna.0010.a.desc.bad: "ข้าลื่นตกลงไปในหลุมอีกครั้ง"
 hunt_events_anna.0010.b: ""มีใครอยู่ข้างบนบ้างไหม?!""
 hunt_events_anna.0010.b.flavor: "คณะล่าสัตว์หยุดการล่าและหันมาช่วยเหลือข้าแทน"
 
 hunt_events_anna.0015.t: "สูดหายใจเข้า... ผ่อนหายใจออก"
 hunt_events_anna.0015.desc: "เสียงตุบตับแปลกๆ เสียงพึมพำต่ำๆ และเสียงถอนหายใจเป็นระยะดังก้องไปทั่วลานโล่ง ร่างหนึ่งที่ถือคันธนูเดินวนไปมา ดูเหมือนจะหงุดหงิดกับอะไรบางอย่าง\n\nเพื่อให้เห็นชัดขึ้น ข้าจึงซ่อนตัวอยู่หลังต้นไม้และแอบมอง ข้าเห็น [child_with_bow.GetFirstName] [child_with_bow.Custom('GetDaughterSon')]ของข้า ท่ามกลางลูกธนูสองสามดอกที่กระจัดกระจายอยู่บนพื้น ซึ่งลูกธนูเหล่านั้นแทบจะไม่เฉียดเป้าหมายที่[child_with_bow.GetSheHe]ตั้งไว้เลย ดูเหมือนว่า[child_with_bow.GetSheHe]น่าจะต้องการคำแนะนำสักหน่อย"
 hunt_events_anna.0015.a: ""มานี่สิ ข้าจะแสดงให้ดู...""
 hunt_events_anna.0015.a.flavor: "ในฐานะนายพรานผู้เชี่ยวชาญ ข้าน่าจะสามารถใช้ความชำนาญของตนเองให้คำแนะนำเรื่องท่าทางและความแม่นยำที่ดีขึ้นแก่[child_with_bow.GetHerHim]ได้"
 hunt_events_anna.0015.a.toast.good: "[child_with_bow.GetFirstNameNoTooltip] ทำตามคำแนะนำของข้า"
 hunt_events_anna.0015.a.toast.bad: "[child_with_bow.GetFirstNameNoTooltip] ไม่เข้าใจคำแนะนำของข้า"
 hunt_events_anna.0015.b: "แสดงความสนับสนุนด้วยการให้กำลังใจ[child_with_bow.GetHerHim]"
 hunt_events_anna.0015.c: "ปล่อยให้ [child_with_bow.GetFirstNameNoTooltip] หาวิธีเอาเอง"
 hunt_events_anna.0015.c.toast: "[child_with_bow.GetFirstNameNoTooltip] ค้นพบวิธีใช้งานคันธนูด้วยตัวเอง"
 
