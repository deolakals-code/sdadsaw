l_english: 
 childhood.7000.t:0 "แกล้ง [stolen_clothes.GetFirstNameNoTooltip]"
 childhood.7000.desc:0 "[ROOT.Char.Custom2('RelationToMe', SCOPE.sC('stolen_clothes'))] ของข้า [stolen_clothes.GetFirstName] ดูท่าทาง... #EMP อุดอู้#! ไปหน่อยนะ! [stolen_clothes.GetSheHe|U] เอาจริงเอาจังกับทุกเรื่องเกินไป จัดการเรื่องราวในราชสำนักวันแล้ววันเล่า บางทีข้าควรจะ #EMP ทำให้#! บรรยากาศมันผ่อนคลายลงบ้าง?\n\n"
 childhood.7000.desc_child:0 "ข้ารู้ว่า [child_helper.GetFirstName] คงอยากช่วยข้าดำเนิน #EMP แผนการร้ายกาจ#! นี้แน่ หากข้าเรียกหา [child_helper.GetHerHim]\n\n"
 childhood.7000.desc_end:0 "ข้าสงสัยว่า [stolen_clothes.GetFirstNameNoTooltip] จะมีปฏิกิริยาอย่างไรหากเสื้อผ้า [stolen_clothes.GetHerHis]... 'หายไป'? #EMP *คิกคัก*#!"
 childhood.7000.a:0 "ข้าจะย่องเข้าไปในห้อง [stolen_clothes.GetHerHis] แล้วฉกเสื้อผ้า [stolen_clothes.GetHerHis] มา!"
 childhood.7000.b:0 "[child_helper.GetFirstNameNoTooltip] เบี่ยงเบนความสนใจ [stolen_clothes.GetHerHim] ที #EMP ไปกันเลย!#!"
 childhood.7000.c:0 "ไม่สิ ข้าควรทำตัวดีๆ พักผ่อนบ้างเถอะ [stolen_clothes.GetFirstNameNoTooltip]"
 childhood.7000.d:0 "อืม ยังไม่ใช่เวลาที่เหมาะสม..."
 childhood.7000.a.success:0 "เจ้าขโมยเสื้อผ้าสำเร็จ"
 childhood.7000.a.failure:0 "[stolen_clothes.GetSheHe|U] จับเจ้าได้คาหนังคาเขา"
 childhood.7001.desc_helper:0 "สำเร็จ! [child_helper.GetFirstName] เบี่ยงเบนความสนใจ [stolen_clothes.GetFirstName] โดยปล่อย [ROOT.Char.Custom('GetLivestockFowlIndef')] เข้าไปในห้องนอน [stolen_clothes.GetHerHis] เมื่อเช้านี้ – ขณะเดียวกันข้าก็ฉกฉวยเสื้อผ้าทุกชิ้นที่หาเจอ!"
 childhood.7001.desc_nohelper:0 "สำเร็จ! ข้าแอบย่องเข้าไปในห้องนอนของ [stolen_clothes.GetFirstNamePossessiveNoTooltip] และคว้าเสื้อผ้า [stolen_clothes.GetHerHis] ทั้งหมดก่อนที่ [stolen_clothes.GetSheHe] จะตื่นได้สำเร็จ! "
 childhood.7001.desc_angry:0 "[stolen_clothes.GetFirstNameNoTooltip] ลุกขึ้นด้วยความโกรธและวิ่งไล่ตามไปตามทางเดิน โดยไม่มีเสื้อผ้าติดกาย[stolen_clothes.GetHerHis]แม้ แต่ชิ้นเดียว!\n\n"เจ้าเด็กน่ารำคาญ! ส่งเสื้อผ้าข้ามาเดี๋ยวนี้ มิฉะนั้นข้าจะบิดคอเจ้า!" [stolen_clothes.GetSheHe|U] กรีดร้อง พ่นลมหายใจฟึดฟัดทางจมูก\n\n[stolen_clothes.GetFirstNameNoTooltip] อาจไม่ชอบการแกล้งอันชาญฉลาดของข้า แต่คนอื่นๆ คิดว่ามัน #EMP ตลกขบขันอย่างยิ่ง!#!"
 childhood.7001.desc_funny:0 "[stolen_clothes.GetFirstNameNoTooltip] ลุกขึ้นอย่างรวดเร็วและวิ่งไล่ตามไปตามทางเดิน โดยไม่มีเสื้อผ้าติดกาย[stolen_clothes.GetHerHis]แม้ แต่ชิ้นเดียว!\n\n"เด็กน้อย! เอาเสื้อผ้าข้าคืนมา ข้าไม่มีเวลามาเล่นด้วย!" [stolen_clothes.GetSheHe|U] ตะโกน วิ่งไปตลอดทางจนถึงห้องโถงใหญ่ก่อนจะหยุดและตระหนักว่า[stolen_clothes.GetSheHe]ได้ทำอะไรลงไป!\n\nทุกคน รวมถึง [stolen_clothes.GetFirstNameNoTooltip] พบว่าสถานการณ์นี้ #EMP ตลก#! มาก และหัวเราะจนหน้าแดง"
 childhood.7001.a:0 "แล้วข้าจะทำอีก! อีก! และ #EMP อีก!#!"
 childhood.7001.b:0 "ข้าคงทำไม่ได้หากไม่มีเจ้า [child_helper.GetFirstNameNoTooltip]!"
 childhood.7001.c:0 "การแกล้งที่ดีมีประโยชน์ไปอีกนาน!"
 childhood.7002.desc_helper:0 "แย่แล้ว! [child_helper.GetFirstName] กำลังจะปล่อย [ROOT.Char.Custom('GetLivestockFowlIndef')] เข้าไปในห้องนอนของ [stolen_clothes.GetFirstNamePossessiveNoTooltip] แต่มันกลับทรยศเรา! มันส่งเสียงร้องดังลั่นเมื่อเราเข้าไป และ [stolen_clothes.GetFirstNameNoTooltip] ก็กระโดดออกจากเตียงทันที เห็นเราเข้าพอดี\n\n"
 childhood.7002.desc_nohelper:0 "ให้ตายสิ! ขณะที่ข้าย่องเข้าไป ตาของ [stolen_clothes.GetFirstNamePossessive] ก็เบิกโพลง และ [stolen_clothes.GetSheHe] ก็กระโดดออกจากเตียง!\n\n"
 childhood.7002.desc_angry:0 "[stolen_clothes.GetSheHe|U] เอื้อมหยิบหม้อถ่ายที่เต็มเปี่ยม [stolen_clothes.GetHerHis] อย่างคล่องแคล่ว ขว้างมันมาด้วยความแม่นยำอย่างเหลือเชื่อ ด้วยเสียง #flatulence ดังผลัวะ#! ข้าเปรอะเปื้อนไปด้วยสิ่งที่ข้าสันนิษฐานได้ว่าเป็นของเสียที่สะสมมา #EMP หลายคืน#! \n\n"นี่คือบทเรียนสำหรับการรบกวนข้า! ออกไปจากที่นี่ ไม่งั้นมีมากกว่านี้แน่!" [stolen_clothes.GetSheHe|U] กรีดร้อง"
 childhood.7002.desc_funny:0 ""ฟังนะ!" [stolen_clothes.GetFirstNameNoTooltip] พูดพลางบิดหูข้าแน่น "เจ้าจะเที่ยวขโมยเสื้อผ้าคนอื่นไม่ได้! ข้าคิดว่าเจ้าสมควรได้รับบทเรียนเรื่องมารยาทได้แล้ว..."\n\nโอ้ ไม่นะ ไม่ใช่ #EMP มารยาท!#!"
 childhood.7002.a:0 "#EMP ไม่! อี๋!#!"
 childhood.7002.b:0 "เรื่องแบบนี้จะไม่เกิดขึ้นอีก สัญญา!"
 childhood.7002.c:0 "มันเป็นความคิดของ [child_helper.GetFirstNamePossessiveNoTooltip] #EMP ทั้งหมด#! เลย!"
 bully_stops:0 "[bully.GetFirstName] เลิกแกล้งเจ้า"
 skill_increased:0 "ทักษะเพิ่มขึ้น"
 funny_opinion:0 "ตลก"
 
 childhood.7100.t:0 "ภาพอันน่าสะเทือนขวัญ"
 childhood.7100.desc:0 "ขณะที่ข้ากำลังเล่นอยู่ในลาน ข้าเห็น [child_to_annihilate.GetFirstName] กำลังเล่นกับเด็กคนอื่นๆ\n\n"
 childhood.7100.killed_by_sow:0 "ทันใดนั้น ขณะที่ [child_to_annihilate.GetFirstNameNoTooltip] วิ่งเล่นผ่านคอกหมูใกล้ๆ แม่หมูตัวใหญ่ก็งับเข้าที่แขน [child_to_annihilate.GetHerHis] มันไม่ยอมปล่อย ข้าหันหน้าหนีเมื่อเสียงกรีดร้องดังขึ้นเรื่อยๆ จนกระทั่งเงียบไปในที่สุด\n\n"
 childhood.7100.kicked_by_horse:0 "โดยไม่คาดคิด ขณะที่ [child_to_annihilate.GetSheHe] เดินเฉียดม้าตัวหนึ่ง มันก็ดีดตัวขึ้น [child_to_annihilate.GetFirstNameNoTooltip] กระเด็นไปหลายเมตร นอนจมกองเลือดแน่นิ่งอยู่บนพื้น\n\n"
 childhood.7100.kicked_by_camel:0 "โดยไม่คาดคิด ขณะที่ [child_to_annihilate.GetSheHe] เดินเฉียดอูฐตัวหนึ่ง มันก็ดีดตัวขึ้น [child_to_annihilate.GetFirstNameNoTooltip] กระเด็นไปหลายเมตร นอนจมกองเลือดแน่นิ่งอยู่บนพื้น\n\n"
 childhood.7100.stomped_by_elephant:0 "โดยไม่คาดคิด ขณะที่ [child_to_annihilate.GetSheHe] เดินเฉียดช้างตัวหนึ่ง มันก็ชูงวงร้องเสียงดังลั่น ช้างกระทืบเท้าใหญ่มหึมาลงบน [child_to_annihilate.GetFirstNameNoTooltip] บดขยี้ [child_to_annihilate.GetHerHim] ลงกับพื้น\n\n"
 childhood.7100.smashed_by_roof_tile:0 "ขณะที่ [child_to_annihilate.GetSheHe] เดินผ่านใต้อาคารใกล้ๆ กระเบื้องหลังคาแผ่นหนักก็หลุดลงมาทันที ด้วยเสียงดัง #EMP ตุ้บ#! มันกระแทกศีรษะของ [child_to_annihilate.GetFirstNamePossessiveNoTooltip] ทำให้ [child_to_annihilate.GetHerHim] ล้มลงทันที\n\n"
 childhood.7100.desc_end:0 "ความเงียบงันในฉับพลันถูกแทนที่ด้วยเสียงกรีดร้องด้วยความหวาดกลัวของผู้เห็นเหตุการณ์ [ROOT.Char.GetFaith.HighGodName] ปล่อยให้เรื่อง เช่นนี้เกิดขึ้นได้อย่างไร!?"
 death_sow:0 "ถูกแม่หมูกัดตาย"
 death_horse:0 "ถูกม้าดีดตาย"
 death_camel:0 "ถูกอูฐดีดตาย"
 death_roof_tile:0 "ศีรษะ [CHARACTER.GetHerHis] ยุบ เพราะกระเบื้องหลังคาหล่นใส่"
 childhood.7100.a:0 "ม.. อะไรนะ!? ม.. ไม่!"
 childhood.7100.b:0 "...#DIE1 ฮ่า#!ฮ่าฮ่า! พวกเจ้าเห็นนั่นไหม!"
 childhood.7100.c:0 "เฉยๆ"
 childhood.7100.d:0 "ช.. ช่วยกอดข้าสักพักได้ไหม [friend_to_comfort.GetFirstNameNoTooltip]?"
 childhood.7100.d.friend:0 "เพื่อนของเจ้า [friend_to_comfort.GetFirstNameNoTooltip] พยายามปลอบโยนเจ้าอย่างสุดความสามารถ [friend_to_comfort.GetHerHis]"
 
 childhood.7200.t:0 "กำแพงภาษา"
 childhood.7200.desc:0 "ข้าชอบเล่นกับ [language_friend.GetFirstName] มาก แต่บางครั้งก็ยากที่จะเข้าใจสิ่งที่ [language_friend.GetSheHe] พูด...\n\nแม้ว่าการสื่อสารด้วยท่าทางมือและสีหน้าก็พอทำได้ แต่ข้ารู้สึกว่ามันคงจะสนุกมากถ้าข้าสามารถพูดภาษา [language_friend.GetCulture.GetLanguage.GetNameNoTooltip] กับ [language_friend.GetHerHim] ได้!\n\nบางทีข้าควรตั้งใจเรียน เพื่อเห็นแก่ [language_friend.GetFirstNamePossessiveNoTooltip]?"
 childhood.7200.a:0 "ข้าจะเรียนทั้งวันทั้งคืน!"
 childhood.7200.b:0 "อืม ข้าจะให้คนรับใช้อ่านนิทานภาษา [language_friend.GetCulture.GetLanguage.GetNameNoTooltip] ให้เราฟัง"
 childhood.7200.c:0 "ไม่ มันเหนื่อยเกินไป แล้วยังมี #EMP การเล่น#! ที่ต้องทำอีก!"
 entertained_opinion:0 "เพลิดเพลิน"
 
 childhood.7300.t:0 "'เตรียมพร้อม' สำหรับอนาคต"
 childhood.7300.desc:0 "อีกไม่นานข้าจะได้ปกครองจริงๆ – โดยไม่มีผู้ปกครองจู้จี้และครูที่รู้ไปหมดคอยดูแล... และเมื่อถึงเวลานั้น ข้าต้องแน่ใจว่าข้าควบคุมข้าราชบริพารของข้าได้อยู่หมัด\n\n[beating_target_1.GetTitledFirstName] นั้นอ่อนแอและขี้ขลาด ข้ามั่นใจว่าการแสดงตนอันน่าเกรงขามของข้าจะสร้างแรงบันดาลใจให้ [beating_target_1.GetHerHim]... #EMP ภักดี#! ในอนาคต\n\n"
 childhood.7100.beating_target_2:0 "หรือบางที [beating_target_2.GetTitledFirstName] อาจคู่ควรกับความสนใจของข้ามากกว่า? [beating_target_1.GetSheHe|U] ก็อ่อนแอ เช่นกัน\n\n"
 childhood.7100.beating_target_3:0 "แล้วก็ยังมี [beating_target_3.GetTitledFirstName] ผู้น่าสมเพชอยู่เสมอ ข้าแค่ #EMP จ้อง#! [beating_target_3.GetHerHim] ให้กลัวก็พอ! "
 childhood.7300.desc_end:0 "ตัวเลือก ตัวเลือก..."
 childhood.7300.a:0 "[beating_target_1.GetFirstNameNoTooltip] ให้ข้าแนะนำเจ้าให้รู้จักกับหมัดของข้า!"
 childhood.7300.b:0 "มานี่สิ [beating_target_2.GetFirstNameNoTooltip]..."
 childhood.7300.c:0 "ไม่มีเรื่องส่วนตัวนะ [beating_target_3.GetFirstNameNoTooltip] มันเป็นแค่เรื่องธุรกิจ"
 childhood.7300.d:0 "นี่มันต่ำกว่าศักดิ์ศรีข้า..."
 childhood.7300.a.success:0 "เจ้าข่มขู่ [beating_target_1.GetFirstNameNoTooltip] สำเร็จ"
 childhood.7300.a.failure:0 "เจ้าข่มขู่ [beating_target_1.GetFirstNameNoTooltip] ไม่สำเร็จ"
 childhood.7300.b.success:0 "เจ้าข่มขู่ [beating_target_2.GetFirstNameNoTooltip] สำเร็จ"
 childhood.7300.b.failure:0 "เจ้าข่มขู่ [beating_target_2.GetFirstNameNoTooltip] ไม่สำเร็จ"
 childhood.7300.c.success:0 "เจ้าข่มขู่ [beating_target_3.GetFirstNameNoTooltip] สำเร็จ"
 childhood.7300.c.failure:0 "เจ้าข่มขู่ [beating_target_3.GetFirstNameNoTooltip] ไม่สำเร็จ"
 
 childhood.7400.t:0 "ผู้พิทักษ์จากอันธพาล"
 childhood.7400.desc:0 "แย่แล้ว... [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('bully'))] [bully.GetFirstName] ของข้ามาอีกแล้ว ข้าเพียงแค่อยากเล่นอย่างสงบสุข เหตุใด[bully.GetSheHe]จึงไม่ปล่อยข้าไปเสียที!\n\n"เจ้ากำลังทำอันใด, #EMP [ROOT.Char.Custom2('InsultNoun', SCOPE.sC('bully'))]!#!" [bully.GetFirstNameNoTooltip] ตะโกนใส่หน้าข้า"
 childhood.7400.desc_2:0 "\n\nทันใดนั้น มีคนแตะไหล่ข้า " [bully.GetSheHe] รบกวนเจ้ารึ?" [bodyguard.GetFirstName] องครักษ์ของข้า กล่าวด้วยน้ำเสียงสงบ "ให้ข้าสอนมารยาท [bully.GetHerHim] หน่อยไหม?""
 childhood.7400_father_dead:0 ""เจ้ามัน[ROOT.Char.Custom2('InsultAdjective'), bully] [ROOT.Char.Custom2('InsultNoun', SCOPE.sC('bully'))]โสโครก! โอ้, แล้วก็... บิดาของเจ้าตายแล้ว! ฮ่า-ฮ่า!""
 childhood.7400_mother_dead:0 ""เจ้ามัน[ROOT.Char.Custom2('InsultNoun', SCOPE.sC('bully'))]น่ารังเกียจ! โอ้, แล้วก็... มารดาของเจ้าตายแล้ว! ฮ่า-ฮ่า!""
 childhood.7400_none_dead:0 ""เจ้ามัน[ROOT.Char.Custom2('InsultNoun', SCOPE.sC('bully'))]เน่าเฟะ, มิมีผู้ใดอยากเล่นกับเจ้า!""
 childhood.7400.a:0 "ต่อจากนี้ไปเจ้าต้องทำตามที่ข้าสั่ง เข้าใจไหม?"
 childhood.7400.b:0 "[bodyguard.GetFirstNameNoTooltip] สั่งสอน [bully.GetHerHim] หน่อย!"
 childhood.7400.c:0 "เจ้าต้องเรียนรู้วิธีทำตัวดีๆ"
 every_parent_of_bully:0 "ผู้ปกครองทุกคนของ [bully.GetFirstName]"
 
 childhood.7500.t:0 "เรื่องเล่าจากอดีต"
 childhood.7500.desc:0 ""เข้ามาใกล้ๆ ข้ามีเรื่องจะเล่าให้ฟัง" [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('guardian'))] ของข้า [guardian.GetTitledFirstName] กล่าว พลางกวักมือเรียกข้าไปที่กองไฟ\n\n"
 childhood.7500.participant:0 ""เป็นเรื่องราวเมื่อครั้ง [guardian_memory.GetDescription] ใช่ [guardian.Custom2('RelationToMe', SCOPE.sC('memory_participant'))] ของข้า...""
 childhood.7500.participant_dead:0 ""เป็นเรื่องราวเมื่อครั้ง [guardian_memory.GetDescription] [memory_participant.GetSheHe|U] คือ [guardian.Custom2('RelationToMe', SCOPE.sC('memory_participant'))] ของข้า ผู้ ซึ่ง [memory_participant.GetDeathReason]...""
 childhood.7500.no_participant:0 ""เป็นเรื่องราวเมื่อครั้ง [guardian_memory.GetDescription]...""
 childhood.7500.midpoint:0 "[guardian.GetFirstNameNoTooltip] [ROOT.Char.Custom2('QuirkPresentPosOrNeg', SCOPE.sC('guardian'))] และเล่าเรื่องต่อไปขณะที่เปลวไฟจากกองไฟเลียท้องฟ้ายามค่ำคืน"
 childhood.7500.family:0 "\n\n"...จงจำความสำคัญของครอบครัวเจ้าไว้ [ROOT.Char.GetFirstNameNoTooltip] จงภูมิใจในนามแห่งตระกูล [ROOT.Char.GetHouse.GetNameNoTooltip] #EMP [ROOT.Char.GetHouse.GetMotto].#!""
 childhood.7500.martial:0 "\n\n"...ฝึกฝนทักษะ ความเก่งกาจ และไหวพริบในการรบให้เฉียบคม [ROOT.Char.GetFirstNameNoTooltip] เจ้าจะมีศัตรูมากมายนับไม่ถ้วน จงฝึกฝนเพื่อเอาชนะพวกเขาให้ได้"
 childhood.7500.death:0 "\n\n"...[ROOT.Char.GetFirstNameNoTooltip] ที่รัก จงจำคติสอนใจจากเรื่องของข้า ความตายมาเยือนเราทุกคน – จงแน่ใจว่ามันมาเยือนศัตรูของเจ้าก่อนที่จะมาเยือนเจ้า"
 childhood.7500.war:0 "\n\n"...ความโหดร้ายของสงครามจะทดสอบความกล้าหาญของ [ROOT.Char.GetWomanMan] ทุกคน จำไว้ กลยุทธ์ที่แท้จริงต้องใช้ความหลักแหลม [ROOT.Char.GetFirstNameNoTooltip]"
 childhood.7500.relationships:0 "\n\n"...ผู้คนรอบตัวเจ้า เพื่อน ที่ปรึกษา แม้กระทั่งคู่แข่ง – พวกเขาคือคนสำคัญ จงให้พวกเขาอยู่ใกล้ตัว โดยเฉพาะศัตรูของเจ้า"
 childhood.7500.childhood:0 "\n\n"...เรื่องราวจากวัยเด็กของข้าเอง! โอ ข้ารู้สึกแก่เหลือเกิน"
 childhood.7500.a:0 "ช่างเป็นเรื่องเล่าที่ยอดเยี่ยม [guardian.GetFirstNameNoTooltip]"
 childhood.7500.b:0 "#DIE2 ...คร่อก#!#DIE1 ฟี้#!ซซซ"
 culture_tradition_events.2100.t:0 "เรื่องเล่าข้างกองไฟ"
 culture_tradition_events.2100.b:0 "เรื่องเล่าของท่าน ทำให้ข้ารู้สึกดีขึ้นเสมอ จริงๆ"
