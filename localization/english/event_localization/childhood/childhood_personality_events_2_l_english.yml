l_english: 
 child_personality.7000.t:0 "ถังไม้ที่ถูกขโมย"
 child_personality.7000.desc:0 ""ดูสิว่าข้าเจออะไร [child.GetFirstNameNoTooltip] – ถัง[ROOT.GetCharacter.Custom('RegionalAlcoholicDrink')]ทั้งใบเลย! ข้าหยิบมันมาตอนที่พวกคนครัวเผลอ" [other_child.GetFirstName] พูดกับข้า แววตา[other_child.GetHerHis]ดูเจ้าเล่ห์\n\n"เจ้ารออะไรอยู่ล่ะ? มาดื่มให้หมดก่อนที่จะมีใครสังเกตว่ามันหายไป!" [other_child.GetSheHe|U] ร้องออกมา\n\nข้อเสนอที่น่าดึงดูดใจ... แต่มันถูกต้องหรือไม่?"
 child_personality.7000.a:0 "ส่งมันมานี่ – ข้าจะเอาทุกอย่างกลับไปไว้ที่เดิมด้วยตัวเอง"
 child_personality.7000.b:0 "เจ้าเป็นเพื่อนแท้จริงๆ [other_child.GetFirstNameNoTooltip] หมดแก้ว!"
 child_personality.7000.c:0 "โอ้ นี่ไม่ใช่สำหรับข้า แต่เจ้าดื่มไปเถอะ"
 child_personality.7001.t:0 "$child_personality.7000.t$"
 child_personality.7001.desc:0 ""ข้าจับสองคนนี้ได้ขณะซ่อนตัวอยู่ในห้องเก็บอาหาร!" คนครัวที่โกรธจัดตะโกนใส่ข้า ลาก[ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('child'))]ของข้า [child.GetFirstName] และ [other_child.GetFirstName] ตามมา\n\n"
 child_personality.diligent.desc:0 ""[other_child.GetFirstNameNoTooltip] ขโมยถัง[ROOT.GetCharacter.Custom('RegionalAlcoholicDrink')]มา#EMP ทั้ง#!ใบ! [child.GetFirstNameNoTooltip] พยายามจะเอามันกลับไปคืนด้วย[child.GetHerselfHimself]ก่อนที่ข้าจะสังเกตเห็น – แต่โชคไม่เข้าข้าง[child.GetHerHim]!" [cook.GetSheHe|U] พูดอย่างโกรธเคือง\n\nดูเหมือนว่าผู้อยู่ในอุปถัมภ์ของข้าจะเป็นตัวป่วนเล็กน้อย แต่ก็เป็นคนที่เปลี่ยนใจได้!"
 child_personality.gregarious.desc:0 ""พวกเขาขโมยถัง[ROOT.GetCharacter.Custom('RegionalAlcoholicDrink')]มา#EMP ทั้ง#!ใบ และดื่มไปเกือบหมด ตอนนี้ดูพวกเขาซิ – เมาเหมือนขุนนางทั้งคู่เลย! แทบจะยืนไม่ไหว..." [cook.GetSheHe|U] พูดอย่างโกรธเคือง\n\nดูเหมือนว่าผู้อยู่ในอุปถัมภ์ของข้าจะยอมตามแรงกดดันจากเพื่อน แต่ดูเหมือนว่าอย่างน้อย[child.GetSheHe]และ[other_child.GetFirstNameNoTooltip]ก็สนิทกันเหมือนโจร"
 child_personality.temperate.desc:0 ""พวกเขาขโมย [ROOT.GetCharacter.Custom('RegionalAlcoholicDrink')] ไป #EMP ทั้ง#! ถัง และ [child.GetFirstNameNoTooltip] ก็นั่งอยู่เฉย ๆ ขณะที่ [other_child.GetFirstNameNoTooltip] ดื่มจน [other_child.GetHerselfHimself] เมาเกือบหมดสติ!" [cook.GetSheHe|U] พูดอย่างโกรธเคือง\n\nดูเหมือนว่าผู้อยู่ในอุปถัมภ์ของข้าจะปกป้อง [child.GetHerHis] คู่หูในการก่ออาชญากรรม คอยดูต้นทางขณะที่งดเว้นจากการดื่มใด ๆ ด้วย [child.GetHerselfHimself]"
 child_personality.7001.diligent:0 "ด้วยตัวเองรึ? ช่างขยันหมั่นเพียรเสียจริง [child.Custom('GirlBoy')]ที่ดี!"
 child_personality.7001.gregarious:0 "ฮ่า! เจ้าสนุก#EMP จริงๆ#! เลยสินะ!"
 child_personality.7001.temperate:0 "เป็นการดีมากที่เจ้างดเว้นจากการดื่ม"
 child_personality.7001.change.diligent:0 "ข้าเชื่อว่ามีคนต้องการบทเรียนเรื่องความรับผิดชอบส่วนบุคคล"
 child_personality.7001.change.gregarious:0 "ฟังนะ เครื่องดื่มคือกุญแจสู่#EMP ความรื่นเริง#! และ#EMP ความสนุกสนาน#!!"
 child_personality.7001.change.temperate:0 "เจ้าอยู่ห่างจากสุรานับ แต่นี้ไป ได้ยินไหม?"
 spoilsport_opinion:0 "คนขัดคอ"
 
 child_personality.7010.t:0 "การเทศนา"
 child_personality.7010.desc:0 ""ฟังคำของข้า เด็กๆ ทั้งหลาย วันนี้ข้าจะบอกพวกเจ้าเกี่ยวกับ[ROOT.Char.GetFaith.HighGodName] [ROOT.Char.GetFaith.PositiveAfterLife] [ROOT.Char.GetFaith.NegativeAfterLife] และแม้กระทั่ง#EMP [ROOT.Char.GetFaith.DevilName]#! [ROOT.Char.GetFaith.DevilHerselfHimself]!" [sermon_priest.GetFirstName] อุทาน ความร้อนแรงแผดเผาในดวงตา[sermon_priest.GetHerHis]\n\nข้าและเด็กคนอื่นๆ ตกตะลึงกับการเทศนาของ[sermon_priest.GetFirstNamePossessiveNoTooltip] ใครจะรู้ว่า[ROOT.Char.GetFaith.ReligiousText]จะ#EMP น่าหลงใหล#! ขนาดนี้!\n\nเมื่อการเทศนาจบลง ข้าต้องบอกความคิดของข้าแก่[sermon_priest.GetFirstNameNoTooltip]"
 child_personality.7010.a:0 ""ความเชื่อของข้าใน[ROOT.Char.GetFaith.HighGodName|U]จะ#EMP ไม่มีวัน#! สั่นคลอน [sermon_priest.GetFirstNameNoTooltip]!""
 child_personality.7010.b:0 ""เรื่อง#EMP 'เทวสิทธิ์ของ[ROOT.Char.Custom('GetQueenKing')]'#! นั่นคืออะไรหรือ?""
 child_personality.7010.c:0 ""'[ROOT.Char.GetFaith.DevilName]' ผู้นี้ดู#EMP น่าเอาอย่าง!#!""
 child_personality.7011.t:0 "$child_personality.7010.t$"
 child_personality.7011.desc:0 "วันนี้ [sermon_priest.GetFirstName] ได้เทศนาอย่างเผ็ดร้อนแก่เด็กๆ ทุกคนในราชสำนัก พวกเขาดูเหมือนจะตกตะลึงขณะที่ท่านอ่านจาก[sermon_priest.GetFaith.ReligiousText]อย่างกระตือรือร้น\n\n[ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('child'))]ของข้า [child.GetFirstName] "
 child_personality.zealous.desc:0 "ดูเหมือนจะจำฝังใจ บางทีอาจจะ#EMP มาก#! เกินไป [child.GetSheHe|U] คอยตามก่อกวนพวกคนรับใช้มาหลายชั่วโมงแล้ว ชี้ให้เห็นว่าพวกเขาจะเป็น[child.GetFaith.GetAdherentNamePlural]ที่ดีขึ้นได้อย่างไร..."
 child_personality.ambitious.desc:0 "ตอนนี้ดูเหมือนจะมั่นใจว่า[child.GetSheHe]ถูกลิขิตมาเพื่อความยิ่งใหญ่ โดยอ้างว่า[child.GetFaith.HighGodName]สนับสนุน[child.GetHerHim]อย่างไม่เลือกหน้า"
 child_personality.sadistic.desc:0 "เอา แต่บอกข้าว่า[child.GetSheHe]ชอบข้อความเกี่ยวกับ#EMP [child.GetFaith.DevilName]#! มากเพียงใด และ[child.GetFaith.DevilSheHe]เป็นผู้ที่[child.GetSheHe]จะมุ่งมั่นเลียนแบบอุดมการณ์..."
 child_personality.7011.zealous:0 "ความเชื่อที่แข็งแกร่งจะรับใช้เจ้าได้ดี [child.Custom('GirlBoy')]"
 child_personality.7011.ambitious:0 "ถูกต้อง อย่าลืมว่าสิ่งศักดิ์สิทธิ์อยู่ข้างเจ้า!"
 child_personality.7011.sadistic:0 "จะว่า อย่างไรก็ตาม การไม่มีศีลธรรมจะรับใช้[child.GetHerHim]ได้ดี"
 child_personality.7011.change.zealous:0 "#EMP ศรัทธา#! ของเจ้าอยู่เหนือสิ่งอื่นใด ลูกรักของข้า"
 child_personality.7011.change.ambitious:0 "ศรัทธาเป็น#EMP เพียงหนทางสู่จุดหมาย!#!"
 child_personality.7011.change.sadistic:0 "ลูกเอ๋ย โลกนี้มืดมนและเต็มไปด้วยความน่าสะพรึงกลัว มันคือการฆ่าหรือถูกฆ่า"
 clever_child_opinion:0 "เด็กฉลาด"
 delightfully_devilish_opinion:0 "เจ้าเล่ห์อย่างน่าพึงพอใจ"
 worried_opinion:0 "กังวล"
 
 child_personality.7020.t:0 "การทุบตี"
 child_personality.7020.desc:0 ""เจ้า[child.Custom2('InsultNoun', SCOPE.sC('evil_person'))]ตัวน้อยแสนโง่เขลา! เหตุใดเจ้าต้องมาขวางทางข้าอยู่เรื่อย!? ข้าจะสั่งสอนเจ้าเสียหน่อย..." [evil_person.GetFirstName] อุทาน, พลางเอื้อมมือไปหยิบกระบองที่อยู่ใกล้เคียง\n\nข้าทำสิ่งใดผิดหรือ? ข้าเพียงแค่อยากเห็นว่า [evil_person.GetFirstNameNoTooltip] กำลังทำสิ่งใด! [evil_person.GetSheHe|U] กำลังใกล้เข้ามาอย่างรวดเร็ว, พลางเงื้อกระบองขึ้นกลางอากาศ! ช่วยด้วย!\n\n"หากเจ้านำเรื่องนี้ไปบอกผู้ใด ข้าจะแน่ใจว่าเจ้าต้องมลายสิ้น..." [evil_person.GetSheHe|U] ยิ้มแสยะ"
 child_personality.7020.a:0 "โฮ... ทำไมคนถึงโหดร้าย เช่นนี้ได้..."
 child_personality.7020.b:0 "ถ้ามีคนอย่าง[evil_person.GetHerHim]มากกว่านี้ล่ะ!? ข้าต้อง#EMP ระวังตัว#! ตลอดเวลา..!"
 child_personality.7020.c:0 "ได้โปรด! อย่าทำร้ายข้าเลย ข้าจะทำทุกอย่าง!"
 child_personality.7021.t:0 "$child_personality.7020.t$"
 child_personality.7021.desc:0 "เกิดอะไรขึ้นกับ[ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('child'))]ของข้า [child.GetFirstName]!? [child.GetSheHe|U] ฟกช้ำดำเขียวไปหมด – และ[child.GetSheHe]ปฏิเสธที่จะบอกว่าใครทำสิ่งนี้กับ[child.GetHerHim]! เป็นเด็กที่โตกว่าหรือ? หรือว่า[child.GetSheHe]ไปก่อกวนขุนนางจนถึงจุดเดือด?\n\n"
 child_personality.shy.desc:0 "ตอนนี้[child.GetSheHe]แทบจะหยุดพูดไปแล้ว และคอยหลบซ่อนตัวอยู่เสมอเมื่อมีคนอยู่ใกล้ๆ... [child.Custom('GirlBoy')]ที่น่าสงสาร..."
 child_personality.paranoid.desc:0 "ดูเหมือนว่าแม้ แต่เงาที่วูบไหวก็ ทำให้[child.GetHerHim]สะดุ้งตกใจ บางที[child.Custom('GirlBoy')]ที่น่าสงสารอาจเห็นผู้ทำร้าย[child.GetHerHis]ในเงานั้น? [child.GetSheHe|U] คอยมองข้ามไหล่[child.GetHerHis]อยู่เสมอ ตื่นตัวอยู่ตลอดเวลา..."
 child_personality.craven.desc:0 "หากแม้ แต่เข็มหมุดตก [child.GetFirstNameNoTooltip]ก็จะวิ่งหาความปลอดภัยในตู้เสื้อผ้าที่ว่างเปล่า [child.Custom('GirlBoy')]ที่น่าสงสารดูเหมือนจะใช้ชีวิตอยู่ด้วยความกลัวตลอดเวลา..."
 child_personality.7021.shy:0 "[child.Custom('GirlBoy')]ที่รัก เจ้าไม่จำเป็นต้องคุยกับใครถ้าเจ้าไม่ต้องการ..."
 child_personality.7021.paranoid:0 "จงตื่นตัว [child.Custom('GirlBoy')] อย่าให้โอกาสพวกเขาอีก"
 child_personality.7021.craven:0 "วิ่ง หนี และอย่าให้โอกาสศัตรูทำร้ายเจ้าได้"
 child_personality.7021.change.shy:0 "หลีกเลี่ยงผู้คน แล้วเจ้าจะปลอดภัย..."
 child_personality.7021.change.paranoid:0 "มีศัตรู#EMP อยู่ทุกหนทุกแห่ง#! เจ้าต้องเรียนรู้สิ่งนั้น"
 child_personality.7021.change.craven:0 "เจ้าควรจะวิ่งหนีไปสิ ลูก!"
 
 child_personality.7030.t:0 "ลำพังในห้องครัว"
 child_personality.7030.desc:0 "ในที่สุด ข้าก็ได้ครอบครองห้องครัว#EMP ทั้งหมด#! แต่เพียงผู้เดียว!\n\nข้าได้โน้มน้าวคนครัว [cook.GetFirstName] ว่าข้าจะล้างหม้อ ด้วยคำสัญญานั้น [cook.GetSheHe]จึงออกไปหา[ROOT.Char.Custom('GetLivestockFowlIndef')]สำหรับอาหารค่ำคืนนี้ – ทิ้งให้ห้องครัว#EMP น่าอร่อย#! โดยไม่มีใครดูแล\n\nมีน้ำผึ้งและ[child.Custom('FavoriteTreatDemand')]และแยมและ[child.Custom('GetExpensiveDessert')]และแอปเปิลและ... และ... #EMP และข้าทนไม่ไหวแล้ว!#!\n\nถึงเวลาที่จะ..."
 child_personality.7030.a:0 "...กินทุกอย่างนิดหน่อย แล้วงีบหลับบนกระสอบแป้ง!"
 child_personality.7030.b:0 "...กินให้มากที่สุดเท่าที่จะยัดลงไปได้ ข้าจะไม่เหลือแม้ แต่เศษขนมปัง!"
 child_personality.7030.c:0 "...ล้างหม้อสิ แน่นอน!"
 child_personality.7031.t:0 "$child_personality.7030.t$"
 child_personality.7031.desc:0 ""สวัสดี ท่าน[ROOT.Char.GetLadyLord]" [cook.GetFirstName] หนึ่งในคนครัวกล่าว "ข้ามี[ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('child'))]ของท่าน [child.GetFirstName] อยู่กับข้าที่นี่ [child.GetSheHe|U] สัญญาว่าจะล้างหม้อในห้องครัว ท่านเห็นไหม..."\n\n[cook.GetSheHe|U] สูดหายใจเข้าลึกๆ\n\n"
 child_personality.lazy.desc:0 ""... แต่[child.GetSheHe]แทะเล็มอาหารทั้งหมดเหมือนหนูตัวเล็กๆ แล้วก็หลับไปบนกระสอบแป้ง! [child.GetSheHe|U] สมควรโดนตีถ้าท่านถามข้า แต่ข้าจะทิ้ง[child.GetHerHim]ไว้กับท่านให้จัดการตามที่ท่านเห็นสมควร!"\n\nเด็กคนนี้ช่างไม่มีแรงจูงใจและเซื่องซึมเสียจริง ท่านอาจสับสน[child.GetHerHim]กับศพได้!"
 child_personality.gluttonous.desc:0 ""... แต่[child.GetSheHe]สวาปามขนมหวานทุกอย่างที่[child.GetSheHe]หาเจอ เหมือนหมูตัวน้อย! ตอนนี้[child.GetSheHe]เหงื่อท่วมตัวและหน้าแดงจากการออกแรงกินของ[child.GetHerselfHimself]..."\n\n[child.GetFirstNameNoTooltip] ไม่เคยต้านทานของหวานได้เลย แต่นี่อาจจะเกินไปหน่อย..."
 child_personality.compassionate.desc:0 ""...และล้างหม้อ#EMP ทุก#! ใบที่[child.GetSheHe]ทำ! แม้กระทั่งขัดหม้อต้มขนาดใหญ่ โดยที่ข้าไม่ได้ขอเลย! นั่นเป็น[child.Custom('GirlBoy')]ที่น่ารักที่ท่านมี"\n\nนี่เป็นการกระทำที่ไม่เห็นแก่ตัวอย่างแท้จริง แต่การกระทำนี้เหมาะสมกับสถานะของ[child.GetFirstNamePossessiveNoTooltip]หรือไม่..?"
 child_personality.7031.lazy:0 "ดีแล้ว อย่าเสียพลังงานไปโดยเปล่าประโยชน์!"
 child_personality.7031.gluttonous:0 "จำไว้ ไม่มีใครบอกเจ้าได้ว่าเจ้ากินอะไรได้หรือไม่ได้"
 child_personality.7031.compassionate:0 "ช่างเป็นการกระทำที่น่ารัก! เจ้าจะไปได้ไกลในชีวิต"
 child_personality.7031.change.lazy:0 "อย่าเสียพลังงานไปกับคน เช่นนี้ [child.Custom('GirlBoy')]"
 child_personality.7031.change.gluttonous:0 "เจ้าควรกินขนมหวานทั้งหมด มันเป็น#EMP สิทธิ์ของเจ้า.#!"
 child_personality.7031.change.compassionate:0 "เจ้าควรปฏิบัติต่อ[cook.GetFirstNameNoTooltip]ให้ดีกว่านี้!"
 lazy_child_opinion:0 "เด็กขี้เกียจ"
 little_pig_opinion:0 "หมูน้อย"
 sweet_child_opinion:0 "เด็กน่ารัก"
 thankful_opinion:0 "ขอบคุณ"
 
 child_personality.7040.t:0 "ซ่อนแอบและแอบมอง"
 child_personality.7040.desc:0 "ตู้เสื้อผ้าในห้องพักคนรับใช้คือที่ซ่อน#EMP ที่ดีที่สุด#! ข้าเป็นอัจฉริยะด้านการซ่อนแอบ! ขณะที่ข้าแอบมองผ่านช่องว่างเล็กๆ ระหว่างประตู ข้าเห็น[lover_1.GetFirstName]และ[lover_2.GetFirstName]พรวดพราดเข้ามาทางประตู\n\n"โอ้ [lover_2.Custom('RomanticComplimentNoun')][lover_2.Custom('RomanticComplimentAdjective')]ของข้า ข้า#EMP รอ#! ไม่ไหวแล้วที่จะถอดเสื้อผ้าเจ้าออก!" [lover_1.GetFirstNameNoTooltip] คำราม มือ[lover_1.GetHerHis]คว้าไปทั่วร่างของ[lover_2.GetFirstNamePossessiveNoTooltip]\n\n"เอาข้าไป เอาข้าไปเดี๋ยวนี้ เจ้า[lover_1.Custom('RaunchyComplimentNoun')]!" [lover_2.GetFirstNameNoTooltip] ครางเสียงดัง ทิ้งตัว[lover_2.GetHerselfHimself]ลงบนเตียง\n\n"
 child_personality.7040.desc_motherfather:0 "ท่านแม่? ท่านพ่อ? พ... พวกท่านกำลัง#EMP ทำอะไรกัน!?#!"
 child_personality.7040.desc_father:0 "ท... ท่านพ่อ? ท่านกำลัง#EMP ทำอะไร!?#!"
 child_personality.7040.desc_mother:0 "ท... ท่านแม่? ท่านกำลัง#EMP ทำอะไร!?#!"
 child_personality.7040.desc_default:0 "พวกเขากำลัง... โอ้... ข้า#EMP ไม่#! ควรจะเห็นสิ่งนี้!"
 child_personality.7040.a.crush_version:0 "[child_crush_target.GetFirstNameNoTooltip] ช่าง... #EMP งดงาม#! ดุจ[child_crush_target.Custom('GetBeautifulMetaphor')]"
 child_personality.7040.a:0 "นี่ดู#EMP สนุกกว่า#! การซ่อนแอบเยอะเลย!"
 child_personality.7040.b:0 "ดวงตาอันไร้เดียงสาของข้า หยุดเถอะ! #EMP หยุดเดี๋ยวนี้!#!"
 child_personality.7041.t:0 "$child_personality.7040.t$"
 child_personality.7041.desc:0 "[ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('child'))]ของข้า [child.GetFirstName] ไปทำอะไรในตู้เสื้อผ้านั่นในห้องพักคนรับใช้? เล่นซ่อนแอบ [child.GetSheHe]อ้างอย่างนั้นรึ?\n\n"
 child_personality.lustful.desc:0 "[child.GetSheHe|U] ดูเหมือนคนโง่ ยิ้ม แก้มแดง น้ำลายไหล แทบไม่ได้ยินสิ่งที่ข้าพูด...\n\nโอ้ ไม่นะ... ข้ารู้ว่าเกิดอะไรขึ้น [child.GetSheHe|U] ต้องเห็น[ROOT.Char.Custom('lowly_servant_type')]สองคน เอ่อ #EMP กำลังถอนขน[ROOT.Char.Custom('GetLivestockFowlIndef')]#! ด้วยกัน – นั่นคือความใคร่อย่างไม่ต้องสงสัยในดวงตาของ[child.GetFirstNamePossessiveNoTooltip]"
 child_personality.chaste.desc:0 "[child.GetSheHe|U] ดูเหมือนผี ตัวสั่น ตาเบิกกว้าง จ้องมองกำแพง...\n\nโอ้ ไม่นะ... ข้ารู้ว่าเกิดอะไรขึ้น [child.GetSheHe|U] ต้องเห็น[ROOT.Char.Custom('lowly_servant_type')]สองคน เอ่อ #EMP กำลังถอนขน[ROOT.Char.Custom('GetLivestockFowlIndef')]#! ด้วยกัน\n\n[child.Custom('GirlBoy')]ที่น่าสงสารดูตกใจ ข้าจะไม่แปลกใจเลยถ้า[child.GetSheHe]จะพบว่าความใกล้ชิดเป็นเรื่องยากเมื่อ[child.GetSheHe]โตขึ้น..."
 child_personality.7041.lustful:0 "เจ้าเด็กบ้ากาม! เก็บมันไว้ตอนเจ้าโตแล้ว!"
 child_personality.7041.chaste:0 "การไม่ใกล้ชิดเกินความจำเป็นจะรับใช้[child.GetHerHim]ได้ดี"
 child_personality.7041.change.lustful:0 "อย่ากลัวไปเลย [child.Custom('GirlBoy')]! เมื่อเจ้าเป็นผู้ใหญ่ เจ้าจะเข้าใจ!"
 child_personality.7041.change.chaste:0 "ยับยั้งชั่งใจตัวเอง! นี่ไม่ใช่วิธีที่[child.GetLadyLord]ควรประพฤติ!"
 
 child_personality.7050.t:0 "บทเรียนเรื่องเงินทอง"
 child_personality.7050.desc:0 ""หากปราศจากภาษี คลังหลวงก็จะหมดลงในไม่ช้า ข้าหลวงผู้ภักดีมีความสุขมากกว่าที่จะจ่าย" [teacher.GetFirstName] ครูของข้า กล่าว และ[ROOT.Char.Custom2('QuirkPresentPosOrNeg', SCOPE.sC('teacher'))]\n\n"ดังนั้นจึงเป็นสิ่งสำคัญอย่างยิ่งที่จะ ทำให้ราษฎรของเจ้ามีความสุข อย่าเก็บภาษีพวกเขามากเกินไป – หรือน้อยเกินไป เกรงว่าพวกเขาจะพบว่าเจ้าพึงพอใจ" [teacher.GetFirstNameNoTooltip] กล่าวต่อ พลิกหน้ากระดาษ\n\n"ตั้งแต่[ROOT.Char.GetTitleTierName]สูงสุดไปจนถึง[ROOT.Char.Custom('lowly_servant_type')]ต่ำสุด ทุกคนมีบทบาทของตน" [teacher.GetSheHe|U] กล่าว ปิดม้วนหนังสือ "บทเรียนจบแล้ว เจ้าไปได้""
 child_personality.7050.a:0 "หากปราศจากความเป็นธรรม อาณาจักรจะสั่นคลอน!"
 child_personality.7050.b:0 "บา! เมื่อข้าปกครอง ภาษีจะ#EMP สูง#! และ#EMP มากมาย!#!"
 child_personality.7050.c:0 "การจะทำไข่เจียวทองคำ เจ้าต้องทุบชาวนาสองสามคน..."
 child_personality.7051.t:0 "$child_personality.7050.t$"
 child_personality.7051.desc:0 "[ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('child'))]ของข้า [child.GetFirstName]"
 child_personality.7051.desc_1:0 "เพิ่งจบหนึ่งในบทเรียนของข้า"
 child_personality.7051.desc_2:0 "เพิ่งจบบทเรียนที่จัดโดย[teacher.GetFirstName]"
 child_personality.7051.desc_fin:0 "– เกี่ยวกับการจัดการคลังหลวง และทองคำในนั้น\n\n"
 child_personality.just.desc:0 "[child.GetFirstNameNoTooltip] ดูเหมือนจะจำบทเรียนฝังใจ ด้วยความรู้สึกยุติธรรมที่แข็งแกร่งขึ้น\n\n[child.GetSheHe|U] พูดถึงอยู่ตลอดเวลาว่าทุกคน 'ตั้งแต่[ROOT.Char.GetTitleTierName]สูงสุดไปจนถึง[ROOT.Char.Custom('lowly_servant_type')]ต่ำสุด' มีบทบาทในเศรษฐกิจของอาณาจักรอย่างไร"
 child_personality.greedy.desc:0 "แต่ดูเหมือนว่ามีเพียงส่วนที่กล่าวถึง#EMP ทองคำ#! เท่านั้นที่ติดอยู่ในใจ...\n\nตอนนี้[child.GetSheHe]กำลังเรียกเก็บภาษีเล็กน้อยจากคนรับใช้ทุกคนที่[child.GetSheHe]ไล่ตามได้ สร้างความรำคาญให้กับพวกเขาทุกคน"
 child_personality.callous.desc:0 "[child.GetFirstNameNoTooltip] ดูเหมือนจะจำบทเรียน... ค่อนข้าง... ฝังใจ\n\nในขณะที่[child.GetSheHe]เข้าใจบทบาทของชนชั้นล่าง [child.GetSheHe]ก็ยืนกรานว่า 'หากชาวนาหยุดจ่ายภาษี พวกเขาก็ไม่มีประโยชน์อีกต่อไป และควรถูกกำจัดทิ้ง' – มุมมองที่ไร้ความปรานีต่อชีวิตมนุษย์..."
 child_personality.7051.just:0 "ความรู้สึกยุติธรรมที่แข็งแกร่งจะ ทำให้เจ้าเป็นที่รักของผู้คน!"
 child_personality.7051.greedy:0 "ถูกต้อง ไม่มีอะไรสำคัญไปกว่า#EMP ทองคำ!#!"
 child_personality.7051.callous:0 "ดี อย่าให้เพียง#EMP ความรู้สึก#! มาฉุดรั้งเจ้าไว้"
 child_personality.7051.change.just:0 "เจ้าไม่ได้เรียนรู้อะไรเลยหรือ!? บทเรียนเกี่ยวกับ#EMP ความเป็นธรรม!#!"
 child_personality.7051.change.greedy:0 "...บวาฮ่าฮ่า! ไม่ [child.Custom('GirlBoy')] สิ่งที่เจ้าต้องทำคือ#EMP รีดเลือดพวกเขาให้แห้ง!#!"
 child_personality.7051.change.callous:0 "อารมณ์ก่อให้เกิดความอ่อนแอ ลูกเอ๋ย จงระงับมันไว้"
 
 child_personality.7060.t:0 "ความลึกลับของ[child.GetFaith.ReligiousText|U]"
 child_personality.7060.desc:0 ""ดูหน้านี้สิ [child.GetFirstNameNoTooltip]! ข้าคิดว่ามันพูดถึง[child.GetFaith.random_GoodGodNames] มันน่าสนใจจริงๆ" [other_child.GetFirstName] กล่าว สำเนาเปิดของ[child.GetFaith.ReligiousText]วางอยู่ตรงหน้า[other_child.GetHerHim]บนพื้น\n\n"มีหลายสิ่งที่เราไม่รู้ มีหลายสิ่งให้เรียนรู้! ความลึกลับมากมาย ความรู้มากมาย – มาพยายามทำนายความจริงเพิ่มเติมกันเถอะ ลองจินตนาการดูว่าเราจะกลายเป็นอะไรได้บ้าง!" [other_child.GetFirstNameNoTooltip|U] กล่าว สายตา[other_child.GetHerHis]ค่อยๆ เงยหน้าขึ้น"
 child_personality.7060.a:0 "มีปัญญามากมายในหนังสือเล่มนั้น!"
 child_personality.7060.b:0 "เบล่ เจ้าอยากเล่นกับ#EMP [child.Custom('child_favorite_toy')]#! ของข้ามากกว่าไหม!?"
 child_personality.7060.c:0 "โอ้ ข้าพอใจกับสิ่งที่ข้ารู้อยู่แล้ว"
 child_personality.7061.t:0 "$child_personality.7060.t$"
 child_personality.7061.desc:0 "[ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('child'))]ของข้า [child.GetFirstName] และเพื่อนตัวน้อยของ[child.GetHerHis] [other_child.GetFirstName] ได้หยิบสำเนาของ[child.GetFaith.ReligiousText]จากห้องสมุดและนำเข้ามาในห้องเด็กเล่น...\n\n"
 child_personality.humble.desc:0 "พวกเขาใช้เวลาหลายชั่วโมงพยายามทำความเข้าใจสิ่งที่เขียนอยู่ในหน้ากระดาษ พูดคุยเกี่ยวกับ[child.GetFaith.random_GoodGodNames]และความลึกลับมากมายของสิ่งศักดิ์สิทธิ์\n\n[child.GetFirstNameNoTooltip] ดูเหมือนจะพัฒนาความเคารพอย่างลึกซึ้งต่อถ้อยคำของศรัทธา[child.GetFaith.GetAdjective]"
 child_personality.cynical.desc:0 "...และทำลายมันอย่างสิ้นเชิง! หน้ากระดาษฉีกขาด รอยเท้าบนปก – ไม่มีความเคารพใดๆ ทั้งสิ้น!\n\nดูเหมือนว่า[child.GetFirstNameNoTooltip]ตัวน้อยจะไม่สนใจถ้อยคำของสิ่งศักดิ์สิทธิ์..."
 child_personality.content.desc:0 "[child.GetFirstNameNoTooltip] พยายามอ่านมัน แต่ก็ตระหนักได้อย่างรวดเร็วว่าถ้อยคำในนั้นควรปล่อยให้เป็นหน้าที่ของ[child.GetFaith.PriestNeuterPlural]จะดีที่สุด\n\n[child.GetSheHe|U] ดูเหมือนจะพอใจอย่างสมบูรณ์กับความไม่สามารถในปัจจุบันของ[child.GetHerHis]ที่จะเข้าใจความหมายที่ลึกซึ้งยิ่งขึ้นของหนังสือ..."
 child_personality.7061.humble:0 "เจ้าทำดีแล้วที่ปฏิบัติต่อถ้อยคำศักดิ์สิทธิ์ด้วยความเคารพ"
 child_personality.7061.cynical:0 "ฮ่า! มันก็แค่เรื่องไร้สาระอยู่ดี"
 child_personality.7061.content:0 "จงพอใจในสิ่งที่ไม่รู้ ข้าว่าอย่างนั้น"
 child_personality.7061.change.humble:0 "จงเคารพถ้อยคำเหล่านั้น! มันมี#EMP ปัญญา#! และ#EMP ความหมาย!#!"
 child_personality.7061.change.cynical:0 "มันไร้สาระทั้งนั้น [child.Custom('GirlBoy')] อย่าไปสนใจมัน"
 child_personality.7061.change.content:0 "จงพอใจกับสิ่งที่เจ้ารู้อยู่แล้ว แล้วเจ้าจะมีความสุข"
 
 child_personality.7070.t:0 "เลือดและน้ำลาย"
 child_personality.7070.desc:0 "อา, [child.Custom('GetExpensiveMeal')], ของ#EMP โปรด#!ของข้า! ขณะที่ข้ากำลังจะเริ่มลิ้มรส ความสุขของข้าก็ถูกขัดจังหวะโดย [other_child.GetFirstName] ในทันที [other_child.GetSheHe] ต้องการสิ่งใด?\n\n"ว่าอย่างไร, #EMP [child.Custom2('InsultNoun', SCOPE.sC('other_child'))]!#! เจ้ากำลังกินอันใด? ดูน่าขยะแขยงสิ้นดี – ให้ข้า#EMP เติมเครื่องเทศให้หน่อยเถิด!#!" [other_child.GetFirstNameNoTooltip] เอ่ยขึ้น, พลางเดินเข้ามาใกล้จานของข้า\n\n#flatulence *Ptooey!*#! น้ำลายก้อนน่ารังเกียจถ่มลงกลางอาหารของข้าพอดิบพอดี\n\n"นั่นแหละ, อร่อยขึ้นมาก! บวาฮ่าฮ่า!" [other_child.GetSheHe|U] หัวเราะและยิ้มแสยะ"
 child_personality.7070.a:0 "เจ้าก่อเรื่องจนได้, [other_child.Custom2('InsultNoun', ROOT.Char)]!"
 child_personality.7070.b:0 "ข้าจะแอบถ่มน้ำลายใส่อาหารของ[other_child.GetHerHis]นับ แต่นี้ไป... #EMP ขอให้เจริญอาหาร.#!"
 child_personality.7070.c:0 "กัดฟันและทนเอา"
 child_personality.7070.c.flavor:0 "ยอมรับและอดทน"
 child_personality.7071.t:0 "$child_personality.7070.t$"
 child_personality.7071.desc:0 "เห็นได้ชัดว่า[other_child.GetFirstName]ถ่มน้ำลายใส่อาหารของ[ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('child'))] [child.GetFirstNamePossessive]ระหว่างอาหารค่ำเมื่อสองสามคืนก่อน\n\n"
 child_personality.vengeful.desc:0 ""เจ้ามัน[other_child.Custom2('InsultNoun', SCOPE.sC('child'))]!" [child.GetFirstNameNoTooltip] ตะโกน "แต่เจ้าสิ[child.Custom2('InsultNoun', SCOPE.sC('other_child'))]!" [other_child.GetFirstNameNoTooltip] ตะโกนกลับ\n\nนับ แต่นั้น [child.GetFirstNameNoTooltip] ก็วิวาทกับ [other_child.GetFirstNameNoTooltip] ทุกเมื่อเชื่อวัน! มิมีนาทีใดผ่านไปโดยที่ [child.GetHerHim] มิได้วางแผนแก้แค้นเล็กๆ น้อยๆ..."
 child_personality.deceitful.desc:0 "คนครัวคนหนึ่งมาเจอ[child.GetFirstNameNoTooltip]กำลังแก้แค้นโดยการถ่มน้ำลายใส่อาหารของ[other_child.GetFirstNamePossessiveNoTooltip]อย่างลับๆ! นั่นอธิบายได้ว่าทำไม[other_child.GetFirstNameNoTooltip]ถึงดู... #EMP หน้าเขียว#! เล็กน้อยระหว่างอาหารค่ำ – [child.GetSheHe]คงถ่มน้ำลายใส่อาหารของ[other_child.GetFirstNamePossessiveNoTooltip]มาหลายวันแล้ว เจ้าเด็กเจ้าเล่ห์..."
 child_personality.calm.desc:0 "ดูเหมือนว่า [child.GetFirstNameNoTooltip] กำลังพยายาม ทำให้ [other_child.GetFirstNameNoTooltip] เหนื่อยใจไปเอง ด้วยการมิโต้ตอบการรังแกของ [other_child.GetHerHis] มิว่ากี่ครั้งกี่หนที่ [other_child.GetFirstNameNoTooltip] จะเรียก [child.GetHerHim] ว่า [child.Custom2('InsultNoun', SCOPE.sC('other_child'))] หรือตบหน้า [child.GetHerHim]..."
 child_personality.7071.vengeful:0 "เจ้าจะได้แก้แค้น ในไม่ช้า"
 child_personality.7071.deceitful:0 "สมควรแล้วที่[other_child.GetFirstNameNoTooltip]ได้รับ!"
 child_personality.7071.calm:0 "แค่เพิกเฉยต่อ[other_child.GetFirstNameNoTooltip] แล้ว[other_child.GetSheHe]จะเบื่อไปเอง"
 child_personality.7071.change.vengeful:0 "อย่าอ่อนแอขนาดนั้น! #EMP แก้แค้นสิ!#!"
 child_personality.7071.change.deceitful:0 "การแก้แค้นคืออาหารที่เสิร์ฟได้ดีที่สุด... #EMP ทางอ้อม.#!"
 child_personality.7071.change.calm:0 "แค่หันแก้มอีกข้างให้ [child.Custom('GirlBoy')]ของข้า"
 
 child_personality.7080.t:0 "บทเรียนเรื่องการกุศล"
 child_personality.7080.desc_1:0 ""จงดูคนยากจนและผู้ถูกกดขี่ [child.GetFirstNameNoTooltip] มีพวกเขามากมาย และบางคนก็ต้องการความช่วยเหลืออย่างแท้จริง – คนอื่นๆ เป็นเพียงนักต้มตุ๋นที่แสวงหาการแจกจ่าย" "
 child_personality.7080.desc_name_1:0 "[teacher.GetTitledFirstName] $child_personality.7080.desc_2$"
 child_personality.7080.desc_name_2:0 "[teacher.GetCouncilTitle] [teacher.GetFirstName] $child_personality.7080.desc_2$"
 child_personality.7080.desc_2:0 "อธิบายให้ข้าฟัง พลางหยิบถุงทองเล็กๆ ออกมา\n\n"ในหมู่พวกเขา ใครสมควรได้รับการกุศลของเรามากที่สุดในวันนี้ [child.Custom('GirlBoy')]ที่รักของข้า?" [teacher.GetSheHe|U] กล่าว พลางยื่นถุงให้ข้า\n\nดูเหมือนว่า[teacher.GetFirstNameNoTooltip]ต้องการให้ข้ามอบทองคำให้กับผู้ที่ต้องการมันมากที่สุด..."
 child_personality.7080.a:0 "พวกเขาทุกคนสมควรได้รับมัน! เราต้องมีให้มากกว่านี้หรือไม่?"
 child_personality.7080.b:0 "[ROOT.Char.Custom('lowly_servant_type')]! ไม่... ชาวนาคนนี้! เดี๋ยวก่อน บางที..."
 child_personality.7080.c:0 "ไม่มีใครเลย พวกเขาทั้งหมดเป็นพวกชั้นต่ำ!"
 child_personality.7081.t:0 "$child_personality.7080.t$"
 child_personality.7081.desc:0 "[teacher.GetTitledFirstName] พา[ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('child'))]ของข้า [child.GetFirstName] ไปตลาดวันนี้ [child.GetFirstNameNoTooltip] ต้องแจกทานให้กับคนยากจนและผู้ขัดสน เพื่อเรียนรู้เกี่ยวกับการกุศลและชะตากรรมของผู้ปกครองต่อผู้ด้อยโอกาส\n\n"
 child_personality.generous.desc:0 ""เด็ก[child.Custom('ComplimentAdjective')]คนนั้นให้บางสิ่งแก่ทุกคน" [teacher.GetFirstNameNoTooltip] กล่าว "และเมื่อถุงหมด [child.GetSheHe]ก็ยืนกรานว่าเราจะไปเอาอีกใบ ช่างไม่เห็นแก่ตัวจริงๆ บางทีอาจจะมากเกินไปด้วยซ้ำ"\n\nดูเหมือนว่า[child.GetFirstNameNoTooltip]ตัวน้อยจะมีหัวใจที่ยิ่งใหญ่มาก"
 child_personality.fickle.desc:0 ""เด็กน้อยผู้โลเลตัดสินใจไม่ได้ว่าจะมอบทองคำให้ผู้ใด" [teacher.GetFirstNameNoTooltip] กล่าวอย่างหัวเสียเห็นได้ชัด "ท้ายที่สุด [child.GetSheHe] ได้มอบเหรียญหนึ่งให้กับ [ROOT.Char.Custom('lowly_servant_type')] ขาเดียว มอบอีกเหรียญให้เด็กกำพร้าตาบอด ใช้เหรียญหนึ่งซื้อ [child.Custom('FavoriteTreatDemand')] มอบอีกเหรียญให้แก่ #EMP ข้า#! เสียอย่างนั้น และทำเหรียญสุดท้ายหายในคูน้ำ"\n\nดูเหมือนว่า [child.GetFirstNameNoTooltip] น้อยผู้นี้ช่างตัดสินใจ [child.GetHerHis] อะไรไม่ได้เลย..."
 child_personality.arrogant.desc:0 ""[child.GetSheHe|U] ปฏิเสธที่จะให้เหรียญแม้ แต่เหรียญเดียวแก่#EMP ใครเลย!#!" [teacher.GetFirstNameNoTooltip] อุทาน "ทุกคนที่เราพบล้วน แต่ 'ไม่สมควรได้รับ' หรือ 'ต่ำต้อยกว่า[child.GetHerHim]'... ในท้ายที่สุด [child.GetSheHe]ก็เก็บทองคำไว้"\n\n[child.GetFirstNameNoTooltip] ดูเหมือนจะพัฒนาความเห็นแก่ตัวขึ้น..."
 child_personality.7081.generous:0 "มันเป็นชะตากรรมของเราที่จะให้มากที่สุดเท่าที่เราสามารถทำได้!"
 child_personality.7081.fickle:0 "ทำไมต้องเลือกทางเดียว ในเมื่อเจ้าสามารถเลือก#EMP ทุกทางได้!#!"
 child_personality.7081.arrogant:0 "ถูกต้อง [child.Custom('GirlBoy')] เจ้า#EMP ดีกว่า#! พวกเขา"
 child_personality.7081.change.generous:0 "ไม่ เจ้า#EMP ต้อง#! ดูแลคนยากจน!"
 child_personality.7081.change.fickle:0 "เจ้าต้องพิจารณาทางเลือกของเจ้าเสมอ อย่างระมัดระวัง อย่างต่อเนื่อง"
 child_personality.7081.change.arrogant:0 "บา! พวกคนจนน่าสงสารเหล่านั้นล้วนต่ำต้อยกว่าเจ้า!"
 
 child_personality.7090.t:0 "ประเด็นสำคัญของการทูต"
 child_personality.7090.desc:0 ""ข้าหลวงจะล้ำเส้นในบางครั้ง" ครูของข้า [teacher.GetFirstName] กล่าว "การให้อภัยจะเสริมสร้างความผูกพันของเจ้า"\n\n"ในบางครั้ง จงไว้วางใจในราษฎร แม้จะมีชื่อเสียงของพวกเขาก็ตาม เกรงว่าเจ้าจะแบกรับภาระมากเกินไป" [teacher.GetSheHe|U] พูดเสียงเนิบนาบ\n\n"เป็นสิ่งสำคัญที่เจ้าต้องให้เวลาพวกเขาตามที่ต้องการเพื่อแก้ไขความผิดพลาดของตน" [teacher.GetFirstNameNoTooltip] กล่าว พลางม้วนแผ่นหนัง\n\n"ตอนนี้ เจ้าได้เรียนรู้อะไรจากที่นี่ในวันนี้?" [teacher.GetSheHe|U] กล่าว มองมาที่ข้าอย่างตั้งใจ"
 child_personality.7090.a:0 "ทุกคนทำผิดพลาด ข้าไม่ควรตัดสิน"
 child_personality.7090.b:0 "การไว้วางใจราษฎรของเจ้าเป็นสิ่งสำคัญมาก!"
 child_personality.7090.c:0 "ความอดทน ปล่อยให้สิ่งต่างๆ ใช้เวลาตามที่ต้องการ"
 child_personality.7091.t:0 "$child_personality.7090.t$"
 child_personality.7091.desc:0 "วันนี้ [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('child'))]ของข้า [child.GetFirstName] ได้รับบทเรียนเกี่ยวกับการจัดการข้าหลวงโดย[teacher.GetFirstName] มันเป็นหลักสูตรที่ค่อนข้างซับซ้อน จำเป็น แต่บางทีอาจจะเกินความเข้าใจของ[child.GetFirstNamePossessiveNoTooltip]?\n\n"
 child_personality.forgiving.desc:0 ""ทุกคนทำผิดพลาด!" [child.GetFirstNameNoTooltip] อุทาน "เมื่อข้าปกครอง ข้าจะให้อภัยและปล่อยให้มีชีวิตอยู่ – เพื่อให้อาณาจักรของข้าเจริญรุ่งเรือง!"\n\nบางที[child.GetSheHe]อาจจะเป็นผู้ปกครองที่#EMP ให้อภัย#! มากเกินไป..?"
 child_personality.trusting.desc:0 ""ราษฎรของข้าปรารถนาดีต่อข้าเสมอ!" [child.GetFirstNameNoTooltip] อุทาน "ข้าจะไว้วางใจราษฎรของข้าอย่างไม่เลือกหน้า – เพื่อที่เราจะได้สร้างอาณาจักรร่วมกัน!"\n\nโอ้ เจ้าเด็กน้อยที่น่ารักและถูกหลอกง่าย... ความไว้วางใจระดับนั้นอาจเป็นอันตรายได้..."
 child_personality.patient.desc:0 ""ข้าต้องปล่อยให้สิ่งต่างๆ เป็นไปตามเวลาของมัน" [child.GetFirstNameNoTooltip] กล่าว "เพียงแค่มีความอดทนและปล่อยให้ราษฎรของข้าทำงานตามจังหวะของตนเอง ข้าจึงจะสามารถปกครองได้อย่างชาญฉลาด"\n\n[child.GetFirstNameNoTooltip] ดูเหมือนจะไม่รู้ว่าราษฎรบางคนจะจงใจเสียเวลาของ[child.GetHerHis]..."
 child_personality.7091.forgiving:0 "เพียงแค่การให้อภัยเท่านั้นที่เราจะก้าวต่อไปได้"
 child_personality.7091.trusting:0 "ดี จงขจัดความสงสัยออกจากใจเจ้า!"
 child_personality.7091.patient:0 "ความอดทนจะรับใช้เจ้าได้ดี ลูกเอ๋ย"
 child_personality.7091.change.forgiving:0 "การให้อภัยเป็นคุณธรรมเหนือสิ่งอื่นใด!"
 child_personality.7091.change.trusting:0 "จงไว้วางใจในราษฎรของเจ้า พวกเขาไม่มีวันทำร้ายเจ้า!"
 child_personality.7091.change.patient:0 "จงอดทน ปล่อยให้สิ่งต่างๆ คลี่คลาย แล้วค่อยตัดสิน"
 
 child_personality.7100.t:0 "การบุกรุกคลังอาวุธ"
 child_personality.7100.desc:0 "ในที่สุด เราก็เข้ามาได้! อาวุธทั้งหมดในคลังอาวุธอยู่ในกำมือของเรา โอ้ ช่างสนุกอะไร เช่นนี้! รับไปซะ พวกผู้ใหญ่เหม็นๆ โง่ๆ ที่พยายามกันเราออกไป!\n\n"ดูสิ! ข้าเจอ[other_child.Custom('SignatureWeaponArticle')] [other_child.Custom('signature_weapon')]!" เพื่อนร่วมงานของข้า [other_child.GetFirstName] อุทาน [other_child.Custom('SignatureWeaponActionPresentParticiple')]อาวุธ\n\nขณะที่ข้าเอื้อมมือไปหยิบ[child.Custom('SignatureWeaponArticle')] [child.Custom('signature_weapon')] ข้าได้ยินเสียงดัง#EMP 'โอ๊ย!'#! ข้างหลังข้า – [other_child.GetFirstNameNoTooltip] ทำร้าย[other_child.GetHerselfHimself] และมีเลือดออก!\n\nข้าควรทำอย่างไร?!"
 child_personality.7100.a:0 "เราต้องยอมรับสิ่งที่เราทำลงไป#EMP เดี๋ยวนี้!#!"
 child_personality.7100.b:0 "ช่างมันเถอะ อย่าให้เลือดเปื้อนเสื้อผ้าข้า *[child.Custom('SignatureWeaponFlourishThirdPersonPresentParticiple')|U] [child.Custom('signature_weapon')]*"
 child_personality.7100.c:0 "ข้าต้องไปเอาผ้าพันแผล เดี๋ยยยยยนี้!"
 child_personality.7101.t:0 "$child_personality.7100.t$"
 child_personality.7101.desc:0 "[ROOT.Char.Custom('CulturalCurse')|U]! เด็กพวกนั้นต้องสาป [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('child'))]ของข้า [child.GetFirstName] และเพื่อนร่วมงานของ[child.GetHerHis] [other_child.GetFirstName,] ถูกจับได้คาหนังคาเขาขณะแอบเข้าไปในคลังอาวุธ พวกเขาไม่รู้หรือว่าอาวุธนั้นอันตราย?!\n\n"
 child_personality.honest.desc:0 "[other_child.GetFirstNameNoTooltip] ทำร้าย[other_child.GetHerselfHimself] แต่โชคดีที่[child.GetFirstNameNoTooltip]วิ่งออกไปข้างนอกและคว้าผู้ใหญ่ที่ใกล้ที่สุด ยอมรับทุกสิ่งที่พวกเขาทำลงไป\n\n[child.GetFirstNameNoTooltip] ดูเสียใจอย่างแท้จริง ข้าไม่คิดว่า[child.GetSheHe]จะไม่ซื่อสัตย์อีกต่อไป"
 child_personality.arbitrary.desc:0 "คนรับใช้คนหนึ่งจับพวกเขาได้คาหนังคาเขา [other_child.GetFirstNameNoTooltip] กำลังร้องไห้และเลือดออกบนพื้น ขณะที่[child.GetFirstNameNoTooltip]เพียงแค่เล่นต่อไปด้วย[child.Custom('signature_weapon')]ที่ขโมยมาของ[child.GetHerHis]...\n\nเห็นได้ชัดว่า[child.GetFirstNameNoTooltip]ไม่ต้องการ#EMP 'หยุดสนุกเพียงเพราะ[other_child.GetFirstNameNoTooltip]ทำพลาด'#! จะเกิดอะไรขึ้นกับ[child.Custom('GirlBoy')]คนนั้น..."
 child_personality.impatient.desc:0 "[child.GetFirstNameNoTooltip] ถูกคนรับใช้จับกุมหลังจากที่[child.GetSheHe]ทำชุดเกราะล้มลงขณะมองหาผ้าพันแผลให้[other_child.GetFirstNameNoTooltip] ซึ่งทำร้าย[other_child.GetHerselfHimself]\n\nดูเหมือนว่า[child.GetFirstNameNoTooltip]จะชอบแผนการที่หุนหันพลันแล่นและขาดข้อมูล..."
 child_personality.7101.honest:0 "เป็นการดีที่เจ้ายอมรับในสิ่งที่เจ้าทำ"
 child_personality.7101.arbitrary:0 "เข้าใจได้ ใครจะสน[other_child.GetFirstNameNoTooltip]กันล่ะ?"
 child_personality.7101.impatient:0 "กระโจนเข้าช่วยเพื่อนของเจ้ารึ? น่าชื่นชม!"
 child_personality.7101.change.honest:0 "เจ้าควรจะยอมรับความผิดของเจ้า เจ้าเด็กเหลือขอ!"
 child_personality.7101.change.arbitrary:0 "เจ้าควรจะเล่นต่อไป [other_child.GetFirstNameNoTooltip] เป็นของใช้แล้วทิ้งได้"
 child_personality.7101.change.impatient:0 "ทำไมเจ้าไม่ช่วย[other_child.GetHerHim]#EMP ทันที?!#!"
 
 child_personality.7200.t:0 "ถ้ำมืด"
 child_personality.7200.desc:0 ""เจ้าต้องการ[other_child.Custom('child_favorite_toy')]ของเจ้ารึ? หือ ต้องการรึ? #EMP งั้นก็ไปเอามันมาสิ!#!" [other_child.GetFirstName] ตะโกน พลางโยน[other_child.Custom('child_favorite_toy')]ของ[other_child.Custom('GirlBoy')]ตัวน้อยเข้าไปลึกในถ้ำที่มืดและน่ากลัว [other_child.Custom('GirlBoy')]ตัวน้อยเริ่มร้องไห้อย่างควบคุมไม่ได้\n\n"ตอนนี้มันจะได้อยู่เป็นเพื่อนกับพวก#EMP แมงมุม#! และ#EMP งู#! แล้ว! มันหายไปแล้ว ตลอดกาล!" [other_child.GetFirstNameNoTooltip] อุทาน หัวเราะ\n\nทำไม[other_child.GetFirstNameNoTooltip]ถึงใจร้ายกับ[other_child.Custom('GirlBoy')]ที่น่าสงสารคนนั้นได้ขนาดนี้!? ถ้ำเต็มไปด้วยสัตว์เลื้อยคลานน่าขยะแขยง... แต่ข้า#EMP ต้อง#! ทำอะไรสักอย่าง!"
 child_personality.7200.a:0 "อย่ากลัวไปเลย ข้าจะไปเอา[other_child.Custom('child_favorite_toy')]ของเจ้าคืนมา!"
 child_personality.7200.b:0 "ทหารยาม! #EMP ทำให้#! [other_child.GetFirstNameNoTooltip] เอามันกลับมา"
 child_personality.7200.c:0 "นี่ ทำให้ข้าโกรธมาก! ข้าจะอัดเจ้าให้น่วมเลย!"
 child_personality.7201.t:0 "$child_personality.7200.t$"
 child_personality.7201.desc:0 "เด็กคนหนึ่งในราชสำนัก [other_child.GetFirstName] ได้เอา[other_child.Custom('child_favorite_toy')]ของ[other_child.Custom('GirlBoy')]ที่เด็กกว่าไปโยนทิ้งในถ้ำใกล้ๆ [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('child'))]ของข้าอยู่ที่นั่นและเห็นเหตุการณ์ทั้งหมด\n\n"
 child_personality.brave.desc:0 "[child.GetSheHe|U] วิ่งเข้าไปในถ้ำ และไม่ออกมาเกือบครึ่งชั่วโมง! แต่เมื่อ[child.GetSheHe]ออกมา [child.GetSheHe]ก็ได้ของเล่นคืนมา สร้างความรำคาญให้กับ[other_child.GetFirstNameNoTooltip]อย่างมาก\n\nกล้าหาญมาก แม้ว่าอาจจะค่อนข้างโง่เขลา"
 child_personality.stubborn.desc:0 "[child.GetFirstNameNoTooltip] ไปตามทหารยามประจำบ้านมาและบังคับให้[other_child.GetFirstNameNoTooltip]เข้าไปในถ้ำ! เสียงกรีดร้องด้วยความหวาดกลัวของ[other_child.GetFirstNamePossessiveNoTooltip]ดังอยู่หลายนาทีก่อนที่[other_child.GetSheHe]จะออกมาพร้อมกับของเล่น\n\nดูเหมือนว่าเมื่อ[child.GetFirstName]คิดว่าสิ่งใดเป็นสิ่งที่ถูกต้อง [child.GetSheHe]จะไม่หยุดจนกว่า[child.GetSheHe]จะ ทำให้มันเกิดขึ้น..."
