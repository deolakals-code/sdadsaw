l_english: 
 coming_of_age.0001.t:0 "การบรรลุนิติภาวะ"
 coming_of_age.0001.educator_university:0 "ด้วยความช่วยเหลือของ[educator.GetTitledFirstName]และมหาวิทยาลัย"
 coming_of_age.0001.educator_confucian_education: "ด้วยความช่วยเหลือจากคำสอนแห่งลัทธิขงจื๊อของ [educator.GetTitledFirstName]"
 coming_of_age.0001.educator:0 "ด้วยความช่วยเหลือของ[educator.GetTitledFirstName]"
 coming_of_age.0001.desc1:0 "ข้าสำเร็จการศึกษาในศิลปะแห่ง[ROOT.Char.Custom('education_focus_child')]"
 coming_of_age.0001.desc1_good_trait:0 "แม้ทุกคนจะคาดหวังไว้สูง แต่ข้าก็มิได้ประสบความสำเร็จมากนัก และผลลัพธ์ของข้าก็ยังห่างไกลจากที่หวังไว้มาก"
 coming_of_age.0001.desc1_bad_trait:0 "แม้ว่าผลลัพธ์ที่ข้าทำได้จะยังห่างไกลจากที่หวังไว้มาก แต่มันก็ไม่น่าแปลกใจสำหรับใครเลย อย่างน้อยที่สุด ความน่าเบื่อหน่ายนี้ก็สิ้นสุดลงเสียที!"
 coming_of_age.0001.desc1_fallback_trait:0 "แม้ว่าข้าจะมิได้ประสบความสำเร็จมากนัก แต่ก็เป็นการโล่งใจที่ในที่สุดก็ได้เห็นผลลัพธ์บ้าง"
 coming_of_age.0001.desc2:0 "ในที่สุดข้าก็สำเร็จการศึกษาในศิลปะแห่ง[ROOT.Char.Custom('education_focus_child')]!"
 coming_of_age.0001.desc2_good_trait:0 "ข้าผิดหวังในผลลัพธ์ของตนเอง เพราะข้าคิดว่าข้าน่าจะทำได้ดีกว่านี้"
 coming_of_age.0001.desc2_bad_trait:0 "ข้าทำได้ค่อนข้างดี อย่างน้อยก็เมื่อพิจารณาจากข้อเท็จจริงที่ว่าวิชานี้ไม่ได้เป็นไปตามธรรมชาติสำหรับข้า"
 coming_of_age.0001.desc2_fallback_trait:0 "ความสำเร็จของข้าไม่ได้ยอดเยี่ยม แต่ก็อาจจะแย่กว่านี้ได้"

 coming_of_age.0001.desc3:0 "ข้าสำเร็จการศึกษาใน[ROOT.Char.Custom('education_focus_child')]แล้ว!"
 coming_of_age.0001.desc3_good_trait:0 "แม้ว่าแง่มุมสูงสุดของวิชาจะยังคงเกินความเข้าใจของข้า แต่ข้าก็ทำได้ตามความคาดหวังของทุกคนและเรียนรู้ได้มากกว่าคนส่วนใหญ่!"
 coming_of_age.0001.desc3_bad_trait:0 "แม้ว่าแง่มุมสูงสุดของวิชาจะยังคงเกินความเข้าใจของข้า แต่ข้าก็ท้าทายความคาดหวังต่ำๆ ของทุกคนและเรียนรู้ได้มากกว่าคนส่วนใหญ่!"
 coming_of_age.0001.desc3_fallback_trait:0 "แม้ว่าแง่มุมสูงสุดของวิชาจะยังคงเกินความเข้าใจของข้า แต่ข้าก็ทำได้ดีเยี่ยมทีเดียว"

 coming_of_age.0001.desc4:0 "ข้าบรรลุความเข้าใจใน[ROOT.Char.Custom('education_focus_child')]ที่เหนือกว่าเพื่อนร่วมรุ่นคนใดๆ อย่างมาก"
 coming_of_age.0001.desc4_good_trait:0 "แม้ว่าข้าจะมีพรสวรรค์ตามธรรมชาติในวิชานี้ แต่ความเชี่ยวชาญของข้าก็ยังถือเป็นความสำเร็จ!"
 coming_of_age.0001.desc4_bad_trait:0 "ข้าท้าทายความคาดหวังของทุกคนและบรรลุสิ่งที่ถือว่าเป็นไปไม่ได้สำหรับข้า นั่นคือความเชี่ยวชาญใน[ROOT.Char.Custom('education_focus_child')]!"
 coming_of_age.0001.desc4_fallback_trait:0 "การมาถึงจุดนี้ในวิชานี้เป็นเรื่องที่น่าพึงพอใจอย่างแท้จริง"

 coming_of_age.0001.patronaged_spouse_plus_1.desc:0 "[patronage_spouse_tutor.GetTitledFirstName]ได้ดูแลการศึกษาของข้าและมีส่วนอย่างมากต่อความรู้ของข้าในด้าน[ROOT.Char.Custom('education_focus_child')]"
 coming_of_age.0001.patronaged_spouse_plus_2_or_more.desc:0 "[patronage_spouse_tutor.GetTitledFirstName]ได้ดูแลการศึกษาของข้าและช่วยให้ข้าบรรลุระดับความรู้ที่ข้าไม่เคยแม้ แต่จะฝันถึง"


 coming_of_age.0001.relationships:0 "\n\nขณะที่ข้าก้าวแรกสู่ความเป็นผู้ใหญ่ ข้าพบว่าตนเองกำลังหวนนึกถึงผู้คนบางส่วนที่มีอิทธิพลต่อ[ROOT.Char.GetWomanMan]ที่ข้าเป็นในวันนี้..."
 coming_of_age.0001.friend:0 "\nมิตรภาพที่ข้ามีร่วมกับ[friend.GetFirstName]มีความหมายต่อข้าอย่างยิ่งเมื่อเราทั้งคู่ยังเยาว์วัย และการที่ยังมี[friend.GetHerHim]อยู่เคียงข้างข้าก็มีความหมายมาก เช่นกัน"
 coming_of_age.0001.crush:0 "\nข้ามีช่วงเวลาที่น่าจดจำกับ[crush.GetFirstName] [crush.GetSheHe]ช่วยให้ข้าเข้าใจทั้งตนเองและความรักอย่างแท้จริง"
 coming_of_age.0001.bully1:0 "\nสิ่งที่[bully.GetTitledFirstName]กระทำต่อข้าเมื่อครั้งยังเด็กยังคงหนักอึ้งในใจข้า และทุกครั้งที่ข้าเห็น[bully.GetHerHim] อารมณ์ของข้าก็ขุ่นมัวไปเสียทุกที"
 coming_of_age.0001.bully2:0 "\nสิ่งที่[bully.GetTitledFirstName]กระทำต่อข้าเมื่อครั้งยังเด็กยังคงหนักอึ้งในใจข้า บางครั้งข้ายังคงได้ยินเสียงหัวเราะของ[bully.GetHerHis]ขณะที่[bully.GetSheHe]กระทืบ[ROOT.Char.Custom('child_favorite_toy')]ของข้าจนแหลกละเอียด"
 coming_of_age.0001.victim1:1 "\nข้าสงสัยว่า[victim.GetTitledFirstName]ยังจำสิ่งที่ข้าทำกับ[victim.GetHerHim]เมื่อเรายังเยาว์วัยได้หรือไม่"
 coming_of_age.0001.victim2:0 "\nข้ายังคงจำใบหน้าที่หวาดกลัวของ[victim.GetTitledFirstNamePossessive]ได้ในครั้งนั้นที่ข้าทำลาย[victim.Custom('child_favorite_toy')]ของ[victim.GetHerHis]"
 coming_of_age.0001.relationships_end:0 "\n\nอย่างไรก็ตาม บัดนี้ข้าเป็นผู้ใหญ่แล้ว ข้าต้องทิ้งความเพลิดเพลินแบบเด็กๆ เหล่านี้ไว้เบื้องหลังและมุ่งเน้นไปที่สิ่งที่กำลังจะมาถึง"
 coming_of_age.0001.no_relationships:0 "\n\nเมื่อนึกย้อนไปถึงวัยเด็ก ข้าตระหนักว่าข้าไม่เคยผูกพันกับใครอย่างแท้จริง... แม้ขณะที่ข้าเห็นคนอื่นๆ เล่นกับเพื่อนหรือกระซิบกระซาบเรื่องความรัก ข้าก็ไม่เคยประสบกับสิ่งเหล่านั้นด้วยตนเอง\n\nข้ามั่นใจว่าปีต่อๆ ไปจะนำมา ซึ่งสหายใหม่และโอกาสใหม่ๆ!"

 coming_of_age.0001.a:0 "[ROOT.Char.GetTitledFirstNameNoTooltip] บัดนี้เจ้าเป็น[ROOT.Char.GetWomanMan]แล้ว!"
 coming_of_age.0001.tt.1:1 "เจ้ายังมีอีกมากที่ต้องเรียนรู้ในสาขา[THIS.Char.Custom('education_focus_child')]!\n"
 coming_of_age.0001.tt.2:1 "เจ้ายังมีบางสิ่งที่ต้องเรียนรู้ในสาขา[THIS.Char.Custom('education_focus_child')]\n"
 coming_of_age.0001.tt.3:1 "เจ้าทำได้ค่อนข้างดีในสาขา[THIS.Char.Custom('education_focus_child')]!\n"
 coming_of_age.0001.tt.4:1 "เจ้าทำได้ยอดเยี่ยมในสาขา[THIS.Char.Custom('education_focus_child')]!\n"
 coming_of_age.0001.tt.5:2 "เจ้าจะไม่ลืมความชอบพอที่มีต่อ[crush.GetFirstNameNoTooltip]: #P +20 ความเห็น#!"
 coming_of_age.0001.tt.7:1 "เจ้าจะไม่ลืม[victim.GetTitledFirstNameNoTooltip]ในเร็วๆ นี้: #N -5 ความเห็น#!"
 coming_of_age.0001.tt.9:1 "เจ้าจะไม่ลืม[bully.GetTitledFirstNameNoTooltip]ในเร็วๆ นี้: #N -10 ความเห็น#!"

 coming_of_age.1001.t:0 "[educated_child.GetFirstNameNoTooltip] บรรลุนิติภาวะ"
 coming_of_age.1001.desc_university:0 "เมื่อ[educated_child.GetHerHis]บรรลุนิติภาวะ เวลาที่[educated_child.GetFirstName]จะใช้ในมหาวิทยาลัยก็สิ้นสุดลง\n\n[educated_child.Custom('GoodOrBadChildhoodTraitMatch')] [educated_child.Custom('DescribingEducationOutcome')]"
 coming_of_age.0001.desc_confucian_education: "เมื่อ [educated_child.GetHerHis] บรรลุนิติภาวะ, [educated_child.GetFirstName] ก็พร้อมแล้วที่จะเผยแผ่คำสอนแห่งลัทธิขงจื๊อ\n\n[educated_child.Custom('GoodOrBadChildhoodTraitMatch')] [educated_child.Custom('DescribingEducationOutcome')]"
 coming_of_age.1001.desc:0 "เมื่อ[educated_child.GetHerHis]บรรลุนิติภาวะ การสอนของข้าต่อ[educated_child.GetFirstName]ก็สิ้นสุดลง\n\n[educated_child.Custom('GoodOrBadChildhoodTraitMatch')] [educated_child.Custom('DescribingEducationOutcome')]"
 coming_of_age.1001.patronaged_spouse_plus_1.desc:0 "\n\nการมีส่วนร่วมของ[patronage_spouse_tutor.GetTitledFirstNamePossessive]ต่อการศึกษาของ[educated_child.GetFirstNamePossessive]นั้นไม่อาจไม่กล่าวถึงได้ การชี้แนะของ[patronage_spouse_tutor.GetHerHis|U]ได้ช่วยให้เด็กก้าวไปได้ไกลกว่าที่ข้าจะทำได้เพียงลำพัง"
 coming_of_age.1001.patronaged_spouse_plus_2_or_more.desc:0 "\n\n[patronage_spouse_tutor.GetTitledFirstName]ยังได้ให้การชี้แนะอันล้ำค่าแก่เด็กอีกด้วย [educated_child.GetFirstName]คงไม่มีวันมาถึงจุดนี้ได้หากปราศจาก[patronage_spouse_tutor.GetHerHim]"
 coming_of_age.1001.a:0 "พวกเขาเติบโตเร็วเหลือเกิน"

 coming_of_age.1002.t:0 "[educated_child.GetFirstNameNoTooltip] บรรลุนิติภาวะ"
 coming_of_age.1002.desc:0 "ข้าภูมิใจที่เห็น[educated_child.Custom('GetDaughterSon')]ของข้าไม่ได้เป็นเด็กอีกต่อไป แต่เป็นผู้ใหญ่แล้ว\n\n[educated_child.Custom('GoodOrBadChildhoodTraitMatch')] [educated_child.Custom('DescribingEducationOutcome')]"
 coming_of_age.1002.patronaged_spouse_plus_1.desc:0 "\n\nการมีส่วนร่วมของ[patronage_spouse_tutor.GetTitledFirstNamePossessive]ต่อการศึกษาของ[educated_child.GetFirstNamePossessive]นั้นไม่อาจไม่กล่าวถึงได้ บทเรียนของ[patronage_spouse_tutor.GetHerHis|U]ได้มอบความรู้อันล้ำค่าแก่[educated_child.GetFirstName]สำหรับชีวิตในอนาคตของ[educated_child.GetHerHis]"
 coming_of_age.1002.patronaged_spouse_plus_2_or_more.desc:0 "\n\n[patronage_spouse_tutor.GetTitledFirstName]ได้ให้การชี้แนะอันล้ำค่าแก่เด็ก [educated_child.GetFirstName]คงไม่มีวันมาถึงจุดนี้ได้หากปราศจาก[patronage_spouse_tutor.GetHerHim]"
 
 coming_of_age.1003.t:0 "การศึกษาสิ้นสุดลง"
 coming_of_age.1003.standard:0 "เด็กในอุปถัมภ์ของข้า [educated_child.GetTitledFirstName] ได้บรรลุนิติภาวะแล้ว และถึงเวลาที่[educated_child.GetSheHe]จะออกจากการดูแลของข้า\n\n[educated_child.Custom('GoodOrBadChildhoodTraitMatch')] [educated_child.Custom('DescribingEducationOutcome')]"
 coming_of_age.1003.rank_1:0 "\n\nข้ามั่นใจว่าบิดามารดาของ[educated_child.GetHerHis]คงจะยินดีที่การศึกษาของ[educated_child.GetHerHis]เสร็จสมบูรณ์"
 coming_of_age.1003.rank_2:0 "\n\nแม้จะไม่ใช่ผลลัพธ์ที่ยอดเยี่ยม แต่ข้ามั่นใจว่าบิดามารดาของ[educated_child.GetHerHis]จะไม่มีข้อตำหนิใดๆ"
 coming_of_age.1003.rank_3:0 "\n\nข้ามั่นใจว่าบิดามารดาของ[educated_child.GetHerHis]จะพอใจกับการสอนของข้า"
 coming_of_age.1003.rank_4:0 "\n\nบิดามารดาของ[educated_child.GetHerHis|U]จะต้องภูมิใจอย่างแน่นอนที่เรียก[educated_child.GetHerHim]ว่าเป็น[educated_child.Custom('GetDaughterSon')]ของพวกเขา!"
 coming_of_age.1003.a:0 "จนกว่าเราจะพบกันใหม่ [educated_child.GetFirstNameNoTooltip]"

 coming_of_age.0003.desc_child_start:1 "การฝึกฝน$knight_culture_player_adjective_no_tooltip_lowercase$ของข้าควบคู่ไปกับสิ่งนี้ "
 coming_of_age.0003.desc_child_1:0 "ดำเนินไปได้ไม่ดีนัก และข้าเรียนรู้เพียงเล็กน้อยจากครูฝึกการต่อสู้ของข้า"
 coming_of_age.0003.desc_child_2:0 "ดำเนินไปอย่างพอรับได้ และข้าได้ต่อสู้กับชาวนาหัวสูงบางคนด้วยความสำเร็จอยู่บ้าง"
 coming_of_age.0003.desc_child_3:0 "ประสบความสำเร็จ และข้าได้สังหารโจรมากมายแม้จะยังเยาว์วัย"
 coming_of_age.0003.desc_child_4:1 "ยอดเยี่ยม ทำให้ข้าเป็นหนึ่งใน$knight_culture_player_plural_no_tooltip_lowercase$ชั้นแนวหน้าของอาณาจักร"

 coming_of_age.1004.t:0 "การศึกษาสิ้นสุดลง"
 coming_of_age.1004.desc:0 "เด็กในอุปถัมภ์ของข้า [educated_child.GetTitledFirstName] ได้บรรลุนิติภาวะแล้ว และถึงเวลาที่[educated_child.GetSheHe]จะออกจากการดูแลของข้า\n\n[educated_child.Custom('GoodOrBadChildhoodTraitMatch')] [educated_child.Custom('DescribingEducationOutcome')]"
 coming_of_age.1004.a:0 "จนกว่าเราจะพบกันใหม่ [educated_child.GetFirstNameNoTooltip]"

 coming_of_age.1005.t:0 "การศึกษาสิ้นสุดลง"
 coming_of_age.1005.desc:0 "เด็กในอุปถัมภ์ของข้า [educated_child.GetTitledFirstName] ได้บรรลุนิติภาวะแล้ว และถึงเวลาที่[educated_child.GetSheHe]จะออกจากการดูแลของข้า\n\n[educated_child.Custom('GoodOrBadChildhoodTraitMatch')] [educated_child.Custom('DescribingEducationOutcome')] [educated_child.Custom('DescribingEducationOutcomeProwess')]"
 coming_of_age.1005.a:0 "จนกว่าเราจะพบกันใหม่ [educated_child.GetFirstNameNoTooltip]"

 coming_of_age.3011.t: "เป็นมากกว่าในนาม"
 coming_of_age.3011.desc: "นับตั้งแต่ข้าได้รับการ แต่งตั้งเป็น[senior_emp.GetDiarchTitle]โดย[junior_emp.MakeScope.Var('co_emp_appointer').Char.Custom2('MyCharacterIntroduction', junior_emp)] ข้าก็รู้ว่าวันนี้จะต้องมาถึง\n\nบัดนี้ข้าเป็น[junior_emp.GetWomanMan]แล้ว และนั่นหมายความว่าอำนาจที่ข้าถือครองมิได้เป็นเพียงในนามอีกต่อไป เมื่อข้าเอ่ยปาก [senior_emp.GetPrimaryTitle.GetDefinitiveName]ก็รับฟัง และเมื่อข้าบัญชา มันก็ปฏิบัติตาม\n\nนี่คือก้าวแรกที่แท้จริงของข้าบนเส้นทางสู่บัลลังก์"
 coming_of_age.3011.a: "นี่คือชะตาของข้า!"
 coming_of_age.3011.b: "ช่างเป็น#EMP ชั่วชีวิต#! ที่รอคอย..."
 coming_of_age.3011.c: "ข้าหวังว่าข้าจะพร้อมสำหรับสิ่งนี้"
 coming_of_age.3011.tt.fake_diarchy_transition: "[power_sharing|E]ของ[senior_emp.GetShortUINamePossessive|U]เปลี่ยนผ่านสู่[duumvirate|E]"
 coming_of_age.3011.tt.various_new_powers: "[CharWereWas(junior_emp)|U]ได้รับสิทธิ์เข้าถึง[diarch_powers|E]ใหม่ๆ มากมาย"
 coming_of_age.3011.tt.convert_sop_swing: "รักษา['50%'|P]ของความเปลี่ยนแปลง[scales_of_power|E]ที่[CharYouSheHe(junior_emp)]ได้รับในช่วงวัยเด็กไว้"
