 coming_of_age.3012.t: "$coming_of_age.3011.t$"
 coming_of_age.3012.desc.intro: "ในที่สุดวันนั้นก็มาถึง: [junior_emp.Custom2('MyCharacterIntroduction', senior_emp)]เป็น[junior_emp.GetWomanMan]อย่างแท้จริงแล้ว พร้อมที่จะรับตำแหน่ง[junior_emp.GetHerHis]ในฐานะบุคคลที่ทรงอำนาจเป็นอันดับสองใน[senior_emp.GetPrimaryTitle.GetDefinitiveName]ทั้งหมด\n\nรองจากข้า แน่นอน\n\nแม้ว่า[senior_emp.GetDiarchTitle]ที่ยังเยาว์วัยจะมีสิทธิ์มีเสียงเพียงเล็กน้อยเกี่ยวกับสถานะของอาณาจักร แต่เมื่อพวกเขาเติบโตเข้าสู่บทบาทของตนแล้ว ก็มีเพียงไม่กี่สิ่งที่พวกเขา#EMP ไม่สามารถ#! กล่าวถึงได้\n\n"
 coming_of_age.3012.desc.senior_emp_appointed_junior_emp: "ข้าได้ แต่หวังว่าข้าได้เลือกอย่างชาญฉลาด "
 coming_of_age.3012.desc.junior_emp_appointed_elsewhere: "ข้าได้ แต่หวังว่า[junior_emp.MakeScope.Var('co_emp_appointer').Char.GetFirstName]ได้เลือกอย่างดี "
 coming_of_age.3012.desc.outro: "ในการยก[junior_emp.GetHerHim]ขึ้นสู่ตำแหน่งอันสูงส่งนี้"
 coming_of_age.3012.a: "สีม่วงเรียกร้องจากเรามากมาย..."
