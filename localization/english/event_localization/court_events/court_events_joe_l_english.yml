# # Prandial Excess
 court.8150.t:0 "ความฟุ่มเฟือยเรื่องอาหาร"
 court.8150.desc.intro:0 "ดูเหมือนว่า แต่ละวันราชสำนักของข้าพเจ้าจะเต็มไปด้วยการพูดคุยเกี่ยวกับงานเลี้ยงครั้งต่อไป และหลายคนก็อ้วนท้วนขึ้นมากเมื่อเร็วๆ นี้..."
 court.8150.desc.taster:0 "\n\n[food_taster.GetTitledFirstName] $food_taster_court_position$ ของข้าพเจ้า ดูเหมือนจะเฉื่อยชามากขึ้นใน แต่ละครั้ง เหงื่อออกมากขึ้นเมื่ออาหารแปลกใหม่ แต่ละอย่างถูกยกขึ้นไปที่ปากของ [food_taster.GetHerHis] \n\n"
 court.8150.desc.body:0 "กิจกรรมการทำอาหารนี้ถูกกระตุ้นโดยการแข่งขันกันตลอดเวลาของ [vassal_1.GetTitledFirstName] [vassal_2.GetTitledFirstName] และ [vassal_3.GetTitledFirstNamePossessive] ที่จะเรียกร้องมื้ออาหารที่น่าจดจำที่สุดจากพ่อครัวที่ทำงานหนักเกินไปของข้า \n\nวันนี้เป็นตาของ [demander.GetFirstNameNoTooltip] [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('demander'))] ของข้า ที่พูดพลางน้ำลายสอว่า "[ROOT.Char.Custom('FormOfAddressForLiege')|U] คืนนี้ข้าจะให้ห้องครัวเตรียมซอสที่เข้มข้นที่สุดเท่าที่มนุษย์รู้จัก เสิร์ฟพร้อมกับนกย่างสิบตัว" พลางเลียริมฝีปาก [demander.GetHerHis] อย่างหิวกระหาย \n\n"
 court.8150.desc.almoner_chaplain:0 "$high_almoner_court_position$ ของข้าพเจ้า [high_almoner.GetTitledFirstName] และ [chaplain.GetCouncilTitleFirstName] ทำเสียงจุ๊ๆ ส่ายหัวด้วยความรังเกียจอย่างไม่ปิดบัง"
 court.8150.desc.chaplain:0 "[chaplain.GetCouncilTitleFirstName] ถอนหายใจอย่างไม่เห็นด้วย "ความสุขชั่วครู่เหล่านี้เทียบไม่ได้เลยกับพระคุณของ [chaplain.GetFaith.HighGodNamePossessive]...""
 court.8150.desc.almoner:0 "[high_almoner.GetTitledFirstName] $high_almoner_court_position$ ของข้า ทำจมูก [high_almoner.GetHerHis] ฟุดฟิด พลางพึมพำเกี่ยวกับคนยากจนผู้หิวโหย..."
 court.8150.a:0 "ข้ารอไม่ไหวแล้ว!"
 court.8150.b:0 "สิ่งที่ดีที่สุดเท่านั้นสำหรับราชสำนัก #EMP ของข้า#! "
 court.8150.c:0 "ความฟุ่มเฟือยนี้เกินเลยไปแล้ว!"
 court.8150.d:0 "พวกเจ้าจะไม่พอใจเลยหรือ?"
 court.8150.a.tt: "หล่อหลอมในไฟแห่งอาหารนับพัน ความกล้าหาญของ [food_taster.GetTitledFirstNamePossessiveNoTooltip] ได้รับการทดสอบ และ [food_taster.GetSheHe] ก็ได้รับชัยชนะและแข็งแกร่งขึ้น: [aptitude|E] เพิ่มขึ้น"
 food_taster_mettle_tested_desc: "ทดสอบความกล้าหาญ"
 court.8150.b.tt: "เนื่องจากราชสำนักหยุดกินมากเกินไป [high_almoner.GetTitledFirstNameNoTooltip] จึงมีเสบียงอาหารเกือบไม่สิ้นสุดเพื่อบริจาคให้กับคนจน: [aptitude|E] เพิ่มขึ้น"
 plenty_to_donate_almoner_desc: "มีมากมายให้บริจาค"
 # # Foremost Knight
 court.8160.t:0 "[ROOT.Char.Custom('MountedWarriorTerm')|U] แถวหน้า"
 court.8160.desc.intro:0 "การแข่งขันกันฉันมิตรระหว่างนักสู้ผู้กล้าหาญเป็นเรื่องที่คาดหวังได้ แต่ความขัดแย้งที่เพิ่มขึ้นระหว่าง [knight_1.GetFirstName] และ [knight_2.GetFirstName] กำลัง ทำให้บรรยากาศในราชสำนักขุ่นมัว \n\n[knight_1.GetTitledFirstNameNoTooltip] ได้รับการยอมรับอย่างกว้างขวางว่ามีฝีมือมากกว่า แต่ [knight_2.GetTitledFirstNameNoTooltip] ไม่เห็นด้วยกับคำกล่าวนั้นอย่างชัดเจน \n\nในระหว่างการเข้าเฝ้า คนหลังก็บุกเข้ามาในห้องบัลลังก์ของข้า และกุมด้ามดาบของ [knight_2.GetHerHis] พลางร้องว่า "[knight_1.GetFirstNameNoTooltip]! มีเพียงหนึ่งเดียวในพวกเราเท่านั้นที่สามารถอ้างได้ว่าเป็น [ROOT.Char.Custom('MountedWarriorTerm')] ที่เก่งกาจที่สุดของ [ROOT.Char.GetTitleAsNamePossessiveNoTooltip] ออกมาพบข้าข้างนอก แล้วข้าจะตัดสินปัญหานี้!"\n\n[knight_1.GetTitledFirstNameNoTooltip] ตอบกลับ [knight_2.Custom('quirk_neg_adverb')] "ข้าคงจะฟันเจ้าเป็นชิ้นๆ ตรงที่เจ้ายืนอยู่ หากไม่ใช่ เพราะการประทับอยู่ของ [ROOT.Char.GetTitleAsNameNoTooltip] ของข้า เจ้า[knight_2.Custom2('InsultNoun', SCOPE.sC('knight_1'))] [knight_2.Custom('quirk_neg_adjective')]! ขอโทษมา แล้วข้าอาจจะไว้ชีวิตเจ้า!" \n\nข้าควรดำเนินการอย่างรวดเร็วหากต้องการหยุดยั้งการบานปลายนี้..."
 court.8160.a:0 "เจ้าทั้งสองจะรับใช้ข้าโดยตรง"
 court.8160.a.tt: "การแข่งขันของ [knight_1.GetFirstNameNoTooltip] และ [knight_2.GetFirstNamePossessiveNoTooltip] ทำให้มั่นใจได้ว่า ตราบใดที่พวกเขาทั้งคู่ได้รับการว่าจ้าง พวกเขาจะทุ่มเทอย่างเต็มที่ในตำแหน่งของตน: [aptitude|E] เพิ่มขึ้น"
 competing_knight_position_desc: "อัศวินคู่แข่ง"
 court.8160.a.tt_knight_1:0 "[knight_1.GetTitledFirstNameNoTooltip] ชนะการประลอง"
 court.8160.a.tt_knight_2:0 "[knight_2.GetTitledFirstNameNoTooltip] ชนะการประลอง"
 court.8160.b:0 "ยึดดาบของพวกเขา! ให้ดาบฝึกแก่พวกเขา"
 court.8160.c:0 "ข้าจะ ทำให้เจ้าทั้งสองอ่อนน้อมลง!"
 court.8160.c.tt:0 "ท่านจะต่อสู้ตัวต่อตัวกับ [knight|E] ที่มี [prowess|E] สูงกว่า ([knight_1.GetTitledFirstName])"
 court.8160.c.tt_win:0 "ท่านเป็นผู้ชนะ"
 court.8160.c.tt_lose:0 "ท่านพ่ายแพ้"
 court.8160.d:0 "พิสูจน์ให้ข้าเห็นในสนามรบ ไม่ใช่ในราชสำนัก!"
 court.8163.t:0 "ท่านชนะการประลอง"
 court_humiliation_modifier:0 "ความอัปยศในราชสำนัก"
 court_humiliation_modifier_desc:0 "ตัวละครนี้ถูกบ่อนทำลายต่อหน้าข้าราชสำนักทั้งหมด"
 court.8162.tt: "หลังจากพิสูจน์ความเหนือกว่าของ [sc_victor.GetHerHis] ในการประลองที่ยุติธรรม [sc_victor.GetFirstNameNoTooltip] ได้รับการยอมรับว่าเป็น [ROOT.Char.Custom('MountedWarriorTerm')] ที่ดีกว่าและมีคุณสมบัติเหมาะสมที่สุดที่จะเป็น $bodyguard_court_position$ หรือ $champion_court_position$ ของท่าน: [aptitude|E] เพิ่มขึ้น"
 best_knight_position_desc: "สุดยอดอัศวิน"
 fostering_competitiveness_modifier: "ส่งเสริมการแข่งขัน"
 fostering_competitiveness_modifier_desc: "ตัวละครนี้ส่งเสริมการแข่งขันในหมู่กองทหารในสนามรบ"
 # # Pariah of Court
 court.8170.t:0 "ผู้ถูกขับไล่จากราชสำนัก"
 court.8170.desc.intro_scary:0 "เด็กๆ ในราชสำนักหนีไปเมื่อ '[criminal.GetFirstName] ผู้ [criminal.Custom('GetCrime')|U]' เข้ามาใกล้ และแม้ แต่ [ROOT.Char.GetFaith.BishopNeuterPlural] ที่เคร่งศาสนาที่สุดก็อดไม่ได้ที่จะถอยห่างจากการปรากฏตัวของ [criminal.GetHerHis]"
 court.8170.desc.intro_sordid:0 "'[criminal.GetFirstName] ผู้ [criminal.Custom('GetCrime')|U]' เป็นบุคคลที่ถูกดูหมิ่นในราชสำนัก ถูกหลอกหลอนด้วยการกีดกันทางสังคมและเป็นเป้าของเรื่องตลกสกปรกมากมาย"
 court.8170.desc.intro_religious:0 "ข้าพเจ้าถูกตัดสินอย่างรุนแรงสำหรับการต้อนรับ '[criminal.GetFirstName] ผู้ [criminal.Custom('GetCrime')|U]' ซึ่งเกือบทุกคนหลีกเลี่ยง เนื่องจากศรัทธาอันชั่วร้ายของพวกเขา"
 court.8170.desc.intro_fallback:0 "ราชสำนักของข้าพเจ้าไม่สามารถทนต่อข้อแก้ตัวใดๆ สำหรับการต้อนรับ '[criminal.GetFirstName] ผู้ [criminal.Custom('GetCrime')|U]' ซึ่งถูกมองว่าเป็นความผิดปกติในสถานที่อันโดดเด่นแห่งนี้"
 court.8170.desc.body:0 "\n\nความล้มเหลวของข้าพเจ้าในการประณาม และความใกล้ชิดอย่างต่อเนื่องกับ [criminal.Custom('GetCrimeDesc')] นี้ ถูกมองว่าเป็นการยอมรับอย่างเปิดเผย ทำให้ชื่อเสียงของราชสำนักของข้าพเจ้ามัวหมองในสายตาของ [ROOT.Char.GetFaith.AltPriestTermPlural] และผู้ศรัทธา...\n\nพวกเขาได้บีบบังคับข้าพเจ้า และตอนนี้ข้าพเจ้าต้องตัดสินใจว่าอาชญากรรมของ [ROOT.Char.Custom2('RelationToMePossessive', SCOPE.sC('criminal'))] ของข้าพเจ้ามีน้ำหนักมากกว่าความรักที่ข้าพเจ้ามีต่อ [criminal.GetHerHim] หรือไม่ — แน่นอนว่าต้องทำอะไรบางอย่าง,"
 court.8170.desc.family:0 "แม้ว่า [criminal.GetSheHe] จะเป็นชาว [criminal.GetDynasty.GetNameNoTooltip]..."
 court.8170.desc.guest:0 "[criminal.GetSheHe] เป็นเพียงนักเดินทางเท่านั้น"
 court.8170.desc.fallback:0 "ข้าราชสำนักหายากขนาดนั้นจริงๆ หรือ?"
 court.8170.a.family:0 "ไม่ — ครอบครัวต้องมาก่อน"
 court.8170.a.other:0 "ไม่ใช่หน้าที่ของข้าพเจ้าที่จะตัดสิน"
 court.8170.b:0 "เจ้าต้องสำนึกผิด [criminal.GetFirstNameNoTooltip]!"
 court.8170.c1: "[criminal.GetSheHe|U] ผู้ล้มเหลวในการเห็นความยุติธรรม จะไม่ได้เห็นอีกต่อไป!"
 court.8170.c2: "สายเลือดต้องสาปของ [criminal.GetFirstNamePossessiveNoTooltip] จะสิ้นสุดลงที่เขา"
 court.8170.c3: "มีเพียงความตายเท่านั้นที่สามารถชำระล้างอาชญากรรมของ [criminal.GetHerHis] ได้"
 court.8170.d:0 "ข้าพเจ้าไม่สามารถต้อนรับท่านได้อีกต่อไป [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('criminal'))]..."
 harbors_criminals_modifier:0 "ผู้พิทักษ์ตัวละครที่น่าสงสัย"
 harbors_criminals_modifier_desc:0 "ตัวละครนี้ไม่ทำอะไรเลยเพื่อนำอาชญากรในราชสำนักของตนเข้าสู่กระบวนการยุติธรรม พวกเขามีประโยชน์ของพวกเขาอยู่แล้ว"
 fast_hard_justice_modifier: "ความยุติธรรมที่รวดเร็วและรุนแรง"
 fast_hard_justice_modifier_desc:0 "ตัวละครนี้มีชื่อเสียงในการจัดการกับอาชญากรอย่างมีประสิทธิภาพ"
 # # Secrets and Lies
 court.8180.t:0 "ความลับและความเท็จ"
 court.8180.desc.intro:0 "วันเวลาผ่านไปโดยที่ข้าพเจ้าไม่ได้คิดถึงเรื่องนี้เลย แต่ทุกครั้งที่ข้าพเจ้าสบตากับ [criminal.GetTitledFirstNamePossessive] ในราชสำนัก ข้าพเจ้าก็คิดถึง แต่เรื่องอาชญากรรมของ [criminal.GetHerHis] \n\nข้าพเจ้าสงสัยว่ามีกี่คนที่ราชสำนักรู้ — บางทีอาจไม่มีใครรู้เลย? บางทีอาจจะทุกคน... ความจริงจะปรากฏในที่สุด และมันจะไม่เป็นผลดีต่อชื่อเสียงของข้าพเจ้าเลยที่จะมีเรื่องอื้อฉาว เช่นนี้ท่ามกลางข้าราชสำนักของข้าพเจ้า... \n\n[criminal.GetSheHe|U] ต้องถูกจัดการ มิฉะนั้นข้าพเจ้าจะต้องเผชิญหน้ากับ [ROOT.Char.GetFaith.HighGodName] ไม่ต้องพูดถึงราชสำนักเลย"
 court.8180.a:0 "พอแล้ว โลกต้องรู้"
 court.8180.b:0 "มีเพียงคนโง่เท่านั้นที่จะไม่ใช้ประโยชน์จากความรู้นี้"
 court.8180.c:0 "[criminal.GetSheHe|U] สมควรอยู่ในคุก"
 court.8180.d:0 "ถึงเวลาที่ [criminal.GetHerHim] ต้องไปแล้ว"
 court.8180.e:0 "ยังไม่จำเป็นต้องดำเนินการ..."
 liege_scrutiny_modifier: "ภายใต้การตรวจสอบของเจ้าเหนือหัว"
 liege_scrutiny_modifier_desc: "เจ้าเหนือหัวของตัวละครนี้กำลังจับตาดูพวกเขาอย่างใกล้ชิด — และกิจกรรมลับของพวกเขา"
 court_without_secrets_modifier: "ราชสำนักที่ไม่มีความลับ"
 court_without_secrets_modifier_desc: "ตัวละครนี้มีชื่อเสียงในการตามล่าหาความลับและลงโทษอาชญากรรมอย่างไม่หยุดยั้ง"
