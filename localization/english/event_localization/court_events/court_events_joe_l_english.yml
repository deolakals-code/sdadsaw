l_english: 
 # # Trampled Underfoot
 court.8001.t:0 "ถูกเหยียบย่ำ"
 court.8001.desc.intro:1 ""ข้าบอกเจ้ากี่ครั้งแล้วว่าให้อยู่ #EMP ห่าง#! จาก #EMP ดอก[ROOT.Char.GetCapitalLocation.Custom('get_region_flower_type_plural')]ที่เพิ่งปลูกใหม่?!#!"\n\n[child_1.Custom2('MyCharacterIntroduction', ROOT.Char)|U] ปรากฏตัวขึ้น เนื้อตัวเปรอะเปื้อนไปด้วยกลีบดอกไม้และดิน ถูกไล่ตามมาโดยคนสวนของข้าพเจ้า [gardener.GetTitledFirstName]\n\n[child_1.GetFirstNameNoTooltip] ร้องไห้พลางกล่าวว่า,"
 court.8001.desc.diplomacy:0 ""พวกเขาไล่ตามข้าพเจ้า! ข้าพเจ้าไม่เคยแพ้เกม #EMP นี้#!!""
 court.8001.desc.martial:0 ""ข้าพเจ้าเพียงแค่ซ่อนตัวจากทหาร... เราต้องซุ่มโจมตีพวกเขาเพื่อชนะการรบ!""
 court.8001.desc.stewardship:0 ""ไม่ใช่ความผิดของข้าพเจ้า! [gardener.GetSheHe|U] วางมันไว้บนปราสาทเล็กๆ ของเรา!""
 court.8001.desc.intrigue:0 ""เรากำลังเล่นซ่อนหา ไม่มีใครหาข้าพเจ้าเจอหรอก ถ้าไม่ใช่ เพราะ #EMP [gardener.GetHerHim]#!!""
 court.8001.desc.learning:0 ""ข้าพเจ้าแค่ดูเท่านั้น! คราวนี้พวกมันมีสีต่างออกไป!""
 court.8001.desc.fallback:0 ""ข้าพเจ้าไม่ได้ทำอะไรเลย! ข้าพเจ้าแค่เล่นอยู่!""
 court.8001.desc.closing: "\n\n[gardener.GetFirstNameNoTooltip] จ้องเขม็ง "เจ้า[child_1.Custom('GirlBoy')] ตัวแสบนั่นเหยียบย่ำ #EMP ทั้งหมด#! งานหนักของข้า [ROOT.Char.Custom('FormOfAddressForLiege')]! มันต้องใช้เวลา #EMP หลายสัปดาห์#! เพื่อแก้ไขความเสียหาย...""
 court.8001.a.diplomacy:0 "บางครั้งการถูกจับได้ก็คุ้มค่า ลูก [child_1.Custom('GirlBoy')] ของข้า"
 court.8001.a.martial:0 "อา แต่เจ้าต้องเลือกสมรภูมิของเจ้า ลูก [child_1.Custom('GirlBoy')] ของข้า!"
 court.8001.a.stewardship:0 "ข้ารู้จุดที่ดีกว่าในการสร้างราชสำนักอันยิ่งใหญ่ของเจ้า ลูก [child_1.Custom('GirlBoy')] ของข้า"
 court.8001.a.intrigue:0 "เคล็ดลับคืออย่าให้ถูกจับได้ ลูก [child_1.Custom('GirlBoy')] ของข้า"
 court.8001.a.learning:0 "เจ้าสามารถเรียนรู้จากระยะไกลได้ เช่นกัน ลูก [child_1.Custom('GirlBoy')] ของข้า"
 court.8001.a.lesson_tt:0 "[child_1.GetFirstNameNoTooltip] เข้าใจประเด็นของท่าน"
 court.8001.b.gardener:0 "ไม่! #EMP ไม่ใช่#! แปลงดอกไม้..."
 court.8001.b.poet:0 "ความงามอันบอบบาง ถูกบดขยี้โดยคนโง่เง่าซุ่มซ่ามเสมอ..."
 court.8001.c:0 "[child_1.GetFirstNameNoTooltip] จะช่วยปลูกพวกมันใหม่ ทั้งหมด"
 court.8001.c.gardener_tt:0 "[child_1.GetFirstNameNoTooltip] มีพรสวรรค์ด้านการปลูกต้นไม้"
 court.8001.d:0 "เจ้า #EMP กล้าดี#! อย่างไรมาปฏิบัติต่อ [child_1.GetFirstNameNoTooltip] เช่นนั้น?!"
 court.8001.e:0 "เด็กๆ จะเล่นที่ไหนก็ได้ตามใจชอบ [gardener.GetFirstNameNoTooltip]"
 court.8001.a.success: "ท่านได้มอบปัญญาบางส่วน"
 court.8001.a.failure: "ท่านไม่ได้ช่วยอะไร"
# # Underequipped
 court.8010.t:0 "ขาดแคลนยุทโธปกรณ์"
 court.8010.desc.intro:0 "ข้ากำลังเพลิดเพลินกับช่วงเวลาเงียบสงบที่หาได้ยากระหว่างการประชุมสภา เมื่อ [underequipped.GetTitledFirstName] ดึงข้าไปข้างๆ \n\n"[ROOT.Char.Custom('FormOfAddressForLiege')|U]..." [underequipped.GetSheHe] เริ่มอย่างระมัดระวัง"
 court.8010.desc.champion:0 ""ในฐานะยอดนักรบของท่าน ข้าพเจ้าภูมิใจที่ได้เป็นตัวแทนของท่าน,"
 court.8010.desc.bodyguard:0 ""ในฐานะองครักษ์ของท่าน ข้าพเจ้ารู้สึกเป็นเกียรติที่ได้ปกป้องท่าน,"
 court.8010.desc.knight: "ในฐานะ [ROOT.Char.Custom('KnightCultureNoTooltipLowercase')] ของท่าน เป็นหน้าที่อันศักดิ์สิทธิ์ของข้าพเจ้าที่จะต่อสู้ในศึกสงครามของท่าน,"
 court.8010.desc.bold:0 "แต่นี่มันน่าขันสิ้นดี!" \n\n[underequipped.GetSheHe|U] ชักดาบของ [underequipped.GetHerHis] ออกจากฝักครึ่งหนึ่ง ดึงความสนใจไปที่รอยบิ่นและหลุมจำนวนมาก "ข้าพเจ้าไม่สามารถคาดหวังให้ทำงานของข้าพเจ้าด้วยแท่งเหล็กเทอะทะนี้ได้!""
 court.8010.desc.meek:0 "แต่..." \n\n[underequipped.GetSheHe|U] ดูลังเลอยู่ครู่หนึ่ง จากนั้นก็ทำท่าทางอ่อนแรง แต่ระอาใจด้วยฝักดาบของ [underequipped.GetHerHis]: "ข้าพเจ้าจะทำงานของข้าพเจ้าด้วยของเก่านี้ได้อย่างไร?""
 court.8010.desc.body:0 "\n\n"แน่นอนว่าคุณภาพคือทุกสิ่งเมื่อเป็นเรื่องของ"
 court.8010.desc.champion_end:0 "การกระทำการในนามของ [ROOT.Char.GetTitleAsNamePossessiveNoTooltip]!""
 court.8010.desc.bodyguard_end:0 "การปกป้องชีวิตของ [ROOT.Char.GetTitleAsNamePossessiveNoTooltip]!""
 court.8010.a:0 "ยอดฝีมือ [underequipped.GetWomenMen] ของข้าพเจ้าต้องการอาวุธที่มีคุณภาพ!"
 court.8010.a.tt:0 "อาวุธคุณภาพดีที่ [underequipped.GetTitledFirstNamePossessiveNoTooltip] เลือกจะถูกตีขึ้นสำหรับ [underequipped.GetHerHim]"
 court.8010.a.equipped_tt:0 "อาวุธชั้นดีถูกตีขึ้นสำหรับ [underequipped.GetTitledFirstName]"
 court.8010.c:0 "ข้าพเจ้าคิดว่าข้าพเจ้าสามารถแบ่งอาวุธของข้าพเจ้าเองให้ได้สักชิ้น..."
 court.8010.c.equipped_tt:0 "[underequipped.GetTitledFirstNameNoTooltip] ได้รับอาวุธเป็นของขวัญ"
 court.8010.d:0 "ไปที่คลังอาวุธ — เหมือนคนอื่นๆ"
 court.8010.d.tt:0 "[underequipped.GetTitledFirstNameNoTooltip] จะไปเอาดาบคุณภาพต่ำจากคลังอาวุธ"
 court.8010.d.equipped_tt:0 "[underequipped.GetTitledFirstName] ได้รับดาบจากคลังอาวุธ"
 court.8010.e:0 "ไปให้พ้นสายตาข้า เจ้า[underequipped.Custom2('InsultNoun', ROOT.Char)] ไร้ยางอาย!"
 # # Sartorial Sting
 court.8020.t:0 "ความเจ็บแสบเรื่องเสื้อผ้า"
 court.8020.desc:0 "ท่ามกลางความวุ่นวายอีกวันในราชสำนัก ข้าได้ยินเสียงเกรี้ยวกราดอันเป็นเอกลักษณ์ของ [couture_spouse.GetWifeHusband] [couture_spouse.GetTitledFirstNamePossessive] ของข้า — ดูเหมือนว่า [couture_guest.GetTitledFirstName] จะยั่วโมโห [couture_spouse.GetHerHis] \n\nเมื่อก้าวเข้าไปใกล้ ข้าเห็นแขกของข้ากำลังเยาะเย้ยอย่างพึงพอใจว่า "ที่เรียกว่า #EMP แฟชั่น#! เหล่านี้น่าอับอายสิ้นดี มันเหมาะสำหรับคนรับใช้และเด็กๆ ในราชสำนัก #EMP [couture_guest.GetCulture.GetNameNoTooltip]#! ที่น่าเคารพเท่านั้น"\n\n[couture_spouse.GetWifeHusband] ของข้าหน้าแดงก่ำและร้องไห้ "ข้า #EMP ทน#! เจ้ามามากพอแล้ว — ข้าไม่สนว่าเจ้าจะเป็นแขกของ [ROOT.Char.GetTitleAsNamePossessiveNoTooltip]!" — ท่ามกลางความประหลาดใจของ [couture_guest.GetFirstNamePossessiveNoTooltip] \n\nเมื่อดึงข้ามาข้างๆ [couture_spouse.GetFirstNameNoTooltip] คร่ำครวญอย่างขมขื่นว่า "เจ้า[couture_guest.Custom2('InsultNoun', SCOPE.sC('couture_spouse'))] อกตัญญูนั่นไม่เคยหยุดเยาะเย้ยเราเลย เมื่อวานคนรับใช้ของข้าได้ยิน [couture_guest.GetHerHim] บอกว่าแฟชั่นของเรามัน #EMP เชยสะบัด!#!""
 court.8020.a:0 "มาเถิดที่รัก [couture_guest.GetSheHe] แค่ล้อเราเล่นเท่านั้น"
 court.8020.b:0 "ข้าพเจ้าคิดว่ามันเป็นช่องทางที่ดีสำหรับการลงทุน..."
 court.8020.d:0 "ล้าสมัย? #EMP ล้าสมัยเรอะ?!#!"

 poor_host_modifier:0 "เจ้าบ้านที่ไม่เพียงพอ"
 poor_host_modifier_desc:0 "ตัวละครนี้ได้ละเมิดกฎการต้อนรับที่ไม่เป็นลายลักษณ์อักษร"
 hunting_pooches_modifier:0 "สุนัขล่าเนื้อชั้นดี"
 hunting_pooches_modifier_desc:0 "ราชสำนักของตัวละครนี้มีสุนัขล่าเนื้อที่น่าประทับใจเป็นพิเศษ"
 # # Pawful of Pooches
 court.8030.t:0 "ฝูงลูกสุนัขน่ารัก"
 court.8030.desc.intro:0 "ขณะที่ [huntmaster.GetTitledFirstName] นายพรานหลวงของข้าพเจ้า เข้ามาในห้อง กลุ่มข้าราชสำนักที่ส่งเสียงชื่นชมก็รุมล้อม [huntmaster.GetHerHim] \n\nเมื่อ [huntmaster.GetSheHe] ฝ่าออกมาได้ในที่สุด สาเหตุของความโกลาหลก็ชัดเจน: ในอ้อมแขนของ [huntmaster.GetHerHis] มีผ้าห่มที่เต็มไปด้วยลูกสุนัขดิ้นไปมา ดูเหมือนจะเป็นพันธุ์ [ROOT.Char.Custom('get_region_dog_type')] — และน่าประทับใจมากด้วย! \n\n$master_of_hunt_court_position$ ของข้าพเจ้ายิ้มกว้าง "ฝ่าบาท ข้าพเจ้าเพียงแค่อยากให้ท่านได้เห็นครอกนี้ เมื่อลูกสุนัขเหล่านี้โตขึ้นและได้รับการฝึกฝน ข้าพเจ้ากล้าพูดได้เลยว่าพวกมันจะเป็นที่อิจฉาของทุกคณะล่าสัตว์ชาว [ROOT.Char.GetPrimaryTitle.GetAdjectiveNoTooltip]!" \n\n"
 court.8030.desc.one:0 "ข้าพเจ้าอดไม่ได้ที่จะสังเกตเห็น [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('child_1'))] [child_1.Custom('ComplimentAdjective')] ของข้าพเจ้า [child_1.GetFirstNameNoTooltip] กำลังพยายามอย่างหนักเพื่อมองดูลูกสุนัขตัวเล็กๆ ให้ชัดเจน"
 court.8030.desc.two:0 "จากหางตา ข้าพเจ้าเห็นลูกสองคนของข้าพเจ้า [child_1.GetFirstName] และ [child_2.GetFirstName] หลงใหลในลูกสุนัขอย่างเห็นได้ชัด และโดยเฉพาะอย่างยิ่งตัวที่ใหญ่ที่สุดในครอก"
 court.8030.desc.body:0 "\n\n[huntmaster.GetTitledFirstNameNoTooltip] อุ้มตัวที่ใหญ่ที่สุดขึ้นมา ครุ่นคิด "นี่อาจเป็นสุนัขที่ยิ่งใหญ่ที่สุดในรุ่นของมัน!""
 court.8030.a:0 "ข้าพเจ้ารอการเปิดตัวของพวกมันไม่ไหวแล้ว!"
 court.8030.b:0 "ตัวที่ใหญ่ที่สุดจะตกเป็นของ [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('child_1'))] ของข้าพเจ้า [child_1.GetFirstNameNoTooltip]!"
 court.8030.c:0 "มีเพียง [child_2.GetFirstNameNoTooltip] เท่านั้นที่สมควรได้รับลูกสุนัขตัวผู้ที่ดี เช่นนี้"
 court.8030.d:0 "อา ข้าพเจ้ารอคอยลูกสุนัขที่สง่างาม เช่นนี้มานานแล้ว!"
# # Aristocratic Pretensions
 court.8040.t:0 "การเสแสร้งของชนชั้นสูง"
 court.8040.desc.intro:0 "ข้าราชสำนักสามคนของข้าพเจ้ากำลังหารือกันอย่างเปิดเผยเกี่ยวกับ 'จำนวนมาก' ของบรรดาศักดิ์ของข้าพเจ้าในระยะที่ได้ยินโดยเจตนา คร่ำครวญเสียงดังว่ามันต้องเป็นภาระหนักหนาเพียงใดสำหรับ [ROOT.Char.GetTitleAsNameNoTooltip] ในการจัดการที่ดินมากมายด้วย [ROOT.Char.GetHerselfHimself]... \n\nพวกเขาสนิทสนมกันราวกับหัวขโมย:"
 court.8040.desc.position_holder:1 "ผู้ซื่อสัตย์ [position_holder.GetName] — ข้ารับใช้แห่งราชสำนัก;"
 court.8040.desc.knight:1 "ผู้กล้าหาญ [knight.GetName] — [ROOT.Char.Custom('MountedWarriorTerm')|U] ผู้โดดเด่นของข้าพเจ้า;"
 court.8040.desc.relative:1 "[relative.GetName] — ญาติผู้มีสิทธิ์ของข้าพเจ้า [relative.GetWomanMan];"
 court.8040.desc.ambitious:1 "ผู้กระหายอำนาจ [ambitious.GetName] — แสวงหาผลประโยชน์เสมอ;"
 court.8040.desc.arrogant:1 "ผู้หยิ่งยโส [arrogant.GetName] — เชิดหน้าชูตา;"
 court.8040.desc.lowborn:1 "ผู้สร้างตัวเอง [lowborn.GetName] — ผู้คว้าทุกโอกาส;"
 court.8040.desc.gentry:1 "ผู้เย่อหยิ่ง [gentry.GetName] — ตระกูล [gentry.GetHouse.GetName] ผู้มีอภิสิทธิ์;"
 court.8040.desc.generic_1:1 "[ROOT.Char.Custom2('DescriptorNegative', SCOPE.sC('generic_1'))] [generic_1.GetName] — แค่มีความสุขที่ได้มีส่วนร่วม;"
 court.8040.desc.generic_2:1 "[ROOT.Char.Custom2('DescriptorNegative', SCOPE.sC('generic_2'))] [generic_2.GetName] — ดังที่ทหารยามเรียก [generic_2.GetHerHim];"
 court.8040.desc.generic_3:1 "[ROOT.Char.Custom2('DescriptorNegative', SCOPE.sC('generic_3'))] [generic_3.GetName] — ลูกสมุนที่น่าลืมเลือนอย่างยิ่ง;"
 court.8040.desc.body:0 "และสิ่งที่ขาดหายไปอย่างเห็นได้ชัด: ความอ่อนน้อมถ่อมตนแม้ แต่น้อย \n\nท่ามกลางเสียงซุบซิบของข้าราชสำนัก ข้าพเจ้าได้ยินคำพูดชัดเจน: '[worst_title.GetTierAsNameNoTooltip]' และ '[worst_title.GetNameNoTier]' — ด้วยน้ำเสียงประจบประแจงที่ข้าพเจ้ามั่นใจว่าเป็นของ [button.GetFirstNamePossessiveNoTooltip] \n\nทั้งสามคนไร้ยางอายหันมามองทางข้าพเจ้า และข้าพเจ้าจับจ้องพวกเขาด้วยสายตาที่ดุดัน"
 court.8040.a:0 "ใช่ ใช่ [courtier_1.GetTitledFirstNameNoTooltip]... [worst_title.GetNameNoTierNoTooltip] เป็นของเจ้า"
 court.8040.b:0 "เกมเล็กๆ นี้จบลงได้แล้ว: [worst_title.GetTierAsNameNoTooltip] เป็นของ [courtier_2.GetFirstNamePossessiveNoTooltip]!"
 court.8040.c:0 "เจ้าตรงนั้น! [courtier_3.GetTitledFirstNameNoTooltip]? บรรดาศักดิ์เป็นของเจ้า!"
 court.8040.d:0 "ข้ารู้ว่าพวกเจ้ากำลังทำอะไร! ถึงเวลาพิสูจน์คุณค่าของพวกเจ้าแล้ว!"
 court.8040.d.flavor_tt:0 ""แด่ผู้แข็งแกร่งที่สุด""
 court.8040.d.courtier_1_tt:0 "[courtier_1.GetFirstNameNoTooltip] ต้องการมันมากกว่า"
 court.8040.d.courtier_2_tt:0 "[courtier_2.GetFirstNameNoTooltip] คือ [courtier_2.GetWomanMan] คนสุดท้ายที่ยืนหยัดอยู่"
 court.8040.d.courtier_3_tt:0 "[courtier_3.GetFirstNameNoTooltip] เป็นผู้ชนะ"
 court.8040.grant_tt:0 "[new_noble.GetTitledFirstNameNoTooltip] ได้รับ [worst_title.GetNameNoTierNoTooltip]"
 court.8040.e:0 "พวกเจ้า แต่ละคน บอกข้าพเจ้ามาว่าทำไมพวกเจ้าถึงสมควรได้รับบรรดาศักดิ์"
 court.8040.e.courtier_1_tt:0 "[courtier_1.GetFirstNameNoTooltip] น่าเชื่อถือที่สุด"
 court.8040.e.courtier_2_tt:0 "[courtier_2.GetFirstNameNoTooltip] สร้างความประทับใจด้วยคารมคมคายของ [courtier_2.GetHerHis]"
 court.8040.e.courtier_3_tt:0 "[courtier_3.GetFirstNameNoTooltip] พูดได้ดี"
 joining_faction_block_tt: "[new_noble.GetFirstNameNoTooltip] สาบานว่าจะไม่เข้าร่วมกลุ่มฝ่ายใดเป็นเวลา 20 ปี"
 court.8040.f:0 "พวกเจ้ามองอะไรกัน?"
 # # A Little Bird
 court.8050.t:0 "นกน้อยตัวหนึ่ง"
 court.8050.desc:0 "ทีแรกข้าคิดว่ามันเป็นเพียงพฤติกรรมแปลกๆ แต่ชัดเจนว่าหนึ่งในคนรับใช้จำนวนมากในราชสำนักกำลังส่งสัญญาณลับๆ ให้ข้า\n\nข้าเข้าไปหา [servant.GetHerHim] พร้อมกับองครักษ์ในช่วงเวลาที่เงียบสงบ และ [servant.GetSheHe] ก็กระซิบอย่างมีลับลมคมนัยว่า: "ท่าน [ROOT.Char.GetTitleAsNameNoTooltip] ผู้ยิ่งใหญ่ ข้าชื่อ [servant.GetFirstName] พวกเราได้ยินอะไรมากมายขณะรับใช้แขกของท่าน พวกเขาแทบจะไม่สังเกตเห็นการมีอยู่ของพวกเราด้วยซ้ำ..." \n\nข้ามอง [servant.GetHerHim] อย่างสงสัย พลางคิดว่าข้าอยากจะได้ยินสิ่งที่ [servant.GetSheHe] จะพูดต่อไปจริงๆ หรือไม่ [servant.GetSheHe|U] มองตอบอย่างชัดเจนว่าไม่แน่ใจว่า [servant.GetSheHe] กำลังทำพลาดหรือไม่ \n\nในที่สุด [servant.GetSheHe] ก็กลืนน้ำลาย "[ROOT.Char.Custom('FormOfAddressForLiege')|U] [vassal.GetTitledFirstName] [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('vassal'))] [servant.Custom2('DescriptorNegative', SCOPE.sC('vassal'))] ของท่าน [vassal_secret.Custom('SecretDescriptionThirdPerson')] หลังประตูที่ปิดสนิทของ [ROOT.Char.Custom('FortifiedBuilding')] ของท่าน — ข้าขอสาบานโดยมี [servant.GetFaith.HighGodName] เป็นพยาน!""
 court.8050.a:0 "ขอบใจสำหรับบริการของเจ้า"
 court.8050.a.tt:0 "[servant.GetFirstNameNoTooltip] จะเข้าร่วม [court|E] ของท่าน"
 court.8050.b:0 "เจ้าได้ยินอะไรมาอีกบ้าง?"
 court.8050.b.tt:0 "ท่านจะได้เรียนรู้ความลับของคนอื่นในราชสำนัก"
 court.8050.b.tt_secret:1 "ความลับของ [vassal_2.GetTitledFirstNamePossessive]"
 court.8050.c:0 "รับนี่ไป — เจ้าจะต้องรายงานต่อข้าพเจ้าเท่านั้น"
 court.8050.c.tt:0 "[spymaster|E] ของท่านจะมีแนวโน้มที่จะขัดขวางแผนการได้มากขึ้น ในขณะที่ตัวปรับ แต่งนี้มีอยู่"
 court.8050.d:0 "จับกุมปีศาจที่ซุ่มซ่อนนี้!"
 court.8050.d.tt_imprison:0 "[servant.GetFirstNameNoTooltip] ถูกโยนเข้าคุกใต้ดิน"
 # Modifiers
 servant_informants_modifier:0 "ผู้ให้ข้อมูลที่เป็นคนรับใช้"
 servant_informants_modifier_desc:0 "ข่าวซุบซิบในราชสำนักของตัวละครนี้ถูกรายงานโดยเครือข่ายคนรับใช้ที่สอดแนม"
 # # Scornful Sycophants
 court.8060.t:0 "คนประจบสอพลอนที่ดูถูกเหยียดหยาม"
 court.8060.desc.intro:0 "ข้าพเจ้าหยุดครู่หนึ่งที่ธรณีประตูทางเดิน ชื่นชมแสงแดด เมื่อข้าพเจ้าได้ยินเสียงหัวเราะเยาะเย้ยดังมาจากหัวมุม \n\n"ข้า #EMP รู้!#!" ข้าพเจ้าได้ยินเสียง [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('snooty_1'))] [ROOT.Char.Custom2('DescriptorNegative', SCOPE.sC('snooty_1'))] ของข้าพเจ้า [snooty_1.GetFirstName] หัวเราะคิกคัก,"
 court.8060.desc.fashion:0 ""เดินไปมา ข้าสาบานได้เลยว่าบางครั้งรู้สึกเหมือนอยู่ในราชสำนักของท่านปู่/ย่า/ตา/ยาย [snooty_1.GetMotherFather] ของ [ROOT.Char.GetTitleAsNamePossessiveNoTooltip] เทรนด์มันช่างน่าเบื่อและคร่ำครึ!" \n\n"
 court.8060.desc.servants_1:0 ""เจ้ารอคนรับใช้ #EMP ทั้งวัน#! แล้วก็มาพร้อมกันสองคน — โดยไม่มีสิ่งที่เจ้าขอ!" \n\n"
 court.8060.desc.food_1:0 ""เจ้า #EMP เห็น#! สภาพงานเลี้ยงเมื่อคืนไหม? ข้าขอกินจานไม้ของข้ายังดีกว่ากินเศษอาหารหมูนั่น!" \n\n"
 court.8060.desc.body:0 "เสียงหัวเราะคิกคักอีกเสียงแทรกเข้ามา: "พระเจ้าช่วย ข้าคิดว่าเป็นคนเดียวที่สังเกตเห็นเสียอีก! นี่ยังไม่ รวมถึง"
 court.8060.desc.lodgings:1 "ขนาด #EMP ห้องพัก#! ของเรา! แทบจะไม่มีที่พอสำหรับที่นอนของคนรับใช้เลย!""
 court.8060.desc.food_2:0 "อาหารที่นี่แย่มากจริงๆ — และให้ #EMP น้อย#! ขนาดนี้!"
 court.8060.desc.servants_2:0 "คนรับใช้ — ข้าเลิกขออะไรจากพวกเขาแล้ว: พวกเขาไม่รู้ว่ามันคืออะไรหรือไม่ก็ไม่เคยกลับมาเลย!"
 court.8060.desc.outro:0 "\n\nนั่นใช่ [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('snooty_2'))] ของข้าพเจ้า [snooty_2.GetTitledFirstName] หรือเปล่า กำลังกลั้นหัวเราะเสียงดัง? ช่างกล้า..."
 court.8060.a.fashion:0 "ข้าจะกำหนดมาตรฐานการ แต่งกายใหม่เพื่อเจ้าโดยเฉพาะ [snooty_1.GetFirstNameNoTooltip]"
 court.8060.a.servants:0 "บางทีเจ้าอาจจะแนะนำพนักงานที่มีทักษะบางคนได้ [snooty_1.GetFirstNameNoTooltip]?"
 court.8060.a.food:0 "[snooty_1.GetFirstNameNoTooltip] ข้ามีอาหารมื้อพิเศษที่วางแผนไว้สำหรับวันพรุ่งนี้"
 court.8060.b.food:0 "พ่อครัวคนใหม่จะเริ่มงานเร็วๆ นี้ [snooty_2.GetFirstNameNoTooltip]"
 court.8060.b.lodgings:0 "ข้าจะย้ายไปห้องที่ใหญ่ขึ้นคืนนี้ [snooty_2.GetFirstNameNoTooltip]"
 court.8060.b.servants:0 "ข้าคิดว่าเราน่าจะมีคนช่วยเพิ่มอีกสักสองสามคน"
 court.8060.c:1 "หลีกทางไป ไอ้เพรียงอกตัญญู..."
 court.8060.d:0 "ถ้าพวกเจ้าไม่ชอบ ก็ไปหาคนอื่นเกาะกินซะ!"
 court.8060.e:0 "สิ่งรบกวนทางโลกเพียงแยกเราออกจาก [ROOT.Char.GetFaith.PositiveAfterLife]"
 court.8060.e.pious_tt:0 "ข้าหลวงหรือข้าราชสำนักที่ไม่ใช่พวกเหยียดหยามโลกทุกคนที่มีศรัทธาแบบนักพรต"
 court.8060.f:0 "เป็นวันที่น่ารักใช่ไหม?"
 court.8060.f.flavor:0 "ต้องรักษาภาพลักษณ์ไว้"
 # # Feeling Useful
 court.8070.t:0 "รู้สึกมีประโยชน์"
 court.8070.desc:0 "[parent.GetMotherFather] [ROOT.Char.Custom2('DescriptorPositive', SCOPE.sC('parent'))] ของข้า เดินเตร็ดเตร่อยู่ในราชสำนักอย่างไร้จุดหมายทุกวัน แสดงให้เห็นชัดถึงความปรารถนาของ [parent.GetHerHis] ที่จะมีบทบาท ซึ่งข้าพเจ้าก็ยุ่งเกินกว่าจะจัดหาให้ได้ \n\nวันนี้ [parent.GetSheHe] ก็ดักพบข้าพเจ้าจนได้: "โอ้ เจ้าอยู่นี่เอง [ROOT.Char.GetFirstNameNoTooltip] สำหรับข้าแล้วเจ้ายังคงเป็นเจ้าตัวน้อย [ROOT.Char.Custom('GirlBoy')] ของข้าเสมอ! ให้ข้าช่วยแบ่งเบาภาระจากบ่าของเจ้าเถิด — ยังมีอีกมากที่ข้ายังสอนเจ้าได้" \n\nข้าราชบริพารของข้าพเจ้าพยายามอย่างที่สุดที่จะมองไปทางอื่น แต่กลับยิ่ง ทำให้ข้าพเจ้าอับอายมากขึ้น \n\n"[ROOT.Char.Custom('GetDaughterSon')|U] เจ้าเป็นอะไรไป? เจ้าไม่ใส่ใจ [parent.Custom('GetMaPa')] แก่ ๆ ที่น่าสงสารของเจ้าแล้วหรือ? หลังจากทุกสิ่งที่ข้า ทำให้เจ้าแล้วนะ?""
 court.8070.a:0 "ข้าจะหาอะไรให้ท่านทำ [parent.Custom('GetMamaPapa')]"
 court.8070.a.tt:0 "[parent.GetFirstNameNoTooltip] จะคาดหวัง [court_position|E] ในอีกไม่กี่เดือนข้างหน้า"
 court.8070.b:0 "ท่านเคยคิดที่จะอุทิศชีวิตให้กับ [ROOT.Char.GetFaith.HighGodName] หรือไม่?"
 court.8070.c:0 "รับงานอะไรก็ได้ไปก่อน..."
 court.8070.d:0 "ข้า #EMP ยุ่งมาก#! [parent.GetMotherFather]"
 court.8071.satisfied:0 "[parent.GetMotherFather|U] พอใจกับบทบาทของ [parent.GetHerHis]"
 court.8071.disappoint:0 "[parent.GetMotherFather|U] เบื่อหน่ายกับการรอคอย"
 # Modifiers
 promised_court_position_modifier:0 "ตำแหน่งที่สัญญาไว้"
 promised_court_position_modifier_desc:0 "ตัวละครนี้ได้รับการรับรองว่าจะได้รับตำแหน่งในราชสำนักในอนาคตอันใกล้ และบอกทุกคนที่เต็มใจรับฟัง"
 # # Maternal Reproach
 court.8080.t:0 "การตำหนิของ [parent.Custom('GetMaternalPaternal')|U]"
 court.8080.desc.intro:0 "[parent.GetMotherFather] ของข้า [parent.GetTitledFirstName] หงุดหงิดมากขึ้นทุกวัน \n\nขณะที่ข้านั่งอยู่บนบัลลังก์ ครุ่นคิดถึงสาเหตุที่เป็นไปได้ [parent.GetWomanMan] [parent.GetHerselfHimself] ก็เดินตรงมาหาข้า เหมือนกับที่ [parent.GetSheHe] เคยทำเมื่อข้าทำตัวไม่ดีตอนเด็ก ๆ\n\n"[ROOT.Char.GetFirstNameNoTooltip] [ROOT.Char.Custom('GetDaughterSon')] ของข้า! เจ้าต้องทำอะไรสักอย่างเกี่ยวกับ""
 court.8080.desc.fashion:0 "เศษผ้าที่น่าเศร้าเหล่านี้ที่เจ้าเรียกว่าเสื้อผ้า!"
 court.8080.desc.servants:0 "คนรับใช้ที่ไร้ความสามารถและทำงานหนักเกินไปของเจ้า!"
 court.8080.desc.lodgings:0 "ที่พักอันเบาบางที่เจ้าเสนอให้แขกของเจ้า!"
 court.8080.desc.food:0 "อาหารอันน่าสะพรึงกลัวบนโต๊ะจัดเลี้ยงของเจ้า!"
 court.8080.desc.outro:0 "เจ้าไม่สนใจเลยหรือว่าคนอื่นจะคิดอย่างไรกับเจ้า?!"\n\n"นี่ไม่ใช่วิธีที่ [ROOT.Char.GetTitleAsNameNoTooltip] จะแสดง [ROOT.Char.GetHerselfHimself] ออกมา ในอัตรานี้เจ้าจะเป็นตัวตลกของ [ROOT.Char.GetPrimaryTitle.GetNameNoTierNoTooltip] — ไม่สิ — ของชาว [ROOT.Char.GetCulture.GetCollectiveNounNoTooltip] ทั้งหมด!"
 court.8080.a:0 "ขอรับ/เจ้าค่ะ [parent.Custom('GetMamaPapa')] ข้าจะแก้ไขมัน..."
 court.8080.b:0 "อา ท่านคิดว่าท่านดีกว่าข้าราชสำนักของข้าหรือ?"
 court.8080.b.tt:0 "[courtier|E] ทุกคน"
 court.8080.c.nun:0 "บางทีท่านอาจจะชอบเครื่อง แต่งกายของ [ROOT.Char.GetFaith.DevoteeFemale] มากกว่า?"
 court.8080.c.monk:0 "บางทีท่านอาจจะชอบจีวรของ [ROOT.Char.GetFaith.DevoteeMale] มากกว่า?"
 court.8080.c.fallback:0 "ท่านเคยพิจารณาที่จะอุทิศตนให้กับ [ROOT.Char.GetFaith.HighGodName] หรือไม่?"
 court.8080.d.fashion:0 "ข้าคิดว่า #EMP ท่าน#! ควรจะเย็บชุดใหม่ให้พวกเรา"
 court.8080.d.servants:0 "อืม ทำไมไม่ช่วยงานคนรับใช้ล่ะ?"
 court.8080.d.lodgings:0 "บางทีท่านอาจจะสละห้องของท่านให้คนอื่นได้?"
 court.8080.d.food:0 "ก็ได้ ไปหาที่อื่นกิน..."
 court.8080.e:0 "ท่านพูดกับข้าแบบนี้ไม่ได้อีกแล้ว!"
 # Modifiers
 court_8080_degraded_modifier:0 "ถูกลดเกียรติ"
 court_8080_degraded_modifier_desc:0 "ตัวละครนี้ถูก ทำให้อับอายต่อหน้าสาธารณชนโดยบุตรและเจ้าเหนือหัวของตน เนื่องจากการบ่น"
 # # Building Blocks
 court.8090.t:0 "ส่วนประกอบอาคาร"
 court.8090.desc.intro:0 "[ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('architect'))] ของข้าพเจ้า [architect.GetTitledFirstName] ปฏิบัติหน้าที่ในฐานะ $royal_architect_court_position$ อย่างจริงจังแน่นอน"
 court.8090.desc.intro_alt: "สถาปนิกชื่อดังจาก [my_county.GetNameNoTier], [architect.GetTitledFirstName], กำลังมาเยือนราชสำนัก"
 court.8090.desc.intro_end: "การโต้เถียงอย่างเผ็ดร้อนของ [architect.GetHerHis|U] กับ [steward.GetHeldCourtAndCouncilPositionsString] ของข้าพเจ้า [steward.GetTitledFirstName] ครอบงำห้อง \n\n"ใช่ ถูกต้องแล้ว!" [architect.GetFirstNameNoTooltip] อุทาน "ซากปรักหักพังที่นั่นเต็มไปด้วยหินตัดที่สามารถขนย้ายไปยัง"
 court.8090.desc.religious:0 "[ROOT.Char.GetFaith.HouseOfWorship] แห่ง [temple_barony.GetNameNoTier] ได้อย่างง่ายดาย!""
 court.8090.desc.castle:0 "[ROOT.Char.Custom('FortifiedBuilding')] ของ [ROOT.Char.GetTitleAsNamePossessiveNoTooltip] ที่ [my_barony.GetNameNoTier] ได้อย่างง่ายดาย!""
 court.8090.desc.outro:0 "\n\n[steward.GetFirstNameNoTooltip] ลูบคางของ [steward.GetHerHis] อย่างสงสัย "ถึงกระนั้น มันก็ฟังดูเหมือนงานหนัก และชาวบ้านที่ใช้วัสดุเหล่านั้นจะไม่ชอบมัน" \n\n[architect.GetFirstNameNoTooltip] กลอกตาของ [architect.GetHerHis] ต่อคำโต้แย้งที่สมเหตุสมผลนี้"
 court.8090.desc.chaplain:0 "แต่ถูกขัดจังหวะโดย [chaplain.GetHeldCourtAndCouncilPositionsString] ของข้าพเจ้า: "[ROOT.Char.GetFaith.HouseOfWorship] ที่อยู่ใกล้เคียงแห่ง [temple_barony.GetNameNoTier] ต้องการการขยายอย่างเร่งด่วน;" [chaplain.GetTitledFirstName] ร้องเสียงแหลม "นั่นคือที่ที่เศษหินควรจะไป!""
 court.8090.desc.fallback:0 "เยาะเย้ย "เราสามารถนำมันไปใช้ประโยชน์ได้ดีกว่าที่พวกชาวบ้านเคยทำได้ ท่านก็รู้!""
 court.8090.a:0 "[my_barony.GetNameNoTierNoTooltip] #EMP น่าจะ#! ได้รับการปรับปรุงบ้าง..."
 court.8090.b:0 "มันจะไปที่ศาสนสถานของ [ROOT.Char.GetFaith.HighGodNamePossessive] ใน [temple_barony.GetNameNoTierNoTooltip]"
 court.8090.c:0 "สถาปนิกที่มีชื่อเสียงอย่างท่านสามารถทำได้ดีกว่านี้ [architect.GetFirstNameNoTooltip]!"
 court.8090.c.tt: "ตัวเลือกนี้ใช้ได้ เพราะ [architect.GetFirstNameNoTooltip] คือ $royal_architect_court_position$ ของท่าน"
 court.8090.d:0 "ทิ้งหินสกัดเก่าๆ เหล่านั้นไว้ให้ชาวบ้านเถอะ"
 # Modifiers
 court_8090_commoners_modifier:0 "ซากปรักหักพังของสามัญชน"
 court_8090_commoners_modifier_desc:0 "ชาวบ้านทั่วไปของเคาน์ตีนี้ได้รับประโยชน์จากการรื้อถอนซากปรักหักพังเก่าเพื่อนำวัสดุมาใช้ในการก่อสร้าง"
 # # Questionable Concoction
 court.8100.t:0 "ยาปรุงที่น่าสงสัย"
 court.8100.desc:0 "ขณะเดินระหว่างการเข้าเฝ้า ข้าพเจ้าได้ยิน $court_physician_court_position$ [ROOT.Char.Custom2('DescriptorPositive', SCOPE.sC('physician'))] ของข้าพเจ้า [physician.GetTitledFirstName] กำลังหารือเกี่ยวกับจินตนาการล่าสุดของ [physician.GetHerHis] \n\n"...ว่ากันว่าเป็นยาที่แรงที่สุดในโลก และมาจากดินแดนที่ไกลที่สุดเท่านั้น — หรืออย่างน้อยพ่อค้าและนักเล่นแร่แปรธาตุที่ข้าพเจ้าได้พูดคุยด้วยก็กล่าว เช่นนั้น" \n\n[physician.GetSheHe|U] ดึงขวดยาบรรจุของเหลวสีเหลืองซีดออกมา แกว่งไปมาใต้จมูกที่บิดเบี้ยวของข้าราชสำนัก \n\n"พวกเขากล่าวว่ามันมอบความแข็งแรงและอายุยืนยาว และเป็นที่โปรดปรานของผู้ที่จะเข้าสู่สนามรบ แต่เฉพาะผู้ที่แข็งแกร่งที่สุดเท่านั้นที่จะรับมือกับพลังของมันได้""
 court.8100.a:0 "ยาที่แรงที่สุด เจ้าว่าอย่างนั้นรึ? เอามานี่"
 court.8100.b:0 "จริงรึ? ให้ $food_taster_court_position$ ของข้าลองก่อน"
 court.8100.b.tt_forgiving:1 "[food_taster.GetTitledFirstName] ไม่ใช่ $trait_forgiving$:"
 court.8100.c:0 "มีเพียง [ROOT.Char.GetFaith.HighGodName] เท่านั้นที่สามารถมอบความแข็งแกร่งให้เราได้"
 court.8100.d:0 "น้ำยานั่นไม่เหมาะกับสัตว์ร้าย นับประสาอะไรกับมนุษย์!"
 court.8100.tt.handle_potion:0 "ท่านรับมือกับยาที่แรงที่สุดได้"
 court.8100.tt.need_weaker:0 "น่าจะหายาที่อ่อนกว่านี้"
 court.8100.tt.too_strong:0 "ยาแรงเกินไปสำหรับท่าน"
 # Modifiers
 strong_potion_modifier:0 "ยาแรง"
 strong_potion_modifier_desc:0 "ตัวละครนี้สามารถรับมือกับยาที่แรงที่สุดได้"
 feeling_unwell_modifier:0 "รู้สึกไม่สบาย"
 feeling_unwell_modifier_desc:0 "ตัวละครนี้น่าจะหายาที่อ่อนกว่านี้"
# # Upon the Block
 court.8110.t:0 "บนแท่นประหาร"
 court.8110.desc.intro:0 "$executioner_court_position$ [my_executioner.Custom('quirk_neg_adjective')] ของข้า [my_executioner.GetTitledFirstName] เดินเตร็ดเตร่ไปทั่ววัง [my_executioner.Custom('quirk_neg_pp')] อย่างไม่ปิดบังราวกับเด็กขี้หงุดหงิด\n\nในที่สุดข้าก็ทนพฤติกรรมอันน่าสมเพชนี้ในราชสำนักของข้าต่อไปไม่ไหวและตะคอกถาม: "มัน #EMP เรื่อง#! อะไรกัน?!"\n\n[my_executioner.GetSheHe|U] ผงะไป แต่ก็รีบตอบว่า: "[ROOT.Char.Custom('FormOfAddressForLiege')|U] อภัยให้ข้าด้วย มันก็แค่ข้าไม่มียอดสังหารดีๆ มาหลายสัปดาห์แล้ว..." \n\n"มาเถอะ นั่น"
 court.8110.desc.leader_1:0 "ไอ้หัวโจกน่ารังเกียจ [prisoner_1.GetTitledFirstName],"
 court.8110.desc.heretic:0 "พวกนอกรีตหน้าด้าน [prisoner_1.GetTitledFirstName],"
 court.8110.desc.heathen:0 "คนนอกศาสนาที่ชั่วร้าย [prisoner_1.GetTitledFirstName],"
 court.8110.desc.infidel:0 "คนนอกศาสนาไร้พระเจ้า [prisoner_1.GetTitledFirstName],"
 court.8110.desc.noble:0 "ปีศาจที่น่าสังเวช [prisoner_1.GetTitledFirstName],"
 court.8110.desc.fallback:0 "[prisoner_1.Custom('GetCrime')] ที่น่ารังเกียจ [prisoner_1.GetTitledFirstName],"
 court.8110.desc.body:0 "กำลัง #EMP อ่อนระโหยโรยแรง#! รอให้ท่านประกาศวันประหารชีวิตของพวกเขา"
 court.8110.desc.religious:0 "ไม่สำคัญต่อ [ROOT.Char.GetFaith.DeathDeityName] ว่าวิญญาณที่ไม่ศรัทธาจะไปถึง [ROOT.Char.GetFaith.NegativeAfterLife] เมื่อใด...""
 court.8110.desc.leader_2:0 "ตราบใดที่ [prisoner_1.GetSheHe] ยังมีชีวิตอยู่ [prisoner_1.GetSheHe] ก็สามารถเป็นสัญลักษณ์สำหรับผู้ทรยศคนอื่นๆ ได้...""
 court.8110.desc.criminal:0 "อนุญาตให้ข้าพเจ้าปลดปล่อย [prisoner_1.Custom('GetCrimeDesc')] นั้นให้พ้นจากความทุกข์ทรมานของ [prisoner_1.GetHerHis] เถิด...""
 court.8110.a:0 "ก็ได้ ถึงเวลาของ [prisoner_1.GetTitledFirstNamePossessiveNoTooltip] แล้ว"
 court.8110.b:0 "ไม่ ถึงตาของ [prisoner_2.GetTitledFirstNamePossessiveNoTooltip] ต่อไป"
 court.8110.c:0 "ใช่ และ #EMP เจ้า#! ก็เป็น [my_executioner.Custom('GetCrime')]!"
 court.8110.c.flavor:0 "$executioner_court_position$ ของข้าพเจ้าควรรู้จักที่ของตน"
 court.8110.d:0 "เจ้าสนุกกับสิ่งนี้มากเกินไป [my_executioner.GetFirstNameNoTooltip]"
 court.8110.e:0 "ไม่จำเป็นต้องรีบร้อน"
 # # Novel Perspectives
 court.8120.t:0 "มุมมองใหม่"
 court.8120.desc.intro:0 "ข้าพเจ้านั่งเงียบๆ ฟัง [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('accuser'))] [ROOT.Char.Custom2('DescriptorNegative', SCOPE.sC('accuser') )] ของข้าพเจ้า [accuser.GetTitledFirstName] กำลังโต้เถียงทางเทววิทยาอย่างดุเดือดกับ [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('refuter'))] ของข้าพเจ้า [refuter.GetTitledFirstName] \n\nฝ่ายหลังวิงวอน [refuter.Custom('quirk_pos_adverb')],"
 court.8120.desc.same_religion:0 ""... แต่ [refuter.GetFaith.GetNameNoTooltip] #EMP ใกล้เคียง#! กับพระวจนะที่แท้จริงของ [refuter.GetFaith.HighGodName] มากกว่า มันคือการกลั่นกรองที่บริสุทธิ์ที่สุดของการเปิดเผยของชาว [refuter.GetFaith.GetReligion.GetAdjectiveNoTooltip]"\n\n[accuser.GetTitledFirstNameNoTooltip] เยาะเย้ย [accuser.Custom('quirk_neg_pp')] "อ่าน [accuser.GetFaith.ReligiousText] แล้วเจ้าจะเห็นว่า"
 court.8120.desc.other_religion:1 ""... แต่คำสอนที่ล้าหลังของชาว [accuser.GetFaith.GetReligion.GetAdjectiveNoTooltip] ไม่สามารถเปรียบเทียบอย่างจริงจังกับคำสอนของ [refuter.GetFaith.GetReligion.GetNameNoTooltip] ของเราได้ ความจริงของ [accuser.GetFaith.HighGodNamePossessive] เป็นเพียงการบิดเบือนความจริงของ [refuter.GetFaith.HighGodNamePossessive]"\n\n[accuser.GetTitledFirstNameNoTooltip] เยาะเย้ย [accuser.Custom('quirk_neg_pp')] "ลองคิดให้ลึกซึ้งแล้วเจ้าจะเห็นว่า"
 court.8120.desc.marriage:0 "พันธะอันศักดิ์สิทธิ์ของการสมรสควรแบ่งปันกับผู้อื่นเพียงคนเดียว นั่นคือวิธีที่เราเข้าใกล้ [accuser.GetFaith.PositiveAfterLife] มากขึ้น""
 court.8120.desc.divorce:0 "การหย่าร้างมีไว้สำหรับผู้ที่ไม่เต็มใจอุทิศตนให้กับผู้อื่นโดยไม่มีเงื่อนไข แสวงหาความบริสุทธิ์และ [accuser.GetFaith.PositiveAfterLife] \n\n"
 court.8120.desc.adultery:0 "[accuser.GetFaith.CreatorName] ไม่ได้ตั้งใจให้เราผิดประเวณีและไล่ตามตัณหาของเรา นั่นคือ #EMP เหตุผล#! ที่เรามีพันธะเหล่านี้!"
 court.8120.desc.witchcraft:1 "พิธีกรรมอันไม่ศักดิ์สิทธิ์ของแม่มดขัดแย้งกับการแสวงหา [accuser.GetFaith.PositiveAfterLife]""
 court.8120.desc.equality:0 "[accuser.GetFaith.CreatorName] สร้างชายและหญิงขึ้นมาพร้อมกัน ไม่ใช่ฝ่ายใดฝ่ายหนึ่งอยู่ใต้อำนาจของอีกฝ่าย ตั้งแต่แรกเริ่มแห่งกาลเวลา""
 court.8120.desc.cosanguity:0 "[accuser.GetFaith.CreatorName] ไม่ได้ตั้งใจให้สมาชิกในครอบครัวเดียวกัน แต่งงานหรือสืบพันธุ์กัน นี่คือสิ่งล่อใจที่ท้าทายธรรมชาติ!""
 court.8120.desc.outro:1 "\n\n"นี่คือเหตุผลที่ข้าพเจ้าไม่พูดคุยกับผู้หลงผิด..." [refuter.GetTitledFirstNameNoTooltip] ถอนหายใจด้วยความหงุดหงิด "หากเจ้าไม่ยอมฟังความจริง ข้าพเจ้าเพียงหวังว่าเจ้าจะรอดพ้นจาก [accuser.GetFaith.NegativeAfterLife] อันเป็นนรกได้อย่างใดอย่างหนึ่ง""
 court.8120.a.accuser:0 "[accuser.GetSheHe|U] ก็มีเหตุผลนะ [refuter.GetFirstNameNoTooltip]"
 court.8120.a.refuter:0 "[refuter.GetSheHe|U] ก็มีเหตุผลนะ [accuser.GetFirstNameNoTooltip]""
 court.8120.c:0 "มาเถิดสหาย มีหลายวิธีที่จะให้เกียรติพระผู้สร้าง"
 court.8120.d:0 "ดูนี่สิ นี่คือความจริงของชาว [ROOT.Char.GetFaith.GetAdjectiveNoTooltip]!"
 court.8120.d.tt:0 "ทุก [vassal|E], [courtier|E], และ [guest|E] ชาว [THIS.Char.GetFaith.GetAdjectiveNoTooltip] ที่คลั่งศาสนา"
 court.8120.e:0 "ข้าพเจ้าไม่ต้องการได้ยินการพูดคุยแบบนี้อีก [accuser.GetFirstNameNoTooltip]"
 court.8120.f:0 "ไม่ใช่หน้าที่ของเราที่จะโต้เถียงเรื่องสิ่งศักดิ์สิทธิ์"
 my_holy_book:0 "[ROOT.Char.GetFaith.ReligiousText|U] ของ [ROOT.Char.GetTitledFirstNamePossessiveNoTooltip]"
 my_holy_book_description:0 "ชุดสะสมคำสอนของชาว [ROOT.Char.GetFaith.GetAdjectiveNoTooltip] ที่เข้าเล่มส่วนตัวของ [ROOT.Char.GetTitledFirstNameNoTooltip] แห่ง [ROOT.Char.GetPrimaryTitle.GetBaseNameNoTierPossessiveNoTooltip] ประดับหน้าด้วย [ROOT.Char.GetFaith.ReligiousSymbol] สีทอง"
 # # Contrived Conflict
 court.8130.t:0 "ความขัดแย้งที่สร้างขึ้น"
 court.8130.desc.intro:0 "ขณะที่ข้านั่งอยู่บนบัลลังก์ ครุ่นคิดเรื่องนั้นเรื่องนี้ ความโกลาหลก็ปะทุขึ้น \n\n$champion_court_position$ [champion.GetFirstName] ของข้าคำราม: "ข้ารู้ดีว่าเจ้าหมายความว่าอย่างไร เจ้า[vassal.Custom2('InsultNoun', SCOPE.sC('champion'))]! เจ้า #EMP กล้า#! ดีอย่างไรมาดูหมิ่น [ROOT.Char.GetTitleAsNameNoTooltip] ของเรา?!" ใส่หน้า [vassal.GetTitledFirstName] ที่กำลังงุนงง [mediator.Custom2('MyCharacterIntroduction', ROOT.Char)|U] รีบเข้ามาแยกพวกเขาทันที แต่บรรยากาศก็มัวหมองเกินกว่าจะแก้ไขได้เสียแล้ว \n\n"
 court.8130.desc.bold:0 ""การยั่วยุ เช่นนี้มันต่ำต้อยเกินไปสำหรับราชสำนักนี้ ข้าจะไม่ยอมถูกข่มขู่ด้วยเล่ห์กลของเจ้า" [vassal.GetTitledFirstNameNoTooltip] สวนกลับ [vassal.Custom('quirk_pos_adverb')] $court.8130.desc.body$ [vassal.GetTitleAsNameNoTooltip] [vassal.Custom('quirk_pos_present')] และตอบว่า "ดีมาก ข้ายินดีที่จะสั่งสอนเจ้าคนเถื่อน [champion.Custom2('InsultAdjective', SCOPE.sC('vassal'))] นี่ให้รู้จักที่ทางของ [champion.GetHerHis]""
 court.8130.desc.craven:0 ""แ-แ-แต่ข้าไม่ได้พูด อ-อะไรแบบนั้นเลย!" [vassal.GetTitledFirstNameNoTooltip] โพล่งออกมาอย่างไม่น่าเชื่อ. $court.8130.desc.body$ [vassal.GetTitleAsNameNoTooltip] [vassal.Custom('quirk_pos_present')] และพูดตะกุกตะกัก "อ-อะไรนะ?! ไม่เอาน่า แน่นอนว่ามัน ค-คงไม่จำเป็นหรอก?!""
 court.8130.desc.body:0 ""ข้าได้ยินเจ้าด้วยหูของข้าเอง!" [champion.GetFirstNameNoTooltip] ถอยกลับ "ข้าเรียกร้องความพอใจสำหรับการดูหมิ่น [ROOT.Char.GetLadyLord] ของข้าครั้งนี้!""
 court.8130.desc.outro:0 "\n\nทุกคนมองมาที่ข้าพเจ้าเพื่อรอคำตัดสิน ในขณะที่ [mediator.GetFirstNameNoTooltip] แยกทั้งสองออกจากกัน"
 court.8130.a:0 "[champion.GetFirstNameNoTooltip] จะปกป้องเกียรติของข้าพเจ้า"
 court.8130.a.tt_champion:0 "[champion.GetTitledFirstNameNoTooltip] ชนะการประลอง"
 court.8130.a.tt_vassal:0 "[vassal.GetTitledFirstNameNoTooltip] ชนะการประลอง"
 court.8130.a.tt:0 "[champion.GetTitledFirstName] และ [vassal.GetTitledFirstName] จะมี [single_combat_duel|E]"
 court.8130.b:0 "เป็นความเข้าใจผิด [vassal.GetFirstNameNoTooltip] เป็นข้าหลวงที่ภักดี"
 court.8130.b.tt_me:0 "ข้าพเจ้าชนะการประลอง"
 court.8130.c:0 "ข้าพเจ้าต้องการตัวแทนที่มีสติมากกว่านี้"
 court.8130.d:0 "[vassal.GetSheHe|U] พูด #EMP อะไรนะ?!#! เอา [ROOT.Char.Custom('signature_weapon')] ของข้ามา!"
 court.8130.d.tt:0 "[vassal.GetTitledFirstName] และข้าพเจ้าจะมี [single_combat_duel|E]"
 court.8130.e:0 "ใจเย็นๆ จะไม่มีการประลอง"
 # # Royal Lapse
 court.8140.t:0 "ช่วงเวลาที่เหนื่อยล้าของกษัตริย์"
 court.8140.desc:0 "ความหรูหราโอ่อ่าของราชสำนักดำเนินต่อไป วันแล้ววันเล่า ตั้งแต่รุ่งสางจนถึงค่ำ [vassal_2.GetTitledFirstName] กล่าวเยินยอความยิ่งใหญ่ของข้าอย่างด้นสด พ่นถ้อยคำซ้ำซากและคำสรรเสริญออกมา [vassal_1.GetTitledFirstName] ที่อยู่ใกล้ๆ ก็ร่วมวงด้วย เล่นกับฝูงชน ยิ้มอย่างโง่เขลาและคาดหวังสัญญาณความโปรดปรานจากข้าสำหรับท่าทีตลกๆ ของ [vassal_1.GetHerHis] เหงื่อเม็ดหนึ่งไหลลงมาตามหน้าผากข้าอย่างไม่หยุดหย่อน... \n\n[vassal_2.GetFirstNameNoTooltip] สังเกตเห็นท่าทีห่างเหินของข้า จึงเอ่ยถาม: "ท่านสบายดีหรือ [ROOT.Char.Custom('FormOfAddressForLiege')]?" ด้วยความห่วงใยที่เกือบจะจริงใจ\n\n"ข้าต้องการพักผ่อน""
 court.8140.a:0 "ขออภัย ท่านกำลังพูดว่าอะไรนะ?"
 court.8140.a.flavor_tt:0 "ตั้งสติหน่อย เจ้าคือ [ROOT.Char.GetTitleAsNameNoTooltip]!"
 court.8140.b:0 "อภัยให้ข้าด้วย ข้ามีธุระอื่นต้องจัดการ"
 court.8140.b.flavor_tt:0 "ข้าต้องการ [ROOT.Char.Custom('GetStressDesire')] เดี๋ยวนี้"
 court.8140.c.1: "[vassal_1.GetTitledFirstNameNoTooltip], นำพวกเราสวดมนต์"
 court.8140.c.2: "[vassal_1.GetTitledFirstNameNoTooltip], จัดงานเลี้ยงให้ข้า!"
 court.8140.c.3: "[vassal_1.GetTitledFirstNameNoTooltip], ออกเดินทางกันเถอะ"
 court.8140.c.flavor_tt:0 "เอาล่ะ นั่นจะ ทำให้จิตใจที่ว้าวุ่นของข้าสงบลง!"
 court.8140.d.1: "[vassal_2.GetTitledFirstNameNoTooltip], เรียกการล่าสัตว์!"
 court.8140.d.2: "[vassal_2.GetTitledFirstNameNoTooltip], หาม้าตัวใหม่ให้ข้า"
