l_english: 
 ceremonial_petition_prefix: "ฎีกาในพิธีการ:"
 court_ceremonial.1000.t: "$ceremonial_petition_prefix$ การรับรองผู้สำเร็จราชการ"
 court_ceremonial.1000.opening: "[petition_vassal.GetTitledFirstName] ก้าวออกมาเบื้องหน้า, โค้งคำนับอย่างลึกซึ้งต่อหน้าเหล่าข้าราชบริพาร, ขณะที่ฎีกา ซึ่งเขียนด้วยลายมือ[petition_vassal.GetHerHis]ถูกนำส่งมายังข้าโดยเหล่ามหาดเล็ก\n\n[petition_vassal.GetSheHe|U] เอ่ยอย่างชัดถ้อยชัดคำว่า, "ข้า แต่ [petition_liege.GetTitleAsName] ผู้สูงส่ง, วันนี้ข้ามาเพื่อทูลขอความอนุเคราะห์จากท่านด้วยความนอบน้อมในเรื่องอันสำคัญยิ่ง""\n\n"
 court_ceremonial.1000.desc: "ในฐานะประมุขแห่งตระกูลอันภาคภูมิใจที่ได้รับใช้ [petition_vassal.GetTopLiege.GetPrimaryTitle.GetBaseNameNoTooltip] อย่างใกล้ชิดด้วยความนอบน้อมและภักดี, ชาว [petition_vassal.GetDynasty.GetName] ผู้ทระนง, ข้าจึงใคร่ขอการรับรองจากท่านในฐานะผู้สำเร็จราชการแห่งอาณาจักร""
 court_ceremonial.1000.a: "ข้าขอยอมรับคำร้องอันจริงใจของท่านด้วยความยินดี"
 court_ceremonial.1000.b: "บางทีหากท่านให้การสนับสนุนแก่ [ROOT.Char.GetConfederation.GetName]?"
 court_ceremonial.1000.c: "หนี้บุญคุณต่อราชวงศ์มิอาจลืมเลือน"
 court_ceremonial.1000.d: "ข้ามั่นใจว่าท่านมีของกำนัลอันล้ำค่ามาเสนอเพื่อเป็นการแลกเปลี่ยน"
 court_ceremonial.1000.e: "เรื่องนี้คงเป็นไปไม่ได้"
 court_ceremonial.1000.f: "ได้, เพื่อแลกกับการรับใช้ของ [knight.GetFirstNamePossessiveNoTooltip]"
 court_ceremonial.1000.g: "[monk.GetFirstNameNoTooltip] จะเป็น [GetTrait('devoted').GetName( monk )] ที่ยอดเยี่ยมได้"
 court_ceremonial.1000.h: "ให้เรามาสะสางข้อตกลงเก่า ๆ ของเรากันเถิด"
 court_ceremonial.1100.t: "$ceremonial_petition_prefix$ การรับรองตำแหน่งเจ้าเมือง"
 court_ceremonial.1100.desc: ""ในฐานะประมุขแห่งตระกูลอันภาคภูมิใจที่ได้รับใช้ [petition_vassal.GetTopLiege.GetPrimaryTitle.GetBaseNameNoTooltip] อย่างใกล้ชิดด้วยความนอบน้อมและภักดี, ชาว [petition_vassal.GetDynasty.GetName] ผู้ทระนง, ข้าจึงใคร่ขอการรับรองจากราชสำนักเพื่อรับตำแหน่งเจ้าเมือง""
 court_ceremonial.1200.t: "$ceremonial_petition_prefix$ การอภิเษกสมรส"
 court_ceremonial.1200.desc: ""ในฐานะประมุขแห่งหนึ่งในตระกูลที่สำคัญที่สุดของอาณาจักร, ชาว [petition_vassal.GetDynasty.GetName] ผู้ทระนง, ข้าใคร่ขอพระบรมราชานุญาตอย่างเป็นทางการเพื่อการสมรสกับตระกูลอันสูงส่งและศักดิ์สิทธิ์ที่สุดของท่าน""
 court_ceremonial.1300.t: "$ceremonial_petition_prefix$ เกียรติศักดิ์แห่ง [petition_vassal.GetHouse.GetBaseNameNoTooltip]"
 court_ceremonial.1300.desc: ""ในฐานะประมุขแห่งหนึ่งในตระกูลที่สำคัญที่สุดของอาณาจักร, ชาว [petition_vassal.GetDynasty.GetName] ผู้ทระนง, ข้าใคร่ขอการยอมรับอย่างเป็นทางการถึงสายเลือดและวงศ์ตระกูลอันน่าภาคภูมิใจของข้าในหมู่เหล่าขุนนาง [petition_vassal.GetTopLiege.GetPrimaryTitle.GetAdjectiveNoTooltip]""
 
