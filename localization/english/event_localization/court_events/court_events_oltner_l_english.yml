 court_maintenance.0012.desc_illustrious:0 "บัดนี้ตราประจำตระกูลของข้าเป็นที่รู้จักไปทั่วโลก ถูกบันทึกโดยเหล่าอัครเสนาบดี สอนให้แก่เด็กๆ และสร้างความยินดีให้แก่พ่อค้าในดินแดนที่แม้ แต่ชาว [ROOT.Char.GetCulture.GetCollectiveNounNoTooltip] ก็ไม่เคยย่างเท้าเข้าไป"
 court_maintenance.0012.desc_masterwork:0 "บัดนี้ตราสัญลักษณ์ของตระกูลข้าเป็นที่รับรู้กันทั่วไป ถูกจัดอยู่ในกลุ่มราชวงศ์ผู้ยิ่งใหญ่ของภูมิภาคและขุนนางชั้นสูงสุดของชาว [ROOT.Char.GetCulture.GetCollectiveNounNoTooltip]"
