 court_maintenance.0011.desc:1 ""ในฐานะ [ROOT.Char.GetTitleTierName] ท่านมีหน้าที่และความรับผิดชอบใหม่ๆ บัดนี้ท่านจะต้องจัดราชสำนักเป็นประจำ เพื่อแก้ไขข้อพิพาทของอาณาจักร และให้ข้าราชบริพารของท่านมีส่วนร่วมในกิจวัตรประจำวันของท่าน"\n\n[messenger.GetName] กำลังมองข้าอย่างเคร่งขรึมด้วยท่าทีตรงไปตรงมา เกือบจะเหมือนการสั่งสอน บางทีอาจมีความ [ROOT.GetCharacter.Custom2('GetPrideEnvy' , SCOPE.sC('messenger'))] อยู่ในดวงตาของ [messenger.GetHerHis] ด้วย?\n\n[messenger.GetSheHe|U] เริ่มคลี่ธงอันงดงาม ซึ่งมีตราสัญลักษณ์ของตระกูล [ROOT.Char.GetHouse.GetName] ออกมา "หนึ่งในวิธีที่โลกจะตัดสินการปกครองของท่านในตอนนี้คือวิธีที่ท่านประดับประดาและดูแลราชสำนักของท่าน ข้าถือวิสาสะสั่งทำสิ่งนี้ขึ้นเป็นของขวัญเพื่อเป็นเครื่องหมายแห่งการเริ่มต้นวาระการดำรงตำแหน่งในราชสำนักของท่าน""
 court_maintenance.0011.desc.regent: ""ในฐานะ [ROOT.Char.GetTitleTierName] ท่านมีหน้าที่และความรับผิดชอบใหม่ ท่านจะต้องว่าราชการในราชสำนักอย่างสม่ำเสมอ เพื่อแก้ไขข้อพิพาทของอาณาจักร และรับคำแนะนำจากข้าราชสำนักอื่นๆ ของ [ceremonial_liege.GetTitleAsNamePossessiveNoTooltip] ในกิจวัตรประจำวันของราชสำนักของ [ceremonial_liege.GetHerHis]""
 court_maintenance.0011.desc.ach: "\"ของขวัญชิ้นนี้จะเป็นจุดเริ่มต้นแห่งการครองราชย์ของท่าน\"[messenger.GetName] คลี่ผืนธงอันงดงาม ซึ่งมีตราประจำตระกูล [ROOT.Char.GetHouse.GetName]\n\n\"ท่านคือ [ROOT.Char.GetTitleTierName|l] เพียงในนาม แต่ถึงกระนั้น — อาณาจักรควรจะมาชุมนุมกันเพื่อพระราชพิธีบรมราชาภิเษกอันยิ่งใหญ่! ณ ที่นั้น ท่านอาจประสานอำนาจของท่านและปฏิญาณตนต่อ [ROOT.Char.GetFaith.HighGodName] ในฐานะผู้พิทักษ์และผู้ปกป้อง [ROOT.Char.GetPrimaryTitle.GetNameNoTier]\""
