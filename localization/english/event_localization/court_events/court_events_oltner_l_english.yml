l_english: 
 court.9000.t:0 "คำประกาศของอัศวิน"
 court.9000.desc:0 "ขณะที่ข้าก้าวไปยังบัลลังก์ ข้าได้ยินเสียง $knight_culture_player_no_tooltip_lowercase$ [flirty_knight.GetFirstName] กำลังประกาศบางอย่างแก่ [flirty_spouse.GetWifeHusband] ของข้า, [flirty_spouse.GetFirstName].\n\n"[flirty_knight.Custom('GeneratePoem_Intro_Rhyming')]\n[flirty_knight.Custom('GeneratePoem_Outro_Rhyming')]"\n\n[flirty_knight.GetSheHe] กำลังขับขานบทกวีรักอยู่รึ? ให้แก่ #EMP [flirty_spouse.GetWifeHusband]#! ของข้าเนี่ยนะ!?"
 court.9000.a:0 "[flirty_knight.GetFirstNameNoTooltip] เจ้า[flirty_knight.Custom2('InsultNounSexual', ROOT.Char)]! จงไปที่คุกใต้ดิน!"
 court.9000.b:0 "[flirty_spouse.GetFirstNameNoTooltip]! ออกห่างจาก [flirty_knight.GetHerHim] นะ เจ้า[flirty_spouse.Custom2('InsultNounSexual', ROOT.Char)]!"
 court.9000.c:0 "อา, รักในราชสำนัก! จงให้บทกวีอันไพเราะนั้นดังก้องไปทั่วท้องพระโรงเถิด!"
 court_9000_a_tt:0 "หากมีสิ่งใดเกิดขึ้นระหว่าง [flirty_spouse.GetFirstName] และ [flirty_knight.GetFirstName] มันจะจบลงที่นี่\n"
 court_9000_b_tt:0 "หากมีสิ่งใดเกิดขึ้นระหว่าง [flirty_spouse.GetFirstName] และ [flirty_knight.GetFirstName] มันน่าจะจบลง\n"
 court_9000_c_tt:0 "หากมีสิ่งใดเกิดขึ้นระหว่าง [flirty_spouse.GetFirstName] และ [flirty_knight.GetFirstName] มันจะได้รับอนุญาตให้ดำเนินต่อไป\n"
 
 court.9001.t:0 "ของขวัญแห่งราชสำนัก"
 court.9001.desc:0 "ข้าเห็น [flirty_spouse.GetWifeHusband] [flirty_spouse.GetFirstName] ของข้า และ [ROOT.GetCharacter.Custom2('RelationToMeShort' , SCOPE.sC('flirty_knight'))] [flirty_knight.GetFirstName] ของข้า กำลังอยู่ในช่วงเวลาที่ดูเหมือนจะเร่าร้อน — โดย [flirty_knight.GetFirstNameNoTooltip] คุกเข่าอยู่เบื้องหน้า [flirty_spouse.GetHerHim].\n\n"โอ้ [flirty_spouse.Custom('RomanticComplimentNoun')] ของข้า! โปรดรับของขวัญอันต่ำต้อยนี้ด้วยเถิด" [flirty_knight.GetFirstNameNoTooltip] กล่าว พลางยื่น [flirty_spouse.Custom('SeductionGiftTypeIndefiniteSimple')] ให้\n\n"โอ้!" [flirty_spouse.GetFirstNameNoTooltip] พูดตะกุกตะกัก "ข้ารักมัน! มันช่างวิเศษนัก"\n\nนี่มันเกิดอะไรขึ้นกันแน่?"
 court.9001.a:0 "[flirty_spouse.GetFirstNameNoTooltip] เป็น #EMP ของข้า.!# ชักดาบของเจ้าออกมา!"
 court.9001.b:0 "ส่งมันมา! [flirty_knight.GetFirstNameNoTooltip] — ข้าขอเนรเทศเจ้าออกจากอาณาจักร!"
 court.9001.c:0 "รักในราชสำนักช่างบริสุทธิ์และไร้เดียงสานัก!"
 court.9001.a.tt:0 "#V ประลองยุทธ์#! กับ [flirty_knight.GetFirstName] เพื่อ ทำให้ [flirty_knight.GetHerHim] เลิกยุ่งกับ [flirty_spouse.GetWifeHusband] ของท่านเสีย!\n#weak การประลองนี้ #EMP ไม่ใช่#! การต่อสู้จนตาย#!\nหากท่านชนะ หัวใจของ [flirty_spouse.GetFirstNamePossessive] จะเป็นของท่าน แต่เพียงผู้เดียว หากท่านแพ้ ใครเล่าจะรู้ว่าจะเกิดอะไรขึ้น?\n\n[prowess|E] ของท่าน: [prowess_i]#V [root_for_loc.GetProwess]#!\n[prowess|E] ของ [flirty_knight.GetFirstNamePossessive]: [prowess_i]#V [flirty_knight.GetProwess]#!"
 how_could_you_opinion:0 "ท่านทำ เช่นนี้ได้อย่างไร"
 court.9002.trigger_failure:0 "การประลองยุทธ์ของข้ากับ [flirty_knight.GetFirstNameNoTooltip] ได้กลายเป็นโมฆะ"
 court.9004.t:0 "$court.9001.t$: ได้รับชัยชนะ"
 court.9004.desc:0 ""ข้าวางอาวุธลงต่อหน้าท่าน — จิตวิญญาณของท่านช่าง [ROOT.Char.Custom('ComplimentAdjective')] และคู่ควรกับหัวใจของ [flirty_spouse.GetFirstNamePossessive] ยิ่งกว่า!" [flirty_knight.GetFirstName] กล่าวอย่างผู้พ่ายแพ้\n"ข้าจะรับใช้ท่านโดยปราศจากข้อกังขาใดๆ นับ แต่นี้ไป, [ROOT.Char.GetTitleTierName]."\n\n[flirty_spouse.GetWifeHusband] [flirty_spouse.GetFirstNameNoTooltip] ของข้าหันมาหาข้า ประกายไฟใหม่ปรากฏในดวงตาของ [flirty_spouse.GetHerHis]\n\n"[ROOT.Char.GetWifeHusband|U], ท่านเสี่ยงชีวิตเพื่อความรักของข้า! โอ้ หัวใจของท่านช่างสูงส่ง — นับ แต่นี้ไป ข้าเป็นของท่าน แต่เพียงผู้เดียว!""
 court.9004.a:0 "[flirty_spouse.GetFirstNameNoTooltip] เป็นของข้า แต่เพียงผู้เดียว"
 court.9005.t:0 "$court.9001.t$: พ่ายแพ้"
 court.9005.desc:0 ""เจ้าไม่เคยคู่ควรกับความรักของ [flirty_spouse.GetFirstNamePossessive] เลย!" [flirty_knight.GetFirstName] อุทาน\n\n"โอ้ วีรบุรุษผู้ [flirty_knight.Custom('ComplimentAdjective')] ของข้า ข้าปรารถนาให้เราหนีไปจากสถานที่อันน่าหดหู่นี้เสียจริง! แต่ถึงกระนั้น ความรักของเราก็ได้สิทธิ์ที่จะเบ่งบานแล้ว" [flirty_spouse.GetFirstNameNoTooltip] กล่าว พร้อมถอนหายใจอย่างโหยหา\n\n[flirty_knight.GetFirstNameNoTooltip] จ้องมองข้าด้วยใบหน้าไร้ความรู้สึก"
 court.9005.a:0 "[ROOT.Char.Custom('CulturalCurse')|U]!"
 court_9005_tt:0 "[flirty_spouse.GetFirstName] และ [flirty_knight.GetFirstName] ออกจากราชสำนักของท่านไปเพื่อสานสัมพันธ์รัก ณ ที่อื่น"
 
 court.9100.t:0 "ความบันเทิงของนักชิม"
 court.9100.desc:0 ""อา ยอดเยี่ยม! [food_lover_1.Custom('GetExpensiveMeal')|U] ของโปรดของข้า!" [food_lover_1.GetFirstName] ตะโกนอย่างร่าเริง สวาปาม [food_lover_1.GetHerselfHimself] ขณะที่คนรับใช้พยายามประคองถาดเสิร์ฟอย่างสิ้นหวัง\n\n"โอ้ [food_lover_2.Custom('GetExpensiveDessert')] ที่รักของข้า เจ้าช่างน่าอร่อยจริง ๆ!" [food_lover_2.GetFirstName] พูดด้วยน้ำเสียงขับขาน\n\n"นี่แหละคือชีวิต! คนรับใช้ ขอ [food_lover_1.Custom('GetExpensiveDrink')] อีก เดี๋ยวนี้!" [food_lover_3.GetFirstName] เรียกร้อง\n\nดูเหมือนว่าข้าราชบริพารของข้ากำลังสนุกสนานกันอยู่!"
 court.9100.a:0 "ทำงานให้มากขึ้น กินให้น้อยลง!"
 court.9100.b:0 "พวกเจ้าทุกคนสมควรได้รับสิ่งที่ดีที่สุด!"
 court.9100.c:0 "เหลือเครื่องดื่มไว้ให้ข้าบ้าง, [food_lover_3.GetFirstNameNoTooltip] — มันจะดีที่สุดเมื่อแบ่งปันกับสหาย!"
 court.9100.d:0 "ข้าควรปล่อยพวกเขาไป"
 
 court.9200.t:0 "การสร้างสัมพันธ์ผ่านงานเลี้ยง"
 court.9200.desc:0 ""[ROOT.Char.GetTitleTierName] ของเราช่างใจกว้างเสียจริง, [food_lover_2.GetFirstNameNoTooltip]! ลองชิม [food_lover_1.Custom('GetExpensiveMeal')] #EMP อันน่าตื่นตาตื่นใจ#! นี่สิ!" [food_lover_1.GetFirstName] อุทานอย่างไพเราะ\n\n"ใช่แล้ว! [ROOT.Char.GetLadyLord|U] [ROOT.Char.GetFirstNameNoTooltip] ช่าง [food_lover_1.Custom('ComplimentAdjective')] ยิ่งนัก — เหมือนกับ [food_lover_2.Custom('FavoriteTreat')] นี้เลย!" [food_lover_2.GetFirstName] ตอบอย่างกระตือรือร้น\n\nดูเหมือนว่าการใช้จ่ายของข้าไปกับอาหารมื้อหรูหราได้ ทำให้มิตรภาพใหม่ผลิบานขึ้น!"
 court.9200.a:0 "จะว่ากระไรหรือไม่หากข้าจะร่วมทาน [food_lover_1.Custom('GetExpensiveMeal')] กับพวกท่าน?"
 court.9200.b:0 "เหล่าคนรับใช้ มองไม่เห็นรึว่าพวกเขากำลังหิวโหย? เอา [food_lover_2.Custom('GetExpensiveDessert')] มาเพิ่มอีก!"
 court.9200.c:0 "คงจะเป็นการเสียมารยาทหากไปรบกวนพวกเขาขณะกำลังทานอาหาร!"
 
 court.9300.t:0 "การหมกมุ่นอย่างเปิดเผย"
 court.9300.desc:0 ""ฝะ... ฝ่าบาท [ROOT.Char.GetTitleTierName]. [ROOT.GetCharacter.Custom2('RelationToMeShort' , SCOPE.sC('overindulger_target'))] [overindulger_target.GetFirstName] ของท่าน, [overindulger_target.GetSheHe] เพิ่งจะ... #EMP [overindulger_target.GetSheHe] ไม่ยอมหยุดกิน [overindulger_target.Custom('FavoriteTreatDemand')] เลยพ่ะย่ะค่ะ/เพคะ!#!" [ROOT.Char.Custom2('RelationToMeShort',worried_courtier)] [worried_courtier.GetFirstName] ของข้าพูดตะกุกตะกัก\n\nในขณะนั้นเอง ข้าก็เห็น [overindulger_target.GetFirstNameNoTooltip] กำลังเดินออกจากห้องเก็บเสบียง โดยหอบ [overindulger_target.Custom('FavoriteTreatDemand')] กองโตไว้เต็มสองแขนของ [overindulger_target.GetHerHis]\n\n"มีเรื่องอันใดรึพ่ะย่ะค่ะ/เพคะ, ฝ่าบาท?" [overindulger_target.GetFirstNameNoTooltip] กล่าว, [overindulger_target.Custom('quirk_neg_pp')]."
 court.9300.a:0 "#EMP เจ้ากิน [overindulger_target.Custom('FavoriteTreatDemand')] ของหลวงไปรึ!?"
 court.9300.b:0 "สาบานต่อ [ROOT.Char.GetFaith.HighGodName], [overindulger_target.GetWomanMan]! ตั้งสติหน่อยสิ!"
 court.9300.c:0 "โอ้ เจ้า #EMP ต้อง#! ชดใช้สำหรับสิ่งนั้น"
 court.9300.d:0 "เจ้าถูกห้ามเข้าห้องเก็บเสบียงนับ แต่นี้ไป..."
 court.9300.b.success:0 "ท่านโน้มน้าวให้ [overindulger_target.GetFirstNameNoTooltip] เลิกกิน [overindulger_target.Custom('FavoriteTreatDemand')] และจ่ายเงินคืนให้ท่านได้สำเร็จ"
 court.9300.b.failure:0 "[overindulger_target.GetFirstNameNoTooltip] ไม่ยอมเปลี่ยนใจ และปฏิเสธที่จะจ่ายเงินคืนให้ท่าน"
 
 court.9400.t:0 "เรื่องตลกเกี่ยวกับพาย"
 court.9400.desc:0 "นี่มันอะไรกัน? พาย #EMP ขนาดใหญ่#! กลางห้องบัลลังก์ของข้า!?\n\n"สนใจพายไหม [pie_presenting_courtier.Custom2('RelationToMeShort' , SCOPE.sC('you_target'))] ของข้า?" [pie_presenting_courtier.GetFirstName] หัวเราะคิกคัก\n"มันมีเซอร์ไพรส์! นี่มีด เชิญเลย — หั่นสักชิ้นได้ตามสบาย!"\n\nข้าคว้ามีดมาอย่างไม่เต็มใจและค่อย ๆ หั่นลงไปในเปลือกพาย ทันใดนั้น ตัวตลกประจำราชสำนักของข้า [court_jester.GetFirstName] ก็โผล่ออกมา หัวเราะและโบกมือของ [court_jester.GetHerHis]!"
 court.9400.a:0 "รู้อะไรไหม? ข้าชักหิวแล้วสิ #EMP กลับเข้าไปในพายนั่นซะ.#!"
 court.9400.b:0 "อา, [court_jester.GetFirstNameNoTooltip], ช่างสร้างสรรค์ยิ่งนัก! นี่คือของกำนัลเล็กน้อยเพื่อแสดงความชื่นชม"
 court.9400.c:0 "#EMP นักฆ่า! ทหารยาม!#!"
 court.9400.d:0 "ฮ่าๆ! นี่สิความบันเทิง!"
 absolutely_horrified_opinion:0 "หวาดกลัวอย่างที่สุด"
 best_meal_of_my_life_modifier:0 "มื้ออาหารที่ดีที่สุดในชีวิต"
 best_meal_of_my_life_modifier_desc:0 "ตัวละครนี้ได้ทานบางสิ่งที่ยอดเยี่ยมอย่างที่สุด!"
 suspicious_against_pies_modifier:0 "ระแวงพาย"
 suspicious_against_pies_modifier_desc:0 "ตัวละครนี้ระแวดระวังและตื่นตัวเป็นพิเศษต่อสิ่งใดก็ตามที่มีรูปร่างคล้ายพายแม้เพียงเล็กน้อย รวมถึงอาหารประเภทอื่น ๆ และทุกสิ่งทุกอย่างด้วย..."
 
 court.9500.t:0 "ภาษาเล็กน้อย"
 court.9500.desc:1 ""คารวะ ท่าน [ROOT.Char.GetTitleTierName] ผู้ [ROOT.Char.Custom('ComplimentAdjective')]" [teacher_target.GetFirstName] กล่าว, [teacher_target.Custom('quirk_pos_pp')].\n\n"ข้าสนใจในการเลี้ยงดู [child_to_learn_language.Custom('GetDaughterSon')] ของท่าน, [child_to_learn_language.GetFirstName] เป็นอย่างยิ่ง ท่านทราบหรือไม่ว่า ข้าพูดภาษา [culture_language_to_learn.GetLanguage.GetNameNoTooltip] ได้ — ซึ่งเป็นภาษาที่ข้าเชื่อว่าจะเป็นประโยชน์อย่างยิ่งหาก [child_to_learn_language.GetHerHim] ได้เรียนรู้" [teacher_target.GetSheHe] อธิบายด้วยน้ำเสียงจริงใจ\n\n"ข้าเพียงต้องการเหรียญสำหรับซื้อปากกาขนนก หมึก กระดาษหนัง... และค่าตอบแทนส่วนตัวเล็กน้อย แน่นอน""
 court.9500.a:0 "ฟังดูมีประโยชน์ยิ่งนัก ข้าจะจ่าย #EMP ทุกอย่าง#! เพื่อให้มันเกิดขึ้น"
 court.9500.b:0 "[child_to_learn_language.GetFirstNameNoTooltip], จง ทำให้ดีที่สุด!"
 court.9500.c:1 "ชิ! ใครกันที่ต้องพูดภาษาอื่นนอกจาก [ROOT.Char.GetCulture.GetLanguage.GetNameNoTooltip]!?"
 court.9500.b.success:1 "[child_to_learn_language.GetFirstNameNoTooltip] เรียนรู้ภาษา [culture_language_to_learn.GetLanguage.GetNameNoTooltip] ได้สำเร็จ"
 court.9500.b.failure:0 "[child_to_learn_language.GetFirstNameNoTooltip] รู้สึกเครียด"
 
 court_maintenance.0010.t:0 "บัลลังก์ที่ว่างเปล่า"
 court_maintenance.0010.desc:1 "ข้าราชบริพาร [messenger.GetName] ของข้ายืนกรานที่จะเข้าเฝ้า แม้ว่าข้าจะได้แจ้งให้ทราบแล้วว่าข้าต้องการอยู่ตามลำพัง:\n\n"ท่าน [ROOT.Char.GetTitleTierName] ผู้ [ROOT.Char.Custom('ComplimentAdjective')]! เป็นเวลานานแล้วที่ท่านไม่ได้ปรากฏตัวในราชสำนักครั้งล่าสุด\nพวกเราทุกคนพยายามอย่างเต็มที่เพื่อรักษาหน้าตาในยามที่ท่านไม่อยู่ แต่ราชสำนัก [ROOT.Char.GetPrimaryTitle.GetAdjectiveNoTooltip] ไม่อาจดำเนินต่อไปได้หากปราศจาก [ROOT.Char.GetTitleTierName] เข้าร่วม"\n\nการที่ข้าหายไปจากราชสำนักเป็นเวลานานได้ทิ้งให้ที่นั่นไร้ผู้นำและไร้จุดหมาย"
 court_maintenance.0010.desc.seeking_gainful_employment:0 "เหล่าข้าราชบริพารของข้าต่างเปรียบเทียบสถานการณ์ของตนกับราชสำนักอันทรงเกียรติ เช่นราชสำนัก [great_cgv_court.GetPrimaryTitle.GetAdjectiveNoTooltip] มากขึ้นเรื่อยๆ"
 court_maintenance.0010.desc.general_ending:0 "เหล่าข้าราชบริพารของข้าต่างเปรียบเทียบสถานการณ์ของตนกับราชสำนักต่างแดนมากขึ้นเรื่อยๆ"
 court_maintenance.0010.a:0 "ถึงเวลาแล้วที่ข้าจะไปเยือนราชสำนัก"
 court_maintenance.0010.a.tooltip:0 "ท่านจะเข้าสู่ราชสำนัก"
 court_maintenance.0010.b:0 "ข้าจะไปเยือนราชสำนักเมื่อข้าเห็นสมควร"
 court_maintenance.0010.b.tooltip:0 "ข้าราชบริพารบางคนอาจออกจากราชสำนักของท่านไปยังราชสำนักใน [great_cgv_court.GetPrimaryTitle.GetName]"
