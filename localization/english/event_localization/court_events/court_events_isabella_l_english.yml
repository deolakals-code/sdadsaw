l_english: 

 ##### A diplomat bleeds to death in your throne room by Isabella Welch
 
 court.4001.t:0 "บาดแผลเล็กน้อย"
 court.4001.desc:0 "แอ่งเลือดกำลังแข็งตัวอยู่ใต้เท้าของ [bleeding_diplomat.GetName] ทูตที่ส่งมาจากพันธมิตรของข้า [bleeding_diplomat_liege.GetName] จากปริมาณมหาศาลที่ซึมลงบนพรมชั้นดีของข้า ข้าสันนิษฐานได้เพียงว่า[bleeding_diplomat.GetSheHe]เลือดออก ณ จุดนี้มาหลายชั่วโมงแล้ว หรืออาจนานกว่านั้น\n\n"ขออภัยสำหรับความเลอะเทอะนี้ ข้าถูกคนแคระโยนออกจากหน้าต่างขณะพยายามปล้นข้าในโรงเตี๊ยมระหว่างการเดินทางมายัง [ROOT.Char.GetCapitalLocation.GetTitle.GetNameNoTierNoTooltip] อย่างไรก็ตาม เนื่องจากเจ้าคนพาลรองรับการตกของข้า การเยือนทางการทูตจึงดำเนินต่อไปได้ — ยังคงต้องใช้เวลาอีก #EMP หลายวัน#! กว่าที่การเสียเลือดของข้าจะถึงแก่ชีวิต!""
 court.4001.a:0 "ทหาร บังคับให้[bleeding_diplomat.GetWomanMan]ผู้นี้ไปพบแพทย์"
 court.4001.b:0 "ปฏิทินของข้ามีที่ว่างสัปดาห์หน้าเท่านั้น — เจ้าทนไหวไหม?"
 court.4001.c:0 "เราคุยกันตอนนี้ได้ แต่เจ้าเหนือหัวของเจ้าต้องจ่ายค่าพรมของข้า"
 court.4001.carpet:0 "ท่านต้องทำความสะอาดพรมของท่าน"
 court.4001.new_carpet:0 "[bleeding_diplomat.GetSheHe|U] จะเลือดออกมากขึ้น — ท่านจะต้องซื้อพรมใหม่"
 court.4001.toast:0 "[bleeding_diplomat.GetName] เสียชีวิต"
 court.4001.toast_desc:0 "[bleeding_diplomat.GetName] เลือดออกจนตายบนพรมหรูหราของท่าน"
 court.4001.cure_toast:0 "แพทย์รักษาทูต"

##### All-male-choirs by Isabella Welch

 court.4100.t:0 "ผู้ติดตามของ [GetPlayer.Custom( 'KnightCulturePluralNoTooltip' )]"
 court.4100.desc:0 "นักดนตรีราชสำนักของข้าเข้ามาหาข้า แทบจะกระโดดโลดเต้นไปตามจังหวะที่[court_musician.GetSheHe]ได้ยินอยู่ผู้เดียว\n\n"ขอความสนพระทัยสักนิดเถิด [ROOT.Char.Custom('FormOfAddressForLiege')] ข้าได้เตรียมคณะนักร้องประสานเสียงชายล้วนที่มิอาจเปรียบได้! ตามวิธีการใหม่ของข้า พวกเขาไม่เพียง แต่ขับขาน แต่ยังสวมกางเกงรัดรูป สวมกระจับที่วิจิตรตระการตาบนบั้นเอวที่เปล่งประกาย และเต้นรำอย่างพร้อมเพรียง! ทั้งหมดนี้อยู่ท่ามกลางการสรรเสริญ [ROOT.GetCharacter.GetFaith.HighGodName] แน่นอนอยู่แล้ว ข้ามั่นใจว่าหากท่านให้ทุนสนับสนุนการแสดงอันยิ่งใหญ่นี้ มันจะเป็นที่พอใจของเหล่าสตรีในราชสำนักอย่างที่สุด""
 court.4100.a:0 "ข้าขยะแขยง! โยนเจ้าคนวิปริตนี่ลงคุกใต้ดิน!"
 court.4100.b:0 "ข้ามั่นใจว่ากางเกงรัดรูปของพวกเขามันมากเกินกว่าที่เหล่าสตรีจะทนได้"
 court.4100.c:0 "เจ้าได้เหรียญของข้าแล้ว ข้ารอคอยการแสดงอย่างใจจดใจจ่อ!"

##### My Spire is Bigger than Yours! by Isabella Welch #####

 court.4250.t:0 "ยอดแหลมของข้าใหญ่กว่าของเจ้า!"
 court.4250.desc:1 ""เหล่าข้าราชสำนักผู้อ่อนแอแห่ง [ROOT.Char.GetCapitalLocation.GetTitle.GetNameNoTierNoTooltip]," [tower_challenger_rival.GetTitledFirstName] บุกเข้ามาหน้าห้องบัลลังก์ของข้า\n\n"ขณะที่ [ROOT.Char.GetTitledFirstNameNoTooltip] กำลังเกลือกกลั้วอยู่กับพื้นราวกับสุกรในปลักโคลน ข้าได้สร้างหอคอยที่สูงที่สุดเท่าที่โลกอันแสนชังนี้เคยเห็นมาใน [tower_challenger_rival.GetCapitalLocation.GetTitle.GetNameNoTier] จาก [tower_challenger_rival.Custom('FortifiedBuilding')] ของข้า บัดนี้ข้าแทบจะเด็ดดวงดาวเคราะห์จากฟากฟ้าได้ ดวงดาวของเจ้าอยู่ที่ใดเล่า [ROOT.Char.GetTitledFirstNameNoTooltip]?"\n\n[concerned_steward.GetCouncilTitle|l] [concerned_steward.GetTitledFirstName] ของข้า วางมือบนไหล่ข้าอย่างระมัดระวัง "[ROOT.Char.Custom('FormOfAddressForLiege')|U] หอคอยของ [tower_challenger_rival.GetTitledFirstNamePossessiveNoTooltip] นั้นสูงสี่ร้อยฟุต สร้างจากดินเหนียวและปูนที่โครงสร้างไม่มั่นคง โปรดเมินคำสบประมาทของ [tower_challenger_rival.GetHerHis] และรอให้มันพังทลายลงเถิด!""
 court.4250.a:0 "ไปเอายอดแหลมเสียดฟ้าของเจ้าไปยัดก้นสูงส่งของเจ้าซะ!"
 court.4250.b:0 "เราจะต่อเติมหอคอยของเราให้สูงกว่าของเจ้าหนึ่งฟุต!"
 court.4250.c:0 "ข้าต้องการให้เราสร้างหอคอยที่สูงกว่า #EMP หนึ่งร้อยฟุต#!"
 court.4250.b.tt:0 "ท่านจะติดเสาธงที่ยาวมากเข้ากับ [THIS.GetCharacter.Custom('FortifiedBuilding')] ของท่าน"
 court.4250.c.success.tt:0 "ท่านสร้างหอคอยขนาดมหึมา"
 court.4250.c.failure.tt:0 "หอคอยของท่านพังทลายลงมาระหว่างการก่อสร้าง"
 court.4250.c.failure_toast_title:0 "หอคอย [ROOT.Char.Custom('FortifiedBuilding')] ของท่านพังทลาย!"
 court.4250.c.accident.tt:0 "เกิดอุบัติเหตุร้ายแรงขึ้น"
 court.4250.c.accident.tt.flavour:0 "ใครจะรู้ว่าอะไรอาจผิดพลาดได้..."

### Spires part 2

 court.4251.desc:0 "เมื่อได้ยินข่าวว่าหอคอยสูงตระหง่านของข้าเสร็จสมบูรณ์ในที่สุด ข้าก็เชิญข้าราชสำนักทั้งหมดออกไปชมด้านนอก หอคอยทะลุผ่านท้องฟ้า แต่ก็แกว่งไกวไปตามลม"
 court.4251.desc_child_accident:0 "\n\nจากฝูงชนข้าราชสำนักที่กำลังจ้องมอง ลูกของข้า [crushed_child.GetName] เริ่มคลานด้วยความอยากรู้อยากเห็นไปยังฐานของโครงสร้างอันยิ่งใหญ่ จ้องมองมันด้วยตาเบิกกว้าง\n\n[crushed_child.GetNameNoTooltip] ไม่มีเวลาแม้ แต่จะกรีดร้องเมื่อยอดหอคอยหักลงมา ร่วงหล่นลงมา และเปลี่ยน[crushed_child.GetHerHim]ให้กลายเป็นเศษเนื้อ"
 court.4251.desc_rival_accident:0 "\n\nข้าเชิญ [tower_challenger_rival.GetTitledFirstNameNoTooltip] ให้มาร่วมปีนกับข้า [tower_challenger_rival.GetSheHe|U] ตะลึงกับทิวทัศน์จนหายใจไม่ออก — หรืออาจเป็น เพราะบันได เมื่อเราไปถึงยอดและข้าโบกมือให้ข้าราชสำนักด้านล่าง [tower_challenger_rival.GetSheHe] พิงราวบันได ซึ่งพังลงมาทันที ส่ง[tower_challenger_rival.GetHerHim]ดิ่งลงสู่สวรรค์"
 court.4251.desc_success:0 "\n\nเหล่าข้าราชสำนักที่กำลังจ้องมองของข้าต้อนรับหอคอยด้วยเสียงปรบมือดังกึกก้อง แต่ด้วยเหตุผลบางอย่าง ทุกคนต่างหลีกเลี่ยงที่จะยืนอยู่ในเงาของมัน\n\n[tower_challenger_rival.GetTitledFirstNameNoTooltip] กระซิบกับข้าว่า "เจ้าหมา ข้าสาบานว่าข้าจะกลับมาพร้อมหอคอยที่สูงกว่านี้ #EMP สองเท่า#!"
 court.4251.a:0 "โอ้ [crushed_child.GetNameNoTooltip] เจ้าช่างน่ารักเหมือนแพนเค้ก!"
 court.4251.b:0 "ในที่สุดเจ้าก็บินได้แล้ว [tower_challenger_rival.GetTitledFirstNameNoTooltip]"
 court.4251.c:0 "ตอนนี้ใครกำลังเกลือกกลิ้งอยู่ในโคลนกันแน่ [tower_challenger_rival.GetTitledFirstNameNoTooltip]?"

### Crusades Preaching Tours by Isabella Welch

 court.4300.t:0 "ควอนตัม เพรเดเซสโซเรส"
 court.4300.preaching_tour_bernard_of_clairvaux_intro:0 "แบร์นาร์แห่งแคลร์โวซ์อยู่ที่นี่เพื่อแวะพักระหว่างการเดินทางเทศนาทั่วทวีปของ[right_portrait_character.GetHerHis]เพื่อโหมไฟสงครามศักดิ์สิทธิ์ที่กำลังดำเนินอยู่ [bishop.GetCouncilTitle] ของข้าแจ้ง[right_portrait_character.GetSheHe]ข้าว่า[right_portrait_character.GetSheHe]เป็นศูนย์กลางในการร่างหลักคำสอนสำหรับภาคีอัศวินเทมพลาร์ศักดิ์สิทธิ์กลุ่มแรก\n\n"
 court.4300.preaching_tour_bernard_of_clairvaux_theology:0 ""ข้ารู้สึกตื่นเต้นที่ได้อยู่ใกล้ผู้มีชื่อเสียงอีกคนในด้านความเข้าใจในเทววิทยาของ[ROOT.Char.GetHerHis] ข้ากำลังทำงานเกี่ยวกับบทความใหม่เกี่ยวกับภาคีทหารของเรา: 'สรรเสริญอัศวินยุคใหม่' หากท่านเหลือบมองดู ข้าจะส่งข่าวไปยัง [ghw_sponsor.GetTitledFirstName] อย่างแน่นอนว่า[ghw_sponsor.GetSheHe]ควรออกสารตราพระสันตะปาปาเพื่อสนับสนุนภาคีของท่านเอง""
 court.4300.preaching_tour_bernard_of_clairvaux_flea_excommunication:0 ""ข้าขอขอบคุณสำหรับไมตรีจิตของท่าน เพื่อเป็นการตอบแทนความเมตตาของท่าน ข้าสังเกตเห็นว่าข้าราชสำนักหลายคนของท่านกำลังเกาแผลกัดจำนวนมาก ข้าเคยขับไล่ฝูงแมลงวันนับพันตัว ทำให้พวกมันตายทันที ดูเหมือนว่าท่านจะมีหมัดเน่าๆ บางตัวที่ต้องการการตำหนิทางศาสนจักร!""
 court.4300.preaching_tour_bernard_of_clairvaux_standard:0 ""ข้ามีเรื่องสำคัญจะขอร้องท่าน แม้ว่า [ROOT.GetCharacter.GetFaith.HighGodName] จะประทานพรแก่จิตใจข้า แต่[ROOT.GetCharacter.GetFaith.HighGodNameSheHe]ไม่ได้ประทานพรแก่ลำไส้ข้า ด้วยความอดกลั้นของข้าในปัจจุบัน ข้าไม่สามารถเทศนาได้หากไม่มีส้วมหลุมขุดอยู่ข้างใต้ข้า มีใครบ้างที่จะติดตามการเดินทางของข้าในฐานะคนขุดหลุมของพระคริสต์?""
 court.4300.preaching_tour_default:0 "นักบวชคนหนึ่งได้ปิดกั้นทางเข้าท้องพระโรงของท่าน แจกตราสีแดงรูปกากบาทให้ผู้ที่เดินเข้ามาติดบนเสื้อผ้าของพวกเขา\n\n"ขอบคุณ [ROOT.GetCharacter.GetFaith.HighGodName]! ข้ากำลังเดินทางเทศนาผ่านอาณาจักรของพันธมิตรที่ให้คำมั่นสัญญาของเราในสงครามศักดิ์สิทธิ์ เทศนาเพื่อสนับสนุนการเกณฑ์ทหารและเงินทุน""
 court.4300.a:0 ""ท่านมีปากกาและดาบของข้า!""
 court.4300.b:0 ""ให้เราขับไล่แมลงนอกรีตเหล่านี้!""
 court.4300.c:0 ""ข้ามั่นใจว่า [possible_latrine_digger.GetTitledFirstNameNoTooltip] อยากจะช่วยอย่างยิ่ง!""
 court.4300.d:0 ""คลังสมบัติของข้าเปิดกว้างเหมือนท้องฟ้า!""
 court.4300.e:0 ""ท่านจะมีทหารองครักษ์ส่วนตัวของข้าติดตามไปในภารกิจของท่าน""
 court.4300.e.tt:0 "[bernard_guard_1.GetTitledFirstName] และ [bernard_guard_2.GetTitledFirstName] จะคุ้มกัน [right_portrait_character.GetTitledFirstName] ไปทั่วอาณาจักรของท่าน"
 court.4300.f:0 "ไม่คู่ควรที่จะพูดคุยกับ[right_portrait_character.GetWomanMan] เช่นนี้ ข้าคุกเข่าลงอย่างเงียบๆ"
 court.4300.g:0 "ตรากากบาทของ[right_portrait_character.GetHerHis|U]ดูค่อนข้างไม่มีรสนิยมใช่ไหม?"
 court.4300.a.tt:0 "ค่าใช้จ่ายใน [piety|E] และ [gold|E] ในการก่อตั้งภาคีศักดิ์สิทธิ์ลดลงอย่างมาก"

## Our Caravans are being attacked by Christian Nobles by Isabella Welch
 court.4350.t:0 "หญ้าฝรั่นในเปลวเพลิง"
 court.4350.desc:0 "[concerned_marshal.GetCouncilTitle] ของข้าเพิ่งพูดคุยกับพ่อค้าที่ถูกไฟคลอกสองคนที่เดินกะโผลกกะเผลกเข้ามาในท้องพระโรงของข้าเสร็จ "ขบวนคาราวานการค้าของเราที่นำหญ้าฝรั่นจาก [caravan_attacker_liege.GetCapitalLocation.GetTitle.GetNameNoTier] มายัง [ROOT.Char.GetCapitalLocation.GetTitle.GetNameNoTier] ถูกปล้นสะดม คนร้ายไม่ใช่โจร แต่เป็นกลุ่มขุนนางคริสเตียนติดอาวุธเต็มยศ"\n\n[concerned_marshal.GetSheHe|U] ถอนหายใจลึกๆ "พวกโง่เขลาที่คิดถึงการสังหารหมู่ประชาชนของเรากำลังพยายามยั่วยุให้เราทำสงครามภายใต้จมูกของเจ้าเหนือหัวของพวกเขา หากเราตอบโต้ เราเสี่ยงที่จะทำลายข้อตกลงกับ [caravan_attacker_liege.GetName] เกี่ยวกับการนำเข้าสินค้าฟุ่มเฟือยที่ข้าราชสำนักของเราชื่นชอบมาก""
 court.4350.a:0 "เป็นการยากที่จะเพิกเฉยต่อความโง่เขลา เช่นนี้ แต่การค้าต้องมาก่อน"
 court.4350.b:0 "ให้เราทำการปล้นสะดมของเราเองบ้าง!"
 court.4350.c:0 "เราจะได้เห็นว่าเจ้าเด็กพวกนี้จะร้องไห้คร่ำครวญอย่างไรเมื่อเราหยุดค้าน้ำตาล!"
 court.4350.c.tt:0 "#F ท่านยุติการค้ากับ [caravan_attacker_liege.GetNameNoTooltip]#!"

## Our Nobles are attacking Islamic Caravans by Isabella Welch

 court.4355.t:0 "ใครกล้าต่อกรกับซาราเซ็น?"
 court.4355.desc:0 ""[ROOT.Char.Custom('FormOfAddressForLiege')|U]," [reporting_marshal.GetCouncilTitle] ของข้าเอ่ยขึ้น "ข้าได้ยินมาว่า [caravan_attacker.GetTitledFirstName] คุยโวว่า [caravan_attacker.GetSheHe] และกลุ่มขุนนางได้ออกไปปล้นสะดมกองคาราวานที่ขนน้ำตาลจาก [attacked_liege.GetCapitalLocation.GetTitle.GetNameNoTier] ราวกับพวกโจรทั่วไป เจ้าพวกนี้กระหายสงครามศักดิ์สิทธิ์ และกำลังพยายามยั่วยุ [attacked_liege.GetTitledFirstName] ทว่า ข้าเห็นควรว่าเราต้องการการค้ามากกว่าการรบพุ่งใดๆ—"\n\n"เราไม่ต้องการอาหาร เราต้องการเพียงดื่มเลือดของพวกนอกรีต!" [caravan_attacker.GetTitledFirstNameNoTooltip] ตะโกนลั่นมาจากอีกฟากของห้องบัลลังก์"
 court.4355.a:0 "ผลงานยอดเยี่ยม! การปล้นสะดมพวกนอกรีตเป็นการกระทำอันศักดิ์สิทธิ์!"
 court.4355.a.tt:0 "ท่านจัดการปล้นสะดมทางการค้าเพิ่มเติม"
 court.4355.b:0 "ทหาร! เฆี่ยนตี[caravan_attacker.GetHerHim]ด้วยชามน้ำตาลจนกว่า[caravan_attacker.GetSheHe]จะสำนึกผิด"
 court.4355.c:0 "ข้ารู้สึกว่า[caravan_attacker.GetSheHe]จะยังคงปล้นสะดมต่อไปโดยไม่คำนึงถึงคำสั่งของข้า"
 court.4355.c.tt:0 "#F [caravan_attacker.GetSheHe|U] จะทำแน่นอน!#!"

# Monks/Holy men chasing the decapitated head of their target of worship by Isabella Welch
# better title please
 court.4400.t:0 "การได้หัวมา"
 court.4400.desc:0 "ฝูง[head_chasing_monk.GetWomenMen]ในชุดคลุมบุกเข้ามาในท้องพระโรงของข้า ค้นหาพื้นอย่างบ้าคลั่งและรื้อทุกอย่างตั้งแต่เก้าอี้ไปจนถึงกระโปรงในการค้นหาอย่างตื่นตระหนก\n\n"[ROOT.Char.GetTitledFirstNameNoTooltip]!" คนหนึ่งร้องตะโกน "เราคือผู้ติดตามของ [the_headless.GetTitledFirstNameNoTooltip] ผู้ไร้ศีรษะ [the_headless.GetWomanMan]ผู้ศักดิ์สิทธิ์ผู้ยิ่งใหญ่ ซึ่งถูกตัดศีรษะตามคำพยากรณ์ที่ [ROOT.GetCharacter.GetFaith.HighGodName] ประทานให้[the_headless.GetHerHim]เมื่อแรกเกิด ดังที่มักเกิดขึ้นกับบุคคลศักดิ์สิทธิ์ ศีรษะของ[the_headless.GetHerHis]เริ่มกลิ้งหนีไป เราได้ไล่ตามมันไปทั่วแผ่นดิน และ #EMP มั่นใจ#! ว่ามันกลิ้งขึ้นเนินเขาเข้าไปใน [ROOT.GetCharacter.Custom('FortifiedBuilding')] ของท่าน!""
 court.4400.a:0 "เจ้าได้รับอนุญาตให้ค้นหา [ROOT.GetCharacter.Custom('FortifiedBuilding')] ได้"
 court.4400.b:0 "ให้ข้าร่วมค้นหาด้วย!"
 court.4400.c:0 "ข้าจะไม่ยอมให้ลัทธิมารื้อค้นราชสำนักของข้า!"
 court.4400.b.discovery:0 "ท่านพบวัตถุโบราณที่ถูกลืมไปนานใน [THIS.GetCharacter.Custom('FortifiedBuilding')] ของท่าน"
 court.4400.b.failure:0 "พวกคลั่งลัทธิก่อความวุ่นวาย"
 court.4400.b.severed_head:0 "พบศีรษะที่ถูกตัดแล้ว!"
 court.4400.c.backdown:0 "ลัทธิถูกข่มขู่"
 court.4400.c.refusal:0 "ลัทธิจะกลับมา"

#Rummaging through the castle
 court.4401.desc:0 "ห้องใต้ดินของ [ROOT.GetCharacter.Custom('FortifiedBuilding')] ของข้ามีของจุกจิกไร้ประโยชน์มากกว่าที่ข้าอยากจะยอมรับ"
 court.4401.desc_arbitrary:0 "ข้าโอ้อวดกับ [head_chasing_monk.GetName] ถึงแผนการรักษาความปลอดภัยอันชาญฉลาดของข้า — หากไม่มีใครนอกจากข้าเข้าใจว่ากองของต่างๆ จัดระเบียบอย่างไร ข้าก็ไม่มีวันถูกปล้น!"
 court.4401.desc_default:0 "ทุกครั้งที่ [head_chasing_monk.GetName] เปิดประตูใหม่ ข้าคาดว่า[head_chasing_monk.GetHerHim]จะถูกกองของแปลกๆ ทับ ข้าลืมแม้กระทั่ง [ROOT.Char.Custom('RandomPrivateObject')] ของข้าไว้ที่นี่!"
 court.4401.desc_object:0 "\n\nหลังจากการรื้อค้นอย่างเป็นกันเอง เราไม่พบศีรษะ แต่ [head_chasing_monk.GetName] ดูเหมือนจะหลงใหลในทุกสิ่ง พิจารณาจากความละเอียดอ่อนที่[head_chasing_monk.GetSheHe]ตรวจสอบ [ROOT.Char.Custom('RandomWeirdObject')] ที่ถูกทิ้งร้าง [head_chasing_monk.GetSheHe] อาจเป็นนักโบราณคดีที่มีค่า"
 court.4401.desc_head:0 "\n\nบางทีอาจนำทางด้วยกลิ่นเหม็นเน่า [head_chasing_monk.GetSheHe] ดึงศีรษะมนุษย์ออกมาจากท่ามกลางเศษซากเหมือนหมูคุ้ยหาเห็ดทรัฟเฟิล\n\nอย่างไรก็ตาม ความใกล้ชิดของห้องใต้ดินกับคุกใต้ดินบ่งชี้ว่าน่าจะเป็นวิญญาณที่ถูกลืมบางดวงจากห้องทรมานของข้า"
 court.4401.a:0 "อา ใช่! อะแฮ่ม มันคือ [the_headless.GetTitledFirstNameNoTooltip]! สรรเสริญ [ROOT.GetCharacter.GetFaith.HighGodName]... และทั้งหมดนั้น"
 court.4401.b:0 "ดูรอยตัดที่สะอาดสิ! นั่นเป็นฝีมือข้าอย่างชัดเจน"
 court.4401.c:0 ""เจ้าจะสนุกกับการคุ้ยขยะของข้าเพื่อหาเลี้ยงชีพหรือไม่?""
 court.4401.d:0 "ข้างล่างนี้ค่อนข้างสกปรก — ข้าควรสั่งให้ทำความสะอาด"

## Being threatened by the cultist

 court.4402.desc:0 "คืนหนึ่งข้าสะดุ้งตื่นและพบว่าตัวเองกำลังถูกคร่อมอยู่ นี่ไม่ใช่ความฝันอันหฤหรรษ์ — นักบวชวิกลจริตที่บุกเข้ามาในท้องพระโรงของข้ากำลังถือมีดผ่าตัดจ่อคอข้า!\n\n"ข้าเดาว่าถ้าเจ้าห้ามไม่ให้เราตามหาศีรษะ เราอาจจะเอาของเจ้าแทนก็ได้ ช่างกลมและเงางาม ข้าพนันได้เลยว่ามันจะกลิ้งได้ดี!""
 court.4402.a:0 "ทำไมเราไม่ไปตามหามันตอนนี้เลยล่ะ?"
 court.4402.a.tt:0 "ท่านพา[head_chasing_monk.GetHerHim]ไปยังห้องใต้ดินของท่าน"
 court.4402.b:0 "เราไม่เห็นศีรษะ! ปล่อยข้าไป!"
 court.4402.b.success:0 "ท่านปล้ำกับนักบวชและส่ง[head_chasing_monk.GetHerHim]ไปยังคุกใต้ดิน"
 court.4202.b.success.tt:0 "ท่านส่ง [head_chasing_monk.GetName] ไปยังคุกใต้ดิน"
 court.4402.b.failure:0 "ท่านได้รับบาดเจ็บหรือเสียชีวิต"
 court.4402.c:0 "ข้าพนันได้เลยว่าเจ้าตัดคอข้าด้วยของเล็กๆ นั่นไม่ได้หรอก!"
 court.4402.c2.tt:0 "ท่านถูกตัดคอบางส่วน"
 court.4402.c3.tt:0 "ท่านถูกตัดคอทั้งหมด"


## A series of questionable artifacts are up for sale by Isabella Welch
 court.4500.t:0 "กระดูกนิ้วของ [ROOT.Char.GetTitleAsNameNoTooltip]"
 court.4500.desc:0 "พ่อค้าเร่ในเสื้อคลุมที่มีเครื่องประดับและของจุกจิกเย็บติดอยู่หลายสิบชิ้นส่งเสียงกรุ๊งกริ๊งเข้ามาหาข้า\n\n"
 court.4500.bleeder:0 ""ข้าสร้างสิ่งประดิษฐ์เพื่อหลอกลวงคนโง่ที่ร่ำรวยให้เสียทอง มีเสียงกระซิบมาถึงข้าว่าท่านมีเลือดมากเกินไป ข้ามั่นใจว่าท่านมีผู้ชื่นชมบางคนที่ยินดีที่จะซื้อเข็มกลัดที่มีลูกแก้วบรรจุเลือดของท่านหนึ่งหยด"\n\n[artifact_peddler.GetSheHe|U] จ้องมองเส้นเลือดที่คอข้า "ข้าจะจ่ายอย่างงาม และคนโง่บางคนจะรู้สึกว่าพวกเขามีสัมผัสแห่งความสง่างามของราชวงศ์"
 court.4500.psalter:0 ""ข้ามีหนังสือสวดมนต์อันงดงาม - ต้นฉบับที่ประดับประดาด้วยภาพวาดพร้อมปกงาช้างแกะสลักประดับด้วยลูกปัดเทอร์ควอยซ์ มันมีเรื่องราวของ[ROOT.GetCharacter.GetWomanMan]และ[cheating_character.GetWomanMan]ที่รักกัน การแกะสลักจะสร้างความประทับใจให้ [cheating_character.GetTitledFirstNameNoTooltip] อย่างแน่นอน ดังนั้น [cheating_character.GetSheHe] จะไม่คิดที่จะนอนกับคนอื่นอีกเลย!""
 court.4500.chastity_belt:0 ""ทุกคนในอาณาจักรรู้ว่าท่านเต็มไปด้วยความปรารถนาอันหิวกระหาย ซึ่งมีพลังเทียบเท่ากับเครื่องยิงหินคาตาแฟรคต์ ข้ามีสิ่งประดิษฐ์ที่จะช่วยแบ่งเบาภาระของท่าน"\n\n[artifact_peddler.GetSheHe|U] เผยให้เห็นเข็มขัดพรหมจรรย์ที่ประดับด้วยหนามสนิม"
 court.4500.holy_needle:0 ""ข้ามีอาวุธอันล้ำค่าติดตัวมา ซึ่งคู่ควรกับมือของท่านเท่านั้น หอกศักดิ์สิทธิ์แห่งอันทิโอก หอกแห่งโชคชะตา! ท่านจะทำลายล้างพวกนอกรีตในสนามรบได้อย่างสิ้นเชิงด้วยสิ่งนี้!"\n\n[artifact_peddler.GetSheHe|U] ดึงเศษโลหะเล็กๆ ที่ดูเหมือนเข็มเย็บผ้าออกมา"
 court.4500.finger_bones:0 ""ท่านดูเหมือนนักสะสมผู้ช่ำชอง" [artifact_peddler.GetSheHe|U] ดึงหีบที่บุบสลาย ซึ่งเต็มไปด้วยกระดูกจากทุกส่วนของร่างกายเท่าที่จะจินตนาการได้ออกมาและเปิดมัน\n\n"ข้ามีกระดูกนิ้วของนักบุญที่หายากที่สุดบางชิ้น แม้กระทั่งบางชิ้นที่หุ้มด้วยทองคำ พวกมันขายเป็นชิ้นเดี่ยว แต่ข้าจะให้ราคาพิเศษสำหรับชุดสิบนิ้วเต็ม""
 court.4500.dead_chicken:0 ""ข้ามีเครื่องรางวิเศษอยู่ที่นี่! พกสิ่งนี้ไว้ แล้วศัตรูในสนามรบจะคิดว่าท่านตายแล้วทันที! แค่สูดกลิ่นเดียว ความปลอดภัยของท่านก็รับประกันได้!"\n\nจากส่วนลึกของเสื้อคลุมของ[artifact_peddler.GetHerHis] [artifact_peddler.GetSheHe] ดึงซากไก่ทั้งตัวออกมา"
 court.4500.worm:0 ""ใต้เท้า [ROOT.GetCharacter.GetLadyLord] ข้ามีสิ่งประดิษฐ์แห่งภาพลวงตาอันยิ่งใหญ่ ซึ่งท่านอาจใช้โน้มน้าวให้ทุกคนเชื่อว่าท่านมีพลังเวทมนตร์\n\n[artifact_peddler.GetSheHe|U] ชูหนอนผ้าสีสันสดใสบนเชือกเส้นบางมาก "ตอนแรกมันดูเหมือนจะอยู่เฉยๆ แต่ด้วยการควบคุมเชือก เราสามารถสร้างภาพลวงตาว่าหนอนมีชีวิตขึ้นมาได้! ลองคิดดูสิว่าสิ่งนี้จะสร้างความประทับใจให้ [dummy_gender.Custom('LadiesLords')] ในราชสำนักได้อย่างไร!""
 court.4500.a:0 "เลือดของข้าแทบจะไม่อยู่ในร่างกายแล้ว — ไปให้พ้น!"
 court.4500.b:0 "ข้าจะลองทุกอย่าง ณ จุดนี้"
 court.4500.c:0 "$court.4500.b$"
 court.4500.d:0 "มันจะ ทำให้บั้นเอวของข้าร้อนรุ่มไปอีกแบบ..."
 court.4500.e:0 "เสียงเรียกแห่งโชคชะตาดังขึ้นแล้ว!"
 court.4500.f:0 "ไปขายคำโกหกของเจ้าที่อื่นซะ!"
 court.4500.g:0 "มีเสน่ห์ในการใช้ของศักดิ์สิทธิ์ของพระคริสต์เพื่อปะถุงเท้าของข้า..."
 court.4500.h:0 "นี่ #EMP คือ#! เหตุผลที่ชาวนาจำนวนมากมีเก้านิ้วในปัจจุบัน"
 court.4500.i:0 "ข้าต้องการแขนท่อนล่างทั้งท่อน!"
 court.4500.j:0 "โอ้ เอาเถอะ"
 court.4500.k:0 "ข้าค่อนข้างเชี่ยวชาญในการแกล้งตายอยู่แล้ว"
 court.4500.l:0 "ข้าจะไม่เล่นเป็นคนเชิดหุ่น!"
 court.4500.m:0 "ข้าสนุกกับการดิ้นไปมา!"
 court.4500.n:0 "$court.4500.j$"


## Your cupbearer is drinking all your wine! By Isabella Welch
 court.4600.t:0 "[ROOT.GetCharacter.Custom('RegionalAlcoholicDrink')|U] ที่ดีที่สุดที่มีให้แก่มนุษยชาติ"
 court.4600.desc:1 "ข้าเห็นพนักงานเชิญพระสุธารสของข้า [cupbearer.GetTitledFirstName] และ [cupbearer_friend.GetTitledFirstName] โซเซเล็กน้อยและกำลังรินเครื่องดื่มจากขวดที่หายากที่สุดขวดหนึ่งของข้าให้ [cupbearer_friend.GetTitledFirstNameNoTooltip]\n\n"ช่างน่าเสียดายที่ [ROOT.GetCharacter.GetTitledFirstName] มี [ROOT.GetCharacter.Custom('RegionalAlcoholicDrink')] ทั้งหมดนี้ที่[ROOT.GetCharacter.GetSheHe]กักตุนไว้เหมือนมังกร"
 court.4600.desc_lover:0 "เจ้าช่างเป็น [cupbearer.Custom('LoverPetName')] ที่น่าอร่อย เจ้าสมควรได้รับรสชาติที่น่าอัศจรรย์เหมือนของเจ้าเอง"
 court.4600.desc_friend:0 "เพื่อนของข้าทุกคนสมควรได้ดื่มเหมือน [ROOT.Char.GetTitleAsNameNoTooltip]!"
 court.4600.desc_ending:1 "\n\nพวกเขาไม่แม้ แต่จะกระพริบตาเมื่อเห็นข้า\n\n "อา ใต้เท้า [ROOT.GetCharacter.GetLadyLord]! เรากำลังทดสอบเครื่องดื่มทั้งหมดของท่านล่วงหน้าเพื่อหายาพิษ หลังจากที่ข้าแบกรับภาระในลำไส้ด้วยทุกหยด ข้าจะแบกรับอาการปวดหัวในวันพรุ่งนี้เสมือนเป็นบาดแผลจากการต่อสู้ที่ได้รับในการต่อสู้เพื่อเกียรติของท่าน!""
 court.4600.a:0 "ห้องเก็บไวน์ของข้าปิดบ่อยเกินไป — ขวดหนึ่งสำหรับทุกคนในราชสำนัก!"
 court.4600.b:0 "คลังสมบัติอันล้ำค่าของข้า! เจ้าเป็นคนรับใช้ที่ #EMP ไม่คู่ควร#!"
 court.4600.b.tt:0 "งานเลี้ยงครั้งต่อไปของท่านจะถูกลงหากท่านหยุดไม่ให้คลังสำรองของท่านถูกดื่ม"
 court.4600.c:0 ""คลังเก็บของปิด เพราะข้าเก็บ [ROOT.GetCharacter.Custom('RegionalAlcoholicDrink')] ที่มียาพิษไว้!""
 court.4600.c.tt:0 "ทั้งสองต้องเรียนรู้จากการไม่เคารพของพวกเขา แต่โลกจะระวังยาพิษของท่าน"
 court.4600.c.t:0 "พนักงานเชิญพระสุธารสถูกวางยาพิษ!"
 court.4600.d:0 "รีบไปเอาขวดอื่นที่เก็บยาแก้พิษไว้"
 court.4600.d.tt:0 "พยายามรักษาคนโง่อย่างลับๆ และเก็บยาพิษของท่านไว้เป็นความลับ"
 court.4600.d.cure.t:0 "ยาแก้พิษถูกใส่ลงในเครื่องดื่ม"
 court.4600.d.cure.tt:0 "ยาพิษของท่านยังคงเป็นความลับ"
 court.4600.e:0 "ข้าคิดว่าข้าจะล็อกห้องเก็บไวน์ที่น่ารังเกียจเหล่านั้นไว้สักพัก"

## A special procedure to cure your ailments is suggested... by Isabella Welch
 court.4700.t:0 "การเจาะกะโหลกแห่งจิตวิญญาณ"
 court.4700.desc_native_trepanning:0 "บุคคลในชุดแพทย์ปรากฏตัวพร้อมกระเป๋าเครื่องมือ แต่ท้องข้าปั่นป่วนเมื่อเห็นค้อนและสิ่วอยู่ในนั้น\n\n"ใต้เท้า [ROOT.GetCharacter.GetLadyLord] ข้าเป็นผู้เชี่ยวชาญการเจาะกะโหลก"
 court.4700.desc_foreign_medicine:0 "บุคคลในชุดดำจากต่างแดนมาถึงพร้อมกระเป๋าที่เต็มไปด้วยค้อนลึกลับ ซึ่งคล้ายกับเครื่องมือของช่างแกะสลัก\n\n"ในดินแดนของข้า มีพิธีกรรมที่เรียกว่าการเจาะกะโหลก ซึ่งดูเหมือนว่าท่านต้องการ"
 court.4700.desc_possessed:0 "ท่ามกลางการถูกสิงสู่ของท่าน วิญญาณว่ายวนอยู่ในจิตใจของท่าน แต่พวกมันไม่ได้ต้องการที่จะอยู่จริงๆ $court.4700.desc_passage$ $court.4700.growth$""
 court.4700.desc_witch:0 "ในฐานะนักเวทมนตร์ พลังของท่านเองอาจน่าเกรงขาม แต่ก็ยังมีอุปสรรคขัดขวางอยู่ เวทมนตร์ของท่านสามารถพิชิตโลกได้หากวิญญาณในอากาศสามารถเข้าสู่กะโหลกของท่านได้"
 court.4700.desc_melancholic:0 "ลองจินตนาการดูว่าความทุกข์ทั้งหมดของท่านสามารถเดินออกจากร่างกายของท่านไปในอากาศได้หรือไม่ ความทรมานของท่านไม่ใช่ของท่าน แต่เป็นวิญญาณที่มีชีวิต ซึ่งข้าสามารถปลดปล่อยได้ $court.4700.growth$""
 court.4700.desc_heavy_mind:0 "จิตใจของท่านหนักอึ้ง แต่นั่นเป็นเพียง เพราะมันถูกถ่วงไว้ ศีรษะของท่านเต็มไปด้วยวิญญาณที่กัดกินสติปัญญาของท่าน ทีละความคิด $court.4700.growth$ $court.4700.desc_passage$""
 court.4700.desc_blind:0 "การมองเห็นของท่านไม่ได้หายไป มันเพียงแค่ขุ่นมัว มีวิญญาณว่ายอยู่ในเนื้อเยื่อตาของท่าน ข้าสามารถดำดิ่งลงไปในสระเหล่านั้นและนำพวกมันออกมาได้"
 court.4700.desc_lunatic:0 "การตัดสินใจของท่านถูกกำหนดโดยเหล่าเพื่อนร่วมทางวิญญาณที่ไม่เต็มใจ พวกเขาคือสภาวิกลจริต $court.4700.growth$ เราสามารถนำพวกมันออกมาได้ ด้วยความช่วยเหลือของหนามสองสามอัน"
 court.4700.desc_headache:0 "ว่ากันว่าท่านทนทุกข์ทรมานจากอาการปวดศีรษะอย่างรุนแรง เนื่องจากชีวิตของท่านเต็มไปด้วยแรงกดดัน วิญญาณจึงรวมตัวกันมากขึ้นเรื่อยๆ และกินความกังวลในกะโหลกของท่าน $court.4700.desc_passage$""
 court.4700.desc_trepanning_vices:0 "ความผิดทางอาญาที่ท่านถูกกล่าวหาไม่ใช่ของท่าน ท่านเพียง แต่อยู่ภายใต้การครอบงำชั่วคราวของวิญญาณบางตน $court.4700.desc_passage$""
 court.4700.growth:0 "พวกมันอาจซ่อนตัวอยู่ในก้อนเนื้อในสมองของท่านก็ได้"
 court.4700.desc_passage:0 "ข้าสามารถสร้างทางผ่านเพื่อปลดปล่อยพวกมันได้"
 court.4700.a:0 "การเยาะเย้ย! ความทุกข์ทรมานของข้ามีมากกว่าความเชื่อโชคลาง!"
 court.4700.b:0 "ข้าทนไม่ไหวแล้ว ไปเอาสิ่วมา!"
 court.4700.b.tt:0 "จะพยายามทำการผ่าตัด..."
 court.4700.c:0 "ข้าไม่ใช่อาชญากร — ประชาชนของข้าต่างหากที่มีความคิดล้าหลัง!"
 court.4700.d:0 "ข้าขอปฏิเสธ แต่บางทีแพทย์ของข้าอาจเรียนรู้จากท่านได้"
 court.4700.success:0 "ท่านรอดชีวิตจากการเจาะกะโหลกโดยไม่ได้รับบาดเจ็บ"
 court.4700.no_success:0 "การเจาะกะโหลกไม่ได้ผลอะไร"
 court.4700.removal:0 "การเจาะกะโหลกขจัดความทุกข์ทรมานของท่าน"
 court.4700.headache:0 "ความกังวลทั้งหมดของท่านหายไป"
 court.4700.witch_power:0 "การเจาะกะโหลกช่วยเพิ่มพลังแม่มดของท่าน"
 court.4700.mental_faculties:0 "การเจาะกะโหลกทำลายความสามารถทางจิตของท่าน"
 court.4700.physical_faculties:0 "การเจาะกะโหลกทำลายร่างกายของท่าน"

## The Trepanning!

 court.4701.physician_study:0 "ข้าถูกพาไปยังห้องทำงานของแพทย์ของข้า [court_physician.GetTitledFirstName] ซึ่ง [trepanner.GetTitledFirstName] แนะนำว่ามีพรสวรรค์ที่จะช่วยในความพยายามของเรา ขณะที่[trepanner.GetSheHe]มัดข้าไว้กับเก้าอี้ [court_physician.GetTitledFirstNameNoTooltip] ก็ยืนอยู่ข้างหลัง"
 court.4701.no_physician:0 "ข้าถูกพาไปยังห้องด้านหลังของ [ROOT.Char.Custom('FortifiedBuilding')] ของข้า [trepanner.GetTitledFirstNameNoTooltip] รับรองกับข้าว่ามันจะ ทำให้เกิดความทุกข์ใจเท่านั้นหากราชสำนักของข้าได้ยินเสียงร้องของข้าขณะที่ข้าถูกมัดไว้กับเก้าอี้\n\n"
 court.4701.physician_excited:0 ""โอ้ ข้าชอบการเจาะกะโหลกดีๆ เสียจริง!"\n\n"
 court.4701.physician_excited_2:0 ""น่าตื่นเต้นจัง! ขั้นตอนใหม่!"\n\n"
 court.4701.physician_concerned:0 ""ระวัง[ROOT.GetCharacter.GetHerHim]ด้วย!"\n\n"
 court.4701.physician_concerned_2:0 ""ข้าจะช่วยหากการปฏิบัติที่หยาบคายนี้ล้มเหลว"\n\n"
 court.4701.mental_health_cannot_be_trepanned_away:0 "$court.4701.trepanning_vices_operation$ \n\nแม้ว่าข้าปรารถนาให้การรักษาสามารถขจัดความเจ็บปวดออกไปได้ แต่ก็มีความปลอดภัยบางอย่างในการรู้ว่าอย่างน้อยจิตใจของข้าก็เป็นของข้าเอง ไม่ใช่ของปีศาจ"
 court.4701.trepanning_success:0 "ค้อนส่งสิ่วเจาะทะลุขม่อมข้า ทันใดนั้นประตูร่างกายข้าก็เปิดออก ข้าใจสั่น ตัวสั่น สะท้าน และรู้สึกว่าไฟแห่งความทรมานของข้ายกขึ้น ท่ามกลางประกายไฟแห่งความเจ็บปวด ข้าปรากฏตัวในโลกใหม่ที่สงบสุขอย่างน่าอัศจรรย์"
 court.4701.trepanning_witch_power:0 "ข้าไม่กลัวเมื่อสิ่วเริ่มฝังตัวลงในกะโหลกศีรษะข้า ท่ามกลางการถูยาขี้ผึ้งลงบนสมองข้า และความรู้สึกที่ ทำให้ตาพร่า ข้าได้ยินเสียงหัวเราะของ [ROOT.Char.GetFaith.WitchGodName|U] และ[ROOT.Char.GetFaith.WitchGodSheHe]กำลังเยาะเย้ยพิธีกรรมไร้สาระนี้\n\n$court.4701.trepanning_no_result$"
 court.4701.trepanning_vices_operation:0 "ค้อนกระแทกเข้าที่กะโหลกศีรษะข้า แต่การจับเก้าอี้ $court.4701.trepanning_no_result$"
 court.4701.trepanning_headache_operation:0 "$court.4701.trepanning_no_result$ อาการปวดหัวของข้าหายไปแล้ว"
 court.4701.trepanning_mental_injury:0 "[trepanner.GetTitledFirstNameNoTooltip] ค่อยๆ เคาะกะโหลกศีรษะข้าด้วยค้อนราวกับว่า[trepanner.GetSheHe]กำลังตอกไข่ลวก"
 court.4701.trepanning_incapable_injury:0 "แสงสว่างสาดส่องมาที่ข้า ข้ารู้สึกวูบวาบ และข้าเห็นภาพวันและปีในอดีตปรากฏขึ้นพร้อมกัน ข้าอยู่ที่ไหน? ทำไมข้าถึงปวดหัว? ข้าชื่ออะไร? ไส้พายโปรดของข้าคืออะไร?"
 court.4701.trepanning_possessed_injury:0 "แม้ว่าข้าจะได้รับสัญญาว่าจะปลดปล่อยวิญญาณออกจากศีรษะข้า แต่ข้าก็เห็นวิญญาณเป็นครั้งแรกทันที เงาติดปีกรูปงามกำลังเต้นรำจากเงาหนึ่งไปยังอีกเงาหนึ่งในห้องและยิ้มให้ข้า"
 court.4701.trepanning_deviant_injury:0 "เมื่อรูเริ่มถูกขุด ข้าก็เริ่มเพลิดเพลินกับเสียงอวัยวะภายในที่ดังจ๊อกแจ๊ก หลังจากที่จิตใจหมุนวนอยู่พักหนึ่ง ข้าก็เกิดความคิดอัจฉริยะขึ้นมาทันที! ข้าต้องกลายเป็นคนกลางคืนและกิน แต่เปลือกขนมปัง! ทำไมข้าไม่เคยมีเพศสัมพันธ์ขณะแกล้งทำเป็นม้าเลย?"
 court.4701.trepanning_learning_penalty:0 "ขณะที่สิ่วหมุนวนไปรอบๆ ข้าตระหนักว่าข้ากำลังพยายามอย่างมากที่จะร้อง #EMP หยุด! #!เมื่อการเคลื่อนไหวหยุดลงในที่สุด จิตใจที่ว่ายวนน่าสงสารของข้ารู้สึกว่าต้องลุยโคลนเพื่อสร้างประโยค"
 court.4701.trepanning_physical_injury:0 "ตอนแรกสิ่วที่หนีบกะโหลกศีรษะข้าส่งความเจ็บปวดไปทั่วร่างกายจนกระดูกสันหลังข้ารู้สึกเหมือนถูกเลื่อยเป็นสองท่อน ขณะที่การขุดลึกลงไป"
 court.4701.trepanning_no_result:0 "ข้าควบคุมตัวเองได้ เมื่อสิ่วถูกถอดออกในที่สุด และข้ารู้สึกไม่แตกต่างไปจากเดิมนอกเสียจากลมพัดเบาๆ บนสมองที่เปิดโล่งของข้า"
 court.4701.trepanning_coordination_penalty:0 "ข้าเริ่มไม่รู้สึกอะไรเลย เมื่อสิ่วถูกถอดออกในที่สุด ข้าก็ไม่รู้สึกถึงมัน ขณะที่ข้าพยายามยืน ร่างกายข้าแทบจะไม่ทำตาม"
 court.4701.trepanning_blind_injury:0 "การมองเห็นของข้ากลายเป็นทะเลหมอกทันที ในวินาทีต่อมา ข้าโศกเศร้าแม้กระทั่งกับหมอกนั้นขณะที่ข้าเข้าสู่ดินแดนแห่งสนธยานิรันดร์"
 court.4701.a:0 "ฮี่ ฮี่! สวัสดี!"
 court.4701.b:0 "ไอ้สารเลว! เจ้าทำอะไรลงไป?!"
 court.4701.c:0 "กะโหลกที่ปวดร้าวของข้า!"
 court.4701.d:0 "ใครเป็นปีศาจที่ดี? ใช่ เจ้าไง!"
 court.4701.e:0 "ข้าควรโยนชุดชั้นในทั้งหมดของข้าออกจากหน้าต่าง!"
 court.4701.f:0 "ยอดเยี่ยม! ท่านอยากเป็นแพทย์ของข้าไหม?"
 court.4701.g:0 "หลักฐานว่า 'ความผิด' ที่ถูกกล่าวหาของข้าแทบจะไม่ใช่ฝีมือของปีศาจ"
 court.4701.h:0 "ข้าเป็นหนี้ท่าน... หลังจากที่ท่านหาจุกมาอุดรูให้ข้า..."
 court.4701.i:0 "ความคิดที่ทุกข์ทรมานของข้าคือศัตรูที่ข้าเพียงผู้เดียวอาจเผชิญหน้าได้"


 court.4750.t:0 "ข้าต้องการวีรบุรุษ"
 court.4750.desc:0 "แขกใหม่เพิ่งมาถึงราชสำนักของข้า กวีลิ้นเงินผู้มีชื่อเสียงในท้องถิ่น\n\n"ใต้เท้า [ROOT.GetCharacter.GetLadyLord] เช่นเดียวกับนักเล่าเรื่องในสมัยโบราณที่นั่งอยู่แทบเข่าของขุนศึกโบราณ ข้า [poet.GetFirstName] ก็หวังว่าจะได้ทำงานภายใต้การคุ้มครองของท่าน โปรดให้ข้าแสดงคุณค่าของข้า! ข้าอาจอุทิศผลงานชิ้นต่อไปให้ท่านก็ได้!"\n\n"มหากาพย์อันยิ่งใหญ่คือความถนัดของข้า [ROOT.Char.GetTitleAsName] ผู้ยิ่งใหญ่: ท่านอยากให้ข้าร้องเพลงถึงวีรบุรุษคนใด?""
 court.4750.a:0 "แต่งเรื่องราวบางอย่างจากรัชสมัยของพระสันตะปาปาโจน!"
 court.4750.b:0 "เลดี้โกไดวา! บทกวีเกี่ยวกับการขี่ม้าของนาง!"
 court.4750.c:0 "ซินแบดช่างเป็นบุคคลที่กล้าหาญ!"
 court.4750.d:0 "คาลิกูลา... ไม่ค่อยได้รับการชื่นชม แต่เป็นบุคคลที่น่าสนใจ"
 court.4750.e:0 "เรื่องราวของนาสเรดดิน ทำให้ข้ายิ้มได้เสมอ"
 court.4750.f:0 "บอกข้าเกี่ยวกับวาลมีกิ กวีผู้บอกลาง!"
 court.4750.g:0 "ทำไม นั่นก็คือตัวข้าเอง แน่นอน!"
 court.4750.h:0 "ข้าไม่มีทั้งเวลาและทองคำที่จะเสียไป"

 court.4751.intro:0 "ตามคำขอของข้า กวีคนใหม่ [poet.GetFirstName] นำผลงานที่ได้รับแรงบันดาลใจจาก"
 court.4751.topic.pope_joan:0 "พระสันตะปาปาโจน"
 court.4751.topic.lady_godiva:0 "เลดี้โกไดวา"
 court.4751.topic.sinbad:0 "ซินแบด"
 court.4751.topic.caligula:0 "คาลิกูลา"
 court.4751.topic.nasreddin:0 "นาสเรดดิน"
 court.4751.topic.valmiki:0 "วาลมีกิ"
 court.4751.topic.ruler_hero:0 "ชีวิตวีรบุรุษของข้า"
 court.4751.topic.unexpected:0 "แต่มันไม่เป็นไปตามที่ข้าคาดไว้"
 court.4751.ruler_character:0 "\n\nการพลิกดูต้นฉบับที่ประดับประดาอย่างรวดเร็วแสดงให้เห็นว่าข้าปรากฏตัวเคียงข้างวีรบุรุษในฐานะตัวละคร!\n\n"
 court.4701.pope_joan_desc:0 "\n\nขณะที่ข้าเหลือบมองภาพประกอบ ข้าตระหนักว่าภาพวาดของโจนใช้ลักษณะใบหน้าของข้าสำหรับใบหน้าของนาง ราวกับว่าเป็นของข้าเอง!\n\n[poet.GetTitledFirstNameNoTooltip|U] เอนตัวเข้ามาหาข้า "เสน่ห์ของท่านเกินกว่าพระสันตะปาปาของเรามากนัก ขณะที่คนรักของโจนโน้มน้าวให้นาง แต่งตัวเป็นชายและไปศึกษาที่เอเธนส์ ข้ามอบข้อความนี้ให้ท่านโดยหวังว่าบุคคลที่ข้า #EMP ควรจะ#! เคารพบูชาคือท่าน""
 court.4701.ruler_hero_desc:0 "\n\nบทกวีเกี่ยวกับวีรกรรมอันรุ่งโรจน์ของข้า บางเรื่องไม่จริงเท่าเรื่องอื่น แต่ทั้งหมดน่าประทับใจอย่างยิ่ง"
 court.4751.topic.lady_godiva_desc:0 "ข้ากำลังขี่ม้าเคียงข้างเลดี้โกไดวาในบทกวีนี้ สวยงามพอๆ กัน — แต่ก็เปลือยเปล่าพอๆ กัน!"
 court.4751.topic.sinbad_desc:0 "ข้าเป็นตัวละครลึกลับที่ซินแบดพบเจอครั้งแล้วครั้งเล่าในการผจญภัยของเขา ข้าคือสิ่งมีชีวิตที่ฟักออกจากไข่นกยักษ์ร็อก ข้าคือชายชราแห่งท้องทะเลที่เกาะไหล่ซินแบดเป็นเวลาหลายปี ข้าคือเชลยของยักษ์กินคน"
 court.4751.topic.caligula_desc:0 "ข้าเป็นตัวละครในข้อความ: ที่ปรึกษาผู้เหนื่อยล้าของคาลิกูลา เต็มไปด้วยปัญญา แต่น่าเสียดายที่ไม่ค่อยมีใครฟัง"
 court.4751.topic.nasreddin_desc:0 "เรื่องราวแสดงให้เห็นนาสเรดดินขี่ม้าตามหลังข้าขณะที่ข้าปฏิบัติหน้าที่ในราชสำนัก พูดจาเหน็บแนมทุกการกระทำของข้าจากบนหลังลาของเขา"
 court.4751.topic.valmiki_desc:0 "\n\nเช่นเดียวกับตำนาน นายพรานยิงนกที่สวยงามและข้าอดไม่ได้ที่จะพ่นบทกวีสองบทออกมา\n\nขณะที่กวีผู้บอกลาง แต่งบทกวีบทแรกโดยบังเอิญ ข้าก็ เช่นกัน แต่งบทกวีด้นสดเมื่อใดก็ตามที่ข้าถูกจับได้โดยไม่ทันตั้งตัว"
 court.4751.a:0 "อย่างไรก็ตาม ความไม่เคารพในการชื่นชมของเจ้า ทำให้มันน่าดึงดูดยิ่งขึ้น..."
 court.4751.b:0 "บางทีข้าควรตั้งเป้าหมายไปที่ตำแหน่งพระสันตะปาปา..."
 court.4751.c:0 "ข้าควรจะโกรธ แต่นี่จะ ทำให้ข้าได้รับผู้ชื่นชมอย่างแน่นอน..."
 court.4751.c.tt:0 "ผู้ที่หลงใหลในตัวท่านจะสังเกตเห็นอย่างแน่นอน..."
 court.4751.d:0 "นี่กำลังปลูกฝังความคิดที่ไม่บริสุทธิ์ในใจข้า"
 court.4751.e:0 "มีบางสิ่งให้เรียนรู้อยู่เสมอเบื้องหลังเรื่องตลกของเขา"
 court.4751.f:0 "นี่น่าขบขัน ข้ามั่นใจว่าราชสำนักจะสนุกกับมัน"
 court.4751.g:0 "อย่างที่ควรจะเป็น!"
 court.4751.h:0 "นี่ดูเหมือนเชื้อไฟชั้นดีสำหรับไฟครั้งต่อไปของข้า"

#By Isabella Welch
 court.4800.t:0 "กางปีกของเจ้า"
 court.4800.desc:0 ""ส่งเสียงอีกครั้งสิ ไอ้โง่ แล้วเจ้าจะได้ร่วง!" ขณะที่ข้าบังเอิญพบองครักษ์ของข้า [defenestrating_bodyguard.GetTitledFirstName] ข้าสังเกตเห็นว่า[defenestrating_bodyguard.GetSheHe]มาพร้อมกับส่วนท้ายของ [defenestrated_character.GetTitledFirstName] ซึ่ง[defenestrating_bodyguard.GetSheHe]กำลังห้อยอยู่นอกหน้าต่าง\n\n[defenestrating_bodyguard.GetTitledFirstNameNoTooltip] กัดฟันของ[defenestrating_bodyguard.GetHerHis] "[defenestrated_character.GetSheHe|U] กำลังเยาะเย้ยใบหน้าที่เคร่งขรึมที่ข้ารักษาไว้ขณะปฏิบัติหน้าที่ [defenestrated_character.GetSheHe|U] เอา แต่ส่งเสียงห่านเพื่อพยายาม ทำให้ข้าเสียสมาธิ ข้าบอกว่านี่เป็นภัยคุกคามต่อความปลอดภัยของท่าน"\n\nแม้จะตกอยู่ในอันตราย ท่ามกลางความพยายามอย่างไร้ผลที่จะดิ้นรนให้หลุด [defenestrated_character.GetTitledFirstNameNoTooltip] ก็หัวเราะคิกคักออกมา "#EMP ฮ้อง#!""
 court.4800.a:0 "มาดูกันว่าห่านบินได้ไหม!"
 court.4800.maimed_toast:0 "[defenestrated_character.GetTitledFirstName] ผู้บินไม่ได้"
 court.4800.death_toast:0 "[defenestrated_character.GetTitledFirstName] เสียชีวิตขณะบิน"
 court.4800.b:0 "อย่าทำเกินกว่าเหตุ! เฆี่ยนตี[defenestrated_character.GetHerHim]เล็กน้อยอย่างสุภาพ"
 court.4800.c:0 "[defenestrated_character.GetTitledFirstNameNoTooltip] พูดถูก — องครักษ์ที่ดีไม่เคยถูกยั่วยุ"

#By Isabella Welch
 court.4801.t:0 "พร้อมที่จะระเบิด"
 court.4801.desc:0 "ก่อนที่ข้าจะเห็น [poopy_child.GetTitledFirstName] ตัวน้อยกำลังเล่นอยู่ในท้องพระโรงของข้า ข้าก็ได้กลิ่นที่ไม่อาจปฏิเสธได้\n\n"โอ้ [ROOT.GetCharacter.Custom('GetMamaPapa')]! ช่างเป็นความสุขเสมอที่ได้พบท่าน!" ขณะที่[poopy_child.GetSheHe]รีบวิ่งเข้ามากอดขาข้า ข้ารู้สึกถึงน้ำหนักของผ้าอ้อมที่เต็มไปด้วยของเสียของ[poopy_child.GetHerHis]บดขยี้กับน่องข้า\n\nขณะที่มันเริ่มซึมลงบนข้อเท้าข้า ข้าสงสัยกับตัวเองว่า: เรามีคนรับใช้น้อยขนาดนั้นจริงๆ หรือที่ข้าต้องทำงานที่น่าอัปยศในการเปลี่ยนผ้าอ้อมด้วยตัวเอง?"
 court.4801.a:0 ""มาอยู่ในอ้อมแขนข้า เราจะทำความสะอาดเจ้า""
 court.4801.b:0 "ข้ายอมแพ้สงครามดีกว่าแตะต้องสิ่งสกปรกนี้"

#By Isabella Welch
 court.4802.t:0 "การศึกษาภายใต้การบีบบังคับ"
 court.4802.desc:0 "ข้าเห็นอาจารย์ประจำราชสำนักของข้า [court_tutor.GetTitledFirstName] พร้อมกับฝูงนักเรียนของ[court_tutor.GetHerHis]ล้อมรอบ[court_tutor.GetHerHim]\n\n"อาจารย์ สี่เหลี่ยมด้านขนานคืออะไร?"\n\n"อาจารย์ มันหมายความว่าอะไร... 'การร่วมรัก'?"\n\n"อาจารย์ ข้าควรเป่าขลุ่ยให้ดังขึ้น หรือ #EMP ดังขึ้นมาก#!?"\n\n[court_tutor.GetTitledFirstNameNoTooltip] เงยหน้ามองข้าด้วยดวงตาที่ลึกโหล "ใต้เท้า [ROOT.GetCharacter.GetLadyLord] ข้าทนไม่ไหวแล้ว โปรดปลดข้าออกจากตำแหน่ง""
 court.4802.a:0 "โอ้ พวกเขาน่ารักจัง?"
 court.4802.b:1 "ข้าจะซื้อทรัมเป็ตให้เจ้า [child_2.GetTitledFirstNameNoTooltip] นั่นจะ #EMP ดังขึ้นอีก#!!"
 court.4802.c:0 "ข้าเข้าใจ เราจะหาอาจารย์คนใหม่"

#By Isabella Welch
 court.4803.t:0 "ปากกาผี"
 court.4803.desc:0 "กวีของข้า เช่นเดียวกับที่[court_poet.GetSheHe]ทำเสมอทันทีที่ข้าอยู่ในระยะ เริ่มกล่าวสุนทรพจน์ใส่ข้า "โอ้ [ROOT.GetCharacter.Custom('PetName')] อันล้ำค่าของข้า! มันต้องเป็นความยากลำบาก เช่นนี้ ที่ต้องใช้ชีวิตในฐานะผู้ที่ถูกเทพธิดาแห่งบทกวีทอดทิ้ง"\n\n"ท่านบัญชาการกองทัพ แต่ท่านไม่สามารถบัญชาการคำที่เขียนได้ มนุษยชาติเคยเห็นโศกนาฏกรรมที่งดงามกว่านี้หรือไม่?"\n\n"ให้ข้าช่วยท่าน ข้าสามารถเขียนสุนทรพจน์บางส่วนให้ท่านได้ บอกหัวข้อมา แล้วข้าจะใช้สำนวนที่สวยงาม""
 court.4803.a:0 "คำพูดของข้าอาจต้องการ... การผสมผสานที่หรูหรา"
 court.4803.b:0 "บางครั้งข้ารู้สึกว่าข้าเป็นกวีมากกว่า [ROOT.GetCharacter.GetTitleAsName] ข้าไม่ต้องการความช่วยเหลือ"
 court.4803.c:0 "ข้าอยากให้ท่านเขียนบทกวีจากข้าถึงคนรักของข้ามากกว่า"
 court.4803.c.tt:0 "ท่านจะส่งบทกวีไปให้ [lover.GetTitledFirstName]"
 court.4803.c.intrigue.tt:1 "ทักษะ [intrigue|E] สูงของ [lover.GetFirstNamePossessiveNoTooltip] หมายความว่า[lover.GetSheHe]อาจรู้ว่ามันถูกเขียนโดยคนอื่น"
 court.4803.c.realize.tt:0 "[lover.GetFirstNameNoTooltip] แยกแยะผู้เขียนที่แท้จริงได้"
 court.4803.c.fooled.tt:0 "[lover.GetFirstNameNoTooltip] รู้สึกประทับใจกับบทกวี 'ของท่าน'"
 court.4803.d:0 "คำพูดของข้าอาจไม่ไพเราะ แต่มาจากใจข้า"

#By Isabella Welch
 court.4804.t:0 "เพื่อนร่วมเตียงที่น่ารังเกียจ"
 court.4804.desc:0 "ข้าสังเกตเห็นข้าราชสำนักสองคนของข้าที่พักอยู่ด้วยกันกำลังทะเลาะกัน ทั้งคู่มีรอยคล้ำใต้ตาอย่างหนัก\n\n"ใต้เท้า [ROOT.GetCharacter.GetLadyLord] ข้าไม่สามารถนอนเตียงเดียวกับ [roomate_2.GetTitledFirstName] ได้อีกต่อไป [roomate_2.GetSheHe|U] เป็นหมูที่ตะกละตะกลาม วิธีที่[roomate_2.GetSheHe]กอดผ้าห่ม"\n\n"และไม่มีคืนไหนในสัปดาห์นี้ที่ [roomate_1.GetTitledFirstName] ไม่ได้ [ROOT.Char.Custom('RandomBadRoomate')]" [roomate_2.GetSheHe|U] ตัวสั่น "ข้าขอร้องท่าน: จัดหาที่พักที่ดีกว่าให้เรา ข้าฝันถึงอะไรมากไปกว่าเตียงที่เย็นและว่างเปล่า""
 court.4804.a:0 "ข้าจะขอให้คนรับใช้หาเพื่อนร่วมเตียงใหม่ให้พวกเจ้า"
 court.4804.b:0 "ห้องพักเหล่านี้ #EMP ไม่#! เหมาะสมกับราชสำนักของ [ROOT.GetCharacter.GetTitleAsNamePossessiveNoTooltip]"
 court.4804.c:0 "เราไม่มีพื้นที่พอที่จะให้ทุกคนมีห้องส่วนตัว"

#By Isabella Welch
 court.4805.t:0 "การตัดมุม"
 court.4805.desc:0 "สถาปนิกของข้า [royal_architect.GetTitledFirstName] กำลังแบกกระสอบขนาดใหญ่และยิ้มตลอดเวลา ข้าเบ้หน้าเมื่อมันขูดขีดพื้นท้องพระโรงของข้า\n\n"ใต้เท้า [ROOT.GetCharacter.GetLadyLord] ข้าได้ทำอะไรที่ #EMP ซุกซน#! มาก แต่ข้ารู้สึกว่ามันจะ ทำให้ท่านพอใจ"\n\nข้าคาดว่าจะได้เห็นสิ่งลามกอนาจารขณะที่[royal_architect.GetSheHe]เปิดกระสอบ แต่ข้างในข้าไม่เห็นอะไรนอกจากก้อนหินสี่เหลี่ยมขนาดใหญ่ "นี่คือศิลาฤกษ์จาก [rival.Custom('FortifiedBuilding')] ของศัตรูตัวฉกาจของท่าน [rival.GetTitledFirstNamePossessive] ตอนนี้สัญลักษณ์ทั้งหมดของการวางศิลาฤกษ์ของ[rival.GetHerHim]หายไปแล้ว!""
 court.4805.a:0 "มาสร้างคอกหมูด้วยมันกันเถอะ!"
 court.4805.b:0 "ข้าต้องการให้มันจัดแสดงอย่างภาคภูมิใจ!"
 court.4805.c:0 "ข้าเสียใจกับความบาดหมางของข้ากับ[rival.GetHerHim]อยู่แล้ว เอามันกลับไป"
 court.4805.d:0 "ทำไมเจ้าถึงนำเศษหินนี้มาให้ข้า? โยนมันทิ้งไป!"

#By Isabella Welch

 court.4806.t:0 "ผู้คลั่งไคล้ [ROOT.Char.GetTitleAsNameNoTooltip]"
 court.4806.intro:0 "ใบหน้าใหม่กำลังเดินเตร่อยู่ในท้องพระโรงของข้า บางครั้งก็หัวเราะคิกคักและกระโดดขึ้นลงอยู่กับที่เมื่อ[adoring_fan.GetSheHe]เหลือบมองงานศิลปะบางชิ้นที่แสดงถึงวิถีชีวิตของ [ROOT.Char.GetCulture.GetNameNoTooltip]"
 court.4806.hre_desc:0 "\n\n"หัวใจข้า! [ROOT.GetCharacter.GetPrimaryTitle.GetNameNoTierNoTooltip] ดีที่สุด! แม้ว่าข้าจะอาศัยอยู่ใน [adoring_fan_liege.GetCapitalLocation.GetTitle.GetNameNoTier] ข้าคิดจริงๆ ว่าข้าเกิดมาเป็น [ROOT.Char.GetCulture.GetName] ในใจ! ข้าสามารถระบุรายชื่อเจ้าชาย-บิชอปทุกคนได้ ข้ายังมีรอยสักรูปใบหน้าของ [ROOT.GetCharacter.GetTitledFirstNamePossessiveNoTooltip] บนน่องข้าด้วย"\n\n[adoring_fan.GetSheHe|U] เอื้อมมือเข้าไปในห่อของเขา และดึงสิ่งที่ดูเหมือนจะเป็นแบบจำลองมงกุฎไรช์โครเนอราคาถูกออกมา "ข้าสวมสิ่งนี้เกือบทุกวัน และบอกผู้คนที่ข้าผ่านไปว่า 'ข้าหวังว่าข้าจะได้คะแนนเสียงของท่าน เจ้าชาย-ผู้คัดเลือก!'"
 court.4806.byzantine_desc:1 "ขณะที่ผู้มาเยือนที่ตื่นเต้นเข้ามาใกล้ ทหารองครักษ์ต้องหยุด[adoring_fan.GetHerHim]ไม่ให้เข้าใกล้เกินไป\n\n"[ROOT.Char.GetTitleAsNameNoTooltip]! แม้ว่าข้าจะมาจาก [adoring_fan_liege.GetCapitalLocation.GetTitle.GetNameNoTier] ข้าก็รัก [ROOT.Char.GetCulture.GetCollectiveNoun] มากกว่าที่หัวใจข้าจะรับไหว"\n\n"ข้าได้อุทิศชีวิตของข้าเพื่อพยายามใช้ชีวิตเหมือนพวกท่านคนหนึ่ง หมกมุ่นอยู่กับการศึกษา [ROOT.Char.GetCulture.GetLanguage.GetNameNoTooltip]"\n\n"ข้าสวม แต่ชุดชั้นในสีม่วงเท่านั้น ข้ามั่นใจว่าหากจักรวรรดิล่มสลาย ข้าจะรู้สึกเจ็บปวดมากกว่าการตายของแม่ข้าเอง — โลกจะไม่ได้ยินเสียงร้องไห้คร่ำครวญของข้าจบสิ้น!"
 court.4806.general_desc:1 "มีบางอย่างผิดปกติเกี่ยวกับผู้มาเยือนคนนี้ และเมื่อ[adoring_fan.GetSheHe]ออกมาข้างหน้า ก็เห็นได้ชัดว่า[adoring_fan.GetSheHe]กำลังถือแบบจำลอง [ROOT.Char.Custom('signature_weapon')] ที่ข้าโปรดปราน\n\n"ข้าอดไม่ได้ที่จะคุกเข่าลงต่อหน้าท่าน — ข้าได้อุทิศชีวิตของข้าใน [adoring_fan_liege.GetCapitalLocation.GetTitle.GetNameNoTier] เพื่อชื่นชมวัฒนธรรมของ [ROOT.Char.GetCulture.GetCollectiveNoun] ข้าพูด แต่ [ROOT.Char.GetCulture.GetLanguage.GetNameNoTooltip] กิน [ROOT.Char.GetCulture.GetNameNoTooltip] [ROOT.GetCharacter.Custom('GetExpensiveMeal')] และได้ศึกษาดาบในแบบ [ROOT.Char.GetCulture.GetName]"\n\n"ครอบครัวของข้าได้ขับไล่ข้าออกจากบ้าน โดยอ้างว่าหากข้าไม่สามารถทำอะไรได้นอกจากหมกมุ่นอยู่กับ [ROOT.GetCharacter.GetPrimaryTitle.GetNameNoTooltip] ข้าก็ควรไปอยู่ที่นั่นแทน""
 court.4806.a:0 "นี่เป็นการประจบประแจง หากค่อนข้างละเมิดสิทธิ์"
 court.4806.b:0 "เอาของโทรมๆ นั่นมาให้ข้า! ไม่มีใครนอกจากข้าที่อาจสวมมงกุฎได้"
 court.4806.c:0 "คนที่มีความกระตือรือร้น เช่นนี้ควรเข้าร่วมราชสำนักของเรา!"
 court.4806.c.byz:0 "เนื่องจากความรักชาติของท่าน ข้าจะอนุญาตให้ท่านสวมสีม่วงได้"
 court.4806.d:0 "มีเพียง [ROOT.Char.GetTitleAsNameNoTooltip] เท่านั้นที่อาจสวมสีม่วงได้! จำคุกเจ้าคนน่าสมเพชนี้!"
 court.4806.e:0 "เจ้ากล้าดียังไงมาลอกเลียนแบบ [ROOT.Char.Custom('signature_weapon')] ของข้า! ถอดมันออกจาก[adoring_fan.GetHerHim]!"

