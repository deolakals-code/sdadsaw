l_english: 

 #Empty Granaries
 hold_court.6000.t:0 "ยุ้งฉางที่ว่างเปล่า"
 hold_court.6000.desc_intro:0 "เบื้องหน้าข้าคือ [6000_poor.Custom2('MyCharacterIntroduction', ROOT.Char)] ที่ยืนก้มหน้า [6000_poor.GetHerHis] ต่ำ\n\n"[ROOT.Char.Custom('FormOfAddressForLiege')|U] [6000_province.GetNameNoTooltip] ได้รับผลกระทบอย่างหนักจาก"
 hold_court.6000.desc_occupation:0 "การยึดครองของศัตรูเมื่อเร็วๆ นี้"
 hold_court.6000.desc_raiding:0 "การปล้นสะดมและขโมยทรัพย์สิน"
 hold_court.6000.desc_epidemics:1 "โรคระบาด"
 hold_court.6000.desc_winter:1 "ฤดูหนาวอันโหดร้าย"
 hold_court.6000.desc_middle:0 "ผู้คนกำลังอดอยาก ทุ่งนาของเราไม่ฟื้นตัว และปศุสัตว์ของเราไม่เพียงพอที่จะดำรงชีวิตอีกต่อไป!"
 hold_court.6000.desc_count:0 "[6000_count.Custom2('MyCharacterIntroduction', 6000_poor)|U] ขาดทั้งเงินหรือเจตจำนงที่จะช่วยเหลือพวกเรา"
 hold_court.6000.desc_ending:0 "พวกเราขอร้องให้ท่านเข้าแทรกแซงและช่วยชีวิตเหล่าข้ารับใช้ผู้ภักดีของท่านด้วยพระมหากรุณาธิคุณอันยิ่งใหญ่ของท่าน!"\n\n[6000_poor.GetSheHe|U] โค้งคำนับอย่างลึกซึ้งและนิ่งเงียบไป"
 hold_court.6000.a:0 "ทองคำบางส่วนจะช่วยบรรเทาความทุกข์ทรมานของพวกเจ้าได้"
 hold_court.6000.b:0 "ข้าจะให้การลดหย่อนภาษีแก่พวกเจ้า เพื่อให้ฟื้นตัวได้"
 hold_court.6000.c:0 "ข้ารู้จักคนที่เหมาะสมกับงานนี้"
 hold_court.6000.c.tt:0 "ท่านส่ง [inspector.GetTitledFirstName] ไปเป็นผู้ตรวจการอย่างเป็นทางการเพื่อดูแลการฟื้นฟูเคาน์ตี"
 hold_court.6000.d:0 "ข้ามั่นใจว่าพวกเจ้าสามารถจัดการได้ด้วยตนเอง"
 #From Beyond the Border
 hold_court.6030.t:0 "จากนอกพรมแดน"
 hold_court.6030.desc:0 ""[ROOT.Char.Custom('FormOfAddressForLiege')|U] ข้ามาจากชุมชนทางศาสนาแห่ง [6030_church.GetName] ใน [6030_border.GetName]\n\n"ณ ที่นั่น [6030_monk.GetWomenMen] ผู้เปี่ยมปัญญาและศรัทธาได้รวบรวมและอนุรักษ์ความรู้ดั้งเดิมของวัฒนธรรม [6030_monk.GetCulture.GetName] มานานหลายศตวรรษ เพื่อเป็นสัญญาณแห่งไมตรีจิตของเรา ข้าขอมอบประชุมตำรา [6030_monk.GetCulture.GetNameNoTooltip] อันล้ำค่านี้ที่แปลเป็นภาษาของท่านเอง\n\n"เราหวังว่าท่านจะยอมรับมันและได้รับมุมมองใหม่ต่อผู้คนของเรา""
 hold_court.6030.a:0 "ข้าขอยอมรับด้วยความยินดี"
 hold_court.6030.b:0 "โปรดอยู่ต่อ และสอนข้าเพิ่มเติม!"
 hold_court.6030.b.tt.2:0 "ผู้ปกครองทุกคนของวัฒนธรรม [6030_monk.GetCulture.GetName]"
 hold_court.6030.c:0 "ข้าไม่สนใจ ออกไปให้พ้นสายตาข้า"
 hold_court.6030.d:0 "วัฒนธรรมอันด้อยกว่าของเจ้าไม่คู่ควรแก่การจดจำ!"
 hold_court.6030.d.tt:0 "ข้าหลวงทั้งหมดของท่านที่เป็นวัฒนธรรม [6030_monk.GetCulture.GetName]"
 #A Lost Treasure
 hold_court.6040.t:0 "สมบัติที่สูญหาย"
 hold_court.6040.desc:1 ""[ROOT.Char.Custom('FormOfAddressForLiege')|U] ข้าเป็นตัวแทนของชุมชนทางศาสนาแห่ง [6040_church.GetName]\n\n"ขณะที่ค้นหาสิ่งของในหอจดหมายเหตุเล็กๆ ของเรา เราได้พบหนังสือประหลาดเล่มหนึ่ง ปกของมันเต็มไปด้วยฝุ่น การเย็บเล่มก็เปราะบาง และหน้ากระดาษก็เหลืองไปตามกาลเวลา แต่มันมีภาพวาดที่แปลกประหลาดที่สุด และตัวอักษรนั้นก็ไม่เป็นที่รู้จักของพวกเราเหล่า [6040_monk.GetFaith.PriestNeuterPlural]\n\n"เรามั่นใจว่ามันเป็นหนึ่งเดียวในโลก เป็นขุมความรู้ที่สูญหายไปนาน เป็นสมบัติที่แท้จริง! นั่นคือเหตุผลที่เราขอมอบมันให้แก่ท่าน บางทีมันอาจเป็นสำเนาต้นฉบับพระประสงค์ของ [6040_monk.GetFaith.HighGodName] หรืออาจเป็นบันทึกความทรงจำตั้งแต่การสร้างโลก!""
 hold_court.6040.a:0 "ขอบใจ ข้าจะเพิ่มมันเข้าไปในคอลเลกชันของข้า"
 hold_court.6040.b:0 "#EMP น่าทึ่งมาก!#! เรียกนักสะสมของเก่าของข้ามา!"
 hold_court.6040.b.tt:0 "นักสะสมของเก่าของท่านไม่รู้เรื่องอะไรเลย"
 hold_court_6040_b_fake:1 "หนังสือเล่มนี้เป็นของปลอมที่ทำขึ้นอย่างหยาบๆ — ไร้ค่าและไร้ประโยชน์"
 hold_court_6040_b_generic:0 "หนังสือเล่มนี้เก่าแก่จริง แต่มันเป็นเพียง [6040_monk.Custom('GetOldBook')]"
 hold_court_6040_b_clueless:0 "แม้ แต่นักสะสมของเก่าของท่านก็ไม่สามารถให้ความกระจ่างเกี่ยวกับที่มาและจุดประสงค์ของหนังสือเล่มนี้ได้"
 hold_court_6040_b_artifact:0 "หนังสือเล่มนี้เป็นสำเนาโบราณและล้ำค่าของผลงานชิ้นเอก!"
 hold_court.6040.c:0 "ให้ข้าดูมันหน่อย, #EMP เดี๋ยวนี้เลย#!!"
 hold_court.6040.c.tt:1 "มันเป็นของปลอมที่ทำขึ้นอย่างหยาบๆ!"
 hold_court.6040.c.tt.2:0 "หนังสือเล่มนี้ยังคงเป็นปริศนาสำหรับท่าน"
 hold_court.6040.c.tt.3:0 "มันเป็นต้นฉบับที่ดี แต่ไม่มีอะไรพิเศษ"
 hold_court.6040.c.tt.4:0 "มันเป็นตำราที่หายากและมีค่า"
 hold_court_6040_c_clueless:0 "ตัวอักษรและเนื้อหาของหนังสือเล่มนี้เกินกว่าความเข้าใจของท่าน"
 hold_court.6040.d:0 "มันต้องเป็นผลงานของ [ROOT.Char.GetFaith.DevilName]! เผามันทิ้ง!"
 hold_court.6040.e:0 "ใครจะสนเรื่องหนังสือกัน?"
 #A Holy Tomb
 hold_court.6050.t:0 "สุสานศักดิ์สิทธิ์"
 hold_court.6050.desc:1 "ชาวนาที่อยู่ตรงหน้าข้าดูเหมือนจะระเบิดออกมาด้วยความตื่นเต้น\n\n"[ROOT.Char.Custom('FormOfAddressForLiege')|U]! ปาฏิหาริย์! ความศักดิ์สิทธิ์! พวกเราได้รับ #EMP พร#!!"\n\nคำพูดพร่ำเพ้ออย่างกระตือรือร้นของ [6050_pop.GetHerHis] นั้นน่าสับสน แต่ในที่สุดข้าก็จับใจความได้ว่า: [6050_pop.GetSheHe] ต้องการให้ข้าอุปถัมภ์ลัทธิของนักบุญท้องถิ่นที่เพิ่งเสียชีวิตใน [6050_tomb.GetNameNoTooltip] [6050_holy.GetFirstName] เป็นผู้สร้างปาฏิหาริย์ ในขณะที่มีชีวิต เป็นที่รู้จักในเรื่อง [6050_holy.Custom('GetMiracle1')] และ [6050_holy.Custom('GetMiracle2')] หลุมฝังศพของ [6050_holy.GetHerHis] กำลังดึงดูดผู้มาเยือนที่ศรัทธาจากทั่วทั้งอาณาจักร"
 hold_court.6050.desc_hof:0 "\n\nในฐานะ [head_of_faith|E] เป็นสิทธิพิเศษของข้าที่จะตัดสินใจว่าจะประณามหรือส่งเสริมการบูชานี้"
 hold_court.6050.a:0 "ความศักดิ์สิทธิ์ของ [6050_holy.GetHerHis|U] จะได้รับการเคารพบูชาตามที่ [6050_holy.GetSheHe] สมควรได้รับ"
 hold_court.6050.b:0 "ข้ารู้อยู่แล้ว นักบุญมาหาข้าในความฝัน"
 hold_court.6050.c:0 "ข้าจะกำจัดเรื่องไร้สาระที่ดูหมิ่นศาสนานี้ทันที!"
 hold_court.6050.d:0 "ข้าไม่สนใจเรื่องความเชื่องมงายของชาวบ้าน"
 tougher_to_convert: "ชุมชนศาสนาที่เข้มแข็ง"
 tougher_to_convert_desc: "อัตลักษณ์ทางศาสนาของเคาน์ตีนี้เพิ่งแข็งแกร่งขึ้น ทำให้เปลี่ยนศาสนาได้ยากขึ้น\n\n#N -25%#! ความเร็วในการเปลี่ยนศรัทธา"
 easier_to_convert: "ชุมชนศาสนาที่อ่อนแอ"
 easier_to_convert_desc: "อัตลักษณ์ทางศาสนาของเคาน์ตีนี้เพิ่งอ่อนแอลง ทำให้ยอมรับศรัทธาใหม่ได้ง่ายขึ้น\n\n#P +25%#! ความเร็วในการเปลี่ยนศรัทธา"
 easier_to_culture_convert: "ชุมชนศาสนาที่อ่อนแอ"
 easier_to_culture_convert_desc: "อัตลักษณ์ทางศาสนาของเคาน์ตีนี้เพิ่งอ่อนแอลง ทำให้ยอมรับศรัทธาใหม่ได้ง่ายขึ้น\n\n#P +25%#! ความเร็วในการเปลี่ยนวัฒนธรรม"
 #A Convenient offer
 hold_court.6060.t:0 "ข้อเสนอที่สะดวก"
 hold_court.6060.desc:0 "[6060_rich.Custom2('MyCharacterIntroduction', ROOT.Char)|U] ยืนอยู่เบื้องหน้าข้า ด้วยสีหน้าเปี่ยมความหวัง\n\n"[ROOT.Char.Custom('FormOfAddressForLiege')|U]"
 hold_court.6060.desc_merchant:0 ""[ROOT.Char.Custom('FormOfAddressForLiege')|U] ขอข้าแนะนำตัวเอง: ข้าชื่อ [6060_rich.GetTitledFirstName] และข้าเป็นพ่อค้าผู้มั่งคั่งจากเมืองหลวง\n\n"
 hold_court.6060.desc_ending:1 ""ข้าอดสังเกตไม่ได้ว่า ในช่วงเวลาที่ผ่านมา การคลังของอาณาจักรไม่ค่อยจะสู้ดีนัก แน่นอน ท่านได้บริหารจัดการอย่างยอดเยี่ยม แต่ — บางที — ท่านอาจจะพบประโยชน์จากการมีทองคำเพิ่มขึ้นบ้าง\n\n"ข้ายินดีที่จะซื้อนิคมเล็กๆ จากท่านเพื่อแลกกับทองคำจำนวนมาก จะเป็นที่ยอมรับได้หรือไม่?""
 hold_court.6060.a:0 "ตกลง เจ้าสามารถมี [6060_offer.GetNameNoTooltip] ได้"
 hold_court.6060.b:1 "จงเอาที่ดินไปและสร้างเมืองขึ้นบนนั้น"
 hold_court.6060.b.tt.success:0 "[6060_rich.GetFirstNameNoTooltip] ยอมจ่ายเพิ่ม"
 hold_court.6060.b.tt.failure:0 "[6060_rich.GetFirstNameNoTooltip] ยืนกรานตามข้อเสนอสุดท้ายของ [6060_rich.GetHerHis] และท่านดูเหมือนคนโง่ที่โลภมาก"
 hold_court.6060.c:0 "ข้าไม่ต้องการทองคำของเจ้า"
 character_title_cannot_be_revoked_tt: "ท่านจะไม่สามารถเพิกถอนตำแหน่งได้เป็นเวลา 25 ปี"
 protected_from_revocation.tt: "ตำแหน่งของตัวละครนี้ได้รับการคุ้มครองจากการเพิกถอน"
 #Budding Ally
 hold_court.6070.t:0 "พันธมิตรที่กำลังผลิบาน"
 hold_court.6070.desc:1 "" [ROOT.Char.GetLadyLord] ของข้า นามของข้าคือ [6070_embassy.GetTitledFirstName] และข้าเป็นทูตของพันธมิตรของท่าน [6070_sender.GetTitledFirstName] ข้านำคำทักทายฉันมิตรและข้อเสนอของ [6070_sender.GetHerHis] มาให้ท่าน\n\n"เจ้าเหนือหัวของข้าให้ความสำคัญกับมิตรภาพของท่านเหนือสิ่งอื่นใด ดังนั้น เพื่อเป็นเครื่องหมายแห่งความปรารถนาดี [6070_sender.GetSheHe] จึงส่งเด็กคนนี้มาให้ท่าน — [6070_child.Custom('GetDaughterSon')] ของ [6070_sender.GetHerHis] [6070_child.GetFirstName] — เพื่อให้ท่านอบรมสั่งสอนตามที่ท่านพอใจ\n\n"[6070_sender.GetLadyLord] ของข้าหวังว่าท่าทีนี้จะเสริมสร้างพันธมิตรของท่านให้แข็งแกร่งขึ้น และมั่นใจว่า [6070_child.GetFirstNameNoTooltip] จะอยู่ในมือที่ดีเยี่ยม""
 hold_court.6070.a:0 "ข้ายินดีรับข้อเสนอของท่าน"
 hold_court.6070.b:0 "แน่นอน! [6070_friend.GetFirstNameNoTooltip], พา [6070_child.GetHerHim] ชมรอบๆ!"
 hold_court.6070.c:1 "ข้ายอมรับ — แต่ข้าคาดหวังการหมั้นหมายเป็นการแลกเปลี่ยน"
 hold_court.6070.d:0 "ข้าขออภัย แต่ข้าไม่สามารถรับผิดชอบนี้ได้ในตอนนี้"
 hold_court.6070.e:1 "เด็กคนนั้นเป็นตัวปัญหาที่ฉาวโฉ่ — เจ้าจะไม่ทิ้ง [6070_child.GetHerHim] ไว้กับข้า!"
 #Settling the [people]
 hold_court.6080.t:0 "การตั้งถิ่นฐานของชาว [6080_culture.GetNameNoTooltip|U]"
 hold_court.6080.desc:1 ""[ROOT.Char.Custom('FormOfAddressForLiege')|U] ข้าเป็นตัวแทนของชาว [6080_culture.GetNameNoTooltip] แห่ง [6080_county.GetNameNoTooltip]" [6080_count.Custom2('MyCharacterIntroduction', ROOT.Char)] กล่าว\n\n"เราเป็นพสกนิกรที่จงรักภักดีและซื่อสัตย์ แต่ดินแดนของเรายากจน ด้อยพัฒนา และมีประชากรเบาบาง โปรดอนุญาตให้เราตั้งถิ่นฐานใหม่ และบริหารจัดการตามประเพณีของเรา!\n\n"ภายใต้การคุ้มครองอันเมตตาของท่าน ดินแดนของเรายังคงสามารถเจริญรุ่งเรืองได้ และท่านจะได้รับข้าหลวงผู้ซื่อสัตย์คนใหม่!""
 hold_court.6080.a:0 "ตกลง ประชาชนของเจ้าสามารถตั้งรกรากใน [6080_county.GetNameNoTooltip] ให้ข้าได้"
 hold_court.6080.a.tt:0 "ท่านจะไม่สามารถเพิกถอนตำแหน่งนี้ได้จนกว่า [6080_count.GetFirstNamePossessiveNoTooltip] จะเสียชีวิต"
 hold_court.6080.b:0 "ข้ารู้ดีที่สุดสำหรับ [6080_county.GetNameNoTooltip]"
 hold_court.6080.c:1 "ประชาชนของเจ้าจะมีสถานที่ปลอดภัยใน [6080_province.GetNameNoTooltip] เสมอ"
 #Heretics at Large
 hold_court.6090.t:0 "พวกนอกรีตที่ลอยนวล"
 hold_court.6090.desc:0 ""[ROOT.Char.Custom('FormOfAddressForLiege')|U] ข้าเสียใจที่ต้องแจ้งให้ท่านทราบว่าสถานการณ์ทางศาสนาในดินแดนของข้านั้นเกินกว่าจะควบคุมได้...\n\n"ข้าได้พยายาม ทำให้ราษฎรของข้าเห็นแสงสว่างแห่งศรัทธาที่แท้จริงของเราแล้ว แต่พวกเขากลับมีมากเกินไปที่ยังคงดื้อรั้นในความเชื่อที่ผิดๆ! ข้าขอวิงวอนให้ท่านใช้อำนาจและพลังของท่านเพื่อช่วยข้า!""
 hold_court.6090.desc.almoner:0 "\n\n"[ROOT.Char.Custom('FormOfAddressForLiege')|U] — หากข้าจะขออนุญาต" [high_almoner.Custom2('MyCharacterIntroduction', ROOT.Char)] พูดแทรกขึ้นมา "บางทีพวกเขาอาจจะถูกโน้มน้าวได้ด้วยการแจกทานอย่างงามให้กับผู้ศรัทธาที่ #EMP ถูกต้อง#?""
 hold_court.6090.desc.executioner:0 "\n\n"ข้าพนันได้เลยว่าพวกเขาแค่ต้องการ #EMP มือที่หนักแน่น!#!" [executioner.Custom2('MyCharacterIntroduction', ROOT.Char)] กล่าวพร้อมรอยยิ้มอันมืดมน"
 hold_court.6090.a:0 "[court_chaplain.GetFirstNameNoTooltip], ดูว่าท่านจะทำอะไรได้บ้าง"
 hold_court.6090.b:0 "[high_almoner.GetFirstNameNoTooltip], จัดการเรื่องทานในท้องถิ่นบางส่วน"
 hold_court.6090.c:0 "การอยู่ร่วมกันอย่างสันติเป็นทางออกที่ดีที่สุดเสมอ"
 title_granted_to_local_leader_tt: "[6090_main_county.GetName] จะถูกมอบให้กับคนท้องถิ่นที่มีศรัทธา [6090_main_county.GetCountyData.GetFaith.GetName] ท่านจะมี [hook|E] ต่อพวกเขา"
 hold_court.6090.d:0 "[executioner.GetFirstNameNoTooltip], จง ทำให้ผู้ไม่เชื่อบางคนเป็นเยี่ยงอย่าง"
 hold_court.6090.e:0 "นั่นฟังดูเหมือนปัญหาของเจ้า ไม่ใช่ของข้า"
 #A Land at War
 hold_court.6100.t:0 "ดินแดนในสงคราม"
 hold_court.6100.desc:0 "เบื้องหน้าข้าคือ [6100_vassal_1.Custom2('MyCharacterIntroduction', ROOT.Char)] และ [6100_vassal_2.Custom2('MyCharacterIntroduction', ROOT.Char)]\n\n"[ROOT.Char.Custom('FormOfAddressForLiege')|U]" [6100_vassal_1.GetFirstNameNoTooltip] เริ่ม "สงครามระหว่างตัวข้ากับ [6100_vassal_2.GetTitledFirstNameNoTooltip] กำลังยืดเยื้อ เนื่องจาก [6100_vassal_2.GetHerHis] ดื้อรั้นที่จะไม่รับฟังเหตุผล ดังนั้นเราจึงมาหาท่านเพื่อไกล่เกลี่ย"\n\n"กลายเป็นว่าตอนนี้มันเป็น #EMP ความผิดข้า#!!?" [6100_vassal_2.GetFirstNameNoTooltip] พูดแทรกขึ้นมา "เจ้าคนน่ารังเกียจ! นาย[ROOT.Char.GetLadyLord] ของข้า โปรดบอก [6100_vassal_1.GetHerHim] ที!""
 hold_court.6100.desc.jester:0 "\n\n[jester.Custom2('MyCharacterIntroduction', ROOT.Char)|U] หูผึ่ง: "โอ้ ข้า #EMP ชอบ#! การทะเลาะวิวาทเล็กๆ น้อยๆ! มันเข้ากันได้ดีกับ... บทกวีตลก!""
 hold_court.6100.a:0 "ใครๆ ก็เห็นว่า [6100_vassal_1.GetFirstNameNoTooltip] เป็นฝ่ายถูก"
 hold_court.6100.b:0 "จุดยืนของ [6100_vassal_2.GetFirstNamePossessiveNoTooltip] นั้นถูกต้องตามกฎหมาย"
 hold_court.6100.c:0 "จงหยุดการต่อสู้ทันที มิฉะนั้น..."
 hold_court.6100.d:0 "ข้าเบื่อเรื่องไร้สาระของพวกเจ้าแล้ว ไปเข้าคุกทั้งคู่ซะ!"
 hold_court.6100.e:0 "ให้เราจัดการเรื่องนี้เหมือนนักรบผู้มีเกียรติ"
 hold_court.6100.e.tt:0 "ผู้เข้าแข่งขันทั้งสองจะแก้ไขสงครามด้วยการประลองยุทธ์"
 hold_court.6100.f:0 "ฮ่าๆ ความคิดดี! พวกเจ้าสองคนแลกเปลี่ยนบทกวีโต้ตอบกันหน่อยสิ!"
 hold_court.6100.f.1:0 "เจ้าคนพาลเกิดข้างรั้ว\nต้องอยู่ในถ้ำชัวร์\nข้าเกลียดเจ้าเหลือทน\nควรอยู่ในเล้าจน...?""
 hold_court.6100.f.1.t:0 "ท่านหัวเราะก๊ากกับความพยายามอันอ่อนด้อยของ [6100_vassal_1.GetShortUINamePossessive|U]"
 hold_court.6100.f.2:0 ""เจ้าคนหยาบคายไร้วัฒนธรรม\nทำให้เด็กหญิงตัวเล็กๆ กลัวไม่ได้หรอกหนา\nข้าจะส่งเจ้าวิ่งหนีไป\nเจ้าไม่ได้ฉลาดเท่าไหร่...?""
 hold_court.6100.f.2.t:0 "ท่านหัวเราะลั่นกับบทกวีอันย่ำแย่ของ [6100_vassal_2.GetShortUINamePossessive|U]"
 hold_court.6100.g:0 "พวกเจ้ากำลังรบกวนข้าด้วยการทะเลาะวิวาทเล็กๆ น้อยๆ ของพวกเจ้า ไปซะ"
 hold_court.6100.g.tt:0 "สงครามยังคงดำเนินต่อไป"
 hold_court.6101.t:0 "[sc_victor.GetTitledFirstName|U] ชนะการประลองยุทธ์"
 hold_court.6101.tt:0 "[sc_victor.GetTitledFirstName|U] ได้รับการประกาศให้เป็นผู้ชนะในสงคราม"
 #A Ravished Land
 hold_court.6110.t:0 "ดินแดนที่ถูกทำลาย"
 hold_court.6110.desc:0 ""[ROOT.Char.Custom('FormOfAddressForLiege')|U] ข้าเป็นเพียงชาวนาผู้ต่ำต้อย แต่ข้าขอความช่วยเหลือจากท่าน! ดินแดนของผู้คนของข้าถูกทำลายล้างจากสงครามอันยาวนานและนองเลือดระหว่างข้าหลวงของท่าน [6110_vassal_1.GetTitledFirstName] และ [6110_vassal_2.GetTitledFirstName]!\n\n"ทุ่งนาลุกเป็นไฟ สัตว์ถูกฆ่า และชาวนาก็ตาย! โปรดหยุดการนองเลือดนี้เถิด!""
 hold_court.6110.desc.almoner:0 "\n\n"ขอให้ความเมตตาของ [almoner.GetFaith.HighGodName] และความเอื้อเฟื้อเผื่อแผ่ของบุตรธิดาของ [almoner.GetFaith.HighGodNamePossessive] เป็นยาบรรเทาความทุกข์ทรมานของท่าน" [almoner.Custom2('MyCharacterIntroduction', ROOT.Char)] แนะนำอย่างนุ่มนวล"
 hold_court.6110.a:1 "สงครามสิ้นสุดแล้ว, [6110_vassal_1.GetTitledFirstNameNoTooltip] เป็นผู้ชนะ"
 hold_court.6110.b:1 "ทั้งสองฝ่ายต้องหยุดทันที!"
 hold_court.6110.c:1 "สงครามนี้ไร้สาระ, [6110_vassal_2.GetTitledFirstNameNoTooltip] เป็นผู้ชนะ"
 hold_court.6110.e:0 "ชาวนาไม่ควรยุ่งเกี่ยวกับเรื่องของขุนนาง"
 6110_custom_every_realm_1:0 "เคาน์ตีทั้งหมดในอาณาจักรของ [6110_vassal_1.GetShortUINamePossessive]"
 6110_custom_every_realm_2:0 "เคาน์ตีทั้งหมดในอาณาจักรของ [6110_vassal_2.GetShortUINamePossessive]"
 #The Day of Truth
 hold_court.6120.t:0 "วันแห่งความจริง"
 hold_court.6120.desc:0 ""[ROOT.Char.Custom('FormOfAddressForLiege')|U]!" [steward.Custom2('MyCharacterIntroduction', ROOT.Char)] เริ่มพูด "ข้ามีความคิดที่จะปรับปรุงการเก็บภาษี"\n\n"ท่านสามารถส่งผู้สำรวจไปสอบถามราษฎรของท่านเกี่ยวกับทรัพย์สินทุกอย่าง: ชื่อ เจ้าของ ขนาด และมูลค่า และจำนวนคนและสัตว์ที่อาศัยอยู่ที่นั่น!""
 hold_court.6120.desc.seneschal:0 "\n\n"โปรดเถิด [ROOT.Char.Custom('FormOfAddressForLiege')] อนุญาตให้ข้าดูแลเรื่องนี้" [seneschal.Custom2('YourCharacterIntroduction', ROOT.Char)|U] พูดขึ้น"
 hold_court.6120.desc.swans:0 "\n\n"และข้าจะจัดทำรายชื่อหงส์ทั้งหมดในดินแดนของท่าน! ตัวโปรดของข้าคือ [keeper_swans.Custom('GetSwanName')]! ข้าเคยบอกท่านเมื่อเร็วๆ นี้หรือไม่ว่าท้องของเธอนุ่มและฟูแค่ไหน? เมื่อวานเราไปเดินเล่นกันและ..." ข้าตัดสินใจที่จะไม่สนใจ [keeper_swans.Custom2('MyCharacterIntroduction', ROOT.Char)] ขณะที่ [keeper_swans.GetSheHe] พล่ามต่อไปเกี่ยวกับนกบ้านั่น"
 hold_court.6120.desc.jester:0 "\n\n"แต่ตัวเลขมัน #EMP น่าเบื่ออออ!#!" [jester.Custom2('MyCharacterIntroduction', ROOT.Char)] บ่น "มาเต้นรำกันดีกว่า!""
 hold_court.6120.a:0 "ตกลง ดำเนินการสำรวจต่อไป"
 hold_court.6120.a.tt:0 "การสำรวจเริ่มต้นขึ้น จะใช้เวลาหลายเดือนจึงจะเสร็จสมบูรณ์"
 hold_court.6120.b:0 "[seneschal.GetFirstNameNoTooltip], จัดการเรื่องนี้"
 hold_court.6120.c:0 "ถ้าข้าต้องการปรับปรุงการเก็บภาษี ข้าก็แค่ขอภาษี #EMP เพิ่ม#!..."
 6120_every_vassal:0 "ข้าหลวง แต่ละคนของท่าน"
 hold_court.6120.d:0 "มันไม่คุ้มค่า"
 hold_court.6120.e:0 "จริงด้วย มาเต้นรำไล่ตัวเลขชั่วร้ายกันเถอะ!"
 swan_name_illfated:0 "โชคไม่ดี"
 swan_name_rose:0 "โรส"
 swan_name_honky:0 "ฮองกี้ ฮองก์"
 swan_name_honker:0 "ฮองเกอร์"
 swan_name_hugo:0 "ฮิวโก้"
 swan_name_leda:0 "เลดา"
 swan_name_anklebiter:0 "นักกัดข้อเท้า"
 swan_name_angrynipper:0 "นักหนีบขี้โมโห"
 swan_name_odette:0 "โอเด็ตต์"
 hold_court.6121.t:0 "วันแห่งความจริง: การสำรวจเสร็จสมบูรณ์"
 hold_court.6121.desc:1 ""เสร็จสิ้นแล้ว [ROOT.Char.Custom('FormOfAddressForLiege')]" [6121_responsible.Custom2('MyCharacterIntroduction', ROOT.Char)] กล่าวขณะที่ [6121_responsible.GetSheHe] คำนับอยู่เบื้องหน้าข้า\n\n"หลายเดือนก่อน ท่านได้มอบหมายให้มีการสำรวจดินแดนทั้งหมดของท่าน บัดนี้เสร็จสมบูรณ์แล้ว และรายละเอียดเกี่ยวกับการเป็นเจ้าของและมูลค่าที่ดินทั้งหมดได้ถูกรวบรวมไว้ในหนังสือเล่มนี้ ตราบใดที่คำอธิบายนี้ยังตรงกับความเป็นจริง การเก็บภาษีของท่านจะมีประสิทธิภาพมากขึ้นทั่วทั้งอาณาจักร!""
 hold_court.6121.a:0 "ยอดเยี่ยมมาก, [6121_responsible.GetFirstNameNoTooltip]!"
 #The Cadastre
 hold_court.6130.t:0 "ทะเบียนที่ดิน"
 hold_court.6130.desc:0 ""[ROOT.Char.Custom('FormOfAddressForLiege')|U]" [6130_proposer.Custom2('MyCharacterIntroduction', ROOT.Char)] พูดขึ้น "ข้าขอเสนอให้มีการสำรวจรังวัดที่ดินของเคาน์ตีทั้งหมดที่ท่านเป็นเจ้าของ\n\n"ความรู้และการทำแผนที่ที่ดีขึ้นเกี่ยวกับดินแดนของท่านจะช่วยเพิ่มความเจริญรุ่งเรืองได้อย่างแน่นอน!"
 hold_court.6130.a:0 "ตกลง, [6130_proposer.GetFirstNameNoTooltip] ท่านดำเนินการได้"
 hold_court.6130.a.tt:1 "[6130_proposer.GetFirstNameNoTooltip] เริ่มทำงานเกี่ยวกับการสำรวจทำทะเบียนที่ดิน จะใช้เวลาหลายเดือนจึงจะเสร็จสมบูรณ์ และเมื่อเสร็จสมบูรณ์จะให้รางวัลดังต่อไปนี้:"
 hold_court.6130.d:0 "แผนที่เป็นสิ่งที่ถูกประเมินค่าสูงเกินไป"
 hold_court.6131.t:0 "ทะเบียนที่ดิน: เสร็จสมบูรณ์!"
 hold_court.6131.desc:0 "[6131_proposer.Custom2('MyCharacterIntroduction', ROOT.Char)|U] คำนับเล็กน้อยต่อหน้าข้าและอธิบายด้วยรอยยิ้มที่พึงพอใจ: "[ROOT.Char.Custom('FormOfAddressForLiege')|U] ท่านคงจำได้ว่า เมื่อหลายเดือนก่อน ท่านได้ลงทุนทองจำนวนมากในการทำแผนที่รังวัดเคาน์ตีของท่าน \n\n"ข้าได้กำกับดูแลเรื่องนี้เป็นการส่วนตัวและสามารถพูดได้อย่างภาคภูมิใจว่างานสำเร็จลุล่วงแล้ว!""
 hold_court.6131.desc_tutor:0 "ข้ายังยินดีที่ได้ยินรายงานโดยละเอียดเกี่ยวกับการเรียนรู้ของ [6130_tutored.GetTitledFirstNamePossessive] ภายใต้การแนะนำของ [6130_helper.Custom2('MyCharacterIntroduction', ROOT.Char)]"
 hold_court.6131.desc_hunt:0 "\n\nข้ายังยินดีที่ได้ยินรายงานโดยละเอียดเกี่ยวกับความช่วยเหลือที่สำคัญที่เสนอโดย [6130_helper.Custom2('MyCharacterIntroduction', ROOT.Char)]"
 hold_court.6131.desc_dead:0 "\n\nน่าเศร้าที่ [6130_helper.GetTitledFirstName] ไม่ได้มีชีวิตอยู่ยืนยาวพอที่จะเห็นการเสร็จสิ้นของทะเบียนที่ดินที่ [6130_helper.GetSheHe] ได้สาบานว่าจะช่วยสร้าง"
 hold_court.6131.a:0 "ทองคำที่ใช้ไปอย่างคุ้มค่า!"
 all_realm_county: "[county|E] ทุกแห่งใน [realm|E]"
 #A Cumbersome Gift
 hold_court.6140.t:0 "ของขวัญที่ยุ่งยาก"
 hold_court.6140.desc:2 "ทั้งห้องบัลลังก์เงียบกริบเมื่อ [6140_gifter.Custom2('MyCharacterIntroduction', ROOT.Char)] ก้าวเข้ามาอย่างผู้มีชัย ตามมาด้วยคนรับใช้สองคนที่กำลังดิ้นรนลาก #EMP [ROOT.Char.Custom('GetAnimalType')] ที่ถูกล่ามโซ่#!.\n\n[6140_gifter.GetFirstNameNoTooltip] ยิ้มอย่างภาคภูมิใจและอุทานว่า: "[ROOT.Char.Custom('FormOfAddressForLiege')|U] ข้านำของขวัญที่คู่ควรแก่ผู้ปกครองที่ยิ่งใหญ่ที่สุดในโลกมามอบให้ท่าน! สัตว์อันงดงามนี้ถูกล่าใน [6140_province.GetTerrain.GetNameNoTooltip] แห่ง [6140_province.GetCounty.GetName] และบัดนี้ข้าขอมอบมันให้ท่านเพื่อเป็นสัญลักษณ์ของความจงรักภักดีของข้าและอำนาจที่มิอาจเปรียบได้ของท่าน!""
 6140_bear:0 "หมี"
 6140_tiger:0 "เสือ"
 6140_lion:0 "สิงโต"
 hold_court.6140.a:0 "ขอบใจ ข้าต้องการพรมผืนใหม่อยู่พอดี"
 hold_court.6140.a.tt:0 "สัตว์ถูกฆ่าเพื่อเอาหนัง"
 hold_court.6140.artifact_tt:0 "ท่านได้รับ [court_artifact|E] หนังสัตว์"
 hold_court.6140.artifact_toast:0 "ได้รับหนังสัตว์แล้ว"
 hold_court.6140.b:0 "จริงแท้: สัตว์ร้ายผู้ยิ่งใหญ่สำหรับผู้ปกครองผู้ยิ่งใหญ่!"
 hold_court.6140.c:0 "ตัวตลกของข้าจะเรียนขี่มัน! ใช่ไหม, [jester.GetFirstNameNoTooltip]?"
 hold_court.6140.c.success:0 "มันทำได้!"
 hold_court.6140.c.success.tt:2 "[jester.GetFirstNameNoTooltip] เรียนขี่ [ROOT.Char.Custom('GetAnimalType')]"
 hold_court.6140.c.soft_failure:0 "[jester.GetFirstNameNoTooltip] ล้มลงบนก้น [jester.GetHerHis] กระแทกพื้น"
 hold_court.6140.c.soft_failure.tt:0 "ทุกคนหัวเราะเยาะความล้มเหลวของ [jester.GetFirstNamePossessiveNoTooltip]"
 hold_court.6140.c.middle_failure:0 "[jester.GetFirstNameNoTooltip] ได้รับบาดเจ็บ"
 hold_court.6140.c.middle_failure.tt:0 "[jester.GetFirstNameNoTooltip] ไม่ประสบความสำเร็จ"
 hold_court.6140.c.hard_failure:0 "[jester.GetFirstNameNoTooltip] ตาย!"
 hold_court.6140.c.hard_failure.tt:0 "[jester.GetFirstNameNoTooltip] ล้มเหลวอย่างน่าสังเวช..."
 hold_court.6140.d:0 "ข้ามั่นใจว่า #EMP แขก#! ของข้าในคุกใต้ดินจะ #EMP ชอบ#! มัน..."
 hold_court.6140.e:0 "นั่นดูอันตรายและเหม็น! เอามันออกไป"
 6140_every_courtier_or_guest:0 "ข้าราชบริพารหรือแขกทุกคนในราชสำนักของท่าน"
 6140_every_prisoner:0 "นักโทษทุกคนในห้องขังของท่าน"
 #The End Is Nigh!
 hold_court.6150.t:0 "จุดจบใกล้เข้ามาแล้ว!"
 hold_court.6150.desc:0 "ทันทีที่ถึงตา [6150_preacher.GetHerHis] ที่จะพูด, [6150_preacher.GetWomanMan] ที่กระสับกระส่ายอยู่ตรงหน้าข้าก็กรีดร้อง: "#EMP จุดจบใกล้เข้ามาแล้ว!#!\n\n"สัญญาณชัดเจนและอยู่ทุกหนทุกแห่ง:"
 hold_court.6150.desc_county:0 "ผู้คนใน [6150_county.GetName] รู้ดี —"
 hold_court.6150.desc_unsafety:0 "ความไม่สงบ, โจร, ขโมย, ความรุนแรง, และความยุติธรรมที่หายไปในหมู่มนุษย์!"
 hold_court.6150.desc_nature:0 "พืชผลล้มเหลว, ตั๊กแตนบุกทุ่งนา, ความหนาวเย็นที่ไม่สิ้นสุด, น้ำท่วม, และโรคระบาดที่เดินอยู่ท่ามกลางพวกเรา!"
 hold_court.6150.desc_looting:0 "ประการแรกคือคนเถื่อนที่ประตูเมืองของเรา, ปล้นพืชผลของเรา, ฆ่าผู้คนของเรา, ทำลายเมืองของเรา, และแพร่กระจายความเจ็บป่วยและความอดอยาก!"
 hold_court.6150.desc_infidels:0 "พวกนอกรีตอยู่ทุกหนทุกแห่ง, บ่อนทำลายเราทั้งจากนอกพรมแดนและภายในอาณาจักรของเราเอง!"
 hold_court.6150.desc_lost_hgw:0 "จะมีอะไรชัดเจนไปกว่ากองทัพของ [ROOT.GetCharacter.GetFaith.HighGodName] ที่พ่ายแพ้ต่อพวกนอกรีต?"
 hold_court.6150.desc_visions:0 "สายฟ้าในท้องฟ้าแจ่มใส, นกอพยพผิดฤดูกาล, เสียงสวดมนต์ในตอนกลางคืน, งูพูดได้!"
 hold_court.6150.desc_monk:0 "วันที่และการคำนวณทั้งหมดสอดคล้องกัน!"
 hold_court.6150.desc_fallback:0 "ความรุนแรง, การทุจริต, ความชั่วร้าย — ผู้ศรัทธาลืม [ROOT.GetCharacter.GetFaith.HighGodName] ไปแล้ว!"
 hold_court.6150.desc_christianism:0 "\n\n"วันพิพากษามาถึงแล้ว!"
 hold_court.6150.desc_buddhism:0 "\n\n"เวลาของพระศรีอาริยเมตไตรยมาถึงแล้ว!"
 hold_court.6150.desc_islam:0 "\n\n"การพิพากษาครั้งสุดท้ายกำลังจะมาถึง!"
 hold_court.6150.desc_judaism:0 "\n\n"สงครามแห่งโกกและมาโกกมาถึงแล้ว!"
 hold_court.6150.desc_germanic:0 "\n\n"แร็กนาร็อกมาถึงแล้ว!"
 hold_court.6150.desc_hinduism:0 "\n\n"กัลกีกำลังจะมา!"
 hold_court.6150.desc_zoroastrianism:0 "\n\n"ฟราโชเคเรตีได้เริ่มขึ้นแล้ว!"
 hold_court.6150.desc_religion_fallback:0 "\n\n"โลกอย่างที่เรารู้จักกำลังจะสิ้นสุดลง!"
 hold_court.6150.desc_solution:0 "\n\n"มีทางเดียวเท่านั้นที่เราจะรอดได้:"
 hold_court.6150.desc_celibacy:0 "พรหมจรรย์และความบริสุทธิ์! จงละทิ้งการล่อลวงทางเนื้อหนัง!"
 hold_court.6150.desc_burn:0 "เผา #EMP พวกนอกรีตทั้งหมด#! ทิ้ง!"
 hold_court.6150.desc_alcohol:0 "ละทิ้งความชั่วร้ายทั้งหมด, เริ่มต้นด้วยการดื่มสุราและกินอาหารที่มากเกินไป!"
 hold_court.6150.desc_reclusive:0 "ปฏิเสธโลกและการล่อลวงของมัน!"
 hold_court.6150.desc_flagellant:0 "ทรมานเนื้อหนัง, และหลั่งเลือดเพื่อความรอดของเจ้า!"
 hold_court.6150.desc_eating:0 "ชำระจิตใจของเจ้าให้บริสุทธิ์ด้วยการชำระร่างกายของเจ้า! ความรอดไม่สามารถบรรลุได้ด้วยท้องที่หนักอึ้ง!"
 hold_court.6150.desc_end:0 "\n\n"จงกลับใจเดี๋ยวนี้!! เพราะวันนั้นใกล้เข้ามาแล้ว!!""
 hold_court.6150.a:0 "ความรอดต้องบรรลุได้ด้วยทุกวิถีทาง!"
 hold_court.6150.a.tt:0 "ท่านคุ้นเคยกับการปฏิบัติเพื่อสำนึกผิดเหล่านี้อยู่แล้ว"
 hold_court.6150.a.wrath:1 "ท่านสั่งให้ [6150_heretics_p.GetName] ถูกชำระล้างจากคนบาปทั้งหมด"
 hold_court.6150.b:0 "[6150_preacher.GetFirstNameNoTooltip] ผู้ชาญฉลาด, จงอยู่และสอนทางให้ข้า!"
 hold_court.6150.c:0 "เรื่องไร้สาระ! เผาคนนอกรีตที่คลุ้มคลั่งนี้ทิ้ง!"
 hold_court.6150.d:0 "เอาคนโง่นี้ออกไปให้พ้นสายตาข้า"
 #Empty Coffers
 hold_court.6160.t:0 "คลังที่ว่างเปล่า"
 hold_court.6160.desc:0 ""[ROOT.Char.Custom('FormOfAddressForLiege')|U]" [6160_vassal.Custom2('MyCharacterIntroduction', ROOT.Char)] เริ่มต้น ด้วยท่าทีสำนึกผิดอย่างยิ่ง "ช่วงเวลาที่ผ่านมาเป็นช่วงเวลาที่ยากลำบากสำหรับเขตแดนของข้าอย่างแท้จริง มีค่าใช้จ่ายเพิ่มเติมที่จำเป็นในทุกด้าน และคลังของข้าก็น่าเศร้าที่ว่างเปล่า...\n\n"มันเจ็บปวดสำหรับข้า แต่ข้าตัดสินใจที่จะร้องขอความเมตตาจากท่านเพื่อช่วยในการชำระหนี้สินของข้า"
 hold_court.6160.desc_friend:0 "\n\n"ในนามของความผูกพันที่ผูกมัดเรา, โปรดช่วยข้าด้วย!"
 hold_court.6160.desc_hook:0 "\n\n"หากท่านทำ เช่นนั้น, ข้าจะถือว่าบุญคุณที่ท่านติดค้างข้าได้รับการชดใช้แล้ว"
 hold_court.6160.desc_fallback:0 "\n\n"ข้าจะไม่ลืมความเอื้อเฟื้อเผื่อแผ่ของท่านในยามที่ข้าต้องการ!""
 hold_court.6160.a:0 "ตกลง — แต่เจ้าจะต้องติดหนี้บุญคุณข้า!"
 hold_court.6160.b:0 "ตกลง — ข้าไม่ติดค้างอะไรเจ้าแล้วตอนนี้"
 hold_court.6160.c:0 "มันเป็นอย่างน้อยที่สุดที่ข้าสามารถทำเพื่อเจ้าได้!"
 hold_court.6160.d:0 "ดังที่ผู้ดูแลงานบุญของข้าสอน, การกุศลเป็นหนทางของผู้ศรัทธา"
 hold_court.6160.e:0 "หนี้สินหมายถึงการบริหารที่ไม่ดี [seneschal.GetFirstNameNoTooltip], ช่วย [6160_vassal.GetHerHim]!"
 hold_court.6160.f:0 "ขออภัย ข้าไม่มีเงินเหลือพอ"
 #Ignoble Imprisonment
 hold_court.6170.t:0 "การจองจำอันต่ำต้อย"
 hold_court.6170.desc:0 "[6170_vassal.Custom2('MyCharacterIntroduction', ROOT.Char)|U] ยืนอยู่เบื้องหน้าข้า ด้วยสีหน้ากังวลบนใบหน้าของ [6170_vassal.GetHerHis] "[ROOT.Char.Custom('FormOfAddressForLiege')|U] ข้ามาในนามของ [6170_relative.Custom2('MyCharacterIntroduction', 6170_vassal)]\n\n"[6170_relative.GetSheHe|U] ถูกคุมขังอย่างน่าอดสูโดย [6170_rival.Custom2('YourCharacterIntroduction', 6170_vassal)] ด้วยเหตุผลเล็กน้อยและไร้สาระ หัวใจข้าแตกสลายเมื่อนึกถึงสภาพอันน่าสังเวชที่ [6170_vassal.Custom2('RelationToMe', SCOPE.sC('6170_relative'))] ผู้น่าสงสารของข้าต้องทน...\n\n"โปรดเถิด แสดงความเมตตาต่อ [6170_relative.GetHerHim] และสั่งให้ปล่อยตัว [6170_relative.GetHerHim] ด้วยเถิด!""
 hold_court.6170.a:0 "ปล่อย [6170_relative.GetFirstNameNoTooltip] ให้เป็นอิสระ!"
 hold_court.6170.b:0 "[6170_rival.GetFirstNameNoTooltip] ต้องมีเหตุผลที่ดีในการจองจำ [6170_relative.GetHerHim]"
 hold_court.6170.c:0 "ข้าจะให้ความเมตตาเล็กน้อยแก่ [6170_relative.GetHerHim] เท่านั้น"
 hold_court.6170.d:0 "ตัดหัวทิ้ง, ปัญหาก็จบ!"
 hold_court.6170.e:0 "ข้าไม่สนใจเรื่องทะเลาะวิวาทของพวกเจ้าจริงๆ"
 #A Shadow in the Night
 hold_court.6190.t:0 "เงาในยามค่ำคืน"
 hold_court.6190.desc:1 "[6190_local.GetWomanMan] ที่เข้ามาใกล้บัลลังก์ของข้าเป็นสามัญชนอย่างชัดเจน "[ROOT.Char.Custom('FormOfAddressForLiege')|U]" [6190_local.GetSheHe] เริ่มกล่าวสุนทรพจน์ [6190_local.GetHerHis] "ข้าเป็นตัวแทนของชุมชนท้องถิ่นแห่ง [capital.GetNameNoTooltip]"\n\n"ในช่วงสองสามเดือนที่ผ่านมา สุสานของเราประสบปัญหากับการหายไปของศพ! ทั้งหมดถูกขุดขึ้นมาและไม่เหลือร่องรอยใดๆ ตอนแรกเรากลัวว่าเป็นสัตว์ป่า หรือพลังมืดที่ทำงานอยู่ แต่แล้ว $court_physician_court_position$ [physician.GetTitledFirstName] ของท่านเองก็ถูกจับได้คาหนังคาเขาขณะกำลังขนย้ายศพเพื่อการทดลองของ [physician.GetHerHis]!\n\n"โปรดหยุดการลบหลู่นี้เถิด!""
 hold_court.6190.a:0 "การศึกษาร่างกายมนุษย์เป็นความจำเป็นที่น่าเศร้า"
 hold_court.6190.b:0 "ทำไมท่านไม่เชิญข้าไปด้วย, [physician.GetFirstNameNoTooltip]?!"
 hold_court.6190.c:0 "ศพที่สด — #EMP มีชีวิต#! — เป็นตัวอย่างทดลองที่ดีกว่า..."
 hold_court.6190.d:0 "#EMP ทหารยาม!#! จับกุมโจรขโมยศพ!"
 hold_court.6190.e:0 "[physician.GetFirstNameNoTooltip], หยุดทำเสียที"
 #A Land of Foreigners
 hold_court.6210.t:1 "ดินแดนของชาวต่างชาติ"
 hold_court.6210.desc:1 ""[ROOT.Char.Custom('FormOfAddressForLiege')|U] ข้าเสียใจที่ต้องแจ้งให้ท่านทราบว่าข้าหมดความอดทนแล้ว!" [6210_vassal.Custom2('MyCharacterIntroduction', ROOT.Char)] เห็นได้ชัดว่าโกรธเคืองอย่างมาก\n\n"ผู้คนที่ข้าควรจะปกครองนั้นอยู่เหนือความเข้าใจของข้า ด้วยขนบธรรมเนียมที่ไร้สาระและรสนิยมอาหารที่ #EMP แย่มาก#! ความพยายามทั้งหมดของข้าจนถึงตอนนี้สูญเปล่า — มันดูเหมือนจะเป็นไปไม่ได้เลยที่จะ ทำให้พวกเขาเป็นทาสติดที่ดินที่ดีได้\n\n"ข้าเกรงว่าการแทรกแซงที่รุนแรงจากเบื้องบนเป็นทางออกเดียวที่มีในตอนนี้""
 hold_court.6210.a:1 "[steward.GetFirstNameNoTooltip], แสดงวิถีทางของเราให้พวกเขาเห็น"
 hold_court.6210.b:0 "ให้เราแสดงความยิ่งใหญ่ของเราให้พวกเขาเห็น, พวกเขาจะเปลี่ยนใจ!"
 hold_court.6210.b.tt:0 "ท่านส่ง $royal_architect_court_position$ ของท่านไปพัฒนาโครงสร้างพื้นฐานของเคาน์ตี"
 hold_court.6210.c:0 "เราเคารพประเพณีของข้ารับใช้ทุกคนของเรา"
 hold_court.6210.d:0 "ตราบใดที่พวกเขาจ่ายภาษี, ข้าไม่สนใจ"
 #A Massive Problem
 hold_court.6230.t:0 "ปัญหา #EMP ใหญ่หลวง#!"
 hold_court.6230.desc:0 ""[ROOT.Char.Custom('FormOfAddressForLiege')|U] ขอความสนใจสักครู่ หากข้าจะขออนุญาต..." [6230_vassal.Custom2('MyCharacterIntroduction', ROOT.Char)|U] พูดขึ้น "[6230_province.GetName] กำลังประสบปัญหาที่ #EMP ยุ่งยาก#! พอสมควรในช่วงหลายสัปดาห์ที่ผ่านมา...\n\n"คืออย่างนี้ โขลงช้างที่ #EMP ควบคุมไม่ได้โดยสิ้นเชิง#! กำลังอาละวาดไปทั่วเคาน์ตี ทิ้งร่องรอยความพินาศไว้เบื้องหลัง และในบางครั้งก็ถึงแก่ความตาย! เสียงร้องแผดดังอันน่าสะพรึงกลัวของพวกมันดังก้องอยู่ในหูของเราทั้งวันทั้งคืน — ข้ายังคงได้ยินมันอยู่เลยในตอนนี้!" [6230_vassal.GetSheHe] เริ่มทำเสียง #EMP ร้องแปร๋น#! ที่ไม่เหมาะสม "โปรดเถิด [ROOT.Char.Custom('FormOfAddressForLiege')] ส่งความช่วยเหลือมาที!""
 hold_court.6230.a:0 "เอาทองคำไปและสร้างขึ้นใหม่"
 hold_court.6230.b:0 "ข้าจะส่งคนไปหยุดสัตว์ร้ายเหล่านั้น"
 hold_court.6230.b.success:0 "นักล่าของท่านจับช้างป่าได้"
 hold_court.6230.b.success.tt:0 "ช้างถูก ทำให้เชื่อง"
 hold_court.6230.b.failure:0 "ช้างยังคงอาละวาดต่อไป"
 hold_court.6230.b.failure.tt:0 "ช้างกำลังอาละวาด"
 hold_court.6230.c:0 "ช้าง, ม้า, เหมือนกัน... [m_horse.GetFirstNameNoTooltip], จัดการมัน!"
 hold_court.6230.c.success:0 "$master_of_horse_court_position$ ของท่านจับช้างได้"
 hold_court.6230.d:0 "$hinduism_good_god_ganesh$ นำทางพวกมัน"
 hold_court.6230.e:0 "ข้าไม่มีเวลาสำหรับเรื่องไร้สาระนี้"
 hold_court.6230.f:0 "ฆ่าสัตว์ร้ายที่น่ารังเกียจทั้งหมดทิ้ง"
