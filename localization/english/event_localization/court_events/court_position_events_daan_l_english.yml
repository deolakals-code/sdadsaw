l_english: 
 court_position_management_event.0001.t: "ตำแหน่งว่าง: [court_position_type.GetNameNoTooltip()]"
 court_position_management_event.0001.desc: "ตำแหน่ง [court_position_type.GetName()] ในราชสำนักของข้าว่างลงโดย [employee.GetFullName]"
 court_position_management_event.0001.desc.dead: "[employee.GetSheHe|U] [employee.GetDeathReason]"
 court_position_management_event.0001.desc.one_candidate: "\n\nที่ปรึกษาของข้าพบผู้ที่เหมาะสมเพียงคนเดียวที่สามารถดำรงตำแหน่งได้ คือ [candidate_1.GetFullName]"
 court_position_management_event.0001.desc.two_candidates: "\n\nที่ปรึกษาของข้าได้เสนอชื่อผู้ที่เหมาะสมบางคนจากอาณาจักรของข้าที่สามารถดำรงตำแหน่งได้ ได้แก่ [candidate_1.GetFullName] และ [candidate_2.GetFullName]"
 court_position_management_event.0001.desc.no_candidates: "\n\nที่ปรึกษาของข้าไม่พบผู้ที่เหมาะสมจากอาณาจักรของข้าที่จะมาแทนที่ [employee.GetHerHim]"
 court_position_management_event.0001.a: "[candidate_1.GetFirstNameNoTooltip] เหมาะสมกับงานนี้!"
 court_position_management_event.0001.a.aptitude: "[aptitude|E] ของ [candidate_1.GetUINamePossessive] คือ [candidate_1.GetCourtPositionAptitude( court_position_type )]"
 court_position_management_event.0001.b: "[candidate_2.GetFirstNameNoTooltip] ก็ใช้ได้"
 court_position_management_event.0001.b.aptitude: "[aptitude|E] ของ [candidate_2.GetUINamePossessive] คือ [candidate_2.GetCourtPositionAptitude( court_position_type )]"
 court_position_management_event.0001.c: "บางทีเราอาจหาผู้ที่เหมาะสมจากที่อื่นได้..."
 court_position_management_event.0001.c.tt: "เปิด [decision|E] [GetDecision('recruit_court_position_decision').GetName]"
 court_position_management_event.0001.d: "ข้าจะจัดการเรื่องนี้ด้วยตนเอง..."
 court_position_management_event.0001.d.tt: "เปิดหน้าต่างเพื่อ แต่งตั้ง [court_position_type.GetName] คนใหม่"
 court_position_management_event.0001.e: "ปล่อยให้ว่างไว้ก่อนในตอนนี้"

 court_position_management_event.0002.t: "ตำแหน่งว่าง: [court_position_type.GetNameNoTooltip()]"
 court_position_management_event.0002.desc: "[employee.GetFullName] ไม่ได้เป็น [court_position_type.GetName()] ของข้าอีกต่อไป"
 court_position_management_event.0002.desc.dead: "$court_position_management_event.0001.desc.dead$"
 court_position_management_event.0002.desc.one_candidate: "\n\nข้ารู้จักผู้ที่เหมาะสมเพียงคนเดียวจากค่ายของข้าที่สามารถรับบทบาทนี้ได้ คือ [candidate_1.GetFullName]"
 court_position_management_event.0002.desc.two_candidates: "\n\nผู้คนได้เสนอชื่อผู้ที่เหมาะสมบางคนจากค่ายของข้าที่สามารถรับบทบาทนี้ได้ ได้แก่ [candidate_1.GetFullName] และ [candidate_2.GetFullName]"
 court_position_management_event.0002.desc.no_candidates: "\n\nข้าไม่พบผู้ที่เหมาะสมจากค่ายของข้าที่จะมาแทนที่ [employee.GetHerHim]"
 court_position_management_event.0002.a: "$court_position_management_event.0001.a$"
