l_english: 

 mpo_great_war_of_defiance_cb: "มหาศึกแห่งการท้าทาย"
 MPO_GREAT_WAR_OF_DEFIANCE_NAME: "$mpo_great_war_of_defiance_cb$ ต่อต้าน [DEFENDER.GetShortUINameNotMe]"
 MPO_GREAT_WAR_OF_DEFIANCE_NAME_MY: "[ConcatIfNeitherEmpty('$ORDER|q$', ' ')]$mpo_great_war_of_defiance_cb$ ต่อต้าน [DEFENDER.GetShortUIName]"
 MPO_GREAT_WAR_OF_DEFIANCE_NAME_BASE: "$mpo_great_war_of_defiance_cb$"
 mpo_war_of_defiance_gok_loses_defender: "ท่านถูกจองจำโดย [attacker.GetShortUIName] และบรรดาศักดิ์[titles|E]ในที่ดิน ข้าหลวง[vassals|E] และรัฐบรรณาการ[tributaries|E]ทั้งปวงของท่านล้วนกลับเป็นอิสระ ปศุสัตว์[herd|E] เกียรติภูมิ[prestige|E] ทองคำ[gold|E] อำนาจชนเผ่าเร่ร่อน[nomadic_authority|E] และความชอบธรรม[legitimacy|E]ส่วนใหญ่ของท่านได้สูญสิ้นไป"
 mpo_war_of_defiance_gok_loses_attacker: "[defender.GetShortUIName] ถูกจองจำโดยท่าน ถูกหยามเกียรติ สิ้นเนื้อประดาตัว และสูญสิ้นบรรดาศักดิ์[titles|E]ในที่ดิน[landed|E]ทั้งปวง ข้าหลวง[vassals|E] เคาน์ตี[counties|E] และรัฐบรรณาการ[tributaries|E]ของ[defender.GetHerHis|U]ล้วนกลับเป็นอิสระ"
 mpo_war_of_defiance_gok_loses_other: "[defender.GetShortUIName] ถูกจองจำโดย [attacker.GetShortUIName] ถูกหยามเกียรติ สิ้นเนื้อประดาตัว และสูญสิ้นบรรดาศักดิ์[titles|E]ในที่ดิน[landed|E]ทั้งปวง ข้าหลวง[vassals|E] เคาน์ตี[counties|E] และรัฐบรรณาการ[tributaries|E]ของ[defender.GetHerHis|U]ล้วนกลับเป็นอิสระ"
 mpo_war_of_defiance_gok_wins_defender: "เหล่าชนเผ่าเร่ร่อน[nomads|E]อิสระ[independent|E]ที่พ่ายแพ้จะกลายเป็นข้าหลวง[vassals|E]ผู้ภักดี[obedient|E]ของท่าน สัญญาสงบศึก[truces|E]อื่นใดทั้งปวงกับท่านเป็นอันสิ้นสุดลง ท่านจักได้เป็น [GetTrait('greatest_of_khans').GetName( GetNullCharacter )] และได้รับคุณสมบัติพิเศษอันทรงพลังเพื่อการพิชิตทั่วหล้า"
 mpo_war_of_defiance_gok_wins_other: "เหล่าชนเผ่าเร่ร่อน[nomads|E]อิสระ[independent|E]ที่พ่ายแพ้จะกลายเป็นข้าหลวง[vassals|E]ผู้ภักดี[obedient|E]ของ[defender.GetShortUINamePossessive] สัญญาสงบศึก[truces|E]อื่นใดทั้งปวงกับ [defender.GetShortUIName] เป็นอันสิ้นสุดลง [defender.GetShortUIName] จักได้เป็น [GetTrait('greatest_of_khans').GetName( GetNullCharacter )] และได้รับคุณสมบัติพิเศษอันทรงพลังเพื่อการพิชิตทั่วหล้า"
 accolade_attackers_all_gain_glory_tt: "#high ฝ่ายโจมตี#! @accolade_icon![accolades|E] ได้รับเกียรติศักดิ์[glory|E]อย่างใหญ่หลวง"
 accolade_defenders_all_gain_glory_tt: "#high ฝ่ายป้องกัน#! @accolade_icon![accolades|E] ได้รับเกียรติศักดิ์[glory|E]อย่างใหญ่หลวง"
 mpo_war_of_defiance_gold_herd_tt: "ผู้โจมตี#high ทุกคน#! ได้รับ @herd_icon!ปศุสัตว์[herd|E] และ @gold_icon!ทองคำ[gold|E]"
 custom.every_defender_vassal: "ข้าหลวง[vassals|E]ทุกคนของ[defender.GetShortUINamePossessive]"
custom.every_defender_tributary: "รัฐบรรณาการ[tributaries|E]ทุกแห่งของ[defender.GetShortUINamePossessive]"
great_war_of_defiance_attackers_gold_tt: "ได้รับ @gold_icon!ทองคำ[gold|E] จากผู้โจมตี#high ทุกคน#!"
gok_delete_all_truces_tt: "สัญญาสงบศึก[truce|E]ที่ถือครองไว้ทุกฉบับเป็นอันสิ้นสุด"
will_become_greatest_of_khans_tt: "จักได้เป็น [GetTrait('greatest_of_khans').GetName( GetNullCharacter )]... และการปราบปรามทั่วหล้าจักเริ่มต้นขึ้น"
every_new_vassal_becomes_obedient_tt: "ข้าหลวง[vassal|E]ที่ได้มาใหม่ทุกคนจะยังคงภักดี[obedient|E]เป็นเวลาอย่างน้อย #high 10 ปี#!"

 msg_great_war_of_defiance_war_invalidated_message: "สงคราม [war.GetName] ไร้ ซึ่งความมุ่งหมาย: [defender.GetShortUIName] มิอาจเป็น [GetTrait('greatest_of_khans').GetName( GetNullCharacter )] ได้"

 war_declared_opening_mpo_gok: "[ROOT.War.GetActiveCB.GetDefender.GetTitledFirstNameNoTooltip] เจ้าสุนัขน้ำลายฟูมปาก,\n\n"
 war_declared_flavor_mpo_gok: "เนื้อหนังทั้งปฐพีนี้มิได้มีไว้เพื่อขากรรไกรอันหิวกระหายของเจ้า โลกนี้จะไม่มีวันเป็นของเจ้า\n\nพวกเราทั้งสิ้นเห็นพ้องต้องกันที่จะปฏิเสธอำนาจของเจ้า เพื่อโค่นเจ้าลง! แต่ไหน แต่ไรมาเจ้ามิเคยหันหลังหรือแสดงบั้นท้ายอาชาของเจ้า ฉะนั้นแล้ว เราจักทำสงคราม"

 mpo_greatest_of_khans.0101.t: "มหาสงครามเพื่อแผ่นดินและสวรรค์"
 mpo_greatest_of_khans.0101.desc_intro: "เผ่าพันธุ์นับไม่ถ้วนลุกขึ้นต่อต้านข้า ถูกปลุกปั่นให้เข้าร่วมสงครามโดย"
 mpo_greatest_of_khans.0101.desc_gok_opponent: "[primary_coalition_defender.GetName] และกองทัพของ[gok_opponent.GetPrimaryTitle.GetNameNoTier]ก็เข้าร่วมกับพวกเขา — [gok_opponent.GetTitledFirstName] ปรารถนาอย่างยิ่งที่จะเห็นทุ่งหญ้าสเตปป์อันยิ่งใหญ่แตกแยก!"
 mpo_greatest_of_khans.0101.desc_primary_attacker: "เสียงอันมืดมนและถุงเงินอันหนักอึ้งของ [primary_coalition_defender.GetName]"
 mpo_greatest_of_khans.0101.desc_sub: "\n\nส่วนผู้อื่น เหล่าผู้อ่อนแอและขลาดกลัว ได้คลานมายัง [ROOT.Char.GetCapitalLocation.GetName] และเข้าร่วมกับ [big_sub.GetName] ในการยอมสวามิภักดิ์ต่อข้า"
 mpo_greatest_of_khans.0101.desc: "\n\n\"ทุกเผ่าภายใต้การปกครองของ [ROOT.Char.GetPrimaryTitle.GetName] จงฟังคำประกาศ!\" [vassal_1.GetTitledFirstName] [ROOT.Char.Custom2('RelationToMeShort', vassal_1)]ของข้าเอ่ยขึ้น \"ผู้กล้าจงขึ้นหลังอาชาศึก! เราจะควบม้าไปยังที่ ซึ่งธงหางม้าของท่านโบกสะบัดต้องลม!\""

 gok_submitters_became_tributaries_tt: "ผู้ปกครอง[rulers|E]รายย่อยในดินแดนข้างเคียงจำนวนมากได้กลายเป็นรัฐบรรณาการ[tributaries|E]ผู้ภักดี[obedient|E]ของท่าน"

 mpo_greatest_of_khans.0101.a: "แล้ว#EMPพวกขี้ขลาดล่ะ?#! ข้าจะให้พวกมันควบม้าไปด้วย!"
 mpo_greatest_of_khans.0101.a.flavor: "การส่งครอบครัวของข้าไปอ้อนวอนพวกเขาจะนำพาบางคนเข้าสู่สนามรบ... แลกกับการสูญเสียความภาคภูมิใจของเรา"
 mpo_greatest_of_khans.0101.b: "จงถนอมตัวไว้เพื่อสงครามที่กำลังจะมาถึงเถิด"
 mpo_greatest_of_khans.0101.b.flavor: "ข้าจะสู้ศึกนี้เพียงลำพัง"
 mpo_greatest_of_khans.0101.c: "เราจักครอบครองโลก — หรือ มิฉะนั้นก็ตาย!"

 became_your_tributary_tt: "ได้กลายเป็นรัฐบรรณาการ[tributary|E]ของท่าน"
 gok_fights_alone_reward_on_victory_tt: "หากท่านได้เป็น [GetTrait('greatest_of_khans').GetName( GetNullCharacter )] ท่านจะได้รับ @dynasty_prestige_icon!เกียรติภูมิราชวงศ์[dynasty_prestige|E] ซึ่งปรับตามจำนวนและระดับยศ[title_tier|E]ของข้าหลวง[vassals|E]เหล่านี้"
 gok_obedient_vassals_leave_war_tt: "@alert_icon! #alert_trial ข้าหลวง[vassals|E]ทั้งหมดที่เข้าร่วมสงคราม[war|E]ในฝ่ายของท่านจะถูกถอดออกจากการเป็นผู้มีส่วนร่วม#!"
 gok_joiners_wars_cancelled_tt: "ข้าหลวง[vassals|E]เหล่านี้จะถูกถอดออกจากสงคราม[wars|E]อื่น ๆ หรือจะยุติสงครามเหล่านั้นด้วยสัญญาสันติภาพสีขาว[white_peace|E]"

 mpo_greatest_of_khans.0102.t: "การไขว่คว้าจักรวาล"
 mpo_greatest_of_khans.0102.desc: "เหล่าทหารม้าหน้าซีดเผือดและผู้คนผู้พินาศหลั่งไหลออกมาจากดินแดนอันโหดร้ายของ [gurkhan_to_gok.GetPrimaryTitle.GetBaseNameNoTier] ทุกคนร่ำไห้เรียกชื่อเดียวกัน - [gurkhan_to_gok.GetName]!\n\n[gurkhan_to_gok.GetSheHe|U] ชนเผ่าเร่ร่อนผู้น่าสะพรึงกลัวที่สุด บัดนี้เรียกร้องการยอมจำนนจากทุกเผ่าพันธุ์ ให้พวกเขารวมเป็นหนึ่งภายใต้ธงอาบเลือดของ[gurkhan_to_gok.GetHerHis] ใฝ่ฝันที่จะยึดครองโลกทั้งใบ!\n\nพันธมิตรอันกว้างใหญ่ ซึ่งรวมตัวกันโดย [primary_coalition_defender.GetName] เคลื่อนทัพต่อต้านความทะนงตนของ[gurkhan_to_gok.GetTitledFirstNamePossessiveNoTooltip]... สงครามได้เริ่มขึ้นแล้ว และความตายถูกนำพามาด้วยเสียงกีบม้า"
 mpo_greatest_of_khans.0102.a: "#EMP ข่านแห่งข่านทั้งปวง ข้าควบม้าเคียงข้างท่าน!#!"
 mpo_greatest_of_khans.0102.b: "เราต้องโค่น [gurkhan_to_gok.GetTitledFirstNameNoTooltip] ลงให้จงได้!"
 mpo_greatest_of_khans.0102.c: "[gurkhan_to_gok.GetFirstNameNoTooltip] มิอาจหยุดยั้งได้ ข้าต้องยอมจำนน"
 mpo_greatest_of_khans.0102.d: "ผู้พิชิตผู้นี้จักได้รับคำสัตย์ของข้า"
 mpo_greatest_of_khans.0102.e: "ท้องฟ้ามืดมิดด้วยลูกธนู และชะตากรรมเลือนหายไปจากสายตา..."

 gok_took_become_gok_decision_tt: "ได้ทำการตัดสินใจ[decision|E] #high $mpo_become_greatest_of_khans_decision$#! แล้ว"
 gok_began_war_of_defiance_tt: "เริ่ม #high $mpo_great_war_of_defiance_cb$#! ต่อต้านชนเผ่าเร่ร่อน[nomads|E]ทั้งหมดในภูมิภาคย่อย[situation_sub_regions|E]ร่วมของ[the_great_steppe|E]"
 gok_gurkhan_declared_intent_tt: "@warning_icon! #X หากพวกเขาชนะใน #high $mpo_great_war_of_defiance_cb$#! พวกเขาจะกลายเป็น [GetTrait('greatest_of_khans').GetName( GetNullCharacter )] และเริ่มพิชิตโลก#!"
 gok_warning_one_off_tt: "@alert_icon! #alert_trial จะไม่มีผู้ปกครอง[ruler|E]อื่นใดสามารถเป็น [GetTrait('greatest_of_khans').GetName( GetNullCharacter )] ได้อีกต่อไป#!"

 mpo_greatest_of_khans.0103.t: "ข่านผู้ต่ำต้อยที่สุด"

 mpo_greatest_of_khans.0103.desc_defender_intro: "ข้า ผู้แข็งแกร่งที่สุดในหมู่ชนเผ่าเร่ร่อนทั้งปวง — พยัคฆ์หิมะผู้ยิ่งใหญ่ที่อาจหาญเรียกหมาป่าและแมวป่าทุกตัวให้สยบแทบเท้า — บัดนี้พ่ายแพ้ ถูกพันธนาการด้วยโซ่ตรวน\n\n[defender.GetFirstName] เจ้าผู้ครอง[defender.GetLadyLord]แห่งชาว[defender.GetDomicile.GetCulture.GetCollectiveNoun] จะไม่ได้เป็นจอมข่านผู้เกรียงไกร\n\nทุ่งหญ้าสเตปป์ตกสู่ภาวะอนาธิปไตยอีกครั้ง"
 mpo_greatest_of_khans.0103.desc_intro: "ผู้แข็งแกร่งที่สุดในหมู่ชนเผ่าเร่ร่อนทั้งปวง — พยัคฆ์หิมะผู้ยิ่งใหญ่ที่อาจหาญเรียกหมาป่าและแมวป่าทุกตัวให้สยบแทบเท้า — บัดนี้พ่ายแพ้ ถูกพันธนาการด้วยโซ่ตรวน\n\n[defender.GetFirstName] เจ้าผู้ครอง[defender.GetLadyLord]แห่งชาว[defender.GetDomicile.GetCulture.GetCollectiveNoun] จะไม่ได้เป็นจอมข่านผู้เกรียงไกร\n\nทุ่งหญ้าสเตปป์ตกสู่ภาวะอนาธิปไตยอีกครั้ง"
 mpo_greatest_of_khans.0103.desc_defender: "เหล่านักรบผู้สิ้นหวังของข้าเองกลับหักหลังข้า ขายข้าให้กับ [attacker.GetName] ผู้คนของข้าดูหมิ่นครอบครัว ความฝัน และนามของข้า\n\nข้ามิใช่[defender.Custom('GetDaughterSon')]แห่งโชคชะตา"
 mpo_greatest_of_khans.0103.desc_attacker: "ข้าได้ทำลายอำนาจของศัตรูที่มีเหนือเหล่าหัวหน้าเผ่าแล้ว! บัดนี้ เหล่าสุนัขจะหลั่งเลือดแก่งแย่งเศษเดนกันเอง"
 mpo_greatest_of_khans.0103.desc_defenders: "พวกเราก้มใบหน้าที่กร้านลมด้วยความอับอาย เก็บสายธนูที่ขาดวิ่น และสาปแช่งลางบอกเหตุจอมปลอมที่ ทำให้เราติดตาม[defender.GetWomanMan]ผู้ไม่คู่ควรเข้าสู่สงคราม..."
 mpo_greatest_of_khans.0103.desc_attackers: "ชัยชนะอันภาคภูมิของเราได้บดขยี้เจตจำนงของผู้คนของ[defender.GetFirstNamePossessiveNoTooltip] และพวกเราผู้ร่วมรบต่างยินดีปรีดา! ศัตรูของพวกเราทุกคนถูกลากมาต่อหน้า [attacker.GetName] อย่างน่าอดสู"
 mpo_greatest_of_khans.0103.desc: "ผู้คนของ[defender.GetFirstNamePossessiveNoTooltip]แตกกระจัดกระจาย ถูกพันธมิตรของ[attacker.GetTitledFirstNamePossessive]ขับไล่จากทุ่งหญ้าหนึ่งไปยังอีกทุ่งหญ้าหนึ่ง จากที่เคยเป็นภัยคุกคามอันยิ่งใหญ่เพียงหนึ่งเดียว บัดนี้เหลือเพียงเหล่าอีแร้งที่ทะเลาะวิวาทกัน"
 mpo_greatest_of_khans.0103.a: "กระนั้น ในสักวันหนึ่ง นายเหนือหัวที่แท้จริงสำหรับชนเผ่าเร่ร่อนทั้งปวงอาจถือกำเนิดขึ้น..."

 mpo_greatest_of_khans.0001.t: "คุรุลไทของข้าประกาศก้อง — เพื่อโลกทั้งใบ!"
 mpo_greatest_of_khans.0001.desc: "ในสรวงสวรรค์มีแสงสว่างอันยิ่งใหญ่มากมาย ในสรวงสวรรค์มีดวงอาทิตย์ ดวงจันทร์ และดวงดาว แต่บนผืนปฐพีนี้ สามารถมีข่านได้เพียงผู้เดียว\n\nข้า [ROOT.Char.GetFirstName] คือข่านผู้นั้น — จอมข่านผู้เกรียงไกรที่สุดในบรรดาข่านทั้งปวง\n\nภายหลังจากชัยชนะของข้าเหนืออสรพิษที่ขดตัวรอบเท้าข้า ไม่มีผู้ใดกล้ากล่าวต้านข้าในที่ประชุมคุรุลไทของทุกเผ่า เหล่าหัวหน้าเผ่าต่างยอมจำนนและให้คำสัตย์สาบานอย่างกระตือรือร้น กระหายที่จะพิชิตจักรวาล\n\nแสงแรกแห่งรุ่งอรุณทาบทาขอบฟ้า ข้าขึ้นหลังอาชา และกองทัพทั้งหมดของ [ROOT.Char.GetPrimaryTitle.GetNameNoTier] ก็โห่ร้องกึกก้อง"

 mpo_greatest_of_khans.0001.a: "ข้าจะครอบครองโลก"
 mpo_greatest_of_khans.0001.mongol_invasion_cb: "ข้าสามารถใช้เหตุแห่งสงครามการรุกรานของมองโกล[mongol_invasion_casus_belli|E]ได้"

 mpo_greatest_of_khans.0002.a: "ทุกสิ่งเป็นของ [genghis_khan.GetTitledFirstNameNoTooltip]"
 mpo_greatest_of_khans.0002.b: "มีเพียงการรวมกำลังกันเท่านั้น พวกเราเหล่าหัวหน้าเผ่าจึงจะสามารถต่อต้าน [genghis_khan.GetFirstNameNoTooltip] ได้"

 mpo_greatest_of_khans.0003.t: "นามสำหรับ[ROOT.Char.GetTitleAsNameNoTooltip]"
 mpo_greatest_of_khans.0003.desc: "ลางบอกเหตุอันทรงพลังมีมากมาย\n\nสวรรค์และปฐพี กล่าวกันว่า ยื่นมือออกมาคุ้มครองข้า ในความฝัน ในกลุ่มฝุ่นควัน วัวกระทิงใหญ่ให้คำมั่นถึงความพินาศของศัตรูข้า ม้าตัวผู้ตอนและม้าตัวเมียที่งดงาม ของขวัญแห่งกระโจมพระราชวัง... ผู้อาวุโสของเผ่าให้สัญญาเหล่านี้ ต่อเนื่องไปเรื่อยๆ...\n\nข้าต้องการสมัญญานามที่คู่ควรแก่ชะตากรรมนี้"
 mpo_greatest_of_khans.0003.a: "ข้าคือ #EMP $nick_genghis_khan$#!."
 mpo_greatest_of_khans.0003.b: "ข้าคือ #EMP $nick_cengiz_khan$#!."
 mpo_greatest_of_khans.0003.c: "#EMP $nick_yekhe_khagan$#!: มหาราชา"
 mpo_greatest_of_khans.0003.d: "#EMP $nick_dort_yonlug_khagan$#!: เจ้าแห่งสี่ทิศ"
 mpo_greatest_of_khans.0003.e: "#EMP $nick_tengri_khagan$#!: ผู้ถือกำเนิดจากสวรรค์"
 mpo_greatest_of_khans.0003.f: "#EMP $nick_xormuzta$#!: สวรรค์, โบราณ และปรีชาญาณ"
 mpo_greatest_of_khans.0003.g: "#EMP $nick_cihangir$#!: ผู้พิชิตโลก!"
 mpo_greatest_of_khans.0003.h: "#EMP $nick_mar_sargis$#!: ผู้ได้รับชี้นำจากมรณสักขีอันศักดิ์สิทธิ์!"
 mpo_greatest_of_khans.0003.i: "#EMP $nick_akhshunwar$#!: ผู้ทรงพลังอำนาจ!"
 mpo_greatest_of_khans.0003.j: "#EMP คากานแห่ง[ROOT.Char.GetCulture.GetNameNoTooltip]#!: [ROOT.Char.GetCulture.GetNameNoTooltip]ที่แท้จริงเพียงหนึ่งเดียว"
 mpo_greatest_of_khans.0003.k: "ข้าจะใช้เพียงนามของข้าเอง"

