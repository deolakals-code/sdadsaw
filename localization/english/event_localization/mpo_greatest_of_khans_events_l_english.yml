gok_slaughter.t: "การสังหารหมู่ใน [defender.GetCapitalLocation.GetNameNoTooltip]"
gok_slaughter.tooltip: "กล่าวกันว่า ท่ามกลางกองศพชาว[defender.GetPrimaryTitle.GetAdjective] มีขุนนางผู้ทรงเกียรติ #N [gok_slaughter_value]#! คน ถูกกระทำทารุณจนจำไม่ได้\n\n[defender.GetTitleAsName]ของพวกเขาได้เลือกที่จะท้าทาย[attacker.GetTitleAsName]แห่ง[attacker.GetPrimaryTitle.GetAdjective]ผู้ยิ่งใหญ่"
gok_slaughter_victim.t: "ถูกประหารโดยผู้รุกราน"
gok_destruction.t: "[defender.GetPrimaryTitle.GetBaseNameNoTierNoTooltip] ถูกทำลายล้าง"
gok_destruction.tooltip: "กองทัพอนารยชนชาว[attacker.GetPrimaryTitle.GetAdjective]บุกท่วมดินแดนของ [defender.GetTitledFirstName]! ด้วยความเดือดดาลอย่างบ้าคลั่ง พวกมันเผาทำลายที่ดินถือครอง[holdings|E] #N [destroyed_holdings]#! แห่งราบเป็นหน้ากลอง และสังหารผู้อยู่อาศัยทุกคน\n\nดังนี้คือพระพิโรธของ[attacker.GetTitleAsNamePossessive]ผู้ยิ่งใหญ่"

gok_slaughter_victim.tooltip: "[victim.GetShortUIName] ถูกจับได้ระหว่างการรุกคืบของกองทัพอนารยชนชาว[gok.GetPrimaryTitle.GetAdjective] และถูกสังหารอย่างโหดเหี้ยม"
custom.every_taken_county: "ทุกเคาน์ตี[county|E]ที่เพิ่งได้รับมาใหม่"
 mpo_gok_onslaught_victory_attacker_admin: "ท่านยึดดินแดนและบรรดาศักดิ์ทั้งหมดของ [defender.GetShortUINamePossessive]"
 mpo_gok_onslaught_victory_defender_admin: "[attacker.GetShortUIName|U] ยึดดินแดนและบรรดาศักดิ์ทั้งหมดของท่าน!"
 mpo_gok_onslaught_victory_admin: "[attacker.GetShortUIName|U] ยึดดินแดนและบรรดาศักดิ์ทั้งหมดของ [defender.GetShortUINamePossessive]"
 mpo_gok_onslaught_victory_attacker: "ท่านยึดดินแดนทั้งหมดของ [defender.GetShortUINamePossessive] เช่นเดียวกับบรรดาศักดิ์ที่เป็นของ [defender.GetHerHim] และข้าหลวงที่แข็งแกร่งกว่าของ [defender.GetHerHis]"
 mpo_gok_onslaught_victory_defender: "[attacker.GetShortUIName|U] ยึดครองบรรดาศักดิ์ทั้งหมดของท่าน เช่นเดียวกับบรรดาศักดิ์ของข้าหลวงที่แข็งแกร่งกว่าของท่าน!"
 mpo_gok_onslaught_victory: "[attacker.GetShortUIName|U] ยึดดินแดนทั้งหมดของ [defender.GetShortUINamePossessive] เช่นเดียวกับบรรดาศักดิ์ที่เป็นของ [defender.GetHerHim] และข้าหลวงที่แข็งแกร่งกว่าของ [defender.GetHerHis]"
mpo_gok_onslaught_white_peace: "[defender.GetShortUIName|U] ยังคงดำรงสถานะเป็นผู้ปกครองอิสระ โดยสูญเสียเพียงเคาน์ตีที่ถูกยึดครองเท่านั้น"
mpo_gok_onslaught_white_peace_defender: "ท่านยังคงรักษาบรรดาศักดิ์ทั้งหมดของท่านไว้ และยังคงเป็นผู้ปกครองอิสระ"
