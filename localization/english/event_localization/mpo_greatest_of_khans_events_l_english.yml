 mpo_greatest_of_khans.0050.opening: "ความตายของเจ้าถูกยับยั้งไว้ด้วยถ้อยคำเหล่านี้"
 mpo_greatest_of_khans.0050.desc: "มหา [attacker.GetTitleAsName] — [attacker.GetSheHe] ผู้มีชะตาบดขยี้ทุกอาณาจักรใต้กีบเท้าม้า [attacker.GetSheHe] ผู้เผาผลาญและปล้นสะดม — จะยอมให้เจ้ามีชีวิตอยู่ เพื่อที่เจ้าจักได้รับใช้ [attacker.GetPrimaryTitle.GetName]\n\n"
 mpo_greatest_of_khans.0050.desc_end: "ไอ้สุนัขแห่ง [defender_primary.GetNameNoTier]: เจ้าจะต้องดูแลฝูngปศุสัตว์อันไพศาลของเหล่าผู้คนแห่ง [attacker.GetTitleAsNamePossessiveNoTooltip] และขอเศษอาหารตาม แต่ [attacker.GetHerHis] พอใจ"
 mpo_greatest_of_khans.0050.desc_reorganized: "[attacker.GetTitleAsNameNoTooltip] มิปรารถนาจะฟังเสียงอันต่ำต้อยของเจ้า เจ้าจงไปตอบ [liege.GetName]"
 mpo_greatest_of_khans.0050.a: "บางทีพวกเขาอาจจะจากไปอย่างรวดเร็ว เช่นเดียวกับที่พวกเขามา..."

mpo_greatest_of_khans.0051.opening: "ถึงเหล่า [defender_primary.GetAdjective] ผู้น่าสมเพชทั้งปวง,"
mpo_greatest_of_khans.0051.desc: "มหา [attacker.GetTitleAsName] — [attacker.GetSheHe] ผู้ ซึ่งพรากทุกสิ่งไปจากผู้คนของเจ้า ผู้ ซึ่งมีเหล่านักรบท่วมท้นดินแดนของเจ้า — สั่งเจ้าดังนี้:\n\nจงหันใบหน้าที่ชุ่มน้ำตาของเจ้าไปตามลมและควบม้าไปให้ไกล บอกทุกคนที่เจ้าพบว่าโลกในไม่ช้านี้จะตกเป็นของกองทัพ [attacker.GetTitleAsNamePossessiveNoTooltip]"
mpo_greatest_of_khans.0051.a: "นายเหนือหัวของข้าล้มเหลว... ข้าจบสิ้นแล้ว"
gok_noble_army_name: "บริวาร [army_culture.GetNameNoTooltip] ผู้สูงศักดิ์"
