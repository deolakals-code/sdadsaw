mpo_gok_onslaught_defeat_defender: "$mpo_gok_onslaught_white_peace_defender$ [attacker.GetShortUIName|U] ถูกหยามเกียรติ"
mpo_gok_onslaught_defeat: "$mpo_gok_onslaught_white_peace$ [attacker.GetShortUIName|U] ถูกหยามเกียรติ"

mpo_greatest_of_khans.0020_title: "[recipient.GetTitledFirstNameNoTooltip] ยอมจำนน"
goK_war_gain_all_titles: "ได้รับ #high [vassals|E]#! และ #high [titles|E]#! ทั้งหมดของ [defender.GetShortUINamePossessive] ที่อยู่ภายใต้ระดับ [empire|E]-[title_tier|E]"
goK_war_gain_vassal_titles: "ได้รับ [titles|E] [landed|E] ส่วนใหญ่ที่ถือครองโดย [vassals|E] ระดับ [duchy|E] และ [kingdom|E]-[title_tier|E] ที่มิใช่ [administrative|E] ของ [defender.GetShortUINamePossessive]"

mpo_greatest_of_khans.0021.opening: "แด่ [actor.GetTitledFirstNameNoTooltip] ผู้ยิ่งใหญ่ ผู้รวบรวมชนชาติอาชา,"
mpo_greatest_of_khans.0021.desc_nomad: "โชคชะตาอยู่ข้างท่าน และชาว[recipient.GetDomicile.GetCulture.GetCollectiveNoun]ก็ เช่นกัน\n\nข้า [recipient.GetFirstName] ขอปฏิญาณมอบพละกำลังทั้งหมดของข้าแก่ท่าน พร้อมด้วยเหล่านักรบอาชาที่เก่งกาจที่สุดของข้า ข้าจักเป็นดังอาวุธในพระหัตถ์ขวาของท่าน"
mpo_greatest_of_khans.0021.desc: "ข้ายอมจำนน เป็นการสมควรแล้วที่ข้า และประมุขทั้งปวงของแผ่นดิน จะยำเกรงและให้เกียรติแด่ความยิ่งใหญ่และอำนาจของท่าน\n\nเงาอันน่าหวาดหวั่นของท่านทาบทับกำแพงบ้านของข้า เหนือบัลลังก์แห่ง[recipient.GetPrimaryTitle.GetNameNoTier] ท่านจะไม่มีวันขาดความภักดีและเครื่องบรรณาการจากข้า"
mpo_greatest_of_khans.0021.a: "[recipient.GetPrimaryTitle.GetBaseNameNoTierNoTooltip] จักได้รับการละเว้นจากดาบแห่งความพิโรธของข้า"
mpo_greatest_of_khans.0022.opening: "[actor.GetFirstNameNoTooltip] โอ เจ้าสุนัขพันธุ์ทางผู้ยิ่งใหญ่,"
mpo_greatest_of_khans.0022.desc_nomad: "[recipient.GetWomanMan]ผู้หนึ่ง — ซึ่งยังมีลมหายใจอยู่ใน[recipient.GetHerHim] — จะยอมให้ศัตรูมายึดแล่งธนูของ[recipient.GetHerHis]ไปหรือ? ชีวิตของ[recipient.GetHerHis]จะมีความหมายอันใดเล่า?\n\nหากข้าตายเพื่อปกป้องชาว[recipient.GetDomicile.GetCulture.GetCollectiveNoun]ของข้า พวกเขาจะฝังแล่งธนูและคันธนูของข้าไว้ข้างกระดูกของข้า แต่ถ้า #EMP เจ้า#! ตายที่นี่... เราจะหักคันธนูของเจ้า ทำให้ร่างของเจ้าเปรอะเปื้อนมูลสัตว์ เอาเนื้อของเจ้าให้สุนัขกิน"
mpo_greatest_of_khans.0022.desc: "ทูตของเจ้าเหม็นกลิ่นสาบม้า และมิได้เสนอสิ่งใดนอกจากการข่มขู่อันหยาบคายต่ออาณาจักรอันสูงศักดิ์แห่ง[recipient.GetPrimaryTitle.GetNameNoTier] ข้าสั่งประหารพวกมันแล้ว\n\nจงออกมาจากกระท่อมหนังสัตว์ในดินแดนรกร้างของเจ้าเถิด หากเจ้าปรารถนา แต่กำแพงอันแข็งแกร่งรอเจ้าอยู่ที่นี่"
mpo_greatest_of_khans.0022.a: "[recipient.GetPrimaryTitle.GetNameNoTierNoTooltip|U] จะจมกองเลือด"
 mpo_greatest_of_khans.0022.a_nomadic: "ชะตากรรมของ [recipient.GetPrimaryTitle.GetNameNoTierNoTooltip] ได้ถูกผนึกแล้ว"

mpo_greatest_of_khans.0030.t: "[ROOT.Char.GetPrimaryTitle.GetTierAsNameNoTooltip]อันเป็นนิรันดร์"
mpo_greatest_of_khans.0030.desc: "ในนครและหมู่บ้านนับพัน เหล่านักรบ [ROOT.Char.GetCulture.GetName] เดินขบวนอย่างภาคภูมิ ในพระราชวังและโถงอันยิ่งใหญ่ วาจาของขุนทหารของข้าคือกฎหมาย ทุกชนเผ่าเร่ร่อน ทุกสรรพสัตว์แห่งทุ่งหญ้าสเตปป์ ต่างรู้ซึ้งในใจว่าถูกปกครองโดยข้า และเหล่าจ้าวแห่งดินแดนที่ตั้งถิ่นฐานต่างหมอบราบคาบเท้าข้า\n\nบัดนี้เมื่อมีทั้งนักปราชญ์และขุนศึกรับใช้ตามประสงค์ของข้า ทุกสิ่งจึงสามารถถูกรังสรรค์ขึ้นใหม่ และ [ROOT.Char.GetPrimaryTitle.GetTierAsNameNoTooltip] ของข้าก็ได้รับรูปลักษณ์อันเป็นนิรันดร์..."
mpo_greatest_of_khans.0030.a: "#EMP เผา! สังหาร! ขับไล่!#! จนกว่าทุกคนจะใช้ชีวิตเยี่ยงชนเผ่าเร่ร่อน!"
mpo_greatest_of_khans.0030.a.flavor: "ชีวิตที่ตั้งรกรากนั้นต่ำต้อยกว่า มัน ทำให้ผู้คนอ่อนแอ ผู้คนส่วนใหญ่ในจักรวรรดิของข้าต้องเลือก: ทิ้งบ้านเรือนของตนและใช้ชีวิตแบบชนเผ่าเร่ร่อน... หรือตาย"
mpo_greatest_of_khans.0030.b: "รัฐระบบบริหาร เพื่อจัดระเบียบ[ROOT.Char.GetPrimaryTitle.GetTierAsNameNoTooltip]อย่างมั่นคง"
mpo_greatest_of_khans.0030.b.flavor: "จักรวรรดิระบบบริหารที่ยิ่งใหญ่ของโลกดำรงอยู่มาช้านาน และขอบเขตอำนาจก็แผ่ไพศาล"
mpo_greatest_of_khans.0030.c: "ลำดับชั้นศักดินา เพื่อปักหลักการปกครองของ[ROOT.Char.GetPrimaryTitle.GetAdjectiveNoTooltip]"
mpo_greatest_of_khans.0030.c.flavor: "พวกเราชนเผ่าเร่ร่อนมิใช่คนแปลกหน้าต่อคำสัตย์สาบาน และมีบางสิ่งที่น่าพึงพอใจในถ้อยคำแห่งเกียรติยศของระบบศักดินา..."
mpo_greatest_of_khans.0030.d: "ให้เหล่าเผ่าปกครองสิ่งที่เหล่าเผ่าได้มา"
mpo_greatest_of_khans.0030.d.flavor: "เกียรติศักดิ์ของเผ่า[ROOT.Char.GetHouse.GetName]นั้นยิ่งใหญ่ที่สุด... หากเราร่วมใจกัน และจัดระเบียบอาณาจักรของเราตามสายสัมพันธ์ญาติ"
mpo_greatest_of_khans.0030.e: "[ROOT.Char.GetPrimaryTitle.GetTierAsNameNoTooltip]ของข้ารุ่งโรจน์อยู่แล้ว"
mpo_greatest_of_khans.0030.e.flavor: "ด้วยพละกำลังเท่านั้น ประชากรของข้าจึงปกครอง ปล่อยให้เหล่าข้าแผ่นดินที่ตั้งรกรากคร่ำครวญไป กีบม้าของเราจะ ทำให้พวกมันเงียบเสียง"
gok_every_held_title_gains_castles: "เมืองหลวงทุกเคาน์ตี[county_capital|E]ในเขตปกครองโดยตรง[domain|E]ของท่านได้รับเขตถือครอง[holding|E]ปราสาท[castle|E]"
gok_some_nomad_vassals_holdings_switch: "ข้าหลวง[vassals|E]ชนเผ่าเร่ร่อน[nomadic|E]ที่เห็นชอบ #high ([switching_vassals_value])#! จะเปลี่ยนรูปแบบการปกครอง[government|E]และประเภทเขตถือครอง[holding|E]ของตนด้วย"
great_khans_capital_modifier: "บัลลังก์แห่งทุ่งหญ้าสเตปป์"
great_khans_capital_modifier_desc: "จากดินแดนใกล้ไกล พ่อค้า ทหาร นักปกครอง ผู้ย้ายถิ่นฐานต่างหลั่งไหลมา เคาน์ตีนี้กำลังได้รับการตั้งถิ่นฐานและกลายเป็นเมืองอย่างรวดเร็ว"
gok_capital_holdings_switch_tt: "ได้รับเขตถือครอง[holding|E]ปราสาท[castle|E] และหากเป็นไปได้ จะได้รับวัด[temple|E]และนคร[city|E]ด้วย"
gok_some_sedentaries_become_admin_tt: "เหล่าข้าหลวง [feudal|E] และ [clan|E] ที่เต็มใจจักเปลี่ยนเป็นฝ่าย [administrative|E]"
gok_counties_become_nomad_counties_tt: "[counties|E] ส่วนใหญ่ที่มิใช่แบบ [nomadic|E] ใน [realm|E] ของท่าน #high ([burned_to_nomadism_value])#! จักได้รับ [nomadic_holding|E] และสูญเสีย [holdings|E] อื่นๆ ทั้งหมด"
gok_new_nomad_counties_lose_development_tt: "เคาน์ตี[counties|E]เหล่านี้สูญเสียระดับ@development_icon!ความเจริญ[development|E]และ@control_icon!การควบคุม[control|E]ทั้งหมด"
gok_other_counties_lose_development_tt: "เคาน์ตี[counties|E]อื่น ๆ ทั้งหมดในอาณาจักร[realm|E]ของท่านสูญเสียระดับ@development_icon!ความเจริญ[development|E]บางส่วน"
gok_non_nomads_become_nomad_tt: "เหล่า [vassals|E] ที่มิใช่ชาว [nomadic|E] ที่เต็มใจ #high ([sedentary_to_nomad_vassals_value])#! จักกลายเป็นชาว [nomadic|E]"
gok_city_state_creation: "เหล่า [vassals|E] ที่มิใช่ชาว [nomadic|E] ที่ไม่เต็มใจ #high ([city_state_vassals_value])#! จักถูกลดระดับเหลือ [duke|E]-[title_tier|E] และท่านจักได้รับ [titles|E] ส่วนเกินของพวกเขา"
gok_time_limit_end_decision_tt: "@alert_icon! #alert_trial หากราชวงศ์[dynasty|E]ของท่านสูญเสียการควบคุม [gok_title.GetName] หรือล้มเหลวในการทำการตัดสินใจ[decision|E] #high $mpo_gok_world_conquest_decision$#! ภายในปี #high [gok_empire_crumble_date|0]#! คุณสมบัติพิเศษเหล่านี้จะสูญหายไป และ [gok_title.GetName] จะเสี่ยงต่อการล่มสลาย!#!"
gok_time_limit_end_decision_other_players_tt: "หากราชวงศ์[dynasty|E]ของ[genghis_khan.GetShortUINamePossessive]สูญเสียการควบคุม [gok_title.GetName] หรือล้มเหลวในการทำการตัดสินใจ[decision|E] #high $mpo_gok_world_conquest_decision$#! ภายในปี #high [gok_empire_crumble_date|0]#! คุณสมบัติพิเศษของพวกเขาจะสูญหายไป"

mpo_greatest_of_khans.0040.t: "ความฝันอันยิ่งใหญ่ที่เลือนลาง"
mpo_greatest_of_khans.0040.desc_timed_out: "เป็นเวลาหลายทศวรรษที่ตระกูล[ROOT.Char.GetHouse.GetName]ได้ปกครองจักรวรรดิแห่งเลือดของเรา กำแพงอันโอหังของศัตรูเราพังทลายลง กองทัพอนารยชนของเราอ้วนพีด้วยทรัพย์สินจากการปล้นสะดม จากยอดเขาที่สูงที่สุด เราได้ขับขานสรรเสริญ [ROOT.Char.GetFaith.HighGodName] และได้ยินเสียงร่ำไห้เรียกนามของเรานับแสนตอบกลับมา!\n\nแต่เราได้ปกครองมานานเกินไป คำมั่นสัญญาเรื่องการพิชิตของเราไม่สามารถสร้างแรงบันดาลใจได้อีกต่อไป เหล่าหัวหน้าเผ่าและเจ้าผู้ครองนครต่างทะเลาะกันดุจอีแร้ง และเริ่มมีเสียงตั้งคำถามต่ออาณัติของข้า..."
mpo_greatest_of_khans.0040.desc: "จักรวรรดิอันยิ่งใหญ่ของเราได้หลุดลอยไปจากเงื้อมมือของครอบครัวข้าแล้ว! เรามิอาจอ้างความโปรดปรานจากฟ้าครามเบื้องบนโดยไร้ผู้ท้าทายได้อีกต่อไป — เรามิอาจเรียกกองทัพอนารยชนเข้าสู่สงครามด้วยการตวัดแส้ได้อีกแล้ว\n\nในอีกหลายปีข้างหน้า ข้าอาจตะเกียกตะกายกลับสู่บัลลังก์อันชอบธรรมของข้าได้อีกครั้ง ดุจอาชญากรผู้ละอายที่หลุดพ้นจาก[Glossary( 'คัง', 'CANGUE_GLOSS' )]ของตน... แต่ยุคแห่งการพิชิตอันสูงส่งของเราได้สิ้นสุดลงแล้ว"
mpo_greatest_of_khans.0040.a: "กระนั้น... โลกยังคงสั่นสะท้านเมื่อได้ยินนามของข้า"
gok_no_more_special_powers: "ท่านไม่สามารถใช้ #high $mpo_offer_submission_or_ruin$ หรือ #high $mpo_gok_onslaught_cb$#! ได้อีกต่อไป"
gok_no_more_reform_decision: "ท่านไม่สามารถทำการตัดสินใจ[decision|E] #high $mpo_gok_world_conquest_decision$ ได้อีกต่อไป"
gok_guaranteed_disastrous_chaotic_succession_tt: "@warning_icon! #X การสืบทอด[succession|E] #highอันโกลาหล#! (Chaotic) ครั้งต่อไปของท่านมีแนวโน้มที่จะ ทำให้ [ROOT.Char.GetPrimaryTitle.GetName] แตกสลายอย่างแน่นอน#!"

mpo_greatest_of_khans.0041.t: "ยังคงยิ่งใหญ่ แต่ความเป็นข่านน้อยลง"
mpo_greatest_of_khans.0041.desc: "ภายในกำแพงอันวิจิตรของ [ROOT.Char.Custom('ResidenceBuilding')] ของข้า ภายใน [ROOT.Char.GetPrimaryTitle.GetTierAsNameNoTooltip|l] แห่งกฎหมาย การตั้งถิ่นฐาน และการค้าอันสันติ... ความฝันเก่าก่อนยังคงมาเยือนหรือไม่?\n\nจิตใจของข้ายังคงขับขานถึงชะตาแห่งมหาข่าน ถึงการบดขยี้ทั่วโลกหล้าใต้กีบเท้าม้าหรือไม่?\n\nอาณาจักร [ROOT.Char.GetGovernment.GetAdjective] นี้ มิได้รวมตัวเป็นหนึ่งเดียวภายใต้ธงหางม้า มิได้ถูกบรรทุกขึ้นเกวียนตามคำเรียกหาของข้า [ROOT.Char.Custom('GetFighterTermPlural')] และ [ROOT.Char.Custom('GetLocalCommonerTermPlural')] ของข้า มิได้ปรารถนาที่จะพิชิตภายใต้ผืนฟ้าสีครามอันไร้ที่สิ้นสุดร่วมกันอีกต่อไป\n\nความฝันอันยิ่งใหญ่ในการพิชิตของเรานั้นริบหรี่ลง แต่เรายังคงแข็งแกร่ง และเรายังคงมั่งคั่ง"
mpo_greatest_of_khans.0041.a: "ความสะดวกสบายนี้มิใช่ความฝันอัน #EMP แท้จริง#! ของชนเผ่าเร่ร่อนหรอกหรือ?"

