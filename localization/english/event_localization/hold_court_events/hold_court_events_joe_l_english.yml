 # # The Enemy Within
 hold_court.8190.t:0 "ศัตรูภายใน"
 hold_court.8190.desc.intro:0 "[aggressor_vassal.GetTitledFirstName] [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('aggressor_vassal'))] ของข้า แทบจะระงับความโกรธของ[aggressor_vassal.GetHerHis] ไว้ไม่อยู่ ระเบิดออกมาว่า: "ต้องทำอะไรสักอย่างกับคนนอก [other_vassal.GetCulture.GetName] นั่น!" \n\n[aggressor_vassal.GetSheHe|U] แสดงท่าทางอย่างบ้าคลั่ง, "ข้าทน [other_vassal.GetTitledFirstName] และขนบธรรมเนียมไร้สาระของ[other_vassal.GetHerHis] มามากพอแล้ว –"
 hold_court.8190.desc.ethos:0 "[other_vassal.Custom('get_hold_court_8190_ethos')]""
 hold_court.8190.desc.heritage:1 "ทุกอย่างเกี่ยวกับพวกเขาแปลกแยกต่อคุณธรรม [aggressor_vassal.GetCulture.GetHeritage.GetNameNoTooltip]!""
 hold_court.8190.desc.language:1 "และภาษา [other_vassal.GetCulture.GetLanguage.GetNameNoTooltip] ที่เรียกกันนั้นเป็นเพียงเสียงอวดดี!""
 hold_court.8190.desc.fallback:0 "ข้าหมายถึง ท่านเคยเห็นพวกป่าเถื่อนนั่น #EMP กิน?!#! อย่างไรไหม""
 hold_court.8190.desc.body:0 "\n\n"ถึงเวลาแล้วที่ข้ารับใช้ต่างชาติของท่านจะยอมรับ #EMP ขนบธรรมเนียม#! ของผู้ที่ดีกว่า!""
 hold_court.8190.a:0 "ชนชั้นสูงของเราต้องเป็นชาว [aggressor_vassal.GetCulture.GetNameNoTooltip]!"
 hold_court.8190.a.tt_accept:0 "[other_vassal.GetTitledFirstName] ตกลง"
