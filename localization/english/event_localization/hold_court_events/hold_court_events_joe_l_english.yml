 # Interest
 hold_court_8090_interest_architect:0 "\n\n"อย่ากลัวเลย การก่อสร้างอาคารที่ยิ่งใหญ่เป็นหนึ่งในความหลงใหลของข้าพเจ้า""
 hold_court_8090_interest_seneschal_administrator:0 "\n\n"โปรดวางใจ ไม่มีใครกระตือรือร้นในการจัดการกิจการของท่านมากไปกว่านี้แล้ว"
 hold_court_8090_interest_seneschal_eunuch:0 "\n\n"ไม่มีสิ่งใดมารบกวนข้าพเจ้าจากการจัดการกิจการของท่าน ข้ารับรอง""
 hold_court_8090_interest_almoner:0 "\n\n"เพียงแค่แบ่งปันของขวัญทางโลกของเราเท่านั้นที่เราจะสามารถจัดการกับความสมดุลของความชั่วร้ายในโลกได้...""
 hold_court_8090_interest_physician_experience:0 "\n\n"ท่านสามารถไว้วางใจได้ว่าข้าพเจ้าได้รักษาอาการเจ็บป่วยและบาดแผลมามากมาย — ข้าพเจ้าไม่ใช่หมอเถื่อนธรรมดา""
 hold_court_8090_interest_physician_mystic:0 "\n\n"การรักษาสุขภาพต้องอาศัยการสื่อสารกับพลังที่เหนือกว่าโลกียวิสัย ให้ข้าพเจ้าแสดงให้ท่านเห็น...""
 hold_court_8090_interest_physician_herbalist:0 "\n\n"ความรู้ของข้าพเจ้าเกี่ยวกับยาอายุวัฒนะและยาหม่องเป็นที่ยอมรับอย่างดี ให้ข้าพเจ้าได้แบ่งปันความรู้และความสามารถของข้าพเจ้า""
 hold_court_8090_interest_antiquarian:0 "\n\n"ข้าพเจ้ามีความสนใจในประวัติศาสตร์เป็นอย่างยิ่ง และจะดูแลรักษามรดกแห่งสมบัติของท่าน""
 hold_court_8090_interest_horse:0 "\n\n"อย่ากลัวไปเลย แม้ แต่อาการขาเป๋เพียงเล็กน้อยของม้าศึกตัวโปรดของท่านก็จะไม่รอดพ้นสายตาข้าพเจ้า!""
 hold_court_8090_interest_bodyguard_soulmate:0 "\n\nดวงตาของ[ROOT.Char.GetHerHis] เผยให้เห็นความรุนแรงของอารมณ์ที่ ทำให้หัวใจข้าหวั่นไหว..."
 hold_court_8090_interest_bodyguard_lover:0 "\n\nยากที่จะไม่เป็นลมภายใต้สายตาอันเร่าร้อนของ[ROOT.Char.GetHerHis]..."
 hold_court_8090_interest_bodyguard_bestie:0 "\n\nหากมีใครที่ข้าสามารถไว้วางใจในงานนี้ได้ ก็คือ [ROOT.Char.GetFirstNameNoTooltip]..."
 hold_court_8090_interest_bodyguard_friend:0 "\n\nพันธมิตรที่ใกล้ชิด เช่นนี้จะรับใช้ข้าได้ดีและเป็นเพื่อนข้า..."
 hold_court_8090_interest_champion:2 "\n\n"โปรดวางใจ ทักษะดาบของข้าเป็นที่รู้จักไปทั่ว [ROOT.Char.GetLiege.GetPrimaryTitle.GetTierAsNameNoTooltip]""
 hold_court_8090_interest_hunt:3 "\n\n"ข้าไม่เพลิดเพลินสิ่งใดมากไปกว่าการละเล่นที่ดี — เป็นที่รู้จักกันดีทั่ว [ROOT.Char.GetLiege.GetPrimaryTitle.GetTierAsNameNoTooltip]""
 hold_court_8090_interest_poet:0 "\n\n"ข้าพเจ้าเป็นนักขับลำนำที่มีชื่อเสียง ท้องพระโรงของท่านจะก้องกังวานไปด้วยเรื่องราวความโดดเด่นของท่าน!""
 hold_court_8090_interest_musician_gregarious:0 "\n\n"เชื่อข้าเถิด ข้าจะ ทำให้งานเลี้ยงของท่านน่าจดจำยิ่งขึ้นไปอีก!""
 hold_court_8090_interest_musician_culture:0 "\n\n"ชาว [ROOT.Char.GetCulture.GetNameNoTooltip] มี มากมาย ที่จะสอนผู้คนของท่านเกี่ยวกับศิลปะอันไพเราะ""
 hold_court_8090_interest_cupbearer:2 "\n\n"อย่ากังวลไปเลยฝ่าบาท เหยือกของท่านจะเต็มเสมอในการดูแลของข้า!""
 hold_court_8090_interest_lady_lover:0 "\n\nแม่สาวเจ้าเล่ห์ขยิบตาให้ข้า และข้าแทบจะอดหน้าแดงไม่ได้เมื่อนึกถึงโอกาสที่สิ่งนี้จะมอบให้เรา..."
 hold_court_8090_interest_lady_soulmate:0 "\n\nไม่มีใครที่ข้าอยากให้อยู่เคียงข้างมากไปกว่านี้แล้ว..."
 hold_court_8090_interest_lady_bestie:0 "\n\nดูเหมือนว่าข้าไม่จำเป็นต้องห่างจากเพื่อนสนิทที่สุดของข้าเลย!"
 hold_court_8090_interest_lady_friend:0 "\n\nการมีเพื่อนที่น่ายินดี เช่นนี้น่าจะช่วยคลายความน่าเบื่อของชีวิตในราชสำนักได้..."
 hold_court_8090_interest_eunuch:0 "\n\n"เชื่อข้าเถิด ข้าจะไม่มีสิ่งใดมารบกวนการทำงานของข้า""
 hold_court_8090_interest_gardener:0 "\n\n"ข้ามีความรักในพืชอย่างยิ่ง การเรียนรู้ประโยชน์ของพวกมันและ ทำให้พวกมันมีความสุข!""
 hold_court_8090_interest_artificer:0 "\n\n"ผลงานของข้าเป็นหนึ่งในผลงานที่ได้รับการยกย่องมากที่สุดใน [ROOT.Char.GetLiege.GetPrimaryTitle.GetTierAsNameNoTooltip]""
 hold_court_8090_interest_emissary:0 "\n\n"ประวัติของข้าในการเจรจาต่อรองและการประนีประนอมเป็นที่ยอมรับอย่างดี""
 hold_court_8090_interest_qadi:0 "\n\n"ท่านไม่ต้องกังวล เพราะข้ามีความรู้ในเรื่องที่เกี่ยวข้องทั้งหมดเป็นอย่างดี""
 hold_court_8090_interest_garuda:0 "\n\n"ข้าเชื่อว่าชื่อเสียงของข้าในฐานะนักประลองคงไม่รอดพ้นสายตาท่านไปได้""
 hold_court_8090_interest_keeper_of_swans:0 "\n\n"ข้ามีประสบการณ์มากมายกับนกที่ใช้ล่า ข้าเป็นตัวเลือกที่ชัดเจน""
 hold_court_8090_interest_friend:0 "\n\nโอ้ แต่ข้าจะปฏิเสธเพื่อน เช่น [ROOT.Char.GetFirstNameNoTooltip] ได้อย่างไร?"
 hold_court_8090_interest_bestie:0 "\n\n[ROOT.Char.GetFirstNameNoTooltip] เป็นเพื่อนที่ดีและซื่อสัตย์ต่อข้า..."
 hold_court_8090_interest_lover:0 "\n\nยากที่จะต้านทานโอกาสที่จะได้อยู่ใกล้ชิด [ROOT.Char.GetFirstNameNoTooltip]..."
 hold_court_8090_interest_soulmate:0 "\n\nข้าพบว่ายากที่จะปฏิเสธ [ROOT.Char.GetFirstNameNoTooltip] สิ่งใด แม้ในยามที่ดีที่สุด..."
 hold_court_8090_interest_other:0 "\n\nบางที [vassal.GetSheHe] #EMP อาจจะ#! เหมาะสมกว่า..."
 hold_court_8090_interest_fallback:0 "\n\nข้าคิดว่างานเหล่านี้ต้องมี #EMP ใครสักคน#! ทำ..."
