 hold_court.8210.c.none:0 "เจ้าไม่มีสิทธิ์อ้าง [aggressor_vassal.Custom2('InsultNoun', ROOT.Char)]"
 hold_court.8210.c.other:0 "สิทธิ์เรียกร้องของ [defender_vassal.GetFirstNamePossessiveNoTooltip] นั้นชอบธรรมกว่า"
 hold_court.8210.c.self:0 "สิทธิ์เรียกร้องของข้านั้นชอบธรรมกว่า"
 hold_court.8210.d:0 "ข้าไม่ยุ่งเกี่ยวกับเรื่อง เช่นนี้"
