 hold_court.8080.desc.body:0 "\n\n"เราได้ ทำให้เมืองของเรา – และท่าน – เจริญรุ่งเรือง และสมควรได้รับอิทธิพลมากขึ้นเหนือ [target_county.GetNameNoTier]""
 hold_court.8080.a:0 "[target_county.GetNameNoTierNoTooltip] เป็นของท่านที่จะปกครอง"
 hold_court.8080.b:0 "สิทธิพิเศษ เช่นนี้ต้องมีเหตุผลอันสมควร"
 hold_court.8080.c:0 "ท่านขอมากเกินไป ต้องมีทางอื่นบ้างสิ"
 hold_court.8080.c.tt_success:0 "ท่านพบข้อประนีประนอม"
 hold_court.8080.c.tt_failure:0 "ท่านล้มเหลวในการหาข้อตกลง"
 hold_court.8080.d:0 "จงพอใจกับเสรีภาพในปัจจุบันของท่านเถิด [mayor.GetTitleAsNameNoTooltip]"
 hold_court.8080.e:0 "ดูเหมือนว่าพลเมืองจะลืมที่ของตนเอง"
