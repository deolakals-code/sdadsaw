 # # Cultural Pride
 hold_court.8130.t:0 "ความภาคภูมิใจในวัฒนธรรม"
 hold_court.8130.desc:0 "ชาวบ้านเชื้อสาย [peasant.GetCulture.GetName] กำลังคำนับต่อหน้าข้า บิดมือของ[peasant.GetHerHis]ไปมา \n\n"[ROOT.Char.GetTitleAsNameNoTooltip] ผู้สูงส่ง ในบ้านเกิดอันงดงามของข้าที่ [conversion_target.GetNameNoTier] พวกเรากำลังถูกกระตุ้นให้ละทิ้งขนบธรรมเนียมของเราและยอมรับวิถีทางของชาว [ROOT.Char.GetCulture.GetName]" \n\n"
 hold_court.8130.desc.same_language:1 ""ชนชาติของเราใช้ภาษาแม่ [ROOT.Char.GetCulture.GetLanguage.GetNameNoTooltip] อันงดงามร่วมกันอยู่แล้ว - โปรดให้เรารักษาธรรมเนียมปฏิบัติท้องถิ่นของเราและยังคงซื่อสัตย์ต่อบรรพบุรุษของเรา""
 hold_court.8130.desc.same_heritage:1 ""ชนชาติของเรามี มากมาย ร่วมกันอยู่แล้ว ในประเพณี [ROOT.Char.GetCulture.GetHeritage.GetNameNoTooltip] แต่ธรรมเนียมปฏิบัติท้องถิ่นของเราเป็นที่รักยิ่ง โปรดให้เรายังคงซื่อสัตย์ต่อบรรพบุรุษของเรา""
 hold_court.8130.desc.same_ethos:1 ""ชนชาติของเราใกล้ชิดกันอยู่แล้ว เราก็เป็นชนชาติ [ROOT.Char.GetCulture.GetEthos.GetNameNoTooltip|l] เช่นกัน โปรดให้เรารักษาประเพณีของเรา และอยู่ร่วมกันอย่างสันติ""
 hold_court.8130.desc.other:1 ""ขนบธรรมเนียม [ROOT.Char.GetCulture.GetHeritage.GetNameNoTooltip] แปลกแยกสำหรับเรา และเราปรารถนาที่จะดำเนินธรรมเนียมปฏิบัติของบรรพบุรุษต่อไปอย่างสันติ โปรดปล่อยเราไว้ตามลำพังเถิด ข้า แต่[ROOT.Char.GetLadyLord]""
 hold_court.8130.a:0 "ความภาคภูมิใจ เช่นนี้น่ายกย่อง"
 hold_court.8130.a.tt_conversion:1 "เคาน์ตี[peasant.GetCulture.GetName] ไม่สามารถผนวกรวมได้เป็นเวลา 15 ปี"
 hold_court_8130_conversion_tt:0 "วัฒนธรรมนี้เป็นที่ยอมรับได้โดยท่าน"
 hold_court.8130.b:0 "ชนชาติของเราสามารถอยู่ร่วมกันได้"
 hold_court.8130.c:0 "[conversion_target.GetNameNoTierNoTooltip] ต้องได้รับสิทธิพิเศษนี้"
 hold_court.8130.c.tt_service:0 "[knight|E] ชาว [peasant.GetCulture.GetName] เข้าร่วม [court|E] ของท่าน"
 hold_court.8130.c.tt_service_title:0 "[peasant.Custom('MountedWarriorTerm')|U] [conversion_target.GetAdjectiveNoTooltip]"
 hold_court.8130.d:0 "เจ้าจะเป็นตัวอย่างแก่ชนชาติที่ล้าหลังทั้งปวง"
 hold_court.8130.e:0 "ชาว [peasant.GetCulture.GetNameNoTooltip] จะปรับตัวได้"
