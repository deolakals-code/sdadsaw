 court_position_desc_musician:0 "การให้ความบันเทิงแก่พระกรรณและจัดการความเพลิดเพลิน"
 court_position_desc_cupbearer:0 "การรินเครื่องดื่มและรับรองความปลอดภัย"
 court_position_desc_lady:0 "การรับใช้ส่วนพระองค์ในฐานะสหายผู้ซื่อสัตย์"
