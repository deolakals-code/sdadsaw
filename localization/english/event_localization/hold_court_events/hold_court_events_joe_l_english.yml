 # # The Consecration of Province
 hold_court.8061.t:0 "การอุทิศ [target_province.GetNameNoTooltip] "
 hold_court.8061.desc.bishop:0 "[bishop.GetCouncilTitleFirstName] เข้ามาในโถงของท่านอย่างตื่นเต้น "[ROOT.Char.Custom('FormOfAddressForLiege')|U] ข้านำข่าวการเสร็จสิ้นของ [ROOT.Char.GetFaith.HouseOfWorship|U] แห่งใหม่ของ [target_province.GetTitle.GetNameNoTierPossessive] มาแจ้ง!" \n\n"
 hold_court.8061.desc.fallback:0 "[ROOT.Char.GetFaith.HouseOfWorship] ที่ข้าได้มอบหมายให้สร้างเพื่อผู้คนแห่ง [target_province.GetTitle.GetNameNoTier] บัดนี้เสร็จสมบูรณ์แล้วหลังจากทำงานอย่างหนัก"\n\n"
 hold_court.8061.desc.owned:0 ""ผู้ศรัทธาแห่ง [target_county.GetNameNoTier]"
 hold_court.8061.desc.vassal:0 ""ข้าราชบริพารของ [vassal.GetTitledFirstNamePossessive] ใน [target_county.GetNameNoTier]""
 hold_court.8061.desc.existing:0 "ยินดีในความศรัทธาในผลงานของท่าน และเกียรติที่มอบแด่ [ROOT.Char.GetFaith.HighGodName]!""
