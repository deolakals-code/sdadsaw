 # # Serious Business
 hold_court.8110.t:0 "ธุระสำคัญ"
 hold_court.8110.desc:0 "ชาวนาท่าทางน่ากลัวเดินเข้ามาใกล้เกินไปก่อนที่ทหารยามจะก้าวมาขวาง "โอ้!" [peasant.GetSheHe] ถอยออกไปพร้อมกับขยิบตา หัวเราะร่าทั้งที่ฟันแทบไม่เหลือ\n\n"[ROOT.Char.Custom('FormOfAddressForLiege')] ข้ามาจาก [peasant_holding.GetNameNoTooltip] พร้อมเรื่องสำคัญยิ่ง!" คิ้ว [peasant.GetHerHis|U] ขยับขึ้นลง\n\n"คืออย่างนี้นะ [ROOT.Char.Custom('FormOfAddressForLiege')]"
 hold_court.8110.desc.affair:1 "ไอ้ [dummy_male.Custom2('dummy_peasant_profession', ROOT.Char)] ของพวกเราน่ะ มันไปกุ๊กกิ๊กกับญาติของน้องสาวอี [dummy_female.Custom2('dummy_peasant_profession', ROOT.Char)] แล้วทั้งหมู่บ้านก็วุ่นวายไปหมด! เป็นมาตั้งแต่เจ็ดเดือนก่อน! หรือแปดเดือนหว่า...?" [peasant.GetSheHe|U] ลูบคางของ[peasant.GetHerHis]"
 hold_court.8110.desc.fence:1 "สมัยปู่ข้าน่ะ ไอ้ [dummy_male.Custom2('dummy_peasant_profession', ROOT.Char)] มันสร้างรั้วกั้นทุ่งนาของพ่ออี [dummy_female.Custom2('dummy_peasant_profession', ROOT.Char)] แต่ตอนนี้มันพังหมดแล้ว แล้วไอ้หลานชายมันก็ไม่อยากจะยุ่งอะไรด้วยเลย!""
 hold_court.8110.desc.goat:1 "เรื่องมันเริ่มตั้งแต่ฤดูเก็บเกี่ยวที่แล้ว แพะของไอ้ [dummy_male.Custom2('dummy_peasant_profession', ROOT.Char)|U] มันหลงเข้าไปในกระท่อมหลานสาวอี [dummy_female.Custom2('dummy_peasant_profession', ROOT.Char)] แล้วก็ทำเละเทะไปหมดเลยขอรับ!" [peasant.GetSheHe|U] ตบต้นขาของ[peasant.GetHerHis] "โอ้ ท่านน่าจะได้เห็นนะขอรับ ใต้ฝ่าละอองธุลีพระบาท!""
 hold_court.8110.desc.veg:1 "แม่หมูของอี [dummy_female.Custom2('dummy_peasant_profession', ROOT.Char)] มันลอดรั้วไปคืนนึง แล้วม-มัน... มันดันเข้าไปในแปลงผักของตา [dummy_male.Custom2('dummy_peasant_profession', ROOT.Char)]! ของรักของหวงแกเลยนะ!" น้ำตาแห่งเสียงหัวเราะไหลอาบใบหน้าชาวบ้านที่ตัวสั่นเทา"
 hold_court.8110.desc.drink:1 "น้องสาวอี [dummy_female.Custom2('dummy_peasant_profession', ROOT.Char)] สาบานว่านางทำ [ROOT.Char.Custom('RegionalDrink')] ได้ดีกว่าเมียไอ้ [dummy_male.Custom2('dummy_peasant_profession', ROOT.Char)] แล้วแน่นอนว่าตัดสินให้เสมอกัน แล้วพวกผัวๆ ก็เข้ามาเกี่ยวด้วย!""
 hold_court.8110.a:0 "จริงรึ? เล่าต่อสิ"
 hold_court.8110.b:0 "[steward.GetCouncilTitleFirstNameNoTooltip] ไปจัดการซะ ได้โปรด"
 hold_court.8110.c:0 "หัวเราะเยาะ #EMP ข้ารึ?!#! เอาไปแขวนคอ!"
 hold_court.8110.d:0 "เจ้ามันโง่ ตัวตลก #EMP ของข้า#!."
 hold_court.8110.e:0 "อะไรนะ? [peasant.GetWomanMan] คนนี้เข้ามาได้อย่างไร? มีใครอยู่ไหม?"
