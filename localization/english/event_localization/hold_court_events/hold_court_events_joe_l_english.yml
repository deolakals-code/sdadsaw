 hold_court.8200.a.tt.vassals:0 "ข้าหลวงทุกคนที่ไม่ใช่ [THIS.Char.GetFaith.GetAdjective]"
 hold_court.8200.a.tt.convert:1 "ทุกเคาน์ตี [infidel_vassal.GetFaith.GetAdjective] ใน [THIS.Char.GetPrimaryTitle.GetBaseNameNoTier] ([SCOPE.ScriptValue('court_8200_county_value')|0X]) จะเปลี่ยนศาสนาได้ยากขึ้น"
 hold_court.8200.c:0 "ด้วยนามแห่ง [infidel_vassal.GetFaith.HighGodName] บัดนี้ข้าเห็นความจริงแล้ว!"
 hold_court.8200.c.tt.vassals:0 "ข้าหลวง [infidel_vassal.GetFaith.GetAdjective] ทุกคน"
 hold_court.8200.d:0 "ข้าตัดสิน [infidel_vassal.GetWomanMan] จากคุณภาพของพวกเขา ไม่ใช่ความเชื่อ"
 hold_court.8200.e:0 "ทุกศรัทธาเป็นที่ต้อนรับใน [ROOT.Char.GetPrimaryTitle.GetTierAsNameNoTooltip] ของข้า"
