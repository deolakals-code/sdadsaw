 # # Puppy Patronage
 hold_court.8140.t:0 "การอุปถัมภ์ลูกสุนัข"
 hold_court.8140.desc:1 "นายพรานหลวง [huntmaster.GetTitledFirstName] ของข้าเข้ามาอย่างระมัดระวัง ประคองห่อผ้าขนสัตว์ไว้ \n\nด้วยรอยยิ้ม [huntmaster.GetSheHe] ดึงผ้าห่อตัวออก เผยให้เห็นดวงตาหยีคู่หนึ่งเหนือลิ้นที่ห้อยออกมา – ลูกสุนัข! [huntmaster.GetSheHe|U] แทบจะอุ้มเจ้าก้อนขนที่ตื่นเต้นนี้ไว้ในอ้อมแขนของ[huntmaster.GetHerHis] ไม่ไหว \n\n"ของขวัญจากครอก [ROOT.Char.Custom('get_region_dog_type')] ที่ดีที่สุดที่ข้าเคยเห็นมาในระยะหนึ่ง!" [huntmaster.GetSheHe] พูดระหว่างที่ถูกเลียหน้า "ท่านต้องใช้ประโยชน์และขยายคอกสุนัขของท่านนะขอรับ [ROOT.Char.GetLadyLord]!""
 hold_court.8140.a:0 "คอกสุนัขของเราจะไม่มีคู่แข่ง!"
 hold_court.8140.a.tt:0 "สมาชิกทุกคนจะสามารถทำการตัดสินใจ รับเลี้ยงลูกสุนัข [decision|E] ได้"
 hold_court.8140.b:0 "ใครเป็นหมาดี? เจ้าไง!"
 hold_court.8140.c:0 "แมวเป็นเพื่อนที่ดีกว่า"
 hold_court.8140.d:0 "ท่านกำลัง ทำให้ผู้ร้องทุกข์ที่จริงจังต้องล่าช้า [huntmaster.GetFirstNameNoTooltip]"
 # Puppy Patronage ping
 hold_court.8141.desc:0 "[pup_house_ruler.GetTitledFirstNameRegnal] [ROOT.Char.Custom2('RelationToMeShort' , SCOPE.sC('pup_house_ruler'))] ของข้า ได้ขยายคอกสุนัขหลวงของ[pup_house_ruler.GetHerHis] ภายใต้การดูแลของนายพรานหลวง [huntmaster.GetTitledFirstNameRegnal] ของ[pup_house_ruler.GetHerHis] \n\n[pup_house_ruler.GetSheHe|U] ได้เชิญญาติพี่น้องทั้งหมดของ[pup_house_ruler.GetHerHis] ให้ร่วมแบ่งปันผลของความพยายามนี้!"
 hold_court.8141.a:0 "ลูกหมาเหรอ?"
 # Puppy Patronage decision event
 hold_court.8142.t:0 "$hold_court.8140.t$: สหายใหม่"
 hold_court.8142.desc:0 "คนรับใช้ของข้านำลูกสุนัข [ROOT.Char.Custom('get_region_dog_type')] แรกเกิดมาให้ข้า สดใหม่จากคอกสุนัข [ROOT.Char.GetHouse.GetNameNoTooltip] อันโด่งดังที่ก่อตั้งโดย [pup_house_ruler.GetTitledFirstNameRegnal] [ROOT.Char.Custom2('RelationToMeShort' , SCOPE.sC('pup_house_ruler'))] ของข้า \n\nจมูกเล็กๆ โผล่ออกมาจากผ้าห่ม ดมกลิ่นอย่างสงสัยเกี่ยวกับกลิ่นของบ้านใหม่!"
 hold_court.8142.desc_alternative: "คนรับใช้ของข้านำลูกสุนัข [ROOT.Char.Custom('get_region_dog_type')] แรกเกิดมาให้ข้า สดใหม่จากคอกสุนัขของข้าเอง \n\nจมูกเล็กๆ โผล่ออกมาจากผ้าห่ม ดมกลิ่นอย่างสงสัยเกี่ยวกับกลิ่นของบ้านใหม่!"
 hold_court.8142.a:0 "เจ้าจะรับใช้ข้าได้ดี เจ้าตัวเล็ก!"
 hold_court.8142.b:0 "ข้าเปลี่ยนใจแล้ว"
