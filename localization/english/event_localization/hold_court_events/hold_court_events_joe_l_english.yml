 hold_court.8210.t:0 "ดินแดนอันชอบธรรม"
 hold_court.8210.desc.intro:0 "[aggressor_vassal.GetTitledFirstName] ผู้ไม่พอใจอย่างเห็นได้ชัด รีบรุดมายังบัลลังก์ของท่าน... \n\n"[aggressor_vassal.Custom2('RelationToMeShort', ROOT.Char)|U], "
 hold_court.8210.desc.de_jure:0 "สิทธิ์ตามกฎหมายของข้าเหนือ [vassal_claim.GetName] นั้นเป็นที่รับรองอย่างดี ดินแดนเหล่านั้นถือเป็นส่วนหนึ่งของ [vassal_claim.GetDeJureLiege.GetName] มาช้านานแล้ว""
 hold_court.8210.desc.strong:0 "สิทธิ์อันชอบด้วยกฎหมายของข้าต่อ [vassal_claim.GetName] นั้นปราศจากข้อสงสัย เป็นที่ยอมรับทั้งจากราชมัคคุเทศก์ของท่านเองและเหล่า [ROOT.Char.GetFaith.GetAdjectiveNoTooltip] [ROOT.Char.GetFaith.AltPriestTermPlural]""
 hold_court.8210.desc.weak:0 "ข้ามีสิทธิ์ใน [vassal_claim.GetName] ไม่ว่าใครจะว่า อย่างไรก็ตาม!"
 hold_court.8210.desc.other:0 "\n\n"ท่านจะสนับสนุนสิทธิ์เรียกร้องของข้า และให้ [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('defender_vassal'))] ของท่าน [defender_vassal.GetTitledFirstName] สละสิ่งที่มิใช่ของ [defender_vassal.GetHerHim] หรือไม่?""
 hold_court.8210.desc.self:0 "\n\n"ท่านจะสละสิ่งที่มิใช่ของท่าน เพื่อสนับสนุนสิทธิ์เรียกร้องของข้าหรือไม่?""
 hold_court.8210.a:0 "ความอยุติธรรมนี้ต้องสิ้นสุดลง ณ บัดนี้"
