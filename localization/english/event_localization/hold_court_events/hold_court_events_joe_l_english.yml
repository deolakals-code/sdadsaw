 hold_court.8100.desc.court:0 "ของท่าน"
 hold_court.8100.desc.body:0 "ราชสำนักโดยไม่มีใครดูแล [ward.GetHerHim] ตั้งแต่การ [ward.Custom('get_hold_court_8100_situation')] ของ [ward.Custom('get_hold_court_8100_parent')] ที่รักของ[ward.GetHerHis] – โปรดดูแลอนาคตของ[ward.GetHerHis] ด้วยเถิด" \n\n"
 hold_court.8100.desc.interest_family:0 "อย่างไรเสีย [ward.GetSheHe|U] ก็เป็นสายเลือดของข้าเอง..."
 hold_court.8100.desc.interest_marriage:0 "เด็กคนนี้อาจจะเหมาะสมกับลูกของข้าคนใดคนหนึ่ง..."
 hold_court.8100.desc.interest_alliance:0 "บางที [ward.GetSheHe] อาจจะเป็นพันธมิตรที่มีประโยชน์เมื่อพวกเขาโตเต็มที่..."
 hold_court.8100.desc.interest_fallback:0 "จะทำอย่างไรกับเด็ก เช่นนี้ได้?"
 hold_court.8100.a:0 "อย่ากลัวไปเลย ข้าจะเลี้ยงดู [ward.Custom('GirlBoy')] คนนี้ด้วยตัวเอง"
 hold_court.8100.b:0 "ข้ามีงานล้นมือ แต่ข้าจะหาบ้านให้ [ward.GetHerHim]"
 hold_court.8100.c:0 "[ward.GetFirstNameNoTooltip] จักได้เป็นชาว [ROOT.Char.GetDynastyHouseNameNoTooltip]!"
 hold_court.8100.c.tt_child:0 "เด็กทุกคน"
 hold_court.8100.d:0 "การเลี้ยงเด็กไม่ใช่เรื่องถูก..."
