 hold_court.8080.desc.intro:0 "[mayor.GetTitledFirstName] ก้าวออกมา ดำเนินการด้วยความระมัดระวังอย่างเห็นได้ชัด \n\n"ใต้ฝ่าพระบาท [mayor.GetPrimaryTitle.GetTierAsNameNoTooltip] แห่ง [mayor.GetPrimaryTitle.GetNameNoTier] ของข้าพเจ้าร่ำรวยขึ้นจากการติดต่อค้าขายของพลเมืองของเรากับ"
 hold_court.8080.desc.body_sea:0 "เรือค้าขายที่แล่นไปตามท่าเรือต่างๆ ตลอดแนวชายฝั่งของ[ROOT.Char.GetPrimaryTitle.GetNameNoTierPossessiveNoTooltip]""
