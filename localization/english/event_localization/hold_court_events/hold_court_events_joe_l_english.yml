 hold_court_8190_bellicose:0 "เริ่มการต่อสู้ทุกครั้งที่มีโอกาส ไอ้พวกป่าเถื่อน!"
 hold_court_8190_stoic:0 "'อย่างสูงส่ง' รับทุกอย่างไว้เอง! โอ้ #EMP ได้โปรดเถอะ!#!"
 hold_court_8190_bureaucratic:0 "ไม่เคารพวิธีการที่พิสูจน์แล้วของบรรพบุรุษ"
 hold_court_8190_spiritual:0 "#EMP หมกมุ่นเหลือเกิน#! กับการเอาใจ [ROOT.Char.GetFaith.HighGodName] และ [ROOT.Char.GetFaith.AltPriestTermPlural] ของพวกเขา"
