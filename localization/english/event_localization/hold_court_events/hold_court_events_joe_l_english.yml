 hold_court_8120_tax_modifier_desc:0 "มีการเรียกเก็บทศางค์พิเศษจากพวกนอกรีตที่อาศัยอยู่ที่นี่"
 hold_court_8120_terror_modifier:0 "ความคลั่งไคล้ในศาสนา"
 hold_court_8120_terror_modifier_desc:0 "ความแข็งแกร่งในความเชื่อของตัวละครนี้แทบไม่เหลือที่ว่างให้สงสัย"
