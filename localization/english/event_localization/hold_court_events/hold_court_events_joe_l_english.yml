 hold_court.8100.t:0 "เด็กในราชสำนัก"
 hold_court.8100.desc.intro:1 "ข้ากำลังเผชิญหน้ากับดวงตาอันเศร้าสร้อยของ [ward.GetFullNameNicknamedPossessive] ซึ่งดูน่าสงสารมากขึ้นเรื่อยๆ ขณะที่ [ward.Custom2('RelationToMeShort', SCOPE.sC('advocate'))] [advocate.GetTitledFirstName] ของ [ward.GetHerHis] ค่อยๆ นำ [ward.GetHerHim] มายังบัลลังก์ของข้า \n\n"[ROOT.Char.Custom('FormOfAddressForLiege')]" [advocate.GetSheHe] คร่ำครวญ "[ward.Custom('GirlBoy')] ผู้นี้อยู่ที่"
