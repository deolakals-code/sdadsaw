 hold_court.8090.desc.ambitious:2 "— ความรับผิดชอบที่คู่ควรกับความสามารถของข้า"
 hold_court.8090.desc.superior:3 "— งานที่ [old_holder.GetTitledFirstName] ทำได้ไม่สมกับตำแหน่ง"
