 hold_court.8090.desc.intro_advocate:3 "[vassal_advocate.GetTitledFirstName] [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('vassal_advocate'))] ของข้า นำ [vassal.GetWomanMan] [vassal.Custom('GetYoungMiddleAgedOld')] คนหนึ่งมาต่อหน้าข้าราชบริพารที่มาชุมนุมกัน \n\n"[ROOT.Char.GetTitleAsNameNoTooltip] ผู้รุ่งโรจน์ โปรดให้เกียรติ [vassal.GetTitledFirstName] [vassal_advocate.Custom2('RelationToMeShort', SCOPE.sC('vassal'))] [vassal_advocate.Custom('ComplimentAdjective')] ของข้า ด้วย [vassal.Custom('GetTargetCourtPositionDesc')]"
