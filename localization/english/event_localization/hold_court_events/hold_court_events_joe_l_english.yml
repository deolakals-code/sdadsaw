 hold_court.8150.d.tt_reject:0 "[target_faction.GetLeader.GetTitledFirstNameNoTooltip] โกรธเคือง"
 hold_court.8150.e:0 "เจ้ากำลังเล่นเกมอันตราย [target_faction.GetLeader.GetTitleAsNameNoTooltip]"
 # # Public Accusation
 hold_court.8160.t:0 "การกล่าวหาในที่สาธารณะ"
 hold_court.8160.desc.intro_child:0 "[concerned.GetTitledFirstName] [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('concerned'))] ของข้า นำ [victim.GetTitledFirstNameRegnal] ผู้อ่อนเยาว์มาข้างกายข้า เห็นได้ชัดว่าเต็มไปด้วยความวิตกกังวล \n\n"
 hold_court.8160.desc.intro_spouse:0 "[concerned.GetTitledFirstNameRegnal] และ [concerned.Custom2('RelationToMeShort', SCOPE.sC('victim'))] ของ[concerned.GetHerHis] เข้ามาอย่างระมัดระวัง ระแวงต่อข้าราชบริพารที่มาชุมนุมกัน \n\n"
 hold_court.8160.desc.intro_alone:0 "[victim.GetTitledFirstNameRegnal] [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('victim'))] ของข้า รีบมาข้างกายข้า ดวงตาแดงก่ำของ[victim.GetHerHis] กวาดมองไปทั่วข้าราชบริพารที่มาชุมนุมกัน \n\n"
 hold_court.8160.desc.intro_me:0 ""[ROOT.Char.Custom('FormOfAddressForLiege')|U] ข้ามั่นใจว่ามีใครบางคนใน [ROOT.Char.GetPrimaryTitle.GetTierAsNameNoTooltip] แห่งนี้กำลังปองร้ายข้า!""
 hold_court.8160.desc.intro_other:0 ""[ROOT.Char.Custom('FormOfAddressForLiege')|U] ข้ามั่นใจว่ามีใครบางคนใน [ROOT.Char.GetPrimaryTitle.GetTierAsNameNoTooltip] แห่งนี้กำลังพยายามทำร้าย [concerned.Custom2('RelationToMeShort', SCOPE.sC('victim'))] ของข้า!""
 hold_court.8160.desc.exposed:0 "ดูนี่สิ ข้ามีหลักฐานว่าเป็น [accused.GetTitledFirstName]"
 hold_court.8160.desc.suspicion:0 "ข้าไม่มีหลักฐาน แต่สงสัยว่าเป็น [accused.GetTitledFirstName]"
 hold_court.8160.desc.nemesis:2 "เจ้า [accused.Custom2('InsultNoun', SCOPE.sC('victim'))] [accused.Custom2('InsultAdjective', SCOPE.sC('victim'))] นั่นจะไม่หยุดยั้งไม่ว่าเรื่องใด แม้กระทั่งการฆาตกรรม เพื่อจบชีวิต [victim.Custom('GetVictimOrMy')]!"
 hold_court.8160.desc.rival:2 "– เจ้า [accused.Custom2('InsultNoun', SCOPE.sC('victim'))] ที่ต้องการยุติความเป็นอริส่วนตัวด้วยการฆาตกรรม [victim.Custom('GetVictimOrMy')]!""
 hold_court.8160.desc.my_claimant:2 "– [accused.GetSheHe] พยายามที่จะผลักดันการอ้างสิทธิ์ของ[accused.GetHerHis] เหนือ [relevant_title.GetName] โดยใช้[victim.Custom('GetVictimOrMy')] เป็นเครื่องสังเวย!"
 hold_court.8160.desc.their_claimant:2 "– [accused.GetSheHe] ไม่พอใจการอ้างสิทธิ์จอมปลอมต่อ [relevant_title.GetName] ของ[accused.GetHerHis] รวมถึงของ[victim.Custom('GetVictimOrMy')] ด้วย!"
 hold_court.8160.desc.joint_claimant:2 "– [accused.GetSheHe] ไม่ต้องการคู่แข่งในการอ้างสิทธิ์ของ[accused.GetHerHis] เหนือ [relevant_title.GetName] รวมถึงของ[victim.Custom('GetVictimOrMy')] ด้วย!"
 hold_court.8160.desc.their_dislike:2 "– [accused.GetSheHe] วางตัว [accused.GetHerselfHimself] เป็นศัตรูของ [victim.Custom('GetVictimOrMy')] เสมอมา!""
 hold_court.8160.desc.my_dislike:2 "– [accused.GetSheHe] ไม่พอใจที่[victim.Custom('GetVictimOrMy')] ไม่ชอบ[accused.GetHerHim] และต้องการแก้แค้น!"
 hold_court.8160.desc.intrigue:2 "– ด้วยชื่อเสียงด้านความชั่วร้ายของ[accused.GetHerHis] – กำลังมาเอาชีวิต[victim.Custom('GetVictimOrMy')]!"
 hold_court.8160.desc.fallback:1 "– แน่นอนว่าไม่มีใครอื่นที่ปรารถนาจะทำร้าย [victim.GetTitledFirstNameOrMe]!"
 hold_court.8160.desc.outro:0 "\n\n"ข้าขอร้องท่าน! จองจำ [accused.GetFirstNameNoTooltip] และหยุดความบ้าคลั่งนี้เสียที!""
 hold_court.8160.a:0 "ด้วยนามแห่ง [ROOT.Char.GetFaith.HighGodName]! ต้องหยุด [accused.GetSheHe|U] ให้ได้!"
 hold_court.8160.b.torturer:0 "เจ้าไม่อาจซ่อนความจริงจาก #EMP ข้า#!! ได้"
 hold_court.8160.b.executioner:0 "[executioner.GetFirstNameNoTooltip] จะค้นหาความจริงเอง"
 hold_court.8160.b.tt_confession:0 "[accused.GetTitledFirstNameNoTooltip] สารภาพถึงแผนการ"
 hold_court.8160.b.tt_silence:0 "[accused.GetTitledFirstNameNoTooltip] ไม่สารภาพ"
 hold_court.8160.c:0 "ข้าจะสอบสวน [accused.GetTitledFirstNameNoTooltip]"
 hold_court.8160.c.tt_success:0 "[accused.GetTitledFirstNameNoTooltip] ถูกจับได้ว่าโกหก"
 hold_court.8160.c.tt_failure:0 "[accused.GetTitledFirstNameNoTooltip] ปฏิเสธความเกี่ยวข้องใดๆ"
 hold_court.8160.d.involved:0 "ใจเย็นๆ ไม่มีอะไรต้องกังวล"
 hold_court.8160.d.proof:0 ""หลักฐาน" นี้ดูค่อนข้างบอบบาง"
 hold_court.8160.d.fallback:0 "ความมุ่งร้ายไม่ใช่ความผิดในตัวเอง [victim.GetFirstNameNoTooltip]"
