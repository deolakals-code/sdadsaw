 hold_court.8190.b:0 "มี มากมาย ที่ท่านสามารถเรียนรู้จากประเพณีอื่นได้"
 hold_court.8190.b.tt.vassals:0 "ข้าหลวงชาว [other_vassal.GetCulture.GetName] คนอื่นๆ ทุกคน"
 hold_court.8190.b.tt_success:0 "ความตึงเครียดทางวัฒนธรรมลดลง"
 hold_court.8190.b.tt_failure:0 "คำพูดซ้ำซากของท่านถูกปัดตกไป"
 hold_court.8190.c:0 "จะเป็นชาว [aggressor_vassal.GetCulture.GetNameNoTooltip] หรือไม่ก็ตาม [other_vassal.GetFirstNameNoTooltip] ก็เป็นข้าหลวงที่ภักดี"
 hold_court.8190.d:0 "[ROOT.Char.GetPrimaryTitle.GetNameNoTierNoTooltip] เป็นดินแดนของผู้คนหลากหลาย"
