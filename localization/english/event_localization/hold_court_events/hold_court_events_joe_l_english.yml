 # Modifiers
 hold_court_8120_stopped_modifier:0 "การผนวกรวมหยุดชะงัก"
 hold_court_8120_stopped_modifier_desc:0 "ตามคำร้องขอของประชาชน การเปลี่ยนศาสนาและการผนวกรวมได้ถูกละทิ้งที่นี่"
