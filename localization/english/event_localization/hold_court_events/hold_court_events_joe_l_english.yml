 # # Personal Matter
 hold_court.8161.t:0 "เรื่องส่วนตัว"
 hold_court.8161.desc.intro:0 "[ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('victim'))] ของข้า [victim.GetTitledFirstName] ก้าวออกมา โดยมี [victim.GetPrimarySpouse.GetWifeHusband] [victim.GetPrimarySpouse.GetFirstName] ของ [victim.GetHerHis] คุมมาด้วยท่าทางอารมณ์ไม่ดี \n\n[victim.GetPrimarySpouse.GetSheHe|U] โพล่งขึ้นมา "[ROOT.Char.Custom('FormOfAddressForLiege')|U] [accused.GetTitledFirstName] กำลังพยายามยั่วยวน [victim.GetWifeHusband] ของข้า – นี่คือการดูหมิ่น [victim.GetPrimarySpouse.GetFaith.HighGodName]!"
 hold_court.8161.desc.nemesis:0 "เจ้า [accused.Custom2('InsultNoun', SCOPE.sC('victim'))] [accused.Custom2('InsultAdjective', SCOPE.sC('victim'))] นั่นจะไม่หยุดยั้งเพื่อทำลายชีวิตข้า!""
 hold_court.8161.desc.rival:0 "เจ้า [accused.Custom2('InsultNoun', SCOPE.sC('victim'))] ที่น่ารังเกียจกำลังเล่นเกมความเป็นอริ [accused.GetHerHis] และหวังจะ ทำให้ข้าอับอาย!""
 hold_court.8161.desc.quarry:0 "[accused.GetSheHe|U] ปรารถนาคู่ครองที่งดงามของข้าอย่างชัดเจน และไม่สามารถควบคุม [accused.GetHerselfHimself] ได้!"
 hold_court.8161.desc.their_dislike:0 "[accused.GetSheHe|U] ไม่เคยชอบข้าเลย! ต้องเป็น [accused.GetHerHim] แน่!"
 hold_court.8161.desc.my_dislike:0 "ข้าไม่เคยชอบ [accused.GetHerHim] เลย เห็นได้ชัดว่ามีเหตุผลที่ดี!"
 hold_court.8161.desc.intrigue:0 "ทุกคนรู้ว่า [accused.GetSheHe] เป็นนักวางแผนที่น่าสังเวช ปั่นหัวและเล่นกับชีวิตผู้อื่น!"
 hold_court.8161.desc.fallback:0 "ข้านึกไม่ออกว่าจะเป็นใครอื่นได้!"
 hold_court.8161.desc.body:0 "\n\n[victim.GetFirstName] รู้สึกอับอายอย่างเห็นได้ชัดที่เรื่องนี้ถูกนำมาเปิดเผยต่อสาธารณะ และแทบไม่กล้าพา [victim.GetHerselfHimself] มาสบตาข้า"
 hold_court.8161.a.homosexual:0 "การกระทำที่อุกอาจ เช่นนี้จะไม่อดทน!"
 hold_court.8161.a.adultery:0 "ข้าจะไม่ทนต่อคนคบชู้ในราชสำนักของข้า!"
 hold_court.8161.c:0 "เราจะดูกันว่าเรื่องนี้มีมูลความจริงหรือไม่"
 hold_court.8161.d.involved:0 "ความสงสัยเหล่านี้ไม่มีมูลอย่างแน่นอน"
 hold_court.8161.d.permitted:0 "แล้วจะทำไมรึ [victim.GetPrimarySpouse.GetFaith.GetAdherentNameNoTooltip]?"
 hold_court.8161.d.fallback:0 "ไม่มีหลักฐานหรือ?"
 # # Noble Privileges
 hold_court.8180.t:0 "สิทธิพิเศษของขุนนาง"
 hold_court.8180.desc.intro:0 "[contract_lord.GetTitledFirstName] [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('contract_lord'))] ของข้า ก้าวออกมาอย่างมั่นคง เห็นได้ชัดว่ากระตือรือร้นที่จะฟังคำตอบของข้าต่อคำร้องของ[contract_lord.GetHerHis] \n\n"[contract_lord.Custom2('RelationToMeShort', ROOT.Char)] ของข้า,"
 hold_court.8180.desc.religious:0 "ท่านไม่จำเป็นต้องสงสัยในความภักดีของตระกูล [contract_lord.GetHouse.GetBaseName] เลย แต่ความสัมพันธ์ของเราจะแข็งแกร่งขึ้นหากปราศจากภัยคุกคามจากการกดขี่ข่มเหง เพราะความเชื่อของเรา""
 hold_court.8180.desc.fortification:0 "หากตระกูล [contract_lord.GetHouse.GetBaseName] จะต้องป้องกันตนเองและ [ROOT.Char.GetPrimaryTitle.GetNameNoTierNoTooltip] แล้ว [contract_lord.GetPrimaryTitle.GetNameNoTier] ต้องการการอนุญาตและการสนับสนุนเพื่อเสริมสร้างความแข็งแกร่งให้กับป้อมปราการ""
 hold_court.8180.desc.coinage:0 "การค้า[contract_lord.GetPrimaryTitle.GetAdjective] หยุดชะงัก เนื่องจากขาดสกุลเงิน ให้ตระกูล [contract_lord.GetHouse.GetBaseName] จัดตั้งโรงกษาปณ์ของเราเองโดยได้รับการอนุมัติจากราชสำนัก เพื่อประโยชน์ของ [ROOT.Char.GetPrimaryTitle.GetNameNoTierNoTooltip]""
 hold_court.8180.desc.war_declaration:0 "ตระกูล [contract_lord.GetHouse.GetBaseName] เป็นตระกูลที่รุ่งโรจน์และสูงศักดิ์ ให้ [contract_lord.GetPrimaryTitle.GetNameNoTier] ปกป้อง [ROOT.Char.GetPrimaryTitle.GetNameNoTierNoTooltip] และตนเองในการรบอีกครั้ง""
 hold_court.8180.desc.council:0 "ตระกูล [contract_lord.GetHouse.GetBaseName] เป็นหนึ่งในตระกูลที่ยิ่งใหญ่ที่สุดของ [ROOT.Char.GetPrimaryTitle.GetNameNoTierNoTooltip] คำปรึกษา[contract_lord.GetPrimaryTitle.GetAdjective] ควรได้รับการรับฟังจาก [ROOT.Char.GetTitleAsNameNoTooltip] เสมอ!""
 hold_court.8180.desc.title_revocation:0 "เป็นเรื่องน่าขุ่นเคืองสำหรับตระกูลใหญ่ เช่น [contract_lord.GetHouse.GetBaseName] ที่ต้องเผชิญกับภัยคุกคามจากการถูกเพิกถอนตำแหน่งราวกับเป็นเพียงบารอนหรือผู้เช่าที่ดิน""
 hold_court.8180.desc.scutage:0 "[contract_lord.GetPrimaryTitle.GetNameNoTier] ขาดแคลนทหารอย่างหนัก ให้ตระกูล [contract_lord.GetHouse.GetBaseName] จ่ายเงินให้ [ROOT.Char.GetTitleAsNameNoTooltip] แทนการส่งคนไปให้ [ROOT.Char.GetPrimaryTitle.GetNameNoTierNoTooltip]""
 hold_court.8180.desc.march:0 "ตระกูล [contract_lord.GetHouse.GetBaseName] สามารถรับใช้ [ROOT.Char.GetPrimaryTitle.GetNameNoTierNoTooltip] ได้ดีขึ้นหาก [contract_lord.GetPrimaryTitle.GetNameNoTier] ได้รับสถานะและการยกเว้นของเขตชายแดน (march)""
 hold_court.8180.desc.palatinate:0 "ตระกูลใหญ่ [contract_lord.GetHouse.GetBaseName] และ [contract_lord.GetPrimaryTitle.GetName] เป็นข้ารับใช้ที่ภักดีของ [ROOT.Char.GetPrimaryTitle.GetNameNoTierNoTooltip] เราสมควรได้รับการยอมรับในคุณภาพของเรามากขึ้น"
 hold_court.8180.desc.family_entrepeneurship:0 "[contract_lord.GetPrimaryTitle.GetNameNoTier] สามารถ ทำให้ตระกูล [ROOT.Char.GetDynasty.GetName] ร่ำรวยได้หากได้รับการพัฒนา เราเพียงแค่ต้องรักษากำลังคนของเราไว้สำหรับโครงการท้องถิ่นและการป้องกัน""
 hold_court.8180.desc.centralized_power:0 "[contract_lord.GetPrimaryTitle.GetNameNoTier] คร่ำครวญภายใต้การเรียกร้องภาษีของ [ROOT.Char.GetPrimaryTitle.GetNameNoTierNoTooltip] แต่มีคนเหลือเฟือ ให้เราชดเชยความไม่สมดุลนี้เพื่อประโยชน์ของทั้งสองฝ่าย"
 hold_court.8180.desc.religious_heretic:0 "\n\n"เป็นหน้าที่ของ [contract_lord.GetFaith.HighGodName] แต่เพียงผู้เดียวที่จะตัดสินว่าผู้ติดตามคนใดของ[contract_lord.GetHerHis] เป็นผู้ชอบธรรม""
 hold_court.8180.desc.religious_heathen:0 "\n\n"[contract_lord.GetFaith.HighGodName] จะปกป้องข้าและคนของข้า และอาจจะยังคงเฝ้าดูท่านด้วย""
 hold_court.8180.desc.martial_defensive:0 "\n\n"ให้เราดูแลการป้องกันอาณาจักรในนามของท่าน และด้วยเหตุนี้ทั้งสองฝ่ายจะได้รับประโยชน์จากสันติภาพ""
 hold_court.8180.desc.martial_offensive:0 "\n\n""มีเพียงดาบเท่านั้นที่สิทธิพิเศษของเราทั้งสองจะได้รับการปกป้อง – และต้องรักษาให้คมอยู่เสมอ""
 hold_court.8180.desc.stewardship:0 "\n\n"อย่าขัดขวางศักยภาพความเจริญรุ่งเรืองของข้ารับใช้ของท่าน แล้วเราทุกคนอาจร่ำรวยไปด้วยกัน!""
 hold_court.8180.desc.status:0 "\n\n"การกีดกันผู้ติดตามที่มีคุณสมบัติเหมาะสมและโดดเด่นที่สุดของท่าน มี แต่จะหว่านความแตกแยกและความไม่ไว้วางใจ""
 hold_court.8180.desc.family:0 "\n\n"ให้ขุนนางที่ได้รับการอบรมมาอย่างดีที่สุดของ [ROOT.Char.GetPrimaryTitle.GetNameNoTooltip] ได้รับประโยชน์สูงสุด"
 hold_court.8180.desc.fallback:0 "\n\n"ให้เรามั่นใจว่าเสถียรภาพของ [ROOT.Char.GetPrimaryTitle.GetTierAsNameNoTooltip] จะไม่ถูกคุกคามจากความขัดแย้งเล็กน้อย"
