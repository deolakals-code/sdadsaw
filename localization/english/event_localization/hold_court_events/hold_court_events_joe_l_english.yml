 hold_court.8061.a:0 "ขอ [ROOT.Char.GetFaith.HighGodNameAlternate] อวยพรพวกเราทุกคน!"
 # # The Growth of County
 hold_court.8070.t:0 "การเติบโตของ [target_county.GetNameNoTierNoTooltip]"
 hold_court.8070.desc.intro:0 "[steward.GetCouncilTitleFirstName] เห็นได้ชัดว่ามีแรงจูงใจจากข้อเสนออันยิ่งใหญ่บางอย่าง\n\n"[ROOT.Char.GetTitleAsNameNoTooltip] ผู้ยิ่งใหญ่! มีศักยภาพมากมายใน"
