l_english: 
 # # Stifled Commerce
 hold_court.8001.t:0 "การค้าที่หยุดชะงัก"
 hold_court.8001.desc:0 "พ่อค้าจากต่างจังหวัดก้าวออกมา เห็นได้ชัดว่ารู้สึกประหม่าไม่อยู่ในสภาพแวดล้อม [merchant.GetHerHis] ในท้องพระโรงอันหรูหราของข้า ข้ากวักมือเรียก "มานี่สิ [merchant.GetWomanMan] เราไม่มีเวลาทั้งวันหรอกนะ" \n\n"พ-พ่ะย่ะค่ะ/เพคะ ท่าน [ROOT.Char.GetLadyLord]!" [merchant.GetSheHe] พูดตะกุกตะกัก "ข้าคือ [merchant.GetFirstName] เป็นตัวแทนของพ่อค้าและเสรีชนที่ไม่พอใจแห่ง [town.GetNameNoTier] [town.GetTierAsNameNoTooltip] ที่ยิ่งใหญ่ที่สุดของ [town.GetDeJureLiege.GetNameNoTierPossessive]" \n\n"[mayor.GetFirstName] [mayor.GetTitleTierName] ของพวกเรา [mayor.Custom('get_hold_court_8001_flaw')]–พวกเราขอร้องให้แทนที่ [mayor.GetSheHe] ด้วยผู้อื่น...""
 hold_court.8001.a:0 "การเลือกตั้งของ[town.GetBaseNameNoTierPossessiveNoTooltip] จะมาถึงก่อนกำหนด"
 hold_court.8001.b:0 "ดีล่ะ #EMP เจ้า#! จักได้เป็น [mayor.GetTitleTierName] คนใหม่!"
 hold_court.8001.b.tt_success:0 "[merchant.GetFirstNameNoTooltip] จัดการ [town.GetBaseNameNoTierNoTooltip] ให้เรียบร้อย"
 hold_court.8001.b.tt_failure:0 "[merchant.GetFirstNameNoTooltip] ยิ่งแย่กว่าเดิมเสียอีก"
 hold_court.8001.c:0 "แล้ว [mayor.GetFirstNameNoTooltip] มีอะไรจะกล่าวหรือไม่?"
 hold_court.8001.c.tt_success:0 "พบหลักฐานความไร้ความสามารถของ [mayor.GetFirstNamePossessiveNoTooltip]"
 hold_court.8001.c.tt_failure:0 "การกระทำผิดของ[mayor.GetFirstNamePossessiveNoTooltip] ยังไม่ได้รับการพิสูจน์"
 hold_court.8001.d:0 "ราชสำนักจะชดเชยให้แก่พ่อค้าวาณิชของเมือง"
 hold_court.8001.e:1 "เจ้ากล้าตั้งคำถามกับ #EMP [mayor.GetTitleTierName] ของ[ROOT.Char.GetTitleTierNamePossessive]?!#!"
 # Custom
 hold_court_8001.desc_lazy:0 "ละเลยทุกหน้าที่และแทบจะไม่รักษากฎหมาย เว้นแต่จะถูกกดดัน"
 hold_court_8001.desc_greedy:0 "เรียกเก็บภาษีไร้สาระและค่าปรับอันหนักหน่วงเพื่อเข้ากระเป๋าของ[mayor.GetHerHis]เอง"
 hold_court_8001.desc_arbitrary:0 "จัดการอย่างไม่ยุติธรรม สร้างความผิดขึ้นตามอำเภอใจราวกับจะกลั่นแกล้งพวกเรา"
 hold_court_8001.desc_deceitful:0 "ค้าความลับและโกหกต่อหน้าพวกเราแม้ แต่ในเรื่องที่ง่ายที่สุด"
 hold_court_8001.desc_young:0 "ไร้ประสบการณ์เกินไปที่จะมีความเข้าใจในกฎหมายเพียงพอ"
 hold_court_8001.desc_incompetent:0 "ล้มเหลวในการเก็บบันทึกแม้ แต่ขั้นพื้นฐานที่สุด"
 hold_court_8001.desc_infirm:0 "แทบจะลุกจากเตียงของ[mayor.GetHerHis]ไม่ได้ ไม่ต้องพูดถึงการดูแลปัญหาของเมือง"
 hold_court_8001.desc_incapable:0 "ไม่ได้เอ่ยคำใดมาหลายสัปดาห์ ปล่อยให้งานของ[mayor.GetHerHis]กองท่วมหัว"
 hold_court_8001.desc_old:0 "เห็นฤดูหนาวมามากเกินไปแล้ว และกำลังสูญเสียพลังงานที่งานต้องการ"
 hold_court_8001.desc_fallback:0 "เป็นอุปสรรคต่อการค้าและผลประโยชน์ของเมือง"
 # Modifiers
 hold_court_8001_deposed_modifier:0 "การแทรกแซงกิจการเมือง"
 hold_court_8001_ignored_modifier:0 "การค้าที่หยุดชะงัก"
 hold_court_8001_compensated_modifier:0 "พ่อค้าได้รับการชดเชย"
 hold_court_8001_merchant_boon_modifier:0 "สัมผัสแห่งพ่อค้า"
 hold_court_8001_merchant_bust_modifier:0 "$hold_court_8001_merchant_boon_modifier$"
 hold_court_8001_imprisoned_modifier:0 "ตัวแทนผู้ถูกจองจำ"
 # # Frontier Lord
 hold_court.8010.t:0 "พรมแดน[neighboring_enemy.GetPrimaryTitle.GetAdjectiveNoTooltip]"
 hold_court.8010.desc:0 "[frontier_lord.GetTitledFirstName] ยืนอยู่เบื้องหน้าท่าน ใบหน้า [frontier_lord.GetHerHis] เคร่งขรึมด้วยความกังวล "[ROOT.Char.Custom('FormOfAddressForLiege')|U] ภัยคุกคามจาก [neighboring_enemy.GetPrimaryTitle.GetNameNoTier] นั้นหนักอึ้งในใจข้า" \n\n"[neighboring_enemy.GetTitledFirstName] ปรากฏอยู่ทั่วชายแดน" [frontier_lord.GetSheHe] ชี้ "ห่างจากประตูเมือง [frontier_barony.GetNameNoTierNoTooltip] และ [frontier_lord.Custom('get_hold_court_8010_stake')] เพียงไม่กี่วัน" \n\n"ท่านต้องช่วยเสริมความแข็งแกร่งให้กับดินแดนของข้า – ทหารและป้อมปราการ [frontier_lord.GetPrimaryTitle.GetAdjectiveNoTooltip] คือทั้งหมดที่ขวางกั้นระหว่าง [ROOT.Char.GetPrimaryTitle.GetNameNoTierNoTooltip] และความพินาศ!""
 hold_court.8010.a:0 "ความรับผิดชอบของท่านอาจให้เหตุผลแก่สิทธิพิเศษได้โดยแท้..."
 hold_court.8010.b:0 "ท่านพูดถูก [frontier_lord.GetPrimaryTitle.GetNameNoTierNoTooltip] ต้องได้รับการเสริมความแข็งแกร่ง"
 hold_court.8010.c:0 "#EMP ไม่กี่วันรึ?!#! เราต้องเสริมความแข็งแกร่งเมืองหลวง!"
 hold_court.8010.d:0 "ไร้สาระ [neighboring_enemy.GetPrimaryTitle.GetNameNoTierNoTooltip] ไม่ใช่ภัยคุกคาม"
 hold_court.8010.d.tt_success:0 "[frontier_lord.GetFirstNameNoTooltip] รู้สึกวางใจ"
 hold_court.8010.d.tt_failure:0 "[frontier_lord.GetFirstNameNoTooltip] ให้เหตุผลได้ดีกว่า"
 hold_court.8010.e:0 "เราทุกคนต่างแบกรับภาระความเสี่ยงของสงคราม"
 # Custom
 hold_court_8010.desc_family:0 "เตาผิงของตระกูล [ROOT.Char.GetDynastyHouseNameNoTooltip]"
 hold_court_8010.desc_republic:0 "ผู้บริสุทธิ์ภายในกำแพงเมือง"
 hold_court_8010.desc_theocratic:0 "ผู้ติดตามที่อ่อนน้อมของ [ROOT.Char.GetFaith.HighGodNamePossessive]"
 # Modifiers
 hold_court_8010_fortifications_modifier:0 "เชิงเทินชายแดน"
 hold_court_8010_vassal_modifier:0 "ภาระร่วมกัน"
 # # Sacred Claims
 hold_court.8020.t:0 "การอ้างสิทธิ์อันศักดิ์สิทธิ์"
 hold_court.8020.desc.intro:0 "[bishop.GetCouncilTitle] [bishop.GetFirstName] ก้าวไปข้างหน้าอย่างเคร่งขรึม "[ROOT.Char.Custom('FormOfAddressForLiege')|U] [ROOT.Char.Custom('get_hold_court_8020_holiness_1')]""
 hold_court.8020.desc.body_pope:0 "\n\n"สมเด็จ [pope.GetTitledFirstNameRegnal] ผู้ศักดิ์สิทธิ์ของ[pope.GetHerHis] ทรงเห็นพ้อง"
 hold_court.8020.desc.body_fallback:0 "\n\n"มีความเห็นพ้องต้องกัน"
 hold_court.8020.desc.body_1:0 "ว่า [ROOT.Char.Custom('get_hold_court_8020_holiness_2')] ควรได้รับการบริหารจัดการทั้งหมดโดย [ROOT.Char.GetFaith.AltPriestTermPlural] แทนที่จะเป็นฆราวาส""
 hold_court.8020.desc.body_personal:0 "\n\n"โปรดมอบดินแดนนี้ให้แก่"
 hold_court.8020.desc.body_vassal:0 "\n\n"[vassal.GetTitledFirstName] ต้องสละทรัพย์สินของ[owner.GetHerHis]ให้แก่"
 hold_court.8020.desc.body_2:0 "การดูแลของ [ROOT.Char.GetFaith.BishopNeuter] [candidate.GetFirstNamePossessive] เพื่อประโยชน์แห่งศรัทธาและเพื่อพระสิริของ [ROOT.Char.GetFaith.HighGodName]!""
 hold_court.8020.a:0 "[ROOT.Char.Custom('get_hold_court_8020_holiness_3')]"
 hold_court.8020.b:0 "[ROOT.Char.GetFaith.ReligiousText] กำหนดสิ่งนี้ไว้หรือ?"
 hold_court.8020.b.tt_success:0 "ท่านแสดงให้เห็นว่าไม่มีข้อกำหนดทางศาสนา"
 hold_court.8020.b.tt_failure:0 "ข้อโต้แย้งของท่านไม่น่าเชื่อถือ"
 hold_court.8020.c:0 "น่าสนใจ แต่มีเพียงท่านเท่านั้นหรือที่ได้ประโยชน์?"
 hold_court.8020.d:0 "ข้าไม่เห็นเหตุผลที่จะเปลี่ยนแปลงสิ่งใด"
 hold_court.8020.e:0 "[pope.GetTitledFirstNameNoTooltip] ย่อมอยู่เหนือการแทรกแซง เช่นนี้อย่างแน่นอน"
 # Custom
 holiness_cathedral_1:0 "ผู้แสวงบุญ [ROOT.Char.GetFaith.GetAdjectiveNoTooltip] หลั่งไหลไปยัง [ROOT.Char.Custom('GetFaithGrandTemple')] ของ [ROOT.Var('holy_site_var').Title.GetNameNoTierPossessive] เพื่อใกล้ชิดกับ [ROOT.Char.GetFaith.HighGodNameAlternate] มากขึ้น"
 holiness_holy_site_1:0 "[ROOT.Var('holy_site_var').Title.GetNameNoTierNoTooltip] เป็นศูนย์กลางสำคัญของการแสวงบุญและการสักการะของ[ROOT.Char.GetFaith.GetAdjectiveNoTooltip]"
 holiness_fallback_1:0 "ผู้ศรัทธาแห่ง [ROOT.Var('holy_site_var').Title.GetNameNoTierNoTooltip] ร่ำร้องขอการชี้นำทางศาสนาและความรอดพ้นจาก [ROOT.Var('holy_site_var').Title.GetCountyData.GetFaith.DevilName]"
 holiness_cathedral_2:0 "[ROOT.Char.GetFaith.HouseOfWorship] ที่สำคัญ เช่นนี้"
 holiness_holy_site_2:0 "สถานที่ศักดิ์สิทธิ์ เช่นนี้"
 holiness_fallback_2:0 "ส่วนใหญ่ของ [ROOT.Var('holy_site_var').Title.GetDeFactoTopLiege.GetNameNoTierNoTooltip]"
 holiness_cathedral_3:0 "[ROOT.Char.Custom('GetFaithGrandTemple')] เป็นของ [ROOT.Char.GetFaith.HighGodName]"
 holiness_holy_site_3:0 "[ROOT.Var('holy_site_var').Title.GetNameNoTierNoTooltip] ควรอยู่ในมือของ [ROOT.Char.GetFaith.PriestNeuterPlural]"
 holiness_fallback_3:0 "ข้าจะไม่ปฏิเสธ [ROOT.Char.GetFaith.PriestNeuterPlural] ของ [ROOT.Char.GetFaith.HighGodNameAlternatePossessive]"
 hold_court.8031.t:0 "[sc_victor.GetTitledFirstNameNoTooltip] ชนะการประลอง"
 hold_court.8221.imprison_alone:0 "[assassin.GetTitledFirstName] ถูกจองจำ"
 # # Special Treatment
 hold_court.8040.t:0 "การปฏิบัติเป็นพิเศษ"
 hold_court.8040.desc:0 "[infidel_vassal.GetTitledFirstName] ผู้ไม่สำนึกผิด ให้เกียรติท่านด้วยการปรากฏตัวของ[infidel_vassal.GetHerHis] \n\n[infidel_vassal.GetSheHe] เริ่มต้นอย่างตะกุกตะกัก: "ข้า แต่[ROOT.Char.GetTitleTierName] ข้าพเจ้าเป็นข้ารับใช้ที่ภักดีและเต็มใจ – โปรดให้ข้าพเจ้าได้ปฏิบัติศรัทธาของตนอย่างสงบสุขเถิด" \n\n"
 hold_court.8040.desc.intro_same_religion:0 ""พวกเรา [infidel_vassal.GetFaith.GetAdherentNamePlural] บูชา [infidel_vassal.GetFaith.CreatorName] เช่นเดียวกับที่ [ROOT.Char.GetFaith.GetAdherentNamePlural] ทำ โปรดปล่อยให้ [ROOT.Char.Custom('SisterBrother')] [ROOT.Char.GetFaith.GetReligion.GetAdjective] ของท่านได้สักการะตามที่พวกเขาพอใจ แต่ให้รวมกันต่อต้าน [ROOT.Char.Custom('GetUnbelieverNamePlural')] ผู้ชั่วร้ายที่ติดตามปิศาจจอมปลอมและปล่อยให้ [infidel_vassal.GetFaith.DevilName] ทำให้จิตใจของพวกเขาเสื่อมทราม""
 hold_court.8040.desc.intro_fallback:0 ""เหตุใดชาว [ROOT.Char.GetFaith.GetReligion.GetAdjective] และชาว [infidel_vassal.GetFaith.GetReligion.GetAdjective] จึงอยู่ร่วมกันอย่างปรองดองไม่ได้ แม้จะแยกจากกันด้วยคำสอนของ [ROOT.Char.GetFaith.HighGodName] และ [infidel_vassal.GetFaith.HighGodName] แต่ก็รวมกันเป็นหนึ่งในความศรัทธา? ให้เราปฏิบัติตาม [infidel_vassal.GetFaith.ReligiousText] ของเรา และท่านปฏิบัติตาม [ROOT.Char.GetFaith.ReligiousText] ของท่าน เคียงข้างกันไป"
 hold_court.8040.a:0 "การพิพากษา สงวนไว้สำหรับ [ROOT.Char.GetFaith.HighGodName] แต่เพียงผู้เดียว"
 hold_court.8040.b:0 "มาเถิด ให้ข้าแสดงให้ท่านเห็นถึงพระวจนะของ [ROOT.Char.GetFaith.KnowledgeGodName]"
 hold_court.8040.c.religion:0 "ถึงเวลาแล้วที่จะละทิ้ง [infidel_vassal.GetFaith.CreatorName] และคำโกหกทั้งปวงของ[infidel_vassal.GetFaith.GetReligion.GetAdjectiveNoTooltip]!"
 hold_court.8040.c.faith:0 "ท่านต้องอ่าน [ROOT.Char.GetFaith.ReligiousText] ใหม่อีกครั้ง!"
 hold_court.8040.c.tt_accept:0 "[infidel_vassal.GetTitledFirstNameNoTooltip] เปลี่ยนศรัทธา"
 hold_court.8040.c.tt_refuse:0 "[infidel_vassal.GetTitledFirstNameNoTooltip] ปฏิเสธที่จะเปลี่ยนศรัทธา"
 hold_court.8040.d:0 "ความเชื่อของท่านเป็นที่ยอมรับได้ แต่ไม่ได้รับการอนุมัติ"
 demand_conversion_tt:0 "[recipient.GetTitledFirstName] และครอบครัวใกล้ชิดของพวกเขาจะเปลี่ยนมานับถือศาสนาของท่าน"
 # # Royal Service
 hold_court.8050.t:0 "ราชการ"
 hold_court.8050.desc:0 "[vassal.Custom2('MyCharacterIntroduction', ROOT.Char)|U] เข้าเฝ้าพร้อมกับ [knight.GetWomanMan] [knight.Custom('GetYoungMiddleAgedOld')] คนหนึ่ง \n\n"[ROOT.Char.Custom('FormOfAddressForLiege')]!" [vassal.GetSheHe] กล่าว "[vassal.Custom2('RelationToMeShort', SCOPE.sC('knight'))] ของข้า [knight.GetFullName] แสวงหาเกียรติในการรับใช้ในกองทหาร [ROOT.Char.Custom('MountedWarriorTermPlural')] ของท่าน — โปรดให้โอกาส [knight.GetHerHim] พิสูจน์คุณภาพ [knight.GetHerHis] ด้วยเถิด!" \n\n"
 hold_court.8050.desc_talented:0 ""[knight.GetSheHe|U] เป็นหนึ่งในนักประลองที่มีชื่อเสียงที่สุดของ[vassal.GetTitleAsNamePossessive] อยู่แล้ว และจะนำเกียรติยศมาสู่ท่านในสนามรบอย่างมาก!" เป็นความจริง ท่านเคยได้ยินถึงทักษะของ[knight.GetHerHis]..."
 hold_court.8050.desc_suitable:0 ""[knight.GetWomanMan] ผู้นี้รู้จักวิธีใช้ [knight.Custom('SignatureWeaponArticle')] [knight.Custom('signature_weapon')] ของ[knight.GetHerHis] เป็นอย่างดี และจะไม่ ทำให้ท่านผิดหวังเมื่อถึงเวลาสำคัญ!""
 hold_court.8050.desc_passing:0 "[knight.GetFirstNameNoTooltip] ยิ้มอย่างอ่อนแรง "แม้ข้าจะเป็นเพียงนักดาบ[knight.GetWomanMan]ธรรมดา แต่ข้าหวังว่าจะได้เรียนรู้มากในการรับใช้ท่าน""
 hold_court.8050.desc_unsuitable:0 "ดึงข้าไปข้างๆ [vassal.GetFirstNameNoTooltip] พึมพำว่า "[knight.GetSheHe|U] ไม่ได้มีชื่อเสียงด้านดาบ แต่ความกระตือรือร้นของ[knight.GetHerHis] น่าจะช่วยทดแทนได้...""
 hold_court.8050.a:0 "ดีล่ะ เจ้ามารับใช้ข้าได้ [knight.GetFirstNameNoTooltip]"
 hold_court.8050.a.tt_knight:0 "[knight.GetFirstName] จะย้ายมายังราชสำนักของท่านและกลายเป็น [knight|E] \nการปลด [knight.GetHerHim] อาจ ทำให้ [vassal.GetTitledFirstName] ไม่พอใจ"
 hold_court.8050.a.tt_toast:0 "[ROOT.Char.Custom('MountedWarriorTerm')|U] [knight.GetNameNoTooltip]"
 hold_court.8050.a.tt_hook:0 "เพราะ [vassal.GetTitledFirstName] มีข้อผูกมัดกับท่าน:"
 hold_court.8050.b:0 "การจะรับ - #EMP [knight.GetHerHim]#! - ข้าต้องการบางสิ่งเป็นการตอบแทน"
 hold_court.8050.c:0 "[grandmaster.GetTitledFirstNameNoTooltip] ต้องการ [knight.GetWomenMen] เสมอ!"
 hold_court.8050.d:0 "ข้าเจอองครักษ์ของข้าแล้ว!"
 hold_court.8050.d.tt_bodyguard:0 "[knight.GetFirstName] จะย้ายมายังราชสำนักของท่านในฐานะองครักษ์ \nการปลด [knight.GetHerHim] อาจ ทำให้ [vassal.GetTitledFirstName] ไม่พอใจ"
 hold_court.8050.e.talented:0 "ท่านควรเก็บผู้มีพรสวรรค์ เช่นนี้ไว้ใกล้ตัว [vassal.GetFirstNameNoTooltip]"
 hold_court.8050.e.suitable:0 "มีฝีมือ ใช่ จำเป็นไหม? ไม่"
 hold_court.8050.e.passing:0 "สุสานเต็มไปด้วยนักดาบ[knight.GetWomenMen]ธรรมดาๆ"
 hold_court.8050.e.unsuitable:0 "ล่อสวมเกราะคงจะมีประโยชน์กว่า..."
 # # A Knight Spurned
 hold_court.8051.t:0 "$hold_court.8050.t$: [ROOT.Char.Custom('MountedWarriorTerm')|U] ผู้ถูกเมิน"
 hold_court.8051.desc:0 "ดูเหมือนว่าข่าวจะไปถึง [vassal.GetTitledFirstName] ในที่สุดว่า [vassal.Custom2('RelationToMeShort', SCOPE.sC('knight'))] ของ [vassal.GetHerHis] ไม่ได้อยู่ในตำแหน่ง [ROOT.Char.Custom('MountedWarriorTermPlural')] ของข้าอีกต่อไป \n\n[vassal.GetSheHe] ควบคุมความโกรธของ [vassal.GetHerHis] อย่างระมัดระวัง เรียกร้องให้ข้ารักษาสัญญาและคืนตำแหน่งให้ [knight.GetFirstNamePossessive]!"
 hold_court.8051.a:0 "ใจเย็นๆ ข้าจะคืนตำแหน่งให้ [knight.GetHerHim] [vassal.GetFirstNameNoTooltip]!"
 hold_court.8051.a.tt_knight:1 "[knight.GetFirstName] จะกลับมาเป็น [knight|E] อีกครั้ง"
 hold_court.8051.b:0 "การเสีย [knight.GetSheHe|U] ไปไม่ใช่เรื่องใหญ่อะไร"
 hold_court.8051.b.tt_return:0 "[knight.GetFirstNameNoTooltip] จะกลับไปยังราชสำนักของ [vassal.GetTitledFirstNamePossessiveNoTooltip]"
 # # The Last Straw
 hold_court.8052.t:0 "$hold_court.8050.t$: ฟางเส้นสุดท้าย"
 hold_court.8052.desc.intro:0 "[vassal.GetTitledFirstName] ไม่รอช้าเมื่อได้ยินว่า [knight.GetFirstName] ถูกปลดออกจากกองทหาร [ROOT.Char.Custom('MountedWarriorAdjective')] ของข้าอีกครั้ง และขอเข้าเฝ้าฯ \n\n"
 hold_court.8052.desc.wrath:0 "ด้วยความโกรธจัด [vassal.GetSheHe] ระเบิดออกมาว่า "[vassal.Custom2('RelationToMeShort', SCOPE.sC('knight'))] ของข้าถูกปฏิบัติอย่างไม่เป็นธรรมอย่างยิ่ง และความไว้วางใจของข้าในคำสัญญาของท่านถูกทำลาย!" ก่อนจะเดินกระทืบเท้าออกไป"
 hold_court.8052.desc.fallback:0 "[vassal.GetSheHe|U] แสดงความผิดหวังของ[vassal.GetHerHis]อย่างชัดเจน เห็นได้ชัดว่าโกรธเคืองกับความอับอายที่การกระทำของข้าก่อให้เกิดแก่[vassal.GetHerHim]..."
 hold_court.8052.a:0 "โอ้—ช่างเป็นเรื่องใหญ่โตเสียจริง!"
 hold_court.8052.b:0 "ทหาร! จับกุมเจ้า [vassal.Custom2('InsultNoun', ROOT.Char)] นั่น!"
 # # Perils of Glory
 hold_court.8053.t:0 "$hold_court.8050.t$: ภัยแห่งเกียรติภูมิ"
 hold_court.8053.desc.intro:0 "ข่าวมาถึงท่านจาก [battle_location.Custom('TerrainTypeProvince')] แห่ง [battle_location.GetName] ที่ ซึ่งมีรายงานว่า [knight.GetFirstNameNicknamed] ถูกสังหาร"
 hold_court.8053.killer:0 "โดย [knight.GetKiller.GetName]"
 hold_court.8053.battle:0 "ท่ามกลางการต่อสู้ระยะประชิดอันโกลาหล"
 hold_court.8053.desc_talented:0 "ในเปลวเพลิงแห่งเกียรติยศ ท่ามกลางซากศพของ [knight.GetWomenMen] ที่ด้อยกว่า"
 hold_court.8053.desc_suitable:0 "แม้จะต่อสู้อย่างสูสี ฟาดฟันศัตรูมากมายและได้รับบาดแผลหลายแห่ง"
 hold_court.8053.desc_passing:0 "หลังจากการประลองอย่างทรหด ปกป้องสหายของ[knight.GetHerHis]อย่างกล้าหาญ"
 hold_court.8053.desc_unsuitable:0 "ขณะที่แกว่งดาบของ[knight.GetHerHis]เหมือนปลาขาดน้ำ"
 hold_court.8053.desc_coward:0 "พยายามหลบหนีจากสนามรบ"
 hold_court.8053.desc.body:0 "\n\nท่านย่อมพ้นจากภาระผูกพันต่อ [vassal.GetTitledFirstName] แล้วอย่างแน่นอน..."
 hold_court.8053.a:0 "ความเสี่ยงของการต่อสู้..."
 # # A Temple for County
 hold_court.8060.t:0 "[ROOT.Char.GetFaith.HouseOfWorship|U] สำหรับ [target_county.GetNameNoTierNoTooltip]"
 hold_court.8060.desc:0 "[bishop.GetCouncilTitle] ของข้า [bishop.GetFirstName] ตอนนี้โค้งคำนับอยู่เบื้องหน้าข้า กระตือรือร้นที่จะเริ่มข้อเสนอ [bishop.GetHerHis]\n\n"[ROOT.Char.Custom('FormOfAddressForLiege')|U]"
 hold_court.8060.desc.owned:0 "[target_county.GetTierAsNameNoTooltip] แห่ง [target_county.GetNameNoTier] ของท่าน"
 hold_court.8060.desc.vassal:0 "[target_county.GetTierAsNameNoTooltip] แห่ง [target_county.GetNameNoTier] ของ [vassal.GetTitledFirstNamePossessive]"
 hold_court.8060.desc.subvassal:0 "[target_county.GetTierAsNameNoTooltip] แห่ง [target_county.GetNameNoTier] ปกครองโดยข้าราชบริพารของ [vassal.GetTitledFirstNamePossessive] [subvassal.GetTitledFirstName]"
 hold_court.8060.desc.existing:0 "สามารถรองรับ [ROOT.Char.GetFaith.HouseOfWorship] ที่สำคัญอีกแห่งหนึ่งได้ เป็นเครื่องพิสูจน์ถึงพลังของ [ROOT.Char.GetFaith.HighGodNameAlternatePossessive] และความศรัทธาของ [ROOT.Char.GetPrimaryTitle.GetTierAsNamePossessiveNoTooltip] ของท่าน""
 hold_court.8060.desc.first:0 "ขาด [ROOT.Char.GetFaith.HouseOfWorship|U] ที่สำคัญ ซึ่งคนท้องถิ่นสามารถสวดภาวนาและให้เกียรติ [ROOT.Char.GetFaith.HighGodNameAlternate] ได้""
 hold_court.8060.desc.end:0 "\n\n"ท่านต้องช่วยสนับสนุนเงินทุนสร้างศาสนสถานแห่งใหม่ที่ [target_province.GetName] เพื่อประโยชน์แห่งศรัทธา [ROOT.Char.GetFaith.GetAdjectiveNoTooltip]!""
 hold_court.8060.a:0 "เพื่อพระสิริแห่ง [ROOT.Char.GetFaith.HighGodName]!"
 hold_court.8060.a.tt:0 "เมื่อ [temple|E] สร้างเสร็จ:"
 hold_court.8060.b:0 "[vassal.GetTitledFirstNameNoTooltip] สามารถบริจาคได้"
 hold_court.8060.c:0 "ข้ารับใช้ของข้าต้องบริจาค"
 hold_court.8060.d:0 "นี่ฟังดูเหมือนเป็นงานสำหรับ [royal_architect.GetTitledFirstNameNoTooltip]"
 hold_court.8060.d.tt_success:0 "[royal_architect.GetTitledFirstName] ทำงานได้ยอดเยี่ยม"
 hold_court.8060.d.tt_normal:0 "[royal_architect.GetTitledFirstName] ทำงานได้เพียงพอ"
 hold_court.8060.d.tt_failure:0 "[royal_architect.GetTitledFirstName] ทำงานได้แย่มาก"
 hold_court.8060.e.own:0 "ข้ามีแผนอื่นสำหรับดินแดนนั้นแล้ว"
 hold_court.8060.e.vassal:0 "ข้าหลวงควรดูแลดินแดนของตนเอง"
