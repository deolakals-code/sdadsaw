 # # Contractual Compromise
 hold_court.8150.t:0 "การประนีประนอมตามสัญญา"
 hold_court.8150.desc.intro:0 "[target_faction.GetLeader.GetTitledFirstName] ก้าวออกมาอย่างกล้าหาญ และโดยไม่ให้บริบทใดๆ ก็พูดด้วยน้ำเสียงแผ่วเบา: \n\n"
 hold_court.8150.desc.alone:0 ""ข้าพเจ้ายินดีที่จะมองข้ามความคับข้องใจของข้าพเจ้า หากท่านจะแก้ไขภาระผูกพันตามสัญญาของข้าพเจ้าต่อราชสำนัก...""
 hold_court.8150.desc.few:0 ""ข้าพเจ้าสามารถชักชวนผู้ที่ไม่พอใจให้ถอยได้ หากท่านตกลงที่จะแก้ไขภาระตามสัญญาของเรา...""
 hold_court.8150.desc.group:0 ""ข้าพเจ้าสามารถเข้าถึงเพื่อนร่วมอุดมการณ์ที่ไม่พอใจได้ และมั่นใจว่าข้าพเจ้าสามารถชักชวนให้พวกเขายอมถอยได้เพื่อแลกกับการแก้ไขสัญญาบางประการ...""
 hold_court.8150.desc.body:0 "\n\nแม้จะมีข่าวลือว่า"
 hold_court.8150.desc.independence:0 "กำลังรวบรวมข้าหลวงของข้าเพื่อแยกตัวออกจาก [ROOT.Char.GetPrimaryTitle.GetNameNoTierNoTooltip],"
 hold_court.8150.desc.liberty:0 "เป็นจุดศูนย์กลางสำหรับความปรารถนาทรยศที่จะมีเอกราชมากขึ้นใน [ROOT.Char.GetPrimaryTitle.GetNameNoTierNoTooltip],"
 hold_court.8150.desc.claimant_self:0 "กำลังแสวงหาการสนับสนุนสำหรับการอ้างสิทธิ์อันเป็นเท็จของ[target_faction.GetLeader.GetHerHis] เหนือ [target_faction.GetSpecialTitle.GetNameNoTier],"
 hold_court.8150.desc.claimant:0 "สนับสนุนการอ้างสิทธิ์อันเป็นเท็จของ [target_faction.GetSpecialCharacter.GetTitledFirstNamePossessive] ใน [target_faction.GetSpecialTitle.GetNameNoTier]"
 hold_court.8150.desc.outro:0 "แน่นอนว่านี่เป็นข้อกล่าวหาที่ [target_faction.GetLeader.GetFirstNameNoTooltip] จะไม่ยอมรับต่อสาธารณะอย่างแน่นอน ..."
 hold_court.8150.a:0 "ข้ายอมรับ แม้ว่าจะ ทำให้ข้าเจ็บปวดก็ตาม"
 hold_court.8150.a.tt_shared:0 "ภาษี $hold_court.8150.a.tt_contract_reduction$ และจะ $hold_court.8150.a.tt_faction_cooldown$"
 hold_court.8150.a.tt_single_all:0 "ภาษีของ [target_faction.GetLeader.GetTitledFirstNamePossessive] $hold_court.8150.a.tt_contract_reduction$ และ [target_faction.GetLeader.GetSheHe] จะ $hold_court.8150.a.tt_faction_cooldown$"
 hold_court.8150.a.tt_single_cooldown:0 "จะ $hold_court.8150.a.tt_faction_cooldown$"
 hold_court.8150.a.tt_contract_reduction:0 "หรือภาระการเกณฑ์ทหารจะลดลงหนึ่งขั้น"
 hold_court.8150.a.tt_faction_cooldown:0 "ไม่สามารถเข้าร่วมกลุ่มใดๆ ได้เป็นเวลา 5 ปี"
 hold_court.8150.a.tt_multiple_feudal_intro:0 "สมาชิกศักดินาทุกคนของ [target_faction.GetName]"
 hold_court.8150.a.tt_multiple_intro:0 "สมาชิกทุกคนของ [target_faction.GetName]"
 hold_court.8150.b:0 "แสดงว่าเจ้า #EMP กำลัง#! วางแผนต่อต้านข้าอยู่รึ?! จับ [target_faction.GetLeader.GetHerHim]!"
 hold_court.8150.c:0 "มาเถิด [target_faction.GetLeader.GetFirstNameNoTooltip] ลืมคนอื่นไปเสีย"
 hold_court.8150.c.tt_success:0 "[target_faction.GetLeader.GetTitledFirstNameNoTooltip] รับสินบน"
