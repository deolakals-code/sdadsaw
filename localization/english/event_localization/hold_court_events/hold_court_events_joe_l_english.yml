 # # The King's Peace
 hold_court.8260.t:0 "สันติภาพแห่ง [ROOT.Char.GetTitleAsNamePossessiveNoTooltip]"
 hold_court.8260.desc.intro:1 "[vassal_faction_target.GetFullName] ก้าวเข้ามาด้วยสีหน้าบูดบึ้ง ร้อนรนที่จะร้องเรียนคำวิงวอนของ[vassal_faction_target.GetHerHis]\n\n"[ROOT.Char.GetTitleAsNameNoTooltip] [vassal_faction_leader.GetTitledFirstName] [vassal_faction_target.Custom2('RelationToMeShort', SCOPE.sC('vassal_faction_leader'))]ของข้า กำลังพยายามท้าทายตำแหน่งอันชอบธรรมของข้า""
 hold_court.8220.desc.claimant:0 "และ แต่งตั้ง [vassal_faction_target.Custom2('RelationToMeShort', SCOPE.sC('vassal_claimant'))] ของข้า, [vassal_claimant.GetTitledFirstName], เป็นผู้ช่วงชิงใน [vassal_faction.GetSpecialTitle.GetNameNoTier]!""
 hold_court.8220.desc.claimant_self:1 "และ แต่งตั้ง [vassal_faction.GetSpecialCharacter.GetHerselfHimself] เป็น [vassal_faction.GetSpecialCharacter.GetLadyLord] แห่ง [vassal_faction.GetSpecialTitle.GetNameNoTier]!""
 hold_court.8220.desc.liberty:0 "บั่นทอนอำนาจของข้าและขัดแย้งกับคำตัดสินอันชอบธรรมของข้าในฐานะ [vassal_faction_target.GetTitleAsNameNoTooltip] ของ [vassal_faction.GetLeader.GetHerHis]!""
 hold_court.8260.desc.body:0 "\n\n"[vassal_faction.GetLeader.GetSheHe|U] กำลังรวบรวมผู้ไม่พอใจ ในขณะที่เราพูดกันอยู่ #EMP ท่าน#! ต้องเตือนพวกเขาว่าอำนาจที่แท้จริงในอาณาจักรนี้อยู่ที่ใด!""
 hold_court.8260.a.peace:0 "[vassal_faction.GetLeader.GetTitledFirstNameNoTooltip] จะต้องหยุดเล่นเกมเหล่านี้"
 hold_court.8260.a.war:0 "[vassal_faction.GetLeader.GetTitledFirstNameNoTooltip] ต้องยอมจำนนทันที!"
 hold_court_8260_faction_member_tt:0 "สมาชิกทุกคนของ [vassal_faction.GetName] ([SCOPE.ScriptValue('court_8260_faction_value')|0]) ที่มุ่งเป้าไปที่ [vassal_faction_target.GetTitledFirstName]"
 hold_court.8260.b:0 "พวกปลุกปั่นจะไม่ได้รับการผ่อนปรน"
 hold_court.8260.c:0 "จะต้องมีสันติภาพใน [ROOT.Char.GetPrimaryTitle.GetTierAsNameNoTooltip] ของข้า!"
 hold_court.8260.d:0 "แต่พวกเขาก็มีประเด็นที่สมเหตุสมผลมิใช่หรือ?"
 hold_court.8260.e:0 "โอ้ ข้า #EMP ต้อง#! อย่างนั้นหรือ?"
 # # Oath of Fealty
 hold_court.8270.t:0 "คำสัตย์ปฏิญาณความภักดี"
 hold_court.8270.desc:1 "ราชมัคคุเทศก์ของข้าประกาศการมาถึงของผู้ปกครองเล็กๆ เพื่อนบ้าน [neighbor.GetTitledFirstName] แห่ง [neighbor.GetPrimaryTitle.GetNameNoTier] \n\n[neighbor.GetSheHe|U] เข้ามาในท้องพระโรงของท่านอย่างสง่างาม และโค้งคำนับอย่างลึกซึ้ง "ฝ่าบาท ข้ามาเพื่อถวายอาณาจักรของข้าแด่ท่านอย่างนอบน้อม — หากท่านจะยอมรับเงื่อนไขของข้า" \n\n"ข้าจะรับใช้ท่านในฐานะข้าหลวงผู้ภักดีแห่ง [ROOT.Char.GetPrimaryTitle.GetNameNoTier] เพื่อแลกกับการคุ้มครองของท่าน ขอให้ราชวงศ์อันยิ่งใหญ่ของเราทั้งสองเจริญรุ่งเรืองจากการจัดการนี้!""
 hold_court.8270.a:0 "ข้ายอมรับ, [neighbor.GetTitledFirstNameNoTooltip]"
 hold_court.8270.b:0 "ข้าคิดว่าเงื่อนไขเหล่านี้ค่อนข้างจะเข้าข้างฝ่ายเดียว..."
 hold_court.8270.b.accept:0 "[neighbor.GetTitledFirstNameNoTooltip] ยอมรับการเปลี่ยนแปลงของท่าน"
 hold_court.8270.b.refuse:0 "[neighbor.GetTitledFirstNameNoTooltip] ปฏิเสธ"
 hold_court.8270.d:0 "ข้าไม่คิด เช่นนั้น"
 # # Nomadic Neighbors
 hold_court.8280.t:0 "เพื่อนบ้านชนเผ่าเร่ร่อน"
 hold_court.8280.desc.foreign:0 "[feudal_vassal.Custom2('MyCharacterIntroduction', ROOT.Char)|U] รอเข้าเฝ้า ดูเหมือน [feudal_vassal.GetHerHis] จะวอกแวกกับปัญหาของตน\n\n"[ROOT.Char.Custom('FormOfAddressForLiege')|U]" [feudal_vassal.GetSheHe] พูดเสียงสั่น "พวก [nomad_culture.GetCollectiveNoun] เร่ร่อนบนชายแดนของข้ากำลังก่อความไม่สงบ และใน แต่ละวันก็มีพวกมันข้ามจาก [nomad.GetTopLiege.GetPrimaryTitle.GetNameNoTier] เข้ามาใน [feudal_county.GetName] ของข้ามากขึ้น" \n\n"ข้าเกรงว่า — หากไม่กำจัดพวกมันออกไป — ในไม่ช้าพวกมันจะตั้งรกรากทั่วทั้ง [feudal_county.GetTierAsNameNoTooltip]!""
 hold_court.8280.desc.local:0 "[feudal_vassal.Custom2('MyCharacterIntroduction', ROOT.Char)|U] ได้ขอเข้าเฝ้าข้าพร้อมกับ [nomad.Custom2('MyCharacterIntroduction', ROOT.Char)] — นี่น่าจะดี...\n\n"[ROOT.Char.GetTitleAsNameNoTooltip]!" [feudal_vassal.GetFirstNameNoTooltip] คร่ำครวญ "นักรบเร่ร่อนจากดินแดนของ [nomad.GetFirstNamePossessiveNoTooltip] หลั่งไหลเข้ามาใน [feudal_county.GetName] ของข้า — พวกเขาต้องกลับไป!" \n\n[nomad.GetFirstNameNoTooltip] ยักไหล่ "ผู้คนของข้าเป็นนักเดินทาง พวกเขาเพียงต้องการหาทุ่งหญ้าที่ยังไม่ได้ใช้ประโยชน์ที่ดีสำหรับสัตว์ของพวกเขา...""
 hold_court.8280.a.foreign:0 "พวกเขาต้องถูกส่งกลับไปยัง [nomad.GetTopLiege.GetPrimaryTitle.GetNameNoTierNoTooltip]"
 hold_court.8280.a.local:0 "[nomad.GetTitledFirstNameNoTooltip], ควบคุมพลม้าของเจ้าให้อยู่ในระเบียบ!"
 hold_court.8280.b:0 "ข้าต้องการนักรบฝีมือดีอยู่เสมอ"
 hold_court.8280.c:0 "เจ้าพูดเกินจริงไปอย่างชัดเจน, [feudal_vassal.GetFirstNameNoTooltip]"
 # 
 hold_court.8290.t: "กฎบัตร [city_province.GetTitle.GetAdjectiveNoTooltip]"
 hold_court.8290.desc: "[city_mayor.GetWomanMan] ที่ไม่คุ้นหน้ายืนอยู่ต่อหน้าข้า: ดูเหมือน [city_mayor.GetSheHe] จะชื่อ [city_mayor.GetFirstName] เป็น [city_mayor.GetTitleAsNameNoTooltip] ในเขตปกครองของ [ROOT.Char.Custom2('RelationToMeShort', city_vassal)] [city_vassal.GetTitledFirstNamePossessive] ของข้า\n\n"[ROOT.Char.GetTitleAsNameNoTooltip] ของข้า ข้ามาที่นี่โดยไม่ได้รับอนุญาตจาก [ROOT.Char.GetLadyLord] ของข้า เพื่อขอให้ท่านอนุญาตให้เมืองของข้า [city_province.GetTitle.GetNameNoTier] ได้ปกครองดูแลดินแดนโดยรอบตามที่เห็นสมควร"\n\n"เราสามารถจัดการกิจธุระของเราเองได้ และนำความรุ่งเรืองมาสู่ [ROOT.Char.GetPrimaryTitle.Custom('GetTierBase')] ได้ หากเพียง แต่เราเป็นอิสระจากภาษีอันหนักอึ้งและภาระหน้าที่ที่ถูกกำหนดโดย [city_vassal.GetTitleAsNameNoTooltip] แห่ง [city_vassal.GetPrimaryTitle.GetNameNoTierNoTooltip]""
 hold_court.8290.a: "ข้าเชื่อว่าเมืองของท่านจะจดจำความเมตตาของข้า"
 hold_court.8290.b: "รสชาติของผลไม้ในอนาคตอาจ ทำให้ข้าเปลี่ยนใจได้"
 hold_court.8290.c: "สิ่งที่ท่านขอนั้นเกินกว่าเหตุ"
 every_glory_hound_and_owner_actor: "[city_vassal.GetTitledFirstName] และ $glory_hound_vassals$ ใดๆ ([actor.MakeScope.ScriptValue('number_of_glory_hound_vassals')|V0])"
 hold_court_8290_grant_tooltip: "[city_county.GetName] ถูกเพิกถอนจาก [city_vassal.GetTitledFirstName] และกลายเป็น [republic|E] ภายใต้ [city_mayor.GetTitledFirstName]"
 hold_court.8300.t: "การสละสิทธิ์"
 hold_court.8300.desc: "[ROOT.Char.Custom2('RelationToMeShort', city_vassal)] ของข้า [city_vassal.GetTitledFirstName] เป็นภาพที่น่ายินดีในโถงของข้า แม้ว่า [city_vassal.GetSheHe] จะดูไม่แน่ใจว่าจะเริ่มคำขอ [city_vassal.GetHerHis] อย่างไร\n\nในที่สุด [city_vassal.GetSheHe] ก็หาคำพูด [city_vassal.GetHerHis] ได้: "[ROOT.Char.Custom('FormOfAddressForLiege')|U] ข้าเป็นเพียง [city_vassal.GetTitleAsNameNoTooltip] ผู้ต่ำต้อย พอใจกับการถือครองเล็กๆ ของข้า ข้ามองเพียงผลประโยชน์ของประชาชนใน [city_vassal.GetPrimaryTitle.GetNameNoTier] เหนือสิ่งอื่นใดคือผลประโยชน์ของจิตวิญญาณแห่ง [city_province.GetTitle.GetNameNoTier] — และแน่นอน จิตวิญญาณของ #EMP ทั้งหมด#! ใน [ROOT.Char.GetPrimaryTitle.GetNameNoTierNoTooltip]"\n\n"ข้าขอให้ท่านอนุญาตให้ข้าสละสิทธิ์การสืบทอดดินแดนของตระกูลข้า เพื่อหันมาปกครองแบบส่วนรวมแทน ดังที่เหล่านายกเทศมนตรีเมืองทำ""
 hold_court.8300.a: "เป็นความคิดที่น่าสนใจยิ่ง"
 hold_court.8300.b: "หาก #EMP ท่าน#! ไม่ต้องการสิทธิพิเศษ ผู้อื่นก็จะต้องการ"
 hold_court.8300.c: "สิทธิ์ของท่านนั้นละเมิดมิได้, [city_vassal.GetFirstNameNoTooltip]!"
 hold_court.8310.t: "การประสานอาณาจักร"
 hold_court.8310.desc: "ข้าประหลาดใจที่เห็น [ROOT.Char.Custom2('RelationToMeShort', drifting_vassal)] ของข้า, [drifting_vassal.GetTitledFirstName], [drifting_vassal.GetLadyLord] แห่ง [drifting_duchy.GetAdjectiveNoTooltip]"
 hold_court.8310.faith_culture: "ชาว [drifting_vassal.GetCulture.GetCollectiveNoun] — และเป็น [drifting_vassal.GetFaith.GetAdherentName] เสียด้วย — "
 hold_court.8310.culture: "ชาว [drifting_vassal.GetCulture.GetCollectiveNoun],"
 hold_court.8310.faith: "เหล่า [drifting_vassal.GetFaith.GetAdherentNamePlural],"
 hold_court.8310.fallback: "ดินแดน,"
 hold_court.8310.body: "คุกเข่าอยู่เบื้องหน้าข้าในวันนี้\n\n[drifting_vassal.GetSheHe|U] เริ่มต้น: "[ROOT.Char.GetTitleAsNameNoTooltip] ของข้า เราทุกคนรู้ว่าเวลาเปลี่ยนไปแล้ว กฎหมายและขนบธรรมเนียม [drifting_duchy.GetDeJureLiege.GetAdjectiveNoTooltip] เก่าต้องถูกกวาดล้างไปหาก [drifting_duchy.GetNameNoTierNoTooltip] จะได้รับการยอมรับอย่างถูกต้องว่าเป็นส่วนสำคัญของ [drifting_kingdom.GetNameNoTierNoTooltip]"\n\n"ไม่ใช่เรื่องง่ายที่จะขจัดร่องรอยที่หลงเหลือเหล่านี้ในหมู่ประชาชน แต่ด้วย... #EMP แรงจูงใจ#! ที่ถูกต้อง...""
 hold_court.8310.a: "#EMP แรงจูงใจ#!?! การทรยศ เช่นนี้ต้องถูกกำจัดให้สิ้นซาก!"
 hold_court.8310.b: "ความหมายของท่านเป็นที่เข้าใจดี, [drifting_vassal.GetFirstNameNoTooltip]"
 hold_court.8310.c: "โอ้? ข้าจะพิจารณากฎหมายของ [drifting_duchy.GetAdjectiveNoTooltip]"
 hold_court.8310.c.success: "การเปลี่ยนแปลงของท่านได้รับการต้อนรับ"
 hold_court.8310.c.failure: "ท่าน ทำให้เรื่องต่างๆ สับสนมากขึ้น"
 hold_court.8310.d: "เรื่อง เช่นนี้ต้องใช้เวลา"
 hold_court.8310.county_tooltip: "[counties|E] [de_jure|E] [drifting_duchy.GetAdjective] ทั้งหมดใน [realm|E] ของท่าน"
 hold_court.8320.t: "ปัญหาการพิสูจน์พินัยกรรม"
 hold_court.8320.self: "[ROOT.Char.Custom2('RelationToMeShort', probate_vassal)] ของข้า, [probate_vassal.GetName], ก้าวมาเบื้องหน้าข้า พร้อมด้วย"
 hold_court.8320.regent: "[probate_rep.GetTitledFirstName], [probate_vassal.GetTitleAsName] แห่ง [probate_vassal.GetPrimaryTitle.GetNameNoTierPossessive] [probate_vassal.Custom2('RelationToMeShort', probate_rep)], ก้าวมาเบื้องหน้าข้า พร้อมด้วย"
 hold_court.8320.monk: "นักบวช [probate_priest.GetFaith.GetAdjectiveNoTooltip]"
 hold_court.8320.priest: "[probate_priest.Custom('PriestTitle')] [probate_priest.GetFaith.GetAdjectiveNoTooltip]"
 hold_court.8320.desc: "ความทรงจำเลือนรางเกี่ยวกับคดีนี้ผุดขึ้นมา — ข้อพิพาทบางอย่างเกี่ยวกับความปรารถนาของผู้ล่วงลับ [probate_dead.GetTitledFirstNamePossessive]...\n\n[probate_vassal.GetFirstNameNoTooltip] โพล่งขึ้น: "[ROOT.Char.GetTitleAsNameNoTooltip], โปรดมั่นใจเถิดว่าคำสัญญาเรื่องที่ดินเหล่านี้เป็นเรื่องโกหกทั้งสิ้น! [probate_vassal.Custom2('RelationToMeShort', probate_dead)] ของข้าอาจเคยให้ทานบ้างเล็กน้อย แต่ #EMP ทั้ง [probate_county.GetName|l]#!?! มันไร้สาระอย่างเห็นได้ชัด!"\n\n"
 hold_court.8320.monk_2: "พระภิกษุกระแอมในลำคอของ [probate_priest.GetHerHis]:"
 hold_court.8320.priest_2: "นักบวชกระแอมในลำคอของ [probate_priest.GetHerHis]:"
 hold_court.8320.body: ""นามของข้าคือ [probate_priest.GetFirstName], ฝ่าบาท มาจาก [probate_dead.GetFaith.HouseOfWorship] แห่ง [probate_province.GetTitle.GetNameNoTier] เราพูดความจริง! [probate_dead.GetFirstNameNoTooltip] เป็น [probate_dead.GetWomanMan] ที่เคร่งศาสนา [probate_dead.GetSheHe|U] ใช้เวลาอยู่กับเรามากก่อนที่ [probate_dead.GetSheHe] จะพบความสงบสุขของ [probate_dead.GetFaith.HighGodNameAlternate] ใน [probate_dead.GetFaith.PositiveAfterLife]..."\n\n[probate_vassal.GetTitledFirstNameNoTooltip] กลอกตา [probate_vassal.GetHerHis] หน้าแดงด้วยความโกรธ"
 hold_court.8320.a: "ที่ดินเป็นของผู้ศรัทธาของ [probate_priest.GetFaith.HighGodNamePossessive]"
 hold_court.8320.b: "รักษาบรรดาศักดิ์ของท่านไว้ [probate_vassal.GetFirstNameNoTooltip], แต่ชดเชยให้แก่เหล่า [probate_priest.GetFaith.AltPriestTermPlural]"
 hold_court.8320.c: "ซับซ้อนมาก ดูเหมือนว่าการอ้างสิทธิ์จะหักล้างกันเอง..."
 hold_court.8320.d: "ไม่มีสิ่งใดสำคัญไปกว่าสิทธิ์ในการรับมรดกของ [probate_dead.Custom2('RelationToMePossessive', probate_vassal)]"
 every_close_family_hold_court_8320_tooltip: "[close_family|E] ของ [probate_vassal.GetHerHis|U]"
 hold_court_8320_grant_tooltip: "[probate_county.GetName] ถูกเพิกถอนจาก [probate_vassal.GetTitledFirstName] และกลายเป็น [theocracy|E] ภายใต้ [probate_priest.GetTitledFirstName]"
 hold_court.8330.t: "ความแตกแยกใน [ROOT.Char.GetPrimaryTitle.GetBaseNameNoTierNoTooltip]"
 hold_court.8330.desc: "ข้าได้พบกับข้าหลวงของข้า [vassal_1.GetTitledFirstName] และ [vassal_2.GetTitledFirstName] ทั้งคู่เป็นผู้มีอิทธิพลในราชสำนักที่บางครั้งก็ร้อนระอุของ [ROOT.Char.GetPrimaryTitle.GetBaseNameNoTierPossessiveNoTooltip] แต่อนิจจา วันนี้เสียงของพวกเขาไม่ประสานกัน\n\n[vassal_1.GetFirstNameNoTooltip] ก้าวไปข้างหน้า "[ROOT.Char.Custom('FormOfAddressForLiege')|U] ข้ามาที่นี่ต่อหน้าผู้ยิ่งใหญ่และผู้ดีทั้งหลายเพื่อจัดการ [vassal_2.GetFirstNameNoTooltip] ให้เข้าที่เข้าทาง!"\n\n"
 hold_court.8330.intro.courtly: ""ตระกูลขุนนางเก่าแก่แห่ง [ROOT.Char.GetPrimaryTitle.GetTierAsNameNoTooltip] ขยายขอบเขตสิทธิพิเศษของตนมากขึ้นทุกปี,"
 hold_court.8330.intro.glory_hound: ""พวกกระหายสงครามพยายามดึง [ROOT.Char.GetPrimaryTitle.GetTierAsNameNoTooltip] เข้าสู่ความขัดแย้งเพื่อจุดประสงค์เล็กน้อยของตนเอง,"
 hold_court.8330.intro.parochial: "ขุนนางขี้เกียจ ไม่ทะเยอทะยาน แสวงหาชีวิตที่เงียบสงบ บ่อนทำลายความแข็งแกร่งของเราขณะที่พวกเขาสร้างโชคลาภ,"
 hold_court.8330.intro.zealot: ""เป็นที่ชัดเจนว่าเหล่า [ROOT.Char.GetFaith.AltPriestTermPlural] ได้รับอิทธิพลมากเกินไปใน [ROOT.Char.GetPrimaryTitle.GetTierAsNameNoTooltip],"
 hold_court.8330.intro.minority: "พวก [ROOT.Char.Custom('GetDerogatoryNonbelieverPlural')] หัวเราะเยาะความเมตตาของท่านขณะที่พวกมันสมคบคิดกับศัตรูของท่าน"
 hold_court.8330.outro.courtly: "พวกเขาคุกคามสถานะของตระกูลใหญ่ในอาณาจักร: [vassal_1.GetHouse.GetBaseNameNoTooltip], แม้กระทั่ง #EMP [ROOT.Char.GetHouse.GetBaseNameNoTooltip]!#!"
 hold_court.8330.outro.glory_hound: "ในขณะที่เราอ่อนแอลงและสุกงอมสำหรับแผนการของศัตรูที่วางแผนอยู่เสมอต่ออาณาจักร"
 hold_court.8330.outro.parochial: "เราต้องระมัดระวังหากจะรักษาความสมดุลอันละเอียดอ่อนของผลประโยชน์ของอาณาจักรไว้"
 hold_court.8330.outro.zealot: "เพิกเฉยต่อหลักธรรมของ [ROOT.Char.GetFaith.ReligiousText] และพระประสงค์ของ [ROOT.Char.GetFaith.HighGodName]"
 hold_court.8330.outro.minority: "ไม่คำนึงถึงชุมชนแห่งความร่วมมืออย่างสันติ ซึ่งเป็นกุญแจสู่ความแข็งแกร่งของเรา"
 hold_court.8330.end: "ข้ามั่นใจว่าท่านเห็นด้วยกับข้า, เจ้าเหนือหัวของข้า\n\n[vassal_2.GetFirstNameNoTooltip] เพียงแค่ส่ายหน้า [vassal_2.GetHerHis] มองมาที่ข้าอย่างคาดหวัง พร้อมกับทั้งราชสำนัก..."
 hold_court.8330.a.courtly: "สิทธิ์อันเก่าแก่ของขุนนางมาก่อนสิ่งอื่นใด"
 hold_court.8330.a.glory_hound: "ไม่ว่าเราจะทำอะไร มันต้อง ทำให้ [ROOT.Char.GetPrimaryTitle.GetBaseNameNoTierNoTooltip] แข็งแกร่งขึ้น"
 hold_court.8330.a.parochial: "ข้าอยู่ที่นี่เพื่อมอบความเป็นผู้นำที่แข็งแกร่งและมั่นคง"
 hold_court.8330.a.zealot: "เราทุกคน — #EMP แม้แต่ข้า#! — เป็นเพียงเครื่องมือของ [ROOT.Char.GetFaith.HighGodName]"
 hold_court.8330.a.minority: "มีความหลากหลายมากมายที่ได้รับ"
 hold_court.8330.c: "ท่านทั้งสองเป็นข้าราชบริพารที่ประเมินค่ามิได้ของอาณาจักร"
 hold_court.8330.c.success: "ท่าน ทำให้ทั้งคู่พอใจ"
 hold_court.8330.c.failure: "ผู้สนับสนุนของพวกเขาไม่พอใจ"
 hold_court.8330.d: "ความหยิ่งยโส เช่นนั้นมี แต่จะดูหมิ่นเพื่อนข้าหลวงของท่าน"
 every_other_non_minor_vassal_actor: "ข้าหลวงที่ไม่ใช่ $barons_and_minor_landholders_vassal$ อื่นๆ ทุกคน ([actor.MakeScope.ScriptValue('hold_court_8330_other_vassals_count')|V0])"
 hold_court.8340.t: "มองหางาน"
 hold_court.8340.desc: "[candidate.GetWomanMan] [candidate.Custom('GetYoungMiddleAgedOld')] ก้าวมาเบื้องหน้าข้าด้วยความสง่างามอย่างเงียบๆ ก่อนจะโค้งคำนับอย่างลึกซึ้ง: "คารวะฝ่าบาท ข้าคือ [candidate.GetFirstName], ข้ารับใช้ผู้ภักดีของท่าน ข้ามาเข้าเฝ้าท่านวันนี้เพื่อหางานในราชสำนักของท่าน"\n\n"
 hold_court.8340.diplomacy: ""ข้าเคยเห็นราชสำนักมามากมาย ให้การต้อนรับแก่ขุนนางท้องถิ่นแห่ง [birthplace.GetNameNoTierNoTooltip], บ้านเกิดของข้า และแขกผู้มาเยือนมากมายของพวกเขา""
 hold_court.8340.stewardship: ""ข้าเป็นผู้จัดการที่ประสบความสำเร็จ เคยทำงานให้กับขุนนางท้องถิ่นและราชสำนักหลายแห่งใน [birthplace.GetNameNoTierNoTooltip], บ้านเกิดของข้า""
 hold_court.8340.intrigue: ""ข้ามี... #EMP ประสบการณ์#! ที่หลากหลายอย่างมาก ได้รับมาจากเมืองต่างๆ ใน [birthplace.GetNameNoTierNoTooltip], บ้านเกิดของข้า""
 hold_court.8340.learning: ""ข้าเป็น [candidate.GetWomanMan] แห่งอักษรศาสตร์ เคยเป็นอาลักษณ์ให้กับขุนนางท้องถิ่นและ [birthplace.GetCountyData.GetFaith.AltPriestTermPlural] แห่ง [birthplace.GetNameNoTierNoTooltip], บ้านเกิดของข้า""
 hold_court.8340.prowess: ""ข้าเป็นนักสู้ที่มีประสบการณ์ เคยรับใช้ขุนนางท้องถิ่นและกองทหารรักษาการณ์แห่ง [birthplace.GetNameNoTierNoTooltip], บ้านเกิดของข้า""
 hold_court.8340.outro: "จะเป็นเกียรติอย่างยิ่งหากข้าได้ใช้ความสามารถของข้าเพื่ออุดมการณ์ที่ยิ่งใหญ่กว่า ในการรับใช้ [ROOT.Char.GetTitleAsNameNoTooltip] ของข้า และ [ROOT.Char.GetPrimaryTitle.GetNameNoTierNoTooltip] ทั้งหมด""
 hold_court.8340.a: "ข้ามีงานที่ #EMP เหมาะสม#! พอดี"
 hold_court.8340.b: "ดีมาก ข้ามีบางอย่างให้ท่านทำ"
 hold_court.8340.c: "อา, ในที่สุดก็ได้ [candidate.GetWomanMan] ที่มีประโยชน์!"
 hold_court.8340.d: "ขณะนี้ไม่มีตำแหน่งว่าง..."
