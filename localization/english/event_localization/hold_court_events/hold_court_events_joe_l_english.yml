 court_position_desc_keeper_of_swans:0 "การดูแลนกน้ำหลวง สัญลักษณ์อันงดงามแห่งพระกรุณาธิคุณ"
 court_position_desc_travel_leader:1 "การนำทางท่านในการเดินทางทั้งหมด"
 court_position_desc_akolouthos: "การนำกององครักษ์จักรพรรดิ โดยเฉพาะชาววารังเจียนผู้น่าเกรงขาม"
 court_position_desc_chronicler: "การบันทึกทุกการกระทำของท่าน"
 court_position_desc_charioteer: "การฝึกฝนทั้งวันทั้งคืนเพื่อเป็นนักแข่งรถม้าที่ดีที่สุด"
 court_position_desc_bookmaker: "การดูแลการทำบัญชีสำหรับการพนันรถม้าทั้งหมด"
 court_position_desc_executioner: "การลงทัณฑ์อย่างยุติธรรมแก่อาชญากรและผู้ทรยศ"
 court_position_desc_food_taster: "การรับรองว่าพระกระยาหารของท่านอร่อยและไม่มีการปลอมปน"
 court_position_desc_court_jester: "การให้ความบันเทิงแก่ราชสำนักด้วยเรื่องตลกที่คู่ควรแก่พระบารมี"
