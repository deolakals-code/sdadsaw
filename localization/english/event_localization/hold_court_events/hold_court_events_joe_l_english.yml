 hold_court.8070.a:0 "การค้าควรได้รับการส่งเสริม"
 hold_court.8070.a.tt:0 "เมื่อ [city|E] สร้างเสร็จ:"
 hold_court.8070.b:0 "ข้าช่วยได้เพียง [vassal.GetTitledFirstNameNoTooltip] เท่านั้น"
 hold_court.8070.c:0 "ให้เจ้าเมืองท้องถิ่นรับผิดชอบบ้าง"
 hold_court.8070.d:0 "ในที่สุด ก็มีบางอย่างให้ [royal_architect.GetTitledFirstNameNoTooltip] ทำ"
 hold_court.8070.e:0 "มีเรื่องสำคัญกว่าที่ต้องจัดการ"
 # # Bustling County
 hold_court.8071.t:0 "$hold_court.8070.t$: [target_province.GetNameNoTooltip] ที่คึกคัก"
 hold_court.8071.desc.steward:0 "[steward.GetCouncilTitleFirstName] แจ้งข่าวอย่างภาคภูมิใจว่างานสร้าง [target_province.GetName] ให้เป็นศูนย์กลางการค้า กำลัง "เป็นรูปเป็นร่าง!" ตามคำพูดของ[steward.GetHerHis] \n\n"
 hold_court.8071.desc.fallback:0 "การพัฒนา [target_province.GetName] กำลังออกผล ในไม่ช้าเมืองก็จะตั้งตัวได้ \n\n"
 hold_court.8071.desc.owned:0 "สามัญชนแห่ง [target_county.GetNameNoTier]"
 hold_court.8071.desc.vassal:0 "ข้าราชบริพารของ [vassal.GetTitledFirstNamePossessive] ใน [target_county.GetNameNoTier]"
 hold_court.8071.desc.existing:0 "ยินดีกับการลงทุนเหล่านี้ และความเจริญรุ่งเรืองที่จะนำมาสู่พื้นที่"
 hold_court.8071.desc.first:0 "บัดนี้สามารถประกอบอาชีพและทำการค้าได้ง่ายขึ้น ณ ศูนย์กลางระดับภูมิภาคแห่งนี้"
 hold_court.8071.a:0 "วันหนึ่ง [target_province.GetNameNoTooltip] จะกลายเป็นเมืองที่ยิ่งใหญ่"
