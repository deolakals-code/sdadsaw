 # # Servant of God
 hold_court.8200.t:0 "ผู้รับใช้แห่ง [ROOT.Char.GetFaith.HighGodName]"
 hold_court.8200.desc.intro:1 "ดูเหมือนว่า [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('aggressor_vassal'))] ของข้า [aggressor_vassal.GetTitledFirstName] กำลังเก็บงำอารมณ์โกรธขณะรอเข้าเฝ้า \n\n"[ROOT.Char.Custom('FormOfAddressForLiege')|U]"
 hold_court.8200.desc.vassal:0 "ข้าไม่อาจทนต่อการยอมรับ [ROOT.Char.Custom2('GetUnbelieverTerm', SCOPE.sC('infidel_vassal'))] เช่น [infidel_vassal.GetTitledFirstName] ในอาณาจักรได้ – แม้ แต่ในหมู่ชนชั้นสูง!""
 hold_court.8200.desc.pope:0 "พวก [ROOT.Char.Custom2('GetUnbelieverTerm', SCOPE.sC('infidel_vassal'))] รวมตัวกันรอบ [ROOT.Char.GetFaith.BishopNeuter] จอมปลอม [infidel_vassal.GetTitledFirstName] และทั้งหมดอยู่ภายใต้การคุ้มครองของท่าน!""
 hold_court.8200.desc.body:1 "\n\n"[ROOT.Char.GetFaith.HighGodName] ได้แสดงความต้องการของ[ROOT.Char.GetFaith.HighGodHerHis] ต่อเราอย่างชัดเจน – [ROOT.Char.GetPrimaryTitle.GetBaseNameNoTier] ควรเป็นดินแดนของผู้ศรัทธา! ขับไล่ไอ้พวกสุนัข '[infidel_vassal.GetFaith.GetAdjective]' เหล่านี้ออกไป!""
 hold_court.8200.a:0 "ท่านพูดถูก [infidel_vassal.GetTitledFirstNameNoTooltip] ต้องเปลี่ยนศาสนา!"
 hold_court.8200.a.tt_accept:0 "[infidel_vassal.GetTitledFirstName] ตกลงที่จะเปลี่ยนศาสนา"
