 # # Evangelical Backlash
 hold_court.8120.t:0 "การต่อต้านการเผยแผ่ศาสนา"
 hold_court.8120.desc:0 "ข้าได้พบกับ [peasant.GetFaith.GetAdherentName] ที่ยากจนคนหนึ่ง เป็นภาพของความอ่อนน้อมถ่อมตนและการวิงวอน\n\n"[ROOT.Char.GetTitleAsNameNoTooltip] ผู้รุ่งโรจน์ ข้ามาเพื่อวิงวอนให้ท่านหยุดยั้งนักบวชที่ก่อกวนผู้คนของ [conversion_target.GetNameNoTierPossessive] และขับไล่พวกเขาให้ยอมรับ [ROOT.Char.GetFaith.GetName]"\n\n"
 hold_court.8120.desc.same_religion:1 ""เราทุกคนปฏิบัติตามคำสอนของ [peasant.GetFaith.CreatorName] และมองหาการชี้นำและความเมตตาจาก [peasant.GetFaith.CreatorHerHim|U]! ข้า แต่[ROOT.Char.GetLadyLord] โปรดให้เราได้รักษาพิธีกรรมท้องถิ่นของเรา และใช้ชีวิตโดยปราศจากความกลัวต่อความรุนแรงหรือการตำหนิ""
 hold_court.8120.desc.same_culture:0 "แม้เราอาจมีความเชื่อต่างกัน แต่ท้ายที่สุดเราก็เป็นพี่น้องชาว [peasant.GetCulture.GetName] เหมือนกัน ไม่ว่าเราจะนับถือ [peasant.GetFaith.HighGodName] หรือ [ROOT.Char.GetFaith.HighGodName] เรายังคงอยู่ร่วมกันอย่างสันติไม่ได้หรือ?"
 hold_court.8120.desc.other:0 ""พวกเราคือ [peasant.GetCulture.GetName] ประเพณีของเราแตกต่างจากชาว [ROOT.Char.GetCulture.GetName] ผู้ยิ่งใหญ่ ให้เราได้รักษาขนบธรรมเนียมของบรรพบุรุษ และบูชา [peasant.GetFaith.CreatorName] อย่างสงบเถิด โปรดเมตตาด้วย [ROOT.Char.Custom('FormOfAddressForLiege')]""
 hold_court.8120.a:0 "นักบวช[ROOT.Char.GetFaith.GetAdjectiveNoTooltip] จักปล่อย [peasant.GetFaith.GetAdherentNamePluralNoTooltip] ไว้ตามลำพัง"
 hold_court.8120.a.tt_conversion:0 "เคาน์ตี[peasant.GetFaith.GetAdjective] ไม่สามารถเปลี่ยนศาสนาได้เป็นเวลา 15 ปี"
 hold_court_8120_conversion_tt:0 "ศรัทธานี้เป็นที่ยอมรับได้โดยท่าน"
 hold_court.8120.b:0 "เรามี มากมาย ที่จะเรียนรู้จาก [peasant.GetFaith.GetAdherentNamePluralNoTooltip]"
