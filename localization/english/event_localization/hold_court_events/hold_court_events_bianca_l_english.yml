l_english: 
 # 
 hold_court.3000.t:0 "งานเลี้ยงในนามของท่าน"
 hold_court.3000.desc.opening:0 "[feast_vassal.GetTitledFirstName] เข้ามาหาข้าพเจ้าด้วยท่าทางที่ตรงกว่าปกติและกระตือรือร้นอย่างเห็นได้ชัดเกี่ยวกับสิ่งที่ [feast_vassal.GetSheHe] จะกล่าว\n\n"
 hold_court.3000.desc.opening.blind:0 "ข้าได้ยินเสียงฝีเท้าของ [feast_vassal.GetTitledFirstName] ใกล้เข้ามา หลังจากที่พวกเขาหยุดลง ก็ตามมาด้วยเสียงกระแอมในลำคอของ [feast_vassal.GetHerHis] ที่ฝึกฝนมาอย่างเห็นได้ชัด บางทีอาจเป็นวิธีการดึงดูดความสนใจของข้า ข้าได้ยินว่า [feast_vassal.GetSheHe] ดูเหมือนจะพอใจกับสิ่งที่ [feast_vassal.GetSheHe] จะพูด\n\n"
 hold_court.3000.desc.likes:0 ""[ROOT.Char.Custom('FormOfAddressForLiege')] ภายใต้การปกครองของท่านมีเรื่องให้เฉลิมฉลองมากมาย! ได้โปรด ให้ข้าได้เป็นผู้ออกค่าใช้จ่ายสำหรับงานเลี้ยงครั้งต่อไปของท่านเถิด! บางทีในอนาคตท่านอาจจะตอบแทนคุณแก่ข้าบ้าง?""
 hold_court.3000.desc.dislikes:0 ""[ROOT.Char.Custom('FormOfAddressForLiege')] ผู้คนในอาณาจักรของท่านต้องการการชุมนุมรื่นเริงเป็นครั้งคราว เพื่อที่พวกเขาจะได้ลืมความตึงเครียด ข้าอยากจะเป็นผู้สนับสนุนทางการเงินสำหรับงานเลี้ยง แม้ว่าจะจัดในนามของท่านก็ตาม เพราะมันเป็นผลดีต่อ [ROOT.Char.GetPrimaryTitle.GetNameNoTierNoTooltip] ทว่าข้าก็หวังอย่างยิ่งว่าจะได้รับความช่วยเหลือเป็นการตอบแทน""
 hold_court.3000.a:1 "ดีมาก ข้าพเจ้ายอมรับ"
 hold_court.3000.a.tt:0 "การจัดงานเลี้ยงในอนาคตอันใกล้นี้จะให้รางวัลเป็น [court_grandeur_value|E]"
 hold_court.3000.b:1 "ไม่มีข้อผูกมัด! เจ้าเหนือหัวของท่านบัญชา!"
 hold_court.3000.c:1 "บางทีเราอาจจะจัดการบางอย่างที่น่าพอใจกว่านี้ได้?"
 hold_court.3000.c.success:0 "[feast_vassal.GetTitledFirstNameNoTooltip] ตกลงที่จะยกเลิกคำขอความช่วยเหลือ"
 hold_court.3000.c.failure:0 "[feast_vassal.GetTitledFirstNameNoTooltip] ไม่เห็นด้วยและถอนข้อเสนอที่จะจ่ายเงิน"
 hold_court.3000.d:1 "ข้าพเจ้าเกรงว่าจะรับไม่ได้"

 hold_court.3001.desc:0 "ช่างเป็นงานเลี้ยงที่วิเศษเสียนี่กระไร! ด้วยงานเลี้ยงที่สัญญาไว้กับ [feast_vassal.GetTitledFirstName] ยังคงสดใหม่ในความทรงจำของผู้ที่เข้าร่วมในวันนั้น ผู้เข้าร่วมงานเลี้ยงของข้าพเจ้าต่างขับขานสรรเสริญข้าพเจ้าอย่างปีติยินดี ข้าพเจ้ารู้สึกเมามายด้วยความสุขเมื่อผู้คนโห่ร้องและบูชาแทบเท้าข้าพเจ้า! ประโยชน์เพิ่มเติมของการรักษาสัญญาของข้าพเจ้าต่อ [feast_vassal.GetFirstNameNoTooltip] คือทุกคนที่เข้าร่วมต่างพูดถึงราชสำนักของข้าพเจ้าอย่างสูงส่ง!"
 hold_court.3001.desc.dead:0 "โอ้ ช่างเป็นงานเลี้ยงที่น่าอัศจรรย์เสียนี่กระไร! น่าเสียดายที่ [feast_vassal.GetTitledFirstName] ไม่ได้เห็นมัน ผู้เข้าร่วมบางคนระลึกถึงความทรงจำเกี่ยวกับงานเลี้ยงที่ข้าพเจ้าสัญญาไว้กับ [feast_vassal.GetHerHim] และกล่าวถึงความทุ่มเทของข้าพเจ้าต่อความบันเทิงในราชสำนักอย่างอบอุ่น บางคนสันนิษฐานว่าการเฉลิมฉลองนี้อุทิศให้กับความทรงจำของ [feast_vassal.GetFirstNameNoTooltip] ด้วย ไม่ว่าจะด้วยวิธีใด การรักษาสัญญาของข้าพเจ้าก็ได้ให้ประโยชน์ตอบแทนคือทุกคนที่เข้าร่วมต่างพูดถึงราชสำนักของข้าพเจ้าอย่างสูงส่ง!"
 hold_court.3001.a:0 "ข้าพเจ้าแน่ใจว่างานเลี้ยงครั้งต่อไปจะดียิ่งขึ้นไปอีก!"
 hold_court.3001.b:0 "อีกถ้วยในนามของ [feast_vassal.GetHerHis]!"

 hold_court.3010.t:0 "นักเทศน์นอกรีต"
 hold_court.3010.desc.opening:0 ""[ROOT.Char.Custom2('RelationToMeAddress', religious_vassal)|U]," น้ำเสียงของ [religious_vassal.GetTitledFirstNamePossessive] เข้มงวด "ข้าพเจ้าขอให้เราเริ่มการสอบสวนเกี่ยวกับนักเทศน์ชื่อกระฉ่อนใน [ROOT.Char.GetCapitalLocation.GetTitle.GetNameNoTierNoTooltip] ท่านเห็นไหม นักเทศน์ผู้นี้... เอ่อ... "
 hold_court.3010.desc.preacher_gender:0 "ว่า [unconventional_preacher.GetSheHe] เป็น #EMP [unconventional_preacher.GetWomanMan]!#! "
 #hold_court.3010.desc.preacher_marriage: "The problem with this preacher is that [unconventional_preacher.GetSheHe] married to someone else than [ROOT.Char.GetFaith.HighGodName]!" 
 hold_court.3010.desc.closing:0 "นี่ไม่สอดคล้องกับศรัทธาของเรา!"\n\n[tolerant_vassal.GetTitledFirstName] ขัดจังหวะคำพูดของ [religious_vassal.GetFirstNamePossessiveNoTooltip] โดยยกมือ [tolerant_vassal.GetHerHis] ขึ้นและก้าวไปข้างหน้า "[ROOT.Char.Custom2('RelationToMeAddress', tolerant_vassal)|U] ในขณะที่ [religious_vassal.GetFirstNameNoTooltip] ถูกต้องในการประเมิน [religious_vassal.GetHerHis] นั่นคือข้อบกพร่อง #EMP เพียงอย่างเดียว#! ของนักเทศน์ ทุกสิ่งที่ [unconventional_preacher.GetSheHe] สอนนั้นสอดคล้องกับศรัทธาของเรา""
 hold_court.3010.a:1 "นักเทศน์ผู้นี้ต้องเข้าร่วมราชสำนักของข้าพเจ้า!"
 hold_court.3010.b:1 "เอานักเทศน์ผู้นี้ออกไปให้พ้นสายตาข้าพเจ้า!"
 hold_court.3010.c:1 "ข้าพเจ้าประสงค์จะจ้างนักเทศน์ผู้นี้เป็น $high_almoner_court_position$ ของข้าพเจ้า"
 hold_court.3010.d:0 "หาก [unconventional_preacher.GetSheHe] สามารถสอนไพร่ได้ เช่นนั้น [unconventional_preacher.GetSheHe] ก็จะเป็น $court_tutor_court_position$ ที่ดี..."

 hold_court.3020.t:0 "อนุสาวรีย์ที่น่าขุ่นเคือง"
 hold_court.3020.desc:0 "ชาวนาผู้หนึ่งก้าวไปข้างหน้า ถือคำร้อง "[ROOT.Char.Custom('FormOfAddressForLiege')|U] ข้ามาในฐานะตัวแทนของ [village.GetCountyData.GetCulture.GetCollectiveNounNoTooltip] จาก [village.GetName]" ชาวนาหยุดคำพูดที่ซักซ้อมมา [different_culture_peasant.GetHerHis] ชั่วครู่\n\n"คำร้องของพวกเราที่จะบูรณะอนุสรณ์สถานสำคัญทางวัฒนธรรมของเราถูกเพิกเฉยโดย [holder_of_area.GetTitleTierName] [holder_of_area.GetSheHe|U] กำลังขัดขวางไม่ให้เราสร้างมันขึ้นมาใหม่!"\n\n"[ROOT.Char.Custom2('RelationToMeAddress', holder_of_area)|U] ให้ข้าได้อธิบาย!" [holder_of_area.GetFirstNameNoTooltip] แทรกขึ้นมาอย่างตื่นตระหนก "อนุสรณ์สถานนี้มันเยาะเย้ยวัฒนธรรมของเรา! มันพรรณนาถึง [holder_of_area.GetCulture.GetCollectiveNounNoTooltip] ว่าเป็นอสูรร้าย! แน่นอน ท่านก็คงเห็นว่าเหตุใดข้าจึงคัดค้านการบูรณะอนุสรณ์สถานที่น่ารังเกียจ เช่นนี้!""
 hold_court.3020.a:1 ""รื้อมันทิ้งเสีย!""
 hold_court.3020.b:0 "ให้การอนุมัติอย่างเป็นทางการสำหรับการบูรณะ"
 hold_court.3020.c:1 "สร้างอนุสาวรีย์อื่นแทน — อันที่แสดงถึงทั้งสองวัฒนธรรม"
 every_county_of_culture: "ทุก [county|E] ใน [realm|E] ที่มีวัฒนธรรม [village.GetCountyData.GetCulture.GetName]"
 3020_MONUMENT_VALUE: "รูปปั้นที่บูรณะแล้ว"
 3020_multicultural_monument: "อนุสาวรีย์หลากหลายวัฒนธรรม"
 3020_multicultural_monument_desc: "อนุสาวรีย์ทางวัฒนธรรมที่สำคัญเพิ่งได้รับการปรับปรุงใหม่เพื่อรวมองค์ประกอบของอีกวัฒนธรรมหนึ่ง ทำให้เส้นแบ่งที่แบ่งแยกสองวัฒนธรรมเลือนลางลง\n\n#P +10%#! ความเร็วในการเปลี่ยนวัฒนธรรม"
 3020_own_culture_monument: "อนุสาวรีย์ครอบงำ"
 3020_own_culture_monument_desc: "อนุสาวรีย์ทางวัฒนธรรมที่สำคัญเพิ่งถูกรื้อถอนและแทนที่ด้วยอนุสาวรีย์ของวัฒนธรรมอื่น ทำให้คนในท้องถิ่นไม่พอใจและท้าทายอัตลักษณ์ทางวัฒนธรรมของพวกเขา\n\n#P +10%#! ความเร็วในการเปลี่ยนวัฒนธรรม"

 hold_court.3030.t:0 "การบูรณะอนุสาวรีย์"
 hold_court.3030.desc:0 "ชาวนา [different_culture_peasant.GetWomanMan] คนหนึ่งยืนอยู่เบื้องหน้าข้าพเจ้า แจ้งให้ราชสำนักทราบถึงคำร้องขอ [different_culture_peasant.GetHerHis]\n\n"สงครามครั้งล่าสุดส่งผลกระทบต่อชนบท และเราไม่แน่ใจว่าใครเป็นผู้กระทำผิด แต่พวกเขาได้ปล้นสะดมสถานที่สำคัญทางวัฒนธรรมของเราชาว [different_culture_peasant.GetCulture.GetCollectiveNounNoTooltip] จาก [province.GetName] โปรดเถิด เราขอวิงวอนท่าน โปรดแบ่งปันทรัพยากรของท่านบางส่วน เพื่อให้เราได้เห็นมันได้รับการบูรณะ!"\n\nThe peasant ends [different_culture_peasant.GetHerHis] request with a clumsy bow — a clear indicator of their lowborn status."
 hold_court.3030.a:0 ""เจ้าจะได้รับเงินทุนที่จำเป็นสำหรับการบูรณะ""
 hold_court.3030.b:0 "ใช้วัสดุที่เหลือสำหรับอาคารอื่น"
 hold_court.3030.c:0 ""เราไม่สามารถใช้จ่ายทองคำในเรื่องนี้ได้""

 hold_court.3040.t:0 "ขอเสียงหัวเราะ"
 hold_court.3040.desc:0 "ในช่วงเวลาสั้นๆ แห่งความเงียบ ข้าพเจ้าเห็น [jester_requester.GetTitledFirstName] [ROOT.Char.Custom2('QuirkPPPosOrNeg', SCOPE.sC('jester_requester'))] ก่อนที่จะตระหนักว่าเป็นตา [jester_requester.GetHerHis] ที่จะพูด "[ROOT.Char.Custom2('RelationToMeAddress', jester_requester)|U]!" [jester_requester.GetSheHe|U] กล่าว ให้เวลาอันมีค่าแก่ [jester_requester.GetHerHim] ในการสรุปความคิด [jester_requester.GetHerHis] ก่อนที่จะพูดต่อ\n\n"รอยยิ้มและเสียงหัวเราะเป็นตัวบ่งชี้ที่ดีของราชสำนักที่มีชีวิตชีวา! ดังนั้น ข้าพเจ้าจึงมีข้อเสนอแนะสำหรับผู้ที่จะเป็นตัวตลกที่ยอดเยี่ยมเพื่อสร้างความบันเทิงให้แก่เรา ซึ่งสามารถมาเยี่ยมเยียนได้!"\n\n"[ROOT.Char.Custom2('RelationToMeAddress', kill_joy)|U] หากข้าพเจ้าจะขออนุญาต" [kill_joy.GetTitledFirstName] พูดแทรกขึ้นมาจากข้างสนาม "ตัวตลกจะทำลายบรรยากาศอันซับซ้อนของราชสำนักนี้ และแทนที่ความประณีตด้วยอารมณ์ขันที่หยาบคายและเหมือนเด็ก""
 hold_court.3040.a:0 "ข้าพเจ้าจะจ้างตัวตลกของท่านผู้นี้!"
 hold_court.3040.b:0 "บทบาทที่สมบูรณ์แบบสำหรับ [jester_requester.GetTitledFirstNameNoTooltip] ผู้เชี่ยวชาญในการทำตัวเป็นคนโง่"
 hold_court.3040.c:0 "หาก [kill_joy.GetTitledFirstNameNoTooltip] ไม่ชอบหัวเราะ เราควร ทำให้ [kill_joy.GetHerHim] เป็นที่น่าหัวเราะ!"
 hold_court.3040.d:0 "นี่ไม่ใช่ตลาดของชาวนา! ตัวตลกไม่มีที่ยืนในราชสำนักนี้!"
 hold_court.3040.e:0 "บางทีข้าพเจ้าจะพิจารณาเรื่องนี้ในเวลาอื่น"
 generic_cp_discount_tt: "[court_position|E] นี้จะมีค่าจ้างถูกลง #P 50%#! "

 hold_court.3060.t:0 "การจัดการกับการทุจริต"
 hold_court.3060.desc.opening:0 "[ROOT.GetCharacter.Custom2('RelationToMe', SCOPE.sC('county_petitioner'))] ของข้าพเจ้า [county_petitioner.GetTitledFirstName] [ROOT.Char.Custom2('QuirkPresentPosOrNeg', SCOPE.sC('county_petitioner'))] ก่อนที่จะก้าวออกมาเพื่อยื่นคำร้องของเขา "[ROOT.Char.Custom2('RelationToMeAddress', county_petitioner)|U] ข้าพเจ้าขอความช่วยเหลือจากท่านในการต่อสู้กับปัญหาเรื่อง "
 hold_court.3060.desc.thieves:0 "โจรขโมยของจาก [corrupt_county.GetNameNoTier] และผู้คน!"
 hold_court.3060.desc.bandits:0 "โจรปล้นสะดมก่อกวนผู้คนธรรมดาใน [corrupt_county.GetNameNoTier]!"
 hold_court.3060.desc.tax:0 "การเก็บภาษีที่ไม่ได้ผลใน [corrupt_county.GetNameNoTier]!"
 hold_court.3060.desc.sheriffs:0 "การขาดนายอำเภอใน [corrupt_county.GetNameNoTier]!"
 hold_court.3060.desc.guilds:0 "การขาดความร่วมมือจากสมาคมใน [corrupt_county.GetNameNoTier]!"
 hold_court.3060.desc.levies:0 "กองทหารเกณฑ์ที่ไม่ได้รับการฟื้นฟูในอัตราที่ยอมรับได้ใน [corrupt_county.GetNameNoTier]!"
 hold_court.3060.desc.courts:0 "การขาดศาลยุติธรรมใน [corrupt_county.GetNameNoTier]!"
 hold_court.3060.desc.rulers:0 "การบริหารที่ขาดความกระตือรือร้นของ [corrupt_county.GetNameNoTier]!"
 hold_court.3060.desc.closing:1 "\n\n[county_petitioner.GetSheHe|U] หยุดถอนหายใจ "ดินแดนของข้าพเจ้าเป็นเพียงหนึ่งในหลายแห่งในอาณาจักรที่ประสบปัญหาขาดการควบคุม ข้าพเจ้าขอความช่วยเหลือใดๆ ที่ท่านสามารถแบ่งปันได้""
 hold_court.3060.a:1 "เราต้องลงทุนในภูมิภาคที่ไร้ระเบียบเหล่านี้"
 hold_court.3060.b:0 "สจ๊วตของข้าพเจ้าสามารถให้คำแนะนำแก่ท่านได้"
 hold_court.3060.c:1 "อนิจจา คลังเบาบาง"
 hold_court.3060.d:0 "[ROOT.GetCharacter.Custom2('RelationToMe', SCOPE.sC('cp_steward_replacement'))] ของข้า [cp_steward_replacement.GetFirstNameNoTooltip] จะเป็นสจวร์ตที่ดีกว่า"
 every_low_county_control: "ทุก [county|E] ใน [realm|E] ที่มี [control|E] 33 หรือน้อยกว่า"

 hold_court.3080.t:0 "การจัดแสดงของสะสมของ [ROOT.GetCharacter.GetTitledFirstNamePossessive]"
 hold_court.3080.desc:0 "[ROOT.GetCharacter.Custom2('RelationToMe', SCOPE.sC('antiquarian'))] ของข้า [antiquarian.GetTitledFirstName] เข้ามาหาข้าด้วยฝีเท้าที่กระฉับกระเฉง\n\n"[ROOT.Char.Custom2('RelationToMeAddress', antiquarian)|U]!" [antiquarian.GetFirstNameNoTooltip] กล่าวอย่างตื่นเต้น "ข้ามีความคิดอันยอดเยี่ยมที่สามารถนำเงินตราหรือชื่อเสียงมาให้ท่านได้! ท่านได้สะสมโบราณวัตถุไว้มากมาย [ROOT.Char.Custom('FormOfAddressForLiege')] เหตุใดจึงไม่นำมันมาจัดแสดงเล่า? ท่านสามารถเก็บค่าเข้าชมของสะสมของท่าน หรือเปิดให้ชมฟรี เพื่อให้ผู้คนได้เข้าชมมากขึ้น"\n\n[antiquarian.GetSheHe|U] กระแอมไอ [antiquarian.GetHerHis] ก่อนจะกล่าวต่อ "ผู้คนมักมีแนวโน้มที่จะอยากได้ในสิ่งที่พวกเขาเห็น ดังนั้นข้อเสียอาจเป็นไปได้ว่าจะมีคนพยายามอ้างสิทธิ์ในโบราณวัตถุของท่านมากขึ้น""
 hold_court.3080.a:0 "ข้าพเจ้าต้องการให้ผู้คนจ่ายเงินเพื่อชมเพียงเสี้ยวหนึ่งแห่งความรุ่งโรจน์ของข้าพเจ้า!"
 hold_court.3080.a.tt:0 "แผนการโบราณวัตถุที่เป็นปฏิปักษ์จะเกิดขึ้นบ่อยขึ้น"
 hold_court.3080.b:0 "บางคนต้องเห็นจึงจะเชื่อ และนั่น รวมถึงผู้ด้อยโอกาสด้วย"
 hold_court.3080.c:0 "มันไม่คุ้มที่จะเสี่ยง"

 hold_court.3090.t:0 "การเฉลิมฉลองวัฒนธรรมอื่น"
 hold_court.3090.desc:0 "[ROOT.GetCharacter.Custom2('RelationToMe', SCOPE.sC('different_culture_vassal'))] ของข้า [different_culture_vassal.GetTitledFirstName] เข้ามาหาข้า [ROOT.Char.Custom2('QuirkPPPosOrNeg', SCOPE.sC('different_culture_vassal'))] เช่นที่ [different_culture_vassal.GetSheHe] ทำบ่อยๆ\n\n"[ROOT.Char.Custom('FormOfAddressForLiege')|U] ข้ามีความคิดที่ยอดเยี่ยม! จะเป็นอย่างไรหากเราจัดงานรื่นเริง หรืออาจจะเป็นเทศกาลสำหรับสามัญชน เพื่อให้พวกเขาได้สัมผัสกับหนึ่งในวัฒนธรรมที่แตกต่างใน [ROOT.Char.Custom('RealmType')] ที่สวยงามของเรา" [different_culture_vassal.GetFirstNameNoTooltip] อธิบายความคิด [different_culture_vassal.GetHerHis] ต่อไป จนกระทั่ง [different_culture_vassal.GetSheHe] ตระหนักว่า [different_culture_vassal.GetSheHe] ใกล้จะอธิบายมากเกินไป\n\n"มันต้องใช้เงิน แต่ข้ามั่นใจว่ามันจะช่วยส่งเสริมความสัมพันธ์เชิงบวกระหว่างผู้คนของเรา!""
 hold_court.3090.a:0 "เราจะจัดเทศกาลใหญ่ เฉลิมฉลองทั้งสองวัฒนธรรมของเรา!"
 hold_court.3090.b:0 "เราสามารถจัดงานออกร้าน [different_culture_vassal.GetCulture.GetNameNoTooltip] เล็กๆ ใน [ROOT.Char.GetCapitalLocation.GetTitle.GetNameNoTierNoTooltip] ได้"
 hold_court.3090.c:0 "จัดนิทรรศการในดินแดนของชาว [different_culture_vassal.GetCulture.GetCollectiveNounNoTooltip] เพื่อแสดงความยิ่งใหญ่ของ [ROOT.GetCharacter.GetCulture.GetNameNoTooltip] ให้พวกเขาเห็น!"
 hold_court.3090.d:0 "ข้าพเจ้าไม่สามารถใช้ทรัพยากรในเรื่องนี้ได้"

 hold_court.3091.t:0 "การหลอมรวมอัตลักษณ์ทางวัฒนธรรม"
 hold_court.3091.desc:0 "บรรยากาศเต็มไปด้วยความคาดหวังขณะที่ [ROOT.GetCharacter.Custom2('RelationToMe', SCOPE.sC('same_culture_vassal'))] ของข้า [same_culture_vassal.GetTitledFirstName] เข้ามาใกล้\n\n"[ROOT.Char.Custom('FormOfAddressForLiege')|U] ข้ามาพร้อมข่าวร้าย แต่ก็มีวิธีแก้ปัญหานี้ มันชัดเจนขึ้นเรื่อยๆ ว่า [different_culture_vassal.GetCulture.GetCollectiveNoun] และ [same_culture_vassal.GetCulture.GetCollectiveNoun] กำลังกลายเป็น #EMP เหมือนกันเกินไป#! มันสำคัญอย่างยิ่งที่เราต้องแสดงให้พวกเขาเห็นว่าคือเรา [same_culture_vassal.GetCulture.GetCollectiveNounNoTooltip] ที่เป็นแนวหน้าของนวัตกรรม!""
 hold_court.3091.a:0 "มาจัดเทศกาลเพื่อเฉลิมฉลองวัฒนธรรม [same_culture_vassal.GetCulture.GetNameNoTooltip] อันรุ่มรวยของเรากันเถอะ!"
 hold_court.3091.b:0 "จัดนิทรรศการเพื่อแสดงความสำเร็จที่ยิ่งใหญ่ที่สุดของเรา"
 hold_court.3091.c:0 "ไม่มีความจำเป็นที่เราจะต้องแสดงความเหนือกว่าวัฒนธรรมอื่น"


