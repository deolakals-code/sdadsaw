l_english: 
 pregnancy.1001.t:0 "การตั้งครรภ์!"
 pregnancy.1001.d:0 "มีเด็กกำลังเติบโตในครรภ์ของข้า [real_father.GetTitledFirstNameNoTooltip] [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('real_father'))] ของข้า จะต้องภูมิใจ!"
 pregnancy.1001.a:0 "ดี!"

 pregnancy.1002.t:0 "การตั้งครรภ์!"
 pregnancy.1002.d:0 "โชคชะตายิ้มให้ข้า! [mother.GetTitledFirstNameNoTooltip] [spouse.Custom2('RelationToMe', SCOPE.sC('mother'))] ของข้า กำลังอุ้มท้องลูกของข้า!"
 pregnancy.1002.a:0 "ข้าพเจ้ารอไม่ไหวที่จะได้อุ้มทารกน้อยไว้ในอ้อมแขน!"

 pregnancy.1101.t.dead:0 "ชีวิตดำเนินต่อไป"
 pregnancy.1101.t.divorced:0 "พฤติการณ์พิเศษ"
 pregnancy.1101.desc.start:0 "มีเด็กกำลังเติบโตในครรภ์ของข้าพเจ้า และข้าพเจ้าไม่สงสัยเลยว่าเป็นบุตรของ"
 pregnancy.1101.desc.dead:0 "สามีผู้ล่วงลับของข้าพเจ้า [ex_spouse.GetTitledFirstName]"
 pregnancy.1101.desc.divorced:0 "อดีตสามีของข้าพเจ้า [ex_spouse.GetTitledFirstName]"
 pregnancy.1101.desc.end:0 "\n\nแม้ว่าพฤติการณ์แวดล้อมการตั้งครรภ์ครั้งนี้จะโชคร้าย แต่ข้าพเจ้าก็ยังยินดีได้ว่าบุตรที่ยังไม่เกิดของข้าพเจ้าจะไม่ถูกมองว่าเป็นลูกนอกสมรส"
 pregnancy.1101.a.dead:0 "หากเพียง แต่ [ex_spouse.GetFirstNameNoTooltip] จะอยู่ที่นี่เพื่อการนี้..."
 pregnancy.1101.a.divorced:0 "ข้าพเจ้าคงต้องแจ้งให้ [ex_spouse.GetFirstNameNoTooltip] ทราบทันที"

 pregnancy.1102.t:0 "$pregnancy.1101.t.divorced$"
 pregnancy.1102.desc:0 "บัดนี้เป็นที่ชัดเจนแล้วว่า [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('mother'))] ของข้าพเจ้า [mother.GetTitledFirstName] กำลังตั้งครรภ์ แม้ว่าเมื่อพิจารณาจากช่วงเวลาแล้ว ข้าพเจ้าไม่คิดว่าบุตรนั้นเป็นของข้าพเจ้า\n\nมีความเป็นไปได้สูงว่าบิดาที่แท้จริงคืออดีตสามีของ [mother.GetTitledFirstNamePossessiveNoTooltip], [ex_spouse.GetTitledFirstName]"
 pregnancy.1102.a:0 "อนิจจา"

 pregnancy.1103.opening:0 "ถึงอดีตสามีของ [mother.Custom2('RelationDescriptor', ROOT.Char)] ของข้าพเจ้า,"
 pregnancy.1103.opening_concubine:0 "ถึงอดีต [ROOT.Char.GetWomanMan] ของ [mother.Custom2('RelationDescriptor', ROOT.Char)] ของข้าพเจ้า,"
 pregnancy.1103.desc:0 "ข้าพเจ้าเขียนมาเพื่อแจ้งให้ท่านทราบว่าข้าพเจ้ากำลังตั้งครรภ์ และแน่นอนว่าเป็นบุตรของท่าน\n\nเนื่องจากเราสมรสกันเมื่อบุตรคนนี้ปฏิสนธิ จึงไม่มีมลทินของการเป็นลูกนอกสมรส เมื่อทารกเกิดมา พวกเขาจะเป็นที่รู้จักในฐานะทายาทโดยชอบธรรมของท่าน"
 pregnancy.1103.desc_concubine:0 "ข้าพเจ้าเขียนมาเพื่อแจ้งให้ท่านทราบว่าข้าพเจ้ากำลังตั้งครรภ์ และแน่นอนว่าเป็นบุตรของท่าน\n\nเนื่องจากเราอยู่ด้วยกันเมื่อบุตรคนนี้ปฏิสนธิ จึงไม่มีมลทินของการเป็นลูกนอกสมรส เมื่อทารกเกิดมา พวกเขาจะเป็นที่รู้จักในฐานะทายาทของท่าน"
 pregnancy.1103.a:0 "เช่นนั้นหรือ"

 pregnancy_not_first_child_message_title: "[spouse.Custom2('RelationToMe', SCOPE.sC('mother'))|U] ตั้งครรภ์"
 pregnancy_not_first_child_message:1 "[spouse.Custom2('RelationToMe', SCOPE.sC('mother'))] ของท่าน, [mother.GetTitledFirstName], กำลังอุ้มท้องบุตรของท่าน"

 pregnancy.2001.t:0 "นอกสมรส"
 pregnancy.2001.opening:0 "ข้าพเจ้าครุ่นคิดอย่างทรมานใจ และสัญญาณก็ชัดเจน ข้าพเจ้ากำลังตั้งครรภ์!"
 pregnancy.2001.father_is_married:0 "\n\n[real_father.Custom2('MyCharacterIntroduction', ROOT.Char)|U] คือบิดาอย่างไม่ต้องสงสัย แต่ [real_father.GetSheHe] สมรสแล้ว และแน่นอนว่าจะไม่ยอมรับบุตรของข้าพเจ้าเป็นของ [real_father.GetHerHis]!"
 pregnancy.2001.father_is_unmarried:0 "\n\n[ROOT.Char.Custom2('RelationToMe', SCOPE.sC('real_father'))] ของข้าพเจ้า [real_father.GetTitledFirstName] คือบิดาอย่างไม่ต้องสงสัย แต่หากปราศจากพันธะแห่งการสมรส ผู้คนจะกล่าวถึงบุตรของข้าพเจ้าว่าอย่างไร?"
 pregnancy.2001.a:0 "ข้าพเจ้าจะให้ทุกคนรู้ว่าใครคือบิดา!"
 pregnancy.2001.b:0 "[real_father.GetFirstNameNoTooltip] ต้องรู้ แต่ห้ามให้ผู้อื่นรู้!"
 pregnancy.2001.c:0 "ข้าพเจ้าบอก #EMP ผู้ใด #! ไม่ได้..."
 pregnancy.2001.c.tt:0 "ท่านหวังว่าจะไม่มีผู้ใดพบเจอ!"
 pregnancy.2001.d:0 "ข้าพเจ้าต้องให้หมอตำแยเตรียมยาขับ"

 pregnancy.2002.t:0 "โดยชายอื่น"
 pregnancy.2002.desc:0 "ข้าพเจ้าครุ่นคิดอย่างทรมานใจ และสัญญาณก็ชัดเจน ข้าพเจ้ากำลังตั้งครรภ์!\n\nนี่ไม่ใช่เรื่องน่ายินดี เพราะข้าพเจ้าไม่สงสัยเลยว่า [real_father.Custom2('MyCharacterIntroduction', ROOT.Char)] คือบิดาที่แท้จริง หาใช่ [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('spouse'))] ของข้าพเจ้า, [spouse.GetFirstName] ไม่!"
 pregnancy.2002.desc.polyamorous:0 "ข้าพเจ้าครุ่นคิดอย่างทรมานใจ และสัญญาณก็ชัดเจน ข้าพเจ้ากำลังตั้งครรภ์!\n\nข้าพเจ้าไม่สงสัยเลยว่า [real_father.Custom2('MyCharacterIntroduction', ROOT.Char)] คือบิดาที่แท้จริง หาใช่ [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('spouse'))] ของข้าพเจ้า, [spouse.GetFirstName] ไม่"
 pregnancy.2002.a:0 "ข้าพเจ้าสารภาพการนอกใจของข้าพเจ้า!"
 pregnancy.2002.b:0 "[real_father.GetFirstNameNoTooltip] จะรู้ เป็นการส่วนตัว"
 pregnancy.2002.c:0 "ต้องไม่มีผู้ใดรู้เป็นอันขาด"
 pregnancy.2002.c.tt:1 "#F ท่านหวังว่ามันจะยังคงเป็นความลับต่อไป#!"
 reveal_illegitimate_pregnancy_to_real_father_tt:0 "ความลับถูกเปิดเผยต่อ [real_father.GetFirstName]"
 pregnancy.2002.d:0 "ข้าพเจ้าต้องการยาขับของหมอตำแย"
 search_for_real_father_tt:0 "#F ข้าพเจ้าจะตามหาเขา!#!"

 pregnancy_treatment_fails_tt:0 "การรักษาล้มเหลว"

 pregnancy.2003.t:0 "การรอคอย"
 pregnancy.2003.desc_no_notice:0 "ข้าพเจ้ากังวลมานานว่ายา [ROOT.Char.Custom('Abortifacient')] จะได้ผล แต่บัดนี้ชัดเจนแล้ว\n\nข้าพเจ้าไม่ได้อุ้มท้องบุตรอีกต่อไป"
 pregnancy.2003.desc_pain:0 "ยา [ROOT.Char.Custom('Abortifacient')] ทำให้ข้าพเจ้าปวดท้องและอาเจียน แต่นั่นก็ดีกว่าการที่มันไม่ได้ผลเลย\n\nข้าพเจ้าไม่ได้ตั้งครรภ์อีกต่อไป"
 pregnancy.2003.a:0 "ข้าพเจ้าทำในสิ่งที่ต้องทำ"

 pregnancy.2004.t:0 "ความเจ็บป่วย"
 pregnancy.2004.desc:0 "ยา [ROOT.Char.Custom('Abortifacient')] ได้ยุติการตั้งครรภ์ของข้าพเจ้า แต่ ทำให้ข้าพเจ้าอาเจียนและมีไข้ หมอตำแยเตือนข้าพเจ้าเรื่องอาการไข้แล้ว แต่ความเจ็บปวดไม่สิ้นสุดลงอย่างที่นางบอก"
 pregnancy.2004.a:0 "ข้าพเจ้าผ่านมันไปได้"

 pregnancy.2005.t:0 "การรอคอย"
 pregnancy.2005.desc:0 "ข้าพเจ้าหวังว่ายา [ROOT.Char.Custom('Abortifacient')] จะยุติปัญหาของข้าพเจ้า แต่หมอตำแยเตือนข้าพเจ้าว่ามันอาจไม่เป็น เช่นนั้น\n\nข้าพเจ้าเกรงว่าความกลัวของนางจะมีมูล เพราะข้าพเจ้าไม่สงสัยเลยว่าบุตรยังคงเติบโตอยู่ในท้องของข้าพเจ้า"
 pregnancy.2005.a:0 "ไม่มีอะไรจะทำได้อีกแล้ว"

 pregnancy.2007.t:0 "การจากไป"
 pregnancy.2007.desc:0 "ทุกอย่างพร่ามัวไปหมดตั้งแต่ข้าพเจ้าดื่มยา [ROOT.Char.Custom('Abortifacient')] ร่างต่างๆ เคลื่อนไหวพร้อมเสียงพึมพำเงียบๆ ผ่านเตียงของข้าพเจ้า พร่าเลือนและเป็นสีเทา หลอมรวมเข้ากับขอบมืดของทัศนวิสัยของข้าพเจ้า ขณะที่เสียงกระซิบดังเข้มข้นขึ้น ความรู้สึกแสบร้อนในอกของข้าพเจ้าก็ เช่นกัน"
 pregnancy.2007.a:0 "ใครจะต้อนรับข้าพเจ้า?"

 pregnancy.2050.t:0 "โดยผู้อื่น"
 pregnancy.2050.desc.polyamorous:0 "ข้าพเจ้าครุ่นคิดอย่างทรมานใจ และสัญญาณก็ชัดเจน ข้าพเจ้ากำลังตั้งครรภ์!\n\nข้าพเจ้าไม่สงสัยเลยว่า [real_father.Custom2('MyCharacterIntroduction', ROOT.Char)] คือบิดาที่แท้จริง"
 pregnancy.2050.desc:0 "ข้าพเจ้าครุ่นคิดอย่างทรมานใจ และสัญญาณก็ชัดเจน ข้าพเจ้ากำลังตั้งครรภ์!\n\nนี่ไม่ใช่เรื่องน่ายินดี เพราะบัดนี้ทุกคนรู้แล้วว่าข้าพเจ้านอกใจ [spouse.Custom2('MyCharacterIntroduction', ROOT.Char)] ของข้าพเจ้า ข้าพเจ้าไม่สงสัยเลยว่า [real_father.Custom2('MyCharacterIntroduction', ROOT.Char)] คือบิดา..."

 pregnancy.2101.t:0 "ก่อนกำหนด"
 pregnancy.2101.desc_other_children:0 "ขณะที่ท้องของข้าพเจ้าโตขึ้น ความไม่สบายใจของข้าพเจ้าก็เพิ่มขึ้น เช่นกัน นี่ไม่ใช่ครั้งแรกที่ข้าพเจ้าตั้งครรภ์ แต่ความรู้สึกเป็นลางร้ายนี้เป็นสิ่งใหม่ มีบางอย่างผิดปกติ\n\nอาการปวดเกร็งเกิดขึ้นในตอนกลางคืน และเมื่อข้าพเจ้าตื่นขึ้นในตอนเช้า ข้าพเจ้าพบว่าผ้าปูที่นอนเปื้อนเลือดและเสียหาย"
 pregnancy.2101.desc_pain:0 "ขณะที่ท้องของข้าพเจ้าโตขึ้น ความไม่สบายใจของข้าพเจ้าก็เพิ่มขึ้น เช่นกัน นี่เป็นครั้งแรกที่ข้าพเจ้าตั้งครรภ์ แต่ความรู้สึกเป็นลางร้ายนี้ต้องไม่ถูกต้องแน่ มีบางอย่างผิดปกติ\n\nอาการปวดเกร็งเกิดขึ้นในตอนกลางคืน และเมื่อข้าพเจ้าตื่นขึ้นในตอนเช้า ข้าพเจ้าพบว่าผ้าปูที่นอนเปื้อนเลือดและเสียหาย"
 pregnancy.2101.desc:0 "เมื่อวันเวลาผ่านไป ความหวาดหวั่นของข้าพเจ้าก็เพิ่มขึ้นแทนที่ท้องของข้าพเจ้า แน่นอนว่าตอนนี้มันควรจะแสดงให้เห็นมากกว่านี้แล้ว? แน่นอนว่าบุตรควรจะแสดงตัวออกมาแล้ว?\n\nต้องมีบางอย่างผิดพลาดไปแน่ เพราะข้าพเจ้าไม่รู้สึกถึงประกายแห่งชีวิตภายในตัวข้าพเจ้าเลย"
 pregnancy.2101.a:0 "ข้าพเจ้าไม่ได้ตั้งครรภ์อีกต่อไป"

 pregnancy.2102.desc:0 ""บุตรมิได้ถูกกำหนดมาให้เกิด"\n\n[mother.Custom2('MyCharacterIntroduction', ROOT.Char)|U] รับรองกับข้าพเจ้าว่านี่คือวิถีแห่งชีวิต แต่มือของ [mother.GetHerHis] ยังคงวางอยู่บนท้องของ [mother.GetHerHis]"
 pregnancy.2102.a:0 "[mother.GetSheHe|U] ไม่ได้ตั้งครรภ์อีกต่อไป"

 pregnancy.3001.t:0 "การประพฤติตัวไม่เหมาะสม"
 pregnancy.3001.opening:0 "ขณะที่ท้องของ [mother.GetTitledFirstNamePossessive] โตขึ้น ก็ไม่ต้องสงสัยเลย [mother.GetSheHe|U] กำลังตั้งครรภ์!"
 pregnancy.3001.lovers_love:0 "[mother.GetSheHe|U] ไม่ได้กล่าวสิ่งใด แต่นี่อาจเป็นผลจากความรักของเราหรือไม่?"
 pregnancy.3001.lovers_not_love:0 "[mother.GetSheHe|U] ไม่ได้กล่าวสิ่งใด แต่นี่อาจเป็นผลจากความสัมพันธ์ทางกายของเราหรือไม่?"
 pregnancy.3001.not_lovers:0 "[mother.GetSheHe|U] ไม่ได้กล่าวสิ่งใด แต่นี่อาจเป็นผลจากการเกี้ยวพาราสีชั่วครู่ครั้งล่าสุดของเราหรือไม่?"
 pregnancy.3001.a:0 "ข้าพเจ้าต้องถาม [mother.GetHerHim] เกี่ยวกับเรื่องนี้ด้วยตนเอง"
 pregnancy.3001.a.tt:1 "ท่านเผชิญหน้ากับ [mother.GetFirstNameNoTooltip] เกี่ยวกับบุตร"
 pregnancy.3001.b:0 "ข้าพเจ้าอาจไม่มีวันรู้ แต่ข้าพเจ้าจะสงสัยตลอดไป..."
 pregnancy.3001.b.tt:0 "ท่านไม่ดำเนินการตามความสงสัยของท่าน"

 pregnancy.3002.t:0 "การประพฤติตัวไม่เหมาะสม"
 pregnancy.3002.lovers:1 "แน่นอนว่าข้าพเจ้าสงสัยเมื่อ [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('mother'))] ของข้าพเจ้า [mother.GetTitledFirstName] เริ่มแสดงอาการตั้งครรภ์ และบัดนี้ [mother.GetSheHe] ได้แจ้งให้ข้าพเจ้าทราบแล้วว่าเป็นบุตรของข้าพเจ้า"
 pregnancy.3002.not_lovers:1 "[mother.GetTitledFirstName] กำลังตั้งครรภ์ และ [mother.GetSheHe] ได้แจ้งให้ข้าพเจ้าทราบเป็นการส่วนตัวว่านี่เป็นผลจากการเกี้ยวพาราสีที่ผิดทำนองคลองธรรมของเรา"
 pregnancy.3002.spouse_exists:0 "\n\nโชคดีที่ [mother.Custom2('RelationToMe', SCOPE.sC('spouse'))] ของ [mother.GetHerHis], [spouse.GetTitledFirstName] คิดว่าเป็นบุตรของ [spouse.GetHersHis]"
 pregnancy.3002.a:0 "โอ้ [mother.GetFirstNameNoTooltip], หากมีเพียงเราและบุตรของเรา..."
 pregnancy.3002.b.not_again:0 "ข้าพเจ้าปล่อยให้เรื่องนี้เกิดขึ้นอีกได้อย่างไร?!"
 pregnancy.3002.b:0 "เรื่องนี้ต้องเป็นความลับ!"
 pregnancy.3002.a.tt:0 "บุตรของ [mother.GetShortUINamePossessiveNoTooltip] จะเกิดมาโดยไม่มีบิดาที่รู้จัก"
 pregnancy.3002.c:0 "ข้าพเจ้าจะให้ความจริงเป็นที่ประจักษ์!"


 pregnancy.3003.t:0 "ท้องที่นูนขึ้น"
 pregnancy.3003.desc:1 "[mother.GetTitledFirstName] มาหาข้าพเจ้า และข้าพเจ้ารู้ทันทีว่าทำไม [mother.GetSheHe|U] กำลังตั้งครรภ์ และมีความสงสัยในใจของ [mother.GetHerHis] น้อยพอๆ กับในใจของข้าพเจ้า ว่าใครคือบิดา บุตรที่เกิดนอกขอบเขตการสมรสที่ถูกต้องตามกฎหมายถูกกำหนดให้มีชีวิตเยี่ยงลูกนอกสมรส นั่นคือชะตากรรมที่ข้าพเจ้าต้องการสำหรับบุตรของข้าพเจ้าหรือ?"
 pregnancy.3003.desc_no_bastards:0 "[mother.GetTitledFirstName] มาหาข้าพเจ้า และข้าพเจ้ารู้ทันทีว่าทำไม [mother.GetSheHe|U] กำลังตั้งครรภ์ และมีความสงสัยในใจของ [mother.GetHerHis] น้อยพอๆ กับในใจของข้าพเจ้า ว่าใครคือบิดา ชีวิตแบบใดรอคอยบุตรของข้าพเจ้า ผู้เกิดนอกพันธะแห่งการสมรส?"
 pregnancy.3003.a:0 "เรื่องนี้ต้องเก็บเป็นความลับ!"
 pregnancy.3003.a.tt:0 "ความลับยังคงถูกซ่อนไว้ สำหรับตอนนี้"
 pregnancy.3003.b:0 "โอ้ นี่เป็นข่าวที่น่ายินดี!"

 pregnancy.3004.t:0 "ท้องที่นูนขึ้น"
 pregnancy.3004.desc:1 "[mother.GetTitledFirstName] มาหาข้าพเจ้า และข้าพเจ้ารู้ทันทีว่าทำไม [mother.GetSheHe|U] กำลังตั้งครรภ์ และมีความสงสัยในใจของ [mother.GetHerHis] น้อยพอๆ กับในใจของข้าพเจ้า ว่าใครคือบิดา\n\nอย่างไรก็ตาม ด้วยการสมรสของข้าพเจ้ากับ [spouse.GetFirstName] ไม่มีสิ่งใดที่ข้าพเจ้าสามารถทำได้นอกจากหวังว่าการมีส่วนร่วมของข้าพเจ้าจะยังคงเป็นความลับ"
 pregnancy.3004.a:0 "ข้าพเจ้าไม่เคยคิดว่ามันจะมาถึงจุดนี้"

 pregnancy.5001.t:0 ""ข้าพเจ้าต้องการรู้!""
 pregnancy.5001.desc:0 "[real_father_inquirer.GetTitledFirstName] ตามหาข้าพเจ้า วางมือบนท้องของข้าพเจ้า [real_father_inquirer.GetSheHe] มองข้าพเจ้าด้วยสีหน้ากังวล"
 pregnancy.5001.real_father:0 "\n\n"ข้าพเจ้าเพียงต้องการได้ยินท่านพูดมัน ข้าพเจ้ารู้อยู่แล้วว่าเป็นบุตรของข้าพเจ้า""
 pregnancy.5001.not_father:0 "\n\n"ได้โปรด ซื่อสัตย์กับข้าพเจ้า"\n\nสายตาของข้าพเจ้าจับจ้องไปที่โถงทางเดินด้านหลัง [real_father.GetHerHim] กังวลว่าจะมีคนเห็นเราอยู่ด้วยกัน"
 pregnancy.5001.a:0 "บุตรเป็นของท่าน [real_father.GetFirstNameNoTooltip]"
 pregnancy.5001.b:0 "ท่านไม่ใช่บิดาของบุตรข้าพเจ้า"

 pregnancy.5002.t:0 "สายเลือดของเรา"
 pregnancy.5002.love:0 ""แน่นอนว่าเป็นของท่าน [ROOT.Char.GetFirstNameNoTooltip]!"\n\nข้าพเจ้าลืมแม้กระทั่งกังวลว่าจะมีใครได้ยินเราหรือไม่ ความปิติและความสับสนถาโถมเข้าสู่ร่างกายของข้าพเจ้า ราวกับว่าคำอธิษฐานทั้งหมดของข้าพเจ้าได้รับการตอบรับ การรวมกันของเราได้รับพร แม้ว่าจะมี... ความซับซ้อนก็ตาม"
 pregnancy.5002.not_love:0 ""แน่นอนว่าเป็นของท่าน [ROOT.Char.GetFirstNameNoTooltip]!"\n\nข้าพเจ้ากังวลว่าจะมีใครได้ยิน [mother.GetHerHim] แต่เรายังคงอยู่ตามลำพังกับความเงียบ ดีแล้ว เช่นกัน เพราะทันใดนั้นข้าพเจ้าก็มีเรื่องให้คิดมากมาย"
 pregnancy.5002.a:0 "เราสองคน... บุตร..."
 pregnancy.5002.b:0 "นี่เป็นข่าวที่น่ายินดี และต้องแบ่งปัน!"

 pregnancy.5003.t:0 "ความคิดที่ผิด"
 pregnancy.5003.desc:1 "แม้ว่าข้าพเจ้าจะยังคงกดดันเรื่องนี้ [mother.GetTitledFirstName] ก็ยังคงยืนกราน "บุตรไม่ใช่ของท่าน [ROOT.Char.GetFirstNameNoTooltip]"\n\nข้าพเจ้าผิดไปจริงๆ หรือ?"
 pregnancy.5003.a:1 "[mother.GetSheHe] กำลังบอกความจริงกับข้าพเจ้าหรือไม่?"
 pregnancy.5003.a.tt:0 ""เวลาเท่านั้นที่จะบอกได้ว่าข้าพเจ้าถูกหรือไม่...""

 pregnancy_announcement_my_child_will_be_a_bastard:0 "บุตรของข้าพเจ้าจะเกิดมาเป็น [bastard|E] โดยมี [real_father.GetTitledFirstNameNoTooltip] เป็นบิดา"
 pregnancy_announcement_the_child_will_be_a_bastard_real_father:0 "บุตรของ [mother.GetTitledFirstNamePossessiveNoTooltip] จะเกิดมาเป็น [bastard|E] โดยมีข้าพเจ้าเป็นบิดาที่รู้จัก"
 pregnancy_announcement_the_child_will_be_a_bastard:0 "บุตรของ [mother.GetTitledFirstNamePossessiveNoTooltip] จะเกิดมาเป็น [bastard|E] โดยมี [real_father.GetTitledFirstNameNoTooltip] เป็นบิดา"

 pregnancy.6001.t:0 "เหนือข้อสงสัยทั้งปวง"
 pregnancy.6001.desc:0 "บุตรที่ข้าพเจ้าอุ้มท้องอยู่อาจเป็นลูกนอกสมรส แต่จะเติบโตขึ้นมารู้ว่าใครคือบิดา ไม่ว่า [real_father.GetTitledFirstName] [real_father.GetHerselfHimself] จะต้องการหรือไม่ก็ตาม"
 pregnancy.6001.a:0 "ข้าพเจ้าจะทำสิ่งที่ดีที่สุดเพื่อบุตรของข้าพเจ้าเสมอ"

 pregnancy.6002.t:0 "เหนือข้อสงสัยทั้งปวง"
 pregnancy.6002.desc:1 "[mother.GetTitledFirstName] ได้ประกาศชื่อข้าพเจ้าต่อสาธารณะว่าเป็นบิดาของบุตรที่ยังไม่เกิดของ [mother.GetHerHis]!"
 pregnancy.6002.married:0 "\n\n"ท่านทำ เช่นนี้ได้อย่างไร?!" [spouse.GetFirstName] มองข้าพเจ้าด้วย [spouse.Custom('GeneralTemperament')]"
 pregnancy.6002.unmarried_sympathetic:1 "\n\nเกิดนอกพันธะแห่งการสมรส บุตรจะมีชีวิตที่ยากลำบาก แต่อย่างน้อยก็จะรู้ความจริง"
 pregnancy.6002.unmarried_unsympathetic:1 "\n\nยังไม่พอหรือที่ [mother.GetSheHe] ต้องแบกรับภาระนี้ [mother.GetSheHe] ต้องลากข้าพเจ้าลงไปด้วยกับ [mother.GetHerHis] ด้วยหรือ?"
 pregnancy.6002.a:0 "ผู้คนจะว่าอย่างไร?"

 pregnancy.6003.t:0 "เหนือข้อสงสัยทั้งปวง"
 pregnancy.6003.desc:1 "[ROOT.Char.Custom2('RelationToMe', SCOPE.sC('mother'))] ของข้าพเจ้า, [mother.GetTitledFirstName], ได้สารภาพว่าไม่เพียง แต่การตั้งครรภ์ของ [mother.GetHerHis] เป็นผลมาจากการรวมกันที่ผิดทำนองคลองธรรมเท่านั้น แต่บิดาที่แท้จริงของบุตรที่ยังไม่เกิดของ [mother.GetHerHis] ก็ไม่ใช่ใครอื่นนอกจาก [real_father.GetTitledFirstName]!\n\nช่างเป็นความอัปยศที่ [mother.GetSheHe] นำมาสู่ตระกูลของข้าพเจ้า! [mother.GetSheHe] ทำ เช่นนี้กับข้าพเจ้าได้อย่างไร? กับเรา?"
 pregnancy.6003.a:0 "[real_father.GetFirstNameNoTooltip]?!"

 pregnancy.6004.t:0 "เหนือข้อสงสัยทั้งปวง"
 pregnancy.6004.desc:1 "[ROOT.Char.Custom2('RelationToMe', SCOPE.sC('mother'))] ของข้าพเจ้า, [mother.GetTitledFirstName], ได้แจ้งให้ทราบว่าไม่เพียง แต่บุตรที่ยังไม่เกิดของ [mother.GetHerHis] เป็นผลผลิตของการรวมกันที่ผิดกฎหมายเท่านั้น แต่บิดาก็ไม่ใช่ใครอื่นนอกจาก [real_father.Custom2('MyCharacterIntroduction', ROOT.Char)]!"
 pregnancy.6004.incest:0 "\n\nอะไรจะเกิดขึ้นกับบุตร ผู้ถูกสร้างขึ้นจากการรวมกันอันไม่บริสุทธิ์ เช่นนี้?"
 pregnancy.6004.mother_married:1 "\n\nนี่หมายความว่าอย่างไรต่อการสมรสของ [mother.GetHerHis] กับ [spouse.GetTitledFirstName]?"
 pregnancy.6004.mother_unmarried:1 "\n\nอะไรจะเกิดขึ้นกับบุตรของ [mother.GetHerHis] บัดนี้เมื่อทั้งโลกรู้แล้ว?"
 pregnancy.6004.a:1 "[mother.GetSheHe|U] ได้ ทำให้ตระกูลนี้ตกอยู่ในความสับสนวุ่นวาย!"

 pregnancy.6005.t:0 "เหนือข้อสงสัยทั้งปวง"
 pregnancy.6005.desc:0 "[mother.GetTitledFirstName] ได้แจ้งให้โลกทราบถึงบิดาของการตั้งครรภ์ที่ผิดกฎหมายของ [mother.GetHerHis] ข้าพเจ้าอยากจะหวังว่ามันไม่เป็น เช่นนั้น แต่แน่นอนว่าข้าพเจ้ารู้ว่าเป็นความจริง [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('real_father'))] ของข้าพเจ้า, [real_father.GetTitledFirstName], คือบิดาที่แท้จริงของบุตรที่ยังไม่เกิดของ [mother.GetHerHis]!"
 pregnancy.6005.a:0 "[real_father.GetFirstNameNoTooltip], ท่านทำได้อย่างไร?"

 pregnancy.6006.t:0 "เหนือข้อสงสัยทั้งปวง"
 pregnancy.6006.desc:1 "[real_father.Custom2('MyCharacterIntroduction', ROOT.Char)|U] ถูกระบุชื่อว่าเป็นบิดาที่แท้จริงของบุตรที่ยังไม่เกิดของ [mother.Custom2('MyCharacterIntroductionNoComma', ROOT.Char)]!"
 pregnancy.6006.real_father_married:1 "\n\n[real_father.GetSheHe] ไม่คำนึงถึงความสำคัญของการสมรสของ [real_father.GetHerHis] กับ [spouse.Custom2('HerHisCharacterIntroduction', SCOPE.sC('real_father'))] เลยหรือ?"
 pregnancy.6006.real_father_unmarried:1 "[real_father.GetSheHe] ไม่คำนึงถึงเกียรติยศของตระกูลของ [real_father.GetHerHis] เลยหรือ?"
 pregnancy.6006.a:0 "บุตรนอกสมรสคนนี้จะมีความหมายต่อเราอย่างไร?"
 
 # For polyamorous faith reveal
 pregnancy.6999.t:0 "โดยชายอื่น"
 pregnancy.6999.desc:1 "[ROOT.Char.Custom2('RelationToMe', SCOPE.sC('mother'))] ของข้าพเจ้า, [mother.GetTitledFirstName], ได้แจ้งให้ทราบว่า [mother.GetSheHe] กำลังตั้งครรภ์บุตรของ [real_father.Custom2('MyCharacterIntroduction', ROOT.Char)] แม้ว่าบุตรจะไม่ใช่ของข้าพเจ้า ข้าพเจ้าก็ยังคงเป็น [ROOT.Char.Custom('WifeHusband')] ของ [mother.GetHerHis] และเป็นหน้าที่ของข้าพเจ้าที่จะดูแล [mother.GetHerHim] ในช่วงหลายเดือนข้างหน้า"
 pregnancy.6999.a:1 "หน้าที่ที่ข้าพเจ้าจะปฏิบัติ"
