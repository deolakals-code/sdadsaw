l_english: 
 sell_titles.0001.opening:0 "[vassal.Custom2('AppropriateGreetingPositive', ROOT.Char )]"
 sell_titles.0001.desc.dislike:0 "ข้ามิได้สนใจในคำสัญญาลมๆ แล้งๆ ที่ท่านนำมาขาย แต่หากท่านต้องการทองคำอย่างยิ่งยวดถึงเพียงนั้น ข้าเชื่อว่าเราคงพอจะหาข้อตกลงกันได้"
 sell_titles.0001.desc.normal:0 "มิใช่เกียรติยศที่สูงส่งกว่านี้ที่ข้าแสวงหา [vassal.Custom2('RelationToMeShort', ROOT.Char)]ของข้า แต่หากท่านต้องการทองคำ ข้าเชื่อว่าเราคงพอจะหาข้อตกลงกันได้"
 sell_titles.0001.a:0 "ข้าต้องการเงินเพื่อประโยชน์แห่งอาณาจักร ท่านก็เห็น"
 sell_titles.0001.b:0 "นี่มิใช่การต่อรองราคาในตลาดไพร่!"

 sell_titles.0002.opening:0 "[friend.Custom2('AppropriateGreetingPositive', ROOT.Char )]"
 sell_titles.0002.desc:1 "ข้าได้ยินมาว่าท่านกำลังเสนอตำแหน่งแลกกับ "ของขวัญ"\n\nสหายข้า หากท่านต้องการทองคำ ท่านควรบอกให้ข้ารู้!"
 sell_titles.0002.a:0 "ท่านคือสหายแท้ [friend.GetFirstNameNoTooltip]!"
 sell_titles.0002.b:0 "ข้ารับสิ่งนี้ไว้มิได้"

 sell_titles.0003.desc:0 "ข้ารู้สึกเป็นเกียรติอย่างยิ่งกับตำแหน่งที่ท่านมอบให้ และแน่นอนว่าข้าจะสนับสนุนตำแหน่งเหล่านั้นตามสมควรและเหมาะสม!\n\nข้ามิอาจขอบคุณท่านได้เพียงพอสำหรับเกียรติยศนี้ ไม่ว่าท่านจะเรียกร้องสิ่งใด ข้าจะ ทำให้สุดความสามารถเพื่อท่าน"
 sell_titles.0003.a:0 "ท่านคือข้าหลวงผู้ภักดีและซื่อสัตย์"
 sell_titles.0003.a.flavor:0 "ข้าหวังว่าทุกคนจะเข้าใจว่าข้ากำลังใจกว้างอย่างยิ่ง"

 sell_titles.0004.opening:0 "[vassal.Custom2('AppropriateGreeting', ROOT.Char )]"
 sell_titles.0004.desc:0 "ข้าได้ทราบมาว่าท่านกำลังขายตำแหน่งทิ้ง ทั้งๆ ที่ตัวข้าเองยังได้รับเกียรติไม่เพียงพอต่อการรับใช้ของข้า\n\nอันที่จริง เมื่อพิจารณาถึงความสำเร็จที่ข้าทำเพื่อท่านแล้ว ตำแหน่งใหม่ๆ สักสองสามตำแหน่งก็คงจะเหมาะสม"
 sell_titles.0004.a:0 "เช่นนั้นก็จงเป็นไป"
 sell_titles.0004.b:0 "อย่าได้โอ้อวดตัวเอง!"

 sell_titles.0005.desc:0 "แม้ว่าจะมิได้มาพร้อมกับที่ดินศักดินา แต่ภาระผูกพันที่เกี่ยวข้องกับตำแหน่งที่ท่านเสนอนั้นก็เอื้อเฟื้อเผื่อแผ่เกินกว่าที่ข้าจะเคยร้องขอได้\n\nแน่นอนว่าข้าจะให้เกียรติความเอื้อเฟื้อ เช่นนี้ด้วยของขวัญที่เหมาะสม!"
 sell_titles.0005.a:0 "เป็น เช่นนั้นรึ? โอ้"
 sell_titles.0005.b:0 "นั่นมิใช่สิ่งที่... สาปแช่งเจ้า!"

 sell_titles.0006.desc:0 "แม้ข้ารู้ว่าข้าเสี่ยงต่อความพิโรธของท่าน แต่เกียรติยศของข้าเรียกร้องให้ข้าต้องพูด ข้อเสนอของท่านที่จะมอบ "ตำแหน่ง" แลกกับ "ของขวัญ" นั้นขับเคลื่อนด้วยความโลภอันต่ำช้าเท่านั้น เห็นได้ชัดเจน!\n\nเกียรติยศของข้ามาจากความเป็นขุนนาง มิใช่ความมั่งคั่ง แต่สำหรับท่านแล้วดูเหมือนจะเป็นอย่างอื่น!"
 sell_titles.0006.a:0 "เจ้ากล้าดีอย่างไรมา ทำให้ข้าอับอายถึงเพียงนี้?!"

 sell_titles.1002.t:0 "ขายตำแหน่ง: ข้อเสนออันพอประมาณ"
 sell_titles.1002.desc:1 "[merchant.GetTitledFirstName] พ่อค้าผู้มั่งคั่งบางคน ได้ยินถึงความพยายามของข้าในการขายตำแหน่งที่ไม่จำเป็นทิ้งไป ทว่า [merchant.GetSheHe|U]มีข้อเสนอที่อาจหาญกว่านั้นมาก:\n\n"หากข้านำเสนอหลักฐานว่าข้ามีความเกี่ยวข้องห่างๆ กับราชวงศ์[ROOT.Char.GetDynasty.GetBaseName] ท่านจะสนับสนุนคำกล่าวอ้างของข้าหรือไม่?"\n\nข้อเสนอนี้ไร้สาระอย่างสิ้นเชิง แต่[merchant.GetSheHe]ก็ครอบครองทองคำจำนวนมหาศาลอย่างน่าขัน..."
 sell_titles.1002.a.muslim:0 "แม้ แต่มูฮัมหมัดก็ยังเคยเป็นพ่อค้า!"
 sell_titles.1002.a:0 "ให้เราเฉลิมฉลองการกลับมาของ[merchant.Custom('SisterBrother')]ที่หายสาบสูญไปนานของข้า!"
 sell_titles.1002.b:0 "ชื่อของข้าไม่มีไว้ขาย ไม่ว่าในกรณีใดๆ!"

 sell_titles.1004.t:0 "ขายตำแหน่ง: การต่อรองอันยอดเยี่ยม"
 sell_titles.1004.desc:0 "เหนือความคาดหมาย [merchant.GetTitledFirstName] พ่อค้าผู้กลายเป็นญาติห่าง ๆ มาก ๆ ได้พิสูจน์ [merchant.GetHerselfHimself] ว่าเป็นนักรบที่ยอดเยี่ยม!\n\nใครจะคิดว่าสามัญชนจะสามารถบรรลุถึงจุดสูงสุด เช่นนี้ได้?"
 sell_titles.1004.a:0 "บางที[merchant.GetSheHe]อาจมีสายเลือดขุนนางจริงๆ ก็เป็นได้?"

 sell_titles.1005.desc:0 "ในช่วงเวลาตั้งแต่ข้ายอมรับ [merchant.GetTitledFirstNamePossessive]- ข้าหมายถึง ตั้งแต่ [merchant.GetSheHe] กลับมาสู่ครอบครัว [merchant.GetSheHe] ได้พิสูจน์ [merchant.GetHerselfHimself] ว่าเป็นที่นิยมในหมู่ [ROOT.Char.GetFaith.AltPriestTermPlural] เห็นได้ชัดว่า [merchant.GetSheHe] ค่อนข้างฉลาด ฉลาดกว่าที่คาดหวังจากสามัญชนธรรมดามาก"
 sell_titles.1005.a:0 "แม้ แต่ทองคำก็ยังพบได้ในหมู่หินธรรมดา ข้าว่านะ"

 sell_titles.1006.desc:0 "บางทีมุมมองใหม่ ๆ #EMP อาจจะ#! ดีบ้างเป็นครั้งคราว? [merchant.GetTitledFirstName] ซึ่งมีทักษะเพียงพอที่จะได้รับตำแหน่งในตระกูลของข้าแล้ว ได้พิสูจน์ [merchant.GetHerselfHimself] ว่ามีความเชี่ยวชาญอย่างไม่น่าเชื่อในการนำทางผ่านอันตรายในราชสำนักของข้า บางครั้งข้าถึงกับสงสัยว่า [merchant.GetSheHe] รู้เรื่องราวที่เกิดขึ้นมากกว่าข้าเสียอีก!"
 sell_titles.1006.a:0 "ขอบคุณ[ROOT.Char.GetFaith.HighGodName]ที่[merchant.GetSheHe]เป็นหนี้บุญคุณข้าสำหรับเรื่องนี้"

 sell_titles.1007.t:0 "ขายตำแหน่ง: แกะดำ"
 sell_titles.1007.desc:0 "มีเหตุผลที่สามัญชนมิได้ถูก แต่งตั้งเป็นขุนนางตามอำเภอใจ นับตั้งแต่[merchant.GetTitledFirstName]เข้าร่วมราชสำนักของข้า [merchant.GetSheHe]ก็ไม่ได้เป็นอะไรนอกจากความน่าอับอาย!\n\nข้าสนับสนุนคำกล่าวอ้างของ[merchant.GetHerHis]ว่าเป็นคนในตระกูลข้า ดังนั้นจึงไม่มีอะไรจะทำได้ในตอนนี้ แต่มันเป็นความผิดพลาดที่ข้าคงจะไม่ทำอีก!"
 sell_titles.1007.a:0 "ช่างน่าละอาย..."
