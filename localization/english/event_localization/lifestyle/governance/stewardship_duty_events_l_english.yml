l_english: 

 # The Diplomatic craft — Mediating between disagreeing subjects, by Mathilda Bjarnehed 
 stewardship_duty.0001.t:0 "แบบฝึกหัดการไกล่เกลี่ย"
 stewardship_duty.0001.start.desc:0 "เมื่อเสียงเอะอะดังมาถึงหูข้าอีกครา ข้าสะกดกลั้นสัญชาตญาณที่จะหันหลังกลับ การทะเลาะวิวาทไม่หยุดหย่อนของ"
 stewardship_duty.0001.vassals.desc:0 "ข้าหลวงของข้า [arguer_1.GetTitledFirstName] และ [arguer_2.GetTitledFirstName]"
 stewardship_duty.0001.vassalandcourtier.desc:0 "ข้าหลวงของข้า [arguer_1.GetTitledFirstName] และ [arguer_2.Custom2('MyCharacterIntroduction', ROOT.Char)]"
 stewardship_duty.0001.end.desc:0 "นั้นมากพอที่จะ ทำให้[ROOT.Char.GetWomanMan]ใดๆ บ้าคลั่งได้ — ต้องทำอะไรสักอย่าง!\n\nข้าอาจจะจัดการสถานการณ์นี้เป็นแบบฝึกหัดการไกล่เกลี่ย หรือแอบฟังแล้วค่อยเข้าไปแสดงความเห็นใจกับฝ่ายใดฝ่ายหนึ่งภายหลัง..."
 stewardship_duty.0001.a:0 "พยายาม ทำให้พวกเขาเข้าใจเหตุผล"
 stewardship_duty.0001.b:0 ""เฮอะ, [arguer_2.GetFirstNameNoTooltip] มันเป็นพวก [arguer_2.Custom2('InsultNoun', ROOT.Char)] จริงๆ!""
 stewardship_duty.0001.c:0 ""ท่านเชื่อ[arguer_1.GetFirstNameNoTooltip]ไหม? [arguer_1.GetSheHe|U]ช่างกล้าเสียจริง!""
 stewardship_duty.0001.a.success.tt:0 "การไกล่เกลี่ยของข้าสำเร็จผล"
 stewardship_duty.0001.a.failure.tt:0 "ข้ากลับกลายเป็นผู้สอดรู้สอดเห็นที่ไม่ละเอียดอ่อน"
 stewardship_duty_0001_mediation_success.tt:0 "[arguer_1.GetShortUIName|U] และ [arguer_2.GetShortUIName] มี[opinion|e]ต่อกันดีขึ้น"

 # Conflict at the Council, by Mathilda Bjarnehed
 stewardship_duty.0017.t:0 "เสียงแห่งเหตุผล"
 stewardship_duty.0017.start.desc:0 "การประชุมสภาอีกครั้ง ความขัดแย้งอีกครา [councillor_1.GetCouncilTitle] [councillor_1.GetFirstName] และ [councillor_2.GetCouncilTitle] [councillor_2.GetFirstName] กำลังโต้เถียงกันอย่างรุนแรงเกี่ยวกับ"
 stewardship_duty.0017.war.desc:0 "สงครามที่ดำเนินอยู่"
 stewardship_duty.0017.election.desc:0 "การเลือกผู้สืบทอดตำแหน่งของข้า"
 stewardship_duty.0017.building_projects.desc:0 "โครงการก่อสร้างที่กำลังจะมาถึง"
 stewardship_duty.0017.troop_training.desc:0 "ระเบียบการฝึกฝนกองกำลัง"
 stewardship_duty.0017.charity_projects.desc:0 "โครงการการกุศลครั้งต่อไปของข้า"
 stewardship_duty.0017.religious_minorities.desc:0 "ประเด็นชนกลุ่มน้อยทางศาสนา"
 stewardship_duty.0017.health_issues.desc:0 "โรคระบาดที่แพร่กระจาย"
 stewardship_duty.0017.end.desc:0 "\n\nในฐานะ [ROOT.GetCharacter.GetTitleAsNameNoTooltip] ข้าสามารถ ทำให้พวกเขาสงบลงได้ด้วยคำพูดเพียงคำเดียว แต่ข้ามีความคิดที่ดีกว่านั้น การแสวงหาทางการทูตของข้า ทำให้ข้ามีวิจารณญาณในการจัดการสถานการณ์ เช่นนี้เพื่อ ทำให้ทุกคนพอใจ"
 stewardship_duty.0017.a:0 "เข้าข้าง [councillor_1.GetFirstNameNoTooltip] โดยไม่ ทำให้ [councillor_2.GetFirstNameNoTooltip] ขุ่นเคือง"
 stewardship_duty.0017.b:0 "เข้าข้าง [councillor_2.GetFirstNamePossessiveNoTooltip] โดยไม่ ทำให้ [councillor_1.GetFirstNameNoTooltip] ขุ่นเคือง"
 stewardship_duty.0017.c:0 "หาข้อประนีประนอมที่ ทำให้ทุกคนพอใจ"
 stewardship_duty.0017.c.criticial_success.tt:0 "ข้าจัดการประนีประนอมได้อย่างยอดเยี่ยม"
 stewardship_duty.0017.c.criticial_success.desc:0 "ข้าจัดการประนีประนอมได้อย่างยอดเยี่ยม ทำให้ทั้ง [councillor_1.GetFirstName] และ [councillor_2.GetFirstName] พอใจ"
 stewardship_duty.0017.c.success.tt:0 "ข้าจัดการประนีประนอมได้ดี"
 stewardship_duty.0017.c.success.desc:0 "ข้าจัดการประนีประนอมได้ดี ทำให้ทั้ง [councillor_1.GetFirstName] และ [councillor_2.GetFirstName] สงบลง"
 stewardship_duty.0017.c.failure.tt:0 "ข้าล้มเหลวในการหาข้อประนีประนอม"
 stewardship_duty.0017.c.failure.desc:0 "ข้าล้มเหลวในการหาข้อประนีประนอม ทำให้ทั้ง [councillor_1.GetFirstName] และ [councillor_2.GetFirstName] ผิดหวัง"

 # Unwanted Pregnancy, by Sean Hughes
 stewardship_duty.1055.t:0 "การตั้งครรภ์ที่ไม่พึงประสงค์"
 stewardship_duty.1055.desc:0 "ฉากอันน่าตื่นเต้นเปิดเผยขึ้นในห้องโถงรับรองของข้า เมื่อ [new_mothers_parent.Custom2('MyCharacterIntroduction', ROOT.Char)] กล่าวหา [new_father.Custom2('MyCharacterIntroduction', ROOT.Char)] ว่า ทำให้ [new_mothers_parent.GetHerHis] [new_mothers_parent.Custom2('RelationToMeShort', new_mother)][new_mother.Custom('Governance_1055_OutOfWedlock')] ตั้งครรภ์\n\n[new_fathers_parent.GetTitledFirstName] อ้างอย่างขุ่นเคืองว่าไม่มีหลักฐานพิสูจน์ความผิดของบุตรชายตน "และถึง แม้ว่าจะเป็นเขาจริง ก็ย่อมเป็นความผิดของ[new_mother.GetFirstNamePossessive] ที่เป็นหญิงสำส่อน!"\n\nการโต้เถียงกำลังร้อนแรงขึ้น และข้าต้องทำอะไรสักอย่างก่อนที่เรื่องราวจะบานปลาย "
 stewardship_duty.1055.a:0 "ท่านจะได้รับความยุติธรรมตามที่ปรารถนา [new_mothers_parent.GetFirstNameNoTooltip]"
 stewardship_duty.1055.b:0 "[new_father.GetFirstNameNoTooltip] ไม่มีมีความผิด เขาไม่ได้ติดค้างอะไร [new_mothers_parent.GetFirstNameNoTooltip] เลย!"
 stewardship_duty.1055.e:0 "เหตุใดเจ้าทั้งสองจึงมารบกวนข้าด้วยเรื่องทะเลาะวิวาทเล็กน้อย เช่นนี้!?"

 # Wealth Aplenty, by Sean Hughes
 stewardship_duty.1062.t:0 "ความมั่งคั่งเหลือเฟือ"
 stewardship_duty.1062.desc:0 "คลังสมบัติของข้าเต็มไปด้วยทองคำและเงินตรา และค่าใช้จ่ายทั้งหมดได้รับการดูแลแล้ว ในฐานะ[ROOT.Char.GetLadyLord]ผู้มั่งคั่ง ข้า[SelectLocalization(IsLandlessAdventurer(ROOT.Char),'อาจจะ','ถูกคาดหวังให้')]มอบอุปถัมภ์แก่ศิลปินหรือนักปราชญ์บางประเภท\n\nโชคดีเหลือเกิน ผู้มีแววสามคนเพิ่งเดินทางมาถึง [ROOT.Char.GetPrimaryTitle.GetNameNoTierNoTooltip]... แต่จะมีใคร ทำให้ข้าประทับใจได้หรือไม่?"
 stewardship_duty.1062.a:0 "[client_1.GetTitledFirstNameNoTooltip] เป็นที่รู้จักในด้านการสร้างสวนอันงดงาม"
 stewardship_duty.1062.b:0 "บทกวีทางศาสนาของ[client_2.GetTitledFirstNamePossessiveNoTooltip] ได้สร้างความประทับใจแก่ผู้คนมากมาย"
 stewardship_duty.1062.c:0 "การค้นพบของ [client_3.GetTitledFirstNameNoTooltip] แสดงให้เห็นถึงศักยภาพ"
 stewardship_duty.1062.d:0 "ไม่ ข้ามีแผนอื่นสำหรับเงินนั้น..."
 stewardship_duty.1062.e:0 "ความคาดหวังรึ? ชิ! ข้าจะไปชื่นชมความรุ่งโรจน์แห่งสมบัติของข้า!"

 stewardship_duty.1063.t:0 "การต่ออายุการอุปถัมภ์"
 stewardship_duty.1063.desc:0 "หลังจาก 5 ปี เงินทุนที่ข้าจัดสรรไว้สำหรับการอุปถัมภ์[client.Custom('Governance_1062_Client')]ของข้า [client.GetTitledFirstName] ได้หมดลงแล้ว บัดนี้ข้าสามารถเลือกได้ว่าจะต่ออายุการอุปถัมภ์ไปอีก 5 ปีหรือไม่ หรือจะปล่อย[client.GetHerHim]ไป"
 stewardship_duty.1063.a:0 "ขยายเวลาการอุปถัมภ์ของข้าไปอีกวาระหนึ่ง"
 stewardship_duty.1063.b:0 "[client.GetSheHe|U]ทำงานได้ดี มอบรางวัลพิเศษให้[client.GetHerHim]!"
 stewardship_duty.1063.c:0 "บริการของ[client.GetHerHis|U]ไม่เป็นที่ต้องการอีกต่อไป"

 stewardship_duty.1064.desc:0 "[client.Custom('Governance_1062_Client_U')]ของข้าได้ออกจากราชสำนักไปแล้ว"
 stewardship_duty.1065.desc:0 "[client.Custom('Governance_1062_Client_U')|U]ของข้าได้สิ้นชีพแล้ว"
 stewardship_duty.1065.guilty.desc:0 "ข้าสังหาร[client.Custom('Governance_1062_Client_U')]ของข้า"
 stewardship_duty.1066.desc:0 "ข้าจองจำ[client.Custom('Governance_1062_Client_U')]ของข้า"

 stewardship_duty.1068.desc.a:0 "ข้าหลวงประทับใจในสวนของข้า"
 stewardship_duty.1068.desc.b:0 "[ROOT.Char.GetFaith.AltPriestTermPlural|U]ประทับใจใน[client.Custom('Governance_1062_Client_U')]ของข้า"
 stewardship_duty.1068.desc.c:0 "[client.Custom('Governance_1062_Client_U')]ทำการค้นพบใหม่"

 # Serf Refugees, by Sean Hughes
 stewardship_duty.1071.t:0 "ผู้ลี้ภัยทาสติดที่ดิน"
 stewardship_duty.1071.desc:0 "ทาสติดที่ดินจำนวนมากหลั่งไหลเข้ามาใน [target_county.GetName] จาก [origin_county.GetName] ที่อยู่ใกล้เคียง พวกเขาอ้างว่ากำลังหลบหนีจากการปกครองอันกดขี่ของ [origin_county_owner.Custom2('MyCharacterIntroduction', ROOT.Char)] และปรารถนาที่จะอาศัยอยู่ในอาณาเขตของข้าแทนที่จะเป็นของ[origin_county_owner.GetHerHis]\n\nตามกฎหมายแล้ว พวกเขายังคงผูกพันอยู่กับ [origin_county_owner.GetFirstName] แต่หากข้าปล่อยให้พวกเขาตั้งรกรากในดินแดนของข้า ก็แทบจะเป็นไปไม่ได้เลยที่[origin_county_owner.GetHerHim]จะพิสูจน์ได้ว่าพวกเขาเป็นทาสติดที่ดินของ[origin_county_owner.GetHerHis]จริง"
 stewardship_duty.1071.a:0 "ส่งคืนทาสติดที่ดินให้แก่ [origin_county_owner.GetFirstNameNoTooltip] อย่างมีเมตตา"
 stewardship_duty.1071.b:0 "ส่งคืนทาสติดที่ดิน แต่ตำหนิ [origin_county_owner.GetFirstNameNoTooltip] อย่างรุนแรง"
 stewardship_duty.1071.c:0 "นำทาสติดที่ดิน #EMP ของข้า#! ไปยังไร่นาแห่งใหม่ของพวกเขา..."
 stewardship_duty.1071.c.compassionate:0 "ข้าจะให้ที่ลี้ภัยแก่พวกเขาจาก [origin_county_owner.GetFirstNameNoTooltip]..."
 stewardship_duty.1071.c.flavor:0 "...และหวังว่า [origin_county_owner.GetFirstName] จะไม่ล่วงรู้ถึงการมีส่วนร่วมของข้าในเรื่องนี้!"

 stewardship_duty.1072.opening:0 "[origin_county_owner.Custom2('AppropriateGreeting', ROOT.Char)]"
 stewardship_duty.1072.desc.rival:0 "ข้ารู้ว่าท่านได้ขโมยทาสติดที่ดินของข้าไป ข้าอาจไม่มีหนทางใดที่จะได้พวกเขากลับคืนมา แต่อย่าคิดว่าข้าจะลืมการล่วงละเมิดนี้ ท่านได้สร้างความเป็นศัตรูกับข้าแล้ว — หวังว่ามันจะคุ้มค่านะ"
 stewardship_duty.1072.desc.relationship:0 "เหตุใดท่านจึงขโมยทาสติดที่ดินของข้าไป!? ข้าตกใจและเจ็บปวดอย่างยิ่งที่ท่านทรยศข้า เช่นนี้... ข้าไม่รู้ว่าข้าจะมองท่านเหมือนเดิมได้อีกหรือไม่หลังจากนี้"
 stewardship_duty.1072.desc.vassal:0 "ข้ารู้ว่าท่านได้นำทาสติดที่ดินของข้าไปตั้งรกรากใหม่ในดินแดนของท่าน เหตุใดท่านจึงทำ เช่นนี้กับข้าหลวงของท่านเอง? ข้ามิได้ปฏิบัติหน้าที่ในการจ่ายภาษีที่ท่านพึงได้รับอย่างครบถ้วนดอกหรือ?\n\nเมื่อไม่มีทาสติดที่ดินทำงานในทุ่งนาของข้า ข้าก็ไม่สามารถเพาะปลูกพืชผลใดๆ ได้ ท่านอาจจะขโมยที่ดินไปเสียเองเลยก็ได้! นี่คือการล่วงละเมิดที่ข้าจะไม่มีวันลืมในเร็ววัน"
 stewardship_duty.1072.desc.subvassal:0 "ข้ารู้ว่าท่านได้นำทาสติดที่ดินของข้าไปตั้งรกรากใหม่ในดินแดนของท่าน การกระทำ เช่นนี้เป็นการบ่อนทำลายโครงสร้างสังคมของเรา!\n\nแม้ว่าบัดนี้ข้าจะทำอะไรไม่ได้ แต่จงมั่นใจเถิดว่า [origin_county_owner_liege.GetTitledFirstName] จะทราบว่าเหตุใดปีนี้ข้าจึงมีภาษีให้[origin_county_owner_liege.GetHerHim]น้อยลง"
 stewardship_duty.1072.a:0 "นั่นคือทาสติดที่ดินของท่านรึ? ข้าขออภัย ข้าจะส่งพวกเขาคืน"
 stewardship_duty.1072.b:0 "จะบ่นไปเท่าใดก็ได้ มันไม่ได้เปลี่ยนแปลงอะไร"
 stewardship_duty.1072.b.compassionate:0 "นี่เป็นความผิดของท่าน ท่านไม่ควรทารุณกรรมพวกเขา"

 # Vassal Factionalism — Persuade a vassal to leave a faction for 10 years, by Sean Hughes
 stewardship_duty.4010.t:0 "การแบ่งฝักฝ่ายของข้าหลวง"
 stewardship_duty.4010.desc.start:0 "[faction_member.GetTitledFirstName] ได้ใช้อิทธิพลของ[faction_member.GetHerHis]เพื่อผลักดันความก้าวหน้าของ"
 stewardship_duty.4010.desc.independence:1 "[targeting_faction.GetName] พวกเขากำลังพยายามแยกตัวออกจากการปกครองของข้า โดยอ้างว่าข้าไม่ใช่เจ้าเหนือหัวโดยชอบธรรมของพวกเขา"
 stewardship_duty.4010.desc.liberty:0 "[targeting_faction.GetName] พวกเขาพยายาม ทำให้กฎหมายหลายฉบับใน [ROOT.Char.GetPrimaryTitle.GetName] เป็นโมฆะ ซึ่งพวกเขาเชื่อว่าเป็นการแทรกแซงสิทธิตามประเพณีของ[faction_member.Custom('StatecraftGetVassalType')]"
 stewardship_duty.4010.desc.claimant:2 "[targeting_faction.GetName] โดยเชื่อว่าผู้นำหุ่นเชิดของพวกเขาจะเป็นผู้ปกครองที่ดีกว่าข้าในท้ายที่สุด"
 stewardship_duty.4010.desc.peasant:0 "[targeting_faction.GetName] พวกเขาไม่พอใจที่ต้องเป็นข้าแผ่นดินของผู้ที่พวกเขาถือว่าเป็น [ROOT.Char.Custom2('GetUnbelieverAndForeignerTerm', faction_member)] และปรารถนาที่จะมีผู้ปกครอง เช่น [faction_leader.GetTitledFirstName] ผู้ ซึ่งมีวัฒนธรรมและความเชื่อเดียวกันกับพวกเขาแทน"

 stewardship_duty.4010.desc.end:0 "\n\nแม้ข้าจะไม่สงสัยในความเชื่อมั่นของ[faction_member.GetFirstNamePossessiveNoTooltip] แต่[faction_member.GetSheHe]ก็เป็นเพียงมนุษย์ หากข้าสามารถโน้มน้าวให้[faction_member.GetHerHim]ยับยั้งกิจกรรมเหล่านี้ได้ ก็จะ ทำให้ข้ารวบรวมอำนาจเหนือข้าหลวงของข้าได้ง่ายขึ้น"
 stewardship_duty.4010.bribe:0 "ของขวัญอันงามจะเปลี่ยนใจ[faction_member.GetHerHis]ได้"
 stewardship_duty.4010.bribe.flavor:0 "[faction_member.GetWomenMen]ที่เห็นแก่ตัวจะมีแนวโน้มที่จะรับสินบนมากกว่า"
 stewardship_duty.4010.favor:0 "หาก[faction_member.GetSheHe]ช่วยข้าตอนนี้ ข้าจะตอบแทนบุญคุณ"
 stewardship_duty.4010.favor.flavor:0 "[faction_member.GetWomenMen]ที่เห็นแก่ตัวหรือมีเมตตาจะมีแนวโน้มที่จะยอมรับข้อเสนอนี้มากกว่า"
 stewardship_duty.4010.prestige:0 "การประจบสอพลอแบบเก่าๆ นั้นดีในการสร้างแรงบันดาลใจให้เกิดความภักดี"
 stewardship_duty.4010.prestige.flavor:0 "[faction_member.GetWomenMen]ที่หยิ่งยโสหรือมีเกียรติมีแนวโน้มที่จะหวั่นไหวต่อคำประจบสอพลอมากกว่า"
 stewardship_duty.4010.piety:0 "เตือน[faction_member.GetHerHim]ว่าผลประโยชน์ของข้าคือผลประโยชน์ของ[faction_member.GetFaith.HighGodNamePossessive]"
 stewardship_duty.4010.piety.flavor:0 "[faction_member.GetWomenMen]ที่คลั่งศาสนามีแนวโน้มที่จะปฏิบัติตามศรัทธาของตนมากกว่า"
 stewardship_duty.4010.attempt.tt:0 "การตัดสินใจของ[faction_member.GetTitledFirstNamePossessiveNoTooltip]จะขึ้นอยู่กับบุคลิกภาพของ[faction_member.GetHerHis]"
 stewardship_duty.4010.success:0 "[faction_member.GetTitledFirstNameNoTooltip] ยอมรับข้อเสนอของข้า"
 stewardship_duty.4010.failure:0 "[faction_member.GetTitledFirstNameNoTooltip] ปฏิเสธข้อเสนอของข้า"
 stewardship_duty.4010.decline:0 "[faction_member.GetTitledFirstNameNoTooltip] เพียงแค่ใช้สิทธิของ[faction_member.GetHerHis]เท่านั้น"
 stewardship_duty.4010.decline.tt:0 "[faction_member.GetWomenMen]ทุกคนชื่นชมการได้รับอนุญาตให้ทำตามใจปรารถนา"

 stewardship_duty.4011-4.desc.start:0 "[my_liege.GetTitledFirstName] ได้เข้ามาหาข้า อ้างว่าความสัมพันธ์ของข้ากับ [targeting_faction.GetName] ได้ก่อให้เกิดความยากลำบากเกินควรแก่[my_liege.GetHerHim] และจำเป็นต้องหยุด"

 stewardship_duty.4011-4.b:0 "ข้าจะไม่หวั่นไหวไปจากเส้นทางของข้า!"
 stewardship_duty.4011-4.b.tt:0 "ข้ายังคงอยู่ใน [targeting_faction.GetName]"
 
 stewardship_duty.4011.t:0 "การร้องขอต่อความโลภ"
 stewardship_duty.4011.desc:0 "\n\nด้วยเหตุนี้ [my_liege.GetSheHe]จึงได้เสนอถุงเงินหนักให้ข้าเป็นสิ่งจูงใจให้ออกจากฝักฝ่ายและหันความสนใจไปยังด้านอื่น"
 stewardship_duty.4011.a:0 "เป็นการแลกเปลี่ยนที่ยุติธรรม"

 stewardship_duty.4012.t:0 "การร้องขอต่อความทะเยอทะยาน"
 stewardship_duty.4012.desc:0 "\n\n[my_liege.GetSheHe|U]วิงวอนให้ข้ามองสิ่งต่างๆ จากมุมมองของ[my_liege.GetHerHis] และกำลังเสนอบุญคุณให้ข้าเป็นการแลกเปลี่ยนกับการยุติการสนับสนุนฝักฝ่าย"
 stewardship_duty.4012.a:0 "ข้าจะช่วยท่าน หากท่านช่วยข้า!"

 stewardship_duty.4013.t:0 "การร้องขอต่อความภาคภูมิใจ"
 stewardship_duty.4013.desc:0 "\n\nด้วยเหตุนี้ [my_liege.GetSheHe]จึงได้เสนอที่จะยกย่องข้าต่อสาธารณะสำหรับผลงานของข้าในด้านอื่นๆ เพื่อเสริมสร้างชื่อเสียงของข้าใน [my_liege.GetPrimaryTitle.GetName]"
 stewardship_duty.4013.a:0 "ตราบใดที่[my_liege.GetSheHe]สรรเสริญ[faction_member.Custom('quirk_pos_noun')]ของข้า ข้าก็พอใจ"

 stewardship_duty.4014.t:0 "การร้องขอต่อความศรัทธา"
 stewardship_duty.4014.desc:0 "\n\n[my_liege.GetSheHe|U]จากนั้นก็เตือนข้าว่า[my_liege.GetSheHe]ประทับบนบัลลังก์โดยพระประสงค์ของ[faction_member.GetFaith.HighGodNamePossessive] และการต่อต้าน[my_liege.GetHerHim]ก็คือการต่อต้าน[faction_member.GetFaith.HighGodName]"
 stewardship_duty.4014.a:0 "ข้ารับใช้[faction_member.GetFaith.HighGodName]ผ่านการรับใช้[my_liege.GetTitledFirstNameNoTooltip]"

 stewardship_duty.4015.t:0 "ข้าหลวงละทิ้งฝักฝ่าย"
 stewardship_duty.4015.desc:0 "โดยการ ทำให้เห็นชัดเจนว่า[faction_member.GetSheHe]จะได้อะไรจากการภักดีต่อข้า ข้าสามารถโน้มน้าวให้ [faction_member.GetTitledFirstName] ยุติการสนับสนุน[targeting_faction.GetName]ของ[faction_member.GetHerHis]ได้\n\nความคับข้องใจของ[faction_member.GetHerHis|U]นั้นเล็กน้อยเกินไปเมื่อเทียบกับสิ่งที่ข้าเสนอให้!"
 stewardship_duty.4015.a:0 "ข้ารู้อยู่แล้วว่าข้าสามารถ ทำให้[faction_member.GetHerHim]เข้าใจเหตุผลได้!"

 stewardship_duty.4019.t:0 "ข้าหลวงยังคงยึดมั่นในฝักฝ่าย"
 stewardship_duty.4019.desc:0 "แม้ข้าจะพยายามอย่างสุดความสามารถเพื่อโน้มน้าว[faction_member.GetHerHim] [faction_member.GetTitledFirstName] ก็ปฏิเสธที่จะออกจาก [targeting_faction.GetName] และ[faction_member.GetSheHe]ยังคงสนับสนุนผลประโยชน์ของพวกเขาเหนือกว่าของข้า"
 stewardship_duty.4019.a:0 "เหตุใด[faction_member.GetSheHe]จึงไม่เห็นประโยชน์ของการเข้าข้างข้า?"

 stewardship_duty.4020.t:0 "ข้อเสนอเป็นโมฆะ"
 stewardship_duty.4020.desc:0 "[faction_member.GetTitledFirstName] ไม่ได้อยู่ในฝักฝ่ายอีกต่อไป"
 stewardship_duty.4020.desc.switch:0 "[faction_member.GetTitledFirstName] เปลี่ยนฝักฝ่าย"

 # Altering the Deal - Persuade a vassal to accept a contract change, by Sean Hughes
 stewardship_duty.4040.t:0 "การเปลี่ยนแปลงข้อตกลง"
 stewardship_duty.4040.desc:0 "[ROOT.Char.Custom2('RelationToMe', my_vassal)]ของข้า [my_vassal.GetTitledFirstName] มีสัญญากับข้าที่ค่อนข้างผ่อนปรน โดยยกเว้น[my_vassal.GetHerHim]จากภาระผูกพันหลายประการที่ข้ามักจะคาดหวังจากข้าหลวงคนหนึ่งของข้า\n\nหากข้าสามารถ ทำให้[my_vassal.GetHerHim]ยินยอมต่อภาระผูกพันที่เพิ่มขึ้นได้ ก็จะเป็นประโยชน์อย่างยิ่งต่ออาณาจักรในระยะยาว..."
 stewardship_duty.4040.a:0 "สิ่งจูงใจที่เพียงพอจะซื้อความยินยอมของ[my_vassal.GetHerHis]ได้"
 stewardship_duty.4040.b:0 "ข้าพนันได้เลยว่าข้าสามารถโน้มน้าวให้[my_vassal.GetHerHim]ยอมรับการเปลี่ยนแปลงได้"
 stewardship_duty.4040.b.success:0 "[my_vassal.GetFirstNameNoTooltip] ถูกโน้มน้าวให้ยอมรับการเปลี่ยนแปลงสัญญา"
 stewardship_duty.4040.b.failure:0 "[my_vassal.GetFirstNameNoTooltip] ยังคงไม่เต็มใจที่จะยอมรับการเปลี่ยนแปลงสัญญา"
 stewardship_duty.4040.c:0 "[my_vassal.GetSheHe|U]ต้องยอมรับการเปลี่ยนแปลงของข้า มิฉะนั้น!"
 stewardship_duty.4040.c.success:0 "[my_vassal.GetFirstNameNoTooltip] ถูกบีบบังคับให้ยอมรับการเปลี่ยนแปลงสัญญา"
 stewardship_duty.4040.c.failure:0 "[my_vassal.GetFirstNameNoTooltip] ปฏิเสธที่จะยอมรับการเปลี่ยนแปลงสัญญา"
 stewardship_duty.4040.d:0 "ความภักดีมีค่ามากกว่ากองทหารเกณฑ์"
 stewardship_duty.4040.d.tt:0 "#F [my_vassal.GetFirstNameNoTooltip] รักษาสัญญาปัจจุบันของ[my_vassal.GetHerHis]ไว้ด้วยพรของข้า:#!"

 stewardship_duty.4040.contractchange:0 "ข้าได้เปลี่ยนแปลงสัญญาของ[my_vassal.GetTitledFirstNamePossessive]ให้เป็นประโยชน์แก่ข้า"

 stewardship_duty.4041.desc:0 "ในความพยายามที่จะโน้มน้าวให้ [my_vassal.GetTitledFirstName] ยอมรับสัญญาที่เข้มงวดมากขึ้น ข้าได้นั่งลงกับ[my_vassal.GetHerHim]และอธิบายเหตุผลทั้งหมดว่าเหตุใดเราจึงจำเป็นต้องปรับปรุงมัน \n\n[my_vassal.GetSheHe|U]ลังเลในตอนแรก แต่หลังจากการหารือกันอย่างมาก ข้าก็ ทำให้[my_vassal.GetHerHim]เห็นด้วยว่าสมควรที่จะทำการเปลี่ยนแปลงสัญญาของ[my_vassal.GetHerHis]"
 stewardship_duty.4041.a:0 "ข้ารู้อย่างแน่ชัดว่าจะโน้มน้าว[my_vassal.GetHerHim]ได้อย่างไร!"

 stewardship_duty.4042.desc:0 "ตั้งแต่เริ่มการสนทนา ข้าบอกได้เลยว่าข้าคงยากที่จะโน้มน้าวให้ [my_vassal.GetTitledFirstName] สละสิทธิ์ที่[my_vassal.GetSheHe]พึงมีภายใต้สัญญาของ[my_vassal.GetHerHis]\n\nแม้ข้าจะพยายามอย่างสุดความสามารถและวิงวอน [my_vassal.GetSheHe]ก็ยังยืนกราน โดยกล่าวว่าหากข้าไม่สามารถจัดการกับสิ่งที่[my_vassal.GetSheHe]มอบให้ข้าในปัจจุบันได้ นั่นเป็นความผิดของข้า ไม่ใช่ของ[my_vassal.GetHerHis]"
 stewardship_duty.4042.a:0 "ข้าคงต้องลองใช้วิธีอื่น..."

 stewardship_duty.4043.desc:0 "มันไม่ใช่การเจรจา — มันคือคำสั่ง ข้า ทำให้ [my_vassal.GetTitledFirstName] เข้าใจชัดเจนว่า[my_vassal.GetSheHe]ยังคงดำรงตำแหน่งของ[my_vassal.GetHerHis]ได้เพียง เพราะมัน ทำให้ข้าพอใจ และหาก[my_vassal.GetSheHe]ปรารถนาที่จะอยู่ในด้านดีของข้า [my_vassal.GetSheHe]ก็จำเป็นต้องยอมอ่อนข้อ\n\n[my_vassal.GetSheHe|U]รีบตกลงอย่างรวดเร็ว ดีใจที่ข้าจากไปโดยไม่มีเหตุการณ์ใดๆ เพิ่มเติม"
 stewardship_duty.4043.a:0 "$stewardship_duty.4041.a$"

 stewardship_duty.4044.desc:0 "[my_vassal.GetTitledFirstName] ชะงักงันต่อคำสั่งของข้าที่ให้[my_vassal.GetSheHe]ยอมรับสัญญาที่เข้มงวดมากขึ้น\n\n[my_vassal.GetSheHe|U]บอกข้าว่าแม้ข้าจะเป็น [ROOT.Char.GetTitleAsNameNoTooltip] และผู้ปกครองดินแดนนี้ สัญญาปัจจุบันของ[my_vassal.GetHerHis]ให้สิทธิพิเศษบางประการแก่[my_vassal.GetHerHim] ซึ่งข้าไม่สามารถเพิกถอนไปง่ายๆ ได้ — อย่างน้อยก็ไม่โดยชอบธรรม"
 stewardship_duty.4044.a:0 "$stewardship_duty.4042.a$"

 # Faction Organizing — Lower a faction's discontent during wartime, by Sean Hughes
 stewardship_duty.4060.t:0 "การรวมตัวของฝักฝ่าย"
 stewardship_duty.4060.desc.default:0 "แม้ในท่ามกลางสงคราม [faction_leader.GetTitledFirstName] และผู้สนับสนุนของ[faction_leader.GetHerHis]ใน [targeting_faction.GetName] ก็ยังเต็มใจที่จะใช้ข้ออ้างใดๆ เพื่อผลักดันวาระของตน!"
 stewardship_duty.4060.desc.self_claim:0 "แม้ในท่ามกลางสงคราม [faction_leader.GetTitledFirstName] ก็ยังเต็มใจที่จะใช้ข้ออ้างใดๆ เพื่อผลักดันการอ้างสิทธิ์ของ[faction_leader.GetHerHis]ใน [targeting_faction.GetSpecialTitle.GetName]!"
 stewardship_duty.4060.desc.other_claim:0 "แม้ในท่ามกลางสงคราม [faction_leader.GetTitledFirstName] ก็ยังเต็มใจที่จะใช้ข้ออ้างใดๆ เพื่อผลักดันการอ้างสิทธิ์ของ[targeting_faction.GetSpecialCharacter.GetTitledFirstNamePossessive]ใน [targeting_faction.GetSpecialTitle.GetName]!"
 stewardship_duty.4060.desc.end:0 "\n\nเมื่อกองทหารและทองคำของข้ากำลังร่อยหรอในสนามรบ ข้าจำเป็นต้องพิจารณาอย่างถี่ถ้วนถึงทางเลือกที่มีอยู่เพื่อบรรเทาภัยคุกคามนี้..."
 stewardship_duty.4060.a:0 "ข้า #EMP ต้อง#! โน้มน้าวให้อาณาจักรรวมเป็นหนึ่งเดียว"
 stewardship_duty.4060.a.success:0 "ข้าโน้มน้าวให้ฝักฝ่ายแสดงความเป็นเอกภาพ"
 stewardship_duty.4060.a.success.every_faction_member:0 "สมาชิกทุกคนของ [targeting_faction.GetName|V]"
 stewardship_duty.4060.a.failure:0 "ฝักฝ่ายไม่หวั่นไหวต่อคำพูดของข้า"
 stewardship_duty.4060.b:0 "เงินก้อนโตจะโน้มน้าวให้[faction_leader.GetHerHim]คัดค้านน้อยลง..."
 stewardship_duty.4060.c:0 "[faction_leader.GetSheHe|U]ต้องไม่ได้รับอนุญาตให้ดำเนินการตามแผนของ[faction_leader.GetHerHis]!"
 stewardship_duty.4060.d:0 "ข้าไม่สามารถกังวลเรื่องนี้ได้ในตอนนี้"
 stewardship_duty.4060.attempt.tt:0 "[faction_leader.GetTitledFirstNameNoTooltip] จะตัดสินใจโดยพิจารณาจากบุคลิกภาพของ[faction_leader.GetHerHis]"
 stewardship_duty.4060.decline.tt:1 "ท่านเพิกเฉยต่อฝักฝ่ายไปก่อนในขณะนี้"
 stewardship_duty.4060.failure.tt:0 "[targeting_faction.GetName] ไม่สูญเสียความไม่พอใจใดๆ"

 # A Vassal cheats their contract, by Linnéa Thimrén
 stewardship_duty.5021.t:0 "ข้าหลวงที่ไม่ภักดี"
 stewardship_duty.5021.desc:0 "ข้ากำลังตรวจสอบบัญชีแยกประเภทที่ให้รายละเอียดรายได้ของข้าจากข้าหลวง ตัวเลขเหล่านี้ไม่ตรงกัน... [ROOT.Char.Custom2('DescriptorNegative', SCOPE.sC('cheater_vassal'))] [cheater_vassal.GetTitledFirstName] เห็นข้าเป็นคนโง่และจ่ายน้อยเกินไป!"
 stewardship_duty.5021.a:0 "[cheater_vassal.GetTitleAsNameNoTooltip] ต้องจ่ายส่วนที่[cheater_vassal.GetHerHis]ค้างชำระ"
 stewardship_duty.5021.a.message_1:0 "[cheater_vassal.GetFirstNameNoTooltip] จ่ายสิ่งที่[cheater_vassal.GetSheHe]ติดค้างข้า"
 stewardship_duty.5021.a.message_2:0 "ข้าสงสัยว่า [cheater_vassal.GetFirstNameNoTooltip] ยังคงยักยอกเงินอยู่"
 stewardship_duty.5021.b:0 "ข้าจะควบคุม[cheater_vassal.GetHerHim]อย่างเข้มงวดนับจากนี้ไป!"
 stewardship_duty.5021.c:0 "ใครบ้างที่ไม่เคยพยายามหาผลประโยชน์ใส่ตัว?"

 # Resolve a war between two ai vassals, by Linnéa Thimrén
 stewardship_duty.7001.t:0 "ข้าหลวงที่ทำสงครามกัน"
 stewardship_duty.7001.desc:0 "ข้าหลวงสองคนของข้า [war_vassal.GetTitledFirstName] และ [war_vassal_2.GetTitledFirstName] กำลังสู้รบกัน '[war_scope.GetName]' นี้เสี่ยงที่จะ ทำให้เกิดความไม่มั่นคงในอาณาจักรของข้า และข้าต้องดำเนินการอย่างรวดเร็วหากต้องการแทรกแซง"
 stewardship_duty.7001.a:0 "โน้มน้าวให้พวกเขาวางความขัดแย้งลง"
 stewardship_duty.7001.a.desc_1:0 "[war_vassal.GetFirstNameNoTooltip] เห็นถึงปัญญาในสันติภาพ"
 stewardship_duty.7001.a.desc_2:0 "[war_vassal.GetFirstNameNoTooltip] ไม่ฟังเหตุผลของข้า"
 stewardship_duty.7001.b:0 "นี่เป็นเรื่องระหว่างพวกเขา — ข้าจะไม่แทรกแซง"
 stewardship_duty.7001.c:0 ""เจ้าจงหยุดความโง่เขลานี้ #EMP เดี๋ยวนี้!#!""

 stewardship_duty.7002.toast.peace:0 "[war_vassal.GetFirstName] และ [war_vassal_2.GetFirstName] ตกลงสงบศึกโดยไม่มีผู้แพ้ชนะ"
 stewardship_duty.7002.toast.invalid:0 "[war_scope.GetName] สิ้นสุดลงก่อนที่ข้าจะสามารถแทรกแซงได้"

 # About that Favor, by Stephen Arthur and Sean Hughes
 stewardship_duty.7023.t:0 "เกี่ยวกับบุญคุณนั้น..."
 stewardship_duty.7023.desc:0 "ความจริงที่ว่าข้าติดค้างบุญคุณอันสำคัญต่อ [hook_holder.GetTitledFirstName] นั้นหนักอึ้งในใจข้า\n\nคงจะเป็นการปลดเปลื้องอย่างยิ่งหากข้าสามารถจัดการเรื่องนี้ได้ในตอนนี้ ตามเงื่อนไขของข้า การรอให้[hook_holder.GetHerHim]เรียกใช้บุญคุณอาจ ทำให้ข้าตกอยู่ในสถานการณ์ลำบากในภายหลัง"
 stewardship_duty.7023.success:0 "ข้าโน้มน้าวให้ [hook_holder.GetFirstNameNoTooltip] สละสิทธิ์ในบุญคุณที่ข้าติดค้าง[hook_holder.GetHerHim]"
 stewardship_duty.7023.failure:0 "[hook_holder.GetFirstNameNoTooltip] ยืนกรานให้ข้าตอบแทนบุญคุณที่ข้าติดค้าง[hook_holder.GetHerHim]"
 stewardship_duty.7023.a:0 "เสนอเงินตราให้[hook_holder.GetHerHim]เพื่อจัดการเรื่องต่างๆ"
 stewardship_duty.7023.a.success:0 "[hook_holder.GetTitledFirstNameNoTooltip] ยอมรับทองคำของข้าแทนบุญคุณที่ข้าติดค้าง[hook_holder.GetHerHim]"
 stewardship_duty.7023.b:0 "โน้มน้าวให้[hook_holder.GetHerHim]ลืมเรื่องในอดีตเสีย"
 stewardship_duty.7023.c:0 "[hook_holder.GetSheHe|U]ต้องลืมเรื่องนี้เสีย มิฉะนั้น!"
 stewardship_duty.7023.d:0 "ชาว [ROOT.Char.GetHouse.GetBaseNameNoTooltip] ย่อมชดใช้หนี้สินของ[ROOT.Char.GetHerHis]เสมอ!"
 stewardship_duty.7023.d.tt:0 "ข้ายังคงติดค้างบุญคุณ [hook_holder.GetTitledFirstName]"
 stewardship_duty.7023.player:0 "#weak ผู้เล่นอื่นมีทางเลือกที่จะปฏิเสธเสมอ แม้ว่าพวกเขาอาจได้รับ[stress|e]จากการทำเช่นนั้นก็ตาม#!"

 stewardship_duty.7023.invalidated.hooked_ruler:0 "เนื่องจากข้าไม่ได้ติดค้างบุญคุณ [hook_holder.GetTitledFirstName] อีกต่อไป คำขอของข้าให้[hook_holder.GetHerHim]สละสิทธิ์จึงไม่ถูกต้องอีกต่อไป"
 stewardship_duty.7023.invalidated.hook_holder:0 "เนื่องจาก [hooked_ruler.GetTitledFirstName] ไม่ได้ติดค้างบุญคุณข้าอีกต่อไป คำขอของ[hooked_ruler.GetHerHis]ให้ข้าสละสิทธิ์จึงไม่ถูกต้องอีกต่อไป"

 stewardship_duty.7025.opening:0 "[hooked_ruler.Custom2('AppropriateGreeting', ROOT.Char)]"
 stewardship_duty.7025.desc.gold:0 "ท่านเคยช่วยเหลือข้าอย่างใหญ่หลวง และข้าขอขอบคุณ เพื่อเป็นการตอบแทนบุญคุณ ข้าขอมอบส่วนหนึ่งของคลังสมบัติของข้า\n\nท่านเห็นว่าข้อเสนอ เช่นนี้ยอมรับได้หรือไม่?"
 stewardship_duty.7025.desc.diplomacy.success:0 "ข้าเขียนมาเพื่อหารือกับท่านเกี่ยวกับบุญคุณที่ข้าเคยติดค้างท่าน ผู้มีเหตุผลส่วนใหญ่จะเห็นพ้องว่าการกระทำในอดีตของข้าได้ตอบสนองภาระผูกพันของข้าอย่างเพียงพอแล้ว\n\nดังนั้น ข้ารู้สึกว่าข้าไม่ได้ติดค้างบุญคุณท่านอีกต่อไป"
 stewardship_duty.7025.desc.diplomacy.failure:0 "ข้าติดค้างบุญคุณท่าน แต่ข้าไม่อยากทำ เช่นนั้นเลย ใครเล่าอยากจะติดค้างบุญคุณใคร?\n\nจะเป็นไรไปหากท่านเพียงแค่... ลืมเรื่องบุญคุณนั้นเสีย? ข้าอยากให้เป็น เช่นนั้น คงจะดีไม่น้อย"
 statectaft_ongoing.7025.desc.intimidation.success:0 "ท่านอาจเคยช่วยเหลือข้าครั้งหนึ่ง แต่อย่าคิดว่าข้าติดค้างอะไรท่านเป็นการตอบแทน การที่ท่านยังคงอยู่ในความโปรดปรานของข้าก็นับเป็นการชำระหนี้ที่เพียงพอแล้ว เชื่อข้าเถิด ท่านคงไม่อยาก ทำให้ข้าเป็นศัตรู..."
 stewardship_duty.7025.desc.intimidation.failure:0 "เจ้าดูเหมือนจะหลงเข้าใจผิดว่าเจ้าสมควรได้รับความโปรดปรานจากข้า ข้าไม่ได้ติดหนี้บุญคุณอะไรกับ [hook_holder.Custom2('InsultAdjective', SCOPE.sC('hooked_ruler'))] [hook_holder.Custom2('InsultNoun', SCOPE.sC('hooked_ruler'))] อย่างเจ้า! ลืมมันไปเสีย มิฉะนั้น..."
 stewardship_duty.7025.gold.a:0 "ข้าจะรับทองคำ"
 stewardship_duty.7025.gold.b:0 "บุญคุณมีค่ามากกว่าเงินตรา"
 stewardship_duty.7025.diplomacy.a:0 "เป็นเหตุผลที่น่าเชื่อถือ"
 stewardship_duty.7025.diplomacy.b:0 "[hooked_ruler.GetSheHe]จริงจังรึ?! ไม่มีทาง!"
 stewardship_duty.7025.intimidation.a:0 "ข้าไม่อยาก ทำให้[hooked_ruler.GetHerHim]โกรธ..."
 stewardship_duty.7025.intimidation.b:0 "คำขู่ที่ว่างเปล่าจะไม่ช่วยให้[hooked_ruler.GetHerHim]ได้อะไรเลย!"
 stewardship_duty.7025.refuse.tt:0 "[hooked_ruler.GetTitledFirstName] จะยังคงติดค้างบุญคุณข้า"
 stewardship_duty.7025.stress.tt:0 "ข้ามีแนวโน้มที่จะสละสิทธิ์ในบุญคุณ ดังนั้นการปฏิเสธจึง ทำให้เกิดความเครียด"

 stewardship_duty.7027.opening:0 "[hook_holder.Custom2('AppropriateGreeting', ROOT.Char)]"
 stewardship_duty.7027.desc.accepted.gold:0 "ขอบคุณสำหรับของขวัญของท่าน ถือว่าหนี้ของท่านได้รับการชำระเต็มจำนวนแล้ว"
 stewardship_duty.7027.desc.refused.gold:0 "ภาระผูกพันของท่านมีค่ามากกว่าทองคำ ท่านยังคงเป็นหนี้ข้าอยู่"
 stewardship_duty.7027.desc.accepted.diplomacy:0 "ข้าเห็นถึงปัญญาในคำพูดของท่าน อย่าได้คิดถึงบุญคุณในอดีตนั้นอีกเลย"
 stewardship_duty.7027.desc.refused.diplomacy:0 "คำพูดสวยหรูของท่านช่างว่างเปล่าเหมือนคำสัญญาที่เห็นได้ชัดของท่าน ข้ายังคงถือว่าท่านเป็นหนี้ข้าอยู่"
 stewardship_duty.7027.desc.accepted.intimidation:0 "แน่นอน ข้าจะยกหนี้ที่ท่านมีต่อข้าให้ เรื่อง เช่นนั้นไม่เคยเป็นที่สงสัย! ข้าอยู่ในความเมตตาของท่าน"
 stewardship_duty.7027.desc.refused.intimidation:0 "ท่าน ทำให้ข้ากลัวไม่ได้ ท่านจะต้องตอบสนองภาระผูกพันที่มีต่อข้า ไม่ทางใดก็ทางหนึ่ง"
 stewardship_duty.7027.a:0 "ในที่สุด เรื่องนี้ก็ยุติลง"
 stewardship_duty.7027.b:0 "น่าจะออกมาดีกว่านี้"

 ##################
 # Special Events #
 ##################

 # Map Painting Journey, by Petter Vilberg
 stewardship_duty_special.1201.t:0 "การสำรวจแผนที่ดินแดน"
 stewardship_duty_special.1201.desc:0 "[steward.GetCouncilTitle]ของข้า [steward.GetTitledFirstName] กำลังเสนอภารกิจที่[steward.GetSheHe]อ้างว่าจะก่อประโยชน์แก่[ROOT.Char.Custom('RealmType')]\n\n[steward.GetSheHe|U]คิดว่าข้าควรเดินทางพร้อมคณะผู้ติดตามเพื่อสำรวจแผนที่อาณาเขตของ [painting_land_owner.GetTitledFirstName] ข้าจะได้รู้จักอาณาจักรของข้าดีขึ้น และ [steward.GetFirstNameNoTooltip] เชื่อว่าข้าจะได้รับความเข้าใจที่ลึกซึ้งยิ่งขึ้นเกี่ยวกับ[ROOT.Char.Custom2('RelationToMe', SCOPE.sC('painting_land_owner'))]ของข้า"
 stewardship_duty_special.1201.a:0 "เป็นความพยายามที่คุ้มค่า"
 stewardship_duty_special.1201.a.tt:0 "ท่านเริ่มเตรียมการทันที!"
 stewardship_duty_special.1201.b:0 "นี่ไม่ใช่เวลาสำหรับการเดินทาง เช่นนี้"
 stewardship_duty_special.1201.b.tt:0 "ท่านไม่ได้ออกเดินทาง"
 stewardship_duty_special.1201.continue_tooltip:0 "การสำรวจของข้าดำเนินต่อไป"

 stewardship_duty_special.1202.desc:0 "ขณะที่เราผ่านเข้าสู่ดินแดนของ[painting_land_owner.GetTitledFirstNamePossessive] เราได้รับการต้อนรับจาก[painting_land_owner.Custom('MountedWarriorTerm')]และคณะผู้ติดตามของ[dummy_gender.GetHerHis]\n\n"[painting_land_owner.GetTitledFirstName] ขอต้อนรับท่าน [ROOT.Char.Custom('my_title')] ของข้า ท่านสามารถพำนักอยู่ในดินแดนเหล่านี้ได้นานเท่าที่ท่านต้องการ""
 stewardship_duty_special.1202.a:0 "ข้าหวังว่าจะได้เรียนรู้มาก"
 stewardship_duty_special.1202.a.tt:0 "ข้าเริ่มสำรวจแผนที่บริเวณนี้"

 stewardship_duty_special.1203.desc:0 "ดูเหมือนเป็นถนนที่เงียบสงบ แต่ก็นั่นแหละที่ ทำให้เหมาะแก่การซุ่มโจมตี มิใช่หรือ?\n\nเหล่าโจรกรูกันออกมาจากหลังเนินเขา ลูกธนูและคำสั่งต่างๆ พลันดังขึ้นในอากาศ"
 stewardship_duty_special.1203.a:0 "อย่าปล่อยให้อาชญากรคนใดรอดชีวิต!"
 stewardship_duty_special.1203.b:0 "หยุด! เราจะจ่ายค่าผ่านทางอย่างปลอดภัย!"

 stewardship_duty_special.1204.desc:0 "เราตั้งค่ายพักแรมคืนหนึ่งริม [painting_land_owner.Custom('IndefiniteBodyOfWater')] ไพร่ฟ้าของข้าตื่นขึ้นมาอย่างสดชื่นด้วยเสียงนกร้องและหมอกบางๆ เหนือผืนน้ำ"
 stewardship_duty_special.1204.a:0 "นี่เป็นสถานที่ที่ดีในการตั้งค่ายพักแรมสักพัก"
 stewardship_duty_special.1204.a.tt:0 "การเดินทางของข้าล่าช้าเล็กน้อย"
 stewardship_duty_special.1204.b:0 "เราเคลื่อนขบวนต่อไปอย่างรวดเร็ว"

 stewardship_duty_special.1205.desc:0 "ชาวนาที่ดูแลทุ่งนาริมทางคงไม่เคยเห็นขบวนเสด็จอันสง่างามเท่าที่ข้านำมานี้\n\n"นี่ใครกัน?" ข้าได้ยินคนหนึ่งถามอีกคน"
 stewardship_duty_special.1205.a:0 ""ข้าคือเจ้าและผู้ปกครองของเจ้า เจ้าแห่งดินแดนนี้!""
 stewardship_duty_special.1205.b:0 "ข้าควรเรียนรู้เกี่ยวกับชีวิตชาวนาแถบนี้"

 stewardship_duty_special.1206.desc:0 "ข้าได้เห็นป้อมปราการหลายแห่งทั่วภูมิภาค ในตำแหน่งป้องกันต่างๆ ท่ามกลางภูมิประเทศที่เปลี่ยนแปลงไป เช้าวันหนึ่งขณะที่เราเข้าใกล้ป้อมแห่งหนึ่ง ข้าเห็น [local_baron.GetTitleAsNameNoTooltip] ในท้องถิ่นกำลังดูแลม้านอกประตูของ[local_baron.GetHerHis]"
 stewardship_duty_special.1206.a:0 "ขอเข้าชม[local_baron.Custom('FortifiedBuilding')]"
 stewardship_duty_special.1206.b:0 "เชิญ [local_baron.GetTitledFirstNameNoTooltip] มาร่วมมื้ออาหารกับข้าในคืนนี้"

 stewardship_duty_special.1207.desc:0 "หลายสัปดาห์บนท้องถนนสามารถ ทำให้[ROOT.Char.GetWomanMan]ใดๆ เหนื่อยล้าได้ ดังนั้นจึงเป็นพรเมื่อในที่สุดเราก็พบโรงเตี๊ยมที่ดูเหมือนจะมีสิ่งอำนวยความสะดวกหรูหรา เช่นเตียงนอนจริงๆ มันอาจจะมีที่พักสำหรับสัตว์ที่ใหญ่กว่าหนูด้วยซ้ำ"
 stewardship_duty_special.1207.a:0 "ข้ายืนกรานที่จะจ่ายค่าห้องและค่าอาหาร"
 stewardship_duty_special.1207.b:0 "เจ้าของโรงเตี๊ยมจะรู้สึกเป็นเกียรติที่ได้ต้อนรับ [ROOT.Char.GetTitleAsNameNoTooltip]!"

 stewardship_duty_special.1208.desc:0 "ดินแดนของ[painting_land_owner.GetTitledFirstNamePossessive]เต็มไปด้วยลำธารและแม่น้ำตัดผ่านกัน สะพานชั่วคราวและท่าข้ามเป็นทางผ่านส่วนใหญ่ แน่นอนว่าแหล่งน้ำอันสงบเหล่านี้คงมีประโยชน์มากกว่านี้?"
 stewardship_duty_special.1208.a:0 "ข้าจะส่งข้อความถึงนักเขียนแผนที่ของข้าในชามเล็กๆ!"
 stewardship_duty_special.1208.b:0 "หากตลิ่งโคลนเหล่านี้ถูกคราด มันอาจกลายเป็นดินที่เพาะปลูกได้..."

 stewardship_duty_special.1281.opening:0 "เนินเขาและหุบเขา ที่ราบและทะเลสาบ ถนนหลวงและเส้นทางในป่า ข้าได้เห็นทั้งหมดนี้ในอาณาจักรของ[painting_land_owner.GetTitledFirstNamePossessive] และนักเขียนแผนที่ของข้าก็ได้จดบันทึกและร่างภาพด้วยถ่านอย่างกระตือรือร้นสำหรับทุกทิวทัศน์ใหม่"
 stewardship_duty_special.1281.end:0 "\n\nนอกจากนี้ยังเป็นการสำรวจเมืองและหมู่บ้านที่น่าสนใจ รวมถึงผู้คนที่เดินทางในส่วนเหล่านี้ของ[ROOT.Char.Custom('RealmType')]"
 stewardship_duty_special.1281.a:0 "นี่เป็นข้อมูลที่เป็นประโยชน์ที่ควรเก็บไว้กับตัว"
 stewardship_duty_special.1281.b:0 "[painting_land_owner.GetTitledFirstNameNoTooltip] ควรจะได้ยินสิ่งที่ข้าค้นพบ"

 stewardship_duty_special.1282.end:0 "\n\nข้ายังให้พวกเขาจดบันทึกเกี่ยวกับป้อมปราการที่ทรุดโทรมและลักษณะทางธรรมชาติที่ป้องกันได้อย่างยอดเยี่ยม"
 stewardship_duty_special.1282.a:0 "ไม่มีใครรู้ว่ามันอาจจะมีประโยชน์เมื่อใด"
 stewardship_duty_special.1282.b:0 "[painting_land_owner.GetFirstNameNoTooltip] ควรจะเสริมการป้องกันของ [painting_land_owner.GetHerHis] ใหม่... ข้าเองก็ เช่นกัน!"

 stewardship_duty_special.1283.end:0 "\n\nระดับรายละเอียดที่นักเขียนแผนที่ของข้าทำได้กับแผนที่เหล่านี้ช่างน่าทึ่ง ไม่มีเส้นทางใดเลยที่ดูเหมือนจะถูกมองข้าม และเต็มไปด้วยบันทึกโดยละเอียดเกี่ยวกับภูมิประเทศ"
 stewardship_duty_special.1283.a:0 "บัดนี้ ไม่มีใครรู้ลักษณะภูมิประเทศนี้ดีไปกว่าข้าแล้ว"
 stewardship_duty_special.1283.b:0 "แม่ทัพของข้าจะพบประโยชน์ที่ดีสำหรับสิ่งเหล่านี้"

 stewardship_duty_special.1284.end:0 "\n\nข้ารู้สึกทึ่งเป็นพิเศษกับจำนวนแม่น้ำและลำธารจำนวนมากที่ไหลผ่านดินแดนของ[painting_land_owner.Custom('my_title')]"
 stewardship_duty_special.1284.a:0 "บางทีพวกมันอาจมีประโยชน์สำหรับผู้ส่งสาร?"
 stewardship_duty_special.1284.b:0 "ข้าจะพิจารณาผลกระทบทางทหารของเรื่องนี้"

 stewardship_duty_special.1285.end:0 "\n\nเป็นที่ชัดเจนว่ามีสถานที่หลายแห่งที่นี่ ซึ่งผู้คนไม่ค่อยได้เห็น หากเท้ามนุษย์เคยเหยียบย่ำพื้นดินเหล่านั้น"
 stewardship_duty_special.1285.a:0 "ยังมีอะไรอีกมากที่ต้องเรียนรู้เกี่ยวกับผืนดินที่เราเดินอยู่"
 stewardship_duty_special.1285.b:0 "หากเราสนับสนุนผู้ตั้งถิ่นฐานที่นั่น และระบายน้ำออกจากพื้นดินที่นี่..."

 stewardship_duty_special.1286.end:0 "\n\nข้ามีความซาบซึ้งใหม่ต่อความแตกต่างเล็กน้อยในอาณาจักรของข้า ใครจะรู้ว่าสิ่งต่างๆ จะแตกต่างจาก [capital.GetNameNoTier] มากขนาดนี้?"
 stewardship_duty_special.1286.a:0 "นี่คือความรู้ที่จะเป็นประโยชน์อย่างยิ่ง"
 stewardship_duty_special.1286.b:0 "ข้าก็เป็น[ROOT.Char.GetLadyLord]ของดินแดนเหล่านี้ เช่นกัน!"

 # Vassal Mediation, by Petter Vilberg
 statecraft_mediation_unfair:0 "สิ่งนี้จะถูกมองว่าไม่ยุติธรรม"
