 statecraft_mediation_very_fair:0 "สิ่งนี้จะถูกมองว่ายุติธรรมมาก"
 statecraft_mediation_favor_vassal_1:0 "สิ่งนี้จะถูกมองว่าเข้าข้าง [vassal_1.GetTitledFirstName]"
 statecraft_mediation_favor_vassal_2:0 "สิ่งนี้จะถูกมองว่าเข้าข้าง [vassal_2.GetTitledFirstName]"
 story_diplomacy_lifestyle_mediation: "ไกล่เกลี่ยข้าหลวง"
 story_diplomacy_lifestyle_mediation_desc: "ส่วนหนึ่งของการสร้างสายสัมพันธ์แห่งความภักดี คือการระงับข้อพิพาทของเหล่าข้าหลวงที่แตกแยก"
 FRACTIOUS_VASSAL: "ข้าหลวงที่แตกแยก"
 PERCEIVED_FAIRNESS: "ความยุติธรรมที่รับรู้ได้"
 FAVOR_VASSAL_1: "ความโปรดปรานที่มีต่อ [Story.MakeScope.Var('stewardship_duty_special_vassal_1').Char.GetShortUIName]"
 FAVOR_VASSAL_2: "ความโปรดปรานที่มีต่อ [Story.MakeScope.Var('stewardship_duty_special_vassal_2').Char.GetShortUIName]"
 FAIRNESS_MIN_VALUE_LABEL: "อยุติธรรม"
 FAIRNESS_MAX_VALUE_LABEL: "ยุติธรรม"
 stewardship_duty_special.2001.t:0 "การระงับข้อพิพาท"
 stewardship_duty_special.2001.desc:0 "ความเป็นศัตรูระหว่างข้าหลวงของข้า [vassal_1.GetTitledFirstName] และ [vassal_2.GetTitledFirstName] นั้นเป็นตำนาน และมันดำเนินไปไกลจนขุนนางคนอื่นๆ ในอาณาจักรได้ร้องขอให้ข้าแทรกแซง\n\nข้อพิพาทเรื่องเขตแดน สิทธิทางภาษี ประวัติครอบครัว... พวกเขามีข้อพิพาทมากมาย และแม้ แต่ที่นี่ในราชสำนักของข้า พวกเขาก็แทบจะไม่สามารถรักษาความสุภาพไว้ได้"
 stewardship_duty_special.2001.a:0 "การไกล่เกลี่ยระหว่างสองคนนี้จะเป็นความท้าทายอย่างแน่นอน!"
 stewardship_duty_special.2001.b:0 "เรื่องนี้เป็นหน้าที่ของ [ROOT.Char.GetCouncillor('councillor_chancellor').GetCouncilTitle] ของข้า"
 stewardship_duty_special.2001.c:0 ""เจ้ากล้ารบกวนข้าด้วยเรื่องไร้สาระเหล่านี้รึ?!""

 stewardship_duty_special.2011.t:0 "การระงับข้อพิพาท: ข้อพิพาทเรื่องที่ดิน"
 stewardship_duty_special.2011.desc:0 "ข้าคิดว่าการหารือดุเดือด #EMP ก่อน#! ที่จะนำแผนที่ออกมา\n\n[vassal_1.GetTitledFirstName] และ [vassal_2.GetTitledFirstName] ต่างก็มีภาพประกอบอาณาจักรของตน และภาพประกอบ แต่ละภาพแสดงจุดข้ามฟากเดียวกันว่าเป็นของตนเอง ไม่มีใครดูเหมือนจะยอมถอยแม้ แต่ก้าวเดียว\n\nข้าไม่เคยเห็นแผ่นหนัง ทำให้เกิดความโกรธเคืองมากเท่านี้มาก่อน และเป็นที่ชัดเจนว่าต้องมีการกำหนดเขตแดนใหม่"
 stewardship_duty_special.2011.a:0 "ข้าจะไกล่เกลี่ยในการหารือเหล่านี้ด้วยตนเอง"
 stewardship_duty_special.2011.b:0 "[vassal_1.GetFirstNameNoTooltip] จะได้รับการชดเชยสำหรับความสูญเสียใดๆ"
 stewardship_duty_special.2011.c:0 "[vassal_2.GetFirstNameNoTooltip] กระตือรือร้น #EMP อย่างยิ่ง#! ที่จะให้ข้าตัดสินอย่างถูกต้องและยุติธรรม..."
 statecraft_mediation_debug_improve_contract:0 "#D ปรับปรุงสัญญาข้าหลวงกับ [vassal_2.GetTitledFirstName]#!"

 stewardship_duty_special.2012.t:0 "การระงับข้อพิพาท: ข้อพิพาทในครอบครัว"
 stewardship_duty_special.2012.desc:0 "การหารือในวันนี้ระหว่าง [vassal_1.GetTitledFirstName] และ [vassal_2.GetTitledFirstName] เริ่มต้นได้ไม่ดีนัก\n\n"นับตั้งแต่ท่านได้รับโล่ของท่านปู่—"\n"เรื่องโล่อีกแล้วรึ จริงๆ น่ะ? ที่นี่ ในราชสำนักของ[ROOT.Char.GetTitlePossessive]เนี่ยนะ?!""
 stewardship_duty_special.2012.a:0 "ครอบครัวต้องผูกพันเราไว้ด้วยกัน ไม่ใช่ ทำให้เราแตกแยก"
 stewardship_duty_special.2012.a.success:0 "วาจาอันชาญฉลาด"
 stewardship_duty_special.2012.a.failure:0 "คำพูดซ้ำซากที่ว่างเปล่า"
 stewardship_duty_special.2012.b:0 "ดูเหมือนจะมีความยิ่งใหญ่ในตระกูลของท่าน"
 stewardship_duty_special.2012.c:0 "ข้ารู้วิธีระงับความขัดแย้งในครอบครัว!"
 statecraft_sc_mediation_debug_add_dynasty_prestige:0 "#D เพิ่มชื่อเสียงราชวงศ์#!"
 stewardship_duty_special.2012.c.major_progress:0 "ข้า ทำให้ผู้ทะเลาะวิวาทใกล้ชิดกันมากขึ้น เพิ่มโอกาสของผลลัพธ์ที่เป็นบวกอย่างมีนัยสำคัญ"

 stewardship_duty_special.2013.t:0 "การระงับข้อพิพาท: สิทธิทางภาษี"
 stewardship_duty_special.2013.desc:0 "[vassal_1.GetTitledFirstName] อ้างว่า [vassal_2.GetTitledFirstName] กำลังปฏิเสธสิทธิในการเก็บภาษีของ[vassal_1.GetHerHis]\n\n"ไม่เลย!" [vassal_1.GetFirstName] คัดค้าน "ครอบครัวที่เป็นปัญหาอยู่ฝั่งเขตแดนของข้ามาหลายชั่วอายุคนแล้ว ทุ่งนาเพียงแห่งเดียวที่อยู่อีกฝั่งไม่ได้ ทำให้ท่านมีสิทธิ์ได้รับส่วนสิบเต็มจำนวนหรอก!""
 stewardship_duty_special.2013.a:0 "หากพวกท่านตัดสินใจไม่ได้ ส่วนสิบจะกลับคืนสู่ [ROOT.Char.GetTitleAsNameNoTooltip]"
 stewardship_duty_special.2013.b:0 "ประเพณีมีความสำคัญเหนือกว่าในที่นี้"
 stewardship_duty_special.2013.c:0 "เจ้าของที่ดินเป็นผู้เก็บภาษี ไม่ว่าใครจะเป็นผู้ตั้งรกราก"

 stewardship_duty_special.2014.t:0 "การระงับข้อพิพาท: การหมั้นหมาย"
 stewardship_duty_special.2014.desc:0 ""[betrothal_candidate_lord.Custom2('RelationToMe', SCOPE.sC('betrothal_candidate'))]ของ[betrothal_candidate_lord.GetTitledFirstNamePossessive]ถูกสัญญาไว้กับ[vassal_1.Custom2('RelationToMe', SCOPE.sC('vassal_1_betrothal_candidate'))]ของข้าตั้งแต่—" [vassal_1.GetTitledFirstName] เริ่มต้น ก่อนที่จะถูกขัดจังหวะอย่างคาดเดาได้โดย [vassal_2.GetTitledFirstName]\n\n"[betrothal_candidate.GetTitledFirstName] ถูกกำหนดให้ แต่งงานกับ[vassal_2.Custom2('RelationToMe', SCOPE.sC('vassal_2_betrothal_candidate'))]ของข้าเสมอมา!""
 stewardship_duty_special.2014.a:0 "[betrothal_candidate.GetTitledFirstNameNoTooltip] จะ แต่งงานกับ[vassal_1.Custom2('RelationToMe', SCOPE.sC('vassal_1_betrothal_candidate'))]ของ[vassal_1.GetFirstNamePossessiveNoTooltip]"
 stewardship_duty_special.2014.b:0 "การหมั้นหมายจะทำกับ[vassal_2.Custom2('RelationToMe', SCOPE.sC('vassal_2_betrothal_candidate'))]ของ[vassal_2.GetFirstNamePossessiveNoTooltip]"
 stewardship_duty_special.2014.c:0 "การทะเลาะวิวาทนี้ ทำให้พวกท่านทั้งสองเสียสิทธิ์ไปแล้ว!"

 stewardship_duty_special.2015.t:0 "การระงับข้อพิพาท: การตัดสินคดี"
 stewardship_duty_special.2015.desc:0 ""มีครั้งหนึ่งที่ [vassal_2.GetTitledFirstName] ให้ที่พักพิงแก่โจรที่รู้จักกันดี!" [vassal_1.GetTitledFirstName] กล่าวหา\n\n"สาบานต่อ[vassal_2.GetFaith.HighGodName]!" [vassal_2.GetFirstName] เคยได้ยินเรื่องนี้มาก่อนอย่างเห็นได้ชัด "ท่านไม่มีสิทธิ์ตัดสินคดีไพร่ฟ้าของข้า ในอาณาจักรของข้า!"\n\n"เพียง เพราะเขาสามารถหลบหนีไปได้ก่อน—"\n\nพวกเขารีบเงียบลงเมื่อข้ายกมือขึ้นและเตือนให้พวกเขานึกถึงการมีอยู่ของข้า"
 stewardship_duty_special.2015.a:0 "โจรผู้นี้จะถูกประหารชีวิต และคำถามนี้จะเป็นโมฆะ"
 stewardship_duty_special.2015.b:0 "หาก [vassal_2.GetFirstNameNoTooltip] มีสิทธิ์ตัดสินคดี นั่นคือทั้งหมดที่สำคัญ"
 stewardship_duty_special.2015.c:0 "[ROOT.Char.GetCouncillor('councillor_chancellor').GetCouncilTitle] ของข้าจะจัดตั้งศาลพิจารณาคดีหัวขโมยกระจอกผู้นี้"

 stewardship_duty_special.2018.t:0 "การระงับข้อพิพาท: ม้า"
 stewardship_duty_special.2018.desc:0 "[vassal_1.GetTitledFirstName] มีเรื่องร้องเรียนอีกเรื่องในวันนี้ แน่นอน "ม้าที่เพาะพันธุ์ใน [barony_1.GetNameNoTier] มีชื่อเสียงมานานแล้ว แต่ตอนนี้พ่อค้าจาก [barony_2.GetNameNoTier] กำลังขายพวกมันราวกับว่าพวกเขาเพาะพันธุ์พวกมันเอง! ใน [barony_2.GetNameNoTier]!"\n\n[vassal_2.GetTitledFirstName] คัดค้านเรื่องนี้ "พวกมัน #EMP ถูก#! เพาะพันธุ์ที่นั่น! พ่อค้าควรจะโกหกเกี่ยวกับสินค้าของตนหรือ?""
 stewardship_duty_special.2018.a:0 "ต้นกำเนิดต้องได้รับการเคารพมิใช่หรือ?"
 stewardship_duty_special.2018.b:0 "พวกมันไม่ได้มาจาก [barony_1.GetNameNoTier] หรือ [barony_2.GetNameNoTier] แต่มาจาก [new_name.GetNameNoTier]!"
 stewardship_duty_special.2018.c:0 "ดูเหมือนว่าเราอาจต้องการค่าธรรมเนียมการตรวจสอบม้าหลวง"

 stewardship_duty_special.2019.t:0 "การระงับข้อพิพาท: เหมืองหิน"
 stewardship_duty_special.2019.desc:0 "[vassal_1.GetTitledFirstName] และ [vassal_2.GetTitledFirstName] ได้ระบุความคับข้องใจมานานหลายชั่วโมงแล้ว\n\n"... แล้วก็มีนายเหมืองหินที่ชายแดน ซึ่งปฏิเสธที่จะจ่ายภาษี เนื่องจากหนังสือผ่อนผันที่ #EMP ท่าน#! ได้เสนอให้!"\n"อะไรนะ?! ท่านเป็นคนเอาทุกอย่างที่พวกเขามีไปแล้วตอนที่คนเก็บภาษีของข้า—"\n\nในที่สุดพวกเขาก็หยุดลงเมื่อตระหนักว่าพวกเขาถูกหลอกทั้งคู่"
 stewardship_duty_special.2019.a:0 "ภาษีที่ขาดหายไปจะถูกเก็บรวบรวม และแบ่งเท่าๆ กัน"
 stewardship_duty_special.2019.b:0 "พวกท่านทั้งสองสมควรถูก ทำให้เป็นคนโง่!"
 stewardship_duty_special.2019.c:0 "ประหารนายเหมืองหินและเผาเหมืองหินเสีย"
 stewardship_duty_special.2019.d:0 "นี่คืออาชญากรรมต่อ [ROOT.Char.GetTitleAsNameNoTooltip] และ [ROOT.Char.GetTitleAsNameNoTooltip] จะจัดการเอง!"
 
 stewardship_duty_special.2021.t:0 "การระงับข้อพิพาท: งานเลี้ยง"
 stewardship_duty_special.2021.desc:0 "[vassal_1.GetTitledFirstName] และ [vassal_2.GetTitledFirstName] มีความคับข้องใจต่อกันทุกรูปแบบ ตั้งแต่เรื่องใหญ่ไปจนถึงเรื่องเล็กน้อย\n\n"[uninvited.GetFirstName] ปฏิเสธไม่ให้เจ้าของที่ดินของ[uninvited.GetHerHis]เข้าร่วมงานเลี้ยงฤดูใบไม้ร่วงของข้า!" [host.GetFirstName] บ่น\n\n"แน่นอน ข้าไม่ต้องการให้ข้าหลวงของข้านำหมัดกลับบ้านไปกับพวกเขามากขึ้น""
 stewardship_duty_special.2021.a:0 "พวกเขาเป็นข้าหลวงของ[uninvited.GetFirstNamePossessiveNoTooltip] พวกเขาต้องทำตามที่[uninvited.GetSheHe]สั่ง"
 stewardship_duty_special.2021.b:0 "ไม่ควรมีใครถูกปฏิเสธไม่ให้เข้าร่วมงานเลี้ยง!"
 stewardship_duty_special.2021.c:0 "บัดนี้พวกท่านทั้งสอง #EMP จำต้อง#! เข้าร่วมงานเลี้ยงของกันและกัน!"

 stewardship_duty_special.2022.t:0 "การระงับข้อพิพาท: การดูหมิ่น"
 stewardship_duty_special.2022.desc:0 ""[insulter.GetTitledFirstName] ดูหมิ่น[ROOT.Char.Custom2('RelationToMe', SCOPE.sC('spouse'))]ของข้าอย่างร้ายแรง!" [insultee.GetTitledFirstName] โพล่งออกมา "บอกเป็นนัยว่า[spouse.GetSheHe]นอนร่วมเตียงกับหมู!"\n\n[insulter.GetFirstName] ยังคงสงบ "บางครั้งความจริงก็น่าฟังน้อยกว่าคำยกยอ [insultee.GetFirstName]""
 stewardship_duty_special.2022.a:0 "เรื่องนี้ต้องการคำขอโทษต่อสาธารณะ!"
 stewardship_duty_special.2022.b:0 "การทะเลาะวิวาทเล็กน้อยเหล่านี้ต่ำกว่าระดับของพวกท่านทั้งสองเสียอีก"
 stewardship_duty_special.2022.c:0 "แต่แน่นอนว่ามันเป็นคำชมจริงๆ มิใช่หรือ หากท่านลองคิดดู?"

 stewardship_duty_special.2025.t:0 "การระงับข้อพิพาท: โอกาส"
 stewardship_duty_special.2025.desc:0 "เมื่อพิจารณาถึงอำนาจต่อรองที่ข้ามีเหนือ [hooked_vassal.GetTitledFirstName] ข้าสามารถร้องขอได้ว่า ไม่ว่าผลลัพธ์ของการทะเลาะวิวาทของ[hooked_vassal.GetHerHis]กับ [other_vassal.GetTitledFirstName] จะเป็นอย่างไร [hooked_vassal.GetSheHe]จะบอกทุกคนว่าข้าได้ตัดสินอย่างยุติธรรมและเที่ยงธรรมเพียงใด"
 stewardship_duty_special.2025.a:0 "[hooked_vassal.GetFirstNameNoTooltip] มี #EMP บางสิ่ง#! ที่ท่านสามารถทำเพื่อข้าได้..."
 stewardship_duty_special.2025.b:0 "นี่ไม่ใช่วิธีการระงับเรื่องราว"
 statecraft_mediation_progress_fairness:0 "[hooked_vassal.GetFirstNameNoTooltip] เน้นย้ำว่าข้ายุติธรรมเพียงใด ซึ่งช่วยเพิ่มโอกาสของผลลัพธ์ที่เป็นบวกอย่างมีนัยสำคัญ"

 stewardship_duty_special.2026.t:0 "การระงับข้อพิพาท: จุดจบ"
 stewardship_duty_special.2026.desc:0 "เสียงกรีดร้องและมือเปื้อนเลือดทักทายข้า ในที่สุดความอดทนก็สิ้นสุดลง และ [killer.GetTitledFirstName] กำลังยืนคร่อมร่างของ [victim.GetTitledFirstName] โดยมี[killer.Custom('signature_weapon')]อยู่ในมือ\n\n"นี่คือการระงับข้อพิพาทที่ยุติธรรมเพียงอย่างเดียวที่ข้าจะได้รับ""
 stewardship_duty_special.2026.a:0 "เจ้าทำอะไรลงไป... เรื่องนี้ต้องตาต่อตา ฟันต่อฟัน"
 stewardship_duty_special.2026.b:0 "เจ้าได้มอบตัวเองสู่ชีวิตในความมืดมิดแล้ว"
 stewardship_duty_special.2026.c:0 "ข้าเห็นว่าข้อพิพาทได้รับการระงับแล้วสินะ!"

 stewardship_duty_special.2027.t:0 "การระงับข้อพิพาท: ตระกูล"
 stewardship_duty_special.2027.desc:0 "ข้อพิพาทของ [vassal_1.GetTitledFirstName] และ [vassal_2.GetTitledFirstNamePossessive] ดำเนินไปไม่สิ้นสุด และเห็นได้ชัดว่ามันดำเนินมาหลายชั่วอายุคนแล้ว\n\nพ่อแม่ ปู่ย่าตายาย บรรพบุรุษห่างไกล ล้วนทะเลาะวิวาทกันเรื่องใดเรื่องหนึ่ง มีทางใดที่จะทำลายวงจรนี้ได้หรือไม่?"
 stewardship_duty_special.2027.a:0 "ราชวงศ์ที่มีชื่อเสียงมากกว่าย่อมมีความสำคัญมากกว่า"
 stewardship_duty_special.2027.b:0 "ชื่อเสียงอันยิ่งใหญ่ไม่ใช่สิ่งที่สร้าง[lower_prestige.Custom('WomenMen')]ผู้ยิ่งใหญ่ขึ้นมา"
 stewardship_duty_special.2027.c:0 "อาณาจักรของเราสร้างขึ้นจากราชวงศ์ผู้ยิ่งใหญ่ทุกรูปแบบ"
 statecraft_mediation_favor_higher_prestige:0 "สิ่งนี้จะถูกมองว่าเข้าข้าง [higher_prestige.GetTitledFirstName]"
 statecraft_mediation_favor_lower_prestige:0 "สิ่งนี้จะถูกมองว่าเข้าข้าง [lower_prestige.GetTitledFirstName]"

 stewardship_duty_special.2071.t:0 "การระงับข้อพิพาท: การเริ่มต้นใหม่"
 stewardship_duty_special.2071.desc:0 "มันเป็นกระบวนการที่เหน็ดเหนื่อย แต่ [vassal_1.GetTitledFirstName] และ [vassal_2.GetTitledFirstName] ไม่ได้จ้องจะทำร้ายกันอีกต่อไป\n\nแท้จริงแล้ว ไม่เพียง แต่พวกเขาจะออกจากราชสำนักของข้าไปพร้อมกับความคับข้องใจที่ได้รับการแก้ไขแล้ว พวกเขายังจากไปในฐานะมิตรสหายใหม่"
 stewardship_duty_special.2071.a:0 "ปาฏิหาริย์ หากข้าเคยเห็นมา"

 stewardship_duty_special.2072.desc:0 "เมื่อ [vassal_1.GetTitledFirstName] และ [vassal_2.GetTitledFirstName] ออกจากราชสำนักของข้าไป — ในที่สุด — ก็ปราศจากความเกลียดชังหรือความอาฆาตแค้นใดๆ ที่เป็นเครื่องหมายของการมาถึงของพวกเขา เราคงต้องดูกันต่อไปว่ามันจะคงอยู่หรือไม่ แต่สำหรับตอนนี้ พวกเขาต่างเคารพ ซึ่งกันและกันมากขึ้น ต้องขอบคุณความพยายามของข้า"
 stewardship_duty_special.2072.a:0 "ไม่ใช่เรื่องง่ายเลย หากข้าจะพูดเอง!"

 stewardship_duty_special.2073.t:0 "การระงับข้อพิพาท: การลำเอียง"
 stewardship_duty_special.2073.desc:0 ""นี่มันไม่เคยเป็นการไกล่เกลี่ยที่ยุติธรรมเลย ใช่หรือไม่?!" [accuser.GetTitledFirstName] รู้สึกไม่พอใจอย่างยิ่งขณะที่ [accuser.GetSheHe] เดินออกจากโถงเข้าเฝ้า "การลำเอียงที่แสดงให้เห็นในที่นี้มันน่าสะอิดสะเอียน!"\n\n[favorite.GetTitledFirstName] ยังคงสงบนิ่ง "ข้าไม่เห็นด้วยกับสิ่งนั้น, [ROOT.Char.Custom('FormOfAddressForLiege')]""
 stewardship_duty_special.2073.a:0 "อา ปล่อยเจ้าคนอกตัญญูไปเถอะ"

 stewardship_duty_special.2074.t:0 "การระงับข้อพิพาท: ไม่เป็นมิตรตลอดกาล"
 stewardship_duty_special.2074.desc:0 "เมื่อ [vassal_1.GetTitledFirstName] และ [vassal_2.GetTitledFirstName] มาถึง ข้าไม่คิดว่าพวกเขาจะสาดความเกลียดชังและความขมขื่นใส่กันได้มากกว่านี้ การจากไปของพวกเขาพิสูจน์แล้วว่าข้าคิดผิด"
 stewardship_duty_special.2074.a:0 "การไกล่เกลี่ยของข้าน่าจะดีกว่านี้"

 stewardship_duty_special.2081.t:0 "การระงับข้อพิพาท: จุดจบ"
 stewardship_duty_special.2081.both_dead:0 "ด้วยการตายของ [vassal_1.GetTitledFirstName] และ [vassal_2.GetTitledFirstName] การทะเลาะวิวาทเล็กน้อยของพวกเขาก็ดูห่างไกล เล็กน้อย และไร้ความหมาย"
 stewardship_duty_special.2081.vassal_1:0 "ด้วยการตายของ [vassal_1.GetTitledFirstName] การต่อสู้และข้อพิพาทที่[vassal_1.GetSheHe]มีกับ [vassal_2.GetTitledFirstName] ดูเล็กน้อย ไม่สำคัญ และไร้ความหมาย"
 stewardship_duty_special.2081.vassal_2:0 "ด้วยการตายของ [vassal_2.GetTitledFirstName] การต่อสู้และข้อพิพาทที่[vassal_2.GetSheHe]มีกับ [vassal_1.GetTitledFirstName] ดูเล็กน้อย ไม่สำคัญ และไร้ความหมาย"
 stewardship_duty_special.2081.a:0 "เมื่อเวลาผ่านไป เราก็ก้าวต่อไป"
 stewardship_duty_special.2081.tt:0 "ความพยายามในการไกล่เกลี่ยของข้าสิ้นสุดลง"
 
 stewardship_duty_special.2082.t:0 "การระงับข้อพิพาท: จุดจบ"
 stewardship_duty_special.2082.desc:0 "เมื่อ [prisoner.GetTitledFirstName] ถูกจองจำ ข้อพิพาทระหว่าง[prisoner.GetHerHim]และ [other.GetTitledFirstName] ดูเหมือนจะมีความสำคัญน้อยลงมาก"
 stewardship_duty_special.2082.a:0 "เราทุกคนต่างหาวิธีระงับความขัดแย้งของเรา"
