l_english: 
 #Generic Lines
 historical_commander_trait.reject.tt:1 "#F ท่านจะมองหาแรงบันดาลใจจากที่อื่น #!"

 #Hannibal
 historical_commander_trait.0001.t:0 ""ศัตรูแห่งโรม""
 historical_commander_trait.0001.desc:1 "ขณะศึกษากลยุทธ์ของแม่ทัพโบราณ ข้า [ROOT.Char.Custom('surprised_reaction')] ที่ได้เรียนรู้เกี่ยวกับวีรกรรมของฮันนิบาล บาร์กา ในช่วงสงครามพิวนิกครั้งที่สอง:\n\n#F เป็นที่รู้จักในนาม 'ศัตรูแห่งโรม' ความสำเร็จอันยิ่งใหญ่ของฮันนิบาลคือยุทธการที่กันไน ซึ่งกองทัพของเขาที่มีกำลังพลประมาณ 50,000 นาย ได้ชิงไหวชิงพริบและโอบล้อมกองทัพโรมันที่ใหญ่กว่าซึ่งมีกำลังพล 86,000 นาย เมื่อถูกล้อมและไม่สามารถล่าถอยได้ ทหารโรมันเพียง 3,000 นายเท่านั้นที่รอดชีวิตจากการสังหารหมู่ครั้งนั้น#! "
 historical_commander_trait.0001.a:0 "เช่นเดียวกับฮันนิบาล ข้าจะทำลายล้างศัตรูของข้า!"
 historical_commander_trait.0001.b:0 "ฮันนิบาลเป็นปรมาจารย์ที่แท้จริงของกลยุทธ์แบบฟาเบียน"
 historical_commander_trait.0001.c:0 "ความคล่องตัวคือจุดแข็งที่ยิ่งใหญ่ที่สุดของฮันนิบาล"
 historical_commander_trait.0001.d:0 "บาห์! เขาเป็นคนโง่ ที่ต่อสู้ในสงครามที่สิ้นหวังของเขา"
 historical_commander_trait.0001.d.good:0 "ความโหดร้ายไม่ใช่ลักษณะนิสัยที่น่าอิจฉา แม้ แต่ในสงคราม"
 #Caesar
 historical_commander_trait.0002.t:0 "ชัยชนะของซีซาร์"
 historical_commander_trait.0002.desc:0 "ขณะศึกษากลยุทธ์ของแม่ทัพโบราณ ข้ารู้สึกขบขันที่ได้เรียนรู้เกี่ยวกับวีรกรรมของจูเลียส ซีซาร์ ในระหว่างการพิชิตกอลของเขา\n\n#F ในระหว่างการล้อมเมืองอาเลเซีย ซีซาร์ตัดสินใจว่าการโจมตีโดยตรงต่อเมืองที่มีป้อมปราการแข็งแกร่งนั้นจะมีค่าใช้จ่ายสูงเกินไป เขาจึงสั่งให้กองทัพสร้างป้อมปราการของตนเองซึ่งล้อมรอบเมืองทั้งเมือง กักขังกองทหารรักษาการณ์ของศัตรูไว้ข้างในให้อดอยาก ขณะเดียวกันก็ป้องกันไม่ให้กองหนุนเข้ามาช่วยเหลือกองกำลังป้องกันได้#! "
 historical_commander_trait.0002.a:0 "ความชาญฉลาดเล็กน้อยช่วยได้มากในการล้อมเมือง"
 historical_commander_trait.0002.b:0 "ทำให้ศัตรูเข้ามาหาเจ้า! ข้าชอบ!"
 historical_commander_trait.0002.c:0 "ซีซาร์เสี่ยงกับแผนนั้น แต่มันก็ได้ผล!"
 historical_commander_trait.0002.d:0 "สงครามสมัยนี้ไม่ได้สู้กันแบบนั้นแล้ว..."
 #Alexander
 historical_commander_trait.0003.t:0 "อเล็กซานเดอร์ผู้ไร้เทียมทาน"
 historical_commander_trait.0003.desc:0 "ขณะศึกษากลยุทธ์ของแม่ทัพโบราณ ข้า [ROOT.Char.Custom('surprised_reaction')] ที่ได้เรียนรู้เกี่ยวกับวีรกรรมของอเล็กซานเดอร์มหาราช ในระหว่างการพิชิตเมโสโปเตเมียของเขา\n\n#F ในระหว่างการล้อมเมืองไทร์ อเล็กซานเดอร์โจมตีป้อมปราการบนเกาะโดยการรื้อถอนเมืองใกล้เคียงแล้วใช้ซากปรักหักพังสร้างทางเชื่อมที่ทอดยาวจากแผ่นดินใหญ่ไปยังกำแพงเมือง สิ่งนี้ทำให้เครื่องล้อมเมืองของเขาสามารถโจมตีป้อมปราการของศัตรูได้โดยตรง แม้ว่าท้ายที่สุดแล้วจะเป็นกองทัพเรือของเขาที่สร้างช่องโหว่ได้ก็ตาม#! "
 historical_commander_trait.0003.a:0 "ไม่มีผืนน้ำใดจะหยุดยั้งกองทัพของข้าได้!"
 historical_commander_trait.0003.b:0 "ทางเชื่อมนั้นเป็นความสำเร็จอันยิ่งใหญ่ของความชาญฉลาด"
 historical_commander_trait.0003.c:0 "ใช้ทรัพยากรของศัตรูมาต่อต้านพวกเขาเองรึ? ยอดเยี่ยม!"
 historical_commander_trait.0003.d:0 "เหตุใดจึงเสียเวลาศึกษากลยุทธ์ที่ไม่ได้ผล?"

 #Constantine
 historical_commander_trait.0004.t:0 "นิมิตแห่งไคโร"
 historical_commander_trait.0004.desc:0 "ขณะศึกษากลยุทธ์ของแม่ทัพโบราณ ข้าได้รับแรงบันดาลใจเมื่อได้เรียนรู้เกี่ยวกับชัยชนะของคอนสแตนตินในยุทธการที่สะพานมิลเวียน\n\n#F คืนก่อนการรบ คอนสแตนตินฝันว่าชัยชนะจะได้รับหากเขาวาดสัญลักษณ์ไคโร ซึ่งเป็นสัญลักษณ์ของพระคริสต์ ลงบนโล่ของทหาร เขาทำเช่นนั้น และในวันรุ่งขึ้นเขาก็เอาชนะกองกำลังของผู้ชิงบัลลังก์มักเซนติอุส ซึ่งตกลงไปในแม่น้ำไทเบอร์และจมน้ำตาย#! "
 historical_commander_trait.0004.a:0 "คนชั่วร้ายมิอาจต่อกรกับกองทัพของพระเจ้าได้!"
 historical_commander_trait.0004.b:0 "เช่นเดียวกับคอนสแตนติน ไม่มีแม่น้ำใดสามารถขัดขวางชัยชนะของข้าได้!"
 historical_commander_trait.0004.c:0 "ตามหลักเหตุผลแล้ว กลยุทธ์ที่ยืดหยุ่นชนะการรบนั้น"
 historical_commander_trait.0004.d:0 "กลอุบายเพื่อเสริมสร้างขวัญกำลังใจไม่เพียงพอที่จะชนะสงคราม!"

 #Khalid ibn al-Walid
 historical_commander_trait.0005.t:0 "ดาบแห่งอัลลอฮ์"
 historical_commander_trait.0005.desc:0 "ขณะศึกษากลยุทธ์ของแม่ทัพในประวัติศาสตร์ ข้าครุ่นคิดเมื่อได้เรียนรู้เกี่ยวกับการรบครั้งแรกของคาลิด อิบน์ อัล-วาลิด หลังจากการเปลี่ยนมานับถือศาสนาอิสลามของเขา\n\n#F มีจำนวนน้อยกว่าพวกไบแซนไทน์มากกว่า 3 ต่อ 1 ในระหว่างยุทธการที่มุอ์ตะฮ์ คาลิดรวบรวมกำลังใจทหารที่กำลังหวั่นไหวของเขาให้ยืนหยัดต่อสู้ การยืนหยัดอย่างท้าทายนี้ทำให้เขาสามารถจัดระเบียบการล่าถอยไปยังเมดินา ช่วยชีวิตคนของเขาจากการตายอย่างแน่นอน คาลิดและกองทัพของเขาต่อมาได้พิชิตอาระเบียทั้งหมดในนามของอัลลอฮ์!#! "
 historical_commander_trait.0005.a:0 "ผู้ที่ต่อสู้ในนามของอัลลอฮ์จะได้รับชัยชนะ!"
 historical_commander_trait.0005.b:0 "ความศรัทธา ทำให้เราแข็งแกร่งเมื่อมีจำนวนน้อยกว่า"
 historical_commander_trait.0005.c:0 "การรู้ #EMP ว่าเมื่อใด#! ที่จะต่อสู้มีความสำคัญพอ ๆ กับการรู้ #EMP ว่าอย่างไร#! "
 historical_commander_trait.0005.d:0 "เหตุใดจึงเฉลิมฉลองความพ่ายแพ้ที่น่าอับอาย?"

 #Bilge Khagan
 historical_commander_trait.0006.t: "ข่านผู้ปรีชา"
 historical_commander_trait.0006.desc: "ขณะที่ข้าศึกษาตำรายุทธวิธีของเหล่าแม่ทัพโบราณ ข้าได้รับแรงบันดาลใจเมื่อได้ค้นพบเรื่องราวการพิชิตของบิลเก คากาน ซึ่งแผ่ไพศาลไปทั่วสี่ทิศของโลก\n\nด้วยการบุกปล้นผ่านบาซิมิและกาโจว บิลเก คากานสร้างความอัปยศแก่กองทัพของจักรพรรดิเสวียนจงแห่งถัง แม้ว่าจะมีกำลังพลนับแสนก็ตาม เขามองเห็นอย่างแท้จริงว่าแสนยานุภาพของเรานั้นอยู่ที่ความรวดเร็วและความคล่องตัว! \n\nต่อมาบิลเกและกองทัพของเขาได้บดขยี้ชาวคีตันและชาวซีในนามแห่งเทพเทงรี!"
 historical_commander_trait.0006.a: "ด้วยพรแห่งสวรรค์ เราจึงยืนหยัด!"
 historical_commander_trait.0006.b: "$historical_commander_trait.0005.c$"
 historical_commander_trait.0006.c: "ยุทธวิธีที่ยืดหยุ่นจำเป็นสำหรับกองทัพที่คล่องตัว!"
 historical_commander_trait.0006.d: "เราเหนือกว่าการใช้เพียงกลอุบายตื้นๆ!"

 #Alexander
 historical_commander_trait.0007.t:0 "ซุนวู"
 historical_commander_trait.0007.desc:0 "ขณะที่ศึกษาสุดยอดคัมภีร์การทหารทั้งเจ็ด ข้า [ROOT.Char.Custom('surprised_reaction')] เมื่อได้ล่วงรู้ถึงยุทธการที่ป๋อจวี่ ที่ ซึ่งซุนวูได้พิสูจน์คุณค่าแห่งทฤษฎีการสงครามของตน\n\n#F ในยุคชุนชิว กล่าวกันว่าซุนวูได้นำทัพอู๋ไปสู่ชัยชนะ เอาชนะกองกำลังของแคว้นฉู่ซึ่งมีจำนวนมากกว่า โดยใช้ทฤษฎีการทหารของเขาซึ่งเป็นที่ศึกษาอย่างดีในบัดนี้#!"
 historical_commander_trait.0007.a:0 "เส้นแบ่งระหว่างความยุ่งเหยิงและความเป็นระเบียบนั้น อยู่ที่การประสานสอดคล้อง"
 historical_commander_trait.0007.b:0 "ข้าต้องมุ่งหมายที่จะพิชิตศัตรูโดยมิต้องสู้รบ"
 historical_commander_trait.0007.c:0 "เมื่อเคลื่อนทัพ จงจู่โจมดุจสายฟ้าฟาด!"
 historical_commander_trait.0007.d:0 "ชัยชนะอันยิ่งใหญ่ที่สุด คือชัยชนะที่ไม่ต้องมีการรบพุ่ง"
