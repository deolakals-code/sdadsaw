l_english: 
 #You visit some baronies or go partying, by Ewan Cowhig Croft
 martial_authority.5000.t:0 "การตรวจตราดินแดนห่างไกล"
 martial_authority.5000.authoritative_religion.desc:1 "ข้านวดขมับที่ปวดตุบ ขณะที่ขุนนางผู้หนึ่งอ่านสารฉบับที่สิบสองจาก [baron_1_lands.GetNameNoTier] ในปีนี้ให้ข้าฟัง ดินแดนศักดินาสำคัญหลายแห่ง เช่นนี้ การควบคุมของข้าได้ลดน้อยลงในช่วงหลายเดือนมานี้...\n\nการเดินทางตรวจตราดินแดนห่างไกลเหล่านี้สักเล็กน้อย ตามหน้าที่ของข้า อาจ ทำให้พวกเขาอยู่ภายใต้การควบคุมของข้าอย่างมั่นคงยิ่งขึ้น ในทางกลับกัน [party_vassal.Custom2('MyCharacterIntroduction', ROOT.Char)] ได้เชิญข้าไปร่วมงานเลี้ยงส่วนตัว..."
 martial_authority.5000.relaxed_religion.desc:0 "ข้าขยี้ขมับที่เต้นตุบๆ ขณะที่ข้าราชการอ่านสาส์นฉบับที่สิบสองจาก [baron_1_lands.GetNameNoTier] ในปีนี้ให้ข้าฟัง ที่ดินสำคัญหลายแห่ง เช่นนี้ได้เห็นอำนาจควบคุมของข้าลดน้อยลงในช่วงหลายเดือนที่ผ่านมา แต่การตรวจตราดินแดนห่างไกลเหล่านี้เล็กน้อยอาจ ทำให้พวกเขาอยู่ภายใต้อำนาจของข้าอย่างมั่นคงยิ่งขึ้น\n\nในทางกลับกัน [party_vassal.Custom2('MyCharacterIntroduction', ROOT.Char)] ได้เชิญข้าไปร่วมงานเลี้ยงส่วนตัว..."
 martial_authority.5000.a:0 "[ROOT.Char.GetTitleAsNameNoTooltip] ที่ดีควรเยี่ยมเยียนผู้น้อยของ [ROOT.Char.GetHerHis] เป็นครั้งคราว"
 martial_authority.5000.b:0 "ข้า #EMP มีพันธะ#! ที่ต้องไปงานเลี้ยงนั้น!"
 martial_authority.5000.a.characters_baron_final_list:0 "[baron_1.GetShortUIName|U], [baron_2.GetShortUIName], และ [baron_3.GetShortUIName]"
 martial_authority.5000.a.land_baron_final_list:0 "[baron_1_lands.GetNameNoTier], [baron_2_lands.GetNameNoTier], และ [baron_3_lands.GetNameNoTier]"
 authority_central_control_modifier:0 "การกำกับดูแลระบบศักดินาอย่างกว้างขวาง"

 #Your young heir terrorizes your vassals
 martial_authority.8000.t:0 "การประลองอาละวาด"
 martial_authority.8000.desc:0 "[marshal.GetCouncilTitle] ของข้ากำลังจัดการประลองที่ดูเหมือนจะเป็นครั้งที่ร้อยของปี และทั้งหมดที่ข้าทำได้คือพยายาม ทำให้ตัวเองตื่นอยู่เสมอ จิตใจของข้าถูกกระตุ้นให้กลับมามีชีวิตชีวาอีกครั้งเมื่อข้ารู้สึกถึงการดึงที่ข้อศอกของข้า\n\n[fighting_child.Custom('GetDaughterSon')] วัยเยาว์ของข้า [fighting_child.GetName] ฝืนธรรมชาติทุกประการ กำลังเดินโซเซไปมาพร้อมกับถือหอกที่ใหญ่กว่า [fighting_child.GetHerHis] สี่เท่า และได้พบหมวกเกราะที่ไม่พอดี ซึ่งเลื่อนลงมาปิดตาของ [fighting_child.GetHerHis] อยู่เรื่อย ๆ\n\n"[ROOT.Char.GetMotherFather|U] ข้าขอสู้สักรอบในการต่อสู้ได้หรือไม่?""
 martial_authority.8000.a:0 "ข้าจะอนุญาต แต่สั่งว่าอย่าให้ผู้ใดทำร้าย [fighting_child.GetHerHim]"
 martial_authority.8000.tt:0 "[fighting_child.GetName] เข้าร่วมการประลอง"
 martial_authority.8000.a.tt:0 "[fighting_child.GetSheHe|U] อาจพิสูจน์ [fighting_child.GetHerselfHimself]"
 martial_authority.8000.tt.failure:0 "[fighting_child.GetName] ล้มเหลวในการสร้างความโดดเด่นให้ [fighting_child.GetHerselfHimself]"
 martial_authority.8000.b:0 ""แน่นอน ลูกรัก! ขอให้นักรบทุกคนอย่าได้ยั้งความโกรธเกรี้ยวของ [fighting_child.GetHerHis]!""
 martial_authority.8000.c:0 ""เป็นเด็กดีแล้วไปเล่นกับม้าเถิด""
 martial_authority.8000.d:0 ""นี่ไม่ใช่ที่สำหรับ [fighting_child.Custom('GirlBoy')] น้อย""
 martial_authority_child_trait_gain:0 "[fighting_child.GetName] ได้รับลักษณะ"
 martial_authority_brave:0 "$trait_brave$"
 martial_authority_arrogant:0 "$trait_arrogant$"
 martial_authority_wrathful:0 "$trait_wrathful$"
 martial_authority_one_eyed_child_title:0 "$trait_one_eyed$!"
 martial_authority_one_eyed_child:0 "[fighting_child.GetNameNoTooltip] เสียตาไปข้างหนึ่งในการประลอง"
 martial_authority_disfigured_child_title:0 "$trait_disfigured$!"
 martial_authority_disfigured_child:0 "[fighting_child.GetNameNoTooltip] เสียโฉมหลังจากได้รับบาดเจ็บในการประลอง"
 martial_authority_unremarkable_child_title:0 "บุตรของท่านช่างธรรมดา!"
 martial_authority.8000_injury: "[fighting_child.GetName] ได้รับบาดเจ็บ"
 martial_authority_unremarkable_child:0 "[fighting_child.GetNameNoTooltip] พิสูจน์ว่า [fighting_child.GetHerselfHimself] ธรรมดาอย่างสิ้นเชิงในการประลอง"
 martial_authority.8100.desc:0 "นักสู้ในการตะลุมบอนเต้นรำเป็นวงกลมอย่างงุ่มง่ามรอบๆ [fighting_child.GetName] เห็นได้ชัดว่าเกรงว่าจะทำร้าย [fighting_child.GetHerHim] อย่างไรก็ตาม [fighting_child.GetSheHe] ตอบโต้ด้วยการโจมตีสกปรก ไม่สนใจกฎการประลองทั้งหมด\n\nข้ามองดูขณะที่ [fighting_child.GetSheHe] แทงด้ามยาวสิบสี่ฟุตทะลุกะโหลกด้านหลังของ [ROOT.Char.Custom('KnightCultureNoTooltipLowercase')] [murdered_knight.GetNamePossessive] นักสู้ยังคงโจมตี [fighting_child.GetHerHim] เพียงเล็กน้อย ในขณะที่ [fighting_child.GetSheHe] แทงสมองของนักสู้อีกคน\n\n"ยกเลิกการประลองนี้เถิด [ROOT.Char.GetLadyLord|U] ของข้า!" [marshal.GetTitledFirstName] อ้อนวอน"
 martial_authority.8100.a:0 "ดูเหมือนว่าเราจะได้ผู้ชนะแล้ว!"
 martial_authority.8100.c:0 "โอ้ [ROOT.GetCharacter.GetFaith.HighGodName] ผู้ยิ่งใหญ่ [fighting_child.GetNameNoTooltip]! ข้าขออภัยแทน [fighting_child.GetHerHim] ด้วย"

 #Innovating with weaponry
 martial_authority.4000.t:0 "เครื่องมือขึ้นสนิม"
 martial_authority.4000.desc:0 "เมื่อมองผ่านความมืดสลัวที่เต็มไปด้วยฝุ่นของคลังสรรพาวุธ สายตาของข้ากวาดไปทั่วอาวุธสงครามหลากหลายชนิด สนับแข้งหนังที่ชำรุดคู่หนึ่ง ดาบที่เพิ่งลับคม หอกที่มีด้ามจับสึก... #EMP เครื่องมือทำฟาร์มขึ้นสนิม?!#!\n\nข้าหยิบเครื่องมือทำฟาร์มขึ้นมา บางทีมันอาจถูกรวมไว้อย่างไม่รู้ตัวกับอาวุธ? ข้ายกเครื่องมือขึ้น ตรวจสอบใบมีดโค้งคล้ายเคียวที่น่าสงสัย ขณะที่ข้าลองเหวี่ยงมันใส่เสื้อเกราะโซ่ที่อยู่ใกล้ๆ\n\nใบมีดแทงทะลุเกราะโซ่ ทำให้ห่วงเหล็กสองสามวงกระจัดกระจายไปทั่วพื้น\n\n#EMP น่าสนใจ#! "
 martial_authority.4000.a:0 "ข้าสงสัยว่าสิ่งนี้จะนำไปใช้ประโยชน์ใหม่ได้หรือไม่?"
 martial_authority.4000.b:0 "พอแค่นั้นแหละ"
 martial_authority.4000.a.tt:0 "ท่านตรวจสอบหาวิธีเปลี่ยนเครื่องมือนี้ให้เป็นอาวุธ"
 martial_authority.4000.b.tt:0 "ท่านค้นหาวิธีอื่นในการฝึกฝนทักษะการต่อสู้ของท่าน"

 martial_authority.4001.t:0 "เครื่องมือขึ้นสนิม: ทางเลือก ทางเลือก..."
 martial_authority.4001.desc:0 "เมื่อนำใบมีดเล็กๆ ออกไปกลางแสงแดดตอนเที่ยง ข้าตรวจสอบมันอย่างใกล้ชิดยิ่งขึ้น ใบมีดเรียวแหลมที่ปลายด้านหนึ่งและหายเข้าไปในกั่นที่อีกด้านหนึ่ง เหลือความยาวของเหล็กที่ขึ้นสนิมเล็กน้อย — แต่ยังคม — อยู่ระหว่างนั้น\n\nรอยหักงอที่หัวใบมีด ทำให้เครื่องมือมีความโค้งอันร้ายกาจ มีประโยชน์สำหรับการตัดผ่านพุ่มไม้ ท่านคงคิด เช่นนั้น หรือบางทีอาจใช้หาช่องว่างในชุดเกราะ?\n\nเป็นที่ชัดเจนว่าสิ่งนี้สามารถนำไปใช้ประโยชน์ใหม่เป็นอาวุธสงครามได้ แต่คำถามยังคงอยู่ว่าอาวุธดังกล่าวจะมีรูปแบบใด..."
 martial_authority.4001.a:0 "หากท่าน ทำให้ใบมีดตรง มันอาจเป็นกริชที่มีประโยชน์..."
 martial_authority.4001.a.tt:0 "ท่านพยายามสร้างเครื่องมือให้เป็นอาวุธแทงสั้น"
 martial_authority.4001.b:0 "บางทีถ้าเราติดมันไว้ที่ปลายหอก?"
 martial_authority.4001.b.tt:0 "ท่านกลับเข้าไปข้างใน ค้นหาเชือกยาว..."
 martial_authority.4001.c:0 "ทำไมเราไม่ปล่อยมันไว้ตามเดิม?"
 martial_authority.4001.c.tt:0 "บางทีสิ่งนี้อาจเป็นอาวุธที่มีประสิทธิภาพโดยไม่ต้องดัดแปลง?"
 martial_authority.4001.b.failure:0 "ท่านทำเครื่องมือหัก!"
 martial_authority_4001.dagger.tt:0 "ท่านสร้างกริชพื้นฐานจากเครื่องมือ"
 martial_authority_4001.halberd.tt:0 "ท่านสร้างง้าวพื้นฐานจากเครื่องมือ"
 martial_authority_4001.billhook.tt:0 "ท่านลับคมใบมีด"
 martial_authority_4001.fail.tt:0 "ท่านล้มเหลวในการสร้างสิ่งที่มีประโยชน์จากเครื่องมือ"

 martial_authority.4002.t:0 "เครื่องมือขึ้นสนิม: ใบมีดดัดแปลง"
 martial_authority.4002.desc:0 "ในฐานะ [ROOT.Char.GetLadyLord|U] ข้าไม่ได้เชี่ยวชาญในกระบวนการดัดแปลงอาวุธสงครามเท่าใดนัก แม้ว่าข้าจะกระตือรือร้น แต่ก็ชัดเจนอย่างรวดเร็วว่าข้าต้องการคำแนะนำจากผู้เชี่ยวชาญ\n\nข้าเรียกช่างตีเหล็ก [blacksmith.GetFirstName] ที่ดูเหนื่อยหน่ายของที่พำนัก — ผู้ ซึ่งพึมพำบางอย่างที่ข้าฟังไม่ทันเกี่ยวกับผู้ปกครองและโครงการส่วนตัวของพวกเขา — และหลังจากตะไบและลับคมประมาณหนึ่งวัน งานของข้าก็เสร็จสมบูรณ์\n\nใบมีดที่เคยโค้งได้ถูก ทำให้ตรง ใบมีดที่สั้นลงนำไปสู่ปลายเรียวแหลม พร้อมร่องมุมเอียงที่วิ่งลงมาตามด้านแบนของใบมีด มันไม่ใช่อาวุธที่สวยงาม แต่ถึงกระนั้นมันก็คืออาวุธ"
 martial_authority.4002.a:0 "มันสมบูรณ์แบบ!"
 martial_authority.4002.b:0 "มันดีกว่าอันของข้าเสียอีก!"
 martial_authority_4002.make.tt:0 "ท่านได้รับ [improvised_dagger.GetName]"

 martial_authority.4003.t:0 "เครื่องมือขึ้นสนิม: ง้าวดัดแปลง"
 martial_authority.4003.desc:0 "เมื่อยันหอกที่ข้าเห็นก่อนหน้านี้ระหว่างขากับโต๊ะ ข้าพันเชือกหยาบรอบเครื่องมือทำฟาร์มและหัวหอก มัดทั้งสองเข้าด้วยกัน ในตอนแรกหัวหอกโคลงเคลงอย่างน่าตกใจ แต่การใช้แถบหนังต้มในวันถัดมา — ซึ่งได้รับความอนุเคราะห์จากช่างฟอกหนัง [blacksmith.GetFirstName] ของที่พำนัก — ก็เสร็จสิ้นการดัดแปลง\n\nอาวุธที่ข้าสร้างขึ้นดูสมส่วนอย่างแน่นอน ขนาดของหอกให้ระยะและการแทง ในขณะที่ใบมีดตะขอของเครื่องมือทำฟาร์มสามารถดึงคนลงจากหลังม้าหรือแทรกเข้าไปในรอยต่อของชุดเกราะได้อย่างง่ายดาย\n\nมันเป็นอาวุธที่หยาบ แต่พร้อมใช้งาน แต่ข้ามีความรู้สึกว่ามันอาจจะ #EMP มีประสิทธิภาพ#! ทีเดียว..."
 martial_authority.4003.a:0 "มาดูกันว่าชุดเกราะหรูหราของเจ้าจะต้านทานสิ่งนี้ได้หรือไม่!"
 martial_authority.4003.b:0 "มันดีกว่าอันของข้าเสียอีก!"
 martial_authority_4003.make.tt:0 "ท่านได้รับ [improvised_halberd.GetName]"

 martial_authority.4004.t:0 "เครื่องมือขึ้นสนิม: สมบูรณ์แบบในแบบที่เป็น"
 martial_authority.4004.desc:0 "เครื่องมือ — ซึ่งช่างตีเหล็ก [blacksmith.GetFirstName] ของที่พำนักอธิบายให้ข้าฟังว่าเรียกว่า 'บิลฮุก' ขณะที่ข้าดูแล [blacksmith.GetHerHim] ลับคมมันอย่างกระตือรือร้น — ดูเหมือนอาวุธสงครามอย่างแน่นอน\n\nใบมีดโผล่ออกมาจากกั่นพร้อมคมกริบอันร้ายกาจ วิ่งขึ้นไปและผ่านหัวตะขอที่มีน้ำหนัก ปลายที่เพิ่งลับคมใหม่ส่องประกายในแสงแดดตอนเที่ยงขณะที่ข้าสอดมันเข้าไปในรอยต่อของชุดเกราะหนังต้มที่ชำรุดก่อนที่จะกระชากกลับมาทางข้า ตัดห่วงยึดขาดในครั้งเดียว"
 martial_authority.4004.a:0 "ชาวนาผู้ต่ำต้อยของเราเก็บงำความลับอะไรไว้อีกบ้าง?"
 martial_authority.4004.b:0 "ข้าชอบสิ่งเหล่านี้ แจกจ่ายไปทั่วอาณาจักร!"
 martial_authority_4004.make.tt:0 "ท่านได้รับ [improvised_billhook.GetName]"
