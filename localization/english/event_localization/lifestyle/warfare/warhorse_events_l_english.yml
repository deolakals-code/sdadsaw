l_english: 
 warhorse.0001.t:0 "ม้าศึก"
 warhorse.0001.desc:0 "ขณะชื่นชม[ROOT.Char.Custom('HorseStoryMareStallion')] ซึ่งบัดนี้ทำตามทุกคำสั่งของข้า ข้าครุ่นคิดว่าจะเรียก[ROOT.Char.Custom('HorseStoryHerHim')]ว่ากระไร..."
 warhorse.0001.a:0 "ชื่อที่ได้แรงบันดาลใจจากประวัติศาสตร์!"
 warhorse.0001.b:0 "ตำนานเทพนิยายเต็มไปด้วยชื่อม้าอันน่าเกรงขาม!"
 warhorse.0001.c:0 "มันเป็นเพียงม้าตัวหนึ่ง และควรตั้งชื่อตามนั้น"

 warhorse.0002.desc:0 "ด้วยแรงบันดาลใจจากม้าชื่อดังของผู้นำและวีรบุรุษในอดีต ข้าจะตั้งชื่อ[ROOT.Char.Custom('HorseStoryMareStallion')]ของข้าตามชื่อหนึ่งในนั้น"
 warhorse.0002.a:1 "เทนเซนเดอร์ — เช่นเดียวกับม้าของพระเจ้าชาร์เลอมาญ!"
 warhorse.0002.b:0 "บูเซฟาลัส — เช่นเดียวกับม้าของอเล็กซานเดอร์มหาราช!"
 warhorse.0002.c:0 "เซยาเนียน — ชะตากรรมของเนอุส เซอุส ต้องถูกกล่าวเกินจริงแน่!"
 warhorse.0002.d:0 "ซุลจานาห์ — สำหรับม้าของฮุเซน อิบน์ อาลี!"
 warhorse.0002.e:0 "กระต่ายแดง — ตามชื่อม้าของขุนศึกลิโป้!"
 warhorse.0002.f:0 "เวย์ลองตีฟ — เหมือนม้าของโรลองด์!"
 warhorse.0002.g:0 "อินซิตาตุส — ตัวโปรดของจักรพรรดิคาลิกูลา!"
 warhorse.0002.go_back:0 "อืม แนวคิดอื่นสำหรับชื่อน่าจะเหมาะกว่า..."

 warhorse.0003.desc:1 "โลกแห่งตำนานเทพนิยายนั้นเต็มไปด้วยความยิ่งใหญ่ และชื่อสำหรับม้า"
 warhorse.0003.llamrei:0 "ลัมเรย์ — ตามชื่อม้าของกษัตริย์อาเธอร์!"
 warhorse.0003.sleipnir:0 "สเลปนีร์ — เช่นเดียวกับม้าทรงที่โอดินทรงขี่!"
 warhorse.0003.uchchaihshravas:0 "อุจไจศรพ — พาหนะของสุริยเทพ!"
 warhorse.0003.dadhi_kra:0 "ทธิกรา — ดวงอาทิตย์ยามเช้า!"
 warhorse.0003.devadatta:0 "เทวทัต — เช่นเดียวกับม้าของพระกัลกี!"
 warhorse.0003.keshi:0 "เกศี — ตามชื่ออสูรม้า!"
 warhorse.0003.kanthaka:0 "กัณฐกะ — สำหรับม้าคู่ใจของพระโคตมพุทธเจ้า!"
 warhorse.0003.burko:0 "บูร์โก — เหมือนม้าวิเศษจากนิทานพื้นบ้าน!"
 warhorse.0003.aranjagaan:0 "อารันจากาน — พาหนะจากมหากาพย์จังกัร!"
 warhorse.0003.haizum:0 "ไฮซุม — ม้าของอัครทูตสวรรค์กาเบรียล!"
 warhorse.0003.buraq:0 "บุรอก — ตามชื่อสิ่งมีชีวิตที่แบกศาสดา!"
 warhorse.0003.balius:0 "บาลิอุส — หนึ่งในม้าของอคิลลีส!"
 warhorse.0003.xanthos:0 "ซานธอส — ชื่อม้าอีกตัวของอคิลลีสจะเหมาะกว่า!"
 warhorse.0003.boreas:0 "โบเรียส — เทพเจ้ากรีกโบราณแห่งลมเหนือ!"
 warhorse.0003.khiimori: "คีโมริ, อาชาสายลม, สัญลักษณ์แห่งจิตวิญญาณ!"
 warhorse.0003.rlung_rta: "รลุงตา, ผู้นำพาคำอธิษฐานและโชคดี!"
 warhorse.0003.jonon_khar: "โจนอนข่าร์, อาชาเหินหาวผู้ร่ำร้องดุจเสียงซอหัวม้า"
 warhorse.0003.tulpar: "ทุลพาร์ — สัตว์เทวะมีปีก ผู้มีความเร็วไร้เทียมทาน"
 warhorse.0003.aranzhale: "อารันซาเล, ตามชื่ออาชาอีกตัวหนึ่งของจังการ์"
 warhorse.0003.oyomaa: "โอโยมา, ตามชื่อสัตว์ทมิฬชั้นเลิศของเมงเกน ชิกชีร์เก"
 warhorse.0003.rakhsh: "รัคช์, จาก#EMP ชาห์นาเมห์#!, ผู้มีรูปดุจราชสีห์และพละกำลังดั่งคชสาร"

 warhorse.0004.desc:0 "ม้าควรได้รับการตั้งชื่อตามสิ่งมีชีวิตพื้นฐานที่มันเป็น"
 warhorse.0004.a:0 "ม้าศึก"
 warhorse.0004.b:0 "เจ้าอาวาส"
 warhorse.0004.c:0 "นักย่างเยื้อง"
 warhorse.0004.d:0 "กีบประกาย"
 warhorse.0004.courser: "อาชาศึก"

 warhorse.1001.t:1 "[ROOT.Char.Custom('WarhorseStoryName')|U]: [ROOT.Char.Custom('HorseStoryMareStallion')|U]คู่ใจ"
 warhorse.1001.desc:0 "ครูฝึกชื่อดังได้เข้ามาหาข้าหลังจากได้ยินข่าวลือเกี่ยวกับ[ROOT.Char.Custom('HorseStoryMareStallion')]อันทรงพลังของข้า [ROOT.Char.Custom('WarhorseStoryName')] และเสนอให้บริการ[ROOT.Char.Custom('RandomHerHis')]\n\n"สิ่งที่ข้าขอเป็นการตอบแทนมีเพียงค่าตอบแทนเล็กน้อยเท่านั้น""
 warhorse.1001.a:0 "[ROOT.Char.Custom('HorseStorySheHe')|U]จำเป็นต้องแข็งแกร่งขึ้น"
 warhorse.1001.b:0 "การเคลื่อนไหวให้ว่องไวยิ่งขึ้นเป็นสิ่งที่[ROOT.Char.Custom('HorseStorySheHe')]ต้องเรียนรู้"
 warhorse.1001.c:0 "[ROOT.Char.Custom('HorseStorySheHe')|U]จำเป็นต้องฝึกฝนความอดทนของ[ROOT.Char.Custom('HorseStoryHerHis')]"
 warhorse.1001.d:0 "หากมีสิ่งหนึ่งที่[ROOT.Char.Custom('HorseStorySheHe')]ขาดไป นั่นคือความดุร้าย!"
 warhorse.1001.e:0 "ข้าไม่สนใจ"
 warhorse.1001.e.tt:1 "#F "[THIS.Char.Custom('WarhorseStoryName')]ไม่ต้องการครูฝึกอื่นใดนอกจากข้า!"#!"
 warhorse.1001.f:0 "นั่นคือสิ่งที่ข้าจ่ายเงินให้$master_of_horse_court_position$!"
 warhorse.1001.f.tt:1 "$master_of_horse_court_position$ของท่านเริ่มฝึก[THIS.Char.Custom('WarhorseStoryName')]"
 warhorse.1001.f.failure:0 "ท่านประเมิน$master_of_horse_court_position$ของท่านสูงเกินไป"
 warhorse.1001.f.failure.tt:0 "[m_horse.GetTitledFirstNameNoTooltip]ล้มเหลวในการฝึก[ROOT.Char.Custom('WarhorseStoryName')]"

 warhorse.1002.desc:0 "[ROOT.Char.Custom('WarhorseStoryName')]ตอบรับการฝึกของ[ROOT.Char.Custom('HorseStoryHerHis')]เป็นอย่างดี และเห็นผลได้ทันที!"
 warhorse.1002.a:0 "นั่นเป็นเงินที่ใช้ไปอย่างคุ้มค่า!"

 warhorse.1101.t:1 "[ROOT.Char.Custom('WarhorseStoryName')|U]: วันฟ้าใส"
 warhorse.1101.desc:0 "ขณะที่ข้าเดินไปยังเสาผูกม้า ข้าได้รับการต้อนรับด้วยเสียงร้องอย่างมีความสุขของ[ROOT.Char.Custom('WarhorseStoryName')] [ROOT.Char.Custom('HorseStorySheHe')|U]ดูเหมือนกระตือรือร้นที่จะยืดเส้นยืดสาย[ROOT.Char.Custom('HorseStoryHerHis')]ในสภาพอากาศที่สวยงาม และข้าก็ทำได้เพียงเห็นด้วย"
 warhorse.1101.a:0 "ข้าต้องใช้ทุกช่วงเวลาเพื่อฝึกฝน!"
 warhorse.1101.b:0 "วันนี้ช่างดีเกินกว่าจะไม่ชื่นชมอย่างเหมาะสม!"

 warhorse.1201.t:1 "[ROOT.Char.Custom('WarhorseStoryName')|U]: [ROOT.Char.Custom('HorseStoryMareStallion')|U]ที่ป่วย"
 warhorse.1201.desc:0 "ขณะที่[ROOT.Char.Custom('WarhorseStoryName')]เดินโซซัดโซเซมาหาข้า ลากขา[ROOT.Char.Custom('HorseStoryHerHis')]และก้มหัว[ROOT.Char.Custom('HorseStoryHerHis')]ลง ไม่ต้องสงสัยเลย — [ROOT.Char.Custom('HorseStoryMareStallion')]ป่วย\n\nผู้ดูแลรับรองกับข้าว่ามียารักษาอาการป่วยของ[ROOT.Char.Custom('HorseStoryHerHim')]ได้ แต่ราคาสูงลิ่ว"
 warhorse.1201.a:0 "ไม่มีราคาสูงเกินไปสำหรับ[ROOT.Char.Custom('WarhorseStoryName')]สุดที่รักของข้า!"
 warhorse.1201.b:0 "ไม่ว่าสิ่งใดจะเกิดขึ้นล้วนเป็นพระประสงค์ของ[ROOT.Char.GetFaith.HighGodName]"
 warhorse.1201.b_good:1 "[ROOT.Char.Custom('WarhorseStoryName')]รอดชีวิต"
 warhorse.1201.b.tt:1 "ทว่า [THIS.Char.Custom('HorseStorySheHe')|U]ดูเหมือนจะเชื่อใจท่านน้อยลง"
 warhorse.1201.b_bad:1 "[ROOT.Char.Custom('WarhorseStoryName')]ตายด้วยอาการป่วย"

 warhorse.1301.t:1 "[ROOT.Char.Custom('WarhorseStoryName')|U]: ผู้คลั่งไคล้ม้า"
 warhorse.1301.desc:1 "[horse_vassal.Custom2('MyCharacterIntroduction', ROOT.Char)|U]มอง[ROOT.Char.Custom('WarhorseStoryName')]ขึ้นๆ ลงๆ พยักหน้าอย่างเห็นด้วย\n\n"ช่างเป็น[ROOT.Char.Custom('HorseStoryMareStallion')]ที่ยอดเยี่ยมยิ่งนักที่ท่านมีอยู่ที่นี่ [ROOT.Char.GetTitleTierName]ของข้า! หากท่านจะอนุญาตให้ข้านำ[ROOT.Char.Custom('HorseStoryHerHim')]ไปขี่เล่น ข้าจะรู้สึกขอบคุณเป็นอย่างยิ่ง""
 warhorse.1301.a:0 "ตามสบายเลย!"
 warhorse.1301.a.tt:0 "[THIS.Char.Custom('WarhorseStoryName')]เป็นม้าที่ดุร้าย และ[horse_vassal.GetFirstNameNoTooltip]ไม่เป็นที่รู้จักในด้านความเก่งกาจ[horse_vassal.GetHerHis] — [horse_vassal.GetSheHe]จะไม่เป็นไรหรือ?"
 warhorse.1301.b:0 "ไม่มีใครขี่[ROOT.Char.Custom('WarhorseStoryName')]นอกจากข้า!"

 warhorse.1401.t:1 "[ROOT.Char.Custom('WarhorseStoryName')|U]: ความสยองขวัญจากอาชา"
 warhorse.1401.desc:0 "เมื่อความมืดคืบคลานเข้ามา ข้าพบว่าตัวเองอยู่ตามลำพังเป็นส่วนใหญ่ ความเงียบสงัดของค่ำคืนถูกทำลายลงด้วยเสียงกระทืบเท้าของ[ROOT.Char.Custom('HorseStoryMareStallion')] [ROOT.Char.Custom('WarhorseStoryName')]ของข้า มีบางอย่างแปลกๆ ในดวงตาของ[ROOT.Char.Custom('HorseStoryHerHis')] บางอย่าง... #EMP คุกคาม#!.\n\nสายตาของ[ROOT.Char.Custom('HorseStoryHerHis')|U]จับจ้องตามข้าขณะที่ข้าหันหลังกลับ และความหนาวเย็นที่แล่นไปตามสันหลังของข้ายังคงอยู่ยาวนานไปจนถึงกลางคืน"
 warhorse.1401.a:0 "นี่มันไร้สาระ – [ROOT.Char.Custom('HorseStorySheHe')]เป็นเพียงม้าตัวหนึ่ง"
 warhorse.1401.a.tt:1 "#F แต่เหตุใดท่านยังคงรู้สึกถึงสายตาของ[THIS.Char.Custom('HorseStoryHerHis')]จับจ้องอยู่?#!"
 warhorse.1401.b:0 "[ROOT.Char.Custom('HorseStorySheHe')|U]ต้องถูกสาปแน่ กำจัด[ROOT.Char.Custom('HorseStoryHerHim')]ทิ้งเสีย!"

 warhorse.1402.desc:0 "เท้าช้ำจากกีบม้า มือเลือดออกจากฟันที่งับ ร่างกายฟกช้ำจากการถูกเหวี่ยง... [ROOT.Char.Custom('WarhorseStoryName')]ร้องอย่างร่าเริงขณะที่[ROOT.Char.Custom('HorseStorySheHe')]เกือบจะเหวี่ยงข้าไปบนหอกของทหาร และข้าไม่รู้ว่าจะทนสิ่งนี้ได้อีกนานแค่ไหน"
 warhorse.1402.a:0 "ข้าจะไม่ยอมแพ้ม้า!"
 warhorse.1402.b:0 "เรื่องราวของ[ROOT.Char.Custom('WarhorseStoryName')]จบลงที่นี่"
 
 warhorse.1499.desc:0 "มันเกิดขึ้นเมื่อเราเพิ่งกลับจากการขี่ม้าออกไปข้างนอกไม่นาน — สิ่งที่ข้าหวาดกลัวมาตลอดนับตั้งแต่เห็นความมุ่งร้ายในดวงตาของ[ROOT.Char.Custom('HorseStoryMareStallion')] [ROOT.Char.Custom('WarhorseStoryName')]ของข้าเป็นครั้งแรก [ROOT.Char.Custom('HorseStorySheHe')|U]เหวี่ยงข้าขณะที่เรากำลังขี่ผ่านกลุ่มหินแหลมคม และข้าก็ตกลงมาหัวทิ่มลงบนขอบหินพอดี จมอยู่ในความเจ็บปวดจนตาพร่า ข้าได้ยินเพียงเสียงร้องดังลั่นก่อนที่ทุกอย่างจะดับไป..."
 warhorse.1499.a:0 "[ROOT.Char.Custom('WarhorseStoryName')]... เหตุใดกัน?"

 warhorse.8001.t:1 "[ROOT.Char.Custom('WarhorseStoryName')|U]: จุดจบของชีวิต"
 warhorse.8001.desc:0 "[ROOT.Char.Custom('HorseStoryMareStallion')] [ROOT.Char.Custom('WarhorseStoryName')]คู่ใจของข้ากำลังแก่ลง ย่างก้าวของ[ROOT.Char.Custom('HorseStoryHerHis')|U]ไม่ว่องไวเหมือนเคย และไฟในดวงตาของ[ROOT.Char.Custom('HorseStoryHerHis')]ก็กำลังมอดดับ\n\nหากข้าต้องการรักษาเชื้อสายของ[ROOT.Char.Custom('HorseStoryHerHis')]ไว้ ข้าควรหาคู่ที่เหมาะสมให้[ROOT.Char.Custom('HorseStoryHerHim')]"
 warhorse.8001.a:0 "ข้าจะหา[ROOT.Char.Custom('HorseStoryOppositeMareStallion')]ที่แข็งแรง"
 warhorse.8001.b:0 "ค้นหา[ROOT.Char.Custom('HorseStoryOppositeMareStallion')]ที่ปราดเปรียว"
 warhorse.8001.c:0 "ลักษณะที่สำคัญที่สุดใน[ROOT.Char.Custom('HorseStoryOppositeMareStallion')]คือความอดทน"
 warhorse.8001.d:0 "ค้นหาทั่วดินแดนเพื่อหา[ROOT.Char.Custom('HorseStoryOppositeMareStallion')]ที่ดุร้ายที่สุด!"
 warhorse.8001.e:0 "ข้าจะปล่อยให้[ROOT.Char.Custom('HorseStoryHerHim')]ใช้ชีวิตในวันสุดท้ายของ[ROOT.Char.Custom('HorseStoryHerHis')]อย่างเงียบๆ"

 warhorse.8002.t:1 "[ROOT.Char.Custom('WarhorseStoryName')|U]: วัฏจักรแห่งชีวิต"
 warhorse.8002.desc:0 "[ROOT.Char.Custom('HorseStoryMareStallion')] [ROOT.Char.Custom('WarhorseStoryName')]สุดที่รักของข้าได้จากไปแล้ว แต่[ROOT.Char.Custom('HorseStorySheHe')]ทิ้งลูกม้าที่แข็งแรงไว้เบื้องหลัง! ข้าเห็นบุคลิกของ[ROOT.Char.Custom('HorseStoryHerHis')]ในตัวลูกม้าแล้ว — สหายของข้ายังคงอยู่กับข้าในแง่หนึ่ง"
 warhorse.8002.a:0 "หลับให้สบายเถิด [ROOT.Char.Custom('WarhorseStoryName')]"

 warhorse.8003.desc:0 "ขณะที่ข้าก้าวออกไปสูดอากาศบริสุทธิ์ ข้าได้รับข่าวเศร้าว่า[ROOT.Char.Custom('HorseStoryMareStallion')] [ROOT.Char.Custom('WarhorseStoryName')]สุดที่รักของข้าได้จากไปในตอนกลางคืน ไม่ทิ้งสิ่งใดไว้เบื้องหลังนอกจากความว่างเปล่าในใจข้า"
 warhorse.8003.a:0 "โอ้ [ROOT.Char.Custom('WarhorseStoryName')] ข้าจะคิดถึงเจ้า!"
