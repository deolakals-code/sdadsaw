l_english: 
 #You deal with a bumper harvest, reinvesting it in your gut or your defences, by Ewan Cowhig Croft
 martial_strategy.4000.t:0 "การตุนเสบียง"
 martial_strategy.4000.desc:0 "ด้วยเสียงเรออันดัง ข้าผลักจานที่เหลือออกไป และเอนหลังพิงเก้าอี้ ช่วงหลังมานี้ ห้องครัวของข้าเริ่มเต็มไปด้วยเมล็ดข้าวสีทองและเนื้อสัตว์ที่เพิ่งล่ามาใหม่ ทำให้ข้าราชบริพารทุกคนมีผิวพรรณเปล่งปลั่งสุขภาพดีจากการกินอิ่มเกินไป\n\nข้าทำหน้าบึ้ง แม้ว่าความอุดมสมบูรณ์นี้จะยอดเยี่ยม แต่ก็ไม่สามารถคงอยู่ตลอดไป ข้าต้องตัดสินใจว่าจะทำอย่างไรกับอาหารส่วนเกินทั้งหมดนี้"
 martial_strategy.4000.a:0 "จะหมักเกลือหรือรมควันก็ได้ ตราบใดที่เราเก็บมันไว้"
 martial_strategy.4000.b:0 "แขกของข้าและข้าจะรับประทานอาหารอย่างหรูหรา!"
 martial_strategy.4000.c:0 "แม้ แต่คนรับใช้ก็จะได้กินเหมือนกับที่ [ROOT.Char.GetTitleAsNameNoTooltip] ของพวกเขากิน!"
 martial_strategy.4000.d:0 "ใช่ พวกเขา #EMP ดู#! อ้วนท้วนสมบูรณ์ดี..."
 strategy_stocked_larders_modifier:0 "เสบียงที่ตุนไว้อย่างหนัก"
 strategy_emptied_larders_modifier:0 "เสบียงเกือบหมด"
 strategy_fed_peasants_larders_modifier:0 "ขนมปังสำหรับชาวนา"
 strategy_human_meat_larders_modifier:0 "เสบียงเนื้อธรรมดาอย่างยิ่ง"
 strategy_entirely_unrelated_disappearances_modifier:0 "การหายตัวไปที่ไม่เกี่ยวข้องโดยสิ้นเชิง"
 #You rebuild the walls of a lesser domain county, or let them crumble.
 martial_strategy.4010.t:0 "กำแพงแห่ง [crumbling_holding.GetNameNoTierNoTooltip]"
 martial_strategy.4010.desc:0 "คณะผู้แทนจาก [crumbling_holding.GetNameNoTierNoTooltip] ค่อยๆ เดินออกจากห้องส่วนตัวของข้า การประชุมอันยาวนานของเราสิ้นสุดลงในที่สุด ผู้ร้องทุกข์ขอเงินเพื่อซ่อมแซมกำแพงที่พังทลายของที่พำนัก และได้อ้างถึงหน้าที่ของข้าในฐานะเจ้าผู้ครองนครเพื่อช่วยเหลือพวกเขา ข้าเคาะนิ้วบนโต๊ะ ครุ่นคิดว่าจะส่งเงินให้พวกเขาหรือไม่ ป้อมปราการที่ดีนั้นแพงอย่างน่าสยดสยอง\n\nแน่นอน หากกำแพงกำลังพังทลายอยู่แล้ว ข้าก็สามารถเบี่ยงเบนเงินช่วยเหลือที่มีอยู่ของพวกเขาไปใช้ในเรื่องส่วนตัวได้เสมอ..."
 martial_strategy.4010.a:0 "ข้ามีหน้าที่ดูแลไพร่ฟ้าข้าแผ่นดินของข้า"
 martial_strategy.4010.b:0 "ข้าจะควบคุมการบูรณะด้วยตนเอง"
 martial_strategy.4010.c:0 "#EMP ข้า#! เป็นผู้เลือก ว่าเงิน #EMP ของข้า#! จะถูกใช้อย่างไร และ [crumbling_holding.GetNameNoTierNoTooltip] ก็ไม่ใช่สิ่งสำคัญอันดับแรก!"
 martial_strategy.4010.b.tt_crit_success:1 "ท่านปรับปรุงกำแพงของ [crumbling_holding.GetNameNoTierNoTooltip] ได้อย่างเชี่ยวชาญ"
 martial_strategy.4010.b.tt_success:1 "ท่านบูรณะกำแพงของ [crumbling_holding.GetNameNoTierNoTooltip] ได้สำเร็จ"
 martial_strategy.4010.b.tt_botch:1 "ท่านทำลายการบูรณะโดยสิ้นเชิง"
 strategy_paid_for_walls_modifier:0 "กำแพงที่บูรณะอย่างมืออาชีพ"
 strategy_let_walls_crumble_modifier:0 "กำแพงที่พังทลาย"
 strategy_botched_supervised_walls_modifier:0 "กำแพงที่บูรณะอย่างหายนะ"
 strategy_successfully_supervised_walls_modifier:0 "กำแพงที่บูรณะอย่างชำนาญ"
 martial_strategy.4010.d:0 "$royal_architect_court_position$ ของข้าจะควบคุมการบูรณะ"
 martial_strategy.4010.d.tt_crit_success:0 "$royal_architect_court_position$ ของท่านปรับปรุงกำแพงของ [crumbling_holding.GetNameNoTierNoTooltip] ได้อย่างเชี่ยวชาญ"
 martial_strategy.4010.d.tt_success:0 "$royal_architect_court_position$ ของท่านบูรณะกำแพงของ [crumbling_holding.GetNameNoTierNoTooltip] ได้สำเร็จ"
 martial_strategy.4010.d.tt_botch:0 "$royal_architect_court_position$ ของท่านทำลายการบูรณะโดยสิ้นเชิง"

# Tactics?
# By Isabella Welch

 martial_strategy.7000.t:0 "กลยุทธ์?"
 martial_strategy.7000.desc_opening:0 "ขณะที่ข้ากำลังฝึกซ้อม"
 martial_strategy.7000.desc_elephantry:0 "กองทหารช้าง"
 martial_strategy.7000.desc_cavalry:0 "ทหารม้าหนัก"
 martial_strategy.7000.desc_middle:0 "[worried_knight.GetTitledFirstName] เข้ามาหาข้าขณะที่ข้านั่งอยู่บนหลังม้า [worried_knight.GetSheHe|U] หลบสายตาข้าและจ้องมองพื้น หลังจากลังเลอยู่นาน [worried_knight.GetSheHe] ก็พูดขึ้น:\n\n"[ROOT.Char.GetLadyLord|U] ของข้า ดูเหมือนว่าทั้งหมดที่เราทำกับ"
 martial_strategy.7000.desc_war_elephant:0 "ช้างศึก"
 martial_strategy.7000.desc_armored_horse:0 "ม้าหุ้มเกราะ"
 martial_strategy.7000.desc_cont:0 "คือการพุ่งเข้าใส่ศัตรูโดยตรงเป็นเส้นตรง ถึงเวลาแล้วหรือยังที่เราจะลองใช้วิธีอื่น?""
 martial_strategy.7000.a:0 "ฮ่า! ตลกดีนี่ [worried_knight.GetTitledFirstNameNoTooltip]!"
 martial_strategy.7000.b:0 "เจ้าโง่! การพุ่งเข้าใส่เป็นเส้นตรงคือวิถีของชาว [ROOT.Char.GetCulture.GetNameNoTooltip]!"
 martial_strategy.7000.c:0 "เจ้าโง่! เจ้าเคยลองบังคับช้างศึกหรือไม่?"
 martial_strategy.7000.d:0 "เจ้าโง่! ไม่มีกลอุบายใดที่มนุษย์รู้จักจะดีไปกว่านี้แล้ว"
 martial_strategy.7000.e:0 "บางทีเจ้าอาจมีเหตุผล..."
 martial_strategy.7000.f:0 "หากเราเหยียบย่ำเจ้า เจ้าจะได้เห็นว่ามันมีประสิทธิภาพเพียงใด"
