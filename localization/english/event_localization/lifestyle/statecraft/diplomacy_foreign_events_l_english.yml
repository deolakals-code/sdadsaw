 ###################
 # Standard Events #
 ###################

 # Diplomacy (Majesty) Events:
 	# 1074		 : Religious Refugees (Oppressed faithful in neighboring county), by Sean Hughes
 	# 3001 — 3008: Correspondence (Become pen pals with a foreign ruler), by Linnéa Thimrén and Sean Hughes

 # Diplomay (Majesty) Special Events:
 	#1010 — 1031: Foreign Relations (Invite a foreign ruler to your court), by Mathilda Bjarnehed
 	#1032 — 1051: The Weak Link	(One of your neighbor's vassals is disloyal), by Mathilda Bharnehed

 # Religious Refugees, by Sean Hughes
 diplomacy_foreign.1074.t:0 "ผู้ลี้ภัยทางศาสนา"
 diplomacy_foreign.1074.desc:0 "[heretic_ruler.GetTitledFirstName] ปกครอง [target_county.GetName] ที่อยู่ใกล้เคียง ซึ่งเป็นที่พำนักของเหล่า [ROOT.Char.GetFaith.GetAdherentNamePluralNoTooltip] ผู้ศรัทธาจำนวนมาก [heretic_ruler.GetTitleAsName] ผู้เป็น [heretic_ruler.GetFaith.GetAdherentName] อาจข่มเหงเหล่า [ROOT.Char.GetFaith.GetAdherentNamePluralNoTooltip] ผู้มีศรัทธาที่อาศัยอยู่ที่นั่นได้โดยง่าย และเป็นหน้าที่ของข้าที่จะปกป้องพวกเขาจากอิทธิพลอัน [ROOT.GetCharacter.Custom2('ToleranceValue', SCOPE.sC('heretic_ruler'))] ของ [heretic_ruler.GetHerHis]"
 diplomacy_foreign.1074.a:0 "เราจะปล่อยให้ [heretic_ruler.GetHerHim] กดขี่ผู้มีศรัทธาไม่ได้!"
 diplomacy_foreign.1074.b:0 "ลักลอบพาเหล่า [ROOT.Char.GetFaith.GetAdherentNamePluralNoTooltip] ไปยังที่ปลอดภัยให้มากที่สุดเท่าที่จะทำได้"
 diplomacy_foreign.1074.c:0 "ส่งทูตไปยัง [heretic_ruler.GetFirstNameNoTooltip] เพื่อหารือเรื่องการปฏิบัติต่อพวกเขา"
 diplomacy_foreign.1074.c.success:0 "[heretic_ruler.GetFirstName] ต้อนรับทูตของข้าอย่างเปิดเผย"
 diplomacy_foreign.1074.c.failure:0 "[heretic_ruler.GetFirstName] ระแวงในเจตนาของทูตข้า"

 # Correspondence, by Linnéa Thimrén and Sean Hughes
 diplomacy_foreign.3001.t:0 "สารสัมพันธ์" # <DELETE THIS KEY>
 diplomacy_foreign.3001.opening:0 "[neighboring_ruler.Custom2('AppropriateGreeting', ROOT.Char)]"
 diplomacy_foreign.3001.desc:0 "ข้าได้ยินเรื่องดีๆ เกี่ยวกับท่าน และสนใจที่จะเริ่มการสนทนาผ่านสาส์น ข้าหวังว่าสาส์นฉบับนี้จะไปถึงท่านด้วยความเต็มใจ ด้วยข้ากำลังรอคอยการตอบกลับโดยเร็วของท่าน"
 diplomacy_foreign.3001.a:0 "เริ่มแลกเปลี่ยนสาส์นกับ [neighboring_ruler.GetFirstNameNoTooltip]"
 diplomacy_foreign.3001.a.tt:1 "ท่านจะได้รับสาส์นจาก [neighboring_ruler.GetFirstName] ต่อไป"
 diplomacy_foreign.3001.b:0 "นำสาส์นของ [neighboring_ruler.GetTitleAsNamePossessiveNoTooltip] ไปใส่กรอบไว้ในโถงของข้า!"
 diplomacy_foreign.3001.c:0 "ปฏิเสธอย่างสุภาพ"

 diplomacy_foreign.3003.desc_dead:0 "ผู้ดำรงตำแหน่งก่อนหน้าข้า [dead_ruler.GetTitledFirstName] ได้สนับสนุนให้ข้าสานต่อสารสัมพันธ์ของ [dead_ruler.GetHerHis] กับท่าน ข้าต้องยอมรับว่าข้าไม่แน่ใจว่าจะเขียนสิ่งใด — ข้าขอวิงวอนท่าน โปรดเลือกหัวข้อเถิด!"
 diplomacy_foreign.3003.desc:0 "ขอบคุณสำหรับการตอบกลับโดยเร็วของท่าน! ข้าตั้งตารอคอยสารสัมพันธ์ของเรา โปรดเถิด ข้าขอวิงวอนท่าน — โปรดเลือกหัวข้อแรกให้เราได้หารือกัน!"
 diplomacy_foreign.3003.a_lifestyle_diplomat:0 "ให้เรามาหารือกันถึงประเด็นปลีกย่อยของมารยาทกันเถิด!"
 diplomacy_foreign.3003.a_lifestyle_general:0 "ข้ามีเรื่องราวสงครามอันยอดเยี่ยมที่จะแบ่งปัน"
 diplomacy_foreign.3003.a_lifestyle_administrator:0 "ความแปลกประหลาดของการบริหารอาณาจักรนั้นช่าง #EMP น่าสนใจยิ่ง!#!"
 diplomacy_foreign.3003.a_lifestyle_schemer:0 "โอ้ ข้าพนันได้เลยว่า [neighboring_ruler.GetSheHe] คงอยากฟังเรื่องซุบซิบล่าสุด..."
 diplomacy_foreign.3003.a_lifestyle_scholar:0 "การโต้วาทีเชิงปรัชญานั้นน่าสนใจเสมอ!"
 diplomacy_foreign.3003.a.tt:1 "การนำด้วยหัวข้อที่ท่านรอบรู้อาจ ทำให้ [neighboring_ruler.GetHerHim] ประทับใจ"
 diplomacy_foreign.3003.b:2 "โปรดบอกข้าเกี่ยวกับ [neighboring_ruler.Custom('subject_of_interest')] เถิด"
 diplomacy_foreign.3003.b.tt:1 "ท่านได้ยินข่าวลือว่าหัวข้อนี้เป็นที่รักยิ่งของ [neighboring_ruler.GetHerHis]"
 diplomacy_foreign.3003.c:1 "ข้าจะส่งของกำนัลไปเพื่อแสดงความซาบซึ้ง"
 diplomacy_foreign.3003.c.tt:1 "ท่านเชื่อว่า [neighboring_ruler.GetSheHe] เป็น [neighboring_ruler.GetWomanMan] ที่ให้ค่ากับวัตถุสิ่งของ"

 diplomacy_foreign.3007.desc_dead:0 "ผู้ดำรงตำแหน่งก่อนหน้าข้า [dead_ruler_2.GetTitledFirstName] ได้สนับสนุนให้ข้าสานต่อสารสัมพันธ์ของ [dead_ruler_2.GetHerHis] กับท่าน สาส์นฉบับสุดท้ายที่ท่านส่งมา ทำให้ข้าประทับใจยิ่งนัก!"
 diplomacy_foreign.3007.desc_lifestyle:0 "ข้ายินดีที่ได้เห็นว่าท่านทุ่มเทให้กับสิ่งที่ท่านหลงใหลเพียงใด สาส์นฉบับสุดท้ายของท่านพิสูจน์ถึงความสามารถของท่านในเรื่องเหล่านั้นได้อย่างแน่นอน!"
 diplomacy_foreign.3007.desc_interest:0 "ไม่น่าเชื่อว่าท่านจะถามถึงหัวข้อที่สำคัญต่อข้าถึงเพียงนี้ — ท่านรู้จักข้าดีกว่าคนส่วนใหญ่เสียจริง!"
 diplomacy_foreign.3007.desc_gift:0 "ของกำนัลที่ท่านส่งมาให้ข้านั้นเป็นที่ซาบซึ้งอย่างยิ่ง!"
 diplomacy_foreign.3007.desc_ending:0 "ในเมื่อท่านได้ตามใจข้าถึงเพียงนี้ ข้าต้องขอถามว่ามีสิ่งใดที่ข้าสามารถทำเพื่อท่านได้บ้างหรือไม่?"
 diplomacy_foreign.3007.a:0 "ข้าเพียงปรารถนาที่จะแลกเปลี่ยนสาส์นต่อไป!"
 diplomacy_foreign.3007.a_random_list_good:0 "สารสัมพันธ์ของเราสอนข้ามากมายเกี่ยวกับการต่างประเทศ"
 diplomacy_foreign.3007.a_random_list_bad:0 "ข้าไม่ได้เรียนรู้อะไรมากนักจากสาส์นของ [neighboring_ruler.GetFirstNamePossessiveNoTooltip]"
 diplomacy_foreign.3007.b:0 "บางทีเราอาจจะจัดทำข้อตกลงทางการค้าได้?"
 diplomacy_foreign.3007.c:0 "บัดนี้ข้าได้สนองความปรารถนาที่จะพูดคุยของท่านแล้ว..."
 diplomacy_foreign.3007.c_tt:0 "ข้าพยายามโน้มน้าว [neighboring_ruler.GetFirstNameNoTooltip] ว่า [neighboring_ruler.GetSheHe] ติดค้างข้า!"
 diplomacy_foreign.3007.c_random_list_good:0 "ข้าสามารถโน้มน้าว [neighboring_ruler.GetFirstNameNoTooltip] ได้สำเร็จ"
 diplomacy_foreign.3007.c_random_list_bad:0 "ข้า ทำให้ตนเองดูโง่เขลา"


 diplomacy_foreign.3008.opening:0 "ถึง [ROOT.Char.GetTitledFirstNameNoTooltip] ผู้เป็น [neighboring_ruler.Custom2('RelationDescriptor', ROOT.Char)] ของข้า,"
 diplomacy_foreign.3008.desc.dead:0 "ผู้ดำรงตำแหน่งก่อนหน้าข้า [dead_ruler_2.GetTitledFirstName] ได้สนับสนุนให้ข้าสานต่อสารสัมพันธ์ของ [dead_ruler_2.GetHerHis] กับท่าน อย่างไรก็ตาม หลังจากสาส์นฉบับสุดท้ายที่ท่านส่งมา ข้าขอจบการแลกเปลี่ยนสาส์นนี้ ณ บัดนี้ ดูเหมือนว่า [dead_ruler_2.GetSheHe] คิดผิดเกี่ยวกับความน่าสนใจของท่าน!"
 diplomacy_foreign.3008.desc.skilled:0 "ท่านกำลังพยายาม ทำให้ข้ารู้สึกเหมือนคนเขลาหรือ? สาส์นฉบับสุดท้ายของท่านเต็มไปด้วยความคลุมเครือจนข้าไม่สามารถเข้าใจได้หนึ่งในสามประโยค!"
 diplomacy_foreign.3008.desc.special:0 "ท่านประเมินข้าผิดไปมากหากคิดว่าการประจบสอพลอจะนำท่านไปสู่ที่ใดได้ บัดนี้ข้าเห็นแล้วว่าวาจาของท่านนั้นว่างเปล่าเหมือนสมองของท่าน"
 diplomacy_foreign.3008.desc.bribe:0 "ท่านประเมินข้าผิดไปมากหากคิดว่าการติดสินบนจะนำท่านไปสู่ที่ใดได้ ความโลภเป็นลักษณะนิสัยที่ไม่เหมาะสมอย่างยิ่ง"
 diplomacy_foreign.3008.desc.end:0 "และไม่น่าเชื่อ ข้าเคยให้ค่ากับมิตรภาพของท่าน..."
 diplomacy_foreign.3008.a:0 "แย่ล่ะ"
 diplomacy_foreign.3008.a.tt:1 "อย่างน้อยท่านก็ได้เรียนรู้บางสิ่ง!"

 ##################
 # Special Events #
 ##################

 # Foreign Relations (Invite a foreign ruler to your court), by Mathilda Bjarnehed
 diplomacy_foreign_special.1017.t:0 "การต้อนรับขับสู้"
 diplomacy_foreign_special.1017.desc:0 "ยิ่งข้าศึกษาวิชาศิลปะการปกครองอันสูงส่งมากเท่าใด ข้าก็ยิ่งตระหนักว่าความสัมพันธ์อันดีกับอาณาจักรข้างเคียงนั้นเป็นประโยชน์เพียงใด\n\nข้าควรเชิญผู้ปกครองสักคนมาเยือนราชสำนักของข้า เพื่อที่ข้าจะได้แสดงให้พวกเขาเห็นว่าข้าสามารถเป็นสหายที่ดีได้เพียงใด — แต่ข้าควรเชิญผู้ใดดี? "
 diplomacy_foreign_special.1017.a:0 "[target_list_member_a.GetNameNoTooltip]"
 diplomacy_foreign_special.1017.b:0 "[target_list_member_b.GetNameNoTooltip]"
 diplomacy_foreign_special.1017.c:0 "[target_list_member_c.GetNameNoTooltip]"
 diplomacy_foreign_special.1017.d:0 "ข้าควรให้ความสำคัญกับการเอาใจข้าหลวงของข้าเอง"
 diplomacy_foreign_special.1017.great:0 "[THIS.Char.GetFirstName] ประทับใจในการต้อนรับขับสู้ของข้า"
 diplomacy_foreign_special.1017.good:0 "[THIS.Char.GetFirstName] เพลิดเพลินกับการเยือนของ [THIS.Char.GetHerHis]"
 diplomacy_foreign_special.1017.bad:0 "[THIS.Char.GetFirstName] ผิดหวังและจากไปก่อนกำหนด"
 diplomacy_foreign_special.1017.friends_a:0 "[target_list_member_a.GetShortUIName|U] และข้าอาจกลายเป็นสหายกัน"
 diplomacy_foreign_special.1017.friends_b:0 "[target_list_member_b.GetShortUIName|U] และข้าอาจกลายเป็นสหายกัน"
 diplomacy_foreign_special.1017.friends_c:0 "[target_list_member_c.GetShortUIName|U] และข้าอาจกลายเป็นสหายกัน"

 diplomacy_foreign_special.1018.opening:0 "[foreign_guest.Custom2('AppropriateGreeting', ROOT.Char)]"
 diplomacy_foreign_special.1018.desc:0 "ข้าขอขอบคุณอย่างสูงสำหรับคำเชิญมายังราชสำนักของท่าน คณะผู้ติดตามของข้าและตัวข้าจะเดินทางมาถึง [root_realm.GetNameNoTierNoTooltip] ในอีกไม่กี่สัปดาห์"
 diplomacy_foreign_special.1017.a.spouse:0 "[helper_spouse.GetFirstNameNoTooltip] สั่งให้เหล่าข้ารับใช้ทำงาน!"
 diplomacy_foreign_special.1017.a.no_spouse:0 "ข้าจะสั่งให้เหล่าข้ารับใช้ทำงานทันที!"
 diplomacy_foreign_special.1018.a.tt:0 "[foreign_guest.GetTitledFirstName] จะเดินทางมาถึงในไม่ช้า"

 diplomacy_foreign_special.1019.t:1 "$diplomacy_foreign_special.1017.t$: การต้อนรับอันอบอุ่น"
 diplomacy_foreign_special.1019.start.desc:0 "[foreign_guest.GetTitledFirstName] ผู้ [foreign_guest.Custom('ComplimentAdjective')] มาถึงแล้ว! คืนนี้ เราจะมีงานเลี้ยงเพื่อต้อนรับแขกต่างแดนของเรา\n\n"
 diplomacy_foreign_special.1019.spouse.desc:0 "[ROOT.GetCharacter.Custom2('RelationToMe' , SCOPE.sC('helper_spouse') )] ของข้า [helper_spouse.GetFirstName] ได้ทำงานอย่างหนักกับการวางแผนและการเตรียมการทั้งหมด [helper_spouse.GetSheHe|U] ได้ถามข้าว่ามีข้อเสนอแนะใดๆ สำหรับการตก แต่งขั้นสุดท้ายหรือไม่"
 diplomacy_foreign_special.1019.no_spouse.desc:0 "ข้าได้ทำงานอย่างหนักกับการวางแผนและการเตรียมการทั้งหมด ทุกอย่างเกือบพร้อมแล้วและข้ามีเวลาที่จะเพิ่มการตก แต่งขั้นสุดท้าย"
 diplomacy_foreign_special.1019.a:0 "ข้ารู้จักของขึ้นชื่อบางอย่างจาก [foreign_guest_realm.GetNameNoTierNoTooltip]"
 diplomacy_foreign_special.1019.a.success.tt:0 "[foreign_guest.GetTitledFirstNameNoTooltip] รู้สึกเหมือนอยู่บ้าน"
 diplomacy_foreign_special.1019.a.failure.tt:1 "ท่านเข้าใจผิดและ [foreign_guest.GetTitledFirstNameNoTooltip] รู้สึกขุ่นเคือง"
 diplomacy_foreign_special.court_visit.very_well:0 "การเยือนราชสำนักดำเนินไป #P อย่างดีเยี่ยม#!"
 diplomacy_foreign_special.court_visit.poorly:0 "การเยือนราชสำนักดำเนินไป #N อย่างย่ำแย่#!"
 diplomacy_foreign_special.1019.b:0 "มันควรจะหรูหรา! เพิ่ม... ทุกอย่างให้มากขึ้น!"
 diplomacy_foreign_special.1019.b.rl.desc:0 "ผลลัพธ์ขึ้นอยู่กับบุคลิกภาพของ [foreign_guest.GetTitledFirstNamePossessiveNoTooltip]"

 diplomacy_foreign_special.1019.b.success.tt:0 "[foreign_guest.GetTitledFirstNameNoTooltip] ชื่นชมการแสดงออกนี้ เหมือนที่คนส่วนใหญ่จะทำ"
 diplomacy_foreign_special.1019.b.failure.tt:0 "[foreign_guest.GetTitledFirstNameNoTooltip] น่าจะชอบอะไรที่เรียบง่ายกว่านี้"
 diplomacy_foreign_special.1019.c:0 "ข้าจะไม่เสี่ยงสิ่งใดด้วยการเปลี่ยนแปลงในนาทีสุดท้าย"
 diplomacy_foreign_special.court_visit.normal:0 "การเยือนราชสำนักดำเนินไป #Z ตามปกติ#!"
 diplomacy_foreign_special.court_visit.well:0 "การเยือนราชสำนักดำเนินไป #P อย่างดี#!"
 diplomacy_foreign_special.court_visit.disaster:0 "การเยือนราชสำนักจบลงด้วย #N หายนะ#!"

 diplomacy_foreign_special.1020.t:1 "$diplomacy_foreign_special.1017.t$: การออกกำลังกายหรือการพักผ่อน"
 diplomacy_foreign_special.1020.desc:0 "หากเชื่อท้องฟ้าได้ ดูเหมือนว่าวันนี้อากาศจะดีเยี่ยม! ข้ามีโอกาสอันยอดเยี่ยมที่จะแสดงให้แขกของข้า [foreign_guest.GetTitledFirstName] เห็นความงามของชนบทท้องถิ่น ข้าสงสัยว่า [foreign_guest.GetSheHe] จะชอบการล่าสัตว์อย่างจริงจังหรือไม่? หรือบางทีอาจจะเป็นอาหารกลางวันสบายๆ กลางแสงแดด?"
 diplomacy_foreign_special.1020.a:0 "การล่าสัตว์จะสมบูรณ์แบบ!"
 diplomacy_foreign_special.1020.a.success.tt:0 "[foreign_guest.GetTitledFirstNameNoTooltip] เพลิดเพลินกับการล่าสัตว์"
 diplomacy_foreign_special.1020.a.failure.tt:0 "[foreign_guest.GetTitledFirstNameNoTooltip] มีช่วงเวลาที่เลวร้าย"
 diplomacy_foreign_special.1020.b:0 "ข้าคิดว่า [foreign_guest.GetSheHe] น่าจะชอบอาหารกลางวันมากกว่า"
 diplomacy_foreign_special.1020.b.success.tt:0 "[foreign_guest.GetTitledFirstNameNoTooltip] เพลิดเพลินกับอาหารกลางวัน"

 diplomacy_foreign_special.1021.t:1 "$diplomacy_foreign_special.1017.t$: ความรื่นเริงหรือความเคารพ"
 diplomacy_foreign_special.1021.desc:0 "ข้าอยากจะแสดงให้แขกของข้า [foreign_guest.GetTitledFirstName] เห็นจุดเด่นทางวัฒนธรรมของ [root_realm.GetNameNoTier] คำถามคือ [foreign_guest.GetSheHe] จะชอบการเต้นรำอันยิ่งใหญ่กับเหล่าขุนนางและสุภาพสตรีทั้งหมดในราชสำนัก หรือการเยี่ยมชม [ROOT.Char.GetFaith.HouseOfWorship] ที่ดีที่สุดของเรา?"
 diplomacy_foreign_special.1021.a:0 "ข้าพนันได้เลยว่า [foreign_guest.GetSheHe] เป็นนักเต้นรำที่ยอดเยี่ยม!"
 diplomacy_foreign_special.1021.b:0 "[ROOT.Char.GetFaith.HouseOfWorship] ดูเหมือนจะเหมาะสมกับรสนิยมของ [foreign_guest.GetHerHis] มากกว่า"
 diplomacy_foreign_special.1021.a.success.tt:0 "[foreign_guest.GetTitledFirstNameNoTooltip] เพลิดเพลินกับการเต้นรำ"
 diplomacy_foreign_special.1021.b.success.tt:1 "[foreign_guest.GetTitledFirstNameNoTooltip] เพลิดเพลินกับการเยี่ยมชม [ROOT.Char.GetFaith.HouseOfWorship]"

 diplomacy_foreign_special.1022.t:1 "$diplomacy_foreign_special.1017.t$: คำขอแปลกๆ"
 diplomacy_foreign_special.1022.desc:0 ""[ROOT.GetCharacter.Custom2('RelationToMe' , SCOPE.sC('interesting_relation') )] ของท่านเป็น [interesting_relation.GetWomanMan] ที่ดีงาม" [foreign_guest.GetTitledFirstName] กล่าวขณะหมุนถ้วย [foreign_guest.Custom('RegionalDrink')] ของ [foreign_guest.GetHerHis] อย่างครุ่นคิด สายตาของ [foreign_guest.GetHerHis|U] จับจ้องไปที่ [interesting_relation.GetFirstName] ซึ่งนั่งอยู่ไกลออกไปที่โต๊ะ\n\n"ท่าน [ROOT.GetCharacter.GetTitledFirstNameNoTooltip] ที่รัก ข้าขออนุญาตจากท่านเพื่อจัดการพบปะส่วนตัวกับ [interesting_relation.GetLadyLord] [interesting_relation.GetFirstNameNoTooltip] ได้หรือไม่? ไม่มีอะไรไม่เหมาะสมแน่นอน เพียงแค่อาหารค่ำเรียบง่ายในห้องพักส่วนตัวของข้า""
 diplomacy_foreign_special.1022.a:0 ""แน่นอน! นั่นไม่ใช่ปัญหาเลย""
 diplomacy_foreign_special.1022.a.tt:1 "ท่านจะไม่รู้ว่าเกิดอะไรขึ้นหลังประตูที่ปิดอยู่"
 diplomacy_foreign_special.1022.b:0 "อนุญาต แต่แอบฟังอย่างลับๆ..."
 diplomacy_foreign_special.1022.b.duel.success:1 "ท่านพบว่าพวกเขากำลังทำอะไร"
 diplomacy_foreign_special.1022.b.duel.failure:1 "ท่านถูกจับได้"
 diplomacy_foreign_special.1022.c:0 ""ข้าไม่คิดว่ามันจะเหมาะสม""

 diplomacy_foreign_special.1023.t:1 "$diplomacy_foreign_special.1017.t$: ความสงสัยที่ไม่มีมูล"
 diplomacy_foreign_special.1023.desc:0 "ข้าอยู่ในทางลับตลอดการพบปะส่วนตัวของ [foreign_guest.GetTitledFirstNamePossessive] และ [interesting_relation.GetFirstNamePossessive] ความกังวลของข้าดูเหมือนจะไม่มีมูลเลย ไม่มีการเสนอข้อเสนอ ไม่มีการวางแผนร้าย ไม่มีการยั่วยวน"
 diplomacy_foreign_special.1023.a:0 "โล่งอกไปที!"

 diplomacy_foreign_special.1024.t:1 "$diplomacy_foreign_special.1017.t$: ช่วงเวลาอันแสนสุข"
 diplomacy_foreign_special.1024.desc:0 "ข้าอยู่ในทางลับนี้มาหลายชั่วโมงแล้ว กำลังฟังการสนทนาที่ดูเหมือนไม่มีที่สิ้นสุดของ [foreign_guest.GetTitledFirstNamePossessive] และ [interesting_relation.GetFirstNamePossessive] ไม่มีอะไรน่าสงสัยเกี่ยวกับคำพูดของพวกเขา มากไปกว่าความชื่นชอบต่อกันอย่างผิดธรรมชาติสำหรับคนที่เพิ่งพบกัน"
 diplomacy_foreign_special.1024.a:0 "ไม่มีความเสียหายใดๆ ในเรื่องนี้"
 diplomacy_foreign_special.1024.b:0 "เรื่องนี้ต้องจบลง เดี๋ยวนี้!"

 diplomacy_foreign_special.1025.t:1 "$diplomacy_foreign_special.1017.t$: อสรพิษในอก"
 diplomacy_foreign_special.1025.desc:0 "จากภายในที่ซ่อนของข้าในทางลับ ข้าได้ยินวาจาหลอกลวงของ [foreign_guest.GetTitledFirstNamePossessive] ดังและชัดเจน [foreign_guest.GetSheHe|U] กำลังพยายามยุยงให้ [interesting_relation.GetFirstNamePossessive] เกลียดชังข้า และดูเหมือนจะได้ผล"
 diplomacy_foreign_special.1025.a:0 "ชิ! ข้าจะปล่อยให้ [foreign_guest.GetHerHim] คิดว่า [foreign_guest.GetSheHe] มีโอกาส"
 diplomacy_foreign_special.1025.b:0 "คนทรยศ! ทั้งคู่เลย!"

 diplomacy_foreign_special.1026.t:1 "$diplomacy_foreign_special.1017.t$: การหลอกลวงและความปรารถนา"
 diplomacy_foreign_special.1026.desc:0 "ขณะที่ข้อเสนอแนะอันลามกหลุดออกจากริมฝีปากของ [foreign_guest.GetTitledFirstNamePossessive] ข้าไม่แน่ใจว่าข้าโกรธจัดเกี่ยวกับการขาดความเหมาะสมอย่างสิ้นเชิงของ [foreign_guest.GetHerHis] หรือประทับใจในความโอหังของ [foreign_guest.GetHerHis] การยั่วยวน [ROOT.GetCharacter.Custom2('RelationToMe' , SCOPE.sC('interesting_relation') )] ของข้าใต้หลังคาบ้านข้าแท้ๆ! ข้าเอนหลังพิงกำแพงเย็นๆ ของทางลับ พยายามควบคุมพายุอารมณ์"
 diplomacy_foreign_special.1026.a.tt:1 "ท่านจะรู้ถึง [secret|E] ของพวกเขา"
 diplomacy_foreign_special.1026.a:0 "ปล่อยให้พวกเขาสนุกกันไป ข้าจะสนทำไม"
 diplomacy_foreign_special.1026.b:0 "เอาอุ้งมือสกปรกของเจ้าไปให้พ้นจาก [interesting_relation.GetHerHim], เจ้า [foreign_guest.Custom2('InsultNoun', ROOT.Char)]!"
 diplomacy_foreign_special.1026.c:0 "มีที่สำหรับสามคนบนเตียงนั้นหรือไม่?"
 diplomacy_foreign_special.1026.c.success:0 "เราสามคนใช้เวลาค่ำคืนด้วยกัน"
 diplomacy_foreign_special.1026.c.failure:0 "พวกเขาสยดสยองอย่างยิ่ง"

 diplomacy_foreign_special.1027.t:1 "$diplomacy_foreign_special.1017.t$: หนูในรู"
 diplomacy_foreign_special.1027.desc:0 "เงียบราวเสียงกระซิบ ข้าย่องผ่านทางลับไปจนถึงห้องพักส่วนตัวของ [foreign_guest.GetTitledFirstNamePossessive] เมื่อไปถึงที่นั่น ข้าหมอบลง เตรียมพร้อมสำหรับค่ำคืนอันยาวนาน\n\nจากนั้น โดยไม่คาดคิด มือหนึ่งคว้าไหล่ข้าและร่างของข้าก็แข็งทื่อด้วยความหวาดกลัว "นี่คือวิธีที่ท่านปฏิบัติต่อแขกของท่านหรือ [ROOT.GetCharacter.GetTitledFirstName]?""
 diplomacy_foreign_special.1027.a:0 "ข้า— ข้าขอโทษอย่างสูง!"

 diplomacy_foreign_special.1028.t:1 "$diplomacy_foreign_special.1017.t$: กลีบดอกไม้และหนาม"
 diplomacy_foreign_special.1028.desc:0 "ระหว่างการเดินเล่นในสวน [foreign_guest.GetTitledFirstName] และข้าได้หยุดชื่นชมทิวทัศน์ "สัดส่วน สีสัน — ข้าเคยเห็นสิ่งที่สวยงาม เช่นนี้น้อยมาก [ROOT.GetCharacter.GetTitledFirstNameNoTooltip]" [foreign_guest.GetSheHe] กล่าวและชี้ไปที่ภาพเบื้องหน้าเรา\n\nข้ารู้สึกว่าควรพูดอะไรดี ๆ ตอบกลับไป บางทีอาจเกี่ยวกับ [foreign_guest.GetHerHis]..."
 diplomacy_foreign_special.1028.compassionate:0 "ความอบอุ่นและความเมตตา"
 diplomacy_foreign_special.1028.bold:0 "ความกล้าหาญที่ไม่ย่อท้อ"
 diplomacy_foreign_special.1028.honorable:0 "ความภักดีและความรู้สึกมีเกียรติ"
 diplomacy_foreign_special.1028.greed:0 "ความทะเยอทะยานที่สูงส่ง"
 diplomacy_foreign_special.1028.rational:0 "ความมีเหตุผลที่ชัดเจน"
 diplomacy_foreign_special.1028.zealous:0 "ศรัทธาที่ไม่สั่นคลอน"
 diplomacy_foreign_special.1028.energetic:0 "พลังงานและความเป็นธรรมชาติ"
 diplomacy_foreign_special.1028.forgiving:0 "ธรรมชาติที่ให้อภัย"
 diplomacy_foreign_special.1028.beautiful:0 "ความหล่อเหลาสง่างาม"
 diplomacy_foreign_special.1028.strong:0 "ความแข็งแกร่งของแขน"
 diplomacy_foreign_special.1028.extroverted:0 "วิธีการเข้ากับผู้คน"
 diplomacy_foreign_special.1028.dominant:0 "การแสดงตนที่แน่วแน่"
 diplomacy_foreign_special.1028.good:0 "คำชมของข้าได้รับการตอบรับอย่างดี"
 diplomacy_foreign_special.1028.neutral:0 "คำชมของข้าไม่ได้ผล"
 diplomacy_foreign_special.1028.bad:0 "คำชมของข้าฟังดูเป็นการดูถูก"
 diplomacy_foreign_special.1028.compliment.tt:1 "การที่คำชมได้รับการตอบรับจาก [foreign_guest.GetTitledFirstName] ดีเพียงใดนั้นขึ้นอยู่กับว่าคำชมนั้นเหมาะสมกับ [foreign_guest.GetHerHim] เพียงใดเป็นหลัก แต่ก็ขึ้นอยู่กับความคิดเห็นของ [foreign_guest.GetHerHis] ที่มีต่อท่านและทักษะ [diplomacy|E] ของท่านด้วย"
 diplomacy_foreign_special.1029.good.message:0 "[foreign_guest.GetTitledFirstName] รู้สึกปลื้มกับคำชมของข้า!"
 diplomacy_foreign_special.1029.neutral.message:0 "[foreign_guest.GetTitledFirstName] ดูเหมือนจะไม่สังเกตเห็นคำชมของข้า"
 diplomacy_foreign_special.1029.bad.message:0 "[foreign_guest.GetTitledFirstName] ดูเหมือนจะขุ่นเคืองกับความพยายามชมเชยของข้า..."
 diplomacy_foreign_special.1030.t:1 "$diplomacy_foreign_special.1017.t$: สายสัมพันธ์ที่ยั่งยืน"
 diplomacy_foreign_special.1030.desc:0 "หลังจากการเยือนที่เรียกได้ว่าน่าพึงพอใจอย่างยิ่ง [foreign_guest.GetTitledFirstName] และคณะผู้ติดตามของ [foreign_guest.GetHerHis] กำลังจะออกเดินทางไปยัง [foreign_guest_realm.GetNameNoTierNoTooltip]\n\nก่อนที่ [foreign_guest.GetTitleTierName] จะก้าวขึ้นรถม้าของ [foreign_guest.GetHerHis] [foreign_guest.GetSheHe] ได้ [ROOT.GetCharacter.Custom('GestureOfFriendship')] และแสดงความขอบคุณต่อ [foreign_guest.GetHerHis]"
 diplomacy_foreign_special.1030.bad_guest.desc:0 "[foreign_guest.GetTitledFirstName] ผู้หลอกลวงและคณะผู้ติดตามของ [foreign_guest.GetHerHis] กำลังจะออกเดินทางไปยัง [foreign_guest_realm.GetNameNoTierNoTooltip]\n\nก่อนที่ [foreign_guest.GetTitleTierName] จะก้าวขึ้นรถม้าของ [foreign_guest.GetHerHis] [foreign_guest.GetSheHe] ได้ [ROOT.GetCharacter.Custom('GestureOfFriendship')] และแสดงความขอบคุณต่อ [foreign_guest.GetHerHis]"
 diplomacy_foreign_special.1030.spouse.desc:0 "ข้าและ [ROOT.GetCharacter.Custom2('RelationToMe' , SCOPE.sC('helper_spouse') )] ผู้ "[helper_spouse.Custom('ComplimentAdjective')] ที่สุด" ของข้า ข้าสัญญาว่าจะส่งต่อคำชมของ [foreign_guest.GetHerHis]"
 diplomacy_foreign_special.1030.no_spouse.desc:0 "ข้า ข้ารับรองกับ [foreign_guest.GetHerHim] ว่า [foreign_guest.GetSheHe] ยินดีต้อนรับให้มาเยือนอีกครั้งเสมอ"
 diplomacy_foreign_special.1030.a_bad_guest:0 "[foreign_guest.GetSheHe|U] คิดว่า [foreign_guest.GetSheHe] หลอกข้าได้ แต่ข้ารู้ว่า [foreign_guest.GetSheHe] ทำอะไรลงไป"
 diplomacy_foreign_special.1030.a_extroverted:0 "ภาวนาให้ [foreign_guest.GetSheHe] มาเยือนเราอีกครั้งในเร็ววัน!"
 diplomacy_foreign_special.1030.a_introverted:0 "ในที่สุดก็ได้ความสงบเงียบเสียที"
 diplomacy_foreign_special.1030.a:0 "ขอให้การเดินทางของท่านรวดเร็วและปลอดภัย!"

 diplomacy_foreign_special.1031.t:1 "$diplomacy_foreign_special.1017.t$: การจากไปก่อนกำหนด"
 diplomacy_foreign_special.1031.desc:1 "ดวงอาทิตย์เพิ่งจะขึ้นเมื่อข้าสังเกตเห็นข้ารับใช้คนหนึ่งของ [foreign_guest.GetTitledFirstNamePossessive] กำลังแบกหีบใบใหญ่ ข้าตาม [dummy_servant_gender.GetWomanMan] ไปที่ลานภายใน ที่ ซึ่งข้าพบแขกของข้ากำลังกำกับการบรรทุกของขึ้นรถม้าของ [foreign_guest.GetHerHis]\n\n[foreign_guest.GetFirstName] สะดุ้งเมื่อข้าทักทาย [foreign_guest.GetHerHim] และกล่าวข้อแก้ตัวคลุมเครือเกี่ยวกับจดหมายและธุระด่วนบางอย่าง ด้วยความกระอักกระอ่วน ข้าอวยพรให้ [foreign_guest.GetHerHim] เดินทางปลอดภัยและรีบวิ่งกลับไปยังห้องพักส่วนตัวของข้า"
 diplomacy_foreign_special.1031.a:0 "ไม่เป็นไปอย่างที่ข้าคิดไว้เลย..."

 # Foreign Relations (Rulers arrange meeting between respective heirs), by Flavio Verna
 diplomacy_foreign.0100.opening:0 "[other_ruler.Custom2('AppropriateGreeting', ROOT.Char)]"
 diplomacy_foreign.0100.desc:0 "ข้าคิดว่าอาจเป็นผลประโยชน์สูงสุดของอาณาจักรของเราที่จะจัดการพบปะระหว่างทายาทของเรา [main_heir.GetTitledFirstName] และ [other_heir.GetTitledFirstName] การ ทำให้แน่ใจว่าพวกเขาสร้างความสัมพันธ์ที่มั่นคงและดีงามในตอนนี้ย่อมจะรับประกันความมั่นคงในอนาคตของดินแดนของเราอย่างแน่นอน"
 diplomacy_foreign.1100.a:0 "ช่างเป็นความคิดที่น่ายินดียิ่ง!"
 diplomacy_foreign.1100.b:0 "บางทีเราควรทำความรู้จักกันให้ดีขึ้นแทน"
 diplomacy_foreign.1100.t:0 "มิตรภาพที่ผลิบาน"
 diplomacy_foreign.1101.desc:0 "การพบปะที่จัดขึ้นระหว่าง [other_heir.GetFirstName] และ [main_heir.GetFirstName] เป็นโอกาสอันสมบูรณ์แบบในการสร้างรากฐานของความสัมพันธ์ที่ยืนยาวระหว่างอาณาจักรของข้าและของ [other_ruler.GetTitledFirstNamePossessive]\n\nข้าควรระมัดระวังอย่างยิ่งในการวางแผนการพบปะ"
 diplomacy_foreign.1101.a:0 "[other_heir.GetFirstNameNoTooltip] ควรมาที่ [scoped_capital.GetNameNoTooltip]"

 diplomacy_foreign.1101.court_visit.very_well:0 "การเยือนราชสำนักดำเนินไป #P อย่างดีเยี่ยม#!"
 diplomacy_foreign.1101.court_visit.poorly:0 "การเยือนราชสำนักดำเนินไป #N อย่างย่ำแย่#!"
 diplomacy_foreign.1101.court_visit.well:0 "การเยือนราชสำนักดำเนินไป #P อย่างดี#!"

 diplomacy_foreign.1101.a.tooltip:1 "การเป็นเจ้าภาพจะช่วยให้ท่านมีอิทธิพลต่อการพบปะ"
 diplomacy_foreign.1101.b:0 "[main_heir.GetTitledFirstNameNoTooltip] จะไปเยือนราชสำนักของ [other_ruler.GetTitledFirstNamePossessiveNoTooltip]"
 diplomacy_foreign.1101.b.tooltip:1 "ท่านจะ #N ไม่#! สามารถมีอิทธิพลต่อการพบปะได้"
 diplomacy_foreign.1102.desc:0 "[other_heir.GetTitledFirstName] ได้รับการต้อนรับด้วยความเอิกเกริกและพิธีรีตองอันเหมาะสมสำหรับแขกผู้มีเกียรติ เช่นนี้ [other_heir.GetSheHe|U] จะพำนักอยู่ใน [scoped_capital.GetNameNoTooltip] เป็นเวลาสองสามสัปดาห์ ในระหว่างนั้น [other_heir.GetSheHe] และ [main_heir.GetFirstName] จะได้ทำความรู้จักกันให้ดีขึ้น"
 diplomacy_foreign.1102.a:0 "ข้าจะช่วย [ROOT.GetCharacter.Custom2('RelationToMe' , SCOPE.sC('main_heir') )] ของข้าอย่างแน่นอน"
 diplomacy_foreign.1102.a.duel_success:0 "[other_heir.GetTitledFirstNameNoTooltip] ประทับใจในการต้อนรับขับสู้ของข้า"
 tooltip.diplomacy_foreign.1102.a.duel_success:0 "[other_heir.GetTitledFirstNameNoTooltip] ประทับใจในการต้อนรับขับสู้ของข้า"
 diplomacy_foreign.1102.a.duel_failure:0 "การปรากฏตัวของข้ารบกวนการพบปะระหว่างทายาทหนุ่มสาว"
 tooltip.diplomacy_foreign.1102.a.duel_failure:0 "การปรากฏตัวของข้ารบกวนการพบปะระหว่างทายาทหนุ่มสาว"
 diplomacy_foreign.1102.b:0 "ข้าจะยกยอ [other_heir.GetFirstNameNoTooltip] ด้วยของกำนัลหรูหรา!"
 diplomacy_foreign.1102.c:0 "ข้าเชื่อใจ [main_heir.GetFirstNameNoTooltip] ให้จัดการด้วย [main_heir.GetHerselfHimself]"
 diplomacy_foreign.1102.c.tooltip.high:0 "[main_heir.GetTitledFirstName] จะทำได้ #P ดี#!"
 diplomacy_foreign.1102.c.tooltip.medium:0 "[main_heir.GetTitledFirstName] จะทำได้ #P พอใช้#!"
 diplomacy_foreign.1102.c.tooltip.low:0 "[main_heir.GetTitledFirstName] จะทำได้ #N แย่#!"
 diplomacy_foreign.1103.start.desc:0 "ในที่สุดก็ถึงเวลาที่ [other_heir.GetTitledFirstName] จะกลับอาณาจักร"
 diplomacy_foreign.1103.culture_conversion.desc:0 "ดูเหมือนว่า ในระหว่างที่ [other_heir.GetHerHis] พำนักอยู่ที่นี่ [other_heir.GetWomanMan] หนุ่มสาวผู้นี้ได้ชื่นชอบวัฒนธรรมของเราและตัดสินใจรับเอาธรรมเนียมหลายอย่างจากราชสำนักของข้าไป"
 diplomacy_foreign.1103.faith_conversion.desc:0 "ข้ายินดีที่ได้ยินว่า ในระหว่างที่ [other_heir.GetHerHis] พำนักอยู่ที่นี่ [other_heir.GetWomanMan] หนุ่มสาวผู้นี้ตัดสินใจเปลี่ยนมานับถือ [main_heir.GetFaith.GetName] และละทิ้งศรัทธาเดิมของ [other_heir.GetHerHis]"
 diplomacy_foreign.1103.present.desc:0 "ก่อนจากไป [other_heir.GetWomanMan] หนุ่มสาวผู้นี้ตัดสินใจให้เกียรติเราด้วยของกำนัลอันวิจิตรยิ่งในนามของ [other_heir.Custom2('RelationToMe' , SCOPE.sC('other_ruler') )] ของ [other_heir.GetHerHis]"
 diplomacy_foreign.1103.prestige.desc:0 "[other_heir.GetSheHe|U] ประทับใจในการต้อนรับขับสู้ของเราและได้สัญญาว่าจะบอกต่อถึงเกียรติภูมิของราชสำนักข้าไปทั่ว"
 diplomacy_foreign.1103.empty.desc:0 ""
 diplomacy_foreign.1103.friendship.desc:0 "\n\nเรื่องราวระหว่าง [other_heir.GetHerHim] และ [main_heir.GetFirstName] เป็นไปได้ดียิ่งกว่าที่คาดไว้: ทั้งสองกลายเป็นเพื่อนที่แยกจากกันไม่ได้"
 diplomacy_foreign.1103.love.desc:0 "\n\nเรื่องราวระหว่าง [other_heir.GetHerHim] และ [main_heir.GetFirstName] เป็นไปได้ดียิ่งกว่าที่คาดไว้: เป็นที่ชัดเจนว่าทั้งสองตกหลุมรักกัน"
 diplomacy_foreign.1103.rivalry.desc:0 "\n\nน่าเสียดายที่เรื่องราวไม่เป็นไปตามแผน: [other_heir.GetFirstNameNoTooltip] และ [main_heir.GetFirstName] ไม่อาจทนกันได้เลย"
 diplomacy_foreign.1103.opinion_gain.desc:0 "\n\nเรื่องราวระหว่าง [other_heir.GetHerHim] และ [main_heir.GetFirstName] เป็นไปได้ดีอย่างที่ [other_ruler.GetTitledFirstName] และข้าหวังไว้ และหวังว่าทายาทหนุ่มสาวทั้งสองจะเป็นสหายที่ดีต่อกันในเวลาต่อไป"
 diplomacy_foreign.1103.opinion_loss.desc:0 "\n\nน่าเสียดายที่เรื่องราวไม่เป็นไปตามแผน: [other_heir.GetFirstNameNoTooltip] และ [main_heir.GetFirstName] ดูเหมือนจะไม่มีอะไรเหมือนกันเลย..."
 diplomacy_foreign.1103.tainted_exp.desc:0 "\n\nอย่างน้อยที่สุด ประสบการณ์นี้ได้ช่วยให้ข้าทำความเข้าใจการเมืองได้ลึกซึ้งยิ่งขึ้น"
 diplomacy_foreign.1103.good_exp.desc:0 "\n\nยิ่งไปกว่านั้น การเยือนครั้งนี้พิสูจน์แล้วว่าเป็นโอกาสอันยอดเยี่ยมในการขัดเกลาทักษะทางการทูตของข้า"
 diplomacy_foreign.1103.no_exp.desc:0 "\n\nสิ่งที่น่าหงุดหงิดอย่างแท้จริงเกี่ยวกับเรื่องราวทั้งหมดนี้คือข้าไม่สามารถเรียนรู้อะไรจากมันได้มากนัก"
 tooltip.diplomacy_foreign.1103.a.culture_conversion_success:0 "การเปลี่ยนวัฒนธรรม"
 tooltip.diplomacy_foreign.1103.a.faith_conversion_success:0 "การเปลี่ยนศรัทธา"
 diplomacy_foreign.1103.a:0 "ควรตีเหล็กเมื่อยังร้อน!"
 diplomacy_foreign.1103.b:0 "เราควรลองทำ เช่นนี้อีกครั้งในภายหลัง..."
 diplomacy_foreign.1104.start.desc:0 "[main_heir.GetFirstName] กลับมาในที่สุดหลังจาก [main_heir.GetHerHis] เยือนราชสำนักของ [other_ruler.GetTitledFirstNamePossessive]"
 diplomacy_foreign.1104.culture_conversion.desc:0 "\n\nในระหว่างการพำนักระยะสั้นของ [main_heir.GetHerHis] [main_heir.GetSheHe] ดูเหมือนจะชอบธรรมเนียมของเจ้าภาพของ [main_heir.GetHerHis] อย่างมาก"
 diplomacy_foreign.1104.faith_conversion.desc:0 "\n\nปรากฏว่า ในระหว่างการเยือนของ [main_heir.GetHerHis] [main_heir.GetSheHe] ได้พบเป้าหมายใหม่ในการนับถือ [other_heir.GetFaith.HighGodName]"
 diplomacy_foreign.1104.present.desc:0 "\n\nเพื่อให้สอดคล้องกับยศถาบรรดาศักดิ์อันสูงส่งของ [main_heir.GetHerHis] [main_heir.GetSheHe] ได้รับของขวัญหรูหรามากมายในระหว่างการพำนักของ [main_heir.GetHerHis]"
 diplomacy_foreign.1104.prestige.desc:0 "\n\nเพื่อให้สอดคล้องกับยศถาบรรดาศักดิ์อันสูงส่งของ [main_heir.GetHerHis] [main_heir.GetSheHe] ได้รับการต้อนรับอย่างดีจากเจ้าภาพของ [main_heir.GetHerHis] ซึ่งได้สรรเสริญวงศ์ตระกูลของเราในที่สาธารณะหลายครั้งในระหว่างการพำนักของ [main_heir.GetFirstNamePossessiveNoTooltip]"
 diplomacy_foreign.1105.hostdead.desc:0 "ด้วยการถึงแก่อสัญกรรมอันน่าเศร้าของ [other_ruler.GetTitledFirstName] แผนการของเราที่จะ ทำให้บุตรหลานของเราทำความรู้จักกันและสร้างความสัมพันธ์ฉันมิตรระหว่างอาณาจักรของเราก็สิ้นสุดลงไปด้วย"
 diplomacy_foreign.1105.guestdead.desc:0 "น่าเศร้าที่แผนการของข้าและ [other_ruler.GetTitledFirstNamePossessive] ได้สิ้นสุดลงกะทันหันด้วยการจากไปอย่างกะทันหันของ [other_heir.GetFirstName]"
 diplomacy_foreign.1105.fallback.desc:0 "ดูเหมือนโชคชะตาได้สมคบคิดเพื่อขัดขวางการพบปะระหว่าง [main_heir.GetFirstName] และ [other_heir.GetFirstName] บางทีโอกาสใหม่อาจจะมาถึงเองในอนาคต"
 diplomacy_foreign.1105.a:0 "ช่างน่าเศร้าสลด..."

 # Foreign Relations (Neighboring rulers tidying up their borders), by Flavio Verna
 diplomacy_foreign.1150.t:0 "การจัดระเบียบพรมแดน"
 diplomacy_foreign.1150.desc:0 "ชั่วระยะเวลาหนึ่งแล้วที่ข้าได้ครุ่นคิดเกี่ยวกับความคลาดเคลื่อนระหว่างพรมแดนทางประวัติศาสตร์และพรมแดนปัจจุบันของอาณาจักรของ [neighbor.GetTitledFirstNamePossessive] และของข้า \n\n[neighbor.GetSheHe|U] ปกครอง [county.GetName] ดินแดนที่ควรเป็นของ [ruler.GetPrimaryTitle.GetNameNoTierNoTooltip] โดยชอบธรรม ขณะที่ปัจจุบันข้าควบคุม [neighbor_county.GetName] ซึ่ง [neighbor.GetTitledFirstNameNoTooltip] อ้างสิทธิ์ปกครอง"
 diplomacy_foreign.1150.a:0 "ทางออกนั้นง่ายดาย..."
 diplomacy_foreign.1160.a.success:0 "ข้าโน้มน้าว [neighbor.GetTitledFirstName] ได้สำเร็จ"
 diplomacy_foreign.1160.a.failure:0 "[neighbor.GetTitledFirstName] ปฏิเสธข้อเสนอของข้า"
 diplomacy_foreign.1150.b:0 "แน่นอนว่าเราสามารถหาข้อตกลงกันได้?"
 diplomacy_foreign.1150.c:0 "ดาบ ไม่ใช่วาจา ที่จะแก้ไขข้อพิพาทนี้"
 diplomacy_foreign.1151.desc:0 "ด้วยความสามารถทางการทูตอันเฉียบแหลมของข้า ข้าสามารถโน้มน้าว [neighbor.GetTitledFirstName] ให้ยอมยก [county.GetNameNoTier] ให้เพื่อแลกกับ [neighbor_county.GetNameNoTier] หวังว่าการกระทำนี้จะป้องกันการนองเลือดที่ไม่จำเป็นระหว่างอาณาจักรของเราในอนาคต"
 diplomacy_foreign.1151.a:0 "หวังว่าจะเป็น เช่นนั้น"
 diplomacy_foreign.1152.desc:0 "น่าเศร้าที่ข้าไม่สามารถชักชวน [neighbor.GetTitledFirstName] ให้ยอมยก [county.GetNameNoTier] ให้เพื่อแลกกับ [neighbor_county.GetNameNoTier] ข้าได้ แต่หวังว่าความดื้อรั้นของ [neighbor.GetHerHis] จะไม่นำพาอาณาจักรของเราไปสู่หนทางอันมืดมน"
 diplomacy_foreign.1152.a:0 "ความขัดแย้งอาจหลีกเลี่ยงไม่ได้"
 diplomacy_foreign.1153.desc:0 "[ruler.GetTitledFirstName] ได้ยื่นข้อเสนอที่แปลกประหลาดให้ข้าในวันนี้\n\n[ruler.GetSheHe|U] กล่าวว่า [ruler.GetSheHe] พร้อมที่จะยอมยกการควบคุม [neighbor_county.GetNameNoTier] ซึ่งเป็นจังหวัดที่อาณาจักรของข้ามีการอ้างสิทธิ์อันเก่าแก่ เพื่อแลกกับ [county.GetName] ซึ่งบรรพบุรุษของ [ruler.GetHerHis] อ้างว่าเคยครอบครองดินแดน"
 diplomacy_foreign.1153.a:0 "ข้อเสนอที่ยุติธรรม"
 diplomacy_foreign.1153.b:0 "ข้าจะไม่ยอมสละสิ่งที่เป็นของข้า!"

 # Foreign Relations (Gaining friend), by Flavio Verna
 diplomacy_foreign.1200.t:0 "เรื่องละเอียดอ่อน"
 diplomacy_foreign.1200.spouse.desc:0 ""ทรงงานดึกอีกแล้วหรือ, [ROOT.Char.Custom('FormOfAddressForLiege')]?"\n\n[ROOT.GetCharacter.Custom2('RelationToMe' , SCOPE.sC('diplomacy_friend') )] ของข้าชะโงกข้ามไหล่ของข้า เหลือบมองเอกสารที่กองท่วมโต๊ะทำงานของข้า "ข้าพอมีประสบการณ์กับเรื่องเหล่านี้อยู่บ้าง," [diplomacy_friend.GetSheHe] เอ่ยขึ้นอย่างลังเล "บางทีข้าอาจช่วยท่านในการได้รับความไว้เนื้อเชื่อใจจาก [neighbor_ruler.GetTitledFirstNamePossessive] ได้?""
 diplomacy_foreign.1200.relative.desc:0 ""ข้าได้ยินมาว่าท่านกำลังมุ่งเน้นไปที่การปรับปรุงสถานะของอาณาจักรกับเพื่อนบ้าน [diplomacy_friend.Custom2('RelationToMe' , ROOT.GetCharacter )]" \n\n[diplomacy_friend.GetFirstName] เข้ามาหาข้าอย่างเป็นมิตร "ข้าให้ความสนใจในเรื่องเหล่านี้มานานแล้ว และข้ายินดีที่จะเสนอความช่วยเหลือแก่ท่านในการได้รับความไว้วางใจจาก [neighbor_ruler.GetTitledFirstNamePossessive] อย่างไรเสีย เราก็เป็นเครือญาติกัน""
 diplomacy_foreign.1200.fallback.desc:0 "[diplomacy_friend.GetTitledFirstName] ได้ช่วยเหลือข้าอย่างแท้จริงในช่วงสองสามวันที่ผ่านมา ช่วยข้าในความพยายามที่จะกระชับความสัมพันธ์ของอาณาจักรกับเพื่อนบ้านของเรา [diplomacy_friend.GetSheHe|U] เพิ่งเสนอ [diplomacy_friend.GetHerselfHimself] อีกครั้งเพื่อช่วยข้าให้ได้รับความไว้วางใจจาก [neighbor_ruler.GetTitledFirstNamePossessive] \n\nช่างยากเหลือเกินที่จะหาคนที่ไว้ใจได้อย่างแท้จริงในทุกวันนี้..."
 diplomacy_foreign.1200.a.a:0 "ไม่มีสิ่งใดจะ ทำให้ข้ายินดีไปกว่านี้อีกแล้ว"
 diplomacy_foreign.1200.a.b:0 "ท่านให้เกียรติข้า [ROOT.GetCharacter.Custom2('RelationToMe' , SCOPE.sC('diplomacy_friend') )]"
 diplomacy_foreign.1200.a.c:0 "ข้าจะจดจำความเมตตาของท่าน"
 diplomacy_foreign.1200.b:0 "ข้าคิดว่าข้าสามารถจัดการ [neighbor_ruler.GetTitledFirstNameNoTooltip] ได้"
 diplomacy_foreign.1200.b.success:0 "ความพยายามทางการทูตของข้าสัมฤทธิ์ผล"
 diplomacy_foreign.1200.b.failure:0 "ข้าไม่สามารถ ทำให้ [neighbor_ruler.GetTitledFirstName] ประทับใจได้"
 diplomacy_foreign.1200.c:0 "[neighbor_ruler.GetTitledFirstNameNoTooltip] ไม่คุ้มค่ากับความพยายาม..."
