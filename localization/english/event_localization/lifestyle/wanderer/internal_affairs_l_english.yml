l_english: 
 internal_affairs.10.t: "การลุกฮือที่กำลังจะมาถึง"
 internal_affairs.10.desc: ""และนั่นคือสถานการณ์ปัจจุบันใน [barony_title.GetName] [ROOT.Char.Custom('FormOfAddressForLiege')]" [provider_character.GetFirstName] แจ้งแก่ข้า ดูเหมือนว่าช่วงนี้จะมีการจลาจลเล็กน้อยในท้องถนน เนื่องจากความไม่พอใจเรื่อง "
 internal_affairs.10.desc.control: "การปล้นสะดมที่แพร่ระบาด ซึ่ง ทำให้พลเมืองตกอยู่ในอันตราย"
 internal_affairs.10.desc.opinion.other: "ความเกลียดชังที่พวกเขามีต่อเจ้านายของตน [county_holder.GetTitledFirstName]"
 internal_affairs.10.desc.opinion.me: "การปกครองพื้นที่ของข้า"
 internal.affairs.10.desc.outro: "\n\nผู้เดียวที่สามารถควบคุมสถานการณ์ไม่ให้บานปลายกลายเป็นความรุนแรงได้คือ[barony_holder.GetTitledFirstName] ซึ่งดูเหมือนจะเป็นที่นิยมในหมู่คนท้องถิ่น นอกเหนือจากการควบคุมพลเมืองแล้ว [barony_holder.GetSheHe]ยังได้ส่งคำร้องเล็กๆ เพื่อขอจัดเทศกาลในพื้นที่ เพื่อ ทำให้สถานการณ์สงบลงอีกด้วย"
 internal_affairs.10.a: "เช่นนั้นก็ให้[barony_holder.GetTitledFirstNameNoTooltip]ผู้นี้รับผิดชอบไป..."
 internal_affairs.10.b: "... [county_holder.GetFirstNameNoTooltip] จะได้รับการชดเชยสำหรับเรื่องนี้ด้วยซ้ำ!"
 internal_affairs.10.c: "[barony_holder.GetSheHe|U] สามารถจัดเทศกาลของ[barony_holder.GetHerHis]ได้"
 internal_affairs.10.d: "มิใช่หน้าที่ของ[county_holder.GetFirstNamePossessiveNoTooltip]ในการจัดการเรื่องนี้หรอกหรือ?"

 internal_affairs_local_uprising_appeasement_modifier: "ชาวบ้านสงบลง"
 internal_affairs_local_uprising_appeasement_modifier_desc: "ชาวบ้านในเคาน์ตีสงบลงหลังจากการเปลี่ยนแปลงผู้ปกครองในพื้นที่"

 internal_affairs_local_uprising_festival_modifier: "เทศกาลชนบท"
 internal_affairs_local_uprising_festival_modifier_desc: "มีการจัดเทศกาลชนบทเล็กๆ ขึ้นทุกปีเพื่อเอาใจชาวบ้าน"

 internal_affairs.20.t: "[county_holder.GetLadyLord]ผู้ไม่เหมาะสม"
 internal_affairs.20.desc: "เป็นครั้งที่สามในสัปดาห์นี้ ที่ข้าได้รับข่าวสารจากผู้ส่งสารอีกคนเกี่ยวกับสภาพอันน่าสังเวชของ[county_title.GetNameNoTier]"
 internal_affairs.20.desc.both: "อาชญากรรมที่แพร่ระบาด พลเมืองเสียชีวิตตามท้องถนน และบรรยากาศทั่วไปของความหวาดกลัวและความทุกข์"
 internal_affairs.20.desc.control: "อาชญากรรมที่แพร่ระบาด ถนนที่ไม่ปลอดภัย และพลเมืองที่หวาดกลัวที่จะออกจากบ้านหลังค่ำ"
 internal_affairs.20.desc.opinion: "ความไม่พอใจอย่างฝังรากลึกต่อวิธีการปกครองเคาน์ตี และการประท้วงเป็นประจำตามท้องถนน"
 internal_affairs.20.desc.outro: "\n\nข้าได้ส่งผู้ส่งสารไปแจ้ง[county_holder.GetTitledFirstName]เกี่ยวกับเรื่องนี้แล้ว แต่ดูเหมือนว่าปัญหาจะไม่มีที่สิ้นสุด นี่คือการกระทำของผู้ที่สมควรจะเป็นหนึ่งในข้าหลวง #emp ของข้า#! หรือ?"
 internal_affairs.20.dread: "หากเจ้าจะบีบคั้นพวกเขา ก็จงทำอย่างถูกต้อง ไอ้พวกมือสมัครเล่น"
 internal_affairs.20.a: "ยอมรับไม่ได้"
 internal_affairs.20.a.tt: "ท่านสามารถ[revoke|E] [title_i] [title|E] จาก[county_holder.GetTitledFirstName]ได้อย่างชอบธรรม"
 internal_affairs.20.b: "ข้าจะปล่อยผ่านไปในครั้งนี้"

 opinion_unfitting_ruler_opinion: "ผู้ปกครองที่ไม่เหมาะสม"
 MODIFIER_DEFINITION_UNFITTING_RULER_DESC: "\nค่าปรับปรุงนี้จะเพิ่มขึ้นตามระดับ[dread|E]ที่สูงขึ้นของ[holder|E]"

 inspection_unfitting_ruler_modifier: "เคาน์ตีที่ถูกขูดรีด"
 inspection_unfitting_ruler_modifier_desc: "เคาน์ตีนี้กำลังถูกขูดรีดจนแห้งเหือด ภาษีและผู้คนไหลออกไปทุกวัน"

 inspection_unfitting_ruler_desc: "\t#weak เพิ่มขึ้นสำหรับทุกๆ #bold ความน่าเกรงขาม#! ที่[holder|E]มี#!"

 internal_affairs.30.t: "การมองข้ามไป"
 internal_affairs.30.desc: ""คืออย่างนี้ [ROOT.Char.Custom('FormOfAddressForLiege')] ข้อกำหนดของท้องถิ่นบางอย่างที่บังคับใช้กับพวกเรานั้น #emp ช่าง#! โหดร้ายต่อธุรกิจ..." ข้าพบว่าตนเองถูกเข้าหาโดย [merchant_character.GetFirstName] ตัวแทนของ [SCOPE.Custom('LocalGuildsLoc')] แห่ง [guild_province.GetName] [merchant_character.GetSheHe|U] ได้พูดอย่างยืดยาวถึงปัญหาที่สมาคมของ[merchant_character.GetHerHis]ต้องเผชิญ\n\n"ข้าคิดว่า บางที เราน่าจะตกลงเรื่องต่าง ๆ ระหว่างเราสองคนแทน" [merchant_character.GetSheHe|U] วางถุงเล็ก ๆ ลงบนโต๊ะตรงหน้าข้า และมองข้าอย่างรู้กัน"
 internal_affairs.30.a: "โอ้ ข้าทำได้ดีกว่าแค่การมองข้ามไป..."
 internal_affairs.30.b: "เอาล่ะ แค่ครั้งนี้ครั้งเดียว"
 internal_affairs.30.c: "ออกไปจากที่นี่ก่อนที่ข้าจะสั่งฆ่าเจ้า ไอ้ปลิงดูดเลือด!"

 internal_affairs.40.t: "เค้าลางที่ยังหลงเหลือ"
 internal_affairs.40.follower_intro: "ในฐานะผู้ส่งสาร [secret_giver.GetFirstName]ถ่ายทอดข่าวสารจากรอบบริเวณ ทำให้ข้ารับรู้เรื่องราว ในขณะที่ข้ากำลังยุ่งอยู่กับเรื่องอื่น แม้ว่าเรื่องส่วนใหญ่ที่[secret_giver.GetSheHe]กล่าวถึงจะไม่มีอะไรผิดปกติ แต่ก็มีแววความกังวลในน้ำเสียงของ[secret_giver.GetHerHis]ทุกครั้งที่เอ่ยถึงนามของ[secret_haver.GetNamePossessive]\n\nในที่สุด, "
 internal_affairs.40.courtier_intro: "ขณะเดินตรวจตราไปทั่วค่าย เสียงที่ไม่คุ้นหูแว่วมาถึงข้า กำลังสนทนากับสหายคนหนึ่งของข้าในบริเวณใกล้เคียง ข้าหยุดและเงี่ยหูฟัง บทสนทนาในตอนแรกดูน่าเบื่อ แต่แล้วนามของ[secret_haver.GetName]ก็ถูกเอ่ยขึ้นอย่างกะทันหัน\n\n"
 internal_affairs.40.desc: "[secret_giver.GetFirstName]เริ่มเจาะลึกถึงหัวข้อที่ละเอียดอ่อนยิ่งขึ้นเกี่ยวกับ[secret_haver.GetFirstNameNoTooltip] เปิดเผยเรื่องราวที่อาจ ทำให้ชื่อเสียงของ[secret_haver.GetHerHis]มัวหมองได้เป็นอย่างดี..."
 internal_affairs.40.a: "บางทีเจ้าอาจมีประโยชน์ต่อข้า [secret_giver.GetFirstName]"
 internal_affairs.40.blackmail: "ข้าสามารถใช้เรื่องนี้ให้เป็นประโยชน์ต่อข้าได้อย่างแน่นอน"
 internal_affairs.40.expose: "ทุกคนควรจะรู้ว่า[secret_haver.GetFirstName]กำลังทำอะไรอยู่!"
 internal_affairs.40.move_zealous: "[GetPlayer.GetFaith.HighGodName]ทรงเรียกให้ข้าไปจากที่นี่..."
 internal_affairs.40.move: "อาจถึงเวลาที่ข้าต้องจาก[GetPlayer.GetDomicile.GetLocation.GetName]แล้วกระมัง..."
 
 internal_affairs.50.t: "การประท้วงของชาว[target_faith.GetAdherentNameNoTooltip]"
 internal_affairs.50.desc: "เหล่าไพร่ใน[tensions_county.GetNameNoTier]ดูเหมือนจะไม่ให้ความไว้วางใจหรือความรักใคร่ต่อ[tensions_county.GetHolder.GetName] ไม่ต้องคาดเดาถึงสาเหตุของความไม่สงบนี้เลย เมื่ออนุสรณ์สถานของชาว[target_faith.GetAdherentNameNoTooltip]กำลังถูกเหยียดหยาม และมีการทะเลาะวิวาทเพิ่มขึ้นระหว่างชาว[target_faith.GetAdherentNamePluralNoTooltip]และชาว[opposing_faith.GetAdherentNamePluralNoTooltip]ด้วยกัน "
 internal_affairs.50.desc.holder_faith: "แม้ว่า[tensions_county.GetHolder.GetNameNoTooltip]อาจจะนับถือศาสนาเดียวกับชาว[target_faith.GetAdherentNamePluralNoTooltip]ด้วยตัวของ[tensions_county.GetHolder.GetHerHim]เอง ศรัทธาของ[tensions_county.GetHolder.GetHerHis]เพียงอย่างเดียวไม่สามารถระงับการมีอยู่ของ[target_liege.GetTitleTierName]ผู้เป็น[opposing_faith.GetAdherentNameNoTooltip]ได้"
 internal_affairs.50.desc.root_faith: "\n\nข้าสงสัยว่าข้าควรจะระแวดระวังเกี่ยวกับสถานะของเพื่อนร่วมศรัทธาชาว[GetPlayer.GetFaith.GetAdherentNamePluralNoTooltip]ของข้าหรือไม่ อย่างน้อยก็ เพื่อให้แน่ใจว่าการบูชา[GetPlayer.GetFaith.HighGodName]ของเราจะไม่ถูกขัดขวาง "
 internal_affairs.50.desc.neutral_faith: "\n\nถึง แม้ว่าข้าจะไม่ได้นับถือ[opposing_faith.GetNameNoTooltip]หรือ[target_faith.GetNameNoTooltip] แต่ก็น่าจะดูว่ามีอะไรที่สามารถทำได้ที่นี่ "
 internal_affairs.50.desc_end: "อย่างดีที่สุด ข้าอาจจะช่วยดูแลให้ความตึงเครียดเหล่านี้คลี่คลายลงได้ มิฉะนั้นมันอาจเริ่มเป็นภัยต่อความปลอดภัยของข้า"
 internal_affairs.50.tolerance: "ให้ชาว[target_faith.GetAdherentNamePluralNoTooltip]มีความเชื่อของพวกเขาต่อไป"
 internal_affairs.50.conversion: "[tensions_county.GetNameNoTierNoTooltip]ควรจะเป็น[opposing_faith.GetAdherentNameNoTooltip]อย่างสมบูรณ์!"
 internal_affairs.50.neutral_cynic: "เหตุใดผู้คนจึงปล่อยให้ศาสนามีอำนาจเหนือชีวิตของพวกเขาถึงเพียงนี้?"
 internal_affairs.50.neutral: "ในทางกลับกัน นี่ไม่ใช่เรื่องของข้า..."
 internal_affairs.tolerance_desc: "ท่านพยายามช่วยเหลือเหล่าไพร่ในการยืนยันสิทธิ์ที่จะปฏิบัติตามความเชื่อ[target_faith.GetNameNoTooltip]"
 internal_affairs.conversion_desc: "ท่านพยายามเปลี่ยนศาสนาของเหล่าไพร่ใน[tensions_county.GetNameNoTierNoTooltip]ให้เป็น[opposing_faith.GetNameNoTooltip]"
 local_zealots_appeased_tt: "ชาว[target_faith.GetAdherentNamePluralNoTooltip]ในท้องถิ่นได้รับการปลอบโยน"
 religious_tension_continues_tt: "ความไม่สงบของชาว[target_faith.GetAdherentNameNoTooltip]ยังคงดำเนินต่อไป"
 religious_county_converted_tt: "[tensions_county.GetNameNoTierNoTooltip]ถูกโน้มน้าวให้เปลี่ยนเป็น[opposing_faith.GetNameNoTooltip]"

 internal_affairs.60.t: "ขุมทรัพย์โจร"
 internal_affairs.60.desc: "ขณะเดินทางผ่านช่องทางใน[bandit_location.GetNameNoTier] ข้าสังเกตเห็นร่างหนึ่งเคลื่อนไหวอย่างรวดเร็วด้วยหางตา เมื่อเลี้ยวหัวมุม ข้าเห็นกลุ่มชายรูปร่างกำยำท่าทางหยาบกร้านกำลังบรรจุของปล้นต่างๆ เต็มเกวียน เคลื่อนไหวอย่างรวดเร็วราวกับ[GetPlayer.GetFaith.DevilName] [GetPlayer.GetFaith.DevilHerselfHimself]กำลังไล่ตามมาติดๆ\n\nชายส่วนใหญ่ละจากบริเวณนั้นไปเพื่อนำของปล้นมาเพิ่ม และ[bandit_character.GetFirstName]รออยู่ตามลำพังเพื่อคอยดูต้นทาง ข้าสังเกตเห็นกระเป๋าใบหนึ่งในเกวียน ซึ่งมีตราประทับของ[bandit_holder.GetName] แต่ตัวข้าเองก็ต้องการสิ่งของข้างในนั้น เช่นกัน..."
 internal_affairs.60.force: "[bandit_character.GetName]จะทำอะไรได้?"
 internal_affairs.60.force_tt: "ข้าเผชิญหน้ากับโจรที่อยู่ตามลำพังและพยายามยึดของรางวัลของ[bandit_character.GetHerHis]มาเป็นของตนเอง"
 internal_affairs.60.force_tt_succ: "ข้าขโมยของโจรได้สำเร็จ"
 internal_affairs.60.force_tt_fail: "[bandit_character.GetNameNoTooltip]ต่อสู้ขับไล่ข้าได้"
 internal_affairs.60.snitch: "[bandit_holder.GetFirstName]คงอยากจะรู้เรื่องนี้"
 internal_affairs.60.snitch_tt: "ข้าแจ้งให้[bandit_holder.GetNameNoTooltip]ทราบถึงกิจกรรมของเหล่าโจร และ[bandit_holder.GetSheHe]ก็ตอบแทนข้าด้วยส่วนแบ่งจากของที่ถูกขโมยไป"
 internal_affairs.60.sus: "บางที[bandit_character.GetNameNoTooltip]อาจจะให้ข้าร่วมงานของ[bandit_character.GetHerHis]บ้างก็ได้..."
 internal_affairs.60.sus_tt: "สร้าง#V 3#! [criminal_task_contracts|E]บนแผนที่"
 internal_affairs.60.neutral: "นี่ไม่ใช่ปัญหาของข้า"

 MODIFIER_DEFINITION_LOCAL_CORRUPTION_DESC: "\nค่าปรับปรุงนี้จะเพิ่มขึ้นตามระดับ[county_control|E]ที่ต่ำลงของ[county|E]"
 internal_affairs_local_corruption_desc: "\t#weak เพิ่มขึ้นสำหรับทุกๆ คะแนน #bold การควบคุมเคาน์ตี#! ที่ต่ำกว่า 100#!"

 internal_affairs_local_corruption_modifier: "การทุจริตที่ได้รับการรับรอง"
 internal_affairs_local_corruption_modifier_desc: "สมาคมพ่อค้าท้องถิ่นได้รับอำนาจเกือบไม่จำกัดในธุรกิจท้องถิ่น ค่อยๆ บั่นทอนระบบราชการและลำดับชั้นของเคาน์ตี"

 internal_affairs_camp_momentum_modifier: "แรงผลักดันในค่าย"
 internal_affairs_camp_momentum_modifier_desc: "นักผจญภัยผู้นี้ถูกเรียกให้ออกเดินทาง และอาจจะตั้งค่ายพักแรมที่อื่น"

 internal_affairs_county_religious_tensions_modifier: "ความตึงเครียดทางศาสนาเพิ่มขึ้น"
 internal_affairs_county_religious_tensions_modifier_desc: "เคาน์ตีนี้กำลังประสบปัญหาความตึงเครียดทางศาสนา ซึ่งเลวร้ายลงจากการแทรกแซงของผู้มีอิทธิพล\nความคืบหน้า[convert_county|E]รายเดือน: #N -0.2#!"

 RELIGIOUS_TENSIONS_DESC: "[GetModifier( 'internal_affairs_county_religious_tensions_modifier' ).GetNameWithTooltip]"
 RELIGIOUS_TOLERANCE_DESC: "[GetModifier( 'internal_affairs_county_religious_tolerance_modifier' ).GetNameWithTooltip]"
 
 internal_affairs_county_religious_tolerance_modifier: "การยอมรับความแตกต่างทางศาสนา"
 internal_affairs_county_religious_tolerance_modifier_desc: "เสียงของชนกลุ่มน้อยทางศาสนาในเคาน์ตีนี้ได้รับการรับฟัง และสิทธิในการปฏิบัติตามความเชื่อของพวกเขาได้รับการเคารพ อย่างน้อยก็ในตอนนี้\nความคืบหน้า[convert_county|E]รายเดือน: #N -0.1#!"
 
