l_english: 
 destination_events.10.t: "นักพเนจรผู้เจนประสบการณ์"
 destination_events.10.desc: ""[ROOT.Char.Custom('FormOfAddressForLiege')|U]," [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('provider_character'))] ของข้า [provider_character.GetFirstName] เอ่ยขึ้น ขณะที่[provider_character.GetSheHe]เข้ามาในห้องทำงานของข้า "ระยะนี้ข้าได้ติดต่อกับนายกองคาราวานผู้หนึ่ง ซึ่งอาจเป็นประโยชน์ต่อการเดินทางของท่าน [travel_leader_character.GetSheHe|U] ได้เดินทางไปทั่วแดนไกล และมีประสบการณ์ที่เรากำลังมองหาอยู่"\n\nเรากำลังมีปัญหาในการหาคนมาดูแลการเดินทางของข้า บางทีนี่อาจเป็นโอกาสอันดีหรือไม่?"
 destination_events.10.a: "เช่นนั้นจงจ้างนักพเนจรผู้นี้เถิด"
 destination_events.10.a.tt: "[aptitude|E] ของ [travel_leader_character.GetUINamePossessive|U] คือ [travel_leader_character.GetCourtPositionAptitude( GetCourtPositionType( 'travel_leader_court_position' ) )]"
 destination_events.10.b: "[travel_leader_character.GetSheHe|U] ไม่เป็นที่สนพระราชหฤทัยของข้า"

 destination_events.20.t: "การเตรียมตัวสำหรับการเดินทางไกล"
 destination_events.20.desc: ""กระไรนะ? เสบียงส่วนเกินรึ ท่านว่า?" ข้าตอบขณะที่ [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('provider_character'))] ของข้า [provider_character.GetFirstName] กล่าวถึงการค้นพบล่าสุดในห้องเก็บของห้องหนึ่งของข้า\n\n"จริงทีเดียวพ่ะย่ะค่ะ ยังไม่เป็นที่แน่ชัดว่าเหตุใดจึงหายไปจากบัญชีของเรา แต่ก็นับเป็นพรเล็กน้อย มีพระราชประสงค์จะทำสิ่งใดกับมันหรือไม่พ่ะย่ะค่ะ?"\n\nเสบียงส่วนเกินเหล่านี้อาจมีประโยชน์ในการเดินทางครั้งต่อไปของข้า"
 destination_events.20.a: "ด้วยสิ่งเหล่านี้ เราสามารถเดินทางอย่างช้า ๆ และรอบคอบได้"
 destination_events.20.b: "ลองดูว่าเราจะแลกเปลี่ยนมันเป็นม้าได้หรือไม่"
 destination_events.20.c: "ขายเสบียงส่วนเกินทิ้งเสีย"

 destination_excursion_safety_modifier: "เตรียมพร้อมสำหรับการเดินทางไกล: ความปลอดภัย"
 destination_excursion_safety_modifier_desc: "#emp จะหายไปหลังจากถึง [destination|E]#!\nเสบียงถูกจัดเตรียมไว้สำหรับการเดินทางครั้งต่อไป เพื่อให้แน่ใจว่าการเดินทางจะปลอดภัย"

 destination_excursion_speed_modifier: "เตรียมพร้อมสำหรับการเดินทางไกล: ความเร็ว"
 destination_excursion_speed_modifier_desc: "#emp จะหายไปหลังจากถึง [destination|E]#!\nม้าพิเศษถูกเตรียมไว้สำหรับการเดินทางครั้งต่อไป เพื่อให้แน่ใจว่าการเดินทางจะรวดเร็วและมีประสิทธิภาพ"

 destination_events.30.t: "การเดินทางสู่ [journey_province.GetHolding.GetSpecialBuildingType.GetNameNoTooltip]"
 destination_events.30.desc: "หม่อมฉันเพิ่งพบบันทึกการเดินทางฉบับเล็ก ๆ ฉบับหนึ่ง ซึ่งบรรยายการเดินทางของพ่อค้าท้องถิ่นผู้หนึ่งไปยังนคร [journey_province.GetName] มันเล่าอย่างละเอียดว่า [ROOT.Char.GetSheHe] ได้เยี่ยมชม [journey_province.GetHolding.GetSpecialBuildingType.GetName] อย่างไร และสถานที่ท่องเที่ยวท้องถิ่นทั้งหมดที่ควรชมในนครนั้น\n\nบางทีอาจเป็นที่ที่ข้าควรจะมุ่งหน้าไปในครั้งต่อไปที่ข้าออกเดินทางอีกครั้ง..."
 destination_events.30.a: "ฟังดูเป็นสถานที่ที่น่าจดจำยิ่งนัก!"
 destination_events.30.a.tt: "ท่านอาจได้รับค่าประสบการณ์ [wanderer_lifestyle|E] เพิ่มเติมหากท่านไปเยือน [journey_province.GetName] ใน [GetActivityType('activity_journey').GetName]"

 destination_events.30.toast.title: "การเดินทางสู่ [activity.GetCurrentPhase.GetLocation.GetNameNoTooltip]"

 destination_events.40.t: "ภาษา [poi_province.GetCulture.GetLanguage.GetNameNoTooltip]"
 destination_events.40.desc: "ด้วยเหตุผลบางอย่าง ข้าพบว่าตนเองกำลังหวนนึกถึงการเดินทางไปยัง [poi_province.GetName] และโดยเฉพาะอย่างยิ่งภาษา [poi_province.GetCulture.GetLanguage.GetName] ที่ข้าได้ยินบ่อยครั้งเมื่ออยู่ที่นั่น มีบางอย่างที่ #emp [poi_province.Custom('DestinationInspiredLanguageDescriptor')]#! เกี่ยวกับมันที่ข้าไม่อาจลืมเลือนได้\n\nราวกับโชคชะตาลิขิต นักวิชาการชาว [teacher_character.GetCulture.GetName] นามว่า [teacher_character.GetFirstName] ได้มาเยือนราชสำนักของข้า ข้าอาจขอใช้บริการ [teacher_character.GetHerHis] จาก [teacher_character.GetHerHim] และบางที [teacher_character.GetSheHe] อาจสอนภาษา [poi_province.GetCulture.GetLanguage.GetNameNoTooltip] ให้ข้าได้"
 destination_events.40.a: "มันจะ ทำให้การเดินทางครั้งต่อไปน่าเพลิดเพลินยิ่งขึ้นมาก!"
 destination_events.40.b: "การเรียนภาษาอื่นฟังดูเหมือนเป็นงานหนัก..."

 destination_inspired_by_language: "แรงบันดาลใจจากภาษา"
 destination_inspired_by_language_desc: "ตัวละครนี้ได้รับแรงบันดาลใจให้เรียนรู้ภาษาใหม่จากการเดินทางไปยังดินแดนต่างถิ่น"

