 intrigue_temptation.3025.t:0 "ถึง [ROOT.Char.GetTitledFirstNameNoTooltip] ผู้ [ROOT.Char.Custom2('InsultAdjective', SCOPE.sC('favorite'))] และตีสองหน้า,"
 intrigue_temptation.3025.desc:0 "สองสัปดาห์ก่อน ข้าได้รับจดหมายจากท่าน ชื่อบนซองจดหมายเป็นของข้าเอง แต่บทกวีข้างในอุทิศให้ [lower_left_portrait.GetTitledFirstName] ข้าเขียนถึง[lower_left_portrait.GetHerHim] และ[lower_left_portrait.GetSheHe]บอกข้าว่า [lower_left_portrait.GetSheHe] ก็ได้รับบทกวี เช่นกัน – อันเดียวกันเลย ที่จริงแล้ว – แต่มันหมายถึง[lower_right_portrait.GetWomanMan]อีกคน!\n\nนี่เป็นแผนการเล็กๆ ที่น่ารังเกียจและสกปรกที่สุดที่ข้าเคยได้ยินมา อย่าเขียนถึงพวกเราอีกเลย!"
 intrigue_temptation.3025.a:0 "โอ้ นี่มัน... น่าอึดอัดใจ"


